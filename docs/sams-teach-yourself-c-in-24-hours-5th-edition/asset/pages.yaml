  md: '# PostMaster: A Case Study


    back end and the front end of the product is sufficiently narrow so that extend-ing
    the product to other platforms does not require duplication of code.


    # Message Format


    You decide to focus on the message format first, setting aside the issues relating
    to communications and user interface. These will follow after you understand more
    what it is you are dealing with. There is little sense in worrying about how to
    present the information to the user until you understand what kind of information
    it is.


    An examination of the various email formats reveals that they have many things
    in common, despite their various differences. Each message has a point of origin-,
    a destination, and a creation date. Nearly all such messages have a title or subject
    line, and a body that consist of simple text, rich text (with format-ing), graphics,
    and even or fancy additions. Most such services also provide attachments so that
    users can send programs and files.


    You confirm your early decision that you will read each message out of its origi-nal
    format and writing it in PostMaster format. This way you will have to store only
    one record format, and writing to and reading from the disk will be simplified.
    You also decide to separate the header information (sender, recipient, date, and
    so on) from the body of the message. Often the user will want to scan the headers
    without necessarily reading the contents of all the messages. You anticipate that
    a time come users will want to download only the headers from message provider,
    without getting the text at all, but for now you intend that version one of PostMaster
    will always get the full message, although it might not display it to the user.


    # Initial Class Design


    This analysis of the messages leads you to design the Message class. In anticipation
    of extending the product to non-email messages, you derive EmailMessage from the
    abstract base Message. From EmailMessage you derive PostMasterMessage, InterchangeMessage,
    GmailMessage, and so forth.


    Messages are a natural choice for objects in a program handling mail messages,
    but finding all the right objects in a complex system is the greatest challenge
    of object-oriented programming. In some cases, such as with messages, the primary
    objects seem fall out of your understanding of the problem. More however, you
    have to think long and hard about what you are trying to accomplish to find the
    right objects.'
