  md: '# HOUR 17: Using Polymorphism and Derived Classes


    When a virtual function is created in an object, the object must keep track of
    that function. Many compilers build a virtual function table, called a v-table.
    One of these is kept for each type, and each object of that type keeps a virtual
    table pointer (called a vptr or v-pointer), which points to that table.


    Although implementations vary, all compilers must accomplish the same thing, you
    won''t be too wrong with this description.


    Each object''s vptr points to the v-table, in turn, has a pointer to each of the
    virtual member functions. When the Mammal part of the Dog is created, the vptr
    is initialized to the virtual methods for Mammal, as shown in Figure 17.2.


    When the Dog constructor is called and the Dog part of this object is added, the
    vptr is adjusted to the virtual function overrides (if any) in the Dog object,
    as illustrated in Figure 17.3.


    When a pointer to a Mammal is used, the vptr continues to point to the correct
    function, depending on the real type of the object. Thus, when speak() is invoked,
    the correct function is invoked.


    Figure 17.2

    The v-table of a Mammal.


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_260_0.png)


    Figure 17.3

    The v-table of a Dog.


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_260_1.png)


    # You Can''t Get There from Here


    If the Dog object had a member function wagTail() that was not in the Mammal class,
    you could not use the pointer to Mammal to access that function (unless you cast
    it to be a pointer to Dog). Because wagTail() is not a virtual function and is
    not in a Mammal object, you can''t get there without either a Dog object or a
    Dog pointer.


