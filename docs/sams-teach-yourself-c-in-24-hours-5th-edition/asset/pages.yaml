    # Using try and catch Blocks


    Figuring out where to put try blocks is the hardest part of using exceptions;
    it is not always obvious which actions might raise an exception. The next question
    is where to catch the exception. It might be that you''ll want to throw all memory
    exceptions where the memory is allocated, or you''ll want to catch the exceptions
    high in the program where you deal with the user interface.


    When trying to determine try block locations, look to where you allocate memory
    or use resources. Other things to look for are out-of-bounds errors and illegal
    input.


    # Catching Exceptions


    Catching exceptions works as follows: When an exception is thrown, the call stack
    is examined. The call stack is the list of functions created when one part of
    the program invokes another function.


    The call stack tracks the execution path. If main() calls the function Animal::getFavoriteFood(),
    and getFavoriteFood() calls Animal::lookupPreferences(), which in turn calls fstream::operator>>(),
    all these are on the call stack. A recursive function might be on the call stack
    many times.'
