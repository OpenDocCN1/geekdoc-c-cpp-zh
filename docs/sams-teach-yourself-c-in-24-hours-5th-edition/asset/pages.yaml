  md: '# Q&A


    +   Q. What is the difference between a text editor and a word processor?


    +   A. A text editor produces files with plain text in them—letters, numbers,
    spaces, and punctuation. There are no formatting commands for things as bold or
    italic text, justified lines, special margins, and so forth. You don''t need any
    of that formatting in C++ source code, and if you use a word processor it can
    save things in the file that the compiler won''t understand. If you have trouble
    getting the Motto program to compile and you''re using a word processor, try a
    simpler editor as Notepad on Windows to see whether that solves the problem.


    +   Q. My compiler is a built-in editor. Is that the right thing to use?


    +   A. It sounds like you''re using an integrated development environment (IDE),
    a graphical tool that speeds the process of writing, debugging, and testing programs.
    Sophisticated compilers like Microsoft Visual C++ include a full IDE, enabling
    the programmer to access help files, edit and compile the code in place, and resolve
    link errors without ever leaving the environment. These are a much better way
    to write C++ programs, but only if you know how to use the IDE already. Trying
    to learn C++ as you learn the ins and outs of an IDE at the same time is difficult.
    That''s one reason this book prefers GCC, which is simple, powerful, and free.


    +   Q. Can I ignore warnings from my compiler?


    +   A. Absolutely not. C++ uses the compiler to warn when you''re doing something
    as a programmer might not intend. The best approach is to heed those warnings
    and do what is required to make them away. Getting an error means that the compiler
    cannot figure out how to convert what you wrote into machine language. A warning
    means that it can convert it but maybe not in the way you expected.


    +   Q. Do you only answer questions related to C++?


    +   A. Nope. Ask anything.


    +   Q. Groovy. Why doesn''t anyone sell grape-flavored ice cream?


    +   A. Unlike other fruit flavors incorporated into ice cream, grapes get almost
    all their flavor from their skins rather than the interior of the fruit. Without
    the skins, they just taste sweet in an entirely nondistinct and generic way, so
    you wouldn''t know you were eating grape ice cream unless somebody told you.'
