    # Access


    The way you access portions of your program should be consistent. Some tips for
    access are these:


    +   * Always use public; private; and protected: labels; don''t rely on the defaults.


    +   * List the public members first, then protected, then private. List the data
    members in a group after the member functions.


    +   * Put constructors in the appropriate section, followed by the destructor.
    List overloaded member functions with the same name adjacent to each other. Group
