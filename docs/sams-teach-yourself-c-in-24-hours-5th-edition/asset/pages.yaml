    # Summary


    During this hour, you learned how to achieve more control over the creation and
    destruction of objects in C++.


    Constructors, like functions, can be overloaded. The number and parameter to the
    constructor enables the compiler to determine which one should be called by users
    of the class.


    A constructor may have default values just like member functions and ordinary
    functions.


    When an object is copied, all member variables are copied by the default copy-constructor.
    This creates problems when member variables are pointers to objects on the heap.
    Both the original object and the copy point to the same object. When one object
    gets out of scope and is destroyed, the other still has an active pointer to that
    object. Any attempt to use pointer results in a crash of the program.


    This problem can be fixed by writing your own copy constructor for a class. The
    constructor takes one parameter, the original object that will be copied. In the
    constructor, care be taken so that the pointer uses heap memory.


    # Q&A


    +   Q. Why would you ever use default values when you can overload a function?


    +   A. Because it is easier to maintain one function than two and easier to understand
    a function with default parameters than to study the body of two functions. Furthermore,
    updating one of the functions and neglecting to update the second is a common
    source of bugs.'
