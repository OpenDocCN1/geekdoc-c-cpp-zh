    There is another rule, the 80/20 rule, which states: The first 20% of your program
    will be 80% of your time to code; the remaining 80% of your program will take
    the other 80% of your time!


    The real rule is that 80% of the time is required to 20% of the work—or that 80%
    of a company''s profit come from 20% of the customers. This rule has wide application.


    # Designing the PostMasterMessage Class


    In keeping with these considerations, you decide to focus on the PostMasterMessage.
    This is the class that is most directly under your control.


    As part of its interface, PostMasterMessage needs to talk with other types of
    messages, of course. You hope to be able to work closely with the other message
    providers, and to get their format specifications, but for now you can make some
    guesses just by observing what is sent to your computer or how you use their services.


    In any case, you know that every PostMasterMessage will have a sender, recipient,
    a date, and a subject, as well as the body of the message and attached files.
    This tells you you will need accessors for each of these attributes, as well as
    member functions to report on the size of the attached files, the size of the
    messages, and so forth.


    Some of the services to which you will connect use rich text—that is, text with
    formatting instructions to set the character size, and attributes such as bold
    and italic. It services do not support these attributes, but those that do might
    not use their own proprietary scheme for managing rich text. Your class needs
    conversion functions for turning rich text into plain ASCII, and perhaps for turning
    other formats into PostMaster formats.


