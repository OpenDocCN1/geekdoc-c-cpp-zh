  md: '# Assignment Operator


    An expression consists of an assignment operator, an operand to its left called
    an l-value, and an operand to its right called an r-value. In the expression grade
    = 95, the l-value is grade, and the r-value is 95.


    Constants are r-values but cannot be l-values. The expression 95 = grade is not
    permitted in C++ because the constant 95 cannot be assigned a new value.


    The primary reason to learn the terms l-value and r-value is because they appear
    in compiler error messages.


    # Mathematical Operators


    There are five mathematical operators: addition (+), subtraction (-), multiplication
    (*), division (/), and modulus (%). C++, like C, does not have an exponentiation
    operator to raise a value to a powered value. There is a function to perform the
    task.


    Addition, subtraction, and multiplication act as you''d expect, but division is
    more complex.


    Integer division differs from ordinary division. When you divide 21 by 4, the
    result is a real number that has a fraction or decimal value. By contrast, integer
    division produces only integers, so the remainder is dropped. The value returned
    by 21 / 4 is 5.


    The modulus operator % returns the remainder value of integer division, so 21
    % 4 equals 1. The integer division 21 / 4 is 5, leaving a remainder of 1.


    > When describing an expression using the modulus operator, it is called modulo,
    so 21 % 4 is "21. modulus 4.\ Modulo is the operation performed by the modulus
    operator and the result is called the modulus.


    Finding the modulus can be useful in programming. If you want to display a statement
    every 10th time that a task is performed, the expression setCount % 10 can watch
    for. The modulus ranges value from 0 to 10. Every time it equals 0, the count
    of tasks is a multiple of 10.


    Floating-point division is comparable to ordinary division. The expression 21
    / 4.0 equals 5.25.


    C++ decides which division to perform based on the type of the operands. If at
    least one operand is a floating-point variable or literal, the division is floating
    point. Otherwise, it is integer division.'
