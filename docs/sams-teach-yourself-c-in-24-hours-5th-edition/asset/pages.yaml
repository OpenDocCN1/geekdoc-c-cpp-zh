  md: '# HOUR 8


    # Creating Basic Classes


    What You''ll Learn in This Hour:


    +   - What types are

    - What classes and objects are

    - How to define a new class and create objects of that class


    # What Is a Type?


    One of the things that distinguishes humans is our ability to categorize. We don''t
    see hundreds of shapes in nature; we see animals, rocks, insects, and trees. We
    don''t just see animals; we see bears, foxes, raccoons, squasches, and so forth.
    We divide things into various classes that tell us what type of thing they are.


    A squasatch is a type of mammal. A mammal is a type of animal. An animal is a
    type of living thing.


    In C++, a type is an object with data and a set of abilities. You''ve worked with
    built-in types such as int, long, and float numbers. You also can create your
    own types, as you discover this hour.


    Computer programs are written to solve real-world problems, such as keeping track
    of employee paychecks or scheduling the games in a child''s soccer league. One
    of the best ways to write a program to accomplish large, complex tasks is to create
    representations of the objects that work together to perform the task.


    So, if you''re creating a league schedule, you could have to represent each team
    in the league, each day that games can be played and each game on the schedule.
    The closer these objects correspond to reality, the easier it is to write the
    program.'
