  md: '# Defining an Object


    An object is created from a class by specifying its class and a variable name,
    just as you''ve done with built-in types in the preceding 7 hours. For example:

    Tricycle wichita;


    This statement creates a Tricycle object named wichita. The Tricycle class is
    used as a template for the object. The object will have all member variables and
    member functions defined for the class.


    C++ differentiates between the class Tricycle, which is the concept of a tricycle,
    and each individual Tricycle object.


    An object is just an individual instance of a class. When you create an object,
    you are said to “instantiate” it from the class.


    > Because C++ is case sensitive, all class names should follow the same convention
    to minimize errors. Instead of having to remember whether a class is called Tricycle,
    tricycle, or TRICYCLE, if you always capitalize the first letter of a class name
    you will know it is. Some programmers prefix every class name with a particular
    lowercase letter (for example, cTricycle or cSkateboard). The convention used
    in this book is initial capitalization, as in Tricycle and Sasquatch. Member variables
    and functions also should follow the same naming rules. This book begins both
    with lowercase letters, as in speed and pedal().


    # Accessing Class Members


    After you create an object, use the dot operator (.) to access the member functions
    and variables of that object. As you might recall, the Tricycle class has a member
    variable called wichita. To set this variable, the dot operator:


    ```

    Tricycle wichita.speed = 6;

    ```


    After the member function pedal() function has been defined, the dot operator
    is used to call it:


    ```

    wichita.pedal();

    ```'
