  md: '# Understanding Function Headers and Prototypes


    The swap () function that takes references is easier to use and the code is easier
    to read. How does the calling function know if the values are passed by reference
    or by value? As a user of swap(), the programmer must ensure that swap() in fact
    change the parameters.


    This is another use for the function prototype. By examining the parameters declared
    in the prototype, which is typically in a header file with all the other types,
    the programmer knows that the values passed into swap() are referred by reference
    and thus will be swapped properly.


    If swap() had been a member function of a class, the class declaration, also available
    in a header file, would have supplied this information.


    In C++, users of classes (any other class using the class) using the header file
    to tell all that is needed; it acts as the interface to the class or function.
    The actual implementation is hidden from the client. This enables the programmer
    to focus on the problem at hand and to use the class or function without concern
    for how it is implemented.


