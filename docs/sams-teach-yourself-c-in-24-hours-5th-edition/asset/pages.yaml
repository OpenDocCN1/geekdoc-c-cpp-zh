    # Creating and Deleting Objects


    There are two ways to define built-in types such as integers. One way is to define
    the variable and then assign a value to it later in the program:


    ```

    int weight;

    weight = 7;

    ```


    Alternatively, you can define the integer and immediately initialize it:


    ```

    int weight = 7;

    ```


    Initialization combines the definition of the variable with its initial assignment.
    Nothing stops you from changing that value later, but initialization ensures that
    the variable always has a value.'
