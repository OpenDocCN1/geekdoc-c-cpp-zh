    3. In the List program (Listing 23.1), how does the compiler know when to destruct
    the objects contained within the linked list?


    +   A. It occurs automatically.


    +   B. The linked lists fall out of scope.


    +   C. The linked list must delete them.


    # Answers


    +   1. The compiler knows because the prefix template <class T> is used.


    +   2. The T will appear in the class wherever a specific data type would have
    appeared in a normal class.


    +   3. When the main function exits, the linked lists fall out of scope, and the
    destructor for that class is called. Because the individual (contained) objects
    are dynamically allocated, it is up to the linked list to delete them.


