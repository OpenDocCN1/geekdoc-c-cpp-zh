  md: '# HOUR 22: Employing Object-Oriented Analysis and Design


    Don''t despair. Most designs are not perfect the first time. A good starting point
    is to describe the problem out loud. Make a list of all the nouns and verbs you
    use when describing the project. The nouns are good candidates for objects. The
    verbs might be the functions of those objects (or they might be objects in their
    own right). This is not a foolproof technique, but it is a good technique to use
    when getting started on your design.


    That was the easy part. Now the question arises, “Should the message header be
    a separate class from the body?” If so, do you need parallel hierarchies—well
    as NewsGroupBody and NewsGroupHeader as EmailBody and EmailHeader?


    Parallel hierarchies are often a warning of bad design. It is a common error in
    object-oriented design to have a set of objects in one hierarchy and a matching
    set of manager objects in another. The burden of keeping these hierarchies up-to-date
    and in sync with each other becoming overwhelming: a classic maintenance nightmare.


    There are no hard-and-fast rules, course, and at times parallel hierarchies are
    the most efficient way to solve a particular problem. Nonetheless, if you see
    your design moving in this direction, you should rethink the problem; a more elegant
    solution may be available.


    When the messages arrive from the email provider, they will not necessarily be
    separated into header and body; many will be one large stream of data that your
    program will have to disentangle. Perhaps your hierarchy should reflect that idea
    directly.


    Further reflection on the tasks at hand leads you to list the properties of your
    messages, with an eye introducing capabilities and data storage at the right level
    of abstraction. Listing properties of your objects is a good way to find the data
    members, as well as to shake out objects you might need.


    Mail messages will need to be stored, as the user’s preferences, phone numbers,
    and so forth. Clearly needs to be high up in the hierarchy. Should the mail messages
    necessarily share a base class with the preferences?


    # Rooted Hierarchies Versus Nonrooted


    There are two overall approaches to inheritance hierarchies: You can have all,
    or nearly all, of your classes descend from a common root class, or you can have
    more than one inheritance hierarchy. An advantage of a common root class is that
    you often avoid multiple inheritance; a disadvantage is that many times implementation
    will percolate up into the base class.'
  merge: -1
  pgno: 352
- img_proc: true
  md: 'A set of classes is rooted if all share a common ancestor. Nonrooted hierarchies
    do not share a common base class.


    Because you know that your product will be developed on many platforms, and because
    multiple inheritance is complex and not necessarily well supported by all compilers
    on all platforms, your first decision is to use a rooted hierarchy and single
    inheritance. Decide to identify places where multiple inheritance might be used
    in the future. You can then design so that breaking apart the hierarchy and adding
    multiple inheritance at a later time not be traumatic to your entire design.


    You decide to prefix the name of all your internal classes with the letter p,
    so that you can easily and quickly tell which classes are yours and which from
    other libraries.


    Your root class will be pobject. Nearly every class you create will descend from
    this object. pobject itself will be kept fairly simple; only the data that absolutely
    every item will appear in class


    If you want a rooted hierarchy, you to give the root class a fairly generic name
    (like pobject) and few capabilities. The point of a root object is to create collections
    of all its descendants and refer to them as pobject. The trade-off is that rooted
    hierarchies often permeate interface into the root class.


    The next likewise candidates for top-of-hierarchy status are pstored and pwired.
    pstored objects are saved to disk at various times (for example, when the program
    is not in use), and pwired objects are sent over the modem or network. Because
    nearly all objects will need to be stored to disk, it makes sense to push this
    functionality up in the hierarchy. Because all the objects that are sent over
    the modem must sense to be stored, but not all stored objects must be sent over
    the wire, it makes sense to derive pwired from pstored.


    Each derived class acquires all the knowledge (data) and functionality (member
    functions) of its base class, and each should have one discrete additional capability.
    Thus pwired might add additional functions, but all these functions can facilitate
    transfer of data over a modem.


    It is possible that all wired objects are stored, or that all stored objects are
    wired, or that neither of statements is true. If only some wired objects are stored,
    and only some stored objects are wired, you will be forced to use multiple inheritance
    or hang around the problem. A potential hazard for such a situation would be to
    inherit, Wired from Stored, and then to make the stored functions do nothing or
    return an error for those objects that are sent via modem but are never stored.'
  merge: -1
