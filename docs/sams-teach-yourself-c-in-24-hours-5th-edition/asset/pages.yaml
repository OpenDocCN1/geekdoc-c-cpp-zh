  md: '# HOUR 5: Calling Functions


    Contrary to what you might expect, the swap() function does not swap the variable
    values so that x equals 13 and y equals 4. The reason is that the parameters received
    by the swap() function are local variables within that function. Changing their
    values does not affect the variables with the same name that were created before
    swap() was called.


    Changes to function parameters do not affect the variables in the calling function.
    This is called passing by value because values are passed to the function and
    a local copy is made of each parameter. These local copies are created just as
    any other variables.


    The swap() function swaps the local variables received by the function as parameters,
    leaving the variables used to call swap() unchanged.


    Because variables are passed by value to functions, the swap() function does not
    work. Beginning in Hour 10, "Creating Pointers," you''ll learn several alternatives
    to passing by value that enables functions to change variables passed them.


