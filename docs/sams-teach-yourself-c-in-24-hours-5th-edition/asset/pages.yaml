  md: '# Logical Operators


    If x and y both equal 5, the expression is true. Either x or y does not equal
    5, the expression is false. Both sides must be true for the entire expression
    to be true.


    # OR Operator


    The OR operator evaluates two expressions and if either one is true, the expression
    is true:


    ```

    if ((x == 5) || (y == 5))

    ```


    If either x or y equals 5 or both equal 5, the expression is true. In fact, if
    x equals 5, the compiler never checks y.


    # NOT Operator


    A NOT statement reverses a normal expression, returning true if the expression
    is false and false if the expression is true. Here''s a statement that uses:


    ```

    if (!(grade < 70))

    ```


    This expression is true if grade is 70 or greater and false otherwise. The Grader
    and NewGrade programs use the expression grade >= 70 to check for passing grades.
    This NOT expression accomplishes the same thing by looking for grades that are
    less than 70.


    # Relational Precedence


    Relational operators and logical operators, like other operators, return a value
    of true or false and have a precedence order that determines which relations are
    evaluated first. This fact is important when determining the value of the statement
    such as the following:


