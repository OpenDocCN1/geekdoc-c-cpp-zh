  md: 'This friendship cannot be transferred and is not inherited. It is also commutative.
    Assigning Class1 to a friend of Class2 does not make Class2 a friend of Class1.


    Declarations of friends classes should be used with extreme caution. If two classes
    are inextricably entwined, and one must frequently access data in the other, there
    might be good reason to use this declaration. It is often as easy to use public
    accessors instead. Allowing you to change one class without having to reptile
    the other.


    At times, you will want to grant the friend level of access to an entire class,
    but only to one or two functions of that class. You can do this by declaring the
    member functions of the other class to be friends, instead of declaring the entire
    class to be a friend. In fact, you can declare any function, whether or not it
    is a member function of another class, to be a friend function.


    # Pointers to Functions


    Just as an array name is a constant pointer to the first element of the array,
    a function name is a constant pointer to the function. It is possible to declare
    a pointer variable that points to a function, and to invoke the function by using
    that pointer. This can prove very useful; it allows you to create programs that
    decide which functions to invoke based user input.


    The only tricky part about function pointers is understanding the type of the
    object being pointed to. A pointer to int points to an integer variable, and a
    pointer to a function must point to a function of the appropriate type and signature.


    In the declaration


    ```

    long (*funcPtr)(int);

    ```


    The funcPtr variable is declared to be a pointer that points to a function that
    takes an integer and returns a long. The parentheses around *funcPtr are necessary
    because the parentheses around int have higher precedence than the indirect operator
    (*). Without the first parenthesis, this would declare a function that takes an
    integer and returns a pointer to long.


    Examine these two declarations:


    ```

    long* func(int);

    long (*funcPtr)(int);

    ```


    The first, func(), is a function taking an integer and returning a pointer to
    a variable of type long. The second, funcPtr, is a pointer to a function taking
    an integer and returning a variable of type long.'
