  md: '# Quiz


    +   1. What is the purpose of a try block?


    +   A. To run code that might cause an exception


    +   B. To throw exceptions


    +   C. To ignore errors


    +   2. What is the difference between a throw and a try?


    +   A. try might not cause an exception.


    +   B. There''s no difference.


    +   C. try always causes an exception.


    +   3. How do you declare a default catch block?


    +   A. catch(everything)


    +   B. catch(default)


    +   C. catch(...)


    # Answers


    +   1. The try block contains a set of statements in which the exceptions for
    the statements will be handled in the attached catch block.


    +   2. A try block contains code that might cause an exception to be thrown. The
    throw statement automatically throws an exception.


    +   3. C To define a catch block that will catch anything not already listed in
    another catch block (like the default label in a switch statement), you include
    three periods inside the argument list instead of listing an exception name: catch
    (...).


