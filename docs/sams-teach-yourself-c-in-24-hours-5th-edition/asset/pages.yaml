  md: '# Declaring and Defining Functions


    Before you can write the code for a function, you must declare it.


    A function declaration tells the compiler the function''s name, the type of data
    the function produces, and the types of any parameters received by the function.
    A function''s declaration, which is also called its *prototype*, contains no code.


    The declaration tells the compiler how the function works. The function prototype
    is a single statement, which ends with a semicolon.


    The argument is a list of each parameter and its type, separated by commas.


    Here''s a declaration for a function that determines a rectangle''s area using
    length and width parameters:


    ```

    int findArea(int length, int width);

    ```


    The three parts of the declaration are the following:


    +   - The return type, int


    +   - The name, findArea


    +   - The type and name of two parameters, an int named length and an int named
    width


    The function prototype must match the three elements of the function or the program.
    The only thing that doesn''t need to match is the name of the parameters. A function
    declaration doesn''t need to name parameters at all. The previous declaration
    could be rewritten as follows:


    ```

    int findArea(int, int);

    ```


    Although this is permitted, it makes the function prototype less clear if parameters
    names had been used.


    The function''s name is a short identifier that describes the task it performs.
    Because the name cannot contain spaces, a common convention is to capitalize each
    word except for the first. That''s why the A is capitalized in the name findArea.


    All functions are structured as a program''s main() function. The statements in
    the function are enclosed within an opening { brace and a closing } brace. If
    the function returns a value, there should be at least one return statement that
    returns a literal or variable of the proper return type.'
