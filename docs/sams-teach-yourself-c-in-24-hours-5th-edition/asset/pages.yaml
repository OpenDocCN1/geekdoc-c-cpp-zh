  md: '# PostMaster: A Case Study


    The root class, pObject, will only have those data and functions that are common
    to everything on your system. Perhaps every object should have a unique identification
    number. You could create pID (PostMaster ID) and make it a member of pObject;
    but first you must ask yourself, "Does any object that is not stored and not wired
    such a number?" That raises this question: Are there any objects that are not
    stored, but are part of this hierarchy?


    If there are no objects, you might want to consider collapsing pObject and pStored
    into one class; after, if all objects are stored, what is the point of the differentiation?
    Thinking through this, you realize that there might be some objects, such as address
    objects, that would be beneficial to derive from pObject but that will never be
    stored on their own; if they are stored it will be part of some other object.


    This tells you, for now, having a separate pObject class would be useful. You
    can imagine that there will be an address book that will be a collection of pAddress
    objects, and although no pAddress will ever be stored on its own, there would
    utilize having each one its own unique identification number. You tentatively
    assign pID to pObject; that means pObject, at a minimum, will look like this:


    ```

    class pObject{

    public:

    pObject();

    ~pObject();

    pID getID()const;

    void SetID();

    private:

    pID itsID;

    }

    ```


    Note a number of things about this class declaration. First, this class is not
    declared to derive from any other; this is your root class. Second, there is no
    attempt to show implementation, for member functions such as getID() that are
    likely to have inline implementation when you are done.


    Third, const member functions are already identified; this is part of the interface,
    not the implementation. Finally, a new type is introduced: pID. Defining pID as
    a type rather than using, for example, unsigned long, puts greater flexibility
    into your design.


    If it turns out you don''t need an unsigned long, or that an unsigned long is
    not sufficiently large, you can modify pID. That modification will affect every
    place pID is used, and you won''t have to track and edit every file with a pID
    in it.


    For now, you use typedef to declare pID to be ULONG which, in turn, declare to
    be unsigned long. This raises the question: Where do these declarations go?'
