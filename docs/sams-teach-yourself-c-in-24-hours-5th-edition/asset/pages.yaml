    # Adding More Classes


    When your sensors report an alarm condition, they want to provide a lot of information
    to the object that phones the police and to the log. It might be well that you
    want to create a Condition class, whose constructor takes a number of measurements.
    Depending on the complexity of the measurements, these too might be objects, or
    they might be simple scalar values as integers.


    It is possible that Condition objects are passed to the central alarm object,
    or that Condition objects are subclassed into Alarm objects, which themselves
    know how to take emergency action. Perhaps there is no central object; instead,
    there might be sensors that know how to create Condition objects. Some Condition
    objects would know how to log themselves; others know how to contact the police.


    A well-designed, event-driven system need have a central controller. One can imagine
    the sensors independently receiving and sending message objects to one another,
    setting parameters, taking readings, monitoring the house. When a fault is detected,
    an Alarm object logs the problem—such as sending a message to the log—and takes
    the appropriate action.


    # Event Loops


    To simulate an event-driven system, your program needs to create an event loop.
    An event loop is typically an infinite loop while (true) that gets messages from
    the operating system (mouse clicks, keyboard presses, and so on) and patches them
    by one, returning to the loop until an exit condition is satisfied. The SimpleEvent
