    # Why to Use Pointers?


    So far, you''ve seen step-by-step details of assigning a variable''s address to
    a pointer. In practice, though you would never do this. After all, why with a
    pointer when you already have a variable with access to that value? The only reason
    for this kind of pointer manipulation of a variable is to demonstrate how pointers
    work.


    Now that you are comfortable with the syntax of pointers, you can put them to
    better use. Pointers are employed most often for three tasks:


    +   - Managing data on the heap

    - Accessing class member data and functions

    - Passing variables by reference to functions


    The rest of this hour focuses on managing data on the heap and accessing class
    member data and functions. In Hour 12, “Creating References,” you learn passing
    variables by reference.


