  md: '# HOUR 4


    # Using Expressions, Statements, and Operators


    What You''ll Learn in This Hour:


    +   - How to write statements

    - How to create expressions

    - How to run code if a condition is met

    - What the different operators accomplish


    # Statements


    All C++ programs are made up of statements, which are commands that end with a
    semicolon. Each statement takes up one line by convention, but this is not a requirement—multiple
    statements can be put on a line as long as each ends with a semicolon. A statement
    controls the program''s sequence of execution, evaluates an expression, or even
    do nothing (the null statement). A common statement is an assignment:


    ```

    x = a + b;

    ```


    This statement assigns the variable x to equal the sum of a + b. The assignment
    operator = assigns the value on the right side of the operator to a variable on
    the left side. If a equals 4 and b equals 13, x will equal 17 after the statement
    is executed.


    # Whitespace


    In the source code of a C++ program, any spaces, tabs, and newline characters
    are called whitespace. The compiler generally ignores whitespace, which serves
    the purpose of making the code more readable to programmers.'
