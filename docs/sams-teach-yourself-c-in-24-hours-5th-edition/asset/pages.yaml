  md: '# # Introduction


    Congratulations! By reading this sentence, you are already 20 seconds closer to
    learning C++, one of the most important programming languages in the world.


    If you continue for another 23 hours, 59 minutes, and 40 seconds, you will master
    the fundamentals of the C++ programming language. Twenty-four 1-hour lessons cover
    the fundamentals, such as managing I/O, creating loops and arrays, object-oriented
    programming templates, and creating C++ programs.


    All of this has been organized into well-structured, easy-to-follow lessons. There
    are working projects that you create—complete with output and an analysis of the
    code—to illustrate the topics of the hour. Syntax examples are clearly marked
    for handy reference.


    To help you become more proficient, each hour ends with a set of common questions
    and answers.


    # # Who Should Read This Book?


    You don''t need any previous experience in programming to learn C++ with this
    book.


    This book starts with the basics and teaches you both the language and the concepts
    involved with programming C++. Whether you are just beginning or already have
    some experience programming, you will find that this book makes learning C++ fast
    and easy.


    # # Should I Learn C++?


    No, you don''t need to learn C. C++ is a much more powerful and versatile language
    that was created by Bjarne Stroustrup as a successor to C. Learning C++ first
    can lead you into some programming habits that are more error-prone than what
    you''ll do in C++. This book does not assume that readers are familiar with C.'
