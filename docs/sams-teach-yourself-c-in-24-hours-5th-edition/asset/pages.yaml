    # Linked Lists as Objects


    In object-oriented programming, each individual object is given a narrow and well-defined
    set of responsibilities. The linked list is responsible for maintaining the head
    node. The HeadNode immediately passes new data on whatever it points to, without
    regard for what that might be.


    The TailNode, whenever it is handed data, creates a new node and inserts it. It
    knows only one thing: if this comes to me, it gets inserted right before me.


    Internal nodes are marginally more complicated; they ask their existing object
    to compare itself with the new node. Depending on the result, either they insert
    or they just pass along.


    Note that the InternalNode has no idea how to do the comparison; that is properly
    to the left object. All the InternalNode knows is to ask the objects to compare
    themselves and use one of three possible answers. Given one answer, it inserts;
    otherwise, it just passes along, not knowing or caring where it will end.


    So who''s in charge? In a well-designed object-oriented program, no one is charge.
    Each object does its own little job, and the effect is a well-running machine.


    The beauty of a linked list is that you can put any data type you would like in
    the Data of this class. In this case, it contains an integer. It could contain
    multiple built-in data types or even other objects (including linked lists).


    The use of dynamic memory allows linked lists to use very little memory when small,
    and lots of memory if they grow large. The important thing is that they only use'
