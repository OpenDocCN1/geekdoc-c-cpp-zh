  md: 'Indirection accesses the value at the address held by a pointer. The pointer
    provides an indirect way to get the value held at that address.


    # The Indirection Operator, or Using Pointers Indirectly


    The indirection operator * is also called the dereference operator. When a pointer
    is dereferenced, the value at the address stored by the pointer is retrieved.
    Consider the following statements when assigning variable''s value to:


    ```

    unsigned short int howOld = 50;

    unsigned short int yourAge;

    yourAge = howOld;

    ```


    A pointer provides indirect access to the value of whose address it stores. To
    assign the value of howOld to the new variable yourAge by way of the pointer pAge,
    you write the following:


    ```

    unsigned short int howOld = 50;              // create the variable howOld

    unsigned short int *pAge = &howOld;     // pAge points to the address of howOld

    unsigned short int yourAge;             // create another variable

    yourAge = *pAge;                        // assign value to pAge (50) to yourAge

    ```


    The indirection operator * in front of the variable pAge means "the value stored."
    This assignment takes the value stored at the address in pAge and assigns it to
    yourAge. Another way of thinking about it is "don''t affect the pointer, affect
    the item stored at the pointer."


    The indirection operator * is used in two distinct ways with pointers: declaration
    and difference. When a pointer is declared, the star indicates indicates that
    it is a pointer, not a normal variable. For example:

    unsigned short *pAge = NULL; // make a pointer to an unsigned short


    When the pointer is dereferenced, the indirection operator indicates that the
    value at the memory location stored in the pointer is accessed, rather than the
    address itself:

    *pAge = 5; // assign 5 to the value at pAge


    Note that this same character (*) is used as the multiplication operator. The
    compiler knows which operator to call based on context.


    We deal with indirection in our daily lives all the time. If you want to call
    the local pizza shop to order dinner but do not know their number, you go to the
    phone book to look it up. That information source is not the pizza shop, but it
    contains the "address" (phone number) of the pizza shop. When you do, you perform
    indirection!'
