    # Overloading Versus Overriding


    The overloading and overriding are similar and do similar things in C++. When
    you overload a member function, you create one function with the same name but
    with different signatures. When you override a member function, you create a function
    in a derived class with the same name as a function in the base class and with
    the same signature.


    # Hiding the Base Class Method


    In the Mamm5 program, the Dog class''s member function speak() hides the class''s
    function. This is what is wanted, but it can have unexpected results. If Mammal
    has a move() method that is overloaded, and Dog overrides that function, the Dog
    method hides all the Mammal functions with that name.


    If Mammal overrides move() as three functions—one that takes no parameters, one
    that takes an integer, and one that takes an integer and a direction—and Dog overrides
    the move() method, which takes no parameters, it will not be easy to access the
    other methods using a Dog object. The Mamm6 program in Listing 16.6 illustrates
    this problem.


