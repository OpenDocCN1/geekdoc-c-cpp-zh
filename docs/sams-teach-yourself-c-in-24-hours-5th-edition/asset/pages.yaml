- img_proc: true
  md: 'The exception is passed up the stack to each enclosing block. As the stack
    is unwound, the destructors for local objects on the stack are invoked and the
    objects are destroyed.


    After each try block are one or more catch statements. If the exception matches
    one of the catch statements, it is considered to be handled by that statement
    execute. If it doesn''t match any, the unwinding of the stack continues.


    If the exception reaches all the way to the beginning of the program (main())
    and is still caught, the function terminate() is called, which in turn abort()
    to abort the program.


    It is important to note that the exception unwinding of the stack is a one-way
    street. As it progresses, the stack is unwound, and objects on the stack are destroyed.
    There is no going back: After the exception is handled, the program continues
    after the try block of the catch statement that handled the exception.


    In the exception program, execution continues on line 104, the first line after
    the try block of the catch statement that handled the XBoundary exception. When
    an exception is raised, program flow continues after the catch block, not after
    the point where the exception was thrown.


    # More Than One Catch


    It is possible for more than one condition to cause an exception. In this case,
    the catch statements can be lined up one after another, much like the conditions
    in a switch statement. The equivalent to the default statement is the “catch everything”
    statement, indicated by catch(...).


    > Be careful about putting in two catch statements where one is a base class and
    the other is a derived class that is more specific. The code will actually do
    the steps of both catch statements; sometimes you want that behavior and sometimes
    you don''t, but you should be aware of this.'
