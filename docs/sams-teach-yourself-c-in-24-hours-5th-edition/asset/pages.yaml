    ```


    This declares pAge to be a pointer to int. That is, pAge is declared to hold the
    address of an int.


    Pointers can have any name that is legal for other variables. This book follows
    the convention of naming all pointers with an initial p and a second letter capitalized,
    as in pAge.


    Note that pAge is a variable like any other variable. When you declare an integer
    variable, it is set up to hold an integer. When you declare a pointer variable
    pAge, it is set up to hold an address. A pointer is just special type of variable
    that holds the address of an object in memory; in this case, pAge holds the address
    of an integer variable.


    You declare the type of variable you want the pointer to point to. This tells
    the compiler how to treat the memory at the location pointer points to. The pointer
    itself contains an address.


