    A number of accessors are anticipated for reading and setting the various member
    data, as well as operators for turning all or part of a message into other message
    formats. You anticipate storing these messages to disk and reading them from the
    wire, where accessors are noted for those purposes well.


    # Programming in Large Groups


    Even this preliminary architecture is enough to indicate how the various development
    groups ought to proceed. The Communications group can go ahead and start work
    on the communications back end, negotiating a narrow interface with the Message-Format
    group.


    The Message Format group will probably lay out the general interface to the Message
    class, as began earlier, and then turn their attention to the question of how
    to write data to disk and read it back. After this interface is well understood,
    the team will be in a good position to negotiate the interface to the communications
    layer.


    The message editors will be tempted to create editors with an intimate knowledge
    of the internals of the message class, but this would be a bad design mistake.
    They too must negotiate a narrow interface to the message class; message editor
    objects should know very little about the internal structure of messages.


    # Ongoing Design Considerations


    As the project continues, you will repeatedly confront this basic design issue:
    In which class should you put a given set of functionality (or information)? Should
    the message class have this function, or should it address the class? Should the
    editor store this information, or should the message store it itself?


    Your classes should operate on a need-to-know basis, like secret agents. They
    shouldn''t share any more knowledge than is absolutely necessary.


    As you progress with your program, you will face hundreds of design issues. They
    will range from the more global questions, “What do we want to do this?” to the
    more specific, “How do we make this work?


    Although the details of your implementation won''t be finalized until you ship
    the code, and some of the interfaces will shift and change as you work, you must
    ensure that your design is well understood early in the process. It is imperative
    that you know what you are trying to build before you write the code. The single
    most frequent cause of software dying on the vine must be that there is not sufficient
    agreement, early enough in the process, about what is being built.'
