  md: 'At the same time, when you have a collection of Mammal objects such as a Farm
    with Dog, Cat, Horse, and Cow objects, you want the farm to be able to tell each
    of these objects to speak() without knowing or caring about the details of how
    they implement the speak() method. When you treat these objects as if they are
    all mammals by calling the Mammal.speak() method, you are treating them polymorphically.


    > Polymorphism is an unusual word that means the ability to take many forms. It
    comes from the roots poly, which means many, and morph, which means form. You
    are dealing with Mammal in its many forms.


    You can use polymorphism to declare a pointer to Mammal and assign it to the address
    of a Dog object you create on the heap. Because a Dog “is a” Mammal, the following
    is perfectly legal:


    ```

    Mammal* pMammal = new Dog;

    ```


    You can then use this pointer to invoke any member function on Mammal. What you
    would like is for those functions that are overridden in Dog to call the correct
    function.


    Virtual member functions let you do that. When you treat these objects polymorphically,
    call the method on the Mammal pointer and you don’t know or care what the actual
    object is or how it implements its method.


    The Mammal8 program in Listing 17.1 illustrates how virtual functions implement
    polymorphism.


