    # Stray or Dangling Pointers


    A source of bugs that are nasty and difficult to find is stray pointers. A stray
    pointer is created when you delete on a pointer—thereby freeing the memory that
    it points to—and try to use that pointer without reassigning it.


    It is as though the Acme Mail Order moved away and you still pressed the speed-dial
    button on your phone. It is possible that nothing terrible happens—a telephone
    rings in a deserted warehouse. Another possibility is that the telephone number
    has been reassigned to someone who works the night shift and you just woke them!


    Take care not to use a pointer after you have called delete on it. The pointer
    points to the old area of memory, but the compiler is free to put other data there;'
