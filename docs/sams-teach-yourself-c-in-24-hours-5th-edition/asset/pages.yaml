  md: "# Creating and Deleting Objects\n\nClasses have a member function called a\
    \ constructor that is called when an object of the class is instantiated. The\
    \ job of the constructor is to create a valid object of the class, which often\
    \ includes initializing its member data. The constructor is a function with the\
    \ same name as the class but no return value. Constructors may or not have parameters,\
    \ just like any other function of the class.\n\nHere's a constructor for the Tricycle\
    \ class:\n\n```\nTricycle::Tricycle(int initialSpeed)\n{\n  setSpeed(initialSpeed);\n\
    }\n```\n\nThis constructor sets the initial value of the speed member variable\
    \ using a parameter. When you declare a constructor, you should also declare a\
    \ destructor. Just as constructors create and initialize objects of your class,\
    \ destructors clean up after objects and free any memory that was allocated for.\
    \ A destructor always has the name of the class preceded by a tilde (~). Destructors\
    \ take no parameters and have no return value.\n\nHere's a Tricycle destructor:\n\
    \n```\nTricycle::~Tricycle()\n{\n  // do nothing\n}\n```\n\nThe destructor for\
    \ the class requires no special actions to free up memory, so it includes a comment.\n\
    \n# Default Constructors\n\nThere are several ways to call constructors when setting\
    \ up an object.\n\nOne is to specify one or more parameters in parentheses:\n\
    Tricycle wichita(5);\n\nThe parameter (or parameters) is sent to the constructor.\
    \ In this example, it sets the initial speed of the trike.\n\nYou can also set\
    \ an object without specifying parameters:\nTricycle wichita;\n\nThis calls the\
    \ default constructor of the class, which is a constructor with no parameters."
