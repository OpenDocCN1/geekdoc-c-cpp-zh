    # Using Operator Overloading


    What You''ll Learn in This Hour:


    +   - How to overload operators in member functions

    - How to overload the assignment operator to manage memory

    - How to support classes with dynamically allocated variables


    # Operator Overloading


    The built-in types in C++ work with operators such as addition (+) and multiplication
    (*), making it easy to use these types in expressions:


    ```

    int x = 17, y = 12, z;

    z = x * (y + 5);

    ```


    The C++ compiler knows to multiply and add integers when the * and + operators
    appear in an expression. The preceding code adds 5 to y, and then multiplies the
    result by x. The z integer is assigned the value 289.


    A class could provide the same functionality with multiply() and add() member
    functions, but the syntax is a lot more complicated. Here''s a snippet of code
    for Number class that represents integers and performs the same work as the preceding
    example:


    ```

    Number x(17);

    Number y(12);

    Number z, temp;

    temp = y.add(5);

    z = x.multiply(temp);

    ```


    This code adds 5 to y and multiplying the result by x. The result is still 289.'
