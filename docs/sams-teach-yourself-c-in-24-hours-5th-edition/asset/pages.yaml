    # Q&A


    +   Q. Why should I declare an object as const if it limits what I can do with
    it?


    A. As a programmer, you will want to enlist the compiler in helping you find bugs.
    One serious bug that is difficult to find is a function that changes an object
    in ways that aren''t obvious to the calling function. Declaring an object const
    prevents such changes.


    +   Q. Java doesn''t have pointers. Why do I need them in C++?


    A. For most tasks, you can achieve the same results using other techniques. Java
    creator James Gosling felt that pointers were too error-prone for programmers,
    so he left them out of his language. Pointers in C++ only are only completely
    necessary when working directly with hardware such as on a device driver. But
    once you master pointers, you''ll find you can do a lot with their power.


    +   Q. Why do people have red eyes in photographs?


    A. The camera''s bright flash reflects off the retina, revealing the red color
    of blood vessels that nourish the eyes and giving pupils a demonic appearance.


    Some cameras offer a "red eye reduction" feature that reduces this effect by firing
    two flashes—before the picture is taken. The first flash causes the photo subject''s
    pupils to contract, minimizing the red-eye effect.


    Pupils that appear white in a photo are a possible indicator of eye disease such
    as retinoblastoma, a highly treatable cancer if detected early. If a photo shows
    a white-eye effect, the subject should see an ophthalmologist to ensure the eyes
    are healthy.'
