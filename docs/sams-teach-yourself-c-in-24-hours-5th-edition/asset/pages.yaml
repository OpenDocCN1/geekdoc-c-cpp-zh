  md: '# PostMaster: A Case Study


    # PostMaster: A Case Study


    Here''s another problem on which to practice your object-oriented analysis: You
    have been hired by Defective Software to start a new software project and to hire
    a team of C++ programmers to implement your program. Sam Snett, vice-president
    of New Product Development, is your new boss. He wants to design and build PostMaster,
    a utility to read electronic mail from various unrelated providers. The potential
    customer is a business person who uses more than one email product (for example,
    Gmail, Hotmail, and Lotus Notes).


    The customer will be able to teach PostMaster how to connect to each of the email
    providers. PostMaster will get the mail and present it in a uniform manner, enabling
    the customer to organize the mail, reply, forward letters among services, and
    so forth.


    PostMaster Professional, to be developed as version two of PostMaster, is already
    anticipated. It will add an administrative assist that will enable the user to
    designate another person to read some or all of the mail, to handle routine correspondence,
    and so forth. There is also speculation in the marketing department that an artificial-intelligence
    component might add the capability for PostMaster to sort and prioritize the mail
    based on subject and content keywords and associations.


    Other enhancements have been talked about, including the capability to handle
    not only mail but discussion groups, such as Internet newsgroups and mail lists.
    It is obvious that Acme has great hopes for PostMaster, and you are under severe
    time constraints to bring it to market, although you seem to have a nearly unlimited
    budget.


    # Measure Twice, Cut Once


    You set up your office and order your equipment; your first order of business
    is then to get a good specification for the product. After examining the market,
    you decide to recommend that development be focused on a single platform, and
    you set out to decide among Linux, Mac OS, and Windows.


    You have many painful meetings with Snett. It becomes clear that there is no right
    choice, so you decide to separate the front end—that, the user interface (or UI)—from
    the back end—the communications and database part. To get things quickly, you
    decide to write for Windows, followed later by Mac OS and perhaps Linux.


    This simple decision has enormous ramifications for your project. It quickly becomes
    obvious that you need a class library or a series of libraries to handle memory
