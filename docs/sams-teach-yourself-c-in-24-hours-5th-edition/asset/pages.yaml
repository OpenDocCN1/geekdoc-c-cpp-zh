  md: '# HOUR 3: Creating Variables and Constants


    Whenever a zombie is dispatched, the player''s score is increased by the reward:

    playerScore = playerScore + KILL_BONUS;


    If you decide to increase the reward to 10,000 points, you can change the KILL_BONUS,
    and it will be reflected throughout the program. If you were to use the literal
    constant 5000 it would be difficult to find all the places it is used and change
    the value. This reduces the potential for error.


    Well-known symbolic constants also make a program more understandable. Constants
    are often capitalized by programmers to make them distinct from variables. This
    is not required by C++, but the capitalization of a constant must be consistent
    because the language is case sensitive.


    # Defining Constants


    There''s another way to define constants that dates back to early versions of
    the C language, the precursor of C++. The preprocessor directive #define can create
    a constant by specifying its name and value, separated by spaces:

    #define KILLBONUS 5000


    The constant does not have a type as int or char. The #define directive enables
    a simple substitution that replaces every instance of KILLBONUS in the code with
    5000. The compiler sees only the end result.


    Because these constants lack a type, the compiler cannot ensure that the constant
    has a proper value.


    # Enumerated Constants


    Enumerated constants create a set of constants with a single statement. They are
    defined with the keyword enum followed by a series of comma-separated names surrounded
    by braces:


    ```

    enum COLOR { RED, BLUE, GREEN, WHITE, BLACK };

    ```


    This statement creates a set of enumerated constants named COLOR with five values
    RED, BLUE, GREEN, WHITE and BLACK.


    The values of enumerated constants begin with 0 for the first in the set and count
    upwards by 1. So RED equals 0, BLUE equals 1, GREEN equals 2, WHITE equals 3,
    and BLACK equals 4. All the values are integers.'
