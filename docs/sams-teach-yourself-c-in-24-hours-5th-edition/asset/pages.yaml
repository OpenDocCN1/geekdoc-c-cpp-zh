    # Using typedef with Pointers to Functions


    The construct void (*)int&, int&) in the FunctionPasser program is cumbersome,
    at best. You can use typedef to simplify this, by declaring a type VPF as a pointer
    to a function returning void and taking two integer references:


    ```

    typedef void (*VPF)(int&, int&);

    ```


    The pFunc variable is declared to be of type VPF:


    ```

    VPF pFunc;

    ```


    The member function printVals() is declared to take three parameters, a VPF and
    two integer references:


    ```

    void printVals(VPF pFunc, int& x, int& y);

    ```


    Remember that typedef creates a synonym; the only difference is readability.


    # Pointers to Member Functions


    Up until this point, all the function pointers you''ve created have been for general,
    nonlocal functions. It is also possible to create pointers to functions that are
    members of classes.


    To create a pointer to member function, use the same syntax as with a pointer
    to function, but include the class name and the scoping operator (::). Therefore,
    if pFunc points to a member function of the class Shape, which takes two integers
    and returns void, the declaration for pFunc is the following:


    ```

    void (Shape::*pFunc)(int, int);

    ```


    Pointers to member functions are used in exactly the same way as pointers to functions,
    except that they require an object of the correct class to invoke them. The MemberPointer
    program in Listing 20.8 illustrates the use of pointers to member functions.'
