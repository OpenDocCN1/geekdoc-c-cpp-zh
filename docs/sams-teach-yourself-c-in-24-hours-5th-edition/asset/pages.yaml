  md: '# Around the Bases


    # 413


    programs. At their core, they are just circuitry, and at a given juncture, there
    is a lot of power or there is very little.


    To keep the logic clean, engineers do not treat this as a relative scale (a little
    power, some power, more power, or lots of power), but rather as a binary scale
    (enough power or not enough). This is simplified to "yes" or "no." Yes or no can
    be represented as 1 or 0. By convention, it means true or yes, but that is just
    a convention; it could just as easily have false or no.


    After you make this great leap of intuition, the power of binary becomes: With
    1s and 0s, you can represent the fundamental truth of every circuit. (There is
    power or there isn''t.) All a computer knows is,"Is it on, or is it off?" On 1,
    off equals 0.


    # Bits, Bytes, and Nibbles


    After the decision is made to represent truth and falsehood with 1s and 0s, binary
    digits (or bits) become very important. Because early computers send 8 bits at
    a time, it was natural to start writing code using 8-bit numbers (called bytes).


    > Half a byte (4 bits) is called a nibble! You may also see this specified as
    nibble.


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_410_0.png)


    With 8 binary digits, you can represent 256 different values. Why? Examine the
    columns: If all 8 bits are set (1), the value is 255. If none is set (the bits
    are clear or zero), the value is 0. 0-255 represents 256 possible states.


    # What''s a KB?


    It turns out 2¹⁰ (1,024) is roughly equal to 10³ (1,000). This coincidence was
    too good to miss, so computer scientists started referring to 2¹⁰ bytes as 1KB
    or kilobyte, based on the scientific factor for thousand.


    Similarly, 1,024¹ × 1,024 (1,048,576) is close enough to one million to receive
    the designation 1MB or 1 megabyte, and 1,024 megabytes is called 1 gigabyte (giga
    implies thousand-million or billion).


    # Binary Numbers


    Computers use patterns of 1s and 0s to encode everything they do. Machine instructions
    are encoded as a series of 1s and 0s and interpreted by the fundamental circuitry.
    Arbitrary sets of 1s and 0s can be translated into numbers by computer scientists,
    but it would be a mistake to think that these numbers have intrinsic meaning.


    www.it-ebooks.info'
