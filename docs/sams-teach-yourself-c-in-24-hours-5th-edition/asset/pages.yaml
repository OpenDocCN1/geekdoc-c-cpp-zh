  md: '# HOUR 2


    # Organizing the Parts of a Program


    # What You''ll Learn in This Hour:


    +   - Why to use C++

    - How C++ programs are organized

    - How comments make programs easier to understand

    - What functions can accomplish


    Although recently turned 30, the C++ programming language has aged a lot better
    than some things that came out in the late 1970s. Unlike disco, oil embargoes,
    shag carpet, and avocado-colored refrigerators, C++ is still in vogue today. It
    remains a world-class programming language.


    The reason for its surprising longevity is that C++ makes it possible to create
    fast executing programs with a small amount of code that can run on a variety
    of computing environments. Today''s C++ programming tools enable the creation
    of complex and powerful applications in commercial, business, and open source
    development.


    # Reasons to Use C++


    During the seven decades of the computing age, computer programming languages
    have undergone a dramatic evolution. C++ is considered to be an evolutionary improvement
    of a language called C that was introduced in 1972.


    The earliest programmers worked with the most primitive computer instructions:
    machine language. These instructions were represented by long strings of 1s and
    0s. Assemblers were devised that could map machine instructions to human-readable
    and manageable commands such as ADD and MOV.'
