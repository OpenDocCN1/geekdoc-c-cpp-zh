    # Q&A


    +   Q What does the # character do in a C++ program?


    +   A The # symbol signals the line is a preprocessor directive, a command that
    is handled before the program is compiled. The #include directive includes the
    full text of a file at that position in the program. The compiler never sees the
    directive. Instead, it acts as if contents of the file were typed with the rest
    of the source code.


    +   Q What is the difference between // and /* style comments?


    +   A The comments that start with // are single-line comments that end with the
    end of the line on which they appear. The /* are multiline comments that don''t
    end until a /* is encountered. The end of a function won''t even cause a multiline
    comment to be ended. You must put in the closing /* or the compiler will fail
    with an error.


    +   Q What''s the difference between function arguments and function parameters?


    +   A The terms are related to the same process—calling a function by providing
    it one or more data types the function will use to accomplish its work. Arguments
    are the information sent to the function. Parameters are the same information
    received inside the function. You call a function with arguments. Within a function,
    those are received as parameters.


    +   Q What is a kludge?


    +   A kludge is an ugly solution to a problem that''s intended to be replaced
    later with something better. The term was popularized by Navy technicians, computer
    programmers and aerospace engineers and spread to other technical professions.


    +   In a computer program a kludge is source code that would have been designed
    better if there had been enough time. Kludges have a tendency to stick around
    a lot longer than expected.'
