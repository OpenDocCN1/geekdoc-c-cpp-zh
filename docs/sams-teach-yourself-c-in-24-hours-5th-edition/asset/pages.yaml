  md: '# PostMaster: A Case Study


    Accordingly, you might decide to start by designing the principal classes, setting
    aside the need for the secondary classes. Further, when you identify multiple
    classes that will have similar designs with only minor年纪, you might choose to
    pick one representative class and focus on that, leaving until later the design
