  md: '# Creating References


    What You''ll Learn in This Hour:


    +   - What references are

    - How references differ from pointers

    - How to create and use references

    - What the limitations of references are

    - How to pass values and objects into and out of functions by reference


    # What Is a Reference?


    In the past 2 hours, you learned how to use pointers to manipulate objects on
    the heap and how to refer to these objects indirectly. The topic of this hour,
    give you almost all the power of pointers but with a much easier syntax.

    A reference is an alias. When you create a reference, you initialize it with the
    name of another object, the target. From moment on, the reference acts as an alternative
    name for the target, and anything you do to the reference is really done to the
    target.

    You might read elsewhere that references are pointers, but that is not correct.
    Although references are often implemented using pointers, that is a matter of
    concern only to creators of compilers; as a programmer, you must keep these two
    ideas distinct.

    Pointers are variables that hold the address of another object. References are
    aliases to an object.'
