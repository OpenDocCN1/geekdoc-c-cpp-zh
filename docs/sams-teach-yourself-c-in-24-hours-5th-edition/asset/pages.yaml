    # Pure Virtual Functions


    C++ supports the creation of abstract data types with pure virtual functions.
    A pure virtual function is a virtual function that must be overridden in the derived
    class. A pure virtual function is made pure by initializing it with 0, as in the
    following:


    ```

    virtual void draw() = 0;

    ```


    Any class with one or more pure virtual functions is an ADT, and it is illegal
    to instantiate an object of a class that is an ADT. Trying to do so causes a compile-time
    error. Putting a pure virtual function in your class signals two things to clients
    of your class:


    +   - Don''t make an object of this class; derive from it.

    - Make sure to override the pure virtual function.


    Any class that derives from an ADT inherits the pure virtual function, and so
    must override every pure virtual function if it wants to instantiate objects.
