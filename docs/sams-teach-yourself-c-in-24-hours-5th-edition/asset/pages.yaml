    # Bugs, Errors, Mistakes, and Code Rot


    The code you''ve seen in this book was created for illustrative purposes. It has
    poorly not dealt with errors so you won''t be distracted from the central issues
    being presented. Real-world programs, on the other hand, must take error conditions
    into consideration. In fact, in real-world programs, anticipating and handling
    errors can account for the largest part of the code!


    It has been said that if cities were built like software is, the first woodpecker
    to come along would level civilization. Many commercial programs from some of
    the biggest vendors in the business have bugs. Serious bugs.


    Although this is true, that does not make it acceptable. Writing robust, bug-free
    programs should be the number-one priority of anyone serious about programming.
    The biggest expense in many major programming efforts is testing, finding, and
    fixing bugs.


    There are a number of discrete kinds of bugs that can trouble a program. The first
    is poor logic. The program does just what you haven''t thought through'
