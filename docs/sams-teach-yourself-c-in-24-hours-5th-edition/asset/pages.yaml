  md: '# Summary


    With the completion of this hour, you should now be comfortable with how pointers
    and references are created in C++ and understand their strengths and weaknesses.


    A pointer is a variable that holds a memory address, whereas a reference is an
    alias. Both provide forms of indirection that enable functions to be more, well,
    functional. In many cases, you will find that references are the better choice.


    # Q&A


    +   Q. Why have pointers if references are easier?

    A. References cannot be NULL, and they cannot be reasigned. Pointers offer greater
    flexibility, but are slightly more difficult to use.


    +   Q. Why would you ever return by value from a function?

    A. If the object being returned is local, you must return by value or you will
    be returning a reference to a nonexistent object.


    +   Q. Given the danger in returning by reference, why not always return by value?

    A. There is much greater efficiency in returning by reference. Memory is saved,
    and the program runs faster.


    +   Q. Where can I go to become a clown?

    A. One place to go is the Ohio College of Clowning Arts, an institution of higher
    learning “dedicated to teaching students the ancient and honorable art of the
    clown.” The school, located in Louisville, Ohio, offers 30 weeks of instruction.


    Courses include Clown Characterization, Physical Clowning, and Balloons and Magic
    for the Clown.


    The college costs from $1,295 to $1,495. Visit www.ohiocollegeclowningarts.com
    for more information.'
