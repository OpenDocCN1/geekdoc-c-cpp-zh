  md: '# HOUR 16: Extending Classes with Inheritance


    The taxonomist’s hierarchy establishes an “is” relationship—a dog is a canine.
    There are “is” relationships everywhere. A Toyota is a kind of car, which is a
    kind of vehicle. A sundae is a kind of dessert, which is a kind of food.


    What is meant when something is described as a kind of something? This means it
    is a specialization of that thing. That is, a car is a special kind of vehicle.
    Cars and buses are both vehicles. They are distinguished by their specific characteristics
    but share things in common with each other and other vehicles.


    # Inheritance and Derivation


    These relationships are conveyed by inheritance. The concept of a dog inherits
    all the features of a mammal. Because it is a mammal, it moves and breathes air;
    the concept of a dog adds to definition the idea of barking, a wagging tail, and
    so forth. A dog has traits unique to dogs and traits common to all mammals.


    Dogs can be divided further into hunting dogs and terriers; terriers can be divided
    into Yorkshire Terriers, Dandie Minriers, and so forth.


    A Yorkshire Terrier is a kind of terrier; therefore, it is a kind of dog; a kind
    of mammal; therefore, a kind of animal; and, therefore, a kind of living thing.


    C++ attempts to represent these relationships by defining classes that derive
    from one another. Derivation is a way of expressing the “is” a relationship. You
    define a new class, Dog, from the class Mammal. You don’t have to explicitly state
    that dogs move because they inherit from Mammal. Because it derives from Mammal,
    Dog automatically


    A class that adds functionality to an existing class is said to derive from original
    class. The original class is said to be the new class’s base class.


    If the Dog derives from the Mammal class, Mammal is a base class of Dog. Derived
    classes are supersets of their base classes. Just as dogs add features to the
    idea of a mammal, the Dog class will add certain methods or data to the Mammal
    class.


    A base class can have more than one derived class. Just as dogs, cats, and horses
    are all types of mammals, their classes would all derive from the Mammal class.


    # Animals and Inheritance


    To facilitate the discussion of derivation and inheritance, this section focuses
    on the relationships among a number of classes representing animals. Imagine that
    you have been asked to design a children’s game—a simulation of farm.'
