  md: '# Signed and Unsigned Variables


    All the integer types come in two varieties specified using a keyword. They are
    declared with unsigned when they only hold positive values and signed when they
    hold positive or negative values. Here''s a statement that creates a short int
    variable zombies that does not hold negative numbers:


    ```

    unsigned short zombies = 0;

    ```


    The variable is assigned the initial value 0. Both signed and unsigned integers
    can equal 0.

    Integers that do not specify either signed or unsigned are assumed to be signed.


    Signed and unsigned integers are stored using the same number of bytes. For this
    reason, the largest number that can be stored in an unsigned integer is twice
    as big as the largest positive number that a signed integer can hold. An unsigned
    short can handle numbers from 0 to 65,535. Half the numbers represented by a signed
    short are negative, so a signed short represents numbers from –32,768 to 32,767.
    In both cases, the total number of possible values is 65,535.


    # Variable Types


    In addition to integer variables, C++ types cover floating-point values and characters
    of text.


    Floating-point variables have values that can be expressed as decimal values.
    Characters hold a single byte representing 1 of the 256 characters and symbols
    in the standard ASCII character set.


    Variable types supported by C++ programs are shown in Table 3.1, which lists the
    variable type, the most common memory size, and the possible values that it can
    hold. Compare this table to the output of the Sizer program when run on your computer,
    looking for size differences.


    > TABLE 3.1 Variable Types


    | Type | Size | Values |

    |---|---|---||

    | unsigned short | 2 bytes | 0 to 65,535 |

    | short | 2 bytes | –32,768 to 32,767 |

    | unsigned long | 4 bytes | 0 to 4,294,967,295 |

    | long | 4 bytes | –2,147,483,648 to 2,147,483,647 |

    | int | 4 bytes | –2,147,483,648 to 2,147,483,647 |'
