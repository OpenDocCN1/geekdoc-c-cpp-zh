    # Passing a const Pointer


    Though a pointer to FunctionTwo() is more efficient, it is dangerous. FunctionTwo()
    is not supposed to change the SimpleCat object that it is passed, yet it is given
    the address of the SimpleCat. This exposes the object to impermissible change
    and defeats the protection offered by passing by value.


    Passing by value is like giving a museum a photograph of your masterpiece rather
    than the real thing. If vandals mark it up, no harm occurs to the original. Passing
    by reference is like sending your home address to the museum and inviting guests
    to come over and look at the real thing.


    If you want to provide the security of pass by value and the efficiency of pass
    by reference, the solution is to pass a const pointer to SimpleCat. Doing prevents
    calling any non-const member function on SimpleCat, and thus protects the object
    from change. The ConstPass program in Listing 13.2 demonstrates this idea.'
