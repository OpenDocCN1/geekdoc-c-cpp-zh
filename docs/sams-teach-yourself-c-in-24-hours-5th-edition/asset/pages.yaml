  md: '# Operators


    51


    operator . For this reason, multiplication and division are handled before addition
    and subtraction.


    When mathematical operators have the same precedence, they are performed in left-to-right
    order. Here''s an expression with multiplication operators and three addition
    operators:


    ```

    int x = 5 + 3 + 8 * 9 + 6 * 4;

    ```


    Because multiplication has higher precedence than addition and the same operators
    have left-to-right order, 8 times is evaluated first and becomes 72:


    ```

    int x = 5 + 3 + 72 + 6 * 4;

    ```


    Next, 6 times is evaluated:


    ```

    int x = 5 + 3 + 72 + 24;

    ```


    Now the addition operators are handled in left-to-right order. The final result
    is that x equals 104.


    Some operators, such as assignment, are evaluated in right-to-left order:


    ```

    int z = x = y + 13;

    ```


    The first expression evaluated is y + 13, which is assigned to x. Next, x is assigned
    to z.


    When precedence doesn''t meet your needs, you can use parentheses to impose a
    different order. Items within parentheses are evaluated at a higher precedence
    than any mathematical operators:


    ```

    int totalSeconds = (minutesWork + minutesTravel) * 60;

    ```


    This expression adds minutesWork and minutesTravel, multiplies the result by 60,
    and assigns it to totalSeconds.


    Parentheses can be nested within each other. The innermost parentheses are evaluated
    first:


    ```

    totalSeconds = ((secondsWork * 60) + minutesTravel) * 60;

    ```


    > In doubt, use parentheses to make an expression''s meaning clear. They do not
    affect a program''s performance, so there''s no harm in using them even in cases
    where they wouldn''t be needed.


