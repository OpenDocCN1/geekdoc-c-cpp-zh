    # By the Way


    Because linked lists are more useful than arrays, you might be wondering why not
    use them all the time? The power comes at a cost. Linked lists are sequential
    in nature, which means that you have to start at one end and work your way to
    the other end (or if you find the item you want). Access can be relatively slow.


    # Summary


    Because there''s so much to learn in C++, the projects undertaken in this book
    have often been short and illustrative. That makes it easier to focus on their
    functionality.


    As you begin your programming projects, you will find that the classes you create
    are not quite so simple.


    The linked list study during this hour consisted of five classes: Data, HeadNode,
    TailNode, InternalNode, and LinkedList. True object-oriented programming methodology,
    each class care of its own work and relied on the other objects to do theirs.


    By understanding how these objects work together, you can develop a better sense
    of how to manage the relationships between objects.


    # Q&A


    +   Q. Why should you create a linked list if an array will work?


    +   A. An array must have a fixed size, whereas a linked list can be sized dynamically
    at runtime.


    +   Q. Why do you separate the data object from the node?


    +   A. Once you get your nodes working properly, you can reuse code for any number
    of objects that might want to live in a list.


    +   Q. If you want to add other objects to the list, do you have to create a new
    list type and a new node type?


    +   A. For now, yes. We''ll solve that when we get to Hour 23, “Creating Templates."'
