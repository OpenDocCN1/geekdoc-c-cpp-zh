  md: '# Null Pointer Constant


    As you learned during Hour 10, “Creating Pointers,” it’s important when using
    pointers to make sure they always have a value. A pointer that is not initialized
    could be pointing to anything in memory. These wild pointers, as they are, pose
    a security and stability risk to your programs.


    To prevent this, pointers are assigned a null value when created. This can be
    done by using 0 or NULL as the value:


    ```

    int *pBuffer = 0;

    int *pBuffer = NULL;

    ```


    These are both accomplishing the same thing. NULL is a preprocessor macro that
    is converted to 0 (an integer) or 0L (a long).


    Setting null pointers in this manner works well in almost all circumstances, but
    it creates an ambiguity when a class relies on function overloading. Consider
    overloaded overloaded that takes either a pointer or an integer as an argument:


    ```

    void displayBuffer(char *);nvoid displayBuffer(int);

    ```


    If this function is called with a null pointer, the displayBuffer(int) member
    function will be called, despite the fact that this is probably not the programmer
    intended.


    C++ addresses this pointer problem with the addition of a new keyword, nullptr,
    which represents the value of a null pointer:


    ```

    int *pBuffer = nullptr;

    ```


    The constant 0 remains valid as a null pointer value, for reasons of backward
    compatibility, but nullptr is preferred.


    A nullptr is not implicitly converted to integer except for bool values. For Booleans,
    nullptr converts to the false value.


    The Swapper program (Listing 21.1) gives one variable the value of another using
    a pointer.


    # LISTING 21.1 The Full Text of Swapper.cpp


    ```

    1: #include <iostream>

    2:

    3: int main() {

    4: {

    5:   int value1 = 1250;

    6:   int value2 = 1700;

    ```'
