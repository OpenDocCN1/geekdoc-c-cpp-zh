  md: '# Creating a Reference


    You create a reference by writing the type of the target object, followed by the
    reference operator &, followed by the name of the reference. References can use
    any legal variable name, but in this book all reference names are prefixed with
    r and the second letter is capitalized. So, if you have an integer variable someInt,
    you can make a reference to that variable by writing the following:


    ```

    int &rSomeRef = someInt;

    ```


