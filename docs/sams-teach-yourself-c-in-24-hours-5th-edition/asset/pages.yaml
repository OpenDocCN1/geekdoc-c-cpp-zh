    # Summary


    A C++ programmer doesn''t have classes or objects at all. Programs consist simply
    of variables and functions, removing the need to master the complex concepts of
    object-oriented programming.


    Few programmers go this route. Why? Because you can be much more effective if
    you design a program as a series of classes that interact with each other.


    Developing classes makes code more reusable. If an object''s useful in one program
    would be useful in another, the class can be reused. A word processor''s Spellchecker
    class could be added to a web browser or any other tool where users write text.
    The spell-checking object''s capabilities would work the same in any program.'
