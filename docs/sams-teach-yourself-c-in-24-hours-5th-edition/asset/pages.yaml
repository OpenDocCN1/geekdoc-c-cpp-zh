  md: '# If-Else Conditional Statements


    The programs you have created far execute each line from top to bottom. The if
    keyword makes it possible to run code only if a condition is met, such as whether
    two variables are equal, one variable is larger than a specific value, or a bool
    has the value true.


    The following if statement displays a message only when an integer called zombies
    meets a specific condition:


    ```

    if (zombies == 0)

    std::cout << "No more zombies!\n";

    ```


    This code displays the words "No more zombies!" if the zombies variable equals
    0. The expression in parentheses is the condition. If the expression is true,
    the state-ment following it is executed. If it is false, the statement is skipped.


    For example, if the zombies variable equals 25 when the code runs, nothing is
    displayed.


    The expression must be true for the conditional code to be executed. Because variables
    can be true or false, one can be used as the condition:


    ```

    bool run = true;

    if (run)

    std::cout << "Running\n";

    ```


    This code displays the text "Running" only when the bool variable run equals true.


