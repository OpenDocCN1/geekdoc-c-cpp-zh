    # Auto-Tyd Variables


    One of the first things you learned about C++ is that the size of built-in data
    types such as long and double can be different on different implementations. The
    sizeof() function tells you how many bytes a type occupies:


    std::cout << "Integers require " << sizeof(int) << " bytes.";


    The new auto keyword in C++11 enables a type to be inferred based on the value
    that''s initially assigned to it. The compiler figures out the proper data type.


    Here''s an example:


    ```

    auto index = 3;

    auto gpa = 2.25F;

    auto rate = 500 / 3.0;

    ```


    These statements create an index variable that holds an int value, a gpa variable
    that holds a float and a rate variable that holds a double. The literal assigned
    to the variables at initialization determines the type of the variable.'
