  md: "Templates, a relatively new addition to C++, offer a solution to this problem.\
    \ In addition, unlike old-fashioned macros, templates are an integrated part of\
    \ the language and are type-safe and very flexible.\n\nTemplates enable you to\
    \ create a general class and pass types as parameters to the template to build\
    \ specific instances of the parameterized type.\n\n# # Instances of the Template\n\
    \nTemplates enable you to teach the compiler how to make a list of any type of\
    \ thing, instead of creating a set of type-specific lists. A PartsList is a list\
    \ of parts; A CatList is a list of cats. The only way in which they differ is\
    \ the type of the thing on the list. With templates, the type of the thing on\
    \ the list becomes a parameter to the definition of the class.\n\nThe act of creating\
    \ an object (from a class) or a specific type from a template is called instantiation,\
    \ and the individual classes are called instances of the template.\n\n# # Template\
    \ Definition\n\nYou declare a parameterized List object (a template for a list)\
    \ with the template keyword, as in this code:\n\n```\ntemplate <T> // declare\
    \ the template and the parameter\nclass List // the class being parameterized\n\
    public:\n    List();\n    // full class declaration here\n;\n```\n\nThe keyword\
    \ template is used at the beginning of every declaration and definition of a template.\
    \ The template's parameters follow the keyword template; they are the items that\
    \ will change with each instance. For example, in the list template shown in this\
    \ code snippet, the type of the objects stored in the list will change. One instance\
    \ might store a list of Integer objects, another list of Animals.\n\nIn this example,\
    \ the keyword class is used, followed by the identifier T. The keyword indicates\
    \ that this is a parameter. The identifier T is used throughout the rest of the\
    \ template definition to refer to the parameterized type. One instance of this\
    \ class will substitute int everywhere T appears, and another substitute Cat."
