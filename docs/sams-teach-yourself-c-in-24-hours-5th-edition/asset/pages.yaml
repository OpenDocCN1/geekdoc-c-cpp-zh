  md: '# Converting $252_{10}$ to binary requires the chart:


    | Col: | 9 | 8 | 7 | 6 | 5 | 4 | 3 | 2 |

    | Power: | $2^7$ | $2^6$ | $2^5$ | $2^4$ | $2^3$ | $2^2$ | $2^1$ | |

    | Value: | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 |


    +   There are no 256s.

    1 128 leaves 124

    1 64 leaves 60

    1 32 leaves 28

    1 16 leaves 12

    1 8 leaves 4

    1 4 leaves 0


    Thus, the answer in binary is 1111 1100.


    Now, it turns out that you treat this binary number as two sets of four digits,
    you can do a magical transformation.


    The right set is 1100. In decimal, it is 12, or in hexadecimal it is C.


    The left set is 1111, which in base 10 is 15, or in hex is F.


    Thus, you have the following:


    1111 1100

    F C


    Putting the two hex numbers together works, which is the real value of 1111 1102.
    This shortcut always works. You can take any binary number of any length and reduce
    it to sets of four, translate each set to four, and put the numbers together to
    get the result in hex.


    You can shortcut the hexadecimal to binary conversion by using the reverse process.
    Split the hexadecimal number into individual digits and convert each of them into
    binary digits (bits). If you remember the value of the first bits are 8, 4, 2,
    and 1, you can easily convert from hexadecimal to binary—because each hex digit
    can be treated as an individual bits.


    Here''s a much larger number:


    1011 0001 0111


    The columns are 1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192,
    16384, and 32768:


    +   1 x 1 = 1

    1 x 2 = 2

    1 x 4 = 4'
