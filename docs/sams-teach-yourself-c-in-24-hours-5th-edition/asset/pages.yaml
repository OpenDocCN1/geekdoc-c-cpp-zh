  md: '# Constructors Provided by the Compiler


    If you declare constructors, as you did in the Tricycle program in Listing 8.1,
    the compiler creates a default constructor for you.


    The default constructor the compiler provides no action; it is as if you declared
    a constructor with no parameters whose body was empty.


    There are two important points to note:


    +   - The default constructor is any constructor that takes no parameters. You
    can define it yourself or get it as a default from the compiler.


    +   - If you define any constructor (with or without parameters), the compiler
    does not provide a default constructor for you. In that case, if you want a default
    constructor, you must define it yourself.


    If you fail to define a destructor, the compiler also provides one of those, which
    also has an empty body and does nothing.


    If you define a constructor, be sure to define a destructor even if your destructor
    does nothing. Although it is true that the default destructor would work correctly,
    it doesn''t hurt to define your own.


