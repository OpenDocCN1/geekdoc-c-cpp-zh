  md: '# Q&A


    +   Q. What happens if I write to element 25 in a 24-member array?


    +   A. You will write to other memory, with potentially disastrous effects on
    your program. Memory used by the program could be overwritten, and the software
    could run improperly. According experts, the most common software exploit used
    by malicious programmers is to write data a buffer and use this error to execute
    new code. The new code can do anything, such as altering or deleting files, granting
    system privileges to untrusted users, and replicating viruses.


    +   Q. What is in an uninitialized array element?


    +   A. An array element that has not been assigned a value. The value is whatever
    happens to be in memory at a given time. The results of using this member without
    assigning a value are unpredictable.


    +   Q. Can I combine arrays?


    +   A. Yes. With simple arrays you can use pointers to combine them into a new,
    larger array. With strings you can use some of the built-in functions, such as
    strcat, to combine strings.


    +   Q. Why did the number 13 become associated with bad luck?


    +   A. Thirteen has been getting bad press since the Middle Ages, partially from
    the observation that the presence of Judas made the Last Supper a table for 13.


    Additionally, the Norse god Loki arrived at a party attended by 12 of his colleagues
    and ruined the proceedings, according to one myth.


    Also, when ancient calendars in Sumer and Babylon ventured too far off the mark,
    a 13th month was added to bringing things into the line, Ellis writes. This error
    affected planting schedules and crop yield, so month 13 was not welcome.


    Thirteen is one past a dozen, and 12 is considered a suitable number for a wide
    variety of things. So, 13 becomes one too many and represents transgression and
    discord.


    The number 13 is so terrifying there''s a word to describe the fear of it: triskaidekaphobia.'
