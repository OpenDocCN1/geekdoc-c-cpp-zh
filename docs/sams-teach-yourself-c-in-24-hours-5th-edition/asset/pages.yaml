  md: '# HOUR 18: Making Use of Advanced Polymorphism


    In the body of the program, an Animal pointer is used to point to the various
    derived objects in turn. The virtual member functions are invoked, and, based
    on the run-time binding of the pointer, the correct function is called in the
    derived class.


    It would cause a compile-time error to try to instantiate an Animal or a Mammal,
    because both are abstract data types.


    # Which Types Are Abstract?


    In one program, the class Animal is abstract; in another it is not. What determines
    whether to make a class abstract?


    The answer to this question is decided not by any real-world, intrinsic factor,
    but by what makes sense in your program. If you are writing a program that depicts
    a farm or a zoo, you might want Animal to be an abstract data type but Dog to
    be a class from which you can instantiate objects.


    On the other hand, if you are making an animated kennel, you might want to keep
    Dog as an abstract data type and only instantiate types of dogs: retrievers, terriers,
    terriers, and so forth. The level of abstraction is a function of how finely you
    need to distinguish your types.


    # Summary


    During this hour, you learned abstract data types and pure virtual functions,
    two aspects of the C++ language that make its support for object-oriented programming
    more robust.


    An abstract data type is a class that cannot be implemented as an object. Instead,
    it defines common member variables and functions for its derived classes.


    A function becomes a pure virtual function by adding = 0; to the end of its declaration.
    If a class contains at least one pure function, the class is an abstract data
    type.


    The compiler will not allow objects of an abstract data type to be instantiated.


    # Q&A


    +   Q. What does percolating functionality upward mean?


    +   A. This refers to the idea of moving shared functionality upwards into a common
    base class. If more than one class shares a function, it is desirable to find
    a common base class in which that function can be stored.'
