  md: '# Workshop


    You''ve just learned more about polymorphism and should answer a few questions

    do a couple of exercises to firm up your knowledge.


    # Quiz


    +   1. Is there a difference between a virtual member function and an overridden
    member function in the base class?


    A. Yes


    B. No


    C. Reply hazy, try again

    2. What makes an abstract data type abstract?


    A. The abstract keyword


    B. It has least one pure virtual function.


    C. It has all pure virtual functions.

    3. Is it okay to supply base class member functions that apply only to specific
    derived classes?


    A. Yes


    B. No


    C. It varies.


    # Answers


    +   1. A. A virtual function expects to be overridden in the derived classes.
    An overridden function does not have to be in derived classes.

    2. B. The class is abstract because it has at least one pure virtual function
    that cannot be called directly. Because of that function, you cannot create a
    concrete example of that class and must derive a class from the abstract with
    the proper methods and instantiate from the derived class.'
