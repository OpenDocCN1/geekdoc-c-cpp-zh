    # What Is an Array?


    *An array* is a collection of related data that all have the same data type. An
    array can be envisioned as a series of data storage locations. Each storage location
    is called an *element* of the array.


    An array is declared by writing the data type and the array name by the number
    of elements the array holds square brace. Here''s an example:

    long peaks[25];


    The peaks array holds 25 long integers. This declaration causes the compiler to
    sets aside enough memory to hold all 25 elements. Because each long integer requires
    4 bytes, this declaration sets aside 100 contiguous bytes of memory.


    Array elements are numbered from 0 up to the largest element, the peaks array
    holds elements 0 through 24. Each element is accessed by using its number in square
    braces. This statement assigns a value to the first peaks element:

    peaks[0] = 29029;'
