    # By the Way


    One question you will confront throughout the design phase of your program is
    routines you might buy and you must write yourself. It is entirely possible that
    you can take advantage of existing commercial libraries to solve or all your communications
    issues. Licensing fees and other nontechnical concerns must also be resolved.


    It is often advantageous to purchase such a library, and to focus your energies
    on your specific program rather than to reinvent the wheel about advantageous
    secondary technical issues. You might even want to consider purchasing libraries
    that were not intended for use with C++, if they can provide fundamental functionality
    you''d otherwise have to engineer yourself. This can be instrumental in helping
    you your deadlines.


    # Designing the Interfaces


    It is important, at this stage of designing your product, to avoid being concerned
    with implementation. You want to focus all your energies on designing a clean
    interface among the classes, and then delineating what data and member functions
    each class will need.


    It is often a good idea to have a solid understanding of the base classes before
    trying to design the more derived classes, so you decide to focus on pObject,
    pStored, and pWired.'
