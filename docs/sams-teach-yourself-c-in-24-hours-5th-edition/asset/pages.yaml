  md: 'performs a task, such as multiplying numbers or displaying text. A class is
    the definition of a new type of data and related functions.


    Here are the steps to create a C++ program:


    +   1. Create a source code file with a text editor.


    +   2. Use a compiler to convert the source code into an object file.


    +   3. Use a linker to link the object file and any necessary libraries to produce
    an executable program.


    +   4. Type the name of the executable to run it.


    The GCC compiler can handle compiling and linking in a single step.


    # Creating Your First Program


    Now that you''ve been introduced to how the process works, it''s time to create
    your first C++ program and give the compiler a test drive.


    Run the text editor you''re using to create programs and open a new file. The
    first program that you will create displays text on the screen.


    Type the text of Listing 1.1 into the editor. Ignore the numbers along the left
    side of the listing and the colons that follow them. The numbers are simply for
    reference purposes in this book.


    As you type, make sure to ensure the punctuation on each line properly, such as
    the :: and << characters on line 5.


    When you''ve finished, save the file as Motto.cpp.


    # LISTING 1.1 The Full Text of Motto.cpp.


    ```

    1: #include <iostream>

    2:

    3: int main() {

    4:   {

    5:     std::cout << "Solidum petit in profundis\n";n6:     return 0;

