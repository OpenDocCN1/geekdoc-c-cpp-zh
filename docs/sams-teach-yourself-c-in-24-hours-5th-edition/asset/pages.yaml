    # Constants


    A constant, like a variable, is a memory location where a value can be stored.
    Unlike variables, constants never change in value. You must initialize a constant
    when it is created. C++ has two types of constants: literal and symbolic.


    A literal constant is a value typed directly into your program where it is needed.
    For example, consider the following statement:


    ```

    long width = 5;

    ```


    This statement assigns the integer variable width the value 5. The 5 in the statement
    is a literal constant. You can''t assign a value to 5, and its value can''t be
    changed.


    The values true and false, which are stored in bool variables, are also literal
    constants.


    A symbolic constant is a constant represented by a name, just like a variable.
    The const keyword precedes the type, name, and initialization. Here''s a statement
    that sets the point reward for killing a zombie:


    ```

    const int KILL_BONUS = 5000;

    ```'
