  md: '# Delegation of Responsibility


    A fundamental premise of object-oriented programming is that each object does
    one thing very well and delegates to other objects anything that is not part of
    its mission.


    An automobile is an example of this idea. The engine''s job is to produce the
    power. Distribution of power is not the engine''s job; it is up to the transmission.
    Turning is not the job of the engine or the transmission; it is delegated to the
    wheels.


    A well-designed machine has lots of small, well-understood parts, each doing its
    job and working together to accomplish a greater good. A well-designed program
    is much the same: Each class sticks to its own assignment, but together they create
    a functioning program.


    # Component Parts


    The linked list consists of nodes. The node itself will be abstract; we''ll use
    three subtypes to accomplish the work. There will be a head and tail node to manage
    those parts of the list zero or more internal nodes. The internal nodes will keep
    track of the actual data to be in the list.


    Note that the data and the list are quite distinct. You can save any type of data
    you like in a list. It isn''t the data that is linked together; it is the node
    holds the data that is linked.


    The program doesn''t actually know about nodes; it only works with the list. The
    list does little work, simply delegating to the nodes.


    The LinkedProgram in Listing 19.1 is covered in detail. The source code is heavily
    commented to explain how each part works.


