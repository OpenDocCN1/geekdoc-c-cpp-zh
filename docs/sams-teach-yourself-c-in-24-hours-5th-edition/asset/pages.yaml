  md: '# Prefix and Postfix Operators


    The increment operator ++ and decrement operator -- can be used before or after
    a variable''s name to achieve different results. An operator placed before a variable''s
    name is called a prefix operator, as in this statement:

    ++count;


    An operator placed after the variable name is called the postfix operator:

    count++;


    In simple statements like the preceding examples, the operators accomplish the
    same thing. The count variable is increased by 1 in both statements.


    The reason for the existence of prefix and postfix operators becomes apparent
    in complex expressions where a variable is incremented or decremented and assigned
    to another variable. The prefix operator occurs before the variable''s value is
    used in the expression. The postfix is evaluated after.


    This will make more sense with a concrete example:


    ```

    int x = 5;

    int sum = x++;

    ```


    After these statements are executed, the x variable and sum variable both equal
    6. The prefix operator in ++ causes x to be incremented from 5 to 6 before it
    is assigned to sum.


    Compare it to this example:


    ```

    int x = 5;

    int sum = x--;

    ```


    This causes sum to equal 5 and x to equal 6. The postfix operator causes x to
    be assigned to sum before it is incremented from 5 to 6.


    Listing 4.2 contains the Years program, which counts forward several years using
    prefix and postfix increment operators.


