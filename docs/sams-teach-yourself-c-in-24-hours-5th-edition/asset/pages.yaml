    # Comments


    As you are writing your own programs, it will seem perfectly clear to what each
    line of the source code is intended to accomplish. But as time passes and you
    come back to the program later to fix a bug or add a new feature, you will find
    yourself completely mystified by your own work.


    To avoid this predicament and help others understand your code, you can document
    your source code with comments. Comments are lines of text that explain what a
    program is doing. compiler ignores them, so they are strictly for benefit of humans
    reading the code.


    There are two types of comments in C++. A single-line comment begins with two
    slashes (/) and causes the compiler to ignore everything that follows the slashes
    on the same line. Here’s an example:


    ```

    // The next line comment is a kludge (ugh!)

    ```


    A multiple-line comment begins with the slash and asterisk characters (/) and
    ends with the same characters reversed (*/). Everything within the opening /*
    and the closing /* it stretches over multiple lines. If a program contains a /*
    that is not followed by a */ somewhere, that’s an error likely to be flagged by
    the compiler. Here’s a multiple-line comment:


    > * This part of the program does not work well. Please remember to fix this the
    code goes live -- or find a scapegoat you blame for the problem. The new guy Curtis
    would be a good choice. */


    In the preceding comment, the text on the left margin is lined up to make it readable.
    This is not required because the compiler ignores everything within the /* and
    anything you can put there—grocery lists, love poems, secrets you’ve never told
    in your life, and so on.


