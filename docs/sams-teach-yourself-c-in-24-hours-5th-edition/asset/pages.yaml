    > The fact that arrays count from 0 is a common cause of bugs in programs written
    with C++ novices. When you use an array, remember that an array with 10 elements
    counts from array[8] to array[9].


    ![](img/8db8b1b06c075d6ad697e4bd42a377dc_105_0.png)


    # Writing Past the End of Arrays


    When you assign a value to an array element, the compiler computes where to store
    the value based on the size of each element and its subscript. If you store a
    new value in goal[3], the compiler multiplies the offset by 3 of the size of each
    element, for long integers is 4 bytes. The compiler then moves that many bytes,
    12, from the beginning of the array and stores the new value at that location.


    The goal array in the WeightGoals program has only four elements. If you try to
    store something in goal[4], the compiler ignores the fact that there is no such
    element. Instead, stores it in 20 bytes past the beginning of the first element,
    replacing whatever data is at that location. This can be any data, writing the
    new out-of-bounds value might have unpredictable results, such as crashing immediately
    or with random strings.


    These errors can be difficult to debug a program runs, so it''s important to pay
    attention to write the size of arrays when they are accessed.


    It is common to write one element past the end of an array that the bug has its
    name: a fence post. The name refers to the problem of counting how many posts
    you need for a 10-foot fence if you need one post for every foot. Some people
    answer 10, but you need 11, as in Figure 7.1.


    This sort of "off by one" mistake can be the bane of any programmer''s life. Over
    time, however, you''ll get used to the idea that a 25-element array counts only
    to element 24 and that everything counts from zero.'
