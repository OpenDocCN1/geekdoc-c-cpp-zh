  md: '# HOUR 1


    # Writing Your First Program


    What You''ll Learn in This Hour:


    +   - How and why C++ was invented

    - How to find a C++ compiler

    - How to create and compile your first program

    - How to link and run the program


    # Using C++


    In 1979, a Danish computer scientist at Bell Labs in the United States began work
    on an enhancement to the C programming language. Bjarne Stroustrup explained his
    personal website that he wanted a language “in which I could write programs that
    were both efficient and elegant.”


    A lot of other people wanted that.


    Stroustrup''s creation, which he dubbed C++, has held a spot among the world''s
    top programming languages for decades. Many programming trends have come and gone
    over the years, but this language remains a contemporary and useful choice for
    software development on desktop computers, embedded devices like smartphones and
    MP3 players, and many other computing environments.


    C++ is a portable language that works equally well on Microsoft Windows, Apple
    Mac OS, Linux, and UNIX systems. The best way to learn the language is to write
    programs without regard to the operating system the program runs on.


    S Teach Yourself C++ in 24 Hours offers a hands-introduction to the language that
    makes absolutely no assumptions about your operating system. This book can'
  merge: -1
