    What you want is to make the data visible to this class and its derived classes,
    which is accomplished by protected. Protected data members and functions are fully
    visible to derived classes, but are otherwise private.


    There are three access specifiers: public, protected, and private. If a function
    has an instance of a class, however, can access the public member data and functions
    of that class. The member functions of a class, however, can access the private
    data members and functions of any class from which they derive.


