    # Default Function Parameters


    When a function is declared in a prototype to receive one or more parameters,
    the function only can be called with arguments of the proper data types. Consider
    a function that takes one integer:


    ```

    bool isLeapYear(int year);

    ```


    The isLeapYear() function must take an integer as the parameter, a requirement
    the compiler will check. Calling a function with a missing or invalid value causes
    a compiler error.


    There''s one exception to this rule: If the function prototype declares a default
    value for a parameter, the function can be called without that. The default value
    is used when the parameter is omitted. Here''s a revised prototype of isLeapYear()
    that includes a default year:


    ```

    bool isLeapYear(int year = 2011);

    ```


    If the isLeapYear() function is called without specifying a year, the default
    of 2011 is used.


    A function definition does not change when default parameter are declared in the
    prototype.


    When a function has more than one parameter, default values are assigned based
    on the order of the parameters. Any parameter can be assigned a default value,
    with one important restriction: If a parameter does not have a default value,
    no previous parameter may have a default value.'
