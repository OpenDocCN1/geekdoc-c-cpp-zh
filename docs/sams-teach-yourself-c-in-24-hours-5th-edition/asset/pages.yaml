    # Compiling and Linking the Source Code


    Before you create your C++ program later this hour, it''s worthwhile to understand
    how the process works.


    C++ programs begin as source code, which is just typed into an editor such as
    Windows Notepad, Edit, Emacs, or Vi. Although Microsoft Word and other word processors
    can save files as plain text, you should use a simpler editor for programming
    because you don''t need all the formatting and presentation capabilities of a
    word processor. Source code consists of plain text with no special formatting.


    The source code you create for C++ can be given filenames ending with the extensions
    .cpp, .cxx, .cp or or . This book names all source files with the .cpp extension,
    the most common choice of C++ programmers and the default for some compilers.
    Most C++ compilers don''t allow the extension for source code, but using .cpp
    consistently you identify source code files.


    Source code is the human-readable format of a C++ program. It can''t run until
    it is compiled and linked.


    After your source code is compiled, an object file is produced. This is turned
    into an executable program by a linker.


    C++ programs are created by linking one or more object files with one or more
    libraries. A library is a collection of linkable files that provide useful functions
    and classes that you can rely on in your programs. A function is a block of code'
  merge: -1
