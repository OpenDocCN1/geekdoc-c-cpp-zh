  md: '# High-Level and Low-Level Design


    After the product is fully understood and the requirements have been captured
    in the appropriate documentation, it is time to move on to the high-level design.
    During this phase of the design the programmer doesn''t worry about the platform,
    operating system, or programming language issues. He concentrates, instead, on
    how system will work: What are the major components? How do they interact with
    one another?


    One way to approach this problem is to set aside issues relating to the user interface
    and to focus only on the components of the problem.


    The *problem space* is the set of problems and issues your program is trying to
    solve. The *solution space* is the set of possible solutions to the problems.


    As your high-level design evolves you''ll want to begin thinking about the responsibilities
    of the objects you identify—what they do and what information you hold. You also
    want to think about their collaborations—what objects they interact with.


    For example, clearly you have sensors of various types, a central alarm system,
    towers, wires, and telephones. Further thought convinces that you must also simulate
    rooms, perhaps, and groups of people such as owners and police.


    The sensors can be divided into motion detectors, trip wires, sensor detectors,
    smoke detectors, and so forth. All these are types of sensors, although there
    is no such as a *sensor per se*. This is a good indication that sensor is an abstract
    data type (ADT).


    As an ADT, the class *Sensor* would provide the complete interface for all types
    of sensors, and each derived type would provide the implementation. Clients of
    the various sensors would use them without regard to what type of sensor they
    are, and they would each “do the right thing” based on their real type.


    To create a good ADT, you need to have a complete understanding of what sensors
    do (rather than how they work). For example, sensors are passive devices or are
    they active? Do they wait for some to heat up, a we break, or a piece of caulk
    to melt, or do they probe their environment? Perhaps sensors have only a binary
    state (alarm state or OK), but others have a more analog state (what is the current
    temperature?). The interface to the abstract data type should be sufficiently
    complete to handle all the anticipated needs of the myriad derived classes.


    # Other Objects


    The design continues in this way, teasing out the various classes that are required
    to meet the specification. For example, if a log is to be kept, probably a timer'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Simulating an Alarm System


    is needed; should the timer poll sensor, or should each sensor file its own report
    periodically?


    The user is going to be able to set up, disarm, and program the system, so a terminal
    of some sort is required. You might want a separate object in your simulation
    for the alarm program itself.


    # Designing the Classes


    As you solve these problems, you will begin to design your classes. For example,
    you already have an indication that HeatSensor will derive from Sensor. If the
    sensor is to make periodic reports, it might derive via inheritance from Timer,
    or it might have a timer as a member variable.


    The HeatSensor will probably have member functions, such as currentTemp() and
    setTempLimit(), and will probably inherit functions as soundAlarm() from its base
    class, Sensor.


    A frequent issue in object-oriented design is that of encapsulation. When you
    imagine a design in which the alarm system has maxTemp. The alarm system asks
    the heat sensor what the current temperature is, compares it to the maximum temperature,
    and sounds the alarm if it is too hot. One could argue that this violates the
    principle of encapsulation. It would be better if the alarm system didnt know
    care about the details of temperature analysis—arguably that should be in the
    HeatSensor.


    Whether or not you agree with that argument, it is the kind of decision you want
    to focus on during the analysis of the problem. To continue this analysis, one
    could argue that only the sensor and the Log object know any details of how sensor
    activity is logged; the Alarm object shouldn''t know or care.


    Good encapsulation is marked by each class having a coherent and complete set
    of responsibilities, and no class having the same responsibilities. If the Sensor
    is responsible for noting the current temperature, no other class should have
    that responsibility.


    On the other hand, classes might help deliver the necessary functionality. For
    example, although it might be the responsibility of the Sensor to note and log
    the current temperature, it might implement that responsibility by delegating
    to a Log object the actually recording the data.


    Maintaining a firm division of responsibilities makes your program easier to extend
    and maintain. When you decide to change the alarm system for enhanced mode, its
    interface to the log and the sensors will be narrow and well defined. Changes
    to the alarm system should not affect the Sensor classes, and vice versa.'
