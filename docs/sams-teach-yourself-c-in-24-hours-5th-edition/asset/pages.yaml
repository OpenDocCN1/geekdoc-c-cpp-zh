    # Summary


    Prior to the development of these object-oriented techniques, analysts and programmers
    to think of programs as functions that acted on data.


    Object-oriented programming focuses on the integrated data and functionality as
    discrete units that have both knowledge (data) and capabilities (functions).


    A thorough grounding in the methodology of object-oriented programming, coupled
    with time to develop the design process for program before a single line of code
    is written, is necessary to develop robust and efficient C++ software.


    # Q&A


    +   - **Is object-oriented programming finally the silver bullet that will solve
    all programming problems?


    +   - **No, it was never intended to be. For large, complex problems, however,
    object-oriented analysis, design, and programming can provide the programmer with
    tools to manage enormous complexity in ways that were previously impossible.


    +   - **What is the systematic IUPAC name for a carboxylic acid with a potassium
