    # The Next Version of C++


    Since the C++ programming language was created by Bjarne Stroustrup in 1979, it
    has undergone several significant revisions.


    In 1983, its name was changed from C for Classes to C++, and numerous features
    such as virtual functions, operator overloading, and references were added. Two
