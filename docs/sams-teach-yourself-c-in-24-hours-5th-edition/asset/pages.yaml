  md: '# HOUR 22: Employing Object-Oriented Analysis and Design


    When programming a large project, an overall design of the files is needed. A
    standard approach, that you will follow for this project, is that each class appears
    in its header file, and the implementation for the class members appears in an
    associated .cpp file. Therefore, you will have a file Object.hpp and another called
    Object.cpp. You anticipate having other files such as Msg.hpp and Msg.cpp with
    the declaration of pMessage and the implementation of its functions, respectively.


    # Building a Prototype


    For a project as large as PostMaster, it is unlikely that your initial design
    will be complete and perfect. It would be easy to become overwhelmed by the sheer
    scale of the project, and trying to create all the classes and to complete their
    interface before writing a line of working code is a recipe for disaster.


    There are a number of good reasons to try out your design on a prototype—a quick-and-dirty
    working example of your core ideas. There are a number of different types of prototypes,
    however, each meeting needs.


    An interface design prototype provides the chance to test the look and feel of
    your product with potential users.


    A functionality prototype does not have the final user interface, but enables
    users to try out various features, such as forwarding messages or attaching files.


    Finally, an architecture prototype might be designed to give you a chance to develop
    a smaller version of the project and to assess how easily your design decisions
    scale up as the program is fleshed out.


    It is imperative to keep your prototyping goals clear. Are you examining the interface,
    experimenting with functionality, or building a scale model of your final product?
    A good architecture prototype makes a poor user interface prototype, and vice
    versa.


    It is also important to keep an eye on overengineering of the prototype, becoming
    so concerned with the investment you''ve made in the prototype that you are reluctant
    to tear down the code and redesign as you progress.


    # The 80/80 Rule


    A good design rule thumb at this stage is to design for those things that 80%
    of the people want to do 80% of the time, and to set aside your concerns about
    the remaining 20%. The boundary conditions will need to be addressed sooner or
    later, but the core of your design should focus on the 80/80.'
