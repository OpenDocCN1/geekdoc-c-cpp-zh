  md: '# Simulating an Alarm System


    programmers working for many months, will require a fully articulated architecture
    than a quick-and-dirty application written in one day by a single programmer.


    This hour focuses on the size of large, complex programs that will be expanded
    and enhanced over many years. Many programmers working at the bleeding edge of
    technology; they tend to write programs whose complexity pushes at the limits
    of their tools and understanding. In many ways, C++ was designed to extend the
    complexity that a programmer or team of programmers can manage.


    A simulation is a computer model of part of a real-world system. There are many
    reasons to build a simulation, but a good design must start with an understanding
    of what questions you hope the simulation will answer.


    As a starting point, examine this problem: You have been asked to simulate the
    alarm system for a house. The house is a center-hall colonial with four bedrooms,
    a finished basement, and an under-the-house garage.


    The downstairs has the following: three in the kitchen, four in the dining room,
    one in the half-bathroom, two each in the living room and the family room, and
    two small windows next to the front door. All four bedrooms are upstairs; each
    bedroom has two windows except for the master bedroom, which has four. There are
    two baths, each with one window. Finally, there are four half-windows in the basement
    and one window in the garage.


    Normal access to the house is through the front door. In addition, the kitchen
    has a sliding glass door, and the garage has two doors for the cars and one for
    easy access to the basement. There is also a cellar door in the backyard.


    All the windows and doors are alarmed, and there is a panic button on each phone
    and one next to the bed in the master bedroom. The grounds are alarmed, as well,
    although these alarms are carefully calibrated so that they are not set off by
    small animals or birds.


    A central alarm system in the basement sounds a warning chirp when the alarm has
    tripped. If the alarm is not disabled within a set amount of time, the police
    are called. If a panic button is pushed, the police are called immediately.


    The alarm is also wired into the fire and smoke detectors and the sprinkler system.
    The alarm itself is fault tolerant, has its own internal backup power supply,
    and is encased in a fireproof box.'
