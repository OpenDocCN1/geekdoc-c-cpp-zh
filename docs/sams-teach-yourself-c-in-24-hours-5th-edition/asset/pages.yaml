    # Character Arrays


    Familiarity with arrays makes it possible to work with longer text than the single
    characters represented by the char data type. A string is a series of characters.
    The only strings you''ve worked up to this point have been string literals used
    in std::cout statements:


    ```

    std::cout << "Solidum petit in profundis\n";

    ```


    In C++, a string is an array of characters ending with a null character, a special
    character coded as ''\0''. You can declare and initialize a string array like
    any other:


    ```

    char yum[] = {''Z'', ''o'', ''m'', ''b'', ''i'', ''e'', ''E'', ''a'', ''t'', ''t'',
    ''B'', ''r'', ''a'', ''i'', ''n'', ''s'', ''\0''};

    ```


    The last character, ''\0'', is the null character that terminates the string.

    Because this character-by-character approach is difficult and admits too many
    opportunities for error, C++ enables a shorthand form of string initialization
    using a literal:


    ```

    char yum[] = "Zombie Eat Brains";

    ```


    This form of initialization doesn''t require the null character; the compiler
    adds it automatically.

    The string "Zombie Eat Brains" is 18 bytes, including null.

