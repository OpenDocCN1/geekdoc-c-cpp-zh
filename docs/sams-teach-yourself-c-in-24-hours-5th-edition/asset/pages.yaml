    # Summary


    If this is your first introduction to class inheritance, you might find yourself
    wondering if the work of creating base classes and derived classes is worth the
    effort. Where to put member variables and functions among a set of related classes
    can take some time and planning.


    The reason to do the work is that it makes your classes more powerful and reusable.


    When you''ve designed a set of related classes well, you can extend a base class
    and design a new derived class much easily. You only have to focus on the things
    that make the new class different from its parent.


    # Q&A


    +   Q. Are inherited members and functions passed along to subsequent generations?
    If Dog derives from Mammal and Mammal derives from Animal, does Dog inherit Animal''s
    functions and data?


    +   A. Yes. As derivation continues, derived classes inherit the sum of all the
    functions and data in all their base classes.


    +   Q. Can a derived class make a public base function private?


    +   A. Yes, and it will then remain private for all subsequent derivatives.'
