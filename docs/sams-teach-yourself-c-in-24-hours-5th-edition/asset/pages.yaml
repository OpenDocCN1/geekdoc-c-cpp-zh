    # C++ and Object-Oriented Programming


    The essence of object-oriented programming is to treat data and the procedures
    that act upon the data as a single object—a self-contained entity with an identity
    and characteristics of its own.


    The C++ language fully supports object-oriented programming, including three concepts
    that have come to be the pillars of object-oriented development: encapsulation,
    inheritance, and polymorphism.


    # Encapsulation


    When the aforementioned bike engineer creates a new bicycle, she connects together
    component pieces such as the frame, handles, wheels, and a headlight. Each component
    has certain properties and can accomplish certain behaviors. She can use the headlight
    without understanding the details of how it works, as long as she knows what it
    does.


    To achieve this, the headlight must be self-contained. It must do one well-defined
    thing and it must do it completely. Accomplishing one thing is called encapsulation.


    All the properties of the headlight are encapsulated in the headlight object.
    They are not spread out through the bicycle.


    C++ supports the properties of encapsulation through the creation of user-defined
    types called classes. A well-defined class acts as a fully encapsulated entity
    that is used as an unit or not at all. The inner workings of the class should
    be hidden on the principle that the programs that use a well-defined class do
    not need to know how the classes work. They only need to know how to use it. You
    learn how to create classes in Hour 8, "Creating Basic Classes."


    # Inheritance and Reuse


    Now we''re starting to learn little more about our bike engineer. Let''s call
    her Penny Farthing. Penny needs her new bicycle to hit the market quickly—she
    has run up enormous gambling debts to people who are not known for their patience.'
