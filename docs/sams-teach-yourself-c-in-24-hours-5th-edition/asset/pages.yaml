  md: '# Overloading Functions


    Overloading makes it possible to create a function that performs a similar task
    on different types of data without creating unique names for each function. If
    your program needs to average numbers expressed in different formats, it could
    have functions named averageInts(), averageDoubles(), and averageFloats().


    To simplify, an overloaded function called average() could be used with these
    types:


    ```

    int average(int, int);

    long average(long, long);

    float average(float, float);

    ```


    You just pass in the right data when calling average() and the proper function
    is called.


    # Inline Functions


    When you define a function, the C++ compiler creates just one set of instructions
    in memory. Execution of the program jumps to those instructions when the function
    is called and jumps back after the function returns to the next line in the calling
    function. If the program calls the function 10 times, it jumps to the same set
    of instructions each time. There is only one copy of the instructions that make
    up the function, not 10 copies.


    Some performance overhead is required to jump in and out of functions. When a
    function consists of a small number of statements, you can gain efficiency if
    the program runs faster if the jump can be avoided.


    If a C++ function is declared with the keyword inline, the compiler does not create
    a real function. Instead, it copies the code from the inline function directly
    into the place where the function was called. It is just as if you had written
    the statements of the function right there.


    If an inline function is called 10 times, the inline code is copied all 10 times.
    The tiny improvement in speed could be swamped by the increase in size of the
    executable program.


    The inline keyword is a hint to the compiler that you would like the function
    to be inline. Current compilers are free to ignore the hint and make a real function
    call. On their own making C++ code execute quickly, so there''s so little to be
    gained from declaring a function inline.


    The inline keyword is used in the function prototype:


    ```

    inline int double(int);

    ```


    > By the Way'
