    their arguments, a practice called function overloading. The functions must have
    different data types for parameters, a different number of parameters, or both.
    Here are prototypes for overloaded functions:


    ```

    int store(int, int);

    int store(long, long);

    int store(long);

    ```


    store() is overloaded with three different parameter lists. The first and second
    differ in the data types and the third in the number of parameters.


    The parameters the function is called with determine which function will be called.

    The return types for overloaded functions do not factor into whether they are
    different. Several overloaded functions can have the same return type, as the
    preceding example, or different types. You can''t overload by making the return
    different, however. The parameter types or number of parameters must differ.


    Function overloading is also called function polymorphism.'
