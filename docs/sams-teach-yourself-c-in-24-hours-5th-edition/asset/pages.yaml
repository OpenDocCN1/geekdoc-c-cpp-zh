    # How Virtual Member Functions Work


    When a derived object, such as a Dog object, is created, the first constructor
    for the base class is called, and then the constructor for the derived class is
    called. Figure 17.1 shows what the Dog object looks like after it is created.
    Note that the Mammal part of the object is contiguous in memory with the Dog part.


