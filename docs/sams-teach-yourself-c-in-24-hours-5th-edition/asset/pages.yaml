  md: '# HOUR 23


    # Creating Templates


    What You''ll Learn in This Hour:


    +   - What templates are and how to use them

    - Why templates supply a better alternative to macros

    - How to create class templates


    # What Are Templates?


    In Hour 19, “Storing Information in Linked Lists,” you learned how to make a linked
    list. Your linked list was encapsulated: The list knew only about its head pointer;
    the head pointer delegated its work to internal pointers, and so forth.


    One problem with the linked list was that it only knew how to handle the particular
    data types it was created to work with. If you wanted to put anything else into
    your linked list, you couldn''t it. You couldn''t, for example, make a linked
    list of Car objects, or of Cat objects, or any other object that wasn''t of the
    same type as those in the original list.


    The old way of solving this problem was to create new versions of the object for
    each new data type. a List base class and derive from it the CarList and CatsList
    classes. You could then cut and paste most of the Linkedlist into the new CatsList
    declaration. Next week, however, when you wanted to make a list of Car objects,
    you have to make a new class and repeat most of the same code.


    Neither of these are satisfactory solutions. Over time, the List class and its
    derived classes will have to be extended. Making sure that all the changes are
    propagated to all the related classes will then be a nightmare.'
