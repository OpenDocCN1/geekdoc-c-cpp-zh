  md: '# Using the new Keyword


    For this work, you must be able to create a pointer to an area on the heap. The
    following sections describe how to do this.


    You allocate memory on the heap in C++ by using the new keyword. new is followed
    by the type of the object you want to allocate so that the compiler knows how
    much memory is required. Therefore, new unsigned short int allocates 2 bytes on
    the heap, and new long allocates 4.


    The return value from new is a memory address. It must be assigned to a pointer.
    To create an unsigned short on the heap, you might write the following:


    ```

    unsigned short int *pPointer;

    pPointer = new unsigned short int;

    ```


    You can, of course, initialize the pointer at its creation:

    unsigned int *pPointer = new unsigned short int;


    In either case, pPointer now points to an unsigned short int on the heap. You
    can use this like any other pointer to a variable and assign a value into that
    area of memory:

    *pPointer = 72;


    This means "put 72 in "pPointer" or "assign the value 72 to the area on the heap
    to which pPointer points."


    If new cannot create memory on the heap—since memory is a limited resource—it
    throws an exception. .Exceptions are error-handling objects created in detail
    in Hour 24, "Dealing with Exceptions and Error Handling."


    > Some compilers return the null pointer. If you have an older compiler, check
    your pointer for null each time you request new memory. All modern compilers can
    be counted on to throw an exception.


