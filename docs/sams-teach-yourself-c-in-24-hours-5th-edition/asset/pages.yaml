    # TABLE 4.1 Operator Precedence


    | Level | Operators | Evaluation Order |

    |---|---|---|

    | 1 (highest) | ( ) [ ] fi :: | Left to right |

    | 2 | * & ! ++ - sizeof new delete | Right to left |

    | 3 | .* fi * | Left to right |

    | 4 | / | Left to right |

    | 5 | + | Left to right |

    | 6 | << >> | Left to right |

    | 7 | < = >= | Left to right |

    | 8 | == != | Left to right |

    | 9 | & | Left to right |

    | 10 | ^ | Left to right |

    | 11 | | | Left to right |

    | 12 | && | Left to right |

    | 13 | !! | Left to right |

    | 14 | ? | Right to left |

    | 15 | * = += - = %= << >> &= ^ = ! | Right to left |

    | 16 (lowest) | , | Left to right |


    You are introduced to most of these operators in later hours. Operators are evaluated
    from top of the table down. Operators with the same precedence are evaluated from
    left to right or right to left, as indicated in the table.


    Looking at the table, you can see that the multiplication operator * and division
    operator / have higher precedence than the addition operator + subtraction


