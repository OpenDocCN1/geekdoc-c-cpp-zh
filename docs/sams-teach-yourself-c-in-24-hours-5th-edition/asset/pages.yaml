    Every class member function has a hidden parameter: the this pointer. this points
    to the individual object. Therefore, in each call to GetAge() or SetAge(), the
    pointer for the object is included as a hidden parameter.


    The job of this pointer is to point to the individual object whose function has
    been invoked. Usually, you don''t need this; you just call functions and set member
    variables. Occasionally, you may need to access the object itself (perhaps to
    return a pointer to the current object). It is at that point that this pointer
    becomes useful.


