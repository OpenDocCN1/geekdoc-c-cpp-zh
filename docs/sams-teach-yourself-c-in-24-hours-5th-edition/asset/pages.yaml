  md: '# HOUR 2: Organizing the Parts of a Program


    The instructions that make up a computer program are called its source code.


    In time, higher-level languages were introduced such as BASIC and COBOL. These
    languages made it possible for programmers to begin craft programs using language
    closer to actual words and sentences, such as Let go = 2.25. These instructions
    were translated back into machine language by tools that were either interpreters
    or compilers.


    An interpreter-based language such as BASIC translates a program as it reads each
    line, acting on each instruction.


    A compiler-based language translates a program into what is called object code
    through a process compiling. This code is stored in an object file. Next, a linker
    transforms the object file into an executable program that can be run on an operating
    system.


    Because interpreters read the code as it is written and execute the code on-the-fly,
    they''re easy for programmers to work with. Compilers require the more inconvenient
    extra steps of compiling and linking programs. The benefit to this approach is
    that the programs run significantly faster than programs run by an interpreter.


    For many years, the principal goal of computer programmers was to write short
    pieces of code that would execute quickly. Programs needed to be small because
    memory was expensive, and they needed to be fast processing power also was expensive.
    As computers became cheaper, faster, and more powerful and the cost and capacity
    of memory have fallen, these priorities diminished in importance.


    Today, the greatest expense in programming is the cost of a programmer''s time.
    Modern languages as C++ make it easier to produce well-written, easy-to-maintain
    programs that can be extended and enhanced.


    # Styles of Programming


    As programming languages have evolved, languages have been created to cater to
    different styles of programming.


    In procedural programming, programs are conceived as a series of actions performed
    on a set of data. Structured programming was introduced to provide a systematic
    approach to organizing these procedures and managing large amounts of data.


    The principle idea behind structured programming is to divide and conquer. Take
    a task that needs to be accomplished in a program, break it down into a set of
    smaller component tasks. If any of those tasks are still too compli'
