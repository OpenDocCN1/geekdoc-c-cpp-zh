  md: '# Combining Operators


    It is not uncommon to want to add a value to a variable and then to assign the
    result back into the variable. The following expression adds 10 to the value of
    a variable named score:


    ```

    score = score + 10;

    ```


    This expression takes the existing value of score, adds 10 to it, and stores the
    result in score.


    This can be written more simply using the += self-assigned addition operator:


    ```

    score += 10;

    ```


    The self-assigned addition operator += adds the r-value to the l-value, and then
    assigns the result to the l-value. There are self-assigned subtraction (-), division
    (/), multiplication (*=), and modulus (%)= operators, as well.


    These self-assigned operators do the same thing as longer expressions, so either
    form can be used at your discretion.


    # Increment and Decrement Operators


    The most common value to add or subtract from a variable is 1. Increasing a variable
    by 1 is called *incrementing*, and decreasing it by 1 is called *decrementing*.
    C++ includes ++ increment operator and -- decrement operator to accomplish these
    tasks:


    ```

    score++;

    ```


    ```

    zombies--;

    ```


    These statements increase score by 1 and decrease zombies by 1, respectively.
    They are equivalent to these verbose statements:


    ```

    score = score + 1;

    ```


    ```

    zombies = zombies - 1;

    ```


    The ++ operator is said as "plus-plus" and -- as "minus-minus."


    > Now that you''ve been introduced to the increment operator, the name C++ should
    make more sense. The C++ programming language was intended by creator Bjarne Stroustrup
    as an improvement over the C language. He named it like it, putting the increment
    operator in its name and causing countless people over the years to wonder why
    it''s called "C-plus" rather than "C-plus"


