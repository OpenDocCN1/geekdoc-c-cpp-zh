    \ is preferable.\n\n# Pointer, Pointer, Who Has the Pointer?\n\nWhen your program\
    \ allocates memory on the heap, a pointer is returned. It is imper-\ntative that\
    \ you keep a pointer to that memory, because after the pointer is lost, the\n\
    memory cannot be deleted and becomes a memory leak.\n\nAs you pass this block\
    \ of memory between functions, one of the functions \"owns\" the\npointer. Typically,\
    \ the value in the block is passed using references, and the function\nthat created\
    \ the memory block is the one that deletes it. But this is a general rule, not\n\
    an ironclad one.\n\nIt is dangerous for one function to create space in memory\
    \ and then to free it,\nhowever. Ambiguity about who owns the pointer can lead\
    \ to delete or deleting it. Either can cause serious prob-\\lems in your program.\
