- "# C++：初学者指南，通过真实示例快速轻松掌握 C++ 编程基础（C++ 编程步步阶指南）\n\n\n\n![](img/rsrc7.jpg)\n\n\n\n\
  \n\n\n\n本书内容在未经作者或出版者许可的情况下，不得复制、复制或传输。在任何情况下，作者或出版者对因使用本书内容而导致的任何损害不承担责任。**法律声明**：本书受版权保护。本书仅供个人使用。未经作者或出版者的同意，您不得修改、发行或使用本书的任何部分。**免责声明**：请注意本书中的信息仅供教育目的。已尽确保信息的准确和最新，不作任何形式的明示或暗示。阅读本文的读者同意，作者对使用本文内容引起的任何直接或间接损失不承担责任。感谢你购买\
  \ C++。接下来的章节将讨论入门该语言所需的所有部分。有很多不同的语言，而 C++ 与其他语言相比通常被认为稍微难一点。在指南的探索过程中，你会发现它实际上是一门非常棒的语言。\n\
  \n## 引言\n在本指南中，我们将学习如何使用条件语句、C++ 循环、数组、继承、类以及更多。这将确保我们能够处理这里需要的许多代码。我们将通过查看如何在该语言中进行基础调试来结束指南。\n\
  \n对于初学者来说，有时代码不会按照你希望运行，或者会出现需要修复的错误，这可能会困难，因为他们想要处理这些代码并让程序运行，但不确定如何修复错误。本章将介绍如何修复这些错误并将其减少到最低。\n\
  \n当我们使用 C++ 语言时，可以做很多。在编码世界，很快就能看到这门语言能够做什么以及它自带的所有应用程序。它是最好的编程语言之一，确保我们能够在任何处理的程序中获得想要的结果。当你准备好学习\
  \ C++ 语言基础并快速进行自己的编码时，请务必查看本指南以帮助入门。再次感谢选择本书！我们尽力确保它包含尽可能用的信息，请享用！\n\n# 第 1 章：什么是\
  \ C++ 语言？\n当我们需要寻找新的编程语言来工作时，如果想选择一个具有深厚历史和力量的语言，那么使用 C++ 语言绝对不会出错。事实上，`C++` 是原始编码语言之一。在它之前有几个，但不多，它包含了你寻找的许多传统编码形式。由于这门语言已经存在很久，它已经有了非常大的粉丝，严肃的程序员都会花时间了解它。\n\
  \n正如你猜的那样，`C++` 将是一种旨在帮助应用程序及更多的编程语言。像许多其他编码语言一样，`C++` 将是一门面向对象的语言。这意味着通过这种语言，一切都围绕对象展开。这现在可能没意义，但你会发现当你编写所需的代码时，它实际上让整体变得更简单。它将确保一切保持原位，允许你重用代码部分以及更多。这基本上会让编写你喜欢的代码变得容易，并帮助解决其他语言面临的一些主要问题。\n\
  \n`C++` 将是一门非常适合学习的编码语言，因为它的原始设计具有很高的灵活性。还有极快的速度，这将帮助我们确保可以在许多项目中使用这种语言。以后我们将花时间研究如何处理这些，但只需说，当我们使用\
  \ `C++` 语言时，我们可以做很多事情。\n\n## 我能用 C++ 做些什么\n当我们使用 `C++` 语言满足你自己的编程需求时，我们可以做很多事情。在编码世界中，很快就能看到这门语言能够做什么以及随附的所有应用程序。你可以使用\
  \ `C++` 语言的一些不同操作包括：\n\n\n\n\n\n## C++ 的应用\n\n1. **预包脚本（Prepackaged scripts）**：我们首先要看的是预包脚本。这些脚本对初学者非常重要，因为它们能让我们更轻松地练习在本指南中将要介绍的不同技术。这些本质上是预先打包好的代码，以便你无需自己设置所有内容即可进行学习。\n\
  \n2. **创建视频游戏**：你还会发现 `C++` 编程语言是许多你喜欢的视频游戏所随带的代码语言。虽然我们在本指南中不会花费大量时间教你如何实现这一点，但你会发现\
  \ `C++` 语言拥有足够的实力和耐久性，能够迅速处理这些视频游戏中发生的更复杂的任务。\n\n3. **网页**：我们甚至在许多企业用于接触客户的网站上看到\
  \ `C++` 语言。`C++` 用于这些网页的原因是它易于操作，并且能确保你用它创建的任何网站都是快速且易于使用的。甚至可以使用 `C++` 语言来帮助我们在网站上添加一些想要的交互式功能。我们熟悉并喜爱的许多热门网站已经在使用这种技术来保持运行。\n\
  \n4. **手机应用**：我们甚至可以在某些喜用的手机应用中看到 `C++` 语言。如果你在手机上工作并使用那里可用的一些应用，你可能会发现使用 `C++`\
  \ 语言可以让这一切变得更好。这种语言将成为我们极速创建理想的智能手机应用的绝佳方式。\n\n正如我们所看到的，使用 `C++` 语言在我们自己的需求方面有很多应用，而学习这门语言的本质以及我们如何使用它，将使它对我们的需求变得更有价值。务必查看使用这种语言的各种方式，并了解它的重要性，以便你能够更好地充分利用它的价值。\n\
  \n## C++ 语言的历史\n\n`C++` 是一门历史底蕴丰富的编程语言，因为它从字面上就是编程语言的开端。它始于计算机编程还未成为主流之前，始于人们开始靠黑客技术维持生之前之前。它于电话破解时期，即\
  \ 1979 年。这门语言的历史可以追溯到那里。没有没有其他编程语言可以追溯到这么远。\n\n比雅恩·斯特斯特鲁普（Bjarne Stroustrup）当时正在写博士论文，他决定使用一种名为\
  \ `Simula` 的编程语言。这种语言是计算机时代最早的编程语言之一。然而，它运行非常慢而且充满了 Bug。\n\n斯特斯特鲁普提出了 `C with Classes`（带类的\
  \ C 语言）的想法。这是一种比 `Simula` 快得多的编程语言。`C with classes` 后来变成了 `Cfront`，它加速了语言创建的过程。然而，当\
  \ `C++` 出现时，`Cfront` 被远远甩在了后面，因为它在语言中加入了编译器，使其比当时的任何其他项目语言都更易用、速度更快。\n\n从那时起，出现了许多注释版的参考指南以及对该语言的更新，使其变得更好、更快速、也更易用。《大傻来说学\
  \ C++》（`C++ for Dummies`）是关于这门语言的一本流行指南。\n\n`C++` 是今天最流行的语言之一。这门语言对于许多行业都是最佳选择，因此，与其花费大量时间开发一门新语言，他们直接将\
  \ `C++` 适应到许多不同的领域，因为它是最通用的。\n\n## 为什么这门语言如此流行？\n\n我们需要考虑的另一个问题是，为什么这种特定的编码语言会如此流行。世界上有很多编程语言可用，这让我们更加好奇：在有这么多选择的情况下，程序员为什么会选择其中一种（无论是\
  \ `C++` 还是其他语言），而不是其他的语言？\n\n首先注意到的是，许多程序员会喜欢使用 `C++` 语言工作，因为它内置了许多速度和灵活性。与现有的某些选项相比，这确实是一门较老的语言，但它仍然拥有完成任务所需的实力和速度，并在我们开始时为我们提供我们想要创建的应用程序或其他程序。\n\
  \n我们还会注意到，`C++` 语言是一门面向初学者的语言。在刚开始时它看起来可能有点困难。但一旦你掌握了一些编码基础知识，你就会发现它是一门容易上手的语言，甚至可能帮助你学习其他几种编码语言的基础知识。\n\
  \n除了上述优点外，你会发现，如果你正在寻找一种不仅限于计算机和桌面级电脑的编码语言，那么 `C++` 语言是一个很好的关注点。虽然当你使用电脑时，它可以编写一些精彩的代码并帮助你完成诸如创建自己的网站等任务，但还有其他选项，例如智能手机上的应用，`C++`\
  \ 语言也能同样出色。\n\n当然，这些只是为什么许多人与其他语言相比更喜欢使用这门语言的几个大原因。这门语言还有许多其他优点，这就是为什么有许多人对学习它并掌握它感兴趣。我们将看到的\
  \ `C++` 语言的其他优点还包括：\n\n1. **它带有一个大型库**：由于 `C++` 语言已经存在了一段时间，这门语言将为我们提供许多函数和其他工具。这些工具供我们使用，以便我们挑选想要处理的代码，即使在学习新知识时也能节省时间。你也可以使用这个库来帮助编写你自己的代码。\n\
  \n2. **它可以与其他语言协同工作**：你会喜欢的这门语言的另一个优点是，它可以与其他语言协作，为你的代码添加更多功能和力量。这将更容易扩展你想要处理的项目数量，并可以从一种编码语言向另一种语言中添加部分，通过你编写的代码创造出真正惊人的成果。\n\
  \n3. **适用于许多项目**：大多数其他编程语言将只关注一或两个小项目。例如，使用 `JavaScript` 意味着你将只处理网站。但通过 `C++`，你可以利用它来帮助许多不同的项目。无论你是想做网站、创建新程序，还是进行编程的其他事情，你都可以在\
  \ `C++` 的帮助下完成。\n\n4. **快速且可靠**：如果你用过过去流行的其他一些编码语言，你会发现它们并不总是最可靠。信息可能会丢失，或者它们的启动方式不符合你的预期。如果你想要一种一次性成功且可靠的东西，那么选择\
  \ `C++` 是一个好主意。\n\n5. **C++ 可以为我们提供巨大的力量**：那些想要花时间进行编码和编程，并希望在他们的工作中拥有更多力量的人会发现，使用\
  \ `C++` 语言是他们的一个很好的选择。与现有的其他语言相比，它将为帮助我们完成任务提供最强大的实力和速度。\n\n\n\n\n正如我们所看到的，对于某些编程需求，使用\
  \ C++ 语言有很多益处。而且这仅仅是我们使用它能做到的事情的开始。当你第一次接触这门语言时，它可能看起来比 Python 等其他语言用起来复杂一些，但它将带给你所需的所有动力和速度，甚至可以与你想要的其他编程语言协同工作。当你花时间学习这门语言以及你用它能做的一切事情时，你会发现学习\
  \ C++ 的基础并不那么困难，而且你很快就能掌握它们。现在我们已经了解了一些关于 C++ 语言的背景，让我们深入学习使用这种语言编码的一些基础知识，以及我们如何快速上手。\n\
  \n# 第 2 章：C++ 语言基础\n\n![Source, Codice, Software, Calcolatore](img/rsrc62.jpg)\n\
  \n接我们需要花费一些时间学习的是 C++ 语言自带的基础语法。如果我们想在这门语言上取得成功，了解语法的工作原理以及我们如何利用它为自己服务是至关重要的。语法对于这门语言非常重要，因为它能确保我们的代码是以编译器实际上能够理解的方式编写的。让我们来拆解\
  \ C++ 语法中的一些基础知识，以及我们如何在过程中利用它们取得优势。\n\n### C++ 注释\n\n列表上的第一个是 C++ 注释。当我们想在代码内部给自己留下信息或笔记时，这些注释非常好用，而不会实际影响代码的运行效果。这些注释还可以帮助阅读代码的人，因为它们可以帮助他们理解代码特定部分正在发生什么。作为一个初学者，你可能会发现代码中有很多这样的注释，你应该根据需要自由地使用它们。\n\
  \n这些注释在引导你实现代码中想要的目标方面非常有用。而且你可以随心所欲为代码添加任意数量的注释。不过，最好的办法是保持它们最少化，因为如果注释太多，会让代码变得杂乱。\n\
  \n你用于创建这些注释并告诉编译器此处是注释的符号包含了 `//` 符号。程序会看到该符号并直接跳过它，因此你的代码不会受到任何干扰，并且仍然会按照你想要的方式运行。\n\
  \n在使用 C++ 语言时，你还可以编写稍微长一点的注释，这是其他编码语言可能不具备的。当你需要编写双行或多行代码时，你会使用 `/*` 开始注释，使用 `*/`\
  \ 结束注释。当编译器看到这些符号时，它会停止读取直到第二个部分出现。在那个点，它将再次开始读取代码。\n\n### C++ 数据类型\n\n就像你在此过程中可能使用的其他某些编码语言一样，在\
  \ C++ 代码中也会出现很多数据点。例如，你经常会处理变量，它们只是你在计算机内存中预留的区域，以便代码的不同部分保持安全。在处理 C++ 语言时，我们可以关注很多数据点，这些数据点包括：\n\
  \n1. 布尔型 (Boolean)\n2. 双精度浮点型\n3. 浮点型\n4. 整数型\n5. 字符型\n6. 无值 (Valueless)\n7. 宽字符型\n\
  \n\n\n\n\n# C++ 中换起行的重要性\n\n当我们使用这种语言编写某些代码时，保持适当的行间距至关重要。将代码写在一行长代码中并不是一个好主意，尽管如果我们写得正确，编译器能够读取它。但对于我们来说，这非常难以阅读，找出错误所在的地方也会变得非常困难。这就是为什么我们需要专注于将正在编写的代码行分开，以便使其更容易阅读。\n\
  \n为了了解它是如何运作的，请考虑以下内容：\n```cpp\n{ cout << Try This;>> endl; << Today I ate Pizza\
  \ and did Math;>> endl; <<6=(7-1);>> endl; << That is what I learned today;>> endl;\
  \ return 0}\n```\n这一行[代码块]在技术上是正确的。你可以将其放入编译器，它将正常地读取所有内容。然而，阅读这些内容真的非常困难，尤其是如果你是编程领域的完全的新手。这一个特定的代码可能没那么糟，但如果你遇到更长的代码，几乎无法弄清楚发生了什么，甚至无法发现你可能犯的错误。\n\
  \n还有另一种编写代码的方法。它的含义完全相同，编译器的方式也一样，但它更好，因为其他程序员以及你自己都能更轻松地阅读代码。一种更好的编写代码的方法包括：\n\
  ```cpp\n{ cout << Try This;>> endl; <<Today I ate Pizza and did Math;>> endl; <<6=(7-1);>>\
  \ endl; << That is what I learned today;>> endl; return 0}\n```\n正如我们在第二个示例中看到的，它与第一个相同，但对我们来说阅读起来要容易得多。它包含了与第一个完全相同的代码部分，但更容易阅读，并且更符合我们的逻辑。良好的编程习惯会让我们选择第二种方案而不是第一种，因为更更容易阅读和理解，即使在编写代码时\
  \ C++ 编译器在技术上完全能够读取并接受这两种写法。\n\n### C++ 函数\n\n我们还需要看一看在使用 C++ 语言时会遇到的一些函数。函数非常简单，它只是为了执行某项任务而的一组语句。你在\
  \ C++ 中编写的每个程序都至少有一个函数，可以被称为 `main()` 函数，但你可能需要添加更多函数，以使他们的代码按照我们想要的方式运行。\n\n你可以通过多种不同的方式实现这一点。首先，我们可以选择根据我们希望它运行的方式将代码拆分为几个函数。你如何决定拆分代码以及使用多少函数取决于你以及你试图在代码中编写的内容。但大多数程序员会以这种方式拆分，使得每个函数都处理自己的任务。\n\
  \n函数声明会告诉编译器函数名、随之来的参数以及我们将看到的返回类型。但请记住，我们看到的函数定义将在该函数的实际体中找到。\n\n我们在 C++ 库中看到的标准库将为我们提供许多内置在程序中的函数，我们可以在任何需要的时候调用它们。例如，如果我们正在使用\
  \ `strcat()` 函数，可以使用它来帮助我们连接两个字符串。然后我们可以使用 `memcpy()` 来帮助我们将内存的某一个位置复制到另一个位置。这些只是你可以处理的不同类型的函数示例，你会发现每种函数的工作方式都是相似的。\n\
  \n考虑到这一点，我们需要进一步，实际上看看我们如何在 C++ 中应用函数。你用于定义函数时可以使用的代码将包括：\n```cpp\nReturn_type function_name\
  \ (parameter list ) {Body of the function}\n```\n这些函数定义由函数头和函数体组成。函数的各个部分包括内容：\n\
  \n*   **返回类型 (Return type)**：你正在处理的函数可能会返回一个值，你将使用 `return_type` 的值来返回某些内容。某些函数可以执行你想要的操作而不向你返回值。使用我们上面使用的语法；你将得到一个\
  \ `void` 结果。\n*   **函数名 (Function name)**：这是你给函数起的名字。当你将函数名与参数相加时，你就得到了所谓的函数签名。\n\
  *   **参数 (Parameters)**：参数是一个占位符。当你调用函数时，你将一个值传递给参数。这个值将称为实际参数或参数。参数列表将能够引用函数的参数数量、顺序和类型。编写一个没有任何参数的函数也是可能的。\n\
  *   **函数体 (Function body)**：最后，函数体将包含一组能够定义函数所执行内容的语句。\n\n在很多时候，我们将能够使用函数来帮助完成某些代码部分，并确保我们准备好处理。请确保练习这些函数，看看它们如何满足我们的需求。\n\
  \n### 修饰符类型 (Types of Modifiers)\n\n每当你在 C++ 中处理某些代码时，你会发现可以使用 `char`、`double` 和\
  \ `int`，以便让其前面的修饰符出现在那里。我们在这里讨论的修饰符将用于帮助我们更改基本类型的含义，使其适应我们试图创建的任何程序或情况。会有不同类型的数据修饰符可以使用。这些包括\
  \ `signed`、`unsigned`、`long` 和 `short`。\n\n这四种修饰符适用于我们拥有的任何整数基本类型。可以使用 `signed`\
  \ 和 `unsigned`，例如用于 `char`，然后 `long` 可以用于 `double`，例如。C++ 还会让我们更容易使用简写符号来帮助处理这些整数。这意味着它们可以使用这些单词，而不需要添加\
  \ `int` 部分，因为这在编码中是隐含的。\n\n还有不同类型的限定符来让你的 C++ 代码工作。为了给前面的变量提供额外信息，你可以使用的以下限定符类型包括：\n\
  \n*   **常量 (Const)**：带有 `const` 的对象在程序执行期间将无法被更改。\n*   **volatile (Volatile)**：`volatile`\
  \ 修饰符会告诉编译器你可以更改值，但这些更改可能不是由程序显式指定的。\n\n\n\n\n\n`Restrict`：一个被 `restricting` 限定的指针，最初是访问其所指向对象的唯一手段。\n\
  \n### C++ 中的异常处理\n\n当我们开始学习 C++ 语言时，我们需要关注的下一件事就是如何处理在你编写的代码中可能会出现的某些异常。异常是在你在执行自己编写的代码或程序时出现的某种类型的问题或故障。\n\
  \nC++ 异常的发生是针对某种异常情况的响应，这种情况通常在程序尝试运行你编写的某些代码时发生。然而，这些异常中最常见的类型是在用户尝试除以零时被抛出的。在这个过程中，我们还可以处理其他选项。\n\
  \n异常在我们编写的一些代码中是非常有用的，因为它们可以确保你将控制权从程序的某个部分转移出去，以便你能够将它转移到另一个部分。C++ 中发生的异常是基于三个主要的关键字构建的，包括\
  \ `try`、`catch` 和 `throw`。让我们来看看我们如何使用每一个关键字，以及它们在你的代码中是如何按预期运行的。\n\n*   **Throw（抛出）**：你可以使用的第一个关键字是\
  \ `throw`。当问题出现时，程序将抛出一个异常。这可以通过简单地使用 `throw` 关键字来实现。\n*   **The catch（捕获）**：程序可以在程序中你想处理问题的地方通过异常处理程序来捕获异常。如果你使用\
  \ `catch` 关键字，它会告诉程序你想要捕获该异常。\n*   **Try（尝试）**：当你使用 `try` 关键字时，它会识别一个可以激活特定异常的代码块。当你使用这个关键字时，它后面至少会跟着一个\
  \ `catch` 块。\n\n假设你的代码块能够为你抛出一个异常，那么一个方法就可以配合 `catch` 和 `try` 这另外两个关键字来捕获该异常。这些关键字将被放置在最终产生异常的代码周围。这并不意味着这些异常总是会发生，但意味着它们是你需要在某些代码中至少需要关注一下的内容。\n\
  \n这些就是我们在处理某些 C++ 代码时需要关注的一些基础知识。这些都是你在在此程中想要处理的某些代码中会看到的内容，并且将确保你能够完成更多工作。尝试一下我们在本章中讨论的一些代码，并探索这些每一项是如何与基础知识协同工作的。\n\
  \n# 第 3 章：需要了解的 C++库\n\n![Business, Cellulare, Codici, Codifica](img/rsrc93.jpg)\n\
  \n使用 C++ 语言时，你会发现当需要使用这种语言进行你想要的代码编写时，有很多很棒的选择。有些人会批评这种语言，因为它看起来复杂得没必要，而且语法可能看起来老旧而晦涩。但有时我们在用\
  \ C++ 开发时发现的最大障碍是，它为我们提供的高级库访问权限不像我们在 Java 和其他类似语言中看到那么多。\n\n这并不意味着 C++ 语言及其标准库不能成为一个很好的工作工具。它将向我们展示如何使用许多算法和容器，这些容器对于你想要创建的许多应用程序都是用的。但你可能不会看到在某些与\
  \ C++ 类似的语言中可能预期看到的某些网络库、XML 库以及其他功能。\n\n在我们达到 `C++11` 更新之前，甚至还没有线程库的可能性。尽管如果我们想让应用程序具有扩展性，那么充分利用现代计算机上的所有核心是至关重要的。在编写你所拥有的代码某些情况下，这可能会成为一个问题。如果你正在用\
  \ C++ 编写一个庞大的应用程序，你可能会发现查看并利用现有的某些第三方库是很有用的。\n\n这就是为什么我们在这章中将花一点时间查看你可以使用的一些不同的库，它们有助于增强你使用\
  \ C++ 能做的事情，并确保你从尝试的某些编程中获得最大的收益。你可以选择立即下载并安装这些库中的一些，帮助你从你想做的这类编程工作中获得最大收益，或者你可以等到开始编写自己的代码时，这样你就可以看到这些库中特别是哪一个对你的帮助最大。\n\
  \n### 桌面 GUI\n\n我们将查看的第一个选项是当需要处理桌面 GUI 工作时你可以使用的的一些库。其中最优秀的一些工具包括：\n\n1.  **MFC**：它代表微软基础类（Microsoft\
  \ Foundation Classes），它能够封装 `COM` API 和 Windows，以帮助我们在使用 C++ 为 Windows 开发桌面应用程序时变得更加轻松。这个库在\
  \ Visual Studio 中有良好的支持，其中包含了一些视觉表单编辑器。而且它是免版税的，所以你可以在某些 Visual Studio 的原因中使用它。\n\
  2.  **Qt**：这是一个可以用于 GUI 开发的跨平台库，包含了一些更通用的类，以及一个 IDE。它有商业和开源使用的许可协议。\n3.  **wxWidgets**：这一个可能没有其他那些那么完善。但如果你正在寻找一种可以跨平台的免费解决方案，并且可以用于某些商业应用程序，那么这一个值得查看。\n\
  \n### Web 应用程序\n\n我们下一个想要处理的是如何使用 C++ 开发 Web 应用程序。开发 Web 应用程序并不是我们总是通过 C++ 尝试做的事情。但我们可以使用的一些选项可以确保我们能够完成这些任务。帮助\
  \ Web 应用程序的一些优秀的 C++ 库包括：\n\n1.  **CppCMS**：这是一个框架，有助于让 C++ 的 Web 开发变得方便。该网站将帮助你提供关于为什么使用\
  \ C++ 开发你的 Web 应用程序是很好的信息。\n\n现在，如果你真的是在尝试用 C++ 处理一个基础的嵌入式 HTTP 服务器，一种你可以适配以为服务提供配置和在线帮助的服务器，甚至对于主要目的不是通用\
  \ Web 应用程序的联网设备，那么在互联网上有一些这类简单 HTTP 服务器的示例供你查找。\n\n\n\n\n\n### 2. POCO::Net\n这个网络类将为我们提供一个比上面更高级的网络库。除了\
  \ `Boost ASIO` 中包含的一些基础网络协议外，它还将提供 `FTP`、`HTTP`、`DNS` 以及电子邮件的类，并支持 `SSL` 和 `TLS`。\n\
  \n### Web 服务\n当我们在使用 C++ 语言处理 Web 服务时，还会发现一些选项。一些最佳的选项包括：\n\n1. `gSOAP`：这是一个成熟且持续维护的工具包，将帮助我们支持\
  \ `REST` 和 `SOAP XML` Web 服务。\n2. `Casablanca`：这是一个较新的库，由微软创建，旨在帮助程序员提供一些所需的工具，以便在\
  \ `C++` 中访问和编写 `REST` 服务。尽管该库源于微软，但它支持除 Windows 之外的多个平台，包括 `Mac`、`Linux` 以及其他一些移动平台。\n\
  \n### 数据库\n有时你可能需要从数据库中收集 `C++` 编程所需的数据。如果你拥有正确的库或库包来完成工作，这会变得很容易。我们可以使用的、能够帮助处理这些数据库并完成任务的最佳\
  \ `C++` 库包括：\n\n1. `POCO::Data`：该命名空间下的类将与我们在 `Java` 和 `.NET` 中看到的数据库框架风格非常接近，它具有与数据库无关的抽象层，这可以帮助我们同时与多个数据库进行通信。它内部支持\
  \ `SQLite`、`ODBC` 和 `MySQL` 数据库。\n2. `OTL`：这个库将处理你需要的某些数据库，如 `ODBC` 和 `Oracle`，如果你正在寻找符合\
  \ `C++` 习惯的库，可能会对它感兴趣。这是因为该数据库选项的抽象是一个纯头文件（header-only）库，并且在接口上更具 `STL` 风格。\n\n\
  ### XML\n有时你可能需要处理现有的某些 `XML` 页面，你完全可以使用 `C++` 库来实现这一点。如果你知道如何让它满足你的需求，将两者结合使用可以编写出非常强大的代码。一些可以与\
  \ `C++` 配合并帮助我们处理所需 `XML` 的库包括：\n\n1. `POCO::XML`：这个类将为我们提供 `XML`、`DOM` 和 `SAX2`\
  \ 的写入器。它还可以借助 `Expat XML` C 语言库为我们提供解析。\n2. `Xerces C++`：这个库将迅速带我们进入一个非常大的 `XML`\
  \ 框架。除了 `SAX2` 和 `DOM` 之外，它还支持 `XML` 架构验证，并且通过构建在 `Xerces` 之上的辅助库，将持续提供你所需的支持。\n\
  \n同时，你可能对一些快速且轻量级的 `XML` 库感兴趣，这些库经过了修改，以同时帮助 `C++` 语言。我们可以使用的这类库包括 `RapidXML` 和\
  \ `TinyXML`。它们并不具备我们从 `XML` 需要的所有功能，但方便我们根据需要进行使用和集成。\n\n### JSON\n有时你也可能想处理 `C++`\
  \ 的 `JSON` 特性。这不像我们上面讨论过的其他部分那么常见，但学习如何让它满足我们的需求仍然非常重要。一些支持 `JSON` 的最佳 `C++` 库包括：\n\
  \n1. `JsonCPP`：这是一个用于 `C++` 语言的简单 `JSON` 读取器和写入器。\n2. `JSON Spirit`：这是另一个 `JSON`\
  \ 读取器和写入器。它是借助 `Boost Spirit` 解析器生成器构建的，因此你还需要配合 `Boost` 库，因为已经对该库有依赖。\n3. `POCO::JSON`：`POCO`\
  \ 也涵盖了这一部分并准备就绪。如果你想留在这个家族，它有一个专门的 `JSON` 命名空间。\n\n\n\n\n\n## 多线程\n\n这是你将要使用 C++\
  \ 的许多应用程序中一个非常实用的工具。它允许进程同时运行，而不是让它们排在队列中等待轮到。这可以加快任务完成的速度，并且对于你可能在程序中运行的很多游戏非常有用。\n\
  \n现有的某些可以帮助 C++ 更好地实现你所需的多线程操作的优秀库包括：\n\n- **C++ 11 和 14 标准库**：多线程是 C++ 标准库更新以包含对该功能支持的领域之一。一些基本功能被添加到\
  \ `C++11` 中，随后更多的类又又被添加到了 `C++14` 选项中。如果你还没有开始使用 `C++11` 版本，其他选项也是很好的工作选择。\n- **Boost\
  \ Thread**：这个库将作为一种实现，以不同的名称出现，它为那些使用旧版 C++ 编译器的用户提供了多线程功能的可能。\n- **POCO**：这个库将带有几个不同的类，可以帮助我们处理这一过程。这将包括一些用于管理任务的高级抽象。\n\
  \n正如我们在这里看到的，在处理想要用 C++ 语言处理的不同函数及更多内容时，你有许多不同的选项可以操作。当你能够将这些内容添加到我们正在编写的一些代码中，并确保它们以你想要创建程序的方式相匹配时，你将在这一过程中看到惊人的结果。看看这里提供的一些库，并根据你自己的需求看看哪一个最适合你工作。\n\
  \n# 第 4 章：如何在 C++ 中创建你的第一个程序\n\n![Sviluppatore, Programmatore, Tecnologia](img/rsrcBC.jpg)\n\
  \n现在我们已经有机会更深入地了解 C++ 程序以及它能为我们提供什么，是时候真正深入研究并查看这种语言自带的一些代码了。这将会是一个非常令人兴奋的章节，因为它将帮助我们开始把已经讨论过的代码付诸实用。\n\
  \n你可能已经对想要写的种种代码有了一些想法，但在这里我们需要从缓慢开始，了解一些基础知识，并在这里尝试一些事情，以确保我们处于同一个频道上并沿着正确的轨道上运行。我们在这里需要关注的第一件事是设置我们的环境。这个环境将非常重要，因为我们将在这里编写代码并让它为我们执行。\n\
  \n好消息是，这个过程很容易。如果你选择从原始网站下载 C++ 软件包，那么环境应该也会随之一起下载。如果你发现这个环境并没有完全提供你想要的内容，通常网上有很多选项供你选择，有时你还可以找到几个免费的可以下载并按你意愿使用的。\n\
  \n一旦你下载了想要在 C++ 中运行的环境，我们就该更熟悉地一下我们将要用这种语言做什么了，我们将开始编写我们的第一段代码。在这里我们将保持简单，所以不要担心对你来说会太难或太复杂。我们将使用一段“试试这个”代码，它只占用几行，但内部仍然包含了一些我们需要学习的语法部分。我们将用于开始此操作的代码包括：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main (){\n    cout << “Use\
  \ This One!\";\n    return 0;\n}\n``` （注：已将 \"court\" 修正为 \"cout\"）在编写这些内容时，你有几个选项可用。你可以选择在你的编译器中编写（它会在你的环境中可用），或者你可以选择将其编写并保存到计算机中。第二种方案有时很好，因为你就有了保存好的代码副本，可以在代码中需要时随时复制粘贴。\n\
  \n无论哪种方式，你都应该仔细考虑你想要使用的文本编辑器类型。大多数编辑器都是针对特定设备的，因此你需要寻找与你特定电脑匹配的一个。你可以选择的一些选项包括 Windows\
  \ 记本、`vim`、`vi`、`Brief` 和 `EMACS`。如果你想要一个可以在多个平台上使用的编辑器，那么 `vim` 和 `vi` 选项是最佳选择。\n\
  \n每当你编写这段代码中需要的某些代码时，你都需要先在文本编辑器中写出它们。完成后，编译器将是执行代码的部分，这样你就能看到它们是如何工作的。不过这是提前检查工作的一种好方法，以确保它看起来良好，并实现你一路上所预期。\n\
  \n### C++ 编译器\n\n就像我们已经过的某些文本编辑器一样，实际上也有几种不同类型的编译器供你选择。经常出现的问题是，虽然我们有很多选项可以选，但有很多是比程序员愿意支付的贵的。这是因为市上的很多编译器是针对你想用\
  \ C++ 进行的高级工作的。\n\n尽管如此，好消息是我们可以使用免费编译器。我们只需要小心确保获取的是我们需要的。你可能喜欢的这种编译器叫做 GNU。这在任何\
  \ Linux 操作系统上都是一个很好的选择，而且它可能已经存在于你的计算机。为了检查 GNU 编译器是否可用，你需要运行以下代码：\n\n```bash\n\
  g++ -v\n```\n\n如果编译器已安装，你应该会在屏幕上看到这些信息：\nUsing built-in specs.\nTarget: i386-redhat-linux\n\
  Configured with: ../configure –prefix=/usr …\nThread model: posixgcc version 4.1.2\
  \ 20080704 (Red Hat 4.1.2-46)\n\n如果你输入上面的代码但屏幕上没有出现该消息，这意味着你要么没有正确下载编译器，要么你的电脑上根本没有。\n\
  \n### 语法回顾\n\n当我们讨论 C++ 语言自带的语法时，我们需要回顾一些基础。这里的语言可以被定义为使用对象来帮助确保一切井然良好的程序，并允许你编写的代码调用并与其他对象通信。这种语言会有四个主要部分，我们需要留意以确保我们没有遗漏或没有将它们添加到我们的语法中。这四个部分包括：\n\
  \n- 类（Classes）：这些是语言的组织工具。它们可以被看作存放对象的盒子，并对相似的对象进行分类。你可以给类命名任何名称，但良好的编程习惯是将某些方面相似的对象放在同一个类中。\n\
  \n\n\n\n\n- **对象 (Object)**：`Objects` 是代码中具有状态和行为的实体。这些实体可以是颜色、纹理、形状等。你通常会将这些对象归类到相似的类（classes）中。因此，如果你有一个关于狗的类，你可以将不同类型的狗放在同一个类中。\n\
  - **方法 (Method)**：这是编程中用于描述行为的术语。你可以根据需要使用任意数量的方法。这是你操作数据的方式，而动作的执行将根据你正在处理的方法来完成。如果不使用正确的方法，你的程序将不知道它应该做什么。\n\
  - **实例变量 (Instant variable)**：此处应为 Instance，指的是你正在处理的单个对象。每个对象都将使用一组独特的变量进行分类，这些变量就像是对象的指纹一样。在创建对象时，你可以使用某些值为对象分配正确的变量。\n\
  \n\n\n这些就是你开始学习 C++ 语言时需要了解的基础知识。学习这些内容的含义以及如何编写我们在在本章中完成的某些代码，对于确保你以后能够真正开始编写你自己的代码至关重要。通过适当的练习和尝试，随着我们本指南的不断进行，你将准备好应对一些更复杂的代码类型。\n\
  \n# 第 5 章：使用条件语句，或 If 语句\n\n![编程、代码、开发、网络](img/rsrcCZ.jpg)\n\n在你所接触的所有不同编程语言中，有一件事可能非常有趣，特别是当我们谈论\
  \ C++ 语言时，就是决策控制，或者说条件语句。这些语句有很多不同的名称，但你会发现，这些是你可以关注的最棒的内容之一，这可以确保你编写的任何程序都能独立做出决策，而不需要程序员在场，也不需要预知它可能从用户那里接收到的所有可能的输入。\n\
  \n有时，你在编写或创建自己的程序时，你想要确保它能够为该程序做出正确的决策，即使你（程序员）不在场时。当我们希望用户或其他另一个程序员添加一些信息，然后你期望程序根据你预设的任何条件做出响应时，我们可能会看到这种情况发生。\n\
  \n通过这种方法，你将能够让程序以某种方式运行，并且你可以根据在代码中添加的条件进行一些必要的调整。这些程序中发生的决策将确保程序按照你想要的方式运行，但有时它比看起来的要复杂，所以学习如何使用条件语句可以解决所有问题。\n\
  \n在我们学习的过程中，你会发现在使用条件语句时会有不止一个选项可以使用。例如，你可以选择一种选项，该选项只有在用户提供正确的输入时才会运行并执行任何工作。有些条件语句能够无论无论用户给程序提供什么输入，都能为你提供答案。或者，你可能会得到一个能够列出项目菜单之类的列表，然后让用户选出他们最喜欢的一项。考虑到这一点，让我们花一点时间进一步研究本章，看看有哪些可供你使用的条件语句。\n\
  \n### Switch 条件语句\n\n考虑到上面的一些信息，我们在这里可以花时间研究的第一个条件语句是 switch 语句（分支语句）。这些语句将为你提供很多机会，因为它们允许程序员花时间检查变量是否与代码从开始就列出的情况（cases）或值相等。你在这里检查的变量可以与许多其他情况进行比较。我们将在这种条件语句中使用的类型语法示例包括：\n\
  \n```cpp\nSwitch(expression){\n    case constant-expression:\n        statement(s);\n\
  \        break; //可选的\n    case constant-expression:\n        statement(s);\n  \
  \      break; //可选的\n    //你可以根据需要添加任意数量的 case 语句\n    Default: //可选的\n        statement(s);\n\
  }\n```\n\n当你使用 switch 语句时，你必须遵循一些规则以确保它们在你的代码中正常工作。首先，你与 switch 语句使用的表达式应该是枚举类型或整型类类型。此外，它也可以属于一个具有转换函数的类。好消息是，当你使用\
  \ C++ 时，你能够向这种语法中添加多少个这些 case 语句没有限制，因此你可以根据代码需要将其写短或写长。这里需要记住的重要点是，你需要在每个想要使用的项中添加一个冒号和一个值。一旦变量有足够的时间找到与之相等的值，它将继续运行，直到找到你编写的\
  \ `break` 语句。当系统找到该 `break` 语句时，switch 将停止它正在执行的操作。然后控制流就可以传递到代码的下一个部分。在处理 cases\
  \ 时，你不需要添加这个 `break` 语句。如果你跳过了这部分，请记住控制流将直接跳过此部分并传递到代码的其他部分。\n\n### If 条件语句\n\n\
  我们在这种语言列表中的下一种条件语句将被称为 if 语句。if 语句是独特的，因为当需要处理条件语句时，它是你能做的最基本的操作之一，因为它们基于“真”和“假”的概念。如果系统判定用户提供的输入与你设置的条件相匹配，则被视为“真”，然后程序将通过并运行你在此之后添加的部分。例如，如果你正在设置一个程序并询问\
  \ `2 + 2` 的问题，而你的用户给出了答案 `4`，程序将看到这是真的，然后给出你选择的消息或执行下一部分。\n\n然而，如果输入不匹配你的条件，情况将会有些不同。如果在处理\
  \ if 语句时，用户输入了符合你设置条件的输入，那么语句就会显示并按照你想要的方式继续。但是，如果用户看到了 `2 + 2` 并认为结果是 `5`，那么你设置的条件将无法满足，它将被视为“假”。在这种情况下，如果用户输入了任何不是\
  \ `4` 的数字，if 语句将将其视为假，屏幕上什么都不会发生。在处理这些条件语句时，不需要花费很长时间，这就是为什么我们更可能使用 if else 语句。\n\
  \n### If Else 条件语句\n\n我们能够使用的第三种条件语句是 if else 语句。正如我们上面讨论的，if 语句是练习我们能够操作内容的良好方法。你能够使用的语法包括：\n\
  \n```cpp\nif(boolean expression){\n    // 如果表达式为真，则执行 statement(s)\n}Else{\n   \
  \ // 如果表达式为假，则执行 statement(s)\n}\n```\n\nelse 语句适用于各种情况。它不仅允许用户输入不符合条件的答案，而且你可能想让用户从几个选项中选择。\n\
  \n### Elif 语句\n\n处理条件语句时的第四种选项是 elif 语句。与 if else 语句相比，它们更进一步。这些语句非常有用，因为它们可以列出用户喜欢的各种选项。把它想象成游戏中的菜单。你可以使用它列出几个不同的项目，然后用户可以挑选他们喜欢的。这是一个很好的条件语句，因为它为任何代码增加了很多功能。\n\
  \n# 第 6 章：在 C++ 中创建循环\n\n![黑客、代码、编程](img/rsrcEV.jpg)\n\n现在是时候让我们更多地观察可以使用这种语言进行的编码工作，并确保我们可以用\
  \ C++ 完成一些事情。当循环和数组结合时，你可以使用这种语言帮助我们做一些很不起的事情，本章将花时间观察如何让两者工作。让我们让我们来看看如何在 C++ 代码中使用循环和数组。\n\
  \n### 数组\n\n在本章中我们需要查看的是数组在我们的 C++ 代码中是如何工作的。它们是一种存储相同类型和固定大小元素的结构。换句话说，它们是相同类型变量的集合。但不是通过遍历单个变量来实现，而是使用一个数组，例如数字数组。为了实现这一点，我们可以使用\
  \ `0` 到 `99` 的数字，然后每个数字都可以通过索引访问。\n\n```cpp\ndouble balance[5] = {1000.0, 2.0, 3.4,\
  \ 17.0, 50.0};\n```\n\n括号中的数字不应该高于你写的元素数量。这意味着如果你在括号中放置 `5`，你就可以添加尽可能需要的数字。如果你不确定数组有多大，这非常有帮助。\n\
  \n```cpp\n#include <iostream>\n#include <iomanip>\nusing namespace std;\n\nint main\
  \ () {\n    double balance[10] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n    for (int i=0;\
  \ i<10; i++) {\n        balance[i] = i+100; \n        cout << setw(13) << balance[i]\
  \ << endl;\n    }\n    for (int j=0; j<10; j++) {\n        cout << setw(7) << balance[j]\
  \ << endl;\n    }\n    return 0;\n}\n```\n\n### 学习使用循环\n\n在你花时间学习了如何使用数组之后，是让我们观察如何使用循环了。这些循环非常好，因为当我们编写代码行时，它们真的会为我们节省大量时间。在\
  \ C++ 中，你可以处理不同类型的循环。\n\n我们列表中的第一个循环被称为 `while` 循环。`while` 循环帮助我们，因为只要条件满足，它可以一直运行你的循环并根据需要重复许多次。在处理这些条件语句时：\n\
  \n```cpp\nwhile(condition){\n    statement(s)\n}\n```\n\n然后我们将转向 `for` 循环。与 if else\
  \ 语句相比，它们更进一步。这些语句非常有用，因为它们可以列出用户使用的各种选项。这意味着它们至少运行一次。这就是 `do...while` 循环：\n\n```cpp\n\
  Do {\n    statement(s)\n}while(condition);\n```\n\n### 嵌套循环\n\n处理这些条件语句时的下一个选项是嵌套循环。这是当一个循环位于另一个循环内部时，两个循环会同时运行。这可能会让人困惑，但语法是是的：\n\
  \n```cpp\nwhile (condition){\n    while (condition) {\n        statement(s)\n  \
  \  }\n    statement(s)\n}\n```\n\n# 第 7 章：C++ 函数\n\n![黑客、程序员、计算机](img/rsrcH6.jpg)\n\
  \n当我们到达这一步时，你可能好奇为什么这些对你的编码如此重要。你为什么要学习这些数组以及它们应该是如何使用的？当循环和数组结合在一起时，你可以使用这种语言帮助我们完成一些神奇的事情。当我们讨论函数时，我们会发现函数指的是一段执行特定任务的段落。取决于该函数是由我们使用的库预定义的，还是由程序员创建的，会有两种主要的函数类型我们可以处理。这些包括库函数和用户定义函数。\n\
  \n### 库函数\n\n我们在这里查看的是库函数。这些是 C++ 程序中找到的一些内置函数。这意味着你不需要创建它们，它们就存在于你想要编写的库中。这些函数非常好用，并且有许多你需要的函数符合这种想法，因此你能够让它们很好地为你工作。\n\
  \n\n\n\n```cpp\n#include <iostream>\n#include <cmath>\n\nusing namespace std;\n\n\
  int main()\n{\n    double number, squareRoot;\n    cout << \"Enter a number: \"\
  ;\n    cin >> number;\n    // sqrt() 是一个计算平方根的库函数\n    squareRoot = sqrt(number);\n\
  \    cout << \"Square root of \" << number << \" = \" << squareRoot;\n    return\
  \ 0;\n}\n```\n\n现在我们已经准备好了这些，请确保将其放入你的代码中以查看它是如何运行的。然后你应该能够获得正确的输出，以便这一切能够发生。当我们处理上面编写的示例时，`sqrt()`\
  \ 函数就是我们能够调用的、用于计算从该数字中得到的平方根的函数。注意这段代码中还包含了 `#include <cmath>`。这部分将是我们想要使用的头文件。根据上面代码的设置，用于\
  \ `sqrt()` 的函数定义（或者说我们正在处理的函数体）将存在于 `cmath` 头文件中。当你决定通过之前讨论过的代码在程序中包含 `cmath` 文件的内容时，你可以使用\
  \ `cmath` 中定义的所有函数。这对于帮助我们确保在过程中以正确的方式使用头文件，并帮助我们提取出所需的函数非常重要。请记住，你使用的每个 C++ 版本以及所有符合这种语言规范的程序都将至少包含一个函数。这个函数就是\
  \ `main()` 函数。大多数程序都有更多函数，但它们接受和使用的函数类型会发生变化。无论它们拥有或不拥有哪些函数，所有的程序都会带上 `main()` 函数。\n\
  \n### 用户定义函数\n\n记得我们讨论过，在 C++ 语言中，我们可以处理的函数有两种类型。我们刚刚花了一些时间查看了库函数，现在是时候让我们去探索如何处理用户定义的函数了。这意味着\
  \ C++ 语言以及许多其他编程语言一样，都允许程序员进来并定义他们自己的函数。\n\n用户定义函数能够将代码分组，以执行我们想要的特定任务，而这组代码将被赋予某种名称或标识符。程序员的任务是在此过程中给它一个正确的标识符或名称，但请记住，必须完成这一点以确保这些用户定义函数能够以正确的方式运行。当函数通过程序的任何部分被调用时，它将执行定义在函数体中的所有代码。这是一个需要记住的重要点。我们创建的用户定义函数如果处理得当，将像库函数一样工作，但可能需要更多的选项和步骤来实现这一过程。\n\
  \n![C++ 编程中的函数工作原理](img/rsrcJH.jpg)\n\n现在我们已经讨论了定义程序的用法，我们需要花几分钟看看上面的图。它将帮助我们学习更多关于这应该是如何运作的，以及当我们在这里编写并创建一个自己的程序时会发生什么。当我们使用上面的图片时，我们会看到，当这个程序开始运行时，系统将开始工作来调用\
  \ `main()` 函数，正如我们之前讨论的那样。这意味着系统将开始执行从 `main()` 函数开始的所有代码，以保持其组织结构。然后我们必须继续看我们如何能够控制程序。当程序的控制开始到达\
  \ `function_name()` 部分（位于我们开始的那个 `main` 函数内部）时，它将移动到 `void function_name()` 部分。然后该特定函数内部的所有部分都将执行执行。我们在这里看到的下一步是程序的控制将再次移动。对于这一个，控制将返回到\
  \ `main` 函数。这就是我们的代码能够调用 `function_name()` 并使其像上图所示被执行的地方。\n\n### 函数原型\n\n然后我们可以查看函数原型概念。这与处理函数声明是相同的。如果用户定义函数在我们完成\
  \ `main` 函数后才定义，那么编译器将停止程序并显示错误。这是因为，此时编译器将无法感知到用户定义函数、你想要传递给函数的参数类型以及返回类型。在 C++\
  \ 语言中，函数原型就是我们需要的函数声明，但不包含其函数体，以向编译器提供有关你正在创建的函数的信息。你会发现这有一个很好的例子是：`int add(int,\
  \ int);`。通过这一个你可以看到，原型中没有函数体。此外，只有返回类型和参数，但没有具体的参数。你也可以使用下面的选项声明函数原型：`int add(int\
  \ a, int);`。在继续之前需要注意的一点是，程序员不需要在 `main` 函数之前定义原型。\n\n### 向函数传递参数\n\n我们在上部分简单讨论了这些参数，但现在我们需要进一步了解它们在我们语言语言中执行的一些代码中是如何运作的。在\
  \ C++ 中，参数（或参数）是指在我们调用函数时传递给函数（或函数定义）的数据。在我们之前做的示例中，我们拥有的两个变量 `num1` 和 `num2` 在我们调用函数时将传递给该函数。这些参数是独特的，因为它们被称为实际参数。我们通过\
  \ `num1` 和 `num2` 获取的值将分别初始化为变量 `a` 和 `b`。这些 `a` 和 `b` 参数被称为我们现在讨论的形式参数。我们通过下面的图表来演示这一点：\n\
  \n![C++ 编程中向函数传递参数](img/rsrcK5.jpg)\n\n为了帮助我们更好地理解这应该是如何工作的，我们可以参考以下关于传递参数的笔记：\n\
  \n1. 实际参数和形式参数的数量应该是相同的。当我们讨论函数重载过程时，存在例外，但我们现在不会对那个花费太多时间。\n2. 第一个实际参数的类型应该匹配我们在第一个形式参数中看到的类型。根据同样的思路，第二个实际参数的类型应该匹配第二个形式参数的类型，依此类推。这有助于保持一切井然有序并按预期运行。\n\
  \n\n\n\n\n### 3. 无参数函数\n另一件需要记住的事情是，你可以直接调用某些需要的函数，而完全不需要向它们传递任何参数。这可以帮助我们确保在需要函数时可以使用它们，而不会因为没有合适的参数来配合它们就放弃使用。你传递给函数的参数数量将取决于你作为一名程序员，希望代码如何来解决你正在处理的问题。\n\
  \n### 4. 默认参数\n你还可以进行此操作，并为参数分配一些默认值。不过，当你这样做时，请记住在编程中，这些将被称为你的**默认参数**。\n\n###\
  \ 5. 参数数据类型\n当我们查看在本章中完成的一些代码时，尤其是上面的代码，我们处理的两个参数都将`int` 类型。但请记住，当你在使用这些函数时，两个参数不必是相同的类型。如果它们是相同的数据类型，那太好了；但如果不是，也没关系。\n\
  \n\n\n\n## 返回语句 (Return Statement)\n\n在处理 C++ 函数中可以使用某些选项时，我们最后要花时间查看的是 `return`\
  \ 语句。只要我们确保正在使用 `return` 语句，函数就可以帮助我们向调用程序返回一个单一的值。在上面我们花了一些时间写的程序，`add` 的值将从我们编写的那个自定义程序或函数返回给调用程序。我们实现这一点的方法是通过下面的代码语句：\n\
  \n```\nreturn add;\n```\n\n为了帮助我们了解更多关于 `return` 语句能为我们做什么以及它在我们正在处理的一些代码中的作用，我们可以查看下面的图：![在\
  \ C++ 编程中从函数返回值](img/rsrcKT.jpg)\n\n在这里花一点时间回顾一下上面的文档，看看在这一章已经完成的编码工作中，你能识别出其中的多少部分，然后我们需要花时间来描述它并讨论其内部的内容。\n\
  \n在上面的程序中，我们可以看到 `add` 的值（它将显示在我们的自定义函数内部）将返回给我们正在处理的调用函数。同时，该值将在这里存储在变量 `sum` 中。\n\
  \n这里我们需要记住并注意的一点是，返回的变量将是一个 `int` 类型，而 `sum` 也是一个 `int` 类型。这非常重要，因为我们在这里尝试对某些代码进行的操作。我们正尝试将几个数字相加并得到和，两者都需要是整数是合理的。记住，这并不总是必须发生的。你也可以处理超过一种返回类型。但当它们相同更符合逻辑时，请确保它们确实是相同类型。\n\
  \n当我们查看上面的代码时，可以注意到的另一点是，函数的返回类型是通过函数声明符（function declarator）定义的。这意味着你正在处理的函数将向我们返回某种类型的值，也是\
  \ `int` 类型。\n\n如果你运行这个过程并发现没有向调用函数返回任何值，那么就必须返回 `void`。如果你希望在目前编写的某些代码中看到这种情况，这是一个非常重要的一步。\n\
  \n在 C++ 语言中，你很多时候都会使用函数。学习如何使用一些库函数和一些自定义函数最终只会让你的代码更强大。这二者都有其用武之地，但自定义函数确实需要你付出更多工作，因为你需要能够写出这些函数，并确保编译器能够识别出它们的真实身份。你可能还需要通过这些函数传递一些参数，以便编译器提前知道这些参数是什么。请确保阅读这一章以学习更多关于库函数和自定义函数的知识，以便你能以正确的方式使用它们。\n\
  \n# 第 8 章：在你的 C++ 程序中查找错误\n\n![I Dati Personali, Dati, Clic](img/rsrcM9.jpg)\n\n\
  作为编码世界的初学者，尤其是使用 C++，对我们来说，重要的一点是我们要知道在你想要处理的某些代码中会出现错误。你需要处理这些情况，并在过程中排除掉这些问题，以确保我们能够以正确的方式使用它，并让代码良好运行。\n\
  \n你会发现，当你尝试编写的代码中出现错误时，这会带来很多挫败感。当部分缺失，或者你在过程中输入了不正确的内容时，代码将无法运行。这对于刚起步的人来说是令人沮丧的，但这始终是学习过程的一部分。让我们来看看为了排查这些程序中出现的错误可以采取的步骤，以及你可以做什么来确保你的程序每次都能运行。\n\
  \n## 每次只处理代码的一小部分\n\n在你尝试编写的代码中，可能出现的最大问题之一是，他们坐下来然后试图在一坐中写尽可能多的代码。他们认为这是真正完成编码的最好方法，并且在这个过程中他们可能觉得自己取得了很大成就。他们回看已经完成的代码行，并为走到这一步感到非常开心。\n\
  \n虽然这看起来很令人深刻，但当你尝试执行这种代码时，你就会发现问题所在了。例如，如果你有三十页代码但还没有检查全部，然后你尝试运行代码，你会发现系统上出现了大量的错误。现在你必须一个一个地修复每一个错误，并在所有这些代码中找出它们在哪里，而你却完全不知道该从哪里开始。\n\
  \n这就是为什么你应该每次只处理代码的一小部分。这意味着当你完成一个 `loop`（循环）或 `conditional statement`（条件语句）或其他内容时，是时候退一步，看看它是否能以你想要的方式工作。通过编译器运行该代码部分看看是否正常，如果有错误，你就能确切知道错误在哪里并修复它。\n\
  \n一次性处理大量代码永远不是好主意，这会导致很多头疼的问题。缓慢而稳健是确保在代码出现错误时能够处理它们的最好方法之一。与之相关的另一点是，你应该应该休息。有时错误会产生问题，或者甚至当你在电脑前花费了太多时间进行编码时，离开代码是解决很多问题的最好方式。如果你发现代码卡住了没有以你想要的方式运行，或者你不确定如何让它工作，你需要退一步。\n\
  \n## 学习错误信息的含义\n\n当你学习一个新程序时，你会发现各种错误信息出现在你的代码中。这可能是令人沮丧的。即使你一次处理一点代码并运行它，也会发现不同的错误信息出现。在这里你可以做的最好的事情就是确保学习这些错误信息。当你看到编译器给出反馈时，你对这些信息意味着什么以及你需要做什么来修复它们会有更好的理解。在某些情况下，特定的错误信息将会出现，通过经验来猜测是不可能的。但你可以参考\
  \ C++ 的相关社区来寻求帮助。这方面的好消息是，我们可以把错误信息放入搜索引擎中，希望从中找到一些信息。可能某些程序员遇到过同样的错误或问题并写了记录，你可以利用这些信息帮助自己找出代码中的问题。\n\
  \n## 先进行一些练习\n\n你越能够练习你的编码，对你所做的工作就越熟悉。开始编码并假设你一夜就能精通它是不合理的。这需要练习、经验。花费时间学习如何处理这些并获得练习可以帮助实现这一点。\n\
  \n一个很好的起点是本指南中的一些代码。这些内容涵盖了我们在这一过程中想要讨论的许多主题，并让你练习代码行如何匹配、语法如何工作等等。但你也可以扩展你正在做的工作，而不仅仅是已有的语法。你甚至可以找到完整的代码程序来帮助你获得所需的练习，并为你编写自己的代码做准备。你练习代码的机会越多，掌握得就越好。即使你每天只花十分到十五分钟尝试并编写一些代码，你会发现这真的能帮助你看到所做编码的结果。\n\
  \n## 使用检查你工作的程序\n\n如果你对正在进行的编码工作仍然紧张，那么使用一些能够检查你工作的程序可能是一个好主意。这些程序允许你输入想要处理的程序或代码，然后提供改进建议或告诉你错误所在。其中许多程序需要支付少量费用才能使用，这有时会成为阻碍。但总的来说，你会发现这是一个供你选择的\
  \ Great 选择。它为你的代码提供即时反馈，可以是你练习并学习如何使其适应你需求的另一个良好方法。\n\n## 学习 C++ 的语法和基础知识\n\n我们花了一些时间处理\
  \ C++ 中的一些基础知识。上面的章节中有一章专门负责这些内容，让我们能够看到这种语言是如何工作的。遵循语法是重要的，因为它确保了你编写的代码是整洁的。很多时候，作为初学者，你的工作中出现错误最大的原因是你没有正确使用语法，导致编译器不知道应该怎么做。好消息是，学习语法相当容易，如果你对下一步要做什么感到困惑，始终可以回去复习。\n\
  \n## 阅读一些关于 C++ 的笔记\n\nC++ 是一种流行的语言，你会发现它伴随有一个强大的社区。这个社区由许多具有不同程度编码经验的个人组成。有些人正在寻求获得这种语言的经验，并对编码中可能出现的问题有疑问。此外，这个社区还包含专业和高级编码人员，他们能够回答你的问题并提供获得良好结果必要信息。\n\
  \n## 向他人寻求帮助\n\n在某个时刻，无论你如何编码，都会遇到一些问题，这时你可以向他人寻求帮助。\n\n\n\n\n\n* `Wchart_t`: 这将作为宽字符类型的变量\n\
  * `Double`: 这是一个具有双倍精度的浮点值\n* `Void`: 这将是表示没有使用某种类型的变量\n* `Int`: 这是一个整数\n* `Float`:\
  \ 这是浮点数，并且它只有单倍精度\n* `Bool`: 这是一个返回真（true）或假（false）结果的变量\n* `Char`: 这是内存中一个字节的表示，并且是一种整数类型。\n\
  \n你还有权定义其他类型的变量。这些变量可以包括类、数据结构、枚举、引用、数组和行指针等选项。\n\n## 如何定义你的变量\n\n如果你首先不清楚如何正确地定义它们，那么这些变量将没有什么大用处。这些定义将非常有帮助，因为它们会告诉我们应该使用多少存储空间，以及你应该在哪里获取变量并存储或创建它。它还将帮助你指定你计划处理的数据类型。\n\
  \n你将能够经历这一过程并输入 `type variable_list`。然后，你可以在以相同的方式编写它们之前，选择我们想要处理的任何变量类型。这段代码很重要，因为它会告诉编译器帮助我们创建代码中列出的变量类型，以便我们使其良好运行。我们能够使用以满足需求的一些代码包括：\n\
  \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n    int j=10;\n\
  \    int k=5;\n    int l=j+k;\n    cout << l << endl;\n    return 0;\n}\n```\n\n\
  你应该能得到答案 15。你也可以遍历并定义声明程序中的变量，但那是我们在对这种语言进行更多练习之后可以做的事情。调出编译器并尝试上面的代码是一个好主意。这有助于你更熟悉代码编写工作，并可以帮助你开始识别何时会看到这些变量。\n\
  \n在你处理这些变量时，也会有时候我们必须停止并为变量赋值。如果不这样做，变量本身仅仅会在计算机内存中预留一小块空间，对代码起不了太大作用。这就是为什么程序员需要花时间遍历并为变量添加值，甚至是添加多个值，以使其正常工作。你所处理的该变量的值将直接存储在你最初存储该变量的地方。\n\
  \n我们还可以为正在处理的每个变量添加多个一个值。实际上，只要方法正确，我们就可以按照意愿向同一个变量存储尽可能多的这些值。然而，通常将变量的值比率保持在一或或二是最好的，因为这有助于我们确保在过程中不会让代码变得过于混乱。\n\
  \n为了帮助我们为变量赋值，我们只需要在值和变量之间放置一个等号。这个符号将用于告诉编译器，变量（或在你的计算机内存上保存的空间）将属于该特定值。当程序在执行期间调用该变量时，它仍然能够为我们带出一个新值。\n\
  \n在 C++ 语言中处理变量并不真正困难，但在确保你的代码以你期望的正确方式运行时，它是非常重要的。它帮助我们为变量及其对应的正确值在计算机内存中留出位置，以便代码能够按照我们想要的方式执行和运行。\n\
  \n# 第 10 章：运算符重要性\n\n在我们想要处理的每种编程语言中，都有被称为运算符的代码部分。即使在 C++ 语言中，这些部分也是重要的。这些部分在 C++\
  \ 语言中使用起来非常简单，但它们将为你想要处理的代码添加一些力量和功能性。\n\n在 C++ 语言内部，我们发现有四种主要的运算符类型可以在此程序内部进行探索。每种类型都会为我们将处理的代码添加不同类型的功能。你将很快看到所有这些内容是如何运作的，当我们在本指南中讨论它们时，你会发现弄清楚如何在你想要编写的一些代码中使用它们并不会花费太长时间。至少对于\
  \ C++ 语言而言，我们能够处理的四种主要运算符类型包括：\n\n1. 关系运算符\n2. 赋值运算符\n3. 算术运算符\n4. 逻辑运算符\n\n现在是让我们花一点时间研究每种运算符类型了，帮助我们了解它们到底是什么、它们应该如何工作、每种运算符带有的符号，以及我们能够用它们做什么来在我们的代码中获得出色的结果。\n\
  \n### 逻辑运算符\n\n首先，我们将花时间研究的四种运算符中的第一个是逻辑运算符。这些逻辑运算符很重要，因为它们负责比较你尝试添加的代码的不同部分。它们也有助于我们理解这些内容是否是真是假，代码部分是否协同工作，或者它们是否发生了其他情况。我们可以在代码中使用的几种不同的逻辑运算符，这些包括：\n\
  \n* `!`: 这个运算符被称为逻辑非（NOT）。它将在你想要反转操作数状态时使用。所以，如果你有一个为假的条件，你可以使用这个运算符将其变为真。\n* `&&`:\
  \ 这个运算符被称为逻辑与（AND）。它将在你有两个操作数都不为时不使用。如果这种情况发生，条件将变为真。\n* `||`: 这个运算符被称为逻辑或（OR）。当你使用这个运算符时，如果至少有一个操作数为真，则条件将为真。\n\
  \n### 算术运算符\n\n你可以在 C++ 代码中处理的第二种运算符是算术运算符。在涉及运算符时，这些实际上被认为是最容易处理的代码，而且你将在想要编写的一些代码中频繁使用它们。记住这些的一个好方法是，如果你想在代码中进行任何数学方程，你就会想要使用这些来帮助完成。记住你的数学技能可以帮助你记住大多数属于这个范畴的运算符。我们在这里的意思是，算术运算符允许你对语句中的各种部分、条件甚至数字进行除、乘、加、减运算。\n\
  \n你甚至可以在同一个语句中使用这些中的多个一个，如果你的代码需要的话。我们只需要记住运算顺序，以确保符号处于正确的顺序，以获得我们想要的答案。你可以在 C++\
  \ 语言中使用的的一些赋值运算符包括：\n\n* `+`: 这是加法运算符，它可以将你选择的两个操作数相加。\n\n\n\n\n\n### 算术运算符\n\n\
  - `-`: 这是减法运算符。它将获取右侧的操作数并从左侧的操作数中减去它。\n- `*`: 这是允许在 C++ 语言中进行乘法运算运算符。\n- `/`: 这个运算符帮助你在\
  \ C++ 中进行除法运算。\n- `++`: 这是自增运算符。它将你的操作数的值的值加 1。\n- `--`: 这是自减运算符。它将你的操作数的值减少 1。\n\
  \n当你想要关注这些算术运算符时，会有很多选项可以操作。这里的第一个选项是，你实际上可以在代码的同一部分同时放置多个一个此类运算符。你可以将一些项相加在一起，然后除以其他项，并混合使用以确保它们能够按照我们的需求工作。这同时也确保了我们在编写代码的过程中，能够充分利用某些代码的价值。\n\
  \n### 赋值运算符\n\n我们在这里可以操作的下一种运算符被称为赋值运算符。这种运算符比上面看到的算术运算符还要常见，而且在目前为止本指南编写的一些代码中，我们已经见过它了。当你开始编写代码时，没不了多久你就会发现这些运算符到处可见。\n\
  \n首先，你会发现赋值运算符负责让程序员轻松地将正确的名称或值赋值给变量。你甚至可以使用这些运算符来帮助你在任何想要处理的代码中执行保存、搜索和其他任务。在你编写的代码中，可能会经常看到的一些常见的赋值运算符包括：\n\
  \n- `=`: 这个运算符是简单的赋值运算符。它将右侧操作数的值赋值给左侧的操作数。\n- `+=`: 这种被称为加法赋值运算符（Add AND）。它会将两个操作数的值相加，然后将结果之和赋值给左侧的操作数。\n\
  - `*=`: 这是乘法赋值运算符（Multiply AND）。它将两个操作数相乘，然后将结果交给左侧的操作数。\n- `-=`: 这个运算符会将右侧操作数的值从左侧的值减去，然后将差值交给左侧的操作数。\n\
  - `/=`: 这是除法赋值运算符。它将左侧的值除以右侧的值，然后将结果赋值给左侧。\n\n在继续之前，我们还需要更深入地探索这些赋值运算符。在这里需要记住，赋值运算符通常被认为是你可以操作的最常见的运算符之一。在这种语言中还会出现其他几种运算符，但请记住，它们大部分出现在非常高级的代码中，并不是你现在需要关注或频繁使用的运算符。在大多数情况下，你编写的包含这些赋值运算符的代码只会使用等号来帮助为变量赋值，例如。但在某些情况下，你可以使用我们上面列出的其他赋值运算符，以便代码按照你想要的方式运行。\n\
  \n### 关系运算符\n\n最后，我们将转向 C++ 语言中我们要关注的第四种也是最后一种运算符。这种运算符被称为关系运算符。这些运算符将以与其他某些选项不同的方式帮助我们，但仍然会确保我们的代码按照我们的意运行。我们在这里可以操作的使代码行为的一些最佳关系运算符包括：\n\
  \n- `==`: 这个运算符将检查你两个操作数的相等性。如果它们相等，则条件为真（true）。\n- `>`: 这个运算符将检查操作数的值。如果左侧的操作数高于右侧，则条件为真（true）。\n\
  - `<`: 这个运算符基本上与上一个相反。如果你发现左侧操作数的值大于右侧，则条件为真（true）。\n- `!=`: 这个运算符将检查你两个操作数的相等性，如果值不相等，则你的条件为真（true）。\n\
  - `<=`: 这个运算符将检查左侧操作数是否小于或等于右侧操作数。如果符合这一标准，则条件为真（true）。\n- `>=`: 这个运算符将检查左侧操作数的值是否大于或等于右侧的值。如果真的，则条件为真（true）。\n\
  \n\n\n\n正如你所看到的，有很多不同的操作符可以操作。其中每一个都能帮助你在代码内部执行不同的操作，并让你的代码更加强大。它们看起来可能只是对你代码的简单补充，但它们会产生天壤之差的影响。随着在使用这些运算符时我们能够关注的许多不同选项，没多久，你就能在自己的\
  \ C++ 代码中找到使用每个运算符的正确方法。\n\n# 第 11 章：C++ 术语储备\n\n![Programmazione, Progettazione,\
  \ Coworking](img/rsrcTP.jpg)\n\n在结束本指南之前，我们需要花一点时间来看一些在编写 C++ 代码时会很有用的术语。到目前为止，我们可能已经花过时间来学习和讨论了许多术语，或者至少在本指南中提到了它们。但现在，我们将花一些时间来深入研究它们，帮助我们理解它们的运行机制，以及如何根据我们的需求使用它们。为了开始学习\
  \ C++ 语言，你需要了解的一些术语包括：\n\n### 编译器\n编译器将对我们帮助，因为它是能够读取你在程序代码中输入的所有字符的东西。在读取整个代码后，编译器会将代码转换为机器可以理解的格式，这意味着将其转换为\
  \ 0 和 1。编译器将是专职的，并在编码期间为你辛勤工作，因为它能够正确地读取每一个字符。由于我们计算机上的处理器只能理解二进制数字，我们无法写出一个完全由这些数字组成的程序，而且我们无法直接为处理器编写代码，尽管这是运行程序的方式。编译器能够将程序的编码代码转换为机器可以理解的形式。我们将输入的指令（称为源代码）将被转换为对象代码，供处理器运行。\n\
  \n在你能够进行任何你想做的编程之前，你需要一个 C++ 编译器。有很多这样的编译器可供选择，你可以四处寻找并找到适合你的那一个。下载编译器后，你可以为 C++\
  \ 创建一个新的源文件，然后向计算机输入你想要 C++ 编写的代码。\n\n### 关键字\n另一个我们可以探索的词是关键字。这些词将是编译器已经认识的单词。这意味着，当编译器在你的程序中看到这些关键字时，只要它们出现在正确的位置，编译器就会自动知道应该做什么，而无需你再付出额外努力。例如，当你的计算机遇到\
  \ `int` 关键字时，它会知道这代表整数（integer）。或者，如果编译器读取到 `break`，它就知道你希望它在条件满足时跳出当前循环。\n\n###\
  \ 变量与常量\n这里我们需要查看对我们编码工作重要的两个术语。正如名称所推的那样，变量（variable）是一个值在程序运行过程中可以改变的东西。它的值不是固定的。但我们还有常量（constant）。这个有点不同，因为它的值在整个程序中保持不变，即恒定。\n\
  \n### 操作数与操作符\n这两者彼此相似，因此我们将它们放在同一个标题下。简单来说，操作符（operator）是能够在变量上执行操作的东西。例如，`+` 是我们可以用来执行加法操作并将两个东西加在一起的操作符。该运算符所操作的项被称为操作数（operands）。在表达式\
  \ `x + y` 中，`x` 和 `y` 就是操作数，而 `+` 符号就是操作符。\n\n### 表达式\n在编程中，表达式（expression）将为我们执行操作并包含操作符和操作数，或者有时它也会包含一个变量。很好的例子是\
  \ `> b`。这是一个表达式，其中 `a` 和 `b` 是操作数，`>` 符号像之前一样是操作符，但表达式包含了所有内容。\n\n### 二元与一元\n我们在本指南中提到过关于二元（binary）的概念，但我们需要看看它的含义，特别是当我们将其与一元（unary）进行比较时。用二元意味着“二”，而一元意味着“一”。这意味着二元运算符将在两个操作数甚至两个值上进行操作，而一元运算符只对这些操作数中的一个进行操作。\n\
  \n### 定义与声明\n这是我们需要多花一点时间的事情。当我们使用 C++ 进行想要做的某些编程时，这两个术语会被频繁使用。变量的声明（Declaration）意味着我们要告诉编译器该变量将是一个整数，或者该变量将是一个字符。声明将告知我们的编译器我们想要使用的变量类型。定义（Defining）变量意味着我们通过编译器在内存中分配空间来处理这种变量。\n\
  \n如果我们正在处理一个变量，单条语句就可以同时完成定义和声明。例如，当我们处理像 `int x;` 这条语句时，它可以声明并定义变量 `x` 为整数。记住，声明只是告诉编译器我们要使用的某种数据类型，而定义意味着我们实际上在为它分配一些空间。虽然它们有时看起来是同一件事，但在某些情况下它们是不同的。\n\
  \n### 初始化\n给变量赋值一个值。如果我们使用 `x = 5` 这样的语句，这将初始化 `x` 的值。记住，等号右侧的值将被存储或赋值给等号左侧的值。\n\
  \n### 字符\n这些将出现在你编写的一些代码中。它们包括一些特殊符号、数字。虽然我们通常认为字符是字母，但必须记住字符可以是代码中的任何空白。\n\n###\
  \ 语法\n无论你处理的是哪种语言，每种语言都有自己的语法（Syntax）。通过这个术语，指的是必须遵循的语言结构。只有遵循了这种语法，编译器才能理解你发送的指令。\n\
  \n### 错误\n当你开始编写想要实现的某些代码时，这是一个非常常见的术语。简单来说，错误意味着出错。当我们谈论语法错误时，意味着在语法中发现了某种错误。在读取你写的程序时，如果编译器发现它无法读取或理解的内容，它将发送错误信息。在清除这些错误之前，程序无法执行。很多时候，如果代码写得不正确就会出现错误，如果语法没有正确遵循，可能会看到错误。当编译器生成错误时，意味着你有编译时错误（compile-time\
  \ error）。当然，在这个过程中还有其他类型的错误。尽管编译器能够检测到所有的错误，但例如，如果程序被写成加两个数字而你使用了减号，编译器就不会知道。编译器可以帮助我们捕捉很多错误，但我们也需要留意这些。\n\
  \n### 可执行文件与链接器\n执行是运行程序的过程。我们花了一些时间在对象文件（object file），但我们可以直接执行这些文件吗？我们使用的编译器产生对象代码，但这些代码需要一些外部文件来完成。例如，如果你计划处理一些复杂的函数，你可以使用程序员已经处理过并定义的函数。程序员会创建一个库（library），你可以将其添加到源代码中，而不是每次都重新创建。库是对象文件的集合。这意味着程序依赖其他对象文件来实现比你想使用的更复杂的函数。必须有人链接所有的对象文件以产生一个可执行的文件。工作将通过链接器（linker）完成；大多数现代编译器都包含了链接器。记住，当我们处理\
  \ C++ 源代码时，必须单独编译它们产生对象代码。如果你有十份源代码，意味着我们需要十个对象代码。然后链接器将组合这十个对象代码，让你最终得到单一的可执行模块。\n\
  \n### 调试\n我们还需要查看调试（Debugging）过程。这听起来可能比实际上要复杂；它是排除程序故障的过程。当运行的程序没有按照你预期的方式运行时，就会发生这种情况。调试就是我们能够识别代码中出现的某些漏洞（bugs）或错误时。\n\
  \n正如你所看到的，有很多不同的部分需要结合在一起，帮助你在 C++ 中创建你喜欢的代码。了解一些最常见的术语可以比以往任何时候都更容易控制代码，并真正看到我们在内部处理的内容。当你准备好开始编码时，良好掌握这些主题将使完成编码变得更容易。\n\
  \n# 结论\n![Destinazione, Uomo, Uomo D'Affari](img/rsrcV6.jpg)\n\n感谢你读到 C++ 的最后，希望这些内容具有启发性，并能为你提供所需的所有工具。下一步是查看如何使用\
  \ C++ 语言并开始编写我们需要的代码。这种语言带有许多不同的部分，学习如何让它满足你的需求以及所有不同部分的含义可以是一项重要的探索工作。本指南将为我们提供从开始处理此问题所需的工具。\n\
  \n在本指南中，我们回顾并查看了在处理 C++ 语言时需要的一些不同部分。这里有很多不同的部分，在我们开始时有时会觉得有些困惑，但你会发现这是你开始自己的编码和程序的最佳方式之一。本指南的目标是帮助你学习如何处理数组、继承、函数、循环、条件语句等，用于你自己的程序。在指南之初，你可能认为这些听起来都很困惑且难以处理，但到最后，希望这一切都会变得非常有意义，你将能够很快写出你想要的程序。世界上可能有很多其他编程语言，但你会发现\
  \ C++ 语言将是帮助你实现你寻求的所有力量和功能的最佳语言之一。最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在亚马逊上的评价！\n"
