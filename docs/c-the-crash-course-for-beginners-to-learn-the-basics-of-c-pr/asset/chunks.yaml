    \ C++ 语言以及许多其他编程语言一样，都允许程序员进来并定义他们自己的函数。\n\n用户定义函数能够将代码分组，以执行我们想要的特定任务，而这组代码将被赋予某种名称或标识符。程序员的任务是在此过程中给它一个正确的标识符或名称，但请记住，必须完成这一点以确保这些用户定义函数能够以正确的方式运行。当函数通过程序的任何部分被调用时，它将执行定义在函数体中的所有代码。这是一个需要记住的重要点。我们创建的用户定义函数如果处理得当，将像库函数一样工作，但可能需要更多的选项和步骤来实现这一过程。\n\
    \n![C++ 编程中的函数工作原理](img/rsrcJH.jpg)\n\n现在我们已经讨论了定义程序的用法，我们需要花几分钟看看上面的图。它将帮助我们学习更多关于这应该是如何运作的，以及当我们在这里编写并创建一个自己的程序时会发生什么。当我们使用上面的图片时，我们会看到，当这个程序开始运行时，系统将开始工作来调用\
    \ `main()` 函数，正如我们之前讨论的那样。这意味着系统将开始执行从 `main()` 函数开始的所有代码，以保持其组织结构。然后我们必须继续看我们如何能够控制程序。当程序的控制开始到达\
    \ `function_name()` 部分（位于我们开始的那个 `main` 函数内部）时，它将移动到 `void function_name()` 部分。然后该特定函数内部的所有部分都将执行执行。我们在这里看到的下一步是程序的控制将再次移动。对于这一个，控制将返回到\
    \ `main` 函数。这就是我们的代码能够调用 `function_name()` 并使其像上图所示被执行的地方。\n\n## 函数原型\n\n然后我们可以查看函数原型概念。这与处理函数声明是相同的。如果用户定义函数在我们完成\
    \ `main` 函数后才定义，那么编译器将停止程序并显示错误。这是因为，此时编译器将无法感知到用户定义函数、你想要传递给函数的参数类型以及返回类型。在 C++\
    \ 语言中，函数原型就是我们需要的函数声明，但不包含其函数体，以向编译器提供有关你正在创建的函数的信息。你会发现这有一个很好的例子是：`int add(int,\
    \ int);`。通过这一个你可以看到，原型中没有函数体。此外，只有返回类型和参数，但没有具体的参数。你也可以使用下面的选项声明函数原型：`int add(int\
    \ a, int);`。在继续之前需要注意的一点是，程序员不需要在 `main` 函数之前定义原型。\n\n## 向函数传递参数\n\n我们在上部分简单讨论了这些参数，但现在我们需要进一步了解它们在我们语言语言中执行的一些代码中是如何运作的。在\
    \ C++ 中，参数（或参数）是指在我们调用函数时传递给函数（或函数定义）的数据。在我们之前做的示例中，我们拥有的两个变量 `num1` 和 `num2`\
    \ 在我们调用函数时将传递给该函数。这些参数是独特的，因为它们被称为实际参数。我们通过 `num1` 和 `num2` 获取的值将分别初始化为变量 `a`\
    \ 和 `b`。这些 `a` 和 `b` 参数被称为我们现在讨论的形式参数。我们通过下面的图表来演示这一点：\n\n![C++ 编程中向函数传递参数](img/rsrcK5.jpg)\n\
    \n为了帮助我们更好地理解这应该是如何工作的，我们可以参考以下关于传递参数的笔记：\n\n1. 实际参数和形式参数的数量应该是相同的。当我们讨论函数重载过程时，存在例外，但我们现在不会对那个花费太多时间。\n\
    2. 第一个实际参数的类型应该匹配我们在第一个形式参数中看到的类型。根据同样的思路，第二个实际参数的类型应该匹配第二个形式参数的类型，依此类推。这有助于保持一切井然有序并按预期运行。\n\
