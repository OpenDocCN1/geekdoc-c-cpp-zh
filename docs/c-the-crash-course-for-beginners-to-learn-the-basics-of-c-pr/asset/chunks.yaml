    ### Desktop GUIs


    The first option that we are going to look at is some of the libraries that you
    are able to work with when it is time to handle work with the desktop GUI. Some
    of the best ones for this will include:


    1.  **MFC**: This is going to stand for the Microsoft Foundation Classes and it
    is able to wrap up the `COM` APIs and Windows in order to help us to have an easier
    time when we are working on developing desktop applications for Windows in C++.
    This one is going to be well supported in Visual Studio, which is going to include
    some of the visual forms editors. And it is going to be royalty-free so you can
    use it even for some of the commercial reasons that you have when your application
    is built with a suitably licensed copy of Visual Studio.

    2.  **Qt**: This one is going to be a cross-platform kind of library that works
    with GUI development, some classes that are more general in their purpose, and
    also an IDE that you can work with. There are licenses for commercial and open-sourced
    use.

    3.  **wxWidgets**: This one may not be as polished as some of the others. But
    if you are looking to work with a free solution that can work across platforms,
    and can be free for you to work on some of the commercial applications, then this
    is the one to check out.


    ### Web Applications


    The next thing that we want to work with is how to use C++ for web applications.
    Developing web applications is not always the one thing that we are going to try
