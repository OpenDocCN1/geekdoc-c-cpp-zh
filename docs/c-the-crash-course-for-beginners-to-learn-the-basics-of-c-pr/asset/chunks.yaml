    and you want to make sure that it is able to handle making the right decisions
    for that program, even when you, the programmer, are not there. We may see that
    this is happening when we would like the user, or another programmer, to add in
    some of the information, and then you expect the program to respond based on any
    of the conditions that you set ahead of time.With this kind of method, you will
    be able to get your program to act in a certain way, and you can make some of
    the adjustments that you need based on the conditions that you add to the code.
    The decision making that happens with these programs is going to make sure that
    the program is going to perform in the manner that you want, but it is going to
    be more complicated than it seems sometimes, so learning how o work with the conditional
    statements can get it all done.As we go through with this, you will find that
    there are going to be more than one option that you are able to use with the conditional
    statements. For example, you can choose to go with one of the options that will
    only run and do any of the work when the user presents it with the right input.
    There are conditional statements that are able to provide you with an answer no
    matter what input the user gives to the program. Or you could end up with one
    that is able to list out things like a menu of items and then you are going to
    have the user pick out the one that they like the most. With this in mind, let’s
    take some time to look at this chapter a bit more and look at some of the conditional
    statements that are available for you to work with.The Switch Conditional StatementsWith
    some of the information above in mind, the first conditional statement that we
    are able to spend some time on here is going to be the switch statements. These
    statements are going to provide you with a lot of opportunities because they can
    allow the programmer time to check out whether there is an equality of the variable
    against the cases or the values that you outlined inside of the code from the
    beginning. The variable that you would check out here can then be checked out
    against a lot of other cases. An example of the kind of syntax that we are going
    to be able to work with on this kind of conditional statement will include:Switch(expression){​
    case constant-expression:​ statement(s);​ break; //optional​ case constant-expression:​
    statement(s);​ break; //optional//you can add in as many of these case statements
    as you would likeDefault: //Optionalstatement(s);}When you are working with the
    switch statements, there are some rules that you must follow in order to make
    them work inside of your code. First, the expression that you use with the switch
    statement should be either an enumerated or an integral class type. In addition
    to this, it can also belong to a class that has a conversion function. The good
    news is that when you are working with C++, there isn’t a limit on how many of
    these case statements that you are able to add into this syntax so you can make
    these either short or long depending on what your code wants. The important thing
    to remember here is that you need to add in a colon as well as a value to each
    one that you want to use.Once the variable has some of the time that it needs
    to find a value that it is equal to, it is then going to continue running until
    it is able to find the break statement that you wrote out. when the system then
    finds that break statement, the switch will end up stopping what it is doing.
    Then the control flow will be able to pass through to the next part of the code.
    You do not need to add in this break statement when working with cases. If you
    do skip out on this part though, remember that the control flow will just skip
    over this part and pass on to the rest of the code.The If Conditional StatementsThe
    next kind of conditional statements that are on our list in this language will
    be known as the if statements. The if the statement is unique because it ends
    up being one of the most basic things that you are able to do when it is time
    to work on the conditional statements because they will be based on the idea of
    true and false.If the system decides that the input it is given by the user is
    going to match up with the conditions that you were able to set, then it is considered
    true and the program will then go through and run the parts that you add after
    this. For example, if you are setting up a program and it asks the question of
    2 + 2, and your user gives the answer of 4, the program would see that this is
    true and then give the message you picked or have the next part of the code behave
    how you would like.However, it is going to be a bit different if the input is
    not going to match up to your condition. If you work with the if statement and
    the user put in an input that matches up with the conditions that you set, then
    it is able to proceed to show up the statement and continue on with the code that
    you write.But then we need to look at what is going to happen to the code if the
    user saw 2 + 2 and put in the wrong answer? Maybe they decide that this equals
    5 instead. Then the condition that you set is not going to be met here, and it
    is going to be seen as false in the else statement.Since this is a pretty basic
    option when working on these conditional statements, you will find that it is
    not going to do that good of a job when it is time to handle that false answer.
    If the user, in this case, puts in any kind of number for their answer that is
    not 4, then the if statement is going to see this as false, and not know where
    to proceed. This leaves a blank screen on the computer and nothing else is going
    to happen. It won’t take long for you to do some coding before you find that this
    is not a good thing, which is why we are more likely to work with the if else
    statements instead.The If Else Conditional StatementsThe third type of conditional
    statement that we are able to work with is the if else statement. As we discussed
    a bit above, the if statement is a good way to get some practice with what we
    are able to do with these conditional statements, but it is going to limit what
    we are able to do here. You will run into issues with the if statement if the
    user puts in the wrong information and the code sees this information as false.
    And this is where we are going to see that the if else statement is going to be
    able to help us.The if else statement is going to work in a variety of situations.
    Not only does it allow for the user to put in an answer that may not meet your
    conditions, but there are also times when you may want it to let the user pick
    from a few different options to start with. The if else statement is going to
    help you to do all of this and the syntax for this is going to be pretty simple.
    The syntax that you are able to work with for the if else statement includes the
    following:if(boolean_expresion){​ //statement(s) will execute if the boolean expression
    is true}Else{​ // statement(s) will execute if the boolean expression is falseYou
    will be able to add in as many of these points into the if else statement as you
    would like. If you would like to work with your own program that is able to set
    apart people so they are in five or six different age groups, you would be able
    to do this with the help of these if else statements. You would just need to add
    in some more of the “else” keywords to make this happen.So, let’s take a bit of
    time to see how this is going to work for us, and see if we can keep it as simple
    as possible. And we are going to work with making our own program that has 2 +
    2\. If the person is able to input the right number into the system, you will
    be able to set it up so that the first part is the true statement, and then the
    message that you put into that program is going to be what will come up on the
    screen for you.However, it is possible that the user is going to put the wrong
    answer into the program as well. If they put in anything that is not 4 for the
    answer, then the statement will see this as false based on your conditions. This
    one is not going to give you a blank screen though. Instead, it is going to let
    you put in another option for this to tell the user that something was wrong with
    the answer that they have. You could choose to have some answer come up on the
    screen that says something like “Sorry, that is the wrong answer” if the user
    adds in something that is not 4.As we can see with this one, it is able to add
    in a lot of the freedom that you are looking for when it is time to work on the
    C++ program. You are able to still have some simplicity in the code that you are
    writing on the program, but it also ensures with this one that the wrong answers
    are going to be covered and you are not missing out on anything.There are a few
    other things that we need to focus on here as well when it is time to work with
    these if else statements. One of these is that you will be able to work with more
    than one if else statement within your code if you would like. This can add in
    some complexity to the code, but can definitely be worth it as well. You will
    find that when you do this and add in the right syntax for all of the parts, it
    is going to do some wonderful things for your codes.Working with both the if statements
    and the if else statements that we have above can make the experience that you
    have with coding that much better. It is going to allow the system to make some
    of the decisions that it needs, based on what the user is adding into the system
    as their input, rather than the programmer having to be there and doing all of
    the work. Make sure to try out a few of these statements and see how they will
    work with some of the code that you want to write as well.The Elif StatementsThe
    fourth option that we are able to work with when it is time to handle these conditional
    statements is the elf statement. These are going to take things a little bit further
    compared to the if and the if else statement. These statements can be useful because
    they are going to list out all of the options that you would like for your user
    to be able to use. Think about it like a menu on a game. You will be able to use
    this to list out a few different things on a menu, and then the user can come
    in and pick out the option that they like the best.This is a good conditional
    statement to work with because it adds a lot of functionality to any code that
    you are working with. The user is going to be able to pick out from a variety
    of options that are in the elif statement, and you will be able to add in something
    known as a catch-all in order to make sure that if the user gives another option
    than what you picked on the menu, then you will still be able to have something
    show up.You are able to use as many of these elif statements in your code as fits
    for what you are trying to do. Sometimes you may find that a few menu options
    are going to be enough to get the work done that you would like. And other times
    you may have a longer list to make it work how you would like. You are also able
    to add in some statements for what the user is going to see when they pick out
    each option. The statement that you try to add into this is going to vary based
    on how you would like to use this, and some of the other, conditional statements
    inside of your own code.For example, let’s say that you want to put up a game
    where you would like to allow the user to go through and pick out the type of
    pizza that they would like to use. You could list four types of pizza, such as
    cheese, pepperoni, veggie, and sausage. The user will pick from those pizzas and
    then the corresponding statement that you set up would execute once they have
    made a choice. You can even set it up so that there is another option for them
    to not get any pizza and maybe just choose a drink and that can be the catch-all
    in case the user does not want the pizza choices that you have listed.As you can
    imagine, there are a lot of different options that you are able to go with when
    you are working with the elif statement. You will be able to add in as many or
    as few of these options as you would like to make your program work.There are
    so many ways that you will be able to work with the conditional statements. These
    statements are really powerful and allow you to get the program to work the way
    that you would like. You can get it to make decisions for you and to get it to
    behave the way that you would like. Make sure to try out a few of these different
    options in order to see how they work and to learn how they are going to work
    inside the code that you are writing.Chapter 6: Creating Your Loops in C++![Programmatore,
    Codice, Programmazione](rsrcEV.jpg)Now it is time for us to look a bit more at
    some of the coding that we are able to do with this language and making sure that
    we can get some stuff done with C++. You are able to use this language to help
    us do some amazing things when the loops and arrays are brought into the mix,
    and this chapter is going to spend a few moments taking a look at how we are able
    to get both of these to work. So, let’s jump in and see how we are able to work
    with the loops and the arrays in your C++ code.The ArraysThe first thing that
    we need to look at in this chapter is how the arrays are going to work in our
    C++ code. These are going to be a type of structure of data that can store elements
    that are of the same type and the same size that is fixed. These are going to
    be the collection, in other words, of the same type of variables. But instead
    of going through and using some of the individual variables to make this happen,
    you would be able to work with one array, such as an array of numbers. To make
    this happen, we would be able to use the numbers of 0 to 99 and then each one
    can be accessed by the index that comes on the array.double balance [5]= {1000.0,
    2.0, 3.4, 17.0, 50.0};The numbers that are found in the bracket that we wrote
    should never end up higher than the number of elements that you plan to use. This
    means that if you place a five in the brackets, as we did above, and then place
    six numbers into the array because there will not be enough space inside the memory
    to do this. However, it is possible to not specify the size of the array. This
    is helpful if you are not sure how big the array will be ahead of time so that
    you can add in as many numbers as are needed. You would write it out like the
    following:double balance [] {1000.0, 2.0, 3.4, 17.0, 50.0};With the second one
    that we just looked at, we are going to get the same kind of array as the previous
    example, but we are going to start out by not specifying the size of our array
    in the first place. This one is going to make sure that we are able to get the
    program to handle the coding for us.Now that we have been able to look at the
    basics that come with writing out one of these arrays, it is now time for us to
    learn how we would be able to take the information that is inside of the array
    and use it inside of any programs that we want to write. This is going to seem
    a bit more advanced in some cases, but it is going to be able to help us add in
    some more elements to our code along the way. This is one of the best ways to
    also learn a bit more about these arrays and what they are able to do for us.
    A good example of how to work with these arrays is going to include the following:#include
    <iostream>using namespace std;#include <iomanip>using std::setw;int main (){​
    int n[ 10 ];  //n is an array of ten integers// initialize elements of array n
    to 0​ for ( int i=0; I <10; i++)​ {​ n[i] =i+100; // set element at location I
    to i+ 100​ }​ cout << element << setw(13) << value<< endl:​ //output each array
    element''s value​ for (int j=0; j<10; j++)​ {​ cout << setw(7)<< j << setw(13)
    <<n[j] << endl;​ }​ return 0}Before we proceed, take some time to open up your
    compiler and write out this code. This is a good example of how an array works
    and will give you some practice on how arrays are supposed to work. This program
    will be able to use the array in order to use the setw() function so that you
    will format the output that you will see. This is just one example of how you
    will be able to work with arrays and get them to work out the best for you.Learning
    How to Work with LoopsAfter you have had some time to learn how to work with the
    arrays in C++, it is time for us to take a look at how we are able to work with
    the loops as well. These loops are nice because they are going to really save
    us some time when we want to write out some of the codes that we need. If you,
    for example, would like the code to repeat a single part a bunch for times and
    you do not want to go through and write it out all of those times. It can potentially
    save you from writing out hundreds of lines of codes depending on the kind of
    program you are trying to write.When you work with a loop, the point to make this
    happen is that you will take a part of the code that you want to reuse, and then
    you just write it out once. But it is going to be set up so that the code will
    repeat that line or two of code until all of the conditions that you have set
    are met. It is important though that you remember to set up some of these conditions
    though so that the code actually knows where to stop and it is not going to get
    caught in an endless loop along the way. if you are able to do this in the proper
    manner, you will find that the loop statement is going to get a lot of coding
    done in a small amount of space, and can save a lot of time as well.Now, there
    are going to be a few different types of loops that you are able to work with
    when it comes to the C++ language. We are going to take some time to look them
    over in this chapter to help us see how they are the same and how they are different,
    and how we are able to use these for our needs.The first loop that is on our list
    is going to be known as the while loop. The while loop is going to help us because
    it can keep going through your loop, and will repeat as many times as needed as
    long as certain conditions are met. The program will be able to go through and
    test for that condition each time it makes its way through the loop. And if the
    condition is met, it is going to restart the loop again. Once it does this and
    finds that the conditions are no longer true, the loop is going to stop and it
    will head on through another par of the code.The syntax that comes with this is
    meant to be pretty simple for this one. The coding that we are able to use in
    order to handle the while loop is going to be below:While(condition){​ Statement(s):}From
    there we are able to move over to the second loop that is going to be found in
    C++, which is going to be the for a loop. This is the loop that is only going
    to go through and repeat itself if the conditions are true in the first place.
    With the while loop, you will have a loop that will go through its iteration at
    least one time, and then it checks out the conditions. The for loop is going to
    check these conditions first before it runs through. This means that depending
    on what kind of input you get; it is possible that the loop is not going to repeat
    inside of the program at all.So, it often depends on what you would like to see
    happen with the code. If you want to make sure that your loop goes through its
    iteration at least one time, then he while loop is the best one. But if it doesn’t
    matter whether the loop happens or you only want it to happen if the conditions
    are met, then the for loop is the one for you.If you have gone through some of
    the programs that you want to write and you decide that the for loop is going
    to be the best one for your needs, then it is time to work with the syntax that
    will help us work with this one. The syntax that we need to focus on here will
    include:For (iit: conditions: increment){​ Statement(s);}Then we can move on to
    the do…while loop. This is another option that is going to be similar to what
    we see with the while statement but it is going to also wait to check on the condition
    until you have reached the end of that statement, rather than checking out the
    condition at the beginning. The way that you would write out this kind of loop
    in C++ includes:Do​ {​ Statement(s):}while (condition):Nested loopsThe next one
    that you can choose to work with when it comes to the loops that you want to write
    is the nested loops. This is when you will have a loop that is inside of another
    loop. Both loops will continue to run at the same time until both of their conditions
    are met and then they can end. This allows you to create a continuous loop of
    loops. This may be confusing, but the syntax is pretty easy to work with and as
    you progress through some of your knowledge with C++, you may find that you use
    the nested loop more often than you would have thought. The way that you will
    write out a nested loop inside the C++ coding language includes:while (condition){​
    while (condition)​ {​ statement(s)​ }​ statement(s) // you can put more statementsWhen
    we get to this point in the process, it is likely that you are going to be curious
    as to why all of this is going to be important information to your coding. Why
    would you want to learn about these arrays and how they should be used in your
    coding? These seem complicated and like a lot of work to remember and this guidebook
    is supposed to just be the basics to help a beginner code, rather than going into
    stuff that is really in-depth.There is going to be a time when you will decide
    that you will want to go into some of the more complex stuff that you are able
    to do with coding, and while the simple tasks are a good place for us to start
    when learning a language, you have to branch out to some of the more complicated
    stuff as well, or you will never expand out and see the results that you want.
    When you learn things like arrays and loops, which really were not that hard once
    you gave them a try, you will find that it is a lot easier to work with some of
    the codes that you want in this language, even if they are more complicated.Chapter
    7: The C++ Functions![Hacking, Hacker, Computer, Internet](rsrcH6.jpg)We will
    not get very far in some of the coding that we want to do if we are not able to
    figure out some of the functions that come with C++. When we are talking about
    programming, we will find that a function is going to refer to a segment that
    is going to perform a specific task for us. Depending on whether the function
    is going to be predefined by the library that we are working with, or if it is
    created by the programmer, there are going to be two main types of functions that
    we are able to work with. These include the library function and the user-defined
    function. It is easy to figure out which is which.Both of these are going to be
    important to the work that we are trying to accomplish here, so we need to spend
    some time taking a look at them and how we would be able to use them for some
    of our coding needs. Let’s dive into both of these and see what we are able to
    do to make them work the way that we want.The Library FunctionThe first thing
    that we are going to take a look at here is the library function. These are going
    to be some built-in functions that are found in the C++ program. This means that
    you will not need to create them at all and they are just going to be found in
    the library that you want to write out when it comes to C++. These can be nice
    to work with, and there are many of the functions that you will need that fit
    into this kind of idea so you will be able to make it work for you pretty well.A
    programmer who is working with C++ is going to be able to work with the library
    function when they invoke the function directory. This means that you will not
    need to go through and write out the function on your own in order to get it to
    work the way that you would like. Let’s take a look at how these library functions
    are meant to look and behave in the codes that you are writing out.'
