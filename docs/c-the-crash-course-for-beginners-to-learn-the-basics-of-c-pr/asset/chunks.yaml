    with web services and our C++ language. Some of the best options are going to
    include:


    1. `gSOAP`: This is a mature toolkit that is maintained and will help us to support
    the `REST` and the `SOAP XML` web services.

    2. `Casablanca`: This one is going to be a more recent library that was created
    by Microsoft to help provide the programmer with some tools that they need to
    access and author `REST` services in `C++`. In spite of the origin of the library,
    it is going to support a few platforms other than Windows including `Mac`, `Linux`,
    and a few other mobile platforms.


    ## Databases

    There are times when you will need to gather up the data that you need for programming
    in `C++` from a database. And this can be easy if you have the right library or
    the right packages of the library present in order to get the work done. Some
    of the best `C++` libraries that we are able to work with that can help us to
    handle these databases and get the work done will include:


    1. `POCO::Data`: The classes that go under this namespace are going to be a very
    close match to the style of the database frameworks that we are looking at in
    `Java` and `.NET` with a database-independent abstraction layer that is going
    to help us to wrap up our communication with more than one database at a time.
    it is going to have support inside for the databases of `SQLite`, `ODBC`, and
    `MySQL`.

    2. `OTL`: This is going o be the library that handles some of the databases that
    you need like `ODBC` and `Oracle`, and may be of interest if you are looking for
    an idiomatically `C++` library. This is because the abstraction for this database
    option is going to be a library that is header-only and has more of an `STL` style
    in the interface.


    ## XML

    There are times when you will need to work with some of the `XML` pages that are
    out there, and you can definitely work with the `C++` library to make this happen.
    Working with these two together can make some really strong code when you need
    it if you know how to make it work for your needs. Some of the libraries that
    work with `C++` and can help us with the `XML` that we need will include the following:


    1. `POCO::XML`: This class is going to provide us with a writer for `XML`, `DOM`,
    and `SAX2`. It can also come in and offer us parsing with the help of the `Expat
    XML` C library.

    2. `Xerces C++`: This library is going to bring us a very large framework of `XML`
    in no time. in addition to `SAX2` and `DOM`, it is going to support the validation
    of the `XML` schema and with companion libraries that are built on top of `Xerces`,
    there is going to be more support that you are looking for for all of the time.


    At the same time, you may have some interest in one of the fast and lightweight
    `XML` libraries that have been changed up and modified in order to help out with
    the `C++` language at the same time. There are a few of these that we are able
    to work with including `RapidXML` and `TinyXML`. They are not going to have all
    of the features that we need from `XML` but they are going to be easy for us to
    use and integrate with as needed.


    ## JSON

    There may be times when you would also like to work with the `JSON` features of
    `C++`. This is not as common as some of the other parts that we have talked about
    above, but it is still important for us to learn how to make this work for our
    needs. Some of the best `C++` libraries that will also support `JSON` will include:


    1. `JsonCPP`: This is going to just a simple `JSON` reader and writer for the
    `C++` language.

    2. `JSON Spirit`: This is going to be another reader and writer of `JSON`. It
    is going to be built up with the help of the `Boost Spirit` parser generator,
    so you will need to work with the `Boost` library as well because there is already
    a dependency on this one.

    3. `POCO::JSON`: `POCO` is also going to get this one covered and ready to go
    as well. It has a namespace for `JSON` if you would like to stay with this family.

