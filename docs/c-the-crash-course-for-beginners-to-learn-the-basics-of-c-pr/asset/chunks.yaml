    # Chapter 8: Finding Errors in Your C++ Program


    ![I Dati Personali, Dati, Clic](rsrcM9.jpg)


    As a beginner in the world of coding, especially with C++, it is important for
    us to know that there are going to be times when errors are going to show up in
    some of the codes that you want to work with. You are going to need to work with
    this and troubleshoot some of these issues along the way to make sure that we
    are going to be able to use this in the proper manner, and that we are going to
    be able to get the code to work well.


    You will find that when there is an error in some of the code that you are trying
    to write, it is going to bring up a lot of frustration. The code is not going
    to work when parts are missing you type something in along the way that is not
    right either. This is frustrating for someone who is just getting started, but
    it is always a part of the learning process as well. Let’s take a look at some
    of the steps that you can take to troubleshoot the errors that show up in these
    programs, and what you can do to make sure that your program is going to work
    each time.


    ## Only Work on Small Parts of the Code at a Time


    One of the biggest issues that can come up with some of the codes that you are
    trying to write out is that they sit down and then try to type out as much code
    as they can in one sitting. They think that this is the best way for them to really
    get the coding done, and they may feel like they are accomplishing a lot in the
    process. They look back on the lines of code that they have been able to finish
    off and feel really good that they were able to get this far.


    While this is something that can look impressive, once you try to execute this
    kind of code, you are going to see where the problems lie. For example, if you
    have thirty pages of code and you haven’t checked it all out, and then you try
    to run the code, you are going to find there are a ton of errors that are showing
    up on your system. And now you have to go through and fix each individual one,
    and figure out where they are in all of those pages of code, without having any
    idea of where to get started.


    This is why you should only work on small parts of the code at a time. This means
    that when you are done with a `loop`, or a `conditional statement`, or something
    else like that, it is time to take a step back and see if it is going to work
    the way that you would like. Run it through the compiler and see if that part
    of the code worked or if there is an error, if you just did one small part, then
    you know exactly where the error is and can fix it.


    Working on a large amount of code at once is never a good idea, and it is just
    going to lead to a lot of headaches and issues along the way. Being slow and steady
    is one of the best ways to ensure that you are going to be able to handle errors
    when they show up in your codes. Another thing that goes along this line as well
    to remember is that you should take breaks. Sometimes when error is causing problems,
    or even when we spend too much time in front of the computer doing some coding
    that we want, it is going to cause more issues. Spending time away from the code
    is the best way to solve a lot of the problems that come up. If you find that
    you are stuck with an error and it is not working the way that you would like,
    or you are just not sure how to make something work, this is what you need to
    do: take a step back.


    ## Learn What the Error Messages Mean


    As you learn a new program, you will find that there are a variety of error messages
    that can show up in your codes. This can be frustrating. Even when you go through
    the code a little bit at a time and run it, you will find it is possible for different
    error messages to show up. The best thing that you can do here is to make sure
    that you are learning what all these error messages are about. When you see the
    compiler raise them for you, you will have a better idea of what these messages
    mean, what you need to do to fix them, and what part of the code they are in.
    If you are a bit worried about doing this, you can resort to the communities that
    come with C++ and see what error messages mean. In some cases, though, a unique
    kind of error message is going to show up, and guessing what it means from experience
    is going to be impossible. The good news with this one though is that we are able
    to put the error message into our favorite search engine and hopefully find some
    of the information as well. It is likely that some programmer has had the same
    error or issue with their code and has written about it, so you can use this information
    to help you figure out what is wrong with your own code as well.


    ## Do Some Practice First


    The more that you are able to practice the coding that you are doing, the better
    off you are going to be with the work that you do. It is not reasonable to get
    started with coding and then assume that you will be able to master it all overnight.
    It takes practice, time, and experience in order to get good with the coding.
    Spending your time learning how to work with this and getting that practice can
    help make that happen.


    A good place to start is with some of the codes we have in this guidebook. These
    went over a lot of different topics that we want to discuss when it comes to this
    process and can get you some practice with how the lines should match up, how
    the syntax is going to work, and so on. But you can also expand out some of the
    work that you are doing to handle more than just the syntax that you have at that
    time. You may even be able to find full programs of code that you can use to help
    you get some of the practice you are looking for and prepare you for writing out
    some of your own codes. The more chances that you take to practice your code,
    the more that you will get it down and the better you will get. Even if you just
    spend ten to fifteen minutes a day trying out a few codes and typing them out,
    you will find that this is going to really help you see some results with the
    coding you can do.


    ## Work with a Program That Checks Your Work


    If you are still nervous about some of the work you are doing in coding, it may
    be a good idea to work with some programs that are able to check the work you
    are doing. These can allow you to type in the program or the code you want to
    work with, and then can provide you with suggestions on how to improve or tell
    you where the errors are. Many of these are going to cost a little fee in order
    to get started with them, and that is sometimes a deterrent. But overall, you
    will find that this is a great option for you to choose from. It gives you instant
    feedback about your codes and can be another great way to practice what you are
    doing and learn how to make it all work for your own needs as well.


    ## Learn the Syntax and Basics of C++


    We spent some time working with some of the basics that show up with C++. One
    of the chapters above was dedicated to working with this and we are able to see
    how this language works. It is important to follow the syntax because it ensures
    that the codes you are writing are neat. Many times, as a beginner, the biggest
    reason why you are getting an error on your work is that you are not using the
    syntax properly and the compiler does not know what is supposed to do. The good
    news is that learning syntax is pretty easy, and you can always go back and review
    it if you are confused about what to work next.


    ## Read Some of the Notes on C++


    C++ is a popular language to work with, and you will find that there is a robust
    community that comes with this. This community consists of a lot of individuals
    who have varying degrees of experience in coding. Some are looking to gain some
    experience in this language and have questions about what might be wrong with
    the coding. In addition, this community is going to contain professional and advanced
    coders who are able to answer your questions and provide you with necessary information
    to get the best results.


    ## Ask Someone for Help


    At some point, no matter how much we may want to do it, we may have to ask someone
    else for help with programs. Sometimes we are not able to figure out things on
    our own when we work with a brand-new coding language. When you ask someone else
    to step in and help you out, make sure to tell them what is going on, what you
    want the code to do, and the troubleshooting steps you took along the way. This
    will make it a bit easier for you to get going and ensure that the programmer
    is able to help you get things fixed up. As a beginner, there are going to be
    times when the code is not going to work out as well as you would like and an
    error message will come up. This is normal when you are just starting; even some
    programmers who have been doing it for a long time will run into this problem.
    Working with the tips and steps above can help you reduce the number of errors
    that show up and can make it easier to write your codes.


