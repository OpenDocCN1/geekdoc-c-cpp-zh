    - **对象 (Object)**：`Objects` 是代码中具有状态和行为的实体。这些实体可以是颜色、纹理、形状等。你通常会将这些对象归类到相似的类（classes）中。因此，如果你有一个关于狗的类，你可以将不同类型的狗放在同一个类中。

    - **方法 (Method)**：这是编程中用于描述行为的术语。你可以根据需要使用任意数量的方法。这是你操作数据的方式，而动作的执行将根据你正在处理的方法来完成。如果不使用正确的方法，你的程序将不知道它应该做什么。

    - **实例变量 (Instant variable)**：此处应为 Instance，指的是你正在处理的单个对象。每个对象都将使用一组独特的变量进行分类，这些变量就像是对象的指纹一样。在创建对象时，你可以使用某些值为对象分配正确的变量。

