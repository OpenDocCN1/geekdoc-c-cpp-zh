    使用 C++ 语言时，你会发现当需要使用这种语言进行你想要的代码编写时，有很多很棒的选择。有些人会批评这种语言，因为它看起来复杂得没必要，而且语法可能看起来老旧而晦涩。但有时我们在用
    C++ 开发时发现的最大障碍是，它为我们提供的高级库访问权限不像我们在 Java 和其他类似语言中看到那么多。


    这并不意味着 C++ 语言及其标准库不能成为一个很好的工作工具。它将向我们展示如何使用许多算法和容器，这些容器对于你想要创建的许多应用程序都是用的。但你可能不会看到在某些与
    C++ 类似的语言中可能预期看到的某些网络库、XML 库以及其他功能。


    在我们达到 `C++11` 更新之前，甚至还没有线程库的可能性。尽管如果我们想让应用程序具有扩展性，那么充分利用现代计算机上的所有核心是至关重要的。在编写你所拥有的代码某些情况下，这可能会成为一个问题。如果你正在用
    C++ 编写一个庞大的应用程序，你可能会发现查看并利用现有的某些第三方库是很有用的。


    这就是为什么我们在这章中将花一点时间查看你可以使用的一些不同的库，它们有助于增强你使用 C++ 能做的事情，并确保你从尝试的某些编程中获得最大的收益。你可以选择立即下载并安装这些库中的一些，帮助你从你想做的这类编程工作中获得最大收益，或者你可以等到开始编写自己的代码时，这样你就可以看到这些库中特别是哪一个对你的帮助最大。


    ### 桌面 GUI


    我们将查看的第一个选项是当需要处理桌面 GUI 工作时你可以使用的的一些库。其中最优秀的一些工具包括：


    1.  **MFC**：它代表微软基础类（Microsoft Foundation Classes），它能够封装 `COM` API 和 Windows，以帮助我们在使用
    C++ 为 Windows 开发桌面应用程序时变得更加轻松。这个库在 Visual Studio 中有良好的支持，其中包含了一些视觉表单编辑器。而且它是免版税的，所以你可以在某些
    Visual Studio 的原因中使用它。

    2.  **Qt**：这是一个可以用于 GUI 开发的跨平台库，包含了一些更通用的类，以及一个 IDE。它有商业和开源使用的许可协议。

    3.  **wxWidgets**：这一个可能没有其他那些那么完善。但如果你正在寻找一种可以跨平台的免费解决方案，并且可以用于某些商业应用程序，那么这一个值得查看。


    ### Web 应用程序


    我们下一个想要处理的是如何使用 C++ 开发 Web 应用程序。开发 Web 应用程序并不是我们总是通过 C++ 尝试做的事情。但我们可以使用的一些选项可以确保我们能够完成这些任务。帮助
    Web 应用程序的一些优秀的 C++ 库包括：


    1.  **CppCMS**：这是一个框架，有助于让 C++ 的 Web 开发变得方便。该网站将帮助你提供关于为什么使用 C++ 开发你的 Web 应用程序是很好的信息。


    现在，如果你真的是在尝试用 C++ 处理一个基础的嵌入式 HTTP 服务器，一种你可以适配以为服务提供配置和在线帮助的服务器，甚至对于主要目的不是通用 Web
    应用程序的联网设备，那么在互联网上有一些这类简单 HTTP 服务器的示例供你查找。


