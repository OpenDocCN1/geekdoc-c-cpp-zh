    that comes with the C++ language, let’s dive into some of the basics of coding
    with this language and how we can get started in no time.


    # Chapter 2: The Basics of the C++ Language


    ![Source, Codice, Software, Calcolatore](rsrc62.jpg)


    The next thing that we need to spend some time on is learning the basic syntax
    that comes with the C++ language. Knowing how this works, and how we are able
    to use it to our own advantage is going to be important if we want to see some
    success with this language. The syntax is going to be important to this language
    because it is going to ensure that our code is written out in a manner that the
    compiler is actually going to understand. Let’s break down a few of the basics
    that come with the C++ syntax and how we are able to use these for our advantage
    along the way.


    ## The C++ Comments


    First on the list is the C++ comments. These are going to be a nice part to use
    when we would like to leave a message or a note to ourselves inside of the code,
    without it actually affects how well the code is going to work. These comments
    can also help out others who are reading the code because it can help them understand
    what is happening in that particular part of it. As a beginner, you will probably
    find that there is a good deal of these comments in the code, and you should feel
    free to use them as you need.


    These comments are going to be useful in guiding you with what you would like
    to accomplish inside of your code. And you get the freedom of adding in as many
    of them as you would like for the code. The best bet here though is keeping them
    down to a minimum though because if you have too many, it is going to make the
    code kind of a mess.


    The symbol that you need to use to make these comments, and to tell the compiler
    that comment is going on includes the `//` symbol. The program will see that symbol
    and will skip right over it, so you will not have any disruptions in the code
    and it will still work the way that you would like.


    You can also write a comment that is a little bit longer when you are using the
    C++ language, something that other coding languages will not. When you want to
    have a double or multiple line code, you would use the `/*` to start the comment
    and the `*/` to end the comment. When your compiler sees these, it will stop reading
    until the second part shows up. At that point, it will start reading through the
    code again.


    ## The C++ Data Types


    Just like with some of the other coding languages that you may want to work with
    along the way, there are going to be quite a few data points that show up in your
    code as well with C++. You will often be working with variables for example, which
    are just going to be spots that you reserve in the memory of your computer so
    that the different parts of the code will stay safe. There are a lot of data points
    that we are able to focus on when it comes to working in the C++ language and
    these will include:


    1. Boolean

    2. Double floating point

    3. Floating point

    4. Integer

    5. Character

    6. Valueless

    7. Wide character

