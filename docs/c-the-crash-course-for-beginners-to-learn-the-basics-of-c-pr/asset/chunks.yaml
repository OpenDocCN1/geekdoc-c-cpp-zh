    # 返回语句 (Return Statement)


    在处理 C++ 函数中可以使用某些选项时，我们最后要花时间查看的是 `return` 语句。只要我们确保正在使用 `return` 语句，函数就可以帮助我们向调用程序返回一个单一的值。在上面我们花了一些时间写的程序，`add`
    的值将从我们编写的那个自定义程序或函数返回给调用程序。我们实现这一点的方法是通过下面的代码语句：


    ```

    return add;

    ```


    为了帮助我们了解更多关于 `return` 语句能为我们做什么以及它在我们正在处理的一些代码中的作用，我们可以查看下面的图：![在 C++ 编程中从函数返回值](img/rsrcKT.jpg)


    在这里花一点时间回顾一下上面的文档，看看在这一章已经完成的编码工作中，你能识别出其中的多少部分，然后我们需要花时间来描述它并讨论其内部的内容。


    在上面的程序中，我们可以看到 `add` 的值（它将显示在我们的自定义函数内部）将返回给我们正在处理的调用函数。同时，该值将在这里存储在变量 `sum` 中。


    这里我们需要记住并注意的一点是，返回的变量将是一个 `int` 类型，而 `sum` 也是一个 `int` 类型。这非常重要，因为我们在这里尝试对某些代码进行的操作。我们正尝试将几个数字相加并得到和，两者都需要是整数是合理的。记住，这并不总是必须发生的。你也可以处理超过一种返回类型。但当它们相同更符合逻辑时，请确保它们确实是相同类型。


    当我们查看上面的代码时，可以注意到的另一点是，函数的返回类型是通过函数声明符（function declarator）定义的。这意味着你正在处理的函数将向我们返回某种类型的值，也是
    `int` 类型。


    如果你运行这个过程并发现没有向调用函数返回任何值，那么就必须返回 `void`。如果你希望在目前编写的某些代码中看到这种情况，这是一个非常重要的一步。


    在 C++ 语言中，你很多时候都会使用函数。学习如何使用一些库函数和一些自定义函数最终只会让你的代码更强大。这二者都有其用武之地，但自定义函数确实需要你付出更多工作，因为你需要能够写出这些函数，并确保编译器能够识别出它们的真实身份。你可能还需要通过这些函数传递一些参数，以便编译器提前知道这些参数是什么。请确保阅读这一章以学习更多关于库函数和自定义函数的知识，以便你能以正确的方式使用它们。


    # 第 8 章：在你的 C++ 程序中查找错误


    ![I Dati Personali, Dati, Clic](img/rsrcM9.jpg)


    作为编码世界的初学者，尤其是使用 C++，对我们来说，重要的一点是我们要知道在你想要处理的某些代码中会出现错误。你需要处理这些情况，并在过程中排除掉这些问题，以确保我们能够以正确的方式使用它，并让代码良好运行。


    你会发现，当你尝试编写的代码中出现错误时，这会带来很多挫败感。当部分缺失，或者你在过程中输入了不正确的内容时，代码将无法运行。这对于刚起步的人来说是令人沮丧的，但这始终是学习过程的一部分。让我们来看看为了排查这些程序中出现的错误可以采取的步骤，以及你可以做什么来确保你的程序每次都能运行。


    ## 每次只处理代码的一小部分


    在你尝试编写的代码中，可能出现的最大问题之一是，他们坐下来然后试图在一坐中写尽可能多的代码。他们认为这是真正完成编码的最好方法，并且在这个过程中他们可能觉得自己取得了很大成就。他们回看已经完成的代码行，并为走到这一步感到非常开心。


    虽然这看起来很令人深刻，但当你尝试执行这种代码时，你就会发现问题所在了。例如，如果你有三十页代码但还没有检查全部，然后你尝试运行代码，你会发现系统上出现了大量的错误。现在你必须一个一个地修复每一个错误，并在所有这些代码中找出它们在哪里，而你却完全不知道该从哪里开始。


    这就是为什么你应该每次只处理代码的一小部分。这意味着当你完成一个 `loop`（循环）或 `conditional statement`（条件语句）或其他内容时，是时候退一步，看看它是否能以你想要的方式工作。通过编译器运行该代码部分看看是否正常，如果有错误，你就能确切知道错误在哪里并修复它。


    一次性处理大量代码永远不是好主意，这会导致很多头疼的问题。缓慢而稳健是确保在代码出现错误时能够处理它们的最好方法之一。与之相关的另一点是，你应该应该休息。有时错误会产生问题，或者甚至当你在电脑前花费了太多时间进行编码时，离开代码是解决很多问题的最好方式。如果你发现代码卡住了没有以你想要的方式运行，或者你不确定如何让它工作，你需要退一步。


    ## 学习错误信息的含义


    当你学习一个新程序时，你会发现各种错误信息出现在你的代码中。这可能是令人沮丧的。即使你一次处理一点代码并运行它，也会发现不同的错误信息出现。在这里你可以做的最好的事情就是确保学习这些错误信息。当你看到编译器给出反馈时，你对这些信息意味着什么以及你需要做什么来修复它们会有更好的理解。在某些情况下，特定的错误信息将会出现，通过经验来猜测是不可能的。但你可以参考
    C++ 的相关社区来寻求帮助。这方面的好消息是，我们可以把错误信息放入搜索引擎中，希望从中找到一些信息。可能某些程序员遇到过同样的错误或问题并写了记录，你可以利用这些信息帮助自己找出代码中的问题。


    ## 先进行一些练习


    你越能够练习你的编码，对你所做的工作就越熟悉。开始编码并假设你一夜就能精通它是不合理的。这需要练习、经验。花费时间学习如何处理这些并获得练习可以帮助实现这一点。


    一个很好的起点是本指南中的一些代码。这些内容涵盖了我们在这一过程中想要讨论的许多主题，并让你练习代码行如何匹配、语法如何工作等等。但你也可以扩展你正在做的工作，而不仅仅是已有的语法。你甚至可以找到完整的代码程序来帮助你获得所需的练习，并为你编写自己的代码做准备。你练习代码的机会越多，掌握得就越好。即使你每天只花十分到十五分钟尝试并编写一些代码，你会发现这真的能帮助你看到所做编码的结果。


    ## 使用检查你工作的程序


    如果你对正在进行的编码工作仍然紧张，那么使用一些能够检查你工作的程序可能是一个好主意。这些程序允许你输入想要处理的程序或代码，然后提供改进建议或告诉你错误所在。其中许多程序需要支付少量费用才能使用，这有时会成为阻碍。但总的来说，你会发现这是一个供你选择的
    Great 选择。它为你的代码提供即时反馈，可以是你练习并学习如何使其适应你需求的另一个良好方法。


    ## 学习 C++ 的语法和基础知识


    我们花了一些时间处理 C++ 中的一些基础知识。上面的章节中有一章专门负责这些内容，让我们能够看到这种语言是如何工作的。遵循语法是重要的，因为它确保了你编写的代码是整洁的。很多时候，作为初学者，你的工作中出现错误最大的原因是你没有正确使用语法，导致编译器不知道应该怎么做。好消息是，学习语法相当容易，如果你对下一步要做什么感到困惑，始终可以回去复习。


    ## 阅读一些关于 C++ 的笔记


    C++ 是一种流行的语言，你会发现它伴随有一个强大的社区。这个社区由许多具有不同程度编码经验的个人组成。有些人正在寻求获得这种语言的经验，并对编码中可能出现的问题有疑问。此外，这个社区还包含专业和高级编码人员，他们能够回答你的问题并提供获得良好结果必要信息。


    ## 向他人寻求帮助


    在某个时刻，无论你如何编码，都会遇到一些问题，这时你可以向他人寻求帮助。


