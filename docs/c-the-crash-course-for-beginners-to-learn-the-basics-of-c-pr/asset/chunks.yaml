    that will ensure that we are able to get these done. Some of the best C++ libraries
    to help out with web applications will include:


    1.  **CppCMS**: This is going to be a framework that is going to help make the
    web development in C++ convenient. And the site is going to help provide you with
    some information on why it is nice to use C++ to work on your web applications.


    Now, if what you are really trying to do with C++ is work with a basic embeddable
    HTTP server, one that you are able to adapt as a means to provide configuration
    and online help for a service, or even for network-attached appliances that have
    the main purpose is not to be a general-purpose web application, then there are
    going to be some examples of these simple HTTP servers on the web for you to find
    if you would like.


    ### Networking


    We can also find some libraries out there that are meant to help C++ become a
    network system. Some of the best options to help us get this done include:


    1.  **Boost ASIO**: This is going to stand for the Boost Asynchronous I/O library
    which is going to also be available in a non-boost form as a header the only kind
    of library. It is going to mainly be used to help out with networking, though
    there are some programmers who are going to use it for some other functions including
    domain sockets on the Unix system and a wrapper that goes around the API handles
    in Windows.

