  trans: "\n\n* `Wchart_t`: 这将作为宽字符类型的变量\n* `Double`: 这是一个具有双倍精度的浮点值\n* `Void`: 这将是表示没有使用某种类型的变量\n\
    * `Int`: 这是一个整数\n* `Float`: 这是浮点数，并且它只有单倍精度\n* `Bool`: 这是一个返回真（true）或假（false）结果的变量\n\
    * `Char`: 这是内存中一个字节的表示，并且是一种整数类型。\n\n你还有权定义其他类型的变量。这些变量可以包括类、数据结构、枚举、引用、数组和行指针等选项。\n\
    \n## 如何定义你的变量\n\n如果你首先不清楚如何正确地定义它们，那么这些变量将没有什么大用处。这些定义将非常有帮助，因为它们会告诉我们应该使用多少存储空间，以及你应该在哪里获取变量并存储或创建它。它还将帮助你指定你计划处理的数据类型。\n\
    \n你将能够经历这一过程并输入 `type variable_list`。然后，你可以在以相同的方式编写它们之前，选择我们想要处理的任何变量类型。这段代码很重要，因为它会告诉编译器帮助我们创建代码中列出的变量类型，以便我们使其良好运行。我们能够使用以满足需求的一些代码包括：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main () {\n    int j=10;\n\
    \    int k=5;\n    int l=j+k;\n    cout << l << endl;\n    return 0;\n}\n```\n\
    \n你应该能得到答案 15。你也可以遍历并定义声明程序中的变量，但那是我们在对这种语言进行更多练习之后可以做的事情。调出编译器并尝试上面的代码是一个好主意。这有助于你更熟悉代码编写工作，并可以帮助你开始识别何时会看到这些变量。\n\
    \n在你处理这些变量时，也会有时候我们必须停止并为变量赋值。如果不这样做，变量本身仅仅会在计算机内存中预留一小块空间，对代码起不了太大作用。这就是为什么程序员需要花时间遍历并为变量添加值，甚至是添加多个值，以使其正常工作。你所处理的该变量的值将直接存储在你最初存储该变量的地方。\n\
    \n我们还可以为正在处理的每个变量添加多个一个值。实际上，只要方法正确，我们就可以按照意愿向同一个变量存储尽可能多的这些值。然而，通常将变量的值比率保持在一或或二是最好的，因为这有助于我们确保在过程中不会让代码变得过于混乱。\n\
    \n为了帮助我们为变量赋值，我们只需要在值和变量之间放置一个等号。这个符号将用于告诉编译器，变量（或在你的计算机内存上保存的空间）将属于该特定值。当程序在执行期间调用该变量时，它仍然能够为我们带出一个新值。\n\
    \n在 C++ 语言中处理变量并不真正困难，但在确保你的代码以你期望的正确方式运行时，它是非常重要的。它帮助我们为变量及其对应的正确值在计算机内存中留出位置，以便代码能够按照我们想要的方式执行和运行。\n\
    \n## 第 10 章：运算符重要性\n\n在我们想要处理的每种编程语言中，都有被称为运算符的代码部分。即使在 C++ 语言中，这些部分也是重要的。这些部分在\
    \ C++ 语言中使用起来非常简单，但它们将为你想要处理的代码添加一些力量和功能性。\n\n在 C++ 语言内部，我们发现有四种主要的运算符类型可以在此程序内部进行探索。每种类型都会为我们将处理的代码添加不同类型的功能。你将很快看到所有这些内容是如何运作的，当我们在本指南中讨论它们时，你会发现弄清楚如何在你想要编写的一些代码中使用它们并不会花费太长时间。至少对于\
    \ C++ 语言而言，我们能够处理的四种主要运算符类型包括：\n\n1. 关系运算符\n2. 赋值运算符\n3. 算术运算符\n4. 逻辑运算符\n\n现在是让我们花一点时间研究每种运算符类型了，帮助我们了解它们到底是什么、它们应该如何工作、每种运算符带有的符号，以及我们能够用它们做什么来在我们的代码中获得出色的结果。\n\
    \n### 逻辑运算符\n\n首先，我们将花时间研究的四种运算符中的第一个是逻辑运算符。这些逻辑运算符很重要，因为它们负责比较你尝试添加的代码的不同部分。它们也有助于我们理解这些内容是否是真是假，代码部分是否协同工作，或者它们是否发生了其他情况。我们可以在代码中使用的几种不同的逻辑运算符，这些包括：\n\
    \n* `!`: 这个运算符被称为逻辑非（NOT）。它将在你想要反转操作数状态时使用。所以，如果你有一个为假的条件，你可以使用这个运算符将其变为真。\n*\
    \ `&&`: 这个运算符被称为逻辑与（AND）。它将在你有两个操作数都不为时不使用。如果这种情况发生，条件将变为真。\n* `||`: 这个运算符被称为逻辑或（OR）。当你使用这个运算符时，如果至少有一个操作数为真，则条件将为真。\n\
    \n### 算术运算符\n\n你可以在 C++ 代码中处理的第二种运算符是算术运算符。在涉及运算符时，这些实际上被认为是最容易处理的代码，而且你将在想要编写的一些代码中频繁使用它们。记住这些的一个好方法是，如果你想在代码中进行任何数学方程，你就会想要使用这些来帮助完成。记住你的数学技能可以帮助你记住大多数属于这个范畴的运算符。我们在这里的意思是，算术运算符允许你对语句中的各种部分、条件甚至数字进行除、乘、加、减运算。\n\
    \n你甚至可以在同一个语句中使用这些中的多个一个，如果你的代码需要的话。我们只需要记住运算顺序，以确保符号处于正确的顺序，以获得我们想要的答案。你可以在 C++\
    \ 语言中使用的的一些赋值运算符包括：\n\n* `+`: 这是加法运算符，它可以将你选择的两个操作数相加。\n\n"
