  trans: '


    # C++ 的应用


    1. **预包脚本（Prepackaged scripts）**：我们首先要看的是预包脚本。这些脚本对初学者非常重要，因为它们能让我们更轻松地练习在本指南中将要介绍的不同技术。这些本质上是预先打包好的代码，以便你无需自己设置所有内容即可进行学习。


    2. **创建视频游戏**：你还会发现 `C++` 编程语言是许多你喜欢的视频游戏所随带的代码语言。虽然我们在本指南中不会花费大量时间教你如何实现这一点，但你会发现
    `C++` 语言拥有足够的实力和耐久性，能够迅速处理这些视频游戏中发生的更复杂的任务。


    3. **网页**：我们甚至在许多企业用于接触客户的网站上看到 `C++` 语言。`C++` 用于这些网页的原因是它易于操作，并且能确保你用它创建的任何网站都是快速且易于使用的。甚至可以使用
    `C++` 语言来帮助我们在网站上添加一些想要的交互式功能。我们熟悉并喜爱的许多热门网站已经在使用这种技术来保持运行。


    4. **手机应用**：我们甚至可以在某些喜用的手机应用中看到 `C++` 语言。如果你在手机上工作并使用那里可用的一些应用，你可能会发现使用 `C++`
    语言可以让这一切变得更好。这种语言将成为我们极速创建理想的智能手机应用的绝佳方式。


    正如我们所看到的，使用 `C++` 语言在我们自己的需求方面有很多应用，而学习这门语言的本质以及我们如何使用它，将使它对我们的需求变得更有价值。务必查看使用这种语言的各种方式，并了解它的重要性，以便你能够更好地充分利用它的价值。


    # C++ 语言的历史


    `C++` 是一门历史底蕴丰富的编程语言，因为它从字面上就是编程语言的开端。它始于计算机编程还未成为主流之前，始于人们开始靠黑客技术维持生之前之前。它于电话破解时期，即
    1979 年。这门语言的历史可以追溯到那里。没有没有其他编程语言可以追溯到这么远。


    比雅恩·斯特斯特鲁普（Bjarne Stroustrup）当时正在写博士论文，他决定使用一种名为 `Simula` 的编程语言。这种语言是计算机时代最早的编程语言之一。然而，它运行非常慢而且充满了
    Bug。


    斯特斯特鲁普提出了 `C with Classes`（带类的 C 语言）的想法。这是一种比 `Simula` 快得多的编程语言。`C with classes`
    后来变成了 `Cfront`，它加速了语言创建的过程。然而，当 `C++` 出现时，`Cfront` 被远远甩在了后面，因为它在语言中加入了编译器，使其比当时的任何其他项目语言都更易用、速度更快。


    从那时起，出现了许多注释版的参考指南以及对该语言的更新，使其变得更好、更快速、也更易用。《大傻来说学 C++》（`C++ for Dummies`）是关于这门语言的一本流行指南。


    `C++` 是今天最流行的语言之一。这门语言对于许多行业都是最佳选择，因此，与其花费大量时间开发一门新语言，他们直接将 `C++` 适应到许多不同的领域，因为它是最通用的。


    # 为什么这门语言如此流行？


    我们需要考虑的另一个问题是，为什么这种特定的编码语言会如此流行。世界上有很多编程语言可用，这让我们更加好奇：在有这么多选择的情况下，程序员为什么会选择其中一种（无论是
    `C++` 还是其他语言），而不是其他的语言？


    首先注意到的是，许多程序员会喜欢使用 `C++` 语言工作，因为它内置了许多速度和灵活性。与现有的某些选项相比，这确实是一门较老的语言，但它仍然拥有完成任务所需的实力和速度，并在我们开始时为我们提供我们想要创建的应用程序或其他程序。


    我们还会注意到，`C++` 语言是一门面向初学者的语言。在刚开始时它看起来可能有点困难。但一旦你掌握了一些编码基础知识，你就会发现它是一门容易上手的语言，甚至可能帮助你学习其他几种编码语言的基础知识。


    除了上述优点外，你会发现，如果你正在寻找一种不仅限于计算机和桌面级电脑的编码语言，那么 `C++` 语言是一个很好的关注点。虽然当你使用电脑时，它可以编写一些精彩的代码并帮助你完成诸如创建自己的网站等任务，但还有其他选项，例如智能手机上的应用，`C++`
    语言也能同样出色。


    当然，这些只是为什么许多人与其他语言相比更喜欢使用这门语言的几个大原因。这门语言还有许多其他优点，这就是为什么有许多人对学习它并掌握它感兴趣。我们将看到的
    `C++` 语言的其他优点还包括：


    1. **它带有一个大型库**：由于 `C++` 语言已经存在了一段时间，这门语言将为我们提供许多函数和其他工具。这些工具供我们使用，以便我们挑选想要处理的代码，即使在学习新知识时也能节省时间。你也可以使用这个库来帮助编写你自己的代码。


    2. **它可以与其他语言协同工作**：你会喜欢的这门语言的另一个优点是，它可以与其他语言协作，为你的代码添加更多功能和力量。这将更容易扩展你想要处理的项目数量，并可以从一种编码语言向另一种语言中添加部分，通过你编写的代码创造出真正惊人的成果。


    3. **适用于许多项目**：大多数其他编程语言将只关注一或两个小项目。例如，使用 `JavaScript` 意味着你将只处理网站。但通过 `C++`，你可以利用它来帮助许多不同的项目。无论你是想做网站、创建新程序，还是进行编程的其他事情，你都可以在
    `C++` 的帮助下完成。


    4. **快速且可靠**：如果你用过过去流行的其他一些编码语言，你会发现它们并不总是最可靠。信息可能会丢失，或者它们的启动方式不符合你的预期。如果你想要一种一次性成功且可靠的东西，那么选择
    `C++` 是一个好主意。


    5. **C++ 可以为我们提供巨大的力量**：那些想要花时间进行编码和编程，并希望在他们的工作中拥有更多力量的人会发现，使用 `C++` 语言是他们的一个很好的选择。与现有的其他语言相比，它将为帮助我们完成任务提供最强大的实力和速度。


