  trans: "\n\n# 多线程\n\n这是你将要使用 C++ 的许多应用程序中一个非常实用的工具。它允许进程同时运行，而不是让它们排在队列中等待轮到。这可以加快任务完成的速度，并且对于你可能在程序中运行的很多游戏非常有用。\n\
    \n现有的某些可以帮助 C++ 更好地实现你所需的多线程操作的优秀库包括：\n\n- **C++ 11 和 14 标准库**：多线程是 C++ 标准库更新以包含对该功能支持的领域之一。一些基本功能被添加到\
    \ `C++11` 中，随后更多的类又又被添加到了 `C++14` 选项中。如果你还没有开始使用 `C++11` 版本，其他选项也是很好的工作选择。\n-\
    \ **Boost Thread**：这个库将作为一种实现，以不同的名称出现，它为那些使用旧版 C++ 编译器的用户提供了多线程功能的可能。\n- **POCO**：这个库将带有几个不同的类，可以帮助我们处理这一过程。这将包括一些用于管理任务的高级抽象。\n\
    \n正如我们在这里看到的，在处理想要用 C++ 语言处理的不同函数及更多内容时，你有许多不同的选项可以操作。当你能够将这些内容添加到我们正在编写的一些代码中，并确保它们以你想要创建程序的方式相匹配时，你将在这一过程中看到惊人的结果。看看这里提供的一些库，并根据你自己的需求看看哪一个最适合你工作。\n\
    \n# 第 4 章：如何在 C++ 中创建你的第一个程序\n\n![Sviluppatore, Programmatore, Tecnologia](img/rsrcBC.jpg)\n\
    \n现在我们已经有机会更深入地了解 C++ 程序以及它能为我们提供什么，是时候真正深入研究并查看这种语言自带的一些代码了。这将会是一个非常令人兴奋的章节，因为它将帮助我们开始把已经讨论过的代码付诸实用。\n\
    \n你可能已经对想要写的种种代码有了一些想法，但在这里我们需要从缓慢开始，了解一些基础知识，并在这里尝试一些事情，以确保我们处于同一个频道上并沿着正确的轨道上运行。我们在这里需要关注的第一件事是设置我们的环境。这个环境将非常重要，因为我们将在这里编写代码并让它为我们执行。\n\
    \n好消息是，这个过程很容易。如果你选择从原始网站下载 C++ 软件包，那么环境应该也会随之一起下载。如果你发现这个环境并没有完全提供你想要的内容，通常网上有很多选项供你选择，有时你还可以找到几个免费的可以下载并按你意愿使用的。\n\
    \n一旦你下载了想要在 C++ 中运行的环境，我们就该更熟悉地一下我们将要用这种语言做什么了，我们将开始编写我们的第一段代码。在这里我们将保持简单，所以不要担心对你来说会太难或太复杂。我们将使用一段“试试这个”代码，它只占用几行，但内部仍然包含了一些我们需要学习的语法部分。我们将用于开始此操作的代码包括：\n\
    \n```cpp\n#include <iostream>\nusing namespace std;\nint main (){\n    cout <<\
    \ “Use This One!\";\n    return 0;\n}\n``` （注：已将 \"court\" 修正为 \"cout\"）在编写这些内容时，你有几个选项可用。你可以选择在你的编译器中编写（它会在你的环境中可用），或者你可以选择将其编写并保存到计算机中。第二种方案有时很好，因为你就有了保存好的代码副本，可以在代码中需要时随时复制粘贴。\n\
    \n无论哪种方式，你都应该仔细考虑你想要使用的文本编辑器类型。大多数编辑器都是针对特定设备的，因此你需要寻找与你特定电脑匹配的一个。你可以选择的一些选项包括\
    \ Windows 记本、`vim`、`vi`、`Brief` 和 `EMACS`。如果你想要一个可以在多个平台上使用的编辑器，那么 `vim` 和 `vi`\
    \ 选项是最佳选择。\n\n每当你编写这段代码中需要的某些代码时，你都需要先在文本编辑器中写出它们。完成后，编译器将是执行代码的部分，这样你就能看到它们是如何工作的。不过这是提前检查工作的一种好方法，以确保它看起来良好，并实现你一路上所预期。\n\
    \n# C++ 编译器\n\n就像我们已经过的某些文本编辑器一样，实际上也有几种不同类型的编译器供你选择。经常出现的问题是，虽然我们有很多选项可以选，但有很多是比程序员愿意支付的贵的。这是因为市上的很多编译器是针对你想用\
    \ C++ 进行的高级工作的。\n\n尽管如此，好消息是我们可以使用免费编译器。我们只需要小心确保获取的是我们需要的。你可能喜欢的这种编译器叫做 GNU。这在任何\
    \ Linux 操作系统上都是一个很好的选择，而且它可能已经存在于你的计算机。为了检查 GNU 编译器是否可用，你需要运行以下代码：\n\n```bash\n\
    g++ -v\n```\n\n如果编译器已安装，你应该会在屏幕上看到这些信息：\nUsing built-in specs.\nTarget: i386-redhat-linux\n\
    Configured with: ../configure –prefix=/usr …\nThread model: posixgcc version 4.1.2\
    \ 20080704 (Red Hat 4.1.2-46)\n\n如果你输入上面的代码但屏幕上没有出现该消息，这意味着你要么没有正确下载编译器，要么你的电脑上根本没有。\n\
    \n# 语法回顾\n\n当我们讨论 C++ 语言自带的语法时，我们需要回顾一些基础。这里的语言可以被定义为使用对象来帮助确保一切井然良好的程序，并允许你编写的代码调用并与其他对象通信。这种语言会有四个主要部分，我们需要留意以确保我们没有遗漏或没有将它们添加到我们的语法中。这四个部分包括：\n\
    \n- 类（Classes）：这些是语言的组织工具。它们可以被看作存放对象的盒子，并对相似的对象进行分类。你可以给类命名任何名称，但良好的编程习惯是将某些方面相似的对象放在同一个类中。\n\
    \n"
