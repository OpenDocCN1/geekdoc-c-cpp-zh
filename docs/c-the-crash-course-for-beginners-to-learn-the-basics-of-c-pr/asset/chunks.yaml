    ## 算术运算符


    - `-`: 这是减法运算符。它将获取右侧的操作数并从左侧的操作数中减去它。

    - `*`: 这是允许在 C++ 语言中进行乘法运算运算符。

    - `/`: 这个运算符帮助你在 C++ 中进行除法运算。

    - `++`: 这是自增运算符。它将你的操作数的值的值加 1。

    - `--`: 这是自减运算符。它将你的操作数的值减少 1。


    当你想要关注这些算术运算符时，会有很多选项可以操作。这里的第一个选项是，你实际上可以在代码的同一部分同时放置多个一个此类运算符。你可以将一些项相加在一起，然后除以其他项，并混合使用以确保它们能够按照我们的需求工作。这同时也确保了我们在编写代码的过程中，能够充分利用某些代码的价值。


    ## 赋值运算符


    我们在这里可以操作的下一种运算符被称为赋值运算符。这种运算符比上面看到的算术运算符还要常见，而且在目前为止本指南编写的一些代码中，我们已经见过它了。当你开始编写代码时，没不了多久你就会发现这些运算符到处可见。


    首先，你会发现赋值运算符负责让程序员轻松地将正确的名称或值赋值给变量。你甚至可以使用这些运算符来帮助你在任何想要处理的代码中执行保存、搜索和其他任务。在你编写的代码中，可能会经常看到的一些常见的赋值运算符包括：


    - `=`: 这个运算符是简单的赋值运算符。它将右侧操作数的值赋值给左侧的操作数。

    - `+=`: 这种被称为加法赋值运算符（Add AND）。它会将两个操作数的值相加，然后将结果之和赋值给左侧的操作数。

    - `*=`: 这是乘法赋值运算符（Multiply AND）。它将两个操作数相乘，然后将结果交给左侧的操作数。

    - `-=`: 这个运算符会将右侧操作数的值从左侧的值减去，然后将差值交给左侧的操作数。

    - `/=`: 这是除法赋值运算符。它将左侧的值除以右侧的值，然后将结果赋值给左侧。


    在继续之前，我们还需要更深入地探索这些赋值运算符。在这里需要记住，赋值运算符通常被认为是你可以操作的最常见的运算符之一。在这种语言中还会出现其他几种运算符，但请记住，它们大部分出现在非常高级的代码中，并不是你现在需要关注或频繁使用的运算符。在大多数情况下，你编写的包含这些赋值运算符的代码只会使用等号来帮助为变量赋值，例如。但在某些情况下，你可以使用我们上面列出的其他赋值运算符，以便代码按照你想要的方式运行。


    ## 关系运算符


    最后，我们将转向 C++ 语言中我们要关注的第四种也是最后一种运算符。这种运算符被称为关系运算符。这些运算符将以与其他某些选项不同的方式帮助我们，但仍然会确保我们的代码按照我们的意运行。我们在这里可以操作的使代码行为的一些最佳关系运算符包括：


    - `==`: 这个运算符将检查你两个操作数的相等性。如果它们相等，则条件为真（true）。

    - `>`: 这个运算符将检查操作数的值。如果左侧的操作数高于右侧，则条件为真（true）。

    - `<`: 这个运算符基本上与上一个相反。如果你发现左侧操作数的值大于右侧，则条件为真（true）。

    - `!=`: 这个运算符将检查你两个操作数的相等性，如果值不相等，则你的条件为真（true）。

    - `<=`: 这个运算符将检查左侧操作数是否小于或等于右侧操作数。如果符合这一标准，则条件为真（true）。

    - `>=`: 这个运算符将检查左侧操作数的值是否大于或等于右侧的值。如果真的，则条件为真（true）。


