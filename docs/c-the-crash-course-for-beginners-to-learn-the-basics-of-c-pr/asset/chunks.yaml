    ## Arithmetic Operators


    - `-`: this is the subtraction operator. It is going to take the right-hand operand
    and subtract it from the left-hand operand.

    - `*`: this is the operator that makes it possible to do multiplication in the
    C++ language.

    - `/`: this operator helps you to do division in C++.

    - `++`: this is the increment operator. It is going to increase the value of your
    operand by one.

    - `--`: this is the decrement operator. It is going to decrease the operand value
    by just one.


    There are going to be many options that you can work with when you want to focus
    on these arithmetic operators. The first option here is that you are able to actually
    put more than one of these operators at a time in the same part of the code. You
    will be able to add a few things together, and then divide others, and mix it
    around to make sure that these are going to work that we need. This ensures that
    we are going to get the most out of some of the codes that we are trying to write
    along the way as well.


    ## Assignment Operators


    The next kind of operator that we are able to work with here is going to be known
    as the assignment operator. This one is even more common than what we were able
    to see with the arithmetic operator from above, and we already have seen it quite
    a bit when it comes to some of the codes that we have written out in this guidebook
    so far. And it will not take you much time before you start to see some of these
    operators all over the place when you start to code.


    To start with, you will see that the assignment operator is going to be responsible
    for making it easy for the programmer to assign the right name or value over to
    a variable. And you can even use these operators to help save, search, and other
    tasks inside of any code that you would like to work with. Some of the most common
    of these assignment operators that you are likely to see a lot in some of the
    codes that you are writing will include:


    - `=`: this operator is the simple assignment operator. It is going to assign
    the value of the operand on the right hand to the one that is on the left.

    - `+=`: this one is called the Add AND operator. It is going to add together the
    values from both operands and then assigns the sum of these over to the operand
    on the left side.

    - `*=`: this is the Multiply AND operator. It is going to multiply both of the
    operands and then give the results over to the operand on the left side.

    - `-=`: this is the one that will subtract the value of your operand on the right
    side from the one on the left and then gives this difference to the left operand.

    - `/=`: this is the divide and operator. It is going to divide the value that
    is on the left side from the one on the right side and then assigns this amount
    to the left side.


    Before we move on here, we need to explore these assignment operators a bit more
    as well. It is important to remember here that the assignment operators are often
    seen as some of the most common operators that you are able to work with. There
    are going to be a few others that show up in this kind of language, but remember
    that these are going to be in really advanced codes for the most part, and they
    are not ones that you are going to focus on or use all that much right now. For
    the most part, the codes that you are going to write out that have these assignment
    operators in them will just use the equal sign to help assign a value over to
    a variable for example. But there are times when you will be able to use some
    of the other assignment operators that we have listed out above in order to get
    the code to work how you would like.


    ## Relational Operators


    And finally, we are going to move on to the fourth and final type of operator
    that we are going to focus on when it comes to the C++ language. And this one
    is going to be known as the relational operators. These operators are going to
    come in and help us out in a different manner than some of the other options,
    but will still make sure that our code is going to work in the way that we want.
    Some of the best relational operators that we are able to work with here to make
    our code behave will include:


    - `==`: this is the operator that is going check the equality of your two operands.
    If they are equal, the conditions will be true.

    - `>`: this operator is going to check the value of your operands. If the operand
    on the left side is higher than the one on the right, the condition will be true.

    - `<`: this operator is basically the opposite of the one above. If you find that
    the value of your operand on the left side is greater than the one on the right
    side, the condition will be true.

    - `!=`: this one is going to check the equality of your two operands and if the
    values are unequal, your condition is true.

    - `<=`: this operator is going to check whether the operand on the left side is
    less than or equal to the operand on the right side. If it meets this criterion,
    the condition will be true.

    - `>=`: this one is going to check if the value of the operand on the left side
    is greater or equal to the one on the right side. If it is true, the condition
    is true.

