  trans: '


    ## 2. POCO::Net

    这个网络类将为我们提供一个比上面更高级的网络库。除了 `Boost ASIO` 中包含的一些基础网络协议外，它还将提供 `FTP`、`HTTP`、`DNS`
    以及电子邮件的类，并支持 `SSL` 和 `TLS`。


    ## Web 服务

    当我们在使用 C++ 语言处理 Web 服务时，还会发现一些选项。一些最佳的选项包括：


    1. `gSOAP`：这是一个成熟且持续维护的工具包，将帮助我们支持 `REST` 和 `SOAP XML` Web 服务。

    2. `Casablanca`：这是一个较新的库，由微软创建，旨在帮助程序员提供一些所需的工具，以便在 `C++` 中访问和编写 `REST` 服务。尽管该库源于微软，但它支持除
    Windows 之外的多个平台，包括 `Mac`、`Linux` 以及其他一些移动平台。


    ## 数据库

    有时你可能需要从数据库中收集 `C++` 编程所需的数据。如果你拥有正确的库或库包来完成工作，这会变得很容易。我们可以使用的、能够帮助处理这些数据库并完成任务的最佳
    `C++` 库包括：


    1. `POCO::Data`：该命名空间下的类将与我们在 `Java` 和 `.NET` 中看到的数据库框架风格非常接近，它具有与数据库无关的抽象层，这可以帮助我们同时与多个数据库进行通信。它内部支持
    `SQLite`、`ODBC` 和 `MySQL` 数据库。

    2. `OTL`：这个库将处理你需要的某些数据库，如 `ODBC` 和 `Oracle`，如果你正在寻找符合 `C++` 习惯的库，可能会对它感兴趣。这是因为该数据库选项的抽象是一个纯头文件（header-only）库，并且在接口上更具
    `STL` 风格。


    ## XML

    有时你可能需要处理现有的某些 `XML` 页面，你完全可以使用 `C++` 库来实现这一点。如果你知道如何让它满足你的需求，将两者结合使用可以编写出非常强大的代码。一些可以与
    `C++` 配合并帮助我们处理所需 `XML` 的库包括：


    1. `POCO::XML`：这个类将为我们提供 `XML`、`DOM` 和 `SAX2` 的写入器。它还可以借助 `Expat XML` C 语言库为我们提供解析。

    2. `Xerces C++`：这个库将迅速带我们进入一个非常大的 `XML` 框架。除了 `SAX2` 和 `DOM` 之外，它还支持 `XML` 架构验证，并且通过构建在
    `Xerces` 之上的辅助库，将持续提供你所需的支持。


    同时，你可能对一些快速且轻量级的 `XML` 库感兴趣，这些库经过了修改，以同时帮助 `C++` 语言。我们可以使用的这类库包括 `RapidXML` 和
    `TinyXML`。它们并不具备我们从 `XML` 需要的所有功能，但方便我们根据需要进行使用和集成。


    ## JSON

    有时你也可能想处理 `C++` 的 `JSON` 特性。这不像我们上面讨论过的其他部分那么常见，但学习如何让它满足我们的需求仍然非常重要。一些支持 `JSON`
    的最佳 `C++` 库包括：


    1. `JsonCPP`：这是一个用于 `C++` 语言的简单 `JSON` 读取器和写入器。

    2. `JSON Spirit`：这是另一个 `JSON` 读取器和写入器。它是借助 `Boost Spirit` 解析器生成器构建的，因此你还需要配合 `Boost`
    库，因为已经对该库有依赖。

    3. `POCO::JSON`：`POCO` 也涵盖了这一部分并准备就绪。如果你想留在这个家族，它有一个专门的 `JSON` 命名空间。


