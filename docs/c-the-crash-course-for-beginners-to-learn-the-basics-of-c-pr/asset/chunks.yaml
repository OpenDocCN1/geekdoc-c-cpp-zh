- fmt: "\n# Multithreading\n\nThis is a very helpful tool in a lot of the applications\
    \ that you are going to use C++ for. it allows processes to run at the same time,\
    \ rather than having them sit in a queue and wait their turn. This can speed up\
    \ the process in which things get done and are useful with a lot of the gaming\
    \ that you may want to do with your program.\n\nSome of the best libraries that\
    \ are out there that can help C++ do better with some of the multithreading that\
    \ you want to do will include:\n\n- **Standard library for C++ 11 and 14**: Multithreading\
    \ is one of the areas where the standard library with C++ has been updated to\
    \ include support for this. Some of the basic functionality of this was added\
    \ to `C++11` and some more of the classes were then added to the `C++14` option.\
    \ The other options are good ones to work with if you have not started working\
    \ with the `C++11` version.\n- **Boost Thread**: This library is going to be implementation,\
    \ that comes in a different name, that makes the functionality of multithreading\
    \ possible for those who have an older compiler of CC++.\n- **POCO**: This library\
    \ is going to come with a few different classes that can help us to work with\
    \ this process. This is going to include some of the higher-level abstractions\
    \ for managing tasks.\n\nAs we can see here, there are a ton of different options\
    \ that you are able to work with when it comes to handling the different functions\
    \ and more that you want to handle with the C++ language. When you are able to\
    \ add these into some of the coding that we are doing, and you make sure that\
    \ it matches up in the manner that you want with the programs that you want to\
    \ create, you are going to see some amazing results in the process. Take a look\
    \ at some of the libraries that are available here, and see which one is going\
    \ to be the best for you to work with based on your own needs.\n\n# Chapter 4:\
    \ How to Create Your First Program in C++\n\n![Sviluppatore, Programmatore, Tecnologia](rsrcBC.jpg)\n\
    \nNow that we have had a chance to know a little more about the C++ program and\
    \ what it is able to offer to us, it is time to actually dive in and look at some\
    \ of the coding that come with this language. This is going to be a pretty exciting\
    \ chapter because it is going to help us to start putting some of the codes that\
    \ we have already discussed to good work.\n\nYou might already have some ideas\
    \ of what kinds of codes you would like to be able to write out, but we need to\
    \ start out slow here and know some of the basics, and try out a few things here\
    \ so that we make sure that we are on the same page and getting things going on\
    \ the right track. The very first thing that we need to focus on here is getting\
    \ our environment set up. This environment is going to be important because it\
    \ is where we are going to write out our codes and then execute it for us.\n\n\
    The good news is that this process is easy. An environment should download with\
    \ your C++ package from the original website if you choose to go with that. If\
    \ you find that this environment is not quite giving you what you are looking\
    \ for, there are often a lot of options online that you are able to pick out from,\
    \ and sometimes you can find a few for free that you can download and use how\
    \ you would like.\n\nOnce you have been able to download the environment that\
    \ you want to work within CC++, it is time for us to get a bit more familiar with\
    \ what we are going to do with this language, and we are going to work on writing\
    \ out our first codes. We are going to keep it simple here so do not worry that\
    \ it will be too hard or too complex for you to work with. We are going to work\
    \ with a “Try this” code that is only going to take up a few lines but will still\
    \ have some of the parts of the syntax that we need to learn, found inside. The\
    \ code that we are going to use to get started with this will include:\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\nint main (){\n    cout << “Use This\
    \ One!\";\n    return 0;\n}\n``` (Note: corrected \"court\" to \"cout\") You have\
    \ a few options available when it comes to writing this out. You can choose to\
    \ write this out in your compiler, which will be available in your environment,\
    \ or you can choose to write it out and save it to your computer. The second option\
    \ is sometimes nice because then you would have the code saved and cold copy and\
    \ paste it any time that you would need it in your code.\n\nEither way, you should\
    \ carefully consider the type of text editor that you want to work with. Most\
    \ of them are going to be device-specific so you will need to look for the one\
    \ that goes with your particular computer. Some of the options that you can go\
    \ with include Windows Notepad, `vim`, `vi`, `Brief`, and `EMACS`. If you would\
    \ like to have an editor that is able to go on more than one platform, then the\
    \ `vim` and `vi` options are the best ones.\n\nAny time that you are working on\
    \ writing out some of the codes that you need in this code, you will need to write\
    \ them out in your text editor first. When you are done with this, the compiler\
    \ is going to be the part that will execute the codes so that you are able to\
    \ see how they work. This is a good way to check your work ahead of time though\
    \ to make sure that it is going to look good and will do what you are hopping\
    \ along the way.\n\n# The C++ Compilers\n\nJust like with some of the text editors\
    \ that we talked about already, there are actually going to be a few different\
    \ types of compilers that you are able to choose from as well. The problem that\
    \ often comes up is that while we get to pick from many choices, there is a lot\
    \ that is more expensive than what most programmers want to pay. This is because\
    \ a lot of the compilers that are out there are meant for elite hackers or really\
    \ high-class work that you want to do with CC++.\n\nThe good news with all of\
    \ this though is that there are some compilers that we are able to use that are\
    \ free. We just need to be careful and watch out that we are getting ones that\
    \ are good and still provide us with the features that we need. One compiler that\
    \ you may like to work within this language is known as GNU. This is a good one\
    \ to use especially when you are working on any of the Linux operating systems,\
    \ and it is possible that it is already found on your computer. To go through\
    \ and check out whether the GNU compiler is going to be available on your system,\
    \ you will need to work with the following code:\n\n```bash\ng++ -v\n```\n\nIf\
    \ the compiler is installed, then you should see this message on the screen:\n\
    Using built-in specs.\nTarget: i386-redhat-linux\nConfigured with: ../configure\
    \ –prefix=/usr …\nThread model: posixgcc version 4.1.2 20080704 (Red Hat 4.1.2-46)\n\
    \nIf you typed in the code above and you did not get that message to come up on\
    \ the screen, it means that you either did not download the compiler the proper\
    \ way or you do not have it on your computer in the first place.\n\n# A Review\
    \ of the Syntax\n\nWe need to go through a few of the basics that are going to\
    \ come up when we are talking about the syntax that comes with the C++ language.\
    \ The language here is one that can be defined as a program that is going to use\
    \ objects to help make sure that everything is organized, and will allow the codes\
    \ that you are writing to invoke and communicate with other objects. There are\
    \ going to be four main parts that come with this kind of language that we need\
    \ to watch out for to ensure we are not missing them or not adding them into our\
    \ syntax. These four parts are going to include:\n\n- Classes: These are the organizational\
    \ tools for your language. They can be seen like boxes that are able to hold onto\
    \ objects and will sort out similar ones. You are able to label your class anything\
    \ that you would like, but it is good coding practice to place objects that are\
    \ similar in some way into the same class.\n"
