    # Chapter 11: Terms to Know in C++


    ![Programmazione, Progettazione, Coworking](rsrcTP.jpg)


    Before we end this guidebook, we need to take a few moments to look at some of
    the terms that are going to be useful when you are working on your codes in C++.
    There are a lot of terms that we may have taken the time to learn about and talk
    about or at least bring up in this guidebook so far. But now we are going to spend
    some time going into more depth about them, helping us to understand what is going
    on with them and how we can use these for our needs. Some of the terms that you
    need to know in order to get started with the C++ language will include:


    ## Compiler

    The compiler is going to help us out because it is going to be what can read all
    of the characters that you have typed into the code of the program. After it has
    been able to read the entire code, the compiler is then going to convert the code
    into a format that the machine can understand, meaning turning it into 0s and
    1s. the compiler is going to be dedicated and will work hard for you while coding
    because it is able to read out each of the characters correctly. Since our processors
    on our computers are only able to understand binary numbers, it is impossible
    for us to write out a program that will be all in these numbers and we can’t directly
    code to the processor, even though this is what will run the program. The compiler
    is going to be able to convert the coding for the program into a form that the
    machine will understand. The instructions that we are going to type, which are
    known as the source code, will be converted into object code for the processor
    to work off.


    Before you are able to do any of the programming that you would like, you need
    to have a C++ compiler. There are many of these available so you can search around
    and find the one that is right for you. After you download the compiler, you can
    create a new source file for C++, and then type in the code that you want for
    C++ into the computer.


    ## Keywords

    Another thing that we can explore is keywords. These are going to be the words
    that the compiler already knows. What this means is that when the compiler sees
    this keyword show up in your program, as long as it shows up in the right spot
    the compiler is going to know what it should do automatically, without you putting
    in any more effort. For example, when your computer encounters the `int` keyword,
    it will know that this is supposed to stand for integer. Or if the compiler reads
    a `break`, then it knows that you would like it to break out of the current loop
    when the conditions are met.


    ## Variable and constant

    Here we need to take a look at two of the terms that are important to what we
    are doing in coding. As we can guess by the name, the variable is going to be
    something whose value can be changed throughout the program. It is not fixed.
    But then we have the constant. This one is a bit different because it is one that
    has its value stay the same, or constant, throughout the entire program.


    ## Operands and operators

    These are similar to one another so we are going to keep them on the same heading
    here. To keep it simple, the operator is going to be something that is able to
    perform operations on the variable. For example, the `+` is going to be the operator
    that we can use to perform the addition operation and add two things together.
    The terms on which this operator will operate will be known as the operands. In
    the expression `x + y`, `x` and `y` are going to be known as the operands, and
    the `+` sign is the operator.


    ## Expression

    In programming, the expression is going to perform an operation for us and will
    contain operators and operands, or sometimes it will contain a variable in there.
    A good example of this is `> b`. This is going to be an expression where the `a`
    and `b` will be the operands and the `>` symbol is the operator like before, but
    the expression is going to include all of it.


    ## Binary and unary

    We have brought up the idea of binary a bit in this guidebook, but we need to
    look at what it means, especially when we are able to compare it to unary. With
    binary, we are going to mean two, and unary is going to mean one. This means that
    the binary operator is going to operate on two operands or even on two values,
    and then the unary operator is going to operate with just one of these operands.


    ## Definition and declaration

    This is something that we need to spend a bit more time on. When we are working
    with some of the programming that we want to do in C++, these two terms are going
    to be used often. Declaration of a variable means that we are going to tell the
    compiler that this variable is going to be an integer, or that this variable is
    going to be a character. A declaration is going to inform our compiler about the
    type of variable that we want to work with. Defining the variable means that we
    are going to allocate space in the memory by the compiler in order to handle this
    kind of variable.


    If we are working with a variable, a single statement is going to be able to perform
    both the definition and the declaration. For example, when we are working with
    the statement of `int x;`, it is going to be able to declare and then define the
    variable `x` as an integer. Remember that the declaration is just going to be
    there to declare the type of something. So, this means that it is going to tell
    the compiler what data type it is supposed to working with. But definition means
    that we are actually allotting some space to it. It may seem as if these are both
    the same thing, and in some cases they are. But there are a few times when this
    is not going to be true and we need to remember that they are different.


    ## Initialization

    Assignment of a value to a variable. If we are working with the statement `x =
    5`, then this is going to initialize the value of `x` to `5`. Always remember
    that the value that is on the right of equal sign is going to be stored or assigned
    to the value that is on the left of equal sign as well.


    ## Character

    These are going to show up a lot in some of the codes that you would like to write
    out. They include some special symbols, numbers, and alphabet. While it is common
    for us to just think about characters as letters, we have to remember that a character
    can be anything even white space that is in your code.


    ## Syntax

    No matter what kind of language you are working with, each language is going to
    come with its own syntax. By this term, we are going to refer to the structure
    of the language and the use of rules that you must follow. Only if the programmer
    adheres to this syntax will the compiler be able to understand the instructions
    that you are sending over. C++ language has its own set of rules.


    ## Errors

    This is going to be a very common term when you start to work with some of the
    coding that you would like to accomplish. To keep it simple, error means a mistake.
    When we are talking about syntax error, we are going to mean that there is some
    kind of mistake found in the syntax that we are working with. The compiler is
    going to take some time to read through the entire program that you are working
    on before it does any execution. While reading the program you wrote, if the compiler
    finds that there is something it is not able to read or understand, it is going
    to send up an error message. Until you have been able to clear out that error,
    the program cant be executed because the compiler doesn’t know what to do. There
    are a lot of times when errors can come up if the code is not written properly,
    but you may see syntax error if the syntax has not been adhered to properly. When
    the errors are generated by the compiler, it means that you have a compile-time
    error. Of course, as you go through this process, there are going to be other
    error types as well. The compiler is not going to be able to detect all of the
    errors though. For example, if the programmer goes through and makes an error
    that is logical, or if the program is written to add two numbers and you work
    with a subtraction sign instead of addition, the compiler would not know this
    as well. The compiler can catch a lot of the errors for us, but we also need to
    be on the lookout for these as well.


    ## Executable file and linkers

    Executing is going to be the process that takes place to run a program. We have
    spent some time talking about the object file, but can we execute these files
    directly? The compiler that we are working with is going to produce object code,
    but this code is going to depend on a few external files to get things done. For
    example, if you are planning on working with some complex mathematical functions,
    you might make use of the functions that another programmer has already gone through
    and defined. That programmer would have created a library which you are able to
    add on to the source code, rather than having to recreate them in your own program
    each time. A library is going to be a collection of object files. This means that
    the program is going to depend on the other object files for some of the mathematical
    functions that are more complex than you want to use. Someone has to be able to
    link up all of these object files in order to produce a file that can be executable.
    This work is going to be done with a linker; most modern compilers are going to
    have this linker included with them. Remember that when we are working with the
    source code of C++, we have to compile them all separately in order to produce
    object code. If you have ten source codes, this means that we need to have ten
    object codes. Then the linker is going to go through and combine these ten object
    codes so that you end up with one single executable module at the end.


    ## Debugging

    We also need to take a look at the process of debugging. This may sound more complicated
    than it really is; it is the process of troubleshooting a program. This is going
    to happen when the program you are working on is not performing in the manner
    that you expect it to. Debugging is going to be when we are able to identify some
    of the bugs, or the errors, that are going to show up in some of our codes.


    As you can see, there are a lot of different parts that need to come together
    to help you to create some of the codes that you would like in C++. And knowing
    some of the most common terms can make this easier than ever to control the code,
    and to really see what we are working on inside. When you are ready to start coding,
    having a good grasp of these topics is going to make it easier to get some of
    the coding done.


