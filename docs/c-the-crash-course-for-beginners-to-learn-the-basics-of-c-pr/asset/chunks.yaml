    ## Handling Exceptions in C++


    The next thing that we need to take a look at when it comes to working in the
    C++ language is how to handle some of the exceptions that are going to come up
    in some of the codes that you are writing. An exception is going to be some kind
    of issue or problem that is going to show up when you are working to execute one
    of your own codes or programs.


    An exception in C++ is going to happen in response to an exceptional circumstance
    that will usually occur while the program is trying to run some of the code you
    wrote. The most common type of these exceptions though will be raised when the
    user tries to divide by zero. There are other options that we are able to work
    with through this process.


    Exceptions can be nice inside some of the code that we are writing because they
    will make sure that you are going to transfer control away from one part of the
    program so that you can over to another. The exceptions that happen in C++ will
    be built upon the three main keywords that are there including a `try`, `catch`,
    and `throw`. Let’s take a look at how we are able to work with each one and how
    they are meant to work in some of your code.


    *   **Throw**: The first one that you can work with is the `throw` keyword. The
    program is going to throw out an exception when a problem shows up. This will
    be done simply by using the `throw` keyword.

    *   **The catch**: A program is able to catch on to an exception with an exception
    handler at the place in a program where you would like to handle the problem.
    If you use the `catch` keyword, it is going to tell the program that you want
    to catch that exception.

    *   **Try**: When you use the `try` keyword, it is going to identify a block of
    code where particular exceptions can be activated. When you go with this one,
    it is going to be followed by at least one `catch` block.


    Assuming that your block is going to be able to raise up an exception for you,
    a method is going to be able to catch the exception, along with the other two
    keywords of `catch` and `try`. These will then be placed around the code that
    is going to end up with the exception. It does not always mean that these exceptions
    will happen, but it does mean that it is something that you need to focus on at
    least a bit in some of your codes.


    And these are some of the basics that we need to focus our attention on when it
    comes to working with some of our C++ codes. These are all things that you are
