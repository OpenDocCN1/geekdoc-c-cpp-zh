    \ more about how this is supposed to work and what is going to happen when we\
    \ do go through and create one of our own programs here. When we are using the\
    \ picture above, we will see that when this program first starts to run, the system\
    \ is going to work to call up the `main()` function, as we talked about before.\
    \ What this all means is that the system is going to start executing all of the\
    \ codes that are there from the `main()` function to help keep it organized. Then\
    \ we have to move on to look at how we are able to control the program. When the\
    \ control of the program starts to reach the `function_name()` part, which is\
    \ inside of that `main` function that we started with, it is then going to move\
    \ on to the `void function_name()` part. And then all of the parts that are inside\
    \ of that particular function will be executed. The next step that we are going\
    \ to see here is that the control of the program is going to move again. For this\
    \ one, the control is going to head on back to the `main` function. This is where\
    \ our code is going to be able to call up the `function_name()` and will have\
    \ it become executed as it is shown in the figure above.\n\n## Function Prototype\n\
    \nWe are then able to look at the idea of the function prototype. This is going\
    \ to be the same as working with the function declaration. If the user defined\
    \ function is able to be defined when we are done with the `main` function, then\
    \ the compiler is going to stop the program and show an error. This is because,\
    \ at the time, the compiler is not going to be aware of the user-defined function,\
    \ the types of the arguments that you would like to pass on to the function, and\
    \ the return type. When we are in the C++ language, the function prototype is\
    \ going to be the declaration that we need with the function, without its body,\
    \ to help give the compiler information about the function that you are creating.\
    \ You will find that a good example of this is going to be the following: `int\
    \ add(int, int);`. You are able to see with this one that there is not going to\
    \ be a body of the function that is found in the prototype. Also, there are only\
    \ going to be the return type of arguments in this, but there will not be any\
    \ arguments. You can also declare a function prototype using the option below:\
    \ `int add(int a, int b);`. One thing to note before we move on here is that it\
    \ is not going necessary for the programmer to go through and define the prototype\
    \ before the main function.\n\n## Passing Arguments to Your Function\n\nWe talked\
    \ a little bit about these arguments in the previous part, but now we need to\
    \ be able to take this a bit further and look at how this is going to work inside\
    \ of some of the coding that we would like to do in this language. In C++, arguments,\
    \ or the parameters, are going to refer to the data that is going to be passed\
    \ to the function, or the function definition, when we call it up. In the examples\
    \ that we have done before, the two variables that we have, which are `num1`,\
    \ and `num2`, are going to be passed to the function when we call up that function.\
    \ These arguments are unique because they are going to be known as the actual\
    \ arguments. The value that we are going to be able to get with `num1` and `num2`\
    \ are going to be initialized to the variables `a` and `b` respectively. These\
    \ arguments of `a` and `b` are going to be known as the formal arguments with\
    \ what we are talking about now. The way that we can demonstrate this is going\
    \ to be in the graph below:\n\n![Passing argument to a function in C++ programming](rsrcK5.jpg)\n\
    \nTo help us to better understand how this is supposed to work, we can work with\
    \ a few of these following notes on passing arguments to get it down:\n\n1. The\
    \ numbers of actual arguments and formal arguments should be the same. There is\
    \ an exception to this when we talk about the function overloading process, but\
    \ we are not going to spend too much on that right now.\n2. The type of first\
    \ actual argument should really match the type that we are going to see in our\
    \ first formal argument. Along with the same idea, the type of the second actual\
    \ argument should match up to the type of a second formal argument, and so on\
    \ from there. this helps to keep it all organized and working the way that it\
    \ should.\n"
