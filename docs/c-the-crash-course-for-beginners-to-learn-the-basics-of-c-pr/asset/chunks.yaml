- fmt: "\nAnd these are the basics of what you need to know when getting started with\
    \ the C++ language. Learning what all of these are about and how to write out\
    \ some of the codes that we did throughout this chapter will be so important to\
    \ ensure that you can actually get started with some of your own codes later on.\
    \ With a bit of practice and trying things out, you will be ready to take on some\
    \ of the more complicated types of codes as we progress through this guidebook.\n\
    \n# Chapter 5: Working with the Conditional Statements, or the If Statements\n\
    \n![Programmazione, Codice, Sviluppo, Web](rsrcCZ.jpg)\n\nOne thing that can be\
    \ a lot of fun in all of the different coding languages that you do, but especially\
    \ when we are talking about the C++ language, is the decision control, or the\
    \ conditional statements. These go by a lot of different names, but you will find\
    \ that these are going to be some of the best things that you can focus on in\
    \ order to ensure that any program that you write out will be able to make decisions\
    \ on its own, without the programmer being there or having to figure out all of\
    \ the possible inputs that it could receive from the user.\n\nThere are times\
    \ when you will be writing or creating your own program and you want to make sure\
    \ that it is able to handle making the right decisions for that program, even\
    \ when you, the programmer, are not there. We may see that this is happening when\
    \ we would like the user, or another programmer, to add in some of the information,\
    \ and then you expect the program to respond based on any of the conditions that\
    \ you set ahead of time.\n\nWith this kind of method, you will be able to get\
    \ your program to act in a certain way, and you can make some of the adjustments\
    \ that you need based on the conditions that you add to the code. The decision\
    \ making that happens with these programs is going to make sure that the program\
    \ is going to perform in the manner that you want, but it is going to be more\
    \ complicated than it seems sometimes, so learning how to work with the conditional\
    \ statements can get it all done.\n\nAs we go through with this, you will find\
    \ that there are going to be more than one option that you are able to use with\
    \ the conditional statements. For example, you can choose to go with one of the\
    \ options that will only run and do any of the work when the user presents it\
    \ with the right input. There are conditional statements that are able to provide\
    \ you with an answer no matter what input the user gives to the program. Or you\
    \ could end up with one that is able to list out things like a menu of items and\
    \ then you are going to have the user pick out the one that they like the most.\
    \ With this in mind, let’s take some time to look at this chapter a bit more and\
    \ look at some of the conditional statements that are available for you to work\
    \ with.\n\n## The Switch Conditional Statements\n\nWith some of the information\
    \ above in mind, the first conditional statement that we are able to spend some\
    \ time on here is going to be the switch statements. These statements are going\
    \ to provide you with a lot of opportunities because they can allow the programmer\
    \ time to check out whether there is an equality of the variable against the cases\
    \ or the values that you outlined inside of the code from the beginning. The variable\
    \ that you would check out here can then be checked out against a lot of other\
    \ cases. An example of the kind of syntax that we are going to be able to work\
    \ with on this kind of conditional statement will include:\n\n```cpp\nSwitch(expression){\n\
    \    case constant-expression:\n        statement(s);\n        break; //optional\n\
    \    case constant-expression:\n        statement(s);\n        break; //optional\n\
    \    //you can add in as many of these case statements as you would like\n   \
    \ Default: //Optional\n        statement(s);\n}\n```\n\nWhen you are working with\
    \ the switch statements, there are some rules that you must follow in order to\
    \ make them work inside of your code. First, the expression that you use with\
    \ the switch statement should be either an enumerated or an integral class type.\
    \ In addition to this, it can also belong to a class that has a conversion function.\
    \ The good news is that when you are working with C++, there isn’t a limit on\
    \ how many of these case statements that you are able to add into this syntax\
    \ so you can make these either short or long depending on what your code wants.\
    \ The important thing to remember here is that you need to add in a colon as well\
    \ as a value to each one that you want to use. Once the variable has some of the\
    \ time that it needs to find a value that it is equal to, it is then going to\
    \ continue running until it is able to find the break statement that you wrote\
    \ out. when the system then finds that break statement, the switch will end up\
    \ stopping what it is doing. Then the control flow will be able to pass through\
    \ to the next part of the code. You do not need to add in this break statement\
    \ when working with cases. If you do skip out on this part though, remember that\
    \ the control flow will just skip over this part and pass on to the rest of the\
    \ code.\n\n## The If Conditional Statements\n\nThe next kind of conditional statements\
    \ that are on our list in this language will be known as the if statements. The\
    \ if statement is unique because it ends up being one of the most basic things\
    \ that you are able to do when it is time to work on the conditional statements\
    \ because they will be based on the idea of true and false. If the system decides\
    \ that the input it is given by the user is going to match up with the conditions\
    \ that you were able to set, then it is considered true and the program will then\
    \ go through and run the parts that you add after this. For example, if you are\
    \ setting up a program and it asks the question of `2 + 2`, and your user gives\
    \ the answer of `4`, the program would see that this is true and then give the\
    \ message you picked or have the next part of the code behave how you would like.\n\
    \nHowever, it is going to be a bit different if the input is not going to match\
    \ up to your condition. If you work with the if statement and the user put in\
    \ an input that matches up with the conditions that you set, then it is able to\
    \ proceed to show up the statement and continue on with the code that you write.\
    \ But then we need to look at what is going to happen to the code if the user\
    \ saw `2 + 2` and put in the wrong answer? Maybe they decide that this equals\
    \ `5` instead. Then the condition that you set is not going to be met here, and\
    \ it is going to be seen as false in the else statement. Since this is a pretty\
    \ basic option when working on these conditional statements, you will find that\
    \ it is not going to do that good of a job when it is time to handle that false\
    \ answer. If the user, in this case, puts in any kind of number for their answer\
    \ that is not `4`, then the if statement is going to see this as false, and not\
    \ know where to proceed. This leaves a blank screen on the computer and nothing\
    \ else is going to happen. It won’t take long for you to do some coding before\
    \ you find that this is not a good thing, which is why we are more likely to work\
    \ with the if else statements.\n\n## The If Else Conditional Statements\n\nThe\
    \ third type of conditional statement that we are able to work with is the if\
    \ else statement. As we discussed a bit above, the if statement is a good way\
    \ to get some practice with what we are able to do. The syntax that you are able\
    \ to work with for if else includes:\n\n```cpp\nif(boolean expression){\n    //statement(s)\
    \ will execute if boolean expression is true\n}Else{\n    //statement(s) will\
    \ execute if boolean expression is false\n}\n```\n\nThe else statement is going\
    \ to work in a variety of situations. Not only does it allow for the user to put\
    \ in an answer that may not meet your conditions, but there are also times when\
    \ you may want it to let the user pick from a few different options. \n\n## The\
    \ Elif Statements\n\nThe fourth option that we are able to work with when it is\
    \ time to handle these conditional statements is the elif statement. These are\
    \ going to take things a bit further compared to the if and else statement. These\
    \ statements can be useful because they are going to list out all of the options\
    \ that you like for your user to be able to use. Think about it like a menu on\
    \ a game. You will be able to use this to list out a few different things and\
    \ then the user can come in and pick the option that they like. This is a good\
    \ conditional statement to work with because it adds a lot of functionality to\
    \ any code.\n\n# Chapter 6: Creating Your Loops in C++\n\n![Programmatore, Codice,\
    \ Programmazione](rsrcEV.jpg)\n\nNow it is time for us to look a bit more at some\
    \ of the coding we are able to do with this language and making sure that we can\
    \ get some stuff done with C++. You are able to use this language to help us do\
    \ some amazing things when the loops and arrays are brought into the mix, and\
    \ this chapter is going to spend a few moments taking a look at how we are able\
    \ to get both of these to work. So let’s jump in and see how we are able to work\
    \ with the loops and the arrays in your C++ code.\n\n## The Arrays\n\nThe first\
    \ thing that we need to look at in this chapter is how the arrays are going to\
    \ work in our C++ code. These are going to be a type of structure of data that\
    \ can store elements that are of the same type and the same size that is fixed.\
    \ These are going to be the collection, in other words, of the same type of variables.\
    \ But instead of going through and using some of the individual variables to make\
    \ this happen, you would be able to work with one array, such as an array of numbers.\
    \ To make this happen, we would be able to use the numbers of `0` to `99` and\
    \ then each one can be accessed by the index that comes on the array.\n\n```cpp\n\
    double balance[5] = {1000.0, 2.0, 3.4, 17.0, 50.0};\n```\n\nThe numbers that are\
    \ found in the bracket should never end up higher than the number of elements\
    \ that you wrote. This means that if you place `5` in the brackets, you will be\
    \ able to add in as many numbers as needed. This is helpful if you are not sure\
    \ how big the array will be.\n\n```cpp\n#include <iostream>\n#include <iomanip>\n\
    using namespace std;\n\nint main () {\n    double balance[10] = {1000.0, 2.0,\
    \ 3.4, 17.0, 50.0};\n    for (int i=0; i<10; i++) {\n        balance[i] = i+100;\
    \ \n        cout << setw(13) << balance[i] << endl;\n    }\n    for (int j=0;\
    \ j<10; j++) {\n        cout << setw(7) << balance[j] << endl;\n    }\n    return\
    \ 0;\n}\n```\n\n## Learning to Work with Loops\n\nAfter you have had some time\
    \ to learn how to work with arrays, it is time for us to take a look at how we\
    \ are able to work with the loops. These loops are nice because they are going\
    \ to really save us some time when we want to write out lines of code. There are\
    \ a few different types of loops that you are able to work with when it comes\
    \ to C++.\n\nThe first loop that is on our list is going to be known as the `while`\
    \ loop. The `while` loop helps us because it can keep going through your loop\
    \ and repeat as many times as needed as long as certain conditions are met. If\
    \ the condition is met, the loop is going to restart again. Once it finds that\
    \ the conditions are no longer true, the loop is going to stop. The syntax that\
    \ comes with this is meant to be simple:\n\n```cpp\nwhile(condition){\n    statement(s)\n\
    }\n```\n\nFrom there we are able to move over to the second loop that is found\
    \ in C++, which is the `for` loop. This is the loop that is only going to go through\
    \ and repeat itself if the conditions are true. The `for` loop is going to check\
    \ these conditions first before it runs through. This means that depending on\
    \ what kind of input you get, it is possible that the loop is not going to repeat\
    \ inside the program at all. If you want to make sure that your loop goes through\
    \ its iteration at least once, the `while` loop is the best one.\n\n```cpp\nFor\
    \ (i:conditions: increment){\n    statement(s);\n}\n```\n\nThen we can move on\
    \ to the `do...while` loop. This is another option that is going to be similar\
    \ to what we see with the `while` statement, but it is going to also wait to check\
    \ on the condition until you have reached the end of that statement, rather than\
    \ checking out the condition at the beginning. The syntax that you would write\
    \ out this kind of loop in C++ includes:\n\n```cpp\nDo {\n    statement(s)\n}while\
    \ (condition);\n```\n\n## Nested loops\n\nThe next one that you can choose to\
    \ work with is the nested loops. This is when you will have a loop that is inside\
    \ of another loop. Both loops will continue to run at the same time until both\
    \ of their conditions are met and then they can end. This allows you to create\
    \ a continuous loop of loops. This may be confusing, but the syntax is pretty\
    \ easy to work with and as you progress through some of your knowledge with C++,\
    \ you may find that you use the nested loop more than you would have thought.\
    \ The way that you will write out a nested loop inside the C++ coding language\
    \ includes:\n\n```cpp\nwhile (condition){\n    while (condition) {\n        statement(s)\n\
    \    }\n    statement(s) // you can put more statements\n}\n```\n\n# Chapter 7:\
    \ The C++ Functions\n\n![Hacking, Hacker, Computer](rsrcH6.jpg)\n\nWhen we get\
    \ to this point in the process, it is likely that you are going to be curious\
    \ as to why all of this is going to be important information to your coding. Why\
    \ would you want to learn about these arrays and how they should be used in your\
    \ coding? These seem complicated and like a lot of work to remember and this guidebook\
    \ is supposed to just be the basics to help a beginner code, rather than going.\n\
    \nThere are a few different types of loops that you are able to work with when\
    \ it comes to C++. We are going to take some time to look them over to help us\
    \ see how they are the same and how they are different we are able to do. There\
    \ are also things that we are able to work with functions. When we are talking\
    \ about programming, we will find that a function is going to refer to a segment\
    \ that is going perform a specific task. Depending on whether the function is\
    \ going to be predefined by the library that we are working with, or if it is\
    \ created by the programmer, there are going to be two main types of functions\
    \ that we are able to work with. These include the library function and the user-defined\
    \ function.\n\n## The Library Function\n\nThe first thing that we are going to\
    \ look at here is the library function. These are going to be some built-in functions\
    \ that are found in the C++ program. This means that you will not need to create\
    \ them at all and they are just going to be found in the library that you want\
    \ to write out. These can be nice to work with, and there are many of the functions\
    \ that you will need that fit into this kind of idea so you will be able to make\
    \ it work for you pretty well.\n"
