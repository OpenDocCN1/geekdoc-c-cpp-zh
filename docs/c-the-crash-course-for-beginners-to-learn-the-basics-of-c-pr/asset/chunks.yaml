    # 第 2 章：C++ 语言基础


    ![Source, Codice, Software, Calcolatore](img/rsrc62.jpg)


    接我们需要花费一些时间学习的是 C++ 语言自带的基础语法。如果我们想在这门语言上取得成功，了解语法的工作原理以及我们如何利用它为自己服务是至关重要的。语法对于这门语言非常重要，因为它能确保我们的代码是以编译器实际上能够理解的方式编写的。让我们来拆解
    C++ 语法中的一些基础知识，以及我们如何在过程中利用它们取得优势。


    ## C++ 注释


    列表上的第一个是 C++ 注释。当我们想在代码内部给自己留下信息或笔记时，这些注释非常好用，而不会实际影响代码的运行效果。这些注释还可以帮助阅读代码的人，因为它们可以帮助他们理解代码特定部分正在发生什么。作为一个初学者，你可能会发现代码中有很多这样的注释，你应该根据需要自由地使用它们。


    这些注释在引导你实现代码中想要的目标方面非常有用。而且你可以随心所欲为代码添加任意数量的注释。不过，最好的办法是保持它们最少化，因为如果注释太多，会让代码变得杂乱。


    你用于创建这些注释并告诉编译器此处是注释的符号包含了 `//` 符号。程序会看到该符号并直接跳过它，因此你的代码不会受到任何干扰，并且仍然会按照你想要的方式运行。


    在使用 C++ 语言时，你还可以编写稍微长一点的注释，这是其他编码语言可能不具备的。当你需要编写双行或多行代码时，你会使用 `/*` 开始注释，使用 `*/`
    结束注释。当编译器看到这些符号时，它会停止读取直到第二个部分出现。在那个点，它将再次开始读取代码。


    ## C++ 数据类型


    就像你在此过程中可能使用的其他某些编码语言一样，在 C++ 代码中也会出现很多数据点。例如，你经常会处理变量，它们只是你在计算机内存中预留的区域，以便代码的不同部分保持安全。在处理
    C++ 语言时，我们可以关注很多数据点，这些数据点包括：


    1. 布尔型 (Boolean)

    2. 双精度浮点型

    3. 浮点型

    4. 整数型

    5. 字符型

    6. 无值 (Valueless)

    7. 宽字符型


