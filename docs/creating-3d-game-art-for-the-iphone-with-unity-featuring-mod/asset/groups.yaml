    a shooting animation and renamed this action to shoot.


    Using the NLA Editor, you can then work with your animations as strips as they''re
    called. It''s much like using a video editor in that you can add strips or clips
    to a track and blend and transition between them. In our case, we just want to
    layer the shooting animation over the run, and this is done by placing the shoot
    track above the run and changing its blending mode to Add as shown in Fig. 7.13.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_181_0.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_182_0.png)


    FIG 7.11 This Image Shows the Stride Action


