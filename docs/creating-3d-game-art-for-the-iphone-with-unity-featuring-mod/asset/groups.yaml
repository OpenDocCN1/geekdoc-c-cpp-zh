    > 而且更重要的是，为 Unity iOS 和 iPhone 创建蒙皮网格的流程。我可以毫不费力地在 Maya 和 Blender 之间快速切换。我知道需要做什么，不必让软件来决定我能完成什么、不能完成什么。

    >

    > 我鼓励你不要陷入软件之争，要记住掌控一切的是艺术家，软件只是工具。一个值得采纳的好原则是：始终关注 3D 的基础，把软件放在次要位置。


    **图 5.1** 默认的 Modo 立方体是默认 Blender 立方体的一半大小。


    你可以看到，通过 FBX 以 1.0 的缩放因子（未应用缩放）导入 Unity iOS 的默认 Blender 立方体，其大小是默认 Unity iOS 立方体的两倍。这告诉我，需要将缩放因子设为
    0.5，才能让 Blender 对象与默认 Unity iOS 对象的大小一致。将缩放因子设为 1.0 时，导入对象不会应用缩放，这是衡量你的 3D 应用内部单位系统与
    Unity iOS 之间关系的绝佳方法。记住，导入 Unity iOS 才是目标，最好让所有 3D 对象都与 Unity 的默认缩放匹配。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_112_1.png)


    **图 5.2** 在缩放因子为 1.0 时，Blender 立方体是 Unity iOS 立方体的两倍大。


    > 记住，导入 Unity iOS 才是目标，最好让所有 3D 对象都与 Unity 的默认缩放匹配。


    好，我们已经确认 Blender 对象是 Unity iOS 对象的两倍大，并且需要在导入时将缩放因子调整为 0.5；然而，当处理从 Blender 导出的
    Modo 对象时，这个设置有一个注意事项。记住，我们的 Modo 对象是 Blender 对象的一半大小。如果我们从 Blender 导出 Modo 创建的对象，那么
    0.5 的缩放因子现在就不正确了。因为 Modo 对象是 Blender 对象的一半大小，从 Blender 导入并处理 Modo 对象的过程相当于一次“预缩放操作”；当我们从
    Blender 导出 Modo 创建的对象时，它已经缩小了一半，然后我们在导入 Unity iOS 时只需将 FBX 导入器中的缩放因子设为 1.0 即可。在图
    5.3 中，你可以看到一个从 Blender 导出的 Modo 创建立方体，在缩放因子为 1.0 时，它与默认 Unity iOS 立方体的缩放完全一致。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_113_0.png)


    **图 5.3** 显示在 1.0 缩放因子下，Modo 创建的立方体与 Unity iOS 立方体大小相同。


    所以现在，我们有了正确的工作流程，可以将 Blender 和 Modo 对象的大小调整到与默认 Unity iOS 缩放完美匹配。你可以在图 5.4 的图表中看到正确的设置。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_114_0.png)


    **图 5.4** 这里你可以看到一张显示不同缩放因子设置的图表。


    ## Unity iOS 的 Blender 支持与 FBX 工作流程


    关于 Blender 动画，Unity iOS 支持所有具有位置、旋转和缩放的节点。你在 Blender 中设置的枢轴点以及对象名称也会被导入。Blender
    的骨骼和蒙皮网格动画也受支持。


    ### 使用 FBX


    Unity iOS 会导入“blender”文件，并在后端使用 Blender FBX 导入器进行转换。然而，这不是我在 Blender 和 Unity iOS
    中使用的流程。相反，我更喜欢从 Blender 导出 FBX。原因主要是个人偏好。在日常工作中，我主要使用 Modo、Maya、MotionBuilder
    和 Mudbox，并且早已确定 FBX 是在我的流程中传递对象的最佳方法。我喜欢保留 FBX 中间文件，以备需要将其带入另一个应用程序；在这些情况下，这让我不必打开
    Blender 来创建 FBX 文件。


    我对 Blender 的一个主要意见是它无法导入 FBX 文件。幸运的是，我只用 Blender 做角色动画，这不会造成大问题，但它确实让我在流程中增加了一个额外步骤，即从
    Modo 导出 OBJ。当 Tater 准备好绑定时，我从 Modo 导出了 OBJ，以便将模型导入 Blender 进行绑定和动画。OBJ 文件的一个大问题是它们只支持一套
    UV。然而，由于我的角色不包含重叠 UV，而且通常角色也不会包含，所以我只需要 1 套 UV。你可能还记得第 4 章，在创建关卡时，我们需要一套单独的 UV，因为我们使用重叠
    UV 来进行平铺。使用重叠 UV 无法正确创建光照贴图。对于 Tater，我没有在 Unity iOS 中使用光照贴图着色器，因此不需要第二套 UV。相反，我将光照贴图烘焙到漫反射纹理贴图中，如图
    5.5 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_115_0.png)


    **图 5.5** 在 Photoshop 中，光照贴图以正片叠底方式叠加在漫反射纹理上。这就是光照贴图着色器所做的工作。


    将光照贴图烘焙到漫反射纹理贴图中，不仅解决了我使用 OBJ 时多套 UV 的问题，而且就减少纹理内存而言，总体上也是一种可行的方案。你可以不在 Unity
    iOS 中使用光照贴图着色器，而只需使用顶点光照着色器和一张漫反射纹理贴图，如图 5.6 所示。这有效减少了 Tater 所需的纹理贴图数量。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_116_0.png)


    **图 5.6** 这里你可以看到一个使用一张纹理的顶点颜色着色器。该纹理同时包含颜色和光照信息。


    Tater 3D 资产的完整工作流程如图 5.7 的图表所示。


    | Modo | Blender | Unity |

    | --- | --- | --- |

    | - 为 Tater 建模并制作 UV<br>- 将 Tater 导出为 OBJ 并导入 Blender | - 绑定并制作动画，通过 FBX 导出到 Unity
    | - 在 FBX 导入设置中将缩放因子设为 1.0 |


    **图 5.7** 这里你可以看到一张展示我从 Modo 到 Blender 再到 Unity 工作流程的图表。


    > **Blender 与 Collada**

    >

    > 除了 OBJ 格式，你还可以在 Blender 和 Modo 之间使用 Collada 流程，因为这两个应用都能读写 Collada 格式。


    ## 理解 Unity iOS 中的蒙皮网格


    在本节中，我们将了解在 Unity iOS 中使用蒙皮网格的技术方面。正如你在前几章中所见，理解这一流程以及它与 Unity iOS 和 iPhone、iPad
    硬件的关系非常重要。掌握这些知识可以让你在绑定和动画流程中做出重要决策，并在优化游戏性能时省去很多麻烦。


    ### VFP 优化的蒙皮


    正如我们在第 1 章中讨论的，iPhone 和 iPad 拥有非常快的 VFP 协处理器，用于处理复杂数学运算。Unity iOS 通过 VFP 协处理器优化蒙皮，速度明显快于
    GPU 蒙皮。在 iPhone 4、3GS 和 iPad 上，Unity iOS 每秒最多可蒙皮 500 万个顶点。然而，Unity iOS 仅支持特定的
    VFP 优化蒙皮路径，了解这些路径是什么非常重要，这样你才能确保在项目中利用它们。如果你没有设置为使用这些优化路径之一，蒙皮性能将回退到 CPU，而 CPU
    要慢得多。同样重要的是要说明，网格中每个顶点的骨骼影响越少，整体蒙皮过程就越快，因此，相应地规划你的绑定同样很重要。


    ### 优化的蒙皮路径


    在 Unity iOS 中，能够影响一个顶点的骨骼数量是有限制的。每个顶点不能有超过 4 根骨骼，并且 Unity iOS 中有 3 条 VFP 优化的蒙皮路径，分别针对
    1、2 和 4 根骨骼影响。这些路径中的每一条都需要满足特定条件，才能由 VFP 协处理器进行优化。在图 5.8 中，你可以看到一张图表，显示了优化路径及其必须遵循的条件。首先，1
    骨骼路径要利用 VFP，必须只有 1 套 UV，并且在场景中受光照（使用蒙皮法线）。对于 2 骨骼路径，网格可以受光照或不受光照，并且最多可有 2 套 UV。这是最常见的蒙皮路径，因此它在
    2 套 UV 下经过 VFP 优化，并且适用于受光照和不受光照的对象。最后是 4 骨骼路径，它必须受光照，并且也可以最多使用 2 套 UV。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_117_0.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_117_1.png)


    要实际使用 VFP 蒙皮路径，你需要确保遵循这些条件。例如，在 Blender 等 3D 应用中为角色分配蒙皮权重时，需要确保每个顶点的最大骨骼影响数为 4。此外，Blender
    2.5 具有自动归一化功能，可以像 Maya 自动执行的那样，将任何重叠权重平衡到总值为 1.0。如图 5.9 所示，可以在权重绘制模式下按 T 键，在工具菜单中激活它。


    角色导入 Unity iOS 后，你需要确保蒙皮网格渲染器上的设置正确，以便利用其中一条 VFP 蒙皮路径。我们来看一个 Tater 的例子。如果我想使用每个顶点
    4 根骨骼，这通过 Quality 设置在蒙皮网格渲染器组件上设置，那么我还需要启用蒙皮法线，以满足在 4 骨骼路径上使用 VFP 优化蒙皮路径的条件，如图
    5.10 所示。通过降低 Unity iOS 中的 Quality 设置，你还可以以丢失动画细节为代价来提升性能。


    '
