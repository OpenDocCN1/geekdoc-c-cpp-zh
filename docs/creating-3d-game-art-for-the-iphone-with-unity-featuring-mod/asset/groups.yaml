    is allowed to backtrack in a level. Once the player has reached a certain position,
    you can safely unload the section. Now, discussing the implementation of this
    procedure is beyond the scope of this book, but it''s important to understand
    the advantages to breaking the level down into sections in terms of loading. For
    this method, each section is saved as a separate FBX file that can be loaded when
    needed. Also, with each section exported as a separate file, you can implement
    an asset downloading mechanism to your game so that the player can use in-app
    purchases.


    ### Optimize Batching and Rendering


    As we discussed in Chapter 1, batching is extremely important for optimizing your
    game''s performance, and special care needs to be taken to make sure that your
    meshes can and will be able to batch. By breaking the level into sections, you
    gain two advantages in terms of rendering vertices. First, it will be easier to
