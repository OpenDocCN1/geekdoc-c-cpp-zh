    # # Animation Using Blender


    # ## Rigging Tater


    In this chapter, we are going to take a look at the process of rigging Tater for
    the purpose of creating several game animations such as running, walking, and
    shooting. This chapter will focus on using the open-source Blender application.
    Most 3D applications are very expensive, and Blender, being free, can be a great
    alternative for the independent game developer. Blender is available for all platforms,
    i.e., Windows, Mac OS, and Linux. Blender was chosen as the animation package
    for this book as it''s a great companion to a modo pipeline. Although modo has
    some robust animation capabilities, it lacks a bone and skinning system, which
    is vital to creating skinned meshes for use in Unity iOS. Now, you could create
    a segmented character in modo that is animated using constraints and IK, but this
    type of character will not fit my project requirements.


    As with all the content in this book, this chapter assumes that you have a working
    knowledge of the software, which in the case of the next three chapters is Blender.
    For the Blender sections of the book, I used the 2.53 Beta. You can download Blender
    2.5 at http://www.blender.org.


    # ### Tater''s Weapon Load Out


    Go to the resource site to view the video walkthrough for this chapter.'
  - '[PAGE 111]


    As we did with the previous chapters, we are going to take a look at the “why”
    before we get into the “how” by studying how bones and skinned meshes should be
    optimized for the iPhone and iPad hardware and how skinned meshes work in Unity
    iOS. By first understanding the why, we’ll then be able to correctly build a rigged
    character for use in a game targeted for the iPhone and iPad platforms. We’ll
    begin by taking a look at matching object sizes between modo, Blender, and Unity
    iOS.


    One more thing worth mentioning is that even if you’re not a Blender user, this
    chapter will contain important information toward rigging and skinning a character
    for use in Unity iOS and the iPhone. The information in this chapter can easily
    be ported to other 3D applications such as Maya, 3DS Max, LightWave 3D, Softimage,
    or Cinema 4D. Be sure to check out the “My Dad Can Beat up Your Dad” sidebar.


    # ## Matching Object Size


    In order to properly get our models into Unity iOS, we need to first make sure
    that we have established a correct workflow for maintaining the correct object
    size as we move from modo to Blender into Unity iOS. In Chapter 2, we discussed
    the sizing differences between modo and Unity iOS, and we worked out a solution
    to compensating for the way in which the different programs internally handle
    object size in terms of units of measurement. Now, we are going to add another
    variable into the equation so to speak as we add Blender to the mix.


    *The important thing to understand with a modo to Blender pipeline is that given
    the internal default units, a modo object will be half as small as a default Blender
    object when it''s imported into Blender.*


    My workflow is to create all objects using modo and use Blender for rigging, skinning,
    and animating skinned characters, as this currently isn''t possible with modo.
    The important thing to understand with a modo to Blender pipeline is that given
    the internal default units, a modo object will be half as small as a default Blender
    object when it''s imported into Blender. Remember from the previous chapters that
    in modo, we established the Default Unity iOS System to be in Game Units and that
    we would work with a setting of 1 meter per Game Unit. In Fig. 5.1, you can see
    that a default modo cube set to these specifications is exactly half the size
    of a default Blender cube.


    It''s important to understand this relationship, as Tater will be exported from
    Blender into Unity iOS, and I''ll need to know how to correctly set the Scale
    Factor in the FBX Importer settings. Understanding the size ratio between modo
    and Blender objects will give me the vital information needed to enter the correct
    value. We know from Chapter 2 that when importing a default 1 meter per Game Unit
    object from modo to Unity iOS, we need to adjust the Scale Factor in the FBX Importer
    to 0.01. We also need to establish this same base setting for Blender objects
    imported into Unity iOS. In Fig. 5.2, you can


    # ### My Dad Can Beat up Your Dad


    Do a quick stop at almost any CG forum and you''ll easily be able to find forum
    topics bantering back and forth about “my app X is better than your app Y.” It
    sometimes reminds me of the old philosophical debate that many of us discussed
    on the playground around the age of five: “Oh yeah, well my Dad can beat up your
    Dad.” Although healthy debate can often bring about new ideas, this particular
    debate about the best software is hardly ever constructive or is it easily settled.


    It''s best to realize that it''s not about the software. It''s about the artist''s
    skill, technique, and creative problem solving to get a game completed that really
    matter. If you truly understand the principles to 3D, then it doesn''t really
    matter which software you use and ultimately comes down to personal preference.
    For instance, I''m not an advanced Blender user. I think it''s a great program
    and it makes a good solution for filling in modo''s animation gaps, although at
    my day job, I use Maya for rigging and animation. However, by having a strong
    foundation in the process behind rigging'
