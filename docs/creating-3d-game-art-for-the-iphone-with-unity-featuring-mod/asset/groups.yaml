    \n显然，CPU 越快，计算速度就越快。然而，仅仅因为你拥有更强的性能，并不一定意味着你应该不顾其他性能考量（例如我们将在本章后面讨论的像素填充率），而向系统投入更多顶点。\n\
    \n## 批处理\n\n批处理是一种自动减少场景中绘制调用的手段。Unity iOS 中有两种方法，即动态批处理和静态批处理。需要注意的是，绘制调用是一个性能瓶颈，并且在很大程度上可能取决于\
