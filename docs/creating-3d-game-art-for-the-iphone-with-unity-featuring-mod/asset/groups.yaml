    如你所见，这个绑定（rig）并不算过于复杂，但能完成任务。事先理清绑定概念会很有帮助。例如，考虑你的游戏和角色风格，决定需要哪些类型的动画。在此基础上，你可以草拟一些基本想法，明确绑定需要允许的运动范围。


    接下来，我需要在骨骼约束（Bone Constraints）菜单中应用 IK 约束。如图 6.15 所示，目标是我名为 Tater_Skeleton 的骨架（Armature），骨骼目标（Bone
    Target）是在图 6.12 中创建的 IK_Foot.L 骨骼。


    **图 6.14** 请注意，IK_Foot.L 骨骼已设为 Foot.L 骨骼的子级。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_147_0.png)


    **图 6.15** 在这里你可以看到 IK 约束及其设置。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_147_1.png)


    我还将链长度（Chain Length）设为 2，这实际上会让 IK 链在大腿骨骼（Thigh Bone）处终止，如图 6.16 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_148_0.png)


    **图 6.16** 链长度设置为 2 会使链在大腿骨骼处终止。


    为了给膝盖增加一些额外控制，我为腿部的 IK 约束设置了一个极向目标（Pole Target）。极向目标与 Maya 中的极向量约束（Pole Vector
    Constraint）相同。它允许你旋转 IK 链，从而让你能够控制膝盖的旋转或朝向。我在膝盖位置添加了一根名为 CNTRL_Knee.L 的新骨骼，并将
    IK 约束上的极向目标设置为这根骨骼，如图 6.17 所示。


    然后，将 CNTRL_Knee.L 骨骼设为 CNTRL_Foot.L 骨骼的子级，这样当腿部移动时，膝盖控制器会随之移动；当 CNTRL_Foot.L 旋转时，这也会自动调整膝盖的朝向。在图
