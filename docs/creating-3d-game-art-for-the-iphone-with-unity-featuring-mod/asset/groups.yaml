    iDevice 创建优化游戏模型背后的技术和原则。为了说明这些概念，我们将研究创建 Tater 及其可信赖的大规模毁灭搭档 Thumper 的过程，如图2.1所示。我们将首先讨论如何确定项目的多边形预算。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_39_0.png)


