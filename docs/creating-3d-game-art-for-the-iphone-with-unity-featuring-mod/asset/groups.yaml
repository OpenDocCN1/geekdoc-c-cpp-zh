    Well, that essentially covers the entire rig that was created for Tater. In the
    next section, we’ll actually look at animation and using FBX files in Unity iOS.


    # Animating Tater


    In the following sections, we’re going to look at utilizing animations in Unity
    iOS in terms of how it relates to FBX. We’re going to look at how Unity iOS interprets
    the animation data present in your FBX files, and we’ll even look at how we can
