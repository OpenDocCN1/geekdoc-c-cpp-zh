    Finally, we''ll add a script for adding an explosion force. Luckily, as you''ll
    see, this functionality is part of Unity''s Rigidbody Class as shown in Fig. 9.20.


    In Fig. 9.21, you can see that the explosion script is added at the root of the
    target object.


    In Fig. 9.22, you can see that we''ve highlighted some key areas of the script.
    First, the Awake function, we loop through the child objects and set their Rigidbody
    Components to Sleep Mode. Sleeping is an optimization that allows the Physics
    Engine to stop processing those Rigidbodies. Sleeping happens automatically when
    a Rigidbody comes to rest. In our case, we''ll use it to stop the Rigidbodies
    from moving while falling due to gravity when the game starts.


    Next, we have an Explode function that is called when the Ray shot from the Raycast
    collides with the HitTest object as mentioned earlier. The Explode function contains
    the call to the Add Explosion Force function, which as we discussed is a part
    of the Rigidbody Class and actually explodes the pieces of the target. From there,
    the Physics Engine takes care of the rest.


    ```

    Rigidbody.AddExplosionForce


    function AddExplosionForce (explosionForce: float, explosionPosition: Vector3,
    explosionRadius: float, upwardModifier: float = 0.0F, mode: ForceMode = ForceMode.Force):
    void


    Description:

    Adds a force to this rigidbody that simulates explosion effects. The explosion
    force will fall off linearly with distance to the rigidbody.

    ```


    FIG 9.20  The Rigidbody Class Has a Specific Function for Creating an Explosion
    Effect.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_244_0.png)


    FIG 9.21  The Explosion Script is Added at the Root of the Target Game Object.'
