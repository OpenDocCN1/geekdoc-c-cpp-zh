    \ CPU 和 GPU，因为如果你的设备存在填充率问题（在 iPad 或 iPhone 4 上可能会遇到），那么绘制调用瓶颈可能会转移到 GPU 上。\n\n\
    ### 动态批处理\n\n动态批处理在运行时的运作方式如下。\n\n- 按材质对场景中的可见对象进行分组并排序。\n  - 如果这个已排序组中的对象具有相同材质，Unity\
    \ iOS 将在 CPU 上对每个顶点应用变换。变换的设置不是在 GPU 上完成的。\n  - 将结果追加到临时的内部动态顶点缓冲区。\n- 仅对该组设置一次材质和着色器。\n\
    - 仅绘制一次合并后的几何体。\n\n顶点变换和绘制调用都会给 CPU 端带来负担。iDevice 上的单指令多数据（SIMD）协处理器支持 ARM 架构的向量浮点（VFP）扩展，它负责处理顶点变换，这要归功于\
    \ Unity iOS 中一些为利用 VFP 协处理器而编写的优化例程。VFP 协处理器实际上比 GPU 工作得更快，因此 Unity iOS 使用它来提升对象批处理的性能，以减少绘制调用。\n\
    \n角色的纹理和材质与批处理有关。在第 5 章中，当我们使用 Blender 为 Tater 设置动画时，我们将讨论针对骨骼权重和绑定（rigging）的\
    \ VFP 优化路径。\n\n## GPU\n\nGPU 是图形处理单元，负责渲染我们的场景。在不同 iPhone 型号之间，你会发现它们都使用相同的 GPU，即\
    \ PowerVR SGX535。\n\nSGX535 支持 OpenGL ES 2.0。使用 Unity iOS 时，iPhone 开发者可以同时使用 OpenGL\
    \ ES 的 1.1 和 2.0 版本。对开发者而言，这意味着我们可以利用支持可编程管线的着色器；此外，每当设备在游戏中遇到新的着色器时，都不需要再将 1.1\
    \ 着色器转换为 2.0。在图 1.3 中，你可以看到 SGX535 GPU 的时钟速度，以及它与像素填充率和三角形吞吐量的关系。填充率是每秒可以绘制到屏幕上的像素数，而吞吐量是每秒可以处理的三角形数量。\n\
    \n如图 1.3 所示，3GS 的 GPU 每秒可以处理 700 万个三角形和约 25 亿个像素。然而，与 CPU 一样，我也想重申一点：尽管 SGX 看起来像是一台渲染猛兽，但这并不意味着你可以不加考虑地把所有东西（除了厨房水槽之外）都丢给它。你的游戏性能并不完全由\
    \ CPU 和 GPU 速度决定。例如，RAM 和较慢的闪存也可能成为瓶颈，尤其是在尝试加载更大尺寸的纹理（例如 1024 × 1024）时。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_26_0.png)\n\
    \n**图 1.3** SGX535 具有更高的时钟速度，从而允许绘制更多像素和三角形。\n\n归根结底，这取决于在帧率方面的玩家体验与游戏画面之间的平衡。你始终需要进行性能分析，以匹配你的游戏预算。更快的硬件是一个优势，可以让你做更多事情，但你必须记住，针对前沿硬件进行开发，必然会因为使用较旧型号的用户而疏远相当一部分潜在市场。\n\
    \n## 屏幕分辨率\n\niPhone 4、3GS 和 iPad 的屏幕分辨率各不相同，如果你想让图形看起来很棒，就需要针对每种设备的分辨率进行构建。例如，如果你基于\
    \ 3GS 的 480 × 320 屏幕构建游戏图形，然后将这些图形缩放到 iPad 的 1024 × 768 上，那么由于它们是从较低分辨率放大到较高屏幕分辨率，你的图形和纹理会看起来相当难看。在图\
    \ 1.4 中，你可以看到本书演示应用中的一个菜单，以及该菜单如何适配 iDevice 上的各种屏幕分辨率。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_27_0.png)\n\
    \n**图 1.4** 在这里你可以看到不同 iDevice 在各自支持的分辨率下的菜单。\n\n## 受填充率限制\n\n3GS、iPhone 4 和 iPad\
    \ 都使用 SGX535 GPU；然而，对于 iPhone 4 和 iPad，GPU 必须在更高分辨率的屏幕上做更多工作来绘制你的游戏。这可能导致在 3GS\
    \ 上运行良好的游戏，在某些情况下于 iPad 和 iPhone 4 上出现帧率下降。在图 1.5 中，你可以看到分辨率的差异，以及这与 GPU 在 iPhone\
    \ 4 和 iPad 上必须更努力工作的关系，因为它要渲染 4–5.1 倍的屏幕面积。\n\n填充率是 GPU 每秒可以渲染到屏幕上的像素数。在 iPhone\
    \ 4 和 iPad 上，当透明表面填满屏幕时，你可能会遇到帧率下降。这是因为在 iPhone 4 和 iPad 上，\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_30_0.png)\n\
    \n**图 1.8** 我喜欢将 iPhone 的 TBDR 渲染器想象为类似于 Modo 的分块渲染。\n\n同样，作为一名 3D 艺术家，将 iPhone\
    \ 上的 TBDR 渲染器想象为类似于 modo 或 mental ray 中的分块渲染（如图 1.8 所示），对我很有帮助。\n\n## RAM\n\n\
    各 iDevice 之间的 RAM 存在差异。iPhone 4 的 RAM 为 512 MB，是 iPad 和 3GS 的两倍，而 3GS 和 iPad 都只有\
    \ 256 MB。了解可用的 RAM 以及你必须在其范围内开展工作是至关重要的。整个 RAM 并非都可供你的应用程序使用，因为其中一部分必须保留给操作系统以及多任务运行的其他应用。在你的游戏中，纹理通常是占用\
    \ RAM 的主要元凶。这就是为什么使用经过优化的压缩纹理来最小化游戏中的 RAM 使用量非常重要。在 Unity iOS 中，你可以使用 Statistics\
    \ 窗口查看场景的显存（VRAM）使用情况，如图 1.9 所示。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_30_1.png)\n\
    \n**图 1.9** 你可以在 Statistics 窗口中监控 VRAM。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_31_0.png)\n\
    \n**图 1.10** 你可以使用 Xcode 中的 Unity iOS Internal Profiler 监控内存。\n\n此外，在 Xcode 中对游戏性能进行分析时，你可以使用\
    \ Unity iOS Internal Profiler 检查内存使用情况，如图 1.10 所示。\n\n了解纹理尺寸如何换算为纹理内存会很有帮助。它基本上就是图像中像素总数乘以每个像素的位数。例如，一张\
    \ 1K 纹理包含 1,048,576 个像素（1024 乘以 1024）。然后你可以将这个数字乘以每像素 24 位（1,048,576 乘以 24），得到整张图像的\
    \ 25,165,824 位。最后，将这个数字除以每字节的位数，即 8（25,165,824 位 / 每字节 8 位），得到 3,145,728，也就是每张\
    \ 1K 纹理大约 3 MB。当然，这还没有考虑压缩，因此如果我们在 Unity iOS 中使用 Texture Importer 将此纹理压缩为 PVRTC\
    \ 4-bit，就可以将内存量减少到 0.5 MB，而差异可以忽略不计。\n\n## OpenGL ES\n\nOpenGL ES 是 OpenGL 的子集应用编程接口（API），由于它的核心设计是用于移动技术，因此被用于所有\
    \ iPhone OS 设备。\n\n我已经提到过，SGX535 支持 OpenGL ES 2.0。在 iPhone 上使用 Unity iOS 时，这真正归结为你在\
    \ Unity iOS 项目中能够使用的着色器类型。Unity iOS 允许你为 OpenGL ES 1.1 和 2.0 两个版本构建项目。这使你可以构建针对不同设备和\
    \ OpenGL ES 版本的不同 Unity iOS 场景，并在运行时根据运行游戏的 iPhone 设备加载特定的 OpenGL 场景。\n\nOpenGL\
    \ ES 1.1 与 2.0 之间的区别在于，1.1 版支持固定功能图形管线（FFP），而 2.0 版支持全可编程图形管线（FPP）。同样，这基本上决定的是你可以为游戏使用或编写何种类型的着色器。\n"
