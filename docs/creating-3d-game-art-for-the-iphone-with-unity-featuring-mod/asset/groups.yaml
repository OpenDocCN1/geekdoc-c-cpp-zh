    \n## 调整光照贴图\n\n烘焙完成后，你可以在 Photoshop 等图像编辑器中进一步编辑贴图，以调整曝光和颜色，以及绘制污垢，打散关卡中任何重复图案。\n\
    \n需要注意，在以下各节中，我们将修改 Beast 在 Unity iOS 中使用的光照贴图，这些贴图位于场景目录中一个与场景同名的文件夹内。如果你决定再次烘焙场景，你将丢失所做的编辑，因为\
    \ Beast 会覆盖这些文件。一个良好的工作流程是在 Photoshop 中将污垢或脏迹放在单独图层上，这样如果你确实需要重新烘焙场景，就可以轻松重新应用污垢图层。任何颜色校正也是如此。建议在\
    \ Photoshop 中使用调整图层来更改色阶或曝光，以便轻松再次应用这些效果。\n\n## 颜色分级贴图\n\n创建的光照贴图采用 EXR 格式，这是一种\
    \ HDR 格式。这很好，因为这些文件包含 HDR 浮点值，你可以将这些文件导入 Photoshop，交互式调整光照和颜色值，从而创建不同的外观，而无需重新烘焙场景。这之所以可行，是因为\
    \ Beast 在本章前面提到的完整 32 位浮点 HDR 管线中烘焙光照。使用 Beast，你可以将光照值推到白色（即值 1.0）以上，这被称为“超白”。这意味着，在支持\
    \ HDR 的程序中编辑该文件时，你在调整曝光和颜色时可以访问所有这些光照信息。例如，为了在 Photoshop 中访问超白值，我将平行光的强度调高到 2.0。这导致我的场景过曝，如图\
    \ 8.26 所示。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_223_0.png)\n\n> **图 8.26**\
    \ 由于光照强度较高，光照贴图场景严重过曝。\n\n接下来，我只需双击文件，就在 Photoshop 中打开了 Far 光照贴图，因为我在 Unity iOS\
    \ 首选项中将图像应用程序设置为 Photoshop；我调整了曝光，并增加了阴影区域的蓝色色调。\n\n为了正确评估你的颜色分级，你需要在 Photoshop\
    \ 中调整校样设置。我之前提到过，Beast 在浮点线性空间中渲染，这意味着文件的 gamma 为 1.0。存储在线性空间中的文件在你的显示器上看起来会偏暗，但在这种情况下，我们实际上希望以默认线性\
    \ gamma 1.0 查看文件，以便准确设置曝光。要在 Photoshop 中执行此操作，请转到“视图”，并确保已启用“校样颜色”。然后转到“视图 > 校样设置”，并选择“显示器\
    \ RGB”，如图 8.27 所示。这会将显示设置为以默认 gamma 查看图像，从而使在 Photoshop 中进行的任何颜色校正或曝光更改都与它们在 Unity\
    \ iOS 中的外观相匹配。\n\n### Photoshop 与 32 位 HDR\n\nPhotoshop 可以处理 32 位 HDR 文件，但大多数工具在此模式下不可用。在此模式下可使用的一些好工具是“图像\
    \ > 调整”菜单下的色阶、曝光和 HDR 色调。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_224_0.png)\n\
    \n> **图 8.27** 我们需要将校样设置更改为显示器 RGB，以便以默认线性 gamma 查看图像。\n\n由于 EXR 文件包含 HDR 值，我可以访问整个光照范围，并可以降低贴图中过曝的区域。这使我在编辑光照贴图时具有很大的灵活性，因为我不会像典型\
    \ 8 位或低动态范围图像那样被限制在有限的光照值范围内。在图 8.28 中，你可以看到我使用 HDR 色调工具影响了光照贴图的整体外观，从而为游戏带来更悦目的风格。同样，贴图中拥有\
    \ HDR 值使我可以在后期进行曝光更改，而不必反复重新烘焙光照贴图，也允许我推拉光照以创建各种外观。例如，回看图 8.28，你可以看到我通过调整光照贴图能够引入一点泛光效果。\n\
    \n在 Photoshop 中保存 EXR 会使文件在 Unity iOS 中自动更新。这是一种用于尝试场景不同外观的绝佳工作流程，在视觉特效领域被称为颜色分级。在图\
    \ 8.29 中，你可以看到通过调整曝光和颜色值，\n"
