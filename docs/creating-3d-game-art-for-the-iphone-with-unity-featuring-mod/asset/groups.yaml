  mdcn: '

    从 iPad 到 iPhone 等设备。例如，我在创建纹理时通常会使用 2K（2048 像素）分辨率。这不仅适用于 iPad 的 1024 像素分辨率，也很容易缩放到
    iPhone 和 iPod Touch 设备，例如 iPhone 的 480 × 320 和 iPhone 4 的 960 × 640。当然，这并不是我游戏中纹理的最终大小。纹理将在
    Unity iOS 中调整大小并进行压缩。但是，我觉得重要的是要注意，在创建源纹理时，你需要考虑 iDevices 上不同的分辨率。你肯定不希望以 480
    像素宽度创建源纹理，然后放大这些纹理以用于 iPad 和 iPhone 4 等更高分辨率设备。最好先制作大尺寸，然后缩小，以保持纹理的最高质量。此外，请记住，最好以
    2 的幂次方创建纹理，这样它们才能在 iDevices 上使用 PVRTC 压缩。


    确定纹理最终的压缩大小取决于多个因素，如屏幕尺寸和纹理内存。例如，场景中较小的物体——这不仅由物理尺寸决定，还受相机 3D 透视的影响——可以使用更小的图像大小。事实上，这正是
    Mip 贴图发挥作用以优化性能的地方，这将在第 9 章“在 Unity iOS 中使用游戏资源”中讨论。在接下来的几个小节中，我们将探讨确定纹理预算的基本原理，这反过来将为确定纹理大小打下坚实的基础。


    ## 2 的幂（POT）与非 2 的幂（NPOT）


    2 的幂是指数字 2 的任意整数幂。基本上，它表示 2 乘以自身若干次。非 2 的幂，也就是任何不是 2 的幂的数字。POT 分辨率的一些常见示例包括 1024
    × 1024、512 × 512、256 × 256 和 128 × 128。理解 NPOT 纹理在 Unity iOS 中无法被压缩这一点非常重要。Unity
    iOS 的桌面版本允许你在 GUITextures 上使用 NPOT 作为压缩纹理；然而，如果它们被用于其他任何地方，就会被转换为 RGBA 32 位格式，这会消耗大量
    RAM，并且在 iPhone 和 iPad 这样的移动平台上是非常糟糕的。POT 纹理支持 Mip 贴图和所有环绕模式，如 repeat（重复）和 clamp（钳制）。然而，NPOT
    纹理不支持 Mip 贴图，并且环绕模式必须设置为 clamp to edge（边缘钳制）。POT 纹理在宽高比上是固定的，与 iPhone 和 iPad 设备的宽高比不匹配。在为你的游戏对象（例如
    Tater 和 Thumper）创建纹理时这不是问题，但对于需要填满整个屏幕的纹理（如菜单），你将不得不进行一些调整。你可以选择在“纹理导入器”（Texture
    Importer）对话框中对 NPOT 纹理进行缩放，如图 3.15 所示。


    图 3.15 你可以在纹理导入器对话框中告诉 Unity iOS 如何处理 NPOT 纹理


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_71_0.png)


    如你所见，当纹理被缩放到更大或更小的分辨率时，这基本上会挤压你的纹理。我从不使用这个选项。相反，我使用一个简单的平面网格，并将 UI 元素通过纹理图集（texture
    atlas）映射到其上。这样，你就能使用正确的图像格式进行 PVRTC 压缩。一个用于所有 GUI 创建的优秀工具是 Above and Beyond Software
    出品的“EZ GUI”。我们将在第 4 章讨论纹理图集的使用。然而，必须注意的是，如果你使用 480 x 320 这样的 NPOT 纹理尺寸，你会遇到严重的
    RAM 消耗，而且 iPhone 和 iPad 在处理大型 RGBA 纹理时并不快。此外，较大的纹理需要更多时间加载到 RAM 中。


    对于界面元素（GUI），NPOT 纹理的一个好处是，它们可以完美匹配 iPhone 或 iPad 设备的宽高比。这基本上意味着你可以保持每个屏幕像素对应一个纹素（纹理像素）的一对一映射，这意味着纹理的分辨率不会被浪费。然而，需要注意的是，为
    UI 使用 512 像素的图像也能起到同样的作用。正如我们将在第 4 章看到的，你还可以使用纹理图集，它可以为你的 GUI 元素包含非正方形的纹理区域。


    ## 纹理压缩：PVRTC


    PVRTC 会将 32 位文件压缩到每像素 2 位或 4 位。如上所述，为了在 Unity iOS 中使用 PVRTC，你的纹理必须是正方形或 POT 尺寸。在为
    iPhone 和 iPad 创建内容时，建议使用 PVRTC 格式，因为它是唯一可以在内存中保持压缩状态，并可以由 GPU 从其压缩格式解码的格式。这一点很重要，因为在
    iPhone 上，内存带宽非常有限。纹理通常是导致 iPhone 内存耗尽的主要原因，在 iPad 上更是如此。例如，一个 256 × 256 32-bpp（每像素位数）且带有透明度的图像将占用
    256 KB 内存。然而，同一个纹理使用 PVRTC 4 位压缩后仅占用 32 KB 内存，而 PVRTC 2 位仅占用 16 KB，这是一个巨大的节省。压缩质量非常好，在大多数情况下，使用
    PVRTC 4 位，差异可以忽略不计。在图 3.16 中，你可以看到 32 位和 PVRTC 4 位砖块纹理之间的差异。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_72_0.png)


    PVRTC 压缩非常适合混凝土、石材和砖块等自然类型的表面，压缩几乎难以察觉。


    纹理压缩可以而且应该在 Unity iOS 中直接通过纹理导入器对话框进行设置，如图 3.17 所示。这意味着在创建纹理时，你可以使用任何你喜欢的格式，如
    PSD 或 PNG。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_73_0.png)


    图 3.17 你可以在 Unity iOS 中直接压缩纹理。


    我使用 Photoshop 创建所有纹理，并将文件作为 8 位 PNG 导出到 Unity iOS 项目中的 Assets 文件夹。然后我在 Unity 中设置所有大小和压缩。Unity
    iOS 3 支持多个平台，因此对于 iPhone，你需要点击 iPhone 图标，然后勾选 Override for iPhone 复选框，以设置大小和压缩方案。


    ## 使用 Mip 贴图


    Mip 贴图是一组预先计算好的、经过优化的纹理，伴随主纹理一起使用，有助于提高渲染速度并减少锯齿伪影。在你的纹理上使用 Mip 贴图，当场景中的物体离相机更远时，会用更小、更优化的版本替换主纹理。在图
    3.18 中，你可以看到纹理导入器中启用了 Mip 贴图。在移动平台上使用 Mip 贴图是一个非常好的主意——除非你知道你的纹理不会在屏幕上显示得非常小。也就是说，如果你确信纹理的每个像素都将覆盖屏幕上的一个或多个像素，那么
    Mip 贴图就不是优化纹理的必要条件。在第 4 章中，我将讨论如何基于网格构建，以帮助你保持几何体尺寸（以单位计）和纹理尺寸（以像素计）之间的一对一比例，从而无需使用
    Mip 贴图。我个人不太喜欢使用 Mip 贴图，因为它们往往会使纹理变得过于模糊。


    ## 多重分辨率


    在构建纹理时，你需要了解 iPhone 4、3GS 和 iPad 之间的不同分辨率。例如，如果你只为 3GS 的 480 宽屏幕构建纹理，那么当游戏在 iPhone
    4 和 iPad 的高分辨率显示屏上运行时，你的内容就会看起来很差。这就是为什么最好以将要支持的最高分辨率（即 iPad）来构建纹理，然后根据需要缩小。如前所述，你总是可以在游戏中添加逻辑，根据运行游戏的设备加载不同的内容。这样，你就能确保始终为玩家提供最适合其设备的内容。


    ## 纹理预算


    既然我们已经讨论了 iPhone 和 iPad GPU 渲染纹理的基本原理，以及压缩如何影响特定纹理消耗的内存量，我们现在就可以正确地制定纹理预算。在第 2
