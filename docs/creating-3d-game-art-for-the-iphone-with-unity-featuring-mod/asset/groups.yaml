    ## Getting to Know the iDevice Hardware and Unity iOS


    The technical understanding behind creating game assets is more in-depth than
    just modeling low-resolution geometry. Before we can get into actual modeling
    or creating texture maps, we''ll first need to have a solid understanding of the
    hardware and game engine that the content will run on. Each platform or device
    will have its own limitations, and what might run well on one platform doesn''t
    mean it will run as well on another. For instance, the faster processor in the
    iPhone 4 or iPad, in some cases, may help in the processing draw calls than the
    slower processor in the iPhone 3GS. Another good example is that although the
    iPad has a 400 MHz boost in chip performance, the lack of an upgraded GPU introduces
    new bottlenecks in performance to be aware of. This is where the project''s “game
    budget” comes into play. Your game budget is the blueprint or guide through which
    your game content is created. There are three specifications to be aware of when
    evaluating the hardware of the iPhone and iPad, which are memory bandwidth, polygon
    rate, and pixel fill rate. For instance, if you have a fast-paced game concept,
    you''ll need to denote a high frame rate in your game budget such as 30-60 frames
    per second (fps), and all of the content you create must be optimized to allow
    the game to meet this frame rate budget. You’ll also need to take into consideration
    that with the iPad, you’re essentially rendering to a pixel count that is over
    five times that of the iPhone 3GS and around 1.2 times that of the iPhone 4 screen,
    which results in 5–1.2 times the amount of data being processed per frame. Without
    a solid understanding of the capabilities and limitations of the device your game
    is targeting, you won’t know what optimizations to the game content that will
    be needed to achieve your game’s budgeted frame rate. Essentially, it would be
    like working in the dark.


    The goal of this chapter is to turn the lights on so to speak by familiarizing
    you with the iPhone and iPad hardware as well as take a look under the hood of
    the Unity iOS game engine. By familiarizing ourselves with the different devices
    and what’s going on under the hood of Unity iOS, we can then understand the “why”
    behind building optimized content for these devices. We will also be able to properly
    define the frame rate, poly-count, and texture size budgets in our overall game
    budget, which is determined by a balance of the type of game you’re creating and
    the targeted frame rate, all of which is ultimately controlled by the hardware’s
    memory bandwidth, polygon rate, and pixel fill rate.


