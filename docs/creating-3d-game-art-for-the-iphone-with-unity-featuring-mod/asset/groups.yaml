  mdcn: "\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_183_0.png)\n\n**图 7.13** 片段在轨道“属性”面板中的混合模式设置为“添加”。\n\
    \n现在，射击动画以叠加方式混合在奔跑动画之上。这也是你在 Unity 的动画系统中处理动画混合时发生的情况。仅使用 Blender 的 NLA 编辑器，你就能拥有更加精细的工作流，因为你可以构建动作（Actions）并将它们分层放入\
    \ NLA 中。NLA 还允许你对动画进行一些交互式调整，例如通过调整“播放设置”来加快或减慢动画速度，如图 7.14 所示。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_183_1.png)\n\
    \n**图 7.14** 你可以通过更改“缩放”属性，在“播放设置”中调整片段的速度。\n\n此时，通过 NLA 编辑器混合射击和奔跑动作后，你可以将此动画导出到\
    \ Unity iOS，从而得到可直接使用的“边跑边射击”动画。然而，正如我们之前讨论的，这并不是最佳方案，因为那样我们还得为“边走边射击”或“向左平移时射击”等等创建另一个动画。如你所见，你的项目可能很快就会产生大量动画文件。相反，让我们看看如何在\
    \ Unity iOS 中混合这些动画，并减少项目所需的 FBX 文件数量。\n\n## 在 Unity iOS 中混合动画\n\n继续我们的射击与奔跑示例，现在来看看如何在\
    \ Unity iOS 中混合这些动画。我们一直使用 Blender 中的 NLA 编辑器创建动画，为了只导出奔跑动画，你需要通过单击轨道的“播放设置”中的“静音”（Muted）来禁用射击轨道，如图\
    \ 7.15 所示。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_184_0.png)\n\n**图 7.15**\
    \ 射击轨道已被静音，因此它不会包含在 FBX 导出中。\n\n它位于奔跑循环之上，由于未分配层，所以该值为零。现在，射击动画会先于奔跑动画接收混合权重，而只有当射击动画没有占用全部\
    \ 100% 的混合权重时，奔跑动画才会接收权重。当使用 animation.CrossFade(\"shoot\") 对射击动画进行交叉淡化时，射击动画的权重将从零开始并增加到\
    \ 100%。这很像在一个动画之上淡入另一个动画。随着射击动画“淡入”，奔跑动画会逐渐减弱。\n\n然而，这并不是我特别想要做的，因为我希望射击动画在角色奔跑时播放。这正是叠加混合（additive\
    \ blending）发挥作用的地方。\n\n### 叠加混合\n\n为了让射击动画在奔跑动画之上并与其同时播放，我们需要将 AnimationState\
    \ 的混合模式设置为叠加（additive），如图 7.17 所示。\n\n现在，当玩家按下开火按钮，或者在这个基础示例中触摸屏幕时，我只需播放射击动画，它就会叠加到奔跑动画之上，如图\
    \ 7.18 所示。\n\n在图 7.19 中，你可以看到两个动画在播放，它们通过分层和叠加混合相加在一起。图像左侧显示的是在 Unity iOS 中播放的动画，右侧显示的是在\
    \ Blender 中相加在一起的相同动画。请注意，通过 Unity 的动画系统，我们能够在 Unity iOS 中制作出与 Blender 中使用 NLA\
    \ 编辑器制作的完全相同的“边跑边射击”动画。\n\n如你所见，这是一个非常强大的工作流，因为现在可以将射击动画添加到任何其他动画（例如行走循环）上。我不再需要担心创建不同的行走和奔跑动画来包含射击，因为我可以轻松地将其叠加到我创建的任何动画之上。此外，使用这种方法，我可以轻松地为不同武器类型适配新的射击动画，因为我知道这些动画可以轻松添加到现有的行走、奔跑和横移动作上。这使得添加新动画变得简单，因为我不需要为每个新的射击动画创建一组特殊的奔跑和行走循环。想一想为游戏制作续作的情况：你可以在创建新武器动画的同时，复用第一部游戏中的一些动画。在游戏开发中，生产力至关重要；任何时候只要你能找到避免重新创建某些内容的方法，就应该采用它。\n\
    \n> *在游戏开发中，生产力至关重要；任何时候只要你能找到避免重新创建某些内容的方法，就应该采用它。*\n\n```javascript\nprivate\
    \ var shoot : AnimationState;\n\nfunction Start()\n{\n    animation.Play(\"run\"\
    );\n\n    //Set the Shoot Clip\n    shoot = animation[\"shoot\"];\n    //Place\
    \ the Shoot Clip on layer above run clip\n    shoot.layer = 1;\n    //Set the\
