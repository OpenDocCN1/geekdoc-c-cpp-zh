    means the files are at a gamma of 1.0. Files stored in linear space will look
    dark on your monitor, but in this case, we actually want to view the file in its
    default linear gamma of 1.0 in order to accurately set the exposure. To do this
    in Photoshop, go to View and make sure that Proof Colors is enabled. Then, go
    to View > Proof Setup and choose Monitor RGB as shown in Fig. 8.27. This will
    set the display to view the image in its default gamma, which will make any color
    correction or exposure changes done in Photoshop match how they''ll look in Unity
    iOS.


    # ### Photoshop and 32-Bit HDR


    Photoshop can work with 32-bit HDR files, but most of the tools are not available
    in this mode. Some good tools to use in this mode are Levels, Exposure, and HDR
    Toning found under the Image > Adjustments menu.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_224_0.png)


    **FIG 8.27** We Need to Change the Proof Setup to Monitor RGB in Order to View
    the Image at Its Default Linear Gamma.


    Since the EXR file contains HDR values I have access to the entire lighting range
    can lower the blown out areas of map. This gives me a lot of flexibility when
    editing the lightmap since I''m not locked to a limited range in lighting values
    as is found with typical 8-bit or low-dynamic range images. In Fig. 8.28, you
    can see that I used the HDR Toning tools to affect the overall look of the lightmap,
    which produces a more pleasing style to the game. Again, having the HDR values
    in the map allows me to make exposure changes in post instead of having to re-bake
