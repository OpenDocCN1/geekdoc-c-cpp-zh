    discuss later, to find possible bottlenecks and to see if the game is CPU bound,
    meaning expensive on the CPU. However, you can''t just add a Box Collider to the
    section as it won''t compensate for the ground and walls, but instead just make
    the entire section a Collider as shown in Fig. 9.9.


