    Frame time is measured in milliseconds, so if I would like to target a frame rate\
    \ of 30 fps, I would take 1000 divided by 30, which gives me a frame time of 33.3\
    \ milliseconds. What this means is that when profiling my game, I need to make\
    \ sure that my frame time, which is the time it takes a frame to finish rendering\
    \ is no longer than 33.3 milliseconds and thus my frame budget becomes 33.3 milliseconds.\
    \ In order to determine if your game is meeting the required frame budget, you\
    \ need to use the Internal Profiler. In Chapter 9, we will take a look at profiling\
    \ a game in order to find areas that need to be optimized. For now, in Fig. 1.15,\
    \ you can see the frametime variable in the Unity Internal Profiler within Xcode\
    \ reflecting my required frame budget.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_36_0.png)\n\
    \n**FIG 1.15** You Can Use the Internal Profiler to Find Bottlenecks in Your Game.\n\
    \n### Rendering Budget\n\nNext, I need to determine where I want to spend most\
    \ of my time in terms of how long it takes for Unity iOS to process a frame or\
    \ the frame time. For example, my game doesn't use much in the way of physics\
    \ calculations, so I've determined that I can spend most of my frame time in rendering.\n\
    \n### Vertex Budget\n\nIn order to work out your vertex budget for individual\
    \ game objects, you again need to think about the type of game you're creating.\
    \ If you are creating a game that requires a lot of objects in the scene, then\
    \ you'll need to reduce the vertex count per object. As I mentioned earlier, you'll\
    \ want to take the base value of less than 10 K vertices per frame and distribute\
    \ these vertices to what you consider to be the most important game objects. For\
    \ example, you might want to give your hero character a bit more resolution in\
    \ terms of vertex count while reducing the count for the enemies. This budget\
    \ is subjective to your game requirements, but you can see that without understanding\
    \ the constraints of the hardware, it would be impossible to create assets that\
    \ run smoothly on the iPhone and iPad.\n\n### Texture Budget\n\nWe've discussed\
    \ that texture memory can take up a lot of the resources on the iPhone, and your\
    \ texture budget will be the combined size of memory resources you're prepared\
    \ to allocate textures in your game. You'll want to minimize how much memory your\
    \ textures are eating up in your game, and there are several options for reducing\
    \ the load such as using texture compression, shared materials, and texture atlases.\
    \ Different devices are going to have different requirements as well. For instance,\
    \ the iPad and iPhone 4 are going to need higher resolution textures since the\
    \ screen size is larger, but you'll find that optimization becomes a little trickier\
    \ since the iPad and iPhone are still only using the same PowerVR SGX535 GPU found\
    \ in the 3GS despite having a larger screen as we discussed earlier.\n\n### It\
    \ All Sums Up\n\nAs we work through the chapters in this book, we'll take a more\
    \ in-depth look at optimization at the various stages of modeling and texturing.\
    \ However, the important thing to remember is that all of our budgets sum up to\
    \ one factor, which is to meet the frame budget. The goal for any game in terms\
