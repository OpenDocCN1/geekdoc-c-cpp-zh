  mdcn: "\n## 固定功能管线\n\nFFP 在管线的各个阶段使用“固定”或预定义的功能，这些阶段包括命令处理、三维变换、光照计算、光栅化、雾效和深度测试。你可以启用或禁用管线的某些部分，也可以配置各种参数，但计算或算法是预定义的，无法更改。\n\
    \n## 全可编程管线\n\nFPP 用完全可编程的阶段取代 FFP 的许多“固定”阶段。这使你能够编写代码，为可编程管线中的每个阶段执行计算。FPP 为游戏中使用增强着色器打开了大门，同时也带来了更高的优化空间，因为复杂算法可以在着色器上单遍执行，并且必定会节省宝贵的\
    \ CPU 周期。在图 1.11 中，你可以看到两种管线的示意图。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_32_0.png)\n\
    \n**图 1.11** 此图展示了 OpenGL ES 1.1 和 2.0 版本中可用的不同管线。\n\n### 纹理\n\n对于 iPhone 来说，降低纹理尺寸非常重要，因为设备上的纹理缓存很小。TBDR\
    \ 渲染器经过优化，可以高效处理纹理缓存，但你仍然必须密切关注纹理尺寸，并压缩纹理以减小尺寸。iPhone 使用一种名为 PVRTC 的硬件压缩方案，允许压缩到每像素\
    \ 2 位或 4 位。这种压缩有助于减少内存带宽。当你超出纹理内存预算时，就需要决定如何压缩纹理。在 Unity iOS 中，你可以在设置菜单中为纹理资源设置纹理压缩，如图\
    \ 1.12 所示。不过，纹理要能够压缩，其尺寸必须是 2 的幂，例如 1024 × 1024、512 × 512 等。\n\n纹理压缩也很重要，因为如前所述，iPhone\
    \ 上的内存由 CPU 和 GPU 共享。如果你的纹理开始占用大部分内存，你的游戏很快就会面临在 iPhone 上崩溃的危险。\n\n**纹理单元** 在\
    \ OpenGL ES 1.1 中，你只有两个可用的纹理单元（TU）；而在 OpenGL ES 2.0 中，你最多可以有八个可用的纹理单元。纹理需要过滤，而纹理单元的工作就是对像素应用操作。例如，在使用\
    \ OpenGL ES 1.1 的 iDevice 上，你可以在 Unity 着色器中使用组合器，由组合器决定如何将纹理组合在一起，从而组合两个纹理。把组合器想象成\
    \ Photoshop 混合模式（即相加和相乘）对我很有帮助。在 3GS、iPhone 4 和 iPad 上，由于有八个可用的纹理单元，你最多可以组合八个纹理。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_33_0.png)\n\n**图 1.12** 你不需要在 Unity\
    \ iOS 之外压缩纹理。在 Unity iOS 中，可以按纹理设置纹理压缩。\n\n只采样一个纹理时可以带来一些性能提升，我们将在纹理相关章节中讨论。例如，与其依赖光照贴图着色器（它通过乘法运算将\
    \ RGB 图像与光照贴图组合），你可以直接将光照烘焙到漫反射贴图中，这样只需为材质应用一个纹理，如图 1.13 所示。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_34_0.png)\n\
    \n**Alpha 操作** 在纹理中处理透明度有两种不同方式，即 Alpha 混合和 Alpha 测试。Alpha 混合是 iPhone 上开销最低的操作，因为使用\
    \ TBDR 渲染器时，从帧缓冲读取颜色值不需要任何额外的内存带宽。使用 Alpha 测试时，Alpha 值会与一个固定值比较，对系统的负担要重得多。在图\
    \ 1.14 中，你可以看到 Unity iOS 自带的一个 iPhone 着色器，并且 Alpha 测试已被禁用。另外请注意，该着色器被设置为使用 Alpha\
    \ 混合。\n\n**图 1.14** 在这里你可以看到，该着色器被设置为使用 Alpha 混合而不是 Alpha 测试。\n\n```shader\nShader\
    \ \"iPhone/Transparent/Vertex Color\" {\n    Properties {\n        _Color (\"\
    Main Color\", Color) = (1,1,1,1)\n        _SpecColor (\"Spec Color\", Color) =\
    \ (1,1,1,1)\n        _Emission (\"Emission\", Color) = (0,0,0,0)\n        _Shininess\
    \ (\"Shininess\", Range (0.1, 1)) = 0.7\n        _MainTex (\"Base (RGB) Trans\
    \ (A)\", 2D) = \"white\" {}\n    }\n    Category {\n        Tags {\"Queue\"=\"\
    Transparent\" \"IgnoreProjector\"=\"True\" \"RenderType\"=\"Transparent\"}\n \
    \       Blend SrcAlpha OneMinusSrcAlpha\n        AlphaTest Greater 0\n       \
    \ ZWrite Off\n        SubShader {\n            Material {\n                Diffuse\
    \ [_Color]\n                Ambient [_Color]\n                Shininess [_Shininess]\n\
    \                Specular [_SpecColor]\n                Emission [_Emission]\n\
    \            }\n            Pass {\n                ColorMaterial AmbientAndDiffuse\n\
    \                Lighting Off\n                SeparateSpecular On\n         \
    \       SetTexture [_MainTex] {\n                    Combine texture * primary,\
    \ texture * primary\n                }\n                SetTexture [_MainTex]\
    \ {\n                    constantColor [_Color]\n                    Combine previous\
    \ * constant DOUBLE, previous * constant\n                }\n            }\n \
    \       }\n    }\n}\n```\n\n在过去几页中，我们一直在讨论 iPhone 硬件及其与 Unity iOS 的关系。既然我们已经了解了硬件，现在就可以切实地确定游戏预算，我们将在下一节讨论这一点。\n\
    \n## 确定游戏预算\n\n在开始创建任何游戏对象之前，你需要创建我所说的游戏预算。你的游戏预算列出了你在创建内容和编写游戏代码时要遵循的标准。首先，你需要决定要创建什么类型的游戏，以及这个游戏需要哪些具体要求。例如，我的游戏\
    \ Dead Bang 是一款第三人称射击游戏，设计为快节奏。这意味着我需要设计和优化游戏，以保持至少 30 fps 的帧率，从而使游戏运行流畅。既然知道了我要遵循的帧率，我就可以设定帧预算；帧预算由帧时间推导而来，是你游戏中最重要的预算。你所做的几乎所有优化都是为了遵守帧预算。\n\
    \n### 帧率预算\n\n帧时间以毫秒为单位，因此如果我想以 30 fps 的帧率为目标，就用 1000 除以 30，得到帧时间 33.3 毫秒。这意味着在分析我的游戏性能时，我需要确保帧时间（即一帧完成渲染所需的时间）不超过\
    \ 33.3 毫秒，因此我的帧预算就是 33.3 毫秒。为了确定你的游戏是否满足所需的帧预算，你需要使用 Internal Profiler。在第 9 章中，我们将研究如何分析游戏性能，以找出需要优化的区域。现在，在图\
