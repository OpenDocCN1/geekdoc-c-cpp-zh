    multiple UV set issue with OBJ, but it''s also a viable solution overall in regards
    to reducing texture memory. Instead of using a lightmap shader in Unity iOS, you
    can just use a vertex-lit shader and one diffuse texture map as shown in Fig.
    5.6. This effectively reduces the number of texture maps needed for Tater.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_116_0.png)


    **FIG. 5.6** Here You Can See a Vertex-Colored Shader That Uses One Texture. The
    Texture Contains Both the Color and Lighting Information.


    The complete workflow for the Tater 3D assets is shown in the chart in Fig. 5.7.


    | Modo | Blender | Unity |

    | --- | --- | --- |

    | - Model and UV Tater<br>- Export Tater to OBJ and import into Blender | - Rig
    and animate export to Unity via FBX | - Set the Scale Factor to 1.0 in FBX Import
