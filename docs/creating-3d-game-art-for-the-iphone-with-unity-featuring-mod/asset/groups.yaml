    \ kFPS Variable Will Allow You to Set the Desired Frame Rate.\n\nThe “mono-scripts”\
    \ value tells you how much time is spent executing your Update and FixedUpdate\
    \ functions as well as coroutines. Finally, the “mono-memory” information lets\
    \ you know how much memory the Mono Garbage Collector uses. You can watch these\
    \ values to get an idea how your memory is being allocated and how many times\
    \ the Garbage Collector is running. If the Garbage Collector runs in the middle\
    \ of game play, you’ll more than likely see a stutter or drop in frame rate.\n\
    \nIn this section, I’ve referred to the values in the Internal Profiler being\
    \ too high. You might be asking, “How high is too high?” Well, there’s not an\
    \ absolute answer to that question as it totally depends on your game. What I\
    \ do is watch the “frametime,” and when it drops, I then use the other information\
    \ from the profiler to give me clues as to what’s causing the drop. It’s not a\
    \ matter of knowing the right values, but knowing what the information means so\
    \ that you can use it to learn about how your game’s performance is holding up.\
    \ I can’t stress enough how important it is to profile your game at all stages\
    \ of development, and the Internal Profiler is a great tool for the job.\n\n###\
    \ Summary\n\nIn this chapter, we discussed working with game assets in Unity iOS\
    \ in terms of creating prefabs, using optimized shaders, working with collision\
    \ objects, and using Unity’s Physics Engine. We also looked at creating Universal\
    \ Applications as well as editing the Xcode project to further optimize our game.\n\
    \nUnity iOS provides a unique experience for creating games on Apple’s iDevices,\
    \ and as a 3D artist, I can say that it brings the complex world of game development\
    \ to a level that I can understand and easily work with. Well, this may be the\
    \ end of the last chapter, but there’s still much more to learn. Be sure to visit\
    \ “Tater’s Weapon Load Out” at the book’s resource site to view the in-depth video\
    \ walkthroughs for the topics covered in this chapter such as using the Internal\
    \ Profiler, as well as throughout the book. See you there!\n\n## 居民身份证\n\n| 项目\
    \ | 内容 |\n| --- | --- |\n| 姓名 | 张三 |\n| 性别 | 男 |\n| 民族 | 汉 |\n| 出生 | 1985年7月15日\
    \ |\n| 住址 | 北京市朝阳区建国路88号院 |\n| 公民身份号码 | 110105198507150012 |\n| 签发机关 | 北京市公安局朝阳分局\
    \ |\n| 有效期限 | 2015.07.15-2035.07.15 |\n\n## Bonus Resources\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_254_0.png)\n\
    \nThis book has a companion Web site where you can find useful resources such\
    \ as video walkthroughs that will further illustrate the topics covered. These\
