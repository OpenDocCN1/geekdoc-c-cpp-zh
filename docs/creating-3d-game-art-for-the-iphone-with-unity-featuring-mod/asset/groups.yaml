    ## Understanding Skinned Meshes within Unity iOS


    In this section, we''ll take a look at the technical aspects of using skinned
    meshes in Unity iOS. As you''ve seen in the previous chapters, it''s very important
    to understand the process and how it relates to Unity iOS and the iPhone and iPad
    hardware. Being armed with this knowledge allows you to make important decisions
    on the rigging and animation process and can save a lot of headache when it comes
    time to optimizing your game''s performance.


    ### VFP-Optimized Skinning


    As we discussed in Chapter 1, the iPhone and iPad have a very fast VFP coprocessor
    for handling complex math operations. Unity iOS optimizes skinning through the
    VFP coprocessor and it''s significantly faster than GPU skinning. On the iPhone
    4, 3GS, and iPad, Unity iOS can skin up to 5 million vertices per second. However,
    Unity iOS only supports specific VFP-optimized skinning paths, and it''s very
    important to know what these paths are so that you can be sure to take advantage
    of them in your project. If you''re not set to utilize one of these optimized
    paths, your skinning performance will be falling back on the CPU, which is much
    slower. It''s also important to state that the fewer the bone influences per vertex
    you have in your mesh, the faster the skinning process will be overall, so again,
    it''s important to plan your rig accordingly.


    ### Optimized Skinning Paths


    In Unity iOS, there is a limit to the number of bones that can influence a vertex.
    You can''t have more than 4 bones per vertex, and there are 3 VFP-optimized skinning
    paths in Unity iOS, which are targeted for 1, 2, and 4 bone influences. Each of
    these paths has a certain criteria to meet in order to be optimized by the VFP
    coprocessor. In FIG. 5.8, you can see a chart that shows the optimized paths and
    the criteria they must adhere to. First, we have the 1-bone path that in order
    to utilize VFP, it must have only 1 UV set and be lit (utilizing skin normals)
    in the scene. For the 2-bone path, the mesh can be lit or unlit and have up to
    2 UV sets. This is the most common skinning path, so it''s VFP optimized with
    2 UV sets and works for both lit and unlit objects. Finally, there is the 4-bone
    path, and it must be lit and can use up to 2 UV sets as well.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_117_0.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_117_1.png)


    To actually use the VFP skinning paths, you need to make sure that you adhere
    to the criteria. For instance, when assigning skin weights to your character in
    your 3D application such as Blender, you need to make sure that each vertex has
    a maximum bone influence of 4. Also, Blender 2.5 has an Auto-Normalize feature
    to balance any overlapping weights to a total value of 1.0 as Maya does automatically.
    It can be activated in the tool menu, by pressing the T-key while in Weight Paint
    mode as shown in FIG. 5.9.


    Once the character has been imported into Unity iOS, you need to make sure that
    the settings on the Skinned Mesh Renderer are correct for utilizing one of the
    VFP-skinning paths. Let''s look at an example with Tater. If I wanted to utilize
    4 bones per vertex, which is set on the Skinned Mesh Renderer Component via the
    Quality setting, I''d also need to enable Skin Normals as well in order to match
    the criteria for using the VFP-optimized skinning path on a 4-bone path as shown
    in FIG. 5.10. By lowering the Quality setting in Unity iOS, you can also gain
    performance at the cost of losing animation detail.

