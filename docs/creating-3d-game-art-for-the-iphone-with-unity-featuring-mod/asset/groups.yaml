    ## 完成绑定：添加 IK


    通常，在规模较大的工作室里，由技术总监（Technical Director），或者更具体地说是角色 TD（Character TD），负责绑定工作。没错，为角色做绑定可能是一个相当困难且技术性很强的过程。不过，我发现绑定和编写脚本很相似：一开始，包括我在内的大多数人都会对它有所顾虑，直到你真正深入其中，才会发现它虽然是一个技术过程，但难度是分级的，有些阶段比其他阶段要容易得多。我们可以这样看：编写一个完整的操作系统，与写一段脚本让对象在你的
    Unity iOS 游戏中旋转，两者有天壤之别。同理，为故事片制作角色绑定，与创建一个能让你的游戏实现简单跑、跳、射击动画的绑定，也有很大差别。没错，你希望游戏动画看起来很出色，让你的作品脱颖而出，但你也面临着骨骼数量有限的限制，而且你的重点是把握动作的整体感觉，而不是捕捉每一个细微末节。关键在于，你的游戏绑定——尤其是针对
    iPhone 和 iPad 的绑定——并不需要数百个过度复杂精细的控制器。事实上，绑定越简单越好。你可以从图 6.1 中看到 Tater 的完整绑定。在 Tater
    的绑定中，有四个 IK 目标和四个极目标（Pole Target），用于旋转膝盖和肘部。正如你在图 6.1 中看到的，用于驱动 Tater 动画的控制器并不多。


