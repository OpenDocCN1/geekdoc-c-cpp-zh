    Now that the target is completed, I can create a Prefab of this object so that
    I can quickly place targets in the level with all the functionality already in
    place.


    # ## Optimizing Physics Using the Time Manager


    Earlier, we talked about the physics causing the frame rate to drop. There are
    additional optimizations that can be done with physics. Rendering happens as fast
    as it can, and the rendering loop takes place all of the time. Physics needs to
    be constant, so a separate loop runs at constant speed and is calculated independently
    of the game''s frame rate. Using the Time Manager, you can adjust the Fixed Timestep
    and Maximum Allowed Timestep as shown in Fig. 9.26.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_247_0.png)


    Essentially, the smaller the Fixed Timestep, expressed in milliseconds, the more
    accurate the physics will be but at a heavier cost to the CPU. The Maximum Allowed
    Timestep value, also specified in milliseconds, says that physics calculations
    won''t run longer than the entered value. Basically, if your frame rate drops
    below this threshold, the physics will slow down in order to let the CPU catch
    up. Both these values can be used to stop your physics from dropping the frame
    rate too much, but at the cost of the quality of the physics simulation.


    # ## Publishing Your Game


    In this section, I want to take a look at the Player Settings for deploying your
    game in terms of creating Universal Builds. We''ll then move on to optimizing
    your game. Over these next two sections, we will focus mainly on the Basic License
    version of Unity iOS as it''s an affordable option for getting into game development.
    The Advanced License gives you a bit more control such as being able to optimize
    the Player Size as well as using Umbra Occlusion Culling.


    # ## Player Settings


    There are several important settings in the Player Settings. In Fig. 9.27, you
    can see the Player Settings. The Player Settings is where you set your Bundle
    Identifier, SDK version, Target IOS Version as well as application icons, splash
    images, and the default orientation.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_247_1.png)'
  - '[PAGE 248]


    In the next sections, we''re going to look at setting up our game so that it will
    run on both the iPad and iPhone in what is referred to as a Universal Application
    by setting the Configuration and Optimization settings.


    # ### Universal Builds


    If you are deploying only to the iPad or building a Universal app, you''ll need
    to be sure to support at least two of the possible orientations on the iPad. For
    example, the book''s demo app supports both Landscape Left and Landscape Right
    on the iPad and only Landscape Left on the iPhone. In the Configuration section
    of the Player Settings, we''ll need set the Target Device to iPhone + iPad. We''ll
    also set the Target Resolution to Native so the resolution will be set to play
    as high as the device can handle.


    In the Optimization section, we''ll set the SDK Version to iPhone OS 4.0 and the
    Target iOS Version to iPhone OS 3.3.1. The Target iOS setting will allow us to
    build for the iPad and any devices not running iOS 4. You can see these setting
    in Fig. 9.28.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_248_0.png)


    FIG 9.28 The Target iOS Is the Minimum OS Required to Run Your Application.


    Some developers on the Unity iPhone forums have had issues with app approval when
    the splash screen didn''t start up in the default orientation the device is being
    held. You can read more about this issue by searching "iPad Rotation" on the Unity
    iOS iPhone forums. However, we''ll take a look at the fix here.


    We need to make sure the splash or launch screen starts in the correct orientation
    the device is being held in the event the app is run on an iPad. We''ll accomplish
    this by editing the info.plist file in Xcode. In Xcode, simply right-click the
    info.plist file and choose Open As > Source Code File. You then need to add a
    new key, UISupportedInterfaceOrientations, and enter the supported orientations
    in your game. In Fig. 9.29, you can see that I have added support for the LandscapeLeft
    and LandscapeRight orientations.


    Finally, you need to write code that will support and rotate the screen to adhere
    to the orientations your game supports. In Fig. 9.30, you can see a simple script
    for supporting different resolutions. The script only rotates the screen if the
    device running the game is the iPad, otherwise'
