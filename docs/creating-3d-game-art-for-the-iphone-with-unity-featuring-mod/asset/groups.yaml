    ## Summary


    In this chapter, we discussed the principles behind creating optimized geometry
    for the iDevices. The real trick to creating optimized geometry is deciding how
    to utilize the amount of vertices you have in your budget. You have to decide
    where important parts of the model are to place resolution and then reduce these
    polygons to be able to connect them to areas with less resolution. By understanding
    how the vertex count is interpreted by the GPU, you can properly gauge the amount
    of vertices your mesh contains. As we''ve discussed, mesh seams and UV borders
    will cause the GPU to split vertices and thus increase vertex count, and by understanding
    this principle, you''ll be able to optimize these discontinuities in your mesh.
    In Chapter 3, "Understanding Textures and UV Maps," we''ll take a look at texturing
    Tater and Thumper and continue to discuss how UV seams affect the true vertex
    count of your game objects.


