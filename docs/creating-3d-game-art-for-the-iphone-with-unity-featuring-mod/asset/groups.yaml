    硬件虽然强大，但在游戏开发方面可能有些受限，你会发现，最好的性能可以通过仅使用颜色贴图和光照贴图的组合来实现。在我们查看 Tater 和 Thumper 的纹理之前，首先需要了解一些与纹理以及
    iPhone 和 iPad 相关的基础知识。


    ### 纹理格式


    在本节中，我们将讨论与 iDevice 硬件相关的纹理格式。这些格式涉及纹理在系统内存中的格式化方式。在 iPhone 和 iPad 设备中的 SGX GPU
    上支持多种格式，例如 32 位、16 位和 PVRTC 压缩格式。在图 3.14 中，你可以看到 Unity iOS 的“导入资源设置”对话框中可用的格式列表。


    ### 纹理大小


    在创建纹理时，我通常使用比实际 Unity iOS 项目中使用的分辨率高得多的分辨率。这基本上有助于为我的纹理提供面向未来的保障，当发布具有更高分辨率能力的新设备时，也能更容易地支持多分辨率。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_69_0.png)


    **图 3.14** 你可以在 Unity iOS 的“导入资源”对话框中设置纹理格式。


