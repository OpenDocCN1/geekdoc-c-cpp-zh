    \ This image shows some Thumper refinements.\n\n**FIG A.11** This image shows\
    \ the key pose and the refined Thumper design.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_260_0.png)\n\
    \n**FIG A.12** Here is the final illustration that Warner created.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_260_1.png)\n\
    \n### Developing the Menu\n\nIn this section, you can see the menu screens that\
    \ were developed for the game. Tater is a character from my personal game project\
    \ called \"Dead Bang.\" The Dead Bang world is grungy, so I wanted to bring this\
    \ style into the look of the book's companion app. To create the actual in-game\
    \ menu system, I used EZ GUI from Above and Beyond Software, which can be found\
    \ at http://www.anbsoft.com/middleware/ezgui/. EZ GUI is a great system for developing\
    \ GUI elements and menus for your game, as it allows you to lower the draw calls\
    \ for your GUI elements by utilizing texture atlases and shared materials. I also\
    \ heavily relied on iTween, which was created by Bob Berkebile. The iTween library\
    \ is a rich animation system that can be used to create various animation effects\
    \ ranging anywhere from the simple to complex. It is a great time saver, and it\
    \ was used to animate the buttons in my menu. You can find more info on iTween\
    \ at http://itween.pixelplacement.com/index.php.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_261_0.png)\n\
    \n**FIG A.13** This is an early version of the menu system. Most of the elements\
    \ are there, but at this point, I was still exploring the overall style.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_261_1.png)\n\
    \n**FIG A.14** This is the final background for the menu system. It is important\
    \ to always explore your concepts and designs thoroughly.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_262_0.png)\n\
    \n**FIG A.15** This image shows the menu system scene that utilizes EZ GUI. Here\
    \ you can see the panels that were created for each menu option as well as the\
    \ game rendered in the Game View.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_263_0.png)\n\
    \n**FIG A.16** Here are the menu buttons. By using EZ GUI, these meshes share\
    \ a texture atlas and material and thus are only 1 draw call.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_263_1.png)\n\
    \n**FIG A.17** This image shows the loading screen menu that is called before\
    \ the actual game play screen is called. This image contains only 1 sprite and\
    \ loads either the iPhone 4 or iPhone scene depending on the value that is held\
    \ in a Global Variable called eHD.\n\n### The Game Play Scene\n\nIn this section,\
    \ you can see various elements from the game play scene. In the video walk-through\
    \ for the app, I will explain exactly how the app was created, which will also\
    \ cover the coding of the game as well. I created two scenes to support the different\
    \ resolution of the iPhone 4 and older iDevice generation. The device the user\
    \ is running the app on determines the appropriate scene to load. It captures\
    \ this device information in a Static Class and is used throughout the game.\n\
    \n**FIG A.18:** This is the full scene for the standard definition version.\n\n\
    ![](img/d3e3fa4010906e98ec76be003a6e31c2_264_0.png)\n\n**FIG A.19:** In this image,\
    \ you can see the usage of Beast lightmapping in the scene. Here, you can see\
    \ that I am checking the resolution of the light-map as it is denoted by the overlaid\
    \ checker pattern.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_264_1.png)\n\n\
    ![](img/d3e3fa4010906e98ec76be003a6e31c2_265_0.png)\n\n**FIG A.20:** Here is the\
    \ Prefab for my scene props. This Prefab is distributed randomly around the trash\
    \ yard by simply copying and pasting elements. Each copy is batched.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_265_1.png)\n\
    \n**FIG A.21:** Tater's weapon is not part of the Tater mesh. Instead it is parented\
    \ at run-time using a script. This gives me the flexibility to add new weapons\
    \ in game i.e., the user picks up a new weapon.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_266_0.png)\n\
    \n**FIG A.22** This is the actual script that is used to parent the gun to Tater's\
    \ hand bone.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_266_1.png)\n\n**FIG A.23**\
    \ To create a shadow for Tater, I did not use a Projector. Instead I created a\
    \ simple transparent sprite that was parented to the Tater.\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_267_0.png)\n\
    \n**FIG A.24** The target was also made into a Prefab. It consists of several\
