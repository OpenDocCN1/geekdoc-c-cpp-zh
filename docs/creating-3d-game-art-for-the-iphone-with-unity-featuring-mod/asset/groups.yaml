    Breaking the level down into sections also gives us the ability to optimize large
    levels by using what is referred to as lazy loading, which is the process of deferring
    the initialization of an object until it''s absolutely needed. For instance, let''s
    say we have a large level broken into four sections. In your game logic, you can
    create a methodology for loading one of the next sections when the player has
    reached a goal position. By the same token, you can unload a section once the
    player has also reached a goal position.


