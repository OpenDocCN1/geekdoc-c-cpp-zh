    In order to fix some issues I was having in the thighs, I decided to add an extra
    edge loop. I used the Loop Cut and Slide tool to add an extra edge loop as shown
    in Fig. 6.28.


    FIG. 6.28 An Extra Edge Loop Was Added to Aid in the Deformation in the Thigh
    and Hip Area.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_157_0.png)


    I then made some adjustments to the Thigh.R weights by using the Blur Brush to
    essentially feather or blend the weight values in the hip areas and thus smooth
    out the distortions as shown in Fig. 6.29.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_157_1.png)


    FIG. 6.29 The Blur Brush Can Be Used to Smooth out the Weights and Help Smooth
    Deformations.


    In Fig. 6.30, you can see how adding the extra edge loop in the upper thigh improves
    the deformation in the hip area as well as helps to maintain volume.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_158_0.png)


    FIG. 6.30 The Extra Edge Loop Helps to Add Volume to the Thighs.


    Well, that essentially covers the entire rig that was created for Tater. In the
    next section, we’ll actually look at animation and using FBX files in Unity iOS.


    ## Animating Tater


    In the following sections, we’re going to look at utilizing animations in Unity
    iOS in terms of how it relates to FBX. We’re going to look at how Unity iOS interprets
    the animation data present in your FBX files, and we’ll even look at how we can
    use Unity iOS to make adjustments to your animations using the Animation Editor.
    Finally, we''ll look at creating animations in Blender with the completed rig
    from the first half of this chapter.


    ### Using FBX


    As I''ve mentioned, I rely heavily on FBX for all my 3D pipelines even beyond
    that of game development. FBX is a great file format for transferring animation
    and mesh data to and from different 3D applications. Unity iOS has the ability
    to work with Blender files natively in that if you place the Blender file into
    your Assets folder, it will be imported into your Unity iOS project. However,
    the Blender file is actually being imported using the FBX translator behind the
    scenes, so in essence, your 3D files are always being translated via FBX at some
    point in the pipeline.


    ### Multiple Clips per File Versus One Clip per File


    The first thing to understand with FBX and Unity iOS is that there are basically
    two workflows to choose from when dealing with the animations for your character.
    The choices are having all of the animations for your character contained in one
    FBX file, and the other is using multiple FBX files for each action your character
    will perform. We''ll take a look at these two options in-depth starting with utilizing
    only one FBX file.


    #### Option One: Multiple Clips


    An FBX file contains animation data, which is represented in the file and referred
    to as a “Take.” What this means is that all of the animation that is present on
    the timeline in your 3D program is used in the Take file. So, the way this works
    in regards to Unity iOS is that you place different animations for your character
    at different points in the timeline. This means that all of the actions your character
    will perform are located on the timeline. For instance, frames 1–45 might represent
    a run cycle, whereas frames 46–66 could represent a jumping or a shooting action.
    In Fig. 6.31, you can see the Blender timeline with different animations being
    represented at different sections of the timeline.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_159_0.png)


    FIG. 6.31 Shows Blender Timeline with Keys Representing Different Animations.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_161_0.png)


    Select the appropriate Action and export the FBX. I have one Blender file that
    contains all of the animations, which are separated into Actions and then I can
    select a given Action and export it using the @ naming convention to Unity iOS.


    ### How Animation Data Works in Unity iOS


    Before we get to Blender workflow, it''s important to discuss how Unity''s animation
    data works as it''s translated from the FBX file. I''ve mentioned that FBX is
    used to convert your animation data as it''s imported into Unity iOS. Under the
    hood, Unity iOS is converting all your rotations into Quaternions. So no matter
    what Rotation Mode you''re using in Blender, which can be set on the object''s
    Transform as shown in Fig. 6.34, the rotations will be baked into Quaternions
    upon import into Unity iOS.


    *FIG. 6.33 The Animation Clips Are Referenced by the FBX Files Containing the
    @ Symbol.*


    Next, the keyframes are reduced, or reduced and compressed, according to the settings
    chosen in the Animation Compression within the Import Settings Dialog for the
    FBX file. You can choose to disable this feature altogether or choose from reduction
    only or reduction and compression as shown in Fig. 6.35.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_161_1.png)


    *FIG. 6.34 You Can Set the Rotation Order for Objects in Blender. However, These
    Rotations Will Be Converted to Quaternions When Imported into Unity iOS.*


    These reduction and compression settings work to basically "wrangle in" any errors
    in rotation, position, and scale, which are defined by the error in degrees for
    rotation and distance/delta deviation for position and scale. By reducing the
    keyframes, you can gain performance in your game as there''s less animation data
    to process, but this comes at the price of possibly losing detail in your animations.
    The degree to which you choose to compress keyframe data is totally dependent
    on your own project requirements. It''s just important to note that these settings
    can have an effect on the subtleties in your animations.


    ### Names Are Matched to Relative Animation Component


    Another aspect worth mentioning is that you can reuse animations on different
    characters as long as their hierarchies are the same based on how the Animation
    Component references objects. Each character with animation data will have an
    Animation Component applied as shown in Fig. 6.36, which is placed at the root
    of the object. The Animation Component then references the objects based on their
    relative location to the Animation Component. As long as the names are the same,
    you can reuse animations across different characters.


    Now that we have an understanding of how animation data is interpreted by the
    FBX file and how the scene hierarchy works on the Animation Component, we can
    then begin to create animations in Blender. In the next section, we''ll take a
    look at the workflow I use in Blender for animating my characters.


    ### Animating in Blender


    In this section, we won''t go through any step-by-step tutorials on how to create
    a run cycle. There are several books solely devoted to animation mechanics and
    principles. Animation is a very deep subject and definitely warrants an entire
    book on the topic. However, I will discuss my workflow for using Blender with
    Unity iOS to properly export your animated characters to the FBX format.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_162_0.png)


    FIG. 6.35 Keyframe Compression and Reduction Can Be Set in the FBX Importer Settings
    within Unity iOS.


    #### Creating an Animation Cycle


    In this section, I''d like to discuss the process of setting up an animation cycle
    such as Tater’s run. However, first I''d like to discuss setting the frame rate
    for your project. In Blender 2.5, you can set the frame rate in the Render Properties
    under the Dimensions Category as shown in Fig. 6.38.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_164_0.png)


    FIG. 6.38 The Frame Rate Is Set in Blender to 30 FPS, Which Matches My Game Project''s
    Target Frame Rate.


    Since I am targeting a rate of 30 FPS in my game, I''ve also chosen to animate
    at 30 FPS in Blender. Remember, your game''s frame rate isn''t something that
    is set in Unity iOS, but it''s the overall time it takes to render a frame and
    is dictated by the “frametime” variable in the Unity iOS Internal Profiler, which
    can be activated in Xcode. As we discussed way back in Chapter 1, your game’s
    frame rate is something that you determine for your project and is used as a benchmark
    so to speak throughout your entire project as it becomes the baseline value for
    not only profiling your game but working with animations as well.


    When creating any type of cyclic animation, such as a walk or run, you need to
    make sure that the first and last keyframes are the same as shown in Fig. 6.39.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_165_0.png)


    **FIG. 6.39** The First and Last Keyframes Have Been Highlighted to Show that
    They Are Identical for Looping the Animation.


    Since I’ve utilized layers in my Armature and placed all of the bones that would
    be keyframed in one layer, I can now quickly set and clear keyframes. For instance,
    in Fig. 6.40, you can see that I can quickly perform a bounding selection and
    hit the I key to set a keyframe for the location and rotation. It’s important
    to note that I am only keyframing the location and rotation and I’m not setting
    a keyframe for the scale. I’m not going to be doing any scaling on these bones,
    and because of this, I don’t want to set keyframe data for the scale if it’s not
    absolutely going to be used in the animation. This is important in regards to
    performance as it’s less keyframe data that Unity iOS has to interpolate.


    > Only set keyframes for properties that you’re going to be animating. Extraneous
    keyframes can lead to performance issues. If you don’t animate it, then don’t
    keyframe it.

