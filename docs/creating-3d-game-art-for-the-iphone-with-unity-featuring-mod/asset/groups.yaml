  - "[PAGE 3]\n\n# Praise for Creating 3D Game Art for the\niPhone with Unity\n\n\
    > As the sophisticated tools for creating and implementing assets for gaming become\
    \ more accessible to the artist, the knowledge of how we employ them in the commercial\
    \ pipeline is not only important but more essential than ever. This title serves\
    \ as a comprehensive guide along this path of taking a strong concept idea and\
    \ streamlining it into an exciting and fully realized project! Wes guides you\
    \ through the many steps involved and the use of these powerful 3D tools (modo,\
    \ Blender, and Unity) to help demystify the process of game creation and artistic\
    \ expression.\n> \n> *Warner McGee, Illustrator/Character Designer*\n\n> Simply\
    \ put, this book contains the “secret sauce” for adding 3D to your iPhone or iPad\
    \ game. Nice job Wes!\n> \n> *Bob Bennett, Luxology LLC*\n\n> “Wes does a great\
    \ job of holding the reader’s hand while walking though the nitty gritty of game\
    \ development for the Apple mobile devices. The barrier between art and technical\
    \ knowhow is blurred enough for an artist to stay comfortable handling the technical\
    \ aspects of game development. A great book for the game developer in all of us.”\n\
    > \n> *Yazan Maikosh, Managing Director, 9b studios*"
