    distortion. Yes, it is possible to use an increased smoothing angle and eliminate
    all UV seams, which will not cause the GPU to split vertices as shown in the second
    half of Fig. 3.2, but this is not always a practical solution in terms of texturing.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_62_0.png)


    **FIG 3.2** By creating UVs without seams, you can stop the GPU from splitting
    vertices, yet this may not be the best solution.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_62_1.png)


