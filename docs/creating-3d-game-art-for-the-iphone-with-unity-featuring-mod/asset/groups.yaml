    **图 3.18** 在这里你可以看到，在项目的纹理导入器中，可以针对每张纹理重新启用 Mip 贴图。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_75_0.png)


    正如上一节所讨论的，计算一张纹理会消耗多少内存相当简单。通过确定游戏对象需要多少张纹理，并汇总场景中将使用的所有纹理所占用的内存，你就可以充分监控纹理资源，判断它们是否满足纹理预算。那么纹理预算如何确定呢？正如我们讨论顶点预算时所说，并不存在神奇公式或秘密技巧。这一切都取决于你想创建的游戏类型以及要部署到的设备。不过，最佳方案仍然是创建一个性能测试场景，用它来确定纹理预算，并使用
    Internal Profiler 检查游戏性能。借助 Internal Profiler，你可以监控游戏对象占用的内存量，从而充分了解游戏对象和纹理正在使用的系统资源。


    本节讨论了创建游戏纹理的基础知识。通过了解 iDevice 硬件以及 GPU 如何渲染纹理，你将能够正确评估纹理会如何影响性能，从而知道应采取哪些步骤来优化图形元素。


    ## 创建漫反射贴图


    本节将介绍我如何为 Tater 创建漫反射贴图。受 iDevice 硬件限制，我只使用漫反射贴图来为游戏对象添加纹理。目标是尽可能少地使用纹理。内存不足会导致操作系统终止你的应用，因此始终了解游戏对象占用了多少内存非常重要。例如，我没有使用将漫反射贴图和光照贴图结合起来的
    lightmap 着色器，而是选择把所有光照信息烘焙到单张漫反射纹理中。在 Photoshop 中合并这些纹理，是减少场景中加载纹理数量的一种简单方法。


    ### 模拟光影


    由于需要为 iPhone 和 iPad 构建低分辨率网格，我们将通过纹理来传达表面细节。由于为了提高性能，我没有在场景中使用任何灯光，因此通常会向纹理中加入细微的光照提示。例如，你可以利用法线贴图、凹凸贴图和高光贴图来创建表面细节，然后再将这些细节烘焙到漫反射贴图中。这样就能在不增加
    Unity iOS 场景中使用真实灯光开销的情况下，营造出光影的错觉。诚然，这只是一种错觉，无法产生与使用动态光照相同的效果。例如，当你的角色绕墙移动时，高光照射不会变化，凹凸效果也不会变化，因为这些效果实际上并非由灯光产生。不过，这仍然是在保持较低开销的同时为纹理增加细节的好方法。在图
    3.19 中，你可以看到在 Unity 的 Game 视图中渲染的两个砖墙游戏对象，以及用于创建凹凸贴图的 modo 场景。注意，左侧的砖墙对象使用了烘焙了凹凸和高光效果的纹理贴图，看起来细节丰富得多。向纹理中添加烘焙的光照提示和表面细节，可以极大地帮助你的作品获得那种创意优势。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_77_0.png)


    **图 3.19** 通过将表面细节烘焙到纹理贴图中，你可以获得不错的光照和表面效果，而无需使用灯光或复杂着色器。


    ### Unity iOS OpenGL ES 2.0 着色器


    除非绝对需要，否则在 iDevice 上使用法线贴图并不是好主意。GPU 的速度不足以应对它。对于 iPad 和 iPhone 4，由于屏幕分辨率高得多，情况甚至更糟。在任何平台上，烘焙总是更快。


    OpenGL ES 更适合图像后处理滤镜，但同样，你需要格外小心，不要因为使用它们而严重拖累性能。与 GLES 1.1 的纹理组合器相比，用 CG/GLSL（着色器语言）编写着色器要稍微容易一些，但同样会付出性能代价。你或许可以渲染自定义光照之类的内容，但同样，你也要为此付出性能代价。本质上，要想高效使用
    OGLES 2，你确实需要清楚自己在着色器代码方面要做什么。总体而言，凹凸贴图需要复杂的两到三个通道的着色器，对 iPhone 和 iPad 来说可能过于沉重。对于
    Unity iOS，强烈建议在确实需要 OGLES 2 之前使用 OGLES 1.1。截至本书写作时，OGLES 2 速度较慢，而且存在一些问题。再次强调，在使用
    iPhone 和 iPad 时，尽可能将所有内容烘焙到纹理中并使用简单着色器，是最佳方法。


    ### 为 Tater 制作纹理


    在图 3.20 中，你可以看到为 Tater 创建的漫反射贴图。在此图中，你看到的只是颜色信息。在第 8 章“使用 Beast 创建光照贴图”中，我将讨论在
    Unity iOS 中使用 Beast 为 Tater 创建光照贴图。现在，我们只关注漫反射贴图。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_78_0.png)


    **图 3.20** Tater 的漫反射贴图是在 Photoshop 中绘制的。


    图 3.20 中的贴图尺寸为 2K（2048）像素，后来在导入 Unity iOS 之前被缩小到 1024 × 1024。Unity 3 支持按平台设置，这使得只需点击按钮，就能轻松地为高分辨率
    3D 渲染使用 2K 纹理，为 iPhone 使用 1K 纹理。如前所述，这让我在纹理尺寸方面拥有很大的灵活性，以便用于不同的分辨率和屏幕尺寸。在第 9 章“在
    Unity iOS 中处理游戏资源”中，我们将讨论在 Unity iOS 中压缩和调整漫反射纹理的大小。


    ## 参考图像


    收集好的参考图像是任何纹理工作的关键。收集参考资料应当始终是创建纹理贴图的第一步。研究你想要创建的表面固然至关重要，但你还会使用参考图像来构建纹理。例如，在图
    3.21 中，你可以看到用于制作 Tater 牛仔短裤的参考图像。在有了合适的参考图之后，我便使用这张源图像来制作牛仔短裤。


    **图 3.21** 为了制作 Tater 的牛仔短裤，我从正面和背面拍摄了一条旧牛仔裤，将其用作参考图和纹理来源。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_78_1.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_79_0.png)


    **图 3.22** 从源纹理中裁切各种组件，再拼合出游戏纹理，是快速构建贴图的好方法。


    我发现，要让纹理“展开”以适配 UV 贴图，最简单的方法就是像图 3.22 所示那样，用源纹理中的各个部分把它拼接起来。诀窍在于考虑对象的接缝，以及如何将接缝向内处理来创建纹理。


    例如，对于牛仔短裤，我使用了牛仔裤缝合处的接缝，并把这条接缝复制到 UV 边界两侧。利用对象中明显的自然接缝，你可以轻松地拼接纹理，同时隐藏由 UV 边界造成的接缝。如图
    3.22 所示，可以看到，实际牛仔短裤参考图像中的自然接缝被用来隐藏牛仔多边形 UV 中明显的 UV 接缝。我用同样的技术处理了 Tater 的所有衣服，包括靴子。我只是把衣服中自然存在的接缝作为起点和隐藏
    UV 边界接缝的手段，从而创建出更逼真的纹理。


    ## 皮肤纹理


    利用接缝显然不太适用于皮肤。因此，为了处理脸部、手臂和腿部，我从一块无缝皮肤贴图开始。我拍摄了自己的背部，然后创建了如图 3.23 所示的无缝纹理。

