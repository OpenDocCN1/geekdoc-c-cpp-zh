  mdcn: "\n\n## 使用Unity为iPhone®创建3D游戏美术\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_0_0.png)\n\
    \n包含modo®和Blender管线\n\nWes McDermott\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_0_1.png)\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_0_2.png)\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_0_3.png)\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_1_0.png)\n\n由Internet Archive于2022年数字化，资金来自Kahle/Austin\
    \ Foundation\n\n## 使用Unity为iPhone创建3D游戏美术\n\nQA 76.8 .164 M233 2011\n\nMcDermott,\
    \ Wes.\n\n使用Unity为iPhone创建3D游戏美术\n\n**到期日期**\n\n| 日期 |\n|---|\n| 2012年2月8日 |\n\
    | 2012年5月1日 |\n| 2012年5月2日 |\n|  |\n|  |\n|  |\n|  |\n|  |\n|  |\n|  |\n|  |\n\
    |  |\n|  |\n|  |\n|  |\n|  |\n|  |\n|  |\n\n## 对《使用Unity为iPhone创建3D游戏美术》的赞誉\n\n\
    > 随着用于创建和实现游戏资产的精密工具对艺术家变得越来越容易获取，了解我们如何在商业管线中使用这些工具不仅重要，而且比以往任何时候都更为关键。本书是这一路径上的综合指南：从一个强有力的概念想法出发，将其精简并转化为一个令人兴奋且完整实现的项目！Wes将引导你完成涉及的许多步骤，并使用这些强大的3D工具（modo、Blender和Unity），帮助揭开游戏创作与艺术表达过程的神秘面纱。\n\
    > \n> *Warner McGee，插画师/角色设计师*\n\n> 简而言之，本书包含了为你的iPhone或iPad游戏添加3D内容的“秘方”。干得漂亮，Wes！\n\
    > \n> *Bob Bennett，Luxology LLC*\n\n> “Wes非常出色地牵着读者的手，走过为Apple移动设备开发游戏的种种细节。艺术与技术知识之间的壁垒被充分模糊，使艺术家能够从容处理游戏开发的技术方面。这是一本适合我们每个人心中游戏开发者的好书。”\n\
    > \n> *Yazan Maikosh，9b studios董事总经理*\n\n## 使用Unity为iPhone创建3D游戏美术\n\n包含modo和Blender管线\n\
    \nWes McDermott\n\n新英格兰理工学院图书馆\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_4_0.png)\n\
