    the amount of vertices sent to the GPU. As we mentioned in Chapter 1, with Static
    Batching, vertices are stored in an indexed vertex buffer, which contains less
    data for the CPU to deal with and is thus faster than Dynamic Batching. However,
    we then have the caveat of not being able to transform the vertices. Static Batching
    creates a shared mesh. These items are not combined. They remain separate, but
    all of the vertices are added to an indexed vertex buffer, which is the vital
    aspect of Static Batching in terms of how you create your objects. Let''s take
    a look at an example. In Fig. 4.6, I combined two sections from a level into one
