    ## 献词


    献给我的妻子 Ann Marie、女儿 Abby 和儿子 Logan。


    ## 致谢


    感谢我的主和救主耶稣基督，感谢你赐予我的祝福和机会。离了你，我什么也不能做。感谢我的妻子 Ann Marie、女儿 Abby 和儿子 Logan，感谢你们在我为本书工作而经历的那些漫长夜晚和周末里给予的鼓励、支持和耐心。我爱你们！


    一个人无法独自写成一本书。在整个过程中，有几位出色而富有才华的人提供了意见、帮助和支持。对此，我衷心感谢你们。


    感谢本书的技术编辑 Oleg Pridiuk，你的技术意见和行业经验是本书的宝贵财富。没有你，我无法完成这本书！很高兴你参与了这段旅程。


    我还要感谢几位不可或缺的 Unity 团队成员 Paulius Liekis、Alexey Orlov、Renaldas Zioma、Tom Higgins
    和 David Helgason，感谢他们慷慨的支持和技术意见，也感谢 Unity Technologies 的其他所有人。你们热爱自己所做的事，并相信自己的产品，这一点确实显而易见。这个
    Unity 版本简直太棒了，能为如此出色的应用程序写一本书真是太好了。


    感谢 Warner McGee 为 Tater 提供了令人惊叹的插图，能在这个项目上与你合作真是太棒了！你的作品总是让我惊叹，感谢你为绘制 Tater 付出的辛勤努力。


    感谢 Efraim Meulenberg（Torpedo Twins）慷慨提供了来自 UnityPrefabs.com 的摄像机控制装置。你总是迅速向同行开发者伸出援手，和你交谈总是很有趣。我非常感谢你的支持！


    感谢 Bob Berkebile，他的 iTween Animation System 为本书的演示应用提供了快速简便的解决方案。感谢你在一些编码工作上提供帮助。


    感谢 Pano2VR 的创造者 Thomas Rauscher，感谢你为本书提供了一份 Pano2VR 副本。我非常感激！


    感谢 Yazan Malkosh 对本书的支持。你是一位了不起的 3D 艺术家，我一直很欣赏你的作品。


    感谢 Luxology 的 Bob Bennet 以及整个 modo 开发团队，你们对我的写作工作给予了非常多的支持，我非常感激！请继续让 modo 保持出色！


    感谢所有一直支持我的朋友和家人，也感谢我在 Twitter 和其他社交媒体平台上遇到的所有优秀艺术家，你们的支持帮助我坚持完成了这个项目。


    最后，感谢读者购买本书。希望你喜欢它，并希望它能帮助你更好地理解使用 Unity iOS 为 iPhone 和 iPad 开发创建 3D 内容。


    Xbox LIVE 独立游戏使用 Microsoft XNA Game Studio。不过，由于我更偏向艺术方向，我发现使用 XNA 编写游戏可能是一个缓慢的过程，而且相当难以掌握。作为多媒体开发者，我非常熟悉使用
    Flash ActionScript、JavaScript 和 Python 等脚本语言进行编程。Unity iOS 提供了完美的解决方案：你既能获得完整的
    3D 环境，类似于以直观、艺术化的方式构建场景的 3D 应用程序，又能使用 JavaScript 等脚本语言编写游戏。Unity iOS 让我能够专注于自己的优势，即游戏开发的艺术方面，同时仍能编写代码并创造引人入胜的互动体验。这是两全其美，并融合进一个从底层开始就为快速游戏开发而构建的应用程序中。


    Unity 还能够将游戏发布到多个平台，例如 Wii、iPhone 和 iPad、Android、桌面和 Web；借助 Unity 3.0，还支持 Xbox
    360 和 PS3。例如，使用 Unity，只需很少的工夫就能将游戏从 iPhone 移植到 Web 等其他平台。Unity 还支持主流 3D 动画软件包和
    FBX 等主流格式。作为一名艺术家，我发现 Unity 是创建交互式 3D 内容不可或缺的工具，也是我首选的游戏引擎，因为它易于使用且工具集对艺术家友好。


    像 Unity 这样的游戏引擎需要硬件来运行；如前所述，Unity iOS 将运行在各种硬件平台上，其中最值得注意的是 Apple 的 iDevice，例如
    iPhone、iPod Touch 和 iPad。Apple 的 iDevice 提供了优雅的操作系统 iOS，并为其所有平台的开发提供了一致标准。有人说，Apple
    对其硬件和操作系统保持如此铁腕的控制会导致产品较差，但作为游戏开发者，我觉得这种封闭环境消除了我的特定游戏将如何在平台上运行的“猜测工作”。使用 iOS，我的游戏可以面向少数几款设备；尽管
    iPhone 和 iPad 等设备之间的内部硬件有所不同，但大多数情况下，硬件为 iOS 设备开发提供了标准，这使得很容易确定优化目标，并轻松构建可在每个平台上运行的游戏。现在，随着
    iPhone 4 等新一代设备的推出，硬件肯定会发生变化并变得更加强大。因此，你希望游戏支持多少代设备，将决定在构建能在所有 iDevice 上良好运行的优化内容时，支持工作的复杂程度。


    Apple 的 iOS 不仅提供了标准化环境，还背靠庞大的市场。随着 App Store 的发明，Apple 为开发者建立了一个发布和销售内容的大众市场，这个市场每天都在持续快速扩张。在撰写本书时，目前有超过
    250,000 款应用可供使用，下载量超过 50 亿次。此外，Apple 已向开发者支付超过 10 亿美元。App Store 上有超过 1,000 款由
    Unity 驱动的游戏，而且这个数字还在继续快速增长。其中几款游戏在 App Store 前 25 名和前 100 名榜单中广受好评。Unity 一次又一次证明自己是可靠的开发平台，是为
    iPhone 和 iPad 创建游戏的最佳中间件解决方案。


    ### 使用 Unity 编写代码


    Unity 还支持 C# 以及 JavaScript 语言。如果你曾在 XNA Game Studio 中使用过 C#，那么转向 Unity 会轻而易举。无论你的编程经验水平如何，Unity
    都有适合你的东西。


    然而，Apple 的 App Store 并非没有争议；作为游戏开发者，最好始终审视每一个机会。许多人表示，市场已经过度饱和，独立游戏开发者很难获得关注。我完全同意情况可能如此，但如果你有创作游戏的热情，发布一款有潜力呈现在数百万用户面前的游戏，可能会带来深深的回报。有了
    App Store，市场就在那里；除非尝试，否则你永远不知道你的游戏会有多成功。


    此外，Apple 确实会审核提交的应用，并保留拒绝你的应用的权利。在本书写作期间，当 Apple 更改 SDK 协议第 3.3.1 节中的服务条款时，我和所有开发者都经历了一段艰难时期，并面临
    Unity iOS 可能被排除在该平台之外的局面。当然，Unity 背后出色的开发团队经受住了这场风暴；结果，Apple 修订了 TOS，允许第三方开发工具。


    我非常喜欢 Apple 的开发环境，并只选择为 iPhone 和 iPad 开发。标准化的开发环境，加上能够运行高端游戏的强大硬件和庞大市场，使 Unity
    iOS 和 Apple 的 iDevice 成为独立游戏开发者的首选解决方案。话虽如此，作为游戏开发者，最好还是不要把所有鸡蛋放在一个篮子里。让你的平台多样化可能是件好事；尽管
    Apple 的平台很棒，但它并不是唯一的选择。移动市场中还有其他关键参与者，例如 Android 和 Windows Mobile。


    ### 前提条件：我应该了解什么？


    此时，你可能会问自己：“好，这听起来不错，但我需要知道什么？” 如前所述，本书的重点是解决游戏开发中的一个特定需求，即创建 3D 内容。在本书中，我们不会涵盖创建整个游戏的过程。不过，我们将深入且独特地探讨
    3D 内容如何具体与 Unity iOS 相关联，特别是在专门为部署到 iPhone 和 iPad 而构建高度优化内容方面。


    > *在本书中，我们不会涵盖创建整个游戏的过程。不过，我们将深入且独特地探讨 3D 内容如何具体与 Unity iOS 相关联，特别是在专门为部署到 iPhone
    和 iPad 而构建高度优化内容方面。*


    本书将深入介绍使用 Unity iOS 为 iPhone 和 iPad 创建 3D 内容背后的原理，因为本书是为注册的 iPhone 开发者编写的。

