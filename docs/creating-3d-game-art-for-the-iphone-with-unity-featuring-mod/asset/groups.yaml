    # ### Rigging Tater in Blender


    This section will be devoted to creating a rig in Blender. Again, this is not
    going to be a step-by-step tutorial. There are entire books devoted to character
    rigging and animation, and it''s a very deep topic. Instead, the focus of this
    section will be to provide you with the information that''s specific to creating
    a rigged character for Unity iOS and a project targeted for the iDevices. Depending
    on your game, your rig or characters could be much different than mine, and it
    will be more helpful to detail the important aspects of rigging and how it relates
    to the iPhone and Unity iOS.


    # ### iPhone and iPad Rigging Essentials


    Just as with vertex count, with bones you need to subscribe to the concept of
    ''less is more.'' You need to reduce the amount of bones used per character. For
    example, the Unity iOS manual suggests that you don''t use more than 30 bones.
    For example, the skeleton that was built for Tater contains 21 bones as shown
    in Fig. 5.11.


    The goal is to reduce the level of complexity of your rig, yet still be able to
    perform the animations determined for the character. For instance, Tater''s hands
    were modeled into fists, and there''s definitely no need to create bones for each
    individual finger. Notice in Fig. 5.12 that the hands consist of only one bone.'
  - '[PAGE 119]


    FIG 5.11 The Image Shows the Basic Skeleton for Tater.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_119_0.png)


    Adding bones to the Blender Armature that you’re not using to deform the mesh
    results in a pointless performance hit. You don’t want to include these bones
    in the Vertex Groups so you can simply tell them to not deform the mesh by disabling
    the Deform option in the Bones Properties as shown in Fig. 5.13. This essentially
    removes any influence for the bone. As you will see in Chapter 6, we will tell
    any controller bones used for IK and constraints to not influence the mesh by
    disabling the Deform option for these bones. When I first started using Blender,
    I was thrown off by the fact that bones are not considered objects themselves.
    They are in fact components of the Armature object and all rigging should be done
    with bones and constraints contained within one Armature. With Maya or 3ds Max,
    you can constrain or parent bones to Curves or other objects; however, with Blender,
    this can cause dependency issues. Instead, any control objects for IK or constraints
    are done with bones in the Armature object. Because of this, you need to make
    sure that the controller bones you create are just used for constraints and IK.
    You need to make sure that these bones are not influencing the vertices of the
    mesh. Again, the easiest method is to just tell the controller bone to not influence
    the Vertex Group or weighting by disabling its Deform option.'
  - '[PAGE 120]


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_120_0.png)


    However, another good option for controlling bone influence on a vertex is by
    using the Clean Weights tool, which can be found on the Tool Shelf (T-key) while
    in Weight Paint mode as shown in Fig. 5.14.


    The Clean Weight tool will remove vertices with low weights from the current group
    and will essentially remove the bone from influencing the mesh. This tool is helpful
    for controlling how many bones are influencing a particular vertex. Remember,
    in Unity iOS and most game engines for that matter, we can''t have a bone influence
    of more than 4 bones per vertex. This tool can help pick up any stray bones that
    are affecting a particular vertex with only a small weight value, which may make
    it hard to detect while painting weights.


    Now that we''ve discussed the essential principles for creating bones, we''ll
