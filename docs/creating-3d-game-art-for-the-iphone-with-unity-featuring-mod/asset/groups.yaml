    ### IK 与基础动画


    在第 5 章中，我们深入探讨了如何在 Blender 中创建骨骼，内容涉及为你的 Unity iOS 或 iPad 游戏中的角色资源制作动画。在本章中，我们将接着
    Tater 上次的进度，继续完成他的绑定。我们将研究如何为骨架（Armature）添加约束和 IK，还会对绑定进行一些额外的整理，使后续动画制作更加容易。


    绑定完成后，我们将讨论如何在 Blender 中为角色创建动画，并将动画导出为 FBX 文件以供 Unity iOS 使用。让我们开始吧——先为 Tater
