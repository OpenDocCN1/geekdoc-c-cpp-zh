    ![](img/d3e3fa4010906e98ec76be003a6e31c2_235_1.png)


    be very accurate for collisions, but also very expensive depending on the mesh.
    In Fig. 9.8, you can see that a Mesh Collider is added to the level sections.


    In my case, the Mesh Collider will work fine since the level sections are very
    basic with a lower poly count. However, on a more complex level model with a higher
    poly count, you''ll want to use a more optimized Collider such as the Box Collider.
