    \nFrom the Book's Official Web Site, Click the \"Tater's Weapon Load Out\" Link\
    \ to Get Access to the Book's Resources\n\n## Creating Tater’s Training Trash\
    \ Yard\n\nIn this section of the book, we are going to take a look at the creation\
