    shoot\");\n        } else if (touch.phase == TouchPhase.Ended){\n            print(\"\
    Touch Ended\");\n        }\n    }\n\n}\n```\n\n**图 7.18** 这里你可以看到当用户触摸屏幕时播放射击动画的脚本。请注意，射击动画被放在第\
    \ 1 层，并且 AnimationBlendMode 被设置为叠加。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_188_0.png)\n\
    \n**图 7.19** 在这张图中，你可以看到 Blender 中的分层动画已在 Unity iOS 中使用动画混合复现出来，就像之前在 Blender\
    \ 的 NLA 编辑器中所做的一样。\n\n## 在 Blender 中使用动力学为对象制作动画\n\n在本节中，我们将了解使用 Bullet 物理引擎创建一些程序化动画的过程。在本书的演示应用中，你将扮演\
    \ Tater，跑过他的训练设施并射击目标。如图 7.20 所示，目标是一块简单的木板，上面喷绘着僵尸脸。请注意 Tater 使用喷漆罐的艺术才能！此对象的动画目标是：当它被\
    \ Thumper 的爆炸击中时，炸成碎片，如图 7.21 所示。\n\n将物理用于此类效果可能非常合适。本章介绍的过程会将 Blender 中的物理模拟“烘焙”为关键帧，然后这些关键帧将通过\
    \ FBX 文件在 Unity iOS 中播放。然而，需要注意的是，使用这种方法可能会给 GPU 端带来较大负担。这并不一定是坏事，正如我们在本书中一直讨论的那样，你需要对游戏进行性能分析，以找出潜在的瓶颈。对于较新的硬件，iDevice\
    \ 上的 CPU 正变得比 GPU 更强大，这意味着如果你的游戏已经渲染负担很重，这种方法可能不是最佳解决方案。作为本节的补充，在第 9 章中，我们将讨论在\
    \ Unity iOS 中使用物理模拟创建相同的爆炸效果，这会将该效果所需的资源转移到 CPU 上。理解这两种方法背后的过程很重要，因为每种方法都可能以不同方式影响游戏的性能。\n\
    \n**图 7.20** 在这里你可以看到 Lazer 将在游戏中射击的目标游戏对象。该游戏对象将在 Blender 中使用刚体动力学制作动画。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_189_0.png)\n\
    \n**图 7.21** 在 Blender 中创建的动力学模拟将被烘焙并导出到 Unity iOS，以便它可以在游戏中使用，如此处所示。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_189_1.png)\n\
    \n让我们先来看看如何在 Blender 中设置刚体动力学。\n\n### 在 Blender 中设置刚体动力学\n\n目标游戏对象是在 modo 中创建的。将这个对象导入\
    \ Blender 比之前通过 FBX 将 Tater 和 Thumper 模型传输到 Blender 时更棘手一些。在我们进入实际的动力学设置之前，先来看看如何将目标对象导入\
    \ Blender。\n\n> **锁定目标……**\n>\n> 目标对象是在 modo 中创建的。你可以在资源网站上找到本章视频，了解目标对象是如何创建的。\n\
    \n"
