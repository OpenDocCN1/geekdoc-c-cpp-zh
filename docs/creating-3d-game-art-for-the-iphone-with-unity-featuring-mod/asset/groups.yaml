    In this chapter, we''re going to look at using the Beast Lightmapping Toolset
    in Unity iOS to create lightmaps for the level we created in Chapter 4, Tater''s
    Training Yard. Beast is a phenomenal feature within Unity iOS and definitely provides
    the easiest and best workflow in terms of creating lightmaps for your games.


    ## Beast Lightmapping


    Beast is a content pipeline tool capable of baking advanced global illumination
    and lighting effects. Beast has been used on several AAA game titles and is now
    integrated into Unity iOS. As a 3D artist, I can definitely state that Beast is
    an amazing tool and provides the best workflow for lightmapping your content.
    In Fig. 8.3, you can see our level with Beast-generated lightmaps. Since lightmapping
    is fully integrated into Unity iOS, I could distribute my props prefab containing
    the barrels and boards throughout the level and have shadows casting into the
    scene, as well as Ambient Occlusion, as shown in Fig. 8.4. This becomes a tremendous
    workflow improvement, not to mention quality boost. Since the environment props
    are distributed across the level in Unity iOS, using Beast allows the light and
    shadow of the props to properly interact with the level. Over the next sections,
    we''ll discuss the key aspects to using Beast. Let’s begin by taking a quick look
    at Beast and HDR.


    > **Tater''s Weapon Load Out**

