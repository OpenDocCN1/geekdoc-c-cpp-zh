    # Creating


    # 3D Game Art


    # for the iPhone


    **Featuring**

    modo® and

    **Blender Pipelines**


    # with Unity


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_275_0.png)


    > > “This book answers all of your questions—even if you''re trying to port your
    web-game to iPhone or create your first game for mobile devices. Creating 3D Game
    Art for the iPhone is reviewed and approved by creators of Unity 3. This book
    is like having your own Unity direct support specialist on your bookshelf.”

    > >

    > > — Oleg Prnduk, Unity QA specialist for iPhone, Android and Wii


    > > “Very rarely do you come across an artist that also thoroughly understands
    tech. Even rarer is finding those that can explain it all in a book. Wes McDermott
    is that artist and this is that book. I highly recommend buying a copy for each
    member of your team!”

    > >

    > > — Efraim Muelenberg (TornadoTwins), Founder UnityPatterns.com


    Creating visually stunning games for the iPhone and iPad is easier and more exciting
    than ever when you combine the cutting-edge game engine Unity iOS with artist-friendly
    modo, and also Blender, the free open-source 3D app. Get up to speed quickly with
    *Creating 3D Game Art for the iPhone with Unity*, the only book that takes you
    through creating optimized game art for the iPhone and iPad with a real-world
    approach.


    Author Wes McDermott delivers production-proven techniques, captivating 3D imagery,
    and valuable tips and tricks you need to model, animate, and texture your characters
    and environment assets, optimized for Apple iDevices—all in a clear, motivating,
    and entertaining style.


    +   - Learn how to create optimized game assets for the iPhone and iPad using
    Unity iOS

    +   - Improve your game''s performance while avoiding common development pitfalls
    with detailed information on batching, building models on the grid, and lightmapping
    with Beast

    +   - Gain access to video walkthroughs and information on the FREE iPhone/iPad
    app, *Tater’s Training Trash Yard*, which demonstrates core concepts and techniques
    covered in the book at www.wesmcdermott.com


    **Wes McDermott** has been a professional 3D artist for 11 years and is currently
    a Multimedia Developer for the Art Institute at the Flight Training Center where
    he develops 3D elements for video and interactive online training. The author
    of *Real World modo: In the Trenches with modo*, Wes has also been published in
    HDRI 3D magazine and is a featured artist at Luxology.com. He is a beta tester
    for Luxology, Autodesk, and Unity Technologies.


    USER LEVEL: Intermediate to Advanced Computer graphic (CGI) artists'
