  - '[PAGE 220]


    of color values. A value of 0 will produce a linear interpolation while 1 will
    produce a gradient-based interpolation, which can produce artifacts at the cost
    of detail.


    Ambient Occlusion is also an important setting as it can produce subtle occlusion
    shading in your scene. The Max Distance controls how far a ray can travel before
    it''s considered to be not occluded. A value of 0 means that the ray is infinite
    long. Contrast controls the transition between occluded and not occluded rays.
    Ambient Occlusion can provide a nice subtle shading effect to your scene. In Fig.
    8.22, you can see the difference between a scene with Ambient Occlusion and without
    Ambient Occlusion. The difference is subtle. Ambient Occlusion tends to help anchor
    the object in the scene with increased shading in the corner areas where light
    has difficulty reaching.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_220_0.png)


    > FIG 8.22 Here You Can See the Difference between Occlusion On and Off. Notice
    That the Lightmap with Ambient Occlusion Seems to Anchor the Objects, Especially
    in Shadow Areas.


    Something else to consider is that you can compress the lightmaps via the Compression
    toggle on the Maps tab of the Lightmapping Editor. Compression can cause artifacts
    to appear in your maps, as the compression setting toggles PVRTC 4 and RGB16 compression
    on your maps. However, by not compressing the files, you risk eating up texture
    memory. Again, you''ll need to test and profile your game to see which is the
    best route to take in terms of compression.


    # Beast Custom Settings


    At some point, you might find yourself needing to make some custom adjustment
    to the Beast settings. Beast reads baked settings from an XML file, which can
    be edited. From the Lightmap Editor, you can choose to generate a custom Beast
    file as shown in Fig. 8.23. This will add an XML file, which holds all of the
    Beast''s render settings into your lightmaps folder. This XML file allows you
    to make custom adjustments such as Anti-Aliasing Settings and choose a different
    environment type as shown in Fig. 8.24.'
