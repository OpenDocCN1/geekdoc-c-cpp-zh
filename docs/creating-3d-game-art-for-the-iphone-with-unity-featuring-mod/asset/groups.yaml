    Mip maps, which can be set on the Texture Importer by checking Generate Mip Maps
    as shown in Fig. 9.12, are a series of progressively smaller versions


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_237_0.png)


    FIG 9.11 You Can Set the Texture Size as well as Format in the Texture Importer
    Dialog.'
