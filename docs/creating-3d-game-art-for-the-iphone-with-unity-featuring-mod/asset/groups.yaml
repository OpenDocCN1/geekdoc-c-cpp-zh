    烘焙选项卡中的分辨率设置是全局设置；但是，您可以通过选择对象并调整光照贴图编辑器对象选项卡中的“光照贴图中的缩放”设置，按对象在光照贴图中分配更多分辨率，如图
    8.17 所示。最棒的是，此过程完全交互式，只需选择对象，调整“光照贴图中的缩放”，然后观察视口中的棋盘格图案缩放，以表示光照贴图中分配给该对象的纹素。您还可以从图
    8.17 中看到，其中一个桶的分辨率已调整，并且可以在 3D 视口中交互查看。


