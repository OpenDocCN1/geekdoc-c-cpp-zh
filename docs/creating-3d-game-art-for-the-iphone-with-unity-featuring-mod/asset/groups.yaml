    ### 规划顶点预算


    **Tater 的武器配置**


    前往资源站点查看本章的视频演示。


    我们在第1章“了解 iDevice 硬件与 Unity iOS”中谈了很多关于游戏预算的内容。制定游戏预算的一部分，就是为模型所包含的顶点数量制定预算。顶点预算是指决定构成场景的对象究竟包含多少个顶点，并以游戏循环的每帧为单位显示，同时仍保持游戏预算的帧率的过程。这对建模过程至关重要，因为如果不了解目标设备的限制、游戏的目标帧率和整体顶点预算，你就无法建模任何东西。在
    3D 应用程序中创建第一个多边形之前，你必须先确定顶点数。在第1章“了解 iDevice 硬件与 Unity iOS”中，我们通过讨论不同 iDevice
    中的各种硬件组件填补了这个谜题的第一块，以便了解其限制，从而建立基线，为 iPhone 和 iPad 创建优化的几何体。在下一节中，我们将了解如何确定顶点预算。


    ### 测试性能


    我们已经确定，规划顶点预算是创建任何实际几何体之前的第一步，但这个预算究竟如何确定？在游戏开发中，你会经常听到“视情况而定”这句话。虽然这听起来像是对复杂问题的快速回答，但事实上确实如此。在游戏开发中确定顶点预算或任何预算，完全取决于你的游戏。你打算创建的游戏类型，对你如何确定顶点预算有很大影响。例如，如果你的游戏渲染负担很重，比如在场景中使用大量对象，那么你就需要减少物理模拟。但同样地，一个物理负担很重的游戏会需要更多
    CPU 资源，因此需要更少的顶点数和场景中更少的对象，以平衡游戏的整体性能。这是一种权衡取舍，而你创建的游戏类型将决定这种平衡。这就是为什么第1章“了解 iDevice
    硬件与 Unity iOS”专门讨论 iDevice 硬件，因为在构建内容时，了解硬件能做什么及其限制至关重要。


