  mdcn: '

    我没有使用另一种格式（例如 Collada），而是选择使用 Blender 工具集将网格分离成多个层。这实际上极其简单，而且比在 modo 中操作更高效。要将网格分离成多个部分，请在编辑模式下按
    P 键，然后选择“按松散部件”，如图 7.23 所示。


    将网格分离为多个网格后，需要为每个网格设置枢轴点，使其位于该网格处，而不是原点处。这同样是一项非常简单的任务。要设置枢轴，请在物体模式下右键单击，将 3D
    光标放置在希望枢轴所在的位置，如图 7.24 所示，然后按 Shift + Ctrl + Alt + C，并选择“原点至 3D 光标”，如图 7.25 所示。这会将枢轴吸附到
    3D 光标。在调整刚体设置中的半径时，需要正确设置枢轴。现在，所有枢轴都已按图 7.26 所示定位，我们可以设置刚体模拟了。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_191_0.png)

    图 7.23 “分离，按松散部件”命令会将网格拆分为多个独立网格。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_192_0.png)

    图 7.24 右键单击，将 3D 光标定位到希望放置枢轴的位置。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_193_0.png)

    图 7.25 使用“原点至 3D 光标”命令将枢轴吸附到 3D 光标。


    现在，我们将为刚体模拟设置场景。我们将把组成目标板的所有网格都设置为刚体。用于支撑目标的立柱不会是刚体，因此不会参与动画。我们需要做的第一件事是添加一些额外对象来辅助模拟。我们需要添加一个地平面，这样当目标碎片掉落时，它们会撞击地面并产生反应。这个地面对象将代替游戏中的实际地面。在图
    7.27 中，可以看到地面对象，它只是一个简单平面，经过放大以覆盖模拟将发生的整个区域。


    我们还会向场景中添加一个球体，可以说，它将充当霰弹枪的爆炸效果。在模拟中，我们将把这个球体“发射”到目标板网格中，将它们炸开。在图 7.28 中，可以看到球体对象，它是一个经过放大的
    UV 球体，用来表示爆炸范围。请注意球体相对于目标的大小。同样，这个球体表示玩家开火时 Thumper 产生的爆炸。然后将球体放置在目标前方并与目标垂直，如图
    7.28 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_193_1.png)

    图 7.26 在这里可以看到，所有枢轴都已相对于网格设置。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_194_0.png)

    图 7.27 添加了一个平面来代替地面。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_194_1.png)

    图 7.28 爆炸范围是一个简单的 UV 球体对象。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_195_0.png)

    **图 7.29** 渲染引擎在 UI 顶部设置为 Blender Game。


    现在所有对象都已就位，我们将开始把相应的网格配置为刚体。首先，将渲染引擎设置为 Blender Game，如图 7.29 所示。


    我们先配置球体。选中球体后，转到“属性”面板上的“物理”选项卡，并将“物理类型”设置为“刚体”，如图 7.30 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_195_1.png)

    **图 7.30** 此图显示在“物理”选项卡上将“物理类型”设置为“刚体”。


    在“物理”选项卡中，可以设置刚体的属性，例如质量和半径。半径是一项重要设置，因为它涉及刚体在场景中的影响范围。对于表示爆炸范围的球体，半径设置得相当大，以确保它能影响整个板面，如图
    7.31 所示。


    还需要确保“碰撞边界”处于启用状态，并且针对该对象所表示的内容正确设置“边界”模式。对于球体，我为边界选择了“球体”设置，以使刚体的形状与其所应用的实际网格相匹配，如图
    7.32 所示。


    然后，我重复了这一流程，将板面的每一块都设为刚体。不过，对于各碎片网格，我增大了质量并降低了半径，使其仅涵盖该网格的边界区域，如图 7.33 所示。这一点很重要，因为如果半径过大，每个碎片会立即影响其他碎片，一旦它们被设为刚体，就会彼此推开。为了实现这一点，我们需要为模拟设置一些逻辑，这可以通过逻辑编辑器完成。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_195_2.png)

    **图 7.31** 半径在视口中显示为虚线圆。


    ## 设置逻辑


    我们先为球体设置逻辑。首先，我们将添加一个游戏属性，我将其命名为“col”，方法是单击“添加游戏属性”按钮，如图 7.36 所示。该属性稍后将用于仅在球体击中目标碎片时触发这些碎片的模拟。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_197_0.png)

    图 7.34 地面设置为静态。


    对于 UV 球体，我们需要创建两层逻辑。第一层将暂停动力学，这样当我们开始模拟时，重力不会自动影响刚体对象。第二层将重新启用动力学，但只会在我们按下空格键之后。在图
    7.37 中，可以看到这两层都处于高亮状态。第一层由一个“始终”传感器、一个“与”控制器和一个设置为“暂停动力学”的“编辑对象”执行器组成。从图 7.37
    中可以看到，这些项已连接在一起。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_197_1.png)

