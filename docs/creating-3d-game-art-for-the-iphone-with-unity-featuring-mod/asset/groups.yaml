    Unity iOS 和 Modo 中得到的顶点数同为八个顶点。尽管默认 UV 布局如图 3.2 上半部分所示将顶点数从 8 增加到 14，但它仍然提供了更好的方案，因为对象可以在不失真的情况下正确贴图。是的，可以增大平滑角度并消除所有
    UV 接缝，这样不会导致 GPU 拆分顶点，如图 3.2 下半部分所示，但这在贴图方面并不总是实用的解决方案。


