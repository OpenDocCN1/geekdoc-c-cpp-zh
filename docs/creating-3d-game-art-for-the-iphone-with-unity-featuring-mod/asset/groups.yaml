  mdcn: "\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_105_0.png)\n\n图4.21 这里是垃圾堆模型，它环绕着关卡。\n\
    \n## 为关卡制作纹理\n\n在本节中，我想谈谈关卡的纹理图集是如何创建的。我们将研究如何测量场景以确定纹理尺寸，以及如何创建UV。我前面提到过，整个关卡是作为一个网格项创建的，随后被拆分并导出为独立对象。这让我创建UV容易得多，而且当我将关卡拆分成若干部分时，所创建的UV贴图也被复制了。这意味着即使这些部分现在被保存到单独的FBX文件中，坐标仍能正确对齐。\n\
    \n### 测量场景\n\n第一步是测量场景以确定尺寸。如前所述，我使用Dimensions工具，选择多边形以获得测量值，然后将其乘以我的工作纹理尺寸。记住，我的工作纹理尺寸是128像素，因此选择一个墙面瓦片会显示4\
    \ x 4的尺寸，这等于纹理贴图中的512像素（128乘以4）。然后我测量了场景中的所有项目，并记录下它们在纹理贴图中需要对应的尺寸。\n\n### 创建纹理\n\
    \n在创建任何UV坐标之前，我创建了纹理图集。这与创建Tater和Thumper的方式有些相反。如前所述，我使用CGTextures下载了关卡所需的所有纹理参考，然后使用我的测量轮廓按照正确的尺寸规格构建纹理图集。这里的目标是使用图像中的每一个像素，并让每个像素都映射到一个对象。这个阶段比建模更困难，因为你必须在逻辑上想出办法，让所有纹理都能放进贴图中，同时保持正确的尺寸。例如，你可以在图4.22中看到，用我的纹理图集为木桶创建纹理时，我浪费了一些空间。这不会毁掉我，但它并没有达到应有的优化程度。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_106_0.png)\n\n图4.22 高亮区域显示了浪费的纹理空间。\n\
    \n### 创建UV\n\n纹理贴图完成后，我将该纹理导入modo，并设置UV窗口以显示图像。现在，在创建UV时，我可以使用图像贴图作为参考，将坐标与图像对齐。同样，这与你通常处理UV的方式相反，但它也让UV布局过程变得简单。在图4.23中，你可以看到所创建的UV贴图，以及它与纹理图集的关系。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_107_0.png)\n\n### 光照贴图UV\n\n对于这个关卡，我大量使用了光照贴图，因此我需要确保创建的UV贴图包含不重叠的坐标。不重叠的UV是创建适合光照贴图的UV布局的关键，也就是说，当前的UV贴图无法胜任。别担心，为光照贴图创建UV是整个过程中迄今为止最简单的阶段。在仍在为整个关卡使用单个网格的情况下，我创建了一个新的UV贴图，现在这个网格就有了两个UV贴图。第一个UV贴图用于纹理，第二个用于光照贴图。现在，在选中空白UV贴图的情况下，我使用了UV投影工具，将Projection模式设置为Atlas，然后在UV编辑器窗口中单击左键以创建投影。就这样。Atlas投影展开并排列了所有坐标，这种方式非常适合创建光照贴图。在图4.24中，你可以看到为创建光照贴图而创建的UV。\n\
    \n> **在Unity iOS中生成光照贴图UV**\n> \n> Unity iOS有一个很棒的新功能，允许你在导入设置中为光照贴图生成UV。我们将在第8章中查看这个选项。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_107_1.png)\n\n## 总结\n\n本章到此结束。我们讨论了几个重要主题，例如在网格上构建、将关卡拆分为多个部分以及设置工作纹理尺寸。如你所见，就建模技术而言，为关卡建模并不算过于复杂。它当然可能比这里展示的关卡更复杂，但本章展示的基础概念将延续到即使是最复杂的关卡设计中。\n\
