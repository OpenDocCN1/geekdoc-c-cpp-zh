    在本章中，我们讨论了为 iDevices 创建优化几何体背后的原则。创建优化几何体的真正诀窍在于决定如何利用预算中的顶点数量。你必须决定模型的重要部分在哪里，以便在那里放置分辨率，然后减少这些多边形，使它们能够连接到分辨率较低的区域。通过理解
    GPU 如何解释顶点数，你可以正确估算网格包含的顶点数量。正如我们讨论过的，网格接缝和 UV 边界会导致 GPU 拆分顶点，从而增加顶点数；通过理解这一原则，你将能够优化网格中的这些不连续处。在第
