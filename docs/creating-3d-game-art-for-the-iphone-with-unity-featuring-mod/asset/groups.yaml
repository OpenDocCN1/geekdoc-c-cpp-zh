    30 fps 的帧率。有了这个目标，我创建了一个演示场景，可以安装到 iPhone 和 iPad 上，以测试性能并看看我能把硬件发挥到什么程度。


    这个演示场景不需要复杂，也不需要好看。这个场景的目的纯粹是评估性能。为了节省时间，我访问了 Unity iOS 网站并下载了 Penelope 教程，可在
    http://unity3d.com/support/resources/tutorials/penelope 找到。Penelope 模型的细节水平接近我想为
    Tater 创建的细节水平，会是一个很好的测试模型。然后我打开了 Penelope 完成项目，并删除了除模型和“PlayerRelativeSetup”场景之外的所有资产。用这个简单场景，我有了一个带蒙皮网格和动画的模型，以及一个默认控制设置，可以在场景中移动角色，如图2.2所示。


    最后，我创建了一个简单按钮，并添加了一个脚本，该脚本会在场景中可玩角色所在位置实例化一个新的 Penelope 模型实例，并显示 Penelope 及其克隆体的总顶点数。通过使用
    Penelope 资产，我能够快速创建一个用于测试硬件性能的原型场景，而不必花时间创建对象。将游戏编译为 Xcode 项目后，我就可以在设备上运行游戏，同时运行
    Internal Profiler 来检查性能，如图2.3所示。


    在 Xcode 控制台中监控 Internal Profiler 的 frametime 变量时，我不断按下游戏中的“Add”按钮，以创建更多 Penelope
    游戏对象实例，从而增加顶点数和蒙皮网格。顶点数只统计 Penelope 角色及其实例化克隆体。此外，顶点数显示并未统计


    Internal Profiler 每隔 30 帧显示一次帧性能信息，frametime 变量描述渲染一帧所用的时间，以毫秒为单位。这意味着，如果你用 1000
    除以目标帧率 30，就得到 33.3 ms。测试性能时，我会观察 frametime 变量输出的毫秒值。例如，如果 frametime 显示为 37 ms，我会用
    1000 除以 37，得到 27.02，即 27 fps。


    通过了解 Penelope 模型的顶点数，并记录在场景开始卡顿之前我能添加多少个 Penelope 实例，我就能很好地估计硬件能处理什么。这个演示场景让我看到可以同时运行多少个蒙皮网格，以及可以在场景中渲染多少个顶点，这可以称为顶点吞吐量。不过，这只是场景性能的粗略估计，因为我没有考虑整个游戏中的脚本性能或物理。这个性能场景可以用来得出关于硬件在顶点数方面能实现什么的基本概念。


    在图2.4中，你可以看到我在第三代 iPod Touch 上运行性能场景得到的结果。


