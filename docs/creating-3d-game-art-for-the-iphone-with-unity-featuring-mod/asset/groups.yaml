    ![](img/d3e3fa4010906e98ec76be003a6e31c2_215_0.png)


    我们将在下一节讨论重要设置，但我想指出，对于我的项目，我将天空光颜色设置为浅蓝色。这是一个风格上的决定，因为我经常发现一种好的艺术技巧是对阳光等高光使用暖色，然后用冷色调平衡阴影和间接光照，如图
