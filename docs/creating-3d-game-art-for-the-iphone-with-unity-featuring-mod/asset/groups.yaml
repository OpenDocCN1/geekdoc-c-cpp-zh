    # Animation Using Blender


    *IK and Basic Animation*


    In Chapter 5, we took an in-depth look at creating bones using Blender as they
    pertain to animating a character game asset for your Unity iOS or iPad game. In
    this chapter, we are going to continue where we left off with Tater and finish
    up his rig. We are going to look at adding constraints and IK to the Armature,
    and we''ll also do some additional organization to the rig to make things easier
    when animating.


    Once the rig is completed, we''ll talk about creating animations for our character
    in Blender and exporting the animations to an FBX file for use in Unity iOS. Let''s
    get started by completing Tater''s rig by adding IK constraints.


    **Tater’s Weapon Load Out**


    Go to the resource site to view the video walkthrough for this chapter.


    # Completing the Rig: Adding IK


    Usually, in larger studios, a Technical Director, or more specifically titled
    as a Character TD, handles rigging. It’s true, rigging a character can be a pretty
    difficult and technical process. However, I found that rigging is much like scripting
    in that at first, mosts, including myself, are weary of it until you actually
    get in there and see that while it is a technical process it has varying degrees'
  - '[PAGE 139]


    of difficulty with some stages being much easier than others. Let''s look at it
    this way, there''s a big difference between programming an entire OS versus writing
    a script to rotate an object in your Unity iOS game. By that same token, there''s
    a big difference in having to create a character rig for a feature film versus
    a rig that allows you to create simple run, jump, and shoot animations for your
    game. Yes, you want your game animations to look great and set your work apart,
    but you''re also working with a limited number of bones and your focus is on keeping
    the overall broad feel of the motion versus capturing every single minute detail.
    The point is, your game rig, especially in regards to the iPhone and iPad, doesn''t
    need to have hundreds of overly complex and sophisticated controls. In fact, the
    simpler your rig is the better. In Fig. 6.1, you can see the completed rig for
    Tater. In Tater''s rig, there are four IK targets and four pole targets used to
    rotate the knees and elbows. As you can see in Fig. 6.1, there aren''t many controls
    used to animate Tater.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_139_0.png)


    FIG. 6.1 In This Image, You Can See the Controls Used to Animate Tater. Notice
    that There Aren''t Many Controls to Deal With.


    Let''s examine the controls for the rig. First, we''ll start with the feet and
    legs, which have a total of five controls as shown in Fig. 6.2.


    In the feet, I have the IK target for the legs. The Foot Controller allows me
    to pick up Tater''s foot and rotate it at the ankle as shown in Fig. 6.3. The
    Foot Bone is setup to allow Tater to raise his heel as shown in Fig. 6.4. The
    Toe Bone is used to articulate the toes as shown in Fig. 6.5.


    Finally, I have the knee controls, which allow me to point the knees as shown
    in Fig. 6.6. These controls are Pole Vectors set on the IK Constraint.'
