    ## Unity iOS Blender Support and FBX Workflow


    In regards to Blender animation, Unity iOS supports all nodes with position, rotation,
    and scale. Pivot points you set in Blender, as well as object names, are also
    imported. Blender''s Bones and Skinned Mesh Animation are also supported.


    ### Using FBX


    Unity iOS will import a "blender" file and convert it on the back end using the
    Blender FBX Importer. However, this is not the workflow that I use with Blender
    and Unity iOS. Instead, I prefer to export the FBX from Blender. The reason being
    is mainly personal preference. In my day-to-day work, I mainly work with Modo,
    Maya, MotionBuilder, and Mudbox and have long established FBX to be the best method
    for sending objects through my pipeline. I like having the FBX intermediate file
    available in case I need to take it into another application, and it stops me
    from having to open Blender to create an FBX file in these cases.


