    # Game Loop


    Inside the Unity iOS game loop is where the game components of our game are updated.
    The game loop is always running regardless of user input. From a 3D artist’s perspective,
    you can think of the game loop as an animation in a 3D animation, your scene runs
    at a given frame rate, and in each frame of the animation, something is calculated
    such as a key-frame interpolation. A game engine''s game loop is basically doing
    the same thing.


    The vertex data is transformed or moved in 3D space on the CPU. The result of
    this transformation is appended to an internal vertex buffer. This vertex buffer
    is like a big list or a container that holds all of the vertex data. Since the
    vertex data is copied on the CPU, this takes up around one third of the frame
    time on the CPU side, which wastes memory bandwidth due to the fact that the iPhone
    shares its memory between the CPU and GPU. On the iPhone and iPad, we need to
    pay close attention to the vertex count of our objects and keep this count as
    low as possible as the vertex count is more important than actual triangles count.
    As you''ll read in Chapter 2, we''ll talk about how to determine what the maximum
    number of vertices you can render per individual frame.


    I used to get confused by the “per frame” section of that statement. It helped
    me as a 3D artist to think about my game scene just like a scene in modo. For
    instance, if I have an animation setup in modo, the render camera will render
    the portion of that scene that the camera can see in its view frustum as set in
    the camera’s properties, for each frame of the animation. The same is true in
    Unity iOS. In Fig. 1.2, you can see an illustration that depicts the way in which
    I visualize a scene’s total vertex count per frame.


