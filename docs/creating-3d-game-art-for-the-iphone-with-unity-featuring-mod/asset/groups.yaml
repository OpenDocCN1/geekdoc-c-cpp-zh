    # Dedication


    To my wife Ann Marie, daughter Abby, and son Logan.


    # Acknowledgments


    To my Lord and Savior Jesus Christ, thank you for my blessings and opportunities.
    Apart from you, I can do nothing. To my wife Ann Marie, daughter Abby, and son
    Logan, thank you for your encouragement, support, and patience through the long
    nights and weekends I had while working on this book. I love you guys!


