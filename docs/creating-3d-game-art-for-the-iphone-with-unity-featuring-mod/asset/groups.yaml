    不过，Mip Maps 可能会让你的场景纹理看起来模糊。为了弥补这一点，我通常将 Mip Map 过滤设置为 Kaiser；在我看来，这往往会减轻这种模糊，如图
    9.13 所示。


    图 9.13 此处可以看到 Kaiser 与 Box Mip Map 过滤之间的差异。Box 过滤比 Kaiser 模糊得多。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_238_1.png)


    Mip Maps 旨在优化那些在 3D 空间中被推远、在屏幕上显得非常小的纹理。然而，正如第 4 章“基于网格构建”一节所讨论的，我们可以手动创建这种效果，确保网格仅使用纹理图集中与网格尺寸成比例的特定区域，这直接对应于以单位表示的网格尺寸与以像素表示的纹理尺寸之间的一对一关系。这意味着纹理在场景中永远不会太小，因此我们不必担心使用
    Mip Maps。对游戏进行性能分析将确保其得到正确优化。


    ## 优化着色器


    确保使用针对 iPhone 和 iPad 设备优化的着色器非常重要。Unity iOS 自带若干有用的 iPhone 兼容着色器，如图 9.14 所示。


    我强烈建议尽可能使用这些着色器。使用错误的着色器可能会导致游戏性能急剧下降。就着色器优化而言，有两类：像素光照（Pixel-Lit）和顶点光照（Vertex-Lit）。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_239_0.png)


    图 9.14 此处可以看到 iPhone 专用着色器。


    Pixel-Lit 着色器的开销远高于 Vertex-Lit 着色器。Pixel-Lit 着色器会根据照射到对象上的 Pixel Lights 数量，导致对象被多次绘制，因为它们会在每个像素上计算光照。这不仅会增加
    CPU 处理和向 GPU 发送命令的负载，GPU 还必须处理顶点并在屏幕上绘制像素。


    Vertex-Lit 着色器会基于网格顶点，一次性使用所有光源计算光照，这意味着网格只需绘制一次。


    重要的是，不要在 iPhone 和 iPad 的场景中使用任何 Pixel-Lit 着色器。为稳妥起见，请坚持使用 Unity iOS 提供的 iPhone
    着色器，除非你有特定理由使用其他着色器或自定义着色器。例如，当我为关卡材质设置 Beast 时，我意外地将其设置为使用 Diffuse 着色器，而这是一种
    Pixel-Lit 着色器。对我的游戏进行性能分析时，我意识到帧率突然降到了 6 FPS。稍作排查后，我发现了自己的错误。随后，我将关卡材质切换为使用 Diffuse
    Fast 着色器，这是一种 Vertex-Lit 着色器，如图 9.15 所示。


    着色器会对游戏产生巨大影响。务必确保严格使用 Vertex-Lit 着色器，并确保着色器不执行任何多通道操作，因为这会导致对象被多次绘制，也会影响 iPhone
    和 iPad 上的性能。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_240_0.png)


    图 9.15 对于我的关卡材质，我使用了 Diffuse Fast 着色器，因为它是 Vertex-Lit 着色器


    ## 在 Unity iOS 中使用物理系统


    在第 7 章中，我们讨论了一种在 Blender 中烘焙动力学模拟的方法。正如我提到的，该方法在 GPU 上的开销可能更高。通常，对于 3GS、iPhone
    4 和 iPad 等较新的 iDevices，CPU 相当快，而对于 iPhone 4 和 iPad 等分辨率更高的设备，性能瓶颈可能会落到 GPU 一侧，正如我们在第
    1 章所讨论的那样。如果你的游戏在渲染方面已经很重，也就是说已经占用了大量 GPU 资源，那么从性能角度看，使用 Unity 的 NVIDIA PhysX
    引擎可能更合理。这会将工作负载转移到能力更强的 CPU，而不是 GPU，并且可以作为第 7 章所讨论的烘焙动画方法的替代方案。此外，你将会看到，这种方法在
    Unity iOS 中设置起来要简单得多，也更快。无论你选择使用烘焙动画还是物理模拟，都取决于你的游戏内容和你要创建的游戏类型。因此，针对物理等某些方面会如何影响游戏中潜在的瓶颈区域，拥有不同的选择是件好事。衡量游戏性能的最佳方式是使用
    Internal Profiler，我们稍后会讨论。


    > *衡量游戏性能的最佳方式是使用 Internal Profiler。*


    就本书的演示应用而言，我通过在 Xcode 中使用 Internal Profiler 对游戏进行性能分析后发现，在性能以及让 3GS、iPhone 4 和
    iPad 都保持我期望的帧率方面，使用烘焙动画最终是更好的选择。在图 9.16 中，你可以看到 Internal Profiler 中与物理动画相关的结果。请注意，每台设备上的
    frametime 变量都会增加，这表明帧率下降。另外，请注意我高亮了 physx 变量，因为它表明物理计算时间增加。此图中的 physx 时间并不表示三台设备之间的性能对比，而只是某个时间点的快照，因为
    Internal Profiler 每 30 帧显示一次信息。


    图 9.16 此图显示了在使用物理系统的每台设备上平均增加的 frametime 值，以及 PhysX 使用量变量。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_241_0.png)


    我发现 iPhone 4 的整体性能最佳。使用 Internal Profiler 来衡量第 7 章所讨论的烘焙动画与在 Unity iOS 中使用物理系统之间的性能时，使用烘焙动画方法时，iPhone
    4 和 iPad 的帧率完全没有受到影响（33.4 毫秒或 30 FPS）。3GS 则从 33.4 毫秒（30 FPS）小幅下降到 33.9 毫秒（29 FPS）。使用物理模拟时，iPhone
    4 升至 39.2 毫秒（25 FPS），iPad 升至 41.1 毫秒（24 FPS），3GS 升至 43.9 毫秒（22 FPS）。


    在我的情况中，这些帧率下降并没有对游戏玩法造成显著差异；不过，帧率是你始终需要关注的事项，而使用 Internal Profiler 是衡量性能的最佳方式。现在，让我们来看看如何在
    Unity iOS 中设置目标爆炸效果。


    ### 设置目标对象


    为了展示 Unity iOS 中的物理方法，我们将使用第 7 章中的目标游戏对象。为了创建爆炸效果，我们需要为目标添加一些 Rigidbody 和 Collider
    组件。正如第 7 章所讨论的，目标由九个网格对象组成，我们将用它们爆炸成碎片。每个网格对象都添加了 Rigidbody 和 Box Collider 组件，如图
    9.17 所示。


    现在，每个代表将爆炸碎片的网格对象都有自己的 Collider，这可能是导致帧率下降的部分原因。正如我们之前所讨论的，Collider 在 iPhone 上的开销可能非常高，应谨慎使用。对于目标的每个碎片，我们使用的是
    Box Collider，它是最低开销的 Collider 之一。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_242_0.png)


    接下来，我们将添加一个 Box 游戏对象，用于在 Tater 射击目标时测试碰撞，其名称为“HitTest”。该对象也将拥有 Box Collider，并且会禁用其
    Mesh Renderer，这样它就不会渲染，因此不会发出绘制调用。在图 9.18 中，你可以看到该对象的 Mesh Renderer 已被禁用。


    我还为该对象设置了一个名为“Target”的新标签。这个标签将用于检查 Tater 射击时发出的射线检测（Raycast）所遇到的碰撞对象。在图 9.19
    中，你可以看到用于添加新标签的标签管理器。


    **图 9.18** 网格渲染器已禁用，因此立方体不会渲染，也就不会增加绘制计数。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_243_0.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_243_1.png)


    **图 9.19** 该对象已被赋予特定标签，可用于在脚本中标识该对象。


