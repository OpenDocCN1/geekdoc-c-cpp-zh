    A game unit can represent any measurement you would like. For instance, 1 game
    unit can be 1 ft or 1 m. It''s whatever value you want it to be, although it''s
    common practice in game development to establish a single game unit to be equal
    to 1 m. The reason being is that it''s easier to work with physics calculations
    if your game is adopting real-world measurements. For instance, the rate of gravity
    is 9.81 m/s², and if you want to simulate this in your game, it will be easier
    if you''re working with a 1 game unit to 1 m scale. If not, you''d have to work
    out how 9.81 m/s² relates to your own established scene scale to get the same
    result. So when creating my Unity iOS project, I adopt the scale of 1 game unit
    is equal to 1 m. In Unity iOS, you don''t have to set a preference or setting,
    it''s just something that you determine for your project and use this scale when
    creating and importing objects.


    ## Don''t Set Scale in Unity iOS


    It''s very important to not set the scale for your object within Unity iOS on
    the object''s Transform. The reason being is that when the scale is changed on
    the Transform, Unity iOS makes a copy of the object, which is the scaled version
    of the object. This wastes memory resources. Always be sure that the scale in
    Unity iOS is set to 1 × 1 × 1 and that any scaling is done either in the 3D application
    or in the FBX Importer Dialog via the Scale Factor setting.


    ## Setting Up Modo


    Internally, modo is always working in meters regardless of how you set the Accuracy
    and Units in the Preferences. You could say that if a 1 × 1 × 1 m³ in modo needs
    to be scaled to 0.01 or scaled down by a factor of 100 to be the same size as
    a 1 × 1 × 1 m³ created in Unity iOS, then Unity iOS must be working internally
    in centimeters. With that same notion in mind, Maya internally works in centimeters,
    and if you export a 1 × 1 × 1 m³ from Maya to Unity iOS, you need to set the Mesh
    Scale Factor to 1, meaning no scale conversion, for the Maya cube to equal the
    same size of a Unity 1 × 1 × 1 m³, which further proves Unity''s internal scale
    working in centimeter. By knowing the internal scale that your 3D application
    is working and how it relates to Unity''s internal scale, you''ll be able to gauge
    if your objects may or may not need to be scaled and by what factor.


    Ultimately, it''s best practice to think of Unity''s scale in terms of the arbitrary
    game unit you set for your projects. For instance, I set my game projects to have
    a scale of 1 game unit equal to 1 m. So in Unity iOS, 1 grid square is equal to
    1 unit. In modo, I create my objects, as 1 grid square is equal to 1 unit to match
    my project''s game unit scale. However, this means when working with modo and
    Unity iOS, your modo meshes will need to be scaled by 0.01 in Unity''s Importing
    Assets Settings via the Mesh Scale Factor due to the differences in how Unity
    iOS and modo internally work with scale as shown in Fig. 2.6.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_45_0.png)


    FIG 2.6 Notice that the Mesh Scale Factor Defaults to 0.01, and the Imported 1
    × 1 × 1 Modo Cube Matches a Default 1 × 1 × 1 Unity iOS Cube.


    You can either choose to scale the mesh in modo before export, thus not having
    to scale it in the import settings within Unity iOS, or simply scale the mesh
    by 0.01 in the import settings within Unity iOS. I prefer to scale the modo mesh
    in Unity''s import settings, which allows me to work in meters within modo. By
    doing this, I don''t have to worry about freezing scale in modo before export
    and sending my mesh over to Blender works better as we''ll discuss in Chapter
    5.


    In modo''s Preferences, under Accuracy and Units, I set the Unit System to Game
    Units and then set the Meters per Game Unit to 1.0. This means that every grid
    square in modo will be 1 game unit and will represent 1 m, which is what I am
    considering my Unity iOS units to be equal to as shown in Fig. 2.7.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_46_0.png)


    FIG 2.7 I Set Modo''s Unit System to Equal 1 Meter per Game Unit to Match the
    Scale I''ve Determined for My Game Project.


    I can now begin modeling my game objects in modo from 1 game unit to 1 meter scale.
    For example, I determined that I wanted Tater to be around 6 ft 5 in tall, which
    equates to around 1.99 m as shown in Fig. 2.8.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_46_1.png)


    FIG 2.8 Now that My Modo Unit System Is Set to My Game Project''s Game Units,
    I Can Begin Modeling My Game Objects to Scale.


    ## Importing into Unity iOS


    Once I''ve completed my models in modo, I''ll need to import them into Unity iOS.
    I use FBX as the format for transferring my models between applications, and I''ll
    need to export FBX from modo. The default FBX export from modo will export several
    items that aren''t needed in your Unity iOS scene, such as cameras, lights, texture
    locators, and so on. You can delete either all the nonessential items before export
    or these extra items in your Unity iOS project.


    I created a modo script for optimizing this workflow. The script will scan through
    your modo scene and remove all non-mesh items and export a clean FBX with one
    click. The script will also bake any animation data that is set on the transforms
    for your mesh items. You can download the script on the book''s resource site.
    When importing the FBX from modo, you''ll need to set some parameters in the Import
    Assets dialog within Unity iOS. For importing static objects or objects without
    animation, you only need to set the Mesh Scale Factor and the Smoothing Angle.
    As mentioned earlier, you''ll need to set the Mesh Scale Factor to 0.01 for working
    with objects that are set to the default scale in modo, as shown in Fig. 2.9.


    > **Unity iOS Transforms**

    >

    > Non-mesh items such as Locators and Groups are imported into Unity iOS as a
    Transform. In the case of a 3D application that supports bones such as Blender
    and Maya, bones are also imported simply as a Transform. A Transform holds the
    position, rotation, and scale of an object and can be manipulated the same as
    any other object in Unity iOS.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_47_0.png)


    FIG 2.9 Here You Can See the Tater Model Set with a Mesh Scale Factor of 0.01
    and How It Relates to a Default Unity iOS Cube.

