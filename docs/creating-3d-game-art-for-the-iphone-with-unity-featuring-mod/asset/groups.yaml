    ![](img/d3e3fa4010906e98ec76be003a6e31c2_150_0.png)


    **图 6.19** Hand.L 的 IK 目标。


    接下来，我在 Forearm.L 骨骼上设置实际的 IK 约束，并将 IK_Hand.L 骨骼设为骨骼目标。链长度设为 2，这样 IK 链会在 Bicep.L
    骨骼处终止。你可以在图 6.20 中看到 Forearm.L IK 约束的设置。


    和膝盖一样，我还为肘部创建了一个控制器，以便旋转它。在每个绑定中加入肘部控制通常是必备的，因为它能让你更好地控制手臂。在图 6.21 中，你可以看到肘部控制器。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_151_0.png)


    **图 6.20** 在这里你可以看到 IK 约束的设置。请注意，链长度设置为 2。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_151_1.png)


    **图 6.21** 在这里你可以看到肘部控制骨骼的位置。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_153_0.png)


    **图 6.23** Hand.L 骨骼有一个复制旋转（Copy Rotation）约束，其目标是 IK 控制器骨骼。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_153_1.png)


    **图 6.24** IK_Hand 骨骼同时控制手臂的位置和手部的旋转。


    骨骼属性中的继承旋转（Inherit Rotation）设置。不过，在摆弄完成后的绑定后，我决定最好让锁骨骨骼（Clavicle Bones）继承胸部骨骼（Chest
    Bone）的旋转。我还决定头部和脊柱骨骼也应继承旋转。这只是绑定工作的一部分，彻底测试你的绑定很重要，因为一旦你开始让它经受各种操作，就不可避免地会发现需要修改的地方。


    ## 创建主控制


    同样，在最终绑定完成后，我创建了最后一根骨骼，用作根骨骼，所有骨骼和控制器都将归属于它之下。这根骨骼的用途是让我能够整体移动或旋转角色。在图 6.26 中，你可以看到主控制器（Master
    control）。骨盆（Pelvis）、CNTRL_Foot.L 和 CNTRL_Foot.R 骨骼都设为 Master control 的子级。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_155_0.png)


    **图 6.26** 主控制器是整个绑定的根，可用于整体移动 Tater。


    ## 使用骨骼层


    Blender 有一套不错的层系统，你可以把骨骼放在骨架（Armature）内的不同层上。这很好，因为它允许你把所有将要设置关键帧的控制器放在一层，把不会设置关键帧的骨骼放在另一层。这确实有助于保持视图整洁，并让选择控制器进行关键帧制作变得容易得多。在图
    6.27 中，你可以看到所有控制器骨骼都位于第一个骨骼层中。这使得快速选择所有骨骼变得非常容易：按 A 键全选，然后使用 I 键设置关键帧，或清除姿态旋转（Alt
    + R）和姿态位置（Alt + G）。再说一次，你让自己操作起来越容易，效率就越高。为角色做关节活动和设置关键帧应该简单直观。你不应该为了完成工作而和你的绑定较劲。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_156_0.png)


    **图 6.27：** 骨骼层 1 在左侧，包含所有作为控制器且将设置关键帧的骨骼。骨骼层 2 在右侧，基本上是隐藏的，因为这些骨骼永远不会设置关键帧。


    ## 调整权重图


    正如上面的“修正旋转（Fixing Rotations）”一节一样，我也发现，一旦开始测试完成后的绑定，就需要调整权重图，以改善模型上的变形。Tater 模型是一个分辨率非常低的网格，在大腿等区域没有足够的边循环（edge
    loops）来提供干净的变形。你会发现，对于游戏角色，尤其是面向 iPhone 等移动平台的角色，多边形数量不足会在为模型制作动画时造成一些问题。这也是为什么仔细规划模型的多边形预算如此重要的另一个原因：这样你才能确保把重要的分辨率放在网格中变形最大的区域。


    > 仔细规划模型的多边形预算很重要，这样你才能确保把重要的分辨率放在网格中变形最大的区域。


