    design, but it''s an important technique to mention. However, the sections of
    levels I did create can be configured somewhat differently than my original layout.
    With Unity iOS, we now have the ability to work with mesh tiles from within the
    application. By using the new Vertex Snapping feature, we can simply and accurately
    snap tiles together by holding down the V key, hovering the mouse pointer over
    a desired vertex, and left-click and drag to snap the mesh to a vertex on another
    tile as shown in Fig. 4.5. Vertex Snapping in Unity iOS ensures that both meshes
    are "snapped" precisely together and can be used to quickly connect several mesh
    tiles to create a level within the application.


