  mdcn: '

    本书面向希望提升 3D 游戏美术创作知识的开发者和 3D 艺术家。理解这些原则后，你将掌握开始为自己的游戏创建内容所需的技术知识。尽管本书会深入探讨相关主题，而不只是讲理论，但我们不会提供完整的分步教程。我一直觉得，分步教程只会引导你创建某个特定的游戏对象或模型，而这很少与你自己的项目和需求相关。通过学习流程背后的原则，你将能够专注于创建自己的内容。


    有鉴于此，你需要对本书通篇使用的工具有实际操作基础，这些工具是 modo、Blender 和 Unity iOS。本书不会从初学者的角度讨论如何使用这些工具。相反，本书将重点介绍如何将这些工具用于创建优化游戏美术的特定工作流程。例如，在第
    1 章“了解 iDevice 硬件与 Unity”中，我们将讨论 iOS 设备的技术层面及其与 Unity iOS 的关系，但你需要具备 Unity iOS
    的实际操作知识，因为我们不会讨论导入资源或挂载组件之类的内容。同样，你也需要具备 3D 程序的实际操作知识。例如，我们将在 modo 中构建资源，但你需要了解建模工具并理解
    UV 映射。不涵盖这些基础知识的原因在于，这样书中的主题就能聚焦于更高级的具体任务，这些任务与创建优化游戏内容并部署到 iPhone 和 iPad 有关。


    这是一本高度专业化的书，写成了我希望自己在开始接触 Unity iOS 和 iPhone 游戏开发时就拥有的那本书。它重在去芜存菁，直击讨论的核心，并尽可能讲透本书需要涵盖的重要概念，以及大多数其他游戏图书遗漏的内容。


    在本书中，我将结合使用 Unity iOS 基础版和高级版许可证。基础版是使用 Unity iOS 进入 iPhone 游戏开发领域最便宜、最入门的途径。本书的演示应用将使用基础版许可证发布。你可以访问此链接
    http://unity3d.com/unity/licenses#iphone 查看基础版和专业版许可证的区别。


    我使用 Luxology 的 modo 软件作为主要的 3D 创作工具。modo 也非常适合游戏开发，因为它提供了精简的建模和 3D 绘制工具集。modo
    的渲染管线可以快速轻松地烘焙纹理和光照贴图。话虽如此，本书阐述的概念基于可迁移到任何 3D 应用程序的游戏开发原则，因此在跟随本书操作时，请随意使用你选择的应用程序。我坚信工具只是工具，真正让游戏出色的是艺术家及其技能。本书中对
    Blender 的使用就是一个很好的例子。在我的日常工作流程中，我会将 Autodesk Maya 与 modo 配合使用。Maya 是我进行绑定和角色动画时首选的
    3D 应用，但为了让本书尽可能面向更多人，本书的绑定和动画部分将使用 Blender。主要原因是 Blender 是开源应用，不会给你的工作流程增加额外成本，而且更容易获取。此外，由于我们讨论的是使用
    Unity iOS 为 iPhone 游戏进行绑定和动画的关键原则，你使用哪款 3D 应用并不重要，最终取决于个人偏好。


    尽管这是一本游戏美术书，但我们会结合某一特定游戏引擎深入讲解游戏美术创作流程，这意味着我们不能完全略去编程概念。具备 Unity iOS 中基本编程概念的实际操作知识会更有帮助。


    ### 深入核心原则


    我之前提到过，本书不会贯穿任何分步教程。如果你有点失望，先别急，我们来看看为什么我决定省略详尽的分步教程。我研究 3D 很久了，多年来也确实看过不少教程。我注意到一件事：我似乎从未从分步教程中学到多少东西。这类教程对初学者很棒，也正是我最初学习建模时所需要的。然而，当我想进阶时，分步教程就不够用了。我发现，以“按编号填色式的
    3D 做法”照做，会错过流程背后的关键原则。我错过了驱动这些技法的“为什么”。此外，我发现很多时候我会被 40 多页复杂步骤压得喘不过气，以至于完全错过构建模型技法背后的整体要点，更不用说我只是在学习如何创建某个特定对象。


    我觉得传达 3D 创作流程背后的核心原则和技法非常重要，这样你作为读者就能运用这些原则来构建自己的项目，而不是复刻我提出的某个具体东西。关键在于，一旦你理解某个流程背后的核心原则，就可以用这些原则摸索出自己的技法，并最终更快地推进自己的项目。


    虽然我们正在谈你自己的项目，我还想快速重申一点：使用哪款 3D 应用完全由你决定。我提到过，本书通篇会使用 modo/Blender 工作流程；不过，所涵盖的主题可用于任何
    3D 应用程序。某款应用并不一定比另一款更好，我强烈建议你始终想着开发或定制自己的工作流程。


    艺术家的工作方式各不相同，完成项目没有唯一正确的方法。你不必使用 modo 或 Blender 来跟随本书操作。事实上，正如我已提到的，我自己更常用 modo/Maya。由于
    Blender 免费，动画章节选用了它；而且由于 modo 目前若不额外花钱就缺少网格蒙皮功能，Blender 也是 modo 的绝佳搭档。我只是把在 Maya
    中的工作流程延伸到了 Blender。正是解释技法背后的“为什么”而非分步说明，才使这一点成为可能。


    ### 认识“Tater”


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_17_0.png)


    Tater 是我在极具才华的角色艺术家和插画师 Warner McGee（[http://www.warner-mcgee.com](http://www.warner-mcgee.com)）帮助下开发的角色。我对
    Tater 有一个概念，于是联系 Warner，请他帮助充实设计，并把他艺术专长融入 Tater 的设计中。我自己不是插画师，所以把一些非常基础的设计草图交给
    Warner，他由此施展魔法，制作出本书展示的 Tater 版本。与 Warner 合作这个项目非常棒，看着他把我最初的概念发展成一个完整实现的角色，也很有乐趣。由于
    Tater 还将用于本书之外的其他项目，我还创作了背景故事，以打造一个具有沉浸感的游戏 IP。


    Tater 是我一直在做的一个个人游戏项目《Dead Bang》中不情愿的英雄。本书要探讨的内容取自 Tater 的世界和《Dead Bang》游戏概念中的元素。在《Dead
    Bang》第一章中，Tater 是一个小镇的唯一幸存者，这场僵尸末日噩梦由一个名为“Brain Masher”的奇特装置引发。Tater 带着他可靠的伙伴“Thumper”——一把经过致命改装的霰弹枪，他以外科手术般的精准度使用它，每扣一次扳机就能打掉行尸的脑袋——四处搜寻，试图把不速之客从他家乡清除，并让
    Brain Masher 装置失效。Tater 喜欢把僵尸脑袋轰成渣——他亲切地称之为“Thump''n Noggins”（敲脑壳）——但比这更喜欢的事，就是大吃一袋新鲜的“浆果烧烤味薯片”，这也为他赢得了“Tater”这个绰号。


    在本书中，我们将查看 Tater 世界中的一些元素，用以说明书中涵盖的主题。我们将研究 Tater 和 Thumper 的创建与动画，以及《Dead Bang》世界中的一个环境，并使它们经过优化，可在
    iPhone 和 iPad 上运行。


    ### 本书资源


    除了本书中的内容，你还可以在本书资源网站上找到大量以视频演练形式呈现的附加材料。你可以访问 http://wesmcdermott.com，并点击“《为 iPhone
    创作 3D 游戏美术》图书网站”链接来进入本书资源。在本书官方网站上，点击“Tater 的武器配置”链接。出现登录提示时，用户名输入“Tater”，密码输入“thumpNoggins”。在每章开头，如果该章有额外视频内容，都会提醒你查看资源网站，并以提示标注“Tater
    的武器配置”来标示。


    本书还有自己的 iPhone 和 iPad 应用，名为“Tater”。该应用是一个创意演示，在真实 iDevice 上运行全书讨论的内容。通过“Tater”，你可以体验
    Tater 在训练垃圾场中的射击靶场。该应用展示了书中讨论的所有游戏资源和动画。你可以在本书官方网站上找到有关如何获取“Tater”应用的更多信息。


    ### 冒险开始……


    我们有很多内容要讲，首先会深入细致地了解 iDevice 硬件和 Unity 的内部机制。一旦我们扎实理解了驱动游戏的硬件，就可以开始构建经过优化的内容。


    准备好后，就进入第 1 章“了解 iDevice 硬件与 Unity iOS”吧；用 Tater 的话说：“我们来敲几个脑壳吧！”


