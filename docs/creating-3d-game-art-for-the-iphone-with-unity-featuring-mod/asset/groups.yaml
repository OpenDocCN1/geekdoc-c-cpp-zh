    确定单位与像素的比例，这样你就能确保自己的映射和纹理分辨率尽可能高效。


    现在，使用 Mip 贴图有助于优化纹理内存，因为其目的是随着摄像机离纹理越远，就用分辨率更低的图像副本替换该纹理。然而，这会产生场景中纹理模糊的副作用，我个人很不喜欢。如果你基于网格工作，可以通过确保网格只使用纹理图集中特定且成比例的区域，来手动创建这种效果。同样，你没有浪费任何分辨率，纹理坐标映射到图集的特定区域，这直接体现为以单位表示的网格尺寸与以像素表示的纹理尺寸之间的一对一关系。


    最后，第三个原因是对象可以平铺。你可以通过连接平铺块来制作新的、不同的对象配置，从而使对象成为可复用元素库的一部分，如图4.4所示。


    ## 使用网格是否有意义？


    在创建 Tater 和 Thumper 时，我们没有使用网格。游戏中的并非每个对象都适合基于网格构建。有机类型的模型使用网格方法效果不太好。同样，我们必须回到这一点：每个游戏都是不同的，并且有自己的一套需求。了解可用的不同方法有助于你为自己的项目做出合适的决定。所有游戏项目共同的一点是优化。你需要始终思考优化图形的最佳方式，而基于网格构建只是帮助你完成这项任务的又一种方法。


    ## 确定工作纹理尺寸


    那么，我们已经讨论了基于网格构建，但还没有真正深入具体流程。首先，我们需要确定一个工作纹理尺寸，它将在 modo 中用于建立 3D 空间中的单位与纹理图集中的像素之间的比例。在第2章中，我提到过
    modo 中的单位系统设置为游戏单位（Game Units），并且每游戏单位的米数（Meters per Game Unit）设置为 1.0。这意味着我们已经确定
    modo 的网格和工作平面中的1个方格等于1个单位。对于基于网格构建，我们需要更进一步，在网格与 modo 中的游戏单位设置之间建立另一种关系。从理论意义上讲，我们需要为一个游戏单位指定一个纹理分辨率。例如，我选择128像素作为工作纹理尺寸，这意味着我现在会把
    modo 中的每个游戏单位/米视为代表128像素。也就是说，在 modo 中，我可以把我的工作纹理尺寸称为每米128像素。让我们看一个例子来说明这种关系。在图4.14中，你可以看到我选择了一个单一的地面多边形，并且激活
    Dimensions 工具后，可以看到该多边形为4×4游戏单位或4×4米。如果用128乘以4，我会得到512，正如你在图4.14中也能看到的，这正是关卡纹理图集中地面纹理所包含的像素尺寸。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_99_0.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_99_1.png)


    现在你可以看到，这个单一的地面多边形是按照纹理分辨率创建的，一个4×4米的多边形在我的纹理贴图中等于512像素。modo 中的单位与我的纹理中的像素之间的这种关系之所以存在，仅仅是因为我这样设置了它。除了确保我已将每游戏单位的米数设置为1.0之外，modo
    中没有其他需要更改的设置。游戏单位与像素之间的关系是任意的，是我根据自己的项目需求自行确定的。


    那么，我是如何确定使用128像素作为工作纹理尺寸的呢？要回答这个问题，我们需要回顾一下硬件。在 iDevices 上，我们可以使用最高2048像素或2K的纹理尺寸。需要说明的是，这是针对
    iPhone 3GS、第三代及更高代 iPod Touch 而言的，因为它具体涉及对 OpenGL ES 2.0 的支持。我通常会使用最高1K（1024×1024像素）的纹理分辨率，因为我发现对于分辨率更高的
    iPhone 4 和 iPad 屏幕来说，这是一个不错的基础分辨率，同时又能轻松缩小以适配3GS。因此，我们可以使用的大致范围是64–1024像素，作为工作纹理尺寸。由此，我确定128是一个不错的起始基础数值。同样，这里并没有精确的公式，而是由你自己决定的东西。我本可以轻松使用256，并把每个地面多边形做成2×2米，但在建模时，使用4×4的尺寸更容易。


    ## 创建地面


    既然我已经有了工作纹理尺寸，并确定每个地面多边形的大小将正好是4×4米或游戏单位，我就可以开始布置地面多边形了。首先，整个模型被构建为一个网格项。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_102_0.png)


    图4.17 大门被导出为单独的网格。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_102_1.png)


    图4.18 道具将在 Unity iOS 的关卡中随机分布。


    它有300个顶点，并与关卡其余部分共享同一材质。这使我能够在整个关卡中随机放置大量此类物品，而无需承担额外绘制调用的开销。这些道具非常容易创建。桶是一个简单的圆柱体，木板则只是长方体。创建这样一个关卡的困难之处并不在建模阶段，因为用于为这些资源建模的技术绝算不上高级。


    ## 创建天空盒


    天空盒用于为你的关卡营造氛围。天空盒通常使用一个盒子创建，并使用立方体贴图来应用天空纹理。这是一种经过验证的技术，因为它能提供最小的畸变，并尽可能少地浪费纹理空间。我使用
    CG Textures 为模型下载纹理，并且本书中创建的所有内容都使用了该网站。你可以每天在 http://www.cgtextures.com 免费下载最多
    15 MB 的纹理。


    在 CG Textures 上，你可以下载任何立方体贴图格式的天空纹理。所提供的立方体贴图是条带格式，因此我使用一款名为 Pano2VR 的优秀程序，将文件转换为合适的立方体贴图，以便与
    modo 中默认盒子的自动创建 UV 完美映射。Pano2VR 在 Mac OS 和 PC 上均可使用，我经常用它来创建环境贴图。你可以在 http://gardenhomesoftware.com/pano2vr.php
    找到关于 Pano2VR 的更多信息。


    话虽如此，我发现使用立方体贴图似乎无法获得我想要的天空质量。使用立方体贴图时，我浪费了贴图中的大量空白空间，而且盒子网格的 UV 没有利用整个图像贴图，这导致了大量像素化。在图4.19中，你可以看到立方体贴图天空盒以及被浪费的像素。


    图4.19 立方体贴图中被浪费的像素以黄色标出


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_103_0.png)


    因此，我决定采用六边圆柱体，以尽量减少实际盒子方法所造成的接缝。使用圆柱体时，我能够执行简单的圆柱展开，然后缩放 UV，使其覆盖整个0-1空间，从而利用贴图中的所有像素。下一步是创建一张延伸到图像所有边的天空贴图。我回到
    Pano2VR，使用变换工具导出镜面球格式。最后，我将文件导入 Photoshop，并使用“扭曲 > 极坐标”滤镜，设置为“极坐标到矩形”，这会生成一种特定的展开方式，以满足我的纹理贴图需求。在图4.20中，你可以看到最终创建的贴图，它被裁剪为2048×2048，以便在
    Unity iOS 中使用。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_104_0.png)


    图4.20 这是我为天空创建的最终贴图，它没有浪费任何纹理空间。


    ## 创建垃圾堆


    接下来，我想谈谈关卡周围成堆的垃圾。垃圾堆在建模方面也非常基础。创建几何体的过程就是用尽可能少的多边形创建一座山。同样，我会使用最大平滑角来消除多边形中的棱面。该物品将使用与关卡不同的纹理图集。对于这个模型，UV
    布局是打造成功外观的关键。为了创建 UV 贴图，我将 UV 切分成多个部分。我确保每个部分彼此成比例，这样纹理在整个网格上就能保持一致的尺寸。这些 UV 被重叠放置于0-1空间的上部区域。下半部分预留给将在第7章讨论的目标对象。


    我使用 Luxology 的 ImageSynth 2.0 程序为我的贴图创建所有无缝纹理。我到 CG Textures 下载了几张垃圾场和废品场照片，并使用
    ImageSynth 合成了一张无缝纹理，用于映射该几何体。


    在图4.21中，你可以看到完成的垃圾堆模型。注意，垃圾堆纹理在纹理图集的上半部分使用了一张无缝纹理。

