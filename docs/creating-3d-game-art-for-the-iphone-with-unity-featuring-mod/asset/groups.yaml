    \n本书有一个配套网站，你可以在那里找到有用的资源，例如视频演示，它们将进一步说明所涵盖的主题。这些视频将进一步扩展每章讨论的主题，并提供与印刷页面不同的视角。\n\
    \n你可以通过访问http://wesmcdemott.com并点击“为iPhone创建3D游戏艺术的图书站点”链接来获取本书的资源。在本书官方网站上，点击“Tater的武器配装”链接。登录信息如下所示。\n\
    \n**用户名：tater**\n\n**密码：thumpNoggins**\n\n另外，请务必查看本书的iPhone/iPad应用“Tater！”。该应用作为一个创意演示，在真正的iDevices上运行书中讨论的内容。通过“Tater”，你可以玩转Tater的训练垃圾场射击靶，练习“敲脑瓜”的艺术！该应用展示了书中讨论的所有游戏资源和动画。你可以在本书官方网站上找到关于如何获取“Tater”应用的更多信息。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_255_0.png)\n\n在wesmcdemott.com上，点击“为iPhone创建3D游戏艺术的图书站点”链接进入本书官方网站。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_255_1.png)\n\n在本书官方网站上，点击“Tater的武器配装”链接获取本书资源。\n\
    \n## 创建Tater的训练垃圾场\n\n在本书的这一部分，我们将探讨“Tater的训练垃圾场”——本书配套应用的创建过程。我们将采用‘剪贴簿’式的方法，通过多张图片探索一些关键元素。在本书的资源站点上，你会找到实际视频演示，深入解释这一过程。在我们进入实际应用之前，让我们先来看看一个主角的演变。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_256_0.png)\n\n### 主角的演变\n\n在本节中，我们将看看Tater整个设计过程中的创意创作过程。我在书中提到，Warner\
    \ McGee为Tater绘制了插图。我很早就知道我需要一位插画师来创作Tater，我的第一个想法就是立即联系Warner McGee。在这个项目中与他合作真是太棒了。我把对Tater的一些早期粗略草图交给了Warner，他从那里开始施展他的魔法。然后他会把样稿发给我，我再提出修改和建议，我们共同将Tater打磨成最终设计，使其符合我对这个角色的整体构想。Warner和我在开发Tater的过程中玩得很开心。我们进行了许多创意讨论，看到一个想法变成现实真的很酷。早期，Tater还没有名字，所以我和Warner称他为Bob。\n\
    \n图1 这是我发给Warner的一个非常早期的Tater概念图。\n\n图2 这张草图展示了我正在构思的一些早期想法。我也把这张图发给了Warner，这样他就对我想要Tater的风格有了基本概念。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_256_1.png)\n\n"
