    # ## Texture Compression


    In Chapter 3, we discussed texture size and format. You can actually compress
    textures and change their size within Unity iOS. In Fig. 9.11, you can see by
    checking Override for iPhone, you can then have access to setting the maximum
    size as well as the format for the texture. The size you choose for your textures
    depends on your game as well as the device the game is running on. For instance,
    you''ll need to use higher resolution textures such as 1024 × 1024 for the iPad
    and iPhone 4. However, this is over-kill on the 3GS since its screen resolution
    isn''t high enough to really showcase these higher resolution textures and thus
    would be a waste of system resources. In Chapter 3, we also discussed the importance
    of creating textures that are a Power of 2 (POT). Nonpower of 2 textures (NPOT)
    doesn''t fit in the iPhone memory. It''s important to note that the rule of thumb
    is to create square POT textures, i.e., 1024 × 1024 or 512 × 512 as nonsquare
    POT textures may end up not getting compressed, i.e., 1024 × 512 or 256 × 128.


    You should monitor your texture sizes in the inspector and verify that you''re
    using PVRTC4 or PVRTC2 compression. Now, there are always exceptions to rule,
    say for example if you want to create some high-quality icons for your game''s
    UI, you could use RGB16 compression.


