    ## Using Dual Lightmaps


    Earlier, we mentioned the usage of Dual Lightmaps and how they work to blend real-time
    lights and baked lightmaps. I also mentioned that Dual Lightmaps are not available
    on the iOS platform. Dual Lightmaps can only be used in the Deferred Lighting
    Rendering Path and currently this is not available on mobile platforms. It is
