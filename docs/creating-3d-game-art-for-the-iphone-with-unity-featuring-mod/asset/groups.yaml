    meshes to be rendered. You can also see that the camera''s view is only showing
    half of the level. Because I''ve marked all of the meshes as Static and adhered
    to the rules of creating a batch, the meshes will be batched into one draw call.
    However, our job toward optimization isn''t done. We not only have to think about
    the draw call, but the camera view frustum and how it relates to the amount of
    vertices being stored in the indexed vertex buffer for Static Batching as well.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_91_0.png)


