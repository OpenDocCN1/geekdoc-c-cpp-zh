    **图 4.1** 这是我们将贯穿全书讨论的关卡。


    一个关卡。你构建关卡的整个方式对性能至关重要。在第2章中，我们了解了Tater的创建过程，该过程相当直接。我们讨论了确定顶点预算，然后对角色进行建模和UV映射，以符合该预算。然而，对于整个关卡，需要考虑的东西要多得多。取决于你的游戏，关卡可能相当大，你不应该直接把整个关卡构建成一个网格然后发送给GPU。嗯，也就是说，如果你关心性能，你就不会这样做。


    在设计关卡时，你需要同时考虑技术和艺术两个方面。例如，在艺术方面，你需要思考一个关卡如何服务于游戏的整体故事。你需要思考每个关卡将如何用新颖有趣的内容吸引玩家，同时又如何提高难度以保持玩家的兴趣。你需要确保每个关卡相互承接，并支撑游戏整体故事的推进。


    在技术方面，你需要始终关注性能。这就引出了我们作为游戏开发者不断面临的斗争：平衡性能与艺术愿景。当然，你可以把除了厨房水槽之外的一切都塞进关卡里，虽然它可能看起来棒极了，但不幸的是，它的运行速度不会超过12
    FPS。这会导致游戏失败，因为它的可玩性不佳。


    在接下来的几节中，我们将探讨如何平衡艺术与技术限制，以构建高质量且优化后的内容。


    ### 创建风格


    尽管本书的重点是构建内容的技术方面，但我觉得稍微谈谈风格也很重要。你的游戏风格应该与受众产生共鸣，并有助于你为玩家创造的体验。正如我提到的，在本章中，我们将了解如何构建Tater世界中的一个关卡。在创建任何内容之前，我已经为我的Tater角色写出了完整的故事梗概。我设计了他的外观、性格和环境。然后我聘请了Warner
    McGee——一位才华横溢的角色设计师——来创作插图并完善Tater的整体风格。对你想要创造的世界有深刻理解，是为关卡和角色构想风格的关键。例如，Tater有点像个乡下土包子，分析他的性格和特征帮助我想象出适合他个性的环境类型。为了本书，我想创建一个关卡，既能展示创建优化内容背后的流程，又能遵循我一直在制作的“Dead
