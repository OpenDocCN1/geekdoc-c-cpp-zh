    ## 总结


    在本章中，我们讨论了与 iPhone 和 Unity iOS 相关的骨骼创建和权重绘制的几个关键方面。本章讨论了在从 Modo 到 Blender 的流程中如何使用
    Blender；不过，本章所讨论的技术和原则同样适用于任何 3D 软件包。我们讨论了 iDevice 硬件的重要性，以及 Unity 如何利用 VFP 优化的蒙皮路径，还有你需要做些什么来确保充分利用这些优化。我们还讨论了骨骼数量的重要性，并确保每个顶点的最大影响骨骼数不超过
    4 根。最后，我们查看了 Tater 在 Blender 中创建的骨架，以及一些实用的权重工具，例如清理权重（Clean Weights）和 X 轴镜像（X
    Mirror）。


    在第 6 章中，我们将重点讲解如何创建额外的动画控制器骨骼和 IK 目标骨骼。我们还将讨论 Unity 如何导入 FBX 动画。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_138_0.png)


