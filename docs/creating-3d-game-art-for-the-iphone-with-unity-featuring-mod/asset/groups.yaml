    I am only using Blender for character animation and this doesn''t pose a huge
    problem, but it does make me add an extra step to my pipeline, which is to export
    an OBJ from Modo. Once Tater was ready for rigging, I exported an OBJ from Modo
    so that I could get the model into Blender for rigging and animation. A big issue
    with OBJ files is that they only support one UV set. However, since my character
    doesn''t contain overlapping UVs and typically a character won''t, I only needed
    1 UV set. As you''ll recall from Chapter 4, when creating the level, we needed
    to have a separate UV because we were using overlapping UVs for tiling. You can''t
    correctly create lightmaps with overlapping UVs. With Tater, I didn''t use a lightmap
    shader in Unity iOS and thus didn''t need the second UV set. Instead, I baked
    the lightmap into the diffuse texture map as shown in Fig. 5.5.


