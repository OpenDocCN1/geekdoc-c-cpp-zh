    difficult and technical process. However, I found that rigging is much like scripting
    in that at first, most, including myself, are wary of it until you actually get
    in there and see that while it is a technical process it has varying degrees of
    difficulty with some stages being much easier than others. Let''s look at it this
    way, there''s a big difference between programming an entire OS versus writing
    a script to rotate an object in your Unity iOS game. By that same token, there''s
    a big difference in having to create a character rig for a feature film versus
    a rig that allows you to create simple run, jump, and shoot animations for your
    game. Yes, you want your game animations to look great and set your work apart,
    but you''re also working with a limited number of bones and your focus is on keeping
    the overall broad feel of the motion versus capturing every single minute detail.
    The point is, your game rig, especially in regards to the iPhone and iPad, doesn''t
    need to have hundreds of overly complex and sophisticated controls. In fact, the
    simpler your rig is the better. In Fig. 6.1, you can see the completed rig for
    Tater. In Tater''s rig, there are four IK targets and four pole targets used to
    rotate the knees and elbows. As you can see in Fig. 6.1, there aren''t many controls
    used to animate Tater.


