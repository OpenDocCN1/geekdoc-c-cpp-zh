    is heavy on rendering such as by utilizing lots of objects in the scene, then
    you''ll need to cut back on physics simulations. But by that same token, a heavy
    physics-based game will demand more resources from CPU and thus call for smaller
    vertex counts and less objects in your scene in order to balance the overall performance
    of the game. It''s a give and take, and the type of game you''re creating will
    dictate this balance. This is why Chapter 1, “Getting to Know the iDevice Hardware
    and Unity iOS,” was dedicated to the iDevice hardware as understanding what the
    hardware is capable of and its limitations are vital when building your content.


    #### Creating a Performance Test Scene


    When you''re in the early stages of developing your game, it can be extremely
    helpful to create a performance scene to test the capabilities of the hardware.
    For instance, for the book''s game demo and coming from the perspective of a 3D
    artist, I wanted to concentrate on rendering the 3D assets. This was my primary
    goal, and I established early on that I wanted to spend the bulk of my timeframe
    spent rendering. I also decided that I wanted my game to maintain a frame rate
    of 30 fps. With this goal set, I created a demo scene that I could install on
    the iPhone and iPad in order to test the performance and see how far I could push
    the hardware.


    The demo scene doesn''t need to be complicated or doesn''t need to look good.
    The purpose of this scene is to purely gauge performance. To save time, I went
    to the Unity iOS web site and downloaded the Penelope tutorial, which can be found
    at http://unity3d.com/support/resources/tutorials/penelope. The Penelope model
    looked close to the level of detail I was looking to create for Tater and would
    make for a good test model. I then opened up the Penelope completed project and
    deleted all of the assets except the model and the “PlayerRelativeSetup” scene.
    With this simple scene, I have a skinned mesh with animations and a default control
    setup to move the character around the scene as shown in Fig. 2.2.


    Finally, I created a simple button and added a script that would instantiate a
    new instance of the Penelope model in the scene at the position of the playable
    character as well as display the overall vertex count for Penelope and her clones.
    By using the Penelope assets, I was able to quickly create a prototype scene for
    testing hardware performance without having to spend time creating objects. Once
    the game was compiled to an Xcode project, I could then run the game on a device
    while running the Internal Profiler to check performance as shown in Fig. 2.3.


    While monitoring the Internal Profiler''s frametime variable in Xcode''s Console,
    I continued to press the “Add” button in the game to create more instances of
    the Penelope game object and thus increasing vertex count and skinned meshes.
    The vertex count is only accounting for the Penelope character and her instantiated
    clones. Also, the vertex count display is not accounting for


    The Internal Profiler will show frame performance information every 30 frames
    with the frametime variable describing how long it took to render a frame measured
    in milliseconds. This means that if you take 1000 and divide it by your desired
    frame rate, which is 30, you get 33.3 ms. When testing performance, I would watch
    the frametime variable to see what value in milliseconds it was outputting. For
    example, if the frametime were indicating a value of 37 ms, I would then take
    1000 and divide that by 37 to get 27.02 or 27 fps.


    By knowing the vertex count of the Penelope model and making note of how many
    instances of Penelope I was able to add to the scene before it began to choke,
    I was able to get a good estimate of what the hardware could handle. This demo
    scene allowed me to see how many skinned meshes I could run at the same time as
    well as how many vertices I could render in the scene, which can be referred to
    as vertex throughput. Now, this is only a rough estimate of the scene''s performance
    since I''m not taking into account script performance or physics used in an entire
    game. This performance scene can be used to derive a basic idea of what can be
    accomplished with the hardware in terms of vertex count.


    In FIG 2.4, you can see the results I got from running my performance scene on
    an iPod Touch third generation.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_42_0.png)


    FIGURE 2.4 I used the Internal Profiler to Monitor the Performance of the Demo
    Scene as I Continued to Add Game Objects in the Game. I Was Checking the frametime
    Variable to See If It Went Beyond 33.3 ms.

