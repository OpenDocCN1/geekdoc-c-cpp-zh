    导入资源中还有其他设置，我们稍后会讨论。自动计算法线选项和平滑角度参数在这个阶段对于将我们的 modo 对象导入 Unity iOS 非常重要，因为这些设置会直接影响你的顶点数，我们接下来会讨论这一点。


    ## 真实顶点数


    我们之前已经讨论过顶点数有多重要，因此必须注意：你不能把 3D 程序中的顶点数当作对象中的真实顶点数。要获得网格的真实顶点数，你需要将对象导入 Unity
    iOS，并查看游戏视图中的渲染统计窗口，如图 2.10 所示。请注意，Unity 的渲染统计窗口显示的是发送到 GPU 的最终顶点数，其中包括由灯光和复杂着色器添加的顶点。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_48_0.png)


    有几个因素会导致网格在由 GPU 渲染时顶点数增加。作为创建游戏内容的 3D 艺术家，你可能觉得不能相信 3D 应用程序中的顶点数这一概念很陌生，但正如你将看到的，你在日常
    3D 工作中其实已经一直在处理这些相同的因素。让我们从介绍三角带和退化三角形的概念开始，它们正是导致我们顶点数增加的罪魁祸首。


    ### 退化三角形


    Unity iOS 会尝试使用三角带尽可能高效地显示你的网格。三角带是一系列相互连接的三角形，它们共享顶点，如图 2.11 所示。这样可以实现更快的渲染和高效的内存使用。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_49_0.png)


    **图 2.11** 三角带是描述网格最高效的方式。


    然而，为了有效地做到这一点，Unity iOS 必须在各种不连续处（例如网格接缝和 UV 边界）创建所谓的退化三角形，或称零角度三角形。退化三角形由三个共线点或位于同一条直线上的点构成。它看起来更像一条线段，如图
    2.12 所示。这些三角形对性能的影响在 GPU 上确实会累积起来。在接下来的两个小节中，我们将深入探讨会产生退化三角形的不连续处。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_49_1.png)


    **图 2.12** 退化三角形看起来像一条线段，并会导致 Unity iOS 中的顶点数增加。


    ### 平滑角度


    在 modo 中，你可以通过平滑量和角度按材质调整多边形的平滑。如果不进行平滑，构成网格的多边形就会以平面形式显现。平滑角度用于确定相连多边形之间的最大角度容差。如果相连多边形之间的角度大于平滑角度设置，则不会发生平滑。Unity
    iOS 中导入资源对话框上的自动计算法线开关对网格进行平滑时所做的也是同样的事情。激活此开关后，你就可以像在 modo 中一样输入平滑角度。


    当 GPU 需要渲染硬边时，顶点数增加的问题就出现了。硬边出现在相连多边形形成的角度大于平滑角度的位置。GPU 需要在此角度处拆分顶点以创建硬边，这会导致网格接缝。模型中的硬边是你开始看到顶点数增加的区域。例如，在图
    2.13 的左侧，你可以看到三个相连的多边形，其平滑角度为 180 度。在右侧，其中一个多边形已被剪切并粘贴，因此将其连接到其他多边形的顶点已被复制。你现在可以看到已经创建了一条硬边。这类似于
    GPU 在遇到对象中的硬边时发生的情况。硬边处的顶点需要拆分以创建硬边，从而导致顶点数增加。


    ### UV 接缝


    在上一节中，我们讨论了网格接缝。现在，我们将研究这个问题的另一半，即 UV 边界或接缝。为对象创建 UV 时，你需要尽量减少 UV 贴图中的接缝数量。正如我们在网格接缝中所述，当
    GPU 遇到 UV 接缝时，顶点会被拆分。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_51_0.png)


    **图 2.14** 蓝色高亮边缘显示了一对不连续的 UV。边缘的蓝色阴影表示不连续的顶点。


    这会增加需要处理的顶点数以及必须绘制的像素数。即使额外的灯光不会导致额外的绘制调用（例如在顶点光照模式下），它们也仍然不是免费的。例如，在顶点光照着色器中，更多灯光意味着相同的绘制调用数和需要处理的顶点数，但每个顶点必须进行更多计算。这使其开销更高。即使在延迟渲染中，假设所有对象都以延迟方式渲染，每盏灯都会略微增加报告的顶点数，因为每盏灯都有一些额外的几何体需要光栅化，以便运行光照着色器。例如，导入一个四边形多边形并添加一盏灯，会使顶点数从
    4 翻倍到 8。


    最好尽量减少场景中灯光的使用，甚至更好的是完全不使用它们。相反，一个好主意是将场景光照烘焙到漫反射纹理贴图中，或使用光照贴图，并用 Unity 附带的某个
    iPhone 光照贴图着色器应用它。


    在第 8 章“使用 Beast 创建光照贴图”中，我们将讨论在 Unity iOS 中使用 Beast 的光照贴图。


    ## 为 Tater 和 Thumper 建模


    在本节中，我们将看看我是如何创建 Tater 和 Thumper 的。我们将从我为 iDevices 创建对象的工作流程开始，讨论该过程的重要方面。在第 3
    章“理解纹理和 UV 贴图”中，我们将通过介绍创建 UV 贴图和纹理贴图来继续这一讨论。


    ### 我的工作流程


    我之前说过，我想将 Tater 的顶点数保持在 800 个顶点以下。对于 Thumper，我想将其顶点数保持在 300 个顶点以下。最终，我成功将 Tater
    做到 659 个顶点，将 Thumper 做到 224 个顶点。这样，“主角”角色及其武器的合计顶点数为 883 个。对于这个角色，我没有先创建高分辨率网格，再据此构建低分辨率版本笼形网格。这是游戏中的典型工作流程，因为你可以从高分辨率网格中提取法线贴图。相反，我采用了一种修改过的方法：先创建一个低分辨率多边形笼形网格，然后通过向细节区域添加几何体来优化网格，并在基础网格完成后减少几何体。在制作基础网格时，我结合使用
    Loop Slice 和 Edge Slice 工具来快速添加和控制网格上的边循环。我还尽可能使用四边形多边形，只在想要减少几何体的某些区域使用三角形。例如，在图
    2.15 中，我在 Tater 的前臂中使用了一个三角形，从二头肌周围较高分辨率级别过渡到手腕周围较低分辨率级别。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_52_0.png)


    **图 2.15** 此处使用一个三角形来降低从二头肌到手腕的细节级别。


    当 Unity iOS 导入 FBX 文件时，它会自动进行三角化，因此无需在 modo 内将多边形三角化。


    ### 创建几何体


    就创建几何体而言，为 iPhone 和 iPad 的游戏对象建模并没有什么特殊技巧。你很快会发现，你会使用创建任何模型时常用的所有概念，例如倒角、挤出、推拉点，以及分割和合并多边形。创建
    iOS 内容的技巧在于决定在哪里添加细节、在哪里可以去掉细节，同时保持模型的整体形状。你必须对想把顶点花在哪里做出经过计算的决策。就像我提到的，我给自己为
    Tater 设定了少于 800 个顶点、为 Thumper 设定了少于 300 个顶点的预算，而诀窍就在于决定把预算的顶点花在哪里。


    让我们看一些例子，了解我决定在 Tater 和 Thumper 游戏对象中把分辨率放在哪里。在图 2.16 中，你可以看到 Tater 头部的分辨率。我决定通过让嘴巴从面部凸出来，为面部添加少量细节。我创建了一个边循环来勾勒嘴巴的轮廓。在嘴巴与面部其余几何体相连的嘴角处，嘴巴的分辨率降低了。我还决定从面部挤出鼻子。注意在图
    2.16 中，鼻子非常简单。就这一点而言，它没有任何鼻孔或太多细节。它只是大致类似鼻子的形状。表面细节通过纹理贴图来创建，如右图所示。此外，在图 2.16
    中，你可以看到眼窝区域是简单的平面多边形，眼睛的分辨率完全留给纹理贴图来定义。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_53_0.png)


    **图 2.16** 为了创建低分辨率网格，细节只需近似模型的形状。你可以使用纹理贴图进一步突出表面细节。


    在图 2.17 中，你可以看到 Thumper 的弹药筒（以红色轮廓标出）本意是圆的。然而，我只使用了一个六边圆盘，将其挤出并在中间分割，以保持四边形多边形。尽管弹药筒本质上有棱角，但它近似了我想要创建的圆润形状。


