    图 5.10 此处将质量设置为 4 根骨骼，并启用了蒙皮法线


    ## 在 Blender 中为 Tater 绑定骨骼


    本节将专门介绍在 Blender 中创建绑定。再次说明，这不会是一份分步教程。已有整本书专门讨论角色绑定和动画，这是一个非常深入的主题。相反，本节的重点是为你提供针对
    Unity iOS 创建绑定角色以及面向 iDevices 项目所需的具体信息。根据你的游戏不同，你的绑定或角色可能与我的有很大差异；因此，详细说明绑定的重要方面及其与
    iPhone 和 Unity iOS 的关系会更有帮助。


    ### iPhone 和 iPad 绑定要点


    正如顶点数一样，对于骨骼，你也需要遵循“少即是多”的理念。你需要减少每个角色使用的骨骼数量。例如，Unity iOS 手册建议骨骼数量不要超过 30 根。例如，为
    Tater 构建的骨架包含 21 根骨骼，如图 5.11 所示。


    目标是降低绑定的复杂程度，同时仍能完成角色的既定动画。例如，Tater 的手被建模成拳头，因此绝对没有必要为每根手指创建骨骼。请注意，在图 5.12 中，手部只由一根骨骼构成。


    图 5.11 该图显示了 Tater 的基本骨架。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_119_0.png)


    向 Blender 骨架中添加不用于使网格变形的骨骼，会造成无谓的性能损耗。你不希望将这些骨骼包含在顶点组中，因此只需在“骨骼属性”中禁用“变形”选项，就能让它们不使网格变形，如图
    5.13 所示。这实质上移除了该骨骼的所有影响。正如你将在第 6 章看到的，我们会通过禁用 IK 和约束所用控制骨骼的“变形”选项，让这些骨骼不影响网格。我刚开始使用
    Blender 时，曾因骨骼本身不被视为对象而感到困惑。实际上，它们是骨架对象的组成部分，所有绑定都应通过包含在同一个骨架中的骨骼和约束来完成。使用 Maya
    或 3ds Max 时，你可以将骨骼约束或父级到曲线或其他对象；然而，在 Blender 中，这可能导致依赖问题。相反，用于 IK 或约束的任何控制对象都通过骨架对象中的骨骼来实现。因此，你需要确保创建的控制骨骼仅用于约束和
    IK。你需要确保这些骨骼不影响网格顶点。同样，最简单的方法是禁用控制骨骼的“变形”选项，从而告诉它不要影响顶点组或权重。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_120_0.png)


    不过，控制骨骼对顶点影响的另一个好选择是使用“清理权重”工具，你可以在权重绘制模式下按 T 键打开的工具架中找到它，如图 5.14 所示。


    “清理权重”工具会从当前组中移除权重较低的顶点，并且实质上会移除骨骼对网格的影响。该工具有助于控制有多少骨骼影响某个特定顶点。请记住，在 Unity iOS
    以及大多数游戏引擎中，每个顶点受骨骼影响的数量不能超过 4 根。该工具可以帮助找出任何以很小的权重值影响特定顶点的游离骨骼，因为这种影响在绘制权重时可能很难发现。


    现在我们已经讨论了创建骨骼的基本原则，接下来将看看为 Tater 创建一些骨骼以及绘制权重。请记住，在构建绑定时有一些关键点需要考虑。务必减少骨骼数量。只使用绝对必要的骨骼，并且骨骼总数不要超过
    30 根。另外，务必把每个顶点的骨骼最大影响数减少到不超过 4 根。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_120_1.png)


    最后，务必禁用用于 IK 和约束的骨骼，因为你不希望这些骨骼影响网格。在图 5.15 中，你可以看到一张图表，展示了这些关键点。


    ### 创建基本骨架


    在 Tater 的建模阶段，为了给角色绑定骨骼，他是按照经典的“T 姿势”构建的，如图 5.16 所示。


    需要指出的是，手臂和腿已预先弯曲，以便对构成手臂和腿骨骼链的骨骼应用 IK，如图 5.17 所示。


    原因在于，关节区域的这种预弯曲为 IK 解算器在计算骨骼旋转时提供了一个优先角度。


    为角色创建骨架有许多不同的方法。在本节中，我们将讨论构建基本骨架，然后为该骨架应用蒙皮权重。在第 6 章中，我们将讨论添加额外的骨骼，这些骨骼将用作动画控制和
    IK 目标。为角色创建骨架的方式完全取决于你的项目需求以及角色所需的动画级别。对于本书的演示应用，Tater 需要具备奔跑、行走和射击等基本动画循环。需要说明的是，通过简单的骨架布局也可以实现很多效果。与游戏开发的各个方面一样，这归根结底是一种微妙的平衡


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_121_0.png)


    图 5.14 “清理权重”工具可以在权重绘制模式的工具架中找到。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_121_1.png)


    图 5.15 在这里你可以看到一张图表，展示了在角色中使用骨骼的关键点。


    **图 5.17** 在这里你可以看到，手臂在肘部建模时带有“预弯曲”，以便能够沿该弯曲创建手臂骨骼链。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_123_0.png)


    然后，我从侧视图调整每根骨骼，使骨骼末端位于边循环上，并且骨骼位于背部附近并像真实脊柱一样弯曲，以帮助在动画期间产生更干净的变形，如图 5.21 所示。


    接下来，我需要创建手臂和腿部的骨骼。现在，你可以创建一侧的腿部和手臂骨骼，然后将其镜像过去；不过，我选择使用骨架的 X 轴镜像功能，在我操作时自动在两侧创建骨骼。在图
    5.22 中，你可以看到在选中胸骨并在骨架选项中启用 X 轴镜像的情况下，我按 Shift + E 镜像挤出骨骼，以创建肩部、上臂、前臂和手部骨骼。


    现在，肩部骨骼连接到了胸骨，但这不是我想要的结果。为了分离肩部骨骼，我按 Alt + P，并从菜单中选择“断开骨骼”，然后分离骨骼，如图 5.23 所示。


    我想提请注意手臂骨骼的放置位置，如图 5.24 所示。请注意，我将骨骼末端放在了手臂的边循环中。还要注意，上臂和前臂之间有一个合适的“预弯曲”，有助于 IK；并且上臂骨骼的末端放置在实际网格肘部附近，以帮助变形。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_124_0.png)


    **图 5.18** 3D 光标放置在骨盆区域，以设定将创建骨架的位置。将光标吸附到网格可确保它与网格中心对齐。


    接下来，我继续处理腿部。为了使用骨架的 X 轴镜像功能，我首先从骨盆骨骼挤出第一根腿部骨骼——大腿骨，并使用 Alt + P 将其分离，就像处理肩部和手臂骨骼时一样。然后我将大腿骨定位到腿部，并继续使用
    Shift + E 镜像挤出小腿、脚和脚趾。在图 5.25 中，你可以看到已完成的腿部。


    此时，我需要重命名所有骨骼。我采用了典型的命名惯例，根据骨骼所在的一侧，在骨骼名称后附加“.L”或“.R”。这对于绘制镜像权重和使用复制姿态功能很重要。我还创建了三个骨骼组，以便用颜色标记骨骼来指示其方向，即左侧骨骼为蓝色，右侧骨骼为红色，中心骨骼为绿色。要创建骨骼组，请在姿态模式下选择骨骼，然后单击


