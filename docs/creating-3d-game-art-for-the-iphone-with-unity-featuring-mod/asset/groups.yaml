    as shown in Fig. 5.31. Finally, the first Spine bone was parented to the PelvisRotHelper
    with the Connected option as shown in Fig. 5.32.


    Finally, the leg bones (Thighs) are parented to the Pelvis bone. This setup creates
    a nice hip sway in that the Pelvis bone''s rotation is located just below the
    first Spine bone and places the pivot of the rotation right in the hip area of
    the mesh as shown in Fig. 5.33.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_131_0.png)


    **FIG 5.30** The Pelvis Bone''s Direction Was Flipped so Its Pivot Would Be in
    the Correct Place to Produce a Nice Hip Sway.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_132_0.png)


    **FIG 5.31** The PelvisRotHelper Is Parented to the Pelvis.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_132_1.png)


    **FIG 5.32** The First Spine Bone Is Parented to the PelvisRotHelper.


    **FIG 5.33** By Inverting the Pelvis Bone, Its Rotation Is Placed in the Desired
    Location for Hip Rotation.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_133_0.png)


    ### Disabling Inherit Rotation


    The last step in building the rig is to disable the Inherit Rotation setting for
    the first Spine bone, the Chest and Shoulder bones. By telling these bones to
    not inherit the rotations from its parent, the bone will effectively stay in place
    when the parent bone is rotated and will provide a much better articulation in
    the skeleton. For example, in Fig. 5.34, you can see the difference between the
    Shoulder bones inheriting and not inheriting the rotations from its parent bone,
    the Chest bone. This is actually the same as creating a Hinge bone.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_133_1.png)


    **FIG 5.34** Here You Can See the Difference between a Bone Inheriting and Not
    Inheriting Rotations for the Parent Bone.


    ### Weight Painting


    The first thing to be aware of with Blender is that you need to make sure that
    every vertex in your model is weighted to a bone. If any of the vertices are not
    weighted, when you import the mesh into Unity iOS, it won''t appear in the viewport.


    *Make sure that every vertex in your model is weighted to a bone. If any of the
    vertices are not weighted, when you import the mesh into Unity iOS, it won''t
    appear in the viewport.*


    In order to make sure that every vertex has a weighted value, I select "With Automatic
    Weights" when parenting the mesh to the Armature. This not only weights every
    vertex but also provides a nice starting point for painting weights. From here,
    I then go through each Vertex Group and adjust the weights with the Weight Painting
    tools to fine tune how each bone is affecting the mesh. The goal here is to minimize
    any gross deformations in the mesh while making sure that no more than four bones
    are influencing a single vertex. Some very helpful options to pay particular attention
    to when painting weights are the Auto Normalize and X-Axis Mirror as shown in
    Fig. 5.35.


    The Auto Normalize feature will automatically normalize each vertex as you paint
    so that you can''t paint more than a weight of 1.0.


    The Clean Weights function, also found on the Tool Shelf in Weight Paint mode,
    is good for making sure that a single vertex has a maximum influence of four bones.
    The Clean Weights tool will remove vertices with low weight values from the current
    Vertex Group. For example, when creating the PelvisRotHelper bone, I had forgotten
    to disable the bone''s Deform option. This bone was created with the sole purpose
    of helping the Pelvis with rotation and doesn''t need to influence the mesh. If
    a bone doesn''t need to directly influence the mesh, then it''s best in terms
    of performance to make sure it isn''t influencing the mesh. In Fig. 5.36, you
    can see that with the PelvisRotHelper Vertex Group selected, I used Clean Weights
    to remove any influence under the set Limit. Alternatively, I could have just
    deleted the Vertex Group for the PelvisRotHelper, but this example helps to showcase
    the usefulness of the Clean Weights tool. The Clean Weights tool is similar to
    the Remove Influence tool found in Maya and using this tool in Blender mimics
    my more familiar Maya workflow for rigging.


    When it actually comes to painting weights in Blender, I rely heavily on the X
    Mirror option. This option allows me to mirror the vertex weighting values from
    one group to another on the X-axis. For example, I can bend the left leg, and
    with X Mirror enabled, I can adjust the weights for the right leg knowing that
    these changes will be mirrored to the left side of the mesh. This is extremely
    helpful since it allows me to use one side of the mesh to check deformations while
    adjusting weights on the other side that isn''t being posed. By adjusting the
    weights on the side that isn''t being posed, it''s much easier to adjust the weights
    on vertices, while seeing my adjustments instantly on the posed half of the mesh
    as shown in Fig. 5.37.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_134_0.png)


    **FIG 5.35** Auto Normalize and X-Axis Mirror Are Found on the Tool Shelf in Weight
    Paint Mode.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_135_0.png)


    **FIG 5.36** Clean Weights Was Used to Remove Any Influence the PelvisRotHelper
    Was Having in the Mesh.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_135_1.png)


    **FIG 5.37** The X Mirror Option for Weight Painting Is Invaluable for Adjusting
    Weights. Here You Can See That I Can Work on Half the Mesh and See the Changes
    Mirrored in the Posed Side of the Mesh.

