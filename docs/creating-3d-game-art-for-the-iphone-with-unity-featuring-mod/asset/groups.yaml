  - '[PAGE 47]


    # # Importing into Unity iOS


    Once I’ve completed my models in modo, I’ll need to import them into Unity iOS.
    I use FBX as the format for transferring my models between applications, and I’ll
    need to export FBX from modo. The default FBX export from modo will export several
    items that aren’t needed in your Unity iOS scene such as cameras, lights, texture
    locators, and so on. You can delete either all the nonessential items before export
    or these extra items in your Unity iOS project.


    I created a modo script for optimizing this workflow. The script will scan through
    your modo scene and remove all nonmesh items and export a clean FBX with one click.
    The script will also bake any animation data that is set on the transforms for
    your mesh items. You can download the script on the book’s resource site. When
    importing the FBX from modo, you’ll need to set some parameters in the Import
    Assets dialog within Unity iOS. For importing static objects or objects without
    animation, you only need to set the Mesh Scale Factor and the Smoothing Angle.
    As mentioned earlier, you’ll need to set the Mesh Scale Factor to 0.01 for working
    with objects that are set to working with the default scale in modo as shown in
    Fig. 2.9.


    > > **Unity iOS Transforms**

    > >

    > > Nonmesh items such as Locators and Groups are imported into Unity iOS as a
    Transform. In the case of a 3D application that supports bones such as Blender
    and Maya, bones are also imported simply as a Transform. A Transform holds the
    position, rotation, and scale of an object and can be manipulated the same as
    any other object in Unity iOS.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_47_0.png)


    FIG 2.9 Here You Can See the Tater Model Set with a Mesh Scale Factor of 0.01
    and How It Relates to a Default Unity iOS Cube.'
