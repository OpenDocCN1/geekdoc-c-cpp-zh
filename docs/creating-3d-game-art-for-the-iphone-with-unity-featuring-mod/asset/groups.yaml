    Mip maps are designed to optimized textures that can appear very small on screen
    as they are pushed into the distance in 3D space. However, as discussed in Chapter
    4 in the “Building on the Grid” section, we can manually create this effect ensuring
    the meshes are using only a specific and proportional section of the texture atlas
    to mesh size, which directly relates as a one-to-one relationship between the
    meshes size in units and the texture size in pixels. This means that the textures
    will never be too small in the scene, and thus, we don’t need to worry about using
    Mip maps. Profiling your game will ensure it’s optimized correctly.


    # Optimized Shaders


    It’s very important to make sure that you’re using shaders that are optimized
    for the iPhone and iPad devices. Unity iOS ships with several useful iPhone compatible
    shaders as shown in Fig. 9.14.


    I highly suggest that you use these shaders as much as possible. Using the wrong
    shader can cause your game’s performance to drop dramatically. There


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_239_0.png)


    FIG 9.14 Here You Can See the iPhone-Specific Shaders.'
  - '[PAGE 240]


    are two categories in terms of shader optimization, which are Pixel-Lit and Vertex-Lit.


    Pixel-Lit shaders are much more expensive than Vertex-Lit shaders. Pixel-Lit shaders
    cause objects to be drawn multiple times depending on the number of Pixel Lights
    shining on the object since they calculate lighting at each pixel. This not only
    increases the load on the CPU to process and send commands to the GPU, but the
    GPU will also have to process the vertices and draw the pixels on screen.


    Vertex-Lit shaders calculate light based off the mesh vertices using all of lights
    at one time, which means the mesh will only need to be drawn once.


    It''s important that you don''t use any Pixel-Lit shaders in your scenes for the
    iPhone and iPad. To be safe, stick with the iPhone Shaders provided by Unity iOS
    unless you have a specific reason for using a different or custom shader. For
    example, when setting up Beast for my level material, I had accidently set it
    to use the Diffuse shader, which is a Pixel-Lit shader. When profiling my game,
    I realized that all of a sudden, my frame rate had dropped down to 6 FPS. After
    digging around a bit, I realized my mistake. I then switched the level material
    to use the Diffuse Fast shader, which is a Vertex-Lit shader as shown in Fig.
    9.15.


    Shaders can have a dramatic impact on your game. It''s important to be sure that
    you''re strictly using Vertex-Lit shaders and that your shaders aren''t performing
    any multipass operations, as this will cause your object to be drawn more than
    once and also impact performance on the iPhone and iPad.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_240_0.png)


    FIG 9.15 For My Level Material, I Used the Diffuse Fast Shader Because It''s a
    Vertex-Lit Shader


    # ## Using Physics in Unity iOS


    In Chapter 7, we discussed a method for baking a dynamics simulation in Blender.
    As I mentioned, that method can be more expensive on the GPU. Typically, with
    the newer iDevices such as the 3GS, iPhone 4, and iPad, the CPU is quite fast
    and the bottleneck for performance can fall to the GPU side with the higher resolution
    devices such as the iPhone 4 and iPad as we discussed in Chapter 1. If your game
    is already heavy on the rendering side, meaning it''s already using up a lot of
    the GPU resources, it might make more sense in terms of performance to use Unity''s
    NVIDIA PhysX Engine. This would shift the workload over to the more capable CPU
    rather than the GPU and can be an alternative to the baked animation method discussed
    in Chapter 7. Also,'
  - '[PAGE 241]


    as you will see, this method is much less complicated and quicker to setup within
    Unity iOS. Whether you choose to use baked animation versus physics simulation
    all depends on your game content and the type of game you’re creating. That’s
    why it’s good to have different options on how certain aspects, such as physics,
    will affect potential bottleneck areas in your game. The best way to gauge your
    game’s performance is by using the Internal Profiler, as we’ll discuss later.


    > *The best way to gauge your game’s performance is by using the Internal Profiler.*


    In the case of the book’s demo app, I found through profiling my game using the
    Internal Profiler in Xcode that using baked animation ended up being the better
    route to take in terms of performance and maintaining my desired framerate across
    the 3GS, iPhone 4, and iPad. In Fig. 9.16, you can see the results from the Internal
    Profiler as they pertain to the physics animation. Notice that the frametime variable
    increases on each device, which indicates a drop in frame rate. Also, notice that
    I’ve highlighted the physx variable as it indicates an increased time in physics
    calculation. The phyx time in this image isn’t an indication performance between
    the three devices, but is just a snapshot in time as the Internal Profiler display
    information every 30 frames.


    FIG 9.16 This Image Shows the Average Increased Frametime Values on Each Device
    Where Physics Was Used as well as the PhysX Usage Variable.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_241_0.png)


    I found that the iPhone 4 gave the best performance overall. When using the Internal
    Profiler to gauge performance between the baked'
  - '[PAGE 242]


    animation, discussed in Chapter 7, and using physics in Unity iOS, the iPhone
    4 and iPad didn''t take a hit in frame rate at all (33.4 ms or 30 FPS) when using
    the baked animation method. The 3GS took a small hit from 33.4 ms (30 FPS) to
    33.9 ms (29 FPS). When using the physics simulation, the iPhone 4 jumped to 39.2
