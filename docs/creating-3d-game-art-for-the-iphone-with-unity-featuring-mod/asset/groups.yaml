  mdcn: "\n![](img/d3e3fa4010906e98ec76be003a6e31c2_257_0.png)\n\n**FIG A.3** 这里你可以看到\
    \ Warner 根据我的原始草图构思的早期概念，这还处于“Bob”阶段。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_257_1.png)\n\
    \n**FIG A.4** 这是我交给 Warner 的概念草图，其中包含 Thumper 的粗略构想。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_257_2.png)\n\
    \n**FIG A.5** 到这时，Bob 已经变成了 Tater。以下是 Warner 创作的一些角色草图。你确实可以看出 Tater 开始成形了。\n\n\
    **FIG A.6** 这是我交给 Warner 的 Tater 配色方案。球衣上的“77”是我的出生年份。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_258_0.png)\n\
    \n**FIG A.7** Warner 发给我角色转面图，我可以把它们用作 modo 中建模的背景参考项。\n\n### Tater\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_258_1.png)\n\
    \nTater 角色转面图\n\n**FIG A.8** 在这里，我们开始制作封面。由于我不是插画师，所以对我来说，拍一些自己摆出 Tater 所需姿势的照片会更容易。你可以看到，中间那张照片就是我们采用的。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_258_2.png)\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_259_0.png)\n\
    \n**FIG A.9** 这是关键姿势的初步草图。你可以看到，我们当时仍在设计 Thumper。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_259_1.png)\n\
    \n**FIG A.10** 这张图展示了一些 Thumper 的改进。\n\n**FIG A.11** 这张图展示了关键姿势以及改进后的 Thumper\
    \ 设计。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_260_0.png)\n\n**FIG A.12** 这是\
    \ Warner 创作的最终插图。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_260_1.png)\n\n###\
    \ 开发菜单\n\n在本节中，你可以看到为游戏开发的菜单屏幕。Tater 是我个人游戏项目“Dead Bang”中的角色。Dead Bang 的世界很粗粝，所以我想把这种风格带入本书配套应用的外观中。为了创建实际的游戏内菜单系统，我使用了\
    \ Above and Beyond Software 的 EZ GUI，可在 http://www.anbsoft.com/middleware/ezgui/\
    \ 找到。EZ GUI 是一个用于为游戏开发 GUI 元素和菜单的优秀系统，因为它允许你通过利用纹理图集和共享材质来降低 GUI 元素的绘制调用。我还大量依赖了\
    \ Bob Berkebile 创建的 iTween。iTween 库是一个丰富的动画系统，可用于创建从简单到复杂的各种动画效果。它非常节省时间，并且被用来为我的菜单中的按钮制作动画。你可以在\
    \ http://itween.pixelplacement.com/index.php 找到关于 iTween 的更多信息。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_261_0.png)\n\
    \n**FIG A.13** 这是菜单系统的早期版本。大部分元素都已具备，但此时我仍在探索整体风格。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_261_1.png)\n\
    \n**FIG A.14** 这是菜单系统的最终背景。始终彻底探索你的概念和设计很重要。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_262_0.png)\n\
    \n**FIG A.15** 这张图展示了使用 EZ GUI 的菜单系统场景。在这里你可以看到为每个菜单选项创建的面板，以及 Game View 中渲染的游戏。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_263_0.png)\n\n**FIG A.16** 这些是菜单按钮。通过使用\
    \ EZ GUI，这些网格共享一个纹理图集和材质，因此只有 1 次绘制调用。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_263_1.png)\n\
    \n**FIG A.17** 这张图展示了加载屏幕菜单，它在实际游戏画面被调用之前被调用。这张图只包含 1 个精灵，并根据名为 eHD 的全局变量中保存的值加载\
    \ iPhone 4 或 iPhone 场景。\n\n### 游戏玩法场景\n\n在本节中，你可以看到游戏玩法场景中的各种元素。在应用的视频演示中，我将准确解释应用是如何创建的，其中也会涵盖游戏的编码。我创建了两个场景，以支持\
    \ iPhone 4 和较旧 iDevice 世代的不同分辨率。用户运行应用所用的设备决定加载哪个合适的场景。它会在一个静态类中捕获此设备信息，并在整个游戏中使用。\n\
    \n**FIG A.18:** 这是标清版本的完整场景。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_264_0.png)\n\
    \n**FIG A.19:** 在这张图中，你可以看到场景中 Beast 光照贴图的使用。在这里，你可以看到我正在检查光照贴图的分辨率，因为叠加的棋盘格图案标示了它。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_264_1.png)\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_265_0.png)\n\
    \n**FIG A.20:** 这是我的场景道具预制件。这个预制件通过简单地复制和粘贴元素，被随机分布到垃圾场周围。每个副本都会被批处理。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_265_1.png)\n\
    \n**FIG A.21:** Tater 的武器不是 Tater 网格的一部分。相反，它在运行时使用脚本作为父级挂接。这让我可以灵活地在游戏中添加新武器，即用户拾取新武器。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_266_0.png)\n\n**FIG A.22** 这是用于将枪作为父级挂接到\
    \ Tater 手部骨骼上的实际脚本。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_266_1.png)\n\n\
    **FIG A.23** 为了给 Tater 创建阴影，我没有使用 Projector。相反，我创建了一个简单的透明精灵，并将其挂接到 Tater 下。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_267_0.png)\n\n**FIG A.24** 目标靶也被制作成预制件。它由若干小网格项、一个烘焙动画和碰撞体组成。目标靶上还有一个脚本，当被击中时，会发送一条消息来播放为\
    \ FBX 假文件附加的动画，并在该目标靶的位置实例化一个用于爆炸的粒子预制件。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_267_1.png)\n\
    \n**FIG A.25** 这张图展示了由实例化的粒子发射器产生的爆炸。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_268_0.png)\n\
    \n**FIG A.26** 这张图展示了用于创建爆炸效果的实际粒子发射器。\n\n![](img/d3e3fa4010906e98ec76be003a6e31c2_268_1.png)\n\
    \n**FIG A.27** 为了创建枪口闪光，我将一个由三个透明精灵组成的 GameObject 挂接到 Thunder 的尖端。默认情况下，网格渲染器被禁用。当用户按下开火按钮时，一个脚本会将枪口闪光的网格渲染器切换为开启。使用一个协程将枪口闪光的网格渲染器关闭。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_269_0.png)\n\n**FIG A.28** 这里，你可以看到门预制件。这个预制件使用了一个带\
    \ Alpha 测试的透明光照贴图着色器。\n\n### 游戏玩法控制\n\n任何游戏的一个关键方面都是控制。编写控制系统可能是一项非常复杂的任务，视你的系统而定，正确实现它可能需要大量时间。我没有自己尝试这项冒险，而是求助于\
    \ Tornado Twins 和 UnityPrefabs.com（http://www.unityprefabs.com/）。我，Efraim Meulenberg，UnityPrefabs.com\
    \ 的创始人，慷慨地为本书提供了第三人称摄像机套件预制件。UnityPrefabs.com 的预制件不仅是质量惊人的资源，而且可以轻松集成到你自己的项目中。通过利用他们的第三人称摄像机套件预制件，我能够专注于控制的图形元素，并完全绕过编码，更不用说在项目上节省大量宝贵时间了。\n\
    \n![](img/d3e3fa4010906e98ec76be003a6e31c2_269_1.png)\n\n**FIG A.29** 这张图展示了来自\
    \ UnityPrefabs.com 第三人称摄像机套件预制件的控制方案，我重新换肤以匹配我的游戏风格。配置该预制件以及替换图形都非常容易。\n\n## 索引\n\
