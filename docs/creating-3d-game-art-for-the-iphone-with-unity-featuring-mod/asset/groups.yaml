    ## Reducing Geometry


    Thus far, we''ve discussed creating geometry in the sense of how to control resolution
    by placing detail only in the important parts of the model. We talked about reducing
    geometry by terminating edge loops and using triangles to move from higher to
    lower resolutions. In this section, we''ll take a look at some techniques that
    can be used to reduce geometry when optimizing your models.


    ### Polygon Flow and Spin Quads


    It is very important to pay close attention to polygon flow on your model. It''s
    particularly important when your model will be animated as a skinned mesh.


    ### Topology Is Key


    The topology of your mesh will give you clues as to where you need to concentrate
    a bulk of your vertex count. You need to be sure to provide enough resolution
    in the areas of your mesh that will be deformed when animated.


    You need to be sure that the topology of your mesh is designed to handle the animation.
    In Fig. 2.22, you can see how the polygons were arranged to flow from the top
    of the shoulders across the chest and around the shoulders and biceps. The topology
    of the chest and shoulders allows for smooth movement in these areas and will
    deform well when Tater is animated.


