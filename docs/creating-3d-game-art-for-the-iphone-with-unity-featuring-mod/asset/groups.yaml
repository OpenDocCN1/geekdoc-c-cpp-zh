    \ *)application {\n    // Set up the main window\n    [window makeKeyAndVisible];\n\
    \n    // Add the view controller's view to the window and display.\n    // ...\n\
    \n    // Determine if the device is an iPad\n    // ...\n}\n```\n\n图9.30 这里你可以看到一个支持屏幕旋转的简单脚本。\n\
    \n不会发生屏幕旋转。iPhone键盘也被设置为不旋转，因为启用此功能将导致屏幕在黑色遮罩下看似旋转，但实际上显示器并不会旋转。如果你因任何原因需要键盘，只需在使用时启用它，不用时再禁用即可。\n\
    \n## 优化你的游戏\n\n在本节中，我们将探讨一些额外的方法，通过编辑Unity iOS在构建应用程序时生成的Xcode项目来进一步优化我们的游戏。\n\
    \n### 调整主循环性能\n\n你可以设置游戏执行渲染循环的次数。默认情况下，它被设置为30 FPS并以此上限运行。你可以更改此值以不同的帧率渲染，例如60\
    \ FPS。然而，如果你增加该值，渲染将优先于其他活动，如加速度计处理和触摸输入。性能总是有得有失，因此你需要尝试这个值，看看哪种设置对你的游戏最有效。\n\
    \n要更改帧率，你可以选择AppController.mm文件，并将#define kFPS的值改为新的帧率，例如60.0，如图9.31所示。\n\n###\
    \ 调整加速度计处理频率\n\n如果你的游戏大量使用加速度计输入，这可能会对整体性能产生负面影响。默认情况下，Unity iOS会每秒查询加速度计输入60次。你或许能提前获得一些额外的性能提升。“animation”（动画）值表示花费在骨骼动画上的时间，“skinning”（蒙皮）表示将动画应用到蒙皮网格上的时间。如果你看到这些值在增加，就可以按照第5章“优化蒙皮路径”一节中的讨论，优化Skinned\
    \ Mesh Renderer组件上的质量。“batching”（批处理）值显示用于批处理几何体的时间，重要的是要注意动态批处理比静态批处理更昂贵。\n\n\
    ![](img/d3e3fa4010906e98ec76be003a6e31c2_250_0.png)\n\n图9.31 #define kFPS变量将允许你设置所需的帧率。\n\
    \n“mono-scripts”（Mono脚本）值告诉你执行Update和FixedUpdate函数以及协程所花费的时间。最后，“mono-memory”（Mono内存）信息让你了解Mono垃圾回收器使用了多少内存。你可以观察这些值，了解内存是如何分配的，以及垃圾回收器运行了多少次。如果垃圾回收器在游戏运行中途运行，你很可能会看到卡顿或帧率下降。\n\
    \n在本节中，我提到内部剖析器（Internal Profiler）中的值过高。你可能会问：“多高才算过高？”嗯，这个问题没有绝对的答案，因为它完全取决于你的游戏。我所做的是观察“frametime”（帧时间），当它下降时，我会利用剖析器中的其他信息来寻找导致下降的线索。关键不在于知道正确的值，而在于理解这些信息的含义，以便用它来了解你的游戏性能表现如何。我怎么强调都不为过：在开发的所有阶段对你的游戏进行剖析非常重要，而内部剖析器是一个很好的工具。\n\
    \n### 小结\n\n在本章中，我们讨论了如何在Unity iOS中处理游戏资源，包括创建预制件、使用优化着色器、处理碰撞对象以及使用Unity的物理引擎。我们还探讨了创建通用应用程序以及编辑Xcode项目以进一步优化游戏的方法。\n\
    \nUnity iOS为在苹果iDevices上创建游戏提供了独特的体验，作为一名3D艺术家，我可以说它把复杂的游戏开发世界带到了我能理解并轻松操作的层次。好了，这可能是最后一章的结束，但还有更多东西要学。请务必访问本书资源站点上的“Tater的武器配装”，观看本章以及全书所涵盖主题的深入视频演示，例如如何使用内部剖析器。我们那里见！\n\
