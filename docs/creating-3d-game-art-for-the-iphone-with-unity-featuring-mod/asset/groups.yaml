  mdcn: '

    ## 目标设备


    当为 iDevices 开发游戏时，你需要决定游戏将支持哪些设备。iOS 开发的一个优势是，与其他移动平台不同，你需要针对的设备数量相对有限。不过，你仍然需要决定：是支持所有世代的设备，还是只支持那些能让游戏在保持高细节水平、又不必牺牲美术资源质量的前提下达到最佳性能的设备。


    一个可行的解决方案是构建不同分辨率的模型和纹理贴图，供不同设备使用。例如，你可以为 iPhone 4 和 iPad 构建更高分辨率的资源，同时为 iPhone
    3GS 和第三代 iPod Touch 创建较低分辨率的模型。然后在 Unity iOS 中，创建一个附加到启动场景的脚本，检查游戏运行在哪台设备上，再加载针对该设备优化的资源对应的场景。


    就本书的演示项目和我目前正在制作的游戏《Dead Bang》而言，我决定针对性能更高的设备（如 iPhone 4、3GS 和 iPad）来优化资源。我的看法是，在撰写本书时，iPhone
    3G 和第二代 iPod Touch 设备已经落后三代了。我认为不值得再创建一整套较低分辨率的资源来支持那些旧设备。这并不意味着我的内容无法运行，只是可能无法像我希望的那样流畅。归根结底，这取决于项目的范围以及你想实现的目标。


    > **隐蔽的填充率问题**

    >

    > 请记住，你必须始终密切关注 iPad 和 iPhone 4 上的填充率问题。在这些设备上测试并分析游戏，是发现性能问题的唯一可靠方法。


    通过创建一个性能测试场景来测试硬件，并全面了解该硬件的性能和限制，我确定希望将主角 Tater 的顶点数控制在 800 个以下。正如你将在本章后面看到的，我成功将
    Tater 的顶点数控制在 659 个，这远远满足了我为 Tater 设定的顶点预算。目前，Unity iOS 手册指出，你应该以每帧可见约 10k 个顶点为目标；而正如我在第
    1 章“了解 iDevice 硬件与 Unity iOS”中提到的，考虑到驱动 iPhone 4 和 iPad 的硬件，这个目标有些保守。


    目前，Tater 的顶点数与游戏的整体顶点数配合得相当好。那么，现在让我们看看我是如何实现这些目标的。


    ## 确定尺寸


    当把对象从一个 3D 应用程序移到另一个 3D 应用程序时，你不可避免地会遇到尺寸问题；使用 Unity iOS、modo 和 Blender 时也不例外。这不是什么问题，只是你必须理解并设法处理的事情，而首先要定义游戏单位。


    ## 什么是游戏单位


    游戏单位是定义游戏场景中尺寸的一种任意方式。一个游戏单位等于 3D 空间中的 1 个网格方格。在图 2.5 中可以看到，Unity iOS 中的默认立方体游戏对象等于
    1 个网格方格，即宽 1 个单位、高 1 个单位、深 1 个单位。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_44_0.png)


    图 2.5 Unity iOS 中的默认立方体游戏对象为 1 × 1 × 1 个单位。


    一个游戏单位可以代表你想要的任何度量。例如，1 个游戏单位可以是 1 英尺或 1 米。它可以是任何你想要的值，不过在游戏开发中，通常的做法是设定 1 个游戏单位等于
    1 米。原因是，如果你的游戏采用现实世界的度量，物理计算会更容易处理。例如，重力加速度为 9.81 m/s²；如果你想在游戏中模拟它，采用 1 个游戏单位等于
    1 米的缩放比例会更容易。否则，你就必须弄清楚 9.81 m/s² 与你自己设定的场景缩放比例之间如何换算，才能得到相同的结果。因此，在创建我的 Unity
    iOS 项目时，我采用 1 个游戏单位等于 1 米的缩放比例。在 Unity iOS 中，你不必设置偏好或选项；这只是你为项目确定的事情，并在创建和导入对象时使用这个缩放比例。


    ## 不要在 Unity iOS 中设置缩放


    非常重要的一点是，不要在 Unity iOS 中通过对象的 Transform 设置对象缩放。原因是，当在 Transform 上更改缩放时，Unity iOS
    会复制该对象，生成该对象的缩放版本。这会浪费内存资源。务必确保 Unity iOS 中的缩放设置为 1 × 1 × 1，并且任何缩放都在 3D 应用程序中完成，或通过
    FBX Importer Dialog 中的 Scale Factor 设置完成。


    ## 设置 modo


    在内部，modo 始终以米为单位工作，无论你如何在 Preferences 中设置 Accuracy 和 Units。可以这样说：如果 modo 中一个 1
    × 1 × 1 m³ 需要缩放到 0.01，或缩小 100 倍，才能与 Unity iOS 中创建的 1 × 1 × 1 m³ 大小相同，那么 Unity
    iOS 内部一定是以厘米为单位工作的。基于同样的思路，Maya 内部以厘米为单位工作；如果你从 Maya 导出一个 1 × 1 × 1 m³ 到 Unity
    iOS，需要将 Mesh Scale Factor 设为 1，也就是不进行缩放转换，Maya 立方体才会与 Unity 的 1 × 1 × 1 m³ 大小相同，这进一步证明
    Unity 的内部缩放以厘米为单位工作。了解你的 3D 应用程序所使用的内部缩放，以及它与 Unity 内部缩放的关系，你就能判断对象是否需要缩放以及缩放系数是多少。


    归根结底，最佳实践是根据你为项目设置的任意游戏单位来考虑 Unity 的缩放。例如，我将游戏项目设置为 1 个游戏单位等于 1 米。因此在 Unity iOS
    中，1 个网格方格等于 1 个单位。在 modo 中，我创建对象时让 1 个网格方格等于 1 个单位，以匹配项目的游戏单位缩放。然而，这意味着在使用 modo
    和 Unity iOS 时，由于 Unity iOS 与 modo 内部处理缩放的方式不同，你的 modo 网格需要在 Unity 的 Importing
    Assets Settings 中通过 Mesh Scale Factor 缩放 0.01，如图 2.6 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_45_0.png)


    图 2.6 请注意，Mesh Scale Factor 默认值为 0.01，导入的 1 × 1 × 1 Modo 立方体与默认的 1 × 1 × 1 Unity
    iOS 立方体相匹配。


    你可以选择在导出前在 modo 中缩放网格，这样就不必在 Unity iOS 的导入设置中缩放；也可以直接在 Unity iOS 的导入设置中将网格缩放 0.01。我倾向于在
    Unity 的导入设置中缩放 modo 网格，这样我就可以在 modo 中以米为单位工作。这样做，我不必担心在导出前在 modo 中冻结缩放，而且把网格发送到
    Blender 时效果更好，我们将在第 5 章讨论这一点。


    在 modo 的 Preferences 中，我在 Accuracy and Units 下将 Unit System 设置为 Game Units，然后将
    Meters per Game Unit 设置为 1.0。这意味着 modo 中的每个网格方格都是 1 个游戏单位，并代表 1 米，而这也是我认为 Unity
    iOS 单位所等于的值，如图 2.7 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_46_0.png)


    图 2.7 我将 Modo 的 Unit System 设置为每个游戏单位等于 1 米，以匹配我为游戏项目确定的缩放。


    现在，我可以开始在 modo 中按照 1 个游戏单位对应 1 米的缩放比例建模游戏对象。例如，我确定希望 Tater 的身高约为 6 英尺 5 英寸，这大约等于
    1.99 米，如图 2.8 所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_46_1.png)


    图 2.8 现在我的 Modo 单位系统已设置为游戏项目的游戏单位，我可以开始按比例建模游戏对象了。


    ## 导入 Unity iOS


    在 modo 中完成模型后，我需要将它们导入 Unity iOS。我使用 FBX 作为在应用程序之间传输模型的格式，因此需要从 modo 导出 FBX。modo
    的默认 FBX 导出会导出若干 Unity iOS 场景中不需要的项目，例如摄像机、灯光、纹理定位器等。你可以在导出前删除所有非必要项目，也可以在 Unity
    iOS 项目中删除这些额外项目。


    我创建了一个 modo 脚本，用于优化此工作流程。该脚本会扫描你的 modo 场景，移除所有非网格项目，并一键导出干净的 FBX。该脚本还会烘焙网格项目变换上设置的任何动画数据。你可以在本书的资源网站上下载该脚本。从
    modo 导入 FBX 时，你需要在 Unity iOS 的 Import Assets 对话框中设置一些参数。对于导入静态对象或没有动画的对象，只需设置
    Mesh Scale Factor 和 Smoothing Angle。如前所述，对于在 modo 中设置为默认缩放的对象，需要将 Mesh Scale Factor
    设置为 0.01，如图 2.9 所示。


    > **Unity iOS 中的 Transform**

    >

    > 定位器和组等非网格项目会作为 Transform 导入 Unity iOS。对于支持骨骼的 3D 应用程序（如 Blender 和 Maya），骨骼也只会作为
    Transform 导入。Transform 保存对象的位置、旋转和缩放，并且可以像 Unity iOS 中的任何其他对象一样进行操作。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_47_0.png)


    图 2.9 在这里你可以看到设置了 Mesh Scale Factor 为 0.01 的 Tater 模型，以及它与默认 Unity iOS 立方体的关系。

