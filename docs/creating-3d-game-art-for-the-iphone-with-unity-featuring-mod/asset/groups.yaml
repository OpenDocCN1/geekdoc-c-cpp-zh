    ![](img/d3e3fa4010906e98ec76be003a6e31c2_36_0.png)\n\n**图 1.15** 你可以使用 Internal\
    \ Profiler 找出游戏中的瓶颈。\n\n### 渲染预算\n\n接下来，我需要确定在 Unity iOS 处理一帧所需的时间（即帧时间）中，我想把大部分时间花在哪里。例如，我的游戏在物理计算方面用得不多，因此我确定可以把大部分帧时间花在渲染上。\n\
    \n### 顶点预算\n\n为了计算出各个游戏对象的顶点预算，你同样需要思考你正在创建的游戏类型。如果你要创建的游戏场景中需要大量对象，那么就需要减少每个对象的顶点数。正如我之前提到的，你会希望以每帧少于\
    \ 10 K 顶点为基准值，并将这些顶点分配给你认为最重要的游戏对象。例如，你可能想给主角角色分配更多顶点数以提高分辨率，同时减少敌人的顶点数。这个预算取决于你的游戏需求，但你可以看到，如果不了解硬件的限制，就不可能创建出在\
