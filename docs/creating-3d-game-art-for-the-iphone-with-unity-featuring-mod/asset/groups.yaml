    # Texture Compression: PVRTC


    PVRTC will compress a 32-bit file down to either 2- or 4-bits per pixel. As mentioned
    above, in order to use PVRTC in Unity iOS, your texture must be square or POT
    in size. When creating content for the iPhone and iPad, it''s recommended to use
    the PVRTC format since it''s the only format that can remain compressed in memory
    and can be decoded by the GPU from its compressed format. This is important because
    on the iPhone, you have very little memory bandwidth. Textures are often the major
    cause for running out of memory on the iPhone and are even more suspect on the
    iPad. For instance, a 256 × 256 32-bpp (bits per pixel) image with transparency
    will take up 256 KB of memory. However, the same texture compressed with PVRTC
    4 bits will only take 32 KB of memory and PVRTC 2 bits only 16 KB, which is a
    major saving. The quality of the compression is very good, and with PVRTC 4 bits
    and in most cases, the difference is negligible. In Fig. 3.16, you can see the
    difference between a 32-bit and PVRTC 4-bit brick texture.


