    character''s textures and materials relate to batching. In Chapter 5, we''ll discuss
    the VFP-optimized paths for bone weighting and rigging as we setup Tater for animation
    using Blender.


    # ## GPU


    The GPU is the graphics processing unit and handles the rendering of our scene.
    Between the different iPhone models, you''ll find that they all use the same GPU,
    which is the PowerVR SGX535.


    The SGX 535 supports OpenGL ES 2.0. With Unity iOS, iPhone developers can use
    both the 1.1 and 2.0 versions of OpenGL ES. What this means for developers is
    that we can utilize shaders that support a programmable pipeline also, there will
    be no need to convert 1.1 shader to 2.0 every time the device meets a new shader
    in the game. In Fig. 1.3, you can see the clock speed of the SGX 535 GPU and how
    this relates to pixel fill rate and triangle throughput. The fill rate is the
    number of pixels that can be drawn to the screen per second, and throughput is
    the amount of triangles that can be processed per second.


    As you can see in Fig. 1.3, the 3GS GPU can process 7 million triangles per second
    and around 2.5 pixels per second. However, as with the CPU, I''d also like to
    reiterate the fact that although it looks like the SGX is a rendering beast, it
    doesn''t mean you can throw everything but the kitchen sink at it without regard.
    Your game''s performance isn''t entirely dictated by CPU and GPU speeds. For instance,
    RAM and slow Flash memory can also be a bottleneck as well, especially when trying
    to load larger texture sizes such as 1024 × 1024.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_26_0.png)


    **FIG 1.3** The SGX535 Has an Increased Clock Speed, Which Can Allow for More
    Pixels and Triangles to Be Drawn.'
  - '[PAGE 27]


    It all comes down to a balance between the player experience in terms of frame
    rate and game graphics. You will always need to profile for performance to match
    your game budget. Faster hardware is a plus and allows you to do more, but you
    must remember that building for the cutting-edge hardware will inevitably alienate
    a good degree of your potential market due to users with older models.


    # ## Screen Resolutions


    The iPhone 4, 3GS, and iPad all have different screen resolutions, and if you
    want your graphics to look awesome, you''ll need to build to match the resolution
    of each device. For instance, if you build your game graphics based off the screen
    of the 3GS at 480 × 320 and then scale these graphics to the iPad at 1024 × 768,
    then your graphics and textures are going to look pretty ugly as they are scaled
    from the lower resolution to a higher screen resolution. In Fig. 1.4, you can
    see a menu from the book''s demo app and how the menu was adapted for each of
    the screen resolutions across the iDevices.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_27_0.png)


    FIG. 1.4 Here You Can See a Menu at Each of the Supported Resolutions for the
    Different iDevices.


    # ## Fill-Rate Limited


    The 3GS, iPhone 4, and iPad are all using the SGX 535 GPU; however, with the iPhone
    4 and iPad, the GPU has to do more work to draw your game on the higher resolution
    screens. This can cause games that run well on the 3GS to drop in frame rate on
    the iPad and iPhone 4 in certain conditions. In Fig. 1.5, you can see the differences
    in resolution and how this relates to the GPU having to work harder on the iPhone
    4 and iPad as it renders 4–5.1 times the screen real estate.


    The fill rate is the number of pixels the GPU can render to the screen per second.
    With the iPhone 4 and iPad, you can experience a drop in frame rate when a transparent
    surface fills the screen. This is because on the iPhone 4 and iPad,'
