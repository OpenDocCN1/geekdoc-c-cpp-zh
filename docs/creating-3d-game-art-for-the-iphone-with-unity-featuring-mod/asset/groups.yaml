    Choosing Switch Direction (Alt + F) from the Specials menu, so that I could use
    the bone to raise the heel. In Fig. 6.13, you can see the Foot Bone with the correct
    orientation. Notice that the rotation pivot of the Foot Bone is located at the
    toes so that the heel can be raised.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_146_0.png)


    **FIG 6.13** Notice that since the pivot was switched for the bone, the heel can
    now be raised.


    Next, the IK_Foot.L Bone is parented to the Foot.L Bone as shown in Fig. 6.14.
    Then, both the Foot.L and Toe.L Bones are parented to the CNTRL_Foot.L Bone as
    shown in Fig. 6.14.


    As you can see, the rig isn''t overly complicated, but it gets the job done. It
    helps to figure out your rig concept beforehand. For instance, think about your
    game and your character''s style and decide what type of animations will be needed.
    From there, you can sketch out some basic ideas of the range of motion your rig
    will need to allow.


    Next up, I needed to apply the IK Constraint on the Bone Constraints menu. As
    you can see in Fig. 6.15, the target is my Armature called Tater_Skeleton and
    the Bone Target is the IK_Foot.L Bone that was created in Fig. 6.12.


    **FIG. 6.14** Notice that the IK_Foot.L Bone is parented to the Foot.L Bone.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_147_0.png)


    **FIG. 6.15** Here you can see the IK Constraint and its settings.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_147_1.png)


    I also set the Chain Length to a value of 2, which essentially terminates the
    IK Chain at the Thigh Bone, as shown in Fig. 6.16.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_148_0.png)


    **FIG 6.16** A Chain Length setting of 2 terminates the chain at the Thigh Bone.


    In order to add some extra control to the knee, I set a Pole Target on the IK
    Constraint for the leg. The Pole Target is the same as a Pole Vector Constraint
    in Maya. It allows you to rotate the IK Chain and thus give you control for rotating
    or pointing the knee. I added a new bone called CNTRL_Knee.L in the knee position
    and set the Pole Target on the IK Constraint to this bone as shown in Fig. 6.17.


    The CNTRL_Knee.L bone is then parented to the CNTRL_Foot.L Bone so that as the
    leg is moved, the knee controller will move with it, which will also automatically
    point the knee as the CNTRL_Foot.L is rotated. In Fig. 6.18, you can see this
    basic control setup for the legs in action.


    **FIG 6.17** Here you can see the position of the Pole Target for the knee.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_149_0.png)


    **FIG 6.18** In this image, you can see the basic controls working.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_149_1.png)


    > *Don''t forget to mark controller bones to not deform the mesh by disabling
    their Deform property.*


    It''s important to note that the CNTRL_Foot.L, CNTRL_Knee.L, and IK_Foot.L bones
    all have had their Deform option disabled. As we discussed in Chapter 5, this
    essentially removes their influence from the mesh. The purpose of these bones
    is strictly to control the bones in the rig that influence the mesh. In order
    to keep the skeleton optimized, you need to be sure that only the bones directly
    responsible for deforming the mesh are influencing the mesh vertices, and disabling
    the Deform property for a bone is the easiest way of doing this.


    Now that we''ve explored the leg controllers, let''s take a look at the arms.


    ## Setting Up IK for Arms


    The arm setup is a bit less complicated than the legs. First, I need to add a
    bone for the IK target. This was done by simply duplicating the Hand.L Bone using
    Shift + D to place the new bone in the same position as the Hand.L Bone, and renaming
    it to IK_Hand.L as shown in Fig. 6.19.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_150_0.png)


    **FIG 6.19** The IK target for the Hand.L.


    Next, I set up the actual IK Constraint on the Forearm.L Bone with the IK_Hand.L
    Bone set as the Bone Target. The Chain Length was set to 2 so that the IK Chain
    would be terminated at the Bicep.L Bone. You can see the settings for the Forearm.L
    IK Constraint in Fig. 6.20.


    Just as with the knee, I also created a control for the elbow so that I could
    rotate it. Building in an elbow control is usually a must have in every rig as
    it allows you to have greater control over the arm. In Fig. 6.21, you can see
    the elbow control.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_151_0.png)


    **FIG 6.20** Here you can see the settings for the IK Constraint. Notice that
    the Chain Length is set to 2.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_151_1.png)


    **FIG 6.21** Here you can see the location for the elbow control bone.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_153_0.png)


    **FIG 6.23** The Hand.L Bone has a Copy Rotation Constraint that targets the IK
    controller bone.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_153_1.png)


    **FIG 6.24** The IK_Hand Bone controls both position of the arm and rotation of
    the hand.


    The Inherit Rotation setting in the Bone Properties. However, after messing with
    the completed rig, I decided that it would be best if the Clavicle Bones did inherit
    the rotations for the Chest Bone. I also decided that the Head and Spine Bones
    should also inherit rotations. That''s just a part of rigging, and it''s important
    to thoroughly test your rig because once you start putting it through the paces,
    you inevitably find areas where you''ll need to make changes.


    ## Creating a Master Control


    Again, once the final rig was completed, I created one last bone that would be
    used as a root in which all of the bones and controls would fall under. The purpose
    of this bone is that it allows me to move or rotate the character as a whole.
    In Fig. 6.26, you can see the Master control. The Pelvis, CNTRL_Foot.L, and CNTRL_Foot.R
    Bones are parented to the Master control.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_155_0.png)


    **FIG. 6.26** The Master Control is the root of the entire rig and can be used
    to move Tater as a whole.


    ## Using Bone Layers


    Blender has a nice layer system, and you can place bones on different layers within
    the Armature. This is good because it allows you to place all of the controls
    that will be keyframed on one layer and the bones that won''t be keyframed on
    another. This really helps to keep the view clutter-free and much easier to select
    controls for keyframing. In Fig. 6.27, you can see that all of the controller
    bones are located in the first Bone Layer. This makes it very easy to quickly
    select all of the bones by pressing the A key and setting a keyframe using the
    I key or clearing pose rotation (Alt + R) and pose location (Alt + G). Again,
    the easier you can make it on yourself, the more productive you''ll be. Articulating
    and keyframing your character should be easy and intuitive. You shouldn''t have
    to fight your rig to get work done.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_156_0.png)


    **FIG. 6.27:** Bone Layer 1 is on the left and holds all of the bones that are
    controllers and will be keyframed. Bone Layer 2 is on the right and is essentially
    hidden, as those bones will never be keyframed.


    ## Tweaking Weight Maps


    Just as with the "Fixing Rotations" section above, I also found that once I started
    testing the completed rig, I needed to also tweak the weight maps to improve the
    deformations on the model. Being a very low-resolution mesh, the Tater model just
    doesn''t have enough edge loops in areas such as in the thighs to provide clean
    deformations. You''ll find that with game characters, especially targeted for
    mobile platforms such as the iPhone, the lack of polygons can cause some issues
    when animating your models. This is another reason it''s so important to plan
    your model''s polygon budget carefully so that you can be sure to place important
    resolution in areas of the mesh that will deform the most.


    > It''s important to plan your model''s polygon budget carefully so that you can
    be sure to place important resolution in areas of the mesh that will deform the
    most.

