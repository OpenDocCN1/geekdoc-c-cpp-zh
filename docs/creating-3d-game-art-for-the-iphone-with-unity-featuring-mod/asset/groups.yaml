    ## 了解 iDevice 硬件与 Unity iOS


    创建游戏资产背后的技术理解，比仅仅建模低分辨率几何体要深入得多。在进入实际建模或创建纹理贴图之前，我们首先需要扎实理解内容将要运行的硬件和游戏引擎。每个平台或设备都会有其自身的限制，某个平台运行良好的内容，并不意味着在另一个平台上也能同样良好地运行。例如，在某些情况下，iPhone
    4 或 iPad 中更快的处理器相比 iPhone 3GS 中较慢的处理器，可能更有助于处理绘制调用。另一个很好的例子是，尽管 iPad 的芯片性能提升了
    400 MHz，但 GPU 没有升级，这带来了需要留意的新的性能瓶颈。这时项目的“游戏预算”就派上用场了。游戏预算就是创建游戏内容所依据的蓝图或指南。在评估
    iPhone 和 iPad 硬件时，需要留意三项规格，即内存带宽、多边形速率和像素填充率。例如，如果你有一个快节奏的游戏概念，就需要在游戏预算中标明较高的帧率，例如
    30–60 帧/秒（fps），并且你创建的所有内容都必须经过优化，使游戏能够达到这一帧率预算。你还需要考虑到，在 iPad 上，你本质上是在渲染的像素数量超过
    iPhone 3GS 的五倍，约为 iPhone 4 屏幕的 1.2 倍，这意味着每帧处理的数据量分别约为 iPhone 3GS 的 5 倍和 iPhone
    4 的 1.2 倍。如果对目标设备的能力和限制没有扎实理解，你就不知道需要对游戏内容做哪些优化才能达到游戏预算的帧率。本质上，这就像在黑暗中工作。


    本章的目标，打个比方，就是点亮灯光：让你熟悉 iPhone 和 iPad 硬件，并一窥 Unity iOS 游戏引擎的内部机制。通过熟悉不同设备以及 Unity
    iOS 底层运行情况，我们就能理解针对这些设备构建优化内容的“原因”。我们还能够在整体游戏预算中合理定义帧率、多边形数量和纹理尺寸预算；这些预算由你所创建的游戏类型与目标帧率之间的平衡决定，而最终都受硬件的内存带宽、多边形速率和像素填充率控制。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_21_0.png)


    ### iDevice 硬件


    在本节中，我们将讨论 iPhone 和 iPad 的硬件；在这里，我想对设备型号作几点区分。在本书中，我会用“iDevices”一词统称所有设备，即 iPhone、iPad
    和 iPod Touch。“iOS”是苹果对所有 iDevice 通用操作系统（OS）的官方名称。我还想补充一点：本书不会涵盖 iPhone 3G 或第二代及以下的
    iPod Touch。截至本书写作时，这些设备属于第二代和第三代设备，而我想把重点放在最新设备上。我会把本节分为两类，即 ARM 中央处理器（CPU）和 PowerVR
    SGX 图形处理器（GPU）。在介绍 iDevice 硬件的同时，我们也会讨论这些类别与 Unity iOS 的关系。


    ### ARM CPU


    CPU 是处理单元，iDevices 采用 ARM 架构，使用 Cortex-A8 核心，版本为 ARMv7-A；从美术师的角度来看，CPU 负责计算。在图
    1.1 中，你可以看到各 iDevice 的硬件差异明细。每种 iDevice 型号都包含不同或更新的硬件，这些硬件会影响游戏性能，例如硬件如何影响像素填充率。


    iPad 和 iPhone 4 都使用 A4 处理器。iPhone 3GS 和第三代 iPod Touch 都使用被降频至 600 MHz 的 ARM Cortex-A8。就这三款设备的性能而言，可以给出一个基本规律：iPad
    的处理速度最快，其次是 iPhone 4（因为 A4 被降频），最后是 3GS，但 3GS 的差距一点也不大。再次强调，这是一个非常基本的规律；实际结果很大程度上取决于你的内容，即像素填充率和多边形吞吐量如何影响游戏。在目标设备上用你的具体内容对游戏进行性能分析（profiling），是衡量性能最安全、最准确的方法，不过在开发早期对设备能力有总体认识也会很有帮助。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_22_0.png)


    > 特别说明一点：某个人可能更偏向游戏开发的美术方向，但这并不意味着他应该远离代码，也绝不意味着美术师无法理解技术层面的内容。事实上，在独立游戏开发中，很可能你不仅要构建
    3D 内容，还要为游戏编写代码。我经常看到出色的脚本和程序是由优秀的美术师而不是硬核程序员编写的。这里的重点是，脚本编写有时会带有一种令人畏惧的负面含义，而我要说，这与事实相差甚远。你不亲自尝试一下，就永远不知道自己能做到什么。


    CPU 会从许多方面影响由 Unity iOS 驱动的游戏。例如，CPU 还会处理脚本和物理计算，并承载整个操作系统及其他正在运行的程序。由于本书讨论的是创建游戏美术，接下来的小节将聚焦于我们游戏对象上的游戏美术内容，以及在这些方面哪些操作对
    CPU 很重要。


    ### 绘制调用


    绘制调用可以看作向 GPU 发出的“请求”，用于绘制场景中的对象；它也可能是 CPU 造成性能瓶颈的环节。正如我们将在 GPU 部分讨论的，iPhone 和
    iPad 使用 OpenGL ES 2.0（OGLES），在硬件层面模拟 OGLES 1.1 着色器；在这种实现下，游戏循环的每一帧中，每次绘制调用都会复制顶点数据。顶点数据是构成我们
    3D 对象的顶点，以及附加到每个顶点上的信息，例如位置、法线和 UV 数据，就像 modo 中 3D 网格的顶点具有位置、法线和 UV 坐标数据一样。


    ### 游戏循环


    Unity iOS 游戏循环内部，正是更新游戏各个组件的地方。无论用户是否输入，游戏循环始终运行。从 3D 美术师的角度，你可以把游戏循环想象成 3D 动画中的一段动画：场景以给定帧率运行，而在动画的每一帧中都会计算某些内容，例如关键帧插值。游戏引擎的游戏循环基本上也在做同样的事情。


    顶点数据在 CPU 上于 3D 空间中被变换或移动。变换的结果会追加到内部顶点缓冲区中。这个顶点缓冲区就像一个大列表或容器，保存所有顶点数据。由于顶点数据是在
    CPU 上复制的，这会占用 CPU 端约三分之一的帧时间，并且由于 iPhone 的 CPU 与 GPU 共享内存，这还会浪费内存带宽。在 iPhone 和
    iPad 上，我们需要密切关注对象的顶点数，并尽可能保持该数值较低，因为顶点数比实际三角形数更重要。正如你将在第 2 章读到的，我们会讨论如何确定每一帧最多可以渲染多少个顶点。


    我以前会对这句话中“每帧”这部分感到困惑。作为一名 3D 美术师，把游戏场景想象成 modo 中的一个场景对我很有帮助。例如，如果我在 modo 中设置了一段动画，渲染摄像机在动画的每一帧中都会渲染该场景中摄像机视锥体内可见的部分，视锥体由摄像机属性设定。Unity
    iOS 中也是如此。在图 1.2 中，有一幅插图展示了我如何将场景每帧的总顶点数可视化。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_23_0.png)


    **图 1.2** 在此图中，黄色高亮区域表示摄像机的视锥体以及每帧可见的顶点。


