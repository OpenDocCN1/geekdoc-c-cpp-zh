    So, we’ve talked about style, and in this section, we’ll start to really address
    the design of the level in terms of optimization. It’s always a good idea to break
    your level down into sections as shown in Fig. 4.3.


    There are several advantages to breaking the level geometry down into sections,
    which I’ve organized into three categories: Puzzle Building, Lazy Loading, and
    Optimize Batching.


    ### Puzzle Building


    Breaking the level design into sections gives us the opportunity to create seamless
    tiles or puzzle-like pieces of geometry that can be used to build a level in any
    number of configurations as shown in Fig. 4.4.


