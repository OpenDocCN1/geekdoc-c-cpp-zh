    ## Beast 光照贴图


    Beast 是一个内容管线工具，能够烘焙高级全局光照和光照效果。Beast 已被用于多款 AAA 游戏，现在已集成到 Unity iOS 中。作为一名 3D
    艺术家，我绝对可以说 Beast 是一个了不起的工具，为你的内容光照贴图提供了最佳工作流程。在图 8.3 中，你可以看到我们使用 Beast 生成光照贴图的关卡。由于光照贴图已完全集成到
    Unity iOS 中，我可以将包含木桶和木板的道具预制体分布到整个关卡中，并让阴影投射到场景中，同时还有环境光遮蔽，如图 8.4 所示。这极大地改进了工作流程，更不用说质量提升了。由于环境道具在
    Unity iOS 中分布在整个关卡中，使用 Beast 可以让道具的光影与关卡正确交互。在接下来的几节中，我们将讨论使用 Beast 的关键方面。让我们先快速了解一下
    Beast 和 HDR。


    > **Tater 的武器配置**

    >

    > 前往资源网站查看本章的视频操作演示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_208_0.png)


    **图 8.3** 使用 Beast 为关卡进行光照贴图。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_210_0.png)


    **图 8.5** 没有 UV 重叠


    你还需要确保 UV 的相对大小彼此成比例。例如，在图 8.6 中，你可以看到贴图上半部分出现阶梯状锯齿，因为 UV 没有按相同比例缩放，因此一半光照贴图获得的分辨率比另一半更多。图像的第一部分显示了由于
    UV 比例不协调而导致的低分辨率问题。第二部分显示了光照贴图分辨率在整个贴图上的分布情况。注意下半部分分配了多得多的分辨率。第三部分显示了在 modo 中创建的实际
    UV 贴图。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_210_1.png)


    **图 8.6** 此图展示了 UV 比例不协调时明显的低分辨率问题。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_211_0.png)


    **图 8.7** “生成光照贴图 UV”将自动展开你的网格，并创建用于光照贴图的第二套 UV


    ### 自动生成 UV


    我们已经讨论了为光照贴图对象创建合适 UV 的重要性；不过，你可以选择在导入时通过 FBX 导入器设置自动生成 UV，如图 8.7 所示。这可以节省大量时间，因为你不必再担心在
    3D 程序中为光照贴图创建第二套 UV。如果你已经有第二套 UV，那么 Beast 将在光照贴图过程中使用它。


    如图 8.7 所示，高级设置用于控制展开过程，以尽量减少我们在本章前面“正确光照贴图 UV”一节中讨论的失真。例如，“面积误差”（Area Error）有助于确保
    UV 与实际网格几何体之间的比例彼此保持协调，如图 8.5 所示。


    ### 流程


    在 Unity iOS 中，光照贴图的过程非常直接。首先，要进行光照贴图的对象必须标记为 Static（静态），这也使它们可用于静态批处理，如图 8.8 所示。

