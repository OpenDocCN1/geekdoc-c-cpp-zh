    ### 创建头发


    Tater是个毛发浓密的家伙，绘制头发是一个极其简单却有趣的过程。在Photoshop中，我创建了一个自定义头发画笔，然后开始用这个自定义画笔绘制来逐步构建头发。为了创建这个画笔，我从112
    Brush Preset开始。接下来，我增大了Size Jitter、Angle Jitter，并在Shape Dynamics菜单中勾选了Flip X和Flip
    Y Jitter设置。最后，我增大了Scattering菜单中的Scatter、Count和Count Jitter。在图3.26中，你可以看到用于创建该画笔的设置。画笔创建好后，剩下的就只是把它画到头发上。我会频繁更改Scatter和Jitter设置，以在头发中营造随机感和变化感。


    ### 添加一些磨损与破损


    最终纹理完成后，我将纹理加载到modo中，并使用modo的3D绘画工具在Photoshop中创建的Tater纹理上绘制污垢。我的Tater角色有点脏、有点粗糙，而在纹理上添加一些污垢不仅能增加个性，还能在UV接缝上绘制污垢，使纹理看起来更无缝。在modo中，我使用Airbrush工具配合Procedural
    Brush来绘制污垢。我从深棕色和非常低的不透明度设置开始，如图3.27所示。


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_82_0.png)


