    \    //Enable shoot\n    shoot.enabled = true;\n\n}\n```\n\n**图 7.17** 将 shoot\
    \ 变量的 blendMode 设置为叠加。\n\n```javascript\nprivate var shoot : AnimationState;\n\
    \nfunction Start()\n{\n    animation.Play(\"run\");\n\n    //Set the Shoot Clip\n\
    \    shoot = animation[\"shoot\"];\n    //Place the Shoot Clip on layer above\
    \ run clip\n    shoot.layer = 1;\n    //Set the blend mode to additive\n    shoot.blendMode\
    \ = AnimationBlendMode.Additive;\n    //Enable shoot\n    shoot.enabled = true;\n\
