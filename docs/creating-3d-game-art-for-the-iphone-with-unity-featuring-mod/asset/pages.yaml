    The goal of this chapter is to turn the lights on so to speak by familiarizing
    you with the iPhone and iPad hardware as well as take a look under the hood of
    the Unity iOS game engine. By familiarizing ourselves with the different devices
    and what’s going on under the hood of Unity iOS, we can then understand the “why”
    behind building optimized content for these devices. We will also be able to properly
    define the frame rate, poly-count, and texture size budgets in our overall game
    budget, which is determined by a balance of the type of game you’re creating and
    the targeted frame rate, all of which is ultimately controlled by the hardware’s
    memory bandwidth, polygon rate, and pixel fill rate.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_21_0.png)


    # iDevice Hardware


    In this section, we’re going to discuss the hardware for the iPhone and iPad,
    and at this point, I’d like to make a couple of distinctions between the device
    models. Throughout the book, I will refer to the term “iDevices” to encompass
    all of the devices, i.e., iPhone, iPad, and iPod Touch. The term “iOS” is Apple’s
    official name for the OS or operating system common to all of the iDevices. I’d
    also like to add that this book will not be covering the iPhone 3G or the iPod
    Touch second generation and below. As of the writing of this book, these devices
    are second- and third-generation devices, and I wanted to concentrate on the most
    current devices. I’ll break this section into two categories, which are the ARM
    central processing unit (CPU) and PowerVR SGX graphics processing unit (GPU).
    As we cover the iDevice hardware, we’ll also discuss how these categories relate
    to Unity iOS.


    # ARM CPU


    The CPU is the processing unit, and the iDevices use the ARM architecture with
    the Cortex-A8 core at version ARMv7-A, and from an artist’s perspective, the CPU
    handles calculations. In Fig. 1.1, you can see a breakdown of the hardware differences
    in each of the iDevices. Each model of the iDevices contains different or updated
    hardware that can affect your game’s performance such as how the hardware affects
    pixel fill rate.


    Both the iPad and the iPhone 4A processor. The iPhone 3GS and iPod Touch third
    generation both use an ARM Cortex-A8 that has been under-clocked to 600 MHz. As
    far as performance goes across these three'
