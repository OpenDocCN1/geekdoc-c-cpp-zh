    # ## Using Texture Atlas


    Using texture atlases in your projects are a great way to increase texture optimizations
    and keep artwork consistent across multiple objects. In Fig. 4.10, you can see
    the texture atlas that was built for Tater''s Trash Yard level.


    Texture memory is vital on the iPad and iPhone 3GS and can often be the main culprit
    behind low performance and crashes. With the iPhone 4, you have double the amount
    of memory at 512 MB, but you still need to keep your texture usage as optimized
    and efficient as possible. This is where the usage of a texture atlas comes into
    play. A texture atlas is a single image that acts as a container, which houses
    the coordinates for several smaller image sections through which multiple objects
    can target.


    The result is that several objects can use the same texture and thus minimize
    the number of textures that need to be loaded in your scene. By using a texture
    atlas, you fit the textures for the entire level into one image map. This can
    dramatically increase the performance of your game by using less memory for textures.
    In Fig. 4.11, you can see how the objects in my level target the different areas
    on the texture atlas.'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_96_0.png)


    Any empty space in your texture atlas is a missed opportunity for adding detail
    in your game.


    **FIG 4.11** This Image Shows the Relation Between the Level Texture Atlas and
    the Actual Models.


    Using a texture atlas is best utilized when “Building on the Grid,” as we’ll discuss
    in the next section. Building your textures on a grid allows you to optimize the
    atlas so that it’s as efficient as possible, utilizing every single pixel in the
    image. The main thing to remember with texture atlases is that any empty space
    in your atlas is a missed opportunity for adding detail in your game. The image
    is going to be loaded in your game so you might as well make sure that every pixel
    counts.


    # ## Building on the Grid


    Building on the grid is a technique common to level creation in games. It’s the
    process of building your objects into tiles or puzzle-like pieces so that they
    can be snapped together in a seamless fashion to build a level. The grid comes
    into play as the tiles are built on a grid-based or predetermined sizes such as
    256 × 256 or 512 × 512 as shown in Fig. 4.12.


    Building on the grid is very efficient for building levels. Let’s take a look
    at three important reasons. First, you get a consistent texel density as the mesh
    size in 3D space matches the texture on the grid in pixels. For instance, in my
    level, you can see that the ground mesh is created from tiles that are 512 × 512
    units, and these mesh tiles directly relate to a portion of the texture atlas
    that is also 512 × 512 in pixels as shown in Fig. 4.13. I’ll also note that this
    portion of the texture atlas that represents the ground occupies 512 × 512 pixels
    of the 1024 × 1024 pixel image. The ground portion is seamless on'
  merge: -1
