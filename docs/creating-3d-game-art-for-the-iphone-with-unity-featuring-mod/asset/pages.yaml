- pgno: 76
  md: 'The texture budget determined? Well, just as we discussed with the vertex budget,
    there isn’t a magical formula or secret trick. It all comes down to the type of
    game you want to create and the device you want to deploy it to. However, the
    best solution is to again, create a performance test scene that you can use to
    work out the texture budget and use the Internal Profiler to check your game’s
    performance. Using the Internal Profiler, you can monitor the amount of memory
    your game objects are consuming and thus gain an adequate representation of the
    system resources your game objects and textures are utilizing.


    In this section, we discussed the fundamentals of creating game textures. By understanding
    the iDevice hardware and how the GPU is rendering textures, you will be able to
    properly gauge how textures can affect performance and thus know which steps to
    take to optimize your graphic elements.


    # Creating the Diffuse Map


    In this section, we’ll take a look at how I created the diffuse map for Tater.
    Due to the constraints of the iDevice hardware, I am only using a diffuse map
    to texture my game objects. The goal is to use the least amount of textures as
    possible. Running low on memory can cause the OS to terminate your app, so it’s
    important to always be aware of how much of memory your game objects are utilizing.
    For example, instead of using a lightmap shader that combines a diffuse and lightmap
    texture, I opt to bake all of the lighting information into a single diffuse texture.
    Combining these textures in Photoshop is a simple method for cutting down on the
    amount of textures loaded to my scene.


    # Faking Light and Shadow


    Because we need to build low-resolution meshes for the iPhone and iPad, we’ll
    convey surface detail via textures. Since I’m not using any lights in my scene
    to improve performance, I will typically add subtle lighting cues into the textures.
    For example, you can utilize normal, bump, and specular maps to create surface
    detail, which can then be baked down into the diffuse map. This will give the
    illusion of light and shadow, without the overhead of using actual lights in your
    Unity iOS scene. Granted, this is an illusion and isn’t going to give the same
    effect as using dynamic lighting. For instance, if your character is moving around
    a wall, the specular hits won’t change nor will the bump since lights are not
    actually creating these effects. However, it’s still a good way to add detail
    to your texture while keeping the overhead down. In Fig. 3.19, you can see two
    brick wall game objects as they are rendered in Unity’s Game View as well as the
    modo scene used to create the bump texture. Notice that the brick wall object
    on the left looks much more detailed using the texture map with the bump and specular
    effect baked in. Adding baked lighting cues, and surface detail to your textures
    can go a long way to giving your work that creative edge.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_77_0.png)


    FIG 3.19 By Baking the Surface Detail into the Texture Map, You Can Get Nice Lighting
    and Surface Effects without Having to Use Lighting or Complex Shaders.


    # ### Unity iOS OpenGL ES 2.0 Shaders


    The usage of normal maps on the iDevices is not a good idea unless you absolutely
    need it. The GPU is just not fast enough to cope with it. For the iPad and iPhone
    4, it''s even worse because of the much higher screen resolution. Baking is always
    faster on any platform.


    OpenGL ES is better for image postprocessing filters, but again, you need to be
    extra careful not to kill your performance with them. It is a little bit easier
    to write shaders in CG/GLSL (shader language) comparing with texture combiners
    of GLES1.1, but you would pay a performance hit for that as well. You could potentially
    render things like custom lighting, but again, you''re going to pay in performance
    for that too. Essentially, you really need to know what you''re doing in terms
    of shader code to use OGLES 2 efficiently. Bump maps overall require complex two
    or three pass shaders and may be too heavy for iPhone and iPad. With Unity iOS,
    it''s strongly advised to use OGLES 1.1 until OGLES 2 is really necessary. As
    of the writing of this book, OGLES 2 is slow and somewhat buggy. Again, baking
    all you can into textures and using simple shaders are the best possible approach
    when working with the iPhone and iPad.


    # ### Texturing Tater


    In Fig. 3.20, you can see the diffuse map that was created for Tater. In this
    figure, you are only seeing the color information. In Chapter 8, "Creating Lightmaps
    Using Beast," I will discuss the creation of the lightmap for Tater using Beast
    within Unity iOS. For now, we''ll just focus on the diffuse map.'
