  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_174_0.png)


    # # Animation Using Blender


    # ## Advanced Animation


    In Chapter 6, we completed the rig for Tater and talked about creating cyclic
    animations, i.e., a run or walk cycle. In this chapter, we’re going to take a
    look at some advanced topics such as working with Blender’s Nonlinear Action Editor
    (NLA) to create Actions that can be used in conjunction with Animation Layers
    and Additive-Blending in Unity iOS. We’re also going to discuss how you can utilize
    Blender’s Bullet Physics Engine to procedurally animate a game object.


    This chapter will further build upon the animation concepts covered in the previous
    two chapters. The goal of this chapter is to give you the understanding of how
    to create your animations in your 3D application and how you can use Unity’s Animation
    System to control these animations. We’re not going to enter into the advanced
    scripting mechanics of the animations per se, but instead focus on how you need
    to create your animations so they can be used correctly within Unity iOS.


    Let’s get started by taking a look at the Unity’s Animation System.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# # Unity''s Animation System


    # ## Tater''s Weapon Load Out


    Go to the resource site to view the video walk-through for this chapter.


    Unity iOS has a very robust animation system. It allows you to blend, mix, and
    add animations, as well as syncing and controlling animation playback via time,
    speed, and blend weights.


    > > Unity iOS has a very robust animation system. It allows you to blend, mix,
    and add animations, as well as syncing and controlling animation playback via
    time, speed, and blend weights.


    In Chapter 6, we discussed using the Blender''s Action Editor to create separate
    animations that can be exported to multiple FBX files. Throughout your game, you
    will need to play these various animation clips during various states of the game
    play such as when a character is running, walking, or shooting. Now, it wouldn''t
    look too nice if these animations were abruptly changing from one clip to the
    next. That is why Unity iOS supports animation blending.


    In Unity iOS, you can have any number of animations playing on the character and
    all these animations will be blended together to produce the final animation.
    It''s exactly the same concept as using Blender''s NLA as shown in Fig. 7.1 to
    layer Actions together to produce a complex animation sequence.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_175_0.png)


    FIG 7.1 Blender''s NLA Editor Allows You to Create Transitions between Animations
    and Scale and Blend Clips.


    With Unity iOS, Animation System, you can smoothly transition from one animation
    clip to another. It''s important to understand these capabilities of the Animation
    System so that you can build your Actions in Blender accordingly. There are basically
    two routes you can use in animating your character.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Route 1


    Route 1 is to create each animation separately. For instance, let’s say your character
    will need to be able to perform a run, walk, and a shooting action. What I mean
    by creating each animation separately in this case is that you’ll not only need
    to create the run and walk actions but you also have to create a walk-shoot and
    run-shoot action. While you’re at it, you’ll also need an idle animation, which
    means you then have to create an idle-shoot animation as well. So, in order to
    adequately produce the three actions, that is, walk, run, and idle with a shooting
    action, you’ll also need to create another set of these animations containing
    the shooting action as well. This brings you to a total of six animations you’ll
    need to create for only three actions the character will be performing as shown
    in the diagram in Fig. 7.2.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_176_0.png)


    FIG 7.2 This Image Shows How Three Actions Can Mean Creating Six Separate Animations.


    As you can see, even with a simple character with three actions plus shooting,
    you are already doubling the amount of work in terms of animation. Animation is
    fun, but it’s not that fun. The solution to this issue can be found by heading
    down route two.


    # Route 2


    In this route, you will only need to create the three actions plus the shooting
    action that your character needs to perform. The reason being is that you can
    take the shoot animation and additively blend that action with another such as
    the run animation as shown in Fig. 7.3.


    As stated earlier, the blending of animations can be done within Unity’s Animation
    System. You can set the blendMode using the AnimationState Interface. In Fig.
    7.4, you can see the AnimationState has a variable for setting the blendMode.
    We will discuss this in depth in moment. For now, just know that the blending
    will take place at run time.'
  merge: -1
  img_proc: true
