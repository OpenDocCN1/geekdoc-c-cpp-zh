- pgno: 47
  md: '# # Importing into Unity iOS


    Once I’ve completed my models in modo, I’ll need to import them into Unity iOS.
    I use FBX as the format for transferring my models between applications, and I’ll
    need to export FBX from modo. The default FBX export from modo will export several
    items that aren’t needed in your Unity iOS scene such as cameras, lights, texture
    locators, and so on. You can delete either all the nonessential items before export
    or these extra items in your Unity iOS project.


    I created a modo script for optimizing this workflow. The script will scan through
    your modo scene and remove all nonmesh items and export a clean FBX with one click.
    The script will also bake any animation data that is set on the transforms for
    your mesh items. You can download the script on the book’s resource site. When
    importing the FBX from modo, you’ll need to set some parameters in the Import
    Assets dialog within Unity iOS. For importing static objects or objects without
    animation, you only need to set the Mesh Scale Factor and the Smoothing Angle.
    As mentioned earlier, you’ll need to set the Mesh Scale Factor to 0.01 for working
    with objects that are set to working with the default scale in modo as shown in
    Fig. 2.9.


    > > **Unity iOS Transforms**

    > >

    > > Nonmesh items such as Locators and Groups are imported into Unity iOS as a
    Transform. In the case of a 3D application that supports bones such as Blender
    and Maya, bones are also imported simply as a Transform. A Transform holds the
    position, rotation, and scale of an object and can be manipulated the same as
    any other object in Unity iOS.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_47_0.png)


    FIG 2.9 Here You Can See the Tater Model Set with a Mesh Scale Factor of 0.01
    and How It Relates to a Default Unity iOS Cube.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'There are other settings in the Import Assets that we''ll discuss later. The
    Automatically calculate normals option and the Smoothing Angle parameter are very
    important at this stage in bringing our modo objects into Unity iOS as these settings
    directly affect your vertex count and we''ll discuss this next.


    # ## True Vertex Count


    We''ve previously discussed how important vertex count is, so it''s vital to note
    that you can''t regard the vertex count in your 3D program as the true number
    of vertices in your object. In order to get the true vertex count for your mesh,
    you''ll need to import your object into Unity iOS and check the Rendering Statistics
    window in the Game View as shown in Fig. 2.10. Be aware, that Unity''s Rendering
    Statistics window shows the resulting number of vertices sent to the GPU, which
    includes those added by lights and complex shaders.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_48_0.png)


    There are several factors that cause the vertex count for your mesh to increase
    as it''s rendered by the GPU. As a 3D artist creating game content, the concept
    that you can''t trust the vertex count in your 3D application may seem foreign,
    but as you will see, you''ve already been dealing with these same factors in your
    everyday 3D work. Let''s begin, by introducing the concept of triangle strips
    and degenerate triangles, which are the culprit behind our increased vertex count.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# ### Degenerate Triangles


    Unity iOS tries to display your mesh efficiently as possible using triangle strips.
    A triangle strip is a series of connecting triangles, sharing vertices as shown
    in Fig. 2.11. This allows for faster rendering and efficient memory usage.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_49_0.png)


    **FIG 2.11** A Triangle Strip Is the Most Efficient Way of Describing a Mesh.


    However, to effectively do this, Unity iOS must create what is called degenerate
    triangles or what is referred to as zero-angle triangles at points of various
    discontinuities such as mesh seams and UV borders. A degenerate triangle is formed
    by three collinear points or points that lay on the same line. It looks more like
    a line segment as shown in Fig. 2.12. The performance impact of these triangles
    can really add up on the GPU. In the next two subsections, we''ll take an in-depth
    look at discontinuities that create degenerate triangles.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_49_1.png)


    **FIG 2.12** A Degenerate Triangle Looks Like a Line Segment and Causes an Increased
    Vertex Count in Unity iOS.


    # ### Smoothing Angles


    In modo, you can adjust the smoothing of polygons on a per-material basis via
    the smoothing amount and angle. Without smoothing, the polygons that make up a
    mesh would be visible as facets. The Smoothing Angle is used to determine the
    maximum angle tolerance between connected polygons. If the angle between the connected
    polygons is greater than the Smoothing Angle setting, no smoothing will occur.
    The Automatically calculate normals toggle on the Import Assets dialog within
    Unity iOS is doing the same thing to smooth the mesh. By activating this toggle,
    you can then enter a smoothing angle just as you would in modo.


    The issue of increasing vertex count comes into play when the GPU needs to render
    a hard edge. The hard edge occurs where connected polygons form at an angle that
    is greater than the smoothing angle. The GPU needs to split the vertices at this
    angle in order to create the hard edge, and this results in a mesh seam. Hard
    edges in your model are an area that you can begin to see an increase in vertex
    count. For example, on the left side of Fig. 2.13, you can see three connected
    polygons that have a smoothing angle of 180 degrees. On the right side, one of
    the polygons has been cut and pasted so that the vertices that connected it to
    the other polygons have been duplicated. You can now see that a hard edge has
    been created. This is similar to what is happening on the GPU when a hard edge
    in your object is encountered. The vertices at the hard edge need to be split
    to create the hard edge and thus cause the vertex count to increase.


    # ### UV Seams


    In the previous section, we talked about mesh seams. Now, we are going to look
    at the second half of this problem, which is UV borders or seams. When creating
    UVs for your objects, you need to minimize the amount of seams in your UV map.
    Just as we stated with mesh seams, when the GPU encounters a'
  merge: -1
  img_proc: true
