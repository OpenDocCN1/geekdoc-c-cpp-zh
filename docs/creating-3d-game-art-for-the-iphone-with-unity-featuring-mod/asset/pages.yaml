    what can be accomplished within either your self-imposed or project deadlines.
    You will need to decide what artistic avenues you want to explore in your game
    are actually possible to implement while maintaining a solid frame rate. Again,
    we need to balance the artistic to the technical. Remember, it''s not a matter
    of compromising artistic vision, but a matter of finding the best solution to
    accommodate your style. For example, I had an idea for the trash yard for giving
    a hint of increased depth by adding some areas closed off by chain-link fences
    as shown in Fig. 4.2.


    > > *Always address the style issues up-front in the design phase of your level
    by asking the important question, "Can this be reasonably accomplished?"*


