    # ## GPU


    The GPU is the graphics processing unit and handles the rendering of our scene.
    Between the different iPhone models, you''ll find that they all use the same GPU,
    which is the PowerVR SGX535.


    The SGX 535 supports OpenGL ES 2.0. With Unity iOS, iPhone developers can use
    both the 1.1 and 2.0 versions of OpenGL ES. What this means for developers is
    that we can utilize shaders that support a programmable pipeline also, there will
    be no need to convert 1.1 shader to 2.0 every time the device meets a new shader
    in the game. In Fig. 1.3, you can see the clock speed of the SGX 535 GPU and how
    this relates to pixel fill rate and triangle throughput. The fill rate is the
    number of pixels that can be drawn to the screen per second, and throughput is
    the amount of triangles that can be processed per second.


    As you can see in Fig. 1.3, the 3GS GPU can process 7 million triangles per second
    and around 2.5 pixels per second. However, as with the CPU, I''d also like to
    reiterate the fact that although it looks like the SGX is a rendering beast, it
    doesn''t mean you can throw everything but the kitchen sink at it without regard.
    Your game''s performance isn''t entirely dictated by CPU and GPU speeds. For instance,
    RAM and slow Flash memory can also be a bottleneck as well, especially when trying
    to load larger texture sizes such as 1024 × 1024.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_26_0.png)


    **FIG 1.3** The SGX535 Has an Increased Clock Speed, Which Can Allow for More
    Pixels and Triangles to Be Drawn.'
