- pgno: 69
  md: 'next section, we’ll take a practical look at the process behind creating the
    texture map for the Tater game object.


    # Fundamentals of Game Textures


    In the following sections, we are going to discuss the creation of the fundamentals
    of creating textures for the iDevice hardware. In regards to building content
    for the iPhone and iPad, I rely on the texture maps to bring detail to my objects.
    As we’ve discussed, the iDevice hardware, though powerful, can be somewhat limited
    in terms of game development, and you’ll find that the best performance can be
    gained by using only a combination of color and lightmaps. Before we take a look
    at the textures for Tater and Thumper, we first need to look at some fundamentals
    in regards to textures and the iPhone and iPad.


    # Texture Formats


    In this section, we are going to discuss texture formats as they relate to the
    iDevice hardware. These formats pertain to the formatting of the texture in system
    memory. There are several formats that are supported across the SGX GPU found
    in both the iPhone and iPad devices such as 32 bit, 16 bit, and PVRTC-compressed
    formats. In Fig. 3.14, you can see a list of available formats as found in the
    Importing Assets Settings dialog in Unity iOS.


    # Texture Size


    When creating my textures, I typically work in a much higher resolution than will
    be used in my actual Unity iOS project. This essentially helps to future proof
    my textures when new devices are released with higher resolution capabilities
    as well as making it easier to support multiresolutions across


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_69_0.png)


    FIG 3.14 You Can Set a Texture Format in the Importing Assets Dialog within Unity
    iOS.'
  merge: -1
  img_proc: true
- pgno: 70
  md: 'devices such as iPad to iPhone. For example, I’ll typically work in a 2 K (2048
    pixel) resolution when creating my textures. This not only works for the 1024-pixel
    resolution of the iPad but is also easily scalable down to the iPhone and iPod
    Touch devices, e.g., 480 × 320 for the iPhone and 960 × 640 for the iPhone 4.
    Now, this is not the final size for textures in my game. The texture will be resized
    and compressed within Unity iOS. However, I feel it’s important to note that when
    creating source textures, you need to think about the different resolutions across
    the iDevices. You definitely don’t want to create your source textures at 480
    pixels wide and then scale these textures up to working on the higher resolution
    devices such as the iPad and iPhone 4. It’s always best to work large and then
    scale down to maintain the highest quality in your textures. Also, keep in mind
    that it’s always best to create textures as a power of 2 so that they can be compressed
    using PVRTC compression on the iDevices.


    Determining the final compressed size for a texture is dependent on several factors
    such as screen size and texture memory. For example, objects that are smaller
    in the scene, which is not only determined by physical size but also by 3D perspective
    of the camera, will be able to utilize much smaller image sizes. In fact, this
    is precisely where Mip map come into play to optimize the performance, which will
    be discussed in Chapter 9, “Working with Game Assets in Unity iOS.” Over the next
    several sections, we’ll look at the fundamentals toward how your texture budget
    is determined, which in turn will provide a solid foundation for determining texture
    size.


    # Power of 2 (POT) and Nonpower of Two (NPOT)


    A power of 2 is any of the integer powers of the number two. Basically, it means
    two multiplied by itself a certain number of times. A nonpower of 2 is well, anything
    that’s not a power of 2. Some common examples of POT resolutions are 1024 × 1024,
    512 × 512, 256 × 256, and 128 × 128. It’s important to understand that NPOT textures
    can’t be compressed in Unity iOS. The desktop version of Unity iOS allows you
    to use NPOT as compressed textures on GUITextures; however, if they’re used on
    anything else, they’ll be converted to RGBA 32-bit format, which will consume
    tons of RAM and is a very bad thing on mobile platforms such as the iPhone and
    iPad. POT textures support Mip maps and all wrap modes such as repeat and clamp.
    However, with NPOT textures, Mip maps aren’t supported, and the wrap mode must
    be clamp to edge. POT textures are fixed in terms of aspect ratio and don’t match
    the aspect ratio of the iPhone and iPad devices. This isn’t an issue when creating
    textures for your game objects such as with Tater and Thumper, but with textures
    that need to fill the screen, e.g., menus, you will have to make some adjustments.
    You can choose to scale the NPOT texture in the Texture Importer dialog as shown
    in Fig. 3.15.


    As you can see, this will essentially squish your texture as it is scaled to the
    larger or smaller resolution. I never use this option. Instead, I use a simple
    plane mesh with UI elements mapped using a texture atlas. This way,'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'FIG 3.15 You Can Tell Unity iOS How to Deal with NPOT Textures in the Texture
    Importer Dialog for Textures


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_71_0.png)


    you''ll be using the correct image formats for PVRTC Compression. A great tool
    to use for all GUI creation is “EZ GUI” from Above and Beyond Software. We''ll
    discuss the usage of texture atlases in Chapter 4. However, it''s vital to note
    that if you use NPOT texture sizes such as 480 x 320, you run into some heavy
    RAM usage, and the iPhone and iPad are not very fast in processing big RGBA textures.
    Also, larger textures take more time to load into RAM.


    One benefit for NPOT textures in regards to interface elements (GUI) is they can
    be perfectly sized to the aspect ratio of the iPhone or iPad devices.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'This essentially means that you can maintain a one-to-one texel (texture pixel)
    per screen pixel mapping, which means none of the texture''s resolution is wasted.
    However, it''s important to note that using a 512-pixel image for the UI will
    work in the same fashion. As we''ll see in Chapter 4, you can also use a texture
    atlas, which can contain nonsquare texture areas for your GUI elements.


    # Texture Compression: PVRTC


    PVRTC will compress a 32-bit file down to either 2- or 4-bits per pixel. As mentioned
    above, in order to use PVRTC in Unity iOS, your texture must be square or POT
    in size. When creating content for the iPhone and iPad, it''s recommended to use
    the PVRTC format since it''s the only format that can remain compressed in memory
    and can be decoded by the GPU from its compressed format. This is important because
    on the iPhone, you have very little memory bandwidth. Textures are often the major
    cause for running out of memory on the iPhone and are even more suspect on the
    iPad. For instance, a 256 × 256 32-bpp (bits per pixel) image with transparency
    will take up 256 KB of memory. However, the same texture compressed with PVRTC
    4 bits will only take 32 KB of memory and PVRTC 2 bits only 16 KB, which is a
    major saving. The quality of the compression is very good, and with PVRTC 4 bits
    and in most cases, the difference is negligible. In Fig. 3.16, you can see the
    difference between a 32-bit and PVRTC 4-bit brick texture.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_72_0.png)'
  merge: -1
  img_proc: true
- pgno: 73
  md: 'PVRTC compression works well for natural type surfaces such as concrete, stone,
    and brick, and the compression is hardly noticeable.


    The texture compression can and should be set directly in Unity iOS using the
    Texture Importer dialog as shown in Fig. 3.17. This means that when creating your
    textures, you can use whatever format you prefer such as PSD or PNG.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_73_0.png)


    FIG 3.17 You Can Compress Textures from within Unity iOS.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'I create all of my textures using Photoshop and export the file as an 8-bit
    PNG to my Assets folder in my Unity iOS project. I then set all of my sizing and
    compression within Unity. Unity iOS 3 supports several platforms; so for iPhone,
    you’ll need to click the iPhone icon and then check the Override for iPhone box
    to set the size and compression scheme.


    # Using Mip Maps


    Mip maps are a precalculated, optimized set of textures that accompany a main
    texture, which can help to increase rendering speed and aliasing artifacts. Using
    Mip maps on your textures will replace the main texture with a smaller more optimized
    version, as objects in your scene are farther away from the camera. In Fig. 3.18,
    you can see that Mip maps are enabled in the Texture Importer. Using Mip maps
    is a very good idea on mobile platforms. That is unless you know your texture
    will not be displayed very small on screen. That is to say, if you’re sure each
    pixel of the texture will cover one or more pixels on the screen, then Mip maps
    are not a necessity for optimizing your textures. In Chapter 4, I’ll discuss how
    building on the grid can help you to keep a one-to-one ratio between geometry
    size in terms of units and texture size in terms of pixels so that Mip maps are
    not necessary. I’m not a big fan of using Mip maps as they tend to blur your textures
    too much.


    # Multiple Resolutions


    You need to be aware of the different resolutions between the iPhone 4, 3GS, and
    iPad when building your textures. For instance, if you only build textures for
    the 480 wide screen of the 3GS, then when your game runs on the higher resolution
    displays of the iPhone 4 and iPad, your content will look poor. This is why it’s
    best to build textures at the highest resolution that will be supported, i.e.,
    the iPad, and then scale down as needed. As mentioned, you can always add logic
    to your game that will load different content based off the device running the
    game. This way, you’re sure to always give the player the best content for their
    device.


    # Texture Budget


    Now that we’ve discussed the fundamentals of how textures are rendered by the
    iPhone and iPad GPU and how compression affects the amount of memory consumed
    by a given texture, we can now properly work out the texture budget. We discussed
