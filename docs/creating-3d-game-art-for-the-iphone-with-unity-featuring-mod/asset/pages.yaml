  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_66_0.png)


    **FIG 3.9** I Didn''t Mind to Use a Repeating Texture for the Shoes, so in order
    to Save Space in the UV Map, I Overlapped Their UV Shells


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_66_1.png)


