- pgno: 20
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_20_0.png)


    # # Getting to Know the iDevice Hardware and Unity iOS


    The technical understanding behind creating game assets is more in-depth than
    just modeling low-resolution geometry. Before we can get into actual modeling
    or creating texture maps, we''ll first need to have a solid understanding of the
