- pgno: 159
  md: 'Animation Editor. Finally, we''ll look at creating animations in Blender with
    the completed rig from the first half of this chapter.


    # ### Using FBX


    As I''ve mentioned, I rely heavily on FBX for all my 3D pipelines even beyond
    that of game development. FBX is a great file format for transferring animation
    and mesh data to and from different 3D applications. Unity iOS has the ability
    to work with blender files natively in that if you place the Blender file into
    your Assets folder, it will be imported into your Unity iOS project. However,
    the blender file is actually being imported using the FBX translator behind the
    scenes, so in essence, your 3D files are always being translated via FBX at some
    point in the pipeline.


    # ### Multiple Clips per File Versus One Clip per File


    The first thing to understand with FBX and Unity iOS is that there are basically
    two workflows to choose from when dealing with the animations for your character.
    The choices are having all of the animations for your character contained in one
    FBX file, and the other is using multiple FBX files for each action your character
    will perform. We''ll take a look at these two options in-depth starting with utilizing
    only one FBX file.


    # #### Option One: Multiple Clips


    An FBX file contains animation data, which is represented in the file and referred
    to as a “Take.” What this means is that all of the animation that is present on
    the timeline in your 3D program is used in the Take file. So, the way this works
    in regards to Unity iOS is that you place different animations for your character
    at different points in the timeline. This means that all of the actions your character
    will perform are located on the timeline. For instance, frames 1–45 might represent
    a run cycle, whereas frames 46–66 could represent a jumping or a shooting action.
    In Fig. 6.31, you can see the Blender timeline with different animations being
    represented at different sections of the timeline.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_159_0.png)


    FIG 6.31 Show Blender timeline with Keys Representing Different Animations.'
  merge: -1
  img_proc: true
- pgno: 160
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_161_0.png)


    select the appropriate Action and export the FBX. I have one Blender file that
    contains all of the animations, which are separated into Actions and then I can
    select a given Action and export it using the @ naming convention to Unity iOS.


    # ## How Animation Data Works in Unity iOS


    Before we get to Blender workflow, it''s important to discuss how Unity''s animation
    data works as it''s translated from the FBX file. I''ve mentioned that FBX is
    used to convert your animation data as it''s imported into Unity iOS. Under the
    hood, Unity iOS is converting all your rotations into Quaternions. So no matter
    what Rotation Mode you''re using in Blender, which can be set on the object''s
    Transform as shown in Fig. 6.34, the rotations will be baked into Quaternions
    upon import into Unity iOS.


    *FIG. 6.33 The Animation Clips Are Referenced by the FBX Files Containing the
    @ Symbol.*


    Next, the keyframes are reduced or reduced and compressed according to the settings
    chosen in the Animation Compression within the Import Settings Dialog for the
    FBX file. You can choose to disable this feature all together or choose from reduction
    only or reduction and compression as shown in Fig. 6.35.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_161_1.png)


    *FIG. 6.34 You Can Set the Rotation Order for Objects in Blender. However, These
    Rotations Will Be Converted to Quaternions When Imported into Unity iOS*'
  merge: -1
  img_proc: true
- pgno: 162
  md: 'These reduction and compression settings work to basically "wrangle in" any
    errors in rotation, position, and scale, which are defined by the error in degrees
    for rotation and distance/delta deviation for position and scale. By reducing
    the keyframes, you can gain performance in your game as there''s less animation
    data to process, but this comes at the price of possibly losing detail in your
    animations. The degree in which you choose to compress keyframe data is totally
    dependent on your own project requirements. It''s just important to note that
    these settings can have an effect on the subtleties in your animations.


    # ### Names Are Match to Relative Animation Component


    Another aspect worth mentioning is that you can reuse animations on different
    characters as long as their hierarchies are the same based on how the Animation
    Component references objects. Each character with animation data will have an
    Animation Component applied as shown in Fig. 6.36, which is placed at the root
    of the object. The Animation Component then references the objects based on their
    relative location to the Animation Component. As long as the names are the same,
    you can reuse animations across different characters.


    Now that we have an understanding of how animation data is interpreted by the
    FBX file and how the scene hierarchy works on the Animation Component, we can
    then begin to create animations in Blender. In the next section, we''ll take a
    look at the workflow I use in Blender for animating my characters.


    # ### Animating in Blender


    In this section, we won''t go through any step-by-step tutorials on how to create
    a run cycle. There are several books solely devoted to animation mechanics and
    principles. Animation is a very deep subject and definitely warrants an entire
    book on the topic. However, I will discuss my workflow for using Blender with
    Unity iOS to properly export your animated characters to the FBX format.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_162_0.png)


    FIG 6.35 Keyframe Compression and Reduction Can Be Set in the FBX Importer Settings
    within Unity iOS.'
  merge: -1
  img_proc: true
