- pgno: 99
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_99_0.png)


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_99_1.png)


    polygon is created to match the texture resolution, and a 4 × 4 m polygon equals
    512 pixels in my texture map. This relationship between units in modo to pixels
    in my texture exists simply because I set it up that way. There isn''t a setting
    in modo to change other than being sure that I have set the Meters per Game Unit
    to 1.0. The relationship between the game units and pixels is arbitrary and something
    that I determined on my own, based off my own project requirements.


    So how did I determine that 128 pixels is what I''d use for my working texture
    size? To answer this question, we need to look back to the hardware. On the iDevices,
    we can use up to a texture size in pixels of 2048 or 2 K. Now this is on the iPhone
    3GS, iPod Touch third generation and up as it specifically relates to the support
    of OpenGL ES 2.0. I will typically use a maximum texture resolution of 1 K (1024
    × 1024 pixels) as I''ve found it to be a good base resolution for the higher resolution
    iPhone 4 and iPad screens yet can easily be downsized for 3GS. So that leaves
    us with anywhere from around 64–1024 pixels that we can use as our working texture
    size. From there, I determined that 128 would be a good base number to start with.
    Again, there''s not an exact formula, but something that you determine yourself.
    I could have easily used 256 and made each of my ground polygons 2 × 2 m, but
    when modeling, it was easier to use a 4 × 4 size.


    # Creating the Ground


    Now that I have a working texture size and have determined that each ground polygon
    will be exactly 4 × 4 m or game units in size, I can begin to layout the ground
    polygons. To start, the entire model is built into one mesh item.'
