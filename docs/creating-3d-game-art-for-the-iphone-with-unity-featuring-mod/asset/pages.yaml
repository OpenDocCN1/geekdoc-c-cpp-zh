  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_179_0.png)


    Unity iOS, all the bones are regarded as Transforms. This allows you manipulate
    each bone just as you would any other object in Unity iOS.


    In Blender, I''ll still need the weapon attached to the character in order to
    animate the action correctly. What I did was to parent the weapon to Tater''s
    IK_Hand.L Bone using a ChildOf constraint as shown in Fig. 7.6.


    Notice that the constraint matches the location and rotation of the gun to the
    IK_Hand.L Bone. This is exactly what we''ll be doing in Unity iOS. There are different
    ways to set this up in Unity iOS, but I just utilized Thumper''s Pivot as it was
    originally set in modo to correctly attach Thumper to Tater''s hand as shown in
    Fig. 7.7. In Fig. 7.8, you can see that you can work with pivots in Unity iOS
    by enabling Pivot mode in the Editor.


    In Unity iOS, I attached a simple script to Thumper to parent it to the hand.
    The script takes a variable of type Transform, which represents the IK_Hand.L
    Bone in the mesh. In the script, the gun''s Transform is then parented to the
    hand, and its local rotation is set to a Quaternion.identity, which aligns it
    to the parent axes. The local position is set to zero via Vector3.zero. Finally,
    I offset the Euler angles by -80 on the Y-axis and -90 on the Z-axis in order
    to properly line up the gun to the hand bone like it was in Blender as shown in
    Fig. 7.9.


    FIG 7.6 The Gun Was Parented to the IK_Hand.L Bone Using a ChildOf Constraint.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_179_1.png)


    FIG 7.7 Here You Can See the Pivot Point That Was Seen in Modo.'
