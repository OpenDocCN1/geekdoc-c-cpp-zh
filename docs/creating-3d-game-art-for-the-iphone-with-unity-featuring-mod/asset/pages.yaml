    from Chapter 7. In order to create the explosion effect, we''ll need to add some
    Rigidbody and Collider Components to our target. Just as we discussed in Chapter
    7, the target is made up of nine mesh items that we''ll use to explode into pieces.
    Each mesh item has a Rigidbody and Box Collider Component added to it as shown
    in Fig. 9.17.


    Now, with each mesh item representing a piece that will explode has its own Collider
    and this could be part of the issue causing the frame rate to dip. As we discussed
    earlier, Colliders can be very expensive on the iPhone and


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_242_0.png)'
