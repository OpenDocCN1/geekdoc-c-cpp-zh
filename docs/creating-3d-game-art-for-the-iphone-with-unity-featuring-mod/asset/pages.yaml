    # ## Texturing the Level


    In this section, I want to talk about how the texture atlas for the level was
    created. We are going to look at how to measure the scene to determine texture
    size as well as creating UVs. I mentioned earlier that the entire level was created
    as one mesh item and then was later broken down and exported into separate objects.
    This made it much easier for me to create the UVs, and as I broke down the level
    into sections, the UV maps created were also copied. This meant that the coordinates
    would still line up correctly even though the sections were now saved into separate
    FBX files.


    # ### Measuring the Scene


