    **FIG 3.2** By creating UVs without seams, you can stop the GPU from splitting
    vertices, yet this may not be the best solution.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_62_1.png)


    **FIG 3.3** When creating UVs for safety, my goal was to minimize seams as much
    as possible while removing texture distortion and creating a UV map that was best
    suited for texturing.'
