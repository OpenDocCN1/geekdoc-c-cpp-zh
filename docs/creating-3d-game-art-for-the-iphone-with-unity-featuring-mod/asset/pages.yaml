  md: '# Creating Tater’s

    Training Trash Yard


    In this section of the book, we are going to take a look at the creation of “Tater’s
    Training Trash Yard,” the book’s companion app. We are going to take a “scrap
    book” approach by exploring some key elements across several images. On the book’s
    resource site, you will find actual video walk-throughs that explain the process
    in-depth. Before we get to the actual app, let us first take a look at the evolution
    of a hero.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_256_0.png)


    # Evolution of a Hero


    In this section, we will take a look at the creative process of creating Tater
    throughout his design process. I mentioned in the book, that Warner McGee illustrated
    Tater. I knew early on that I would need an illustrator to create Tater, and I
    my first thought was to immediately contact Warner McGee. It was awesome to work
    with him on this project. I gave Warner some early rough sketches of my idea for
    Tater, and he began to work his magic from there. He would then send me proofs,
    and I would then make changes and suggestions as we worked to refine Tater to
    a final drawing that would match my overall idea for the character. Warner and
    I had a lot of fun developing Tater. We had a lot of creative discussions, and
    it was really cool to see an idea come to life. Early on, Tater did not have a
    name, so Warner and I referred to him as Bob.


    FIG. 1 This is a very early concept of Tater that I sent to Warner.


    FIG. 2 This sketch shows some early ideas I was working out. I also sent this
    to Warner. So he would have some basic ideas of what I wanted for Tater.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_256_1.png)'
