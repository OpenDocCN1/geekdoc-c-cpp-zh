    As you can see, there''s really nothing overly complicated to painting textures.
    If you break the process down to its basic forms, it''s all about drawing simple
    shapes and shading while layering detail little by little. Always start simple
    and work in detail where it''s needed using your reference images as a guide.


    # Creating Hair


    Tater is a hairy dude, and painting hair was an extremely simple, yet fun process.
    In Photoshop, I created a custom hair brush and then began to build up hair by
    painting with the custom brush. To create the brush, I started with the 112 Brush
    Preset. Next, I increased the Size Jitter, Angle Jitter, as well as checked both
    the Flip X and Flip Y Jitter settings on the Shape Dynamics menu. Finally, I increased
    the Scatter, Count, and Count Jitter on the Scattering menu. In Fig. 3.26, you
    can see the settings used to create the brush. Once the brush was created, it
    was just a matter of painting in the hair. I would frequently change the Scatter
    and Jitter settings to create a sense of randomness and variation in the hair.


    # Adding Some Wear and Tear


    Once the final texture was complete, I then loaded up the texture into modo and
    used modo''s 3D paint tools to paint dirt on the Tater texture created in Photoshop.
    My Tater character is a bit dirty and rough, and by adding some dirt to the texture,
    it not only adds character but can also paint dirt over the UV seams and make
    the texture appear more seamless. In modo, I use the Airbrush tool with the Procedural
    Brush to paint the dirt. I start with a dark brown color and a very low opacity
    setting as shown in Fig. 3.27.'
