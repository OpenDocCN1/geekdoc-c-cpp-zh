  md: 'should be used with care. For each piece of the target, we are using the Box
    Collider, which is one of the least expensive Colliders.


    Next, we''ll add a Box Game Object, which will be used to test for collision when
    Tater shoots the target and is called "HitTest".This object will also have a Box
    Collider and will have its Mesh Renderer disabled so that it won''t render and
    thus won''t issue a draw call. In Fig. 9.18, you can see this object with its
    Mesh Renderer disabled.


    I''ve also set a new Tag for this object called "Target".This Tag will be used
