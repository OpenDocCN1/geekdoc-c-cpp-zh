    the Tiles Relate To.


    all sides so that it can easily be tiled. Also note that the ground texture is
    in a power of two format as well as the level texture atlas. However, I can create
    texture areas in the texture atlas that are not a power of two, but because they
    are contained within the power of 2 texture atlas, they can still be compressed
    using PVRTC compression. If you look back to Fig. 4.12, you can see that the board
    textures are not in a power of 2.


    The second reason is that there''s no wasting of resolution in the game as building
    on the grid helps you to place texture reso-


    lution appropriately. For instance, let''s say you have a doorway mesh that''s
    only 128 × 256 units in size in 3D space. It would be a huge waste to map a 1024
    × 1024 pixel image to this mesh. Building on the grid helps you to work


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_97_1.png)


