    # ## Summary


    In this chapter, we discussed several aspects for creating textures for the iPhone
    and iPad. We began by taking a look at how UV seams can increase vertex count,
    and we went through some practical examples by discussing the creation of the
    UV maps for both Tater and Thumper. We also discussed the fundamentals behind
    textures such as PVRTC compression, power of 2, texture sizes, and determining
    a texture budget. The overall concept that I want to stand out in this chapter
    and to ultimately be the take away from the book is that by understanding the
    hardware limitations, game engine, and how game objects are rendered on the iPhone,
    you''ll know how to build optimized assets. You''ll understand how to determine
    vertex and texture budgets as well as know what it takes to make assets that allow
    your game to run as smoothly as possible. The key is to know your environment
    and the rules that govern that environment. In Chapter 4, we''re going to build
    upon the modeling and texturing principles discussed thus far by taking a look
    at creating an environment for Tater.'
