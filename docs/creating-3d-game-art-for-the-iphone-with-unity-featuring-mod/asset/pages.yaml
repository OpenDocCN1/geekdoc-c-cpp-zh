    # Understanding Skinned Meshes within Unity iOS


    In this section, we''ll take a look at the technical aspects of using skinned
    meshes in Unity iOS. As you''ve seen in the previous chapters, it''s very important
    to understand the process and how it relates to Unity iOS and the iPhone and iPad
    hardware. Being armed with this knowledge allows you to make important decisions
    on the rigging and animation process and can save a lot of headache when it comes
    time to optimizing your game''s performance.


    # VFP-Optimized Skinning


    As we discussed in Chapter 1, the iPhone and iPad have a very fast VFP coprocessor
    for handling complex math operations. Unity iOS optimizes skinning through the
    VFP coprocessor and it''s significantly faster than GPU skinning. On the iPhone
    4, 3GS, and iPad, Unity iOS can skin up to 5 million vertices per second. However,
    Unity iOS only supports specific VFP-optimized skinning paths, and it''s very
    important to know what these paths are so that you can be sure to take advantage
    of them in your project. If you''re not set to utilize one of these optimized
    paths, your skinning performance will be falling back on the CPU, which is much
    slower. It''s also important to state that'
