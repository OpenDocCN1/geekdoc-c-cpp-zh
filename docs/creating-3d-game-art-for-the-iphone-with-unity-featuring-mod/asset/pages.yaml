    # Using Dual Lightmaps


    Earlier, we mentioned the usage of Dual Lightmaps and how they work to blend real-time
    lights and baked lightmaps. I also mentioned that Dual Lightmaps are not available
    on the iOS platform. Dual Lightmaps can only be used in the Deferred Lighting
    Rendering Path and currently this is not available on mobile platforms. It is
    also only available in the Unity Pro License. However, I thought it would be important
    to briefly mention the Dual Lightmap mode while discussing Beast. Dual Lightmaps
    are designed to make lightmapping work with specular, normal mapping and proper
    blending of baked and real-time shadows. By enabling the Dual Lightmaps mode in
    the Bake tab, Beast will bake two lightmaps, a Far map, which covers full illumination,
    and a Near map, which contains indirect illumination from lights marked as Auto,
    full illumination from lights marked as Bake Only, emissive materials, and sky
    lights. In Fig. 8.18, you can see that the mode has been set to Dual and that
    two light maps, a far and near, have been baked and saved into the project.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_217_0.png)


    With Dual Lightmaps, Lights set to Realtime Only are never baked. The Near lightmap
    set is used when the camera''s distance to objects is smaller than the Shadow
    Distance quality setting. Within the Shadow Distance, Lights with'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'their Lightmapping property set to Auto as shown in Fig. 8.19, are rendered
    as realtime lights with specular bump and realtime shadows. These shadows blend
    correctly with shadows from Realtime Only lights and their indirect light is taken
    from the Near lightmap. When the camera is outside the Shadow Distance, lights
    marked as Auto no longer render in realtime and full illumination is taken from
    the Far lightmap. Lights marked as Realtime Only are still active, but have their
    shadows disabled. In Fig. 8.20, you can see the Shadow Distance Setting.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_218_0.png)


    FIG 8.19 The Directional Lights Lightmapping Mode Is Set to Auto, Which Is the
    Default.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_218_1.png)


    FIG 8.20 Here You Can See That the Setting for the Shadow Distance Is Set to 50.
    When the Camera Is Inside This Range, It Uses Realtime Shadows, But When It''s
    Outside the Range, It Uses the Near Lightmap.'
  merge: -1
