- pgno: 13
  md: 'Xbox LIVE Indie Games, which uses Microsoft XNA Game Studio. However, being
    more art orientated, I found that coding games using XNA can be a slow process
    and rather difficult to grasp. Being a multimedia developer, I’m very familiar
    with programming in terms of scripted languages such as Flash ActionScript, JavaScript,
    and Python. Unity iOS provides the perfect solution in that you get a full 3D
    environment similar to the 3D apps for building scenes in a intuitive, artistic
    manner as well as the ability to code games in a scripted language such as JavaScript.
    Unity iOS allows me to focus on my strengths, which is the art-side of game development
    while still being able to code and create an engaging interactive experience.
    It’s the best of both worlds, fused into an application built from the ground
    up for rapid game development.


    Unity also has the ability to publish games on multiple platforms such as Wii,
    iPhone and iPad, Android, desktop, and Web and with Unity 3.0, support for Xbox
    360 and PS3 as well. For instance, with Unity, it takes little effort to port
    your game from the iPhone to another platform such as the Web. Unity also supports
    the major 3D animation packages and mainstream formats such as FBX. As an artist,
    I find Unity to be an indispensable tool for creating interactive 3D content and
    my game engine of choice due to its ease of use and artist-friendly tool set.


    A game engine such as Unity needs hardware to run on and as stated Unity iOS will
    run on various hardware platforms, most notably of which is Apple’s iDevices such
    as the iPhone, iPod Touch, and iPad. Apple’s iDevices provide an elegant operating
    system, referred to as iOS, and provides a cohesive standard for development across
    all of its platforms. It has been said that Apple’s keeping such an iron-clad
    grasp on its hardware and OS makes for an inferior product, but as a game developer,
    I feel that this closed environment takes the “guess-work” out of how my particular
    game will run on the platform. With the iOS, there is a handful of devices my
    game can be targeted for, and although internal hardware between the devices such
    as the iPhone and iPad differ, for the most part, the hardware provides a standard
    in terms of developing for the iOS devices, which makes it easy to target optimizations
    and build games that run on each platform with little effort. Now, as new generations
    of the devices such as the iPhone 4 are made available, the hardware will certainly
    change and become more powerful. So, the number of device generations you want
    to support with your game will dictate the level of support complexity in terms
    of building optimized content that will run well on all of the iDevices.


    Not only does Apple’s iOS provide a standardized environment but it also comes
    backed with a massive marketplace. With the invention of the App Store, Apple
    established a mass market for developers to publish and sell content, which continues
    to rapidly expand each day. At the time of this writing there is currently over
    250 thousands apps available and over 5 billion downloads. Also, Apple has paid
    out over 1 billion dollars to developers. There are over 1000 games powered by
    Unity available on the App Store, and this


    > > **Writing Code with Unity**

    > >

    > > Unity also supports C# as well as JavaScript languages. If you’ve used C#
    with XNA Game Studio, then coming over to Unity is a breeze. No matter what level
    of programming experience you have, Unity has something for you.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'number continues to grow rapidly. Several of these games have been critically
    acclaimed in the top 25 and top 100 lists on the App Store. Unity has proven time
    and time again to be a solid development platform and the best middleware solution
    for creating games for the iPhone and iPad.


    However, Apple''s App Store is not without its controversy, and as a game developer,
    it''s best to always look at every opportunity. Many have stated that the market
    is way over saturated and tough for the independent game developers to get noticed.
    I can definitely agree this can be the case, but if you have a passion to create
    games, it can be deeply rewarding to publish a game that has potential to be placed
    in front of millions of users. With the App Store, the market is there, and you''ll
    never know how successful your game could be unless you try.


    Also, Apple does review the apps submitted and retains the right to reject your
    application. During the writing of this book, I as well as all developers went
    through a tough time and faced the possible exclusion of Unity iOS from the platform
    when Apple changed their Terms of Service in Section 3.3.1 of the SDK agreement.
    Of course, the amazing development team behind Unity was able to weather this
    storm and as it turned out, Apple amended the TOS to allow third-party development
    tools.


    I really like Apple''s development environment and solely choose to develop for
    the iPhone and iPad. A standardized development environment, backed with powerful
    hardware capable of running high-end games and a massive marketplace, makes using
    Unity iOS and Apple''s iDevices a premiere solution for independent game developers.
    With that said, as a game developer, it''s always best to not put all of your
    eggs in one basket so to speak. Diversifying your platforms can be a good thing,
    and although Apple''s platform is great, it''s not the only game in town. There''s
    Android and Windows Mobile to name a few other key players in the mobile market.


    # ### Prerequisites: What Should I Know?


    At this point, you''re probably asking yourself, "OK, this sounds good, but what
    do I need to know?" As stated earlier, the focus of this book is to address a
    particular need in game development, which is creating 3D content. In this book,
    we won''t be covering the process of creating an entire game. However, we will
    be taking an in-depth and unique look at how 3D content specifically relates to
    Unity iOS in terms of building highly optimized content specifically for deployment
    on the iPhone and iPad.


    > > *In this book, we won''t be covering the process of creating an entire game.
    However, we will be taking an in-depth and unique look at how 3D content specifically
    relates to Unity iOS in terms of building highly optimized content specifically
    for deployment on the iPhone and iPad.*


    This book will cover in-depth the principles behind creating 3D content for the
    iPhone and iPad using Unity iOS, as this book is written for registered iPhone'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'developers and 3D artists who are looking to increase their knowledge on creating
    3D game art. By understanding these principles, you will be armed with the technical
    knowledge to begin creating content for your own games. Although topics are covered
    in depth and are not just theory, we won’t be going through complete step-by-step
    tutorials. I’ve always felt that step-by-step tutorials only guide one through
    the creation of a specific game object or model, which rarely relates to your
    own projects and needs. By learning the principles behind the process, you’ll
    be able to focus on creating your own content.


    With this in mind, you will need to have a working foundation of the tools that
    we’ll be using throughout this book, which are modo, Blender, and Unity iOS. This
    book won’t discuss how to use these tools from a beginner’s point of view. Instead,
    it will focus on using these tools for the specific workflow of creating optimized
    game art. For example, in Chapter 1, “Getting to Know the iDevice Hardware and
    Unity,” we’ll discuss the technical aspects of the iOS devices and how they relate
    to Unity iOS, but a working knowledge of Unity iOS will be needed as we won’t
    discuss such as importing assets or attaching components. Similarly, a working
    knowledge of a 3D program is needed. For instance, we’ll be building assets in
    modo, but you’ll need to know the modeling tool and understand UV mapping. The
    reason for not covering such basics is that it allows the topics in the book to
    focus on specific more advanced tasks as they relate to creating optimized game
    content for deployment on the iPhone and iPad.


    This is a highly specialized book, and it’s written to be the book I wish I had
    when I was getting into Unity iOS and game development for the iPhone. It’s about
    trimming the fat in order to get to the meat of the discussions and maximize the
    important concepts the book needs to cover and what most other game books leave
    out.


    In this book, I’ll be using a combination of the Unity iOS Basic and Advanced
    Licenses. The Basic License is the least expensive, entry-level route to getting
    into developing games for the iPhone using Unity iOS. The book’s demo app will
    be published with the Basic License. You can see the differences between the Basic
    and Pro licenses by visiting this link http://unity3d.com/unity/licenses#iphone.


    I use Luxology’s modo software as my primary 3D creation tool. Modo is great for
    game development as well in that it provides a streamlined modeling and 3D painting
    tool set. Modo’s rendering pipeline allows for quick and easy baking of textures
    and lightmaps. That being said, the concepts illustrated in this book are based
    off principles to game development that can carry over to any 3D application,
    so feel free to use your application of choice while following along. I’m a firm
    believer that tools are only tools, and it’s the artist and their skill set that
    makes a game good. A good example of this is in the usage of Blender within this
    book. In my everyday workflow, I use Autodesk Maya in conjunction with modo. Maya
    is my 3D app of choice for rigging and character animation, but to help keep this
    book open to as many as possible,'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'I will be using Blender for the rigging and animation portions of this book.
    The main reason being that Blender is an open-source application, which doesn''t
    add any additional cost to your pipeline and is more readily available. Also,
    since we are discussing key principles to rigging and animation for iPhone games
    using Unity iOS, it doesn''t really matter which 3D application you use and it
    really comes down to personal preference.


    Even though this is a game art book, we''ll be covering the process of creating
    game art in conjunction with a particular game engine in-depth, which means we
    can''t entirely leave out programming concepts. It would be beneficial to have
    a working knowledge of basic programming concepts within Unity iOS.


    # ## Getting Down to the Core Principles


    I''ve mentioned earlier that we won''t be going through any step-by-step tutorials
    throughout this book. Now, if you''re a little bummed, hold on and let''s take
    a look at why I''ve decided to omit exhaustive step-by-step tutorials. I''ve been
    studying 3D for a long time and have definitely gone through my fair share of
    tutorials over the years. One thing that I''ve noticed is that I seemed to never
    take much away from step-by-step tutorials. Now, these types of tutorials are
    great for beginners and were just what I needed when first learning how to model.
    However, when I was looking to move to the next level, step-by-step just didn''t
    cut it. What I found was that by following along in a "3D-by-number fashion,"
    I was missing the vital principles behind the process. I was missing the "why"
    driving the techniques. Also, I found that more times than not, I''d get so bogged
    down in 40 plus pages worth of complicated steps, that I''d completely miss the
    whole point behind the techniques of building the model, not to mention the fact
    that I was only learning how to create a specific object.


    I feel it''s very important to communicate the core principles and techniques
    behind the 3D creation process, so that you, the reader, can take these principles
    and use them to build your own projects instead of recreating something specific
    I came up with. The point is, once you understand the core principles behind a
    process, you can use these principles to work out your own techniques and ultimately
    get up to speed on your own projects much quicker.


    Although we''re on the topic of your own projects, I wanted to also quickly reiterate
    the fact that which 3D applications you use is completely up to you. I mentioned
    that I''d be using a modo/Blender pipeline throughout this book; however, the
    topics covered can be used in any 3D application. One app isn''t particularly
    better than another, and I strongly urge you to always keep in mind developing
    or customizing your own pipeline.


    Artists work differently, and no one way is the correct or only way to get a project
    done. You don''t have to use modo or Blender to follow along with this'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'book. In fact, as I already mentioned, I''m more of a modo/Maya user myself.
    Since it is free, Blender was chosen for the animation chapters and also makes
    a great companion to modo due to modo''s current lack of mesh skinning features
    without digging into your pocket book. I simply took my workflow from Maya and
    extended it to Blender. Answering the "why" behind the techniques and not step-by-step
    instruction makes this possible.


    # ## Meet “Tater”


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_17_0.png)


    Tater is a character that I developed with the help of the extremely talented
    character artist and illustrator Warner McGee, [http://www.warner-mcgee.com](http://www.warner-mcgee.com).
    I had a concept for Tater and contacted Warner to help flesh out and add his artistic
    expertise to Tater''s design. Not being an illustrator myself, I handed Warner
    some very basic sketches of the design and he worked his magic from there, producing
    the version of Tater showcased in this book. It was awesome to work with Warner
    on this project, and it was a lot of fun to see him develop my original concept
    into a fully realized character. Since Tater will be used in'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'other projects beyond this book, I also created a back story in order to create
    an immersive game property.


    Tater is a reluctant hero from a personal game project I''ve been working on called
    "Dead Bang." The content that we''ll be exploring in this book are elements taken
    from Tater''s world and the Dead Bang game concept. In Dead Bang chapter 1, Tater
    is the only surviving member of a small country town in a zombie apocalyptic nightmare
    caused by a peculiar device called the "Brain Masher." Armed with his trusty sidekick,
    "Thumper," a lethal-modified shotgun that Tater wields with a surgical-like accuracy,
    decapitating the heads of the walking dead with each pull of the trigger, Tater
    scours the land looking to rid his hometown of the unwelcomed guests and to disable
    the Brain Masher device. The only thing that Tater likes more than disintegrating
    zombie heads, which he affectionately refers to as "Thump''n Noggins," is devouring
    a fresh bag of "Berries BBQ Potato Chips," which earned him the nickname, "Tater."


    Throughout this book, we''ll be taking a look at some elements from Tater''s world
    to illustrate the topics covered in the book. We''ll look at the creation and
    animation of Tater and Thumper as well as an environment from the "Dead Bang"
    world so that they are optimized to run on both the iPhone and iPad.


    # ## Book Resources


    In addition to the content found in this book, you also find a wealth of bonus
    material in the form of video walkthroughs on the book''s resource web site. You
    can get to the book''s resources by visiting http://wesmcdermott.com and clicking
    the "Creating 3D Game Art for the iPhone Book Site" link. From the book''s official
    web site, click the "Tater''s Weapon Load Out" link. When prompted for the login,
    enter "Tater" for the username and "thumpNoggins" for the password. At the beginning
    of each chapter that has extra video content, you''ll be reminded to check the
    resource site, which will be signified by callout "Tater''s Weapon Load Out."


    The book also has its own iPhone and iPad app called "Tater." The app serves as
    a creative demo, running the content discussed throughout the book on the actual
    iDevices. With "Tater," you can run through Tater''s training trash yard shooting
    targets. The app showcases all of the game assets and animations discussed in
    the book. You can find more information on how to get the "Tater" app on the book''s
    official web site.


    # ## The Adventure Begins ...


    We''ve got a lot to cover, and we''ll begin by taking a detailed look under the
    hood of the iDevice hardware and Unity. Once we''ve got a solid understanding
    of the hardware driving our game, we can begin building optimized content.


    When you''re ready, jump into Chapter 1, "Getting to Know the iDevice Hardware
    and Unity iOS," and as Tater would put it, "let''s thump some noggins!"'
  merge: -1
  img_proc: true
