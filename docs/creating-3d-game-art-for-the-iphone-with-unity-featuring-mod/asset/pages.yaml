    ![](img/d3e3fa4010906e98ec76be003a6e31c2_117_1.png)


    bone influences. Each of these paths has a certain criteria to meet in order to
    be optimized by the VFP coprocessor. In FIG. 5.8, you can see a chart that shows
    the optimized paths and the criteria they must adhere to. First, we have the 1-bone
    path that in order to utilize VFP, it must have only 1 UV set and be lit (utilizing
    skin normals) in the scene. For the 2-bone path, the mesh can be lit or unlit
    and have up to 2 UV sets. This is the most common skinning path, so it''s VFP
    optimized with 2 UV sets and works for both lit and unlit objects. Finally, there
    is the 4-bone path, and it must be lit and can use up to 2 UV sets as well.


    To actually use the VFP skinning paths, you need to make sure that you adhere
    to the criteria. For instance, when assigning skin weights to your character in
    your 3D application such as Blender, you need to make sure that each vertex has
    a maximum bone influence of 4. Also, Blender 2.5 has an Auto-Normalize feature
    to balance any overlapping weights to a total value of 1.0 as Maya does automatically.
    It can be activated in the tool menu, by pressing the T-key while in Weight Paint
    mode as shown in FIG. 5.9.


    Once the character has been imported into Unity iOS, you need to make sure that
    the settings on the Skinned Mesh Renderer are correct for utilizing one of the
    VFP-skinning paths. Let''s look at an example with Tater. If I wanted to utilize
    4 bones per vertex, which is set on the Skinned Mesh Renderer Component via the
    Quality setting, I''d also need to enable Skin Normals as well in order to match
    the criteria for using the VFP-optimized skinning path on a 4-bone path as shown
    in FIG. 5.10. By lowering the Quality setting in Unity iOS, you can also gain
    performance at the cost of losing animation detail.'
