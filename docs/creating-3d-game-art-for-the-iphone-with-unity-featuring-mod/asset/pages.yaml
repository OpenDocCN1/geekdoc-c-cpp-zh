- pgno: 136
  md: '# Summary


    In this chapter, we discussed several key aspects for creating bones and painting
    weights as they pertain to the iPhone and Unity iOS. This chapter discussed the
    usage of Blender in a modo to Blender pipeline; however, the techniques and principles
    discussed in this chapter can be utilized in any 3D package. We discussed the
    importance of the iDevice hardware and how Unity utilizes VFP-optimized skinning
    paths and what you need to do to make sure you take advantage of these optimizations.
    We also discussed the importance of bone count and making sure you utilize a maximum
    influence of no more than 4 bones per vertex. Finally, we took a look at Tater''s
    skeleton as it was created in Blender and some useful weight tools such as Clean
    Weights and X Mirror.


