    # ## Creating a Style


    Although the focus of the book is on the technical aspects of building content,
    I felt it would be important to talk a bit about style. The style of your game
    should speak to the audience and lend itself to the experience you''re trying
    to create for the player. As I mentioned, in this chapter, we''re going to look
    at building a level from Tater''s world. Before any content is created, I had
    already written out an entire synopsis for my Tater character. I worked out his
    look, personality, and environment. I then hired Warner McGee, a talented character
    designer, to create the illustration and polish up Tater''s overall style. Having
    a strong understanding of the world you want to create is key to visualizing a
    style for your level and characters. For instance, Tater is a bit of a country
    bumpkin and analyzing his personality and traits helped me to visualize the type
    of environment that would fit his persona. For the book, I wanted to create a
    level that would showcase the process behind creating optimized content while
    also adhering to the overall style and design of "Dead Bang" game property I have
    been working on. The level we''ll be creating in the book is that of a trash yard.
    It''s old and dirty and lends itself to Tater''s style. Always remember that the
    levels you create in your games are just as much of a vital character asset as
    your main hero character. The next step was to sketch out the layout of the level
    so that when the time comes for actual modeling, I''ll have a diagram to follow.
    All of the trial and error of the design and layout are worked out on paper first.


    > > *Always remember that the levels you create in your games are just as much
    of a vital character asset as your main hero character.*


    # ## What Can Reasonably Be Accomplished?


    We previously discussed the balancing act behind technical limitations and artistic
    creation. When designing a style for your content, it''s always good to start
