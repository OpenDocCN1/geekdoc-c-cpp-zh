    # FIG 3.11 I Used the Unwrap Tool to Quickly Get the UVs Created for the Bulk
    of the Gun.


    Notice that with the Unwrap tool, I was able to unwrap tough areas such as where
    the gun handle attaches to the barrel by carefully selecting the UV edges that
