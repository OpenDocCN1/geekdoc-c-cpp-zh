- pgno: 43
  md: '# Targeting Devices


    When targeting a game for the iDevices, you''ll need to decide which devices your
    game will support. A plus with iOS development is that you have a somewhat limited
    number of devices to target unlike other mobile platforms. However, you''ll still
    need to decide if you''re going to support all of the device generations or only
    the ones that will allow your game to reach it''s maximum performance while still
    maintaining a high level of detail without having to compromise the quality of
    your art assets.


    A viable solution is to build different resolution models and texture maps to
    be used on different devices. For instance, you can build higher resolution assets
    for the iPhone 4 and iPad, while creating lower resolution models for the iPhone
    3GS and iPod Touch third generation. In Unity iOS, you then create a script attached
    to a startup scene that checks to see in which device the game is running and
    then load the scene with the optimized assets targeted for that device.


    In the case of the book''s demo and my current game in production, "Dead Bang,"
    I decided that I would optimize my assets for targeting the higher performance
    devices such as the iPhone 4, 3GS, and iPad. The way I looked at it was at the
    time of the writing of this book, the iPhone 3G and iPod Touch second-generation
    devices are now three generations old. I decided that it wasn''t worth creating
    a whole set of assets at a lower resolution to support those older devices. It
    doesn''t mean that my content won''t run, but it just may not perform as smoothly
    as I''d like. Ultimately, it all depends on the scope of your project and what
    you want to accomplish.


    > Sneaky Fill Rates

    > Remember, you must always keep a close watch on the iPad and iPhone 4 for fill
    rate issues. Testing and profiling your game on these devices is the only sure
    way of finding performance issues.


    By creating performance scene to test hardware and gaining a thorough understanding
    of the capabilities and limitations of that hardware, I determined that I wanted
    to keep my vertex count for my hero character, Tater, less than 800 vertices.
    As you will see later in this chapter, I was able to get Tater to weigh in at
    659 vertices, which more than meets my vertex budget for Tater. Currently, the
    Unity iOS manual states that you should aim at around 10 k vertices visible per
    frame, and as I mentioned in Chapter 1, "Getting to Know the iDevice Hardware
    and Unity iOS," this is somewhat conservative given the hardware driving the iPhone
    4 and iPad.


    At this point, Tater''s vertex count is weighing in with my game''s overall vertex
    count quite nicely. So let''s now take a look at how I was able to achieve my
    goals.


    # Sizing Things Up


    When moving objects from one 3D application to another, you''ll inevitably run
    into size issues and working with Unity iOS, modo, and Blender is no exception.
    Now, this isn''t a problem, it''s just something you have to understand and work
    around and it starts with defining your game units.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# What Is a Game Unit


    A game unit is an arbitrary means of defining size in your game scene. One game
    unit is equal to 1 grid square in 3D space. In Fig. 2.5, you can see that a default
    cube game object in Unity iOS is equal to 1 grid square or 1 unit wide by 1 unit
    high by 1 unit deep.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_44_0.png)


    FIG 2.5 A Default Cube Game Object in Unity iOS is 1 × 1 × 1 Unit.


    A game unit can represent any measurement you would like. For instance, 1 game
    unit can be 1 ft or 1 m. It''s whatever value you want it to be, although it''s
    common practice in game development to establish a single game unit to be equal
    to 1 m. The reason being is that it''s easier to work with physic calculations
    if your game is adapting real-world measurements. For instance, the rate of gravity
    is 9.81 m/s², and if you want to simulate this in your game, it will be easier
    if you''re working with a 1 game unit to 1 m scale. If not, you''d have to work
    out how 9.8 m/s² relates to your own established scene scale to get the same result.
    So when creating my Unity iOS project, I adopt the scale of 1 game unit is equal
    to 1 m. In Unity iOS, you don''t have to set a preference or setting, it''s just
    something that you determine for your project and use this scale when creating
    and importing objects.


    # Don''t Set Scale in Unity iOS


    It''s very important to not set the scale for your object within Unity iOS on
    the object''s Transform. The reason being is that when the scale is changed on
    the Transform, Unity iOS makes a copy of the object, which is the scaled version
    of the object. This wastes memory resources. Always be sure that the scale in
    Unity iOS is set to 1 × 1 × 1 and that any scaling is done either in the 3D application
    or in the FBX Importer Dialog via the Scale Factor setting.


    # Setting Up Modo


    Internally, modo is always working in meters regardless of how you set the Accuracy
    and Units in the Preferences. You could say that if a 1 × 1 × 1 m³ in modo needs
    to be scaled to 0.01 or scaled down by a factor of 100 to be the same size as
    a 1 × 1 × 1 m³ created in Unity iOS, then Unity iOS must be working internally
    in centimeters. With that same notion in mind, Maya internally works in centimeters,
    and if you export a 1 × 1 × 1 m³ from Maya to Unity iOS, you need to set the Mesh
    Scale Factor to 1, meaning no scale conversion, for the Maya cube to equal the
    same size of a Unity 1 × 1 × 1 m³, which further proves Unity''s internal scale
    working in centimeter. By knowing the internal scale that your 3D application
    is working and how it relates to Unity''s internal scale, you''ll be able to gauge
    if your objects may or may not need to be scaled and by what factor.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'Ultimately, it’s best practice to think of Unity’s scale in terms of the arbitrary
    game unit you set for your projects. For instance, I set my game projects to have
    a scale of 1 game unit equal to 1 m. So in Unity iOS, 1 grid square is equal to
    1 unit. In modo, I create my objects, as 1 grid square is equal to 1 unit to match
    my projects game unit scale. However, this means when working with modo and Unity
    iOS, your modo meshes will need to be scaled by 0.01 in Unity’s Importing Assets
    Settings via the Mesh Scale Factor due to the differences in which the Unity iOS
    and modo internally work with scale as shown in Fig. 2.6.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_45_0.png)


    FIG 2.6 Notice that the Mesh Scale Factor Defaults to 0.01, and the Imported 1
    × 1 × 1 Modo Cube Matches a Default 1 × 1 × 1 Unity iOS Cube.


    You can either choose to scale the mesh in modo before export, thus not having
    to scale it in the import settings within Unity iOS, or simply scale the mesh
    by 0.01 in the import settings within Unity iOS. I prefer to scale the modo mesh
    in Unity’s import settings, which allows me to work in meters within modo. By
    doing this, I don’t have to worry about freezing scale in modo before export and
    sending my mesh over to Blender works better as we’ll discuss in Chapter 5.


    In modo’s Preferences, under Accuracy and Units, I set the Unit System to Game
    Units and then set the Meters per Game Unit to 1.0. This means that every grid
    square in modo will be 1 game unit and will represent 1 m, which is what I am
    considering my Unity iOS units to be equal to as shown in Fig. 2.7.'
