- pgno: 61
  md: '# Planning Your UV Maps


    Depending on your object, you are going to have to create some few UV seams, and
    as I stated above, the trick is to minimize these seams to as few as possible,
    yet still have the layout make sense for texturing. Let’s look at an example.
    In the top half of Fig. 3.1, you can see a default model box with the UV seams
    highlighted. As you can see, the UV layout from the default box allows you to
    easily texture the sides of the box. In the lower half of Fig. 3.2, you can see
    that the UV layout has overlapping UVs in such a way that there are no seams.
    Now, the difference between these UV layouts beside ease of texturing and texture
    distortion is increased vertex count due to UV seams.


    **FIG 3.1** Here You Can See the Default Model Box with Two Different UV Layouts.
    The First UV Map Has UV Seams, and the Second UV Map Has No Seams.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_61_0.png)


    In Fig. 3.2, you can see how these UV layouts affect the vertex count in Unity
    iOS. Notice that the UV map without seams coupled with the object having no hard
    edges due to an increased smoothing angle yields the same vertex count of eight
    vertices between both Unity iOS and Modo. Although the default UV layout increases
    the vertex count from 8 to 14 as shown in the first half of Fig. 3.2, it still
    provides the better solution in that the object can be properly textured without
    distortion. Yes, it is possible to use an increased smoothing angle and eliminate
    all UV seams, which will not cause the GPU to split vertices as shown in the second
    half of fig. 3.3, but this is not always a practical solution in terms of texturing.'
  merge: -1
  img_proc: true
- pgno: 62
