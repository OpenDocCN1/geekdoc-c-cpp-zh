- pgno: 267
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_267_0.png)


    **FIG 24.4** The target was also made into a Prefab. It consists of several small
    mesh items, a baked animation and Colliders. There is also a script on the target,
    which when hit, dispatches a message to play the attached animation for the FBX
    fake file and instantiate a particle prefab for the explosion at the position
    of that target.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_267_1.png)


    **FIG 24.5** This image shows the explosion that is created by the instantiated
    particle emitter.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_268_0.png)


    **FIG A.26** This image shows the actual particle emitter that was used to create
    the explosion effect.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_268_1.png)


    **FIG A.27** To create the muzzle flash, I parented a GameObject, which consisted
    of three transparent sprites to the tip of Thunder. By default, the Mesh Renderer
    is disabled. When the user hits the fire button, a script toggles the Mesh Renderer
    for the muzzle flash to on. A coroutine is used to turn the muzzle flash Mesh
    Renderer off.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_269_0.png)


    > **FIG A.28** Here, you can see the gate Prefab. This Prefab uses a transparent
    lightmapped shader that uses alpha testing.


    # ## Game Play Controls


    A vital aspect of any game is the controls. Programming a control system can be
    a very complex task, which, depending on your system, can take lots of time to
    correctly implement. Instead of trying this venture on my own, I turned to the
    Tornado Twins and UnityPrefabs.com at http://www .unityprefabs.com/. I, Efraim
    Meulenberg, founder of UnityPrefabs.com graciously provided me with the 3rd Person
    Camera Kit Prefab for the book. UnityPrefabs.com Prefabs are not only amazing
    quality assets, but easily integrate into your own projects. By utilizing their
    3rd Person Camera Kit Prefab, I was able to concentrate on the control’s graphic
    elements and bypass the coding altogether, not to mention save tons of valuable
    time on the project.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_269_1.png)


    > **FIG A.29** This image shows the control scheme from the UnityPrefabs.com 3rd
    Person Camera Kit Prefab that I re-skinned to match my game style. It was extremely
    easy to configure the Prefab as well as replace the graphics.'
  merge: -1
  img_proc: true
