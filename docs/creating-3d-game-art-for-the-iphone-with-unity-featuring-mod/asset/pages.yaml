  md: '# ## Fixing the Pelvis Bone for Hip Sway


    In order to correctly setup the Pelvis so that the hips will swing correctly,
    I needed to add another bone. The reason being is that a bone''s pivot will be
    located at the tail. However, I want to change the pivot of the Pelvis bone so
    that it will rotate more in the hip area of the model. First, I duplicated the
    Pelvis bone by pressing Shift + D. Next, I named this bone PelvisRotHelper and
    then selected the Pelvis bone and switched its direction by pressing Alt + F or
    by accessing the Switch Direction command in Edit Mode via the Specials menu,
    which can be activated by pressing the "W key" as shown in Fig. 5.30.


    I then parented the PelvisRotHelper to the Pelvis with the Keep Offset option
    as shown in Fig. 5.31. Finally, the first Spine bone was parented to the PelvisRotHelper
    with the Connected option as shown in Fig. 5.32.


    Finally, the leg bones (Thighs) are parented to the Pelvis bone. This setup creates
    a nice hip sway in that the Pelvis bone''s rotation is located just below the
