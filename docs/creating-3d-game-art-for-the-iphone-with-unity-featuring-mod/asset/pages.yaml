  md: 'Instead of using another format, such as Collada, I opted to separate the mesh
    into layers using the Blender tool set. This is actually extremely easy and more
    efficient than doing it in modo. To separate the mesh into parts, from Edit mode,
    hit the P key and choose “By loose parts,” as shown in Fig. 7.23.


    Once the mesh is separated in to multiple meshes, you’ll need to set the pivot
    point for each mesh so that it’s positioned at this mesh instead of the origin.
    This is also a very easy task. To set the pivot, from Object mode, right-click
    to place the 3D Cursor where you’d like to position the pivot as shown in Fig.
    7.24, and then press Shift + Ctrl + Alt + C and choose “Origin to 3D Cursor,”
    as shown in Fig. 7.25. This will snap the pivot to the 3D Cursor. The pivot needs
    to be set correctly when adjusting the Radius in the Rigid Body settings. Now
    that the pivots are all positioned as shown in Fig. 7.26, we can set up the Rigid
    Body simulation.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_191_0.png)


