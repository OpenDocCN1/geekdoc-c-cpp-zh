  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_79_0.png)


    Fig 3.22 Cutting Various Components from the Source Texture to Patch Together
    the Game Texture Is a Good Way to Quickly Build Up a Map.


    I find that the easiest way to “unfold” a texture to fit the UV map is to simply
    patch it together from various pieces from the source texture as shown in Fig.
    3.22. The trick is to think about the seams of the object and how you can work
    the seams inward to create the texture.


    For instance, with the jean shorts, I used the seam where the jeans were sewed
    together and copied this seam across the UV border. By working with the natural
    seam apparent in the object, you can easily patch the texture together, while
    at the same time hide the seam caused by the UV border. As shown in Fig. 3.22,
    you can see that the natural seams from the actual jean shorts reference image
    are used to hide the UV seams apparent in the UVs for the jean polygons. I used
    this same technique to handle all of Tater’s clothes including the boots. I simply
    used the seams naturally found in the clothes as a starting point and mechanism
    for hiding the UV border seams and created a more realistic texture.


    # Skin Textures


    Utilizing seams obviously won’t work too well with skin. So to handle the face,
    arms, and legs, I began with a seamless patch of skin. I photographed my back
    and then created a seamless texture as shown in Fig. 3.23.'
