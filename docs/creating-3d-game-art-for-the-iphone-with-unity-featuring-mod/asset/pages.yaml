- pgno: 266
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_266_0.png)


    FIG A.22 This is the actual script that is used to parent the gun to Tater''s
    hand bone.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_266_1.png)


    FIG A.23 To create a shadow for Tater, I did not use a Projector. Instead I created
    a simple transparent sprite that was parented to the Tater.'
