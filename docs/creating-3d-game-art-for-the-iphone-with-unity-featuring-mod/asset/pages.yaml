- pgno: 63
  md: 'With this in mind, you have to be aware of each UV seam that you place in your
    map since it will cause an increase in vertex count. UV seams are inevitable,
    but you can control and limit them in your UV layout by combining UVs. It''s vital
    to plan your UV layouts to accomplish this task. You not only have to be aware
    of UV seams, but you must also work to maximize the UV space. You need to arrange
    the most important areas of your mesh to utilize most of the 0-1 UV space, which
    in turn allocates more pixels in the texture map. For example, with a character,
    you might decide that the head is more important in terms of pixel resolution
    than say the character''s hands. This decision would lead you to lay out the head
    UVs to take up more of the 0-1 UV space and thus allocate more texture resolution
    in the map. It also helps to keep in mind areas of your object that may not be
    easily seen by the camera. If you can''t really see it, then there''s no reason
    to waste UV space on it. Let''s look at some examples using Tater and Thumper.


    # ## Creating UVs for Tater


    Once the Tater model was complete, I took a survey of the mesh and made notes
    on the areas that I wanted to be sure to give the most precedence in terms of
    texture resolution. In Fig. 3.3, you can see the completed UV layout for Tater.


    In Tater''s case, I felt that most of the model was equally important. However,
    I decided that I would give the head, arms, and torso a little more UV space than
    the pants, legs, and shoes. The legs and shoes received the least amount of UV
    space since I decided that they wouldn''t be as visible in game as the rest of
    the model. These decisions concluded my first steps in planning my UV map for
    Tater. By breaking the model down into sections of importance, I determined how
    to divide the UVs into separate UV shells or islands.


    Let''s take a look at creating UVs for the shirt. I needed to create a UV layout
    for the shirt that would allow me to easily create a texture map, and at the same
    time, minimize any texture distortion. First, I created an initial projection,
    by using the Project from View tool with the viewport set to Front view as shown
    in Fig. 3.4.


    FIG 3.4 In the Case of the Shirt, I Created an Initial Planar Projection to Get
    Me in the "ballpark" for My Planned UV Layout.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_63_0.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_64_0.png)


    FIG 3.5 I needed to Separate the UVs so that they Could be Properly Relaxed.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_64_1.png)


    FIG 3.6 Using Lock Boundary Works Well in This Type of Situation. We Don''t Want
    to Relax the Border UVs, But Only the Internal UVs and Lock Boundary Does Just
    That.


    I then selected the front of the shirt and used the Move tool with Tear Off enabled
    to separate the UVs into separate UV shells for the front and back of the shirt
    as shown in Fig. 3.5.


    From there, I used the UV Relax tool with Lock Boundary enabled and relaxed each
    UV shell as shown in Fig. 3.6.


    At this point, I have two UV shells for the front and back of the shirt, which
    will allow me to easily texture the shirt. However, I need to do something about
    the UV seams that I have created so that I can inadvertently increase the vertex
    count in my mesh. To eliminate some seams, I need to stitch the two halves of
    the shirt back together. To accomplish this, I selected the back of the shirt
    and used the Mirror UVs tool set to V to flip the UV shell in order to better
    align the two halves for stitching as shown in Fig. 3.7.


    I then used the Move and Sew UVs to stitch the two UV shells together and thus
    eliminate two UV seams as shown in Fig. 3.8.


    Once the two halves were stitched together, I did another UV Relax operation and
    used the Drag tool to fix any overlapping UVs. Looking back to Fig. 3.3, you can
    see the completed UV shell for the shirt. As you can see, the workflow is to create
    UVs that allow for ease of texturing, minimize UV seams by sewing edges together,
    and relax the UVs to remove any possible texture distortion. This is the workflow
    that I followed for all of the UVs in both the Tater and Thumper models.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_65_0.png)


    Fig 3.7 Before You Can Properly See the UVs, You''ll Need to Align the Seams as
    Closely as Possible.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_65_1.png)


    Fig 3.8 By Sewing the Two Halves Together, I Was Able to Remove Two Seams and
    Thus Stop the GPU from Having to Split These Vertices.


    It can also be very useful to overlap certain UV shells. For instance, with Tater''s
    shoes, I decided that they barely be visible in the game, so they are the smallest
    set of UV shells in the UV layout. To further save on space, I went ahead and
    overlapped both of the shoe''s UV shells so they occupied the same UV coordinates.
    This allowed me to save a lot of space in the UV map as shown in Fig. 3.9.


    For both Tater and Thumper, I didn''t have a need for repeating textures. I think
    of these types of objects as having self-contained UVs, which is to say their
    UVs are meant to target specific parts on a single contained mesh. However, in
    contrast, a wall object will need to have its UVs repeat so that the object can
    represent many walls in a tiled fashion.


    # Creating UVs for Thumper


    The UVs for the Thumper model were created in a very similar fashion to Tater.
    In Fig. 3.10, you can see the complete UV layout.


    The UVs for Thumper were meant to occupy targeted areas on a specific mesh, so
    there were no repeating UVs to be concerned with. Again, I started with surveying
    the model and determining which areas are the most important and thus need to
    occupy the most UV space. Areas of the gun that are located underneath the object
    would definitely require less of the 0–1 space. I did follow the basic workflow
    of breaking apart areas of the mesh into separate'
