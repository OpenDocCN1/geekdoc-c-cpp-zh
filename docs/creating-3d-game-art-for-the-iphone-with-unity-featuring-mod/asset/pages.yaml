  md: 'set as Rigid Bodies. In order to accomplish this, we''ll need to set up some
    logic for the simulation, which can be done through the Logic Editor.


    # Setting Up the Logic


    We''ll first set up the logic for the sphere. First, we''ll add a Game Property,
    which I called "col," by clicking the Add Game Property button as shown in Fig.
    7.36. This property will be used later to only trigger the simulation for the
    target pieces when the sphere strikes them.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_197_0.png)


    FIG 7.34 The Ground Is Set to Static.


    For the UV Sphere, we''ll need to create two layers of logic. The first layer
    will suspend the dynamics so when we start the simulation, the gravity won''t
    automatically affect the Rigid Body objects. The second layer, re-enable the dynamics,
    but only after we hit the space bar. In Fig. 7.37, you can see both layers highlighted.
    The first layer consists of an "Always" Sensor, an "And" Controller, and one "Edit
    Object" Actuator set to Suspend Dynamics. As you can see from Fig. 7.37, these
    items are piped together.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_197_1.png)


    FIG 7.35 The Bullet Physics Engine Defaults to 9.8.


    The second layer of logic consists of a "Keyboard" Sensor set to Spacebar, an
    "And" Controller, and two Actuators, an "Edit Object" set to Restore Dynamics
    and a "Motion" Actuator set to simple motion with a value of -2.0 in the Y-axis.
    Again in Fig. 7.37, you can see how this logic is piped together. The second layer
    of logic is stated that when the Spacebar is pressed, dynamics will be restored
    and a motion of -2.0 will be applied to the UV Sphere in the Y-axis, which will
    push the ball into the target.


    Next, we''ll need to set up the logic for each piece of the target. It''s a very
    similar setup in that there are two layers of logic. The first layer will suspend
    the dynamics and the second layer will re-enable the dynamics, but instead of
    using a "Keyboard" Sensor, we''ll use a "Collision" Sensor. The collision event
    will be the UV Sphere colliding with the ball, and we''ll use the "col" Game Property
    set on the UV Sphere to tell our logic that we only want to test for a collision
    with the game object that contains the "col" Game Property, which in our case
    is the UV Sphere. When this collision happens, the second layer of logic will
    re-enable the dynamics, just as we discussed before. In Fig. 7.38, you can see
    the completed logic for the target pieces.'
  merge: -1
  img_proc: true
