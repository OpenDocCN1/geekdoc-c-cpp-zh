    twice as small and we can then simply set the Scale Factor in the FBX Importer
    to 1.0 upon importing into Unity iOS. In Fig. 5.3, you can see a modo-created
    cube exported from Blender and that it matches the default Unity iOS cube''s scale
    exactly with a Scale Factor of 1.0.


