  md: '# Beast Settings


    There are a couple of important settings I''d like to point out in the Bake tab.
    Now, each project will inevitably require a different setup, but I often find
    myself mainly adjusting the Quality, Bounce, Interpolation, and Resolution settings
    to get the detail and quality needed in the bake as shown in Fig. 8.21.


    **Real-Time Lighting**

    Back in Chapter 2, in the section "Using Lights," we discussed that real-time
    lighting can possibly reduce performance. Although it can be best to use real-time
    lighting sparingly, that doesn''t mean you can''t use it. Your game type will
    dictate what can and can''t be done in terms of performance. Remember to always
    test and profile your game and make decisions accordingly.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_219_0.png)


    **FIG 8.21** These Are the Settings I Mainly Check to Adjust Quality.


    The Quality setting is pretty self-explanatory as it simply adjusts the quality
    of the lightmap. A good tip when testing the bake is to lower the Resolution to
    a low value and setting the Quality to Low. This will speed up the bake and allow
    you to quickly see the map applied to the geometry.


    The Quality will also adjust the Final Gather rays that are sent into the scene.
    The more the rays are shot out into the scene, the higher the quality of the indirect
    lighting will be. You can use the Quality presets or manually adjust the ray count.
    The Contrast Threshold and Interpolation also affect the Final Gather solution.
    The Contrast Threshold controls new rays from being created based of a color contrast
    threshold. Higher contrast values will produce smoother but less detailed lightmaps.
    If you are using a lower number of Final Gather rays, then you may need to increase
    the Contrast Threshold to be sure that extra rays are not created. The Interpolation
    controls the smoothing'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'of color values. A value of 0 will produce a linear interpolation while 1 will
    produce a gradient-based interpolation, which can produce artifacts at the cost
    of detail.


    Ambient Occlusion is also an important setting as it can produce subtle occlusion
    shading in your scene. The Max Distance controls how far a ray can travel before
    it''s considered to be not occluded. A value of 0 means that the ray is infinite
    long. Contrast controls the transition between occluded and not occluded rays.
    Ambient Occlusion can provide a nice subtle shading effect to your scene. In Fig.
    8.22, you can see the difference between a scene with Ambient Occlusion and without
    Ambient Occlusion. The difference is subtle. Ambient Occlusion tends to help anchor
    the object in the scene with increased shading in the corner areas where light
    has difficulty reaching.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_220_0.png)


    > FIG 8.22 Here You Can See the Difference between Occlusion On and Off. Notice
    That the Lightmap with Ambient Occlusion Seems to Anchor the Objects, Especially
    in Shadow Areas.


    Something else to consider is that you can compress the lightmaps via the Compression
    toggle on the Maps tab of the Lightmapping Editor. Compression can cause artifacts
    to appear in your maps, as the compression setting toggles PVRTC 4 and RGB16 compression
    on your maps. However, by not compressing the files, you risk eating up texture
    memory. Again, you''ll need to test and profile your game to see which is the
    best route to take in terms of compression.


    # Beast Custom Settings


    At some point, you might find yourself needing to make some custom adjustment
    to the Beast settings. Beast reads baked settings from an XML file, which can
    be edited. From the Lightmap Editor, you can choose to generate a custom Beast
    file as shown in Fig. 8.23. This will add an XML file, which holds all of the
    Beast''s render settings into your lightmaps folder. This XML file allows you
    to make custom adjustments such as Anti-Aliasing Settings and choose a different
    environment type as shown in Fig. 8.24.'
