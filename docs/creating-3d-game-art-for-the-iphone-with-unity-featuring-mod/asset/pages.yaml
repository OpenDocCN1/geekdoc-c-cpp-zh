    # ### Draw Calls


    The draw call can be thought of as a “request” to the GPU to draw the objects
    in your scene and can be the area in which the CPU causes a bottleneck in performance.
    As we''ll discuss in the GPU section, the iPhone and iPad uses OpenGL ES 2.0 (OGLES)
    emulating OGLES 1.1 shaders on the hardware level, and with this implementation,
    vertex data is copied for each draw call on every frame of the game loop. The
    vertex data is the vertices that make up our 3D objects and the information attached
    to each vertex such as position, normal and UV data, just like a 3D mesh''s vertices
    in modo has positional, normal, and UV coordinate data.'
