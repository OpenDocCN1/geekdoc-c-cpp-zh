- pgno: 98
  md: 'out the unit to pixel ratio so that you can be assured that your mapping and
    texture resolution is as efficient as possible.


    Now, using Mip maps can help with texture memory as their purpose is to replace
    a texture with a lower resolution copy of the image the further the camera is
    away from that texture. However, you get the side effect of having blurry textures
    in your scene, which I really don''t like. If you''re working on the grid, you
    can manually create this effect by being sure that your meshes are using only
    a specific and proportional section of the texture atlas. Again, you''re not wasting
    any resolution, and the texture coordinates map to the specific area of the atlas,
    which directly relates as a 1 to 1 relationship between the meshes size in units
    and the texture size in pixels.


    Finally, the third reason is that objects can be tiled. You can make new and different
    configurations of objects via connecting the tiles, which results in objects being
    part of a reusable library of elements as was shown in Fig. 4.4.


    # **Does It Make Sense to Use the Grid?**


    When creating Tater and Thumper, we didn''t use the grid. Not every object in
    your game makes sense to build on a grid. Organic type models don''t work too
    well using the grid methodology. Again, we have to come back to every game being
    different and having its own set of requirements. It helps to know the different
    methodologies available so you can make the appropriate decisions for your own
    projects. The one thing that''s common to all game projects is optimization. You
    need to always be thinking about the best ways to optimize your graphics, and
    building on the grid is just another way to help you accomplish this task.


    # **Determining Working Texture Size**


    So, we''ve talked about building on the grid, but we really haven''t gotten into
    the particular process. To begin, we need to determine a working texture size
    that will be used in modo to establish our ratio between units in 3D space to
    pixels in our texture atlas. In Chapter 2, I mentioned that our Unit System in
    modo was set to Game Units and the Meters per Game Unit setting was set to 1.0.
    This means that we''ve determined that 1 square in modo''s Grid and Workplane
    is equal to 1 unit. For building on the grid, we need to take this one step further
    and create another relationship between the grid and the Game Unit Setting in
    modo. We need to assign, in a theoretical sense, a texture resolution to a game
    unit. For example, I chose 128 pixels as my working texture size, which means
    I will now think of each game unit/meter in modo as representing 128 pixels. That
    is to say, in modo, I can reference my working texture size as 128 pixels per
    meter. Let''s look at an example to illustrate this relationship. In Fig. 4.14,
    you can see that I have a single ground polygon selected, and with the Dimensions
    tool active, I can see this polygon is 4 × 4 game units or 4 × 4 m. If I take
    128 times 4, I will get 512, which as you can also see in Fig. 4.14 is the exact
    size in pixels that the ground texture contains in the level texture atlas. You
    can now see that the single ground'
