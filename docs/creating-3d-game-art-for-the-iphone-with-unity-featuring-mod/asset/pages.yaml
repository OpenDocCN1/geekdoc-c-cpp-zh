- pgno: 40
  md: 'looking to create bares a lot of weight in regards to how you determine your
    vertex budget. For instance, if you''re game is heavy on rendering such as by
    utilizing lots of objects in the scene, then you''ll need to cut back on physics
    simulations. But by that same token, a heavy physics-based game will demand more
    resources from CPU and thus call for smaller vertex counts and less objects in
    your scene in order to balance the overall performance of the game. It''s a give
    and take, and the type of game you''re creating will dictate this balance. This
    is why Chapter 1, “Getting to Know the iDevice Hardware and Unity iOS,” was dedicated
    to the iDevice hardware as understanding what the hardware is capable of and its
    limitations are vital when building your content.


    # ### Creating a Performance Test Scene


    When you''re in the early stages of developing your game, it can be extremely
    helpful to create a performance scene to test the capabilities of the hardware.
    For instance, for the book''s game demo and coming from the perspective of a 3D
    artist, I wanted to concentrate on rendering the 3D assets. This was my primary
    goal, and I established early on that I wanted to spend the bulk of my timeframe
    spent rendering. I also decided that I wanted my game to maintain a frame rate
    of 30 fps. With this goal set, I created a demo scene that I could install on
    the iPhone and iPad in order to test the performance and see how far I could push
    the hardware.


