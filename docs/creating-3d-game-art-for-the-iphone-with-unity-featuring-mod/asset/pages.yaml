    # *Disable Optimize Keyframes and Selected Objects*


    One final thing I want to mention in regards to exporting an FBX file from Blender
    is to be sure to deselect both the Selected Objects and Optimize Keyframes options
    in the FBX export dialog as shown in Fig. 6.48. The Selected Objects will only
    export the selected objects in your scene, and I find that more times than not,
    this is a hassle as you think everything is selected when exporting only to find
    that something is missing like your mesh when you import the file into Unity iOS.
    You can quickly deselect the unnecessary scene items such as Cameras and Lamps
    in the FBX export dialog. If you look back at Fig. 6.49, you can see that I''ve
    deselected Cameras, Lamps, and Empties from the export, as I don''t need these
    items in Unity iOS.


    The Optimize Keyframe setting is a big one. This option is supposed to remove
    double keyframes and should be harmless; but from my experience, this option almost
    always removes important keyframes and causes major issues when the FBX animation
    is played in Unity iOS or opened in any other 3D package for that matter. For
    example, in Fig. 6.49, you can see that with Optimize Keyframes enabled, the animation
    from Blender comes in with major distortions as important keyframes have been
    removed.


