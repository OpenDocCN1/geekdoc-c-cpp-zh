- pgno: 164
  md: '# Creating an Animation Cycle


    In this section, I''d like to discuss the process of setting up an animation cycle
    such as a Tater''s run. However, first I''d like to discuss setting the frame
    rate for your project. In Blender 2.5, you can set the frame rate in the Render
    Properties under the Dimensions Category as shown in Fig. 6.38.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_164_0.png)


    FIG 6.38 The Frame Rate Is Set in Blender to 30 FPS, Which Matches My Game Project''s
    Target Frame Rate.


    Since I am targeting a rate of 30 FPS in my game, I''ve also chosen to animate
    at 30 FPS in Blender. Remember, your game''s frame rate isn''t something that
    is set in Unity-iOS, but it''s the overall time it takes to render a frame and
    is dictated'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'by the “frametime” variable in the Unity iOS Internal Profiler, which can be
    activated in Xcode. As we discussed way back in Chapter 1, your game’s frame rate
    is something that you determine for your project and is used as a benchmark so
    to speak throughout your entire project as it becomes the baseline value for not
    only profiling your game but working with animations as well.


    When creating any type of cyclic animation, such as a walk or run, you need to
    make sure that the first and last keyframes are the same as shown in Fig. 6.39.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_165_0.png)


    **FIG 6.39** The First and Last Keyframes Have Been Highlighted to Show that They
    Are Identical for Looping the Animation.


    Since, I’ve utilized layers in my Armature and placed all of the bones that would
    be keyframed in one layer, I can now quickly set and clear keyframes. For instance,
    in Fig. 6.40, you can see that I can quickly perform a bounding selection and
    hit the I key to set a keyframe for the location and rotation. It’s important
    to note that I am only keyframing the location and rotation and I’m not setting
    a keyframe for the scale. I’m not going to be doing any scaling on these bones,
    and because of this, I don’t want to set keyframe data for the scale if it’s not
    absolutely going to be used in the animation. This is important in regards to
    performance as its less keyframe data that Unity iOS has to interpolate.


