    # Editing the Animation with the NLA Editor


    We’re almost finished prepping the animation. There’s one last thing to fix and
    that’s the frame rate. The Bullet Engine defaults to running at 60 FPS as shown
    in Fig. 7.44; however, for our animation needs, we need our baked animation to
    run at 30 FPS. If we were to export the animation as is, it would run 2X slower
    than needed and look like the target is exploding in slow motion. This is definitely
    an issue that needs some attention.


    You could simply adjust the FPS setting to 30, but I found that this didn’t produce
    a good enough physics simulation. So, we are going to rely on the NLA Editor yet
    again to scale the animation to an appropriate speed. If you go to the NLA Editor,
    you will see that an Action has been created by default for each object as shown
    in Fig. 7.45. Blender has made it nice and easy


