  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_195_0.png)


    **FIG 7.29** The Rendering Engine Is Set to Blender Game at the top of the UI.


    Now that all of the objects are in place, we''ll start configuring the appropriate
    meshes to be a Rigid Body. First, set the engine for rendering to Blender Game
    as shown in Fig. 7.29.


    We''ll configure the sphere first. With the sphere selected, go to the Physics
    tab on the Properties panel and set the Physics Type to Rigid Body as shown in
    Fig. 7.30.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_195_1.png)


    **FIG 7.30** This Image Shows the Physics Type Set to Rigid Body on the Physics
    Tab.


    In the Physics tab, you can set the properties for the Rigid Body such as Mass
    and Radius. The Radius is an important setting as it pertains to the area of influence
    the Rigid Body will have on the scene. For the sphere, which represents the blast
    zone, the Radius was set rather high to make sure it effects the entire board
    as shown in Fig. 7.31.


    You''ll also need to make sure that the Collision Bounds is active and that the
    Bounds mode is set correctly for the object it represents. For the sphere, I choose
    the Sphere setting for the Bounds to match the Rigid Body''s shape to the actual
    mesh it''s applied to as shown in Fig. 7.32.


    I then repeated this procedure of making each piece of the board a Rigid Body.
    However, for the piece meshes, I increased the Mass and lowered the Radius so
    that it only encompassed the bounding area of the mesh as shown in Fig. 7.33.
    This is important because if the Radius is too high, each piece would instantly
    affect the other pieces, pushing them apart as soon


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_195_2.png)


    **FIG 7.31** The Radius Is Visualized in the Viewport as a Dashed Circle'
