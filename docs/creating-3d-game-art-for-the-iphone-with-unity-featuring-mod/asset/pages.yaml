- pgno: 250
  md: '# Optimizing Your Game


    In this section, we''ll look at some additional ways that we can further optimize
    our game by editing the generated Xcode project that Unity iOS creates when you
    build your application.


    # Tuning Main Loop Performance


    You can set how many times your game will execute its rendering loop. By default,
    it''s set and capped at 30 FPS. You can change this value to render at different
    frame rates such as 60 FPS. However, if you increase the value, rendering will
    be prioritized over other activities such as accelerometer processing and touch
    input. Performance always comes as a give and take, so you''ll have to experiment
    with this value to see what works best for your game.


    In order to change the frame rate, you select the AppController.mm file and change
    the #define kFPS value to new frame rate such as 60.0 as shown in Fig. 9.31.


    # Tuning Accelerometer Processing Frequency


    If your game uses a lot of accelerometer input, this could have a negative impact
    on the overall performance. By default, Unity iOS will query the accelerometer
    input 60 times per second. You may be able to gain some extra


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_250_0.png)


    FIG 9.31 The #define kFPS Variable Will Allow You to Set the Desired Frame Rate.'
