- pgno: 51
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_51_0.png)


    FIG 2.14 A Discontinuous UV Pair is Shown by the Blue-Highlighted Edges. The Blue
    Shading of the Edge Indicates the Vertices that Are Discontinuous.


    the number of vertices that need to be processed and the number of pixels that
    have to be drawn. Even when additional lights don''t cause additional draw calls
    (for example, in VertexLit mode), they are still not free. For example, in VertexLit
    shaders, more lights equal the same number of draw calls and vertices to process,
    but each vertex has to do more computations. This makes it more expensive. Even
    in deferred rendering, assuming all objects are rendered in deferred, every light
    will increase the reported vertex count slightly because every light has some
    additional geometry to rasterize in order to run the lighting shader. For example,
    importing in a single quad polygon space and adding a light would double the vertex
    count from 4 to 8.


    It''s best to minimize the usage of lights in your scene or even better, not use
    them at all. Instead, it''s a good idea to bake scene lighting into the diffuse
    texture map or use a lightmap and apply it with one of the iPhone lightmap shaders
    that ship with Unity.


    In Chapter 8, "Creating Lightmaps Using Beast," we''ll discuss the usage of lightmaps
    using Beast in Unity iOS.


    # ## Modeling Tater and Thumper


    In this section, we''re going to take a look at how I created Tater and Thumper.
    We''re going to discuss the important aspects of the process beginning with my
    workflow for creating objects for the iDevices. In Chapter 3,'
