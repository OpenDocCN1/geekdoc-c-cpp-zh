- pgno: 31
  md: '**FIG 1.10** You Can Monitor the Memory Using the Unity iOS Internal Profiler
    in Xcode


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_31_0.png)


    Also, you can use the Unity iOS Internal Profiler to check the memory usage when
    profiling your game''s performance in Xcode as shown in Fig. 1.10.


    It can be helpful to understand how the texture size translates into texture memory.
    It''s basically the count of the total number of pixels in the image, multiplied
    by the number of bits in each pixel. For instance, a 1 K texture contains 1,048,576
    pixels (1024 times 1024). You can then multiply this number by 24 bits per pixel
    (1,048,576 times 24) to get 25,165,824 pixels in the entire image. Finally, divide
    this number by the bits in each byte, which would be 8 (25,165,824 bits / 8 bits
    in a byte) to get 3,145,728 or roughly 3 MB per 1 K textures. Now, this doesn''t
    account for compression, so if we compress this texture in Unity iOS using the
    Texture Importer to PVRTC 4-bit, we can then reduce this amount of memory to 0.5
    MB with negligible difference.


    # ### OpenGL ES


    OpenGL ES is a subset application programming interface (API) of OpenGL and is
    used on all iPhone OS devices since its core design is for use with mobile technology.


    I''ve already mentioned that the SGX535 supports OpenGL ES 2.0. What this really
    boils down to with Unity iOS on the iPhone is the type of shaders you''re able
    to use in your Unity iOS projects. Unity iOS will allow you to build for both
    OpenGL ES versions 1.1 and 2.0. This allows you to build different Unity iOS scenes,
    which target different devices and OpenGL ES version, and at run time load a specific
    OpenGL scene based on the iPhone device running the game.


    The difference between OpenGL ES 1.1 and 2.0 is that version 1.1 supports a fixed-function
    graphics pipeline (FFP) and version 2.0 supports a fully programmable graphics
    pipeline (FPP). Again, what this basically dictates is the type of shader you
    can utilize or write for your game.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Fixed-Function Pipeline


    A FFP uses “fixed” or predefined functionality throughout the various stages of
    the pipeline, which include the command processing, 3D transformations, lighting
    calculations, rasterization, fog, and depth testing. You have the ability to enable
    or disable parts of the pipeline as well as configure various parameters, but
    the calculations or algorithms are predefined and cannot be changed.


    # Fully Programmable Pipeline


    A FPP replaces many of the “fixed” stages of the FFP with fully programmable stages.
    This allows you to write the code that will perform the calculations for each
    stage in the programmable pipeline. A FPP opens the door for enhanced shaders
    for your games as well as increased optimizations due to the fact that complex
    algorithms can be executed in a single pass on the shader and will definitely
    save on important CPU cycles. In Fig. 1.11, you can see a diagram of both pipelines.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_32_0.png)


    **FIG 1.11** This Diagram Illustrates the Different Pipelines Available in OpenGL
    ES 1.1 and 2.0 Versions.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# ### Texturing


    It’s very important to get your texture sizes down for the iPhone since the texture
    cache on board is small. The TBDR renderer is optimized to handle the texture
    cache efficiently, but you still must keep a close eye on your texture sizes and
    compress them to bring down the size. The iPhone uses a hardware compression scheme
    called PVRTC, which allows you to compress to 2 or 4 bits per pixel. This compression
    will help to reduce memory bandwidth. When you’re working out of your memory budget
    for textures, you’ll need to make some decisions on how to compress your textures.
    In Unity iOS, you can set the texture compression for your texture assets in the
    setting menu as shown in Fig. 1.12. However, in order for your textures to compress,
    they need to be in a power of 2, i.e., 1024 × 1024, 512 × 512, and so on.


    Texture compression is also important since the memory on the iPhone is shared
    between the CPU and GPU as mentioned earlier. If your textures begin to take up
    most of the memory, you can quickly become in danger of your game crashing on
    the iPhone.


    **Texture Units** With OpenGL ES 1.1, you only have two texture units (TUs) available,
    and with OpenGL ES 2.0, you can have up to eight texture units


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_33_0.png)


    **FIG 1.12** You Don’t Need to Compress Your Textures Outside of Unity iOS. Texture
    Compression Can Be Set per Texture in Unity iOS.'
  merge: -1
