- pgno: 23
  md: '# Game Loop


    Inside the Unity iOS game loop is where the game components of our game are updated.
    The game loop is always running regardless of user input. From a 3D artist’s perspective,
    you can think of the game loop as an animation in a 3D animation, your scene runs
    at a given frame rate, and in each frame of the animation, something is calculated
    such as a key-frame interpolation. A game engine''s game loop is basically doing
    the same thing.


    The vertex data is transformed or moved in 3D space on the CPU. The result of
    this transformation is appended to an internal vertex buffer. This vertex buffer
    is like a big list or a container that holds all of the vertex data. Since the
    vertex data is copied on the CPU, this takes up around one third of the frame
    time on the CPU side, which wastes memory bandwidth due to the fact that the iPhone
    shares its memory between the CPU and GPU. On the iPhone and iPad, we need to
    pay close attention to the vertex count of our objects and keep this count as
    low as possible as the vertex count is more important than actual triangles count.
    As you''ll read in Chapter 2, we''ll talk about how to determine what the maximum
    number of vertices you can render per individual frame.


    I used to get confused by the “per frame” section of that statement. It helped
    me as a 3D artist to think about my game scene just like a scene in modo. For
    instance, if I have an animation setup in modo, the render camera will render
    the portion of that scene that the camera can see in its view frustum as set in
    the camera’s properties, for each frame of the animation. The same is true in
    Unity iOS. In Fig. 1.2, you can see an illustration that depicts the way in which
    I visualize a scene’s total vertex count per frame.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_23_0.png)


    **FIG 1.2** In This Image, the yellow highlighted Areas Represent the Camera’s
    View Frustum and the Vertices Visible per Frame.'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'With each frame of the game loop, only a certain amount of vertices are visible
    within the camera''s view frustum for a given frame, and within this frame, we
    should keep the vertex count for all of the objects in the scene to around 10
    k. Now, this is a suggestion as to what works best on the iDevice hardware, but
    depending on your game and game content, this could possibly be pushed. The point
    being, with game development, there aren''t any absolute answers when it comes
    to optimization. You have to optimize content to your game''s performance standards,
    i.e., your frame rate budget. There are a lot of techniques to optimizing our
    vertex count as we''ll discuss in the modeling chapters, and there are also rendering
    optimizations for the camera''s view such as occlusion culling for controlling
    vertices that are sent to the vertex buffer.


    It''s obvious that the faster the CPU, the faster the calculations are going to
    be. However, just because you have more power doesn''t necessarily mean you should
    throw more vertices to the system without regard to other performance considerations
    such as pixel fill rate as we''ll discuss later in this chapter.


    # ### Batching


    Batching is a means to automatically reduce draw calls in your scene. There are
    two methods in Unity iOS, which are dynamic and static batching. It''s important
    to note that draw calls are a performance bottleneck that can largely be dependent
    on the CPU. Draw calls are generated each time the CPU needs to send data to the
    GPU for rendering. The GPU is very fast at processing large amounts of data; however,
    they aren''t very good at switching what they''re doing on a per-frame basis.
    This is why batching is good since it sends a large amount of data to be processed
    at one time. With that said, it always best to test both the CPU and GPU when
    determining bottlenecks as if your device has fill rate issues, which can be found
    on the iPad or iPhone 4, then the draw call bottleneck can get shifted to the
    GPU.


    # ### Dynamic Batching


    Here is how dynamic batching works at run time.


    +   1. Group visible objects in the scene by material and sort them.

    +       a. If the objects in this sorted group have the same material, Unity iOS
    will then apply transformations to every vertex on CPU. Setting the transform
    is not done on the GPU.

    +       b. Append results to a temporarily internal dynamic vertex buffer.

    +   2. Set the material and shader for the group only once.

    +   3. Draw the combined geometry only once.


    Both the vertex transformation and draw calls are taxing on the CPU side. The
    single instruction, multiple data (SIMD) coprocessor found on the iDevices supports
    vector floating point (VFP) extension of the ARM architecture, which handles the
    vertex transformations, thanks to some optimized routines in Unity iOS written
    to take advantage of the VFP coprocessor. The VFP coprocessor is actually working
    faster than the GPU and thus is used by Unity iOS to gain performance in batching
    objects to reduce draw calls.'
  merge: -1
  img_proc: true
