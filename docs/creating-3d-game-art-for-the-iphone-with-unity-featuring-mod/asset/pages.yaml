- pgno: 68
  md: '![](img/d3e3fa4010906e98ec76be003a6e31c2_68_0.png)


    FIG 3.12 The Handle Is Neatly Unwrapped and It''s Also Still Connected to the
    Gun, Which Keeps More UVs Continuous.


    # ## Use Unwrap Tool or Manual Projections


    The Unwrap tool can be very helpful for quickly unwrapping a mesh. However, there
    are times with a complicated mesh that it can be difficult to figure out exactly
    how to select seams in order to get a clean unwrap. Also, you may find that when
    using the Unwrap tool, your UVs aren''t being unwrapped in the most optimal way
    in regards to how you will be texturing in Photoshop. When I get into situations
    like this, I will create several smaller planar projections of the object and
    then manually stitch them together using the Move and Sew tools as we''ve discussed
    throughout this chapter. Sometimes, it''s just easier to get your head around
    unwrapping the mesh so to speak by manually flattening the UVs via planar projections
    and then stitching them back manually.


    ![](img/d3e3fa4010906e98ec76be003a6e31c2_68_1.png)


    FIG 3.13 These Selected Polygons Were Manually Unwrapped.


    optimize your UVs depends on your game content and the type of game you''re creating.
    The workflow that I stick to in creating content always begins with surveying
    the mesh and planning a UV layout. From there, I begin basic unwraps and then
    minimize UV seams. Rinse and repeat. In the'
