    # HTML5 CANVAS LINEAR GRADIENTS


    HTML5 Canvas provides two primary types of color gradients (similar to SVG and
    CSS3): linear gradients and radial gradients.


    Linear color gradients can be further sub-divided into three types: horizontal
    gradients, vertical gradients, and diagonal linear gradients. Thus, HTML5 Canvas
    provides color gradients that enable you to create pleasing visual effects.


    A linear gradient is defined in terms of addColorStop elements, which contains
    a decimal (between 0 and 1) and a hexadecimal value that represents a color. For
    example, if you define a linear gradient with an initial color of #FF0000 (the
    hexadecimal value for red) and a final color of #000000 (the hexadecimal value
    for black), then the resultant color gradient will range (in a linear fashion)
    from red to black. Linear gradients enable you to create vivid and interesting
    color combinations, and they are available in three varieties: horizontal, vertical,
    and diagonal. Note that “linear gradient” and “linear color gradient” are used
    interchangeably in this book.


    # Horizontal, Vertical, and Diagonal Linear Gradients


    As learned in the introduction of this chapter, HTML5 Canvas supports the method
    createLinearGradient() that you can use to programmatically create linear gradients,
    and its syntax looks like:


    ```

    context.createLinearGradient(startX, startY, endX, endY);

    ```


