    lowing website, the average Web page is 1.8 megabytes, with 60% of the size resulting
    from images: http://httparchive.org/interesting.php.


    Performance can be improved via several techniques, such as format choice (discussed
    in another section). CSS spritesheets, preprocessing, deferred loading, caching,
    and CDNs. The following subsections discuss the first two techniques.


    # Selecting a File Format


    As you know, SVG is a vector-based format, whereas other file formats binary data.
    Despite the advantages of SVG, there are several performance-related points to
    keep in mind. First, the process of rendering SVG in browser is slower (particularly
    because of the conversion process) than small binary files. Second, bitmaps on
    mobile devices involve the GPU, whereas SVG on mobile devices does not always
    involve the GPU. Third, use a tool for optimizing SVG files (as well as binary
    files).


    With the preceding points in mind, SVG is well-suited for assets in a Web page
    that need to be scalable (SVG will render them without "jaggies"). If scalability
    is not a requirement, then PNG files are an option. JPEG files are well-suited
    for photographs.


    A good description of various file formats (and their trade-offs) is available
    here: https://forums.adobe.com/thread/1640828.


    # Optimizing SVG and Binary Files


    The following website is useful for optimizing SVG files (and provides downloadable
    command-line versions of the tool): https://github.com/jakearchibald/svggo.


    You can also optimize binary assets using command-line tools such as this: https://imageoptim.com/command-line.html.


    The following link contains a tabular-based comparison of the compression rates
    of binary files by several tools: http://jamiemason.github.io/ImageOptimizingCLI.


    # CSS Spritesheets


    CSS spritesheets involve the creation of one binary image that contains multiple
    binary images. Only a single HTTP request is required for downloading one spritesheet,
    which is more efficient than multiple HTTP requests for downloading the individual
    images separately.


    A particular image in a spritesheet is rendered in a Web page by specifying the
    relative offset of the image in the spritesheet. Manually calculating the offsets
    is tedious and error-prone process. Fortunately, there are online tools that create
    spritesheets and automatically calculate the necessary offsets for the individual
    images. One commercial tool (USD 20 for a single user) is Zwoptex, and its home
    page is here: https://zwoptex.com/zwoptex/


    SpriteMe is a free tool for generating spritesheets and the accompanying CSS,
    and its home page is here: www.spritem.org.'
