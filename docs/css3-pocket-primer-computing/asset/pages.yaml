  md: '# SVG ESSENTIALS


    This fast-paced chapter delves into many features of SVG, which is an XML-based
    technology for rendering 2D shapes. Entire books have been written about SVG,
    and one chapter about SVG is not enough to become really proficient. As a sort
    of compromise, the code samples contain multiple SVG features that will save you
    time from having to develop them by yourself. For instance, the code sample contains
    SVG transforms and gradients does not provide a detailed description of these
    SVG features because you have already encountered transforms and gradients in
    the first chapters of this book. Consequently, you already know the concepts,
    and it''s primarily a case of learning the syntax for creating such effects. At
    the same time, feel free to focus on the sections that illustrate the features
    that are of greatest interest to you.


    In case you already know, SVG has recently become the focus of considerable interest
    in Web development, in part because its feature set works well with CSS. In addition
    you can use SVG instead of PNG files (discussed in Chapter 8). SVG also provides
    functionality that is unavailable in CSS, such as support for arbitrary polygons,
    elliptic arcs, and quadratic and cubic Bezier curves. Moreover, you can easily
    combine SVG with CSS selectors in order to create 3D graphics and animation effects.


    The first part of this chapter contains code samples that illustrate how to render
    lines and rectangles, and also how to create linear and radial gradients. The
    second part of this chapter discusses polygonal shapes and the highly versatile
    SVG <path> element.


    The third section contains Bezier curves with SVG transforms, how to render text
    in SVG, and SVG filters. The final section contains examples of working with various
    combinations of SVG, CSS3, and jQuery, followed by a brief comparison of SVG and
    CSS3.'
