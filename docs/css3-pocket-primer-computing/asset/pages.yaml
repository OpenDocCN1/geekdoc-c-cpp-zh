  md: "# SVG Essentials • 135\n\nYou can specify larger values for the stdDeviation\
    \ attribute if you want to create \"diffuse\" filter effects.\n\nThe first SVG\
    \ <text> element that is contained in the SVG g element renders a normal text\
    \ string, whereas the second <text> element contains a filter attribute that references\
    \ the filter (defined in the SVG <defs> element) in order to render the same text\
    \ specifically, as shown here:\n\n```\nfilter=\"url(#blurFilter1)\" \n```\n\n\
    Figure 7.8 displays the result of rendering BlurFilterText1.svg, which creates\
    \ a filter effect.\n\n# # Normal Text\n\n# # Blurred Text\n\nFIGURE 7.8 SVG filter\
    \ effect.\n\nA GitHub repository with fun examples of SVG filters is here: https://github.com/opencamato/svg-filters-graphics.\n\
    \nAn extensive article that discusses SVG filters is here: http://www.smashingmagazine.com/2015/05/why-the-svg-filter-is-awesome/\n\
    \nA tabular list of support for SVG filters in modern browsers is here: http://canius.com/#feat=svg-filters.\n\
    \n# SVG TRANSFORMS AND GRADIENTS\n\nEarlier in this chapter you saw some examples\
    \ of SVG transform effects. In addition to the SVG functions scale(), translate(),\
    \ and rotate(), SVG provides the skew() function to create skew effects.\n\nListing\
    \ 7.9 displays the contents of TransformEffects1.svg, which illustrates how to\
