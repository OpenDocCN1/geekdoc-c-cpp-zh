    # CSS FILTERS


    A filter is something that you create when you apply a operation on an element
    in an HTML Web page. Filters can take zero or more input images, and possibly
    some parameters. The output image is either displayed in an HTML Web page, or
    it can be used as the input for another filter effect, or provided as a CSS image
    value.'
