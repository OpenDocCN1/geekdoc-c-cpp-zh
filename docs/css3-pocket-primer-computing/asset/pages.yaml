  md: '# DESIGNING MOBILE APPS


    The purpose of this chapter is to provide some guidelines for designing good HTML5
    mobile applications. This chapter discusses aspects of the UI experience, and
    how to create aesthetically appealing mobile Web applications. In addition, this
    chapter covers some of the toolkits that can help you support the desired functionality
    without sacrificing important design considerations. Some of the sections in this
    chapter involve CSS3 Media Queries from Chapter 5, so you might need to review
    the relevant sections of chapter prior to reading some of the sections in this
    chapter.


    The first part of this chapter discusses some of the major aspects of the mobile
    metaphor, which is touch-oriented instead of mouse-oriented. The second part of
    this chapter delves into design-related aspects of mobile forms. The final portion
    of this chapter discusses Google AMP (Accelerated Mobile Pages) and Progressive
    Mobile Apps (also developed by Google). Although Google AMP is still a new technology,
    it''s relevant because Google AMP supports CSS as most SVG elements.


    Keep in mind the following points when you read this chapter. First, this chapter
    contains almost no code samples because its focus is stylistic considerations.
    Second, this chapter does not delve into toolkits for creating hybrid mobile applications
    (a detailed discussion is beyond the scope of this book). However, PhoneGap (Cordova)
    is a very popular toolkit, and it has influenced other mobile toolkits. Ionic
    (acquired by IBM) is a toolkit that uses Angular 2 for creating hybrid mobile
    applications and also uses PhoneGap internally. Lots of online resources are available
    for PhoneGap, Ionic, and other toolkits for hybrid mobile applications.


    Incidentally, PhoneGap and Ionic applications rely on a DOM structure, but there
    are toolkits and products for developing mobile applications that do not use a
    DOM. In particular, React Native from Facebook and Xamarin (ac-'
