    # HTML5 AND VARIOUS WORKING GROUPS


    The W3C (World Wide Web Consortium), the WHATWG (Web Hypertext Application Working
    Group), and the DAP (Device APIs Working Group) are organizations that provide
    the specifications and APIs for HTML5 and mobile devices that are covered in this
    book. In addition, the IETF (Internet Engineering Task Force) handles the networking
    standards (such as WebSockets, SPDY, CORS, and so forth), but not the actual APIs
    and its page is here: https://www.ietf.org/


    The W3C is an international community for various membership, companies, and organizations
    to work together in order to develop Web standards. The W3C is directed by Web
    inventor Tim Berners-Lee and CEO Jeffrey Jaffe, and its home page is here: http://www.w3.org.


    Every proposal submitted to the W3C undergoes the following sequence to become
    a W3C Recommendation:


    +   - Working Draft (WD)

    - Candidate Recommendation (CR)

    - Proposed Recommendation (PR)

    - W3C Recommendation (REC)

    - Later revisions


    The HTML5-related technologies (listed earlier in this chapter) that have been
    submitted to the W3C are in different stages of the W3C “evaluation” process.
    In essence, the WHATWG has the master specification, which the W3C HTML Working
    Group takes as the foundation for the “official” specification. The W3C synchronizes
    its work with the WHATWG, mostly reformatting to match its publication style (including
    breaking into sub-specifications.)'
