    \nFIGURE 3.4 CSS3 bouncing animation effect.\n\nIn addition to CSS3 keyframes,\
    \ you can use CSS Motion Paths in order to create animation effects, as discussed\
    \ in the next section.\n\n# CSS MOTION PATHS\n\nCSS Motion Paths are currently\
    \ under development, and offer tremendous potential in creating complex animation\
    \ effects in pure CSS3. CSS Motion Paths allow authors to animate any graphical\
    \ object along an author-specified path. You define a CSS Motion Path in a CSS\
    \ selector by specifying the motion-path property, whose value is an actual path\
    \ in the path() function. CSS Motion Paths support four properties: motion (a\
    \ shorthand for motion-path), motion-offset (a position on a motion-path), motion-path\
    \ (SVG-path for animation), and motion-rotation (the direction of an element on\
    \ a motion-path)."
