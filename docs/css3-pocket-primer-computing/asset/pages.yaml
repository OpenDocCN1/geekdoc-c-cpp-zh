  md: '# HTML Features


    There is one other point to keep in mind: (the predecessor to HTML5) was introduced
    in 1999, so HTML5 represents the largest advance in HTML in years, and perhaps
    the inclusion of other technologies was inevitable. There is a great deal of excitement
    surrounding HTML5. Indeed, the enthusiasm for HTML5 has accelerated the speed
    with which HTML became a formal specification based on standards.


    # Browser Support for HTML5


    The WebKit-based browsers (Chrome and Safari), as well as Firefox, Opera, IE10,
    and Microsoft Edge support many HTML features, desktops as well as mobile devices.
    For mobile devices, a very good website that lists the HTML features (including
    the ones that have been discussed in this chapter) is:


    ```

    http://mobilehtml5/

    ```


    Currently Safari on iOS supports twenty-eight features whereas Android supports
    twenty-four features (other browsers are listed as well).

    Another good website provides test results of HTML-related features on various
    mobile devices is:


    ```

    http://www.quirksmode.org/mobile/

    ```


    The preceding website is maintained by Peter Paul Koch (who is often called PPK),
    and he maintains websites with many test results, along with blog posts expressing
    his views over trends in HTML5 and the mobile space.


    # WHICH TECHNOLOGIES ARE INCLUDED IN HTML5?


    The following list contains a combination of technologies that are formally included
    in the HTML5 specification, as well as other technologies that are frequently
    associated with HTML5:


    +   * Canvas 2D

    * CSS3

    * Drag-and-Drop (DnD)

    * File API

    * Geolocation

    * Microdata

    * Offline Applications

    * Server Sent Events (SSE)

    * SVG

    * Web Intents

    * Web Messaging

    * Web Storage

    * Web Socks

    * Web Workers'
