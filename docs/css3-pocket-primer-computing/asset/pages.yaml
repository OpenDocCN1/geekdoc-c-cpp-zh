  md: '# 4 CSS3 Pocket Primer


    There are other technologies often associated with HTML5, including WebGL, XHR
    (XMLHttpRequest Level 2).

    Keep in mind that the status of some of these technologies will change, be sure
    to visit the link with the details of the W3C specification for each of these
    technologies in order to find their most recent status.


    # DIFFERENCES BETWEEN HTML4 TAGS AND HTML5 TAGS


    Broadly speaking, HTML5 differs from earlier versions of HTML in the following
    ways:


    +   * Does not support HTML4.x elements

    * Provides support for new elements

    * Simplifies some existing elements

    * Includes support for custom attributes


    The following are new elements in HTML5: `<article>, <aside>, <audio>, <canvas>,
    <command>, <datalist>, <details>, <dialog>, <figure>, <footer>, <header>, <keygen>,
    <mark>, <meter>, <nav>, <output>, <progress>, <rt>, <ruby>, <section>, <source>,
    <time>,` <video>.


    The elements that are not recommended for work in HTML5 (of which have been replaced
    with CSS styling) `<acronym>, <applet>, <basefont>, <big>, <center>, <font>, <frame>,
    <frameset>, <noframes>, <s>, <strike>, <tt>, and <u>`.


    You are already aware of the new HTML5 `<audio>` element and HTML5 `<video>` element,
    and later in this chapter you will see examples of how to use these elements in
    HTML5 websites.


    One important new HTML5 feature is custom data attributes, which have a `data-`
    prefix. This support for custom data attributes provides HTML5 markup with the
    functionality that is available in XML, which enables code to process custom tags
    and their values and also pass validation at the same time.


    If you want additional details, a full list of the differences between HTML5 and
    HTML4 is in the following W3C document:

    `http://dev.w3.org/html5/html4-differences/`


