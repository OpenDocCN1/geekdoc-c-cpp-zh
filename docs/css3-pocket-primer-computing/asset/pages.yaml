  md: "# 64 CSS Pocket Primer\n\n```\ndiv:hover {\n  width: 300px;\n}\n</style>\n\
    </head>\n<body>\n<p>Hover over the following div element:</p>\n<div></div>\n</body>\n\
    </html>\n```\n\nListing 4.3 contains a <style> element that contains a CSS selector\
    \ that matches HTML <div> elements. This selector specifies several CSS properties,\
    \ including a transition property. The <style> element also contains a selector\
    \ that matches \"hover\" events over <div> elements. In this case, the width of\
    \ the <div> element is increased to 300px. The final portion of Listing 4.3 consists\
    \ of a <body> element that contains a <p> element and an empty <div> element.\n\
    \nCSS3 supports transitions 3D transforms that are analogous to CSS 2D transitions.\
    \ You can use the \"hover\" pseudo-selector in CSS selectors in order detect \"\
    hover\" events and perform transitions (and other effects as well).\n\n> \"Hover\"\
    \ events do not occur when HTML pages are rendered on mobile devices.\n\nYou can\
    \ specify transition-timing-function: as shown here:\n\n```\n#div1 {transition-timing-function:\
    \ linear;}\n#div2 {transition-timing-function: ease;}\n#div3 {transition-timing-function:\
    \ ease-in;}\n#div4 {transition-timing-function: ease-out;}\n#div5 {transition-timing-function:\
    \ ease-in-out;}\n```\n\nIn addition to the CSS3 property transition-timing-function,\
    \ CSS3 supports transition, transition-delay, transition-duration, and transition-properties,\
    \ as described here:\n\n+   transition: A shorthand property for setting the four\
    \ transition properties into a single property\ntransition-delay: Specifies a\
    \ delay (in seconds) for the transition effect\ntransition-duration: Specifies\
    \ how many seconds or milliseconds a transition effect takes to complete\ntransition-property:\
    \ Specifies the name of the CSS property the transition is for\ntransition-timing-function:\
    \ Specifies the speed curve of the transition effect\n\nBrowser support for CSS\
    \ transitions is listed here: http://caniuse.com/#feat=css-transitions."
