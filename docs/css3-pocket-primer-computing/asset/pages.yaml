  md: '# CHAPTER 8


    # MISCELLANEOUS TOPICS


    This this chapter contains an eclectic mix of topics, starting with an overview
    of Houdini, which is an initiative that has far-reaching implications for CSS
    in Web pages. You will also learn about Flexbox and Grid Layout, and performance
    techniques for binary images. In addition, you will see a comparison of CSS3,
    SVG, and HTML5 Canvas, as well as Web Animation APIs, and animation-related toolkits.


    The first part of this chapter is a quick introduction to Houdini, which is an
    important task whose goal is to provide new APIs that will provide consistent
    CSS behavior in all modern browsers.


    The second part of this chapter contains code samples that show how to use CSS
    Flexbox and CSS Grid Layout. The third part of this chapter discusses performance
    improvements for HTML5 Web pages and CSS3, as well as a comparison of CSS3, SVG,
    and HTML5 Canvas.


    The fourth part of this chapter covers performance techniques for optimizing binary
    images, as well as a description of spritesheets, the blur-up technique, progressive
    images, and Web fonts. The fifth part of this chapter looks into the Web Animations
    API and other animation toolkits, such as GSAP, mojo.io, and sequence-js.


    The final part of this chapter delves into some of the features of Chrome Inspector,
    which provides a rich set of diagnostics and debugging capabilities. You will
    learn about "computed properties," how to make live updates to CSS selectors,
    and also how to gather data that can help you pinpoint performance bottlenecks.
    After completing this section, you will be in a better position to make a feature-based
    comparison of Chrome Inspector with the corresponding features that are supported
    in other modern browsers.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# PROJECT HOUDINI


    Houdini is a W3C task force whose goal is to provide a set of APIs to make CSS
    consistent in all modern browsers. These APIs will also enable developers to extend
    CSS by accessing the styling and layout process of a browser’s rendering engine.
    Although Houdini is a relatively new group, some Houdini samples are here: https://github.com/GoogleChrome/houdini-samples.


    As you probably know now, polyfills (such as Moderniz) are JavaScript toolkits
    that "fill in" missing features in browsers so that other JavaScript toolkits
    will operate consistently in different modern browsers. In essence, polyfills
    work by modifying the DOM.


    The CSS "counterpart" to the DOM is the CSSOM, which is an acronym for the CSS
    Object Model. Unfortunately, the CSSOM is inconsistent across browsers and lacks
    critical features. Moreover, "polyfilling" CSS is more difficult than polyfilling
    the DOM (and it is an incomplete solution).


    One deficiency of the CSSOM is that it will discard any CSS rules or declarations
    that are not recognized; therefore, it’s necessary to use the DOM (specifically
    to access <style> and <link> elements) in order to polyfill those rules and declarations.


    In essence, the goal of Houdini is to modify the browser’s internal rendering
    engine to "normalize" (i.e., eliminate inconsistent behavior of) CSS in modern
    browsers.


    # The Rendering Pipeline


    The Rendering Pipeline involves the following sequence of phases (in this order):


    +   1. Parser

    2. DOM/CSSOM

    3. Cascade

    4. Layout

    5. Paint

    6. Composite


    The first three phases are the components of the CSS Properties and Values API,
    and the last three phases comprise the Worklets. Houdini has introduced Phase
    1 (not written yet) and Phase 3 in the Rendering Pipeline. Phase 1 is where external
    stylesheets will be handled correctly, and also where CSS extensions will be supported.


    Houdini also introduces the notion of worklets, which are essentially scripts
    for handling registration-related operations. Worklets support various features,
    such as the ability to invoke JavaScript code.


    Navigate to the Houdini home page for more detailed information about the proposed
    Houdini APIs.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# CSS3 ADVANCED FEATURES


    The CSS3 examples in this book have been tested in WebKit-based browsers, and
    you use browser-specific prefixes (which were discussed briefly in Chapter 1)
    to insert the CSS code for other browsers. In addition, some of the code samples
    in this chapter are rendered in Google Canary, and sometimes in a nightly build
    of WebKit, which will be noted accordingly. When this book goes to print, it''s
    possible that this functionality will be available in the general Chrome distribution.


    There are several CSS features that have been under active development, and most
    (possibly all) of them are available in WebKit-based browsers. In many cases,
    the W3C specification for each of the new CSS features is a “work in progress,”
    so it is possible that they will be modified by the time you read this book. Check
    a website such as caniuse.com for information about the latest feature support
    in your browser of choice.


    Among the advanced (and in some experimental) features:


    +   1. CSS Flexbox

    2. CSS Blending

    3. CSS Compositing

    4. CSS Exclusions

    5. CSS Regions


    With the preceding points in mind, a list of some of the latest CSS3 features
    is here:


    +   * CSS Canvas backgrounds (WebKit and FF)

    * CSS device adaptation (IE10)

    * CSS Exclusions (IE10)

    * CSS Filters (IE10 and WebKit)

    * CSS Flexbox (IE10)

    * CSS Grid (IE10 and WebKit)

    * CSS Regions (IE10 and WebKit)

    * CSS Custom Filters (WebKit)

    * CSS Templates (IE10)


    CSS Flexbox is the only feature in the preceding list that is covered in this
    chapter. You will also see some CSS Flexbox code samples and screenshots that
    illustrate how to create graphics effects by navigating to their respective home
    pages.


    # FBOX (FLEXIBLE BOX)


    CSS supports several layout models, such as block, inline, table, and positioned
    layout models. In addition, CSS supports the CSS Flexbox (Flexible Box) model,
    and you will see some examples in this section.'
  merge: -1
  pgno: 163
- img_proc: true
  md: 'Flexbox is a single-direction layout concept whereby flex items are placed
    in horizontal rows or vertical columns. The flex-direction property specifies
    the main axis, which in turn defines the horizontal or vertical direction in which
    flex items are placed in the flex container. The default value of flex-direction
    is row, which means that items are placed from left-to-right and from top-to-bottom
    (i.e., the order in which we read text on a page).


    Here are the other values for flex-direction:


    +   - row-reverse: if the writing-mode specifies left-to-right, then the flex
    items will be laid out in a right-to-left fashion

    - column: if the writing system is horizontal, the flex items will be placed vertically

    - column-reverse: analogous to the column property, except the order is reversed


    The Flexbox model also enables you to expand the child of a flexbox to fill unused
    space, as well as shrink the children to avoid overflowing the parent. Moreover,
    you can create different layouts for different flexboxes in the same HTML page.


    # An Assortment of Flexbox Properties


    Some flexbox properties that do not require prefixes include: box-align, box-flex,
    box-ordinal-group, box-pack, and flex-flow. The box-align property (as well as
    other flexbox properties) supports values such as start, end, center, baseline,
    and stretch, all of which enable you to specify the alignment of elements in a
    flexbox. For example, start and end will left-justify and right-justify, respectively,
    a set of elements in a flexbox. The box-flex property enables you to assign a
    greater relative weight to an element in a flexbox. The box-ordinal-group property
    enables you to change the default ordering of a set of elements in a flexbox.
    You can also use the display property and specify the value box.


    You can use Flexbox properties to perform additional tasks:


    +   - Use order to arrange flexbox children

    - Use flex-basis to define dimensions on flexbox children

    - Resize children correctly with flex-shrink and flex-grow

    - Use flex-wrap and align-content to create grids


    The next section contains an example of a Web page that contains some of the preceding
    Flexbox properties.


