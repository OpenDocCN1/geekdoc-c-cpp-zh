  md: '# 32 • CSS3 Pocket Primer


    The CSS3 transform attribute allows you to specify the skew() function in order
    to create skew effects, and its syntax looks like this:


    ```

    skew(xAngle, yAngle);

    ```


    You can replace xAngle and yAngle with any number. When xAngle and yAngle are
    positive, the skew effect is clockwise; when xAngle and yAngle are negative, the
    skew effect is counterclockwise; when xAngle and yAngle are zero, there is no
    skew effect. In all cases the initial position for the skew effect is the pivotal
    position.


    The HTML5 page Skew.html and the CSS stylesheet Skew.css are the companion device,
    and they illustrate how to create skew effects. The CSS stylesheet containing
    the img selector specifies a transition attribute that creates an animation effect
    during the one-second interval using the ease timing function, as shown:


    ```

    transition: transform 1.0s ease;

    ```


    There are also four selectors img.skewed1, img.skewed2, img.skewed3, and img.skewed4,
    which create background shadow effects with darker shades of red, yellow, green,
    and blue, respectively (all of which you have seen in early code samples).


    The selector img:hover specifies a transform attribute that performs a skew effect
    when user hovers over the first <img> element with their mouse, as shown here:


    ```

    transform : scale(-10deg, -30deg);

    ```


    The other three CSS3 selectors also use a combination of the CSS functions scale()
    to create distinct visual effects. Notice that the fourth hover selector sets
    the opacity property to 0.5, which takes place in parallel with the other effects
    in this selector.


    Figure 2.7 displays the result of matching the selectors in the CSS stylesheet
    Skew.css to the elements in the HTML page Skew.html.


    Hover over the Images:


    ![](img/0a6af518702639b3a358cdd75f17af79_48_0.png)


    FIGURE 2.7 CSS3-based skew effects on PNG files.


    The CSS3 transform attribute allows you to specify the translate() function in
    order to create an effect that allows a horizontal and/or vertical “shift” of
    an element, and its syntax looks like this:


    ```

    translate(xDirection, yDirection);

    ```'
