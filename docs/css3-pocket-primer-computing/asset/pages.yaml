  md: "# Why Use Semantic Markup?\n\nThere are at least two reasons for using semantic\
    \ tags in your websites.\nFirst, semantic tags can help you understand the structure\
    \ of a website and the purpose of a section of markup. The use of semantic tags\
    \ makes it easier for you to programmatically locate and manage sets of logically\
    \ similar sections (such as <nav> elements, <aside> elements, and so forth).\n\
    Third, screen-readers and search engines can use these tags to separate the content\
    \ from navigation in a website. These are several of the more important reasons\
