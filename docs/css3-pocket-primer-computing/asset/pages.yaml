  md: '# Designing Mobile Apps · 169


    Keep in mind that the preceding points are guidelines and not absolute rules.
    For example, smart phones in landscape mode can accommodate two columns, depending
    on the width of the columns, and many tablets can display two columns in portrait
    mode. Some people recommend that you reduce the amount of scrolling that is required
    on a screen, but many users are accustomed to scrolling on a mobile device (especially
    on smartphones). When in doubt, create two (or possible more) layouts and get
    feedback from users to determine which layout might appeal to a broad audience.
    If you still cannot decide which design is best for your purposes, perhaps you
    can benefit from "A/B testing," which is described here: http://en.wikipedia.org/wiki/A/B_testing


    # MOBILE DESIGN FOR HTML WEB PAGES


    There are several approaches to designing HTML Web pages for mobile devices, including
    "mobile first," "mobile only," and using a separate domain for mobile applications.


    A "mobile first" approach ensures that an HTML Page will render correctly on a
    mobile device. However, you need to take into account different screen sizes among
    mobile devices, such as smartphones, "phabets," and tablets. This detail is particularly
    evident with Android mobile devices (and to a lesser extent it is true for iOS
    devices).


    A "mobile only" approach still requires you to take into account different screen
    sizes on mobile devices, but in this scenario you do not need to contend with
    HTML Web pages for laptops or desktops. Keep in mind that this approach is far
    from trivial: it can involve a combination of client (or server) templates, local
    data stores, and efficient view-modeling that are provided by toolkits such as
    BackboneJS. Another point to consider is whether or not you leverage NoSQL datastores,
    such as MongoDB.


    A third approach is to use separate domains for mobile versus desktop Web pages.
    If you are developing mobile web pages (i.e., Web pages that are hosted on a server
    and accessed by various device types), this approach provides several advantages.
    First, this makes your mobile site easier to find. Second, you can advertise the
    mobile URL separately from the URL for desktop devices. Third, users can switch
    between the "regular" website and the mobile website simply by changing the domain.
    Fourth, the code logic for detecting mobile users (and then sending them to a
    separate domain) is simpler than making modifications to CSS stylesheets.


    Now you have an overview of design considerations for mobile Web pages, let''s
    take a look at an example of styling mobile forms, which is the topic of the next
    section.


    # HIGH-LEVEL VIEW OF STYLING MOBILE FORMS


    When you render a mobile form, there are high-level techniques (such as how to
    display input fields) as well as techniques that are specific in nature (such
    as indicating required fields).'
