  md: '# CSS3 3D Graphics and Animation


    NOTE Browsers must be able to use the driver of the graphics card that is installed
    on the host OS, and GPU acceleration for one browser on a given machine doesn''t
    guarantee support for all browsers.


    Web pages can use CSS selectors that change the position of HTML elements. Browser
    handle positional changes via two significant operations that can adversely affect
    performance: repainting and reflow. Repainting involves the calculation of new
    pixel values (which can be off-loaded to the GPU), and reflow involves calculating
    the new positions of HTML elements. Note that some CSS-based effects, such as
    changing the opacity of an element, requires repainting but not reflow if the
    element does not change its position. Chrome''s DevTools provides an "Enable paint
    flashing" when this is executed, green boxes appear around painted areas. The
    GPU handles the calculation of pixel values by performing something called "compositing"
    that these layers are blended together together in order to combine effects. You
    can think of the composite layers as a stack of parallel planes with different
    colors, and the compositing process as the calculation of the final color of each
    pixel when the planes are superimposed on each other. The GPU creates a separate
    composite layer in the following cases: 3D or perspective transforms, <video>
    or <canvas> elements, CSS filters, and overlapping elements to a composite layer
    (such as a z-index).


    There is also a size limit in the number of composite layers that can be created,
    so it''s possible to create animation effects that exhaust the GPU memory. Fortunately,
    Chrome''s DevTools provide a "Show layer border" option that displays each composite
    layer with an orange border.


    One point to keep in mind that the compositing process is most efficient for changes
    on elements that can be performed directly in the GPU. Specifically, changes to
    elements via transform, opacity, or filter can be handled directly by the GPU.


    Chrome switches on hardware compositing mode (if supported and already on). Chrome
    creates a new layer and "backing surface", which is a graphics context (aka texture)
    into which layers are drawn. Backing surfaces are uploaded to the GPU, and layers
    sometimes share the same "backing surface." Chrome creates a new backing surface
    if a layer:


    +   1. Uses 3D or perspective transform CSS properties

    2. Is used by a <video> element using accelerated video decoding

    3. Is used by a <canvas> element using a 3D context or accelerated 2D context

    4. Uses a CSS animation for its opacity or uses an animated transform

    5. Uses accelerated CSS filters

    6. Has a descendant that is compositing layer'
