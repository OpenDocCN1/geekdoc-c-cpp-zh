  md: "# CSS3 2D Graphics and Animation * 49\n\nCSS Motion Paths enable you to create\
    \ animation effects that are similar to SVG animation effects that have been available\
    \ since the early days of SVG. In fact, the value for the motion-path property\
    \ uses an SVG-based syntax, as you can see in the following example:\n\n```\n\
    #div {\n  motion-path: path('M900,190 L993,245 V201 A11,11 0 0,1 0 1004,190 H1075\
    \ A11,11 0 0,1 1086,201 V300 L1294,223 H1216 A11,11 0 0,2 0,434 V789 A11,11 0\
    \ 0,1 1194,800 H606 A11,11 0 0,1 595,789 V434 A11,11 0 0,0 584,423 H500,190');\n\
    }\n```\n\nIf you are comfortable with SVG, the code in the preceding CSS selector\
    \ will be very familiar. If you are new to SVG, read the SVG-related material\
    \ in Chapter 7.\n\nCurrently, CSS Motion Paths are supported in some versions\
    \ of Chrome and Opera (caniuse.com/#feat=css-motion-paths).\n\nA more extensive\
    \ example of CSS Motion Paths (involving lines and elliptic arcs) can be found\
    \ at https://googlegithub.io/samples/css-motion-path/index.html and http://thencode.com/35/Animate-Elements-on-Path-with-CSS.\n\
    \nSee the complete details regarding the CSS Motion Path specification at https://drafts.fxtxt.org/motion-1/.\n\
