    \ Web pages that consist of AMP HTML (a subset of HTML with AMP-specific elements),\
    \ AMP JS (a JavaScript framework for AMP that disallows third-party JavaScript),\
    \ and an optional AMP CDN (Content Delivery Network).\n\nOne of the goals of AMP\
    \ is to support all published content in Accelerated Mobile Pages.\nMore information\
    \ about AMP is available in the FAQ: https://www.ampproject.org/docs/support/faqs.html.\n\
    \n# The RAIL Framework\n\nRAIL is an acronym for the following time-based measurements:\
    \ Reaction time (100ms), Animation time (60FPS), Idle time (<50ms), and Load time\
    \ (< one second). The parenthesized numbers in the preceding sentence are the\
    \ goals of functional measurements. The availability of functionality such as\
    \ Service Workers (albeit an experimental technology) in modern browsers will\
    \ assist in reaching the RAIL goal of adequate performance of Web pages.\n\nCurrently\
    \ there is partial support for Service Workers in Chrome, Opera, and Firefox,\
    \ and more information about Service Workers is: https://developer.mozilla.org/en-US/docs/API/Service_Worker_API.\n\
    \n# Styles in AMP\n\nAll styles must appear in a style tag in the head of the\
    \ document, and the style tag must contain the amp-custom attribute.\n\n```\n\
    <amp-lightbox id=\"lightbox\" class=\"lightbox\"\nlayout=\"nodisplay\">\n  <div\
    \ class=\"lightbox-content\">\n    <amp-img src=\"https://cdn.auth0.com/website/jobs/image.jpg\"\
    \nwidth=\"2000\"\nheight=\"1035\"\nlayout=\"responsive\"></amp-img>\n    <p>some\
    \ text in a paragraph </p>\n  </div>\n</amp-lightbox>\n```\n\nAMP components support\
    \ for ads includes: A9, AdReactor, AdSense, AdTech, and Doubleclick. Companies\
    \ involved in Google AMP include Twitter, Pinterest, WordPress.com, Chartbeat,\
    \ Parse.ly, Adobe Analytics, and LinkedIn.\n\n# The Status of HTML Elements and\
    \ Core AMP Components\n\nElements prohibited by AMP include:\n\n+   base, frame,\
    \ frameset\nobject, param, applet\nembed, form, script (*)"
