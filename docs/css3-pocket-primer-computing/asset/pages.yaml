  md: '# CSS3 2D GRAPHICS AND ANIMATION


    The previous chapter contains examples of creating CSS3 2D graphics, and this
    chapter contains CSS3 2D animation effects. Note that Chapter 4 shows you how
    to create CSS3 3D graphics and animation effects. Although CSS3-related graphics
    and animation effects are discussed in three chapters, please keep in mind that
    the code samples serve as an introduction to concepts rather than a full and detailed
    coverage of the technical concepts and features


    The first part of this chapter discusses CSS3 transitions for creating simple
    animation effects (such as glow effects and bouncing effects). The chapter also
    contains code samples that show how to define CSS3 selectors that perform more
    sophisticated effects with text, such as rendering multiline text.


    The second part of this chapter shows you how to define CSS3 selectors to create
    2D animation effects. Specifically, you will learn how to use CSS3 keyframes and
    the CSS3 functions scale(), rotate(), and translate(), which enable you to create
    2D animation effects.


    The third part of the chapter shows you how to create fading images, rotating,
    and "bouncing" effects. This section also explains how to create CSS3 effects
    for text (such as multicolumn text). This section introduces CSS3 Motion Paths,
    which is an experimental CSS3 feature that supports SVG-like animation effects.
    The fourth part of this chapter covers CSS3 filters, with links to websites that
    can programmatically generate custom filters for Web pages.


    The final section involves jQuery, and how to create 2D effects with jQuery and
    CSS3. You will also learn how to create a "follow the mouse" example using jQuery
    and CSS3. If you are unfamiliar with jQuery, you can read the jQuery Appendix
    that is the companion disc. You can treat this section of the chapter as'
