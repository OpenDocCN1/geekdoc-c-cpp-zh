    \ and http://www.justinmcandless.com/blog/Patching+jQuery's+Lac+of+SVG+Support.\n\
    \n# A BRIEF COMPARISON OF SVG AND CSS3\n\nThis section summarizes the features\
    \ that are common to SVG and CSS3 also features the features that are unique to\
    \ each technology. Chapters 6 and 7 contain code samples that illustrate some\
    \ of the features that are summarized in this section.\nSVG and CSS3 provide support\
    \ for the following:\n\n+   - Linear and radial gradients\n- 2D graphics and animation\
    \ effects\n- The ability to create shapes such as rectangles, circles, and ellipses\n\
    - WAI-ARIA\n\nSVG provides support for the following features that are not available\
    \ in CSS3:\n\n+   - Bezier curves\n- Hierarchical object definitions\n- Custom\
    \ glyphs\n- Rendering text along an arbitrary path\n- Defining event listeners\
    \ on SVG objects\n- Programmatic creation of 2D shapes using JavaScript\n- “Accessibility”\
    \ to XML-based technologies and tools"
