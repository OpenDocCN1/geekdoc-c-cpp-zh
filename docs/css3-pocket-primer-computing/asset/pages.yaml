  md: "context.createRadialGradient(startCenterX, startCenterY, startRadius, endCenterX,\
    \ endY, endRadius);\n\nA radial color gradient can be compared to the ripple effect\
    \ that is created when you drop a stone in a pond, where each \"ripple\" has a\
    \ color that changes in a gradient fashion. Each ripple corresponds to a color\
    \ stop element. For example, if you define a radial gradient with a color of #FF0000\
    \ (which is red) and an end color of #000000 (which is black), the resultant gradient\
    \ will range—from red to black. Radial gradients can also contain multiple/start\
    \ color combinations. The point to keep in mind is that radial gradients change\
    \ colors in a linear fashion, but the rendered colors are drawn in an expanding\
    \ radial fashion. Note that \"radial gradient\" and \"radial color gradient\"\
    \ are used interchangeably in this book.\n\n6.5 displays the contents of the HTML5\
