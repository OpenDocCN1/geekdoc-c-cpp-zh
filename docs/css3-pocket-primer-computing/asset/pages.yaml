  md: "# CSS3 3D Graphics and Animation * 63\n\n```\n}\n#radial2 {\n  opacity: 0.6;\n\
    \  font-size: 24px;\n  width: 200px;\n  height: 200px;\n  position: absolute;\
    \ top: 200px; left: 200px;\n\n  background: radial-gradient(\n  red 1%,\n  orange\
    \ 5%, yellow 40%,\n  green 60%, blue 80%,\n  #fff\n);\n\ntransform: rotate3d(1,0,0,\
    \ 60deg) scale3d(1.5, 0.5, 0.75);\n}\n```\n\nListing 4.2 contains two CSS selectors,\
    \ #radial1 and #radial2, that match the <div> elements in Listing 4.1 that have\
    \ corresponding ids. As you can see, these selectors contain the transform property\
    \ that specifies combinations of CSS3D functions, such as rotate3d() and translate3d(),\
    \ as well as the 2D skew().\nKeep in mind that CSS3D transforms might not be supported\
    \ in all browsers. Check the caniuse website for information which browsers support\
    \ a specific 2D or 3D transform at http://caniuse.com/#feat=css3%20transforms\
    \ and http://caniuse.com/#search=css3%203d%20transforms.\n\n# CSS3 3D TRANSFORMS\
    \ (FIX EXAMPLE)\n\nA CSS transition is an animation effect on a CSS property for\
    \ a specified duration. The default value for the duration of a CSS transition\
    \ is 0. Hence, a transition will not occur unless you specify the duration of\
    \ a CSS transition.\n\nListing 4.3 displays the contents of 3DTransition1.html,\
    \ which uses CSS3 transitions that trigger transforms in response to \"hover\"\
    \ events.\n\n# LISTING 4.3 3DTransition1.html\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"utf-8\">\n<title>CSS3 Transition Effect</title>\n<style>\n\
    div {\n  width: 150px;\n  height: 150px;\n  background: red;\n  transition: width\
    \ 2s;\n}\n```"
  merge: -1
