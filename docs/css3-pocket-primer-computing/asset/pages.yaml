  md: '# BROWSER-SPECIFIC PREFIXES FOR CSS3


    Browser-specific prefixes are for CSS properties that are “works progress” for
    individual browsers, and the final specification drops browser-specific prefixes.
    Although more recent versions of modern browsers no longer require prefixes (discussed
    in this section), it''s worth learning about the prefixes for two reasons: a)
    you might encounter code that contains browser-specific prefixes, and b) older
    websites that generate CSS gradients tend to produce code contains unnecessary
    browser-specific prefixes.


    The browser-specific prefixes -ie-, -moz-, and -o- are for Internet Explorer,
    Firefox, and Opera. Note that Opera also supports -webkit- prefixes, and it’s
    possible that other browsers will do the same (the respective websites for updates).


    As an illustration, the following code block shows examples of the prefixes:


    ```

    -ie-webkit-border-radius: 8px;

    -moz-webkit-border-radius: 8px;

    -o-webkit-border-radius: 8px;

    border-radius: 8px;

    ```


    In your CSS selectors, specify the attributes with browser-specific prefixes before
    the “generic” attribute, which serves as a default choice in the event that the
    browser-specific attributes are not selected. The CSS3 code samples in this book
    containwebkit-specific prefixes, which helps us keep the stylesheets manageable
    in size. You need CSS stylesheets that work on multiple browsers (for current
    versions as well as older versions), which are essentially two options available.
    One option involves manually adding the CSS3 code with all the required browser-specific
    prefixes, which can be tedious to maintain and also error-prone. Another option
    is to use toolkits or frameworks (discussed in the next chapter) that can programmatically
    generate the CSS3 code that contains all browser-specific prefixes.


    Finally, an extensive list of browser-prefix CSS properties is: http://peter.sh/experiments/cender-fixed-css-property-overview/.


    In the case of color gradients (discussed in Chapter 3), you no longer need a
    browser-specific prefix for the latest versions of Chrome, Firefox, IE 10+, Opera,
    and Safari. Additional CSS properties will become “prefix free” as modern browsers
    evolve in terms of feature support. Fortunately, the following open source project
    enables you to specify prefix-free properties in your code: https://leaverou.github.io/prefixfree/


    The preceding code inserts browser-specific prefixes only when it’s necessary
    to do so, which alleviates the tediousness of performing this task.


    # SUMMARY


    In this chapter, you learned about browser support for CSS3, browser-specific
    prefixes, and various CSS3 features. Next you learned about CSS3'
