    # MEDIA QUERIES AND META TAGS


    This chapter is primarily about CSS3 Media Queries, along with coverage of several
    types of meta tags and discussion of local CSS, which is also provided by Web
    Components (discussed briefly in Chapter 8).


    You will learn how to detect screen-related properties (such as width, height,
    and orientation) of mobile devices using CSS3 Media Queries.


    The first part of this chapter discusses CSS3 Media Queries, which enable you
    to detect some characteristics of a device and render an HTML5 Web page based
    on device characteristics. You''ll see examples of using CSS3 Media Queries to
    change the layout of a Web page based on the orientation of a mobile device. CSS3
    Media Queries are also used for Responsive Web Design. In Chapter 8, you will
    learn about Bootstrap, which uses CSS3 Media Queries as a basis for defining different
    widths (ranging from xs, md, and lg) of mobile devices.


    The second part of this chapter discusses generic meta tags for mobile devices,
    along with iOS-specific and Android-specific meta tags. You will learn how to
    use “pure” JavaScript in order to detect device orientation (portrait or landscape)
    and property values (such as the screen width and height) and then update those
    properties appropriately.


    Hence, you can use either CSS3 Queries or a combination of CSS3 and JavaScript
    (or both) in hybrid HTML5 mobile applications. The approach that you adopt depends
    on various factors (project scope and specific requirements) that often involve
