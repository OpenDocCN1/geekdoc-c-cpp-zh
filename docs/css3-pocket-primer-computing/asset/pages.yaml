  md: '# HTML5 FEATURES


    This chapter introduces you to some features of HTML5 and HTML5-specific elements
    for semantic markup. You will also learn about some websites that provide useful
    information, such as browser support for HTML5 “umbrella” features, and also get
    some information about the W3C and the WHATWG standards groups.


    One question must be addressed before you read this chapter: why does this CSS3
    book contain an introductory chapter about HTML5? First, CSS exists entirely inside
    the context of a website: unlike JavaScript, there is no “server side” CSS. Second,
    there are many technologies that are considered part of the HTML5 “umbrella”,
    and they vary considerably in terms of the complexity of their associated APIs.
    Third, it is fairly possible that you will encounter JavaScript (if you haven''t
    already) and also need to learn some rudimentary aspects of JavaScript. In fact,
    when such content is deemed relevant and useful, some of the chapters in this
    book contain JavaScript-related sections (often marked “optional”).


    The first part of this chapter introduces HTML5, browser support, and two HTML5
    Working Groups. The second part describes the technologies that are part of HTML5,
    differences between HTML4 and HTML5, some useful online tools, and feature detection.
    The third part of this chapter shows you simple HTML5 website, new HTML5 elements,
    and Semantic Markup. The final part of this chapter introduces you to WAI ARIA,
    experimental features, and mobile support.


    Another point to keep in mind is that there are multiple modern browsers available,
    all of which provide very good support for HTML and CSS. However, due to space
    and time limitations and the number of topics to cover, Chrome was chosen as the
    primary browser to test the code samples in this book. Although the code samples
    in this particular book will most likely work'
  merge: -1
  pgno: 17
- img_proc: true
  md: '+   • CSS3 Pocket Primer


    in modern browsers, you can check whether or not a CSS feature is supported in
    a given browser: www.canuse.com.


    Lastly, if you decide to skip the initial high-level sections of this chapter,
    the section called “A Simple HTML Website” contains an example of an HTML website,
    followed by a description of its contents. Later you can obviously return to the
    sections that you skipped in this chapter.


    # WHAT IS HTML?


    Despite the simplicity of the question, the answer is imprecise: HTML5 consists
    of a mixture of technologies, some of which are formally included in the HTML5
    specification, and some which are not part of the specification. There are few
    people who seek to know the “definition” of HTML5, and perhaps that Peter Paul
    Koch (creator of the quirksmode website) wryly suggested that “whatever web technology
    you’re on is call right now that’s HTML5.” As you discover, HTML5 means different
    things to different people, so don’t be surprised if you get one consistent “definition”
    of HTML5 (if the situation is so simple!)


    However, it’s also true that HTML5 is the latest version of HTML that is backward
    compatible with many features of earlier versions of HTML markup. In addition
    to its plugin-free architecture, HTML5 provides a wealth of features: tags for
    audio, video, and semantic markup; new input types and validation forms; local
    and session storage; support for graphics-based APIs in Canvas; and communication-related
    techniques such as server events and web sockets. Some of the technologies listed
    in the previous sentence are outside the scope of this book, so there’s no need
    to worry if they are unfamiliar to you.


    Although CSS3 is not a part of HTML5, many people consider it to be an important
    (perhaps even integral) part of websites. Indeed, CSS3 is a core aspect of visual
    design components of a website or application. As you will see in Chapters 2 through
    4, CSS3 provides support for visual effects, including 2D/3D graphics and animation.


    With regard to HTML markup, the good news is that the HTML5 semantic tags provide
    more meaningful information about the purpose of each section in the HTML5 website,
    which can be discerned more easily than websites written in HTML4. You will see
    an example of some of these semantic tags later in this chapter.


    In addition, HTML was initially designed with the goal of running HTML on desktop
    devices as well as mobile devices. Since 1996 CSS itself has contained media attributes
    (such as handheld) that reflect this early thinking about the purpose of HTML.


    Web-based mobile applications do not support push notifications. There are some
    Android-specific features, such as adding widgets, performing notifications, or
    changing the wallpaper that are typically user features.'
