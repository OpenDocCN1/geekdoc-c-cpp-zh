    Now that you know how to reference a keyframes definition in a CSS3 selector,
    let''s look at the details of the definition of lowerLeft, which contains nineteen
    elements that specify various animation effects. Each element of lowerLeft occurs
    during a specific stage during the animation. For example, the eighth element
    in lowerLeft specifies the value 50%, which means that it will occur at the halfway
    point of the animation. Since the #linear selector contains an animation-duration
    property whose value is 240s (shown in bold in Listing 4.6), this means that the
    animation will last for four minutes, starting from the point in time when the
    HTML page is launched.


    The eighth element of lowerLeft specifies a translation, rotation, skew, and scale
    effect (all of which are three dimensions), an example of which is shown here:


    ```

    50% {

    transform: translate3d(250px, 250px, 250px),

    rotate3d(250px, 250px, -120deg)

    skew(-65deg) scale3d(0.5, 0.5, 0.5);

    }

    ```


    The animation effect occurs in a sequential fashion, starting with the translation
    and finishing with the scale effect, which is also the case for the other elements
    in lowerLeft.


