  md: '# 156 · CSS3 Pocket Primer


    SVG provides a) 2D graphics/animation, b) GPU support, c) the ability to create
    arbitrary 2D shapes, d) custom <pattern>s, and e) grouping via the <g> element,
    and ceasing functions in 2D graphics/animation (but SVG cannot animate HTML).


    Canvas provides a) 2D graphics/animation, b) GPU support, the ability to update
    many small objects (games), and d) the option of working with video using ThreeJS/WebGL
    for 3D animation.


    CSS3+SVG is useful when a) you already have SVG-based data and b) you must support
    IE6 (this can be done with the Raphael touch but not D3).


    CSS3+D3 is good for modern browsers and is even easier for defining handlers and
    animation (probably easier to maintain/enhance).


    However, keep in mind that CSS3+SVG might not have GPU support (and perhaps consider
    CSS3 with BackboneJS/Angular/JS/etc.).


    Use CSS3 to create 3D animation effects with SVG as:


    +   Step #1: create an SVG document

    Step #2: create an SVG <defs> element

    Step #3: create CSS3 selectors with CSS3 3D animation and put them in a <style>
    element

    Step #4: insert the <style> element in the <defs> element

    Step #5: set the "class" attribute in SVG elements so that it matches a CSS selector
    in the <style> element


    Note that you can also reference an external CSS stylesheet in an SVG document.

    Modern browsers support the <canvas> element. CSS3 with HTML5 Canvas by inserting
    a <canvas> element in a Web page and then JavaScript APIs to create 2D shapes,
    all of which are rendered in a <canvas> element. Keep in mind that HTML5 <canvas>
    does not provide a DOM. CSS3 selectors can match the HTML5 <canvas> element. An
    article explains how to trace canvas calls is here: http://www.html5rocks.com/tutorials/canvas/inspection/


    # Which Is Faster? CSS3/SVG?


    HTML5 Canvas is often faster than SVG for showing polygons and many small objects,
    but CSS3 is faster than Canvas for simple animation: http://phrogz.net/image_move_speed.html.


    Moreover, CSS3 is faster than SVG for graphics, and D3 is better/faster than SVG
    for “follow the mouse.\ The preceding rules are general guidelines: make sure
    you test/compare the performance characteristics of a Web page, especially if
    you develop for mobile devices.


