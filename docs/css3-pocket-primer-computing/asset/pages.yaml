  md: '# CSS3 AND HTML5 CANVAS


    This chapter provides an overview of combining CSS3 with HTML5 Canvas, which is
    a technology for drawing graphics directly to a part of a Web page. HTML5 Canvas
    supports various APIs for rendering 2D shapes and creating animation effects.
    In addition, you will see how to style HTML5 <canvas> elements with CSS3-based
    animation effects.


    You might be wondering why this chapter has been included in this book. If you
    want to learn about HTML Canvas and the associated JavaScript code, then this
    chapter will give you a reasonable introduction: despite the numerous online Canvas-related
    and CSS3-related tutorials, very few of them combine HTML5 Canvas and CSS3 graphics
    effects.


    The first part of this chapter shows you how to render line segments, rectangles,
    and circles in HTML5 Canvas with CSS3 stylesheets. The second part introduces
    you to linear and radial gradients in HTML5 Canvas, with examples of how to apply
    them to Bez curves and binary images. The third part of this chapter contains
    some examples of rendering PNG files in an HTML Canvas element.


    One important caveat: unlike the other chapters in this book, this chapter requires
    some knowledge of JavaScript, such as how to define variables and functions. In
    addition, the code samples contain document.getElementById for finding elements
    in an HTML Web page, window.addEventListener for adding an event listener to a
    Web page, and for defining click handlers for HTML <input> elements. Admittedly,
    the details of these methods are not discussed in this chapter. Glance at the
    code samples to get an idea of the type of JavaScript code that they contain,
    and then you can assess whether or not you feel confident to read the examples
    in greater detail. Another suggestion: launch the code samples in this chapter
    to'
