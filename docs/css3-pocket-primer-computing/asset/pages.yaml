  md: '# WORKING WITH CSS AND JQUERY (OPTIONAL)


    The remainder of this chapter contains examples of Web pages that contain CSS3
    and jQuery. You might be asking yourself about the relevance of jQuery in a CSS3
    Pocket Primer. This is a valid question because this is a CSS3 Pocket Primer.
    One option is to simply skip this section (as the jQuery sections in other chapters)
    and perhaps keep these sections in mind if you decide to learn about combining
    jQuery and CSS3 at some point in the future.


    One other factor to consider is the immense popularity of jQuery, which has led
    to its inclusion in an incredible number of Web pages. Consequently, the likelihood
    that you will encounter jQuery code is significant. The purpose of the jQuery
    code samples is to show you the power of the jQuery () method that greatly simplifies
    dynamically modifying CSS properties of existing HTML elements as well as creating
    new HTML elements. Hence, the code samples with jQuery in this chapter only require
    an understanding of basic concepts


    The key jQuery concepts for this chapter are listed here:


    +   1. Use the "$" symbol to represent jQuery

    2. Locate HTML elements via the syntax "$(name-of-html-tag)"

    3. Locate an "id" property via the syntax "$(#id-value)"

    4. Locate a "class" property via the syntax "$(#class-value)"

    5. Place your code block: $(document).ready(function() { ... })


    Here are specific examples:


    Listing 3.11 displays the contents of HelloWorld.html that illustrates how to
    add jQuery functionality to an HTML5 page that contains a single HTML element.


    > Listing 3.11 contains console.log(), which is available in WebKit based browsers
    but might not be available without some type of plugin or extension for other
    browsers.


    ```

    LISTING 3.11 HelloWorld.html

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <meta charset="utf-8" />

    <title>Hello World</title>

    ```'
