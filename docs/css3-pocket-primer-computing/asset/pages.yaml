  md: '# CSS3 Pocket Primer


    optional if you do not need jQuery (and perhaps return to this section at some
    point in the future).


    In case you do not already know, there are several advantages to using CSS3 in
    your HTML5 Web pages. First, you will learn how to create your own visual effects
    using CSS3 3D. Second, toolkits as jQuery rely heavily on CSS3 for rendering content
    and for animation effects (including page transitions). Hence, the knowledge that
    you gain from the CSS3-related chapters in this book will give you a foundation
    that will help you understand how jQuery performs its “magic,” and perhaps even
    make it easier for you to read the jQuery source code.


    Fourth, it is easier to create very CSS3-based graphics and animation effects
    (especially in 3D) than to create the same effects in other languages (including
    SVG). Fifth, your code is likely to be more compact if you use CSS3 instead of
    relying on JavaScript and JPG files for graphics and animation, which is a particularly
    important point for mobile devices. Note that hardware acceleration is mandatory
    for many CSS3 3D effects, and the good news is that an increasing number of mobile
    devices supports acceleration for CSS3 (and in some cases, there is also support
    for HTML5 Canvas).


    # CSS3 2D TRANSFORMS


    CSS3 transforms include the CSS3 functions scale(), rotate(), skew(), and translate(),
    which enable you to modify the shape of HTML elements.


    This section shows you how to create a cube using CSS3, which involves rendering
    the front face (a rectangle), the top face (a parallelogram), and the right face
    (also a parallelogram).


    We will use the CSS3 transforms and effects in this section:


    +   1. The CSS3 skew() function to create the left and right faces

    2. The CSS3 scale() and rotate() functions to create the top face

    3. Linear and radial gradients for shading effects


    The example in this section contains a lot of CSS3 code, and it''s probably helpful
    to launch the Web page in a browser to view the result as you study the code.


    Listing 3.1 displays the contents of 3DCube.html and Listing 3.2 displays the
    contents of 3DCube.css, which illustrate how to simulate a cube in CSS3.


    # LISTING 3.1 3DCube.html


    ```

    <!DOCTYPE html>

    <html lang="en">

    <head>

    <title>CSS 3D Cube Example</title>

    <link href="3DCSS1.css" rel="stylesheet" type="text/css">

    ```'
