    There are two steps involved. The first step is to apply the default styling and\
    \ then apply your own styling rules. The second step is to use the [type=] attribute\
    \ selector to apply different styles to different input fields.\n\nAs a specific\
    \ example you can use the -webkit-appearance property to remove the default styling\
    \ for all input elements, as shown here:\n\n```\ninput, textarea, select {\n \
    \ -webkit-appearance: none;\n}\n```\n\nNext, specify your own CSS styles that\
    \ depend on the type of input field, as outlined here:\n\n```\ninput[type=checkbox]\
    \ {\n  /* specify styles for checkbox */\n}\n\ninput[type=radio] {\n  /* specify\
    \ styles for radio */\n}\n\ninput[type=textarea] {\n  /* specify styles for textarea\
    \ */\n}\n```\n\nYou can use the preceding example as a guideline for defining\
    \ CSS selectors to change the appearance of other HTML elements in your Web pages.\n\
    \n# Specify Keyboard Types for Input Fields\n\nHTML5 introduced the following\
    \ new properties for the type attribute input elements:\n\nan email address: type='email'\n\
    a website address: type='url'\ntelephone number: type='tel'\n\nThe preceding types\
