    and animation. Consequently, you need to have a reasonable grasp of CSS2 (i.e.,
    how to define CSS selectors, the rules for selecting them with elements in HTML,
    etc.). If you are unfamiliar with CSS selectors, there are many introductory articles
    available through an Internet search. If you are convinced that CSS operates under
    confusing and seemingly arcane rules, then it''s probably worth your while to
    read an online article about CSS box model rules, after which you will have a
    better understanding of the underlying logic of CSS.


    The first part of the chapter starts with a brief overview of various CSS3 features,
    such as pseudo-selectors, pseudo-classes, and attribute selection. The second
    part of this chapter contains code samples that illustrate how to create shadow
    effects, how to render rectangles with rounded corners, and also how to use linear
    and radial gradients.


    The third part of this chapter covers CSS3 transforms (scale, rotate, skew, and
    translate), along with code samples that illustrate how to apply transforms to
    HTML elements and to binary files. The final part of this covers CSS3 support
    in browsers and briefly discusses the purpose of browser-specific prefixes for
    CSS3 features.


    You can launch the code samples in this chapter in any browser on a desktop or
    a laptop; you can also view them on mobile devices, provided that you launch them
    in a browser that supports the CSS3 features that are used in the code samples.


