    The preceding website enables you to validate a URL, or direct input of code.


    The following website provides "boilerplate" templates for HTML5 email input fields
    (and also templates for CSS and jQuery): http://favbabulous.com/post/548/6-useful-web-development-boilerplates.


    # SUMMARY


    In this chapter, you learned about the touch-oriented metaphor of the mobile environment,
    along with design-related aspects of mobile forms. In addition, you saw how to
    improve the response time of user gestures via fast-click.js, and also the fact
    that you can use CSS3 Media Queries and JavaScript to detect the screen sizes
    of mobile devices. You also learned about Google AMP and its support for many
    SVG elements. Next you learned about Progressive Mobile Apps, and a high-level
    view of performance-related details.'
