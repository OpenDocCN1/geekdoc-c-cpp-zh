  md: '# Miscellaneous Topics


    Based on the preceding quote, perhaps the reaction of users to progressive images
    involves a combination of cognitive and subjective considerations.


    If you are interested in learning about four ways in which binary files can be
    transmitted, the following link contains some information: http://blog.codinghorror.com/progressive-image-rendering/.


    Another initiative to optimize Web pages is Google AMP (Accelerated Mobile Pages),
    which dramatically restricts the type of content that is allowed in an initial
    download of a Web page. Google AMP is discussed in the next chapter.


    # Web Fonts


    Browsers download Web Fonts while rendering Web pages, and then those fonts are
    applied to the text in the Web page. A collection of Web Fonts is available here:
    http://webfonts.info.


    An example of including a Web Font in its style sheet is shown here:


    ```

    <link rel=''stylesheet'' type=''text/css'' href=''https://fonts.googleapis.com/css?family=Archive-Narrow''>

    ```


    Web Fonts can adversely affect performance of an HTML Web page when they are downloaded
    from a remote website. An online presentation regarding the performance of Web
    Fonts is here: https://speakerdeck.com/brainstein/web-fonts-performance.


    # What to Do?


    At this point it''s probably clear that there is no one-size-fits-all formula
    for designing optimized HTML Web pages. However, one point is: after experimenting
    with various techniques, you need to test the performance of your Web pages in
    order to determine what will be optimal for your website.


