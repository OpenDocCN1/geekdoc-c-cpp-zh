  md: "# CSS3 3D GRAPHICS WITH KEYFRAMES\n\nIn the previous chapter, you learned how\
    \ to create CSS3 2D animation effects with keyframes rules. You can also create\
    \ CSS3.3D animation effects via CSS3 keyframes rules by specifying CSS3 functions,\
    \ such as scale3d(), rotate2d(), and translate3d(), either individually or in\
    \ various combinations.\n\nListing 4.6 displays the contents of Anim240Flicker3DLGrad4.html,\
    \ which is a very special HTML page that contains four HTML <div> elements. The\
    \ animation effect lasts for four minutes in this example because the duration\
    \ is specified in the associated CSS3 stylesheets.\n\n+   LISTING 4.6 Anim240Flicker3DLGrad4.html\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <title>CSS3 Animation\
    \ Example</title>\n  <meta charset=\"utf-8\" />\n  <link href=\"Anim240Flicker3DLGrad4.css\"\
    \ rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n  <div id=\"outer\"\
    >Text1</div>\n  <div id=\"linear2\">Text2</div>\n  <div id=\"linear3\">Text3</div>\n\
    \  <div id=\"linear4\">Text4</div>\n</div>\n</body>\n</html>\n```\n\nListing 4.6\
    \ is a very special HTML5 page with corresponding CSS selectors (shown in Listing\
    \ 4.7). As usual, the real complexity occurs in the CSS selectors that contain\
    \ the code for creating the animation effects.\n\nAs you will, some of the CSS\
    \ selectors in Listing 4.6 contain the CSS matrix() function that requires a knowledge\
    \ of matrices (which is beyond the scope of this book) to fully understand the\
    \ effects that you can create with the CSS matrix() function. If you are interested\
    \ in learning about matrices, you can read this introduction to matrices (in the\
    \ context of CSS3): http://www.eleqrip.com/2010/05/css-3d-matrix-transform/.\n\
    \nSince Anim240Flicker3DLGrad4.css is such a lengthy code sample, only a portion\
    \ of the code is displayed in Listing 4.7. However, the complete code is available\
    \ on the companion disc for this.\n\n+   LISTING 4.7 Anim240Flicker3DLGrad4.css\n\
    ```css\n@keyframes upperLeft {\n  transform: matrix(1.5, 0.5, 0.0, 1.5, 0, 0)\n\
    ```\n\n![](img/0a6af518702639b3a358cdd75f17af79_83_0.png)"
