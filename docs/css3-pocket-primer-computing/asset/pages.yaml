  md: "# Media Queries and Meta Tags\n\nThere are three types of changes in the 3D\
    \ position of a device: up and down (z axis), left and right (y axis), and clockwise\
    \ and counterclockwise (x axis). These changes are measured with an accelerometer,\
    \ and you can check their current values in the deviceorientation event on the\
    \ window object. This event fires whenever the mobile device moves, and returns\
    \ an object with orientation-related properties.\n\nThe JavaScript code below\
    \ lists the following:\n\n```\nwindow.addEventListener('deviceorientation',function\
    \ (o) {\n  console.log(o.alpha, o.beta, o.gamma);\n}, false);\n```\n\nThe three\
    \ properties alpha, beta, and gamma provide the rotation angle (in degrees, not\
    \ radians) in the z, x, and y axes, respectively. Keep in mind that the z axis\
    \ is the vertical axis (positive is upward), the x axis points toward (negative\
    \ is away from you), and the y axis is a left-to-right horizontal axis (toward\
    \ is positive).\n\nThe allowable values for these three properties are as follows:\n\
    \n+   alpha: 0 to 360 (clockwise)\nbeta: -180 to 180 (toward/away from you)\n\
    gamma: -90 to 90 (left to right)\n\nIf you want more details regarding the orientation\
    \ of a device, you can use the accelerometer to obtain more precise information.\n\
    \n# DETECTING SCREEN WIDTH AND HEIGHT\n\nThe window object supports a resize event\
    \ that you can use to determine the width and height of the screen, which in turn\
    \ enables you to modify other effects in HTML5 Web pages. Listing 5.4 displays\
    \ the contents of resizeBorder1.html that illustrates how to maintain the same\
    \ blue border regardless of the screen size or screen orientation.\n\nLISTING\
    \ 5.4 ResizeBorder1.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    <meta charset=\"utf-8\" >\n<title>Resizing the Window</title>\n<style>\n * {\n\
    \  margin:0px; padding:0;\n}\n#outer {\n  width: 400px; height: 300px;\n  border:\
    \ 10px solid blue;\n}\n</style>\n```"
