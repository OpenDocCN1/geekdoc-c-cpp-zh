    * CSS Transitions and Keyframe Animations

    * SVG Animation

    * setTimeout/setInterval


    Web Animations are a set of standards to unify CSS and JavaScript animations.
    The key idea to remember is that Web Animations provide GPU-based animation through
    JavaScript.


    The Web Animations API provides an animation player that supports the following
    methods and features:


    ```

    play(), pause(), finish(), and cancel()

    ```'
