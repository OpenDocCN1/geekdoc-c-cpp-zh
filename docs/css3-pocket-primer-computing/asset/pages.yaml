    <polyline> element specifies a set of points to represent the endpoints of one
    or more line segments that are displayed as a connected line. The syntax of the
    SVG <polyline> element is very similar to the SVG <polygon> element, in the following
    example:


    ```

    polyline="50,50 200,50 200,200, 50,200"

