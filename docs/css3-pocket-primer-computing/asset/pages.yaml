  md: "# CSS3 MEDIA QUERIES FOR MULTIPLE SCREEN SIZES\n\nIn the introduction to CSS3\
    \ Media Queries you saw examples of defining media queries with compound conditional\
    \ logic (which can include and, or, only, and not). In case you didn't already\
    \ notice, you can use media queries to handle different screen sizes for mobile\
    \ devices such as smartphones and tablets. An example of doing so is here:\n\n\
    ```\n@media screen (min-width: 321px) and (max-width: 480px)\n{\n  div { width:\
    \ 100px; }\n}\n```\n\n```\n@media screen and (min-width: 481px) and (max-width:\
    \ 720px)\n{\n  div { width: 200px; }\n}\n```\n\nThe logic in the preceding pair\
    \ of media queries is straightforward: the first media query sets the width of\
    \ <div> elements to 100px when the screen width is between 321 pixels and 480\
    \ pixels; the second media query sets the width of <div> elements to 200px when\
    \ the screen width is between 481 pixels and 720 pixels.\n\nThe following media\
    \ query sets the width of <div> elements to 150px only when it's:\n\n```\n@media\
    \ only screen {\n  div { width: 150px; }\n}\n```\n\nThe following media query\
    \ sets the width of <div> elements to 50px for devices that do not support orientation:\n\
    \n```\nnot (orientation) {\n  div { width: 50px; }\n}\n```\n\nAs you can see from\
    \ the examples in this section and in previous sections, CSS3 Media Queries are\
    \ simple, flexible, and powerful in terms of their expressiveness and intuitive\
    \ functionality.\n\n# CSS DEVICE ADAPTATION\n\nCSS Device Adaptation enables you\
    \ to use CSS in order to specify the size, zoom factor, and orientation of the\
    \ viewport meta element in your HTML5 Web pages. As a simple example, the following\
    \ selector selects the width property and zoom property:\n\n```\n@viewport {\n\
    \  width: device-width;\n  zoom: 0.5;\n}\n```"
