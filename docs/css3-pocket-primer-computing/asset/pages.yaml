  md: "# CSS3 3D TRANSFORMS\n\nIn general, CSS3 supports 3D transforms that correspond\
    \ to their 2D counterparts; one exception is the skew transform that does not\
    \ have a 2D counterpart. Specifically, 3D transforms include: translate3D, rotate3D,\
    \ scale3D, matrix3D, and perspective.\n\nListing 4.1 displays the contents of\
    \ 3DTransforms.html, which illustrates how to use CSS3 3D transforms in a Web\
    \ page, and Listing 4.2 displays the contents of the CSS3 stylesheet Threed2.css.\n\
    \n# LISTING 4.1 Threed2.html\n\n```\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n\
    \  <title>CSS 3D Effects Example</title>\n  <meta charset=\"utf-8\" />\n  <link\
    \ href=\"Threed2.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n<body>\n\
    \  <div id=\"outer\">\n    <div id=\"radial1\">Text1</div>\n    <div id=\"radial2\"\
    >Text2</div>\n  </div>\n</body>\n</html>\n```\n\nListing 4.1 is a simple HTML5\
    \ Web page that contains a reference to the CSS stylesheet Threed2.css, followed\
    \ by a <body> element that contains a <div> element whose id attribute has the\
    \ value outer. This same <div> element has two child <div> elements that match\
    \ some of the selectors in Listing 4.2.\n\n# LISTING 4.2 Threed2.css\n\n```\n\
    #outer {\n  position: relative; top: 10px; left: 0px;\n}\n\n#radial {\n  opacity:\
    \ 0.8;\n  font-size: 24px;\n  width: 200px;\n  height: 200px;\n  position: absolute;\
    \ top: 0px; left: 0px;\n\n  background: radial-gradient(\n    blue 1%,\n    orange\
    \ 5%, yellow 40%,\n    green 60%, red 80%,\n    #fff\n  );\n\n  transform: rotate3d(20,30,40,50deg)\n\
    \    translate3d(50px,50px,50px) skew(-15deg);\n```"
  merge: -1
  pgno: 78
