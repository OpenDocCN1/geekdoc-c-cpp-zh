  md: "# Specifying Colors with RGB and HSL\n\nBefore we delve into the interesting\
    \ features of CSS3, you need to know how to represent colors. One method is to\
    \ use (R,G,B) triples, which represent the Red, Green, and Blue components of\
    \ a color. For instance, the triples (255,0,0), (255,255,0), and (0,0,255) represent\
    \ the colors Red, Yellow, and Blue. Other ways of specifying the color include:\
    \ the hexadecimal triples (FF,0,0) and (F,0,0); the decimal triple (100%,0%,%);\
    \ or the string #F00. You can also use (R,G,B,A), where the fourth component specifies\
    \ the opacity, which is a decimal number from 0 (invisible) to 1 (opaque).\n\n\
    However, there is also the HSL (Hue, Suration, and Luminosity) representation\
    \ of colors, where the first component is an angle between 0 and 360 (0 degrees\
    \ is north), and the other two components are percentages between 0 and 100. For\
    \ instance, (0,100%,50%), (120,100%,50%), and (240,100,50%) represent the colors\
    \ Red, Green, and Blue, respectively.\n\nIn addition, the HSLA color model supports\
    \ the alpha/transparency value, which is between 0 (fully transparent) and 1 (fully\
    \ opaque). The alpha value (in any color model) enables you to \"see through\"\
    \ overlapping elements when the value is less than 1, whereas a value of 1 prevents\
    \ you from seeing the portion of an element that is underneath others.\n\nThe\
    \ code samples in this book use (R,G,B) and (R,G,B,A) for representing colors,\
    \ but you can perform an Internet search to obtain more information regarding\
    \ HSL.\n\n# CSS3 and Text Shadow Effects\n\nA shadow effect for text can make\
    \ a Web page look more vivid and appealing, and many websites look better with\
    \ shadow effects that are not overowering for users (unless you specifically need\
    \ to do so).\n\nListing 2.1 displays the contents of the HTML5 page TextShadow.html\
    \ that illustrate how to render text with a shadow effect, and Listing 2.2 displays\
    \ the contents of the CSS stylesheet TextShadow.css that is referenced in Listing\
    \ 2.1.\n\n# LISTING 2.1 TextShadow.html\n\n```\n<!DOCTYPE html>\n<html lang=\"\
    en\">\n<head>\n  <meta charset=\"utf-8\" />\n  <title>CSS Text Example</title>\n\
    \  <link href=\"TextShadow.css\" rel=\"stylesheet\" type=\"text/css\">\n</head>\n\
    <body>\n  <div id=\"text1\">Line One Shadow Effect</div>\n  <div id=\"text2\"\
    >Line Two Shadow Effect</div>\n  <div id=\"text3\">Line Three Vivid Effect</div>\n\
    \  <div id=\"text4\"></div>\n</body>\n```"
