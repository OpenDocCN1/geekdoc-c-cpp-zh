  md: "# Introduction to CSS3\n\nCSS3 also supports Boolean selectors (which are also\
    \ pseudo-classes) such as empty, enabled, disabled, and checked, which are very\
    \ useful for Form-related HTML elements. One other pseudo-class is not(), which\
    \ returns a set of elements that do not match the selection criteria.\n\nCSS3\
    \ uses the meta-characters ^, &, and * (followed by the = symbol) in order to\
    \ match an initial, terminal, or arbitrary position for a text string. If you\
    \ are familiar with the Unix utilities grep and sed, as well as the vi text editor,\
    \ then these meta-characters are very familiar to you.\n\n# CSS3 Pseudo-Classes\n\
    \nThe CSS3 :nth-child() pseudo-class is both powerful and useful, and it has the\
    \ following form:\n\n```\n:nth-child(insert-a-keyword-or-linear-expression-here)\n\
    ```\n\nThe following list provides various examples of using the nth-child() pseudo-class\
    \ in order to match various subsets of HTML <div> element (which can be substituted\
    \ by other HTML elements as well):\n\n```\ndiv:nth-child(1): matches the first\
    \ child element\nd:nth-child(2): matches the second child element\nd:nth-child(:even):\
    \ matches the even child elements\nd:nth-child(:odd): matches the odd child elements\n\
    ```\n\n```\ndiv:nth-child(3n): matches every third child, starting from position\
    \ 0\nd:nth-child(3n+1): matches every third child, starting from position 1\n\
    d:nth-child(3n+2): matches every third child, starting from position 2\n```\n\n\
    # CSS3 Attribute Selection\n\nYou can specify CSS3 selectors that select HTML\
    \ elements as well as HTML elements based on the value of an attribute of an HTML\
    \ element using various regular expressions. For example, the following selector\
    \ selects img whose src attribute starts with the text string Sandra, and sets\
    \ the width attribute and the height attribute of the selected img elements to\
    \ 100px:\n\n```\nimg[src^=\"Sandra\"] {\n  width: 100px; height: 100px;\n}\n```"
