  md: '# 158 • CSS3 Pocket Primer


    An article with best practices for spritesheets is here: http://webdesign.tutsplus.com/articles/css-sprite-sheets-best-practices-tools-and-helpful-applications-webdesign-8340.


    If you need to resize any of your images, ImageMagick is an excellent command
    line tool for such task, and its home page is: http://www.imagemagick.org/script/convert.php.


    After resizing the images, you can create a new spritesheet with the modified
    images using a command line tool like Glue: http://glue.readthedocs.org/en/dataset/


    Perform an Internet search for other tools and then compare their features to
    determine which tools support your requirements.


    # The “Blur Up” Technique for Rendering Background Images


    This technique involves an initial design of a small image, followed by scaling
    that image and simultaneously applying a Gaussian blur filter (filters are discussed
    in Chapter 2). The details of this technique are described here: https://css-tricks.com/the-blur-up-technique-for-loading-background-images/


    An example of this technique is here: http://codepen.io/thatemil/pen/YaqG


    One interesting aspect of this technique pertains to the filter: you can use base64,
    CSS, or SVG for the filter definition. Another point of interest is the possibility
    of using this technique in progressive images (described in the next section).


    Incidentally, the Facebook engineering team uses this technique to load photo
    previews in their native applications.


    # Progressive Images


    Another technique for loading images in an HTML Web page involves progressive
    images. This technique involves downloading and displaying an initial version
    of an image that has a lower resolution, and then “progressively” downloading
    and redploying the image until the full resolution is rendered.


    Interestingly, this technique was available in 2008 (and possibly earlier), and
    recently has been a resurgence of interest in progressive images. However, the
    adoption rate of progressive images is still quite low. One possibility is mentioned
    in the following article that performed various tests images with three different
    formats: http://www.webperformancetoday.com/2014/09/17/progressive-image-rendering-good-evil/


    Although there are no definitive conclusions in the preceding article, there is
    an interesting quote:


    > “When, as with the Progressive JPEG method, image rendition is a two-stage process
    in which an initially coarse image snaps into sharp focus, cognitive fluency is
    inhibited and the brain has to work harder to make sense of what is being displayed.”'
