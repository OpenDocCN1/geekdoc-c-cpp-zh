  md: "# 134 • CSS3 Pocket Primer\n\n\"chain\" SVG filters: the output of one filter\
    \ can be the input of another filter (and the input for SVG filters requires the\
    \ output from two filters).\nAs you might surmise, SVG filters can be computationally\
    \ intense, which in turn can affect performance; in the case of mobile devices,\
    \ applications that contain such filters can affect battery life as well.\n\n\
    The list of filter-related SVG elements includes: feBlend, feColor-Matrix, feComponentTransform,\
    \ feComposite, feConvolveMatrix, feDiffuseLighting, feDisplacementMap, feFlood,\
    \ feGaussianBlur, feImage, feMerge, feMorphology, feOffset, feSpecularLighting,\
    \ feTile, and feTurbulence.\n\nYou can render 2D shapes and text with filter effects.\
    \ Listing 7.8 displays the contents of the SVG BlurFilterText.svg, which renders\
    \ a text with a blur filter.\n\n# LISTING 7.8 BlurFilterText1.svg\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"iso-8859-1\"?>\n<!DOCTYPE svg PUBLIC \"//W3C//DTD\
    \ SVG 20001102//EN\"\n\"http://www.w3.org/TR/2000/CR-SVG-20001102/DTD/svg-20001102.dtd\"\
    >\n\n<svg xmlns=\"http://www.w3.org/2000/svg\"\n     xmlns:xlink=\"http://www.w3.org/1999/xlink\"\
    \n     width=\"100%\" height=\"100%\">\n <defs>\n <filter id=\"blurFilter\"\n\
    \  filterUnits=\"objectBoundingBox\"\n  x=\"0\" y=\"0\"\n  width=\"100%\" height=\"\
    100%\">\n <feGaussianBlur stdDeviation=\"4\"/>\n </filter>\n</defs>\n\n <g transform=\"\
    translate(50,100)\">\n  <text id=\"normalText\" x=\"0\" y=\"0\"\n       fill=\"\
    red\" stroke=\"black\" stroke-width=\"4\"\n       font-size=\"72\">\n   Normal\
    \ Text\n  </text>\n\n <text id=\"horizontalText\" x=\"0\" y=\"100\"\n       filter=\"\
    url(#blurFilter)\"\n       fill=\"red\" stroke=\"black\" stroke-width=\"4\"\n\
    \       font-size=\"72\">\n   Blurred Text\n  </text>\n </g>\n</svg>\n```\n\n\
    The SVG <defs> element in Listing 7.8 contains an SVG <filter> element that specifies\
    \ a Gaussian blur with the following line:\n\n```\n<feGaussianBlur stdDeviation=\"\
    4\"/>\n```"
