  md: 'The following list contains some high-level techniques for rendering mobile
    forms:


    +   * Using semantic markup

    * Using a single column to display input fields (for smart phones)

    * Deciding on label alignment (left or top)

    * Grouping/chunking input fields

    * Tooltips or information bubbles

    * Displaying error messages

    * Appropriate field width

    * Suitable color scheme

    * Tabs instead of radio buttons

    * Handling drop-down lists (use predictive search or links)

    * Primary and secondary buttons

    * Spacing between input elements

    * Pop-up menu controls

    * Voice input


    Notice that there is no “reduce scrolling” in the previous list: users are accustomed
    to scrolling on smart phones and tablets. In addition, a single-column display
    was more important for smaller smart phones, but some smart phones display two
    columns in landscape mode, and tablets are even easier to scan accommodating in
    multiple columns of text.


    If you render text in a left-to-right direction, left-aligned labels enable you
    to place more input fields in a screen, and they are also easier to scan during
    field input. Top-aligned labels have the opposite advantages and disadvantages
    of left-aligned labels. Yet another technique is to use inline labeling, which
    essentially means that the “text prompt” for the input field provides a suggestion
    for the type of data that is expected.


    # SPECIFIC TECHNIQUES FOR STYLING MOBILE FORMS


    In the design techniques that are listed in the previous section, you can use
    some or all of these specific techniques:


    +   * Use CSS to style input fields differently

    * Provide labels for input fields

    * Specify keyboard types for input fields

    * Provide default or suggested values for input fields

    * Use constraints for numeric fields

    * Indicate required fields

    * Validate each field after user input

    * Utilize password masking

    * Employ field zoom'
