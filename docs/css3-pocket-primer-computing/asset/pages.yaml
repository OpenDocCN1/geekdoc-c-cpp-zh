    Although this is a very simple example, hopefully this code gives you an appreciation
    of the capabilities of CSS3 Media Queries.


    # SUMMARY


    This chapter showed you how to use meta tags in HTML5 Web pages for mobile applications.
    You saw how to use media queries inline in CSS using @media directives in order
    to conditionally style HTML elements. You also learned to use CSS3 Media Queries
    in order to detect an orientation change of a mobile device, as well as accomplishing
    the same effect using simple JavaScript code. In addition, you learned how to
    use CSS3 Media Queries with conditional logic based on different screen sizes
    or different resolutions, some of which are specific to Android devices and to
    iOS devices.


