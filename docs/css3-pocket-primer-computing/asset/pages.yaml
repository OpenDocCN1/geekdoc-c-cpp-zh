  md: '# CSS Modules and Local CSS


    CSS Modules provides another approach (unrelated to React) for local CSS via the
    local-style property. The CSS Modules team provides a namespace-like solution
    (a previous section describes names), along with separate compilation of different
    files, in order to provide CSS selectors that are not in the global namespace,
    and its home page is here: https://github.com/css-modules.


    The following articles describe CSS Modules in greater depth: http://glenmadden.com/articles/css-modules
    and http://www.sitepoint.com/understanding-css-modules-methodology.


    # Web Components and Local CSS


    A third approach (also unrelated to ReactJS) is the Shadow DOM that forces local
    CSS in different components, which is available in Web Components and Polymer
    (but not supported in all modern browsers).


    In Chapter 9, you will learn about Web Components, which enable you to define
    custom components that contain CSS selectors that are only visible inside the
    custom component, thereby also providing support for local CSS.


