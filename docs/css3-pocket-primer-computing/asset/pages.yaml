  md: '# • CSS3 Pocket Primer


    these new tags are: <section>, <article>, <aside>, <nav>, <header>, <canvas>,
    <video>, <audio>, <time>, <figure>, and <figcaption>.

    For, the HTML5 <section> tag can be used as a "container" for a document, whereas
    the HTML5 <article> tag is well-suited for representing the content of a newspaper
    article or a blog post. The HTML5 <header> and HTML5 <footer> represent the header
    and footer of an HTML5 <section> tag. The HTML5 <aside> tag contains information
    that is related to the primary content of a website (similar in nature to a "by
    the" type of comment).

    The HTML5 <nav> tag supports navigation for a section of a document in a website.
    Other new tags include the HTML5 <dialog> tag for marking up conversations and
    the HTML5 <figure> tag for associating a caption for videos or graphics (which
    is useful for search engines).

    The semantics of these tags are straightforward, there are some subtle aspects
    that you will learn as you experience with HTML5 websites.

    Semantic markup also includes WAI-ARIA (Web Accessibility Initiative – Accessible
    Rich Internet Applications). In brief, WAI-ARIA is a "bridging" technology that
    clarifies semantics of assistive technologies. The WAI-ARIA specification describes
    the roles, states, and properties that define accessible user interfaces, which
    are described (along with aria-* attributes on HTML elements) here:


    ```

    http://dev.w3.org/html5/spec/wai-aria.html

    ```


    # Article section: When are the HTML5? How Are They Used?


    The semantics of the HTML5 <section> element are complex, partly because they
    can be nested in each other: an <article> element can contain one or more <section>
    elements, and each of <section> elements can contain one or more <article> elements.
    While it is possible to devise a "hack" to disambiguate the logical relationship
    of these elements in a HTML5 website, no standard convention exists right now.
    Another factor is the manner in which these two HTML elements are treated by the
    Document Outlining Algorithm for creating outlines in HTML5 websites, which is
    described here:

    http://coding-smashingmagazine.com/2011/08/16/html5-and-the-document-outlining-algorithm.

    For simple HTML5 websites, the <article> element and the <section> element will
    behave in a reasonable manner, but for more complex HTML5 websites, the results
    might be unexpected (or unwanted). Before you use the <section> and <article>
    elements for order to determine the structural layout of your HTML5 website, think
    of the logical relationship of the content in it. If there is any possibility
    for confusion, it might also be helpful to include a comment section to make it
    easier for other people to understand the rationale for the layout of your HTML5
    website. In any case, it''s worth spending time learning about these elements
    and also about the Document Outlining Algorithm.'
