    # CSS3 ANIMATION AND CSS SPRITES


    CSS Sprites reduce the number of HTTP requests (which reduces response time for
    Web pages) and also reduce the total file size. The idea is simple: download a
    single image (which is called a sprite) that contains all the smaller images on
    a website, and then reference the smaller images by their location in the sprite.


    This process requires two steps: a) create the sprite, and b) for each image in
    the sprite, calculate its location in the sprite and then update CSS selectors.
    A much simpler alternative that will save you a lot of time and effort is an excellent
    tool called SpriteMe, which can be found at http://spriteme.org.


    This website contains a demonstration that shows you how to install the tool in
    your bookmarks toolbar and how to easily create a sprite in a matter of minutes
    for we. In addition you can download the generated sprite and the CSS selectors
    that contain the location of each image that is included in the sprite. After
    you have created a sprite, you can use the techniques that you learned earlier
    in this chapter in order to apply 2D and 3D animation effects on your sprite.


    Another useful website that contains a collection of techniques and tutorials
    involving CSS sprites can be found at http://nambrick.blogspot.com/2012/05/building-faster-websites-with-css.html?goback=%2Edge_2071438_member_120537762.


    The next section discusses performance-related topics, starting with an overview
    of CSS and the GPU.


    # HTML WEB PAGES AND THE GPU


    The material in this section is Admittedly more complex than other sections in
    this chapter and other chapters in this book, and that''s because there are factors
    involved to ensure that browsers render graphics smoothly (without any “jank”)
    at many frames per second. Nevertheless, you will see suggestions about the type
    of CSS code to avoid its adverse effect on the performance of a Web page.


    As a starting point, browsers render smooth CSS3-based graphics and animation
    effects with the help of a GPU, which is a single-chip dedicated processor that
    can improve the performance of video/graphics that involve 2D or 3D graphics.'
