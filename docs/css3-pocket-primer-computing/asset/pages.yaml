  md: '# Designing Mobile Apps 173


    per inch). Pixel units are virtual screen pixels rather than physical pixels.
    One point to keep in mind is that the pixel unit does not scale correctly for
    visually-impaired readers.


    You can use the px unit for text, images, borders, rounded corners, and drop shadows.
    However, if you are building a fluid layout that uses relative sizes, it''s better
    to use the em unit or the % unit for text.


    The em unit is more popular, especially on mobile devices, because this unit is
    well suited for scaling a Web page. Unlike the px unit, the em unit is relative
    to its parent element in a Web page. It might be helpful to think of the px unit
    as “global” when the em unit is “local”.


    One useful technique is to specify the value 62.5% for the <body> element. Since
    62.5% equals the fraction 5/8, the product of 16px and 5 is 25px. The value 10px
    is a convenient “base point” for performing conversions quickly and between px
    units and em units in CSS selectors. For example, 1.5em is 15px, 2em is 20px,
    2.5em is 25px, and so forth. In case you need help in performing conversions,
    an online calculator is here: http://riddle.pl/emcalc/ and http://www.ready.mobile/launch.jsp?locale=en_EN.


    Additional useful information is here: http://www.w3.org/QTips/font-size.


    # WHAT ISOGLE AMP?


    AMP is an open source initiative for rendering Web pages more quickly on mobile
    devices, and its home page is: https://www.ampproject.org.


    The initial AMP specification was announced in October 2015, and code samples
    are available here: https://github.com/ampproject/amphtml. Accelerated Mobile
    Pages can be loaded in any modern browser or Web view. However, AMP limits a subset
    of functionality compared to “regular” HTML Web pages in order to reduce the time
    to load AMPS in a browser. Moreover, AMPS can be cached in the cloud, which can
    yield additional speed improvements.


    Some of the AMP restrictions for AMP-compliant Web pages are here:


    +   No developer-written or third-party JavaScript

    No input elements of any kind, including standard input and text area

    No external style sheets and only one tag in the document head

    No inline styles

    Style rules must be at or below 50kb


    Consumers of the AMP specification include content producers, who can create AMP
    Web pages that can be crawled, indexed, and displayed. The good news is that Google
    AMP supports most SVG elements, and perhaps additional support will be available
    in the future.


    NOTE Google AMP supports most SVG elements.'
