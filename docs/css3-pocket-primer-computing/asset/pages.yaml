  md: "# Media Queries and Meta Tags\n\nthe CSS stylesheets basic.css into the CSS\
    \ stylesheet extended.css, both of which are in the same directory on the filesystem.\
    \ You can do so with the following code snippet:\n\n```\n@import basic.css\n```\n\
    \nYou can also import a CSS stylesheet that is available on the Internet instead\
    \ of the filesystem, as shown here:\n\n```\n@import url(http://www.princexml.com/fonts/larabie/index.css)\
    \ all;\n```\n\nThe next section discusses two important considerations to keep\
    \ in mind when you use the @import statement in CSS stylesheets.\n\n# Modularization\
    \ and Performance\n\nAlthough the @import statement can be very convenient, there\
    \ are two points to consider when you use this statement. First, the @import statement\
    \ can help you modularize your CSS stylesheets, but keep in mind that you need\
    \ to watch for overriding properties when it's not your intention to do so. Second,\
    \ there can also be a performance penalty. One popular technique for mitigating\
    \ the performance degradation is to use a tool that merges files together and\
    \ then compresses the single concatenated file. This approach reduces the number\
    \ of HTTP requests and also the total file size is sent to a Web page.\n\n# INLINE\
    \ AND LOCAL CSS\n\nThere are some well-known issues surrounding CSS, such as the\
    \ global nature of CSS selectors. If you need a refresher about the pros and cons\
    \ of CSS, including a discussion about inline styles, the following posts provide\
    \ useful information (along with some interesting reader comments): https://tricks.com/the-debate-around-do-we-even-need-css-anymore/\n\
    \nReact supports inline styles \"the React way,\" sometimes called \"CSS in your\
    \ JS.\"\n\nThe following presentation discusses the problems of CSS and how Facebook\
    \ has addressed them in ReactJS: https://speakerdeck.com/vuejs/react-css-in-js.\
    \ The key idea involves converting CSS selectors into JSON-based objects. For\
    \ instance, suppose you have the following CSS selector:\n\n```\ncontainer1 {\n\
    \  width: 50px;\n  height: 50px;\n  border-radius: 2px;\n}\n```\n\n```\ncontainer2\
