  md: '# CSS3 Pocket Primer


    HTML. First, you need to know the CSS3 features that are available in different
    browsers. One of the best websites for determining browser support for CSS3 features
    is here:


    http://canuse.com/ preceding link contains tabular information regarding CSS3
    support in many different browsers, which makes the information in that website
    very valuable.


    Another highly useful tool that checks for CSS3 feature support Enhance.js, which
    tests browsers to determine whether or not they can support a set of essential
    CSS and JavaScript properties, and then delivers features to those browsers satisfy
    the test. You can download Enhance.js here: https://github.com/filamentgroup/EnhanceJS.


    # QUICK OVERVIEW OF CSS3 FEATURES


    CSS3 adopts a modularized approach involving multiple specifications for extending
    CSS3 functionality as well as supporting new functionality. The following link
    contains a list of all the completed specifications and drafts by the CSS WG (specifications
    and Working Groups) are discussed in Chapter 1), along with their current status:


    https://www.w3.org/Style/CSS/current-work.en.html.


    In brief, CSS3 enables you to create boxes with rounded corners and shadow effects;
    create rich graphics using linear and radial gradients; detect portrait and landscape
    mode; detect the type of mobile device using media query selectors; and produce
    multicumn text rendering and formatting.


    In addition, CSS3 enables you to define sophisticated selection rules in selectors
    using pseudo-classes, first or last child (:first-child, :last-child, :first-of-type,
    and :last-of-type), and also pattern-matching tests for attributes of elements.
    Several sections in this chapter examples of how to create such selection rules.


    # CSS3 PSEUDO CLASSES AND ATTRIBUTE SELECTION


    This section contains examples of some pseudo-classes, followed by snippets that
    show you how to select elements based on the relative position of text strings
    in various attributes of those elements. Although this section focuses on :nth-child()
    pseudo-class, you will become familiar with other CSS3 pseudo-classes, and in
    the event that you need to use those pseudo-classes, a link is provided at the
    end of this section which contains more information and examples that illustrate
    how to use them.


    CSS3 supports an extensive and rich set of pseudo-classes, including nth-child(),
    along with some of semantically related “variants,” such as nth-of-type(), nth-first-of-type(),
    nth-last-of-type(), and nth-last-child().'
