  md: '# CSS-RELATED PERFORMANCE


    CSS3 provides wonderful functionality, such as rounded corners, as well as 2D
    and 3D graphics and animation effects. However, CSS3 features can differ in performance,
    which obviously affects the performance of an HTML5 Web page.


    Recall that you can guarantee that the GPU will be used on a device by using something
    such as translate3D(0,0,0), which is essentially a “no operation.” You can replace
    2D transforms by their corresponding 3D transforms. However, an indiscriminate
    use of 3D transforms can cause a page reflow or a page repaint, with an adverse
    impact on performance.


    Good articles regarding CSS paint times are here:


    +   * http://css-tricks.com/efficiently-rendering-css/

    * http://www.html5rocks.com/en/tutorials/speed/css-paint-times/

    * http://stickmanventures.com/labs/demo/spinning-gears-Chrome-Proxy-serve-3d/


    Another interesting point to consider is the use of CSS3 translate absolute position
    in a CSS selector. Paul Irish compares these techniques: http://paulirish.com/why-moving-elements-with-translate-is-better-than-pos-abs-topleft.


    If you are interested in the lower level details about the painting process, CSS2
    defines the order of the painting process, which is the order in which the elements
    are stacked in the “stacking contexts.” This order affects painting because the
    stacks are painted from back to front. The stacking order of a block renderer
    is:


    +   * Background color

    * Background image

    * Border

    * Children

    * Outline


    A more detailed explanation of the painting process can be found at the following:
    http://www.html5rocks.com/en/tutorials/speed/unnecessary-paint/ and http://www.html5rocks.com/en/internals/howbrowser-work.


    Steve Souders has written at least two performance-related books and has written
    many blog posts regarding performance, and it''s definitely worth reading his
    work.


    # A CONDEN COMPARISON OF CSS, SVG, AND CANVAS


    CSS3 provides a) 2D/3D graphics/animation, b) GPU support, c) the ability to embed
    in SVG <defs> element, d) “easing functions” for animation, and e) the capability
    to animate HTML elements.'
