    # SUMMARY


    This chapter showed you how to render line segments, rectangles, and circles in
    HTML5 Canvas. You saw how to combine HTML5 Canvas with CSS stylesheets to create
    animation effects. Next, you learned how to create linear and radial gradients
    in HTML5 Canvas. Finally, you learned how to embed PNG files in an HTML Canvas
