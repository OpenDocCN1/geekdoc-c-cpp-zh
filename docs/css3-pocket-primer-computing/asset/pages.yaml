    Keep in mind that it''s important to assess the trade-off (time, effort, and cost)
    when writing low-level Canvas-based graphics, such as the code samples in this
    chapter, versus the availability of open source projects and commercial products.
    If you prefer not to delve into all the JavaScript details for creating HTML5
    Canvas effects, there are online drawing tools that can generate the code for
    you. One free tool provides some basic functionality is: http://www.htmlcanvasstudio.com/


    # WHAT IS HTML5 CANVAS?


    Several years ago Canvas began on OS/X as a widget toolkit, and after Canvas had
    already been available in the Safari browser, it became a specification for the
    Web, and now it''s commonly referred to as HTML5 Canvas.


    HTML5 Canvas and SVG both allow you to programmatically render graphics in a browser
    via JavaScript. However, HTML5 Canvas uses ''immediate-mode'', which is a write-and-forget
    approach to rendering graphics. If you want to write a sketching program in HTML5
    Canvas and you also want to provide an ''undo'' feature, then you must programmatically
    track of everything that has drawn on the screen. On the other hand, SVG uses
    a ''retained mode'', which involves a DOM structure that keeps track of the rendered
    objects and their relationship to one another.


    If you are going to write HTML Web pages that make extensive use of graphics effects,
    you''ll probably need to understand the differences between HTML5 Canvas and SVG
    in performance. You have the freedom to use one technology exclusively, but you
    can also create HTML Web pages that contain a mixture of HTML5 Canvas, SVG, and
    CSS3, and performance-related information can help decide how you are going to
    code your HTML Web pages.


    Although this chapter does not delve into the preceding points in any detail,
    here you can find a good overview of some features/advantages of HTML5 Canvas
    here: http://thinkvitamin.com/code/how-to-draw-with-html5-canvas.'
