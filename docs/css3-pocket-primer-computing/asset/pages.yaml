  md: "Browsers read selectors right-to-left: this is a \"bottom up\" approach, and\
    \ the \"key\" selector is the right-most of a CSS selector. Right-to-left is more\
    \ efficient because the relationship of element:parent is one-to-one, whereas\
    \ the relationship of parent:child is many-to-one.\n\nAs an illustration, consider\
    \ the following CSS and HTML fragment:\n\n```\n#mylist { ... }\n<ul id=\"mylist\"\
    >\n  <li a=\" class=\"abc\" />\n  <li a=\" class=\"abc\" />\n  <li a=\" class=\"\
    abc\" />\n</ul>\n```\n\nNow suppose you have 100 <a> elements, and you want to\
    \ select the three <a> elements that have a class attribute value is abc. This\
    \ CSS selector matches the complete set of 100 <a> elements (which is not what\
    \ you want):\n\n```\n#mylist { ... }\n```\n\nOn the other hand, the CSS selector\
    \ matches *only* the three desired elements:\n\n```\n#mylist .abc { ... }\n```\n\
    \nA sample selector with efficient CSS involving calculate/layout/paint is here:\n\
    \n```\n.results h2              // recalculate style\n  height: 25px;        \
    \ // layout\n  text-shadow: 2px black; // paint\n```\n\nA slightly older (but\
    \ still useful) video by Paul Irish Performance Tooling covers performance-related\
    \ topics is here: http://www.youtube.com/watch?v=HAqyjCH_LO.\n\n# The translate()\
    \ Function versus Top/Left Properties\n\nThe factors in translate() include fact\
    \ that a) translate() does not \"touch\" the DOM, and b) translate() involves\
    \ subpixels, which produces smoother effects (possibly due to blurring). On the\
    \ other hand, favor the use of top/left/right instead of translate() when an element\
    \ has relative/absolute/fixed positioning in a Web page.\n\nKeep in mind that\
    \ both techniques can yield different results on different browsers. The following\
    \ detailed articles (by Chris Coy and Paul Irish) contain additional information:\n\
    \n```\nhttp://css-tricks.com/tale-of-animation-performance/\nhttp://www.paulirish.com/2012/why-moving-elements-with-translate-is-better-than-posabs-topleft/\n\
    ```"
  merge: -1
  pgno: 50
