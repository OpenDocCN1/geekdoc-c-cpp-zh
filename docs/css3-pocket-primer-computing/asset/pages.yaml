    # THE VIEWPORT META TAG


    HTML Web pages are rendered in a "virtual page," and the screen is window into
    that page. The viewport meta tag sets the dimensions of this virtual page. In
    addition, the viewport meta tag controls scaling of the browser window in iOS
    and Android. The viewport meta tag supports the following attributes:


    +   - Width: The width of the viewport in pixels (the default is 980), which can
    be between 200 and 10,000

    - Height: The height of the viewport in pixels. The default is calculated based
    on the width and the aspect ratio of the device, and it can be between 223 and
    10,000

    - Initial-scale: the initial "zoom factor" of an application, which users can
    scale in and out from that initial value

    - Minimum-scale: The minimum scale value of the viewport (the default is 0.25),
    which can be between 0 and 10.0

    - Maximum-scale: The maximum scale value of the viewport (the default is 1.6),
    which can be between 0 and 10.0

    - User-scalable: You can specify whether or not users can zoom in or out of an
    application (the default is "yes."). Set the value to "no" to prevent scaling


    In addition, you can set more than one viewport option in a meta tag by separating
    them with commas, as shown here:


    ```

    <meta name="viewport" content="width=device-width, user-scalable=no">

    ```'
