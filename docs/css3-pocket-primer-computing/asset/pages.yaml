    element in Listing 7.4. The companion disc contains the SVG document Polyline.svg,
    which renders the same cube as the code in Listing 7.4. Polyline.svg uses three
    <polyline> elements, whereas SCube.svg uses two <polygon> elements and one <rect>
    element to render a cube.


