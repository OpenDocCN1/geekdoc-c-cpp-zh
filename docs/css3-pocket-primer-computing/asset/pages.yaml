  md: '# PREFACE


    # WHAT IS THE PRIMARY VALUE PROPOSITION FOR THIS BOOK?


    This book is primarily about CSS3, along with some of the technologies that can
    be “combined” with CSS3. In fact, there are several non-CSS3 chapters in this
    book, including one SVG chapter and one chapter that delves into HTML5 Canvas
    and CSS3. In addition, several chapters contain optional sections that show you
    how to combine Query with CSS3 and also jQuery with SVG. If you are unfamiliar
    with jQuery, you can read the Appendix that provides an introduction to an assortment
    of topics, such as frameworks for CSS3, SASS and LESS, Bootstrap 4, Material Design,
    and CSSLint.


    The answer to this question is important, because you obviously want to determine
    how much of the material in this book will be useful and relevant to you. First,
    this book is not a reference guide of CSS3 syntax, nor does this book contain
    any “cheat sheets” (but you can probably find the latter one). Although the format
    bears a very slight resemblance to a “cookbook” style, this book does not provide
    an extensive set of how-to code samples that solve common tasks that you can probably
    find on Stackoverflow. Instead, some code samples in this book illustrate “core”
    features of CSS3, and are supplemented with interesting effects that are possible
    in CSS3. Indeed, some code samples create effects that you are unlikely to find
    anywhere else. Even though you probably will not use all of the examples in this
    book, you will learn about various coding techniques, and perhaps you will be
    able to take advantage of them in order to craft your own variations for your
    Web pages.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# WHAT DO I NEED TO KNOW FOR THIS BOOK?


    The most important prerequisite is familiarity with HTML and basic CSS. In some
    cases (such as the examples in Chapter 6), familiarity with basic JavaScript is
    definitely necessary in order to understand the code samples. One way to get a
    better idea about this book is to glance through some of the code samples to get
    an idea of how much is familiar to you and how much is new for you. If you overwhelmed
    by many unfamiliar concepts, then it''s advisable to select a different book.
    On the other hand, if you feel that the material is new yet within your grasp,
    you can fill potential gaps (obviously details in this book) by reading online
    tutorials. The decision process regarding the purchase of this book is obviously
    important to you, and satisfied customers are important to the publisher and the
    author.


    # THE TARGET AUDIENCE


    This book is intended to reach an international audience of readers with highly
    diverse backgrounds in various age groups. While many readers know to read English,
    their native spoken language is not English (which could be their second, third,
    or even fourth language). Consequently, this book uses standard English rather
    than colloquial expressions that might be confusing to those readers. As you know,
    many people learn by different types of information, which includes reading, writing,
    or hearing new material (yes, some basic videos are also available). This book
    takes these into consideration in order to provide a comfortable and meaningful
    learning experience for the intended readers.


    # GETTING THE MOST FROM THIS BOOK


    Some people learn well from prose, others learn well from sample code (and lots
    of it), which means there''s no single style that can be used for everyone.


    Moreover, some people want to start launching the HTML Web pages, see what they
    render, and then return to the code to delve into the details (and conversely,
    other people use the opposite approach).


    In order to provide meaningful content for both types of people, this book contains
    a mixture of code samples: some are short, some are long, and other code samples
    “build” from earlier code samples.


    The goal is to show (and not just) you a variety of visual effects that are possible,
    some of which you might not find anywhere else. You benefit from this approach
    because you can pick and choose the visual effects and the code that creates those
    visual effects.'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# HOW WAS THE CODE FOR THIS BOOK TESTED?


    The code samples in this book have been tested in a Google Chrome browser (version
    v51) on a Macbook Pro with OS X 10.14. Unless otherwise noted, no special browser-specific
    features were used, which means that the code ought to work in Chrome on other
    platforms, and also in other browsers. Exceptions are due to limitations in the
    cross-platform availability of specific features. Although the code also works
    in several earlier versions of Chrome on a Macbook Pro, you need to test the code
    on your platform and browser (especially if you are using Internet Explorer).


    Another point to keep in mind is that all references to “Web Inspector” refer
    to the Web Inspector in Chrome, which differs from the Web Inspector in Safari.
    If you are using a different (but still modern) browser or an early version of
    Chrome, you might need to check online for the sequence of keystrokes you need
    to follow to launch and view the Web Inspector. Navigate to this link for additional
    information:


    ```

    http://benalman.com/projects/javascript-debug-console-/

    ```


    # WHY DOES THIS BOOK HAVE 200 PAGES INSTEAD OF 500?


    This book is part of the Pocket Primer Series whose books are generally between
    200 and 250 pages. The target audience consists of readers ranging from beginners
    to intermediate in terms of their knowledge of HTML and JavaScript. At the same
    time, one of the primary rules of exposition any kind is “show, don’t tell.” While
    this rule is not taken literally in this book, it’s the motivation for showing
    first and telling second. If the adage “a picture is worth a thousand words” is
    true, then this book endeavors to provide both pictures and the words.


    # COMPANION DISC


    The companion disc included with the book contains all the code samples to save
    you time and effort from the error-prone process of manually typing code into
    an HTML Web page. In addition, there are situations in which you might not have
    easy access to companion disc. Furthermore, the code samples in the book provide
    explanations that are not available on the companion disc. All of the files of
    the companion disc are available for downloading by writing to the publisher at
    info@merclearning.com.


    # DOES THIS BOOK CONTAIN PRODUCTION-LEVEL CODE SAMPLES?


    The primary purpose of the code samples in this book is to illustrate various
    features of CSS3. Clarity has higher priority than writing more compact code that
    is more difficult to understand (and possibly more prone to bugs). If you decide
    to use any of the code in this book in a production website, you ought'
  merge: -1
