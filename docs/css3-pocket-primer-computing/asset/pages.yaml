  md: '# Designing Mobile Apps 175


    input, textarea, select, option


    *) unless it''s of type “application/ld+json”


    Allowed HTML elements (with caveats in some cases) include: button, link, style,
    most SVG elements, and some support for stylesheets.


    Built-in “core” AMP components are:


    ```

    amp-img, amp-audio, amp-video

    amp-pixel, amp-anim, amp-iframe

    amp-carousel, amp-lightbox, amp-ad

    amp-instagram, amp-twitter, amp-youtube

    ```


    NOTE Built-in components are always available in an AMP document and have an <amp->
    element.


    The Core/Extended AMP components include the following:


    ```

    amp-img amp-audio amp-video

    amp-pixel amp-anim amp-iframe

    amp-carousel amp-lightbox amp-ad

    amp-instagram amp-twitter amp-youtube

    ```


    Elements replaced by AMP include img (amp-img), video (amp-video), audio (amp-audio),
    and iframe (amp-iframe). An example of the <img> element is:


    ```

    <amp-img

    src="https://mysite/myimage.jpg"

    width="2000"

    height="1035"

    layout="responsive">

    </amp-img>

    ```


    An AMP extended component involves loading the JavaScript in the <head> element.
    Navigate to the following link to see an example of a simple AMP Web page: https://www.ampproject.org/docs/get_started/create/basic_markup.html.


    # WHAT ARE PROGRESSIVE WEB APPS?


    Progressive Web Apps are based on browser tabs, and they use the app shell model
    to give them a “look and feel” that is similar to native mobile. Progressive Web
    Apps are responsive (work with any form factor), safe (via HTTPS), and always
    up-to-date because of their use of Service Workers.


    A progressive web app performs the following steps:


    +   1. Registers a service worker'
  merge: -1
  pgno: 191
- img_proc: true
  md: '# 176 · CSS3 Pocket Primer


    +   2. Runs on HTTPS (required in order to prevent man-in-the-middle attacks)

    3. Creates a JSON-based manifest file with information about the app


    Service Workers consist of a collection of APIs (by Google) for offline access
    and Web push notifications. The manifest file contains metadata, such as icons,
    orientation, and so forth. Note that the Polymer startup kit contains a valid
    manifest file. Chrome for Android and Opera for Android allow you to save the
    app on your homescreen, which means it looks just like a "normal" website in browsers
    that do not support progressive apps. A key point is that the app works like a
    default orientation. An example of a progressive web app manifest is here: mobiforgorge.com/design-development/tcb-app-manifests-new-wave-progressive-apps-to-your-homescreen.


    # IMPROVING WEB PAGE PERFORMANCE


    Performance is always a very important consideration, and although detailed and
    lengthy discussion is beyond the constraints of this book, it''s important to
    be aware of some of the techniques that are available:


    +   • Concatenate JavaScript/CSS files into a single file

    • Use file compression (minification)

    • Use of sprites

    • Use base64 encoding of images

    • Defer the loading of JavaScript files


    A good blog post regarding the use of base64 for encoding images is: http://davidcalhoun.com/2011/chen-to-base64-encode-images-and-when-not-to?goback=%23Id=2071438_member_243228886.


    You can defer the loading of JavaScript files by placing <script> tags at the
    end of the <body> in a Web page.

    You can also explore RequireJS, which is a JavaScript toolkit for asynchronously
    downloading JavaScript dependencies, and its home page is: http://requirejs.org.


    Steve Souders has written at least two performance-related books and has written
    many blog posts regarding performance, and it''s definitely worth reading his
    work.


    # USE LINKS


    The following links are helpful for testing Mobile applications:


    +   • http://css3.test./

    • http://www.css3.info/selectors-test/'
