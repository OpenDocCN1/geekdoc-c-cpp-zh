  md: "# 18 CSS3 Pocket Primer\n\nThe preceding CSS3 selector is useful when you want\
    \ to set different dimensions to images based on the name of the images (such\
    \ as Sandra, Shelly, Steve, and so forth).\n\nThe following HTML <img> elements\
    \ do not match the preceding selector:\n\n```\n<img src=\"Sandra\" width=\"200\"\
    \ height=\"200\" />\n<img src=\"Sandra4\" width=\"200\" height=\"200\" />\n```\n\
    \nThe following selector selects HTML img whose src attribute contains the text\
    \ string jpeg, and then sets the width attribute and the height of the selected\
    \ img elements to 150px:\n\n```\nimg[src=\"jpeg\"] {\n  width: 150px; height:\
    \ 150px;\n}\n```\n\nThe preceding CSS3 selector is useful when you want to set\
    \ different dimensions based on the type of images (jpg, png, jpeg, and so forth).\n\
    The following selector selects HTML elements whose src attribute contains any\
    \ occurrence of the text string, and then sets the width attribute of the selected\
    \ HTML img elements to 200px:\n\n```\nimg[src=\"*baby\"] {\n  width: 200px;\n\
    }\n```\n\nThe preceding CSS3 selector is useful when you want to set different\
    \ dimensions based on the \"classification\" of the images (mybaby, yourbaby,\
    \ babybaby, and so forth).\n\nIf you want to learn more about patterns (and their\
    \ descriptions) that you can use in CSS3 selectors, an extensive list is available\
    \ here:\nhttp://www.w3.org/TR/css3-selectors.\n\n```\nhttp://www.w3.org/TR/css3-selectors.\n\
    ```\n\n+   CSS Level 4 selectors enable you to specify the parent of an HTML element.\
    \ An online tool for converting CSS3 selector expressions to XPath is here:\n\
    http://css2xpath.appspot.com.\n\n```\nhttp://css2xpath.appspot.com.\n```\n\nThis\
    \ concludes part one of this chapter, and the next section delves into CSS3 graphics-oriented\
    \ effects, such as rounded corners and shadow effects.\n\n# CSS3 SHADOW EFFECTS\
    \ AND ROUNDED CORNERS\n\nCSS3 shadow effects are useful for creating vivid visual\
    \ effects. You can use shadow effects for text as well as rectangular regions.\
