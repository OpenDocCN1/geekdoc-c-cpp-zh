  md: "The target-densitydpi (specified in the viewport meta tag) has been deprecated\
    \ (actually removed from WebKit), so it's advisable to use this property in order\
    \ to specify low, medium, or high dpi values in Android-based mobile applications.\n\
    \nYou can also use the viewport tag to prevent users from zooming or panning in\
    \ a mobile application. An example is:\n\n```\n<meta name=\"viewport\" content=\"\
    width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=0\" />\n\
    ```\n\nThe iOS platforms support the viewport tag as well as iOS-specific meta\
    \ tags, some of which are described here: http://developer.apple.com/library/safari/documentation/applications/reference/SafariHTMLRef/Articles/MetaTags.html#article_ref_doc/TP40008193-SW1.\n\
    \n# Viewport Units\n\nThe viewport refers to the browser screen, and the four\
    \ viewport units are here:\n\n+   - vw: the percentage of viewport width\n- vh:\
    \ the percentage of viewport height\n- vmin: the smaller of vw or vh\n- vmax:\
    \ the larger of vw or vh\n\nFor example, 1vw is 1% of the browser's width, which\
    \ means that 100vw is 100% of the browser width.\n\nThe following CSS selector\
    \ uses the calc() function and a CSS3 Media Query to calculate the font-size property\
    \ whenever an HTML Web page is resized:\n\n```\nhtml {\n  font-size: 100%;\n\n\
    \  // Scales by 1px for every 100px (starting from 600px)\n  @media (min-width:\
    \ 600px) {\n    font-size: calc(125% + 4 * (100vw - 600px) / 400)\n  }\n\n  //\
    \ Sets font-size to 24px (for 1000px or wider)\n  @media (min-width: 1000px) {\n\
    \    font-size: calc(150%)\n  }\n}\n```\n\nThe next portion of this chapter discusses\
    \ the @import statement for importing a CSS stylesheet into another CSS stylesheet.\n\
    \n# THE @IMPORT STATEMENT IN CSS3\n\nThe @import statement conveniently enables\
    \ you to import a CSS stylesheet into another stylesheet. For example, suppose\
    \ that you want to import"
