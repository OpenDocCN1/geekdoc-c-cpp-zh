  md: '# CSS3 2D TRANSITIONS


    CSS3 transitions involve changes to CSS values in a smooth fashion, and they are
    initiated by user gestures, such as mouse clicks, focus, or "hover" ef-fects.
    Transitions are very useful because you can use them to create animation effects
    on CSS properties for a specific length of time using so-called "easing functions,"
    which produce animation effects at different rates of change. For example, some
    easing functions vary at a constant rate during an animation ef-fect, whereas
    others create nonlinear effects (slow-fast-slow, fast-slow-fast, and so forth).
    Easing functions are powerful and useful because they enable you to create realistic
    effects, such as watching a baseball moving toward you through the air (this is
    also an example of slow-fast-fast animation).


    WebKit originally developed CSS3 transitions, and they are also available in Safari,
    Chrome (3.2 or higher), Opera (10.5 or higher), and Firefox (4.0 or higher) using
    browser-specific prefixes, which you will see later in this sec-tion. Keep in
    mind that there are toolkits (such as jQuery and Prototype) that support transitions
    similar to their CSS3-based counterparts.


    The basic syntax for creating a CSS transition is a "triple" that specifies:


    +   * A CSS property

    * A duration (in seconds)

    * A transition timing function


    Here is an example of a transition:


    ```

    transition-property: background;

    transition-duration: 0.5s;

    transition-timing-function: ease;

    ```


    Fortunately, you can also combine these transitions in one line, as shown here:


    ```

    transition: background 0.5s ease;

    ```


    ![](img/0a6af518702639b3a358cdd75f17af79_56_0.png)'
