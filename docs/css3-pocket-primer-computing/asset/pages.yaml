  md: '# USEFUL LINKS


    This section contains an assortment of links with useful additional information
    for various topics that were discussed in this chapter.


    A new set of "sketch-like" visual effects that use CSS3 is: http://an-drew-hoyer.com/index.html.


    Compatibility tables for support of HTML5, CSS3, SVG and in more desktop and mobile
    browsers is: http://canianuse.com.


    A website for generating CSS3 code using various CSS3 features is: http://CSS3generator.com.


    A website that enables you to perform live editing of the contents of CSS3 selectors
    and then see the results here: http://CSS3please.com.


    A toolkit that handles the details of browser-specific extensions for CSS3 properties
    that you can write prefix-less CSS3 selectors is: http://cssender.org.


    A website that enables you to create gradients online and view the associated
    CSS3 code is: http://gradients.io/


    Another website with information regarding browser support for HTML5 and CSS3
    features is here: http://html5read.com.


    An extensive collection of articles regarding HTML5 is available here: http://www.html5rocks.com/en/


    A website devoted to all things pertaining to CSS3 is: http://www.css3.info.


    The following is an excellent source for browser compatibility information on
    the Internet (maintained by Peter-Paul Koch): http://www.quirksmode.org.


    A very good online tool allows you to experiment with many CSS3 features and also
    display the associated CSS3 code can be found at http://www.westciv.com/tools/3DTransforms/index.html.


    These links provide a wealth of information and useful techniques, so you can
    find the information that you need to create the visual effects that you want
    for your website.


    # SUMMARY


    This chapter showed you how to create glow and fading effects, and how to render
    multicolum text. Then you learned how to use CSS3 keyframes and the CSS3 functions
    scale(), rotate(), and translate(), which enable you to create 2D animation effects.
    You learned about CSS Motion Paths, which is an experimental CSS3 feature that
    supports SVG-like animation effects. In addition, you learned about CSS3 filters,
    along with links to websites that can programmatically generate custom filters
    for Web pages.


    The final section of the chapter delves into combining CSS3 with jQuery in order
    to create 2D effects, as illustrated in a “follow the mouse” code sample.'
