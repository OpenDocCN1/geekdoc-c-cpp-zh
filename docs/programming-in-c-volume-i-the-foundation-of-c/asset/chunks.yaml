    Is where we are creating the object for the class. First, we state the name of
    the class that we are creating the object for and then we single-space and write
    the name of the object, which can be anything, followed by a semi-colon to end
    the statement, which I will assume from now on you understand the semi-colon and
    need no further explanation. Now that you have the object for the class you are
    using, you should specify a way to access the functions in that class as well
    as call the function in main(). We can do this will one string of code written
    in line 2 as,


    classObject.functionName();


    Here is the part where we take the object we created to call the function that
    we want to use in our program. We write the name of the class object separated
    by a period ‘.’ , followed by the name of the function that we want to call and
    the parameters.


    When we call functions we always need to add parameters, even if the function
    does not take in any parameters. Also remember not to add parameters after stating
    the name of a class because classes do not take parameters. We can now use classes
    to structure our code which if you have made it this far I am sure you are realizing
    that keeping track of things can be difficult. As we continue, you will find yourself
    using more and more classes as a tool to manage your code.


    Chapter 2.4 Practice Problems


    2.4a) Use a global variable to perform the calculation we used in section 2.1,
    x =7+(23/6)+(A/B),  solve this equation for ‘x’ inside of a class.


    2.4b) Create two classes, each with at least one function nested inside of it,
    and each function with an output operator. Call the functions.


    2.4c) Create a class with two functions. One function that solves 1yt =x for ‘x’
    given whatever value the user enters for ‘y’ and ‘t’. Use the second function
    to solve y=23+mx for whatever values the user enters for ‘m’ and ‘x’.


    Chapter 2.5


    Classes II


    Classes as we know them are used to group functions that are similar so that we
    have an easier time calling and finding these functions when we need them. In
    some cases, we may need to access a classes function for a different class, in
    these cases we use inheritance to allow a class to access the functions in another
    class. Inheritance allows us to use information that may be stored in one class
    be used in another class as well without moving any of the information between
    the classes. Although we usually create classes to keep certain specific related
    content; we may have a class that specifically needs some information from another
    class and without having to recode principles that are already outlined, we can
    use the idea of inheritance to inherit this code if needed.


    To inherit the information from another class we write he name of the class that
    we are inheriting from we write the name of the class we want to inherit from
    after the class that we are using the information in by setting a colon and then
    the word “public” and lastly the name of the class. 


    #include <iostream>


    using namespace std;


    class Team2{


    public:


    int Function2(){


            int x = 10;


            cout << x << endl;


        }


    };


    class Team : public Team2 {


    public:


        int function1(){


            Function2();


        }


    };


    int main()


    {


        Team TeamObj;


        TeamObj.function1();


        return 0;


    }


    With this form of inheritance, we took the information in the Team 2 class and 
    we are using that information the in-Team class. We took the inheritance of Team2
    and then we can use the functions that are stored inside this class.'
