    Chapter 3: Algorithms and Logic


    Chapter 3.1 The If and If-else Statement


    The if-statement is a very important logical process that we use in programming
    to take two or more conditions and test them against each other. The syntax for
    an if statement is,


    if(test == true){


    cout << “This Statement is True” << endl;


    }


    This says; if the test inside the parameters is true then the code that is in
    the body of the program is running and if not then the code inside the if statement
    body is not executed. For this test inside the parentheses we will again be using
    variables or statements that are tested against each other and for that test we
    will have to use conditional operators.


    Conditional Operators


    - == ,Equal to


    - > ,Greater than


    - >=,Greater than or equal to


    - < ,Less than


    - <=,Less than or equal to


    - !=,Not equal to


    An example of a true if statement is,


    float a = 10;


    float b = 15;


    if(a<b) {


    cout << “a is less than b” << endl;


    }


    In this if statement we are testing two variables ‘a’ and ‘b’ against one another
    to see if the value of ‘a’ is less than the value of ‘b’. Since this test evaluates
    as true, the code inside the if statement is ran and outputted to the screen.
    If the test evaluated to false there would be no action that would be taken.


    We can also use two more operators that can be used when testing if statements
    that when implemented are game changing to the natural way that if statements
    are thought of. These two operators are,


    - &&, Means AND


    - ||, Means OR


    The && operator is used to test two different statements against each other and
    will only evaluate to true if both statements in the test are true. And the ||
    operator which means OR is used to test two different statements and if at least
    one of the two statements are true then the test will run as true. For the example
    of this I will use several different operations so follow along carefully.


    float team1Health = 100;


    float team1Damage=20;


    string usersChoice;


    float team2Health = 100;


    float team2Damage =15;


    cout << “Choose a team:  a) Team 1” << endl << “b) Team 2” << endl;


    cin >> usersChoice;


    if(usersChoice == ‘a’){


    cout << “You have chosen team 1! ” << endl;


    cout << “Your damage is : ” << team1Damage << endl;


    cout << “Your Health is: ” << team1Health << endl;


    }


    if(usersChoice == ‘b’ ){


    cout << “You have chosen team 2! ”<< endl;


    cout << “Your damage is : ” << team2Damage << endl;


    cout << “Your Health is: ” << team2Health << endl;


    }


    In this program, you can see that are two separate teams each with a specific
    health and a specific damage. You are given the choice of which team you want
    to play on by typing ‘a’ for team 1 and ‘b’ for team 2\. Upon the input, you are
    given the team that you picked by being presented with an output specifying that
    team and you are also told the amount of health your team has and the amount of
    damage that each attack will give to your opponent.


    Note: Something else we see while using the if-statement is the use of the ==
    operator. We only use the == operator when we are testing two statements/variables
    against each other. When we use a single equals sign we are declaring a statement/variable
    a value.


    Remember , there could also be any other set of conditions and that we could use
    different comparison operators. For example, we could add another if-statement
    at the end of this code that says, if we get any other user input other than ‘a’
    or ‘b’ then the program will tell the user that their input is invalid.


    If(usersChoice != ‘a’ || ‘b’){


    cout << “INVALID!” << endl; }


    Which says that if the usersChoice variable is not ‘a’ or ‘b’, meaning if the
    user does not enter ‘a’ or ‘b’; they will get a message outputted to their screen
    that says Invalid.


    Expanding on this same topic is the if-else statement which is just the if statement
    with another body of code at the end of it.


    The syntax of the if-else statement is,


    int main(){


    if(test == True){


    // Run these Commands if the test is true.


    } else {


    // Run these commands if test is false.


    }


    }


    We test something inside the parameters of the if statement and if the statement
    is true than the body of code in the if-statement will be ran. But if the test
    happens to be false then to program will run the code inside the else block of
    code. The else declaration does not require any parameters as no test needs to
    be ran. These purpose of the if else statement is to provide a way for a program
    to test true and false and output and outcome for each no matter what the answer
    to the test yields. When we are closing blocks of code we also do not need a semi-colon
    because the compiler already knows that the forward brace ‘{’ signifies the start
    of a blocks of code and that the backwards brace ‘}’ signifies the end of the
    code block. 


    Challenge Problem:


    3.1a) Nest an if-else statement inside of a function.


    Chapter 3.2


    Switches


    When we are programming and we have tons of different if statement that are running
    different tests and outputting answers depending on the results of each test,
    we can quickly become overwhelmed with all the code that must be written to perform
    a task life this and this is not to mention all the different blocks of code that
    will accrue over time. This is where the use of switches comes into play as they
    serve as a medium for these tests to occur without having to restate the whole
    conditional statement and with only one block of code. Using switches is very
    lucrative as we can use them in almost any situation that we need to perform multiple
    tests.  


    We can think of a switch as a function and inside this function we use sub-cases
    called cases that are the tests that are ran on the switch. Lastly, we use something
    called a ‘break’ that will separate the results that occur upon the truth of one
    of the tests.


    The syntax of the switch statement is,


    switch(variableTested){


    case TEST1:


    // if the test is true run this code


    break;


    case TEST2:


    // if the test is true run this code


    break;


    }


    An example of the use of a switch is,


        int x;


        cout << "enter x: " << endl;


        cin >> x;


    switch(x){


    case 1:


        cout << "1! " << endl;


        break;


    case 2:


        cout << "2!" << endl;


        break;


