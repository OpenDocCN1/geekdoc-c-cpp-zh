    ## Chapter 1


    ### Chapter 1.1 The Programming Environment


    To begin programming in `c++` we need to first download the graphical user interface
    (GUI) that we will be using to write our code in. The best programming environment
    for `c++` is called `Codeblocks` and can be downloaded for free. While there are
    other programming environments you may also use, `Codeblocks` will be the easiest
    to learn at first and create for an easier transition to other GUI and software.
    One of the largest environments used to program is `Microsoft Visual Studio` which
    is for experienced users and once you learn the foundation of programming you
    should feel free to download this software and use that instead of `CodeBlocks`.


    Graphical User interfaces serve as the main component in writing any computer
    code. Because GUI is the way data is represented to users, giving programmers
    a platform to code on as well as visually see projects. `CodeBlocks` is a free
    graphical user interface that we will be using throughout this book because everyone
    can download this software and because it is ‘in my opinion’ the best free graphical
    user interface. Ensuring that you know how to use this software because when issues
    arrive this knowledge will become primary in problem solving. As mentioned earlier
    you do not have to use `Codeblocks` but I would high recommend it to anyone who
    is completely new to programming. When downloading `CodeBlocks` we need to make
    sure that we are downloading the correct version for the correct operating system
    that you are currently running. This is huge as `Codeblocks` can be a very touchy
    piece of software, again, just take some time to familiarize with the software
    before entering the code of chapter 1\.


    Another thing to note when downloading `CodeBlocks` is that we need to run over
    code and test it. We also need something that will do this for us and that is
    called the `compiler`. The compiler that `CodeBlocks` uses its built into the
    software which is a huge plus, but we should make sure that we click on the correct
    download link that includes this compiler. The download link will have the words
    `mingw` in the link somewhere and will include the `GNU GCC Compiler` that we
    need to run our code. Going through the installation of `CodeBlocks` make sure
    to read instructions carefully and you will be asked again what compiler you want
    to use during the installation process; In which you will of course choose the
    `GNU GCC Compiler`. Once you are done installing the program you will get the
    home screen of `CodeBlocks` where we can now begin to write our code.


    From the home screen of `CodeBlocks` click on the `create a new project` sub-link,
    next you will be presented with a dialog box that say’s `New from template` as
    the title of the window. From here click `Projects` on the left side of the dialog
    box and then `console application` on the windows to the right. You will then
    be asked if you are programming in `C` or `C++` and while you know we are using
    `C++`, `C` isn’t that much different and if you want to learn that as well the
    transition from `C++` to `C` will be very easy to do. Next, we simply need to
    name our project and pick that place for our project folder to be saved. Lastly,
    we choose our `GNU GCC Compiler`, make sure the `Create Dialog Configuration`
    box is checked and that the `Create release configuration`, is unchecked.


    Once you click finish you are finally done setting up `CodeBlocks` and now have
    an environment to program and code as we wish. But we still should go over all
    the different buttons that are everywhere, which I will be glad to tell you that
    most of the features, most of which will not be used, but will later become apparent
    of their use. Later if you decide to continue to use `CodeBlocks` you will see
    that there are tons of plugins for different types of programming that can be
    done. For now, all we will use are the `management` tab on the left side of the
    software, if you do not see the management tab on the left side of the screen
    press `Shift+F2` and that will open that management tab, we will also need to
    be familiar with the file and build tabs on the top of the `Codeblocks` menu.
    `File` is where we will go to save, open, and close `CodeBlocks` and `build` is
    where will tell `Codeblocks` to compile and run our code. For example, Going to
    `File > new > Project`, will bring us back to the original screen of `CodeBlocks`
    where we can create a different project. You can have several projects open at
    once in `CodeBlocks` which is the reason for the management tab on the left side
    of the screen.


    Navigating to the `build` tab you will see the dropdown list that allows us to
    run and build or project using the compiler that we have previously installed.
    When we are running our programs, we will be using the `build and run` button
    (`Shift F9`) to build our program (resend it to the compiler) and run the program,
    which outs the program result. If you look down onto the code editor you will
    see a bit of code already inserted into it. Navigate to build and run, and run
    this program to see its result, and make sure you have everything installed correctly.
    You will get the console window that most of our code will appear in (until defined
    differently) saying “Hello World” by default. This is the first program that we
    have ran and the first program most programmers run when they are learning any
    programming language.

