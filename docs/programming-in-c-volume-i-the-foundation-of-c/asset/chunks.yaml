  trans: "\n\n## 2.2a) 创建两个全局变量和两个局部变量（位于函数内部），并输出所有四个变量。\n\n## 2.2b) 创建至少 3 个独立的函数。每个函数至少包含一个局部变量。找到一种独特的方法将这些函数组合成一个程序。\n\
    \n# 第 2.3 节\n## 内存地址与指针\n### 内存与变量\n当我们需要时，可以使用取地址符 `&` 获取变量的内存地址。因为我们所知，变量存储在程序的存储中，在某些情况下，我们可能需要知道内存地址，它作为每个变量的“邮箱”。每个邮箱都有一个地址，如果我们使用\
    \ `&-变量名`，就可以访问该地址。\n\n```\nint x = 5;\ncout << \"memory address: \" << &x <<\
    \ endl;\n```\n这段代码输出变量 `x` 的内存地址，我们可以使用这种技术向程序输出任何地址。\n\n**挑战性题：** 打印 5 个不同变量的内存地址。\n\
    \n### 指针\n当我们专门创建一个想要访问其内存地址的变量时，我们使用被称为“指针”的东西，通过 `*` 符号进行访问。所以，当我们创建一个指向内存地址的指针时，我们会这样写：\n\
    \n```cpp\nint Function1(){\n    int *x = &5;\n    cout << \"the memory address\
    \ of x: \" << *x << endl;\n}\n\nint main(){\n    Function1();\n}\n```\n这里我们有一个名为\
    \ `x` 的整数指针，它的值为 5。我们现在可以使用指针来提取存储在 `x` 内存位置中的信息。我们可以在同一区域内使用多个指针：\n\n```cpp\n\
    int main(){\n    int *pointer1, *pointer2;\n    cout << \"Memory Address 1: \"\
    \ << &pointer1 << endl;\n    cout << \"Memory Address 2: \" << &pointer2 << endl;\n\
    }\n```\n我们指的是变量本身，而不是使用物理内存地址。当我们使用某些数据类型时，我们是在要求计算机为变量留出特定数量的内存。这样程序员就知道了在所有不同情况下应该使用哪种数据类型。\n\
    \n## 第 2.3 节练习题\n- **2.3a)** 打印五个不同变量的内存地址。\n- **2.3b)** 创建五个指向五个不同内存地址的指针以及每个指针的值。输出每个内存地址，并编号一到五。\n\
    - **2.3c)** 创建一个包含指针的循环。尝试使用数学运算符更改内存地址的值。发生了什么？\n\n# 第 2.4 节\n## 类与对象\n在编程时，我们创建类来将相似的函数组合在一起，并用作容器来分组函数以提高可读性和操作性。通常只在我们使用多个函数时才使用类，我们再次使用它们将具有共同目标或协同工作的任务组合在一起。类的语法如下：\n\
    \n```cpp\nclass className{\nint newFunction (){\n};\n\nint main(){\nclassName\
    \ classObject;\nclassObject.functionName();\n}\n```\n\n要声明一个类，我们输入小写的 `class`，然后输入类名，后面跟着\
    \ `{}` 大括号和一个结束的分号。因此我们有一个类、一个类名，以及类内部一个名为 `newFunction()` 的函数。你应该注意的第一点是，我们在声明类时没有使用括号或参数，这是因为没有语句是在类中运行的；类的唯一理由或目的是是作为函数的容器。在结束的大括号和分号之后，我们进入\
    \ `main` 函数，在 `main` 函数内部我们有一个名为“类对象”的新主题。\n\n类对象用于调用指定对象内部创建的函数。每个类都应该有一个对应的对象，如果类没有对象，那么类内部编写的函数就无法被调用。语法如上所述，但为了进一步说明第一行：\n\
    \n```\nclassName classObject;\n```\n这是我们为该类创建对象的地方。首先，我们声明要为之创建对象的类名，然后空一格并写对象的名称（可以是任何名称），最后跟一个分号结束语句。现在你已经有了正在使用的类对象，你应该指定一种访问该类中函数的方法，并在\
    \ `main()` 中调用该函数。我们可以通过第 2 行编写的一行代码来实现：\n\n```cpp\nclassObject.functionName();\n\
    ```\n这里是我们使用所创建的对象来调用程序中想要使用的函数的部分。我们编写类对象的名称，用句点 `.` 隔开，后面跟我们想要调用的函数名称和参数。\n\n\
    当我们调用函数时，我们总是需要添加参数，即使该函数不接收任何参数。还要记住，在声明类名后不要添加参数，因为类不接受参数。我们现在可以使用类来构建我们的代码，如果你已经读到了这里，我确定你已经意识到追踪事情可能是困难的。随着学习继续，你会发现自己越来越多地使用类作为工具来管理代码。\n\
    \n## 第 2.4 节练习题\n- **2.4a)** 使用全局变量执行我们在 2.1 节中使用的计算 `x =7+(23/6)+(A/B)`，在类内部求解该方程的\
    \ `x`。\n- **2.4b)** 创建两个类，每个类内部至少嵌套一个函数，且每个函数都有一个输出操作。调用这些函数。\n- **2.4c)** 创建一个带有两个函数的类。其中一个函数根据用户输入的\
    \ `y` 和 `t` 求解 `yt =x` 的 `x`。第二个函数根据用户输入的 `m` 和 `x` 求解 `y=23+mx`。\n\n# 第 2.5 节\n\
    ## 类 II\n我们知道类用于组合相似的函数，以便在我们需要时更容易地调用和查找这些函数。在某些情况下，我们可能需要访问另一个类的函数；在这些情况下，我们使用继承来允许一个类访问另一个类。继承允许我们在不移动类之间信息的情况下，在一个类中使用另一个类存储的信息。虽然我们通常创建类是为了保持特定的相关内容；我们可能会有一个类专门需要从另一个类获取某些内容，而无需重写已经概述的原则，可以使用继承的思想来继承这些代码。\n\
    \n要从另一个类继承信息，我们在使用该信息的类后面写上我们想要继承的类的名称，方法是设置一个冒号，然后是 `public` 单词，最后是类名。\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nclass Team2{\npublic:\nint Function2(){\n\
    \    int x = 10;\n    cout << x << endl;\n    }\n};\n\nclass Team : public Team2\
    \ {\n\npublic:\n    int function1(){\n        Function2();\n    }\n};\n\nint main()\n\
    {\n    Team TeamObj;\n    TeamObj.function1();\n    return 0;\n}\n```\n\n通过这种继承的形式，我们获取了\
    \ `Team2` 类的信息，并在 `Team` 类中使用这些信息。我们获取了 `Team2` 的继承，现在可以使用存储在该类内部的函数。\n\n"
- fmt: "\nWhen we are specifying public, private, and protected at the beginning of\
    \ programs we are given our class what is called an access specifier. Access specifiers\
    \ tell the program what classes may access each other’s data. For instance, when\
    \ create a class and have everything inside of the class set to `public`, we are\
    \ saying that any class or function in that class can be used outside of that\
    \ class. But when we set out access specifier to `private` we are saying that\
    \ we do not want other classes or functions to be able to access the data stored\
    \ in that class. But there is also the `protected` access specifier which is used\
    \ when we have classes nested inside one of another. The `protected` access operator\
    \ is only used when nesting class and this again ONLY allows for the parent class\
    \ of the nested class the access the data in the child class.\n\n| Access Specifier\
    \ Type | Definition |\n| :--- | :--- |\n| `public:` | Allows all classes and functions\
    \ to access the classes data. |\n| `private:` | Does not allow other classes or\
    \ functions to access the classes data. |\n| `protected:` | Child Classes nested\
    \ inside parent classes will be able to share data. |\n\n## Chapter 2.5 Practice\
    \ Problems\n\n**2.5a)** Create two classes each with its own function and connect\
    \ these classes using inheritance.\n\n## Chapter 3: Algorithms and Logic\n\n###\
    \ Chapter 3.1 The If and If-else Statement\n\nThe `if`-statement is a very important\
    \ logical process that we use in programming to take two or more conditions and\
    \ test them against each other. The syntax for an `if` statement is,\n\n```cpp\n\
    if(test == true){\n    cout << “This Statement is True” << endl;\n}\n```\n\nThis\
    \ says; if the test inside the parameters is true then the code that is in the\
    \ body of the program is running and if not then the code inside the if statement\
    \ body is not executed. For this test inside the parentheses we will again be\
    \ using variables or statements that are tested against each other and for that\
    \ test we will have to use conditional operators.\n\n#### Conditional Operators\n\
    \n- `==` ,Equal to\n- `>` ,Greater than\n- `>=`,Greater than or equal to\n- `<`\
    \ ,Less than\n- `<=`Less than or equal to\n- `!=`,Not equal to\n\nAn example of\
    \ a true `if` statement is,\n\n```cpp\nfloat a = 10;\nfloat b = 15;\nif(a<b) {\n\
    \    cout << “a is less than b” << endl;\n}\n```\n\nIn this if statement we are\
    \ testing two variables `a` and `b` against one another to see if the value of\
    \ `a` is less than the value of `b`. Since this test evaluates as true, the code\
    \ inside the if statement is ran and outputted to the screen. If the test evaluated\
    \ to false there would be no action that would be taken.\n\nWe can also use two\
    \ more operators that can be used when testing if statements that when implemented\
    \ are game changing to the natural way that if statements are thought of. These\
    \ two operators are,\n\n- `&&`, Means AND\n- `||`, Means OR\n\nThe `&&` operator\
    \ is used to test two different statements against each other and will only evaluate\
    \ to true if both statements in the test are true. And the `||` operator which\
    \ means OR is used to test two different statements and if at least one of the\
    \ two statements are true then the test will run as true. For the example of this\
    \ I will use several different operations so follow along carefully.\n\n```cpp\n\
    float team1Health = 100;\nfloat team1Damage=20;\nstring usersChoice;\nfloat team2Health\
    \ = 100;\nfloat team2Damage =15;\ncout << “Choose a team:  a) Team 1” << endl\
    \ << “b) Team 2” << endl;\ncin >> usersChoice;\nif(usersChoice == ‘a'){\n    cout\
    \ << “You have chosen team 1! ” << endl;\n    cout << “Your damage is : ” << team1Damage\
    \ << endl;\n    cout << “Your Health is: ” << team1Health << endl;\n}\nif(usersChoice\
    \ == ‘b’ ){\n    cout << “You have chosen team 2! ” << endl;\n    cout << “Your\
    \ damage is : ” << team2Damage << endl;\n    cout << “Your Health is: ” << team2Health\
    \ << endl;\n}\n```\n\nIn this program, you can see that are two separate teams\
    \ each with a specific health and a specific damage. You are given the choice\
    \ of which team you want to play on by typing ‘a’ for team 1 and ‘b’ for team\
    \ 2. Upon the input, you are given the team that you picked by being presented\
    \ with an output specifying that team and you are also told the amount of health\
    \ your team has and the amount of damage that each attack will give to your opponent.\n\
    \nNote: Something else we see while using the if-statement is the use of the `==`\
    \ operator. We only use the `==` operator when we are testing two statements/variables\
    \ against each other. When we use a single equals sign we are declaring a statement/variable\
    \ a value.\n\nRemember , there could also be any other set of conditions and that\
    \ we could use different comparison operators. For example, we could add another\
    \ if-statement at the end of this code that says, if we get any other user input\
    \ other than ‘a’ or ‘b’ then the program will tell the user that their input is\
    \ invalid.\n\n```cpp\nIf(usersChoice != ‘a’ || ‘b’){\n    cout << “INVALID!” <<\
    \ endl;\n}\n```\n\nWhich says that if the `usersChoice` variable is not ‘a’ or\
    \ ‘b’, meaning if the user does not enter ‘a’ or ‘b’; they will get a message\
    \ outputted to their screen that says Invalid.\n\nExpanding on this same topic\
    \ is the if-else statement which is just the if statement with another body of\
    \ code at the end of it.\n\nThe syntax of the if-else statement is,\n\n```cpp\n\
    int main(){\n    if(test == True){\n        // Run these Commands if the test\
    \ is true.\n    } else {\n        // Run these commands if test is false.\n  \
    \  }\n}\n```\n\nWe test something inside the parameters of the if statement and\
    \ if the statement is true than the body of code in the if-statement will be ran.\
    \ But if the test happens to be false then to program will run the code inside\
    \ the `else` block of code. The `else` declaration does not require any parameters\
    \ as no test needs to be ran. These purpose of the if else statement is to provide\
    \ a way for a program to test true and false and output and an outcome for each\
    \ no matter what the answer to the test yields. When we are closing blocks of\
    \ code we also do not need a semi-colon because the compiler already knows that\
    \ the forward brace `{` signifies the start of a blocks of code and that the backwards\
    \ brace `}` signifies the end of the code block. \n\n**Challenge Problem:**\n\n\
    3.1a) Nest an if-else statement inside of a function.\n\n## Chapter 3.2 Switches\n\
    \nWhen we are programming and we have tons of different if statement that are\
    \ running different tests and outputting answers depending on the results of each\
    \ test, we can quickly become overwhelmed with all the code that must be written\
    \ to perform a task life this and this is not to mention all the different blocks\
    \ of code that will accrue over time. This is where the use of switches comes\
    \ into play as they serve as a medium for these tests to occur without having\
    \ to restate the whole conditional statement and with only one block of code.\
    \ Using switches is very lucrative as we can use them in almost any situation\
    \ that we need to perform multiple tests. \n\nWe can think of a switch as a function\
    \ and inside this function we use sub-cases called `cases` that are the tests\
    \ that are ran on the switch. Lastly, we use something called a `break` that will\
    \ separate the results that occur upon the truth of one of the tests.\n\nThe syntax\
    \ of the switch statement is,\n\n```cpp\nswitch(variableTested){\n    case TEST1:\n\
    \        // if the test is true run this code\n        break;\n    case TEST2:\n\
    \        // if the test is true run this code\n        break;\n}\n```\n\nAn example\
    \ of the use of a switch is,\n\n```cpp\n    int x;\n    cout << \"enter x: \"\
    \ << endl;\n    cin >> x;\nswitch(x){\n    case 1:\n        cout << \"1! \" <<\
    \ endl;\n        break;\n    case 2:\n        cout << \"2!\" << endl;\n      \
    \  break;\n}\n```\n"
