    logic for functions that are being used as well as implement these tasks. Header
    files are also known as preprocessor directives because they are files that the
    processor loads before compiling the code written inside of the .cpp file. This
    is important for the structure of c++ because before the compiler can read the
    code, it takes in the preprocessor directives and takes in the logic of what functions
    can be used inside the program. This allows for our programs to run more efficiently
    as the preprocessor directives are loaded up before the program runs and while
    it may create a bigger startup impact, the program will already have done this
    in startup so the program does not slow down, freeze, or try to run this process
    while its running.


    The c++ standard library (#include <cstdlib>) is used to perform several different
    tasks and can be added to the top of your c++ code under or above the existing
    header file. A popular function in the c standard library is the random function
    which allows us to get a random number.


    #include <iostream>


    #include <cstdlib>


    #include <ctime>


    using namespace std;


    int main(){


        float num;


    srand(time(NULL)) ;


    cout << rand();


    cin.get();


    }


    We have added two different header files to this program, both of which are necessary
    to access the information used. When we use ''#include <cstdlib>'' we are saying
    that we are including the c standard library which again allows us to access the
    srand(); function, which stands for seed random and inside the parameters we use
    the time function which has the parameter of ''NULL''. To use this time function,
    we also should introduce a new header file ''#include <ctime>'' which will allow
    the program to access the time. But we are not accessing the time directly. The
    value returned by,


    srand(time(NULL));


    Passing time(NULL) into the srand function starts a counter that counts how many
    seconds have passed since 00:00 hours, January 1, 1970 which is what we know in
    programming as the date of the ''Unix timestamp''. Which in turn allows us to
    always get a different value every single time we ask for this number.


    We can use namespaces and header files we can call all types of interesting functions
    and commands. When we need a special case like this in the future we know that
    we can look at different header files that offer different functions such as the
    ‘srand()’ function that can help further expand on our programs.


