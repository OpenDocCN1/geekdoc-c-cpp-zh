  trans: "\n变量还有一点必须被考虑，被称为变量作用域（variable scope）。变量作用域是指变量在程序中使用的位置，不同类型的作用域包括全局作用域和私有作用域。当变量具有全局作用域时，它可以在程序中的所有函数中使用。正如你记得的，我们目前只使用了一个函数（`main`\
    \ 函数），并且我们一直在 `main` 函数中编写所有的变量，但我们也可以在 `main` 函数之外编写变量，这些被称为全局变量，因为它们具有全局作用域。\n\
    \n### 全局作用域 (Global Scope)\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint globalVariable = 5;\n\nclass VariableScope{\n    public:\n    int VS1(){\n\
    \        int localVariable = 10;\n    }\n};\n\nint main (){\n    VariableScope\
    \ VSobj;\n    VSobj.VS1();\n}\n```\n\n在这里我们可以看到如何使用局部变量和全局变量。注意并理解创建这些变量之间的区别。下一种作用域被称为私有作用域（private\
    \ scope），就是我们在 `main` 函数内部声明变量时所使用的。这类具有私有作用域的变量只能在 `main` 函数内部使用，如果你创建另一个函数尝试使用不在该函数中的私有作用域变量，会导致错误。虽然我们还没有讲过如何创建函数，但现在理解它们的用法是非常重要的，这样当我们继续学习并讨论函数时，你将对变量和变量作用域如何工作原理有正确的洞察，这将使学习创建函数变得更容易。\n\
    \n另外请注意，如果你不是在写多行代码，就不必写代码中的 `<< endl` 部分，但要确保在代码行的末尾添加分号。在大多数示例中，我会使用 `endl;`，因为它会让代码在打印到控制台时更易读。理解编程是如何工作的关键以及能够存储不同的公式、单词和算法是必不可少的。在任何编程语言或环境中，都会使用变量来存储信息，这些信息程序员在编程过程中可以使用或者用户在使用程序时需要。我们还可以使用变量来存储数字等信息，然后我们可以创建不同的变量来操作这些变量，例如：\n\
    \n```cpp\nfloat x=4;\nfloat y=5;\nfloat z=6;\nfloat eQ = x+y;\ncout << eQ/z <<\
    \ endl;\n```\n\n在上面的示例中，我们创建了 3 个变量来存储 3 个不同的整数，然后我们使用变量 `eQ` 将其中两个数字相加，最后我们输出\
    \ `eQ` 除以 `z` 的结果。这是一个关于如何存储变量并在程序稍后使用它们执行操作（如数学运算）的示例。这个概念在我们学习循环和递增时会被高度利用。\n\
    \n虽然创建一个变量似乎是某种恒定的东西，但它并不是。可以通过重新声明变量名称并赋予变量新值来改变其原始值。这方面一个例子可以是：\n\n```cpp\n\
    float damage = 20.23;\ncout << “Current Damage: ” << damage << endl;\ndamage =\
    \ damage + 3;\ncout << “Current Damage: ” << damage << endl;\n```\n\n在这里，我们创建了一个名为\
    \ `damage` 的变量来存储浮点值，并给它赋值 20.23，然后简单地将 `damage` 的值输出给用户。接下来，我们重新声明了变量名 `damage`，并表示我们取\
    \ `damage` 的原始值并加上 3。因此，在第一行输出中我们将得到 20.23，但当我们第二次使用该变量时，我们将得到 23.23 或 `20.23\
    \ + 3.00`。你可以看到在此过程中，我们在第一次声明变量时调用了变量类型、名称和值，但在第二次声明它时，我们只使用了变量名以及分配给它的新值。这是因为在我们最初调用变量时已经声明过变量类型。当我们第二次使用该变量时，编译器已经知道变量的类型，因此我们不需要再次声明变量类型。你现在可以看到如果我们创建两个同名的变量，会发生什么不便。\n\
    \n为了完全理解变量作用域的概念，请在你的程序中 `main` 函数“上方”创建一个函数。这将允许我们讨论变量作用域，以及为什么在运行多个函数时记住作用域是重要的。我们在编程时会使用两种类型的作用域，它们之间存在巨大的差异。\n\
    \n### 公共作用域 (Public Scope)\n\n首先，我们有公共作用域，当我们编程时，我们经常使用位于公共作用域范围内的变量，这意味着该变量可以在我们希望任何函数中使用。要使一个变量变为公共，我们只需要做一件事，那就是将变量声明放在我们创建的函数之外。但记得前面提到的，我们看到必须将变量声明放在所有其他函数之上，因为编译器是从上到下读取的。如果我们创建一个变量且它在顶部且不在任何其他函数内部，它被称为全局变量，可以在任何函数中使用而不会引起任何问题。要检查这一陈述，只需创建一个变量并在\
    \ `main` 函数内部输出它，并在刚刚创建的函数内部输出它。你会发现，如果变量在函数的上方，变量的值将无问题地打印出来。\n\n但如果我们把那个变量放在其中一个函数内部；那么另一个函数将无法注意到它，由于这个原因，调试器会说你请求的变量不在它的作用域内。这就是我们所说的私有变量，私有变量仅限于在声明它的的函数中使用。当你创建了一个函数后，我们还应该记得在\
    \ `main` 函数中调用该函数，以便在我们运行程序时函数能够运行。在调用函数时，你再次应该记住调用函数的顺序与函数运行的顺序是相同的。\n\n### 第\
    \ 2.2 节练习题\n\n"
- fmt: "\n## 2.2a) Create two global variables and two local variables, that are in\
    \ a function and output all four variables.\n\n## 2.2b) Create at least 3 separate\
    \ functions. Each function should have at least one local variable. Find a unique\
    \ way to tie these functions together into a single program.\n\n# Chapter 2.3\n\
    ## Memory Addresses and Pointers\n### Memory and Variables\nWhen we need to we\
    \ can use the ampersand `&` to give us the memory address of a variable. Because\
    \ as we know variables are held in storage of the program and in certain situations\
    \ we may want to need to know the memory address which serves as the mail box\
    \ for each variable. Each mailbox has an address and we can access that address\
    \ if we use ampersand-variable.\n\n```\nint x = 5;\ncout << \"memory address:\
    \ \" << &x << endl;\n```\nThis code outputs the memory address of the variable\
    \ `x` and we can use this technique to output any address to the program.\n\n\
    **Challenge Problem:** Print the memory address of 5 different variables.\n\n\
    ### Pointers\nWhen we are specifically creating a variable that we want to access\
    \ the memory address of we use something called a pointer which is accessed by\
    \ `*` sign. So, when we are creating a pointer to a memory address we would write\
    \ like:\n\n```\nint Function1(){\n    int *x = &5;\n    cout << \"the memory address\
    \ of x: \" << *x << endl;\n}\n\nint main(){\n    Function1();\n}\n```\nHere we\
    \ have an integer pointer named `x` and has the value of 5. We can now use our\
    \ pointer to extract the information stored is the `x` memory spot. And we can\
    \ use multiple pointers in the same section by:\n\n```\nint main(){\n    int *pointer1,\
    \ *pointer2;\n    cout << \"Memory Address 1: \" << &pointer1 << endl;\n    cout\
    \ << \"Memory Address 2: \" << &pointer2 << endl;\n}\n```\nWe refer to the actual\
    \ variable instead of using physical memory address. When we use certain data\
    \ types we are asking the computer to set aside a specific amount of memory for\
    \ variables to hold. That way the programmers know which data type to use in all\
    \ the different.\n\n## Chapter 2.3 Practice Problems\n- **2.3a)** Print the memory\
    \ addresses of five different variables.\n- **2.3b)** Create five pointers to\
    \ five different memory addresses and the value of each pointer. Output each memory\
    \ address, numbering them through five.\n- **2.3c)** Create a loop that involves\
    \ a pointer. Try to change the value of a memory address using a math operator.\
    \ What happens?\n\n# Chapter 2.4\n## Classes and Objects\nWe create classes to\
    \ group together functions that are similar when we are programming and are used\
    \ as containers to group functions for readability and manipulation. Usually only\
    \ use classes when we are using several functions and again we use them to group\
    \ together tasks that have a goal or work together. The syntax for a class is:\n\
    \n```cpp\nclass className{\nint newFunction (){\n};\n\nint main(){\nclassName\
    \ classObject;\nclassObject.functionName();\n}\n```\n\nTo declare a- class, we\
    \ type `class` in lowercase letters and then we type the name of the class after\
    \ which is followed by `{}` braces and an ending semicolon. So we have a class,\
    \ a class name, and a function inside the class named `newFunction()`. The first\
    \ thing you should notice is the fact that we are not using parentheses or parameters\
    \ when we declare a class, that is because there are no statements that ran through\
    \ a class; the only reason or purpose that a class serves is to serve as a container\
    \ for functions. After the ending brace and semicolon, we enter the `main` function\
    \ and inside the `main` function we have a new topic called a class object.\n\n\
    Class objects are used to call functions that are within the specified object\
    \ is made for. Every class should have a corresponding object and if the class\
    \ does not have an object then the functions written inside the class cannot be\
    \ called. The syntax is stated above but to go into further detail the first line:\n\
    \n```\nclassName classObject;\n```\nIs where we are creating the object for the\
    \ class. First, we state the name of the class we are creating the object for\
    \ and then we single-space and write the name of the object, which can be anything,\
    \ followed by a semicolon to end the statement. Now that you have the object for\
    \ the class you are using, you should specify a way to access the functions in\
    \ that class as well as call the function in `main()`. We can do this with one\
    \ string of code written in line 2 as:\n\n```cpp\nclassObject.functionName();\n\
    ```\nHere is the part where we take the object we created to call the function\
    \ we want to use in our program. We write the name of the class object separated\
    \ by a period `.`, followed by the name of the function we want to call and the\
    \ parameters.\n\nWhen we call functions we always need to add parameters, even\
    \ if the function does not take in any. Also remember not to add parameters after\
    \ stating the name of a class because classes do not take parameters. We can now\
    \ use classes to structure our code which if you have made it this far I am sure\
    \ you are realizing that keeping track of things can be difficult. As we continue,\
    \ you will find yourself using more and classes as a tool to manage your code.\n\
    \n## Chapter 2.4 Practice Problems\n- **2.4a)** Use a global variable to perform\
    \ the calculation we used in section 2.1, `x =7+(23/6)+(A/B)`, solve this equation\
    \ for `x` inside of a class.\n- **2.4b)** Create two classes, each with at least\
    \ one function nested inside of it, and each function with an output operator.\
    \ Call the functions.\n- **2.4c)** Create a class with two functions. One function\
    \ that solves `1yt =x` for `x` given whatever value the user enters for `y` and\
    \ `t`. Use the second function to solve `y=23+mx` for whatever values the user\
    \ enters for `m` and `x`.\n\n# Chapter 2.5\n## Classes II\nClasses we know them\
    \ are used to group functions that are similar so that we have an easier time\
    \ calling and finding these functions when we need them. In some cases, we may\
    \ need to access a function for a different class; in these cases we use inheritance\
    \ to allow a class to access functions in another class. Inheritance allows us\
    \ to use information that may be stored in one class in another class as well\
    \ without moving any of the information between the classes. Although we usually\
    \ create classes to keep specific related content; we may have a class that specifically\
    \ needs some from another class and without having to recode principles that are\
    \ already outlined, we can use the idea of inheritance to inherit this code if\
    \ needed.\n\nTo inherit information from another class we write the name of the\
    \ class that we are inheriting from we write the name of the class we want to\
    \ inherit from after the class that we are using the information in by setting\
    \ a colon and then the word `public` and lastly the name of the class.\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n\nclass Team2{\npublic:\nint Function2(){\n\
    \    int x = 10;\n    cout << x << endl;\n    }\n};\n\nclass Team : public Team2\
    \ {\n\npublic:\n    int function1(){\n        Function2();\n    }\n};\n\nint main()\n\
    {\n    Team TeamObj;\n    TeamObj.function1();\n    return 0;\n}\n```\n\nWith\
    \ this form of inheritance, we took the information in the `Team2` class and we\
    \ are using that information the `Team` class. We took the inheritance of `Team2`\
    \ and then we can use the functions that are stored inside this class.\n"
