    Chapter 3.3


    Loops


    Sometimes we have code that we will want to run more than one time and this is
    where we should introduce a new concept called looping. Looping allows us to reiterate
    code and run it more than one time which can create a new avenue of concepts that
    allows for tons of new programming ideas. The concept of a loop can be explained
    as a function that tests a certain set of parameters and if the test inside of
    the set of parameters is true, the code inside of the loop will run.


    The first loop that we will go over is called a ‘while’ loop which has the syntax
    of


    while(test){


    // run this code


    }


    The while loop takes parameters that are the ‘test’ of the loop and if the test
    of the loop is true then the body of code while run, until the loop becomes is
    false. The test of the loop is written inside parentheses which are referred to
    as the loops parameters.


    This is better to see in an example,


    int main(){


    int x =4;


    int y =5;


    while(x>y){


    cout << x << endl;


    }


    In the main function, we can see that we have two integer variables, one of which
    is 4 and one is 5\. Next, we have our while loop which says that if ‘x’ is greater
    than ‘y’, we output the value of ‘x’. If we run this code we will see that we
    get a never-ending program that will forever outputting the value of x. And while
    in some cases we will see that this is a useful technique to use when we are programming
    but not much. And what I mean by this is that we need to terminate this code somehow.
    Maybe we want the loop to run 10 times or 100 times, but it will be very rare
    for us to have a loop that never stops.


    To stop our loops, we need to change the value of x or change the value of y (while
    the program is running) that will eventually cause the test to be false. For this
    we use an incrementer to change the value of one of the variables. But what is
    an incrementer? An incrementer changes the value of a specific variable by taking
    that variable and adding, subtracting, multiplying, or dividing the value while
    the program is running the test within the while loop. In c++, the most common
    incrementer is ‘x++’ which means x = x+1, which takes the value of ‘x’ (which
    is just the name of the variable), and adds ‘1’ to that number every time. So,
    if we put x++ in the body of the while loop than the value of x will change by
    +1 every time the loop is ran, and the test will become false.


    int main (){


    int x = 4;


    int y = 5;


    while(x>y) {


    cout << x << endl;


    x++;


    }


    When we run this code, we will get the value of x, just a single time. This is
    because when the program runs this loop the second time the value of x will be
    equal to the value of y, and there for not greater than y. If we wanted this loop
    to run twice we could say,             


    while(x>=y)


    Which would run twice because the second time the loop runs ‘x’ will be equal
    to ‘y’ which still true given the test inside of the parameters. We can use whatever
    values that we want to use for the variables as well as the incrementer. The incrementer
    could be set to,


    #include <iostream>


    using namespace std;


    int main(){


    int x = 0;


    int y = 10;


    while(x<=10){}


    cout << x << endl;


    x = x+5;


    }


    This loop increments by 5 by taking the value of x and adding 5 each time to it
    which will allows this loop to run twice before it terminates.


    There is also a slightly modified version of the while loop that we can use in
    some cases called the ‘do-while’ loop.


    do{


    }while(test)


    The ‘do-while’ loop guarantees that the code inside of it runs at least one time
    before terminating. We get the ‘do’ block which will be ran before the test of
    the while loop is even ran, the test can be true or false and we will still get
    the loop ran at least one time.


