  trans: "\n\n当我们在程序开头指定 `public`（公共）、`private`（私有）和 `protected`（保护）时，我们为类提供了被称为“访问修饰符”的内容。访问修饰符告诉程序哪些类可以访问彼此的数据。例如，当我们创建一个类并将类内部的所有内容都设置为\
    \ `public` 时，我们是在说该类中的任何类或函数都可以在类外部使用。但当我们将访问修饰符设置为 `private` 时，我们不希望其他类或函数访问存储在类类中的数据。不过，还有\
    \ `protected` 访问修饰符，它用于一个类嵌套在另一个类内部的情况。`protected` 访问操作符仅在类嵌套时使用，且这再次**仅**允许嵌套类的父类访问子类中的数据。\n\
    \n| 访问修饰符类型 | 定义 |\n| :--- | :--- |\n| `public:` | 允许所有类和函数访问类的数据。 |\n| `private:`\
    \ | 不允许其他类或函数访问类的数据。 |\n| `protected:` | 嵌套在父类中的子类能够共享数据。 |\n\n## 第 2.5 节练习题\n\
    \n**2.5a)** 创建两个类，每个类都有自己的函数，并使用继承连接这些类。\n\n## 第 3 章：算法与逻辑\n\n### 第 3.1 节 if 和\
    \ if-else 语句\n\n`if`语句是一个非常重要的逻辑过程，我们在编程中使用它来获取两个或多个条件并进行相互测试。`if` 语句的语法如下：\n\n\
    ```cpp\nif(test == true){\n    cout << “This Statement is True” << endl;\n}\n\
    ```\n\n这表示：如果参数内的测试为真，则程序体中的代码将运行；如果不是，则 `if` 语句体内的代码将不会执行。对于括号内的这个测试，我们将再次使用相互测试的变量或语句，并且为了该项测试，我们必须使用条件操作符。\n\
    \n#### 决操作符\n\n- `==` ，等于\n- `>` ，大于\n- `>=`, 大于或等于\n- `<` ，小于\n- `<=` 小于等于\n\
    - `!=`,不等于\n\n一个真实的 `if` 语句示例如下：\n\n```cpp\nfloat a = 10;\nfloat b = 15;\nif(a<b)\
    \ {\n    cout << “a is less than b” << endl;\n}\n```\n\n在这个 `if` 语句中，我们相互测试两个变量\
    \ `a` 和 `b`，查看 `a` 的值是否小于 `b` 的值。由于此测试结果为真，`if` 语句内部的代码将运行并输出到屏幕。如果测试结果为假，则不会采取操作。\n\
    \n我们还可以使用两个在测试 `if` 语句时的操作符，它们在实现时会改变人们对 `if` 语句的自然认知。这两个操作符是：\n\n- `&&`，意味着与（AND）\n\
    - `||`，意味着或（OR）\n\n`&&` 操作符用于测试两个不同的语句，只有当测试中的两个语句都为真时，结果才为真。而表示或的 `||` 用于测试两个不同的语句，如果两个语句中至少有一个为真，测试就会作为真运行。为了演示这个例子，我将使用几种不同的操作，请仔细跟进。\n\
    \n```cpp\nfloat team1Health = 100;\nfloat team1Damage=20;\nstring usersChoice;\n\
    float team2Health = 100;\nfloat team2Damage =15;\ncout << “Choose a team:  a)\
    \ Team 1” << endl << “b) Team 2” << endl;\ncin >> usersChoice;\nif(usersChoice\
    \ == ‘a'){\n    cout << “You have chosen team 1! ” << endl;\n    cout << “Your\
    \ damage is : ” << team1Damage << endl;\n    cout << “Your Health is: ” << team1Health\
    \ << endl;\n}\nif(usersChoice == ‘b’ ){\n    cout << “You have chosen team 2!\
    \ ” << endl;\n    cout << “Your damage is : ” << team2Damage << endl;\n    cout\
    \ << “Your Health is: ” << team2Health << endl;\n}\n```\n\n在这个程序中，你可以看到有两个独立的团队，每个团队都有特定的生命值和伤害值。你可以通过输入‘a’代表\
    \ 1 号队，输入‘b’代表 2 号队来选择你想加入的队伍。输入后，程序会通过输出指定该团队的信息向你展示你选择的团队，还会告诉你你团队的生命值以及每次攻击将给对手造成的伤害值。\n\
    \n注意：在使用 `if`语句时看到的另一个点是使用了 `==` 操作符。我们只有在相互测试两个语句/变量时才使用 `==` 操作符。当我们使用单个等号时，我们是在为语句/变量赋值。\n\
    \n记住，还可能存在任何其他条件组合，我们可以使用不同的比较操作符。例如，我们可以在这段代码末尾添加另一个 `if` 语句，表示如果我们收到除了‘a’或‘b’以外的任何用户输入，程序将告诉用户他们的输入无效。\n\
    \n```cpp\nIf(usersChoice != ‘a’ || ‘b’){\n    cout << “INVALID!” << endl;\n}\n\
    ```\n\n这意味着如果 `usersChoice` 变量不是‘a’或‘b’（即用户没有输入‘a’或‘b’），程序将输出无效。\n\n这表示如果 `usersChoice`\
    \ 变量不是‘a’或‘b’，它会输出一条消息。继续扩展这一话题的是 `if-else` 语句，它只是 `if` 语句结尾的另一个代码块。`if-else`\
    \ 语句的语法如下：\n\n```cpp\nint main(){\n    if(test == True){\n        // 如果测试为真执行这些命令。\n\
    \    } else {\n        // 如果测试为假执行这些命令。\n    }\n}\n```\n\n我们在 `if` 语句的参数中进行测试，如果语句为真，则执行其体内的代码。如果测试为假，则执行\
    \ `else` 块中的代码。`else` 声明不需要任何参数，因为不需要测试。`if-else` 语句的目的是为程序提供一种测试真假的方法，并根据测试结果给出相应的输出。当我们关闭代码块时，也不需要分号，因为编译器已经知道正大括号\
    \ `{` 表示代码块的开始，反大括号 `}` 表示代码块的结束。\n\n**挑战题：**\n\n3.1a) 在函数内部嵌套一个 `if-else` 语句。\n\
    \n## 第 3.2 节 switch 语句\n\n当我们编程时，如果有大量的 `if` 语句在运行不同的测试并根据每个测试的结果输出答案，为了完成某项任务必须编写的代码可能会让我们应接不暇，更不用说随着时间的推移会产生的所有代码块。这就是\
    \ `switch` 语句大显身的时候，它们为这些测试提供了一个媒介，而无需重写整个条件语句且只需一个代码块。使用 `switch` 是非常有益的，因为在任何需要执行多次测试的情况下都可以使用它们。\n\
    \n我们可以将 `switch` 想象成一个函数，在这个函数内部我们使用了被称为 `case` 的子情况，这些是在 `switch` 上运行的测试。最后，我们使用被称为\
    \ `break` 的内容，用于分离当某个测试为真时产生的结果。\n\n`switch` 语句的语法如下：\n\n```cpp\nswitch(variableTested){\n\
    \    case TEST1:\n        // 如果测试为真，运行这段代码\n        break;\n    case TEST2:\n\
    \        // 如果测试为真，运行这段代码\n        break;\n}\n```\n\n`switch` 语句的使用示例如下：\n\n```cpp\n\
    \    int x;\n    cout << \"enter x: \" << endl;\n    cin >> x;\nswitch(x){\n \
    \   case 1:\n        cout << \"1! \" << endl;\n        break;\n    case 2:\n \
    \       cout << \"2!\" << endl;\n        break;\n}\n```\n\n"
