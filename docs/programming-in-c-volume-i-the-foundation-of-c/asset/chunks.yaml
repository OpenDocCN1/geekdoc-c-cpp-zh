- fmt: "After you have navigated through CodeBlocks and are generally familiar with\
    \ everything, navigate to the folder where your program was saved previously.\
    \ If you cannot find this folder, save it again to a parent folder that will hold\
    \ all your programs of somewhere that you can easily navigate. Open the folder\
    \ that contains the program that you saved and you will notice that there are\
    \ two folders within the program folder along with 3 other files. You should have\
    \ a folder called `bin` and a folder called `obj` these folders are for the compiler\
    \ and will be used later. You will also have the Project file used which is what\
    \ you will click on when you are opening the project in CodeBlocks. You may see\
    \ the CodeBlocks icon next to the project file and you can use this as a reference\
    \ when you want to open a program that you have in a folder. Lastly there is the\
    \ main source `.cpp` file which is a file that contains the c++ code. The reason\
    \ of this file is to store the code if you want to use it somewhere else, are\
    \ sending it to someone, and if you use a different software such as visual studio,\
    \ down the road, you can easily transfer code back and forth from each platform.\
    \ This brings us back into c++ being an object orientated programming language\
    \ which allows for rearrangement and the reuse of functions that are previously\
    \ created. Unlike some different languages which are proprietary to the program\
    \ they are made for and must be highly modified to use in other programming environments.\n\
    \nAlthough I am using CodeBlocks as the software to program in; you are free to\
    \ use any software that you want. There are tons of great software to download\
    \ as well as amazing IDE’s out there and you are free to try other programs as\
    \ they may suit you better. The reason that I primarily chose CodeBlocks is because\
    \ it is a simple to use software that is only aimed towards writing c, c#, and\
    \ c++ code while almost all other programs focus on the use of all programming\
    \ languages. With this IDE, we do not have to worry too much about all the different\
    \ buttons and settings that are for other programming languages, and rather we\
    \ can focus just on c++ programming script and the functions of the language.\
    \ This will make for a much easier transition as you go onto using other pieces\
    \ of software that are more dynamic and have more options such as application\
    \ creation, platform integration, as well as allow you to write in several different\
    \ languages, create databases, and much more.\n\nIn the real world, different\
    \ companies use tons and I do mean tons of different types of programming environments\
    \ so I guess the versatility of being able to use multiple environments can be\
    \ beneficial but that comes will time. But after you learn how to write the code\
    \ the job of leaning the software and other programming languages will become\
    \ easier because of the similarities between IDE and code implementation; the\
    \ only real thing that changes when you are writing in a different programming\
    \ language is the syntax of statements and functions. And the only thing that\
    \ changes when you go from one IDE to another is the face that some allow for\
    \ more versatility and options like Visual Studio and others IDE’s like CodeBlocks\
    \ are used to create programs that usually do not display graphics but rather\
    \ run and implement tasks in the background.\n\n# Chapter 1.2 Program Structure\
    \ and Layout\n\nEvery programming language has a specific defined syntax that\
    \ it uses to define its code. Syntax is just a way of structuring the code so\
    \ that it has a clear outline and can be read by other programmers if needed.\
    \ Most programs are built by teams of people so most of the traits that C++ offers\
    \ over other programming languages is its ability to move the code from place\
    \ to place with ease. Regarding to the syntax of the language almost every command\
    \ in c++ will end with a semicolon (`;`) which tells the compiler that the command\
    \ is defined and defines the end of the command.\n\nThe first two lines of code,\
    \ `#include <iostream>` and `using namespace std` are static throughout most of\
    \ c++ programming, as well as the, `int main () {}`, function that will serve\
    \ as the key to the program. Understanding this layout is important and when we\
    \ build onto it you will understand why.\n\n`#include <iostream>`, is what we\
    \ call a header file and the file that we are calling is the iostream header file.\
    \ The `iostream` header file is just telling our program that we are going to\
    \ eventually want our program to output some result or overall goal to the console.\
    \ Next, we have `using namespace std;`, which is just an easier medium that allows\
    \ our code to be more structured when we are ready to publish it to whatever market\
    \ its aimed towards.\n\nAfter creating a program file, you will see this code\
    \ written inside the console,\n\n```cpp\n#include <iostream>\n\nusing namespace\
    \ std;\n\nint main (){\n\nreturn 0; \n}\n```\n\nThe command `return 0;` can be\
    \ discarded and we have,\n\n```cpp\n#include <iostream>\n\nusing namespace std;\n\
    \nint main (){\n\n}\n```\n\nThis is what is called the “Main Function” and I say\
    \ this with much emphasis because it is by far the most used block of code in\
    \ all c++. Now, first we should understand what a function is in computer programming.\
    \ A function is usually; besides in the case of the `main function`; used to hold\
    \ a specific set of rules that complete a specific task for the program. The main\
    \ function is a bit different because it not only can hold its own information\
    \ but it also must know of every other function in the program. No matter what\
    \ we are doing we will always end back to the main function to call that function\
    \ which is something we will go over in chapter 2 when creating multiple functions\
    \ other than the main function. But this is the reason that the main function\
    \ is needed. You can think of the main function as the CPU on a PC’s motherboard,\
    \ it handles the tasks that the computer needs but it uses the hard-drive (or\
    \ in this case) other functions to hold the information. The `int` part of the\
    \ code is known as the return value/type that the function which will be explained\
    \ later. After that we see two parentheses and body quotes closing with a semicolon,\
    \ which if you remember, signifies the end to the main function. The set of parentheses\
    \ after `main()` are called parameters and are used to hold specific conditions\
    \ that a function can take. The `main` function does not need any parameters.\
    \ Lastly, we should body quotes `{}` which are going to hold all the information\
    \ for the main function. Any main function command will be written inside of these\
    \ braces which are better known as the block of code that all functions by a semicolon.\
    \ Now that there is a layout of the configuration that we will be using, we can\
    \ begin to learn about how memory is stored on computers and how software and\
    \ programs deal with the things that it has been programmed to remember. With\
    \ a blank screen with little to no code we have a long way to go until we reach\
    \ the point where we can say we have developed a c++ program. In any source of\
    \ computing storage is essential. Not only do you need it for music and games\
    \ but it is also what holds the operating system and literally all other information\
    \ that PC needs to run.\n\n# Chapter 1.3 Output and Input\n\nWhen we ran our first\
