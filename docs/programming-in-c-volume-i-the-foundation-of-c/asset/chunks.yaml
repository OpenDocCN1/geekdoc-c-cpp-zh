  raw: 'Variables also have something that must considered which is called the variable
    scope. Variable scope is where the variable is used within the program and the
    different types of scope include global scope and private scope. When a variable
    has a global scope, it can be used in all the functions in a program. As you remember
    we are just using one function at this point (the main function) and we have been
    writing all our variables in the main function but we can also write our variables
    outside of the main function, these are called the global variables because they
    have global scope.


    Global Scope, 


    #include <iostream>


    using namespace std;


    int globalVariable = 5;


    class VariableScope{


        public:


        int VS1(){


            int localVariable = 10;


        }


    };


    int main (){


        VariableScope VSobj;


        VSobj.VS1();


    }


    Here we can see how to use both a local variable and a global variable. Notice
    and understand the difference between creating these variables. The next type
    of scope that there is; is called private scope and is what we have been using
    when we declare the variables inside the main function. These types of variables
    with private scope can only be used within the main function and if you make another
    function that tries to use a variable with private scope that is not in that function,
    will cause an error. While we have not yet gone over how to make a function yet,
    understanding their use now is important so that as we move along and get into
    talking about functions, you will have the proper insight into how variables and
    variable scope work which will make learning to create functions easier.


    Also note that you do not have the write the ‘<< endl’ part of the code if you
    are not writing out multiple lines of code but make sure to add the semicolon
    at the end the end the line of code. In most examples, I will use endl; as it
    makes the code easier to read when printing it to the console.


    The main key to understanding how programming works and being able to store different
    formulas, words, and algorithms are a must. In any programming language or environment
    there will be variables used to store information that either the programmer will
    use during the process of programming or the user will need when using the program.
    When can also use variables to store information such as numbers and then we can
    create different variables that manipulate those variables such as,


    float x=4;


    float y=5;


    float z=6;


    float eQ = x+y;


    cout << eQ/z << endl;


    In the example above we created 3 variables that are used to store 3 different
    integers and then we use the variable eQ to add two of those numbers together,
    and finally we output the result of eQ divided by z. This is an example of how
    we can store variables and use them later in a program to perform operations such
    as math operations. This concept is something that will be highly utilized as
    we learn about loops and incrementation.


    While creating a variable may seem like something that is constant, it is not.
    Variables can be changed from their original values by restating the name of the
    variable and giving the variable a new value. An example of this could be,


    float damage = 20.23;


    cout << “Current Damage: ” << damage << endl;


    damage = damage + 3;


    cout << “Current Damage: ” << damage << endl;


    Here we create a variable used to store a float value called ‘damage’ and gave
    it the value 20.23 and simply outputted the value of damage to the user. Next,
    we restated the variable name of damage and said that we want to take the original
    value of damage and add 3 to it. So, on the first line of output we will get 20.23
    but when we use the variable the second time we will get 23.23 or 20.23 + 3.00\.
    You can see that during this process we called the variable type, name, and value
    the first time it was declared but the second time we declared it we only used
    the variable name along with the new value that it was assigned. This is because
    we have already stated the variable type when we originally called the variable.
    The second time we use the variable, the compiler is already aware of the variable
    type and thus we do not need to state the variable type again. You can now see
    the inconvenience that would occur if we were to create two variables with the
    same name.


    To understand the concept of variable scope to its full extent, create a function
    within your program ‘above’ the main function. This will allow us to talk about
    variable scope and why scope is important to remember when you are using multiple
    functions. There are two types of scope that we use when we are programming and
    both have drastic differences.


    First, we have public scope, and when we are programming we often use variables
    that are within a public scope, meaning that the variable can be used within any
    function that we wish. To make a variable public we only do one thing, and that
    is put the variable declaration outside of the functions we have created. But
    remembering from earlier we see that we must put the variable declaration above
    all other functions because the compiler reads from top to bottom. If we create
    a variable and it is on top and not inside any other function, it is called a
    global variable and can be used in any function without causing any problems.
    To check this statement, simply create a variable and output it inside the main
    function as well as inside the function you just created. You will see that if
    the variable is on top of the functions, the variables value will print out without
    any issues.


    But if we take that variable and put it inside one of the functions; then the
    other function will not notice it and for that reason the debugger will say that
    the variable that you are asking for is not in its scope. This is what we call
    a private variable and when private variables are only subject to being used in
    the function of which they are declared. This allows us to create functions with
    variables that must same names as well because if the variable is written inside
    of the function the variable will not be detected in other functions. When we
    are creating functions its always easier to create some specific set of tasks
    that the function should complete before ending that way you already know what
    variables you need and you will hopefully also know if the variables need to be
    global or private.


    After you have created a function, we should also have to remember to call the
    function inside our ‘main’ function so that our functions run when we run the
    program. When calling functions, you again, should remember that the order in
    which the functions are called is the same order in which the functions will be
    ran. If you do not want to call a function or forget to call the function the
    program will still run properly, it will just run without that specific function.
    When we call our functions, we use the function name followed by parentheses or
    the parameters and a semi-colon to signify the end of the statement. This is called
    function prototyping which also may referred to as calling a function.


    When compilers read your code the start on line 1 and work their way down the
    lines of code. This is the reason a task like changing the value of a variable
    can work. It is important to understand what the compiler is thinking to create
    efficient programs because the compiler is what is reading and checking your code
    not only for errors but it is also taking the code and trying to represent the
    program in sync with the user’s chain of command. In any program, you will have
    several operations and you don’t want these operations to flood the user, you
    want to allow the user to choose what operations should be called and define the
    order in which those operations are ran. Without this hierarchy way of programming
    we would lose all uniformity and our programs would run operations out of order.


