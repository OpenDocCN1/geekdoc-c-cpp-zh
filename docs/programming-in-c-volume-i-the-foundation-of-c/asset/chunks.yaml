    - 4.1)命名空间与库 …………………......... 第 62 页

    - 4.2)文件读取与操作 ………………..…. 第 64 页

    - 答案区………....…………...…..………… 第 67 页


    ## 第一章


    ### 1.1 节编程环境


    在开始 `c++` 编程之前，我们需要首先下载用于编写代码的图形用户界面（GUI）。`c++` 的最佳编程环境被称为 `Codeblocks`，它可以免费下载。虽然你可能还会使用其他编程环境，但
    `Codeblocks` 在初期最容易学习，并且便于过渡到其他 GUI 和软件。用于编程的最大型环境之一是 `Microsoft Visual Studio`，它是面向有经验的用户的，一旦你掌握了编程基础，就可以放地下载此软件并用它代替
    `CodeBlocks`。


    图形用户界面是编写任何计算机代码的主要组件。因为 GUI 是数据向用户展示的方式，它为程序员提供了编码平台，并能够直观地看到项目。`CodeBlocks`
    是一个免费的图形用户界面，我们在书中将一直使用因为它因为它都可以下载这个软件，而且“在我看来”它是最好的免费图形用户界面。确保你了解如何使用此软件，因为当问题出现时，这些知识将成为解决问题的关键。正如前面提到的，你不必须使用
    `Codeblocks`，但我强烈向任何完全初学编程的人推荐它。在下载 `CodeBlocks` 时，我们需要确保下载的是适用于你当前运行的操作系统的正确版本。这非常重要，因为
    `Codeblocks` 是一个非常敏感的软件，再次，在进入第一章的代码之前，请花些时间熟悉该软件。


    下载 `CodeBlocks` 时需要另外注意一点是我们需要运行并测试代码。我们还需要某种东西来为我们完成这项工作，那被称为 `compiler`（编译器）。`CodeBlocks`
    使用的编译器内置在软件中，这是一个巨大的优势，但我们应该确保点击包含此编译器的正确下载链接。下载链接中在某处会带有 `mingw` 字样，并包含我们运行代码所需的
    `GNU GCC Compiler`。在安装 `CodeBlocks` 的过程中，请确保仔细阅读说明，在安装过程中它会再次询问你想要使用哪种编译器；此时你自然会选择
    `GNU GCC Compiler`。程序安装完成后，你将进入 `CodeBlocks` 的主界面，现在我们可以开始编写代码了。


    从 `CodeBlocks` 的主界面点击 `create a new project`（新建项目）子链接，接下来你将看到一个标题为 `New from template`（模板新建）的对话框。从这里点击对话框左侧的
    `Projects`（项目），然后点击右窗口的 `console application`（控制台应用程序）。系统会问你是用 `C` 还是 `C++` 编程，虽然你知道我们正在使用
    `C++`，但 `C` 并不大，如果你也想学习它，从 `C++` 到 `C` 的过渡将非常容易。接下来，我们只需要为项目命名并选择项目文件夹的保存位置。最后，我们选择
    `GNU GCC Compiler`，确保勾选 `Create Dialog Configuration`（创建对话框配置）框，并取消勾选 `Create
    release configuration`（创建发布配置）。


    一旦你点击完成，你就终于完成了 `CodeBlocks` 的设置，现在有了一个可以随我们意愿进行编程和编码的环境。但我们仍然应该浏览到处可见的不同按钮，我很乐意告诉你，大多数功能（其中大部分可能不会被用到）在以后它们的用途将会变得显而易见。以后如果你决定继续使用
    `CodeBlocks`，你会发现有许多用于不同类型编程的插件。现在，我们使用的只是软件左侧的 `management`（管理）标签，如果你在屏幕左侧没有看到管理标签，按下
    `Shift+F2` 即可打开该标签；我们还需要熟悉 `Codeblocks` 菜单顶部的 `file`（文件）和 `build`（构建）标签。`File`
    是我们保存、打开和关闭 `CodeBlocks` 的地方，而 `build` 是我们告诉 `Codeblocks` 编译和运行代码的地方。例如，通过 `File
    > new > Project` 将带我们回到 `CodeBlocks` 的原始界面，在那里我们可以创建一个不同的项目。你可以在 `CodeBlocks`
    中同时打开多个项目，这就是屏幕左侧管理标签的原因。


    导航到 `build` 标签，你会看到一个下拉列表，允许我们使用之前安装的编译器来运行和构建项目。当我们运行程序时，我们将使用 `build and run`
    按钮（`Shift F9`）来构建程序（将其发送到编译器）并运行程序，这将输出程序结果。如果你向下看代码编辑器，你会看到里面已经插入了一些代码。导航到 build
    and run 并运行此程序以查看结果，并确保你都安装得正确。你将获得控制窗口，我们的大多数代码将显示其中（除非另有定义），默认显示“Hello World”。这是我们运行的第一个程序，也是大多数程序员在学习任何编程语言时运行的第一个程序。


