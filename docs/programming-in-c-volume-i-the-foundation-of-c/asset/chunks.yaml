    ## Chapter 2.1: Function Declaration


    When creating a program there are tons of different tasks and processes that are
    running at any point in time. For each of these tasks that our program has we
    should have a certain set of rules that the task follows to run properly. This
    is where functions come into programming and this is what also makes them so useful.
    We can take our different processes, break them into different groups, and define
    the solutions for each process while also having them separated to make them separate
    groups that make them easier to work on.


    The `main` function is the only function that we have worked in so far but now
    we will be creating a new one. We can take our different processes, break them
    into different groups, and define the solutions for each process while also having
    them separated to make them separate groups that make them easier to work on.


