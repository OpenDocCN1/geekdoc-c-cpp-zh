    In the line of code for output of text,


    ```

    cout << “Hello World!” << endl;

    ```


    We see that there are essentially 4 pieces of information. The command `cout`
    means console output and is used to output all information that we are presenting
    to the user. This is how we will present data so that it is visible in the in
    the console and is used for sentences as well as numbers, expressions, formulas,
    and more. Next, we see two less than symbols `<<`, these are used to signify data
    going out to the user. Similarly, we can also see that if we had to greater than
    signs `>>` we would signifying data entering the program from somewhere else.
    I may also refer to them as left and right logical operators.


    Next, we have the text part of the code `"Hello World!"` which is called a string
    and strings are variable types or as you can see in this case they can be stated
    explicitly. This text again could be changed to anything else. Here is an example
    of a string output program using variables as we learned earlier.


    ```cpp

    #include <iostream>


    Using namespace std;


    int main(){

    string mySentence = “Save this string of text”;

    cout << mySentence << endl;

    }

    ```


    Here is another example of the same program without storing the string in a variable.


    ```cpp

    #include <iostream>


    Using namespace std;


    int main(){

    cout << “Save this string of text” << endl;

    }

    ```


    These two ways of outputting text to the user. But which way should this be implemented?
    The key here is to remember that we will use variables all the time for several
    different functions if not in every single function. Get used to coding the first
    way and you will be better off as this will help you process how variables are
    called and how variables are used. While Strings are important for communicating
    data we also need to communicate or output numerical data to the user. An example
    would be if we were creating an arcade game that had health, life’s, and levels
    we would need to communicate the numbers associated with each of these variables.
    To output numbers to the user we remove the parentheses and we write the number
    as,


    ```cpp

    cout << 32 << endl;

    ```


    We have the same output operator of course but we write a number, instead of a
    string of text. Although you could also write numbers inside a string if the syntax
    was correct, it’s just usually not good programming to do that. So now that we
    know how to call and use variables with system/console output; write a program
    to do the following,


    **Problem:**

    1) Write a program that remembers your name, address, city, State, and zip code.

    2) Have the program output that information to the screen.


    By this time with the concepts that we have went over there are tons of different
    programs that we can make. I encourage you to try and create your own programs
    and save them in a folder, attempt all of them challenge problems and attempt
    to create your own programs along the way. Something that cannot be overlooked
    is that we are programming using a language and the only way to learn any language
    is the repeat, repeat, repeat. At the end of the day, the more effort that you
    put in the better results you will get, so make sure to go the extra mile and
    if you are not understanding something, search it on google and try to find the
    solution. If you cannot find the solution, write down the problem you are having,
    move on, and go back to the issue later.


    In all computer programming, and extra amount of attention must be payed to syntax,
    spelling, capitalization, and ALL other problems. Something as simple as a letter
    being lowercase when it’s supposed to be uppercase will cause the whole program
    to fail and in some cases the program will not run at all with issues as small
    as this. I am not expressing this fact to try and scare you away from programming
    I am just expressing the fact that programming is very specific and must be very
    precise as well.


    When someone opens your program, you want to have some way of greeting them into
    the program as well as ways to express what the program can do. They only way
    you can do this is to output text to the user and hope he/she reads this content
    and decide based on the options you have given them. But what happens when we
    want the user to enter some information or what happens when the user presses
    a button and expects that button to change or have some effect on the program.
    This is a situation in which we will need an operator that can be used to take
    in information. For inputting information to the user, we use the input operator
    which has the syntax,


    ```cpp

    cin >> variable;

    ```


    The code `cin` stands for console input and is the main operator in the line of
    code. Followed are the `>>` two greater than signs that show the flow of information
    into the PC. Lastly, we declare a variable which serves as a container for the
    information that is stored. Be careful as there are different variable types that
    are used to store different types of information which we will go over in the
    next section in full detail. For now, understand that we use variables to store
    information and these variables can be used along with input operators to store
    information that the users enter.


    Knowing how to display output to the screen that the user can read and needing
    the user to enter information into your program are almost always going to play
    some role in your program. Going over and understanding how to do this is essential
    so practicing input and output is very important.


    # Chapter 1.4 Variables


    In programming, we should store information and for that we use variables. That
    is the only job of a variable and when building any program in any language you
    will use variables to perform this same operation. Before we continue here is
    the list of the most common variables and their functions.


    | Variable Type (Abbr.) | Example | Definition |

    | :--- | :--- | :--- |

    | Integer (int) | `int x=5;` | Used to hold numbers that are of integer value.
    |

    | Float | `Float u =213.34;` | Stores decimal numbers |

    | Double | `Double c =9.234;` | Stores decimal numbers |

    | String | `String y=“BERS”;` | Stores words, letters, and phrases. |

    | Character (char) | `Char message = ‘a’` | Stores a single character |

    | Boolean Variable (True/False) | `Bool t = False;` | Can only be true or false.
    |

    | Constant (const) | `Const int x =10` | A variable that can never change. |


    Those are the most common types of variables that are used in c++ and define what
    variables can hold. For example, in the table above you can see that if we want
    to store an integer we use `int` and if we want to define or store a number that
    is a decimal we use `float` or `double`. This is because we should use different
    types of variables depending on the information that is stored. Here is an example
    of how the float and integer variables are used,


    ```cpp

    int main (){

    float x =3.14;

    int y = 4;

    }

    ```


    When we declare a variable, we need the data type which is (`float`, `int`, etc.),
    and we also need to give our variable a name. The name can be anything string
    of text that you decide as you can see I used `x` for the name of the float variable
    and `y` for the name of the integer variable. And then we set the variable equal
    to the value that we are giving the variable using the equal sign (`=`). You can’t
    set the name of a variable to a number.


    For example,


    `Float 3 = 5;` Would not work and would cause an error.


    Now we have two variables that are assigned correct values, what can we do with
    these variables? The answer is that we can do several things with these values
    but we will start with how these variables can be used to perform several types
    of operations. The best thing to do so that you remember all the different variables
    is to write out the code using the different variable types and giving each variable
    a unique name.


    **Challenge Problem:** Even though input can be pretty straightforward create
    a few programs that,


    1) Create a program that asks the user to enter 3 integers and 3 decimals that
    are then stored in 6 variables.

