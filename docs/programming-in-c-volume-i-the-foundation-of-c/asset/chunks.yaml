  trans: '

    为了让 `main` 函数运行我们最近创建的函数，我们在其中只需要编写所创建的函数名称，如果有参数则写上参数，如果没有则留空，最后加上分号以表示对象声明的结束。现在我们应该有两个函数：1)
    `main` 函数，2) 我们刚刚创建的新函数，以及 3) `main` 函数内部的函数对象。为了确保你的代码正确且没有错误，请点击 CodeBlocks
    中“build and run”（构建并运行）按钮旁边的构建（build）按钮，程序将检查错误。如果 CodeBlocks 底部“build messages”（构建消息）菜单没有报告任何错误，说明程序构建正确。这里有一个示例：


    ```cpp

    #include <iostream>


    int equationFunction(){


    cout << “Is this function is working? ” << endl;


    }


    int main(){


    equationFunction();


    }

    ```


    注意：你可以创建被称为注释的代码行，这些行对程序不会产生任何影响，仅作为某些行代码的注释。要使用注释，我们输入两个正斜杠，后面跟上你想编写的注释。例如：


    ```cpp

    int main(){


    equationFunction(); // This is a comment


    ```


    如果你运行这个程序，你会发现没有错误，而且这段文字完全被程序忽略了。我们还可以使用 `/* */` 来创建多行注释。


    在我们之前创建的函数内部，编写一行控制台输出代码，只需在屏幕上向用户显示消息，以查看函数和函数声明的功能。当我们在 `main()` 函数中调用函数时，我们只是在表示我们在程序中创建了一个函数，现在想要使用它。函数将使你的代码更易读，当其他程序员阅读你的代码时，他们能够更高效地定义程序的元素。此外，当我们创建包含多个不同元素和多行代码的大型程序时，管理代码会变得越来越困难，与其将所有内容挤进
    `main` 函数（虽然这样做可行），但使用函数的效率要高得多。


    现在，在上的示例中，我们创建了一个位于 `main()` 函数之前的函数。如果我们把函数移动到 `main` 函数下方并调用它会发生什么？你会得到编译器错误，提示编译器
    `newFunction();` 在作用域内未声明，导致程序失败。为了防止在你在 `main()` 函数下方创建函数时发生这种情况，需要进行一种被称为“函数原型声明”（function
    prototyping）的操作。


    在函数中，我们有时使用参数来指定类将处理的某些变量。在创建函数时，这在许多不同方面都有用，允许我们进一步定义函数并赋予其自身的特征，同时作为函数的模板。这里是一个带参数的函数示例：


    ```cpp

    #include <iostream>


    using namespace std;


    int function1(int x, int y){


    cout << "x: " << x << endl;


    cout << "y: " << y << endl;


    }


    int main(){


    function1(3,2);


    }

    ```


    在这里，我们创建了一个带有两个参数（整数 `x` 和整数 `y`）的整数函数，在函数内部我们输出每个变量的值。但整数值没有被赋值，所以我们知道这些变量在打印到屏幕之前必须被赋予值。为了做到这一点，我们在
    `main` 函数中调用想要使用的函数，并在该函数的参数中声明想要赋值给每个变量的值，每个值之间用逗号分隔。


    现在我们必须谈谈 C++ 中的一个名为“递归”（recursion）的话题，当函数或循环调用自己时就会发生递归。当你在函数内部调用函数本身，而不是在另一个函数内部调用该函数时，就会发生递归。看起来如下：


    ```cpp

    #include <iostream>


    using namespace std;


    int functionRecursion(){


    cout << “recursion example ” << endl;


    functionRecursion();


    }


    int main(){


    functionRecursion();


    }

    ```


    由于我们在 `functionRecursion` 内部调用了自己，并且在 `main` 中调用了该函数，当我们运行程序时，`main` 函数将调用 `functionRecursion`
    函数，而 `functionRecursion` 函数又调用它自己。如果这种情况发生，过程将永远停止，因此记住不要在函数内部调用它自己。这种递归过程被称为创建递归函数，虽然有时它很有用，但大多数情况下这会在你的程序中产生问题。以后，递归函数的思想将变得更加相关，你会发现为什么这些函数在某些特殊情况下是有用的。我们将介绍什么是循环以及我们如何创建可以调用函数特定次数的循环，这将与递归和递归函数的思想联系起来。


    # 第 2.1 练习题


    2.1a) 创建一个至少五行代码的函数，其中至少有一行应该是进入 `main` 函数的输出运算符。


    2.1b) 创建一个函数，在其中编写你想要的任何代码，确保它在 `main` 函数下方，对函数进行原型声明并调用该函数。


    2.1c) 在 `main` 函数下方创建三个协同工作的函数，用于求解计算式 `x=7+(23/6)+(A+B)` 中的变量 `x`。如果需要，允许用户输入变量
    `A` 和 `B` 的商。


    # 第 2.2 节：函数原型声明


    如果我们在 `main()` 函数下方创建一个函数，我们需要进行一种被称为“函数原型声明”的操作，提醒编译器该函数存在。现在你可能在想，为什么我起初要在 `main`
    函数下方创建函数呢？难道不能直接把 `main()` 函数放在代码底部以避免函数原型声明吗？答案是，你可能永远不需要在 `main` 函数下方创建函数，但如果需要，知道如何这样做总是加分项。要做到这一点，我们写函数类型后跟函数名称，但写
    `#using namespace std;` 下方，程序中任何函数或类的上方。如下所示：


    ```cpp

    #include <iostream>


    Using namespace std;


    void callingFunctions();


    int main(){


    callingFunctions();


    }


    void callingFunctions(){


    cout << “hello” << endl;


    }

    ```


    注意第 3 行的原型，包含了函数类型以及函数名称，因为这是一个经常发生的问题，当你在调试程序时发现自己没有为函数原型声明包含数据类型，这会产生绝望的时刻。我认为函数原型声明是编程中最具冗余的部分之一，因为有时很难记住，所以务必多练习以充分理解它。我的做法是，一旦创建函数就立即为它们创建原型声明，这样以后就不需要担心对象问题了，你也可以为原型列出一个特定列表，以便更容易管理。函数原型声明是你现在就想要习惯的操作。以后，无论是在个人还是工作中，你使用的几乎所有函数都会用到。当有多个函数时，将
    `main` 函数放在顶部更好，以便方便引用，但如果你真的想这样做，你可以把每个函数都写在 `main` 函数上方。


