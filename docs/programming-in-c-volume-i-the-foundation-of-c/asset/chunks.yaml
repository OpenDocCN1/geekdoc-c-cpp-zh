    a button and expects that button to change or have some effect on the program.
    This is a situation in which we will need an operator that can be used to take
    in information. For inputting information to the user, we use the input operator
    which has the syntax,


    cin >> variable;


    The code ‘cin’ stands for console input and is the main operator in the line of
    code. Followed are the >> two greater than signs that show the flow of information
    into the PC. Lastly, we declare a variable which serves as a container for the
    information that is stored. Be careful as there are different variable types that
    are used to store different types of information which we will go over in the
    next section in full detail. For now, understand that we use variables to store
    information and these variables can be used along with input operators to store
    information that the users enter.


    Knowing how to display output to the screen that the user can read and needing
    the user to enter information into your program are almost always going to play
    some role in your program. Going over and understanding how to do this is essential
    so practicing input and output is very important.


    Chapter 1.4


    Variables


    In programming, we should store information and for that we use variables. That
    is the only job of a variable and when building any program in any language you
    will use variables to perform this same operation. Before we continue here is
    the list of the most common variables and their functions.


    | Variable Type (Abbr.) | Example | Definition |


    | Integer (int) | int x=5; | Used to hold numbers that are of integer value. |


    | Float | Float u = 213.1234; | Stores decimal numbers |


    | Double | Double c = 9.1234; | Stores decimal numbers |


    | String | String  y= “NUMBERS”; | Stores words, letters, and phrases. |


    | Character (char) | Char message = ‘a’; | Stores a single character |


    | Boolean Variable (True/False) | Bool t = False; | Can only be true or false.
    |


    | Constant (const) | Const int x = 10 | A variable that can never change. |


    Those are the most common types of variables that are used in c++ and define what
    certain variables can hold. For example, in the table above you can see that if
    we want to store an integer we use int as our variable and if we want to define
    or store a number that is a decimal we use float or double. This is because we
    should use different types of variables depending on the information that is stored
    in the variable. Here is an example of how the float and integer variables are
    used,


    int main (){


    float x = 3.14;


    int y = 4;


    }


    When we declare a variable, we need the data type which is (float, int, etc.…),
    and we also need to give our variable a name. The name can be anything string
    of text that you decide as you can see I used ‘x’ for the name of the float variable
    and ‘y’ for the name of the integer variable. And then we set the variable equal
    to the value that we are giving the variable using the equal sign (=). You can’t
    set the name of a variable to a number.


    For example,


    Float 3 = 5; , Would not work and would cause an error.


    Now we have two variables that are assigned correct values, what can we do with
    these variables? The answer is that we can do several things with these values
    but we will start with how these variables can be used to perform several types
    of operations. The best thing to do so that you remember all the different variables
    is to write out the code using the different variable types and giving each variable
    a unique name.


    Challenge Problem: Even though input can be pretty straight forward create a few
    programs that,


    1) Create a program that asks the user to enter 3 integers and 3 decimals that
    are then stored in 6 variables.'
