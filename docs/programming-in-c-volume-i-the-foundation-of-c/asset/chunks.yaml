    \ `for` 循环吧；相反，当我们使用 `while` 循环时，我们无法在不移动变量和增量器的情况下移动循环。在某些特殊情况下，我们不会使用 `for`\
    \ 循环而会使用 `while` 循环，反之亦然，因此要理解它们的者的用法，以及在何时编写其中一个而不是另一个更有利。\n\n为了创建一个示例，我们可以通过创建一个简单的\
    \ `for` 循环来观察变量的值随循环运行的变化。这个循环将包含一个整数变量，并将直到设置为 1 的 `x` 大于 10，或者当 `x` 小于 10 时运行。它还将通过对变量\
    \ `x` 使用 `++` 运算符来每次递增 1 次。循环每次运行时，它都会打印 `x` 的值，该值每次循环运行都会增加 1。\n\n```cpp\n#include\
    \ <iostream>\n\nusing namespace std;\n\nclass CreatingLoops{\npublic:\n    void\
    \ Loops() {\n    // 1 -\n    for(int x=1; x < 10; x++){\n        cout << \"value\
    \ for x: \" << x << endl;\n    }\n    }\n};\n\nint main(){\nCreatingLoops Object1;\n\
    Object1.Loops();\nreturn 0;\n}\n```\n\n虽然这个循环可以发挥某种作用，但它的用法非常简单，这种循环这种循环很少被使用。我们通常创建一个循环是为了执行某些任务，显然，是某些需要运行多次的任务，但我们通常不知道循环需要运行多少次，通常程序的用户会说明这个因素，为此，我们需要创建一个允许用户控制的变量来指定循环的开始和停止的循环。这样，用户就可以特定地控制这个循环、调用循环的条件以及停止循环的条件。\n\
    \n## 第 3.3 节练习题\n\n3.3a) 创建一个循环 100 次的循环，并持续要求用户输入值并执行数学计算。\n\n3.3b) 在同一个函数中使用\
    \ `while` 和 `for` 循环。\n\n## 第 4 章：文件、命名空间、库与多态\n\n### 第 4.1 节 命名空间与库\n\nC++ 库是由哈希标记或井号（`#`）表示的函数和类的编译集合。如你所见，我们正在使用一个库，称为\
    \ `#include <iostream>` 库。这是一个预配置的库，由通用函数组成，允许我们执行某些特殊操作。这些也被称为头文件，用于存放所用函数的逻辑，并实现这些任务。头文件也被称为预处理器指令，因为它们是处理器在编译\
    \ `.cpp` 文件中编写的代码之前加载的文件。这对于 c++ 的结构非常重要，因为在编译器读取代码之前，它会先摄入预处理器指令，并摄入程序内部可以使用哪些函数的逻辑。这使得我们的程序运行得更高效，因为预处理器指令在程序运行之前就已经加载了，虽然这可能会产生较大的启动影响，但程序已经在启动时完成了这一步，所以程序在运行时不会减慢、冻结或尝试再次运行此过程。\n\
    \nC++ 标准库（`#include <cstdlib>`）用于执行多个不同的任务，可以添加到你的 c++ 代码顶部，现有头文件的下方或上方。C 标准库中一个常用的函数是\
    \ `rand` 函数，它允许我们获取随机数。\n\n```cpp\n#include <iostream>\n#include <cstdlib>\n#include\
    \ <ctime>\n\nusing namespace std;\n\nint main(){\nfloat num;\nsrand(time(NULL))\
    \ ;\ncout << rand();\ncin.get();\n}\n```\n\n我们在这个程序中添加了两个不同的头文件，两者对于访问所用信息都是必要的。当我们使用\
    \ `#include <cstdlib>` 时，我们表示正在包含 C 标准库，这再次允许我们访问 `srand()` 函数，它代表随机种子，在参数内部，我们使用\
    \ `time` 函数，该函数的参数为 `NULL`。为了使用这个 `time` 函数，我们还应该引入一个新的头文件 `#include <ctime>`，这将允许程序访问时间。但我们并没有直接访问时间。由以下返回的值：\n\
    \n```cpp\nsrand(time(NULL));\n```\n\n将 `time(NULL)` 传递给 `srand` 函数启动了一个计数器，计算自\
    \ 1970 年 1 月 1 日 00:00 小时以来过的秒数，这就是我们在编程中所知的“Unix 时间戳”日期。这反过来允许我们每次请求这个数字时，都能获得一个不同的值。\n\
    \n我们可以使用命名空间和头文件调用所有类型的有趣的函数和命令。当我们将来需要像这样的特殊情况时，我们知道可以查看不同的头文件，这些文件提供不同的函数，例如\
    \ `srand()` 函数，它可以帮助进一步扩展我们的程序。\n\n### 第 4.2 节 文件读取与操作\n\n当我们在 c++ 中打开文件时，我们会创建一个流，然后它允许我们以各种方式操作文件。然后我们可以创建或打开一个现有文件并操作该文件的内容。为了做到这一点，我们使用一个新的命令：\n\
    \n`open(\"filename\", mode)`\n\n我们使用 `open` 命令后跟一组参数。在参数内部，我们放入文件名、一个逗号，然后我们可以设置类似于\
    \ `mode` 的东西。`mode` 代表打开文件时可能使用的不同类型的函数。\n\n| 运算符 | 说明 |\n| :--- | :--- |\n| `ios::in`\
    \ | 打开文件并允许程序员向文件写入内容。 |\n| `ios::out` | 打开文件并允许输出文件内部的内容。使文件变为“可读”。 |\n| `ios::binary`\
    \ | 此运算符以二进制模式打开文件。 |\n| `ios::app` | 将所有新文件内容写入文件末尾，允许我们向文件追加信息。 |\n| `ios::ate`\
    \ | 当文件打开时，流的位置指示器被移动到文件末尾。 |\n| `ios::trunc` | 取写入文件的内容并将其删除。文件的旧内容将消失，并将写入新内容。\
    \ |\n\n这些运算符可以使用位或运算符（`|`）组合，用于分离每个命令。\n\n```cpp\nOfstream textFile;\ntextFile.open(\"\
    textExample.txt\", ios::out | ios::app);\n```\n\n`ifstream`、`ofstream` 和 `fstream`\
    \ 的每个成员函数在没有第二个参数的情况下打开文件时都有一个默认模式。在我们用完文件后，应该记得我们需要关闭文件以便信息保存到文件中。\n\n```cpp\n\
    #include <iostream>\n#include <fstream>\n\nusing namespace std;\n\nint main(){\n\
    ofstream textFile(\"textExample.txt\");\nif(textFile.is_open() ){\ntextFile <<\
    \ \"This is on line 1\" << endl;\ntextFile << \"This is on line 2\" << endl;\n\
    textFile.close();\n}else {\ncout << \"unable to open file\";\n}\n}\n```\n\n##\
