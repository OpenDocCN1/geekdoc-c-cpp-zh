- fmt: "\nVariables also have something that must considered which is called the variable\
    \ scope. Variable scope is where the variable is used within the program and the\
    \ different types of scope include global scope and private scope. When a variable\
    \ has a global scope, it can be used in all the functions in a program. As you\
    \ remember we are just using one function at this point (the `main` function)\
    \ and we have been writing all our variables in the `main` function but we can\
    \ also write our variables outside of the `main` function, these are called the\
    \ global variables because they have global scope.\n\n### Global Scope \n\n```cpp\n\
    #include <iostream>\n\nusing namespace std;\n\nint globalVariable = 5;\n\nclass\
    \ VariableScope{\n    public:\n    int VS1(){\n        int localVariable = 10;\n\
    \    }\n};\n\nint main (){\n    VariableScope VSobj;\n    VSobj.VS1();\n}\n```\n\
    \nHere we can see how to use both a local variable and a global variable. Notice\
    \ and understand the difference between creating these variables. The next type\
    \ of scope that there is; is called private scope and is what we have been using\
    \ when we declare the variables inside the `main` function. These types of variables\
    \ with private scope can only be used within the `main` function and if you make\
    \ another function that tries to use a variable with private scope that is not\
    \ in that function, will cause an error. While we have not yet gone over how to\
    \ make a function yet, understanding their use now is important so that as we\
    \ move along and get into talking about functions, you will have the proper insight\
    \ into how variables and variable scope work which will make learning to create\
    \ functions easier.\n\nAlso note that you do not the write the `<< endl` part\
    \ of the code if you are not writing out multiple lines of code but make sure\
    \ to add the semicolon at the end the end the line of code. In most examples,\
    \ I will use `endl;` as it makes the code easier to read when printing it to the\
    \ console. The main key to understanding how programming works and being able\
    \ to store different formulas, words, and algorithms are a must. In any programming\
    \ language or environment there will be variables used to store information that\
    \ either the programmer will use during the process of programming or the user\
    \ will need when using the program. When can also use variables to store information\
    \ such as numbers and then we can create different variables that manipulate those\
    \ variables such as,\n\n```cpp\nfloat x=4;\nfloat y=5;\nfloat z=6;\nfloat eQ =\
    \ x+y;\ncout << eQ/z << endl;\n```\n\nIn the example above we created 3 variables\
    \ that are used to store 3 different integers and then we use the variable `eQ`\
    \ to add two of those numbers together, and finally we output the result of `eQ`\
    \ divided by `z`. This is an example of how we can store variables and use them\
    \ later in a program to perform operations such as math operations. This concept\
    \ is something that will be highly utilized as we learn about loops and incrementation.\n\
    \nWhile creating a variable may seem like something that is constant, it is not.\
    \ Variables can be changed from their original values by restating the name of\
    \ the variable and giving the variable a new value. An example of this could be,\n\
    \n```cpp\nfloat damage = 20.23;\ncout << “Current Damage: ” << damage << endl;\n\
    damage = damage + 3;\ncout << “Current Damage: ” << damage << endl;\n```\n\nHere\
    \ we create a variable used to store a float value called `damage` and gave it\
    \ the value 20.23 and simply outputted the value of `damage` to the user. Next,\
    \ we restated the variable name of `damage` and said that we want to take the\
    \ original value of `damage` and add 3 to it. So, on the first line of output\
    \ we will get 20.23 but when we use the variable the second time we will get 23.23\
    \ or `20.23 + 3.00`. You can see that during this process we called the variable\
    \ type, name, and value the first time it was declared but the second time we\
    \ declared it we only used the variable name along with the new value that it\
    \ was assigned. This is because we have already stated the variable type when\
    \ we originally called the variable. The second time we use the variable, the\
    \ compiler is already aware of the variable type and thus we do not need to state\
    \ the variable type again. You can now see the inconvenience that would occur\
    \ if we were to create two variables with the same name.\n\nTo understand the\
    \ concept of variable scope to its full extent, create a function within your\
    \ program ‘above’ the `main` function. This will allow us to talk about variable\
    \ scope and why scope is important to remember when you are using multiple functions.\
    \ There are two types of scope that we use when we are programming and both have\
    \ drastic differences.\n\n### Public Scope\n\nFirst, we have public scope, and\
    \ when we are programming we often use variables that are within a public scope,\
    \ meaning that the variable can be used within any function that we wish. To make\
    \ a variable public we only do one thing, and that is put the variable declaration\
    \ outside of the functions we have created. But remembering from earlier we see\
    \ that we must put the variable declaration above all other functions because\
    \ the compiler reads from top to bottom. If we create a variable and it is on\
