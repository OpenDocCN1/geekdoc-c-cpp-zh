    既然我们已经涵盖了基础编程的每一个方面，而且你正在创建更高级的程序，你也将需要更高级的方法来解决编程问题。为此，我认为使用数学将帮助你更好地理解为计算机创建解决方案的含义。为计算机创建解决方案非常重要，因为解决方案是为你的程序目标设定规则的算法。即使你有多个不同的任务同时发生，你也会有算法在运行，以随着用户的更改保持程序同步。


    例如，如果我们正在跟踪我在第一人称射击游戏中的弹药数量；我可以创建一个存储某些特定数量子弹的变量，然后每当用户点击鼠标左键时，我就可以让该数字减 1，模拟使用枪械的过程。但弹药减少的算法是如何运作的？我们如何知道用户是否点击了鼠标左键呢？这些都是我们需要理解如何处理的问题，因为这类操作被用于每个软件、每个
    App 和每个程序中。要解决这个特定问题，你应该理解循环和迭代，我们稍后会详细介绍这些。


    使用数学并不仅限于单语句操作。我们可以使用多个变量和操作，在确保遵循运算顺序的情况下，执行为变量赋值的任务，然后使用它们来求解代数表达式和公式。例如，我们可以使用线性方程的标准形式或直线方程
    `y = mx+b`，让用户输入已知值，并求解该方程的 `y`。


    要做到这一点，


    ```

    double m,x,b;

    cout << “enter the value for m: ” << endl;

    cin >> m;

    cout << “enter the value for x: ” << endl;

    cin >> x;

    cout << “enter the value for b:” << endl;

    cin >> b;

    cout << “y = ” << (m*x) + b;

    ```


    这就是对上述问题的解决方案，即我们让用户输入线的已知值，然后我们获取这些值，执行正确的操作，并将答案输出给用户。在最后一行代码中，我在 `m*x` 周围使用了括号，因为我们想先执行这项任务，并根据该结果加上变量
    `b`。在这种情况下，用户也可以使用小数，而且由于我们使用了 `double` 类型的变量，答案将相应地存储。


    ## 第 1.5 节练习题


    1.5a) 创建一个程序允许用户输入 5 个变量。获取这些值，并对用户输入的这 5 个变量进行加、减、乘、除运算。确保考虑到整数值和商值。将每个操作的结果输出给用户，记得说明每种操作并在后面写上该操作的值。


    1.5b) 创建一个程序，将用户输入的 3 个数字互相互相除。


    ## 第 1.6 节：数组


    在编程中，有许多不同的选项和程序类别，它们都有不同的方式可以被创建出来。事实上，如果你正在编写代码，几乎不可能逐行复制他人的代码，因为你可以使用代码的组合和方式是如此丰富。而且不仅如此，还有许多不同的行业可以进行编程。例如，你想创建游戏吗？软件？动画？App？还是全都要？无论你想做什么，你都需要理解编程的基础知识并熟练掌握其用途。


    无论你想创建一个游戏还是手机应用程序，你都可以使用 `c++` 来实现。当我们编写这个庞大的软件时，将会有几个不同的变量，而所有这些变量，无论它们是什么类型，都将占用大量的内存。你创建的每一个变量都在使用内存，这意味着随着时间的推移，我们希望找到一种优化这种行为的方法，让程序在压力较小的情况下运行。优化的概念在今天的计算机上仍然是一个问题，尽管我们有像
    D-wave 这样的超级计算机，但我们还没有达到吸引内存优化的计算机技术终极点，而且可能永远不会发生。


    现代的（2017 年）PC 硬盘是厚实的铝制 CD（压缩光片），被放入金属外壳中使其看起来像一个硬件。如果你不知道，尽管它们可以工作并在很小的空间存储大量内存，但它们受限于某些
    GB 或 TB 的容量，而与“我们可能在某些材料中存储无限量的信息”这一说法相比，这仍然非常小。如果、以及，据我相信，当这种情况发生时，我们将能够将宇宙的信息存储到一个硬件设备中。美国每台
    PC 内部都有一个硬盘，而大壮的 Rosewill Thor、Prodigy 和 Corsair 将成为 Steve Wozniak 创造的 Apple I
    的等价物（如果我今天能把它放在我的桌子上的话），并因此成为古董/新奇物品。请注意，我说的是 Apple I 的物理结构，而不是外壳内部的任何东西。我可能是世界上最大的
    Wozniak 粉丝了，在 20 世纪 70 年代后期，PC 远未完全成熟，这就是为什么他们没有在机箱上花费太多时间，因为硬件是重点，而且在当时也是一个目标。


    数组用于在单个声明中存储相同数据类型的多种形式，这不仅减少了当我们有多个相同类型的变量时产生的复杂性，而且让在程序需要使用这些变量时更易使用。整数数组的语法是：


    ```

    Int array[3] = {4,5,6};

    ```


    这个整数数组包含 3 个整数值。我们也可以通过简单更改数组类型创建一个字符串数组。


    ```

    string x[3] = {“this”,“array”,“is a string ”};

    ```


    这里有一个三个值的字符串数组，每个值都包含在引号内，用逗号分隔，并放在大括号中。现在假设我们需要访问这些变量之一，这就是存储变量以便使用的目的，通过对每个元素应用位置值来实现。每个元素都有自己的数字，这对于你创建的任何数组都是一致的。数组中的第一项被称为元素
    0，并应该调用：


    ```

    cout << “The first array element: ” << x[0] << endl;

    ```


    这将输出数组 `x` 的第一个元素，即字符串值“this”。数组中的第二个值被称为元素 1，第三个元素被称为元素 2。所以，无论数组中有多少元素，元素总是这样命名的（从
    0 开始），并递增。在编程或计算机科学的几乎每个概念中，我们对数字 0 都有意义，而且几乎总是被考虑在内，这与现代数学教我们的数字 0 在大多数情况下是过时的相反，因此在我们进入其他主题时，请记住我们是从
    0 开始计数的而不是 1。


    现在我们应该考虑一个被称为多维数组的话题，它是通常用于创建变量表格的数组。


    ```

    type Name[x][y] = { {Row 1’s values}, {Row 2’s values} };

    ```


    这是多维数组的语法，如果你想看一个实际示例：


    ```

    int Multiarray[2][3] = { {23,3,6}, {56,23,80}};

    ```

