    ### Debugging


    Having to debug your program is not only something that will inevitably happen
    it is also a skill and can only be learned through reading code and practicing
    the different uses of the code. But some problems are seen easily by the compiler
    and of almost all programming environments will have a built-in debugger that
    will detect syntax errors that are in the program upon running the program. You
    can see the debugger easily on the bottom of the CodeBlocks screen by clicking
    the `build log` tab. When you run your program the `build log` tab will show you
    what programs are being called and what is exactly executing when you are building
    and running your program. If also will detect errors as I said earlier that you
    have made within your code that are fundamentally wrong such as grammar, spelling,
    or syntax errors but it will not fix your program for you. It is important to
    read the build log and become familiar with what it says is wrong when you do
    have errors.


    For example, If I make the mistake of calling a variable that doesn’t not exist
    such as writing something like this,


    ```

    Float x = x + y;

    Cin >> x;

    Cin >> y;

    Cout << r << endl;

    ```


    Here you can see that the problem exists on line 4 where I accidentally tried
    to output the result of `r` when I meant to type `x`. This program will not run
    because there is no variable named `r` and the build log will read something like,


    ```

    Error: ‘r’ was not declared in this scope

    ```


    This is probably the most important build log message that there is as you will
    get this message many times throughout your programming career. The message simple
    means that the variable was either never created or it’s not a public variable
    (in Public Scope) and therefore cannot be used because to the function that was
    was called in, it does not exist. This problem the main reason that most programmers
    declare their variables using this little trick.


    ```

    Float newVariable;

    ```


    As you can see the first word in the variable name is lower case and the second
    word in the name of the variable is upper case. This is something that you probably
    want to do when programming so that you do not have capitalization errors when
    you are creating variables, functions, classes, or anything else that need reference
    in `c++`. Anytime you have an error remember to first reference what the build
    log says and second look for flaws in the program. But the program may not notice
    some of the problems that you are having and that is just simply from programming
    wrong and the best way to handle that is to use comment where they are needed
    to reference different parts of your code. Even the best programmers use comments
    to mark off different parts of their code and again if your friend or someone
    want to use or buy a function that you have created you can always find it easier
    if you use comments to sections your code according to the task that is being
    done.


    Understanding how the compiler is reading the program is also very important during
    this process as you need to understand the in `c++` the compiler reads our code
    from line 1 down. In programming, we use a concept called variables to store information
    for the program, the programmer, and the users of the program. A variable can
    be thought of as a storage container for information and there are different types
    of variables depending on the information you are storing into the variable. Variables
    are a big part of all programs and they allow for some great programming as they
    allow programmers to store information for later use and serve as the keystone
    for any computer program. While the code may not be executed in this exact way
    depending on your program, the compiler starts at the top and reads downward,
    meaning if the information is not previously stated in the program, you will not
    get the correct results. For example, if I try to output a variable `x` and I
    use my output operator on line 4 to show to value of `x`, and the variable `x`
    isn’t created until line 6, the program will not know that the variable has not
    yet been created and therefor will not see the variable.


    On the contrary if you move the output operator after line 6, you will be able
    to see the variable in the output put because the compiler has previous knowledge
    of the variable and its value. The compiler reads the code line for line and distinguishes
    what should happen and when it should happen.


    ### Chapter 1.4 Practice Problems


    1. 1.4a) Create a program that asks the user to enter 3 integers and 3 decimals.


    2. 1.4b) Using the solution for 1.4a, Output variables to the user to enter 5
    variables to the user each on its on line.


    ### Chapter 1.5 Mathematics and C++


    Math and programming go hand in hand. To be more specific Algebra and programming
    go hand in hand and are so much alike that I am sure you can see some similar
    traits already. With equations and formulas within algebra we fight to solve the
    equation (usually) for one variable, to do that we isolate the variable we want
    to answer to and set the other values on the other side of the equals sign. In
    programming, we are doing that same process when we create variables to solve
    problems and perform tasks within the program.


    #### Math Operators


    - Addition: `+`

    - Subtraction: `-`

    - Multiplication: `*`

    - Division: `/`

    - Modulus: `%`

    - Equal to: `=`

    - greater than: `>`

    - greater than or equal to: `>=`

    - less than: `<`

    - less than or equal to: `<=`


    Most of these symbols are self-explanatory as I am sure that you are used to seeing
    them besides maybe the multiplication, division, and modulus symbols. For multiplication
    we use the `*` as symbol which is usually called by pressing “Shift+8”. The symbol
    used for division is the forward slash `/` that is usually found below that backspace/delete
    button on your keyboard. Lastly, we have modulus which means to divide and take
    only the remainder value of the division. If there is no remainder during division
    in any case, modulus will be equal to 0.


    To perform a math operation, we need to have at least two numerical values. To
    do this we will create two variables that hold different numbers.


    ```

    float firstNumber=67;

    float secondNumber=34;

    cout << firstNumber + secondNumber << endl;

    cout << firstNumber % secondNumber << endl;

    ```


    If you enter this to your program you will see that we get answers for these operations
    and they work to say the least. But as we start to use math formulas to solve
    things in our program we will program our variables to perform these calculations
    instead of stating them during the output process as,


    ```

    float x = 3.5;

    float y = 5.4;

    float equationOne= x + y;

    float equationTwo=x%y;

    cout << “answer: ”<< equationOne << endl;

    cout << “answer: ” << equationTwo << endl;

    ```


    While this way of programming may technically take a few more lines of code. It
    creates a more efficient process because if I want to use the equation I just
    reference to it later. Something else to consider is that we can change the value
    of a variable any time by writing the variable name and setting it equal to a
    new value. For example,


    ```

    Int x = 3;

    Cout << x << endl;

    x= 6;

    cout << x<< endl;

    ```


    When we create a variable, and set it equal to a specific value such as 3, that
    variable then comes that value and the value also becomes that variable. When
    the first console output is running the program will output 3, because the value
    of `x` is 3. But in the next line of code you see that the value of the integer
    `x` is changed to a value of 6. And this is completely acceptable without re-stating
    the type of variable we are using because there is only one variable `x`. Changing
    the value of a variable is useful but is something that you want to make sure
    is done right and that the value of the variable is known and accounted for at
    any given time.

