    在输出文本的代码行中，


    ```

    cout << “Hello World!” << endl;

    ```


    我们看到本质上有 4 部分信息。`cout` 命令意味着控制台输出（console output），用于输出呈现给用户的所有信息。这就是我们展示数据的方式，使其在控制台中可见，并且它可用于句子、数字、表达式、公式等。接下来，我们看到了两个小于符号
    `<<`，它们用于表示数据流向用户输出。同样地，我们也可以看到，如果我们有大于符号 `>>`，它们将表示数据从其他地方进入程序。我可能也会把它们称为左逻辑运算符和右逻辑运算符。


    接下来，我们有代码的文本部分 `"Hello World!"`，它被称为字符串（string），字符串是变量类型，或者正如在这个例子中，它们可以显式地声明。这段文本再次可以改为任何其他内容。这是一个使用我们之前学过的变量字符串输出程序示例。


    ```cpp

    #include <iostream>


    Using namespace std;


    int main(){

    string mySentence = “Save this string of text”;

    cout << mySentence << endl;

    }

    ```


    这是另一个相同的程序示例，但没有将字符串存储在变量中。


    ```cpp

    #include <iostream>


    Using namespace std;


    int main(){

    cout << “Save this string of text” << endl;

    }

    ```


    这两种方式都可以向用户输出文本。但应该实现哪种方式呢？这里的关键是要记住，即使不是在每一个函数中，我们也将一直使用变量来实现几种不同的功能。习惯用第一种方式编写代码对你会有好处，因为这将帮助你处理变量是如何被调用的以及如何使用的。虽然字符串对于数据通信至关重要，但我们还需要向用户通信或输出数值数据。例如，如果我们正在创建一个带有血量、生命值和关卡的街机游戏，我们需要与这些每个变量相关的数字进行通信。要向用户输出数字，我们去掉括号，并将数字写为：


    ```cpp

    cout << 32 << endl;

    ```


    我们当然有相同的输出运算符，但我们写的是一个数字，而不是文本字符串。虽然如果语法正确，你也可以在字符串内部编写数字，但通常通常不是良好的编程做法。现在我们已经知道如何通过系统/控制台输出来调用和使用变量；请编写一个程序完成以下操作：


    **问题：**

    1) 写一个程序记住你的名字、地址、城市、州和邮政编码。

    2) 让程序将信息输出到屏幕上。


    到目前为止，通过我们学过的概念，已经有许多不同的程序我们可以制作。我鼓励你尝试创建自己的程序并将它们保存在文件夹中，尝试所有的练习题和挑战性问题，并在过程中尝试创建你自己的程序。不能忽略的一点是，我们正在使用语言进行编程，而学习任何语言的唯一方法就是重复、重复、重复。归根结底，你付出的努力越多，结果就越好，所以请确保额外努力，如果你不理解某些内容，在
    Google 上搜索它并尝试找到解决方案。如果你找不到解决方案，写下你遇到的问题，继续进行，稍后再回来处理这个问题。


    在所有的计算机编程中，必须对语法、拼写、大小写以及所有其他问题投入额外的关注。像字母本该大写却变成了小写这样的小错误就会导致整个程序失败，在某些情况下，即使是这样小的问题，程序也无法运行。我表达这个事实并不是为了吓跑你离开编程，我只是在表达编程是非常具体的，并且必须非常精确。


    当有人打开你的程序时，你希望有某种方式欢迎他们进入程序，以及表达程序可以做什么的方法。你唯一能这样做的方法就是向用户输出文本，并希望他/她阅读这些内容并根据你提供的选项做出决定。但当我们想要用户输入某些信息时，或者当用户按下按钮并期望该按钮改变或对程序产生某种影响时，会发生什么呢？我们需要一个用于接收信息的运算符。向用户输入信息，我们使用输入运算符，其语法为：


    ```cpp

    cin >> variable;

    ```


    `cin` 代表控制台输入（console input），是代码行中的主要运算符。后面是两个大于符号 `>>`，显示信息流入 PC。最后，我们声明一个变量，作为存储信息的容器。要小心，因为有不同的变量类型用于存储不同类型的信息，我们将在下一节中详细介绍。现在，理解我们使用变量来存储信息，这些变量可以配合输入运算符来存储用户输入的信息。


    了解如何在屏幕上显示用户可以阅读的输出以及需要用户向你的程序输入信息，几乎会在你的程序中起到某些作用。回顾并理解如何做到这一点至关重要，因此练习输入和输出非常重要。


    # 第 1.4 节变量


    在编程中，我们应该存储信息，为此我们使用变量。这是变量的唯一工作，而且在任何语言中构建任何程序时，你都将使用变量来执行相同的操作。在我们继续之前，这里是最常见的变量及其功能列表。


    | 变量类型（缩写） | 示例 | 定义 |

    | :--- | :--- | :--- |

    | 整数 (Integer) | `int x=5;` | 用于持有整数值。 |

    | 浮点型 (Float) | `Float u =21.34;` | 小数。 |

    | 双精度 (Double) | `Double c =9.234;` | 存储。 |

    | 字符串 (String) | `String y=BERS”;` | 文字、字母和短语。 |

    | 字符 (Character) | `Char message = ‘a’` | 存储字符。 |

    | 布尔变量 (Boolean) | `Bool t = False;` | 只能是真或假。 |

    | 常量 (Constant) | `Const int x =10` | 不可变的变量。 |


    这些是 c++ 中常用的变量类型，定义了变量可以包含的内容。例如，在上面的表中你可以看到，如果我们想存储整数，就使用 `int`；如果我们想定义或存储小数，就使用
    `float` 或 `double`。这是因为我们应该根据存储的信息使用不同类型的变量。这是一个使用浮点和整数变量的示例：


    ```cpp

    int main (){

    float x =3.14;

    int y = 4;

    }

    ```


    当我们声明一个变量时，我们需要数据类型（如 `float`、`int` 等），我们还需要给变量命名。名字可以是你指定的任何字符串，正如你所看到的，我使用 `x`
    作为浮点变量的名字，使用 `y` 作为整数变量的名字。然后我们使用等号 (`=`)将变量设置为赋予的值。你不能将变量的名字设置为数字。


    例如，


    `Float 3 = 5;` 将无法运行并导致错误。


