    - 1.5)数学与 C++ ………………………...…. 第 20 页

    - 1.6)数组 …………...…………...…………………… 第 24 页

    - 第二章：数据与结构 ……………................. 第 30 页

    - 2.1)函数声明 …………………................... 第 30 页

    - 2.2)变量作用域与原型 ………………….. 第 36 页

    - 2.3)内存地址与指针  ………………..... 第 42 页

    - 2.4)类 I …………………...................................... 第 44 页

    - 2.5)类 II（带函数的类） ………………. 第 46 页

    - 第三章：算法与逻辑 …………………........ 第 49 页

    - 3.1)If 和 If-Else 语句 …………………….. 第 49 页

