  trans: "\n在你浏览过 CodeBlocks 并对一切都有了基本了解后，请导航到你之前保存程序的文件夹。如果你找不到该文件夹，请将其重新保存到一个可以存放你所有程序的父文件夹中，或者任何一个你可以轻松找到的地方。打开包含你保存的程序的文件夹，你会发现程序文件夹内有两个文件夹以及其他\
    \ 3 个文件。你应该有一个名为 `bin` 的文件夹和一个名为 `obj` 的文件夹，这些文件夹是编译器使用的，稍后会用到。你还会有一个使用的项目文件，这是你在\
    \ CodeBlocks 中打开项目时需要点击的文件。你可能会在项目文件旁边看到 CodeBlocks 图标，当你想要打开文件夹中的程序时，可以将其作为参考。最后是主源\
    \ `.cpp` 文件，这是一个包含 C++ 代码的文件。该文件的作用是当你想在其他地方使用代码或将其发送给某人时，可以存储这些代码；而且如果你以后使用了如\
    \ Visual Studio 等其他软件，你可以轻松地在各个平台之间传输代码。这让我们回到了 C++ 是一种面向对象的编程语言，它允许对之前创建的函数进行重排和重用。这与某些特定于特定软件的语言不同，那些语言必须经过大量修改才能在其他编程环境中使用。\n\
    \n虽然我使用 CodeBlocks 作为编程软件，但你可以自由使用任何你喜欢的软件。市上有许多优秀的软件和神奇的 IDE 可以下载，你可以自由尝试其他程序，因为它们可能更适合你。我主要选择\
    \ CodeBlocks 的原因是它是一个简单易软件，专门面向编写 C、C# 和 C++ 代码，而几乎所有其他程序都侧重于所有编程语言的使用。使用这个 IDE，我们不需要过分担心其他编程语言的各种按钮和设置，而是可以专注于\
    \ C++ 编程脚本和语言的功能。当你转向使用其他更具动态且选项更多的软件（例如应用程序创建、平台集成，以及允许你编写多种不同语言、创建数据库等）时，这会使过渡过程变得容易得多。\n\
    \n在现实世界中，不同的公司使用大量的——我指的是许多不同类型的编程环境，所以我我想使用多个环境的灵活性可能是有益的，但这随着时间的推移而体现。但在你学习如何编写代码之后，由于\
    \ IDE 和代码实现之间的相似性，学习软件和其他编程语言的工作将变得更容易；当你编写不同的编程语言时，唯一真正变化的是语句和函数的语法。而当你从一个 IDE\
    \ 切换到另一个 IDE 时，唯一变化的是某些 IDE 提供更大的灵活性选项（如 Visual Studio），而像 CodeBlocks 这样的 IDE\
    \ 用于创建通常不显示图形而是在后台运行和执行任务的程序。\n\n# 第 1.2 章 程序结构与布局\n\n每种编程语言都有一套特定的语法来定义其代码。语法只是结构代码的方式，使其具有清晰的轮廓，并在需要时可以被其他程序员阅读。大多数程序是由团队构建的，因此\
    \ C++ 相比其他编程语言提供的大多数特性之一就是能够轻松地在地方移动代码。关于语言语法，C++ 中的几乎每个命令都会以分号（`;`）结尾，这告诉编译器命令已定义并定义了命令的结束。\n\
    \n前两行代码 `#include <iostream>` 和 `using namespace std` 在大多数 C++ 编程中是静态的，还有作为程序的\
    \ `int main () {}` 函数。理解这种布局很重要，当我们在此构建时，你就会明白为什么。\n\n`#include <iostream>` 是我们所说的头文件，我们调用的文件是\
    \ iostream 头文件。`iostream` 头文件只是告诉我们的程序，我们最终想要让程序向控制台输出某些结果或总体目标。接下来，我们有 `using\
    \ namespace std;`，这是一种更简单的媒介，在我们准备好将代码发布到任何目标市场时，允许我们的代码更有结构化。\n\n在创建程序文件后，你会在控制台中看到以下代码：\n\
    \n```cpp\n#include <iostream>\n\nusing namespace std;\n\nint main (){\n\nreturn\
    \ 0; \n}\n```\n\n`return 0;` 命令可以丢弃，我们得到：\n\n```cpp\n#include <iostream>\n\nusing\
    \ namespace std;\n\nint main (){\n\n}\n```\n\n这就是所谓的“主函数（Main Function）”，我非常强调这一点，因为它是所有\
    \ C++ 中使用频率最多的代码块。现在，我们首先应该理解计算机编程中的什么是函数。函数通常用于（除 `main 函数`的情况除外）用于包含一组特定的规则，以完成程序的某项特定任务。主函数有点不同，因为它不仅可以包含自己的信息，还必须知道程序中的每一个其他函数。无论我们在做什么，始终都会回到主函数来调用该函数，我们将在第\
    \ 2 章创建除主函数之外的多个函数时讨论这一点。但这就是需要主函数的原因。你可以将主函数想象成 PC 主板上的 CPU，它处理计算机需要的任务，但它使用硬盘（在这种情况下是其他函数）来存储信息。代码中的\
    \ `int` 部分被称为函数的返回值/类型，稍后会解释。之后我们看到两个括号和闭合的主体引号，并以分号结尾，如果你记得的话，这标志着主函数的结束。`main()`\
    \ 之后的括号被称为参数，用于包含函数可以接受的特定条件。`main` 函数不需要任何参数。最后，我们有主体大括号 `{}`，它们将包含主函数的所有信息。任何主函数命令将写在这些括号内，这些括号是广为人知的、所有函数由分号隔开的代码块。现在我们已经有了将使用的配置布局，我们可以开始学习内存如何在计算机上存储，以及软件和程序如何处理它们被程序设定记住的事物。面对一个几乎没有代码的空白屏幕，我们还有很长的路要走才能到达可以说我们开发出一个\
    \ C++ 程序的地步。在任何计算中，存储都是至关重要的。你不仅在音乐和游戏需要它，它还承载着操作系统以及 PC 运行字面上所有的其他信息。\n\n# 第\
    \ 1.3 章 输出与输入\n\n当我们运行第一个程序并在屏幕上看到“Hello World!”消息时，我们应该意识到两点：1) 带有文字的代码应该是可以更改的，2)\
    \ `cout <<` 运算符是向用户输出消息的一种方式。如果这是你的假设，或者你尝试过更改程序中的文本，那么你领先了一步。但我们向用户输出任何内容需要的是\
    \ `cout` 命令，后面跟着表示输出的 `<<` 符号。\n\n"
