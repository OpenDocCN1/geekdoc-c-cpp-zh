- fmt: '

    Now that we have went over almost every single aspect of basic programming and
    you are creating more advanced programs, you will also need more advanced ways
    to solve programming problems. For this I feel that using mathematics will help
    you understand more about what it means to create solutions for a computer. Creating
    solutions for a computer is very important as the solutions are algorithms that
    set rules for the goal that your program has. Even if you have several different
    tasks that are happening at one time you will have algorithms running to keep
    up with the program as the user makes changed.


    For example, if we are keeping track of the ammunition that I have in a first-person
    shooter; I could create a variable that hold some specific number of bullets and
    then every time the user presses the mouse left-click I could tell that number
    to decrease by 1, simulating the use of a gun. But how would the algorithm for
    the ammunition decrease work and how do we know if the user has clicked their
    left-click on their mouse? These are problems that we need to understand how to
    handle as operations such as this one is used in every piece of software, every
    app, and every program. To solve this specific problem, you should understand
    loops and iterations which is something we will go over later to its full extent.


    Using mathematics does not stop with one statement operations. We can use multiple
    variables and operations, making sure to follow the order of operations, to perform
    the task of taking in values for variables and then using them to solve algebraic
    expressions and formulas. For example, we can use the linear equation standard
    form or the equation for a straight-line `y = mx+b`, have the user enter their
    known values, and solve this equation for `y`.


    To do this,


    ```

    double m,x,b;

    cout << “enter the value for m: ” << endl;

    cin >> m;

    cout << “enter the value for x: ” << endl;

    cin >> x;

    cout << “enter the value for b:” << endl;

    cin >> b;

    cout << “y = ” << (m*x) + b;

    ```


    This would be a solution to the problem stated above saying the we want the user
    to enter the known value of the line and then we take those value, perform the
    correct operations, and output the answer to the user. In the last line of code,
    I used parentheses around the `m*x` because we want to perform this task first
    and from that result we add the variable `b`. In this case the user may also use
    decimals and because we are using the `double` variable and the answer will be
    stored accordingly.


    ## Chapter 1.5 Practice Problems


    1.5a) Create a program that allows users to enter 5 variables. Take those values
    and perform addition, subtraction, multiplication, division to those 5 variables
    entered by the user. Make sure to account for both integer and quotient values.
    Output the value of each operation back to the user remembering to state each
    operation followed by the operations value.


    1.5b) Create a program that divides 3 numbers by each other that the user enters.


    ## Chapter 1.6: Arrays


    In programming, there are so many different options and different categories of
    programs that all have different that they can be created. In fact, it’s almost
    impossible to to line for line copy someone else in programming if you are writing
    because the combinations and ways that you can use the code are so abundant. And
    not only that there are also tons of different industries to program for. For
    example, do you want to create games? Software? Animations? Apps? Everything?
    Whatever you want to do you will need to understand the fundamentals of programming
    and well versed on the uses.


    Whether you want to create a game or an application for a phone you will be able
    to do so using `c++` and when we are programming this giant piece of software
    we are going to have several different variables and all of those variables, whatever
    type they may be, are going to take up tons of memory. With every single variable,
    you create you are using memory and this means that overtime we will want to find
    a way to optimize this behavior and make the program run with less stress. The
    concept of optimization still an issue with computers today and although we have
    super computers such as D-wave, we have not yet hit an ultimatum in computer technology
    that appeals memory optimization and it may never happen.


    Modern,2017, PC hard drives or hard disks are thick aluminum CD’s (Compact Disks)
    that are shoved into a metal case to make it look like a piece of hardware. If
    you didn’t know although they work and store a lot of memory in a small place
    they are subject to some capacity of gigabytes or terabytes which are still very
    small when it comes to the statement that we could possibly store an infinite
    amount of information in some material. If, and, what I believe, when this happens,
    we will be able to store the information of the universe into one piece of hardware.
    There will be one hard drive inside of every PC in America and big stocky Rosewill
    Thor, Prodigy, and corsair will become the equivalent to the Apple I created by
    Steve Wozniak (If I were to have it on my desk today) and therefor became antique/novelty
    items. Mind you I am talking about the physical structure of the Apple I and not
    anything inside of the outer shell. I am probably the biggest Wozniak fan there
    is, and in the late 1970’s Pc’s were far from being fully developed, thus the
    reason they didn’t spend much time with the case, as the hardware was the focus
    and at that point a goal as well.


    Arrays are used to store multiple forms of the same data type in a single declaration
    to reduce not only complication that arises when we have multiple variables of
    the same type; but also, to make it easier to use these variables when they are
    needed in a program. The Syntax for an integer array is,


    ```

    Int array[3] = {4,5,6};

    ```


    This integer array holds 3 integer values. We could also create a string array
    by simply changing the array type.


    ```

    string x[3] = {“this”, “array”, “is a string ”};

    ```


    Here we have a string array that holds three values and each value is contained
    within double parentheses, separated by a comma, and held inside braces. But now
    let’s say that we need to access one of these variables as that is the point of
    storing a variable to use it once once this is done by applying placement values
    to each element. Each element has its own number and this will be consistent for
    any array you create. The first item in an array is referred to as element 0 and
    should be called as,


    ```

    cout << “The first array element: ” << x[0] << endl;

    ```


    This will output the first element of the array `x`, which is the string value
    “this”. The second value in an array is referred to as element 1, and the third
    element is called element 2. So, no matter how many elements in the array, the
    elements will always be called (starting from 0), and counting upwards. In almost
    every concept in programming or computer science we will have a significance with
    the number 0 and it is almost always accounted for which is the opposite of modern
    mathematics which teaches us that the number 0 is obsolete for the most part,
    so keep this in mind as we move on into other topics we start counting at 0 and
    not 1.


    Now we should consider a topic known as the multidimensional array which are arrays
    that are often used to create tables of variables.


    ```

    type Name[x][y] = { {Row 1’s values}, {Row 2’s values} };

    ```


    This is syntax for a multidimensional array and if you want to see this in a practical
    example,


    ```

    int Multiarray[2][3] = { {23,3,6}, {56,23,80}};

    ```

