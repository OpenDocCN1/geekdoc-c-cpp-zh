    在这里我们可以看到有一个整数 `x`，我们让用户将其存储在变量 `x` 中，这非常简单。接下来，我们有一个 `switch` 语句，接受变量 `x`作为测试条件。在
    `switch` 的体内部，我们有 `case 1:`，它表示“当用户输入 1 时”，然后我们将运行冒号后面的代码，冒号标志着 `case 1` 代码块的开始。需要记住的是，当我们使用
    `switch` 时，在 `switch` 内部测试变量的 `case` 命令后面必须有一个冒号，以表示该特定 `case` 代码的开始。接下来，我们简单地在
    `switch` 内部编写一些我们希望在 true `case` 为真时运行的代码，一旦你写完了所有代码，就编写 `break;` 命令来表示你已经完成了该
    `case` 的代码编写。


    然后，我们重复这个过程，为完成整个流程创建尽可能多的 `cases`。虽然这个过程看起来可能稍微复杂一点，但实际上非常简单，并且当你使用多个 `if`语句时，它非常有用。随着学习的深入，测试许多不同情况将变得越来越容易，因为你会发现，当我们需要执行多次测试时，有更快的方法来执行此类任务。


    思考我们每天看到的运行程序，例如视频游戏，我们可以拆解出在视频游戏中，有几件事正在同时发生。如果我们思考射击游戏是如何运行的，我们可以想象在游戏中使用的枪械、点击按钮后子弹是如何射出的，以及人物如何在视频游戏的环境中走动。当你按下按钮时，手枪会执行一组预先程序好的任务，这些任务可以在被调用时随时使用，但这些任务也知道它们可能永远不会被调用。我们将这类函数称为
    `static functions`（静态函数），意味着它们包含了可能永远不会被使用的代码，但在用户请求使用时应当被实现。接下来，我们有一个类似于用户运行的环境，我们可以看到环境永远不会消失，这意味着该环境的代码以及特定属于该环境的内容必须被编写成循环运行，并在用户玩游戏期间永不消失或停止。这种类型的函数和编程用法被称为
    `looped programming`（循环编程），这就是我们接下来将使用的，它将极大地扩展像 `if statement` 等条件语句的使用。


    选取我们在最后几节关于 `if`语句、`if-else`语句和`switches`使用的代码，并创建使用其中一个或两个这些特性的函数来创建一个程序。这将加强你对函数以及每个命令对应语法的掌握，让你能够创建更直观的程序，并在问题出现时进行处理。虽然编程是我们地球上最好的工具之一，但它并不是
    100%万无的，随着程序变得越来越复杂、执行的任务越来越多，程序内部会出现问题。你应该对此做好准备并理解如何处理。


    ### 挑战题：


    3.2a) 创建一个包含 5 个 `cases` 的 `switch`。将 `switch` 放在函数内部，并将函数放在类 `class` 内部。


    3.2b) 创建一个执行与 3.2a 完全相同任务的函数，但这次使用 `if`语句。注意这两个函数之间的区别。


    ### 第 3.3 章：循环 (Loops)


    有时我们希望某些代码运行多次，这正是我们应该引入一个名为 `looping`（循环）的新概念的地方。循环允许我们迭代代码并将其运行多次，这可以开启一个新概念的途径，允许产生许多新的编程思想。循环的概念可以解释为一种函数，它测试一组特定的参数，如果参数组内部的测试为真，则循环内部的代码将运行。


    我们将要过的第一个循环被称为 `while` 循环，它的语法如下：


    ```cpp

    while(test){


    // 运行这段代码


    }

    ```


    `while` 循环接受作为循环测试条件的 `test`，如果循环测试为真，则代码体将一直运行，直到循环测试变为假。循环的测试写在括号内，这些括号被称为循环的参数。


    通过例子来看会更好：


    ```cpp

    int main(){


    int x =4;


    int y =5;


    while(x>y){


    cout << x << endl;


    }

    ```


    在 `main` 函数中，我们看到有两个整数变量，一个是 4，另一个是 5。接下来，我们有 `while` 循环，它表示如果 `x` 大于 `y`，我们就输出
    `x` 的值。如果我们运行这段代码，将会得到一个永不结束的程序，它将永远地输出 `x` 的值。虽然在某些情况下我们会发现这在编程时是一种很有用的技术，但并不多见。我的意思是，我们需要以某种方式终止这段代码。也许我们希望循环运行
    10 次或 100 次，但我们极少拥有一个永不停止的循环。


    为了停止循环，我们需要改变 `x` 的值或改变 `y` 的值（在程序运行期间），这将最终导致测试变为假。为了这一点，我们使用 `incrementer`（增量器）来改变一个变量的值。但什么是增量器？增量器通过在程序运行
    `while` 循环测试期间，通过对该变量进行加、减、乘或除操作来改变特定变量的值。在 c++ 中，最常见的增量器是 `x++`。

