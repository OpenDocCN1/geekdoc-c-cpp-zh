    the solutions for each process while also having them separated to make them separate
    groups that make them easier to work on.


    The main function is the only function that we have worked in so far but now we
    will be creating a new function that will be used to perform a specific task to
    the overall program. So before actually taking on the task of making a program
    we should create an outline of all the different tasks that will need to be performed.
    For example, if we are creating a function to create a program that can solve
    an equation, of the form  x -2(x+1)=0\. The first thing we must do is create an
    output/input system that is in place to ask the user to enter that data needed
    for this program. But what data is needed? We can see that for this specific equation
