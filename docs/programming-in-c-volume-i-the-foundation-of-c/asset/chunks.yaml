    ## 2) 将这些变量分别在不同的行输出到屏幕。


    ### 调试 (Debugging)


    调试程序不仅是不可避免发生的事情，更是一种技能，只能通过阅读代码和实践代码的不同用法来学习。但有些问题可以被编译器轻松发现，而且几乎所有的编程环境都内置了调试器，可以在程序运行时检测程序中的语法错误。你可以通过点击
    CodeBlocks 屏幕底部的 `build log` 标签页轻松地看到调试器。当你运行程序时，`build log` 标签页将向你显示在构建和运行程序时调用了哪些程序，以及具体在执行什么内容。正如我之前提到的，它还会检测出你在代码中犯的根本性错误，例如语法、拼写或句法错误，但它不会为你自动修复程序。阅读
    `build log` 并在出现错误时熟悉它所指出的错误之处是非常关重要的。


    例如，如果我犯了调用不存在变量的错误，比如写成下面的样子：


    ```

    Float x = x + y;

    Cin >> x;

    Cin >> y;

    Cout << r << endl;

    ```


    在这里你可以看到问题出在第 4 行，我不小心尝试输出 `r` 的结果，而本意是输入 `x`。这个程序将无法运行，因为没有名为 `r` 的变量，`build
    log` 会显示类似的内容：


    ```

    Error: ‘r’ was not declared in this scope

    ```


    这可能是最重要的 `build log` 信息之一，因为在你的编程生涯中你会多次收到这条信息。这条信息简单来说意味着该变量要么从未被创建，要么它不是一个公共变量（不在公共作用域内），因此对于被调用的函数来说，它是不存在的。这个问题是大多数程序员使用下面这个小技巧来声明变量的主要原因。


    ```

    Float newVariable;

    ```


    如你所示，变量名的第一个单词是小写，变量名的第二个单词是大写。这是在编程时你可能想要采用的方法，这样在创建变量、函数、类或任何在 `c++` 中需要引用的内容时，就不会出现大小写错误。每当你遇到错误时，请记住首先参考
    `build log` 的内容，其次寻找程序中的缺陷。但程序可能无法察觉你所面临的某些问题，这仅仅是因为编程写得不对，而处理这种问题最好的方法是在需要的地方使用注释来引用代码的不同部分。即使是最好的程序员也会使用注释来标记代码的不同部分；再次，如果你的朋友或其他人想使用或购买你创建的函数，如果你根据正在执行的任务对代码进行分段，他们总是更容易找到它。


    在这个过程中，理解编译器是如何读取程序的也是非常重要的，因为你需要理解在 `c++` 中，编译器是从第 1 行向下读取我们的代码的。在编程中，我们使用一种称为变量的概念为程序、程序员和程序用户存储信息。变量可以被看作存储信息的容器，根据你存储在变量中的信息类型，有不同类型的变量。变量是所有程序的重要部分，它们允许实现出色的编程，因为它们允许程序员存储信息以备后用，并作为任何计算机程序的基石。虽然根据你的程序，代码可能并非完全这种方式执行，但编译器从顶部开始向下读取，这意味着如果信息没有在程序中声明，你将无法获得正确的结果。例如，如果我尝试输出变量
    `x` 并在第 4 行使用输出运算符显示 `x` 的值，而变量 `x` 直到第 6 行才被创建，那么程序将不知道该变量尚未创建，因此看不到该变量。


    相反，如果你将输出运算符移动到第 6 行之后，你就能在输出中看到该变量，因为编译器拥有该变量及其值的先前知识。编译器逐行读取代码，并区分应该发生什么以及何时应该发生。


    ### 第 1.4 章练习题


    1. 1.4a) 创建一个程序，要求用户输入 3 个整数和 3 个小数。


    2. 1.4b) 使用 1.4a 的解决方案，向用户输出让其输入 5 个变量，每个变量占一行。


    ### 第 1.5 章 数学与 C++


    数学与编程是密不可分的。更具体地说，代数与编程密不可分，且它们如此相似，我确定你已经看到了一些相似的特征。通过代数中的方程和公式，我们努力解出（通常是）一个变量方程；为了这样做，我们隔离想要答案的变量，并将其他值设置在等号的侧。在编程中，当我们创建变量来解决问题和执行程序内的任务时，我们在进行同样的过程。


    #### 数学运算符


    - 加法：`+`

    - 减法：`-`

    - 乘法：`*`

    - 除法：`/`

    - 取模运算：`%`

    - 等于：`=`

    - 大于：`>`

    - 大于等于：`>=`

    - 小于：`<`

    - 小于等于：`<=`


    这些符号大部分自言自明，我确定你已经习惯看到它们，可能只是乘法、除法取模符号。乘法使用符号 `*`，通常通过按下“Shift+8”输入。用于除法的符号是斜杠
    `/`，通常位于键盘退格键/删除键下方。最后，我们有取模，意思是除法并只保留除法的余数。如果在任何情况下除法没有余数，取模将等于 0。


    要执行数学运算，我们需要至少两个数值。为了做到这一点，我们将创建两个不同数字的变量。


    ```

    float firstNumber=67;

    float secondNumber=34;

    cout << firstNumber + secondNumber << endl;

    cout << firstNumber % secondNumber << endl;

    ```


    如果你将这些输入程序，你将看到我们得到了这些运算的答案，它们至少是起作用的。但当我们开始使用数学公式解决程序中的问题时，我们会编写变量来执行这些计算，而不是在输出过程中声明它们，如：


    ```

    float x = 3.5;

    float y = 5.4;

    float equationOne= x + y;

    float equationTwo=x%y;

    cout << “answer: ”<< equationOne << endl;

    cout << “answer: ”<< equationTwo << endl;

    ```


    虽然这种编程方式在技术上可能多几行代码，但它创建了一个更高效的过程，因为如果我想以后使用该公式，只需引用它即可。另一个需要考虑的问题是，我们可以随时通过编写变量名并赋予新值来更改变量的值。例如：


    ```

    Int x = 3;

    Cout << x << endl;

    x= 6;

    cout << x<< endl;

    ```


    当我们创建一个变量并将其赋值为特定值（如 3）时，该变量就有了该值，而该值也变成了该变量。当第一个控制台输出运行时，程序将输出 3，因为 `x` 的值是 3。但在下一行代码中，你看到整数
    `x` 的值被改为 6。这样做是完全允许的，无需再次声明我们正在使用的变量类型，因为只有一个变量 `x`。更改变量的值是有用的，但你希望确保这样做正确，并且在任何时刻变量的值都是已知并被考虑在内的。


