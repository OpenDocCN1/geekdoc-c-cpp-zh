  \n数据属性与你一直使用的其他 HTML 属性相似，不同在于，与 `src` 或 `href` 等属性不同，数据属性对浏览器没有特殊含义。唯一的要求是属性名以\
  \ `data-` 开头。使用自定义数据属性可以让你指定 JavaScript 与页面上的哪些 HTML 元素交互。\n\n从技术上讲，在 JavaScript\
