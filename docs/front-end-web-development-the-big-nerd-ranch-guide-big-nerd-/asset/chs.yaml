  在本章节中，你将为你的 UI 创建 HTML 标记。你将使用流行的 Bootstrap 框架提供的样式为你的 UI 增添色彩。\n\n在本章节中，你将为你的 UI\
  \ 创建 HTML 标记。你将使用流行的 Bootstrap 框架提供的样式为你的 UI 增添色彩。\n\n在本章节中，你将为你的 UI 创建 HTML 标记。你将使用流行的\
  \ Bootstrap 框架提供的样式为你的 UI 增添色彩。\n\n\n\n\n\n```\n...\n    <title>coffeerun</title>\n\
  \    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.6/css/bootstrap.min.css\"\
  >\n  </head>\n  <body>\n  <body class=\"container\">\n    <header>\n      <h1>CoffeeRun</h1>\n\
  \    </header>\n    <script src=\"scripts/datastore.js\" charset=\"utf-8\"></script>\n\
  \    <script src=\"scripts/truck.js\" charset=\"utf-8\"></script>\n    <script src=\"\
  scripts/main.js\" charset=\"utf-8\"></script>\n  </body>\n</html>\n```\n\n`container`\
  \ 类名（class）充当了所有需要适应视口大小内容的容器。这为布局提供了基础的响应式行为。\n\n保存 `index.html`，确保 `browser-sync`\
  \ 正在运行，并查看你的页面。它看起来应该像图 9.3。\n\n**图 9.3 使用 Bootstrap 样化的页眉**\n\n![使用 Bootstrap 样化的页眉](img/bootstrap-1.png)\n\
  \n虽然你的页面目前内容不多，但请注意，页眉周围已经有了舒适的内边距，并且应用了字体样式。\n\n`Bootstrap` 为大量的不同视觉元素提供了样式。CoffeeRun\
  \ 将仅仅触冰一角，但你将在后面的章节有机会探索更多样式。现在，是时候为表单添加标记语言了。\n\n## 创建表单\n\n在 `index.html` 中，你创建的\
  \ `<header>` 元素下方添加一个 `<section>` 标签、两个 `<div>` 和一个 `<form>`。\n\n```\n...\n    <header>\n\
  \      <h1>CoffeeRun</h1>\n    </header>\n    <section>\n      <div class=\"panel\
  \ panel-default\">\n        <div class=\"panel-body\">\n          <form data-coffee-order=\"\
  form\">\n            <!-- 输入元素将放在在这里 -->\n          </form>\n        </div>\n  \
  \    </div>\n    </section>\n    <script src=\"scripts/datastore.js\" charset=\"\
  utf-8\"></script>\n...\n```\n\n`<form>` 标签将是所有重要发生的地方。你为它提供了一个 `data-coffee-order`\
  \ 属性，值为 `form`。在 CoffeeRun 中，你将使用数据属性从 JavaScript 访问 DOM 元素，就像你在 Ottergram 中做的那样。\n\
  \n对于布局，你添加了两个 `<div>` 标签。具体是否使用 `<div>` 标签并不重要。重要的是你在它们上应用了 `panel`、`panel-default`\
  \ 和 `panel-body` 类。这些是 `Bootstrap` 类，会为你触发相应的样式。\n\n记住，`<div>` 只是用于其他标记的通用类型块级容器。它们占据其父级元素所提供的全部水平空间。它们在\
  \ CoffeeRun 中会被频繁使用，你将在整个 `Bootstrap` 文档的示例中看到它们。\n\n你可能在奇怪为什么 `<section>` 标签包裹了你的\
  \ `<div>` 和 `<form>` 标签。`<div>` 没有语义含义，而 `<section>` 有：它们在逻辑上对其他标记进行分组。这一个将包含表单的\
  \ UI。你可以轻松地在页面上的另一个 `<section>` 用于其他 UI 部分。\n\n### 添加文本输入字段\n\n你最关心的主要信息是咖啡订单本身。如果你在过去的十年里去过咖啡馆，你就知道订单可能会变得多么复杂。现在，你将使用单行文本字段来表示订单。稍后你将添加更多字段来获取更多关于订单的信息。\n\
  \n当你使用 `Bootstrap` 构建表单时，你会添加额外的 `<div>` 元素，专门用于应用 `Bootstrap` 库定义的样式。\n\n在 `index.html`\
  \ 中添加另一个带有 `form-group` 类的 `<div>`。`Bootstrap` 的 `form-group` 间距。\n\n```\n...\n\
  \      <div class=\"panel panel-default\">\n        <div class=\"panel-body\">\n\
  \          <form data-coffee-order=\"form\">\n            <!-- 输入元素将放在在这里 -->\n\
  \          </form>\n        </div>\n      </div>\n      <div class=\"form-group\"\
  >\n        <label for=\"coffeeOrder\">Coffee Order</label>\n        <input class=\"\
  form-control\" name=\"coffee\" id=\"coffeeOrder\">\n      </div>\n    </section>\n\
  ...\n```\n\n`Bootstrap` 的 `form-group` 提供了垂直间距。保存 `index.html`，切换到浏览器并点击 `Coffee\
  \ Order` 标签。`<input>` 应该获得焦点 (图 9.4）。\n\n**图 9.4 咖啡订单的输入字段**\n\n![咖啡订单的输入字段](img/textfield.png)\n\
  \n`<input>` 元素单行文本。除了它的 `form-control` 类，它还有 `name` 属性。当表单提交时，`name` 将发送到服务器。\n\n\
  ### 链接标签和表单\n\n`<label>` 标签对于可访问性非常重要。在 `index.html` 中，分别为 `<label>` 添加 `for` 和\
  \ `id` 属性。\n\n```\n...\n      <div class=\"form-group\">\n        <label for=\"\
  coffeeOrder\">Coffee Order</label>\n        <input class=\"form-control\" name=\"\
  coffee\" id=\"coffeeOrder\">\n      </div>\n...\n```\n\n当 `<label>` 与表单元素关联时，你可以点击页面上的\
  \ `<label>` 文本，它将激活关联的表单元素。要查看此效果，保存 `index.html`，切换到浏览器并点击 `Coffee Order` 标签。`<input>`\
  \ 应该获得焦点 (图 9.5)。\n\n**图 9.5 点击关联标签导致输入获得焦点**\n\n![点击关联标签导致输入获得焦点](img/click-label-to-focus.png)\n\
  \n### 添加 autofocus\n\n由于这是屏幕上的第一个字段，你希望用户在页面加载后就能在其中输入文本，而不是必须点击。\n\n要实现这一点，在 `index.html`\
  \ 的 `<input>` 中添加 `autofocus` 属性。\n\n```\n...\n      <div class=\"form-group\">\n\
  \        <label for=\"coffeeOrder\">Coffee Order</label>\n        <input class=\"\
  form-control\" name=\"coffee\" id=\"coffeeOrder\" autofocus>\n      </div>\n...\n\
  ```\n\n保存 `index.html` 的更改并返回浏览器。你会发现文本输入字段在页面加载时立即就有光标和高亮显示 (图 9.6)。\n\n**图 9.6\
  \ 页面加载时的自动聚焦输入字段**\n\n![页面加载时的自动聚焦输入字段](img/autofocus-on-page-load.png)\n\n\n\n\n\
  \n注意 `autofocus` 属性没有值。它不需要值。只要在 `<input>` 标签中出现 `autofocus` 属性，浏览器就会激活该字段。`autofocus`\
  \ 属性是一个 `Boolean`（布尔）属性，这意味着它的唯一可能值是 `true` 和 `false`。你只需要在标签中添加属性名即可设置它的值。当它存在时，其值为\
  \ `true`。当它不存在时，该属性被视为 `false`。\n\n## 添加邮箱输入字段\n\n当你创建 `Truck` 和 `DataStore` 模块时，你通过客户的电子邮件地址来跟踪订单。现在你将使用另一个\
  \ `<input>` 元素来获取这些信息。\n\n在 `index.html` 中添加另一个 `.form-group` 元素，并包含一个 `<label>`\
  \ 和 `<input>`。对于 `<input>` 元素，将 `type` 设置为 `email`，将 `name` 设置为 `emailAddress`，并将\
  \ `id` 设置为 `emailInput`。还要添加一个 `value` 属性并将其为空字符串。这确保了该字段在页面加载时是空白的。最后，使用 `id` 将\
  \ `<input>` 和 `<label>` 链接。\n\n```\n...\n          <form data-coffee-order=\"form\"\
  >\n            <div class=\"form-group\">\n              <label for=\"coffeeOrder\"\
  >Coffee Order</label>\n              <input class=\"form-control\" name=\"coffee\"\
  \ id=\"coffeeOrder\" autofocus>\n            </div>\n            <div class=\"form-group\"\
  >\n              <label for=\"emailInput\">Email</label>\n              <input class=\"\
  form-control\" type=\"email\" name=\"emailAddress\"\n                id=\"emailInput\"\
  \ value=\"\">\n            </div>\n          </form>\n...\n```\n\n保存 `index.html`\
  \ 并检查浏览器查看你的新表单字段（图 9.7）。\n\n**图 9.7  电子邮件输入字段**\n\n![Input field for an email address](img/add-emailfield.png)\n\
  \n### 使用占位符文本显示示例输入\n\n有时用户会感谢关于应该在文本字段中输入什么的建议。要创建示例文本，请使用 `placeholder` 属性。\n\n\
  在 `index.html` 中的新 `<input>` 元素上添加 `placeholder` 属性。\n\n```\n...\n            <div\
  \ class=\"form-group\">\n              <label for=\"emailInput\">Email</label>\n\
  \              <input class=\"form-control\" type=\"email\" name=\"emailAddress\"\
  \n                id=\"emailInput\" value=\"\" placeholder=\"dr@who.com\">\n   \
  \         </div>\n...\n```\n\n保存你的文件。结果将如图 9.8 所示。\n\n**图 9.8  邮箱输入框中的占位符文本**\n\n\
  ![Placeholder text in the email input](img/add-placeholder.png)\n\n`placeholder`\
  \ 属性的值会出现在文本字段中，直到用户输入某些文本，此时它就会消失。如果用户删除了字段中的所有文本，占位符文本将再次出现。\n\n## 使用单选按钮提供选择\n\
  \n接下来，你想让用户能够指定咖啡饮料的大小。他们应该能够在短（short）、中（tall）和大杯（grande）之间进行选择——并且他们不能选择超过一种大小。对于这类数据输入，你可以使用\
  \ `type` 属性设置为 `radio` 的 `<input>` 字段。\n\n单选按钮的标记将与其他的 `<input>` 字段不同。每个单选按钮将有一个\
  \ `<input>` 字段，并被 `<label>` 元素包裹。`<label>` 将包裹在一个 `<div>` 中，该 `<div>` 的 `class`\
  \ 也是 `radio`。\n\n`<label>` 元素不需要你为咖啡订单和邮箱的 `<label>` 添加的 `for` 属性。因为 `<input>` 被包裹在\
  \ `<label>` 内部，它们会自动链接。\n\n如果你在好奇为什么单选按钮的 HTML 与此不同，那是因为 `Bootstrap` 对它们的样式处理与其他表单元素不同。\n\
  \n在编写自己的代码时，你可以选择将 `<input>` 元素封装在 `<label>` 中，或者使用 `for` 属性——这两者都是正确的。但当你使用 `Bootstrap`\
  \ 时，你必须遵循它的模式和约定，以便样式按预期工作。请参考 `Bootstrap` 文档查看有关如何构建 HTML 的示例（[getbootstrap.com/css/#forms`](http://getbootstrap.com/css/#forms)）。\n\
  \n在 `index.html` 中，在邮箱 `<input>` 之后添加单选按钮的标记。\n\n```\n...\n              <div class=\"\
  form-group\">\n                <label for=\"emailInput\">Email</label>\n       \
  \         <input class=\"form-control\" type=\"email\" name=\"emailAddress\"\n \
  \                 id=\"emailInput\" value=\"\" placeholder=\"dr@who.com\">\n   \
  \           </div>\n              <div class=\"radio\">\n                <label>\n\
  \                  <input type=\"radio\" name=\"size\" value=\"short\">\n      \
  \            Short\n                </label>\n              </div>\n           \
  \   <div class=\"radio\">\n                <label>\n                  <input type=\"\
  radio\" name=\"size\" value=\"tall\">\n                  Tall\n                </label>\n\
  \              </div>\n              <div class=\"radio\">\n                <label>\n\
  \                  <input type=\"radio\" name=\"size\" value=\"grande\">\n     \
  \             Grande\n                </label>\n              </div>\n         \
  \   </form>\n...\n```\n\n你为所有三个单选输入设置了相同的 `name` 属性值（`size`）。这告诉浏览器只能选择其中一个。你为单选按钮添加了一个名为\
  \ `checked` 的布尔属性。它的原理与 `autofocus` 相同：当它存在时，值为 `true`；当它不存在时，值为 `false`。\n\n保存\
  \ `index.html` 并查看你的单选按钮（图 9.9）。\n\n**图 9.9  咖啡尺寸单选按钮**\n\n![Radio buttons for coffee\
  \ sizes](img/add-radio.png)\n\n尝试点击任何单选按钮或旁边的文本。无论何种方式，该单选按钮都应该显示已被选中。\n\n## 添加下拉菜单\n\
  \n有些人痴迷于风味咖啡。你想让他们提供从几种口味中选择的选择。默认情况下，不会添加任何风味。\n\n你可以使用一组单选按钮来实现，但你可能会向列表中添加更多口味。为了确保口味选择不会拥挤\
  \ UI，你将使用下拉菜单。\n\n要创建一个使用 `Bootstrap` 样式的下拉菜单，在 `index.html` 中添加一个 `class` 为 `form-group`\
  \ 的 `<div>`。创建一个 `class` 为 `form-control` 的 `<select>` 元素。`Bootstrap` 将此元素样式化为下拉。使用\
  \ `id` `flavorShot` 将其与其 `<label>` 链接。在 `<select>` 内部，为你显示的每个菜单项添加一个 `<option>`\
  \ 元素，并为每个项提供一个匹配的 `value`。\n\n```\n...\n            <div class=\"form-group\">\n\
  \              <label for=\"flavorShot\">Flavor Shot</label>\n              <select\
  \ id=\"flavorShot\" class=\"form-control\" name=\"flavor\">\n                <option\
  \ value=\"\">None</option>\n                <option value=\"caramel\">Caramel</option>\n\
  \                <option value=\"almond\">Almond</option>\n                <option\
  \ value=\"mocha\">Mocha</option>\n              </select>\n            </div>\n\
  \          </form>\n        </div>\n      </div>\n    </div>\n...\n```\n\n\n\n\n\
  每个 `<option>` 元素提供一个可能的 `value` 值，而 `<select>` 元素则指定了 `name`。\n\n保存 `index.html`\
  \ 并检查你的下拉菜单是否显示了你添加的所有 `options`（图 9.10）。\n\n**图 9.10 咖啡口味下拉菜单**\n\n![咖啡口味下拉菜单](img/add-dropdown.png)\n\
  \n默认情况下，第一个 `<option>` 元素是被选中的。如果你想让第一个之外的选项自动被选中，可以在 `option` 元素中添加 `selected`\
  \ 布尔属性。\n\n你将第一个下拉项的 `value` 属性设置为空字符串。如果你完全遗漏了 `value` 属性，浏览器将使用字符串 `\"None\"`\
  \ 作为值。最好设置 `value` 属性，因为你永远不应该假设浏览器会按照你预期的方式行事。\n\n### 添加范围滑块\n\n并不是每个人都想要强烈的咖啡因冲动。你想让用户在\
  \ 0 到 100 之间选择咖啡浓度的值。另一方面，你不希望他们必须输入精确的值。\n\n为了实现这一点，在 `index.html` 中添加一个 `type`\
  \ 为 `range` 的 `<input>` 元素。这会创建一个范围滑块。`<input>` 和 `<label>` 应该关联起来并封装在一个带有 `form-group`\
  \ 类的 `<div>` 中。对你的咖啡客户友好一点，提供一个默认值为 `30` 的 `value`。\n\n```\n...\n              \
  \  <option value=\"mocha\">Mocha</option>\n              </select>\n           \
  \ </div\n            <div class=\"form-group\">\n              <label for=\"strengthLevel\"\
  >Caffeine Rating</label>\n              <input name=\"strength\" id=\"strengthLevel\"\
  \ type=\"range\" value=\"30\">\n            </div>\n          </form>\n...\n```\n\
  \n保存 `index.html` 浏览器中尝试你的新滑块。它看起来会像图 9.11。\n\n**图 9.11 咖啡因强度滑块**\n\n![咖啡因强度滑块](img/add-slider.png)\n\
  \n### 添加提交和重置按钮\n\n标记中最后要做的工作是添加 `Submit` 按钮。为了方便使用，你还应该添加一个 `Reset` 按钮来清空表单，以防用户重新开始。\n\
  \n通常，`Submit` 按钮只是 `type` 为 `submit` 的 `<input>` 元素。同样，`Reset` 按钮是 `type` 为 `reset`\
  \ 的 `<input>` 元素。但是，为了利用 `Bootstrap` 的 CSS，将使用 `<button>` 元素。\n\n在 `index.html`\
  \ 中，添加两个类名为 `btn btn-default` 的 `<button>` 元素。将第一个的 `type` 设置为 `submit`，将第二个的 `type`\
  \ 设置为 `reset`。在起始结束标签之间放置 `Submit` 和 `Reset` 作为描述性文本。\n\n```\n...\n            <div\
  \ class=\"form-group\">\n              <label for=\"strengthLevel\">Caffeine Rating</label>\n\
  \              <input name=\"strength\" id=\"strengthLevel\" type=\"range\" value=\"\
  30\">\n            </div>\n            <button type=\"submit\" class=\"btn btn-default\"\
  >Submit</button>\n            <button type=\"reset\" class=\"btn btn-default\">Reset</button>\n\
  \          </form>\n...\n```\n\n当你保存更改时，浏览器将在表单底部添加这些按钮（图 9.12）。\n\n**图 9.12 提交和重置按钮**\n\
  \n![提交和重置按钮](img/add-buttons.png)\n\n你的 `Submit` 按钮目前还没有任何作用。那将在下一章中。然而，你的 `Reset`\
  \ 按钮将把值重置为默认值。\n\n这些按钮有一对看起来可能冗余的类。这是 `Bootstrap` 的一种约定，纯粹是为了样式。`btn` 类提供了 `Bootstrap`\
  \ 按钮的所有标准视觉属性。这包括圆角和内边距。`btn-default` 类添加了白色背景颜色。\n\n你已经使用了 `Bootstrap` UI 框架来美化你的\
  \ CoffeeRun 应用。通过应用 `Bootstrap` 的标记模式和类名，你的应用在各种屏幕尺寸和浏览器版本上将具有一致的外观和感受。\n\n要了解更多关于\
  \ `Bootstrap` 提供的内容，请查看 [getbootstrap.com/css](http://getbootstrap.com/css/) 优秀文档。\n\
  \n# 10 使用 JavaScript 处理表单\n\nCoffeeRun 有良好的开始。它有两个处理逻辑的模块和一个用 `Bootstrap` 美化的 HTML\
  \ 表单。在本章中，你将编写一个更多的模块来将表单与逻辑连接起来。\n\n回想[第 2 章 设置你的项目]，浏览器通过向特定 URL 发送请求与服务器通信。具体来说，对于浏览器需要加载的每个文件，它都会发送\
  \ `GET` 请求。当浏览器需要向服务器发送信息时（例如用户填写并提交表单时），浏览器会获取表单数据并将其放入 `POST` 请求中。服务器接收请求，处理数据，然后返回响应（图\
  \ 10.1）。\n\n**图 10.1 传统的服务器端处理**\n\n![传统的服务器端处理](img/add-response.png)\n\n在 CoffeeRun\
  \ 中，你不需要将表单数据发送到服务器。你的 `Truck` 和 `DataStore` 模块起到传统服务器端代码的作用。它们的工作是处理业务逻辑和数据存储。\n\
  \n由于这段代码运行在浏览器而不是服务器上，你需要从表单获取数据。在本章中，你将创建一个名为 `FormHandler` 的新模块来实现此。此外，你还将添加 jQuery\
  \ 库来帮助工作。在接下来的几章构建 CoffeeRun 时，你将使用更多 jQuery 的强大功能。\n\n## 创建 FormHandler \n\n`FormHandler`\
  \ 模块将阻止浏览器尝试将表单数据发送到服务器。相反，当用户点击 `Submit` 按钮时，它将读取表单值。然后它将你在[第 8 章模块、对象和方法]中编写的\
  \ `createOrder` 方法将数据发送到 `Truck` 实例（图 10.2）。\n\n**图 10.2 带有 `App.FormHandler` 的\
  \ CoffeeRun 架构**\n\n![带有 App.FormHandler 的 CoffeeRun 架构](img/formhandler-diagram-1.png)\n\
  \n\n\n\n在你的 `scripts` 文件夹中创建一个名为 `formhandler.js` 的新文件，并在 `index.html` 中为其添加一个 `<script>`\
  \ 标签。\n\n```html\n...\n          </form>\n        </div\n      </div>\n    </section>\n\
  \    <script src=\"scripts/formhandler.js\" charset=\"utf-8\"></script>\n    <script\
  \ src=\"scripts/datastore.js\" charset=\"utf-8\"></script>\n    <script src=\"scripts/truck.js\"\
  \ charset=\"utf-8\"></script>\n    <script src=\"scripts/main.js\" charset=\"utf-8\"\
  ></script>\n  </body>\n</html>\n```\n\n与其他模块一样，`FormHandler` 将使用 IIFE（立即调用函数表达式）来封装代码，并将构造函数挂载到\
  \ `window.App` 属性。\n\n打开 `scripts/formhandler.js` 并创建一个 IIFE。在 IIFE 内部，创建一个 `App`\
  \ 变量。将其赋值为 `window.App` 的现有值。如果 `window.App` 还不存在，则给它赋值一个空对象字面量。声明一个 `FormHandler`\
  \ 构造函数，并将其导出到 `window.App` 属性。\n\n```javascript\n(function (window) {\n  'use strict';\n\
  \  var App = window.App || {};\n\n  function FormHandler() {\n    // Code will go\
  \ here\n  }\n\n  App.FormHandler = FormHandler;\n  window.App = App;\n\n})(window);\n\
  ```\n\n到目前为止，这段代码遵循你在 `Truck` 和 `DataStore` 模块中使用的熟悉模式。不过很快就会有所不同，因为它将导入并使用 jQuery\
  \ 来完成工作。\n\n## jQuery 简介\n\njQuery 库由 John Resig 于 2006 年创建。它是最流行的通用开源 JavaScript\
  \ 库之一。此外，它还为 DOM 操作、元素创建、服务器通信和事件处理提供了方便的简写。\n\n熟悉 jQuery 是非常有用的，因为有大量的代码是用它编写的。此外，许多库也复制了\
  \ jQuery 的约定。事实上，jQuery 直接影响了标准的 DOM API（`document.querySelector` 和 `document.querySelectorAll`\
  \ 就是这种影响的两个例子）。\n\n现在不会深入介绍 jQuery。相反，将根据需要介绍它的某些方面，以帮助你构建 CoffeeRun 中更复杂的部分。如果你想进一步探索\
  \ jQuery，请查看 [jquery.com](http://jquery.com) 文档。\n\n就像你处理 `Bootstrap` 一样，你将从 [cdnjs.com](http://cdnjs.com)\
  \ 为项目添加 jQuery 。访问 [cdnjs.com/libraries/jquery](https://cdnjs.com/libraries/jquery/)\
  \ 找到版本 2.1.4 并复制其地址。（可能有更更新的版本，但你应该为 CoffeeRun 使用 2.1.4 以避免任何兼容性问题。）\n\n在 `index.html`\
  \ 的 `<script>` 标签中添加 jQuery。\n\n```html\n...\n      </div>\n    </section>\n   \
  \ <script src=\"https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.min.js\"\
  \n      charset=\"utf-8\"></script>\n    <script src=\"scripts/formhandler.js\"\
  \ charset=\"utf-8\"></script>\n    <script src=\"scripts/datastore.js\" charset=\"\
  utf-8\"></script>\n    <script src=\"scripts/truck.js\" charset=\"utf-8\"></script>\n\
  \    <script src=\"scripts/main.js\" charset=\"utf-8\"></script>\n...\n```\n\n保存\
  \ `index.html`。\n\n## 导入 jQuery\n\n`FormHandler` 将以导入 `App` 的相同方式导入 jQuery。这样做是为了显式地表明你的模块正在使用在别处定义的代码。这是团队成员协作以及未来维护的最佳实践。\n\
  \n在 `formhandler.js` 中，创建一个名为 `$` 的本地变量，然后将其赋值为 `window.jQuery`。\n\n```javascript\n\
  (function (window) {\n  'use strict';\n  var App = window.App || {};\n  var $ =\
  \ window.jQuery;\n\n  function FormHandler() {\n    // Code will go here\n  }\n\n\
  \  App.FormHandler = FormHandler;\n  window.App = App;\n\n})(window);\n```\n\n当你添加\
  \ jQuery `<script>` 标签时，它会创建一个名为 `jQuery` 的函数以及一个名为 `$` 的变量，该变量指向该函数。大多数开发者倾向于在代码中使用\
  \ `$`。为了遵循这一习惯，你正在导入 `window.jQuery` 并将其赋值给局部变量 `$`。\n\n奇奇为什么使用 `$` 作为变量名？JavaScript\
  \ 变量名可以包含字母、数字、下划线 (_ ) 或美元符号 ($)。（它们只能以字母、下划线或美元符号开头。）jQuery 的创建者选择 `$` 名字是因为它短，而且不太会被其他代码使用。\n\
  \n## 配置 FormHandler 实例\n\n`FormHandler` 应该适用于任何选择器元素。为了实现这一点，更新 `formhandler.js`，为\
  \ `FormHandler` 构造函数添加一个 `selector` 参数。如果没有提供选择器，则抛出一个 `Error` 来指示意外值。\n\n```javascript\n\
  (function (window) {\n  'use strict';\n  var App = window.App || {};\n  var $ =\
  \ window.jQuery;\n\n  function FormHandler(selector) {\n    if (!selector) {\n \
  \     throw new Error('No selector provided');\n    }\n  }\n\n  App.FormHandler\
  \ = FormHandler;\n  window.App = App;\n\n})(window);\n```\n\njQuery 最常用于在 DOM 中查找元素。要实现这一点，你调用\
  \ jQuery `$` 函数并传入一个字符串选择器。事实上，你使用它的方式和你一直以来使用 `document.querySelectorAll` 的方式相同（尽管\
  \ jQuery 在底层的工作原理不同，我们稍后会解释）。人们通常将其称为使用 jQuery 从 DOM 中“选择元素”。\n\n在 `formhandler.js`\
  \ 中声明一个名为 `$formElement` 的实例变量。然后使用该选择器在 DOM 中查找匹配元素，并将结果赋值给 `this.$formElement`。\n\
  \n```javascript\n(function (window) {\n  'use strict';\n  var App = window.App ||\
  \ {};\n  var $ = window.jQuery;\n\n  function FormHandler(selector) {\n    if (!selector)\
  \ {\n      throw new Error('No selector provided');\n    }\n\n    this.$formElement\
  \ = $(selector);\n  }\n\n  App.FormHandler = FormHandler;\n  window.App = App;\n\
  \n})(window);\n```\n\n\n\n\n在变量名前加上 `$` 符号表示该变量指的是使用 jQuery 选择的元素。在使用 jQuery 时，这个前缀并不是强制要求的，但它是许多前端开发者使用的常用惯例。\n\
  \n当你使用 jQuery 的 `$` 函数来选择元素时，它并不像 `document.querySelectorAll` 那样返回 DOM 元素的引用。相反，它返回一个单一对象，该\
  \ `object` 包含了所选元素的引用。该对象还具有用于操作引用集合的特殊方法。这个对象被称为“jQuery 包装选择（jQuery-wrapped selection）”或“jQuery\
  \ 包装集合”。\n\n接下来，你需要确保选择成功从 DOM 中检索了元素。如果 jQuery 没有找到任何内容，它将返回一个空选择——如果选择器没有匹配任何内容，它不会抛出错误。你需要手动检查，因为没有元素，`FormHandler`\
  \ 就无法工作。\n\njQuery 包装选择的 `length` 属性可以告诉你匹配了多少个元素。更新 `formhandler.js` 以检查 `this.$formElement`\
  \ 的 `length` 属性。如果为 `0`，则抛出一个 `Error`。\n\n```\n(function (window) {\n  'use strict';\n\
  \  var App = window.App || {};\n  var $ = window.jQuery;\n\n  function FormHandler(selector)\
  \ {\n    if (!selector) {\n      throw new Error('No selector provided');\n    }\n\
  \n    this.$formElement = $(selector);\n    if (this.$formElement.length === 0)\
  \ {\n      throw new Error('Could not find element with selector: ' + selector);\n\
  \    }\n  }\n\n  App.FormHandler = FormHandler;\n  window.App = App;\n\n})(window);\n\
  ```\n\n你的 `FormHandler` 构造函数可以根据传入的选择器配置为与任何 `<form>` 元素工作。此外，它作为实例变量保留该 `<form>`\
  \ 元素的引用。这确保了你的代码不会对 DOM 进行不访问。这是一个性能最佳实践。（另一种方法是反复调用 `$`，这会导致每次都重新选择相同的元素。）\n\n\
  ## 添加提交处理器\n\n下一步是让 `FormHandler` 监听 `<form>` 元素上的 `submit` 事件，并在事件发生时运行回调函数。\n\n\
  为了让 `FormHandler` 模块更具重用性，你不会硬编码 `submit` 处理器代码。相反，你将编写一个接受函数参数的方法，添加 `submit` 监听器，然后在该监听器内部调用该函数参数。\n\
  \n首先，在 `formhandler.js` 中添加名为 `addSubmitHandler` 的原型方法。\n\n```\n...\n    if (this.$formElement.length\
  \ === 0) {\n      throw new Error('Could not find element with selector: ' + selector);\n\
  \    }\n  }\n\n  FormHandler.prototype.addSubmitHandler = function () {\n    console.log('Setting\
  \ submit handler for form');\n    // More code will go here\n  };\n\n  App.FormHandler\
  \ = FormHandler;\n...\n```\n\n你将不再像在 Ottergram 中那样使用 `addEventListener` 方法，而是使用\
  \ jQuery 的 `on` 方法。它类似于 `addEventListener`，但提供了额外的便利性。不过，目前你将以像使用 `addEventListener`\
  \ 一样的方式使用它（你将在下一章利用一些额外的便利性）。\n\n```\n...\n    if (this.$formElement.length ===\
  \ 0) {\n      throw new Error('Could not find element with selector: ' + selector);\n\
  \    }\n  }\n\n  FormHandler.prototype.addSubmitHandler = function () {\n    console.log('Setting\
  \ submit handler for form');\n    // More code will go here\n    this.$formElement.on('submit',\
  \ function (event) {\n      event.preventDefault();\n    });\n  };\n...\n```\n\n\
  `on` 方法接受事件名称和一个在事件触发时运行的回调函数。它的回调应该预期接收事件对象。你调用 `event.preventDefault`是为了确保提交表单不会让用户离开\
  \ CoffeeRun 页面。（你在 Ottergram 的缩略图链接中也是同样的操作。）\n\n### 提取数据\n\n当表单提交时，你的代码应该从表单中读取用户输入，然后对这些数据进行操作。在\
  \ `formhandler.js` 的 `submit` 处理器中，创建一个名为 `data` 的新变量。给它赋值一个对象字面量。它将包含表单每个元素的 `value`。\n\
  \n```\n...\n  FormHandler.prototype.addSubmitHandler = function () {\n    console.log('Setting\
  \ submit handler for form');\n    this.$formElement.on('submit', function (event)\
  \ {\n      event.preventDefault();\n\n      var data = $(this).serializeArray();\n\
  \      console.log(data);\n\n    });\n  };\n...\n```\n\n在你的 `submit` 处理器回调内部，`this`\
  \ 对象是表单的引用。jQuery 提供了一个便利方法 `serializeArray()` 来获取表单的值。为了使用 `serializeArray`，你需要使用\
  \ jQuery “包装”表单。调用 `$(this)` 会给你一个包装对象，`serializeArray` 返回一个对象数组。你将其赋值给一个名为 `data`\
  \ 的临时变量并将其打印到控制台。为了了解 `serializeArray` 看起来是什么样，请保存文件并在控制台中运行以下代码：\n\n```\nvar fh\
  \ = new App.FormHandler('[data-coffee-order=\"form\"]');\n```\n\n接下来，用一些数据填写表单并点击\
  \ `Submit` 按钮。你应该能在控制台中看到打印出来的数组。点击数组中的几个 `Object` 项。你会看到类似于图 10.4 的：`serializeArray`\
  \ 将表单数据以对象数组的形式返回。\n\n**图 10.4 `serializeArray` 将表单数据以对象数组的形式返回**\n\n![serializeArray\
  \ returns form data as an array of objects](img/console-log-array.png)\n\n你可以看到数组中的每个对象都有一个键，对应于\
  \ `<form>` 元素的 `name` 属性以及该元素用户提供的 `value`。\n\n现在你可以遍历数组并复制每个元素的值。在 `formhandler.js`\
  \ 中为 `serializeArray` 添加对 `forEach` 方法的调用，并传递一个回调函数。当回调为数组中的每个对象运行时运行时，它将使用该对象的\
  \ `name` 和 `value` 在 `data` 对象上创建一个新属性。\n\n```\n...\n  FormHandler.prototype.addSubmitHandler\
  \ = function () {\n    console.log('Setting submit handler for form');\n    this.$formElement.on('submit',\
  \ function (event) {\n      event.preventDefault();\n\n      var data = $(this).serializeArray();\
  \ {};\n      $(this).serializeArray().forEach(function (item) {\n        data[item.name]\
  \ = item.value;\n        console.log(item.name + ' is ' + item.value);\n      });\n\
  \      console.log(data);\n\n    });\n  };\n...\n```\n\n要查看此效果，请保存更改并在填写表单之前在控制台中再次运行你的测试代码：\n\
  \n```\nvar fh = new App.FormHandler('[data-coffee-order=\"form\"]');\nfh.addSubmitHandler();\n\
  ```\n\n\n\n\n当你填写表单并点击 `Submit` 按钮时，你应该能看到输入的信息已复制到 `data` 对象中并记录到控制台（图 10.5）。\n\
  \n**图 10.5  在迭代器回调中复制表单数据**\n\n![在迭代器回调中复制表单数据](img/caff-fiend.png)\n\n### 接收并调用回调\n\
  \n现在你已经拥有单对象的表单数据，你需要将该对象传递给你的 `Truck` 实例的 `createOrder` 方法。但 `FormHandler` 无法访问\
  \ `Truck` 实例。（而且在这里创建一个新的 `Truck` 实例也没有帮助。）\n\n你可以通过让 `addSubmitHandler` 接受一个函数参数来解决这个问题，该处理器可以在事件处理器内部调用该函数。\n\
  \n在 `formhandler.js` 中，添加一个名为 `fn` 的参数。\n\n```javascript\n...\n  FormHandler.prototype.addSubmitHandler\
  \ = function (fn) {\n    console.log('Setting submit handler for form');\n    this.$formElement.on('submit',\
  \ function (event) {\n      event.preventDefault();\n...\n```\n\n当浏览器触发表单的 `submit`\
  \ 事件时，`submit` 处理器回调就会被调用。当发生这种情况时，你希望调用 `fn` 函数。\n\n在 `formhandler.js` 的 `submit`\
  \ 处理器回调中调用 `fn`，并为其传递包含用户输入的 `data` 对象。\n\n```javascript\n...\n  FormHandler.prototype.addSubmitHandler\
  \ = function (fn) {\n    ...\n      console.log(data);\n      fn(data);\n    });\n\
  \  };\n...\n```\n\n现在，当创建 `FormHandler` 实例时，任何回调都可以被传递给 `addSubmitHandler`。从那时起，当提交表单时，回调将执行调用，并接收用户输入表单的任何数据。\n\
  \n### 使用 FormHandler\n\n在 `main.js` 中，你需要实例化 `FormHandler` 实例，并将 `<form>` 元素的选择器传递给它：`[data-coffee-order=\"\
  form\"]`。在 `main.js` 顶部为该选择器创建一个变量，以便在需要时可以重用。\n\n```javascript\n(function (window)\
  \ {\n  'use strict';\n  var FORM_SELECTOR = '[data-coffee-order=\"form\"]';\n  var\
  \ App = window.App;\n...\n```\n\n接下来，创建一个名为 `FormHandler` 的局部变量并将其赋值给 `App.FormHandler`。\n\
  \n```javascript\n(function (window) {\n  'use strict';\n  var FORM_SELECTOR = '[data-coffee-order=\"\
  form\"]';\n  var App = window.App;\n  var Truck = App.Truck;\n  var DataStore =\
  \ App.DataStore;\n  var FormHandler = App.FormHandler;\n  var myTruck = new Truck('ncc-1701',\
  \ new DataStore());\n  ...\n```\n\n在 `main.js` 模块的最后，调用 `FormHandler` 构造函数并将 `FORM_SELECTOR`\
  \ 变量传递。。这将确保 `FormHandler` 实例与匹配该选择器的 DOM 元素工作。将实例赋值给新变量 `FormHandler`。\n\n```javascript\n\
  ...\n  var Truck = App.Truck;\n  var DataStore = App.DataStore;\n  var FormHandler\
  \ = App.FormHandler;\n  var myTruck = new Truck('ncc-1701', new DataStore());\n\
  \  window.myTruck = myTruck;\n  var formHandler = new FormHandler(FORM_SELECTOR);\n\
  \n  formHandler.addSubmitHandler();\n  console.log(formHandler);\n})(window);\n\
  ```\n\n当你保存代码并返回浏览器时，控制台应该报告 `Setting submit handler for form`，显示 `addSubmitHandler`\
  \ 在页面加载时被调用。然而，如果你填写并提交表单，将得到一个错误（图 10.6）。\n\n**图 10.6  在页面加载时调用 `addSubmitHandler`**\n\
  \n![在页面加载时调用 addSubmitHandler](img/esprso.png)\n\n这是因为你没有向 `addSubmitHandler` 传递任何内容。你将在下一节中修正这一点。\n\
  \n### 将 createOrder 注册为提交处理器\n\n你希望每次发生 `submit` 事件时调用 `createOrder`。但你不能直接将 `createOrder`\
  \ 的引用传递给 `formHandler.addSubmitHandler`。这是因为 `createOrder` 需要 `this` 上文中是 `Truck`\
  \ 实例。\n\n为了修复这个问题，你可以使用 `bind` 创建该函数的绑定版本：\n\n```javascript\nformHandler.addSubmitHandler(myTruck.createOrder.bind(myTruck));\n\
  ```\n\n### UI 增强\n\n如果表单在提交后能清除旧数据，那就好了，这样用户就可以立即开始下一个订单。重置表单只需调用 `<form>` 元素的 `reset`\
  \ 方法。\n\n在 `formhandler.js` 中找到 `FormHandler.prototype.addSubmitHandler` 方法。在 `this.$formElement.on('submit'...)`\
  \ 回调的末尾，添加对表单 `reset` 方法的调用：\n\n```javascript\n...\n  FormHandler.prototype.addSubmitHandler\
  \ = function (fn) {\n    console.log('Setting submit handler for form');\n    this.$formElement.on('submit',\
  \ function (event) {\n      event.preventDefault();\n\n      var data = {};\n  \
  \    $(this).serializeArray().forEach(function (item) {\n        data[item.name]\
  \ = item.value;\n        console.log(item.name + ' is ' + item.value);\n      });\n\
  \      console.log(data);\n      fn(data);\n      this.reset();\n    });\n  };\n\
  ...\n```\n\n\n\n\n你可以通过表单的 `elements` 属性方便地访问单个表单字段。`elements` 属性是一个表单字段的数组，你可以通过索引引用它们，索引从\
  \ 0 开始。\n\n在 `formhandler.js` 中，在 `submit` 处理器回调中调用 `this.reset` 之后，调用第一个字段的 `focus`\
  \ 方法。\n\n```\n...\n  FormHandler.prototype.addSubmitHandler = function (fn) {\n\
  \    console.log('Setting submit handler for form');\n    this.$formElement.on('submit',\
  \ function (event) {\n      event.preventDefault();\n\n      var data = {};\n  \
  \    $(this).serializeArray().forEach(function (item) {\n        data[item.name]\
  \ = item.value;\n        console.log(item.name + ' is ' + item.value);\n      });\n\
  \      console.log(data);\n      fn(data);\n      this.reset();\n      this.elements[0].focus();\n\
  \    });\n  };\n...\n```\n\nCoffeeRun 现在由 jQuery 驱动并可以接受用户输入了！你已经弥接了 HTML 与 JavaScript\
  \ 模块之间的鸿沟。在下一章中，你将根据从表单获取的数据创建交互式 DOM 元素，从而完成蓝图。\n\n## 铜级挑战：超尺寸\n\n为咖啡订单添加另一个尺寸选项——起一个听起来非常震撼的名字，例如“Coffee-zilla”（咖啡巨兽）。\n\
  \n使用这个超大尺寸创建一个新订单，并在控制台中检查你的应用程序数据，确保它被正确保存。\n\n## 银级挑战：在滑块变化时显示数值\n\n为滑块的 `change`\
  \ 事件创建一个处理器。当滑块的值改变时，在滑块标签旁边显示该数字。\n\n作为一个额外挑战，更改数字（或标签）的颜色以反映咖啡因强度的变化。淡咖啡使用绿色，中等强度咖啡使用黄色，极浓咖啡使用红色。\n\
  \n## 黄金挑战：添加成就\n\n当用户提交一个带有风味添加剂最大、最浓咖啡订单时，解锁一项成就：弹出一个 `Bootstrap` 模态框告知他们他们惊人的强度和对风味的追求。询问他们是否想要使用他们的成就，如果是，则添加一个只有在\
  \ `email` 字段中输入邮箱地址时才可见的额外表单字段。它应该允许他们为咖啡选择一个或多个增强选项，例如时间旅行、读心术或无 Bug 代码。\n\n请参考\
  \ [`getbootstrap.com/javascript`](http://getbootstrap.com/javascript/) 上的文档，了解如何包含和触发\
  \ `Bootstrap` 的模态框行为。（你需要从 `cdnjs.com` 添加一个 `<script>` 标签来引入 `Bootstrap` 的 JavaScript\
  \ 代码。）\n\n# 11 从数据到 DOM\n\n在上一章中，你构建了 `FormHandler` 模块。它作为用户交互的表单与代码其余部分之间的桥梁。通过拦截其\
  \ `submit` 事件，你将用户的输入提供给 `Truck` 模块，由将其保存到 `DataStore` 实例中。\n\n在本章中，你将构建另一个 UI 部分：`CheckList`\
  \ 模块。像 `Truck` 模块一样，它将接收来自 `FormHandler` 数据，但它的工作是在页面上添加一个待处理订单清单。当点击清单列表项时，`CheckList`\
  \ 将其从页面上移除并通知 `Truck` 从 `DataStore` 中移除它。图 11.1 “留住这些订单！”显示了配备待处理订单清单的 CoffeeRun。\n\
  \n![Keep those orders!](img/intravenous.png)\n\n## 设置清单\n\n你将继续使用 `Bootstrap` 类来为表单设置样式。从\
  \ `index.html` 开始，添加一对带有 `Bootstrap` 类名 `panel`、`panel-default` 和 `panel-body` 的\
  \ `div` 元素，就像你处理咖啡订单时那样。在它们内部，添加一个标题和一个存放实际项目的 `div`。这些标记应该添加在包含表单的 `div` 之后。\n\n\
  ```\n...\n    <header>\n      <h1>CoffeeRun</h1>\n    </header>\n    <section>\n\
  \      <div class=\"panel-default\">\n        <div class=\"panel-body\">\n     \
  \     <form data-coffee-order=\"form\">\n            ...\n          </form>\n  \
  \      </div>\n      </div>\n\n      <div class=\"panel-default\">\n        <div\
  \ class=\"panel-body\">\n          <h4>Pending Orders:</h4>\n          <div data-coffee-order=\"\
  checklist\">\n          </div>\n        </div>\n      </div>\n    </section>\n...\n\
  ```\n\n与之前一样，你添加了 `div` 来携带 `Bootstrap` 提供的样式。你清单的主体是 `data-coffee-order=\"checklist\"\
  ` 元素。它将是创建单个订单清单项并添加到 DOM 中的 JavaScript 目标。\n\n保存 `index.html`，启动 `browser-sync`，并确保\
  \ CoffeeRun 显示空的 `Pending Orders` 区域（图 11.2 添加清单项标记后）。\n\n![After adding the markup\
  \ for the checklist items](img/empty-pending-orders.png)\n\n现在你准备好重新回到 JavaScript\
  \ 了。\n\n## 创建 CheckList 模块\n\n在你的 `scripts` 文件夹中创建一个名为 `checklist.js` 的新文件并在 `index.html`\
  \ 中引用它：\n\n```\n...\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.js\n\
  \      charset=\"utf-8\"></script>\n    <script src=\"scripts/checklist.js\" charset=\"\
  utf-8\"></script>\n    <script src=\"scripts/formhandler.js\" charset=\"utf-8\"\
  ></script>\n    <script src=\"scripts/datastore.js\" charset=\"utf-8\"></script>\n\
  \    <script src=\"scripts/truck.js\" charset=\"utf-8\"></script>\n    <script src=\"\
  scripts/main.js\" charset=\"utf-8\"></script>\n...\n```\n\n保存 `index.html`。在 `checklist.js`\
  \ 中，使用 IIFE 添加标准的模块代码。\n\n```\n(function (window) {\n  'use strict';\n\n  var App\
  \ = window.App || {};\n  var $ = window.jQuery;\n\n  function CheckList(selector)\
  \ {\n    if (!selector) {\n      throw new Error('No selector provided');\n    }\n\
  \n    this.$element = $(selector);\n    if (this.$element.length === 0) {\n    \
  \  throw new Error('Could not find element with selector: ' + selector);\n    }\n\
  \  }\n\n  App.CheckList = CheckList;\n  window.App = App;\n})(window);\n```\n\n\
  `CheckList` 模块需要三个方法来完成工作。一个方法创建一个清单项，包括复选框和文本描述。将这组元素视为表格中的一行。\n\n另一个方法从表格中移除一行。第三个方法将为\
  \ `click` 事件添加监听器，以便你的代码知道*何时*移除一行。\n\n\n\n你将处理的第一种方法是创建一个新订单的一行。图 11.3 显示了当订单表单提交时，`CheckList`\
  \ 将如何向页面添加检查清单条目。\n\n**图 11.3 提交表单时的事件顺序**\n\n![提交表单时的事件顺序](img/checklist-diagram-1.png)\n\
  \n## 创建行构造函数\n\n你无法在 `index.html` 中为检查清单条目创建标记，因为它们需要在页面已经渲染后，响应表单提交时添加。相反，你将在 `CheckList`\
  \ 模块中添加一个 `Row` 构造函数。\n\n`Row` 构造函数将负责创建表示单个咖啡订单的所有 DOM 元素，包括复选框和文本描述。但 `Row` 构造函数不会导出到\
  \ `App` 命名空间。它将仅供 `CheckList.prototype` 方法之一在内部使用。\n\n在 `checklist.js` 中，在 `App.CheckList\
  \ = CheckList;` 语句之前添加 `Row` 构造函数。它应该接受一个名为 `coffeeOrder` 的参数，该参数将与发送给 `Truck.prototype.createOrder`\
  \ 的数据相同。\n\n```\n...\n    this.$element = $(selector);\n    if (this.$element.length\
  \ === 0) {\n      throw new Error('Could not find element with selector: ' + selector);\n\
  \    }\n  }\n\n  function Row(coffeeOrder) {\n    // 构造函数代码\n  }\n\n  App.CheckList\
  \ = CheckList;\n  window.App = App;\n})(window);\n```\n\n### 使用 jQuery 创建 DOM 元素\n\
  \n你的 `Row` 构造函数将使用 jQuery 构建 DOM 元素。你将为组成检查清单条目的各个元素声明变量。然后，构造函数将它们合并成 DOM 元素的子树（subtreesubtree），如图\
  \ 11.4 所示。`CheckList` 将获取该子树并作为 `[data-coffee-order=\"checklist\"]` 元素的子附加到页面的 DOM\
  \ 树上。\n\n**图 11.4 CheckList 创建行并追加其 DOM 元素**\n\n![CheckList 创建行并追加其 DOM 元素](img/checklist-creates-appends.png)\n\
  \n（订单描述中的“[39x]”代表咖啡因强度。）\n\n图 11.4 中由 `Row` 构造函数创建的 DOM 子树等同于以下标记：\n\n```\n<div\
  \ data-coffee-order=\"checkbox\" class=\"checkbox\">\n  <label>\n    <input type=\"\
  checkbox\" value=\"chewie@rrwwwgg.com\">\n    tall mocha iced coffee, (chewie@rrwwwgg.com)\
  \ [39x]\n  </label>\n</div>\n```\n\n使用带有 `checkbox` 类的 `<div>` 用于容纳你的 `<label>`\
  \ 和 `<input>` 元素。`checkbox` 类将为 `<div>` 应用适当的 `Bootstrap` 样式。`data-coffee-order`\
  \ 属性将在你需要触发复选框的点击操作时在 JavaScript 中使用。\n\n注意，你的 `<input>` 的 `type` 属性也是 `checkbox`。这告诉浏览器将输入绘制为复选框表单元素。订单的纯文本描述紧随在\
  \ `<input>` 之后。`<label>` 包裹了复选框输入和纯文本描述。这使得文本和输入变成了复选框的点击目标。\n\n你将逐个创建 `<label>`、`<div>`\
  \ 和 `<input>` 元素。然后你将手动将这些元素嵌套在彼此内部，创建一个 DOM 子树，并将其附加到活动 DOM（当前在页面上显示的 DOM 树）中。还将创建一个包含订单文本描述的字符串，例如“tall\
  \ mocha iced coffee, (chewie@rrwwwgg.com) [39x]”。\n\n为了创建这些元素，你将使用 jQuery 的 `$`\
  \ 函数。到目前，你只用过 `$` 函数从 DOM 中选择元素，但它也可以用于创建元素。\n\n首先，你将通过在 `checklist.js` 的 `Row`\
  \ 构造函数中调用 `$` 函数来创建 `<div>`。传递两个参数来描述你想要创建的 DOM 元素。让第一个参数为包含 DOM 元素 HTML 标签的字符串，在此例中为\
  \ `<div>`。让第二个参数为指定属性的对象。\n\n```javascript\n...\n  function Row(coffeeOrder) {\n\
  \    // 构造函数代码位于此处\n    var $div = $('<div>', {\n      'data-coffee-order': 'checkbox',\n\
  \      'class': 'checkbox'\n    });\n}\n```\n\n注意 `data-coffee-order` 使用单引号是因为它包含连字符（dash）。你可能从此推断在使用\
  \ jQuery 时应该始终对属性名使用引号，但实际上并非如此。具有特殊字符（如连字符）的属性名需要加引号。在不使用单引号的情况下，属性名（或变量名）中有效的字符是字母、数字、下划线（`_`）和美元符号（`$`）。\n\
  \n`class'` 使用单引号是因为“class”是 JavaScript 的保留字，所以需要单引号来防止浏览器将其视为 JavaScript。\n\n接下来，在\
  \ `checklist.js` 中使用 `$` 函数创建 `<label>` 元素，但不传递对象参数。它不需要任何属性。\n\n```javascript\n\
  ...\n  function Row(coffeeOrder) {\n    // 构造函数代码位于此处\n    var $div = $('<div>',\
  \ {\n      'data-coffee-order': 'checkbox',\n      'class': 'checkbox'\n    });\n\
  \n    var $label = $('<label></label>');\n  }\n...\n```\n\n现在，通过调用 `$` 函数并传递 `<input>`\
  \ 标签的 HTML 来创建复选框的 `<input>` 元素。对于第二个参数，指定 `type` 为 `checkbox`  `value` 为客户的电子邮件地址。由于这些属性名中没有使用特殊字符，你不需要将它们放在单引号中。\n\
  \n```javascript\n...\n  function Row(coffeeOrder) {\n    // 构造函数代码位于此处\n    var\
  \ $div = $('<div>', {\n      'data-coffee-order': 'checkbox',\n      'class': 'checkbox'\n\
  \    });\n\n    var $label = $('<label></label>');\n\n    var $checkbox = $('<input></input>',\
  \ {\n      type: 'checkbox',\n      value: coffeeOrder.emailAddress\n    });\n \
  \ }\n...\n```\n\n通过将 `value` 设置为客户的电子邮件地址，你将复选框与客户的咖啡订单关联起来。稍，当你添加点击处理器时，你可以根据 `value`\
  \ 属性中的电子邮件地址来识别点击了哪个咖啡订单。\n\n\n\n\n最后要创建的是显示在复选框旁文本描述。你将通过使用 `+=` 操作拼接各个部分来构建此字符串。\n\
  \n在 `checklist.js` 中创建一个名为 `description` 的变量。将其赋值为订单的 `size` 属性，然后添加一个逗号和一个空格。如果提供了风味（flavor），则使用\
  \ `+=` 将其拼接。接着拼接 `coffee`、`emailAddress` 和 `strength` 值。`emailAddress` 应该包裹在括号中，`strength`\
  \ 应该放在括号内，并在后面跟着字母“x”。（括号和中括号并不是语法目的，仅仅是为了格式化文本。）\n\n```\n...\n  function Row(coffeeOrder)\
  \ {\n    ...\n\n    var $checkbox = $('<input></input>', {\n      type: 'checkbox',\n\
  \      value: coffeeOrder.emailAddress\n    });\n\n    var description = coffeeOrder.size\
  \ + ' ';\n    if (coffeeOrder.flavor) {\n      description += coffeeOrder.flavor\
  \ + ' ';\n    }\n\n    description += coffeeOrder.coffee + ', ';\n    description\
  \ += ' (' + coffeeOrder.emailAddress + ')';\n    description += ' [' + coffeeOrder.strength\
  \ + 'x]';\n  }\n...\n```\n\n`+=` 拼接运算符在一个步骤中完成加法和赋值。这意味着以下两行代码是等价的：\n\n```\ndescription\
  \ += coffeeOrder.flavor + ' ';\ndescription = description + coffeeOrder.flavor +\
  \ ' ';\n```\n\n你现在已经拥有了清单项目的所有各个部分，并准备好将它们拼接在一起(图 11.5）。\n\n**图 11.5  将单个 DOM 元素组装成子树**\n\
  \n![将单个 DOM 元素组装成子树](img/loose-elements-to-subtree.png)\n\n你将通过三个步骤完成操作：\n\n1. 将\
  \ `$checkbox` 添加到 `$label`\n2. 将 `description` 添加到 `$label`\n3. 将 `$label` 添加到 `$div`\n\
  \n更通地说，你将通过从左到右、从下到上的方式来构建子树。这种方法类似于你在第 3 章中为 Ottergram 开发 CSS 的方式，从最小、最内层的元素开始逐步向上。\n\
  \n在 `checklist.js` 中，使用 jQuery 的 `append` 方法将元素连接起来。该方法接受 DOM 元素或 jQuery 包装的集合，并将其作为子元素添加。\n\
  \n```\n...\n  function Row(coffeeOrder) {\n    ...\n    description += coffeeOrder.coffee\
  \ + ', ';\n    description += ' (' + coffeeOrder.emailAddress + ')';\n    description\
  \ += ' [' + coffeeOrder.strength + 'x]';\n\n    $label.append($checkbox);\n    $label.append(description);\n\
  \    $div.append($label);\n  }\n...\n```\n\n你的 `Row` 构造函数现在可以使用传入的咖啡订单数据创建并组装元素子树了。然而，由于\
  \ `Row` 将用作构造函数而不是普通函数，它不能简单地返回这个子树。（事实上，构造函数永远不有 `return` 语句；当你使用 `new` 关键字调用构造函数时，JavaScript\
  \ 会自动为你返回一个值。）\n\n相反，通过在 `checklist.js` 中将其赋值给 `this.$element`，使子树作为实例的属性可用。（选择这个名称仅仅是为了遵循你其他构造函数的惯例；它本身没有任何特殊含义。）\n\
  \n```\n...\n  function Row(coffeeOrder) {\n    ...\n    $label.append($checkbox);\n\
  \    $label.append(description);\n    $div.append($label);\n\n    this.$element\
  \ = $div;\n  }\n...\n```\n\n`Row` 构造函数已准备好工作。它可以构建出用于表示带有复选框的单个咖啡订单所需的 DOM 子树。它在实例变量中保留了该\
  \ DOM 表示。\n\n## 在提交时创建清单行\n\n接下来，你为 `CheckList` 添加一个方法，该方法将使用 `Row` 构造函数来创建 `Row`\
  \ 实例。它会将每个 `Row` 实例的 `$element` 添加到页面上的活动 DOM 中。\n\n在 `checklist.js` 中，为 `CheckList.prototype`\
  \ 添加一个名为 `addRow` 的方法。它应该接受一个名为 `coffeeOrder` 的参数，该参数包含单个咖啡订单所有数据的对象。\n\n在这个新方法中，通过调用\
  \ `Row` 构造函数并传递 `coffeeOrder` 对象来创建一个新的 `Row` 实例。将新实例赋值给变量 `rowElement`。然后，将 `rowElement.$element`（包含\
  \ DOM 子树）`append` 到 Check 实例的 `$element`（指向清单项容器的引用）。\n\n```\n...\n  function CheckList(selector)\
  \ {\n    ...\n  }\n\n  CheckList.prototype.addRow = function (coffeeOrder) {\n \
  \   // 使用咖啡订单信息创建行实例\n    var rowElement = new Row(coffeeOrder);\n\n    // 将新行实例的\
  \ $element 属性添加到清单中\n    this.$element.append(rowElement.$element);\n  };\n\n  function\
  \ Row(coffeeOrder) {\n    ...\n```\n\n这就是将 `Row` 的 DOM 子树添加到页面上所需的所有操作。保存 `checklist.js`。\n\
  \n在 `main.js` 中，添加一个匹配整个清单区域的选择器变量 `[data-coffee-order=\"checklist\"]`。然后，从 `App`\
  \ 命名空间导入 `CheckList` 模块到本地变量 `CHECKLIST_SELECTOR` 中。\n\n```\n(function (window)\
  \ {\n  'use strict';\n  var FORM_SELECTOR = '[data-coffee-order=\"form\"]';\n  var\
  \ CHECKLIST_SELECTOR = '[data-coffee-order=\"checklist\"]';\n  var App = window.App;\n\
  \  var Truck = App.Truck;\n  var DataStore = App.DataStore;\n  var FormHandler =\
  \ App.FormHandler;\n  var CheckList = App.CheckList;\n  var myTruck = new Truck('ncc-1701',\
  \ new DataStore());\n...\n```\n\n现在你可以实例化一个 `CheckList` 实例来添加清单项了。\n\n你可能想直接添加另一个\
  \ `formHandler.addSubmitHandler` 调用，但不会按照你预期的方式工作。为什么呢？你每次调用 `addSubmitHandler`，它都会注册一个新的重置表单的回调（通过调用\
  \ `this.reset`）。\n\n考虑以下代码：\n\n```\n...\n// 实例化一个新的 CheckList\nvar checkList = new\
  \ CheckList(CHECKLIST_SELECTOR);\n\nvar formHandler = new FormHandler(FORM_SELECTOR);\n\
  formHandler.addSubmitHandler(myTruck.createOrder.bind(myTruck));\n\n// 这不会产生你想要的效果！\n\
  formHandler.addSubmitHandler(checkList.addRow.bind(checkList));\n...\n```\n\n这段代码注册了两个在表单提交时运行的回调。在第一个\
  \ `submit` 处理程序（`myTruck.createOrder`）调用后，表单会被重置。当第二个 `submit` 处理程序（`checkList.addRow`）调用时，表单中已经没有剩余信息了。结果是数据被添加到\
  \ `DataStore` 中，但清单项没有被添加到页面。\n\n\n\n\n为了解决这个问题，你需要向 `formHandler.addSubmitHandler`\
  \ 传递一个匿名函数，并让该匿名函数同时调用 `myTruck.createOrder` 和 `checkList.addRow`。\n\n此外，这些方法中的每一个都需要绑定到特定的实例（这意味着它的\
  \ `this` 关键字需要被设置）。你一直在使用 `bind` 来设置 `this` 的值，但在这里你将使用一种不同的技术。\n\n### 使用 call 操控\
  \ this\n\n`call` 方法的作用与 `bind` 类似，用于设置 `this` 的值。两者的区别在于，`bind` 返回函数或方法的新版本，但不会调用它；而\
  \ `call` 实际上会调用该函数或方法，并允许你将 `this` 的值作为第一个参数传递。（如果你需要向函数传递任何其他参数，只需将它们添加到参数列表中即可）。`call`\
  \ 会运行函数体并返回通常情况下的任何值。\n\n在这里你需要使用 `call` 而不是 `bind`，因为除了设置 `this` 的值之外，你还需要调用 `myTruck.createOrder`\
  \ 和 `checkList.addRow`。\n\n在 `main.js` 中，删除现有的 `formHandler.addSubmitHandler` 调用。添加新的\
  \ `formHandler.addSubmitHandler` 调用，并对其传递一个接受单个参数 `data` 的匿名函数。在匿名函数内部，使用 `myTruck.createOrder`\
  \ 和 `checkList.addRow` 的 `call` 方法来设置 `this` 的值，并将 `data` 对象作为第二个参数传递。\n\n```\n\
  ...\n  var myTruck = new Truck('ncc-1701', new DataStore());\n  window.myTruck =\
  \ myTruck;\n  var checkList = new CheckList(CHECKLIST_SELECTOR);\n  var formHandler\
  \ = new FormHandler(FORM_SELECTOR);\n\n  formHandler.addSubmitHandler(myTruck.createOrder.bind(myTruck));\n\
  \                               function (data) {\n    console.log(formHandler);\n\
  \    myTruck.createOrder.call(myTruck, data);\n    checkList.addRow.call(checkList,\
  \ data);\n  });\n})(window);\n```\n\n你创建了一个同时调用 `createOrder` 和 `addRow` 的单一 `submit`\
  \ 处理函数。当它调用它们时，它传递了正确的 `this` 值和来自表单的 `data`。\n\n保存你的更改，并在浏览器中输入一些数据并提交表单来测试你的清单功能。当你提交每个订单时，你将看到它被添加到“待处理订单”（Pending\
  \ Orders）清单中，如图 11.6 所示。\n\n**图 11.6 提交表单向清单添加了一个项目**\n\n![提交表单向清单添加了一个项目](img/adding-checklist-items.png)\n\
  \n## 通过点击行交付订单\n\n你快成功了！CoffeeRun 的用户可以通过填写表单来添加订单。当他们提交表单时，订单信息会被添加到应用程序数据库中，并为订单绘制清单项目。\n\
  \n接下来，用户应该能够勾选清单项目。当点击清单项目时（意味着订单已送达），应该从数据库中删除订单信息，并从页面上移除该清单项目。图 11.7 显示了这一过程。\n\
  \n**图 11.7 序列图：点击清单项目**\n\n![序列图：点击清单项目](img/checklist-diagram-2.png)\n\n首先，你将创建从页面中移除清单项目的功能。\n\
  \n### 创建 CheckList.prototype.removeRow 方法\n\n当你创建一个 `Row` 时，`<input>` 的 `value`\
  \ 被设置为客户的电子邮件地址。`removeRow` 将使用电子邮件地址参数来找到要从 UI 中移除的正确 `CheckList` 项目。它通过创建一个属性选择器来查找\
  \ `value` 属性与电子邮件地址匹配的 `<input>`。\n\n当找到匹配的元素后，它将向上移动 DOM 直到找到 `[data-coffee-order=\"\
  checkbox\"]`。\n\n这是包裹了组成行的所有元素的 `<div>`。最后，使用 jQuery 选中该 `<div>` 后，就可以调用它的 `.remove`。在\
  \ `checklist.js` 中添加 `removeRow` 方法并指定 `email` 参数。使用 `this.$element` 搜索任何 `value`\
  \ 匹配电子邮件的后代元素。注意你使用了 `this.$element.find`，这执行了作用域选择。\n\n```\n...\n  CheckList.prototype.addRow\
  \ = function (coffeeOrder) {\n    ...\n  };\n\n  CheckList.prototype.removeRow =\
  \ function (email) {\n    this.$element\n      .find('[value=\"' + email + '\"]')\n\
  \      .closest('[data-coffee-order=\"checkbox\"]')\n      .remove();\n  };\n\n\
  \  function Row(coffeeOrder) {\n    ...\n```\n\n\n\n现在你已经根据客户的电子邮件地址删除行了，这非常简单。在\
  \ `checklist.js` 中，更新 `addRow` 原型方法，使其执行的第一件事是调用 `removeRow`，并传入客户的电子邮件地址。\n\n```\n\
  ...\n  CheckList.prototype.addRow = function (coffeeOrder) {\n    // 移除任何与电子邮件匹配的现有行\n\
  \    this.removeRow(coffeeOrder.emailAddress);\n\n    // 使用咖啡订单信息创建新行实例\n    var\
  \ rowElement = new Row(coffeeOrder);\n\n    // 将新行实例的 $element 属性添加到清单\n    this.$element.append(rowElement.$element);\n\
  \  };\n...\n```\n\n保存 `checklist.js` 并在浏览器中验证：当提交一个具有相同电子邮件的第二个订单时，第一个订单的清单项会被移除。\n\
  \n现在你已经可以从 UI 中删除清单行了，请将注意力转向处理清单的 `click` 事件上。\n\n### 编写 addClickHandler 方法\n\n\
  为了处理对清单的点击事件，你将使用与处理 `FormHandler` 时相同的事件处理器注册技术。\n\n`FormHandler.prototype.addSubmitHandler`\
  \ 接受一个函数参数 `fn`，然后注册一个匿名函数来处理 `this.$formElement` 的 `submit` 事件。在该匿名函数内部，会调用 `fn`。以下是该方法的定义供参考：\n\
  \n```\n FormHandler.prototype.addSubmitHandler = function (fn) {\n\n    console.log('Setting\
  \ submit handler for form');\n    this.$formElement.on('submit', function (event)\
  \ {\n      event.preventDefault();\n\n      var data = {};\n      $(this).serializeArray().forEach(function\
  \ (item) {\n        data[item.name] = item.value;\n        console.log(item.name\
  \ + ' is ' + item.value);\n      });\n      console.log(data);\n\n      fn(data);\n\
  \      this.reset();\n      this.elements[0].focus();\n    });\n  };\n```\n\n这使得\
  \ `FormHandler.prototype.addSubmitHandler` 变得灵活，因为它可以接收任何在表单提交时需要运行的函数。这样，`FormHandler.prototype.addSubmitHandler`\
  \ 就不需要知道该函数的细节或它执行的步骤。\n\n你将为 `CheckList` 添加一个名为 `addClickHandler` 的原型方法，它的工作方式与\
  \ `FormHandler` 的 `addSubmitHandler` 相同。也就是说，它将：\n\n1. 接受一个函数参数。\n2. 注册事件处理器回调。\n\
  3. 在事件处理器回调内部调用该函数参数。\n\n`CheckList.prototype.addClickHandler` 与 `FormHandler.prototype.addSubmitHandler`\
  \ 的区别在于，它将监听 `click` 事件并将回调绑定（`bind`）到 `CheckList` 实例上。\n\n在 `checklist.js` 中，添加\
  \ `addClickHandler` 方法并指定参数名为 `fn`。使用 jQuery 的 `on` 方法监听 `click` 事件。\n\n在事件处理器函数内部，声明一个名为\
  \ `email` 的局部变量，并将其赋值为 `event.target.value`，即客户的电子邮件地址。然后调用 `removeRow` 并传入 `email`。之后，调用\
  \ `fn` 并同样传入 `email`。确保使用 `bind(this)` 来设置事件处理器函数的上下文对象。\n\n```\n...\n  function\
  \ CheckList(selector) {\n    ...\n  }\n\n  CheckList.prototype.addClickHandler =\
  \ function (fn) {\n    this.$element.on('click', 'input', function (event) {\n \
  \     var email = event.target.value;\n      this.removeRow(email);\n      fn(email);\n\
  \    }.bind(this));\n  };\n\n  CheckList.prototype.addRow = function (coffeeOrder)\
  \ {\n    ...\n```\n\n当你通过 `this.$element.on` 注册事件处理器回调时，你指定了 `click` 作为事件名称。但你还作为第二个参数传递了一个过滤选择器。该过滤选择器告诉事件处理器*仅*当事件是由\
  \ `<input>` 元素触发时才执行回调函数。\n\n这种模式被称为**事件委托**（event delegation）。它之所以有效，是因为某些事件（如点击和按键）会在\
  \ DOM 中**传播**（`propagate`），这意味着每个祖先元素都会被该事件。\n\n每当你需要监听动态创建和移除的元素（例如清单项）上的事件时，都应该使用事件委托。在动态元素的容器上添加单个监听器更简单且性能更高。\n\
  \n当你通过 `this.$element.on` 注册事件处理器回调时，你指定了 `click` 作为事件名称。但你还作为第二个参数传递了一个过滤选择器。该过滤选择器告诉事件处理器*仅*当事件是由\
  \ `<input>` 元素触发时才执行回调函数。\n\n这种模式被称为事件委托。它之所以有效，是因为某些事件（如点击和按键）会在 DOM 中传播，这意味着每个祖先元素都会被该事件。\n\
  \n注意，你*没有*在事件处理器内部调用 `event.preventDefault`。如果你调用了 `event.preventDefault`，复选框将不会改变其视觉状态。\n\
  \n此外，注意你将事件处理器绑定到了 `this`，这指向的是 `CheckList` 的实例。\n\n### 调用 addClickHandler\n\n`addClickHandler`\
  \ 需要连接到 `deliverOrder`。前往 `main.js` 建立这种连接。将绑定后的 `deliverOrder` 传递给 `checkList.addClickHandler`。\n\
  \n```\n...\n  var myTruck = new Truck('1701', new DataStore());\n  window.myTruck\
  \ = myTruck;\n  var checkList = new CheckList(CHECKLIST_SELECTOR);\n  checkList.addClickHandler(myTruck.deliverOrder.bind(myTruck));\n\
  \  var formHandler = new FormHandler(FORM_SELECTOR);\n...\n```\n\n保存更改并在表单中添加一些咖啡订单。点击清单项的任何复选框或文本，它就会移除（图\
  \ 11.9）！\n\n你学会了如何创建表单元素并处理它们生成的事件。你能够通过使用电子邮件作为标识符，将每一个与特定的咖啡订单关联。\n\n通过这些技术，你完成了管理\
  \ UI 的模块，将一个仅限控制台的应用程序变成了可以处理现实任务的程序。\n\n你已经完成了 CoffeeRun 的三个主要部分中的两个。内部逻辑控制应用程序的数据。表单元素、`FormHandler`\
  \ 和 `CheckList` 提供了交互式 UI。接下来的章节将处理与远程服务器准备和交换数据。\n\n\n\n允许编辑现有订单。你需要更改清单的工作方式。\n\
  \n如果用户双击订单，则将其重新加载回表单进行编辑。如果用户仅点击一次，则将该行设为灰色。几秒钟后，将该项视为已送达，并将其从清单以及应用程序数据中移除。\n\n\
  作为一个额外的奖励，请确保在用户完成编辑后，现有的行是原地更新的，而不是删除并替换为新行。\n\n# 第 12 章：表单验证\n\nCoffeeRun 正在运行得良好！用户可以在表单中输入咖啡订单，并且订单信息会经过处理并存储。但如果有人提交了一个包含缺失或不可用信息的订单，你的\
  \ App 以及你的咖啡车会发生什么呢？\n\n别担心。你可以通过编写少量代码来轻松处理这些场景，确保数据数据供你的应用程序使用。事实上，如果你需要将数据发送回服务器，这是至关重要的一步。几乎所有现代浏览器都准备好在提交表单时验证表单数据。你只需要提供规则即可。\n\
  \n在本章中，你将学习两种表单验证技术。第一种技术是在 HTML 中添加验证属性，让浏览器内置的验证机制生效。第二种是使用 JavaScript 编写自己的验证代码，使用\
  \ Constraint Validation API。\n\n## `required` 属性\n\n最基本的验证形式是检查字段是否有值且不完全为空。这种检查对于带有默认值的值的字段（例如你的尺寸、口味和强度字段）没有意义。但对于你的订单和电子邮件字段来说，这正是你需要的——你绝对不想在这些字段留空的情况下提交订单。\n\
  \n在 `index.html` 中，为订单和电子邮件字段添加 `required` 布尔型属性。\n\n```\n...\n            <div\
  \ class=\"form-group\">\n              <label for=\"coffeeOrder\">Order</label>\n\
  \              <input class=\"form-control\" name=\"coffee\" id=\"coffeeOrder\"\n\
  \                autofocus required />\n            </div\n\n            <div class=\"\
  form-group\">\n              <label for=\"emailInput\">Email</label>\n         \
  \     <input class=\"form-control\" type=\"email\" name=\"emailAddress\"\n     \
  \         id=\"emailInput\" value=\"\" placeholder=\"dr@who.com\"\n            \
  \    required />\n            </div>\n...\n```\n\n记住，布尔属性不应赋值。如果你犯了错误，写了类似 `required=\"\
  false\"` 的代码，值将变为 `true` 且该字段将变为必填！浏览器只关心属性是否存在，而忽略任何分配的值。\n\n这一点值得重复：如果元素存在一个布尔属性，浏览器就会认为其值为\
  \ `true`，无论你为它设置了什么值。\n\n保存 `index.html`，确保 `browser-sync` 正在运行，并在浏览器中加载 CoffeeRun。尝试在不填写一个或两个必填字段的情况下提交表单。你会看到一个警告，如图\
  \ 12.1 所示。\n\n**图 12.1 必填字段为空时的错误**\n\n![必填字段为空时的错误](img/required-validation-errors.png)\n\
  \n此外，注意你的 `submit` 处理器没有输出控制台消息。`submit` 事件仅在浏览器验证你的表单后才会触发（图 12.2）。\n\n**图 12.2\
  \ 表单验证时两种可能的事件序列**\n\n![表单验证时两种可能的事件序列](img/submission-validation-flow.png)\n\n\
  ## 使用正则表达式进行验证\n\n将字段设置为 `required` 是确保用户不留空字段的简单方法。但如果你对字段中应的内容有具体要求怎么办？这种验证需要\
  \ `pattern` 属性。\n\n在订单 `<input>` 的 `required` 属性之后，添加 `pattern` 属性。为它分配一个特殊格式化的字符串，我们称为正则表达式，我们稍后会解释。\n\
  \n```\n...\n            <div class=\"form-group\">\n              <label for=\"\
  coffeeOrder\">Order</label>\n              <input class=\"form-control\" name=\"\
  coffee\" id=\"coffeeOrder\"\n                autofocus required pattern=\"[a-zA-Z\\\
  s]+\" />\n            </div\n...\n```\n\n正则表达式是用于模式匹配的字符序列。正则表达式 `[a-zA-Z\\s]+`\
  \ 匹配由小写字母 (`a-z`)、大写字母 (`A-Z`) 和空白字符 (`\\s`) 组成的集合中的任何字符，重复一次或多次 (`+`)。\n\n简而言之，当你提交表单时，该字段只有在包含字母或空格时才是有效的。\n\
  \n保存并重新加载。看看如果你在订单字段中输入符号或数字并尝试提交表单，会发生什么。\n\n## Constraint Validation API\n\n在浏览器中验证表单字段的最强方法是编写验证函数。你可以结合\
  \ Constraint Validation API 使用验证函数。\n\n但有一个陷阱，而且不是小问题：Constraint Validation API\
  \ 在 Safari 浏览器中的支持很差。\n\n尽管有此疏忽，编写针对标准行为的代码仍然，然后添加一个 JavaScript 库来为不支持的浏览器添加支持。假设你的咖啡车仅供员工使用，所以你想确保客户是员工。实现此点的一种方法是确保提交的电子邮件地址来自你的公司域名。\n\
  \n这是一个学习 Constraint Validation API 的好问题。你可以为 `emailAddress` 字段使用 `pattern` 属性。（此外，在你完成下一章之后，你可以扩展到简单的域名检查之外，查询远程服务器以确定电子邮件是否真实存在。）\n\
  \n创建一个新文件 `scripts/validation.js` 来存放你的验证函数。在 `index.html` 中为你的新模块添加 `<script>`\
  \ 标签。\n\n```\n...\n      </div>\n    </section>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.4/jquery.js\"\
  \n      charset=\"utf-8\"></script>\n    <script src=\"scripts/validation.js\" charset=\"\
  utf-8\"></script>\n    <script src=\"scripts/checklist.js\" charset=\"utf-8\"></script>\n\
  \    <script src=\"scripts/formhandler.js\" charset=\"utf-8\"></script>\n    <script\
  \ src=\"scripts/datastore.js\" charset=\"utf-8\"></script>\n    <script src=\"scripts/truck.js\"\
  \ charset=\"utf-8\"></script>\n    <script src=\"scripts/main.js\" charset=\"utf-8\"\
  ></script>\n  </body>\n</html>\n```\n\n保存 `index.html`。在 `validation.js` 中，添加一个\
  \ IIFE（立即调用函数表达式模块模块创建一个空对象字面量，将其赋值给名为 `Validation` 的变量，然后将该变量导出到 `App` 命名空间。\n\n\
  ```javascript\n(function (window) {\n  'use strict';\n  var App = window.App ||\
  \ {};\n\n  var Validation = {\n\n  };\n\n  App.Validation = Validation;\n  window.App\
  \ = App;\n})(window);\n```\n\n你的新 `Validation` 模块仅用于组织函数，因此它不需要是一个构造函数。\n\n\n\n\n\
  \n添加一个名为 `isCompanyEmail` 的方法。该方法将根据正则表达式对电子邮件地址进行测试并返回 `true` 或 `false`。（根据需要更改指定的域名。）\n\
  \n```javascript\n(function () {\n  'use strict';\n  var App = window.App || {};\n\
  \n  var Validation = {\n    isCompanyEmail: function (email) {\n      return /.+@bignerdranch\\\
  .com$/.test(email);\n    }\n  };\n\n  App.Validation = Validation;\n  window.App\
  \ = App;\n})(window);\n```\n\n你通过在正斜杠 `//` 之间放置模式创建了一个字面量正则表达式。在正斜杠内部，你指定了一个由一个或多个字符（`.+`）组成的字符串，紧接着是“@bignerdranch.com”——你还使用了反斜杠\
  \ `\\` 来表示 `bignerdranch.com` 中的点应该被视为字面上的点。（通常情况下，正则表达式中的点是匹配任何字符的通配符。）正则表达式末尾的“$”意味着“@bignerdranch.com”应该位于字符串的末尾——之后不应该再出现任何字符。\n\
  \n该正则表达式是一个对象，并具有一个 `test` 方法。你可以将字符串传递给 `test` 方法，它将返回一个布尔值——如果正则表达式匹配该字符串则返回 `true`，否则返回\
  \ `false`。（如需其他正则表达式方法的列表，请参见 [`developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp`](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/RegExp)）。\n\
  \n在控制台中测试你的 `App.Validation.isCompanyEmail` 函数（图 12.3]）。\n\n**图 12.3 在控制台上测试 `App.Validation.isCompanyEmail`**\n\
  \n![在控制台上测试 App.Validation.isCompanyEmail](img/iscompanyemail-validation.png)\n\n\
  你现在有有了一个可以检查有效电子邮件地址的函数。下一步是将其连接到表单。\n\n### 监听 input 事件\n\n你应该何时使用此函数？当用户填写表单时，输入字段可能会触发几个事件。其中一个是在用户输入每个字符时发生的。另一个是用户失去字段焦点时发生的。或者你也可以在提交表单时运行该函数。\n\
  \n约束验证 API（Constraint Validation API）要求在提交之前标记无效字段。如果任何字段无效，浏览器将停止触发 `submit` 事件。因此，在提交时才进行检查就太晚了。\n\
  \n当用户失去字段焦点时触发的事件被称为 `blur` 事件。这也不是一个验证的良好选择。假设用户的光标在电子邮件输入框中，因此该字段拥有焦点。如果用户此时按下回车键，这将触发表单提交，但不会触发\
  \ `blur` 事件，任何与其绑定的验证都将不会执行。\n\n因此，验证检查需要在用户输入每个字符时发生。更新 `formhandler.js` 中的 `FormHandler`\
  \ 模块，添加一个 `addInputHandler` 原型方法。它应该为表单的 `input` 事件添加监听器。和 `addSubmitHandler` 方法一样，它应该接受一个函数参数。\n\
  \n```javascript\n...\n  FormHandler.prototype.addSubmitHandler = function (fn) {\n\
  \    ...\n  };\n\n  FormHandler.prototype.addInputHandler = function (fn) {\n  \
  \  console.log('Setting input handler for form');\n  };\n\n  App.FormHandler = FormHandler;\n\
  \  window.App = App;\n...\n```\n\n使用 jQuery 的 `on` 方法挂载 `input` 事件的监听器。确保使用事件委托模式来过滤掉由\
  \ `[name=\"emailAddress\"]` 字段以外任何元素创建事件。\n\n```javascript\n...\n  FormHandler.prototype.addInputHandler\
  \ = function (fn) {\n    console.log('Setting input handler for form');\n    this.$formElement.on('input',\
  \ '[name=\"emailAddress\"]', function (event) {\n      // 事件处理代码将在这里\n    });\n\
  \  };\n\n  App.FormHandler = FormHandler;\n  window.App = App;\n...\n```\n\n在事件处理程序内部，从\
  \ `event.target` 对象提取电子邮件字段的值。然后 `console.log` 运行 `addInputHandler` 的函数参数 `fn` 的结果，并将电子邮件字段的值传递给它。\n\
  \n```javascript\n...\n  FormHandler.prototype.addInputHandler = function (fn) {\n\
  \    console.log('Setting input handler for form');\n    this.$formElement.on('input',\
  \ '[name=\"emailAddress\"]', function (event) {\n      // 事件处理代码将在这里\n      var\
  \ emailAddress = event.target.value;\n      console.log(fn(emailAddress));\n   \
  \ });\n  };\n\n  App.FormHandler = FormHandler;\n  window.App = App;\n...\n```\n\
  \n### 将验证检查与输入关联\n\n在 `main.js` 中，从 `App` 命名空间导入 `Validation` 并将其赋值给本地变量。\n\n```javascript\n\
  ...\n  var Truck = App.Truck;\n  var DataStore = App.DataStore;\n  var FormHandler\
  \ = App.FormHandler;\n  var Validation = App.Validation;\n  var CheckList = App.CheckList;\n\
  \  var myTruck = new Truck('ncc-101', new DataStore());\n...\n```\n\n导入 `Validation`\
  \ 对象后，你可以将其连接到 `formHandler` 的新 `addInputHandler` 方法。\n\n```javascript\n...\n  formHandler.addSubmitHandler(function\
  \ (data) {\n    myTruck.createOrder.call(myTruck, data);\n    checkList.addRow.call(checkList,\
  \ data);\n  });\n\n  formHandler.addInputHandler(Validation.isCompanyEmail);\n\n\
  })(window);\n```\n\n保存并加载。填写电子邮件字段并查看控制台显示了什么。当你输入有效的电子邮件地址时，控制台会显示多个 `false` 结果，这些结果是由\
  \ `FormHandler.prototype.addInputHandler` 中的 `console.log(fn(emailAddress))` 行打印的。当你完成有效电子邮件地址的输入后，将在控制台中看到\
  \ `true`（图 12.4]）。\n\n**图 12.4 记录电子邮件验证检查**\n\n![记录电子邮件验证检查](img/validating-email-console.png)\n\
  \n### 触发有效性检查\n\n现在你可以可靠地测试电子邮件地址是否来自你的公司域名，如果验证失败，你应该通知用户。你将使用 `event.target` 的\
  \ `setCustomValidity` 方法来将其标记为无效。\n\n在 `formhandler.js` 中，删除 `console.log` 语句，并替换为警告消息的变量以及\
  \ `if/else` 子句。如果 `fn(emailAddress)` 调用返回 `true`，则清除字段的自定义有效性。如果它返回 `false`，则将 `message`\
  \ 变量赋值为警告消息的字符串，并将自定义有效性设置为 `message`。\n\n\n\n\n```javascript\n...\n  FormHandler.prototype.addInputHandler\
  \ = function (fn) {\n    console.log('Setting input handler for form');\n    this.$formElement.on('input',\
  \ '[name=\"emailAddress\"]', function (event) {\n      var emailAddress = event.target.value;\n\
  \      console.log(fn(emailAddress));\n      var message = '';\n      if (fn(emailAddress))\
  \ {\n        event.target.setCustomValidity('');\n      } else {\n        message\
  \ = emailAddress + ' is not an authorized email address!'\n        event.target.setCustomValidity(message);\n\
  \      }\n    });\n  };\n...\n```\n\n你传入了应该显示给用户的错误消息。如果没有错误，你仍然必须调用 `setCustomValidity()`，但要传入一个空字符串作为参数。这将该字段标记为有效。\n\
  \n在你输入字时执行的验证检查只会将字段标记为有效或无效。它不会显示错误消息。当你点击 `Submit` 按钮时，浏览器会检查无效字段，如果发现任何，就会显示验证消息。\n\
  \n要尝试一下，在输入一个不匹配域名的电子邮件地址后提交表单。在你按下 `Submit` 按钮后，你应该会看到你的自定义验证消息作为警告出现在字段旁边（图 12.5）。\n\
  \n**图 12.5 仅允许有效的电子邮件地址！**\n\n![仅允许有效的电子邮件地址！](img/knope.png)\n\n## 为有效和无效元素设置样式\n\
  \nCoffeeRun 现在对订单字段和电子邮件地址进行验证。现在是时候通过视觉上标记无效字段来增强 UI 了。对于这段非常短的 CSS，你将在 `index.html`\
  \ 的 `<head>` 标签中添加一个规则集。\n\n```html\n...\n  <head>\n    <meta charset=\"utf-8\"\
  >\n    <title>coffeerun</title>\n    <link rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.6/css/bootstrap.min.css\"\
  >\n    <style>\n      form :invalid {\n        border-color: #a94442;\n      }\n\
  \    </style>\n  </head>\n...\n```\n\n这为你的表单中任何带有伪类 `:invalid` 的字段添加了边框。当表单运行验证检查时，浏览器会自动添加此伪类。\n\
  \n保存并返回浏览器。多按几次 Tab 键（或点击文本输入字段外部）以聚焦订单或电子邮件字段以外的表单元素。这两个必填字段将具有红色的边框（图 12.6\n\n\
  如果边框只出现在必需且聚焦的无效字段上会更合适。在 `index.html` 中的选择器中再添加两个伪类：\n\n```html\n <head>\n    <meta\
  \ charset=\"utf-8\">\n    <title>coffeerun</title>\n    <link rel=\"stylesheet\"\
  \ href=\"https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/3.3.6/css/bootstrap.min.css\"\
  >\n    <style>\n      form :focus:required:invalid {\n        border-color: #a94442;\n\
  \      }\n    </style>\n  </head>\n...\n```\n\n你指定了具有三个伪类 `:focus`、`:required` 和\
  \ `:invalid` 的字段将获得新的边框颜色（图 12.7\n\nCoffeeRun 正在发展成为一个功能完整的 Web 应用。在接两个章节中，你将使用\
  \ Ajax 将数据同步到远程服务器。\n\n## 挑战挑战：脱咖啡的自定义验证\n\n在你的 `Validation` 模块中添加另一个函数。它应该接受两个参数：一个字符串和一个整数。如果字符串包含单词“decaf”且整数大于\
  \ 20，该函数应返回 `false`。\n\n为咖啡订单文本字段和咖啡因强度滑块添加监听器。对于当前正在编辑并导致验证失败的任何字段触发自定义验证。\n\n\
  ## 给更有好奇心的人：Webshims 库\n\n如之前提到的，一个不支持 Constraint Validation API 的显著浏览器是苹果的 `Safari`\
  \ 浏览器。如果你需要支持 `Safari`，可以使用库或 `polyfill` 为未实现该 API 的浏览器模拟该 API。\n\n一个可以在 `Safari`\
  \ 中提供约束验证的库是 Webshims Lib，你可以从 [github.com/aFarkas/webshim](https://github.com/aFarkas/webshim)\
  \ 下载它。\n\n实际上，Webshims 库可以作为许多许多功能的 polyfill。设置和使用它非常简单。（不过，它确实做了很多不同的事情，很容易在文档中迷失。）\n\
  \n以下是在 CoffeeRun 中使用它以便让 `Safari` 与你的 `Validation` 模块工作的方法。首先，从项目页面下载 zip 包：[github.com/aFarkas/webshim/releases/latest](https://github.com/aFarkas/webshim/releases/latest)。解压文件并将\
  \ `js-webshim/webshim` 文件夹放入你的 `coffeerun` 目录。\n\n最后，该库有一个你需要知道的特殊之处。在任何使用 `setCustomValidity()`\
  \ 的地方，你必须用 jQuery 包装对象。对于 CoffeeRun，你需要将 `formhandler.js` 中 `addInputHandler` 函数的\
  \ `event.target` 对象进行包装：\n\n\n\n\n\nWebshim 的作者选择将 polyfill 功能完全实现为 jQuery 的扩展。除了这种包装之外，你不需要修改你的代码。\n\
  \n保存更改后，你可以在 `Safari` 中测试你的验证逻辑。你应该发现，如果你忘记填写咖啡订单或输入了无效的电子邮件地址，它也会报告问题（图 12.8）。\n\
  \n**图 12.8 将 Webshim 作为 Safari 的 polyfill**\n\n![Using Webshim as a Safari polyfill](img/safari-polyfill.png)\n\
  \nWebshim 的功能远不止表单验证。你应该浏览文档，看看它还能为你的项目做些什么。\n\n# 13 Ajax\n\n在上一章中，你使用了浏览器内置的验证功能来确保用户输入的数据符合\
  \ CoffeeRun 的参数。在完成这些检查后，你就可以放心地将这些数据发送到服务器了。\n\n目前，`FormHandler.prototype.addSubmitHandler`\
  \ 方法调用了事件对象的 `preventDefault` 方法，阻止浏览器向服务器发送请求。通常情况下，服务器会返回一个响应导致页面重新加载。而现在，你是在提取用户输入表单的数据，并使用\
  \ JavaScript 更新表单和检查列表。\n\n在本章中，你将创建一个 `RemoteDataStore` 模块，它向服务器发送请求并处理响应（图 13.1）。但它将使用\
  \ `Ajax` 在后台执行此操作，而导致浏览器重新加载。\n\n**图 13.1 章节末的 CoffeeRun**\n\n![CoffeeRun at the\
  \ end of the chapter](img/coffee-orders-over-network.png)\n\nAjax 是一种通过 JavaScript\
  \ 与远程服务器通信的技巧。JavaScript 通常使用服务器返回的数据来更改网页的内容，而无需重新加载浏览器。这可以改进 Web 应用程序的使用体验。\n\n\
  最初，“Ajax” 是“异步 JavaScript 和 XML”（asynchronous JavaScript and XML）的缩写，但现在它被泛指这种异步数据通信的风格，无论实际涉及哪些技术。（异步通信意味着应用在发送请求后，无需等待服务器的响应即可继续其他任务。）Ajax\
  \ 现在是后后发送和接收数据的标准机制。\n\n## XMLHttpRequest 对象\n\nAjax 的核心是 `XMLHttpRequest` API。在现代浏览器中，你可以实例化新的\
  \ `XMLHttpRequest` 对象，这允许你向服务器发送请求而不引起页面重新加载。它们在后台执行工作。\n\n使用 `XMLHttpRequest` 对象，你可以为请求/响应周期的不同阶段附加回调函数，这就像你在\
  \ DOM 对象上监听事件的方式一样。你还可以检查 `XMLHttpRequest` 对象的属性，以访问有关请求/响应周期状态的信息。两个实用的属性是 `response`\
  \ 和 `status`，它们会在发生任何变化时立即更新。`response` 属性包含服务器返回的数据（如 HTML、XML、JSON 或其他格式）。`status`\
  \ 是一个数字代码，告诉你有 HTTP 响应是否成功。这些正式称为 `HTTP 状态码`。\n\n状态码按范围分组，这些范围具有基本含义。例如，200-299\
  \ 范围内的状态码是成功码，而 500-599 范围内的状态码表示发生了服务器错误。你经常会看到这些范围被泛指，例如“2xx”或“3xx”状态。\n\n表 13.1\
  \ 显示了一些较常见的代码。\n\n**表 13.1 常见的 HTTP 状态码**\n\n| 状态码 | 状态文本 | 描述 |\n| --- | --- |\
  \ --- |\n| 200 | OK | 请求成功。 |\n| 400 | Bad Request | 服务器不理解请求。 |\n| 404 | Not Found\
  \ | 找不到资源，通常是因为文件或路径名称与服务器上的任何内容都不匹配。 |\n| 500 | Internal Server Error | 服务器遇到错误，例如服务器端代码中未处理的异常。\
  \ |\n| 503 | Service Unavailable | 服务器无法处理请求，通常是因为负载过载或正在进行维护。 |\n\njQuery 许多许多方法可以创建和管理\
  \ `XMLHttpRequest` 对象，并提供了一个简洁、后兼容且跨浏览器的 API。它不是管理 Ajax 请求的唯一库，但许多其他库只是遵循了 jQuery\
  \ 的做法。你将使用 jQuery 的 `get` 和 `post` 方法来处理 Ajax `GET` 和 `POST` 请求，并使用 jQuery 的 `ajax`\
  \ 方法处理 `DELETE` 请求。\n\n## RESTful Web 服务\n\n你将通过使用远程 Web 服务存储你的应用程序数据来增强 CoffeeRun。你将使用的服务器是专门为本书创建的。\n\
  \nCoffeeRun 服务器提供了一个 RESTful Web 服务。“REST”代表“表述状态传递”（representational state transfer），这是一种依赖\
  \ HTTP（`GET`、`POST`、`PUT`、`DELETE`）和识别服务器资源的 URL 服务风格。\n\nURL 路径（服务器名称后面的部分）经常指向集合（例如\
  \ `/coffeeorders`）或由 ID 指定的个体（例如 `/coffeeorders/[customer email]`）。\n\n差异影响了 HTTP\
  \ 动词的应用。例如，处理集合时，`GET` 请求会获取集合中的项目列表。对于单个项目，`GET` 请求会获取该项目的所有详情。\n\nURL 和 HTTP 动词模式在\
  \ 表 13.2 中进行了总结。\n\n**表 13.2 RESTful URL 和 HTTP 模式示例**\n\n| URL 路径 | `GET` | `POST`\
  \ | `PUT` | `DELETE` |\n| --- | --- | --- | --- |\n| `/coffeeorders` | 列出所有记录 |\
  \ 创建一条记录 | - | 删除所有记录 |\n| `/coffeeorders/a@b.com` | 获取记录 | - | 更新记录 | 删除记录 |\n\n\
  ## RemoteDataStore 模块\n\n稍后，你创建一个名为 `RemoteDataStore` 的新模块。`RemoteDataStore` 的工作代表应用程序的其他部分与服务器。它具有与\
  \ `DataStore` 相同的方法——`add`、`get`、`getAll` 和 `remove`，它将这些这些与服务器通信（图 13.2）。\n\n**图\
  \ 13.2 `DataStore` vs `RemoteDataStore`**\n\n![DataStore vs RemoteDataStore](img/remote-vs-local-datastore.png)\n\
  \n\n\n\n[content]\n\n你可以使用 `RemoteDataStore` 实例来代替 `DataStore`，而无需修改 `Truck`、`FormHandler`\
  \ 或 `CheckList` 模块。（不过，你并不会删除 `DataStore` 模块。你可能想要创建一个增强功能，允许 CoffeeRun 根据应用是在线还是离线运行在两个存储模块之间切换。）\n\
  \n`RemoteDataStore` 的方法将通过在后台发送网络请求与服务器进行异步通信。当浏览器接收到服务器的响应时，它将有机会调用回调函数。\n\n`RemoteDataStore`\
  \ 的每个方法都将接受一个函数参数，该参数将在带有来自服务器的任何数据的响应到达后被调用。\n\n创建一个新的 `scripts/remotedatastore.js`\
  \ 文件，并在 `index.html` 中为其添加一个 `<script>` 标签。\n\n```\n...\n    <script src=\"scripts/validation.js\"\
  \ charset=\"utf-8\"></script>\n    <script src=\"scripts/checklist.js\" charset=\"\
  utf-8\"></script>\n    <script src=\"scripts/formhandler.js\" charset=\"utf-8\"\
  ></script>\n    <script src=\"scripts/remotedatastore.js\" charset=\"utf-8\"></script>\n\
  \    <script src=\"scripts/datastore.js\" charset=\"utf-8\"></script>\n    <script\
  \ src=\"scripts/truck.js\" charset=\"utf-8\"></script>\n    <script src=\"scripts/main.js\"\
  \ charset=\"utf-8\"></script>\n  </body>\n</html\n```\n\n保存 `index.html`。在 `remotedatastore.js`\
  \ 中，导入 `App` 命名空间和 jQuery，然后创建一个带有名为 `RemoteDataStore` 构造函数的 IIFE 模块。构造函数应该接受一个远程服务器\
  \ URL 作为参数，如果没有传递 URL 则抛出错误。在模块定义的末尾，将 `RemoteDataStore` 导出到 `App` 命名空间：\n\n```\n\
  (function (window) {\n  'use strict';\n  var App = window.App || {};\n  var $ =\
  \ window.jQuery;\n\n  function RemoteDataStore(url) {\n    if (!url) {\n      throw\
  \ new Error('No remote URL supplied.');\n    }\n\n    this.serverUrl = url;\n  }\n\
  \n  App.RemoteDataStore = RemoteDataStore;\n  window.App = App;\n\n})(window);\n\
  ```\n\n## 向服务器发送数据\n\n你将创建的第一个方法是 `add` 方法，用于在远程 Web 服务上存储客户订单数据。\n\n为 `RemoteDataStore`\
  \ 添加一个原型方法。像 `DataStore` 的 `add` 方法一样，它将接受名为 `key` 和 `val` 的参数。注意，你并不需要使用相同的参数名称，但保持它们一致是一个良好的做法。\n\
  \n```\n...\n  function RemoteDataStore(url) {\n    ...\n  }\n\n  RemoteDataStore.prototype.add\
  \ = function (key, val) {\n    // Code will go here\n  };\n\n  App.RemoteDataStore\
  \ = RemoteDataStore;\n  window.App = App;\n...\n```\n\n### 使用 jQuery 的 $.post 方法\n\
  \n在 `RemoteDataStore` 模块内部，你将使用 jQuery 的 `$.post` 方法。该方法将作为 `XMLHttpRequest` 对象在后台发送一个\
  \ `POST` 请求（图 13.3）。\n\n**图 13.3 `RemoteDataStore` 使用 jQuery 进行 Ajax**\n\n![RemoteDataStore\
  \ uses jQuery for Ajax](img/remotedatastore-jquery.png)\n\n`$.post` 方法只需要两个信息：要发送请求的服务器\
  \ URL 以及要包含哪些数据。\n\n在 `remotedatastore.js` 中，更新 `add` 方法的主体，使其调用 `$.post` 并为其传递\
  \ `this.serverUrl` 和 `val`。\n\n```\n...\n  RemoteDataStore.prototype.add = function\
  \ (key, val) {\n  // Code will go here\n    $.post(this.serverUrl, val);\n  };\n\
  \n  App.RemoteDataStore = RemoteDataStore;\n  window.App = App;\n...\n```\n\n注意\
  \ `key` 参数没有被使用。它保留在方法声明中，是为了让 `RemoteDataStore` 的 `add` 方法与 `DataStore` 的 `add`\
  \ 方法保持一致。两者都将咖啡订单信息作为第二个参数。对于 `RemoteDataStore` 来说，这是关键部分。\n\n### 添加回调函数\n\n与许多\
  \ jQuery 方法一样，`$.post` 可以接受额外的可选参数。你将回调函数作为第三个参数传递给它。当响应从服务器到达时，该函数将被调用，响应中的数据将传递给它。\n\
  \n这与你编写事件处理代码相似——你注册了一个函数在未来的某个点运行。在处理事件时，这个点类似于鼠标点击或表单提交。在处理远程数据时，这个点就是服务器响应的到达。\n\
  \n为 `$.post` 添加一个匿名函数作为第三个参数。该匿名函数应该期望一个参数，将其标记为 `serverResponse`。使用 `console.log`\
  \ 将 `serverResponse` 打印到控制台。\n\n```\n...\n  RemoteDataStore.prototype.add = function\
  \ (key, val) {\n    $.post(this.serverUrl, val, function (serverResponse) {\n  \
  \    console.log(serverResponse);\n    });\n  };\n\n  App.RemoteDataStore = RemoteDataStore;\n\
  \  window.App = App;\n```\n\n现在 `$.post` 知道了三件事：和谁通信、说什么、以及获取信息后做什么。\n\n在保存对 `remotedatastore.js`\
  \ 的更改后，启动 `browser-sync` 并在浏览器中打开控制台。使用所示 URL 实例化 `RemoteDataStore` 对象，该 URL 是本书创建的服务器地址。（再次，此行为了适应页面被断行了；请单行输入。）\n\
  \n```\nvar remoteDS = new App.RemoteDataStore\n    (\"http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders\"\
  );\n```\n\n现在调用它的 `add` 方法，传递一些测试数据：\n\n```\nremoteDS.add('a@b.com', {emailAddress:\
  \ 'a@b.com', coffee: 'espresso'});\n```\n\n在控制台中，查看 `console.log` 语句打印的内容（图 13.4）。\n\
  \n**图 13.4 控制台显示 RemoteDataStore 的结果**\n\n![Console output](img/result-of-add.png)\n\
  \n控制台日志语句中的对象包含了服务器在响应中返回的一些信息：`coffee` 和 `emailAddress` 信息，此外还有一些随服务器变化的簿记数据。\n\
  \n### 检查 Ajax 请求和响应\n\n在开发者工具中，通过点击顶部的 `Network` 打开网络面板（在 `Sources` 和 `Timeline`\
  \ 之间）。此面板显示了浏览器发出的请求列表，并允许你检查每个请求以获取更多信息（图 13.5）。\n\n**图 13.5 在网络面板查看 Ajax 请求**\n\
  \n![Network panel](img/network-panel.png)\n\n\n\n你的网络面板列表中可能有很多网络请求。点击开发者工具左上角附近的![在网络面板中查看\
  \ Ajax 请求](img/clear-network.png) 图标可以清除列表。然后，激活底部的控制台抽屉，这样你就可以同时看到控制台和网络面板了。你可以通过按下键盘上的\
  \ Escape 键或点击右上角的![在网络面板中查看 Ajax 请求](img/dots.png) 图标来实现此操作。这将打开一个菜单，其中包含 <samp\
  \ class=\"guilabel\">Show console</samp> 选项。\n\n控制台抽屉将出现在开发者工具的底部（图 13.6）。\n\n**图\
  \ 13.6   网络面板下方打开控制台抽屉**\n\n![网络面板下方打开控制台抽屉](img/console-drawer.png)\n\n在控制台中，输入以下内容：\n\
  \n```javascript\nvar remoteDS = new App.RemoteDataStore\n    (\"http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders\"\
  );\nremoteDS.add('a@b.com', {emailAddress: 'a@b.com', coffee: 'espresso'});\n```\n\
  \n你将在网络面板中看到一个新的条目（图 13.7）。\n\n**图 13.7   网络面板中的 Ajax 请求**\n\n![网络面板中的 Ajax 请求](img/ajax-request-network-panel.png)\n\
  \n要了解更多关于该请求的信息，请点击该条目（图 13.8）。如果隐藏控制台抽屉，查看详情可能会更方便。\n\n**图 13.8   请求详情**\n\n![请求详情](img/ajax-headers-form-data.png)\n\
  \n详情包括顶部关于请求的一些通用信息以及底表单数据（form data）。中间是显示请求和响应 <samp class=\"firstterm\">headers</samp>\
  \ 的窗格。头部是为请求和响应指定的元数据和选项。\n\n在所有数据中，状态码（在 <samp class=\"guilabel\">General</samp>\
  \ 面格中）和 <samp class=\"guilabel\">Form Data</samp> 面格在开发和调试 Ajax 请求时通常是最用的。\n\n##\
  \ 从服务器检索数据\n\n你的 <samp class=\"function\">RemoteDataStore</samp> 模块可以将单个咖啡订单保存到服务器。下一步要做的是添加一个\
  \ <samp class=\"methodname\">getAll</samp> 原型方法，以便它可以从服务器检索所有订单。在 <samp class=\"\
  filename\">remotedatastore.js</samp> 中开始编写：\n\n```javascript\n...\n  RemoteDataStore.prototype.add\
  \ = function (key, val) {\n    ...\n  };\n\n  RemoteDataStore.prototype.getAll =\
  \ function () {\n    // 代码将写在这里\n  };\n\n  App.RemoteDataStore = RemoteDataStore;\n\
  \  window.App = App;\n...\n```\n\n接下来，你将添加对 jQuery 的 <samp class=\"methodname\"\
  >$.get</samp> 方法的调用。像 <samp class=\"methodname\">$.post</samp> 一样，你将传递服务器 URL。但你不会传递任何数据，因为你是在检索信息而不是保存信息。你需要传递一个函数作为参数，以便它在数据从服务器返回时知道如何处理这些数据。\n\
  \n在 <samp class=\"methodname\">RemoteDataStore.prototype.getAll</samp> 中调用 `<samp\
  \ class=\"methodname\">$.get</samp>`。\n\n```javascript\n...\n  RemoteDataStore.prototype.getAll\
  \ = function () {\n    // 代码将写在这里\n    $.get(this.serverUrl, function (serverResponse)\
  \ {\n      console.log(serverResponse);\n    });\n  };\n\n  App.RemoteDataStore\
  \ = RemoteDataStore;\n  window.App = App;\n...\n```\n\n保存并返回浏览器中的开发者工具。\n\n### 检查响应数据\n\
  \n在控制台中，使用与之前相同的 URL 实例化 <samp class=\"function\">RemoteDataStore</samp>。（提示：你不需要重新输入带有\
  \ URL 的超长行，可以使用向上和向下方向键在已输入控制台的语句间循环切换。）然后调用它的 `<samp class=\"methodname\">getAll</samp>`\
  \ 方法：\n\n```javascript\nvar remoteDS = new App.RemoteDataStore\n    (\"http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders\"\
  );\nremoteDS.getAll();\n```\n\n在开发者工具的网络面板中，你会看到 `GET` 请求已发出。它应该在几十毫秒内返回。一些咖啡订单信息（来自在服务器上预加载的数据）将出现在控制台中（图\
  \ 13.9）。\n\n**图 13.9   检查 `getAll` 的响应**\n\n![检查 getAll 的响应](img/inspecting-get-all.png)\n\
  \n你可能会看到不同的结果，取决于服务器上添加了什么。这表明你成功地从服务器检索了数据。\n\n### 添加回调\n\n你可以从服务器检索数据，但无法从 <samp\
  \ class=\"methodname\">getAll</samp> 返回它。这是因为 <samp class=\"methodname\">getAll</samp>\
  \ 只是发起了初始请求。相反，你向 <samp class=\"methodname\">$.get</samp> 传递了一个回调。你的响应处理回调就像你编写的事件处理回调一样——在两种情况下，`<samp\
  \ class=\"methodname\">getAll</samp> 都应该接收一个参数。这意味着响应数据在回调体内部是可用的。你如何在回调之外访问它？\n\
  \n在 <samp class=\"filename\">remotedatastore.js> 中添加函数参数并调用：\n\n```javascript\n\
  ...\n  RemoteDataStore.prototype.getAll = function (cb) {\n    $.get(this.serverUrl,\
  \ function (serverResponse) {\n      console.log(serverResponse);\n      cb(serverResponse);\n\
  \    });\n  };\n\n  App.RemoteDataStore = RemoteDataStore;\n  window.App = App;\n\
  ...\n```\n\n<samp class=\"methodname\">getAll</samp> 方法检索服务器上的所有咖啡订单，并将它们传递给传入的\
  \ <samp class=\"function\">cb</samp> 函数。\n\n你还需要实现 <samp class=\"methodname\">get</samp>\
  \ 方法，通过客户电子邮件地址检索单个咖啡订单。像 <samp class=\"methodname\">getAll</samp> 一样，它将接受一个函数参数，并调用传递检索到的咖啡订单。\n\
  \n在 <samp class=\"filename\">remotedatastore.js> 中添加此 <samp class=\"methodname\"\
  >get</samp> 实现：\n\n```javascript\n...\n  RemoteDataStore.prototype.getAll = function\
  \ (cb) {\n    ...\n  };\n\n  RemoteDataStore.prototype.get = function (key, cb)\
  \ {\n    $.get(this.serverUrl + '/' + key, function (serverResponse) {\n      console.log(serverResponse);\n\
  \      cb(serverResponse);\n    });\n  };\n\n  App.RemoteDataStore = RemoteDataStore;\n\
  \  window.App = App;\n...\n```\n\n保存你的 <samp class=\"filename\">remotedatastore.js>。在控制台中输入以下代码，向\
  \ `remoteDS.get()` 传递一个匿名函数。（它期望一个函数参数，但你只想快速测试。）\n\n```javascript\nvar remoteDS\
  \ = new App.RemoteDataStore\n    (\"http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders\"\
  );\nremoteDS.get('a@b.com', function () {});\n```\n\n你的控制台看起来类似于 图 13.10）。\n\n**图\
  \ 13.10   测试 `RemoteDataStore.prototype.get`**\n\n![测试 RemoteDataStore.prototype.get](img/testing-get.png)\n\
  \n\n\n使用 Ajax，你现在可以将订单保存到服务器，并从服务器检索订单。最后一步工作是在订单交付后从服务器上删除它们。\n\n要实现这一点，你将向单个订单的\
  \ URL 发送 HTTP 请求。就像你使用 `RemoteDataStore.prototype.get` 一样，你将使用服务器 URL，但在后面加上斜杠和客户的电子邮件地址。\n\
  \n你将向服务器发送一个 `DELETE` 请求。`DELETE` 是 HTTP 动词之一。如果服务器在该 URL 接收到 `DELETE` 请求，它知道删除与该客户电子邮件地址相关的数据。\n\
  \n### 使用 jQuery 的 $.ajax 方法\n\njQuery 提供了 `$.get` 和 `$.post` 方法作为便利方法，因为它们是最常用的两种\
  \ HTTP 动词。例如，当浏览器请求 HTML、CSS、JavaScript 或图像文件（以及其他）时，会使用 `GET` 请求。当提交表单时，最常用的是 `POST`\
  \ 请求。\n\njQuery 并没有提供通过 Ajax 发送 `DELETE` 请求的便利方法。相反，你需要使用 `$.ajax` 方法。（`$.get` 和\
  \ `$.post` 实际上是为你调用了 `$.ajax`，并指定 `GET` 和 `POST` 为 HTTP 动词。）\n\n在 `remotedatastore.js`\
  \ 中，添加 `remove` 原型方法。在其中，调用 `$.ajax` 方法并传递两个参数。第一个参数是单个咖啡订单的 URL，由服务器 URL、斜杠和 `key`（客户的电子邮件地址）组成。第二个参数是一个包含\
  \ Ajax 请求选项或设置的对象。对于 `remove` 方法，你只需要指定的选项是 `type` 为 `DELETE`。\n\n```\n...\n  RemoteDataStore.prototype.get\
  \ = function (key, cb) {\n    ...\n  };\n\n  RemoteDataStore.prototype.remove =\
  \ function (key) {\n    $.ajax(this.serverUrl + '/' + key, {\n      type: 'DELETE'\n\
  \    });\n  };\n\n  App.RemoteDataStore = RemoteDataStore;\n  window.App = App;\n\
  ...\n```\n\n（Ajax 请求有很多可用选项，你可以在 [api.jquery.com/jquery.ajax](http://api.jquery.com/jquery.ajax/)\
  \ 了解更多信息。）\n\n保存并返回控制台。实例化一个新的 `RemoteDataStore` 并调用 `remove` 方法。传入你已创建的测试订单的电子邮件地址。最后，调用\
  \ `getAll` 来确认它不再包含在服务器返回的订单中。\n\n```\nvar remoteDS = new App.RemoteDataStore\n\
  \    (\"http://coffeerun-v2-rest-api.herokuapp.com/coffeeorders\");\nremoteDS.remove('a@b.com');\n\
  remoteDS.getAll();\n```\n\n如果你检查 `DELETE` 请求的服务器响应，你可以看到服务器返回了关于其操作的信息（图 13.11）。正如之前提到的，其他服务器可能会在响应中提供不同的信息。\n\
  \n**图 13.11 检查 DELETE 请求的响应**\n\n![检查 DELETE 请求的响应](img/inspect-delete.png)\n\n\
  ### 将 DataStore 替换为 RemoteDataStore\n\n你的 `RemoteDataStore` 模块已经完成了。现在是时候用 `RemoteDataStore`\
  \ 实例替换 `DataStore` 实例了。\n\n打开 `main.js`。首先从 `App` 命名空间导入 `RemoteDataStore`。\n\n\
  ```\n(function (window) {\n  'use strict';\n  var FORM_SELECTOR = '[data-order=form]';\n\
  \  var CHECKLIST_SELECTOR = '[data-order=checklist]';\n  var App = window.App;\n\
  \  var Truck = App.Truck;\n  var DataStore = App.DataStore;\n  var RemoteDataStore\
  \ = App.RemoteDataStore;\n  var FormHandler = App.FormHandler;\n...\n```\n\n此外，添加一个名为\
  \ `SERVER_URL` 的新变量，并赋值为 CoffeeRun 服务器 URL 的字符串。\n\n```\n(function (window) {\n\
  \  'use strict';\n  var FORM_SELECTOR = '[data-order=form]';\n  var CHECKLIST_SELECTOR\
  \ = '[data-order=checklist]';\n  var SERVER_URL = 'http://coffeerun-v2-rest-api.herokuapp.com/coffeeorders';\n\
  \  var App = window.App;\n  var Truck = App.Truck;\n  var DataStore = App.DataStore;\n\
  \  var RemoteDataStore = App.RemoteDataStore;\n...\n```\n\n接下来，创建一个 `RemoteDataStore`\
  \ 的新实例，并传递 `SERVER_URL`。\n\n```\n...\n  var RemoteDataStore = App.RemoteDataStore;\n\
  \  var FormHandler = App.FormHandler;\n  var Validation = App.Validation;\n  var\
  \ CheckList = App.CheckList;\n  var remoteDS = new RemoteDataStore(SERVER_URL);\n\
  \  var webshim = window.webshim;\n  var myTruck = new Truck('ncc-1701', DataStore());\n\
  \  window.myTruck = myTruck;\n...\n```\n\n最后，不再向 `Truck` 构造函数传递新的 `DataStore` 实例，而是传递\
  \ `remoteDS`。由于 `DataStore` 和 `RemoteDataStore` 具有相同名称的方法并接受（大部分）相同的参数，这一更改将无缝工作。\n\
  \n```\n...\n  var RemoteDataStore = App.RemoteDataStore;\n  var FormHandler = App.FormHandler;\n\
  \  var Validation = App.Validation;\n  var CheckList = App.CheckList;\n  var remoteDS\
  \ = new RemoteDataStore(SERVER_URL);\n  var webshim = window.webshim;\n  var myTruck\
  \ = new Truck('ncc-1701', remoteDS);\n  window.myTruck = myTruck;\n...\n```\n\n\
  保存你的更改并返回浏览器。输入一些咖啡订单信息并提交表单。在此期间保持网络面板打开状态。你应该能看到通过表单添加或通过清单交付的每个咖啡订单都有对应的网络事务（图\
  \ 13.12）。\n\n**图 13.12 将咖啡订单保存到远程服务器**\n\n![将咖啡订单保存到远程服务器](img/coffee-orders-over-network.png)\n\
  \n恭喜！CoffeeRun 现在功能齐全，并已与远程 Web 服务集成。\n\n下一章是 CoffeeRun 的最后一章。它没有添加任何新功能。相反，它专注于重构你现有的代码，以便让你学习处理异步代码的新模式。\n\
  \n### 银挑战：针对远程服务器进行验证\n\n你的验证代码目前执行简单的域名检查。更新你的验证代码，使其能够检查电子邮件地址是否已被服务器上的现有订单使用。如果该地址已被使用，则阻止表单提交并提供相应的验证警告。\n\
  \n你可能需要为 CoffeeRun 打开第二个浏览器窗口，并在两个窗口中输入不同的咖啡订单。\n\n在进行此验证检查时，注意向服务器发送请求的频率。（你可以在开发者工具的网络面板中看到这些。）你能找到一种减少请求数量的好方法吗？\n\
  \n## 更有好奇心：Postman\n\n向服务器发送测试请求的最佳工具之一 `Postman`，它是 `Chrome` 的一个免费插件。它允许你构建 HTTP\
  \ 请求并指定 HTTP 动词、表单数据、头部和用户凭据（图 13.13）。\n\n**图 13.13 Postman**\n\n![Postman](img/postman-app.png)\n\
  \n\n\n\n`Postman` 是你在编写服务器通信代码之前探索 API 的不可或缺的工具。你可以从 `Chrome` 应用商店下载它：[chrome.google.com/webstore](https://chrome.google.com/webstore/)。（搜索“Postman”即可找到。）\n\
  \n# 14 延迟（Deferred）与承诺（Promises）\n\n在 CoffeeRun 中，你的模块化代码帮助你避免了可怕的“意大利面条代码”，这种代码在将事件处理（UI）代码与应用程序内部逻辑混合时很容易出现。\n\
  \n你的模块之间通过函数参数（也称为回调函数）进行交互。对于代码仅依赖于单个异步步骤的情况，回调函数是一个很好的解决方案。图 14.1 显示了 CoffeeRun\
  \ 中其中一个异步流程的简化版本。\n\n**图 14.1 添加咖啡订单的异步流程**\n\n![141 添加咖啡订单的异步流程](img/promise-flow.png)\n\
  \n当你有许多依赖性的异步步骤时会发生什么？一种方案是嵌套大量的回调函数，但这会迅速变得难以管理且危险。使用一个带有额外错误检查的提交处理程序代码简化版本，该方法可能像所示：\n\
  \n```\nformHandler.addSubmitHandler(function (data) {\n  try {\n    myTruck.createOrder(function\
  \ (error) {\n      if (error) {\n        throw new Exception(error)\n      } else\
  \ {\n        try {\n          saveOnServer(function (error) {\n            if (error)\
  \ {\n              throw new Exception({message: 'server error'});\n           \
  \ } else {\n              try {\n                checkList.addRow();\n         \
  \     } catch (e2) {\n                handleDomError(e2);\n              }\n   \
  \         }\n          })\n        } catch (e) {\n          handleServerError(e,\
  \ function () {\n            // 尝试再次添加行\n            try {\n              checkList.addRow();\n\
  \            } catch (e3) {\n              handleDomError(e3);\n            }\n\
  \          });\n        }\n      }\n    });\n  } catch (e) {\n    alert('Something\
  \ bad happened.');\n  }\n});\n```\n\n你将在本章中学习的 `Promise` 是更好的解决方案。同样的系列步骤可以像这样被表示为\
  \ `Promise` 的链式（`chain`）：\n\n```\nformHandler.addSubmitHandler()\n  .then(myTruck.createOrder)\n\
  \  .then(saveOnServer)\n  .catch(handleServerError)\n  .then(checkList.addRow)\n\
  \  .catch(handleDomError);\n```\n\n`Promise` 提供了一种以可管理的方式构建复杂异步代码的方法，在本章中你将使用它们来简化\
  \ CoffeeRun 的架构。`Promise` 是一个相对新的特性，但包括 `Chrome` 在内的现代浏览器对其都有良好的支持。\n\n在 CoffeeRun\
  \ 中，你主要感兴趣的是如果当前步骤成功无误则执行下一步。`Promise` 让这变得简单。你不再依赖回调参数，而是返回 `Promise` 对象，这将让你进一步解耦模块。\n\
  \n## Promises（承诺）与 Deferreds（延迟）\n\n`Promise` 对象始终处于三种状态之一：`pending`（等待中）、`fulfilled`（已完成）或\
  \ `rejected`（已拒绝）（图 14.2\n\n每个 `Promise` 对象都有一个 `then` 方法，它在 `Promise` 变为完成时被触发。你可以调用\
  \ `then` 并传递一个回调函数；当 `Promise` 完成时，回调函数会被调用，并传递 `Promise` 在执行异步工作时接收到的任何值。\n\n你还可以将多个\
  \ `then` 调用链在一起。与其编写接受并调用回调函数的函数，不如返回 `Promise` 对象并让调用者在该 `Promise` 上链式调用 `then`。\n\
  \n你将从 jQuery 的 `Deferred` 对象开始，它在简单用例中的工作原理与 `Promise` 类似。\n\njQuery 的 `$.ajax`\
  \ 方法（包括 `$.post` 和 `$.get`）返回一个 `Deferred`。`Deferred` 对象拥有方法，让你为它的两种状态注册回调：`fulfilled`\
  \ 和 `rejected`。你将从更新 `RemoteDataStore` 开始，使其返回由 jQuery Ajax 方法生成的 `Deferred`。稍后，你将修改其他模块在\
  \ `Deferred` 上注册回调。\n\n## 返回 Deferred（延迟）\n\n利用 `Deferred` 对象。在 `remotedastore.js`\
  \ 中，更新原型方法，使其返回调用 `$.get`、`$.post` 和 `$.ajax` 的结果。\n\n```\n...\n  RemoteDataStore.prototype.add\
  \ = function (key, val) {\n    return $.post(this.serverUrl, val, function (serverResponse)\
  \ {\n      console.log(serverResponse);\n    });\n  };\n\n  RemoteDataStore.prototype.getAll\
  \ = function (cb) {\n    return $.get(this.serverUrl, function (serverResponse)\
  \ {\n      console.log(serverResponse);\n      cb(serverResponse);\n    });\n  };\n\
  \n  RemoteDataStore.prototype.get = function (key, cb) {\n    return $.get(this.serverUrl\
  \ + '/' + key, function (serverResponse) {\n      console.log(serverResponse);\n\
  \      cb(serverResponse);\n    });\n  };\n\n  RemoteDataStore.prototype.remove\
  \ = function (key) {\n    return $.ajax(this.serverUrl + '/' + key, {\n      type:\
  \ 'DELETE'\n    });\n  };\n...\n```\n\n由于它们现在返回由 jQuery Ajax 方法生成的 `Deferred`，因此\
  \ `get` 和 `getAll` 并不绝对必要接受回调。为了考虑到没有回调的情况，在调用回调之前添加一个 `if` 语句来检查是否传递了 `cb`。\n\n\
  ```\n...\n  RemoteDataStore.prototype.getAll = function (cb) {\n    return $.get(this.serverUrl,\
  \ function (serverResponse) {\n      if (cb) {\n        console.log(serverResponse);\n\
  \        cb(serverResponse);\n      }\n    });\n  };\n\n  RemoteDataStore.prototype.get\
  \ = function (key, cb) {\n    return $.get(this.serverUrl + '/' + key, function\
  \ (serverResponse) {\n      if (cb) {\n        console.log(serverResponse);\n  \
  \      cb(serverResponse);\n      }\n    });\n  };\n...\n```\n\n保存 `remotedatastore.js`。由于\
  \ `RemoteDataStore` 方法返回 `Deferred`，你需要更新 `Truck` 方法以实现相同的操作。现在，你将专注于 `createOrder`\
  \ 和 `deliverOrder`。\n\n打开 `truck.js`，在这两个方法调用 `this.db` 的地方添加 `return`。\n\n```\n\
  ...\n  Truck.prototype.createOrder = function (order) {\n    console.log('Adding\
  \ order for ' + order.emailAddress);\n    return this.db.add(order.emailAddress,\
  \ order);\n  };\n\n  Truck.prototype.deliverOrder = function (customerId) {\n  \
  \  console.log('Delivering order for ' + customerId);\n    return this.db.remove(customerId);\n\
  \  };\n...\n```\n\n\n\n\n保存 `truck.js`。`Truck` 现在返回由 `RemoteDataStore` 产生的 `Deferred`。在使用\
  \ `Promise` 和 `Deferred` 时，从函数中返回它们是最佳实践。返回它们可以让任何调用 `createOrder` 或 `deliverOrder`\
  \ 的对象注册回调，并在异步工作完成时触发这些回调。\n\n在下一节中，你将执行此操作。\n\n## 使用 then 注册回调\n\n`$.ajax` 返回一个\
  \ `Deferred`，它拥有一个 `then` 方法。`then` 方法注册了一个在 `Deferred` 解析（resolved）时运行的回调函数。当回调被调用时，它将接收到服务器响应返回的值（图\
  \ 14.3）。\n\n**图 14.3 Deferred 对象调用了通过 `then` 注册的回调**\n\n![Deferred object invokes\
  \ callbacks registered with then](img/promise-rainbow.png)\n\n从简单的 `then` 用开始。在\
  \ `main.js` 中，你的提交处理器调用了 `createOrder` 和 `addRow`。修改它，让 `addRow` 注册为 `createOrder`\
  \ 的回调。\n\n打开 `main.js` 并更新对 `formHandler.addSubmitHandler` 的调用。在 `createOrder` 的调用后链式添加\
  \ `.then`。传递一个运行 `checkList.addRow` 的回调。\n\n```\n...\n  formHandler.addSubmitHandler(function\
  \ (data) {\n    myTruck.createOrder.call(myTruck, data);\n      .then(function ()\
  \ {\n        checkList.addRow.call(checkList, data);\n      });\n  });\n...\n```\n\
  \n你不再是在 `createOrder` 之后立即调用 `addRow`，而是让 `addRow` 依赖于 `createOrder` 无错误或异常完成。\n\
  \n## 使用 then 处理失败\n\n`then` 接受第二个参数，该参数在 `Deferred` 转移到拒绝（rejected）状态时被调用。为了查看效果，为\
  \ `main.js` 中的 `formHandler.addSubmitHandler` 添加一个第二个函数参数（确保在两个函数参数之间添加逗号）。在该函数内部，显示一个带有简单错误消息的警报框。\n\
  \n```\n...\n  formHandler.addSubmitHandler(function (data) {\n    myTruck.createOrder.call(myTruck,\
  \ data)\n      .then(function () {\n        checkList.addRow.call(checkList, data);\n\
  \      },\n      function () {\n        alert('Server unreachable. Try again later.');\n\
  \      }\n      );\n  });\n...\n```\n\n在 `main.js` 顶部，故意拼写服务器名称以便 Ajax 请求失败。（此更改将是临时的，所以你可能只想从\
  \ URL 中剪切一段，稍后粘贴回来。）\n\n```\n(function (window) {\n  'use strict';\n  var FORM_SELECTOR\
  \ = '[data-coffee-order=\"form\"]';\n  var CHECKLIST_SELECTOR = '[data-coffee-order=\"\
  checklist\"]';\n  var SERVER_URL = 'http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders/';\n\
  \  var App = window.App;\n...\n```\n\n保存更改，确保 `browser-sync` 正在运行，并在浏览器中打开 CoffeeRun。填写表单。当你提交时，你应该会看到一个警报弹出（图\
  \ 14.4\n\n将 `SERVER_URL` 恢复为 `http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders/`。你也可以删除显示\
  \ `alert` 的函数参数。\n\n```\n(function (window) {\n  'use strict';\n  var FORM_SELECTOR\
  \ = '[data-coffee-order=\"form\"]';\n  var CHECKLIST_SELECTOR = '[data-coffee-order=\"\
  checklist\"]';\n  var SERVER_URL = 'http://coffeerun-v2-rest-api.herokuapp.com/api/coffeeorders/';\n\
  \n  ...\n\n  formHandler.addSubmitHandler(function (data) {\n    myTruck.createOrder.call(myTruck,\
  \ data)\n      .then(function () {\n        checkList.addRow.call(checkList, data);\n\
  \      },\n      function () {\n        alert('Server unreachable. Try again later.');\n\
  \      }\n      );\n  });\n...\n```\n\n使用 `then` 注册回调映射了 `Promise` 的工作方式。如果 `Promise`\
  \ 状态变为已完成（fulfilled），则运行一组回调。如果 `Promise` 状态变为拒绝（rejected），则运行另一组回调。\n\n## 在仅支持回调的\
  \ API 中使用 Deferred\n\n有时你可能需要将基于 `Deferred` 的代码与仅支持回调的 API（例如事件监听器）协调。\n\n目前，`formHandler.addSubmitHandler`\
  \ 重置表单并聚焦于第一个元素——无论 Ajax 请求发生。然而，你只希望在 Ajax 请求成功时执行这些操作。换句话说，你只想在 `Deferred` 已完成时执行这些操作。\n\
  \n如何知道 `Deferred` 是否已完成？传递给 `addSubmitHandler` 的函数参数可以返回 `Deferred`，在 `addSubmitHandler`\
  \ 内部，你可以对 `Deferred` 链式调用 `.then`。\n\n在 `main.js` 中，给回调添加 `return` 关键字。\n\n```\n\
  ...\n  formHandler.addSubmitHandler(function (data) {\n    return myTruck.createOrder.call(myTruck,\
  \ data)\n      .then(function () {\n        checkList.addRow.call(checkList, data);\n\
  \      });\n  });\n...\n```\n\n保存 `main.js`。接下来，打开 `formhandler.js`，找到 `addSubmitHandler`\
  \ 方法，并定位到匿名函数 `fn` 的调用。由于该匿名函数现在返回 `Deferred`，你可以在其结尾链式调用 `.then`。使用 `.then` 注册一个重置表单并聚焦于第一个元素的回调。\n\
  \n```\n...\n  FormHandler.prototype.addSubmitHandler = function (fn) {\n    console.log('Setting\
  \ submit handler for form');\n    this.$formElement.on('submit', function (event)\
  \ {\n      event.preventDefault();\n\n      var data = {};\n      $(this).serializeArray().forEach(function\
  \ (item) {\n        data[item.name] = item.value;\n        console.log(item.name\
  \ + ' is ' + item.value);\n      });\n      console.log(data);\n      fn(data);\n\
  \      .then(function () {\n        this.reset();\n        this.elements[0].focus();\n\
  \      });\n    });\n  };\n...\n```\n\n之前，你有三个顺序语句：调用回调、重置表单和聚焦于第一个元素。现在，你有一个依赖于上一个语句结果的语句。你调用回调，并且——如果承诺的任务正常执行且没有遇到异常——那么你就重置表单并聚焦于第一个表单元素。\n\
  \n只有一个考虑的问题。当你使用 `.then` 注册回调函数时，该回调函数有一个新的作用域。你需要 `.bind` 那个匿名函数，以便 `this` 的值设置为\
