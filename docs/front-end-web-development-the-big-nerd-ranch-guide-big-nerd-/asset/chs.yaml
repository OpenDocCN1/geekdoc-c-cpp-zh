  \n当用户输入密码时，向他们发送所有之前的消息。\n\n# 17 使用 Babel 使用 ES6\n\nJavaScript 语言创建于 1994 年，在 1999\
  \ 年接受了一些更新，但在 1999 年到 2009 年间几乎没有变化。2009 年引入了一系列小更改，导致了被称为 ES5 的 JavaScript 版本，即标准的第五版。\n\
  \n在 2015 年，作为标准的第六版，添加了许多语言改进。这些新语言特性许多受到 Ruby 和 Python 等语言的影响。从技术上说，这个第六版本命名为 ES2015，但它更常被称为\
  \ ES6。\n\n`Google Chrome`、`Mozilla Firefox` 和 `Microsoft Edge` 支持 ES6。这些是滚动浏览器，意味着它们会自动更新，而无需用户手动下载和安装最新版本。随着\
  \ Google、Mozilla 和 Microsoft 在其浏览器中增加越来越多的 ES6 兼容性，他们能够向用户快速推出这些增强功能。\n\n然而，非滚动更新浏览器和大多数移动浏览器对\
  \ ES6 的支持很差。图 17.1 显示了最新桌面和移动浏览器对 ES6 特性的支持百分比。（在图中，IE = `Internet Explorer`、FF\
  \ = `Mozilla Firefox`、CH = `Google Chrome`、SF = `Safari`、KQ = `Konqueror` 以及 AN\
  \ = `Android`。）\n\n\n\n\n如果你想更详细或查看浏览器对 ES6 的支持情况，请访问 [<samp class=\"uri\">kangax.github.io/​compat-table/​es6/</samp>](http://kangax.github.io/compat-table/es6/)\
  \ 查看最新信息。该表格的创建者 Juriy Zaytsev 会经常更新数据。\n\n旧版浏览器的支持可能不稳定，但我们非常、非常、非常喜欢 ES6。它是一件美事，尽早切换过去是值得的，而不是等到支持变得完全普及。\n\
  \n在本章中，你将开始编写 Chattrbox 面向用户的部分，你将使用许多 ES6 特性来编写它。为了确保你的应用程序在所有浏览器上运行，你将使用开源工具 `Babel`\
  \ 来处理兼容性。\n\n在开始之前，有一项准备工作需要处理。为了让你能够专注于学习 ES6 和使用 `Babel`，Chattrbox 的 `index.html`\
  \ 和 `stylesheets/styles.css` 文件已在 [<samp class=\"uri\">www.bignerdranch.com/​downloads/​front-end-dev-resources.zip</samp>](http://www.bignerdranch.com/downloads/front-end-dev-resources.zip)\
  \ 提供。下载 .zip 文件并提取内容（包括整个 `stylesheets/` 文件夹）到你的 `chattrbox/app` 目录。（`index.html`\
  \ 将替换你现有的 `index.html` 副本。）\n\n此外，注意一点：在学习本章代码时，你可能会在控制台中看到关于 CSS 文件 MIME 类型的警告。忽略此警告是安全的。\n\
  \n继续吧！在本章结束时，Chattrbox 将通过 WebSockets 与你的聊天服务器进行通信（图 17.2）。\n\n**图 17.2 本章结束时的 Chattrbox**\n\
  \n![本章结束时的 Chattrbox](img/end-of-chapter.png)\n\n## 编译 JavaScript 的工具\n\n`Babel`\
  \ 是一个编译器。它的工作是将 ES6 语法翻译成等效的 ES5 代码，以便由器的 JavaScript 引擎运行（图 17.3）。\n\n**图 17.3 从\
  \ ES6 文件构建 ES5 代码**\n\n![从 ES6 文件构建 ES5 代码](img/compilation.png)\n\n为了有效率使用 `Babel`，你需要安装几个\
  \ `npm` 模块来创建一个自动化构建过程。你将使用 `Babel` 将你的 ES6 代码编译为 ES5，使用 `Browserify` 将你的模块打包成单个文件，并使用\
  \ `Babelify` 让这两者协同工作。此外，你将使用 `Watchify` 在你每次保存代码更改时触发构建过程（图 17.4）。\n\n**图 17.4\
  \ 编译工作流**\n\n![编译工作流](img/compilation-workflow.png)\n\n首先，你需要安装 `Babel`。根据你的需求，它有几个不同的组成部分。在你的情况下，你需要以两种方式编译的能力：通过命令行和通过编程方式。`babel-cli`\
  \ 和 `babel-core` 工具分别将满足这些需求。你还需要安装一个适用于编译 ES6 标准的 `Babel` 配置，它被称为 `babel-preset-es2015`。\n\
  \n在你的 `chattrbox` 目录中运行以下 `npm` 命令来安装相应的 `Babel` 工具包。（如果你需要复习如何以管理员权限运行 `npm install\
  \ -g`，请参考第 1 章）。\n\n```\nnpm install -g babel-cli\nnpm install --save-dev babel-core\n\
  npm install --save-dev babel-preset-es2015\n```\n\n现在，你需要配置 `Babel` 以使用你安装的 `es2015`\
  \ 预设进行编译。在你的根目录 `chattrbox` 中创建一个名为 `.babelrc` 的文件，并向其中添加以下配置信息：\n\n```\n{\n  \"\
  presets\": [\n    \"es2015\"\n  ],\n  \"plugins\": []\n}\n```\n\n最后，将 `Babelify`、`Browserify`\
  \ 和 `Watchify` 安装到 `chattrbox/` 目录：\n\n```\nnpm install --save-dev browserify watchify\n\
  ```\n\n在你配置好 `Babel` 后，稍后将使用这三个工具。\n\n## Chattrbox 客户端\n\n你已经构建了 Chattrbox，它负责提供静态文件并处理通过\
  \ WebSockets 的通信。客户端将与服务器发送接收消息，由三个模块处理：\n\n*   `ws-client` 模块将管理 WebSockets\n*\
  \   `dom` 模块将数据显示在 UI 上\n*   `app` 模块将定义消息的格式\n\n这些职责如图 17.5 所示。\n\n**图 17.5 Chattrbox\
  \ 应用模块**\n\n![Chattrbox 应用模块](img/app.png)\n\n在 `chattrbox/app` 文件夹中，创建 `scripts`、`scripts/dist`\
  \ 和 `scripts/src` 子文件夹，如图 17.6 所示。\n\n**图 17.6 Chattrbox/app 文件夹结构**\n\n![Chattrbox/app\
  \ 文件夹结构](img/folder-with-folders.png)\n\n现在，在 `scripts/src` 中创建四个 JavaScript 文件：\n\
  \n*   `app.js`\n*   `dom.js`\n*   `main.js`\n*   `ws-client.js`\n\n你的文件结构应该如图 17.7\
  \ 所示。\n\n**图 17.7 Chattrbox/app**\n\n![Chattrbox/app](img/folder-with-files.png)\n\
  \n`app.js`、`dom.js` 和 `ws-client.js` 对应于图 17.5 所示的模块。`main.js` 文件将包含初始化应用程序的代码。\n\
  \n## 使用 Babel 的第一步\n\n现在你已经安装了工具并准备好了文件，是时候开始使用 ES6 了。\n\n目前，你将从命令行使用 `Babel`。稍后，你将其添加到你的\
  \ `npm` 脚本中，这样编译就会自动。这样，当你使用新的 ES6 特性时，你可以专注于新语法，而无需担心在终端中运行额外的命令。\n\n### 类语法\n\n\
  \n\n\n\n你构建 Chattrbox 客户端时使用的第一个 ES6 特性是 `class` 关键字。需要注意的是，ES6 的 `class` 关键字工作方式与其他编程语言中的类并不完全相同。相反，ES6\
  \ 类仅仅为构造器函数和 `prototype` 方法提供了一种更短的语法。\n\n打开 `app.js` 并定义一个名为 `ChatApp` 的新类。\n\n\
  ```\nclass ChatApp {\n}\n```\n\n在本章中，`ChatApp` 不会做什么操作。但最终，`ChatApp` 将负责你应用程序的大部分逻辑。\n\
  \n目前类的定义是空的。添加一个带有 `console.log` 语句的 `constructor` 方法：\n\n```\nclass ChatApp {\n\
  \  constructor() {\n    console.log('Hello ES6!');\n  }\n}\n```\n\n`constructor`\
  \ 是一个在每次你创建类的新实例时都会运行的方法。通常，构造函数会为实例的属性设置值。\n\n接下来，在 `app.js` 中，类声明之后创建一个 `ChatApp`\
  \ 的实例：\n\n```\nclass ChatApp {\n  constructor() {\n    console.log('Hello ES6!');\n\
  \  }\n}\nnew ChatApp();\n```\n\n让我们运行你的代码进行测试。打开第二个终端窗口并切换到 Chattrbox 的根目录，那里存放\
  \ `package.json`、`index.js` 和 `app/` 目录。你将使用这个窗口运行构建命令，并保持另一个窗口打开以运行服务器。\n\n要测试你的代码，使用\
  \ `Babel` 编译 `app/scripts/src/app.js`并将结果输出到 `app/scripts/dist/main.js`：\n\n```\n\
  babel app/scripts/src/app.js -o app/scripts/dist/main.js\n```\n\n如果你在终端中没有看到任何变化，这是正常的——也是个好消息。除非发生错误，否则\
  \ `Babel` 不会在命令行中报告任何内容（图 17.8]）。\n\n**图 17.8 Babel 静默工作**\n\n![Babel 静默工作](img/babel-slient.png)\n\
  \n确保你的 `Node` 服务器在另一个终端中运行（使用 `npm run dev`），并在浏览器中打开 `http://localhost:3000`。现在你将看到你的结果（图\
  \ 17.9]）。\n\n**图 17.9 Hello, ES6!**\n\n![Hello, ES6!](img/hello-es6.png)\n\n你的 `app/index.html`\
  \ 引用了你从 `app.js` 生成的 `main.js`。由于 `app.js` 创建了一个 `ChatApp`，因此 `ChatApp` 构造函数中的代码会被执行，打印出“Hello\
  \ ES6!”。\n\n现在你已经确认 `Babel` 可以处理单个 JavaScript 文件，现在是时候开始处理多个模块了。\n\n## 使用 Browserify\
  \ 打包模块\n\nES5 不具备的一点是内置模块系统。当你构建 CoffeeRun 时，你使用了一种变通方法让你编写模块化代码——但这依赖于修改全局变量。\n\
  \nES6 提供了真正的模块，就像许多其他编程语言中的模块一样。`Babel` 理解 ES6 模块语法，但没有等等的 ES5 代码供其转换。这就是为什么 `Browserify`\
  \ 是必须的。\n\n图 17.10]展示了 `Browserify` 和 `Babel` 如何协同工作。\n\n**图 17.10 使用 Babel 和 Browserify\
  \ 将 ES6 模块转换为 ES5 模块**\n\n![使用 Babel 和 Browserify 将 ES6 模块转换为 ES5 模块](img/es6-node-iifes.png)\n\
  \n默认情况下，`Babel` 将 ES6 模块语法转换为等效的 `Node.js`-风格的 `require` 和 `module.exports` 语法。然后\
  \ `Browserify` 将 `Node.js` 模块代码转换为 ES5 友好的函数。\n\n打开 `package.json` 并为 `Browserify`\
  \ 添加一个配置部分：\n\n```\n...\n  \"scripts\": {\n    \"test\": \"echo \\\"Error: no test\
  \ specified\\\" &&\n     exit 1\",\n    \"start\": \"node index.js\",\n    \"dev\"\
  : \"nodemon index.js\",\n  },\n  \"browserify\": {\n    \"transform\": [\n     \
  \ [\"babelify\", {\"presets\": [\"es2015\"], \"sourceMap\": true}]\n    ]\n  },\n\
  ...\n```\n\n这告诉 `Browserify` 使用 `Babelify` 作为插件。它向 `Babelify` 传递两个选项：首先，它激活了 ES2015\
  \ 编译器选项。它还开启了 `sourceMap` 选项，有助于调试。在你构建 Chattrbox 的其余部分时，将学习如何使用 source maps 进行调试。\n\
  \n你还会为常见的 `Browserify` 任务编写脚本，就像你为 `nodemon` 做的那样。将它们写在 `package.json` 的 `\"scripts\"\
  ` 部分。（记得在 `\"dev\": \"nodemon index.js\"` 结尾添加逗号。）\n\n```\n...\n  \"scripts\": {\n\
  \    \"test\": \"echo \\\"Error: no test specified\\\" && exit 1\",\n    \"start\"\
  : \"node index.js\",\n    \"dev\": \"nodemon index.js\",\n    \"build\": \"browserify\
  \ -d app/scripts/src/main.js -o app/scripts/dist/main.js\",\n    \"watch\": \"watchify\
  \ -v -d app/scripts/src/main.js -o app/scripts/dist/main.js\"\n  },\n  \"browserify\"\
  : {\n    \"transform\": [\n      [\"babelify\", {\"presets\": [\"es2015\"], \"sourceMap\"\
  : true}]\n    ]\n  },\n...\n```\n\n第一个脚本 `build` 直接使用 `browserify` 命令。第二个脚本 `watch`\
  \ 在代码变化时重新运行 `watchify`。（它的作用与 `nodemon` 类似。）\n\n现在来使用 ES6 模块系统。在 ES6 模块中，你必须显式导出想要使用的模块部分。更新\
  \ `app.js` 以导出你的 `ChatApp` 类，而不是仅仅创建一个实例。\n\n```\nclass ChatApp {\n  constructor()\
  \ {\n    console.log('Hello ES6!');\n  }\n}\nnew ChatApp();\nexport default ChatApp;\n\
  ```\n\n你指定了 `ChatApp` 是从 `app` 模块获取的默认值。你的其他某些模块将 `export` 值。当你只需要导出单个值时，最好使用 `export\
  \ default`。\n\n在 `main.js` 中，导入 `ChatApp` 类并创建它的新实例。\n\n```\nimport ChatApp from\
  \ './app';\nnew ChatApp();\n```\n\n`main.js` 正在导入 `app.js` 导出的 `ChatApp` 类。导入之后，你创建了\
  \ `ChatApp` 类的的新实例。\n\n这里有一个重要的点：`ChatApp` 在 `main.js` 中并不重要。因为 `ChatApp` 是 `app.js`\
  \ 的默认导出，例如编写 `import MyChatApp from './app'` 将默认导出赋值给本地名称 `MyChatApp`。然而，将其命名为 `ChatApp`\
  \ 是一种最佳实践，因为这是它在 `app.js` 内部名称。\n\n### 运行构建过程\n\n接下来，回到终端并运行你的构建脚本：\n\n```\nnpm\
  \ run build\n```\n\n\n\n\n\n`npm` 将运行你的 `build` 命令，该命令将运行 `browserify`。在执行每个命令时，它会向你显示正在的操作。不过，`Browserify`\
  \ 本身会保持沉默，除非发生错误（图 17.11）。\n\n**图 17.11 通过 `npm run build`  Browserify**\n\n![Running\
  \ Browserify via npm run build](img/npm-run-build.png)\n\n当 `Browserify` 成功后，它会将\
  \ `app/dist/` 文件夹中的经过处理的 `main.js` 包，就像你之前手动操作的那样。\n\n现在重新加载浏览器查看输出。你没有添加任何新功能，只是重构了\
  \ `ChatApp` 构造函数所在的位置。因此，你应该会在控制台中看到之前过的相同消息（图 17.12！）。\n\n**图 17.12 Hello again!**\n\
  \n![Hello again!](img/hello-es6.png)\n\n下一个要集成的部分是 `Watchify`。`Watchify` 运行 `Browserify`\
  \ 构建的作用与 `nodemon` 运行你的 `Node.js` 服务器的作用相同：每当你修改一个源文件时，它都会自动触发重新构建。\n\n在你对代码进行更改时启动\
  \ `Watchify` 以开始构建过程：\n\n```\nnpm run watch\n```\n\n`Watchify` 将确认它正在运行（图 17.13）。\n\
  \n**图 17.13 通过 `npm run watch` Watchify**\n\n![Running Watchify via npm run build](img/npm-run-watch.png)\n\
  \n`Watchify` 比 `Browserify` 啰嗦一点。每当它运行 `Browserify` 时，它都会告诉你向文件写入了多少字节。这并不是特别有趣，但它确实能告诉你输出何时发生了变化。在你继续开发\
  \ Chattrbox 时，让 `Watchify` 运行在其中一个终端中。（你的服务器应该仍在另一个终端中运行。）\n\n## 添加 ChatMessage\
  \ 类\n\n在两个终端之间聊天很有趣（而且能让你在咖啡馆里看起来很酷），但是时候升级到从浏览器向浏览器发送消息了。你将编写一个辅助类来处理消息数据的构建和格式化。\n\
  \n对于每条消息，你可能想要跟踪三部分信息。你需要知道消息的文本、发送者以及发送时间。\n\nJavaScript 对象表示——更为人知的 `JSON`（根据创建者\
  \ Douglas Crockford 的说法，读作“Jason”）——是一种轻量级的数据交换格式。你已经在 `package.json` 文件中使用过 `JSON`。它是人类可读的且与语言无关，非常适合发送和接收你想要与\
  \ Chattrbox 交换类型的数据。\n\n以下是一个格式化 `JSON` 的示例消息：\n\n```\n{\n  \"message\": \"I'm Batman\"\
  ,\n  \"user\": \"batman\",\n  \"timestamp\": 614653200000\n}\n```\n\nChattrbox 消息数据来自两个不同的源。一个源在客户端，当用户填写表单时；另一个源在服务器，当消息通过\
  \ WebSocket 连接发送其他客户端时。\n\n当消息数据来自表单时，你需要在发送到服务器之前添加用户名和戳。当数据来自服务器时，应该包含所有三部分信息。你应该如何处理这种差异？有很多选项。让我们简要查看其中一些，包括一些利用方便的\
  \ ES6 特性的选项。\n\n在 `app.js` 中创建一个类来表示单个聊天消息。\n\n```\nclass ChatApp {\n  constructor()\
  \ {\n    console.log('Hello ES6!');\n  }\n}\n\nclass ChatMessage {\n  constructor(data)\
  \ {\n  }\n}\n\nexport default ChatApp;\n```\n\n解决此问题的种方法是使用一个简单的构造函数，接收消息文本、用户名和戳。（不要在你的文件中进行此更改。这只是一个示例。）\n\
  \n```\n...\nclass ChatMessage {\n  constructor(message, user, timestamp) {\n   \
  \ this.message = message;\n    this.user = user || 'batman';\n    this.timestamp\
  \ = timestamp || (new Date()).getTime();\n  }\n}\n...\n```\n\n你已经见过这种模式了。你将参数值赋值给实例属性，使用\
  \ `||` 运算符为 `username` 和 `timestamp` 提供回退值。\n\n这没问题，但 ES6 提供了一种更紧凑的方法来使用 `默认参数`\
  \ 编写相同的模式。\n\n```\n...\nclass ChatMessage {\n  constructor(message, user='batman',\
  \ timestamp=(new Date()).getTime()) {\n    this.message = message;\n    this.user\
  \ = user;\n    this.timestamp = timestamp;\n  }\n}\n...\n```\n\n这种语法让你一眼看出哪些值必须传递，哪些值是可选的。你可以看到只有\
  \ `message` 参数是强制的。其他的都有默认值。\n\n此版本的构造函数可以处理从服务器接收的消息或由表单创建的消息。但它要求调用者知道参数的顺序，对于具有三个或更多参数的函数和方法来说很麻烦。\n\
  \n另一种方法是构造函数接收单个对象作为参数，通过键值对指定 `message`、`user` 和 `timestamp` 的值。为此你可以使用`解构赋值`。\n\
  \n```\n...\nclass ChatMessage {\n  constructor({message: m, user: u, timestamp:\
  \ t}) {\n    this.message = m;\n    this.user = u;\n    this.timestamp = t;\n  }\n\
  }\n...\n```\n\n解构看起来可能有点奇怪，但这是它的工作原理。你可以这样调用构造函数：\n\n```\nnew ChatMessage({message:\
  \ 'hello from the outside',\n                 user='adele25@bigneranch.com', timestamp=1462399523859});\n\
  ```\n\n解构语法在参数查找键 `message`。它找到值 `'hello from the outside'` 并将其赋值一个新的本地变量 `m`。该变量可以在构造函数体中使用。`username`\
  \ 和 `timestamp` 属性也是如此。\n\n但这种语法让你丢失了默认参数的便利性。幸运的是，你可以结合这两种技术。这个构造函数的最终版本是你应该添加到\
  \ `app.js` 中的：\n\n```\n...\nclass ChatMessage {\n  constructor(data,\n    message:\
  \ m,\n    user: u='batman',\n    timestamp: t=(new Date()).getTime()\n}) {\n   \
  \ this.message = m;\n    this.user = u;\n    this.timestamp = t;\n  }\n}\n...\n\
  ```\n\n在这个版本中，你从传递给构造函数的对象中提取值。对于任何不存在的值，都提供了默认值。\n\n虽然默认参数只能存在函数（或构造函数）定义中，但解构可以作为赋值的一部分。你也可以这样写构造函数：\n\
  \n```\n...\nclass ChatMessage {\n  constructor(data) {\n    var {message: m, user:\
  \ u='batman', timestamp: t=(new Date()).getTime()} = data;\n    this.message = m;\n\
  \    this.user = u;\n    this.timestamp = t;\n  }\n}\n...\n```\n\n好了，绕路结束了。是时候回到构建\
  \ Chattrbox 了！\n\n\n\n\n你的 `ChatMessage` 类将所有重要信息存储在属性中，但它的实例也继承了 `ChatMessage`\
  \ 的方法和其他信息。这使得 `ChatMessage` 实例不适合通过 WebSockets 发送。你需要一个精简后的信息版本。\n\n在 `app.js`\
  \ 中编写一个 `serialize` 方法，将 `ChatMessage` 属性中的数据表示为一个普通的 JavaScript 对象。\n\n```\n...\n\
  class ChatMessage {\n  constructor({\n    message: m,\n    user: u='batman',\n \
  \   timestamp: t=(new Date()).getTime()\n  }) {\n    this.user = user;\n    this.message\
  \ = message;\n    this.timestamp = timestamp;\n  }\n  serialize() {\n    return\
  \ {\n      user: this.user,\n      message: this.message,\n      timestamp: this.timestamp\n\
  \    };\n  }\n}\n\nexport default ChatApp;\n```\n\n你的 `ChatMessage` 类现在已经准备好使用了。是时候进入\
  \ Chattrbox 的下一个模块了。\n\n## 创建 ws-client 模块\n\n`ws-client.js` 模块将处理与你的 `Node` WebSocket\
  \ 服务器的通信。\n\n它将承担四个职责：\n\n* 连接到服务器\n* 在连接首次建立时执行初始设置\n* 将传入的消息的消息转发给相应的处理器\n* 发送传出的消息\n\
  \n查看这些职责如何与你的其他组件相关（图 17.14）。\n\n**图 17.14 `ws-client` 的接口**\n\n![ws-client’s interfaces](img/app-architecture-ws-client.png)\n\
  \n在你构建客户端时，还将领览一些新的 ES6 特性。\n\n### 连接处理\n\n首先，构建你的集合处理。从打开 `ws-client.js` 并为 WebSocket\
  \ 连接声明变量开始。\n\n```\nlet socket;\n```\n\n此声明使用了 ES6 中定义变量的一种新方式，称为 `let 作用域`。如果你使用\
  \ `let` 作用域来声明变量——使用关键字 `let` 而不是 `var`——那么你的变量将不会被“提升（hoisted）”。\n\n提升意味着变量声明被移动到创建它们的函数作用域的顶部。这是\
  \ JavaScript 解释器在后台执行的操作。遗憾的是，它可能会导致难以发现的错误。\n\n你将在章节末尾更多关于提升的内容。现在，请记住 `let` 是\
  \ `if/else` 子句和循环体中声明变量更安全的方法。\n\n现在，为 `ws-client.js` 添加一个方法来初始化你的连接。\n\n```\nlet\
  \ socket;\n\nfunction init(url)  {\n  socket = new WebSocket(url);\n  console.log('connecting...');\n\
  }\n```\n\n`init` 函数连接到 WebSocket 服务器。接下来，你想将 `ws-client.js` 与 `app.js` 中的 `ChatApp`\
  \ 对接。\n\n为了成为一个功能性的模块，`ws-client.js` 需要指定它导出了什么。你需要导出单个值：一个带有导出函数作为属性的对象代码。你将使用在章节开头时相同的\
  \ `export default` 语法——再加上一点额外的 ES6 便便写法。\n\n如所示，将导出添加到 `ws-client.js` 的末尾。\n\n\
  ```\n...\nfunction init(url)  {\n  socket = new WebSocket(url);\n  console.log('connecting...');\n\
  }\n\nexport default {\n  init,\n}\n```\n\n注意，你不需要指定属性名。这种语法快捷方式等同于：\n\n```\nexport\
  \ default {\n  init: init\n}\n```\n\n如果键（key）和值（value）名称相同，ES6 允许你省略冒号和值。键将自动成为变量名，值将自动成为与名称关联的值。ES6\
  \ 的这一特性是`增强对象字面量（enhanced object literal）`语法。\n\n现在你已经设置好了 `ws-client` 模块，该在 `app.js`\
  \ 中导入它提供的值了。从在 `app.js` 顶部添加导入语句开始：\n\n```\nimport socket from './ws-client';\n\n\
  class ChatApp {\n  constructor() {\n    console.log('Hello ES6!');\n  }\n}\n...\n\
  ```\n\n`socket` 将是你从 `ws-client.js` 出的对象。\n\n接下来，在 `ChatApp` 构造函数中，使用你的 WebSocket\
  \ 的 URL 调用 `socket.init`。\n\n```\nimport socket from './ws-client';\n\nclass ChatApp\
  \ {\n  constructor() {\n    console.log('Hello ES6!');\n    socket.init('ws://localhost:3001');\n\
  \  }\n}\n...\n```\n\n你的 `npm` 脚本应该为你重新构建代码。（如果你有一个或两个，可能需要重启 `npm run watch` 和 `npm\
  \ run dev`）。刷新浏览器，你应该能看到控制台中记录了 `'connecting...'`，如图 17.15 所示。\n\n**图 17.15 WebSocket\
  \ 初始化时记录的消息**\n\n![Message logged on WebSocket initialization](img/connecting.png)\n\
  \n到此，你的应用程序骨架已经建立并运行。\n\n### 处理事件和发送消息\n\n当你的 `App` 模块调用 `init` 时，会实例化一个新的 `WebSocket`\
  \ 对象并建立到服务器的连接。但你的 `App` 模块需要知道何时何时完成，以便对连接进行操作。\n\n`WebSocket` 对象有一组用于处理事件的特殊属性。其中一个就是\
  \ `onopen` 属性。分配给此属性的任何函数会在建立连接时被调用。在这个函数内部，你可以执行任何需要执行的操作。\n\n为了让 `ws-client` 模块具有灵活性且可重用，你不会硬编码\
  \ `App` 模块在连接时需要的步骤。相反，你将使用在 CoffeeRun 中用于点击和提交处理器的相同模式。\n\n在 `ws-client.js` 中添加名为\
  \ `registerOpenHandler` 的函数。`registerOpenHandler` 将接受一个回调，将函数分配给 `onopen`，然后在 `onopen`\
  \ 函数内部调用该回调。\n\n```\nlet socket;\n\nfunction init(url)  {\n  socket = new WebSocket(url);\n\
  \  console.log('connecting...');\n}\n\nfunction registerOpenHandler(handlerFunction)\
  \ {\n  socket.onopen = () => {\n    console.log('open');\n    handlerFunction();\n\
  \  };\n}\n...\n```\n\n这种函数定义与你之前编写的不同。这种新的 ES6 语法被称为`箭头函数（arrow function）`。箭头函数是匿名函数的简写。除了写起来更方便外，箭头函数的作用与匿名函数完全相同。\n\
  \n`registerOpenHandler` 接收一个函数参数（`handlerFunction`），并将一个匿名函数分配到连接的 `onopen` 属性上。在这个匿名函数内部，你调用传入的\
  \ `handlerFunction`。\n\n\n\n\n（使用匿名函数比编写 `socket.onopen = handlerFunction` 更复杂。当你需要响应事件，但在转发事件之前必须执行某些中间步骤时（例如在这里写日志消息，正如你在这里所做的那样），这种模式将非常有用你。）\n\
  \n接下来，你需要编写一个接口来处理通过 WebSocket 连接传进来的消息。在 `ws-client.js` 中编写一个名为 `registerMessageHandler`\
  \ 的新方法。为 `socket` 的 `onmessage` 属性分配一个箭头函数；该箭头函数应该接收一个事件参数。\n\n```\n...\nfunction\
  \ registerOpenHandler(handlerFunction) {\n  socket.onopen = () => {\n    console.log('open');\n\
  \    handlerFunction();\n  };\n}\n\nfunction registerMessageHandler(handlerFunction)\
  \ {\n  socket.onmessage = (e) => {\n    console.log('message', e.data);\n    let\
  \ data = JSON.parse(e.data);\n    handlerFunction(data);\n  };\n}\n...\n```\n\n\
  箭头函数的参数放在括号内，就像普通函数一样。\n\nChatrbox 客户端在 `registerMessageHandler` 内部的 `onmessage`\
  \ 回调中从服务器接收一个对象。该对象代表事件，并有一个 `data` 属性，包含来自服务器的 JSON 字符串。每当你接收到一个字符串时，都会将字符串转换为\
  \ JavaScript 对象。然后你将其传递给 `handlerFunction`。\n\n最后一部分是实际向你的 WebSocket 发送消息的部分。在 `ws-client.js`\
  \ 中编写一个名为 `sendMessage` 的函数。你将分两个部分完成：首先，你将消息负载（包含消息、用户名和时间戳）转换为 JSON 字符串。然后，你将该\
  \ JSON 字符串发送到 WebSocket 服务器。\n\n```\n...\nfunction registerMessageHandler(handlerFunction)\
  \ {\n  socket.onmessage = (e) => {\n    console.log('message', e.data);\n    let\
  \ data = JSON.parse(e.data);\n    handlerFunction(data);\n  };\n}\n\nfunction sendMessage(payload)\
  \ {\n  socket.send(JSON.stringify(payload));\n}\n...\n```\n\n最后，使用增强对象字面量语法为你的新方法添加导出。\n\
  \n```\n...\nfunction sendMessage(payload) {\n  socket.send(JSON.stringify(payload));\n\
  }\n\nexport default {\n  init,\n  registerOpenHandler,\n  registerMessageHandler,\n\
  \  sendMessage\n}\n```\n\n完成后，`ws-client.js` 就拥有了与服务器进行通信所需的一切。你在 `ws-client.js`\
  \ 中的最后一个工作将通过发送消息来测试它。\n\n### 发送和响应消息\n\n更新 `app.js` 中的 `ChatApp` 构造函数。在调用 `socket.init`\
  \ 后，调用 `registerOpenHandler` 和 `registerMessageHandler`，并向它们传递箭头函数。\n\n```\nimport\
  \ socket from './ws-client';\n\nclass ChatApp {\n  constructor() {\n    socket.init('ws://localhost:3001');\n\
  \    socket.registerOpenHandler(() => {\n      let message = new ChatMessage({ message:\
  \ 'pow!' });\n      socket.sendMessage(message.serialize());\n    });\n    socket.registerMessageHandler((data)\
  \ => {\n      console.log(data);\n    });\n  }\n}\n...\n```\n\n连接建立时，你会立即发送一条伪消息。当接收消息时，你会将其打印到控制台。\n\
  \n构建过程完成后，保存你的代码并刷新浏览器。你应该看到一条消息已发送并回传（图 17.16）。\n\n**图 17.16 WebSocket 的调用与响应**\n\
  \n![WebSocket 的调用与响应](img/eureka.png)\n\n干得漂亮！你已经完成了 Chattrbox 三个主要模块中的两个。你将在下一章中完成\
  \ Chattrbox，创建一个将你的现有模块连接到 UI 的模块。该模块会将新消息绘制到消息列表中，并在表单提交时发送消息。\n\n## 给更具好奇心的读者：从其他语言编译为\
  \ JavaScript\n\n有许多语言可以编译为 JavaScript。这里是一个短列表：\n\n* CoffeeScript: [coffeescript.org](http://coffeescript.org/)\n\
  * TypeScript: [www.typescriptlang.org](http://www.typescriptlang.org/)\n* C/C++:\
  \ [kripken.github.io/emscripten-site](http://kripken.github.io/emscripten-site/)\n\
  \n其中最著名的是 CoffeeScript，它为一些最常见的模式提供了简写语法（例如匿名函数的箭头语法）。事实上，CoffeeScript 对 ES6 有着显著的影响。\n\
  \nGoogle、Microsoft、Mozilla 以及其他公司正在合作一个旨在为 JavaScript 引擎标准化汇编语言的项目，称为 WebAssembly。其目标是创建一个高性能、低层的语言，可以从许多不同的语言编译成它。\n\
  \nWebAssembly 的意图是补充 JavaScript 而不是替代它，并利用多种语言的优势。例如，JavaScript 擅长创建基于浏览器的应用程序，但不擅长渲染计算密集型游戏图形。与此同时，C\
  \ 和 C++ 擅长渲染游戏代码。与其将 C++ 代码移植到 JavaScript 并可能引入错误，不如将其编译为 WebAssembly。\n\nWebAssembly\
  \ 项目源于早期的一个名为 asm.js 的项目，该项目规定了 JavaScript 语言的一个子集用于编写高性能代码。\n\n有关 asm.js 和 WebAssembly\
  \ 的更多信息，请查看 JavaScript 创造者的这篇博客：[brendich.com/2015/06/from-asm-js-to-webassembly](https://brendich.com/2015/06/from-asm-js-to-webassembly)\n\
  \n## 铜级挑战：默认导入\n\n在 `main.js` 中，你的导入语句创建了一个名为 `ChatApp` 的本地变量。如果你将其更改为 `ApplicationForChatting`\
  \ 会发生什么？\n\n尝试一下（同时修改下一行的 `new` 语句），并查看它是否仍然有效。如果是，为什么？如果没有，为什么？\n\n## 银级挑战：连接关闭提醒\n\
  \n在 `ws-client` 模块中，添加另一个名为 `registerCloseHandler` 的函数。它应该接收一个回调，当 socket 触发 `close`\
  \ 事件时调用。\n\n在 `main.js` 中使用 `registerCloseHandler` 通知用户连接已关闭。然后测试它以确保运行正常。\n\n如何测试它？显然，你不能关闭浏览器窗口。你需要关闭连接的另一端。\n\
  \n作为额外奖励，编写一个尝试重新连接的函数。你可以使用 `setTimeout`，也可以提示用户确认（搜索 MDN 获取详情）。\n\n\n\n它的解释方式就像是你写了这些：\n\
  \n```javascript\nfunction logSomeValues () {\n  var myVal;\n  console.log(myVal);\n\
  \  myVal = 5;\n  console.log(myVal);\n}\n```\n\n如果你在控制台调用 `logSomeValues()`，你会看到这些：\n\
  \n```\n> logSomeValues();\nundefined\n5\n```\n\n请注意，只有 `declaration`（声明）被提升了。赋值语句留在原地。自然地，这会导致困惑，尤其是当你尝试在\
  \ `if` 语句或循环内部声明变量时。在其他语言中，大括号表示一个`block`（块），它自己的作用域。在 JavaScript 中，大括号块不会创建作用域。只有函数会创建作用域。\n\
  \n看另一个例子：\n\n```javascript\nvar myVal =  11;\nfunction doNotWriteCodeLikeThis()\
  \ {\n  if (myVal > 10) {\n    var myVal = 0;\n    console.log('myVal was greater\
  \ than 10; resetting to 0');\n  } else {\n    console.log('no need to reset.');\n\
  \  }\n  return myVal;\n}\n```\n\n你可能期望 `'myVal was greater than 10; resetting to\
  \ 0'` 会打印到控制台并返回值 `0`。相反，打印出来的将是：\n\n```\n> doNotWriteCodeLikeThis();\nno need to\
  \ reset.\nundefined\n```\n\n声明 `var myVal` 被移动到了函数的顶部，因此在评估 `if` 子句之前，`myVal` 的值为\
  \ `undefined`。赋值语句仍然留在 `if` 块内部。\n\n函数声明也会被提升，但是整体整体提升的。这意味着这段代码运行得完全正常：\n\n```javascript\n\
  boo();\n\n// 在调用后声明：\nfunction boo() {\n  console.log('BOO!!');\n}\n```\n\nJavaScript\
  \ 将整个函数声明块移动到顶部，允许对 `boo` 的调用在没有任何问题的情况下发生：\n\n```\n> boo();\nBOO!!\n```\n\n`let`\
  \ 语句不受提升的影响。`const` 语句（允许你声明无法重新赋值的变量）也不受提升的影响。\n\n## 给更具好奇心的读者：箭头函数\n\n我们撒谎了。箭头函数的工作方式并不*完全*像匿名函数那样。在某些情况下，它们*更好*。\n\
  \n除了提供更短的语法外，箭头函数：\n\n*   工作方式就像你写了 `function () {}.bind(this)` 一样，使得 `this` 在箭头函数体内按预期工作\n\
  *   如果你只有一个语句，你可以省略大括号\n*   当省略大括号时，它会返回单个语句的结果\n\n例如，这里是 CoffeeRun 的 `CheckList.prototype.addClickHandler`\
  \ 方法：\n\n```javascript\nCheckList.prototype.addClickHandler = function(fn) {\n \
  \ this.$element.on('click', 'input', function (event) {\n    var email = event.target.value;\n\
  \    fn(email)\n      .then( function () {\n        this.removeRow(email);\n   \
  \   }.bind(this));\n  }.bind(this));\n};\n```\n\n用箭头函数替换匿名函数会让这段代码变得更清晰一点：\n\n```javascript\n\
  CheckList.prototype.addClickHandler = (fn) => {\n  this.$element.on('click', 'input',\
  \ (event) => {\n    let email = event.target.value;\n    fn(email)\n      .then(()\
  \ => this.removeRow(email));\n  });\n};\n```\n\n没有了 `function` 和 `.bind(this)` 的额外噪点，`addClickHandler`\
  \ 正在的工作更加直观了。\n\n# 18 ES6，冒险继续\n\nChattrbox 是一个可以运行的应用程序，但现在它侧重于“底层”业务逻辑。它连接到 WebSocket\
  \ 服务器。它定义了消息格式并能够发送和接收消息。\n\n在本章中，你将通过连接 UI 层来完成 Chattrbox。你将继续使用 `Node` 和 `npm`\
  \ 来管理你的构建过程并作为服务器，在本章结束时，你将拥有一个功能完整的 Web 聊天应用（图 18.1）。\n\n**图 18.1  完成的 Chattrbox**\n\
  \n![完成的 Chattrbox](img/finished-chattrbox.png)\n\n当你构建 CoffeeRun 时，你创建了对应于表单和列表区域的\
  \ `FormHandler` 和 `CheckList` 模块。你将在 Chattrbox 中使用相同的模式创建 `ChatForm` 和 `ChatList`\
  \ 模块。\n\n你还将创建一个 `UserStore` 模块，用于存储当前聊天用户的信息。这将 Chattrbox 更加健壮，并使其主模块更具复用性。\n\n\
  ## 安装 jQuery 作为 Node 模块\n\nChattrbox 将使用 jQuery 进行 DOM 操作。但你不会像在 CoffeeRun 中那样从\
  \ `cdnjs.com` 加载 jQuery，也不会像以前集成客户端依赖那样在 HTML 中使用 `<script>` 标签。\n\n有了 `Browserify`，这不再需要了。`Browserify`\
  \ 会将你的 JavaScript 依赖构建到应用程序包中，以便在浏览器中使用。因此，集成 jQuery 只需要通过 `import` 包含它，`Browserify`\
  \ 会处理剩下的。\n\n首先将 jQuery 库安装到 `node_modules` 文件夹：\n\n```bash\nnpm install --save-dev\
  \ jquery\n```\n\n打开 `dom.js` 开始编写此模块。`dom.js` 模块将使用 jQuery，所以添加一个 `import` 语句来包含它。\n\
  \n```javascript\nimport $ from 'jquery';\n```\n\n在本章稍后的部分，你将安装并使用另一个第三方库。当你这样做时，将遵循这些相同的步骤来安装和导入它。\n\
  \n## 创建 ChatForm 类\n\n就像你在 CoffeeRun 中做的那样，你将创建一个对象来管理 DOM 中的表单元素。这将是 `ChatForm`\
  \ 类。使用 ES6 类将使你的代码比 CoffeeRun 的代码更易读。\n\n创建 `ChatForm` 实例和初始化其事件处理程序将分步进行，因为构造函数的职责应该只是设置实例的属性。其他工作（如附加监听器）应该在其他方法中完成。\n\
  \n在 `dom.js` 中定义 `ChatForm`，带有一个接收选择器的构造函数。在构造函数中为实例所需的元素添加属性。\n\n```javascript\n\
  import $ from 'jquery';\n\nclass ChatForm {\n  constructor(formSel, inputSel) {\n\
  \    this.$form = $(formSel);\n    this.$input = $(inputSel);\n  }\n}\n```\n\n接下来，添加一个\
  \ `init` 方法，将回调函数与表单的 `submit` 事件关联。\n\n```javascript\n...\nclass ChatForm {\n \
  \ constructor(formSel, inputSel) {\n    this.$form = $(formSel);\n    this.$input\
  \ = $(inputSel);\n  }\n\n  init(submitCallback) {\n    this.$form.submit((event)\
  \ => {\n      event.preventDefault();\n      let val = this.$input.val();\n    \
  \  submitCallback(val);\n      this.$input.val('');\n    });\n\n    this.$form.find('button').on('click',\
  \ () => this.$form.submit());\n  }\n}\n```\n\n\n\n\n为了确保在点击按钮时提交表单，你添加了一个点击处理器，触发表单的\
  \ `submit` 事件。你通过使用 jQuery 获取表单元素，然后调用 jQuery 的 `submit()` 方法来实现此点的。你使用了箭头函数的单表达式版本，这允许你省略大括号。\n\
  \n为了让这个模块变得有用，你能够 `export`（导出）`ChatForm`。在上一章中，你为了此目的使用了 `export default`。这允许你为模块导出单个值。在某些情况下，你使用一个普通的\
  \ JavaScript 对象将多个值封装在那个单一默认值中。\n\n在本章中，你将使用 `named exports`（命名导出）来导出多个具名值，而不是单个默认值。\n\
  \n在 `class` 声明之前添加 `export` 关键字，将 `ChatForm` 作为具名值导出给该模块的用户。\n\n```\n...\nexport\
  \ class ChatForm {\n  constructor(formSel, inputSel) {\n    this.$form = $(formSel);\n\
  \    this.$input = $(inputSel);\n  }\n  ...\n}\n```\n\n非常简单。现在在 `app.js` 中导入 `ChatForm`。\n\
  \n在 Ottergram 和 CoffeeRun 中，你对选择器字符串使用了 `var` 关键字。在 ES6 中，你可以为此声明常量，因为字符串的值不会改变。像\
  \ `let` 一样，`const` 是块级作用域，这意味着它对同一组大括号内的任何代码都是可见的。当它位于所有大括号之外（在这里正是如此），它对同一文件中的任何代码都是可见。\n\
  \n在 `app.js` 中，导入 `ChatForm` 类并为表单选择器和消息输入选择器创建常量。同时，在 `ChatApp` 的构造函数中创建一个 `ChatForm`\
  \ 实例。\n\n```\nimport socket from './ws-client';\nimport {ChatForm} from './dom';\n\
  \nconst FORM_SELECTOR = '[data-chat=\"chat-form\"]';\nconst INPUT_SELECTOR = '[data-chat=\"\
  message-input\"]';\n\nclass ChatApp {\n  constructor() {\n    this.chatForm = new\
  \ ChatForm(FORM_SELECTOR, INPUT_SELECTOR);\n\n    socket.init('ws://localhost:3001');\n\
  \    socket.registerOpenHandler(() => {\n      let message = new ChatMessage('pow!');\n\
  \      socket.sendMessage(message.serialize());\n    });\n    socket.registerMessageHandler((data)\
  \ => {\n      console.log(data);\n    });\n  }\n}\n...\n```\n\n当你导入 `ChatForm` 时，你用大括号包裹了它：`{ChatForm}`。这表示\
  \ `named import`（命名导入）。`ChatForm` 的命名导入声明了一个名为 `ChatForm` 的本地变量，并将其绑定到同名 `dom` 模块中的值。\n\
  \n### 将 ChatForm 连接到 socket\n\n在上一章中，你发送了一条伪消息：`\"pow!\"`。现在你准备好从 `ChatForm` 发送真实的表单数据了。\n\
  \n在 `socket.registerOpenHandler` 回调内部，你将初始化 `ChatForm` 实例。重要的是要在 socket 打开*之后*而不是创建实例后立即初始化。通过等待，你可以防止用户在消息实际发送到服务器之前输入聊天消息。（那将很糟糕。）\n\
  \n记住 `ChatForm` 的 `init` 方法接受一个回调函数。此回调将用于处理表单提交。\n\n在 `app.js` 中，删除你的伪消息代码，并将其替换为对\
  \ `ChatForm.init` 的调用，传递一个回调，将来自 `ChatForm` 的消息数据发送到你的 `socket`。\n\n```\n...\nclass\
  \ ChatApp {\n  constructor() {\n    this.chatForm = new ChatForm(FORM_SELECTOR,\
  \ INPUT_SELECTOR);\n\n    socket.init('ws://localhost:3001');\n    socket.registerOpenHandler(()\
  \ => {\n      let message = new ChatMessage('pow!');\n      socket.sendMessage(message.serialize());\n\
  \      this.chatForm.init((data) => {\n        let message = new ChatMessage(data);\n\
  \        socket.sendMessage(message.serialize());\n      });\n    });\n    socket.registerMessageHandler((data)\
  \ => {\n      console.log(data);\n    });\n  }\n}\n...\n```\n\n让我们看看 `ChatApp` 现在在做什么。首先，它打开到服务器的\
  \ socket 连接。当连接打开时，`ChatApp` 使用表单提交回调初始化你的 `ChatForm` 实例。\n\n现在，当用户在表单中提交消息时，`ChatForm`\
  \ 实例将获取该数据并发送给 `ChatApp` 的回调，然后该回调将将其封装为 `ChatMessage` 并发送到 WebSockets。\n\n## 创建\
  \ ChatList 类\n\n现在 `ChatForm` 已经有了构造函数，它也需要能够创建 DOM 元素。你的下一项工作是在新消息到达时显示它们。\n\n\
  `ChatList` 接受属性选择器和用户名。它需要属性选择器以便知道将它创建的消息元素挂载在哪里。它需要用户名，以便可以看到哪些消息是由你的用户发送的，哪些是由其他人发送的。（你的消息显示方式与他人发送的消息不同。）\n\
  \n```javascript\nimport $ from 'jquery';\n\nexport class ChatForm {\n  ...\n}\n\n\
  export class ChatList {\n  constructor(listSel, username) {\n    this.$list = $(listSel);\n\
  \    this.username = username;\n  }\n}\n```\n\n由于 `ChatList` 有一个构造函数，它也需要能够显示。为\
  \ `ChatList` 添加一个 `drawMessage` 方法。它将期望接收一个对象，并将该对象解构为用户名、时间戳和文本的本地变量。（为了更清楚地展示解构赋值的操作，使用了单字母本地变量。）\n\
  \n```javascript\ndrawMessage({user: u, timestamp: t, message: m}) {\n  let $messageRow\
  \ = $('<li', {\n    'class': 'message-row'\n  });\n\n  if (this.username === u)\
  \ {\n    $messageRow.addClass('me');\n  }\n\n  let $message = $('<p>');\n\n  $message.append($<span>',\
  \ {\n    'class': 'message-username',\n    text: u\n  }));\n\n  $message.append($<span>',\
  \ {\n    'class': 'timestamp',\n    'data-time': t,\n    text: (new Date(t)).getTime()\n\
  \  }));\n\n  $message.append($<span>', {\n    'class': 'message-message',\n    text:\
  \ m\n  }));\n\n  $messageRow.append($message);\n  $(this.listId).append($messageRow);\n\
  \  $messageRow.get(0).scrollIntoView();\n}\n```\n\n你的 `drawMessage` 方法为消息创建一个行，并显示用户名、时间戳和消息本身。如果你是消息的发送者，它会添加额外的\
  \ CSS 类用于样式化。然后，它将你的消息行添加到 `ChatList` 的列表元素中，并将新消息行滚动到视图。\n\n\n\n\n\n现在，`ChatList`\
  \ 已经准备就绪。是时候将其集成到 `ChatApp` 中了。\n\n在 `app.js` 中，更新 `dom` 导入语句，使其也导入 `ChatList`。为列表选择器添加一个\
  \ `const`，然后在构造函数中实例化一个新的 `ChatList`。\n\n```\nimport socket from './ws-client';\n\
  import {ChatForm, ChatList} from './dom';\n\nconst FORM_SELECTOR = '[data-chat=\"\
  chat-form\"]';\nconst INPUT_SELECTOR = '[data-chat=\"message-input\"]';\nconst LIST_SELECTOR\
  \ = '[data-chat=\"message-list\"]';\n\nclass ChatApp {\n  constructor() {\n    this.chatForm\
  \ = new ChatForm(FORM_SELECTOR, INPUT_SELECTOR);\n    this.chatList = new ChatList(LIST_SELECTOR,\
  \ 'wonderwoman');\n\n    socket.init('ws://localhost:3001');\n    ...\n```\n\n你已经快要运行了。实现基础聊天功能的最后一步是在新消息到达时通过调用\
  \ `chatList.drawMessage` 将其绘制出来。在 `app.js` 的 `registerMessageHandler` 中执行此操作：\n\n\
  ```\n...\nclass ChatApp {\n  ...\n    socket.registerMessageHandler((data) => {\n\
  \      console.log(data);\n      let message = new ChatMessage(data);\n      this.chatList.drawMessage(message.serialize());\n\
  \    });\n  }\n}\n...\n```\n\n你使用传入的数据创建一个新的 `ChatMessage`，然后对 `message` 进行 `serialize`序列。这是一个预防性步骤，用于剥离可能添加到数据中的额外元数据。从\
  \ socket 数据创建新的 `ChatMessage` 可以让你获得消息，而 `this.chatList.drawMessage` 则将该 `serialize`\
  \ 消息绘制到浏览器中。\n\n是时候尝试一下了。如果你还没有启动，请启动 `Watchify`（使用 `npm run watch`）和 `nodemon`（使用\
  \ `npm run dev`）。打开或刷新浏览器并输入消息（图 18.2）。\n\n**图 18.2 看到你自己的聊天消息**\n\n![看到你自己的聊天消息](img/amazonia-doctor.png)\n\
  \n万岁！你现在有了一个可以运行的聊天应用程序。它只需要一些设计上的触带来润色。\n\n## 使用 Gravatars\n\nGravatar 是一个免费服务，允许你将头像与电子邮件地址关联。Gravatar\
  \ 通过一个特殊格式的 URL 使每个用户的头像变得可用。例如，图 18.3 显示了我们测试账户之一的 Gravatar。\n\n**图 18.3 Gravatar\
  \ 图像示例**\n\n![Gravatar 图像示例](img/gravatar-url.png)\n\n看到 URL 的结尾了吗？它是根据用户的电子邮件地址生成的唯一标识符。该标识符被称为\
  \ `hash`，可以通过名为 `crypto-js` 的第三方库轻松生成。\n\n使用 `npm` 向项目添加 `crypto-js`：\n\n```\nnpm\
  \ install --save-dev crypto-js\n```\n\n`crypto-js` 现在已安装在你项目的本地 `node_modules` 文件夹中并准备好使用。\n\
  \n在 JavaScript 中创建字符串时，你通常需要将字符串与其他值拼接。ES6 提供了一种更好的方法来创建包含表达式和变量值的字符串，称为`template\
  \ strings`模板字符串。你将使用此功能创建访问 Gravatar 图像的 URL。\n\n在 `dom.js` 中，为 `crypto-js` 库的 `md5`\
  \ 子模块添加另一个 `import` 语句，使用 `/` 分隔主模块名称和子模块名称。然后编写 `createGravatarUrl` 函数，它接受用户名，生成\
  \ MD5 哈希并返回 Gravatar 的 URL。\n\n```\nimport $ from 'jquery';\nimport md5 from 'crypto-js/md5';\n\
  \nfunction createGravatarUrl(username) {\n  let userhash = md5(username);\n  return\
  \ `http://www.gravatar.com/avatar/${userhash.toString()}`;\n}\n...\n```\n\n注意：在\
  \ `return http://www.gravatar.com/avatar/${userhash.toString()}` 中，那些不是单引号字符。它们是反引号（backticks），位于大多数美式键盘布局上\
  \ Escape 键下方。\n\n在反引号内部，你可以使用 `${userhash.toString()}` 语法将 JavaScript 表达式的值直接包含在字符串中。在这里，你引用了变量\
  \ `userhash` 并调用了它的 `toString` 方法，但在括号内任何表达式都是有效的。\n\n接下来，使用此函数在新消息中显示 Gravatar。在\
  \ `ChatList` 的 `drawMessage` 方法末尾（仍在 `dom.js` 中），创建一个新的图像元素并将其 `src` 属性设置为用户的 Gravatar。\n\
  \n```\n...\n    $message.append($('<span>', {\n      class: 'message-message',\n\
  \      text: m\n    }));\n\n    let $img = $('<img>', {\n      src: createGravatarUrl(u),\n\
  \      title: u\n    });\n\n    $messageRow.append($img);\n    $messageRow.append($message);\n\
  \    $(this.listId).append($messageRow);\n    $messageRow.get(0).scrollInto();\n\
  ```\n\n运行你的聊天应用，你应该会弹出一个 Gravatar（图 18.4）。\n\n**图 18.4 显示了 Gravatar**\n\n![显示 Gravatar](img/great-hera.png)\n\
  \n遗憾的是，`wonderwoman` 用户名没有 Gravatar。结果是，你得到了无有趣的默认 Gravatar。\n\n## 提示用户名\n\n成为神奇女侠很酷。但成为使用\
  \ Chattrbox 的 JavaScript 开发者更酷（特别是真实的用户是有头像的）。为了知道是谁在使用 Chattrbox，你需要提示用户用户名。\n\n\
  与 UI 交互是 `dom` 模块的职责，因此在 `dom.js` 中创建 `promptForUsername` 函数。将其导出，而不是作为 `ChatForm`\
