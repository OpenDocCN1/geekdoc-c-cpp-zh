  \ rgba(100%, 100%, 100%, 0.8);\n...\n\n\n\n\n\n\n\n# 创建弹性布局容器\n在添加第一个 flexbox 属性之前，请在\
  \ `styles.css` 中将 `<html>` 和 `<body>` 元素设置为 `height: 100%`。`<html>` 元素是你的 DOM 树的根元素，而\
  \ `<body>` 是绘制在其内部的子元素。将两者的 `height` 均设置为 `100%` 可以让内容填充浏览器窗口或设备窗口。\n```\n  ...\n\
  \n  height: 100%;\n\n  font-size: 10px;\n}\n```\n注意，在这一样式规则中，你通过逗号分隔了两个选择器。任何类型的选择器都可以以这种方式组合以设置通用样式。\n\
  同样注意，你现在有两个针对 `<body>` 元素选择器的样式规则。当浏览器看到某个选择器有额外的样式声明时，它只是会将其添加到该选择器现有的样式信息中。在这种情况下，它首先看到\
  \ `<body>` 应该具有 100% 的 `height` 并存储该信息。当它读取下一个针对 `<body>` 的样式规则时，会将 `background`\
  \ 和 `font-size` 信息与 `height` 样式一起存储。\n现在你准备好创建你的第一个弹性布局容器了。当一个元素成为弹性容器时，它可以控制其子元素（即弹性项目）的布局方式。在弹性容器内部，弹性项目的大小和位置沿着`主轴`（main\
  \ axis）和`交叉轴`（cross axis）进行（图 4.7）。\n**图 4.7 弹性布局容器的主轴和交叉轴**\n![弹性布局容器的主轴和交叉轴](img/main-cross-axes.png)\n\
  通过向 `styles.css` 中 `<body>` 的样式规则添加 `display: flex` 声明，让你的 `<body>` 元素成为弹性容器。\n\
  ```\nbody {\n\n  background: rgb(149, 194, 215);\n...\n\n\n\n\n\n\n\n...\n  display:\
  \ flex;\n\n  background: rgb(149, 194, 215);\n...\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  <body>\n  <main class=\"content\">\n    <div class=\"detail-image-container\">...</div>\n\
  </body>\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n...\n  text-decoration: none;\n\n \
  \ flex: 0 1 auto;\n\n  background: white;\n}\n\n\n\n...\n  ...\n\n  flex: 1 1 auto;\n\
  \n  ...\n```\n`.main-content` 的 `flex` 声明中的第一个值对应于 `flex-grow` 属性。值 `1` 告诉容器：“我希望尽可能地增长。”由于它唯一的兄弟元素已声明它*不会*增长，因此\
  \ `.main-content` 元素将增长并占据所有 `.main-header` 不需要的空间。\n`<body>` 的两个弹性项目——即 `.main-header`\
  \ 和 `.main-content` 元素——根据它们的需求占据弹性空间。现在是时候调整 `.main-content` 元素的布局了。\n### 弹性项目的排序、对齐和对对齐\n\
  Flexbox 还允许你将弹性项目细分为弹性容器。这种技术让你能够关注层级结构。稍后，你将让 `.main-content` 变为一个弹性容器。\n处理嵌套弹性容器是创建视觉组件外观和感受的“原子化样式方法”的一个例外。与其先为最小、最内层的元素设置样式，然后向外处理，在用\
  \ flexbox 处理布局时，从最外层元素开始向内处理更有用。以下是你将要的内容：你将把 `.main-content` 为一个具有垂直轴的弹性容器。此外，你将为\
  \ `.main-content` 的弹性项目指定 `flex` 属性，使得 `.thumbnail-list` 占据默认空间，而 `.detail-image-container`\
  \ 增长以填充空间。最后，你把 `.thumbnail-list` 移动到 `.detail-image-container` 下方（图 4.15）。\n**图\
  \ 15 将 `.main-content` 变为弹性容器**\n![将 .main-content 变为弹性容器](img/main-content-as-flex-container.png)\n\
  在 `styles.css` 中进行这些更改：为 `.main-content` 的声明块添加 `display: flex` 和 `flex-direction:\
  \ column`，为 `.thumbnail-list` 的声明块添加 `flex` 属性，并为 `.detail-image-container` 编写一个新的声明块。\n\
  ```\n.main-content {\n  display: flex;\n}\n.thumbnail-list {\n  list-style: none;\n\
  \n  overflow-x: auto;\n\n  ...\n\n  flex: 1 1 auto;\n\n  ...\n```\n你可能在想，为什么不用百分比定义\
  \ `.thumbnail-list` 和 `.detail-image-container` 框的高度，就像你定义 `.detail-image` 的 `width`\
  \ 那样。将 `.thumbnail-list` 的高度设置为 `25%`，将 `.detail-image-wrapper` 设置为 `75%` 似乎是合理的——但不会按照你预期的方式工作。与\
  \ `.detail-image` 的 `width` 属性的交互会导致 `.detail-image-container` 大得多，而 `.thumbnail-list`\
  \ 结果要么太小要么太大，取决于窗口大小。\n简而言之，使用 `flex` 属性来控制元素的绘制顺序，结合 `.detail-image` 的宽度，是解决 `.thumbnail-list`\
  \ 尺寸过大问题的关键。将 `.main-content` 变为弹性容器后，将 `.thumbnail-list` 移动到 `.detail-image-container`\
  \ 下方（图 4.15）。\n默认情况下，弹性项目按照它们在 HTML 中的顺序绘制。将 `.detail-image` 移动上去的一种方案是使用 flexbox\
  \ 属性。然而，也可以通过使用 flexbox 来实现。为了改变顺序，在 `styles.css` 的 `.thumbnail-list` 选择器中添加 `order`\
  \ 声明。\n```\n.thumbnail-list {\n  list-style: none;\n\n  overflow-x: auto;\n```\n\
  `order` 属性可以分配任何整数值。默认值为 `0`，告诉浏览器使用源顺序。任何其他值（包括负数）都会告诉浏览器在其他弹性项目之前或之后绘制。给 `.thumbnail-list`\
  \ 分配 `order: 2` 会告诉浏览器在任何 `order` 值较小的兄弟元素（如 `.detail-image-container`）之后绘制。\n保存\
  \ `styles.css` 并切换到 `Chrome`。你会看到缩略图沿底部绘制（图 4.16）。\n**图 4.16 改变元素的绘制顺序**\n![改变元素的绘制顺序](img/flexbox-order.png)\n\
  接下来，在构建 Ottergram 布局时你将继续应用 `display: flex`。到目前为止，你处理的都是包含几个弹性项目的弹性容器。让 `.thumbnail-list`\
  \ 也成为一个弹性容器，以便进一步探索 flexbox 能为你提供什么。\n```\n.thumbnail-list {\n  order: 2;\n  list-style:\
