  \ 100%);\n}\n```\n接下来，你将处理 `.thumbnail-list` 内部 flex 项目的间距。在 `styles.css` 中，为 `.thumbnail-list`\
  \ 选择器添加 `justify-content` 声明。\n```\n.thumbnail-list {\n  order: 2;\n  justify-content:\
  \ space-between;\n  padding: 0;\n  white-space: nowrap;\n}\n```\n`justify-content`\
  \ 属性允许 flex 容器控制 flex 项目在主轴上的绘制方式。你使用了 `space-between` 作为值，以确保每个单独的 flex 项目周围都有均匀间距。\n\
  `justify-content` 共有五种不同的值可以指定。图 4.18 展示了这些值中的每一个是如何工作的。\n**图 4.18 `justify-content`\
  \ 属性的值**\n![justify-content 属性的值](img/flex-justification.png)\n你已经搞定了 `.thumbnail-list`\
  \ 的布局。接下来，你将处理 `.detail-image-container` 及其内容。\n### 居中详情图片\n详情图片应该是 Ottergram 的视觉焦点。它应该处于正中心，以确保用户能够欣赏水獭的雄伟姿态。它还应该装饰有一个酷炫的标题。\n\
  为了居中详情图片，你首先将将图片及其标题封装在一个容器中，然后在 `.detail-image-container` 内部居中 `wrapper`。这种思路在\
  \ 图 4.19 中得到了体现。\n**图 4.19 对 `.detail-image` 和 `.detail-image-title` 进行框处理**\n![对\
  \ .detail-image 和 .detail-image-title 进行框处理](img/image-frame-centering.png)\n虽然你可以在\
  \ `.detail-image-container` 中直接居中 `.detail-image`，但很难正确偏移 `.detail-image-title`，因为\
  \ `.detail-image` 和 `.detail-image-container` 都在动态调整。\n中间包装元素是处理这种情况的一种很有用的技巧。它将限制\
  \ `.detail-image` 的尺寸，并为 `.detail-image-title` 的定位提供参考。\n在 `index.html` 中，首先开始添加一个类名为\
  \ `detail-image-frame` 的 `div`：\n```\n      </ul>\n      <div class=\"detail-image-container\"\
  >\n          <img class=\"detail-image\" src=\"img/otter1.jpg\" alt=\"\">\n    \
  \    </div>\n    </main>\n</</html>\n\n\n...\n  flex: 1 1 auto;\n\n  text-align:\
  \ center;\n\n  width: 90%;\n```\n接下来，为了在 `.detail-image-container` 内部居中 `.detail-image-frame`，更新\
  \ `styles.css` 使 `.detail-image-container` 成为一个 flex 容器。使用 `justify-content: center`\
  \ 将其 flex 项目在主轴（在此例中是水平方向——默认值）上居中，并添加一个新的 flexbox 属性 `align-items: center` 将其 flex\
  \ 项目在交叉轴（垂直方向）上居中。\n```\n.detail-image-container {\n  display: flex;\n  align-items:\
  \ center;\n...\n\n\n\n\n\n\n\n\n\n\n- 使用一个或多个 `top`、`right`、`bottom` 和 `left` 属性提供的坐标；可以使用绝对长度（如像素）或相对长度（如百分比）\n\
  \n\n\n\n\n\n\n...\n  position: relative;\n}\n```\n你对 `.detail-image-frame` 使用 `position:\
  \ relative` 是因为你希望它留在正常流中。你还希望它作为绝对定位后代的容器，因此它的 `position` 属性必须显式定义。\n在 `styles.css`\
  \ 的末尾，为 `.detail-image-title` 选择器添加一个声明块。目前，将标题设为白色并将字体设置为默认值的四倍。\n```\n.detail-image\
  \ {\n}\n.detail-image-title {\n  font-size: 40px;\n```\n到目前为止一切顺利（图 4.23）。但太基础了。\n\
  **图 4.23 `.detail-image-title` 的基础文本样式**\n\n\n![.detail-image-title 的基础文本样式](img/basic-white.png)\n\
  为了增加一点格调，让我们为 `.detail-image-title` 添加一些文本效果。在定位样式化的文本元素时，请记住，元素的框模型可能会因为自定义字体的视觉特征或其他效果而发生。在本例中，你将在设置位置之前，为\
  \ `.detail-image-title` 完成所有文本样式设置。在 `styles.css` 中为 `.detail-image-title` 添加 `text-shadow`\
