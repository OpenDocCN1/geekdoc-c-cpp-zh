  \ = Object.keys(orders);\n\n        console.log('Truck #' + this.truckId + ' has\
  \ pending orders:');\n        customerIdArray.forEach(function (id) {\n        \
  \  console.log(orders[id]);\n        }.bind(this));\n      }.bind(this));\n  };\n\
  ...\n```\n\n`printOrders` 应该接收一个可选参数。你需要检查它是否传递了该参数，如果是，则调用它。当你调用它时，将传递当前的 `allData`。\n\
  \n```\n...\n  Truck.prototype.printOrders = function (printFn) {\n    return this.db.getAll()\n\
  \      .then(function (orders) {\n        var customerIdArray = Object.keys(orders);\n\
  \n        console.log('Truck #' + this.truckId + ' has pending orders:');\n    \
  \    customerIdArray.forEach(function (id) {\n          console.log(this.db.get(id));\n\
  \          if (printFn) {\n            printFn(orders);\n          }\n        }.bind(this));\n\
  \      }.bind(this));\n  };\n```\n\n保存 `truck.js`。在 `main.js` 中，调用 `printOrders`\
  \ 并向其传递 `addRow`。确保 `addRow` 已绑定到 `CheckList` 实例。\n\n```\n...\n  FormHandler.addSubmitHandler\
  \ = function (fn) {\n    ...\n      fn(data)\n        .then(function () {\n    \
  \      this.reset();\n          this.elements[0].focus();\n        }.bind(this));\n\
  \    });\n  };\n...\n```\n\n\n\n\n在 `datastore.js` 中，你将更新 `add` 方法。首先，创建一个 `Promise`\
  \ 变量并将其赋值为 `window.Promise`。虽然这并非绝对必要，但继续这种模式——即从全局作用域导入你在模块内部需要的任何内容——是一个好意。\n\n\
  在 `add` 方法内部，创建一个名为 `promise` 的新变量。将其赋值为 `Promise` 的新实例。确保在 `add` 方法的末尾返回 `promise`\
  \ 变量。\n\n```\n(function (window) {\n  'use strict';\n  var App = window.App || {};\n\
  \  var Promise = window.Promise;\n\n  function DataStore() {\n    this.data = {};\n\
  \  }\n\n  DataStore.prototype.add = function (key, val) {\n    this.data[key] =\
  \ val;\n    var promise = new Promise();\n\n    return promise;\n  };\n...\n```\n\
  \n`Promise` 构造函数需要一个函数参数。向它传递一个接受两个函数参数 `resolve` 和 `reject` 的匿名函数。\n\n```\n...\n\
  \  DataStore.prototype.add = function (key, val) {\n    this.data[key] = val;\n\
  \    var promise = new Promise(function (resolve, reject) {\n    });\n\n    return\
  \ promise;\n  };\n...\n```\n\n当 `Promise` 执行工作时，它将调用该匿名函数参数并向传递两个值：`resolve` 和 `reject`。调用\
  \ `resolve` 函数会将 `Promise` 对象的状态更改为已完成（fulfilled）。调用 `reject` 函数会将 `Promise` 对象的状态更改为拒绝（rejected）。\n\
  \n接下来，将数据存储行（`this.data[key] = val;`）移动到匿名函数的体内。为了确保 `this.data` 正确地指向 `DataStore`\
  \ 的 `data` 实例变量，将该匿名函数绑定（bind）到 `this`。\n\n```\n...\n  DataStore.prototype.add =\
  \ function (key, val) {\n    this.data[key] = val;\n    var promise = new Promise(function\
  \ (resolve, reject) {\n      this.data[key] = val;\n    }.bind(this));\n\n    return\
  \ promise;\n  };\n...\n```\n\n### 解析一个 Promise\n\n在匿名函数的最后面，不带参数地调用 `resolve`。\n\
  \n```\n...\n  DataStore.prototype.add = function (key, val) {\n    var promise =\
  \ new Promise(function (resolve, reject) {\n      this.data[key] = val;\n      resolve(null);\n\
  \    }.bind(this));\n\n    return promise;\n  };\n...\n```\n\n为什么使用 `null` 作为参数？向\
  \ `DataStore` 添加（adding）一个值不会产生任何值，因此没有东西可以进行 `resolve`。当你需要显式地返回一个非值时，应该使用 `null`。（你也可以使用\
  \ `resolve(val)` 让链中的下一个函数访问新存储的值。对于 `CoffeeRun` 来说，这是没有的，因此未包含在示例中。）\n\n### 将其他\
  \ DataStore 方法 Promise 化\n\n你可以使用相同的代码模式手动更新其他三个方法。但与其重写所有这些代码，不如创建一个名为 `promiseResolvedWith`\
  \ 的辅助函数，用于创建一个 `Promise`、解析它并返回它。更新 `DataStore.prototype.add` 以使用此辅助函数。\n\n```\n\
  ...\n  function DataStore() {\n    this.data = {};\n  }\n\n  function promiseResolvedWith(value)\
  \ {\n    var promise = new Promise(function (resolve, reject) {\n      resolve(value);\n\
  \    });\n    return promise;\n  }\n\n  DataStore.prototype.add = function (key,\
  \ val) {\n    var promise = new Promise(function (resolve, reject) {\n      this.data[key]\
  \ = val;\n      resolve(null);\n    }.bind(this));\n\n    return promise;\n    return\
  \ promiseResolvedWith(null);\n  };\n...\n```\n\n`promiseResolvedWith` 是你在 `add`\
  \ 方法中编写的 `Promise` 代码的可重用形式。它接受一个名为 `value` 的参数，创建一个名为 `promise` 的新变量，并将其赋值给 `Promise`\
  \ 的新实例。它向 `Promise` 构造函数传递一个接受两个参数（`resolve` 和 `reject`）的匿名函数。\n\n\n\n\n当你为浏览器编写\
  \ JavaScript 时，你的代码可以访问如 `document` 和 `window` 等全局对象，以及其他 API 和库。通过 `Node`，你的代码可以访问硬盘、数据库和网络（图\
  \ 15.1）。\n\n**图 15.1 在浏览器中运行 JavaScript vs 通过 Node 运行**\n\n![JavaScript running\
  \ in browser vs via Node](img/js-engines.png)\n\n使用 `Node`，你可以创建从命令行工具到 Web  服务器的任何程序。在接下来的四个章节中，你将使用\
  \ `Node` 来帮助创建一个名为 Chattrbox 的实时聊天应用（图 15.2）。\n\n**图 15.2 Chattrbox：仅用于重要对话**\n\n\
  ![Chattrbox: strictly for important conversations](img/chattrbox-final-screenshot.png)\n\
  \nChattrbox 将由两部分组成：一个 `Node.js` 服务器和一个运行在浏览器中的 JavaScript 应用。浏览器将连接到 `Node` 服务器并接收\
  \ HTML、CSS 和 JavaScript 文件。此时，浏览器中的 JavaScript 应用将开始处理通过 WebSockets 进行的实时通信。这一过程在图\
  \ 15.3 中示意了。\n\n**图 15.3 Chattrbox 应用的网络图**\n\n![Network diagram of the Chattrbox\
  \ application](img/chattrbox-data-diagram.png)\n\n你将在下一章中学习 WebSockets。本章的重点是让你熟悉\
  \ `Node`。\n\n# Node 和 npm\n\n当你在第 1 章中安装 `Node.js` 时，你获得了两个命令行程序：`node` 和 `Node`\
  \ 包管理器 `npm`。你可能还记得 `npm` 允许你安装开源开发工具，例如 `browser-sync`。`node` 程序负责运行用 JavaScript\
  \ 编写的程序。\n\n在本章中，大部分工作将通过 `npm` 完成。`npm` 命令行工具可以执行各种任务，例如安装可以集成到项目中的第三方代码，以及管理项目的工作流和外部依赖。在本章中，你将使用\
  \ `npm` 来：\n\n* 使用 `npm init` 创建 `package.json` 文件\n* 使用 `npm install --save` 添加第三方模块\n\
  * 运行保存在 `package.json` 的 `scripts` 部分的常用工具\n\n`Node` 不仅仅包含 `node` 和 `npm` 命令。它还包含许多实用的模块，这些模块提供了构造函数，帮助你完成处理文件和文件夹、网络通信以及处理事件等操作。此外，在为\
  \ `Node` 编写 JavaScript 时，你可以访问一些实用函数，促进 JavaScript 与 `Node` 模块生态系统的交互。例如，`Node`\
  \ 提供了比你为 CoffeeRun 使用的 IIFE 简单得多的模块模式。\n\n上述的 `package.json` 文件是一个充当你的 `Node` 项目清单的文件。它包含了你的项目名称、版本号、描述和其他信息。更重要的是，你可以在这里存储配置设置和命令，供\
  \ `npm` 在测试和构建你的应用程序时使用。\n\n你可以手动创建此文件，但让 `npm` 为你完成简单得多。\n\n## npm init\n\n在你的项目文件夹中创建一个名为\
  \ `chattrbox` 的目录。在终端程序中切换到该目录并运行 `npm init`，让 `npm` 创建 `package.json`。\n\n`npm`\
  \ 会提示你项目信息。它还会提供默认答案，这些答案目前是可以的。按回车键接受默认值（图 15.4）。\n\n**图 15.4 运行 `npm init`**\n\
  \n![Running npm init](img/npm-init.png)\n\n在 `Atom` 中打开 `chattrbox` 项目文件夹。你会发现 `package.json`\
  \ 文件确实已经为你创建（图 15.5）。\n\n**图 15.5 `npm init` 后的 `package.json` 内容**\n\n![package.json\
  \ contents after npm init](img/package-json.png)\n\n## npm scripts\n\n在 `package.json`\
  \ 中，注意 `\"scripts\"` 部分。这是用于你在开发项目时可能需要反复运行的命令。在构建 Chattrbox 时，你将添加一个 `\"start\"\
  ` 脚本（注意你必须在 `\"test\"` 行末尾添加逗号）：\n\n```json\n\"scripts\": {\n  \"test\": \"echo\
  \ \\\"no test specified\\\" && exit 1\",\n  \"start\": \"node index.js\"\n}\n```\n\
  \n这让你能够通过在命令行运行 `npm start` 来启动你的 `Node` 服务器。\n\n# Hello, World\n\n为了让你了解浏览器之外编写\
  \ JavaScript 的世界，你将从一个经典的 `Hello, World` 程序开始。在你的 `chattrbox` 文件夹创建一个名为 `index.js`\
  \ 的新文件并输入以下内容，我们将在输入后进行解释：\n\n```javascript\nvar http = require('http');\n\nvar\
  \ server = http.createServer(function (req, res) {\n  console.log('Responding to\
  \ a request.');\n  res.end('<h1>Hello, World</h1>');\n});\n\nserver.listen(3000);\n\
  ```\n\n在第一行，你使用了 `Node` 的内置函数 `require` 来访问随 `Node` 一起的 `http` 模块。该模块提供了许多处理 HTTP\
  \ 请求和响应的工具，例如 `http.createServer` 函数。\n\n`http.createServer` 接收一个参数，即函数。该函数会在每次\
  \ HTTP 请求时被调用。你可能认出这种回调模式，只不过这一次是服务端事件（接收 HTTP 请求）触发了回调。\n\n在回调中，你向控制台打印了一条消息并在响应中写入了一些\
  \ HTML。在 Node 中，通常使用 `req` 和 `res` 作为 HTTP 请求和响应对象的变量名。\n\n最后，你使用 `server.listen`\
  \ 让服务器监听端口 3000。这通常被称为“绑定端口”。\n\n保存你的文件。要运行你的 `Node` 服务器，执行命令 `npm start`。终端结果如图\
  \ 15.6 所示。\n\n**图 15.6 通过 `npm start` 运行 index.js**\n\n![Running index.js via npm\
  \ start](img/chattrbox-npm-start.png)\n\n\n\n\n接下来，打开浏览器访问 `http://localhost:3000`。你的结果看起来会像图\
  \ 15.7。（注意，在 `Chrome` 之外的某些浏览器中，你可能会看到 HTML 显示为纯文本。这些浏览器期望响应中包含 `doctype` 或额外的元数据来声明该响应应被解释为\
  \ HTML。你将在章节末尾的挑战之一中解决这个问题。）\n\n**图 15.7 在浏览器中访问你的 Node 服务器**\n\n![在浏览器中访问你的 Node\
  \ 服务器](img/chattrbox-hello-browser.png)\n\n与运行 Ottergram 和 CoffeeRun 时不同，浏览器中没有可以查看的\
  \ JavaScript。当你看到此页面时，你的 JavaScript 代码已经在服务器上完成了它的工作。\n\n回到终端。你应该能看到在接收到请求时，`console.log()`\
  \ 出了 `Responding to a request`（图 15.8）。\n\n**图 15.8 请求到达时的 console.log()**\n\n![请求到达时的\
  \ console.log](img/chattrbox-first-req.png)\n\n## 添加 npm 脚本\n\n除了让你编写命令行 JavaScript\
  \ 程序外，`Node` 还为你提供了一种在开发这些程序时协调工作流的方法。这是一个你应该利用的强大功能。为了查看它是如何工作的，你将为你的项目添加一些自动化。\n\
  \n以运行服务器为例。每当你想要在代码中尝试新事物时，都必须重复几个步骤：\n\n*   在编辑器中修改代码\n*   切换到终端\n*   按下 Control-C\
  \ 停止程序\n*   运行 `npm start` 重新启动程序\n\n你可以写一个程序来自动完成重启服务。不过，你很幸运——已经有人为你写好了，这是一个名为\
  \ `nodemon` 的模块。尽早将 `nodemon` 集成到你的工作流中会让编写程序的体验顺畅得多。\n\n在终端中，停止你的程序并运行以下命令安装 `nodemon`\
  \ 模块：\n\n```\nnpm install --save-dev nodemon\n```\n\n你将看到下面的几行，`npm` 正在警告你 `package.json`\
  \ 文件中的某些空字段。不要惊慌——只需意识到 `npm` 是一个注重细节的人。\n\n```\nnpm WARN chattrbox@1.0.0 No description\n\
  npm WARN chattrbox@1.0.0 No repository field.\n```\n\n注意你在此 `npm install` 命令中使用的\
  \ `--save-dev` 选项。它告诉 `npm` 帮助你维护应用程序所需的第三方模块列表。该列表存储在你的 `package.json` 文件中。如有，可以通过运行\
  \ `npm install` 命令（不带参数）安装列表中的所有依赖项。这意味着当你共享代码时，不需要包含所有的第三方模块。\n\n如果你查看 `package.json`\
  \ 文件，你会发现 `npm` 为你创建了一个新的 `\"devDependencies\"` 部分，其中包含 `nodemon` 项。\n\n```\n...\n\
  \  \"author\": \"\",\n  \"license\": \"ISC\",\n  \"devDependencies\": {\n    \"\
  nodemon\": \"¹.9.1\"\n  }\n```\n\n现在，更新你的 `package.json` 为 `\"scripts\"` 部分添加另一个条目：\n\
  \n```\n...\n\"scripts\": {\n  \"test\": \"echo \\\"Error: no test specified\\\"\
  \ && exit 1\",\n  \"start\": \"node index.js\",\n  \"dev\": \"nodemon index.js\"\
  \n},\n...\n```\n\n在终端中，通过你的新 `npm` 脚本使用命令 `npm run dev` 重启你的 `node` 程序。注意命令并不是简单的\
  \ `npm run dev`。\n\n\n\n\n```\nvar http = require('http');\nvar fs = require('fs');\n\
  \nvar server = http.createServer(function (req, res) {\n  console.log('Responding\
  \ to a request.');\n  var url = req.url;\n\n  var fileName = 'index.html';\n  if\
  \ (url.length > 1) {\n    fileName = url.substring(1);\n  }\n  console.log(fileName);\n\
  \  fs.readFile('app/index.html', function (err, data) {\n    res.end(data);\n  });\n\
  });\nserver.listen(3000);\n```\n\n通过使用请求对象的 `url` 属性，你可以看到浏览器请求的是默认文件（`index.html`）还是另一个文件。如果是另一个文件，你调用\
  \ `url.substring(1)` 来剥离第一个字符，该字符通常是 `'/'`。\n\n目前，你只是将文件名打印到控制台。\n\n在 `nodemon`\
  \ 重启你的程序后，尝试访问 `http://localhost:3000/woohoo` 或任何其他路径，包括默认的 `'/'` 路径。终端中的结果看起来类似于图\
  \ 15.12]。\n\n图 15.12 记录请求的文件路径\n\n![Logging the requested file path](img/woohoo.png)\n\
  \n（回想 第 2 章），浏览器会自动请求 `favicon.ico` 文件，因此你可能也会在终端中看到该文件的请求日志。）\n\n现在是时候利用这些路径信息了。\n\
  \n### 使用 path 模块\n\n你可以直接将 `fileName` 传递给 `fs.readFile`，但使用 `path` 模块更好，因为它提供了处理和转换文件路径。使用该模块的一个微小但重要的原因是，某些操作系统使用正斜杠，而某些则使用反斜杠。`path`\
  \ 模块可以轻松处理这些差异。\n\n更新 `index.js` 以导入 `path` 模块并使用它来查找被请求的文件。\n\n```\nvar http =\
  \ require('http');\nvar fs = require('fs');\nvar path = require('path');\n\nvar\
  \ server = http.createServer(function (req, res) {\n  console.log('Responding to\
  \ a request.');\n  var url = req.url;\n\n  var fileName = 'index.html';\n  if (url.length\
  \ > 1) {\n    fileName = url.substring(1);\n  }\n  console.log(fileName);\n  var\
  \ filePath = path.resolve(__dirname, 'app', fileName);\n  fs.readFile('app/index.html'filePath,\
  \ function (err, data) {\n    res.end(data);\n  });\n});\nserver.listen(3000);\n\
  ```\n\n在浏览器中测试几个文件路径，以确保你的应用程序运行正常。默认路径应该返回 `index.html`，而不存在的路径（如 `'/woohoo/`）应该显示为空并打印它们的文件名。\n\
  \n接下来，在 `app` 文件夹中创建一个 `test.html` 文件。在其中写入以下：\n\n```\nHola, Node!\n```\n\n尝试在浏览器中访问它。你的\
  \ `node` 程序应该能够毫无问题地返回它（图 15.13）。\n\n图 15.13 获取 `test.html`\n\n![Retrieving test.html](img/test-html.png)\n\
  \n你已经添加了能够根据 URL 路径成功提供特定文件的代码。下一步工作是将该功能抽象到它自己的模块中。\n\n## 创建自定义模块\n\n你的回调函数（至少）有两个工作：它确定正在请求哪个文件，并读取该文件以响应响应返回。为了让代码更具模块化且易于维护，应该将其中一个职责移动到它自己的模块中。\n\
  \n在 CoffeeRun 中，你在 IIFE（立即执行函数表达式）中声明模块，并为全局命名空间的一个属性赋值。`Node` 程序中的模块工作方式不同。你仍然在一个单独的文件编写模块代码，但不需要\
  \ IIFE。\n\n在与 `index.js` 相同的目录下创建一个名为 `extract.js` 的新文件（不在 `app` 目录中）。添加一个名为 `extractFilePath`\
  \ 的函数来查找合适的文件。（这段代码与你已经在 `index.js` 中写的代码非常相似。）\n\n```\nvar path = require('path');\n\
  \nvar extractFilePath = function (url) {\n  var filePath;\n  var fileName = 'index.html';\n\
  \n  if (url.length > 1) {\n    fileName = url.substring(1);\n  }\n  console.log('The\
  \ fileName is: ' + fileName);\n\n  filePath = path.resolve(__dirname, 'app', fileName);\n\
  \  return filePath;\n};\n```\n\n你从 `index.js` 中提取了大量代码并将其放在一个名为 `extractFilePath`\
  \ 的独立函数中。接下来，让 `extractFilePath` 函数可用，以便其他模块可以使用 `require` 导入它。为了做到，将 `extractFilePath`\
  \ 赋值给名为 `module.exports` 的全局变量。这是 `Node` 提供的一个特殊变量。赋值给它的任何值都是其他模块能够导入的值。任何其他变量或函数对其他模块都是不可见的。\n\
  \n```\n...\n  filePath = path.resolve(__dirname, 'app', fileName);\n  return filePath;\n\
  };\n\nmodule.exports = extractFilePath;\n```\n\n这一行新代码告诉 `Node`，当你通过 `require('./extract')`\
  \ 导入模块时，返回的是 `extractFilePath` 函数。现在在 `index.js` 中这样做。\n\n### 使用你的自定义模块\n\n更新 `index.js`\
  \ 使用你新的 `extract` 模块来处理这些职责。\n\n```\nvar http = require('http');\nvar fs = require('fs');\n\
  var path = require('path');\nvar extract = require('./extract');\n\nvar server =\
  \ http.createServer(function (req, res) {\n  console.log('Responding to a request.');\n\
  \  var url = req.url;\n\n  var fileName = 'index.html';\n  if (url.length > 1) {\n\
  \    fileName = url.substring(1);\n  }\n  console.log(fileName);\n  var filePath\
  \ = path.resolve(__dirname, 'app', fileName);\n  var filePath = extract(req.url);\n\
  \  fs.readFile(filePath, function (err, data) {\n    res.end(data);\n  });\n});\n\
  server.listen(3000);\n```\n\n你使用 `require` 函数导入了自定义模块。你将模块赋值给新变量 `extract`。现在你可以像使用\
  \ `extractFilePath` 函数一样使用 `extract` 函数了。\n\n在 `nodemon` 重新加载代码后，测试一些 URL 路径并确认默认的\
  \ `index.html` 和 `test.html` 仍然加载。同时，确保不存在的路径显示为空页且没有错误。\n\n## 错误处理\n\n还有最后一项工作。当找不到文件时，返回错误码比默默假装一切正常要好。为了做到这一点，你需要检测\
  \ `fs.readFile` 返回的是错误而不是文件。\n\n在 `index.js` 中，检查文件错误，如果发现错误，则写入 `404` 错误码：\n\n\n\
  \n\n\n```\nvar http = require('http');\nvar fs = require('fs');\nvar extract = require('./extract');\n\
  \nvar handleError = function (err, res) {\n  res.writeHead(404);\n  res.end();\n\
  };\n\nvar server = http.createServer(function (req, res) {\n  console.log('Responding\
  \ to a request.');\n  var filePath = extract(req.url);\n  fs.readFile(filePath,\
  \ function (err, data) {\n    if (err) {\n      handleError(err, res);\n      return;\n\
  \    } else {\n      res.end(data);\n    }\n  });\n});\nserver.listen(3000);\n```\n\
  \n保存你的更改。在 `nodemon` 重启后，访问一个不存在的路径，例如 `http://localhost:3000/woohoo`。在开发者工具中打开网络面板，你应该能看到错误代码，如图\
  \ 15.14 所示。\n\n图 15.14 网络面板中的 404 状态码\n\n![网络面板中的 404 状态码](img/woo-hoo-404.png)\n\
  \n在你的回调函数中，你第一件事是检查这个 `err` 参数是否具有非 `null` 或 `undefined` 的值，并对其进行处理。在这个示例中，你将错误信息传递给函数\
  \ `handleError`，然后通过 `return` 退出匿名回调。\n\n错误永远不应该被静默丢弃。目前一个简单的 `404` 就足够了，这正是 `handleError`\
  \ 所做的。\n\n这种模式——“错误优先，尽早返回”是 `Node` 生态系统的最佳实践之一。所有随 `Node` 一附的模块都遵循这一模式，大多数开源模块也是如此。\n\
  \n你仅用几十行 JavaScript，使用你已经熟悉的模式（如回调），就构建了一个运行良好的 Web 服务器。\n\n`Node` 提供了一系列丰富的模块用于处理网络和文件，例如你在此项目中使用的\
  \ `http` 和 `fs` 模块。得益于 `Node` 的 `require` 和 `module.exports` 关键字，你可以非常轻松地模块化自己的代码。\n\
  \n在接下来的三个章节中，你将继续构建 Chattrbox 服务器以及一个运行良好的前端。\n\n## 进阶探索：npm 模块注册表\n\n有很多可以通过 `npm`\
  \ 安装的包。你可以在模块注册表 [www.npmjs.com](https://www.npmjs.com) 中搜索或浏览这些包。\n\n务必查看 [docs.npmjs.com](https://docs.npmjs.com)\
  \ 上 `npm` 的文档。你可能对创建自己的模块供他人使用感兴趣。如果是，请参见 [docs.npmjs.com/getting-started/creating-node-modules](https://docs.npmjs.com/getting-started/creating-node-modules)。\n\
  \n## 青铜挑战：创建自定义错误页面\n\n当你访问一个不存在的文件路径时，目前你会得到一个空白浏览器页面和 404 状态码。\n\n对于这个挑战，创建一个特殊的错误页面显示给用户，而不是将错误作为状态码返回。\n\
  \n## 进阶探索：MIME 类型\n\n你是否好奇过计算机如何知道用视频播放器打开电影文件，用文档查看器打开 PDF 文件？你的计算机保存了一张文件类型以及与这些类型关联程序的表。它通过查看文件扩展名（例如\
  \ `.html` 或 `.pdf`）来推断文件的类型。\n\n浏览器也需要这些关联，以便它知道是将响应渲染为 HTML、使用插件播放音乐，还是将文件下载到硬盘。但\
  \ HTTP 响应没有文件扩展名。相反，服务器必须告诉浏览器响应中是什么类型的信息。\n\n它通过在响应的 `Content-Type` 头中指定 `MIME\
  \ type` 或 `media type` 来实现。例如图 15.15 显示了如果你检查 [www.bignerdranch.com](https://www.bignerdranch.com)\
  \ 的响应，在开发者工具网络面板看到的内容。\n\n图 15.15 在[`www.bignerdranch.com`](http://www.bignerdranch.com)\
  \ 上检查 Content-Type 头\n\n![在 www.bignerdranch.com 上检查 Content-Type 头](img/content-type.png)\n\
  \n`Content-Type` 头被设置为 `text/html` —— HTML 的 MIME 类型。如果你检查以下响应，你将在开发者工具的网络面板中看到这个内容：\n\
  \n```\nvar http = require('http');\nvar fs = require('fs');\nvar extract = require('./extract');\n\
  \nvar handleError = function (err, res) {\n  res.writeHead(404);\n  res.end();\n\
  };\n\nvar server = http.createServer(function (req, res) {\n  console.log('Responding\
  \ to a request.');\n  var filePath = extract(req.url);\n  fs.readFile(filePath,\
  \ function (err, data) {\n    if (err) {\n      handleError(err, res);\n      return;\n\
  \    } else {\n      res.setHeader('Content-Type', 'text/html');\n      res.end(data);\n\
  \    }\n  });\n});\nserver.listen(3000);\n```\n\n（注意你必须设置头部。）\n\n要了解更多关于 MIME 类型的信息，请查看\
  \ [en.wikipedia.org/wiki/Media_type](https://en.wikipedia.org/wiki/Media_type)。更多关于在\
  \ `Node` 程序中设置头部的信息，请访问 [nodejs.org/api/http.html#http_setheader](https://nodejs.org/api/http.html#http_setheader)。\n\
  \n## 白银挑战：动态提供 MIME 类型\n\n根据文件类型动态为你的响应提供 MIME 类型。为了帮助完成此任务，请使用 `npm` 安装 `mime`\
  \ 模块。关于 `mime` 模块的信息和文档可以在 [github.com/broofa/node-mime](https://github.com/broofa/node-mime)\
  \ 获取。\n\n向你的 `app` 文件夹添加不同类型，包括纯文本、PDF、音频文件。确保你的浏览器显示每类型。\n\n## 黄金挑战：将错误处理到独立模块\n\
  \n将处理读取和错误处理的代码移动到自己的模块中。\n\n此外，使该模块可配置，以便你在导入它时可以指定 HTML、CSS 和 JavaScript 所在的目录。\n\
  \n# 16 使用 WebSocket 进行实时通信\n\n对于每次数据交换，浏览器都需要发送新的请求并等待响应。正如你在前面的章节中学习的，Ajax 请求也是如此。虽然\
  \ Ajax 请求不会导致页面刷新，但它们产生的网络流量同样大，每个请求和响应都需要少量的开销。\n\n另一方面，WebSocket 提供了一种基于 HTTP\
  \ 的双向通信协议。它创建一个单个连接并保持开启以进行实时通信（图 16.1）。\n\n图 16.1 多个 Ajax 请求与单个 WebSocket 连接\n\n\
  ![多个 Ajax 请求与单个 WebSocket 连接](img/req-resp.png)\n\n通过 WebSocket，Web 应用可以超越保存和加载远程数据。推送通知、协作文档编辑和实时聊天只是开始。WebSocket\
  \ 使服务器处理物联网（例如智能灯、智能锁、智能汽车）负载成为可能。传统的 Ajax 轮技术在协调如此密集的流量时并不有效。\n\n\n\n\n在本章中，你将构建一个聊天客户端和服务器。如果你使用\
  \ Ajax 来构建此功能，你将不得不处理至少两个连接——一个用于轮询新消息，另一个用于发送消息。使用 WebSockets，你通过单个连接就可以实现相同的功能。\n\
  \n当你读到章节结束时，Chatrbox 将能够处理多个同时在线的聊天客户端，向每个客户端发送新消息（图 16.2）。\n\n**图 16.2  海盗聊天-arr**\n\
  \n![海盗聊天-arr](img/pirate-talk.png)\n\n## 设置 WebSockets\n\n要为 Chattrbox 配置 WebSockets，你将执行以下操作：\n\
  \n1. 安装 `ws` 模块\n2. 创建 WebSockets 服务器\n3. 为服务器添加聊天功能\n4. 通过让服务器向新用户发送消息历史来适应新用户\n\
  \n从基础开始。\n\nNode.js 自带的 `http` 模块为你提供了一种启动 HTTP 服务器的简单方法，以便浏览器可以与服务器通信。\n\n同样，`ws`\
  \ 模块为你的 Node.js 程序提供了一种通过 WebSockets 通信的简单方法。有多个模块为 Node.js 实现 WebSockets，但 `ws`\
  \ 是标准实现且性能良好。\n\n首先在你的 Chattrbox 目录中安装 `ws` WebSockets 模块。（如果你看到 `npm` 关于你的项目缺少描述或仓库字段的警告，请不要惊慌。）\n\
  \n```\nnpm install --save ws\n```\n\n接下来，在 Chattrbox 的根目录下创建一个名为 `websockets-server.js`\
  \ 的文件。添加以下代码来导入 `ws` 模块并开始监听。\n\n```javascript\nvar WebSocket = require('ws');\n\
  var WebSocketServer = WebSocket.Server;\nvar port = 3001;\nvar ws = new WebSocketServer({\n\
  \    port: port\n});\n\nconsole.log('websockets server started');\n```\n\n你通过 `require`\
  \ 语句导入了 `ws` 模块。该模块包含一个 `Server` 属性，你创建可工作的 WebSockets 服务器时需要它。\n\n代码 `var ws =\
  \ new WebSocketServer(/*...*/);` 正是这一操作。当它运行时，WebSockets 服务器将建立并绑定到指定的端口（这里是 `3001`）。\n\
  \n与你在 `extract.js` 中创建的模块不同，你不需要 `module.exports` 赋值。`websockets-server.js` 中的代码会在被导入时运行。它处理了所有与\
  \ WebSocket 相关的初始化和事件。\n\n现在你有了一个 WebSockets 服务器，你做的第一件事就是处理连接。在 `websockets-server.js`\
  \ 中，为你的 WebSockets 服务器的任何 `connection` 事件建立回调函数：\n\n```javascript\nvar WebSocket\
  \ = require('ws');\nvar WebSocketServer = WebSocket.Server;\nvar port = 3001;\n\
  var ws = new WebSocketServer({\n    port: port\n});\n\nconsole.log('websockets server\
  \ started');\n\nws.on('connection', function (socket) {\n  console.log('client connection\
  \ established');\n});\n```\n\n事件处理的语法与 jQuery 类似。你会发现许多 JavaScript 库（在 Node 和浏览器中）都使用这种风格。\n\
  \n你的事件处理器回调函数接受一个名为 `socket` 的单个参数。当客户端向你的 WebSockets 服务器建立连接时，你可以通过这个 `socket`\
  \ 对象访问该连接。\n\n在编写聊天服务器代码之前，你将设置服务器重复它发送给它的任何消息。这通常被称为回声服务器（echo server）。\n\n通过在\
  \ `websockets-server.js` 中为客户端连接生成的任何 `message` 事件注册回调，添加回声功能。\n\n```javascript\n\
  ...\nconsole.log('websockets server started');\n\nws.on('connection', function (socket)\
  \ {\n  console.log('client connection established');\n\n  socket.on('message', function\
  \ (data) {\n    console.log('message received: ' + data);\n    socket.send(data);\n\
  \  });\n});\n```\n\n你直接在 `socket` 对象上注册了事件处理器。你的 `message` 事件回调函数会接收客户端发送的任何信息。目前，你只是简单地将其\
  \ `send` 回同一个 `socket` 连接。\n\n稍后你就能看到它的运行效果了。\n\n你可以通过命令 `node websockets-server.js`\
  \ 单独运行你的 WebSockets 服务器，但将其连接到 `index.js` 同样简单。这样做的好处是利用利用 `nodemon` 在在你修改 `websockets-server.js`\
  \ 或 `index.js` 时自动重载代码。\n\n在 `index.js` 顶部添加一个 `require` 语句来导入 `websockets-server`\
  \ 模块。\n\n```javascript\nvar http = require('http');\nvar fs = require('fs');\nvar\
  \ extract = require('./extract');\nvar wss = require('./websockets-server');\n...\n\
  ```\n\n保存文件，`nodemon` 就会重载你的代码。\n\n## 测试你的 Sockets 服务器\n\n测试服务器的一种简单方法是使用 `wscat`。`wscat`\
  \ 是一个用于连接并与 WebSockets 服务器通信的命令行程序。\n\n打开终端窗口并全局安装 `wscat`。（你可能需要以管理员权限运行此命令。）\n\
  \n```bash\nnpm install -g wscat\n```\n\n安装 `wscat` 后，你就可以准备好连接到你的 WebSockets 服务器了。在第二个窗口中，运行命令\
  \ `wscat -c ws://localhost:3001`。你应该会在第二个窗口看到 `connected (CTRL+C to quit)`。\n\n\
  在第二个窗口中输入一些文本并按回车键。每当你输入文本，WebSockets 服务器都会重复它，如图 16.3 所示。\n\n**图 16.3  使用 wscat\
  \ 测试服务器**\n\n![使用 wscat 测试服务器](img/echo.png)\n\n## 创建聊天服务器功能\n\n现在你已经确认可以通过 WebSockets\
  \ 通信，是时候添加驱动 Chattrbox 聊天的真实功能了。你的聊天服务器需要做：\n\n* 记录发送到服务器的消息\n* 为加入聊天的人广播旧消息\n*\
  \ 向所有客户端广播新消息\n\n记录用户发送的消息对于向新用户发送消息历史是必要的，因此你首先处理这个问题。\n\n在 `websockets-server.js`\
  \ 中，创建一个数组来存放消息。\n\n```javascript\nvar WebSocket = require('ws');\nvar WebSocketServer\
  \ = WebSocket.Server;\nvar port = 3001;\nvar ws = new WebSocketServer({\n    port:\
  \ port\n});\nvar messages = [];\n\nconsole.log('websockets server started');\n...\n\
  ```\n\n如果你创建一个更健壮的聊天系统，你可能会将消息存储在数据库中。目前，一个简单的数组就可以了。\n\n接下来，调用 `messages.push(data)`\
  \ 在每个新消息到达时将其添加到你的数组中。\n\n```javascript\n...\nws.on('connection', function (socket)\
  \ {\n  console.log('client connection established');\n\n  socket.on('message', function\
  \ (data) {\n    console.log('message received: ' + data);\n    messages.push(data);\n\
  \    socket.send(data);\n  });\n});\n```\n\n就这样，你拥有了一个包含聊天服务器接收到的消息的数组。\n\n\n\n\n\
  下一步是允许新用户看到所有之前的消息。更新 `websockets-server.js` 中的连接事件处理程序，在每个新连接建立时，将所有旧消息发送给该连接。\n\
  \n```\n...\nws.on('connection', function (socket) {\n  console.log('client connection\
  \ established');\n\n  messages.forEach(function (msg) {\n    socket.send(msg);\n\
  \  });\n\n  socket.on('message', function (data) {\n    console.log('message received:\
  \ ' + data);\n    messages.push(data);\n    socket.send(data);\n  });\n});\n```\n\
  \n一旦建立连接，服务器就会遍历消息并将每条消息发送给新连接。\n\n最后的工作是在每有一条新消息进入时，将其发送给所有用户。WebSockets 会为你跟踪已连接的用户。在\
  \ `websockets-server.js` 中使用此机制来广播你收到的消息。\n\n```\n...\nws.on('connection', function\
  \ (socket) {\n  console.log('client connection established');\n\n  messages.forEach(function\
  \ (msg) {\n    socket.send(msg);\n  });\n\n  socket.on('message', function (data)\
  \ {\n    console.log('message received: ' + data);\n    messages.push(data);\n \
  \   ws.clients.forEach(function (clientSocket) {\n      clientSocket.send(data)\n\
  \    });\n\n    socket.send(data);\n  });\n});\n```\n\n`ws` 对象通过其 `clients` 属性跟踪所有连接。它是一个你可以遍历的数组。在你的迭代器回调中，你只需要\
  \ `send` 消息数据即可。\n\n最后，由于你在遍历所有 socket 时，最终会把消息发送给你自己的 socket，因此你不再需要调用 `socket.send(data)`。删除该调用会让代码变得非常整洁。\n\
  \n## 第一次聊天！\n\n让我们测试一下新功能。确保 `nodemon` 已经重新加载了你的代码。（如果需要，你可以用 Control-C 手动停止 `nodemon`\
  \ 并使用 `npm run dev` 重新启动。）\n\n打开第三个终端窗口并运行命令 `wscat -c http://localhost:3001`。（你应该有一个终端运行\
  \ `nodemon`，另外两个终端运行 `wscat`。）在连接到服务器的两个窗口中输入一些聊天消息。\n\n在你和自己聊了一会儿后，打开第四个终端并运行 `wscat\
  \ -c http://localhost:3001`。这个聊天客户端应该收到所有之前的消息。\n\n如果一切顺利，你应该能看到类似图 16.4 所示的内容。\n\
  \n**图 16.4 与朋友聊天**\n\n![与朋友聊天](img/breaking-bad-chat.png)\n\n恭喜你！你使用 WebSockets\
  \ 编写了一个功能完整的聊天服务器——而且只用了不到二十行 JavaScript 代码。\n\n## 给更有好奇的人：socket.io WebSockets\
  \ 库\n\n`ws` `npm` 模块是一个非常好的 WebSockets 实现。但诚然，它在某些方面有所缺失。例如，WebSockets 连接有时会断，但\
  \ `ws` 模块没有提供自动重连的方法。\n\n另一个问题是 `ws` 运行在 `Node.js` 中。这意味着它只在服务器可用。在你的客户端 JavaScript\
  \ 中，你需要学习一个完全不同的库来实现本质相同的任务。\n\n此外，在客户端你可能面临额外的挑战：如果你的浏览器很旧且不支持 WebSockets 可能会怎么办？你需要提供某种回退机制。\n\
  \n`socket.io` ([socket.io](http://socket.io)) 为这些问题提供了解决方案。对于浏览器，它提供了向后兼容的回退 方案，包括一个\
  \ Flash 实现。此外，它还被移植到了许多其他平台，包括 iOS 和 Android。\n\n## 给更有好奇的人：作为服务的 WebSockets\n\n\
  如果你对实时平台即服务感兴趣，你可能想研究一下 `firebase` ([www.firebase.com](https://www.firebase.com/))。如果说\
  \ `socket.io` 尝试让编写服务器变得更容易，`firebase` 更进了一步：它为你提供了整个服务器，包括客户端共享和同步数据的机制。`firebase`\
  \ 为 Web、iOS 和 Android 提供了解决方案。\n\n## 铜级挑战：我在重复吗？\n\n更新你的 `message` 处理程序，使得每条收到的消息都发送给用户两次。\n\
  \n使用 `wscat` 进行测试并确认每条消息都重复了。\n\n为了达到非常有趣的效果，每发送一条新消息时，重复次数加一。\n\n## 银级挑战：Speakeasy\n\
  \n在美国，20 世纪 20 年代生产或销售酒精是非法的。作为回应，出现了许多“speakeasies”（地下酒吧）：这些是销售酒精类饮料的秘密场所，在顾客允许进入之前需要密码。\n\
