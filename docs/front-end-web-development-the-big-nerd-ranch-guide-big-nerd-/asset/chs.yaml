  \ alt=\"\">\n    <span class=\"detail-image-title\" data-image-role=\"title\">Stayin'\
  \ Alive</</span>\n        </div>\n      </div>\n...\n```\n\n你的 JavaScript 代码可以引用这些数据属性来访问特定的元素，因为浏览器允许你使用\
  \ JavaScript 对页面内容进行查询。例如，你可以查询匹配选择器（如 `data-image-role=\"trigger\"`）的元素。如果查询找到结果，它将返回匹配元素的引用。\n\
  \n当你拥有元素的引用时，可以对该元素进行任何操作。你可以读取或更改其属性值，更改其内部文本，甚至访问它周围的元素。当你使用引用更改元素时，浏览器会立即更新。\n\
  \n在本章中，你将编写 JavaScript 代码，获取锚元素和详情元素的引用，从锚的数据属性中读取值，然后更改详情图像的 `src` 属性值。这就是你让 Ottergram\
  \ 交互起来的方法。\n\n\n\n在开始编写 JavaScript 之前，你的 HTML 还需要进行最后一次修改：你需要告诉 HTML 去运行 JavaScript。在\
  \ `index.html` 中添加一个 `<script>` 标签来实现。此 `<script>` 标签将引用 `scripts/main.js` 文件，该文件稍后就会创建。\n\
  \n```\n...\n        </div>\n      </div>\n    </main>\n    <script src=\"scripts/main.js\"\
  \ charset=\"utf-8\"></script>\n  </body>\n</html>\n```\n\n当浏览器看到 `<script>` 标签时，它会立即开始引用文件中的代码。在浏览器渲染\
  \ HTML 之前，JavaScript 无法访问 HTML 中的内部元素，因此将 `<script>` 标签放在 `body` 的底部可以确保 JavaScript\
  \ 在所有标记解析完成后才运行。\n\n你的 HTML 现在已经准备好与你即将编写的 JavaScript 连接了。在继续之前，请务必保存 `index.html`。\n\
  \n## 你的第一个脚本\n\n是时候创建一个 `scripts` 文件夹和 `main.js` 文件了。回想，你可以在 `Atom` 编辑器内部创建文件夹。在左侧面板中\
  \ Control-点击（右键点击）`ottergram`，并在弹出窗口中点击 `New Folder`。在出现的提示框中输入名称 `scripts`。\n\n\
  然后，在左侧面板中 Control-点击（右键点击）`scripts` 并选择 `New File`。提示框会自动填充文本 `scripts/`。之后，输入 `main.js`\
  \ 并按回车键。\n\n确保你的文件夹结构类似于图 6.3。\n\n**图 6.3 Ottergram 文件夹结构**\n\n![Ottergram 文件夹结构](img/functions-file-structure.png)\n\
  \n`main.js` 这个名字对浏览器来说没有特殊意义，它是许多前端开发者使用的常用约定。\n\n在深入研究 JavaScript 之前，还有最后一件事。你需要启动\
  \ `browser-sync`，为此你需要稍微修改你一直使用的命令：\n\n```\nbrowser-sync start --server --browser\
  \ \"Google Chrome\"\n                   --files \"*.html, stylesheets/*.css, scripts/*.js\"\
  \n```\n\n你在文件列表中添加了 `scripts/*.js` 路径，以便 `browser-sync` 不仅监听 HTML 和 CSS 的变化，还会监听\
  \ JavaScript 的变化。\n\n## Ottergram JavaScript 概述\n\n在开始编写代码之前，有一个计划总是是好的。以下是你对 Ottergram\
  \ 需要执行的操作的白话版本：\n\n1. 获取所有缩略图。\n2. 监听每个缩略图的点击事件。\n3. 如果发生点击，则使用该缩略图的信息更新详细图。\n\n\
  你可以将第 3 点分为三个子部分：\n\n1. 从缩略图的数据属性（data attribute）中获取图像 URL。\n2. 从缩略图的数据属性中获取标题文本。\n\
  3. 在详细图中设置图像和标题。\n\n以下是图图形式表示的相同计划（图 6.4）：\n\n**图 6.4 Ottergram 执行计划**\n\n![Ottergram\
  \ 的执行计划](img/process-diagram.png)\n\n本章将带你从最后一步开始创建代码。这是一种“自底而上”的方法，在编写 JavaScript\
  \ 时效果很好。\n\n## 声明字符串变量\n\n你的第一个 JavaScript 任务是为你添加到标记的每个数据属性创建字符串变量。（如果对这些术语不熟悉，请不要担心——我们稍后我们会解释。）\n\
  \n在 `main.js` 的顶端，首先添加一个名为 `DETAIL_IMAGE_SELECTOR` 的变量，并为其赋值字符串 `'[data-image-role=\"\
  target\"]'`。\n\n```\nvar DETAIL_IMAGE_SELECTOR = '[data-image-role=\"target\"]';\n\
  ```\n\n这段代码可能并不多，但值得仔细观察。让我们从中间的 `=` 符号开始。这是一个赋值运算符。与数学中不同，JavaScript 中的 `=` 符号并不意味着两个东西相等。相反，它意味着“获取右侧的值并将其命名为左侧的名字”。\n\
  \n在这个特定赋值的右侧是一个文本字符串：`'[data-image-role=\"target\"]'`。字符串只是表示文本的字符序列，由单引号界定。单引号内的文本恰好是你的详细图的属性选择器。这提示你将使用此字符串来访问该元素。\n\
  \n赋值的左侧是变量声明。使用 `var` 关键字，你正在创建一个名为 `DETAIL_IMAGE_SELECTOR` 的变量。接下来，在 `main.js`\
  \ 中为详细标题和缩略图选择器声明变量。为它们分配字符串。\n\n```\nvar DETAIL_IMAGE_SELECTOR = '[data-image-role=\"\
  target\"]';\nvar DETAIL_TITLE_SELECTOR = '[data-image-role=\"title\"]';\nvar THUMBNAIL_LINK_SELECTOR\
  \ = '[data-image-role=\"trigger\"]';\n```\n\n正如变量名所示，它们的值可以重新赋值。使用全大写字母写变量是一种在值不应改变时有时使用的约定。其他语言有常量来实现此目的。JavaScript\
  \ 正处于过渡阶段：ES5 没有常量；ES6 有——在常量得到良好支持之前，你可以遵循这一约定来标记不应改变的值。\n\n顺便说，字符串可以用单引号或双引号界定。你可以自由使用任何一种，但本书将使用单引号作为约定，我们建议你至少在本书项目中这样做。\n\
  \n如果你想使用双引号，必须对字符串中的任何双引号进行转义，以免浏览器将其错误解析为代码的一部分。要转义一个字符，在其前面加上反斜杠，例如：\n\n```\n\
  var DETAIL_IMAGE_SELECTOR = \"[data-image-role=\\\"target\\\"]\";\n```\n\n使用单引号并不能保证不需要转义字符。如果由单引号界定的字符串包含单引号或撇号，你必须对其进行转义。\n\
  \n保存 `main.js`。有了这些变量，让我们在 Chrome 开发者工具中尝试它们。\n\n## 在控制台中工作\n\n开发者工具最有用的部分之一是控制台，它让你输入\
  \ JavaScript 代码并立即进行评估。这对于迭代开发修改页面的 JavaScript 代码特别有用。\n\n在开发者工具中，点击 `Elements`\
  \ 标签右侧的 `Console` 标签（图 6.5）。\n\n**图 6.5 选择控制台**\n\n![选择控制台](img/console-tab-next-to-elements.png)\n\
  \n控制台有一个提示符，你可以在其中输入代码行。点击 ![prompt](img/console-prompt-arrow.png) 符号右侧，以便控制台准备好输入（图\
  \ 6.6）。\n\n**图 6.6 控制台准备好输入**\n\n\n\n\n![控制台，已准备好输入](img/console-prompt.png)\n\n\
  在控制台中输入以下数学表达式：\n\n```\n137 + 349\n```\n\n按下 Return 键。控制台将打印出结果 (图 6.7。\n\n**图 6.7 评估一个数学表达式**\n\
  \n![评估一个数学表达式](img/math-1.png)\n\n控制台的主要工作是用最简单的语言告诉你你所输入代码的值。\n\n就像生活中的许多事情一样，顺序非常重要。如果你需要将某些项目作为一个组进行评估，可以在它们周围包裹圆括号。（这比记住\
  \ JavaScript 在不使用括号的情况下执行这些操作的顺序要容易得多。）在控制台中输入以下表达式：\n\n```\n3 * ( (2 * 4) + (3\
  \ + 5) )\n```\n\n按下 Return 键，控制台将按照正确的顺序计算数字 (图 6.8。（顺便说一下，虽然为了可读性我们在数字和运算符之间添加了空格，但你不需要包含它们。控制台不在乎。）\n\
  \n**图 6.8 评估一个更复杂的数学表达式**\n\n![评估一个更复杂的数学表达式](img/math-2.png)\n\n现在，来使用你的变量。你可以通过点击控制台面板左角的![评估一个更复杂的数学表达式](img/clear-console.png)\
  \ 图标或使用快捷键 Command-K (Ctrl-K) 来清除控制台的内容。\n\n开始输入 `DETAIL_IMAGE_SELECTOR`。当你输入前几个字母时，你可以看到控制台已经知道你创建的变量，并提供了一系列自动补全建议\
  \ (图 6.9）。\n\n**图 6.9 控制台的自动补全菜单**\n\n![控制台的自动补全菜单](img/console-autocomplete-menu.png)\n\
  \n按下 Tab 键，让控制台为你自动完成变量名。当你按下 Return 键时，控制台报告 `DETAIL_IMAGE_SELECTOR` 的值为字符串 `\"\
  [data-image-role=\"target\"]\"` 。\n\n**图 6.10 控制台打印变量的值**\n\n![控制台打印变量的值](img/variable-value-printed-to-console.png)\n\
  \n（控制台总是用双引号打印字符串，尽管你实际上在 `main.js` 中使用了单引号。）\n\n字符串是 JavaScript 中五种原始值类型之一。（数字和布尔值是另外两个。）它们之所以被称为“原始的”，是因为它们代表了简单的值。这与\
  \ JavaScript 中更复杂的值形成对比，你接下来将学习那些值。\n\n## 访问 DOM 元素\n\n你刚刚看到控制台允许你访问创建的变量。我们之前说过，这些变量可以用于访问页面上的元素。你现在可以尝试一下。在控制台中输入以下：\n\
  \n```\ndocument.querySelector(DETAIL_IMAGE_SELECTOR);\n```\n\n按下 Return 键。它将向你显示详情图片的\
  \ HTML。在控制台中悬停在这些 HTML 上。你会发现页面上的详情图片被高亮了，就像你在元素面板中点击 HTML 一样 (图 6.11）。\n\n**图 6.11 控制台中的\
  \ HTML 与页面上的元素对应**\n\n![控制台中的 HTML 与页面上的元素对应](img/console-dom-query-hover.png)\n\
  \n在你在控制台中写的代码行中，`document` 一词是浏览器内置的变量，它让你能够访问网页。它的值不是原始类型之一。它是一个复杂值，类型为对象（object）。\n\
  \n`document` 对象对应于整个页面。它提供了许多方法来获取页面上元素的引用。方法是函数的一种（它们具有显式指定所有者的函数，但你现在不需要担心那个细节）——浏览器需要遵循的一系列步骤列表。你在控制台中输入的代码行中使用了\
  \ `querySelector` 方法。`document.querySelector` 中的点运算符（即句号）是你访问对象方法的方式。\n\n你要求 `document`\
  \ 使用其 `querySelector` 方法来寻找匹配字符串 `'[data-image-role=\"target\"]'` 的任何元素。`querySelector`\
  \ 返回了它找到的元素的引用，即详情图片 (图 6.12。\n\n**图 6.12�通过 document.querySelector 提供的页面访问**\n\n\
  ![通过 document.querySelector 提供的页面访问](img/document-correspondence.png)\n\n现在，一点术语。你并没有真正向页面“询问”匹配的元素。当你调用一个方法时，你是在让它执行设计的任务。你通常需要向它传递执行所需的信息，你将其放在方法名称后的括号中。记得\
  \ `DETAIL_IMAGE_SELECTOR` 被赋值为 `'[data-image-role=\"target\"]'`，这意味着这就是传递给 `querySelector`\
  \ 的内容。\n\n在内部，`querySelector` 使用此字符串搜索匹配项。当它搜索时，`document` 并没有实际搜索页面，而是在文档对象模型（DOM）。DOM\
  \ 是浏览器对 HTML 文档的内部表示。它在读取和解释 HTML 时构建这种表示。\n\n在 JavaScript 中，你可以使用 `document` 对象及其方法（如\
  \ `querySelector`）与 DOM 交互。对于每个 HTML 标签，DOM 中都有一个对应的元素，你可以使用 JavaScript 与这些任何元素进行交互。（通常，当我们提到“元素”时，指的是“DOM\
  \ 元素”）。\n\n在控制台中，再次调用 `document.querySelector` 并传递 `DETAIL_IMAGE_SELECTOR` 以获取详情元素的引用。但这次，将该引用赋值一个名为\
  \ `detailImage` 的新变量：\n\n```\nvar detailImage = document.querySelector(DETAIL_IMAGE_SELECTOR);\n\
  ```\n\n按下 Return，控制台将打印 `undefined` (图 6.13)。不要惊慌！这不是错误。控制台只是在执行它的工作，告诉你声明变量没有产生结果的值。\n\
  \n**图 6.13 在控制台中声明变量**\n\n![在控制台中声明变量](img/declaring-var-in-console.png)\n\n在 JavaScript\
  \ 中，值的的缺失用关键字 `undefined` 表示。\n\n\n\n\n这并不意味着你的 `detailImage` 变量没有被赋值。要检查它，只需在控制台中输入\
  \ `detailImage` 并按回车键。你将看到详情图的 HTML 表示，就像你输入 `document.querySelector(DETAIL_IMAGE_SELECTOR)`\
  \ 时看到的一样（图 6.14）。\n\n**图 6.14 检查 `detailImage` 的值**\n\n![Checking the value of detailImage](img/detail-image-assigned.png)\n\
  \n### 这一切目的是什么？通过给变量赋值引用，你可以在需要引用该元素时随时使用变量名。现在，你不需要每次都输入 `document.querySelector(DETAIL_IMAGE_SELECTOR)`，只需输入\
  \ `detailImage` 即可。\n\n当你拥有详情图的引用时，很容易更改它的 `src` 属性值。在控制台中，将 `detailImage.src` 赋值为字符串\
  \ `'img/otter2.jpg'`。\n\n```\ndetailImage.src = 'img/otter2.jpg';\n```\n\n使用点运算符，你访问了\
  \ `detailImage` 对象的 `src` 属性。属性类似于变量，但它属于一个特定的对象。当你将 `src` 赋值（或 `set`）为字符串 `'img/otter2.jpg'`\
  \ 时，你会另一只海獭占据了详情图区域（图 6.15）。\n\n**图 6.15 设置详情图的 `src` 属性**\n\n![Setting the src\
  \ property of the detail image](img/detail-img-src-otter2.png)\n\n`src` 属性对应于 `index.html`\
  \ 中 `<img>` 标签的 `src` 属性。由于这种关系，实现相同结果另一种方法是使用 `detailImage` 的 `setAttribute` 方法。\n\
  \n在控制台中调用此方法并传递两个字符串：属性名和新值。\n\n```\ndetailImage.setAttribute('src', 'img/otter3.jpg');\n\
  ```\n\n详情图再次发生了变化（图 6.16）。\n\n**图 6.16 使用 `setAttribute` 更改图像**\n\n![Using setAttribute\
  \ to change the image](img/detail-image-set-attribute.png)\n\n你现在拥有了创建自动化更改详情图方法的所有部分。准备好编写你的第一个函数吧！\n\
  \n## 编写 setDetails 函数\n\n你一直在使用方法，并看到它们可以被调用以运行一段代码。函数和方法实际上只是你想要反复使用的步骤列表。调用一个函数就像说“做个三明治”，而不是说“铺开两片面包。在一片面包上放上火腿、萨拉米和普罗沃奶酪。在上面上另一片面包。”\n\
  \n在本章中为 Ottergram 写七个函数。你的第一个函数将完成两件事：更改详情图和详情图标题。将此函数声明添加到 `main.js` 中。\n\n```\n\
  var DETAIL_IMAGE_SELECTOR = '[data-image-role=\"target\"]';\nvar DETAIL_TITLE_SELECTOR\
  \ = '[data-image-role=\"title\"]';\nvar THUMBNAIL_LINK_SELECTOR = '[data-image-role=\"\
  trigger\"]';\n\nfunction setDetails() {\n  'use strict';\n  // Code will go here\n\
  }\n```\n\n你使用 `function` 关键字声明了一个名为 `setDetails` 的函数。在声明函数时，名称后面总是跟着一对括号。但它们并不是名称的一部分——很快就会发现它们的作用了。\n\
  \n括号之后是一对大括号。大括号内部是函数的体。函数体将包含函数需要执行的步骤。这些步骤更正式地称为语句（statements）。\n\n你函数的第一行是字符串\
  \ `'use strict';`。你将在所有函数的开头使用这个字符串，告诉浏览器它们符合最新版本的 JavaScript 标准。（关于严格模式的更多信息，请参阅本章末尾的“好奇者”部分。）\n\
  \n`setDetails` 函数中的另一行是注释。像 CSS 注释一样，浏览器会忽略 JavaScript 注释，但对开发者有用。单行 JavaScript\
  \ 注释可以这样写，使用 `//`。对于跨行注释，你可以使用 `/* */` 样式。这两种在 JavaScript 中都是正确的。\n\n在控制台中，你已经尝试了更改详情图中照片所需的所有语句。回到控制台并按向上方向键。你将看到最近输入的语句被复制在提示符处。向上和向下方向键允许你在语句历史中向后和向前移动。\n\
  \n使用方向键找到获取详情图引用的语句：`var detailImage = document.querySelector(DETAIL_IMAGE_SELECTOR);`。从控制台中复制此行并将其粘贴到\
  \ `main.js` 中替换注释。然后，从控制台中复制并粘贴调用 `detailImage.setAttribute` 方法的行：`detailImage.setAttribute('src',\
  \ 'img/otter3.jpg');`。\n\n你在 `main.js` 中的 `setDetails` 函数看起来应该是这样：\n\n```\n...\n\
  function setDetails() {\n  'use strict';\n  // Code will go here\n  var detailImage\
  \ = document.querySelector(DETAIL_IMAGE_SELECTOR);\n  detailImage.setAttribute('src',\
  \ 'img/otter3.jpg');\n}\n```\n\n保存 `main.js` 并返回控制台。输入以下内容并回车运行你的 `setDetails` 函数。\n\
  \n```\nsetDetails();\n```\n\n输入——或调用——函数名后紧跟括号，会使函数执行其体中的所有代码。你应该看到 `img/otter3.jpg`\
  \ 现在显示为详情图（图 6.17）。\n\n**图 6.17 运行 `setDetails` 更改图像**\n\n![Running setDetails to\
  \ change the image](img/presto-chango.png)\n\n`setDetails` 更改了详情图，但没有更改详情图标题。你想让它执行两个。就像处理详情图一样，你添加语句来获取元素的引用并更改元素的属性。\n\
  \n在 `main.js` 的 `setDetails` 函数中，再次调用 `document.querySelector` 并传递 `DETAIL_TITLE_SELECTOR`。将结果赋值给名为\
  \ `detailTitle` 的新变量。然后将它的 `textContent` 属性设置为 `'You Should Be Dancing'`。\n\n```\n\
  ...\nfunction setDetails() {\n  'use strict';\n  var detailImage = document.querySelector(DETAIL_IMAGE_SELECTOR);\n\
  \  detailImage.setAttribute('src', 'img/otter3.jpg');\n\n  var detailTitle = document.querySelector(DETAIL_TITLE_SELECTOR);\n\
  \  detailTitle.textContent = 'You Should Be Dancing';\n}\n```\n\n`textContent` 属性是元素内部的文本（不包括\
  \ HTML 标签）。\n\n保存你的更改并在控制台中运行 `setDetails`。现在图像和标题发生了变化（图 6.18）。\n\n**图 6.18 使用\
  \ `setDetails` 更改图像和标题**\n\n\n\n\n\n![使用 setDetails 修改图片和标题](img/set-details-img-and-title.png)\n\
  \n### 通过声明参数接收参数\n\n`setDetails` 负责更改详细信息图片和标题的工作。但每当你运行它时，它都会将图片的 `src` 设置为 `'img/otter3.jpg'`，并将标题的\
  \ `textContent` 设置为 `'You Should Be Dancing'`。如果你想使用其他的图片和文本怎么办？\n\n你需要一种方法在调用 `setDetails`\
  \ 时告诉它应该使用**哪张**图片和**什么**文本。\n\n为了实现这一点，你需要让你的函数接受 `arguments`（参数）——这些是传递给函数并供其处理的值。为了做到这一点，你需要在函数声明中指定\
  \ `parameters`（参数）。\n\n在 `main.js` 中为 `setDetails` 添加两个参数：\n\n```javascript\n...\n\
  function setDetails(imageUrl, titleText) {\n  'use strict';\n  var detailImage =\
  \ document.querySelector(DETAIL_IMAGE_SELECTOR);\n  detailImage.setAttribute('src',\
  \ 'img/otter3.jpg');\n\n  var detailTitle = document.querySelector(DETAIL_TITLE_SELECTOR);\n\
  \  detailTitle.textContent = 'You Should Be Dancing';\n}\n```\n\n现在，用这些参数替换 `'img/otter3.jpg'`\
  \ 和 `'You should Be Dancing'`：\n\n```javascript\n...\nfunction setDetails(imageUrl,\
  \ titleText) {\n  'use strict';\n  var detailImage = document.querySelector(DETAIL_IMAGE_SELECTOR);\n\
  \  detailImage.setAttribute('src', 'img/otter3.jpg');\n  detailImage.setAttribute('src',\
  \ imageUrl);\n\n  var detailTitle = document.querySelector(DETAIL_TITLE_SELECTOR);\n\
  \  detailTitle.textContent = 'You Should Be Dancing';\n  detailTitle.textContent\
  \ = titleText;\n}\n```\n\n你的两个参数 `imageUrl` 和 `titleText` 被用作标签赋值给传递给 `setDetails`\
  \ 的值。保存 `main.js` 并在控制台中尝试运行，以查看效果。\n\n调用 `setDetails` 并向它传递值 `'img/otter4.jpg'`\
  \ 和 `'Night Fever'`。（确保它们之间之间有一个逗号。）\n\n```javascript\nsetDetails('img/otter4.jpg',\
  \ 'Night Fever');\n```\n\n你应该能看到新的图片和标题文本，如 图 6.19 所示。\n\n**图 6.19 向 `setDetails`\
  \ 传递值**\n\n![向 setDetails 传递值](img/set-details-with-args.png)\n\n参数（arguments）和形参（parameters）之间存在重要的区别。`参数被定义为函数的一部分。`在\
  \ JavaScript 中，参数与在函数体内部声明的变量完全一样。`参数是在调用函数时提供给函数的值。`\n\n此外，请注意，无论你为参数使用什么变量名，它们的值始终映射到参数名上，以便它们可以在函数体内部使用。例如，假设你为图片\
  \ URL 和标题文本使用了变量。当你调用 `setDetails` 时，你将这两个变量作为参数传递。\n\n```javascript\nvar otterOneImage\
  \ = 'img/otter1.jpg';\nvar otterOneTitle = 'Stayin\\' Alive';\n\nsetDetails(otterOneImage,\
  \ otterOneTitle);\n```\n\n`setDetails` 函数接收这些值，用参数名 `imageUrl` 和 `titleText` 对其进行标记，然后运行其体内部的代码。该代码使用\
  \ `imageUrl` 和 `titleText`，并将它们作为参数传递给 `document.querySelector`。\n\n就像变量名一样，参数名只是值的标签。你可以使用任何喜欢的参数名，但像你在这里这样做，使用描述性名称是一个良好的习惯，可以使你的代码更易于阅读和维护。\n\
  \n### 函数的返回值\n\n你已经完成了计划中的第一项（或者说，最后一项），并在此过程中学了一些 JavaScript 知识。现在你将处理列表中的接两项：从缩略图中获取图片和标题。对于每一项，你将编写一个新函数。\n\
  \n在 `main.js` 中为 `imageFromThumb` 添加一个函数声明。它将接受一个参数 `thumbnail`，它是缩略图锚元素的引用。它将获取并返回\
  \ `data-image-url` 属性的值。\n\n```javascript\n...\nfunction setDetails(imageUrl, titleText)\
  \ {\n  ...\n}\n\nfunction imageFromThumb(thumbnail) {\n  'use strict';\n  return\
  \ thumbnail.getAttribute('data-image-url');\n}\n```\n\n`getAttribute` 方法的作用与 `setDetails`\
  \ 函数中使用的 `setAttribute` 方法相反。它只接受一个参数，即属性名称。\n\n与 `setDetails` 不同，`imageFromThumb`\
  \ 函数使用了 `return` 关键字。当你调用带有 `return` 语句的函数时，它会返回一个值。`querySelector` 就是这样一个例子。\n\n\
  保存 `main.js`로控制台中尝试以下内容，并在行之间执行。\n\n```javascript\nvar firstThumbnail = document.querySelector(THUMBNAIL_SELECTOR);\n\
  imageFromThumb(firstThumbnail);\n```\n\n控制台报告返回值为 `\"img/otter1.jpg\"`，因为 `imageFromThumb`\
  \ 返回了缩略图的 `data-image-url`。\n\n**图 6.20 从 `imageFromThumb` 返回的值**\n\n![从 imageFromThumb\
  \ 返回的值](img/value-returned-from-thumb)\n\n注意，`return` 语句之后的任何语句都不会执行。`return` 语句会有效地停止运行中的函数。\n\
  \n下一个要编写的函数是接收缩略图元素并返回标题文本的函数。\n\n在 `main.js` 中为 `titleFromThumb` 添加函数声明，并带有 `thumbnail`\
  \ 参数。它将返回 `data-image-title` 属性的值。\n\n```javascript\n...\nfunction imageFromThumb(thumbnail)\
  \ {\n  ...\n}\n\nfunction titleFromThumb(thumbnail) {\n  'use strict';\n  return\
  \ thumbnail.getAttribute('data-image-title');\n}\n```\n\n保存 `main.js` 并在控制台中测试此函数：\n\
  \n```javascript\nvar firstThumbnail = document.querySelector(THUMBNAIL_SELECTOR);\n\
  titleFromThumb(firstThumbnail);\n```\n\n**图 6.21 从 `titleFromThumb` 返回的值**\n\n![从\
  \ titleFromThumb 返回的值](img/value-returned-from-title-from-thumb.png)\n\n下一个要编写的函数为了方便将其他三个函数结合在一起，你就不需要单独调用它们。它将接受缩略图元素的引用，然后调用\
  \ `setDetails`，传递调用 `imageFromThumb` 和 `titleFromThumb` 得到的值。\n\n在 `main.js` 中添加\
  \ `setDetailsFromThumb`。\n\n```javascript\n...\nfunction titleFromThumb(thumbnail)\
  \ {\n  ...\n}\n\nfunction setDetailsFromThumb(thumbnail) {\n  'use strict';\n  setDetails(imageFromThumb(thumbnail),\
  \ titleFromThumb(thumbnail));\n}\n```\n\n注意 `setDetails` 在调用时带有两个参数，而这些参数也是函数调用。这是如何运作的？\n\
  \n\n\n\n在 `setDetails` 实际调用之前，其参数会被简化为它们的最值。首先，`imageFromThumb(thumbnail)` 运行并返回一个值。然后，`titleFromThumb(thumbnail)`\
  \ 运行并返回一个值。最后，使用 `imageFromThumb(thumbnail)` 和 `titleFromThumb(thumbnail)` 返回的值来调用\
  \ `setDetails`。图 6.22 显示了这一过程。\n\n**图 6.22 作为参数的函数调用**\n\n![作为参数的函数调用](img/nested-function-call.png)\n\
  \n保存 `main.js`。你已经完成了所有代码，用于从缩略图中获取 `data-attribute` 值，并使用这些值来更新详情图像和标题显示的内容。\n\n\
  从底层操作向上，下一步要做的是编写代码，当用户点击缩略图时，执行从缩略图到详情的数据传输。\n\n## 添加事件监听器\n\n浏览器是忙碌的软件。每一次触摸、点击、滚动和按键都会被浏览器注意到。这些中的每一个都是浏览器可能会响应的\
  \ `event`。为了让网站更具动态性和交互性，你可以在这些事件之一发生时触发你自己的代码。在本节中，你将为每个缩略图添加 `event listeners`。\n\
  \n事件监听器是一个对象，正如其名所示，它“监听”特定的事件，例如鼠标点击。当分配的事件发生时，事件监听器会响应该事件触发函数调用。\n\n（鼠标事件（如点击和双击）以及键盘事件（如按键）是最常见的事件类型。要查看事件完整列表，请检查\
  \ MDN 中的事件参考：[developer.mozilla.org/en-US/docs/Web/Events](https://developer.mozilla.org/en-US/docs/Web/Events)。）\n\
  \n每个 DOM 元素包括 `document` 都有 `addEventListener` 方法。和之前一样，你将先在控制台中尝试一些代码，然后使用测试过的代码在\
  \ `main.js` 中编写函数。\n\n切换到 `Chrome` 并在控制台中输入以下代码。你需要按 Shift-Return 换行。输入完所有代码后按 Return。\n\
  \n```\ndocument.addEventListener('click', function () {\n  console.log('you clicked!');\n\
  });\n```\n\n你输入的代码为 `document` 对象添加了一个事件监听器，它监听页面上发生的任何点击。当点击发生时，事件监听器将使用内置的 `console.log`\
  \ 方法向控制台打印“you clicked!”（图 6.23）。\n\n**图 6.23 为点击事件添加监听器**\n\n![为点击事件添加监听器](img/registering-click-handler.png)\n\
  \n点击页眉、详情图像或背景。你应该能看到控制台中打印出了“you clicked!”字样。（不要点击缩略图——那些会带你离开 Ottergram 的 `index.html`\
  \ 页面。当你不在 `index.html` 页面时，你的任何标记、CSS 或 JavaScript 都不不会在浏览器中加载和运行。）\n\n`addEventListener`\
  \ 接受两个参数：一个包含事件名称的字符串和一个函数。每当该元素发生该事件时，`addEventListener` 都会运行此函数。这种函数的编写方式最初看起来可能有点奇怪。它是一个\
  \ `anonymous function`（匿名函数）。\n\n到为止，你一直在使用 `named functions`（命名函数），例如 `setDetails`\
  \ 和 `titleFromThumb`。命名函数有名字——这并不意外——它们是使用函数声明创建的。\n\n你也可以写出字面函数值，就像你可以写字面量值（如 `42`）和字面字符串值（如\
  \ `\"Barry the Otter\"`）一样。字面函数值的另一个名称是 `anonymous functions`。\n\n匿名函数经常用作其他函数的参数，例如你作为第二个参数传递给\
  \ `document.addEventListener` 的那个函数。这种将函数传递给另一个函数的做法在 JavaScript 中非常常见，被称为 `callback\
  \ pattern`（回调模式），因为你作为参数传递进去的函数将在未来的某个点被“回调用”（called back）。\n\n使用命名函数作为回调是完全可以的，但许多前端开发者会使用匿名函数，因为它们可以提供比命名函数更大的灵活性。你很快就会看到它是如何运作的。\n\
  \n现在，你将为单个缩略图添加事件监听器。在控制台中输入以下内容。（记得使用 Shift-Return 换行。）\n\n```\nvar firstThumbnail\
  \ = document.querySelector(THUMBNAIL_LINK_SELECTOR);\nfirstThumbnail.addEventListener('click',\
  \ function () {\n  console.log('you clicked!');\n});\n```\n\n如果你尝试点击第一个缩略图（最左侧的\
  \ Barry），你的浏览器将带你进入大图。发生了什么？记得每个缩略图都被包裹在一个带有 `href` 的锚点标签中，指向一个图像，例如 `img/otter1.jpg`。这是浏览器在用户点击链接时的正常行为。\n\
  \n但你不希望在点击缩略图时离开 Ottergram，而且你不应该需要将锚点标签更改为其他内容。幸运的是，你可以在你的回调函数中处理这一切。\n\n回想本章早些时候的内容，函数执行任务时不需要你担心细节。通常，你只需要知道传递什么信息作为参数，以及将返回什么信息。当你传递回调函数作为参数时，还有一点你需要知道：什么信息会被传递给你的回调。\n\
  \n当你调用 `addEventListener` 时，你是在告诉浏览器：“当 `firstThumbnail` 被点击时，调用此函数”——然后浏览器会勤恳地等待该元素被点击。如果发生了点击，浏览器会记录有关事件的所有细节（例如鼠标的精确位置、是左键还是右键、以及单击还是双击）。然后浏览器会将包含这些信息的对象传递给你的函数。这个对象就是\
  \ `event object`。\n\n这种关系在图 6.24 中得到了示意，使用了一个虚构的 `addEventListener` 实现。\n\n**图 6.24\
  \ 期望参数的匿名函数**\n\n稍后，你将向 `addEventListener` 传递一个匿名函数，就像之前一样。但这一次不同，你的匿名函数将期望接收一个参数。确保\
  \ Ottergram 处于 `index.html` 页面，并在控制台中输入以下内容：\n\n\n\n\n\n```javascript\nvar firstThumbnail\
  \ = document.querySelector(THUMBNAIL_LINK_SELECTOR);\nfirstThumbnail.addEventListener('click',\
  \ function (event) {\n  event.preventDefault();\n  console.log('you clicked!');\n\
  \  console.log(event);\n});\n```\n\n每当 `firstThumbnail` 被点击时，浏览器都会调用你的匿名函数，并向该匿名函数传递事件对象。通过使用这个对象（你将其标记为\
  \ `event`），你调用它的 `preventDefault` 方法。该方法将阻止链接将浏览器引导到不同的页面。最后，你在 `event` 对象上调用了 `console.log`，以便可以在开发者工具（DevTools）中检查它。\n\
  \n现在点击第一个缩略图。你的浏览器仍然留在 Ottergram 页面，事件被记录在控制台中：`MouseEvent {isTrusted: true}`。如果你点击\
  \ `MouseEvent` 旁边的展开箭头，你应该能看到关于事件的大量信息，包括页面上的鼠标坐标、点击了哪个鼠标按钮，以及在点击期间是否按了任何特殊修饰键。\n\
  \n你应该能看到关于事件的大量信息（图 6.25 防止事件默认行为并记录事件对象）。\n\n**图 6.25 防止事件默认行为并记录事件对象**\n\n![Preventing\
  \ the event default and logging the event object](img/mouse-event-logged.png)\n\n\
  目前，不要关注事件对象的不同属性。只需要知道它携带了关于触发的浏览器事件的大量信息。\n\n顺便说一下，回调函数的参数并不要求命名为 `event` ——无论你给它起什么名字，它都会映射到传进的值。你可以使用任何喜欢的参数名称，但像你在这里这样做一样使用具有描述性的名称是一个良好的习惯，可以使你的代码更易于阅读和维护。\n\
  \n你现在有一个可以接受缩略图并添加事件监听器的函数。在 `main.js` 中添加一个名为 `addThumbClickHandler` 的函数声明。它应该定义一个名为\
  \ `thumb` 的参数。\n\n你可以从控制台复制实验性的 `addEventListener` 代码，并将其粘贴到 `addThumbClickHandler`\
  \ 的体中。修改它，使其调用 `thumb.addEventListener`。目前，你只需要在事件回调中保留 `event.preventDefault` 的调用。\n\
  \n```javascript\n...\nfunction setDetailsFromThumb(thumbnail) {\n  ...\n}\n\nfunction\
  \ addThumbClickHandler(thumb)\n  'use strict';\n  thumb.addEventListener('click',\
  \ function (event) {\n    event.preventDefault();\n  });\n}\n```\n\n在事件回调内部，你可以访问作为\
  \ `addThumbClickHandler` 声明的 `thumb` 参数。将它传递给 `setDetailsFromThumb` 的调用。\n\n```javascript\n\
  ...\nfunction addThumbClickHandler(thumb) {\n  'use strict';\n  thumb.addEventListener('click',\
  \ function (event) {\n    event.preventDefault();\n    setDetailsFromThumb(thumb);\n\
  \  });\n}\n```\n\nJavaScript 与许多其他编程语言一样，关于定义和访问变量及函数有着规则。你传递给 `addEventListener`\
  \ 的匿名函数能够访问 `setDetailsFromThumb` 函数，因为 `setDetailsFromThumb` 是在全局作用域中声明的。这意味着它可以从任何其他函数或控制台访问。对于\
  \ `DETAIL_IMAGE_SELECTOR` 这样的变量也是如此，它同样声明在全局作用域中。\n\n然而，你在 `setDetails` 内部定义的变量\
  \ `detailImage` 和 `detailTitle` 仅在 `setDetails` 体内部可用。你无法从控制台或其他函数访问它们。这些变量声明在 `setDetails`\
  \ 的函数作用域（或局部作用域）中。函数的参数工作方式与在函数内部声明变量非常相似。它们也是该函数作用域的一部分。\n\n通常，函数无法访问属于另一个函数作用域的变量或参数。`addThumbClickHandler`\
  \ 非常有趣，因为它定义了参数 `thumb`，而该参数被另一个函数——你传递给 `addEventListener` 的回调函数——访问。这是可能的因为回调函数是\
  \ `addThumbClickHandler` 作用域的一部分。\n\n你可以在本章末尾的“探索”（For the More Curious）部分阅读更多关于这些原理。\n\
  \n## 访问所有缩略图\n\n在控制台中，你为第一个缩略图添加了事件监听器。现在你将使用一个新的 DOM 方法为所有缩略图添加事件监听器。\n\n当你获取详细图像和详细标题时，你使用了\
  \ `document.querySelector` 方法在 DOM 中搜索匹配的元素。`document.querySelector` 只返回一个值，即使你传入了匹配多个元素的选择器。相反，`querySelectorAll`\
  \ 方法将返回一个匹配元素列表。在控制台中调用 `document.querySelectorAll(THUMBNAIL_LINK_SELECTOR)` 并检查结果。你应该能看到锚点元素的结果列表（图\
  \ 6.26 documentquerySelectorAll 返回多个元素）。\n\n**图 6.26 documentquerySelectorAll 返回多个元素**\n\
  \n![documentquerySelectorAll returns multiple elements](img/mouse-event-logged.png)\n\
  \n知道这一点后，你可以正确地测试 `setDetailsFromThumb`。在控制台中，将调用 `document.querySelectorAll(THUMBNAIL_LINK_SELECTOR)`\
  \ 的结果赋值给名为 `thumbnails` 的变量。使用括号语法从 `thumbnails` 列表中获取第五个元素，并传递给 `setDetailsFromThumb`。括号语法允许你通过数字索引指定列表中的项。索引从\
  \ 0 开始，所以第五项的索引为 4。\n\n以下是你的控制台代码：\n\n```javascript\nvar thumbnails = document.querySelectorAll(THUMBNAIL_LINK_SELECTOR);\n\
  setDetailsFromThumb(thumbnails[4]);\n```\n\n在控制台中运行此代码后，你可以看到 `thumbnails` 列表中的项可以传递给\
  \ `setDetailsFromThumb`，从而成功更新详细图像和标题（图 6.27 从 queryAll 传递项到 setDetailsFromThumb）。\n\
  \n**图 6.27 从 queryAll 传递项到 setDetailsFromThumb**\n\n![Passing an item from queryAll\
  \ to setDetailsFromThumb](img/hooray-nodelist.png)\n\n在 `main.js` 中，添加名为 `getThumbnailsArray`\
  \ 的函数，并粘贴获取所有匹配 `THUMBNAIL_LINK_SELECTOR` 的元素并将结果赋值给 `thumbnails` 变量的代码。\n\n```javascript\n\
  ...\nfunction addThumbClickHandler(thumb) {\n  ...\n}\n\nfunction getThumbnailsArray()\
  \ {\n  'use strict';\n  var thumbnails = document.querySelectorAll(THUMBNAIL_LINK_SELECTOR);\n\
  }\n```\n\n\n\n\n\n在你继续操作之前，在处理 DOM 方法时有一个小“坑”。返回元素列表的方法并不返回 `arrays`（数组）。相反，它们返回的是\
  \ `NodeLists`。`arrays` 和 `NodeLists` 都是项目列表，但数组拥有许多用于处理项目集合的强大方法，其中一些方法在开发 Ottergram\
  \ 时会需要到。\n\n你需要使用一段看起来很奇怪的 JavaScript 代码，将 `querySelectorAll` 返回的 `NodeList` 转换为数组。现在不需要担心这种语法。这是一种将\
  \ `NodeList` 转换为数组的后兼容方式。在 `main.js` 中进行此更改：\n\n```javascript\n...\nfunction getThumbnailsArray()\
  \ {\n  'use strict';\n  var thumbnails = document.querySelectorAll(THUMBNAIL_LINK_SELECTOR);\n\
  \  var thumbnailArray = [].slice.call(thumbnails);\n  return thumbnailArray;\n}\n\
  ```\n\n现在，有了所有的水獭缩略图，你可以将它们连接到事件监听代码上，代码将根据点击更改详情图像和标题。\n\n## 遍历缩略图数组\n\n将缩略图连接到你的事件处理代码将简单高效。你将编写一个函数，它是\
  \ Ottergram 所有逻辑的起点。其他编程语言具有内置的启动应用程序机制，而 JavaScript 缺乏这种机制。但不用担心——手动实现非常简单。\n\n\
  从在 `main.js` 的末尾添加一个 `initializeEvents` 函数开始。该方法将把使 Ottergram 交互的所有步骤结合在一起。首先，它将获取缩略图数组。然后，它将遍历数组，为每个缩略图添加点击处理器。在你编写完函数后，你将在\
  \ `main.js` 的最末添加对 `initializeEvents` 的调用以运行它。\n\n在新函数的体中，添加对 `getThumbnailsArray`\
  \ 的调用并将结果（缩略图数组）赋值给名为 `thumbnails` 的变量。\n\n```javascript\n...\nfunction getThumbnailsArray()\
  \ {\n  ...\n}\n\nfunction initializeEvents() {\n  'use strict';\n  var thumbnails\
  \ = getThumbnailsArray();\n}\n```\n\n接下来，你需要逐一遍历缩略图数组中的项目。当你访问每个项目时，将调用 `addThumbClickHandler`\
  \ 并将缩略图元素传递给它。这似乎有好几个步骤，但由于 `thumbnails` 是一个真正的数组，你可以通过单次方法调用完成所有操作。\n\n在 `main.js`\
  \ 中添加对 `thumbnails.forEach` 方法的调用，并将 `addThumbClickHandler` 函数作为回调传递给它。\n\n```javascript\n\
  ...\nfunction initializeEvents() {\n  'use strict';\n  var thumbnails = getThumbnailsArray();\n\
  \  thumbnails.forEach(addThumbClickHandler);\n}\n```\n\n注意，你传递了一个命名函数作为回调。正如你之后将读到的，这并不总是一个良好的选择。但在这种情况下它是有效的，因为\
  \ `addThumbClickHandler` 只需要在 `forEach` 调用它时传递给它的信息——一个来自 `thumbnails` 数组的项。\n\n\
  最后，为了看到所有运行效果，在 `main.js` 的最末尾添加对 `initializeEvents` 的调用。\n\n```javascript\n...\n\
  function initializeEvents() {\n  'use strict';\n  var thumbnails = getThumbnailsArray();\n\
  \  thumbnails.forEach(addThumbClickHandler);\n}\n\ninitializeEvents();\n```\n\n\
  记住，当浏览器读取你的 JavaScript 代码的每一行时，它都会运行这些代码。对于 `main.js` 的大部分内容，它只是在运行变量和函数声明。但当它到达\
  \ `initializeEvents();` 这一行时，它将运行该函数。\n\n保存并返回浏览器。点击几个不同的缩略图，查看你的劳动成果（图 6.28）。\n\
  \n图 6.28 你确实应该跳舞\n\n![You should indeed be dancing](img/dancing.png)\n\n坐下来，放松，享受点击水獭的吧！在构建网站交互层时，有很多需要处理和吸收的内容。在下一章中，你将通过添加额外的视觉效果来完成\
  \ Ottergram 项目。\n\n## 银牌挑战：链接劫持\n\n`Chrome` 开发者工具提供了许多让你玩弄访问页面的功能。下一个挑战是更改搜索结果页面上所有的链接，让它们无法跳转任何地方。\n\
  \n访问你最喜欢的搜索引擎并搜索“otters”。打开开发者工具的控制台（console）。以你在 Ottergram 中编写的函数为参考，为所有链接附加事件监听器并禁用它们的默认点击功能。\n\
  \n## 黄金挑战：随机水獭\n\n编写一个函数，更改随机水獭缩略图的 `data-image-url`，使得详情图像不再匹配缩略图。使用你任选的图像 URL（不过在网上搜索“tacocat”应该能提供一个不错的）。\n\
  \n作为额外挑战，编写一个函数将你的缩略图重置为原始的 `data-image-url` 并随机更改另一个。\n\n## 给更具好奇心的人：严格模式\n\n什么是严格模式（strict\
  \ mode），它为什么要存在？它的创建是为了提供一种更整洁的 JavaScript 模式，捕捉某些类型的错误（例如变量名中的拼写错误），引导开发者避开语言中容易出错的部分。\n\
  \n严格模式提供了许多好处。它：\n\n- 强制使用 `var` 关键字\n- 不要求 `with` 语句\n- 对 `eval` 函数的使用方式施加限制\n\
  - 将函数参数中的重复名称视为语法错误\n\n所有这一切仅仅是为了在函数顶部添加 `'use strict'` 指令。作为额外奖励，不支持该模式的旧版浏览器会忽略\
  \ `'use strict'` 指令。（这些浏览器仅将该指令视为一个字符串）。\n\n## 给更具好奇心的人：闭包\n\n我们之前提到过，开发者通常倾向于使用匿名函数作为回调，而不是命名函数。`addThumbClickHandler`\
  \ 解释了为什么匿名函数是更好的解决方案。\n\n假设你尝试使用一个命名函数 `clickFunction` 作为回调。在那个函数内部，你可以访问 `event`\
  \ 对象，因为 `addEventListener` 将其传递进来。但 `clickFunction` 的体无法访问 `thumb` 对象。该参数只有在 `addThumbClickHandler`\
  \ 函数内部才能访问。\n\n```javascript\nfunction clickFunction (event) {\n  event.preventDefault();\n\
  \n  setDetailsFromThumb(thumb); // <--- 这会导致错误\n}\n\nfunction addThumbClickHandler(thumb)\
  \ {\n  thumb.addEventListener('click', clickFunction);\n}\n```\n\n另一方面，使用匿名函数确实可以让它访问\
  \ `thumb` 参数，因为它也在 `addThumbClickHandler` 内部。当一个函数被定义在另一个函数内部时，它可以使用这个外部函数的任何变量和参数。在计算机科学术中，这被称为闭包（closure）。\n\
  \n\n\n\n\n当 `addThumbClickHandler` 函数运行时，它会调用 `addEventListener`，这会将回调函数与点击事件关联起来。浏览器会跟踪这些关联，在内部持有对回调函数的引用，并在事件发生时运行该回调函数。\n\
  \n从技术上讲，当回调函数最终执行时，`addThumbClickHandler` 的变量和参数已经不再存在了。它们在 `addThumbClickHandler`\
  \ 执行完毕后消失了。但是，回调函数“捕获”了 `addThumbClickHandler` 变量和参数的值。回调函数在运行时会使用这些捕获的值。\n\n若想深入了解，请阅读\
  \ MDN 上关于闭包（closures）的内容。\n\n## 进阶探索：NodeLists 和 HTMLCollections\n\n有两种方法可以获取存在\
  \ DOM 中的元素列表。第一种是 `document.querySelectorAll`，它返回一个 `NodeList`。另一种是 `document.getElementsByTagName`，它与\
  \ `document.querySelectorAll` 的不同在于，你只能向它传递一个标签名的字符串（例如 `\"div\"` 或 `\"a\"`），而且它返回的是\
  \ `HTMLCollection`。\n\nNodeLists 和 HTMLCollections 并不是真正的数组，因此它们缺乏 `forEach` 等数组方法，但它们确实拥有一些非常有趣的属性。\n\
  \nHTMLCollections 是`活动节点`（live nodes）。这意味着当 DOM 发生变化时，HTMLCollection 的内容会改变，而无需无需再次调用\
  \ `document.getElementsByTagName`。\n\n要查看它是如何工作的，请在控制台中尝试以下操作。\n\n```\nvar thumbnails\
  \ = document.getElementsByTagName(\"a\");\nthumbnails.length;\n```\n\n在获取所有锚点元素作为\
  \ HTMLCollection 后，你在控制台中打印该列表的 `length`。\n\n现在，使用开发者工具中的元素面板（elements panel）从页面上移除一些锚点标签：按住点击（右键点击）列表项之一并选择\
  \ `Delete element`（图 6.29\n\n重复此操作，然后再次在控制台中输入 `thumbnails.length`。你会发现 `length`\
  \ 发生了变化（图 6.30\n\n将 NodeLists 和 HTMLCollections 转换为数组，不仅可以让你通过数组方法更方便地操作，而且还可以保证即使\
  \ DOM 被修改，数组中的项也不会改变。\n\n## 进阶探索：JavaScript 类型\n\n在整个章节中，你创建了变量以便在函数内部引用某些数据。我们早就告诉过你字符串（strings）、数字（numbers）和布尔（Booleans）是五种`原始数据类型`（primitive\
  \ data types）中的三种。另外两种是 null 和 undefined。\n\n表 6.2\n\n## 隐藏和显示详细图像\n\nOttergram\
  \ 的用户可能希望在页面上不显示详细图像的情况下滚动缩略图（图 7.2\n\n为了实现这一点，你需要能够根据在使用过程中开启关闭的条件，为 `.thumbnail-list`\
  \ 和 `.detail-container` 应用样式。你可以通过创建新的类选择器（如 `.thumbnail-list-no-detail` 和 `.hidden-image-container`）并使用\
  \ JavaScript 为目标元素添加这些类来实现。这种方法的问题在于效率低下。\n\n导致详细图像隐藏的事件会`同时`导致缩略列表重新定位。这是一个单一事件。分别为\
  \ `<ul>` 和 `<div>` 元素添加类无法反映这一点。\n\n更好的方法是使用 JavaScript 添加一个`单一`类选择器来影响整个布局。然后，当这些元素是新选择器的后代时，你可以针对\
  \ `.thumbnail-list` 和 `.image-container` 进行操作。\n\n你将动态向 `<body>` 元素的类名来隐藏详细图像并放大缩略图，然后动态移除类名以恢复当前的样式（图\
  \ 7.3\n\n这种技术在两个方面与你使用媒体查询的方法相似。\n\n首先，它涉及到当祖先满足特定条件时激活的样式。在媒体查询中，该祖先是视口，条件是最小宽度。在这个新的代码中，祖先将是你选择的目标元素共享的任何元素，条件是该祖先具有特定的类名。\n\
  \n\n\n\n\n第二个相似点是，你必须将样式表中受影响元素的条件样式放置在其他声明**之后**，因为当这些条件样式激活时，它们覆盖之前的声明。\n\n你将按照三个步骤进行：\n\
  \n1. 在你的 CSS 中，定义创建你尝试实现的视觉效果的样式。同时，在开发者工具（DevTools）中测试你的样式。\n2. 编写 JavaScript 函数为\
  \ `<body>` 元素添加和移除类名。\n3. 添加一个事件监听器来触发你的 JavaScript 函数。\n\n### 创建隐藏详情图片的样式\n\n为了隐藏\
  \ `.detail-image-container`，你将添加一个为该元素设置 `display: none` 的声明。`display: none` 告诉浏览器该元素不应渲染。\n\
  \n你将动态添加到 `<body>` 元素的类名将是 `hidden-detail`。因此，你只想在 `.detail-image-container` 是 `.hidden-detail`\
  \ 的后代时才对其应用 `display: none`。\n\n在 `styles.css` 中添加隐藏详情图片的样式：\n\n```\n...\n.detail-image-title\
  \ {\n  ...\n}\n\n.hidden-detail .detail-image-container {\n  display: none;\n}\n\
  \n@media all and (min-width: 768px) {\n  ...\n}\n```\n\n现在，思考一下你的 `.thumbnail-list`\
  \ 看起来是什么样。根据目前的样式，它在宽屏幕上是左侧的一列，在窄屏幕上是顶部的水平行。无论屏幕大小如何，当详情图片隐藏时，一个居中的列会更好。\n\n在 `styles.css`\
  \ 中当 `.thumbnail-list` 和 `.thumbnail-item` 为 `.hidden-detail` 的后代时，添加样式。\n\n```\n\
  ...\n.hidden-detail .detail-image-container {\n  display: none;\n}\n\n.hidden-detail\
  \ .thumbnail-list {\n  flex-direction: column;\n  align-items: center;\n}\n\n.hidden-detail\
  \ .thumbnail-item {\n  max-width: 80%;\n}\n\n@media all and (min-width: 768px) {\n\
  \  ...\n}\n```\n\n现在，当 `.detail-image-container` 隐藏时，`.thumbnail-list` 将始终以列的形式显示。\n\
  \n你还添加了一个声明，在详情图片隐藏时将 `.thumbnail-item` 元素的宽度设置为 `max-width: 80%`。这覆盖了其他地方为 `.thumbnail-item`\
  \ 设置的 `max-width` 样式，使其成为页面的焦点。\n\n当 `.detail-image-container`、`.thumbnail-list`\
  \ 和 `.thumbnail-item` 元素嵌套在带有类 `hidden-detail` 的元素内部时，这些新样式将被激活。\n\n注意，你将这些样式添加在媒体查询（media\
  \ queries）**之前**。如你所知，CSS 代码的顺序很重要，在文件中出现较晚的样式会覆盖之前的样式。通常情况下，对于同一个选择器，浏览器使用它最近看到的样式。但在这种情况下，你的新样式使用的选择器比你媒体查询中出现的选择器更具体（specific），而特异性优于顺序。\n\
  \n通常情况下，将媒体查询放在文件的末尾是最好的。你的媒体查询通常会重用现有样式的相同选择器，因此将它们放在末尾可以确保你的媒体查询覆盖那些现有样式。此外，这使得你的媒体查询更容易找到，因为它们始终位于文件的末尾。\n\
  \n保存文件。在编写依赖于你已添加样式的 JavaScript 之前，测试它们是明智的。启动 `browser-sync`（使用 `browser-sync start\
  \ --server --browser \"Google Chrome\" --files \"*.html, stylesheets/*.css, scripts/*.js\"\
  `）并打开开发者工具。在元素面板中，按住 Control（右键点击）`<body>` 元素，从出现的菜单中选择 `Add Attribute`（添加属性）。\n\
  \n**图 7.4 选择 Add Attribute 菜单项**\n\n![选择 Add Attribute 菜单项](img/adding-class-to-body.png)\n\
  \n开发者工具提供了一个空间让你在 `<body>` 标签内部开始输入。输入 `class=\"hidden-detail\"` 并按回车。\n\n**图 7.5\
  \ 添加 `hidden-detail` 类属性**\n\n![添加 hidden-detail 类属性](img/adding-hidden-detail-attribute.png)\n\
  \n在开发者工具中为 `<body>` 添加 `hidden-detail` 类后，详情图片消失了，缩略图变得大得多——正如你所预期的那样。\n\n**图 7.6\
  \ 应用 `hidden-detail` 类后的布局变化**\n\n![应用 hidden-detail 类后的布局变化](img/hidden-detail-added.png)\n\
  \n### 编写隐藏详情图片的 JavaScript\n\n接下来，你将编写 JavaScript 来切换 `<body>` 元素的 `hidden-detail`\
  \ 类。\n\n在 `main.js` 中，添加一个名为 `HIDDEN_DETAIL_CLASS` 的变量。\n\n```\nvar DETAIL_IMAGE_SELECTOR\
  \ = '[target]';\nvar TITLE_SELECTOR = '[title]';\nvar HIDDEN_DETAIL_CLASS = 'hidden-detail';\n\
  ```\n\n现在，在 `main.js` 中写一个名为 `hideDetails` 的新函数。它的任务为 `<body>` 元素添加类名。你将使用 DOM 方法\
  \ `classList.add` 来操作类名。\n\n```\n...\nfunction getThumbArray() {\n  ...\n}\n\nfunction\
  \ hideDetails() {\n  'use strict';\n  document.body.classList.add(HIDDEN_DETAIL_CLASS);\n\
  }\n```\n\n你通过 `document.body` 属性访问了 `<body>` 元素。这个 DOM 元素对应 `<body>` 标签。你还对 `document.body`\
  \ 调用了 `add` 方法来添加 `hidden-detail` 类。\n\n### 监听按键事件\n\n现在你需要一种方法来触发详情图片的隐藏。像之前一样，你将使用事件监听器，但这次你的事件监听器监听按键而不是点击。\n\
  \n我们通常用“keypress”一词来表示按下并释放按键，但这个简单的过程实际上会触发多个事件。当按键被首次按下时，会发送 `keydown` 事件。如果它是字符键（而不是\
  \ Shift 等修饰键），也会发送 `keypress` 事件。当按键释放时，会发送 `keyup` 事件。\n\n对于 Ottergram 来说，这些差异微乎其微。你将使用\
  \ `keyup` 事件。\n\n在 `main.js` 中，添加一个名为 `addKeyPress` 的函数，它调用 `document.body.addEventListener`，传递字符串\
  \ `'keyup'` 和一个声明了参数 `event` 的匿名函数。在匿名函数的体体内，确保对 `event` 执行 `preventDefault`，然后\
  \ `console.log` `event` 的 `keyCode`。\n\n```\n...\nfunction hideDetails() {\n  ...\n\
  }\n\nfunction addKeyPressHandler() {\n  'use strict';\n  document.body.addEventListener('keyup',\
  \ function (event) {\n    event.preventDefault();\n    console.log(event.keyCode);\n\
  \  });\n}\n\nfunction initializeEvents() {\n  ...\n}\n...\n```\n\n所有的按键事件都有一个名为\
  \ `keyCode` 的属性，对应触发事件的按键。`keyCode` 是一个整数，例如 13 代表 Return，32 代表空格键，38 代表上箭头。\n\n\
  \n\n\n\n更新 `main.js` 中的 `initializeEvents` 函数，使其调用 `addKeyPressHandler`。你需要这样做是为了让\
  \ `<<body>` 元素在页面加载时监听键盘事件。\n\n```\n...\nfunction initializeEvents() {\n  'use strict';\n\
  \  var thumbnails = getThumbnailsArray();\n  thumbnails.forEach(addThumbClickHandler);\n\
  \  addKeyPressHandler();\n}\n\ninitializeEvents();\n```\n\n保存并切换回浏览器。确保控制台可见，然后点击页面以确保焦点不在开发者工具（DevTools）上——否则事件监听器将不会触发。现在在键盘上按一些键。你将看到控制台打印出数字（图\
  \ 7.7）。\n\n**图 7.7 将 `keyCode` 打印到控制台**\n\n![将 keyCode 打印到控制台](img/keycode-logging.png)\n\
  \n你想在按下 Esc 键时隐藏详情图片，而是任何键。如果你按下 Esc 键，你会发现相应的 `event.keyCode` 值为 27。你将利用它来让你的事件监听器更具体。\n\
  \n在 `main.js` 顶部添加一个 Esc 键值的变量。\n\n```\nvar DETAIL_IMAGE_SELECTOR = '[data-image-role=\"\
  target\"]';\nvar DETAIL_TITLE_SELECTOR = '[data-image-role=\"title\"]';\nvar THUMBNAIL_LINK_SELECTOR\
  \ = '[data-image-role=\"trigger\"]';\nvar HIDDEN_DETAIL_CLASS = 'hidden-detail';\n\
  var ESC_KEY = 27;\n...\n```\n\n现在，更新你的 `keyup` 事件监听器，当 `event.keyCode` 的值匹配 `ESC_KEY`\
  \ 的值时，调用 `hideDetails`。\n\n```\n...\nfunction addKeyPressHandler() {\n  'use strict';\n\
  \  document.body.addEventListener('keyup', function (event) {\n    event.preventDefault();\n\
  \    console.log(event.keyCode);\n    if (event.keyCode === ESC_KEY) {\n      hideDetails();\n\
  \    }\n  });\n}\n...\n```\n\n你使用了严格相等运算符 (`===`) 来比较 `event.keyCode` 和 `ESC_KEY`\
  \ 的值。当这些值相同时，你调用了 `hideDetails`。\n\n你也可以使用松散相等运算符 (`==`) 来比较这些值，但通常最好使用严格相等运算符。相等运算符之间的主要区别在于，松散相等运算符会将一种值类型自动转换为另一种。而严格相等运算符不会进行这种转换。在严格相等的情况下，如果类型不同，则比较的结果始终为\
  \ `false`。\n\n许多前端开发者将这种自动类型转换称为类型强制转换（type coercion）。它在需要比较值（当使用相等运算符时）、相加（数字情况下）或拼接（如字符串所示）时执行。\n\
  \n由于这种自动转换，如果你尝试将字符串 `\"27\"` 与数字 `42` 相加，不会出现语法错误——尽管结果可能不是你预期的（图 7.8）。\n\n**图\
  \ 7.8 JavaScript 会自动在类型间转换**\n\n![JavaScript 会自动在类型间转换](img/coercion.png)\n\n这在处理用户提供的数据时非常重要，你将在第\
  \ 10 章中执行操作。\n\n保存 `main.js` 浏览器中测试你的新功能（图 7.9）。\n\n**图 7.9 砰！按下 Esc 隐藏详情图片和标题**\n\
  \n![砰！按下 Esc 隐藏详情图片和标题](img/poof.png)\n\n### 再次显示详情图片\n\n还有一个小但重要的部分需要添加：让详情图片再次可见。将在点击缩略图时触发。\n\
  \n你使用了 `classList.add` 为 `<body> 元素添加类名。你将在点击缩略图时使用 `classList.remove` 移除该类名。在 `main.js`\
  \ 中添加一个名为 `showDetails` 的新函数。\n\n```\n...\nfunction hideDetails() {\n  ...\n}\n\n\
  function showDetails() {\n  'use strict';\n  document.body.classList.remove(HIDDEN_DETAIL_CLASS);\n\
  }\n\nfunction addKeyPressHandler() {\n  ...\n}\n...\n```\n\n现在，在你的 `addKeyPressHandler`\
  \ 函数中添加对 `showDetails` 的调用——不需要添加新的事件监听器。\n\n```\n...\nfunction addThumbClickHandler(thumb)\
  \ {\n  'use strict';\n  thumb.addEventListener('click', function (event) {\n   \
  \ event.preventDefault();\n    setDetailsFrom(thumb);\n    showDetails();\n  });\n\
  }\n...\n```\n\n保存 `main.js` 并切换到浏览器。尝试新功能：隐藏详情图片，然后点击缩略图将其恢复（图 7.10）。这些海獭看起来很赞同，不是吗？\n\
  \n**图 7.10 Esc 隐藏详情；显示详情**\n\n![Esc 隐藏详情；显示详情](img/otters-return.png)\n\n现在，Ottergram\
  \ 还可以根据视口动态调整布局。\n\n目前，布局变化是突然的。在下一节中，你将使用过渡来平滑处理。\n\n## 使用 CSS 过渡进行状态更改\n\nCSS\
  \ 过渡创建从一个状态到另一个状态的渐变，这正是让 Ottergram 的显示隐藏效果更精致的所需的。\n\n当你创建一个过渡时，你是在告诉浏览器：“我希望元素的样式变为这些属性，并且我希望过渡按照指定的时间进行。”\n\
  \n一个常见的例子是许多网站上的抽屉式菜单，例如 [bigneranch.com](http://www.bigneranch.com)。在视口窄的浏览器中，点击图标会使导航菜单从顶部出现——但并不是一次性出现的。相反，它从头部滑入，从初始状态（隐藏）动画化到结束状态（可见）（图\
  \ 7.11）。再次点击图标会导致导航菜单向上滑回，直到再次隐藏。\n\n**图 7.11 bigneranch.com 的抽屉式导航**\n\n![bigneranch.com\
  \ 的抽屉式导航](img/hamburger.png)\n\n在创建显示和隐藏详情图片的过渡效果之前，你将为缩略图构建一个更简单的过渡。\n\n通常情况下，你应该分三个步骤创建过渡：\n\
  \n1.  决定结束状态应该是什么。一种很好的方法是将结束状态的 CSS 声明添加到目标元素中。这允许你在浏览器中查看它们，并确保它们符合你的预期。\n2. \
  \ 将声明从目标元素的现有声明块移动到新的 CSS 声明块。你可能想为新声明块使用新类作为选择器。\n3.  为目标元素添加 `transition` 声明。`transition`\
  \ 属性告诉浏览器它需要视觉化地将当前的 CSS 值更改到结束状态 CSS 值 值并且过渡应该在特定的时间内进行。\n\n### 使用 transform 属性工作\n\
  \n\n\n\n\n你的第一个过渡将在当光标悬停在缩略图上时增大其尺寸（图 7.12）。然而，你并没有直接更改 `width` 或 `height` 样式。你会使用\
  \ `transform` 属性，它可以改变元素的形状、大小、旋转和位置，而不会中断周围元素的布局。\n\n**图 7.12  具有缩放效果的缩略图**\n\n\
  ![具有缩放效果的缩略图](img/zoom-effect-thumbnail.png)\n\n此过渡的目标元素是 `.thumbnail-item`。你将首先直接为\
  \ `.thumbnail-item` 元素添加 `transform` 声明。\n\n测试并确定其运行符合你的预期后，你将变换移动到一个新的 `.thumbnail-item:hover`\
  \ 声明块中。最后，你为 `.thumbnail-item` 添加一个 `transition` 声明。\n\n在 `styles.css` 中，首先为 `.thumbnail-item`\
  \ 添加 `transform` 声明。\n\n```\n...\n.thumbnail-item {\n  display: inline-block;\n\
  \  min-width: 120px;\n  max-width: 120px;\n  border: 1px solid rgb(100%, 100%, 100%);\n\
  \  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n\n  transform: scale(2.2);\n\
  }\n...\n```\n\n`transform: scale(2.2)` 告诉浏览器该元素应按其原始大小的 220% 进行绘制。许多值都可用于 `transform`，包括高级的\
  \ 3D 效果。MDN 在 [developer.mozilla.org/en-US/docs/Web/CSS/transform](https://developer.mozilla.org/en-US/docs/Web/CSS/transform)\
  \ 中对它们有详尽的介绍。\n\n保存并在浏览器中查看更改（图 7.13）。\n\n**图 7.13  巨大的水獭缩略图**\n\n![巨大的水獭缩略图](img/unhappy-otters.png)\n\
  \n你可以看到缩略图现在比以前大得多。事实上，它们太大了。更改该值，使其只稍微大一点：\n\n```\n...\n.thumbnail-item {\n  display:\
  \ inline-block;\n  min-width: 120px;\n  max-width: 120px;\n  border: 1px solid rgb(100%,\
  \ 100%, 100%);\n  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n\n  transform:\
  \ scale(2.2);\n  transform: scale(1.2);\n}\n...\n```\n\n保存后，你应该看到水獭缩略图只比其原始尺寸略大一点（图\
  \ 7.14）。\n\n**图 7.14  大小适的水獭缩略图**\n\n![大小适的水獭缩略图](img/reasonably-large-thumbnails.png)\n\
  \n缩略图的缩放比例看起来良好，所以你可以继续下一步。\n\n### 添加 CSS 过渡\n\n现在是时候将结束状态样式移动到新的样式声明中，并为 `.thumbnail-item`\
  \ 元素设置过渡。\n\n当用户将鼠标光标悬停在缩略图上时，该缩略图应将其 `scale` 增加 120%。在 `styles.css` 中添加一个声明块，使用修饰符\
  \ `:hover` 来指定仅在用户悬停在元素上时才生效的样式。\n\n```\n...\n.thumbnail-item {\n  display: inline-block;\n\
  \  min-width: 120px;\n  max-width: 120px;\n  border: 1px solid rgb(100%, 100%, 100%);\n\
  \  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n\n  transform: scale(1.2);\n\
  }\n\n.thumbnail-item:hover {\n  transform: scale(1.2);\n}\n...\n```\n\n该修饰符的正式名称是\
  \ `pseudo-class`（伪类）。伪类 `:hover` 在用户将鼠标光标悬停在元素上时匹配该元素。有许多伪类关键字可以描述元素可能处于的各种状态。你将在本书稍后处理表单时遇到其中一些，你可以搜索\
  \ MDN 了解更多信息。\n\n接下来，通过在 `styles.css` 的 `.thumbnail-item` 中添加 `transition` 声明，让此更改以过渡的形式发生。你需要指定要动画的属性以及动画持续的时间。\n\
  \n```\n...\n.thumbnail-item {\n  display: inline-block;\n  min-width: 120px;\n \
  \ max-width: 120px;\n  border: 1px solid rgb(100%, 100%, 100%);\n  border: 1px solid\
  \ rgba(100%, 100%, 100%, 0.8);\n\n  transform: scale(1.2);\n  transition: transform\
  \ 133ms;\n}\n...\n```\n\n你设置了 `transition` 属性，这告诉浏览器在 `133ms` 内对 `transform` 执行动画。\n\
  \n保存并尝试你的新过渡。你应该看到水獭缩略图在悬停时略变大，移开时恢复原始大小（图 7.15）。\n\n**图 7.15  进入与移出**\n\n![进入与移出](img/hover-out)\n\
  \nDevTools 为你提供了方便的方法来测试伪类。在元素面板中展开 `<li>` 标签，直到其中一个被高亮。右键点击它，并在伪类列表中选择 `:hover`。这会强制该元素处于\
  \ `:hover` 状态（图 7.16）。\n\n**图 7.16  切换伪类**\n\n![右键点击伪类](img/right-click-pseudo-class)\n\
  \n一个圆圈出现在 `<li>` 标签左侧，提示你某个伪类已激活。即使你鼠标悬停然后移开，它也会保持 `:hover` 状态。\n\n你的过渡很不错，但有一个小\
  \ Bug。目前，悬停效果导致缩略图被裁剪。这是因为应用到 `.thumbnail-item` 的 `transform` 没有导致其父元素调整大小。解决方案是为\
  \ `.thumbnail-list` 添加内边距。更改 `styles.css` 中 `.thumbnail-list` 的垂直内边距。\n\n```\n...\n\
  .thumbnail-list {\n  flex: 0 1 auto;\n  order: 2;\n  display: flex;\n  justify-content:\
  \ space-between;\n  list-style: none;\n  padding: 0;\n  padding: 20px 0;\n\n  white-space:\
  \ nowrap;\n  overflow-x: auto;\n}\n...\n```\n\n你使用了 `padding` 属性的简写。第一个值 `20px`\
  \ 应用于上下内边距，第二个值应用于左右内边距。在你的 `@media` 查询内部进行类似的调整，但为左右添加额外的 `35px` 内边距。\n\n```\n\
  ...\n@media all and (min-width: 768px) {\n  .main-content {\n  ...\n  }\n\n  .thumbnail-list\
  \ {\n    flex-direction: column;\n    order: 0;\n    margin-left: 20px;\n\n    padding:\
  \ 0 35px;\n  }\n}\n...\n```\n\n保存并在浏览器中检查结果。这为缩略图产生了更好的效果（图 7.17）。\n\n**图 7.17 \
  \ 在竖屏和横屏模式下的额外空间**\n\n![在竖屏和横屏模式下的额外空间](img/breathing-room.png)\n\n### 使用时间函数\n\n\
  \n\n\n你的悬停效果看起来不错！但它缺乏一种能让它真正独特的视觉 `pop`（弹出）效果。通过 CSS 过渡（transitions），你不仅可以指定过渡所需的时间，还可以让它在段时间内以不同的速度进行过渡。\n\
  \n有几种时间函数可以配合过渡使用。默认情况下使用 `linear`（线性）时间函数，它会让过渡以单一、恒定的速率进行动画。其他的函数更有趣，能赋予过渡一种加速或减速的感觉。\n\
  \n更新你在 `styles.css` 中的过渡属性，使其使用 `ease-in-out` 时间函数。这会让过渡速度在开始和结束时较慢，在中间部分较快。\n\n\
  ```\n...\n.thumbnail-item {\n  display: inline-block;\n  min-width: 120px;\n  max-width:\
  \ 120px;\n  border: 1px solid rgb(100%, 100%, 100%);\n  border: 1px solid rgba(100%,\
  \ 100%, 100%, 0.8);\n\n  transition: transform 133ms ease-in-out;\n}\n...\n```\n\
  \n保存，然后悬停在其中一个缩略图上。这种效果很微妙，但肉眼可见。\n\n有很多可用的时间函数。请参阅 MDN 上的列表：https://developer.mozilla.org/en-US/docs/Web/CSS/transition-timing-function。\n\
  \n你的 `transition` 在过渡到结束状态和从结束状态返回的过渡中都使用了相同的持续时间值和时间函数。事实并非必须如此——你可以根据过渡的方向使用不同的值。如果你在起始状态声明和结束状态声明中都指定了\
  \ `transition` 属性，浏览器将使用它正要移动的的那个声明的值。\n\n在实际操作中观察这一点可能会更容易。为了进行一个快速演示，请在 `styles.css`\
  \ 的 `.thumbnail-item:hover` 中添加一个 `transition` 声明。（在浏览器中尝试后你会删掉它。）\n\n```\n...\n\
  .thumbnail-item:hover {\n  transform: scale(1.2);\n  transition: transform 1000ms\
  \ ease-in;\n}\n...\n```\n\n保存并再次在浏览器中悬停在其中一个缩略图上。缩放效果将非常缓慢，需要整整一秒才能完成。这是因为使用了为 `.thumbnail-item:hover`\
  \ 声明的值。现在，将鼠标移出缩略图。这次，过渡花费了 133 毫秒，即为 `.thumbnail-item` 声明的值。\n\n在继续之前，从 `.thumbnail-item:hover`\
  \ 中移除 `transition` 声明。\n\n```\n...\n.thumbnail-item:hover {\n  transform: scale(1.2);\n\
  \  transition: transform 1000ms ease-in;\n}\n...\n```\n\n### 类变化时的过渡\n\n你的第二个过渡会让\
  \ `.detail-image-frame` 看起来像是从很远处放大进的。\n\n这次，你将不再使用伪类选择器来触发过渡，而是将使用 JavaScript 添加和移除类名来触发过渡。为什么呢？因为没有与点击事件相对应的伪类。使用\
  \ JavaScript 可以让你更灵活地控制这些 UI 变化何时以及如何被触发。\n\n此外，你将为过渡的开始和结束设置不同的持续时间。最终结果将是：当你点击缩略图时，对应的水獭图像将作为详情图像。它会立即缩小到详情区域中心的一个微小点，然后过渡到它的完整尺寸（图\
  \ 7.18）。\n\n**图 7.18 点击缩略图使其从极小尺寸放大到完整尺寸**\n\n![点击缩略图使其从极小尺寸放大到完整尺寸](img/little-big.png)\n\
  \n首先在 `styles.css` 中为名为 `is-tiny` 的新类添加样式声明。\n\n```\n...\n.detail-image-frame {\n\
  \  ...\n}\n\n.is-tiny {\n  transform: scale(0.001);\n  transition: transform 0ms;\n\
  }\n\n.detail-image {\n  ...\n```\n\n你为 `.is-tiny` 添加了两个样式。第一个 `scale` 将元素缩小到原始尺寸的一极小部分。第二个指定了\
  \ `transform` 属性的任何 `transition` 都应持续 0 毫秒，从而立即应用样式变化。换句话说，在向 `.is-tiny` 类样式移动的过程中，详情图像实际上没有过渡。因为持续时间为\
  \ 0 毫秒，所以不需要指定时间函数。\n\n接下来，你将添加另一个持续时间为 333 毫秒的 `transition` 声明。该值将在离开 `.is-tiny`\
  \ 类时使用，使详情内在三分分之一内增长到正常尺寸。在 `styles.css` 的 `.detail-image-frame` 中添加此 `transition`\
  \ 声明。\n\n```\n...\n.detail-image-frame {\n  position: relative;\n  text-align: center;\n\
  \n  transition: transform 333ms;\n}\n...\n```\n\n在继续之前保存 `styles.css`。\n\n### 使用\
  \ JavaScript 触发过渡\n\n现在你的过渡样式已经就绪，你需要用 JavaScript 触发它们。为了给 JavaScript 提供一个钩子，在 `index.html`\
  \ 中添加一个数据属性。\n\n```\n...\n      <div class=\"detail-container\">\n        <div class=\"\
  detail-image-frame\" data-role=\"frame\">\n          <img class=\"detail-image\"\
  \ data-role=\"target\" src=\"img/otter1.jpg\" alt=\"\">\n          <span class=\"\
  detail-title\" data-role=\"title\">Stay' Alive</span>\n        </div>\n      </div>\n\
  ...\n```\n\n保存 `index.html`。现在，在 `main.js` 中，你只需要为选择器添加变量。\n\n```javascript\nvar\
  \ DETAIL_IMAGE_SELECTOR = '[data-role=\"target\"]';\nvar DETAIL_TITLE_SELECTOR =\
  \ '[data-role=\"title\"]';\nvar DETAIL_FRAME_SELECTOR = '[data-role=\"frame\"]';\n\
  var THUMBNAIL_LINK_SELECTOR = '[data-role=\"trigger\"]';\nvar HIDDEN_DETAIL_CLASS\
  \ = 'hidden-detail';\nvar TINY_EFFECT_CLASS = 'is-tiny';\nvar ESC_KEY = 27;\n```\n\
  \n并不要求按这个顺序放置变量。（这对浏览器没有影响。）但保持它们整齐良好是一个好主意。在 `main.js` 中，所有的选择器变量都在一起，后面是类变量，最后是\
  \ Escape 键的代码代码。\n\n现在，更新 `main.js` 中的 `showDetails`，使其获取 `[data-role=\"frame\"\
  ]` 元素的引用。为了触发 `transition`，你将添加 `TINY_EFFECT_CLASS` 然后移除它。\n\n```javascript\nfunction\
  \ showDetails() {\n  'use strict';\n  var frame = document.querySelector(DETAIL_FRAME_SELECTOR);\n\
  \  document.body.classList.remove(HIDDEN_DETAIL_CLASS);\n  frame.classList.add(TINY_EFFECT_CLASS);\n\
  \  frame.classList.remove(TINY_EFFECT_CLASS);\n}\n```\n\n如果你保存这些代码并在浏览器中尝试，将不会看到过渡发生。为什么不是？因为\
  \ `TINY_EFFECT_CLASS` 被添加后立即被移除。最终结果是没有任何实际的类变化需要渲染。这是浏览器的一种优化。\n\n你需要在移除 `TINY_EFFECT_CLASS`\
  \ 之前添加一个小的延迟。然而，JavaScript 并没有像其他语言那样拥有内置的延迟或睡眠函数。是时候采用变通方法了！\n\n\n\n你将使用 `setTimeout`\
  \ 方法，它接收一个函数和一个延迟时间（以毫秒为单位）。在延迟结束后，浏览器会将该函数放入队列中等待执行。\n\n在 `main.js` 中调用 `frame.classList.add`\
  \ 之后添加对 `setTimeout` 的调用。向它传递两个参数：一个包含要执行步骤列表的函数，以及在调用该函数之前等待的毫秒数。只有一个步骤需要执行，即移除\
  \ `TINY_EFFECT_CLASS`。\n\n```\n...\nfunction showDetails() {\n  'use strict';\n\
  \  var frame = document.querySelector(DETAIL_FRAME_SELECTOR);\n  document.body.classList.remove(HIDDEN_DETAIL_CLASS);\n\
  \  frame.classList.add(TINY_EFFECT_CLASS);\n  setTimeout(function () {\n    frame.classList.remove(TINY_EFFECT_CLASS);\n\
  \  }, 50);\n}\n...\n```\n\n让我们仔细观察一下这段代码的作用。首先，它为 `frame` 元素添加了 `.is-tiny` 类。这应用了你的\
  \ `transform: scale(0.001)`。\n\n然后，告诉浏览器等待 50 毫秒，之后它会将一个匿名函数添加到其执行队列中。`showDetails`\
  \ 函数执行完毕。五十毫秒后，该匿名函数被放入执行队列。（基本上，它进入了 CPU 队列，排在已经在队列中的其他函数之后。）\n\n当这个匿名函数运行时，它会从\
  \ `frame` 的类列表中移除 `TINY_EFFECT_CLASS`。这会导致 `transform` 过渡效果在 333 毫秒内运行，使 `frame`\
  \ 放大到正常大小。\n\n保存你的更改并欣赏结果。点击缩略图，享受那些搞怪的水獭滑入视野的画面吧。\n\n## 自定义计时函数\n\n现在，为你的 Ottergram\
  \ 蛋糕锦上添花：你可以为你的过渡效果创建自定义的计时函数，而不再局限于内置函数。\n\n计时函数可以通过图表表示，以显示过渡随时间变化的进度。内置计时函数的图表（来自网站\
  \ [cubic-bezier.com](http://cubic-bezier.com)）可以在图 7.19 中看到。\n\n**图 7.19 内置计时函数**\n\
  \n![内置计时函数](img/cubic-bezier-builtins.png)\n\n这些图表中的形状被称为三次贝塞尔曲线。图中的线条描述了动画随时间变化的行为。它们由四个点定义。你可以通过指定定义曲线的四个点来创建自定义过渡效果。尝试在\
  \ `styles.css` 中为 `.detail-image-frame` 的 `transition` 声明中使用以下 `cubic-bezier`。\n\
  \n```\n...\n.detail-image-frame {\n  position: relative;\n  text-align: center;\n\
  \n  transition: transform 333m cubic-bezier(1,.06,.28,1);\n}\n...\n```\n\n保存它并点击浏览器中的一些缩略图，查看过渡效果的区别。\n\
  \n多亏于开发者 Lea Verou 和她的网站 [cubic-bezier.com](http://cubic-bezier.com)，创建自定义计时函数是非常轻松的（图\
  \ 7.20）。\n\n**图 7.20 使用 `cubic-bezier.com` 创建自定义计时函数**\n\n![使用 cubic-bezier.com\
  \ 创建自定义计时函数](img/cubic-bezier.png)\n\n左侧是一个带有红色和蓝色拖柄的曲线。该曲线表示了在持续时间内过渡完成的比例。点击并拖动拖柄来更改曲线。随着曲线的变化，页面顶部的数值也会随之变化。\n\
  \n右侧是内置计时函数：`ease`、`linear`、`ease-in`、`ease-out` 和 `ease-in-out`。点击其中一个，然后点击 `Preview\
  \ & compare` 旁 `GO!` 按钮。两个计时函数的图标（自定义的 `cubic-bezier` 和内置函数）将开始动画，让你看到自定义计时效果，并将其与内置选项进行比较。\n\
  \n创建一个自定义计时函数，当你对其满意时，将网站上的值复制并粘贴到 `styles.css` 的代码中：\n\n```\n...\n.detail-image-frame\
  \ {\n  position: relative;\n  text-align: center;\n\n  transition: transform 333m\
  \ cubic-bezier(在此处输入你的值);\n}\n...\n```\n\n恭喜！Ottergram 的功能已经开发完成！保存你的文件并欣赏你的成品。你已经将\
  \ Ottergram 从一个简单的静态网页变成了一个具有动画视觉效果的交互式响应式页面。\n\n你已经走了很长的一路，希望你喜欢学习前端开发的基础知识。现在是时候向水獭们告别了，因为在下一章节中你将开启一个新项目。\n\
  \n## 更有好奇心的人：类型转换规则\n\n正如第 6 章 所提到的，JavaScript 最初被创建是为了让非专业程序员也能为网页添加交互性。当时人们认为，这些“普通人”不应该担心一个值是数字、对象还是一根香蕉。（开个玩笑——JavaScript\
  \ 中没有香蕉这种类型。）\n\n实现这一目标的方法之一是通过类型转换（Type Coercion）。通过类型转换，你可以使用 `==` 运算符比较两个不同类型的值，并使用\
  \ `+` 运算符连接两个值。当你这样做时，JavaScript 会想出办法让它生效——即使它必须做一些奇怪的操作，比如将字符串 `\"2\"` 转换为数字 `2`。\n\
  \n这让程序员和非程序员都感到困惑。大多数程序员都认为，使用 `===` 运算符进行严格比较是最好的。然而，类型转换的规则在语言中定义得非常明确，它们值得了解。\n\
  \n假设你正尝试比较两个变量：`x == y`。如果它们的类型相同且值相同，比较结果为布尔值 `true`。唯一的例外情况是：如果 `x` 或 `y` 的值为\
  \ `NaN`（语言中意为“非数字”的常量），则结果为 `false`。\n\n然而，如果 `x` 和 `y` 的类型不同，情况就会变得有点复杂。以下是 JavaScript\
  \ 应用的一些规则：\n\n*   这些比较结果为 `true`：`null == undefined` 和 `undefined == null`。\n\n\
  *   比较字符串和数字时，首先将字符串转换为等值的数值。这意味着 `\"3\" == 3` 为 `true`，而 `\"dog\" == 20` 为 `false`。\n\
  \n*   比较布尔值与其他类型时，首先将布尔值转换为数字：`true` 转换为数字 `1`，`false` 转换为数字 `0`。这意味着 `false ==\
  \ 0` 为 `true`，而 `true == 1` 也为 `true`。\n\n*   最后，如果你将字符串或数字与对象比较，首先尝试将对象转换为原始值。如果该转换无效，则尝试将对象转换为字符串。\n\
  \n想要了解更多信息，请查看 MDN 的讨论：[developer.mozilla.org/en-US/docs/Web/JavaScript/Equality_comparisons_and_sameness](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Equality_comparisons_and_sameness)。\n\
  \n# 第二部分\n## 模块、对象与表单\n\n# 第 8 章\n## 模块、对象与方法\n\n在接下来的七章中，你将构建一个名为 CoffeeRun 的购物车应用程序，用于管理餐车的咖啡订单。你将通过三层代码来创建\
  \ CoffeeRun：UI、内部逻辑和服务器通信。\n\n\n\n在本章中，你将创建内部逻辑，并通过 DevTools 控制台与之交互，如图图 8.1 所示。\n\
  \n**图 8.1 CoffeeRun，内部机制**\n\n![CoffeeRun，内部机制](img/excelsior.png)\n\n## 模块\n\n\
  CoffeeRun 比 Ottergram 更复杂，因此组织你的代码以便于调试和扩展至关重要。CoffeeRun 将以组件化的结构组织，这些组件在图 8.2 所示。\n\
  \n**图 8.2 CoffeeRun 组件与交互概览**\n\n![CoffeeRun 组件与交互概览](img/architecture.png)\n\n\
  应用程序的每个部分将专注于某一个职责领域。应用程序内部逻辑的代码将管理数据。UI 代码将处理事件和 DOM 操作（类似于 Ottergram 的代码）。服务器通信代码将与远程服务器通信，在网络上保存和检索数据。\n\
  \nJavaScript 的创建是为了编写添加少量交互性的极小脚本，而不是为了编写复杂的应用程序。CoffeeRun 并不极端复杂，但它打破了单个脚本文件应该完成的任务的界限。\n\
  \n为了保持代码的整洁分离，你将为应用程序中的功能子集创建三个 JavaScript 文件。你将为内部逻辑、UI 和服务器通信代码编写不同的文件。你通过将代码写在独立的单元（或\
  \ <samp class=\"firstterm\">模块</samp>）中来实现这种分离。\n\n如何将代码分组为模块完全取决于开发者。大多数情况下，代码是围绕概念分组的，例如“库存”或“菜谱”。在代码方面，模块将相关的函数组合在一起。某些函数将从外部可用，而另一些则将仅在模块内部使用。\n\
  \n想象一家餐厅。厨房有许多内部使用的工具和原料，但客户只能看到一份包含几项内容的菜单。该菜单就是客户访问名为“厨房”的食物制作模块的接口。\n\n同样，如果餐厅有一个吧台，制作饮料的工具和原料是内部的；客户只能访问饮品列表上的项目，这是他们访问名为“吧台”的饮料制作模块的接口。\n\
  \n作为客户，你不能从厨房借用肉菜刀，或从吧台借用搅拌机。你不能从冰箱里多拿一块黄油，或在你的鸡尾酒里多加一份酒。你受限于厨房和吧台模块提供的接口。\n\n同样，CoffeeRun\
  \ 的每个模块都将保持部分功能设为私有。只有部分功能将被设为公开可访问，以便其他模块可以与之交互。\n\n对于 CoffeeRun，你将继续使用 ES5，这是截至本文编写时支持最好的\
  \ JavaScript 版本。（你的下一个项目 Chattrbox 将使用最新版本 ES6）。ES5 并没有一种正式的方法来将代码组织为自包含的模块，但你可以通过将相关代码（变量和函数）放在函数体内部来获得相同类型的组织结构。\n\
  \n### 模块模式\n\n代码可以使用函数来组织，但为了这一目的，通常的做法是使用普通函数的变体。在开始你的新项目之前，让我们简要查看用于组织代码的 <samp\
  \ class=\"firstterm\">模块模式</samp>，检查 Ottergram 中的函数如何重写为模块。\n\n以下是一个基础模块的代码：\n\n\
  ```\n(function () {\n  'use strict';\n  // 代码将放在这里\n})();\n```\n\n如果你是第一次看到这种模式，它看起来可能相当奇怪。这被称为\
  \ <samp class=\"firstterm\">立即调用函数表达式</samp>（或 IIFE），最好从内向外检查它。\n\n它的主体部分是匿名函数：\n\
  \n```\nfunction () {\n  'use strict';\n  // 代码将放在这里\n}\n```\n\n你曾在 Ottergram 中处理过匿名函数，所以这应该让你很熟悉。\n\
  \n然而，这里的匿名函数被包裹在括号中：\n\n```\n(function () {\n  'use strict';\n  // 代码将放在这里\n})\n\
  ```\n\n这些包裹的括号非常重要，因为它们告诉浏览器：“请不要将此代码解释为函数声明。”\n\n浏览器看到括号后说：“啊。好的。我知道我正在看一个匿名函数。我将暂不对它进行任何操作。”\n\
  \n大多数时候，你通过将其作为参数来使用匿名函数。在这种情况下，你是立即调用了它。这是通过一对空括号实现的：\n\n```\n(function () {\n\
  \  'use strict';\n  // 代码将放在这里\n})()\n```\n\n当浏览器看到空括号时，它意识到你想要让它调用它们之前的任何内容，并说：“噢！我看到我有一个可以运行的匿名函数！”\n\
  \n你可能在想：“这既疯狂又没用。”实际上，你已经写过工作类似的代码。回想 Ottergram 的 <samp class=\"function\">initializeEvents</samp>\
  \ 函数。在你声明它之后，你立即调用了它，并且再也没有调用过它。这里是相应的参考代码：\n\n```\nfunction initializeEvents()\
  \ {                 // 声明函数\n  'use strict';\n  var thumbnails = getThumbnailsArray();\n\
  \  thumbnails.forEach(addThumbClickHandler);\n\n  addKeyPressHandler();\n}\n\ninitializeEvents();\
  \                          // 调用函数\n```\n\n该函数的目的是将某些步骤封装在一起并在页面加载时运行它们。这里是相同的代码，重写为\
  \ IIFE 形式。（你不需要更改你的 Ottergram 代码；这只是为了说明这个概念。）\n\n```\nfunction initializeEvents()\
  \ {\n(function () {\n  'use strict';\n  var thumbnails = getThumbnailsArray();\n\
  \  thumbnails.forEach(addThumbClickHandler);\n\n  addKeyPressHandler();\n}\n})();\n\
  \ninitializeEvents();\n```\n\n当你想要运行某些代码而不创建任何额外的全局变量或函数时，IIFEs 是非常有用的。为了理解为什么这很重要，考虑为\
  \ Ottergram 编写的变量和函数。\n\n在 Ottergram 中，你构建了一组实用函数，然后根据需要调用它们。这些函数具有如 <samp class=\"\
  function\">getThumbnailsArray</samp> 和 <samp class=\"function\">addKeyPressHandler</samp>\
  \ 等名称。幸运的是，这些名称是唯一的。如果你尝试定义两个同名的函数，第一个会被第二个所替换。\n\n当你定义函数或变量时，它们默认被添加到 <samp class=\"\
  firstterm\">全局命名空间</samp>。这是浏览器对你的 JavaScript 程序中所有函数和变量名的注册，以及任何内置函数和变量。更广泛地说，<samp\
  \ class=\"firstterm\">命名空间</samp> 是组织代码的方式：代码组织命名空间的方式与计算机上文件在文件夹中的组织方式相同。\n\n###\
  \ 使用 IIFE 修改对象\n\n\n\n\n\nIIFE 不仅适用于运行初始化代码，例如 Ottergram 的 `initializeEvents`。它们也适用于运行用于增强对象的代码，而该对象通常作为参数传入。为了说明它是如何工作的，我们将再次使用我们的朋友\
  \ `initializeEvents`。\n\n这里是 `initializeEvents` 的版本，它的作用是通过添加点击处理器来修改缩略图。（为了简单起见，删除了\
  \ `addKeyPressHandler` 调用。）\n\n```\nfunction initializeEvents() {\n  'use strict';\n\
  \  var thumbnails = getThumbnailsArray();\n  thumbnails.forEach(addThumbClickHandler);\n\
  }\n\ninitializeEvents();\n```\n\n在这种形式下，`initializeEvents` 使用 `addThumbClickHandler`\
  \ 修改缩略图数组。但它也可以接收数组作为参数。要做到这一点，你需要在函数定义中声明一个参数。然后当你调用它时，传入数组，如下所示：\n\n```\nfunction\
  \ initializeEvents(thumbnails) {\n  'use strict';\n  var thumbnails = getThumbnailsArray();\n\
  \  thumbnails.forEach(addThumbClickHandler);\n}\n\nvar thumbnails = getThumbnailsArray();\n\
  initializeEvents(thumbnails);\n```\n\n要将其重写为 IIFE，你需要移除函数名，用括号将函数起来，并添加一对空括号来调用该函数：\n\
  \n```\n(function initializeEvents(thumbnails) {\n  'use strict';\n  thumbnails.forEach(addThumbClickHandler);\n\
  })();\n\nvar thumbnails = getThumbnailsArray();\ninitializeEvents(thumbnails);\n\
  ```\n\n然而，你仍然需要将缩略图数组作为参数传入。你可以通过移动 `getThumbnailsArray` 的调用来实现。不要将结果赋值给变量，而是将结果传递给你的\
  \ IIFE：\n\n```\n(function (thumbnails) {\n  'use strict';\n  thumbnails.forEach(addThumbClickHandler);\n\
  })(getThumbnailsArray());\n\nvar thumbnails = getThumbnailsArray();\n```\n\n在这个版本的代码中，一个数组（调用\
  \ `getThumbnailsArray` 产生）被传入 IIFE。IIFE 接收此数组并为其标记上标签 `thumbnails`。在 IIFE 的体内部，事件监听器被绑定到数组中的每个项（图\
  \ 8.3）。\n\n**图 8.3 IIFE 修改其参数**\n\n![IIFE 修改其参数](img/iife-modifies.png)\n\n任何内容都可以传递给\
  \ IIFE 进行修改。你的 CoffeeRun IIFEs 将接收 `window` 对象。但它们不会直接将模块代码附加到全局命名空间，而是会将将代码附加到全局命名空间内的单个\
  \ `App` 属性上。每个 CoffeeRun 模块将包含在自己的文件中，并通过单独的 `<script>` 标签加载到浏览器。此过程的概述见图 8.4。\n\
  \n**图 8.4 `<script>` 标签加载模块，并修改 `window.App`**\n\n![<script> 标签加载模块，并修改 window.App](img/script-iife-app.png)\n\
  \n## 设置 CoffeeRun\n\n理论足够——让我们开始工作吧。由于这是一个新项目，首先从创建一个新目录开始。打开 `Atom` 并选择 `File`\
  \ → `Add Project Folder...`。选择你的 `front-end-dev-book` 目录并点击 `New Folder`。将新文件夹命名为\
  \ `coffeerun` 并点击 `Open`。\n\n接下来，在 `Atom` 的导航面板中 Control-click（右键点击）你的新 `coffeerun`\
  \ 文件夹。选择 `New File` 并输入文件名 `index.html`。再次 Control-click（右键点击）`coffeerun` 并选择 `New\
  \ Folder`。将文件夹命名为 `scripts`。\n\n在你的 `front-end-dev-book` 文件夹中，现在每个项目对应的文件夹，`ottergram`\
  \ 和 `coffeerun`，具有相似的文件结构（图 8.5）。\n\n**图 8.5 为 CoffeeRun 创建文件和文件夹**\n\n![为 CoffeeRun\
  \ 创建文件和文件夹](img/folder-setup.png)\n\n如果你已经打开了终端并运行 `browser-sync`，请使用 Control-C\
  \ 关闭 `browser-sync`。如果没有，请打开一个新的终端窗口。无论何种情况，请切换到你新的 `coffeerun` 目录（如果你不如何操作，请参考第\
  \ 1 章 中的命令），并重新启动 `browser-sync`。提示：启动它的命令是 `browser-sync start --server --files\
  \ \"stylesheets/*.css, scripts/*.js, *.html\"`。\n\n在 `index.html` 中添加文档的基本框架。（记得，`Atom`\
  \ 的自动补全会为你完成大部分工作；只需开始输入“html.”即可。）\n\n```\n<!doctype html>\n<html>\n  <head>\n\
  \    <meta charset=\"utf-8\">\n    <title>coffeerun</title>\n  </head>\n  <body>\n\
  \n  </</body>>\n</html>\n```\n\n你现在准备好创建你的第一个模块了！\n\n## 创建 DataStore 模块\n\n你将编写的第一个模块将订单信息存储在一个简单的数据库中，类似于手写。每个订单将根据客户的电子邮件地址存储。为了开始，你只跟踪文本描述，例如“四倍浓缩”（图\
  \ 8.6）。\n\n**图 8.6 CoffeeRun 数据库的初始结构**\n\n![CoffeeRun 数据库的初始结构](img/database.png)\n\
  \n以后，你还将跟踪每个订单的大小、口味和咖啡因强度。客户的电子邮件地址将作为订单的唯一标识（抱歉，咖啡瘾者！每个客户只有一个订单）。\n\n创建一个名为 `scripts/datastore.js`\
  \ 的文件。接下来，在 `index.html` 中添加 `<script>` 标签将新文件包含在项目中。\n\n```\n<!doctype html>\n\
  <html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>coffeerun</title>\n \
  \ </head>\n  <body>\n    <script src=\"scripts/datastore.js\" charset=\"utf-8\"\
  ></script>\n  </body>\n</html>\n```\n\n保存 `index.html`。在 `scripts/datastore.js`\
  \ 中，从模块结构的基本 IIFE 开始：\n\n```\n(function (window) {\n  'use strict';\n  // 代码将放在这里\n\
  })(window);\n```\n\n现在你的模块骨架已经存在并有了相应的 `<script>` 标签，是时候将其附加到应用程序的命名空间了。\n\n## 将模块添加到命名空间\n\
  \n许多其他编程语言都有创建模块并将它们打包在一起的特殊语法。ES5 没有。相反，你可以使用对象来实现类似的组织方式。\n\n使用 IIFE 在命名空间中注册模块有三个步骤：\n\
  \n\n\n\n1. 获取命名空间的引用（如果它存在）。\n2. 创建模块代码。\n3. 将你的模块代码附加到命名空间上。\n\n让我们看看在实践中它是什么样的。按照所示更新你在\
  \ `datastore.js` 中的 IIFE。在你输入代码后，我们将解释这些代码。\n\n```\n(function (window) {\n  'use\
  \ strict';\n  // 代码将放在这里\n  var App = window.App || {};\n\n  function DataStore()\
  \ {\n    console.log('running the DataStore function');\n  }\n\n  App.DataStore\
  \ = DataStore;\n  window.App = App;\n})(window);\n```\n\n在 IIFE 的体内，你声明了一个名为 `App`\
  \ 的局部变量。如果 `window` 上已经有一个 `App` 属性，你会将局部的 `App` 赋值给它。如果没有，标签 `App` 将指向一个全新的空对象，用\
  \ `{}` 表示。`||` 是`默认值运算符`，也称为`逻辑或运算符`。它可以用于在第一个选择（`window.App`）尚未创建时，提供一个有效的值（在此例中为\
  \ `{}`）。\n\n你的每个模块都将执行相同的检查。这就像在说：“谁先到，谁就去创建一个新对象。其他人都将使用那个对象。”\n\n接下来，你声明了一个名为\
  \ `DataStore` 的函数。稍后你将向此函数添加更多代码。\n\n最后，你将 `DataStore` 附加到 `App` 对象上，并将全局 `App`\
  \ 属性重新赋值为你新修改的 `App`。（如果它尚不存在且你必须将其创建一个空对象，则你必须附加它。）\n\n保存你的文件并切换到浏览器。打开开发者工具，点击控制台（console）标签页，使用以下代码调用你的\
  \ `DataStore` 函数：\n\n```\nApp.DataStore();\n```\n\n`DataStore` 运行并在控制台上打印了一些文本（图\
  \ 8.7）。\n\n**图 8.7  运行 `App.DataStore` 函数**\n\n![Running the App.DataStore function](img/running-datastore.png)\n\
  \n注意，你不需要编写 `window.App.DataStore();`。这是因为 `window` 对象是全局命名空间。它的所有属性对你编写的任何 JavaScript\
  \ 代码都可用，包括在控制台中。\n\n## 构造函数\n\nIIFE 让你利用函数作用域来创建命名空间，以组织大型代码段。函数还有另一种用途，使其像工厂一样创建具有相似属性和方法的对象。在其他语言中，你可能会使用类来进行这种组织。严格来说，JavaScript\
  \ 没有类，但它确实为你提供了一种创建自定义类型的方法。\n\n你比已经开始创建 `DataStore` 类型了。现在你将通过两个步骤对其进行自定义。在第一步中，你将给它一个在内部用于存储数据的属性。在第二步中，你将给它一组用于与该数据交互的方法。你不需要让其他对象直接访问该数据，因此该类型将通过一组方法提供外部接口。\n\
  \n对象工厂函数在 JavaScript 中被称为`构造函数`（constructors）。\n\n将以下代码添加到 `datastore.js` 中 `DataStore`\
  \ 函数的体内。\n\n```\n(function (window) {\n  'use strict';\n  var App = window.App ||\
  \ {};\n\n  function DataStore() {\n    console.log('running the DataStore function');\n\
  \    this.data = {};\n  }\n\n  App.DataStore = DataStore;\n  window.App = App;\n\
  })(window);\n```\n\n构造函数的工作是创建并自定义一个新对象。在构造函数的体内，你可以使用关键字 `this` 来引用该新对象。你使用点运算符在你的新对象上创建了一个名为\
  \ `data` 的属性，并将一个空对象赋值给 `data`。\n\n你可能已经注意到你将 `DataStore` 的第一个字母大写了。这是 JavaScript\
  \ 在命名构造函数时的惯例。这并不是必须的，但它是良好的做法，可以告诉其他开发者该函数应该被当作构造函数使用。\n\n为了区分构造函数和普通函数，你在调用它时使用关键字\
  \ `new`。这告诉 JavaScript 创建一个新对象，建立从 `this` 到该新对象的引用，并`隐式地`（implicitly）`返回`（return）该对象。这意味着它即使在构造函数中没有显式的\
  \ `return` 语句，也会`返回`该对象。\n\n保存并返回控制台。为了学习如何使用构造函数，你将创建两个 `DataStore` 对象（或`实例`）并向它们添加值。从创建实例开始。\n\
  \n```\nvar dsOne = new App.DataStore();\nvar dsTwo = new App.DataStore();\n```\n\
  \n你通过调用 `DataStore` 构造函数创建了这些 `DataStore` 实例。此时，每个实例都有一个空的 `data` 属性。向它们添加一些值：\n\
  \n```\ndsOne.data['email'] = 'james@bond.com';\ndsOne.data['order'] = 'black coffee';\n\
  dsTwo.data['email'] = 'moneypenny@bond.com';\ndsTwo.data['order'] = 'chai tea';\n\
  ```\n\n然后检查这些值：\n\n```\ndsOne.data;\ndsTwo.data;\n```\n\n结果告诉你每个实例都持有不同的信息（图 8.8）。\n\
  \n**图 8.8  向 `DataStore` 构造函数赋值**\n\n![Saving values to the DataStore constructor](img/new-datastore-data.png)\n\
  \n### 构造函数的原型\n\n使用 `DataStore` 实例，你可以手动存储和检索数据。但在当前的形式下，`DataStore` 只是创建对象的一种迂回方式，任何使用\
  \ `DataStore` 实例的模块都必须编写为直接使用 `data` 属性。\n\n这并不是良好的设计。如果 `DataStore` 能提供一个添加、删除和检索数据的公共接口，同时将其工作原理保持秘密，将会更好。\n\
  \n创建自定义 `DataStore` 类型的第二部分是提供这些与数据交互的方法。目标是让这些方法成为其他模块与 `DataStore` 实例交互时使用的接口。为了实现这一点，你将利用\
  \ JavaScript 函数的一个非常酷的特性：`prototype`（原型）属性。\n\nJavaScript 中的函数也是对象。这意味着它们拥有属性。在\
  \ JavaScript 中，所有由构造函数创建的实例都可以访问共享的属性和方法存储库：构造函数的 `prototype` 属性。\n\n你在调用构造函数时使用\
  \ `new` 关键字来创建这些实例。`new` 关键字不仅创建了你的实例并返回它，还从实例到构造函数的 `prototype` 属性之间建立了一个特殊的链接。该链接对于任何使用\
  \ `new` 关键字创建的构造函数实例都存在。\n\n\n\n\n为了看到这些操作的效果，请在 `datastore.js` 中作为原型链的一个属性创建 `add`\
  \ 函数。你也可以删除对 `console.log` 的调用。\n\n```\n(function (window) {\n  'use strict';\n\
  \  var App = window.App || {};\n\n  function DataStore() {\n    console.log('running\
  \ the DataStore function');\n    this.data = {};\n  }\n\n  DataStore.prototype.add\
  \ = function (key, val) {\n    this.data[key] = val;\n  };\n\n  App.DataStore =\
  \ DataStore;\n  window.App = App;\n})(window);\n```\n\n你为 `DataStore.prototype`\
  \ 赋予了属性 `add`，并为其分配了一个函数。该函数接收两个参数：`key` 和 `val`。在函数体内部，你使用这些参数对实例的 `data` 属性进行修改。\n\
  \n从 `DataStore` 如何处理咖啡订单来看，它将使用客户的电子邮件地址（`key`）来存储订单信息（`val`）。\n\n你并没有建立一个真正的数据库，但\
  \ `DataStore` 对于 CoffeeRun 来说已经足够用了。它能够根据 `key` 指定的唯一标识符保存某些信息 `val`。由于你使用 JavaScript\
  \ 对象进行存储，因此每个 `key` 保证是数据库中唯一的条目。（在 JavaScript 对象中，属性名始终是唯一的，就像命名空间内的函数名一样。如果你尝试使用相同的\
  \ `key` 存储不同的值，你将会覆盖该键之前的任何值。）\n\nJavaScript 对象的这一特性满足了任何数据库的一个主要需求：保持各个数据单元相互独立。\n\
  \n保存你的代码并切换回浏览器。在控制台中创建一个 `DataStore` 实例，并使用它的 `add` 方法存储一些信息。\n\n```\nvar ds =\
  \ new App.DataStore();\nds.add('email', 'q@bond.com');\nds.add('order', 'triple\
  \ espresso');\nds.data;\n```\n\n检查 `data` 属性以确认其工作正常（见图 8.9]）。\n\n**图 8.9 调用原型方法**\n\
  \n![调用原型方法](img/using-add-prototype-method.png)\n\n### 为构造函数添加方法\n\n接下来的工作是创建访问数据的方法。在\
  \ `datastore.js` 中，添加一个根据给定 `key` 查找值的方法，以及一个查找所有键值对的方法。\n\n```\n...\n  DataStore.prototype.add\
  \ = function (key, val) {\n    this.data[key] = val;\n  };\n\n  DataStore.prototype.get\
  \ = function (key) {\n    return this.data[key];\n  };\n\n  DataStore.prototype.getAll\
  \ = function () {\n    return this.data;\n  };\n\n  App.DataStore = DataStore;\n\
  \  window.App = App;\n})(window);\n```\n\n你创建了一个接收 `key` 的 `get` 方法，它在实例的 `data`\
  \ 属性中查找该值并将其 `return` 返回。你还创建了 `getAll` 方法。它几乎相同，但它返回的不是单个键的值，而是返回 `data` 属性的引用。\n\
  \n你现在可以从 `DataStore` 实例中添加和检索信息了。为了完成这个循环，你需要添加一个删除信息的方法。现在将其添加到 `datastore.js`\
  \ 中。\n\n```\n...\n  DataStore.prototype.getAll = function () {\n    return this.data;\n\
  \  };\n\n  DataStore.prototype.remove = function (key) {\n    delete this.data[key];\n\
  \  };\n\n  App.DataStore = DataStore;\n  window.App = App;\n})(window);\n```\n\n\
  当你的新 `remove` 方法被调用时，`delete` 操作符会从对象中移除键/值对。\n\n到此，你已经完成了 `DataStore` 模块，它提供了 CoffeeRun\
  \ 应用最重要的部分。它可以存储数据、响应查询提供存储的数据，并根据命令删除不需要的数据。\n\n要看到你所有方法的效果，请保存代码，并在 `browser-sync`\
  \ 重新加载浏览器后进入控制台。输入以下代码，这将测试 `DataStore` 的所有方法：\n\n```\nvar ds = new App.DataStore();\n\
  ds.add('m@bond.com', 'tea');\nds.add('james@bond.com', 'eshpressho');\nds.getAll();\n\
  ds.remove('james@bond.com');\nds.getAll();\nds.get('m@bond.com');\nds.get('james@bond.com');\n\
  ```\n\n如**图 8.10]所示，`DataStore` 的方法现在应该可以工作了。这些方法完全预期。\n\n**图 8.10 与 DataStore 操作**\n\
  \n![与 DataStore 操作](img/ds-interface-exercise)\n\n### 创建 Truck 模块\n\n你将编写的下一个模块是\
  \ `Truck` 模块，它将为餐餐车提供所有功能。它将拥有创建和打印待处理订单列表的方法。见图 8.11]显示了 `Truck` 模块将如何与 `DataStore`\
  \ 模块工作。\n\n**图 8.11 Truck 模块与 DataStore 交互**\n\n![Truck 模块与 DataStore 交互](img/truck-datastore)\n\
  \n当创建一个 `Truck` 实例时，它会被赋予一个 `DataStore` 对象。`Truck` 有处理咖啡订单的方法，但它不应该担心如何存储信息。相反，`Truck`\
  \ 将这些职责交给了 `DataStore`。例如，当你调用 `Truck` 的 `createOrder` 方法时，它会调用 `DataStore` 的 `add`\
  \ 方法。\n\n创建 `scripts/truck.js` 文件并在 `index.html` 中为它添加 `<script>` 标签。\n\n```html\n\
  <!doctype html>\n<html>\n  <head>\n    <meta charset=\"utf-8\">\n    <title>coffeerun</title>\n\
  \  </head>\n  <body>\n    <script src=\"scripts/datastore.js\" charset=\"utf-8\"\
  ></script>\n    <script src=\"scripts/truck.js\" charset=\"utf-8\"></script>\n \
  \ </body>\n</html>\n```\n\n保存 `index.html`。在 `scripts/truck.js` 中，使用 IIFE 和一个用于\
  \ `Truck` 类型的构造函数设置你的模块。\n\n```javascript\n(function (window) {\n  'use strict';\n\
  \  var App = window.App || {};\n\n  function Truck() {\n  }\n\n  App.Truck = Truck;\n\
  \  window.App = App;\n\n})(window);\n```\n\n接下来，你将为你的构造函数添加参数，以便每个实例都有一个唯一的标识符和一个\
  \ `DataStore` 实例。标识符只是用于区分不同 `Truck` 实例的名称。`DataStore` 实例将扮演更重要的角色。\n\n在 `scripts/truck.js`\
  \ 中添加新参数。\n\n```javascript\n(function (window) {\n  'use strict';\n  var App = window.App\
  \ || {};\n\n  function Truck(truckId, db) {\n    this.truckId = truckId;\n    this.db\
  \ = db;\n  }\n\n  App.Truck = Truck;\n  window.App = App;\n\n})(window);\n```\n\n\
  \n\n你为 `truckId` 和 `db` 声明了参数，然后将它们每一个都赋值为新构造实例的属性。\n\n`Truck` 实例需要方法来管理咖啡订单，你接下来将添加这些方法。订单数据将包含一个邮箱地址和饮品规格。\n\
  \n### 添加订单\n\n要添加第一个方法是 `createOrder`。当调用此方法时，`Truck` 实例将通过你之前声明的 `DataStore` 方法与其\
  \ `db` 属性交互。具体来说，你将调用 `DataStore` 的 `add` 方法，使用与订单相关的电子邮件地址来存储咖啡订单。\n\n在 `truck.js`\
  \ 中声明这个新的原型方法。\n\n```\n...\n  function Truck(truckId, db) {\n    this.truckId =\
  \ truckId;\n    this.db = db;\n  }\n\n  Truck.prototype.createOrder = function (order)\
  \ {\n    console.log('Adding order for ' + order.emailAddress);\n    this.db.add(order.emailAddress,\
  \ order);\n  };\n\n  App.Truck = Truck;\n  window.App = App;\n\n})(window);\n```\n\
  \n你在 `createOrder` 中向控制台打印了一条消息，然后使用 `db` 的 `add` 方法存储订单信息。\n\n使用 `add` 方法非常简单，只需引用\
  \ `Truck` 的 `db` 实例变量并调用 `add` 即可。你不需要在该模块的任何地方指定 `App.DataStore` 命名空间或提到 `DataStore`\
  \ 构造函数。`Truck`get 的设计是为了配合任何与 `DataStore` 相同方法名的对象。`Truck` 不需要知道除此之外的任何细节。\n\n保存文件并在控制台中中使用以下条目测试\
  \ `createOrder`：\n\n```javascript\nvar myTruck = new App.Truck('007', new App.DataStore());\n\
  myTruck.createOrder({ emailAddress: 'dr@no.com', coffee: 'decaf'});\nmyTruck.createOrder({\
  \ emailAddress: 'me@goldfinger.com', coffee: 'double mocha'});\nmyTruck.createOrder({\
  \ emailAddress: 'm@bond.com', coffee: 'earl grey'});\nmyTruck.db;\n```\n\n你的结果应该看起来像图\
  \ 8.12。\n\n**图 8.12 对 `Truck.prototype.createOrder` 进行试运行**\n\n![Taking Truck.prototype.createOrder\
  \ for a test drive](img/using-createorder.png)\n\n当控制台打印 `myTruck.db` 的值时，你需要点击\
  \ ![Taking Truck.prototype.createOrder for a test drive](img/arrow.png) 图标，以便看到嵌套属性（例如\
  \ `data` 对象内部的 `dr@no.com` 属性）。\n\n### 移除订单\n\n当订单交付时，`Truck` 实例应该从其数据库中移除订单。在 `truck.js`\
  \ 的 `Truck.prototype` 对象上添加一个新的 `deliverOrder` 方法。\n\n```javascript\n...\n  Truck.prototype.createOrder\
  \ = function (order) {\n    console.log('Adding order for ' + data.emailAddress);\n\
  \    this.db.add(data.emailAddress, order);\n  };\n\n  Truck.prototype.deliverOrder\
  \ = function (customerId) {\n    console.log('Delivering order for ' + customerId);\n\
  \    this.db.remove(customerId);\n  };\n\n  App.Truck = Truck;\n  window.App = App;\n\
  \n})(window);\n```\n\n你将一个函数表达式赋值给了 `Truck.prototype.deliverOrder`。该函数接受一个 `customerId`\
  \ 参数，然后将其传递给 `this.db.remove`。`customerId` 的值应该是与订单相关的电子邮件地址。\n\n就像 `createOrder`\
  \ 一样，`deliverOrder` 只于调用 `this.db` 的 `remove` 方法。它不需要关于 `remove` 实际上如何工作的任何细节。\n\
  \n保存并切换到控制台。创建一个 `Truck` 实例，使用 `createOrder` 添加几个订单，然后确保 `deliverOrder` 将它们从实例的\
  \ `db` 中移除。（你可以在每次调用 `createOrder` 和 `deliverOrder` 后按回车键或 Shift-回车键。）\n\n```javascript\n\
  var myTruck = new App.Truck('007', new App.DataStore());\nmyTruck.createOrder({\
  \ emailAddress: 'dr@no.com', coffee: 'decaf'});\nmyTruck.createOrder({ emailAddress:\
  \ 'me@goldfinger.com', coffee: 'double mocha'});\nmyTruck.createOrder({ emailAddress:\
  \ 'm@bond.com', coffee: 'earl grey'});\nmyTruck.db;\n```\n\n当你输入这些命令时，你会发现调用 `deliverOrder`\
  \ 之后 `myTruck.db` 发生了变化（图 8.13）。\n\n**图 8.13 使用 `Truck.prototype.createOrder` 移除数据**\n\
  \n![Removing data with Truck.prototype.createOrder](img/using-createorder.png)\n\
  \n注意，控制台显示的是你点击 ![Removing data with Truck.prototype.createOrder](img/arrow.png)\
  \ 图标时的数据。如果你在调用 `deliverOrder` 之前没有检查 `myTruck.db` 中的值，看起来就像数据从未被添加过（图 8.14）。\n\n\
  **图 8.14 控制台显示点击图标时的值**\n\n![Console shows values at time of clicking icon](img/unexpected.png)\n\
  \n### 调试\n\n你要添加到 `Truck.prototype` 对象的最后一个方法是 `printOrders`。该方法将获取一个包含所有客户邮箱地址的数组，遍历该数组并\
  \ `console.log` 订单信息。\n\n该方法的代码与你已经编写的其他函数和方法非常相似。但它最初会有一个 bug，你将使用 `Chrome` 的调试工具发现它。\n\
  \n让我们一步到位。首先在 `truck.js` 中创建 `printOrders` 的基础版本。在函数体内，你将从 `db` 对象中检索所有的咖啡订单。然后你将使用\
  \ `Object.keys` 方法获取一个包含订单电子邮件地址的数组。最后，你遍历电子邮件地址数组并为数组中的每个元素运行回调函数。\n```javascript\n\
  \  Truck.prototype.printOrders = function () {\n    var customerIdArray = Object.keys(this.db.getAll());\n\
  \n    console.log('Truck #' + this.truckId + ' has pending orders:');\n    customerIdArray.forEach(function\
  \ (id) {\n      console.log(this.db.get(id));\n    });\n  };\n```\n\n\n\n在新的 `printOrders`\
  \ 方法内部，你调用 `this.db.getAll` 来以键值对的形式检索所有订单，并将它们传递给 `Object.keys`，后者会返回一个仅包含键的数组。你将此数组赋值给变量\
  \ `customerIdArray`。\n\n当你遍历此数组时，向 `forEach` 传递了一个回调函数。在回调函数的体中，你尝试 `get` 获取与 `id`（客户电子邮件）关联的订单。\n\
  \n保存并返回控制台。创建一个 `Truck` 的新实例并添加一些咖啡订单。然后尝试你新的 `printOrders` 方法。\n\n```\nvar myTruck\
  \ = new App.Truck('007', new App.DataStore());\nmyTruck.createOrder({ emailAddress:\
  \ 'm@bond.com', coffee: 'earl grey'});\nmyTruck.createOrder({ emailAddress: 'dr@no.com',\
  \ coffee: 'decaf'});\nmyTruck.createOrder({ emailAddress: 'me@goldfinger.com', coffee:\
  \ 'double mocha'});\nmyTruck.printOrders();\n```\n\n你看到的不是咖啡订单列表，而是错误 `Uncaught\
  \ TypeError: Cannot read property 'db' of undefined` (Figure 8.15)。\n\n**图 8.15\
  \ 运行 printOrders 时的错误**\n\n![运行 printOrders 时的错误](img/uncaught-error-this-db.png)\n\
  \n这是你在编写 JavaScript 时看到的最常见错误之一。许多开发者发现它特别令人沮丧，因为很难确定错误原因。知道如何使用调试器（正如你即将要做的那样）是定位问题的关键。\n\
  \n### 使用 DevTools 定位错误\n\n调试需要你通过逐步隔离有问题的代码来重现错误。`Chrome` 调试器让这个过程（几乎）变得令人愉快。\n\n\
  当发生错误时，控制台会显示导致错误的代码文件名和行号。（在图 8.15 中），引用的是 `truck.js:30`；你的行号可能会有所不同。点击该文本可以在调试工具中打开出错的行代码（图\
