  \ Web 开发\n进行前端 Web 开发可能需要转变视角，因为它与其他平台的开发有很大不同。在学习过程中，有几点需要你注意。\n<samp class=\"\
  emphasis\">浏览器是一个平台。</samp>\n你可能进行过 iOS 或 Android 的原生开发；编写过 Ruby 或 PHP 的服务器端代码；或者为\
  \ OS X 或 Windows 构建构建过桌面应用程序。作为一名前端开发人员，你的代码将针对浏览器——这是一个存在于世界上几乎所有手机、平板电脑和个人电脑上的平台。\n\
  <samp class=\"emphasis\">前端开发跨越整个光谱。</samp>\n光谱的一端是网页的外观和感受：圆角、阴影、颜色、字体、留白等。光谱的另一端是控制该网页复杂行为的逻辑：在交互式相册中切换图片、验证输入表单的数据、在聊天网络中发送消息等。在整个过程中，你将需要精通贯穿整个光谱的核心技术，并且你通常需要协同使用多种技术来创建一个出色的\
  \ Web 应用程序。\n<samp class=\"emphasis\">Web 技术是开放的。</samp>\n\n\n没有任何一家公司可以控制浏览器的应该工作方式。这意味着前端开发者不会获得一个年度的\
  \ SDK 版本，该版本将包含他们在未来十二个月内需要处理的所有更改。原生平台像是一片结冰的池塘，你可以在上面舒适地滑冰。而 Web 是一条河流；它弯曲、流动迅速，并且在某些地方布满岩石——但这正是它的魅力所在。Web\
  \ 是目前进化最快的平台。适应变化是前端开发者的生活方式。\n本书的目的是教你如何为浏览器开发程序。随着本指南的引导，你将经历一个构建一系列项目的过程。每个项目将要求前端光谱中不同技术的组合。由于可用的前端工具、库和框架数量庞大，本书将重点关注最核心且可移植的模式和技术。\n\
  ## 先决条件\n本书并不是一本编程入门书。它假设你已经有了编写代码基础的经验。你被认为熟悉基本类型、函数和对象。\n尽管如此，它也不假设你已经了解 JavaScript。我们会在你需要时，结合语境向你介绍\
  \ JavaScript 概念。\n## 本书的结构\n本书将引导你编写四个不同的 Web 应用程序。每个应用程序在书中都有自己的章节。章节中的每一章都会为你正在构建的应用程序添加新功能。\n\
  构建这四个应用程序的工作将带你从前端光谱的一端走向另一端。\n| <samp class=\"emphasis\">Ottergram</samp> |\n|\
  \ <samp class=\"emphasis\">CoffeeRun</samp> |\n| <samp class=\"emphasis\">Chattrbox</samp>\
  \ |\n| <samp class=\"emphasis\">Tracker</samp> |\n在完成这些应用程序的过程中，你将接触许多工具，包括：\n*\
  \ Atom 编辑器以及一些用于处理代码的有用插件\n* 命令行，使用 OS X <samp class=\"application\">Terminal</samp>\
  \ 应用或 Windows 命令提示符\n* Google Chrome 开发者工具\n* `Bootstrap`\n* `Node.js`、Node 包管理器\
  \ (`npm`) 和 `nodemon`\n* `Babel`、`Babelify`、`Browserify` 和 `Watchify`\n* `Bower`\n\
  * `Watchman`\n## 如何使用本书\n本书不是一本参考书。它的目标是帮助你跨越初始的坎坷，能够充分利用现有的参考书和食谱书。它基于我们在 Big Nerd\
  \ Ranch 的五天课程，因此，它应该从头开始学习。章节之间环环相扣，跳跃式阅读将毫无产效。\n在我们的课程中，学生学习这些材料，但他们也能从良好的环境中获益——专门的教室、良好的食物和舒适的白板、一群充满动力的同伴，以及一位可以解答问题的导师。\n\
  作为读者，你可能希望你的环境也是类似的。这意味着保证充足的睡眠并找一个安静的地方工作。这些事情也有帮助：\n* 与你的朋友或同事建立一个阅读小组。\n* 参加本书在\
  \ [<samp class=\"uri\">forums.bignerdranch.com</samp>](http://forums.bignerdranch.com)\
  \ 的论坛，你可以在那里讨论本书并找到错误列表和解决方案。\n\n\n\n\n* 银级挑战要求你进行更深层的挖掘和思考。有时你可能需要使用以前没过的函数、事件、标记和样式，但任务仍然与你在章节中所的操作相似。\n\
