  Maurice the Otter\">\n        </a>\n      <li>\n          <img src=\"img/otter4.jpg\"\
  \ alt=\"Lesley the Otter\">\n        </a>\n      <li>\n          <img src=\"img/otter5.jpg\"\
  \ alt=\"Barbara the Otter\">\n        </a>\n    </ul>\n```\n如果你的代码行没有良好对齐，你可以利用你已经安装的\
  \ `<samp class=\"application\">atom-beautify</samp>` 插件。点击 `<samp class=\"guimenu\"\
  >Packages</samp>` → `<samp class=\"guisubmenu\">Atom Beautify</samp>` → `<samp class=\"\
  guimenuitem\">Beautify</samp>`，代码就会自动为你对齐并缩进。\n让我们来看看你添加了什么。\n`<a>` 标签是锚点标签。锚点标签使页面上的元素变得可点击，从而引导用户进入另一个页面。它们通常被称为“链接（links）”，但注意：它们与你之前使用的\
  \ `<link>` 标签不同。\n锚点标签有一个 `href` 属性，指示锚点指向的资源。通常，该值是一个网页地址。但有时你并不希望链接跳转到任何地方。现在的情况如此，所以你为\
  \ `href` 属性分配了“占位符”值 `#`。这会让浏览器在点击图像时滚动到页面顶部。稍后，你将使用锚点标签在点击缩略图时打开更大版本的图像。\n在锚点标签内部，你添加了\
  \ `<img>`，即图像标签，这些标签带有 `src` 属性，指向之前添加的 `img` 目录中的文件名。你还为图像标签添加了描述性的 `alt` 属性。`alt`\
  \ 属性包含在图像无法加载时替换图像的文本。`alt` 文本也是屏幕阅读器用于向视觉障碍用户描述图像的内容。\n图像标签与大多数其他元素不同之处在于，它们不包裹其他元素，而是引用某种资源。当浏览器遇到\
  \ `<img>` 标签时，它会将图像绘制到页面上。这被称为替换元素（replaced element）。其他替换元素还包括嵌入文档和 applet。\n由于它们不包含内容或其他元素，`<img>`\
  \ 标签没有对应的结束标签。这使得它们成为自合标签（也称为空标签 void tags）。你有时会看到在右括号前带有一个斜杠的自合标签，例如 `<img src=\"\
  otter.jpg\"/>`。是否包含斜杠取决于个人喜，对浏览器没有影响。在本书中，自合标签是不带斜杠的。\n保存 `index.html`。稍后，你将看到你代码的结果。\n\
