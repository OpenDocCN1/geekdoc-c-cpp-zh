  \ 调用成功时才从检查列表中移除项。\n\n在 `checklist.js` 中，在传递给 `addClickHandler` 的函数后链式调用 `.then`。记得为匿名函数\
  \ `.bind` `this` 的值。\n\n```\n...\n  CheckList.prototype.addClickHandler = function\
