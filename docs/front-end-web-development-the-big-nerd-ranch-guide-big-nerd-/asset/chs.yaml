  ]';\n\nlet username = '';\nusername = promptForUsername();\n\nclass ChatApp {\n\
  \  ...\n```\n\n现在，更新 `ChatMessage` 使用该用户名作为默认值。记住，只有从服务器接收的消息才有 `data.user` 值。\n\
