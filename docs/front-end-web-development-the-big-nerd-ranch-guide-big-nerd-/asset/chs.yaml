  那就是 `favicon.ico` 文件。很多网站都有一个，而且浏览器默认会请求一个。由于 Ottergram 没有它，你可能会在开发者工具中看到类似图 2.20\
  \ 中的错误。\n**图 2.20 关于缺失 `favicon.ico` 的错误**\n![缺失 favicon.ico 的错误](img/favicon-warning.png)\n\
  如果出现这个错误，不要担心。它不会影响你的项目。但是，你可以轻松添加一个 `favicon.ico` ——这就是你的第一个挑战。\n## 银牌挑战：添加 favicon.ico\n\
  你决定你更喜欢水獭，而不是看到 `favicon.ico` 错误信息。你将使用其中一张水獭图像创建一个 <samp class=\"filename\">favicon.ico</samp>\
  \ 文件。\n在网上搜索“favicon generator”，你应该能看到一个可以为你进行文件转换的网站列表。大多数网站允许你上传图片，然后提供 <samp\
  \ class=\"filename\">favicon.ico</samp> 版本。\n选择一个并上传任意一张水獭图像。\n将生成的 <samp class=\"\
  filename\">favicon.ico</samp> 文件保存到与 <samp class=\"filename\">index.html</samp>\
  \ 相同的文件夹中。最后，重新加载浏览器。你的浏览器看起来会类似于图 2.21。\n**图 2.21 `favicon.ico`**\n![`favicon.ico`](img/devtools.png)\n\
  # 3 样式\n本章介绍了一些概念和示例。当你读完时，如果觉得还没有完全掌握所有内容，不要担心。在学习过程中，你会反复遇到它们。\n当然，我们只能介绍 CSS\
  \ 中可用的一小部分样式。你可能需要参考 MDN 获取完整集合的信息。\n前端开发人员在两种网站样式设计方法之间进行选择：从整体布局开始到细节，或者从最小细节开始到布局。\n\
  从细节到整体的方法不仅能产生更简洁、更可复用的代码，还有一个很酷的名字：<samp class=\"firstterm\">原子样式</samp>。你在编写缩略图时将使用这种方法。在下一章中，你将处理整个网站的布局。\n\
  ## 创建样式基准\n你将通过向项目添加 <samp class=\"filename\">normalize.css</samp> 文件来开始。<samp class=\"\
  filename\">normalize.css</samp> 帮助你编写的 CSS 在不同浏览器中显示一致。所有浏览器都带有一组默认样式，但不同浏览器之间是不同的。<samp\
  \ class=\"filename\">normalize.css</samp> 为你开发网站或 Web 应用自定义 CSS 提供了一个良好的起点。\n<samp\
  \ class=\"filename\">normalize.css</samp> 在网上免费提供。你不需要下载它。要将其添加到 Ottergram，你只需要在\
  \ <samp class=\"filename\">index.html</samp> 中引用它。\n为了确保你使用的是最新版本的 <samp class=\"\
  filename\">normalize.css</samp>，你将从内容共享网站获取其地址。访问 [<samp class=\"uri\">cdnjs.com/​libraries/​normalize</samp>](http://cdnjs.com/libraries/normalize/)\
  \ 并找到以 `.min.css` 结尾的文件。（此版本比其他小，删除了多余的空白）。点击 <samp class=\"guibutton\">Copy</samp>\
  \ 按钮复制其地址（图 3.2）。\n\n\n![从 cdnjs.com 获取 normalize.css 的链接](img/normalize-cdn.png)\n\
  本文写作当前的版本为 3.0.3，但你使用的版本可能更高。\n在 `Atom` 中打开你的 Ottergram 文件夹，然后打开 `index.html`。添加一个新的\
  \ `<link>` 标签并粘贴地址。（在下面的代码中，`<link>` 为了适应页面宽度被分成了两行。你可以将其保持在单行。）\n```\n<html\n \
  \   <meta charset=\"utf-8\">\n    <link rel=\"stylesheet\"\n    <link rel=\"stylesheet\"\
  \ href=\"stylesheets/styles.css\">\n...\n\n\n\n\n\n\n\n\n\n\n\n...\n      <li>\n\
  \          <img src=\"img/otter1.jpg\" alt=\"Barry the Otter\">\n          <span\
  \ class=\"thumbnail-title\">Barry</span>\n      </li>\n        <a href=\"#\">\n\
  \          <span>Robin</span>\n        </a>\n      <li>\n          <img src=\"img/otter1.jpg\"\
  \ alt=\"Maurice the Otter\">\n          <span class=\"thumbnail-title\">Maurice</span>\n\
  \      </li>\n        <a href=\"#\">\n          <span>Lesley</span>\n        </a>\n\
  \      <li>\n          <img src=\"img/otter5.jpg\" alt=\"Barbara the Otter\">\n\
  \          <span class=\"thumbnail-title\">Barbara</span>\n      </li>\n...\n\n\n\
  \n\n\n\n\n\n\n\n.thumbnail-title {\n  color: rgb(202, 238, 255);\n```\n\n\n你添加的三个声明都会影响元素的\
  \ `box`（盒）。对于每一个具有视觉呈现的 HTML 标签，浏览器都会页面上绘制一个矩形。浏览器使用称为`标准盒模型`（standard box model，或简称“盒模型”）的方案来确定该矩形的尺寸。\n\
  ## 盒模型\n为了理解盒模型，你将在开发者工具（DevTools）中查看它的。保存 `styles.css`，切换到 `Chrome`，并确保开发者工具已打开（图\
  \ 3.6]）。\n**图 3.6  探索盒模型**\n![探索盒模型](img/opened-after-linking-css.png)\n点击元素面板左上角的\
  \ ![探索盒模型](img/inspect-element-icon.png) 按钮。这是 `Inspect Element`（检查元素）按钮。现在，将光标移动到网页上的“ottergram”单词上。当你悬停在该单词上时，开发者工具会用蓝色和桃红色的矩形包围标题（图\
  \ 3.7]）。\n**图 3.7  悬停在标题上**\n![悬停在标题上](img/heading-being-inspected.png)\n点击网页上的“ottergram”单词。虽然你不再看到彩色的覆盖层，但该元素现在已被选中，元素面板中的\
  \ DOM 树视图将展开，显示并高亮对应的 `h1` 标签。\n元素面板右下角的矩形图表示 `h1` 元素的盒模型。你可以看到，图中的某些区域与你检查标题时看到的覆盖在其上的矩形具有相同的颜色（图\
  \ 3.8]）。\n**图 3.8  查看元素的盒模型**\n![查看元素的盒模型](img/box-model.png)\n盒模型包含了为元素绘制的矩形的四个方面（开发者工具在图中用四种不同的颜色渲染它们）：\n\
  - content（显示为蓝色）：视觉内容——在这里是文本\n- border（显示为黄色）：围绕在内容和内边距周围的边框，边框可以是可见的\n\n\n\n\n\
  .thumbnail-title {\n  margin: 0;\n\n  color: rgb(202, 238, 255);\n```\n`display:\
  \ block` 更改了所有类为 `.thumbnail-title` 的元素的盒，使其占据了容器元素允许的整个宽度。（注意图 3.6]中标题的背景颜色现在覆盖了更宽区域。）其他的\
  \ `display` 值，例如你之后将看到的 `display: inline` 属性，会让元素的宽度适应其内容。\n你还将缩略图标题的外边距设置为 0，并将边距设置为两个不同的值：4px\
  \ 和 10px（`px` 是“pixels”的缩写）。这会将内边距设置为特定的像素值，覆盖了用户代理样式表设置的默认大小。\nPadding、margin 和某些其他样式可以写为\
  \ `shorthand properties`（简写属性），其中一个值被应用于多个属性。你在这里利用了这一点：当为 padding 提供两个值时，第一个值应用于两个垂直方向（顶部和底部），第二个值应用于水平方向（左侧和右侧）。\n\
  ## 继承\n接下来，你将添加样式来更改字体大小。在 `styles.css` 中为 `body` 添加一个新的样式规则。要做到这一点，你将使用不同类型的选择器——`element\
  \ selector`（元素选择器），只需使用元素的名称。\n```css\n  font-size: 10px;\n\n  display: block;\n\
  \  padding: 4px 10px;\n  background: rgb(96, 125, 139);\n}\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\nbody {\n}\n.thumbnail-title {\n  margin: 0;\n\n  color:\
  \ rgb(202, 238, 255);\n  font-size: 18px;\n```\n对于类 `.thumbnail-title` 的元素，你将字体大小更改为了\
  \ 18 像素。\n保存 `styles.css`  `Chrome` 中欣赏你的缩略图标题（图 3.15）。\n**图 3.15  样式化的缩略图标题**\n\
  ![样式化的缩略图标题](img/thumbnail-title-box.png)\n看起来很好，但用户代理样式表为 `.thumbnail-title` 元素添加了下划线。这是因为你将它们（连同\
  \ `.thumbnail-image` 元素）封装在了锚点标签中，使得它们继承了下划线样式。\n你不需要这些下划线，因此你将通过在 `styles.css`\
  \ 的新样式规则中更改锚点标签的 `text-decoration` 属性来移除它们。你应该为此规则使用什么选择器？\n如果你确定要移除缩略图标题以及 Ottergram\
  \ 中任何其他锚点元素的下划线，你可以直接使用元素选择器：\n```css\n  /* style declaration */\n```\n（`/* */`\
  \ 之间的文本是 CSS 注释。浏览器会忽略代码注释；它们允许开发者在代码中做笔记以备后参考。）如果你认为你可能会将锚点用于其他用途（并想对它们应用不同的样式），可以将元素选择器与属性选择器结合，如下：\n\
  ```css\n  /* style declaration */\n```\n此选择器将匹配任何带有 `href` 属性的锚点元素。当然，锚点元素通常都有 `href`\
  \ 属性，因此可能不足以仅匹配缩略图和标题。为了使属性选择器更精确，你还可以指定属性的值，如下：\n```css\n  /* style declaration\
  \ */\n```\n顺便说一下，你也可以单独使用属性选择器，无论值，例如：\n```css\n  /* style declaration */\n```\n\
  事实上，Ottergram 是一个相当简单的项目，你实际上不会在缩略图和标题以外的任何地方使用标签。因此，使用元素选择器是安全的，你应该这样做是因为它是最直接的解决方案。\n\
  在 `styles.css` 中添加新的样式声明：\n```css\n  font-size: 10px;\n\n  text-decoration: none;\n\
  \n  ...\n```\n保存你的文件并检查浏览器。下划线消失了，你的缩略图标题样式很精美（图 3.16\n注意，你不应该移除普通正文中链接的下划线——即那些不是明显的标题、标题或说明的文本。链接的下划线是用户习惯的一种重要视觉指示。你在这里这样做是因为缩略图不需要同样的视觉提示。用户会合理预期它们是可以点击的。\n\
  在本章的剩余部分中，你将使用类选择器来设置缩略图图像、无序列表、列表项（包含缩略图及其标题），以及最后是页眉。先为 `index.html` 中的 `h1`、`ul`、`li`\
  \ 和 `img` 元素添加类名，以便在需要时使用。\n\n\n```html\n  </head>\n    <header>\n      <h1 class=\"\
  logo-text\">ottergram</h1>\n    <ul>\n      <li>\n        <a href=\"#\">\n     \
  \     <img class=\"thumbnail-image\" src=\"img/otter1.jpg\" alt=\"水獭 Barry\">\n\
  \        </a>\n      <li>\n        <a href=\"#\">\n          <img class=\"thumbnail-image\"\
  \ src=\"img/otter2.jpg\" alt=\"水獭 Robin\">\n        </a>\n      <li>\n        <a\
  \ href=\"#\">\n          <img class=\"thumbnail-image\" src=\"img/otter3.jpg\" alt=\"\
  水獭 Maurice\">\n        </a>\n      <li>\n        <a href=\"#\">\n          <img\
  \ class=\"thumbnail-image\" src=\"img/otter4.jpg\" alt=\"水獭 Lesley\">\n        </a>\n\
  \      <li>\n        <a href=\"#\">\n          <img class=\"thumbnail-image\" src=\"\
  img/otter5.jpg\" alt=\"水獭 Barbara\">\n        </a>\n    </ul>\n```\n通过向这些元素添加类名（class\
  \ names），你为即将添加的样式设置了目标。我们倾向于使用类选择器而不是其他类型的选择器，你也应该这样做。你可以编写非常有描述性的类名，让你的代码更容易开发和维护。此外，你还可以为元素添加多个类名，使其成为样式的强大工具。继续之前，务必保存\
  \ `index.html`。\n## 让图片适应窗口\n遵循原子模式（atomic pattern），接下来是需要设置样式的图片。它们太大了，除非浏览器窗口也很大，否则会被裁剪。在\
  \ `styles.css` 中为 `.thumbnail-image` 添加一条样式规则，使缩略图适应窗口：\n```css\na {\n}\n.thumbnail-image\
  \ {\n}\n.thumbnail-title {\n```\n你将 `width` 设置为 `100%`，这将其限制在容器的宽度内。这意味着随着你加宽浏览器窗口，图片会按比例放大。尝试一下：保存\
  \ `styles.css`，切换到浏览器，放大和缩小你的浏览器窗口。图片会随着窗口同步放大和缩小，始终保持其比例。图 17 显示了在一个窄窗口和一个宽窗口中显示的\
  \ Ottergram。\n**图 17 按宽度调整图片**\n![按宽度调整图片](img/constrained-width.png)\n如果你仔细观察，`.thumbnail-title`\
  \ 周围的间距不正确，因此标题看起来像是紧挨在它们下方的图片。在 `styles.css` 中通过将 `.thumbnail-image` 的 `display`\
  \ 属性设置为 `block` 来修复这个问题。\n```css\n.thumbnail-image {\n  width: 100%;\n...\n\n\n\n\
  \n\n\n\n\nbody {\n  background: rgb(149, 194, 215);\n\n  text-decoration: none;\n\
  \n  border: 1px solid rgb(100%, 100%, 100%);\n}\n```\n你为 `.thumbnail-item` 定义了两次值。为什么？注意这两个声明使用了不同的颜色函数：`rgb`\
  \ 和 `rgba`。`rgba` 函数接受第四个参数，即透明度。然而，某些浏览器不支持 `rgba`，因此提供两个声明是一种回退（fallback）技术。\n\
  所有浏览器都会看到第一个声明（`rgb`）并将其注册为 `border` 属性。不支持 `rgba` 的浏览器看到第二个声明并忽略它。支持 `rgba` 的浏览器将使用第二个声明并丢弃第一个。\n\
  （好奇为什么 `body` 的背景颜色是用整数定义的，而 `.thumbnail-item` 的边界颜色是用百分比定义的？稍后我们会回来。）\n保存 `styles.css`\
  \ 并切换到浏览器。图 19 显示了结果。\n**图 19 背景与边框**\n![背景与边框](img/thumbnail-item-border-color.png)\n\
  在开发者工具中，你可以看到 `Chrome` 支持 `rgba`。它划线表示 `rgb` 颜色未被使用。图 20 显示了结果。\n**图 20 浏览器使用了 rgba**\n\
  ![浏览器使用了 rgba](img/inheritance-crossout.png)\n现在，仍在开发者工具中，选择 `body`。在样式面板中，注意你刚刚添加的颜色声明。在\
  \ RGB 值左侧有一个小正方形，显示颜色的外观。\n点击那个正方形，会打开颜色选择器。图 21 显示了结果。\n**图 21 样式面板中的颜色选择器**\n\
  ![样式面板中的颜色选择器](img/color-picker.png)\n颜色选择器允许你选择颜色，并提供多种格式的 CSS 颜色值。要以不同的格式查看背景颜色，点击\
  \ RGBA 值右侧的箭头。你可以在 HSLA、HEX 和 RGBA 格式之间切换。\n\n\n查看背景颜色的 HEX 值：`#95C2D7`。HEX（或十六进制）是最老的颜色规格格式。每个数字代表一个从\
  \ 0 到 15 之间的值。（如果你不熟悉十六进制，这是通过包含字符 `A` 到 `F` 相应的数字来实现的。）然后，每对数字可以表示一个从 0 到 255 之间的值。从左到右，数字对对应于所指定颜色中红、绿、蓝的强度（参见图\
  \ 3.22）。\n图 3.22 HEX 值对应红、绿、蓝色值\n![HEX 值对应红、绿、蓝色值](img/hex-diagram.png)\n许多人认为 HEX\
  \ 颜色并不直观。一种现代的替代方案是使用 RGB（红、绿、蓝）值。在这种模型中，每种颜色也被分配一个 0 到 255 之间的值，但这些值用更熟悉的十进制数字表示，并用颜色隔开。如前所述，对于功能更强大的浏览器，第四个值可以指定指定颜色的透明度（opacity），范围从\
  \ 0.0（完全透明）到 1.0（完全不透明）。透明度正式称为 `alpha` 值 ——因此 RGBA 中有一个 `A`。`body` 背景颜色的 RGBA 值为\
  \ `(149, 194, 215, 1)`。\n作为为红、绿、蓝声明整数值的替代方案，你也可以使用百分比，就像你为 `.thumbnail-item` 边框的那样。这两个选项在功能上没有区别。只需不要在同一个声明中混合使用百分比和整数。\n\
  顺便说一下，为了帮助选择悦目的调方案，Adobe 在 [color.adobe.com](https://color.adobe.com/) 提供了一个免费的在线工具。\n\
  ## 调整项目之间的间距\nOttergram 现在有一些漂亮的颜色，让人联想起水獭的海洋。但添加颜色后，`.thumbnail-item` 元素的边界内部出现了一些不需要的空白。此外，那些讨厌人的项目符号分散了人们对水獭光彩的注意力。\n\
  要去掉项目符号，可以在 `styles.css` 中将 `.thumbnail-list` 的 `list-style` 属性设置为 `none`：\n```\n\
  .thumbnail-item {\n  border: 1px solid rgba(100%, 100%, 100%, 0.8);\n\n  list-style:\
  \ none;\n\n  ...\n\n\n...\n  display: block;\n  border: 1px solid rgba(100%, 100%,\
  \ 100%, 0.8);\n...\n\n\n\n\n\n\n\n\n\n\n\n（注：由于原文文本在“Relationship selectors”标题下方似乎出现了重复或逻辑混乱的段落，此处将根据提供的英文内容进行完整翻译，并确保不遗漏。）\n\
  \n\n\n\n\n\nbody span {\n}\n\n\nbody .thumbnail-title {\n}\n\n\nli > span {\n}\n\
  \n\n\nheader ~ ul {\n}\n\n\n\nli + li {\n}\n\n\n\n回到正题：为每个列表项的除第一个之外添加顶部外边距。如果你使用后代选择器或子选择器来定位\
  \ `.thumbnail-item` 类或 `span` 或 `li` 元素，外边距将应用于所有五个缩略图。由于你想为除第一个之外的所有项设置样式，请在 `styles.css`\
  \ 中使用相邻兄弟器语法，仅为紧跟在另一个缩略图之后的缩略图添加顶部外边距。\n```\na {\n}\n.thumbnail-item + .thumbnail-item\
  \ {\n}\n.thumbnail-item {\n```\n保存文件并在浏览器中查看结果（图 3.24）。\n**图 3.24  相邻 .thumbnail-item\
  \ 元素之间的间距**\n![相邻 .thumbnail-item 元素之间的间距](img/adjacent-spacing.png)\n注意，开发者工具提供了一种查找元素嵌套路径的简单方法，这有助于编写关系选择器。如果你点击\
  \ `li` 元素内部的某个 `span` 元素，你可以在元素面板的底部看到它的路径（图 3.25）。\n**图 3.25 元素面板显示的嵌套路径**\n![元素面板显示的嵌套路径](img/selector-path.png)\n\
  为了对缩略图列表的外观进行最后的微调，返回 `styles.css` 并覆盖 `ul` 从用户代理样式表所继承的内边距（padding），使得图像不再有缩进。\n\
  ```\n.thumbnail-list {\n  padding: 0;\n...\n\n\n\n\n\n\n\n...\n  text-decoration:\
  \ none;\n\n  background: white;\n  text-align: center;\n  font-size: 37px;\n\n \
  \ ...\n\n\n\n\n\n\n\n\n\n\n\n\n*   接下来是几个 `src` 声明，用于指定不同的字体文件。\n\n\n@font-face\
  \ {\n    src: url('fonts/lakeshore.eot') format('opentype'),\n         url('fonts/lakeshore.ttf')\
  \ format('truetype'),\n    font-weight: normal;\n}\nbody {\n  background: rgb(149,\
  \ 194, 215);\n\n  text-decoration: none;\n\n  background: white;\n  text-align:\
  \ center;\n  font-family: lakeshore;\n}\n```\n诚然，要正确设置 `@font-face` 声明可能很困难，因为 `url`\
  \ 值的顺序很重要。保留该声明的副本以参考是一个好主意。你也可以查看 Atom 的片段文档 [flight-manual.atom.io/using-atom/snippets/](http://flight-manual.atom.io/using-atom/snippets/)\
  \ 来创建你自己的“片段”或模板。\n声明 `@font-face` 后，你的其他 CSS 就可以访问 `font-family` 属性的 `lakeshore`\
  \ 值。在 `.logo-text` 声明中，你设置了 `font-family: lakeshore` 以应用新字体。\n保存 `styles.css`，切换到\
  \ `Chrome`，体验拥有像(图 3.29 一样时尚的网页的感觉。\n**图 3.29 应用自定义字体**\n![应用自定义字体](img/oh-yeah-header.png)\n\
  你在这一章中做了大量的样式工作，Ottergram 看起来极了！在下一章中，你将通过添加交互功能让它变得更好。\n 青铜挑战：更改颜色\n更改 `body` 的背景颜色样式。使用开发者工具中的颜色选择器（图\
  \ 3.21）来帮助你选择。\n为了获得更高级色板，访问 [color.adobe.com](https://color.adobe.com/) 并为 `body`\
  \ 和 `.thumbnail-title` 背景颜色创建你自己的方案。\n## 对于更好奇的人来说：优先级！当选择器冲突时……\n\n你已经看到了如何如何覆盖样式。例如，你将\
  \ `normalize.css` 的链接放在 `styles.css` 之前。这使得浏览器使用 `normalize.css` 的样式作为基准，而你的样式优先级则高于基准样式。\n\
  这是浏览器如何选择将哪些样式应用到页面元素上的第一个基本概念，前端开发者称之为 `recency`（后近性）：当浏览器处理 CSS 规则时，后处理的规则可以覆盖较早处理的规则。你可以通过更改\
  \ `<link>` 标签的顺序来控制浏览器处理 CSS 的顺序。\n当规则具有相同的选择器时，这很简单（例如，如果你的 CSS 和 `normalize.css`\
  \ 为 `body` 元素声明了不同的 `margin`）。在这种情况下，浏览器会选择较晚的声明。但如果一个元素被多个选择器匹配到，又如何呢？\n假设你在 Ottergram\
  \ 的 CSS 中有这两条规则：\n```\n  background: blue;\n\n  background: red;\n```\n这两条规则都会匹配你的\
  \ `<li>` 元素。你的 `<li>` 元素将具有什么背景颜色？尽管 `li { background: red; }` 规则较新，但仍会使用 `.thumbnail-item\
  \ { background: blue; }`。为什么？因为它使用了类选择器，它比元素选择器更具特殊性（即赋予了更高的权重值）。\n类选择器和属性选择器的特异性相同，且权重都高于元素选择器。最高级别的特异性属于\
  \ `ID 选择器`，你还没有见过它。如果你给元素赋予一个 `id` 属性，你可以写出一个比任何其他选择器都更具体的 ID 选择器。\n`id` 属性看起来与其他属性相似。例如：\n\
  ```\n```\n要在选择器中使用该 ID，需在它前面加上 `#` 前缀：\n```\n  background: blue;\n\n  background:\
  \ green;\n\n  background: red;\n```\n在此例中，`<li>` 被所有三个选择器匹配到，但它将具有绿色背景，因为 ID 选择器具有最高的权重。规则集的顺序在这里没有区别，因为每个规则的权重都不同。\n\
  关于使用 ID 选择器的一点：最好避免使用它们。ID 值在文档中必须唯一的，因此你不能在文档的任何其他元素中使用 `id=\"barry-otter\"` 属性。尽管\
  \ ID 选择器的权重最高，但它们关联的样式无法复用，这使其成为维护上的“反模式”。\n要了解更多关于特异性的知识，请访问 MDN 页面 `developer.mozilla.org/en-US/docs/Web/CSS/Specificity`。\n\
  `specificity.keegan.st` 上的特异性计算器是比较不同选择器权重的很好的工具。查看它可以更精确地理解权重是如何计算的。\n# 使用 Flexbox\
