  \ 文件夹。回想第 1 章，你使用 `cd` 命令加上要进入的文件夹路径来切换目录。获取 `ottergram` 路径的一种简单方法是在 `<samp class=\"\
  application\">Atom</samp>` 的左侧面板中 Control-点击（右键点击）`ottergram` 文件夹并选择 `<samp class=\"\
  guimenuitem\">Copy Full Path</samp>`（图 2.12）。然后在命令行中输入 `cd`，粘贴路径并按回车。\n**图 2.12\
