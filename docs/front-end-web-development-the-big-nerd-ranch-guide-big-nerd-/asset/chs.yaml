  \  };\n...\n```\n\n你的匿名函数期望接收一个包含从服务器检索的所有咖啡订单数据的对象。从该对象提取键并将其赋值给名为 `customerIdArray`\
  \ 的变量。\n\n```\n...\n  Truck.prototype.printOrders = function () {\n    return this.db.getAll()\n\
