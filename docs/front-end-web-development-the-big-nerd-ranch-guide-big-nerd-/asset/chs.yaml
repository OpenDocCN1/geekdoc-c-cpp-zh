  }\n\n\n\n\n\n\n\n\n\n@font-face {\n    src: url('fonts/Airstream-webfont.eot');\n\
  \         url('fonts/Airstream-webfont.woff') format('woff'),\n         url('fonts/Airstream-webfont.svg#airstreamregular')\
  \ format('svg');\n    font-style: normal;\n\n    font-family: 'lakeshore';\n}\n\
  ...\n.detail-image-title {\n  color: white;\n  font-size: 40px;\n```\n到目前为止，非常酷炫（图\
  \ 4.26）！\n**图 4.26 我想要更花丽的**\n![效果](img/so-slick.png)\n现在你已经完成了 `.detail-image-title`\
  \ 的样式设置，为它添加一个 `position: absolute` 声明，这样浏览器就会将其放置在 `.detail-image-frame` 内的精确位置。使用\
  \ `bottom: -16px` 和 `left: 4px` 指定该位置，使其恰好位于 `.detail-image-frame` 底部下方，并略微位于 `.detail-image-frame`\
  \ 左边缘内部。（对于坐标来说，负值是可以的）。\n```\n.detail-image-title {\n  bottom: -16px;\n\n  color:\
  \ white;\n  font-size: 40px;\n```\n\n\n在第 3 章中，你为 Ottergram 添加了 `normalize.css`。这确保了任何查看\
  \ Ottergram 的浏览器都拥有相同的默认样式。在这些默认样式的基础上，你可以放心地添加自己的 CSS，并且知道它在不同浏览器之间工作是一致的。\n你将对布局视口（layout\
  \ viewport）进行类似的操作。就像每个浏览器可能有不同的用户代理样式表一样，每个浏览器也可能有不同的默认布局视口。然而，与使用 `normalize.css`\
  \ 不同，你不会将所有浏览器的视口重置为相同的值。相反，你将使用 `<meta>` 标签告诉所有浏览器以设备物理屏幕的最佳尺寸显示 Ottergram。\n在\
  \ `index.html` 中，添加一个 `<meta>` 标签，告诉浏览器布局视口的 `width` 等于设备的屏幕宽度。确保通过将 `initial-scale`\
  \ 设置为 `1` 来将缩放比例设置为 100%。\n```\n<html\n    <meta charset=\"utf-8\">\n    <link rel=\"\
  stylesheet\"\n    <link rel=\"stylesheet\" href=\"stylesheets/styles.css\">\n  </head>\n\
  ```\n保存你的更改。这种技术将布局视口设置为理想视口。理想视口是浏览器制造商推荐的特定设备的最佳视口尺寸。这差异很大，因为有许多、许多不同的设备和相当多的不同浏览器。\n\
  表 5.1 总结了不同类型的视口。\n### 表 5.1 不同视口的总结\n| 视口 | 说明 | 设备 |\n| viewport (视口) | 等于浏览器窗口的区域。作为\
  \ `<html>` 元素的容器。 | 桌面电脑、笔记本 |\n| visual viewport (视觉视口) | 用户在设备屏幕上可见的可缩放区域。缩放对页面布局没有影响。\
  \ | 移动设备 |\n\n\n\n\n\n\n\n\n\n\n\n\n\n...\n  ...\n\n  /* 样式将写在这里 */\n```\n`@media`\
  \ 后面是媒体类型 `all`。媒体类型最初旨在区分设备，例如智能电视和手持设备。遗憾的是，浏览器并没有能够准确地实现这一点，所以你应该始终指定 `all`。唯一不需要使用\
  \ `all` 的情况是你想为打印指定样式，此时你可以安全地使用媒体类型 `print`。\n在媒体类型之后，编写应用样式的条件。在这里，你使用了用的条件 `min-width`。\n\
  为了实现图 5.1 所示的效果，你需要更改 `.main-content` 元素的 `flex-direction`。这将让缩略图和详情图并排。你不希望缩略图导致浏览器滚动。为了这一点，你必须添加\
  \ `overflow: hidden`。\n在 `styles.css` 的媒体查询中添加这些样式。\n```\n@media all and (min-width:\
  \ 768px) {\n  .main-content {\n    overflow: hidden;\n}\n\n\n\n\n\n...\n  .main-content\
  \ {\n    overflow: hidden;\n\n    flex-direction: column;\n}\n\n\n\n\n\n\n\n...\n\
  \  .main-content {\n    overflow: hidden;\n\n    flex-direction: column;\n  }\n\
  ```\n保存更改并确认缩略图显示在页面的左侧。\n你快要完成了！在 `styles.css` 中为 `.thumbnail-list` 和 `.thumbnail-item`\
  \ 再添加一些样式，让尺寸和间距看起来更好一些。\n```\n@media all and (min-width: 768px) {\n    flex-direction:\
  \ row;\n  }\n  .thumbnail-list {\n    order: 0;\n  }\n  .thumbnail-item {\n  }\n\
  \  .thumbnail-item + .thumbnail-item {\n  }\n```\n再次保存 `styles.css` 并切换到浏览器。现在，无论视口是窄还是宽，你的布局看起来都很精美（图\
  \ 5.7）。\n**图 5.7 响应式水獭**\n![响应式水獭](img/double-otter-responsive.png)\nOttergram 正在稳步进展！你创建了一个外观良好的网站，布局可以适应许多屏幕尺寸。在下一章中，你将开始使用\
  \ JavaScript 为 Ottergram 增加一层交互性。\n## 铜牌挑战：纵屏模式\n你目前的媒体查询根据视口的宽度来更改布局。你可以从不同的角度来看这个问题：一种针对高度大于宽度的视口，另一种针对宽度大于高的视口。这些是视口可以处于两种\
  \ `orientation`（方向）模式。\n查看 MDN 关于媒体查询的文档，并更新你的媒体查询，使布局根据方向而不是宽度发生变化。\n## 进阶探索：Flexbox\
  \ 布局的常见解决方案（及 Bug）\nPhilip Walton 是一位维护两个非常重要的 flexbox 资源的开发者。第一个是 Solved by Flexbox\
  \ 网站（[philipwalton.github.io/solved-by-flexbox](https://philipwalton.github.io/solved-by-flexbox/)），它提供了使用\
  \ flexbox 实现常见布局的演示以及你亲自创建它们所需的所有信息。某些布局如果不使用 flexbox 是很难实现的。\n第二个资源是 [github.com/philipwalton/flexbugs](https://github.com/philipwalton/flexbugs)\
  \ 上的 Flexbugs 。Flexbox 非常棒，但它并不完美。Flexbugs 为开发者在使用 flexbox 时遇到的常见问题提供了解决方案和替代方案。这些信息由遇到过这些\
  \ bug 的开发社区成员提供，且列表维护良好。\n## 金牌挑战：圣杯型布局\n在尝试此挑战之前，务必为你的代码创建一个副本！这将需要对标记语言和样式进行重大更改。使用你的副本进行挑战，并保持原始文件完好以便开始下一章。\n\
  以 Solved by Flexbox 为参考，在 Ottergram 中实现圣杯型布局。创建一个第二个带有缩略图的导航栏，但将其放置在视口的另一侧。\n确保在页面底部添加一个\
  \ `footer` 元素。使用 `<footer>` 标签并在内部放入一个 `<h1>`。\n# 6 使用 JavaScript 处理事件\n你知道水獭酷在哪里吗？除了其他点外，它们在睡觉时会手手，这样它们就不会漂走了。在学习处理\
  \ JavaScript 中的事件回调（event callbacks）时，请记住这个形象。\nJavaScript 是一种编程语言，通过操纵页面上的 DOM\
  \ 元素和 CSS 样式为网站添加交互性。它最初是为非专业程序员设计的。如今，它的功能和人气不断增长，现在被用于各种应用程序开发。当你使用 Gmail 或 Netflix\
  \ 这样的网站时，你正在与用 JavaScript 编写的程序交互。事实上，`Atom` 编辑器实际上是一个用 JavaScript 编写的桌面应用程序。\n\
  尽管它功能强大且被广泛使用，但它像任何编程语言一样，也有自己的怪癖。当你继续开发 Ottergram 和书中的其他项目时，你将学会如何应对语言的棘手之处，并利用它最优秀的部分。\n\
  JavaScript 有多个版本，你将在书中的项目中使用其中三个。它们都是一个称为 ECMAScript（或 ES）的标准规范的修订版。表 6.1 总结了它们。\n\
  **表 6.1 书中使用的 JavaScript 版本**\n| ECMAScript 版本 | 发布日期 | 备注 |\n| 3 | 1999 年 12 月\
  \ | 支持最广泛的版本；涵盖了你将使用的大部分语言特征，如变量、类型和函数。 |\n| 6 | 2015 年 6 月 | 包含新的语法和语言特征；在本书编写时，大多数浏览器不支持\
  \ ES6，但 ES6 代码可以翻译为 ES5，使其被大多数浏览器使用。 |\n在本章中，你将使用 JavaScript 让 Ottergram 具有交互性：当用户点击其中一个缩略图时，详细图像和标题将发生变化。\n\
  为了实现这一点，你将编写一个 JavaScript `function`（函数）——一组供浏览器遵循的步骤——用于读取图片的 URL 并将其显示在详细区域。然后，你将确保在点击缩略图时运行该函数。你还将编写一个单独函数来隐藏详细区域，并在按下\
  \ Escape 键时运行它。\n在章节末尾，Ottergram 将能够在详细图像中展示任何水獭（图 6.1\n在你编写这些函数时，你将使用浏览器内置的一组预定义接口与页面交互。这些接口非常多，代码只会引导你使用完成任务所需的接口。如果你感兴趣，可以在\
  \ MDN 上的 [developer.mozilla.org/en-US/docs/Web/API/Element](https://developer.mozilla.org/en-US/docs/Web/API/Element)\
  \ 找到更深入的信息。\n## 为锚点标签做好准备工作\n在使用 JavaScript 添加交互功能之前，你需要对标记语言进行一些更新。你的缩略图被封装在锚点标签中，但这些标签并没有真正链接到任何资源。相反，它们在\
  \ `href` 属性中使用 `#` 值，这告诉浏览器留在当前页面。为了让点击缩略图产生任何有趣的操作，你需要修复这个问题。\n首先，在 `index.html`\
  \ 中，删除除五个以外的所有 `.thumbnail-item` 元素。你不再需要那些重复项了，因为你的布局已经很完美了。\n\n\n\n\n\n\n\n\n\n\
