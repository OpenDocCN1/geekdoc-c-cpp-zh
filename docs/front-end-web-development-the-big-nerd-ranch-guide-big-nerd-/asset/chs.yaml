  \n### 使用 bind 设置 this 的值\n\n在 JavaScript 中，当你调用一个函数时，函数内部的关键字 `this` 会分配一个值。对于构造函数和原型方法，`this`\
  \ 的值是实例对象。该实例被称为函数调用的 <samp class=\"firstterm\">所有者</samp>。使用 `this` 关键字可以让你访问所有者的属性。\n\
  \n正如我们之前所说，对于回调函数，`this` 不会自动分配给某个对象。你可以通过使用函数的 `bind` 方法手动指定哪个对象应该成为所有者。（记住，JavaScript\
  \ 函数实际上是对象，并且可以拥有自己的属性和方法，例如 `bind`。）\n\n`bind` 方法接受一个对象参数并返回该函数的一个新版本。当你调用这个新版本时，它将使用传递给\
  \ `bind` 的对象参数作为函数体内部 `this` 的值。\n\n在 `forEach` 回调函数内部，`this` 是 `undefined`，因为回调函数没有所有者。通过调用\
  \ `bind` 并传递对 `Truck` 实例的引用来修复这个问题。\n\n在 `truck.js` 中添加 `bind` 的调用。\n\n```\n...\n\
  \  Truck.prototype.printOrders = function () {\n    var customerIdArray = Object.keys(this.db.getAll());\n\
  \n    console.log('Truck #' + this.truckId + ' has pending orders:');\n    customerIdArray.forEach(function\
  \ (id) {\n      console.log(this.db.get(id));\n    }.bind(this));\n  };\n...\n```\n\
  \n在 `forEach` 回调体外部，关键字 `this` 指向 `Truck` 实例。通过在匿名函数之后添加 `.bind(this)` ——但在 `forEach`\
  \ 调用的括号内部——你向 `forEach` 传递了一个匿名函数的修改版本。这个修改后的版本使用 `Truck` 实例作为它的所有者。\n\n保存并确认订单已正确打印。你需要重新声明\
  \ `myTruck` 并再次运行 `createOrder`。\n\n你的输出应该像图 8.29 后 printOrders 正常工作\")。\n\n**图\
  \ 8.29 使用 bind(this) 后 printOrders 正常工作**\n\n![使用 bind(this) 后 printOrders 正常工作](img/printorders-debugging-3.png)\n\
  \n### 在页面加载时初始化 CoffeeRun\n\n你的 `DataStore` 和 `Truck` 模块工作正常。你已经能够在控制台中实例化一个新的 `Truck`，并在创建时为其提供了一个新的\
  \ `DataStore`。\n\n现在你将创建一个在页面加载时执行相同步骤的模块。创建一个 `scripts/main.js` 文件并在 `index.html`\
  \ 中添加一个 `<script>` 标签。\n\n```\n<!doctype html>\n<html\n  <head>\n    <meta charset=\"\
  utf-8\">\n    <title>coffeerun</title>\n  </head>\n  <body>\n    <script src=\"\
  scripts/datastore.js\" charset=\"utf-8\"></script>>\n    <script src=\"scripts/truck.js\"\
  \ charset=\"utf-8\"></script>>\n    <script src=\"scripts/main.js\" charset=\"utf-8\"\
  ></script>>\n  </body>\n</html>\n```\n\n保存 `index.html`。你将向 `main.js` 添加一个 IIFE（立即调用函数表达式），就像你之前对其他模块做的那样，但这次你不需要向\
  \ `window` 导出任何新属性。\n\n```\n(function () {\n  var App = window;\n  var Truck = App.Truck;\n\
  \  var DataStore = App.DataStore;\n})();\n```\n\n这个模块的作用是保护 `window` 命名空间。从技术上，你可以使用全名（例如\
  \ `App.Truck`），但当你使用较短的名称时，代码更具可读性。\n\n### 创建 Truck 实例\n\n现在，就像你在控制台中做的那样，你将创建一个\
  \ `Truck` 实例，并传递 `id` 和一个新的 `DataStore` 实例。在 `main.js` 中调用 `Truck` 构造函数，为其提供 `ncc-701`\
  \ 和 `DataStore`。\n\n```\n  var App = window;\n  var Truck = App.Truck;\n  var DataStore\
  \ = App.DataStore;\n  var myTruck = new Truck('ncc-701', DataStore());\n```\n\n\
  这与你之前的代码几乎相同，但你不需要用 `App` 来前缀 `Truck` 或 `DataStore`。\n\n此时，你的应用程序代码已几乎完成。然而，你仍然无法与\
  \ `Truck` 实例交互。为什么呢？变量声明在函数（即 `main` 模块）内部。函数保护其变量不被外部代码访问，包括你在控制台上编写的代码。\n\n为了让你能够与\
  \ `Truck` 实例交互，将其导出到 `main.js` 的全局命名空间中。\n\n```\n(function () {\n  var App = window;\n\
  \  var Truck = App.Truck;\n  var DataStore = App.DataStore;\n  var myTruck = new\
  \ Truck('ncc-701', DataStore());\n  window.myTruck = myTruck;\n})();\n```\n\n保存你的工作并返回控制台。手动刷新页面以确保你在控制台中之前的任何工作已清除。\n\
  \n开始输入 `myTruck`，你会看到控制台尝试自动补全它（图 8.30）。这意味着它找到了作为 `window` 对象属性导出的 `myTruck` 变量。\n\
  \n多次调用 `myTruck.createOrder` 提供一些测试数据。你可以通过让控制台自动补全之前的 `createOrder` 调用来轻松地实现这一点（图\
  \ 8.31）。\n\n\n\n\n\n## 图 8.31 控制台自动补全 `createOrder` 之前的调用\n\n![控制台自动补全 `createOrder`\
  \ 之前的调用](img/previous-createorder.png)\n\n或者，输入以下代码以确认一切都按预期工作。\n\n```\nmyTruck.createOrder({\
  \ emailAddress: 'me@goldfinger.com', coffee: 'double mocha'});\nmyTruck.createOrder({\
  \ emailAddress: 'dr@no.com', coffee: 'decaf'});\nmyTruck.createOrder({ emailAddress:\
  \ 'm@bond.com', coffee: 'earl grey'});\nmyTruck.printOrders();\nmyTruck.deliverOrder('dr@no.com');\n\
  myTruck.deliverOrder('m@bond.com');\nmyTruck.printOrders();\n```\n\n练习完 `createOrder`、`printOrders()`\
  \ 和 `deliverOrder()` 方法后，你应该看到类似图 8.32 的内容。\n\n## 图 8.32 一辆忙碌的咖啡车\n\n![一辆忙碌的咖啡车](img/excelsior.png)\n\
  \n恭喜！你已经完成了 CoffeeRun 的基础工作。它还没有 UI，但你将在后续章节中添加它。你不需要对核心代码进行更改，因为 UI 将简单地调用你已经编写并测试过的\
  \ `Truck.prototype` 方法。\n\n这就是模块化方法的优势：你可以分层构建你的应用程序，并且知道每个新层都是构建在底层模块的正常代码之上的。\n\
  \n## 青铜挑战：非星际迷者的 Truck ID\n\n在 `main.js` 中，为 `truckId` 传入不同的字符串。\n\n（一些不错的选项包括“Serenity”、“KITT”或“Galactica”。“HAL”可能是一个坏主意。）\n\
  \n## 给更具好奇心的人：私有模块数据\n\n在模块内部，你的构造函数和原型方法可以访问在 IIFE 内部声明的任何变量。作为向 `prototype` 添加属性的替代方案，这可以在实例之间共享数据，但使其对模块外部的任何代码隐藏。它看起来如下：\n\
  \n```\n(function (window) {\n  'use strict';\n  var App = window.App || {};\n  var\
  \ launchCount = 0;\n\n  function Spaceship() {\n    // 初始化代码在这里\n  }\n\n  Spaceship.prototype.blastoff\
  \ = function () {\n    // 闭包作用域允许访问 launchCount 变量\n    launchCount++;\n    console.log('Spaceship\
  \ launched!')\n  }\n\n  Spaceship.prototype.reportLaunchCount = function () {\n\
  \    console.log('Total number of launches: ' + launchCount);\n  }\n\n  App.Spaceship\
  \ = Spaceship\n  window.App = App;\n})(window);\n```\n\n其他语言提供了声明变量为 `private`的方法，但\
  \ JavaScript 没有。你可以利用闭包作用域（使用外部层作用域声明变量的函数）来模拟私有变量。\n\n## 银牌挑战：使数据私有\n\n更新你的 `DataStore`\
  \ 模块，使 `data` 属性对模块私有。\n\n有任何理由不想这样做吗？如果你声明了多个 `DataStore` 实例会发生什么？\n\n## 给更具好奇心的人：在\
  \ forEach 的回调中设置 this\n\n我们之前撒了一个小谎。使用 `bind` 并不是为 `forEach` 的回调设置 `this` 值的唯一方法。\n\
  \n查看 MDN 上 `Array.prototype.forEach` 的文档（[developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach](https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Array/forEach)）。你可以看到\
  \ `forEach` 接受一个可选的第二个参数，它将作为回调中 `this` 的值。\n\n这意味着你也可以这样写 `printOrders` 方法：\n\n\
  ```\n...\nTruck.prototype.printOrders = function () {\n  var customerIdArray = Object.keys(this.db.getAll());\n\
  \n  console.log('Truck #' + this.truckId + ' has pending orders:');\n  customerIdArray.forEach(function\
  \ (id) {\n    console.log(this.db.get(id));\n  }, this);\n};\n...\n```\n\n然而，`bind`\
  \ 是非常有用的方法，你将在后续章节中再次看到它。`Truck.prototype.printOrders` 提供了一个向你介绍语法的好机会。\n\n# 第 9\
