  \nGravatar 是使用电子邮件地址分配的。如果你没有关联的电子邮件地址，请尝试使用 `diana.prince@bignerdranch.com` 或 `clark.kent@bignerdranch.com`。\n\
  \n## 用户会话存储\n\n每次重新加载页面都输入用户名很无聊。最好是将该用户名存储在浏览器中。对于简单的存储，浏览器提供了两个 API 来存储键/值对（但有一个限制——值必须是字符串）。它们是\
  \ `localStorage` 和 `sessionStorage`。存储在 `localStorage` 和 `sessionStorage` 中的数据与你的\
  \ Web 应用服务器地址相关。不同网站的代码无法访问彼此的数据。\n\n使用 `localStorage` 是可行的。但你可能只想在关闭标签页或窗口之前保留用户名，在这种情况下你将使用\
  \ `sessionStorage` API。它与 `localStorage` 相似，但数据会在浏览会话结束（通过关闭浏览器标签页或窗口）时删除。\n\n你将创建一个新的类来管理你的\
  \ `sessionStorage` 信息。\n\n在 `app/scripts/src` 文件夹中创建一个名为 `storage.js` 的新文件并添加类定义：\n\
  \n```\nclass Store {\n  constructor(storageApi) {\n    this.api = storageApi;\n\
  \  }\n  get() {\n    return this.api.getItem(this.key);\n  }\n\n  set(value) {\n\
  \    this.api.setItem(this.key, value);\n  }\n}\n```\n\n你新的 `Store` 类是通用的，可以与 `localStorage`\
  \ 或 `sessionStorage` 使用。它是对 Web Storage API 的薄层封装。你在实例化时可以指定想要使用的存储 API。\n\n注意，这里有对\
  \ `this.key` 的引用，但它在构造函数中**没有**被设置。这个 `Store` 的实现并不打算单独使用。相反，你通过构建一个定义了 `key` 属性的子类来使用它。\n\
  \n使用 `extends` 关键字创建一个子类，用于在 `sessionStorage` 中存储用户名：\n\n```\nclass Store {\n  constructor(storageApi)\
  \ {\n    this.api = storageApi;\n  }\n  get() {\n    return this.api.getItem(this.key);\n\
  \  }\n\n  set(value) {\n    this.api.setItem(this.key, value);\n  }\n}\n\nexport\
  \ class UserStore extends Store {\n  constructor(key) {\n    super(sessionStorage);\n\
  \    this.key = key;\n  }\n}\n```\n\n`UserStore` 只定义了一个构造函数，执行两个操作。首先，它调用 `super`，调用\
  \ `Store` 的构造函数并传递对 `sessionStorage` 的引用。其次，它设置了 `this.key` 的值。\n\n现在，`Store` 的\
  \ `api` 值已设置，`UserStore` 实例的 `key` 值也已设置。这意味着 `UserStore` 实例调用 `get` 和 `set` 方法的所有工作已就绪。\n\
  \n`UserStore` 将是 `app.js` 使用的，所以我们在这里导出它。\n\n现在使用你新的 `UserStore`。在 `app.js` 中导入\
  \ `UserStore`，创建一个实例，并使用它来隐藏用户名：\n\n```\nimport socket from './ws-client';\nimport\
  \ {UserStore} from './storage';\nimport {ChatForm, ChatList, promptForUsername}\
  \ from './dom';\n\nconst FORM_SELECTOR = '[data-chat=\"chat-form\"]';\nconst INPUT_SELECTOR\
  \ = '[data-chat=\"input\"]';\nconst LIST_SELECTOR = '[data-chat=\"list\"]';\n\n\
  let username = '';\nlet userStore = new UserStore('username');\nif (!username) {\n\
  \  username = promptForUsername();\n  userStore.set(username);\n}\n\n\n\nclass ChatApp\
  \ {\n  ...\n```\n\n\n\n\n```javascript...\n  drawMessage({user: u, timestamp: t,\
  \ message: m}) {\n    ...\n    $message.append($('<span>', {\n      'class': 'timestamp',\n\
  \      'data-time': t,\n      text: (new Date(t)).getTime()\n      text: moment(t).fromNow()\n\
  \    }));\n    ...\n```\n\n最后，更新 `app.js`，在 `socket.registerOpenHandler` 回调函数添加对\
  \ `this.chatList.init` 的调用：\n\n```\n...\nclass ChatApp {\n  constructor () {\n \
  \   this.chatForm = new ChatForm(FORM_SELECTOR, INPUT_SELECTOR);\n    this.chatList\
  \ = new ChatList(LIST_SELECTOR, username);\n\n    socket.init('ws://localhost:3001');\n\
  \    socket.registerOpenHandler(() => {\n      this.chatForm.init((text) => {\n\
  \        let message = new ChatMessage({message: text});\n        socket.sendMessage(message.serialize());\n\
  \      });\n      this.chatList.init();\n    });\n    ...\n```\n\n保存并让你的 `npm` 脚本编译你的更改。刷新浏览器并开始聊天。你应该看到新的时间戳随你的消息文本一起出现。几分钟后，你会发现消息时间戳更新了（图\
  \ 18.8）。\n\n**图 18.8 不那么秘密的身份**\n\n![不那么秘密的身份](img/finished-chattrbox.png)\n\n你已经了\
  \ Chattrbox 路线的终点。尽管它只跨越了几个章节，但包含了许多复杂的组件。你学习了如何在 `Node.js` 中编写两种类型的服务器：基础 Web 服务器和\
  \ WebSocket 服务器。你使用 ES6 构建了客户端应用程序，利用 `Babel` 和 `Browserify` 将代码编译为 ES5，以便 Chattrbox\
  \ 可以在旧版浏览器中运行，并且通过 `npm` 脚本自动化了你的工作流。\n\nChattrbox 是你迄今所学技术的结晶。下一个应用程序 Tracker 将向你介绍\
  \ `Ember.js`，这是一个用于构建大型应用的框架。它将基于你辛苦获得的模块化、异步编程和工作流工具方面的知识构建。\n\n## 铜级挑战：为消息添加视觉效果\n\
  \n给新消息添加视觉效果。你可以让它们淡入，或者让它们滑入。（查阅 jQuery 的 `Effects` 文档获取更多选项。）\n\n为了增加挑战性，仅将此效果应用于真正的新消息——而不是在用户首次登录或刷新浏览器时由应用加载的聊天中的现有消息。\n\
  \n你如何判断哪些消息是旧的，哪些是新的呢？每条消息都有一个数据属性，可以帮助你判断它是否已经存在了一两秒钟。\n\n## 银级挑战：缓存消息\n\n如果你在聊天过程中需要刷新浏览器，你所有的消息都会消失。你的\
  \ `UserStore` 还能记得你的用户名，这很棒——但如果你也有类似的机制来缓存聊天消息，那就更好了。\n\n创建一个子自 `Store` 的 `MessageStore`。它应该在消息进入时存储它们，确保不重复存储同一条消息。\n\
  \n当页面加载时，Chattrbox 应该从 `MessageStore` 获取任何缓存消息。决定你是否希望消息在浏览器标签页关闭并重新打开后仍然存在。（如果是这样，你会使用什么作为\
  \ `sessionStorage` 的替代方案？）\n\n## 黄金级挑战：独立聊天室\n\n这个挑战将要求你同时修改服务器和客户端应用程序。\n\n为你的用户添加独立的聊天室。在他们输入用户名后，提示他们输入想要使用的聊天室名称。\n\
  \n当用户登录某个聊天室时，他们应该只通过 WebSocket 连接接收该房间的消息。你可能需要更改在服务器上存储消息的方式、向客户端发送消息的方式，或者两者兼有。\n\
  \n为了增加挑战性，在客户端 UI 中显示可用聊天室的下拉列表，以便用户可以在房间之间切换。当切换到另一个房间时，确保从服务器接收到任何新消息并将其显示在聊天列表中。\n\
  \n# 第四部分\n\n## 应用架构\n\n# 19\n\n## MVC 和 Ember 简介\n\n模型-视图-控制器（MVC）是一种极其有用的软件设计模式。它在\
  \ Web 应用程序中运行良好，允许你在不同的分层中构建结构。本章介绍了 MVC 模式，并引导你完成安装 `Ember`——一个用于 MVC 的框架。\n\n\
  对 MVC 有许多解释，特别是在前端。图 19.1 显示了我们将要使用的解释。\n\n以下是每一层功能的拆解：\n\n*   `Models`（模型）管理数据。当数据变化时，模型通知所有监听者。\n\
  *   `Views`（视图）管理用户界面。它们处理模型的呈现并监听任何变化。此外，当 UI 事件响应用户输入而触发时，它们会调用控制器中的处理函数。\n* \
  \  `Controllers`（控制器）持有应用逻辑。它们获取模型实例并将其交给视图。它们还会对模型实例进行更改。\n\n如果这看起来像是循环的，那它确实如此。这三个部分协同工作。应用程序数据从模型流向视图。控制器触发模型的更改。在第\
  \ 8 章 中，你创建了 CoffeeRun 应用程序并将所有功能封装在 `Window.App` 对象中。每个添加的模块都有特定的角色，并以功能命名。MVC\
  \ 模式需要一个初始化函数（例如创建一个新的 `Truck`）来加载控制器。控制器随后加载模型和视图。\n\n你的下一个应用程序 Tracker 将在一个 HTML\
  \ 文件中加载初始 DOM 状态，只有一个空的 `<body>` 标签。初始化应用程序的脚本也将从此 HTML 文件加载。在 MVC 模式中，视图（HTML 内容）根据路由和数据（模型）的状态动态渲染。\n\
  \n你将构建的应用程序需要的比 CoffeeRun 的七模块多。MVC 模式有助于你拆分功能文件并保持一致的组织。\n\n## Tracker\n\n你的 Tracker\
  \ 应用程序将包含 `URL `，这是 Web 应用程序最好的功能之一。它将拥有定义数据、处理用户操作、定义 UI 以及将模型分配给模板的组件。在构建应用程序的过程中，你将学会一些新的模式和技术，使你的代码变得轻量且优雅。\n\
  \nTracker 应用的客户是一位神秘生物学家，环游世界寻找大脚、食犬兽、尼湖怪物和独角兽等动物。这位客户想要一个应用来追踪这些神秘生物并记录任何发现的信息。需求可能会改变（通常都是如此），但从开始，用户应该能够：\n\
  \n*   列出现有的发现\n\n*   添加新发现\n\n*   将生物与发现关联\n\n\n\n\n\n-   通过闪消息（flash messages）查看最新的发现记录\n\
  \n每个发现记录都应包含以下模型数据和关联：\n\n| 发现模型属性 | 属性类型 |\n| --- | --- |\n| 发现生物的日期 | 日期对象 |\n\
  | 位置 | string |\n| 生物 | 生物模型键 |\n| 目击者(s) | 目击者键数组 |\n\n每个生物都应包含以下模型数据：\n\n| 生物模型属性\
  \ | 属性类型 |\n| --- | --- |\n| 名称 | string |\n| 类型 | string |\n| 图片路径 | string |\n\
  \n并且，每个目击者都应包含以下模型数据和关联：\n\n| 目击者模型属性 | 属性类型 |\n| --- | --- |\n| 名 | string |\n\
  | 姓 | string |\n| 全名 | string：名和姓的拼接 |\n| 电子邮件 | string |\n| 发现记录(s) | 发现记录键数组 |\n\
  \n构建 Tracker 与构建书中之前的应用程序略有不同。它将更接近真实世界的应用开发。各个章节中的代码会更多，即时反馈会更少。然而，你将获得应用开发的真实感，并构建出一个令人满意的复杂应用（图\
  \ 19.2）。\n\n**图 19.2 完成的 Tracker 应用**\n\n![完成的 Tracker 应用](img/final-app-img.png)\n\
  \n## Ember: 一个 MVC 框架\n\n在构建 Tracker 时，你将学习使用 `Ember` 进行 Web 应用开发的基本模式，它是领先的 MVC\
  \ 框架之一。`Ember` 结合了允许快速开发的概念和命名规范。在构建你的应用程序的过程中，你将学习 `Ember` 的基础知识。\n\n正如 `Ember`\
  \ 首页（[emberjs.com](http://emberjs.com)）所示，`Ember` 是“一个用于构建宏大 Web 应用的框架”。与 jQuery\
  \ 这样的库不同，像 `Ember` 这样的框架告知应用的结构，并通常包含脚手架工具（scaffolding tools），即用于在正确的目录下创建样板文件的脚本。自\
  \ 2011 年成立以来，`Ember` 社区一直在构建一个多样化的库和工具生态系统以加速开发。\n\n你将从 `Ember CLI` 开始你的 `Ember`\
  \ 之旅，它是 `Ember` 用于脚手架、开发、测试和构建的工具。如果你熟悉 `CLI` 术语，它代表“命令行界面”。你将通过此工具创建新项目、加载依赖项、生成\
  \ `Ember` 对象，并构建和运行你的 Tracker 应用程序。\n\n 安装 Ember\n\n要开始之前，你需要安装一些工具。\n\n首先，确保你使用的是最新版本的\
  \ `Node.js`（>0.12.0）。你可以通过终端命令 `node --version` 检查版本。在本文写作时，`Node` 的版本是 5.5.0。（是的，这与\
  \ 0.12.0 的最低要求相比差异巨大。更多关于 `Node` 何时为何从版本 0.12.0 跳跃到 4.0.0 的历史，请查看维基百科上的 [`en.wikipedia.org/wiki/Node.js`](https://en.wikipedia.org/wiki/Node.js)\
  \ 文章。）\n\n如有必要，请从 [nodejs.org](https://nodejs.org) 下载更新版本的 `Node.js`。\n\n一旦 `Node`\
  \ 更新到位，你就可以使用以下终端命令安装 `Ember CLI` 了：\n\n```\nnpm install -g ember-cli@2.4\n```\n\
  \n安装可能需要几分钟。如果你遇到此错误：`Please try running this command again as root/Administrator`，说明所有权限存在问题。**不要**使用\
  \ `sudo` 重新运行安装命令，因为 `npm` 和 `sudo` 并不兼容。相反，运行此命令：`sudo chown -R $USER /usr/local`。然后重新运行原始安装命令（不带\
  \ sudo）。\n\n安装 `Ember CLI` 时，你可能会遇到其他与现有系统不兼容相关的错误。大多数错误都有修复安装过程的说明。某些安装错误需要通过基础搜索来更新计算机上运行的现有程序。如果你需要更多信息，`Ember\
  \ CLI` 网站在 [`ember-cli.com/user-guide/#commonissues`](http://ember-cli.com/user-guide/#commonissues)\
  \ 有一个常见问题页面。\n\n接下来，安装 `Bower`，另一个资源管理工具。\n\n```\nnpm install -g bower\n```\n\n\
  创建 `Ember` 应用程序需要 `Bower` 和 `npm`。\n\n接下来，为 `Chrome` 安装 `Ember Inspector` 插件。要为此，打开\
  \ `Chrome` 并在地址栏输入 `chrome://extensions/`。在扩展页面底部，点击“获取更多扩展”。搜索“Ember Inspector”（图\
  \ 19.3），点击“添加 Chrome”，并按照提示安装扩展。\n\n**图 19.3 在 Chrome 中安装 Ember Inspector**\n\n\
  ![在 Chrome 中安装 Ember Inspector](img/extension-ember.png)\n\n`Ember CLI` 在运行时会使用一个名为\
  \ `Watchman` 的程序。`Watchman` 是一个与浏览器集成的命令行工具，用于应用程序的热加载。\n\n在 Mac 上，你可以通过 `Homebrew`\
  \ 安装 `Watchman`。`Homebrew` 是 OS X 的包管理器，可以通过其网站 [`brew.sh](http://brew.sh/) 复制终端命令进行下载。一旦安装了\
  \ `Homebrew`，使用此终端命令安装 `Watchman`（3.0.0 或更高版本）：\n\n```\nbrew install watchman\n\
  ```\n\n在 Windows 上安装 `Watchman` 的说明可以在 [`facebook.github.io/watchman/docs/install.html`](https://facebook.github.io/watchman/docs/install.html)\
  \ 找到。\n\n现在你已经有了开始 `Ember` 项目 Tracker 所需的工具。\n\n### 创建 Ember 应用\n\n`Ember` 对约定和模式的强调允许你使用少量代码创建应用程序。框架在后台执行了大量工作，在应用程序启动时生成许多对象和事件。当你构建更多\
  \ Tracker 应用程序时，你将使用自己的对象来替换 `Ember` 为你创建的对象。\n\n在终端中，导航到你的项目文件夹。`ember new [project\
  \ name]` 命令将创建一个目录并脚手架开发所需的所有文件。\n\n创建一个名为 `tracker` 的新 `Ember` 应用：\n\n```\nember\
  \ new tracker\n```\n\n\n\n\n创建一个新的 `Ember` 应用可能需要几分钟时间。正如你在终端输出所示（下方显示了部分），`ember\
  \ new` 命令会创建基础项目文件和目录结构。此外，它还会使用 `npm` 和 `Bower` 来加载外部库资源。这些库对于运行 `Ember` 应用至关重要，同时也对于运行服务器以编译、构建和测试你的应用程序也同样重要。\n\
  \n```\ninstalling app\n  create .bowerrc\n  create .editorconfig\n  create .ember-cli\n\
  \  create .jshintrc\n  create .travis.yml\n  create .watchmanconfig\n  create README.md\n\
  \  create app/app.js\n  create app/components/.gitkeep\n  create app/controllers/.gitkeep\n\
  \  create app/helpers/.gitkeep\n  create app/index.html\n  create app/models/.gitkeep\n\
  \  create app/router.js\n  create app/routes/.gitkeep\n  create app/styles/app.css\n\
  \  create app/templates/application.hbs\n  . . .\nSuccessfully initialized git.\n\
  Installed packages for tooling via npm.\nInstalled browser packages via Bower.\n\
  ```\n\n当 `Ember` 完成 Tracker 应用的设置后，通过启动本地服务器来验证一切是否运行正常。\n\n### 启动服务器\n\n稍后，你将使用命令\
  \ `ember server`（或者对于想省几次击键的人，可以使用 `ember s`）来构建你的应用并启动服务器，以便可以在本地访问它。为了方便起见，`ember\
  \ server` 会监控你的文件更改并重启构建/服务/监听过程，以确保你只在浏览器中看到最新的代码（非常类似于你在 Ottergram 和 CoffeeRun\
  \ 中使用的 `browser-sync` 工具）。\n\n`Ember CLI` 使用 `Broccoli` 程序进行编译。如果你用过 Java 或 Objective-C\
  \ 等语言编程，你对“编译”的理解可能与 JavaScript 中的含义有所不同。在这种情况下，`Broccoli` 会合并运行你的应用程序所需的所有 JavaScript\
  \ 文件，同时确保所有依赖项都已满足。\n\n是时候为用户而战了。进入 Tracker 文件夹并启动服务器：\n\n```\ncd tracker\nember\
  \ server\n```\n\n在 `Chrome` 中，打开新浏览器窗口并访问 `http://localhost:4200` 来查看你新 `Ember`\
  \ 应用的运行情况（图 19.4）。你可能还想如图所示在开发者工具中打开 `Ember` 标签页。\n\n**图 19.4: Ember server**\n\n\
  ![Ember server](img/ember-setup_new.png)\n\n如上所述，当你更改应用文件时，`Ember CLI` 会重新加载浏览器页面。这被称为\
  \ `Livereload`，你将在终端输出中看到它：\n\n```\nLivereload server on http://localhost:49152\n\
  ```\n\n在图 19.4 中，注意到控制台和 `Ember Inspector` 都列出了为你生成的各种组件以及它们的版本。本书使用的 `Ember` 和\
  \ `Ember Data` 均为 2.4 版本。在出版时，`Ember CLI` 生成的是 2.x 版本的 `Ember` 应用，如图中版本号所示。如果你看到的版本号以\
  \ 1.x.x 开头，你可能跳过了安装或更新 `Ember-CLI` 的步骤。\n\n（注意，你在终端启动服务器后看到的 `Version` 是 `Ember\
  \ CLI` 的版本，而不是你启动的实际 `Ember` 应用的版本。）\n\n## 外部库与插件\n\n`Ember CLI` 的设置旨在许多方面为开发者提供速度，包括添加来自开源社区的代码。在之前的章节中，你通过\
  \ `npm` 向本地环境添加了 `node` 模块。在本章较早之前，我们讨论了如何通过另一个包管理器 `Bower` 加载外部库。\n\n`Ember CLI`\
  \ 与这两个包管理器都能良好地工作。安装库或工具可以使用简单的命令完成：\n\n```\nnpm install [package name] --save-dev\n\
  npm install [package name] --save\nbower install [package name] --save\n```\n\n\
  当使用外部库时，这些命令行工具会将文件加载到 `bower_components` 和 `node_modules` 目录。\n\n你在 CoffeeRun 中使用了\
  \ `Bootstrap`，现在启动 Tracker 时也会使用它。要通过 `Bower` 添加 `Bootstrap`，请输入以下命令：\n\n```bash\n\
  bower install bootstrap --save\n```\n\n你现在已经在本地加载了 `Bootstrap` 及其样式。你刚刚添加了编译 SCSS\
  \ 文件的能力。\n\n现代工作流。SCSS（通常被称为“Sass”）为你的样式表添加了许多熟悉的结构，如变量、函数和循环。\n\n从终端安装 `ember-cli-sass`：\n\
  \n```bash\nember install ember-cli-sass\n```\n\n`ember-cli-sass` 是 `Ember` 插件（addon）的一个示例。插件（[www.emberaddons.com](https://www.emberaddons.com)）是添加了外部库或配置代码、创建了助手或组件，或为你完成了某些类型繁重工作的项目。`Ember\
  \ CLI` 允许你通过 `ember install` 命令轻松地将这些现有项目添加到你的项目中。\n\n注意，`Ember CLI` 是一个相对新的工具，插件可能会不同。如果你在某个插件上遇到问题，请访问该插件\
  \ GitHub 仓库的 issues 页面。\n\n你刚刚添加了编译 SCSS 文件的能力。现在你需要将 `app/styles/app.css` 改为 `.scss`\
  \ 文件。将 `app/styles/app.css` 重命名为 `app/styles/app.scss`。完成后重启 `Ember` 服务器以便新的 CLI\
  \ 工具初始化。\n\n为了测试新的 CLI 工具，你将在你的样式表中添加一个 SCSS 变量。以 `$` 为前缀，创建一个键值对来测试 `app/styles/app.scss`\
  \ 中的 SCSS 编译：\n\n```\n$bg-color: coral;\nhtml {\n  background: $bg-color;\n}\n```\n\
  \n检查你的浏览器。你的页面现在显示了背景颜色（图 19.5）。\n\n**图 19.5: Compiling SCSS: test**\n\n![Compiling\
  \ SCSS: test](img/ember-setup_sass.png)\n\n\n\n\n接下来，你将为项目添加 `Bootstrap` 样式和脚本。之前你已经通过\
  \ `bower install bootstrap-sass` 添加了 `Bootstrap` 的 SCSS 版本。要将该库添加到你的样式表中，你需要将样式库导入到你的文件中，并配置\
  \ `Ember CLI` 使用这些资源来构建你的应用程序。\n\n## 配置\n\n我们之前提到的编译引擎 `Broccoli` 在添加新的 JavaScript\
  \ 和样式表资源时，需要进行一些配置。\n\n`Ember-CLI` 会生成一个名为 `ember-cli-build.js` 的配置文件。你可以在此文件中注入依赖并配置应用程序的输出结构。对于\
  \ Tracker 来说，你只需要添加外部库和 SCSS 编译的设置。\n\n打开 `ember-cli-build.js`，为目录路径 `bootstrap`\
  \ 分配一个变量，并将 `Bootstrap` 的 `stylesheets` 目录添加到 `sassOptions` 中的 `includePaths` 键中：\n\
  \n```\n...\nvar EmberApp = require('ember-cli/lib/broccoli/ember-app');\n\nmodule.exports\
  \ = function(defaults) {\n\n  var bootstrapPath = 'bower_components/bootstrap-sass/assets/';\n\
  \n  var app = new EmberApp(defaults, {\n    // Add options here\n    sassOptions:\
  \ {\n      includePaths: [\n        bootstrapPath + 'stylesheets'\n      ]\n   \
  \ }\n  });\n\n  // ... Template comments ...\n\n  // Create paths to bootstrap assets\n\
  \  // Add assets to app with import\n  app.import(bootstrapPath + 'javascripts/bootstrap.js');\n\
  \n  return app.toTree();\n};\n```\n\n你已经配置了 `Ember CLI` 使其会在 `bower_components/bootstrap-sass/assets/stylesheets`\
  \ 目录下查找 `*.scss` 文件。保存文件并重启 `Ember` 服务器，以便新配置能随应用程序一起加载。\n\n你现在可以在 `app.scss` 文件中使用\
  \ `@import` 指令来导入 `Bootstrap` 的样式：\n\n```\n$bg-color: coral;\nhtml {\n  background:\
  \ $bg-color;\n}\n\n// ----------------------------\n// bootstrap variable overrides\n\
  // ----------------------------\n\n// end bootstrap variable overrides\n@import\
  \ 'bootstrap';\n```\n\n`@import` 指令会将 `bootstrap.scss` 的内容添加到 `app.scss` 中，该文件将由\
  \ `Ember CLI` 构建过程创建。`Bootstrap` 的文件位于 `bower_components/bootstrap-sass/assets/stylesheets/`\
  \ 目录。\n\n在 `ember-cli-build.js` 中，你通过 `app.import(bootstrapPath + 'javascripts/bootstrap.js');`\
  \ 将 `Bootstrap` 的 JavaScript 组件添加到应用程序构建过程中。在 CLI 构建配置中的 `import` 会将文件添加到资源列表中，并合并成单个\
  \ `dist/assets/vendor.js` 文件。`Bootstrap` 的 `bootstrap.js` 在单个文件中包含了用于折叠 DOM 元素、模态框、标签页、下拉菜单等许多功能的独立\
  \ JavaScript 模块。添加所有的 JavaScript 组件可能有些过度了，但将来你可以调整 `ember-cli-build.js` 配置，只添加你需要的特定组件。\n\
  \n在添加资源后，你应该在继续之前始终确保它们运行正常。在 `app` 目录中有一个 `index.html` 文件——但并不是测试你新 `Bootstrap`\
  \ 代码的地方。该文件主要用于构建过程。\n\n相反，你所有的 HTML 元素都将添加到应用程序模板中，位于 `app/templates` 目录。你将在 第\
  \ 23 章 中更详细地学习模板。\n\n现在，为 `app/templates/application.hbs` 添加一个 `Bootstrap` `NavBar`\
  \ 组件：\n\n```\n<h2 id=\"title\">Welcome to Ember</h2>header>\n\n{{outlet}}\n<header>\n\
  \  <nav class=\"navbar--default-default\">\n    <div class=\"container-fluid\">\n\
  \      <!-- 品牌和切换按钮分组以获得更好的移动端显示 -->\n      <div class=\"navbar-header\">\n    \
  \    <button type=\"button\" class=\"navbar-toggle collapsed\"\n          data-toggle=\"\
  collapse\" data-target=\"#top-navbar-collapse\">\n          <span class=\"sr-only\"\
  >Toggle navigation</span>\n          <span class=\"icon-bar\"></span>\n        \
  \  <span class=\"icon-bar\"></span>\n          <span class=\"icon-bar\"></span>\n\
  \        </button>\n        <a class=\"navbar-brand\">Tracker</a>\n      </</div>\n\
  \n      <!-- 收集导航链接、表单和其他内容用于切换 -->\n      <div class=\"collapse navbar-default\"\
  >\n        <ul class=\"nav navbar-nav\">\n          <li><a href=\"#\">Home</a></li>\n\
  \          <li><a href=\"#\">Link</a></li>\n        </ul>\n      </div>\n    </div>\n\
  \  </nav>\n</header>\n<div class=\"container\">\n  {{outlet}}\n</div>\n```\n\n\n\
  \n\n\n## 铜牌挑战：限制导入\n\n修改 `ember-cli-build.js`，使其仅导入 `collapse.js` 和 `transition.js`\
  \ 文件。当你这样做时，你的 `vendor.js` 体积会变小，且你的 `NavBar` 组件仍能正常工作。\n\n在进行任何更改之前，找到 `dist/assets/vendor.js`\
  \ 并记录代码行数（或文件大小）。完成更改并对比新文件的大小。\n\n## 银牌挑战：添加 Font Awesome\n\nFont Awesome 是一个用于向项目添加常用图标的\
  \ UI 库。这些图标可以像字体一样缩放。使用 `Ember CLI` 插件添加 Font Awesome 并在 `app/templates/application.hbs`\
  \ 中添加一个图标。请查看该插件的 GitHub 仓库以获取更多信息。\n\n## 金牌挑战：自定义导航栏 (NavBar)\n\n`Bootstrap` 是\
  \ SCSS 编写的，并大量使用了变量和函数。当你在项目中使用 SCSS 版本时，你可以控制库编译样式规则的方式。你甚至可以创建 `Bootstrap` 主题来修改默认变量。\n\
  \n通过仅在 `app/stylesheets/app.scss` 中添加或更改变量，来修改 `NavBar` 的 `background-color`、`border-radius`\
  \ 和 `padding` 值。\n\n# 20 路由、路由与模型\n\n到此时，你已经拥有了 Tracker 应用的外壳。现在，你需要决定你的应用程序将包含哪些页面——或称为路由（routes）。\n\
  \n路由就像一个交通警察：当用户访问特定的 URL 时，路由会将用户引导至构成该页面的数据。在早期的项目中，你为表单提交和按钮点击构建了事件监听器。路由类似于事件监听器，但它监听的是当前\
  \ URL 的变化。\n\n每个网站都会使用某种形式的路由。例如，如果你访问 [www.bignerdranch.com/we-teach/](https://www.bignerdranch.com/we-teach/)，服务器会将路由\
  \ `/we-teach/` 映射到服务器上名为 `we-teach` 文件夹中的 HTML 文件。其他服务器可能会有所不同：它们可能不是检索静态 HTML 文件，而是运行一个输出某些\
  \ HTML 的函数。\n\n`Ember` 应用也可以做同样的事情，但不需要向服务器请求 HTML。当你的应用需要跳转到不同的屏幕时，它将使用新的路由名称更新\
  \ URL。作为主应用对象的子对象的 `Router` 具有用于 URL 变化的事件监听器和处理器。使用新路由，它会在路由表中进行查找并找到一个 `Ember.Route`\
  \ 对象。然后 `Router` 会调用该路由对象的系列方法，开始获取下一个屏幕所需数据的过程。这个回调过程被称为路由生命周期钩子（route lifecycle\
  \ hooks）。\n\n创建路由是 `Ember` 开发的基础。`Ember` 的命名约定假设你将创建与路由名称匹配关联控制器和模板。例如，当你创建一个名为\
  \ `sightings` 的路由时，路由器会将对 `/sightings` 的请求映射到 `SightingsRoute`，后者反过来会设置 `SightingsController`，并最终渲染\
  \ `app/templates/sightings.hbs` 模板。\n\n在本章中，你将学习 `Ember` 应用构建结构，并使用 `Ember CLI`\
  \ 创建 Tracker 的路由模块文件和模板。路由是 `Ember` 应用的关键，本章的工作将帮助你在接下来的五个章节中开发应用。\n\n图 20.1 显示了本章结束时的\
  \ Tracker。\n\n**图 20.1 Tracker 应用**\n\n![Tracker 应用](img/sightings-index-route-model.png)\n\
  \n## ember generate\n\n`Ember CLI` 提供了一个名为 `generate` 的脚手架工具，在你学习 `Ember` 规范和命名模式时它非常有用。你将使用\
  \ `ember generate`（或简写 `ember g`）来创建文件并为项目添加模板代码。\n\n回想一下，Tracker 的目的是记录对神秘生物（cryptids）的目击——比如大脚野生物。它将跟踪有关目击事件、神秘生物和证人的信息。它需要很多路由：\n\
  \n| 路由 (Route) | 路由路径 | 路由数据 |\n| --- | --- | --- |\n| index | /index | 无数据 – 重定向到\
  \ sightings |\n| sightings | /sightings | 目击列表 |\n| cryptids | /cryptids | 神秘生物列表\
  \ |\n| witnesses | /witnesses | 证人列表 |\n| sighting | /sighting | 单个目击详情 |\n| cryptid\
  \ | /cryptid | 单个神秘生物详情 |\n| witness | /witness | 单个证人详情 |\n| sightings index |\
  \ /sightings/index | 目击列表落地页 |\n| sightings new | /sightings/new | 创建目击的表单 |\n|\
  \ sighting index | /sighting_id/index | 单个目击落地页 |\n| sighting edit | /sighting_id/edit\
  \ | 编辑单个目击的表单 |\n\n你将使用 `generate` 创建所有路由。打开终端并导航到你的 `tracker` 目录。逐行运行以下命令来生成你的路由：\n\
  \n```\nember g route index\nember g route sightings\nember g route sightings/new\n\
  ember g route sighting\nember g route sighting/index\nember g route sighting/edit\n\
  ember g route cryptids\nember g route cryptid\nember g route witnesses\nember g\
  \ route witness\n```\n\n这看起来像图 20.2 所示。\n\n**图 20.2 生成路由**\n\n![生成路由](img/ember-g-routes.png)\n\
  \n现在，看看 `g` 为你创建了什么。你应该 `routes/` 和 `templates/` 目录下有了新文件。\n\n打开 `app/routes/index.js`，注意该模块导入了\
  \ `Ember` 并导出了 `Ember.Route`：\n\n```\nimport Ember from 'ember';\n\nexport default\
  \ Ember.Route.extend({\n});\n```\n\n`extend()` 方法创建一个 `Ember.Route` 的子类，并接受一个 JavaScript\
  \ 对象作为参数。使用 ES6 模块语法，你可以为每个路由创建独立的模块。\n\n`Ember CLI` 会自动找到你创建的 `Ember.Route` 模块并将其导入你的应用——无论你是使用\
  \ `generate` 命令（如此处所示），还是手动创建模块。`generate` 非常方便，因为它在文件中添加了一些模板代码。\n\n打开 `app/templates/index.hbs`，这是\
  \ `Ember CLI` 也为你生成的。这个模板将用于 `IndexRoute`。它只有一行代码：`{{outlet}}`。\n\n你可能在上一章中见过这段代码，当时你正在编辑\
  \ `templates/application.hbs` 文件。这个助手允许模板在路由之间嵌套内容。很快你就会学习更多关于 `{{outlet}}` 助手的知识。\n\
  \n现在，先让 `app/templates/index.hbs` 中的这一行保持不变，在其上方添加一个 HTML `<h1>` 元素：\n\n```html\n\
  <h1>Index Route</h1>\n{{outlet}}\n```\n\n\n\n\n现在使用 `ember server` 启动应用。在开发项目时，保持服务器运行。如果你需要与\
  \ `Ember CLI` 交互（例如，生成更多模块），只需打开第二个终端窗口。服务器会将新模块加载到你的 `Ember` 应用中并刷新浏览器。\n\n在 `Chrome`\
  \ 中，访问 `http://localhost:4200`。你的应用应该类似于图 20.3。\n\n**图 20.3 索引路由**\n\n![Index route](img/routing-index-route.png)\n\
  \n你应该能看到来自 `app/templates/application.hbs` 的 `NavBar` 元素以及来自 `app/templates/index.hbs`\
  \ 的 `<h1>` 元素。这个元素是如何出现在这里的？\n\n当你创建应用时，系统为你生成了许多文件，包括 `app.js` 和 `router.js`。`app.js`\
  \ 文件是应用的起点，负责处理初始化等工作。它具有创建新的 `Ember` 应用的函数，就像在 CoffeeRun 中创建一个新的 `Truck` 一样。\n\n\
  特别是，当应用加载或重启时，`Ember` 应用会实例化 `Router` 对象和 `ApplicationRoute` 对象。这两个 `Ember` 对象控制着你的应用。\n\
  \n在你的 `router.js` 文件中，你将注册 `routes` 将 URL 与特定页面关联。每个 `route` 都可以配置一些选项。你甚至可以创建嵌套路由。`Ember`\
  \ 的这一功能允许你在不同的屏幕上复用内容和逻辑。\n\n打开 `router.js` 并查看注册路由的方法：\n\n```\nimport Ember from\
  \ 'ember';\nimport config from './config/environment';\n\nconst Router = Ember.Router.extend({\n\
  \  location: config.locationType\n});\n\nRouter.map(function() {\n  this.route('sightings',\
  \ function() {\n    this.route('new');\n  });\n  this.route('sighting', function()\
  \ {\n    this.route('edit');\n  });\n  this.route('cryptids');\n  this.route('cryptid');\n\
  \  this.route('witnesses');\n  this.route('witness');\n});\n\nexport default Router;\n\
  ```\n\n`Router.map` 被传递了一个回调函数。在这个回调内部，`route` 方法注册了你的路由。该方法也接受回调函数。`Ember` 将这些嵌套回调转换为路由层次结构。该层次结构的顶端是\
  \ `ApplicationRoute`。\n\n当你访问嵌套路由的 URL 时，`Ember` 会使用父模板的 HTML。在那个父模板内部，它会寻找 `{{outlet}}`\
  \ 辅助器，它表示“这里是你放置子模板 HTML 的地方”。\n\n让我们看看这在你的应用中是如何工作的。\n\n`Ember` 渲染 `ApplicationRoute`\
  \ 的内容，并在其中嵌套 `IndexRoute` 的内容。在后台，`Ember` 会检查你的项目 `routes/` 文件夹中是否存在名为 `index.js`\
  \ 的文件。你可以通过在相应的文件夹中创建 `index.js` 为任何路由创建一个落地页。事实上，这是你在你自己的 `Ember` 应用中应该使用的常用做法。\n\
  \n你可能注意到 `router.js` 中没有对 `index` 路由的引用。`Ember` 会为所有带有嵌套子路由的父路由自动生成 `index` 路由，就像它们出现在\
  \ `router.js` 中一样：\n\n```\n...\nRouter.map(function() {\n  this.route('index');\n\
  \  this.route('sightings', function() {\n    this.route('index');\n    this.route('new');\n\
  \  });\n  this.route('sighting', function() {\n    this.route('index');\n    this.route('edit');\n\
  \  });\n  this.route('cryptids');\n  this.route('cryptid');\n  this.route('witnesses');\n\
  \  this.route('witness');\n});\n...\n```\n\n## 嵌套路由\n\n路由允许你在视图中结构化数据。就像文件夹一样，嵌套路由将相关的路由分组在一个基础\
  \ URL 下。将父路由视为名词，将子路由视为动词或形容词是有帮助的：\n\n```javascript\n// 父路由是名词\nthis.route('sightings',\
  \ function() {\n  // 子路由是动词或形容词\n  this.route('new');\n});\n```\n\n`sightings` 是代表\
  \ `sightings` 的父路由，它是一个事物（名词），而 `new` 是一个嵌套路由。（注：原文此处处存在大量重复文本，已在翻译中去冗以保持逻辑清晰）。\n\
  \n\n\n\n路由非常多！甚至比你生成的还要多。注意，有许多路由以 `loading` 和 `error` 结尾。这些是为路由加载数据的生命周期状态自动生成的路由。就像\
  \ `index` 路由一样，这些对象是由 `Ember` 创建的，用于填充从一个路由状态到另一个路由状态之间的空白。\n\n## 分配模型\n\n下一步是使用路由的\
  \ model 回调将数据传递给每个路由。每个 `Ember.Route` 都有一个方法将模型（记住，模型是支持模板的数据）分配给控制器。这个名为 `model`\
  \ 的方法返回一个 `Promise` 类型的数据。\n\n在底层，`Ember` 应用会在 URL 变化时初始化 `Route` 对象。该 `Route` 对象有四个用于自检的钩子函数（hooks）：`beforeModel`、`model`、`afterModel`\
  \ 和 `setupController`。\n\n我们现在重点关注 `model` 回调。\n\n在 `app/routes/sightings.js` 的\
  \ `SightingsRoute` 的 `model` 回调中添加一些虚拟数据：\n\n```\nimport Ember from 'ember';\n\n\
  export default Ember.Route.extend({\n  model(){\n    return [\n      {\n       \
  \ id: 1,\n        location: 'Asilomar',\n        sightedAt: new Date('2016-03-07')\n\
  \      },\n      {\n        id: 2,\n        location: 'Asilomar',\n        sightedAt:\
  \ new Date('2016-03-07')\n      },\n      {\n        id: 3,\n        location: 'Asilomar',\n\
  \        sightedAt: new Date('2016-03-07')\n      },\n      {\n        id: 4,\n\
  \        location: 'Asilomar',\n        sightedAt: new Date('2016-03-07')\n    \
  \  },\n      {\n        id: 5,\n        location: 'Asilomar',\n        sightedAt:\
  \ new Date('2016-03-07')\n      },\n      {\n        id: 6,\n        location: 'Asilomar',\n\
  \        sightedAt: new Date('2016-03-07')\n      }\n    ];\n  }\n});\n```\n\n注意\
  \ `model` 钩子的语法：\n\n```\nmodel() {\n  [your code goes here]\n}\n```\n\n这是 ES6 的简写形式：\n\
  \n```\nmodel: function() {\n  [your code goes here]\n}\n```\n\n在接下来的章节中，你将使用这种语法在\
  \ `Ember` 中定义你的对象方法。\n\n`model` 回调是获取渲染模板所需数据的地方。`Ember.Route` 中的路由生命周期方法为每个钩子返回对象。`model`\
  \ 钩子最终会将数据返回给 `setupController` 钩子，该钩子会在 `SightingsController` 上设置一个名为 `model` 的属性。你可以在模板中访问这些数据：`app/templates/sightings.hbs`\
  \ 和 `app/templates/sightings/index.hbs`。\n\n按照所示编辑 `app/templates/sightings/index.hbs`。在你输入代码后我们将解释这些代码：\n\
  \n```\n<h1>Index Route</h1>\n<div class=\"panel-default\">\n  <ul class=\"list-group\"\
  >\n    {{#each model as sighting}}\n      <li class=\"list-group-item\">\n     \
  \   {{sighting.location}} - {{sighting.sightedAt}}\n      </li\n    {{/each}}\n\
  \  </ul>\n</div\n```\n\n如果你从未用过模板语言，这段代码看起来可能很奇怪。双大括号 `{{ }}` 中的单词本质上是伪装成语句的函数。在英语中，这些行的意思是：“对于\
  \ `model` 属性（预期为数组）中的每个 `sighting`，渲染一个带有 `sighting` 的 `location` 和 `sightedAt`\
  \ 日期的 `<li>` 元素。”\n\n你将在第 23 章学习通用的 `{{ }}` 语法，特别是 `{{#each}}`。在浏览器中切换到 `http://localhost:4200/sightings`，你的应用看起来应该像图\
  \ 20.7 所示。\n\n**图 20.7 Index 模型列表**\n\n![Index model listing](img/sightings-index-model.png)\n\
  \n你现在已经通过将数据传递给模板进行显示完成了路由周期的第一部分。在下一章中，你将探索 `Handlebars` 模板语言。这种语言允许你通过控制器的属性来表示应用程序的状态，并在应用程序状态更改时渲染必要的\
  \ DOM 元素。\n\n## beforeModel\n\n如上所述，路由对象会调用一组函数，从 `beforeModel` 开始。该函数是在获取数据之前检查应用程序状态的好地方。它也是重定向无法访问某页面的用户的好地方，例如检查用户身份验证。\n\
  \n你将使用 `beforeModel` 无条件地将用户转移到新页面。`IndexRoute` 是此操作的好地方。你未来可能想添加一个仪表板，但目前落地页将是\
  \ `sightings`。\n\n在 `app/routes/index.js` 中添加 `beforeModel` 回调：\n\n```\nimport Ember\
  \ from 'ember';\n\nexport default Ember.Route.extend({\n  beforeModel(){\n    this.transitionTo('sightings');\n\
  \  }\n});\n```\n\n现在，当你导航到 `http://localhost:4200/` 时，URL 变为 `http://localhost:4200/sightings`，你应该能看到来自\
  \ `app/templates/sightings/index.hbs` 的观测列表。\n\n最后两个路由钩子 `afterModel` 和 `setupController`\
  \ 在 Tracker 中不会使用。创建 `route` 文件时，你是在克隆 `Ember.Route` 对象并重写方法，类似于 Java 等语言中的接口。`setupController`\
  \ 钩子默认运行，以便在路由对象的控制器上设置 `model` 属性。\n\n到此时，你的应用程序已经有一些概述其功能的示例路由：落地页、观测列表以及添加新观测的路由。你为路由创建了模板并向\
  \ `sightings` 路由了模型数据。你将索引路由重定向到了观测索引。你有一个良好的开端！\n\n在下一章中，你将学习 `Ember.Model`、适配器、计算属性和存储机制。\n\
  \n## 深入好奇者：setupController 和 afterModel\n\n`setupController` 钩子用于在控制器上设置将要渲染的属性。可以通过\
  \ `this._super` 在设置其他活跃控制器属性的同时，执行设置 `model` 属性的默认行为：\n\n```\nsetupController(controller,\
  \ model) {\n  this._super(controller, model);\n  // this.controllerFor('[other controller]').set(\"\
  [property name]\", [value]);\n}\n```\n\n`afterModel` 钩子在 `model` 钩子（一个 `Promise`）解析后运行。注意，在某些特殊情况下，由于\
  \ `Promise` 已经解析，`model` 钩子不会被调用。在情况下，`afterModel` 会在 `setupController` 之前调用。\n\n\
  \n\n\n\n你已经在使用对象字面量（object literals）形式的数据进行过大量工作。你已经创建并修改了对象及其属性，并且创建了函数来快速创建带有默认值的对象。你已经知道如何将数据存储在\
  \ `localStorage` 和 `sessionStorage` 中。\n\n在 Tracker 项目中，你将处理模型（models）形式的数据。模型本质上是创建具有特定属性和方法的函数。它们是流经你应用程序的数据架构。\n\
  \nEmber 有一个对象类，可以处理你定义应用数据架构的初始需求：`Ember.Object`。所有的 Ember 类都继承自这个类。通过简单的定义和命名模式，Ember\
  \ 赋予了你在应用运行时创建、检索、更新和销毁模型实例的能力。\n\n然而，对于你的现代应用程序，你需要的比 `Ember.Object` 提供的更多。你的模型需要在业务逻辑要求从数据源检索或保存数据时能够实现自身的持久化。\n\
  \n引入 Ember Data，这是一个构建在 `Ember.Object` 之上的 JavaScript 库，它可以帮助你添加模型特定的功能。Ember Data\
  \ 增加了基于 `Ember.Object` 构建的类，抽象了处理各种数据源操作的复杂性：`RESTful APIs`、`localStorage` 甚至静态固件数据（fixture\
  \ data）。\n\nEmber Data 还为数据添加了一个内存存储器（store）。数据存储器是你创建、检索、更新和删除模型实例的地方。\n\n## 模型定义\n\
  \nEmber CLI 已经加载了 Ember Data 库，所以你已经准备好构建模型了。\n\n在上一章中，你使用了 `ember g route [route\
  \ name]` 让 Ember CLI 为你创建路由文件。你也可以使用 `ember generate` 通过命令 `ember g model [model\
  \ name]` 来创建模型文件。\n\n创建你所需的支持神秘生物（cryptids）、目击（sightings）和见证者（witnesses）路由的模型文件：\n\
  \n```\nember g model cryptid\nember g model sighting\nember g model witness\n```\n\
  \nCryptid 在 `app/models/cryptid.js` 文件中有一个模型定义。打开此文件并为 `cryptid` 模型添加名称、神秘生物类型（物种）、个人头像和目击的属性：\n\
  \n```\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n  name:\
  \ DS.attr('string'),\n  cryptidType: DS.attr('string'),\n  profileImg: DS.attr('string'),\n\
  \  sightings: DS.hasMany('sighting')\n});\n```\n\nEmber Data 在此处引用为 `DS`（代表“data\
  \ store”），它有一个用于指定模型属性的 `attr` 方法。当从源解析数据时，`attr` 返回该值。如果你给 `attr` 一个属性类型，它将被强制转换为该类型。如果你不设置属性类型，你的数据将原封不动地传递给相应的键。\n\
  \n内置了几个属性类型：`string`、`number`、`boolean` 和 `date`。你也可以使用 `transforms` 创建自定义模型属性，你将在\
  \ [第 22 章 数据 – 适配器、序列化器和转换] 中学习这些。\n\n`attr` 还可以接收第二个参数来指定默认值。这个可选参数是一个只有一个键的哈希对象：`defaultValue`。以下是一些示例：\n\
  \n```\nname: DS.attr('string', {defaultValue: 'Bob'}),\nisNew: DS.attr('boolean',\
  \ {defaultValue: true}),\ncreatedAt: DS.attr('date', {defaultValue: new Date()}),\n\
  numOfChildren: DS.attr('number', {defaultValue: 1})\n```\n\n在 cryptid 定义中，你为 `name`、`cryptidType`\
  \ 和 `profileImg` 属性使用了 `string` 属性类型。（为什么对 `profileImg` 使用 `string` 类型？因为它引用的是图像路径而不是图像本身。）\n\
  \n`sightings` 属性使用了不同的方法来定义其数据：`hasMany`。该方法是 Ember Data 关系方法的一部分。当你为 `RESTful API`\
  \ 查询 cryptid 时，它将拥有关联的目击。该关联将以 sighting `id` 的数组形式返回，引用一个 sighting 模型的实例。\n\nEmber\
  \ Data 拥有处理一一、一多和多对多关系类型的方法：\n\n| 关系 | “拥有者”模型 | “被拥有”模型 |\n| --- | --- | --- |\n\
  | 一一 | `DS.hasOne` | `DS.belongsTo` |\n| 一对多 | `DS.hasMany` | `DS.belongsTo` |\n\
  | 多对多 | `DS.hasMany` | `DS.hasMany` |\n\n第一个参数是要关联的模型。在你的应用中，一个 cryptid 将拥有许多 `sighting`\
  \ 实例（你会惊讶于人们看到这些生物的频率）。第二个参数是一个可选的哈希，与 `attr` 的第二个参数类似，它是一个在评估函数时设置值的配置对象。它包含一个\
  \ `async` 键和一个值（默认为 `true`）。\n\n模型关系可能需要向服务器发送请求以检索其他模型数据。对于 cryptids，需要请求 `sightings`\
  \ 来显示每个 cryptid 的目击数据。对于目击属于 cryptid 的反向关系也是如此。默认值 `async: true` 需要一个单独的请求和 API\
  \ 端点来检索链接数据。\n\n如果你的 API 有能力发送所有数据，你可以将 `async` 值设置为 `false`。对于 Tracker 应用，请保持该值为默认\
  \ `true`。\n\n接下来，打开 `app/models/witness.js` 中的见证者模型，并为见证者的姓、名、电子邮件地址和记录的目击添加属性：\n\
  \n```\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n  fName:\
  \ DS.attr('string'),\n  lName: DS.attr('string'),\n  email: DS.attr('string'),\n\
  \  sightings: DS.hasMany('sighting')\n});\n```\n\n你将见证者定义为一个包含名（`fName`）、姓（`lName`）、电子邮件（`email`）以及与目击的多对多关系（`sightings`）的对象。\n\
  \n最后，打开你的第三个模型文件：`app/models/sighting.js`。为你的 `sightings` 模型添加关于目击的地点、何地、何时以及记录目击日期的属性：\n\
  \n```\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n  location:\
  \ DS.attr('string'),\n  createdAt: DS.attr('date'),\n  sightedAt: DS.attr('date'),\n\
  \  cryptid: DS.belongsTo('cryptid'),\n  witnesses: DS.hasMany('witness')\n});\n\
  ```\n\n目击的定义与见证者和神秘生物类似，基础属性使用了字符串。`location` 是用户在应用中输入的值，而 `createdAt` 和 `sightedAt`\
  \ 将将在添加到数据库时由服务器端添加。\n\n\n\n\n\n属性 `cryptid` 的关系是新的内容：`DS.belongsTo('cryptid')`。该方法是一个一对多的关系，将\
  \ `cryptid` 实例与 `sighting` 实例连接起来——之所以是一一对多是因为每个 cryptid 都有许多 sighting（目击）。\n\n\
  ## createRecord\n\n当应用初始化时，`Ember Data` 会创建 `store`，这是一个本地存储对象。`this.store` 是用于创建、检索、更新和删除\
  \ Tracker 应用所有模型记录的对象。`Ember` 在所有的 `Routes`（路由）、`Controllers`（控制器）和 `Components`（组件）中注入了\
  \ `store` 对象。在路由方法的作用范围内，你可以通过 `this` 访问 `store`。\n\n要创建一个记录，你将调用 `this.store.createRecord`。该方法接受两个参数：字符串形式的模型名称和对象形式的记录数据。\n\
  \n打开 `app/routes/sightings.js`。删除你的占位 sightings 并创建三个新的 `sighting` 记录，每个记录的 `location`\
  \ 值为字符串，`sightedAt` 值为 `new Date()`：\n\n```\nimport Ember from 'ember';\n\nexport\
  \ default Ember.Route.extend({\n  model() {\n    return [\n      {\n        id:\
  \ 1,\n        location: 'Asilomar',\n        sighted_at: new Date('2016-03-07')\n\
  \      },\n      ...\n      {\n        id: 6,\n        location: 'Asilomar',\n \
  \       sightedAt: new Date('2016-03-07')\n      }\n    ];\n    let record1 = this.store.createRecord('sighting',\
  \ {\n      location: 'Atlanta',\n      sightedAt: new Date('2016-02-09')\n    });\n\
  \n    let record2 = this.store.createRecord('sighting', {\n      location: 'Calloway',\n\
  \      sightedAt: new Date('2016-03-14')\n    });\n\n    let record3 = this.store.createRecord('sighting',\
  \ {\n      location: 'Asilomar',\n      sightedAt: new Date('2016-03-21')\n    });\n\
  \n    return [record1, record2, record3];\n  }\n});\n```\n\n在 第 20 章 中，`sightings`\
  \ 路由模型返回的是一个数组。你并没有返回 JavaScript 对象，而是创建了三个 sighting 记录并将这些记录作为一个数组返回。如果 `ember\
  \ server` 尚未运行，请运行它以便在 `sightings` 路由上查看你的新记录：[`localhost:4200/sightings`](http://localhost:4200/sightings)\
  \ (图 21.1）。\n\n**图 21.1 `create` sightings**\n\n![create sightings](img/model-sightings-atlanta.png)\n\
  \n此示例显示创建 `Ember Data` 模型与创建 JavaScript 对象非常相似。拥有 `Ember Data` 模型对象的优势是这些对象为你提供的所有方法。让我们从\
  \ `get` 和 `set` 开始。\n\n## get and set\n\n`Ember Data` 模型记录的核心是一个 `Ember.Object`。该对象的定义包含了\
  \ `get` 和 `set` 方法。与大多数语言不同，JavaScript 并不强制在对象实例上使用 getters 和 setters。`Ember` 通过这些方法应用了\
  \ getters 和 setters 的概念，以强制在更改对象属性时运行一个函数。这允许 `Ember` 为 `set` 添加事件触发器，并让程序员在获取属性时是有意图的。\n\
  \n`get` 方法接收单个参数（即属性名），用于检索属性值。在 `app/routes/sightings.js` 的 `model` 回调中尝试一下。\n\n\
  ```\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model()\
  \ {\n    let record1 = this.store.createRecord('sighting', {\n      location: 'Atlanta',\n\
  \      sightedAt: new Date('2016-02-09')\n    });\n    console.log(\"Record 1 location:\
  \ \"  +  record1.get('location') );\n    ...\n    return [record1, record2, record3];\n\
  \  }\n});\n```\n\n重新加载浏览器。确保开发者工具已打开并选择了 JavaScript 控制台选项卡。你应该能看到 `Ember` 的日志记录，最后一行是：“Record\
  \ 1 location: Atlanta.”\n\n接下来，回到 `app/routes/sightings.js`，在创建记录之后、打印属性之前，使用 `set`\
  \ `record1` 的 `location` 的值。\n\n```\nimport Ember from 'ember';\n\nexport default\
  \ Ember.Route.extend({\n  model() {\n    let record1 = this.store.createRecord('sighting',\
  \ {\n      location: 'Atlanta',\n      sightedAt: new Date('2016-02-09')\n    });\n\
  \    record1.set('location', 'Paris, France');\n    console.log(\"Record 1 location:\
  \ \" + record1.get('location'));\n    ...\n    return [record1, record2, record3];\n\
  \  }\n});\n```\n\n重新加载浏览器，你将会看到控制台反映了 `set` 的值：“Record 1 location: Paris, France”\
  \ (图 21.2。\n\n**图 21.2 `set` location**\n\n![set location](img/model-sightings-atlanta.png)\n\
  \n这些都是 `get` 和 `set` 的基础示例。在模型记录上设置属性时，你也可以将其他模型记录分配给属性，以便为 `hasMany` 或 `belongsTo`\
  \ 定义的关系创建连接。\n\n## Computed Properties\n\n计算属性是管理属性的重要部分。`Ember.computed` 是一个方法，它获取作用范围的值并在方法结束时返回一个值。例如，调用以下代码将得到一个\
  \ `first_name` 属性转换为小写的计算属性：\n\n```\nEmber.computed('first_name', function(){\n\
  \  return this.get('first_name').toLowerCase();\n});\n```\n\n在这个示例中，`Ember.computed`\
  \ 充了 `first_name` 事件监听器。你不需要更改 `set` 方法来触发事件，不需要添加事件监听器，也不需要更改 `first_name` 属性。你只需要创建一个你想要的属性即可。\n\
  \n计算属性在 `Ember` 中是非常广泛的。你将在 第 25 章 中为组件创建计算属性。计算属性要么用作视图或组件的 <term>装饰</term>（如上面的示例），要么用于检索嵌入模型对象中的特定数据。\n\
  \n“装饰”数据意味着以某种方式对其格式化——例如将字符串转换为小写。来自 API 的数据并不总是你想要的格式。装饰器是接收参数并输出专门用于应用程序视图层的对象或数组的函数。装饰数据的格式化或构建通常不会返回数据库。因此，装饰器通常添加到控制器，除非每个页面都在渲染来自数据库中未格式化的模型数据。\n\
  \n在你的 `app/models/witness.js` 模型中，添加一个 `fullName` 的计算属性。\n\n\n\n\n\n```javascript\n\
  import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  fName: DS.attr('string'),\n\
  \  lName: DS.attr('string'),\n  email: DS.attr('string'),\n  sightings: DS.hasMany('sighting'),\n\
  \  fullName:  Ember.computed('fName', 'lName', function(){\n    return this.get('fName')\
  \ + ' ' + this.get('lName');\n  })\n});\n```\n\n（如果自动重启的服务器报错，请确保你已经在 `sightings`\
  \ 属性声明中添加了尾逗号。这是一个容易漏掉的细节。）\n\n你添加到 `witness` 模型中的属性是一个函数，每当 `fName` 和 `lName` 发生变化时就会被调用。计算属性可以接受任意数量的参数作为观察属性，最后一个参数是用于返回值的函数。每一个作为属性的参数都会触发该函数的调用。\n\
  \n打开 `app/routes/witnesses.js` 并创建一个新的见证人记录，以测试 `witness` 模型的计算属性：\n\n```javascript\n\
  import Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model() {\n\
  \    let witnessRecord = this.store.createRecord('witness', {\n      fName: \"Todd\"\
  ,\n      lName: \"Gandee\",\n      email: \"fake@bignerdranch.com\"\n    });\n \
  \   return [witnessRecord];\n  }\n});\n```\n\n为了让见证人数据显示在屏幕上，编辑 `app/templates/witnesses.hbs`\
  \ 使用与 `app/templates/sightings/index.hbs` 相同的 `{{#each}}` 迭代器：\n\n```handlebars\n\
  {{outlet}}\n<h1>Witnesses</h1>\n<div class=\"row\">\n  {{#each model as |witness|}}\n\
  \    <div class=\"col-xs-12 col-sm-6 col-md-4\">\n      <div class=\"well\">\n \
  \       <div class=\"thumbnail\">\n          <div class=\"caption\">\n         \
  \   <h3>{{witness.fullName}}</h3>\n            <div class=\"panel panel-danger\"\
  >\n              <div class=\"panel-heading\">Sightings</div>\n            </div>\n\
  \          </div>\n        </div>\n      </div>\n    </div>\n  {{/each}}\n</div>\n\
  ```\n\n访问 `http://localhost:4200/witnesses` 并查看结果（图 21.3）。\n\n**图 21.3 见证人列表**\n\
  \n![Witnesses listing](img/model-computed-property-witnesses.png)\n\n在此视图中，你添加了见证人列表（目前仅包含一个见证人），并使用计算属性来显示见证人的\
  \ `fullName` 属性。该属性是根据你在创建见证人记录时添加的值生成的。通过 `witnessRecord.set`，你可以在模型回调返回记录之前提供不同的名字或姓氏，以查看属性的变化。\n\
  \n在关于 `Ember` 的这几章中，你已经走了很远了！你现在可以定义数据模型、创建记录、创建计算属性以及获取和设置属性值。稍后，你将读到如何使用 API 获取、更新和销毁记录。\n\
  \n在下一章中，你将学习使用适配器（adapters）、序列化器（serializers）和转换器（transforms）将你的数据模型与网络数据连接起来。\n\
  \n## 深入好奇：检索数据\n\n如上所述，数据存储管理模型数据并知道如何检索它们。在上一章中，你在 `SightingRoute` 模型回调中返回了一个数组作为数据。在第\
  \ 22 章 中，你将在此路由中检索模型数据并使用 `this.store.findAll` 以及其他数据检索方法作为 `Promise` 返回数据。\n\n\
  以下是 `Ember Data` 的 `store` 对象从 API 获取数据、将其存储在内存中并返回给请求者的方法。\n\n| 请求类型 | 获取所有记录 |\
  \ 获取单个记录 |\n| --- | --- | --- |\n| 查找持久化和本地记录 | `findAll` | `findRecord` |\n| 仅查找本地记录\
  \ | `peekAll` | `peekRecord` |\n| 查找过滤后的记录 | `query` | `queryRecord` |\n\n检索方法有几种形式：持久化和本地、仅本地、以及过滤后的持久化和本地。大多数用例需要\
  \ `findAll` 和 `findRecord`。每个方法的参数与 `Ember Data` 创建用于从 API 请求数据的端点紧密对应。\n\n对于 `findAll`，唯一要求的参数是模型名称。例如，对所有见证人的请求将是\
  \ `findAll('witness')`。注意单数名称吗？记住，这个参数是模型名称。`Ember Data` 在构建 Ajax URL `/witnesses/`\
  \ 时会确保请求具有复数名称。\n\n对于 `findRecord`，需要额外的参数来指定特定记录。该参数是标识符，通常是记录的 `id`，例如 `this.store.findRecord('witness',\
  \ 5)`。调用 `findRecord('witness', 5)` 将为 `/witnesses/5` 创建数据请求。\n\n对于 `peekAll` 和\
  \ `peekRecord`，需要相同的参数来检索数据。调用这些方法将立即返回数据，而不是作为一个 `Promise`。\n\n查询 API 数据是形成请求的另一种方式。如果你的\
  \ API 支持针对端点的查询参数（或 `params`），那么 `Ember Data` 的 `query` 和 `queryRecord` 是很好的选择。像其他\
  \ `store` 方法一样，这些方法将模型名称作为第一个参数。最后一个参数是查询对象，其键值对被转换为查询字符串值。对于 `query`，请求将根据键和值查找所有记录。`queryRecord`\
  \ 用于你确定请求将返回单个记录的情况。\n\n例如，调用\n\n```javascript\nthis.store.query('user',{fName:\
  \ \"todd\"})\n```\n\n将产生此请求：`/users/?f_name=todd`。或者\n\n```javascript\nthis.store.queryRecord('user',\
  \ {email: 'me@test.com'})\n```\n\n将产生此请求：`/users?email=test.com`。\n\n所有 `store`\
  \ 方法都利用了适配器，你将在下一章读到它们。\n\n## 深入好奇：保存数据\n\n更新（即保存）和销毁记录是创建和检索之后的下一个逻辑步骤。（对此有一个助记法：CRUD，代表“创建、读取、更新、删除”。）`save`\
  \ 和 `destroyRecord` 方法直接在模型实例上可用。这些方法会通过适配器触发请求以更新数据存储。它们返回 `Promise` 对象，因此你可以使用\
  \ `.then` 链式回调对返回的数据进行操作。\n\n正如你在本章中看到的，`set` 是更改模型记录属性值的方法。如果你在应用程序本地更改值，数据将与持久化源不同。因此，当你使用\
  \ `set` 修改值后，应该保存你的数据。你可以通过 `modelRecord.save` 实现。保存模型将告诉 `store` 向 API 发送 `POST`\
  \ 或 `PUT` 请求，取决于记录的状态。\n\n\n\n\n\n虽然上面没有提到这一点，但在检索数据时，`store` 会对数据发送 `get` 请求。在保存数据时，如果持久化源中数据，则发送类型为\
  \ `POST` 的请求；如果数据已存在并正在更新，则发送 `PUT` 请求。\n\n当你调用 `createRecord()` 时，如之前所述，你并没有将数据保存到数据库。你只是创建了一个内存对象。调用\
  \ `save()` 是用于创建和更新。\n\n销毁记录是最后一步。与检索和更新记录的方法类似，`modelRecord.destroyRecord` 使用请求方法——在此例中为\
  \ `DELETE`——从持久化源中删除记录。随后 `store` 会从内存中移除该记录。与 `save()` 类似，`destroyRecord()` 实际上是两个函数调合并：`deleteRecord()`\
  \ 和 `save()`，因为 `deleteRecord()` 只在本地删除记录。`destroyRecord()` 更为常用，因为它将这些步骤合并为了单一操作。\n\
  \n## 铜级挑战：修改计算属性\n\n`fullName` 计算属性目前使用 `fName` 和 `lName`。将绑定的属性更改为 `email` 和 `fName`，以创建一个显示为\
  \ `Todd - tgandee@bignerdranch.com` 的 `fullName`。\n\n## 银级挑战：标记新发现\n\n为发现（sightings）添加一个新的布尔属性\
  \ `isNew`。赋予该属性一个 `false` 的 `defaultValue`。将此属性添加到你创建的一个记录中并将其设置为 `true`。导航到 `sightings`\
  \ 路由，并使用 `Chrome` 中的 `Ember Inspector` 检查该路由的数据。应该只有一个发现实例的 `isNew` 属性被设置为 `true`。\n\
  \n## 金级挑战：添加标题\n\n证人需要一个适当的头衔，例如 `Mr.` Gandee。为模型添加一个 `title` 属性，然后为除一个之外的每个证人记录设置标题。添加一个带有\
  \ `defaultValue` 的对象参数。为没有指定标题的实例选择有趣的默认标题。在创建 `title` 属性并为你的记录提供一些新数据后，添加一个计算属性来显示\
  \ `titleName`。\n\n尽情玩你的默认标题吧。Wikipedia 有一个很好的标题列表（[en.wikipedia.org/wiki/Title](https://en.wikipedia.org/wiki/Title)。“Mahatma\
  \ Gandee” 听起来很不错……\n\n# 22 数据 – 适配器、序列化器与转换器\n\n应用程序需要进出接口的数据。连接数据源是开发应用程序的一个重要方面。否则，你将拥有一个复杂的表单、事件和列表系统，但没有任何数据可显示。\n\
  \n在本章中，你将学习在 `Ember` 中连接数据源的基础知识。你将使用为本书创建的 API 并为你的应用程序创建一个适配器。\n\n本章与书中的其他章节略有不同。它包含的信息更多，代码更少。然而，本章将为你提供与可能不受你控制的服务器和数据库进行应用程序开发的重要现实视角。在下一章中，你将回到常规的编码工作。\n\
  \n如 第 21 章 所述，适配器（adapters）是应用程序的翻译器。当你与数据源通信时，应用程序需要以多种方式请求和发送数据。`Ember Data` 内置了适配器对象来处理一些最常见的数据场景：`JSONAPI`\
  \ 和通用的“RESTful” API。\n\n你将使用 `JSONAPIAdapter` 对象连接数据源并返回 `JSONAPI` 格式的数据。`RESTAdapter`\
  \ 对象是一组方法，用于处理由 `Rails` 及其 `ActiveRecord` 插件生成的 API 格式化数据。\n\n`JSONAPI` 规范的创建是为了为\
  \ API 消费者提供一种从服务器发送和接收数据的预测且可扩展的模式。虽然有很多服务器语言——并且每种语言都有对应的 API 对象模式规范——但 `JSONAPI`\
  \ 设定了一种任何语言都可以使用的模式，以便前端应用程序不受服务器技术更改的影响。你可以在其网站 [jsonapi.org](http://jsonapi.org/)\
  \ 上了解更多关于 `JSONAPI` 的信息。\n\n在本章中，你还将学习安全问题以及 `serializers`（序列化器），它是适配器流中的翻译层。最后，你将介绍\
  \ `transforms`（转换器），这是将数据强制转换为模型的工具。适配器、序列化器和转换器如图 22.1 所示协同工作。\n\n## 适配器\n\n`Ember`\
  \ 团队根据特定的约定构建了他们的框架。适配器是这些约定中的很大一部分。`JSONAPIAdapter` 将对于源自 `store` 的所有请求与 `REST`\
  \ API 通信。\n\n为了为 Ajax 请求生成特定的 URL，适配器需要 `host` 和 `namespace`。适配器发出 Ajax 请求，并期望 JSON\
  \ 响应具有特定的结构。例如，`JSONAPIAdapter` 期望证人的 `GET` 请求响应看起来如下所示：\n\n```json\n{\n\"links\"\
  : {\n  \"self\": \"http://bnr-tracker-api.herokuapp.com/api/witnesses\"\n},\n\"\
  data\": [\n  {\n    \"id\": \"5556013e89ad2a030066fe0\",\n    \"type\": \"witnesses\"\
  ,\n    \"attributes\": {\n      \"lname\": \"Gandee\",\n      \"fname\": \"Todd\"\
  \n    },\n    \"links\": {\n      \"self\": \"/api/witnesses/5556013e89ad2a030066fe0\"\
  \n    },\n    \"relationships\": {\n      \"sightings\": {\n      \"data\": [],\n\
  \      \"links\": {\n        \"self\": \"/api/witnesses/5556013e89ad2a030066fe0/relationships/sightings\"\
  \n        }\n      }\n    }\n  }\n]\n}\n```\n\n在每个响应中，例如，每个对象的 `type` 预期为所请求的模型名称，以便解析该模型类型的所有记录。此外，`id`\
  \ 预期为每个独立模型对象的主键。\n\n首先生成一个应用程序适配器：\n\n```\nember g adapter application\n```\n\n\
  你的应用程序将向 Big Nerd Ranch Tracker API 发起请求。正如我们提到的，`JSONAPIAdapter` 属性值需要一个主机 URL\
  \ 和一个命名空间，后者在为模型数据发起 Ajax 请求时会被附加在主机 之后。打开 `app/adapters/application.js` 并声明 `host`\
  \ 和 `namespace`。\n\n\n\n\n\n```\nimport JSONAPIAdapter from 'ember-data/adapters/json-api';\n\
  \nexport default DS.JSONAPIAdapter.extend({\n  host: 'https://bnr-tracker-api.herokuapp.com',\n\
  \  namespace: 'api'\n});\n```\n\n与其他 `Ember` 类一样，命名命名模式也适用于适配器（adapters）——并且可以通过创建适配器来定制任何模型的\
  \ API 需求。服务器端数据结构的不规则之处可以包含在单个适配器中，而不是强制所有模型都顺从边缘情况。\n\n你添加到 `app/adapters/application.js`\
  \ 中的内容是针对所有数据请求的全局设置。对于 Tracker 来说，你只需要这些，因为 API 发的所有 JSON 响应都来自同一个主机和命名空间。但如果 `witness`\
  \ 模型需要不同的命名空间或主机，你可以创建一个 `app/adapters/witness.js` 文件，并为 witness 请求配置该特定的适配器。\n\n\
  接下来，你需要通过 `store` 从 API 获取数据。API 已经准备好了 `cryptids` 和 `witnesses` 供使用。\n\n打开 `app/routes/witnesses.js`。删除虚拟数据，并用你在\
  \ 第 21 章 中学习的检索方法调用替换它。\n\n```\n...\n  model(){\n    let witnessRecord = this.store.createRecord('witness',\
  \ {\n      fname: \"Todd\",\n      lname: \"Gandee\",\n      email: \"fake@bignerdranch.com\"\
  \n    });\n    return [witnessRecord];\n    return this.store.findAll('witness');\n\
  \  }\n});\n```\n\n现在，在终端中使用 `ember server` 重新启动你的应用程序，并将浏览器指向 [`localhost:4200/witnesses`](http://localhost:4200/witnesses)\
  \ (图 22.3。\n\n### 图 22.3 Witnesses 列表\n\n![Witnesses listing](img/adapters-findAll-witnesses.png)\n\
  \n与 `Ember` 中的大多数生命周期流一样，适配器拥有许多方法可以将你的数据从 API 传输到 `store` 以及你的路由、控制器和模板中特定适配器的目的（如\
  \ `JSONAPIAdapter`）是为了处理广泛的模式并处理每个模型预期的输入/输出。我们的示例使用了由 `MongoDB` 数据库支持的 `Node.js`\
  \ 服务器，并使用 `json-api` `node` 模块来处理 `JSONAPI` 规范数据的 API 端点。\n\n与遵循特定模式（仅有少量不规则边缘情况）的\
  \ API 工作会让程序员感到愉快。你可能还需要在请求中处理一些额外数据，例如身份验证或请求头。适配器可以自定义以处理任何场景。\n\n`Ember` 之前为其他数据源场景提供了内置适配器，例如\
  \ `localStorage` 和固件数据（fixture data）。这些适配器和其他现在都是插件（addons）。当你的模型数据需要与其他源同步时，可以通过\
  \ `Ember CLI` 添加它们。\n\n如果你发现自己必须拼凑一个适配器，请深入研究文档以寻找答案。一些值得注意的方法和属性有：`ajaxOptions`、`ajaxError`、`handleResponse`\
  \ 和 `headers`。\n\n此时，你的应用正在向服务器发送请求以接收 witnesses 集合。在继续阅读关于内容安全策略、序列化器（serializers）和转换器（transforms）的内容之前，你将使用相同的方法\
  \ `this.store.findAll` 从 API 获取所有 `cryptid` 记录。因为 `cryptids` 没有视图模板，你将使用 `Ember\
  \ Inspector` 检查返回的记录。\n\n将方法调用添加到 `app/routes/cryptids.js`：\n\n```\nimport Ember\
  \ from 'ember';\n\nexport default Ember.Route.extend({\n  model(){\n    return this.store.findAll('cryptid');\n\
  \  }\n});\n```\n\n现在数据已经返回，在浏览器中重新加载应用并导航到 [`localhost:4200/cryptids`](http://localhost:4200/cryptids)。使用\
  \ `Ember Inspector` 检查返回的数据：在 DevTools 中，选择 `Ember` 标签页并点击 `Data`，然后 `cryptid(4)`\
  \ (图 22.4。\n\n### 图 22.4 Cryptid 数据\n\n![Cryptid data](img/adapters-cryptids-findAll.png)\n\
  \n到为止，还没有深入使用 `Ember Inspector` 的需要。在这里使用它是为了展示 `Ember` 如何检索数据并向 `store` 填充模型数据。在调试问题时，追踪路径可能是枯燥的。当你遇到这个问题时，`Ember\
  \ Inspector` 应该是第一个查看的地方。\n\n## 内容安全策略\n\n`Ember` 利用 JavaScript 中一种新的安全层来检测跨源请求。工作标准被称为“内容安全策略”。`Ember\
  \ CLI` 有一个 `contentSecurityPolicy` 对象来添加这些信息。有一个插件可以设置某些默认并将安全策略集成到你的应用中：`ember-cli-content-security-policy`。对于\
  \ Tracker 你不需要它，但了解它是是有好的。\n\n以下是 `contentSecurityPolicy` 对象的示例：\n\n```javascript\n\
  \  ...\n  // config/environment.js\n  ENV.contentSecurityPolicy = {\n    'default-src':\
  \ \"\",\n    'script-src': \"\",\n    'font-src': \"\",\n    'connect-src': \"\"\
  ,\n    'img-src': \"\",\n    'style-src': \"\",\n    'media-src': null\n  }\n  ...\n\
  ```\n\n安全策略的每一行都为每种类型的请求创建了一个白名单（whitelist）——一组安全路径。`default-src` 是一个通用的设置，最初被设置为\
  \ `null` 以强制程序员白名单他们需要的设置。其他设置，如 `script-src` 和 `connect-src`，用于应用程序外部的请求，例如 [`bnr-tracker-api.herokuapp.com`](https://bnr-tracker-api.herokuapp.com)。\n\
  \n更多信息请参阅 MDN 的 *Content Security Policy* 页面以及 `Ember CLI` 插件的 GitHub 仓库。\n\n##\
  \ 序列化器 (Serializers)\n\n当数据输入和输出时，JSON 结构会被序列化和反序列化。适配器使用序列化器从 store 中获取数据，以构建和解析请求/响应数据。\n\
  \n你可以使用 `ember g serializer [application or model name]` 创建序列化器，这将创建一个包含模板代码的序列化器文件，如下：\n\
  \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.JSONAPISerializer.extend({\n\
  });\n```\n\n\n\n\n\n序列化器（serializer）是一个赋值给适配器中 `serializer` 属性的对象。如果应用程序中没有特定的序列化器文件，`Ember`\
  \ 将使用默认适配器和序列化器，即 `JSONAPIAdapter` 和 `JSONAPISerializer`。\n\n当你为应用程序引入新的序列化器时，该序列化器将作为相应\
  \ `app/adapters/application.js` 文件的 `defaultSerializer`。在 `ember g serializer` 中使用模型名称作为命令选项，允许你对特定模型的数据序列化进行自定义定制。\n\
  \n与 `JSONAPIAdapter` 一样，只有当你的 API 不符合 `JSONAPI` 规范或你有特殊的边缘情况时，才应该更改配置。如果你在自己的项目中需要对请求或响应数据进行更改，这里是一些可以在\
  \ `Ember Data` 文档中研究的方法方法：`keyForAttribute`、`keyForRelationship`、`modelNameFromPayloadKey`\
  \ 和 `serialize`。\n\n`keyForAttribute` 是一个将模型属性名称转换为发送到请求中的键名的方法。该方法接受三个参数：`key`、`typeClass`\
  \ 和 `method`。对于 `JSONAPISerializer`，此方法返回经过短横线化（dasherized）的 `key`，这意味着键名中的任何下划线或驼峰命名都将转换为短横线。例如，如果模型有一个属性\
  \ `first_name`，则请求对象将有一个键 `first-name`。如果你的 API 期望 `first_name`，你需要修改你的 `keyForAttribute`\
  \ 方法来解决命名问题。\n\n`keyForRelationship` 遵循相同的过程，仅针对关系键。如果你的模型名称包含下划线，那么当你通过 `belongsTo`\
  \ 或 `hasMany` 关系链接模型时，你将为 `JSONAPISerializer` 编辑此方法。某些 API 期望为这些关系添加 `_id` 或 `_ids`\
  \ 后缀。这就是进行该更改的方法。\n\n你为 Tracker 使用的 `bnr-tracker-api` 使用了带有短横线的适当 `JSONAPI` 键名，例如\
  \ `cryptid-type`。你不需要在你的应用中添加序列化器。不过，为了说明起，这里有一个使用 `Ember` 工具方法 `Ember.String.underscore`\
  \ 来更改输入和输出 JSON 数据属性键的示例。\n\n```javascript\nimport Ember from 'ember';\nimport DS\
  \ from 'ember-data';\nvar underscore = Ember.String.underscore;\nexport default\
  \ DS.JSONAPISerializer.extend({\n  keyForAttribute(attr) {\n    return underscore(attr);\n\
  \  },\n  keyForRelationship(rawKey) {\n    return underscore(rawKey);\n  }\n});\n\
  ```\n\n`Ember` 在 `Ember.String` 对象上提供了许多字符串处理方法。`Ember.String.underscore` 将带有短横线或驼峰的字符串转换为使用下划线分隔单词。\n\
  \n序列化方法在数据请求的生命周期期间调用，例如 `this.store.findAll('witness')`。检查数据请求回调流的一种方法是在此代码中添加\
  \ `debugger` 语句，以查看进入和离开方法的内容是什么。\n\n这里是一个示例：\n\n```javascript\nimport Ember from\
  \ 'ember';\nimport DS from 'ember-data';\n\nvar underscore = Ember.String.underscore;\n\
  \nexport default DS.JSONAPISerializer.extend({\n  keyForAttribute(attr) {\n    let\
  \ returnValue = underscore(rawKey);\n    debugger;\n    return returnValue;\n  \
  \  return underscore(rawKey);\n  },\n  keyForRelationship(rawKey) {\n    return\
  \ underscore(rawKey);\n  }\n});\n```\n\n在与新 API 工作时，这种调试风格非常有用。你可以访问 `Ember.String`\
  \ 对象，以便在需要操作 `attr` 参数来序列化你的键名。幸运的是，`Ember` 和 `Ember` 社区为许多 API 模式构建了适配器和序列化器。\n\
  \n## 转换 (Transforms)\n\n`Ember Data` 赋予你转换来自 API 数据以适应应用程序需求的能力。你已经在 [第 21 章] 中看到\
  \ `Ember Data` 拥有内置的转换——方法 `DS.attr('string')`、`DS.attr('boolean')`、`DS.attr('number')`\
  \ 和 `DS.attr('date')`。\n\n当你向应用程序添加转换时，可以带上目标属性类型调用 `DS.attr`。转换类似于 JavaScript 的类型转换——它们接收一个值并返回指定类型的值。\n\
  \n这是一个基础的 `DS.attr('object')` 转换示例：\n\n```javascript\nexport default DS.Transform.extend({\n\
  \  deserialize(value) {\n    if (!Ember.isObject(value)) {\n      return {};\n \
  \   } else {\n      return value;\n    }\n  },\n  serialize(value) {\n    if (!Ember.isObject(value))\
  \ {\n      return {};\n    } else {\n      return value;\n    }\n  }\n});\n```\n\
  \n该转换有两个方法：`deserialize` 和 `serialize`。第一个 `deserialize` 测试传入的数据是否为对象并返回它。否则，它返回一个空对象。第二个\
  \ `serialize` 如果输出数据是对象则返回该数据，否则返回一个空对象。转换保证了从 API 返回和发送到 API 的数据都是模型定义的类型。\n\n\
  ## 给更有好奇心的人：Ember CLI Mirage\n\n前端应用开发中最常见的障碍之一是 API。可能会出现许多问题：API 可能尚未创建，API 可能正在开发中，或者在你开发时\
  \ API 可能会位于防火墙之后。\n\n解决无法访问 API 的简单方案是使用静态文本或模拟数据。但这种方案可能会引入许多其他问题，例如为了无法访问的数据更改应用程序逻辑、更改对\
  \ `this.store` 的请求，或者更改适配器或序列化器。\n\n`Ember CLI Mirage` 是一个代理请求到特定 API 路由的插件。你可以设置模型来建立关系，设置工厂来填充数据，创建特定响应的模拟数据，并定义\
  \ CRUD 路由来拦截特定的 API 请求。一旦设置完成，你就可以认为 API 已存在并开发。\n\n当 `Mirage` 启用时，所有请求都将重定向到本地的\
  \ `Mirage` 配置。\n\n出版时，`ember-cli-mirage` 版本为 `0.2.0-beta.8`。稍后将作为挑战的一部分探索 `Mirage`。要了解更多关于\
  \ `Ember CLI Mirage` 的信息，请访问 [www.ember-cli-mirage.com](http://www.ember-cli-mirage.com/)。\n\
  \n\n\n\n在下一章中，你将整合最后三章的概念，并创建一个可以路由请求并显示数据的运行应用程序。在第 24 章中，你将创建、编辑和删除内容。当你可以在模型上调用\
  \ `save` 和 `destroyRecord` 且数据无需费力就能发送到 API 时，你将看到 `Ember Data`、适配器和序列器的强大之处。\n\n\
  ## 白银挑战：内容安全\n\n在应用程序中添加安全层始终是非常重要的。如上所述，现在有一个新的内容安全策略（Content Security Policy）浏览器\
  \ API，`Ember` 有一个环境对象来处理配置应用程序的白名单策略。安装该插件并根据控制台错误确保你的应用程序外部请求端点已添加到策略中。\n\n## 黄金挑战：Mirage\n\
  \n`Ember CLI Mirage` 是你开发工具箱的极佳补充。它允许你在后端团队完成技术栈之前，开发应用程序的 API 需求。\n\n从终端安装 `ember-cli-mirage`\
  \ 开始使用它：\n\n```\nember install ember-cli-mirage\n```\n\n接下来，要开启或关闭 `Mirage`，向 `config/environment.js`\
  \ 中添加一个环境变量：\n\n```\nif (environment === 'development') {\n  // ENV.APP.LOG_RESOLVER\
  \ = true;\n  // ENV.APP.LOG_ACTIVE_GENERATION = true;\n  // ENV.APP.LOG_TRANSITIONS\
  \ = true;\n  // ENV.APP.LOG_TRANSITIONS_INTERNAL = true;\n  // ENV.APP.LOG_VIEW_LOOKUPS\
  \ = true;\n  ENV['ember-cli-mirage'] = {\n    enabled: true\n  }\n}\n```\n\n最后，以\
  \ `factories` 的形式为 witness 和 cryptid 端点添加伪数据。\n\n为了操作你的 Tracker 应用程序，你可以从 `Tracker/Data_Chapter/mirage-example`\
  \ 中提供的示例资源获取配置好的 `app/mirage` 目录。我们将保持示例与插件的当前版本同步。\n\n# 23 视图与模板\n\nMVC 中的 V 代表\
  \ `views`（视图）。在 Tracker 中，视图将是模板。模板通过 JavaScript 处理以创建 HTML 元素。这允许你更改 DOM 而无需向服务器发送新请求。\n\
  \n在本章中，你将创建模板文件，并在路由的 `model` 钩中添加检索的数据。`Ember` 内置的模板语言和辅助函数将允许你在常规 HTML 语法之外以极少的精力创建模板。\n\
  \n在本章结束时，你将创建出类似图 23.1 所示的列表。\n\n**图 23.1 目击列表**\n\n![目击列表](img/templates-sighting-end.png)\n\
  \n## Handlebars\n\n你将使用 `Handlebars`，这是一种创建动态模板的强大语言。它类似于 `PHP`、`JSP`、`ASP` 和 `ERB`\
  \ 等服务端模板语言。它包含了 HTML 标签和处理数据对象的分隔符。\n\n在 `Handlebars` 中，分隔符是双大括号，例如 `{{}}`。在“双大括号”内部，你可以渲染数据字符串并使用辅助方法执行有限的逻辑。你已经见过两个这样的辅助方法了：`{{outlet}}`\
  \ 和 `{{#each}}`。\n\n`Ember` 对 `Handlebars` 的实现最近过渡到了一种新机制，昵称为“HTMLBars”。本章中语言的一些细节来自\
  \ HTMLBars，但也适用于旧版本的 `Ember`（至少追溯到版本 1.13.x）。\n\n## Models\n\n在 `Ember` 中，模板始终由模型支持。这意味着当模板被渲染为\
  \ HTML 字符串并附加到 DOM 时，一个对象（或对象数组）将作为参数传递。\n\n模型对象可以具有字符串、数组或其他对象的属性。当使用 `Ember` 和\
  \ `Handlebars` 编写模板时，你通过双大括号访问此对象。\n\n当你想要显示模型属性的值时，你编写 `{{model.name}}`，其中 `name`\
  \ 是 `model` 对象上的一个属性。这种点语法读起来很熟悉，但不要被误认为任何 JavaScript 代码都可以放在大括号内。\n\n## Helpers（辅助函数）\n\
  \n`Handlebars` 模板是由 JavaScript 函数进行插值的字符串。当函数遇到双大括号时，它会尝试使用对象属性解析分隔符的实例，或调用嵌套函数来返回字符串。这些嵌套函数被称为\
  \ `helpers`，并在应用程序中创建。`Handlebars` 库内置了一些辅助函数，`Ember` 也添加了一些它自己的。\n\n辅助函数可以有两种形式。第一种是内联辅助函数，使用语法\
  \ `{{[helper name] [arguments]}}`。参数可以包含选项的哈希（hash），例如：\n\n```\n{{input type=\"\
  text\" value=firstName disabled=entryNotAllowed size=\"50\"}}\n```\n\n更复杂的辅助函数使用块语法：\n\
  \n```\n{{#[helper name] [arguments]}}\n  [block content]\n{{/[helper name]}}\n```\n\
  \n例如，如果你只想对尚未登录的用户显示登录链接，你可以使用类似下面的块结构：\n\n```\n{{#if notSignedIn}}\n  <a href=\"\
  /\">登录 In</a>\n{{/if}}\n```\n\n对于块辅助函数，内容可以传递给块以通过动态段增强输出。`Handlebars` 内置的条件判断（在下一节中描述）就是块辅助函数。\n\
  \n你将使用辅助函数来渲染 sightings 和 cryptids 的模板部分，以及 `NavBar`。\n\n### 条件判断\n\n条件语句允许你在 `Handlebars`\
  \ 模板中引入基本的控制流。它们的语法如下：\n\n```\n{{#if argument}}\n  [render block content]\n{{else}}\n\
  \  [render other content]\n{{/if}}\n```\n\n或者，也可以是：\n\n```\n{{#unless argument}}\n\
  \  [render block content]\n{{/unless}}\n```\n\n条件语句接受一个解析为真（truthy）或假（falsy）值的参数。（这些不是笔误。`truthy`\
  \ 值在布尔上下文中为真。所有值均为真，除了定义为 `falsy` 的值：`false`、`0`、`\"\"`、`null`、`undefined` 和 `NaN`。）\n\
  \n开始工作吧。打开 `app/templates/sightings/index.hbs` 并添加条件语句，使目击记录显示位置，或者如果没有位置数据，则显示关于缺失数据的礼婉警告。\n\
  \n```\n<div class=\"panel panel-default\">\n  <ul class=\"list-group\">\n    {{#each\
  \ model as |sighting|}}\n      <li class=\"list-group-item\">\n        {{sighting.location}}\
  \ - {{sighting.sightedAt}}\n      </li>\n    {{/each}}\n  </ul>\n</div>\n<div class=\"\
  row\">\n  {{#each model as |sighting|}}\n    <div class=\"col-xs-12 col-sm-3 text-center\"\
  >\n      <div class=\"media well\">\n        <div class=\"caption\">\n         \
  \ {{#if sighting.location}}\n            <h3>{{sighting.location}} - {{sighting.sightedAt}}</h3>\n\
  \          {{else}}\n            <h3 class=\"text-danger\">Bogus Sighting</h3>\n\
  \          {{/if}}\n        </div>\n      </div>\n    </div>\n  {{/each}}\n</div>\n\
  ```\n\n\n\n\n你更改了观测模板（sightings template）的 DOM 结构，开始使用 `<samp class=\"application\"\
  >Bootstrap</samp>` 的 `<samp class=\"firstterm\">wells</samp>` 样式，以样式化元素的格式输出观测信息。`{{#if}}`\
  \ 和 `{{else}}` 的使用允许你在观测位置未添加时渲染不同的 HTML。\n\n现在，你需要更改从路由发送到模板的数据，以查看你新编写的条件判断的结果。在\
  \ `app/routes/sightings.js` 的观测路由模型中，将其中一个观测的 `location` 属性设置为空字符串。\n\n```\n...\n\
  \  model(){\n    ...\n    let record3 = this.store.createRecord('sighting', {\n\
  \      location: 'Asilomar',\n      sightedAt: new Date('2016-03-21')\n    });\n\
  \n    return [record1, record2, record3];\n  }\n});\n```\n\n启动你的服务器并将浏览器指向 `http://localhost:4200/sightings`\
  \ 以查看新的观测列表（图 23.2）。\n\n图 23.2  虚假观测\n\n![虚假观测](img/templates-sightings-if-bogus.png)\n\
  \n条件语句对最后一个观测实例的空字符串评估了真值（truthy value）。因此，模板渲染了带有“Bogus Sighting”（虚假观测）文本的区块。\n\
  \n### 使用 {{#each}} 循环\n\n你已经在索引模板中使用过 `{{#each}}` 块辅助函数。该助手会将数组中的每个对象渲染为块中内容的实例。`{{#each}}`\
  \ 的参数是包含在块参数中的 `|instance|` 的 `array`。只有当传递给 `{{#each}}` 的参数是一个至少包含元素的数组时，该块才会渲染。\n\
  \n与 `{{#if}}` 块辅助函数类似，该助手支持 `{{else}}` 块，当数组参数为空时将渲染该块。\n\n在 `app/templates/cryptids.hbs`\
  \ 中使用 `{{#each}} {{else}} {{/each}}` 创建所有记录的神秘生物（cryptids）列表——或者如果没有，则显示“No Creatures”（没有生物）文本：\n\
  \n```\n{{outlet}}\n<div class=\"row\">\n  {{#each model as |cryptid|}}\n    <div\
  \ class=\"col-xs-12 col-sm-3 text-center\">\n      <div class=\"media well\">\n\
  \        <div class=\"caption\">\n          <h3>{{cryptid.name}}</h3>\n        </div>\n\
  \      </div>\n    </div>\n  {{else}}\n    <div class=\"jumbotron\">\n      <h1>No\
  \ Creatures</h1>\n    </div>\n  {{/each}}\n</div>\n```\n\n与观测（sightings）类似，你正在样式化的\
  \ wells 中列出神秘生物。`{{else}}` 块允许你在所列出的数组没有项目时，在模板中包含一个条件。你的应用可以为这个空模型数组的条件渲染一个不同的元素。\n\
  \n导航到 `http://localhost:4200/cryptids` 查看你新的神秘生物列表（图 23.3）。\n\n图 23.3  神秘生物列表\n\n\
  ![神秘生物列表](img/templates-cryptids-listing-full.png)\n\n现在，在 `app/routes/cryptids.js`\
  \ 中通过注释掉 `return` 语句来移除 `model` 回调，以执行你条件的 `else` 部分。\n\n```\n...\n  model(){\n\
  \    // return this.store.findAll('cryptid');\n  }\n});\n```\n\n重新加载 `http://localhost:4200/cryptids`。你的神秘生物列表现在是空的（图\
  \ 23.4）。\n\n图 23.4  空的神秘生物列表\n\n![空的神秘生物列表](img/templates-cryptids-listing-empty.png)\n\
  \n通过 `{{each}} {{else}} {{/each}}`，你可以根据数据的存在创建条件视图，逻辑非常简单。现在你已经看到了（并测试了）条件迭代器的魅力，请将\
  \ `app/routes/cryptids.js` 恢复到之前的状态：\n\n```\n...\n  model(){\n    // return this.store.findAll('cryptid');\n\
  \  }\n});\n```\n\n### 绑定元素属性\n\n元素属性值可以从控制器属性渲染，就像元素内容在 DOM 元素标签之间渲染一样。在早版本的 `<samp\
  \ class=\"application\">Ember</samp>` 中，曾有一个名为 `{{bind-attr}}` 的助手用于绑定属性。现在，感谢 HTMLBars，你只需要使用\
  \ `{{}}` 将属性绑定到属性上即可。\n\n属性绑定对于 `class` 和 `src` 等元素属性非常常见。你的神秘生物数据中有一个图像路径，因此你可以动态地将它们的\
  \ `src` 属性绑定到 `model` 属性。\n\n在 `app/templates/cryptids.hbs` 的神秘生物列表中添加一张图片：\n\n\
  ```\n<div class=\"row\">\n  {{#each model as |cryptid|}}\n    <div class=\"col-xs-12\
  \ col-sm-3 text-center\">\n      <div class=\"media well\">\n        <img class=\"\
  media-object thumbnail\" src=\"{{cryptid.profileImg}}\"\n          alt=\"{{cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        <div class=\"caption\">\n          <h3>{{cryptid.name}}</h3>\n\
  \        </div>\n      </div></div>\n    </div>\n  {{else}}\n    <div class=\"jumbotron\"\
  >\n      <h1>No Creatures</h1>\n    </div>\n  {{/each}}\n</div>\n```\n\n\n\n现在重新加载\
  \ [<samp class=\"uri\">http://localhost:4200/cryptids</samp>](http://localhost:4200/cryptids)\
  \ 并查看你的新图片（图 23.5）。\n\n### 图 23.5 带有图片的神秘生物列表\n\n**图 23.5 带有图片的神秘生物列表**\n\n![带有图片的神秘生物列表](img/templates-cryptids-if-img.png)\n\
  \n## 链接\n\n正如第 20 章讨论的，路由是浏览器应用程序特有的。`Ember` 监听事件钩子来管理应用程序中的路由。因此，你应该使用 `{{#link-to}}`\
  \ 块辅助器创建链接。该辅助器接受路由（用字符串表示）作为第一个参数来创建一个锚元素。例如，`{{#link-to 'index'}}首页{{/link-to}}`\
  \ 会创建一个指向根索引页的链接。\n\n为了查看它是如何工作的，你将使用 `{{#link-to}}` 辅助器更新你的主导航链接。\n\n从 `<samp class=\"\
  filename\">app/templates/application.hbs</samp>` 开始。将 `NavBar` 的测试链接替换为指向你的观测、神秘生物和见证人的链接：\n\
  \n```\n...\n      <div class=\"collapse navbar-collapse\" id=\"top-navbar-collapse\"\
  >\n        <ul class=\"nav navbar-nav\">\n          <li>\n            <a href=\"\
  #\">Test Link</a>\n          </li>\n          <li>\n            <a href=\"#\">Test\
  \ Link</a>\n          </li>\n          <li>\n            {{#link-to 'sightings'}}观测{{/link-to}}\n\
  \          </li>\n          <li>\n            {{#link-to 'cryptids'}}神秘生物{{/link-to}}\n\
  \          </li>\n          <li>\n            {{#link-to 'witnesses'}}见证人{{/link-to}}\n\
  \          </li>\n        </ul>\n      </div><!-- /.navbar-collapse -->\n```\n\n\
  现在你已经有了通往列表页的链接，重新加载你的应用并测试它们。点击尝试。点击后退键。你拥有了一个可以运行的 Web 应用！花点时间庆祝一下。\n\n你的下一个任务是让神秘生物页面上的图片链接到每个生物的独立页面。要实现这一点，你将利用\
  \ `{{#link-to}}` 辅助器可以接受多个参数来定制链接的特性。在 `<samp class=\"filename\">app/templates/cryptids.hbs</samp>`\
  \ 中，使用 `cryptid.id` 作为第二个参数，用 `<<img>` 标签包裹指向特定神秘生物的链接：\n\n```\n...\n    <div class=\"\
  media well\">\n      {{#link-to 'cryptid' cryptid.id}}\n        <img class=\"media-object\
  \ thumbnail\"\n        src=\"{{if cryptid.profileImg cryptid.profileImg\n      \
  \  'assets/images/cryptids/blank_th.png'}}\"\n        alt=\"{{cryptid.name}}\" width=\"\
  100%\" height=\"100%\">\n      {{/link-to}}\n      <div class=\"caption\">\n   \
  \     <h3>{{cryptid.name}}</h3>\n      </div>\n    </div>\n...\n```\n\n现在你已经有了指向\
  \ `cryptid` 路由的链接，并且锚点路径为 `<samp class=\"uri\">cryptids/[cryptid_id]</samp>`，你需要编辑\
  \ `<samp class=\"filename\">router.js</samp>`，让 `CryptidRoute` 知道要等待动态值。\n\n```\n\
  ...\nRouter.map(function() {\n  this.route('sightings', function() {\n    this.route('new');\n\
  \  });\n  this.route('sighting', function() {\n    this.route('edit');\n  });\n\
  \  this.route('cryptids');\n  this.route('cryptid', {path: 'cryptids/:cryptid_id'});\n\
  \  this.route('witnesses');\n  this.route('witness');\n});\n...\n```\n\n尝试一下。点击其中一个神秘生物图片后，你应该看到一个空白页面。这是正确的。你的应用正在将你导向\
  \ `CryptidRoute`，它正在渲染单数的 `<samp class=\"filename\">app/templates/cryptid.hbs</samp>`。该文件目前是空的。\n\
  \n如果你点击了独角兽 Charlie 的图片，可能会得到一个错误。回他的记录是在 `<samp class=\"methodname\">beforeModel</samp>`\
  \ 钩子中创建的，并且没有 `id`。这意味着它尝试传递给 `{{#link-to}}` 辅助器的值 `null`。\n\n现在是移除该 `<samp class=\"\
  methodname\">beforeModel</samp>` 钩子的时候了。创建应该留给创建新神秘生物的页面，我们将在第 24 章中介绍。\n\n从 `<samp\
  \ class=\"filename\">app/routes/cryptids.js</samp>` 中移除该钩子。\n\n```\n...\n  beforeModel(){\n\
  \    this.store.createRecord('cryptid', {\n      \"name\": \"Charlie\",\n      \"\
  cryptidType\": \"unicorn\"\n    });\n  },\n  model(){\n    return this.store.findAll('cryptid');\n\
  \  }\n...\n```\n\n接下来，在 `<samp class=\"filename\">app/routes/cryptid.js</samp>`\
  \ 中添加 `moment` 库。\n\n```javascript\nimport Ember from 'ember';\n\nexport default\
  \ Ember.Route.extend({\n  model(params) {\n    return this.store.findRecord('cryptid',\
  \ params.cryptid_id);\n  }\n});\n```\n\n现在，在 `<samp class=\"filename\">app/templates/cryptid.hbs</samp>`\
  \ 模板中使用 `model.profileImg`：\n\n```\n{{outlet}}\n<div class=\"container\">\n  <img\
  \ class=\"rounded\" src=\"{{model.profileImg}}\" alt=\"{{model.name}}\">\n  <h3>{{model.name}}</h3>\n\
  </div>\n```\n\n`sightedAt` 日期属性显示为一个难看的日期字符串。为了更漂亮地格式化日期，你将使用示例中提到的 `moment` 库。\n\
  \n在浏览器中，使用 `NavBar` 然后点击其中一个神秘生物图片（[图 23.5 带有图片的神秘生物列表]）。\n\n**图 23.5 带有图片的神秘生物列表**\n\
  \n![带有图片的神秘生物列表](img/templates-cryptids-if-img.png)\n\n`Ember` 自带辅助器，但你并不限于内置辅助器。\n\
  \n## 自定义辅助器\n\n`sightedAt` 日期属性显示为一个难看的日期字符串。为了更漂亮地格式化日期，你将使用示例中提到的 `moment` 库。\n\
  \n在终端中添加 `moment`：\n\n```\nbower install moment --save\n```\n\n然后，在 `<samp class=\"\
  filename\">ember-cli-build.js</samp>` 中使用 `app.import` 将 `moment` 添加到资源中：\n\n```\n\
  ...\n  // 将资源添加到应用\n  app.import(bootstrapPath + 'javascripts/bootstrap.js');\n\
  \  app.import('bower_components/moment/moment.js');\n\n  return app.toTree();\n\
  };\n```\n\n服务器配置需要重启，因此在更改 `<samp class=\"filename\">ember-cli-build.js</samp>`\
  \ 后，停止 Ember 服务器（Control+C）并重新启动（`ember server`）。\n\n现在从终端生成辅助器模块：\n\n```\nember\
  \ g helper moment-from\n```\n\n从这里开始，你创建一个返回字符串的函数。该函数接受日期作为参数并使用 `moment.js` 库处理日期。你把日期包裹在\
  \ HTML `<span>` 标签中，并对元素应用 Bootstrap 文本类。\n\n打开生成的文件 `<samp class=\"filename\">app/helpers/moment-from.js</samp>`，创建此新函数：\n\
  \n```javascript\nimport Ember from 'ember';\n\nexport function momentFrom(params/*,\
  \ hash*/) {\n  return params;\n}\nexport function momentFrom(params) {\n  var time\
  \ = window.moment(...params);\n  var formatted = time.fromNow();\n  return new Ember.Handlebars.SafeString(\n\
  \    '<span class=\"text-primary\">'\n    + formatted + '</span>'\n  );\n}\n\nexport\
  \ default Ember.Helper.helper(momentFrom);\n```\n\n现在你已经创建了辅助器，在你的 `<samp class=\"\
  filename\">app/templates/sightings/index.hbs</samp>` 模板中使用它：\n\n\n\n\n\n```\n...\n\
  \          {{#if sighting.location}}\n            <h3>{{sighting.location}} - {{sighting.sightedAt}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n...\n\
  ```\n\n`moment-from` 助手函数接受单个参数并返回格式化为 HTML 字符串的日期。当你使用自定义助手来渲染 HTML 元素时，`Ember`\
  \  `Ember.Handlebars.SafeString` 方法来输出干净的标记。\n\n查看你新格式化后的日期（图 23.7）。\n\n**图 23.7\
  \ 观测 `moment.js` 日期**\n\n![Sightings moment.js date](img/templates-sighting-moment-date.png)\n\
  \n`moment.js` 库获取日期对象并将其格式化为类似“2 个月前”的内容。这看起来比“Tue Feb 9 2016 19:00:00 GMT-0500\
  \ (EST)”好得多！（`moment.js` 中有很多格式化日期的选项——访问 [momentjs.com](http://momentjs.com) 了解更多信息。）\n\
  \n通过创建一个输出特定文本的助手，你可以从模板中移除一些逻辑。自定义助手允许你减少重复并集中处理 UI 格式。这是将代码抽象为 `Ember Components`\
  \ 的第一步，你将在第 25 章中学习相关内容。\n\n在本章中，你学习了如何显示基础模型属性并使用条件判断和循环自定义模板。你将 HTML 元素属性绑定到属性，并创建了带有动态属性的新路由，以加载单个记录作为模板的模型支持。最后，你使用了助手进行页面链接，并通过构建自己的日期格式化助手，完善了对助手的理解。\n\
  \n在下一章中，你将通过控制器创建和编辑数据来完成应用程序生命周期。你将学习操作、从数据存储中检索多个集合以及创建装饰器。\n\n## 铜级挑战：添加链接悬停效果\n\
  \n你创建的链接需要一些悬停内容。要实现这一点，请为你的 `{{#link-to}}` 助手添加 `title` 属性。标题应该是观测到的神秘生物（cryptid）名称。\n\
  \n## 银级挑战：更改日期格式\n\n`{{moment-from}}` 助手让日期不再那么笨拙，但现在提供的信息还不充分。查看 `moment` 文档并更改助手的输出，将日期格式化为“2016\
  \ 年 5 月 31 日”。\n\n## 金级挑战：创建一个自定义缩略图助手\n\n神秘生物缩略图的标记似乎有点长。创建一个自定义助手，通过将图像路径传递给助手来显示缩略图。在所有神秘生物图像的地方使用该助手来清理代码。\n\
  \n# 24 控制器\n\n控制器是 MVC 模式的最后一部分。正如你在第 19 章中学习到的，控制器持有应用程序逻辑，检索模型实例并将其传递给视图，同时包含更改模型实例的处理器函数。\n\
  \n你在本章中构建的控制器不会是特别大的代码块。这就是 MVC 的设计思想：将应用程序的复杂性分配到它应该所在的地方。管理数据是模型的工作，处理 UI 是视图的职责。控制器只需要，嗯，`控制`\
  \ 模型和视图。\n\n在你不知情的情况下，`Ember` 在应用程序运行时一直在向你的应用中添加控制器对象。控制器是路由对象和模板之间的代理，负责传递模型。当你没有添加控制器对象时，`Ember`\
  \ 知道模型数据已足够传递给模板，它会为你完成这一点。\n\n在 `Ember` 中创建控制器允许你定义在路由激活时监听的事件或操作。它还允许你定义装饰器属性，以增强你想显示的模型数据，而不必将其持久化。\n\
  \nTracker 应用程序的目标之一是让用户能够创建新的观测记录。为了实现这个目标，你需要创建一个路由、一个控制器、控制器属性和控制器操作。\n\n你已经创建了新的观测路由\
  \ `app/routes/sightings/new.js`。对于此页面，你将创建一个新的观测记录，并加载神秘生物和见证人的集合。每个新观测都需要属于某个神秘生物并拥有一个或多个见证人的关系。你将创建的表单看起来图\
  \ 24.1。\n\n**图 24.1 Tracker 的新观测表单**\n\n![Tracker’s New Sighting form](img/ember-controller-new-template.png)\n\
  \n当你设置好这一切后，将创建一个控制器来管理来自新观测表单的事件。你还将扩展工作，允许对现有的观测进行编辑。\n\n## 新观测\n\n你设置的 `SightingsRoute`\
  \ 返回所有观测。对于新观测，你将返回一个新的空对象。为了做到，你将返回 `Ember.RSVP.hash`。\n\n让我们开始吧。打开 `app/routes/sightings/new.js`\
  \ 并添加一个 model 钩子，以 `Ember.RSVP.hash` 返回 `Promise` 集合：\n\n```javascript\nexport default\
  \ Ember.Route.extend({\n  model() {\n    return Ember.RSVP.hash({\n      sighting:\
  \ this.store.createRecord('sighting')\n    });\n  }\n});\n```\n\n当该路由激活时，会返回一个新的观测记录。如果你返回\
  \ `sightings`，你将看到一个空条目，因为你创建了一个新记录。你将在本章末尾处理“脏记录”（已更改但未保存的模型数据）。现在，请记住 `createRecord`\
  \ 已将新观测添加到本地集合中。\n\n在创建新观测时，你需要神秘生物和见证人的列表。在这里，使用 `Ember.RSVP.hash` 表示你返回的是一个 `Promise`\
  \ 哈希值。唯一的键是 `sighting`，这意味着你模板中的 `model` 引用需要对 `model.sighting` 进行查找，以引用你创建的记录。\n\
  \n在此哈希中添加神秘生物和见证人的检索方法（不要忘记 `this.store.createRecord('sighting')` 之后的逗号）。\n\n```javascript\n\
  ...\nexport default Ember.Route.extend({\n  model() {\n    return Ember.RSVP.hash({\n\
  \      sighting: this.store.createRecord('sighting'),\n      cryptids: this.store.findAll('cryptid'),\n\
  \      witnesses: this.store.findAll('witness')\n    });\n  }\n}\n```\n\n接下来，你将在新观测模板中使用\
  \ `<select>` 标签来向用户展示神秘生物和见证人的列表。但在使用新模型数据设置模板之前，你需要一个 `Ember CLI` 插件，以便方便地配合绑定属性使用\
  \ `<select>` 标签。\n\n从命令行安装 `emberx-select`：\n\n```bash\nember install emberx-select\n\
  ```\n\n你将在模板中使用此组件，通常称为 `x-select`。这可以避免你为每个 `<select>` 标签编写 `onchange` 操作。\n\n\
  在使用 `emberx-select` 组件之前，请重启 `ember server`。\n\n\n\n\n所有模型数据设置完成后，你现在可以编辑模板 `app/templates/sightings/new.hbs`\
  \ 来创建新的目击表单：\n\n```\n<h1>New Route</h1>\n<h1>New Sighting</h1>\n<form>\n  <div class=\"\
  form-group\">\n    <label for=\"name\">Cryptid</label>\n    {{#x-select value=model.sighting.cryptid\
  \ class=\"form-control\"}}\n      {{#x-option}}Select Cryptid{{/x-option}}\n   \
  \   {{#each model.cryptids as |cryptid|}}\n        {{#x-option value=cryptid}}{{cryptid.name}}{{/x-option}}\n\
  \      {{/each}}\n    {{/x-select}}\n  </div>\n  <div class=\"form-group\">\n  \
  \  <label>Witnesses</label>\n    {{#x-select value=model.sighting.witnesses multiple=true\
  \ class=\"form-control\"}}\n      {{#x-option}}Select Witnesses{{/x-option}}\n \
  \     {{#each model.witnesses as |witness|}}\n        {{#x-option value=witness}}{{witness.fullName}}{{/x-option}}\n\
  \      {{/each}}\n    {{/x-select}}\n  </div>\n  <div class=\"form-group\">\n  \
  \  <label for=\"location\">Location</label> {{input value=model.sighting.location\n\
  \      type=\"text\" class=\"form-control\" name=\"location\" required=true}}\n\
  \  </div>\n</form>\n```\n\n哇！这包含了你一直以来工作——而且更多。路由使用了新的 `Ember.RSVP` 方法，模板使用了助手（helpers），并且使用了新的\
  \ `{{x-select}}` 和 `{{x-option}}` 组件。\n\n`{{x-select}}` 组件的设计用于使用 `<select>` 元素为属性赋值。它的设计工作方式就像在\
  \ `Ember` 数据绑定环境中的 `<select>` 元素一样。你将 `value` 赋值给击 sightings 模型的 `cryptid` 属性，当选择新选项时，该组件将处理\
  \ `onchange` 事件。这是因为 `cryptid` 属性需要一个 cryptid 模型记录作为其值。\n\n对于目击者（witnesses），有一个额外的属性\
  \ `multiple=true`，它允许你的用户为一次目击选择多个目击者。多次选择将转换为 `hasMany` 目击者的集合。\n\n在继续后续之前，你需要在目击路由的模板中添加一个链接，这样你就有办法进入\
  \ `sightings.new` 路由了。打开 `app/templates/sightings.hbs` 并处理该操作。\n\n```\n<h1>Sightings</h1>\n\
  <div class=\"row\">\n  <div class=\"col-xs-6\">\n    <h1>Sightings</h1>\n  </div>\n\
  \  <div class=\"col-xs-6 h1\">\n    {{#link-to \"sightings.new\" class=\"pull-right\
  \ btn btn-primary\"}}\n      New Sighting\n    {{/link-to}}\n  </div>\n</div>\n\
  {{outlet}}\n```\n\n你的链接利用了 `Bootstrap` 格式的简单性来创建一个按钮。加载 [`http://localhost:4200/sightings`](http://localhost:4200/sightings)\
  \ 来查看它（图 24.2）。\n\n**图 24.2 新目击按钮**\n\n![New Sighting button](img/ember-controller-new-button.png)\n\
  \n现在你已经拥有了导航到 `sightings.new` 路由的能力。新按钮允许从目击路由树结构中的任何地方创建新的目击。\n\n此外，请注意，当你处于 `sightings.new`\
  \ 路由时，该按钮处于激活状态。`Ember` 考虑了一切，即使当前路由就是链接的路由，也会为链接提供一个激活类（active class）。在按钮或链接上的激活状态以\
  \ UI 线索的形式表示当前路由。\n\n动作（Actions）是处理表单事件或其他应用程序中任何其他事件的关键。`actions` 属性是一个哈希，你在其中将函数赋值给键。这些键将在模板中触发回调。\n\
  \n你准备好为 `sightings.new` 路由创建控制器了，使用此终端命令：\n\n```bash\nember g controller sightings/new\n\
  ```\n\n`Ember` 创建了 `app/controllers/sightings/new.js` 文件。打开它并添加创建目击所需的 `create`\
  \ 和 `cancel` 动作：\n\n```javascript\nimport Ember from 'ember';\n\nexport default\
  \ Ember.Controller.extend({\n  actions: {\n    create() {\n    },\n    cancel()\
  \ {\n    }\n  }\n});\n```\n\n在创建表单元素时，`action` 属性通常有一个提交表单的 URL。在 `Ember` 中，表单元素只需要函数的名称。\n\
  \n\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
  \  model() {\n    let record1 = this.store.createRecord('sighting', {\n      location:\
  \ 'Atlanta',\n      sightedAt: new Date('2016-02-09')\n    });\n    record1.set('location',\
  \ 'Paris, France');\n    console.log(\"Record 1 location: \" + record1.get('location'));\n\
  \n    let record2 = this.store.createRecord('sighting', {\n      location: 'Calloway',\n\
  \      sightedAt: new Date('2016-03-14')\n    });\n\n    let record3 = this.store.createRecord('sighting',\
  \ {\n      location: '',\n      sightedAt: new Date('2016-03-21')\n    });\n\n \
  \   return [record1, record2, record3];\n    return this.store.findAll('sighting',\
  \ {reload: true});\n  }\n});\n```\n\n现在你的应用已经有了创建和检索功能。\n\n注意 `findAll` 的第二个参数，即一个带有单键\
  \ `reload` 的对象字面量。该参数告诉 `store` 在每次调用路由模型（model）时都从 API 请求新鲜数据。添加此参数可以显式地表示你始终希望每次查看列表时都获取最最新的数据。\n\
  \n接下来，`cancel` action 需要删除内存中的脏数据 `sighting` 实例。你将使用 `model.deleteRecord`，就像你在 Chapter\
  \ 21 (21 Models and Data Binding) 中做的那样。将其添加到 `app/controllers/sightings/new.js`\
  \ 中。\n\n```javascript\n...\n  actions: {\n    create() {\n      var self = this;\n\
  \      this.get('model.sighting').save().then(function() {\n        self.transitionToRoute('sightings');\n\
  \      });\n    },\n    cancel() {\n      this.get('model.sighting').deleteRecord();\n\
  \      this.transitionToRoute('sightings');\n    }\n  }\n...\n```\n\n删除记录后，用户将返回列表。当用户点击\
  \ `cancel` 按钮时，此场景有效；但当使用顶部导航返回列表或其他路由时，会发生什么？\n\n如果你不销毁脏记录，它会在用户会话激活期间一直留在内存中。要销毁记录，你将在路由中使用一个\
  \ action。\n\n在路由的生命周期中，会在不同的状态和转换时调用不同的 action。你可以重写这些 action，以为路由转换的不同阶段自定义回调函数。\n\
  \n打开 `app/routes/sightings/new.js` 并重写 `willTransition` action，以确保删了脏记录：\n\n```javascript\n\
  ...\n  model(){\n    return Ember.RSVP.hash({\n      sighting: this.store.createRecord('sighting'),\n\
  \      cryptids: this.store.findAll('cryptid'),\n      witnesses: this.store.findAll('witness')\n\
  \    });\n  },\n  actions: {\n    willTransition() {\n      var sighting = this.get('controller.model.sighting');\n\
  \      if(sighting.get('hasDirtyAttributes')){\n        sighting.deleteRecord();\n\
  \      }\n    }\n  }\n});\n```\n\n`willTransition` action 会在路由更改时触发。使用 `deleteRecord`\
  \ 会销毁模型对象，但只有当模型属性 `hasDirtyAttributes` 为 `true` 时才会执行。\n\n现在你已经处理了创建过程中的脏记录问题。你还准备好通过极少的控制器更改将数据保存到持久化数据源。\n\
  \n## 编辑目击记录\n\n在创建和读取数据之后，CRUD 告诉我们更新是下一步。你有一个针对 `sighting` 的编辑路由，但你需要通过一个可以导航到编辑路由的按钮来更新编辑列表。你还需要在编辑模板中添加一个包含\
  \ `sighting` 字段的表单；让编辑路由的 `model` 获取 `witnesses`、`cryptids` 和 `sighting`；并在 `app/router.js`\
  \ 的编辑路由对象中添加路由参数。最后，你需要创建一个控制器为编辑表单添加 action。\n\n让我们从 `app/templates/sightings/index.hbs`\
  \ 中添加一个 `Edit` 按钮开始。为了给列表提供更多上下文，添加被观测到的 `cryptid` 的名称和图像。\n\n```handlebars\n...\n\
  \      <div class=\"media well\">\n        <img class=\"media-object thumbnail\"\
  \ src=\"{{if sighting.cryptid.profileImg\n          sighting.cryptid.profileImg\
  \ 'assets/images/cryptids/blank_th.png'}}\"\n          alt=\"{{sighting.cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        <div class=\"caption\">\n          <h3>{{sighting.cryptid.name}}</h3>\n\
  \          {{#if sighting.location}}\n            <h3>{{sighting.location}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n   \
  \         <h3 class=\"text-danger\">Bogus Sighting</h3>\n          {{/if}}\n   \
  \     </div\n        {{#link-to 'sighting.edit' sighting.id tagName=\"button\"\n\
  \          class=\"btn btn-success btn-block\"}}\n          Edit\n        {{/link-to}}\n\
  \      </>\n...\n```\n\n访问 `http://localhost:4200/sightings` 并检查你新的 `Edit` 按钮（图\
  \ 24.4 带有编辑按钮的目击记录列表）。\n\n**图 24.4 带有编辑按钮的目击记录列表**\n\n![带有编辑按钮的目击记录列表](img/edit-list.png)\n\
  \n现在在 `router.js` 的路由添加动态参数。\n\n```javascript\n...\n  this.route('sightings', function()\
  \ {\n    this.route('sighting', function() {\n      this.route('edit', { path: \"\
  /:sighting_id\" });\n    });\n  });\n...\n```\n\n在 `app/routes/sighting/edit.js`\
  \ 中为 `sighting`、`cryptids` 和 `witnesses` 添加获取方法：\n\n```javascript\nexport default\
  \ Ember.Route.extend({\n  model(params) {\n    return Ember.RSVP.hash({\n      sighting:\
  \ this.store.findRecord('sighting', params.sighting_id),\n      cryptids: this.store.findAll('cryptid'),\n\
  \      witnesses: this.store.findAll('witness')\n    });\n  }\n});\n```\n\n接下来，在\
  \ `app/templates/sighting/edit.hbs` 中添加表单，就像你创建 `sighting` 时一样：\n\n```handlebars\n\
  {{outlet}}\n<h1>Edit Sighting:\n  <small>\n    {{model.sighting.location}} -\n \
  \   {{moment-from model.sighting.sightedAt}}\n  </small>\n</h1>\n<form {{action\
  \ \"update\" on=\"submit\"}}>\n  <div class=\"form-group\">\n    <label for=\"name\"\
  >Cryptid</label>\n    {{input value=model.sighting.cryptid.name type=\"text\" class=\"\
  form-control\"\n      name=\"name\" disabled=true}}\n  </div>\n  <div class=\"form-group\"\
  >\n    <label>Witnesses</label>\n    {{#each model.sighting.witnesses as |witness}}\n\
  \      {{input value=witness.fullName type=\"text\" class=\"form-control\"\n   \
  \     name=\"fullName\" disabled=true}}\n    {{/each}}\n  </div>\n  <div class=\"\
  form-group\">\n    <label for=\"location\">Location</label>\n    {{input value=model.sighting.location\
  \ type=\"text\" class=\"form-control\"\n      name=\"location\" required=true}}\n\
  \  </div>\n  <button type=\"submit\" class=\"btn btn-info btn-block\">Update</button>\n\
  \  <button {{action 'cancel'}} class=\"btn btn-block\">Cancel</button>\n</form>\n\
  ```\n\n你几乎完成了；控制器是最后一步。你需要将表单的 `{{action}}` 设置为 `update`。此外，此时仅更改位置，你将在禁用的输入字段中渲染\
  \ `cryptid` 和 `witnesses`。\n\n创建控制器：\n\n```bash\nember g controller sighting/edit\n\
  ```\n\n打开 `app/controllers/sighting/edit.js` 并添加 `update` 和 `cancel` action：\n\n\
  ```javascript\nimport Ember from 'ember';\n\nexport default Ember.Controller.extend({\n\
  \  sighting: Ember.computed.alias('model.sighting'),\n  actions: {\n    update()\
  \ {\n      if(this.get('sighting').get('hasDirtyAttributes')){\n        this.get('sighting').save().then(()\
  \ => {\n          this.transitionToRoute('sightings');\n        });\n      }\n \
  \   },\n    cancel() {\n      if(this.get('sighting').get('hasDirtyAttributes')){\n\
  \        this.get('sighting').rollbackAttributes();\n      }\n      this.transitionToRoute('sightings');\n\
  \    }\n  }\n});\n```\n\n\n\n与创建模型记录类似，更新就像调用 `save()` 一样简单。你只在记录发生变化时才需要调用 API，因此可以使用\
  \ `sighting.get('hasDirtyAttributes')`。`Ember` 已经考虑了一切！\n\n注意 `Ember.computed.alias`\
  \ 的使用。这是一个赋值的计算属性，这样在调用激活的 `sighting` 时不需要输入这么多内容。你可以为任何属性设置别名以便快速访问，特别是当属性是嵌套时。\n\
  \n## 删除目击记录\n\n偶尔会有报告的神秘生物目击会被证明是假的。虽然这可能很少见，但你确实需要一种删除旧数据或伪造数据的方法。回想第 2 章，破坏记录是通过调用\
  \ `record.destroyRecord()` 实现的。非常简单。\n\n实现它：在 `app/templates/sighting/edit.hbs`\
  \ 模板中添加一个删除按钮。\n\n```html\n <button type=\"submit\" class=\"btn btn-info btn-block\"\
  >Update</button>\n  <button {{action 'cancel'}} class=\"btn btn-block\">Cancel</button>\n\
  </form>\n\n<hr>\n<button {{action 'delete'}} class=\"btn btn-block btn-danger\"\
  >\n  Delete\n</button>\n```\n\n除了新按钮外，你在表单元素之间添加了一条水平规则（一条简单的线），将 `Update` 和 `Cancel`\
  \ 按钮与新的 `Delete` 按钮隔离开。`<hr>` 是你使用的一种 UI 工具，用于指示删除目击记录是一个编辑目击记录独立的过程。\n\n接下来，在控制器\
  \ `app/controllers/sighting/edit.js` 中添加 `delete` ：\n\n```javascript\n...\n    cancel()\
  \ {\n      if(this.get('sighting').get('hasDirtyAttributes')){\n        this.get('sighting').rollbackAttributes();\n\
  \      }\n      this.transitionToRoute('sightings');\n    },\n    delete() {\n \
  \     var self = this;\n      if (window.confirm(\"Are you sure you want to delete\
  \ this sighting?\")) {\n        this.get('sighting').destroyRecord().then(() =>\
  \ {\n          self.transitionToRoute('sightings');\n        });\n      }\n    }\n\
  \  }\n});\n```\n\n`delete` 操作添加了一个 `window.confirm` 来获取用户的确认。除了条件判断外，此操作与其他操作相似：获取模型，调用方法，并添加一个异步的\
  \ `then` 在 API 请求完成后进行调用。\n\n现在导航到 `http://localhost:4200/sightings` 并点击其中一个目击记录的\
  \ `Edit` 按钮，查看 `app/templates/sightings/edit.hbs` 及其新的 `Delete` 按钮（图 24.5）。\n\n\
  **图 24.5 编辑目击记录表单**\n\n![Edit Sighting form](img/ember-controller-edit-template.png)\n\
  \n现在循环完成了：从创建到销。\n\n## 路由动作\n\n动作不仅用于控制器。路由可以声明模板的动作并覆盖生命周期动作。当动作被调用时，它会从模板冒泡到控制器，再到路由以及父路由。\n\
  \n因此，当不需要控制器定义时，路由可以充当控制器。在我们讨论了这么多分离应用关注点之后，这似乎矛盾矛盾，但 `Ember` 确实将控制器的工作分为两个单元：路由信息和控制器逻辑。有时路由文件逻辑更多，有时控制器逻辑更多。文件分离允许在另一个文件有大量动作或装饰器时，提供小而易于理解的代码块。\n\
  \n要查看它是如何工作的，你将把 `create` 和 `cancel` 动作从 `app/controllers/sightings/new.js` 移动到\
  \ `app/routes/sightings/new.js`。此此更改还将宽宽你对这些文件之间传递的方法和对象的视角——而且当你只需要一个路由文件和组件来控制应用视图时，这是一种良好的实践。（你将在下一章学习组件。）\n\
  \n首先，在 `app/routes/sightings/new.js` 中添加这些动作：\n\n```javascript\nimport Ember from\
  \ 'ember';\n\nexport default Ember.Route.extend({\n  model() {\n  ...\n  },\n  sighting:\
  \ Ember.computed.alias('controller.model.sighting'),\n  actions: {\n    willTransition()\
  \ {\n      var sighting = this.get('controller.model.sighting');\n      if(sighting.get('hasDirtyAttributes'))\
  \ {\n        sighting.deleteRecord();\n      }\n    },\n    create() {\n      var\
  \ self = this;\n      this.get('sighting').save().then(function(data) {\n      \
  \  self.transitionTo('sightings');\n      });\n    },\n    cancel() {\n      this.get('sighting').deleteRecord();\n\
  \      this.transitionToRoute('sightings');\n    }\n  }\n});\n```\n\n你还为路由中的目击对象创建了一个\
  \ `Ember.computed.alias`。从路由访问控制器的 `model.sighting` 对象的的主要区别在于该对象所在的位置。“new”路由上的\
  \ `model` 与控制器不是同一个。\n\n现在，从 `app/controllers/sightings/new.js` 中删除这些动作：\n\n```javascript\n\
  import Ember from 'ember';\n\nexport default Ember.Controller.extend({\n  actions:\
  \ {\n    create() {\n      var self = this;\n      this.get('sighting').save().then(function()\
  \ {\n        self.transitionToRoute('sightings');\n      });\n    },\n    cancel()\
  \ {\n      this.get('sighting').deleteRecord();\n      this.transitionToRoute('sightings');\n\
  \    }\n  }\n});\n```\n\n确保你的应用程序已重新加载（或重启 `ember server`）。导航到 [`localhost:4200/sightings/new`](http://localhost:4200/sightings/new)\
  \ 并创建一个新的目击记录，以确保你可以运行路由动作。\n\n此时，`app/controllers/sightings/new.js` 已不再需要。你可以删除此文件。`Ember`\
  \ 在应用运行时仍然创建控制器对象，但你不需要让它占用 `app` 目录。\n\n本章重点关注 `Ember` 控制器，向你展示如何为模板创建动作和属性，在保存数据后跳转到新路由，以及在取消或路由更改时销记录。动作允许你通过简单的回调更改支持应用程序的模型数据。控制器属性允许你在向模型数据添加关系之前拥有页面特定的属性。最后，你已经完成了从编辑路由更新和删除记录的基本\
  \ CRUD 操作。\n\n`Ember` 通过在需要这些特定详细信息时使控制器的创建变为可选的来实现快速开发。此外，动作可以位于路由、控制器和组件中——这些是下一章（也是最后一章）的主题。\n\
  \n## 铜挑战：目击详情页\n\n使用 `app/templates/sighting/index.hbs` 和 `app/routes/sighting.js`\
  \ 创建目击详情页，显示神秘生物图像、位置和目击者列表。为了保险起见，添加一个 `Edit` 按钮。（提示：你可以在路由上添加动作。）\n\n## 银挑战：目击日期\n\
  \n\n\n\n\n在创建和编辑目击时，向控制器中添加一个 `sightingDate` 属性和一个绑定到该属性的输入框。使用基础文本输入或 `input[type=\"\
  date\"]` 来获取目击日期。使用 `moment` 将日期转换为 ISO8601 字符串，并将该日期字符串设置为目击属性 `sightingAt`。\n\n\
  ## 黄金挑战：添加和移除证人\n\n在创建新的目击时，通过 `select onchange` 动作构建一个证人列表。为证人列表创建一个新属性。在创建时，将这些对象添加到目击属性\
  \ `witnesses` 中。\n\n在页面上期间，将选定的证人集合渲染为带有 `Remove` 按钮的列表。使用 `select` 元素作为向列表添加项的同时，从\
  \ `select` 元素中移除选项。你需要两个动作：`addWitness` 和 `removeWitness`。\n\n# 25 组件\n\n组件（Components）是\
  \ `Ember` 中持有控制器和视图属性的对象。组件背后的概念是拥有具有自身上下文或作用域的可重用 DOM 元素。组件接受属性（attributes）以自定义在其模板内部渲染的内容。此外，组件还可以允许从父控制器或父路由将动作分配给属性\
  \ (图 25.1])\n\n**图 25.1 组件属性**\n\n![组件属性](img/component-reusable-property-change.png)\n\
  \n当你评估应用程序的架构时，你会开始在许多路由和模板中看到具有细微差异的元素组合在一起。如果一组元素可以从模板中移除，并用描述元素状态的变量来描述，那么它们就是成为组件的理想候选者。\n\
  \n本章将向你展示将 DOM 元素封装在 JavaScript 对象中的简单示例，以便在多个路由中使用。与你在第 23 章 中看到的助手一样，组件以属性的形式接收参数并生成\
  \ HTML。它们还具有额外功能，即拥有自己的动作和作用域属性，以便在用户交互时更新自身。\n\n本章仅向你展示可扩展应用开发的冰山一角。生产环境中的 `Ember`\
  \ 应用高度依赖组件来创建一致的用户界面和可维护的代码库，这些代码有时跨越数百个路由。然而，你在这里看到的示例将为未来的项目提供基础，在这些项目中，你希望将路由模板转换为可重用的页面或单个元素。\n\
  \n## 作为组件的迭代项\n\n经常可以变成组件的元素分组示例是 `{{#each}}` 迭代器中渲染的元素。可能会有一个基于迭代对象具有特定 `className`\
  \ 的 `<div>` 容器元素、一个标题、图像路径、带有动作的按钮和/或根据对象的属性状态定义的样式。为了让这些易于重用，你可以将所有 DOM 代码封装在组件模板中，并创建一个组件\
  \ JavaScript 文件来处理控制器通常处理的装饰器和动作。\n\n你的目击列表是用 `{{#each}}` 迭代器构建的，你将创建第一个组件来代表目击列表项。首先在终端中通过\
  \ `Ember CLI` 生成组件：\n\n```\nember g component listing-item\n```\n\n这创建了三个文件：`app/components/listing-item.js`、`app/templates/components/listing-item.hbs`\
  \ 以及测试文件 `tests/integration/components/listing-item-test.js`。\n\n现在组件已经创建完成，你需要找到你想让组件替换的代码。打开\
  \ `app/templates/sightings/index.hbs` 并找到这段代码块。稍后你将把这段代码的一部分移动到组件中。现在，先看一眼。\n\n\
  ```\n<div class=\"row\">\n  {{#each model as |sighting|}}\n    <div class=\"col-xs-12\
  \ col-sm-3 text-center\">\n      <div class=\"media well\">\n        <img class=\"\
  media-object thumbnail\" src=\"{{if sighting.cryptid.profileImg\n          sighting.cryptid.profileImg\
  \ 'assets/images/cryptids/blank_th.png'}}\"\n          alt=\"{{sighting.cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        <div class=\"caption\">\n          <h3>{{sighting.cryptid.name}}</h3>\n\
  \          {{#if sighting.location}}\n            <h3{{sighting.location}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n   \
  \         <h3 class=\"text-danger\">Bogus Sighting</h3>\n          {{/if}}\n   \
  \     </</div>\n        {{#link-to 'sighting.edit' sighting.id tagName=\"button\"\
  \n          class=\"btn btn-success btn-block\"}}\n          Edit\n        {{/link-to}}\n\
  \      </div>\n    </div>\n  {{/each}}\n</div>\n```\n\n带有 `col-xs-12` 类的容器 `<div>`（即阴影部分的\
  \ `<div>`）需要留在这个特定的页面上。它是布局的视觉容器，指定了其内容的大小。如果你将此容器添加到你的目击列表组件中，那么容器的大小对于整个网站的每个组件实例都将固定的。\n\
  \n然而，`<div class=\"media well\">` 容器及其内容可以移动到组件中。该组件可以被添加到任何大小的容器中，同时保持列表中单个项的特征。组件将包含列出项目的主要元素——主要是\
  \ `media` 容器以及图像、标题和按钮。\n\n打开 `app/templates/components/listing-item.hbs` 并开始添加图像和名称：\n\
  \n```\n<img class=\"media-object thumbnail\" src=\"{{imagePath}}\" alt=\"{{name}}\"\
  \n  width=\"100%\" height=\"100%\">\n<div class=\"caption\">\n  <h3{{name}}</h3>\n\
  \  {{yield}}\n</div>\n```\n\n组件代表单个 DOM 元素。那么，组件模板中的所有内容都是该 DOM 元素的元素。默认情况下，`Ember`\
  \ 的 HTMLBars 使用 JavaScript 创建 `<div>` 元素并在其中渲染组件模板。\n\n你刚刚编写的代码为 `{{#listing-item}}`\
  \ 组件创建的 `<div>` 添加了图像和带有名称的说明。与其他模板一样，组件具有你将传入的动态部分。（稍后我们将讨论 `{{yield}}`。）\n\n当你将此组件添加到路由模板时，它将渲染如下内容：\n\
  \n```\n<div>\n  <img class=\"media-object thumbnail\" src=\"[cryptid's imagePath\
  \ string]\" alt=\"[cryptid's name string]\" width=\"100%\" height=\"100%\">\n  <div\
  \ class=\"caption\">\n    <h3>[cryptid's name string]</h3>\n    {{yield}}\n  </div>\n\
  </div>\n```\n\n模板的动态部分 `{{name}}` 和 `{{imagePath}}` 将是提供给组件的属性。`{{yield}}` 是你可以将子元素传递给组件以便在\
  \ DOM 节点结构中的特定位置渲染的地方。组件模板文件充布局或主元素集，而 `{{yield}}` 用于在每个组件实例中需要添加的元素。你将在本章后面的部分使用它。\n\
  \n虽然这并不是你在 `app/templates/sightings/index.hbs` 中要替换的标记，但它是一个很好的起点。\n\n用组件替换你 `app/templates/sightings/index.hbs`\
  \ 中的现有代码。\n\n\n\n\n```\n<div class=\"row\">\n  {{#each model as |sighting|}}\n \
  \   <div class=\"col-xs-12 col-sm-3 text-center\">\n      <div class=\"media well\"\
  >\n        <img class=\"media-object thumbnail\" src=\"{{if sighting.cryptid.profileImg\n\
  \          sighting.cryptid.profileImg 'assets/images/cryptids/blank_th.png'}}\"\
  \n          alt=\"{{sighting.cryptid.name}}\" width=\"100%\" height=\"100%\">\n\
  \        <div class=\"caption\">\n          <h3>{{sighting.cryptid.name}}</h3\n\
  \          {{#if sighting.location}}\n            <h3>{{sighting.location}}</h3>\n\
  \            <p>{{moment-from sighting.sightedAt}}</p>\n          {{else}}\n   \
  \         <h3 class=\"text-danger\">Bogus Sighting</h3>\n          {{/if}}\n   \
  \     </div\n        {{#link-to 'sighting.edit' sighting.id tagName=\"button\"\n\
  \          class=\"btn btn-success btn-block\"}}\n          Edit\n        {{/link-to}}\n\
  \      </div\n      {{#listing-item imagePath=sighting.cryptid.profileImg\n    \
  \    name=sighting.cryptid.name}}\n      {{/listing-item}}\n    </div\n  {{/each}}\n\
  </div\n```\n\n你用一行代码替换了大量的代码。在此过程中删除了一些功能，但你很快就会修复它们。下一步是在组件元素上加回容器样式。它目前缺少了 `\"\
  media\"` 和 `\"well\"` `Bootstrap` 样式。\n\n打开 `app/components/listing-item.js` 并为\
  \ `listing-item` 组件添加一个 `classNames` 属性：\n\n```\nimport Ember from 'ember';\n\n\
  export default Ember.Component.extend({\n  classNames: [\"media\", \"well\"]\n});\n\
  ```\n\n`classNames` 属性会将其值传递给组件创建的 `div` 元素的 `classNames` 属性。\n\n现在，渲染后的组件看起来如下：\n\
  \n```\n<div class=\"media well\">\n  <img class=\"media-object thumbnail\" src=\"\
  [imagePath string]\" alt=\"[name string]\"\n    width=\"100%\" height=\"100%\">\n\
  \  <div class=\"caption\">\n    <h3>[name string]</h3>\n    {{yield}}\n  </div\n\
  </div\n```\n\n接下来，你将向组件模板的 `{{yield}}` 部分添加元素，以使该组件实例的实现对于 sightings 路由是唯一的。首先，在\
  \ `app/templates/sightings/index.hbs` 中，添加组件的上下文内容，这些内容将在渲染在 `{{yield}}` 中：\n\n\
  ```\n...\n      {{#listing-item imagePath=sighting.cryptid.profileImg\n        name=sighting.cryptid.name}}\n\
  \        {{#if sighting.location}}\n          <h3>{{sighting.location}}</h3>\n \
  \           <p>{{moment-from sighting.sightedAt}}</p>\n        {{else}}\n      \
  \    <h3 class=\"text-danger\">Bogus Sighting</h3>\n        {{/if}}\n        {{#link-to\
  \ 'sighting.edit' sighting.id tagName=\"button\"\n          class=\"btn btn-success\
  \ btn-block\"}}\n          Edit\n        {{/link-to}}\n      {{/listing-item}}\n\
  ```\n\n这段代码看起来很眼熟，它恢复了目击地点、时间以及 `Edit` 按钮。\n\n## 用于 DRY 代码的组件\n\n是时候让你的代码 DRY 一了。\n\
  \n你说什么？DRY 是一种编程原则，全称为“不要重复自己”（don’t repeat yourself）。换句话说，如果你写了某些内容，请只在一个地方写。\n\
  \nsightings 和 cryptids 的列表都使用了带有 `class=\"media well\"` 的元素，并包含图像和标题。因此，这些代码可以进行\
  \ DRY 处理。该组件与 cryptid 列表项并不完全匹配，但这正是 `{{yield}}` 发挥用场的地方。\n\n在 cryptids 列表中添加新的\
  \ `{{#listing-item}}` 组件。在 `app/templates/cryptids.hbs` 中，替换 `div class=\"media\
  \ well\"` 元素及其子元素：\n\n```\n<div class=\"row\">\n  {{#each model as |cryptid|}}\n\
  \    <div class=\"col-xs-12 col-sm-3 text-center\">\n      <div class=\"media well\"\
  >\n        {{#link-to 'cryptid' cryptid.id}}\n          <img class=\"media-object\
  \ thumbnail\"\n            src=\"{{if cryptid.profileImg cryptid.profileImg\n  \
  \          'assets/images/cryptids/blank_th.png'}}\"\n            alt=\"{{cryptid.name}}\"\
  \ width=\"100%\" height=\"100%\">\n        {{/link-to}}\n        <div class=\"caption\"\
  >\n          <h3>{{cryptid.name}}</h3>\n        </div\n      </div\n      {{#link-to\
  \ 'cryptid' cryptid.id}}\n        {{listing-item imagePath=cryptid.profileImg name=cryptid.name}}\n\
  \      {{/link-to}}\n    </div\n  {{else}}\n    <div class=\"jumbotron\">\n    \
  \  <h1>Creatures</h1>\n    </div\n  {{/each}}\n</div\n```\n\n你有没有注意到 `listing-item`\
  \ 组件使用 `{{yield}}` 来允许自定义内容？这就是 Ember 组件的力量。你可以创建可复用的 UI 元素，同时保持灵活性。\n\n\n\n\n在这里，你为\
  \ `typeClass` 添加了一个计算属性，它将用于为组件的 `<div>` 元素添加 `className`。该计算属性期望存在一个一个名为 `alertType`\
  \ 的属性（你稍稍后会添加它），并返回一个以 `\"alert-\"` 为前缀的 `\"alertType\"` 字符串。这允许你传入值为 `\"success\"\
  `、`\"info\"`、`\"warning\"` 或 `\"danger\"` 的属性，以提供警报的上下文。你将在另一个计算属性中使用同一个 `alertType`\
  \ 属性。\n\n最后，在 `app/components/flash-alert.js` 文件中添加 `className` 绑定，绑定到组件属性的 `className`：\n\
  \n```\n...\nexport default Ember.Component.extend({\n  classNames: [\"alert\"],\n\
  \  classNameBindings: ['typeClass'],\n  typeClass: Ember.computed('alertType', function()\
  \ {\n    return \"alert-\" + this.get('alertType');\n  })\n});\n```\n\n这会根据计算属性\
  \ `typeClass` 的值向 `classNames` 数组中添加一个 `className`。当你设置 `alertType` 属性时，组件的样式会发生变化。\n\
  \n使用 `classNameBindings` 是特定于元素的 `classNames` 属性。对于其他属性，有一个互补的 `Ember` 组件属性：`attributeBindings`。你可以将属性绑定到组件元素的属性上。一个基础示例是将链接的\
  \ `href` 设置为 `computedProperty`。例如：\n\n```\nexport default Ember.Component.extend({\n\
  \  attributeBindings: ['href', 'customHREF:href'],\n  href: \"http://www.mydomain.com\"\
  ,\n  customHREF: \"http://www.mydomain.com\"\n});\n```\n\n通过属性绑定，你可以使用传入组件的状态数据来设置组件的所有属性。如需进一步探索，请查阅在线的\
  \ `Ember` 文档。\n\n接下来，添加一个计算属性以字符串形式显示警报类型。组件模板期望一个名为 `typeTitle` 的属性，因此你必须在 `app/components/flash-alert.js`\
  \ 中添加此计算属性：\n\n```\nimport Ember from 'ember';\n\nexport default Ember.Component.extend({\n\
  \  ...\n  typeClass: Ember.computed('alertType', function() {\n    return \"alert-\"\
  \ + this.get('alertType');\n  }),\n  typeTitle: Ember.computed('alertType', function()\
  \ {\n    return Ember.String.capitalize(this.get('alertType'));\n  })\n});\n```\n\
  \n现在，你在消息中有一个绑定到警报类型的字符串，该字符串首字母大写，并且在模板中是一个 `<strong>` 元素。你通过通过 `alertType` 属性传入组件的数据计算每个值，为组件绑定了一个类名和一个经过装饰的属性。\n\
  \n接下来，你需要在 `app/templates/application.hbs` 中将你的组件添加到页面中：\n\n```html\n<header>\n\
  \  ...\n</header>\n<div class=\"container\">\n  {{flash-alert}}\n  {{outlet}}\n\
  </div>\n```\n\n该组件是一个内联组件，这意味着 `{{yield}}` 中将没有要渲染的元素，且组件模板不需要 `{{yield}}`。\n\n\
  # 数据向下 (Data Down)\n\n此时，警报没有任何状态数据来渲染内容和 `classNames`，只有容器。在 `app/templates/application.hbs`\
  \ 中传入组件的状态：\n\n```html\n...\n  {{flash-alert message=\"This is the Alert Message\"\
  \ alertType=\"success\"}}\n  {{outlet}}\n</div>\n```\n\n启动服务器并打开浏览器访问 `http://localhost:4200/sightings`，查看带有你提供的内联数据渲染的\
  \ `{{flash-alert}}` 组件（见 图 25.3 ）。\n\n**图 25.3 警报**\n\n![Flash alert](img/component-flash-alert.png)\n\
  \n现在警报已显示在屏幕上，你想动态地设置 `message` 和 `alertType` 属性。你需要一个应用控制器来实现。使用 `Ember CLI` 生成器添加控制器：\n\
  \n```bash\nember g controller application\n```\n\n应用控制器将维护 `{{flash-alert}}` 组件的动态状态。控制器需要属性来维护警报的状态。在\
  \ `app/controllers/application.js` 中添加以下属性：\n\n```javascript\nimport Ember from\
  \ 'ember';\n\nexport default Ember.Controller.extend({\n  alertMessage: null,\n\
  \  alertType: null,\n  isAlertShowing: false\n});\n```\n\n你添加了将被 action 设置的属性。现在你有了可以在\
  \ `app/templates/application.hbs` 中传递给 `flash-alert` 组件的控制器属性：\n\n```html\n...\n\
  </header>\n<div class=\"container\">\n  {{#if isAlertShowing}}\n    {{flash-alert\
  \ message=\"This is the Alert Message\" alertType=\"success\" message alertMessage\
  \ alertType=alertType}}\n  {{/if}}\n  {{outlet}}\n</div>\n```\n\n现在可以从 action 设置控制器的属性了。应用程序只需要在\
  \ `isAlertShowing` 属性设置为 `true` 且其他属性有值时渲染组件。设置这些属性的 action 将来自应用程序中的所有控制器。你如何将这些\
  \ action 向上冒泡？`Ember` 会为你完成这一切（见 图 25.4 ）。\n\n**图 25.4 警报处理流程**\n\n![Flash alert\
  \ process](img/components_action_bubble.png)\n\n你必须向路由（route）添加一个 action。你可以从控制器中调用\
  \ action，它将命中当前控制器，然后是当前路由、父路由，最后是应用路由。\n\n由于你的 `flash-alert` 位于 `app/templates/application.hbs`\
  \ 中，你需要一个应用路由。创建一个：\n\n```bash\nember g route application\n```\n\n你将在命令行中看到此消息：\n\
  \n``````\n[?] Overwrite app/templates/application.hbs?\n```\n\n输入 `n` 或 `no` 继续。你不想覆盖刚刚创建的模板。你只需要添加\
  \ JavaScript 文件 `app/routes/application.js`。\n\n接下来，你需要编辑 `app/routes/application.js`\
  \ 中的路由：\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
  \  actions: {\n    flash(data){\n      this.controller.set('alertMessage', data.message);\n\
  \      this.controller.set('alertType', data.alertType);\n      this.controller.set('isAlertShowing',\
  \ true);\n    }\n  }\n});\n```\n\n# Action 向上 (Actions Up)\n\n现在你有一个 action 可以让\
  \ `flash-alert` 显示适当的消息。你只需要向 action 传递一些数据。该数据将是一个包含 `alertType` 和 `message` 键的对象。\n\
  \n`alertType` 将同时用于 `message` 和 `Bootstrap` 警报变体的样式：`\"success\"`、`\"warning\"`、`\"\
  info\"` 或 `\"danger\"`。从控制器调用 action 所示：\n\n```javascript\nthis.send('flash', {alertType:\
  \ \"success\", message: \"You Did It! Hooray!\"});\n```\n\n你将在创建新目击后添加应用 action\
  \ 的调用。在 `app/routes/sightings/new.js` 中添加以下内容：\n\n```javascript\n...\n    create()\
  \ {\n      var self = this;\n      this.get('sighting').save().then(function(data){\n\
  \        self.send('flash', {alertType: \"success\", message: \"New sighting.\"\
  });\n        self.transitionTo('sightings');\n      });\n    }\n...\n```\n\n现在点击\
  \ `New Sighting` 按钮去创建一个新目击。选择一个生物和一个击者，输入新位置并点击 `Save`。一旦目击保存到数据库中，应用程序将引导你进入目击列表，并在列表顶部显示新的警报消息（见\
  \ 图 25.5 ）。\n\n**图 25.5 警报 – 新目击**\n\n\n\n\n\n![Flash alert – new sighting](img/component-flash-alert-new.png)\n\
  \n最后一步是添加用于从屏幕上移除警告的动作（action）和事件。你只想在创建新消息后显示 `flash-alert`，因此在移除它时，你需要切换开关来隐藏警告。\n\
  \n在 `app/controllers/application.js` 中，添加一个名为 `removeAlert` 的动作：\n\n```\n...\nexport\
  \ default Ember.Controller.extend({\n\n  alertMessage: null,\n  alertType: null,\n\
  \  isAlertShowing: false,\n  actions: {\n    removeAlert(){\n      this.set('alertMessage',\
  \ \"\");\n      this.set('alertType', \"success\");\n      this.set('isAlertShowing',\
  \ false);\n    }\n }\n});\n```\n\n这将将 `isAlertShowing` 设置为 false，将 `alertMessage`\
  \ 设置为空字符串，并将 `alertType` 设置为 `\"success\"`。\n\n接下来，将 `removeAlert` 动作发送到组件。在 `app/templates/application.hbs`\
  \ 中添加以下内容：\n\n```\n...\n</header>\n<div class=\"container\">\n  {{#if isAlertShowing}}\n\
  \    {{flash-alert message=alertMessage alertType=alertType}}\n      close=(action\
  \ \"removeAlert\")}}\n  {{/if}}\n  {{outlet}}\n</div\n```\n\n语法 `close=(action \"\
  removeAlert\")` 看起来可能很奇怪。这是 `Ember` 2.0 的新特性，被称为“闭包动作”（closure action）。该函数字面量被传递，并作为名为\
  \ `close` 的属性从组件调用，就像别名一样。\n\n旧版本的 `Ember` 这种流程更为复杂。在底层，闭包动作不仅仅是作为参数从对象传递函数。要了解更多关于闭包动作的信息，请访问\
  \ EmberJS 上关于版本 1.13 和 2.0 特性的博客文章：[emberjs.com/blog/2015/06/12/ember-1-13-0-released.html](http://emberjs.com/blog/2014/06/12/ember-1-13-0-released.html)。\n\
  \n接下来，你需要在组件中调用此动作。组件是 DOM 元素的实例；因此，它们具有代表 DOM 元素事件的键值对。你可以添加 `click` 事件监听器的声明，`Ember`\
  \ 将将监听器添加到包裹模板的 `<div>` 元素上。在 `app/components/flash-alert.js` 中添加以下内容：\n\n```\n\
  import Ember from 'ember';\n\nexport default Ember.Component.extend({\n  ...\n \
  \ typeTitle: Ember.computed('alertType', function() {\n    return Ember.String.capitalize(this.get('alertType'));\n\
  \  }),\n  click() {\n    this.get('close')();\n  }\n});\n```\n\n属性 `close` 在调用时将触发在应用程序控制器上定义的\
  \ `\"removeAlert\"` 动作。通过使用闭包动作，你将组件的属性分配了一个定义在父控制器中的函数，并将组件的功能绑定到其父级的作用域中。你可以在任何层添加\
  \ `flash-alert`，并根据上下文为 `close` 分配不同的功能。\n\n你添加了一个可以响应“向下传递的数据”以自定义组件，并响应“向上传递的动作”以从父控制器设置组件的外部状态。这就是组件的生命周期：数据向下，动作向上。在创建组件时，请记住这种模式。\n\
  \n在整个应用程序架构章节中，你学习了使用 `Ember` 构建的现代应用程序的结构。你学习了 MVC 模式以及此框架如何帮助通过预构建的 JavaScript\
  \ 对象来实现关注分离。它还帮助通过命名模式、脚手架（scaffolding）、构建工具和规范来保持逻辑清晰。从现在起，你可以放心使用 `ember new`\
  \ 创建新应用。你可以直接投入应用需求：数据建模、创建路由和构建组件。\n\n`Ember` 社区维护着这个精彩的框架，并随着 JavaScript 的成熟不断提高效率。这个框架是由这些人构建的，他们在你精炼\
  \ JavaScript 技能时也会遇到同样的挑战。记住，当某些功能运行时不要提问，当发现有 Bug 时要帮助修复，并在可能时做出贡献。你现在是整个 JavaScript\
  \ 社区的一员。\n\n## 铜级挑战：自定义警告消息\n\n你在添加物种发现时触发的 `{{flash-alert}}` 是通用的。请在消息中添加发现地点和日期。\n\
  \n## 银级挑战：将 NavBar 变为组件\n\n将应用程序模板中的 `NavBar` 变为一个组件。添加一个属性状态来显示两个版本的导航。在 `NavBar`\
  \ 组件中添加条件语句以显示特定的链接。\n\n## 金级挑战：警告数组\n\n重构 `flash-alert` 组件，使其接受带有不同警告类型和消息的警告数组。你可能需要同时在屏幕上显示多个警告。使用\
  \ `Ember.ArrayProxy` 代替单个警告属性设置。向数组中添加消息、类型和一个新的 `index` 属性，以便在点击它时从数组中删除该项。\n\n\
  # 26\n\n## 后记\n\n恭喜你！你已经到达这本书的末尾。并不是每个人都有自律完成你所做的事情。你的努力付出了回报：你现在是一名前端开发者了。\n\n\
  ## 最终挑战\n\n我们留给了你最后一个挑战：成为一名优秀的前端开发者。如果你不应用所学知识，你会很快忘记所学到的东西。你会从哪里开始呢？\n\n你在书中学习了很多东西。其中是否有任何激发了你的想象力？写一些代码来玩玩你喜欢的东西。寻找并阅读更多关于它的文档——如果有的话，甚至读一整本书。此外，查看\
  \ JavaScript 播客，听听关于前端开发的深入且有趣的讨论（[devchat.tv/js-jabber](https://devchat.tv/js-jabber)）。\n\
  \n- **写代码。** 现在就写。如果你不应用所学知识，你会很快忘记。无论做什么，都不要浪费。\n- **结识他人。** 本地聚会是结识志同道合开发者的好地方。许多顶尖前端开发者在\
  \ Twitter 上非常活跃。你还可以参加前端会议与其他开发者见面（甚至是我们！）。\n- **探索开源社区。** 前端开发在 [www.github.com](http://www.github.com)\
  \ 上爆炸式增长。当你发现一个酷的库时，查看其贡献者的其他项目。也分享自己的代码——你不知道谁会觉得它有用有趣。我们认为 WDRL（网络开发阅读列表）邮件列表是了解前端动态的绝佳方式（[wdrl.info](https://wdrl.info/)）。\n\
