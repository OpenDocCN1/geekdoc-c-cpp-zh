  \n当用户输入密码时，向他们发送所有之前的消息。\n\n## 金级挑战：聊天机器人\n\n在美国，20 世纪 20 年代生产或销售酒精是非法的。作为回应，出现了许多“speakeasies”（地下酒吧）：这些是销售酒精类饮料的秘密场所，在顾客允许进入之前需要密码。\n\
