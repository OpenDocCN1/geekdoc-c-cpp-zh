- img_proc: true
  md: '# Appendix A - Rules for Special Member Function Generation


    Howard is a lead designer and author of the C++11 proposal for move semantics,
    the std::chrono library, and a few other vital parts of Modern C++. The diagram,
    along with an informative description, can be found on this page: C++ class declarations
    and also see this presentation: Everything you need to know about move semantics
    - Howard Hinnant @YouTube.


    How to read the diagram:


    Labels:


    +   - defaulted - compiler generates the function if possible.

    - defaulted - deprecated behavior since C++11, the compiler might warn about a
    function generation.

    - not-declared - there''s no declaration of a function so that it won''t participate
    in the overload resolution.

    - deleted - the function =delete, meaning that it participates in the overload
    resolution, but it won''t be accessible.

    - user declared - a given function is declared by the user and not implicitly
    provided by the compiler. It includes empty implementation, =default or even =delete.


    Rules:


    +   - If a user declares no special member functions, the compiler defaults all
    special member functions.

    - If a user declares any constructor, the compiler defaults all special member
    functions except for the default constructor

    - If a user declares a default constructor, the compiler defaults all special
    member functions

    - If a user declares a destructor, the compiler defaults a default constructor,
    copy constructor and copy assignment operations. The move constructor and move
    assignment are not declared. The approach is deprecated, and compilers might warn
    about such behavior. Usually, when you declare a destructor, there''s a high chance
    the default constructor might be insufficient.

    - If a user declares a copy constructor, the compiler doesn''t declare the default
    constructor, and copy assignment is declared. The move constructor and move assignment
    are not declared.


    > *https://howardhinnant.github.io/classdecl.html

    *https://www.youtube.com/watch?v=vLInb2fkgHk'
