    As you can see, we still have a single Value resource, and then we pass it to
    the tvset object. When we copy the object into copy, the pointer is shared (the
    resource is not copied). This is safer than a shallow copy of a raw pointer because
    we have precise semantics, and we can see where are the owners of the resource.
    For example, when copy goes out of scope, it won™ delete the Value object; it
    will decrease the reference counter ("use count" going from 3 to 2). In the end,
    tvset as well as pid goes out of scope, the reference counter decreases to zero,
    and thus the memory block is deleted.


    # Summary for smart pointers


    In summary, a class type with a smart pointer non-static data member has the following
    properties:


    +   * It will default constructible, but it''s best to assign some starting value
    to the pointer (or at least nullptr).

    * The compiler can generate a move constructor and move assignment operator.

    * For unique_ptr, default copy operations are blocked, and you must implement
    custom versions.

    * For shared_ptr, default copy operations are provided, but they are "shallow".
    This is still safer than copying raw pointers, as this time, we copy shared pointers
    which increases their internal reference counter, and thus the resource handling
    will be safe (although it might be harder to reason about).'
