  md: '# 11. Non-local objects


    Thus far, we considered variables that appeared in some local function scope or
    as sub-objects of a class type. However, this is not the only option, and C++
    allows us to declare various forms of non-local objects: they usually live throughout
    the execution of the whole program. In this chapter, we''ll look at global variables,
    static data members, and thread-local objects. We''ll also consider new features
    for safe initialization from C++17 and C++20.


    # Storage duration and linkage


    To start, we need to understand two key properties of an object in C++: storage
    and linkage. Let''s begin with the definition of storage, from [basic.stc#general]:


    > The storage duration is the property of an object that defines the minimum potential
    lifetime of the storage containing the object. The storage duration is determined
    by the construct used to create the object.


    An object in C++ has one of the following storage duration options:


    | Storage duration | Explanation |

    | automatic | Automatic that the storage is allocated at the start of the scope.
    Local variables have automatic storage duration (except those declared as static,
    or thread_local). |

    | static | The storage for an object is allocated when the program begins before
    the main() function starts and deallocated when the program ends. There''s only
    one instance of such an object in the whole program. |

    | thread | The storage for an object is tied to a thread: it''s started when a
    thread begins and deallocated when the thread ends. Each thread has its own "copy"
    of that object. |

    | dynamic | The storage for an object is allocated and deallocated using explicit
    memory allocation functions. For example, by the call to new/delete.|


    https://timsong-cpp.github.io/cppwpw/n4868/basic.stc#general'
