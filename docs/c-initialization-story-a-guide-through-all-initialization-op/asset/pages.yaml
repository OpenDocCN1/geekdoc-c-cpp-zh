    # In std::variant


    std::variant has two in_place helpers that you can use:


    +   * std::in_place_type - used to specify which type you want to change/set in
    the variant

    * std::in_place_index - used to specify which index you want to change/set. Types
    are numbered from 0. In a variant std::variant<int, float, std::string> int has
    an index 0, float has an index 1, and the string has an index of 2. The index
    is the same value as returned from the variant::index member function.


    Fortunately, you don''t always have to use the helpers to create a variant. It''s
    smart enough to recognize if it can be constructed from the passed single parameter:


    ```

    // this constructs the second/float:

    std::variant<int, float, std::string> intFloatString { 10.5f };

    ```


    For std::variant, we need the helpers for at least two cases:


    +   * ambiguity - to distinguish which type should be created where several could
    match

    * efficient complex type creation (similar to optional)


    Note: by default variant is initialized with the first type - assuming it has
    a default constructor. If the default constructor is unavailable, you''ll get
    a compiler error. This is different from std::optional, which is initialized to
    an empty optional - as mentioned in the previous section.


    # Ambiguity


    What if you have initialization like:


    ```

    std::variant<int, float> intFloat { 10.5 }; // conversion from double?

    ```


    The value 10.5 could be converted to int or float, so the compiler will report
    a few of template errors... but basically, it cannot deduce what type should double
    be converted to.


    But you can easily handle such an error by specifying which type you''d like to
    create:'
