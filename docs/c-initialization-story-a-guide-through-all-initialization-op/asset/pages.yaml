  md: '# 5. Destructors


    While constructors are responsible for various situations where an object is created,
    C++ also offers a way to handle object destruction. C++ doesn''t provide any form
    of garbage collection available in many popular programming languages, but thanks
    to precise lifetime specification, you can be confident when your object will
    be destroyed.


    Each class has a special member function called a destructor. If you don''t write
    one, the compiler prepares a default implementation. A destructor is called when
    an object ends its lifetime. In most cases, it means that an object goes out of
    the scope (for stack-allocated variables), or when a delete operator is called
    (for heap-allocated variables). Additionally, when you have a user-defined class,
    it will automatically call destructors for its data members. For more information
    about lifetime, see a good summary at C++Reference page.


    # Basics


    Before we move on, we expand our terminology. So far, I mentioned “object” to
    refer to entities of some type and relied on our “intuition” to access such entities.
    But the C++ Standard defines an *object* in the following terms (simplified, based
    on C++ Draft - intro.object²):


    > The constructs in a C++ program create, destroy, refer to, access, and manipulate
    objects. An object is created by a definition, by a new-expression, by an operation
    that implicitly creates objects, or when a temporary object is created. An object
    occupies a region of storage in its period of construction, throughout its lifetime,
    and in its period of destruction.


    And continuing:


    https://en.cpppreference.com/w/cpp/language/lifetime

    https://timsong-cpp.github.io/cppwp/n4868/intro.object#1'
