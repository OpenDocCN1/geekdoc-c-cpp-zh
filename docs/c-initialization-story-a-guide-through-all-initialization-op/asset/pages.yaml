  md: '# A compiler-generated move constructor


    Don''t worry! If your class uses primitive types or types from the Standard Library,
    there''s no need to write custom move constructors. In most cases, the compiler
    creates a default implementation assuming your class complies with the following
    rules:


    +   - There are no user-declared copy constructors.

    - There are no user-declared copy assignment operators.

    - There are no user-declared move assignment operators.

    - There is no user-declared destructor.

    - Non-static data members all have accessible move constructors.

    - Your class has a direct or virtual base class that can be moved.

    - Your class has a virtual base class or a non-static data member without a deleted
    or inaccessible destructor.


    The rules are logical. For example, if you define a custom copy constructor, there''s
    a high chance your class is unique, and move operations should also be implemented
    by you rather than the compiler.


    You can find all the rules in this handy list @C++Reference10.


    # Distinguishing from assignment


    It''s crucial that you recognize a case where the compiler invokes a copy or move
    constructor versus a case with the assignment operator. The code might look similar,
    but they behave differently.


    C++, as a powerful capability, allows us to implement operators for user-defined
    types. Such operators make it easier and more natural for operations related to
    math, string manipulation, relations, and stream output or input, among others.
    For example, std::string elements operator+ string concatenation. Similarly, you
    can define operator- for classes representing 3D Vectors. You can see the complete
    list of operators on operator overloading @C++Reference11.


    If you don''t provide a custom declaration, the compiler attempts to define an
    implicit version. Most operators won''t work for user-defined types and don''t
    exist until you implement them, there''s a special operator= called the assignment
    operator. By default, the implicit variant calls the assignment operator for sub-objects
    of the type. For example:'
