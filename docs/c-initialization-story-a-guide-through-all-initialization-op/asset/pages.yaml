  md: "Techniques and Use Cases\n\nstatic keyword to declare a local static variable\
    \ within a function. This allows you to define a local variable that is initialized\
    \ only once, in a thread-safe way.\n\n> Meyer's Singleton is a very efficient\
    \ way to implement this design pattern, singletons doesn't have a good opinion\
    \ in modern programming style. Singleton in fact is a global object, and it leads\
    \ to few problems like testing, scalability, lack of explicit dependencies and\
    \ few others. Please be careful when adding this pattern to your code.\n\n# Factory\
    \ with self-registering types and static initialization\n\nCode working here:\
    \ https://wandbox.org/perlink/iQbnnOUBu0R8Vk8u withকিন্ত! Let's have a look at\
    \ a typical factory function. It creates ZipCompression BZCompression based on\
    \ the extensions of the filename.\n\n```\nstatic unique_ptr<ICompressionMethod>\
    \ Create(const string& fileName) {\n    auto extension = GetExtension(filename);\n\
    \    if (extension == \"zip\")\n        return make_unique<ZipCompression>();\n\
    \    else if (extension = \"bz\")\n        return make_unique<BZCompression>();\n\
    \n    return nullptr;\n}\n```\n\nHere are some issues with this approach:\n\n\
    +   - Each time you write a new class, and you want to include it in the factory\
    \ you have to add another if in the Create() method. Easy to forget in a complex\
    \ system.\n- All the types must be known to the factory\n- In Create() we arbitrarily\
    \ use strings to represent types. This representation is only visible in that\
    \ single method. What if you'd like to use it somewhere else? Strings might be\
    \ easily misspelled, especially if you have several places where they are compared."
