    ```


    We will discuss all of the above forms in the further section.


    As a mental model, we can assume that most classes have their default, compiler-generated
    copy constructor. Such a default copy constructor performs a bitwise copy of each
    data member. Thanks to this approach, you can initialize objects, pass them as
    arguments or return from functions without any custom implementation in a given
    type. However, implementing a copy constructor might be necessary when your class
    has data members that shouldn''t be shallow copied, like owned resource handles
    (files, pointers to memory blocks, etc.). For example, suppose a class contains
    a pointer to a memory block. When a default copy constructor copies a pointer,
    the resulting pointer copy will point to the exact memory location. Similarly,
    if your class uses a handle to a file, then after the bitwise copy, the handle
    will be copied, and two objects will relate to the same file. Depending on the
    program requirements, this might not be what you want. With pointers, it''s usually
    better to allocate a new memory block and copy the data of that block.


    The situation for a shallow copy is illustrated by the following diagram:


    ![](img/fb0256f00863723666473966f8c0add1_53_0.png)


    Shallow vs. Deep Copy


    On the diagram, you can see a comparison of a shallow (bitwise copy) vs. the deep
    copy approach. If you copy the resource handles, the resulting object will point
    to the same'
