  md: '# Non-local objects


    +   - **constant initialization** - this happens for the zvariable, which is value
    initialized from a constant expression.


    +   - The x object looks uninitialized, but for non-local static objects, the
    compiler performs **zero initialization**, which means they will take the value
    of zero (and then it''s converted to the appropriate type). Pointers are set to
    nullptr, arrays, trivial structs, and unions have their members initialized to
    a zero value.


    > Don''t rely on zero initialization for static objects. Always try to assign
    some value to be out of the outcome. In the book, I hope so that you could see
    the whole picture.


    Now, v objects are initialized during so-called **dynamic initialization** of
    non-local variables. It happens for objects that cannot be constant initialized
    or zero-initialized during static initialization at the program startup.


    > In a single translation unit, the order of dynamic initialization of global
    variables (including static data members) is well defined. If you have multiple
    compilation units, the order is unspecified. When a global object A defined in
    a different translation unit, depends on another global object B defined in a
    different translation unit, will have undefined behavior. Such a problem is called
    "static initialization order fiasco"; read more C++ Super FAQ.


    In short, static non-local object has to be initialized at the program startup.
    However, the compiler tries to optimize this process and, if possible, do as much
    at compile time. For example, for built-in types initialized from constant expressions,
    the value of the variable might be stored as a part of the binary and then only
    loaded during the program startup. If it''s not possible, then a dynamic initialization
    must happen, meaning that the value is computed before the main() starts. Additionally,
    the compiler might even defer the dynamic initialization until the first use of
    the variable but guarantee its correctness. Since C++ can try to move dynamic
    initialization to the compile-time stages to `constexpr` (allowing us to write
    custom types). Since C++20, we can use **constinit** to guarantee constant initialization.


    ```

    https://iscpp.com/wiki/faq/static-init-order

    https://pabloasarias.github.com/2020/01/02/static-variable-initialization/

    https://www.youtube.com/watch?v=dOfucXtyEsU

    ```'
