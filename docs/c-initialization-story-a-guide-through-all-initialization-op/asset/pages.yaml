    Conceptually, the expression is copied into a tuple-like object (tempTuple) with
    variables that are exposed through a, b and c. However, the variables a, b, and
    c are not references; they are aliases (or bindings) to the generated object member
    variables. The temporary object has a unique name assigned by the compiler.


    For example:


    ```

    std::pair a(0, 1.0f);

    auto [x, y] = a;

    ```


    x binds to int stored in the generated object that is a copy of a. And similarly,
    y binds to float.


