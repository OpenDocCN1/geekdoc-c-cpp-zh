  md: "# Ex 2.5. The Most Vexing Parse Rule. Run @Compiler Explorer\n\n```\n#include\
    \ <iostream>\n#include <string>\n\nstruct Box {};\n\nstruct Product {\n    Product():\
    \ name{\"default product\"}{}\n    Product(const Box& b) : name{\"box\"}{}\n \
    \   std::string name;\n};\n\nint main() {\n    Product p();          // << 1.\n\
    \    std::cout << p.name;\n    Product p2(Box());    // << 2.\n    std::cout <<\
    \ p2.name;\n}\n```\n\nThe line Product p(); looks innocent, and one could expect\
    \ a default constructor to be called. Unfortunately, the compiler recognizes it\
    \ as a declaration of a function! There's a C++ rule which says that anything\
    \ that can be parsed as a declaration must be interpreted as one. In our context,\
    \ the line might mean a local function of name p returning Product and taking\
    \ no arguments. Similarly, the line p2 also causes compiler errors, and this time\
    \ the compiler thinks we declare a local function p2 returning Product and taking\
    \ Box as an argument.\n\nBut fortunately, we have at least two ways of fixing\
    \ it:\n\n```\nProduct p;\nProduct p1;\nProduct p2{Box()};\nProduct p3{Box()};\n\
    ```\n\nIt works as expected, and the list initialization syntax is the most consistent\
    \ option. Try to modify the example @Compiler Explorer¹² and fix the code. Here's\
    \ a good article if you want\n\n> ¹²https://godbolt.org/z/c48Kc9vq"
