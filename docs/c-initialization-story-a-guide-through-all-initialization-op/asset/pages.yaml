  md: "# Solution to the third coding problem, inline\n\nSolution to the Counted Type\
    \ problem. Run @Wandbox\n\n```\nstruct CountedType {\n    static inline int instanceCounter\
    \ = 0;\n    static inline int maxInstanceCounter = 0;\n\n    // simple counting...\
    \ only ctor and dtor implemented...\n    CountedType() {++instanceCounter; ++maxInstanceCounter;\
    \ }\n    ~CountedType() { --instanceCounter; }\n\n    CountedType(const CountedType&)\
    \ { ++instanceCounter; ++maxInstanceCounter; }\n};\n```\n\nThis solution implements\
