    > The fundamental rule is: use type deduction only to make the code clearer or
    safer, and do not use it merely to avoid the inconvenience of writing an explicit
    type. When judging whether the code is clearer, keep in mind that your readers
    are not necessarily on your team, or familiar with your project, types that you
    and your reviewer experience as unnecessary clutter will very often provide useful
    information to others. For example, you can assume that the return type of make_unique<Foo>()
