    # Initialization with aggregates


    Our structure is very simple, and for types, C++ has special rules where we can
    initialize their internal values with so-called aggregate initialization. We can
    use such syntax also for arrays. Here are some basic examples:


    Ex 1.3. Aggregate Initialization syntax. Run @Compiler Explorer


    ```

    // arrays:

    int arr[] = {1, 2, 3, 4};

    float numbers[] = {0.1f, 1.1f, 2.2f, 3.5f, 4.5f, 5.};

    int nums[10] = {1}; // and then all 0s


    // structures:

    struct Point { int x; int y;};

    struct Line { Point p1; Point p2; };

    Line LongLine {0, 0, 100, 100};

    Line anotherLine = {100}; // rest set to 0

    Line shortLine{{-10, -10}, {10, 10}}; // nested

    ```


    Summary, for the above code:


    +   - Each array element, or non-static class member, in order of array subscript/appearance
    in the class definition, is copy-initialized from the corresponding clause of
    the initializer list.'
