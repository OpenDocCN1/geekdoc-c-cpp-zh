  md: '# Appendix A - Rules for Special Member Function Generation


    +   - If a user declares a copy assignment, the compiler default constructor,
    destructor, and copy assignment are defaulted. The move constructor and move assignment
    are not declared.


    +   - If a user declares a move constructor, the compiler doesn''t declare the
    default constructor, and the destructor is defaulted. The move assignment is not
    declared. The most important part is that the copy constructor and the copy assignment
    operator are deleted.


    +   - If a user declares a move assignment, the compiler defaults a default constructor
    and destructor. The move constructor is not declared. The copy constructor and
    the copy assignment operator are deleted.


    # More functions provided


    In row, there''s only one "user-declared" function, but if your class type has
    more than one special member function declared, then you have to look at the intersection
    of the matching rows. For example, suppose you declare a default constructor and
    a move assignment. In case, the compiler will provide a default implementation
    for the destructor but will delete copy operations and not declare the move constructor.


    # Inheritance


    And how about base and derived classes?


    +   - A default constructor for a class T will be defined as deleted if T has
    a direct or virtual base that has a deleted default constructor, or it is ambiguous
    or inaccessible from this class.


    +   - A copy constructor for a class T will be defined as deleted if T has a direct
    or virtual base class that cannot be copied (has deleted, inaccessible, or ambiguous
    copy constructors).


    +   - A move constructor for a class T will be defined as deleted if T has a direct
    or virtual base class that cannot be moved (has deleted, inaccessible, or ambiguous
    move constructors).


    For example'
