  md: '# # 6. Type Deduction and Initialization


    Since C++11, we can write shorter code thanks to automatic type inference with
    auto or decltype keywords. Rather than specifying the full type for a new object,
    we can ask the compiler to deduce its type. In this chapter, we’ll discuss how
    “type deduction” affects initialization. We’ll also learn about the “AAA” rule
    - Almost Always Auto.


    # ## Deduction with auto


    One of the most prominent cases where auto type deduction can help is when you
    work with iterators or other “verbose” types. Before C++11, you had to specify
    the exact type of the iterator:


    ```

    std::map<std::string, int> mapping { ... };

    ::map<std::string, int>::iterator it = mapping.find("hello");

    ```


    ```

    std::vector<std::pair<int, double>> pairs { ... };

    ::vector<std::pair<int, double>>::const_iterator startIT = pairs.cbegin();

    ```


    C++11, you can ask the compiler to deduce the correct type:


    ```

    auto it = mapping.find("hello");


    auto startIT = pairs.cbegin();

    ```'
