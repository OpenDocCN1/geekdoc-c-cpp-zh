  md: "# Non-local objects\n\nDynamic memory management is very tricky, so it's best\
    \ to rely on RAII and smart pointers to clean the memory. The example above used\
    \ new and delete only to show the basic usage, but in production code, try to\
    \ avoid it. See more in those resources: 6 Ways to Refactor new/delete into unique\
    \ ptr - C++ Stories and 5 ways how unique_ptr enhances resource safety in your\
    \ code - C++ Stories.\n\nWe spoke about memory deallocation and resource handling\
    \ in the Destructor chapter; you can find more information here.\n\n# Initialization\
    \ of non-local static objects\n\nAll non-local objects are initialized before\
    \ main() starts and before their first “use”. There's more to that.\n\nConsider\
    \ the following code:\n\nEx 11.4. Static initialization. Run @CompilerExplorer\n\
    \n```\n#include <iostream>\nstruct Value { /*as before*/ };\ndouble z = 100.0;\n\
    int x;\nValue v{42};\n\nint main() {\n    puts(\"main starts...\");\n    std::cout\
    \ << x << '\\n';\n    puts(\"main ends...\");\n}\n```\n\nAll global objects z,\
    \ x, and v are initialized during the program startup before the main() starts.\
    \ We can divide the initialization into two distinct types: static initialization\
    \ and dynamic initialization.\n\nThe static initialization occurs in two forms:\n\
    \n> https://www.cppstories.com/2021/refactor-into-uniquptr/\nhttps://www.cppstories.com/2017/12/why-uniquptr/"
