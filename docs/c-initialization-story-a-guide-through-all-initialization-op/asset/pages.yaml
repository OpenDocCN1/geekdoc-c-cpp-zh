  md: "# Techniques and Use Cases\n\nI cut some parts of the code to make it shorter,\
    \ but basically GTEST_TEST_ is used in TEST macro and this will expand to a new\
    \ class. In the lower section, you might see a name MakeAndRegisterTestInfo. So\
    \ here's the place where the class registers!\n\nAfter the registration, the runner\
    \ knows all the existing tests and can invoke them.\nHere are the steps to implement\
