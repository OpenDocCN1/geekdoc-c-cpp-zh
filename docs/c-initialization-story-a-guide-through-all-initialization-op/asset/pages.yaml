  md: "# Rule of three (deprecated!)\n\nBefore C++11, when there were no move operations,\
    \ you could implement all special member functions:\n\n```\nclass OldRuleOfThree\
    \ {\npublic:\n    ~OldRuleOfThree();\n\n    OldRuleOfThree(const OldRuleOfThree&\
    \ other);\n    OldRuleOfThree& operator=(const OldRuleOfThree& other);\n};\n```\n\
    \nHowever, since C++11, you shouldn't use this pattern, as having a copy operation\
    \ declared won't declare the move operations. The lack of move operations will\
    \ \"slow down\" the code that uses those objects, as the compiler will be able\
    \ to copy data rather than optimize with move.\n\n# Rule of 5 and 6\n\nFor C++11\
    \ and above, if you implement a class that serves as a container or a manager\
    \ for a resource, then you probably need to implement all special member functions:\n\
    \n```\nclass RuleOfSix {\npublic:\n    RuleOfSix();\n    ~RuleOfSix() noexcept;\n\
    \n    RuleOfSix(const RuleOfSix& other);\n    RuleOfSix& operator=(const container&\
    \ other);\n\n    RuleOfSix(RuleOfSix&& other) noexcept;\n    RuleOfSix& operator=(container&&\
    \ other) noexcept;\n};\n```\n\nSee the following rule from the C++ Coding Guideline:\
    \ C.21: If you define or =delete any copy, move, or destructor function, define\
    \ or =delete them all.\"."
