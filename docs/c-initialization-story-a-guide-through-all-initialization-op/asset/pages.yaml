- img_proc: true
  md: "to the stack, then car is added. When the function goes out of scope, the stack\
    \ is cleared, taking elements in reverse order. So car is deleted first, and then\
    \ tvset. This is illustrated by the following diagram:\n\n![](img/fb0256f00863723666473966f8c0add1_90_0.png)\n\
    \nAdding and removing objects from the stack.\n\n# Objects allocated on the heap\n\
    \nIn the previous examples, I used objects created on the stack. For a clearer\
    \ picture of destructors, it's good to discuss a case when you have objects on\
    \ the heap. In that case, a destructor will be called only when the memory is\
    \ released via the delete operator.\n\nConsider the following snippet:\n\n```\n\
    {\n  Product* ptr = new Product(\"TV Set\", 123);\n}\n// !!\n```\n\nptr is a pointer\
    \ to an object allocated on the heap. But I didn't call delete, and thus, the\
    \ destructor wasn't be invoked! Moreover, I generated a memory leak since the\
    \ memory was not released. After the scope ends, ptr goes out of the scope, but\
    \ since it's a pointer, the memory is still present but not accessible.\n\nTo\
    \ fix the issue we have to call delete (for single elements) or delete [] (for\
    \ arrays)."
