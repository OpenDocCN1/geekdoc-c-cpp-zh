  md: '# 9. Containers as Data Members


    CarInfo, DataPacket, and Product types used relatively simple data members like
    integers, doubles, or strings. While std::string is, in fact, a container (of
    characters), we tend to use it as an elementary type. In this section, I''d like
    to discuss more complex data members like arrays, vectors, or maps. First, we''ll
    try to understand the syntax and ways of initializing them, and then you''ll learn
    about std::initializer_list.


    # The basics


    If you have a structure with various containers, here are some basic ways you
    can initialize them in a default constructor:


    Ex 9.1. The basic syntax for containers as data members. Run @Compiler Explorer


    ```

    #include <array>

    #include <iostream>

    #include <map>

    #include <string>

    #include <vector>


    struct S {

    : numbers { 1, 2, 3, 4 };

    //, nums { 1, 2, 3 };

    , doubles { 0.1, 1.1, 2.1 };

    , ints { 100, 101, 102 };

    , moreInts { 10, 1 } // 10 1''s, not 10 and 1

    , names { 10, "hello" } // 10 "hello" strings

    , mapping { "one", 1 }, {"two", 2 }

    }


    int numbers[4];

    // int nums[]; // need to provide the size!

    std::array<double, 3> doubles;

    ```'
