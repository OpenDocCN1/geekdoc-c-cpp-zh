  md: '# Type Deduction and Initialization


    +   - One potential downside of using automatic style in C++ is that it can make
    code less readable, especially for developers who are not familiar with the particular
    style being used. auto x = 42 might be harder to read than just a simple int x
    = 42.


    +   - Not all developers may be aware of the rules of automatic type deduction
    and thus they might introduce some errors or inefficiencies. For example (auto
    x : cont). The code is short, but it will create a copy for each element in a
    container. The correct form should use auto& x or even auto&& x.


    +   - Similarly assigning auto x = obj.get_with_reference() might cause an additionally
    copy when get_with_reference returns a reference to some internal data. In that
    case it''s essential to use auto&.


    +   - When the return type of some function changes in some radical way: for example
    from a value type to a reference, it can introduce unintended effects in the code
    that only uses auto val = func().


    # # Summary


    This chapter brought several interesting techniques when defining a new variable.
    Thanks to auto or decltype, you can ask the compiler to infer the type from the
    expression or an initializer. This might help you when a type has a long or complex
    name (for example, iterator) or when the type is unknown (like a type of a closure/lambda
    object). Also works similarly to template type deduction. it removes const or
    references from types appearing in the initializer. On the other hand, decltype
    can create an type based on other variables and expressions, including their value
    category. While auto and decltype were added in C++11, in C++17, we get a nice
    "extension" called structured bindings. Bindings can unpack pairs, tuples, and
    simple structures, leading to simpler syntax and more expressive code.


    > Since C++17, you can also rely on Class Type Deduction (CTAD). This feature
    allows you to write std::vector nums { 1, 2, 3 } and deduces the proper template
    parameter for the class template. Still, this topic goes beyond the book and won''t
    be covered. You can read more in books "C++ Templates: The Complete Guide (2nd
    Edition)" or articles: Class template argument deduction (CTAD) C++ reference¹,
    CTAD - What Is This New Acronym All About? @ACCU².


    ¹https://en.cppreference.com/w/cpp/language/class_template_argument_deduction

    ²https://accu.org/journals/overload/26/143/ord_265/'
