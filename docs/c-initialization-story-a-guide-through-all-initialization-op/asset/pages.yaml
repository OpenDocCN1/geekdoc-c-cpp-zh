  md: '# Techniques and Use Cases


    might optimize the code when it sees an object and not a reference. Moreover,
    strings are cheap to copy, the potential “slowdown” might not even be visible.


    All in all, passing by value and moving from a string argument is the preferred
    solution. You have made simple code and better performance for larger strings.


    As always, if your code needs maximum performance, then you have to measure all
    possible cases.


    The problem discussed in this section can be extended to other copyable and movable
    types. If the move operation is cheap, passing by value might be better than reference.
    You can also use automation, Clang-Tidy, which can detect potential improvements.
    Clang Tidy has a separate rule for that case; see clang-modernize-pass-by-value.


    Here’s the summary of string passing and initialization of a string member:


    | Input Parameter | const string& | string and move |

    |---|---|--|

    | const char* | 2 allocations | 1 allocation + move |

    | const char* SSO | 2 copies | 2 copies |

    | lvalue | 1 allocation | 1 allocation + 1 move |

    | lvalue SSO | 1 copy | 2 copies |

    | rvalue | 1 allocation | 2 moves |

    | rvalue SSO | 1 copy | 2 copies |


    This part covered only the basic approach with string references and string copies.
    We could also extend this discussion and cover the std::string_view added in C++17.
    If you want a complete comparison, see this blog post How to Initialize a String
    Member - C++ Stories.


    # Reducing extra copies through employ and in_place


    Since C++11, programmers got a new technique to initialize objects “in place”.
    This approach avoids unnecessary temporary copies and works with non-movable/non-copyable
    types.


    > *https://clang.llvm.org/extra/clang-tidy/checks/modernize-pass-by-value.html

    https://www.cppstories.com/2018/08/init-string-member/'
