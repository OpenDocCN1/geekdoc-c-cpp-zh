  md: '# Rules for auto type deduction


    We can summarize the rules for the auto in the following list of five cases:


    +   1. If the initializer is a constant expression, the type of the variable is
    deduced to be the type of the expression:


    ```

    auto num = 42;      // num is an int

    auto pi = 3.14;       // pi is double

    ```


    ```

    // special cases from string literal and nullptr;

    auto str = "hello world"; // str is const char*

    auto p = nullptr;        // p is std::nullptr

    ```


    +   2. If the initializer is an expression with a type that is not a reference,
    the type of the variable is deduced to be the type of the expression, with top-level
    cv-qualifiers removed:


    ```

    int num = 42;

    const int cnum = num;

    const int* pNum = &num;

    const int* const pCNum = &num;

    ```


    Using direct initialization:


    ```

    auto a { num };      // a is int

    auto a2 { cnum };     // a2 is int, const removed

    auto a3 { pNum };      // a3 is const int*

    auto a4 { pCNum };     // a4 is const int*, const removed

    ```


    The same deduction happens when you use copy initialization syntax:'
