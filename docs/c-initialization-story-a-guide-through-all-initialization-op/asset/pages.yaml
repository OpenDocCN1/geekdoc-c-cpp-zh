  md: "# Local Variables and Simple Types\n\nOnce the object is created and uninitialized,\
    \ we can access its members and set proper values. By default, struct has public\
    \ access to its members (and class has private access). This way, we can access\
    \ and change their values directly.\n\n# What is “Automatic Storage Duration”?\n\
    \nAll objects in a program have four possible ways to be “stored”: automatic,\
    \ static, thread, or dynamic. Automatic means that the storage is allocated at\
    \ the start of the scope, like in a function. Most local variables have automatic\
    \ storage duration (except those declared as static, extern, or thread_local).\
    \ We’ll discuss this more in the chapter on non-local objects.\n\n# Setting values\
    \ to zero\n\nYou might feel very unsatisfied after creating a CarInfo object,\
    \ most data members have indeterminate values. We can fix this and make sure the\
    \ data is at least set to “zero”. Have a look:\n\nEx 2. Value initialization for\
    \ the CarInfo structure. Run @Compiler Explorer\n\n```\nCarInfo emptyCar;\nstd::cout\
    \ << \"name: \" << emptyCar.name << \"\\n\";\nstd::cout << \"year: \" << emptyCar.year\
    \ << \"\\n\";\nstd::cout << \"seats: \" << emptyCar.seats << \"\\n\";\nstd::cout\
