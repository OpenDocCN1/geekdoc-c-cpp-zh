    Pointer to implementation is one of many examples where a pointer might be handy.

    can also list a few ideas:


    +   - Having a pointer to some cache. The cache might be created on demand and
    updated

    when needed.

    - Having a pointer to large buffers that won''t fit into the stack.

    - If the class requires some pointers for C-style libraries, like file handlers,
    sockets, OS

    objects, etc.


    In all of the above cases, the lifetime of the stored pointer is "inside" or wrapped
