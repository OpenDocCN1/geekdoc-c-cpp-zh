  md: '# Almost Always Auto


    AAA, or Almost Always Auto, is a coding style guideline that recommends the use
    of the auto keyword for declaring variables in C++. The idea behind this guideline
    is that using auto can make code easier to read and maintain by reducing the amount
    of boilerplate type information that needs to be written and maintained.


    The core syntax is:


    ```

    auto x = initializer; // including calling a function

    auto y = type{ init; }; // forcing a type

    ```


    For example:


    ```

    auto ptr = std::make_unique<Object>(/*...*/);

    auto ptrSh = std::make_shared<Widget>(/*...**);

    ```


    ```

    std::string computeName(int num) { /* */ };

    auto str = computeName(42);

    ```


    ```

    auto intro = std::string { "Hello World" };

    auto elapsed = 42s; // chrono literals, seconds

    auto strElapsed = "42s"; // std::string literal

    ```


    Ideally you can also post to indicate that an object''s change:


    ```

    const auto str = computeName(100);

    const auto factor = double { 10.1 };

    const auto arr = std::to_array({ 0, 2, 1, 3 });

    ```


    The term was popularized by Herb Sutter in GotW-94 post, GotW 93 and GotW 92¹.'
