  md: "# Copy and Move Operations\n\nProduct(Product&& other) noexcept\n  : id_(other.id_),\
    \ name_(std::move(other.name_))\n\nThe move implementation is similar to a copy\
    \ constructor, but we must pay attention to details. Since id_ is just an integer,\
    \ all we can do is copy the value. We cannot perform any optimizations here. For\
    \ the name_ member, we can initialize it with std::move(other.name_). We encounter\
    \ the first problem, other_name_ is a name, so not temporary (a temporary has\
    \ no name); we cannot move (take, steal) its contents. That is why the compiler\
    \ will interpret it as temporary by using the expression std::move(other.name_).\
    \ This will invoke the move constructor for std::string, and potentially, \"steal\"\
    \ the buffer from other_name_.\n\nThe move constructor must ensure that the other\
    \ object is left in an unspecified but valid state. In our case, we can see it\
    \ in the last line of the output. The old value: ends with nothing, so the string\
    \ was cleared.\n\n> Move constructors can be marked with explicit, but it's not\
    \ a common practice and might affect generic code that relies on implicit move\
