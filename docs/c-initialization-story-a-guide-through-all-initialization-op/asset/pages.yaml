  md: "# 3. Copy and Move Operations\n\nRegular constructors allow you to invoke some\
    \ logic and initialize data members when an object is created from a list of arguments.\
    \ C++ also has two special constructor types that let you control a situation\
    \ when an object is created using an instance of the same class type. Those constructors\
    \ are called copy and move constructors. Additionally, you can provide custom\
    \ assignment operators that the compiler calls when you assign new values to existing\
    \ objects.\n\n# ## Copy constructor\n\nA copy constructor is a special member\
    \ function taking an object of the same type as the first argument, usually by\
    \ a const reference.\n\nClassName(const ClassName&);\n\nTechnically it might have\
    \ other parameters, but they all have to have default values assigned, and in\
    \ practice, it's very uncommon.\n\nIt's called when you initialize an object using\
    \ a variable of the same type (through copy initialization or direct initialization),\
    \ and there's no better match (like a move constructor or a regular constructor).\n\
    \n```\nProduct base { 42, \"base product\" }; // an initial object\n\n// various\
    \ forms of initialization, where a copy constructor is called\nProduct other {\
    \ base }; // direct list initialization\nProduct another(base); // direct initialization\
    \ with parents\nProduct oneMore = base; // copy initialization\nstd::array<Product,\
    \ 3> arr = {base, other, oneMore}; // copy initialization\n\nProduct foo(Product\
    \ p) {\n    Product temp{\"from foo\", p.id};\n    return temp; // copy initialization\n\
    ```"
