  md: "# Initialization With Constructors\n\nC++ allows multiple constructors that\
    \ look like overloaded functions (they differ by the number or types of arguments).\
    \ Each constructor also has a regular function body where you can execute some\
    \ code; in our case, they are both empty for now. I also applied the explicit\
    \ keyword on the second constructor; we'll talk about it later in the explicit\
    \ constructors section.\n\nThe primary function of constructors is to perform\
    \ some actions at the start of a lifetime of an object. Usually, it means data\
    \ initialization, resource allocation (opening a file, a socket, memory allocation),\
    \ or even doing some logic (like logging).\n\nIn our case, constructors touch\
    \ only data members inside a special section of constructors called member initializer\
    \ list: like, id_{-1}, name_{\"none\"}. Inside this initializer list, we can also\
    \ call constructors of base classes (if any). Later, we will address inheritance\
    \ in the Inheritance section.\n\nThe member initializer list is more efficient\
    \ than using the body of a constructor. Sometimes it's the only option to initialize\
    \ the value, as with types that are not assignable. See the following and wrong\
    \ alternative:\n\n```\nclass Product {\npublic:\n    Product() { id_ = 0; name_\
    \ = \"none\"; } // bad code, only for illustration\nprivate:\n    int id_;\n \
    \   std::string name_;\n};\n```\n\nThe code will yield the same values for data\
    \ members as in the previous example, but the data members are set in two steps\
    \ rather than one. With the member initializer list, data members are set directly,\
    \ same as calling: int id_{0} or std::string name_{\"none\"}. On the other hand,\
    \ if we use assignment in the constructor body, it requires two steps:\n\n```\n\
    // step 1: default init:\nint id_, // indeterminate value!\nstd::string name_;\
    \ // default ctor called\n// step 2: assignment:\nid_ = 0;\nname_ = \"none\";\n\
    ```"
