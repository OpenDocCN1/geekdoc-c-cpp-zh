  md: '# Type Deduction and Initialization


    ```

    auto b = num;      // b is int

    auto b2 = cnum;    // b2 is int, const removed

    auto b3 = pnum;     // b3 is const int*

    auto b4 = pCnum;    // b4 is const int*, const removed

    ```


    3. If the initializer is an expression with a type that is a reference, the type
    of the variable is deduced to be the type of the referred-to object, with top-level
    cv-qualifiers and references removed:


    ```

    int num = 42;

    int& rnum = num;

    const int& rnum = num;

    ```


    ```

    auto c { num };      // c is int

    auto c2 { rnum };     // c2 is int, ref removed

    auto c3 { crnum };     // c3 is int, const and ref removed

    auto d = num;        // d is int

    auto d2 = rnum;      // d2 is int, ref removed

    auto d3 { crnum };     // d3 is int, const and ref removed

    ```


    4. If the initializer is a braced-init-list, the type of the variable is deduced
    to be a std::initializer_list of the appropriate type:


    ```

    auto list = {1, 2, 3}; // list is std::initializer_list<int>

    auto one = { 1.1 };      // one is std::initializer_list<double>

    ```


    The copy initialization syntax generates the same results as direct initialization,
    but copy initialization generates initializer_list<T>:


    ```

    auto x { 42 };      // x is int

    auto y { 42 };      // y is int

    auto z = { 42 };     // z is initializer_list<int>!

    ```


    5. If the initializer is a lambda expression, the type of the variable is deduced
    to be a unique, unnamed function type:'
