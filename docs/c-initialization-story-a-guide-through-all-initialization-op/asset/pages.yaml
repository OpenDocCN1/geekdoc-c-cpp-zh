  md: "# Local Variables and Simple Types\n\n+   - You can use list initialization\
    \ for arrays, and when the number of elements is provided, the compiler will de-ce\
    \ the count.\n- If you pass fewer elements in the initializer list than the number\
    \ of elements in the array, the remaining elements will be value initialized.\
    \ For built-in types, it means the value of zero.\n- For structures, you can use\
    \ a single initializer list or nested one: the expansion will be recursive.\n\
    - If you provide fewer values than the number of data members in the aggregate,\
    \ then the remaining data members (in the declaration order) will be effectively\
    \ initialized.\n\nThe first bullet point says that each element is copy initialized.\
    \ We'll return to this topic and explain the difference between a copy vs. direct\
    \ initialization syntax once we know explicit constructors.\n\nFor our structure,\
