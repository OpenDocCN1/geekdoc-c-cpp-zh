  md: '# Summary and use cases


    This chapter covered destructors, a special member function invoked when an object
    ends its lifetime. In most cases, we can use this capability to properly clean
    up the object and deallocate resources we have used and have yet to release.


    For example, you allocate some memory when the object is created, and then the
    memory must be released to avoid memory leaks. Similarly, you can open a file
    or a database connection, and then you must ensure the file or the connection
    is closed when the object goes out of scope.


    Destructors are one of the best features of the C++ language as they provide a
    clear and welldefined point at where they are called. This is opposed to dynamic
    garbage collection that can work in the background, potentially slowing down the
    program and with less control over the process. Destructors are the critical element
    to a popular term in C++ called RAII (Resource Acquisition Initialization), coined
    by B. Stroustrup, the author of the C language. It states that holding a resource
    is a class invariant, and is tied to the object''s lifetime. Read more at Wikipedia.


    Fortunately, in Modern C++, there are fewer fewer places where you need custom
    destructors. For example, when your data members are standard containers (like
    std::vector<int>, or std::map<std::string, int>) in your classes, then you can
    rely on default destructors to do the job. Standard containers like std::vector<int>
    might allocate memory buffers, but they also manage buffer and release it properly,
    so you don''t need to take any action when using them in a class.


    > 17https://en.wikipedia.org/wiki/Resource_acquisition_is_initialization'
