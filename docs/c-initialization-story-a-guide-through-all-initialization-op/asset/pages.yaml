    \ that will be used to create a given class. The factory doesn't know how to create\
    \ a given type now, so we have to provide some proxy class to do it.\n\nFor the\
    \ interface we use ICompressionMethod:\n\n```\nclass ICompressionMethod {\npublic:\n\
    \    ICompressionMethod() = default;\n    virtual ~ICompressionMethod() = default;\n\
    \    virtual void Compress() = 0;\n};\n```\n\nAnd then the factory:\n\nThe factory\
    \ holds the map of registered types. The main point here is that the factory now\
    \ some method (TCreateMethod) to create the desired type (this is our proxy).\
    \ The name of a type and creation method must be initialized in a different place.\n\
    \nThe implementation of such factory:"
