  md: "# 2. Initialization With Constructors\n\nIn the previous chapter, you've seen\
    \ that C++ might treat simple structures with all public data members as an aggregate\
    \ class. Still, aggregates are insufficient if we want better data encapsulation\
    \ and a more complex class API. For full flexibility in C++, we can leverage constructors\
    \ that are special member functions invoked when an object is created.\n\n# A\
    \ simple class type\n\nAs a background example, let's create a type that will\
    \ hold some elementary network data. To complicate things, we'd like to compute\
    \ a checksum for the data part. Such a checksum might be handy for checking if\
    \ the data was transferred correctly across the Internet (read more @Wikipedia).\n\
    \nEx 2.1. Simple DataPacket class. Run @Compiler Explorer\n\n```\nsize_t calcChecksum(const\
    \ std::string& s) {\n    return std::accumulate(s.begin(), s.end(), @uz);\n}\n\
    class DataPacket {\n    std::string data_;\n    size_t checkSum_;\n    size_t\
    \ serverID_;\npublic:\n    const std::string& getData() const { return data_;\
    \ }\n    void setData(const std::string& data) {\n        data_ = data;\n    \
    \    checkSum_ = calcChecksum(data);\n    }\n    size_t getCheckSum() const {\
    \ return checkSum; }\n    size_t getServerID() const { return serverID_ }\n  \
    \  void setServerID(size_t serverID) { serverID_ = serverID; }\n};\n```\n\n> ^https://en.wikipedia.org/wiki/Checksum"
