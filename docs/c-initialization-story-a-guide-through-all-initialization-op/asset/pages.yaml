  md: '# Copy and Move Operations


    same happens for MyTypeθ, where we don''t provide any special member function,
    or for Type2, where we declare a default constructor, but we explicitly make it
    default, and thus it''s not user-provided.


    According to the C++ Standard¹¹³:


    > A trivial class is a class that is trivially copyable and has one or more eligible
    default constructors, all of which are trivial.


    And a trivially copyable class is:


    +   A trivially copyable class is a class:


    * that has at least one eligible copy constructor, move constructor, copy assignment
    operator, or move assignment operator,

    * where each eligible copy constructor, move constructor, copy assignment operator,
    and move assignment operator is trivial, and

    * that has a trivial, non-deleted destructor.


    Now, we have to understand a trivial special member function:


    For default constructors, see this section in the C++ Standard - class.default.ctor#¹¹³:


    +   A default constructor is trivial if it is not user-provided and if:


    * its class has no virtual functions and no virtual base classes, and

    * non-static data member of its class has a default member initializer, and

    * all the direct base classes of its class have trivial default constructors,
    and

    * for all the non-static data members of its class that are of type (or array
    thereof), each class has a trivial default constructor.


    Otherwise, the default constructor is non-trivial.


    ¹¹https://timsong-cpp.github.io/cppwpw/n4868/class.prop#1

    ¹¹https://timsong-cpp.github.io/cppwpw/n4868/class.default.ctor#3'
