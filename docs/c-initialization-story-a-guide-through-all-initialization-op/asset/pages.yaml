    \ Run @Wandbox\n\n```\nvoid foo();\n\nint main() {\n    foo();\n}\n```\n\nIf we\
    \ compile this code using the following command and order:\n\n```\n$ g++ prog.cc\
    \ -Wall -Wextra -std=c++2a -pedantic a.cpp b.cpp\n```\n\nWe'll get the following:\n\
    \n100, 200\n\nBut if you compile b.cpp first and then a.cpp:\n\n```\n$ g++ prog.cc\
    \ -Wall -Wextra -std=c++2a -pedantic b.cpp a.cpp\n```\n\nYou'll get the following:\n\
    \n200, 400\n\nThere's a dependency of global variables: offset depends on center.\
    \ If the compilation unit with center were compiled first, the dynamic initialization\
    \ would be performed, and center would have 100, 200 assigned. Otherwise, it's\
    \ only zero-initialized, and thus offset has the value of 100, 200.\n\n> This\
    \ is only a toy example, but imagine a production code! In that case, you might\
    \ have a hard-to-find bug that does not come from some incorrect computation logic\
    \ but from the compilation order in the project!\n\nTo mitigate the issue, you\
    \ can apply constinit on the center global variable. This new keyword for C++20\
    \ forces constant initialization. In our case, it will ensure that no matter the\
    \ order of compilation, the value will already be present. What's more, as opposed\
    \ to constexpr we force initialization, and the variable itself is not constant.\
    \ You can change it later."
