    # Deduction with decltype


    The decltype keyword (added in C++11) is used to determine the type of a variable
    or expression based on its declaration. This means that if you use decltype on
    a variable, it will return the type of that variable, including any cost or reference
    qualifiers. For example:


    ```

    int x = 10;

    decltype(x) y = 20; // y is int

    ```


    ```

    const int z = 30;

    decltype(z) w = 40; // w is const int

    ```


    One key difference between decltype and auto is that decltype will always return
    the exact type of the variable or expression, while auto will strip away cost
    and reference qualifiers.


    Another difference is that decltype can be used on expressions and variables,
    while auto can only be used on initializers. You can use decltype to determine
    the type of more complex expressions, such as function calls or template arguments.


    In short, if the argument for decltype is not an unparenthesized variable or unparenthesized
    class member access, we have three cases:


    +   1. if the value category of expression is xvalue, then decltype yields T&&,'
