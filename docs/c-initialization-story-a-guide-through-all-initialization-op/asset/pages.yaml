  md: '# Any negative sides of NSDMI?


    On the other hand, the feature has some limitations and inconveniences:


    +   - Using NSDMI makes a class not trivial, as the default constructor (compiler-generated)
    has to perform some work to initialize data members.


    +   - Performance: When you have performance-critical structures (for example,
    a Vector3D class), you may want to have an "empty" initialization code. You risk
    having uninitialized data members, but you might save several CPU instructions.


    +   - (Only until C++14) NSDMI makes a class non-aggregate in C++11. See the section
    after C++14 changes.


    +   - They have limitations in the case of auto type deduction and CTAD, so you
    need to provide the type of the data member explicitly.


    +   - You cannot use default initialization in a header file, any change can require
    recompiling dependent compilation units. This is not the case if the values are
    set only in an implementation file.


    +   - Might be hard to read if you rely on calling member functions or depend
    on other data members.


    # NSDMI summary


    Before C++11, the best way to initialize data members was through a member initialization
    list inside a constructor. Thanks to C++11, we can now initialize data members
    in the place where we declare them, and the initialization happens just before
    the constructor body kicks in. Such an approach makes it harder to leave data
    members in an uninitialized state. In many cases, it also reduces the need to
    write user-defined constructors that would only set default values.


    In the chapter, we covered syntax, how it works with various types of constructors
    and its limitations. You also saw changes in C++14 (aggregate classes) and missing
    bitfield initialization in C++20.


    The C++ Core Guidelines advise using NSDMI in at least two sections: C++ Core
    Guidelines - C.48;


    > *https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c48-prefer-in-class-initializers-to-member-initializers-in-constructors-for-constant-initializers'
