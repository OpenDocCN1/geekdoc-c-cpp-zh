    \ (from C++17)\n- std::span(from C++20)\n\nHowever, we can also use pointers internally\
    \ in a class and don’t take or expose them\ndirectly. One of the best examples\
    \ is a pointer to implementation, called pimpl as a popular\nabbreviation⁴.\n\n\
    Here’s one version of the pattern and raw pointers:\n\n> PIMPL is often used to\
    \ reduce compilation times, and in C++20, this might not be needed of modules.\
    \ Still, PIMPL\n be handy when you want to hide the implementation details and\
    \ protect against ABI changes completely."
