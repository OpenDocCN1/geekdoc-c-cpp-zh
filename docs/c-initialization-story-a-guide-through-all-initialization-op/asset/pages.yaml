  md: "# Moveable only types\n\n```\nclass MoveableOnly {\npublic:\n    MoveableOnly()\
    \ noexcept;\n    ~MoveableOnly() noexcept;\n\n    MoveableOnly(MoveableOnly&&\
    \ other) noexcept;\n    MoveableOnly&& operator=(MoveableOnly&& other) noexcept;\n\
    };\n```\n\nNote that in the above case, because we declare move operations, then\
    \ the compiler will delete copy operations:\n\n```\n// MoveableOnly(const MoveableOnly&)\
    \ = delete;\n// MoveableOnly& operator=(const MoveableOnly&) = delete;\n```\n\n\
    Example types: std::unique_ptr.\n\n# Polymorphic base classes\n\n```\nclass BasePoly\
    \ {\npublic:\n    virtual ~BasePoly() = default;\n    BasePoly& operator=(BasePoly&&\
    \ other) = delete;\n\n    virtual void foo();\n}\n```\n\nBy declaring move assignment,\
    \ we prevent copy operations (they will be deleted); the move constructor is not\
    \ declared. But we have to explicitly introduce a virtual destructor because,\
    \ by default, the compiler creates only a non-virtual destructor."
