    Above the first case, it creates a temporary pointer with a copy of the str object.
    In the second case, there''s no extra string copy, and the pointer is created
    from the "Name" string literal. In both cases, the string object is allocated
    on the heap, so even if the function ends, the pointer will still be valid.


    Of course, you can still write the following code:


    ```

    // bad idea:

    std::string str { "Name" };

    SaferWrapper w { std::unique_ptr<std::string>(&str) };

    ```


    But in this case, the unique pointer will point to some local object, and when
    it goes out of scope, it will be invalid. As you can see, unique_ptr gives us
    a safer technique, but still, you need to pay attention when you create it.


