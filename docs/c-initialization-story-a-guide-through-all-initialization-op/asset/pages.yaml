  md: "# Type Deduction and Initialization\n\nOn the other hand, if you try writing:\
    \ void fooVec(vector<int>& vec) { }, then the compiler will report an error about\
    \ binding a non-const lvalue reference of type vector<int>& to an rvalue of type\
    \ std::vector<int>.\n\nGoing back to loops, we also have to consider a more complicated\
    \ case:\n\nEx 6.4. Loops and UB in C++20. Run @Compiler Explorer\n\n```\nauto\
    \ getVec() {\n  std::vector<std::vector<int>> ints {{1, 2}, {3, 4}, {5, 6}};\n\
    \  return ints;\n}\n```\n\n```\nint main() {\n  for (auto& i : getVec()[1]) {\n\
    \    std::cout << i;\n}\n```\n\nThis code compiles as C++20, but it's Undefined\
    \ Behaviour! It may crash, print garbage, or even pretend to work fine.\n\nThe\
    \ reason for this situation that we try to bind:\n\n```\nauto& __range = getVec()[1];\n\
    ```\n\nBut in the above expression, we have two temporary objects: one vector\
    \ from getVec() and its [1] sub \"range\". C++20 rules only extend the lifetime\
    \ of [1], and when the expression ends with a semicolon, the big vector extends\
    \ its lifetime.\n\nTo have a better solution, we have to store the \"big vector\"\
    \ outside:\n\n```\nfor (auto temp getVec(); auto& i : temp[1]) {\n  std::cout\
    \ << i;\n```\n\n> This section specifically stressed the C++20 version, as in\
    \ C++23, a range-based loop will be much safer with temporary objects! In short,\
    \ all temporary objects part will extend their lifetime. See those accepted proposals:\
    \ P2644 and P2012 for more information."
