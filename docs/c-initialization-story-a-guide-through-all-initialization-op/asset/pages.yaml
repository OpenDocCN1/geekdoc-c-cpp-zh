  md: "# Type Deduction and Initialization\n\n> **Guideline:** Remember that preferring\
    \ auto variables is motivated primarily by correctness, performance, maintainability,\
    \ and robustness—and only lastly about typing convenience.\n\nHere are some of\
    \ the key benefits of AAA in C++:\n\n+   - Improved readability: By using auto,\
    \ you can reduce the amount of repetitive type information in your code, making\
    \ it easier to read and understand.\n- Reduced maintenance overhead: With auto,\
    \ you don't need to update the type of a variable when it changes, as the type\
    \ will be automatically deduced from the initializer. This can save time and reduce\
    \ the risk of errors.\n- Better type safety: The rules for auto type deduction\
    \ in C++ are designed to ensure that the types of variables declared are correct\
    \ and consistent with the initializer. This can help prevent common errors, such\
    \ as assigning a value of the wrong type to a variable and implicit conversions.\n\
    - Ensuring initialization: You cannot leave an auto variable being not initialized.\n\
    \nThe term uses \"almost\", so here are the cases when you cannot use this syntax:\n\
    \n```\n// when a type consists of two or more names:\nauto number = long long\
    \ { 100 }; // syntax error\n```\n\n```\n// non static data member initialization\n\
    struct X {\n    auto val = int { 10 }; // syntax error\n}\n```\n\nAdditionally,\
    \ before C++17 you could not initialize things like std::mutex:\n\n```\nauto m\
    \ = std::mutex{};\n```\n\nSince mutex is not a movable type you couldn't use copy\
    \ initialization. But this limitation was lifted with C++17's mandatory copy elution.\n\
    \nWhile the AAA style has some benefits there's are some complains:"
