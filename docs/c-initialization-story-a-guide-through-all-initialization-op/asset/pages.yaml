  md: "Aggregates and Designated Initializers in C++20\n\n+   - designators can only\
    \ refer to non-static data members,\n- designators in the initialization expression\
    \ must have the same order of data members in a class declaration,\n  - this is\
    \ unlike the C language, where you can put designators in any order,\n- not all\
    \ data members must be specified in the expression,\n- you cannot mix regular\
    \ initialization with designators,\n- there can be only one designator for a data\
    \ member,\n- you cannot nest designators.\n\nHere's a simple example that illustrates\
    \ the main errors with designated initializers:\n\n```\nstruct Date {\n  int year;\n\
    \  int month;\n  int day;\n  static int mode;\n};\n```\n\n```\nDate d { .mode\
    \ = 10 }; // error, mode is static!\nDate d { .day = 1, .year = 2010 }; // error,\
    \ out of order!\nDate d { 2050, .month = 12 }; // error, mix!\n```\n\nThe code\
    \ above illustrates several cases where designated initializers won't work: static\
    \ data member, use out-of-order initialization, or a mix. In all cases, the compiler\
    \ generates an error.\n\n# Advantages of designated initialization\n\n+   - Readability:\
    \ A designator points to the specific data member, so it's impossible to make\
    \ mistakes here.\n- Flexibility: You can skip some data members and rely on default\
    \ values for others.\n- Compatibility with C: In C99, it's popular to use a similar\
    \ form of initialization (although even more relaxed). With the C++20 feature,\
    \ it's possible to have very similar code and share it.\n- Standardization: Some\
    \ compilers, like GCC or Clang, already had some extensions for this feature,\
    \ so it's a natural step to enable it in all compilers."
