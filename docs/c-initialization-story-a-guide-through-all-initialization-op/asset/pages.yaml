  md: "# 8. Non-Static Data Member Initialization\n\nYou've learned a lot of techniques\
    \ related to constructors! You can initialize data members in various constructors,\
    \ delegate them to reuse code, and inherit them from base classes. Yet we can\
    \ still improve on assigning default values for data members. I mentioned this\
    \ feature in the first chapter, where we gave default values for aggregates. We\
    \ can do the same for classes. Now we'll look at the full syntax and options related\
    \ to this feature.\n\nPlease have a look at the example below:\n\nEx 8.1. NSDMI\
    \ Basics. Run @Compiler Explorer\n\n```\nclass DataPacket {\n    std::string data_\n\
    \    size_t checkSum_ { };\n    size_t serverId_ { };\n\npublic:\n    DataPacket()\
    \ = default;\n    DataPacket(const std::string& data, size_t serverId)\n     \
    \   : data_{data}, checkSum_{calcCheckSum(data)}, serverId_{serverId}\n    {}\n\
    \    // getters and setters\n};\n```\n\nAs you can see, the data members have\
    \ their default values set at the point of declaration. There's no need to assign\
    \ default values inside constructors. This feature is much better than a default\
    \ constructor because it combines declaration and initialization code. This way,\
    \ it's harder to leave data members uninitialized!\n\nLet's explore this handy\
    \ feature of Modern C++ in detail.\n\n# How it works\n\nThis section shows how\
    \ the compiler “expands” the code to initialize data members."
