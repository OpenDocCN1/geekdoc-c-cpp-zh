  md: "# Virtual destructors and polymorphism\n\nThere's also one feature of destructors\
    \ that plays an essential part in inheritance and polymorphism.\n\nAccording to\
    \ Wikipedia?:\n\n> In programming language theory and type theory, polymorphism\
    \ is the provision of a single interface to entities of different types or the\
    \ use of a single symbol to represent multiple different types.\n\nIn C++, the\
    \ definition means that if you have a pointer or a reference to a base class,\
    \ and when you call a member function, the compiler invokes an implementation\
    \ (if available) in the derived classes. C++ does this technique through virtual\
    \ functions. We can demonstrate it with the following code in C++:\n\nEx 5.4 Virtual\
    \ destructor, base class, incorrect. Run @Compiler Explorer\n\n```\nclass Product\
    \ {\npublic:\n    explicit Product(const char* name) : name_(name) {\n       \
    \ std::cout << name << '\\\\n';\n    }\n    ~Product() { std::cout << \" destructor...\\\
    n\"; }\nstd::string Name() const { return name_; }\n    virtual double CalculateMass()\
    \ const = 0;\nprivate:\n    std::string name_;\n};\n```\n\nThe above Product type\
    \ declares a virtual member function. We can declare derived classes and then\
    \ provide their implementation of that virtual member function. This allows the\
    \ compiler to call the proper function based on the type and give this “polymorphic”\
    \ semantics.\n\nHave a look:\n\n> 7https://en.wikipedia.org/wiki/Polymorphism_(computer_science)"
