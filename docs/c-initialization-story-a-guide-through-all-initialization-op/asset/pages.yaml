    \ the latest draft of C++: [basic.stcstatic2]*\n\n> If a variable with static\
    \ storage duration has initialization or a destructor with side effects, it should\
    \ not be eliminated if it appears to be unused, except that a class object or\
    \ its copy/move may be eliminated as specified in class.elision.\n\nSo the compiler\
    \ won't optimize these variables.\n\nSee the full example:\n\nEx 13.7. Factory\
