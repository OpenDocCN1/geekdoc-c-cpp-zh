  md: '| Non-static data member type | Default constructor | Copy constructor | Copy
    assign | Move constructor | Move assign |

    |---|---|---|---|---|--|

    | Copyable, assignable, regular* | Yes | Default | Default | Default | Default
    |

    | const | No, unless default value set | Default | Custom only | Default | Custom
    only |

    | Raw pointer | Yes | Default (shallow!) | Default (shallow!) | Default | Default
    |

    | std::unique_ptr | Yes | Custom only | Custom only | Default | Default |

    | std::shared_ptr | Yes | Default, shallow, but might be safe | Default, shallow,
    but might be safe | Default | Default |

    | Reference | No | Default (shallow!) | Custom only | Default | Custom only |

    | std::reference_wrapper | No | Default (shallow!) | Default (shallow!) | Default
    | Default |


    # Non-regular data members summary


    For example, when your class has a const data member, then the default constructor
    is not available (unless you assign some default value), the copy and the move
    constructors can be provided by the compiler, but default assignment operators
    are not available. “Custom only” means that the compiler cannot generate a default
    implementation, and the user has to provide some custom implementation.


    Having discussed other categories of non-static data members, we can now examine
    static data members. How to use them in Modern C++? See the next chapter.'
