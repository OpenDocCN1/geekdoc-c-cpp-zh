    from the declaration.


    Technically, in-class member initializers have been available since C++11, but
    aggregate types weren''t supported initially. In this section, we''ve only scratched
    the surface of this handy technique. See the dedicated chapter for this topic:
    Non-static data member initialization chapter.


    # Summary


    In this chapter, we covered some simple custom types and looked at ways to initialize
    our data members. We went from indeterminate values to zero initialization, and
    then we learned about aggregates and techniques to provide default values.


    Things to keep in mind:


    +   - Default initialization for objects and variables yields indeterminate values
    for built-in types or default-initialize complex types (like std::string and set
    it to an empty string). That''s why it''s essential to be sure your objects and
    simple variables are always initialized.


    +   - Value initialization like int x{}; for built-in types effectively yields
    zero initialization for them so that they will be zero (in their type).'
