  md: "# Non-local objects\n\nBefore C++17, you'd had to declare such variables in\
    \ a header file as extern, and provide their definition in one compilation unit.\
    \ Thanks to C++17, such a case is now greatly simplified.\n\nRead more about details\
    \ in this great post from Fluent C++: What Every C++ Developer Should Know to\
    \ (Correctly) Define Global Constants¹².\n\n# constexpr and inline variables\n\
    \nThroughout the book, we briefly spoke constexpr variables. They are convenient\
    \ for built-in types like integers and other trivial types. When you apply this\
    \ keyword to a variable, the compiler might compute its value at compile time\
    \ and save time at runtime.\n\nThe compiler automatically implies inline when\
    \ you have a static constexpr member in your class type. See the following example:\n\
    \n```\nstruct Value {\n    static constexpr int basic { 10 };\n    static constexpr\
    \ auto name = \"Hello World\";\n};\n```\n\nWhen we run this code through C++Insights\
    \ (@this link¹³), we'll see that the compiler applied inline to both of these\
    \ variables:\n\n```\nstruct Value {\n    inline static constexpr const int basic\
    \ = {10};\n    inline static constexpr const char *const name = \"Hello World\"\
    ;\n};\n```\n\nPlease remember that implicit inline applies only to static class\
    \ data members. The compiler won't do anything when you declare a global static\
    \ constexpr variable.\n\n# Summary\n\nHere are the essential items to remember\
    \ from this chapter:\n\n+   ¹²https://www.fluentcpp.com/2019/07/23/how-to-define-a-global-constant-in-cpp/\n\
    ¹³https://cppinsights.io/s/a76b8133"
