  md: "# About static data members\n\nIn general, each and every instance (object)\
    \ of a class has non-static data members as its own data fields. Each example\
    \ is separate from the other. If we consider a type (class) representing a Fruit\
    \ and it has a data member named \"mass\", then each particular instance of Fruit\
    \ class has a \"mass\" member belonging to it. If we have 10 Fruit objects, the\
    \ \"mass\" data member is replicated ten times. On the other hand, each type can\
    \ also have static members that are not bound to any instance of the class. In\
    \ the case of our Fruit class, we can specify a so-called static variable \"default\
    \ mass\", accessible to each Fruit instance, and it wouldn't be part of any instance.\
    \ In other words, it's like a global variable in the namespace of the Fruit type.\n\
    \nConsider the following example:\n\nEx 11.5. Simple static Member. Run @Compiler\
    \ Explorer\n\n```\n#include <iostream>\nstruct Value {\n    int x;\n    static\
