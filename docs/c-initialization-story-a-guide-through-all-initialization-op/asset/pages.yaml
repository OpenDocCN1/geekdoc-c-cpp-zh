  md: "# Static variables in a function scope\n\nAs you may know, C++ also offers\
    \ another type of static variable: those defined in a function scope:\n\n```\n\
    void foo() {\n    static int counter = 0;\n    ++counter;\n}\n```\n\nAbove, the\
    \ counter variable will be initialized and created when foo() is invoked the first\
    \ time. In other words, a static local variable is initialized lazily. The counter\
    \ is kept “outside” of the function's stack space. This allows, for example, to\
    \ keep the state, but limit the visibility of the global object.\n\nEx 11.8. Counter\
    \ as a static variable. Run @Compiler Explorer\n\n```\n#include <iostream>\n```\n\
    \n```\nint foo() {\n    static int counter = 0;\n    return ++counter;\n}\n\n\
    int main() {\n    foo();\n    foo();\n    foo();\n    auto finalCounter = foo();\n\
    \    std::cout << finalCounter;\n}\n```\n\nIf you run the program, you'll get\
    \ 4 as the output.\nStatic local variables, since C++11, are guaranteed to be\
    \ initialized in a thread-safe way. The object will be initialized only once if\
    \ multiple threads enter a function with such a variable. Have a look below:"
