  md: '# Initialization With Constructors


    ```

    std::vector<int> vec1 { 1, 2 }; // holds two values, 1 and 2

    std::vector<int> vec2 ( 1, 2 ); // holds one value, 2!

    ```


    Above you can see a very similar declaration of vectors, but when used with list
    initialization, you end up with a different vector than when using direct initialization.
    The list version calls a special constructor taking initializer_list<int>, while
    the second calls a constructor taking size_type count, const int& = int().


    Additionally, for auto detection in C++14:


    ```

    auto i = 42; // i is an int with value 42

    auto j(42); // j is an int with value 42

    auto k{42}; // k is a std::initializer_list<int> until C++17!

    ```


    Fortunately, this “inconsistency” in C++17, and now auto k{42} deduces an int.
    See C++17 in details: fixes and deprecation @C++ Stories¹⁴


    C++ Core Guidelines sticking to this way of initialization, as its benefits outweigh
    the opposing sides. See ES.23¹⁵


    > ES.23: Prefer the {}-initializer syntax

    Reason: Prefer {}. The rules for {} initialization are simpler, more general,
    less ambiguous, and safer than for other initialization forms. Use = only when
    you are sure there can be no narrowing conversions. For built-in arithmetic types,
    use = only with auto. Avoid () initialization, which allows passing ambiguities.


    The guideline also mentions some exceptions:


    > Exception: For containers, there is a tradition for using [...] for a list of
    elements and (...) for sizes: vector<int> v(10); // 10 elements with the default
    value 0


    vector<int> v2{10}; // vector of 1 element with the value 10


    In this book, I’ll use {} for variable initialization and mention exceptions if


    ¹⁴https://www.cppstories.com/2017/05/cpp17-details-fixes-deprecation/#new-auto-rules-for-direct-list-initialization

    ¹⁵https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#es23-prefer-the--initializer-syntax'
