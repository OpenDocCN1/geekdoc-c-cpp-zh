  md: '# Copy and Move Operations


    Below you can find a basic illustration of this “growth” process:


    ![](img/fb0256f00863723666473966f8c0add1_66_0.png)


    On the diagram, the left-hand side, you can see the prods vector that has a memory
    buffer with all elements. The vector usually contains other data members, like
    size and capacity, but we’ll stick to the simple model. After inserting the first
    element, the buffer has a capacity for only one object and then to grow if we
    add more values. In the third line, you can see a new buffer with three elements
    but a “transparent” spot for a fourth line. Each time a buffer is recreated, it
    must copy/move existing elements.


    The reason for this technique is when the move constructor is not marked with
    except then the container is to be prepared for a case where it copies elements
    to a new buffer, and at some point, one operation throws. The only way to return
    to a safe situation is to abandon the copy. When move except is available, the
    vector implementation can assume that there’s no exception handling, and the moving
    will be “safe” for all elements. Other algorithms from the Standard Library, like
    std::sort, might also benefit from having noexcept guarantees on move operations.


    You can read more about this approach in C++ Core Guideline: C.66: Make move operations
    except?. And in this detailed article by Andrzej Krzemieński: Using except @Andrzej’s
    C++ blog."


    > *https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c66-make-move-operations-noexcept

    *https://akrzemi.wordpress.com/2011/06/10/using-noexcept/'
