  md: '# Copy and Move Operations


    after the expression completes (unless it''s assigned to a const or rvalue reference),
    we can steal resources from them safely. It doesn''t make sense in the case of
    built-in types like integers or floats, as we need to copy values anyway. But
    in the case of strings or memory buffers, we can avoid copy data and reassign
    the pointers. The situation is illustrated with the following diagram:


    after: hello + world


    ![](img/fb0256f00863723666473966f8c0add1_61_0.png)


    after msg object creation


    ![](img/fb0256f00863723666473966f8c0add1_61_1.png)


    Idea of a move constructor


    The diagram illustrates the state after computing hello + world and later when
    msg is initialized. The compiler creates a temporary object with a long string,
    stored in a buffer allocated outside the string. The string object has a pointer
    to buffer. Later, msg is created from that temporary object. We know that the
    object will expire so that we can reassign the pointers to the long string. The
    temporary object gets nullptr (conceptually, as the internal implementation might
    differ).


    Move constructors are a way to support the case with initialization from temporary
    objects. In many cases, they are an optimization over regular copy constructor
    calls. Additionally, they can be used to pass "ownership" of the resource, for
    example, with smart pointers.


    You can mark a regular object as expiring with the std::move function when you
    have a regular object with a name. This tells the compiler that the object''s
    value is no longer needed, so it''s safe to "steal" resources from it.


    Have a look at this example:


    > *The lifetime of a temporary object may be extended by binding to a const lvalue
    reference or to an rvalue reference. see https://en.cppreference.com/w/cpp/language/lifetime.'
