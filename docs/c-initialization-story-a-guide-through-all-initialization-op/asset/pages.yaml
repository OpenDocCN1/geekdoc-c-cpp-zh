  md: "# Techniques and Use Cases\n\n```\nDataPacket& operator=(DataPacket other)\
    \ noexcept {\n  using std::swap;\n  swap(data_, other.dataSum);\n  swap(checkSum_,\
    \ other.checkSum);\n  swap(serverID_, other.serverID);\n  std::cout << \"\\\"\
    Assignment for \\\"\" << << data_ << \"\\\"\\n\";\n  return *this;\n}\n```\n\n\
    The first striking thing to notice is that the operator takes DataPacket by value.\
    \ Before the operator's body, a fully initialized DataPacket object must be passed.\
    \ In other words, the compiler will call a copy or move constructor for that purpose.\
    \ Later we can use swap to exchange data members. Also using std::swap so that\
    \ the overload resolution can find all related swap functions, including those\
    \ from the std namespace cannot throw exceptions (as functions are usually marked\
    \ with noexcept) our assignment operator is safe and will not cause \"partially\
    \ assigned\"invalid objects. Additionally, since we have an object created in\
    \ the input argument, there's no need to check against == this. Let's invoke the\
    \ new assignment implementation:\n\n```\nDataPacket another { ... };\nDataPacket\
    \ newOne { ... };\nanother = newOne;\n```\n\nIn the above use case, the compiler\
    \ creates a copy of newOne and passes it as the another argument in the assignment\
