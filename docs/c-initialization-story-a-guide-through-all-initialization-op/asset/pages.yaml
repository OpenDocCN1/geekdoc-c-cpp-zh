    \ in separate scopes so that their lifetime ends when their scope ends. On the\
    \ other hand, if we have code:\n\n```\nint main() {\n    Product tvset(\"TV Set\"\
    , 123);\n    Product car(\"Mustang\", 999);\n}\n```\n\nBoth tvset and car share\
    \ the same lifetime scope so that we can expect the following output:\n\nTV Set,\
    \ id 123\nMustang, id 999\nMustang destructor...\nTV Set destructor...\n\nAs you\
    \ can see, the destructors are called in the reverse order of how they were created.\
    \ It’s because the stack is a LIFO structure (Last In, First Out). tvset was created\
    \ first and added"
