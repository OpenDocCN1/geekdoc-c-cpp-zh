  md: "# Body of a constructor\n\nAfter the member initializer list, each constructor\
    \ has a regular function body, { ... }, where you can perform additional steps\
    \ to modify variables or call other functions. The only difference between a regular\
    \ function and a constructor is that a constructor cannot return any values. Typically,\
    \ a constructor throws an exception to report an error.\n\nHere's a small example\
    \ of how to add some logging into a constructor body and throw an exception on\
    \ error:\n\nEx 2.7. Logging in a constructor. @Compiler Explorer\n\n```\n#include\
    \ <iostream>\n#include <stdexcept> // for std::invalid_argument\n\nconstexpr int\
    \ LOWEST_ID_VALUE = -100;\n\nclass Product {\npublic:\n    explicit Product(int\
    \ id, const std::string& name)\n        : id_(id), name_(name) {\n        std::cout\
    \ << \"Product: \" << id_ << \", \" << name_ << \"\\n\";\n        if (id_ < LOWEST_ID_VALUE)\n\
    \            throw std::invalid_argument(\"id lower than LOWEST_ID_VALUE!\");\n\
    \    }\n    std::string Name() const { return name_; }\nprivate:\n    int id_;\n\
    \    std::string name_;\n};\n\nint main() {\n    try {\n        Product car(10,\
    \ \"car\");\n        std::cout << car.Name() << \" created\\n\";\n        Product\
    \ box(-101, \"box\");\n        std::cout << box.Name() << \" created\\n\";\n \
    \   }\n    catch (const std::exception& ex) {\n        std::cout << \"Error -\
    \ \" << ex.what() << \"\\n\";\n    }\n```"
