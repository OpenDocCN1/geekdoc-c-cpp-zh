  md: "```\nclass CompressionMethodFactory {\npublic:\n    using TCreateMethod = unique_ptr<ICompressionMethod>(*());\n\
    public:\n    CompressionMethodFactory() = delete;\n    static constexpr bool Register(string_view\
    \ name, TCreateMethod createFunc) {\n        if (auto val = s_methods.at(name,\
    \ nullptr); val == nullptr) {\n            if (s_methods.insert(name, createFunc))\
    \ {\n                std::cout << name << \" registered\\n\";\n              \
    \  return true;\n            }\n        }\n        return false;\n    }\n    static\
    \ std::unique_ptr<ICompressionMethod> Create(string_view name) {\n        if (auto\
    \ val = s_methods.at(name, nullptr); val != nullptr) {\n            std::cout\
    \ << \"calling \" << name << \"\\n\";\n            return val();\n        }\n\
    \        return nullptr;\n    }\nprivate:\n    static inline constit Map<string_view,\
    \ TCreateMethod, 4> s_methods;\n};\n```\n\nNow we can implement a derived class\
    \ from ICompressionMethod that will register in the factory:"
