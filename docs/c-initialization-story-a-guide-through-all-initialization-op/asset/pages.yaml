  md: '# Non-local objects


    +   - Non-local objects have two fundamental properties: storage duration (where
    they are stored), and linkage (how we can access them).

    - When a non-local object is initialized with a constant expression and the object''s
    constructor is constexpr (including built-in types), the initialization may happen
    at compile time (static initialization).

    - If constant initialization (zero initialization) is not possible, then a static
    object is initialized in the dynamic initialization stage.

    - In a single translation unit, the order of dynamic initialization of non-local
    variables (including static data members) is performed in the definition order,
    but it''s unspecified across multiple compilation units.

    - A static data member is not bound to any class instances.

    - A static data member has a static storage duration and external linkage.

    - The compiler and the linker ensure there''s only one definition of an inline
    variable; there''s no need to define and declare such variables in different places.

    - The compiler automatically implies inline when you have a static constexpr member.'
