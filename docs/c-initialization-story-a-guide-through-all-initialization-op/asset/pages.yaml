  md: "Non-local objects\n\nAs an experiment, you can try commenting out the line\
    \ with x.v = 100. After the compilation, you won't see any Value constructor or\
    \ destructor calls. It's because the object is not used by any thread, and thus\
    \ no object is created.\n\nPossible use cases:\n\n+   - Having a random number\
    \ generator, one per thread\n- One thread processes a server connection and stores\
    \ some state across\n- Keeping some statistics per thread, for example, to measure\
    \ load in a thread pool.\n\n# Dynamic storage duration\n\nFor completeness, we\
    \ also have to mention dynamic storage duration. In short, by requesting a memory\
    \ through explicit calls to memory management routines, you have full control\
    \ when the object is created and destroyed. In most basic scenario you can call\
    \ new() and then delete:\n\n```\nauto pInt = new int{42}; // only for illustration...\n\
    auto pSmartInt = std::make_unique<int>(42);\nint main() {\n    auto pDouble =\
    \ new double { 42.2 }; // only for illustration...\n    use pInt...\n    use pDouble\n\
    \    delete pInt;\n    delete pDouble;\n}\n```\n\nThe above artificial example\
    \ showed three options for dynamic storage:\n\n+   - pInt is a non-local object\
    \ initialized with the new expression. We have to destroy it manually; in this\
    \ case, it's at the end of the main() function.\n- pDouble is a local variable\
    \ that is also dynamically initialized; we also have to delete it manually.\n\
    - On the other hand, pSmartInt is a smart pointer, a std::unique_ptr that is dynamically\
    \ initialized. Thanks to the RAII pattern, there's no need to manually delete\
    \ the memory, as the smart pointer will automatically do it when it goes out of\
    \ scope. In our case, it will be destroyed after main() shuts down."
