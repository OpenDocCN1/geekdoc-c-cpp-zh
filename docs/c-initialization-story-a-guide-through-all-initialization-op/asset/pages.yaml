  md: '# About the Book


    And there are two appendices:


    +   - Appendix A - a handy guide about rules for compiler-generated special member
    functions.

    - Appendix B - answers to quizzes and exercises.


    # Who is this book for?


    The book is intended for beginner/intermediate C++ programmers who want to learn
    various aspects of initialization in Modern C++ (from C++11 to C++20).


    You should know at least some of the basics of creating and using custom classes.


    This text is also helpful for experienced programmers who know older C++ standards
    and want to move into C++17/C++20.


    # Prerequisites


    +   - You should have basic knowledge of C++ expressions and primitive types.

    - You should be able to implement an elementary class with several data members.
    How to create and manipulate objects of such a class in a basic way.


