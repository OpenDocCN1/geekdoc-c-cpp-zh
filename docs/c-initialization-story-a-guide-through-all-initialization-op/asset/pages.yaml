    \ might grow 1.5x or 2x each time it has to resize. For example, it starts with\
    \ one element and a capacity of one, then elements and a capacity of 4, 5 elements\
    \ and a capacity of 6 or 8, and so on. This helps amortize the cost of adding\
    \ new values.\n\nNow, let's modify the move constructor and make it noexcept:\n\
    \nEx 3. Move on resize for std::vector. Run @Compiler Explorer\n\n```\nProduct(Product&&\
    \ other) : noexcept\n    id_(other.id_), name_{std::move(other.name_)} {\n   \
    \ std::cout << \"Product(move): \" << id_ << \", \" << name_ << '\\\\n';\n}\n\
    ```\n\nWhen we run the code, you'll see the following log:\n\n```\nProduct():\
    \ 101, car\nProduct(): 202, box\nProduct(move): 101, car\nProduct(): 303, toy\n\
    Product(move): 101, car\nProduct(move): 202, box\nProduct(): 404, mug\nProduct():\
    \ 505, pencil\nProduct(move): 101, car\nProduct(move): 202, box\nProduct(move):\
    \ 303, toy\nProduct(move): 404, mug\n```\n\nNow, the compiler calls a move constructor\
    \ rather than a copy! In many cases, this can be much faster than copying data,\
    \ as we can copy pointers rather than copying the entire content of a string.\
    \ It's implementation-dependent if the library uses that optimization technique,\
    \ but MSVC, GCC, and Clang library implementations stick to this rule."
