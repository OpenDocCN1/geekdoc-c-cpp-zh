  md: "```\nstruct Base {\n    Base(Base&&) = delete;\n};\n```\n\n```\nstruct Derived\
    \ : Base {};\n\nint main() {\n    Derived d; // won't compile\n}\n```\n\nThe above\
    \ code doesn't compile. We delete the move constructor from the Base class. This\
    \ means the move constructor in the Derived type is also deleted. In both types,\
    \ the default constructor is not declared and not accessible.\n\n# Rules\n\n#\
    \ Rule of zero\n\nIn most cases, defining a class without any special member functions\
    \ will work:\n\n```\nclass RuleOfZero {\npublic:\n    // no custom special member\
    \ functions...\n\n    // member functions...\n\n    // data members...\n};\n```\n\
    \nIn the above case, the RuleOfZero class has all special member functions implicitly\
    \ defined by the compiler.\n\nSee the following rule from the C++ Coding Guideline:\
    \ C.20: If you can avoid defining default operations, do*.\n\n> *https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c20-if-you-can-avoid-defining-default-operations-do"
