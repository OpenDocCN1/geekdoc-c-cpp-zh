  md: "# Difference between direct and copy initialization\n\nAfter addressing several\
    \ examples on explicit constructors, we can finally answer the differences between\
    \ direct vs. copy initialization.\n\nWe have two primary ways for initialization.\
    \ Copy:\n\n```\nint x = 42; // a form of a copy initialization\n\nvoid foo(int\
    \ param) { \nfoo(x); // copy initialization is performed on the argument\n\nint\
    \ anotherFoo() { return 42; } // a copy initialization is done on the return value\n\
    \nstruct Point { int x; int y; };\nPoint pt { 0, 1 }; // aggregate initialization\n\
    Point p2 = { 10, 11 }; // uses copy initialization for each element\n```\n\nAnd\
    \ here's the basic syntax for the direct initialization:\n\n```\nint y {42}; //\
    \ a form of a direct initialization\ndouble z (42.2); // direct with parens\n\
    ```\n\nIn summary:\n\n+   - Direct initialization behaves like a function call\
    \ to an overloaded function: The functions, in this case, the constructors of\
    \ the type (including explicit ones). Overload resolution will find the best matching\
    \ constructor and, when needed, do any implicit conversion required.\n- Copy initialization\
    \ constructs an implicit conversion sequence: It tries to convert arguments to\
    \ an object of the given type. Explicit constructors are not considered for copy\
    \ initialization.\n\nFor example, since aggregate initialization uses copy initialization\
    \ to init subobjects, this code won't work:"
