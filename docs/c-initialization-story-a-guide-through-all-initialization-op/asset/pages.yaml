  md: '# Non-regular Data Members


    tvset = Product("TV Set 2022", 456);


    The line generates a compilation error! It''s because the compiler tries to invoke
    an assignment operator, but it''s impossible since one data member is constant.
    When one data member is const, the compiler won''t generate a default assignment
    operator for us. Such classes might also cause trouble in standard containers.
    Consider the following code:


    ```

    std::vector<ProdConst> prods;

    prods.push_back(ProdConst("box", 234));

    prods.push_back(ProdConst("car", 567));

    prods.insert(prods.begin(), ProdConst("ball", 987));

    ```


    While the push_back calls work fine (as the compiler successfully creates objects
    inside the container, there''s an issue with the insert(), which requires an assignment
    operator to be available.


    GCC might report the following error:


    error: use of deleted function ProdConst& ProdConst::operator=(ProdConst&&)


    You can experiment with this example @Compiler Explorer².


    The only way to fix the compiler error is to write a custom assignment operator.
    For example, you could copy mutable data members and "leave" constant members.
    The problem is that it''s pretty complicated. Moreover, it might be misleading
    to the reader, as it''s not easy to reason why it is changing.


    If you want your object to be constant, make it as a "whole" rather than just
    some of its parts.


    > You can read more about this semantic problem with constant data members in
    a good overview by Arthur O''Dwyer; see const all the things².


    We can summarize a class type with a const non-static data member as:


    +   • It will be default constructible when you assign a default value to the
    member (NDMI); otherwise, it won''t be default constructible.

    • The compiler can generate a copy and move constructors.

    • Default copy assignment and move assignment operators are blocked.'
