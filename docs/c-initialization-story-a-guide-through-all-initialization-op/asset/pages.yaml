  md: '# Techniques and Use Cases


    additional memory allocation''. That means moving a string is the same as copying
    it.

    And since the string is short, the copy is also fast.


    Let''s reconsider our example of passing value when the string is short:


    ```

    UserName u1{"John}; // fits in SSO buffer

    std::string s2{"Marc"}; // fits in SSO buffer

    UserName u2 { s2 };

    std::string s3{"Marc"}; // fits in SSO buffer

    UserName u3 { move(s3) };

    ```


    Remember that each move is the same as a copy in case of a short string.

    For const std::string&:


    +   - u1- two copies: one copy from the input string literal to a temporary string
    argument, then another copy into the member variable.

    - u2- one copy: the existing string is bound to the reference argument, and then
    we have one copy into the member variable.

    - u3- one copy: the rvalue reference is bound to the input parameter at no cost;
    later we have a copy into the member field.


    For std::string:


    +   - u1- two copies: the input argument is created from a string literal, and
    then there''s a copy into name_.

    - u2- two copies: one copy into the argument, and then there''s the second copy
    into the member.

    - u3- three copies: one copy into the argument (move means copy in this particular
    case), and then there''s the second copy into the member.


    As you see, short strings passing by value might be "slower" when you pass some
    existing string simply because you have two copies rather than one. On the other
    hand, the compiler


    > SSO is not standardized and prone to change. MSVC (2013 and above)/GCC (8.1
    and above) - it''s a buffer of 16 bytes, and the empty string has a size of 32
    bytes. It means a space for 15 characters of the char type, or for wchar_t. In
    Clang (6 and above when compiled with -std::libc++) the buffer may contain space
    for 22 characters of char but may only be a few characters for wchar_t. The size
    of an empty string is only 24 bytes. For multiplatform code, it''s not a good
    idea to assume optimizations based on SSO. Read more at this good: https://shahamrike.com/cpp-sso/'
