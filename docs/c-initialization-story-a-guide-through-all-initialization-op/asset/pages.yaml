    name: 0\nyear: 0\nseats: 0\npower (hp): 0\n```\n\nThe initialization with empty\
    \ braces {} is called value initialization and, by default (for built-in types\
    \ and classes with default constructors that are neither user-provided nor deleted),\
    \ sets data to “zero” (adapted for different types). This is similar to declaring\
    \ and defining the following variables: \n\n+   'chapterinlinevars"
