    Cracow in Southern Poland. He started his professional career in 2007 and in 2010
    he graduated from Jagiellonian University with a Masters Degree in Computer Science.


    Bartek currently works at Xara where he develops features for advanced document
    editors. He also has experience with desktop graphics applications, game development,
    large-scale systems for writing graphics drivers and even feedback. In the past,
    Bartek has also taught programming (mostly game and graphics programming courses)
    at universities in Cracow.


    Since 2011 Bartek has been regularly blogging at cppstories.com (started as bfilipek.com)
