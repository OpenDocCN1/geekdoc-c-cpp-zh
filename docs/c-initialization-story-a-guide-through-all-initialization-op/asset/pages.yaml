  md: "# Techniques and Use Cases\n\nAll in all, we get strong dependency between\
    \ the factory and the classes.\nBut if classes could register themselves? Would\
    \ that help?\n\n+   - The factory would just do its job: create new objects based\
    \ on some matching.\n- If you write a new class there's no need to change parts\
    \ of the factory class. Such class would register automatically.\n\nTo give you\
    \ more motivation I'd like to show one real-life example. When you use Google\
    \ Test library, and you write:\n\n```\nTEST(MyModule, InitTest) {\n  // impl...\n\
    }\n```\n\nBehind this single TEST macro a lot of things happen! For starters your\
    \ test is expanded into a separate class - so each test is a test. But, there's\
    \ a problem: you have all the tests, so how the test runner knows about them?\
    \ It's the same problem we're trying to solve in this section. The classes need\
    \ to be auto-registered.\n\nHave a look at this code: from googletest/../gister-internal.h³\n\
    \n```\n// (some parts of the code cut out)\n#define GTEST_TEST(test_case, test_name,\
    \ parent_class, parent_id) \\\nclass GTEST_TEST_CLASS_NAME(test_case_name, test_name)\
    \ \\\n  public: parent_class : \\\n    virtual void TestBody(){\nn    static ::TestInfo*\
    \ const test_info, GTEST_ATTRIBUTE_UNUSED_\\;\n  };\n\n::TestInfo* const GTEST_TEST_CLASS_NAME(test_case_name,\
    \ test_name) \\\n  :test_info_ = \\\n    ::internal::MakeAndRegisterTestInfo(\\\
    \\n      #test_case_name, #test_name, NULL, \\\n      new ::testing::internal::TestFactoryImpl\\\
    \n        (test_case_name, test_name));\\);\nvoid GTEST_TEST_CLASS_NAME(test_case_name,\
    \ test_name) : TestBody()\n```\n\n> ³https://github.com/googletest/blob/ea31cb15fc02ab9f5fb8i862311be522989d747/googletest/include/gtest/internal/gtest-internal.h#L1218"
