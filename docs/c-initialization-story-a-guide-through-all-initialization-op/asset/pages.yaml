  md: 'As of C++20, to initialize an aggregate object, you can write the following:


    Type obj = { .designator = val, .designator val2, ... };


    For example:


    ```

    struct Point { double x; double y; };

    Point p { .x = 10.0, .y = 20.0 };

    ```


    Designator points to a name of a non-static data member from our class, like .x
    or .y.

    One of the reasons to use this new kind of initialization is to increase readability.

    Compare the following initialization forms:


    ```

    struct Date {

    int year;

    int month;

    int day;

    };


    // new

    DateFutureCpp20 { .year = 2050, .month = 4, .day = 10 };

    // old

    DateFutureOldOld { 2050, 4, 10 };

    ```


    In the case of the Date class, it might be unclear what the order of days/month
    or month/days is. With designated initializers (inFutureCpp20), it''s very easy
    to see the order of data members.


    # Rules


    The following rules apply to designated initializers:


    +   - designated initializers work only for aggregate initialization, so they
    only support aggregate types,

    - designated initialization requires braces {} and doesn''t support C++20 initialization
    with parens ('
