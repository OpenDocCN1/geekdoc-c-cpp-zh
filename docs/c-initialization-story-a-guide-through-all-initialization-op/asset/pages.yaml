    \ classes and user-declared/user-provided default\nconstructors.\n\n# Explicit\
    \ constructors and conversions\n\nBefore we move on, it's essential to tackle\
    \ one important case: the explicit keyword, which\ncan be applied before a constructor\
    \ declaration.\n\nWhy is it important? And what does this keyword mean?\n\nIn\
    \ short, it prevents implicit conversions and might sometimes make code easier\
    \ to read.\n\nAs an experiment, let's start with the following code:\n\n```\n\
