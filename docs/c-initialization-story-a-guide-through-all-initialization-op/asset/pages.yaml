    ```\n\nIn the example, there's a function taking a std::initializer_list of integers.\
    \ Since it looks like a regular container, we can use non-member functions like\
    \ std::empty, use it in a range-based for loop, and check its size(). Please notice\
    \ that there's no need to pass const initializer_list<const&>(a const reference)\
    \ as the initializer list is a lightweight object, passing by value doesn't copy\
    \ the referenced elements in the \"hidden\" array.\n\nNote that we cannot do the\
    \ same with std::array as the parameter to a function would have to a fixed size.\
    \ initializer_list has a variable length; the compiler takes care of that. Moreover,\
    \ the \"internal\" array is created on the stack, so it doesn't require any additional\
    \ memory allocation (if you used std::vector). The list also takes homogenous\
    \ values, and the initialization downsallows narrowing conversions. For example:\n\
    \n```\n// foo({1, 2, 3, 4, 5.5}); // error, narrowing\nfoo({1, 'x', '0'}); //\
    \ fine, char converted to int\n```\n\nThere's also a handy case where you can\
    \ use range-based for loop directly with the initializer_list:"
