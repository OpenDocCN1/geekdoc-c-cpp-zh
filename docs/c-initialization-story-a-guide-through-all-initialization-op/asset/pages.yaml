    # Move constructor


    Move constructors take rvalue references of the same type. Usually, such a constructor
    has the following form:


    ```

    ClassName(ClassName&&) noexcept;

    ```


    Let''s try to decipher the full syntax.


    In short, rvalue references are temporary objects, usually appearing on the right-hand
    side of an expression, and whose value is about to expire.


    For example:


    ```

    std::string hello = "Hello Amazing"; // lvalue, a regular object

    std::string world = { "Programming World" }; // lvalue

    std::string msg = hello + world;

    ```


    Above, the expression + world creates a temporary object. It doesn''t have a name,
    and we cannot access it easily. Such temporary objects will end their lifetime
    immediately'
