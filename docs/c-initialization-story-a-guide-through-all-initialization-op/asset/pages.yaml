  md: '# # About the Book


    Initialization in C++ is a hot topic! The Internet is full of discussions about
    best practices, and there are even funny memes on that subject. The situation
    is not surprising, as there are more than a dozen ways to initialize a simple
    integer value, complex rules for the auto-type deduction, data members, and object
    lifetime nuances.


    And here comes the book.


    Throughout this text, you will learn practical options to initialize various categories
    of variables and data members in C++. More specifically, this teaches types of
    initialization, constructors, non-static data initialization, inline variables,
    designated initializers, and more. Additionally, you will see the changes and
    new techniques from C++11 to C++20 and lots of examples to round out your understanding.


    The plan is to explain most (if not all) parts of initialization, learn lots of
    excellent C++ techniques, and see what happens under the hood.


    # # Why should you read this book?


    With Modern C++ (since C++11), we have many new features to streamline work and
    simplify our code. One area of improvement is the initialization. Modern C++ added
    new initialization rules, trying to make it easy while keeping old behavior and
    compatibility (mainly from C language). Sometimes the rules might get confusing
    and complex, though, even the ISO committee might need to correct some things
    along the way. The book will help you navigate through these problems and understand
    this topic better. What''s more, initialization is just just one aspect of this
    text. You''ll learn all related topics around classes, constructors, destructors,
    object lifetime, or even how the compiler processes data at start-up.


    # # Learning objectives


    The goal is to equip you with the following knowledge:


    +   - Explain rules about object initialization, including regular variables,
    data members, and non-local objects.'
  merge: -1
  pgno: 6
- img_proc: true
  md: '+   - How to implement special member functions (constructors, destructors,
    copy/move operations) and when they are helpful.


    +   - How to efficiently initialize non-static data members using C++11 features
    like non-static data member initialization, inheriting, and delegating constructors.


    +   - How to streamline working with static variables and static data members
    with inline variables from C++17.


    +   - How to work with container-like members, non-copyable data members (like
    const members) or move-able only data members, or even lambdas.


    +   - What is an aggregate, and how to create such objects with designated initializers
    from C++20.


    # # The structure of the book


    The book contains 14 chapters in the following structure:


    +   - Chapters 1 to 5 to create a foundation for the rest of the book. They cover
    basic initialization rules, constructors, destructors, and the basics of data
    members.


    +   - Chapter 6 is a short quiz on constructors. You can check your knowledge
    from the first “part” of the book.


    +   - Chapter 7 (in progress): Type deduction.


    +   - Chapter 8 describes Non-static Data Member Initialization (NSDMI), a powerful
    feature from C++11 that improves how we work with data members. At the end of
    the chapter, you can solve a few exercises.


    +   - Chapter 9 discusses how to initialize container-like data members and how
    to handle them in a class. You''ll learn about const data members, unique_ptr
    as a data member, and references.


    +   - Chapter 11 describes static non-local variables, static objects, various
    storage duration options, and inline variables from C++17 and const from C++20.


    +   - Chapter 12 moves to C++20 and describes Designated Initializers, a handy
    feature based on similar thing from the C language.


    +   - Chapter 13 shows various techniques like passing strings into constructors,
    smart typing, CRTP class counter, Copy and swap idiom, and more.


    +   - Chapter 14 is the final quiz with questions from the whole book.'
