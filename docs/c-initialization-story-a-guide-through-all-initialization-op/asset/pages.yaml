    t lifetime of the parent class/object. It''s tricky but usually safer than when
    you rely on entities

    tally "outside" the object.


    > Raw pointers are usually tricky to use, so be careful or use smart pointers.


    In summary, a class type with a raw pointer non-static data member has the following

    properties:


    +   - It will be default constructible, but it''s best to assign some starting
    value to the pointer

