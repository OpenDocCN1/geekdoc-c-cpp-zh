  md: "# Destructors\n\n+   * An object can have a name,\n* An object has a storage\
    \ duration which influences its lifetime,\n* An object has a type,\n* Objects\
    \ can contain other objects, called subobjects. A subobject can be a member subobject,\
    \ a base class subobject, or an array element.\n\nHere's a basic scenario for\
    \ a destructor that handles a case where the lifetime of an object ends:\n\nEx\
    \ 5.1. A logging destructor. Run @Compiler Explorer\n\n```\n#include <iostream>\n\
    #include <string>\n\nclass Product {\npublic:\n    explicit Product(const char*\
    \ name, unsigned id)\n    : name_(name), id_(id) {\n        std::cout << name\
    \ << \" \" << id << \"\\n\";\n    }\n    ~Product() { std::cout << name_ << \"\
    \ \" destructor...\\n\"; }\n\n    std::string Name() const { return name_; }\n\
    \    unsigned Id() const { return id_; }\nprivate:\n    std::string name_;\n \
    \   unsigned id_;\n};\n```\n\nThe example contains the following special member\
    \ function:\n\n```\n~Product() { std::cout << name_ << \" \" destructor...\\n\"\
    ; }\n```\n\nThe syntax is unique as it has no parameters and has the ~ prefix.\
    \ You can also have only one destructor in a class. What's more, a destructor\
    \ doesn't return any value.\n\nNow, let's create two objects of type:"
