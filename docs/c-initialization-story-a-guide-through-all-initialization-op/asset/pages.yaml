  md: "# # 1. Local Variables and Simple Types\n\nLet’s start simple and ask, “what\
    \ is initialization?” When we go to the definition from [C++Reference], we can\
    \ read:\n\n> > Initialization of a variable provides its initial value at the\
    \ time of construction.\n\nWe can translate this definition to the following example:\n\
    \n```\nvoid foo() {\n  int x = 42;\n  // ... use 'x' later...\n}\n```\n\nAbove,\
    \ we have a function with a local variable. The variable is declared as integer\
    \ and initialized with the value 42. This is one of many ways you can assign initial\
