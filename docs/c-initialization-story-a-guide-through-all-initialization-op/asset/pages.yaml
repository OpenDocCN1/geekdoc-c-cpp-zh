  md: '# Copy and Move Operations


    For copy/move constructors, see this section in the C++ Standard - class.copy.ctor#11¹¹:


    > A copy/move constructor for class X is trivial if it is not user-provided and
    if:


    * class X has no virtual functions and no virtual base classes, and

    * the constructor selected to copy/move each direct base class subobject is trivial,
    and

    * for each non-static data member of X that is of class type (or array thereof),
    the constructor selected to copy/move is trivial;


    otherwise the copy/move constructor is non-trivial.


    As I mentioned, MyType0 and MyType2 are trivial because they have trivial default
    constructors and don''t violate any of the rules. MyType1 and MyType3 have empty
    constructors, but they are user-provided, so they cannot be trivial.


    We have some definitions, but what are the implications of those slight differences?


    +   * Trivial types occupy a contiguous memory area (including padding).

    * They are "mem-copyable", so you can convert them into a byte array and read
    it back.

    * Trivial types cannot be declared without an initializer.


    When a trivial type is zero-initialized¹⁶ (for example, through value initialization
    {}), its data members will also be zero-initialized¹⁷


    Let''s try some code:


    ¹⁵https://timsong-cpp.github.com/cppwp/n4868/class.copy.ctor#11

    ¹⁶https://en.cppreference.com/w/cpp/language/zero_initialization

    ¹⁷According to C++ Reference: The standard specifies that zero-initialization
    is not performed when the class has a user-provided or deleted default constructor,
    which implies that said default constructor is selected by overload resolution
    is not considered. All known compilers perform additional zero-initialization
    if a non-deleted defaulted default constructor is selected.'
