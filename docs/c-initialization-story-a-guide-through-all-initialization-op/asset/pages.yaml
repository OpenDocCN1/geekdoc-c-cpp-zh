    \    std::cout << \"sizeof(Value): \" << sizeof(Value) << '\\n';\n    std::cout\
    \ << \"v.x: \" << v.x << '\\n';\n    Value::y = 10;\n    std::cout << \"Value::y:\
    \ \" << Value::y << '\\n';\n}\n```\n\nWhen you run this program, you'll see the\
