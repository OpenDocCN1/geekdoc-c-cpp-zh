  md: "# Ex 9.3. A function taking initializer_list. Run @Compiler Explorer\n\n```\n\
    #include <iostream>\n#include <initializer_list>\n\nvoid foo(std::initializer_list<int>\
    \ list) {\n    if (!std::empty(list)) {\n        for (auto& x : list) {\n    \
