  md: "# Non-regular Data Members\n\n```\n// class.h\nclass MyClassImpl;\nclass MyClass\
    \ {\n    // special member functions;\n    void Foo();\nprivate:\n    MyClassImpl*\
    \ pImpl_ {};n};\n```\n\n```\n// class.cpp\nclass MyClassImpl {\npublic:\n    void\
    \ DoStuff() { /*...*/ }\n};\n\nMyClass::MyClass () : pImpl_(new MyClassImpl())\
    \ {}\n\nMyClass::MyClass() { delete pImpl_; }\n\nvoid MyClass::DoStuff() {\n \
    \   m_pImpl_->DoStuff();n}\n```\n\nIn short, we declare a pointer to some incomplete\
    \ type in the header file. A pointer has a well-defined size (usually 4 or 8 bytes),\
    \ so the compiler can adequately evaluate the size of the MyClass, even though\
    \ it points to some incomplete MyClassImpl.Inside the cpp file, we declare and\
    \ define the implementation class. This becomes a wrapper that calls the implementation\
    \ through that pImpl_. The main thing to notice is that the lifetime of the pointer\
    \ is strictly related to the lifetime of the parent class. The pointer to implementation\
    \ is not exposed, the clients of the class cannot change it directly, so it's\
    \ safe to use.\n\nWhile the compiler can create default copy and move operations,\
    \ these will produce “shallow” copies since the pointer will be copied bit by\
    \ bit. We must implement special member functions to allocate new pointers for\
    \ implementation objects properly.\n\nYou can read about all benefits of this\
    \ pattern in my article The Pimpl Pattern - what you"
