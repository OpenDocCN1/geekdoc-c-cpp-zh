  md: 'Non-local objects


    And the definition for the second property: linkage, extracted from [basic.link²]:


    > A name is said to have linkage when it can denote the same object, reference,
    function, type, template, namespace, or value as a name introduced by a declaration
    in another scope.


    We have several linkage types:


    | Linkage | Explanation |

    | --- | --- |

    | external linkage | External means that the name can be referred to from the
    scopes in the same or other translation units. Non-const global variables have
    external linkage by default. |

    | module linkage | Available since C++20. A name can be referred in scopes of
    the same module or module units. |

    | internal linkage | A name can be referred to from the same translation units.
    For example, a static, const, and constexpr global variables have internal linkage.
    |

    | no linkage | Cannot be referred from other scopes. |

    | language linkage | Allows interoperability between different programming languages,
    usually with C. For example, by declaring extern "C" |


    If we work with regular variables declared in a function''s scope, the storage
    is automatic, and there''s no linkage, but those properties matter for objects
    in a global or thread scope. In the following sections, we''ll try experiments
    with global objects to understand the meaning of those definitions.


