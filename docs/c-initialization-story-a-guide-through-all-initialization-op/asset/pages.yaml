  md: "# Techniques and Use Cases\n\n```\nclass ZipCompression : public ICompressionMethod\
    \ {\npublic:\n    virtual void Compress() override;\n\n    static unique_ptr<ICompressionMethod>\
    \ CreateMethod() {\n        return std::make_unique<ZipCompression>();\n    }\n\
    \    static string_view GetFactoryName() { return \"ZIP\"; };\nprivate:\n    static\
    \ inline bool s_registered =\nCompressionMethodFactory::Register(ZipCompression::GetFactoryName(),\n\
    \    CreateMethod());\n};\n```\n\nThe downside of self-registration is that there's\
    \ a bit more work for a class. As you can see we have to have a static CreateMethod\
    \ defined.\n register all we have is to define s_registered:\n\n```\nbool ZipCompression::s_registered\
    \ =\nCompressionMethodFactory::Register(ZipCompression::GetFactoryName(),\nZipCompression::CreateMethod());\n\
    ```\n\nThe basic idea for this mechanism is that we rely on static variables.\
    \ They will be initialized before main() is called.\nBecause the order of initialization\
    \ of static variables in difference compilation units is unspecified, we might\
    \ end up with a different order of elements in the factory container. Each name/type\
    \ is not dependent on already registered types in our example, we're safe here.\n\
    But what about the first insertion? Can we be sure that the Map is created and\
    \ ready for use?\nThat's why I implemented a special version of Map which have\
    \ a constexpr constructor (implicit) and thanks to constinit will be initialized\
    \ before s_registered is initialized (for some first registered class).\n\n> My\
    \ current implementation uses std::array which can be used in constant expressions.\
    \ We could potentially use std::map but it would be at the edge of Undefined Beheiour\
    \ so it's not guaranteed to work. In final code you can also experiment with std::vector\
    \ which got constexpr support in C++20."
