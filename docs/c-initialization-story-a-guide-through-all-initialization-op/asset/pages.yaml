  md: '# Non-Static Data Member Initialization


    > C.48 Prefer in-class initializers to member initializers in constructors for
    constant initializers:


    Reason: Makes it explicit that the same value is expected to be used in all constructors.
    Avoids repetition. Avoids maintenance problems. It leads to the shortest and most
    efficient code.


    And in C++ Core Guidelines - C.45⁷:


    > C.45Don''t define a default constructor that only initializes data members;
    use in-class member initializers instead


    Reason: Using in-class member initializers lets the compiler generate the function
    for you. The compiler-generated function can be more efficient.


    If you like to read more about NSDMI, I highly recommend reading the book “Embracing
    Modern C++ Safely”, chapter 2, page 318. There''s a whole section on advanced
    cases for this powerful C++ feature.


    ⁷https://isocpp.github.io/CppCoreGuidelines/CppCoreGuidelines#c45-dont-define-a-default-constructor-that-only-initializes-data-members-use-in-class-member-initializers-instead'
