  md: '# # Appendix A - Rules for Special Member Function Generation


    In the chapters about constructors and the destructor, we discussed when a compiler
    implicitly generates a given special member for a class type. In this appendix,
    you''ll see a handy summary of the rules and guidelines for most common use cases.


    # ## The diagram


    A C++ expert Howard Hinnant, a few years ago created a diagram³ with the rules:


    | Default constructor | Destructor | Copy constructor | Copy assignment | Move
    constructor | Move assignment |

    |---|---|---|---|---|---||

    | Nothing | defaulted | defaulted | defaulted | defaulted | defaulted | defaulted
    |

    | Any constructor | not declared | defaulted | defaulted | defaulted | defaulted
    | defaulted |

    | Default constructor | user declared | defaulted | defaulted | defaulted | defaulted
    | defaulted |

    | Destructor | defaulted | user declared | defaulted* | defaulted* | not declared
    | not declared |

    | Copy constructor | not declared | defaulted | user declared | defaulted* | not
    declared | not declared |

    | Copy assignment | defaulted | defaulted | defaulted* | user declared | not declared
    | not declared |

    | Move constructor | not declared | defaulted | deleted | deleted | user declared
    | not declared |

    | Move assignment | defaulted | defaulted | deleted | deleted | not declared |
    user declared |


    > ³diagram redrawn, with permission of Howard Hinnant.'
  merge: -1
