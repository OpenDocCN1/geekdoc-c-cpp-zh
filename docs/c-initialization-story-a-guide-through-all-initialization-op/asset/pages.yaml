  md: "# # 10. Non-regular Data Members\n\nThus far, we have spoken about mutable\
    \ non-static data members like integers, doubles, or strings. Such objects are\
    \ regular¹, meaning they are copyable, default constructible, and equally comparable.\n\
    \nHowever, you can also have other categories of objects in a class. For example,\
    \ a custom type might contain constant data members, pointers, references, or\
    \ movable-only fields like unique pointers, the compiler will have issues creating\
    \ default implementations for special member functions.\n\nIn this chapter, we'll\
    \ shed some light on such cases.\n\n# ## Constant non-static data members\n\n\
    Consider the following code with a const data member id:\n\nEx 10.1. A constant\
    \ data member. @Compiler Explorer\n\n```\n#include <iostream>\n#include <string>\n\
    \nclass ProductConst {\npublic:\n    explicit ProductConst(const char* name, unsigned\
    \ id)\n        : name_(name), id_(id) {}\n\n    const std::string& name() const\
    \ { return name_; }\n    void name(const std::string& name) { name_ = name; }\n\
    \    unsigned id() const { return id_; }\nprivate:\n    std::string name_;\n \
    \   const unsigned id_;\n};\n```\n\n> > Being regular is a well-defined term in\
    \ the C++ Standard, the std::regular concept at C++ Reference: https://en.cppreference.com/w/cpp/concepts/regular."
