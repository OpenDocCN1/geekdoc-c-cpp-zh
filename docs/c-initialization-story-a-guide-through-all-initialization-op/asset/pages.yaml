  md: '# Initialization With Constructors


    Special spec = 42; // doesn''t compile!


    This one doesn''t compile, the compiler would have to first convert the integer
    into Number and then into Special.


    Based on C++ Reference - copy initialization⁴:


    ```

    T object = other; If T is a class type, and the cv-unqualified version of the
    type of other is not T or derived from T, or if T is non-class, but the type of
    other is a class type, user-defined conversion sequences that can convert from
    the type of other to T (or to a type derived from T if T is a class type and conversion
    function is available) are examined and the one is selected through overload resolution.
    The result of the conversion, which is a prvalue of the cv-unqualified version
    of T if a converting constructor was used, is then used to direct-initialize the
    object.

    ```


    The key here is that the compiler can perform only one conversion step, and our
    example requires two steps. That''s why we''ll get an error. You can fix the code
    by making conversion explicit:


    Number n = 42;

    Special spec = n;


    See the not working code @Compiler Explorer⁵.


    From over.ics.user²⁶:


    | A user-defined conversion sequence consists of an initial standard conversion
    sequence followed by a user-defined conversion followed by a second standard conversion
    sequence |


