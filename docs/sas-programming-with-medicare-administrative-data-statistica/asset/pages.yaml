- pgno: 28
  md: '# Chapter 2: Introduction to the Medicare Program


    case, Medicare is a secondary payer, meaning that it may cover the remainder of
    the claim not paid by the Federal Black Lung Program but is not responsible for
    the primary payment of the claim.


    Limited and uncovered services, as well as cost-sharing payments, can be covered
    by supplemental insurance. Specifically, beneficiaries can acquire supplemental
    coverage from several sources: Medigap insurance policies, insurance sponsored
    by their employers, MA plans, and in some cases, Medicaid. Note that it is possible
    that claims are not filed with Medicare for medical services paid by the beneficiary
    out-of-pocket or by coverage other than Medicare. As we will see below, this means
    the user of Medicare administrative data may not be able to account for all services
    a Medicare beneficiary receives.


    # The Mechanics of Medicare


    Now that we better understand some of the basics of Medicare and Medicare coverage,
    we can discuss how beneficiaries receive services and how Medicare reimburses
    providers of those services.


    You probably have or have commercial health insurance of yours, and in some very
    basic ways it does not operate much differently than Medicare. When you go to
    the doctor for an examination, the physician that you submits a bill (called a
    claim) to your insurance company for reimbursement. The claim is usually submitted
    electronically and describes the services provided by the physician (in this case,
    let''s say a routine visit to the doctor, called an evaluation and management)
    and the charges for those services. Specifically, the claim describes you (e.g.,
    name, personal identifier, age, and sex), the provider of the service (e.g., name,
    provider identifier, and place of service), the date or dates of service, and
    details that describe the services performed, like procedure and diagnosis codes.
    When the insurance company receives the claim, it goes through an adjudication
    process payment is determined. If you meet your requirements by paying your deductible
    and coinsurance, your insurance company typically pays the remainder of the claim
    for eligible services (perhaps an amount adjusted to negotiated purchasing agreements)
    according to the terms of your you. Your health insurance able to pay these bills
    because it maintains a fund of money received for just purposes. This fund is
    derived from the premium payments made by you and other beneficiaries (and, in
    the case of for-profit insurance companies, the accumulations of profit). These
    premium payments are determined statistically by actuaries and take into account
    the projected risk associated with the level of health of pools of beneficiaries.


    Medicare operates in many of the same ways as commercial health insurance. When
    a beneficiary goes to the doctor, the provider submits a bill to Medicare Part
    B (similarly, if a Medicare beneficiary goes to the hospital, the provider submits
    a bill to Medicare Part A). Most of this is done electronically. The claim form¹
    contains details of the beneficiary and provider identifiers, dates of service,
    the procedures performed, and the patient''s diagnosis. The claim submission will
    go to the provider''s regional Medicare Administrative Contractor (MAC) for adjudication,
    processing, and payment. Once claims are paid, they are considered final action
    claims. Final action Medicare claims are stored in files available to the research
    community as Medicare administrative data. As you may have already inferred, the
    administrative files that are created from final'
