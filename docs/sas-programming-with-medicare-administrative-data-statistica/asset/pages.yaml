    # Presenting Rates of Diabetes and COPD


    Finally, let''s utilize our work that identified beneficiaries with diabetes or
    COPD by studying rates of these conditions in our population of continuously enrolled
    beneficiaries. This exercise provides a good example of results that provide a
    framework for additional analyses. For example, if there are a small number of
    beneficiaries with diabetes in our overall population, the population of a popular
    county state, or a population of beneficiaries attributed to a certain provider,
    we could surprise that some utilization and cost measurements may follow.


    In Step 10.5, we begin looking at rates of diabetes and COPD in our population
    of continuously enrolled beneficiaries by merging our file to contain a list of
    beneficiaries with COPD or diabetes with our population of continuously enrolled
    beneficiaries. In Step 9.1 through Step 9.4 presented in Chapter 9, we created
    a file called CND.DIA_COPD_COND. This file contains one record per beneficiary
    with either diabetes or COPD (both diabetes and COPD). Because this set contains
    records only for beneficiaries with diabetes or COPD, we must merge the file with
    our population of continuously enrolled beneficiaries to learn about the number
    of beneficiaries with diabetes or COPD in our'
