- pgno: 55
  md: '# Requesting Medicare Administrative Claims and Enrollment Data¹


    From scheduling and budget perspectives, it is very important to keep in mind
    that a data request can take a lot of time and cost a lot of money to fulfill
    (although there are ways to defray this cost for researchers). Therefore, it is
    important to plan as much as possible prior to initiating our data request that
    we minimize the likelihood of needing a re-extraction of missing files or variables.
    Because research programming involves an iterative process, we will never be perfectly
    certain that we have identified every data need. However, I have found that executing
    the kind of planning discussed in Chapter 4 not only minimizes the risk of rework
    but also improves the project''s ability to absorb rework if necessary. Therefore,
    now that we have determined our research project''s plan and spent some time thinking
    about the high-level requirements, we know enough about our project to request
    data. More to the point, we know the research questions we need to answer and
    the data we will use to answer those. We will use this information to guide our
    data request. Indeed, as we will see, the successful completion of our programming
    project requires requesting and using personally identifiable beneficiary-level
    claims and enrollment data.


    # Sources of Medicare Claims and Enrollment Data


    The data we need to complete our research programming project are not generally
    available to the public. We must obtain the data from CMS, a process that requires
    requesting, receiving, and loading the data. Recall that we have touched on the
    concept of Medicare administrative data sources in Chapter 3 in order to frame
    the discussion of the contents and structure of the Medicare claims and enrollment
    data we will use to complete our research programming project. We will now review
    and expand on that discussion.


    There are several routes to procuring Medicare data for research purposes.³ Depending
    on our source of funding, some routes may not be available to us. In the extreme
    case, employees of CMS have access to data from variety of internal sources, including
    CMS''s Data Extract System (DESY), CMS''s Virtual Research Data Center (VRDC),
    and the Integrated Data Repository (IDR). Researchers not employed by CMS, including
    federal contractors and academics, may also have access to DESY, the VRDC, and
    the IDR but, depending on the source of funding for their project, use of these
    sources may not be permissible. Contractors and academics may need to access Medicare
    claims and enrollment data by working with CMS''s Research Data Assistance Center
    (ResDAC) and CMS''s distribution


    So where are we going to get the data for our research programming project? From
    an instructional perspective, this is a tough question. Indeed, there are differences
    involved in using each of the sources that would be useful to know and what can
    influence programming techniques we discuss in this text. Here are some examples:


    +   - Submitting a request through ResDAC to be filled by CMS''s data distribution
    contractor involves planning for certain paperwork and delivery timeframes. Using
    DESY, the VRDC, or the IDR also involves certain planning activities, as acquiring
    a user account with CMS.'
