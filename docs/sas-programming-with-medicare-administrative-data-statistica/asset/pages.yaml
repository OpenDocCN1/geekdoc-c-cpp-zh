- pgno: 25
  md: '# SAS Programming with Medicare Administrative Data


    this understanding in conjunction with available reference materials. Some of
    the most commonly used sources of information are CMS''s Research Data Assistance
    Center (ResDAC), CMS, and the Kaiser Family Foundation.¹ In fact, these sources
    were heavily relied upon in the writing of this chapter!


    # An Introduction to the Medicare Program


    # What is Medicare?


    Medicare is a health insurance program for people age 65 or older, those under
    age 65 with certain disabilities, and those of any age with kidney kidney. The
    Medicare program protects beneficiaries from financial risk by covering costs
    for potentially large and unaffordable expenses incurred by seeking medical care.
    Generally, in order to be eligible for Medicare, beneficiaries must have entered
    the United States legally, paid Federal Insurance Contributions (FICA) taxes for
    40 or more quarters (or the spouse of someone has), and lived in the United States
    for 5 years.¹ Medicare is a social insurance program operated by the Centers for
    Medicare & Medicaid Services (CMS), a federal agency that is part of the Department
    of Health and Human Services. Medicare provides participants (called beneficiaries)
    with an health insurance coverage, regardless of income or medical history. Medicare
    provides four types of coverage (Part A, Part B, Part C, and D) that are described
    in detail below.


    Started in 1965 (did you know that President Truman was the first person to enroll
    in Medicare?), the Medicare program we know today (and will describe below), had
    its genesis in President Lyndon Johnson''s War on Poverty. Because Medicare is
    a social insurance program, enrollment criteria and benefits are defined by legal
    statute. This means that Medicare can differ from commercial health insurance
    in some fundamental ways. It also means that Medicare has changed over the years
    in response to changes in status, to expand or improve coverage or attempt to
    control costs. Here are some examples of how legislation has influenced the administration
    of the Medicare program³


    +   - In 1972, the Medicare program was expanded to include coverage for individuals
    with end-stage renal disease (ESRD) and some individuals under age 65 with long-term
    disabilities.

    - In the same year, coverage was also expanded to include speech, chiropractic,
    and physical therapy services.

    - In 1982, Medicare coverage was expanded to include hospice services for terminally
    ill individuals.

    - In 1997, the Balanced Act attempted to control Medicare spending through the
    creation of prospective payment systems (PPS) for certain types of services (though
    inpatient payment was first implemented in 1983), and established the Medicare+Choice
    program.

    - In 2001, Medicare initiated coverage for individuals with Lou Gehrig''s disease
    (ALS).

    - In 2003, the Medicare Prescription Drug Improvement, and Modernization Act (MMA)
    established an outpatient prescription drug benefit that would take effect in
    2006.

    - In 2005, coverage was expanded to include a physical and preventive screening
    to include new Medicare beneficiaries.'
