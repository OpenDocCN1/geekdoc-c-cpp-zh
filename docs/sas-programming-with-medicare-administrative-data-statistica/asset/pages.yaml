  md: '138 SAS Programming with Medicare Administrative Data


    # Production Execution in Batch


    As stated below, all programs should be executed in batch mode that the logs and
    lists have the same name as their parent program (a different file extension,
    of course). In addition, it is helpful to undertake a "production" execution of
    the code entails running each program in sequence without breaks so that the date
    and time stamps on the files are sequential. Depending on your operating system,
    executing code in batch can be as simple as "right clicking" on the file to execute
    and selecting the option to execute in batch. Upon completion, log and list files
    are generated automatically. The reader should carefully review the logs for errors,
    warnings, and uninitialized variables (this can be accomplished quite easily by
    performing a find on "error," "warning," and "uninitialized."). If the reader
    is operating in a UNIX environment, he or she can execute a script in UNIX to
    execute the code in batch. Prior to execution I recommend that the reader either
    delete data sets created during code development and testing process, or work
    in a partition of the system that does not contain data sets created during the
    development and testing process. This step is strongly recommended to avoid a
    development set (that may contain incorrect information) in your production run.
    As long as your code is pointing to an existing data set, SAS will input and use
    the set that the code points regardless of whether or not intend for it to do
    so.


    # Project Disposition


    Now that we have completed all of our programming, it is time to end your project.
    The disposition phase of the project is as important as any other part of our
    work. As we discussed in Chapter 4, project disposition involves creating a "package"
    that will stand the test of time, documenting our work for future reference. In
    addition, because our project uses personally identifiable Medicare data, project
    disposition also includes the destruction of project data as specified in our
    Data Use Agreement (DUA). Should we perform this task improperly, we may not be
    able to turn our work for future reference (which would be a real shame, considering
    all of the hard work we put into!). Even more importantly, the consequence of
    not adhering to our DUA is something we do not dare to contemplate!


    # Archiving Materials for Future Use


    Believe me, I have been here plenty of times. In this project, you are probably
    very tired of the subject matter, as you have been toiling a specific set of research
    questions and writing code. Nothing sounds better than shut down your computer
    and take a nap! I would want however, if you walk away now, you would be sorry.
    Picture this: fearless author, about one year after completing my first research
    programming project, searching for my hard drive in frustration for an algorithm
    I know is perfect for my current project. Unfortunately, that algorithm is nowhere
    to be found, lost to time and buried in a jungle of files on my hard drive! You
    can learn from my mistakes by reading the remainder of this chapter and thinking
    about the best way to recover your work so it becomes a future resource, and not
    a source of frustration.


    Our goals boils down to quite simple: document and save the work we just completed
    in a technical way that enables us to utilize it for future use. In addition,
    CMS owns the code, logs, lists, technical documentation, and data created for
    any project funded by CMS, so archiving may involve additional'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# Chapter 10: Presenting Output and Project Disposition 139


    work to transmit our archived materials to CMS. The following steps go a long
    way to completing our archiving goal:


    +   - All programs should contain complete inline documentation, and should be
    clearly named so sort in the order in which they run. For example, our code be
    separated into distinct programs named 05_ETL.sas(the work performed to load our
    data performed in Chapter 5), 06_Enrollment.sas(the enrollment work performed
    in Chapter 6), 07_Utilization.sas(the utilization work performed in Chapter 7),
    and so on.

    - All programs should be executed in batch mode so the logs and lists have the
    same name as their parent program. In addition, it is helpful to undertake a “production”
    execution of the code that entails running each program without breaks so that
    the date and stamp on the files are sequential.

    - All programs should be accompanied by technical documentation. Depending on
    your needs, technical documentation can be as simple as a listing of each program
    and its purpose, but as complex as an explanation of every step in each program
    and including flow diagrams. Much of this book be considered very comprehensive
    technical documentation for our code.

    - All output should be clearly labeled and saved with meaningful filenames.

    - All programs, logs, lists, technical documentation, and relevant output should
    be copied onto a CD-ROM or a DVD, being certain to follow the guidelines of DUA.
    Including a “readme” file is helpful for documenting all of the files included
    on the storage media. It is important to keep in mind that the act of burning
    onto storage media does not guarantee that will be preserved for time immaterial.
    Discs get scratched and hard drives break, so making a backup is highly recommended
    when contemplating long term storage of your work.


    # Data Destruction


    Most UAS require the destruction of all Personally Identifiable Information (PII)
    data and additional materials derived from PII data, even if those materials do
    not contain PII data themselves. Therefore, the first step in destroying the data
    is to become clear on exactly what data must be destroyed. The must destroy all
    files containing PII. For our example programming project, we will destroy all
    SAS data sets. The reader should check the details of his or her DUA. Common methods
    of destruction include shredding CDs or DVDs, erasure via degaussing of magnetic
    storage such as hard drives, and deleting data from hard drives, followed by overwriting
    the deleted files many times to ensure they cannot be recovered.


    # Chapter Summary


    In this chapter, we closed out our project by performing the following tasks:


    +   - We used the files created in Chapters 5 through 10 to present the results
    of our study.

    - We discussed the process for undertaking a final batch execution of all our
    programs.'
