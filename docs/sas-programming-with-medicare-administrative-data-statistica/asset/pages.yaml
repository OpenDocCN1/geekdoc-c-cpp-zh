- pgno: 128
  md: '# Chapter 9: Programming to Identify Chronic Conditions 113


    +   A beneficiary is also identified as having COPD in the presence of two or
    more relevant diagnoses

    found on separate outpatient or carrier claims. This evidence is found where COPD_OP_SUM
    or

    COPD_CARR_SUM is greater than or to two:


    ```

    * STEP 9.4: IDENTIFY BENEFICIARIES WITH DIABETES OR COPD USING SUMMED

    FLAGS */

    data cnd.dia_copd_cond(keep=bene_id dia_flag copd_flag);

    merge cnd_cnt_ip cc_cnt_sn cnd_cnt_op cc_cnt_hh cnd_cnt_carr;

    by bene_id;

    if dia_op_sum>=1 or dia_sn_sum>=1 or dia_hh_sum>=1 or

    if copd_ip_sum>=1 or copd_sn_sum>=1 or copd_hh_sum>=1 or

    if copd_sum>=2 or copd_carr_sum>=2 then copd_flag=1; else copd_flag=0;

    if dia_flag=1 or copd_flag=1;

    run;

    ```


    Beneficiaries with diabetes are assigned a value of 1 to the DIA_FLAG variable,
    and beneficiaries with

    COPD are assigned a value of 1 to the COPD_FLAG variable. We then de-duplicate
    our output data set

    by beneficiary. We have identified our subpopulation of beneficiaries with diabetes
    or COPD,

    contained in the outputted data set called CND.DIA_COPD_COND. Output 9.1 displays
    a print of the

    first 10 observations in the CND.DIA_COPD_COND data set.⁸'
