    Introduction and Goals


    In simple terms, chronic conditions are medical conditions which have some permanence
    and can progressively worsen over time, thus requiring long-term management to
    monitor or treat (e.g., control symptoms or otherwise influence the course of
    the condition). Chronic conditions are not curable by any short-term treatment,
    and can exhibit remissions and exacerbations.¹ Commonly identified conditions
    in the Medicare population include Alzheimer''s disease, asthma, chronic kidney
    disease, chronic obstructive pulmonary disease (COPD), depression, glaucoma, and
    certain types of cancer, like breast cancer or colorectal cancer.


    Chronic conditions are important to study for several reasons. First, many Medicare
    beneficiaries are identified as having at least one chronic condition. For example,
    roughly 4 Medicare beneficiaries are identified as having COPD and about 10 million
    beneficiaries are identified as diabetic.³ Second, beneficiaries with chronic
    conditions require a high level of specialized and concerted medical care, often
    resulting in the generation of many claims. In other words, utilization of services
    for beneficiaries with chronic conditions will be relatively higher than average,
    and cost may follow suit. Finally, beneficiaries identified as having chronic
    conditions are commonly used in the measurement of'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'quality outcomes because they benefit from certain standard medical practices.
    For example, diabetes benefit from annual dilated eye exams to monitor changes
    in the retina (retinopathy) that can seriously harm one''s vision. Studying whether
    a provider performs this on diabetic patients is a good way of measuring the quality
    of care provided by the doctor.


    In this chapter, we will advance our discussions from Chapter 7 and Chapter 8
    by providing more detail on how to measure quality outcomes. Specifically, we
    will combine the study of two chronic conditions, COPD and diabetes, with the
    concept of measuring patient outcomes. Admittedly, quality of care and value measurement
    are controversial topics, especially if the measurements play a role in the assessment
    of provider performance or the determination of payment. Indeed, patient outcomes
    (like hospital readmissions) often depend on things outside of providers'' control,
    like the behavior of the patient (e.g., does the patient exercise regularly, some
    or lately prescribed medications?) and the patient''s general level of health
    when he or she began. What''s more, some of these factors, whether or not a patient
    exercises regularly, cannot be measured with Medicare administrative claims data.


    Given the above, our goal in this chapter is not to make any determinations about
    quality of care; after all, we are using fake data for simulation purposes! Rather
    goal is to use our example research programming to teach the reader the mechanics
    of how to use Medicare data to identify chronic conditions and commonly used indicators
    of quality. By the end of this chapter, the reader will understand important foundational
    concepts to use Medicare administrative claims and enrollment data to identify
    any chronic condition or compute most any quality outcome metric. For example,
    we will discuss calculating readmissions and using diagnosis and procedure codes
    to identify a condition or an event related to quality outcome measurement (such
    as diabetic eye exams). The reader could adapt the measurement of eye exams for
    diabetics to examine a different procedure (say, an immunization for influenza)
    for diabetics with a different condition (such as heart failure). To these ends,
    in this chapter, we will code algorithms to the following:


    +   - Use Medicare administrative claims data to identify beneficiaries with two
    chronic conditions, diabetes and COPD.

    - Measure evaluation and management utilization for beneficiaries with diabetes
    or COPD.

    - Measure utilization of diabetic eye exams for beneficiaries with diabetes.

    - Measure hospital readmissions for beneficiaries with COPD.


    As discussed in earlier chapters, the online companion to this book is at http://support.sas.com/publishing/authors/gillingham.html.
    Here, you will find information on creating dummy source data, the code in this
    and subsequent chapters, as well as answers to the exercises in this book. I expect
    you to visit the book''s website, create your own dummy source data, and run the
    code yourself.'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# Chapter 9: Programming to Identify Chronic Conditions 107


    # Review and Approach


    # Review: Peculiarities of Medicare Data


    Refer to the reviews in Chapters 6, 7, and 8 to review the material relevant to
    this chapter''s study of chronic conditions and quality. As mentioned above, quality
    measurement can be controversial because it involves relating provider performance.
    With this in mind, let''s review some peculiarities and possible limitations of
    Medicare administrative data so we can be better prepared to interpret our output.


    +   - Medicare coverage for the elderly is praised regardless of medical history.
    A beneficiary diagnosed with COPD who becomes eligible for Medicare is granted
    coverage regardless of her COPD diagnosis. If you are used to working with commercial
    healthcare data, you will likely notice some characteristics of the Medicare,
    like beneficiaries having at least one chronic condition (this may change the
    implementation of the Affordable Care Act).


    +   - Some services may not appear in Medicare administrative data. For example,
    prescriptions administered during a hospital stay may not appear in the data at
    all. Additionally, services paid for by Medicare Part C may not appear in the
    administrative data files because managed care providers pay them.


    +   - The administrative data we use for research purposes is updated on a regular
    basis, but only with claims that have been received, adjusted, and deemed final
    action. As such, the files we use at any time do not contain final claim submitted
    and paid up to the date of extraction of data. In some rare cases, when not impractical,
    medical records can fill in gaps of information. What''s more, we will see changes
    to the information available for quality measurement as electronic medical records
    become prevalent.


    +   - The correct composition of any study population must be determined carefully.
    In Chapter 6, we determined that our example project will include only those beneficiaries
    continuously enrolled in fee-of-service Medicare during a defined timeframe, which
    has implications for the out-of-service of our example researching project. More
    specifically, this step resulted in eliminating beneficiaries for whom we may
    not have a full set of claims, giving us more confidence that we are not missing
    claims for services like retinal eye or hospital admissions for our study population.


    # Our Programming Plan


    In Chapter 5, we submitted a data request to extract all claims and enrollment
    information for beneficiaries who were treated by the providers in our study population.
    We received and loaded our data, keeping only those variables we wished to use
    in our study. In Chapter 6, we used enrollment data to delimit our population
    to full-year FFS beneficiaries. In Chapter 7, we brought our claims data to bear
    on the calculation of utilization measurements. In Chapter 8, we used the Medicare
    amount paid to measure payments of specific services. In this chapter, we will
    draw on the study of utilization and payment by looking at two chronic conditions,
    diabetes and COPD. Next, we will use diagnosis codes in specific settings to identify
    beneficiaries with diabetes or COPD (or both). Next, we will look at'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'quality of care for these beneficiaries, giving us an excellent chance to apply
    the programming methods we learned in Chapters 7 and 8.


    The output created in this chapter will be analytic files at the beneficiary level,
    which we will use for the remainder of our programming work. Looking forward,
    in Chapter 10, we will end our example project by summarizing all of our output.


    # A Note on the Chronic Conditions Data Warehouse (CCW)


    Readers with Medicare administrative data may be trying to reconcile two facts:


    +   We are coding algorithms to identify beneficiaries with two chronic conditions,
    diabetes and COPD, using claims data.


    +   CMS provides files containing this information to the research community through
    the Chronic Condition Data Warehouse (CCW). The CCW "is a research database designed
    to make Medicare, Assessments, and Part D Drug Event more readily available to
    support research designed to improve the quality of care and reduce costs and
    utilization." These are available through ResData and CMS''s data distribution
    contractor.


    With some simplifications, we will draw on the CCW''s definitions of diabetes
    and COPD for coding the identification of diabetes and COPD in our beneficiary
    population. Why do we code these ourselves when flagging beneficiaries with chronic
    conditions is provided by CMS? Coding chronic conditions is useful for instrumental
    purposes, providing a context for understanding potentially modifying chronic
    conditions not available in the CCW. In addition, some investigators choose to
    define conditions because they wish to modify the definition in the CCW. For example,
    the CCW definition of diabetes includes secondary diabetes, which may not be the
    right choice for your particular study. It should go without saying that readers
    are encouraged to take full advantage of the data offered in the CCW.


    # Algorithms: Identifying Beneficiaries with Diabetes or COPD


    Our first task is to identify beneficiaries in our population with diabetes or
    COPD. At the risk of being repetitive, before we begin, it is very important to
    note that the diagnosis codes we use will change from year to year. The same goes
    for all of the codes we use in this book. For example, procedure and diagnosis
    codes are updated annually (new codes are created and some are retired). Therefore,
    it is good practice to regularly check the codes you use to identify diagnoses
    or services (anything, for that matter) to ensure they are correct. This will
    be especially true after October 2014, as all codes will change when a new diagnosis
    coding system, ICD-10-CM, is implemented.


    The algorithm to identify beneficiaries with diabetes is adapted from instructions
    available from the CCW, with some simplifications (e.g., the identification of
    diabetes we do not require looking across two years of data). Our SAS code involves
    searching for specific diagnosis codes (see the below algorithms for the lists
    of specific diagnosis codes). Codes can occur at any position on the claim (i.e.,
    they do not have to be primary diagnoses). The setting in which these diagnosis
    codes occurs is'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Chapter 9: Programming to Identify Chronic Conditions


    important. Specifically, if we find evidence a beneficiary was diagnosed with
    diabetes on only one occasion in an inpatient or skilled nursing facility setting,
    we will count that as having diabetes. In these settings, true coding experts
    review medical records, consult with physicians, and only record a diagnosis if
    the patient actually has the condition. However, we need separate events of a
    diagnosis of diabetes when searching in carrier and hospital inpatient claims.
    Why? Because the occurrence of a single diagnosis of diabetes in these settings
    may be called a "rule out" diagnosis, where the physician orders a lab test to
    check for diabetes. The second diagnosis confirms the beneficiary does have diabetes.
    In all cases, the diagnoses can occur any time during a two-year period (but we
    will search just one year of data in our example). Finally, we will note that
    we use home health claims data, not hospice or DME data, in our identification
    of beneficiaries with diabetes or COPD. We use home health data even though investigators
    view diagnosis codes on home health claims as unwise. We do not use hospice claims
    due to the nature of care provided in a hospice setting. Lastly, for obvious reasons,
    the DME file cannot be used to reliably identify beneficiaries with diabetes or
    COPD.


    The algorithm to identify beneficiaries with COPD is constructed in a similar
    manner (and also adapted from information provided by the CCW) to identify the
    beneficiaries with diabetes, but using different diagnosis codes (and the search
    typically occurs over one-year period of claims data). Therefore, we will use
    a single algorithm to search inpatient, SNF, outpatient, and Part B carrier for
    evidence of these diagnosis codes, setting flags where appropriate. Then, we will
    count the flags created, and use these counts to identify beneficiaries with diabetes
    or COPD.


    In Step 9.1, we present an algorithm for identifying the presence of diagnosis
    codes used to identify diabetes or COPD in our inpatient, SNF, home health, and
    outpatient claims data sets. This algorithm is similar to code used in previous
    chapters to identify diagnosis codes in data. We used a macro called CLM LOOP
    and array logic to create separate flags set to 1 in the presence of diabetes
    (DIA_IA, DIA_SN, DIA_OP, and DIA_HH) and COPD (COPD_IP, COPD_SN, COPD_OP, and
    COPD_HH) on each claim. Each of these data sets contains 25 diagnosis variables
    (ICD_1_DGNS_CD25). In addition, we use conditional processing for our inpatient
    data sets first-case, as we are only searching claims for inpatient short and
    critical access hospitals with non-negative values of PMT_AMT. We use a %if clause
    to create the inpatient patients in UTIL_IP_2010_FNL. We output only those records
    where the flag variables were equal to 1. In Step 9.3 and Step 9.4, we will use
    these records as definitive proof that the beneficiary has diabetes or COPD (with
    the exception of the flags derived from inpatient data sets).


    ```

    * STEP 9.1: SEARCH INPATIENT, SNF, HOME HEALTH, AND OUTPATIENT CLAIMS

    FOR DIABETES AND COPD DIAGNOSIS CODES *

    * NOTE THIS MACRO WILL ERROR OUT IFLED A CLMTYP VALUE WE

    ID NOT CREATE */

    %macro clm_loop(&clmtyp);

    data cc_&clmtyp._search(keep=bene_id dia_&clmtyp); copd_&clmtyp);

    %if &clmtyp=sn or &clmtyp=op or &clmtyp=hh then %do;

    set utl.&clmtyp_2010_fnl;

    %end;

    else if &clmtyp=ip then %do;

    set utl_ip_2010_fnl;

    %end;

    ```'
