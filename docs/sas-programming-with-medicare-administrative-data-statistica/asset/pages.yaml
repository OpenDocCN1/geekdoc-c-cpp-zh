- pgno: 61
  md: '# SAS Programming with Medicare Administrative Data


    +   - Although not included in our package, remember that we have our finder file
    (or attribution file) for use in later chapters! We assume that this finder file
    is a SAS data set.


    # Decrypting Our Medicare Administrative Data


    Our first hurdle is to uncompress and decrypt our data. We received our decryption
    key (a fancy way of saying "password") via email from CMS''s distribution contractor.
    One of the most common questions I relate to the inability to decrypt a file;
    this problem is usually rooted in attempting to decrypt the file to the media
    on which we received our data. I recommend an additional step of copying all of
    the files on the mass storage device into a directory and then making the directory
    read-only. This ensures we cannot accidentally modify our data, and we can work
    from this directory with confidence. Because the files are SDAs, we do not need
    to acquire any special decryption software; aside from the file containing our
    decryption key, everything we need for the decryption process is included in our
    shipment including an executable file (.exe) that runs the decryption process.
    We need to follow the instructions for decrypting the data files included in our
    data shipment.


    # Loading Our Medicare Administrative Data into SAS Data Sets


    Once the files are copied and decrypted, we must load them into SAS datasets.
    As stated above, CMS''s data distribution contractor makes the process as possible
    by using SAS code and the instructions necessary to complete the task in our data
    shipment. Therefore, we will not spend time (nor provide code) discussing how
    to load our source files into SAS datasets, but it is worth the time to discuss
    a few details.


    First, note we received the following files:


    +   - Base claim and revenue center files for all institutions (inpatient, outpatient,
    SNF, health, and hospital). Recall that we discussed the difference between the
    base claim and the revenue center files in Chapter 3.

    - Base claim and revenue line files for all non-institutional clients (DME and
    Carrier). Recall that we discussed the difference between the base claim and the
    line level files in Chapter 3.

    - We also received the Master Binary Summary File (MBSF) containing enrollment
    data. Recall that we discussed the MBSF in Chapter 3.


    In addition, note that we received file transfer summary files (the aforementioned
    .sts) and SAS program files that correspond to each of the claims and enrollment
    files. The transfer summary files contain information on the contents of each
    of our and enrollment files that confirm we loaded the data into SAS correctly.
    For example, the files contain information on the number of columns and rows,
    the length of the rows, and the size of the file. Once we load the flat files,
    the number of records in our SAS datasets should match the count of rows in the
    file transfer summary.


    Finally, when loading the flat files into SAS datasets, we must include the SAS
    LIBNAMEs to ensure we are reading and writing to the proper locations (remembering
    that we assigned read-only rights to our source data directory). We must also
    be cognizant of how our file sizes will change as we'
