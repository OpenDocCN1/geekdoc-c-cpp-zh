    # Chapter Summary


    In this chapter, we used our claims and enrollment data to study chronic conditions
    and quality outcomes. Specifically, we:


    +   - Discussed importance of studying chronic conditions. Many Medicare beneficiaries
    have chronic conditions; treating chronic conditions requires a high level of
    specialized and concerted medical care, and the treatment of chronic conditions
    is often looked at from the perspective of measuring quality outcomes.


    +   - Programmed algorithms to identify beneficiaries with diabetes or COPD by
    defining the occurrence of certain diagnosis codes that identify these chronic
    conditions (including “rule out” diagnoses), searching the line items on claims
    for these diagnosis codes, and counting the occurrence of these codes by claim
    type.


    +   - Programmed algorithms to identify evaluation and management services for
    beneficiaries with diabetes or COPD by merging beneficiaries with these conditions
    with the files we created Chapter 7 to define E&M visits.'
  merge: -1
  img_proc: true
