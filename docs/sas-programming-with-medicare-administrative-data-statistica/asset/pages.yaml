  md: "# Chapter 6: Working with Enrollment Data 59\n\nFinally, in Step 6.3 we create\
    \ our file of continuously enrolled beneficiaries by delimiting the ENR_CONTENTOR_2010\
    \ file created in Step 6.1 by the enrollment flags defined in that same step.\
    \ a beneficiary is defined as continuously enrolled in Medicare Parts A and B\
    \ in calendar year 2010 if the value of CONTENRL_AB_2010 is equal to 'AB', by\
    \ the value of CONTENRL_HMO_2010 is equal to 'NOHMO', and the value of DEATH_2010\
    \ is not equal to 1. We keep only these records.\n\n```\n* STEP 6.3: CREATE A\
    \ 2010 ENROLLMENT FILE OF ONLY CONTINUOUSLY ENROLLED BENEFICIARIES */\ndata enr.contentor_2010_fnl;\n\
    \  set enr.contentor_2010;\n  if contenrl_ab_2010='ab' and contenrl_hmo_2010='nohmo'\
    \ and\n  death_2010 ne 1;\n  run;\n```\n\n# Algorithms: Create or Retain Data\
