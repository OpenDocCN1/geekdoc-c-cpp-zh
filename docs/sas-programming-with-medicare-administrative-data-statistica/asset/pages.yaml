    \ We do this by merging our enrollment data with the SSA code file by SAS data\
    \ set.\n\nIn Step 6.7, we begin by loading the SSA code file (called MSABEA.TXT)\
    \ into a SAS data set. To do this, we create a SAS data set src:MSABEA_SSA that\
    \ contains the state and county codes (concatenated into a single variable called\
    \ SSA), the corresponding county name (COUNTY), and the corresponding state name\
    \ (STATE).\n\n```\n* STEP 6:7: LOAD SSA STATE AND COUNTY INFORMATION */\ndata\
    \ src.msabea_ssa;\n\tfile \"C:\\Users\\mgillingham\\Desktop\\SAS\\Book\\FINAL_DATA\\\
    source_data\\MSABEA03.TXT\" missover;\n\tcounty $ 1-25\n\tstate $ 26-27\n\tssa\
