  md: "# SAS Programming with Medicare Administrative Data\n\ntype. As mentioned above,\
    \ we will combine the base claim and revenue center into a single file per claim\
    \ type, with one record for each claim and its associated lines. Note that we\
    \ will not provide code for executing this task for each claim type, nor will\
    \ we provide code for using all variables in these data sets. Rather, we will\
    \ provide a set of code for transforming data sets for Carrier claims, using a\
    \ limited set of variables. Using these examples, the reader can easily create\
    \ code for performing this procedure on other claim types and additional variables.\n\
    \n# Transforming Base Claim and Line-Level Carrier Data into a Claim-Level File\n\
    \nLet's combine our base claim and line carrier SAS data set into a single carrier\
    \ SAS data set with one record for each claim and its associated lines. In Step\
    \ 5.1, we sort the carrier line file (SRC.CARRIER2010LINE) by the variables BENE_ID,\
    \ CLM_ID, and CLM_LN.\n\n```\n* STEP 5.1: SORT CARRIER LINE FILE IN PREPARATION\
    \ FOR TRANSFORMATION */nproc sort data=src.carrier2010line out=carrier2010line;\n\
    \  by bene_id clm_id clm_ln;\nrun;\n```\n\nIn Step 5.2, we transform the sorted\
    \ carrier line file (CARRIER2010LINE) from one record per line (identified using\
    \ the CLM_LN) to one record for each claim, with the line variables array in that\
    \ record. Because carrier claims have up to 13 claim lines, we will create 13\
    \ new variables. As you can see, we do the same for the other variables in our\
    \ carrier line. These variables will be used in our work in later chapters.\n\n\
    ```\n* STEP 5.2: TRANSFORM CARRIER LINE FILE */\ndata carrier2010line_wide (drop=expnsdt1\
    \ expnsdt2 hcpcs_cd\nline_icd_dgns_cd clm_id linepmpt1 13 mmddyy10);\n  format\
    \ expnsdt1_1-expnsdt2_13 mmddyy10;\n  line_icd_dgns_cd1-line_icd_dgns_cd3 $5\n\
    \  hcpcs_cd-hcpcs_cd3 $7\n  linepmpt1-linepmpt13 12.\n  prfnpipl1-prfnpipl13 $12.\n\
    \  tax_num1-tax_num13 $10;\n  set carrier2010line;\n  by bene_id clm_id ln;\n\
    \  retain\n  expnsdt1_1-expnsdt13\n  expnsdt2_1-expnsdt23\n  line_icd_dgns_cd1-line_icd_dgns_cd3\n\
    \  hcpcs_cd1-hcpcs_cd13\n  linepmpt1-linepmpt13\n  prfnpipl1-prfnpipl13\n  tax_num1-tax_num13;\n\
    \  array xline_icd_dgns_cd(13) line_icd_dgns_cd-\nline_icd_dgns_cd3;\n  array\
    \ xexpnsdt1(13) expnsdt1_1-expnsdt13;\n```"
  merge: -1
  img_proc: true
