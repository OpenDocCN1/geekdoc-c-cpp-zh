    \ enrollment data (ENR_CONTENT_2010_FNL) created in Chapter 6. Because we wish\
    \ to eliminate all claims for beneficiaries who are not in our population, we\
    \ must merge the data sets by the beneficiary identifier variable, BENE_ID. In\
    \ order to make our algorithm run as quickly as possible, we want to be explicit\
    \ about using the BENE_ID into memory when using our beneficiary data set. We\
    \ can use the same code to limit each of our seven claims data set, we create\
    \ a simple macro CLM LOOP that us delimiting. Using this macro allows us to avoid\
    \ coding the merging algorithms all six times. Reducing the total lines of code\
    \ we have to write saves development time and reduces the potential for coding\
    \ errors. Note that we perform an “if a” merge, keeping only the records in a\
    \ given data set that match the BENE_ID in our enrollment data.\n\n```\n* STEP\
    \ 7: DELIMIT CLAIMS DATA BY BENEFICIARY POPULATION */\n* CREATE MACRO LOOP TO\
    \ PROCESS ALL SEVEN CLAIM TYPES */\n%macro clm_loop(clmtyp=)\ndata data.util&clmtyp._2010_fnl;\n\
    merge enr.conterz_2010_fnl(keep=bene_id in=a)\netl.&clmtyp._2010(in=b)\n  by bene_id;\n\
    \  if a;\n  run;\n%end clm_loop\n%clm_loop(clmtyp=c);\n%clm_loop(clmtyp=dm);\n\
    %clm_loop(clmtyp=op);\n%clm_loop(clmtyp=ip);\n%clm_loop(clmtyp=sn);\n%clm_loop(clmtyp=hh);\n\
    %clm_loop(clmtyp=hs)\n```\n\n# Algorithms: Measuring Evaluation and Management\
    \ (E&M) Utilization\n\nLet’s start our investigation of utilization characteristics\
    \ for our population of continuously enrolled beneficiaries by measuring the number\
