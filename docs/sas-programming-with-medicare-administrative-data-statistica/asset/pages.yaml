    # Introduction and Goals of This Chapter


    Our goal in this chapter is to plan our research programming project. As you will
    see, the planning process is a fundamental part of any research programming effort.
    In my experience, aside from a misunderstanding of data, the lack of a methodical
    and comprehensive programming plan is the most common reason that research programming
    efforts struggle or even fail.


    I bet what you are thinking now is: "Are you kidding me? We are talking about
    research programming! I, how can you plan something that no one has done before?
    By its very nature, research means adapting to new information and changing approaches
    to answering questions! Planning is just a waste of time! Besides, I want to get
    cracking and write some code! I have to admit that it is very tempting to skip
    the planning process and dive right into the work! After all, for many programmers,
    writing out a methodical plan is right there with major detail work! It is not
    something most people consider particularly fun, especially when we could be combining
    through data and answering questions! However, be forearmed: Failure to plan properly
    will greatly increase the likelihood of rework, costing valuable time and money
    (and causing unneeded stress and anxiety). For example, can you imagine coding
    for three months only to realize you forgot to request an important variable?
    What if you had to put the project on hold while waiting for data to be re-extracted
    and delivered?'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# SAS Programming with Medicare Administrative Data


    The cornerstone of this chapter is that planning a research programming project
    is not only possible and necessary, but extremely helpful. Although a formal project
    plan and documentation may seem overkill or unnecessarily rigid, it is important
    to remember that even a small research programming project can become very complicated,
    use many datasets, process large files, generate a tremendous amount of code,
    and produce numerous output files.


    Viewing a research programming project as the construction of an information system
    and using traditional information systems approaches to planning mitigating the
    risk of error and produces a higher quality product. Besides, although no research
    programming projects are exactly alike, similarities exist that make planning
    a little easier. For example, every research programming project needs to acquire
    data, create files for analysis, calculate and summarize results, and generate
    output. In addition, many research programming efforts must modify code based
    on the iterative feedback of the research process. Finally, many projects reference
    code and, importantly, the reasoning behind methodological and coding decisions,
    months or years after the completion of a particular task or the project as a
    whole (you would be surprised at the speed with which important details are leaving
    your brain!)


    Many tools and books cover the science of planning a research programming project
    much more comprehensively than this! The tools you choose must meet the specific
    needs of your project. In my experience, the tools discussed in this book are
    applicable to the vast majority of research programming efforts. However, there
    are projects for which you should consider alternative methods. For example projects
    that produce reports on a quarterly basis may need a more rigorous and formalized
    approach that includes separate development and production phases and change documents.
    Very short-term projects that will produce a single, simple deliverable may not
    require much of a formal planning structure.


    In this chapter, I recommend an approach to planning a medium or large research
    programming project, starting with the development of an overall project plan
    on the Systems Development Life Cycle (SDLC), an organized approach to planning
    and executing a programming project. This plan includes instructions for designing
    quality assurance (QA) procedures, developing a requirements document that defines
    the objectives of the project at a high level, and creating a set of technical
    specifications that detail the programming steps required to meet the project
    objectives.


    By the end of this chapter, we will develop our overall project plan, as well
    as our high-level requirements and QA plan. We introduce the concept of technical
    specifications, but we will tackle the development of detailed technical specifications
    in subsequent chapters as we write code.


    # Our Project''s Plan: The SDLC


    There are many ways to approach the development of a plan for research programming
    work. Depending on the complexity and duration of your project, it may suffice
    to list all of the tasks starting with requesting data and ending with the production
    and archiving of output and SAS code. For projects that are more complex, like
    the research programming effort covered in this book, I prefer to execute the
    planning process within the framework of the SDLC.'
  merge: -1
  img_proc: true
