  md: "# Chapter 9: Programming to Identify Chronic Conditions 111\n\nIn Step 9.2,\
    \ we continue the process of identifying the presence of diagnosis codes used\
    \ to identify diabetes or COPD, this time using our carriers data set. Again,\
    \ we search each claim for diagnosis codes that indicate the presence of diabetes\
    \ or COPD code value is found in one of the carrier's 13 line-level diagnosis\
    \ codes (LINE_IC_DGNS CDI1-LINE_IC_DGNS_CD13), we set the relevant flag (DIA_CARR,\
    \ COPD_CARR, or both) to 1. We output only those records where the flag variables\
    \ are equal to 1. In Step 9.3 and 9.4, we will use these records to proof that\
    \ the beneficiary has diabetes or COPD.\n\n```\n* STEP 9.2: SEARCH CARRIER CLAIMS\
    \ FOR DIABETES AND COPD DIAGNOS CODES\n*/\ndata cc_carr_search(keep=bene_id dia_carr\
    \ copd_carr);\n  set udln_2010 fnl;\n  array indgns(13) line_ic_dgns cdl_line_ic_dgns_cd13;\n\
    \  do i=1 to 3\n    /* diabetes *\n    if substr(indgns(i),1,4)=3572\n    or substr(indgns(i),1,5)\n\
    \    in('24900','24901','24910','24911','24920','24921','24930','24931',\n  '24940','24950','24951','24960','24961','24970','24971',\n\
    \  '24980','24981','24990','24991',\n  '25000','25001','25002','25003','25010','25011','25012','25013',\n\
    \  '25020','25021','25022','25023',\n  '25030','25031','25032','25033','25040','25041','25042','25043',\n\
    \  '25052','25051','25052','25053',\n  '25060','25061','25062','25063','25070','25071','25072','25073',\n\
    \  '25080','25081','25083',\n  '25090','25091','25092','25093','36201','36202',\n\
    end dia_carr=1;\n  /* copd *\n  if substr(indgns(i),1,3)='496'\n  or substr(indgns(i),1,4)='4910'\n\
    \  '4911','4918','4919','4920','4928','4940','4941'\n  or substr(indgns(i),1,5)\
    \ in('49120','49121','49122') then\ncopd_carr=1;\n  end;\n  if dia_carr=1 or copd_carr=1;\n\
    run;\n```\n\nIn Step 9.3, we use a macro to loop through all claims processed,\
    \ summarizing the flags for each beneficiary by claim type, outputting one file\
    \ for each relevant claim type (CC_NT_IP, CC_NT_SN, CC_NT_OP, CC_NT_HH, and CC_NT_CARR).\
    \ In so, we create summary variables called DIA_IP_SUM, DIA_SN_SUM, DIA_OP_SUM,\
    \ DIA_HH_SUM and DIA_CARR_SUM equal to the total number of claims with the presence\
    \ of a diagnosis code for diabetes in the relevant claims set for each beneficiary.\
    \ Similarly, we create summary variables called COPD_IP_SUM, COPD_OP_SUM, COPD_HH_SUM\
    \ and COPD_CARR_SUM equal to the total"
  merge: -1
  img_proc: true
- pgno: 127
  md: "number of claims with the presence of a diagnosis code for COPD in the relevant\
    \ claims data for each beneficiary. Lastly, we perform nodupkey sort of the output\
    \ files, keeping only one record per beneficiary. We turn our attention to using\
    \ these variables to make a final determination on whether or not a particular\
    \ beneficiary has diabetes or COPD.\n\n```\n/* STEP 9.3; COUNT OCCURRENCES OF\
    \ FLAGS BY SETTING */\n%macro loop2(clmtype2=)\nproc sql;\n  create table cc_cnt\
    \ _&clmtype2. as\n select *, sum(dia_&clmtype2.) as dia_&clmtype2._sum,\nsum(codp_&clmtype2.)\
    \ as copd_&clmtype2._sum\n from cc _&clmtype2. -search\n group by bene_id;\nquit;\n\
    \n/**/ sort data cc_cnt_&clmtype2. nodupkey; by bene_id; run;\n%mend loop2;\n\
    %cl_loop2(clmtype2=ip);\n%cl_loop2(clmtype2=sn);\n%cl_loop2(clmtype2=op);\n%cl_loop2(clmtype2=hh);\n\
    %cl_loop2(clmtype2=carr);\n```\n\nIn Step 9.4, we see the explanation of how to\
    \ count diagnosis codes for a particular claim type to fruition. Merging the output\
    \ of Step 9.3 into a single data set, the code in this step uses the summarized\
    \ diabetes and COPD flags created in Step 9.3 to identify beneficiaries with diabetes\
    \ or COPD as follows:\n\n+   - A beneficiary is identified as having diabetes\
    \ in the presence of a single relevant diagnosis found in inpatient, SNF, or home\
    \ health claims data. This evidence is found where DIA_IP_SUM, DIA_SN_SUM is greater\
    \ than or equal to one.\n- A beneficiary is also identified as having diabetes\
    \ in the presence of two or more relevant diagnoses found on separate inpatient\
    \ or carrier claims. This evidence is found where DIA_OP_SUM or DIA_CARR_SUM is\
    \ greater than or equal to two.\n- A beneficiary is identified as having COPD\
    \ in the presence of a single relevant diagnosis found in inpatient, SNF, or home\
    \ health claims data. This evidence is found where COPD_IP_SUM, COPD_SN_SUM, or\
    \ COPD_HH_SUM is greater than or equal to one."
