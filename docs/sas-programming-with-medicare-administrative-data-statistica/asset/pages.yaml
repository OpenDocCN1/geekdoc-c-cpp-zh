    # Introduction and Purpose of This Book


    Welcome to the world of SAS® with Medicare data! This book provides beginner,
    intermediate, and advanced SAS users with the information needed to execute a
    research programming project using Medicare administrative data. It introduces
    the reader to common, important, and frequently used concepts encountered when
    programming with Medicare data. The focus of this book is decided on the data
    and the policies that drive the content of the data, using the SAS syntax as a
    tool to answer common research questions. This approach is very intentional; in
    my experience, the SAS syntax is the easiest part of programming with Medicare
    data! The most challenging aspect of my job is to understand the data and how
    to properly use it to correctly answer research questions.¹


    Medicare data are unlike any other health care data, and the uniqueness of Medicare
    data is driven by the uniqueness of the Medicare program. For example, public
    policy decisions largely influence decisions surrounding what Medicare covers
    and how those services are paid for. This differs from the decision making process
    of a commercial health plan, which seeks to maximize profits. Here are a few examples,
    of which we will discuss in chapters:


    +   * Medicare covers elderly beneficiaries without regard to medical history.
    Therefore, the Medicare population is generally thicker than the population of
    most commercial health plans.

    * Part D prescription drug data contains information for out-of-hospital prescription
    drug fills. Prescription drugs administered during a hospital stay may not appear
    in the claims data at all.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '+   * Services paid for by Medicare Part C (Medicare Advantage) may not appear
    in the administrative claims files because they are paid for managed care providers.

    * Medicare pays for some services (e.g., home health agencies, hospice, or acute
    inpatient hospitals) using what are called prospective payment systems (PPS).


    These examples are to upset your appetite for learning about Medicare data. I
    am hoping that you have not run screening from your desk! If you have, please
    come back! We will learn all of these concepts and more! The point I am trying
    to make is that the you understand the Medicare program, how we will use Medicare
    administrative data for research purposes. To this end, this book will describe
    the Medicare program, Medicare data, how the two interact, and how that affects
    the SAS programming who uses the data. These concepts and techniques will be illustrated
    through the completion of an example research project.


    Learning how to use Medicare data is a lifetime pursuit. It takes many years to
    build matter expertise due to the sheer volume of information on topics like Medicare
    policy, payment systems, and data. What''s more, the world of Medicare data is
    changing rapidly due to increased attention on Medicare costs, quality, and the
    use of information in health care delivery. For, the example of electronic health
    records (EHRs) in the measurement of utilization, cost, and quality we use in
    this. In addition, Medicare is exploring different methods of payment, such as
    the horizon. EHRs will be replaced, or someday, the administrative claims we use
    is the bundling of services previously paid on an individual basis. As such, we
    will never be able to cover every topic you will run into. However, we will build
    a very strong foundation in standard concepts, such as specifying and coding continuous
    enrollment algorithms and identifying and summarizing common services and events.
    My hope is that the reader can apply this foundation to programming projects that
    use Medicare data and use it to gain a broader perspective on the use of health
    care administrative data in general.


    # Framework of This Book


    This book is organized as an approach to completing a research programming project.
    The basic framework below can be used as a blueprint for programming any research
    project, including the example we use in this book.


    +   1. Plan the project by identifying the research questions to be answered and
    thinking through how we will construct the code to provide those answers. Prior
    to writing any code, we will create a data flow graph of our programming plan
    and plan to request data. Typically, prior to writing any SAS code you would write
    programming specifications (or business requirements or functional requirements)
    that state exactly how you plan to answer the research questions using SAS code.
    For illustrative purposes, we will write the specifications as code (i.e., the
    specifications will be our explanation of the code).'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Chapter 1: Introduction 3


    +   2. Obtain the needed data. There are many different types of data you can
    use, depending on the nature of the project and its requirements. Our project
    will focus on using administrative claims and enrollment data.


    +   3. Develop code to create the analytic files needed to answer research questions.
    Analytic files are essentially summaries or subsets of the raw source data we
    will use to perform the analysis that answers the research questions.


    +   4. Develop code that utilizes the analytic files to create answers to the
    research questions.


    +   5. Perform quality assurance and quality control of our algorithms.


    +   6. Run our algorithms in production, typically by a batch submittal.


    +   7. Create documentation, take steps to preserve our data sets, and complete
    any contractually required data destruction.


    # Our Programming Project


    During the planning process for this book, I thought and hard about an example
    project that would be useful to a variety of users. I wanted the project to address
    common research questions and result in the creation of algorithms that are almost
    universally applied to research programming that uses Medicare data. As such,
    I came up with the following criteria for the project:


    +   The research questions must be applicable and relevant to today''s research
    environment. For example, the accurate measurement of utilization and cost of
    health services are topics that have been consistently important and relevant
    since the first person used a computer to analyze health care claims.


    +   The research questions must lend themselves to building a foundation for addressing
    ''real world'' questions. The foundation for all research programming projects
    is the study population, so our example project will include enrolling beneficiary
    data for defining continuous enrollment.


    +   The research questions must result in algorithms that are easily adaptable
    to answer research questions in your ''real world'' work. For example, we will
    create an algorithm that defines continuously enrolled beneficiaries as those
    who have had Medicare Fee-for-Service (FFS) coverage for all 12 months of a study
    year. This kind of algorithm is easily modified to define continuously enrolled
    beneficiaries as those enrolled in Medicare Advantage (MA) for 6 months of the
    year.


    +   Although this is an introductory text, the research questions must illustrate
    some of the complexity of using Medicare data. If there is one common trait that
    unites all of the projects that I have worked on, it is that the project always
    grows in complexity.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 4 SAS Programming with Medicare Administrative Data


    With these criteria in mind, I designed the following example research project:


    Let''s imagine that we are working at a university or a policy research company
    (maybe you don''t need to imagine this because you already are!). Let''s further
    imagine the Centers for Medicare & Medicaid Services (CMS) enacted a pilot program
    during calendar year 2010 designed to reduce costs to Medicare and improve (or
    at least not harm) quality outcomes for Medicare beneficiaries. The details of
    the pilot program are not particularly important to our focus, so let''s imagine
    that the program provides an extra payment to providers that significantly reduce
    payments and improve quality outcomes compared to groups of their peers. We have
    been asked to evaluate the effectiveness of the program, and we would like to
    start by measuring simple payment, utilization, and quality outcomes for providers
    who interacted with the beneficiaries in the sample population during the year
    2010. Because the program had been operational for the full 2010 calendar year,
    we can identify the providers who participated in the pilot. The starting point
    for our example research project is a file provided by CMS that contains identifiers
    for the providers who participated in the pilot program, along with identifiers
    for the beneficiaries associated with those providers. Therefore we must acquire
    enrollment and claims data for these beneficiaries, and subsequently develop algorithms
    that will query the data to produce summaries of payment, utilization, and quality
    outcomes during the study year. These summaries will be used in our evaluation
    of the program.


    In the end, the goal of this text is not to make any real determinations about
    utilization, payment, and quality of care; after all, we are using fake data that
    cannot be used for drawing any real conclusions and exists solely to develop code.
    Rather, our goal is to prepare you for working on your own real world research
    projects by using our example research programming project to teach the mechanics
    of using Medicare data to measure utilization and Medicare payments, and to identify
    chronic conditions and commonly used indicators of quality outcomes. Therefore,
    by the end of this text, the reader will understand important concepts that are
    applicable and foundational to using Medicare administrative claims and enrollment
