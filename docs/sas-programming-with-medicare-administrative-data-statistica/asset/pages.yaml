    a massage, or take a vacation. Once CMS has finalized our payment and submitted
    our request to the data distribution contractor for processing, it can take at
    least 4-6 weeks to receive the data files we have long desired for!


    # Receiving, Decrypting, and Loading Medicare Administrative Claims and Enrollment
    Data


    # receiving Our Medicare Administrative Data


    Our patience has been rewarded; we have received the Medicare data requested!
    We tear into the shipping package to reveal a mass storage device that contains
    our claims and enrollment data. We plug the storage device into our PC and find
    that it contains the following files:


    +   * The requested data formatted as flat files with fixed columns compressed
    and encrypted into self-decrypting archive files (SDAs, recognizable by the file
    extension .dat)


    +   * SAS code for loading the files into SAS datasets (recognizable by the file
    extension .sas)


    +   * Summary information detailing the data transmission (recognizable by the
    file extension .fts, short for “file summary")


    +   * A host of documentation and data dictionaries including a ‘readme'' file
    listing the files that comprise the data transmission package, instructions for
    decrypting the data, spreadsheets detailing the variables included in each file,
    information on the diagnosis and procedure codes in the data, and data dictionaries'
