  md: '# Chapter 3: An Introduction to Medicare Data 21


    A beneficiary is considered inpatient the day the beneficiary''s doctor formally
    admits the beneficiary to the hospital. The distinction between inpatient and
    outpatient status is very important because it influences how Medicare pays for
    the services received by the beneficiary. For example, as noted in Chapter 2,
    a beneficiary cannot be admitted to a skilled nursing facility unless the beneficiary
    has been discharged from a hospital within the last 30 days with an inpatient
    stay that lasted at least three consecutive days.


    # Skilled Nursing Facility (SNF) Claims Data


    SNF claims data contain information on final action claims filed by SNF providers.⁹
    Like inpatient skilled, claims are filed using the CMS-1450 form or the 837i electronic
    format and paid through Medicare Part A. Skilled nursing facilities may be part
    of a nursing home or a hospital provide skilled nursing and rehabilitative care
    specialists such as registered nurses, physical therapists, occupational therapists,
    speech pathologists, and audiologists.


    The purpose of this care is to treat, observe, and manage the conditions of beneficiaries
    leaving the hospital. The goal of skilled nursing care is to improve or maintain
    the beneficiary''s current condition, as well as assist beneficiaries in maintaining
    their independence. Examples of skilled care include physical therapy and intravenous
    injections. One admitted to a SNF (see the above section for more information
    on rules governing admission to a SNF), Medicare pays for SNF services up to 100
    days per spell of illness under specific circumstances. A spell of illness ends
    60 days after discharge from a SNF, at which time a patient can be admitted to
    the hospital and then to a SNF for another 100 days.


    SNFs are also paid on a perspective payment basis – resource use groups (RUGs).
    Each of the 66 RUGs has associated nursing and therapy weights that are applied
    to create daily payment rates.


    # Home Health Claims Data


    Home health claims data contain information on final action claims filed by Home
    Health Agency (HHA) providers.¹⁰ Home health services are paid from Medicare Part
    A and Part B. Home health agencies are entities that provide skilled professional
    care in a beneficiary''s home.


    These agencies provide services to Medicare beneficiaries like occupational therapy,
    physical therapy, skilled nursing care, and even speech therapy and services like
    counseling that can help a beneficiary cope with the impacts of their illness
    on their mental health.


    Medicare pays for home health services in units of 60-day episodes based on a
    prospective payment predetermined rate. Patients receiving five or more visits
    are assigned to 1 of 153 home health resource groups (HHRGs) based on clinical
    and functional status and service use which are adjusted for the geographical
    area where services are delivered.'
