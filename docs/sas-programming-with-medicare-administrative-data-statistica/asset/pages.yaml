    # A Note on the Source and Structure of Our Claims Data


    Before getting into detail the content of the Medicare administrative claims and
    enrollment data we will be working with, let''s frame our discussion by identifying
    the source of our data and the structure of the files we will pretend to request,
    and work with to complete our project.³ It is important to introduce this conversation
    now how Medicare data can come from a variety of sources and each source stores
    provides the data somewhat differently.


    We will explore this topic in more detail in Chapter 5, but now it is important
    to know that, depending on our source of funding and the nature of our project,
    we could choose from at least four data sources:


    +   - CMS''s data distribution contractor (sometimes referred to as the Research
    Data Distribution Center)


    +   - CMS''s Data Extract System (DESY)


    +   - CMS''s Virtual Research Data Center (VRDC) system


    +   - CMS''s Integrated Data Repository (IDR)


    For our purposes, we will assume that we will work with CMS''s Research Data Assistance
    Center (ResDAC) and CMS''s data distribution contractor to request and obtain
    our data.⁴


    Medicare claims data are provided by CMS''s data distribution contractor separately
    by claim type. Other sets of files are provided for final non-institutional (Part
    B carrier and durable medical equipment) and institutional (outpatient, inpatient,
    nursing facility, health, and hospice) services. CMS further separates data for
    each claim type into separate files for base claim and claim line (in the case
    of the non-institutional data files) or revenue center (in the case of the set
    of institutional data files) detail, resulting in sets of files.⁵


    The base claim detail (also known as header-level information) is basically summary
    information, including information that identifies the claim, the beneficiary
    who received care, the provider of service, the beginning and ending dates for
    the services billed on the claim, the diagnoses on the claim, and the total amount
    paid to the provider as reimbursement for the services performed. The claim line
    detail (sometimes generally referred to as line-level information) is a set of
    in-depth information about'
