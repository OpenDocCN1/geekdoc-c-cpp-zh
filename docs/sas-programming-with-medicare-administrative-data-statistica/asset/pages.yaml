    # Review and Approach


    # Review: Basics of Medicare Cost


    In our introduction to Medicare covered in Chapter 2, we discussed the following
    topics related to Medicare cost:


    +   - Medicare may require beneficiaries to make certain cost-sharing payments,
    like deductibles and coinsurance.


    +   - Medicare may not be the primary payer for services provided to beneficiaries
    who carry additional health insurance coverage, even the elderly.


    +   - Medicare is a secondary payer for beneficiaries who have additional health
    insurance coverage, like the Federal Black Lung Program.


    +   - Medicare does not cover every possible medical service or procedure. Some
    services have limitations on coverage. For example, Medicare Part A stops paying
    for inpatient psychiatric care in a psychiatric hospital after 190 days (a lifetime
    limit). Other services are simply not covered. Medicare does not cover long-term
    care and cosmetic surgery.


    +   - Some limited and uncovered services as cost-sharing payments can be covered
    by supplemental insurance. For example, beneficiaries can acquire supplemental
    coverage from Medigap policies, insurance sponsored by their employers, Medicare
    Advantage plans, and in some cases, Medicaid.


    # Our Programming Plan


    In Chapter 5, we submitted a data request to extract all and enrollment information
    for beneficiaries treated by the providers in our study population. We received
    and loaded our data, keeping only those variables we wish to use in our study.
    In Chapter 6, we used enrollment data to delimit our population to full-year FFS
    beneficiaries. In Chapter 7, we brought our claims data to be covered by the calculation
    of utilization measurements. Now, in some instances, we will simply sum payments
    by leveraging the code that we learned in Chapter 7 to study Medicare identify
    specific services. For example, we will learn how to flag E&M services in a physician
    office setting. We only need to leverage this code to identify the relevant services
    and add simple algorithms to identify and summarize payments. In doing so, we
    will take advantage of the opportunity to explore different ways to summarize
    payments and discuss concepts like grouping in PROC SQL.'
