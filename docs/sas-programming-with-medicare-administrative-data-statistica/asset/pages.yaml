- pgno: 93
  md: "In Step 7.7, we modify the STAY_UTIL data set by calculating the number of\
    \ stays for each beneficiary, as well as the total number of days spent in the\
    \ hospital for the year (TOT_IP_LOS). We use a PROC SQL statement that creates\
    \ a variable STAY_CNT that is the count of the number of claims, grouped by BENE_ID\
    \ (beneficiary), in our input data set. At the same time, we de IP_LOS values\
    \ for each beneficiary to create the TOT_IP_LOS variable for calculating the average\
    \ length of stay in the next step. We output a data set. Because we use distinct(BENE_ID)\
    \ in the select statement, our output contains one record per beneficiary (so\
    \ the IP_LOS variable is no longer relevant).\n\n```\n/* STEP 7.7: CALCULATE NUMBER\
    \ OF STAYS AND TOTAL LOS, ASSUMING EVERY\nINPATIENT CLAIM AS */\nproc sql;\n \
    \ create table util.stay_util as\n    select distinct(bene_id), adms_dt, dschrgdt,\
    \ count(bene_id) as stay_cnt, sum(ip_los) as tot_ip_los\n    from stay_util\n\
    \    group by bene_id;\nquit;\n```\n\nIn Step 7.8, we modify the STAY_UTIL data\
    \ set by calculating the average length of stay (IP_ALOS), measured in days for\
    \ each beneficiary. For a provider, the ALOS statistic provides information on\
    \ how quickly patients are discharged after treatment. For a beneficiary, the\
    \ ALOS statistic provides information on the average length of hospital stays.\
    \ We calculate ALOS by dividing IP_LOS by STAY_CNT and performing a frequency\
    \ distribution of IP_ALOS. Again, we use ODS to output the results of the frequency\
    \ distribution.\n\n```\n/* STEP 7.8: CALCULATE ALOS */\ndata util.stay_util;\n\
    \  set util.stay_util;\n  ip_alos=tot_ip_los/stay_cnt;\nrun;\n\nods html file=\"\
    C:\\Users\\mgillingham\\Desktop\\SAS\nBook_FINALDATAVOS_OUTPUTGillingham_fig?8.html\"\
    \nimage_dpi=300 style=GrayscalePrinter;\nods graphics on / imagefmt=png;\ntitle\
    \ \"FREQ OF INPATIENT AVG LENGTH OF STAY\";n\nproc freq data=util.stay_util(where=(1<=ip_alos<=5));\n\
    \  tables ip_alos;\nrun;\n\\ods html close;\n```"
  merge: -1
  img_proc: true
