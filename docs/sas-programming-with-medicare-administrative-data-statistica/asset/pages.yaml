  md: '# Hospice Claims Data


    The hospice claims data contain information on final action claims submitted for
    hospice (also referred to as "end of life" or palliative care) services.¹¹ Hospice
    programs provide care for Medicare beneficiaries who are terminally ill. The focus
    of hospice is on the comfort of the patient and not on healing or curing illness.


    A beneficiary qualifies for hospice services if the beneficiary has Medicare Part
    A and is terminally ill. A beneficiary is considered terminally ill if the beneficiary''s
    doctor certifies the beneficiary has less than six months to live, the beneficiary''s
    illness follow a normal progression.


    Hospice services include physical care provided by doctors and nurses, care provided
    by hospice aides, occupational therapy, physical therapy, medical equipment and
    supplies, and even grief counseling and respite care (provided in a facility designed
    to give family members a break from giving care) for the beneficiary''s family
    members. All hospice services are covered as long as they are related to the beneficiary''s
    terminal illness (services not related to the terminal illness are covered by
    other Medicare benefits). Many of these services involve pain management, and
    services may take a place in the beneficiary''s home.


    Hospice care is insured in benefit periods, meaning that a Medicare beneficiary
    can get hospice care for two 90-day periods and then an unlimited of 60-day benefit
    periods. The doctor must certify that the beneficiary is terminally ill at the
    beginning of each period. Medicare beneficiaries have the right to stop hospice
    care at any time for any reason, and the right to change hospice providers once
    each benefit period.


    # Commonly Retained Elements in Administrative Claims Data


    With about 47 million beneficiaries to account for, Medicare administrative claims
    files can be very large. Generally, the carrier file is the largest Medicare dataset
    used for research purposes. The large size makes sense because the file contains
    claims for the most common type of service, a visit to the doctor!


    One common way of using the large datasets is to limit the files to contain only
    the key variables needed for your project. In Chapter 4, we will start the planning
    for our project at which time we will begin to get a good idea of the variables
    we will need for the successful completion of our sample research programming
    project. At a minimum, when performing research, it is standard practice to keep
    the following variables in the administrative files:¹²


    +   - The beneficiary''s identifier:¹³ Commonly referred to as HICAN (usually
    pronounced "high-can") or HIC, this variable may not exist as its data element
    in the Medicare research files we will receive. Although the data we will work
    with contains a ready-made, scrambled beneficiary identifier called BENE_ID, you
    may have to create the HIC by concatenating the beneficiary''s Claim Account Number
    (CAN) and the beneficiary''s identification code (also known as the BIC). A beneficiary''s
    identifier can change over time if a beneficiary''s'
