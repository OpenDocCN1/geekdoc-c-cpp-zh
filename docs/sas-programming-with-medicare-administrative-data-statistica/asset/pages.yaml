    \ set labeled CST.IP_COST_ALL.\n\n```\n/ STEP 8.6: CALCULATE TOTAL AND AVERAGE\
    \ INPATIENT COSTS FOR ALL\nBENEFICIARIES WITH AT LEAST ONE INPATIENT CLAIM */\n\
    proc sql;\n    create table cst_ip_cost_all as\n    select count(distinct bene_id)\
