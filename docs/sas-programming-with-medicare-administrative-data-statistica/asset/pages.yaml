    # Introduction and Goals


    Measuring cost is important because it gets to the heart of the sustainability
    of any insurance program, and Medicare is certainly no exception. It is no understatement
    to say that the measurement of cost in the Medicare program is a hot topic. Any
    newspaper or magazine or turn on the evening news and you will see that reducing
    cost without negatively affecting the quality of care is the order of the day.
    In other words, the mission is to monitor and improve the value of purchased healthcare.
    To play a part in accomplishing this mission, we must learn how to measure the
    cost of. In addition, we must learn to measure the quality of cost, which we will
    do in Chapter 9 as we look at chronic conditions.


    Utilization and cost are intimately linked to cost, but not in ways one might
    assume. In your research, may wish to go beyond simple measures of utilization
    and actually define categories of services whose payments may have been reduced
    by an incentive program. For example, did a program reduce the number of hospital
    stays, reducing total cost per beneficiary? Alternatively, did a program reduce
    the number of annual checkups, resulting in higher costs driven by an increase
    in the number of hospital stays?


    In this text, the term “cost” is limited to the cost of service to Medicare. We
    will not study the total cost of services, which includes costs to beneficiaries,
    like coinsurance and deductibles. We are not studying services not covered by
    Medicare, like cosmetic surgery. In addition, because we retained only claims
    for acute short-stay hospitals in our inpatient data, we are not including payments
    for some'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 92 SAS Programming with Medicare Administrative Data


    services, like inpatient rehabilitation. Wrangling with all of these issues is
    beyond the scope of the introductory text, but it is important for readers to
    begin to think about these issues and prepare to account for them (or study them!)
    in their research work. Rather, we utilize the Medicare payment variables in our
    claims sets (i.e., the amount paid by the Medicare program to the provider for
    the services (rendered) to determine costs to Medicare. Therefore, when we use
    the term “cost,” we are speaking about the payment made by Medicare for the service,
    which is the same as the cost of the service to Medicare.


    It is worth noting that Medicare does not pay for all services in the same manner.
    Since 1984, Medicare has been moving away from fee schedule and cost reimbursement
    to Prospective Payment Systems (PPS). Specifically, in simple terms:


    +   * Carrier claims are paid on a fee schedule.

    * DME claims are paid using categorized fee schedules.

    * As discussed in Chapter 7, inpatient claims can be paid proactively (using the
    Inpatient Prospective Payment System, or IPPS) or on a cost basis (e.g., for critical
    access hospitals). Hospitals in Maryland are paid on a rate commission because
    they do not participate in IPPS.

    * Outpatient claims are paid using the Outpatient Prospective Payment System (OPPS).
    Medicare Part B pays for the outpatient services a beneficiary receives. For this
    reason, the claims in the inpatient data are referred to as “institutional Part
    B” claims.

    * Skilled nursing facility claims are paid proactively. The Prospective Payment
    System (PPS) for SNF claims is based on a predetermined rate for each day of care.

    * Home health agency claims are paid proactively. The PPS for home health is based
    on a predetermined rate applied to each 60-day episode of home health care.

    * Hospice care claims are paid on a daily payment rate that does not take into
    account the level of services provided on any given day of hospice care.


    In order to get a handle on the cost outcomes of the incentive program, we will
    code algorithms to the following:


    +   * Measure evaluation and management (E&M) costs in a physician office setting.

    * Measure inpatient hospital costs.

    * Measure total Part A costs (i.e., those costs associated with inpatient, skilled
    nursing facility (SNF), home health, and hospice services).


    You may have noticed that we are not looking at ED costs. Why? As discussed in
    Chapter 7, we use separate criteria for identifying emergency department services
    that resulted in an admission to the hospital, and not resulting in an admission
    to the hospital. Although identifying the professional component of emergency
    department costs is straightforward, compiling cost information from the inpatient
    and inpatient claims data is not straightforward, and beyond the scope of this
    text. For example, emergency department services found in the inpatient file revenue
    center items are not necessarily reflective of the payment made by Medicare for
    those services. Although it is'
