  md: '# Chapter 9: Programming to Identify Chronic Conditions 121


    +   Programmed simple algorithms to identify the occurrence of diabetic eye exams
    by searching for procedure codes that identify retinal eye exams in the Part B
    carrier data for beneficiaries identified as diabetic.


    +   Programmed simple algorithms to identify hospital readmissions for beneficiaries
    with COPD within 30 days of a discharge for any hospitalization.


    # Exercises


    +   When using carrier lines to identify beneficiaries with diabetes, investigators
    often look for those separated by one or more days. In this case, we are looking
    for a diabetes diagnosis on two separate claims, but those claims could occur
    during the same period. You can modify Step 9.1 through Step 9.4 to identify and
