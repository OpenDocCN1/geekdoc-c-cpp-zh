  md: '# Chapter Summary


    In this chapter we used the 2010 MBSF data sets to begin our research programming
    project. We:


    +   - Specified our continuous enrollment criteria and wrote code to identify
    beneficiaries were continuously enrolled in Medicare FFS throughout calendar year
    2010. We used this information to delimit the 2010 MBSF data.

    - Created and retained data elements for displaying results by Medicare coverage
    characteristics, sex, race, age groupings, and state and county name.

    - Learned about commonly used enrollment data elements like the date of death,
    Parts A and B coverage, HMO enrollment, and beneficiary date of birth.

    - Wrote an algorithm to calculate beneficiary age and create beneficiary age categories.

    - Learned about SSA state and county codes, and created an algorithm to merge
    state and county name information onto our enrollment data.

    - Created a final analytic file of enrollment information that we will use for
    the remainder of our programming for our sample research project.


    # Exercises


    +   1. Alter the continuous enrollment specifications and code to flag beneficiaries
    who continuously enrolled for any six consecutive months in 2010.

    2. Using the 2010 MBSF data, write code to retain beneficiaries who reside in
    the following states: Pennsylvania, District of Columbia, Maryland, Michigan,
    Ohio, and Virginia. What variable describes the beneficiary''s state of residence?
    Be sure to include a frequency to present your results.

    3. In this chapter, we wrote our code in piecemeal fashion for educational purposes.
    We use the same steps and illustrative coding process in later chapters. For your
    own projects, you may want to combine some of the code into fewer steps for efficiency
    reasons. Can you rewrite the code in this chapter so it is more efficient? How
    would you measure efficiency?'
