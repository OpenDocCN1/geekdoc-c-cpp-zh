  md: "# Age Groups\n\nNext, let's define and group the age category to which a beneficiary\
    \ belongs. Suppose for illustrative purposes we wish to calculate each beneficiary's\
    \ age as the beginning of the reference year (in our case, January 1, 2010). In\
    \ Step 6.5, we use ENR.CONTENTR_2010_FNL data to calculate this variable and call\
    \ it STUDY_AGE. Suppose further that we wish to create a variable that describes\
    \ a beneficiary's inclusion in one of four age groups: 65, 65-74, 75-84, 85-95\
    \ and older. Also in Step 6.5, we create a variable AGE_CATS that groups beneficiaries\
    \ by their value of STUDY_AGE. Note that we use PROC FORMAT to create a format\
    \ AGE_CATS_FMT that we apply to the display of AGE_CATS below.\n\n```\n* STEP\
    \ 6.5: CREATE VARIABLE STUDY_AGE CATEGAS AS OF\n01.01.2010 /*\n* STEP 6.5 (CONT):\
    \ CREATE VARIABLE AGE_CATS THAT GROUPS STUDY_AGE INTO\nAGE CATEGORIES */\nproc\
    \ format;\nvalue age_cats_fmt\n0='AGE LESS THAN 65'\n1='AGE BETWEEN 65 AND 74,\
    \ INCLUSIVE'\n2='AGE BETWEEN 75 AND 84, INCLUSIVE'\n3='AGE BETWEEN 85 AND 94,\
    \ INCLUSIVE'\n4='AGE GREATER THAN OR EQUAL TO 95';\nrun;\n\ndata enr.contentr_2010_fnl;\n\
    set enr.contentr_age_cats_fmt;\nstudy_age=floor((intk('month', bene_dob, '01jan2010'd)\
    \ - day(bene_dob)) / 12);\nselect;\nwhen (study_age<65) age_cats=0;\nwhen (65<=study_age<=74)\
    \ age_cats=1;\nwhen (75<=study_age<=84) age_cats=2;\nwhen (85<=study_age<=94)\
    \ age_cats=3;\nwhen (study_age>=95) age_cats=4;\nend;\nlabel age_cats='Beneficiary\
    \ age category at beginning of reference\nyear (January 1, 2010)';\nrun;\n```\n\
    \nFinally, in Step 6.6, Output 6.4 shows the results of Step 6.5 (still using\
