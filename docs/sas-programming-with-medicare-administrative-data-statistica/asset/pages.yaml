    # Part B Claims Data


    Carrier claims contain claims information filed by non-institutional providers
    using the CMS-1500 claim form. When a Medicare beneficiary goes to the doctor
    for a checkup, the provider electronically submits a bill to Medicare Part B using
    the ANSI 837 5010 electronic format (or, the CMS-1500 paper form). The CMS-1500
    form details the beneficiary and provider identifiers, dates of service, the procedures
    performed, and the patient''s medical diagnoses. The submitted claim goes to the
    provider''s Medicare Administrative Contractor (MAC) for adjudication, processing,
    and payment. The final action Medicare claims are then made available to the research
    community as the carrier claims data.


    In my experience, users mostly associate these files with individuals internal
    medicine specialists or cardiologists. In other words, most users associate the
    carrier data set with claims for services provided in a doctor''s office, like
    a checkup. However, the carrier data set also includes claims submitted by providers
    that you may not readily consider, like social workers, chiropractors, ambulances,
    nurse practitioners, and physician assistants. In addition, the file also includes
    claims for services performed outside of a doctor''s office, like ambulatory surgical
    centers, hospital outpatient departments, and hospital emergency departments.


    # Durable Medical Equipment (DME) Data


    The file contains information on final action claims submitted by non-institutional
    DME providers using the CMS-1500 claim form. ⁶ These claims are processed by the
    provider''s Medicare Administrative Contractor (MAC) for adjudication and payment.
    The final action Medicare claims are then made available to the research community
    as the DME claims data. Durable medical equipment includes wheelchairs and walkers,
    hospital beds, blood glucose monitors and related supplies, canes and'
