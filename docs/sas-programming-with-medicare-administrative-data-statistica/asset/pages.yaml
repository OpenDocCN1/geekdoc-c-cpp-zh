    # ## Algorithms: Hospital Readmissions for Beneficiaries with COPD**


    Let''s look for readmissions within 30 days of discharge for a hospitalization
    for any reason. As you advance your skills, you will be asked to program more
    complicated algorithms. For example, you may be asked to calculate readmission
    after a specific event, like a hospitalization for COPD or Acute Myocardial Infarction
    (AMI). In our case, we are simply looking for readmission within 30 days of any
    hospitalization for our population of beneficiaries identified as having COPD,
    so we do not need to worry about identifying any diagnosis codes. In some cases,
    the reader may wish to use both prior and subsequent years of data in order to
    identify admissions and subsequent readmissions that occurred later in the study
    year, well as early in the study year as a result of an admission in the year
    preceding the study year (in our case, calendar year 2010). For our simple instructional
    example, this will not be necessary.'
