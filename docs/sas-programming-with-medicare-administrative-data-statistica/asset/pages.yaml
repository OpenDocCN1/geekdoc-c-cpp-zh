    \ already exists on the output data set CND.READ_COPD_COND.\n\n```\n* STEP 9.9:\
    \ IDENTIFY READMISSIONS WITHIN 30 DAYS OF ANY DISCHARGE */\nproc sql;\n    create\
    \ table cnd.readm_copd_cond as\n    select a.*, b.readm\n    from copd_ip(keep=bene_id\
    \ dschrgdt) a, copd_ip(keep=readm) b\n    admsn_dt rename=(admsn_dt=bene_id)\n\
    \    where a.bene_id=b.bene_id\n    having ((readm-dschrgdt+1)<=30));\nquit;\n\
