  md: '# 12 SAS Programming with Medicare Administrative Data


    vaccinations. In addition, Part B coverage includes durable medical equipment
    (DME). The vast majority of beneficiaries with Part A coverage also purchase Part
    B coverage. Taken together, Medicare Parts A and B are also known as “original
    fee-for-service (FFS),” “original Medicare,” or “traditional Medicare” coverage.


    +   - Part C, also known as Medicare Advantage (MA) or may care, provides beneficiaries
    with the option of enrolling in a private insurance plan as opposed to participating
    in Medicare fee-for-service coverage. Private plans include health maintenance
    organizations (HMOs), preferred provider organizations (POs), private FFS plans,
    Special Needs Plans, and Medicare Medical Savings Accounts Plans. These MA plans
    receive payments from Medicare (and premium payments from Medicare) to provide
    benefits provided by Medicare A (excluding hospice), Part B, and usually Part
