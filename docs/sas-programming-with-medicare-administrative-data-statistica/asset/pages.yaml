    # Algorithms: Presenting Mean Medicare Part A Payments per Beneficiary by State
    and County


    Understanding the landscape of costs to Medicare adds an important dimension to
    our analyses. For, if our population contains many beneficiaries identified as
    having COPD, we might expect payments made by Medicare to be higher for this study
    population. In addition, understanding total costs to Medicare for the beneficiaries
    in our study population opens the gateway to further analyses. For example, we
    could combine some of the techniques developed in these steps and apply them to
    a study of total costs to Medicare by chronic condition, or by provider in our
    study population.'
