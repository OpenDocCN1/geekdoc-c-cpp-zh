    \ 88\nExercises..............................................................................................................................\
    \ 88\n\n# Introduction and Goals\n\nService utilization is an important component\
    \ of our work because measuring the use of healthcare services is necessary to\
    \ determine things like patterns of care, access to care, resource use, and quality\
    \ of care. Our research programming project requires us to calculate utilization\
