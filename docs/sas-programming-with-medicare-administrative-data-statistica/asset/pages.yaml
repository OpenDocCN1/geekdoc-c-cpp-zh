    \ procedure code and diagnosis code formerly stored in individual rows in the\
    \ line file are now arranged in a single row, with the base detail of the dates\
    \ on the claim (**FROM_DT** and **THRU_DT**).\n\n# Figure 5.4: Merged Transformed\
    \ Line and Base Claim Files\n\n| Obs | BENE_ID | CLM_ID | hcpcs_cd1 | hcpcs_cd2\
    \ | hcpcs_cd3 | line_ic_dgns_cd1 | line_ic_dgns_cd2 | line_ic_dgns_cd3 | FROM_DT\
    \ | THRU_DT |\n|---|---|---|---|---|---|---|---|---|---|--|\n| 4 | 0001847456286892\
    \ | 88072338578164 | 99223 | 4048 | 56211 | | 33818 | | 20100329 | 20100529 |\n\
    \n# Chapter Summary\n\nIn this chapter, we learned how to receive, load, and transform\
    \ the Administrative claims and enrollment data we use to complete our research\
    \ programming project. To this end, we discussed the following information:\n\n\
    +   - A request can take a lot of time and cost a lot of money to fulfill, so\
    \ it is important to plan as much as possible before initiating our data request.\n\
    - Depending on the source of funding, there are several routes to procuring Medicare\
    \ data for research purposes. We discussed CMS’s Integrated Data Repository (IDR),\
    \ Data Extract System (DESY), and Virtual Research Data Center (VRDC). In addition,\
    \ we discussed the Research Assistance Center (ResDAC), and CMS’s data distribution\
    \ contractor.\n- ResDAC and CMS’s data distribution contractor are the research\
