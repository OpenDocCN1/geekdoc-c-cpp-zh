- pgno: 12
  md: '# About The Author


    Matthew Gillingham is the director of health research systems at Mathematica Policy
    Research. His career in health care data analytics began with analyzing commercial
    claims and enrollment data. For more than ten years, he has used SAS to build
    software that analyzes administrative health care and Medicare administrative
    data. Specifically, Gillingham directs systems research and development work that
    uses large Medicare claims and enrollment data (files to monitor and report on
    health care quality and utilization for the Center for Medicare & Medicaid Services).
    In addition, he provides technical assistance and quality assurance on projects
    that use Medicare data to create analytic files for program evaluation, monitoring,
    and other research purposes.


    Learn more about this author by visiting his author page at http://support.sas.com/publishing/authors/gillingham.html.
    There, you can download free chapters, access example code and data, read the
    latest reviews, get updates, and more.'
