    ods graphics on = /imagefmt=png;\ntitle \"PRINT OF TOTAL AMBULANCE SERVICES BY\
    \ BENEFICIARY\"\nproc print data=util.amb_util(where=bene_id='073EAD53F4BBC1C1');\
    \ run;\nods close;\n```"
