  md: "```\n/* STEP 7.14: IDENTIFY CLAIMS WITH DATE RANGES TO BE COLLAPSED USING\n\
    CLAIM_SEGMENT_ID */\ndata &clmtyp.2010_stay(drop=bene_id2 thru_dt rename=(from_dt=begin_dos\n\
    end2=end_dos));\n  set &clmtyp.2010_fnl;\n  retain end2;\n  bene_id=iag1 (bene\
    \ id);\n  if bene_id2=bene_id and from_dt le (end2+1) then do;\n    from_dt=end2;\n\
    \    end2=max(thru_dt,end2);\n  end;\n  else do;\n    claim_segment_id+1;\n  \
    \  end2=thru_dt;\n  end;\n  format end2_dt mmddyy10.;\nrun;\n```\n\nStep 7.15\
    \ keys on the CLAIM_SEGMENT_ID to collect the records outputted in Step 7.14.\
    \ Specifically, for records with the same value of CLAIM_SEGMENT_ID, the code\
    \ outputs a single record that contains a value of FROM_DT equal to the earliest\
    \ FROM_DT in the set of claims, as well as a value of THRU_DT equal to the latest\
    \ value of THRU_DT in the set of claims. In case of records that fall in Scenario\
    \ #4, the code will output multiple records for the beneficiary. Finally, the\
    \ code calculates the length of stay (called LOS) as the difference of the THRU_DT\
    \ and the FROM_DT on each output record. The outputted analytic files, UTL.SN_2010\
    \ STAY, UTL.HH_2010 STAY, are saved as permanent data sets for future use.\n\n\
    ```\n/* STEP 7.15: COMBINE CLAIMS WITH OVERLAPPING SEGMENTS */\ndata util.&clmtyp.2010_stay_fnl(drop=begin_dos\
    \ end_dos\nclaim_segment_id);\n  retain thru_dt;\n  set &clmtyp.2010_stay;\n \
    \ by bene_id claim_segment_id;\n  format from_dt thru_dt mmddyy10;\n  if first.claim_segment_id\
    \ then do;\n    from_dt=begin_dos;\n  end;\n  if last.claim_segment_id then do;\n\
    \    thru_dt=end_dos;\n    los=thru_dt-from_dt;\n    output;\n  end;\nrun;\n%mend;\n\
    %clm_loop2(&clmtyp=sn);\n%clm_loop2(&clmtyp=hh);\n%clm_loop2(&clmtyp=hs);\n```"
