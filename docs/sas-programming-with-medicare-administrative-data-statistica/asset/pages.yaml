- pgno: 116
  md: "# Chapter 8: Measuring Costs to Medicare 101\n\nThere is, however, one major\
    \ difference: we figure out how to process inpatient claims that are named differently\
    \ than the SNF, some health, and hospice files in such a way as require special\
    \ coding in the macro. Indeed, the inpatient file we are using has already been\
    \ processed to exclude payment amounts. The name of this file does not follow\
    \ the same pattern as the other Part A files we are processing in the macro. To\
    \ include the processing of the inpatient files in the macro, we use %if logic\
    \ within the macro to identify the type of data that is being processed. Apart\
    \ from this, the code uses the data created in Chapter 7 (delimited by our enrollment\
    \ data and, in case of inpatient claims, type of hospital and value of payment\
    \ amount), and outputs separate files for each claim containing beneficiary identifiers\
    \ (BENE_ID) and total payments associated with that beneficiary (TOTCOST_BENE).\
    \ At this point, we have created payment summaries for each of the Part A claim\
    \ types.\n\n```\n* STEP 8.7: CALCULATE TOTAL BENEFICIARY INSTITUTIONAL COSTS USING\
    \ MACRO\nLOOP */\n%macro clm_loop(clmtype=);\ncreate table totcost_clmtyp.\n \
    \ select distinct (bene_id), sum(pmt_amt) as totcost_bene\n  if %clmtype=sn or\
    \ %clmtype=hh %hs then do;\n    from utl._clmtyp._2010_fnl\n  end;\n  else %clmtype=ip\
    \ %then do;\n    from utl._ip_2010_fnl_ss\n  end;\n  group by bene_id;\n  quit;\n\
    %mend clm_loop;\n%clm_loop(clmtype=ip);\n%clm_loop(clmtype=sn);\n%clm_loop(clmtype=hh);\n\
    %clm_loop(clmtype=hs);\n```\n\nNow that we have summarized payments by claim,\
    \ we can summarize beneficiaries’ total payments for all Medicare Part A services\
    \ performed the year. To complete this task, we must sum all of the payment amounts\
    \ calculated in Step 8.7. Step 8.8 utilizes the output of Step 8.7, concatenating\
    \ each data set from the macro used in Step 8.7. The concatenation is performed\
    \ by BENE_ID so that the data is sorted by beneficiary. Next, we leverage the\
    \ concatenation by beneficiary by \"group\" processing. Simply, for each beneficiary\
    \ identifier (BENE_ID), we set the total Part A payment variable (PA_TOTCOST_BENE)\
    \ equal to 0. Then, we add the payment summary for each beneficiary created in\
    \ Step 8.7 (the variable TOTCOST_BENE) to the PA_TOTCOST_BENE variable. In this\
    \ way, the PA_TOTCOST_BENE variable becomes the summary of each beneficiary’s\
    \ Part A payments. When the last record for the beneficiary is reached, the final\
    \ PA_TOTCOST_BENE value is outputted, and SAS processes data for the next beneficiary.\
    \ The final"
  merge: -1
  img_proc: true
