- pgno: 72
  md: "# Chapter 6: Working with Enrollment Data 57\n\nAll other values indicate that\
    \ the beneficiary was enrolled in managed care and what entity will process the\
    \ beneficiary’s claims.\n\n# Date of Death Variable\n\nThe date of death variable\
    \ (DEATH_DT) describes the date that a beneficiary died. We want to keep only\
    \ those beneficiaries who were alive in 2010. Although we will not use it, the\
    \ date of death variable can be confirmed by using the Valid Date of Death Switch\
    \ (V_DOD_SW); this variable indicates that the beneficiary’s date of death has\
    \ been confirmed by the Social Security Administration as accurate.¹ In this case,\
    \ we will choose to delimit our population to records where the DEATH_DT variable\
    \ is equal to missing, indicating that no date of death is available.\n\n# How\
    \ to Program in SAS to Define Continuous Enrollment in Medicare FBS\n\nNow that\
    \ we have specified how to define continuous enrollment, we can build the code.\
    \ The great thing about SAS is that there are many, many different ways to accomplish\
    \ a single task, and there is really no right or wrong method (as long as the\
    \ different approaches provide the same, correct answer?). That is, we are concerned\
    \ with efficiency when using Medicare data sets can be quite large. It is important\
    \ to get into the habit of reading and writing as few times as possible. Therefore,\
    \ we will attempt to perform the tasks listed above in few DATA steps as possible,\
    \ while creating code that is (hopefully) useful from an instructional perspective.\
    \ In addition, we will take a first step in quality assuring our code by examining\
    \ our output and attempting to replicate our results.\n\nI present the following\
    \ method for identifying and retaining beneficiaries who have been continuously\
    \ enrolled in Medicare FBS. First, in Step 6.1, we perform a simple data step\
    \ to flag those continuously enrolled in Medicare Parts A and B. Specifically,\
    \ we create a variable called CONTENTRL_2010 that is set to ‘AB’ if the value\
    \ of BENE_HI_CVRAGE_TOT_MONS and BENE_SMI_CVRAGE_TOT_MONS both equal to 12, denoting\
    \ that the beneficiary was enrolled in Medicare Parts A and B for all twelve months\
    \ of the year. In this fashion, we create a variable called CONTENTRL_HMO_2010\
    \ that is set to ‘NHMO’ if the value of BENE_HMO_CVRAGE_TOT_MONS is equal to 0,\
    \ denoting that the beneficiary was not enrolled in an HMO at any time during\
    \ the year. Finally, we create a variable called DEATH_2010 that is set to 0 if\
    \ the value of DEATH_DT is null, denoting that the beneficiary was alive during\
    \ twelve months\n\n```\n* STEP 6.1: BUILD CONTINUOUS ENROLLMENT INFORMATION IN\
    \ 2010 MOBS FILE\n */\ndata contentrl_2010;\n    set src.mbsf_2010;\n    length\
    \ contentrl_ab_2010 contentrl_hmo_2010 $5;\n    /* FLAG BENEFICIARIES WITH PARTS\
    \ A AND B OR HMO COVERAGE */\n    if bene_hi_cvrage_tot_mons=12 and bene_smi_cvrage_tot_mons=12\
    \ then\n    contentrl_ab_2010='ab'; else contentrl_ab_2010='noab';\n    if bene_hmo_cvrage_tot_mons=12\
    \ then contentrl_hmo_2010='hmo'; else\n    contentrl_hmo_2010='nohmo';\n;\n```"
  merge: -1
  img_proc: true
