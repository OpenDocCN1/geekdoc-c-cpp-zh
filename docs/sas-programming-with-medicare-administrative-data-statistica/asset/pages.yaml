    # Our Research Programming Technical Specifications


    As stated above, we will tackle the creation of detailed technical specifications
    in Chapters 5 through 10. However, it is worth to introduce the concept of technical
    specifications in advance of those chapters. The purpose of programming specifications
    is to guide the development of SAS code by providing written instructions on what
    the SAS code must do to create the required output. In addition, specifications
    document the reasoning behind important methodological and coding decisions. Specifications
    can come in many forms and describe what needs to be done at many levels; some
    specifications state the project objectives ("what" must be done) at a very high
    level, while other types of specifications provide a lot of detail on "how" to
    do it needs.


    Research programming specifications are different from other kinds of programming
    specifications in that they contain less upfront detail and more for iterative
    development and discovery. Good research programming specifications state the
    objects of the project (by clearly describing the research questions intended
    to be answered) and provide information on the inputs required (including the
    datasets and variables needed), the calculations to be performed, and the required
    output. Therefore, teams that must understand the research questions and even
    if you are a one-person team who is formulating the research questions and answering
    them by writing and executing SAS code, it is worth creating specifications because
    they help identify all of the processing steps upfront. At the very least, it
    is a best practice to use programming specifications to guide any code walkthrough
    or technical review of our code.


