    \ providers to reduce costs and improve quality. Measuring the utilization characteristics\
    \ of our provider population helps us understand the lay of the land so that we\
    \ can better comment on why an incentive payment may or may not have worked. For\
    \ example, perhaps an incentive payment did not work because of geographic differences\
    \ in how medicine is practiced. If that were the case, one outcome of our evaluation\
    \ would be to recommend investigating medical education and methods of practice\
    \ in order to reduce costs."
