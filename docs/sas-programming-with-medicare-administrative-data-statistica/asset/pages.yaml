  md: 'As discussed in Chapter 3, Healthcare Common Procedure Coding System (HCPCS)
    Level I codes, also known as Current Procedural Terminology (CPT) codes, are five
    digit numbers describing medical services, and are a copyrighted coding schema
    of the American Medical Association (AMA). HCPCS Level II codes are five alphanumeric
    codes defining services not described by the Level I codes.


    Note that the use of the here is a personal preference and may not be necessary
    in your application.


    If you wish to look into transfers further, they can be simply defined by identifying
    two or more sequential claims for a beneficiary, where the providers are different,
    and the first date of service on the latter claim (represented by the ADMSN_DT
    variable) is equal to the last date of service or one day after the last date
    of service on the previous claim (represented by the DSRGDT variable). For more
    information, ResDAC’s article called Identifying Multiple Claims for a Hospital
    or Skilled Nursing Facility Stay, available at http://www.resdac.org/reconnect/articles/125.


    The Hospital Compare website is at http://www.medicare.gov/hospital-compare.


    Specifications in this section adapted from ResDAC’s article called How to Identify
    Emergency Room Services in the Medicare Claims Data, available at http://www.resdac.org/reconnect/articles/144.


    In general, while there are a number of reasons that beneficiaries are seen in
    an ED, which could encompass a large range of E&M codes, we are focusing on ED
    and E&M codes as defined in the HCPCS manual.


    In addition, the FROM_DT is always equal to the THRU_DT on the first claim in
    a set for home health services (see the definition of the FROM_DT variable available
    on ResDAC’s website at http://www.resdac.org/cms-data/variables/Claim-Date).


    This algorithm is adapted from a SUG paper by Doug Shannon and Wade Bannister,
    available on VALUG’s website at http://www.valsug.org/meetings/2004/jan/SASPaper-OverlappingDateSegments-D&W.pdf.
    I like its comprehensive approach to identifying and collapsing records in a SAS
    set with consecutive and overlapping dates, as well as records that are not consecutive
    or overlapping.'
