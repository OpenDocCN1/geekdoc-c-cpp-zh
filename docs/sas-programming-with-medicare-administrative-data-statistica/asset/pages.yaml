    # Algorithms: Measuring Utilization of SNF, Home Health Agency, and Hospice Care


    Claims for SNF and hospice services are billed in 30-day increments; claims for
    home health services are billed in 60-day increments. If a beneficiary is discharged
    (or expires) prior to the completion of a 30- or 60-day period, the last claim
    in a set may be for that 30 or 60 days, respectively. Therefore, when sorting
    claims from FROM_DT and THRU_DT for a beneficiary''s home health care, we expect
    to see claims with a length of stay of 60 days. We may also see claims with a
    length of stay of more than 60 days for the last claim in the stay. In order to
    determine length of stay, we must collapse claims that comprise a single stay.


    +   * Scenario #1: With consecutive dates of service, defined where the THRU_DT
    on the earlier claim is within one day of the FROM_DT on the next earliest claim.
    For example, the first claim in a set contains a FROM_DT equal to March 1, 2010
    and a THRU_DT equal to April 30, 2010,'
