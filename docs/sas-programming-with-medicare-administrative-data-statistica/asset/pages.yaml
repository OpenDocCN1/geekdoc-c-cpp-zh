  md: '# Chapter Summary


    In this chapter, we used our claims and enrollment data to program measurements
    of utilization and output analytic files containing utilization data for our population.
    Specifically, we:


    +   - Delimited the claims data we will use throughout the remainder of this book
    by the beneficiary population created in Chapter 6.

    - Programed an algorithm to measure utilization of evaluation and management (E&M)
    services in a physician office by defining procedure codes that define E&M visits
    and searching the array of line-level procedure code variables in the Part B carre
    for any of these procedure codes

    - Programed an algorithm to calculate inpatient stays, discussed how most records
    in the inpatient data set represent a stay, learned how to define acute short-stay
    hospitals, and programed an algorithm to determine the length of stay.

    - Programed an algorithm to measure the professional component of emergency department
    (ED) services by defining how to find ED services in claims data and learning
    to search procedure codes for some of those services

    - Programed an algorithm to measure utilization of ambulance services by defining
    the procedure codes that characterize ambulance services and counting the total
    occurrences of these codes on a given claim.

    - Programed algorithms for measures of utilization for outpatient visits, SNFs,
    home health agencies, and hospice services.


    # Exercises


    +   1. Can you rearrange programming in Step 7.6 through Step 7.9? Does the program
    run faster?

    2. Can you write code for collapsing stays of multiple claims into a single record
    containing all information for the stay?

    3. Can you think of how the algorithms for identifying the professional component
    of ED services can be modified to search the inpatient and outpatient files for
    the existence of revenue center codes that define an ED service?

    4. Perform the following thought experiment: Assuming you have data on durable
    equipment claims, apply what you learned in this chapter to write some pseudocode
    to identify utilization of wheelchairs and hospital beds.

    5. Can you apply the logic used to define stays in the Skilled Nursing Facility
    file to inpatient data to account for multi-claim stays in the inpatient file?'
