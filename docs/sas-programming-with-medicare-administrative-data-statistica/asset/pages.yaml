- pgno: 89
  md: "# 74 SAS Programming with Medicare Administrative Data\n\nwe do not use every\
    \ procedure code that begins with \"99\". For example, procedure code values like\
    \ 99241 and 99245 identify consultations, but those consultations take place outside\
    \ of a physician's office.\n\n```\n* STEP 7.2: DEFINE E&M CODES *\n*let emcodes='99201',\
    \ '99202', '99203', '99204', '99205', '99211',\n'99212', '99213', '99214';\n```\n\
    \nIn, Step 7.3, we search the claims data set (the \"physician office setting\"\
    \ part of criteria) UTL_CARR_2010 FNL for the procedure codes contained in our\
    \ macro variables. The carrier claims has 13 line items, so our data set has 13\
    \ procedure codes to search on per-claim (or per-record). We perform this search\
    \ by creating an array HPCSCD that represents the procedure code variables (HPCS_CD1-HPCS_CD13).\
    \ Then, we create a flag called EM_SVC that is set to a value of 1 if one of the\
    \ procedure code variables in the array is in the set of procedure codes defined\
    \ by the macro variables. If such evidence is found, the leave statement ends\
    \ the processing, and the next record is searched (in other words, we not counting\
    \ all E&M services that could be on the claim, but searching for evidence of a\
    \ single E&M service). The output (EM_UTIL) contains the claims in the carrier\
    \ data set, with a reduced set of variables that define the beneficiary, dates\
    \ of service, provider, and flag indicating an E&M service was discovered. This\
    \ output file contains only records where EM_SVC is equal to 1.\n\n```\n* STEP\
    \ 7.3: PULL RECORDS FROM CARRIER FILE BASED ON EMCODES LIST */\ndata em_util (keep=bene_id\
    \ em_svc);\n  set utl.carr_2010 fnl (keep=bene_id expnsdt=prfnpi; hcpcs_cd:);\n\
    \  array hcpcscd(13) hcpcs_cd1-hcpcs_cd13;\n  em_svc=0;\n  do i=1 to 13;\n   \
    \ if substr(hcpcscd(i),1,5) in (&emcodes) then;\n      em_svc=1;\n      leave;\n\
    \  end;\n  if em_svc=1;\n```\n\nIn Step 7.4, we duplicate the EM_UTIL by beneficiary\
    \ identifier, keeping only one record per beneficiary, where there is evidence\
    \ of an E&M service. We output a permanent file called UTL_EM_UTIL. In other words,\
    \ this is a list of beneficiaries for whom found evidence of an E&M service in\
    \ our carrier data claims.\n\n```\n* STEP 7.4: DE-DUPLICATE TO CREATE LIST OF\
    \ BENEFARIES WITH AT LEAST ONE E&M SERVICE */\nproc sort data=em_util out=util.em_util\
    \ nodupkey;\n  by bene_id;\n```"
  merge: -1
  img_proc: true
- pgno: 90
  md: "# Chapter 7: Measuring Utilization of Services\n\n# Algorithms: Measuring Inpatient\
    \ Hospital Utilization\n\nOur inpatient data are at the claim level, not the stay\
    \ level. An inpatient stay can be comprised of many claims. CMS offers a stay-level\
    \ file, with these claims collapsed to a single stay record, but we did not request\
    \ this data. On past projects, I have been responsible for the complicated process\
    \ of writing specifications to convert inpatient claims into stay-level records.\
    \ Luckily, stays comprised of multiple claims records are not common. Independent,\
    \ stays comprised of multiple claims comprise only one or two percent of all inpatient\
    \ claims. Therefore, we will proceed with our discussion of stays as:\n\n+   1.\
    \ To keep the book at the introductory level, we will identify and keep only those\
    \ claims in our inpatient data set for acute short-stay hospitals (more on below).\n\
    \n+   2. We will treat our inpatient claims as stays and ignore the fact that\
    \ we have a very small number of hospital stays in our inpatient data that are\
    \ comprised of multiple claims. We will also ignore that some records represent\
    \ transfers to others. (See the Exercises below for a question on how to collapse\
    \ multiple claims into a single record.) We use these claims to calculate the\
    \ number of inpatient stays, the length of each stay, and the average length for\
    \ a beneficiary.\n\nIn First, 7.5, we focus on delimiting our population to acute\
    \ short-stay hospitals, as well as keeping only those records with non-negative\
    \ payment amounts. Medicare distinguishes acute short-stay hospitals between Medicare\
    \ Prospective Payment System (IPPS) and critical access hospitals (CAHs). IPPS\
    \ hospitals are paid as an inpatient set prospectively (i.e., determined in advance)\
    \ based on a patient's condition (i.e., diagnosis) and treatment (i.e., procedures).\
    \ These payments are based on the Medicare Severity-Related Groups (MS-DRGs).\
    \ CAHs are limited to 25 or fewer beds and primarily operate in rural areas. They\
    \ are paid on the basis of cost (i.e., We delimit our inpatient claims data set\
    \ to these acute short-stay hospitals because these are seen as different hospitals\
    \ like inpatient rehabilitation, long-term care, and inpatient psychiatric facilities\
    \ (e.g., CMS's Hospital Compare* only reports on acute short-stay hospitals).\n\
    \n```\n* STEP 7.5: IDENTIFY AND KEEP ONLY TH CLAIMS FOR STAY HOSPITALS AND NON-NEGATIVE\
    \ PAYMENTS *\ndata util_ip_2010_fnl;\n  set util_ip_2010_fnl;\n  provtype = substr(provider,3,4);\n\
    \  if ('0001'<=provtype<=0899') or ('1300'<=provtype<=1399') and pmt_>0;\nrun;\n\
    ```\n\nHow do we define short-stay hospitals? The PROVIDER variable is the identifier\
    \ for the hospital and it contains embedded intelligence. Specifically, the first\
    \ two positions of the PROVIDER variable identify the SSA state code for the hospital's\
    \ location, and the third and fourth positions identify the category of the hospital.\
    \ We will use this identifier to find IPPS hospitals and CAHs. IPPS hospitals\
    \ are identified where the substring of the PROVIDER variable, starting at the\
    \ third position through the sixth position, is equal to 0001 through 0899. CAHs\
    \ are identified where the\n\n*"
  merge: -1
  img_proc: true
- pgno: 91
  md: "# 76 SAS Programming with Medicare Administrative Data\n\nsubstring of the\
    \ PROVIDER variable, starting at the third position until the sixth position,\
    \ is equal to 1300 through 1399. Therefore, we create a variable called PROVTYPE\
    \ that is this substring of the PROVIDER variable, starting at the third position\
    \ and ending with the sixth position (inclusive). Then, we output a set UTLIP_2010\
    \ FNL_SS, keeping only those records with values of PROVTYPE that identifies IPSF\
    \ and critical access hospitals. We output this data to a permanent library because\
    \ we will use it in Chapter 8 when we measure Medicare payments for inpatient\
    \ services (i.e., we will measure payments only for those services that occurred\
    \ in acute short-stay hospitals).\n\nIn addition to keeping only inpatient patients\
    \ that occurred in acute short-stay hospitals, our code in Step 7 also uses the\
    \ Medicare payment amount (PMT_AMT) to remove inpatient with negative payment\
    \ amounts. There should be few such claims. Generally, these claims are excluded\
    \ because the Medicare payment amount is seen as an indicator that information\
    \ on the claim may not be reliable. In some instances, investigators do not use\
    \ claims with negative payments for payment analysis, but do these claims for\
    \ utilization and quality analyses. For example, in studying quality of care,\
    \ we may choose to \"err on the side of the provider\" and look for evidence of\
    \ a service that indicates high care (a retinal exam) regardless of the value\
    \ of payment. In our example research project, we will keep it and exclude these\
    \ records from the inpatient data for the remainder of our work. Therefore, from\
    \ this point forward, we will use the output of Step 7, called UTLIP_2010 FNL_SS,\
    \ for all work requiring inpatient claims.\n\nIn Step 7, we use the UTLIP_2010\
    \ FNL_SS data set that contains only claims for acute short-stay hospitals to\
    \ calculate the length of stay (IP_POS), measured in days for each beneficiary's\
    \ hospital stay. In simple terms, the length of stay is the discharge date (DISCHGRDT)\
    \ less the admission date (ADMS_DT), plus one day to account for (without adding\
    \ one day, the result would be a day of zero days). In some cases, you may consider\
    \ writing although for cases where the admission and discharge dates fall on the\
    \ same day, or stays longer than a single day. We also perform a frequency distribution\
    \ of the length of stay calculations. We output a set called STAY_UTIL, which\
    \ contains beneficiary and provider identifiers, the start and end days of the\
    \ hospitalization, and the calculated length of stay. We also perform a frequency\
    \ distribution of IP_POS, using SAS' Output Delivery System to create our results.\n\
    \n```\n* STEP 7.6: CALCULATE LOS, ASSUMING EVERY INPATIENT CLAIM IS A STAY /\n\
    data stay_util(keep=bene_id admn_dt dischgrdt provider ip_pos);\n  set utlip_2010\
    \ fnl_ss, admn_dt=1;\nrun;\nods html file=\"Users\\Gillingham\\Desktop\\BookFINAL_DATA_OUTPUT\\\
    Gillingham_fig_6.html\"\n  image_dpi=300 style=GrayscalePrinter;\nods graphics\
    \ on / imageft=png;\n  title \"FREQ OF INPATIENT LENGTH OF STAY\";\nproc freq\
    \ data=stay_util(where=(1<=ip_pos<=10));\n  tables ip_pos;\nrun;\nods html close;\n\
    ```"
  merge: -1
  img_proc: true
