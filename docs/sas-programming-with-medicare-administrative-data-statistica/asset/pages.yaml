- pgno: 109
  md: '# SAS Programming with Medicare Administrative Data


    As in previous chapters, the output of this chapter will be analytic files at
    the beneficiary level. We will use this output for later programming work. Looking
    forward, we will continue to build on the work performed in Chapters 5, 6, and
    7 (and this chapter). In Chapter 9, we will combine the study of chronic conditions
    with the study of quality of care by identifying services provided to beneficiaries
    with diabetes and COPD, adding an important dimension to our analysis. In Chapter
    10, we will end our project by summarizing all of our output.


    # A Note on Payment Standardization and Risk Adjustment


    One important note: In our example project, we plan to compare payments across
    regions. Two issues can make this effort problematic: Regional variations in costs
    and variations in cost based on patient severity.


    Now, it is time to play "good news and bad news." The good news is that we have
    solutions to these challenges! The bad news is that the study of these solutions
    unfortunately falls well outside the scope of this book! Of course, that is not
    going to spare your author from describing the solutions, called payment standardization
    and risk adjustment, in a bit more detail!


    Payment standardization is a fancy term for controlling differences in payments
    that are not related to patient care, as regional variations in costs that are
    driven by differences in wage rates between communities, standard of living, and
    the capital costs of hospitals. Risk adjustment is another fancy term that statistically
    holds constant demographic health status (severity) differences among patients
    in order to make cost and quality comparisons of medical interventions and treatments.


    How does all of this work? If we are trying to draw conclusions about regional
    variations in costs, it is important to account for the fact that costs in Washington
    can be higher than those of, say, rural Michigan simply because the cost of living
    in the Washington, DC metropolitan area is higher. Once we remove the fact that
    goods and services purchased in Washington, DC cost on average 30% more than those
    purchased in rural Michigan, we can make accurate comparisons between healthcare
    costs in these regions.


    Likewise, it is important to control for the fact that some providers or groups
    of providers see patients who are, on average, s or older than the patients seen
    by other providers. In fact, it is easy to imagine a situation where an elderly
    patient with co-morbidities has a higher chance of complications from surgery
    than a healthier, younger patient, resulting in the need for more services. This,
    in turn, may result in higher costs for this beneficiary. Again, both payment
    standardization and risk adjustment are topics for their own books. We will not
    use this method in our study, but it is important to know they exist and that
    CMS has methodologies and models for both subjects.'
