    \ the inpatient claims to identify admissions to a hospital that occurred within\
    \ 30 days of discharge for a previous admission.¹ Specifically, we use PROC SQL\
    \ code to create a data set CND.READ_COPD_COND that contains the beneficiary identifier\
    \ (BENE_ID), discharge date (DISCHRGDT), and admission date (ADMSN_DT) on claims\
    \ for COPD representing readmissions to a hospital that occur 30 days after an\
