  md: "# Algorithms: Measuring Evaluation and Management Payments\n\nWe identified\
    \ evaluation and management services in Chapter 7, but we did not retain the payment\
    \ variables in our output. What's more, we searched our carrier claims for evidence\
    \ of a single E&M service in a physician office setting for each beneficiary.\
    \ Now, we want to identify payments for E&M services in a physician office setting\
    \ for each beneficiary with at least one E&M service in a physician office setting\
    \ as a whole. For the population of beneficiaries. The code we write will be straightforward.\
    \ We will start by adding payments to our E&M algorithm that we developed in Chapter\
    \ 7. Then, we will use PROC SQL to sum payments, and a DATA step to calculate\
    \ payments per beneficiary.\n\nIn Step 8.1\n\n```\n* STEP 8.1: DEFINE EM CODES\
    \ */\n%let emcodes='99201','99202','99203','99204','99205','99211',\n'99212','99213','99214','99215';\n\
    ndata em_cost (keep=bene_id expnsdt; prvnpi; linepmt; hcpcs_cd; em_svc em_cost);\n\
    \  set util.carr_2010_fnl;\n  array hcpcscd(13) hcpcs_cd-hcpcs_cd13;\n  array\
    \ prvpmt(13) linepmt1-linepmt3;\n  retain em_svc em_cost;\n  em_svc=0;\n  em_cost=0;\n\
    \  do i=1 to 13;\n    if substr(hcpcscd(i),1,5) in (&emcodes) then do;\n     \
    \ em_svc=em_svc+1;\n      em_cost=em_cost+prvpmt(i);\n    end;\nend;\nrun;\n```"
  merge: -1
  img_proc: true
- pgno: 111
  md: "# SAS Programming with Medicare Administrative Data\n\nIn Step 8.2, we summarize\
    \ the E&M payments and services derived in Step 8.1 by beneficiary.\nSpecifically,\
    \ we use PROC SQL to create a data set called CST.EM_COST_BENE to create two summary\
    \ variables, EM TOTCOST_BENE (which summarizes the total payments for E&M services\
    \ for each beneficiary) and EM TOTSVC_BENE (which summarizes the total count of\
    \ E&M services for each beneficiary). This summarization is achieved by grouping\
    \ the data by Bene ID. Note that both of the variables are created, we format\
    \ the EM_TOTCOST_BENE variable to look like a dollar figure.\n\n```\n/* STEP 8.2;\
    \ CALCULATE TOTAL E&M COSTS AND TOTAL E&M SERVICES BY\nBENEFICIARY */\nproc sql;\n\
    \    create table cst.em_cost as\n    select bene_id, sum(em_cost) as em_totcost_bene\
    \ format=dollar15.2\n    label='TOTAL E&M COST FOR THE BENE',\n    sum(em_svc)\
    \ as em_totsvc_bene label='TOTAL E&M SERVICES FOR\nquit;\n```\n\nOutput 8.1 shows\
    \ the results of Step 8.2, printing just the first 10 observations for display\
    \ purposes.\n\n# Output 8.1: Total E&M Costs and Total E&M Services\n\nTOTAL E&M\
    \ COSTS AND SERVICES BY BENEFICIARY FOR BENEFICIARIES WITH AT LEAST ONE E&M SERVICE\n\
    \n| Bene_ID | em_totcost_bene | em_totsvc_bene |\n|---|---|--|\n| 1 | 00016745B629B9F\
    \ | $80.00 | 1 |\n| 2 | 0001FD7D2223DC | $0.00 | 0 |\n| 3 | 0021CA6FF03E67 | $0.00\
    \ | 0 |\n| 4 | 0002DAE1RC8CC70D | | 2 |\n| 5 | 00030843E3ESB76 | $120.00 | 1 |\n\
