- pgno: 95
  md: "# Algorithms: Measuring Emergency Department Utilization\n\nAs discussed in\
    \ Chapter 3, the identification of emergency department utilization is an interesting\
    \ and challenging task. Proper identification of emergency room services involved\
    \ the use of three claims data sets: inpatient data, outpatient data, and Part\
    \ B carrier data.5 Specifically:\n\n+   - If a beneficiary is admitted to the\
    \ hospital following the ED visit, the information pertaining to the ED visit\
    \ can be found in the inpatient data. These ED services are identified using revenue\
    \ center codes 0450-0459 and 0981.\n- If a beneficiary is seen in an ED but is\
    \ not subsequently admitted to the hospital, the claim for the ED visit can be\
    \ found in the outpatient data. These claims can be identified using the same\
    \ revenue center codes used for identification of ED visits in the inpatient data\
    \ (revenue center codes 0450-0459 and 0981).\n- The professional component for\
    \ ED services may be identified in the Part B carrier data. This professional\
    \ component can be identified using certain procedure code values (such as 99281,\
    \ 99282, 99283, 99284, and 99285). We could also use (or add) a place procedure\
    \ code value of 23.\n\nIf we were measuring total ED costs, or counting ED visits,\
    \ we would identify ED services using three claims data sets. However, because\
    \ we are conducting study of patients, we will focus on identifying the professional\
    \ component of ED services. In Step 7, we use the file created in Step 1 while\
    \ (UT_CARR_2010 FNL) to identify the professional component of ED services. Our\
    \ code is similar to the code used in Step 7, creating an array for the 13 HCPCS\
    \ codes (HCPCS_CD1-HCPCS_CD13) on carrier claims, and a flag representing an ED\
    \ service (ED SVC). We search for these codes equal 99281, 99282, 99283, 99284,\
    \ and 99285. These procedure code values indicate emergency department services\
    \ (a procedure code value of 99285 may be considered because it indicates direction\
    \ by a physician of emergency medical care systems during the transportation of\
    \ the patient to the emergency department, but Medicare does not pay it).6 We\
    \ output a file called UT_CARR_UTIL.\n\n```\n* STEP 7:9 IDENTIFY THE PROFESSIONAL\
    \ COMPONENT OF ED SERVICES */\ndata util.carr_util(keep=bene_id ed_svc);\n   \
    \ set util.carr_2010_fnl;\n    array hcpsccd(13) hcpsccd_cd1-hcpsccd_cd13;\n \
    \   ed_svc=0;\n    do i=1 to 13;\n        if substr(hcpsccd(i),1,5) in('99281','99282','99283','99284','99285')\
    \ then do\n            ed_svc=1;\n        end;\nrun;\nods htmlfile=\"C:\\Users\\\
    mgillingham\\Desktop\\SAS\nBook=FINAL DATA OUTPUT=Gillingham_fig7_9.html\"\nimage_dpi=300\
    \ style=GrayscalePrinter;\nods graphics on / imagefmp=;\n```"
  merge: -1
  img_proc: true
- pgno: 96
