  md: "# 84 SAS Programming with Medicare Administrative Data\n\nOutput 7.4 shows\
    \ the UTL_CNT_SVCS_AMB_UTIL data for the same beneficiary displayed above. You\
    \ can see the value of TOT_AMB is indeed the summation of the values of AMB_CARR_SVC\
