    \ 65-74, 75-84, 85-94, and 95 and older)\n* Beneficiary geographic information,\
    \ defined by assigning an SSA state and county code, and corresponding state and\
    \ county names, to each beneficiary\n\nWhile we are working with the MBSF data\
    \ in this chapter, we will create or retain these descriptive data elements. Although\
