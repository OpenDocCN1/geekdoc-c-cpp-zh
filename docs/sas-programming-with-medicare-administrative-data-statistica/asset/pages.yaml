    \ | 1 |\n| 355 | 001E32373E05BA96 | 1 |\n| 361 | 001E32373E05BA96 | 1 |\n| 395\
    \ | 001EA2F4DB30F105 | 1 |\n\n# Algorithms: Measuring Utilization of Ambulance\
    \ Services\n\nLet's further explore the carrier file by studying the utilization\
