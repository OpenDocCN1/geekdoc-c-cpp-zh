    specialized skills that fall outside the scope of this chapter, and access to
    these are uncommon for researchers. Therefore, in this chapter, we will review
    how to request and receive Medicare claims and enrollment data through ResDAC
    and CMS''s data distribution contractor; we will no longer focus on other data
    sources, like DESY, the VRDC, or the IDR.

    2. Our source data will arrive from CMS''s data distribution contractor as files
    that we must read into SAS sets. We will not spend time learning to load the flat
    files into SAS sets because CMS''s data distribution contractor provides SAS programs
    that load the files into SAS data. We start our programming work using SAS data
    sets, assuming we have already gone through the process of loading the files we
    received from CMS''s data distribution contractor into these SAS data sets.

    3. Our source data will arrive in separate files by claim type, with each claim
    separated into sets for claim header (called "base claim") files) and claim line
    information. We will create files that contain both base claim and claim line
    data in a single record. Creating and using claim-level files for instructional
    purposes makes it easier to understand the concept of a claim as a bill for services
    rendered because all of the information on a claim is contained in a single record.
    Well, at least it has been easier for me to understand and teach that way! Most
    importantly, it provides an achievable, common starting point irrespective of
    the source of our data, and makes our discussions accessible to a broader audience.


    With our instructional plan set, let''s now discuss a little more about data available
    through CMS''s data distribution contractor, describe the process of requesting
    the data needed for our example research programming project, and write code to
    create the claims and enrollment data used throughout the remainder of this text.


    # Data Available from CMS


    Our example research programming project calls for the use of personally identifiable
    (we define "personally identifiable") below claims and enrollment data files.
    However, it is worthwhile to pause for a moment and discuss other data available
    to the research community from CMS. A complete review of all Medicare data available
    to the research community is outside the scope of this book, but I would have
    to leave the reader without a general understanding of the Medicare data CMS offers
    to the'
