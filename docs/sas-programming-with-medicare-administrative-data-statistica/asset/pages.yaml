  md: '# Chapter 4: Planning the Research Programming Project 33


    # Our Project''s Quality Assurance Plan


    The purpose of a quality assurance (QA) plan is to explicitly state the project''s
    QA objectives and determine a plan of attack for meeting these objectives. Our
    objective is to develop code that accurately reflects the objectives outlined
    in the programming specifications. To this end, we will adhere to the following
    QA rules:


    +   * We will QA our programming specifications.

    * We will perform unit testing (testing individual sections of code) and debugging.

    * We will employ technical peer reviews of our code.

    * We will test the integration of the system as a whole.

    * We will investigate the validity of our output.

    * We will batch submit our code in production and clearly label our logs and lists.
    In addition, we will erase output before resubmitting (this avoids accidentally
    using data from prior submissions of code).


    The reader will need to trust that the development and integration of our code
    is unit tested and debugged and the requirements were reviewed by peers. The reader
    will also need to take me at my word that I submitted all code, as well as clearly
    labeled copies of logs and lists and adhered to sound data management practices.


    # Our Project''s Flowchart


    This section discusses the creation of a flowchart of the steps involved in executing
    our research programming project. Flowcharts and diagrams help the programmer
    discover and work through design issues both within programs and between programs,
    when integrated, comprise a system. In addition, they serve as a very useful form
    of documentation, summoning many pages of complex processes in a couple of pictures.
    Before we go too far down the road of creating our flowchart, it is helpful to
    discuss terminology and distinguish between common types of flowcharts and diagrams.
    Terms like flowchart, diagram, process flowchart and map are often used interchangeably.
    Because this is not a book about flowcharts and diagrams, we will keep things
    simple and use the term “flowchart” when discussing any picture that describes
    how processes and controls work together as a project, program, or system. We
    will use the term “diagram” when we describe the flow of data. More specifically,
    in this book:


    +   * Project flowcharts focus on the workflow of tasks for a project, or within
    a specific task in a project. We will create a workflow diagram for our project
    in this section.

    * Program flowcharts describe the flow of programs within a system (a set of programs),
    while others describe the flow of processing steps within a single program.²

    * Data flow diagrams describe the flow of data within or between programs.'
  merge: -1
