    MA pays for drugs through private plans, called standalone prescription drug plans
    (PDPs) and MA prescription drug plans (MA-PDPs).


    # What Is Not Covered by Medicare?


    Like other health insurance plans, Medicare does not cover every possible medical
    service or procedure. In addition, Medicare may require beneficiaries to make
    certain cost-sharing payments, like deductibles and coinsurance. Furthermore,
    although Medicare may cover the service, Medicare may not be the primary payer
    for services provided to beneficiaries who carry additional health insurance coverage.
    Below are some examples of services with limited or no coverage under Medicare.
    As you will see, a proper understanding of coverage (and limitations) is vital
    to the accurate identification of services in the administrative data.


    +   - Some services have limitations on care. For example, Medicare Part A stops
    paying for inpatient care in a psychiatric hospital after 190 days (this is a
    lifetime limit), and a beneficiary can only be admitted to a skilled nursing facility
    after being discharged within the last 30 days of an inpatient hospital stay that
    lasted at least three days.¹⁰


    +   - Other services are not covered. For example, Medicare does not cover long-term
    care services (care received in a nursing home, respite care, and day care) at
    all. It does not cover cosmetic surgery, some preventive services (although this
    is changing with the Affordable Care Act), vision and dental care, and hearing
    aids.


    +   - Medicare is a secondary payer for beneficiaries that have certain additional
    health insurance coverage. For example, if a beneficiary has been diagnosed with
    black lung disease and the beneficiary is covered under the Federal Black Lung
    Program and Medicare, the Federal Black Lung Program will pay for services related
    to the beneficiary’s black lung condition. In this'
