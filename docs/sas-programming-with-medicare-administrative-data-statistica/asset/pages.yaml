    \ AMBULANCE SERVICES PER BENEFICIARY */\nproc sql;\n  create table util.amb_util\
    \ as\n  select distinct(bene_id), sum(amb_carr_svc) as tot_amb_svc\n  from util\n\
    \  group by bene_id;\nquit;\n```\n\n```\nods file=\"C:Users\\mgillingham\\Desktop\\\
