  img_proc: true
- pgno: 26
  md: '# Chapter 2: Introduction to the Medicare Program 11


    +   - In 2010, the Affordable Care Act (more commonly known as “health reform
    legislation”) initiated sweeping measures to control costs, most of which will
    take effect by 2014. For example, the law provided increased funding to combat
    waste, fraud, and abuse, takes measures to attempt to improve the quality of care
    provided to beneficiaries, and establishes wellness visits for Medicare beneficiaries.


    # Medicare Enrollment and Eligibility


    At the time of writing, Medicare provided health insurance to 47 million Americans.
    4 Most people think of Medicare as insuring the elderly, and that is certainly
    true; the majority of Medicare beneficiaries (about 39 million of them) are eligible
    for Medicare insurance because they are aged 65 and over. However, Medicare also
    insures about 8 million beneficiaries who are permanently disabled (receiving
    Social Security Disability Insurance, or SSDI), who have end renal disease (ESRD,
    a condition that requires dialysis), or ALS, regardless of their age. You may
    hear experts refer to beneficiaries aged 65 and older in general terms “aged,”
    and those under 65 as “disabled” 5


    # What Is Covered by Medicare?


    Medicare benefits are divided and defined in four parts (Part A, Part B, Part
    C, and Part D). Each part covers a different type of care or set of services.
    As we will see in subsequent chapters, not only are these parts a way of describing
    care, but also a way of organizing the administrative data files we use throughout
    this. Understanding Medicare coverage (and limitations to care) is essential to
    the proper utilization of Medicare claims data. For example, let’s say you were
    asked to study claims for blood received in a transfusion. Medicare Part A covers
    the blood received by a beneficiary in an inpatient hospital setting, but Medicare
    Part B covers the blood the beneficiary may have received in a hospital outpatient
    setting. This means that the programmer may need to query more than one dataset
    to locate blood-related information in the claims data. As we will see, querying
    more than one type of data is important in the identification of emergency departments.


    The specifics of Medicare coverage are subject to, and often do, change. As such,
    it is very helpful to tap into reference materials that summarize Medicare benefits.
    As mentioned above, Medicare is a social insurance program and the final source
    of information on Medicare coverage is legal status. However, many experts simply
    refer to summaries of the Medicare schedule of benefits that CMS provides to beneficiaries,
    including publications such as Your Medicare Benefits 6 and Medicare and You?.
    These publications were used as the foundation for the information presented below.


    +   - Medicare Part A, also known as Hospital Insurance (HI), for care provided
    to beneficiaries in hospitals (including most inpatient care, inpatient rehabilitation
    facilities, and long-term hospitals), for short-term stays in skilled nursing
    facilities (SNFs), most post-acute care provided in home health agencies (HHAs),
    and hospice care services.

    - Medicare Part B is also known as Supplemental Insurance (SMI) because it provides
    coverage that is additional and supplemental to Medicare Part A coverage. Part
    B covers all medically necessary professional services, be they an inpatient,
    outpatient, or physician office setting, including visits to the physician, outpatient
    care, outpatient mental health care, diagnostic and clinical laboratory testing,
    and some preventative services, like flu and pneumonia'
