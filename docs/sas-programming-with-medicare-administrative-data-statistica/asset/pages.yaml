    # Introduction


    It has been a long journey! We learned about the Medicare program, Medicare data,
    and knocked out all the final steps in our example research programming project.
    The purpose of this chapter is to take the final steps in our research programming
    project by synthesizing our results and completing the project disposition phase
    of our project plan. As discussed in earlier chapters, the online companion to
    this book is at http://support.sas.com/publishing/authors/gillingham.html. Here,
    you will find'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 124 SAS Programming with Medicare Administrative Data


    information on creating dummy source data, the code in this and subsequent chapters,
    as well as answers to the exercises in this book. I expect you to visit the book''s
    website, create your own dummy data, and run the code yourself.


    At this point in our project, it is easy to think we are nearly finished! After
    all, we performed serious data manipulation to create analytic files for enrollment,
    utilization, and cost analyses, including looking at chronic conditions and quality
    measurement. We positioned our project; all we need to do is deliver some output,
    right? Well, not fast! By now, you probably realize that nothing is as easy as
    it first appears! As investigators, we need to put a lot of thought into presenting
    the information stored in our analytic files in a meaningful way. Then, after
    presenting our results, we must close out the project. The process of ending a
    project methodically is called project disposition; disposition requires ample
    time and effort to ensure that our specifications, code, and results will be clear
    for years to come. In this way, the proper disposition of our research programming
    project brings an extra layer of legitimacy to our work, and facilitates our ability
    to use our work in the future.


    # ## Synthesis – Review and Approach


    # ### Review: Our Accomplishments


    Before we begin, instead of our review of topics relevant to our programming work,
    we will reward ourselves by reviewing all of our fantastic accomplishments! Recall
    that we have undertaken an effort to evaluate the effectiveness of a pilot program
    that is designed to incentivize providers reduce costs to Medicare and improve
    quality outcomes. Our evaluation effort hinges on measuring, cost to Medicare,
    and quality by using a list of beneficiaries who interacted with the providers
    in our sample population; recall that this list of providers and beneficiaries
    was provided to us at the outset of our study. To these ends, we performed the
    following:


    +   - In Chapters 4 and 5, we established our project plan. In addition, we requested,
    received, loaded, and transformed the data used in subsequent chapters.

    - In Chapter 6, we created a file that contained demographic information for beneficiaries
    who were continuously enrolled in Medicare FFS throughout twelve months of calendar
    year 2010.

    - In Chapter 7, we created analytic files that contained summaries of utilization
    services for our population of continuously enrolled beneficiaries.

    - In Chapter 8, we created analytic files that contained summaries of the costs
    to Medicare for our population of continuously enrolled beneficiaries.

    - In Chapter 9, we identified beneficiaries with diabetes or COPD. In addition,
    we created analytic files that focused on simple measures of quality outcomes.


    # ## Our Programming Plan


    Until now, our programming adventure has focused on calculating the information
    needed to answer the research questions we posed at the beginning of our example
    project. Now, we must shift our focus to finish our work by presenting our utilization,
    cost, and quality outcome measurements. To this end, we will utilize data from
    the analytic files that we created in prior chapters, and use some'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Chapter 10: Presenting Output and Project Disposition 125


    of the work that we performed in Chapter 6 to add state and county names to our
    file of continuously enrolled beneficiaries.


    The algorithms that we will develop in the chapter are by no means exhaustive,
    and we do not endeavor to summarize all of the analyses that we computed in prior
    chapters. We could think of many, additional ways of looking at the output we
    created. For example, we could present analyses of outcomes that are broken out
    by provider specialty; we could compare the measurements for the population of
    providers in our finder against other providers that did not participate in the
    program we are studying; or we could compare results over time to look for significant
    changes in outcomes. The purpose of this text is to lay the groundwork for the
    reader to be able to independently answer these questions. Therefore, one of the
    chapter exercises listed below asks you to think of some additional questions
    we might answer with our data.


    # Algorithms: Presenting Selected Measurements of Utilization, Cost to Medicare,
    and Quality Outcomes


    Let''s start by simply displaying the following pieces of our utilization, cost
    to Medicare, and quality outcomes of the work that we performed in Chapter 7 through
    Chapter 9, respectively:


    +   - Drawing on our work in Chapter 7, we will present ambulance utilization
    information by beneficiary age.

    - Drawing on our work in Chapter 8, we will present Medicare payments for E&M
    services summarized by the providers in our study population.

    - Drawing on our work in Chapter 9, we will present rates of diabetes and COPD
    in our population of continuously enrolled beneficiaries.


    Again, we have easily chosen to present other information that we calculated in
    previous chapters, like the total costs to Medicare that were associated with
    home health agency services. One of the chapter exercises listed below asks you
    to choose and present information that was calculated in Chapter 7, 8, or Chapter
    9 other than what we chose as an example for our work in this section.


    # Presenting Ambulance Utilization


    One interesting presenting of output is to examine beneficiaries with at least
    one claim for ambulance services, along with the age of each beneficiary. This
    type of algorithm provides a good example for analyzing relevant summary information
    that may be used to guide further analyses.


    In Step 10.1, we begin to present ambulance utilization by our merge of continuously
    enrolled beneficiaries (ENR_CONTENT_2010_FNL) with the analytic summary file UTL_AMB_UTIL
    created in Step 7.11 of Chapter 7 (we are also in our formatting of age categories
    that you will recognize from our work in Chapter 6). The file UTL_AMB_UTIL contains
    one record per beneficiary with at least one claim for an ambulance service. Because
    both files are already sorted by BENE_ID, there is no need for a pre-merge sort.
    The output file, called FNL_PRESENT_AMB, contains one record for each of the beneficiaries
    in UTL_AMB_UTIL (we use an “if” merge), as well'
  merge: -1
  img_proc: true
