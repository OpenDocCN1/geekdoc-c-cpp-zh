    \ We call the output of FNL_PRESENT_IPLOS.\n\n```\n* 10.8: MERGE INPATIENT LENGTH\
    \ OF STAY WITH BENEFICIARY SSA STATE INFORMATION */\ndata fnl.present_iplos(keep=bene_id\
    \ stay_cnt_top_ip_los state);\n\tmerge enr.contentr_2010 fnl(in=a) stay_util(in=b);\n\
    \tb bene_id;\n\tif b;\n\nrun;\n```\n\nIn Step 10.9, we sort the FNL_PRESENT_IPLOS\
    \ data set in preparation for displaying data by state. Specifically, we sort\
    \ the fnl.present_iplos by the variable STATE, which will be the 'by' variable\
    \ in the PROC FREQ required in the next step.\n\n```\n* STEP 10.9: SORT BY SSA\
    \ STATE IN PREPARATION FOR PRESENTATION OF IP LOS BY SSA STATE AND COUNTY */\n\
    proc sort data=fnl.present_iplos\n\tby state;\n\nrun;\n```\n\nFinally, in Step\
