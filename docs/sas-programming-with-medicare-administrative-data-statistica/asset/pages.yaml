    # Our Programming Plan


    We use to establish our population of full-year FFS beneficiaries (i.e., those
    beneficiaries enrolled in Medicare FFS throughout twelve months of 2010). We will
    also utilize the 2010 MBSF for all enrollment information needed for our research
    programming effort.

    Therefore, our plan is to query the first 2010 MBSF and establish our population
    of full-year FFS beneficiaries. Next, we will turn our attention to creating descriptive
    variables. With this in, we can begin our programming with MBSF data by identifying
    beneficiaries in our sample population who are continuously enrolled in Medicare
    FFS throughout twelve months of calendar year 2010.


    # Algorithms: Identifying Continuously Enrolled FFS Beneficiaries


    # Why Define Continuously Enrolled FFS Beneficiaries?


    Identifying beneficiaries who have been continuously enrolled in Medicare FFS
    (be it for a calendar year or a period prior to following a specific medical event,
    like a hospitalization) is a common task in research programming. Because Medicare
    administrative claims data include all FFS claims submitted on behalf of a beneficiary
    (and most will not include claims for managed care), focusing on beneficiaries
    who are enrolled in Medicare FFS helps to ensure that we have a complete picture
    of each beneficiary''s medical history for that year. In our case, we are seeking
    to determine the impact of a program in the 2010 payment, utilization, and quality.
    In order to do so comprehensively, we will limit the population we are studying
    to those beneficiaries who have been continuously enrolled in'
