    # Example: Identification of Emergency Department (ED) Utilization


    Let’s say you are on a game called Medicare Millionaire, where you have to answer
    research questions using Medicare claims and enrollment files. Personally, I would
    tune in faithfully every night, but I have a feeling that I may be one of the
    only viewers (after all, it is a small group of people who do this work!) Imagine
    that you have successfully answered several questions and now have a chance to
    win a large prize based on answering the following question: Which of the data
    files are used for the identification of ED utilization? If you already used your
    lifeline to call a friend, you need to take your best guess. What would that be?
    Without any knowledge other than what we have learned in this chapter, my guess
    would be the inpatient claims data. Considering that emergency rooms are typically
    found in inpatient hospitals, would be a good choice? Unfortunately, the answer
    is only partially true


    Complete information on emergency department-related information can be found
    in no less than three sets of claims data: inpatient data, outpatient data, and
    Part B carrier data¹¹⁸ We will write code to calculate ED utilization for our
    research programming project, discussing how to identify ED utilization at this
    time is enlightening. There are several factors that make identification of ED
    services complex, first, the issue of whether or not the beneficiary was admitted
    to the facility for an inpatient stay. Second, there is the issue of identifying
    what is often referred to as the “professional component” of the service (described
    below)


    If a beneficiary is admitted to the hospital following the ED visit, the information
    pertaining to the ED visit can be found in the inpatient data set. These ED services
    are identified using revenue center codes 0450-0459 and 0981. The inpatient claims
    data contain diagnostic information gleaned from the emergency visit. On the other
    hand, if the beneficiary is seen in an ED and not subsequently admitted to the
    hospital, the ED visit can be found in the outpatient data! These claims can be
    identified using the same revenue center codes used for identification of ED services
    in the inpatient


    The professional component of a service can simply mean the portion of service
    provided by a physician. For example, when a lab test is performed, the “professional
    component” is a provider’s (typically a pathologist or other physician) interpretation
    of the test and the “technical component” is the administration of the test itself.
    In case of ED services, the professional component will appear in the Part B carrier
    data because it is billed using the CMS-1500 claim form and through the beneficiary’s
    Medicare Part B cover


    Again, we will construct SAS code to identify ED utilization in Chapter 7. For
    the time being, this example illustrates the complexity of using Medicare data
    to identify utilization of some common services. Just in case you are not convinced
    of the potential pitfalls inherent in using Medicare data for research purposes,
    lets discuss another example, the identification of surgical services.'
