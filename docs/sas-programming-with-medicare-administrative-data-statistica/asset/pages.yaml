    crutches, splints, prosthetics, orthotics, respiratory devices like oxygen equipment
    and related supplies, and dialysis equipment and supplies.


    DME is provided to any beneficiary with Part B insurance as long as it is medically
    necessary. Beneficiaries with Medicare Part B must have the equipment prescribed
    for their use in their home by their doctor or "treating practitioner" (e.g.,
    a physician assistant or nurse practitioner). A long term facility can qualify
    as a beneficiary’s home, but equipment is not covered if it is used in a hospital
    or a skilled nursing facility. For example, the hospital bed in an inpatient facility
    is included in the facility charge found in the Inpatient claims data.


    # Outpatient Claims Data


    Outpatient claims data information on final action claims filed by institutional
    inpatient providers. The data also includes the claims of other types of institutional
    inpatient providers like ambulatory surgical centers, outpatient rehabilitation
    facilities, rural health clinics, and even community mental health centers.


    Medicare Part B pays for many of the outpatient services a beneficiary receives
    in a hospital like the hospital charge for an emergency department service (as
    we will see below this does not include the doctor’s charge), getting stitches
    or a cast, lab and X-ray services, outpatient surgery, observation required to
    determine if a beneficiary should be admitted for inpatient care, and even the
    administration of drugs if a beneficiary cannot self-administer the drug. "institutional
    Part B" claims. Looking forward to Chapter 8, we will see this in action when
    we do not use the inpatient data set when we sum Part A costs.


    A beneficiary is considered inpatient if the beneficiary’s doctor has written
    an order to be admitted as inpatient. These services are covered under Medicare
    Part B and are paid using the Outpatient Prospective Payment System (OPPS). The
    OPPS pays hospitals a predetermined payment rate (the rate differs by geographic
    region) to provide these services to Medicare beneficiaries.


    # Inpatient Claims Data


    Inpatient claims data contain information on final action claims submitted by
    long-stay and short-stay inpatient hospitals for the reimbursement of these facility
    costs. These claims are paid through Medicare Part A. Hospitals file for these
    services using the UB-92 form, also known as the CMS-1450 claim, or the electronic
    837i format. It is important to make the distinction between facility costs and
    other costs for services provided in the hospital (again, more on this in the
    example below). Facility costs include things like room charges and even some
    drugs provided during a beneficiary’s hospital stay. As we will discuss below,
    a doctor’s visit or even a surgeon’s services provided in the facility are billed
    using the CMS-1500 form and are therefore found in the carrier data.'
