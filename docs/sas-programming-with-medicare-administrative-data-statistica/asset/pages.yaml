    # Algorithms: Measuring Inpatient Hospital Payments


    In Chapter 7, we decided to treat the claims in inpatient claims data as stays,
    and for short-acute care hospitals. We will mine-level summary statistics, like
    average length of stay (ALOS), we use the total amount paid at the header of the
    claim to calculate the total amount paid by Medicare for a stay at an acute care
    facility or critical hospital. This is accomplished with slight modifications
    to the code we used to calculate E&M payments in Step 8.2 and Step 8.3.


    In Step 8.5, we summarize total inpatient payments using the PMT_AMT variable*
    in the inpatient claims data set for each beneficiary, outputting a variable called
    IP_TOTCOST_BENE (similar to the way we calculated total E&M payments for each
    beneficiary in Step 8.2). We output a data set CST_IP_COST_BENE. Note that this
