    \ MBSF data by sorting the data set by the SSA variable^9.\n\n```\n* STEP 6.8:\
    \ SORT SSA STATE AND COUNTY CODES FILE TO REMOVE DUPLICATE\nRECORD FOR DADE OR\
    \ MIAMI DADE */\nproc sort data=src.msabea_ssa nodupkey\n\tby ssa;\n\nrun;\n```\n\
    \nIn Step 6.9, we prepare our enrollment file (SRC.CONTEN_2010_FNL) to receive\
