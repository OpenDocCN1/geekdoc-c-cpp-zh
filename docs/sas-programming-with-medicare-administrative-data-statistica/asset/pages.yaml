- pgno: 59
  md: '# SAS Programming with Medicare Administrative Data


    research. As with most tasks in project work, making contact and gathering information
    as early as possible typically pays large dividends down the road.


    Now that we have made initial contact and an idea of what is contained in the
    request packet and the process we need to work through, we can begin to fill the
    paperwork. Walking through every step is beyond the scope of this book (and not
    necessary given ResDAC experts are available to provide guidance as you complete
    the request), we will simply review the major steps in the process and highlight
    important information.


    +   1. Complete a Data Use Agreement (CMS form CMS-R0235, widely referred to as
    a DUA, and contained in the request packet we downloaded from the ResDAC website).
    All requests for identifiable data must be accompanied by a signed DUA. A DUA
    is a contract between the users of the data (in the case of our research programming
    project,) and the owners of the data (in all cases). The contract specifies rules
    to keep the use of CMS''s data in compliance with CMS''s data policies, including
    the Privacy Act of 1974, a federal law that covers the use of personally identifiable
    information. The DUA specifies the person responsible for the data (called Data
    Custodian), as well as authorized users of the data. Use is strictly limited to
    those individuals listed on the DUA (or those who have a signed DUA addendum).
    The contract also specifies how to deal with the data at the close of the project
    (more on Chapter 10).

    2. Complete the remainder of the request packet. This collection of documents
    contains everything we need for our request as well detailed instructions and
    checklists for completing the required forms. A precise and methodical approach
    to completing the request will minimize back-and-forth throughout the request
    process. For example, many of the documents in the request ask us to describe
    our research project and the data we are requesting. All such descriptive information
    should be consistent across all documents. The request packet includes the following:

    a. A request for the identifiable data on our organization''s letterhead. A sample
    letter is included in the request packet. The letter simply describes the purpose
    of our research project and how it relates to the use of the identifiable data
    we are requesting.

    b. An Executive Summary that asks us to describe our story, our plan for managing
    the data (e.g., how the data will be stored and destroyed who will have access
    to it). ResDAC provides documents that guide the completion of the Executive Summary.

    c. A Research Study Protocol format asks us to describe the background, objectives,
    and methods of our study, as well as the files included in our data request are
    necessary to meet these objectives.

    d. Our completed Data Use Agreement form.

    e. Documentation that our request has been reviewed and approved by an Internal
    Review Board (IRB). This authorization is necessary for CMS to be able to release
    personally identifiable data.

    f. Documentation that our project has funding for the purchase of the data. The
    data can be expensive, so we must provide evidence that we have received funding
    from our own organization or something like a grant or a contract with a federal
    agency.

    g. A Specification Worksheet that describes the use of the data, the data custodian,
    payment information, and information needed to perform the data extract. For example
    we must'
