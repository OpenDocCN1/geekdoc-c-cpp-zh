    to allow plenty of time for the process to play out. For example, the request
    is assigned a control number and is subsequently presented to CMS''s Board for
    review and approval. It is prudent to plan for a minimum of three or four weeks
    to pass between the submission of the final packet to CMS and getting word regarding
