- pgno: 85
  md: '# SAS Programming with Medicare Administrative Data


    Therefore, we will execute some relatively straightforward utilization algorithms
    in this chapter, for the sake of performing the calculations planned for this
    chapter as well as setting up measurements calculated in later chapters, as payment
    and quality outcomes for certain chronic conditions. To these ends, in this chapter,
    we will use code algorithms to do the following:


    +   - Delimit our administrative claims data to include only those claims for
    the population of interest, those continuously enrolled beneficiaries in Chapter
    6.

    - Measure evaluation and management (E&M) visits in a physician office setting.

    - Measure inpatient hospital utilization.

    - Measure the professional component of emergency department (ED) services.

    - Measure the utilization of ambulance services using the Part carrier data.

    - Measure outpatient visit utilization.

    - Measure utilization of skilled nursing facility (SNF), home health, and hospice
    care.


    As discussed in earlier chapters, the online companion to this book is at http://support.sas.com/publishing/authors/gillingham.html.
    Here, you will find information on creating dummy data code, the code in this
    and subsequent chapters, as well as answers to the exercises in this book. I expect
    you to visit the book''s website, create your own dummy data source, and run the
    code yourself.


    Before we begin, we will review some basics about the administrative claims data
    that we will use for our utilization work.


    # Review: Basics of Medicare Claims Data


    In Chapter 2 through Chapter 5, we discussed the following characteristics of
    programming with Medicare administrative data (note that this review is also relevant
    for Chapters 8, 9, and 10, although we will not repeat it in those chapters):


    +   - Using Medicare claims data is not intuitive. The primary purpose of the
    Medicare payment system is not to create data for research, but to adjudicate
    and pay claims. This fact has implications for using our administrative data files
    and we must understand the Medicare program to use Medicare data effectively.

    - Data exist for claims paid by both Medicare Part A and Part B. The Medicare
    files are paid separately for final action Part B carrier, durable medical equipment
    (DME), inpatient, skilled nursing facility (SNF), home health, and hospice services.

    - Part B carrier data set is most commonly associated with claims for services
    provided in a doctor''s office, like a checkup. However, the carrier data also
    includes claims submitted by clinical social workers, chiropractors, ambulance
    services, nurse practitioners and physician assistants. In addition, the file
    also includes claims for services performed outside of a doctor''s'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# Chapter 7: Measuring Utilization of Services 71


    office, such as ambulatory surgical centers, hospitals, and hospital emergency
    rooms. In general, the carrier claims file is the largest Medicare data set used
    for research purposes.


    +   - The DME file includes paid claims for wheelchairs and walkers, hospital
    beds, blood glucose monitors and related supplies, canes and crutches, splints,
    prosthetics, respiratory devices like oxygen equipment and related supplies, and
    dialysis equipment and supplies.


    +   - The outpatient data set contains final action claims filed by institutional
    inpatient departments. However, the file also includes the claims of other types
    of institutional inpatient providers, like ambulatory surgical centers, outpatient
    rehabilitation facilities, rural health clinics, and community mental health centers.


    +   - The inpatient data set contains final action claims submitted by long stay
    and short stay inpatient patients for the reimbursement of their facility costs,
    including things room charges and even some drugs provided during a beneficiary''s
    hospital stay.


    +   - The SNF file contains paid for skilled nursing and rehabilitative care in
    a SNF setting through specialists as registered nurses, physical therapists, occupational
    therapists, speech pathologists, and audiologists. The purpose of this care is
    to treat, observe, and manage beneficiaries'' conditions, to help beneficiaries
    leaving an inpatient hospital to improve or maintain their current condition,
    and to assist beneficiaries in maintaining their independence. Medicare pays for
    beneficiary cope and counseling that can help a beneficiary cope for services
    up to 100 days following an inpatient stay of at least 3 days.


    +   - The health data set contains final action claims filed by Home Health Agencies
    (HHAs). These agencies provide services to Medicare beneficiaries like occupational
    therapy, physical therapy, skilled nursing care, and speech therapy and medical
    social services like can help a beneficiary with the impacts of their illness
    on their mental health.


    +   - The hospice file contains final action claims data that have been submitted
    by hospice providers. Hospice programs provide paid care for Medicare beneficiaries
    who are terminally ill. Hospice services include physical care provided by doctors
    and nurses, care provided by hospice aides, occupational therapy, physical therapy,
    medical equipment and supplies, drugs, and even grief counseling and respite care
    (care provided in a facility designed to give family members a break from care)
    for the beneficiary''s family members. All hospice services are covered as long
    as they are related to the beneficiary''s terminal illness (services not related
    to the terminal illness are covered by other Medicare benefits). Many of these
    services involve pain management, and may take place in a facility or the patient''s
    home. Hospice care is insured in benefit periods, meaning that a Medicare beneficiary
    can get hospice care for ninety-day periods and an unlimited limit of 60-day benefit
    periods.


    +   - At a minimum, the following elements are commonly required for research
    programming: Information that identifies the beneficiary, such as a BENE_ID; information
    about the provider of the service, like the NPI; information that describes when
    the services occurred (start and end dates); codes that describe the beneficiary
    (medical diagnosis codes), codes that describe the services (like procedure codes);
    and information on the amount paid for the services.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# SAS Programming with Medicare Administrative Data


    +   - It is prudent to plan effectively prior to beginning your programming project.
    Part of this planning effort involves writing specifications that will guide the
    creation of your SAS algorithms. In addition, it is equally important to execute
    quality assurance and quality control steps throughout your programming process.
    These QA/QC procedures include reviewing the written specifications and debugging
    your SAS code through viewing output and test cases, as well as benchmarking output.
    Because Medicare administrative data files can be quite large, it is important
    to keep efficient programming techniques in mind when


    # Our Programming Plan


    In Chapter 5, we submitted a data request to extract all claims and enrollment
    information for beneficiaries who were treated by the providers in our study population.
    We received and loaded data, keep only those variables we wished to use in our
    study, and created claim-level files that contain both the claim and revenue center
    (or claim detail) in a single record for each claim. In Chapter 6, we used enrollment
    data to delimit our population to full-year FFS beneficiaries. Now, we wish to
    bring our data to bear on the calculation of utilization measurements. To this
    end, we will begin our exercise by merging our data with the beneficiary population
    outlined in Chapter 6, eliminating claims for those beneficiaries we are not studying
    by their enrollment characteristics. Performing this step early in our process
    will reduce the size of the claims files, reducing the execution times of our
    programs. Once we delimit our claims files, we will begin to research and code
    our utilization algorithms. We will approach our investigation of utilization
    using a couple of methods. For services that are defined using procedure codes,
    we will simply count the unique occurrence of procedure codes. For example, we
    can identify E&M services by keying on procedure date or span of dates, we will
    simply count services by unique start and end dates. For example, we will get
    a handle on SNF utilization by looking procedure codes or start and end dates
    on claims. While de our SAS code can be easily applied to studying utilization
    using revenue center codes, or counting instances of a set of diagnosis codes.
    What''s more, while we do not explore utilization of durable medical equipment
    (DME), we could easily apply the code in this book to studying the utilization
    of DME, like hospital beds and wheelchairs.


    The output of the exercises will be a set of analytic files at the beneficiary-level
    used for the remainder of our programming work. Looking forward, we will continue
    on the work performed in Chapters 5 and 6 (this chapter). In Chapter 8, we will
    use the output of this chapter in our study of Medicare payment. In Chapter 9,
    we will combine the study of chronic conditions with the study of quality of care
    by identifying services that are provided to beneficiaries with diabetes and COPD.
    As such, we will add an important dimension to our analysis. In Chapter 10, we
    will end our example project by summarizing our output.


    # Algorithms: Delimit Claims by Continuously Enrolled Beneficiary Population


    In Step 7.1, we eliminate claims for beneficiaries outside of our study population
    of continuously enrolled beneficiaries. We execute this task by performing a single
    DATA step merge of the claims files'
