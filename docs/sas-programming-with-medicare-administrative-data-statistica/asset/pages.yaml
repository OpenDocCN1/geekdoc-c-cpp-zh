- pgno: 57
  md: '# 42 SAS Programming with Medicare Administrative Data


    community. Who knows, you may need something like non-identifiable data for future
    projects, so we as well spend a little time obtaining a broader view of the Medicare
    research data landscape?


    CMS offers a dizzying array of datasets for research purposes. The most straightforward
    method of understanding the Medicare data available to the research community
    is to group the files into the following categories:


    +   1. Research Identifiable Files (RIFs): Claims and enrollment files containing
    personally identifiable information used to identify Medicare beneficiaries and
    providers, including the beneficiary identifier (which can be a Social Security
    Number), provider identifier (which can be identified using a Tax Identifier,
    in some cases is a Social Security Number), date of birth, and geographic place
    of residence. The files available include institutional and non-institutional
    claims for Medicare Fee-for-Service beneficiaries, and enrollment data like the
    Master Beneficiary Summary (MBFS). These datasets can be used to extract information
    for a specific population of beneficiaries or providers. In addition, CMS creates
    files containing enrollment data for samples of 5% of the Medicare beneficiary
    population, eliminating the need for researchers to request the full datasets
    (the size of which is overwhelming) and create their own samples. Because the
    RIFs contain personally identifiable information, the use of such is subject to
    strict oversight by CMS, and access to this data is provided only when necessary.
    The request for our sample research project will be from the RIFs.

    2. Limited Data Sets (LDS): Claims and enrollment files containing the information
    provided in the RIFs except for confidential identifiers. Even with such exclusions,
    LDS files are considered personally identifiable datasets and are subject to strict
    privacy rules. LDS can be requested by completing an LDS data agreement.

    3. Public Use Files (PUFs), or Non-Identifiable Files: These datasets generally
    contain summary-level, aggregated information on the Medicare program. Some research
    projects only require the aggregated results that are found in these non-identifiable
    files, eliminating the need for the researcher to acquire the data and personally
    aggregate the files. Note that requests for PUFs are made directly to CMS, payment
    may still be required. https://www.cms.gov/NonidentifiableDataFiles for more details.
    In addition, note that CMS also provides synthetic PUFs for entrepreneurs. See
    http://www.cms.gov/Research-Statistics-Data-Systems/Statistics-Trends-and-Reports/SynPUFs/DE_Syn_PUF
    for additional details.


    In the case of our research project, we will have to report results by provider,
    necessitating the identification of providers. In addition, we will be looking
    at beneficiary-level information, necessitating data at the beneficiary-level.
    Of, as we explained earlier, we intend to obtain our data from CMS''s data distribution
    center, we actually use the synthetic PUFs for data entrepreneurs as the source
    data used for this book. Therefore, we are simply simulating the exercise of requesting,
    obtaining, and using personally identifiable data.


    # Our Project''s Data Requirements and Request Specifications


    Because it is understanding what we work in future chapters, let''s provide additional
    details on the personally identifiable data we are researching, as well as the
    files we are using for our data in.'
