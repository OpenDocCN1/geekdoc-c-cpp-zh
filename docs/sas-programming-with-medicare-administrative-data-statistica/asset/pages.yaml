- pgno: 70
  md: '# Chapter 6: Working with Enrollment Data 55


    provided in a non-institutional setting, like a physician''s office, as well as
    institutional outpatient services.


    +   * Generally, the claims of beneficiaries enrolled in Part C do not appear
    in the administrative claims data, but HMOs do report claims and these claims
