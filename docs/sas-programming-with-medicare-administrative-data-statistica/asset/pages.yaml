    and provided a very simple sketch of how Medicare pays for services. We also briefly
    discussed how this information about Medicare influences the content of the data
    files used throughout the remainder of this book. In this chapter, we will build
    on these concepts and dive into each Medicare file we will be using for our example
    research programming project.¹1 We will review the contents of each data set,
