- pgno: 101
  md: "# 86 SAS Programming with Medicare Administrative Data\n\nand the next consecutive\
    \ claim in the set has a FROM_DT equal to May 1, 2010 and a THRU_DT equal to June\
    \ 30, 2010.\n\n+   - Scenario #2: Claims with a FROM_DT that falls before the\
    \ THRU_DT on another claim in the set. For example, if one claim contains a FROM_DT\
    \ equal to March 1, 2010 and a THRU_DT equal to April 30, 2010, and another claim\
    \ has a FROM_DT equal to April 25, 2010 and a THRU_DT equal to June 24, 2010.\n\
    - Scenario #3: Claims with a FROM_DT and THRU_DT that fall within the FROM_DT\
    \ and THRU_DT of another claim for the beneficiary. For example, one claim contains\
    \ a FROM_DT equal to March 1, 2010, and a THRU_DT equal to April 30, 2010, and\
    \ another claim contains a FROM_DT equal to March 5, 2010 and a THRU_DT equal\
    \ to April 4, 2010.\n- Scenario #4: Claims that do not fall into any of the above\
    \ categories. For example, one claim contains a FROM_DT equal to March 1, 2010\
    \ and a THRU_DT equal to April 30, 2010, and the next consecutive claim in the\
    \ set has a FROM_DT equal to July 1, 2010 and a THRU_DT equal to August 30, 2010;\n\
    \nIn all cases, when to collapse sets into a single record such as the FROM_DT\
    \ and THRU_DT on the collapsed record are equal to the earliest FROM_DT in the\
    \ set and the latest THRU_DT in the set, respectively. In Step 7.13 through Step\
    \ 7.15, we present an algorithm to collapse beneficiary's claims into a single\
    \ record appropriate. Our algorithm uses a called macro CLM_LOOP2 which is very\
    \ similar to the CLM_LOOP macro which only processes the SNF, home health, and\
    \ hospice data sets. First, in Step 7.13, we sort the relevant data sets created\
    \ in Step 7.1, outputting intermediate data sets to our work library. Note that\
    \ we keep the beneficiary identifier, FROM_DT, and THRU_DT on the claim because\
    \ those are the only variables needed for our work. The sort key (BENE_ID, FROM_DT,\
    \ and THRU_DT) orders each beneficiary's claims by date in preparation for the\
    \ processing performed in later steps.\n\n```\n/ STEP 7.13: SORT FILE BY BENE_ID,\
    \ FROM_DT, THRU_DT *\n*macro clm loop2(clmtype);\nproc sort data=ut1.&clmpy_2010_fnl\
    \ out=&clmpy_2010_fnl (keep=bene_id from_dt thru_dt)\n  by bene_id from_dt thru_dt;\n\
    run;\n```\n\nStep 7.14 uses a function to create a variable CLAIM_SEGMENT_ID to\
    \ for identifying claims to collapse. The key to understanding this step is to\
    \ recognize that the 'else' statement executes first for one group of BENE_ID\
    \ and FROM_DT values, and CLAIM_SEGMENT and END2 are re-initialized for a new\
    \ group of overlapping claims. This lag function reads the previous record (remember\
    \ that the records are sorted in consecutive order) and determines the relationship\
    \ of the THRU_DT on the previous claim to the FROM_DT on the next claim. If this\
    \ relationship is described by Scenario #1, Scenario #2, or Scenario #3 above,\
    \ the CLAIM_SEGMENT_ID does not increase by 1, meaning that claims in these scenarios\
    \ will have the same value of CLAIM_SEGMENT_ID. The output of this step is an\
    \ intermediate data set saved to work library."
