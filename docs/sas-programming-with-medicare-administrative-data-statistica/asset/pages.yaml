    \ the output of Step 7.9, keeping only those records where ED_SVC equals to 1.\
    \ Output 7.3 illustrates the first 10 observations for display purposes.\n\n#\
    \ Output 7.3: ED Professional Component Services\n\n# PRINT OF ED PROFESSIONAL\
