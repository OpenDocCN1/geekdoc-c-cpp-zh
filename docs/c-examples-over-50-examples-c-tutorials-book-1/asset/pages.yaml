    /*

    age: Calculates the average of our array.

    What we are doing passing an array into our function.

    More specifically we are passing a pointer into our function

    which we can then use pointer arithmetic on

    dereference it''s members. When you do this it is a good practice

    to pass in the size as well.

    */

    ```


    ```

    double average(int* numbers, int size) {

    double total = 0;

    for(int i = 0; i < size; i++)

    total += *(numbers+i);

    return total/(double)size;

    }

    ```


    ```

    /*

    bigest: finds the largest number in an array.

    We will use the same technique as above.

    */

    ```


    ```

    int biggest(int* numbers, int size) {

    int biggest = *numbers;

    //initialize biggest to the first element

    for(int i = 1; i < size; i++)

    if(*(numbers+i) > biggest)

    biggest = *(numbers+i);

    return biggest;

    }

    ```


    ```

    /*

    small: finds the smallest number in an array.

    We will use the same technique as above.

    */

    ```


    ```

    int smallest(int* numbers, int size) {

    int smallest = *numbers;

    //initialize biggest to the first element

    for(int i = 1; i < size; i++)

    if(*(numbers+i) <smallest)

    smallest = *(numbers+i);

    return smallest;

    }

