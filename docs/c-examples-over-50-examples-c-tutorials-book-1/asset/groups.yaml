    \n谢谢\n\n# HelloWorld.c\n\n```c\n#include <stdio.h> // 头文件，包含了输入和输出\n// 这样我们可以在下面使用\
    \ printf\n// 如何设置 .c 文件。这只是为了测试\n// 确保你的环境已正确设置。\nint main() { // 运行程序时发生了什么\n\
    \    printf(\"Hello World!\\n\"); // 是换行符，它将内容置于新行\n    return 0; // 表示无错误\n}\n\
    ```\n\n输出: Hello World!\n\n# DataTypes.c\n\n```c\n#include <stdio.h>\n/* C语言中可用的数据类型。\n\
    注意 sizeof() 函数，它返回数据类型的大小（字节字节）。lu 是一个存储无符号长整型的占位符。这里列出了许多类型：char, int, float\
    \ 和 double。 */\n```\n\n输出: char 的存储大小: 1 字节\nint 的存储大小: 4 字节\nfloat 的存储大小: 4 字节\n\
    long 的存储大小: 8 字节\n\n# Variables.c\n\n```c\n#include <stdio.h>\n/* 显示如何声明和初始化变量。多次声明是合法的，只需分行即可。你可以对相似的数据类型执行操作。将变量初始化为某个值。\
    \ */\nint main(){\n    char x; // 变量声明\n    x = 't'; // 初始化变量\n    // 注意这里有 printf\n\
    \    int x, y, z; // 同一行的多个声明\n    x = 3;\n    y = 2;\n    z = x+y;\n    printf(\"\
    z: %d\\n\", z);\n    return 0;\n}\n```\n\n输出: z: 5\n\n# Operators.c\n\n```c\n\
    #include <stdio.h>\n/* C 中的基础运算符。当你执行操作时，运算符必须是相同的数据类型。运算符包括算术、关系和赋值运算符。这些都是我们需要的。\
    \ */\nint main() {\n    int x, y;\n    x = 2;\n    y = 2;\n\n    /* 算术运算符*/\n\
    \    printf(\"2 + 2: %d\\n\", x+y);\n    printf(\"2 - 2: %d\\n\", x-y);\n    printf(\"\
    2 * 2: %d\\n\", x*y);\n    printf(\"2 / 2: %d\\n\", x/y);\n    x++; // 同于 x +\
    \ 1\n    printf(\"++: %d\\n\", x);\n    y--; // 同于 y - 1\n    printf(\"--: %d\\\
    n\", y);\n    int m = 3%2;// 返回余数\n    printf(\"modulus: %d\\n\", m);\n\n    /*\
    \ 关系运算符*/\n    // 0（表示假）或 1（表示真）\n    printf(\"2 == 2: %d\\n\", x==y);//不是赋值，是比较\n\
    \    printf(\"2 != 1: %d\\n\", x!=y);//感叹运算符\n    printf(\"2 > 2: %d\\n\", x>y);//将返回\
    \ 0\n    printf(\"2 >= 2: %d\\n\", x>=y);\n    printf(\"2 < 2: %d\\n\", x<y);\n\
    \    printf(\"2 <= 2: %d\\n\", x<=y);\n\n    /* 赋值运算符*/\n    printf(\"x += y:\
    \ %d\\n\", x+=y);//x = x+y\n    printf(\"x: %d\\n\", x);//x=4\n    printf(\"x\
    \ -= y: %d\\n\", x-=y);//x = x-y x:2\n    printf(\"x: %d\\n\", x);//x=2\n    printf(\"\
    x *= y: %d\\n\", x*=y);//x = x*y x:4\n    printf(\"x: %d\\n\", x /= %d\\n\", x/=y);//x\
    \ = x/y x:2\n    printf(\"x: %d\\n\", x);\n    printf(\"x %= y: %d\\n\", x%=y);//x\
    \ = x%y\n    // 需要两个符号来打印 %\n    printf(\"x: %d\\n\", x);\n\n    return 0;\n}\n\
    ```\n\n输出:\n2 + 2 : 4\n2 - 2 : 0\n2 * 2 : 4\n2 / 2 : 1\n++ : 3\n-- : 1\nmodulus\
    \ : 1\n2 == 2 : 1\n2 != 2 : 0\n\n```\n2>2:0\n2>=2:1\n2<2:0\n2<=2:1\n\nx+= y: 4\n\
