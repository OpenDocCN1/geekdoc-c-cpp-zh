    \n```c\n#include <stdio.h>\n/* 演示 if 语句和决策。if 语句控制程序的流程（决定运行哪些代码）。 */\nint main()\
    \ {\n    int x = 1;\n    int y = 2;\n\n    if(x==y) { // 如果语句通过\n        printf(\"\
    Passed the if statement\\n\");\n    } else if(x!=y) { // 如果此通过且之前的失败\n       \
    \ printf(\"x was changed...\\n\");\n    } else{ // 如果全部失败\n        printf(\"in\
    \ else statement\\n\");\n    }\n\n    printf(\"x: %d\\n\",x);\n\n    return 0;\n\
    }\n```\n\n# CoinFlip.c\n\n```c\n#include<stdio.h>\n#include<stdlib.h>\n#include<time.h>\n\
    /*\n作者 | 邮箱 | 日期\nCoinFlip: 通过随机数生成模拟抛硬币。随机数生成使用时间，因此我们需要导入 time.h 和 stdlib.h。随机数让你的程序更有趣。\n\
    */\nint main() {\n\n    srand(time(0));\n    int r = rand()%2 + 1;//给了我们一个 [1,2]\
    \ 的范围\n\n    if (r == 1) \n        printf(\"Heads\\n\");\n    else\n        printf(\"\
    Tails\\n\");\n\n    return 0;\n}\n```\n\n输出1: Heads\nOutput2: Heads\nOutput3:\
    \ tails\n\n# LogicalOperators.c\n\n```c\n#include <stdio.h>\n/* DoEasy | 邮箱]|[日期]\n\
    逻辑运算符: 逻辑运算符包括与运算符 &&。或运算符 ||，以及感叹/非运算符 !。感叹运算符允许你反转一个语句，它产生相反的结果。逻辑运算符允许你将真/假语句链在一起。\n\
    */\nint main(){\n    int a, b, c;\n    a = 100;\n    b = 100;\n    c = 99;\n \
    \   if (a == b && a != c){ // 如果此通过\n        printf(\"&& returns: %d\\n\", (a==b\
    \ && a != c));\n    }\n    else if(a == b || a == c){ // 如果此通过且之前的失败\n       \
    \ printf(\"|| returns: %d\\n\", (a==b || a == c));\n    }else{ // 如果全部失败\n   \
    \     printf(\"No check passed :\\n\");\n    }\n\n    return 0;\n}\n```\n\n"
