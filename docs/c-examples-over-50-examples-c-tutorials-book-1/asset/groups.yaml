    # Author’s Note\n\nThank you very much for your purchase, and your interest in\
    \ learning a wonderful programming language. “C Examples” contains over 30 examples\
    \ that are fully functional, easy to use, and unique. Previous programming knowledge\
    \ is not required, however previous knowledge can do nothing but help. The only\
    \ requirement is patience, dedication, and a passion for learning. However, as\
    \ to not deter you from learning C I am going to explain how to create, compile,\
    \ and run a “c.” source file.\n\nIn order to create an editable “c” source file\
    \ you first need to choose a text editor, I am going to use emacs. So to create\
    \ a “c” source file type the following command into your\n\n```\nemacs SourceFile.c\n\
    ```\n\nThen to compile use the following command:\n\n```bash\ngcc -o SourceFile.c\
    \ SourceFile\n```\n\nThen to run your file, use:\n\n```bash\n./SourceFile\n```\n\
    \nNew topics are presented in this book in an easy to understand way, then programs\
    \ are made using the new topic as well as previously discussed topics in order\
    \ to review and learn new material simultaneously. This helps you maximize learning\
    \ a new language. There is much to learn and practice makes perfect. So let us\
    \ begin.\n\nThank You\n\n# HelloWorld.c\n\n```c\n#include <stdio.h> // header\
    \ file, this includes input and output\n// so we can use printf below\n// how\
    \ to set up a .c file. This is just a test to\n// sure your environment is set\
    \ up properly.\nint main() { // what is when you run a program\n    printf(\"\
    Hello World!\\n\"); // is a newline character, it puts onto a new line\n    return\
    \ 0; // for no errors\n}\n```\n\nOutput: Hello World!\n\n# DataTypes.c\n\n```c\n\
    #include <stdio.h>\n/* The types of data available to use within C.\nNotice the\
    \ sizeof() function, it returns the size (in bytes) of the data type. lu is a\
    \ placeholder that holds unsigned long. There are many types listed here: char,\
    \ int, float, and double. */\n```\n\nOutput: Storage size for char: 1 byte\nStorage\
    \ size for int: 4 byte\nStorage size for float: 4 byte\nStorage size for long:\
    \ 8 byte\n\n# Variables.c\n\n```c\n#include <stdio.h>\n/* Shows how to declare\
    \ and initialize a variable. Multiple declarations are legal, just on separate\
    \ lines. You can perform operations on similar data types. To initialize the variable\
    \ equal to a value. */\nint main(){\n    char x; // declaration of a variable\n\
    \    x = 't'; // initializing the variable\n    // notice is with printf\n   \
    \ int x, y, z; // multiple declarations on the same line\n    x = 3;\n    y =\
    \ 2;\n    z = x+y;\n    printf(\"z: %d\\n\", z);\n    return 0;\n}\n```\n\nOutput:\
    \ z: 5\n\n# Operators.c\n\n```c\n#include <stdio.h>\n/* Basic operators in C,\
    \ when you perform operations with operators, the must be on the same data type.\
    \ Operators include arithmetic, relational/comparison, and assignment operators.\
    \ There are more but this is all we need for now. */\nint main() {\n    int x,\
    \ y;\n    x = 2;\n    y = 2;\n\n    /*Arithmetic Operators*/\n    printf(\"2 +\
    \ 2: %d\\n\", x+y);\n    printf(\"2 - 2: %d\\n\", x-y);\n    printf(\"2 * 2: %d\\\
    n\", x*y);\n    printf(\"2 / 2: %d\\n\", x/y);\n    x++; // same as x + 1\n  \
    \  printf(\"++: %d\\n\", x);\n    y--; // same as y+1\n    printf(\"2--: %d\\\
    n\", y);\n    int m = 3%2;//returns the remainder of the quotient\n    printf(\"\
    modulus: %d\\n\", m, m);\n\n    /*Relational Operators*/\n    //0(representing\
    \ false) or 1(representing true)\n    printf(\"2 == 2: %d\\n\", x==y);//not an\
    \ assignment, a comparison\n    printf(\"2 != 1: %d\\n\", x!=y);//bang operator\n\
    \    printf(\"2 > 2: %d\\n\", x>y);//will return 0\n    printf(\"2 >= 2: %d\\\
    n\", x>=y);\n    printf(\"2 < 2: %d\\n\", x<y);\n    printf(\"2 <= 2: %d\\n\"\
    , x<=y);\n\n    /*Assignment Operators*/\n    printf(\"x += y: %d\\n\", x+=y);//x\
    \ = x+y\n    printf(\"x: %d\\n\", x);//x=4\n    printf(\"x -= y: %d\\n\", x-=y);//x\
    \ = x-y x:2\n    printf(\"x: %d\\n\", x);//x=2\n    printf(\"x *= y: %d\\n\",\
    \ x*=y);//x = x*y\n    printf(\"x: %d\\n\", x: %d\\n\", x/=y);//x = x/y\n    printf(\"\
    x: %d\\n\", x);\n    printf(\"x %= y: %d\\n\", x%=y); //x = x%y\n    //two signs\
    \ needed to print out a % sign\n    printf(\"x: %d\\n\", x);\n\n    return 0;\n\
    }\n```\n\nOutput:\n2 + 2 : 4\n2 - 2 : 0\n2 * 2 : 4\n2 / 2 : 1\n++ : 3\n2-- : 1\n\
    modulus : 1\n2 == 2 : 1\n2 != 2 : 0\n\n```\n2>2:0\n2>=2:1\n2<2:0\n2<=2:1\n\nx+=\
    \ y: 4\nx: 4\nx-= y: 2\nx: 2\nx*= y: 4\nx: 4\nx/= y: 2\nx: 2\n```\n\n# IfStatement.c\n\
    \n```c\n#include <stdio.h>\n/* Illustrates if statements and decision making.\
    \ If statements control the flow of your program (they decide which code gets\
    \ ran). */\nint main() {\n    int x = 1;\n    int y = 2;\n\n    if(x==y) { //\
    \ if this statement passes\n        printf(\"Passed the if statement\\n\");\n\
    \    } else if(x!=y) { // if this passes and previous fails\n        printf(\"\
    x was changed...\\n\");\n    } else{ // if all fail\n        printf(\"in else\
    \ statement\\n\");\n    }\n\n    printf(\"x: %d\\n\",x);\n\n    return 0;\n}\n\
    ```\n\n# CoinFlip.c\n\n```c\n#include<stdio.h>\n#include<stdlib.h>\n#include<time.h>\n\
    /*\nAuthor | Email | Date\nCoinFlip: Simulates a coin toss by random number generation.\
    \ Random number generation uses time so we need import time.hand stdlib.h for\
    \ this work. Random numbers make you programs more interesting.\n*/\nint main()\
    \ {\n\n    srand(time(0));\n    int r = rand()%2 + 1;//gives us a range of [1,2]\n\
    \n    if (r == 1) \n        printf(\"Heads\\n\");\n    else\n        printf(\"\
    Tails\\n\");\n\n    return 0;\n}\n```\n\nOutput1: Heads\nOutput2: Heads\nOutput3:\
    \ tails\n\n# LogicalOperators.c\n\n```c\n#include <stdio.h>\n/* DoEasy |email]|[date]\n\
    Logical Operators: Logical operators include the and operator, &&. The or operator,\
    \ ||, and the bang operator, !. The bang operator allows you to reverse a statement,\
    \ it produces the opposite result. Logical operators allow you to chain together\
    \ true/false statements.\n*/\nint main(){\n    int a, b, c;\n    a = 100;\n  \
    \  b = 100;\n    c = 99;\n    if (a == b && a != c){ // if this passes\n     \
    \   printf(\"&& returns: %d\\n\", (a==b && a != c));\n    }\n    else if(a ==\
    \ b || a == c){ // if this passes and previous fails\n        printf(\"|| returns:\
    \ %d\\n\", (a==b || a == c));\n    }else{ // if all fail\n        printf(\"No\
    \ check passed :\\n\");\n    }\n\n    return 0;\n}\n```\n\nOutput:\n&& returns:\
    \ 1\n"
