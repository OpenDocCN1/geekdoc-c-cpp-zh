    # # Author’s Note


    Thank you very much for your purchase, and your interest in learning a wonderful
    programming language. “C Examples” contains over 30 examples that are fully functional,
    easy to use, and unique. Previous programming knowledge is not required, however
    previous knowledge can do nothing but help. The only requirement is patience,
    dedication, and a passion for learning. However, as to not deter you from learning
    C I am going to explain how to create, compile, and run a “c.” source file.


    In order to create an editable “c” source file you first need to choose a text
    editor, I am going to use emacs. So to create a “c” source file type the following
    command into your


    ```

    emacs SourceFile.c

    ```


    Then to compile use the following command:


