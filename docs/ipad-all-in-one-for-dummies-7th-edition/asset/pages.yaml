    # Connecting to the Internet


    To browse the web, access Mail, and shop online, you first have to be connected
    to the Internet, so I''m putting this information right up front. How you connect
    to the Internet depends on which iPad model you use:


    +   - The Wi-Fi-only iPad connects to the Internet, logically, via a Wi-Fi network.
    You may have already set up this type of network in your own home using your computer
    and some equipment from your Internet provider. You can also connect through public
    Wi-Fi networks (hotspots). You have probably noticed how many hotspots your town
    or city has: Look for Internet cafes, coffee shops, hotels, libraries and transportation
    centers as airports or bus stations. In fact, after you start you will notice
    lots of signs alerting you to Wi-Fi locations—they are everywhere.


    +   - If you own a Wi-Fi and 3G or Wi-Fi and 4G-enabled iPad, you can use a Wi-Fi
    connection (which is usually much faster if you have a good connection), but you
    can also use a paid data network through AT&T, Sprint, T-Mobile, or Verizon to
    connect via a cellular network just about anywhere you can use cellular phone
    coverage. If you have a 3G or 4G model, you don''t have to do anything with a
    contract for coverage, the connection is made automatically wherever cellular
    service is available, just as it is on your cellphone.


    TIP See Chapter 1 in this minibook for the capabilities of different iPad models
    and the costs associated with a cellular network.


    When you''re in range of a hotspot, a pop-up may display automatically; if it
    doesn''t, follow these steps:


    +   1. Tap Settings on the Home screen.

    2. Tap Wi-Fi.

    3. Be sure that Wi-Fi is set to On (see Figure 5-1) and choose a network to connect
    to.


    Network names should appear automatically when you''re in range of networks. When
    you''re in range of a public hotspot, if access to several nearby networks is
    available, you may see a message asking you to tap a network name to select it.


