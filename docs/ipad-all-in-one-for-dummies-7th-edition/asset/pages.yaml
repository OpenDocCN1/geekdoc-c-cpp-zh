- pgno: 256
  md: 'Do you like to associate a face with a name? Doing so can help you keep your
    clients or other contacts straight. You can place a photo on a person''s information
    page in the Contacts app on your iPad. For more know about how to do this, see
    Book V, Chapter 5.


    # Editing Photos


    The Photos app also lets you do some simple editing of your photos, and with iOS
    8, you have several new editing tools to work with, including smart adjustment
    filters and smart composition tools. Editing features allow you to rotate images,
    enhance image quality, get rid of pesky red-eye effect, or crop to exactly the
    area of the image that you want to display. You can work with the newly available
    filters to apply effects to your images.


    Follow these steps to edit photos:


    +   1. Tap the Photos app on the Home screen to open it.

