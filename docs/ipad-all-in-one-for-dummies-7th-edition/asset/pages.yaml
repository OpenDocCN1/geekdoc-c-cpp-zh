- pgno: 395
  md: '# 378 Using Tables


    # Resizing a row or column


    The two vertical lines (known as the Cells button) in the top-right corner of
    the column frame (refer to Figure 3-14) and the two horizontal lines in the bottom-left
    corner of the row frame (refer to Figure 3-12) let you resize the selected rows
    or columns. You always resize a column to its right and to its bottom, whether
    you''re making it larger or smaller. The contents are automatically adjusted,
    and the adjoining rows or columns are moved aside.


    # Moving a row or column


    Sometimes, you want to rearrange the rows or columns in a sheet. With one or more
    rows or columns selected, press and drag it (or them) to a new position. All selected
    rows or columns move as a unit, and the other rows or columns move aside.


    # Resizing a table


    You can resize a table in two ways: add or remove rows or columns to from the
    table, or leave the number of rows and columns the same and change the overall
    size of the table. You may even want to both.


    # Adding or removing rows and columns at the right or bottom


    Tap the Cells button in the top-right corner of the column frame to add a new
    column at the right. To add a new row at the bottom, tap the Cells button in the
    bottom-left corner of the row frame, and a new row is added to the bottom of the
    table.


    To remove a blank column or row at the right side or bottom of a table, drag the
    appropriate Cells button to the left or to the top of the frame — the extra rows
    or columns disappear.


    # Adding or removing rows and columns inside the table


    Select the row or column below or to the right of the new row or column. From
    the selection buttons, tap Insert to add a new row above the selected row or a
    new column to the left of the selected column.


    # Changing a table''s size


    Select the table so that the handles (small blue dots) are visible at the right
    and bottom. These handles work like other resizing handles in Numbers: Simply
    drag them horizontally or vertically to change the table''s size. The content
    of the table automatically resizes to fit the new table size. The numbers of rows
    and columns remain unchanged, but their sizes may be adjusted.'
  merge: -1
  img_proc: true
- pgno: 396
  md: '# Working with Cells


    You can select the table by tapping the round button at the top-left of the table.
    (Refer to Figure 3-11.)


    Read more about formatting tables in the “Working with New Tables”-section, later
    in this chapter.


    # Working with Cells


    Double-tap a cell if you want to add or edit data. A blue outline appears around
    the cell, and the keyboard appears so that you can begin entering data.


    Single-tap if you want to select a cell. The cell is outlined, and the table-selection
    elements (the column and row frames, the Cells button at the left of the column
    frame, and the button to the right of the column frame as the button beneath the
    row frame).


    Double-tap makes the cell available for editing. Figure 3-15 shows how, after
    a double-tap in a cell, the keyboard appears.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_396_0.png)


    Figure 3-15: Start to edit a cell''s data.


    After you set up your spreadsheet, most of your work consists of entering and
    editing data of all types. That’s what you find out about the next section.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Entering and editing data


    The keyboard for entering data into a Numbers cell is a powerful and flexible
    tool — it''s four keyboards in one. Above the keyboard, the Formula bar lets you
    quickly and easily enter formulas. (Refer to Figure 3-15.) On the left of the
    Formula bar are four buttons that let you switch from one keyboard to another.
    You can choose these keyboards, starting from the:


    +   - Numeric (42 icon): Lets you use the numeric keyboard.

    - Date and Time (clock icon): Lets you enter dates and times.

    - Text (T icon): Displays the standard keyboard.

    - Formulas (= icon): Opens the formula-editing keyboard.


    Whichever keyboard you''re using, you see the characters you''re typing in the
    Formula bar above the keyboard. To the right of the oblong area is a button labeled
    Done (or a check mark, depending on which keyboard you''re using) that moves your
    typing into the selected cell and then hides the keyboard.


    The Dictation feature on iPad works in Numbers and the other iApps. Tap the Dictation
    key on the onscreen and speak your text; tap the key to insert text in your document.


    You can bring up the keyboard when you double-tap a cell or another text field
    (as a tab name). That means that the cell is selected and the keyboard knows where
    the data should go when you tap OK or Done.


    Note that some of these features are unavailable on a Bluetooth keyboard, which
    may or may not have a number pad and special symbols when entering formulas.


    To the right of the keyboard in the numeric and date-and-time keyboards are three
    large keys:


    +   - Delete: This is the standard keyboard Delete key.

    - Next (adjacent): The key with the right-pointing arrow inserts the typed data
    into the selected cell and moves to the next cell to the right.

    - Next (next line): The key with the hooked arrow pointing left and ups the typed
    data and moves to the left and to the leftmost cell in the section of cells you''re
    entering. For example, if you start in the third column of the fourth row, the
    Next (next line) key moves you to the fifth row, not the first column.


    # Entering numeric data


    The numeric keyboard (accessed by tapping the 42 button) has a typical numeric
    keypad with four large buttons on the left (see Figure 3-16).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_397_0.png)'
