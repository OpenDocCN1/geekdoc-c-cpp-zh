    when you first buy it before you can use it. In my case and perhaps in yours,
    the nice me at the Apple Store activated my iPad before I left the store, so I
    set up my iTunes account the first time I wanted to buy a hot movie title.


    # Making Settings and Syncing


    Remember that great photo of your promotion party you have on your hard drive?
    How do you get onto iPad so you can show it off at the family reunion? Or how
    about audiobook on career success that you bought and downloaded to your laptop
    on your last business trip? It would be easy to get that sucker onto your iPad.
    Never fear: By making a few settings and syncing with your computer, you can bring
    all that content over in flash.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_93_1.png)


    Remember that you can also sync content using iCloud. See the section “Understanding
    iCloud,” later in this chapter, for more option about that.


    # Making iPad settings using iTunes


    When you plug your Lightning to USB Cable for third-generation iPads and earlier)
    into your iPad and computer and then open iTunes, a group of settings shows how
    content will sync between the devices.


    If you''re using a Mac, you already have iTunes installed, but be sure that you
    have the latest version (at the time of this writing it''s version 11.4). Open
    iTunes and check for Updates. For Windows users, download the iTunes application
    to your computer so that you have the option of using it to sync (transfer) downloaded
    content to your iPad.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_93_2.png)


    Note that you can sync wirelessly to your computer by tapping Settings on the
    Home screen, tapping General, and tapping iTunes Wi-Fi Sync. In the settings that
    appear, tap Sync Now. This works only if your computer is connected to the Wi-Fi
    network.'
