  md: '# Getting and Setting Info about the Selection


    +   * Font Size: Tap the large A on the right to enlarge selected text by one
    point; the smaller A on the left to decrease the text size. By using the tool
    in the middle, you can set the font size to an exact number.


    +   * Font Styles: You can choose bold, italic, or underlining.


    +   * Alignment: The selected paragraph can be aligned to the left, center, or
    right, or justified so that margins are straight with ragged edges. You do not
    have to select the paragraph with a triple-tap for alignment to work. If you have
    selected a word or an insertion point, the paragraph containing either it is the
    paragraph.


    +   * Insert: Tapping the button on the Formatting toolbar displays a menu of
    insertion commands including Comment, Link, Page Break, Column Break, and Footnote.
    (Link appears only if text is selected; Line Break appears if no text is selected.)


    Free to experiment with the formatting with your Pages documents, and remember
    that the Undo button in the upper left is to help you out if you change your mind
    about an action you''ve taken.


    You can also use the ruler to set the margins for paragraphs. Just slide the indicators
    along the ruler. Note that the top indicator for the left margin reflects the
    margin of the first line in a paragraph; the lower indicator is the left margin
    of all other lines in the paragraph. You can indent the first line of a paragraph,
    you can also indent it (or provide a hanging first line); an outdent works well
    in a list.


