    # Turning the iPad On and Registering It


    The first time you turn on your iPad, you need to go through a sequence of setup
    steps. The best way to do this is to be in range of a Wi-Fi network.


    When you''re ready to get going with your new toy, be sure you''re within range
    of a Wi-Fi network that you can connect with, and then hold the iPad with one
    hand on either side, oriented like a pad of paper. Follow the Lightning to USB
    Cable with your device into your iPad and plug the other into a USB port on your
    computer, in case you lose your battery charge during the setup process.


    Follow these steps to set up and register your iPad:


    +   1. Press and hold the Sleep/Wake button on the top of your iPad until the
    Apple logo appears.

    Another moment, a screen appears with a cheery Hello on it.

    2. Slide your finger to the right on the screen where it Slide to Set Up.

    3. Enter a password if you have an Apple ID, choose how other people can reach
    you with text messages through the Messaging app or video calls through FaceTime
    (choose your phone number, iCloud account, or email account), and whether to upload
    to iCloud Drive (an online storage service).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_41_1.png)


    Be sure to utilize iCloud Drive on all your devices, such as iPhone, Mac, or Windows
    PC to make sure your iCloud-stored documents continue to sync to them all.


    +   4. You may see a series of screens that involve settings such as language,
    country, Wi-Fi network, and use of iCloud.


    Follow the series of screens to respond to questions and make initial settings,
