  md: '# Searching Email 129


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_146_0.png)


    Figure 7-14: Choose the style that your message.


    # # Searching Email


    I''m sure you''ve never mislaid an email, but some people do it all the time.
    If you want to find all messages from a certain person or that contain a certain
    word in the Subject field? Of course, you can enter a name or term into Spotlight
    Search, and results will include any emails that match the search term as well
    as contacts, songs, and so on. Or you can use Mail''s Search feature to find that
    email. You can search To, From, and Subject fields.


    Follow these steps to practice using Mail''s Search feature:


    +   1. With Mail open, tap an account to display its Inbox.

    2. In the Inbox, tap in the Search field.

    3. Enter a search term or name, as shown in Figure 7-15.


    Matching emails are listed in the results.


    If you have an email account set up to download messages to your device instead
    of accessing them from the mail server, you can use Mail to search the entire
    contents of the messages in that account.


    To start a new search, tap the Delete key in the upper-right corner of the onscreen
    keyboard to delete the term, or tap the Cancel button next to the Search field.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_146_1.png)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_146_2.png)


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 130 Mark Email as Unread or Flag for Follow-Up


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_147_0.png)


    **Figure 7-15:** Tapping in the Search Inbox opens the onscreen keyboard.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_147_1.png)


    You can also use the Spotlight Search featured in Book 1, Chapter 2 to search
    for terms in the To, From, or Subject lines of mail messages from this search
    feature reveals several paths.


    # Mark Email as Unread or Flag for Follow-Up


    With a new feature in iOS 8, you can use a simple swipe to access tools that either
    mark an email as unread after you''ve read it, which places a blue dot before
    the message, or flag an email, which places an orange circle before it. These
    methods help you remember to reread an email that you''ve already read or to follow
    up on a message at a later time.


    +   1. With Mail open and an Inbox displayed, swipe to the left to display three
    options: Move, Flag, and Trash. Note that you should swipe only halfway across
    the message; swapping all the way to the left deletes the message.


    +   2. Tap More.


    On the menu shown in Figure 7-16, you''re given several options, including Mark
    as Unread and Flag. Tapping either command applies it and returns you to your
    Inbox.


    +   3. Tap Mark as Unread.


    Note that you can also get to the Mark as Unread command by swiping to the right
    on a message displayed in your Inbox.


    +   4. Swipe to the left on another email and then tap Flag.


    An orange circle appears before the email.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_147_2.png)


    You can either mark an email as unread or flag it; you can''t do both. Either
    action provides a unique visual clue indicating that you need to revisit this
    message before deleting it.'
  merge: -1
  img_proc: true
