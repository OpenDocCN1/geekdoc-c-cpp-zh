- pgno: 331
  md: '# 314 Sending Location Info beyond Maps


    # Sending Location Info beyond Maps


    When you find a location you want to come back to or tell others about, you can
    use features of Maps that help you out. You can save a location to the Contacts
    app, which also saves the address, phone number, and URL, if any. You can also
    share a link to friends via email, Messages, AirDrop, Facebook, or Twitter. They
    can then access the location information by using Maps on any iOS device or Mac.


    # Adding a location to a contact


    The beauty of this feature is that not only can you store valuable information
    such as phone numbers and street addresses in Contacts quickly and easily, you
    can also use stored contacts to quickly find locations in Maps.


    Here is how works:


    +   1. Tap a pin to display the information bar.

    2. Tap the arrow on the bar.

    3. In the Information dialog that appears, tap Create New Contact.


    The New Contact dialog appears (as shown in Figure 2-17). Whatever information
    was available about the location has been entered.


    | Cancel | New Contact | Done |

    |---|---|---|

    | add photo | First |

    | Last |

    | Space Needle |

    | Phone | +1 (206) 905-2100 |

    | add phone |


    Figure 2-17: Any available information can be stored to Contacts.


    +   4. Enter any additional information you need, such as name, phone number,
    or email address.'
  merge: -1
  img_proc: true
