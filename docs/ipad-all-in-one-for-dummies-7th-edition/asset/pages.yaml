  md: '# # Chapter 5: Getting Social with Twitter, Facebook, and iMessage


    In This Chapter


    +   * Using Twitter or Facebook on iPad

    * Creating an iMessage account

    * Using iMessage to address, create, read, and send messages

    * Deleting a conversation

    * Sending audio, video, and maps


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_238_0.png)


    Unless you''ve spent the last few years working in Antarctica without a radio,
    you know that Twitter is a social networking service referred to as a microblog
    because it involves only posted messages. Twitter support is imported into the
    iPad''s iOS, so you can tweet people from within the Safari, Photos, Camera, and
    other apps.


    The Facebook app can also be activated through Settings. Facebook, the most popular
    social networking site, is integrated into iPad. You can also post messages and
    items such as photos to your Facebook page right from within several apps.


    Messages is an app used for instant messaging (IM). IM involves sending a text
    message to somebody''s iPhone, iPod touch, or Mac (using any phone number or address
    that the person registered to their iCloud account) to carry on an instant. With
    iOS 8 comes a few new features for Messages, including the capability to opt out
    of certain conversations, leave group conversations, and share your current location.


    In this chapter, I introduce you to ways in which iPad makes use of Twitter, Facebook,
    and instant messaging to let you stay connected to the world.


    # ## Experiencing Twitter and Facebook on iPad


    Twitter and Facebook are the darlings of the social networking world. Twitter,
    as a microblog, allows you to post only short messages (up to 140 characters)
    called tweets. Facebook is much more robust, allowing lengthy'
