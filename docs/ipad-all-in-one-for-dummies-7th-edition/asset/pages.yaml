  md: '# Deleting an Email


    I have friends who never delete emails, but that, frankly, drives me nuts (plus,
    at some point, their mailbox fills up and new emails are rejected). When you no
    longer want an email cluttering your Inbox, you can delete it. When you delete
    an email on your iPad, it''s gone from your Inbox including the Inbox you access
    through your mobile phone or computer. For a time, you can retrieve it if your
    email provider offers a Trash folder for your email account and if your settings
    for your account with that provider don''t cause emails to be deleted from their
    server on download.


    Here''s how to delete those emails no longer want:


    +   1. With the Inbox displayed, tap the Edit button.


    Circular check boxes display to the left of each message (see Figure 7-18).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_150_0.png)


    Figure 7-18: Delete several messages at one time using the Delete feature.


    +   2. Tap the circle next to the message you want to delete.


    You can tap multiple items if you have several emails to delete. Messages marked
    for deletion show a check mark in the circular check box. (refer to Figure 7-18.)


    +   3. Tap the Trash button.


    The message(s) moves to the Trash folder.'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 134 Organizing Email


    Depending on your email provider, Mail may keep a copy of all deleted messages
    for a time in a Trash folder. To view deleted messages, go to the list of all
    mailboxes. Tap the account name in the Mailboxes panel, and a list of folders
    appears. Tap the Trash folder, and all deleted messages display.


    You can also delete an email by tapping the Trash button in the toolbar that runs
    across the top of Mail or by swiping left or right on a message displayed in an
    Inbox and tapping the Trash button that appears.


    # Organizing Email


    In most email accounts your ability to create folders is dependent on the email
    program''s abilities. Some providers don''t offer much support for managing messages
    in folders. Depending on your email provider, you may be able to move messages
    into any of a few predefined folders in Mail, or you may have access to all the
    folders you''ve already set up your computer.


    Assuming you have access to folders in your email account, the folder containing
    the message you want to move (for example, the Trash or Inbox if you have an Outlook.com
    account) displayed, tap the Edit button. Circular check boxes display to the left
    of each message.


    Follow these steps to move any message into another folder:


    +   1. Tap the circle next to the message you want to move.

    2. Tap the Move button.

    3. In the list that appears (see Figure 7-19), tap the folder where you want to
    store the message.


    The message is moved.


    If you get an email, you might want to move it to the Spam or Junk Email folder.
    After you do, any future mail from that same sender is placed automatically in
    that.


    If you have an email open, you can move it to a folder by tapping the Folder icon
    on the toolbar that runs along the top. The Mailboxes list displays; tap a folder
    to move the message.'
  merge: -1
  img_proc: true
