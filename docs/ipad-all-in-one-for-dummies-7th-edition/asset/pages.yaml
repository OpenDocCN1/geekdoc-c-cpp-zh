  md: '# # Chapter 4: Working with Reminders and Notifications


    # ## In This Chapter


    +   - Adding a new task in Reminders

    - Editing a task

    - Scheduling and displaying reminders

    - Syncing with other devices and calendars

    - Completing or deleting a reminder

    - Managing notifications from Notification Center

    - Using Not Disturb


    The Reminders app and the Notification Center feature warm the hearts of iPad
    owners who need help remembering the details of their lives.


    Reminders is a kind of to-do list that lets you create tasks and set reminders
    so that you don''t forget important commitments. Notifications let you review
    all elements that you be aware of in one place, such as new mail messages, text
    messages, calendar appointments, reminders, and alerts.


    If you occasionally need to escape all your obligations, try the Do Not Disturb.
    Turn this feature and you won''t be bothered with alerts until you turn it off
    again.


    In this chapter, I will tell you how to set up and view tasks in Reminders, and
    I explain how Notification Center can centralize all your alerts.


    # ## Creating a Task in Reminders


    Reminders help you stay on schedule, avoid embarrassing missed appointments, and
    stay on top of your hundreds of errands and every day. Creating a task in Reminders
    is pretty damn simple.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_476_0.png)'
  merge: -1
  img_proc: true
- pgno: 477
  md: '# 460 Creating a Task in Reminders


    Note that when you first begin to use Reminders, you''ll have only the Reminders
    list to add tasks to. However, you can create your own categories of reminder
    lists; see the “Creating a List” section, later in this chapter, to find out how
    to do this.


    To create a reminder, follow these steps:


    +   1. Tap Reminders on the Home screen.


    +   2. On the screen that appears (see Figure 4-1), tap a blank slot in any category
    in the displayed list to add a task.


    The onscreen keyboard appears.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_477_0.png)


    Figure 4-1: Add a reminder task.


    +   3. Enter a task name or description using the onscreen keyboard and tap the
    Done button.


    The new task is added to the Reminders list.


    You can create reminders using Siri. Just press and hold the Home button Siri
    asks what you need to do, and then say something like “Create a reminder to call
    Mom this Thursday at noon.” Siri displays the reminder and asks you to confirm
    that you want to create it. Just say, “Yes,” and it’s done.'
  merge: -1
