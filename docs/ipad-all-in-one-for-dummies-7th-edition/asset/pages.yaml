    # Numbers


    As with spreadsheets, Numbers enables you to enter data in rows and columns. One
    of the most useful features of spreadsheets is that they perform calculations
    by means of formulas. For example, if you have a column listing your groceries
    by week, the addition of another grocery bill will cause the program to recalculate
    the column''s total. Spreadsheets are about data (usually numbers) and fast calculation
    updates, but they can also help you organize data as address lists and generate
    charts to show data trends.


    Spreadsheets can go beyond the common grid interface, and Numbers excels at this
    approach. Take a look at the Numbers document shown in Figure 1-2, which is based
