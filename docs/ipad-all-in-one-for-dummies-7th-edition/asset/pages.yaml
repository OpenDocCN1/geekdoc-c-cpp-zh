    # Printing photos


    If you have a printer that''s compatible with Apple AirPrint technology, you can
    print photos. As of this writing, most major manufacturers offer printers that
    have this capability, and you can bet that Apple''s working with other manufacturers
    to provide more compatible choices. However, if you don''t want to spend for one
    of these models, you can also use apps as Printopia and HandyPrint to provide
    this functionality to other printers on your network.


    > TIP If you don''t have access to this kind of wireless printer, when you plug
    iPad into your computer, you can sync both devices via iTunes.


    To print a photo, do this:


    +   1. With Photos open, maximize the photo you want to print.

    2. Tap the Share icon and tap Print.


    The Printer Options dialog appears. (See Figure 4-3).'
