- pgno: 460
  md: '# Adding Calendar Events


    To move from one day, week, month, or year to another, use your finger to scroll
    up or down the list.


    To jump back to today, tap the Day button in the bottom-left corner of Calendar.
    And now you know the basics about views in Calendar!


    The portrait and landscape orientations of your iPad with the Calendar app give
    you a slightly different display. Play around with your iPad in different directions
    to see which one you prefer to work in.


    Note that you can tap text mentions a reservation or phone number in an email
    to add an event to Calendar.


    If you''re looking for a more robust scheduling app, consider Pocket Informant
    HD for $12.99. This app is easy to use and has helpful scheduling tools for your
    tasks. You can also sync information that you save in the app by using Google
    Calendar. Also, if you want to use a calendar program for business, check out
