    \   The Home Sharing dialog appears.\n3. **Enter your Apple ID and password and\
    \ then Create Home Share.**\n   A message appears, telling you to use the same\
    \ account you just signed in to on devices you want to share with.\n4. **Click\
    \ Done.**\n5. **On your iPad, tap Settings and then tap Music.**\n6. **In the\
