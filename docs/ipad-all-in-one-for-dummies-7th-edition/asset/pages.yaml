    Google, some publishers like Baen (www.baen.com), and so on. Use the content you
    sync your computer if you want it and add it to Books in iTunes and sync to your
    iPad.


    You can also sync your books to your iPad by syncing the computer and your iTunes
    account. Using this method, you can find lots of free books from various sources
    online, as long as they''re in the eBook or PDF format, and drag them into your
    iTunes Library; then sync them to your iPad. If you have a Mac you can just drag
