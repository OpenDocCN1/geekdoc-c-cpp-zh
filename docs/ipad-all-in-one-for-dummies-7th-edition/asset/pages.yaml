    You can now access the account through the Mail app.


    You can have more than one account set to On for receiving email; tap the account
    name in Settings. When you do, you can open different accounts to view their inboxes
    from the Mail app. If you want a particular account''s emails to be downloaded,
    you can turn off any account email by opening it in Settings and tapping the On/Off
    switch.


    If you turn Calendars in the Mail account settings, any information you''ve put
    into your calendar in that account is brought over to the Calendar app on your
    iPad and reflected in the Notification Center (discussed in more detail in Book
    V, Chapter 4).


    # Opening Mail and Reading Messages


    The whole point of email is to send and receive messages. Mail offers a simple
    interface for reading your emails. It displays an email and a pane that you can
    use to show inbox contents or change to a different folder. In landscape orientation,
    the Mailboxes/Inbox pane is always displayed, but in portrait orientation, you
    display it by tapping the Inbox.


    When you tap the Mail app to open, it automatically heads out and checks for any
    new email. (If you Microsoft Exchange or iCloud, you can turn on push settings
    to have your email host initiate a check for new messages to download them to
    your iPad).


    Here are some common actions in Mail:


    +   To follow a link in a message, simply tap it. Note that tapping links opens
    them in Safari, and tapping address lines opens the Maps app with a map to that
    address displayed. You can also tap phone numbers to call that person, or flight
    code links to check on a flight''s status in Safari.


    +   To open an attachment, tap it, and Mail presents you with a menu to select
    the one you want to open it.


    +   To open a meeting invitation, tap the meeting icon (what it looks like depends
    on the application; example, Outlook.com uses a little calendar sync).


    iPad supports many file types—including those that run on multiple platforms,
    such as PDF and text; those available on Macs, including i Works and Numbers;
    those for Windows users (also available in Mac versions), including Microsoft
    Word and Excel; as well as most common graphics and audio formats.


