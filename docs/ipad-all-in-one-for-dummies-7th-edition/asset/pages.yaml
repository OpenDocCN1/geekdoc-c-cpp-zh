- pgno: 250
  md: '# # Chapter 6: Playing with the Photos App


    # ## In This Chapter


    +   - Importing photos from iPhone or a digital camera

    - Viewing an album or individual photos

    - Editing photos

    - Organizing photos

    - Sharing and deleting photos

    - Running a slideshow

    - Working in iCloud Photo Library


    With its gorgeous screen, iPad is a natural for taking and viewing photos. It
    supports most common photo formats, such as JPEG, TIFF, and PNG. With an iPad,
    you can shoot your own photos using the built-in cameras (see Chapter 4 in panorama
    modes, and with preprogrammed square or smart adjustment filters). You can also
    sync your photos from iCloud or your computer, iPhone, or digital camera using
    the iCloud Photo Library. You can save images that you find online to your iPad
    or receive them by Mail or Messages to your iPad.


    After you have photos to play with, the Photos app organizes photos from the Camera
    Roll, viewing them in albums, by one, or in a slideshow, and you can view photos
    by the year they were taken, with images divided into collections by the time
    or location you took them. You can also AirDrop, email, message, post to Facebook,
    or tweet a photo; print it; or use your expensive gadget as an electronic picture
    frame. Finally, this chapter discusses the Photo Stream feature, which you can
    use to share groups of photos with people using iCloud on a Mac or iOS device.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_250_0.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 234 Getting Photos into iPad


    # Getting Photos into iPad


    Before you can play around photos, you have to take some with the iPad camera,
    covered in Chapter 4 in this minbook, or get them onto your iPad from another
    source. You have a few ways to get photos from elsewhere. You can buy an accessory
    to import them from your camera or iPhone; save a photo that you find on the web
    or receive as an email, message, or tweet; have somebody send you a photo via
    AirDrop from another device; or sync to iCloud or your computer to download photos
    you saved there. The whole syncing process is discussed in Book I, Chapter 5.
    The two other methods are explained here.


    Screens you take of your iPad screen are also saved to the Camera Roll. To take
    a screenshot, display what you want to shoot, and press and hold the Home button,
    tap the Sleep/Wake button, and then release. You''ll find your screenshot in the
    Photos Camera Roll.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_251_0.png)


    # Importing photos from a digital camera


    Your iPad camera and a computer aren''t the only sources of photos. You can import
    photos from a digital camera and videos from your iPhone/iPad touch if you use
    the Lightning to USB Camera Adapter from Apple, which will set you back $29, and
    the SD Card Reader to import image files from an SD card, also available at $29.
    You can also take advantage of the iOS 8 iCloud Photo Library, which stores images
    on any of your iOS devices.


    You can find information in Book I, Chapter 5 about syncing iCloud content or
    your computer with your iPad to port photos. You can also find out how to take
    and use photos from the iPad''s built-in camera in Chapter 4 of this minbook.


    Follow these steps to import photos, after you have the adapters described earlier
    in this section in hand:


    +   1. Start the import process by putting your iPad to sleep using the switch
    on the top right.

    2. Insert the Lighting to USB Camera Connector into the Dock Connector slot of
    your iPad.

    3. Connect the USB end of the cord that came with your digital camera or iPhone
    into the Camera Connector.

    4. Connect the other end of the cord that came with your camera into that device.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_251_1.png)'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Getting Photos into iPad 235


    +   5. Wake up your iPad.


    The Photos app opens and displays the photos on the digital camera.


    +   6. Tap Import All on your iPad.


    If you want to import only selected photos, tap individual photos and then tap
    Import. Finally, tap Import rather than Import All.


    The photos are saved to the Last Import album.


    +   7. Disconnect the cord and the adapter.


    You''re done!


    You can also import photos stored on an SD (secure digital) memory card often
    used by digital cameras as a storage medium. Simply put the iPad to sleep, connect
    the SD Card Reader to the iPad, insert the SD card containing the photos, and
    then follow Steps 5 through 7 in the preceding list.


    Remember that AirDrop you can quickly send photos directly from your iPhone 5
    or later to your iPad (fourth-generation or, or mini), as long as the devices
    are within 12 feet of each other, as well as to mid-2012 or newer Macs running
    OS X Yosemite.


    # Saving photos from the web


    The web offers a wealth of images that you can download to your Photo Library
    on the iPad. The built-in Safari browser makes it simple to save any image you
    come across to your iPad.(Of course, you should be careful not to violate copyright
    when using pictures you''ve grabbed.


    Several search engines have advanced search features that allow you to search
    for only nonlicensed images, at least theoretically, that you don''t have to pay
    for the images. It''s always a good idea to get written permission to use an image,
    especially if you intend to use it to make money (with a company brochure or online
    course).


    Follow these steps to save images from the web:


    +   1. Open Safari and navigate to the web page containing the image you want.


    +   2. Press and hold the image.


    A popup appears, as shown in Figure 6-1.


    +   3. Tap Save Image.


    The image is saved to your Camera Roll album in the Photos app.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_252_0.png)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_252_1.png)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_252_2.png)


    | Book II Chapter 6 | Playing with the Photos App'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 236 Looking at Photos


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_253_0.png)


    **Figure 6-1:** Use this menu to save an image to your iPad.


    For more about how to use Safari to navigate to or search for web content, see
    Book I, Chapter 6.


    A number of sites protect their photos from being copied by applying an invisible
    overlay. This blank overlay ensures that you don''t actually get the image you''re
    tapping. Even if a site doesn''t take these precautions, be sure that you don''t
    save images from the web and use them in ways that violate the rights of the person
    or entity that owns them.


    # Looking at Photos


    Photos were made to be looked at, so knowing how to view the albums and individual
    photos that you manage to get into your iPad is a way to tap into the key strength
    of the Photos app. In this section, you get some tips for taking your experience
    to the max.


    If you want to do more than look at photos, check out a few of these photoediting
    apps that were designed to work with iPad: Adobe Photoshop Touch, Photogene for
    iPad from Mobile Pond, PhotoForge for iPad from GhostBird Software, and the free
    PhotoPad by ZAGG. All are available through the App Store.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# Viewing an app


    The Photos app organizes your pictures into albums using such criteria as the
    folder from your computer which you synced the photos or photos captured using
    the iPad camera (which are stored in the Recently Added album). You may also have
    albums for images that you synced from devices such as your iPhone or digital
    camera, and collections of your photos by year or location.


    To view your albums, start by tapping the Photos app on the Home screen. The Albums
    tab shown in Figure 6-2. Now you can tap an album, and the photos in its display.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_254_0.png)


    Figure 6-2: Switch between individual photos, photos stored on iCloud, and albums
    using these tabs.


    If you''re on a Windows PC, check out two products for managing and syncing photos
    to iPad: Lightroom from Adobe (www.adobe.com) or Adobe''s Photoshop Elements (version
    8 or later). You can also create picture subfolders in Windows Explorer or the
    Photo folder hierarchy on a Mac, and when you sync, each subfolder becomes an
    album on your iPad.


    # Viewing individual photos


    After you figure out what album your images are in, you have several fun ways
    to interact with individual photos. The iPad touchscreen is the key to this tactile
    experience.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# 238 Looking at Photos


    Tap the Photos app on the Home screen and then tap the Photos tab at the bottom
    of the screen (shown in Figure 6-3). Your photos are displayed by criteria, such
    as the time taken or location.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_255_0.png)


    Figure 6-3: Viewing thumbnails of individual photos.


    Now try these techniques:


    +   **Full-screen view:** To view a photo, tap the photo’s thumbnail. You can
    also pinch your fingers on the photo and spread your fingers apart. The picture
    enlarges.


    +   **Browsing an album:** Tap to display an album and then flick your finger
    to the left or right to scroll through the individual photos in album.


    +   **Multiple photos:** To reduce the display size of an individual photo and
    return to the picture view, place two fingers on the photo and pinch them together.
    You can also tap the Back button (the < icon) in the top-left corner (which may
    display different words depending on where you are in a collection of photos)
    to view the next highest level of photo collection.


    +   **Twirling:** Place two fingers on a photo and spin them to the left or right.
    This maneuver, known as grab and spin, twirls the photo on the screen and returns
    you to the folder view (and it’s lots of fun to do).'
