  md: '# 356 Setting Basic Formatting by Using the Ruler


    Import text. You can use iTunes, iCloud, Mail, or cloud storage apps such as Dropbox
    to move existing documents to your iPad. You can create the documents on your
    Mac or PC by using tools such as iWork, Microsoft Office, or Google Apps. When
    the document is ready, import that file in .txt, Word, or Pages to your iPad as
    described in Chapter 1 of this minibook and continue working with the document
    using iWork for iPad. If you work on a document using iWork for iCloud with a
    browser from a PC or Mac, the document will automatically saved both in iCloud
    and to all your iOS devices.


    After you have text in your Pages document, you can start to manage.


    # Setting Basic Formatting by Using the Ruler


    As is the case in most word-processing programs, a ruler at the top of a page
    in document editing lets you set basic formatting. The ruler can be hidden, but
    tapping in the document displays it, as shown in Figure 2-3. Tapping text also
    shows the keyboard with formatting tools at the top. You can also tap the Format
    button shaped like a paintbrush at any time to display the Form dialog.


    The ruler shows the settings for whatever is selected in the document. Tap text
    in the document, and the ruler is immediately enabled and reflects the settings
    for the selection (in this case, the margins). Tapping in the document may also
    bring up the onscreen keyboard and a contextual set of tool buttons, as shown
    in Figure 2-3. You can use them to use features such as Cut, Copy, Delete, and
    Paste.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_373_0.png)


    Figure 2-3: Displaying the ruler and formatting tools in Pages.'
