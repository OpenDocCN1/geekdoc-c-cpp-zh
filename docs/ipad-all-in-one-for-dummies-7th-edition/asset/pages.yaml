- pgno: 320
  md: '4. Tap the Show 3D Map button in the Maps popover.


    A 3D effect is applied to whatever view is displayed (see Figure 2-5).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_320_0.png)


    **Figure 2-5:** 3D seems to rotate and slant the map before your eyes.


    You can drop a pin to mark a location on a map that you can return to. See the
    "Dropping a pin" section, later in this chapter, for more about this feature.


    You can also turn on a feature that displays an overlay on the Standard map to
    show current traffic conditions. (The Traffic Traffic setting is shown earlier
    in Figure 2-2.) This feature works best in major metropolitan areas and displays
    red dashes on roads indicating accidents or road closures, and orange dashes to
    indicate traffic slowdowns to help you navigate your rush-hour commute or trip
    to the mall.


    To print any displayed map to an AirPrint-compatible printer, just tap Share in
    the top-right corner and then tap the Print button.


    # Zooming in and out


    If you''ve used an online mapping program, you know that you frequently have to
    move to more or less detailed views of the map to find what you''re looking for:
    The street detail doesn''t show the next highway, and the region level doesn''t
    let you see all-important next turn. You''ll appreciate the feature in the Maps
    app that allows you to zoom in and out to see more or less detailed maps and to
    move around a map.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# #304 Getting Where You''re Going


    You can use the following methods on a displayed map to zoom in and out and move
    around a map:


    +   - Double-tap with a single finger to zoom in and reveal more detail.

    - Double-tap with two fingers to zoom out and reveal less detail.

    - Place two fingers together on the screen and move them apart to zoom in.

    - Place two fingers apart on the screen and pinch them together to zoom out.

    - Press your finger to the screen and drag the map in any direction to move to
    an adjacent area.


    It can take a few moments for the map to redraw itself when you enlarge, reduce,
    or move around it, so have a little patience. An area that''s being redraw will
    look like a blank grid but will fill in time. Also, if you''re in Satellite or
    Hybrid view, zooming may take some time; wait it out because the blurred image
    will resolve itself.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_321_0.png)


    # ## Going to another location


    If you''re at Point A and want to get to Point B — Calcutta, Moines, or wherever—you
    need to know how to find any location other than your current location using Maps.
    Doing this involves entering as much information you have about the location''s
    address in the Search field.


    Try going to another location using these steps:


    +   1. With Maps, tap in the Search field.

    - If you don''t see the Search field in the upper-right corner, you may have to
    tap the Clear button.

    The keyboard opens (as shown in Figure 26).

    2. Type a location, using a street address with city and state, a stored contact
    name, or a destination, such as Empire State Building or Detroit airport.

    Maps may make suggestions as you type if it finds any logical matches.

    The Dictation key (not available on iPad 2) on the onscreen keyboard (refer to
    Figure-2) and speak a location to iPad if you prefer. Tap in the Search field
    and then tap the Dictation key and search again to find what you''ve spoken appears
    there.

    Double-tap the Home button and ask Siri (third-generation iPad or later) for a
    type of business or location by zip code. If you example something with pepperoni,
    say "Pizza in 92208 zip code"—The results typically display a small map that you
    can tap to open the Maps app to find your way. See Book V, Chapter 6 about using
    Siri.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_321_1.png)'
  merge: -1
  img_proc: true
