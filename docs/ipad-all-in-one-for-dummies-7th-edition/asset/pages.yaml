    **Figure 7-8:** Mailboxes for various accounts and the consolidated Inbox are
    listed here.


    To escape your email and then if you have a 3G or 4G model iPad, you can stop
    retrieval of data including email by tapping Settings and then tapping Cellular
    and setting the Cellular Data switch to Off. Now you''ll get data on your device
    only if you''re logged into a Wi-Fi network.


    # Replying to or forwarding email


    Replying to or forwarding emails is pretty dearny with iPad as well. In fact,
    there''s a handy button for replying or forwarding. There''s also a Print command
    on this to make printing your emails to a compatible printer easy.


    You can attach a photo or video to new email messages when you create them by
    pressing in the message body and then inserting Photo or Video. You can also use
    features in apps as Photos, Contacts, Notes, iWork Pages, and Maps to share individual
    documents via email.


    Here''s how to use the simple Reply/Forward functions in iPad:


    +   1. **With an email open (see the preceding section), tap the Reply button,
    as shown in Figure 7-9.**


    If you are the only recipient, there will be no Reply option; if available, this
    option allows you to reply to the sender and all other recipients.


