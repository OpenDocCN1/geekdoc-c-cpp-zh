  md: '# Focusing Learning with Guided Access


    In addition to Siri, don''t forget about using the Dictation key on the onscreen
    keyboard to speak text entries and basic keyboard commands.


    # Managing Home Click Speed


    Sometimes if you have dexterity challenges, it''s hard to double-tap or triple-tap
    the Home button fast enough to have an effect. Choose the Slow or Slowest setting
    when you tap the Home Click Speed setting to allow you a bit more time to make
    that second or third tap:


    +   1. Tap Settings > General > Accessibility.

    2. Scroll down and tap Home Click Speed.

    3. Tap the Slow or Slowest settings to change how rapidly you have to double-
    or triple-tap your screen to initiate an action.


    If you have adaptive accessories, you can use gestures to control your iPad, highlighting
    features in sequence and selecting one. Use the Switch Control feature in the
    Accessibility settings to turn this mode on and make settings for this.


    # Focusing Learning with Guided Access


    Guided Access is a feature that you can use to limit a user''s access to the iPad
    to a single app, and even limit access to that app certain features. This is useful
    in various settings, ranging from use in a classroom to use by someone with attention
    deficit disorder, and even in a public setting such as a kiosk where you don''t
    want users be able to open other apps. To use these steps:


    +   1. Tap Settings and then tap General.

    2. Tap Accessibility and tap Guided Access, and on the pane that appears (see
    Figure 3-11), tap Guided Access to turn on the feature.

    3. Tap Passcode Settings and then set Guided Access Passcode to activate a passcode
    so that using an app cannot return to the Home screen to access other apps.

    4. In the Set Passcode pane that appears (see Figure 3-12), enter a passcode using
    the numeric pad. Enter the number again when prompted.

    5. Press the Home button and tap an to open it.

    6. Press the Home button three times.'
