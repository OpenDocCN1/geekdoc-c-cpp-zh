- pgno: 430
  md: '# Playing Your Presentation 413


    Are you canvassing door to door for a politician or a cause? Again, a Keynote
    presentation of perhaps half a dozen slides can present the issue with pictures,
    text, and diagrams. You can even have a printed version of the presentation out
    for people to ponder after you''ve gone. You can fill in the gaps and answer questions,
    but it''s certainly more effective than knocking on a door and asking whether
    you can come in and set up a computer and projector.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_430_0.png)


    One great advantage of nanopresentations is instead of talking to a large group
    that''s sitting in the dark, you''re presenting to a few sitting around a table
    or on a sofa with you. People generally don''t have enough time to doze off or
    become distracted.


    # Playing Your Presentation


    After prepare all the elements in your presentation, little remains to do when
    you want to play it. Tap the Play button at the right side of the toolbar to begin
    playing. The transitions and builds happen automatically.


    Tap to advance to the next slide. If you''re using an external monitor, tap the
    Next and Previous buttons. (Refer to Figure 4-18)


    If your presentation contains hyperlinks, simply tap to open them in Safari on
    iPad. (Keynote automatically detects hyperlinks by the presence of an Internet
    schema, such as `http://`)


    The Keynote has a built-in laser pointer, so to speak: Tap and hold the iPad screen,
    and a red pointer appears on the display with a set of pointers that use other
    colors. If you''re using an external display or projector, it appears on that
    display as well.) You can then emphasize parts of the slide to the audience. One
    advantage of this method is that you can continue to face your audience while
    pointing out details on the slides. The alternative is to walk over to the slide,
    turn your back on the audience, and point — not an outstanding idea. (Audience
    members sometimes sneak out the moment you turn your back.)


    | Book IV |

    | Chapter 4 |


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_430_1.png)


