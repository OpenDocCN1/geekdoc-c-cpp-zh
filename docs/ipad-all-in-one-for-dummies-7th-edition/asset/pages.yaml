  md: '# 148 Making Network and Bluetooth Settings


    # Turning system sounds on and off


    In my experience, people are either big fans or big haters of system sounds on
    computers. You know, sounds like that annoying chime when a new email arrives?
    iPad also makes sounds when certain events occur, if you want it to. You can turn
    on and off the following system sounds:


    +   - Ringtone

    - Text Tone

    - New Mail

    - Sent Mail

    - Tweet

    - Facebook Post

    - Calendar Alerts

    - Reminder Alerts

    - AirDrop

    - Lock Sounds

    - Keyboard Clicks


    To turn these off or on, or to choose different system sounds, from the Settings
    pane, tap Sounds and use the On/Off switch for the last two settings, or choose
    None or a different sound for any of the others.


    You can control the Apple Push Notification Service, used to push alerts to your
    Apple device, via the Notifications category in Settings. This lets you control
    the alerts sent to you. You can turn alerts on and off, for example, which can
    save a bit of your battery life. You can also control alerts in a specific app''s
    settings.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_165_0.png)


    # Making Network and Bluetooth Settings


    You can make a few settings for your networks and Bluetooth: ones for private
    networks (VPNs) under General settings, ones for Wi-net, and finally, settings
    for 3G/4G network cellular data.


    You may read in the news that your iPad and iPhone save a record of every move.
    If you don''t like that idea, plug your iPad or iPhone into your computer and,
    click your device. Then, with the Summary tab selected, click the Encrypt iPhone/iPad
    Backup option. Apple can find your phone if you enable Find My iPhone, but Apple
    can''t view your backed up information in iCloud!


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_165_1.png)


