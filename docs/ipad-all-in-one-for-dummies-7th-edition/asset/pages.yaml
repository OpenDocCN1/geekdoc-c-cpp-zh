  md: '# Enabling Autodownloads of Purchases from Other Devices 179


    # Enabling Autodownloads of Purchases from Other Devices


    With iCloud, after you set up an iCloud account, either during the initial setup
    of your device or through iPad Settings, you can make a purchase or download free
    content on any of your Apple devices that have been set up for auto-download,
    and you can have these automatically copied onto or any of your Apple devices.
    To enable this auto-download feature on iPad, follow these steps:


    +   1. Tap Settings on the Home screen.


    To use iCloud, first set up an iCloud account. See Book I, Chapter 5 for detailed
    coverage of iCloud, including setting up your account.


    +   2. Tap iTunes & App Store.


    +   3. In the options that appear, the On/Off switch to turn on any category of
    purchases you want to auto-download from your iPad devices: Music, Apps, or Books
    (see Figure 1-11).


    At this point, Apple doesn''t offer an option of auto-downloading video content
    using these settings, probably because video is a memory and bandwidth hog. You
    can always download video to your iPad through the iTunes App store or sync to
    your computer using iTunes to get the content or through the iTunes U for educational
    content.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_196_0.png)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_196_1.png)


    Figure 1-11: Authorize purchases from an app by turning it on.'
