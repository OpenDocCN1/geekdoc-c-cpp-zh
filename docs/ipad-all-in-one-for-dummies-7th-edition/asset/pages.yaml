    # Troubleshooting Your iPad


    Everyone wants to think that his or her iPad is a perfect magical machine, unburied
    with the vagaries of crashing and system software bugs, but that''s not always
    the case.


    Here are some common issues that come up with your iPad, along with ways to deal
    with them.


    # Dealing with a unresponsive iPad


    If your iPad goes dead on, it''s most likely a power issue, so the first thing
    to do is to plug the Lightning to USB Cable (or Dock Connector to USB Cable for
    pre-fourth-generation iPads) into the 10W USB Power Adapter, plug the 10W USB
    Power Adapter into a wall outlet, plug the other end of the Lightning to USB Cable
    (or Dock Connector to USB Cable) into your iPad, and charge the battery.


    Another thing to try — especially if you think that an app might be hanging up
    the iPad — is to press the Sleep/Wake button for a few seconds. Then press and
    hold the Home button.


    You can always try the old reboot procedure, which in the case of an iPad means
    the Sleep/Wake button on the top until the Slide to Power Off control displays.
    Drag the slider to the right to turn off your iPad. After a few


