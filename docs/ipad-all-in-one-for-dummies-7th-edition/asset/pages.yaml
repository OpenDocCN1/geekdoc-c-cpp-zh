    # Getting up close with AirDrop


    To use the AirDrop feature, you need to be near another AirDrop–enabled device
    (I''m talking within a few feet). Then, as in the previous example you, you can
    use the Share power from within an. (Refer to Figure 1-3) Tap AirDrop in that
    power, and any available devices in your vicinity appear. Tap the device you want
    to share, and the content appears on the other device when the recipient accepts
    it.


    That''s it!


    # Going through the cloud


    In addition to iCloud, there are other cloud-based options for sharing files.
    Apps such as Dropbox and FileFly, and Easy Wi-Fi Sharing and Viewing (a wireless
    file-sharing app) allow you to upload files to an online site, using an app download
    to your iPad, access and view those files. Some of these options provide more
    flexibility for managing your files than iCloud does.


    Take a look at how this works with Dropbox, which is a good, free, file-sharing
    app that provides one of the easiest ways to get any and all files to and from
    your iPad to any and all other computers and devices.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '# 422 Sharing Files


    Dropbox is a cloud-based service that allows you to store your files on its servers
    and access them on any device that''s connected to the Internet. (Figure 1-5 shows
    what the Dropbox interface looks like if you''re surfing Safari.) It directly
    supports (in the form of dected software) OS X, Windows, Linux, Android, BlackBerry,
    and of course, iOS.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_439_0.png)


    **Figure 1-5:** Accessing Dropbox through Safari.


    When you''re on a computer, Dropbox works like any other folder on your hard drive.
    When you open it with your browser, you have instant access to all your files.
    When you drop something into your folder, it''s copied to the company''s servers,
    and pushed out to anywhere you''ve set up with your Dropbox account, including
    your iPad or others you''re sharing folders


    After you download the Dropbox app, you can open a file on iPad and print or view
    it, but not edit it, unless you choose the option of opening the document with
    an app you have on your iPad that be a logical fit. Figure 1-6 shows the iCloud
    app for iPad with shared photos from iPad''s Photos app available; this feature
    is offered to you the first time you log in to Dropbox from the Dropbox app on
    your iPad.


    Dropbox folders can be selectively shared with other Dropbox users, making it
    a great tool for any sort of collaborative project.'
  merge: -1
  img_proc: true
- pgno: 440
  md: "# Setting Up Home Sharing 423\n\n![](img/2a8a8d89daeb1b3896bd38ebf18af126_440_0.png)\n\
