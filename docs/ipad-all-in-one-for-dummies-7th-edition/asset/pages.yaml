  md: '# 334 Presenting the iWork for iOS Apps


    > REMEMBER In this chapter, the focus is on the three iWork for iOS apps, including
    how to use their common interface elements. You also find a summary of differences
    between iWork for iPad and iWork for Mac in those cases where it matters.


    # Presenting the iWork for iOS Apps


    iWork provides applications that are office oriented — so-called productivity
    applications. The iWork office suite includes three apps that are similar to Microsoft
    Office applications (but way cooler, I think):


    +   * Pages: A word-processing and page-layout application (similar to Microsoft
    Word)

    * Numbers: A spreadsheet application (similar to Microsoft Excel)

    * Keynote: A presentation application (similar to Microsoft PowerPoint)


    All three apps are optimized for those iPad models with a brilliant Retina display,
    plus they have new templates that you can base your presentation.


    Each program that you download from the App Store on any new iOS device is free.
    iCloud automatically migrates the apps and documents you create with these other
    Apple devices running iOS. (See Book I, Chapter 5, for more information.)


    In the following sections, you take a quick look at these three iWork for apps,
    all of which have been upgraded with the release of iOS 8.


    # Pages


    For many people, word processing is the core of an office suite. In, many people
    don''t get beyond it. Pages for Mac adds a big desktop publishing to word processing
    in that it also allows you to create layout documents. The type of structure that
    you see in newspapers and magazines — articles don''t just flow one after the
    other. Instead, an article on Page 1 may be continued on Page 4, and another article
    on the first page may be continued on Page 8. Also, objects as photos can be anchored
    to associated text, or placed in specific positions on a page, and they don''t
    move around the text as it is added or deleted.


    iWork provides you with a variety of sophisticated tools to create Pages documents.
    These include advanced font handling, color, tables, and charts, as well as the
    ability to place QuickTime movies and hypertext links in your'
