  md: '# # Chapter 1: Introducing the iWork

    for iOS Apps for iPad


    # In This Chapter


    +   * Getting familiar with the iWork for iOS apps

    * Using an iWork app with iCloud

    * Discovering the basics of the iWork apps

    * Improving documents by adding photos and images

    * Managing your iWork documents


    Word-processing and spreadsheet applications are among the most widely used software
    products; presentation software is not far behind, along with programs such as
    graphics and database editors. Having started from scratch on the hardware side
    and then the operating-system side, Apple employees started dreaming about what
    they could do if they were to start scratch to write modern versions of word-processing,
    spreadsheet, and presentation programs. They knew they''d have to follow one of
    their advertising campaigns: Think Different


    The result was iWork suite of applications (a collection of applications that
    can work together) for the Mac — Keynote, Pages, and Numbers — that were developed
    by one over a period of several years.


    Today, iWork is a terrific suite of programs that have become a trio of dynamite
    apps for iPad and iPhone, and all the apps are now free when you buy a new iOS
    device.


    in addition, Apple introduced iWork for iCloud in 2013, so you can work in very
    similar interfaces online using your browser. All documents you create in these
    versions of iWork apps are stored both in iCloud and on your devices. (For more
    about iWork for iCloud, go to www.apple.com/iWork-for-iCloud).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_350_0.png)'
