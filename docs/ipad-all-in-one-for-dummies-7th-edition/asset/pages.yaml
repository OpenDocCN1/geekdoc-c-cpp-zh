  md: '# # Chapter 3: Watching Videos


    # ## In This Chapter


    +   - Finding and playing movies, podcasts, or TV shows with Videos

    - Turning on closed-captioning

    - Going to a movie chapter

    - Deleting a video item from iPad

    - Sharing video content


    In this chapter, I cover the preinstalled app called Videos. The Videos app is
    a player with which you can watch downloaded movies and TV shows, as well as media
    you have synced from iCloud or your Mac or PC.


    If you have an iPad that can run iOS 8, you can take advantage of the rear-facing
    Sight camera with the ability to record video in 720p (high definition) and video
    stabilization to prevent wooobbly video. On iPad/iPad mini to watch videos with
    super-high resolution, which simply means they''ll look very, very good.


    If you like to view things on a bigger screen, you can use iPad''s Air technology
    and Apple TV, a device that will cost you $99, to sync your iPad and photos to
    a TV that supports HDMI.


    Note that iPads that run iOS 7 or later sport two video cameras which you can
    use to capture your own videos. By purchasing the iMovie app (a scaled-down version
    of the longtime on Mac computers), you add the capability to edit those videos.
    You find out about both of these features in Chapter 4 of this minibook.


    In this chapter, I explain all about watching, rating, deleting, and sharing video
    content from a variety of sources. You might want to refer to Chapter 1 in this
    minibook first to purchase or download one of many free TV shows or movies you
    can practice with.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Finding Videos


    Note that you can get video content through the iTunes Store and some third-party
    companies that support iPad, including Netflix and ABC TV. You can also use an
    app such as Air Video to send content from your Mac or PC to your iPad via a wireless
    connection, or use the EyeTV app from your Mac to send live TV or recordings.
    Some of the content you find is free, and some movies and videos will cost you
    a few bucks.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_215_0.png)


    You can also view videos from a Home Sharing–iTunes library over a home network,
    which can really save space on your iPad because the content can be stored on
    another device (such as a hard drive attached to your Mac or PC). Turn on Home
    Sharing in the Video category of Settings on your iPad.


    This chapter focuses mainly on the bundled Videos app, but you should also note
    that more and more online content providers are making it possible to view videos
    on their sites. For example, you can go to Flickr and use HTML5 player for video
    playback. Also, using Family Sharing, you have access to videos purchased by any
    Family Sharing group.


    See Chapter 1 in this minbook for about buying or renting movies or TVs using
    the iTunes Store and setting up a Family Sharing account. For information about
    shooting your videos, see Chapter 4 in this minbook.


    # Playing Movies or TV Shows


    Did you realize that your iPad is a miniature home entertainment center? The built-in
    Videos app can play TV shows and movies.


    Also, note that you can stream video content from your iPad to play on TV. By
    using an app such as Samsung TV Media Player, and you can fling video content
    playing on your iPad to your Samsung Smart TV.


    When you first open the Videos app, you may see relatively blank screens with
    a note that you don’t have any videos and a link to the iTunes Store. After you
    purchase TV shows or movies, you see tabs for the different kinds of content you
    want. Use the steps in Chapter 1 of this minbook to download video content to
    your iPad. After you download content, use these steps to work with Video’s familiar
    playback controls to play:


    +   1. **Tap the Videos app on the Home screen to open the application.**

    2. **On a screen like the one shown in Figure 3-1, tap the appropriate category
    at the top of the screen (Movies, Rentals, or TV Shows, depending on the content
    you''ve downloaded).**'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Playing Movies or TV Shows 199


