    # Making Additional Vision Settings


    Several Vision features are simple on/off settings, so rather than giving you
    the steps to get those settings repeatedly, I provide this useful list of additional
    features that you can turn on or off after you tap Settings>General>Accessibility:


    +   * Zoom: The Zoom feature enlarges the contents displayed on the iPad screen
    when you double-tap the screen with three fingers. The Zoom feature works almost
    everywhere in iPad: in Photos, on web pages, and on Home screens, in your Mail,
    and in Videos — give it try!

    * Invert Colors: The Invert Colors reverses colors on your screen so that backgrounds
    are black and text is white.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_68_2.png)


    The Invert Colors work well in some places and not in others. For example, in
    the Photos application, pictures appear almost as photo negatives. Your Home screen
    image will likewise look a bit strange. However, don''t even think about playing
    a video with this feature turned on! If you need help reading text, Invert Colors
    can be useful in several applications.


