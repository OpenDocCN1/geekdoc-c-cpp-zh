    # # Saving an Image to Your Photo Library


    Have you found a photo that you like online? Maybe your BF''s Facebook image or
    a picture of your upcoming vacation spot? You can easily save images you find
    online that are not protected from copying to the iPad photos library. Here''s
    how:


    +   1. Display a web page that contains an image you want to copy.

    2. Press and hold the image.

    3. Tap the Save Image option (see Figure 6-16).


    The image is saved to the Photo Library in the Photos app.


    Be careful about copying images from the Internet and using them for business
    or promotional activities. Most images are copyrighted, and you may be violating
    copyright if you use an image in (say) a brochure for your association or a flyer
    for your community group. Note that some search engines offer the option of browsing
    only for images that aren''t copyrighted.'
