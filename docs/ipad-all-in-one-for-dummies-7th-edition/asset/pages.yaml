  md: '# Formatting Email


    You can apply some basic formatting to email text. You can use bold, underline,
    and italic formats; also, you can indent text using the Quote Level feature. To
    use the Quote Level feature from within your emails, you need to make sure it''s
    on. Settings, tap Mail, Contacts, Calendars; next, tap Increase Quote Level and
    tap the Increase Quote Level On/Off switch. This allows you to increase and decrease
    how forwarded or reply text is indented. Follow these steps to apply formatting:


    +   1. Press and hold the text in a new or forwarded message and choose Select
    or Select All from the menu that appears to select a single word or all the words
    in the email.


    Note that if you select a single word, handles appear that you can add adjacent
    words to your selection.


    +   2. To apply bold, italic, and underline formatting, tap the BIU button (Figure
    13).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_145_0.png)


    > Figure 7-13: Use BIU to add standard styles or emphasis, such as italicized
    book titles.


    +   3. In the pop-up that appears (see Figure 7-14), tap Bold, Italics, or Underline
    to apply the respective formatting.


    +   4. To change the indent, tap at the beginning of a line and then tap Quote
    Level (refer to Figure 7-13).


    +   5. Tap Increase to indent the text or Decrease to move indented text towards
    the left margin.'
  merge: -1
  img_proc: true
