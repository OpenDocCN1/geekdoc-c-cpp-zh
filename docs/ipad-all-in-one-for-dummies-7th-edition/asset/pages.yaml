  md: '# 162 Finding a Missing iPad


    Finally, here are a few useful non-Apple discussion forums that may provide some
    answers:


    +   - MacRunors at http://forums.macrumors.com/forumdisplay.php?f=137


    +   - The iPad Guide discussions at www.theipadguide.com/forum


