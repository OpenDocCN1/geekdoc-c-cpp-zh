- pgno: 218
  md: '# Turning on Closed-Captioning 201


    # Watching non-iTunes videos


    Are you limited to iTunes content on iPad or viewing your downloaded content on
    the smaller screen? Not at all. You can connect iPad to television, so can watch
    videos on the more vision-friendly larger screen. To do this, you must have the
    Digital AV Adapter at the Apple Store. The Digital AV Adapter is a $39.95 accessory.
    Apple TV costs $99. You also need any other appropriate cables for your TV to
    complete the connection. (Or you can use AirPlay via an Apple TV).


    Note that iPad supports the following video formats: H264 video up to 1080, 30
    frames per second; MPEG-4, up to 2.5 Mbps, by 480 pixels, 30 frames per second;
    and Motion JPEG (M-JPEG), up to 35 Mbps, 1280 by 720 pixels, 30 frames per second.
    You can use conversion software such as Mac AVI to iPad Video Converter to be
    able,


    edit, and play AVI movies on your. You can also stream with Air Video Live Conversion
    or use the free Handrake to convert to an iPad-friendly format.


    In addition, you can rip Blu-ray disc content to an iPad-compatible format and
    transfer the content by syncing to your computer using iTunes. You can use the
    Blu-ray Rip Maker for here: www.aunsoft.com/blue-ray-rip-mac. You can use the
    free Aiseoft www.aiseoft.com/blue-ray-ripple to handle the transfer.


    Finally, check out the Air Video app from InMethod. Using this app, you can stream
    content to your iPad, convert content, or save content to iTunes, which you can
    sync to your You.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_218_0.png)


    Book II Chapter 3


    Watching Videos


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_218_1.png)


    You can set up widescreen viewing options in the Videos section of Settings. For
    more about using Settings, see Book I, Chapter 8.


    Note that if you watched a video and stopped it away, the next time you open the
    video in iPad, it opens, by default, at the last location that you were viewing.
    To start a video from the beginning, just as most players, simply tap and drag
    the circular button on the Progress bar all the way to the left. You can also
    change the default setting from starting where you left off to starting from the
    beginning in iPad''s settings under Video.


    # Turning on Closed-Captioning


    If you have hearing challenges or are a fan of foreign languages, you''ll be glad
    to know that iPad offers support for closed-captioning and subtitles. This feature
    requires that content supports closed-captioning (not all shows or movies do)
    and that you go to Settings to turn the feature. Look for the video you record
    using the iPad camera has that capability.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
