- pgno: 407
  md: '# 390 Working with New Tables


    The labels for the rows on the form are drawn from the labels of the columns on
    the tables. You don''t have to label the columns on your tables, but it makes
    creating forms and calculations much easier if you do.


    You can use the tab to go to the form and enter data or browse it. The four buttons
    at the bottom of a form let you (from left to right) go to the previous record
    (row), add a new row, delete the current row, or go to the next row.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_407_0.png)


    You can delete a row by forming the form''s tab and then deleting, but you can''t
    duplicate a form as you can duplicate a sheet tab.


    # Working with New Tables


    Tables contain the data for spreadsheets and charts, so it may be a surprising
    if you''ve reached the end of the chart without creating a single table. That''s
    because you have numerous templates to work with. You don''t have to start from
    the beginning; instead, you can start further along in the development process.


    Tables can be relatively small and focused. You can use formulas to link them,
    and that''s a much better strategy than putting every single piece of data into
    an enormous spreadsheet.


    Tables aren''t simply repositories of data; they also drive charts. When you''re
    organizing data in a table, you may want to consider how to transform it to create
    the kind of charts you want.


    As you''re planning the structure of your tables and sheets, pay attention to
    the moments when you realize that you add more data to a table. Ask whether you
    truly need more data in that table or a table that can be linked to the first
    table by calculation.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_407_1.png)


    A table often has a header row above its data; the row usually contains titles
    but also contains calculations such as sums or averages. Numbers tables have several
    header rows. A column to the left of the table also has the same functionality
    — it''s a header column. People often believe that a header appears only at the
    top, but in this usage, it appears wherever side is appropriate.


    # Creating a new table


    Follow these basic steps to create a new table:


    +   1. Go to the sheet you want the table to be on.


    It can be an existing sheet from a template or a new sheet you create just for
    the table. Remember that tables can be cut and pasted, so you have a second (and
    third and fourth and so on) to determine the sheet for your table.'
  merge: -1
  img_proc: true
- pgno: 408
  md: '# Working with Tables 391


    +   2. Tap the Insert Objects button (the + button) in the toolbar at the top
    of the window.


    The Insert Objects popover opens.


    +   3. Tap the Tables tab.


    +   4. Swipe from one page to another to find the table layout you you like.


    Though you can change any element in the table layout, start with one close to
    what you want to end up.


    There are five pages of templates — each of the five pages has the same layouts
    with different color schemes. This list describes them from the upper-left corner,
    as shown in Figure 3-28:


    +   * Header row and a header column at the left: This is one of the most common
    table layouts.


    +   * Header row at the top: This works well for a list as students in a class.


    +   * No header row or header column: Before choosing this blank spreadsheet,
    headers and titles for the tables will make your spreadsheet more usable. You
    can add (delete) them later and change them, but take a few moments to identify
    the table along with its rows and columns as you create it.


    +   * Header and footer rows and a label column: This works well for titles at
    the top and left for some or other calculations at the bottom.


    +   * Check boxes in the left column: This option makes a great list of things
    to do.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_408_0.png)


    Figure 3-28: Create a new table.


