- pgno: 173
  md: '# Extending your iPad''s battery life


    The much-toutted ten-hour battery life of the iPad is a wonderful feature, but
    you can take some steps to extend that battery life further. You can estimate
    how much battery life you have left by looking at the battery icon in the far-right
    end of the status bar at the top of your screen. Here are a few tips to help that
    little icon stay up:


    +   Use a wall outlet to charge. It can vary depending on your computer model,
    generally when connected to a recent Mac computer, iPad will charge slowly; however,
    some PC connections don''t provide enough power to prevent battery drain. Even
    so, the most effective way to charge your iPad is to plug it into the wall outlet
    using the Lightning to USB Cable (or Dock Connector to USB Cable for pre-fourth-generation
    iPads) and the 10W USB Power Adapter that came with your iPad. (See Figure 9-3.)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_173_0.png)


    Figure 9-3: The provided cord and power adapter.


    +   Turn off the iPad. The fastest way to charge the iPad is to turn it off while
    charging it.


    +   Consider letting your iPad run out of battery charge once a month and then
    recharging to prevent a memory effect that can have an effect on your lithium-ion
    battery life.


    +   Avoid USB ports on keyboards. Your battery may lose some power if you leave
    it connected to the USB port on a keyboard or other device.


    The best way to charge your iPad is with the included cord plugged into an electrical
    outlet. Using your computer to charge it can take a great deal longer. There are
    also power strips and adapters now available that have USB ports so that you can
    charge several USB devices at one time.


    +   Limit the screen''s impact on the battery. Turn off the screen when not in
    use because the display eats up power. Also, reduce the screen brightness in Settings
    to save power.'
  merge: -1
  img_proc: true
