    The Safari browser opens with the web page displayed.


    You aren''t returned directly to Contacts after you follow a link to a website.
    You have to tap the Home button and then tap the Contacts app icon to reopen the
    application. Or you can use the multitasking feature to get back to Contacts by
    double-tapping the Home button and choosing Contacts from the icons that appear
    along the bottom of the screen. However, if you have the Multitasking Gestures
    turned on in the General pane of Settings, you can do the four-finger swipe to
