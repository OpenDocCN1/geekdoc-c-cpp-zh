- pgno: 444
  md: '# Chapter 2: Making Notes


    # In This Chapter


    +   - Opening a blank note and entering text

    - Creating a new note

    - Finding, sharing, and deleting a note

    - Displaying the Notes List

    - Printing a note


    Notes is a preinstalled app that you can use to do everything from jot-down notes
    at meetings to maintaining to do-lists. It isn''t a robust word processor like
    Apple Pages or Microsoft Word by any means, but for taking notes on the fly or
    dictating using the Dictation feature available on the original iPad or iPad 2
    while you sit and sip a cup of tea on your desk, it''s a useful tool.


    In this chapter, you discover how to enter and edit text in Notes and notes by
    navigating among them, searching for content, sharing, deleting, and printing
    them.


    # Making Notes


    Notes are pretty simple to create — kind of like-grabbing a sticky notepad, jotting
    down your thoughts, pulling off the note and sticking it somewhere, and starting
    to write the next one. You can use Siri to create a note and the Dictation feature
    to speak your notes. You can use the included tools to select, cut, copy, and
    paste. Notes are saved for you in a list of notes so that you can easily find
    the one you need (covered in the "Finding" section, later in this chapter) and
    they can be synced across iOS devices and your Mac.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_444_0.png)


    # Opening a blank note and entering text


    If you have no notes, Notes opens with a new, blank note displayed. (If you have
    used Notes before, it opens to the last note you worked on. If that''s the case,
    tap the New Note button in the top-right corner to create a new, blank note.)'
  merge: -1
  img_proc: true
- pgno: 445
