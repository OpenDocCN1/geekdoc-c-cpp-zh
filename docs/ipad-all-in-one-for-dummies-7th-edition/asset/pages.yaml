  md: '# # Using Safari Reading List 105


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_122_0.png)


    # # Using Safari Reading List


    Remember when you were in school and had lots of reading assignments to keep track
    of all your classes? Well, after graduation, reading lists don''t go away; whatever
    you''re staying up-to-date in your chosen field or just keeping up with the latest
    articles and information, being able to assemble a list of online reading can
    be a great help. The Safari Reading List provides a way to save content you want
    to read at a later time so you can easily visit it.


    You can save not only links to sites but also the pages themselves, which allows
    you to read the content even when you''re offline.


    To use Reading List, follow these steps:


    +   1. With a site displayed that you want to add to your Reading List, tap the
    Share button.

    2. On the menu that appears, tap Add to Reading List.

    nThe site is added to your list.

    3. To view your Reading List, tap Bookmarks and then go to the Reading List tab
    (the eyeglasses icon).

    4. In the Reading List that appears (see Figure 6-12), tap the content you want
    to revisit and resume reading.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 106 Reading with Safari Reader


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_123_0.png)


    **Figure 6-12:** It''s easy to find where you left off with Safari''s Reading
    List.


    If you want to see both the Reading List material and the material you haven''t
    read, tap Show All near the bottom of the Reading List tab. To just see the material
    you haven''t read, use the Show Unread button (return to Figure 6-12). Be aware,
    that with websites that change content frequently, the content you placed on your
    Reading List may not be available at a later date.


    To save an image on your Reading List, tap and hold the image until a menu appears,
    and then add to Reading List (this is available only for some images).


    To delete an item, with the Reading List displayed, swipe left or right, and the
    Delete button appears. Tap this button to delete the item from the Reading List.


    # Reading with Safari Reader


    Reading content on the web isn''t always user friendly. The ads, sidebars, and
    various distractions can take away from your reading experience. Luckily, the
    Safari Reader feature gives you an e-reader type of experience right within your
    browser, removing other stories and links as well as those distracting. Not all
    websites support the Reader.


    +   1. Tap the Reader button (see Figure 6-13) on the left side of the Search/Address
    field when you''re on a site where you''re reading content such as an article
    that supports the Reader feature.


