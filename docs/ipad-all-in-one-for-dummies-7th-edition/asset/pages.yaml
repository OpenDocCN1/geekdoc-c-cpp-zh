- pgno: 129
  md: '# 112 Making Private Browsing and Cookie Settings


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_129_0.png)


    **Figure 6-19:** Use this email form to send an image and message.


    When entering a username or password in any online form, such as an email message
    or search field, you can take advantage of Safari''s AutoFill feature. Turn this
    on by going to Settings and tapping Safari. Safari can then use information from
    iPad''s Contacts app as remember names and passwords that you''ve entered before
    for options for completing text entries as you type.


    To tweet the link using your Twitter account, in Step 2 of the preceding steps,
    choose Tweet, tweet your message in the form that appears, and then tap Send.
    For more about using Twitter with the iPad, see Book II, Chapter 5. If you have
    a fourth-generation or newer iPad, you can choose AirDrop in the same menu to
    share with someone in your immediate vicinity who has an AirDrop-enabled device.


    A four-finger swipe from left to right on your screen gets you back to Safari
    from either Mail or Twitter.


    # Making Private Browsing and Cookie Settings


    Apple has provided some privacy settings for Safari that you should consider.
    Private Browsing automatically removes items from the download list, stops Safari
    from using AutoFill to save information to complete your entries in the Address/Search
    field as you type, and erases some browsing history. These features can keep your
    activities more private. The Accept Cookies settings allow you to stop the downloading
    of cookies (small files that document your browsing history so that you can be
    recognized by a site the next time you go to or within site) to your iPad.


    You can control both settings by choosing Safari in Settings. Tap to turn the
    Do Not Track feature on or off (see Figure 6-20). Tap the arrow to Block Cookies
    and choose to never save cookies, always cookies, or save cookies only from the
    current website or visited third-party and advertiser sites (the default setting).


    www.it-ebooks.info'
  merge: -1
  img_proc: true
