    8. Don''t like what''s playing? Tap the Back to Library button (the < icon) in
    the top-left corner to return to the Playlist list, or tap the Album List button
    in the top-right corner to show other tracks in the album and make another selection.


    You can use Siri to play music hands free. Just press and hold the Home button,
