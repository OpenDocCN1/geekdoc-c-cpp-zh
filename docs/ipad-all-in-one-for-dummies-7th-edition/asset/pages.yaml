  md: '# # Chapter 4: Getting the Most Out of iPad Cameras and FaceTime


    # ## In This Chapter


    +   - Looking good in photos

    - Exploring Photo Booth

    - Taking videos

    - Making video calls with FaceTime


    With its gorgeous Retina screen (from third-generation iPads on), iPad is a natural
    for viewing photos and videos. It supports most common photo formats, such as
    JPEG, TIFF, and PNG. You can shoot your photos and videos by using the built-in
    cameras in iPad with preprogrammed square or panorama modes, and edit your images
    using filters that are new with the Camera app comes with iOS 7. Additionally,
    you can sync photos from your computer, iPhone, or digital camera, and save images
    online or receive them by your iPad.


    If you have the third-generation or later iPad, you have a built-in Sight for
    your rear-facing camera. This improvement on previous iPad cameras is a 5-megapixel
    beauty with an illumination sensor that adjusts for whatever lighting is available.
    Face detection focuses across as many ten faces in your pictures. The video camera
    option offers 1080p HD (high-definition video) with video stabilization that makes
    for some shaking as you hold the device to take videos.


    When you have photos to play with, the Photos app lets you organize photos from
    the Camera Roll and view photos in albums, one by one, or in a slideshow. A new
    feature lets you view photos by the year they were taken, with images divided
    into collections by the location or time you them. You can also AirDrop, email,
    message, post to Facebook, or tweet a photo to a friend, or print it. And if you
    like to play around with photo effects, you''ll enjoy the photo-editing features
    as well as the preinstalled app, Photo Booth.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_224_0.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 208 Working with Photos


    If video is more up your ally, in this chapter, you also discover how to use the
    video cameras in iPad. For those who want to share videos of themselves and their
    surroundings with others, I cover using the video cameras along FaceTime to make
    video calls.


    # Working with Photos


    iPads (except for the original iPad) come with cameras—two, to be exact. These
    cameras allow you to capture video and photos. And because one camera is front-facing
    and the other is rear-facing, you can switch between them to capture images of
    yourself holding the iPad or images of what you''re looking at.


    On iPad, the front-facing camera captures high-definition video at 720p; the rear-facing
    camera captures high-definition video at 1080p.


    When you capture photos, they appear in the Photos app''s Camera Roll, where you
    can view them, email them, and so on. (See Chapter 6 in this-book for more about
    using the Photos app.) The Photo Streams feature lets you share groups of photos
    with people using iCloud on an iOS 6 device or later, or on a Mac computer with
    the Mountain Lion OS or later installed, or on a PC via iCloud. (See Book V, Chapter
    1 for more about sharing files using iCloud.)


    The cameras in the iPad are just being used, so get started!


    # Taking pictures with the iPad camera


    When you use an iPad camera, you can switch between a standard camera and a video
    camera, and choose which to use the front or rear-facing camera. To work with
    the standard camera to take pictures, follow these steps:


    +   1. Tap the Camera app icon on the Home screen to open the app.

    If the orange-highlighted word in the row of words before the Capture button (see
    Figure 4-1) Video, slide up to set Photo (the still camera) as the active setting
    rather than video.

    2. Set the Square option using the same slider control below the Capture button.


    This setting lets you create square images like those you see on the popular Instagram
    site.'
  merge: -1
  img_proc: true
