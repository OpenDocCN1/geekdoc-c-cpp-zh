    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_454_1.png)


    **Figure 2-12:** Go ahead; delete whatever you don''t need with a tap of this
    button.


    > Notes is a nice little app, but it''s limited. It offers very few formatting
    tools and only one font for your text. (Actually, you can, but can''t paste pictures
    into it—what appears is the filename, not image.) So if you''ve made some notes
