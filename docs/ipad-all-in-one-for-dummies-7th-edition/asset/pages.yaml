  md: '# 200 Playing Movies or TV Shows


    # 4. Tap the Play button.


    For TV Shows, tap the Episodes tab to display episodes with a play button for
    each; for Movies, the Play button appears no matter which tab is selected. Tap
    the Play button, and the movie or TV show begins playing. (If you see a cloud
    button instead of a Play button, tap it to download the content from iCloud).


    The progress of the playback displays in the Progress bar, showing how many minutes
    you''ve viewed and how many remain (see Figure 3-3). If you don''t see this bar,
    tap the screen to display it briefly, along with a set of playback tools at the
    bottom of the screen.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_217_0.png)


    Figure 3-3: Use the standard playback controls to play your content.


    # 5. With the playback controls displayed, take any of these actions:


    +   * Tap the Pause button to pause playback.

    * Tap either Go to Previous Chapter or Go to Next Chapter to move to a different
    location in the video playback if the video supports chapters.

    * Tap the circular button on the Volume slider and drag it to left or right to
    decrease or increase the volume, respectively.

    * Tap the circular button on the Progress bar to move to another spot in the video.


    # 6. To stop the video and return to the information screen, tap the Done button
    to the left of the Progress bar.'
