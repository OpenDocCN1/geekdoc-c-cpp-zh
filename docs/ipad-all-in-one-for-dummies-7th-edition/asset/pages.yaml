  md: '# # Chapter 7: Using Your iPad as an E-reader


    # ## In This Chapter


    +   * Discovering how iPad differs from other e-readers

    * Finding and buying books at iBooks

    * Navigating a book

    * Working with bookmarks, highlights, and the dictionary

    * Organizing books in collections

    * Experiencing periodicals with Newsstand


    Apple has pushed the iPad as a great e-reader, so though it isn''t a dedicated
    e-reader device like the Amazon Kindle Paperback, you won''t miss out on this
    cool functionality.


    Apple''s preinstalled iBooks app is what turns your iPad into an e-reader. iBooks
    is an application that enables you to buy and download e-book sources from Apple''s
    iBooks Store as well as read PDF files. You can also use several other e-apps,
    for example Kindle or Stanza, to download books to your iPad from a variety of
    online sources, such as Amazon and Google, so you can read to your heart''s content.


    Another preinstalled app, Newsstand, has a similar look and feel to iBooks, but
    its focus is on subscribing and reading magazines, newspapers, and other periodicals.


    In this chapter, you discover the options available for reading material, and
    I will tell you how to buy books and subscribe to periodicals. You also find out
    how to navigate a book or period and adjust the brightness and type, as well as
    how to search books and organize your iBooks and Newsstand libraries.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_266_0.png)'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# 250 Discovering How the iPad Differs from Other E-readers


    # Discovering How the iPad Differsnfrom Other E-readers


    An e-reader is any electronic device that enables you to download and read books,
    magazines, PDF files or newspapers, as well as documents such as manuals or reports.
    Some e-readers use E Ink technology to create a paper-like reading experience.
    These devices, such as Kindle Paperwhite, are portable and dedicated only to reading
    electronic content.


    The iPad is a bit different: As you know, it''s not used for only reading books,
    and it allows you to download other e-reader apps such as Kindle in addition to
    the preinstalled i apps. Also, the iPad doesn''t offer the paper-like reading
    experience — you read from a color screen (though you can adjust the brightness
    of the screen and change its background color).


    When you buy a book or magazine (or get one of many free publications), it downloads
    to your iPad in a few seconds using your Wi-Fi or 3G/4G connection. After you
    use your e-reader app and some content, iBooks offers plenty navigation tools
    to move around an electronic book, all of which you explore in this chapter.


    iBooks contains tools for reading and interacting with book content. The development
    of books with interactive content has so far been targeted by the textbook market,
    and you can create and publish your own interactive textbooks using a Mac app
    called iBooks Author.


    # Finding and Buying E-books


    Before you read books or other publications, you have to get your iPad''s hands
    on them (so to speak). This involves downloading e-reader software and then using
    it or online stores to buy publications. By starting introducing you to iBooks,
    the e-reader that came installed on your iPad.


    You can also buy on your computer and sync your purchases to your iPad using iTunes
    or iCloud. See Book I, Chapter 5 for more about this topic.


    # Finding books at the iBooks Store


    You can shop using Apple''s iBooks Store by tapping the iBooks app on the Home
    screen to open it.


    If you become addicted to iBooks, consider placing it in the iPad Dock for quick
    access from any Home screen. To do this, tap and hold the app till all apps judge,
    then tap and drag the iBooks app to the Dock. Press the Home button, and the jiggling
    stops.


    The iBooks Library opens (see Figure 7-1). The first time you use it, you see
    a bookshelf with no books on it. (If you don''t see the bookshelf, tap the My


