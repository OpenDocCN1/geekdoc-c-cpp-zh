    have a couple of options. One way is to use the Pages-word processor for iPad,
    which comes with newer iPads, and copy your note (using the Copy and Paste feature
    discussed earlier in this chapter). Alternatively, you can send the note to yourself
    in an email. Open the email and copy and paste the text into a fully-fledged word
    processor, and you''re good to go.


    > If you want to move beyond Notes and use a note-taking app that lets you write
