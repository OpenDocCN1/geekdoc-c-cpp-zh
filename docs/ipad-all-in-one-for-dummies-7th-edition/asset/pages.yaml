  img_proc: true
- pgno: 131
  md: '# Understanding iCloud Tabs


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_131_0.png)


    Figure 6-21: Print directly from your iPad if you have a compatible wireless printer.


    The Mac applications Printopia and HandyPrint make any shared or network printer
    on your home network visible to your iPad. Printopia has more features but will
    cost you, whereas HandyPrint is free. A still better option is xPrintServer because
    it can use AirPrint to print to all printers on your network and lets you attach
    a USB printer.


    If you don''t have an AirPrint-compatible wireless printer or don''t wish to use
    an app to help you print wirelessly, just email a link to the web page to yourself,
    open the link on your computer, and print from there.


    # Understanding iCloud Tabs


    iCloud Tabs were new with iOS 6.0. What this feature allows you to do is to access
    browsing history among your different devices from any device. If you begin to
    research a project on your iPad before you leave home, for instance, you can then
    pick up where you left off as you sit in a waiting room with your iPhone.'
