    # Setting VoiceOver


    VoiceOver reads the names of screen elements and settings to you, but it also
    changes the voice you input into the iPad. For example, you can have VoiceOver
    read the name of the Notes buttons to you, and when you enter notes, it will read
    words or characters you''ve entered. It can also tell you which features such
    as Auto-Correction are. On or off, follow these steps:


    +   1. Tap Settings on the Home screen. Tap General and then tap Accessibility.

    2. In the Accessibility pane shown in Figure 3-4, tap the VoiceOver button.

    3. In the VoiceOver pane, shown in Figure 3-5, tap the VoiceOver On/Off switch
    to turn on this feature.


    With VoiceOver, you must first-tap to select an item, such as a button, which
    causes VoiceOver to read the name of the button to you. Then you double-tap the
    button to activate its function. (VoiceOver reminds you about this if you on Speak
    Hints, which is helpful when you first VoiceOver, but it soon becomes annoying.)


    www.it-ebooks.info'
