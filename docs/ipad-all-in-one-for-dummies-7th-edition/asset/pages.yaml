    To delete a song from the playlist, swipe left to right across the name of the
    song you want to delete and tap the Delete button.


    # Searching for audio


    If you can''t find what you want by going through collections or categories, you
    can search for an item in your Music library using the Search feature. You can
    enter an entry, audiobook''s author, or composer''s name or word from the item''s
    title in the Search field to find what you''re looking for.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_204_1.png)


    You can also ask Siri to perform a selection or use the Spotlight feature from
    the Home screen to search for music. You can also ask Siri to identify music that''s
    playing around you, for example in an elevator or at a club, and using the Shazam
    music identification service, Siri tells you the name of the tune and allows you
    to buy it at the iTunes Store.


    With the Music app, tap in the Search field (see Figure 2-4). The onscreen keyboard
    opens.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_204_2.png)


    > **Figure 2-4:** Enter search terms in the Search field and see what you find!


    Enter a search term in the Search field. Or tap the Dictation key (see the Dictation
    key is not present on the iPad 2) to speak the search term; then tap the Search
    button on the keyboard. Results display, narrowing the search as you type. Now
    just tap any item in the search results to play it.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 188 Playing Music and Other Audio


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_205_0.png)


    Figure 2-5: Music search results.


    # # Playing Music and Other Audio


    You have all music and other audio content to listen to, and beyond downloading
    and organizing your selections, that''s what Music is mainly for. You''ll find
    the perfect playback tools in the Music app, but in case you want a refresher,
    here''s the quick rundown on how to use Music as a player.


    # # Playing your tunes


    Playing an audio file is simple, and you''ll be glad to know that Music can continue
    to play in the background while you go about using other apps. If you''re browsing
    in Safari, for example, with a track playing in Music, you can double-tap the
    Home button and a mini toolbar opens where you can control playback without leaving
    the browser. If your iPad is showing the Lock screen, you can also use controls
    to control music playback for currently selecting selections.


    The procedure for playing music is to basically find what you want to play, and
    then use the playback tools to play it. Here''s how:


    +   1. **Locate the item you want to play using the methods I describe in previous
    sections of this chapter.**

    2. **Tap the item you want to play from the list that appears.**


    If the item is stored on iCloud, tap the iCloud symbol next to it to download
    it before you play it.'
  merge: -1
  img_proc: true
