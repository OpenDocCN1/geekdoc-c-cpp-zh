    # Remembering Where You''ve Been


    Why reinvent the (mapping) wheel? One of the great capabilities of a mapping program
    is the ability to store locations you go to for future reference. In Maps, you
    can do this in a few ways. You can drop a pin on a map, which marks a beginning
    point for getting directions from one site to another. Or you can place a bookmark
    for a site you want to revisit. You then access your bookmarks by tapping Recents
    in the Search field; tap Favorites to see your bookmarks.


    # Dropping a pin


    With the iPad, pins act like the pin you might place on a paper map to note routes
    or favorite locations. Also, pins are markers: Green pin marks a start location;
    red pin marks search results; a pin you drop yourself in a lovely purple; and
    a blue pin (referred to as the blue marker) marks your iPad’s current location.


    Use these to try the pin feature of iPad:


    +   1. Display a map that contains a spot where you want to drop a pin to help
    you get directions to or from that site.


    If necessary, you can zoom in to a more detailed map to get a better view of the
    location you want to pin using techniques I cover in the earlier “Zooming in and
    out” section.


    +   2. Press and hold your finger on the screen at the location where you want
    to place the pin.


    The pin appears, together with an information bar (shown in Figure 2-8).'
