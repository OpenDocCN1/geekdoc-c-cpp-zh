  md: '# 66 Using Apps to Stay Organized


    You can use the Photos Sharing feature to share photos among your friends. In
    addition, you can share photos and other content using Twitter, Flickr, iCloud
    Photo Sharing, or Facebook from right within several apps, including Photos.


    The secret of Photos is how you interact with the photos with your fingers on
    the touchscreen, moving from one collection to another, scrolling through collections,
    expanding or shrinking photos. You can also use Photos to convert your iPad into
    a digital photo frame while you have it docked or charging, and you can run slideshows
    of your photo albums as well. If Photos sounds like fun (and it is), read more
    about how it works in Book II, Chapter 6.


    # Using Apps to Stay Organized


    Scheduling your time, tracking contacts, jotting notes — they''re all a part of
    keeping organized in your hectic world. iPad offers five apps to help you do that:
    Calendar, Contacts, Reminders, Clock, and Notes.


    More recent iPads have native print capability, which can be useful for printing
    Notes documents, for example. You have to have a printer that supports AirPrint
    wireless printing to use this method. See Book V, Chapter 1 for more about printing.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_83_0.png)


    IPads have a multitasking feature that you can turn on or off in the General pane
    in Settings. That means you don''t have to return to the Home screen every time
    you want to switch among all these great apps. As on the iPhone, multitasking
    is dead. With one app open, just press the Home button twice or place five fingers
    on the screen and pinch them. A horizontal display of icons for any open apps
    appearing around the middle of the screen with photos of recent contacts. Scroll
    to find the one you want, tap it and it. To open an app, just slide it aside.
    You can also use four fingers and swipe to the left or right to move through any
    current apps or apps you''ve used recently.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_83_1.png)


    # Tracking your schedule with Calendar


    What would your computing device be without a calendar feature, given our busy
    lives? If the calendar features on your computer and mobile phone don''t already
    keep track of you, try iPad''s Calendar. This app provides a handy onscreen today
    that you can use to set appointments and alerts to remind you about them. You
    can also sync Calendar with other calendars that you maintain online such as Google,
    Yahoo!, or computer-based interfaces via iTunes.


    See Chapter 5 in this ebook for more about syncing and Book V, Chapter 3 for details
    on using Calendar.'
