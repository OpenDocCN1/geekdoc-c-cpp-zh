- pgno: 200
  md: '# # Chapter 2: Playing Music on Your iPad


    In This Chapter


    +   - Viewing Music library contents

    - Creating playlists

    - Searching for audio

    - Playing music and other audio

    - Shuffling music

    - Using AirPlay

    - Enjoying iTunes Radio

    - Being your own DJ with radio stations

    - Viewing music history


    Almost everybody on Earth has heard of the iPod — that small, portable, music-playing
    device from Apple that''s seemingly glued to the ears of many. The iPad includes
    an iPod-like app Music that allows you to take advantage of the iPad''s pretty
    amazing little sound to play your favorite style of music or podcasts or audiobooks.


    In this chapter, you can get acquainted with the Music app and its features that
    enable you to find music and control playback from your iPad. You also get an
    overview of the AirPlay feature, which you can use to play music on your iPad
    over a home network. Finally, I introduce you to iTunes Radio.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_200_0.png)


    # # Over Your Library of Music


    In Chapter 1 of this minibook, I guide you through the process of getting onto
    your iPad. After you have some audio content in the form of music, podcasts, or
    audiobooks, it''s organized into collections, and you can find that by categories
    such as artist or genre with predefined category buttons at the bottom of the
    Music app screen.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_200_1.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 184 Looking Over Your Library of Music


    # Viewing the library contents


    You can easily view the contents of your library collections, which you may have
    synced from your computer or shared over a network, pushed to your device through
    iCloud, or downloaded directly using iPad''s Wi-Fi or Wi-Fi+ capability. (See
    Chapter 1 in this minibook for details.)


    Take a tour of your Music library collections by following these simple steps:


    +   1. Tap the Music app, located in the Dock on the Home screen.

    The music library appears (see Figure 2-1).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_201_0.png)


    Figure 2-1: The Music library showing your music by Artists.


    +   2. Tap the Playlists, Artists, Songs, Albums, Genres, Compilations (such as
    the Best of British Rock), or Composers at the bottom of the library to view your
    music according these criteria. (Refer to Figure 2-1.)


    The Purchased button appears only if you''ve already obtained content on iTunes.


    +   3. Tap the Radio button (see Figure 2-2) to view this feature, discussed in
    more detail later in this chapter.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_201_1.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# Looking Over Your Library of Music 185


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_202_0.png)


    The iTunes Store has free items that you can download and play around with the
    features in Music, including music and podcasts. You can also sync content on
    your computer or Apple devices to your iPad and play it using the Music app. See
    Book I, Chapter 5 for more about syncing.


    Figure 2-2: View stations by tapping the Radio button.


    Apple offers a service called iTunes Match (www.apple.com/itunes-match). You pay
    $24.99 per month for the capability to match the music you''ve bought from other
    providers or ripped from CDs (and stored on your computer) to what''s in the iTunes
    Store. If there''s a match (and often there), content is added to your iTunes
    library at 256 Kbps. If there''s no match, it''s uploaded to iCloud and synced
    to your iPad. Then, using iCloud, you can sync the content among all your Apple
    devices. The upward limit of 25,000 tracks works for most users.


    You can use the iTunes Summary tab on your computer to make a setting to sync
    music at 128 Kbps. This saves space on your iPad if you''re an avid music downloader,
    though the audio quality is lower. You can also make a setting for whether to
    download album covers in iTunes.


    # Creating playlists


    Everyone loves playlists. They give you a way to compile your very own music to
    match your mood or the occasion. You can easily create your own playlists with
    the Music app to put tracks from various sources into collections of your choosing.'
  merge: -1
  img_proc: true
