- pgno: 457
  md: '# 440 Taking a Look at Your Calendar


    # # Taking a Look at Your Calendar


    You''ve probably used calendar apps in a slew of settings — in your email client,
    on your cellphone, and even in robust contact-management programs. The Calendar
    app on iPad is more robust than and less robust than others, but it''s quite a
    nicely designed and simple-to-use program that saves you the cost of buying one
    more app, plus it syncs with your computer and iCloud, Google, Exchange, or Office
    365 calendar. Calendar offers several ways to view your schedule, so the first
    step in mastering Calendar is to understand how to navigate these various views.


    You started by tapping the Calendar app icon on the Home screen to open it. Depending
    on what you last had open, you may see today''s calendar or the weekly, monthly,
    or yearly calendar or an open event.


    Next, tap one of the buttons described here to change the view:


    +   * **Today:** This view, in landscape orientation with Search in open in Figure
    3-1, displays your appointments and a monthly calendar on the left page, along
    with an hourly breakdown of the day on the right page. In portrait orientation,
    the two pages are narrower. Tap an event on this list to view more details.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_457_0.png)


    **Figure 3-1:** Calendar in landscape orientation.


    +   *Week:** Use Week view to see all your events for the current week, as shown
    in Figure 3-2. In this view, appointments appear in their scheduled time slots
    on the grid.'
  merge: -1
  img_proc: true
