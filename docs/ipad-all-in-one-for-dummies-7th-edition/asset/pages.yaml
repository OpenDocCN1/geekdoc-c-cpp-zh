    make settings for accessing a VPN. If you set up VPN on your computer, you should
    be able to use the same VPN settings on your iPad. You might want to let your
    admin which iPad can connect to VPNs that use the L2TP, PPTP, PPTP, or Cisco IPSec
    protocol.


    Add a new VPN configuration, go to Settings and tap General > VPN > Add VPN configuration.
    The settings shown in Figure 1-5 appear. Fill in the information requested and
    tap Save.


