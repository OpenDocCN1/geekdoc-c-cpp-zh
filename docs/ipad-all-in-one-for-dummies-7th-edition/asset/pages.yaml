    If you want to know your own look, tap Create New Style.


    # Managing Other Hearing Settings


    A couple of hearing accessibility settings are simple on/off settings, including


    +   * **Mono Audio.** Using the stereo effect in headphones or a headset breaks
    up sounds that you hear a portion in one ear and a portion in the other, to simulate
    the way your process sounds (unless there is only one channel of sound, in which
    case sound is sent to both ears). If you''re hard of hearing or deaf in one ear,
    you''re hearing only a portion of the sound in your hearing ear, which can be
    frustrating. If you have hearing changes and want to use iPad with a headset,
    you should turn on Mono Audio. When it''s turned, all sound is distributed and
    to both ears.


    +   * **Have iPad Auto-text.** The Speak Auto-text feature, which you access through
    the Speech selection under Accessibility, speaks autocorrections and auto-capitalizations
    (you can turn on both these features using Keyboard settings). When you enter
    text in an app such as Notes or Mail, the app then makes every type of change,
    while Speak Auto-text lets you know what change was made.'
