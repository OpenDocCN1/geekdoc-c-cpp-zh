- pgno: 306
  md: '# # Chapter 1: Configuring Your iPad to Connect Everywhere


    # ## In This Chapter


    +   - Making Wi-Fi and 3G/4G settings

    - Tethering your iPad to your smartphone

    - Setting up a Microsoft Exchange account


    This chapter is all about connecting, whatever you''re connecting to the Internet
    via Wi-Fi, 3G, or 4G (not available on the original iPad or iPad 2) or connecting
    to your company network. Apple has made an effort over the years with iPhone to
    support enterprises, meaning that you can use the phone to connect with your company
    network and vital work data. The iPad continues that tradition with support for
    Microsoft Exchange Server, virtual private networks (VPNs), and Lightweight Directory
    Access Protocol (LDAP) accounts.


    Your best at setting up the more technical of these is your network administrator.
    In this chapter, I give you an overview of the capabilities of iPad to connect
    and some guidance in making the settings you need to make.


    # ## Making Wi-Fi and 3G/4G Settings


    The way people with iPads can connect to the Internet, the grandmother of all
    networks, is via Wi-Fi or 3G/4G capabilities (assuming that you have a 3G or 4G
    model).


    The third-generation (and later) iPad and the mini offer Wi-Fi only or Wi-Fi and
    3G/4G, which gives you the ability to connect to a super-fast 4G LTE network;
    if a 4G network isn''t available (and they aren''t in many areas), your 4G iPad
    can still access several types of 3G networks including GSM/UMTS networks around
    the world.


    In this section, I go into the settings you can make to manage your Wi-Fi or 3G/4G
    connection.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_306_0.png)'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# Making Wi-Fi and 3G/4G Settings


    # # Making Wi-Fi settings


    Book 1, Chapter 5 gives you the information you need to connect to a Wi-Fi network,
    a matter of simply signing in to the network, with a password, if necessary. Now
    it is time to go over the finer points of your Wi-Fi connection.


    A basic Wi-Fi setting tells iPad to automatically search for and join networks
    that are in range. If several networks are in range, using this setting, iPad
    joins the one that you used most recently.


    After iPad joins a network, a little Wi-Fi icon appears in the status bar. The
    number of dots indicates the strength of the signal, just as you''re used to seeing
    on your cellphone.


    To get to Wi-Fi settings, tap Settings on your Home screen and tap Wi-Fi (see
    Figure 1-1).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_307_0.png)


    **Figure 1-1**: Wi-Fi settings.


    Here''s a rundown of the items you can work with in Settings for your Wi-Fi configuration:


    +   **Wi-Fi On/Off:** Simply tap this switch to On to turn on Wi-Fi. If you want
    it off, perhaps to avoid battery drain or because you''re on an airplane and the
    pilot tells you to, set this to **Off**. (Note that iPads also have an Airplane
    Mode setting, which I discuss in the next section.)


    +   **The network you''re connected to:** The current connection is listed. Tap
    it to change any settings for it or to disconnect.'
  merge: -1
  img_proc: true
