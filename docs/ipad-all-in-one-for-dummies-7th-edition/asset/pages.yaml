  md: '# 470 Get Some Rest with Do Not Disturb


    # Get Some Rest with Do Not Disturb


    Do Not Disturb is a simple useful setting you can use to stop any alerts and FaceTime
    calls from making a sound or being displayed. You can make settings to allow calls
    from certain people to get through or to allow repeat calls from the same person
    in a short time period to come through. (Apple has assumed in designing this that
    such repeat calls may signal an emergency situation or urgent need to get through
    to you.)


    To set up Do Not Disturb, follow these steps:


    +   1. Tap Settings.

    2. Tap Do Not Disturb to turn the feature on.

    3. Tap the Manual On/Off switch to turn the feature on.

    4. In the other settings shown in Figure 4-13, do any of the following:

    * Tap Scheduled to allow alerts during a specified time period to be displayed.

    * Tap Allow Calls From and then, from the next screen, select Everyone, No Favorites,
    or All Contacts.

    * Tap Repeat Calls to allow a second call from the same person in a three-minute
    time period to come through.

    5. Tap the Home button to return to the Home screen.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_487_0.png)


    **Figure 4-13:** Manage how Do Not Disturb operates from here.'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# Chapter 5: Managing Contacts


    In This Chapter


    +   - Adding contacts

    - Syncing contacts with iCloud

    - Adding social media info

    - Specifying related people

    - Adding a ringtone and photo to a contact

    - Sharing contacts

    - Using Maps to view a contact''s location

    - Deleting a contact


    contacts is the iPad equivalent of the address book on your cellphone. In fact,
    if you know an iPhone, it''s similar to your Contacts app. The Contacts app on
    iPad is simple to set up and use, and it has powerful features beyond simply storing
    names, addresses, and phone numbers.


    For example, you can pinpoint a contact''s address in the iPad Maps application.
    You can use your contacts to quickly address emails, messages, and tweets. If
    you store a contact record that includes a website, you use a link in Contacts
    to view that website instantly. And, of course, you can easily search for a contact
    by a variety of criteria, including people related to you by family ties or mutual
    friends, by groups you create.


    In this chapter, you discover the various features of Contacts, including how
    to save yourself time by syncing your email lists to your iPad instantly.


    # Populating Your Contacts with Information


    The Contacts app''s sole purpose is to store contact information and make it available
    to you, but first you have to make that information available to the Contacts
    app. You can do it by manually adding records one at a time,


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_488_0.png)'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# 472 Populating Your Contacts with Information


    syncing via iTunes, syncing contacts with other accounts such as your Gmail or
    Yahoo! email, or pushing your contacts to other devices via iCloud to transfer
    your contacts instantly.


    If you have access to or set up a lightweight directory server (LDIF or LDAP),
    you can import the contacts stored in such a directory. You can do this by choosing
    Settings>Mail, Contacts, Calendars and then tapping Add Account: Choose Other
    and then, under Contacts, tap Add LDAP Account.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_489_0.png)


    # Adding contacts


    You, of course, enter your contacts the old-fashioned way, by typing their names,
    addresses, phone numbers, and other information in a form.


    Follow these steps to create a new contact record:


    +   1. Tap the Contacts icon on the Home screen to open the application.


    If you haven''t entered a contact, you see a blank address book with the Add (plus)
    icon at the top of the Contacts List, as shown in Figure 5-1.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_489_1.png)


    Figure 5-1: Tap to add a new contact.


    +   2. Tap the Add button (the + button).


    A blank Info page opens, and the onscreen keyboard displays, as you can see in
    Figure 5-2.'
