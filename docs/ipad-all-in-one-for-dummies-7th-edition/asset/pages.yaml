    # Updating the Operating System


    This book is based on the latest version of the iPad operating system at the time,
    iOS 8.0. If you have an iPad (generation 4 and later can update to iOS 8.0), to
    make sure you get the latest and greatest features in iPad, it''s a good idea
    to update right now to the latest iOS (and periodically, no matter which recent
    model of iPad you have, to receive minor upgrades). If you''ve set up an iCloud
    account on your iPad, updates will happen automatically, or you can update over
    a Wi-Fi or 3G/4G connection by going to Settings, and on the General panel, tapping
    Software Update. Note that the original iPad model cannot run iOS 7 or later,
    so this coverage will miss its functionality in large part.


    Getting Started with iPad


    It''s a good idea to have your iPad plugged into a power source before you start
    to download an iOS update so that the battery doesn''t drain before the update
    is complete.


    Before you perform an update to the iOS, make sure that you have updated to the
    latest version of iTunes on your computer (iOS 8.0 requires iTunes 11.4 or later).
    After you do, here''s how to update the iOS via a connection with your computer:


    +   1. Plug the Lightning to USB Cable (or the Dock Connector to USB Cable) into
    your iPad and plug the USB into your computer.


    When iTunes opens on your computer, look for your iPad name in the Devices section
    in the Source List on the left side of the screen (see Figure 2-14).


    +   2. Click your iPad''s name in the Devices pop-up menu and then click the Summary
    tab if it''s not already displayed.


    +   3. Read the note to the Check for Update button to see whether your iOS is
    up to date; if it isn''t, click the Check for Update button.


    iTunes checks to find the latest iOS version and walks you through the updating
    procedure.


    Your iPad has enough memory to download the latest iOS. If you have an iPad with
    smaller memory, you may actually have to remove some apps or content such as music
    to make room for it before the update can take place.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
