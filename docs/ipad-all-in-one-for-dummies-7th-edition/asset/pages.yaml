  md: '# # Chapter 6: Talking to Your iPad with Siri


    # ## In This Chapter


    +   - Activating Siri and understanding all that Siri can

    - Calling people and creating reminders and alerts

    - Adding tasks to your Calendar

    - Playing music, getting directions, and asking for facts

    - Using Siri to search the web or send email, tweets, or messages

    - Getting helpful Siri tips


    One of the coolest features of iPad is Siri, a personal assistant feature that
    responds to spoken commands using a third-generation (or later) iPad and iPad
    mini. With Siri, you can ask for nearby restaurants, and a list appears. You can
    open apps with a voice command and with iOS 8, for the first time, Siri can search
    the App Store. Calling your mother is as simple as saying, “Mom, Want to know
    the capital of Rhode Island? Just ask. Siri searches online to answer questions
    ranging from result of mathematical calculation to the size of Jupiter. You can
    also have Siri perform tasks such as returning calls and controlling iTunes Radio.
    Finally, you can play music, and with iOS 8 comes integration with Shazam, a music
    identifier service that can identify tagged songs for you.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_508_0.png)


    # ## Activating Siri


    When you go through the process of setting up your iPad or iPad mini, making settings
    for your location, using iCloud, and so on, at one point, you see the screen shown
    in Figure 6-1. To activate Siri, just tap Siri and then tap Next. When you first
    set up your iPad, it reminds you about Siri by displaying a message.'
  merge: -1
  img_proc: true
