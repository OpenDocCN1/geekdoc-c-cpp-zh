- pgno: 80
  md: '# Getting Online with iPad


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_80_0.png)


    **Figure 4-1:** Find what you need on the web with Safari.


    Be sure to check out iCloud connectivity with a feature called Handoff. If you
    have several Apple devices, you can use iCloud tabs to pick up where you left
    off or viewing tabs on one device on another.


    You can get done much of what you want to do on your iPad by using Siri. This
    personal assistant, which you learn more about in Book V, Chapter 6, can help
    you go to a web page, create and send an email, an event in Reminders or Calendar,
    and more.


    # Getting Mail


    iPad lets you get all mail in one place through the Mail app — the program you
    use to access email accounts you set up in iPad. You can set up accounts that
    you have with popular email providers such as Gmail, Yahoo, AOL, and Outlook.com.
    You can also access accounts through iCloud or Microsoft Exchange/365. (Your work
    account might use Microsoft Exchange, for example.) Almost any IMAP- or POP3-type
    account (the two most mail protocols) is supported, which lets you access the
    email accounts you have with your Internet service provider (ISP).


    After you set an account, when you tap the Mail icon, your email will display
    without having to browse to a site or sign in. Then you can use tools to move
    preset mail folders, read and reply to mail, and download attached photos to the
    iPad. You can also use the Print feature in Mail to print your email messages
    to a printer that supports AirPrint. You can read more about setting up and using
    email accounts in Chapter 7 of this minibook.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# 64 Shooting and Organizing Photos


    In portrait orientation, emails are displayed full screen, and you can use a drop-down
    menu to view your inbox. In landscape orientation, the inbox stays on the left
    side of your screen.


    iPad users (except those with an original iPad or iPad 2) can use the Dictation
    feature to enter email addresses and messages in Mail by tapping the Dictation
    key on the onscreen keyboard and speaking to them. Chapter 3 in this minibook
    for more about the Dictation feature.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_81_0.png)


    # Using iMessage


    iPad''s instant messaging is called Messages. This app allows you to use the iMessage
    service to swap text messages with others in real time using your cellphone number
    or email address. You can forward your conversations to others as well.


    You can use the Messages settings to turn on the app or allow others to get a
    read receipt when you read their messages. You can also use the data in your Contacts
    app to addressing messages quick and easy. New with iOS 8 comes the ability to
    send audio or video messages.


    # Shooting and Organizing Photos


    All iPads (except the original iPad) include front- and rear-facing cameras. You
    can use the cameras to take photos or still videos (both of which are covered
    in Book II, Chapter 4). To review and play around with photos you snap or bring
    onto the iPad from another source, you have the Photos app.


    # Examining the iPad cameras


    The third-generation and later iPads have a super-clear Retina display and rear-facing
    Sight camera for viewing and taking the iPad-generated photos and video yet.


    Take a quick look at your camera''s features by tapping the Camera icon on the
    Home screen.


    You can use the controls from the front and rear cameras to


    +   - Switch from still-camera to video-camera operation by using the Camera/Video
    slider.

    - Take a picture or start recording a video.

    - Turn on a grid to help you autofocus on still photo subjects.'
