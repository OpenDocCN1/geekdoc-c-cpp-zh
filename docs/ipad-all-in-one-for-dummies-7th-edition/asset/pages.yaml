- pgno: 493
  md: '# 476 Assigning a Photo to a Contact


    +   3. Tap Merge (see Figure 5-6) to merge your iPad Contacts contents with iCloud.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_493_0.png)


    Figure 5-6: Merge your iPad Contacts contents with iCloud.


    If you don''t use a server-based syncing method with accounts such as iCloud,
    Google, or Exchange, you can use iTunes to automatically sync all your Apple devices
    and even a Windows PC. See Book I, Chapter 5, for more about making iTunes settings
    to specify how your contacts are synced in iTunes.


    You can use the iTunes Wi-Fi sync feature in the General pane in Settings to sync
    with iTunes wirelessly from a computer connected to the same Wi-Fi network.


    # Assigning a Photo to a Contact


    It''s always helpful to associate a face with a name. In Contacts, you can do
    just by adding a person''s photo to their contact record. You can add photos from
    various sources, such as


    +   * The Photos'' albums

    * Digital cameras

