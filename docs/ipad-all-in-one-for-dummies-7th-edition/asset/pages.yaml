  md: '# Adjusting the volume


    Music offers its own volume control that you can adjust during playback. This
    volume is set relative to the system volume that you control using the iPad''s
    Settings app; if you set it to 50%, it will play at 50 percent of the system volume
    setting.


    With music, tap a piece of music to play it. In the controls that appear onscreen
    (see Figure 2-8), press and drag the button on the Volume slider to the right
    for more volume or to the left for less volume. To mute your iPad''s speaker at
    any time, press the Mute button to the right of the volume slider or, if it''s
    set up to control volume in Settings, slide the Side switch on the side of your
    iPad to.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_208_0.png)


    **Figure 2-8:** Louder or softer, use the slider to get the effect you want.


    If you have volume set at high and you''re still having trouble hearing, consider
    using a headset. These devices cut out extraneous noises and should improve the
    sound quality of what you''re listening to. I recommend that you use a 3.5mm stereo
    headphone (a ¼ headphone sometimes works fairly well) and insert it in the headphone
    jack at the top of your iPad. You can also use Apple''s iPod or iPhone EarPods,
    which work just fine with the iPad. iPhone EarPods include a microphone as well.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Using AirPlay and Home Sharing


    AirPlay and Home Sharing are two methods of sharing music among devices.


    AirPlay gives you the ability to stream audio to externally powered speakers on
    your wireless network as well as home entertainment centers that include an Apple
    TV unit. Several speaker manufacturers have built AirPlay hardware into their
    systems. AirPlay streaming technology is built into the iPhone, iPod touch, and
    iPad, as well as being available to iTunes on Windows PCs and Macs. With AirPlay,
    you can send media files from one device to another. You can also send (say a
    movie that you chased on your iPad or a slideshow of photos to be played on your
    TV — and control the playback from your iPad. You can also send music to be played
    over speakers.


    There are a few ways to do this. You can purchase an Apple TV and stream video,
    photos, and music to the TV, or you can purchase an AirPort Express Wi-Fi router
    and attach your speakers to play music. Finally, if you buy AirPlay-enabled wireless
    speakers, you can stream directly to them. Because this combination of equipment
    varieties, my advice — if you''re interested in using AirPlay — is to visit the
    nearest Apple Store or Certified dealer and find out which hardware combination
    will work best for you.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_209_0.png)


    iOS 8 supports peer-to-peer AirPlay support, which means that you can make a direct
    connection to AirPlay speakers or Apple TV, you can share direct content as music
    and photos without being on the network.


    To use AirPlay with another AirPlay-enabled device on your network or in close
    proximity, swipe up from the bottom of your screen and tap the AirPlay button
    in the Control Center.


    If you get a bit itchy watching a long movie, one of the beauties of AirPlay is
    that you can still use your iPod to check, browse photos or the Internet, or check
    your calendar while the media plays.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_209_1.png)


    Home Sharing is a feature of iTunes that you can use to share music and video
    among devices that have Home Sharing turned on. To use the feature, each device
    has the same Apple ID on your network. After it is set via iTunes, you can stream
    music and videos to any of the devices, and even click and drag content between
    devices using iTunes. iTunes on your computer can also share its library over
    a network. For more about Home Sharing, visit this: www.apple.com/support/homesharing.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# Playing Music with iTunes Radio


    # Playing Music with iTunes Radio


    iTunes Radio lets you access a world of radio content and even learns kind of
    content you like time passes. You can access iTunes Radio with any Apple device
    that has iOS 7 or later; follow these steps:


    +   1. Begin by tapping the Music app on the Home screen.

    2. Tap the Radio button at the bottom of the screen that appears.

    3. Tap a Featured Station. (See Figure 2-9.)


    A featured song begins to play.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_210_0.png)


    Figure 2-9: Tap a featured station to hear a featured song.


    +   4. Use the tools at the bottom of the screen, shown in Figure 2-10, to control
    playback.


    +   5. Tap the Information button at the top-middle of the screen to display the
    options.


    +   6. Choose one of the following: New Station from Artist, New Station from
    Song, Add to My Stations, Allow Explicit Tracks, or Share Station via AirDrop,
    Mail, Twitter, or Facebook.'
  merge: -1
  img_proc: true
- pgno: 211
  md: '# 194 Creating Stations


    These choices may vary depending on the type of station you''ve opened; for example,
    they will be different on a talk radio station such as NPR. The more you use iTunes
    Radio, the better the program is able to build stations that match your taste.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_211_0.png)


    Figure 2-10: The usual tools for controlling playback.


    # Creating Stations


    Are you the creative type? Do you like more than one kind of music? You''ll be
    glad to know that you can create a radio station of your own.


    +   1. Tap Music in the Dock.

    2. Tap Radio. From the iTunes Radio Home page, tap the New Station button with
    a bright red cross on it (see Figure 2-11).

    3. Tap a category of music such as Classic Rock or Dance. (See Figure 2-12)

    4. If subcategories are then offered, tap the one you prefer and tap the Add New
    button that appears to the right of the category.


    The category is added to your stations.'
