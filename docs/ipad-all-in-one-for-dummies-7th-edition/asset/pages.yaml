- pgno: 412
  md: '# # Chapter 4: Presenting Keynote


    # ## In This Chapter


    +   - Considering important issues before you create a presentation

    - Working with Keynote

    - Animating a presentation with transitions and builds

    - Preparing to present

    - Playing a presentation


    Keynote, the first component created for iWork, was originally written for Steve
    Jobs to use in presentations at conferences and trade shows, including Apple''s
    Worldwide Developers Conference and IDG Worldwide''s Macworld conferences. After
    these "trials by fire," "Keynote" was joined by Pages to become the first two
    components of iWork.


    Presentation software is a different type of product in comparison to the other
    two iWork applications. It typically consists of content presented by a speaker
    (whether in person or absentia) to an audience.


    With Keynote you have a few presentation possibilities. Small-group or one-on-one
    presentations using iPads are made possible because you can easily show short
    impressive presentations almost anywhere. In addition, you can connect the iPad
    to a projector or TV via a VGA adapter or HDMI adapter, and present to larger
    groups from a smaller machine. On iPad, you can also use the video-mirroring feature
    AirPlay and Apple TV to show your iPad on your TV screen. If you choose to display
    a presentation to a single person or small group on the iPad itself and you have
    a third-generation (or later) iPad, you''ll find the Retina display dazzling way
    to wow your audience.


    In this chapter, you find out how to prepare and stage a presentation using Keynote.
    After adding text to slides and using transitions, you''ll soon have a sophisticated
    and useful presentation.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_412_0.png)'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Concepts to Consider before You Create a Presentation


    # Concepts to Consider before

    You Create a Presentation


    A presentation is meant to be viewed. A person (usually you, but sometimes the
    viewer) controls the pace of the presentation. Follow these tips when building
    a presentation:


    +   - Weigh small-group versus large-group presentations. You have options on
    iPad in addition to the traditional model of presenting to a group. This model
    offers an opportunity for one-on-one presentations that you can give in any setting,
    such as a sales call in a client''s office. If you''re working on a small-group
    or one-on-one presentation, the text and graphics don''t have to reach across
    a ballroom to the viewer''s eye, size elements on the slide accordingly


    +   - Make use of existing content. Keynote for iOS helps you easily transfer
    presentations between your iPad and your Mac via iTunes. It also syncs its content
    via iCloud. that''s the right thing to do. You can reuse the slides and rearrange
    them (possibly splitting a presentation into many). Restructuring and rearranging
    an existing presentation going to be presented to a small group rather than a
    larger audience can be a good idea.


    +   - Consider your canvas. When working on a presentation, you''re using a small
    canvas. A slide has much less space to hold information than does a piece of paper
    (or a spreadsheet page). No matter how large your audience, never overcrowd slides.


    +   - Avoid much variety. Using too many graphical object styles (such as illustrations,
    photos, and line drawings) or too many fonts (such as bold and underline) can
    make for a choppy-looking presentation. Keynote themes help you provide a cohesive
    and clean look for your presentation. Even though you may make small changes to
    text and add graphics, to maintain an overall look and feel.


    +   - Add movement to slides. You have options for movement (see the "Using Transitions
    and Builds" section, later in this chapter) that you don''t have printed documents.
    You can add effects to transition from one slide to another. Experiment with the
    Keynote transitions and use them to help people understand your progress in the
    presentation. For example, you can use a transition to introduce a new topic.


    # Getting Started with Keynote on iPad


    You started with the Keynote app the same way you do with Numbers or Pages: Create
    a new document or open an existing one. The basic \ are the same, but Keynote
    has some minor differences. This section is your guide.'
  merge: -1
  img_proc: true
- pgno: 414
