  img_proc: true
- pgno: 82
  md: '# Shooting and Organizing Photos


    +   * Use square, time-lapse, panorama settings and use filters to modify the
    colors and other effects on a shot.


    +   * Open previously captured images or videos.


    When you take a photo or video, you can use an iPad to send the image via a tweet
    or email, share it with iCloud Sharing, send it to those close to you via AirDrop,
    post it to your Facebook or Flickr account, use a simple photo as wallpaper or
    assign it to represent a contact, or run a slideshow or edit a video. See Book
    II, Chapters 4 and 6 for more detail using your iPad cameras.


    # # Perusing your photos


    Photos isn''t exactly Photoshop or any other sophisticated photo-imaging program
    — it''s just a pretty app for organizing and viewing photos with a few simple
