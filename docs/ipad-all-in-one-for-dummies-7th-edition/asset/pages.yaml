- pgno: 197
  md: '# 180 Setting Up Family Sharing


    # # Setting Up Family Sharing


    Family Sharing is a new feature that allows up to six people to share whatever
    anybody in the group has purchased from iTunes, eBooks, and App Stores even though
    you don''t share Apple accounts. Your family must use one credit card to purchase
    items, but you can approve purchases by younger children. You can also share calendars,
    photos, and a family calendar (see Book V, Chapter 3 for information about Family
    Sharing and Calendar, and Book II, Chapter 6 for information on sharing Photos
    in a Family album).


    Start by turning on Family Sharing:


    +   1. Tap Settings.

    2. Tap iCloud and then Set Up Family Sharing.

    3. Tap Started.

    4. Tap Continue.

    5. On the Share Purchases screen, tap Share Purchases from a different account
    to use another Apple account.

    6. Tap Continue and check the payment method you want to use.

    7. Tap Continue.

    8. On the screen that appears, tap Add Family Member.

    9. Enter the person''s name (assuming this person is listed in your contacts)
    or email address (see Figure 1-12).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_197_0.png)


    www-it-ebooks.info'
  merge: -1
  img_proc: true
