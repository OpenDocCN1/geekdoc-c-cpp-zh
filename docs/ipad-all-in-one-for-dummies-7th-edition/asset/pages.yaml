  md: '# 392 Working with New Tables


    +   5. Tap the table layout you like.

    It''s placed on the sheet you have open.


    # Changing a table''s look


    Whether you recently created a new table or created it long ago, you might want
    to change its appearance. Here''s how:


    +   1. Select the table you want to format (to select the table, tap inside the
    table bounds but outside the cells) and tap the Format button in the toolbar.


    The Format popover opens, as shown in Figure 3-29. You can change the basic color
    scheme and layout by tapping the design you want to use.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_409_0.png)


    > Figure 3-29: Use Format to reformat a table.


    +   2. Tap Table Options and fine-tune the table with a title, outline, and shading
    for alternating rows (see Figure 3-30).


    Every table has a name. (It starts as Table #, with the next sequence for all
    your tables.) The Table option simply controls whether the title is shown. Change
    the name to something meaningful that you can use in it in formulas. Likewise,
    each table is a certain size. The Table option determines whether a thin line
    is applied as the table''s border. In the Alternating Rows option, every other
    row is shaded with a contrasting color.


    For large tables, alternating the shading of the rows can make it easier for users
    to follow the data.


    +   3. Tap Grid Options to show or hide the cell dividers.


    Many people think that showing the lines in the main table and hiding them in
    the headers looks best. Experiment. As you tap on or off, the display changes
    so that you can see the effect.'
