  md: '# Understanding Group Messaging


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_249_0.png)


    **Figure 5-11:** Get rid of yesterday''s IM with a tap.


    # Understanding Group Messaging


    If you want to start a conversation with a group of people, you can use group
    messaging. Group messaging is great for keeping several people in the conversational
    loop. You can


    +   - Create a group message simply by addressing a message to more than one person
    and sending it. The message and replies to it are delivered to everybody in the
    group.


    +   - When you receive a group message, you can manage your participation in the
    conversation by tapping the Details Button. To temporarily mute notifications
    of responses to a conversation, do the Do Not Disturb switch to Off. Set Do Not
    Disturb back On to again receive contributions to the conversation. Tap Leave
    It This Conversation to permanently exit the conversation.'
