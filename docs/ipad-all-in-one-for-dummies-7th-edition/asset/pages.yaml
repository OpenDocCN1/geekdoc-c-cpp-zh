    iPad has to be connected to the Internet because they aren''t stored locally (meaning
    that they are stored on your company''s servers). If any necessary, check with
    your company''s network administrator for information about your network and LDAP
    requirements.


    # Setting up a virtual private network


    If you want to connect to your organization''s network, you may be able to use
    a virtual private network, or VPN. A VPN, which works over Wi-Fi and 3G/4G cellular
    connections, allows you to access data securely whether you''re using a network
    outside your company — such as at home or in a café — to access the servers inside
    your company''s network. After a VPN is set up at your company, you can use VPN
    settings on your iPad to connect to your company network.'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Connecting to an Enterprise 297


