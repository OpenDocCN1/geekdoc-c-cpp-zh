  md: '# # Chapter 9: Maintaining and Troubleshooting


    # In This Chapter


    +   - Taking care of your iPad

    - Solving common iPad problems

    - Finding technical support

    - Finding a missing iPad

    - Backing up to iCloud


    > Pads grow on trees — they cost a pretty penny. That''s why you should know how
    to take care of your iPad and troubleshoot any problems that it have so that you
    get the out of it.


    In this chapter, I provide some advice about the care and maintenance of your
    iPad, as well as tips about how to solve common problems, update iPad system software,
    and even reset your iPad something seriously wrong. In case you lose your iPad,
    I even tell you about a feature that you find it, activate it remotely, or disable
    it if it falls into the wrong hands. Finally, you get information about backing
    up your iPad settings and using iCloud.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_170_0.png)


    # Maintaining Your iPad


    You have a great gadget and an investment to protect in your iPad. A few simple
    precautions can keep it damage-free — at least until you rush and buy the next
    version.


    It''s wise to keep the screen clean and safe from damage, as well as maximize
    your battery usage. The following sections tell you how.


    # ## Keeping the iPad screen clean


    If you''ve been playing with your iPad, you know — despite Apple''s claim that
    iPads have fingerprint-resistant screens — that iPads are fingerprint magnets.
    They''re covered with an oil-resistant coating, but that definitely'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 154 Maintaining your iPad


    doesn''t mean they smudge-proof. One way to avoid those finger smudges is by obtaining
    an inexpensive stylus — just be sure it''s got a soft or pliable tip and is designed
    for use with an iPad.


    Avoid a few smudges in the first place by using a stand or dock to hold your iPad.
    With a stand or dock, you spend less time picking up your tablet, which cuts down
    fingerprints.


    Here are some tips about cleaning your iPad screen:


    +   **Use a dry, soft cloth.** You can get more fingerprints off with a dry, soft
    cloth such as you use to clean your glasses or a cleaning cloth that''s lint-
    and chemical-free. Try products used to clean lenses in labs, such as Kimwipes
    or Kaydry, which can get from several major retailers like Amazon.


    +   **Use a slightly moist cloth.** To get the surface even, very slightly moist
    the cloth before you use it to clean the screen. Make sure whatever cloth material
    you use is lint free.


    +   **Remove the cables.** May go without saying, but I''ll say anyway: If you
    didn''t want a fried iPad, turn it off and unplug any cables before cleaning the
    screen with a moistened cloth.


    +   **Avoid moisture.** Avoid getting moisture around the edges of the screen
    where it can seep into the unit.


    +   **Never use household cleaners on your iPad screen.** They can degrade the
    coating that keeps the screen from absorbing oil from your fingers.


    **Do not use premoistened lens-tissue to clean your screen.** Most of these products
    contain alcohol, which can damage the screen''s coating.


    # Protecting your gadget with a case


    Your screen isn''t the only element on the iPad that can be damaged, so considering
    a case for it that you can carry it around the house or around town. Besides providing
    a bit of padding if you drop the device, a case makes the iPad less slippery in
    your hands, offering a better grip when using it.


    Several types of cases are available for iPad Air 2 and iPad mini 3, and more
    are showing up all the time. You can choose the Smart Cover from Apple that covers
    the screen, for example ($39); the Smart Case from Apple, which wraps around the
    iPad completely ($79 for iPad Air 2 and $69 for iPad mini 3); or from other manufacturers.
    I''ve found cases from other manufacturers to be more sturdier than Apple cases.
    For instance, Tuff-Luv (www.tuff-luv.com) and Griffin Technology (www.griffintechnology.com)
    in materials ranging from leather (see Figure 9-1) to silicone (see Figure 9-2).'
