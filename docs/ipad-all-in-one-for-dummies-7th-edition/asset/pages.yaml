    # # Understanding iCloud


    You have an alternative to syncing content by using iTunes. iCloud is a service
    that allows you to back up all your content and settings, such as bookmarks, to
    online storage. (However, note that some content, such as videos, aren''t backed
    up, so consider an occasional backup of content to your computer or from your
    computer to an external storage device such as a USB stick, as well.) That content
    and those settings are then pushed automatically to all your Apple devices through
    a wireless connection.


    All you need is to get an iCloud account, which is free, and then make settings
    on each device for types of content you want to have pushed to each device. After
    you''ve done that, any content you create or purchase on one device — such as
    music, apps, books, and TV shows, as well as documents created in Apple''s iWorks
    apps, photos, and so on — can be synced among your devices automatically.


    When you get an iCloud account, you get 5GB of free storage. If you want additional
    storage, you can buy from one of your devices. In round numbers, 20GB is $12 a
    year; 200GB is $48 a year; 500GB is $120 a year, and 1 terabyte is $240. Most
    people will do fine with the 5GB of storage. Note that items you''ve purchased
    from iTunes, which include any music such as ripped CDs that you''ve synced across
    devices using the iTunes Match service, don''t count toward your data storage.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 82 Understanding iCloud


    You to upgrade your storage, go to iCloud in Settings, tap Storage, and then tap

    Buy More Storage. In the settings that appear, tap the amount you need and

