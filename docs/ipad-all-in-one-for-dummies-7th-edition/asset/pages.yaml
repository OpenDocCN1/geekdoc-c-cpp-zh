- pgno: 134
  md: '# # Chapter 7: Working with Email in Mail


    # ## In This Chapter


    +   - Adding an iCloud, Gmail, Yahoo!, Outlook, or AOL account

    - Setting up a POP3 email account

    - Opening Mail and reading messages

    - Formatting, searching, printing, deleting, and organizing your email

    - Setting up a VIP list


    What would use an iPad if you couldn''t stay in touch with your friends? You can
    access an existing email account using the handy Mail app supplied with your iPad,
    or you can sign into your account using the Safari browser. Using Mail involves
    adding one or more email accounts using iPad Settings. Then you can use Mail to
    write, format, retrieve, and forward messages from any email accounts added to
    iPad.


    Mail offers the capability to mark the messages you''ve read, delete messages,
    and organize your messages in folders, as well as a handy Search feature. You
    can create a VIP list so that you are notified when special people send you an
    email.


    A few features for Mail arrived with iOS 8, including a feature that makes jumping
    between a draft email and other messages in your Inbox possible, as well as the
    ability to quickly swipe to mark an email or flag it for later action.


    In this chapter, you find out Mail and its various features.


    If you''re wondering about IM (instant messaging) and iPad, check out Book II,
    Chapter 5 to discover the IM app, Messages.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_134_0.png)


    # # Adding an Account


    To use Mail app to access email on iPad, you first have to make settings for an
    existing email account on your iPad. You can add one or more email accounts using
    iPad Settings, including any email account that you''ve'
  merge: -1
