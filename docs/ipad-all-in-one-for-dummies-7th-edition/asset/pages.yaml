- pgno: 429
  md: '# 412 Preparing to Present


    simplest one: Because the speaker can sit down and join the audience around a
    table, in a circle, or in a group of chairs, the speaker/audience/teacher/student
    paradigm of many presentations is immediately broken — this can be a breath of
    fresh air. It certainly seems to make discussions and audiences lively.


    For presentations to large (or medium-size) groups, your iPad and a projector
    work well. But for a smaller group, a projector is often a bit of overkill. You
    can use your iPad for a presentation to a few people seated around a table or
    to be more iPad-like — seated or standing anywhere you want.


    Think about the possibilities. If you''re selling something that''s not easy to
    carry around, a photo album on your iPad is a helpful way to show customers what
    you''re talking about. A Keynote presentation — even a handful of slides shown
    one-on-one — be much more effective and impressive than a photo album or brochure.


    # Great presentation pointers


    Here are a few presentation pointers:


    +   **Avoid the dark.** If you''re using a projector, use the least possible amount
    of roomdarkening for your presentation. Make sure you can see your audience.


    +   **Use question-and-answer sections.** Frequent, short Q&A sections in your
    presentations to influence your audience as much as possible.


    +   **Use a map.** Let people know where they''re going in your presentation and
    where they are at any moment. When you''re reading a book, the head of theunread
    pages gives you an idea of how far you areve. With a presentation, one slide after
    another can come out of the deck with no clue to how each one fits into the presentation.


    +   **Use font sizes.** Have you ever looked closely at the presentations given
    by the late Steve Jobs and others at Apple? Consider using 60 points for the font
    size.


    Whether you''re creating your Keynote on a Mac or an iPad using iWork for iCloud
    with your browser, the audience will be far away (even if you''re just sitting
    across a table from them). In addition, you may have become accustomed to using
    font sizes that are smaller than sizes that appear on your screen. Go big


    +   **Buy a dock or cover for your iPad as a stand.** Standard iPad covers option
    you prop up your iPad display that sitting around you can get a good view of screen.
    Check out the iPad accessories in the online store, or search for iPad covers
    at search engine and find one that appeals to you.


    +   **Check out your setup.** Leave time to check out your equipment and make
    sure everything works properly.


    it-ebooks.info'
