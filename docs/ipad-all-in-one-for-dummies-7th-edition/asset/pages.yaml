  md: '# 170 Exploring the iTunes Store


    So, it''s time you get to know the iTunes Store: the easiest way to grab all movies,
    TV shows, and music that you love for viewing and listening to on your iPad.


    # Visiting the iTunes Store


    Using the iTunes Store from your iPad is easy with the preinstalled iTunes Store
    app. You just tap the iTunes app on the Home screen.


    Now you can roam around different options. You have music, movies, TV shows, and
    audiobooks to choose from. If you begin to purchase or rent an item and you''re
    not already signed in with your Apple ID, the dialog shown in Figure 1-1 appears,
    asking for your sign-in information. Enter your ID and password (you may have
    created one when you set up your iPad or may have already done) and tap OK.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_187_0.png)


    Tap here and enter your password.


    Figure 1-1: Log to the iTunes Store.


    Start exploring musical selections by tapping the Music button in the row of buttons
    at the bottom of the screen, if it''s not already selected, as shown in Figure
    1-2. Tap the See All link in any category of music to display more selections.


    Tap the Music button in the upper-left corner to go back to the featured Musical
    selections; then tap the Genres button at the top left of the screen. This step
    displays a list of music genres that you can choose from. Tap one. Items in the
    genre are organized by criteria, such as New and Noteworthy Albums and iTunes
    Essentials. Tap any listed item to see more details about, as shown in Figure
    1-3.


    The navigation techniques in these steps work essentially the same in any of the
    content categories (the buttons at the bottom of the screen), which include Music,
    Movies, Audiobooks, and TV Shows. Just tap one to explore it.'
