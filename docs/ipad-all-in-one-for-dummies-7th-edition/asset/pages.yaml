  md: '# Getting Started with Keynote on iPad 399


    +   * Play: Use this button to play your presentation on your iPad screen; if
    you have an external display adapter or Apple TV enabled in the Control Center,
    the slides appear on the display while the iPad screen shows the controls.


    Tap Settings on the Tools menu to access the following tools (see Figure 4-4):


    +   * Check Spelling: Turn on this option to have Keynote alert to spelling issues
    as you type.


    +   * Slide Numbers: This option lets you turn slide numbers on and off. Just
    as with pages of a Pages document, you should let the app handle the numbering
