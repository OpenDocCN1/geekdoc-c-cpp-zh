    # # Printing from Safari


    If you have a wireless printer that supports the Apple AirPrint technology (most
    major manufacturers such as HP, Epson, Lexmark, Canon, and Brother offer at least
    one AirPrint model at this point), you can print web content using a wireless
    connection. Here is how:


    +   1. With Safari open and the site you want to print displayed, tap the Share
    button.

    2. On the popup that appears, scroll to the right on the bottom list of buttons
    and tap Print.

    3. In the Printer Options dialog that appears (see Figure 6-21), tap Select Printer.

    4. In the list of printers that appears, tap the name of your wireless printer.

    5. If you need more than one copy, tap either the plus or minus button in the
    Copy field to adjust the number of copies to print.

    6. Tap Print to print the displayed page.


    The default is to print one copy, so you can skip this step if you don''t need
    more. If you have a printer capable of two-sided printing you can tap the Double-Sided
    switching page.


    www.it-ebooks.info'
