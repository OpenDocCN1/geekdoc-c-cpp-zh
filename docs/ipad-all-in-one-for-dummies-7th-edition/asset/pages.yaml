  md: "# 404 Using Transitions and Builds\n\nA little animation is a good thing. Feel\
    \ free to try all the options, but then decide which one — or maybe two — you\
    \ want for your presentation. Too many animations are distracting and compete\
    \ with the content you're presenting, unintentionally becoming the focus for the\
    \ audience.\n\n![](img/2a8a8d89daeb1b3896bd38ebf18af126_421_0.png)\n\n# Working\
    \ with transitions\n\nTap a slide and then tap Transition from the toolbar that\
    \ appears (refer to Figure 4-8). Tap a transition effect, such as Clothesline.\
    \ Tap the Options to make transition settings. To preview the transition, tap\
    \ Play.\n\nTransitions can work on slides as a whole or work on parts of slides;\
    \ when they work on parts of slides, they're often called builds. Note that a\
    \ transition consists of two parts:\n\n+   - Effects: These are the visual effects\
    \ that are displayed.\n- Options: Options include the direction in which the animation\
    \ moves as well as whether it starts in a tap or when a previous transition is\
    \ finished. Options also include the duration of the transition or the amount\
    \ of delay before it starts.\n\nThough a transition may appear to between two\
    \ slides, it happens after you tap a slide to the next one. The transition is\
    \ attached to the first slide in the sequence of two adjacent slides.\n\nHere's\
    \ how to build a transition:\n\n+   1. In the navigator on the left side of the\
    \ screen, press and hold the slide for which you want to build a transition and\
    \ tap Transition in the tools that appear.\n   The list of transition effects\
    \ appears in a popover, as shown in Figure 4-9. A number of transition effects\
    \ are available; swipe up and down to see all. (The list of transitions is controlled\
    \ by the Effects button at the bottom-left corner of the popover).\n2. When you\
    \ want a transition effect that interests you, tap the name and then tap Play\
    \ to select it and see preview.\n3. Tap the Options button in the bottom-right\
    \ corner of the popover (see Figure 4-9) to set the effect options, as shown in\
    \ Figure 4-10.\n4. Set the duration and when the effect should start.\n\nIf you\
    \ want the effect to start after a delay of a certain duration, use the Delay\
    \ setting."
