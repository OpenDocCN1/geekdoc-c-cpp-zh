  md: '# Backing Up to iCloud


    You need to be able to back up your iPad content only using iTunes, but with iCloud,
    you can back up via a Wi-Fi network to your iCloud storage. Note that whereas
    iTunes backs up everything, iCloud backs up what Apple considers your most important
    content — Apple never backs videos you get from sources other than iTunes, for
    example. Note that you can back up to iTunes or iCloud, but not at the same time.
    However you can always sync to iTunes which copies apps and documents.


    You get 5GB of storage (not including iTunes-bought music, videos, apps, and electronic
    books or content pushed automatically among your Apple devices by iTunes Match)
    for free, or you can pay for increased levels of storage (10GB for $20 per year,
    20GB for $40 per year, or 50GB for $100 per year).


    To perform a backup to iCloud, follow these steps:


    +   1. **Tap Settings on the Home screen.**



    &nbsp;See Chapter 5 in this minibook for details on creating an iCloud account.


    +   2. **Tap iCloud and then tap Backup (see Figure 9-9).**


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_181_0.png)


    +   3. **In the pane that appears (see Figure 9-10), tap the iCloud Backup On/Off
    switch to enable automatic backups, or to perform a manual backup, tap Up Now.**


    A progress bar shows how your backup is moving.'
