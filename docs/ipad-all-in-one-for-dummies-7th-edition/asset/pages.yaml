    # Working with builds


    Builds are much like transitions except, rather than occurring between slides,
    they work when elements within a single slide are displayed and control how those
    elements appear on the slide. For example, you might build a bulleted list displaying
    one bullet at a time. Here''s how to set a build:


    +   1. In the display portion of the screen, tap the object you want to build.


    Each object can have two sets of builds: effects used when the object appears
    and an effect when it disappears.


    +   2. To choose the type of build you want to apply — either a build-in or a
    build-out, as shown in Figure 4-12.


    +   3. Select the build you want to use, as shown in Figure 4-13.


    As with slide-to-slide transitions, as soon as you select an effect, tap the Play
    button and the effect previews for you.


    +   4. Tap the Options button at the bottom of the popper to set options, as shown
    in Figure 4-14.


    You can begin the build when you tap or after the previous object appears. You
    can also set a delay in seconds before the next step in the build begins. Note
    that a number in a yellow circle is created on the object you''re applying the
    build to; you can tap the number later to change back and get options.'
