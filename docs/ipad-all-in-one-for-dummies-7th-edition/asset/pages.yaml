- pgno: 290
  md: '# # Chapter 8: Playing Games


    # ## This Chapter


    +   - Appreciating iPad''s gaming strengths


    +   - Getting a grip on the accelerometer


    +   - Finding games and accessories of all kinds


    +   - Challenging friends in Game Center


    iPad is, after all, a close relative of the iPhone, and no matter who tells you
    that uses his iPhone to get done, he''s probably spending most of his time gaming.
    iPad outstrips iPhone as the ultimate portable gaming machine because of its beautiful
    screen (especially if you have a third-generation or later iPad with Retina display)
    and the ability to rotate the larger screen as you play and track your motions.
    You can download games from the App Store and play them on your device. You can
    also use the preinstalled Game Center to help you find and buy games, add friends
    to play against, and track scores.


    In this chapter, you discover how iPad is a great mobile gaming device, what kind
    of games are out, how to create a Game Center account and purchase and download
    games, how to play games against yourself and what cool accessories you need to
    become a completely awesome iPad gamer.


    Let the games begin!


    # ## Appreciating iPad''s Gaming Strengths


    The iPhone is a fun gaming device, but the screen is too small. Your computer
    is a good gaming device, but it may lack some of the tactile input of a touch
    screen. iPad might be just right as the ultimate gaming device for many reasons,
    including these:


    +   - iPad''s fantastic screen: if you have an iPad Air 2 you have a few things
    going for you here. First, the high-resolution, 7.7" screen has a backlit LED
    display. As Apple describes it, it''s "remarkably crisp and vivid." They''re lying.
    The In-Plane Switching (IPS) technology means you can hold at any angle (it has
    a 178-degree viewing angle) and still get good color and contrast. If you own
    a third-generation iPad (or later), things get even


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_290_0.png)'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 274 Appreciating iPad''s Gaming Strengths


    These versions of iPad with their Retina displays give you four times as many
    pixels as earlier iPad models (3.1 million, to be exact). You get 2048 x 1536
    resolution, greater color saturation, and a crisp image that rivals many HDTVs.

    Faster processor: The dual-core A8 chip in your iPad Air 2 is a super-fast processor
    that can run around your iPhone, making it a great device for gaming. The A8 chip
    is very speedy and drives the Retina display without sacrificing the ten-hour
    battery life iPads are known for. With iPad Air 2, the A8X chip offers 2.5x faster
    graphics than other models.

    Built-in accelerometer and three-axis gyroscope: Gamers will find these elements
    useful to shift around in a more versatile manner as they virtually move through
    games that involve motion. The built-accelerometer and three-axis gyroscope let
    you grab your iPad and use it as a steering or wheel game feature, so you really
    feel like you''re in action (With iPad 2, the gyroscope, accelerometer, and compass
    were added to help apps like Maps pinpoint your location and movements as you
    scroll around).

    M8 processor: This feature provides the ability to sense your movements. This
    ability is likely to result in some interesting gaming and exercise apps.

    Playing games in full screen: Rather than playing on a small iPhone screen, you
    can play most games designed for iPad in full-screen mode on your iPad. Having
    a full screen brings the gaming experience to a more engaging way than a small
    screen can ever.

    Dragging elements around the screen: The Multi-Touch iPad screen is responsive
    and if you''re about to be zapped by aliens in a fight-to-death computer game,
    responsiveness counts.

    The ten-hour battery life of an iPad: This long battery life on every version
    of iPad means you can suck energy out of it playing into the hours of night.

    Specialized game-playing features: Some games are coming out with features that
    take advantage of iPad''s capabilities. For example, Gameloft has come out with
    a version of its N.O.V.A. game that includes a feature called multiple-target
    acquisition, which lets you target bad guys in a single move to blow them out
    of the water with one shot. The Need for Speed racing games allow you to look
    in your rearview mirror to see what is coming up behind you, a feature made possible
    by iPad''s large screen, compared to an iPhone.

    Great sound: The built-in stereo speakers in the iPad Air 2 and iPad mini 2 are
    powerful little things, but if you want more up-close and personal, you can plug
    in a headphone, some speaker systems, or a microphone using the built-in jack.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_291_0.png)'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# Finding Some Very Cool Games


    # Understanding the accelerometer


    The iPad has a built-in motion sensor called an accelerometer, as well as a three-axis
    gyroscope. These allow developing apps for iPad to have lots of fun as they use
    the automatically rotating screen to become part of the gaming experience. For
    example, they


    can build in a compass device that reor itself automatically if you switch your
    iPad from landscape to portrait mode. Some racing games allow you to grab the
    iPad as if it were a steering wheel and rotate the device to simulate driving
    experience.


    # Finding Some Very Cool Games


    Now it''s time to tell you about my favorite iPad games (the part of the book
    where you wonder why I get paid for what I do, cause reviewing games is so much
    fun).


    # Looking at what''s out there


    First, take a look at the gaming landscape. Several types of games are available
    (some ported from iPhone and customized for iPad; price not if free);


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_292_0.png)


    +   - Arcade games include apps such Arcade Bowling (free with in-app purchases),
    Pinball Arcade ($0.99), and Foosball HD ($2.99).

    - Kids'' games are sometimes educational, but almost always entertaining. These
    include Ace Kids Math Games (free), AdditionUnderSea Adventures (free), and Monkey
    Wood School Adventure ($1.99).

    - Card and board games, such as Astraware Solitaire – 12 Games in 1 Handmark,
    Inc. ($0.99); Mahjong Deluxe ($0.99); and Payday Roulette 2 ($1.99).

    - Adventure games like Animal vs. Zombies (free), Expedition (free), AirAttack
    HD ($0.99), Amazon: Hidden Expedition (free with in-app purchases), and Carnivores:
    Dinosaur Hunter ($2.99).

    - Sports games, such as 2XL''sSnoCross ($1.99), Stick Golf HD ($2.99), and Pool
    Bar – Online ($2.99).


    # Exploring a half-dozen games


    Narrowing down choices to just a few must-have games is hard because everyone
    likes kinds of fun. To add to the choices, there are both iPhone– iPad-generated
    games that you use on your iPad, and more are coming all time. If you have a third-generation
    (or later) iPad, you might want to look for games that are optimized for the new
    Retina display.'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 276 Finding Some Very Cool Games


    Still, the following list is a sampling of six recommended games for you to try
    that won''t break the bank:


    +   **Scrabble for iPad ($9.99):** You remember Scrabble, that favorite old board
    game that can let you or put you to shame for your spelling and vocabulary skills?
    Scrabble is available on iPad, and it''s hot (Figure 8-1). Use your iPad to shuffle
    tiles. Use the drag-and-drop motion to play your letters. Want to share the fun?
    Reach out to your Facebook friends to take the game in the multiplayer level.


    +   **Broken Sword - The Swarming Mirror ($0.99):** This classic adventure lets
    you virtually become the main character to experience all the game has to offer.
    Great art and animation distinguish this game, and the iPad version (see its description
    in the Game Center Store and see Figure 8-2) has a handy hint system you''ll appreciate.


    +   **Civilization Revolution for iPad ($6.99):** If you like a world-building
    type of game, you''ll find Civilization right up your alley. It has been fine-tuned
    for iPad to be even better than the iPhone version. The game also offers a feature
    called Scenario Creator, which lets you create your own unique challenges, essentially
    allowing for unlimited variety in the game.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_293_0.png)


    +   **Monkey Island 2 Special Edition: LeChuck''s Revenge for iPad ($4.99):**
    A point-and-click adventure game classic on iPhone, in its iPad incarnation, Monkey
    Island has great graphics and sound, and an engaging story at its heart. If you
    like adventure games, don''t miss this one.'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# Finding Some Very Cool Games 277


    Minecraft Pocket Edition ($6.99): Minecraft is a wildly popular game that involves
    a virtual reality in which you build things with blocks (see Figure 8-3). These
    aren''t Tinkertoys — with Minecraft, people are building entire cities, engineering
    feats, and realities.


    Chess Pro ($79.99): You can play against the computer or another player. You can
    modify the appearance of the chess pieces. It even features that help beginners
