    **Month:** See one month at a time and switch among months in Month view (see
    Figure 3-3). You see the name and timing of each event. In this view, days that
    have scheduled events display the color of the calendar associated with the event.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_458_1.png)


