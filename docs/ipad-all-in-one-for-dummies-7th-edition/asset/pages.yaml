    # Shopping Anywhere Else


    Many stores have added iPad-friendly videos to their collections, so you do have
    alternatives to iTunes for your choice of movies or TV shows. You can also shop
    for music from sources other than iTunes, such as Amazon.


    You can open accounts at these stores using your computer or iPad''s Safari browser
    and then following a store''s instructions for purchasing and downloading content.
    Keep in mind that costs will vary. For example, one provider is Hulu. To get iPad-friendly
    content from Hulu, you have to sign up for the Hulu Plus service and pay a monthly
    fee (less than $10). Then, download the app directly from Hulu and start watching.


    Here are some online stores and content providers that offer iPad-compatible content:


    +   * TV (www.tv.com) provides its online television and movie content to iPad.

    * Ustream (www.ustream.tv) has a mobile app for streaming sports and entertainment
    programs to mobile devices.

    * ABC (http://abc.go.com) and CBS News (www.cbsnews.com) stream live TV programming
    to the iPad.

    * Netflix (www.netflix.com) makes movies and TV shows available that can be streamed
    to the iPad.

    * PBS (www.pbs.org), the king of documentary and arts movie programming, has several
    apps for iPad including Nova Elements iPad App, Kids iPad app, and PBS for other
    programming.

    * Imp4hub (www.imp4hub.com) is all free MPEG-4 movies for iPad, iPhone, and Android
    devices.


    Additionally, if you get content on your Mac or Windows machines, you can stream
    it to your iPad using Air Video ($2.99) and Air Video Server, and let it do on-the-fly
    conversion. For more information, go to www.method.com/air-video/index.html. Another
    free utility for Windows, OS X, and Linux that converts movies to an iPad-friendly
    format is HandB. Go to http://handbrake.fr for more information.


    There are also stream content that you pay a subscription fee or are an existing
    customer. Two good ones are Xfinity TV from Comcast and TWCable from Time Warner.


