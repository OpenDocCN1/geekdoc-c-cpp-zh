  md: '# Visiting a contact''s website


    Everybody (well, almost everybody) now has a website, so whether your contact
    is a person or an international conglomerate, you''re likely to find an associated
    website that you might want to access now then. You can access it from your iPad
    using the Contacts app.


    If you entered information in the Home Page field of a contact record, the text
    you entered automatically becomes a link to that person''s website. With Contacts
    open, tap a contact to display the person''s contact information on the page at
    the right and then tap the link in the Home Page field, as shown in Figure 5-17.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_502_0.png)


