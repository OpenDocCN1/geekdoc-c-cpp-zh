- pgno: 328
  md: '# Getting Directions, Information, and More


    # Getting Directions, Information, and More


    Maps can provide all kinds of information, from directions from one location to
    the street address and phone number for a particular business or landmark.


    # Getting directions


    You can get directions by using pins that you drop on a map for a starting and
    ending locations, or by entering an address or name of a place, such as an airport
    or shopping mall. The directions are shown in a blue line leading from one to
    another. You can choose directions by car or foot. Directions also give you an
    idea of the miles and how hours it will take you to get your destination (It will
    take 15 hours and 43 minutes, for example, to walk from the Bronx Zoo to the Empire
    State Building — if you wondered.) Here are the steps to get directions to two
    locations in Maps using pins:


    +   1. With at least one pin on your map (at your destination) in addition to
    your current location, tap Directions in the top-left corner of your screen and
    then another location on the list that appears.


    A line appears, showing the route between your current location and the closest
    pin. (See Figure 2-14).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_328_0.png)


    **Figure 2-14:** Go from pin to pin on your map to get directions.


    +   2. Tap the Drive or Walk tab to get the kind of directions you prefer; tap
    Clear to return to the Maps main screen.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 312 Getting Directions, Information, and More


    +   3. You can also enter two locations in the boxes at the top of the page to
    get directions from one to the other.


    Here are the steps to get directions in maps by typing the addresses in the Search
    fields:


    +   1. Tap the Directions button in Maps and then tap the field labeled Start.


    The keyboard appears (see Figure 2-15).


    +   2. Enter a different starting location.


    +   3. Tap in the End field and enter a destination location. Tap Route.


    The route between the two locations displays. If you like, you can tap the Drive
    or Walk to select a category of information once the route is displayed.


    You can also tap the Information bar that appears when you select a pin and use
