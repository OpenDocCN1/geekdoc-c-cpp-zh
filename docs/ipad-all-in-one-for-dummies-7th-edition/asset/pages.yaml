    Pad users are all different; some face visual, motor, or hearing challenges. If
    you''re one of these folks, you''ll be glad to hear that iPad offers some handy
    accessibility features.


    To make your screen easier to read, you can adjust the brightness or change wallpaper.
    You can also set up the VoiceOver feature to read onscreen elements out. There
    are a few features you can turn on or off, including Zoom, Invert Colors, Selection,
    Large Type, and more.


    If you struggle to hear your computer''s sounds, you can do the obvious and adjust
    the system volume. The iPad also has settings for mono audio (useful when you''re
    wearing headphones) and a setting to use Auto-text. iPad features that help you
    deal with physical and motor challenges include Assistive Touch for those who
    have difficulty using the iPad touch screen, Switch Control for working with adaptive
    accessories, and the Home Click Speed and Call Audio Routing that allow you to
    adjust how quickly you have to tap the iPad screen with features.'
