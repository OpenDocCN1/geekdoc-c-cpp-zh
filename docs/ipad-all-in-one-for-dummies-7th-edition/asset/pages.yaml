  md: '# 410 Preparing to Present


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_427_0.png)


    # Preparing to Present


    After you''ve dotted every i and crossed every t in your presentation, added all
    the great ideas you''ve been storing in your brain, and tweaked the animations,
    your presentation is done. However, you still have to prepare for your presentation.


    # Using a projector


    The cable known as the Lightning to VGA Adapter ($49 from the Apple Store) connects
    your iPad to any VGA device, such as a projector. With it, you can use Keynote
    to give your presentation. There''s also a $39 for older iPad connectors.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_427_1.png)


    The Digital AV adapter cable accessory is available for $49 for the Lightning
    version and $39 for the Dock version. You can use it to connect to devices as
    HDTVs and many projectors that have HDMI connectors.


    When you connect a projector (or any other type of display) to view your iPad
    with the HDMI or VGA adapter, the Keynote app can sense that it has a second display.
    It uses this display when you start a slideshow in the Keynote app. (See the "Playing
    Your Presentation" section, later in it) While it''s sending the presentation
    to the external display, it lets you control it from your iPad. Figure 4-18 shows
    what you see on the iPad as it plays a presentation on an external display.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '![](img/2a8a8d89daeb1b3896bd38ebf18af126_428_0.png)


    The slides appear on the external display, but you can control the presentation
    using your iPad. On the left side of the screen, a navigator shows thumbnail images
    of your slides. Being able to see the next slide helps you transition elegantly
    without shuffling papers and distracting your audience and yourself. You can tap
    the arrows in the center of the iPad screen to move forward and backward among
    slides.


    You can also mirror or stream what''s on your iPad connected to your HDTV''s HDMI
    port.


    Mirroring shows what''s on your screen, such as a Keynote slide. You can zoom
    in and rotate your screen on your iPad, and that''s what you''ll be mirrored on
    your TV. As you move through your Keynote presentation on your iPad, the presentation
    on the TV changes right along with it.


    # Using nanopresentations


    iPad is a game-changer in many ways. Its size (and therefore its portability)
    and its remarkably clear screen (especially on third-generation or later iPads
    with Retina display) are only two of its features that can open new opportunities.
    Keynote for iOS can help you take advantage of nanopresentations (presentations
    you make one-on-one or to a small group of people).


    Whether you use presentations as a presenter or an audience member, you''ll probably
    be pleasantly surprised at how well presentations to small groups can work. Perhaps
    the most interesting difference is


