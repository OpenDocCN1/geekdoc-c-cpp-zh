    # Finding a Missing iPad


    You can take advantage of the Find My iPad feature to pinpoint the location of
    your iPad. This is a very handy feature if you left your iPad or somebody walks
    away with it. Find My iPad lets you not only track down the culprit but wipe off
    the data contained in it if you have no way to get the iPad back.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_179_0.png)


    If you''re using Family Sharing, your family can help each other if someone in
    your family loses an iOS device. Anyone in the family can find the device and
    play a sound without having to sign into the missing device with its password.
    This works even if the ringer on the iPhone is turned off. See Book II, Chapter
    1 for more Family Sharing.


    Follow these steps to set up this feature:


    +   1. Tap Settings on the Home screen.


    +   2. Tap iCloud.


    +   3. In the iCloud settings that appear, tap Find My iPad.


    +   4. Tap the On switch for the Find My iPad setting (see Figure 9-7) that appears
    to turn the feature on if it isn''t already.


    +   5. Tap the Last Location On so that Find sends your iPad''s location to Apple
    if your battery is almost out of juice, if you''d like.


    If your iPad is lost or stolen, go to www.icloud.com on your computer and enter
    your ID and password. Click the Find My button to display a map of its location,
    as shown in Figure 9-8. Click the circle representing your iPad; then click the
    Information button (the small i) in the toolbar that appears. In the dialog that
    appears, to erase all information from your iPad in a process called wiping, click
    the Erase iPad button. Remember that this action erases all content, including
    contacts, music, notes, and so on, for good. To lock the iPad from access by others,
    click the Lost Mode button.'
