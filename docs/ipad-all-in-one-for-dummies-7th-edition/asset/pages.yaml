  md: '# Chapter 3: Keeping On Schedule with the Calendar and Clock Apps


    # In This Chapter


    +   - Viewing your calendar


    +   - Adding and repeating calendar events


    +   - Working with, searching, and sharing calendars


    +   - Deleting events


    +   - Using the Clock app


    Most people have busy lives full of activities that aren''t always to keep track.
    You may need a way to stay on top of all those work-related and personal activities
    and appointments. The Calendar app on the iPad is a simple, elegant, electronic
    day that helps you do that.


    In addition to enter events and view them by the day, month, or year, you can
    set up Calendar to provide alerts to remind you of your obligations, and you can
    search for events by keyword. You can also set repeating events, such as the weekly
    staff meeting, a regular social get-together, or monthly flea treatments for your
    cat. By taking advantage of the new Family Sharing feature in iOS 8, you can create
    a family calendar that everybody in your family can add to.


    Another preinstalled app is Clock. Though simple to use, Clock helps you view
    the time in multiple locations, set alerts, and use a timer and stopwatch.


    In this chapter, I show you how to master simple procedures for getting around
    in your calendar, creating a family calendar, entering and editing events, setting
    up alerts, and searching. You also discover the simple ins and outs of using Clock.


