  md: '# Playing through the Game Center 279


    # Playing through the Game Center


    The Game Center is an app that comes preinstalled with iPad. If you''re into gaming,
    you may enjoy the features that allow you to challenge friends to beat your score;
    games; and keep track of your games, friends, and achievements.


    Of course, you can also download games from the App Store or play games and them
    on your iPad without having to use Game Center. What Game Center provides is a
    place where you can create a game profile, add a list of gaming friends, keep
    track of and share your scores and perks, and shop for games (and only games)
    in the App Store, with listings of toprated games and game categories to choose
    from.


    Think of the Game Center as a kind of social networking site for games, where
    you can compare your scores and find players to challenge. The Achievements shows
    you your score history for all the games you play. Finally, Leaderboards allows
    you to compare your performance with your gaming friends.


