- pgno: 398
  md: '# # Working with Cells 381


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_398_0.png)


    **Figure 3-16:** Use these tools to input numeric data.


    These buttons let you choose the formatting for the cell you''re editing. If you
    need a symbol (such as stars for ratings or a currency symbol), it''s added before
    or after the numeric value as appropriate. Your formatting options, from top to
    bottom, are described in this list:


    +   * **Currency:** This option adds the appropriate currency symbol, such as
    $, or €.

    * **Percentage:** The percent symbol follows the value.

    * **Stars (rating):** This option lets you display a number from 1 to 45 as a
    star rating. To change the number of stars, type a new number or tap the star
    in the cell or the display above the keyboard. You can use stars in a spreadsheet
    and sort the column of stars so that the ratings are ordered from highest to lowest,
    or vice versa.

    * **Check box:** A check box is either selected or not. Check boxes are selected
    and deselected by a user or as the result of a calculation.


    # # Customizing check boxes


    A check box can indicate, for example, that an item is in or out of stock (yes/no
    or true/false). However, you can also use it to represent numeric data. Computers
    and programs often represent nonzero and zero values as yes/no or true/false values.
    If you show the number of in-stock items in a cell, you can use a check box to
    indicate that none is in stock (a deselected check box) or that items are in stock
    (a selected box). Numbers handles the conversion for you.


    | Book IV Chapter 3 | Counting on Numbers |


    www-it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# 382 Working with Cells


    Here''s how check box customization can work:


    +   1. Double-tap a cell to start editing it; tap the 42 icon and tap the Checkbox
    button when the keyboard opens.


    You see a check box in the selected cell; in the area above the keyboard, you
    see the word *false*, as shown in Figure 3-17. The green outline distinguishes
    the word *false* from text you type in. It has the value *false* because, before
    you type anything, its numeric value is zero.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_399_0.png)


    +   2. Type a nonzero value.


    This value can represent the number of items in stock, for example.


    +   3. Tap the Checkbox button again.


    You see the value you changed to *true* (see Figure 3-18) and that the check box
    is selected in the table.


    Because the formatting is separate from the data value, you sometimes display
    the in-stock inventory count as a number and sometimes the check box. Customers
    are likely to care only about the check box, but the inventory manager cares about
    the number.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_399_1.png)


    Everything in Numbers is linked, so you don''t have to worry about a sequence
    for most things. If you''ve followed these steps, you''ve seen how to enter a
    number and have control it check box, but that''s only one of at least three ways
    of working with a check box.


    With a selected cell and the Checkbox formatting selected, you see the true/false
    value above the keyboard and the check box itself in the table. Tap the check
    box in the table: The true/false value is reversed, and it is the state of the
    check box itself.


    Likewise, if you tap the word *true* or *false* in the display above the keyboard,
    the check box flips its value and true/false reverses.'
  merge: -1
  img_proc: true
- pgno: 400
  md: 'When you tapping a formatting button, it turns blue and formats the number
    in the selected cell (or cells). You can tap another formatting button to switch
    to another format (from stars to a percentage, for example). Tapping a highlighted
    formatting button turns it off without selecting another.


    # Entering date/time data


    Tap the clock button on the keyboard to enter date/time or duration data, as shown
    in Figure 3-19. The Date & Time button lets you specify a particular moment, and
    the Duration button lets you specify (or calculate) a length of time.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_400_0.png)


    **Figure 3-19:** Enter date and time, or duration, data.


    Above the keyboard, the units of a date or duration display. To edit a date or
    time (or both), tap Month in the Formula bar and use the keypad to select the
    month. (The keys have both the month name abbreviations and the numbers on them).
    Similarly, tap any other time increment and enter a value. As you do, the display
    changes to show the value. (Tapping AM or PM toggles the value — you don''t need
    to type anything.)


    # Entering text data


    When you tap the T button to enter text, the standard QWERTY keyboard appears,
    as shown in Figure 3-20.


    As with most keyboards, you can switch among letters, numbers, and special characters.
    (If you need a refresh on how to do it, see Book 1, Chapter 2.)) Everything you
    type or dictate is inserted into the selected cell you tap until the Done button,
    which is at the right of the display above the keyboard. If you enter a Return
    character, it''s part of the text in the cell. The cell automatically expands
    vertically to accommodate the text you type, and you can resize the column so
    that the cell is the appropriate size. Remember, these specialized features are
    not available on Bluetooth keyboards, so it''s often preferable to use the onscreen
    keyboard when using Numbers.


    | Book IV |

    | Chapter 3 |

    | Counting Numbers |'
  merge: -1
  img_proc: true
- pgno: 401
  md: '# 384 Working with Cells


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_401_0.png)


    Figure 3-20: Enter text.


    # Entering formulas


    Tapping the equal sign (=) button lets you enter a formula, which automatically
    computes values based on the data you type. The result of the formula can display
    in a cell in any of the usual formats, and that value can be used in a chart.


    When you''re entering a formula, the four buttons controlling the date-and-time,
    and numeric keyboards disappear. In their place, a button with three dots appears.
    Tapping this returns you to the display that gives you access to the other three
    keyboards. This setup is a master of Numbers space once.


    Formulas are accompanied by good news and bad news. The good news is that you
    don''t have to type many common formulas: All spreadsheets have the same built-in
    list of formulas. The bad news is that the list of formulas is quite long.


    Formulas can consist of numbers, text, dates, durations, and true/false values.
    They can also include the results of formulas and the values of individual cells.


    The example in this section, which presents the basics of creating a formula in
    Numbers, adds a number to the value of an existing cell and then displays the
    result in the cell that contains the formula. In this example, I use the Team
    Organization template that you see in the figures throughout this chapter.'
  merge: -1
  img_proc: true
