    that you''ve activated and set a User Name and Password for your Facebook and/or
    Twitter accounts under Settings. Follow these steps:


    +   1. With Contacts open, tap a contact.

    2. Tap the Edit button.

    3. Scroll down and tap Social Profile.

    4. In the list that appears (see Figure 5-10), enter a Twitter label.


    If you want to create a different social networking field, tap Add Social Profile.
    A Facebook field appears. You can also tap again to get a Flickr account, and
    then a LinkedIn account, and so on.


