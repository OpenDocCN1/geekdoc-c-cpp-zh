  md: '# Understanding Multitasking Basics


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_55_0.png)


    **Figure 24:** Go to the Summary tab to find out whether you need to update iOS.


    A new iOS introduces new features for your iPad. If a new iOS version appears
    after you''ve bought this book, go to the companion website, www. ipmadeclear.com,
    for updates on new features.


    # Understanding Multitasking Basics


    Multitasking means that you can easily switch from one app to another without
    closing the first one and returning to the Home screen. This is accomplished by
    viewing all open apps and jumping from one to another, and quitting an app by
    simply swiping upward. Follow these steps to multitask:


    +   1. Open an app.

    2. Press the Home button twice.

    3. On the App Switcher view that appears (see Figure 2-15), scroll to the left
    or right until you find the other open app that you want to switch.

    4. Tap an app to switch to it.


    Press the Home button to close the App Switcher and return to the app you were
    working in.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '![](img/2a8a8d89daeb1b3896bd38ebf18af126_56_0.png)


    # # Exploring Multitasking Gestures


    Multitasking involves jumping from one app to another. Rather than using the Home
    button to open the App Switcher and then moving from one app to another, you can
    use iOS''s multitasking gestures. You turn on these gestures by tapping Settings
    on the Home screen, and then in the General pane, set the Multitasking Gestures
    switch to On.


    Here are the three multitasking gestures:


    +   * Swipe up with four or five fingers on any Home screen to reveal the App
    Switcher.

    * Swipe down with four or five fingers to close the App Switcher.

    * With an app open, swipe left or right using four or five fingers to move to
    the next app. (The apps are in order by what was most recently used, whereas swiping
    right opens apps from least recently used, whereas swiping left opens apps from
    least most recently used.)


