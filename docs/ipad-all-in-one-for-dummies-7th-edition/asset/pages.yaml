  md: '# # Chapter 1: Managing Files and Printing


    # In This Chapter


    +   - Understanding how iPad stores files

    - Sharing files by emailing, AirDrop, or through the cloud

    - Setting up Home Sharing

    - Printing wirelessly from iPad


    Okay, I''m going to be very upfront about this: Apple has not used a traditional
    paradigm for moving files to and from your iPad or managing files on the device.
    In essence, this is partially a chapter about the following:


    +   - What iPad does differently from how traditional file management is handled
    by OS X''s Finder or Windows Explorer (Windows 7 and earlier) or File Explorer
    (Windows 8 and later). For brevity, I just refer to this using the Windows 8 nomenclature,
    File Explorer, in the rest of this chapter.


    +   - How you can get things in and out of the device without a USB port or DVD
    drive.


    One way to back up content is iCloud, which allows you to store content online,
    and in this chapter as in Book 1, I discuss. In addition, you can share content
    with somebody in close proximity by using the AirDrop technology.


    The other topic in this chapter is printing, and there are two options here: Use
    iPad''s native printing capability with a compatible wireless printer or use a
    third-party printing app.


    # # Finding Your Files


    iPad stores files locally by app, or if you use iCloud, iPad automatically stores
    and shares files among iOS devices and with your Mac or PC. Here''s how this works.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_434_0.png)'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 418 Finding Your Files


    # How iPad stores files


    Though there''s no Mac Finder or Windows File Explorer on one place, you can view
    all your stored files in one place. Open the Photos app, for example, and you
    see lots of photos, each one contained in a separate file. The Music app contains
    audio files, Videos movie files, iBooks contains e-books, and if you own Pages,
    it contains word-processing documents (as shown in Figure 1-1), and so on.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_435_0.png)


    **Figure 1-1**: Documents stored by Pages.


    Though there''s no Windows File Explorer feature on iPad, when you connect use
    iPad to a PC, you can use the Windows File Explorer feature on your computer to
    view the files stored on your iPad.


    How did those files get there? You may have created them in an app on iPad; you
    may have downloaded them from the Internet, as with music or videos from iTunes;
    you may have synced them from your computer or pushed them to all your iOS devices
    from iCloud, as with files or photos. Perhaps you grabbed a document from a website
    or from an online service such as Dropbox.


    Depending on the app you open, you may see a Documents button to display thumbnails
    of documents (refer to Figure 1-1); libraries of photos, as in Photos; albums
    of music or individual song files, as in Music (see Figure 1-2); or bookshelves
    or lists of e-books, as in iBooks. Each app offers a slightly different way to
    find whatever you''ve created on, downloaded to, or synced to your iPad.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# Sharing Files 419


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_436_0.png)


    Figure 1-2: Music shows you files by album, song, composer, artist, and more.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_436_1.png)


    See Book II, Chapter 1, for information about buying and downloading content,
    and see Book I, Chapter 5, for information about syncing to your computer and
    buying apps. Book IV, Chapter 1, gives some details about moving files around
    or using iWork products.


    # Going with iCloud


    iCloud isn''t so much as a place as it is a storage service. If you choose to
    back or share files using iCloud, you can''t go to a website and organize those
    files. They''re automatically backed up from your devices, and new files created
    or downloaded to one device are automatically pushed to your other devices. In
    essence, this is invisible to you. You still access these files by opening the
    associated app.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_436_2.png)


    Note that iCloud Drive, which released just this book was going to press, will
    eventually replace simple iCloud storage. iCloud Drive includes storage, contact
    and syncing capabilities, email, location services, and app sharing.


    # Sharing Files


    As mentioned in the previous section, iPad does not let you get all the way your
    computer does with a series of folders and files. You open files in individual
    apps, as Photos and Videos. You cannot save files to a storage medium, such as
    a flash drive that you can remove and replace in another computing device. Therefore,
    managing and sharing your files with other devices or other people works a bit
    differently than on your iPad.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# 420 Sharing Files


    You have a few options for getting files out of your iPad:


    +   * Sync them via iCloud, which automatically pushes them to other iOS devices.

    * Email them.

    * Sync via iTunes with a computer to share things like calendar events, contact
    records, music, or photos, which is covered in Book I, Chapter 5.

    * Share them over a network.

    * Share them with somebody in close proximity using AirDrop.


    Also consider using wireless devices from manufacturers such as Kingston or Maxell
    for external storage.


    # Relying on good old email


    You can use tools in individual applications to email files to yourself or others.
    If you''re working on a document on your iPad and then want to get a copy of it
    on your computer You can''t exactly save a copy because (remember) no removable
    storage medium exists on your iPad, so you email the file and save the email attachment
    to your computer hard drive or other storage.


    Here''s an example of emailing from an app, in this case, Photos:


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_437_0.png)


    Figure 1-3: View the several options for sharing.


    www.it-ebooks.info'
