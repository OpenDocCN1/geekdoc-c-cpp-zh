    +   5. Tap Done.


    The information is stored in your Contacts address book.


    After you store information in Contacts, you can also share it with friends from
    by tapping the Share button in the address record. See Book V, Chapter 5 for more
    about using Contacts.


    # Sharing location information


    Have you found a fantastic restaurant or movie theater that you absolutely have
    to share with a friend? From Maps, you can use a simple procedure to email a link
    to your friend. When your friend is connected to the Internet and taps the link,
    that link opens the map to the location in Maps (free service).


    After you save a location in Contacts, take these steps to share a location:


    +   1. Tap a pin to display the information bar.

    2. Tap the Share button at the top right of the Maps screen and then tap Selected
    Location.

    in the dialog that appears (see Figure 2-18), you can choose to share via AirDrop,
    text message, Facebook posting, tweet, or email.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_332_0.png)


    +   3. Tap Mail to see how this option works.'
