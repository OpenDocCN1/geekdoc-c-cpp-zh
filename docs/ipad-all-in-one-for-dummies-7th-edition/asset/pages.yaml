    # Adding Web Clips to the Home Screen


    The Web Clips feature allows you to save a website as an icon on your Home screen
    so that you can go to the site at any time with one tap. You can then reorganize
    these icons just as you can reorganize apps. (See Chapter 2 in this minbook for
    information on organizing apps on Home screens.)


    Here are the steps for adding web clips:


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_125_2.png)


    +   1. With Safari open and displaying the site you want to add, tap the Share
    button.


    +   2. On the popup that appears (refer to Figure 6-9), tap Add to Home Screen.


    +   3. In the Add to Home dialog that appears (see Figure 6-15), you can edit
    the name of the site to be more descriptive (it like you by tapping the name of
    the site and using the keyboard to edit its name.


    +   4. Tap the Add button.


    The shortcut is added to your Home screen.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_125_3.png)


    You can have up to 15 Home screens on your iPad to accommodate the web clips and
    apps. You can use folders to organize your web clips and save space on your Home
    screen. If you want to delete an item from your Home screen for any reason, press
    and hold any app on the Home screen until all items start to jiggle and Delete
    buttons appear on all items except preinstalled apps. Tap the Delete button on
    the item you want to delete, and it''s gone. (To get rid of the jiggle, press
    the Home button.)'
