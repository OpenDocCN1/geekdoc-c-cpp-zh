  md: '# Setting Up an iMessage Account


    iMessage is a messaging service that is available through the preinstalled Messages
    app that allows you to send and receive instant IMs from others using an Apple
    iOS device (and on your Mac, if you have OS X Mountain Lion or later).


    Instant messaging from email or posting to Facebook in an important way. Whereas
    you might email somebody and wait days or weeks before that person responds, or
    you might post a comment to your Facebook timeline that could sit for a while
    before anyone views it, instant messaging communication happens almost immediately.
    You send an IM, and it appears on some-body''s Mac, iPhone, iPod touch, or iPad
    read away; if the person wants to participate in a live conversation, conversation
    begins immediately, allowing a back-and-forth dialogue in real time.


    To setup iMessage, follow these steps:


    +   1. Tap Settings on the Home screen.


    +   2. Tap Messages.


    +   3. If iMessage is not set to On, tap the On/Off switch (shown in Figure 5-4)
    to turn it on.


    The settings shown in Figure 5-4 display.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 226 Using Messages to Create and Send Text, Audio, and Video Messages


    +   4. Check the Send & Receive setting to be sure that the email account associated
    with your iPad is correct.


    This should be set up automatically based on your Apple ID.


    +   5. To allow a notice to be sent to a sender to indicate that you''ve read
    a message, tap the On/Off switch for Send Read Receipts.


    You can also choose to show a subject field in messages, for your messages.


    +   6. If you want to include a subject field in messages, tap the On/Off switch
    for the Show Subject field.


    +   7. Tap the Home button to close Settings.


    Messages adds your iPhone''s number (if you have an iPhone using the same iCloud
    account) automatically to a location where people can message you. Your iCloud
    email addresses are also added. To add other email accounts for Messages to use,
    tap the Send & Receive button, tap Add Another, and then follow the directions
    to add another email account. To delete an account, tap the information button
    to the right of it, tap Remove This Email, and then confirm the deletion.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_243_0.png)


    # Using Messages to Create and Send Text, Audio, and Video Messages


    You''re ready to use iMessage. This is a remarkably simple process that involves
    typing and sending a message and waiting while the other person types and sends
    a message back. This can go on for hours, so prepare a quick message ahead of
    time, just in case (I have to walk my dog, the cat just exploded ... you get the
    idea.).


    # Sending text messages


    If you have words to share, text messages are the tried-and-true method. Follow
    these steps to use Messages to send a text-based instant message:


    +   1. From the Home screen, tap Messages in the Dock.


    +   2. If this is the first time you''re using Messages, on the screen that appears
    (see Figure 5-5), tap the New Message button to begin a conversation.


    +   3. Address your IM.


    You can address a message in a couple of ways:


    +   Begin to type a name, email address, or phone number in the To field, or tap
    the iPad''s Dictation key (not present on the iPad 2) on the onscreen keyboard
    and speak the address, and a list of matching appears.'
