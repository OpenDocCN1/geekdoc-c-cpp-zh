  md: '# # Chapter 6: Browsing the Web


    # In This Chapter


    +   - Discovering Safari

    - Creating and using bookmarks

    - Using Safari Reading List and Reader

    - Saving web clips to the Home Screen

    - Adding an image to your Photo Library

    - Emailing a link to a website

    - Making private browsing and cookie settings

    - Posting photos and printing from Safari

    - Using iCloud


    Getting on the Internet with your iPad is easy using its Wi-Fi or 3G/4G capabilities.
    After you''re online, the preinstalled browser, Safari, can take you around the
    web. Safari will be familiar to you if you''ve used an Apple device before or
    the browser on your Mac or PC. You''re actually using a hybrid of the mobile version
    of Safari, also used on iPhone and iPod, and the desktop.


    If you''ve never used Safari, this chapter helps you get up to speed. In this
    chapter, you discover how to open Safari and navigate among web pages using tabs
    browsing, as well as how to use iCloud to share browsing history among devices.
    Along the way, you learn about All Tabs view, a version of which has been available
    in iPhone and now comes to the iPad. All Tabs lets you view your open pages as
    thumbnails.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_112_0.png)


    You see how to create a bookmark for a favorite site or web clip on your Home
    screen. You can also view your browsing history, save images to your Photo Library,
    post photos from within Safari, and email a hotlink to a friend. Two useful features
    are Shared Links as URLs posted to your Twitter and iCloud Keychain, for storing
    passwords and credit card information in one handy, safe place online. You explore
    the Safari Reader and Safari Reading List features, including the ability to save
    clips and web pages to Reading List, and find out how to keep yourself safe while
    using private browsing. I also show you the simple steps in printing what you
    find.'
  merge: -1
  img_proc: true
