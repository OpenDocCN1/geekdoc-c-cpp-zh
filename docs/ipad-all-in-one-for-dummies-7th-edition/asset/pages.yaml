- pgno: 24
  md: '# # Chapter 1: Buying Your iPad


    # ## In This Chapter


    +   Finding out what''s new with iPad Air 2, iPad mini 3, and iOS 8.0

    - Picking the right iPad for you

    - Choosing where to purchase your iPad

    - Contemplating accessories for your iPad


    You''ve read about it and seen people using it everywhere you go. You know you
    can''t live without your own iPad to have fun, explore the online world, read
    e-books, organize your photos, play games, and more.


    Trust me; you''ve made a good decision because the iPad does redefine the computing
    experience in an exciting new way.


    This chapter is for those of you who don''t already have an iPad. Here is where
    you discover the different iPad models and their advantages, as well as where
    to buy this little gem and the accessories you can purchase to trick out with
    your iPad.


    # ## Discovering What''s New in iOS 8.0


    iPad gets its features from a combination of hardware and its software operating
    system being iOS 8.0, though small updates appear all the time, so by the time
    you''re reading this, you might have 8.1, 2, or 3. If you''ve seen an iPad in
    action or on one, it might be helpful to understand what new features the iPad
    Air 2 and iPad mini 3 bring to the table (which are all covered in more detail
    throughout this book). In addition to features on previous-generation iPads through
    iPad Air, the latest iPad models offer


    Design: iPad Air 2 is lighter (.96 lb.) and thinner (.24 inches thick) with thinner
    bezel for more screen area. Both iPad Air 2 and iPad mini 3 offer amazingly crisp
    displays with 2048 x 1536 resolution — which, trust me, makes for a very good
    viewing experience.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_24_0.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Discovering What''s in iOS 8.0


    +   An improved chip: The 64-bit A8 processor in the iPad Air 2 increases the
    processor and graphics speeds accomplished by the A7 chip on the previous generation
    iPad. The iPad mini 3 retains the A7 processor.


    +   Better Wi-Fi: Two-antennae dual-channel Wi-Fi and the use of MIMO (multiple-input,
    multiple output) technology allows for much faster wireless connections. In iPad
    Air 2, support of the latest Wi-Fi standard, 802.11 ac, ups the ante on Wi-Fi
    performance. Note that the iPad mini 3 doesn''t support this standard.


    +   M8 Motion Processor: Processor on the iPad Air 2 processes features like the
    gyroscope and accelerometer factor.


    +   Video Recording: Recording features include the addition of a Slo-mo mode
    as well as stabilization and face detection.

    Touch ID: This security feature has been added to iPad models. Essentially, sensors
    in the Home button allow you to train iPad to recognize your fingerprint and grant
    you access to your iPad with a finger to use the new Apple Pay feature to buy
    items without having to update your payment information every time.


    +   A barometer sensor: On iPad Air 2, this new sensor makes possible for you
    to sense pressure and weather around you. One''s especially cool when hiking a
    mountain where the weather may change as you climb.


    +   A "soft" SIM card: With iPad Air 2 you get a software-based SIM card. This
    means that if you get an iPad that supports a 3G/4G connection through a phone
    carrier such as AT&T, you don''t have to get a little plastic card from the service
    provider to hold all account data. SIM functionality is now built into the iPad
    Air 2, and you can use it to connect to your account. This is great for international
    travelers who can connect with another carrier without getting a physical SIM
    card.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_25_0.png)


    Throughout this book, I point out any features that are available on only certain
    models of iPads, so you can use much of this if you even own an earlier model.


    Any iPad device other than the original iPad can use iOS 8.0 if you update the
    operating system (discussed in detail Chapter 2 of this minibook); this book is
    based on version 8.0 of iOS.


    This update to the operating system adds a few new features, including


    +   Family Sharing: Apple has provided a new feature called Family Sharing with
    iOS 8. This feature allows up to six people to partake of purchased iTunes content
    on their separate devices. You can also create a Family calendar that helps everyone
    in the family create and view upcoming family events.


    it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Discovering What''s New in iOS 8.0


    +   Continuity: This concept, enhanced in iOS 8, allows you to move from one iOS
    device to another to pick up where you left off using a feature called Handoff.
    For example, you might start to watch a TV show on your iPhone on the train then
    pick up where you left off viewing the show on your iPad. You can even hand off
    a document or email and start where you left off on another device, as well as
    text messages and calls ring through from your iPhone to your iPad or Mac.


    +   Improved Notification Center: Notification Center is a centralized location
    for reviewing things like calendar appointments, messages, and weather. With iOS
    8, you can interact with notifications from the center, for example, replying
    to a message listed there. The New today views your choice of notifications on
    both the Phone and Lock screen.


    +   Mail Improvements: In iOS 8, you can access other email messages while composing
    a new message. You''ll be prompted to add a phone number or flight number mentioned
    in an email to your Calendar app. You can also flag or mark as read by simply
    swiping across the screen to access those commands.


    +   Quick Type for iPad Keyboard: Now the iPad keyboard uses predictive technology
    to suggest words as you type. The keyboard also notes whether you''re typing an
    email or message and makes suggestions based on the tone of each type of message.


    +   Improvements to the Photos App: To help you organize your photos, in iOS 8
    you can now store your photos in iCloud and download them when you want to view
    them via your Photo Library. Photos or videos can also be shared among up to six
    people''s devices using Family Sharing. There are also improved tools for editing
    photos in iOS 8.


    +   Shazam: Shazam is a music identifier service that has been integrated into
    Siri to identify songs and other media as they play around.


    +   Messaging: The Messages app has some improvements. For example, you can name
    group messages by swiping down in the Details screen to access the hidden group
    name setting, and remove people from conversations. You can also set up a Do Not
    Disturb feature for threads so that you are not interrupted by messages on those
    threads, and you can receive and send voice messages.


    +   Siri HandsFree: If you are driving or otherwise occupied and want help from
    Siri, such as getting directions or to use a new feature without touching your
    iPhone — as long as it is connected to a power source. With this feature enabled,
    you all have to say "Hey, Siri," and your electronic personal assistant opens,
    to hear your voice, which is, of course, Siri''s command.


    +   Instant Hotspot: You''ve been able to use your iPhone as a hotspot in the
    past, essentially using your iPhone connection to get other devices online. With
    iOS 8, this hotspot is improved; nearby devices such as a computer now automatically
    display the iPhone as an option that you can join to go online.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 10 Choosing the Right iPad for You


    # Choosing the Right iPad for You


    Though there are slight differences in thickness and weight among the different
    generations of the larger iPad model, if you pick up an iPad (see Figure 1-1),
    you''re not likely to be able to tell one model from another on first glance,
    except that some are black and some are white or gold or silver. Newer models
    get gradually thinner and lighter. Still, most of their differences are primarily
    under the hood.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_27_0.png)


    Figure 1-1: A black iPad has a classic look.


    If you''re in the market for a new iPad, Apple''s latest offerings are iPad Air
    2 and the iPad mini 3. The iPad mini is smaller, but its screen resolution matches
    that of the iPad Air 2. However, the iPad mini 3 lacks a Burst and Slo-mo features
    for the Camera app, the higher-end laminated display and antirelective coating,
    support for the latest Wi-Fi standard, and the faster A8 processor.


    The larger iPad Air have three variations:


    +   - Case color


    +   - Amount of built-in memory


    +   - Method used for connecting to the Internet: Wi-Fi only, Wi-Fi or Wi-Fi 3G/4G.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Choosing the Right iPad for You 11


    Your options in the first bullet point are silver, gold, or space gray, but if
    you''re confused about the other two, read on; I explain these variations in detail.


    Because Apple upgrades the software and releases new versions of the hardware
    on a somewhat regular basis (a practice that keeps techs on their toes), I''ve
    avoided getting specific on memory specifications and pricing in this chapter.
    However, you can go to www.apple.com/ipad to check out the latest details at any
    time.


    # Deciding how much memory is enough


    You know that computer memory is a measure of how much information — for example,
    movies, photos, and software applications, or apps — you can store on a computing
    device. Memory also affect your iPad''s performance when handling tasks, such
    as streaming TV shows from the World Wide Web or downloading music.


    With audio and video streaming, you can enjoy a lot of content online without
    downloading the full content to your hard drive or iPad flash memory, and given
    that the iPad has a relatively small amount of memory in any of its models, that''s
    not a bad idea. See Book II, Chapters 1 through 3 for more about getting your
    music and movies online.


    Your memory options on an iPad Air 2 or iPad mini 3 are 16, 64, or 128 gigabytes
    (GB). You must choose the right amount of memory because you can''t open the unit
    and add to it, as you usually can with a desktop computer. There is no way to
    directly insert a flash drive (also known as a USB stick) to add backup capacity
    iPad has no USB port — but Apple has thoughtfully provided iCloud, a service you
    can use to save space by backing up content to the Internet. (You can read more
    about that in Chapter 5 of this minibook.)


    With an Apple Digital AV Adapter, you can plug into the iPad to an HDMI-enabled
    device. See Book II, Chapter 3 for more about using these features. For example,
    ViewSonic offers several HDMI projectors, DOVO offers you an HD Travel Kit for
    smartphones and tablets, and Belkin has introduced a new line of tools for HDTV
    streaming.


    So how much memory is enough for your iPad? Here is a good rule: If you like lots
    of media, such as movies or TV shows, and you want to store them on your iPad
    (rather than accessing this content online on sites like Hulu or Netflix from
    your Mac or PC using an app like Air Video), you might need 64GB or more. For
    most people who make a reasonable number of photos, download some music, and watch
    heavy-duty media as movies online, 64GB is probably sufficient. If you simply
    want to check email, browse the web, and write short notes to yourself, 16GB might
    be enough, but for me, why not?


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 12 Choosing the Right iPad for You


    You can''t expand memory in an iPad. Apple is banking on your wanting to stream
    and sync content via iTunes or iCloud. Only you can decide whether that will work
    for you.


    What''s the price for more memory? For the iPad Air 2, a 16GB WiFi (see the next
    section for more about Wi-Fi) costs $499, 64GB adds another $100. But doubling
    that to 128GB adds $100, boosting the price to $699. If you buy an iPad mini 3,
    you''re looking at $399, $499, or $599 for the three levels of memory it offers.


    # Determining whether you need Wi-Fi only or Wi-Fi and 3G/4G


    Another variation in price and performance for the iPad is whether your model
    has Wi-Fi or 3G/4G. Because the iPad is great for browsing online, shopping online,
    emailing, and so on, having an Internet connection for your device obviously is
    pretty essential. That''s where Wi-Fi and 3G/4G come in. Both are used to connect
    to the Internet, and in case you need a refresher course, here''s a quick summary:


    +   Wi-Fi is what you use to connect to a wireless network at home, at work, or
    at public locations as your local coffee shop or an airport. This type of network
    uses short-range radio to connect devices to the Internet; its range is reasonably
    limited — if you leave walk out of the coffee shop, you can''t use it.


    +   3G and 4G cell phone technologies allow an iPad to connect to the Internet
    via a cellular network that''s widespread. You can use it in the same way that
    you make calls from just anywhere using your cellphone. 3G is available as of
    iPad 2 and all later models. The latest cellular connection technology, may not
    be available in every location. You''ll still need to connect to the Internet
    when 4G service isn''t available, but without the advantage of the technology.


    You can buy an iPad with Wi-Fi or both with Wi-Fi and 3G (or 3G and 4G) capabilities.
    A 3G/4G iPad costs an additional $130, but it also includes GPS so you can get
    more driving directions. You can buy an iPad model for your preferred data connection
