    # # Scheduling a Reminder


    A major feature of Reminders, given its name, is to remind you of upcoming tasks.
    After you''ve saved a task, you can set a reminder for it.


    To set a reminder, follow these steps:


    +   1. Tap a task and then tap the Details button that appears to the right of
    the task.

    2. In the dialog that appears, tap Remind Me on Day to turn the feature on.

    3. Tap the Alarm field for the On Day field to turn it on.

    4. Tap the date that appears below this setting to display the date and time,
    as shown in Figure 4-4.

    5. Tap and swipe the Day, Hour, and Minute fields to scroll to the date and time
    for the reminder.

    6. Tap the Done button.


    The settings for the reminder are saved.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_479_1.png)


    If you want a task to repeat with associated reminders, tap the Repeat field,
    from the Details dialog that appears, tap Every Day, Every Week, 2 Weeks, 2 Weeks,
    Month, or Year (for annual meetings or fun-filled holiday get-togethers with the
    gang). Tap Done to save the settings. To stop the task from repeating, tap the
    Repeat field, tap End Repeat Date, and select from a scrolling calendar.


