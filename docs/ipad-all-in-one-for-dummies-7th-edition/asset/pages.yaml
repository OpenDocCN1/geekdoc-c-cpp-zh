    If the situation seems drastic and none of these ideas work, try to reset your
    iPad. To do this, press the Sleep/Wake button and the Home button at the same
    time until the Apple logo appears onscreen.


    # Troubleshooting keyboard woes


    When you''re using a Bluetooth keyboard, your onscreen keyboard has, in essence,
    co-opted keyboard control of your device. To use your onscreen keyboard with a
    Bluetooth keyboard, you have a few options: Turn off your connection to the Bluetooth
    keyboard, turn off Bluetooth in iPad''s Settings or the Control Center, switch
    off the keyboard, or move the keyboard out of range. Your onscreen keyboard should
    reappear.


    Are you accidentally tapping extra keys on the onscreen keyboard as you type?
    Using a wrist support can keep you from hitting characters with your wrists. Also,
    it''s much easier to use the onscreen keyboard in landscape-mode where it''s just
    plain wider.


    # Updating software


    Just software manufacturers provide updates for your main computer. Apple occasionally
    updates the iPad software to fix problems or offer enhanced features. Occasionally
    check for an updated version (say, every month). You can do this by opening Settings,
    tapping General, and then tapping Software Update.


    Note that if you chose to back up and restore iPad via iCloud when you first set
    up the device or later using Settings, restoring and updating your device happens
    automatically. (See Chapter 5 in this minbook for iCloud.)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_175_0.png)


    If you choose not to use iCloud, follow these steps to update the iPad software
    using a connection to your computer and iTunes 11:


    +   1. Connect your iPad to your computer.

    2. On your computer, open iTunes.

    3. Click your iPad''s name near the top-right corner of the screen.

    4. Click the Summary tab, as shown in Figure 9-4.

    5. Click the Check for Update button.


    iTunes displays a message telling you whether a new update is available.'
