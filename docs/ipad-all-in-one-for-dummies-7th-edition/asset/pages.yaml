- pgno: 156
  md: '# # Chapter 8: Managing iPad Settings


    # In This Chapter


    +   - Setting brightness and changing the wallpaper

    - Controlling General settings

    - Getting the sounds right

    - Changing Network and Bluetooth settings

    - Managing iCloud

    - Getting an overview of apps settings


    The Settings app is a command center for your iPad, allowing you to adjust the
    functionality of features such as the screen brightness and wallpaper, sound volume,
    and security features. You can also set up email accounts (which I tell you about
    in Chapter 7 of this minibook) and control how the Calendar and Contacts apps
    manage their respective details. Finally, you find settings for each of the preinstalled
    apps, as well as for many apps designed for the iPad that you may have downloaded
    to your device.


    > Check settings for the Siri personal assistant feature of iPad in Book V, Chapter
    6.


    In this chapter, you get some highlights of the settings you''re likely to need
    most often and advice for how to use them.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_156_0.png)


    # # Making Brightness and Wallpaper Settings


    You might well set up the visual side of iPad first so your interaction with the
    device is easy on the eyes and battery power. Two such categories in Settings
    help out with your display: Display & Brightness and Wallpaper.


    # ## Setting brightness


    When using iPad in day and day out, you may find that a dimmer screen reduces
    strain on your eyes. Also, by reducing the brightness when using any app, you
    can save a little on your iPad''s battery life.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# 140 Making Brightness and Wallpaper Settings


    To modify the brightness setting, follow these steps:


    +   1. Tap Settings on the Home screen.


    +   2. In Settings, shown in Figure 8-1, tap Display & Brightness.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_157_0.png)


    Figure 8-1: Display & Brightness settings are combined in one pane.


    +   3. To control brightness manually, tap the Auto-Brightness/On/Off switch (refer
    to Figure 8-1) to turn it off.


    +   4. Tap and drag the Brightness slider to the right to make the screen brighter
    or to the left to make it dimmer.


    +   5. You can also tap the Text Size setting to choose a size of text for any
    apps that support the Dynamic text feature, and tap the Bold Text switch on this
    feature that may make text easier to see.


    +   6. Tap the Home button to close Settings.


    > If glare from the screen is a problem for you, consider a screen protector.
    This thin film not only protects your screen from damage but also can reduce glare.
    These are available from a wide variety of sources (just do a iPad screen protector)
    and cost about $2 each.


    > In the iBooks app, you can set a sepia tone for book pages, which might be easier
    on your eyes. See Book 2, Chapter 7 for more about using iBooks.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Making Brightness and Wallpaper Settings 141


    # Changing the wallpaper


    Just as your desktop computer or laptop can display a pretty picture or pattern
    as a desktop background called a wallpaper, so your iPad can display an image
    on the Home screen and the same or another picture that displays when your iPad
    is locked.


    The default picture may be pretty, but it may not be the background''s most appealing
    to you. Choosing different wallpaper may help you to see all the apps and status
    bar information on your Home screen, or just provide an image that appeals to
    your artistic sensibilities.


    To change the wallpaper, do this:


    +   1. Tap Settings on the Home screen, and then tap Wallpaper.

    2. In the Wallpaper settings that appear, Choose a New Wallpaper.

    3. In the panes that appear, either Dynamic or Stills under Apple Wallpaper to
