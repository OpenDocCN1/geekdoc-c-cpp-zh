    # Working with Text in Pages


    You can get a leg up on creating a document if you start from an iWork templat(a)
    other than the Blank template, which is, well, blank). Even though you may see
    only a text placeholder in the template, the basic structure helps you get started.
    Templates appear when you tap the plus sign (+) on the Documents window to add
    a new document. Just tap a template to open it.


    After you open a document, entering text is simple. Here are four ways to start
    entering text:


    +   - **Type text.** Tap the spot in the document where you want to enter text
    and start typing. You can use the onscreen keyboard or a keyboard.

    - **Dictate text.** Tap the Dictation key (not available on iPad 2) on the onscreen
    keyboard (the small microphone) and speak your text, including punctuation. Dictation
    also allows some simple commands as “Next line."

    - **Cut, copy, or paste text (or a combination).** Use the cut, copy, and paste
    tools to copy text in your Pages document and move it to another location, or
    copy text in your iPad app (for example, from a website accessed by the Safari
    browser) and paste it into your Pages document. You get these controls by pressing
    and holding on text to display a set of tools.


