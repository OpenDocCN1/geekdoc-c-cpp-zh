  md: '# 122 Opening Mail and Reading Messages


    When your iPad gets an email, it alerts you with a little sound. If those email
    alerts are driving you nuts, you can go to Settings and, under Sounds, use the
    slider to lower the volume or tap the On/Off switch to turn off the chimes.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_139_0.png)


    The following steps take you through the simple process of using Mail to open
    and read emails if you have a single email account set up on iPad:


    +   1. Tap the Mail app on the Home screen (see Figure 7-5), which displays the
    number of unread emails in your Inbox in a red circle.


    If you have only one email account set up on your iPad, a list of messages displays
    (see Figure 7-6); skip Step 3.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_139_1.png)


    Figure 7-5: Without having to open Mail, you can see how many unread messages
    you have.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_139_2.png)


    Figure 7-6: Open your inbox and view its contents.


    +   2. If the list doesn''t display, tap the arrow with the opened mailbox in
    the top-left corner (refer to Figure 7-6) to display a list of Inboxes. Tap the
    Inbox whose contents you want to display.'
