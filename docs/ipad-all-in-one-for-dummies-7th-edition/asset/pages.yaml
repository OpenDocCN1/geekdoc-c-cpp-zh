    # Exploring other e-readers


    Though iBooks can handle content from many ePub sources, such as Google and Project
    Gutenberg, you may prefer to explore the tools offered by other e-readers. Your
    iPad is capable of using other e-readers to display book content from bookstores,
    like iStores. To do so, first download another e-reader application such as Kindle
    from Amazon or the Barnes & Noble app. You can also download a non-specific app
    such as Bluereader, which handles eBook and PDF format, as well as all formats
    that public libraries use. Use that application''s features to search for, purchase,
    and download content.


    The Kindle e-reader application is shown in Figure 7-4. After downloading the
    free app from the App Store, you open the app, go to the Amazon Kindle Store and
    enter the email address associated with your Amazon account and password. Any
    you have already bought from Amazon for the Kindle is archived and can be downloaded
    using your Kindle on your iPad to read any time. Use features such as changing
    the background to a sepia tone or changing the font to enhance your reading experience.
    Tap the Device to see titles stored on your iPad. From this e-reader, just push
    the title with your finger, and Remove an from Device buttons.


