  md: '# Where to go from Here


    Updates: I provide information on changes to the iOS or iPad hardware occur after
    this book''s publication on my website at www. ipmadeclear.com, so you can continue
    to use this book even if changes are introduced after you buy it. Please check
    this website periodically as Apple makes software and hardware updates to iPad
    now and then. You can also check for updates and corrections at www.dummies.com/extras/ipadao.


    # # Where to go from Here


    After you read this book''s introduction, it''s time to jump into all things iPad.
    I hope that when you turn to any chapter in this book, you''ll find something
    you didn''t know about iPad that will increase your enjoyment of your new device.


    Start by checking the basic concepts and instructions in Book I (you might be
    surprised at what you discover, even if you''ve been tinkering with your iPad
    for a bit) and then jump to any minibook that addresses topics you want to explore
    next — have fun or get work done, for example.


    Wherever you dive in, you''re likely to find some advice or Apple makes will make
    your iPad experience even more rewarding.


    The first step you should take (and this is covered in Book I, Chapter 2) is to
    update to the latest operating system for iPad — iOS 8, at the time this book
    went to press. (All steps in this book are based on iOS 8.)'
