    +   **Dummies.com online Header:** To find the book''s Extras page located at
    www.dummies.com/extras/ipada to read about cool apps for your iPad. You''ll find
    information about entertainment apps, apps for business power users, apps to use
    with iWork, and informative apps as dictionaries and news sources.'
