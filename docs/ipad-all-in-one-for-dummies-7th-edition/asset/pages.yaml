    # Handling security


    Because you''re likely to take your iPad on the road on a regular basis, it''s
    a good idea to consider a few security features. Save some battery life and protect
    your data or access to certain apps.


    Security includes three features, which you access through the General settings:


    +   Lock/Unlock: Turns off your display to save battery power when you close the
    cover for your iPad.


    +   Auto-Lock: Locks your iPad at a set interval. You can set the amount of time
    you want before your iPad goes to the Lock screen by tapping this setting.


    +   Restrictions: Allows you to restrict access to certain apps and content using
    a passcode (see Figure 8-3). This is useful if you don''t want kids to access
    a particularly adult app or simply don''t want them browsing with Safari or buying
    things with iTunes, for example.


    In addition, there are two items in the main Settings (not within General settings)
    that relate to security: Passcode and Privacy.


    +   Passcode allows you to assign a passcode to the Lock screen. You set a passcode,
    turn it on or off, change the passcode, and set the time interval at which your
    passcode is required. This is useful if you don''t want to bother with a passcode
    for brief periods of locking your iPad. Finally, you can use Erase Data setting
    so that multiple attempts to access your device results in your iPad erasing all
    data on it.


