  md: '# 494 Understanding All That Siri Can Do


    Siri is available on the iPad only when you have Internet access, and cellular
    data charges could apply when Siri checks online sources if you''re using a 3G/4G
    iPad model. In addition, Apple warns that available features may vary by area.


    Now, to use Siri, press and hold the Home button until Siri opens, displaying
    a dialog with the phrase, "What can I help you with?” (see Figure 6-4) and a small
    microphone icon; wait a moment, and Siri begins to show you the types of commands
    it can follow. Remember that this works with only third-generation iPads and later,
    and iPad minis with iOS 6 or later installed.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_511_0.png)


    **Figure 6-4:** Siri awaits your command.


    # Understanding All That Siri Can Do


    Siri allows you to interact with many apps on your iPad by voice. You can pose
    questions or ask to do something, such as make a FaceTime call or add an appointment
    to your calendar. Siri can also search the Internet or use an informational database
    called WolframAlpha to provide information about any topic. You don''t have to
    be in an app to make a request involving another app.'
  merge: -1
  img_proc: true
- pgno: 512
  md: '# Understanding All Siri Can Do


    Siri also checks with Wikipedia, Bing, and Twitter to give you the information
    you ask for. In addition, you can use Siri to tell iPad to play your voicemail,
    open and search the App Store, or control iTunes Radio playback.


    Siri is the technology behind the iPad''s Dictation feature. If you have the onscreen
    keyboard, note that it contains the Dictation key, which you can tap to dictate
    and tap to end dictation. This works in any app that uses the onscreen keyboard.


    When you ask a question about, setting up an appointment, Siri responds to you
    verbally and with text information, in a form as email (see Figure 6-5) or in
    a graphic display for some items such as maps. When a result appears, you can
    tap it to make a choice or open a repeated run.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_512_0.png)


    Figure 6-5: If you ask to send an email, Siri provides the email form.


    With iOS 8, you can activate Siri hands-free. With your iPhone plugged into a
    wall outlet, car power port, or computer''s USB port, say "Hey, Siri" and Siri
    opens up ready for a command. In addition, with voice recognition, Siri displays
    with text what it''s hearing as you speak, so you can verify that it understood
    you instantly. This streaming feature makes the whole process of interacting with
    Siri faster.


    With iOS 8, Siri now supports 22 languages, so you can finally show off language
    lessons you teach in high school.


    Siri works with FaceTime, the App Store, Music, Messages, Reminders, Calendar,
    Maps, Mail, Clock, Contacts, Notes, and Safari. In the following tasks, I provide
    a quick guide to some of the most useful ways you can use Siri.'
  merge: -1
  img_proc: true
- pgno: 513
  md: '# 496 Staying in Touch and Staying on Schedule with Siri


    # Staying in Touch and Staying on Schedule with Siri


    When you''re on the run, Siri can be a wonderful ally. You can ask Siri to make
    calls for you, set up reminders and alerts, and even add appointments to your
    calendar, all by speaking your requests.


    # Calling contacts via FaceTime


    First, make sure the people you want to call are entered in your Contacts app
    and include their phone numbers in their. If you want to call somebody by stating
    your relationship to her, such as “Call sister,” be sure to enter that relationship
    in the related field in her contact record and make sure that the settings for
    Siri (refer to Figure 6-2) include your contact name in the My Info field. (See
    Chapter 5 in this minibook for more about creating contacts.)


    +   1. Press and hold the Home button until Siri appears.

    2. Speak a command as “Make a FaceTime call to Earl” or “FaceTime Mom."


    If two contacts exist who might match a spoken name, Siri responds with a list
    of possible matches (see Figure 6-6).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_513_0.png)


    **Figure 6-6:** If two similar contacts exist, Siri asks you to choose.


    +   3. Tap one of the contacts in the list or state the correct contact’s name
    to proceed.

    4. To end the call before it completes, tap the Home button and then End.


    Siri places the call.


    To cancel any spoken request, you have four options: You can say “Cancel,” tap
    the Microphone button on the Siri screen, tap the Home button, or tap anywhere
    on the screen outside the Siri panel.


    You can also use Siri with the Reminders app. For example, you might want to set
    a reminder to meet a friend for lunch next Tuesday. Rather than'
  merge: -1
  img_proc: true
- pgno: 514
  md: '# Staying in Touch and Staying on Schedule with Siri 497


    opening the Reminder app and adding a new reminder and settings for it, you can
    tell Siri to do it for you.


    To create a reminder using Siri, follow these steps:


    +   1. Press and hold the Home key and then speak a command, as “Remind me to
    call Dad on Thursday at 10 a.m.” or “Wake me up tomorrow at 7 a.m.”


    A preview of the reminder is displayed (see Figure 6-7), and Siri asks you whether
    to create the reminder.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_514_0.png)


    **Figure 6-7.** Siri presents the reminder as it understood it for you to confirm.


    +   2. If Siri asks you to confirm, tap or say Confirm to create the reminder
    or alert.


    +   3. If you want a reminder ahead of the event you created, activate Siri and
    speak a command, such as “Remind me tonight about the play on Thursday at 8 p.m.”


    A second reminder is created, which you can confirm or cancel if you change your
    mind.


    # Adding tasks to your Calendar


    If you live by your Calendar appointments, you''ll be happy to hear that Siri
    can set up events on your Calendar for you. Siri not records the event on your
    Calendar, but it also alerts you if a conflict exists.


    Follow these steps to set up an event using Siri:


    +   1. Press and hold the Home button and then speak a phrase, such as “Set up
    meeting at 10 a.m. on October 12th.”


    A sample calendar entry appears, and Siri asks whether you want to confirm it.'
  merge: -1
  img_proc: true
- pgno: 515
  md: '# 498 Playing Music


    2. If a conflict exists with the appointment, Siri tells you that you already
    have an appointment at that time (see Figure 6-8) and asks whether you still want
    to set up the new appointment.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_515_0.png)


    Figure 6-8: Double-booked? Siri lets you know.


    3. Say Yes or Cancel or tap the Yes or Cancel button.


    # Playing Music


    How do you find that you don''t have the time or free hands to handle the iPad
    screen, open Music, search for music, and tap to play it? You''ll find worse problems
    in the world, but if this is one that drags at you, you just press and hold the
    Home button and tell Siri your favorite tune. You can use Siri to play a song
    from the Music app or play a station on iTunes Radio.


    To use music with Siri, follow these steps:


    +   1. Press and hold the Home button until Siri appears.


    +   2. To play music, speak a command, such as “Play music” or “As Time Goes By”
    to play a specific song or album.


    +   3. When the music is playing, use commands such as “Pause music, “Next track,”
    or “Stop music” to control playback.


    > One of the best things is that you don''t have to follow a specific command
    format as you do with other voice-command apps. You could say, “Play the next
    track” or “Next track” or “Jump to the next track on this album, and Siri gets
    your meaning.


    # Letting Siri Put You in the Know


    You''re late for an appointment and need help. You can call on Siri, from getting
    directions to your next appointment to calling your customer''s website to check
    her product catalog or check facts on the price of the client''s stock today,
    Siri can find it all.'
  merge: -1
  img_proc: true
- pgno: 516
  md: '# Letting Siri Put You in the Know 499


    # Getting directions


    You can use the Maps app and Siri to find your current location, find nearby businesses
    such as restaurants or a bank, or get a map of your location. Be sure to turn
    on Location Services to allow Siri to know your current location.(Go to Settings
    and tap Privacy: Location Services to make sure that the Location setting and
    Siri are turned on, both are in the same dialog.)


    Here are some of the commands you can try to get directions or a list of nearby
    businesses:


    +   - *Where am I?*


    Displays a map of your current location. If you have a Wi-Fi-only iPad, this location
    may be approximate.


    +   - *Where is Apache Junction, Arizona?*


    Displays a map of that city.


    +   - *Find restaurants.*


    Displays a list of restaurants near your current location, as shown in Figure
    6-9; tap one to display a map of its location.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_516_0.png)


    Figure 6-9: If you''re hungry, Siri could be your new best friend.


    +   - *Find Bank of America.*


    Displays a map with the location of that business (or in some cases, nearby locations,
    such as a bank branch and all ATMs) indicated.'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# 500 Letting Siri Put You in the Know


    When a location is displayed in a map, tap the Information button on the location''s
    label to view its address, phone number, and website address, available.


    Note that all your requests to Siri are routed through Apple servers. If you are,
    a spy and don''t want your movements and activities stored on somebody''s server,
    avoid using Siri for directions or reminders! But if you''re a law-abiding citizen,
    don''t worry about this.


    # Asking for the facts


    WolframAlpha is a self-professed online computational knowledge engine. That means
    it''s more than a search engine because it provides specific information about
    a search term rather than multiple search results. If you want facts without sending
    time browsing websites to find those, you''ll find that WolframAlpha is a very
    good resource.


    Siri uses WolframAlpha and sources like Wikipedia and Bing to look up facts in
    response to questions like “What is the capital of Kansas?” “What is the square
    root of 2003?” or “How large is Mars?” Just press and hold the Home button and
    ask your question; Siri consults its resources and returns a set of relevant facts.


    You can also get information about many facts, such as the current stock prices,
    or the time. Just say a phrase like one of these to get what you need:


    +   **What is the weather?**

    This shows the weather report for your current location. If you want weather in
    another location, just specify the location in question.

    **What is the price of Apple stock?**

    Siri tells you the current price of the stock or the price of the stock when the
    stock market last closed.

    **What time is it?**

    Siri tells you the time in your time zone and displays a clock (Figure 6-10).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_517_0.png)


    Figure 6-10: Stay on schedule with Siri''s help.'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# Getting Helpful Tips


    Note that Siri can understand many languages and therefore work in many countries.
    If you love to travel, Siri could help make your next trip much easier.


    # Searching the web


    Siri can use various resources to respond to specific requests such as "Who is
    the Queen of England?" For more general requests, however, Siri searches for the
    web.


    For example, if you speak a phrase, such as "Find a website about birds" or "Find
    information about the World Series," Siri can respond in a couple of ways. The
    can simply display a list of search results using the default search engine in
    your settings for Safari, or "If you like, I can search the web for such-and-such."
    In the first instance, just tap a result to go to that. In the second instance,
    you can confirm that you want to search the web or cancel.


    # Sending Email, Tweets, or Messages


    You can create an email, a tweet, or an instant message using Siri and existing
    contacts. For example, if you say, "Email Jack Wilkes," a form opens already addressed
    to that contact. Siri asks you the subject and what to say in the message; speak
    your message and say "Send to your message on you.


    Siri also works with the Messages app. Tap Siri and say, "Message Sarah." Siri
    creates a message and asks what you want to say. Say, "Tell Sarah I''ll call"
    and asks for permission to approve and send.


    It''s hard to stump Siri. For example, at this point in time, Siri can''t tweet
    unless you download and set up the Twitter app. But if you try to post a tweet,
    Siri gives you a link to tap to install the app! After you install these apps,
    you can say things to Siri like "Post Tweet" or "Post to Facebook," and Siri asks
    what you want to say, lets you review it, and Siri can also connect you with Flickr
    and Vimeo when you have those apps installed.


    # Getting Helpful Tips


    I know you''re going to have a wonderful time learning the ins and outs of Siri,
    but before I close this chapter, there are some tips to get you going:


    +   * If Siri doesn''t understand you: When you speak a command and Siri displays
    what it thought you said but misses the mark, you have a few options. To correct
    a request you''ve made, you can tap Tap to Edit


    www.it-ebooks.info'
  merge: -1
  img_proc: true
