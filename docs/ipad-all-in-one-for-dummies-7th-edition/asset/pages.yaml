    **Figure 1-7:** The Home Sharing settings for Music.


    # 7. Tap the Home button and tap Music.


    Music opens.


    # 8. Tap Songs and tap a shared song to download it from the cloud.


    To view shared videos, follow the same procedure for Videos settings and the Videos
    app.


    # Printing from iPad


    If you need to print from your iPad, you can use its built-in wireless printing
    capability or a third-party app, which is likely to give you a few more-printing
    controls.


    Native printing is part of iPad''s bag of tricks. This capability requires a wireless-enabled
    printer that supports the AirPrint protocol. All the major printer manufacturers
    offer AirPrint-compatible printers, including HP, Epson, Canon, Brother, and Lexmark,
    check to see whether your printer model has support.


    The only control you have over your printing is to set the number of copies to
    be printed; with some printers, you can also specify a page range and double-sided
    printing. You can also use an app as Pintropia or AirPrint Activator 2 on your
    computer to print through that computer from iPad to shared and networked printers,
    whether wireless or wired.


