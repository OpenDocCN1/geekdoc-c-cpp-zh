    # VoiceOver


    After VoiceOver is turned on, you need to figure out how to use it. I won''t lie
    — it is awkward at first, but you''ll get the hang of it! Here are the main gestures
    you should know how to:


    +   Tap an item to select. VoiceOver speaks its name.

    Double-tap the selected item. This action activates the item.

    Flick three fingers. It takes three fingers to scroll around a page with VoiceOver
    turned on.


