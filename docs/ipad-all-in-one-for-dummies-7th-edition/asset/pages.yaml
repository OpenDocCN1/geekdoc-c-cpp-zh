- pgno: 405
  md: '# 388 Using Forms Efficiently


    # Changing a cell''s content formatting


    Your end time may include the date, which is probably not what you want. Here''s
    how to change the formatting of a cell''s contents:


    +   * Select the cell by making a single tap.

    You can also select a cell and drag the highlighted selection to include more
    than one cell. Your formatting affects all selected cells.

    * Tap the Format button at the top of the screen.

    * In the Format popover, tap the Information button to the right of Date & Time.

    * Tap the format you want to use in the selected cell or cells, or tap the arrow
    at the right of the format name to customize the format.

    Not all formats have customizations.


    To properly format the end time, you may want to remove the date. In Date & Time
    Options popover, select the option for None, as shown in Figure 3-25, and the
    time option for the hour.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_405_0.png)


    Figure 3-25: Format the result.


    # Using Forms Efficiently


    A form is a user-friendly way to provide input to a single row of a spreadsheet.
    If a form interacts with a table, you must create a table in your spreadsheet
    before you create an associated form.


    To create a form, tap the plus sign (+) on the left end of the row of tabs. You''re
    asked whether you want to create a new sheet or a form. (Refer to Figure 3-25.)
    Tap New Form, and see a screen similar to the one shown in Figure 3-26, which
    uses the Team Organization template for the example.'
