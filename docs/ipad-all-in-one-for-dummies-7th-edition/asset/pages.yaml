    Up Grammy Award without having a few notes to specify when and where and what
    you should wear. Reminder tasks help get you to where you need to be when you
    are there.


    To edit a task and add details, follow these steps:


    +   1. Tap a task and tap the Details button (it looks like a small i ) appears
    to be the right of it to open the Details dialog (see Figure 4-2).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_478_0.png)


    Figure 4-2: Add the information you need about a particular event in this dialog.


    +   2. Tap a Priority.


    Choose None, Low, Medium, or High from the choices that appear.

    The Notes priority settings display the associated number of exclamation-marks
    on a task in a list to remind you of its importance.


    +   3. Tap List, and then, from the options that display (see Figure 4-3), select
    a list to put your task on.


    +   4. Tap Details to return to the dialog and then tap Notes.


    +   5. Using the onscreen keyboard, enter a note about the task.


