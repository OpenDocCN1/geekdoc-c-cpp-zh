    you spin the iPad in circles, you can use this little switch on the iPad mini
    3 to lock the screen (Note that some apps can override this functionality if they
    require one orientation or the other). iPad Air 2 no longer has a side switch,
    but you can change Rotation and Volume settings in the Control Center (swipe up
    from the bottom of the screen to open Control Center).


    +   - **(Tiny, mighty) speakers:** One surprise when I first got my iPad Air 2
