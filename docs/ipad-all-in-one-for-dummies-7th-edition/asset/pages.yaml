    and then tap Save Draft. The next time you tap the Mail button with the same note
    displayed in Notes, your draft appears.


    # Deleting Notes


    Over time, notes can accumulate, making it harder to find the note in the long
    list that displays. There''s no sense in letting your Notes List cluttered or
    leaving old content to confuse you. When you''re dealing with a note, delete it.
    Follow these steps:


