- pgno: 450
  md: '# Displaying the Notes List


    The Notes List contains all your notes listed chronologically by the last date/time
    you modified the note. This list isn''t available in portrait orientation, but
    it''s the list you need in order to see the notes you have stored. If you''re
    using landscape orientation, a list of notes appears by default on the left side
    of the screen.


    If you''re using portrait orientation, you can display this list in portrait orientation
    by tapping the Notes button in the top-left corner of the screen; the Notes List
    appears, as shown in Figure 2-7. Tap any note in the list to display it.


    The Notes List is also the Accounts List if you enabled notes syncing in iCloud
    or other shared settings in Settings.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_450_0.png)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_450_1.png)


    **Figure 2-7:** Tap the Notes button to display a list of saved notes.


    # Moving around notes


    If you want to look for a note based on how long ago you created it, you should
    know that notes are stored with the most recently created or modified notes at
    the top of the Notes List. Older notes fall toward the bottom of the list. The
    date and/or time you modified a note also appears in the Notes List to help you
    out.


    It''s easy to make among notes you created:


    +   1. Tap the app on the Home screen to open it.

    2. With the Notes List displayed, tap a note to open it.


    You can display the Notes List by either turning iPad to landscape orientation
    or tapping the Notes button in portrait orientation; see the proceeding for viewing
    your Notes List.


    Notes isn''t a file-management pro; it allows you to enter multiple notes with
    the same title, which can cause confusion. Be advised, and name your notes uniquely!


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_450_2.png)'
  merge: -1
  img_proc: true
- pgno: 451
  md: '# 434 Finding Notes


    Remember that Notes names your note using the first line of text. If you want
    to rename a note, first display the note, tap at the end of the first line of
    text, and then tap the Delete key on your onscreen keyboard to delete the old
    title. Enter a new title; it is reflected as the name of your note in the Notes
    List.


    # Searching Notes


    If you''re not sure which note contains that very important item, you can search
    to locate a note that contains certain text. The search feature lists only notes
    that contain your search criteria; it highlights only the first instance of the
    word or words that you enter within a note.


    The Spotlight search feature in iPad also locates notes that matches your search
    term you enter there, along with many other types of content. Book I, Chapter
    2, for more about the Search feature.


    Follow this procedure to use the Notes search feature:


    +   1. Tap the Notes app on the Home screen to open it.

    2. Either hold the iPad in landscape orientation or tap the Notes button in portrait
    orientation to display the Notes List. (Refer to Figure 2-7).

    3. Tap in the Search field at the top of the Notes List. (See Figure 2-8)

    The onscreen keyboard appears.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_451_0.png)


    Figure 2-8: Enter search terms using the onscreen keyboard or Keyboard Dock.'
  merge: -1
  img_proc: true
