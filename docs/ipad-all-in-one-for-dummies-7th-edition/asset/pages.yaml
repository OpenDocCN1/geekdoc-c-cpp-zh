- pgno: 447
  md: '# 430 Making Notes


    Here are some tips for working with the virtual keyboard:


    +   * Enter numbers or symbols. Tap the keys labeled .?123 on either side of the
    keyboard. The numeric keyboard, shown in Figure 2-4, appears. When you want to
    return to the regular keyboard, tap either of the keys labeled ABC.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_447_0.png)


    Figure 2-4: Use this alternative keyboard for numbers and many common symbols.


    +   * Capitalize a letter. Tap the Shift key and then tap the letter.


    If you turn on the Enable Caps Lock feature in Settings, you can also turn on
    Caps Lock by double-tapping the Shift key; tap the Shift once to turn off the
    feature.


    +   * Start a new paragraph or the next text in a list. Tap the Return key.


    +   * Edit text. Tap to the right of the text you want to edit and tap the Delete
    key to delete to the left of the cursor or enter new text.


    +   * Change the default font. Go to the Notes Settings.


    Tap either of the keys labeled #= to access more symbols, such as the percentage
    sign, the euro symbol, and tapping and holding some of these keys displays alternative
    characters. This also works on some keys on the alphabetic and numeric keyboards.
    For example, tapping and holding N gives you foreign language options like the
    Spanish ñ, and pressing and holding the exclamation key on the numeric keyboard
    offers the upside-down exclamation point used in some languages.)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_447_1.png)


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 448
  md: '# Making Notes


    # 431


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_448_0.png)


    No need to save a note — it''s automatically kept until you delete it.


    # Creating a new note


    If you have stored notes, when you open Notes, the most recently used notes displays.
    If you want to create a new note, it''s a simple procedure. To create a new note,
    tap the New Note button (the one looks like a page with a pen on it) in the top-right
    corner. The current note is saved and a new, blank note appears (refer to Figures
    2-1 and 2-2). Enter and edit text as described in the preceding section.


    Book V

    Chapter 2


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_448_1.png)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_448_2.png)


    If your iPad is in portrait orientation and you want to display the list of saved
    besides the current note, tap the Notes button to view a list of notes.


    # Using copy and paste


    Let''s face it, most of us don''t nail what we write on our first draft. That''s
    why, after you enter content into a note, you may want to modify it. The Notes
    app includes essential editing tools you''re familiar with from using word processors:
    Select, Copy, and Paste. You can use these to duplicate content or copy and paste
    from one part of a note to another.


    Use the Copy and Paste tools, follow these steps:


    +   1. With a note displayed, press and hold your finger on a word.

    The selection tools, shown in Figure 2-5, appears.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_448_3.png)


    Figure 2-5: This menu provides selection and pasting tools.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
- pgno: 449
  md: '# 432 Finding Notes


    +   2. Tap the Copy button.

    3. Press and hold your finger in the document where you want to place the copied
    text.

    4. On the menu that appears (see Figure 2-6), tap the Paste button.

    The copied text appears.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_449_0.png)


    Figure 2-6: Use the press-and-hold method to display the editing menu.


    To select all text in a note to either delete or copy it, tap the Select All button
    in the menu (refer to Figure 2-5). All is selected, and you can select commands
    from the menu to cut, copy, or paste the selected text.


    To delete text, you can use the Select or Select All command and then press the
    Delete key on the onscreen keyboard.


    # Finding Notes


    After you create a note, you need to find it if you want to view or edit it. You
    can scan the Notes List to find a note or use the Search tool. You can also swipe
    on the Notes pad to move among notes. The following sections help you find and
    move among notes you''ve created.'
