- pgno: 316
  md: '# # Chapter 2: Finding Your Way with Maps


    In This Chapter


    +   - Going to your current location

    - Knowing where you''ve been

    - Finding directions, info, and more

    - Conveying location information beyond maps

    - Getting turn-by-turn navigation help


    You may have used a Maps app on a smartphone before. The big difference with the
    iPad is its large screen, on which you can view all the beautiful maps, traffic
    flow, and streets in standard views and 3D as long as you have an internet connection.
    You can also display a map and written directions simultaneously or have Maps
    speak your directions, guiding you as you drive with 3G/4G iPad.


    You will find lots of great functions in the Maps app, including getting directions
    with suggested routes from one to another by foot or car. You can bookmark locations
    to return to them. And the Maps make it possible to get information about locations,
    such as the phone numbers and web links to businesses. You can even add a location
    to your Contacts list or share a location with your buddy using Mail, Message,
    Twitter, or Facebook.


    Be prepared: This app is a fun way to find your way in the world.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_316_0.png)


    # ## Getting Where You''re Going


    The first duty of a map is to get where you want to go. The Maps app can go directly
    to wherever you are or to any other location you wish to visit. You can also use
    tools to help find different views of locales by displaying streets, terrain,
    or aerial views or zooming in and out for various levels of detail. In this section,
    you will find out how to get around.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Going to your current location


    The iPad is pretty smart; it can figure out where you are at any point in time
    and display your location using GPS technology (a 3G/4G mobile) or a triangulation
    method (Wi-Fi model). You must have an Internet connection and turn Location Services
    on in the Privacy pane in Settings; your location can be pinpoint more exactly
    if you have a 3G or 4G iPad, even Wi-Fi models do a pretty good job, and they
    do even better when you are surrounded by hotspots.


    To display your current location in Maps, follow these steps:


    +   1. From the Home screen, tap the Maps icon.

    2. Tap the Current location (the arrow shown in the lower-left corner of Figure
    2-1).


    Your current location is displayed with a pin and a pulsating blue circle around
    it (see Figure 2-1). The pin indicates how accurate the location is — it could
    actually be anywhere within the area of the circle.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_317_0.png)


    **Figure 2-1:** Go to your current location quickly to see where you are.


    Having trouble getting Maps to work? That could be because if you turn Location
    Services in Settings, Maps can''t find you. Go to Settings and in the Privacy
    setting, make sure that Location Services is set to On for the Maps app.


    +   3. Double-tap the screen to zoom in on your location.


    Additional methods of zooming in and out are covered in the "Zooming in and out"
    section, later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Getting Where You''re Going


    If you don''t have a 3G/4G version of iPad, your current location is a rough estimate
    based on a triangulation method. Only 3G- and 4G-enabled iPads with GPS can really
    pinpoint your location. Still, if you type a starting location and an ending location
    to get directions, you can get pretty accurate results with Wi-Fi on iPad.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_318_0.png)


    # Changing views


    The Maps offers three views: Standard, Satellite, and Hybrid. You see the Standard
    view by default the first time you open Maps. Here''s what views offers:


    +   - Standard: Your basic street map that you might find in any road atlas

    - Satellite: An aerial view

    - Hybrid: A satellite view with street names included


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_318_1.png)


    Another cool app for those who like their maps of the topographical variety is
    Top Maps for iPad from Phil Endecott ($79.99). This app taps into the United States
    Geological Society (USGS) and Canadian topographical maps and is great for panning
    that next into the wilderness.


    Follow these steps to switch among the views in Maps:


    +   1. With Maps open, tap the Information button in the bottom-right corner of
    the screen and reveal the Maps popover, shown in Figure 2-2.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_318_2.png)


    Figure 2-2: The controls for Maps are displayed when you tap the Information button.


    | Book 3 |

    | Chapter 2 |

    | Finding Your Way

    | Maps |'
  merge: -1
  img_proc: true
