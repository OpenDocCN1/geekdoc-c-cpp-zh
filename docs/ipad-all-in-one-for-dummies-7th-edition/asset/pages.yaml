  md: '# 76 Making Settings and Syncing


    Before you can use iTunes to manage your iPad, you have to download the latest
    version of iTunes by going to www.apple.com/itunes. You should also create an
    iTunes account, providing a payment method that you can use iTunes on your computer
    or use the iTunes on your iPad to purchase apps and content.


