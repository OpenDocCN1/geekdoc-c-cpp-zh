  md: '# Getting Face to Face with FaceTime


    # Getting Face to Face with FaceTime


    FaceTime is an excellent video-calling app that''s available on the iPhone 4 and
    later and is now available on iPads (except for the original iPad). The app lets
    you call people who have FaceTime on their iOS 5 or later devices using a phone
    number or an email address. You and friend or family member can see each other
    as you talk, which makes for a much more personal experience.


    In OS 7, the ability to make audio-only FaceTime calls has been added. The audio
    quality beats a phone call by quite a bit, and the audio-only calls don''t require
    quite so robust connection or use as much bandwidth as a video FaceTime call does.


    You can also show the person on the other end of your surroundings by using your
    iPad camera and panning around you. The possibilities are limitless: your husband
    the toy you''re thinking of buying your son for his birthday, let your girlfriend
    see your new car while she''s busy at work, or share your artwork or trip to the
    wine country with friends.


    You can use your Apple ID and email address to access FaceTime, so after you install
    it, it works pretty much out of the box. See Book I, Chapter 5 for more getting
    about an Apple ID.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_232_0.png)


    > If you''re having trouble using FaceTime, make sure the feature is turned on.
    Tap Settings on the Home screen and then tap FaceTime. Tap the On/Off switch to
    turn on, if necessary. You can also select the email and phone account that can
    be used to make phone calls to you in this Settings page.


    # When can use FaceTime


    Here''s a quick rundown of what and what iOS you need for using FaceTime''s various
    features:


    +   * FaceTime is available on all iPads except the original iPad.

    * You can call people who have iPhone 4 or later, iPad 2 or later, fourth-generation
    iPad touch, or a Mac (running OS X 10.6.6 or later).

    * You can use a phone number to connect with iPhone 4 or later.

    * You can connect using an email address with a Mac, iPod touch, or iPad.


    # Making a FaceTime call


    You can make and receive calls with FaceTime using a phone number (iPhone 4/4s/5/5s)
    or an email address (IPad 2 or later, iPod touch fourth-generation, or a Mac running
    OS X 10.6.6 or later), and show the per- on the other end what''s going around
    you.'
  merge: -1
  img_proc: true
- pgno: 233
  md: "# 216 Getting Face to Face with FaceTime\n\nIf you have a Wi-Fi-only iPad and\
    \ use FaceTime over a Wi-Fi network, that limits the places from which you can\
    \ make or receive video calls to your home wireless network or a public hotspot.\
    \ On the other hand, you avoid costly usage over a 3G or 4G network with this\
    \ setup unless you own a 3G/4G iPad model.\n\n![](img/2a8a8d89daeb1b3896bd38ebf18af126_233_0.png)\n\
    \nYou have to use the appropriate method for placing a FaceTime call, depending\
    \ on the kind of device you're calling. If you're calling iPhone 4 or later, use\
    \ the phone number the first time you're calling, and after that, you use the\
    \ phone number or email address; if you're calling an iPad 2 or later, an iPad\
    \ touch, or a FaceTime for Mac user, you have to make the person's email address.\n\
    \n![](img/2a8a8d89daeb1b3896bd38ebf18af126_233_1.png)\n\nYou can't adjust audio\
    \ volume from the app or record a video call. Nevertheless, on the positive side,\
    \ though its features are limited, this app is very straightforward to use.\n\n\
    Follow these steps to use FaceTime:\n\n+   1. Connect to a Wi-Fi or cellular (with\
    \ iOS 6 or later) network.\n   See Book I, Chapter 5 for details on connecting.\n\
    2. If you know the person you're calling has FaceTime on an iPhone 4 or later,\
    \ an iPad 2 or later, or a Mac, add the person to your iPad Contacts.\n   See\
    \ Book V, Chapter 5 for how to do this if person isn't already in Contacts.\n\
    3. Tap the FaceTime app icon on the Home screen.\n   The first time you use the\
    \ app, you may be asked to select the phone number and email you want to use for\
    \ FaceTime calls and then click Next. The FaceTime screen appears.\n4. Tap the\
    \ Contacts button in the bottom-right corner of the screen.\n5. Scroll to locate\
    \ and tap a contact's name.\n\n![](img/2a8a8d89daeb1b3896bd38ebf18af126_233_2.png)\n\
    \nThe contact's information displays (as shown in Figure 4-8).\n\nYou can also\
    \ place a FaceTime call using Siri. Just say something like “Make a FaceTime call\
    \ to Joey” and confirm Joey's contact information, and the call is placed.\n\n\
    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_233_3.png)"
  merge: -1
  img_proc: true
