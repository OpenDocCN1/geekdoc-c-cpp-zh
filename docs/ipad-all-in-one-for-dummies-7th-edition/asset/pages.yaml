- pgno: 309
  md: '# 292 Making Wi-Fi and 3G/4G Settings


    # Making 3G/4G settings


    When you use a Wi-Fi model of iPad, in addition to modifying Wi-Fi settings as
    covered in the preceding section, you can make changes to your cellular data in
    Settings. Cellular Data settings enable you to manage your roaming and account
    information (see Figure 1-3). You can use these settings to sign up for a data
    plan by entering your name, phone number, and credit card information; when you
    submit this, your account is set up with your provider with a unique phone number
    associated with the account. You need this phone number to speak to customer representatives
    about your account.


    You can find the following items under the Cellular Data category in Settings:


    +   * Cellular Data: Turn 3G/4G off or here.


    +   * Enable LTE: To enable your iPad to search for and connect to LTE networks,
    work on this setting. Data may load faster using LTE, but remember that downloading
    still takes a toll on your battery life.


    +   * Data Roaming: Data Roaming is a feature of cellular networks that takes
    advantage of other carrier'' networks, if you''re out of range of your carrier''s
    network. Using data roaming can result in additional charges, so you may want
    to turn it off when you don''t need it.


    +   * View Account: Tap this setting to view account information.


    +   * Add a PIN: You may want to protect the data on your SIM card from prying
    eyes. Beyond a setting to unlock your iPad, you can assign a PIN to your SIM card.
    When you''ve assigned a PIN, whenever try to use a new SIM card or restart your
    Wi-Fi or 3G/4G iPad, you have to enter the password. Don''t forget your PIN, or
    you can''t unlock your SIM card.


    With Wi-Fi and 3G/4G model iPad, you also have access to the Airplane Mode in
    both the Settings and Control Center. This allows you to disable wireless features
    of your device by airline regulations when you''re on an airline flight. With
    Airplane Mode turned on, you won''t be able to browse, email, sync, buy online,
    or stream videos (which would only be able to do with a 3G/4G model miles up in
    the sky) unless the airline provides Wi-Fi. If it does, you can use the Wi-Fi
    setting in the Control panel to enable this, but do turn it off before takeoff
    and landing. Also, the GPS locator of Maps won''t work, but you can play content
    that you''ve downloaded, play games, and create documents in apps like Pages and
    Numbers. Just don''t forget to turn off the Airplane Mode setting when you land!'
  merge: -1
  img_proc: true
- pgno: 310
  md: '# Connecting to an Enterprise


    # Connecting with Personal Hotspot or iPhone Tethering


    If you want to connect your Wi-Fi-only iPad to your smartphone to go online out
    of range of a Wi-Fi network, you can tether the iPad to the phone using Verizon''s,
    T-Mobile''s, Sprint''s Personal Hotspot and AT&T''s iPhone 3G/4G Tethering. Tethering
    with any of these services allows your iPad to tap into your phone''s data connection
    to go online. You can connect anywhere your phone gives a connection — even if
    you have a Wi-Fi-only model.


    Tethering involves a few challenges. You don''t go online instantly you have to
    complete a few steps first, the connection speed might be a tad slow, and it can
    drain your phone battery quickly.


    After you''re comfortable with the trade-offs of the tethering option, you need
    to do two things:


    +   1. **Add the tethering option for your carrier on the carrier''s website logging
    in to your account and adding the feature.**


    This can come with a cost; with AT&T you might pay for tethering support (based
    on GB of usage) anywhere from $50 to $100 at the time of this writing.


    +   2. **Make the setting on your iPad on the tethering service by doing the following:**


    +   a. Tap the Settings icon.


    +   b. Tap Wi-Fi.


    +   c. Tap the tethering service in the Choose Network and make settings specific
    to your carrier.


    Sprint, T-Mobile, and Verizon pricing and features for iPad Air 2/mini 3 example.
    Verizon offers an individual plan at $45 a month and a family plan called Everything
    for up to 4 lines. AT&T offers 3GB of data for $30 a month and 40GB of data for
    a family for $150. You need both a basic data plan and a tethering plan which
    could cost an additional $50, which can add up. Still, if you often wander into
    areas that have no Wi-Fi and you don''t have a 3G or 4G iPad, it may — or may
    not — be more cost effective to use this feature.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_310_0.png)


    # Connecting to an Enterprise


    Exchange support opens possibilities for connecting an enterprise-network and
    its data remotely. If you work at a company using Microsoft Exchange and use an
    iPad, this is very good news.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Thanks to these enterprise features, here are some of the things you can do
    to connect to your organization''s network and data.


    # Setting up a configuration profile


    Microsoft Exchange is a messaging standard that allows the exchange of information
    between networks. With a configuration profile in place, you can set up a Microsoft
    Exchange account on your iPad. **A configuration profile** is a way for the network
    administrator at your enterprise to set up the systems in your company, via Microsoft
    Exchange or a VPN (virtual private network), which controls access to corporate
    email or contacts.


    Your administrator should check out the Enterprise Deployment Guide and the iPad
    Configurator utility from Apple (www.apple.com/support/ipad/enterprise). After
    set up a configuration profile is in place, it can be emailed to you or placed
    on a secure web page. Alternatively, your company''s network administrator can
    install a configuration profile for you.


    When you receive a configuration profile, you can install it yourself by opening
    the message and tapping the file. Tap Install and enter any information that''s
    requested, such as your password.


    # Setting up a Microsoft Exchange account


    Many companies use Microsoft Exchange to exchange their email, contacts, and calendar
    information with devices. iPhone has supported Microsoft Exchange for a while
    now, and iPad carries on the tradition. You can use Microsoft Exchange to wirelessly
    sync that information to your iPad from your corporate network.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_311_0.png)


    One benefit of connection to Microsoft Exchange is that your IT administrator
    can wipe the data and settings of a device remotely using a command in Exchange
    if it''s lost or stolen, keeping confidential business contacts private. Another
    option for erasing content on a lost device is to use iCloud''s Find My iPad feature,
    covered in more detail in Book 1, Chapter 9.


    To set up Microsoft Exchange, follow these steps:


    +   1. Tap Settings.

    2. Tap Mail, Contacts, Calendars.

    3. Tap Add Account.

    4. Tap Exchange.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '5. Enter your account information in the dialog shown in Figure 1-3 (email
    address, password, and a description) and then tap Next.


    The iPad uses Microsoft''s Autodiscover feature to verify your Exchange server.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_312_0.png)


    **Figure 1-3:** Exchange settings.


    6. If your iPad can verify your information, tap Save Save and you''re all set.


    If can''t, you may have entered incorrect information. Check with your network
    administrator to get the info you need.


    When you''re setting up a Microsoft Exchange account, you can choose which items
    you want to sync with, including your email, contacts, or calendar. You get choices
    for existing data on your iPad is handled (merged, kept in a separate account,
    or overwritten).


    # Setting up an LDAP account


    You can also set a Lightweight Directory Access Protocol (LDAP) account. LDAP
    accounts allow you to search for contacts on an LDAP server, which many organizations
    use to store data, and access them through iPad Contacts.


    Here''s how to set up an LDAP account on your iPad:


    +   1. In Settings, tap Mail, Contacts, Calendars.

    2. Tap Add Account.

    3. Tap Other.

    4. Tap Add LDAP Account.'
