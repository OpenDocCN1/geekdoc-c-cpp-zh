    # Syncing contacts with iCloud


    You can use your iCloud account to sync contacts from your iPad to back them up.
    These also become available to your iCloud account, if you set one up. Note that
    these steps can also be used for Google and Exchange accounts through the Mail,
    Contacts, Calendars section of Settings.


    Follow these steps to sync your contacts:


    +   1. Tap Settings on the Home screen and tap iCloud.

    2. In the iCloud settings shown in Figure 5-5, tap Contacts to sync contacts.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_492_0.png)


