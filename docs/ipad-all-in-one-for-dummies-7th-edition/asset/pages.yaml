    You can swipe right while reading a message in portrait orientation or then swipe
    left to hide the list.


    You can tap the Next or Previous button (top-left corner of the message in Portrait
    orientation) to move to the next or previous message.


    If you have multiple email accounts set up, you can choose which inbox to display.
