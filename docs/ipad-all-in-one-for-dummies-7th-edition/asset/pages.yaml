  md: '# Exploring the Status Bar


    AirDrop works only with the fourth-generation (or later) iPad and original iPad
    mini (later). If your iPad uses the Lightning connector (the small oval port on
    the bottom), it supports AirDrop.


    # Customizing the Side Switch


    You can customize the Side switch on your iPad mini 3 (It''s at the top-right
    side if you''re holding the iPad in vertical orientation). Use these steps to
    set it to control the screen orientation or mute sound:


    +   1. From the Home screen, tap the Settings icon.

    2. In the General pane, tap either the Lock Rotation or Mute option in the Use
    Side Switch section to choose which feature you want the switch to control.

    3. Tap the Home button to return to the Home screen.

    4. Move the Side switch up or down to toggle between the settings chose: screen
    rotation locked or unlocked, or sound muted or unmuted.


    If you choose to use the Side switch to mute or unlock system sound, you can use
    the Control Center to lock and unlock the screen rotation. This works the same
    way if you have set the switch to handle handheld screen rotation and want to
    mute or unmute the sound using the Control Center.


    # Exploring the Status Bar


    Across the top of your iPad screen is the status bar. (See Figure 2-17.) Little
    icons in this area can provide some useful information, such as the time, your
    battery charge, or the status of your wireless connection. Table 2-1 lists some
    of the most common items you''ll find on the status.


    Though it doesn''t sport an icon, you can swipe down on the status bar to display
    the Notification Center. This handy feature shows you all your alerts, updates,
    appointments, and more in one place.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_58_0.png)


    Figure 2-17: The status bar provides some handy info about your iPad.'
