- pgno: 18
  md: '# # Introduction


    Apple turned the computer world on its ear when it introduced the iPad. This small
    wonder, which weighed less than a pound and a half, sold many tens of millions
    of units in its first few years for good reason: It''s well designed and feature
    rich, and it opens a world of apps and media viewing in a highly portable format.


    # ## About This Book


    iPad All-in-One For Dummies, 7th Edition, has one aim: to be the ultimate reference
    on the coolest device of the day. If you are reasonably computer savvy, you can
    use this book to get up quickly the day you buy your iPad, and then you can pick
    up the book anytime you feel like getting your knowledge of the iPad to the next
    level. Even if you''ve been puttering with your iPad for a while, you''ll still
    find things between these that you didn''t know.


    Though the iPad is relatively simple to use, a lot is packed there, and you can
    get even more from it by downloading apps to do everything under the sun. This
    book approaches the iPad from every angle: from the basics to powerful roadwarrior
    tools.


    You can read step-by-step instructions for basic tasks, hot tips for getting the
    most out of iPad, and tips about apps that can take your iPad experience further.


    # ## Foolish Assumptions


    To offer you a book that gives insight into the powerful ways you can use iPad,
    I have to assume that you are computer and mobile-phone literate. You don''t have
    to be an iPhone user to use this book (though iPhone has a great similarities
    to iPad and shares many apps with it). You don''t have to be a Mac-oriented person
    — PC people do just fine with the iPad.


    I also assume that you want to take your use of the iPad to the next level by
    getting helpful tips and well as discovering several apps that are useful in expanding
    your iPad experience. You may use the iPad for personal pressure or to get your
    work done — both. If you travel a great deal or use the iPad to work, you''ll
    find extra benefits in the material covered in Books III and IV.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 2 Icons Used in This Book


    # Icons Used in This Book


    Little pictures often found in the margin of technical books help you quickly
    find certain types of information, such as tips or warnings. Here are the icons
    you should look for in iPad All-in-For Dummies, 7th Edition:


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_19_0.png)


    The Tip icon points to a tiny bit of advice about the current topic or other useful
    strategies for advancing your iPad experience to the next level.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_19_1.png)


    The Remember icon signals a pertinent fact that relates to the topic you''re reading
    (but could also be mentioned elsewhere in the book) or reiteration of a particularly
    important piece of information''s, well, worth repeating.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_19_2.png)


    The Warning icon alerts you to potential pitfalls, so don''t ignore it. Ignoring
    the Warning icon might leave you with lost data, a broken iPad, or a lost connection.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_19_3.png)


    For the latest and greatest features of iPad Air 2 and iPad mini, hunt for the
    New icon. If you own an earlier generation of iPad or iPad mini, this information
    can help you understand where your model might differ in its functionality. Note:
    Most features on your iPad will match this book unless you upgrade to the current
    operating system, iOS 8. However, the original iPad does not support iOS 8 at
    all, none of the coverage in this book is relevant to that model.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_19_4.png)


    The Technical Stuff icon marks iPad information that ventures beyond the


    # Beyond the Book


    This section describes where you can find the book''s companion content at www.dummies.com.
    Here''s what you can find:


    +   **Cheat Sheet:** Visit www.dummies.com/chesheet/ipada to find ways to personalize
