    You can have multiple VPNs set up, for example if you consult with companies with
    their own VPNs. Tap the one you want to use, and then set the VPN switch to On.
    To switch VPNs, disconnect from one, select the new one, and then turn VPN back
    on. Only one VPN can be active at any time. To delete a VPN configuration, tap
    the arrow to the right of the configuration in the General settings and tap Delete
    VPN.


    Book III Chapter 1


    Have your administrator check out third-party tools to help enable the use of
    corporate network by remote iPad users. For Enterprise helps a user manage and
    update smartphone-like standards if that person''s company has no single standard.
