    +   4. Tap the plus or minus signs in the Copy field to set the number of copies
    to print.


    +   5. Tap the Print button.


    Your photo goes on its way to your printer.


    # Playing around with Photo Booth


    Photo Booth is a photo-manipulation app that goes hand in hand with the still
    camera built into the iPad (except for the original iPad) hardware. You can use
    this app to capture photos using various fun effects, such as Kaleidoscope effects
    and X-Ray. You can copy or email photos from within Photo Booth.


    Note that photos you take with Photo Booth open automatically and are saved to
    your photo app''s Camera Roll.


    Here''s how to take photos using Photo Booth effects:


    +   1. Tap the Photo Booth icon on the Home screen.


    The different possible effects that can be used in the current view of the camera
    appear. (See Figure 4-4).


