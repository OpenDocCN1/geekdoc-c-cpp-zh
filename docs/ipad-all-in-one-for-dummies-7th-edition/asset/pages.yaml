- pgno: 384
  md: '# Chapter 3: Counting Numbers


    # In This Chapter


    +   - Getting to know Numbers

    - Working with a template

    - Using tabs and sheets

    - Using tables, cells, and forms

    - Creating new tables


    Numbers takes a different approach to the concept of spreadsheets. It brings to
    spreadsheets that you may never have seen. In different kind of structure but
    also data formats. In addition to being able to use numbers and text in your spreadsheets,
    you can use on-off check boxes and star ratings as part of your data. Think of
    an inventory spreadsheet with check boxes for in-stock items and star ratings
    based on reviewers or user feedback. What you may have thought of as a bunch of
    numbers can now provide true meaning and context to users.


    Numbers is a very practical addition to the other iWorks. Tables and charts are
    built into both Keynote and Pages, Numbers is the main number-crushing tool on
    the ipad.


    In this chapter, you discover how Numbers helps organize data into manageable
    units. If you enter your data, you can display it in charts and graphs.


    # Introducing Numbers


    When you create a Numbers document, you work with these three items:


    +   - A Numbers document: A container for spreadsheets (sheets) and their data;
    similar to a Microsoft Excel workbook.

    - One or more sheets: One or more spreadsheets called simply sheets.

    - Tables: The sub-sheets or tables created in other spreadsheet programs exist
    in Numbers as formal, structured tables rather than a range of cells within a
    spreadsheet. Numbers gives them a specific name: tables. (And yes, a Numbers document
    can have no tables but must have at least one.)


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_384_0.png)'
  merge: -1
  img_proc: true
- pgno: 385
  md: '# 368 Introducing Numbers


    The simple idea of making tables into an actual part of the Numbers application
    rather than letting people create them any which leads to a major change in the
    way you can use Numbers when compared to other spreadsheets. Because a table is
    an entity of its own and not a range of cells, you don''t break the tables you''ve
    organized in a spreadsheet when you reformat part of the spreadsheet. You can
    work within any table, and you can reorganize tables in a sheet, but you can break
    tables by simply adding a row or column to your spreadsheet.


    Figure-3-1 shows a Numbers for Mac template (Team Organization).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_385_0.png)


    **Figure-3-1:** The Team Organization template in Numbers for Mac.


    Figure-3-1 is a single document with four sheets visible in the tabs in the Sheets
    pane:


    +   - Roster

    - Schedule

    - Statistics

    - Budget


    Some sheets contain tables or charts, and you see them listed in the Sheets pane
    under their corresponding documents. For example, the Roster sheet contains the
    Team Roster and Team Management tables (scroll down to see the Team Management
    table). The Budget sheet contains the Cost'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# Introducing Numbers 369


    Breakdown table as a chart (Team Costs). The idea that a single sheet can contain
    defined charts and tables that don''t depend on ranges of cells is the biggest
    difference between Numbers and almost every other spreadsheet program.


    As you can see in Figure 3-1, sheets can also contain images and other graphics;
    they aren''t part of the structure of charts and tables. You simply insert these
    elements the same way you insert any other objects in iWork documents.


    You can select individual tables. A selected table has a frame with its column
    and row titles as well as other controls. Note that each table within its sheet
    has its row and column numbers (you can also name them, if you want) and each
    table you deal with starts with cell A1. (The first row is 1 and the first column
    is A).


    Various tools are available to you in the top-right corner of Numbers, as with
    other iWork apps. The buttons on this toolbar access settings for formatting tables;
    for inserting photos, charts, text, and shapes (see Figure 3-2) and for sharing
    documents and getting help.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_386_0.png)


    **Figure 3-2:** The Insert popover in Numbers.


    Numbers lets you insert charts along with tables on your sheets, as you see in
    Figure 3-3. (Remember that you can also insert graphics and other objects on your
    sheet.)'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# #370 Using the Team Organization Template


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_387_0.png)


    **Figure 3-3:** You can use charts in Numbers, too.


    Numbers also includes the ability to create forms, which to simplify data entry.
    When you create a form, you select a table and you''re taken to a tab that displays
    each column heading with a text box next to. You can then focus on entering data
    for one row at a time and eliminate the possibility of accidentally tapping and
    entering data in the wrong row. You can find more about forms in the "Using Forms
    Efficiently" section, later in this chapter.


    # ## Using the Team Organization Template


    This chapter uses the Numbers Team Organization template to demonstrate Features.
    You can create your own copy of the template so you can follow on your iPad, if
    you want. Sample data is part of the template, so you have data to work with,
    and you can add any other data you want. After you''ve experimented with Team
    Organization, you can pick another template, including the Blank template, and
    customize it for your own data.


    To create your own copy of the Team Organization template, follow these steps:


    +   1. **Launch Numbers on the iPad.**


    +   2. **Go to the Documents window.**


    If you have a spreadsheet open when you were last using Numbers, you return to
    that spreadsheet. simply tap Spreadsheets at the top left to go to the Documents
    window.


    +   3. **Tap Create Spreadsheet.**'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# Working with Tabs and Sheets 371


    4. Scroll down and tap Team Organization.


    Your new spreadsheet opens. Any changes you make are saved automatically.


    # Working with Tabs and Sheets


    Every tab displays a sheet, which can have one or more tabs or charts (or both)
    on it as graphics and text frames. Tabs help you organize the contents of your
    Numbers documents. In this section, I will tell you what need to know about setting
    up tabs in a document.


    # Adding a new tab


    As with iWork apps, starting a new Numbers document involves choosing a template.
    Each template has its own predefined tabs. The Blank template has only one tab
    (cleverly titled Sheet 1). You can add more tabs by using the plus sign (+) tab
    on the left end of the tabs (Figure 3-4).


    Tap here to add a new tab.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_388_0.png)


    Figure 3-4: The plus sign (+) tab always appears to the left.


    Tap the plus sign (+) tab, and Numbers asks whether you want to add a new sheet
    or a new form. Tap New Sheet, and Numbers creates a new tab that contains one
    tab (see Figure 3-5). The sheet is labeled Sheet 1. See the section "Changing
    a tab''s name," later in this chapter, for how to rename the tab. If you''re interested
    in forms, I tell you about that topic later in this chapter, "Using Forms Efficiently")


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_388_1.png)


    Figure 3-5: Add a new sheet.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_388_2.png)


    www-it-ebook.info'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# 372 Working with Tabs and Sheets


    # # Deleting or duplicating a tab


    If you add a tab by mistake, you can remove it. Also, if you want to reuse a tab
    as the basis for a new tab, Numbers allows you to duplicate it. To perform either
    of these actions, hold the tab you want to delete or duplicate, and a contextual
    menu appears below (see Figure 3-6). All you have to do now is tap the option
    (Duplicate or Delete) for the action you want to take.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_389_0.png)


    **Figure 3-6:** Duplicate or delete a tab.


    Remember that a double-tap opens the tab so that you can edit its name. A single
    tap opens the tab''s content. A press-and-hold opens a contextual menu, if available.


    # # Rearranging tabs


    If you don''t like the order of your tabs, drag a tab to the right or left in
    the row of tabs to the desired position, and release your finger when the tab
    is in the position you want (see Figure 3-7).


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_389_1.png)


    **Figure 3-7:** Rearrange tabs.


    # # Navigating tabs


    If you have more tabs than can be shown on the screen, swipe right or left to
    slide along the tabs. Remember to swipe in the row of tabs. Swiping the body of
    the sheet scrolls to the right or left of the content on that sheet.


    If you''re holding your iPad in portrait orientation, turn it to landscape orientation
    to show more tabs on the screen.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# Changing a tab''s name


    Double-tapping text anywhere in Numbers allows you to edit the text. The same
    statement applies to tabs, Double-tap the name of a tab to begin editing (see
    Figure 3-8). The onscreen keyboard appears, and you can change the current tab
    name and enter a new one.


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_390_0.png)


    **Figure 3-8:** Edit a tab''s name.


    # Using Tables


    Tables are at the heart of Numbers — they''re where you enter your data. This
    section shows how to work with a table as a whole; the later section “Working
    with Cells” shows how you to work with individual cells within a table.


    # Selecting a table


    To be able to work on a table, you need to select it. If the tab isn''t visible
    in the current tab, just tap the tab''s first. To select a table in Numbers, tap
    it.


    If you need to find an entry within a table, it''s easy to do. Tap the Tools button
    (the wrench icon near the top-right corner) to open the Tools popup. Tap Find
    and enter a word or phrase; then tap Search on the keyboard to search the entire
    Numbers document for a match in that table.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '# 374 Using Tables


    When a table is selected, its appearance changes (see Figure 3-9). A selected
    table is framed with gray bars (the column frame) and to the left of it (the row
    frame). To the left of the column frame, a button with concentric circles lets
    you move the table. To the right of the column frame, as well as beneath the row
    frame, are buttons, each with four small squares (looking a bit like table cells).
    These Cells let you add rows, columns, or cells manipulate the table. See the
    later section "Working with Cells"


    ![](img/2a8a8d89daeb1b3896bd38ebf18af126_391_0.png)


    **Figure 3-9:** Select a table.


    Select a table by tapping it once. Note that the location of your tap is important:


    +   - If you tap in a cell, the table and that cell are selected.

    - If you tap inside the table bounds but outside the cells, the table itself is
    selected. For example, if you tap the table''s title or the blank space to the
    left or right of the title, the table itself is selected. (Refer to Figure 3-9)


    # Moving a table


    You can move a table around on its sheet. Select the table and tap the round button
    to the left of the column frame. Drag the table to the place you want it. (See
    Figure 3-10). Numbers shows you the absolute coordinates of the location you''re
    dragging to. Light-colored lines guides help you align the table to other objects
    on the sheet. These lines appear and disappear as the table is aligned with the
    edges or centers of other objects.


    www.it-ebooks.info'
  merge: -1
  img_proc: true
