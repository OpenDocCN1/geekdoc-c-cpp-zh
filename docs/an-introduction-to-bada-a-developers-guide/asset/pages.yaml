- pgno: 133
  md: '# 2. Complete the construction:


    +   - This should include creation of all objects that require dynamically allocated
    memory.


    The object returned by the first step is not yet complete, and therefore cannot
    be used; but if memory allocation fails, as no memory has been allocated, there
    is nothing to clean up.


    If allocation succeeds, memory will have been allocated for all class members.
    Where members are simple values, there is no more work to be done if default values
    have been set using compile-time values, or at runtime using initialisation list
    syntax or (simple valued) passed parameters.


    Where members are themselves objects requiring dynamic allocation, memory for
    the member pointers will have been allocated, but not the objects themselves.


    The second step of object construction should now make any further allocations
    (and of course should also use two-phase construction for those objects where
    necessary).


    Used systematically, this is an easy convention to follow, and classes become
    self-documenting; wherever a Construct() method is present in the class, two-phase
    construction should be used.


    # Object Ownership Responsibilities


    A further small, but important, complication relating to memory allocation and
    object construction is that sometimes framework methods require the framework
    to allocate and return a new object to the calling app. However, once the object
    is returned by the framework, and the object is passed into the ownership of the
    caller, the framework no longer knows when the object is finished with.


    In this case, the simple rule that allocating and freeing memory should always
    be done symmetrically no longer holds. The problem for the app programmer is,
    then, to know whether or not the app, or the framework, should be responsible
    for cleaning up a given object.


    This problem is solved almost trivially in bada by a simple naming convention,
    and the associated rule:


    # Convention


    Trailing ''N'' in a method name, for example SomeType SomethingN();


    # Rule


    The caller is always responsible for deleting objects returned by a framework
    method named with a trailing ''N''.'
  merge: -1
  img_proc: true
