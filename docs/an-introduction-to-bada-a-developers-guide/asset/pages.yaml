- pgno: 51
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_51_0.png)


    Figure 2.6 BuddyFix showing in the main menu.


    # 2.1.5 Standard Output


    One useful view in the Eclipse IDE is the Output pane. When you launch an app
    in the Simulator, the system logs an ‘Application started’ message, and when you
    close the app, the system logs an ‘Application finished’ message:


    ```

    0010.200, INFO, P26, T-01, A-01, OspMain (24) > Application started.

    0014.030, INFO, P26, T-01, A93, OspMain (39) > Application finished.

    ```


    Between these log points, you can output your own printf-like logging statements
    to trace your app’s behaviour at runtime, using bada’s logging macros, AppLog(),
    AppLogDebug(), and AppLogException(). For example, to output a simple log message,
    add the line:


    ```

    AppLog("This message will display in the output view");

    ```


    Log files can be exported to simple text files with a .log suffix. In the Output
    pane, once your application is running, select the second icon on the left (as
    indicated in Figure 2.7); a dialog is invoked that allows saving the output into
    a log file on your development machine.'
  merge: -1
  img_proc: true
- pgno: 52
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_52_0.png)


    # Figure 2.7 Output pane of the bada IDE.


    Log messages are also written by the assert macros AppAssert() and AppAssertIf(),
    which test the truth (or falsity, respectively) of a condition, and by the exception
    handling macros, which we look at in detail in Chapter 4.


    The debugging macros are described in the SDK Help, select Help | Help Contents
    | bada Developer Guide in the IDE.


    # 2.2 The Application UI


    We’ve said that a bada application can be thought of as a GUI that does something,
    where the GUI is the public face that your app shows to the user. Before getting
    down to practicalities and showing you how to build a simple GUI, let’s fill in
    some background.


    Depending on its complexity, an application may require only a single screen –
    a simple calculator layout, for example, for a Calculator app. Or it may require
    multiple screens such as an Address Book app, which might organise its main screen
    as a scrolling list of name and address entries, with a details screen to display
    details of a single complete entry, and editing screens to enable editing of entry
    details, labels, and so on.


    Getting your GUI design right is one of the most important tasks you’ll face as
    an app developer. Lots has been written about the art of good UI design, and a
    lot has been written about the special case of good mobile UI design. Two attributes
    that characterise the best are: fanatical attention to detail and ruthless simplification.


    It is important, too, to understand your app GUI in the context of the platform
    look-and-feel. Remember that bada is designed to push the smartphone experience
    down from the high end into the midrange. This influences the design of the bada
    touch UI, and in turn it should influence your GUI design.


    > 2Scott Jensen’s The Simplicity Shift (Cambridge University Press, 2002) is an
    excellent corrective to engineering-led design habits. Christian Lindholm et al.,
    Mobile Usability: How Nokia Changed the Face of the Mobile Phone (McGraw-Hill,
    2003) provides fascinating case studies in the evolution of first- and second-generation
    mobile phone UIs. Barbara Ballard, Designing the Mobile User Experience (Wiley,
    2007), is a good overview text. And no app developer should be without Bill Moggridge,
    Designing Interactions (MIT Press, 2007). There’s also a wealth of material on
    the Web that discusses the general principles of mobile UI design, including some
    excellent documentation published for other mobile platforms you may be familiar
    with, relevant to all mobile app development, whatever the platform.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'While there is no substitute for getting your hands on a real device, the following
    bada design points are worth bearing in mind:


    +   - Touch – finger-based direct manipulation including multi-touch, pinching
    and swiping, and of course tactile feedback.

    +   - Simplicity – simple screen layout, relatively large and bold fonts, large
    GUI elements for interaction, large simple icons, limited customisation, simple
    menus.

    +   - Bright and bold – making the most of superAMOLED display technology, high
    contrast, vivid colours, saturated blacks (and by the way, dark colour schemes
    are preferred to light, because with AMOLED technology dark pixels consume less
    power than light pixels).

    +   - Extended user input – as well as touch and hard keys, the touch UI supports
    gestures (physical motions including tapping on the case, rotating the phone,
    snap and shake), and even face detection.

    +   - Multiple display sizes and resolutions – WVGA (Wide VGA) 480 × 800, WQVGA
    (Wide Quarter VGA) 240 × 400.


    You can find detailed UI guidelines in the SDK Help. Select Help | Help Contents
    | bada Application UI Guide in the IDE.


    # 2.2.1 Frames, Forms, and Controls


    The GUI is not just what you see on the screen. The simplicity of bada’s touch
    UI look-and-feel extends to the architecture beneath it, and to the concepts that
    motivate the architecture. While bada won’t design your GUI for you, it does provide
    a simple and standardised GUI architecture for your app to use.


    You can think of everything your app displays as being organised in a hierarchical
    tree. The root of the tree is the application Frame. Within every app, the Frame
    is the top-level container to which all GUI elements are added. More formally,
    the Frame class encapsulates the device display, and plays the role of the application’s
    top-level window, of which there is exactly one per application. All applications
    have a Frame, and you don’t need to do anything to create it or set it up. It’s
    all taken care of by the framework.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'standard controls that are ready-made by the framework, or your own derived
    custom controls. The Control class abstracts a screen region, both for display
    and capturing input.


    Naturally, bada provides comprehensive graphical primitives, bitmaps, animations,
    and fonts, so the real limits here are your imagination – and your design skills!⁴
    The relationship between Frames, Forms, and Controls is shown in Figure 2.8.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_54_0.png)


    Figure 2.8 All applications have a Frame, the top level container within which
    Forms are added; Forms are populated with Controls.


    # 2.2.2 Standard Elements of a Form – Indicator Bar, Title Bar, Soft Keys, Option
    Menu


    A Form occupies the full physical display area of the phone – everything visible
    on the screen. Forms therefore also optionally include some standard system elements
    (see Figure 2.9). These are


    +   - The Indicator bar at the top of the display area, used to display system
    icons (such as signal and battery strength) and notifications (such as whether
    you have unread messages).


    +   - The Title bar, which can display a string.


    > ⁴Under the hood, the raw horsepower for bada’s graphics capabilities is based
    on OpenGL ES, with support for 2.0 (hardware acceleration and hardware shaders)
    and 1.1 standards (hardware acceleration only). The OpenGL ES version available
    is device dependent. It is also possible that at the low end, some bada phones
    will not support OpenGL ES at all. Apps that require OpenGL ES will not install
    on phones that lack appropriate support.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '+   - Soft keys that are displayed in the command area at the bottom of the
    main display.

    +   - The Option menu key, displayed at the bottom of the display area between
    the soft keys, used to launch an Option menu.


    The system elements are defined as properties of the Form. The decision whether
    to display all or some of them is made by each Form, and is therefore under the
    control of the application that defines the Form. However, their look and feel
    (and in the case of the Indicator bar, its contents too) is not directly controlled
    by the app. Although the Form displays the system elements, the framework retains
    control of them.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_55_0.png)


    **Figure 2.9** The application name and standard system elements.


    # 2.2.3 Handling Events


    We said that every Control-derived class abstracts a screen region, both for display
    and input, but we didn’t say how. Input events include input from the touch screen,
    including menus and soft keys, from the physical phone keys including side keys
    such as Lock and Camera, from gestures and raw sensor events, from bada system
    events – potentially from *any* type of event.


    Listeners are the glue that binds behaviour to presentation in a bada app. In
    bada, listeners provide the mechanism for all event handling. At any time, exactly
    one control has *focus* in the GUI. *Focus* just means which object is actively
    updating the display and receiving user and system events. Conceptually, focus
    belongs to the currently active control of the currently running foreground application.
    This control receives any input events that occur (and by the way, also initiates
    redrawing the display).


    Every control has built-in listeners for the basic event types it recognises.
    Depending on the control, these might include any of the following:


    +   - Focus events

    +   - Key events

    +   - Touch events

    +   - Drag and drop events'
  merge: -1
  img_proc: true
