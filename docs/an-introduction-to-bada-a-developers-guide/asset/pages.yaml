    Time can be represented in two different ways in the bada platform:


    +   The DateTime class represents dates and times with values ranging from 12:00:00
    midnight, January 1, 0001 to 11:59:59 P.M., December 31, 9999 in the Gregorian
    calendar and provides methods for conversion between time formats.


    +   The TimeSpan class represents a period of time measured in ticks. A tick is
    the smallest unit of time used by the platform or system. In bada, it is a millisecond.


    This recipe details three different examples of how a developer could use these
    two different methods of representing time, and provides some sample code snippets.
    This recipe assumes the steps detailed in the recipe ‘Add a Form to a Frame-based
    App’ in the second group of recipes (“UI Basics”) have been followed to add a
    Form to the application’s Frame.


    Within the Osp::System namespace is the SystemTime class, which provides methods
    for getting the current system time and the length of time the device has been
    powered on. This recipe uses the SystemTime class to get time information for
    creating DateTime and TimeSpan objects.


