    \ and Related Topics\n\nIn this recipe it has been assumed that the device in\
    \ question is able to devote a large chunk of its processor time to the methods\
    \ in the FaceRecognizer class and consequently that the recipe can process the\
    \ maximum number of faces at a medium scale. In reality, of course, these methods\
    \ may have to share processor time with other computationally demanding application\
    \ features such as video processing and display.\n\nDevelopers should therefore\
    \ pay close attention to the time taken to execute the face recognition methods,\
    \ and consider adjusting the properties of the FaceRecognizer if this time is\
    \ excessive for the application in question. This could be done by reducing the\
    \ maximum number of faces to look for or increasing the value of the Scale property\
    \ to stop the FaceRecognizer looking for smaller faces.\n\nCaution should be exercised\
    \ after calls to the various ExtractFaceInfo...() methods, because these methods\
    \ have the postfix 'N'. The caller must make sure that the returned instances\
    \ (in this case the FaceRecognitionInfo objects) are deleted once they are no\
    \ longer of use. Users should bear in mind that simply deleting the IList of the\
    \ objects will just delete the pointers and not the objects themselves.\n\nThe\
    \ FaceRecognizer is designed to use information obtained from previous frames\
    \ in determining where to look for faces in a video stream. Therefore, the first\
    \ five calls to ExtractFaceInfoFromVideoStreamN() will return null, even if faces\
    \ are present in the video. Users should take care not to construct a new FaceRecognizer\
    \ every frame; otherwise their application may not detect any faces at all.\n\n\
