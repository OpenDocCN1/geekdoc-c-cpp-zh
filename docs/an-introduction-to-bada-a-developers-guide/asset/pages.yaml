  md: '# Recipe 2.7: Get Touch Events


    # Problem Description


    You want to retrieve touch events from the user input.


    # The Recipe


    The following configuration is required for this recipe:


    | Configuration | Value |

    |---|---|

    | **Namespaces used:** | `Osp::Ui`, `Osp::Ui::Controls`, additionally `Osp::Graphics`
    for graphics canvas drawing in the recipe |

    | **Header files to #include:** | `FUi.h`, `FUiControls.h`, additionally `FGraphics.h`
    for graphics canvas drawing in the recipe |

    | **Required libraries:** | `FUi`, `FUiControls`, additionally `FGraphics` for
    graphics canvas drawing in the recipe |

    | **Required privilege level:** | `Normal` |

    | **Required privilege groups:** | `None` |


    The bada platform supports both single-point touch and multi-point touch user
    input. This recipe details the steps to enable single-point touch user input within
    a Form and describes the code that needs to be implemented for the Form to receive
    and handle touch events.


    This recipe assumes the steps detailed in Method 2 of the ‘Add a Form to a Frame-based
    App’ recipe have been followed to add a Form to the application’s Frame.


    In this recipe the touch-screen user input is handled by the application and is
    used to draw lines on a graphics canvas (see Figure R2.8). A line is drawn on
    the graphics canvas following the motion of the user’s touch input. The double-tap
    touch input is used to clear the canvas.


    As shown in the ‘Add a Form to a Frame-based App’ recipe the MainForm class is
    inherited from the Form base class. In order for this Form to handle events from
    the touch screen, an event listener interface has to be implemented. So in this
    recipe the MainForm class must implement the `Osp::Ui::ITouchEventListener` interface
    class.'
  merge: -1
  img_proc: true
