  md: "Please take note of the *this parameter passed on to the Construct() method\
    \ of the BluetoothManager and BluetoothOppClient classes. All these construct\
    \ methods take reference to the object implemented as their respective event handlers.\n\
    \nGiven below is the function definition of the IActionEventListener, OnActionPerformed().\
    \ This is the function that receives events on the UI controls. Here, it receives\
    \ the button press events. In the Form, if the Send button is clicked, the Bluetooth\
    \ client will send a file by calling SendFileToTargetUsingOPP().\n\nThe client\
    \ can't push a file while the Bluetooth server is using a Bluetooth device. To\
    \ prevent this, stop the Bluetooth server service before pushing a file and restart\
    \ the server service after the client finishes to push a file.\n\n```\nvoid\n\
    BtForm::OnActionPerformed(const Controls& source, int actionId)\n{\n    switch\
    \ (actionId)\n    {\n    case ID_BTN_SEND:\n    {\n        // stop OPP server\
    \ service\n        if(pBtServer)\n            pBtServer->StopService();\n\n  \
    \      // send a file to peer BT device using OPP profile.\n        pBtClient->SendFileToTargetUsingOPP();\n\
    \n        // start OPP server service\n        if(pBtServer)\n            pBtServer->StartService();\n\
    \    }\n        break;\n    default:\n        break;\n    }\n}\n```\n\nIt's time\
    \ to send the file. See the function definition below to understand how to transfer\
    \ a file from one device to another through the Bluetooth OPP. The SetMinProgressInterval()\
    \ method specifies the minimum invocation interval of the IBluetoothOppClientEventListener\
    \ interface's OnOppTransferInProgress() listener method. The unit is percentage\
    \ and the default value is 5.\n\n```\nvoid\nBtClient::SendFileToTargetUsingOPP()\n\
    {\n    // make a Popup to show the progressing of the transfer\n    ShowTransferProgress();\n\
    \n    // send a file to server\n    pBtOppClient->SetMinProgressInterval(5);\n\
    \    pBtOppClient->PushFile(*pBtDevice, strFileName);\n}\n```"
