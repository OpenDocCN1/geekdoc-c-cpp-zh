- pgno: 412
  md: 'OPP is a basic profile for sending ‘objects’, such as images, virtual business
    cards, or any type of file. The name includes ‘Push’ because the transactions
    are always initiated by the sender (client), not the receiver (server). In this
    recipe we show you how to use Bluetooth OPP.


    Before we look at code, let’s summarise the most important classes and methods
    of the Osp::Net::Bluetooth namespace:


    +   - BluetoothDevice: encapsulates device identity and type.

    +   - BluetoothManager: provides APIs to manage Bluetooth features, for example
    activation and deactivation of the Bluetooth hardware.

    +   - IBluetoothManagerEventListener: an interface class that specifies the methods
    used for notifying different kinds of Bluetooth Manager events, for which appropriate
    listener methods are called.

    +   - BluetoothOppClient: provides APIs to use the OPP profile.

    +   - IBluetoothOppClientEventListener: an interface class that specifies the
    methods used for notifying different kinds of Bluetooth OppClient events, for
    which appropriate listener methods are called.

    +   - IBluetoothOppServerEventListener: an interface class that specifies the
    methods used for notifying different kinds of Bluetooth OppServer events.


    To demonstrate OPP in this recipe, we are going to:


    +   1. Define a Bluetooth client class and a Bluetooth server class.

    +   2. Create a basic application with a Form and a button for an OPP client.


    # Bluetooth client:


    +   1. Construct a BluetoothManager instance and select a target Bluetooth device
    from the Bluetooth manager.

    +   2. Implement onActionPerformed() to handle user events to send a file or cancel
    the file.

    +   3. Send a file to the target device (OPP).

    +   4. Display transfer progress.

    +   5. Implement IBluetoothManagerEventListener and IBluetoothOppClientEventListener.


    # Bluetooth server:


    +   1. Create an OPP server and implement IBluetoothOppServerEventListener for
    working as a OPP server.

    +   2. Receive a file from a remote OPP client.'
