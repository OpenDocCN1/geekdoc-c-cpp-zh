  md: '# bada Fundamentals


    This chapter starts with an overview of the bada platform – its origins and its
    architecture – and moves on to look at its programming idioms and conventions,
    and the bada class library and its platform-specific types. It concludes with
    some practical quick tutorials that run through the most important of bada’s C++
    programming idioms.


    # What You Will Learn


    This chapter aims to give you the context you need to use bada effectively as
    a developer. It gives the bigger-picture view of what bada is. You will learn
    about:


    +   1. The high-level system architecture

    +   2. The bada class library and the platform specific types you’ll be using
    in your apps, including collections, strings and numbers

    +   3. The idioms and naming conventions you’ll need to know to write, and read,
    bada code


    # What You Will Need


    To get the most from this chapter we recommend – apart from the bada SDK and IDE
    – a cup of tea and an armchair – but any other refreshment will do quite nicely!'
