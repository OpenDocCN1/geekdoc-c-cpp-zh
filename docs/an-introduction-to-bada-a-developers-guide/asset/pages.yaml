  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_202_0.png)


    # Figure 6.14 Classes for rendering a Map within a UI control.


    The purpose of each layer and the related classes and methods for manipulating
    this information is as follows:


    # Zoom


    The top layer containing UI controls for zooming. The application implements IMapEventListener::OnMapZoomingStarted
    and OnMapZoomingEnded to be notified when the user zooms the map.


    # Info Window


    Word bubbles that display useful information about locations and businesses. This
    may include a brief description of a business and its contact details, for example.
    Info windows are created using the NativeMapInfoWindow class for pre-defined windows
    and IMapInfoWindow classes for user-defined windows.


    # MyLocation


    Displays the current location on the map, together with a circular bounds showing
    the margin of error. The application can choose whether to display this information
    by using the Map::SetMyLocationEnabled method.


    # Overlay


    An interactive layer with shapes marking out locations on the map and markers
    that can be moved by the user like pins on a physical map. Shapes – polygons,
    circles, and rectangles – can be included in a map by adding objects deriving
    from the MapOverlayShape class, while movable markers derive from MapOverlayMarker
    as shown in Figure 6.15.'
