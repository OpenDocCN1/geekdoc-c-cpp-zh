- pgno: 122
  md: 'At the UI level, the middleware supports all of the things you are likely to
    want to do, and bada devices are cool, sexy, and full-featured. Devices, in fact,
    are perhaps the biggest part of the bada story – which is exactly what you might
    expect from Samsung.


    Samsung ships well over 200 million phones a year. In 2009, 40 million of these
    phones were touch-screen based and this number is expected to grow significantly
    in 2010. bada will be the main platform for touch-screen phones, replacing Samsung’s
    previous proprietary platform. These numbers are what bada is really about. Its
    goal is to open a platform that has been highly successful in the marketplace
    (it has driven Samsung into the number 2 slot for mobile handset vendors, after
    all) to bada apps developed by third-party developers. That goal will have the
    effect of driving the app revolution into its next phase, and pushing it down
    into the midrange from the high end of coveted but expensive devices – whether
    those are Apple devices running iOS or smartphones from all vendors, including
    Samsung, running smartphone OS such as Symbian, Android, Windows Mobile, and LiMo.


    That midrange of ‘phones for the rest of us (including your Mum)’ has proved to
    be fertile territory for Samsung to date, and opening it up to apps is a logical
    step.


    But let’s stop talking like marketers, and get down to nuts and bolts.


    # 4.1.2 A Short bada History


    In this book, we are interested in understanding the platform software from the
    app developer’s perspective. In other words, our real focus is on how to use the
    platform and take advantage of its features to write cool bada apps.


    But the context in which a system has grown and evolved, and the stages through
    which it has evolved, have a big impact on the way it is put together, and understanding
    how a system is put together can help you understand how to get the best from
    it.


    Samsung started development of its in-house 3G phone platform sometime around
    1999. As Samsung watchers know, one enduring principle of its phone business is
    to provide every phone platform for which there is market demand. At the time
    of writing, Samsung ships phones on each of Android, LiMo, Symbian, and Windows
    Mobile, as well as its proprietary platform, not to mention the first bada phone,
    the Wave.'
