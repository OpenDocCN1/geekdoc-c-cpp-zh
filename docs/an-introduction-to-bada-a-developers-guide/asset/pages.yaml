- pgno: 107
  md: 'Before it can be used within an application, image data must be loaded from
    file into memory. Image data that is held in memory on the phone should typically
    be saved into a file format before it is transferred off the phone, or before
    it can be shared with other apps on the phone.


    In bada, the Bitmap class encapsulates image data in memory, and the Image class
    is provided as a utility class to perform conversions both ways between files
    and bitmaps, as well as directly between different file formats.


    Using the Image class, image data can be:


    +   - decoded into a bitmap from a supported file format;

    +   - or encoded from a bitmap into a supported file format.


    A Bitmap object contains a (decoded) physical copy of the original file data,
    stored in a standard bitmap format (see below). This means that after decoding,
    the Image object and the original image file are no longer required.


    To create a Bitmap object from an image file:


    +   1. new and Construct() an empty Image object:


    ```

    Image* pImage = new Image();

    pImage->Construct();

    Bitmap* pBitmap = null;

    ```


    +   2. Call the Image.DecodeN() method to decode the image data from the file.
    DecodeN() returns a Bitmap object:


    ```

    pBitmap = pImage->DecodeN(L"/Res/bada.png", BITMAP_PIXEL_FORMAT_ARGB8888);

    ```


    +   3. Delete the Image object:


    ```

    delete pImage;

    ```


    +   4. Use the Bitmap object, and delete when no longer required, for example:


    ```

    pButton->SetNormalBitmap(Point(0,0),"pBitmap");

    delete pBitmap;

    ```


    Specifically, the Image class contains utility methods for handling images:


    +   - encoding and decoding image data to/from file;

    +   - converting bitmap or file image data between image formats;

    +   - Compressing JPEG images;


    Decoding image data supports the following file types:


    +   - JPEG

    +   - GIF

    +   - PNG'
  merge: -1
  img_proc: true
- pgno: 108
  md: '+   - BMP

    +   - TIFF

    +   - WBMP


    Encoding supports the following file types:


    +   - JPEG

    +   - PNG

    +   - BMP


    Three different bitmap formats are supported by bada. The bitmap pixel format
    specifier defines the colour mode of the destination bitmap and accepts the following
    enumerated types:


    | RGB565 pixel format | BITMAP_PIXEL_FORMAT_RGB565 |

    | ARGB8888 pixel format | BITMAP_PIXEL_FORMAT_ARGB8888 |

    | R8G8B8A8 pixel format for OpenGL | BITMAP_PIXEL_FORMAT_R8G8B8A8 |


    The pixel formats represent the following standard colour modes:


    +   - RGB565 specifies 16-bit RGB with 5 bits of red and blue, and 6 bits green.

    +   - ARGB8888 specifies 32-bit Alpha RGB with 8 bits each.

    +   - R8G8B8A8 is an alternative 32-bit, byte-based format preferred by OpenGL(R).


    See FGrpBitmapCommon.h, the header file for all enumerations of the Bitmap class.


    As with the graphics drawing primitives, Bitmap objects represent pixel data and
    are displayed by drawing the Bitmap object into a region of a Canvas, and showing
    the Canvas.


    Because every image has a ‘real’ size (the size at which it was created), which
    may not be the size at which you wish to display it on the phone, decoding from
    an image file supports image scaling. Other transformations, for example rotation,
    can be performed when the image is drawn to the Canvas.


    A bitmap can also be clipped to a region of the Canvas, as a separate step from
    sizing and positioning the screen region (which must always be a rectangle) to
    which it is drawn.


    The following is a complete example, with code, of the steps required to display
    a bitmap.'
  merge: -1
  img_proc: true
