- pgno: 473
  md: 'Finally, assuming your buddy request has been successfully sent to the server,
    the person you sent the request to needs to check the received request and respond
    to it. This process is described in detail in Chapter 5.


    # Hints, Pitfalls, and Related Topics


    The buddy service is a powerful and convenient feature in bada. But be aware of
    how the request and response between the device and the bada Server work. The
    call-back function is invoked asynchronously, and there may be network errors
    and delays. So it is always recommended to track all error messages. Sometime
    if you don’t find the person you want to add as buddy, it might be because their
    profile is not set as `PROFILE_SEARCHABLE`.


    The BuddyManager sample from the SDK provides a more detailed implementation and
    functions for handling buddies. Please feel free to use this in your own implementations.'
