  md: '# Recipe 1.2: Use Error Handling in bada


    # Problem Description


    bada does not support the standard C++ exception handling mechanism. However,
    you need to catch and handle exceptions, which you can do by exploiting the mechanisms
    built into bada.


    # The Recipe


    The following configuration is required for this recipe:


    | Configuration | Value |

    |---|---|

    | **Namespaces used:** | N/A |

    | **Header files to #include:** | N/A |

    | **Required libraries:** | N/A |

    | **Required privilege level:** | Normal |

    | **Required privilege groups:** | None |


    The content of this recipe is not related to any specific namespace. What we describe
    here is rather a generally valid concept and describes the way in which bada handles
    exceptions. The reason for this speciality lies in the fact that the bada SDK
    was designed with optimised runtime efficiency in mind. Most of the standard C++
    was applied. However, the bada SDK does not comply with standard C++ exception
    handling. Although this is a very convenient and well-proven technique, it is
    also very heavyweight and resource intensive. The bottom line is: bada is for
    mobile devices, which are embedded devices that are resource restricted compared
    to desktop computers. Hence, programming for these devices should also be treated
    differently. That is why in bada there is no standard C++ exception handling.


    The exception handling in bada was designed to be extremely lightweight and simple.
    To realise this, a specific type was defined that is called result. This result
    type holds information about exceptions that have occurred and can be queried
    accordingly. Many different values are defined for describing the potentially
    occurring exceptions. Later in this recipe we give a list of these values.


    The most common way to make use of the result type in bada is to use it as a return
    value for relevant methods. The bada API that opens up the SDK'
  merge: -1
