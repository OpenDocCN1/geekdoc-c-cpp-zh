- pgno: 74
  md: "# Step 1: On the developer.bada.com Portal\n\nWhen you signed up on the developer.bada.com\
    \ portal to download the IDE and SDK, you did more than register for a download;\
    \ you joined the bada developer programme. This enables you to access the online\
    \ services that provide many useful resources such as documentation, API reference,\
    \ code samples, tutorials, blogs, videos, or a support forum.\n\n# Generate an\
    \ Application Profile and Download the manifest.xml\n\nIn this section we concentrate\
    \ on the custom app profile generator, which should be the starting point for\
    \ your real projects, because it allows you to define the functionality of your\
    \ app and to specify the hardware features your app requires or expects (e.g.\
    \ screen size, sensors, default orientation). The portal also checks that your\
    \ app name is globally unique, as well as assigning a unique numerical ID that\
    \ your app uses to protect its private resources.\n\nIn section 2.1, metadata,\
    \ we looked very briefly at the two metadata files that every app project must\
    \ include: application.xml and manifest.xml. These, we said, declare application\
    \ information used to package the app – such as names, versions, and intended\
    \ target phone models – as well as critical security permission declarations.\
    \ Configuration of the application.xml is handled by the IDE. The web portal helps\
    \ to establish the manifest.xml.\n\nTo create your manifest file go to the developer.bada.com\
    \ portal and click the My Applications tab. Then invoke the Application Manager\
    \ on the left. There you can then start to generate your application profile.\
    \ Figure 2.22 shows the web site and the five simple steps to follow.\n\nFirst,\
    \ give your app a name, and add a description if you want. Second, you define\
    \ the privileges that are the main functionalities of your app. If your application\
    \ involves any remote services from the bada Server, you can define them during\
    \ the third step. Fourth, you specify the hardware requirements against the mobile\
    \ handset. And finally you can download the manifest file.\n\nThe downloaded manifest.xml\
    \ typically contains info as illustrated below:\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"utf-8\"?>\n<Manifest>\n  <Id>93btip123e</Id>\n  <Secret>9C645DBA19C71BAD1204DA4DAA7A0B9</Secret>\n\
    \  <AppVersion>1.0.0</AppVersion>\n  <Privileges>\n    <Privilege>\n      <Name>IMAGE</Name>\n\
    \    </Privilege>\n  </Privileges>\n  <DeviceProfile>\n    <CPU>Cortex6</CPU>\n\
    \    <MinimumHeapSize>16</MinimumHeapSize>\n    <MinimumVRAMSize>4</MinimumVRAMSize>\n\
    \    <Accelerator3D>OpenGL-ES1.1</Accelerator3D>\n    <Accelerator3D>OpenGL-ES2.0</Accelerator3D>\n\
    \n```"
