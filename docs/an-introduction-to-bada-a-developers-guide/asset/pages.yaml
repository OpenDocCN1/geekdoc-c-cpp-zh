    //Getting the items start from index 1 to index 2 from the item group

    // with group ID "100000000a"

    pItemService->GetItemList(L"100000000a", 1, 2, reqId);

    ```


    In addition, you also have to implement the listener to catch the replies from
    the server that are needed when you construct the pItemService object.'
