    \ Cancel button. In this case we would call the client’s CancelPush() method.\n\
    \nOnce you have called the BluetoothOppClient class’s PushFile() method, the underlying\
    \ Bluetooth hardware will start sending the file you have selected (strFileName),\
    \ chunk by chunk to the target device (pBtDevice).\n\nA number of control communications\
    \ or ‘handshakes’ take place between the source and target Bluetooth devices when\
    \ you try to push a file. All the responses or results of these communications\
    \ are handled by the application in the IBluetoothOppClientEventListener class’s\
    \ three event handlers.\n\nOne of these methods, OnOppTransferInProgress(), gives\
    \ an update about how much the file has been sent so far, at regular intervals\
    \ (this value is set using the method SetMinProgressInterval()). This value is\
    \ used to update the transfer progress bar. Another IBluetoothOppClientEventListener\
    \ method is OnOppTransferDone(), which notifies that the file transfer has finished.\
    \ The code for this is below.\n\n```\nvoid\nBtClient::OnOppTransferInProgress(int\
    \ percent)\n{\n    if (pTranProg)\n    {\n        pTranProg->SetValue(percent);\n\
    \        pTranProg->Draw();\n        pTranProg->Show();\n    }\n}\n\nvoid\nBtClient::OnOppTransferDone(const\
    \ Osp::Base::String &fileName,\n    int fileSize, bool isCompleted)\n{\n    if\
    \ (pProgPopup)\n        delete pProgPopup;\n}\n```\n\nFrom now on we have to create\
    \ the OPP server. The following code snippet shows what we have to do to create\
    \ and start the service of the OPP server:\n\n```\nbool\nBtServer::Initialize()\n\
    {\n    pBtOppServer = new BluetoothOppServer();\n    pBtOppServer->Construct(*this);\n\
