  md: "The Net::Sockets namespace provides a set of classes, methods, and properties\
    \ for TCP (Transmission Control Protocol) or UDP (User Datagram Protocol) socket\
    \ programming.\n\nThe Socket class is the base class for connecting, sending,\
    \ and receiving data over a network. Socket, by default, is created and used in\
    \ asynchronous (non-blocking) mode. To receive asynchronous socket events you\
    \ need to register and maintain an ISocketEventListener.\n\nThis recipe demonstrates:\n\
    \n+   1. Creating a server socket.\n+   2. Creating a client socket.\n+   3. Communication\
    \ via sockets.\n\nLet’s walk through the code to accomplish this, step by step:\n\
    \n+   1. Implement ISocketEventListener.\n\n```\n#include <FNet.h>\n\nclass MyClass:\n\
    \  public Osp::Net::Sockets::ISocketEventListener\n{\nOsp::Net::Sockets::Socket*\
    \ pServerSocket;\nOsp::Net::Sockets::Socket* pCommunicatorSocket;\nOsp::Net::Sockets::Socket*\
    \ pClientSocket;\nOsp::Base::ByteBuffer* pByteBuffer;\n\nCreateServerSocket(void);\n\
    CreateClientSocket(Osp::Base::String serverIP);\nSendData();\nReceiveData();\n\
    CreateBlockingSocket();\n\n// ISocketEventListener\n\nvoid OnSocketConnected(Osp::Net::Sockets::Socket&\
    \ socket);\nvoid OnSocketClosed(Osp::Net::Sockets::Socket& socket,\n    Osp::Net::Sockets::NetSocketClosedReason\
    \ reason);\nvoid OnSocketReadyToReceive(Osp::Net::Sockets::Socket& socket);\n\
    void OnSocketReadyToSend(Osp::Net::Sockets::Socket& socket);\nvoid OnSocketAccept(Osp::Net::Sockets::Socket&\
    \ socket);\n}\n```\n\n+   2. Create a server socket. The server binds to a network\
    \ endpoint – an IP address and port number. When a client connects to the server,\
    \ the"
