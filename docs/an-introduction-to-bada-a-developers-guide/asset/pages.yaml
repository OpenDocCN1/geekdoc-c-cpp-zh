- pgno: 149
  md: '# 4.4.1 Privileges in bada


    In bada, sensitive APIs are protected by privileges. Privileges have two dimensions:


    +   1. A privilege group is a category that typically applies to related methods
    of a class or namespace. When you are granted access to the group, you have access
    to all methods requiring that privilege.

    +   2. Every privilege group belongs to one of two privilege levels – NORMAL or
    SYSTEM.


    The goal of the privilege model in bada is to protect app users against malicious
    code, and to protect bada services against abuse. Because bada includes network-based,
    service-centric features in its API set, there is clearly scope for those with
    malicious intent to attempt to subvert or break the services. Because those services
    potentially hold private user data, protecting them is essential.


    Not all bada APIs are protected, and in fact most require no privileges. To access
    privileged APIs, you must have the required privilege level, and your app must
    declare the required privilege group in its manifest file.


    Declaring privileges is easy. Privileges are metadata, not code: you simply add
    the required privilege group while defining your app profile (as explained in
    Chapter 2). Privilege groups map quite closely to namespaces (currently there
    are more than 30 privilege groups, compared to 20 top-level namespaces, and 30-something
    namespaces in total if you include nested namespaces), and so, in general, adding
    a new namespace implies checking to see whether new privileges are required.


    The unusual dimension to privileges is the privilege level, which interprets access
    to privileges in terms of the app developer, and not the app itself. Access to
    privileges is therefore controlled based on developer status, defined as membership
    level in the bada ecosystem – for which currently there are only two values: ordinary
    members and strategic partners. The unfortunate side-effect of this in current
    versions of bada is that access to privileges is severely restricted. Almost half
    of the privilege groups, and in many ways the most interesting ones, are placed
    out of the reach of ordinary third-party developers and are available only to
    partners.


    This is a reflection of the newness of the platform as much as anything, and will
    change. Keep an eye on developer.bada.com for news.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 4.4.2 In Practice


    Privilege level restrictions aside, using privileges in your app is straightforward:


    +   - Where no privilege group is required, which is the case for most of the
    bada class library, no special declarations or other action is required.

    +   - All developers automatically have NORMAL privileges, which means that their
    apps can use any APIs that are marked as requiring NORMAL privileges. Simply declare
    the required privilege group in your manifest file.

    +   - If you only have NORMAL privilege and you want to access APIs requiring
    SYSTEM level privilege, you should request to become a bada partner developer.
    Acceptance is not automatic but it is expected that requests will be granted to
    developers who make a good case for it. Realistically, this option is bound to
    be restricted compared to the number of developers who would like partner access.


    You will notice that we’ve listed the privilege groups, if any, required for each
    namespace in the namespace descriptions in Chapter 6. For more details of privileges
    at the API level, please see the SDK documentation.'
