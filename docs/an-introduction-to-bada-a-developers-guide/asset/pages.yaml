- pgno: 307
  md: "The TOUCH_PRESSED event occurs when the user touches the screen. This event\
    \ is handled in the MainForm by the OnTouchPressed() method.\n\nIn this recipe\
    \ the OnTouchPressed() method is used to set the touch start position Point object\
    \ to the current position touched by the user:\n\n```\nvoid\nMainForm::OnTouchPressed(const\
    \ Osp::Ui::Controls & source,\n    const Osp::Graphics::Point& currentPosition,\n\
    \    const Osp::Ui::TouchEventInfo & touchInfo)\n{\n    // Set the touch start\
    \ position to the current position\n    pStartPoint->SetPosition(currentPosition);\n\
    }\n```\n\nThis touch start position is used in the OnTouchMoved() method for the\
    \ line drawing.\n\nThe TOUCH_MOVED event occurs when the user is touching the\
    \ screen and they have moved their finger across the screen. The first event is\
    \ not sent immediately after the user has moved some pixels to compensate inaccurate\
    \ touches. After this leeway an event is sent for every movement of two pixels\
    \ or more in either direction. This event is handled in the MainForm by the OnTouchMoved()\
    \ method.\n\nIn this recipe the OnTouchMoved() method is used to draw a line from\
    \ the stored touch start position to the current position:\n\n```\nvoid\nMainForm::OnTouchMoved(const\
    \ Osp::Ui::Controls & source,\n    const Osp::Graphics::Point& currentPosition,\n\
    \    const Osp::Ui::TouchEventInfo & touchInfo)\n{\n    // Draw a line from stored\
    \ touch start point to current position\n    pDrawingCanvas->DrawLine(*pStartPoint,\
    \ currentPosition);\n\n    // Draw the Form\n    RequestRedraw();\n\n    // Set\
    \ the current position to the touch start point\n    pStartPoint->SetPosition(currentPosition);\n\
    }\n```\n\nAfter the line is drawn, the touch start position is set to the current\
    \ position. This is necessary to draw a line that correctly represents the user's\
    \ motion across the screen. The start position passed into this function cannot\
    \ be used because it is the start position of when the user touched the screen,\
    \ not the start position of the last movement.\n\nThe TOUCH_DOUBLE_PRESSED event\
    \ occurs when the user double-taps on the screen. This event is handled in the\
    \ MainForm by the OnTouchDoublePressed() method.\n\nIn this recipe the OnTouchDoublePressed()\
    \ method is used to clear the graphics canvas:"
  merge: -1
  img_proc: true
- pgno: 308
  md: "```\nvoid\nMainForm::OnTouchDoublePressed(const Osp::Ui::Controls source,\n\
    const Osp::Graphics::Point& currentPosition,\nconst Osp::Ui::TouchEventInfo &\
    \ touchInfo)\n{\n    // Clear the canvas\n    pDrawingCanvas->Clear();\n\n   \
    \ // Draw the Form\n    RequestRedraw();\n}\n```\n\n# Hints, Pitfalls, and Related\
    \ Topics\n\nAs would be expected, the TOUCH_PRESSED and TOUCH_RELEASED events\
    \ occur in pairs when the user touches the screen. These events also occur in\
    \ conjunction with the TOUCH_MOVED, TOUCH_LONG_PRESSED, and TOUCH_DOUBLE_PRESSED\
    \ events. These event sequences need to be taken into account when designing an\
    \ application’s event processing.\n\nThe sequence of events for a movement touch\
    \ event is:\n\n+   1. TOUCH_PRESSED\n+   2. TOUCH_MOVED (multiple times)\n+  \
    \ 3. TOUCH_RELEASED\n\nThe sequence of events for a long press touch event is:\n\
    \n+   1. TOUCH_PRESSED\n+   2. TOUCH_LONG_PRESSED\n+   3. TOUCH_RELEASED\n\nThe\
    \ sequence of events for a double-tap touch event is:\n\n+   1. TOUCH_PRESSED\n\
    +   2. TOUCH_RELEASED\n+   3. TOUCH_DOUBLE_PRESSED\n+   4. TOUCH_RELEASED\n\n\
    It might be suitable for an application to only process a TOUCH_PRESSED event\
    \ when its corresponding TOUCH_RELEASED event has been received. Or alternatively,\
    \ the application may be designed so that any processing done in the OnTouchPressed()\
    \ method is reversed if the TOUCH_MOVED, TOUCH_LONG_PRESSED, or TOUCH_DOUBLE_PRESSED\
    \ event is received in the sequence afterwards. In both these cases it would be\
    \ necessary to store the status of the previous event(s).\n\nIt is advisable not\
    \ to do too much processing in the OnTouchMoved() method, as the sensitivity (two\
    \ pixels) of movement can result in this method being called many times."
  merge: -1
  img_proc: true
