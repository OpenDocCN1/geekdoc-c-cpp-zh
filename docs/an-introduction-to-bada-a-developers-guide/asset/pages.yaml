- pgno: 462
  md: '# 7.5 Get Notes from Facebook using RESTful APIs


    # Problem Description


    You want to get notes from a Facebook account and use them in your app.


    # The Recipe


    The following configuration is required for this recipe:


    Namespaces used:

    Osp::Social::Services, Osp::Base, Osp::Base::Collection, Osp::System, Osp::Security,
    Osp::Security::Crypto, Osp::Base::Utility, Osp::Net::Http


    Header files to #include:

    FUI.h, FSocial.h, FSecurity.h , FNet.h


    Required libraries:

    FSocial, FSocialServices FSocialServicesSnsAuth, FSecurity, FNet

    FSystem


    Required privilege level:

    System


    Required privilege groups:

    SNS_SERVICE, HTTP


    There will be times when you need to use a service feature that is not supported
    by the SNS Gateway. Getting notes from Facebook is one example.


    In such cases you must use Facebook’s RESTful APIs directly. The steps for doing
    this are described in this recipe. In summary, they are:


    +   1. Follow the recipe ‘Use the bada SNS Gateway to Access a Social Network
    Service such as Facebook’ to get the token key and secret.

    +   2. Use bada HTTP services to request the Facebook ‘Notes’ URL.

    +   3. You’ll need to use bada Crypto services, because Facebook requires the
    URL request parameters to be MD5Hash signed.

    +   4. The HTTP response returns XML data.

    +   5. Follow the recipe ‘Parse XML Content’ to parse the XML and extract the
    content you want.


    The same comments apply here as in related recipes about the keys needed to authenticate
    with SNS, and about required bada privileges. For more about both topics, and
    for Facebook-specific guidance, see the documentation at developer.bada.com.'
  merge: -1
  img_proc: true
