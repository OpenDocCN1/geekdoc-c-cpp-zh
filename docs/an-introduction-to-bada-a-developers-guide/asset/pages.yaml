- pgno: 48
  md: 'These are metadata files and are essential to your project. They declare application
    information used to create your final app package – the app name and version,
    vendor name, and so on – as well as critical information about the APIs that your
    app uses and any security permissions, known as *privileges* in bada, that are
    required to use them. Privileges are part of the bada security model, and we will
    look at them in detail in Chapter 4.


    When you start a real project, you’ll need to create a custom version of the manifest
    using the tools that are available through your account on the bada developer
    portal (see Section 2.7). But to start with we needn’t worry about these details
    at all; the default metadata files generated by the Application Wizard will be
    fine to get started.


    # application.xml


    *Used by the app packaging tools to create an installable package. Declares the
    app name, description, vendor, and version; identifies the app icon files.*


    # manifest.xml


    *Used for privilege checking by the certification process. Declares app properties
    including keys and IDs; required device features, for example CPU type, minimum
    heap size, screen size, sensors used; and required privileges.*


    > **Note:** If you’ve done any widget development, then `application.xml` will
    look familiar; it’s the equivalent of the `config.xml` file that defines a W3C-style¹
    widget package; and if you’ve developed for Android, `manifest.xml` does a similar
    job to the Android manifest file.


    # 2.1.4 Build and Run


    Although we have done nothing more than run the Wizard, we have enough code to
    build and launch a first, skeleton version of our app.


    Let’s verify that the code builds.


    In the IDE, select your project by name in Project Explorer. From the menu bar
    select **Project | Build Project**, and your project should compile and link (see
    Figure 2.4).


    ¹See www.w3.org.'
  merge: -1
  img_proc: true
