    A device can contain many sensors available to application developers, including
    acceleration, magnetic, proximity, and tilt sensors. The SensorManager class is
    used to determine whether a sensor is available and to add or remove the sensor
    event handlers, while the SensorData class is used to retrieve information from
    that sensor. The classes that handle the functionality of these sensors are shown
    in Figure 6.35


