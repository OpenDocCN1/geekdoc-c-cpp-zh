    \ EuroValue);\nif (r == E_KEY_NOT_FOUND)\n{\n    appRegistry.Add(EuroKey, EuroValue);\n\
    }\n\nr = appRegistry.Get(DateKey, currentDateString);\nif (r == E_KEY_NOT_FOUND)\n\
    {\n    appRegistry.Add(DateKey, currentDateString);\n}\n\n// Save any updated\
    \ data to the registry\nr = appRegistry.Save();\n//...\n```\n\nThe first time\
    \ the application is run the AppRegistry will already exist but will be empty.\
    \ It's your responsibility to add registry entries. Each registry entry has a\
    \ key – a String that identifies it – and a value – which can be either of type\
    \ String, int or double. In our example we store the last known dollar and euro\
    \ exchange rate as a double and the time that these values were last updated as\
    \ a String converted from a DateTime value.\n\nTo read from the registry we use\
    \ the AppRegistry::Get() method. If this returns a E_KEY_NOT_FOUND error, we create\
    \ the registry entry with AppRegistry::Add(), setting it to our default value.\
    \ Then we store these values in our internal data structure and use this to restore\
    \ our application state. In our case we display a form with the values read from\
    \ the registry, as shown in Figure R1.1.\n\n![](img/a257d5fd53a79a244a20e587cd2f08f6_238_0.png)\n\
    \nFigure R1.1 We store the last known exchange rates and the time they were last\
    \ updated in the application registry.\n\nWhen the application is about to terminate,\
    \ your application's OnAppTerminating() method will be called with a reference\
    \ to your AppRegistry passed as a parameter. In this method you should update\
    \ your registry entry"
