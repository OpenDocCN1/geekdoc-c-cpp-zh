  md: '# 5.1.4 Commerce Service


    The commerce service allows end-users to browse and purchase items through bada
    applications. Items can be everything that can be purchased out of a bada app.
    Developers can set up their own online store, manage items on the store, and track
    purchase statistics.


    As a developer, you can utilise this service to create an application with functionalities
    such as retrieving selling item information and purchasing them in your application.


    Purchases are made simple, as buyers are required to pre-register their credit
    cards when they sign up with the Samsung Apps web site. So there is no need for
    developers to handle any credit card information from buyers. The Samsung Apps
    store maintains the buyer’s credit card details and associates it with a buyer
    ID. Purchases are then a simple matter of entering the buyer’s ID and a password.


    > Note: To sell your items, you always need to register with the Samsung Apps
    Seller Office at seller.samsungapps.com.


    # 5.1.5 Single Sign On


    bada services are not limited to the ones mentioned above. There are other services
    that are located in other namespaces, for example the single sign on (SSO) application
    control from the Osp::App::AppControl namespace, and the weather sensor service
    from the Osp::UiX namespace.


    The bada Server can manage identities by associating a single login and password
    with all of its services. This SSO method utilises an authentication token provided
    by the server to validate and sign into all the services that a user may have
    on the bada Server.


    # 5.2 How It Works


    For most mobile application developers, the biggest problem is choosing the development
    language. It is even more difficult when development involves communications between
    web components, such as map providers (Google, NavTeq etc.), social service providers
    (Facebook, Twitter, etc.) or content servers (Flickr, Picasa etc.). So how does
    the bada platform handle these types of communications?


    # 5.2.1 Device-to-Server Interaction – bada APIs


    When you develop applications to access server-associated services, you do not
    need to consider which language to use, whether it is JavaScript, Python,'
