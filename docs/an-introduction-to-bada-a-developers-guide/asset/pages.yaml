  md: "To give an example, the interface IRemoteLandmarkStoreListener which is part\
    \ of the Osp::Locations namespace defines a method OnLandmarksReceivedN(). This\
    \ method is called when an application queries a remote server about its stored\
    \ landmarks. If there are landmarks available that match the search criteria,\
    \ they are stored in one of the parameters of the method. This parameter is local\
    \ to the calling application, hence, the object ownership changes. The following\
    \ code should exemplify this.\n\n```\nvoid\nOnLandmarksReceivedN(RequestId reqId,\
    \ IList* pResults, int pageNo, int countPerPage, int totalPageCount, int totalCount,\
    \ result r,\nconst String& errorCode, const String& errorMsg)\n{\n    if (!IsFailed(r)\
    \ && pResults)\n    {\n        // Do something with the results stored in pResults...\n\
    \        pResults->RemoveAll(true);\n        // You have to explicitly delete\
    \ the object !!!\n        delete pResults;\n    }\n}\n```\n\n# Exception Handling\n\
    \nException handling arrived in C++ not exactly as an afterthought, but a long\
    \ time after the first release.⁴ Efficiency was an important design goal,⁵ in\
    \ particular avoiding adding time or space cost to code that doesn’t use exceptions.\
    \ That goal was certainly achieved, but quantifying the cost for code that does\
    \ use exceptions is more controversial.\n\nAt least in the unoptimised case, ‘turning\
    \ on’ standard C++ exception handling can add as much as a 10% code size increase\
    \ to a system,⁶ with a measurable runtime performance penalty when exceptions\
    \ are thrown and handled.\n\nFor those reasons, as well as for reasons of simplicity,\
    \ bada does not support native C++ exceptions, but instead implements a simple\
    \ error handling mechanism.\n\nIn bada:\n\n+   - All exceptions are caught and\
    \ returned as a simple type-defined result value.\n\n⁴See B. Stroustrup, The Design\
    \ and Evolution of C++ (Addison-Wesley, 1994). C++ 1.0 was released in 1986, exceptions\
    \ were included in 1992.\n\n⁵Stroustrup, Design and Evolution, p. 385.\n\n⁶See\
    \ B. Morris, Symbian OS Architecture Source Book (Wiley, 2007). The example is\
    \ Symbian."
