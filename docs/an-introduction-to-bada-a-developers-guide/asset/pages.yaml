- pgno: 365
  md: '# Table R3.2 Four options for the StartPreview() method


    | Case | Camera state | Preview | Call-back | notes |

    |---|---|---|---|---|

    | StartPreview (OverlayPanel, callback) | Camera is in PowerOn | Previews are
    displayed automatically | Call-back is called to process data | N/A |

    | StartPreview (no Overlay Panel, no callback) |  | No preview is displayed |
    No callback is called to process data | You can use this case to take pictures
    in a power-saving mode. |

    | StartPreview (OverlayPanel, no callback) |  | Previews are displayed automatically
    | No callback is called to process data | Only the visuals are working. |

    | StartPreview (no Overlay Panel, callback) |  | No preview is displayed | Call-back
    is called to process data | Even though no picture is shown, you can manually
    display one through the OnCameraPreviewed() event handler. Get the buffer information
    through Ui::Controls:: Overlay Panel::GetBackground BufferInfo(). The application
    must set the callback parameter to true so that the preview data is sent to the
    event handler. |


