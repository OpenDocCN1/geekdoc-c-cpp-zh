- pgno: 137
  md: 'As the macro name implies in the third case above, this is really just a simple,
    local, and cheap, way of providing something like the familiar behaviour of try:
    catch: exception handling.


    As a final note, all exceptions are logged in the simulator to the Output pane,
    making it easy to trace errors without any explicit coding being required.


    # Interfaces


    C++ allows multiple inheritance, but only single inheritance is used in bada.
    There is nothing very new or surprising in that.


    The arguments about multiple inheritance, and whether it is a good thing or a
    bad thing, go back to the dawn of OOP. Allowing multiple inheritance fits with
    the non-prescriptive philosophy of C++, as well as with its goal of being a true
    modelling and simulation language, because in the real world, objects can belong
    to multiple categories. Restricting inheritance therefore implies a loss of flexibility
    and accuracy.


    The counter arguments – in the C++ context at least – mostly centre on precedence
    and ambiguity (What if multiple base classes have identically named methods? Which
    one will get called in the derived class?); efficiency (for example the ‘evil
    diamond’ pattern, which can cause code to be duplicated); and complexity (to use
    multiple inheritance well, programmers must understand it, which means yet another
    language feature to master).


    The compromise solution, which bada adopts, like some other mobile platforms,
    and like the Java language, is to promote the use of interfaces to solve the kinds
    of design problems that tempt programmers towards multiple inheritance, and allow
    multiple interface inheritance but only single inheritance from any concrete base
    class.


    Interface classes are very natural to use, and allow simple and expressive design.
    They also have the advantage of being familiar to developers through the Java
    language.


    In bada, for example, listeners of all kinds, interactions with base applications,
    collections, and collection comparators and enumerators are just some of the behaviours
    that can be implemented using interface classes.


    Java raises the concept of interfaces into a language feature with the interface
    keyword. In C++ there is no built-in language convention, and therefore bada introduces
    its own convention of naming interface classes with a leading ‘I’ (for example
    IList, IEnumerator, IEventListener, and so on). In bada, in common with many other
    platforms:


    +   An interface class is always abstract, that is, it contains only pure virtual
    methods, which means that it cannot be instantiated directly (you cannot new an
    interface class), it can only be inherited from.'
