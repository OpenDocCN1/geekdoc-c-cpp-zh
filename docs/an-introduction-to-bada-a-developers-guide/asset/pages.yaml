    # 5.3.4 Commerce Service – Make Your Own Business


    The thing that makes the bada platform most unique and interesting is the commerce
    service. Using the commerce service, developers can not only sell their applications
    on the Samsung Apps store, but also sell in-app items.


    The essential part of the commerce service is Samsung Apps, where you set up your
    own items for sale. Bear in mind that all items you sell have to be set from the
    seller site of Samsung Apps. It is slightly different from a normal application,
    because your items are not listed in the Samsung Apps client on device (COD).
    Figure 5.6 shows you how you can set the items using your Samsung Apps account.
    Let’s start with how to set up the items on the seller site.


    Every item listed on store has its own properties, such as name, description,
    price, currency, image URL, download URL, and two preserved fields for future
    use.


    # Step 1: Set up Items on Samsung Apps Seller Office


    Here is how you can define and register items: First, go to Samsung Apps Seller
    Office (seller.samsungapps.com) and, in the menu, select Applications | Item Management
    to submit your items for possible inclusion. Create an item group and add your
    items to it. Note that you must remember the item group ID to use it as a parameter
    for the APIs later on.


    Before registering the application in Samsung Apps (Applications | Add New Application),
    you can test purchasing items in your application without actual payment (test
    mode). When you add your application, you can register your items to the application
    by selecting the item group ID. Not all items are accepted. Please read the terms
    and conditions at Samsung Apps for more information.'
