    \ are: Write, Read, Close, Accept, Connect, and Certificate failed for SecureSocket.\n\
    \n+   f. Bind this socket to a net end point, specifying the port where the server\
    \ is going to listen.\n\n+   g. Call the Listen() function, in order to listen\
