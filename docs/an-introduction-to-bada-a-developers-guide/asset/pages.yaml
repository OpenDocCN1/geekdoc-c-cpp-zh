  md: '# Step 2: Select Privileged API Groups


    Once you decide on an application name and give the description of your application,
    you need to select the privilege group that includes APIs used by your application.
    If you want to use the content management features, you need to click at least
    one privileged API group from CONTENT_TRANSFER, LOCAL_CONTENT, or REMOTE_CONTENT,
    as shown in Figure 5.8. If you want to use the content service only in your device,
    select LOCAL_CONTENT. If you want to use the remote content service, which is
    the service-centric feature, select CONTENT_TRANSFER or REMOTE_CONTENT.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_177_0.png)


    Figure 5.8 Select privileged API groups.


    # Step 3: Set up Components


    Once you have selected the privileged API groups, you can set the components for
    your application. This step covers social components, content components and workspace,
    as shown in Figure 5.9. The workspace (Amazon S3) is the actual storage space
    for your physical content files, such as image, video, and audio. When you click
    the Content Type Management option from Content section, you can create new content
    types. There are four predefined content types in bada: image, video, audio, and
    others.'
