- pgno: 112
  md: 'Mobile phones have come a very long way from the early, monochrome (or green-screen,
    text-based), devices that at least some of us remember from the early days of
    our careers in mobile development.


    In fact, Samsung is a technology leader in display technology and has consistently
    driven phone specifications toward the high end, breaking new ground with HD (High
    Definition) and AMOLED display technology. Phones such as Wave have physically
    big screens with high pixel density and bright, high-contrast, outdoor-readable
    screens with vibrant colour.


    With the widespread availability of hardware graphics acceleration and shader
    support, UI effects such as transparency, animation, and full-3D are now possible
    on phone displays, where just a few years ago they were unthinkable.


    Interestingly, AMOLED technology has brought device displays into the power-management
    equation in a surprising way. Unlike standard LCD technologies, OLED (Organic
    Light-Emitting Diode) displays use active pixels for which power requirements
    vary depending on the hue being displayed by the pixel. Quite literally, darker
    colours are cheaper (in power usage) than lighter colours, meaning that UI designers
    can now add power-usage to the list of factors determining their design choices
    for app palettes and colour schemes.


    In bada, colours are defined using the ARGB colour model, which uses Alpha (i.e.
    transparency), Red, Green, and Blue values.


    > Note: Not all graphics objects in bada have an alpha channel. Bitmap and Canvas
    both do, and both therefore support alpha blending.


    The Color class provides useful built-in functions including:


    +   - Setting and getting colour components for or from a Color object, with values
    for all ARGB or specific colour values (and alpha), as well as a 32-bit colour
    value.

    +   - 10 predefined colours.


    All colours are 32-bit entities supporting 24-bit ‘true-colour’ or ‘millions of
