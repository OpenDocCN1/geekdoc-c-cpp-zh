  md: "```\npClientSocket = new Socket;\npClientSocket->Construct(NET_SOCKET_AF_IPV4,\
    \ NET_SOCKET_TYPE_STREAM, NET_SOCKET_PROTOCOL_TCP);\n\n//Register with ISocketListener\n\
    pClientSocket->AddSocketListener(*this);\n\n//Sets the socket in asynchronous\
    \ mode, also listener will listen\n//to the specified events as passed in the\
    \ argument\npClientSocket->AsyncSelectByListener(\n    NET_SOCKET_EVENT_CONNECT\
    \ | NET_SOCKET_EVENT_WRITE\n    | NET_SOCKET_EVENT_READ | NET_SOCKET_EVENT_CLOSE);\n\
    \n//NetEndPoint holds the IP address and Port number, here IP Address\n//and port\
    \ is that of server to which the client wishes to connect\nIp4Address peerAddr(serverIP);\
    \      // For Testing\nunsigned short peerPort = 9000;     // port\nNetEndPoint\
    \ peerEndPoint(peerAddr, peerPort);\n\n//Establishes a connection to a remote\
    \ host for a connection-oriented\n//socket\nr = pClientSocket->Connect(peerEndPoint);\n\
    }\n```\n\n4. A socket receives notification of receiving a new connection from\
    \ a peer in OnSocketAccept(). Call the AcceptN function, which will return an\
    \ instance of a socket that can be used for sending and receiving data. You need\
    \ to register this socket with the listener and set it to async mode as shown\
    \ above.\n\n```\nvoid\nMyClass::OnSocketAccept(Osp::Net::Sockets::Socket& socket)\n\
    {\n    AppLog(\"OnSocketAccept\");\n    Socket* pSocket = const_cast<Socket*>(&socket);\n\
    \n    if (null != pCommunicatorSocket)\n    {\n        delete pCommunicatorSocket;\n\
    \        pCommunicatorSocket = null;\n    }\n\n    pCommunicatorSocket = pSocket->AcceptN();\n\
    \n    pCommunicatorSocket->AddSocketListener(*this);\n\n    pCommunicatorSocket->AsyncSelectByListener(\n\
    \        NET_SOCKET_EVENT_CONNECT | NET_SOCKET_EVENT_WRITE\n        | NET_SOCKET_EVENT_READ\
    \ | NET_SOCKET_EVENT_CLOSE);\n}\n```"
