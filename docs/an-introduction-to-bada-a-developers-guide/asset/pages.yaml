    \ as a Service\n\nA key distinction between mobile applications and conventional\
    \ applications is the location feature. Most modern smartphones are equipped with\
    \ GPS transceivers. Devices are aware of location changes all the time. Mobile\
    \ developers can utilise real-time location data to make function-rich applications,\
    \ just as FourSquare and Loopt do.\n\nThe bada platform provides several types\
    \ of location-based service as discussed at the beginning of this chapter. So\
