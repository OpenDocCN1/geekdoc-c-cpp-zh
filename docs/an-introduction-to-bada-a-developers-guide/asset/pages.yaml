    \ one face, and to set the scale to the value 1. This allows detection of the\
    \ smallest faces, at the expense of more processing power.\n\nAs the video stream\
    \ might contain more than one face, the recipe should check as many faces as possible\
    \ against the target face. This is done using the GetRange() method to get information\
    \ about the acceptable range of the MAXNUMBER_VIDEO property, and then set this\
    \ property to its maximum value. The scale is set to the value 2 (the middle value),\
    \ which is a trade-off between processing time and minimum face size.\n\n```\n\
    result\nMainForm::OnInitializing(void)\n{\n    /* Setup the camera.... */\n\n\
    \    // Create a FaceRecognizer object and set its properties.\n    pFaceRecognizer\
