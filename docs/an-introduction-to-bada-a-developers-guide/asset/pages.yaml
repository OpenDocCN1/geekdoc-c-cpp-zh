- pgno: 237
  md: "The application registry is where you store the application state. This may\
    \ include application settings such as user preference information, the current\
    \ player status in a game, or configuration information that you don’t want the\
    \ user to have to re-enter each time the application is run. So, for example,\
    \ if the user is several levels into a complicated game, they don’t want to start\
    \ all over again if they quit the application and open it again later. By storing\
    \ the game state in the registry, an application developer can let them resume\
    \ their game playing at the point they chose to stop.\n\nIn this recipe we’ll\
    \ demonstrate how to write values to and read them from the registry. Our example\
    \ is a very simple currency application that provides up-to-date currency exchange\
    \ rates for the UK pound against the US dollar and euro. We use the application\
    \ registry to store the last known euro and dollar exchange values and the time\
    \ that these values were last updated.\n\nThe recipe consists of the following\
    \ steps:\n\n+   1. Set up the initial values for our registry entries.\n+   2.\
    \ Read each entry from the registry. If the entry does not exist, create it.\n\
    +   3. Restore our application state from the registry entries.\n+   4. Write\
    \ the updated entry back to the registry when the application is about to terminate.\n\
    \nThe App::AppRegistry class contains the methods to read from and write to the\
    \ registry. In our class AppRegistrySample we read from the registry in the application’s\
    \ OnAppInitializing method, which is sent a reference to the application’s registry:\n\
    \n```\nbool\nAppRegistrySample::OnAppInitializing(AppRegistry& appRegistry)\n\
    {\n    // The keys for each registry entry\n    String DollarKey (\"LastDollarValue\"\
    );\n    String EuroKey (\"LastEuroValue\");\n    String DateKey (\"DateUpdated\"\
    );\n\n    // Set up initial values for our registry entries\n    double DollarValue\
    \ (1.53);\n    double EuroValue(1.17);\n\n    // Set the default date value to\
    \ be the current time\n    DateTime dateUpdated;\n    SystemTime::GetCurrentTime(dateUpdated);\n\
    \    String currentDateString = dateUpdated.ToString();\n\n    result r;\n\n \
    \   // Read the last known value of each setting from the registry\n    // If\
    \ the registry entry does not exist, create it\n    r = appRegistry.Get(DollarKey,\
    \ DollarValue);\n    if (r == E_KEY_NOT_FOUND)\n    {\n```"
