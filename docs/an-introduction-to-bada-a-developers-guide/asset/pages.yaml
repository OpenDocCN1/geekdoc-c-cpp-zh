  md: '# Recipe 3.3: Get Readings from the Tilt Sensor


    # Problem Description


    You want to make use of the azimuth, pitch, and roll values from tilt sensor and
    display them on the screen.


    # The Recipe


    The following configuration is required for this recipe:


    Namespaces used:

    Osp::UI, Osp::UI::Controls, Osp::UIx


    Header files to #include:

    FUI.h, FUIx.h


    Required libraries:

    FUI, FUIControls, FUIx


    Required privilege level:

    None.


    Required privilege groups:

    None


    The tilt sensor measures the angle of your mobile device at each position. The
    sensor combines acceleration and magnetic sensor to determine values of azimuth,
    pitch, and roll (see Figure R3.3). The range of values that the tilt sensor supports
    are shown in Table R3.1.


    # Table R3.1 Range of values supported by the tilt sensor


    | Measurement | Type | Range | Unit |

    |---|---|---|---|

    | Timestamp | long | – | Milliseconds |

    | Azimuth | float | Max. value = 360

    Min. value = 0 | Degrees (°) |

    | Pitch | float | Max. value = +180

    Min. value = -180 | Degrees (°) |

    | Roll | float | Max. value = +180

    Min. value = -180 | Degrees (°) |


    These are angular positions based on a fixed frame reference.'
  merge: -1
  img_proc: true
