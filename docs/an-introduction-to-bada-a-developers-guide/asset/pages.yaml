    Required privilege groups:

    NET, WIFI


    Independent mode or ad hoc mode allows a Wi-Fi network to function without a central
    wireless router or access point. All wireless peers on the ad hoc network must
    use the same SSID (Service Set Identifier) and channel number. Currently, the
    channel is not configurable by an application developer; the Wi-Fi device scans
    and selects a proper channel by itself.


    This recipe shows you how to use the classes and methods in the Net::Wifi namespace
    to do the following:


    +   1. Establish an ad hoc Wi-Fi network.

    +   2. Get peer information when an ad hoc network is established.

    +   3. Exchange messages with peers.


    In Figure R5.5, the user of device 1 sets its name as Jerry and the user of device
    2 sets its name to Tom. Then when they press Search, a Wi-Fi network is established
    and they can see each other as peers.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_425_0.png)


    Figure R5.5 Establishing an ad hoc Wi-Fi network.'
