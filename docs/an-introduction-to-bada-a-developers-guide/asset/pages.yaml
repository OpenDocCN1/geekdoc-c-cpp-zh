    the bada SNS Gateway to Access a Social Network Service such as Facebook’. The
    steps required to use Facebook via the Gateway are similar to those for Twitter,
    described in the recipe ‘Send a Tweet from Twitter’. When authenticating with
    the Gateway to use Facebook you should specify facebook as the service provider:


    ```

    String serviceProvider = "facebook";

    r = pSNSAuthenticator->Authenticate(serviceProvider, appID, appSecret);

    ```


    The same comments apply in this recipe as in related recipes about the keys needed
    to authenticate with social network services, and about required bada privileges.
    For more about both topics, and for Facebook-specific guidance, see the documentation
    at developer.bada.com.


