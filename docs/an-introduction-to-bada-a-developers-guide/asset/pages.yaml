  md: 'In the NORMAL and PIPELINING session mode, all the transactions within this
    session will be submitted through the same connection. While only one transaction
    is processed at a time in the normal mode, multiple transactions can be pipelined
    in the pipelining mode. In the normal mode, you need to wait for the end of the
    previous transaction to submit the next transaction. The maximum number of HttpSessions
    that can be constructed per application is six.


    # Recipe 5.4: Use Bluetooth Profiles


    # Problem Description


    Use different Bluetooth profiles, depending on the type of connection or you require.


    # The Recipe


    The following configuration is required for this recipe:


    **Namespaces used:**

    Osp::UI, Osp::Base, Osp::Net


    **Header files to #include:**

    FUI.h, FBase.h, FNet.h


    **Required libraries:**

    FUI, FBase, FNet


    **Required privilege level:**

    Normal


    **Required privilege groups:**

    BLUETOOTH


    Bluetooth provides quick and easy connections to other devices, and supports many
    different use-cases, including one-off file transfers and wirelessly connecting
    peripheral devices such as headsets and keyboards. Standard use-cases are specified
    as Bluetooth profiles.


    The Bluetooth profiles supported by bada include:


    +   - General Access Profile (GAP)

    +   - Object Push Profile (OPP)


    GAP is the most basic Bluetooth profile and it provides the basis for all other
    profiles. All other profiles, including OPP, are built upon GAP. The purpose of
    GAP is to make sure that all devices can successfully establish a baseband link.'
  merge: -1
