  md: "to developers makes intensive use of this result type return value to allow\
    \ for exception checking. Just to mention one example here: the Camera class of\
    \ the Osp::Media namespace provides the StartPreview() method that is defined\
    \ as follows:\n\n```\nresult\nOsp::Media::Camera::StartPreview(\n    const Osp::Graphics::BufferInfo*\
    \ pBufferInfo,\n    bool previewedData = false\n);\n```\n\nThis method starts\
    \ displaying the preview image from the camera device. If pBufferInfo is null,\
    \ no preview image will be displayed. If previewedData is true, previewed image\
    \ data comes to the ICameraEventListener::OnCameraPreviewed() method periodically\
    \ based on the frame rate, otherwise the callback will not be invoked. The default\
    \ value of previewedData is false. Interesting for this recipe is the return value\
    \ which is of type result to model potentially occurring exceptions. The exceptions\
    \ that can happen in this method are summarised in Table R1.1.\n\n# Table R1.1\
    \ The error codes that can be returned by the call to Camera::StartPreview\n\n\
    |  |  |\n|---|---|---|\n| E_SUCCESS | The method was successful |\n| E_INVALID_STATE\
    \ | This method is invalid for the current state of the camera |\n| E_UNSUPPORTED_FORMAT\
    \ | The specified format is not supported |\n| E_DEVICE_BUSY | The device cannot\
    \ be approached because of other operations |\n| E_DEVICE_UNAVAILABLE | The device\
    \ is unavailable |\n| E_DEVICE_FAILED | The device operation failed |\n| E_OUT_OF_MEMORY\
    \ | There is insufficient memory |\n| E_PRIVILEGE_DENIED | The application does\
    \ not have the privilege to call this method |\n\nAn example of how to make use\
    \ of this exception handling in bada is highlighted in the following code snippet:\n\
    \n```\nresult r = E_SUCCESS;\n// Let's assume we have a constructed pCamera object\
    \ of type Camera*\nr = pCamera->StartPreview(null, false);\n\nif(IsFailed(r))\n\
    {\n    // process the error condition\n}\nelse\n{\n    // continue normally\n\
    }\n```"
