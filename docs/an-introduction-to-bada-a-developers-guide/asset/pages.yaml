    \ instance (pAudioRecorder), the listener's OnAudioRecorderStarted() method will\
    \ be called. The recording is considered to have started only when this method\
    \ is called, and not on the return of the call made to the asynchronous Record()\
    \ method.\n\nIn a similar fashion, asynchronous methods in the listener will be\
    \ called to confirm success when basic functions such as Stop(), Pause(), Close()\
    \ and Cancel() are called on pAudioRecorder.\n\nDuring the recording process,\
    \ an error could occur. This too will be reported to the registered listener through\
    \ the calling of OnAudioRecorderErrorOccurred(). An error will be reported through\
    \ this call and the application will be expected to take the appropriate action.\
    \ Errors associated with this call are:\n\n+   - RECORDER_ERROR_OUT_OF_STORAGE:\
    \ insufficient storage.\n+   - RECORDER_ERROR_STORAGE_FAILED: storage access failed.\n\
    +   - RECORDER_ERROR_DEVICE_FAILED: the recording device failed.\n\nWhile recording,\
    \ the audio data being captured will be written to a file. This file's path is\
    \ passed in the call to CreateAudioFile(). This can be the path to a new file\
    \ or an existing file. In fact, the second argument passed in this call informs\
    \ that if the file already exists, that it can be overwritten. The application\
    \ can exercise control over how the data is recorded in terms of data encoding\
    \ type and also how large the resulting file will be.\n\nThe following code extract\
