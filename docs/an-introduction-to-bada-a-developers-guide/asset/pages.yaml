  md: '# Downloading and Installing the bada SDK


    To get the latest version of the bada SDK, visit the developer site at developer.bada.com.
    Before you download, you first need to be a registered bada developer. Don''t
    worry, it''s free and once you''re signed up, you also have access to all the
    support resources on the site, including developer forums, blog postings, and
    other useful information. The details in this appendix apply to version 1.0.0b3
    of the SDK, so you may notice some differences in later versions of the SDK you
    may use.


    > Note: At the time of writing, the system requirements to install the bada SDK
    are: Microsoft Windows, XP, Vista, or Windows 7 and 1.8 GB of free hard disk space.


    To download the SDK, go to the Development Tools section of the site and choose
    SDK/IDE, as shown in Figure A.1.


    You''ll notice that there are two versions of the SDK available for download:


    +   - Full package: IDE and Simulator/Target SDK (Language Pack 1, 2, 3 and 4)

    +   - SDK Installer: IDE and Simulator/Target SDK


    You can choose a full version that contains all the language packs, or a smaller
    download that allows you to choose a subset. Both downloads include the IDE and
    all the files you need to develop for the Simulator and a target device.'
  merge: -1
  img_proc: true
