- pgno: 204
  md: '# Prerequisites:


    An account with a geographic services provider.


    # Summary


    Selected important classes:


    +   - `IDirectoryServiceProvider`

    +   - `IMapServiceProvider`

    +   - `IRouteServiceProvider`

    +   - `ProviderManager`


    This namespace provides support for geographic information services: maps, geocoding,
    directory, and route services. The starting point for implementing these services
    is the `ProviderManager` class, which retrieves information about the service
    providers available to the device and allows the application to choose the one
    that provides the appropriate services.


    Support for map services is provided by a set of interface classes called to get
    map information and render the map. The `IMap` interface implements dynamic maps
    from the service provider, supporting features such as panning and zooming, the
    UI for which is handled by classes in the `Locations::Controls` namespace.


    # Route and Directory Services


    The Route Service is implemented by the `IRouteServiceProvider` and `IRouteServiceListener`,
    and allows the application to request a route, given a set of waypoints – which,
    at a minimum, must consist of a start and destination – and parameters such as
    mode of transport and whether the route is the fastest or shortest. The application
    is returned a list of `Routes`, which contains a set of coordinates representing
    the route and information such as length, estimated travelling time, and a set
    of `RouteSegments`. The application could then display this information on a map
    to provide services such as turn-by-turn directions. The classes that provide
    the Route Service are shown in Figure 6.16.


    The Directory Service allows application developers to implement a user-friendly
    search for products and services within a specified geographic area – coffee shops
    within a certain city, for example. Developers put together their search request
    with the methods of `IDirectoryServiceProvider` and process the response asynchronously
    using `IDirectoryServiceListener`. The search results are returned as a list of
    `Landmarks`. Underpinning these services is the geocoding service, which converts
    an address into geographic coordinates and vice versa.'
