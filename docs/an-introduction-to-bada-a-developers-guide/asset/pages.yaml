- pgno: 61
  md: '# Table 2.2 Form properties.


    | Property | Purpose |

    |---|---|

    | Id | Form identifier, typically prefixed `IDF_`; this is also used in C++ code
    to refer to the Form layout file |

    | Type | WINDOW_FORM is the top level Form within any Frame, where the application
    Frame represents the screen window in which the app displays |

    | Title | Title that will appear in the Form Title bar, if enabled |

    | Orientation | How the Form displays when the phone is rotated through a possible
    four directions |

    | Layout | Mode | Portrait or Landscape |


    > Note: Although you can set the background colour for both Frame and Form, you
    can’t set the background to be an image, unlike other types of control.


    # 2.3.3 The Buddy List


    The most important part of the UI is the main buddy list itself, which will display
    a number of items of information for each buddy. UI Builder gives us a choice
    of several list types, and bada allows us to define custom lists of our own, but
    to start with we’ll keep things simple and use a basic, simple list, displaying
    the following fields for each item:


    +   - Picture

    +   - Name

    +   - Last known location fix/time fix

    +   - Whether location sharing is enabled for this buddy


    To add a list to the Form in UI Builder, select the List icon from the controls
    Palette, and drag onto (or click inside) the main Form view, as shown in Figure
    2.14.


    Resize the List to occupy the whole area of the Form. Now double-click anywhere
    inside the List to open the Properties editor pane. Editing List properties is
    exactly like editing Form properties.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_62_0.png)


    Figure 2.14 Adding a list to our Form.


    First let’s rename the List to IDC_MAIN_LIST.

    Next, let’s look at the properties that are of interest. First, we can define
    basic properties like the row heights and widths for each item and the order in
    which the different fields will display:


    | Row 1 Height | Default 80 |

    | Row 2 Height | Default 50, only shown when a two-line format is selected |

    | Column 1 Width | Default 50 |

    | Text Of Empty List | Text to display in case the list is empty |

    | List Item Format | One of 11 possible format styles specifying the structure
    of the list contents, for example:

    LIST_ITEM_SINGLE_IMAGE,

    LIST_ITEM_DOUBLE_IMAGE_TEXT_FULLTEXT |


    A simple list can display one or two columns, and the first column can display
    one or two rows. We’ll set the format to LIST_ITEM_DOUBLE_IMAGE_TEXT_FULLTEXT,
    which will display a first line of image and text, and a second line of text.'
