    Figure 2.10 Launching the Resource Explorer.


    The Resource Explorer pane will open in the IDE. (If it is empty when it launches,
    make sure you have your project selected in the Project Explorer pane.) Right-click
    anywhere in the Resource Explorer and select Open Insert Wizard, as shown in Figure
    2.11. It''s a new Form we want to create, so select Create Form File, and Finish.
    A new Form appears in the Resource Explorer pane. Double click to launch the WYSIWYG
    UI Builder and you should see the screen shown in Figure 2.12. Note that the default
    Form – for demonstration purposes – already contains a Button control, which you
    can use or simply delete. When the UI Builder pane is launched, double-click on
    the main Form pane to open the Form Properties pane as shown in Figure 2.13.


    # 2.3.2 Form Properties


    Before doing anything else, let''s change the Form name to something meaningful.
    Properties are simple name, value pairs. To edit a property, double click the
    property name in the property list and change the associated value. For BuddyFix,
    we retain the ''IDF'' prefix and the all-caps resource naming convention to provide
    clarity in our code, and name the Form IDF_MAIN_LIST_FORM.'
