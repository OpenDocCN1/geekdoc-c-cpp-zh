    \ that the FormMgr displays the MainForm, with a call to the SetStarterForm()\
    \ method.\n\n```\n// Create a form\nFormMgr *pFormMgr = new FormMgr();\npFormMgr->Initialize();\n\
    \n// Add the form to the frame\nFrame *pFrame = GetAppFrame()->GetFrame();\npFrame->AddControl(*pFormMgr);\n\
    \n// Request the Form Manager to display the MainForm\npFormMgr->SetStarterForm(FormMgr::REQUEST_MAINFORM,\
    \ null);\n```\n\nThe SetStarterForm() method checks whether the currently active\
    \ form is the FormMgr and then requests that the MainForm is displayed with a\
    \ call to the SwitchToForm() method.\n\n```\nbool\nFormMgr::SetStarterForm(RequestId\
    \ requestId,\n    Osp::Base::Collection::IList* pArgs)\n{\n    Form *pCurrentForm\
    \ = Application::GetInstance()->\n        GetAppFrame()->GetFrame()->GetCurrentForm();\n\
    \n    if (pCurrentForm == this)\n        SwitchToForm(requestId, pArgs);\n   \
    \ else\n        return false;\n\n    return true;\n}\n```\n\n# Step 5: Implement\
