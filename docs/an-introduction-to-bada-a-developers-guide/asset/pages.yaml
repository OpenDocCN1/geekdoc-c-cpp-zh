  md: 'Note: Currently the SNS Gateway is mainly used for retrieving buddy information
    from the third-party social network provider. For other functions, such as follow
    and un-follow from Twitter, you have to use the HTTP connection and XML parser
    provided by bada.


    Figure 5.1 illustrates the big picture of bada Server infrastructure. All application
    developers need to know the bada C++ APIs.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_157_0.png)


    **Figure 5.1** bada Server.


    Now let’s look at how open APIs work on the bada Server. Normally client applications
    use Representational State Transfer (REST) APIs to communicate with web servers,
    which means that calls are made over HTTP (GET, POST, etc.) to the server.² As
    we mentioned in the previous section, different web services implement different
    sets of RESTful APIs. It is very difficult for a client application to interoperate
    with different services. By using the bada Server as a mediator, you are not required
    to use any specific RESTful APIs; instead you use native C++ APIs. The bada Server
    takes care of making calls to specific third-party servers.


    Through the third-party map server deCarta, bada can provide your applications
    rich mapping services that include route calculation, geocoding, and directory
    services.


    > ²By design the HTTP protocol is stateless, which means that the server does
    not keep any information about the client. The disadvantage of this design is
    that it may increase the transmission of repetitive data and thereby decrease
    network performance. Adding caches on the server side could make HTTP stateful.'
