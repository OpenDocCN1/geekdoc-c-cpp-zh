  md: '# Prerequisites:


    To use functionality such as In App Purchases you need to have a seller account
    on Samsung Apps.


    # Summary


    Selected important classes:


    +   - `ItemInfo`

    +   - `ItemService`

    +   - `PurchaseService`


    The `Commerce::Store` namespace provides classes and methods to allow applications
    to retrieve information and make In App Purchases from Samsung Apps. These items
    might be In App Purchases such as new application services or new levels within
    a game, for example.


    The actual purchasing process is handled by the Samsung Apps servers, so all the
    application needs to do is to allow the user to choose an item to purchase and
    pass this request onto the server.


    Figure 6.7 shows how the `Commerce::Store` namespace is organised. There are two
    main classes: `ItemService` for retrieving item information and `PurchaseService`
    for actually buying an item. Information for each available item, such as description,
    price and currency is represented by the `ItemInfo` class while applications handle
    `ItemService` events by implementing the `IItemServiceListener`.


    Similarly for purchases, the `PurchaseInfo` class includes details of the purchase,
    while responses, such as item successfully purchased or a purchasing error, should
    be handled by the application’s implementation of the `IPurchaseServiceListener`.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_191_0.png)


    Figure 6.7 Classes implementing the ItemService and PurchaseService in Osp::Commerce::Store.


