    Osp::UiX::SensorData& sensorData, result r);\n```\n\nThe implementation of our\
    \ class also provides two methods that help to register and unregister a sensor\
    \ type.\n\n```\nbool\nRegisterSensor()\n{\n    result r = E_SUCCESS;\n\n    //\
    \ Construct the sensor manager instance\n    r = sensorMgr.Construct();\n    if(IsFailed(r))\n\
    ```"
