    Osp::App::Application::GetAppFrame method to get the frame control and then Osp::Ui::Control::GetCanvasN
    to return the Canvas to draw into.


    Common graphic shapes drawn using the methods of the Canvas class include arcs,
    lines, rectangles, polygons and text as well as bitmaps. Take a look at Figure
    6.10 to see the relationship between Canvas and the other Graphics classes.


    The Bitmap class contains methods for creating and scaling bitmaps, but bitmaps
    are actually rendered using the Canvas::DrawBitmap method. Bitmaps are also used
    to store the images decoded by Osp::Media::Image before the bitmap containing
    the image is drawn to the canvas.


    The namespace also contains some core classes used for drawing shapes: Dimension,
    Point and Rectangle.


    More advanced 2D and 3D drawing is provided by the OpenGL sub-namespace.'
