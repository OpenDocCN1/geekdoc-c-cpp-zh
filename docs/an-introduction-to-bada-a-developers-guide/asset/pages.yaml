    \nFacial recognition software is becoming more and more popular, as users demand\
    \ more advanced applications to speed up tasks such as tagging friends in photos.\
    \ Handily, the bada platform includes an in-built class to perform face recognition\
    \ and comparison. This recipe details the steps needed to set up and make use\
    \ of the FaceRecognizer class.\n\nThe target application analyses a face from\
    \ a still image, and then analyses each frame from a video (in this case supplied\
    \ by the device’s camera preview) to check if any of the faces in the video match\
    \ the one in the image. The recipe assumes that the user has set up a Camera object,\
    \ as detailed in the recipe ‘Open the Camera and Get and Display Live Frames’,\
    \ and has created a bitmap of the still image as detailed in the recipe ‘Use Bitmaps\
    \ and Images’. An OverlayPanel is not required for this recipe but could be useful\
    \ for testing the target application – see the recipe ‘Use an Overlay Panel’.\n\
    \nThe key class in our recipe is the MainForm class, which will control all the\
    \ features in the recipe. The class must implement the OnCameraPreviewed() method\
    \ from Osp::Media::ICameraEventListener in order to perform face recognition on\
    \ each frame. This method, together with the OnInitializing() method, will be\
    \ where the recipe does most of its processing.\n\nThe following class declaration\
    \ shows the basic functionality needed by a facial recognition application:\n\n\
    ```\nclass MainForm :\n    public Osp::UiX::Controls::Form,\n    public Osp::Media::ICameraEventListener\n\
    {\npublic:\n    MainForm(void);\n    virtual ~MainForm(void);\n    bool Initialize(void);\n\
    \nprotected:\n    // Face recognizer members\n    Osp::UiX::FaceRecognizer* pFaceRecognizer;\n\
    \    Osp::UiX::FaceRecognitionInfo* pTargetFaceInfo;\n    // Camera data members\n\
    ```"
