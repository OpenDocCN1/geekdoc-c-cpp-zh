    The Security namespace provides a platform wide security system and advanced security
    services such as: cryptographic functions, certificate management services, key
    management and user authentication with single sign on.


    bada supports generating pseudo random numbers using the following algorithms:
    AES using the AesSecureRandom class, DES using DesSecureRandom, and 3DES using
    DesEdeSecureRandom.


    These functions generate cryptographically secure random numbers (CSPRNG), which
    can be used in bada to generate secret keys using the SecretKey, SecretKeyGenerator
    and related interface classes (see Figure 6.24). A secret key could be used for
    password protecting a file, for example.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_216_0.png)


