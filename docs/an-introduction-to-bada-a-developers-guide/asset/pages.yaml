    \ mode, also listener will listen\n    //to the specified events as passed in\
    \ the argument\n    r = pServerSocket->AsyncSelectByListener\n        (NET_SOCKET_EVENT_ACCEPT|NET_SOCKET_EVENT_CLOSE\
