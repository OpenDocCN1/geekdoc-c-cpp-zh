- pgno: 46
  md: '# 2.1.2 Project Structure


    > Note: When you start the IDE, you can choose the workspace in which Eclipse
    will create new folders and look for existing project files. You can switch between
    workspaces at any time by choosing File | Switch Workspace from the IDE main menu.


    In your workspace, you will see a folder named BuddyFix (or the name you chose
    for your new project). Inside it you’ll see some subfolders (see Figure 2.3).
    As summarised in Table 2.1, the folder structure is as follows:


    +   - The /inc and /src folders are where the generated C++ code files for your
    project are saved; .h files in /inc and .cpp files in /src.

    +   - The /Home folder is the filesystem root for any data files or folders your
    app reads or writes.

    +   - The /Icons folder is where you should store the icons used by your app,
    and it’s where the Wizard copies the default app icon – which you should change
    for your own artwork, of course, when you create a real project.

    +   - The /Res folder is where your application keeps resource files that it uses.
    We will see how resources are used when we create the BuddyFix UI.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_46_0.png)


    Figure 2.3 The BuddyFix folder and subfolders.'
  merge: -1
