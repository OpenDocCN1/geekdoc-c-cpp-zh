- pgno: 32
  md: '# The Mobile Difference


    Mobile is different. This chapter summarises what makes mobile software and development
    different from developing ‘conventional’ fixed software for desktops or web applications.
    We also suggest some software development best-practices that are particularly
    appropriate for mobile, and that can help you stay in control of your project.


    # 1.1 The Mobile Context


    Some 20 years on from the birth of mobile, hardware and telecoms have changed
    out of all recognition. In all sorts of ways, mobile usage has also changed the
    way that people behave. Even so, the exploitation of mobile services has hardly
    begun. The apps revolution of the last several years, dominated by iPhone but
    certainly not limited to it, is a clear indicator of things to come. The real
    revolution, however, will be the arrival of apps and services for the mass market
    – and that’s what makes bada a potential game changer.


    From a practical perspective, the bada platform and accompanying ecosystem provide
    a great foundation for mobile development. So what makes mobile different?


    First, mobile hardware is different from desktop hardware. It’s not just that
    mobile phones fit in your pocket. The relentless drive to fit more and more functionality
    into smaller and smaller physical packages has led to almost'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'continuous innovation. In consequence, mobile storage, mobile display, and
    mobile power technologies are different from their big brothers on the desktop.
    When you are developing for mobile, it is essential to understand how these differences
    can impact the way you design your apps and the way you write your code.


    Second, mobile usage is different. Users use mobile differently from the way they
    use fixed desktop devices, and they consume mobile services differently. Even
    the way that users buy and pay for their mobiles and mobile software is quite
    different from what happens on the desktop. In fact this is a crucial difference,
    because without the willingness of users to casually buy mobile software, there
    would be no apps revolution! Again, these are differences that will impact the
    way you design your apps and write your code.


    Above all, however, the mobile opportunity is different. Let’s illustrate that
    difference with an example – mobile services. We can divide these into two groups:
    new services that are only meaningful in a mobile context, and others that are
    traditionally used in fixed or web browser-based environments but that can now
    be extended to the mobile dimension.


    Location-based or map services are good examples of the first group. The idea
    of location-based services (LBS) has been around for over a decade now. Few would
    doubt the potential of such services to add unique value on mobile, where services
    and information can be delivered filtered for specific locations, providing information
    that is related to a user’s current position and that addresses an immediate need.
    However, only a few such services have turned out to be really big hits, and the
    most obviously successful example – in-car navigation – isn’t network based at
    all, and so delivers almost nothing of the real promise of LBS. The reason is
    simple. In the past, the technologies and ecosystem just were not ready. Today,
    however, everything is in place for LBS finally to deliver its promise.


    Examples of the second group are the booming social network services (SNS) stemming
    from the Web 2.0 movement that gave birth to blogs, Facebook, MySpace, YouTube,
    Twitter – you name it. Such applications and social networks can now increasingly
    be invoked and used from mobile handsets, either through web sites customised
    for mobile browsers or through standalone apps. But in these cases too the new
    dimensions that mobile brings have barely begun to be exploited.


    These examples also point to another difference between mobile apps and desktop
    applications. On the desktop, your word-processor or spreadsheet or database application,
    and your first-person shooter or adventure game, are big and complex, and the
    bigger they are, the better; they do everything, integrate with everything, and
    each would be very happy if it was the only application you ever needed. Mobile
    apps are almost exactly the opposite of this – they are small and focused pieces
    of software, designed to do one thing, and do it well.'
