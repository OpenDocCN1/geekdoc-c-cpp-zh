  md: 'standards of the old definitions, in these days of 1 GHz processors and multi-gigabyte
    memory.


    The answer is that mobile is certainly constrained relative to the desktop, in
    almost all respects from CPU capability to available RAM to screen size and network
    bandwidth.


    But also, there are absolute constraints with mobile. Let’s not go through all
    the differences again (we looked at them in Chapter 1), but on mobile resources
    are critical in the following areas:


    +   - memory – size and speed (e.g. flash, no HD);

    +   - CPU;

    +   - ROM;

    +   - battery/power;

    +   - network bandwidth.


    The power and flexibility of C++ comes at a price. The most critical issues are:


    +   - Memory management, which the application must manage for itself, in contrast
    with languages that provide garbage collection to reclaim allocated memory that
    is no longer in use.

    +   - Exception handling, where the C++ standard exception mechanism is expensive
    in terms of memory footprint and processor cycles.

    +   - Lack of native string and array types.


    Most runtime failures (crashes) of C and C++ programs are caused by the same few
    common kinds of programming errors, specifically memory allocation errors and
    memory access errors, including pointer and array indexing errors.


    This simple fact is what motivates many of the distinctive features of Java. No
    pointers, true primitive types for arrays and strings, and automatic garbage collection.


    However, Java imposes a runtime cost that can be noticeable even on the desktop,
    and can be a showstopper on mobile; it also forces app developers into a sandbox
    in which access to native features is denied, reduces flexibility, and creates
    a barrier between apps and the native platform.


    On mobile, going native gives apps all the power of the underlying platform. However,
    the kind of tolerance for runtime failure that seems to have become a habit on
    the desktop is simply not acceptable on mobile. Mobile users will not accept data
    loss, calls hanging, or the other frustrations of buggy apps that crash or freeze.'
