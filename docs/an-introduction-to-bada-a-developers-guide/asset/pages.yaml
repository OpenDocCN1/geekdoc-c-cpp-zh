  md: "We called Player::OpenFile asynchronously, so we need to actually start the\
    \ audio player when we know the content is successfully opened. The method to\
    \ use is the OnPlayerOpened method of IPlayerEventListener:\n\n```\nvoid\nAudioPlayerForm::OnPlayerOpened(result\
    \ r)\n{\n    // The content is successfully opened, start playing\n    pAudioPlayer->Play();\n\
    }\n```\n\nWhen the audio has finished playing the OnPlayerEndOfClip method is\
    \ invoked. We'll close the player in this method. pAudioPlayer will be deleted\
    \ in our form's destructor.\n\n```\nvoid\nAudioPlayerForm::OnPlayerEndOfClip()\n\
    {\n    pAudioPlayer->Close();\n}\n```\n\n# Other IPlayerEventListener methods\n\
    \nIn our example we implemented two IPlayerEventListener methods: OnPlayerOpened\
    \ and OnPlayerEndOfClip. IPlayerEventListener also contains a number of other\
    \ methods, listed in Table R4.1.\n\n# Table R4.1 Other IPlayerEventListener methods\n\
    \n| Method | Description |\n|---|---|\n| OnPlayerInterrupted | Called when the\
    \ player is interrupted as a result of an event such as receiving a call. The\
    \ player will be automatically stopped. Note this handler is only invoked when\
    \ the player is interrupted while playing some content |\n| OnPlayerReleased |\
    \ Called when the external event that interrupted the player in OnPlayerInterrupted\
    \ has completed. It is the responsibility of the application to start the sound\
    \ playing again by calling the Play() method of Player |\n| OnPlayerBuffering\
    \ | Called to notify the application that streaming data is being buffered. You\
    \ could update your user interface at this point to let the user know why audio\
    \ playback is not as smooth |\n| OnPlayerErrorOccured | This method is sent a\
    \ Media::PlayerErrorReason specifying errors such as out of memory or connection\
    \ errors with streaming data |\n| OnPlayerSeekCompleted | Called when moving to\
    \ a certain position in audio or video is completed |"
