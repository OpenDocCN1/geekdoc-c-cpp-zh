- pgno: 135
  md: '+   - Framework methods that can fail return a result value, and app developers
    are encouraged to do the same in their own code.

    +   - Framework methods are provided to get and set the ‘last result’, and get
    error messages, which assists simplistic propagation of exceptions.


    This provides a minimal framework for propagating exceptions within application
    code, and a simple mechanism for returning and checking for exceptions. Significantly,
    it forces responsibility for exception handling onto the app developer. Looked
    at positively, it means that app developers are encouraged to ‘try to understand
    and handle problems’7 rather than bouncing them into an exception handling mechanism
    that, by convention, emphasises terminating programs upon exceptions rather than
    gracefully recovering.


    In this respect, mobile is different from more conventional desktop platforms.


    As Stroustrup himself explains, an important part of the design philosophy of
    C++ is to support the development of systems that execute ‘where no programmer
    is present’,8 for example telephone exchanges and ATMs. In those contexts, the
    recommended response of an application to an exception is termination.9


    In a scientific or academic context such an approach to correctness is entirely
    appropriate, and it is indeed the kind of behaviour we have become accustomed
    to in (say) office applications on the desktop. But mobile couldn’t be more different;
    if my phone behaves like that, it will go straight back to the shop.


    The point to make about exceptions on mobile is not simply that they must be handled,
    but that they must be expected; low memory, low power, sudden loss of power, loss
    of connectivity and intermittent connectivity, and even the sudden loss of a file
    system (for example when removable media is abruptly removed from a device without
    first unmounting), are all everyday occurrences on mobile, and apps that respond
    to such events by promptly terminating will not be popular with users.


    On mobile, then, exception handling mechanisms do not just differ from the desktop
    in the degree to which any overhead they add may be acceptable, they also express
    different design philosophies and must respect different user expectations. If
    formality and correctness, as evident in abrupt termination, are most important
    on large systems, on mobile the values are opposite, and graceful degradation,
    or user friendliness, is the primary virtue.


    > 7 In the (now possibly unfashionable) words of Doug McIlroy, quoted by Stroustrup,
    Design and Evolution, p. 384.


    > 8 Stroustrup, Design and Evolution, p. 107.


    > 9 For example, see Franek, Memory as a Programming Concept, p. 52: ‘We therefore
    suggest immediate program termination in the event of memory allocation failure.’
    As he goes on to say, ‘of course’ some helpful message should also be reported
    to the user ‘so that the nature of the error can easily be determined if necessary.’'
