  md: "to display the keypad. For example, the display of the keypad could be triggered\
    \ by a press of a soft key invoking the `ShowKeypad()` method:\n\n```\nvoid\n\
    MainForm::ShowKeypad(bool show)\n{\n    if(true == show)\n    {\n        pKeypad->Show();\n\
    \    }\n    else // call the Form's Show() method\n    {\n        Show();\n  \
    \  }\n}\n```\n\nThe standalone keypad displays ‘Done’ and ‘Cancel’ command buttons\
    \ in the soft key area. Although they look like soft keys, they are not soft keys\
    \ and do not behave in the same way as soft keys. When the ‘Done’ button is tapped,\
    \ an `ITextEventListener` action event is triggered and the `MainForm`'s `OnTextValueChanged()`\
    \ method is invoked. When the ‘Cancel’ button is tapped, a `ITextEventListener`\
    \ action event is triggered and the `MainForm`'s `OnTextValueChangedCancelled()`\
    \ method is invoked.\n\nThese methods can be used by an application to retrieve\
    \ the data that has been entered by the user using the Keypad control. For example,\
    \ the `OnTextValueChanged()` method can be implemented to retrieve the text string\
    \ from the Keypad object:\n\n```\nvoid\nMainForm::OnTextValueChanged(const Osp::Ui::Controls&\
    \ source)\n{\n    String string(pKeypad->GetText()); // Retrieve text from Keypad\n\
    \                                        // object\n}\n```\n\n# Method 2: Using\
    \ an Overlay-style Keypad within an Edit Field\n\nThis recipe creates an Edit\
    \ field, which displays one line of editable text to the user. It is implemented\
    \ in the overlay style, so that when the user taps on the Edit control, an overlay\
    \ keypad is launched and the Edit control is automatically scrolled so that it\
    \ does not overlap with the overlay keypad (see Figure R2.7).\n\nTo use the overlay\
    \ style of keypad the Form must contain a scroll panel and the Edit field control\
    \ must be added to the scroll panel. This recipe creates a scroll panel container\
    \ using the `Osp::Ui::Controls::ScrollPanel` class and creates an Edit field control\
    \ using the `Osp::Ui::Controls::EditField` class."
