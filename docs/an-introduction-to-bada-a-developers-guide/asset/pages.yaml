  md: '# 7.2 Use the bada SNS Gateway to Access a Social Network Service such as Facebook


    # Problem Description


    You need an easy way to use a social networking service like Facebook from your
    bada app. You can use the bada SNS Gateway.


    # The Recipe


    The following configuration is required for this recipe:


    **Namespaces used:**

    Osp::Social::Services, Osp::Base::Collection


    **Header files to #include:**

    FSocial.h, FBase.h


    **Required libraries:**

    FSocial, FSocialServices, FSocialServicesSnsAuth


    **Required privilege level:**

    System


    **Required privilege groups:**

    SNS_SERVICE


    The bada SNS Gateway provides a unified API that enables easy access to social
    networking services (SNS), such as Facebook, Twitter, and MySpace. The Gateway
    supports many basic use-cases, and also provides simple authentication that can
    be used for subsequent interaction with the services’ own RESTful APIs if you
    need more complex interactions.


    The API is asynchronous, and uses listener methods of interface classes to enable
    call-backs to be received from the framework when events of interest occur. To
    use a listener, an app derives a suitable object, for example a Form, from the
    appropriate interface class, and implements a listener method to handle events
    of interest.


    The SNS Gateway provides listeners for four different kinds of event:


    +   - nsActivityListener: receives responses to activity requests made to the
    Gateway.


    +   - nsGatewayListener: receives events related to the login status of the client
    app.'
  merge: -1
  img_proc: true
- pgno: 446
  md: '+   - **ContentListener:** receives responses to *content* requests made to
    the Gateway.

    +   - **SnsPeopleListener:** receives responses to other requests to the Gateway.


    A critical step in any interaction with SNS is authentication. There are two aspects
    to authentication:


    +   - All social networks (and in fact most web services) require client apps
    to register for keys before allowing API access to their services.

    +   - All social networks require user authentication before allowing user access
    to individual accounts.


    The first step, therefore,¹ when you develop a bada SNS client app is to register
    the app with the service provider (Facebook, Twitter, or MySpace). The documentation
    at developer.bada.com provides step-by-step details showing you how to register
    your application (i.e. your SNS client) with these service providers. When the
    service provider registers your application, you will be provided with your own
    application and secret keys.²


    After you have registered your application with the relevant service provider,
    interaction with the bada SNS Gateway consists of the following initial steps:


    +   1. Implement `ISnsAuthenticatorListener` and `ISnsGatewayListener`.

    +   2. Implement any other SNS listeners your application requires.

    +   3. Create an instance of the `SnsAuthenticator` and `SnsGateway` objects.

    +   4. Call `SnsAuthenticator::Authenticate()`.

    +   5. On successful authentication, add this result to the `SnsGateway` by calling
    `SnsGateway::AddAuthResult`.


    When these steps are complete, you can call the `SnsGateway` methods that provide
    the specific interactions your app requires, such as uploading an image or sending
    a tweet.


    Figure R7.1 shows an app authenticating with the bada SNS Gateway. First, the
    app itself provides a login page for the relevant service. Pressing **Sign in**
    will call `SnsAuthenticator::Authenticate()`. In turn, this will launch the user
    login page of the SNS, in this example Facebook. Finally, after the user logs
    in successfully, the bada Server displays a notification to the user. On pressing
    Exit, the user is returned to the application, which now runs.


    ¹Of course, you will also need to have appropriate developer privileges before
    you can use bada services. For more about how to become a bada partner, which
    is the required membership level for developers using bada services, please see
    the information at developer.bada.com.


    ²The terminology varies between different service providers, for example for both
    Twitter and MySpace these are known as the Consumer Key and Secret key, whereas
    for Facebook they are known as the Application Key and Application Secret.'
