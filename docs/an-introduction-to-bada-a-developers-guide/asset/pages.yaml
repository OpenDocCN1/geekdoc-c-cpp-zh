    # Recipe 5.7: Query a DNS Server


    # Problem Description


    You want to query a Domain Name System (DNS) server.


    # The Recipe


    The following configuration is required for this recipe:


    | Namespaces used: |

    | Osp::UI, Osp::UI::Controls, Osp::Net, Osp::Base::Collection |

