  md: 'After this, your app should successfully run on your mobile device and logging
    messages should be visible in your IDE output window.


    > Note: A further very useful feature is in beta testing status at the time of
    writing. Samsung will soon provide you with the chance to make use of real device
    target deployment even if you do not have a device available. The code name for
    this is RTL: Remote Testing Lab. There will be a lab somewhere in the world hosting
    a large number of real bada-powered devices. You can conveniently connect to these
    over the Internet and deploy your bada app there – just as if it was on your desk
    in front of you. This will all soon be accessed through a RTL plug-in for the
    bada IDE. So stay tuned!


    # Create Package


    The last task in the second step of the process of taking an idea to a published
    app is to create the full package that is used in the third step for certifying
    your app. To create a package, select the bada project in the IDE that you want
    to submit for certification. Click on the Project menu and select Make Package
    (see Figure 2.30).


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_83_0.png)


    Figure 2.30 Creating an application package.


    In the next dialog you can define the output folder where the package (which is
    a zip) should be stored.


    # Step 3: On the seller.samsungapps.com Site


    When all this is done and you have implemented your idea into an app that is built,
    run, tested, and packaged, you are one step away from becoming rich and famous
    – or both. This final step is certifying before publishing your app.'
  merge: -1
