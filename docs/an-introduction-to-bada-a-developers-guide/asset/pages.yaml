    # Recipe 2.8: Get Multi-touch Events


    # Problem Description


    You want to retrieve multiple touch events from the user input.


    # The Recipe


    The following configuration is required for this recipe:


    **Namespaces used:**

    `Osp::UI, Osp::UI::Controls, Osp::Graphics`


    **Header files to #include:**

    `FUI.h, FUIControls.h, FGraphics.h`


    **Required libraries:**

    `FUI, FUIControls, FGraphics`


    **Required privilege level:**

    `Normal`


    **Required privilege groups:**

    `None.`


    The bada platform supports both single-point and multi-point touch user input.
    This recipe details the steps to enable multi-point touch user input within a
    Form and describes the code that needs to be implemented for the Form to receive
    and handle multiple touch events (see Figure R2.9). The bada platform supports
    the detection and handling of up to six points² simultaneously.


    This recipe assumes the steps detailed in the recipe ‘Get Touch Events’ have been
    followed to enable touch input and handle touch events.


    ¹For graphics canvas drawing in the recipe.

    ²This can vary according to the hardware specification of the device, some may
    not support six points.'
