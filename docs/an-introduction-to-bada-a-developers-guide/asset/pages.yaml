- pgno: 87
  md: "# 3.1 Expanding the Application Skeleton\n\nWe have seen how easy it is to\
    \ get a project started in bada; Wizards do the hard work for you. Now let’s dig\
    \ a bit deeper into code.\n\nLet’s start by walking through the main BuddyFix\
    \ class as declared in buddyfix.h (this is code the Application Wizard generated\
    \ for us):\n\n```\nclass BuddyFix :\n    public Osp::App::Application,\n    public\
    \ Osp::System::IScreenEventListener\n{\n```\n\nEvery app derives from the App::Application\
    \ class; so when you create your own app and derive from Application, you extend\
    \ a class the bada frameworks already know about, with the custom behaviour you\
    \ specify. All the methods the frameworks expect are present in your derived class.\
    \ You’ll notice that your app also derives from the System::IScreenEventListener\
    \ class; ‘I’ stands for ‘Interface’, which is a pattern we’ll see a lot more of\
    \ (discussed in more detail in Chapter 4).\n\nNext, we see various constructors\
    \ declared:\n\n```\npublic:\n    static Osp::App::Application* CreateInstance(void);\n\
    \npublic:\n    BuddyFix();\n    ~BuddyFix();\n```\n\nCreateInstance() is a so-called\
    \ factory function that wraps the C++ constructor and when invoked, returns an\
    \ instance of the application. The two declarations that follow it are the C++\
    \ constructor and destructor methods. Since the default implementations for all\
    \ three will work fine for us, there’s nothing to worry about here. The remaining\
    \ public declarations, which complete the class, are the ones we’re interested\
    \ in:\n\n```\npublic:\n    bool OnAppInitializing(Osp::App::AppRegistry& appRegistry);\n\
    \    bool OnAppTerminating(Osp::App::AppRegistry& appRegistry,\n        bool forcedTermination\
    \ = false);\n    void OnForeground(void);\n    void OnBackground(void);\n    void\
    \ OnLowMemory(void);\n    void OnBatteryLevelChanged(Osp::System::BatteryLevel\
    \ batteryLevel);\n    void OnScreenOn(void);\n    void OnScreenOff(void);\n};\n\
    ```\n\nLet’s call these the ‘lifecycle’ methods; every app has them, and every\
    \ app must implement them. The Wizard provides a minimal implementation for us,\
    \ but as we’ll see, these methods are important in defining the way our app behaves,\
    \ so we definitely want to understand what they can do for us."
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 3.1.1 Being Event Driven


    A bada app is entirely event driven; its runtime behaviour is defined in response
    to events that it receives from the framework. These include user-originated events
    such as touch events, soft key events and (hard) key events, and system-originated
    events such as timers, sensor notifications, incoming voice calls or messages,
    and lifecycle events.


    In bada the event loop is hidden within the bada frameworks, and is not visible
    to the application. To receive the events that it wants to handle, the app just
    implements the appropriate listener call-back methods. This makes a bada application
    very straightforward to write. Applications are essentially reactive, and are
    completely defined by the set of events they handle.


    Choosing which events to listen for and handle depends on how you want your GUI
    to behave, and on your app’s core functionality. However, the lifecycle methods
    define a common set of system events that every bada app should handle.


    # 3.1.2 The Runtime App Lifecycle


    The app lifecycle defines the dynamic, runtime architecture of every application.
    The lifecycle is defined by the bada app frameworks, and when you derive your
    app from App::Application, your app inherits the lifecycle methods.


    In bada, the lifecycle is very simple. Your app exists in one of four possible
    states: Initialising, Running, Terminating, or Terminated. At any time, your app
    can be in only one of these states. You probably recognise this as a simple state
    machine: your application transitions between these states, and associated with
    the transitions or states are the lifecycle methods:


    +   1. Initialising OnAppInitializing()

    +   2. Running OnForeground(); OnBackground(); OnLowMemory(); OnBatteryLevelChanged();
    OnScreenOn(); OnScreenOff();

    +   3. Terminating OnAppTerminating();

    +   4. Terminated (no associated methods – your app is no longer running).


    The application lifecycle is shown in Figure 3.1.


    Strictly speaking, only four of these methods relate specifically to the lifecycle;
    the others, such as OnBatteryLevelChanged() and OnScreenOff(), respond to system
    events triggered by conditions that are so important, or so frequent on mobile,
    that the framework makes a special case of them and gives you the opportunity
    to respond appropriately.


    Let’s look more closely at the four lifecycle states, and at how the lifecycle
    methods map to them.'
  merge: -1
  img_proc: true
- pgno: 89
  md: "![](img/a257d5fd53a79a244a20e587cd2f08f6_89_0.png)\n\nFigure 3.1 The application\
    \ lifecycle.\n\n# 1. Initialising\n\nWhen launched by the bada application framework,\
    \ your app enters the Initialising state and its OnAppInitializing() method is\
    \ called. Look at the implementation in BuddyFix.cpp; recall that we have updated\
    \ the code the Application Wizard generated to load our own Form pMainListForm,\
    \ otherwise this is the default implementation:\n\n```\n// Customised to load\
    \ IDF_MAIN_LIST_FORM\nbool\nBuddyFix::OnAppInitializing(AppRegistry& appRegistry)\n\
    {\n    // Initialize UI resources and application specific data.\n    // The application's\
    \ permanent data and context can be obtained\n    // from the appRegistry.\n \
    \   // If this method is successful, return true; otherwise, return\n    // false.\n\
    \    // If this method returns false, the application will be terminated.\n  \
    \  // Uncomment the following statement to listen to the screen on/off\n    //\
    \ events.\n    // PowerManager::SetScreenEventListener(*this);\n\n    // Create\
    \ a form\n    //REPLACED Form1 *pForm1 = new Form1();\n    MainListForm *pMainListForm\
    \ = new MainListForm();\n```"
  merge: -1
