  md: "This recipe is similar to the content service presented in Chapter 5 but more\
    \ detailed. Content on the bada platform refers to images, music, videos, or any\
    \ other type of data that is specified by the developer. There are two steps necessary\
    \ for creating content. The first step is to transfer the physical content files\
    \ to the workspace, and the second is to create the content meta-information on\
    \ the bada Server. This meta-information is essential for the bada platform to\
    \ be able to search and manipulate physical contents on the workspace.\n\nBefore\
    \ using an Amazon S3 workspace, the application has to authenticate itself at\
    \ the Amazon server. We explained this process in Chapter 5 earlier. Hence, in\
    \ this recipe we will not cover this part again but focus on the content transfer\
    \ itself. In all the example code in this recipe we assume that you have already\
    \ authenticated your application with the Amazon server. The code snippet below\
    \ illustrates the declaration of our class that holds the necessary methods and\
    \ members.\n\nWe call our class YourClassName and it derives from the interfaces\
    \ Osp::App::IAppControlEventListener, Osp::Content::IContentTransferListener,\
    \ and Osp::Content::IRemoteContentManagerListener.\n\n```\nclass YourClassName\
    \ :\n    public Osp::App::IAppControlEventListener,\n    public Osp::Content::IContentTransferListener,\n\
    \    public Osp::Content::IRemoteContentManagerListener\n{\nprivate:\n    Osp::Content::ContentTransfer*\
    \ pContentTransfer;\n    Osp::Content::RemoteContentInfo* pRemoteContentInfo;\n\
    \    Osp::Content::RemoteContentManager* pRemoteContentManager;\n    Osp::Base::Utility::Uri\
    \ uri;\n\npublic:\n    // We just mention the relevant methods here\n\n    //\
    \ Callback function for sign-in AppControl\n    void OnAppControlCompleted(const\
    \ Osp::Base::String& appControlId,\n        const Osp::Base::String& operationId,\n\
    \        const Osp::Base::Collection::IList* pResultList);\n\n    // Callback\
    \ functions for content transfer to the workspace\n    void OnContentUploadCompleted(RequestId\
    \ reqId, result r,\n        const Osp::Base::String& errorCode,\n        const\
    \ Osp::Base::String& errorMessage);\n\n    void OnContentTransferCanceled(RequestId\
    \ reqId, result r,\n        const Osp::Base::String& errorCode,\n        const\
    \ Osp::Base::String& errorMessage);\n\n    void OnContentCreated(RequestId reqId,\n\
    \        const Osp::Base::String& contentId, result r,\n        const Osp::Base::String&\
    \ errorCode,\n        const Osp::Base::String& errorMessage);\n};\n```"
