  md: '# Recipe 3.4: Detect a Face from Video


    # Problem Description


    You want to detect a face that appears on a video stream from the camera preview.


    # The Recipe


    The following configuration is required for this recipe:


    | Configuration | Details |

    |---|---|

    | Namespaces used | `Osp::Ui`, `Osp::Ui::Controls`, `Osp::Ui::Uix`, `Osp::Media`
    |

    | Header files to `#include` | `FUi.h`, `FUiX.h`, `FMedia.h` |

    | Required libraries | `FUi`, `FUiControls`, `FUiX`, `FMedia` |

    | Required privilege level | `Normal (Media::Camera)` |

    | Required privilege groups | `CAMERA` |


    In this recipe we take a look at the face detection functionality of bada to find
    the position of a face within a video stream. The FaceDetector class enables you
    to find a face in a still image or video stream. A maximum of five different faces
    can be detected at one time. We can, however, handle the number of face detections
    by using the `SetProperty()` method.


    To use a video stream, we must construct and use an object of type Camera. The
    manifest file must have the privilege set, which allows access to the camera device.
    So, when you generate the manifest file, make sure you set the CAMERA privilege.


    The recipe ‘Recognise a Face’ shows how to use the face recognition API after
    a face has been detected.


    In this recipe, we show you how to find a face on a video and draw rectangle around
    the face. The steps are as follows:


    +   1. Set the orientation to landscape.

    +   2. Construct a `FaceDetector` object.

    +   3. Construct the Camera object and invoke `PowerOn()`.

    +   4. Construct an `OverlayPanel` to display the video stream.

    +   5. Set the resolution and `PixelFormat` accordingly.'
