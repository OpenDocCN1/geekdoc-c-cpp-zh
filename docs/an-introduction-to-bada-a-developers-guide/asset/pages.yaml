  md: "But first, we should save the changes that we have made. Select File | Save\
    \ All Resources.\n\n> Note: Always save when you finish working with UI Builder,\
    \ because resource files are only saved into your project /Res folder when you\
    \ explicitly save them. If you don’t, your changes may be lost when UI Builder\
    \ exits.\n\n# 2.4 Hooking Up Your Forms to Your Code\n\nUI Builder takes the properties\
    \ we have defined and generates a declarative XML layout file from them. If you\
    \ open up IDF_MAIN_LIST_FORM in a text editor, you will see the XML declarations.\n\
    \n```\n<?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"no\"?>\n<!DOCTYPE\
    \ Scene SYSTEM \"UIForm.dtd\">\n<Scene Diversion=\"2\">\n  <Form id=\"IDF_MAIN_LIST_FORM\"\
    >\n    <property BGColor=\"\" BGColorOpacity=\"0\" Orientation=\"Portrait\" softKey0NormalIcon=\"\
    \" softKey0PressedIcon=\"\" softKey0Text=\"\" softKey1NormalIcon=\"\" softKey1PressedIcon=\"\
    \" softKey1Text=\"\" title=\"BuddyPix\" titleAlign=\"ALIGN_LEFT\" titleIcon=\"\
    \"/>\n    <layout mode=\"Portrait\" style=\"FORM_STYLE_INDICATOR|FORM_STYLE_TITLE\"\
    />\n    <layout mode=\"Landscape\" style=\"FORM_STYLE_INDICATOR|FORM_STYLE_TITLE\"\
    />\n  </Form>\n  <List id=\"IDC_MAIN_LIST\" parent=\"IDF_MAIN_LIST_FORM\">\n \
    \   <property ListItemFormat=\"LIST_ITEM_DOUBLE_IMAGE_TEXT_FULLTEXT\" colorOfEmptyListText=\"\
    \" column1Width=\"50\" column2Width=\"50\" rowHeight=\"80\" row2Height=\"50\"\
    \ textOfEmptyList=\"No buddies...\"/>\n    <layout height=\"708\" mode=\"Portrait\"\
    \ style=\"LIST_STYLE_MARK\" width=\"480\" x=\"0\" y=\"0\"/>\n    <layout height=\"\
    72\" mode=\"Landscape\" style=\"LIST_STYLE_MARK\" width=\"333\" x=\"95\" y=\"\
    85\"/>\n  </List>\n</Scene>\n```\n\nIt is easy enough to see how our property\
    \ settings have been translated into attributes of the Form and List objects that\
    \ the XML declares. However, the layout file is just a declaration, not an implementation.\
    \ At runtime, if we load the layout file, the framework will do the rest of the\
    \ work of instantiating objects for us. But we must first load the layout file."
