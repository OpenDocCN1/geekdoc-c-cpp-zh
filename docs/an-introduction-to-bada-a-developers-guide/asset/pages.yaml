- pgno: 42
  md: '# CHAPTER 2


    # bada Basics


    This chapter gets straight down to the essentials of developing native bada applications
    in C++. We’ll see just how easy it is to get a first skeleton application up and
    running on the bada Simulator.


    To start with, this little app doesn’t do much – think *Hello World*! But this
    is the code at the heart of every bada app, and as we’ll see in the next few chapters,
    bada makes it easy to build up from this basic skeleton to create a full-featured,
    native application.


    > **Note:** At the time of writing the SDK version is 1.0.0 beta3. Current SDKs
    install on Microsoft Windows only. It’s likely that bada will support other development
    options eventually, but nothing is currently announced. The Simulator launches
    from the Eclipse-based bada IDE, which is included in the SDK.


    # What You Will Learn


    This chapter aims to get you started quickly. You will learn:


    +   - How to create a simple application using the Application Wizard.

    +   - How to add a simple UI using UI Builder.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '+   - How to use the developer and publishing services provided by the bada
    developer portal.

    +   - How to build for and deploy to a phone.


    # What You Will Need


    This book assumes beginner’s C++ skills. If you don’t know C++, don’t give up:
    bada works hard to make the app developer’s life as easy as possible. If you have
    experience using any modern programming language, a good C++ primer should be
    enough to get you up and running.


    By the way, don’t worry if you are new to mobile development. As we saw in the
    previous chapter, there are some things that make mobile unique, and different
    from the world of the desktop. We’ll highlight those issues as they arise in the
    context of each chapter.


    # 2.1 Your First bada Application


    Native bada apps are C++ executables that combine the code that you write with
    framework code. Because the bada framework takes care of the basic functionality
    that every app requires, there is very little code required to create a minimal
    app, as we will see.


    To start with, we will build for the bada Simulator only. Later in the chapter
    we’ll dig a little deeper and show you how to build for (and deploy to) a real
    bada phone.


    Because bada is highly modular, most of your time as a developer will be spent
    connecting together the pieces while the bada frameworks do the heavy lifting
    for you.


    As you might expect, all bada applications are fully graphical programs. In fact,
    one easy way to think of a bada application is as a GUI that does something.


    For any app, the GUI is where the user and the app meet. It’s the GUI that presents
    the application functionality to the user, and the GUI that allows the user to
    control that functionality. In fact for the user, your GUI is your app, and to
    a large degree determines the complete app experience.


    All bada apps that use the standard UI elements share the distinctive look-and-feel
    and behaviour of the bada UI and application frameworks. When you need more customised
    elements, you can derive your own and extend the default behaviour. Of course,
    there may be times when you want complete UI control (in a game, for example),
    and don’t want the standard look and feel. In that case bada allows you to write
    directly to the full-screen display to construct your own UI from scratch.'
