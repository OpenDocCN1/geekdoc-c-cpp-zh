- pgno: 424
  md: "```\nMyClass::OnSocketReadyToReceive(Osp::Net::Sockets::Socket& socket)\n{\n\
    \    ReceiveData();\n}\n\n//Notifies a socket that it can send data\nvoid\nMyClass::OnSocketReadyToSend(Osp::Net::Sockets::Socket&\
    \ socket)\n{\n    SendData();\n}\n```\n\n# Hints, Pitfalls, and Related Topics\n\
    \nbada also supports blocking mode. To use a blocking socket, do not implement\
    \ ISocketEventListener, and do not set the socket to async mode. Call the Ioctl\
    \ function with NET_SOCKET_FIONBIO and ‘0’ as arguments.\n\n```\nvoid\nMyClass::CreateBlockingSocket()\n\
    {\n    pClientSocket = new Socket();\n    pClientSocket->Construct(NET_SOCKET_AF_IPV4,\n\
    \        NET_SOCKET_TYPE_DATAGRAM, NET_SOCKET_PROTOCOL_UDP);\n\n    // Enable\
    \ synchronous (blocking) mode\n    unsigned long arg = 0;\n    pClientSocket->Ioctl(NET_SOCKET_FIONBIO,\
    \ arg);\n}\n```\n\nApplications that use blocking mode can freeze or become non-responsive\
    \ during the time the transaction is in process, so it’s preferable to use non-blocking\
    \ mode.\n\n# Recipe 5.6: Set Up an Ad Hoc Wi-Fi Network\n\n# Problem Description\n\
