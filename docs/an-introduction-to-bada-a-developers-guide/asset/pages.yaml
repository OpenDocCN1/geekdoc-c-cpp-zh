- pgno: 371
  md: "The Osp::Media namespace provides an Image class that can be used for decoding,\
    \ encoding, converting, and compressing images. It is used by applications in\
    \ conjunction with the Osp::Graphics namespace’s Bitmap class. The Bitmap class\
    \ encapsulates a bitmap that consists of the pixel data for an image and its attributes.\n\
    \nThis recipe shows two examples for using the Image and Bitmap classes within\
    \ an application. Each method details the steps required to create and use image\
    \ and bitmap data, and provides some sample code snippets.\n\nBoth examples in\
    \ this recipe assume the steps detailed in the recipe ‘Add a Form to a Frame-based\
    \ App’ (which you can find in the second group of recipes, “UI Basics”) have been\
    \ followed to add a Form to the Application’s Frame.\n\n# Example 1: Downloading\
    \ Image from a Remote URL and Saving it to the Filesystem\n\nThis recipe downloads\
    \ a JPEG image file from a remote location and saves it to the /Media/Images/\
    \ folder in the device’s filesystem.\n\nThe Image class provides functionality\
    \ to download an image file from a specified URL, so it is not necessary for the\
    \ application to create and use a Web control for downloading the file. This DecodeUrl()\
    \ method works asynchronously, so the Osp::Media::IImageDecodeUrlEventListener\
    \ must be implemented to ensure that the decoding operates correctly.\n\nThe following\
    \ code snippet shows an example of the MainForm class definition:\n\n```\nclass\
    \ MainForm :\n    public Osp::Ui::Controls::Form,\n    public Osp::Media::IImageDecodeUrlEventListener\n\
    {\npublic:\n    MainForm(void);\n    ~MainForm(void);\n    bool Initialize(void);\n\
    \nprotected:\n    Osp::Graphics::Bitmap* pBmp;\n    Osp::Media::Image* pImage;\n\
    \    RequestId decodeRequestId;\n\npublic:\n    result OnInitializing(void);\n\
    \    result OnTerminating(void);\n\n    void OnImageDecodeUrlReceived (RequestId\
    \ reqId,\n        Osp::Graphics::Bitmap* pBitmap, result r,\n        const Osp::Base::String\
    \ errorCode,\n        const Osp::Base::String errorMessage);\n};\n```"
  merge: -1
  img_proc: true
- pgno: 372
  md: 'The creation of the image object and the request for downloading the image
    should be done in the OnInitializing() method:


    +   1. Create a URI instance and set the image location string to be parsed into
    a URI.

    +   2. Create and initialise an Image object.

    +   3. Start the decode URL operation by calling the DecodeURL method with the
    following parameters: location of image file, bitmap pixel format, decoded bitmap
    dimensions, request ID, event listener interface, and the timeout period in milliseconds


    Because the DecodeUrl() method is asynchronous, both the image object (created
    in step 2) and the request ID (step 3) must be defined as member variables of
    the class or as pointers so that they still exist after the OnInitializing() method
    has exited. Any memory allocated can be deleted in the MainForm class''s OnTerminating()
    method.


    The following code snippet is an example of code that would be added to the MainForm''s
    OnInitializing() method:


    ```

    // Create URI object and set image path

    Uri decodeURI;

    decodeURI.SetUrl(String(L"http://www.pathoffile.com/file.jpg"));


    // Create Image object

    pImage = new Image();

    pImage->Construct();


    // Request the retrieval of the image from remote URL

    pImage->DecodeUrl(decodeURI, BITMAP_PIXEL_FORMAT_ARGB8888, 400, 400, decodeRequestId,
    *this, Osp::Media::Image::TIMEOUT_INFINITE);

    ```


    The IImageDecodeUrlEventListener interface class receives events associated with
    the DecodeUrl() operation. The OnImageDecodeUrlReceived() method notifies the
    application that the DecodeUrl() operation has completed and that the decoded
    bitmap has been downloaded from the remote location.


    In this recipe the following operations are performed in the OnImageDecodeUrlReceived()
    method:


    +   1. Check the reported request ID is the same as the one returned by the original
    DecodeUrl() method.

    +   2. Create a bitmap container and initialise it by copying the bitmap downloaded
    from the remote location into the container.

    +   3. Create and initialise an image object.

    +   4. Encode the bitmap data into a file: in this example the JPG file is encoded
    to a file located in the /Media/Images/ folder in the filesystem.'
  merge: -1
  img_proc: true
- pgno: 373
  md: "+   5. Create a ContentManager instance and initialise it.\n+   6. Create an\
    \ ImageContentInfo instance and initialise it with the image file that has just\
    \ been stored in the filesystem.\n+   7. Create a content entry for the file in\
    \ the content database.\n\n```\nvoid\nMainForm::OnImageDecodeUrlReceived (RequestId\
    \ reqId,\n    Osp::Graphics::Bitmap *pBitmap, result r,\n    const Osp::Base::String\
    \ errorCode,\n    const Osp::Base::String errorMessage)\n{\n    if(reqId == decodeRequestId)\n\
    \    {\n        // Create bitmap\n        pBmp = new Bitmap();\n\n        // Copy\
    \ the bitmap\n        pBmp->Construct(*pBitmap, Rectangle(0, 0,\n            pBitmap->GetWidth(),\
    \ pBitmap->GetHeight()));\n\n        // Create image object\n        pImage =\
    \ new Image();\n        pImage->Construct();\n\n        // Encode the bitmap to\
    \ a file\n        pImage->EncodeToFile(pBmp, IMG_FORMAT_JPG,\n            String(L\"\
    /Media/Images/img1.jpg\"),\n            true);\n\n        // Use Content Manager\
    \ to add file to content database\n        // so that image will appear in My\
    \ files -> Images folder\n        ContentManager contentManager;\n        contentManager.Construct();\n\
    \        ImageContentInfo imageContent;\n        imageContent.Construct(String(L\"\
    /Media/Images/img1.jpg\"));\n        contentManager.CreateContent(imageContent);\n\
    \    }\n}\n```\n\nThe downloaded image file can now be found in the /My files/Images/\
    \ folder.\n\n# Example 2: Displaying a Bitmap from a Stored Image File\n\nThis\
    \ recipe retrieves a file from the filesystem and decodes it into a bitmap container\
    \ for display on the screen. This recipe assumes that the specified file exists\
    \ within the filesystem."
