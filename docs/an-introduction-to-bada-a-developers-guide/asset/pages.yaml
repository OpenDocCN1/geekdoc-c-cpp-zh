    \ objects;\n+      d. sets the start position TouchInfo list item to the current\
    \ point TouchInfo list item.\n+   4. Deletes the list containing the current multi-touch\
    \ position TouchInfo objects.\n+   5. Draws the MainForm.\n\n```\nvoid\nMainForm::OnTouchMoved(const\
