- pgno: 306
  md: "```\npDrawingCanvas->SetBackgroundColor(Color::COLOR_WHITE);\npDrawingCanvas->SetForegroundColor(Color::COLOR_RED);\n\
    pDrawingCanvas->SetLineWidth(3);\npDrawingCanvas->Clear();\n\n// Create an instance\
    \ of a Point to store the touch start position\npStartPoint = new Point();\n//\
    \ Register touch event listener\nAddTouchEventListener(*this);\n```\n\nBecause\
    \ this recipe is using the touch events to create a custom drawing on a graphics\
    \ canvas, the OnDraw() method must be implemented. The GetCanvasN() method is\
    \ used within the OnDraw() implementation to retrieve the canvas the MainForm\
    \ is using; otherwise the default Draw() method of the MainForm will overwrite\
    \ the custom drawing.\n\nIn this recipe the OnDraw() method copies the contents\
    \ of the drawing canvas to the window canvas; this is necessary because the drawing\
    \ operations are not actually being performed directly on the MainForm's canvas\
    \ in the OnDraw() method:\n\n```\nresult\nMainForm::OnDraw(void)\n{\n    result\
    \ r = E_SUCCESS;\n\n    // Retrieve the window canvas\n    Canvas* pWindowCanvas\
    \ = GetCanvasN();\n\n    if (pWindowCanvas)\n    {\n        // Copy the contents\
    \ of the drawing canvas (where the\n        // operations have been performed)\
    \ to the window canvas\n        pWindowCanvas->Copy(Point(GetClientAreaBounds().x,\n\
    \            GetClientAreaBounds().y),\n            *pDrawingCanvas, GetClientAreaBounds());\n\
    \        delete pWindowCanvas;\n    }\n\n    return r;\n}\n```\n\nThe display\
    \ will be updated when the MainForm's Show() method is called; this occurs automatically\
    \ following the OnDraw() callback.\n\nIn order to handle the touch events when\
    \ they occur the following methods have to be implemented by the MainForm: OnTouchDoublePressed(),\
    \ OnTouchFocusIn(), OnTouchFocusOut(), OnTouchLongPressed(), OnTouchLongPressed(),\
    \ OnTouchMoved(), OnTouchPressed(), or OnTouchReleased(). Each method is passed\
    \ information about the source of the event, the current position, the start position\
    \ and the status of the event.\n\nIn this recipe only the OnTouchPressed(), OnTouchMoved(),\
    \ and OnTouchDoublePressed() methods have been implemented."
