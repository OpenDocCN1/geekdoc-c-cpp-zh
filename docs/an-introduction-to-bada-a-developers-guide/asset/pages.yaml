- pgno: 102
  md: '# 3.3.1 More about Canvas


    The Canvas class enables direct access to the device display for drawing. Whenever
    you want to do direct drawing using graphical primitives (such as Line, Rectangle,
    Ellipse, Polygon, and so on, as well as TextElement for text and Bitmap for images,
    which are all members of the Osp::Graphics namespace), then you must use a Canvas.


    You can explicitly construct a normal (global) Canvas object from anywhere in
    your GUI:


    ```

    // Construct a "normal" or global canvas

    Canvas* pCanvas = new Canvas();

    pCanvas->Construct();

    ```


    Note that Canvas is always constructed in two-phases by allocating with operator
    new and initialising with Construct() (see Chapter 4, on two-phase construction).


    A normal Canvas overlays the application Frame and bypasses the window (and Control)
    hierarchy, providing direct access to the display and overwriting anything within
    its display rectangle (including your current Form and any Controls it contains).
    If no rectangle is specified in construction, a normal Canvas is full-screen size.


    This means that Canvas can be used to set a full-screen background image. (Recall
    that both Frame and Form allow their background colour to be set, but will not
    load an image as background.)


    Once Canvas is drawn, any subsequent Draw() calls will overwrite it, allowing
    Controls (for example) to be drawn on top of it. However, this will only be as
    robust as the sequence of Draw() calls in your code. So use this with care.


    The more typical way of using Canvas, which operates within the window and control
    hierarchy (and therefore does not risk unintended overwriting of other GUI elements)
    is to request a local ‘window’ Canvas object. Every Control-derived object, from
    Form down through the Control hierarchy, owns a window Canvas object:


    ```

    // Get the window canvas

    Canvas* pCanvas = GetCanvasN();

    ```


    In this case, the Canvas shares the context of its owning Control, including its
    display region and any other properties of the local graphics context that have
    been set. Typically, the caller then sets any desired display properties and draws,
    enabling a Canvas to be used to draw display primitives or background bitmaps
    directly to the screen within the context of a given Control, to create text or
    other graphics.


    In practice, Canvas is most useful in the context of Container controls such as
    Frame, Form, and Panel.'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'Canvas is not part of the Control hierarchy, and in fact is not part of the
    `Osp::UI` namespace; instead, it derives directly from the root `bada` Object
    class `Osp::Base::Object`, and is a member of the `Osp::Graphics` namespace. Canvas
    has the attributes listed in Table 3.1, which you can set on any canvas, using
    methods such as `SetForegroundColor()` and `SetLineWidth()`.


    **Table 3.1 Canvas attributes.**


    | ATTRIBUTE | DESCRIPTION |

    |---|---|

    | Foreground color | Drawing colour for primitives |

    | Background color | Background colour for clearing |

    | Line style | Line style (only Solid) |

    | Line width | Line width for primitives with a line style |

    | Font | Font used for text drawing |


    > **Note:** If you are drawing from within the `OnDraw()` call-back, then you
    should call `GetCanvasN()` on the parent Container control to retrieve the canvas
    that the Container is using, otherwise the control’s local canvas will be overdrawn
    by the parent, because drawing is always performed bottom-up through the list
    of controls owned by the container.


    # 3.3.2 Graphics Primitives


    As you would expect, bada provides a comprehensive set of graphics primitives.
    These are always drawn to a Canvas object. The Canvas supplies the graphics context
    for the primitives that are drawn to it, in the form of the set-table Canvas attributes
    shown. You can set and reset these dynamically at any time in your drawing code.
    The Canvas you draw to may be one you explicitly construct, or one you request
    from an appropriate Control.


    The `Point`, `Dimension`, and `Rectangle` classes are used to construct the various
    graphical primitives:


    **Point**


    *A two-dimensional point composed of X, Y coordinates.*


    **Dimension**


    *An X, Y ordered pair of (width, height).*'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Rectangle


    A rectangular region with a top-left point (X, Y) and a width and height.


    Shapes are always constructed from the top left corner, which is the (0,0) point
    of the local coordinate space.


    # Simple Shapes and Text


    Note that for simple drawing of shapes and text, all the work is done by the Canvas.
    You do not need to explicitly create shape, line, or text objects; instead, set
    Canvas attributes and invoke a dedicated drawing method of the Canvas object,
    for example:


    +   1. Construct a canvas:

    +   ```

    +   Canvas::Construct()

    +   ```

    +   2. Clear the canvas:

    +   ```

    +   Canvas::Clear();

    +   ```

    +   3. Set the line colour to red:

    +   ```

    +   Canvas::SetForegroundColor(Color::COLOR_RED);

    +   ```

    +   4. Draw a rectangle onto the canvas:

    +   ```

    +   Canvas::DrawRectangle();

    +   ```

    +   5. Show the canvas to the display:

    +   ```

    +   Canvas::Show();

    +   ```


    For shapes, such as Ellipse, Polygon, Rectangle, set the fill attributes by calling
    Fill methods instead of plain Draw methods, for example:


    ```

    Canvas::FillRectangle(const Color &color, const Rectangle &rect);

    ```


    Text can be drawn to a Canvas in a similar way:


    +   1. Construct a canvas.

    +   2. Construct a font with style and size:

    +   ```

    +   Font::Construct(FONT_STYLE_ITALIC, 32);

    +   ```

    +   3. Clear the canvas.

    +   4. Set the Canvas font:

    +   ```

    +   Canvas::SetFont(font);

    +   ```

    +   5. Draw "BuddyFix!" to the canvas:

    +   ```

    +   Canvas::DrawText(Point(55, 55), L"BuddyFix!");

    +   ```

    +   6. Show the canvas to the display.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Note: Text can also be drawn directly into most (but not all) types of control
    – most obviously Label, which is specifically provided as a container for non-editable
    text, and EditArea and EditField, which are provided for editable text, as well
    as MessageBox, and the various List types and ListItem types. See the bada API
    reference documentation for details.


    # EnrichedText


    EnrichedText gives you much greater control of text styles. Using simple Canvas
    text styles only allows Direction, Underline, and Strikeout styles to be set.


    Using EnrichedText you can fully specify text styles by combining overall styles
    for the complete EnrichedText block, for example alignment and wrapping, with
    individual styles set for each TextElement object in the blocks, for example font
    styles and sizes, colours (see also Table 3.2).


    # Table 3.2 EnrichedText attributes.


    | ATTRIBUTE | DESCRIPTION |

    |---|---|

    | Horizontalalignment | Left, centre, or right |

    | Vertical alignment | Top, middle, or bottom |

    | Text wrapping style | None, character wrap, or word wrap |

    | Abbreviation | Whether the drawn text is abbreviated in case the text size exceeds
    the dimension of EnrichedText |

    | Font size and style | The font size and style: plain, bold, or italic |

    | Text color | The foreground colour of the text element |

    | Background colour | The background colour of the text element |

    | Outlinecolour | The outline colour of the text element |


    EnrichedText is still drawn using the Canvas, except that the text itself is explicitly
    created and passed as a parameter:


    ```

    pEnrichedText->Construct(Dimension(width, height));

    pCanvas->DrawText(Point(left, top), *pEnrichedText);

    ```'
  merge: -1
