- pgno: 70
  md: 'To add an icon, you will first need to create the graphic of course. We recommend
    that you create an icon graphic with the following properties:


    | File Type | PNG |

    | Size | 135 × 135 pixels |

    | Resolution | 72dpi |

    | Bit depth | 32 bit |


    Create an icon in your favourite graphics application, and add it to the /Icons
    folder.


    Select the File System button beside the Main Menu icon to browse the /Icons folder
    and choose the app icon of choice. Select OK to save. Next time you launch the
    Simulator, your chosen icon will display in the main menu. (You do not need to
    rebuild for the change to take effect.)


    > Note: No effects are applied to the icon, for example rounding or beveling (other
    than dimming to indicate selection). You should create your icon with any effects
    that you want, with a transparent background, for example if you round the icon
    corners. At runtime the framework supplies the app name, so you only need to provide
    a graphic.


    # 2.6 Becoming Multilingual in Three Easy Steps


    As implemented, our BuddyFix GUI has a serious limitation: we have hardcoded English
    language strings into the UI text that we display – for example the soft key text.
    One excellent feature of bada is its extensive language support. In fact, at the
    time of writing, the SDK includes language packs for almost 40 languages, with
    more promised soon.⁵


    As this makes clear, bada is a truly multilingual platform, with a wide range
    of support for both Latin and non-Latin languages, making it possible for you
    to localise your application for a huge range of potential markets.


    ⁵ As of SDK version 1.0.0b3, the supported languages are Basque, Bulgarian, Catalan,
    Chinese Simplified, Chinese Traditional (Hong Kong), Chinese Traditional (Taiwan),
    Croatian, Czech, Danish, Dutch, English, Estonian, Finnish, French, Galician,
    German, Greek, Hungarian, Icelandic, Irish, Italian, Kazakh, Korean, Latvian,
    Lithuanian, Macedonian, Norwegian, Polish, Portuguese, Romanian, Russian, Serbian,
    Slovak, Slovenian, Spanish, Swedish, Turkish, and Ukrainian. Promised soon are
    Arabic, Farsi, Hebrew, Malay, Thai, Urdu, and Vietnamese.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'One aspect of localisation is ensuring that all the text you display in your
    application’s UI matches the user’s language settings.

    Another is ensuring that everything you display to the user is in a format that
    they expect. Date and time information should appear in the right format for a
    particular country and language setting, with the appropriate separators, and
    day and month names. Numbers should appear with the correct separators and the
    appropriate currency symbols should be used. In bada, support for localised number
    formats, dates, times, and currency is provided by the classes in the Locales
    namespace. (More on this in Chapter 6).

    Supporting multiple languages and date, time, and number formats really improves
    your application’s chances of worldwide success. The rest of this section will
    show you how to build multilingual support into your UI. Fortunately, bada makes
    this easy. Everything you need to create a multilingual UI is included in the
    UI Builder.


    # 2.6.1 Add New Languages


    Adding languages is easy. To support additional languages, open the Resource Explorer
    in the IDE. Double click String. Right-click inside the String window and from
    the menu displayed, choose Language Setting. The Add New Language dialogue is
    now displayed, as shown in Figure 2.19.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_71_0.png)


    Figure 2.19 Adding a new language in the UI Builder string table view.'
  merge: -1
  img_proc: true
- pgno: 72
  md: 'Choose the languages you want to support. When you’ve finished you’ll notice
    that the string table window has been updated to include a column for each language
    you’ve chosen.


    > **Note:** An XML file containing a localised string table is added to the project
    for each language. For example, the British English string table is called `eng-GB.xml`,
    while the French one is `fra-FRA.xml`.


    # 2.6.2 Add Text for Each Language


    Now it’s just a matter of adding the strings that appear in your UI into the corresponding
    columns in the string table for every language you support. For example, in Figure
    2.19, we add the English and French version of every string displayed in our UI.
    Add the appropriate text for each language and bada will choose the right one
    according to the user’s language settings.


    Next, you want to make sure that the title of a Form or the text of a button control,
    for example, is shown correctly for each language. All you need to do is add localised
    text for each string resource and use UI Builder to ensure that the control uses
    a string resource for its title or text. Figure 2.20 shows you how.


    In Figure 2.20, we set the title of the Form to be IDS_STRINGS. If the user has
    set their language to French, the Form title will automatically be set to ‘Bonjour
    bada’. If no localised string is found, the English one is used.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_72_0.png)


    **Figure 2.20** Using a stringID as a Form title: bada will choose the correct
    localised string.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 2.6.3 Use String Resource IDs in Your Code


    To take full advantage of bada’s multilingual support, don’t hard-code strings
    in your code. Hard-coded strings are difficult to track down and update for multiple
    languages, so instead read the string from a resource, as shown in the following
    code:


    ```

    Application* pApp= Application::GetInstance();

    String str1;

    r = pApp->GetAppResource()->GetString(L"IDS_STRING1", str1);

    ```


    The value of str1 is read from a resource file rather than hard-coded. If you’ve
    set up a different string for each language, the appropriate string will be chosen
    based on the user’s language setting.


