- pgno: 364
  md: "Finally, we implement our detection logic in the OnCameraPreviewed(). In this\
    \ callback method a rectangle should be drawn that surrounds the face detected\
    \ by the FaceDetector from the camera preview (i.e. the ByteBuffer previewedData).\
    \ For this we invoke the DetectFacesFromVideoStreamN (previewedData, resolution,\
    \ format) method from our member pFDetect object. This method returns positions\
    \ of faces in a list. After a cast you can get rectangles out of this list. In\
    \ the code below we slightly shift the position of x to adjust it to the actual\
    \ coordinate position on the OverlayPanel. We also set the background to clear\
    \ by using transparent colour. Then we draw the rectangle:\n\n```\nvoid\nForm1::OnCameraPreviewed(ByteBuffer&\
    \ previewedData, result r)\n{\n    IList* pList = pFDetect->DetectFacesFromVideoStreamN\n\
    \        (previewedData, resolution, format);\n\n    if(pList->GetCount()>0)\n\
    \    {\n        pRect = (Rectangle *)pList->GetAt(0);\n        pRect->x += 80;\n\
    \n        Canvas* pCan = GetCanvasN();\n        pCan->SetBackgroundColor(Color(0,0,0,0));\n\
    \        pCan->Clear();\n\n        pCan->DrawRectangle(*pRect);\n        pCan->Show();\n\
    \n        delete pCan;\n    }\n\n    if(pList!=null)\n    {\n        pList->RemoveAll(true);\n\
    \        delete pList;\n        pList = null;\n    }\n}\n```\n\n# Hints, Pitfalls,\
    \ and Related Topics\n\nLet’s have a more in-depth look at the StartPreview()\
    \ method of the Camera class and its options. There are two arguments: the first\
    \ is the buffer that holds the data coming from the camera and the second is a\
    \ bool primitive, which enables or disables the callback function OnCameraPreviewed().\
    \ So, there are four combinations possible, as shown in Table R3.2."
