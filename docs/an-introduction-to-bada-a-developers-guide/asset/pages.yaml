    \ r = appRegistry.Set(DateKey, mDateUpdated);\n    if (IsFailed(r))\n    {\n \
    \       // Handle error condition\n    }\n\n    // Make sure the changes are written\
    \ out to persistent storage\n    appRegistry.Save();\n\n    return true;\n}\n\
    ```\n\nWe update our registry entries with the AppRegistry::Set() method. Notice\
    \ that at the end of the method we call AppRegistry::Save(). This ensures that\
    \ our updated registry entries are written to persistent storage. Our registry\
    \ entries are now up to date, ready to restore our application the next time it\
    \ is launched.\n\n# Hints, Pitfalls, and Related Topics\n\nThe application registry\
    \ should be used for storing application settings and similar state information,\
    \ not for larger amounts of data that should either be stored in a File or Database\
    \ object, as provided by the Io namespace. File is useful for storing large blocks\
    \ of information that will generally be written out and read back into memory\
    \ in one block. A Database object is a SQLite database that is useful for storing\
    \ information that you want to search through and update easily."
