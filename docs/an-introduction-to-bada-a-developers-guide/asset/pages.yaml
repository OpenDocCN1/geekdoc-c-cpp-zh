- pgno: 322
  md: 'Namespaces used:

    Osp::Ui, Osp::Ui::Controls, Osp::Media


    Header files to #include:

    FUI.h, FUIControls.h, FMedia.h


    Required libraries:

    FUI, FUIControls, FMedia


    Required privilege level:

    Normal


    Required privilege groups:

    IMAGE


    The bada platform does not provide a control for managing Forms within an application.
    So if an application has multiple forms that the user can switch between or that
    are controlled by system events, it may be useful to implement a Form Manager.


    This recipe details the steps to create and use a Form Manager (see Figure R2.12),
    and provides some sample code snippets. It uses some of the steps detailed in
    the recipe ‘Add a Form to a Frame-based App’ to add the Form Manager to the application’s
    Frame.


    A Form Manager can be created by implementing a new class, which inherits from
    the Osp::Ui::Controls::Form class. The Form Manager should be created at application
    start-up, and is used to create and control the display of all the other Forms
    in the application. The Form Manager does not contain any controls and does not
    directly display any content.


    The Control class, which a Form inherits from, provides a mechanism for inter-control
    communication using the Control::SendUserEvent() method. This mechanism can be
    used by a Form to communicate with the Form Manager, to request the display of
    another Form within the application.

    This recipe contains the steps for creating the following:


    +   - FormMgr – which creates and manages the display of all the Forms within
    the application

    +   - MainForm – the main form of the application, which displays an icon list
    with icons numbered 1–9.

    +   - BaseForm – a common form, used to display a tab area with nine tabs, a title
    bar and a right soft key.


    When an icon is selected in the MainForm the appropriate BaseForm is displayed
    with corresponding number tab selected.'
