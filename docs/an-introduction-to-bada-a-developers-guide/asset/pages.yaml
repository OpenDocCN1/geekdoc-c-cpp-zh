- pgno: 132
  md: "In fact, the scenario is not just a C++ problem. One of the most recognisable\
    \ programming constructs in Objective C, on OS X for example, is two-phase object\
    \ construction:\n\n```\nid anObject = [[Rectangle alloc] init];\n```\n\nIf you\
    \ are familiar with the OS X idiom, or if you have programmed C++ apps on Symbian,\
    \ then the bada solution should be immediately recognisable.\n\nTwo-phase construction\
    \ is just the rule that object creation and memory allocation for its members\
    \ should be separated:\n\n```\nclass TwoPhaseClass\n{\npublic:\n    TwoPhaseClass(void)\
    \ : p1(null), p2(null)\n    {}\n    ~TwoPhaseClass(void)\n    {\n        delete\
    \ p1;\n        delete p2;\n    }\n\n    result Construct(void)\n    {\n      \
    \  p1 = new SimpleClass();\n        p2 = new SimpleClass(); // Out-of-memory error\
    \ occurs.\n    }\nprivate:\n    SimpleClass* p1;\n    SimpleClass* p2;\n};\n```\n\
    \nThen we have somewhere some method that instantiates an object of TwoPhaseClass\
    \ by using two-phase construction.\n\n```\nvoid AnyClass::SomeMethod()\n{\n  \
    \  TwoPhaseClass* pTwoPhaseClass = new TwoPhaseClass();\n    result r = pTwoPhaseClass.Construct();\n\
    }\n```\n\nBecause no memory for members is allocated during object creation, no\
    \ memory can be leaked. Instead, we allocate memory in the Construct() method.\
    \ If anything goes wrong an exception can be handled by querying the r variable\
    \ of type result.\n\nThe simple rule is that objects should be created in two\
    \ steps:\n\n+   1. Allocate:\n+      - Dynamically allocate memory for the new\
    \ object. This may include any simple value initialisation using initialisation\
    \ list syntax."
