  md: 'provided by prompts, alerts, messages and notifications based on the specific
    context of the moment.


    The MessageBox class is almost trivial to use, but is rather limited in the options
    it provides; in particular, only a small selection of preset buttons is provided:


    | MSGBOX_STYLE_NONE | Contains no buttons |

    | MSGBOX_STYLE_OK | Contains one button: OK |

    | MSGBOX_STYLE_CANCEL | Contains one button: CANCEL |

    | MSGBOX_STYLE_OKCANCEL | Contains two buttons: OK and CANCEL |

    | MSGBOX_STYLE_YESNO | Contains two buttons: YES and NO |

    | MSGBOX_STYLE_YESNOCANCEL | Contains three buttons: YES, NO, and CANCEL |

    | MSGBOX_STYLE_ABORTRETRYIGNORE | Contains three buttons: ABORT, RETRY, and IGNORE
    |

    | MSGBOX_STYLE_CANCELTRYCONTINUE | Contains three buttons: CANCEL, TRY, and CONTINUE
    |

    | MSGBOX_STYLE_RETRYCANCEL | Contains two buttons: RETRY and CANCEL |


    Where more flexibility is required, the Popup class enables a similar style of
    dynamic interaction using pop-up dialogs, and is fully customisable – but also
    requires explicit construction, initialisation, display, and cleanup. Pop-ups
    can also contain buttons, labels, and other simple controls to enable capturing
    a richer variety of user choices or selections.


    On the return of the ShowAndWait() method (which is a synchronous function), the
    result argument contains the result of the call.


    The following results are returned by a MessageBox:


    | MSGBOX_RESULT_CLOSE | The message box was closed |

    | MSGBOX_RESULT_OK | The OK button was selected |

    | MSGBOX_RESULT_CANCEL | The CANCEL button was selected |

    | MSGBOX_RESULT_YES | The YES button was selected |

    | MSGBOX_RESULT_NO | The NO button was selected |

    | MSGBOX_RESULT_ABORT | The ABORT button was selected |

    | MSGBOX_RESULT_TRY | The TRY button was selected |

    | MSGBOX_RESULT_RETRY | The RETRY button was selected |

    | MSGBOX_RESULT_IGNORE | The IGNORE button was selected |

    | MSGBOX_RESULT_CONTINUE | The CONTINUE button was selected |'
