- pgno: 340
  md: "The creation of the Web control and the registration of the listeners should\
    \ be done in the OnInitializing() method:\n\n+   1. Define the filename, the server\
    \ filepath for the file to be downloaded from, and the local filepath for the\
    \ file to be stored.\n+   2. Create a Web control and initialise it to the size\
    \ of the client area.\n+   3. Add the Web control to the MainForm.\n+   4. Register\
    \ the ILoadingListener.\n+   5. Register the IWebDownloadListener.\n\nThe following\
    \ code snippet is an example of code that would be added to the MainForm's OnInitializing()\
    \ method:\n\n```\nfileName.Append(L\"somefile\");\nserverFilePath.Append(L\"http://www.somewebsite.com/\"\
    );\nserverFilePath.Append(fileName);\n\nlocalFilePath.Append(L\"/Home/\");\nlocalFilePath.Append(fileName);\n\
    \n// Create web control and add to form\npWeb = new Web();\npWeb->Construct(GetClientAreaBounds());\n\
    AddControl(*pWeb);\n\n// Register loading & download listeners with the web control\n\
    pWeb->SetLoadingListener(this);\npWeb->SetDownloadListener(this);\n\n// Load the\
    \ URL\npWeb->LoadUrl(serverFilePath);\n```\n\nThe ILoadingListener interface class\
    \ provides several methods to monitor the events occurring during a loading operation.\
    \ This example only implements one of these methods: OnWebDataReceived(). The\
    \ OnWebDataReceived() method is called as soon as the first chunk of data is received\
    \ and notifies an application of the content type of the data to be downloaded.\n\
    \nIn this example, rather than the web engine handling the data, the application\
    \ handles the data itself. The OnWebDataReceived() method should return WEB_DECISION_DOWNLOAD,\
    \ so that the data is routed to the IWebDownloadListener registered by the application:\n\
    \n```\nOsp::Web::Controls::DecisionPolicy\nMainForm::OnWebDataReceived(const Osp::Base::String\
    \ &mime,\n    const Osp::Net::Http::HttpHeader &httpHeader)\n{\n    return WEB_DECISION_DOWNLOAD;\n\
    }\n```"
