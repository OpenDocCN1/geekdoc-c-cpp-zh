- pgno: 84
  md: '# Get Certification


    To get certification you need to go to the seller.samsungapps.com web site. There
    you can use the same account to log in as you used for the developer.bada.com
    portal in step 1. Once you are logged in the main screen is displayed, as shown
    in Figure 2.31.


    You start the submission process by clicking the Add New Application button at
    the top. Then the web site guides you step-by-step through the necessary tasks
    to submit your app for certification (see Figure 2.32).


    After you complete the process, your app is submitted for certification. The app
    is tested to ensure that it works functionally and non-functionally and that it
    meets quality standards (regarding usability, for instance). Our aim is to take
    no more than seven working days to do the QA and give you feedback.


    # Publish App


    When you have your app certified, it will be published for download. You set criteria
    such as price or geographic markets during the upload for certification process.
    All the apps can be accessed through the samsungapps.com web site or can be downloaded
    directly onto your bada phone. A handy way to manage your apps and downloads is
    the desktop software Samsung Kies, which you can also get from the Samsung Apps
    Store at samsungapps.com.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_84_0.png)'
