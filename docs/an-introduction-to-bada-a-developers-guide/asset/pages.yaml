- pgno: 242
  md: "Another use of bada exception handling takes effect when a method already returns\
    \ some other value or data type. In that case we cannot make use of the result\
    \ return type directly. For this case, bada offers the static method GetLastResult(),\
    \ which returns the last exception or the result set with the SetLastResult()\
    \ method. This value is unique per thread and persists until SetLastResult() is\
    \ called for that thread again. To get more expressive error messages the error\
    \ code held by the result type can be translated in statements which are predefined\
    \ in the bada SDK. The translation happens by invoking the static GetErrorMessage()\
    \ method, which returns a char*.\n\nTo show an example we stick to the Camera\
    \ class and present another method that already returns a type other than result.\
    \ The method is called GetSupportedPreviewResolutionListN(), which returns a list\
    \ of dimensions representing the supported camera resolutions. If null is returned,\
    \ an exception occurred. The method has the following signature:\n\n```\nOsp::Base::Collection::IList*\n\
    GetSupportedPreviewResolutionListN (void);\n```\n\nAn exception occurring within\
    \ this method can be handled by the GetLastResult() method, which we show in the\
    \ following code snippet:\n\n```\nresult r =E_SUCCESS;\n\n// Let's assume we have\
    \ a constructed pCamera object of type Camera*\nOsp::Base::Collection::IList*\
    \ pList = null;\n\npList = pCamera->GetSupportedPreviewResolutionListN();\nif\
    \ (pList == null)\n{\n    r = GetLastResult();\n    AppLog(\"Operation failed\
    \ with error: %s\", GetErrorMessage(r));\n    // Continue with further necessary\
    \ actions\n}\n```\n\nPredefined bada error codes are listed in Table R1.2 with\
    \ a description of when they are returned.\n\n# Table R1.2 bada error codes\n\n\
    | Error code | Description |\n|---|---|\n| E_ADDRESS_CHANGED | The network address\
    \ has been changed externally |\n| E_ALREADY_BOUND | The target is bounded to\
    \ another source |\n| E_ALREADY_CONNECTED | The target is connected to another\
    \ source |\n| E_ALREADY_OPENED | The target is already opened |"
