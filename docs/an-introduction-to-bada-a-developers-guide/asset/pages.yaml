- pgno: 143
  md: '# Text and Unicode


    Unicode is a universal character encoding that aims to support fonts for all living
    languages (and most dead ones too, not to mention some made-up ones) by providing
    codepoints for the individual characters of some 90 alphabets, scripts, ideographic,
    and hieroglyphic writing systems. The list of supported scripts includes everything
    from ASCII and Western Latin and non-Latin languages such as Greek and Cyrillic,
    all the way through the Semitic and Indic scripts and other scripts of the Indian
    subcontinent, to the ideographic character sets of the Far East, including Chinese,
    Japanese, and Korean hangul. Unicode is vast.


    Like most modern platforms, whether mobile or desktop, bada includes comprehensive
    Unicode support. Most importantly, bada supports multi-way conversion between
    the most common encoding schemes (many of which Unicode includes as subsets within
    its global character space), including those listed in Table 4.2.


    Table 4.2 Supported character encodings


    | Encoding scheme | Description |

    |---|---|

    | UTF-8 | The encoding used by XML, and therefore increasingly the standard for
    web-based textual resources |

    | Latin1 | Western alphabets, defined by ISO-8859-2 |

    | UCS2 | Alternative Unicode encoding |

    | ASCII | Standard single-byte text encoding |

    | GSM | GSM-specific character set and 7-bit encoding used in SMS messaging |


    Encoding and decoding between different schemes can either be done per String
    (or per ByteBuffer or MCharBuffer) using a GetBytes() or GetChars() method of
    the encoded string, or by constructing an Encoder or Decoder object, which you
    should do for large blocks of text or where you have sequential data, for example
    if you are reading text in from an external source. Natively, all character strings
    in bada are UTF-8 by default.


    You can query a device for supported encodings with the method:


    ```

    IList* Encoding::GetAvailableEncodingsN(void)

    ```


    And you can query for the encoding of a text string with:


    ```

    Encoding* Encoding::GetEncodingN(const String &encodingType)

    ```'
