- pgno: 248
  md: 'Namespaces used:

    N/A


    Header files to #include:

    N/A


    Required libraries:

    N/A


    Required privilege level:

    Normal


    Required privilege groups:

    None


    The content of this recipe is not related to any specific namespace. What we present
    here is rather a generally valid concept that describes a way of constructing
    and destroying objects in bada that avoids memory leaks. This speciality of bada
    is related to the way exceptions are handled in bada, which was described in the
    recipe ‘Use Error Handling in bada’. In order to optimise runtime efficiency,
    bada does not support standard C++ exception handling. Instead, exceptions are
    handled by using the specific result type, which serves as a return value. For
    constructing objects you need to use the constructor of a class. A constructor,
    however, does not provide a return value. The other possibility would be to throw
    an exception within the constructor. As bada does not support C++ standard exception
    handling this is also not possible. So, to circumvent this situation and still
    comply with the design goal of optimised runtime efficiency the two-phase construction
    concept of bada is used.


    This concept defines that the object construction is broken down into two phases:


    +   1. Object creation with the class constructor, where no memory allocation
    for the various members happens – so an exceptional condition would not result
    in the risk of a memory leak.

    +   2. Object construction with an additional Construct() method, in which the
    memory allocation actually happens. This Construct() method provides a result
    return value that can be queried for exceptions.


    For the destruction of an object, a class destructor can be used that follows
    traditional C++ conventions. The following code example should help to clarify
    this two-phase construction concept:'
  merge: -1
  img_proc: true
- pgno: 249
  md: "```\nresult r = B_SUCCESS;\n\n// 1. Phase: create object;\nPopup* pPopup =\
    \ new Popup();\n\n// 2. Phase: construct object (allocations):\nr = pPopup->Construct(true,\
    \ Dimension(400, 500));\n\n// Exception handling:\nif (IsFailed(r))\n{\n    AppLog(\"\
    Operation failed with error: %s\", GetErrorMessage(r));\n    delete pPopup;\n\
    \    // Process error condition ...\n}\n```\n\nMost of the bada SDK follows this\
    \ pattern. You are free to implement your object construction as you like. It\
    \ is, however, highly recommended to follow this two-phase construction patterns\
    \ in your classes – for obvious reasons.\n\nWe show now how you can simply implement\
    \ this two-phase construction concept in your classes. First we define a header\
    \ file called MyOwnClass.h, which holds the standard constructor and destructor\
    \ but in addition also has the Construct() method and for demonstration purposes\
    \ the two members Osp::Ui::Controls::Button* pButton and Osp::Base::String* myString.\
    \ We also define the public interface GetString(), which allows the caller to\
    \ access the String stored in the member myString.\n\n```\n#include <FBase.h>\n\
    #include <FUi.h>\nclass MyOwnClass\n{\npublic:\n    // Standard constructor\n\
    \    MyOwnClass();\n\n    // Standard destructor\n    virtual ~MyOwnClass();\n\
    \n    // The actual construction\n    result Construct(Osp::Base::String s);\n\
    \nprivate:\n    // Some member objects\n    Osp::Ui::Controls::Button* pButton;\n\
    \    Osp::Base::String* myString;\n\npublic:\n    Osp::Base::String* GetString();\n\
    };\n```"
