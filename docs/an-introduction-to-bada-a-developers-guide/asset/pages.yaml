  md: 'In this recipe, the `GetCanvasN()` method is used in the `OnDraw()` method
    to retrieve the `MainForm`''s canvas. To prevent memory leaks, if a method has
    an ''N'' postfix, the caller must delete the returned instance after they have
    finished with the instance.


