- pgno: 286
  md: '# Hints, Pitfalls, and Related Topics


    The example shown in this recipe has a two-level fixed structure for the Option
    menu’s menu hierarchy. It is also possible to dynamically add, change, and delete
    items during runtime. If you want to change the content of the Option menu, there
    are several methods that can be used to add, change, and delete both main items
    and sub-items. These methods are: `AddItem()`, `AddSubItem()`, `SetItemAt()`,
    `SetSubItemAt()`, `RemoveItem()`, and `RemoveSubItem()`.


    If you need to determine if there are any sub-items associated with a main item,
    and how many there are, you can use the `GetSubItemCount()` method.


    In the example, the first main item in the menu (`ID_OPTION1`) has sub-items associated
    with it. In this scenario no code needs to be implemented in the `OnActionPerformed()`
    event handler for this action ID, as the display of the sub-items is automatically
    performed by the Option menu object. But, if there is code for this action ID
    in the `OnActionPerformed()` event handler, it will get executed after the sub-items
    are displayed.


    When a sub-item, or main item with no associated sub-item is selected by the user,
    the Option menu object will generate the appropriate event for the form to handle
    and the menu will be removed from the display.


    Because of the way in which the Option menu is removed from the display when it
    has no sub-items to display, dynamically creating any sub-items for a main item
    on selection of that main item is not recommended.


    If the item’s text string is too long, it will be truncated when displayed:


    +   - A main item will be truncated at two lines of text (in English) and ‘…’
    will be added to the end of the string.

    +   - A sub-item will be truncated at one line of text (in English) and ‘…’ will
    be added to the end of the string.


