- pgno: 334
  md: "```\nstatic const int ID_SOFTKEY_RIGHT = 102;\n\nOsp::Ui::KeyCode prevKeyCode;\n\
    Osp::Ui::KeyState prevKeyState;\n\npublic:\n    result OnInitializing(void);\n\
    \    result OnTerminating(void);\n\n    void OnActionPerformed(const Osp::Ui::Control&\
    \ source,\n        int actionId);\n\n    void OnKeyPressed (const Osp::Ui::Control\
    \ &source,\n        Osp::Ui::KeyCode keyCode);\n    void OnKeyReleased (const\
    \ Osp::Ui::Control &source,\n        Osp::Ui::KeyCode keyCode);\n    void OnKeyLongPressed\
    \ (const Osp::Ui::Control &source,\n        Osp::Ui::KeyCode keyCode);\n};\n```\n\
    \nTo receive key events the MainForm must register the key event listener in the\
    \ OnInitializing() method, using the AddKeyEventListener() method:\n\n```\n//\
    \ Register MainForm with key event listener\nAddKeyEventListener(*this);\n```\n\
    \nTo handle the key events when they occur the following methods must be implemented\
    \ by the MainForm: OnKeyPressed(), OnKeyReleased(), and OnKeyLongPressed(). Each\
    \ method is passed information about the source of the event and the key code\
    \ of the hard key the event is related to.\n\nThe following code snippets show\
    \ examples of these methods:\n\n```\nvoid\nMainForm::OnKeyPressed(const Control\
    \ &source,\n    Osp::Ui::KeyCode keyCode)\n{\n    switch(keyCode)\n    {\n   \
    \ case Osp::Ui::KEY_SIDE_UP:\n        AppLog(\"Side key up pressed \\n\");\n \
    \       break;\n    case Osp::Ui::KEY_SIDE_DOWN:\n        AppLog(\"Side key down\
    \ pressed \\n\");\n        break;\n    case Osp::Ui::KEY_CAMERA:\n        AppLog(\"\
    Camera key pressed \\n\");\n        break;\n    case Osp::Ui::KEY_SWITCH:\n  \
    \      AppLog(\"Task switcher key pressed \\n\");\n        break;\n    default:\n\
    \        AppLog(\"Invalid key pressed \\n\");\n        break;\n    }\n    prevKeyCode\
    \ = keyCode;\n    prevKeyState = KEY_PRESSED;\n```"
