    # Recipe 2.9: Create a Custom List Control


    # Problem Description


    You want to create a custom list control.


    # The Recipe


    The following configuration is required for this recipe:


    | Configuration | Value |

    |---|---|

    | **Namespaces used:** | `Osp::Ui, Osp::Ui::Controls, Osp::Base::Collection, Osp::Media`
    |

    | **Header files to #include:** | `FUi.h, FUiControls.h, FBase.h, FMedia.h` |

    | **Required libraries:** | `FUi, FUiControls, FBase, FMedia` |

    | **Required privilege level:** | `Normal` |

    | **Required privilege groups:** | `IMAGE` |


    A CustomList is a special type of list with which the developer can configure
    the style and appearance of all the items in the list. Each item in a CustomList
    is composed of elements that can be text, bitmaps or custom drawings,'
  merge: -1
  img_proc: true
- pgno: 315
  md: 'and are represented by CustomListItem objects. The format of any CustomListItem
    object is defined using the CustomListItemFormat class.


    Custom drawings can be created and used by the CustomListItem, by implementing
    an object using the Osp::Ui::Controls::ICustomListElement interface class.


    When an item in a custom list is selected or deselected, an item event is generated.
    In order to process these events the Osp::Ui::ICustomItemEventListener must be
    implemented.


    This recipe details the steps to create a custom list and its items, and provides
    some sample code snippets. This recipe assumes the steps detailed in the recipe
    ‘Add a Form to a Frame-based App’ have been followed to add a Form to the Application’s
    Frame.


    In this recipe two different custom list formats are created: the first contains
    a picture element and three text elements and the second contains a picture element,
    a text element and a custom drawing element.


    A custom list is then created, with an item using each of the custom list format
    types (see Figure R2.11).


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_315_0.png)


    **Figure R2.11** Custom List control.'
