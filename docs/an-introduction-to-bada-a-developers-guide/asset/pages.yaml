  md: '# Privileges Required:


    To manipulate content on the device or server requires the following privilege
    groups to be set:


    | Privilege group | Privilege level | Description |

    |---|---|---|

    | LOCAL_CONTENT | NORMAL | Handling device content |

    | CONTENT_TRANSFER | SYSTEM | Uploading and downloading content to and from a
    server |

    | REMOTE_CONTENT | SYSTEM | Manipulating content on a server |


    # Prerequisites:


    To manipulate remote content developers will need an account on the bada Server.
    While the information about the remote content is stored on the bada Server, the
    physical content is stored on an Amazon S3 workspace, which you will need to set
    up and link to your application. You can set up the Amazon workspace from the
    Application Manager on the bada developer site, developer.bada.com, in the ‘Set
    Up Components’ section.


    # Summary


    Selected important classes:


    +   - ContentInfo

    +   - ContentManager

    +   - ContentSearch


    The Content namespace contains classes and methods that are used to search and
    manage content both locally on the device and remotely on the server. Content
    is the logical representation of various media types, including images, audio,
    and video, containing meta information such as date and time captured, GPS information,
    description, and the location of the actual content itself. This information can
    be used to search for content using an SQL-like syntax.


    Creating, reading, updating, and deleting content is handled by the ContentManager
    and RemoteContentManager classes. Information in the content database on the device
    is accessed through specialised classes deriving from ContentInfo: AudioContentInfo,
    ImageContentInfo, and Video ContentInfo all of which contain information about
    their particular media types, while OtherContentInfo is used to represent content
    such as PDFs.


    As shown in Figure 6.8, these classes are used to hold content information returned
    by these searches.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_193_0.png)


    Figure 6.8 The classes responsible for managing and searching for Osp::Content
    on a bada device.


    Content searches on the device and server are provided by the ContentSearch and
    RemoteContentSearch classes. Local searches return items deriving from ContentInfo,
    while remote searches return information in the more flexible RemoteContentSearch
    class, as shown in Figure 6.9. Once you have the content, use Osp::Media::Player
    to play it, in the case of audio and video, or for an image, use Osp::Media::Image
    to decode it into a bitmap and the Osp::Graphics::Canvas to draw the bitmap using
    the information in ContentInfo.


    The Content namespace also provides classes to transfer content between the device
    and the bada Server, useful for sharing information in social networking applications,
    backing up content, or syncing it with the cloud. The functionality for uploading
    and downloading content to and from a server is provided by the ContentTransfer
    class.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_193_1.png)


    Figure 6.9 Content can also be stored and managed remotely using the bada Server.'
