- pgno: 345
  md: "A user can interact with their bada device using a variety of different gestures\
    \ (motion UI) and can rotate the display so that the orientation of the application\
    \ changes. This recipe details the steps to enable motion and orientation control\
    \ within an application and describes the code that needs to be implemented for\
    \ the Form to receive and handle motion and orientation changed events.\n\nThe\
    \ three types of motion events supported are:\n\n+   - Double-tap: Occurs when\
    \ any part of the device is tapped twice. Tapping uses the acceleration sensor,\
    \ so any part of the device can be tapped, including the screen.\n+   - Shake:\
    \ Occurs when the device is quickly moved back and forth multiple times. Shake\
    \ can last a long time. To accurately capture this behaviour, both the start and\
    \ the end of shake are reported as two separate events.\n+   - Snap: Occurs when\
    \ the device is moved along one axis and back.\n\nThis recipe assumes the steps\
    \ detailed in the recipe ‘Add a Form to a Frame-based App’ (which you can find\
    \ in the second group of recipes, “UI Basics”) have been followed to add a Form\
    \ to the application’s Frame.\n\nIn this recipe a Flash animation is created and\
    \ played on the display. The user can control the state of the animation, the\
    \ visibility, and the size and position of the animation by using motion events.\n\
    \nAs shown in the ‘Add a Form to a Frame-based App’ recipe, the MainForm class\
    \ is inherited from the Form base class. For this form to handle motion and orientation\
    \ events the motion and orientation event listener interfaces have to be implemented.\
    \ So in this recipe the MainForm class must implement the Osp::Ui::IMotionEventListener\
    \ and the Osp::Ui::IOrientationEventListener interface classes.\n\nThe following\
    \ code snippet shows an example of the MainForm class definition:\n\n```\nclass\
    \ MainForm :\n    public Osp::Ui::Controls::Form,\n    public Osp::Ui::IMotionEventListener,\n\
    \    public Osp::Ui::IOrientationEventListener\n{\npublic:\n    MainForm(void);\n\
    \    ~MainForm(void);\n    bool Initialize(void);\n\nprotected:\n    Osp::Ui::Motion*\
    \ pMotion;\n\npublic:\n    Osp::Ui::Controls::Flash* pFlash;\n\n    result OnInitializing(void);\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 346
  md: "```\nresult OnTerminating(void);\n\nvoid OnShakeDetected(Osp::Uix::MotionState\
    \ motionState);\nvoid OnDoubleTapDetected(void);\nvoid OnSnapDetected(Osp::Uix::MotionSnapType\
    \ snapType);\n\nvoid OnOrientationChanged(const Osp::UI::Control &source,\n  \
    \  OrientationStatus orientationStatus);\n);\n```\n\nThe creation of the Flash\
    \ animation, the enabling of motion and orientation support, and the registration\
    \ of the motion and orientation event listeners should be performed in the OnInitializing()\
    \ method:\n\n+   1. Create a motion object.\n+   2. Initialise the motion object\
    \ with the associated listener.\n+   3. Set the types of motion to be enabled\
    \ (e.g. double-tap, shake and snap).\n+   4. Create a Flash object.\n+   5. Construct\
    \ the Flash object: set the size and position of the control, the style of Flash\
    \ playback and the filename and path of the SWF file.\n+   6. Add the Flash control\
    \ to the MainForm.\n+   7. Set the orientation of the MainForm (e.g. four-directional\
    \ orientation style).\n+   8. Draw the MainForm.\n\nThe following code snippet\
    \ is an example of code that would be added to the MainForm's OnInitializing()\
    \ method:\n\n```\n// Create Motion instance and set to detect all types of events\n\
    pMotion = new Motion();\npMotion->Construct(*this);\npMotion->SetEnabled(MOTION_TYPE_DOUBLE_TAP|MOTION_TYPE_SHAKE|\n\
    \    MOTION_TYPE_SNAP);\n\n// Create new Flash object\npFlash = new Flash();\n\
    pFlash->Construct(Rectangle(40, 40, 400, 400),\n    FLASH_STYLE_PLAY_WITHOUT_FOCUS,\n\
    \    String(L\"/Res/Bada.swf\"));\n\n// Add flash object to form\nAddControl(*pFlash);\n\
    \n// Set Orientation of the form\nSetOrientation(ORIENTATION_AUTOMATIC_FOUR_DIRECTION);\n\
    \n// Register Orientation listener\nAddOrientationEventListener(*this);\n\n//\
    \ Draw the controls\nDraw();\nShow();\n```"
  merge: -1
  img_proc: true
- pgno: 347
  md: "In order to start the flash animation playback the Flash control’s Play() method\
    \ must be called. If immediate playback is required in an application, the Flash\
    \ control’s Play() method should be called after the application has entered the\
    \ Foreground state. In a simple application, this can be achieved by calling the\
    \ Flash control’s Play() method in the application’s OnForeground() method. If\
    \ immediate playback is not required, the Flash control’s Play() method can be\
    \ called by the MainForm when a user or system event is handled.\n\nThe following\
    \ code snippet is an example of code that would be added to the application’s\
    \ OnForeground() method, in order to start playing the Flash control:\n\n```\n\
    Frame *pFrame = GetAppFrame()->GetFrame();\nMainForm *pForm = static_cast<MainForm*>(pFrame->GetCurrentForm());\n\
    \npForm->pFlash->Play();\n```\n\nShake motions are reported to the application\
    \ in the IMotionEventListener::OnShakeDetected() method. In this recipe the shake\
    \ motion is used to pause or resume the Flash animation. When the MOTION_ENDED\
    \ notification is received the animation is paused or resumed, depending on the\
    \ current animation status:\n\n```\nvoid\nMainForm::OnShakeDetected(Osp::UiX::MotionState\
    \ motionState)\n{\n    switch (motionState)\n    {\n    case MOTION_STARTED:\n\
    \        AppLog(\"OnShakeDetected: Motion started\\n\");\n        break;\n   \
    \ case MOTION_INPROGRESS:\n        AppLog(\"OnShakeDetected: Motion in progress\\\
    n\");\n        break;\n    case MOTION_ENDED:\n    {\n        AppLog(\"OnShakeDetected:\
    \ Motion ended\\n\");\n        if(pFlash->GetStatus() == FLASH_PLAYING)\n    \
    \        pFlash->Pause();\n        else if(pFlash->GetStatus() == FLASH_PAUSED)\n\
    \            pFlash->Resume();\n    }\n        break;\n    default:\n        break;\n\
    \    }\n    RequestRedraw();\n}\n```\n\nDouble-tap motions are reported to the\
    \ application in the IMotionEventListener::OnDoubleTapDetected() method. In this\
    \ recipe the double-tap motion is used to show or hide the flash animation. When\
    \ this event is received the flash control is either shown or hidden, depending\
    \ on the current state:"
  merge: -1
  img_proc: true
- pgno: 348
  md: "```\nvoid\nMainForm::OnDoubleTapDetected(void)\n{\n    if(pFlash->GetShowState()\
    \ == true)\n        pFlash->SetShowState(false);\n    else\n        pFlash->SetShowState(true);\n\
    \n    RequestRedraw();\n}\n```\n\nSnap motions are reported to the application\
    \ in the IMotionEventListener::OnSnapDetected() method. In this recipe the snap\
    \ motion is used to move or change the size of the Flash animation on the display.\n\
    \nWhen the snap event is received the snapType parameter is checked to determine\
    \ the plane in which the snap motion has been made:\n\n+   - If the device has\
    \ been moved in the x-plane, the flash animation’s x-coordinate is either incremented\
    \ or decremented by 20 pixels, depending on the direction (positive or negative)\
    \ of the snap motion.\n+   - If the device has been moved in the y-plane, the\
    \ flash animation’s y-coordinate is either incremented or decremented by 20 pixels,\
    \ depending on the direction (positive or negative) of the snap motion.\n+   -\
    \ If the device has been moved in the z-plane, the flash animation’s size is either\
    \ incremented or decremented by 20 pixels, depending on the direction (positive\
    \ or negative) of the snap motion.\n\n```\nvoid\nMainForm::OnSnapDetected(Osp::Uiix::MotionSnapType\
    \ snapType)\n{\n    Point currentPosition = pFlash->GetPosition();\n    Dimension\
    \ currentSize = pFlash->GetSize();\n    switch(snapType)\n    {\n    case MOTION_SNAP_X_POSITIVE:\n\
    \        pFlash->SetPosition(Point(currentPosition.x+20,\n            currentPosition.y));\n\
    \        break;\n    case MOTION_SNAP_X_NEGATIVE:\n        pFlash->SetPosition(Point(currentPosition.x-20,\n\
    \            currentPosition.y));\n        break;\n    case MOTION_SNAP_Y_POSITIVE:\n\
    \        pFlash->SetPosition(Point(currentPosition.x,\n            currentPosition.y+20));\n\
    \        break;\n    case MOTION_SNAP_Y_NEGATIVE:\n        pFlash->SetPosition(Point(currentPosition.x,\n\
    \            currentPosition.y-20));\n        break;\n    case MOTION_SNAP_Z_POSITIVE:\n\
    \        pFlash->SetSize(Dimension(currentSize.width+20,\n            currentSize.height+20));\n\
    \        break;\n```"
