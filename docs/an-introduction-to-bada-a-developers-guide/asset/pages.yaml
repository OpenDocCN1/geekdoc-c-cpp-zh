- pgno: 374
  md: 'The image decoding and display of the bitmap can be performed in the MainForm''s
    OnDraw() method:


    +   1. Retrieve the window canvas.

    +   2. Create and initialise an Image object.

    +   3. Decode the specified image file into the bitmap container, specifying the
    bitmap pixel format.

    +   4. Draw the decoded bitmap on the canvas at the position set using a Point
    object.


    The following code snippet is an example of code that would be added to the OnDraw()
    method. To create a canvas decode the image to a bitmap container and draw it
    on the screen:


    ```

    // Get the window canvas

    Canvas* pCanvas = GetCanvasN();


    // Create image object

    pImage = new Image();

    pImage->Construct();


    // Decode image file into bitmap container

    pBmp = pImage->DecodeN(String(L"/Media/Images/img1.jpg"),

    BITMAP_PIXEL_FORMAT_ARGB8888);


    // Draw the bitmap

    pCanvas->DrawBitmap(Point(10, 400), * pBmp);


    // Delete canvas

    delete pCanvas;

    ```


    # Hints, Pitfalls, and Related Topics


    Although the Image class''s EncodeToFile() method will create a valid file in
    the filesystem, it is not visible to the user in the /My files/Images/ folder
    unless the ContentManager class is used to create a file in the content database.


    The LOCAL_CONTENT group privilege must be set in the application''s manifest file
    in order to use the functionality of the ContentManager class.


    The IMAGE group privilege must be set in the application''s manifest file in order
    to use the functionality of the Image class.


    In this recipe, the GetCanvasN() and the DecodeN() methods are used in the OnDraw()
    method. Both these methods have an ''N'' postfix, so to prevent memory leaks the
    caller must delete the returned instance after they are finished with the instance.


    # Related Recipe


    +   - Add a Form to a Frame-based App'
