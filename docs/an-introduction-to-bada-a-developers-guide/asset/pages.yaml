- pgno: 36
  md: 'Mobile applications are also used differently from their desktop equivalents.
    If you are mobile and want to find information about what is showing at the local
    cinema, or a review of a particular restaurant, you want to find that specific
    information quickly and don’t want to spend time searching through information
    you don’t need. Your attention span for using the application is limited, so you
    want to be presented with location-specific information. You might also be trying
    to find directions, using the mobile in sunlight, or somewhere with a lot of background
    noise, all environmental factors that need to be considered.


    # 1.2.3 Differences in the Ecosystem


    Users expect to be able to find and download the software they want using their
    device when they’re on the move. Users should be served following a *wish and
    use* notion. When users wish to satisfy a current need they should be able to
    get and use corresponding information or services as fast and simply as possible.
    They want the purchasing and installation process to be simple, which is where
    a central one-stop-shop such as the Samsung Apps store comes in. Developers distribute
    their applications via Samsung Apps, one central location from which users of
    bada devices can purchase and download apps and make in-app purchases. One side-effect
    of this approach is that the network operator no longer plays the ‘gatekeeper’
    role to their devices; the user can freely decide which apps to install.


    The lifetime and the time to market of a mobile app are substantially shorter
    than traditional software products and developers need to adapt. By having a central
    distribution system such as Samsung Apps, the developer can concentrate on creating
    and marketing their application in the knowledge that the distribution, purchasing,
    and revenue sharing model will be taken care of by the Samsung Apps store.


    This simplified model of application distribution also has other advantages. Users
    can be sure that applications will be independently tested and comply with a certain
    quality standard, will respect the integrity of the user’s data, and won’t spend
    their money on phone and data calls without asking.


    A further positive side-effect of the app store model is that costs for users
    become much more transparent. Network operators have recognised this trend and
    come up with contract bundles that offer data rates or voice packages in order
    to encourage the download of apps from stores. In the past, complex and non-transparent
    cost models discouraged users from using mobile services or downloading mobile
    apps because they feared exaggerated costs. With new all-inclusive pricing, downloading
    apps and invoking mobile services has become much more user-friendly and thus
    accepted.


    The bada platform in combination with Samsung Apps represents an ecosystem that
    addresses, exploits, and, in fact, shapes some of the differences that we have
    outlined in this chapter. Figure 1.1 summarises what the bada ecosystem stands
    for.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_37_0.png)


    **Figure 1.1** The bada ecosystem.


    At one end of the chain are the developers or application providers who want to
    develop applications. At the other end are the users or customers who want to
    use mobile apps. Along this chain Samsung provides three core building blocks
    that foster the bada ecosystem. Central to it is the bada platform, which is the
    execution environment deployed on mobile handsets. This platform not only covers
    the mobile part but also allows seamless access to the bada Server as you will
    find out later in Chapter 5. Powerful and well-abstracted APIs are exposed as
    an open SDK to developers. In addition to that, the left block in Figure 1.1 covers
    a large number and variety of technical support resources, such as training material,
    tutorials, sample code, tech blogs, videos, and the API reference documentation.
    The right block is the application store Samsung Apps that allows you to certify
    and publish your apps. Once your app is ready for publication, you can decide
    if – via the store – you want to sell your app or give it away for free, or however
    else you want to become rich and famous.


    # 1.3 Mobile App Development Best-Practices


    We argued that mobile apps have some specific characteristics that make them different
    from conventional software. Mobile markets are also different and develop at a
    faster pace. Hence, in order to create successful mobile solutions or applications,
    we recommend deploying some best-practices during development. In the appendix
    we provide an example of a full software engineering process for mobile applications.


    Of course, you can follow any process you prefer or develop your software without
    following any process at all. There is a range, from strict waterfall model to
    cowboy coding. As a rule of thumb the more complex a project is and the more coordination
    it requires, the more formalisation is advisable in terms'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'of processes. Experience has shown that so-called agile software development
    processes are very appropriate for fast-paced software, which mobile apps definitely
    are.


    In the agile manifesto³ software engineering experts have summarised the key factors
    that should help to produce better software faster and more reliably. They state
    that agile development is about *focus on result*. This means executable software
    should be built as soon as possible, which is the primary measure of progress.
    Software should be built *incrementally* starting from its core functions over
    various *iterations*. Tool and process support is relevant but must be *appropriate*
    to the solution in order to avoid unnecessary overhead. Finally software engineering
    is about people working together. Hence, *communication* – ideally in a face-to-face
    and spoken way – is at the core of agile development. This not only refers to
    the project team but also, and just as importantly, to the stakeholders, clients,
    and future end-users.


    In line with this, we would like to add to this recommendation an emphasis on
    using as much *prototyping* and *diverse testing* as possible throughout the whole
    development, where both are integral parts of and inherently supported by the
    bada platform and its development tools. Prototypes can be exploited in nearly
    any phase during the development of mobile software solutions. They are primarily
    helpful for eliciting requirements or to get a common understanding with various
    stakeholders early in the project. Testing certainly is not unique to mobile software
    engineering but must be treated and executed differently in mobile development.
    This is an effect of various issues related to mobile software such as the heterogeneity
    of hardware and devices, the dependence on context factors that are difficult
    to test on simulators (e.g. geographic locations), and the phenomenon of the discrepancy
    between simulator and real device behaviour.


    The bada toolkit provides means to support both. First, the UI Builder, which
    is integrated into the bada IDE, allows building simple mock-up prototypes easily
    and quickly. Developers can use this WYSIWYG tool to create first ‘clickable’
    demos by visually placing a variety of UI controls on the device screen. A second
    convenient tool is the Event Injector that comes with the bada Simulator. This
    is useful for simulating a broad variety of context data. Incoming calls, text
    messages, and battery level can be tested, as well as location and sensors, including
    acceleration, tilt, compass, and proximity. It is always difficult to test mobile
    apps in a simulator because obviously you are missing all the context data, which
    is so necessary. By far the more expensive and complex type of test is deployment
    on real devices and test-runs in the real-world context. With the bada Event Injector
    (see Figure 1.2), a lot of this effort can be shifted to Simulator tests, making
    system tests less time consuming and cheaper.'
  merge: -1
  img_proc: true
- pgno: 39
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_39_0.png)


    # Figure 1.2 The bada Event Injector.


    But let us return to the ideas postulated by the agile manifesto. Often, ‘agile’
    is misused to describe everything that does not have clear rules or a process.
    We would rather call this ‘cowboy coding’. Agile cannot be equated to chaos, or
    lack of rules or discipline. Agile app development does propose following some
    simple maxims and recommendations.


    So, let us describe some rules. We do so by listing a toolbox of some best-practices
    coming from various agile methodologies such as Scrum, Test-driven Development,
    eXtreme Programming, and Crystal. Again, the core cornerstones are focus on results,
    incremental iterations, appropriateness of the means, and communication. The following
    best-practice recommendations all deal with one or more of these cornerstones:


    +   - Focus on results more than on processes. Every procedure or means that does
    not help to achieve the goal of the software project should be cut off. The more
    complex a project, the more tools, rules, and formalisms it will require.

    +   - Plan your software development into cycles or iterations. Identify the core
    and most critical components and priorities, and start with the most important
    ones (‘first things first’).'
  merge: -1
  img_proc: true
- pgno: 40
  md: '+   - Be tolerant towards change (changing requirements and change requests).
    Avoid rigid or inflexible structures, processes, tools, or methods.

    +   - Try to produce executable software at the end of every iteration.

    +   - Treat each iteration as an increment to the final software product.

    +   - Try to keep design and software simple. Have possible extensions in mind
    but focus on producing executable code at least at the end of each iteration (‘keep
    it short and simple – KISS’).

    +   - Make use of early feedback from various stakeholders, such as your client
    or end-users. User acceptance tests could possibly be integrated into every iteration.

    +   - In the early stages, even use paper and pen to sketch software designs or
    early prototypes.

    +   - Make use of a test-oriented development where you write the test cases first,
    at least for core or critical code parts.

    +   - Build and integrate tested parts frequently (e.g. daily).

    +   - Set up communication channels such that close contact with client and end-users
    is possible.

    +   - Try to have regular, frequent, and brief intra-team communication without
    a formal overhead (e.g. daily stand-up meetings).

    +   - Establish and publish team and project rules – such as a communication etiquette
    or coding standards.

    +   - Conduct code reviews or pair programming sessions for core or critical code
    parts.

    +   - Make sure you have efficient knowledge transfer within the team but also
    to client and user. This may not always be applicable or sensible. Sometimes this
    knowledge transfer may also be unidirectional.

    +   - Use visualisation for your communication. Use, for instance, a visible whiteboard
    accessible to everyone in the team for sketching the tasks or features, and development
    progress.

    +   - Although some form of documentation is necessary, keep it to a minimum:
    only as much as is necessary. And beware of over-specification.


    Again, please bear in mind that you do not have to stick to the mobile software
    engineering best-practices outlined here. This is simply advice and something
    you can stick to.'
  merge: -1
  img_proc: true
