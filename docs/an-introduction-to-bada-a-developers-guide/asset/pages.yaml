- pgno: 188
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_188_0.png)


    # Figure 6.5 Collections deriving from ICollection and related classes.


    From the Collection classes shown in Figure 6.5, you just need to choose an appropriate
    collection class to match the way you want to manage your data. Stack and Queue
    are simple collections of objects organised in last in, first out (LIFO) order
    and first in, first out (FIFO) order respectively. ArrayList and LinkedList implement
    a list of objects that can be accessed by index, whereas HashMap and MultiMap
    manage a list of key/value pairs, represented by MapEntry. You can iterate through
    the elements in both of these collections, to perform an operation on each element,
    for example, by using the IEnumerator derived class returned by the GetEnumeratorN()
    method of the collection you’re using.


    > Note: ArrayList and LinkedList are used in the same way, but the implementation
    of each class is subtly different. ArrayList items are stored in a contiguous
    area of memory, making accessing the list faster, but adding elements slower than
    a LinkedList because the entire block of memory may need to be resized as a new
    item is added. The LinkedList is slower to access, but faster to resize. So if
    you have a fixed list and you don’t plan on adding or removing items frequently,
    choose an ArrayList. If the number of items in the list is likely to change more
    often, use a LinkedList.


    IComparer derived classes can also be used to Sort() the list in the case of ArrayList
    and LinkedList, or for key comparison for key/value pair'
