  md: "```\n{\n    return false;\n}\nlong interval = 0;\n\n// Activate the sensor\
    \ type SENSOR_TYPE_MAGNETIC\nr = sensorMgr.GetMinInterval(SENSOR_TYPE_MAGNETIC,\
    \ interval);\nif(IsFailed(r))\n{\n    return false;\n}\nif (interval < 50)\n{\n\
    \    interval = 50;\n}\n// Register our listener to this sensor\nr = sensorMgr.AddSensorListener(*this,\
    \ SENSOR_TYPE_MAGNETIC, interval, false);\nif(IsFailed(r))\n{\n    return false;\n\
    }\n\nreturn true;\n}\n\nbool\nUnRegisterSensor()\n{\n    result r = E_SUCCESS;\n\
    \n    // Deactivate our compass sensor\n    r = sensorMgr.RemoveSensorListener(*this);\n\
    \    if(IsFailed(r))\n    {\n        return false;\n    }\n    return true;\n\
    }\n```\n\nIn the body of the overwritten OnDataReceived() method we get the X,\
    \ Y, and Z values and can process them as needed. In this example we simply calculate\
    \ the 3D vector of the Earth’s magnetic field (assuming that there are no other\
    \ sources of severe interference). For this purpose we have defined a member of\
    \ type float called magField into which we store the length of this vector.\n\n\
    ```\nVoid\nOnDataReceived(Osp::UiX::SensorType sensorType, Osp::UiX::SensorData&\n\
    sensorData, result r)\n{\n    float x=0, y=0, z=0;\n\n    AppLog(\"DataReceived:\
    \ Get Magnetic Sensor Data\");\n```"
  merge: -1
  img_proc: true
- pgno: 354
  md: "```\nsensorData.GetValue({SensorDataKey}MAGNETIC_DATA_KEY_X, x);\nsensorData.GetValue({SensorDataKey}MAGNETIC_DATA_KEY_Y,\
    \ y);\nsensorData.GetValue({SensorDataKey}MAGNETIC_DATA_KEY_Z, z);\n\n// Calculate\
    \ the length of our vector determined by the three axis\nmagField = Math::Sqrt((Math::Pow(x,2)+\
    \ Math::Pow(y,2)+\nMath::Pow(z,2)));\n}\n```\n\n# Hints, Pitfalls, and Related\
    \ Topics\n\nOnce your code compiles without errors, you can run it in the Simulator.\
    \ A very convenient feature of the bada Simulator is the Event Injector tool.\
    \ To get this, right-click the Simulator screen, select the Event Injector, and\
    \ choose the Sensors tab. In the row below choose the Magnetic tab. There you\
    \ can freely choose the μT values per X, Y, and Z axis. Click on the Send button\
    \ to send these as events to your application running on the bada Simulator. This\
    \ tool is very useful for testing.\n\nFor some use-cases you might be interested\
    \ in getting the angle between two vectors. The following code snippet should\
    \ help:\n\n```\nfloat\nCalculateAngle(float f1, float f2)\n{\n    float angle\
    \ = 0;\n    // angle in rad\n    if (f1==0 && f2==0){\n        angle = 0;\n  \
    \      return angle;\n    }else{\n        angle = Math::Asin(f1 / Math::Sqrt((Math::Pow(f1,2)\
    \ +\n        Math::Pow(f2,2))));\n    }\n    return angle;\n}\n```\n\nThe SDK\
    \ calculates the angle in rad. For converting this into degrees you may find the\
    \ following code useful:\n\n```\nfloat\nGetDegree(float rad)\n{\n    return Math::Abs(rad\
    \ * 180/Math::GetPi());\n}\n```"
