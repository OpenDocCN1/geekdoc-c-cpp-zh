    If you have an idea for a ground-breaking bada app you only have to go through
    the following three steps (see Figure 2.21):


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_73_0.png)


    Figure 2.21 The steps to publishing your app on Samsung Apps.'
  merge: -1
