  md: "```\nvoid\nMainForm::OnActionPerformed(const Osp::Ui::Control& source,\n  \
    \  int actionId)\n{\n    switch(actionId)\n    {\n    case ID_BUTTON_EDITFIELD_DONE:\n\
    \        pScrollPanel->CloseOverlayWindow();\n        pEditField->Draw();\n  \
    \      pEditField->Show();\n        break;\n    case ID_BUTTON_EDITFIELD_CANCEL:\n\
    \        pEditField->SetText(*pEditFieldText);\n        pScrollPanel->CloseOverlayWindow();\n\
    \        pEditField->Draw();\n        pEditField->Show();\n        break;\n  \
    \  default:\n        break;\n    }\n}\n```\n\nWhen the ‘Done’ button is tapped\
    \ the overlay keypad is closed and the Edit field is redrawn. When the ‘Cancel’\
    \ button is tapped the original text string, which is stored in the member variable\
    \ pEditFieldText, is loaded into the Edit field, the overlay keypad is closed\
    \ and the Edit field redrawn.\n\n# Hints, Pitfalls, and Related Topics\n\nThe\
    \ ITextEventListener interface receives text events, but the type of text events\
    \ it receives will differ depending on what type of UI control it is registered\
    \ with. For example, in Method 1 the OnTextValueChanged() method is invoked when\
    \ the ‘Done’ button is tapped, but in Method 2 it is invoked each time the cursor\
    \ moves within the Edit field. By default an overlay-style keypad is not displayed\
    \ with any command buttons. If these buttons are required, they must be created\
    \ using the SetOverlayKeypadCommandButton() method.\n\nWhen initialising a ScrollPanel\
    \ object for the EditField to be placed within, the location and size parameters\
    \ for the ScrollPanel should be set relative to the top left of the Form’s available\
    \ client area. So if a Form contains an indicator area and/or a title area, the\
    \ heights of these areas should be taken into account when setting the ScrollPanel’s\
    \ height parameter. If these values are not set correctly, the overlay keypad\
    \ will not be displayed in the correct position.\n\nTo clear any previous text\
    \ entered in the standalone keypad the SetText() method can be called with an\
    \ empty string parameter.\n\n# Related Recipe\n\n+   - Add a Form to a Frame-based\
    \ App"
