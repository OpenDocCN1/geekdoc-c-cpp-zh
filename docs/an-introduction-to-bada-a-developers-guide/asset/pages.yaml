  md: '# Summary


    Selected important classes:


    +   - `HttpHeader`

    +   - `HttpSession`

    +   - `HttpTransaction`


    The Http sub-namespace provides a set of classes that support the HTTP protocol,
    allowing an application to act as an HTTP 1.1 compliant client, with support for
    standard features such as pipelining and chunking, and communicating with HTTP
    servers on the Internet. Secure connections using HTTPS, with the SSL 3.0 and
    TLS 1.0 protocols, are also supported.


    The main classes in the `Http` namespace are shown in Figure 6.21. To send HTTP
    requests, you must first set up a `HttpSession` that includes the connection type
    (the default is to send plain text over a TCP/IP connection), a proxy server (if
    any), and the URL of the host server that you’re sending HTTP requests to. To
    send a HTTP request and receive a response, you use a `HttpTransaction`, which
    manages the interaction between client and server. Clients support one or more
    sessions while a session can consist of many transactions.


    Messages are packaged up to be sent using the `HttpRequest` class, while the response
    is received as a `HttpResponse`. Adding a header to a request or reading one or
    a whole list of headers in a response is made easy in bada by using `HttpHeader`.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_212_0.png)


    **Figure 6.21** Classes in the `Osp::Net::Http` namespace implement the HTTP protocol.'
  merge: -1
  img_proc: true
- pgno: 213
  md: 'Like the rest of the communications features of bada, HTTP requests are dealt
    with asynchronously, so to receive responses to a HTTP request, and to upload
    messages which are divided into chunks, you need to implement a IHttpTransactionEventListener.


    For those web sites that require a name and password, you can specify this information
    when you open a HttpTransaction by wrapping the login information up in an HttpAuthentication
    object.


