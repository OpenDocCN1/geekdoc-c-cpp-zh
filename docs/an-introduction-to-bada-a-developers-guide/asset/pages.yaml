- pgno: 407
  md: 'The HTTP client architecture provides a generalised mechanism for HTTP-like
    protocols that operate over various transports. Using this namespace, a client
    can choose an HTTP protocol, encode the data, and then transport it. The default
    operation provides plain-text HTTP operating over a TCP/IP connection.


    The Net::Http provides the implementation of the HTTP data communication protocol.
    Using this namespace correctly makes the application a conditional HTTP 1.1-compliant
    client.


    An HTTP session encapsulates the client''s HTTP activity over the duration of
    the client''s execution. It consists of a set of transactions using the same connection
    settings, such as a proxy or a host. There are two HTTP session modes (see Figure
    R5.3):


    +   - normal mode;

    +   - pipelining mode.


    In the normal mode, all the transactions within a session share the same connection.
    One session has one connection, and only one transaction is processed at a time.


    The pipelining mode is similar to the normal mode in that it shares the connection,
    but multiple requests can be submitted concurrently without having to wait for
    each response.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_407_0.png)


    This recipe details the steps to create an HTTP connection, as follows:


    +   1. Derive a class from IHttpTransactionEventListener.

    +   2. Create an HttpSession, open a transaction and send a request.

    +   3. Respond to the request in OnTransactionReadyToRead.


    Now we''ll look at the code.'
