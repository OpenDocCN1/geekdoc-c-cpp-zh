- pgno: 392
  md: 'With these recording requirements now set, recording can commence. Your listener
    will be informed when one of these conditions have been reached. Within the listener,
    the `OnAudioRecorderEndReached()` method will be called. This will report the
    condition under which the recording has ceased. The conditions are:


    +   - `RECORDING_ENDOF_MAX_SIZE`: the end of file size.

    +   - `RECORDING_ENDOF_MAX_TIME`: the end of time.


    # Hints, Pitfalls, and Related Topics


    It is possible to get the state of the AudioRecorder at any time. It might be
    worth tracking the states of the recorder to take the necessary action in the
    event of errors. For example you may wish to display an error pop-up when the
    user attempts to perform an operation while the recorder is in the wrong state.


    By calling `Osp::Media::AudioRecorder::GetState()` on your AudioRecorder instance,
    your application will be informed of the current recorder state. The following
    are available:


    +   - `RECORDER_STATE_INITIALIZED`: the recorder is now initialised.

    +   - `RECORDER_STATE_OPENED`: the file to write to is now opened.

    +   - `RECORDER_STATE_ENDOF_FILE`: the recorder has reached the end of size or
    time.

    +   - `RECORDER_STATE_STOPPING`: processing stop behaviour now.

    +   - `RECORDER_STATE_STOPPED`: stopped and has no current record-time, however,
    media content is opened and initialised.

    +   - `RECORDER_STATE_PAUSING`: pausing record at one specific position.

    +   - `RECORDER_STATE_PAUSED`: the recording paused.

    +   - `RECORDER_STATE_STARTING`: the recording operation is now starting.

    +   - `RECORDER_STATE_RECORDING`: the recording media content.

    +   - `RECORDER_STATE_CLOSING`: processing closing behaviour now.

    +   - `RECORDER_STATE_CLOSED`: the file is now closed.

    +   - `RECORDER_STATE_ERROR`: an error occurred in the recorder.


    # Recipe 4.6: Play a Sound


    # Problem Description


    You want to play a sound from within your application.'
