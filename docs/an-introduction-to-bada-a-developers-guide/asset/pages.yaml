- pgno: 423
  md: "5. Now you can send and receive data via sockets. Call the Send() method to\
    \ send the data in pByteBuffer to the remote host.\n\n```\nvoid\nMyClass::SendData()\n\
    {\n    r = pCommunicatorSocket->Send(this->pByteBuffer);\n    // pByteBuffer contains\
    \ the data to be sent\n}\n```\n\n6. To receive data we first call the Ioctl()\
    \ method to check how many bytes are available to be read and then use this information\
    \ to construct a buffer to read the data into using the Receive() method.\n\n\
    ```\nvoid\nMyClass::ReceiveData()\n{\n    ByteBuffer rxBuffer;\n    unsigned long\
    \ arg =0;\n    if (null != pCommunicatorSocket)\n    {\n        pCommunicatorSocket->Ioctl(NET_SOCKET_FIONREAD,\
    \ arg);\n        rxBuffer.Construct(arg);\n        r = pCommunicatorSocket->Receive(rxBuffer);\n\
    \    }\n}\n```\n\n7. ISocketEventListener is where you handle socket related events:\n\
    \n```\n//Notifies a connecting socket that the connection attempt has been completed\
    \ //successfully\n\nvoid\nMyClass::OnSocketConnected(Osp::Net::Sockets::Socket&\
    \ socket)\n{\n    AppLog(\"OnSocketConnected\");\n}\n\n//Notifies the registered\
    \ socket that the peer socket has been closed //or if the connection attempt has\
    \ not been completed successfully\n\nvoid\nMyClass::OnSocketClosed(Osp::Net::Sockets::Socket&\
    \ socket,\n    Osp::Net::Sockets::NetSocketClosedReason reason)\n{\n    // Do\
    \ necessary cleanup if required\n}\n\n//Notifies a socket that data is ready to\
    \ be retrieved\nvoid\n```"
