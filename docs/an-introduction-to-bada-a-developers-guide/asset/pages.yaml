  md: '# The Recipe


    The following configuration is required for this recipe:


    **Namespaces used:**

    Osp::UI, Osp::UI::Controls, Osp::Graphics, Osp::Media


    **Header files to #include:**

    FUI.h, FUIControls.h, FGraphics.h, FMedia.h


    **Required libraries:**

    FUI, FUIControls, FGraphics, FMedia


    **Required privilege level:**

    Normal


    **Required privilege groups:**

    IMAGE, CAMERA, SYSTEM_SERVICE


    The OverlayPanel is a special type of panel that is used to specify a region where
    the developer can play back video or display the preview image from the camera.
    It is called an overlay because it is possible to overlay other graphics and controls
    on top of the video or camera preview.


    The OverlayPanel consists of two layers: the foreground panel and background buffer,
    which supports hardware accelerated rendering. The video playback or camera preview
    is displayed in the background buffer and any custom graphics or controls are
    displayed in the foreground panel. The overlay panel can manipulate the rotation,
    the aspect ratio, and the size of the input buffer.


    As a result of the implementation of the OverlayPanel, any Form that contains
    an OverlayPanel can only have a black, opaque background.


    This recipe details the steps to create and use the OverlayPanel, and provides
    some sample code snippets. This recipe assumes the steps detailed in Method 2
    of the recipe ‘Add a Form to a Frame-based App’ have been followed to add a Form
    to the Application’s Frame.


    In this recipe a custom image is displayed as overlay on the camera preview image.
    In the bada platform, if a developer needs to do any custom drawing in a control,
    it must be done in the control’s OnDraw() method. This recipe shows the steps
    to create a custom overlay panel class and to implement the custom drawing in
    the OnDraw() method.


    A new class CameraOverlayPanel is created, inheriting from the OverlayPanel class,
    with the OnDraw() method overridden. Below is the class declaration:'
