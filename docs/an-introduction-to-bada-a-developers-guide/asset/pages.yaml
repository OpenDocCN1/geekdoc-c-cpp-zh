    \ method is called. In this method the SwitchToForm() method is called to process\
    \ the event:\n\n```\nvoid\nFormMgr::OnUserEventReceivedN(RequestId requestId,\n\
    \    Osp::Base::Collection::IList* pArgs)\n{\n    SwitchToForm(requestId, pArgs);\n\
    }\n```\n\nThe SwitchToForm() method is responsible for the creation and display\
    \ of the requested Form. In this recipe the MainForm is created only once and\
    \ exists throughout the lifetime of the application, but the BaseForms are created\
    \ and destroyed as required.\n\nFor each BaseForm display request the following\
    \ steps are performed:\n\n+   1. Create an instance of a BaseForm and initialise\
    \ it, passing in the relevant actionId.\n+   2. Set the text to be displayed in\
    \ the BaseForm's Title area.\n+   3. Add the BaseForm to the application's Frame.\n\
    +   4. Set the BaseForm as the current Form of the Frame.\n+   5. Draw and Show\
    \ the Form.\n+   6. Remove the previous BaseForm control and store a reference\
    \ to the current BaseForm.\n\nA MainForm display request follows the same steps,\
    \ with the exception that if it already exists it does not need to be created\
    \ and added to the application frame again."
