    > Note: Sensor monitoring methods such as ISensorEventListener::OnDataReceived
    are called from a separate thread to the main thread, so that they are not slowed
    down by the API calls in the main thread. This means that if you implement monitoring
    of a sensor, you should minimise what you do in the OnDataReceived method and
    do any drawing in the main thread. This also applies to the weather services classes,
    including WeatherSensor and WeatherForecast, which are used to retrieve weather
    data for a given location.


