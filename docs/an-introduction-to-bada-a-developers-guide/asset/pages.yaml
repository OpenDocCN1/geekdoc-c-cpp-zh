    BaseForm::Initialize(int actionId)\n{\n    Form::Construct(FORM_STYLE_NORMAL|FORM_STYLE_TITLE|\n\
    \        FORM_STYLE_INDICATOR|FORM_STYLE_SOFTKEY_1|\n        FORM_STYLE_TEXT_TAB);\n\
