    \ 1);\n    pFaceRecognizer->SetProperty(FACERECOGNIZER_SCALE_IMAGE, 1);\n\n  \
    \  long minFaces, maxFaces, step, initial;\n    pFaceRecognizer->GetRange(FACERECOGNIZER_MAXNUMBER_VIDEO,\
    \ minFaces, maxFaces, step, initial);\n    pFaceRecognizer->SetProperty(FACERECOGNIZER_MAXNUMBER_VIDEO,\
    \ maxFaces);\n    pFaceRecognizer->SetProperty(FACERECOGNIZER_SCALE_VIDEO, 2);\n\
    ```\n\nNext the recipe needs to perform face recognition on the still image that\
