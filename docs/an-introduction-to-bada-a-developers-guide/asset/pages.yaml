- pgno: 57
  md: '# The BuddyFix UI


    BuddyFix is a simple app that enables a simple use-case. It enables a user to
    share periodically updated location information with a list of friends in order
    to converge in real-time on a meeting place. To do so, BuddyFix uses the Buddy
    service that bada provides as a service API.


    BuddyFix displays a list of buddies, with the following information displayed
    for each buddy:


    +   - picture;

    +   - name;

    +   - location fix, i.e. last known location;

    +   - time fix, i.e. time of last location fix;

    +   - location status, on or off the grid, i.e. currently reachable or not;

    +   - whether location sharing is enabled for this buddy.


    Additionally the UI must provide the following information:


    +   - whether sharing is paused or active at application level;

    +   - interval at which location fixes are updated.


    Points to note:


    +   - Location sharing is always in both directions.

    +   - Location fixes are therefore always updated in both directions.

    +   - Application-level pausing of location sharing allows power to be saved.

    +   - Location display format should be user selectable.

    +   - Location sharing is periodic not continuous, and is scheduled according
    to the update interval.

    +   - The update interval should be user selectable.

    +   - The update interval applies to all buddies.

    +   - Individual buddies are added from the phone Contacts app.

    +   - Friends must already be buddies on the Buddy service to be allowed by BuddyFix.


    Clearly, some of the above are too limiting for the app to be fully featured,
    but for current purposes they keep complexity manageable.


    The UI must enable the following actions:


    +   - Add/Remove a buddy.

    +   - Start/Stop sharing, for some buddy.

    +   - Nudge now, share a location fix with some buddy now, without waiting for
    the next scheduled update.

    +   - Set the update interval.

    +   - Pause/Unpause all sharing.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'So let''s get started. We''ll define a single MainListForm as the basic app
    screen, from which all functionality will be available. Launch the Resource Explorer
