- pgno: 141
  md: 'To get you started, this section provides a quick overview, and shows some
    examples of those classes in use.


    The native types include classes for:


    +   - basic types, including `Object`, which is the root class of the bada class
    library, and wrapper classes for familiar native C++ types including `Boolean`
    and `Character`;

    +   - `Number`, from which all numeric types derive, and wrapper classes for a
    complete set of numeric value types, from `Short` to `LongLong`;

    +   - `BufferBase`, from which all array types derive, and `Buffer` and `ByteBuffer`,
    which wrap C++ native byte arrays;

    +   - `String`, representing a Unicode string;

    +   - `DateTime` and `TimeSpan`, which represent dates and date differences;

    +   - `UuId`, a Universal Unique Identifier;

    +   - as well as these wrapper classes, bada also includes a complete set of collection
    classes that are defined in the `Base::Collection` namespace.


    Finally, the `Base` namespace also includes useful `Comparer` classes for many
    of the types above, and `Base::Utility` provides utilities for managing internet
    Uniform Resource Identifiers (URIs), the math library and string functions.


    `Object`, by the way, provides two useful built-in methods:


    +   - `Equals()` tests for equality, which by default is interpreted as *identity*,
    that is, true if and only if the two tested objects share the same address. However,
    it can be overridden to support value equality, in which case it returns the same
    value as the equality operator. The SDK sample and example code includes several
    examples of overriding and using `Equals()`.

    +   - `GetHashCode()`, which generates a hash value for the current instance (note
    that the default implementation simply returns the object’s address, as a simple
    way of returning a random but unique number).


    `Object` does *not* provide additional functionality such as zeroing memory when
    an object is instantiated.


    # 4.3.2 Using Strings, Characters, and Unicode


    It should be no surprise that bada is thoroughly Unicode enabled, and takes non-Western
    alphabet and writing systems seriously. In fact, bada is designed to allow a complete,
    alternative windowing set to be used, for example to support Samsung’s home market
    in Korea. This is more than just a case of providing good localisation support
    (which is a great bada feature); it really is complete support for an alternative
    calligraphic system.'
