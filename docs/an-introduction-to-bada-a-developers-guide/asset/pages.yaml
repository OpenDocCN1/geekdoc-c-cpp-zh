- pgno: 22
  md: '# Preface


    Samsung announced its bada platform for mobile phones towards the end of 2009.
    New mobile platforms don’t come along every day, but 2009 was a busy year in mobile,
    and most attention remained with the existing platforms.


    Some avid Samsung watchers paid a little more attention and when the first bada
    phone, the Samsung Wave, previewed at Mobile World Congress in February 2010,
    you could begin to detect a little excitement.


    The bada SDK became publicly available for the first time in May 2010, and at
    the same time Samsung announced its Global Developer Challenge for bada apps,
    running until December 2010 with a prize pot of more than US$2.7 million, and
    a Grand Prize of US$300,000. That’s impressive!


    Even so, you could be forgiven for thinking that the mobile industry still does
    not really get bada. After all, who needs another smartphone OS?


    This book, we hope, will help put you in the company of those who do get bada.
    The rolling programme of Developer Days through the spring and early summer of
    2010 has seen 3000 and more developers pick up tools, pick up phones, and get
    stuck in – from Paris to Peking to St Petersburg, Dublin to Seoul, Budapest to
    London, Jo’burg to Istanbul, not forgetting Munich, Madrid, and Milan. They get
    it.


    Less publicly, Samsung has been working with the kind of companies you’ve heard
    of – and probably a few you haven’t – to put their games, services, and cool apps
    onto bada phones and into SamsungApps, the brand new Samsung mobile app store.
    They get it too.'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'Wave is now in the shops, pitched squarely at the middle price-band – free
    on mid-priced contracts in UK and European markets, sub-£300 SIM-free in the UK
    – that’s less than US$500 USD. After Wave, the promise is that bada devices will
    push down below the US$200 price point.

    The real test now for bada is whether the market gets it.

    We’re betting it will. And we hope this book will inspire you to download the
    SDK, fire up your favourite editor, and start following along.


    Note: This publication refers to and is correct for the 1.0.0b3 SDK/IDE version.


    The Authors'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Introduction


    This book is for developers. It will get you up and running with your first bada
    app, quickly. Looking beyond your first app, we hope this book will find a permanent
    place on your desk as a bada companion, with its overviews of the platform, the
    bada architecture, bada namespaces, application programming interfaces (APIs),
    and services – and above all with its recipes. These have been written by Samsung’s
    bada development team to give you more than 45 best-practice examples of common
    bada APIs in use. You can learn from this code, and you can reuse this code.


    As for the goal of this book, we hope it’s clear – to introduce you to bada, and
    to make it as easy as possible to develop cool apps for bada phones.


    # Overview of the Book


    Developing for mobile is never trivial, whatever the platform. In Part 1 of the
    book, Chapter 1 runs through the issues that can bite you in mobile development.
    If you are a seasoned mobile developer, you may know the issues already. However,
    the boom in mobile app development has brought thousands of new developers into
    what used to be a niche market. If you are not one of those grizzled types who
    cut their baby teeth on embedded, eating ARM¹ assembler for breakfast way back
    at the dawn of mobile, then this could be for you. Understanding the mobile difference,
    and becoming comfortable with it, is the essential starting point for doing mobile
    development. And if it helps, Chapter 1 also summarises some agile best-practice.
    Rules are good for breaking, as well as following, but in either case it’s good
    to know what they are.


    ¹The ARM RISC processor architecture, from UK company ARM Ltd, is overwhelmingly
    the most popular CPU choice for mobile hardware.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '**Chapter 2** and **Chapter 3** show you just how easy it is to get started
    with bada, introducing the Eclipse-based development environment (IDE) and its
    Application Wizard to work up an example from bare-bones to first demo user interface
    (UI). Other topics covered include app deployment, and the bada developer portal,
    which provides the interface to app publishing through the Samsung Apps mobile
    store.


    **Chapter 4** moves on to explore the bada platform architecture, and to introduce
    some important bada concepts – including bada’s C++ namespaces, class library,
    security/protection model, and programming idioms.


    **Chapter 5** introduces bada services, one of bada’s exciting innovations, which
    integrate APIs for commerce, social networking, and other service-centric features,
    with the platform APIs. This makes it easy to integrate services into your apps
    to stretch the boundaries of what users can do on mobile.


    **NOTE:** At the time of writing, some of these services are still restricted
    to partner developers, so keep an eye on breaking news on developer.bada.com as
    the developer story continues to unfold.


    To conclude **Part 1** of the book, **Chapter 6** provides an overview of each
    of the bada namespaces, highlighting the most important classes.


    **Part 2** of the book presents a collection of recipes, organised into groups
    that show off the main bada features and provide you with ready-made code solutions
    to integrate into your own projects.


    # What bada Is – and Isn’t


    bada (with a small *b*) is a new open smartphone platform for Samsung mass-market
    mobile phones. ‘Open’ means that phones that ship with the bada platform are open
    to third-party developers, to create and publish native applications to phone
    users through the Samsung Apps application store.


    The vision of bada is that it is a ‘Smartphone for Everyone’. bada was created
    to provide a smartphone experience for more people. So, the major target customers
    for bada phones are not only techy early adopters, but also high school students.
    In a similar way, bada is not just targeted at existing geographical markets for
    smartphones but at developing markets too. To achieve this, bada is designed to
    provide powerful features while it supports a high level of configurability for
    a variety of hardware – from affordable to expensive and powerful.


    bada’s origins are in Samsung’s proprietary platform, which was first used in
    2004. Since then, it has been adopted widely for handsets and is used by'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'numerous customers. For this reason, the proprietary platform has been successfully
    customised for a wide range of hardware as well as kernels. bada exploits the
    experience and knowledge gained throughout the history of Samsung’s mobile platform.
    Well-proven concepts are re-used supplemented with new insights and improvements.
    bada is highly configurable over various hardware configurations and kernels.
    For example, the first bada phone, Wave, is very high end with a 1 GHz CPU and
    a variety of sensors, while some of the later phones use less powerful hardware
    but are affordable to the mass market. Such configurability for a wide range of
    devices will make bada the best platform for mass-market phones.


    Another noteworthy bada feature is the integration of *service* APIs into the
    platform. Services include social networking, buddy lists that allow users to
    share real-time information with their friends, shopping and ecommerce APIs, location
    and points of interest, and even weather services. All are included out-of-the-box
    and can be integrated into any third-party application (but note the current restrictions
    on access to non-partner developers).


    It’s worth emphasising that while bada is a new platform, much of the system underneath
    it (middleware and below) effectively re-uses enhanced version of components of
    Samsung’s proprietary platform.


    If the significance of that fact escapes you, think of it like this – Samsung
    shipped some 40 million phones a year in the touch-phone category in 2009. These
    are the phones that have made Samsung the global number-two handset vendor, pushing
    strongly to become global number-one. While bada won’t open the box on previously
    shipped phones, it opens the box on the next tens-of-millions of phones that Samsung
    will ship in this category this year, extending to perhaps hundreds-of-millions
    over the next few years.² This means that bada brings the mid-range, touch-phone
    category into your reach as an app developer, with a ready-made global audience,
    a proven middleware architecture, the proven touch-based UI, and potentially huge
    device numbers.


    And if you want to get a hands-on feel for what you can do with that, go into
    your local phone shop and play with the Samsung Wave (the first bada phone to
    ship). It makes for a compelling story.


    # Just the Facts


    bada is designed for simplicity. bada offers a small but carefully chosen set
    of APIs that enable app developers to create simple but powerful applications.


    Remember, bada apps are not aimed at power users, but at the mass market of ordinary
    users, using their phones to get everyday tasks done, to keep in touch with friends,
    and to browse, buy, and have fun in between.


    ²For example, see web reports that quote Samsung estimates of 15 million bade
    phones shipping in 2010, and over 50 million in 2011, available from http://bit.ly/bNYBkG.'
  merge: -1
  img_proc: true
