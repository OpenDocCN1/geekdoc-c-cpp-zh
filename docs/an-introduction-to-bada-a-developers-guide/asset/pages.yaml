  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_200_0.png)


    Figure 6.13 The role of the LocationProvider class in the OSp::Locations namespace.


    # Server Supported Services


    Using the bada Server, together with the RemoteLocationProvider class, developers
    can also access information about remote devices, periodically report the last
    location of the local device to the server, and use the SubscribeToTraceService
    method and ITraceServiceListener class to record a path of travel.


    Reporting device location to the bada Server is done using the StartLocationReport
    method, together with the ILocationReportListener class. This causes location
    information to be uploaded to the bada Server periodically, information that will
    then be available for other authenticated devices to read.


    To retrieve the last known locations of remote devices, use the RequestLastKnownLocationList
    method, passing in a list of TargetInfo objects that identify a device from the
    user’s bada Server userID. You can also narrow down the results to devices with
    last known locations inside a given area using the RequestLastKnownLocationListInCircle
    and RequestLastKnownLocationListInRectangle methods.


    # Landmarks


    The Landmark class represents a named geographical location that has a name and
    contains extra information such as a description and a URL. Applications can create
    their own landmarks, from a user-selected location on a map, for example, or use
    pre-defined landmarks provided by other applications or third-party content providers.'
