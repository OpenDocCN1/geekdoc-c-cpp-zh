- pgno: 218
  md: 'This namespace contains classes and methods to support various types of encryption
    and decryption. There are four basic types of encryption supported: one-way encryption
    using hashing, encryption using a secret key, encryption using a public and private
    key, and the use of digital signatures.


    Public/private key pairs are used in two ways: to encrypt a message with a public
    key so that only the person with the corresponding private key can read it and
    to use a private key to digitally sign a document. Anyone with the public key
    can read the message, but signing it with a digital signature provides proof that
    it has not been tampered with.


    The RsaCipher and RsaSignature classes provide support for encrypting and signing
    with public/private key pairs.


