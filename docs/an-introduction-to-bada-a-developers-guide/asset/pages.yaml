  md: '+   - An overview of how the bada platform is partitioned into major functional
    areas.

    +   - An understanding of what contribution to the overall system is made by each
    namespace.


    By the end of the chapter, you’ll know where the interesting functionality is,
    and how to access it.


    # What You Will Need


    To get the most from this chapter, keep your editor open and browse the header
    files mentioned, which in almost all cases contain useful commentary and code
    examples.


    # 6.1 using Directives and Declarations


    If you are not familiar with namespace syntax in C++, don’t despair; it is very
    straightforward.


    To use the classes and other definitions from a given namespace in C++, you must
    include either a using directive to declare all names from the namespace that
    you want to be available in a given source file, or qualify the names of individual
    identifiers as they occur in your code using declarations.


    Where somenamespace is a namespace, a directive has the form:


    ```

    using namespace somenamespace;

    ```


    And where someidentifier is an identifier (a class name, say, or enumeration),
    a declaration has the form:


    ```

    using somenamespace::someidentifier;

    ```'
