- pgno: 393
  md: '# The Recipe


    The following configuration is required for this recipe:


    Namespaces used:

    Osp::Media, Osp::Base, Osp::Base::Collection, Osp::App¹


    Header files to #include:

    FMedia.h, FBase.h, FApp.h²


    Required libraries:

    FMedia, FApp [.lib | .so]


    Required privilege level:

    Normal


    Required privilege groups:

    None


    bada supports playing sounds locally on the device in all of the popular output
    formats, including AAC, MP3, WAV, and WMA. AAC content can also be streamed remotely
    from a server.


    To play a sound you have two options:


    +   - use the classes in the Media namespace;

    +   - use the device’s built in media player application which can be accessed
    using AppControl.


    This recipe concentrates on the Media namespace because it offers more flexibility,
    but as you may also want to make use of the built in player sometimes, we’ve included
    code for that too.


    # Example 1: Playing a Sound using Media::Player


    In this recipe, we’ve assumed that you’ve created a form (see the recipe ‘Add
    a Form to a Frame-based App’) and are playing a sound as a result of some user
    action, such as clicking a button.


    The Osp::Media::Player class is used for playing both audio and video content,
    either stored locally on the device or streamed from a remote server. Player also
    includes methods for the kind of features you’d expect when playing media such
    as setting the volume, pausing, seeking and looping, but we’ll concentrate on
    just playing the sound in this recipe.


    ¹Osp::Base::Collection and Osp::App are only needed if you are playing a sound
    using the built in player AppControl.


    ²FApp.h is only needed as an include file and FApp as a library file if you are
    playing the sound using the built in player AppControl.'
