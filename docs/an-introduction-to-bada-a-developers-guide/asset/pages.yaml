- pgno: 275
  md: 'The top-level window of an application is called a Frame. A Frame is the ultimate
    parent object of all controls that an application possesses. A Frame can contain
    one or many Forms.


    A Form is the highest level container. It is a full-screen container that can
    contain user-created controls and system UI components to help provide functionality
    for an application (see Figure R2.1).


    The Frame and Form classes are provided by the `Osp::Ui::Controls` namespace.


    This recipe shows two different methods that can be used to create a Form and
    add it to the application’s Frame. Each method details the steps required to add
    a Form to a Frame and provides some sample code snippets.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_275_0.png)


    **Figure R2.1** A blank Form.'
  merge: -1
  img_proc: true
- pgno: 276
  md: "# Method 1: Adding a Form to the Frame using the Osp::Ui::Controls::Form class\n\
    \nThis simple recipe creates a new Form object using the system’s Osp::Ui::Controls::Form\
    \ class and adds it to the application’s Frame.\n\nThe Form should be created\
    \ and added to the application’s Frame during the application initialisation phase\
    \ (OnAppInitializing()):\n\n+   1. Create an instance of a Form and initialise\
    \ it with the style parameters required to display a normal Form containing a\
    \ title bar and an indicator bar.\n+   2. Set the name of the Form and the text\
    \ to be displayed in the Form’s Title area.\n+   3. Add the Form to the application\
    \ Frame.\n+   4. Set the Form as the current form of the Frame.\n+   5. Draw and\
    \ Show the Form.\n\nThe following code snippet is an example of code that would\
    \ be added to the Application’s OnAppInitializing() method:\n\n```\n// Create\
    \ a Form\nForm* pForm = new Form();\npForm->Construct(\n    FORM_STYLE_NORMAL|FORM_STYLE_TITLE|FORM_STYLE_INDICATOR);\n\
    pForm->SetName(L\"MainForm\");\npForm->SetTitleText(L\"MainForm\");\n\n// Get\
    \ a frame pointer and add the Form to the Frame\nFrame* pFrame = GetAppFrame()->GetFrame();\n\
    pFrame->AddControl(*pForm);\n// Set the current Form\npFrame->SetCurrentForm(*pForm);\n\
    // Call Draw & Show to display Form\npForm->Draw();\npForm->Show();\n```\n\n#\
    \ Method 2: Adding a Form to the Frame Using a User-defined Form Class\n\nThis\
    \ recipe creates the same results as Method 1, but does it using a newly created\
    \ Form class. This method may be more suitable for applications that contain multiple\
    \ forms, as the creation of the Form’s controls and its logic is implemented by\
    \ the Form rather than in the application code."
