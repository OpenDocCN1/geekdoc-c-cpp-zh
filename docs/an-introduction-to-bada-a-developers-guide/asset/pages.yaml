  md: 'service (SNA) that provides built-in support for social networking services
    such as Facebook and Twitter all from within the application.


    As you can see from the table, the functionality of services can be broken into
    five groups: Profile, Privacy, Messaging, and Buddy management work with the features
    of the bada Server to connect bada users, while the SnsGateway provides the link
    from the application through the bada Server and onto social networking sites.


    The ProfileService class is used to manage profiles. A user''s profile actually
    consists of several different parts: a BasicProfile, which is public by default,
    and other profiles, such as ContactProfile and SocialProfile, which are available
    across the device to all permitted users, but which are set as private when stored
    on the bada Server. Users must choose to be listed in the public directory on
    the bada Server and can also choose which of their other profiles are available
    to be accessed by all or a specified group of users. You need to implement IProfileServiceListener
    to respond to requests initiated from the ProfileService. The ProfileService and
    the various types of Profiles are shown in Figure 6.27.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_221_0.png)


    Figure 6.27 How the ProfileService manages the different kinds of Profiles.


    Access to a user''s profile and other information such as their location is handled
    by the PrivacyManager class. This controls which parts of a user''s profile information
    can be searched by other users and who has access to that information – buddies,
    for example. Developers need to implement the IPrivacyManagerListener class to
    implement this functionality.


    Users of the bada Server can be connected as Buddys – a mutually confirmed relationship
    between two users. Sending and responding to buddy'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'requests is handled by the BuddyService class and because, as with most other
    requests in the Services namespace, these requests are handled asynchronously,
    you need to implement the IBuddyServiceListener. The classes that are used to
    implement the BuddyService are shown in Figure 6.28.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_222_0.png)


    Figure 6.28 The classes that go to make up the BuddyService.


    The MessagingService is used for applications to send text messages between devices
    to one user or a group of users. Messages are send via the bada Server and you
    need to implement IMessageServiceListener and IMessageServerEventListener to take
    advantage of this functionality.


    > Note : The MessagingService can only be used to send messages between the same
    application on different devices, not between different applications.


    # SnsGateway


    The SnsGateway class manages one of the most powerful features of the Services
    namespace, allowing you to create applications that can easily communicate with
    social networking sites such as Facebook, MySpace, and Twitter, and retrieve information
    such as pictures and status updates, all from within your application. All you
    need to do is use the SnsGateway class and related classes such as SnsAuthenticator,
    and the low-level work of connecting to and retrieving information from the various
    social networking sites is taken care of for you by the bada Server.


    The organisation of the classes making up the functionality of the SnsGateway
    is shown in Figure 6.29.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_223_0.png)


    # Figure 6.29 Classes that allow access to social networking sites, as provided
    by the SnsGateway.


    SnsGateway helps to present a unified view of all the information from various
    sites, representing the retrieved information in classes such as SnsPhotoInfo
    and SnsStatusText, which you can then display in whatever way you want.


    > Note: A Buddy as managed by the BuddyService refers to another user of the bada
    Server and is different from the concept of a buddy as returned by the SnsGateway::GetMyBuddies
    method. The latter refers to a buddy in a social networking service such as Facebook
    or MySpace and represented by a SnsProfile.


