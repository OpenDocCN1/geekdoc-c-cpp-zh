  md: "```\n)\n\nvoid\nMainForm::OnKeyReleased(const Control &source,\nOsp::Ui::KeyCode\
    \ keyCode)\n{\n    switch(keyCode)\n    {\n        // Handle the various keys\
    \ however you need it\n    }\n    prevKeyCode = keyCode;\n    prevKeyState = KEY_RELEASED;\n\
    }\n\nvoid\nMainForm::OnKeyLongPressed (const Control &source,\nOsp::Ui::KeyCode\
    \ keyCode)\n{\n    switch(keyCode)\n    {\n        // Handle the various keys\
    \ however you need it\n    }\n    prevKeyCode = keyCode;\n    prevKeyState = KEY_LONGPRESSED;\n\
    ```\n\n# Hints, Pitfalls, and Related Topics\n\nWhen the user presses and releases\
    \ a hard key, two events are generated:\n\n+   1. KEY_PRESSED\n+   2. KEY_RELEASED\n\
    \nWhen the user presses and holds a hard key before releasing it, an additional\
    \ event is generated for the long press:\n\n+   1. KEY_PRESSED\n+   2. KEY_LONGPRESSED\n\
    +   3. KEY_RELEASED (this is invoked when the key is released)\n\nWhen designing\
    \ an application, you must consider whether the functionality associated with\
    \ a hard key is going to be invoked when the key is pressed or released. Additionally,\
    \ you must consider whether any long press functionality is to be implemented\
    \ for a hard key. These factors will help determine how the key event handling\
    \ methods are implemented."
