  md: '# 4.3.5 Using Dates and Times


    Dates and times, and calculations from dates and times occur so frequently in
    so many kinds of application, that having convenience classes to make using them
    easy is essential on any platform.


    The DateTime class in bada hides all the complexity of creating and manipulating
    dates and times.


    A DateTime represents a value to the nearest second between 12:00:00 am (midnight)
    on 1 January 1 AD, and 11:59:59 am (one second before midnight) on 31 December
    9999 AD. Thus a DateTime is a single, specified, instant. Since a DateTime is
    an instant, there is no meaningful concept of differencing (adding, subtracting)
    DateTime values, but there are meaningful concepts of comparison.


    In contrast, a TimeSpan is a time period (i.e. duration) internally represented
    in ''ticks'' (milliseconds). Durations do support meaningful concepts of differencing,
    as well as comparison.


    DateTime objects can be added to (or subtracted from) using built-in add and subtract
    methods, for example:


    ```

    dt.AddYears(10);


    dt.AddDays(-3);

    ```


    More complex manipulations of dates and times typically involve using DateTime
    and TimeSpan objects:


    ```

    TimeSpan ts(1, 1, 1); // 1 day, 1 hour, 1 second

    dt.Add( ts );

    dt.Subtract( ts );

    ```


    +   A DateTime and a TimeSpan can be added or subtracted.


    +   A TimeSpan and a TimeSpan can be added or subtracted.


    +   The parts of a DateTime can be extracted, and a DateTime can be queried with
    IsLeapYear().


    +   A DateTime can be added to or subtracted from using the built-in methods AddYears(),
    AddDays(), and so on.


    +   A TimeSpan can be negated, converted into and between time units, hashed,
    compared, etc.


    +   A DateTime can be converted from, or to, seconds.


    # 4.3.6 Using Numbers


    In bada, wrapper and comparison classes are defined for each of the C++ primitive
    numeric types of short, char (8-bit integer), int (32-bit integer), double, long,
    longlong, and float.'
