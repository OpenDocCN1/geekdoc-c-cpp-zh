  md: "![](img/a257d5fd53a79a244a20e587cd2f08f6_50_0.png)\n\n**Figure 2.5** Our app\
    \ running in the Simulator.\n\nTo close the app, select the phone’s **Power/End**\
    \ key on the Simulator. Your app will close, and you will be returned to the home\
    \ screen. Select the **Menu** key to go to the Application Manager. You’ll see\
    \ your app displayed there in the icon menu list, using the default app icon (see\
    \ Figure 2.6).\n\n> **Note:** When BuddyFix launched, you may have noticed that\
    \ a splash screen was briefly displayed before the application was shown, based\
    \ on `splash.png`, a default file in the `/Icons` folder. You can change the image\
    \ that’s displayed by changing this file. The splash screen is a customisable\
    \ property of your bada project — it is set in the same way as setting your app\
    \ icon.\n> \n> By the way, the splash screen is displayed to fill any delay while\
    \ your app is launched. Delay may occur for a number of reasons, depending on\
    \ the load on the phone at any time. The splash screen is *not* displayed by the\
    \ app itself to hide a delay while the app initialises. And, in fact, you should\
    \ design your app to postpone doing any initialisation which might cause perceptible\
    \ delay in showing its main screen. You can do this either by performing such\
    \ initialisation in the background using multi-threading techniques, or by deferring\
    \ this deeper initialisation until the app has launched, or both.\n> \n> A hint:\
    \ in order to pass the certification process a bada app must have its own splash\
    \ screen and app icon."
