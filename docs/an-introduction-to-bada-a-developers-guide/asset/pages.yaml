- pgno: 80
  md: '# Test and Debug on Real Target Device


    The obvious difference between developing for a mobile platform such as bada and
    the more conventional world of application development on the desktop is the fact
    that the development environment is not the same as the execution environment.
    To understand and test the mobile app the simulator as described above is very
    useful. But eventually you really want to find out how your app behaves on a real
    mobile handset.


    Turning back the time machine, mobile platforms were difficult. But bada shows
    just how far things have come. Some platforms still bear the legacy – Symbian’s
    quirky build-system, for example. In fact, these are all part of what makes mobile
    different and gives mobile development its reputation for difficulty.


    At the time of writing, the first bada phone has been shipped – the Samsung Wave,
    a feature-packed, top-of-the-line phone that defines the high end of the bada
    product line. Eventually, bada phones will extend from this high point down through
    the midrange of affordable ‘smartphones for everyone’, taking smartphone features
    to the mass-market.


    Before you can build and deploy a bada app on your Wave target you need to install
    the Wave device driver in your desktop OS. These device drivers are a simple executable
    file shipped within the IDE/SDK bundle that you downloaded from the developer.bada.com
    portal.


    If this is successful, you need to copy and install the Test Root Certificate,
    which is necessary for testing an app on the target device. An app cannot be installed,
    run, and tested on the Wave without this Test Root Certificate. It is up to you
    how you transfer the Test Root Certificate file to your Wave. The easiest way
    is to push it from your desktop computer using Bluetooth. The other way is to
    use the USB cable connection in ‘Mass storage’ mode.


    This can be set on the Wave by invoking the Menu and then going to: Settings |
    Connectivity | USB | Mass storage and then clicking on the ‘Set’ soft key.


    The Test Root Certificate file that needs to be transferred from the desktop to
    the Wave device is shipped with the SDK/IDE download.


    You will find the necessary file “rootCACert.cer” in <BADA_SDK_INSTALL_DIR>\Tools\sbuild.


    Then disconnect your Wave device from the desktop. On the Wave invoke the Menu
    and then go to My files | Other.


    Tab the rootCACert.cer file and it should be installed automatically (see Figure
    2.26).


    To make use of on-device debugging via USB you need to explicitly set this in
    your Wave device. Open the Menu and go to Settings | Connectivity | USB | USB
    Debugging and then click on the ‘Set’ soft key (see Figure 2.27).'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/a257d5fd53a79a244a20e587cd2f08f6_81_0.png)


    # Figure 2.26 Installing the Root Certificate.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_81_1.png)


    # Figure 2.27 Setting up the device for USB debugging.


    To deploy your bada app on your Wave device all you have to do is change the active
    build configuration and build it for the target platform. Open your bada IDE and
    create or open your bada project. Go to the context menu of your project by right-clicking
    the project name in the Project Explorer window. Then go to Build Configurations
    | Set Active and check Target-Debug (see Figure 2.28).


    After that, build your project for the target device again by entering the context
    menu of your project and clicking Build Project.


    Before running your bada app on the target device make sure that it is connected
    to your computer via USB and that it is in USB Debugging mode so you can make
    use of the debugging messages in your IDE.


    To run your app go to the context menu of your project and select Run As | bada
    Target Application (see Figure 2.29).'
