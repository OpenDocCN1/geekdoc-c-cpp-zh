- pgno: 65
  md: 'To do that, we need to create a Form class. UI Builder can do that for us.
    Note that so far, no changes at all (and no additions) have been made to the Application
    Wizard-generated C++ code.


    In UI Builder, generate the underlying code for the main Form by right-clicking
    on the Form to open the context menu. (Be sure to click on the Form, not the List;
    clicking inside the Title bar ensures the Form is not hidden beneath another control.)


    Select Add Class as shown in Figure 2.16 to pop up the New Class Wizard, which
    will display the window shown in Figure 2.17.


    We will name the class MainListForm, matching the resource file name.


    Next, let''s set its listeners.


    In the EventListener dialog, we set IActionEventListener. We don''t set IOrientationEventListener,
    because we have only designed a portrait-mode screen. In a real app, unless we
    have specific reasons not to, we should enable both portrait and landscape modes.


    In the Control Base EventListener dialog, we select focus, key, and touch events.
    These are the underlying events that will be detected by the framework and from
    which action events will be generated. We know therefore that in our code we should
    expect to handle key, touch, and focus events.


    We don''t set drag and drop events, because we don''t want drag and drop interaction
    with the buddy list.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_65_0.png)


    Figure 2.16 Using the New Class Wizard.'
