    Dns is a class provided by the Osp::Net namespace. This class provides simple
    domain name resolution functionality that translates host names into IP addresses
    and vice versa.


    To get an answer to a query using Dns you must use an IDnsEvent Listener.


    The Dns class encapsulates a request for information from a DNS server. A DNS
    request can be one of two types:


    +   - DNS lookup of IP addresses from user-friendly host names;

    +   - DNS lookup of host names from IP addresses.'
