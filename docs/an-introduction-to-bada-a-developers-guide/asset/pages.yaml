  md: "# Create a Bitmap from File\n\nFMedia.h is the header file for Media namespace\
    \ which contains the Image class, while Bitmap is defined in the Graphics namespace\
    \ in FGraphics.h.\n\nThe required #include declaration is:\n\n```\n#include FMedia.h\n\
    #include FGraphics.h\n```\n\nFMedia is the required library to use the classes\
    \ in the Media namespace, while FGraphics is required to use the classes, such\
    \ as Bitmap, defined in Graphics.\n\nThe required namespace declaration is:\n\n\
    ```\nusing namespace Osp::Media;\nusing namespace Osp::Graphics;\n```\n\nPrivilege\
    \ level is NORMAL. Privilege group is IMAGE. Image construction is performed as:\n\
    \n```\nresult r = E_SUCCESS;\nImage *pImage = new Image();\nr = pImage -> Construct();\n\
    if (IsFailed(r))\n{\n    // handle error condition\n}\n```\n\nr contains E_SUCCESS\
    \ if the method was successful, and an error status otherwise. For more about\
    \ system error values see FBaseErrors.h, which defines all framework error codes.\n\
    \nImage provides four decoding methods:\n\n+   1. Takes a source file image path\
    \ string and destination bitmap pixel format specifier.\n+      ■ No resizing\
    \ performed.\n+      ■ Original aspect ratio preserved:\n\n```\nBitmap* Decode(const\
    \ Osp::Base::String& srcImagePath,\n    BitmapPixelFormat colorFormat) const;\n\
    ```"
