  md: "# The Recipe\n\nThe following configuration is required for this recipe:\n\n\
    **Namespaces used:**\nOsp::Social, Osp::Social::Services\n\n**Header files to\
    \ #include:**\nFSocial.h\n\n**Required libraries:**\nFSocial, FSocialServices\n\
    \n**Required privilege level:**\nSystem\n\n**Required privilege groups:**\nBUDDY_SERVICE\n\
    \nThis recipe uses the Osp::Social and Osp::Social::Services namespaces to provide\
    \ access to the social features of bada. It is a more detailed implementation\
    \ of the request for a buddy presented in Chapter 5. There are some prerequisites\
    \ to using this feature in your application. First, your application profile has\
    \ to be registered with System-level privilege on the bada developer web site.\
    \ Second, you have to have a valid Samsung account, which you get for free, and\
    \ sign in.\n\nThere are two steps to adding a buddy:\n\n+   1. Search the profile\
    \ by passing a name, email address or login ID using the ProfileService class.\n\
    +   2. Send the buddy request to that particular user using the BuddyService class.\
    \ To use these two classes, you have to implement the listener interface class\
    \ to handle the results received from the bada Server.\n\nLet's first implement\
    \ our own listener class called MyListener. In a concrete project, you would probably\
    \ use one of your UI classes, in which you want to display the results from the\
    \ server, as your listener. This would mean that your UI class would inherit from\
    \ the IProfileServiceListener and IBuddyServiceListener interfaces. But you can\
    \ also have your own class to handle the results, as we show below.\n\n```\n//MyListener\
    \ class implementation\nclass MyListener :\n    public Osp::Social::Services::IProfileServiceListener,\n\
    \    public Osp::Social::Services::IBuddyServiceListener\n{\npublic:\n    MyListener();\n\
    };\n```"
