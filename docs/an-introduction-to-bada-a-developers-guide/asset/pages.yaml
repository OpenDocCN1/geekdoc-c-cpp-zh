    pMainListForm->Show();

    return true;

    }

    ```


    In this code, when our app launches, we:


    +   1. Create the default Form we will display, add it to the application Frame,
    and set it to be the current Form.

    +   2. Draw() and Show() the Frame; in two steps, this renders the Form (and any
    controls it contains) to the logical display; and then updates the physical Frame
    buffer (which updates the phone display, so that you can see it).


    The AppRegistry& appRegistry parameter is passed to the method to save you having
    to make a method call to get it. Typical uses of the registry at initialisation
    time are:


    +   - Look for a key to tell us whether this is the first time the app has ever
    run, if there are specific ‘first time’ actions we want to perform, such as inviting
    the user to register, or to provide default data such as a nickname, or just so
    that we can say ‘Hello!’

    +   - If we find a key, restore any saved preferences.


    In both cases it’s a good idea to limit any code to simple, quick flag setting,
    to be actioned later, so that the Form we loaded can be drawn and the screen updated,
    and we can get on and launch; which we do by setting the return value:


    ```

    return true;

    ```


    This is important; if the value is true, the framework will set our state to Running;
    otherwise, it will be set to Terminating.


    # 2. Running


    If OnAppInitializing() returned true, our app will enter the Running state. There
    is no lifecycle method associated with this transition – so how do we code for
    it?'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'The answer is that in the Running state we must differentiate between two sub-states,
    Foreground and Background. There are methods associated with transitions to these
    states: OnForeground() and OnBackground(). OnForeground() is implicitly called
    when an app is started and the app is shown. A running app is sent to the background
    when the Home key is pressed or when a base application such as an incoming call
    or SMS is invoked. Then the OnBackground() method is called and it is recommended
    to stop resource-intensive operations and release unneeded memory. Once your app
    moves into the foreground again you can proceed normally.


    After launch, our app is now the foreground application. Our default Form is being
    displayed; and user interaction will cause our event listeners to run, for example
    we coded OnActionPerformed() to respond to the soft keys, Option menu key, and
    Option menu selections.


    Recall also the long list of listeners the UI Builder tool added to our MainListForm;
    key presses, touch and multi-touch events, and focus events will all cause our
    listener implementations (call-backs) to run, so that we can handle the events
    appropriately.


    And of course system events too will generate call-backs. As we’ve seen, the minimum
    set of system events we should be prepared to handle is


    +   - OnBackground()

    +   - OnLowMemory()

    +   - OnBatteryLevelChanged()

    +   - OnScreenOn()

    +   - OnScreenOff()


    The two screen events, as you may have guessed, are the reason for deriving from
    IScreenEventListener.


    There are no hard and fast rules for how you should code for these events. But
    clearly, for example, if memory is low you should consider releasing memory you
    own; if the battery level becomes low, save power, and be prepared for sudden
    failure; if the screen is off, there is no point in updating the display, and
    so on.


    # 3. Terminating


    Your app may be terminated by the user; typically in bada, apps do not have an
    Exit soft key or menu option, but instead are ended when the user presses the
    Power/End key. Your app may also be terminated by the system, but that will usually
    indicate a serious error of some kind. In either case, when your app transitions
    to Terminating, its OnAppTerminating() method will be called, and you should prepare
    to close; release all resources, and possibly save state if relevant (but typically
    not user data – which should always be saved at the point of change).


    When your app next runs, it will launch into the Initialising state, which is
    the difference between its being terminated, and being put into background.'
  merge: -1
  img_proc: true
- pgno: 92
  md: "# 4. Terminated\n\nYour app is no longer running.\n\n# 3.1.3 A Note about Frameworks\n\
    \nThe great thing about frameworks is that they enable your app to take advantage\
    \ of ready-made behaviour. Because bada’s language is C++, bada’s frameworks use\
    \ C++ inheritance to share behaviour between the frameworks and your app. If you\
    \ know your C++, you’ll probably know (at least approximately) how that works,\
    \ but it doesn’t matter if you don’t. The principle is simple: the frameworks\
    \ declare certain methods that your app must implement; the frameworks will call\
    \ these methods, and when they do, your implementations will run.\n\nThe bada\
    \ C++ frameworks use derivation and virtual functions to share responsibilities\
    \ between the framework itself, and apps that use the frameworks. The framework\
    \ base classes that apps derive from provide ready-made implementations of common\
    \ behaviour that all apps will share, as well as behaviour defined in virtual\
    \ methods that may optionally be overridden, and abstract behaviour defined in\
    \ pure virtual methods for which the derived class must provide an implementation.\
    \ Abstract classes are used extensively in bada, particularly to define interface\
    \ classes. See Chapter 4 for more about interface classes and how to use them.\n\
    \n> Note: In C++, derivation (i.e. inheritance) is the generic mechanism that\
    \ allows derived classes to share the behaviour of base classes; and specifically,\
    \ virtual functions (dynamic binding) allow derived classes to extend the behaviour\
    \ of base classes by overriding the base class behaviour. Overriding is not the\
    \ same as overloading, in which methods with the same name but different signatures\
    \ are allowed, and the references are resolved at compile time; virtual methods\
    \ use the virtual keyword and have the same name and signature, and the references\
    \ are resolved at runtime.\n> \n> In C++, pure virtual methods, also known as\
    \ abstract methods, are declared with a special =0; syntax that indicates the\
    \ method has a null body, that is, no implementation; code won’t link until an\
    \ implementation is provided.\n> \n> Pure virtual methods in the base class must\
    \ be implemented by a derived class;¹ other virtual methods of the base class\
    \ have a base class implementation, but optionally may be reimplemented by a derived\
    \ class to override the default behaviour.\n\n¹More precisely, a derived class\
    \ that will be instantiated must implement the pure virtuals of its base class(es).\
    \ Chains of abstract classes are possible, but a class that does not implement\
    \ an inherited pure virtual is itself an abstract class that cannot be instantiated."
  merge: -1
  img_proc: true
- pgno: 93
  md: '# 3.2 Using the UI Framework


    Implementing the application lifecycle effectively and appropriately is one important
    aspect of making the best use of the bada frameworks. A second is using the GUI
    frameworks to create an effective, good-looking, and easy-to-use GUI. The touch
    UI on bada has a host of nice features, and the built-in apps showcase them well.
    In the following sections we take a deeper look at bada’s control and graphics
    classes, which provide the building blocks for creating the app GUI.


    # 3.2.1 Control Hierarchy


    The bada UI classes provide a useful set of ready-made Control types. All UI elements,
    including Frame and Form, derive from the Control class as shown in Figure 3.2
    which shows the most important classes of the Control hierarchy.


    Note that, for reasons of clarity, the diagram does not show all the UI controls
    that derive from Control, but it does show the relationship between Control and
    Container.


    Control is the base class for all GUI elements, and Frame and Form are the app’s
    top-level GUI objects.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_93_0.png)


    Figure 3.2 The Control hierarchy.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# 3.2.2 More about UI Controls


    Forms contain content. Content types include plain text, directly embedded images,
    and standard or custom controls. Controls that derive from the Container class
    can also be containers for nested controls. As well as containing content, controls
    are active and can respond to user events such as touches, multi-touches, and
    gestures.


    As you would expect, bada provides a comprehensive set of standard controls, such
    as buttons, pickers, and edit areas, as well as more specialised controls including
    animations, Flash movies, and overlay panels that enable controls to be layered
    (for example to overlay player-like controls on a video frame).


    Applications can also derive and customise their own controls, if there is no
    suitable standard control that meets the application’s needs.


    All controls must be both drawn and shown in order to display, either synchronously
    using the Draw() and Show() methods, or asynchronously using RequestRedraw().
    Note that the synchronous drawing methods should not be called from within a call-back.
    Instead, use the asynchronous RequestRedraw() method, which returns immediately
    after queuing the redraw request.


    Container controls have an OnDraw() method that is called by the framework before
    any child controls are drawn, enabling any custom drawing to be performed in the
    Container (for example, drawing a bitmap background). Subsequent drawing of child
    controls will overwrite the relevant regions of the Container’s canvas, allowing
    a Container’s background to be drawn behind any controls that populate it.


    > Note: A control only becomes displayable after it has been added to a displayable
    container. Whether a control is displayable will also determine whether its child
    controls, if any, are displayable. For this reason, a general rule is that no
    methods of the control should be called until after it has been added to its container,
    to avoid possible unexpected behaviour, for example related to displayability.


    Drawing is therefore performed in the following order by the framework:


    +   1. Calls the Form’s Draw() method.

    +   2. Calls the Form’s OnDraw() method, since Form is a Container.

    +   3. Calls the Draw() method of the first child control, if any.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '+   4. Calls the OnDraw() method of the first child control, if any, if the
    child is a Container.

    +   5. Calls the Draw() method of the second child control, etc.


    Note that only Container controls have the OnDraw() method.


    | Draw() | Draws the control to the canvas of the containing Window, which will
    normally be the Application Frame, since Frame is Window-derived (but e.g. Form
    is not). |

    | Show() | Copies the Window canvas content to the displayable frame buffer. |

    | RequestRedraw() | Asynchronous method that invokes Draw() and Show(), and returns
    immediately. |

    | OnDraw() | Called by the framework when a Container control is drawn to enable
    any custom drawing to be performed before drawing any nested controls. |


    Shown below is a selection of some of the standard Control-derived classes provided
    by bada, organised by the kind of user interactions you''ll need when you design
    your user interface.


