- pgno: 77
  md: '# Test and Debug on Simulator


    Once your app compiles and can be built without any errors, you can start testing
    by running it in the bada Simulator. The Simulator is very useful for testing
    the principal correctness of your code. Traditionally there was a large discrepancy
    between the behaviour of simulators and real mobile devices. Because of the importance
    of context information, intensive real-world tests had to be on the mobile device
    anyway. The bada Simulator comes very close to the real device. In addition to
    that, it provides an extra tool called the Event Injector (see Figure 2.23), which
    allows injecting sensor events of all kinds into the Simulator. In fact, so too
    can other events such as phone calls, messaging events, network events, and device
    events like low battery or low memory. This helps a lot and makes testing much
    more efficient because many of the real-world context tests can be shifted to
    the less expensive simulator tests.


    The following events can be simulated:


    +   - incoming calls;

    +   - network characteristics and quality (e.g. service level, roaming, or network
    codes);

    +   - transmission of text messages, WAP push⁷, and push notifications;

    +   - location data (latitude and longitude) by choosing on a map or explicitly
    inserting;

    +   - various sensors, such as accelerometer, GPS, magnetic, tilt, proximity,
    or weather;

    +   - device events such as memory or battery level.


    The bada Motion Sensor is a logical sensor that is based on composite data from
    onboard hardware sensors. The Motion Sensor detects predefined movement of the
    phone by the user:


    # Snap


    Rapid one-time back and forth movement of the phone in any of the X, Y, or Z dimensions.
    Three different events are recognised, one for each axis, in each of portrait
    and landscape modes.


    # Shake


    Rapid repeated sideways movement of the phone.


    ⁷WAP is the Wireless Application Protocol, an early initiative to enable the Web
    on mobile devices. From a user perspective WAP has largely been overtaken by the
    ''real'' Web on mobile, but WAP protocols still play an important infrastructure
    role. WAP Push remains the standard for pushing network notifications and setup
    messages to mobile phones.'
  merge: -1
  img_proc: true
