  md: "The AudioRecorder class records audio data from an input source to storage.\
    \ The selection of input device source depends on the current device status. For\
    \ example, if a headset mic device is connected, it is automatically selected\
    \ as an input source. The audio recording format, the maximum recording time,\
    \ and the maximum recording size can be set using the methods in this class.\n\
    \nHaving created an AudioRecorder instance, you will want to implement a listener\
    \ to be informed of appropriate events during the recording process. Osp::Media::IAudioRecorderEventListener\
    \ interface class is available for this. When inheriting from this class you will\
    \ be required to implement methods that will be called in your application to\
    \ inform of recording events.\n\nThis recipe will show how to create one such\
    \ listener and how this can be combined with an AudioRecorder instance to record\
    \ audio to a file. First, we will create an audio recorder listener. This will\
    \ be tied to the AudioRecorder instance to inform our application of AudioRecorder\
    \ events:\n\n```\n```cpp\n#include <FBase.h>\n#include <FMedia.h>\n\nclass MyAudioRecorderListener:\n\
    \    public Osp::Media::IAudioRecorderEventListener\n{\npublic:\n    void OnAudioRecorderStopped(result\
    \ r);\n    void OnAudioRecorderCanceled(result r);\n    void OnAudioRecorderPaused(result\
    \ r);\n    void OnAudioRecorderStarted(result r);\n    void OnAudioRecorderEndReached(\n\
    \        Osp::Media::RecordingEndCondition\n        endCondition);\n    void OnAudioRecorderClosed(result\
    \ r);\n    void OnAudioRecorderErrorOccurred(\n        Osp::Media::RecorderError\
