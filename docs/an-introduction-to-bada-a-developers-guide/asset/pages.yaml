  md: '# 4.1.3 The Layered Model of the bada Platform


    Conceptually, the bada platform is described in terms of four layers. While application
    developers really only need to know the details of the top layer in order to create
    applications, it is useful to know more about the platform, how it’s designed
    and the potential it offers. The four-layer model is shown in Figure 4.1 and we’ll
    explain what’s contained in each layer below.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_124_0.png)


    Figure 4.1 The bada architecture, a four-layer view.


    At the very top of the Figure 4.1 you’ll notice that there are boxes representing
    three kinds of bada applications: device applications that run stand alone on
    the device, service applications that make use of the collaboration features of
    the bada Server (which we’ll explain in more detail later), and web-based and
    Adobe Flash® applications that the bada framework also supports through its standard
    controls. Your application could actually be some combination of all three types.


    The Framework layer consists of the APIs available to application developers,
    divided into the 20 top-level namespaces that are explained throughout this book
    and in detail in Chapter 6. These C++ APIs are the developer’s gateway to the
    functionality of the device. Here you’ll find the classes for implementing the
    architecture of an application, storing and restoring application state, supporting
    basic data types, and accessing system features such as the battery level. The
    namespaces also include classes for creating the application’s UI, 2D and 3D graphics
    and taking advantage of the multimedia features of the device. Through these APIs,
    developers can play and record audio and video, and access the camera, as well
    as take advantage of the motion, vibrator, and other sensors. It’s also home to
    the location namespace, which makes including a fully functional map control in
    your application really simple.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'But it’s the service-oriented namespaces that make bada stand out from other
    platforms. Figure 4.2 shows a more detailed architectural view, illustrating how
    application functionality moves beyond the device to make use of the features
    of the bada Server. The real work of communicating with the server, to implement
    features such as collaboration, commerce, and web services, is done by the components
    in the Service layer.


    Developers use the APIs defined in the Framework layer to access features whether
    they’re implemented purely on the device or with support from the bada Server.
    For example, the Social namespace contains classes to manage the user’s address
    book and calendar on the device, but the Social::Services sub-namespace contains
    a whole set of collaboration services that work with the bada Server, to share
    profile information, access third-party social networking sites, or find buddies
    – a good example being the BuddyFix application.


    Access to third-party sites, such as Facebook and Twitter, would normally involve
    writing complex code to communicate with each site, but developers use only the
    open APIs defined in the Framework layer and let the bada Server take care of
    the details of talking to the specific web service. A full explanation of these
    service-centric features can be found in Chapter 5.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_125_0.png)


    Figure 4.2 The ‘system’ view of bada including the server-assisted APIs.


    The Device layer contains components that provide access to the underlying features
    of the device. Figure 4.2 shows the different blocks of functionality, including
    components to handle communications, access to the file system, security, graphics
    and multimedia. The design of this layer is quite modular, which is a huge advantage
    when it comes to supporting new technologies. For example, support for new audio
    or video codecs, updated cameras, additional sensors, or new communications standards
    could be added by updating a few'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'components rather than making huge changes to the whole of the underlying operating
    system. This makes the bada platform quite dynamic and offers lots of possibilities
    for developers to take advantage of the latest device hardware. All of the functionality
    provided by this layer is accessed by developers using the APIs defined in the
    Framework layer.


    At the bottom is the Kernel layer. The bada platform is designed to run, for instance,
    on Linux or on RTOS kernels, which makes the bada platform very flexible. It also
    offers the possibility of support for a wider range of devices than any other
    mobile platform. That’s a huge potential market for your bada applications.


    # 4.2 bada Coding Idioms


    # 4.2.1 C++ and bada


    Of all current mainstream programming languages, C++ is the most powerful and
    flexible. That doesn’t make it the most popular language. In fact, at the time
    of writing, C++ maintains a steady third place in popularity surveys, behind Java
    and C.¹


    There are good reasons why C++ is unlikely to win a popularity contest. Compared
    with more recent languages (Python, say, or even Java), it has a complex syntax.
    There are several reasons for this. One is its retention of C as a proper language
    subset. Another is the deliberate decision to favour terse and compact (and even
    cryptic) over verbose and transparent. Yet another is the breadth of the language
    – both high-level and low-level and everything in between – supporting procedural,
    object-oriented programming (OOP), and generic (template-based) programming styles.
    And finally, while the previous point suggests maximalist goals (include everybody!),
    C++ takes a very minimalist view of what a programming language should aspire
    to be. Its built-in types are essentially those of C, and there (more or less)
    the language ends. There are no frameworks, or class libraries, included in the
    language proper. (Even the minimalist std.h and stdio.h are strictly optional.)


    For all of these reasons, C++ is not the kind of language that holds your hand.
    This probably gives it a more fearsome reputation than it deserves. But it also
    means that any platform based on C++ must tame the language to suit its own purposes.


    ¹For example, according to the TIOBE Programming Community Index software survey,
    April 2010, see www.tiobe.com/index.php/content/paperinfo/tpci/index.html. Intriguingly,
    in 2010 Java and C have swapped places in the top two places, with C now the most
    popular language, as Java’s popularity share falls. Objective C meanwhile is roaring
    up the table. For comparison: C and Java score around 20%; C++ around 10%; and
    Objective C around 2%.'
