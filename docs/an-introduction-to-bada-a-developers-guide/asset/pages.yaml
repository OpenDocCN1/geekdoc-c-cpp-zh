- pgno: 129
  md: 'To offer the best of both worlds – robust apps that don’t crash and a fully
    capable platform providing native performance – bada imposes some limitations
    on developers by limiting use of some C++ features, in particular:


    +   Platform code in bada uses two-phase construction (though it is not for classes
    you define yourself).


    +   A simple ownership policy is supported: an app is always responsible for deleting
    memory it allocates (every call to new must have a symmetrical call to delete),
    and an app must always delete platform allocated objects returned from a platform
    method named with a trailing N, for example SearchN(); in all other cases, the
    platform takes care of deleting the objects it allocates.


    +   Native C++ strings are discouraged; the bada platform provides a dedicated
    String class.


    +   Native C++ arrays are discouraged; the bada platform provides a dedicated
    Array class.


    +   Standard C++ exceptions are not supported; instead bada has its own lightweight
    exception model.


    # 4.2.5 Native Idioms and Types Tutorials


    It’s time to get practical again.


    When you read through bada code in the SDK tutorials and samples below, you’ll
    see the native types being used in real world contexts, and of course you’ll need
    to use them in your own code.


    The following brief tutorials will get you up to speed with the things that bada
    does differently – and will be a useful reference to come back to as you explore
    the platform more deeply. You may want to bookmark these pages.


    # The Problem of Object Construction


    In C++, like C, memory at runtime is divided between:


    +   static memory, which is assigned by the compiler and is part of the application
    binary at runtime;


    +   stack memory, allocated and freed at runtime by the OS as function activation
    frames for the running program are created and released;


    +   heap memory, allocated and freed dynamically as requested by a program.


    Memory leaks are caused when programs allocate heap memory and fail to release
    it. Because mobile phones typically run for days, weeks or longer without being
    switched off, memory leaks can seriously compromise the phone’s performance. The
    problem is compounded because (relative to the desktop),'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'phones typically have much less RAM, and (in absolute terms) because of the
    power and physical size constraints of phones, memory technologies – for example
    Flash file systems – are slow.


    Unfortunately, in C++ the problem of ensuring that memory is not leaked is more
    complex than it is in C, and requires more than just discipline on the part of
    programmers (i.e. matching every allocation with a deallocation).


    In C++, allocating heap memory may be done either explicitly by the programmer
    with calls to operator new or new[], or implicitly by the compiler as part of
    C++ object creation.


    Unlike C, in which every runtime construct is either static or on the stack or
    on the heap, the parts of a single C++ object may be allocated in one or more
    or all of those allocations, depending on how the class has been coded.³


    Because a C++ class has only one destructor (which will be the default one generated
    by the compiler, if the programmer has not explicitly coded a destructor), while
    it may have many different constructors, destructors must be coded with care.


    The result of all of which is that naive coding in C++ can very easily result
    in memory leaks.


    There are two specific problems that make matters even worse. The first problem
    is that in C++, when a constructor fails, the class’s destructor is not called.


    The problem of memory leaking is, as we have said, a problem with heap memory.
    (Static memory is never a problem, because it is allocated at compile time, and
    stack memory frames are automatically released when the functions with which they
    are associated return).


    A (heap allocated) C++ object is created when the new operator is called on a
    class constructor. The allocated memory must be released with a matching call
    to delete(), that is, allocation, and deallocation must always be symmetrical
    if memory is not to leak. Calling delete() invokes the class destructor. Within
    the destructor, any further memory allocated by the class should be released with
    appropriate calls to delete(). When the destructor returns, the final step performed
    by delete() is to release the memory that was allocated for the object itself.


    This is all straightforward enough. The problem arises if the class constructor
    attempts to allocate memory, for example calling new to create a class member
    that happens to be an object, and the allocation fails. In this case, the destructor
    cannot be called to delete the object, because the object pointer will be null
    (because construction failed), and trying to delete a null pointer will cause
    an exception. But meanwhile, if any allocations did succeed as part of construction
    before the failed allocation occurred, there is no way for either the system or
    the program to free that memory because no pointers exist to it. The allocated
    memory is orphaned.'
  merge: -1
  img_proc: true
- pgno: 131
  md: "On mobile, low memory conditions should be assumed to occur as a matter of\
    \ course. Multitasking, web browsing, playing music, recording and viewing images,\
    \ playing or recording video, and downloading and trying out apps are all part\
    \ of the everyday use for a phone, and may occur in any dynamic pattern of usage.\
    \ Any one may cause a memory usage spike, which if your own app is unlucky enough\
    \ to encounter it, may cause memory to be unavailable to you. Worse, if any program\
    \ running on the device is leaking memory then, over time, a low memory condition\
    \ will become a certainty, and all apps on the device will effectively be compromised\
    \ by the poorest quality app that the user has chosen to run.\n\nLet us assume\
    \ we have a very simple class:\n\n```\nclass SimpleClass;\n```\n\nThen we have\
    \ a more complex class that has objects of the SimpleClass as members.\n\n```\n\
    class ComplexClass\n{\npublic:\n    ComplexClass(void)\n    {\n        p1 = new\
    \ SimpleClass();\n        p2 = new SimpleClass(); // Assume an Out-of-memory error\
    \ occurs here.\n    }\n    ~ComplexClass(void)\n    {\n        delete p1; delete\
    \ p2;\n    }\nprivate:\n    SimpleClass* p1;\n    SimpleClass* p2;\n};\n```\n\n\
    Then we have somewhere some method that instantiates an object of ComplexClass.\n\
    \n```\nvoid AnyClass::SomeMethod()\n{\n    ComplexClass* pComplexClass = new ComplexClass();\n\
    \    // Calls the constructor, which could throw an exception.\n}\n```\n\nIn doing\
    \ so the constructor is invoked. But if an exception happens, the destructor is\
    \ not called and the allocated memory cannot be released resulting in a memory\
    \ leak.\n\nJava developers are spared these scenarios because all dynamic allocated\
    \ memory is managed by the Java runtime (however, Java developers have plenty\
    \ of other problems to make their lives hard)."
