  md: '# Example 2: Using a TimeSpan


    This example shows how time can be represented using a TimeSpan object, and how
    time information can be retrieved from the TimeSpan object and displayed in a
    Label on a Form.


    In this example the time that has elapsed since the device was powered on is retrieved
    from the system using the SystemTime::GetUptime() method and stored in a TimeSpan
    object.


    The following code snippet shows an example of retrieving time information from
    a TimeSpan object and displaying it within labels (see Figure R1.6):


    ```

    TimeSpan timeInterval = 0;


    SystemTime::GetUptime(timeInterval);


    Label* pLabel1 = new Label();

    pLabel1->Construct(Rectangle(20, 20, 440, 100), L"Time since power on");

    AddControl("pLabel1");


    Label* pLabel2 = new Label();

    String label1(L"Hours: ");

    label1.Append(timeInterval.GetHours());

    pLabel2->Construct(Rectangle(20, 100, 440, 100), label1);

    AddControl("pLabel2");


    Label* pLabel3 = new Label();

    String label2(L"Minutes: ");

    label2.Append(timeInterval.GetMinutes());

    pLabel3->Construct(Rectangle(20, 180, 440, 100), label2);

    AddControl("pLabel3");


    Label* pLabel4 = new Label();

    String label3(L"Seconds: ");

    label3.Append(timeInterval.GetSeconds());

    pLabel4->Construct(Rectangle(20, 260, 440, 100), label3);

    AddControl("pLabel4");

    ```


    # Example 3: Calculating a Time Difference


    This example shows how to calculate the difference in time between two DateTime
    objects, and display the resulting time difference in Labels on a Form.


    In this example a difference in time is calculated between the current date and
    time retrieved from the system, and an appointment set for a date and time in
    the future.


