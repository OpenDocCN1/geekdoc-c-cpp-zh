- pgno: 76
  md: "Most interesting, then, is the `<Privileges>` attribute, and its `<Privilege>`\
    \ sub-attributes. In the manifest file above, the single IMAGE privilege is specified:\n\
    \n```\n```xml\n<Privileges>\n    <Privilege>\n        <Name>IMAGE</Name>\n   \
    \ </Privilege>\n</Privileges>\n```\n```\n\nThe format of the declaration here\
    \ is straightforward XML: `<Privileges>` is an attribute, and contains a list\
    \ of `<Privilege>` sub-attributes, each of which is declared using the `<Name>`\
    \ sub-attribute, in this case `<Name>IMAGE</Name>`.⁶ Privileges declare which\
    \ functionality an app offers. If appropriate privileges are not declared, an\
    \ exception will be thrown at runtime the first time the app attempts to use an\
    \ undeclared, privileged API.\n\nMore interesting than how to declare privileges\
    \ is what they mean and what they do. Privileges are important for the security\
    \ mechanisms in bada to ensure privacy (for instance). You can find more information\
    \ about the privilege model in bada in Chapter 4.\n\nThe next XML tag in the manifest\
    \ file is the `<DeviceProfile>`. It declares the minimum system requirements for\
    \ the application. It is all automatically generated by the portal from the information\
    \ the developer provides.\n\nYou can update the manifest in the same way that\
    \ you generate it, using the portal tools.\n\nDeclaring privileges is easy. Just\
    \ remember that whenever you add APIs from a new namespace, you probably need\
    \ to declare a new privilege (and update the libraries you are linking when you\
    \ build).\n\n# Step 2: In the bada IDE/SDK\n\n# Create bada App with the Manifest\
    \ File\n\nAfter you’ve downloaded the manifest file to your hard disk you can\
    \ create a bada app project as described earlier. In the Wizard where you arrive\
    \ at the point to select the manifest file, you should uncheck the default one\
    \ and point the Wizard to the just downloaded manifest.xml on your hard disk.\
    \ The other option – if you already have an existing project with an existing\
    \ manifest file – is to simply overwrite the old manifest file with the new one.\n\
    \n# Program and Build\n\nThe next necessary bit to bring your app to life is actually\
    \ thinking of your logic and programming. When you think your app is in a runnable\
    \ state you can build your bada project in the IDE as described earlier.\n\n⁶Instead\
    \ of ‘attributes’, you can call these ‘properties’ if you prefer."
  merge: -1
