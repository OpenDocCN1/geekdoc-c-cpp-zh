- pgno: 399
  md: 'A network connection is a runtime session for a data network service, configured
    with network account settings. This recipe explains how to create either a default
    or custom network connection.


    # Example 1: Create a Default Network Connection


    To reduce the difficulties in setting up network connections, bada manages the
    default network connection (see Figure R5.1). If you do not specify a network
    connection when your application uses features such as sockets or HTTP, the default
    connection will be used.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_399_0.png)


    Figure R5.1 Create a default network connection.


    The following are the steps for creating and using a default network connection:


    +   1. Request network services without specifying a network connection.

    +   2. The network services receive the request and start the default network
    connection.

    +   3. The network services access a remote network.


    bada handles all of the work in creating a default network connection and all
    you need to do is use the APIs provided by classes such as Net::Socket and Net::Http
    without specifying a network connection. Using the default network connection
    does not require the NET privilege to be set; you only need to ensure that the
    appropriate privileges are set for any services you use such as SNS_SERVICE to
    use the SNS Gateway and HTTP to set up HTTP sessions.


    # Example 2: Create a Custom Network Connection


    If you need to specify a particular configuration in place of the defaults, you
    should create a custom network connection (see Figure R5.2).


    The workflow for creating a custom network connection is as follows:


    +   1. Use a NetAccountManager and NetAccountInfo object to configure the required
    connection settings.

    +   2. Create and start a custom network connection using the custom settings.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '+   3. Request network services with the network connection.

    +   4. Network services accesses the remote network.


    ![](img/a257d5fd53a79a244a20e587cd2f08f6_400_0.png)


    Figure R5.2 Creating a custom network connection.


    The classes required to create a custom connection are part of the Net namespace.
    NetAccountManager and NetAccountInfo encapsulate the information necessary for
    the NetConnection class to create a connection. NetAccountManager is used to get
    the list of NetAccountIds that are later used to construct the NetConnection.


    The NET and NET_ACCOUNT privileges are required to create a custom net connection.


    This recipe consists of the following steps:


    +   1. Implement an INetConnectionEventListener.

    +   2. Construct NetAccountManager object.

    +   3. Get the list of NetAccountIds from NetAccountManager object.

    +   4. You can now start the connection with any of the NetAccountIds provided
    by this list.


    Now we''ll look at the code.


    +   1. Derive your class from INetConnectionEventListener.


    ```

    #include <FNet.h>


    class MyClass :

    public Osp::Net::INetConnectionEventListener

    {

    Osp::Net::NetConnection* pNetConnection;


    void InitiateNetConnection();

    void CloseNetConnection();


    //NetConnection

    void OnNetConnectionStarted(Osp::Net::NetConnection& netConnection,

    result r);

    ```'
