- pgno: 262
  md: "+   1. Retrieve the current value of the `Progress` object.\n+   2. If the\
    \ current value is less than the maximum value, increment the `Progress` value;\
    \ otherwise reset to the minimum value.\n+   3. Request that the `MainForm` is\
    \ redrawn.\n+   4. Start the timer with a timeout interval of 500 ms.\n\nThe following\
    \ code snippet is an example of the implementation of the `OnTimerExpired()` callback\
    \ method:\n\n```\nvoid\nMainForm::OnTimerExpired(Osp::Base::Runtime::Timer& timer)\n\
    {\n    // Retrieve current value of progress bar\n    int currentValue = Progress->GetValue();\n\
    \n    // Increment the progress bar value or reset to minimum\n    if(currentValue\
    \ < PROGRESS_MAX)\n        Progress->SetValue(currentValue+5);\n    else\n   \
    \     Progress->SetValue(PROGRESS_MIN);\n\n    RequestRedraw();\n\n    // Restart\
    \ the 500ms timer\n    timer.Start(500);\n}\n```\n\n# Hints, Pitfalls, and Related\
