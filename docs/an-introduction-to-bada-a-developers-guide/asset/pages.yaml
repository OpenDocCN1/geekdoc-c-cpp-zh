- pgno: 146
  md: 'For each collection type, a templated type is available, for example, StackT,
    QueueT, HashMapT.


    As well as the concrete and template classes, bada provides interface classes
    that allow collections to be manipulated:


    # ICollection


    Defines the collection size, enumerator, and synchronisation method.


    # IEnumerator, IMapEnumerator, IBidirectionalEnumerator


    Enable iteration over Collection and Map types.


    # IList


    Indexable list.


    # IComparer


    Enables comparison of two individual objects.


    # IHashCodeProvider


    A hash map.


    Again, exactly as with the concrete collection classes, a templated version of
    each of the interface classes is provided for use with the templated collection
    classes: for example ICollectionT representing a templated collection IListT,
    IMapT, and so on.


    The difference between the object-based classes and the template-based classes
    is that:


    +   - Object-based collections derive from ICollection, and store objects that
    derive from the Object class.

    +   - Template-based collections derive from ICollectionT<Type>, and should typically
    be used to store C++ primitive types.


    > Note: Object-based collections don’t collect copies of objects (for obvious
    reasons of efficiency); instead they collect pointers. So any object you want
    to put into a collection class must be allocated using operator new. Otherwise,
    if your collection stores a pointer to an automatic variable, its lifetime is
    unpredictable, and it likely will not exist when the collection comes to use it.
    Your app will crash, unpredictably.'
