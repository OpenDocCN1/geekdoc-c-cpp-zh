    # 6.2 How This Chapter Is Organised


    Figure 6.1 shows how each namespace maps to the main areas of functionality in
    bada and should provide a starting point for identifying which namespace contains
    the functionality you need.


    Section 6.3 describes each of the namespaces in alphabetical order, so once you’ve
    identified the functionality you need, it’s easy to find out more details.


