  md: '# 20.3 Sequence modelling


    The basic idea behind the improviser we will develop is sequence modelling. Sequence
    modelling means trying to understand the properties of a sequence. With that understanding,
    you can carry out tasks like predicting the next thing in the sequence or generating
    sequences similar to those in a given dataset. The improviser aims to model sequences
    that you play into it so that it can then generate similar but interestingly different
    sequences in. Sequence modelling is a huge research field in computer science.
    It has applications in many domains, such as financial data modelling, natural
    language processing and audio signalling. In fact, large language models are sequence
    modellers. GPT and similar models ultimately predict the next symbol in a sequence.


    There are many techniques available to describe and model sequences. For example,
    you might define a mathematical relationship such as ‘the next number in a sequence
    will double the number’. That would be a great model if it described your bank
    account. Or you might describe rules, such as if you have a 1, the next number
    is always 3, if you have a 3, the next number is always 1’. That would yield a
    sequence of 1,3,1,3... Moving to the musical domain, you can come up with musically
    meaningful rules such as ‘the sequence only contains notes in the key of C’. To
    generate sequences from that rule, you can just randomly select notes from the
    key of C.


    These kinds of clear rules are easy to understand, but the problem is that many
    real-world sequences are too complex or noisy to allow simple rules for prediction
    and generation. This is where statistical sequence modelling comes in. Statistical
    sequence modelling aims to identify patterns in sequences that include probabilistic
    elements. For example, ‘if the last number was 1, there is a 50% chance that the
    next number will be 2 and a 50% chance it will be 4’. In fact, that is a first-order
    Markov model. First order Markov model exists because it only looks one step back
    in the sequence. You can even have a zero-order Markov model, commonly called
    a probability distribution. A zero-order Markov model might say: There is a 50%
    chance of a 4, a 25% chance of a 2 and a 25% chance of a 1’. Zero order means
    it does not look at the past – it just looks at the distribution of numbers observed
    in the sequence.


    # 20.3.1 Deep networks as sequence modellers


    Before we dive deeper into Markov models in the next section, I will say that
    deep neural networks that generate musical or other sequences like those reviewed
    in Ji et al.’s comprehensive review[21] are also fantastic statistical modellers.
    You could use a deep network to build a musical improviser. In fact, deep'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Background: all sequencers


    neural networks are technically better sequence modellers than Markov models –
    this is why GPT and Bard are neural networks, not Markov models!

    However, the problem with deep neural networks, and the reason I have yet to start
    using them to build improvisers, is that they need a lot of data and time to train,
    and they cannot take new data in real-time. They can respond to your input in
    real-time, but the underlying model will not change or learn in real-time. To
    change the underlying model requires a training phase. If you consider the training
    data actually, you might encounter some problems. For example, if you want your
    improvise using a massive dataset of music written by other people? Perhaps you
    do, maybe you do not, but with deep networks, you do not have a lot of choice.


    Markov models can generate patterns from data gathered from scratch in real-time
    from a single performance if you want, or can feed them from larger datasets.
    The improvise we will build is computationally efficient and can learn on a small
    dataset in real-time. Musicians I have worked with clearly feel that their own
    presence in the music generated by these kinds of models and enjoy interacting
    with them. I am not saying you cannot achieve this with neural networks, but you
    can certainly accomplish this with Markov models, so that is what we shall use.


    # 20.4 Markov models


    So, we are going to use Markov models to model musical sequences. In the previous
    section, I hinted at how Markov models work and mentioned that they can have different
    orders. Let''s start with a sequence consisting of just two different musical
    notes. Imagine you have a sequence as follows:


    > $A, A, B, A, B, A, B, B, B$ (20.1)


    To create a Markov model, we start by calling each of these letters a state. So,
    at steps 1 and 2 in the sequence, the state is ''A''; at step 3, the state is
    ''B''. Then we talk about state transitions. From step 1 to step 2, the state
    transitions from A to A. From steps 2 to 3, the state goes from A to B. It is
    true that A to A is not strictly a transition, as it looks like nothing changed,
    but imagine you are playing musical notes. You play an A, then another A, then
    a B and so on. There are 8 transitions in that sequence:


    > $A \rightarrow A, A \rightarrow B, B \rightarrow A, A \rightarrow B, B \rightarrow
    A, A \rightarrow B, B \rightarrow B, B \rightarrow B$ (20.2)


    We can refer to the state after the transition as an *observation*. From those'
