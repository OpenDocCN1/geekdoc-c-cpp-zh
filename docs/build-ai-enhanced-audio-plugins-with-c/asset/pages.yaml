    What is going here? Why does the order increase up to 3? The MarkovManager object
    maintains a memory of the state as the numbers are fed in. This allows it to build
    the state transition matrix. When it generates, it maintains a separate memory,
    which is the generation state, so the state it will use to query the transition
    matrix with increasing order. You can try sending in new Choices to getEvent.
