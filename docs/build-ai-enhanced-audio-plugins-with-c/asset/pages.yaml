    AudioPluginInstance, AudioProcessorGraph and so. This will allow you to understand
    how to go about launching a plugin’s user interface from a plugin embedded in
    an AudioProcessorGraph inside a node. Figure 18.1 shows the class hierarchy for
    the AudioProcessor classes. As you can see AudioPluginInstance and AudioProcessorGraph
    are both AudioProcessors. So is the application we are working on now, which


