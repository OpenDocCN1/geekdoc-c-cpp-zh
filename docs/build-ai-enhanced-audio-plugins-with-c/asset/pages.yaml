  md: "# 4.4 Working with CMake\n\nI assume you have installed CMake and an IDE. If\
    \ so, we can test if you can create a CMake configuration, use CMake to generate\
    \ an IDE then build it in your IDE. Let's start with a typical hello world program.\
    \ A fully version of this example is described in the repository guide in section\
    \ 39.2.1. You do not have to refer to the repository yet. You will learn more\
    \ if you recreate the example using the following\n\nStart by creating a folder\
    \ for your project. In folder, create a file called CMakeLists.txt (noting the\
    \ case of the letters). Put the following into your CMakeLists.txt:\n\n```\ncmake_minimum_required(VERSION\
    \ 3.0 FATAL_ERROR)\nadd_executable(hello-cmake src/main.cpp)\n```\n\nThat text\
    \ contained set of CMake commands. The command cmake_minimum_required instructs\
    \ CMake to fail if it is not at least version 3.0. The project commands the name.\
    \ The add_executable command adds an executable to the project called hello-cmake,\
    \ which is to be built from the file src/main.cpp.\n\nThe next step is creating\
    \ the src/main.cpp file. Add a folder to your project's folder called src and\
