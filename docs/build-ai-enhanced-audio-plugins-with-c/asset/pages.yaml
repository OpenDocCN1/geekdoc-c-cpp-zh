  md: "# 17.3 Initialise the graph\n\nTo initialise the graph, run the following in\
    \ the constructor for PluginProcessor.h:\n\n```\n//Create basic processors for\
    \ the graph\ninputProc = \n    std::make_unique\n    <juce::AudioProcessorGraph::AudioGraphIOProcessor>\n\
    \        (juce::AudioProcessorGraph::AudioGraphIOProcessor::audioInputNode\n \
    \   );\n\noutputProc = \n    std::make_unique\n    <juce::AudioProcessorGraph::AudioGraphIOProcessor>\n\
    \        (juce::AudioProcessorGraph::AudioGraphIOProcessor::audioOutputNode);\n\
    \nmidiInputProc = \n    std::make_unique\n    <juce::AudioProcessorGraph::AudioGraphIOProcessor>\n\
    \        (juce::AudioProcessorGraph::AudioGraphIOProcessor::midiInputNode);\n\n\
    midiOutputProc = \n    std::make_unique\n    <juce::AudioProcessorGraph::AudioGraphIOProcessor>\n\
    \        (juce::AudioProcessorGraph::AudioGraphIOProcessor::midiOutputNode);\n\
    ```\n\n```\naudioProc->enableAllBuses();\ninputProc->enableAllBuses();\noutputProc->enableAllBuses();\n\
    \n// convert the processors into nodes\ninputNode = audioProc->addNode(std::move(inputProc));\n\
    outputNode = audioProc->addNode(std::move(outputProc));\nmidiInputNode = audioProc->addNode(std::move(midiInputProc));\n\
    midiOutputNode = audioProc->addNode(std::move(midiOutputNode));\n```\n\nThe code\
    \ created a set of unique\\_ptr types, then used std::move to handle the unique\\\
    _ptrs to the nodes. We are getting into some gnarly C++ pointer territory here.\
    \ I mentioned earlier that smart pointers manage dynamically allocated memory\
    \ ensure returned to the operating system when it is no longer needed. Unique\\\
    _ptr do this by allowing only one (or one scope) of the program to access the\
    \ unique\\_ptr at any time. However, only the class we defined the variables in\
    \ access them. They cannot be passed around. If you want another part of the program\
    \ to access a unique\\_ptr, you can pass it over the move function. That is how\
    \ we create the unique\\_ptr, then hand them over"
