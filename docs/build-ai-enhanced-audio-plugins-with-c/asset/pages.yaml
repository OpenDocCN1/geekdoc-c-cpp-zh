  md: 'values. You will need to adjust the network architecture so it can take two
    values instead of one at its input. Eventually, you will run the trained model
    in a plugin. The difference here will be that you need to pass in two values:
    the audio signal and the control parameter setting. Good luck!


    # ### 38.9 What other effects can you model with neural networks?


    Neural networks can model many other types of effects. I do not have space to
    cover any more effects types here, but the general principles of training and
    deployment are undoubtedly transferable. As a bonus, I have provided some starter
    and experimental code for a reverberator based on Christian Steinmetz''s paper[39].
    It is described in the code repo തന്നെ 39.5.27. An area of rapid growth in neural
    effects is differentiable effects. You can find lots of information about those
    in Lee et al.''s review paper[24].


    # ### 38.10 Concluding neural effects ... and the book


    Well done - you have reached the end of neural effects. You may have noticed that
    this was the longest part of the book, something of an epic. I extended it like
    this because I enjoyed exploring all aspects of DSP and neural signal processing
    and wanted to share as much information as possible. I hope you enjoyed the journey,
    too. This is also the end of the book. I have very much enjoyed bringing all of
    this information out of the research papers and GitHub repositories and presenting
    it to you. I hope the book sends you into an exciting future of AI-enhanced audio
    software development.'
