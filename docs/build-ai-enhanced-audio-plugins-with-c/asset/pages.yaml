    # ### 35.2 Batch size


    While discussing data shapes and sizes, let us consider batch_size, which is elsewhere
    in the train.py script, we define a variable called batch_size: how many sequences
    will be processed to update the network parameters. Updating the network parameters
    is what training is all about – adjust the network until it processes the signal
    we want to.


    What is the difference between batch size and sequence length? The sequence length
    dictates how much the network sees of the previous signal when predicting the
    following output. The batch size dictates how much the trainer knows about the
    behaviour of the network with different input signals. Figure illustrates the
    difference between sequence length and batch size. A batch consists of several
    input-output sequence pairs, and after processing a batch, the network''s parameters
    will be adjusted. So, a small batch size means the trainer does not see many examples
    between updates. So, it does not get a very detailed picture of the error surface
    it is exploring. Larger batches give more information about the error surface,
    but that might make it harder to improve because the training ‘signal’ is more
    complex.


    Luckily for us, there are some very detailed research papers which have explored'
