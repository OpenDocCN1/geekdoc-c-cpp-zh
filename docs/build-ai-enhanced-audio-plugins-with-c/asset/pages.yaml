  md: '# 19


    # From plugin host to meta-controller


    This chapter completes the implementation of the plugin meta-controller by explaining
    how to integrate the plugin host with the neural network code from the torchknob.
    The first section discusses querying plugin parameters and filtering out un-needed
    parameters. The following section covers creating a neural network for the plugin
    with the correct number of inputs and outputs. The next section discusses creating
    data by setting the training knob position and selecting plugin presets. The section
    following explains how to control the plugin using the neural network. The chapter
    concludes by mentioning extensions for the meta-controller, such as training dataset
    population, custom UI components, selective parameter control, multiple synthesizer
    hosting, and improved usability with state loading/saving and input features from
    other sources.


