  md: '# Setting up your development environment


    GPUs, training and inference


    If you have attempted to use a machine learning model before, you may have thought
    about the role of the GPU. For example, it is common for artificial intelligence
    researchers to publish executable Python notebooks that you may have experimented
    with one of these. Often notebooks are set up to run on cloud computing services
    such as Google colab². When you run the notebook in the cloud, you will find various
    GPU options available in the user interface.


    So why do machine learning systems use GPUs? This is an interesting question because
    GPUs for machine learning was one of the breakthroughs that enabled the learning
    revolution to begin in the late nights. Geoffrey Hinton, sometimes called ‘Al
    Godfather’, presumably in the spiritual mentor as opposed to crime-boss sense
    was one of the pioneers in the use of GPUs for deep learning. As deep learning
    pioneer GPUs were convenient to program and allowed researchers to train networks
    10 or 20 times faster [23]. In the same paper, the researchers mentioned that
    speech recognition was one of the first applications. So audio processing was
    a core application for deep learning from its inception.


    So machine learning, particularly deep learning, runs faster on GPUs. The original
    purpose of a GPU is to compute parts of the graphics pipeline. There are several
    parts of the graphics pipeline requiring the multiplication of matrices. For example,
    computing lighting effects, applying textures and updating the positions of moving
    objects. GPUs have been designed to compute many multiplications in parallel.
    Unlike CPUs, GPUs have many cores – the GeForce 2070 in my laptop has 2,304 cores,
    whereas the GPU has eight. GPU cores are simpler and more specialised than CPU
    cores. Essential parts of machine learning algorithms can be boiled down to many
    matrix multiplications, and GPUs excel at these.


    At this point, you may worry that you need a powerful GPU to work through the
    practical activities in the book, but that not necessarily the case. First, not
