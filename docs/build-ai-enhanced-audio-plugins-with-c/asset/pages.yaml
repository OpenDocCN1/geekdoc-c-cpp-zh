    | A.A | 0 | 1 (20.6) |

    | A.B | 0.666 | 0.333 |

    | B.A | 0 | 1 |

    | B.B | 0 | 1 |


    As you can see, with the same sequence, we have the richness of the first-order
    model (more observations) with the information of the second-order model (longer
    memory). Figure 20.4 presents a graph-based visualisation of this model. Whilst
    the model looks more complex, it is just a combination of the first- and second-order
    models. Generation is more complicated – the algorithm I use for generation runs
    as follows:


    +   1. Select random state:

    A2. Select the next observation from the state transition matrix using state:

    $A \rightarrow B$\n3. Append observation to previous state:

    A,B

    4. Select next observation from state transition matrix using current state:

    $B \rightarrow A$\n5. Append observation to previous state:

    A,B

    6. Select next state from state transition matrix using current state:

    $A,B, A \rightarrow ?$


    You will notice that we hit a snag at the end – assuming we only have first- and
    second-order matrices, there are no observations available following state ‘A,B,A’.
    At this point, I add the following:


    +   1. If no observations are available, reduce the order of the previous state
    by one, from A,B to B,A

    2. Select observations from state transition matrix using B,A

    3. Back to step 1 until you receive an observation


    The reduction of order continues until observations are available. Earlier, I
    mentioned that sequence models can get stuck in a repetitive state loop, with
    only one possible next state. Consider the following matrix – for several states,
    there is only one next option, i.e. B:'
