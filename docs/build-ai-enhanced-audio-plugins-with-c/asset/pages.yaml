  md: '# Foreword


    I am delighted to present my book on building AI-enhanced audio software. My name
    is Matthew Yee-King, and I work as an educator, musician, and computer music researcher
    at Goldsmiths, University of London. I have written this book because I started
    AI-powered audio plugins myself and found that musicians were much happier using
    plugins than other forms of software as they integrate with their existing tools.
    But there were no detailed instructions on how to integrate machine learning with
    audio in C++ for plugin development... until I hope you enjoy the book and find
    the techniques helpful for your work with AI-enhanced audio software. Here''s
    my bio:


    As an educator, I have taught undergraduate courses in digital signal processing,
    creative audio programming, software engineering, and artificial intelligence
    using languages such as Java, JavaScript, C++, and Python on-campus and online.
    I am the academic director for the first undergraduate programme on the Coursera
    platform, the University of London''s BSc Computer Science programme. In 2023,
    the course has seen over 8,000 students from more than 120 countries.


    As a musician, I have released electronic music on Apex Twin''s Records, Warp
    Records, and others. I have collaborated with many artists, including Finn Peters,
    Alex McLean, and Max Wardener. Tom Jenkins (Squarepus), Matthew Skinner (Smile),
    My live instrument is the drum kit, acoustic or electronic, but I have also worked
    as a sound designer, Super-Collider programmer, and creator of musical AI systems.


    As a computer scientist, I have designed music software and published papers on
    autonomous music agents, automatic sound synthesis, and systems supporting music
    programming. I have worked on research projects as a research engineer, a post-doc,
    a co-I, and a PI. I have collaborated with individuals and research groups around
    the world, including Mark Inferno (my mentor), Elena Fiorucci, Francois Pachet,
    John McCormack, Mick Grierson, Nick Collins, Rebecca Fiebrick, the Sony Computer
    Science Laboratory Paris, the Artificial Intelligence Research Institute, CSIC
    Barcelona, the Department of Human Centred Computing, Monash University Australia,
    and Politecnico di Milano, Italy.


    I would like to thank all the amazingly musicians (especially Gaz, Domenico, Finn,
    Alex, and Max) and researchers I have worked with for inspiring me and, indeed,
    the work on which some of the projects in the book are based.'
