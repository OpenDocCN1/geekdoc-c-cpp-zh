    import torch\nesr = myk_loss.ESRLoss()\ntarget = target * 0.1 # quite different\n\
    output = esr.forward(output, target)\noutput = target * 0.99 # much closer\nprint(esr.forward(output,\
    \ target))\n```\n\nExperiment with some different signals to see how the ESR loss\
    \ comes out.\n\n# 35.6.3 DC offset loss\n\nThe final stage in the loss function\
    \ is a DC offset loss. This punishes the network\nif it generates a DC offset,\
    \ where the output signal appears to be shifted up or\ndown. From our earlier\
    \ experiments with LSTMs, DC offsets are pretty common.\nIf you have worked with\
    \ recognition technology, you will know that DC offsets are\ngerally undesirable.\
