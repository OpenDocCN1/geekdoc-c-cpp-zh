  md: '# 24.3 Quantisation


    If you send the improviser MIDI data from the DAW, it will probably already be
    quantised, meaning that the timing for the notes snaps to a timing grid. The improviser
    will also use this quantised timing for its models. The timing will not be quantised
    if you are playing freely into the plugin. You need to quantise the timing to
    avoid ending up with a primarily low-order model. The reason is that each IOI
    and note duration will be different because it can fall at any point, sample-wise.


    Can you work out a way to quantise the note durations and IOIs? If you quantise
    them, you will get a richer (higher-order) model as there will be more instances
    of each duration. Of course, increasing quantisation also makes the timing more
    ''robotic'', and you might not want robotic timing. I leave it to you to experiment
    with timing.


    # 24.4 Progress check


    At this point, you should have a fully working Markov model-based musical agent
    plugin. It can learn in real-time from a live MIDI feed and generate its output
    at the same time as learning. You should also be able to think more about design
    decisions in the improviser. Are separate models for pitch, IOI and duration a
    good idea? Or will a compound model produce better results for you. Also, you
    should have thought about quantisation. Plenty for you to explore there.'
