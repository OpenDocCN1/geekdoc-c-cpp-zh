  md: '# Setting up your development environment


    to be able to build your software for multiple platforms using different Integrated
    Development Environments (IDEs). We will use the CMake¹ build tool to help us
    generate projects for various IDEs. This will make building the software for different
    hardware and OS platforms possible.


    # CMake


    CMake is the build tool we will use in this book. With CMake, you write a single
    configuration file then you can use it to generate projects for different IDEs.
    In the configuration file, you can specify different targets for the build, such
    as a test program and a main program. You can specify any actions to be taken,
    such as copying files. This makes it a valuable tool for audio application developers
    wishing to support various operating systems, as you can maintain a single CMake
    configuration and codebase and use it to build for multiple platforms.


    # Integrated Development Environment (IDE)


    An IDE is a set of tools that enable a developer to write, build and debug software.
    The IDE will be the hub of your software development activity. Using the CMake
    build tool, you can generate projects for different IDEs from the same codebase.
    Many IDEs are available, but I will cover Xcode for Apple device development,
    Visual Studio for Windows and Visual Studio Code or a custom setup for GNU/Linux
    in this book. In fact, you can also use Visual Code for Windows, Apple and Linux
    development, which allows for a consistent environment across platforms.


    # Codebase


    The codebase is the set of source code files in a project. The build tool and
    some handy macros will allow us to have a single codebase for all platforms.


    # Native program


    Some of the programs you encounter in the book will be compiled into native programs
    in machine code run on particular CPU hardware. We will write these programs using
    the C++ language. Native programs are most appropriate when developers wish to
    integrate directly with plugin and Digital Audio Workstation (DAW) technology.
    For example, VST plugins are native programs. Native programs generally run faster
    than interpreted programs, and that is important for realtime audio applications.


    > https://CMake.org/'
