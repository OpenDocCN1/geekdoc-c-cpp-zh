  md: '# Convolution


    # 28.5 Frequency domain convolution


    The answer to improved convolution performance is to convert the signal and the
    system to a frequency domain representation, to convolve, and then to revert the
    result to the time domain. This is faster the convolution operation becomes a
    simple matrix multiplication in the frequency domain instead of the many array
    scaling and summing steps needed in the time domain. It is beyond the scope of
    this book to explain exactly why these are equivalent, but I will show you an
    example program that convolves in the frequency domain and compare its speed.


    The repo guides the frequency domain convolution program in section 39.5. It uses
    another lightweight, low-dependency library to carry out the time-to-frequency
    domain: Simple-FFT by Dmitry Ivanov2. I have not met Dmitry, unlike Martin Roth
    the library is certainly simple and fast. There are some caveats associated with
    frequency-domain convolution, though. Firstly, the program convolves the whole
    signal in one go, as the impulse response and the signal must be the same length
    to allow the matrix multiplication. For simplicity, my program just zero-pads
    the shorter of the two vectors (signal or system), to make them same length. This
    involves adding zeros to the end of the shorter vector. The second caveat is that
    a FFT algorithm requires the signal''s length to be a power of two. For simplicity,
    I truncated the longer of the signal or system to the nearest power of two below
    its length. The end result of the truncation and zero padding is a system and
    a signal vector of the same size, where the length is a power of two.


    How fast this alternative convolution algorithm could? If I convolve the 124,707
    sample/ 2.28e long loop with an impulse response, the nearest power of two to
    the length of the signal is 65,536. Remember that the time-domain version ran
    fast enough to zero-pad the 25,000 coefficients in real time. The complete time
    required to resize and zero-pad the signal and system, to convert them to the
    frequency domain using the FFT, and then to inverse FFT the result back to a time
    domain is as follows:


    ```

    With IR len 65536 convolved 148608 file in 0.012s

    ```


    So 12ms to convolve 65,536 samples of audio (1.48 seconds) with 65,536 coefficients.
    My Apple M1 Mac Mini completes in 7ms. The time domain version takes 2.012s or
    2,012ms to compute a 65,535 convolution on a 65,536 input, or about 168 times
    as long. This is a remarkable performance boost. Do some experiments to verify
    that the frequency domain convolution is, in fact, doing the same thing


    > 2https://github.com/d1vanov/Simple-FFT'
