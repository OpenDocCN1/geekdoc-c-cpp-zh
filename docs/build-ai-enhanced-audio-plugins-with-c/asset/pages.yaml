  md: '# 23


    # Modelling note onset times


    In this chapter, you will add time modelling to the improviser. You will do this
    using two separate Markov chains: one for note duration and one for ''inter-onset-interval'',
    which is the time that elapses between the start of notes. You learn how the processBlock
    function provides you with MIDI messages with sample-accurate timing. You will
    use this timing data to measure note durations and inter-onset intervals. You
    can then create models of the two aspects of time, which you can use to control
    the behaviour of the note-generating model.


    # 23.1 Note duration and inter-onset-interval


    We are now going to teach the musical agent about timing. Timing is very important
    in music; I have been fortunate to work with musicians with an excellent time
    sense. Knowing when to stop playing is another problem entirely. We will consider
    two facets of timing: how long to play the notes for how long to wait between
    notes. I will refer to these two as note duration and inter-onset interval (IOI).
    Figure 23.1 illustrates these properties of time on a typical piano-roll view.
    You


    ![](img/f36e66929543fe6d506774ef8e004b7e_205_0.png)


    FIGURE 23.1


    Note duration is the length the note plays for. Inter-onset interval is the time
    that elapses between the start of consecutive notes.'
