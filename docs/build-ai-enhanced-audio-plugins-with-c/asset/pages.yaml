    the example, I can play the clean training signal out of a sound card and into
    a small guitar amplifier. Then, I record the output of the amplifier''s speaker
    back into the sound card using a microphone. The recording of the mic would be
    the training output signal. In practice, I achieved more satisfying results when
    I recorded directly from the output jack of the amplifier instead via a mic. Those
    familiar with sound engineering will know this as ‘DIng’ or direct input. DI''s
    signal paths are easier to model than fully reamped signals, as DI''s only contain
    the pre-amplifier and tone signals include the pre-amplifier circuit, the tone
    circuit, the power amplifier circuit, the speaker itself and the mic, the additional
    reflected signal from the room. You could model such a signal path, but as for
    more traditional models ofelling signal paths, you might need a more complex model
    to achieve results.


    If you use recordings for your training data, the model will take longer to train,
    but you might obtain a more thorough model of the effects signal path you are
    capturing. The thoroughness of the model depends not just on the amount of training
    data but also on the variety of timbres in the training signal. The training process
    needs to see what happens to various signals when they pass through your effects
    chain. Training data with a wide range of timbres will allow the trainer to learn
    a more dynamic model since the training data will show how the effects respond
    to different signals.


