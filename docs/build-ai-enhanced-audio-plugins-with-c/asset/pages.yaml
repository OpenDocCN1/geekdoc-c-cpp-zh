    # 14.6 Normalising the network output: softmax


    The neural network outputs can be in all kinds of ranges, depending on the weights
    and biases in the network and the input. To push the outputs into more predictable
    ranges, libtorch provides a few options and softmax is one such option. Softmax
    takes a set of output values and modifies them so they add up to a total of 1
    For the mathematically minded, it can be expressed as follows:


    ```

    $Softmax(x_i) = \frac{exp(x_i)}{\sum_{j}exp(x_j)}$ (14.1)

    ```


    In other words, the softmax value of output $x_i$ is the exponential of output
    divided by the sum of the exponents of all outputs. Let''s run through a calculation
    to make it really clear. Say we had two outputs with values 10.2 and 1.5. We take
    the exponent of those values:


    ```

    $exp(10.2) = 26903.1861$ (14.2)

    ```


    ```

    $exp(1.5) = 4.4817$ (14.3)

    ```


    We sum those values:


    ```

    $exp(10.2) + exp(1.5) = 26907.6678$ (14.4)

    ```'
