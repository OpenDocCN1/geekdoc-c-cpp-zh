  md: '# # 5 Set up libtorch


    The chapter explains how to install and use the libtorch machine learning library.
    You will start by examining a minimal example of a libtorch C++ program. Then
    you will dig into the libtorch installation process and see how to integrate libtorch
    into a simple CMake build. Following that, you will see how to combine libtorch
    and JUCE in a single project. At the end of the chapter, you will be ready to
    experiment with libtorch and neural networks in C++. Please note that these instructions
    are correct and tested on Windows, macOS and Linux at the time of writing the
    book, but there are a few moving parts here that are subject to change. Please
    refer to the repo guide example 39.2.10 which will provide the latest and most
    correct CMake configuration.


    # ## 5.1 What is libtorch?


    Libtorch is an open-source machine learning library that allows you to create,
    train, and use neural network architectures. It is the native core of the popular
    PyTorch library and includes the TorchScript system, which makes it easy to import
    models created using PyTorch. With libtorch''s C++ API, you can easily integrate
    its functionality into your C++ applications to access a comprehensive neural
    network design, training, and inference library. PyTorch, and therefore, libtorch
    is widely used by machine learning developers and researchers, making it a powerful
    tool for those looking to incorporate machine learning into their projects.


    # ## 5.2 Simple libtorch example


    Before you start the installation, I would like to whet your appetite by showing
    you a minimal example of a libtorch C++ program. Consider the following program:'
