    4 |-- 1.var

    5 |-- lstm_size_32_epoch_1_loss_0.7031.pth

    6 |-- lstm_size_32_epoch_3_loss_0.6968.pth

    7 |-- ''rtneural_lstm_size_32_lstm.json

    ```


    There is a file called `lstm_size_32_epoch_3_loss_0.6968.pth`. That is the file
    you want to convert into a TorchScript model file. The following Python code will
    load a model from a pth file and export it using TorchScript:


    ```

    1 import torch

    2 import my_models # make sure this file in the same folder

    ```


