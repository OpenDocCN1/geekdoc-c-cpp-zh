  md: "# Finite Impulse Responses, signals and systems\n\nWe can call that system\
    \ 'one-pole filter'. One-pole because the output calculation only considers a\
    \ single input. Here is a two-pole filter which considers two inputs — the input\
    \ now $x[n]$ and the input at the previous step $x[n-1]$. This time, instead of\
    \ a single coefficient $b$ we have coefficients $b_0$ and $b_1$:\n\n> $y[n] =\
    \ b_0x[n] + b_1x[n-1]$\n\nThen in C++:\n\n```\nint main() {\n    float b = 0.5;\n\
    \    float b1 = 0.5;\n    float x[] = {0.1, -0.1, 0.2}; // signal\n    float y[]\
    \ = {0}; // output\n    for (int n=1;n<3;n++) {\n        y[n] = b0*x[n] + b1*x[n-1];\n\
    \    }\n}\n```\n\nThis is a rudimentary low-pass filter because it averages two\
    \ values, smoothing any large (fast, high frequency) changes. You can create all\
    \ kinds of systems using many poles and zeros. The following expression is a general\
    \ form for $y[n]$ for any number of coefficients. It might look a little intimidating\
    \ with that $\\sum$ sitting there, but it really is just a for-loop. The big $\\\
    sum$ 'sum of' and $i$ is the iterated value, and $i$ from 0 up to $N$, $N$ is\
