    oscillator (the carrier) becomes richer, with additional frequencies appearing
    in its spectrum. The following expressions specify the parameters and components
    of a simple FM synthesis algorithm which involves two oscillators, with example
    values for the parameters:


    ```

    $f_0 = 400 \quad$ base frequency

    $m_i = 0.5 \quad$ modulation index

    $m_d = 100 \quad$ modulation depth

    $m_f = f_0m_i \quad$ the modulator signal at time

    $m = m_d\sin(2\pi m_t) \quad$ the carrier frequency

    $c_f = f_0 + m \quad$ the carrier signal at time

    $c = \sin(2\pi c_t) \quad$ the carrier signal at time

    (9.1)

    ```


