    # 35.2.1 Torch datasets


    The generate function returns a TensorDataset object. It creates that object with
    the following lines in myk.data.py:


    ```

    1 input_tensor = torch_tensor(np.array(input_fragments))

    2 output_tensor = torch_tensor(np.array(output_fragments))

    3 dataset = TensorDataset(input_tensor, output_tensor)

    ```


    There are a couple of things to note: 1) we convert the input and output fragments
    into numpy arrays, and 2) we convert the numpy arrays into torch tensors. The
    first step is optional, as torch tensors can be created from regular Python lists.
    But numpy arrays are a more sophisticated data structure than a basic list, allowing
    for type specification. It is crucial to have control over the data types when
    you are dealing with large datasets. The following code illustrates how you can
    specify the data type in numpy:


    ```

    1 import numpy as np

    2 data = [[1], [2], [3]],[[4], [5]]

    3 data_np = np.array(data, dtype=np.float32)

    ```


    Numpy arrays must also have a regular shape. Consider the following code, which
    will crash:


    ```

    1 import numpy as np

    2 data = [[1], [2], [3]],[[4], [5]]

    3 data_np = np.array(data)

    ```


    Compare it to this code, which will not crash:


    ```

    1 import numpy as np

    2 data = [[1], [2], [3]],[[4], [5], [6]]

    3 data_np = np.array(data)

    ```


    The conversion to a tensor is necessary because tensors are the data structures
    that will accept, as discussed in an earlier chapter.


