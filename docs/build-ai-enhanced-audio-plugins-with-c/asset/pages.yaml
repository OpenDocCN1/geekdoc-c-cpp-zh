    How can you wire your plugin to the graph? The first thing to know is that audio
    plugins are installed to standard locations on your system. When a plugin host
    such as Reaper or Cubase starts up, it scans these locations for new or updated
    plugins. Then the host knows which plugins are available. The AudioPluginHost
