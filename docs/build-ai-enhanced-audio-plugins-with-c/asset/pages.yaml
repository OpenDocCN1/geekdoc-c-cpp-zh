  md: 'Finite Impulse Responses, signals and systems


    characteristics, i.e., it is linear and time-invariant (more on that later), you
    can calculate the system''s output in response to any signal you like.


    Why can you calculate the output of a system, if you have the impulse response?
    The answer is that there is a direct relationship between the coefficients of
    a system ($b_0, b_1$ etc.) and the impulse response. In fact, impulse responses
    are the coefficients, at least for the types of systems we have seen so far. Think
    back to the 2-pole averaging filter we discussed earlier. In the equation and
    we defined the coefficients as 0.5 and 0.5:


    ```

    $$y[n] = 0.5[n] + 0.5[n-1]$ \quad (27.5)$

    ```


    If you put the impulse signal through that, you get $[0.5,0.5]$ out, as shown
    in figure 27.1 — the impulse response is the same as the coefficients. So if we
    can capture an impulse response of a system by sending the impulse signal in and
    recording the output, we can use the output as coefficients and compute the effect
    of that system on any signal. When I first encountered this concept and implemented
    it in code, I was really blown away! Why? because you can capture your own impulse
    responses for effects by passing a click through them and recording the output.
    For example, you can play a click in a room and record the response. You can then
    apply that response to any signal and it will sound as if you played the signal
    in the same room. We will do exactly that in the chapter when we discuss convolution,
    which is the name of this process of applying impulse responses to systems.


    # 27.3 Linear time invariant


    Before we dive in and experiment with convolution, I would like to clarify what
    LTI means. Linearity and time-invariance are important properties in DSP systems
    because they facilitate the process of convolution, wherein you can apply a system
    to any signal given its impulse response, only works for LTI systems. I am going
    into these concepts here because they explain why it is difficult to model value
    guitar amplifiers and distortion pedals, which we will be doing later. Linearity
    means that if you double the input values, the output values will also be doubled.
    It also applies to any other scalar: double, triple, 0.2555 etc. Here is an example
    of linearity and scaling when the system is a simple 0 multiplier, i.e. has impulse
    response $[0.5,0,0,0,0]:'
