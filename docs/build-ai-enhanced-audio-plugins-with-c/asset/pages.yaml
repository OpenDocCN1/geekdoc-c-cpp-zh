    chain, latency is added to the signal due to the buffer used in the audio hardware.
    Depending on how you capture the signal, the latency may or may not be an issue.
    If you play the signal from a DAW and record back to the DAW via the effects you
    are modelling, you will probably be okay. This is because the DAW will automatically
    apply latency compensation based on the buffer size of the audio device. If you
    if you use some other methods to carry out the playback and the clean signal.
    If you are using some external digital effects in your effects chain, these will
    add more latency on top of that added by the sound card and output. Your DAW will
    not be able to compensate for latency caused by external digital effects. Luckily,
