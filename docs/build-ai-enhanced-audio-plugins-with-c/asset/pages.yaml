    FIGURE 31.2

    Four stages to train a neural network: 1: send the test input through the device
    (e.g. amp) you want to model, 2: send the test input through the neural network,
    3: compute the error between the output of the network and amp, 4: update network
    parameters to reduce error using back-propagation. Back to stage 2.


    will use be categorised as supervised machine learning. Supervised because we
    tell the training program what the input and output should be. Machine learning
    because the training program and the neural network determine how to best achieve
    the desired output from the input.

    So, figuring out the parameter settings for a neural network is called ‘training’.
    Training is a bit like filter design, the process we discussed earlier for IIR
    filters wherein we work out the coefficients for the filter to achieve a desired
    frequency response. Figure 31.2 provides an overview of the four-stage neural
    network training procedure. The difference is the way we go about finding the
    parameters.

    The stages shown are are:


    +   1. Send the test input through the device you want to model and capture the
    output

    2. Send the test input through the neural network

    3. Compute the error between the output of the network and device you are modelling

    4. Update the network parameters to reduce the error using back-propagation

    5. Back to 2.'
