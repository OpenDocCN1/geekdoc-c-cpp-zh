    \  loss_result.backward();\n  this->optimiser->step();\n  //Now compute the change\
    \ in loss\n  dloss = ploss - loss;\n  ploss = loss; // prev loss\n  if (i > 0)\
    \ // only after first iteration\n    if (dloss < 0.00001) {\n      std::cout <<\
    \ \"dloss low, exit on \" << i << std::endl;\n      break;\n    }\n}\n```\n\n\
    How many epochs does it take to train in the test program? My test program takes\
