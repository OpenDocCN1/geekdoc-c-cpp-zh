    # 11.9 Learning from the optimiser


    Learning involves computing the error between the network and the correct output,
    then adjusting the network''s parameters so it can achieve a lower error. To do
    that, we need something called an optimiser. Various optimisers are available
    which deal with the learning process in different ways. For example, should the
    error across the whole dataset be considered or is it enough to look at a section
    of the dataset? How much should the network be adjusted over time, as the network
    zones in a good set of parameters? Developing better optimisers, such as the Adam
    optimiser, was an important element in the rise of deep networks during the 2000s
    and 2010s.


