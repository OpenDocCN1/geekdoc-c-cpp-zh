  md: '# Interpreted program


    Some of the programs we write will be interpreted as opposed to compiled. Interpreted
    programs are converted to machine code on the fly instead of being converted into
    machine code before running. We will write interpreted programs in the Python
    language. Interpreted programs are more suited to the kind of experimentation
    one needs when developing machine learning models. It is common for AI researchers
    to provide Python code with their research to allow other people to execute their
    work more easily. It is less common for researchers to provide C++ code, but there
    has been a trend towards this in AI-research in the last few years.


    # Machine learning model


    Machine learning carries out the smart processing associated with artificial intelligence
    systems. A neural network is an example of a machine learning model. You can think
    of a machine learning model as a kind of data processing black box that can learn
    to process data in a way that is useful to users. The structure of the model (inside
    the black box) and its parameters dictate what kind of processing it does. Depending
    on the application, we will sometimes develop the models using Python and sometimes
    C++. Experimenting with model designs and training data in Python is generally
    more straightforward. C++ allows the models to be integrated into native applications
    and plugins so they can be accessed by users.


    # Trained model


    A trained model is a machine learning model that has learnt something valuable.
    The model defines the structure of the machine learning component. Training teaches
    that component to process data in a particular way. The ability to configure through
    learning is the essence of machine learning. Trained models provided by a third
    party are often called pre-trained models. In cases you have heard of OpenAI''s
    infamous GPT model, the ''P'' stands for pre-trained.


    # Inference


    Inference is the process of using a trained model to generate an output. Inference
    does not change the internal configuration of the machine learning model; it just
    passes data through it. Once a model is trained, we will use it for inference.'
  merge: -1
