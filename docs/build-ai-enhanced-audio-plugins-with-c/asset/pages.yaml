  md: '# 30


    # # Waveshapers


    In this chapter, I will guide you through the process of creating distortion effects
    using waveshaping. You will start by implementing simple clip, relu, and sigmoid
    waveshapers available in libtorch as command-line programs to demonstrate the
    basic concepts. Then, you will create a basic JUCE waveshaping plugin that allows
    you to reshape waveforms in real-time. At the end of the chapter, you will see
    how you can combine waveshaping with the other DSP techniques seen in previous
    chapters to construct a complete amplifier emulator as a JUCE plugin.


    # ## 30.1 What is a waveshaper?


    ![](img/f36e66929543fe6d506774ef8e004b7e_259_0.png)


    In a 1979 Computer Music Journal article, computer music pioneer Curtis Roads
    who is the author of the infamous thick Computer Music Tutorial, which should
    proudly grace and bend all serious computer music programmers'' wrote that "The
    terms ''non-linear distortion'' and ''waveshaping'' have yet to be explained in
    these pages". Roads describes waveshaping as the process of passing a signal through
    a typically non-linear transfer function. The transfer function dictates an output
    amplitude given an input amplitude. In 30.2 you can see how various waveshaping
    transfer functions work and how they affect a sine wave test. Note how the waveshaper
    can add additional frequency components to the signal. This is the essence of
    distortion and saturation effects. In programming terms, implementing a waveshaper
    should be as simple as iterating over the signal and calling a function to process
    each sample in the signal. Unlike IIR and FIR filters, it is not necessary to
    maintain a memory of previous inputs or outputs. The interesting part is what
    you put in the body of that transfer function.


    **FIGURE 30.1**nDigital signal processing makes wavesaping each easier than it
    used to be.'
