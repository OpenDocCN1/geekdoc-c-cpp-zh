    # 6.5.1 Problems with packages


    It is common practice for AI researchers and AI music researchers to provide Github
    repositories, along with their papers, the code they used to carry out the experiments.
    They will provide the dataset and a pre-trained model if you are lucky. My experience
    is that even when researchers provide a list of packages with version numbers,
    I encounter problems generally relate to the order in which packages are installed.
    Installing a package also attempts to install its dependencies, which might result
    in a different version of a dependency than the one the researchers used being
    installed. Sometimes, you must manually install the packages in non-alphabetical
    order to get the correct versions, which is not fun. As you move beyond this book
    and experiment with machine learning software repositories you find for yourself,
    you may encounter this problem, but at least I have given you some hints on how
    to solve it.


