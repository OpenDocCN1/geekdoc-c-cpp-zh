  md: '# Build AI-Enhanced Audio Plugins with C++


    Build AI-Enhanced Audio Plugins with C++ explains how to embed artificial intelligence
    technology inside tools that can be used by audio and music professionals, through
    worked examples using Python, C++ and audio APIs which demonstrate how to combine
    technologies to produce professional, AI-enhanced creative tools.


    Alongside a freely accessible source code repository created by the author accompanies
    the book for readers, each chapter is supported by complete example applications
    and projects, including an autonomous music improviser, a neural network-based
    synthesizer meta-programmer and a neural audio effects processor. Detailed instructions
    on how to build each example are also provided, including source code extracts,
    diagrams and background theory.


    This is an essential guide for software developers and programmers of all levels
    looking to integrate AI into their systems, as well as educators and students
    of audio programming, machine learning and software development.


    **Matthew John Yee-King** is a professor in the department of computing at Goldsmiths,
    University of London. He is an experienced educator as well as the programme director
    for the University of London''s online BSc Computer Science degree.'
