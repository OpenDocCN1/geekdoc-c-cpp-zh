  md: '# Faster LSTM with RTNeural


    # 38.6.1 Define the model architecture


    The next step is to define the model architecture – just as we in the command
    RTNeural program. You can add the specification to the PluginProcessor.h file:


    ```

    #include <RTNeural/RTNeural.h>

    using RTLSTMModel32 = RTNeural::ModelT<float, 1, 1,

    RTNeural::LSTMayer<float, 1, 32,

    RTNeural::Dense<float, 32, 1>>;

    ```


    Notice that I have given the model name ''RTLSTMModel32'', which will make it
    clear (to me later!) that it is a 32-unit model. Next, we can add an object of
    that type to the private section of PluginProcessor.h:


    ```

    RTLSTMModel32 lstmModel;

    ```


    # 38.6.2 Load weights into the model


    Let''s add the function to load some weights from a JSON file into that model:


    ```

    // prototype in PluginProcessor.h

    void setupModel(Processor::RTLSTMModel32& model, std::string jsonFile);

    // implementation in PluginProcessor.cpp:

    void testAudioProcessor::setupModel(RTLSTMModel32& model, std::string jsonFile)
    {

    int lstm_units = 32;

    // read in the json file

    std::ifstream jsonStream(jsonFile, std::ifstream::binary);

    llohmann::json modelJson;

    jsonStream >> modelJson;

    // get the layer and check that the weight count is correct

    auto lstm = model.get<LSTM>();

    const int lstm_unit_size = modelJson["lstm.weight_ih_10"].size();

    if (lstm_unit_size != lstm_units) std::cout << "model wants " << lstm_units <<
    " units but JSON file specifies " << lstm_unit_size << " units; if not correct"
    << std::endl; throw std::exception("");

    }

    // load in the lstm weights

    RTNeural::torch_helpers::loadLSTM<float>(modelJson, "lstm.", lstm);

    auto& dense = model.get<Dense<>();

    RTNeural::torch_helpers::loadDense<float>(modelJson, "dense.", dense);

    }

    ```'
