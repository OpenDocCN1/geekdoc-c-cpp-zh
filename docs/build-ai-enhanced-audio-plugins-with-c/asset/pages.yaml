  md: '# Faster LSTM using RTNeural


    Once you have this type defined, you can create an instance of a model of that
    type, and then you load weights into it layer by layer:


    ```

    // create a model using the new type

    MyLSTMType model;

    // create a json object from a file

    std::ifstream jsonStream("lstm_weights.json", std::ifstream::binary);

    lohmann::json modelJson;

    jsonStream >> modelJson;

    // get the lstm layer from the model

    auto &lstm = model.get<LSTM>();

    load the weights from the JSON object into the layer

    RTNeural::torch::loadLSTM<float>(modelJson, "lstm", lstm);

    // get the dense layer

    auto &dense = model.get<Dense>();

    load the weights from the JSON object into the layer

    RTNeural::torch_helpers::loadDense<float>(modelJson, "dense", dense);

    ```


    In the example main.neural.basic.cpp, you can see this in action. I added some
    sanity-checking code that verifies that the number of units in the model is the
    same as the units in the exported JSON. The program creates a model, loads in
    weights, and then passes some numbers through the model.


    # 38.4 RTNeural output validation


    The second C++ program included in the project verifies that the output received
    from the RTNeural model is the same as the output from a TorchScript model exported
    from the same trained model. If you find the target rtneural-vs-script in the
    project and run it, you should output something like this, which compares the
    output received from the RTNeural and the TorchScript versions of the same network
    architectures with the same weights loaded:


    ```

    1 RT: 0.085324 TS: 0.085324

    2 RT: 0.099943 TS: 0.099943

    3 RT: 0.104003 TS: 0.104003

    4 RT: 0.098274 TS: 0.098274

    ```


    As you can see, the output from both models is identical.'
