  md: "# Linear interpolating superknob\n\nI made the superknob large for my user\
    \ interface and placed it at the top of the interface, as shown in figure 13.2.\
    \ You can design however you like.\n\nNow you have the superknob widget displayed\
    \ on the user interface, you need to implement the listener code to respond to\
    \ it and cause a change to the two parameters. In the PluginEditor.cpp code, call\
    \ the sliderValueChanged function. Add an if statement to check if the incoming\
    \ slider value is equal to the address of your superknob widget. In your case,\
    \ the value is called superKnob, so I have some code like this:\n\n```\nif (slider\
    \ == &superknob) {\n  //The user adjusted the superknob\n}\n```\n\nNow your job\
    \ is to take the value from the superknob in the range 0-1 and map it to the range\
    \ specified by each of the sliders. This is just like the equation for a line:\
    \ $y = mx + b$, where $y$ is the value for the slider (i.e. modulation or modulation\
    \ depth), and $x$ is the value of the superknob widget. To calculate $m$ (also\
    \ known as the weight), you need to work out the range for the target slider by\
    \ subtracting its lowest allowed value from its highest permitted value. Calculate\
    \ $b$ (also known as bias), use the getMinValue function:\n\n```\ndouble high\
    \ = modIndexSlider.getMinValue();\ndouble low = modIndexSlider.getMinValue();\n\
    double weight = high - low; // m\ndouble bias = low; // b\n```\n\ngetMax tells\
    \ you where the user placed the high constraint on the three-point slider. Now,\
    \ you can plug weight and bias into the equation and send the value to the target\
    \ slider:\n\n```\ndouble superV = superknob.getValue(); // x\ndouble newV = (superV\
    \ + weight) + bias; // y\nmodIndexSlider.setValue(newV);\n```\n\nRepeat for the\
    \ other slider, called modDepthSlider, in the FM synthesizer example code. You\
    \ should be able to move the superknob dial and see the sliders moving in their\
    \ constrained ranges. You now have your own superknob.\n\n# 13.3 Progress check\n\
    \nYou should be able to explain the concept behind the superknob and how it allows\
    \ a single knob to control multiple parameters at the same time using range"
