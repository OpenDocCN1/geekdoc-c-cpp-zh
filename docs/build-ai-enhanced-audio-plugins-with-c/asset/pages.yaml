  md: "# 27\nFinite Impulse Responses, signals and systems\n\nIn this chapter, I will\
    \ introduce some important digital signal processing (DSP) concepts. It is beyond\
    \ the scope of this book to take a deep dive into the details of traditional digital\
    \ audio effects design, but I am going to provide theoretical and code examples.\
    \ For a detailed treatise on audio effects, I recommend Will Pinkle's book[33].\
    \ Here, I will cover the three main techniques used in digital audio effects and\
    \ connect these to concepts found in neural network architectures. I refer to\
    \ the three techniques as 'DSP trinity': Finite Impulse Response Filters (FIR),\
    \ Infinite Impulse Response Filters (IIR) and wavesapers. In the following sections,\
    \ I will lead you through the basics of digital signal processing, trying to make\
    \ it as accessible as possible by presenting the information in code, visualisations,\
    \ and more traditional mathematical expressions.\n\n# 27.1 Signals and systems\n\
    \nDigital signal processing revolves around the idea of signals and systems. We\
    \ have a digital signal, e.g. an audio signal, and we pass it through some sort\
    \ of digital system, which changes the signal somehow. Considering a single-channel\
    \ audio system, the signal x has a particular value at a certain point in time\
    \ n: x[n]. The signal at the previous time step is x[n-1]. Now let's define a\
    \ system that represents a volume control. We can define the output of the system\
    \ y at time n in terms of the input x and the volume control b:\n\ny[n] = b.x[n]\
    \ (27.1)\n\nIn case you prefer code, here is some code to output y based on input\
    \ x and volume coefficient b:\n\n```\nfloat b = 0.5; // volume level\nfloat x[]\
    \ = {0.1, -0.1, 0.2}; // signal\nfloat y[3]; // output\nfor (int n=0;n<3;++n++){\n\
    \  y[n] = b*x[n];\n}\n```"
  merge: -1
