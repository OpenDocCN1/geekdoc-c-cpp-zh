    the audio library) is included inside your program''s binary. Dynamic linking
    means the library exists as a separate file, and your application stores a reference
    to it. Depending on your platform, dynamically linked libraries are also called
    DLLs, shared objects and dylibs. When you run an application with dynamic links,
    those libraries must be located on the computer running the application. Depending
