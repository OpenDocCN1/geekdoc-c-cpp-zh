    \ train on larger datasets that you can store in memory. The linear regression\
    \ dataset is very small so you can process the entire thing in a single batch.\n\
    \n# 11.10 The training loop\n\nWe must run the training process many times to\
    \ properly train the network, i.e. achieve a low error we have found a decent\
    \ line fit for our dataset's x and y coordinates.\n\n```\nfloat loss = 1000;\n\
    while(loss > 0.5) {\n    torch::Tensor loss_t = torch::mse_loss(in_t, correct_t);\n\
    \    loss = loss_t.item<float>();\n    std::cout << \"Loss: \" << loss << std::endl;\n\
    \    optimizer.zero_grad();\n    loss.backward();\n    optimizer.step();\n}\n\
    ```\n\nPut all together, organising it functions into functions if you wish. Ensure\
