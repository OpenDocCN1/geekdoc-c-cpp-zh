    # 12.3 Inputs and outputs


    Fiebring describes Wekinator''s inputs as ''human actions'', and they can be complex
    things like a facial expression captured via a webcam or a set of slider positions
    on an on-screen user interface. Whatever the human input, it ends up as an array
    of numbers inside *Wekinator*——a frame from a movie is converted to a list of
    many RGB or greyscale values, and an x,y position on a trackpad becomes a list
    of two values.


    The user can configure how many numbers Wekinator generates at its output based
    on their needs. For example, if they have a synthesizer with ten parameters and
    they want to control it using their trackpad, the input would have two numbers
    representing x and y on the trackpad, and the output would have ten digits, for
    each synthesizer parameter.


    # 12.4 The train-infer-train workflow


    The workflow, illustrated in figure 12.2, is a significant innovation in the Wekinator
    system. It is described as interactive machine learning because the user presents
    training data to the machine learning algorithm in an interactive manner. Interactive
    means the user presents training data, trains in real-time, experiments if needed.
    This is different from regular machine learning. In regular machine learning,
    the training is not interactive, and it generally involves a much larger dataset.
    Part of the trick here is knowing that you do not need perfect training with a
    huge dataset to provide a user with a sense of meaningful control. So long as
    something reasonably control-'
