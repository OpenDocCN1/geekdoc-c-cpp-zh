  md: '# 31


    # Introduction to neural guitar amplifier

    emulation


    In this chapter, I will give you a high-level overview of the process of creating
    a guitar amplifier emulation using a neural network. Through the process of training,
    neural networks can learn to emulate the complex non-linear behaviours of tube
    amplifiers and other guitar gear. I will explain key concepts like how training
    data guides the network parameters and how back-propagation enables the network
    to learn. At the end of the chapter, you will have developed a greater understanding
    of training a neural network to model a guitar amplifier, ready for the practical
    implementation in the following chapter.


    # 31.1 From grey, white and black boxes to neural networks


    In review of Neural Network techniques for guitar amplifier emulation, Vanhatalo
    et al. describe three general approaches to guitar amp emulation: white-box, grey-box
    and black-box[43]. White-box emulation takes account of the low-level behaviour
    of the electrical circuits involved. It includes techniques such as Wave Digital
    Modelling, which models the flow of current through circuit components[10]. On
    the other hand, black-box modelling is not concerned with the fundamental nature
    of the system; it is only concerned with its response to a given input. Which
    category fits the DSP techniques we have looking at? Take a moment to consider.
    If we classify the convolutional reverb algorithm as a black box. This algorithm
    does not concern itself with the ''how'' of acoustic spaces, nearly the ''what''
    of their impulse responses. How waveforms and IR filters


    Grey-box models sit between black- and white-box, typically consisting of several
    black-box models chained together. The selection of modules in a grey-box model
    is informed by the high-level components of the system it is trying to emulate.
    The three-part amp model you saw in the previous chapters is a grey-box model.
    Whilst no low-level circuit information is used, each module aims to emu'
  merge: -1
  pgno: 272
- img_proc: true
  md: '# Introduction to neural guitar amplifier emulation 255


    late a specific, high-level part of a real amplifier, e.g. the pre-amp or the
    speaker cabinet.


    There are established techniques for white, grey and black-box modelling, but
    they have limitations which neural networks can overcome. Typical black-box models
    are not necessarily able to cope with the highly non-linear behaviour of certain
    circuits found in guitar amplifiers, especially when they include valves. Low-level
    white-box circuit modelling, whilst it can model complex, non-linear signal processing
    behaviours, requires knowledge and understanding of the circuits in a given device,
    making its implementation complex and highly skilled. The resulting models might
    be computationally expensive and challenging to deploy in a music technology context.
    Grey-box models are more manageable than white-box models to design as they abstract
    some of the details of the low-level circuitry but still require complex signal
    processing chains. Grey-box models can also suffer from the limitations of their
    black-box sub-components.


    Neural networks are powerful black-box models that model complex non-linear behaviours
    of many different circuits. So, capture some of the advantages of white and black-box
    models. A fundamental feature of neural networks is that they learn to emulate
    circuits via a process called training, such as a clean guitar signal and an output,
    such as a distorted guitar signal recorded from an amplifier, a neural network
    can learn the transformation from input to output and generalise it to any input.
    This is conceptually similar to the idea of convolution seen before, but it goes
    further because it can model a much greater range of audio transformations than
    simple convolution can.


    # 31.11 Trainable amp modellers already exist


    For completeness, it is worth noting that user-trainable systems such as the Kemper
    Profiling Amplifier exist. The Kemper does not presently use neural networks as
    far as I can tell; I peruse it uses classical signal processing. But these kinds
    of amp modellers do work very well – according to a 2020 research study, expert
    listeners find it difficult to differentiate between recordings made with modelled
    amplifiers and real guitar amplifiers[11]. However, the dynamic, phenomenological
    experiences of the guitar players making the recordings were not considered. Unlike
    the existing, non-neural network systems are generally considered the next generation
    of amplifier modelling technology, even with robust proof of their superiority
    to existing systems.'
