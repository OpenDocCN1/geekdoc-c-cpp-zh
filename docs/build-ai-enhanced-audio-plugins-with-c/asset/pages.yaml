  md: '# 36


    # The LSTM training loop


    In this chapter, I will take you through the LSTM training loop. The training
    loop is the block of code that carries out the actual training of the neural network,
    where its parameters are gradually adjusted until it processes the signal correctly.
    This training loop has some interesting features that work around some of the
    problems encountered by researchers working on training LSTM networks, for example,
    using a warm-up step and the exotic-sounding truncated backpropagation through
    time.


    # 36.1 Overview of the training loop


    At this point, you have seen many of the data preparation, the neural network
    model and the loss function, but you have yet to see the fine details of the training
    loop, which puts all of these elements into action. The main training loop code
    is train.py 39.5.23. After setting up the data and the model, as previously discussed,
    it prepares for training by setting up a folder to save model snapshots as training
    progresses. The folder is a sub-folder of the log dir generated by Summary-Writer:


    +   1 writer = SummaryWriter(comment=''32 node LSTM amp'')

    2 model_save_dir = writer.get_logdir() + "/saved_models/"

    3 os.makedirs(os.path.dirname(model_save_dir), exist_ok=True)


    The next section goes into the main flow of the training loop, which is graphically
    in this diagram, you will see how each epoch breaks the data into batches, computing
    loss for each batch and updating the network parameters. There is a function called
    myk.train.epoch_interval, which does all the work involved in a training epoch.
    More on that below.


    After the epoch completes, the losses are logged for display in the tensorboard.
    Then various checks occur: save the model weights if the validation loss is a
    new record, exit if there has been no new record for too long, and exit if there
    have been more than ‘max.epochs’ epochs. If the tests do not end the script, it
    runs another epoch.'
