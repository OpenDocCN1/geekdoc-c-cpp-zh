  md: '# 20

    # Background: all about sequencers


    In this part of the book, you will build an autonomous music improviser. The music
    improviser is a plugin that receives MIDI data, models the data and generates

    IDI data in the style of the previously received input data. You can think of
    interacting with the improviser as having a musical conversation with yourself.
    Before we get into the details of building the improviser, in this chapter, I
    will provide some background information on the field of algorithmic composition
    and its related offshoot, musical agents. You will discover a vast treasure trove
    from decades of research into analysing and generating music. I will then explain
    the algorithm you will use to implement the improviser: the variable order Markov
    model. I will compare the model to others, such as deep learning systems, and
    explain why I have chosen this technique.


    # 20.1 Beyond the sequencer


    ![](img/f36e66929543fe6d506774ef8e004b7e_176_0.png)


    I would like to start by placing the improviser in a kind of ''taxonomy'' of music
    technology. In present-day music production, it is generally accepted that the
    primary forms of technology are covered by the following-list: traditional instruments,
    digital audio workstations (DAWs), plugins, synthesizers, sequencers, samplers,
    mixing tools, recording hardware and MIDI and other controllers[36, 1]. These
    categories are not mutually exclusive – some technology crosses into general,
    and the technology might be software or hardware. I would place the improviser
    in the ''sequencer'' category, though it will also be a plugin. But, as the title
    of this section, it goes beyond the sequencer – it is a kind of smart sequencer
    which can generate new sequences based on the sequences you feed it.


    How far are modern sequencers from steam-powered pianos?'
  merge: -1
  pgno: 176
- img_proc: true
  md: 'Background: all about sequencers


    ![](img/f36e66929543fe6d506774ef8e004b7e_177_0.png)


    # FIGURE 20.2


    My own experience interacting with AI improvisers. Left panel: playing with Alex
    McLean in Canute, with an AI improviser adding more percussion. Right panel: lidecoding
    an AI improviser in a performance with musician Finn Peters.


    To contextualise the improviser more fully, we need to look beyond commercial
    music technology towards new music technology. Algorithmic composition is a well-established
    area of research in music technology, and it involves the generation of musical
    sequences via some specified procedure. Stories of algorithmic composition''s
    rich history commonly start with Mozart''s dice game, where the composer writes
    several fragments of music and then assigns each fragment from 1 to 6. A series
    of dice select the order in which the fragments appear in the resulting composition.


    Fast-forward to the 20th century, the first composition generated algorithmically
    using a computer is generally reported as the ''Illiac Suite'' by Hiller and Isaacson
    in 1957[16]. The Illiac Suite utilised several algorithmic composition techniques,
    including sampling musical notes from probability distributions and Markov models,
    which select notes based on previous notes. You will learn much more about Markov
    models as you work through the following few chapters. Other composers who pioneered
    the use of computers and saw the potential of algorithmic processes such as probability-based
    methods include Xenakis and Koenig. You should seek Koenig''s work, as such Function
    Blau – there are some fascinating and patterns to be found.


    The development of algorithmic composition from the Illiac Suite until now follows
    with the rapid development seen in artificial intelligence and machine learning.
    After early experiments in the 50s and 60s, the 1970s saw the development of formalisms
    such as musical grammars, which allowed the definition of rules to identify and
    generate stylistically correct music[37, 19]. The 1980s saw the development of
    more advanced Markov modelling techniques[8], building on work from speech recognition
    research. The work on Markov modelling'
  merge: -1
  pgno: 177
- img_proc: true
  md: '# Background: all about sequencers


    continues until the present day, many researchers are switching to deep neural
    network methods. Pachet et al. have done some of the most sophisticated work with
    Markov models, using them to carry out musical style transfer in the Flow Machines
    in the 2010s[13].


    The 1990s saw the use of dynamical systems techniques, chaos and cellular automata,
    e.g.[27]. The 1990s also saw algorithmic composition researchers using evolutionary
    computation, the emerging trend in computational problem-solving at their. For
    example: GenJazz jazz generator¹. As an aside, I began experimenting with evolutionary
    techniques applied to sound synthesizer during my master''s degree in the 1990s.
    I reimplemented some of work using the Web Audio API in the mid 2010s! I then
    went to carry out my doctoral research using evolutionary techniques to program
    synthesizers[48], eventually switching to deep neural network techniques in the
    2010s[49]. Automated sound synthesizer programming is not exactly algorithmic
    composition,


    Returning to the main thread, we have reached the early 2000s, which saw the culmination
    of techniques such as musical graphs, genetic algorithms and Markov modeling.
    This is very much a pitted history here. I do not want to get bogged down in a
    literature review here. For further reading, there are many review articles available
    in open access, e.g.[15] and Niehaus''s 2009 book provides plenty of detail on
    techniques through the deep learning era[30]. Speaking of deep learning, many
    areas of applied computer science, including algorithmic composition, entered
    the deep learning era in the 2010s, and there has been a lot of work on algorithmic
    composition since then. In fact, it has been an ''endless stream'' according to
    Ji et al, in 2020 comprehensive review of deep music generation[21]. As well as
    that review paper, Briot''s article series reviewing deep learning techniques
    for music generation is an excellent starting point for further reading[4].


