    # 22.6 Sending MIDI notes from the Markov plugin to another plugin


    The improviser plugin is intended to be a MIDI effect, so a typical set-up is
    that it sits between a source of MIDI data and a synthesiser that can play. Figure
    22.3 illustrates this set-up, with the MIDI plugin processing MIDI before it goes
    to the Dexed synthesiser. To make your plugin you just need to add note to the
    midiMessages buffer to the plugin''s processBlock function. Think of it like a
    train arriving at a station. The train arrives in your plugin; you process any
    messages that come on the train; you then add any messages you want to send to
    the following plugin. The train leaves your processBlock and goes to the next
    one in the train. The following code shows how you to read a note from the pitchModel
    and then add it to the midiMessages buffer:


