  md: '# Installing and using CMake


    for the various IDEs. This is conceptually similar to how we used Procer. We are
    swapping out Procer for CMake. The command output should also show you which generator
    is the default. The default generator on Windows 10 system is ''Visual Studio
    2017''. It also lists ''Visual Studio 16 2019'' as an option. The default on macOS
    and Ubuntu systems is ''Unix Makefiles'', but the Mac lists ''Xcode''. To generate
    the project for a specific target, specify that target using the option:


    ```

    # Windows/ Visual Studio version:

    cmake -G "Visual Studio 17 2022" -B build

    # macOS/ Xcode version

    cmake -G "Xcode" -B build

    # Linux/ Makefile version

    cmake -G "Unix Makefiles" -B build

    ```


    The B option tells CMake to create a folder build and to output its generated
    project into that folder. The full stop at the end (''.'') tells it that the CMake
    configuration file is in the current folder. So this command should create a folder
    called containing your IDE project.


    # 4.5 CMake command-line build: any platform


    It is time to build the target. The simplest way to build the CMake project is
    by running a CMake command like this:


    ```

    cmake -B build

    cmake --build build

    ```


    Those commands will generate a folder ''build'' and then build the project into
    that folder. Whilst that is the simplest possible command sequence to build a
    CMake project, CMake actually generates multiple forms of the build. For the debug
    build (no compiler optimisations, debug flags set, assertions asserted):


    ```

    cmake --build build --config Debug

    ```


    Now to carry out the release build (compiler optimisations on, no debug flags,
    assertions not asserted):


    ```

    cmake --build build --config Release

    ```


    Note that for this simple project, running the second build command will wipe
    out the previously build debug-mode executable.'
