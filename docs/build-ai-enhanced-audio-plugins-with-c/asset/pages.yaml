  md: '# #12


    # ## The meta-controller


    This chapter introduces the AI-music system called the meta-controller which you
    will be building for the next few chapters. The meta-controller system allows
    you to control many parameters on one or more instruments and effects simultaneously
    using set of powerful ''meta-controls''. The meta-controller is a variant of Rebecca
    Fiebrink''s Wekinator, built using C++ and the libtorch machine learning library;
    the difference is that the meta-controller is specialised for controlling standard
    plugin instruments and effects. This chapter describes the original Wekinator
    system and its workflow, as well as describing some previous variants that people
    have created such as the learner.js library. At the end of the chapter you should
    have a clearer idea about Wekinator and the meta-controller''s interactive machine-learning
    workflows.


    # ### 12.1 What are we going to build?


    The system we will build is a meta-controller for synthesizers and effects. In
    a sentence, a meta-controller is a system that allows us to control many parameters
    on one or more instruments and effects simultaneously with a smaller number of
    controls. For example, with a meta-controller, you can map positions on a laptop
    trackpad to presets on a synthesizer, then morph between these presets by moving
    between positions on the trackpad. The meta-controller can figure out what the
    synthesizer''s parameters should be between the presets you have mapped to the
    trackpad. In fact it can infer the synthesis parameters for any arbitrary position
    on the trackpad.


    ![](img/f36e66929543fe6d506774ef8e004b7e_116_0.png)


    **Figure 12.1**

    The meta-controller uses a neural network for new methods of synthesizer sound
    exploration.


    The meta-controller we create will be able to host native plugins. This means
    anyone using it can control whichever plugins they installed on their system.
    The meta-controller will allow you to control more than one plu-'
  merge: -1
