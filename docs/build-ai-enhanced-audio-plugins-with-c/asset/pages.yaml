  md: 'Using regression for synthesizer control


    # 10.3 Neural networks and linear regression


    Now that you understand what linear regression is (estimating the slope and intercept
    point of one or more lines) and how it can be used for synthesizer control (mapping
    between parameters), it is time to learn how to carry out linear regression using
    a neural network. Those familiar with statistical analysis using languages as
    R and Python might think that a neural network is an overly sophisticated tool
    for this task. There are a couple of reasons for using neural networks though:
    1) they provide a convenient workflow for users to iteratively specify a mapping,
    and 2) unlike more straightforward methods, they can scale to the more demanding
    task of many-to-many non-linear mapping that we might want to carry out later,
    with a very similar workflow. The scalability has been one of the drivers of success
    for neural networks.


    # 10.4 Feed-forward neural networks


    A common type of neural network is a feed-forward neural network. Numbers come
    in one end, and numbers come out of the response. From the outside, it is just
    like a function in C++ where the inputs are the function parameters and the outputs
    are the return value. Unlike a regular neural network starts off knowing what
    exact computations it needs to get from the input to the output. It must learn
    what the computation is. Learning functions is what machine learning is all about.
    But we should not get ahead of ourselves. Before we can consider how a neural
    network


    ![](img/f36e66929543fe6d506774ef8e004b7e_103_0.png)


    **FIGURE 10.4** A neural network applies a function to its input.


    how that mapping allows it to calculate the outputs based on the inputs the simple
    feed-forward neural network shown in figure 10. What is the mysterious process?
    It turns out that in simple feed-forward neural networks, the process is just
    the same as the definition of a straight line, in other words, the output $y$
    scaled and summed with another value ($y = mx + b$). The difference is that we
    change the names of the variables. The scaling value $m$ is called a *weight*
    and the adding value is called a *bias*. So $y = wx + b$.'
