    # 8.3 The processBlock function


    Processing audio in blocks is a common paradigm for audio programming. You can
    think of it like a single carriage train entering a station. The train stops,
    and passengers are processed. Some get on, some get off. another train arrives.
    Your plugin is the station, and the passengers are the audio buffer. Depending
    on the type of plugin you are creating, you will need to do different things with
    the audio buffer or block. If you are making an audio effect that processes an
    existing signal, you will take the data from the buffer, change the numbers, and
    then write the adjusted numbers back to the block. If you are building a synthesizer,
    you will ignore your numbers arriving in the block and just synthesize your own
    numbers. A plugin synthesizer is illustrated in figure 8.2. It is essential to
    process the block quickly, as the audio block will travel to the audio output.
    The audio output produces a constant stream of audio. There will be dropouts if
    you do not process your block quickly enough.


    ![](img/f36e66929543fe6d506774ef8e004b7e_83_0.png)


    > FIGURE 8.2

    A synthesizer plugin loads data into the incoming blocks.


    The processBlock function you do has the following signature:


    ```

    void processBlock (juce::AudioBuffer<float>&,

    juce::MidiBuffer&);

    ```


    You can see that it receives an audio buffer and a MIDI buffer. In the case of
    a synthesizer, the audio buffer provides a place to write the audio output of
    the synthesizer. The MIDI buffer provides a place to receive MIDI messages that
    the synthesizer needs to process.'
