  md: '# Data shapes, LSTM models and loss functions 306


    data. The loss function needs to capture pertinent information about the signal
    to guide the training towards the correct settings for the network. Figure 35.3
    illustrates an example of a loss that can be easily calculated. In this case,
    the loss is the distance between the target signal and the signal received from
    the network. This is an example of perhaps the simplest possible loss function
    – the Euclidean distance. However, it is not the most appropriate for training
    models to emulate guitar amplifiers.


    Designing loss functions appropriate for your problem is something of an art.
    Alec Wright describes a complex loss function in his paper about non-linear guitar
    amp emulation, which we are re-implementing here[45]. Wright''s loss function
    consists of three stages, which he found effective in guiding the training process.
    Let''s consider each of those in turn, but before we, I point out that all the
    loss functions are written using torch functions, as that means they can be computed
    using torch''s parallelisation capabilities where the hardware is available.


    # 35.6 Pre-emphasis filter


    The first stage in Wright''s loss function is a pre-emphasis filter. This is a
    highpass filter that removes some of the low-end from the signal. Removing the
    lower end from the later loss stages is biased towards matching the mid and high
    frequencies. According to the research paper, Wright found errors in the mid and
    high frequencies to be a problem during training without the filter. Of course,
    it is wonderful high-frequency harmonics that guitars want to hear. The pre-emphasis
    filter is implemented in the file my.loss using a torch convolutional layer. But
    on examining Wright''s code, there are no example coefficients shown that would
    create the high pass filter. It is more common to use IIR filters, not FIR, for
    high pass filtering as they require fewer coefficients (as you saw in the preceding
    chapters DSP), but the code uses an FIR filter. I also noted that in the example
    Wright provides, the pre-emphasis filter is not enabled. In my test runs with
    my re-working of Wright''s code, I was able to achieve good performance (sonically
    speaking) without the pre-emphasis filter. So, we can ignore the pre-emphasis
    filter.


    # 35.62 Error to signal loss


    The next stage after the pre-emphasis filter is the error-to-signal ratio (ESR).
    The ESR is similar to the distance metric seen in figure 35.3, but it factors
    in the magnitude of the signal. This means that small losses on quiet signals
    are significant


    > 1https://github.com/Alec-Wright/Automated-GuitarAmpModelling/tree/main/Configs'
