- img_proc: true
  md: '# Data shapes, LSTM models and loss functions 297


    The input and output flows are pretty straightforward, but what exactly does the
    sequence length do here? Regarding the dataset preparation, the audio files are
    concatenated into two long sequences of samples, for the input and one for the
    output. Then, they are chopped into sub-sequences with the length you specify
    in the sequence length parameter.


    For example, imagine we have 180 seconds of audio at 44,100Hz in the input folder
    with a matching, processed signal in the output folder. If you ask for a sequence
    length of 0.5s, you will receive 360 sequences with a length of 22,050 for the
    input and the same for the output. The sequence length you choose then has an
    effect on the training process. The longer the sequence, the more information
    the trainer will have about how the system behaves over time.


    To put that into precise terms, the purpose of the LSTM model is to produce the
    correct output sample for the input sample. If you have a sequence length of one
    sample, when you are training, the network only gets one sample at a time, and
    it has to guess what the output should be. This might be okay for a wavesaper-type
    effect – wavesh take one input and produce one output; you do not know any other
    inputs. But what about the delay and filter effects we have seen in previous chapters?
    They often take account of several inputs. Then consider modelling complex analogue
    circuits such as valves – valves are quite ‘stateful’, which is partly what provides
    their lively tone. As is the way with neural networks, experimentation can lead
    you to the best setting. A good starting point for sequence length is 0.5s, meaning
    the neural network sees 0.5s worth of input samples and has to predict the following
    output sample.


    #  35.1 Block size


    Before we move on, let''s return to an important plugin concept: block size. The
    block size is the number of samples processed in each call to processBlock when
    the plugin is running. How does the sequence length interact with the block size
    when the LSTM model is running in a plugin? For example, assuming a sample rate
    of 44,100Hz, your sequence length during training might be 22,050 samples. Then,
    when you ultimately run the network in a plugin, it will have a block size of,
    say, 1024 samples. If we framed the network with 22,050 previous samples, but
    the block size is 1024 samples, what is going on here?


    The trick is remembering that in blockBlock, retain the LSTM state between each
    call to processBlock. This means that an LSTM running in a plugin has access via
    the LSTM''s internal memory cells to some representation of the previous sequence
    going back to when the plugin started! Way more than 0.5s, potentially. This is
    the unpredictability of feedback in action. Fortunately, during training, the
    LSTM learns to focus on that 0.5s of previous audio because it does'
  merge: -1
