  md: '# Setting up your development environment


    # 2.2 Setting up for C++ development


    At this point, you should be familiar with the purposes of the critical components
    you will encounter in your development environment. Now it is time to put that
    knowledge into practice by setting up the components on your machine(s) and attempting
    to build and run some programs.


    ![](img/f36e66929543fe6d506774ef8e004b7e_36_0.png)


    **FIGURE 2.3** Setting your development environment involves complex machinery
    and lots of steps.


    I have taught programming for many years in several languages. My experience has
    been that getting the first step can be a frustrating step. The reason is that
    the programmer needs to engage with many complex tools and concepts, even though
    they have not written a line of code yet. This problem is especially true when
    working in an IDE. Even we, are dealing with two different libraries, JUCE and
    libortch and potentially, cross-platform!


    So, I want, the reader, to know that the next few steps can go wrong and be quite
    frustrating, but stick with it you will have all the tools humming away nicely.
    At the end of this section, I have created a list of common issues people encounter
    with the development environment setup process along with possible solutions.


    If you already have an IDE installed and can compile and run C++ programs, it
    is still worth reading through this section, as a few special steps are required
    for the projects in this book. For example, you might need to become more familiar
    with JUCE, CMake or libort and how they work together.


    As for all software setup and configuration instructions in the book, minor variations
    between operating systems and software versions might cause glitches, when new
    software versions are released. If you encounter any glitches, the best thing
    to do is to post an issue on the GitHub page for the course materials.


    We will start with the essential tools that allow us to build software: an IDE
    and the tools for C++ development. What you do here depends on the operating system(s)
    and hardware you have available to you. Instructions are here for all three operating
    systems supported by the book. You can skip the sections for the operating systems
    you are not using.'
