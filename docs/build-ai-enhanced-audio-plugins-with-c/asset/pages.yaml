  md: '# 38


    # Faster LSTM using RTNeural


    In this chapter, you will learn how to make your neural network process audio
    faster using the RTNeural inferencing engine. You will find out why RTNeural exists
    and who created it. Then, you will learn how to export your model''s weights to
    a JSON file, which can be read back in order to use an RTNeural network. You will
    see a comparison of RTNeural and TorchScript, showing that models with the same
    weights and architecture in both systems output the same values. You will see
    that RTNeural models run two or three times faster than TorchScript models. Finally,
    you will see how you can deploy RTNeural in a JUCE plugin, which is the conclusion
    of our technical work with neural effects.


    # 38.1 What is RTNeural?


    If you experimented with different-sized LSTMs in the previous section, you might
    have concluded that TorchScript needs to be faster for your needs. Luckily, RTNeural
    exists, and it can run neural networks faster than TorchScript. RTNeural is a
    neural inferencing library written in C++ by Jatin Chowdhury and released in 2021[6].
    RTNeural implements some common types of neural network components, such as LSTM
    units, convolutional units, and so on, in efficient C++ code. The implementation
    is efficient but also visible to the compiler, allowing it to further optimise.
    RTNeural can only perform inferencing (the forward function) - it does not implement
    training capabilities. This means you need to train in PyTorch (or tensorflow)
    and export the trained model''s weights in a special JSON format that RTNeural
    can understand.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# Exporting model weights


    Before you dive in and swap TorchScript for RTNeural in your project, let'' start
    with a command-line test program that demonstrates how to create an RTNeural ''clone''
    of a torch model. The code for this example is described in section 39.25. After
    open that project in your IDE. You will find a Python folder and a CMake / C++
    project. In the Python folder, there is a script called export.py that is very
    similar to the one at the start of this chapter in section 37.1. In fact, the
    only additional line is the call to save_rtneural. This generates a JSON file
    from the model weights. The JSON file is how we will send the weights over RTNeural.
    The JSON file looks like this - essentially a dictionary with several arrays of
    floating points:


    ```

    {"lstm.weight_ih_l": [[0.0794324095825138], [0.03175497050503711], [0.07416573168472202],
    [0.0253373834475078]],2, [-0.02624839653823303]}

    ```


    That JSON is generated by the my_models.SimpleLSTM function save_for_rtneural,
    and it has a key for each layer in the network, along with the parameter settings
    for each


    # Defining models


    Next, you will find two files in the src folder. main_rtneural_basic.cpp and main_torchscript_vs_rtneural.cpp.
    The first is a minimal example of defining an RTNeural model and then loading
    network parameters from a JSON file. To define a model, you need some code like
    this:


    ```

    const int lstm_units = 64;

    using MyLSTMType = RTNeural::ModelT<float, 1, 1>;

    RTNeural::LSTMLayer<float, 1, lstm_units> model;

    ```


    That is a complex type specifier - let''s break it apart. This line sets up a
    new type of model called MyLSTMType. You can call whatever you want. The new model
    will produce floats and have one input and one output.


    ```

    using MyLSTMType = RTNeural::ModelT<float, 1, 1>;

    ```


    The following two lines specify the layers: an LSTM layer with input and ''lstm_units''
    units produced by a Dense layer with lstm_units inputs and one output.


    ```

    RTNeural::LSTMLayer<float, 1, lstm_units>,

    RTNeural::DenseT<float, lstm_units, 1>;

    ```'
