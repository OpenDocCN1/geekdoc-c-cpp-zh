  md: '# Polyphonic Markov model


    # 25.8 Play-only mode


    Once your model has learned some musical patterns, you might want to be able to
    generate from the model without adding any more information to its state transition
    matrix (remember those?). This functionality should actually be relatively straightforward
    to implement. You need to switch on or off the bit of code in processBlock that
    calls putEvent on the Markov model. That is the part where the model learns.


    You can achieve that by adding a ''learning on-off'' toggle to your user interface
    and adding functions to your PluginProcessor to switch on or off calls to putEvent
    function. I will leave you to work that one out yourself.


    # 25.9 Loading and saving models


    Another helpful feature is the ability to load and save models. If your model
    generates some really musical output, you might want to keep it for later. In
    fact, there is an expectation with plugins that the plugin will retain its state
    when you close and re-open a DAW project. You do not expect to re-program all
    your synths and effects every time you load a DAW project.


    A basic implementation would allow you to export models as files from the plugin
    and then load those files back again. A better solution would automatically load
    and save the model by implementing the getStateInformation and setStateInformation
    functions, which are part of the plugin standard. If you implement these functions
    they save and restore the model to and from the sent data, the plugin will start
    with a trained model when you re-open a project in your DAW or other plugin host.
    You can call getAsString setupModelFromString on MarkovManager to convert the
    models into strings. Then, you can concatenate the three models into a single
    string and convert it to the juce::MemoryBlock needed for state saving. I will
    leave that for you to implement.'
