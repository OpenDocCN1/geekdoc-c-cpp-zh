  md: '# 4.10.2 Customise the CMakeLists.txt file work for


    You must apply some customisations to make CMakeLists.txt file work for you. Firstly,
    CMake needs to know JUCE is on your system to build your project and access the
    CMake macros. Update the add_subdirectory command on line 3 to point at your JUCE
    directory. The command is written like this:


    ```

    add_subdirectory(''../../JUCE/JUCE)

    ```


    The first ''../../JUCE'' tells CMake where JUCE can be found. I kept JUCE two
    folders up from my current project, so I specify ''../''. You can put any path
    you like there. The second part, ''../'', defines where JUCE will be copied to
    your header folder. You can find it as it is.


    Next, the project title ''minimal_plugin'' in the CMakeLists.txt file, replace
    it with your chosen project title. This can be any string compatible with CMake''s
    project naming conventions. You can find and replace in your code editor to do
    it. Find the following commands need to be edited to your new project name:


    ```

    project(minimal_plugin -> your_plugin)

    juce_add_plugin(minimal_plugin -> your_plugin)

    juce_generate_header(minimal_plugin) -> etc.

    target_compile_definitions(minimal_plugin)

    target_link_libraries(minimal_plugin)

    ```


    Now you need to change the properties the plugin will report to your host. These
    are the company name and plugin identifiers your DAW displays when you search
    for plugins. In the section ''juce.add_plugin'', change the following properties:


    ```

    COMPANY_NAME Yee-Ying # change to your company name

    PLUGIN_MANUFACTURER_CODE York # make one up!

    PLUGIN_CODE Act # change to what your plugins needs a unique code

    PRODUCT_NAME "minimal.plugin" # make one up!

    ```


    # 4.10.3 Recap of JUCE, CMake and plugins


    To recap, here is what you need to build a plugin using CMake:


    +   1. A CMakeLists.txt file containing the text specified above, edited to suit
    your system and names

    2. A src folder containing the PluginProcessor and PluginEditor cpp and header
    files, the same ones generated by Projucer when you create a Basic project

    3. That''s it!'
