  md: '# Using regression for synthesizer control


    The logical next question is - how do you work out to put the line?

    First, you can consider that you can specify a line as follows:

    $y = mx + b$

    y$ is the y coordinate, $x$ is the x coordinate, $m$ is the gradient of the slope
    and $c$ is the intercept on the y axis. These values are illustrated in Figure
    10.2. So the main job of a linear regression function is to compute $m$ and $b$.
    If you have $m$ and $b$, you can calculate $y$ for any $x$. The best line will
    have the smallest total error between itself and the set of known data points.
    If the points are not on a straight line, the best line will not go through all
    the points, so the linear regression function has to minimise the error between
    the points and the line. Once you have estimated the intercept and gradient values
    $a$ and $m$ that define the line, you can estimate any $y$ given an $x$ value.
    Simple!


    # 10.2.1 Regression or interpolation?


    Regression and interpolation are related processes that aim to determine what
    the data does between the known points. The difference is that interpolation requires
    the resulting line goes through all the data points, and regression does not.
    Simple linear interpolation is not suitable for noisy data as a single line cannot
    pass through all the data points. There are more complex forms of interpolation
    that can handle more complex data, but for now, we will focus on the more ''heuristic''
    regression.


    # 10.2.2 Regression and synthesizer control


    What does this do with synthesizer parameter control, though? As mentioned above,
    the meta-controller lets you control several parameters from a single controller.
    If the meta-controller worked like the simple regression example above, it would
    estimate one parameter (the $y$ value) given the control value (the $x$ value).
    That is pointless - it is not much use to map one parameter to another parameter.
    What we want to do with the meta-controller is map one parameter (e.g., a single
    slider) to control many parameters on the synthesizer. To do that, we need to
    go into higher dimensions. That sounds mind-bending, but all it means that we
    are estimating more than one line. The slider value ($x$) maps to multiple lines
    or multiple parameters. Each line has its own intercept point and gradient, allowing
    differently calibrated control of each parameter. Figure 10.3 illustrates how,
    with two lines, we can estimate values for two parameters given a single input.
    This mapping can be referred to as one-to-many, as one value controls several
    others.


    One-to-many mapping is already possible in commercial synthesizers. The ''Super-knob''
    on the Yamaha ModX synthesizer can be mapped to multiple parameters. You can map
    a single knob control (the Super-knob) such that it controls'
