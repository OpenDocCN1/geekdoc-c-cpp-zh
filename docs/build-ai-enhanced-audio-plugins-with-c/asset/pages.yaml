    effects in music production during the 1970s. Yoganathan and Chapman wrote an
    interesting article relating this music production to electroacoustic practice
    occurring at a similar point in time but in a very different context[50].


    Returning to the topic of digital signal processing, the think to know how IIR
    and feedback is compared to FIR and convolution, it allows you to create more
    drastic filtering and delay effects with far fewer coefficients. Figure 29.2 illustrates
    this, showing finite and infinite two-pole impulse responses, where the infinite
    two-pole is far more complex. This means IIR filters are more efficient to run.


    As an example, in the early days of DSP-based filters for music production, it
    was impossible to convolve, finite impulse responses such as room reverb responses
    with signals in real time. Part of this was computational complexity and was the
    cost of the memory needed to store the impulse responses.


    Instead of FIR, early-time digital reverbs such as 1979''s famous Model 224 from
    Lexington, used IIR extensively. Convolution and FIR were only available for non-real
    time use. It was not until 1990 that DSP hardware was sufficiently fast to allow
    for convolutional reverbs. The Sony DRE S777 was a £20,000, 2U rack-mount unit
    which could load impulse responses from a CD-ROM and Which on Sony Sound magazine
    described as ''Bulky, heavy and ''hot'' but ''Stunningly believable room signatures¹


    IIR filters are also used extensively in digital sound synthesizers where filters
    with musical characteristics such as strong resonance peaks are desirable, as
    IIR filters are excellent for this kind of applications. This is especially true
    when


    > ¹https://www.oundsound.com/reviews/sony-dre-s777'
