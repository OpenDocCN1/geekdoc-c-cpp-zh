  md: '# Placing plugins in an AudioProcessGraph structure


    now. You can find AudioPluginHost in the extras folder of the JUCE distribution.
    Build it and run it. Figure 17.1 presents a simple example of a graph you

    create with the AudioProcessorGraph. In that example are MIDI in in out

    nodes and in out nodes. Two plugin nodes are embedded in the graph:

    s synthesizer and an effects unit.


    Both plugins receive MIDI from the MIDI-in node allowing to be controlled. The
    MIDI-in is also wired to the MIDI-out a kind of MIDI-thru for those familiar with
    onboard synthesizers. The audio-in is not wired to anything.

    Audio from the synthesizer node passes to the effects node and then to the

    audio-out.


    # 17.2 Add fields for AudioProcessorGraph


    The first step is add some new variables to the PluginProcessor to allow for

    t AudioProcessorGraph. You will notice that in the list of variables below there

    are AudioPluginInstance variables and Node :: Ptr variables. Conceptually, the

    Nodes are wrappers around the AudioPluginInstances. You create the AudioPluginInstances,
    then pass them to the Nodes which manage them. There are

    few programming techniques you can use to make them work in a memory

    leak-resistant manner. Let''s take a look at the variables, which you should

    add the private section of the PluginProcessor.h file


    ```

    // The graph

    1 std::unique_ptr<juce::AudioProcessorGraph> audioProcGraph;

    n4 // graph components: processors

    5 std::unique_ptr<juce::AudioPluginInstance> inputProc;

    6 std::unique_ptr<juce::AudioPluginInstance> outputProc;

    7 std::unique_ptr<juce::AudioPluginInstance> midiInputProc;

    8 std::unique_ptr<juce::AudioPluginInstance> midiOutProc;

    9 // graph components: nodes that wrap the processors

    10 jude::AudioProcessorGraph::Ptr pluginNode;

    11 jude::AudioProcessorGraph::Ptr inputNode;

    12 jude::AudioProcessorGraph::Ptr outputNode;

    13 jude::AudioProcessorGraph::Node::Ptr midiNode;

    14 jude::AudioProcessorGraph::Node::Ptr midiOutNode;

    ```


    The AudioPluginInstance variables are unique_ptrs and the graph nodes are

    Node::Ptrs. More on that shortly.'
