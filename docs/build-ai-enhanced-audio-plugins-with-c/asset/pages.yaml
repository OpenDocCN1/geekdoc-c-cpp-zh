  md: '# Modelling note duration


    # 24.1.1 Design decisions for the improviser


    I would pause to note that I have made a design decision for my improviser. I
    have decided to model note durations independently from note pitches. They are
    in two separate models. I have chosen to set things up this way because it will
    allow the model to associate note patterns with note patterns that were not necessarily
    associated with the actual data. For me, this has creative merit. But it could
    be more technically perfect sequence modelling; better sequence modelling would
    create a compound state combining note duration and note pitch (and anything else
    we model later). What do you think? If the improviser is more complete, you can
    experiment with these ideas.


    # 24.2 Generating note durations from the model


    Now you have a model of the note durations, how can you use it to dictate the
    duration of the notes played by the improviser? It is easier than working with
    IOI data! The answer is to use the model to decide how the off-notes will occur
    in the future instead of hardcoding the value. This is how we have been setting
    note-offs so (this code could be in generateNotesFromModel):


    ```

    // get a pitch from the pitch model

    int note = std::stoi(pitchModel.get(true));

    juce::MidiMessage nOn = juce::MidiMessage::noteOn(1,

    note,0.5f);

    generatedMessages.add(nOn, 0);

    // set the note-off time to one second in the future

    offOffTimes[note] = elapsedSamples + getSampleRate();

    ```


    The last line dictates the length of the note, which is hardcoded to one second.
    Try, this line, which queries the note duration for a length:


    ```

    unsigned int duration = std::stoi(noteDurationModel.get(true));

    offOffTimes[note] = elapsedSamples + duration;

    ```


    Experiment with the plugin - sends sequences of long and short notes to see if
    it is correctly modelling note duration. The AudioPluginHost MIDI Logger to check
    the raw MIDI output. You can see a fully working version of the plugin with monophonic
    pitch, IOI and duration modelling in the repo section 39.4.5.'
