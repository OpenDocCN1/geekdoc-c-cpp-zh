    # # Show a plugin’s user interface


    The final functional change we will make to our plugin host before we switch back
    to working on the machine learning side is to display the user interface for the
    plugin. This chapter explains how to display the user interface for any plugin.
    One of the features of the various plugin APIs (VST3, AudioUnit, etc.) is that
    they allow the plugin to have a custom user interface. This is the interface you
    see when you load your DAW. JUCE allows you to write a custom GUI for your plugins
    using the JUCE GUI widgets. Commercial and other plugins have their own ways of
    implementing the GUI, including animated graphics, 3D, etc. How can we show this
    user interface using JUCE? The solution presented here is to pop up a free-floating
    window containing the user interface. To achieve that, you are going to explore
    the JUCE API a little more and define a new class.


