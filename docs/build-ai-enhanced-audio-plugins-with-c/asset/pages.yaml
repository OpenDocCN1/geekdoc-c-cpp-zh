    \ The impulse signal is a single, maximum amplitude sample followed by silence.\
    \ You can see it in the far left plot in figure 27.1. It sounds like a very short\
    \ click. Figure 27.1 illustrates the impulse responses for the three systems we\
    \ have seen so far. Why are impulse responses useful? The trick is that once you\
