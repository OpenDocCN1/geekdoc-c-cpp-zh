  md: '# # Introduction to the book


    Welcome to ‘Build AI-Enhanced Audio Plugins with C++!’ You are about to embark
    on a journey into a world of advanced technology, which will be an essential part
    of the next generation of audio software. In this chapter, I will introduce the
    general area of AI-music technology and then set out the book''s main aims. I
    will identify different types of people: audio developers, student programmers,
    engineers, educators and so on explain how each group can get the best out of
    the book. I will explain that you can use any of the large amounts of code I have
    written for the book however. I will also explain the dual licensing model used
    by the JUCE library. I will finish with a straightforward, working definition
    of artificial intelligence.


    # 1.1 Exciting times for artificial intelligence


    ![](img/f36e66929543fe6d506774ef8e004b7e_20_0.png)


    As I write this book, we are in exciting times for the progress of artificial
    intelligence (AI). AI theorist Hans Moravec presents a compelling view of the
    progress of AI where he places human competencies such as picking up a cup, composing
    a symphony and so forth within a mountainous landscape he calls a ‘landscape of
    human competencies’ [29]. Complex or highly valued competencies are situated on
    higher peaks, although people may disagree on what should go where.


    FIGURE 1.1

    Mountainous landscape depicting musical competencies, with the water of AI rising
    to consume them.


    In Moravec''s landscape of human competencies, artificial intelligence is a sea
    washing around and rising up if the water rises above the position of a human
    competency, AI has that competency. Right now, there is no doubt that the sea
    is rising, especially given recent advances in deep neural networks. Game playing
    is a popular area for AI researchers, and it can provide some perspective on the
    position of the water level. Chess is underwater[20]'
