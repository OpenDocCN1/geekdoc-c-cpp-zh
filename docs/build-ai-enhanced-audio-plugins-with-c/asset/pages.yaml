    # 9.4 Plugin parameters


    One of the underlying plugin APIs we have yet to examine the plugin parameters.
    The concept of plugin parameters is that any plugin can expose a list of parameters
    to its host. With those parameters, the host can carry out tasks like parameter
    automation. Parameters are also the basis for presets. Think about the FM plugin
    – it has two parameters (if we ignore the frequency control). The modulation index
    and the modulation depth. Currently, the only way to change those parameters is
    via the plugin''s user interface. A host cannot see these parameters for a plugin.


    You can see the parameters your installed plugins expose to the host using AudioPluginHost.
    Figure 9.2 shows how you can right-click on a plugin in AudioPluginHost and choose
    to view its parameters as a simple slider interface. The parameter user interface
    is not ideal for editing hundreds of settings, but it shows what the host can
    see about the plugin''s parameters. If you do the same thing your FM plugin, you
    will see it does not expose any parameters. Let''s fix that!'
