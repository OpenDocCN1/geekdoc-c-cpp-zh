  md: "Faster LSTM using RTNeural\n\n# 38.5 RTNeural performance\n\nI tested the performance\
    \ of RTNeural by creating two-layer LSTM $\rightarrow$ Dense networks with increasing\
    \ numbers of LSTM units. I passed 44,100 values through the networks multiple\
    \ times and computed the average time taken. Compared to an equivalent TorchScript\
    \ network, the RTNeural networks run two or three times as fast. If you are inclined,\
    \ you can repeat my experiment using the code (performance.cpp) you can find in\
    \ the project section 39.5.25. Performance figures also show similar results in\
    \ Chowdhury's RTNeural paper[6].\n\nThere are some limitations to RTNeural. The\
    \ main ones are that only a subset of the available torch modules, and its performance\
    \ gain vs TorchScript decreases as the network size increases.\n\nThere are other\
    \ neural network inference engines available. For example, ONNX, Google's Magenta\
    \ team have even provided plugins that run the neural network code in an embedded\
    \ javascript runtime, exploiting the capability of tensorflow.js to run accelerated\
    \ in a WebGL context. It is left to the reader to investigate other\n\n# 38.6\
    \ JUCE plugin using RTNeural\n\nTo complete our work with RTNeural, you will deploy\
    \ an RTNeural model inside a JUCE plugin. You can start with a basic JUCE/ CMake\
    \ plugin project – you do not need libtorch in this project. The project in section\
    \ 39.2.2 is a good starting point. Open up the project folder and add these two\
    \ lines to CMakeLists.txt:\n\n```\n# you should have this line already\nadd_subdirectory(../JUCE\
    \ ..)\n# add these two lines below:\nadd_subdirectory(../RTNeural ${CMAKE_CURRENT_BINARY_DIR}/RTNeural)\n\
    include_directories(../RTNeural)\n```\n\nAssuming you have the above project's\
    \ folder called RTNeural containing a clone of the RTNeural GitHub repository.\
    \ It should already be there if you are working with the code for the book. Next,\
    \ change the PLUGINCODE and PLUGIN_NAME properties in CMakeLists.txt as you see\
    \ fit. You should also ensure that IS_SYN is set to FALSE so your plugin can be\
    \ an effects processor. You can attempt a test build to verify you have your RTNeural\
    \ and JUCE paths set correctly."
