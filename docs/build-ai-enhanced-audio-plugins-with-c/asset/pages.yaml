    \ 0.07);\nfor (auto n=0; n<x.size(); ++n) {\n    float yn = 0;\n    // weighted\
    \ sum of previous inputs\n    for (auto bn=0; bn<b.size(); ++bn) {\n        yn\
    \ += b[bn] * x[n-bn]; // acting on input\n    }\n    // weighted sum of previous\
    \ outputs\n    for (auto an=0; an<a.size(); ++an) {\n        yn -= a[an] * y[n-an];\
    \ // acting on output\n    }\n    y[n] = yn;\n}\nmy_tiny::saveWav(y, 1, 44100,\
    \ \"../../audio/iir_test.wav\");\n```\n\n# 29.5 Frequency responses\n\nLooking\
    \ at the variety code in the previous sections, you might wonder how you know\
    \ what the coefficients should be. This was easy for the FIR filters as the coefficients\
    \ were exactly the impulse response. For FIR filters, if you can obtain the impulse\
    \ response of a system, then you can convert any signal with that system. This\
    \ is not true for IIR systems. The general process of identifying IIR filter coefficients\
    \ is referred to ‘Filter Design’. A full exploration of classical filter design\
    \ techniques is beyond the scope of this book, but to give you some idea of the\
    \ process, you usually start with a frequency response, which is a numerical description\
    \ of how the filter you design affects different frequencies in the signal. E.g.\
    \ does it remove low frequencies? How much? What is the slope?"
