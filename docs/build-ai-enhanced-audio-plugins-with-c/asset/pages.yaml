    program in 2008[47]. Back then, you could ask the plugin for a list of parameters,
    and you would receive an array of strings and metadata for the parameters. Then
    you could set parameters by passing float values in the range 0-1. This is more
    or less how it works in JUCE now. But things are a made a little more complex
    be'
