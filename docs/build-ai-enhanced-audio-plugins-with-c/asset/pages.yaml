    This may look like a matrix to you two-dimensional, rectangular data structure.
    In fact, it is a matrix. You can think of tensors as matrices that are not limited
    to two dimensions. The simplest is a single number or a scalar; the next simplest
    is a one-dimensional list of numbers or a vector; then a two-dimensional structure
    like a matrix and on three dimensions and beyond. Great, but how do you get this
