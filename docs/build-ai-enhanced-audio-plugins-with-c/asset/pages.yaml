  md: "it into a state transition matrix containing probabilities of each possible\
    \ transition. Then, try to generate a new sequence using your state transition\
    \ matrix.\n\n# 20.5 Higher order models\n\nThe next step in complexity is to increase\
    \ the order of the model beyond the first order. First order means we look at\
    \ one previous step. Second order looks at two previous steps, but how does that\
    \ work?\nGoing back to our original sequence:\n\n```\n$A, A, B, A, B, A, B, B$\
    \ (20.4)\n```\n\nSecond-order modelling looks at the observations following states\
    \ that are made from two letters:\n\n```\n$A, A \rightarrow B$\n$A, B \rightarrow\
    \ A$\n$B, A \rightarrow B$\n$A, B \rightarrow A$\n$B, A \rightarrow B$\n$A, B\
    \ \rightarrow B$\n$B, B \rightarrow B$\n```\n\nAs a state transition matrix, you\
    \ have:\n\n| A | B |\n|---|---|\n| A,A | 0 | 1 |\n| A,B | 0.666 | 0.333 |\n| B,A\
    \ | 0 | 1 |\n| B,B | 0 | 1 | (20.5)\n\nTo generate this second-order model, you\
    \ would typically choose a two-letter state from the left column, sample from\
    \ its possible next states. The next state you choose is pushed on the end of\
    \ the previous state, and the order state is dropped, so you retain a two-letter\
    \ state. In terms of data structures, this is a FIFO stack. With the probabilities\
    \ in the matrix above, generated sequences would not be particularly interesting\
    \ as you usually end generating lists of Bs. Sequence modelers getting stuck in\
    \ a repetitive state like in a musical context is not desirable. Well, maybe for\
    \ techno fans. I will explain how I work around that shortly.\nnYou can operate\
    \ in whatever order you like, up to the length of your sequence"
