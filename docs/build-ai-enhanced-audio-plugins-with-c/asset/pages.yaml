  md: '# Common development environment setup problems


    This section provides solutions for common problems people encounter when setting
    up their development environment and building applications.


    **Problem** The IDE does not recognise anything about JUCE when I generate a new
    project from Proucer.


    **Solution** This can happen if you generate a project with Projurer and later
    move the JUCE files to a different location. To verify your setup, try generating
    a new project from Proucer, checking the module setup and building it. If that
    works, you can return to your non-working project in Projurer and determine what
    differs from the newly generated project.


    **Problem** Visual Studio complains about the v143 (or higher) tooltip not being
    installed when you try to build a project.


    **Solution** Re-run the Visual Studio Installer and select the C++ packages with
    143 (or higher) in their titles. Or you can choose a different platform toolset
    from Projurer''s Visual Studio exporter configuration.


    **Problem** The IDE build completely fails on a newly created Projurer project.


    **Solution** This can happen if you do not have the appropriate components installed
    with your IDE. For Visual Studio, you need the components shown earlier in this
    section. For Xcode, you need to install the Xcode command line tools to work with
    C++. For Linux, you need the build-essentials (Debian) or equivalent for your
    distribution.


    **Problem** Building with libtorch / JUCE combination complains that a reference
    to `null` is ambiguous.


    **Solution** This is caused by including the module JuceHeader.JuceHeader calls
    `using namespace juce`, which puts all JUCE definitions and in the global namespace;
    libtorch puts some things there that then clash with the JUCE names. The solution
    is to include the individual JUCE headers you need instead of the complete JuceHeader.h
    file.


    **Problem** The compiler does not seem to understand basic code syntax, such as
    initializer lists on constructors.


    **Solution** I have observed this when building projects on a Mac using Visual
    Studio Code. It can be caused by the default C++ version being pre- C++11.'
