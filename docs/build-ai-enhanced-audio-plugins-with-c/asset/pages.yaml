    ```\ndef forward(self, output, target):\n    loss = torch.add(torch.mean(target,\
    \ 0), -torch.mean(\n        output, 2))\n    loss = torch.mean(loss)\n    energy\
    \ = torch.mean(torch.pow(target, 2)) + self.epsilon\n    loss = torch.div(loss,\
    \ energy)\n    return loss\n```\n\nHere is some code to experiment with DC offset\
