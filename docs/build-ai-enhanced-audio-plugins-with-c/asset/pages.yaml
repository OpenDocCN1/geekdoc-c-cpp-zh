  md: '# Introduction to the book


    projects but if you want to use the JUCE examples in a closed-source manner you
    should ensure you understand the JUCE library''s dual licensing model.


    Open-source has various definitions. For our purposes, open-source means that
    the source code for a piece of software is available. Open-source code generally
    comes with a license that dictates the code''s author you want to do with that
    code. Permissive licenses, such as the MIT license, place few limitations on the
    use of that code. Users are free to use that code as they see fit. Users of MIT-licensed
    code can adapt the code and even include it in commercial projects without needing
    to release their adapted code. All the code written by this book is MIT licensed.


    The GPL takes a stronger philosophical position concerning freedom of source code.
    You can adapt and use GPL''d code in your project, even if it is a commercial
    project, but you will be required to release your code. You are also obligated
    to make your source code open-source with a GPL license if your code links to
    GPL libraries.


    Releasing code with multiple licenses is possible if they are compatible. The
    code in this book that I have written is released under a dual MIT / GPL license.
    I will explain why. If you use my code in your project, the MIT license applies.
    The GPL license applies if you use my examples, which also link to GPL''d code.


    The reason I dual-licensed the code is because of the JUCE library. If you build
    against the JUCE library, you can either GPL your whole project or apply for a
    JUCE license, and then, you do not need to GPL your code.


