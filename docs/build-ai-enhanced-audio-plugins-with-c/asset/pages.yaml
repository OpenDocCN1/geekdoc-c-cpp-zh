  md: '# 3


    # Installing JUCE


    This chapter will teach you about the JUCE library and associated tools. JUCE
    allows you to create C++ software projects which can be exported for multiple
    platforms from the same code-base. I will talk you through your first plugin build
    using Proj and an IDE, covering Windows, macOS and Linux. I will also show how
    you can test your plugins using the AudioPluginHost tool, a plugin host that comes
    with the JUCE library. At the end of the chapter, you will be building, running
    and testing plugins on your machine.


    # 3.1 Why JUCE?


    Now you have a working C++ development environment, you are ready to add the next
    layer: JUCE, standing for Jules'' Utility Class Extensions, developed initially
    by Julian Store. JUCE will allow you to build cross-platform native audio plugins
    that integrate into standard audio software. JUCE is not the only way to develop
    cross-platform audio plugins. There are other similar libraries, such as Oli Larkin''s
    iPlugin2, or you could even directly use a plugin development API, such as Steinberg''s
    VST3. I have chosen to use JUCE for the following reasons: it provides a very
    consistent experience on different platforms; it includes a set of cross-platform
    user interface components; it is compatible with the CMake build tool, and it
    can export plugins in several formats, such as VST3, Audio Unit and so. JUCE also
    provides components to build applications and plugins that can host other plugins.


    Some people consider JUCE to an opinionated library which forces you to work in
    a particular way. This is probably true, but it is reasonably consistent and my
    students get up speed with writing applications in JUCE quite quickly. However,
    you should able to port the concepts from the book to other plugin APIs if you
    want to. It all comes down to user interface widgets and audio buffers - it depends
    on how much time you want to spend making them work, how much engineering freedom
    you want and what your licensing requirements are.'
  merge: -1
