  md: "# Finite Impulse Responses, signals and systems\n\n| $y[n] = b_0x[n]$ | the\
    \ system |\n| $b_0 = 0.5$ | the coefficient |\n| $0.5 \rightarrow 0.25$ | input\
    \ 0.5 |\n| $0.6 \rightarrow 0.3$ | larger input 0.6 (27.6) |\n\nConsider a real-world\
    \ example, e.g. a guitar amplifier. As you increase the gain, which is equivalent\
    \ to scaling the input in a correct sense, the output signal changes. But it does\
    \ not get louder - it also gets more distorted. So the guitar amplifier is not\
    \ linear. Guitarists use non-linear amplifiers because increasing the gain varies\
    \ the tone in musical ways.\n\nNow think of a professional speaker amplifier that\
    \ you might use in a recording studio. You do not want to change the character\
    \ of the sound based on the gain, because that would make it difficult to produce\
    \ a correct mix – the mix would change based on the gain. So linearity is a desirable\
    \ property in such an amplifier.\n\nWe might say that in professional audio linearity\
    \ is more linear than a guitar valve amp. With digital systems, it is possible\
    \ to achieve perfect linearity, in the digital part at least.\n\nAnother part\
    \ of linearity is additivity: if you pass two signals through the system on different\
    \ occasions, then capture and sum the outputs, you will have the same output as\
    \ if passed in the sum of the two signals as an input. Here is a simple demonstration\
