  md: 'gin at a time, providing new modes of interaction with your plugins and breaking
    free from the limitations of graphical user interfaces and standard controllers.


    # 12.2 Wekinator: inspiration for the meta-controller


    The main inspiration for the meta-controller is Rebecca Fiebring’s ‘Wekinator’.
    According to the Wekinator website¹, The Wekinator allows users to build interactive
    systems by demonstrating human actions and responses, instead of writing programming
    code. The concept is that you show Wekinator an input and tell it output when
    you want and it sees that input again. The clever part is that you can show it
    several input-output pairs, and after training, it can infer what it output an
    input it has not seen before. Returning to the example of mapping trackpad positions
    to synthesizer presets, you might place four different presets at the corners
    of the trackpad. Wekinator will generate and morph between the presets as you
    move around on the trackpad.


    Fiebring implemented Wekinator as an OpenSoundControl (OSC) message processor.
    The inputs are OSC messages. The Wekinator system is flexible and comes with front-ends
    to convert various types of inputs (sensors, MIDI control messages, etc.) into
    OSC messages. It can send its outputs to any system that receives OSC messages
    (Ableton Live, SuperCollider, etc.). Wekinator is built in Java and uses the Weka
    machine learning library[18], hence the low


    Source Fiebring released the original version of Wekinator in 2009, there has
    been a Wekinator 2.0 and other versions. Louis McCallum worked with Fiebring to
    reimplement the Wekinator concept in Javascript using the Tensorflow.js library.
    McCallum called the new library ‘learner.js’ [26]. Learner.js works in the web
    browser and is especially useful for folks wishing to share their creations with
    others. In fact, learner.js was developed for use in the MIMIC browser-based programming
    environment. MIMIC in combination with learner.js makes sharing and helping other
    people’s Wekinator examples much easier.


    I worked with this MIMIC project and have even performed live with Louis and MIMIC
    project lead Mick Grierson by collaboratively editing the same Javascript document!
    As a small anecdote, we agreed to do a live audiovisual performance using the
    MIMIC browser-based coding environment during the 2020 Covid-19 lockdown. The
    performance was part of the concert programme for the NIME conference, which is
    perhaps the most important academic conference


    > ¹http://www.wekinator.org/


    > ²https://mimicproject.com/'
