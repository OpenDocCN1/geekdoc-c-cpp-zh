    # Infinite Impulse Response filters


    In this chapter, you will find out about infinite impulse responses and how they
    differ from the finite impulse responses seen in the previous two chapters. We
    will start with a low-level C++ implementation and then move towards a real-time
    plugin implementation using JUCE. You will learn about filter coefficients and
    frequency responses. You will see how you can use JUCE''s module functionality
    to implement IIR filters efficiently with preset coefficients for different types
    of filters.


    # 29.1 Infinite Impulse Responses (IIR)


    In the previous chapter, you learned about convolution, which involves applying
    an impulse response to a signal. Hopefully, you remember that the output is computed
    based on a weighted sum of previous inputs to the system. If the input fades to
    silence (as the impulse does after its first sample), the output will eventually
    become silent. Therefore, all the impulse responses we have seen so far are finite
    impulse responses, or FIRs.


    ![](img/f36e66929543fe6d506774ef8e004b7e_249_0.png)


    There is another type of impulse response, which, unlike the FIR, is not guaranteed
    to fade to zero. This is the Infinite Impulse Response (IIR). The trick with IIRs
    is that the output is computed on the previous inputs and the previous outputs
    are fed back into the input – they explore the power of feedback. There is a fascinating
    cross-disciplinary history of feedback systems - I recommend cybernetics as an
    interesting launching-off point. Pickering''s 2002 paper provides some insight
    into the activities of British cyber pioneers Ashby, Park and Beer in the mid-20th
    century, who were extremely interested in feedback[32]. In a related parallel
    universe, Jamaican producers such as King Tubby and Augustus Pablo pioneered feedback


    FIGURE 29.1

    Infinite impulse responses are powerful!


    terms in art, science and engineering. 1 recommend cybernetics as an interesting


    231'
