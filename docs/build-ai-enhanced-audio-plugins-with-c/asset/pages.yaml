    # 12.5 Wekinator’s flexibility


    Wekinator is a powerful system because of the interactive machine learning workflow
    and because it is a very general-purpose system. You can feed many types of input
    data to it — anything you can convert to OSC at any dimensional level. Then you
    can map the inputs to all kinds and dimensionalities of outputs. One problem with
    Wekinator is that its workflow is a little tricky to integrate with existing music
    technology. For example, to control a plugin synthesizer with Wekin, you would
    need to figure out how to get your input control data into OSC messages and then
    convert the output OSC messages into control signals that the DAW hosting the
    plugin could understand. You would also need to specify how many parameters you
    wanted to control.


    The meta-controller you will develop in the following sections sacrifices a little'
