  md: '# Training the amp emulator: dataset


    288


    ![](img/f36e66929543fe6d506774ef8e004b7e_306_0.png)


    FIGURE 34.2

    Four stages to train a neural network. 1: send the test input through the device
    (e.g. amp) you want to model, 2: send the test input through the neural network,
    3: compute the error between the output of the network and amp. 4: update network
    parameters to reduce error using back-propagation. Back to stage 2.


    In step 3, you compute the error between the neural output and the amplifier''s
    output. But how will you compare the two output signals? How can you make sure
    that the network is improving in the right way over time and that it does not
    learn any strange ''error-avoiding'' solutions? Seasoned machine learning engineers
    reading this will be familiar with the problem of error function exploitation,
    where the neural network learns to achieve a low error without actually doing
    what you want to. For examples of systems exploiting error functions by developing
    unwanted behaviours, in this case, evolutionary algorithms, I recommend looking
    at Lehman et al.''paper[25].


    Then, there are stages 4 and 5, where you will use the error to update the network
    parameters before returning to stage 2. There are various parameters and settings
    which control the behaviour of the training process, e.g. how much you should
    adjust the network parameters each time (learning rate), how many inputs the network
    should process between parameter updates (batch size) and so on.


    In the following sections, I will revisit these questions and explain how the
    training script addresses them.'
