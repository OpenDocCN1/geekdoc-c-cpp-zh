  md: '# 16


    # Plugin meta-controller


    This chapter covers the steps involved in adapting the torchknob FM synthesizer
    into a plugin host. This means we can move from the torchknob concept, wherein
    a neural network learns to control a fixed synthesizer''s parameters, to the metacroller
    concept, wherein a neural network can control any plugin synthesizer. The steps
    covered are removing the FM synthesizer UI and DSP code, adding code to load a
    VST synthesizer, and hooking the plugin into the processBlock function so it can
    generate audio and process MIDI.


    # 16.1 Hosting plugins


    ![](img/f36e66929543fe6d506774ef8e004b7e_147_0.png)


    The first step is to adapt the torchknob FM synthesizer into a plugin host. The
    concept is that your plugin will use an external plugin to generate its audio
    instead of the FM synthesizer DSP code.


    Make a copy of the FM torchknob you created in the previous sections. A reference
    implementation of this project is described in section 39.3.4. You can start with
    that reference implementation if you want to follow these instructions as closely
    as possible. Or, if you want to skip to 16.2 and start with the clean project
    39.3.5.


    FIGURE 16.1

    Host plugins to control more advanced synthesizers.


    Remember to change all occurrences of the project name in the CMakeLists.txt file
    and to change the PLUGIN.CODE. In my case, working from the FM synthesizer reference
    project, I carried out a ''find and replace'' replacing ''fm-torchknob-train''
    with ''plugin-host'' and then changed


    the code from cbc3 to dbcl1.


    Next, you need to enable plugin hosting capabilities in your project. Locate the
    ''target.compile.definitions'' block in the CMakeLists.txt. Set the property JUCE_PLUGINHOST_VST3
    to 1, e.g.'
