    # 31.4 When is it trained?


    To complete this preliminary discussion of training, we shall consider the question:
    ‘When is it trained’? For example, how many epochs do we need to run before the
    network is trained? As training proceeds, the loss across the dataset is reduced
    meeting the network gets better at emulating the guitar amplifier. If all goes
    well, at some point, the loss is low enough that you cannot hear the difference
    between the amplifier''s output and the neural network''s output. Great, but there
    is another aspect to this. What happens when the neural network processes a sound
    it has never heard before? What would you like to happen? Imagine a reverb plugin
    to find out it only works when you play a certain test signal through it, and
    not any other signal you might want. Similarly, if you are modelling a guitar
    amplifier, you need to know that your model can correctly process any signal,
    just the test. In neural networks, this is called ‘generalisising’.


    You test for generalising by keeping some of the dataset aside, say 10% or 20%
    of the data. You do not use this data for training; it is called the ‘validation’
    data. You run the validation data through the network occasionally and measure
    the loss. This tells you how well the network performs on data it has not seen.
    You never back-propagate the validation error through the network. When the network
    is achieving a very low loss on the training data, but the validation data loss
    is low enough, training continues. Sometimes, you find that the loss is going
    up. This means the loss has zoomed in too much on the training data and can no
    longer generalise. This is called ‘overfitting’ – the network is overfitting the
    training data to the point where it cannot fit the validation data. So you should
    stop training before the validation error starts ascending or the error is not
    changing much between epochs.


    # 31.5 Inference and deployment


    Once you have trained your neural network to transform an audio signal like your
    target system, you can actually use the network to process signals. Running signals
    through the trained network without computing errors or adjusting parameters is
    called inference. Since one of the objectives of this is to show you'
