    To prevent a sequence made from only Bs, I add an extra logical test to the algorithm:
    if there is only one observation in the matrix for this state, or there are no
    observations at all, reduce the order and sample again. This is the trick to avoiding
    repetitive loops. You only sample from rows in the matrix with at least two options.


