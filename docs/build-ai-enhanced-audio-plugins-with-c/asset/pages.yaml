- img_proc: true
  md: 'Welcome to neural effects 212


    completely ''in-the-box'' in fully integrated digital audio workstation software-environments
    such as Cubase.


    An important theme in plugin software has always been emulating vintage, outbound
    effects. Increasingly accurate emulations of rare, valve-powered EQ and other
    units have been a beacon for the progress of digital signal processing techniques.
    An illustrative anecdote is that I was recently lucky enough to purchase an Apogee-audio
    I/O box. It came with emulations of several analogue effects and pre-amplifier
    circuits. It was only in a later release that modern-digital-style EQs and compressors
    were added to the plugins you could run on the device. The priority was clearly
    emulating analogue effects, and that from a company that made making digital anti-aliasing
    filters and analogue to digital converters.


    Aside from developing digital studio production effects as EQ and by dynamic ranges,
    another thread in the era of DSP has the development of digital guitar amplifiers.
    These are typically hardware units that emulate one or more different guitar amplifiers
    using DSP techniques. The Line 6 Pod was an early unit launched in 1999. Later
    units like those from Kemper allow users to capture and emulate real amplifier
    setups. I will cover guitar amplifier emulation in detail when we start working
    on a neural amplifier effecting.


    # 26.2 The era of neural effects


    Following Wilmering al.''s fourth era of audio effects is the era of neural effects.
    Neural effects emerged in the early 2010s as a method to model signal processing
    systems using neural networks. At the same time, advances were being made in neural
    synthesis,[7, 31], wherein neural networks synthesize audio signals, but our focus
    is neural effects, wherein neural networks process audio signals. Work on neural
    effects follows the trend of emulation discussed above and the earliest example
    of a neural network modelling an effect that I find in most and Littleton modelling
    vacuum tube guitar amplifiers in 2013[9]. They stated that it demonstrated the
    feasibility but that more work was needed. Some of that work has been done by
    people such as Alec Wright and Eero-Pka Damskogg[46], working on guitar amplifier
    models in Finland around 2019 and Cristian Steinmetz and Martinez Ramírez’s work
    in collaboration with Josh Reiss and others with reverbs and compressors at Queen
    Mary University in London[35, 40]. Damskogg was one of the people who worked on
    the Neural DSP system, which is one of the first commercially available hardware
    units to model guitar amplifiers using neural networks.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'Much of this work relies upon established neural network architectures such
    as recurrent and convolutional models and you will learn all these architectures
    in the upcoming chapters. But another stream of work in neural effects involves
    differentiable digital processing (DDSP), which allows more traditional signal
    processing components to be embedded within neural networks. The DSP ''components''
    parameters are then adjusted using neural network training methods. The idea is
    that the neural network gets a head start in learning an audio transformation
    as it starts with components which are designed to carry out that kind of transformation,
    given the correct parameters. An example of this work came from Kuznetsov, Parker
    and Esqueda, who worked for Native Instruments[22]. They showed how to create
    efficient non-linear effects models for EQ and distortion using DDSP techniques.


    With that, I will draw this short history of audio processing to a close. For
    further reading, the Wilmer et al. article is a good starting point for audio
    effects history, but there are also some fascinating online covering individual
    company and brand histories, such as Eventide and Boss. For neural effects, Vanhatalo
    et al. presented a survey in 2022 covering much of the work on neural guitar amp
    modelling, though we are going to implement one of these models for ourselves
    through the next few chapters[43]. If you are keen to read some technical detail
    about state-of-the-art neural effects, you will find some very technical information
    about neural reverberators and some useful references in[24].


