  md: '# Introduction to neural guitar amplifier emulation


    When training neural networks to process audio in specific ways, e.g. to emulate
    a guitar amp, we start with stage one from figure 31.2, preparing examples of
    inputs and the resulting outputs we would like. This is called the training data.
    Again, we are not out from classical DSP — capturing the input and output is similar
    to capturing an impulse response for HR filter.


    31.1 shows the setup I used to capture training data from a small guitar amplifier
    I wanted to model. I played a particular test signal through the amp consisting
    of a number of varied guitar playing. I then captured the output through the line-out
    of the amp (for pre-amp and tone modeling) or using the mic (for pre-amp, tone
    and speaker modeling). The test signal becomes the training input, and the recorded
    output becomes the training target. I want the neural to process audio in the
    same way the amp does. – I should be careful what I say here. In fact, this is
    a black-box model, so I do not care how the amp goes about processing the audio.
    I only care how the audio changes due to passing through it.


    Stage two of the four-stage training process from figure 31.2 passes the data
    inputs to the network and stores the outputs. Stage three compares them to the
    training data outputs and computes the error between the two. The training process
    uses a loss function to calculate the error between the output from the network
    and the correct output. There are many ways to measure the loss; for example,
    in audio applications, you compare the spectrum of the desired output to the achieved
    output and calculate how different they are.


    Once you have computed the ''error'' using the loss function, stage four uses
    a famous algorithm called back-propagation. ''Back-prop'' adjusts the parameter
    settings of the neural network – the loss back-propagated through the network.
    Then, the training returns to stage one, passing the test signal into the network
    again. In this way, the neural learns to approximate the transformation from the
    input to the output signal of the original amplifier.


    Usually, the data is broken into batches and the network parameters are updated
    after each batch is passed through the network. So, as the training program works
    through the data, feeding it through the network and measuring the loss, it makes
    multiple adjustments to the neural network parameters. Once e.g. the 1 minute
    of audio in my guitar amp modelling example we say that it has completed a training
    epoch. Training typically runs for several epochs.


    As a side note, the idea of batch processing in parallel was one of the big ideas
    that kicked-started the deep learning revolution in the nineties. Batch processing
    involves running multiple instances of the neural network in parallel, passing
    a different input through each instance, and simultaneously computing the errors.
    Graphics Processors are very good at computing these kinds of parallel jobs. This
    parallel processing is what enables training over large datasets on large computing
    clusters. Luckily, amplifier modelling does not need a large dataset'
