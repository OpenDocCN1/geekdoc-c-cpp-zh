    to deploy trained neural networks in native applications and plugins, we need
    to think a bit about which tools and systems we will use to carry out training
    and inference.


    Machine learning practitioners typically carry out network design, dataset preparation
    and training using a language like Python or Matlab. They may also deploy models
    in Python, where deploying making the network available for inference through
    some sort of service. However, we want to create audio software that regular music
