    # 3.4 JUCE projects: plugin and Standalone targets


    JUCE projects are more complex than a basic command-line C++ project because they
    can produce several possible things, not just one. We can refer to these things
    as targets or solutions. If you are familiar with VST or Audio Unit plugins on
    your music production setup, you will know that you need to host the plugins inside
    another project, such as a DAW. The plugins do not run on their own. So if you
    build the plugin, you will not end up with a project you can run on its own.


    Since the plugins do not run on their own, how are you going to test them? You
    could build the plugin and load it into your host program (e.g. Logic or Cubase),
    then test it. If you are planning to share your plugins with other people, you
    should certainly test them in a ''real'' host at some point. During the development
    phase, the process of kneading and testing plugins in a large host application
    can be quite slow and fiddly.


    Luckily, JUCE plugin projects have a handy target called the Standalone target.
    The Standalone target wraps your plugin into an executable application that you
    can run independently of your host. It is much quicker to carry out the build
    and test cycle with the Standalone target.


    # 3.5 Build and run a JUCE Basic Plugin on Windows


    Now you are going to find out how to build JUCE projects on different platforms.
    First, Windows and Visual Studio. To build and run the project in Visual Studio,
    click the Visual Studio icon in Projucer, or go to the Builds folder and open
    the project from there. If you have multiple versions of Visual Studio installed
    on your system, check that the project opens in the correct version of Visual
    Studio. In my case, that is Visual Studio Community 2022. Once the project loads,
    select the Standalone project from the solution area and select ''Build Solution''
    from the build menu. It might print a few warnings and if everything goes well,
    no errors during the build. If the build fails, check common errors in section
    7. Finally, select ''Run without debugging'' from the Debug menu, and your plugin
    should launch in Standalone mode.'
