    the OS (Mac or Linux), the package (Conda, Pip, libtorch, Source), the language
    (Python or C++) and the compute platform (Nvidia CUDA accelerated or CPU). Select
    the version of PyTorch (1.12.1 at the time of writing), your OS, LibTorch, and
    the page should present you with a download link. If you have a choice, choose
    the cxx11 ABI, not the pre-cxx11 ABI. If you have a choice, choose the release
    build. The download can be quite large (+150MB).


