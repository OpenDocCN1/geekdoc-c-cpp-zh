    # JUCE LSTM plugin


    In this chapter, you will build on your work with LSTMs in the previous chapter,
    eventually wrapping up the LSTM model in a JUCE plugin that can pass audio from
    the plugin host through the LSTM in real-time. First, you will convert your WAV
