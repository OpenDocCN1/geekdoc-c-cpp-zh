    # 31.2 What is a neural network?


    This book is available as a whole or as separate parts, and you can study the
    parts in any order as long as you complete the set-up instructions in part 1.
    So you may be reading this part of the book without having worked with neural
    networks. The first thing you should know about the neural networks here is that
    they are essentially fancy versions of the DSP processes we have already seen.
    Like our DSP-based guitar amp emulator, neural networks take an input, process
    it, and produce an output. In fact, depending on the neural network architecture,
    the processing can leave inputs, previous outputs and non-linear distortion steps.
    Like FIR, IIR and Waveshapers!


    You may have heard of some network architectures such as recurrent networks (RNN),
    their descendant, the Long Short Memory Network (LSTM) and convolutional networks,
    or CNNs. As I mentioned before, there is a connection between these architectures
    and DSP techniques. As a team Native Instruments who were modelling filters with
    neural networks put it,"convolutional neural networks (CNNs) can be thought of
    as a type of non-linear FIR filter, and recurrent neural networks (RNNs) as a
    type of non-linear IIR filter."[22]. To complete the trio, the neural network
    equivalent of Waveshaping is the activation function.


    # 31.3 What is training?


    ![](img/f36e66929543fe6d506774ef8e004b7e_274_0.png)


    The big difference between classical DSP techniques and neural networks is how
    we figure out the parameter settings for the processing. Neural networks allow
    for very complex combinations of their basic units. I mentioned LSTMs and CNNs
    above, which are made from units to delay with feedback (IIR filters) and convolution
    processes (FIR filters), respectively. A deep network comprises multiple layers
    of processing units stacked up. Each of these units has a set of associated parameters
    that dictate how it operates. These are similar to the coefficients in FIR or
    IIR filters. However, traditional filter design techniques are inappropriate for
    neural networks due to their complexity and non-linearity.


    FIGURE 31.1 Capturing training data from a guitar amplifier.


    Instead, we use a training program to find out parameter settings for the neural
    network. The process of training we'
