  md: '# 19.5 Extending the meta-controller


    There are many possible extensions you can consider for the meta-controller:


    +   1. Automatically populate a training dataset by iterating over the presets
    on the plugin, loading them and assigning them to different positions on the knob

    2. Custom UI components to provide control input. Instead of one knob, you could
    try to implement an X, Y pad

    3. Use MIDI CC data as the control input

    4. Allow the user to select which parameters they want to control

    5. Host and control multiple synthesizers

    6. Improved usability: loading and saving state and possibly the model

    7. Take input control values from another, higher dimensional source, e.g. extract
    features from an audio feed''s spectrum or even a video feed.


    # 19.6 The end of this part of the book


    Excellent work! You have reached the end of this part of the book, wherein you
    have been working on the meta-controller. I hope you have found some unexpected
    places in the high-dimensional latent space of synthesizer parameters. You can,
    of course, use the components developed here in any way you see fit. You might
    find the plugin hosting a plugin concept sends you off in another direction entirely.
    Or you might find the many-many trainable mapping part can apply to another musical
    or even non-musical problem.'
