    # 38.7 Progress check


    You should understand what RTNeural is and how you can use it. Specifically, you
    should be able to export a trained model to a JSON file. Then, you can define
    an RTNeural model using the ModelT template and the available layers. Following
    that, you can load the JSON file into your program and configure the weights in
    your RTNeural model from the file. You saw how you compare the output of a TorchScript
    model to that of an RTNeural model with the same architecture and weights and
    that the outputs were the same. You completed the chapter by deploying an RTNeural
    model in a JUCE plugin and using it to process a real-time audio signal.


    # 38.8 Control parameters for neural effects


    In this part of the book, we have deeply explored a specific problem, i.e., modelling
    non-linear guitar amplifier paths. One aspect of this problem we did not consider
    is adding controls to the plugin, such as tone control. An easy way to do this
    is to add an IIR filter to the signal path before or after the neural network.
    It will not be an emulation of non-linear tone control, but it will allow the
    user to adjust the tone and have the non-linear behaviour of the main effect.


    The proper way to implement a tone control is to train the neural network to know
    how it should behave with different tone control settings. It is actually easier
    than you might think to do this, but unfortunately, it is out of scope for this
    edition of the book to explain it fully. But I can give you a hint as how to do
    it. You must adjust your training data if you want to add a control parameter.
    Play the signal through the amplifier three times. For the first set, set the
    amplifier’s tone to zero, then halfway put it to 10 or 11 if you have that kind
    of power. For more detailed modelling, you can increase the number of positions.
    Now you have three training examples with different settings of the tone knob.
    Then, you need to adjust the training script so that the input signal has the
    audio samples in one channel and the setting for the tone control in another channel
    – so each ‘sample’ in the training input two'
