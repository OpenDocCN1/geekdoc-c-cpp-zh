    modelling analogue synthesiser filters, which are often based on feedback circuits
    themselves. Figure 29.3 aptly illustrates the power of IIR filters compared a
    similar number of poles. You can see that the frequency response of a simple two-pole
    IIR filter is far more drastic than that of a two-pole FIR filter.


    Music technologists should be familiar with and possibly live in feed of feedback
    and its power. You only need to work with music for a short time before you inflict
    painful feedback upon yourself or others. I personally ripped a pair of headphones
    off my head just last week after a granular looping sampler effect combined badly
    with a reverb in a SuperCollider patch I was working on.


    # 29.2 One-pole IIR filter in C++


    Expressing feedback mathematically is less painful (physically, at least), relatively
    straightforward, and similar to the expressions for finite impulse responses you
    saw earlier. A simple, one-pole infinite impulse response can be expressed as
    a difference equation as follows:


    ```

    $y[n] = a.y[n - 1] + b.x[n]$

    ```


    Note how we used an $a$ and a $b$ to differentiate between coefficients acting
    on input $x$ and those acting on output $y$. I have seen different versions of
    this equation. The $b$ is sometimes written first with the $a$ term subtracted.
    As a computer scientist, I do not care, as I can use the same code and just make
    the coefficients negative, depending on which book I am reading!'
