  md: '# 37

    Operationalising the model in a plugin


    In this chapter, I will show you how to operationalise your trained LSTM models
    in a plugin. You have already seen how to run a TorchScript model in a JUCE plugin
    project in a previous chapter, but here, I will update that code to cope with
    the final version of the model. This model version is more straightforward because
    it maintains its state internally instead of relying on you managing externally.
    At the end of the chapter, you should have a fully trained LSTM model running
    inside a plugin host.


    # 37.1 Exporting the model using TorchScript


    Once you have a trained model, you can load it into the JUCE plugin you created
    previously and then use the plugin as a real-time units. The first step is to
    export the trained model into a format that TorchScript can use. During training,
    snapshots of the model are saved by the training script as `.pth` files every
    time the model hits the best scoring. You will need to locate the .pth file in
    your `runs` folder. Luckily, the training script writes the validation into the
    filenames of the .pth files. Here is an example of the files created in a run:


    ```

    1 |-- Oct24_16-22-50_yogurt52 ht1 LSTM model with 32 hidden units

    2 |-- events.out.tfevents.1698160970.yogurt52.1869590.0

