  md: '# Data shapes, LSTM models and loss functions


    In this chapter, I will explain in detail the shape of the data and how it is
    organised for training. My experience has been that figuring exactly what form
    the data structure takes can help a lot in understanding what the neural network
    and training scripts are doing. After that, I will explain why you need to add
    additional layers to the LSTM model so the ‘multichannel’ output of the LSTM can
    be mixed down to a single channel. We will finish the chapter with an examination
    of the loss function designed to guide the training script to adjust the parameters
    of the neural network correctly to achieve a usable trained model.


    # 35.1 Sequence length


    In the previous chapter, you learned how to set up your training environment and
    prepare your training data files. Now, you will learn how to use PyTorch’s dataset
    and dataloader functionality to organise this data into a format that can be used
    for training.


    Let’s start with a look at the function calls that create the dataset. In train.py
    you will find something like the following line:


    ```

    dataset = myk_data.generate_dataset(audio_folder + "/input/",

    audio_folder + "/output/",

    frag_len_seconds=0.5)

    ```


    The generate_dataset function receives three arguments:


    +   1. The input data folder. This should contain one or more WAVs. These are
    the clean audio signals. Essentially, you can just put the test signal in there.

    2. The output data folder. This should contain the processed version of the input
    WAVs. As for the input, one file will be enough for our purposes.

    3. The frag or sequence length, which is the length of the sequence sent into
    the LSTM each time we call ‘forward’ during training.'
