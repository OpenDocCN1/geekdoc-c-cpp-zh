  md: '# Waveshapers


    In a 2013 white paper, Fractal Audio Systems describe the processing involved
    in a guitar amplifier and how to model them using DSP[42]. Fractal, the makers
    of the Axe-Fx series of high-end guitar amp emulators, describe guitar amps as
    a series of filter and distortion blocks. Typically, the guitar goes into a pre-amp
    which causes EQ-filtering and non-linear distortion. Which of the three DSP techniques
    IIR, FIR and waveshaping would you use to model these blocks? Hopefully you answered
    IIR then waveshaper. Next, the signal goes into the section which is typically
    an adjustable EQ — more IIR filtering. Finally, the signal is distorted again
    as it is power-amplified — waveshaping. Finally, the signal is converted to sound
    waves via a speaker and speaker cabinet. This last stage can be modelled by capturing
    an impulse response from the speaker cabinet and using FIR and convolution techniques.


    Implementing a full model of a guitar amp like the one described by Fractal Audio
    Systems is beyond the scope of this part of the book. This part of the book is
    intended to be a short introduction to DSP techniques in support of the later
    chapters about neural DSP. But frankly building models is a lot of fun, so here
    follows some instructions on how to build a simple version of a multi-stage amp
    model. It shows how to construct a chain of JUCE DSP processors to carry out waveshaping,
    IIR filtering then convolution to the pre-amp, tone stage and speaker cabinet,
    respectively.


