    // convert the int into a note on message

    juce::MidiMessage nOn = juce::MidiMessage::noteOn(1,

    note,

    0.5f);

    // add it to the outgoing buffer

    midiMessages.addEvent(nOn, 0);

    ```


    If you call directly in processBlock, you will send a message every time processBlock
    is called. That is probably a bad idea as processBlock gets called'
