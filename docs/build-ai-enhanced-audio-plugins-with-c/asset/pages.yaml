    123


    Note that I am using a unique.ptr here. This allows me to decide which parameters
    the optimiser receives from its constructor after I have created the neural network
    model. In fact, I only know what the parameters once I create the model by calling
    the register_module function in the neural network''s constructor. So I have to
    dynamically create the SGD. I cannot use this style as I did for the network layers:


    ```

    torch::optim::SGD optimiser(nullptr);

    ```


    SGD, unfortunately, does not have a constructor with that signature. If you are
    not very experienced with C++, you may not be familiar with unique.ptr or pointers.
    What you need to know is that pointers were inherited by C++ from C language,
    and they allow programs to request memory from the operating system when they
    are running, as opposed to requesting all needed memory at the start. If you use
    a pointer to allocate memory, you must also return that memory. Otherwise you
    have a memory leak, your program takes memory but does not return it. Pointers
    are notorious for striking fear and confusion into the hearts of C++ programmers,
    and can cause all kinds of problems. Unique.ptr and so-called ''smart pointers''
    were invented in a later version of C++ to solve some of these problems. Smart
    pointers automatically free the memory they use once they go out of scope. In
    other words, they behave more like variables with the added capability of runtime
    memory allocation. See smart pointers like unique.ptr and shared.ptr popping up
    in many of the JUCE example applications that come with the JUCE developer kit.


    I am using a smart pointer here as it allows me to create an SGD variable without
    assigning an SGD object to it. This is helpful as I can only create an object
    if I know the parameters for the neural network I will optimise. With my smart
    pointer, I can create the object after I have created the neural network model
    in the NeuralNetwork class constructor. Here is some code that uses the std::unique
    function to create an SGD object wrapped in a unique.ptr. Put the code at the
    end of the NeuralNetwork constructor in NeuralNetwork.cpp:


    ```

    optimizer = std::unique<torch::optim::SGD>(this->parameters(), .01); params, learning
    rate

    ```


    How I call parameters on ''this''? Remember that our NeuralNetwork inherits from
    the torch Module class. This means it inherits a set of functions from Module.
    One of functions is ''parameters'', and it returns the parameters of the registered
    modules in a form that the optimiser can understand. ''this'' refers to the current
    NeuralNetwork object. I could have called ''parameters'' without ''this'', but
    I prefer this more explicit syntax as it tells you parameters is a function inside
    the current object, not something global or otherwise in the namespace somewhere.


