    that has a room size parameter. As you adjust the parameter, the impulse response
    of the system changes. The concept still holds – you just need to consider the
    reverb as being several different linear, time-invariant systems. As you adjust
    the room size parameter, you are switching to a different system with different
    coefficients in its impulse response. If you do not adjust the parameter, the
    system is linear and time-invariant. If you adjust the parameter, you are switching
    to a different system.


