  md: '# 9


    # FM synthesizer plugin


    In this chapter, you will develop a plugin with a more advanced sound synthesis
    algorithm: frequency modulation synthesis (FM). This FM synthesis plugin will
    be helpful for later work in the book, where you will use machine-learning techniques
    to control the plugin. I will show you how to implement a two-oscillator FM synthesis
    algorithm with a modulator and a carrier oscillator. I will explain how the modulation
    index and depth variables change the timbre. You will add a slider-based user
    interface to the plugin, allowing you to control the synthesis engine. I will
    show you how to expose plugin parameters to the host environment, which is one
    way that plugins integrate more deeply with plugin hosts. Then, we will see how
    to use those plugin parameters in the synthesis algorithm and how to control them
    via the user interface. At the end of the chapter, you will have a monophonic
    FM synthesis plugin.


    # 9.1 FM synthesis algorithm


    In the previous chapter, you saw how to create a simple synthesiser plugin that
    generated a sine tone. Sine tones are nice, clean sounds; if you add any many
    of them together, you can create rich timbres. The problem with this kind of additive
    synthesis is that it is computationally expensive and difficult to control. Frequency
    modulation (FM) synthesis aims to solve both problems by generating complex timbres
    computationally efficiently with few control parameters. For music technology
    history fans, there is an interesting story to look into relating FM synthesis
    and how it moved from John Chowning''s research work into commercial products,
    made famously by Yamaha but also by the New England Digital Corporation in their
    Sinclair series.


    The basic FM algorithm works by using one oscillator to control the frequency
    of another at audio rate. You are probably familiar with the idea of an LFO modulating
    pitch, which the pitch can be heard to go up and down like a car siren. FM is
    like that, except the frequency moves up and down much faster. The result of this
    fast frequency modulation is that the tone of the modulated'
  merge: -1
