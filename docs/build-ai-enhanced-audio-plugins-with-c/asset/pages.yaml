    # 8.2 Lifecycle of a plugin


    When you instantiate a plugin in a plugin host, the host calls the plugin’s functions
    in a particular order. During this process, the plugin gains access to the audio
    system provided by the plugin host. It works like this:


    +   - PluginProcessor’s constructor is called. At this point the audio system
    is not available so you cannot query the sample rate or block size.

    - PluginProcessor’s prepareToPlay function is called. The audio system is ready;
    you now know the sample rate and block size.

    - PluginProcessor’s processBlock function is called repeatedly. This is where
    you generate or process audio and put the results into the buffer sent to processBlock.'
