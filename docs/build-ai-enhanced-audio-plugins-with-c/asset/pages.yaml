  md: '# The LSTM training loop


    has gone through, e.g. every 2046 samples. The state of the network is retained
    as this proceeds. This technique has the fancy name of Truncated backpropagation
    through time. It is used because the shorter sequence lengths allow for more frequent
    updates to the parameters with less computational complexity for longer sequences,
    which, according to Wright, leads to better training[46].


    The train.epoch.interval function ultimately returns the mean loss across all
    batches. The main loop then logs this training loss as well as computing and logging
    the validation set.


    # 36.2 Putting it all together: training an LSTM


    Now, you have seen all the critical components in the training process. I will
    now present the workflow as a series of steps that you can follow to train an
    LSTM network to model a guitar amp


    +   1. Load the training signal into your DAW

    2. Wire up so the DAW can play the training signal out to a guitar amplifier,
    then record the processed signal back in

    3. Check the alignment of the training signal and the recording and make sure
    the impulses at the start of the test signal line

    4. Export the recorded signal in the same sample rate as the training signal

    5. Prepare the data set folders: one folder containing the training signal WAV
    and one containing the processed signal

    6. Edit settings in train.py to reflect the location of your WAV files

    7. Edit other settings in train.py, especially lstmn.hidden_size and expt_desc

    8. Activate your Python virtual env and run train.py

    9. Run tensorboard with the logdir argument pointing at the folder where you run
    train.py and open the tensorboard dashboard in your web browser

    10. Wait for training to proceed. Training is complete when the validation loss
    curve flattens out

    11. If you observe high levels of oscillation in the loss curve, reduce the learning
    rate and start again'
