  md: "# The LSTM training loop\n\n# 36.1.1 The optimiser\n\nOne component I have\
    \ yet to mention the optimiser. It controls how the network parameters are updated.\
    \ The following lines in train.py set up the optimiser. They also set up a scheduler,\
    \ which is a kind of controller for the optimiser that varies its settings as\
    \ the training proceeds:\n\n```\noptimiser = torch.optim.Adam(model.parameters(),\n\
    \    lr=learning_rate,\n    weight_decay=1e-4)\nscheduler = torch.optim.scheduler.ReduceLROPlateau(\n\
    \    optimiser,\n    'min',\n    factor=0.5,\n    patience=5,\n    verbose=True)\n\
    ```\n\nThe optimiser's job is to update the network parameters according to the\
    \ load. The loss is converted into a set of gradients with respect to the network's\
    \ parameters using backpropagation (loss.backward()). Intuitively, the gradients\
    \ each parameter's function on the error, if you follow the gradient by adjusting\
    \ the parameters, you will reduce the error. The learning rate dictates how far\
    \ the parameter will be adjusted that gradient. If the learning rate is too high,\
    \ the adjustment will be too much, and you will overshoot the ideal setting for\
    \ the parameter. A high learning rate leads to the loss swinging up and down,\
    \ never settling on the optimum. If the learning rate is too low, optimisation\
    \ proceeds too slowly.\n\nThis is where the scheduler comes in - it automatically\
    \ adjusts the learning rate to stop the oscillatory behaviour once you are close\
    \ to the optimum setting for a parameter.\n\n# 36.1.2 The train_epoch_interval\
    \ function\n\nAs noted above, the train_epoch_interval function, located in the\
    \ myk.train module, does much of the work in training for one epoch. It has some\
    \ interesting features; for example, it carries out a warm-up step. This involves\
    \ the sequence's first function to the neural network and throwing away the loss.\
    \ This allows the network to warm up, avoiding the dip in the signal you observed\
    \ before we investigated the effect of state in LSTMs (figure 33.1). The default\
    \ warm-up length is 1000 samples, which leaves 21050 samples for the actual loss\
    \ calculation. Another feature is that it uses the model's ability to zero out\
    \ its state via its zero.on_next_forward function. It does this between batches\
    \ to ensure the LSTM's memory is clear.\n\nAnother feature of this epoch training\
    \ function is the idea of interval training. This is where the network parameters\
    \ are updated after only part of a sequence"
  merge: -1
  pgno: 329
