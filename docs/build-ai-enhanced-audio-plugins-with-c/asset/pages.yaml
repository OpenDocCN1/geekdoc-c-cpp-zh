    \ but if you can build and run it, you are ready to use a state-of-the-art machine\
    \ learning library in your native applications. If you have some experience working\
    \ in C++, you should understand most of what is going on. For clarity, I will\
    \ step through the program line-by-line and explain it. Firstly:\n\n```\n#include\
    \ <torch/torch.h>\n#include <iostream>\n```\n\nThese lines include the header\
    \ for the libtorch library and the C++ standard library iostream. Remember that\
    \ in C++, headers contain declarations of functions, constants and such. They\
    \ tell your IDE and compiler which functions are available. When you include a\
    \ header, you are making the things declared in that header available for use\
    \ in your program. So we are making the libtorch and i libraries available for\
    \ use in our program. Note that the included files are in angle brackets (< >).\
    \ Impacts where the IDE searches for these headers for its autocompletion and\
    \ code-checking functionality and where the compiler searches when it pulls in\
    \ the headers during the compile phase. Using angle brackets means they need to\
    \ be located in a standard or, at least, placed somewhere on your system. So there\
    \ needs to be folder somewhere that folder is. We will use CMake to tell the IDE\
    \ and compiler where to call torch file called torch.h, and the IDE and compiler\
    \ need to know where to look. Next, we have the main function:\n\n```\nint main()\
    \ {\n    torch::Tensor tensor = torch::rand({2, 3});\n    std::cout << tensor\
    \ << std::endl;\n    return 0;\n}\n```\n\nThe main function is the entry point\
    \ for the execution of your program. In other words, it is the first function\
    \ to automatically be called when your program runs. This main starts by creating\
    \ an object of type Tensor from the torch namespace. That is something declared\
    \ in the torch.h header. We assign that Tensor object to a variable called tensor.\
    \ Remember that objects in C++ contain data and functions relating to that data.\
    \ That means our tensor object contains some data and some Tensor-related functions.\
    \ Tensors are the core data structures in neural network-based machine learning,\
    \ and we will encounter lots of them in this book."
