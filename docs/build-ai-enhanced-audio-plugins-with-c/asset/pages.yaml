  md: '# 10


    # Using regression for synthesizer control


    This chapter introduces regression, a statistical technique to estimate values
    between known data points. The chapter starts with 2D linear regression, fitting
    a line to known data points. Then, it expands the concept to higher dimensions
    to enable one-to-many mappings. I explain how this neural networks can implement
    the same line equation as linear regression, where weights and biases are parameters
    for the network, and learning is the process of estimating suitable values. At
    the end of the chapter you should have an understanding of how linear regression
    and simple neural networks work.


    # 10.1 What does the meta-controller do?


    Now that you have completed installing, testing and familiarising yourself with
    the book''s core tools, you will work towards the first example project: the meta-controller.
    The meta-controller is an innovative tool for synthesizer programming. It allows
    you to control multiple parameters of a synthesizer using one or more controls,
    for example a single slider can control tens or hundreds of parameters. This means
    synthesizer users can move through the space of any poly synthesizer more dynamically
    than they can via conventional synthesizer programming techniques.


    ![](img/f36e66929543fe6d506774ef8e004b7e_99_0.png)


    FIGURE 10.1 The meta-controller uses regression to control other plugins.


    The meta-controller uses interactive machine learning to allow users to create
    complex linear or non-linear mappings between arbitrarily dimensional controls
    and synthesis parameters.


    But before you dive in with the meta-controller project, I would like to explain
    the background machine learning technique it uses. The technique is called regression,
    and we''ll do it using a neural'
