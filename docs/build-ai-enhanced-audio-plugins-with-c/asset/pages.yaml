  md: '# Setting up your development environment


    # Generative model


    A generative model is a machine learning model that can generate something interesting.
    For example, instead of detecting cats in images, it might generate images of
    cats. The ''G'' in GPT stands for generative, as GPT generates text.


    # Machine learning library


    A machine learning library is a set of components that makes it easier to carry
    out machine learning tasks. Typical components include different algorithms such
    as clustering and neural networks, routines to train the models, and data importers.
    Examples are sc-learn, TensorFlow and PyTorch. We will use the PyTorch library
    along with its C++compatible libtorch. This will allow us to work in both Python
    and C++, taking advantage of the strengths of each language. libtorch is also
    compatible with the CMake build.


    # Audio library


    An audio library is a set of components that makes it easier to construct audio
    applications. Typical components are audio file readers and writers, audio device
    management and sound synthesis routines. We will use the JUCE audio library as
    it allows us to construct cross-platform audio applications and plugins. If you
    are not keen on using JUCE, you should be able to convert to other audio libraries.
    For example, it is possible to create VST plugins directly using Steinberg''s
    library, or you could use IPLug. There are few reasons I have chosen to use JUCE:
    it provides a very consistent experience on different platforms, it includes a
    set of cross-platform user interface components; it is compatible with the CMake
    build, and can export plugins in several formats such as VST3, AudioUnit and so
    on. JUCE also provides components to build applications and plugins that can host
    other plugins, a capability we will make use of some of the examples in the book.


    # Application Programming Interface (API)


    An API is a set of ready-made components which you can use to develop applications.
    APIs come in different forms but the JUCE API contains C++ classes representing
    user interface components, audio file readers and so forth. See also the comments
    about libraries below.


    # Dynamic and static linking


    When you build native applications, part of the process involves connecting your
    application somehow to the libraries you have used. There are two options here:
    dynamic linking and static linking. Static linking means the library (for example,'
