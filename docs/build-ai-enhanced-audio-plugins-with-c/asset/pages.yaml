  md: '# 34

    Training the amp emulator: dataset


    In this chapter, I will lead you through the components of the Python training
    script I have created to train LSTM models to emulate distortion effects and amplifier
    circuits. The script is based partly on open-source code by Alec Wright, who worked
    extensively on guitar amplifier modelling with neural networks in 2019-2020. I
    have rewritten much of Wright''s code to align it with current practice in PyTorch
    instead of the training loop. My approach is to review an existing code base instead
    showing you how to create the complete script line-by-line as we did for the C++
    code. The main components are the LSTM model, the data loader and. Along the way,
    you will find how to monitor training progress using tensorboard, how to save
    models for further training later and how to manage training on CPU and GPU devices.
    I will show you how to import the trained model into a JUCE plugin.


    # 34.1 Training script overview


    ![](img/f36e66929543fe6d506774ef8e004b7e_305_0.png)


    Figure 34.2 shows a high-level overview of training a neural network to emulate
    a guitar amplifier. You have seen this image in a previous chapter. Let''s review
    the image and see what kind of considerations it raises.


    FIGURE 34.1

    How fast LSTMs can process audio?


    In step 1, you pass a test signal through an amplifier and record the result,
    which should be straightforward. But what kind of audio signal should you use?
    How can you ensure you have given the neural network enough examples of how the
    amplifier processes different types of signals?

    In step 2, you pass the signal through the neural network; what kind of neural
    network model do you need? Is a simple LSTM layer sufficient here? How many hidden
    units do you need? What about the problem of signal drop-out at the start of a
    block that we observed in the previous chapter?'
