    # FIGURE 20.4


    minus one. As the order increases, the number of observations decreases. For example,
    if you have nine letters in your sequence like we did, you can only make one eighth-order
    observation. Higher order means your model knows more about the history of events
    before an event, so it might make more sensible musical decisions. To clarify
    that with a musical example, imagine you were doing a listening test where you
    listen to a fragment of music, then you have to guess what the next note or chord
    is. Do you think you would find it easier to guess the next note with a longer
    or shorter fragment?


    However, higher order also means fewer observations, meaning the model has fewer
    variation in its output. How can you make the model has both the stateful, musical
    awareness provided by higher orders and the variation that makes for interesting
    sequences? In the next section, I will describe the variable order Markov model,
    which takes advantage of both the richness of lower-order models and the understanding
    of higher-order models.


    # 20.6 Variable order models


    Variable order Markov models maintain models at several different orders simultaneously.
    Building variable order models is similar to building fixed order models except
    you compute matrices for all orders and combine them into a single matrix. A combination
    of our first- and second-order models would look like this:'
