  md: 'Data shapes, LSTM models and loss functions


    # 35.3 Training, validation and test data


    Now you have an understanding of the structure of the complete training data and
    the interaction between sequence length and batch size, it is time to break the
    training data into training, validation and test data. Splitting the dataset into
    training, validation and test data is done with the following line in the train.py
    script:


    ```

    train_ds, val_ds, test_ds = myk_data.get_train_valid_test_datasets(dataset)

    ```


    The get_train_valid_test_dataset has a ''splits'' parameter, which dictates how
    the data is split into three subsets, and it defaults to splits=(0.8, 0.1, 0.1).
    This means the training data is 80%, and validation and test data are 10% each.
    The purpose of these three subsets is as follows:


    +   - Training data: fed through the network during training to find errors. Errors
    are fed back to the network to update parameters.

    - Validation data: fed through the network during training to check how training
    is progressing. Validation data errors are not fed back into the adjustment of
    parameters, so it is considered ''unseen'' data. Therefore, it tests the network
    with data it has not learned.

    - Test data: used to test the network on unseen data at the end of training. This
    differs from validation data as it is used to compare across training runs, where
    the training parameters (sequence length, batch size, learning rate) may have
    been adjusted.


    # 35.3.1 Over-fitting and ''unseen'' generalisation


    Why do we need to keep ''unseen'' data like this? The reason is to avoid over-fitting
    and to ensure generalisation. Over-fitting is when the network learns to perform
    very well with the training data, but does not perform well with any data it has
    not seen. Imagine a guitar amp works perfectly if you play a particular riff on
    a specific guitar through it, but it just generates white noise for any other
    input. That guitar amp is extremely over-fitted to that particular riff and guitar.
    This is an exaggeration to make a point, but it gives you the flavour of the over-fitting
    problem.


    Generalisation is when the neural network performs well with data it has not seen.
    For our imaginary guitar amp, this means it carries out the correct processing
    regardless of what riff or guitar you play. That is, of course, what you need
    in a guitar amp. By observing the training progress in terms of performance on'
  merge: -1
