    # 32.10.1 Gradient calculation


    The last concept I would like to know about is the idea of computing gradients.
    This will be much clearer once you have learned about training neural networks
    in a later chapter, but it is relevant to performance, so I am mentioning it.
    When you pass data through a network, the libtorch library does not just compute
    the output; it computes gradients which describe how data flows through the network.
    These gradients are used during training to allow the back-propagation algorithm
    to update the parameters. We are not training right now – we only want to do inference.
    Inference, as I mentioned above, is when you pass data through the network to
    get the output. You can switch off gradient calculation when carrying out inference,
    and this uses fewer CPU cycles. Surprisingly, I found that this improved Windows
    and macOS performance but did not affect performance. To turn off gradient calculation,
    put the following line Linux ahead of your inference, which informs the libtorch
    system not to compute gradients:


    ```

    torch::NoGradGuard nograd;

    ```


