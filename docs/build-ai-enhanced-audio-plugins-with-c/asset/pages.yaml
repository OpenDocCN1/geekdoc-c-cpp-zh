  md: '# 22


    # # Starting the Improviser plugin


    In this chapter, you will start building the Markov improviser plugin, which models
    incoming MIDI data and generates MIDI data back out from that model in a similar
    but ‘interestingly different’ style. The chapter starts with an overview of the
    plugin''s main components, then explains how to prepare the JUCE project for building
    the plugin. Following that we dig into pitch modelling and then, to store it in
    a Markov model. You will see how you can extract data from the MIDI messages sent
    to the processBlock function, then convert them into a format that is suitable
    for the Markov model library we are using. At the end of the chapter you will
    have a basic monophonic improviser which can model then generate streams of notes.


    # ## 22.1 Overview of the autonomous improviser plugin


    The improviser plugin aims to model incoming MIDI data such that it can then generate
    MIDI data back out from that model. The MIDI data generated from the model should
    be patterned in a similar but ‘interestingly different’ style to the MIDI it has
    learned from. The improviser operates in real-time, updating its model all the
    time as MIDI data is received. This makes it exciting to interact with – it is
    constantly learning new tricks. 22.1 illustrates the main components of the model.
    It models pitch, duration, onset times and velocity. These are the main elements
    that describe an incoming stream of MIDI notes: which notes? How long are the
    notes? When do the notes happen, and how loud are they? In the following chapters,
    you will see how to build models of these musical elements and combine them into
    a fully working improviser plugin.'
