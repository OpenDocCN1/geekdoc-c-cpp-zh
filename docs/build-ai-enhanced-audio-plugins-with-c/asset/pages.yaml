    FIGURE 10.2

    Linear regression finds the straight line that best fits some data. Important
    features of the line are the point at which it intercepts the y-axis and the slope
    gradient.


    network. The aim for this chapter therefore is to explain what regression is and
    how to do it using neural networks.


    # 10.2 Linear regression and synthesizer control


    The meta-controller is an AI-enhanced synthesizer programmer which allows you
    to use simple controls to move through the sound space of any plugin synthesizer
    more dynamically than you via conventional synthesizer programming techniques.

    The meta-controller uses a technique called regression. Regression is a term from
    statistics that most people encounter when they learn about making predictions
    from graphs. The idea is that you have data for several points on a graph, but
    you want to know what happens between or beyond those points, so you can estimate
    the value at a given position for which you do not have an actual data point.
    Linear regression is perhaps the most straightforward method to estimate what
    happens between and beyond the known data points. Linear regression involves fitting
    a line to the available points in the best way possible.'
