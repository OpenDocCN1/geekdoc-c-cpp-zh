  md: '# # 17

    # Placing plugins in an AudioProcessGraph structure


    This chapter describes the process of integrating plugins into an AudioProcessGraph
    structure. AudioProcessorGraph is a built-in class in JUCE library which allows
    the creation of a graph with multiple plugins connected together, managing MIDI
    and other complexities. With this graph, it is possible to have multiple plugins
    simultaneously. In fact, it is the technology for the AudioPluginHost test environment.
    The chapter goes through all the steps involved in converting the existing plugin
    controller to work with the AudioProcessorGraph. These steps are adding the required
    fields for the graph and creating MIDI and audio input/output nodes, initialising
    the graph, wrapping the plugin in a graph node and using the graph in the processBlock
    function.


    # 17.1 What is an AudioProcessGraph?


    ![](img/f36e66929543fe6d506774ef8e004b7e_153_0.png)


    Before we get started, I would like to say that there are some quite large chunks
    of source code in this section. They are for completeness so you can see the full
    implementation of graph-based audio processing in JUCE. But I would not expect
    you to type in all the code from the book. You can refer to 39.3.7 in the repo
    guide which has a fully working implementation of the plugin graph.

    AudioProcessorGraph is a class in the JUCE API which allows you to treat audio
    and MIDI processing units in a graph. If you have used the AudioPluginHost testing
    environment, you have already seen a fully developed example of what is possible
    with the AudioProcessorGraph. If you have not seen it, I recommend you check it
    out


    **FIGURE 17.1**

    Wiring plugins together with a processor graph.'
  merge: -1
  pgno: 153
