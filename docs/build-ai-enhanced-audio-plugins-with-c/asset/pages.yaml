  md: "# Data shapes, LSTM models and loss functions\n\nas larger losses on loud signals,\
    \ preventing the training from over-focusing on the\nloud parts of the signal.\
    \ The following code shows shows the implementation of ESR\nloss:\n\n```\ndef\
    \ forward(self, output, target):\n    self.epsilon = 0.00001\n    loss = torch.add(target,\
    \ -output)\n    loss = torch.pow(loss, 2)\n    loss = torch.mean(torch.pow(target,\
    \ 2)) + self.epsilon\n    loss = torch.div(loss, energy)\n    return loss\n```\n\
    \nThe implementation is located in myk_loss.py. You can use the following code\n\
