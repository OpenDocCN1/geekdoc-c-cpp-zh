  md: '# 26


    # Welcome to neural effects


    Welcome to Neural Effects! In this part of the book, I will explain how you can
    use a neural network as an effects unit. Before presenting the full details of
    creating a neural audio effect later, I will provide some background information
    to help you understand the neural effects techniques. The background starts in
    this chapter, which presents a brief history of audio effects from the use of
    reverberant buildings through neural networks emulating guitar amplifiers. Following
    this chapter, I will present further material about what I call the ''DSP Trinity'',
    namely finite and infinite impulse filters and waveshapers. When we reach the
    coverage of neural effects, I will show you the details of preparing training
    data, designing the network architecture and implementing the training in Python.
    Then, we will switch to C++ to develop the plugin. We will compare two methods
    for running neural networks: TorchScript and RTNeural. At the end of this part
    of the book, you will have a fully working neural network emulation of a guitar
    amplifier running in a plugin.


    # 26.1 A brief history of audio effects


    ![](img/f36e66929543fe6d506774ef8e004b7e_228_0.png)


    In 2020, Wilmering and colleagues presented a succinct history of audio effects[44].
    They began by discussing reverberation as the first form of audio transformation,
    noting the long history of reverberant spaces, especially for religious worship.
    They move from natural spaces with interesting aesthetics to artificial audio
    effects, organising the chronology of audio effects into four eras.


    The first era covers audio transformation using sound recording and reproduction
    technology in the early 20th century. For example, Stravinsky manipulated phonogram
    tones to cause distortion effects. Like Stravinsky before them, DJs manipulate
    ''phonograms'' today in the practice of turntablism. The era continued with'
  merge: -1
  pgno: 228
- img_proc: true
  md: '# Welcome to documented neural effects


    the well-documented use of tape splicing techniques, for example Stockhausen’s
    work. The practice of tape manipulation also continues today with artists like
    Jamie Lidell¹ exploring creative interactions between tape and other music technology
    such as Eurorock.


    The second era of audio effects concerns electro-mechanical effects. These are
    purpose-built hardware units that cause particular sound transformations. An example
    is the Leslie speaker from the 1930s, which featured a spinning high-frequency
    horn speaker. Fast-forwarding to the present day, electro-mechanical effects such
    as ringing reverbs are still being produced.


    The third era covers analogue signal processing, which uses analogue circuitry
    to transform the audio. This era, commencing in the 1930s, saw many new effects,
    such as frequency shifting, amplitude modulation, distortion, dynamic range compression
    and delay-based reverberators. To connect this to the present day, companies such
    as Warm Audio produce recreations of classic effects, and companies such as Solid
    State Logic make mixing consoles with analogue sound-transforming circuitry. Of
    course one must mention analogue synthesizers with their sound manipulating filters
    are still mass-produced and very popular with musicians. Another connection between
    the analogue processor and the present day is the range of digital emulations
    effects available as plugins. Emulating analogue processors using deep learning
    techniques is the most recent develop here, and is of course the subject of this
    part of the book.


    The fourth era identified by Wilmering et al. is the digital signal processing
    DSP era, which commenced for musicians and sound engineers at least, in the 1970s
    with the availability of rack-mountable digital effects. DSP occurs in the digital
    domain, where the signal is converted to a digital representation, and transformations
    are speciied as digital processor instructions. The Eventide digital delay units
    were launched in 1971 and are early examples of digital effects. Guitarists gained
    access to cheaper digital line-based effects, such as choruses and flangers, in
    the 1980s via brands such as Boss. The 1990s saw the appearance of increasingly
    affordable and powerful DSP chips allowing cheap multi-fx units such as those
    from Zoom. These were cheap enough I could afford for my humble 1990s studio.
    I used a Zoom 1204 to process sounds from the synthesis chip on my Amiga 1200
    computer.


    The era of DSP took an interesting turn in 1996 when Steinberg launched version
    one of its Virtual Studio Technology (VST). This opened the door for developers
    to create all kinds of signal-processing plugins running on standard PC and Mac
    hardware, instead of requiring specialised outboard DSP systems. It ushered in
    the era of modern music production where producers could work


    > ¹http://jamielidellmusic.com/'
  merge: -1
