  md: "# Neural FX: LSTM network\n\n![](img/f36e66929543fe6d506774ef8e004b7e_284_0.png)\n\
    \n# Figure 32.1\n\nWhat does our simple, random LSTM do to a sine wave? It changes\
    \ the shape of the wave and introduces extra frequencies.\n\neven with one LSTM\
    \ unit, we are already creating the kind of harmonic distortion that guitar players\
    \ wax lyrical about when discussing their valve amplifier setups.\n\n# 32.6 What\
    \ is the LSTM doing?\n\nAs we saw in the previous section, a single LSTM layer\
    \ with a single unit can add interesting harmonic distortion to audio signals.\
    \ How does it do that? An LSTM unit is a rather elaborate delay and feedback unit\
    \ with four distinct, parameterised components: input gate, forget gate, output\
    \ gate and update system. These components work together to manage previous inputs,\
    \ previous state and outputs to the unit to compute its subsequent output. As\
    \ the name suggests, it can take account of the short-term, i.e. recent inputs\
    \ and outputs, and the longer-term, i.e. less inputs and outputs. Schmidhuber\
    \ invented the LSTM in 1997 to solve the problem of networks losing track of older\
    \ parts of the signal they were modeling[7]. The design allows the LSTM to learn\
    \ to forget certain things and remember others.\n\nLet's take a quick look at\
    \ the parameters that control those four components:\n\n```\nfor p in my_lstm.parameters():\n\
