  md: '# Python setup instructions


    learning and audio processing, you must install additional packages to your machine.
    Python packages are equivalent to C++ libraries. I will show you how to install
    Python packages after I explain how to set up a virtual environment in the next
    section.


    # 6.3 Virtual environments


    Virtual environments allow you to set up Python environments on your machine with
    particular package versions installed. The idea is that the virtual environment
    can be a frozen environment that is more likely to work in the future, even if
    you upgrade your system-wide Python install. It is common for machine learning
    researchers to provide package lists along with their code repositories, which
    allow you to set up a virtual environment that is as close as possible to the
    one in which they developed their code.


    I recommend you do all your machine learning in Python environments. At least
    when you are working on your own machine. Here are the commands to set up and
    activate a Python environment.


    Windows:


    ```

    python.exe -m venv C:\Users\user\myenv

    cd myenv

    \Scripts\activate

    ```


    macOS and Linux:


    ```

    python3 -m venv /path/to/my/mypthonenv

    source /path/to/my/mypthonenv/bin/activate

    ```


    # 6.4 Anaconda’s virtual environments


    Some people prefer to use Anaconda to control their Python environments. In that
    case, you need to run different commands to create and activate the virtual environment.
    Alternatively, you can use the Anaconda UI to configure things. I will provide
    the Anaconda commands here in case they are helpful, but I have experimented with
    Anaconda, and I prefer my lower-level, straightforward Python setup.


    +   conda create -n yourenname

    conda activate yourenname'
