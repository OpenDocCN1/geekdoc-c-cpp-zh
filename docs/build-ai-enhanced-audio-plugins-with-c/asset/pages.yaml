  md: '# 28


    # Convolution


    In this chapter, I am going to discuss convolution. Convolution is the process
    that allows you to compute the effect of passing a given signal through a given
    system. We will look at two ways of carrying out convolution - in the time and
    frequency domains. The time-domain process maps closely to the equations we have
    seen already, making it easy to understand. The frequency domain version is far
    more efficient but it is a less direct interpretation of the equations we saw
    in the previous chapter. As you work through the chapter you will see various
    code examples, initially running on the command line to process audio files with
    convolution. At the end of the chapter, you will see how you can implement efficient
    convolution using the built-in DSP components available in the JUCE API, resulting
    in a convolution reverb plugin.


    # 28.1 System setup


