    # 237


    ![](img/f36e66929543fe6d506774ef8e004b7e_255_0.png)


    **Figure 29.4**nTypes of IIR filter and their frequency responses. IIR filter
    design is a com-promise.


    For example, say you want a band-pass filter. Band-pass filters have frequency
    responses that permit a band of middle frequencies through, blocking low and high
    frequencies. Once you have identified the frequency response you desire for your
    filter, you must use filter design techniques to approximate that response. There
    are families of IIR filters, such as Chebyshev and Elliptical. Figure 29.4 presents
    two real IIR filter responses. You can see how the Chebyshev and Elliptical filters
    approximate the ideal band-pass filter in different ways – the Chebyshev has more
    ‘ripple’ in the pass band with a flatter high and low response. The Elliptical
    filter has a flat pass response, with more ripple in the low and high frequencies.
    You would choose an approach depending on your requirements.


    That brief filter design concludes our high-level introduction of IIR filters.
    In the following section, I will show you some simple filter design techniques
    based on the IIRCo class in JUCE.


