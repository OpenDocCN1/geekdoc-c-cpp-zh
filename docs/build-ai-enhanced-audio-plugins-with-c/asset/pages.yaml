  md: '# Untrained torchknob


    Then to compute softmax of 10.2:


    $$\frac{exp(10.2)}{exp(10.2) + exp(1.5)} = 0.9998 \quad (14.5)$


    and softmax of 1.5:


    $$\frac{exp(1.5)}{exp(10.2) + exp(1.5)} = 0.0002 \quad (14.6)$


    Since the sum of the softmax of all outputs is 1, softmax is typically used to
    convert output layer values into probabilities. This is useful for classification,
    which is a common task for neural networks. For example, a given image contains
    a dog or a cat? In classification tasks, the outputs represent the network''s
    estimation of the probability belonging to a given class, and softmax is a handy
    layer that converts inputs of any range to outputs in range 0-1, totalling 1.
    We can use softmax as a convenient layer to put the outputs in predictable ranges.
    In this NeuralNetwork class, it is fairly easy to add layers.


    **Step 1**: Add a field of the appropriate type for layer to the private section
    of NeuralNetwork class in NeuralNetwork.h. For a softmax layer:


    ```

    torch::Softmax(nullptr);

    ```


    **Step 2**: Call `register_module` in the constructor of NeuralNetwork:


    ```

    1 softmax = register_module(

    2   "softmax", // name it

    3   torch::Softmax(1) // configure it

    4 );

    ```


    Note that softmax takes one argument to its constructor, and a ''1'' is appropriate
    for its purposes. According to the PyTorch documentation, this constructor argument
    ''dim'' is ''A dimension along which softmax will be computed (so every slice
    along will sum to 1).


    **Step 3**: Pass the output of the linear layer through the softmax layer in the
    NeuralNetwork''s private forward function. Here is the new, complete forward function:


    ```

    1 torch::NeuralNetwork::forward(const torch::Tensor& input)

    2 {

    3   std::cout << "forward input " << input << std::endl;

    4   torch::Tensor out = linear(input);

    5   std::cout << "forward after linear " << out << std::endl;

    6   out = softmax(out);

    7   std::cout << "forward softmax " << out << std::endl;

    8   return out;

    9 }

    ```'
