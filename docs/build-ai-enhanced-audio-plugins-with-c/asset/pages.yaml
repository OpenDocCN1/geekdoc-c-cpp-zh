    # Untrained torchknob


    This chapter provides instructions on replacing the linear interpolation system
    in the superknob with a neural network. We shall call this new system the ''torchknob''.
    The chapter will guide you through creating a simple neural network that can map
    from a single input to two output controls, adding a softmax layer to manage the
    output ranges. You will create a separate NeuralNetwork class which is designed
    to provide functions for passing data and training the network. At the end of
    the chapter, you will be able to control the FM synthesizer controls using a neural
    network, though not in a very predictable way!


    # 14.1 Torchknob software architecture


    Figure 14.1 shows a high-level architecture for the torchknob system. This is
    structurally similar to the superknob from the previous section, but instead of
    using range controls to specify the mapping from the large dial to the top to
    the synthesizer, the user trains a neural network to learn the mapping. The aim
    is to implement the Wekinator workflow mentioned previously:


    +   1. Set the parameter sliders to the desired position

    2. Set the torchknob to the desired position

    3. Store the torchknob -> sliders mapping as a training data point

    4. Back to step 1, until the user has defined as many input-output associations
    as they like

    5. Train the neural network on the set of torchknob -> sliders mappings

    6. Move the torchknob at the top, and the neural network will automatically set
    the sliders to the desired positions, inferring or regressing between the points
    in the training data'
