    The meta-controller is a relative of the Super-knob, but it is more powerful and
    intuitive. The meta-controller allows a user to create linear or non-linear mappings,
    unlike the more common linear mappings. And it can map arbitrarily dimensional
    controls, meaning you can map an x,y pad to 10 parameters, or any single slider
    to 100 parameters, or any other combination. This is many-to-many mapping. The
    meta-controller is more intuitive because it uses a ''learn by example'' workflow,
    sometimes referred to as interactive machine learning[34]. This means you can
    present it some examples of the mapping you want, and it will learn the configuration.
    I will talk more about interactive machine learning when we start work on the
    meta-controller; let''s get back to the topic of linear regression with neural
    networks.'
