    That number is the output from the LSTM in response to the 1.0 we sent in. What
    about the other variable that came back, h? That is the hidden state of the LSTM
    we passed in the 1.0. Think of the LSTM like an audio delay effect after you pass
    in a signal, the delay effect holds on that signal and repeats it. So, the delay
    changes its state after you pass in a value, and so the LSTM does. The PyTorch
    LSTM layer is designed so you can choose to reset or keep its previous state each
    time you pass in a number. So, if you hold on that hidden value x, you can pass
    it into the network next time, and remember what state it was after receiving
    the first value.


