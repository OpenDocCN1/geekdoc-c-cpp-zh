  md: '# Summary


    Servlet 3.0 comes with a new feature for processing asynchronous operations. This
    is especially useful when your servlet/JSP application is a very busy one with
    one or more long-running operations. This feature works by assigning those operations
    to a new thread and thereby releasing the request processing thread back to the
    pool, ready to serve another request. In this chapter you learned how to write
    servlets that support asynchronous processing as well as listeners that get notified
    when certain events occur during the processing.'
