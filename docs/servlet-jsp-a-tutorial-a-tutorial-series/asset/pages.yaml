    # Expressions


    An expression is evaluated and its result fed to the out implicit object. An expression
    starts with <%%= and ends with %>. For example, the text in bold in the following
    line is an expression:


    Today is <%java.util.Calendar.getInstance().getTime()%>


    Note that there is no semicolon after an expression.


    With this expression, the JSP container first evaluates java.util.Calendar.getInstance().getTime(),
    and then passes the result to out.print(). This is the same as writing this scriptlet:


    Today is


    ```

    <%

    out.print(java.util.Calendar.getInstance().getTime());

    %>

    ```


