  md: '# 380 Servlet & JSP: A Tutorial


    +   - Indicate whether EL is ignored

    - Indicate whether scripting elements are allowed

    - Indicate page encoding information

    - Indicate that a resource is a JSP document (written in XML)

    - Prelude and code automatic includes


    The **jsp-property-group** element has the following subelements:


    +   - an optional **description** element

    - an optional **display-name** element

    - an optional **icon** element

    - one or more **url-pattern** elements

    - an optional **el-ignored** element

    - an optional **page-encoding** element

    - an optional **scripting-invalid** element

    - an optional **is-xml** element

    - zero or more **include-prelude** elements

    - zero or more **include-code** elements


    The **url-pattern** element is used to specify a URL pattern that will be affected
    by the property settings.


    The **el-ignored** element can have a boolean value of true or false. A value
    of true means that the EL expressions will not evaluated in the JSP pages whose
    URL match the specified URL pattern(s). The default value of this element is false.


    The **page-encoding** element specifies the encoding for the JSP pages whose URL
    match the specified URL pattern(s). The valid value for **page-encoding** is the
    same as the value of the **pageEncoding** attribute of the page directive used
    in a matching JSP page. There will be a translation-time error to name a different
    encoding in the **pageEncoding** attribute of the page directive of a JSP page
    and in a JSP configuration element matching the page. It is also a translation-time
    error to name a different encoding in the prolog or text declaration of a document
    in XML syntax and in a JSP configuration element matching the document. It is
    legal to name the same encoding through multiple mechanisms.'
  merge: -1
  pgno: 389
- img_proc: true
  md: "The scripting-invalid element accepts a boolean value. A value of true means\
    \ that scripting is not allowed in the JSP pages whose URLs match the specified\
    \ pattern(s). By default, the value of the scripting-invalid element is false.\n\
    \nThe is-xml element accepts a boolean value and true indicates that the JSP pages\
    \ whose URLs match the specified pattern(s) are JSP documents.\n\nThe include-prelude\
    \ element is a context-relative path that must correspond to an element in the\
    \ servlet/JSP application. When the element is present, the given path will be\
    \ automatically included (as in an include directive) at the beginning of each\
    \ JSP page whose URL matches the specified pattern(s).\n\nThe include-coda is\
    \ a context-relative path that must correspond to an element in the application.\
    \ When the element is present, the given path will be automatically included (as\
    \ in the include directive) at the end of each JSP page in this jsp-property-group\
    \ element.\n\nFor example, here is a jsp-property-group element that causes EL\
    \ evaluation in all JSP pages to be ignored.\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>*.jsp</url-pattern>\n    <el-ignored>true</el-ignored>\n  </jsp-property-group>\n\
    </jsp-config>\n```\n\nAnd, here is a jsp-property-group element that is used to\
    \ enforce free JSP pages throughout the application.\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>*.jsp</url-pattern>\n    <scripting-invalid>true</scripting-invalid>\n\
    \  </jsp-property-group>\n</jsp-config>\n```"
