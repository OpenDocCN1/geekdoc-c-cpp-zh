    # HttpMethodConstraint


    This annotation type represents a security constraint on a specific HTTP method.
    The HttpMethodConstraint annotation can only appear within the ServletSecurity
    annotation.


    The attributes of HttpMethodConstraint are given in Table B.2.


    | Attribute | Description |

    | --- | --- |

    | emptyRoleSemantic | The default authorization semantic. The value must be one
    of the members of the ServletSecurity.EmptyRoleSemantic enum (DENY or PERMIT).
    |

    | rolesAllowed | A string array representing the authorized roles. |

    | transportGuarantee | Indicates whether or not there is a data protection requirement
    that must be met. The valid value is a member of the ServletSecurity.TransportGuarantee
    enum (CONFIDENTIAL or NONE). |

    | value | The HTTP method affected. |


    Table B.2: HttpMethodConstraint attributes'
