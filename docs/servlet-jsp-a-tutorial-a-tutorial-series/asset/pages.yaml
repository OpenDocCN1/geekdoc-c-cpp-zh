  md: '# Servlet


    The Servlet interface defines these five methods.

    void init(ServletConfig config) throws ServletException

    void service(ServletRequest request, ServletResponse response) throws ServletException,
    java.io.IOException

    void destroy()

    java.lang.String getServletInfo()

    ServletConfig getServletConfig()


    Note that the convention for writing a Java method signature is to use the fully-qualified
    name for types that are not in the same package as the type containing the method.
    As such, in the signature of the service method javax.servlet.ServletException,
    which is in the same package as Servlet, is written without the package information
    whereas java.io.Exception is written fully.


    **init, service, and destroy** are lifecycle methods. The servlet container invokes
    these three methods according to these rules.


    +   - **init.** The servlet container invokes the first time the servlet is requested.
    This method is not called at subsequent requests. You use this method to write
    initialization code. When invoking this method, the servlet container passes a
    ServletConfig. Normally, you will assign the ServletConfig to a class level variable
    so that this object can be used from other points in the servlet class.

    - **service.** The servlet container invokes this method each time the servlet
    is requested. You write the code that the servlet is supposed to do here. The
    first time the servlet is requested, the servlet container calls the init method
    and the service method. For subsequent requests, only service is invoked.

    - **destroy.** The servlet container invokes this method when the servlet is about
    to be destroyed. This occurs when the application is unloaded or when the servlet
    container is being shut down. Normally, you write clean-up code in this method.'
