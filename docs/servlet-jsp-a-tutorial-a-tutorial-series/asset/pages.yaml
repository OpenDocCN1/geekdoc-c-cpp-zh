  md: '# Appendix B: Web Annotations 427


    For example, the following ServletSecurity annotation employs both the value and
    httpMethodConstraints attributes. The HttpConstraint annotation defines rules
    that can access the annotated servlet and the HttpMethodConstraint annotation,
    which is written without the rolesAllowed attribute, overrides the constraint
    for the Get method. As such, the servlet can be accessed by Get by any user. On
    the other hand, access via all other HTTP methods can only be granted to users
    in the manager role.


    ```

    @ServletSecurity(value = @HttpConstraint(rolesAllowed = "manager\),

    httpMethodConstraints = {@HttpMethodConstraint("GET")})

    ```


    However, if the emptyRoleSemantic attribute of the HttpMethodConstraint annotation
    type is assigned EmptyRoleSemantic.DENY, the method is restricted for all users.
    example, the servlet annotated with the following ServletSecurity annotation prevents
    access via the Get method but allows access to all users in the member role via
    other HTTP methods.


    ```

    @ServletSecurity(value = @HttpConstraint(rolesAllowed = "member")

    httpMethodConstraints = {@HttpMethodConstraint(value = "GET",

    emptyRoleSemantic = EmptyRoleSemantic.DENY)})

    ```


    # MultipartConfig


    The MultipartConfig annotation type is used to annotate a servlet to indicate
    that instances of the servlet is capable of handling the multipart/form-data MIME
    type, which is commonly used when uploading files.


    Table B.3 lists the attributes of MultipartConfig.


    For example, the following MultipartConfig annotation specifies that the maximum
    file size that can be uploaded is a million bytes.


    ```

    @MultipartConfig(maxFileSize = 1000000)

    ```'
