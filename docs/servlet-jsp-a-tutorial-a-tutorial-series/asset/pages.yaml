  md: '# 182 Servlet & JSP: A Tutorial


    # Tag File Directives


    Just like JSP pages, tag files can use directives to control how the JSP container
    will compile or interpret the tag files. Tag file directives have the same syntax
    as JSP directives:


    ```

    <%@ directive="value" * %>

    ```


    The asterisk (*) means that what is enclosed in the brackets can be repeated zero
    or more times. The syntax can be re-written in a more informal way as follows:


    ```

    <@ directive attribute1="value1" attribute2="value2" ... %>

    ```


    Attributes must be enclosed with single quotes and double quotes, and white spaces
    after the opening %@ and before the closing %> are optional but can improve readability.


    All JSP directives except page are available in tag files. Instead of page, you
    have the tag directive at your disposal. Also, in tag files, there are two more
    directives you can use, attribute and variable. Table 7.2 lists all the directives
    that can appear in a tag file.


    | Directive | Description |

    |---|---|n| tag | This directive is similar to the page directive for JSP pages.
    Use this directive to include other resources from the tag file | taglib | Use
    this directive to use a custom tag library from inside the tag file |

    | attribute | Use this directive to declare an attribute in a tag file. |

    | variable | Use this directive to define a variable that you can expose to the
    calling JSP page. |


    Table 7.2: Tag File Directives


    Each of the directives is given in a separate section below.


    # The tag Directive


    The tag directive is similar to the page directive you use in JSP pages. Here
    is the syntax of the tag directive:'
