  md: '# The setTimeZone Tag


    You use the setTimeZone tag to store the specified time zone in a scoped variable
    or the time configuration variable. The syntax of setTimeZone is as follows:


    ```

    <fmt:setTimeZone value="timeZone" [var="varName"] [scope="page|request|session|application"]

    />

    ```


    Table 5.13 presents the setTimeZone tag''s attributes.


    | Attribute | Type | Description |

    | --- | --- | --- |

    | value+ | String or java.util.TimeZone | The time zone |

    | var | String | The name of the scoped variable to hold the time zone of type
    java.util.TimeZone |

    | scope | String | The scope of var or the time zone configuration variable |


    Table 5.13: The setTimeZone tag''s attributes


    # The parseNumber Tag


    You use parseNumber to parse a string representation of a number, a currency,
    or a percentage in a locale-sensitive format into a number. The syntax has two
    forms. The first form is used without body content:


    ```

    <fmt:parseNumber value="numericValue" [type="number|currency|percent"] [pattern="customPattern"]
    [parseLocale="parseLocale"] [integerOnly={true|false}] [var="varName"] [scope="page|request|session|application"]

    />

    ```


    The second form is used with body content:


    ```

    <fmt:parseNumber type="number|currency|percent" [pattern="customPattern"] [parseLocale="parseLocale"]
    [integerOnly={true|false}">

    ```'
