  md: '# 218 Servlet & JSP: A Tutorial


    This method returns an Enumeration of filter parameter names. If no parameter
    exists for the filter, this method returns an empty Enumeration.


    The second method for handling initial parameters is getParameter: java.lang.String
    getInitParameter(java.lang.String parameterName)


    There are two ways to configure a filter. You can configure a filter using the
    WebFilter annotation type or by registering it in the deployment descriptor. Using
    @WebFilter is as easy as you need to annotate the filter class and you do not
    need to deploy the descriptor. However, changing the configuration settings requires
    that the filter class be recompiled. On the other hand, configuring a filter in
    the deployment descriptor means changing configuration values is a matter of editing
    a text file.


    To use @WebFilter, you need to be familiar with its attributes. Table 9.1 lists
    attributes that may appear in the WebFilter annotation type. All attributes are
    optional.


    | Attribute | Description |

    | --- | --- |

    | asyncSupported | Specifies whether or not the filter supports the asynchronous
    operation mode |

    | description | The description of the filter |

    | dispatcherTypes | The dispatcher types to which the filter applies |

    | displayName | The display name of the filter |

    | filterName | The name of the filter |

    | initParams | The initial parameters |

    | largeIcon | The name of the large icon for the filter |

    | servletNames | The names of the servlets to which the filter applies |

    | smallIcon | The name of the small icon for the filter |

    | urlPatterns | The URL patterns to which the filter applies |

    | value | The URL patterns to which the filter applies |


    Table 9.1: WebFilter attributes


    For instance, the following @WebFilter annotation specifies that the filter name
    is DataCompressionFilter and it applies to all resources.


    ```

    @WebFilter(filterName="DataCompressionFilter"

    ```


    This is equivalent to declaring these filter and filter-mapping elements in the
    deployment descriptor.'
