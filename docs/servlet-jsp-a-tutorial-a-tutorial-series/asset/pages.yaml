    >\n<struts>\n  ...\n</struts>\n```\n\nThe more important elements that can appear\
    \ between <struts> and </struts> are discussed next.\n\n# The package Element\n\
    \nSince Struts has been designed with modularity in mind, actions are grouped\
    \ into packages. Think packages as modules. A typical struts.xml file can have\
