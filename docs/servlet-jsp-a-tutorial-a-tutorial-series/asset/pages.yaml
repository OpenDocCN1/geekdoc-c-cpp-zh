  md: "# 68 Servlet & JSP: A Tutorial\n\nYou can retrieve an HttpSession’s identifier\
    \ by calling the getId method on the HttpSession.\njava.lang.String getId()\n\n\
    There is also an invalidate method defined in HttpSession. This method forces\
    \ the session to expire and unbind all objects bound to it. By default, an HttpSession\
    \ expires after some period of user inactivity. You can configure the session\
    \ timeout for the whole application through the session-timeout element in the\
    \ deployment descriptor (See Chapter 16, “Deployment.\") For example, setting\
    \ this value to 30 makes all session objects expire thirty minutes after the user’s\
    \ last visit. If this element is not configured, the timeout will be determined\
    \ by the servlet controller.\n\nIn most cases, you would want to destroy unused\
    \ HttpSession instances before their expiration times if you could free up some\
