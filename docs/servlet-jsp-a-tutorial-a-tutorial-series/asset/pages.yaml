  md: '# Chapter 10: Application Design 235


    ![](img/45889fd1b2eef3ac27c1c5a024fe40c7_244_0.png)


    Figure 10.1: Model 2 architecture


    In a Model 2 application, every HTTP request must be directed to the controller.
    The request''s Uniform Request Identifier (URI) tells the controller what action
    to invoke. The term “action” refers to an operation that the application is able
    to perform. The Java object associated with an action is called an action object.
    A single action class may be used to serve different actions (as in Struts 2 and
    Spring MVC) or a single action (as in Struts 1).


    A seemingly trivial operation may take more than one action. For instance, adding
    a product to a database would require two actions:


    +   1. Display an “Add Product” form for the user to enter product information.

    2. Save the product information in the database.


    As mentioned above, you use the URI to tell the controller which action to invoke.
    For instance, to get the application to send the “Add Product” form, you would
    use a URI like this:


    ```

    http://domain/appName/product_input

    ```


    To get the application to save a product, the URI would be:


    ```

    http://domain/appName/product_save

    ```


    The controller examines the URI to decide what action to invoke. It also stores
    the model object in a place that can be accessed from the view, so that server-side
    values can be displayed on the browser. Finally, the controller uses a RequestDispatcher
    to forward to a view (JSP page). In'
