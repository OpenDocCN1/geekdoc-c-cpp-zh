  md: '# Chapter 16: Deployment 367


    +   - JSP-specific settings

    - JNDI settings


    The rules for each of the elements that may appear in a deployment descriptor
    are given in the web-app_3_0.xsd schema that can be downloaded from this site.


    ```

    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd

    ```


    The web-app_3_0.xsd schema includes another schema (web-common_3_0.xsd) that contains
    most of the information. The other schema can be found here.


    ```

    http://java.sun.com/xml/ns/javaee/web-common-3_0.xsd

    ```


    In turn, web-common_3_0.xsd includes two other schemas:


    +   - javaee_6.xsd, which defines common elements shared by other Java EE 6 deployment
    types (EAR, JAR and RAR)

    - jsp_2.2.xsd, which defines elements for configuring for JSP part of an application
    according to JSP 2.2 specification


    The rest of this section lists servlet and JSP elements that may appear in the
    deployment descriptor. It does not include Java EE elements that are not in the
    Servlet or JSP specification.


    # Core Elements


    This section discusses the more important elements in detail. Subelements of <web-app>
    can appear in any order. Certain elements, such as session-config, jsp-config,
    and login-config, can appear only once. Others, such as servlet, filter, and welcome-file-list,
    can appear many times.


    The more important elements that can appear directly under <web-app> are given
    a separate subsection. To find the description of an element which is not directly
    under <web-app>, trace its parent element. For example, the taglib can be found
