  md: "# 134 Servlet & JSP: A Tutorial\n\nbody content\n</c:forEach>\n\nThe body content\
    \ is JSP. The **forEach** tag's attributes are given in Table 5.6.\n\nFor example,\
    \ the following **forEach** tag displays “1, 2, 3, 4, 5”.\n\n```\n<c:forEach var=\"\
    x\" begin=\"1\" end=\"5\">\n  <c:out value=\"${x}\"/>\n</c:forEach>\n```\n\nAnd,\
    \ the following **forEach** tag iterates over the **phones** property of an **address**\
    \ scoped variable.\n\n```\n<c:forEach var=\"phone\" items=\"${address.phones}\"\
    >\n  ${phone}<br/>\n</c:forEach>\n```\n\nFor each iteration, the **forEach** tag\
    \ creates a scoped variable name specified by the **var** attribute. In this case,\
    \ the scoped variable is named **phone**. The EL expression within the **forEach**\
    \ tag is used to display the value of **phone**. The scoped variable is only available\
    \ within the beginning and closing **forEach** tags, and will be removed right\
    \ before the closing **forEach** tag.\n\nThe forEach tag has a varStatus variable\
    \ of type `javax.servlet.jsp.core.LoopStatus`. The `LoopStatus` interface has\
    \ the `count` property that returns the \"count\" of the current round of iteration.\
    \ The value of `status.count` is 1 for the first iteration, 2 for the second iteration,\
    \ and so on. By testing the remainder of `status.count%2`, you know whether the\
    \ tag is processing an even-numbered or odd-numbered element.\n\nAs an example,\
    \ consider the **BooksServlet** servlet and **books.jsp** page in the app05a application.\
