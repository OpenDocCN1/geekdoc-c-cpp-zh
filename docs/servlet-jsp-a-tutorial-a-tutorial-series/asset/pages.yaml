  md: "The most crucial and time consuming operation in accessing data in a database\
    \ is often trying to establish a connection. As a rule, in well-designed applications\
    \ database connections are always pooled. While managing connections can be complex\
    \ and challenging, fortunately there are Java libraries that do well. The following\
    \ are examples of Java database connection libraries.\n\n+   - Apache Commons\
    \ DBCP (http://commons.apache.org/dbcp)\n- C3P0 (http://sourceforge.net/projects/c3p0)\n\
    - Tomcat JDBC Connection in Tomcat 7\n\nApache Commons DBCP, especially the older\
    \ versions, has in the past been criticized for its complexity and sluggishness.\
    \ As such, it looks like C3P0 is a more sensible choice. If you're using Tomcat\
    \ 7, however, connection pool comes built-in with it.\n\nUntil a few years ago,\
    \ the most popular method for managing a connection pool was to not manage yourself\
    \ and let the servlet/JSP container manage it for you. Here is code for obtaining\
    \ a JDBC connection from a container-managed pool, using Java Naming and Directory\
    \ Interface (JNDI) lookup.\n\n```\nimport javax.naming.Context;\nimport javax.naming.InitialContext;\n\
    import javax.naming.NamingException;\nimport javax.sql.DataSource;\nimport java.sql.Connection;\n\
    import java.sql.SQLException;\n\n\n..\n```\n\n```\nConnection connection = null;\n\
    try {\n    Context context = new InitialContext();\n```"
