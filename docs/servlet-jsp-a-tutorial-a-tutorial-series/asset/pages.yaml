  md: 'translation unit. The default value is false. #{ is important because it is
    a special character sequence in the Expression Language (See Chapter 4, "The Expression
    Language.")


    +   trimDirectiveWhitespaces Indicates whether or not template text that contains
    only white spaces is removed from the output. The default is false; in other words,
    not to trim white spaces.


    The page directive can appear anywhere in a page. The exception is when it contains
    the contentType or the pageEncoding attribute, in which case it must appear before
    any template data and before sending any content using Java code. This is because
    the content type and the character encoding must be set prior to sending any content.


    The page directive can also appear multiple times. However, an attribute that
    appears in multiple page directives must have the same value. An exception to
    this rule is the import attribute. The effect of the import attribute appearing
    in multiple page directives is cumulative. For example, the following page directives
    import both java.util.ArrayList and java.io.File.


    ```

    <@page import="java.util.ArrayList%>

    <@page import="java.util.Date%%>

    ```


    This is the same as


    ```

    <@page import="java.util.ArrayList, java.util.Date%%>

    ```


    As another example, here is a page directive that sets the session attribute to
    false and allocates 16KB to the page buffer:


    ```

    <@page session="false" buffer="16kb%%>

    ```


    # The include Directive


    You use the include directive to include the content of another file in the current
    JSP page. You can use multiple include directives in a JSP page. Modularizing
    a particular content into an include file is useful if that content is used by
    different pages or used by a page in different places.


    The syntax of the include directive is as follows:


    ```

    <@ include file="java.util.Date%%>

    ```'
