    ${fn:containsIgnoreCase("Stella Cadente", "CADENTE")}

    ```


    # The endsWith Function


    The **endsWith** function tests whether a string ends with the specified suffix.
    The return value is a **Boolean**. Its syntax is as follows:


    ```

    endsWith(string, suffix)

    ```


    For example, the following EL expression returns **true**:


    ```

    ${fn:endsWith("Hello World", "World")}

    ```


    # The escapeXml Function


    This function is useful for encoding a **String**. The conversion is the same
    as the **out** tag with its **escapeXml** attribute set to **true**. The syntax
    of **escapeXml** is as follows:


    ```

    escapeXml(string)

    ```


    For example, the EL expression


    ```

    ${fn:escapeXml("Use <br/> to change lines")}

    ```


    is rendered as the following:


    Use &lt;br/&gt; to change lines'
