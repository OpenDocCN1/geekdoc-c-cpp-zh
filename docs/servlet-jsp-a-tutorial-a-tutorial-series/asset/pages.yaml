  md: '# # Chapter 14

    Asynchronous Processing


    Servlet 3 introduces a new feature that enables servlets to process requests asynchronously.
    This chapter explains explains this new feature and presents examples on how to
    make use of it.


    # # Overview


    A computer has limited memory. The servlet/JSP container designer knew this and
    provided some configurable settings to make sure the container could run within
    the hosting computer''s means. For instance, in Tomcat 7 the maximum number of
    threads for processing requests is 200. If you have a multiprocessor server, then
    you can safely increase this number, but other than it''s recommended to use this
    default value.


    A servlet or filter holds a request processing thread until it completes its task.
    The task takes a long time to complete and the number of concurrent users exceeds
    the number of threads, the container may run the risk of running out of threads.
    If this happens, Tomcat will stack up the requests in an internal server socket
    (other containers may behave differently). If more requests are still coming,
    they will be refused until there are resources to handle them.


    The asynchronous processing feature allows you to be frugal with container threads.
    You should use this feature for long-running operations. What this feature does
    is release the request processing thread while waiting for a task to complete
    so that the thread can be used by another request. Note that the asynchronous
    support is only suitable if you have a long running task AND you need to notify
    the user of the outcome of the task. If you only have a long running task but
    the user does not need to know the processing result, then you can just submit
    a Runnable to an Executor'
