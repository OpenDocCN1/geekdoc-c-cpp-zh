  md: '# paramValues


    You use the paramValues implicit object to retrieve the values of a request parameter.
    This object represents a Map containing all request parameters with the parameter
    names as the keys. The value for each key is an array of strings containing all
    the values for the specified parameter name. If the parameter has only one value,
    it still returns an array having one one element. For example, to obtain the first
    and second values of the selectedOptions, you use the following expressions:


    ```

    ${paramValues.selectedOptions[0]}

    ${paramValues.selectedOptions[1]}

    ```


    # header


    The header implicit object represents a Map that contains all request headers.
    To retrieve a header value, use the header name as the key. For example, to retrieve
    the value of the accept-language header, use the following expression:


    ```

    ${header["accept-language"]}

    ```


    If the header name is a valid Java variable name, such as connection, you can
    also use the . operator:


    ```

    ${header.connection}

    ```


    # headerValues


    The headerValues implicit object represents a Map containing all headers with
    the header names as keys. Unlike header, however, the Map returned by the headerValues
    implicit object returns an array of strings. For example, to obtain the first
    value of the accept-language header, use this expression:


    ```

    ${headerValues["accept-language"]][0]}

    ```'
