  md: '# 162 Servlet & JSP: A Tutorial


    The implementation for a custom tag is called a tag handler, and simple tag handlers
    refer to tag that implement SimpleTag. In this chapter, you''ll explore how custom
    tags work and how to write tag handlers. Only simple tag handlers will be discussed
    as there is no reason to write classic tag handlers anymore.


    In addition to being easier to write than classic tag handlers, simple tag handlers,
    unlike classic tag handlers, may not be cached by the JSP container. However,
    this does not mean simple tag handlers are slower than their predecessors. The
    JSP specification authors wrote in JSP.7.1.5 of the specification, "Initial performance
    metrics show that caching a tag handler instance does not necessarily lead to
    greater performance, and to accommodate such caching makes writing portable tag
    handlers difficult and makes the tag handler prone to error."


    # Simple Tag Handlers


    The designers of JSP 2.0 realized how complex it was to write custom tags and
    tag handlers in JSP 1.1 and JSP 1.2. As such, in JSP 2.0 they added a new interface
    to the javax.servlet.jsptagext package: SimpleTag. Tag handlers implementing SimpleTag
    are called simple tag handlers, and tag handlers implementing Tag, IterationTag,
    or BodyTag are called classic tag handlers.


    Simple tag handlers have a simpler lifecycle and are easier to write classic tag
    handlers. The SimpleTag interface has one method in regard to tag invocation that
    will be called only once: doTag. Business logic, iteration, and body manipulation
    are to be written here. A body in a simple tag handler is represented by an instance
    of the JspFragment class. JspFragment is discussed in the subsection, "JspFragment"
    towards the end of this section.


    The lifecycle of a simple tag handler is as follows:


    +   1. The JSP container creates an instance of a simple tag handler by calling
    its no-argument constructor. Therefore, a simple tag handler must have a no-argument
    constructor.'
