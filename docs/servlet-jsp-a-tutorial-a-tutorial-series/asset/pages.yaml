    \ are not customer facing, so the look of the login form is of little relevance.\
    \ In this case, declarative security can be used.\n\nThe interesting part of declarative\
    \ security is of course the fact that security constraints are not programmed\
    \ in servlets. Instead, they are declared in the deployment descriptor at the\
    \ time the application is deployed. As such, it allows considerable flexibility\
    \ in determining the users and roles that will have access to the application\
    \ or sections of it.\n\nTo use declarative security, you start by defining users\
    \ and roles. Depending on the container you're using, you can store user and role\
