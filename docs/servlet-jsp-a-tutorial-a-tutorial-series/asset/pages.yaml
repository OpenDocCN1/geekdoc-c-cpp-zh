  md: '# Introduction


    Welcome to Servlet and JSP: A Tutorial. This book covers Servlet 3.0 and JSP 2.2.


    Java Servlet technology, or Servlet for short, is the underlying technology for
    developing web applications in Java. Sun Microsystems released it in 1996 to compete
    with the Common Gateway Interface (CGI), the then standard for generating dynamic
    content on the web. The main problem with the CGI was the fact that it spawned
    a new process for every HTTP request. This made it difficult to write scalable
    CGI programs because creating a process took a lot of CPU cycles. A servlet, on
    the other hand, is much faster than a CGI program because a servlet stays in memory
    after serving its first request, waiting for subsequent requests.


    Since the day Servlet emerged, a number of Java-based web frameworks have been
    developed to help programmers write web applications more rapidly. These frameworks
    let you focus on the business logic and spend less time writing boilerplate code.
    However, you still have to understand the nuts and bolts of Servlet. JavaServer
    Pages (JSP), which was later released to make writing servlets easier. You may
    be using a great framework like Struts 2, Spring MVC, or JavaServer Faces. However,
    without excellent knowledge of Servlet and JSP, you won not be able to code effectively
    and efficiently. Servlets, by the way, are Java classes that run on a servlet
    container. A servlet container or servlet engine is like a web server but has
    the ability to generate dynamic contents, not only serve static resources.


    Servlet 3.0, the current version, is defined in Java Specification Request (JSR)
    315 (http://jcp.org/en/jsr/detail?id=315). It requires Java Standard Edition 6
    or later. JSP 2.2 is specified in JSP 245

    (http://jcp.org/en/jsr/detail?id=245). This book assumes you know Java and'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# 2 Servlet & JSP: A Tutorial


    object-oriented programming. If you''re new to Java, I recommend my own Java 7:
    A Beginner''s Tutorial (Third Edition), ISBN 978-0-9808396-1-6.


    The next sections of this introduction discuss servlet/JSP application architecture,
    the HTTP protocol, and the content of each chapter in this book.


    # Servlet/JSP Application Architecture


    A servlet is a Java program. A servlet application consists of one or more servlets.
    A JSP page is translated and compiled into a servlet.


    A servlet runs inside a servlet container and cannot run on its own. A servlet
    container passes requests from the user to the servlet application and responses
    from the servlet application back to the user. Most servlet applications include
    at least several JSP pages. As such, it''s more appropriate to use the term "servlet/JSP
    application" to refer to a Java web application than to leave JSP out.


    Web users use a web browser as Internet Explorer, Mozilla Firefox, or Google Chrome
    to access servlet applications. A web browser is referred to as a web client.
    Figure I.1 shows the architecture of a servlet/JSP application.


    ![](img/45889fd1b2eef3ac27c1c5a024fe40c7_11_0.png)


    Figure I.1: Servlet/JSP application architecture


    The web server and the web client communicate in a language they both are fluent
    in: the Hypertext Transfer Protocol (HTTP). Because of this, a web'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# Introduction


    server is also called an HTTP server. HTTP is covered in more detail in the next
    section.


    A servlet/JSP container is a special web server that can process servlets as well
    as serve static contents. In the past, people were more comfortable running a
    servlet/JSP container as a module of an HTTP server such as the Apache HTTP Server
    was considered more robust than a servlet/JSP container. In this scenario the
    servlet/JSP container would be tasked with generating dynamic contents and the
    HTTP server with serving static resources. Today servlet/JSP containers are considered
    mature and widely deployed without an HTTP server. Apache Tomcat and Jetty are
    the most popular servlet containers and free and open-source. You can download
    them from http://tomcat.apache.org and http://jetty.codehaus.org, respectively.


    Servlet and JSP are two of technologies defined in the Java Enterprise Edition
    (EE). Other Java EE technologies include Java Message Service (JMS), Enterprise
    JavaBeans (EJB), JavaServer Faces (JSF), and Java Persistence. The complete list
    of technologies in the Java EE version 6 (the current version) can be found here.


    http://www.oracle.com/technwork/java/javaee/tech/index.html


    To run a Java EE application, you need a Java EE container, such as GlassFish,
    JBoss, Oracle WebLogic, and IBM WebSphere. You can deploy a servlet/JSP application
    in a Java EE container, but a servlet/JSP container is sufficient and is more
    lightweight than a Java EE container. Tomcat and Jetty are not Java EE containers,
    so they cannot run EJB or JMS.


    # The Hypertext Transfer Protocol (HTTP)


    The HTTP protocol enables web servers and browsers to exchange data over the Internet
    or an intranet. The World Wide Web Consortium (W3C), an international community
    that develops standards, is responsible for revising and maintaining this protocol.
    The first version of HTTP was HTTP 0.9, which was then replaced by HTTP 1.0. Superseding
    HTTP 1.0 is HTTP 1.1, the current version. HTTP 1.1 is defined in the W3C''s Request'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Servlet & JSP: A Tutorial


    for Comments (RFC) 2616, which can be downloaded from http://www.w3.org/Protocols/HTTP/1.1/rfc2616.pdf.


    A web server runs 24x7 waiting for HTTP (normally web browsers) to connect to
    and ask for resources. In HTTP it is always the client that initiates a connection,
    a server is never in a position to contact a client. To locate a resource, an
    Internet user clicks a link that contains a Uniform Resource Locator (URL) or
    enter one in the Location box of his/her browser. Here are two examples of URLs:


    ```

    http://google.com/index.html

    http://facebook.com/index.html

    ```


    The first part of the URLs is http, which identifies the protocol. Not all URLs
    use HTTP. For instance, these two URLs are valid even though they are not HTTP-based
    URLs:


    +   - mailto:joe@example.com

    - ftp://marketing@ftp.example.com


    In general a URL has this format:


    ```

    protocol://[host].domain[:port][/context]/[resource][?query string]


    protocol://IP address[:port][/context]/[resource][?query string]

    ```


    The parts in square brackets are optional, therefore a URL can be as simple as
    http://yahoo.co.ca or http://192.168.1.9. An Internet Protocol (IP) address, by
    the way, is a numerical label assigned to a client or another device. A computer
    may host more than one domain, so multiple domains can have the same IP address.
    In other words, instead of typing http://google.com, you can use its IP address:
    209.85.143.99. To find out what the IP address of a domain is, use the ping program
    on your computer console:


    ```

    ping google.com

    ```


    An IP address is hard to remember, so people prefer to use a domain. And, did
    you know that you can''t buy example.com and example.org because they are reserved
    for documentation purpose?'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'The host part may be present and identify a totally different location on the
    Internet or an intranet. For instance, http://yahoo.com (no host) brings you a
    different location than http://mail.yahoo.com (with a host). Over the years wwww
    has been the most popular host name and become the default. Normally, http://www.domainName
    is mapped to http://domainName.


    80 is the default port of HTTP. Therefore, if a web server runs on port 80, you
    don''t need the port number to reach the server. Sometimes, however, a web server
    doesn''t run on port 80 and you need to type the port number. For example, Tomcat
    by default runs on port 8080, so you need to supply the port number:


    ```

    http://localhost:8080

    ```


    localhost is a reserved name typically used to refer to the local computer, i.e.
    the same context web browser is running on.


    The context in a URL refers to the application name, but this is also optional.
    A web server can run multiple contexts (applications) and one of them can be configured
    to be the default context. To request a resource in the default context, you skip
    the context part in a URL.


    Finally, a context can have one or more default resources (ordinarily index.html
    or index.htm or default.htm). A URL without a resource name is considered to identify
    a default resource. Of course, if more than one default resource exists in a context,
    the one with the highest priority will always be returned when a client does not
    specify a resource name.


    After a resource name comes one or more query string. A query string is a key/value
    pair that can be passed to the server to be processed. You''ll learn more about
    query strings in the next chapters.


    The following subsections discuss HTTP requests and responses in more detail.


    # HTTP Requests


    An HTTP request consists of three components:


    +   Method—Uniform Resource Identifier (URI)—Protocol/Version'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Servlet & JSP: A Tutorial


    +   - Request headers

    - Entity body


    Here is a sample HTTP request:


    ```

    POST /examples/default.jsp HTTP/1.1

    Accept: text/plain; text/html

    Accept-Language: en-gb

    Connection: Keep-Alive

    Host: localhost

    User-Agent: Mozilla/5.0 (Macintosh; U; Intel Mac OS X 10.5; en-US;

    rv/1.9.2.6) Gecko/20100625 Firefox/3.6.6

    Content-Length: 30

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip, deflate

    lastName=Blanks&firstName=Mike

    ```


    The method—URI protocol version appears as the first line of the request.


    ```

    POST /examples/default.jsp HTTP/1.1

    ```


    Here POST is the request method, /examples/default.jsp the URI, and HTTP/1.1 the
    Protocol/Version section.


    An HTTP request can use one of the many request methods specified in the HTTP
    standards. HTTP 1.1 supports seven request types: GET, POST, HEAD, OPTIONS, PUT,
    DELETE, and TRACE. GET and POST are the most commonly used in Internet applications.


    The URI specifies an Internet resource. It is usually interpreted as being relative
    to the server''s root directory. Thus, it should always begin with a forward slash
    /. A Uniform Resource Locator (URL) is actually a type of URI (See http://www.ietf.org/rfc/rfc2396.txt).


    In an HTTP request, the request header contains useful information about the client
    environment and the entity body of the request. For instance, it may contain the
    language the browser is set for, the length of the entity body, and so on. Each
    header is separated by a carriage return/linefeed (CRLF) sequence.


    Between the headers and the entity body is a blank line (CRLF) that is important
    to the HTTP request format. The CRLF tells the HTTP server'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'where the entity body begins. In some Internet programming books, this CRLF
    is considered the fourth component of an HTTP request.


    In the previous HTTP request, the entity body is simply the following line:

    lastName=Blanks&firstName=Mike


    The entity body can easily be much longer in a typical HTTP request.


    # HTTP Responses


    Similar to an HTTP request, an HTTP response also consists of three parts:


    +   * Protocol—Status code—Description

    * Response headers

    * Entity body


    The following is an example of an HTTP response:


    ```

    HTTP/1.1 200 OK

    Server: Apache-Coyote/1.1

    Date: Thu, 5 Jan 2012 13:13:33 GMT

    Content-Type: text/html

    Last-Modified: Wed, 4 Jan 2012 13:13:12 GMT

    Content-Length: 112

    ```


    ```

    <html>

    <head>

    <title>HTTP Response Example</title>

    </head>

    <body>

    Welcome to Brainy Software

    </body>

    </html>

    ```


    The first line of the response header is similar to the first line of the request
    header. It tells you that the protocol used is HTTP version 1.1, and that the
    request succeeded (200 is the success code).


    The response headers contain useful information similar to the headers in an HTTP
    request. The entity body of the response is the HTML content'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# Servlet & JSP: A Tutorial


    the response itself. The headers and the entity body are separated by a sequence
    of CRLFs.


    Status code 200 is only issued if the web server was able to find the resource
    requested. If a resource cannot be found or the request cannot be understood,
    the server sends a different request code. For instance, 401 is the status code
    for an unauthorized access and 405 indicates that the HTTP method is not allowed.
    For a complete list of HTTP status codes, refer to this online document.


    ```

    http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html

    ```


    # About This Book


    This section presents an overview of each chapter.


    Chapter 1, "Servlets" introduces the Servlet API and presents several simple servlets.
    This chapter focuses on two of the four Java packages of the Servlet API, the
    javax.servlet and javax.servlet.http packages.


    Chapter 2, "Session Management" discusses session tracking or session management,
    a very important topic in web application development due to the statelessness
    of HTTP. This chapter explores four techniques for retaining states: URL rewriting,
    hidden fields, cookies, and the HTTPSHttpSession objects.


    JavaServer Pages (JSP) is a technology that complements Servlet. Chapter 3, "JavaServer
    Pages" covers the JSP syntax, directives, scripting elements, and actions.


    Chapter 4, "The Expression Language" explains one of the most important features
    added in JSP 2.0, the Expression Language (EL). The EL aims to make possible to
    author script-free JSP pages and help you write shorter and more effective JSP
    pages. In this chapter you will learn to use the EL to access JavaBeans and scoped
    objects.


    Chapter 5, "JSTL" explains the most important libraries in the JavaServer Pages
    Standard Tag Library (JSTL), a collection of custom tag libraries for solving
    common problems such as iterating over a map or'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'collection, conditional testing, XML processing, and even database access and
    data manipulation.


    Most of the time you will use JSTL to access scoped objects and perform other
    tasks in your JSP pages. However, for more specific tasks, you may need to write
    your own custom tags. Chapter 6, “Writing Custom Tags” teaches you how to do that.


    Chapter 7, “Tag Files” discusses tags, a new feature in JSP 2.0 that makes writing
    custom actions simpler. This chapter covers several aspects of writing custom
    tags using tag files only.


    Chapter 8, “Listeners” talks about event-driven programming in Servlet. It discusses
    the event classes and listener interfaces that come with the Servlet API and shows
    how to write listeners and use them in servlet/JSP applications.


    Chapter 9, “Filters” covers filters, which are web objects that intercept requests.
    This chapter discusses the Filter API that includes the **Filter**, **FilterConfig**,
    and **FilterChain** interfaces as well as how to write filters by implementing
    the **Filter** interface.


    Chapter 10, “Application Design” explains the Model 2 Architecture, the recommended
    architecture for all but the simplest Java web applications. Several examples
    are given to illustrate different components in Model 2 applications.


    Chapter 11, “File Upload” shows how to make use of the Servlet 3 file upload feature
    and what can be done on the client side to improve user experience.


    Chapter 12, “File Download” explains how to send a resource to the browser programmatically.


    The Servlet API comes with classes for wrapping servlet requests and responses.
    In Chapter 13, “Decorating Requests and Responses” you learn how to use the Decorator
    pattern and these classes to change the behavior of servlet requests and responses.


    Chapter 14, “Asynchronous Processing” discusses a new feature in Servlet 3.0 for
    processing asynchronous operations. This feature is especially useful when your
    servlet/JSP application is a very busy one with'
  merge: -1
  pgno: 18
- img_proc: true
