  md: '# Chapter 10: Application Design 261


    ![](img/45889fd1b2eef3ac27c1c5a024fe40c7_270_0.png)


    Figure 10.7: The DAO pattern


    A typical DAO class takes care of the addition, deletion, modification, and retrieval
    of an object, and the searching for those objects. For example, a ProductDAO class
    may support the following methods:


    ```

    void addProduct(Product product)

    void updateProduct(Product product)

    void deleteProduct(int productId)

    Product getProduct(int productId)

    List<Product> findProducts(SearchCriteria searchCriteria)

    ```


    In your DAO implementation classes, you can either write SQL statements manually
    or use a Java Persistence API (JPA) implementation such as Hibernate to take care
    of database data. JPA is unfortunately outside the scope of this book, but you
