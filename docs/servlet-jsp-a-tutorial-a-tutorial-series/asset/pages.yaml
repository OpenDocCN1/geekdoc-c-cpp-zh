  md: '# Servlet Security API


    Besides the annotation types discussed in the previous section, programmatic security
    can also be achieved using the following methods of the HttpServletRequest interface.


    ```

    java.lang.String getAuthType()

    ```


    Returns the authentication scheme used to protect the servlet or null if no security
    constraint is being applied to the servlet.


    ```

    java.lang.String getRemoteUser()

    ```


    Returns the login of the user making this request or null if the user has not
    been authenticated.


    ```

    boolean isUserInRole(java.lang.String role)

    ```


    Returns a boolean indicating whether or not the user belongs to the specified
    role.


    ```

    java.lang.Principal getUserPrincipal()

    ```


    Returns a java.security.Principal containing the details of the current authenticated
    user or null if the user has not been authenticated.


    ```

    boolean authenticate(HttpServletResponse response) throws java.io.IOException

    ```


    Authenticates the user by instructing the browser to display a login form.


    ```

    void login(java.lang.String userName, java.lang.String password) throws javax.servlet.ServletException

    ```


    Attempts to log the user using the supplied user name and password. The method
    does not return anything if login was successful. Otherwise, it will throw a ServletException.


    ```

    void logout() throws javax.servlet.ServletException

    ```


    Logs the user out.


