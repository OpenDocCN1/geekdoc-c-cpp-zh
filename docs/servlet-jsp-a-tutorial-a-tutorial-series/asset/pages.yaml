  md: '# Model 2 Overview


    Model 2 is based on the Model-View-View-Controller (MVC) design pattern, the central
    concept behind the Smalltalk-80 user interface. As the term “design pattern” had
    not been coined at that time, it was called the MVC paradigm.


    An application implementing the MVC pattern consists of three modules: model,
    view, and controller. The view takes care of the display of the application. The
    model encapsulates the application data and business logic. The controller receives
    user input and commands the model and/or the view to change accordingly.


    > Note

    The paper entitled Applications Programming in Smalltalk-80(TM): How to use Model-View-Controller
    (MVC) by Steve Burbeck, Ph.D. talks about the MVC pattern. You can find it at

    http://www.cs.illinois.edu/users/smarch/st-docs/mvc.html.


    In Model 2, you have a servlet or a filter acting as controller. All modern web
    frameworks are Model 2 implementations. Frameworks such as Struts 1 and Spring
    MVC employ a servlet controller in their MVC architectures, whereas Struts 2,
    another popular framework, uses a filter. Generally JSP pages are employed as
    the views of the application, even though other view technologies are supported.
    As the models, you use POJO is an acronym for Plain Old Java Object). POJOs are
    ordinary objects, as opposed to Enterprise JavaBeans (EJB) or other special objects.
    Many people choose to use a JavaBean (plain JavaBean, not EJB) to store the states
    of a model object and move business logic to an action class. A JavaBean must
    have a no-argument constructor and get/set methods for accessing properties. In
    addition, it should be serializable.


    Figure 10.1 shows the diagram of a Model 2 application.'
