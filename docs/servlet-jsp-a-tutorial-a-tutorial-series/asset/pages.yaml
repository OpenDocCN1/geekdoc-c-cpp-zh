- img_proc: true
  md: '# Chapter 15: Security 359


    annotation types that can perform the same job on a servlet level. Using these
    annotation types, you can restrict access to a servlet without adding a **security-constraint**
    element in the deployment descriptor. However, you still need a **login-config**
    element in the deployment descriptor to choose an authentication method.


    There are three annotation types in the `javax.servlet.annotation` package that
    are security related. They are `ServletSecurity`, `HttpConstraint`, and `HttpMethodConstraint`.


    The `ServletSecurity` annotation type is used in a servlet class to impose security
    constraints on the servlet. A `ServletSecurity` annotation may have the `value`
    and `httpMethodConstraints` attributes.


    The `HttpConstraint` annotation defines a security constraint and can only be
    assigned to the `value` attribute of the `ServletSecurity` annotation. If the
    `httpMethodConstraints` attribute is not present in the enclosing `ServletSecurity`
    annotation, the security constraint imposed by the `HttpConstraint` annotation
    applies to all HTTP methods. Otherwise, the security constraint applies to the
    HTTP methods defined in the `httpMethodConstraints` attribute. For example, the
    following `HttpConstraint` annotation dictates that the annotated servlet can
    only be accessed by those in the manager role.


    ```

    @ServletSecurity(value = @HttpConstraint(rolesAllowed = "manager\))

    ```


    Of course, the annotations above beenget as follows.


    ```

    @ServletSecurity(@HttpConstraint(rolesAllowed = "manager\))

    ```


    You still have to declare a **login-config** element in the deployment descriptor
    so the container can authenticate the user.


    Setting `TransportGuarantee.CONFIDENTIAL` to the `transportGuarantee` attribute
    of an `HttpConstraint` annotation will make the servlet only available through
    a confidential channel, such as SSL.


    ```

    @ServletSecurity(@HttpConstraint(transportGuarantee = TransportGuarantee.CONFIDENTIAL))

    ```


    If the servlet/JSP container receives a request for such a servlet through HTTP,
    it will redirect the browser to the HTTPS version of the same URL.'
