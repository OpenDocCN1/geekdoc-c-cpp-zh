  md: '# Chapter 6: Writing Custom Tags 163


    2. The JSP container calls the setJspContext method, passing a JspContext object:
    The most important method of JspContext is getOut, which returns a JspWriter for
    sending response to the client. The signature of the setJspContext method is as
    follows.


    ```

    public void setJspContext(JspContext jspContext)

    in most cases, you will need to assign the passed in JspContext to a class variable
    for later use.

    ```


    3. If the custom tag representing the tag handler is nested within another tag,
    the JSP container calls the setParent method. This method has the following signature:


    ```

    public void setParent(JspTag parent)

    ```


    +   4. The JSP container calls the setter for each attribute defined for this
    tag.

    5. If a body exists, the JSP container calls the setJspBody method of the SimpleTag
    interface, passing the body as a JspFragment. The JSP container will not call
    this method if the tag does not have a body.

    6. The JSP container calls the doTag method. All variables are synchronized when
    the doTag method returns.


    The javax.servlet.jsp.tagext package also includes a support class for SimpleTag:
    SimpleTagSupport. SimpleTagSupport provides default implementations for all methods
    in SimpleTag and serves as a convenient class that you can extend to write a simple
    tag handler. The getJspContext method in the SimpleTagSupport class returns the
    JspContext instance passed by the JSP container when it calls the setJspContext
    method of the SimpleTag interface.


