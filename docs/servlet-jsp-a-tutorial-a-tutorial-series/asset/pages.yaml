    # Handling Attributes


    Tag handlers that implement SimpleTag or extend SimpleTagSupport can have attributes.
    Listing 6.4 presents a tag handler called DataFormatterTag formats comma-delimited
    items into an HTML table. You pass two attributes to this tag, header and items.
    The header attribute will become the header of the table. For example, if you
    pass “Cities” as the value for the header attribute and “London,Montreal” as the
    value for the items attribute, you''ll get the following:


    ```

    <table style="border:1px solid green">

    <tr><td><b>Cities</b></td></tr>

    <tr><td>London</td></tr>

    <tr><td>Montreal</td></tr>

    </table>

    ```


