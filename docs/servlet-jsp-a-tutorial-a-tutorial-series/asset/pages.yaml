    # Summary


    Servlet technology is part of the Java EE. All servlets run in a servlet container,
    and the contract between the container and the servlets takes the form of the
    **javax.servlet.Servlet** interface. The **javax.servlet** package also provides
    the **GenericServlet** abstract class that implements **Servlet**. This is a convenient
    class that you can extend to create a servlet. However, most modern servlets will
    work in the HTTP environment. As such, subclassing the **javax.servlet.http.HttpServlet**
    class makes more sense. The **HttpServlet** class itself is a subclass of **GenericServlet.**'
