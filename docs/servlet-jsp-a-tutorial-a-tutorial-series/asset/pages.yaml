  md: '# # Chapter 1

    Servlets


    Servlet is the main technology for developing servlets. Understanding the Servlet
    API is your gateway to becoming a formidable Java web developer. It is imperative
    that you be familiar with each of the over seventy types defined in the Servlet
    API. Seventy may sound a lot but it''s not hard if you learn one at a time.


    This chapter introduces the Servlet API and teaches you how to write your first
    servlet.


    # ## Servlet API Overview


    The Servlet API comes in four Java packages. The packages are as follows.


    +   - **javax.servlet**: Contains classes and interfaces that define the contract
    between a servlet and a servlet container.

    - **javax.servlet.http**: Contains classes and interfaces that define the contract
    between an HTTP servlet and a servlet container.

    - **javax.servlet.annotation**: Contains annotations to annotate servlets, filters,
    and listeners. It also specifies metadata for annotated components.

    - **javax.servlet.descriptor**: Contains types that provide programmatic access
    to a web application''s configuration information.


    This chapter focuses on members of **javax.servlet** and **javax.servlet.http**.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# javax.servlet Package


    Figure 1.1 shows the main types in javax.servlet.


    | interface | interface | interface | interface |

    | :--- | :--- | :--- | :--- |

    | Servlet | ServletRequest | ServletResponse | ServletContext |

    | GenericServlet | ServletConfig | RequestDispatcher | Filter |


    Figure 1.1: Prominent members of javax.servlet


    At the center of Servlet technology is **Servlet**, an interface that all servlet
    classes must implement either directly or indirectly. You implement it directly
    when you write a servlet class that implements **Servlet**. You implement it indirectly
    when you extend a class that implements this interface.


    The **Servlet** interface defines a contract between a servlet and the servlet
    container. The contract boils down to the promise by the servlet container to
    load the servlet class into memory and call specific methods on the servlet instance.
    There can be only one instance for each servlet type in an application.


    A user request causes the servlet container to call a servlet’s **service** method,
    passing an instance of **ServletRequest** and an instance of **ServletResponse**.
    The **ServletRequest** encapsulates the current HTTP request so servlet developers
    do not have to parse and manipulate raw HTTP data. The **ServletResponse** represents
    the HTTP response for the current user and makes it easy to send response back
    to the user.


    For each application the servlet container also creates an instance of **ServletContext**.
    This object encapsulates the environment details of the context (application).
    There is only one **ServletContext** for each context. For each servlet instance,
    there is also a **ServletConfig** that encapsulates the servlet configuration.


    Let’s first look at the **Servlet** interface. Other interfaces mentioned above
    will be explained in the other sections of this chapter.'
