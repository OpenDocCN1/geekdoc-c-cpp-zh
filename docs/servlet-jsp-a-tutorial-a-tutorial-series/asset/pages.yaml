    \ the following HttpMethodConstraint annotation restricts access to the annotated\
    \ servlet via HTTP Get to the manager role. For other HTTP methods, no restriction\
    \ exists.\n\n```\n@ServletSecurity(httpMethodConstraints = {\n  @HttpMethodConstraint(value\
    \ = \"GET\", rolesAllowed = \"manager\")\n})\n```\n\nNote that if the rolesAllowed\
