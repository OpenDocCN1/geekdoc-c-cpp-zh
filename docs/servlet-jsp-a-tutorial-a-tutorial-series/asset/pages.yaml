  md: '# # Chapter 9

    Filters


    A filter is an object that intercepts a request and processes the ServletRequest
    or the ServletResponse passed to the resource being requested. Filters can be
    used for logging, encryption and decryption, session checking, image transformation,
    and so on. Filters can be configured to intercept a resource or multiple resources.


    Filter configuration can be done through annotations or the deployment descriptor.
    If multiple filters are applied to the same resource or the same set of resources,
    the invocation order is sometimes important and in this case you need the deployment
    descriptor.


    This chapter explains how to write and register filters. Several examples are
    also given.


    # ## The Filter API


    The following section explains the interfaces that are used in a filter, including
    Filter, FilterConfig, and FilterChain.


    A filter class must implement the javax.servlet.Filter interface. This interface
    exposes three lifecycle methods for a filter: init, doFilter, and destroy.


    The init method is called by the servlet container when the filter is being put
    into service, i.e. when the application is started. In other words, the init method
    does not wait until a resource associated with the filter is invoked. This method
    is only called once and should contain initialization code for the filter. The
    signature of the init method is as follows.


    ```

    void init(FilterConfig filterConfig);

    ```'
  merge: -1
