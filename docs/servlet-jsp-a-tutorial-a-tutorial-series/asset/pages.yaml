  md: "# 410 Servlet & JSP: A Tutorial\n\n```\n<interceptor name=\"validation\" class=\"\
    ...\"/>\n<interceptor name=\"logger\" class=\"...\"/>\n</interceptor>\n\n<action\
    \ name=\"Product_delete\" class=\"\">\n  <interceptor-ref name=\"alias\"/>\n \
    \ <interceptor-ref name=\"i18n\"/>\n  <interceptor-ref name=\"validation\"/>\n\
    \  <interceptor-ref name=\"logger\"/>\n  <result>jsp/main.jsp</result>\n</action>\n\
    \n<action name=\"Product_save\" class=\"\">\n  <interceptor-ref name=\"alias\"\
    />\n  <interceptor-ref name=\"i18n\"/>\n  <interceptor-ref name=\"validation\"\
    />\n  <interceptor-ref name=\"logger\"/>\n  <result name=\"input\">jsp/Product.jsp</result>\n\
    \  <result>jsp/ProductDetails.jsp</result>\n</action>\n</package>\n```\n\nWith\
    \ these settings every time the Product_delete or Product_save actions are invoked,\
    \ the four interceptors will be given a chance to process the actions. Note that\
    \ the order of appearance of the interceptor-ref element is important as it determines\
    \ the order of invocation of registered interceptors for that action. In this\
    \ example, the alias interceptor will be invoked first, followed by the i18n interceptor,\
    \ the validation interceptor, and the logger interceptor.\n\nMost Struts 2 application\
    \ having multiple action elements, repeating the list of interceptors for each\
    \ action can be a daunting task. In order to alleviate this problem, Struts allows\
    \ you to create interceptor stacks that group required interceptors. Instead of\
    \ referencing interceptors from within each action element, you can reference\
    \ the interceptor stack instead.\n\nFor instance, six interceptors are often used\
    \ in the following orders: exception, servletConfig, prepare, checkbox, params,\
    \ and conversionError. Rather than referencing them again and again in your action\
    \ declarations, you can create an interceptor stack like this:\n\n```\n<interceptor-stack\
    \ name=\"basicStack\">\n  <interceptor-ref name=\"exception\"/>\n  <interceptor-ref\
    \ name=\"servlet-config\"/>\n```"
