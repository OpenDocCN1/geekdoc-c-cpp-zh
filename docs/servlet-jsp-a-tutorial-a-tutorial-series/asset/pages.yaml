  md: '# 16 Servlet & JSP: A Tutorial


    The other two methods in Servlet are non-life cycle methods:

    getServletInfo and getServletConfig.


    +   - getServletInfo. This method returns the description of the servlet. You
    can return any string that might be useful or even null.

    - getServletConfig. This method returns the ServletConfig passed by the servlet
    container to the init method. However, in order for getServletConfig to return
    a non-null value, you must have assigned the ServletConfig passed to the init
    method to a class level variable.

    ServletConfig is explained in the section "ServletConfig" in this chapter.


    An important point to note is that thread safety. A servlet instance is shared
    by all users in an application, so class-level variables are not recommended,
    unless they are read-only or members of the java.util.concurrent.atomic package.


    The next section, "Writing A Basic Servlet Application," shows how you can write
    a Servlet Implementation.


    # Writing A Basic Servlet Application


