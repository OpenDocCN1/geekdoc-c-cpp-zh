  md: 'destination. A result that returns a file for download does not need a JSP
    page. Neither does a result that simply sends a redirection command or sends a
    chart to be rendered. Even if an action needs to be forwarded to a view, the view
    may not necessarily be a JSP page. A Velocity template or a FreeMarker template
    can also be used.


    Now that you know all the basic components of Struts 2, I’ll continue by explaining
    how Struts 2 uses a filter dispatcher as its controller, all activities start
    from this object.


    # The Case for Velocity and FreeMarker


    JSP programmers would probably mumble, “Why introduce new view technologies and
    not stick with JSP?” Good question. The answer is, while you can get away with
    just JSP, there’s a compelling reason to learn Velocity and/or FreeMarker. Velocity
    and FreeMarker templates can be packaged in a JAR, which is how Struts 2 plug-ins
    are distributed. You cannot distribute JSP pages in a JAR, at least easily, although
    you’ll find a way to do so if you’re determined enough. In addition, there are
    claims that Velocity is faster than JSP.


    The first thing that a filter dispatcher does is verify the request URI and determine
    what action to invoke and which Java action class to instantiate. The filter dispatcher
    in app10b did this by using a string manipulation method. However, this is impractical
    since during development the URI may change several times and you will have to
    recompile the filter each time the URI or something else changes.


    For matching URIs with action classes, Struts 2 uses a configuration file named
    struts.xml. Basically, you need to create a struts.xml file and place it under
    WEB-INF/classes. You define all actions in the application in this file. Each
    action has a name that directly corresponds to the URI used to invoke the action.
    Each action declaration may specify the fully qualified name of an action class,
    if any. You will have to specify the action method name unless its name is execute,
    the default method name Struts 2 will assume in the absence of an explicit one.


    An action class must have at least one result what to do after it executes the
    action method. There may be multiple results if the action method may return different
    results depending on, say, user inputs.'
