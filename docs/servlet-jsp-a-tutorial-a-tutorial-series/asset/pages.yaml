    ignored if an interceptor element can be found within an action element.


    # The param Element


    The param element can be nested within another element such as action, result-type,
    and interceptor to pass a value to the enclosing object.


    The param element has a name attribute that specifies the name of the parameter.
    The format is as follows:


    ```

    <param name="property">value</param>

    ```


    Used within an action element, param can be used to set an action property. For
    example, the following param element sets the siteId property of the action.


    ```

    <action name="customer" class="...">

    <param name="siteId">california01</param>

    </action>

    ```'
