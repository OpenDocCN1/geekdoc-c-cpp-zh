  md: "# 370 Servlet JSP: A Tutorial\n\nThe following are two filter elements whose\
    \ names are Upper Case Filter and Image Filter, respectively.\n\n```\n<filter>\n\
    \  <filter-name>Upper Case Filter</filter-name>\n  <filter-class>com.example.UpperCaseFilter</filter-class>\n\
    </filter>\n<filter>\n  <filter-name>Image Filter</filter-name>\n  <filter-class>com.example.ImageFilter</filter-class>\n\
    \  <init-param>\n    <param-name>frequency</param-name>\n    <param-value>1909</param-value>\n\
    \  </init-param>\n  <init-param>\n    <param-name>resolution</param-name>\n  \
    \  <param-value>1024</param-value>\n  </init-param>\n</filter>\n```\n\n# filter-mapping\n\
    \nThe filter-mapping element specifies the resource or resources filter is applied\
    \ to. A filter can be applied to either a servlet or a URL pattern. Mapping a\
    \ filter to a servlet causes the filter to work on the servlet. Mapping a filter\
    \ to a URL pattern makes filtering occur to any resource whose URL matches the\
    \ URL pattern. Filtering is performed in the same order as the appearance of the\
    \ filter-mapping elements in the deployment descriptor.\n\nThe filter-mapping\
    \ element contains a filter-name element and a url-pattern element or a servlet-name\
    \ element.\n\nThe filter-name value must match one of the filter names declared\
    \ using the filter elements.\n\nThe following are two filter elements and two\
    \ filter-mapping elements:\n\n```\n<filter>\n  <filter-name>Logging Filter</filter-name>\n\
    \  <filter-class>com.example.LoggingFilter</filter-class>\n</filter>\n<filter>\n\
    \  <filter-name>Security Filter</filter-name>\n  <filter-class>com.example.SecurityFilter</filter-class>\n\
    ```"
