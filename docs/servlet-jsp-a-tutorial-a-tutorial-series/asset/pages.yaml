  md: "# Using Other EL Operators\n\nIn addition to the , and [] operators, the EL\
    \ also provides several other operators: arithmetic operators, relational operators,\
    \ logical operators, the conditional operator, and the empty operator. you can\
    \ perform various operations. However, because the aim of the EL is to facilitate\
    \ the authoring of script-free JSP pages, these EL operators are of limited use,\
    \ except for the conditional operator. \n\nThe EL operators are given in the following\
    \ subsections.\n\n# Arithmetic Operators\n\nThere are five arithmetic operators:\n\
    \n+   * Addition (+)\n* Subtraction (-)\n* Multiplication (*)\n* Division (/ and\
    \ div)\n* Remainder/modulo (% and mod)\n\nThe division and remainder operators\
    \ have two forms, to be consistent with XPath and ECMAScript.\n\nNote that an\
    \ EL expression is evaluated from the highest to the lowest precedence, and then\
    \ from left to right. The following are the arithmetic operators in the decreasing\
    \ lower precedence:\n\n/ div % mod\n+ -\n\nThis means *, /, div, %, and mod operators\
    \ have the same level of precedence, and + has the same precedence as - , but\
    \ lower than the first group. Therefore, the expression\n\n```\n$(1+2*3)\n```\n\
    \nresults in 7 and not 6."
  merge: -1
  pgno: 123
- img_proc: true
  md: "# Relational Operators\n\nThe following is the list of relational operators:\n\
    \n+   - equality (= and eq)\n- non-equality (!= and ne)\n- greater than (> and\
    \ gt)\n- greater than or equal to (>= and ge)\n- less than (< and lt)\n- less\
    \ than or equal to (<= and le)\n\nFor instance, the expression ${3==4} returns\
    \ false, and ${\"b\"<\"d\"} returns true.\n\n# Logical Operators\n\nHere is the\
    \ list of logical operators:\n\n+   - AND (&& and and)\n- OR (|| and or)\n- NOT\
    \ (! and not)\n\n# The Conditional Operator\n\nThe EL conditional operator has\
    \ the following syntax:\n\n```\n${statement:A:B}\n```\n\nIf statement evaluates\
    \ to true, the output of the expression is A. Otherwise, the output is B.\n\n\
    For example, you can use the following EL expression to test whether the HttpSession\
    \ contains the attribute called isLoggedIn. If the attribute is found, the string\
    \ \"You have logged in\" is displayed. Otherwise, \"You have not logged in\" is\
    \ displayed.\n\n```\n${(sessionScope.loggedIn==null)? \"You have not logged in\"\
    \ : \n\"You have logged in\"}\n```"
