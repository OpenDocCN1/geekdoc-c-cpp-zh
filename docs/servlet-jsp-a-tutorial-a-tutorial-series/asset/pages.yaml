  md: '# The toLowerCase Function


    The toLowerCase function converts a string into its lowercase version. Its syntax
    is as follows:


    ```

    toLowerCase(string)

    ```


    For example, the following EL expression returns "stella cadence".


    ```

    ${fn:toLowerCase("Stella Cadence")}

    ```


    # The toUpperCase Function


    The toUpperCase function converts a string into its uppercase version. Its syntax
    is as follows:


    ```

    toUpperCase(string)

    ```


    For instance, the following EL expression returns "STELLA CADENCE".


    ```

    ${fn:toUpperCase("Stella Cadence")}

    ```


    # The trim Function


    The trim function removes the leading and trailing whitespaces of a string. Its
    syntax is as follows:


    ```

    trim(string)

    ```


