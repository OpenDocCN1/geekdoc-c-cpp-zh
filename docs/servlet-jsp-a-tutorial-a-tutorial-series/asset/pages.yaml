    The body content is JSP. The parseNumber tag’s attributes are given in Table 5.14.


    As an example, the following parseNumber tag parses the value referenced by the
    scoped quantity and stores the result in the formattedNumber variable.


    ```

    <fmt:parseNumber var="formattedNumber" type="number">${quantity}</fmt>

    ```


    | Attribute | Type | Description |

    | value+ | String | String to be parsed |

    | type+ | String | Indicates whether the string to be parsed is to be parsed as
    a number, currency, or percentage |

    | pattern+ | | Custom formatting pattern that determines how the string in the
    value attribute is to be parsed |

    | parseLocale+ | String or java.util.Locale | Locale whose default formatting
    pattern is to be used during the parse operation, or to which the pattern specified
    by the pattern attribute is applied |

