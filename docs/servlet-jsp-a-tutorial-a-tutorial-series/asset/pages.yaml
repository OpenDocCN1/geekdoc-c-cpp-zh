    \ page.\n\n```\n<error-page>\n  <exception-type>javax.servlet.ServletExceptionException</exception-type>\n\
    \  <location>error.html</location>\n</error-page>\n```\n\n# filter\n\nThis element\
    \ specifies a servlet filter. At the very minimum, this element must contain a\
    \ filter-name element and a filter-class element. Optionally, it can also contain\
    \ the following elements: icon, display-name, description, init-param, and async-supported.\n\
    \nThe filter-name element defines the name of the filter. The filter name must\
    \ be unique within the application. The filter-class element specifies the fully\
    \ qualified name of the filter. The init-param element is used to specify an initial\
    \ parameter for the filter and has the same descriptor as <context-param>. A filter\
    \ element can have multiple init-param elements."
