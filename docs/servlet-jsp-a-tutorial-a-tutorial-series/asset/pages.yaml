  md: '# Upload Clients


    While the file upload feature in Servlet 3 makes file upload a breeze to program
    on the server side, it does nothing to enhance user experience. An HTML form alone
    will not let you display a progress bar or show the number of files successfully
    uploaded. Developers have used different techniques to improve the user interface,
    such as by inquiring the server using a separate browser thread so that upload
    progress can be reported, or by using third-party technologies such as Java applets,
    Adobe Flash, or Microsoft Silverlight.


    The third-party technologies work. To some extent and with limitation. The first
    disadvantage of using one of these technologies is that there is no built-in support
    for them in all major browsers. For example, Java applets can only run if the
    user has installed Java on his/her computer. While some computer makers, such
    as Dell and HP, ship their products with Java installed, some others, such as
    Lenovo, do not. While there are ways to detect if Java is installed on the user''s
    machine and drive the user to install one if none exists, this is a disruption
    that not all users are willing to tolerate. On top of that, Java applets by default
    have very restricted access to the local file system unless they are signed. These
    obviously add costs and complexity to the program.


    Flash has the same issues as applets. Flash programs need a player to run and
    not all platforms support Flash. The user will have to install a Flash player
    to run Flash programs inside a browser. Besides, Apple won''t allow Flash to run
    on iPad and iPhone and Adobe has finally discontinued Flash on mobile platforms.


    Microsoft Silverlight also needs a player to run and non-IE browsers do not ship
    with one. So, basically Silverlight programmers have more or less the same problems
    as those encountered by applet and Flash developers.


    Luckily for us,


    HTML 5 adds a File API to its DOM to allow local file access. Compared to applets,
    Flash, and Silverlight, HTML 5 seems ideal as the perfect solution to client side
    file upload limitations. At time of writing, unfortunately, Internet Explorer
    9 does not yet fully support this API. You'
