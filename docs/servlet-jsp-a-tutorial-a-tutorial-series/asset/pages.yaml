- img_proc: true
  md: 'Most of the time the default interceptors are good enough. However, if you
    need non-standard action processing, you can write your own interceptor. Writing
    custom interceptors is discussed in Chapter 18, “Custom Interceptors” of Struts
    2 Design and Programming: A Tutorial.


    | Interceptor | Description |

    | Alias (alias) | Converts similar parameters that may have different names between
    requests. |

    | Chaining (chain) | When used with the Chain result type, this interceptor makes
    the previous action''s properties available to the current action. |

    | Checkbox (checkbox) | Handles check boxes in a form so that unchecked check
    boxes can be detected. |

    | Cookie (cookie) | Adds a cookie to the current action. |

    | Conversion Error (conversionError) | Adds conversion errors to the action''s
    field errors. |

    | Create Session (createSession) | Creates an HttpSession object if one does not
    exist for the current user. |

    | Debugging (debugging) | Supports debugging. |

    | Execute and Wait (execAndWait) | Executes a long-processing action in the background
    and sends the user to an intermediate waiting page. |

    | Exception (exception) | Maps exceptions to a result. |

    | File Upload (fileUpload) | Supports file upload. |

    | I18n (i18n) | Supports internationalization and localization. |

    | Logger (logger) | Outputs the action name. |

    | Message Store (store) | Stores and retrieves action messages or action errors
    or field errors for action objects whose classes implement ValidationAware |

    | Model Driven (modelDriven) | Supports the model driven pattern for action classes
