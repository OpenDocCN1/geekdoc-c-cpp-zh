    As an example, consider the PerfStatListener class in app08a. The listener measures
    the difference between the time the ServletRequest is destroyed and the time it
    was created, thus effectively the time taken to execute a request.


    The PerfStatListener class in Listing 8.5 takes advantage of the ServletListener
    interface to measure how long it takes an HTTP request to complete. It relies
    on the fact that the servlet container calls the requestInitialized method at
    the beginning of a request and calls the requestDestroyed method after it processes
    it. By reading the current time at the start of the two events and compare the
    two, you can get the approximate of how long it took an HTTP request to complete.


