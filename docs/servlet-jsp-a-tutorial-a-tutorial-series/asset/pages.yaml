    Of course, you want to know which search engine redirects the most traffic that
    results in a sale. To find out, you could record the referer header of the main
    page of your web application. You use a tag file to store the value of the referer
    header as a session attribute. Later, if the user decides to purchase a product,
    you can obtain the session attribute value and insert it into a database table.


    The example consists of an HTML file (searchEngine.html), two JSP pages (main.jsp
    and viewReferer.jsp), and one tag file (doBodyDemo.tag). The main.jsp page uses
    the doBodyDemo custom tag to store the referer header. To view the referer header
    value, use the viewReferer.jsp page. If you invoke the main.jsp page by directly
    typing its URL, the referer header will be null. Therefore, you have to use the
    searchEngine.html file to go to the main.jsp page.


