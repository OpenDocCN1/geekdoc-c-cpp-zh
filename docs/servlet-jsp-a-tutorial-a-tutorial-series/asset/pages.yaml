  md: '# Chapter 17

    Dynamic Registration and

    Servlet Container Initializers


    Dynamic registration is a new feature in Servlet 3 for installing new web objects
    (servlets, filters, filters, listeners) without reloading the application. The
    servlet container initializer is also a new addition in Servlet 3 that is especially
    useful for framework developers. This chapter discusses both features and presents
    examples.


    # Dynamic Registration


    To make dynamic registration possible, the ServletContext interface has added
    these methods to dynamically create a web object.


    ```

    <T extends Filter> createFilter(java.lang.Class<T> clazz)

    <T extends java.util.EventListener> createListener(

    java.lang.Class<T> clazz)

    <T extends Servlet> createServlet(java.lang.Class<T> clazz)

    ```


    For example, if MyServlet is a class that directly or indirectly implements javax.servlet.Servlet,
    you can instantiate MyServlet by calling

    createServlet:


    ```

    Servlet myServlet = createServlet(MyServlet.class);

    ```


    After you create a web object, you can add it to the ServletContext using one
    of these methods, also new in Servlet 3.


    ```

    FilterRegistration.Dynamic addFilter(java.lang.String filterName,

    Filter filter)

    ```'
