  md: '# Deployment


    Deploying a Servlet/JSP application has always been easy since the first version
    of Servlet. It has just been a matter of zipping all application resources in
    its original directory structure into a war file. You can either use the jar tool
    in the JDK or a popular tool such as WinZip. All you need is make sure the zipped
    file has war extension. If you''re using WinZip, rename the result once it''s
    done.


    You must include in your war file all libraries and class files as well as HTML
    files, JSP pages, images, copyright notices (if any), and so on. Do not include
    Java source files. Anyone who needs your application can simply get a copy of
    your war file and deploy it in a servlet/JSP container.


    # Web Fragments


    Servlet 3 adds web fragments, a new feature for deploying plug-ins or frameworks
    in an existing web application. Web fragments are designed to complement the deployment
    descriptor without having to edit the web.xml file. A web fragment is basically
    a package (jar file) containing the usual web objects, such as servlets, filter,
    and listeners, and other resources, such as JSP pages and static images. A web
    fragment can also have a descriptor, which is an XML document similar to the deployment
    descriptor. The web fragment descriptor must be named web-fragment.xml and reside
    in the META-INF directory of the package. A web fragment descriptor may contain
    any elements that may appear under the web-app element in the deployment descriptor,
    plus some web fragment-specific elements. An application can have multiple web
    fragments.


    Listing 16.2 shows the skeleton of the web fragment descriptor. The text printed
    in bold highlights the difference between it and the deployment descriptor. The
    root element in a web fragment is, surprisingly, web-fragment. The web-fragment
    element can even have the metadata-complete attribute. If the value of the metadata-complete
    attribute is true, annotations in the classes contained by the web fragment will
    be skipped.'
  merge: -1
