  md: "# The forTokens Tag\n\nYou use the forTokens tag to iterate over tokens that\
    \ are separated by the specified delimiters. The syntax for this action is as\
    \ follows:\n\n```\n<c:forTokens items=\"stringOfTokens\" delims=\"delimiters\"\
    \n  var=\"varName\" [varStatus=\"varStatus\"]\n  begin=\"Begin\" [end=\"end\"\
    ] [step=\"step\"]>\n  body content\n</c:forTokens>\n```\n\nThe body content is\
    \ The list of the forTokens tag's attributes is given in Table 5.7.\n\n| Attribute\
    \ | Type | Description |\n|---|---|---|\n| var | String | The name of the scoped\
    \ variable that references the current item of the iteration. |\n| items+ | String\
    \ | The string of tokens to iterate over. |\n| varStatus | String | The name of\
    \ the scoped variable that holds the status of the iteration. The value is of\
    \ type javax.servlet.jsp.core.LoopTagStatus. |\n| begin+ | int | The start index\
    \ of the iteration, where index is zero-based. If specified, begin must be 0 or\
    \ greater. |\n| end+ | int | The end index of the iteration, where index is zero-based.\
    \ |\n| step+ | int | Iteration will process only every step tokens of the string,\
    \ starting with the first. If specified, step must be 1 or greater. |\n| delims+\
    \ | String | The set of delimiters. |\n\nTable 5.7: The forTokens tag's attributes\n\
    \nHere is an example of forTokens:\n\n```\n<c:forTokens var=\"item\" items=\"\
    Argentina, Brazil, Chile\" delims=\",\n  <c:out value=\"${item}\"/><br/>\n</c:forTokens>\n\
    ```\n\nWhen pasted in a JSP, the preceding forTokens will result in the following:\n\
    \n+   * Argentina\n* Brazil"
