    # Data Integrity


    Mallet, a malicious party, could be sitting between Alice and Bob, trying to decipher
    the messages being sent. Unfortunately for him, even though he could copy the
    messages, they are encrypted and Mallet does not know the key. However, Mallet
    could destroy the messages or not relay some of them. To overcome this, SSL introduces
    a message authentication code (MAC). A MAC is a piece of data that is computed
    by using a secret key and some transmitted data. Because Mallet does not know
    the secret key, he cannot compute the right value for the digest. The message
    receiver can and therefore will discover if there is an attempt to tamper with
    the data, or if'
