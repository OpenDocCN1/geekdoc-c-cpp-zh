  md: '# ServletResponse


    The javax.servlet.ServletResponse interface represents a servlet response. Prior
    to invoking a servlet''s service method, the servlet container creates a ServletResponse
    and passes it as the second argument to the service method. The ServletResponse
    hides the complexity of sending response to the browser.


    One of the methods defined in ServletResponse is the getWriter method, which returns
    a java.io.PrintWriter that can send text to the client. By default, the PrintWriter
    object uses ISO-8859-1 encoding.


    When sending response to the client, most of the time you send it as HTML. You
    are therefore assumed to be familiar with HTML.


    # Note


    There is also another method that you can use to send output to the browser: getOutputStream.
    However, this method is for sending binary data, so in most cases you will use
    getWriter and not getOutputStream. See Chapter 12, "File Download" for instructions
    on how to send binary content.


    Before sending any HTML tag, you should set the content type of the response by
    calling the setContentType method, passing "text/html" as an argument. This is
    how you tell the browser that the content type is HTML. Most browsers by default
    render a response as HTML in the absence of a content type. However, some browsers
    will display HTML tags as plain text if you don''t set the response content type.


    You have used ServletResponse in MyServlet in Listing 1.1. You’ll see it used
    in other applications in this chapter and next chapters.


