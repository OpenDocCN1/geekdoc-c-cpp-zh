  md: "# Appendix C: SSL Certificates 433\n\ndirectory of the JDK. Keytool is a command-line\
    \ program. To check the correct syntax, simply type keytool at the command prompt.\
    \ The following will provide examples of some important functions.\n\n# Generating\
    \ Key Pairs\n\nBefore you start, there are a few things to notice with regard\
    \ to key generation in Java.\n\n+   1. Keytool generates a public/private key\
    \ pair and creates a certificate signed using the private key (self-signed certificate).\
    \ Among others, the certificate contains the public key and the identity of the\
    \ entity whose key is it. Therefore, you need to supply your name and other information.\
    \ This name is called a distinguished name and contains the following information:\n\
    CN= common name, e.g. Joe Sample\nOU=organizational unit, e.g. Information Technology\n\
    O=organization name, e.g. Brainy Software Corp\nL=locality name, e.g. Vancouver\n\
    S=state name, e.g. BC\nC=country, (two letter country code) e.g. CA\n\n+   2.\
    \ Your keys will be stored in a database called keystore. A keystore is file-based\
    \ and password-protected so that no unauthorized persons can access the private\
    \ keys stored in it.\n\n+   3. If no keystore is specified when generating keys\
    \ or performing other functions, the default keystore is assumed. The default\
    \ keystore is named keystore in the user's home directory (i.e. in the directory\
    \ defined by the user.home system property. For example, for Windows XP the default\
    \ keystore is located under C:\\Documents\\UserName in Windows.\n\n+   4. There\
    \ are two types of entries in a keystore:\n   a. Key entries, each of which is\
    \ a private key accompanies by the certificate chain of the corresponding public\
    \ key.\n   b. Trusted certificate entries, each of which contains the public key\
    \ of an entity trust.\nEach entry is also password-protected, therefore there\
    \ are two types of passwords, the one that protects the keystore and that one\
    \ that protects an entry."
  merge: -1
  pgno: 442
- img_proc: true
  md: '# 434 Servlet & JSP: A Tutorial


    +   5. Each entry in a keystore is identified by a unique name or an alias.

    nYou must specify an alias when generating a key pair or doing other activities
    with keytool.

    6. If generating a key pair you don''t specify an alias, **mykey** is used as
    an alias.


    The shortest command to generate a key pair is this:


    ```

    keytool -genkeypair

    ```


    Using this command, the default keystore will be used or one will be created if
    none exists in the user''s home directory. The generated key will have the alias
    **mykey**. You will then be prompted for a password for the keystore and supply
    information for your distinguished name. Finally, you will be prompted for a password
    for the entry.


    Invoking **keytool -genkeypair** will result in an error because it will attempt
    to create a key pair and use the alias **mykey** again.


    ```

    keytool -genkeypair -alias email

    ```


    Again, the default keystore is used.


    To specify a keystore, use the -keystore argument. For example, this command generate
    a key pair and store it in the keystore named **myKeystore** in the C:\javakeys
    directories.


    ```

    keytool -genkeypair -keystore C:\javakeys\myKeyStore

    ```


    After you invoke the program, you will be asked to enter mission information.


    A complete command for generating a key pair is one that uses the genkeypair,
    alias, keypass, storepass and dname arguments.


    ```

    keytool -genkeypair -alias email4 -keypass myPassword -dname

    "CN=JoeSample, OU=IT, O=Brain Software Corp, L=Surrey, S=BC, C=CA"

    storepass myPassword

    ```'
