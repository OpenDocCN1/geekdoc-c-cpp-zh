    # The variable Directive


    It is sometimes useful to expose values in a tag file to the calling JSP page.
    This is possible through the use of the variable directive in the tag file. In
    a tag file, the variable directive is analogous to the variable element in the
    tag library descriptor and defines the details of a variable in the tag handler
    that is accessible from the calling JSP page. Because a tag file can have multiple
    variable directives, it is possible to provide multiple values to the calling
    JSP page. Compare variable with the attribute directive that you use to pass a
    value from a JSP to a tag file.


    The syntax of the variable directive is as follows:


    ```

    <%@ variable (attribute="value") %>

    ```'
  merge: -1
