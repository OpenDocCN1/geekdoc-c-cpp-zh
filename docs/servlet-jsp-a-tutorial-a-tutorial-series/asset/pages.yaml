    # include


    The include action is used to include another resource dynamically. We can include
    another JSP page, a servlet, or a static HTML page. For example, the jspIncludeTest.jsp
    page in Listing 3.12 uses the include action to include the menu.jsp page.


    Listing 3.12: The jspIncludeTest.jsp page


    ```

    <html>

    <head>

    <title>Include action</title>

    </head>

    <body>

    <jsp:include page="jsp/menu.jsp">

    <jsp:param name="text" value="How are you?"/>

    </jsp:include>

    </body>

    </html>

    ```


    It is important that you understand the difference between the include directive
    and the include action. With the include directive, inclusion occurs at page translation
    time, i.e. when the JSP container translates the page into a generated servlet.
    With the include action, inclusion occurs at request time. As such, you can pass
    parameters using the include action, but not the include directive.


    The second difference is that with the include directive, the file extension of
    the included resource does not matter. With the include action, the file extension
    must be jsp for it to be processed as a JSP page. Using jsp in the include action,
    for example, will make the JSP segment be treated as a static file.'
