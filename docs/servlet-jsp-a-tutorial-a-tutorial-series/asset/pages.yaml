  md: "# 374 Servlet & JSP: A Tutorial\n\nThe auth-constraint element contains an\
    \ optional description element and zero or more role-name element. The role-name\
    \ element contains the name of a security role.\n\nThe user-data-constraint element\
    \ contains an optional description element and a transport-guarantee element.\
    \ The transport-guarantee element must have one of the following values: NONE,\
    \ INTEGRAL, or CONFIDENTIAL. NONE indicates that the application does not require\
    \ transport guarantees. INTEGRAL means that the data between the server and the\
    \ client should be sent in such a way that it can't be changed in transit. CONFIDENTIAL\
    \ means that the data transmitted must be encrypted. In most cases, Secure Sockets\
    \ Layer (SSL) is used for either INTEGRAL or CONFIDENTIAL.\n\nThe following example\
    \ uses a security-constraint element to restrict access to any resource with a\
    \ URL matching the pattern /members/*. Only a user in the payingMember role will\
    \ be allowed access. The login-config element requires the user to log in and\
    \ the Digest access authentication method is used.\n\n```\n<security-constraint>\n\
    \  <web-resource-collection>\n    <web-resource-name>Members Only</web-resource-name>\n\
    \    <url-pattern>/members/*</url-pattern>\n  </web-resource-collection>\n  <auth-constraint>\n\
    \    <role-name>payingMember</role-name>\n  </auth-constraint>\n</security-constraint>\n\
    \n<login-config>\n  <auth-method>Digest</auth-method>\n  <realm-name>Digest Access\
    \ Authentication</realm-name>\n</login-config>\n```\n\n# security-role\n\nThe\
