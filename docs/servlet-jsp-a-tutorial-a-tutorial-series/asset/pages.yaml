  md: '# 48 Servlet & JSP: A Tutorial


    ![](img/45889fd1b2eef3ac27c1c5a024fe40c7_57_0.png)


    Of special interest is the value of the href attribute of the a tags, which includes
    a question mark followed by the token city=london or city=paris. Any relative
    URL, that is one without the protocol part, will be considered relative to the
    URL of the current page. In other words, if you click one of the hyperlinks on
    the page, either


    ```

    http://localhost:8080/app02a/top10?city=london

    ```


    or


    ```

    http://localhost:8080/app02a/top10?city=paris

    ```


    will be sent to the server.


    Upon the user clicking one of the hyperlinks the doGet method will detect the
    presence of a city request parameter and direct control to the showAttractions
    method, which then examines the URL to see if it contains a page request parameter.
    If no page request parameter is present or if its value cannot be converted to
    a number, then 1 is assumed and the method sends the first five attractions in
    the selected city. Figure 2.2 shows what the screen looks like if London has been
    chosen.


