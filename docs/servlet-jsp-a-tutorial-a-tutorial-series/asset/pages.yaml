- img_proc: true
  md: 'The struts.xml file is read when Struts starts. In development mode, Struts
    2 checks the timestamp of this file every time it processes a request and will
    reload it if it has changed since the last time it was loaded. As a result, if
    you are in development mode and you tell Struts 2 that, you don''t need to restart
    your web container every time your application changes. Saving you.


    Configuration file loading will fail you if you don''t comply with the rules that
    govern the struts.xml file. If, or should I say when, this happens, Struts 2 will
    fail to start and you must restart your container. Sometimes it''s hard to decipher
    what you''ve done wrong due to unclear error messages. If this happens, try commenting
    out the actions that you suspect are causing it, until you isolate and fix the
    one that is impending development.


    # Note


    I discuss Struts 2 development mode when discussing the Struts configuration files
    in the section "Configuration Files" later in this chapter.


    Figure 18.1 shows how Struts processes action invocation. It does not include
    the reading of the configuration file, which only happens once during application
    launch.


    For every action invocation the filter dispatcher does the following:


    +   1. Consult the Configuration Manager to determine what action to invoke based
    on the request URI.

    2. Run each of the interceptors registered for this action. One of the interceptors
    will populate the action''s properties.

    3. Execute the action method.

    4. Execute the result.


    Note that some interceptors run again after action method execution, before the
    result is executed.'
