  md: "# 144 Servlet & JSP: A Tutorial\n\nChile\n\n# Formatting Actions\n\nJSTL provides\
    \ tags for formatting and parsing numbers and dates. The tags are **formatNumber,\
    \ formatDate, timeZone, setTimeZone, parseNumber, and parseDate**. These tags\
    \ are discussed in the sections to follow.\n\n# The formatNumber Tag\n\nYou use\
    \ **formatNumber** to format numbers. This tag gives you the flexibility of using\
    \ its various attributes to get a format that suits your need. The syntax of **formatNumber**\
    \ has two forms. The first is used without a body content:\n\n```\n<fmt:formatNumber\
    \ value=\"numericValue\"\n  [type=\"{number|currency|percent}\"]\n  [pattern=\"\
    customPattern\"]\n  [currencyCode=\"currencyCode\"]\n  [currencySymbol=\"currencySymbol\"\
    ]\n  [groupingUsed=\"true|false\"]\n  [maxIntegerDigits=\"maxIntegerDigits\"]\n\
    \  [minIntegerDigits=\"minIntegerDigits\"]\n  [maxFractionDigits=\"maxFractionDigits\"\
    ]\n  [minFractionDigits=\"minFractionDigits\"]\n  [var=\"varName\"]\n  [scope=\"\
    page|request|session|application\"]/>\n```\n\nThe second form is used with a body\
    \ content:\n\n```\n<fmt:formatNumber type=\"{number|currency|percent}\"\n  [pattern=\"\
    customPattern\"]\n  [currencyCode=\"currencyCode\"]\n  [currencySymbol=\"currencySymbol\"\
    ]\n  [groupingUsed=\"true|false\"]\n  [maxIntegerDigits=\"maxIntegerDigits\"]\n\
    \  [minIntegerDigits=\"minIntegerDigits\"]\n  [maxFractionDigits=\"maxFractionDigits\"\
    ]\n  [minFractionDigits=\"minFractionDigits\"]\n```"
  merge: -1
