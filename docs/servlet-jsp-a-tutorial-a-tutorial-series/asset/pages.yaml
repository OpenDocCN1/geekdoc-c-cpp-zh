  md: '# 178 Servlet & JSP: A Tutorial


    As of JSP 2.2, there are two types of tag handlers, classic tag handlers and simple
    tag handlers. The former implement the Tag, IterationTag, or BodyTag interface
    or extend one of the two support classes, TagSupport and BodyTagSupport. Simple
    tag handlers, on the other hand, implement the SimpleTag interface or extend SimpleTagSupport.
    Simple tag handlers are easier to write and have a simpler lifecycle than classic
    tag handlers. Simple tag handlers are the recommended type and this chapter presented
    a couple of simple tag examples. You can also distribute your custom tag library
    in a jar file for others to use.'
