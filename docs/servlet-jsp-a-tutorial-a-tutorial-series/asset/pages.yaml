  md: '# Async Listeners


    In conjunction with support for servlets and filters that perform asynchronous
    operations, Servlet 3.0 also adds the AsyncListener interface so that you can
    be notified of what’s happening during asynchronous processing. The AsyncListener
    interface defines the following methods that get called when certain event occurs.


    ```

    void onStartAsync(AsyncEvent event);

    ```


    This method gets called when an asynchronous operation has been initiated.


    ```

    void onComplete(AsyncEvent event);

    ```


    This method gets called when an asynchronous operation has completed.


    ```

    void onError(AsyncEvent event);

    ```


    This method gets called in the event an asynchronous operation has failed.


    ```

    void onTimeout(AsyncEvent event);

    ```


    This method gets called when an asynchronous has timed out, namely when it fails
    to finish within the specified timeout.


    All the four methods receive an AsyncEvent from which you can retrieve the related
    AsyncContext, ServletRequest, and ServletResponse through its AsyncContext, SuppliedRequest,
    and SuppliedResponse, respectively.


    As an example, the MyAsyncListener class in Listing 14.5 implements the AsyncListener
    interface so that it can be notified when events in an asynchronous operation
    occur. Unlike other web listeners, you do not annotate an implementation of AsyncListener
    with @WebListener.


    # Listing 14.5: An asynchronous listener


    ```

    package listener;

    import java.io.IOException;

    import javax.servlet.AsyncEvent;

    import javax.servlet.AsyncListener;


    // do not annotate with @WebListener

    ```'
