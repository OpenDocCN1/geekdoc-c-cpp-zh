  md: "# 372 Servlet & JSP: A Tutorial\n\n# login-config\n\nThe login-config element\
    \ is used to specify the authentication method used to authenticate the user,\
    \ the realm name, and the attributes needed by the form login mechanism if form-based\
    \ authentication is used. A login-config element has an optional auth-method element,\
    \ an optional realm-name element, and an optional form-config element.\n\nThe\
    \ auth-method element specifies the access authentication method. Its value is\
    \ one of the following: BASIC, DIGEST, FORM, or CLIENT-CERT.\n\nThe realm-name\
    \ element specifies the realm name to use in Basic access authentication and Digest\
    \ access authentication.\n\nThe form-login-config element specifies the login\
    \ and error pages that should be used in form-based authentication. If form-based\
    \ authentication is not used, these elements are ignored.\n\nThe form-login-config\
    \ element has a form-login-page element and a form-error-page element. The form-login-page\
    \ element specifies the path to a resource that displays a Login page. The path\
    \ must start with a a / and is relative to the application directory.\n\nThe form-error-page\
    \ element specifies the path to a resource that displays an error page when login\
    \ fails. The path must begin with a a / and is relative to the application directory.\n\
    \nAs an example, here is an example of the login-config.\n\n```\n<login-config>\n\
    <auth-method>DIGEST</auth-method>\n<realm-name>Members Only</realm-name>\n</login-config>\n\
    ```\n\nAnd, here is another example.\n\n```\n<login-config>\n<auth-method>FORM</auth-method>\n\
    <form-login-config>\n  <form-login-page>/loginForm.jsp</form-login-page>\n  <form-error-page>/errorPage.jsp</form-error-page>\n\
    </form-login-config>\n</login-config>\n```"
  merge: -1
