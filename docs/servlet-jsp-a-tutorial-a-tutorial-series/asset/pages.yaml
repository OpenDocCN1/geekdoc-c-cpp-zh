    # Struts 2 Configuration Files


    A Struts 2 application uses a number of configuration files. The primary two are
    struts.xml and struts.properties, but there can be other configuration files.
    For instance, a Struts plug-in comes with a struts-plugin.xml configuration file.
    And if you''re using Velocity as your view technology, expect to have a velocity.properties
    file. This chapter briefly explains the struts.xml and struts.properties files.


    In struts.xml you define almost all aspects of your application, including the
    actions, the interceptors that need to be called for each action, and the possible
    results for each action.


    Interceptors and result types used in an action must be registered before they
    can be used. Happily, Struts 2 configuration files support inheritance and default
    configuration files are included in the struts2-core-VERSION.jar file. The struts-default.xml
    file, one of such configuration files, registers the default result types and
    interceptors. As'
