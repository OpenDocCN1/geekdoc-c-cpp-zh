  md: '# 184 Servlet & JSP: A Tutorial


    Except for the import attribute, all other attributes can only appear once within
    a tag directive or in multiple tag directives in the same tag file. For example,
    the following tag file is invalid because the body-content attributes appear more
    than once in multiple tag directives:


    ```

    <@ tag display-name="first tag file" body-content="scriptless" %>

    <@ tag body-content="empty" %>

    ```


    The following is a valid tag directive even though the import attribute appears
    twice. This is because import can appear as many times as desired.


    ```

    <@ tag import="java.util.ArrayList" import="java.util.Iterator %>

    ```


    The following is also valid:


    ```

    <@ tag body-content="empty" import="java.util.Enumeration" %>

    <@ tag import="java.sql.*" %>

    ```


    # The include Directive


    The include directive for a tag file is the same as the include directive for
    a JSP page. You use this directive to include the contents of other files in the
    current tag file. It is useful when you have a common resource that will be used
    by more than one tag file. The included resource can be static (e.g. an HTML file)
    or dynamic (e.g. another tag file).


