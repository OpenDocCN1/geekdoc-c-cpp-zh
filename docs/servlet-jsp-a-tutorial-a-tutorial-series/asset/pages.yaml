    # Note


    Each of the tags discussed in this chapter is presented in its own section and
    the attributes for each tag are listed in a table. An asterisk (*) following an
    attribute name indicates that the attribute is required. A plus (+) indicates
    the value of the rtexprvalue element for that attribute is true, which means the
    attribute can be assigned a static string or a dynamic value (Java expression,
    an Expression Language Expression, or a value set by <jsp:attribute>). A value
    of false for rtexprvalue means that the attribute can only be assigned a static
    string only.


    # Note


    The body content of a JSTL tag can be empty, JSP, or tagdependent.


    # General-Purpose Actions


    The following section discusses three general-purpose actions in the Core library
    using for manipulating scoped variables: out, set, remove.


    # The out Tag


    The out tag evaluates an expression and outputs the result to the current JspWriter.
    The syntax for out has two forms, with and without a body content:


    ```

    <c:out value="value" escapeXml="{true|false}"

    [default="defaultValue"]/>

    ```


    ```

    <c:out value="value" escapeXml="{true|false}"

    default value

    </c:out>

    ```


    # Note


    In a tag''s syntax, [ ] indicates optional attributes. The underlined value, if
    any, indicates the default value.'
