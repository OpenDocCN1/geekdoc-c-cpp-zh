  md: '# Application Directory Structure


    A servlet application must be deployed in a certain directory structure.

    Figure 1.2 shows the directory structure for this application.


    ![](img/45889fd1b2eef3ac27c1c5a024fe40c7_28_0.png)


    # Figure 1.2: The application directory


    The app01a directory at the top of the structure is the application directory.

    Under the application directory is a WEB-INF directory. In it turn has two subdirectories:


    +   - classes. Your servlet and other Java classes must reside here. The directories
    under classes reflect the class package. In Figure 1.2 there is one class deployed,
    app01a.MyServlet.

    - lib. Deploy jar files required by your servlet application here. The Servlet
    API jar file does not need to be deployed because the servlet container already
    has a copy of it. In this application, the lib directory is empty. An empty lib
    directory may be deleted.


    A servlet/JSP application normally has JSP pages, HTML files, image files, and
    other resources. These should go under the application directory and are often
    organized in subdirectories. For instance, all image files can go to an image
    directory, all JSP pages to jsp, and so on.


    Any resource you put under the application directory is directly accessible to
    the user by typing the URL to the resource. If you want to include a resource
    that can be accessed by a servlet but not accessible to the user, put it under
    WEB-INF.


    Now, deploy the application to Tomcat. With Tomcat, one way to deploy an application
    is by copying the application directory to the webapps directory under Tomcat
    installation. You can also deploy an application by editing the server.xml file
    in Tomcat''s conf directory or'
