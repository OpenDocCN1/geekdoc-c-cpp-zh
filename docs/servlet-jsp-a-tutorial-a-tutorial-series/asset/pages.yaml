  md: '# 284 Servlet: JSP: A Tutorial


    ```

    content-disposition:form-data; name="document"; filename="note.txt"

    ```


    If no file is selected, a Part will still be created for the file field, but the
    associated headers will be as follows.


    ```

    content-type:application/octet-stream

    content-disposition:form-data; name="document"; filename="

    ```


    The getName of the Part returns the field name associated with this part, not
    the name of the uploaded file. To get the layer, you need to to parse the content-disposition
    header.


    For a non-file field, a Part will only have a content-disposition header, which
    is of the following format:


    ```

    content-disposition:form-data; name="fieldName"

    ```


    When processing uploaded files in a servlet, you need to


    +   - check if a Part is an ordinary form field or a file field by checking whether
    the content-type header exists. You can do this by calling the getContentType
    method or getHeader("content-type") on the Part.

    - If the content-type header exists, check if the uploaded file name is empty.
    An empty file name indicates the presence of a field of file type but no file
    was selected for upload.

    - If a file exists, you can write to the disk by calling the write method on the
    Part, passing an absolute path or a path relative to the location attribute of
    the MultipartConfig annotation.


