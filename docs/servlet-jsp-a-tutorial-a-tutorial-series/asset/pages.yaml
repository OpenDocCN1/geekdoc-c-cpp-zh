  md: '# 356 Servlet & JSP: A Tutorial


    In the last message from Bob to Alice, the message has been signed using Bob''s
    private key, to convince Alice that the message is authentic. This is how authentication
    is proved. Alice contacts Bob and Bob sends his certificate. However, a certificate
    alone is not sufficient because anyone can get Bob''s certificate. Remember that
    Bob sends his certificate to anyone who wants to exchange messages with him. Therefore,
    Bob sends a message ("Alice, it''s really me") and the digest of the same message
    encrypted using his private key.


    Alice gets Bob''s public key from the certificate. She can do it because the certificate
