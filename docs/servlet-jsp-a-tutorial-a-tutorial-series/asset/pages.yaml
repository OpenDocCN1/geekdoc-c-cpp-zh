    ```

    <%@ tag (attribute="value") * %>

    ```

    tag attribute1="value" attribute2="value" ... %>

    ```

    ```


    The syntax can be expressed in the following more informal form:

    <%@ tag attribute1="value" attribute2="value" ... %>


    The attributes for the tag directive are given in Table 7.3. All attributes are
    optional.


    | Attribute | Description |

    | display-name | A short name to be displayed by an XML tool. The default value
    is the tag file name, without tag extension. |

    | body-content | The information about the body content of this tag. The value
    can be tagdependent, or scriptless (default). |

    | dynamic-attributes | Indicates the support for dynamic attributes. The value
    identifies a scoped attribute in which to place a Map containing the names and
    values of the dynamic attributes passed during this invocation |

    | small-icon | A context-relative path, or a path relative to the tag source file,
    of a small image file to be used by XML tools. You don''t normally use this attribute.
    |

    | large-icon | A context-relative path, or a path relative to the tag source file,
    of an image containing a large icon to be used by XML tools. You don''t normally
    use this attribute either. |

    | description | A string describing this tag. |

    | example | An informal description of an example of a use of this action. |

    | language | The scripting language used in the tag. The value for this attribute
    in the current version of JSP must be “java” |

    | import | Used to import a Java type. The same as the import attribute in the
    page directive. |

    | pageEncoding | Describes the character encoding for this tag. The value is of
    the form “CHARSET”, which must be the IANA name for a character encoding. This
    attribute is the same as the pageEncoding attribute of the page directive. |

    | isIgnored | Indicates whether EL expressions are ignored or evaluated. The default
    value for this attribute is “false”, which means EL expressions are evaluated.
    This attribute is the same as the isELIgnored attribute of the page directive.
    |


