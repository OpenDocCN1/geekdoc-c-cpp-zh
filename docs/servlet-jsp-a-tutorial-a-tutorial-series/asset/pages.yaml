    The main element in the tag library descriptor is the tag element, which describes
    the tag. It contains a name element and a tag-class element. name specifies the
    name that will be used to refer to this tag. tag-class specifies the fully-qualified
    name of the tag handler. A tag library descriptor may contain multiple tag elements.


    In addition, you may have other elements in a tag library descriptor. The description
    element is used to provide a description of the tags described in this descriptor
    and the tlib-version element specifies the version of the custom tags and the
    short-name element provides a short name for tags.


    # Using the Tag


    To use a custom tag, you use the taglib directive. The uri attribute of the taglib
    directive may reference a relative path or an absolute path. In this example,
    a relative path is used. However, if you''re using a tag library that is packaged
    in a jar file, you''ll use an absolute path. The section “Distributing Custom
    Tags” later in this chapter shows you how to package a custom tag library for
    easy distribution.


