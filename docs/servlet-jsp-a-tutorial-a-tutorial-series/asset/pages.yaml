    It is not hard to imagine that one day all frameworks will be deployed as a plug-in.


    # Summary


    In this chapter you have learned two new features for deploying applications and
    plug-ins on the fly. The first feature is dynamic registration, which allows you
    to dynamically add servlets, filters, and listeners without application restart.
    The second one is the servlet container initializer, which allows you to deploy
    plug-ins without changing the deployment descriptor of the user application. The
    servlet container initializer is particularly useful to framework developers.'
