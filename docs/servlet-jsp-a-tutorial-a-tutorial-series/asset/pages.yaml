  md: '# # Chapter 16 Deployment


    Deploying a Servlet 3 application is a breeze. Thanks to the servlet annotation
    types and depending on how complex your application is, you can deploy a servlet/JSP
    application without the deployment descriptor. Having said that, the deployment
    descriptor is still needed in many circumstances where more refined configuration
    is needed. When the deployment descriptor is must be named web.xml and located
    under the WEB-INF directory. Java classes must reside in WEB-INF/classes and Java
    libraries in WEB-INF/lib. All application resources must then be packaged into
    a single file with extension. A war file is basically a jar file.


    This chapter discusses deployment and the deployment descriptor, which is an important
    component of an application.


    # # Deployment Descriptor Overview


    Before Servlet 3 deployment always involved a web.xml file, the deployment descriptor,
    in which you configured various aspects of your application. With Servlet 3 the
    deployment descriptor is optional because you can use annotations to map a resource
    with a URL pattern. However, the deployment descriptor is needed if one of these
    applies to you.


    +   - You need to pass initial parameters to the ServletContext.

    - You have multiple filters and you want to specify the order in which the filters
    are invoked.

    - You need to change the session timeout.

    - You want to restrict access to a resource collection and provide a way for the
    user to authenticate themselves.'
  merge: -1
  pgno: 374
- img_proc: true
  md: "Listing 16. shows the skeleton of the deployment descriptor. It must be named\
    \ web.xml and reside in the WEB-INF directory of the application directory.\n\n\
    # Listing 16.1: The skeleton of the deployment descriptor\n\n```\n<xml version=\"\
    1.0\" encoding=\"ISO-8859-1\"?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee\n  http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd\"\
    \n  version=\"3.0\">\n  [metadata-complete=\"true false\"]\n  \n</web-app>\n```\n\
    \nThe **xsi:schemaLocation** attribute specifies the location of the schema against\
    \ which the deployment descriptor can be validated. The **version** attribute\
    \ specifies the version of the Servlet specification.\n\nThe optional **metadata-complete**\
    \ attribute specifies whether the deployment descriptor is complete. If its value\
    \ is true, the servlet/JSP container must ignore servlet-specific annotations.\
    \ If this element is set to false or if it's not present, the container must examine\
    \ the class files deployed with the application for servlet-specific annotations\
    \ and scan for web fragments.\n\nThe **web-app** element is the root element and\
    \ can have subelements for:\n\n+   - servlet declarations\n- servlet mappings\n\
    - **ServletContext** initial parameters\n- session configuration\n- listener classes\n\
    - filter definitions and mappings\n- MIME type mappings\n- welcome file list\n\
    - error pages"
