  md: '# JSTL Libraries


    JSTL is referred to as the standard tag library; however, it exposes its actions
    through multiple tag libraries. The tags in JSTL 1.2 can be categorized into five
    areas, which are summarized in Table 5.1.


    | Area | Subfunction | URI | Prefix |

    | --- | --- | --- | --- |

    | Core | Variable Support Flow Control URL Management Miscellaneous | http://java.sun.com/jsp/jstl/core
    | c |

    | XML | Core Flow Control Transformation | http://java.sun.com/jsp/jstl/xml |
    x |

    | I18n | Locale Message formatting Number and date formatting | http://java.sun.com/jsp/jstl/fmt
    | fmt |

    | Database Functions | SQL Collection length String manipulation | http://java.sun.com/jsp/jstl/sql
    http://java.sun.com/jsp/jstl/functions | sql fn |


    Table 5.1: JSTL Tag Libraries


    To use a JSTL library in a JSP page, use the taglib directive with the following
    format:


    ```

    <@ taglib uri="uri" prefix="prefix" %>

    ```


    For instance, to use the Core library, declare this at the beginning of the JSP
    page:


    ```

    <@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>

    ```


    The prefix can be anything. However, using the convention makes your code look
    more familiar to the other developers in your team and others'
