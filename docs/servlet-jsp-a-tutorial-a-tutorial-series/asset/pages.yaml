  md: 'where the space between @ and include is optional and url represents the relative
    path to an include file. If url begins with a forward slash (/), it is interpreted
    as an absolute path on the server. If it does not, it is interpreted as relative
    to the current JSP page.


    The JSP translator translates the include directive by replacing the directive
    with the content of the include file. In other words, if you have written the
    copyright.jsp file in Listing 3.4.


