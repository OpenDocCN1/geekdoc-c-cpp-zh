  md: '# Chapter 3: JavaServer Pages 81


    +   - javax.servlet.jsp.tagext. Contains types for developing custom tags (discussed
    in Chapter 6, “Writing Custom Tags.")

    - javax.el. Provides the API for the Unified Expression Language. See Chapter
    4, “The Expression Language."

    - javax.servlet.jsp.el. Provides classes that must be supported by the servlet/JSP
    container to support the Expression Language in JSP.


    With the exception of javax.servlet.jsp.tagext, you rarely have to use the JSP
    API directly. In fact, when you write a JSP page, you’re more concerned with the
    Servlet API than the JSP API itself. Of course, you also need to master the JSP
    syntax, which will be explained throughout this chapter. One example where the
    JSP API is used extensively is when developing a JSP container or a JSP compiler.


    You can view the JSP API here:


    ```

    http://download.oracle.com/docs/cd/E17802_01/products/products/jsp/2.1/jsp-2_1-pfd2/index.html

    ```


    A JSP page can contain template data and syntactic elements. An element is something
    with a special meaning to the JSP translator. For example, <% is an element because
    it denotes the start of a Java code block within a JSP page. %> is also an element
    because it terminates a Java code block. Everything that is not an element is
    template data. Template data is sent as is to the browser. For instance, HTML
    tags and text in a JSP page are template data.


    Listing 3.1 presents a JSP page named welcome.jsp. It is a simple page that sends
    a greeting to the client. Notice how simple the JSP page is compared to a servlet
    that does the same thing?


