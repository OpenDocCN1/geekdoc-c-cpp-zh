    # Example 3: Download Counter Filter


    The Download Counter filter in this example features a filter for counting how
    many times a resource has been downloaded. This is particularly useful if you
    want to know how popular your documents or your videos are. The numbers are stored
    in a properties file and not in a database for simplicity''s sake. The resource
    URI is used as the property key in the properties file.


    Because we''re storing values in a properties file and a filter can be accessed
    by multiple threads at the same time, there is a thread-safety issue that needs
    to be resolved. A user can request a resource and the filter will need to read
    the corresponding property value, increment it by one, and store back the new
    value. What if a second user requests the same resource before the first thread
    finishes its business? Well, the count will be inaccurate. Synchronizing the code
    that reads and writes values does not sound like an ideal solution as scalability
    may suffer.


    This example shows how to resolve this thread-safety problem by using a Queue
    and an Executor. If you''re not familiar with these two Java types, please refer
    to Chapter 18, "Working with Threads and Thread Safety" or my other book, "Java:
    A Beginner''s Tutorial (Third Edition).",


    In short, all incoming requests place a task in a queue in a single-threaded Executor.
    Placing a task is fast because it''s an asynchronous operation so that you don''t
    have to wait for the task to be complete. The Executor will take one item at a
    time from the queue and increment the correct property. Since the Executor uses
    only one thread, we have de-limated any chance of multiple threads accessing the
    property file.


    The DownloadCounterFilter class is given in Listing 9.3.


    +   Listing 9.3: DownloadCounterFilter


    ```

    package filter;

    import java.io.File;

    import java.io.FileReader;

    ```'
