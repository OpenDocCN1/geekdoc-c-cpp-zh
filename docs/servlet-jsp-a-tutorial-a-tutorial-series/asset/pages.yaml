    Figure 10.8 shows all products in the database. Initially, you should see an empty\
    \ list page because you still have to insert products. So, do it now and revisit\
    \ this page afterwards.\n\n# Dependency Injection\n\nDependency injection has\
    \ been widely used in the past few years as a solution to, among others, code\
    \ testability. In fact, dependency injection is behind great frameworks such as\
    \ Spring and Struts 2. So, what dependency injection?\n\n> Martin Fowler wrote\
    \ an excellent article on this subject:\nhttp://martinfowler.com/articles/injection.html\n\
    \nBefore Fowler coined the term “dependency injection,” the phrase “inversion\
    \ of control” was often used to mean the same thing. As Fowler notes in his article,\
    \ the two are not exactly the same."
