    # The taglib Directive


    You can use custom tags from your tag file using the taglib directive. The taglib
    directive has the following syntax:


    ```

    <@ taglib uri="tagLibraryURI" prefix="tagPrefix" %>

    ```


    The uri attribute specifies an absolute or relative URI that uniquely identifies
    the tag library descriptor associated with this prefix.


    The prefix attribute defines a string that will become the prefix to distinguish
    a custom action.


    With the taglib directive, you can use a custom tag of the following format for
    a custom tag that does not have a content body:


    ```

    <prefix:tagName/>

    ```


