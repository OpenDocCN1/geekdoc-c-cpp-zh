    # Directives


    Directives are the first type of JSP syntactic elements. They are instructions
    for the JSP translator on how a JSP page should be translated into a servlet.
    There are several directives defined in JSP 2.2, but only the two most important
    ones, page and include, are discussed in this chapter. The other directives that
    are covered in other chapters are taglib, tag, attribute, and variable.


    # The page Directive


    You use the page directive to instruct the JSP translator on certain aspects of
    the current JSP page. For example, you can tell the JSP translator the size of
    the buffer that should be used for the out implicit object, what content type
    to use, what Java types to import, and so on.


    The page directive has the following syntax:

    <%@ page attribute1="value1" attribute2="value2" ... %>


    The space between @ and page is optional and attribute1, attribute2, and so on
    are the page directive''s attributes. Here is the list of attributes for the page
    directive.


    +   * import. Specifies a Java type or Java types that will be imported and useable
    by the Java code in this page. For example, specifying import="java.util.List"
    imports the List interface. You can use the wildcard * to import the whole package,
    such as in import="java.util.". To import multiple types, separate two types with
    a comma, such as import="java.util.ArrayList, java.util.Calendar, java.io.PrintWriter".
    All types in the following packages are implicitly imported: servlet:java.lang,
    java.servlet, java.servlet.http, java.servlet.jsp.

    * session. A value of true indicates that this page participates in session management,
    and a value of false indicates otherwise. By default, the'
