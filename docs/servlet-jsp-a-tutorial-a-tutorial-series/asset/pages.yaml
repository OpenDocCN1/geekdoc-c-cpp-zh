  md: '# Chapter 1: Servlets


    the load-on-startup element. This element loads the servlet at application start-up,
    rather than when the servlet is first called. Using load-on-startup means the
    first call to the servlet will take no longer than subsequent calls. This is especially
    useful if the init method of the servlet takes a while to complete.


    Another advantage of the deployment descriptor is that you don''t need to recompile
    your servlet class if you need to change configuration values, such as the servlet
    path.


    In addition, you can pass initial parameters to a servlet and edit them without
    recompiling the servlet class.


    The deployment descriptor also allows you to override values specified in a servlet.
    A WebServlet annotation on a servlet that is also declared in the deployment descriptor
    will have no effect. However, annotating a servlet not in the deployment descriptor
    in an application with a deployment descriptor will still work. This means, you
    can have annotated servlets and declare servlets in the deployment descriptor
    in the same application.


