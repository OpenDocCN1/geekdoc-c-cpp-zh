    # Programmatic Security


    Even though declarative security is easy and straightforward, there are rare cases
    where you want to write code to secure your application. For this purpose, you
    can use the security annotation types and methods in the HttpServletRequest interface.
    Both are discussed in this section.


    # Security Annotation Types


    In the previous section you learned how to restrict access to a collection of
    resources using the security-constraint element in the deployment descriptor.
    One aspect of this element is that you use a URL pattern that matches the URLs
    of the resources to be restricted. Servlet 3 comes with'
