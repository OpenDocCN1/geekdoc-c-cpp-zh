    context.lookup(jndiName);\nconnection = dataSource.getConnection();\n} catch (NamingException\
    \ e) {\n  ...\n} catch (SQLException e) {\n  ...\n} catch (Exception e) {\n  ...\n\
    }\n} getConnection\n```\n\nCalling the getConnection method on a DataSource is\
    \ fast because connections are never closed; closing a connection simply returns\
    \ the connection to the pool. However, JNDI lookups are slow and, as such, the\
    \ returned DataSource is often cached.\n\nTo the servlet container to manage a\
