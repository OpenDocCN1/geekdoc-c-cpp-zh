  md: '# Choosing a Framework


    After you finish this book and master Servlet and JSP, it is a good idea to pick
    and learn at least one web framework. There are many excellent frameworks freely
    available. Struts 2, JavaServer Faces, Spring MVC, and Google Web Toolkit are
    all recommended. A framework solves common problems in servlet/JSP development
    and shorten development time.


    You may want to check your favorite job sites to find out which frameworks are
    currently in high demand.'
