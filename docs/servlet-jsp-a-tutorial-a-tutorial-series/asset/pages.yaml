    Table B.1: HttpConstraint attributes


    For example, the following HttpConstraint annotation declares that the annotated
    servlet can only be accessed by users that are part of the manager role. Since
    no HttpMethodConstraint annotation is present, the constraint applies to all HTTP
    methods.


    ```

    @ServletSecurity(@HttpConstraint(rolesAllowed = "manager"))

