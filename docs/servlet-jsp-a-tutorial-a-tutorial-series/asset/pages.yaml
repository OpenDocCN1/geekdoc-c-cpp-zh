  md: '# cookie


    You use the cookie implicit object to retrieve a cookie. This object represents
    a Map containing all cookies in the current HttpServletRequest. For example, to
    retrieve the value of a cookie named jsessionid, use the following expression:


    ```

    $(cookie.jsessionid.value)

    ```


    To obtain the path value of the jsessionid cookie, use this:


    ```

    $(cookie.jsessionid.path)

    ```


    # applicationScope, sessionScope, requestScope, and pageScope


    You use the applicationScope implicit object to obtain the value of an application-scoped
    variable. For example, if you have an application-scoped variable called myVar,
    you may use this expression to access the attribute: ${applicationScope.myVar}


    Note that in servlet/JSP programming scoped object is an object placed in an attribute
    in any of the following objects: PageContext, ServletRequest, HttpServlet, or
    ServletContext. The sessionScope, requestScope, and pageScope implicit objects
    are similar to applicationScope. However, the scopes are session, request, and
    page, respectively.


    A scoped object can also be accessed in an EL expression without the scope. In
    this case, the JSP container will return the first identically named object in
    the PageContext, ServletRequest, HttpServlet, or ServletContext. Searches are
    conducted starting from the narrowest scope (PageContext) to the widest (ServletContext).
    For example, the following expression will return the object referred by today
    in any scope.


    ```

    ${today}

    ```'
