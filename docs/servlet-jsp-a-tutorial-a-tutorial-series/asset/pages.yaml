    # Summary


    In this chapter you’ve learned about the Filter API that includes the Filter interface,
    the FilterConfig interface, and the FilterChain interface. You also have learned
    how to write a filter by implementing the Filter interface and annotate the class
    using @WebFilter and registering it in the deployment descriptor.


    There is only one instance for each type of filter. Therefore, thread safety may
    be an issue if you need to keep and change state in your filter class. The last
    filter example shows how to deal with this issue.'
