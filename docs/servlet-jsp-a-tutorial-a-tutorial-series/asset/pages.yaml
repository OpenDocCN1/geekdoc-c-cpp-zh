  md: '# # Chapter 8 Listeners


    The Servlet API comes with a set of event classes and listener interfaces for
    event-driven programming in servlet/JSP applications. All event classes are derived
    from java.util.Event and listeners are available in three different levels, the
    ServletContext level, the HttpServletSession level, and the ServletRequest level.


    This chapter demonstrates how to write listeners and use them in servlet/JSP applications.
    One of the listener interfaces, javax.servlet.AsyncListener, is a new addition
    to Servlet 3.0 and discussed in Chapter 14, “Asynchronous Operations.”


    # ## Listener Interfaces and Registration


    The listener interfaces for creating listeners are part of the javax.servlet and
    javax.servlet.http packages. They are listed below.


    +   - javax.servlet.ServletContextListener. A listener to respond to servlet context
    lifecycle events. One of its method is called right after the servlet context
    is created and another method right before the servlet context is shut down.

    - javax.servlet.ServletContextAttributeListener. A listener that can act upon
    a servlet context attribute being added, removed, or replaced.

    - javax.servlet.http.HttpSessionListener. A listener to respond to the creation,
    timing-out, and invalidation of an HttpServletSession.

    - javax.servlet.http.HttpSessionAttributeListener. A listener that gets called
    when a session attribute is added, removed, or replaced.

    - javax.servlet.http.HttpSessionActivationListener. A listener that gets called
    when an HttpSession has been activated or passivated.'
  merge: -1
  pgno: 208
- img_proc: true
  md: "# 200 Servlet &amp; JSP: A Tutorial\n\n+   - javax.servlet.http.HttpSessionBindingListener.\
    \ A class whose instances are to be stored as HttpSession attributes may implement\
    \ this interface. An instance of a class implementing HttpSessionBindingListener\
    \ will get a notification when it is added or removed from the HttpSession.\n\
    - javax.servlet.ServletRequestListener. A listener to respond to the creation\
    \ and removal of a ServletRequest.\n- javax.servlet.ServletAttributeListener.\
    \ A listener whose methods get called when an attribute has been added, removed,\
    \ or replaced by a ServletRequest.\n- javax.servlet.AsyncListener. A listener\
    \ used for asynchronous operations. It will be explained in detail in Chapter\
    \ 14, \"Asynchronous Operations.\"\n\nTo create a listener, simply create a Java\
    \ class that implements the relevant interface. In Servlet 3.0 there are two ways\
    \ to register a listener so that it will be recognized by the servlet container.\
    \ The first one is to use the WebListener annotation type like this:\n\n```\n\
    @WebListener\npublic class ListenerClass implements ListenerInterface {\n\\}\n\
    ```\n\nThe second way to register a listener is by using a listener element in\
    \ the deployment descriptor.\n\n```\n<listener>\n  <listener-class>fully-qualified\
    \ listener class</listener-class>\n</listener>\n```\n\nYou can have as many listeners\
    \ as you want in your application. Note that calls to a listener method are performed\
    \ synchronously.\n\n# Servlet Context Listeners\n\nThere are two listener interfaces\
    \ at the ServletContext level, ServletContextListener and ServletContextAttributeListener.\
    \ Both are explained in the sections below."
