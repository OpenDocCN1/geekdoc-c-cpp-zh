  md: "# How Struts Works\n\nStruts 2 has a filter dispatcher similar to that in app10b.\
    \ Its fully qualified name in Struts 2.3 is org.apache.struts2.dispatcher.ng.filter.-StrutsPrepareAndExecuteFilter.\
    \ (Earlier versions of Struts 2 used a different class.) To use the filter, register\
    \ it in the deployment descriptor (web.xml file) using this filter and filter-mapping\
    \ elements.\n\n```\n<filter>\n  <filter-name>struts2</filter-name>\n  <filter-class>\n\
    \    org.apache.struts2.dispatcher.ng.StrutsPrepareAndExecuteFilter\n  </filter-class>\n\
    </filter>\n<filter-mapping>\n  <filter-name>struts2</filter-name>\n  <url-pattern>/*</url-pattern>\n\
    </filter-mapping>\n```\n\nThere's a lot that filter dispatcher in a Model 2 application\
    \ has to do and Struts 2's filter dispatcher is by no means an exception. Since\
    \ Struts 2 has much more features to support, its filter dispatcher could grow\
    \ infinitely in complexity. However, Struts 2 approaches this by splitting task\
    \ processing in its filter dispatcher into subclasses called interceptors. The\
    \ first interceptor you'll notice is the one that populates the action object\
    \ with request parameters. You'll learn more about interceptors in the section\
    \ \"Interceptors\" later in this chapter.\n\nIn a Struts 2 application the action\
    \ method is executed after the action's properties are populated. An action method\
    \ can have any name as long as it is a valid Java name.\n\nAn action method returns\
    \ a String value. This value indicates to Struts 2 where control should be forwarded\
    \ to. A successful action execution will forward to a different view than a failed\
    \ one. For instance, the String \"success\" indicates a successful action method\
    \ execution and \"error\" indicates that there's an error during processing and\
    \ an error message should be displayed. Most of the time a RequestDispatcher will\
    \ be used to forward to a JSP page, however JSP pages are not the only valid"
