    # Secure Sockets Layer (SSL)


    Originally developed by Netscape, the SSL protocol enables secure communications
    over the Internet and at the same time ensures the confidentiality and data integrity.


    To fully understand how SSL works, there are a number of technologies that you
    need to learn, from cryptography to private and public key pairs to certificates.
    This section discusses SSL and its components in detail.


    # Cryptography


    From time to time has always been a need for secure communication channels, i.e.
    where messages are safe and other parties cannot understand and tamper with the
    messages even if they can get access to them.


    Historically, cryptography was only concerned concerned with encryption and decryption,
    where two parties exchanging messages can be rest assured that only they can read
    the messages. In the beginning, people encrypted and decrypted messages using
    symmetric cryptography. In symmetric cryptography, you use the same key to encrypt
    and decrypt messages. Here is a very simple encryption/decryption technique.


    Suppose, the encryption method uses a secret number to shift forward each character
    in the alphabet. Therefore, if the secret number is 2, the encrypted version of
    "ThisFriday" is "VjuHtkfea". When you reach the end of the alphabet, you start
    from the beginning, therefore y becomes a. The receiver, knowing the key is 2,
    can easily decrypt the message.


    However, symmetric cryptography requires that both parties know in advance the
    key for encryption/decryption. Symmetric cryptography is not suitable for the
    Internet for the following reasons


    +   Two people exchanging messages often do not know each other. For example,
    when buying a book at Amazon.com you need to send your'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# 352 Servlet & JSP: A Tutorial


    particulars and credit card details. If symmetric cryptography was to be used,
    you would have to call Amazon.com prior to the transaction agree on a key.


    +   - Everyone wants to be able to communicate with many other parties. If symmetric
    cryptography was used, everyone would have to maintain different unique keys,
    each for a different party.


    +   - Since you do not know the entity you going to communicate with, you need
    to be sure that they are really who they claim to be.


    +   - Messages over the Internet pass through many different computers. It is
    fairly trivial to tap other people''s messages. Symmetric cryptography does not
    guarantee that a third party may tamper with the data.


    Therefore, today secure communication over the Internet uses asymmetric cryptography
    that offers these three features:


    +   - encryption/decryption. Messages are encrypted to hide the messages from
    third parties. Only the intended receiver can decrypt them.


    +   - authentication. Authentication verifies that an entity is who it claims
    to be.


    +   - data integrity. Messages sent over the Internet pass many computers. It
    must be ensured that the data sent is unchanged and intact.


    In asymmetric cryptography, public key encryption is used. With this type of encryption,
    data encryption and decryption is achieved through the use of a pair of asymmetric
    keys: a public key and a private key. A private key is private. The owner must
    keep it in a secure place and it must not fall into the possession of any other
    party. A public key is to be distributed to the public, usually downloadable by
    anyone who would like to communicate with the owner of the keys. You can use tools
    to generate pairs of public keys and private keys. These tools will be discussed
    later in this chapter.


    The beauty of public key encryption is: data encrypted using the corresponding
    private key; at the same token data encrypted using a private key can only be
    decrypted using the corresponding public key. This elegant algorithm is based
    on very large prime numbers and was invented by Ron Rivest, Adi Shamir, and Len
    Adleman at Massachusetts Institute of Technology (MIT) in 1977. They simply called
    the algorithm RSA, based on the initials of their last names.'
  merge: -1
  pgno: 361
- img_proc: true
  md: 'The RSA algorithm proves to be practical for use on the Internet, especially
    for e-commerce, because only the vendor is required to have a key pair for secure
    communications with all its buyers.


    An illustration of how public key encryption works normally use two figures called
    Bob and Alice, so I''ll use them too.


    # Encryption/Decryption


    One of the two who want to exchange messages must have a pair of keys. Suppose
    Alice wants to communicate with Bob and Bob has a public key and a private key.
    Bob will send Alice his public key and Alice can use it to encrypt messages sent
    to Bob. Only Bob can decrypt them because he owns the corresponding private key.
    To send a message to Alice, Bob encrypts it using his private key and Alice can
    decrypt it Bob’s public key.


    However, unless Bob can meet with Alice in person to hand over his public key,
    this method is far from perfect. Anybody with a pair of keys can claim to be Bob
    and there is no way Alice can find out. On the Internet, two parties exchanging
    messages often live half a globe away, meeting in person is often not possible.


    # Authentication


    In SSL, authentication is addressed by introducing certificates. A certificate
    contains the following:


    +   - a public key

    - information about the subject, i.e. the owner of the public key.

    - the certificate issuer''s name.

    - some timestamp to make the certificate expire after a certain period of time.


    The crucial thing about a certificate is that it must be digitally signed by a
    trusted certificate issuer, such as VeriSign or Thawte. To digitally sign an electronic
    file (a document, a jar file, etc) is to add your signature to your'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# 354 Servlet & JSP: A Tutorial


    document/file. The original file is not encrypted, and the real purpose of signing
    is to guarantee that the document/file has not been tampered with. Signing a document
    involves creating a digest of the document and encrypting the digest using the
    signer’s private key. To check if the document is still in its still original
    condition, you perform these two steps.


    +   1. Decrypt the digest accompanying the document using the signer’s public
    key. You will soon learn that the public key of a trusted certificate issuer is
    widely available.

    2. Create a digest of the document.

    3. Compare the result of Step 1 and the result of Step 2. If the two match, the
    file has not been tampered with.


    This authentication method works only because the holder of the private key can
    encrypt the document, and this digest can only be encrypted using the corresponding
    public key. Assuming you trust that you hold the original public key, then you
    know that the file has not been changed.


    # Note


    Because certificates can be digitally signed by a trusted certificate issuer,
    people make their certificates publicly available, instead of their public keys.


    There are a number of certificate issuers, including VerSign and Thawte. A certificate
    issuer has a pair of public key and private key. To apply for a certificate, Bob
    has to generate a pair of keys and send his public key to a certificate issuer,
    who will later authenticate Bob by asking him to send a copy of his passport or
    other types of identification. Having verified Bob, a certificate issuer will
    sign the certificate using its private key. By ‘signing’ it means encrypting.
    Therefore, the certificate can only be read by using the certificate issuer’s
    public key. The public key of a certificate issuer is normally distributed widely.
    For example, Internet Explorer, Netscape, Firefox and other browsers by default
    several certificate issuers’ public keys.


    For example, in IE, click Tools --> Internet Options --> Content --> Certificates
    --> Trusted Root Certification Authorities tab to see the list of certificates.
    (See Figure 15.4).'
