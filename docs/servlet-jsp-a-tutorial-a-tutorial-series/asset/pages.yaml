  md: "# 378 Servlet & JSP: A Tutorial\n\nThe session-timeout element specifies the\
    \ default session timeout interval in minutes. This value must be an integer.\
    \ If the value of the session-timeout element is zero or a negative number, the\
    \ session will never time out.\n\nThe cookie-config element defines the configuration\
    \ of the session tracking cookies created by this servlet/JSP application.\n\n\
    The tracking-mode element defines the tracking mode for sessions created by this\
    \ web application. Valid values are COOKIE, URL, or SSL.\n\nThe following session-config\
    \ element causes the HttpServletSession objects in the current application to\
