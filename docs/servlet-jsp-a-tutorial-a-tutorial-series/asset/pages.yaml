    # The remove Tag


    You use the **remove** tag to remove a scoped variable. The syntax is as follows:


    ```

    <c:remove var="varName" scope="[page|request|session|application]/>

    ```


    Note that the object referenced by the scoped variable is not removed. Therefore,
    if another scoped variable is also referencing the same object, you can still
    access the object through the other scoped variable.


    The list of the **remove** tag''s attributes is given in Table 5.4.


    | Attribute | Type | Description |

    | var | String | The name of the scoped variable to remove. |

    | scope | String | The scope of the scoped variable to be removed |


    Table 5.4: The remove tag''s attributes


    As an example, the following **remove** tag removes the page-scoped variable job.


    ```

    <c:remove var="job" scope="page/>

    ```


    # Conditional Actions


    Conditional actions are used to deal with situations in which the output of a
    page depends on the value of certain input, which in Java are solved using **if,
    if ... else**, and **switch** statements.


    There are four tags that perform conditional actions in JSTL: **if, choose, when,**
    and **otherwise**. Each will be discussed in a section below.'
