  md: "# # Chapter 11\nFile Upload\n\nOnce upon a time not long after Servlet technology\
    \ had emerged, file upload programming was still a challenging task that involved\
    \ parsing raw HTTP responses on the server side. To alleviate the pain, developers\
    \ would resort to commercial file upload components, of which some cost an arm\
    \ and a leg. Fortunately, in 2003 the Apache Software Foundation released its\
    \ open source Commons FileUpload component, which soon became a hit with servlet/JSP\
    \ programmers worldwide.\n\nIt took years before the designers of Servlet realized\
    \ that file upload was essential, but file upload was finally built-in in feature\
    \ in Servlet 3. Servlet 3 developers do not have to import the Commons FileUpload\
    \ component into their projects anymore.\n\nThis chapter shows how to make use\
    \ of the Servlet 3 file upload feature and what you need to do on the client side.\
    \ It also demonstrates how you can enhance user experience with HTML 5.\n\n# #\
    \ Client Side Programming\n\nTo upload a file, you must set the value of the enctype\
    \ attribute of your HTML form with multipart/form-data, like this:\n\n```\n<form\
    \ action=\"action\" enctype=\"multipart/form-data\" method=\"post\">\n  Select\
    \ a file<input type=\"file\" name=\"fieldName\"/>\n  <input type=\"submit\" value=\"\
    Upload\"/>\n</form>\n```"
  merge: -1
  pgno: 290
- img_proc: true
  md: 'The form must contain an input element of type file, which will be rendered
    as a button that, when clicked, opens a dialog to select a file. The form may
    also contain other field types such as a text area or a hidden field.


    Prior to HTML 5, if you wanted to upload multiple files, you had to use multiple
    file input elements. however, HTML 5, makes multiple file uploads simpler by introducing
    the multiple attribute in the input element. You can write one of the following
    in HTML 5 to generate a button for selecting multiple files:


    ```

    <input type="file" name="fieldName" multiple/>

    <input type="file" name="fieldName" multiple="multiple"/>

    <input type="file" name="fieldName" multiple=""/>

    ```


    # Server Side Programming


    Server file upload programming in Servlet centers around the MultipartConfig annotation
    type and the javax.servlet.http.Part interface. Servlets that handle uploaded
    files must be annotated @MultipartConfig. MultipartConfig may have the following
    attributes, all of which optional.


    +   - **maxFileSize**. The maximum size for uploaded files. Files larger than
    the specified value will be rejected. By default, the value of maxFileSize is
    -1, which means unlimited.

    - **maxRequestSize**. The maximum size allowed for multipart HTTP requests. By
    default, the value is -1, which translates to unlimited.

    - **location**. The save location when the uploaded file is saved to disk by calling
    the write method on the Part.

    - **fileSizeThreshold**. The size threshold after which the uploaded file will
    be written to disk.


    In a multipart request, every form field, including non-file fields, is converted
    into a Part. The HttpServletRequest interface defines the following methods for
    working with multipart requests:


    ```

    Part getPart(java.lang.String name)

    ```


    Returns the Part associated with the specified name.


    ```

    java.util.Collection<Part> getParts()

    ```'
