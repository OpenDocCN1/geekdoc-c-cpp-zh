  md: '# Chapter 11: File Upload


    Returns all Parts in this request.


    And, these are the methods in the Part interface.


    java.lang.String getName()


    Retrieves the name of this part, i.e. the name of the associated form field.


    java.lang.String getContentType()


    If the Part is a file, returns the content type of the Part. Otherwise, returns
    null.


    java.util.Collection<java.lang.String> getHeaderNames()


    Returns all header names in the Part.


    java.lang.String getHeader(java.lang.String headerName)


    Returns the value of the specified header.


    java.util.Collection<java.lang.String> getHeaders(java.lang.String headerName)


    Returns the values of the Part header.


    void write(java.lang.String path)


    Writes the uploaded file to the disk. If path is an absolute path, write to the
    specified path. If path is a relative path, write to the specified path relative
    to the value of the location attribute of the MultiConfig annotation.


    void delete()


    Deletes the underlying storage for this file including the associated temporary
    file.


    java.io.InputStream getInputStream()


    Returns the content of the uploaded file as an InputStream.


    A Part returns these headers if the corresponding HTML input is a file input element:


    content-type: contentType

    content-disposition:form-data; name="fieldName"; filename="fileName"


    For example, uploading a note.txt file in an input field called document will
    cause the associated part to have these headers:


    content-type:text/plain'
