  md: "# Configuring the EL in JSP 2.0 and Later Versions\n\nWith the EL, JavaBeans,\
    \ and custom tags, it is now possible to write script-free JSP pages. JSP 2.0\
    \ and later versions even provide a switch to disable scripting in all JSP pages.\
    \ Software architects can now enforce the writing of script-free JSP pages.\n\n\
    On the other hand, in some circumstances you'll probably want to disable the EL\
    \ in your applications. For example, you'll want to do so if you are using a JSP\
    \ 2.0-compliant container but are not ready yet to upgrade to JSP 2.0. In this\
    \ case, you can disable the evaluation of EL expressions.\n\nThis section discusses\
    \ how to enforce script-free JSP pages and how to disable the EL in JSP 2.0 and\
    \ later.\n\n# Achieving Script-Free JSP Pages\n\nTo disable scripting elements\
    \ in JSP pages, use the jsp-property-group element with two subelements: url-pattern\
    \ and scripting-invalid. The url-pattern element defines the URL pattern to which\
    \ scripting disablement will apply. Here is how you disable scripting in all JSP\
    \ pages in an application:\n\n```\n<jsp-config>\n  <jsp-property-group>\n    <url-pattern>*.jsp</url-pattern>\n\
    \    <scripting-invalid>true</scripting-invalid>\n  </jsp-property-group>\n</jsp-config>\n\
    ```\n\n> Note\nThere can be only one jsp-config element in the deployment descriptor.\
    \ If you have specified a jsp-property-group for deactivating the EL, you must\
    \ write your jsp-property-group for disabling scripting under the same jsp-config\
    \ element."
  merge: -1
  pgno: 129
- img_proc: true
  md: "# Deactivating EL Evaluation\n\nIn some circumstances, such as when you need\
    \ to deploy JSP 1.2 applications in a JSP 2.0 or later container, you may want\
    \ to deactivate EL evaluation in a JSP page. When you do so, an occurrence of\
    \ the EL construct will not be evaluated as an EL expression. There are two ways\
    \ to deactivate EL evaluation in a JSP.\n\nFirst, you can set the isIgnored attribute\
    \ of the page directive to true, such as in the following:\n\n```\n<@ page isIgnored=\"\
    true\" %>\n```\n\nThe default value of the isIgnored attribute is false. Using\
    \ the isIgnored attribute is recommended if you want to deactivate EL evaluation\
    \ in one or a few JSP pages.\n\nSecond, you can use the jsp-property-group element\
    \ in the deployment descriptor. The jsp-property-group element is a subelement\
    \ of the jsp-config element. You use jsp-property-group to apply certain settings\
    \ to a set of JSP pages in the application.\n\nTo use the jsp-property-group element\
    \ to deactivate EL evaluation, you must have two subelements: url-pattern and\
    \ el-ignored. The url-pattern element specifies the URL pattern to which EL deactivation\
    \ will apply. The el-ignored element must be set to true.\n\nAs an example, here\
    \ is how to deactivate EL evaluation in a JSP named noEl.jsp.\n\n```\n<jsp-config>\n\
    \  <jsp-property-group>\n    <url-pattern>/noEl.jsp</url-pattern>\n    <el-ignored>true</el-ignored>\n\
    \  </jsp-property-group>\n</jsp-config>\n```\n\nYou can also deactivate the EL\
    \ evaluation in all the JSP pages in an application by assigning *.jsp to the\
    \ url-pattern element, as as in the following:\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    ```"
  merge: -1
  pgno: 130
- img_proc: true
  md: '```

    <url-pattern>*.jsp</url-pattern>

    <el-ignored>true</el-ignored>

    </jsp-property-group>

    </jsp-config>

    ```


    EL evaluation in a JSP page will be deactivated if either the isIgnored attribute
    of its page directive is set to true or its EL matches the pattern in the jsp-property-group
    element whose el-ignored sublelement is set to true. For example, if you set the
    page directive’s isIgnored attribute of a JSP page to false but its EL matches
    the pattern of JSP pages whose EL evaluation must be deactivated in the deployment
    descriptor, EL evaluation of that page will be deactivated.


    In addition, if you use the deployment descriptor that is compliant to Servlet
    2.3 or earlier, the EL evaluation is already disabled by default, even though
    you are using a JSP 2.0 or later container.


    # Summary


    The EL is one of the most important features in JSP 2.0 and later. It can help
    you write shorter and more effective JSP pages, as well as helping you author
    script-free pages. In this chapter you have seen how to use the EL to access JavaBeans
    and implicit objects. Additionally, you have seen how to use EL operators. In
    the last section of this chapter, you learned how to use EL-related application
    settings related in a JSP 2.0 and later container.'
  merge: -1
