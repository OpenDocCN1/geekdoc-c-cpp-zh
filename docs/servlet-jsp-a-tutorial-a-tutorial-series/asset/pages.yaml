    # HttpSession Objects


    All of the session tracking techniques, **HttpSession** objects are the most powerful
    and the most versatile. A user can have zero or one **HttpSession** and can only
    access his/her own **HttpSession**.


    An **HttpSession** is created automatically when a user first visits a site. You
    retrieve a user''s **HttpSession** by calling the **getSession** method on the
    **HttpServletRequest**. There are two overloads of **getSession:**


    ```

    HttpSession getSession()

    HttpSession getSession(boolean create)

    ```


    The no-argument **getSession** method returns the current **HttpSession** or creates
    and returns one if none exists. **getSession(false)** returns the current **HttpSession**
    is one or null if none exists. **getSession(true)** returns the current **HttpSession**
    if one exists or creates a new one if none does. **getSession(true)** is the same
    as **getSession().**


    The **setAttribute** method of **HttpSession** puts a value in the **HttpSession**.
    Its signature is as follows:


    ```

    void setAttribute(java.lang.String name, java.lang.Object value)

    ```'
