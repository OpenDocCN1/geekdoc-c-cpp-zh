- img_proc: true
  md: '# Chapter 2: Session Management 67


    Note that unlike in URL rewriting, hidden fields and cookies, a value put in an
    HttpSession is stored in memory. As such, you should only store the smallest possible
    objects in it and not too many of them. Even though modern servlet containers
    can move objects in HttpSessions to secondary storage when it''s about to run
    out of memory, this would be a performance drag. Therefore, be careful what you
    store in memory.


    A value added to an HttpSession does not have to be a String but can be any Java
    object as long as it implements java.io.Serializable, so that the stored object
    can be serialized to a file or a database when the servlet container thinks it''s
    necessary to do so, such as when the container runs out non-serializable objects
    in an HttpSession, however if the servlet container ever attempts to serialize
    them, it will fail and throw an exception.


    The setAttribute method expects a different name for a different object. If you
    pass an attribute name that has been previously used, the name will be disassociated
    from the old value and associated with the new value.


    You can retrieve an object stored in an HttpSession by calling the getAttribute
    method on the HttpSession, passing an attribute name. The signature of this method
    is as follows:


    ```

    java.lang.Object getAttribute(java.lang.String name)

    ```


    Another useful method in HttpSession is getAttributeNames, which returns an Enumeration
    for iterating all attributes in an HttpSession. java.util.Enumeration<java.lang.String>
    getAttributeNames()


    Note that values stored in an HttpSession are not sent to the client side, unlike
    the other session management techniques. The servlet container generates a unique
    identifier for every HttpSession it creates and sends this identifier as a token
    to the browser, either as a cookie named JSESSIONID or by appending it to URLs
    as a jsessionid parameter. On subsequent requests, the browser sends back the
    token to the server, allowing the server to tell which user is making the request.
    Whichever way the servlet container chooses to transmit session identifiers, it
    happens automatically in the background without you having to make an effort.'
