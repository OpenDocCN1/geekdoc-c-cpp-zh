  md: '# Chapter 13

    Decorating Requests and Responses


    The Servlet API comes with four wrapper classes that you can use to change the
    behavior of servlet requests and servlet responses. The wrappers allow you to
    “wrap” any method in the ServletRequest and ServletResponse or their HTTP equivalents
    (HttpServletRequest and HttpServletReponse, respectively). These wrappers follow
    the Decorator or Wrapper pattern, and to utilize these you need to understand
    what the pattern is.


    This chapter starts with an explanation of the Decorator pattern and provides
    an example of how to change the behavior of HttpServletRequest objects by wrapping
    them. The same technique can be used to wrap HttpServletResponse objects.


    # The Decorator Pattern


    The Decorator or Wrapper pattern allows you to decorate or wrap (in plain language,
    modify the behavior of) an object even if you don''t have the source code for
    the object''s class or if the class is declared final.


    The Decorator pattern is suitable for situations where inheritance will not work
    (for example, if the class of the object in question is final) or you do not create
    the object yourself but rather get it from another subsystem. For example, the
    servlet container creates a ServletRequest and a ServletResponse and pass them
    to the servlet''s service method. The only way to change the behavior of the HttpRequest
    and HttpServletResponse by wrapping them in other objects. The only condition
    that must be met is'
  merge: -1
  pgno: 322
- img_proc: true
  md: "that the class of a decorated object implements an interface and the methods\
    \ that will be wrapped are inherited from that interface.\n\nConsider the UML\
    \ class diagram in Figure 13.1.\n\n![](img/45889fd1b2eef3ac27c1c5a024fe40c7_323_0.png)\n\
    \nFigure 13.1: The Decorator pattern\n\nThe class diagram in Figure 13.1 shows\
    \ a Component interface with an implementation class named ComponentImpl. The\
    \ Component interface defines a methodA method. To decorate instances of ComponentImpl,\
    \ create a Decorator class that implements Component and extend Decorator to program\
    \ new behavior in a subclass. In the diagram DecoratorA is a subclass of Decorator.\n\
