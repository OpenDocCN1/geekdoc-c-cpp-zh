    >\n<Resource name=\"jdbc/dataSourceName\"\n  auth=\"Container\"\n  type=\"javax.sql.DataSource\"\
    \n  username=\"...\"\n  password=\"...\"\n  driverClassName=\"...\"\n  url=\"\
    ...\"\n</Resource>\n</Context>\n```\n\nYou need to enter the correct database\
    \ user name and password in the username and password attributes, respectively.\
    \ You also need to supply the JDBC driver class and the database URL in the driverClassName\
    \ and url attributes, respectively. In addition, you need to include the JDBC\
    \ driver library in the WEB-INF/lib directory of your application directory. More\
    \ information on configuring a resource can be found in Appendix A, \"Tomcat.\"\
    \n\nFor example, the following Tomcat Context declaration defines an application\
    \ (app10d) with a DataSource resource that maintains a"
