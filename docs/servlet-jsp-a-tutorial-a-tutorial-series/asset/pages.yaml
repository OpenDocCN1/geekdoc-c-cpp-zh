- img_proc: true
  md: '# 190 Servlet & JSP: A Tutorial


    The syntax can be expressed in the following more informal form:

    <% variable attribute1="value1" attribute2="value2" ... %>


    The attributes for the **variable** directive are given in Table 7.5.


    | Attribute | Description |

    | --- | --- |

    | name-given | The variable name that will be available to the scripting language
    or EL expressions in the calling JSP page. If the **name-from-attribute** is used,
    the **name-given** attribute must not be present, and vice-versa. The value for
    **name-given** must not be the same as any of the attributes in this tag file.
    |

    | name-from-attribute | This is similar to the **name-given** attribute. However,
    the value for this attribute is the name of an attribute whose value at the start
    of the tag invocation will give the name of the variable. A translation error
    will result if both or neither of the **name-given** and **name-from-attribute**
    attributes are specified. |

    | alias | A locally scoped attribute to hold the value of this variable. |

    | variable-class | The type of this variable. The default is `java.lang.String`
    |

    | declare | Indicates whether the variable is declared in the calling page or
    tag file after this tag invocation. The default is true. |

    | scope | The scope of the scripting variable defined. The possible values are
    **AT_BEGIN**, **AT_END**, and **NESTED** (default). |

    | description | The description of this variable. |


    Table 7.5: Attributes of variable


    You probably ask why you need the **variable** directive at all if you can just
    print the processing result to the **JspWriter** of the calling JSP page. This
    is because sending a `String` to the **JspWriter** deprives the calling JSP page
    of flexibility on how to use the result. For an example, the **first.tag** file
    in Listing 7.1 outputs the server''s current date in long format. If you want
    to also provide the server''s current date in short format, you''ll have to write
    another tag file. Having two tag files that perform similar functionality adds
    unnecessary maintenance headache. Alternatively, you can expose two variables
    in the tag file, **longDate** and **shortDate**.'
