  md: '# # Chapter 7

    Tag Files


    You have seen in Chapter 6, “Writing Custom Tags” that custom tags enable you
    to write script-free JSP pages, thus promoting separation of labor, which means
    the page designer and the Java coder can work simultaneously. However, you''ve
    also learned that writing custom tags is a tedious chore, involving writing tag
    and compiling tag handlers and defining the tags in the tag library descriptor.


    Starting from JSP 2.0, you can write tag files, which are custom actions without
    tag handlers and tag library descriptors. With tag files no compilation is necessary
    and tag library descriptor is required.


    This chapter discusses tag files in detail. It starts with an introduction to
    tag files and then covers several aspects of writing custom tags using tag files
    only. The doBody and invoke standard actions are also discussed in the sections
    towards the end of the chapter.


    # ## Introduction to Tag Files


    Tag files simplify the process of writing custom tags in two ways. First, tag
    files don''t need to be compiled as they are compiled the first time they are
    invoked. In addition, with tag files extensions can be written using JSP syntax
    alone. This means, someone who does not know Java can also write tag extensions!


    Secondly, no tag library descriptor is needed. The tag element in the tag library
    descriptor describes the name to be used in a JSP page to reference the custom
    action. Using tag files, the name of a custom action is the same'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'as the tag file representing the action, thus eliminating the need for the
    tag library descriptor.


    JSP containers may choose to compile tag files into Java tag handlers or interpret
    the tag files. For example, Tomcat translates tag files into simple tag handlers
    that implement the javax.servlet.jsp.tagext.SimpleTag interface.


    A tag file looks like a JSP page. It can have directives, EL expressions, standard
    actions, and custom tags. A tag file has a tag or tagx extension and can also
    include other files that contain a common resource. An include file for a tag
    file has tagf extension.


    In order to work, tag files must be placed in the WEB-INF/tags directory of an
    application directory or a subdirectory under it. Just like tag handlers, tag
    files can be packaged into jar files.


    | Object | Type |

    |---|---|

    | request | javax.servlet.http.HTTPRequest |

    | response | javax.servlet.http.HttpServletResponse |

    | out | javax.servlet.jsp.JspWriter |

    | session | javax.servlet.http.HttpSession |

    | application | javax.servlet.ServletContext |

    | config | javax.servlet.ServletConfig |

    | jspContext | javax.servlet.jsp.JspContext |


    **Table 7.1: Implicit Objects available in tag files**


