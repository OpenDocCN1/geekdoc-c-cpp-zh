  md: '# Chapter 18: Introduction to Struts 2


    An action that does not specify an action class will be given an instance of the
    default action class. The ActionSupport class is the default action class.


    If an action has a non-default action class, you must specify the fully qualified
    class name using the class attribute. In addition, you must also specify the name
    of the action method, which is the method in the action class that will be executed
    when the action is invoked. Here is an example.


    ```

    <action name="Address_save" class="app.Address" method="save">

    ```


    If the class attribute is present but the method attribute is not, execute is
    assumed for the method name. In other words, the following action elements mean
    the same thing.


    ```

    <action name="Employee_save" class="app.Employee" method="execute">

    <action name="Employee_save" class="app.Employee">

    ```


    # The Result Element


    <result> is a subelement of <action> and tells Struts 2 where you want the action
    to be forwarded to. A result element corresponds to the return value of an action
    method. Because an action method may return different values for different situations,
    an action element may have several result elements, each of which corresponds
    to a possible return value of the action method. This is to say, if a method may
    return “success” and “input”, you must have two result elements. The name attribute
    of the result element maps a method with a method return value.


    # Note


    If a method returns a value without a matching result element, Struts will try
    to find a matching result under the global-results element (See the discussion
    of this element below). If no corresponding result element is found under global-results,
    an exception is thrown.


    For example, the following action element contains two result elements.


    ```

    <action name="Product_save" class="app.Product" method="save">

    <result name="success" type="dispatcher">

    /jsp/Confirm.jsp

    ```'
