  md: "# # Appendix B\nWeb Annotations\n\nServlet 3 comes with a set of annotation\
    \ types in the javax.servlet.annotation package for annotating web objects such\
    \ as servlets, filters, and listeners. This Appendix lists the annotation types.\n\
    \n# ## HandlesTypes\n\nThis annotation type is used to declare the class types\
    \ that a ServletContainerInitializer can handle. It has one attribute, value,\
    \ that is used to declare the class types. For example, the following ServletContainerInitializer\
    \ is annotated with @HandleTypes that declares that the initializer can handle\
    \ UsefulServlet.\n\n```\n @HandleTypes({UsefulServlet.class})\npublic class MyInitializer\
    \ implements ServletContainerInitializer {\n...\n}\n```\n\n# ## HttpConstraint\n\
    \nThe HttpConstraint annotation type represents the security constraints applied\
    \ to all HTTP protocol methods for which a corresponding HttpMethod element is\
    \ not present. This annotation type must reside within the ServletSecurity annotation.\n\
    \nThe attributes of HttpConstraint are given in Table B.1."
