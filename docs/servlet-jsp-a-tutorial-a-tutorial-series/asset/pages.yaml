  md: '# # Appendix C

    SSL Certificates


    In this appendix you will learn how to generate a public/private key pair using
    the KeyTool program and have the public key signed by a trusted authority as a
    certificate. See Appendix A, “Tomcat” for information on installing SSL certificates
    in Tomcat.


    # ## Certificate Overview


    SSL is based on both symmetric and asymmetric cryptography. The latter involves
    a pair of keys, one private and one public. This is explained in Chapter 15, “Security.”


    A public key is normally wrapped in a certificate since a certificate is a more
    trusted way of distributing a public key. The certificate is signed using the
    private key that corresponds to the public key contained in the certificate. It
    is called a self-signed certificate. In other words, a self-signed certificate
    is one for which the signer is the same as the subject described in the certificate.


    A self-signed certificate is good enough for people to authenticate the sender
    of a signed document if those people already know the sender. For better acceptance,
    you need a certificate signed by a Certificate Authority,'
  merge: -1
  pgno: 440
- img_proc: true
  md: '# 432 Servlet & JSP: A Tutorial


    such as VeriSign Thawte. You need to send your self-signed certificate.


    After a CA authenticates you, they will issue you certificate that replaces the
    self-signed certificate. This new certificate may also be a chain of certificates.
    At the top of the chain is the ‘root’, which is the self-signed certificate. Next
    in the chain is the certificate from a CA that authenticates you. If the CA is
    not well known, they will send it to a bigger CA that will authenticate the first
    CA’s public key. The last CA will also send the certificate, forming a chain of
    certificates. This bigger CA normally has their public keys widely distributed
    so people can easily authenticate them they sign.


    Java provides a set of tools and APIs that can be used to work with asymmetric
    cryptography explained in the previous section. With them you can do the following:


    +   - Generate pairs of public and private keys. You can then send the public
    key generated to a certificate issuer to obtain your own certificate. For a fee,
    of course.

    - Store your private and public keys in a database called keystore. A keystore
    has a name and password protected.

    - Store other people’s certificates in the same keystore.

    - Create your own certificate by signing it with your own private key. However,
    such certificates will have limited use. For testing, self-signed certificates
    are good enough.

    - Digitally sign a file. This is particularly important because browsers will
    only allow applets access to resources if the applets are stored in a jar file
    that has been signed. Signed Java code guarantee the user that you are really
    the developer of the class. If they trust you they may have less doubt about running
    the Java class.


    Let’s review the tool.


    # The KeyTool Program


    The KeyTool program is a utility to create and maintain public and private keys
    and certificates. It comes with the JDK and is located in the bin'
