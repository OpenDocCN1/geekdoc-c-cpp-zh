- img_proc: true
  md: "# Chapter 16: Deployment 369\n\nThis element must contain the following subelements.\n\
    \n+   - error-code, to specify an HTTP error code\n- exception-type, to specify\
    \ the fully-qualified name of the Java exception type to be captured\n- location,\
    \ to specify the location of the resource to be displayed start the event of an\
    \ error or exception. The location element must start with a/.\n\nFor example,\
    \ the following is an error-page element that tells the servlet/JSP container\
    \ to display the error.html page located at the application directory every time\
    \ an HTTP 404 error code occurs:\n\n```\n<error-page>\n  <error-code>404</error-code>\n\
    \  <location>error.html</location>\n</error-page>\n```\n\nThe following is an\
