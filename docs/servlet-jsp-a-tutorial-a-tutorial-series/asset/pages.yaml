    key, and Alice has a copy of Bob''s public key. If the two match, Alice can be
    sure that the other party is really Bob.


    The first thing Alice does after authenticating Bob is to send a secret key that
    will be used in subsequent message exchange. That''s right, once a secure channel
    is established, SSL uses symmetric encryption because it is much faster than asymmetric
    encryption.


