- img_proc: true
  md: 'Note that the servlet container passes a FilterConfig to the init method. The
    FilterConfig interface is explained below.


    The doFilter method of a Filter instance is called by the servlet container every
    time a resource associated with the filter is invoked. This method receives a
    ServletRequest, a ServletResponse, and a FilterChain.


    Here is the signature of doFilter:


    ```

    void doFilter (ServletRequest request, ServletResponse response,

    FilterChain filterChain)

    ```


    As you can see here, an implementation of doFilter has access to the ServletRequest
    and the ServletResponse. As such, it is possible to add an attribute to the ServletRequest
    or a header to the ServletResponse. You can even decorate the ServletRequest or
    the ServletResponse to change their behavior, as explained in Chapter 13, "Decorating
    Requests and Responses."


    The last line of code in a doFilter method implementation should be a call to
    the doChain method on the FilterChain passed as the third argument to doFilter:


    ```

    filterChain.doFilter(request, response)

    ```


    A resource may be associated with multiple filters (or in a more technical term,
    a chain of filters), and FilterChain.doFilter() basically causes the next filter
    in the chain to be invoked. Calling FilterChain.doFilter() on the last filter
    in the chain causes the resource it be invoked.


    If you do not call FilterChain.doFilter() at the end of your Filter.doFilter()
    implementation, processing will stop there and the request will not be invoked.


    > Note that the doFilter method is the only method in the FilterChain interface.
    This method is slightly different from the doFilter method in Filter. In FilterChain,
    doFilter only take two arguments instead of three.


    The last lifecycle method in Filter is destroy. Here is its signature:


    ```

    void destroy()

    ```


    This method is called by the servlet container before the filter is taken out
    of service, which normally happens when the application is stopped.'
