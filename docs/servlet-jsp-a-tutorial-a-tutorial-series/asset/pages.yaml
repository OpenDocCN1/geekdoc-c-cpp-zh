  md: '# Summary


    In this chapter you’ve learned about session management and four session management
    techniques. URL rewriting and hidden fields are for ‘lightweight’ session tracking,
    suitable for cases where information does not need to span many pages. The other
    two techniques, cookies and HttpSession objects, are more flexible but not without
    limitations. Pay special attention when using HttpSession objects as each of the
    objects consumes server memory.'
