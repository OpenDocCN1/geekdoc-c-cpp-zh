  md: "# Chapter 2: Session Management 57\n\nTo send a cookie to the browser, call\
    \ the **add** method on the **HttpServletResponse:**\n\n```\nHttpServletResponse.addCookie(cookie);\n\
    ```\n\nThe browser sends back the cookies it received from a web server when the\
    \ former sends another HTTP request to the same resource or a different resource\
    \ in the same server.\n\nCookies can also be created and deleted on the client\
    \ side using JavaScript, however this is beyond the scope of this book.\n\nTo\
    \ access a cookie by the browser, use the **getCookies** method on the **HTTPRequest**.\
    \ This method returns a **Cookie** array or null if no cookie is found in the\
    \ request. To find a cookie by a certain name, you have to iterate over the array.\
    \ For example, here is how you read a cookie named **maxRecords:**\n\n```\nCookie[]\
    \ cookies = request.getCookies();\nCookie maxRecordsCookie = null;\nif (cookies\
    \ != null) {\n    for (Cookie cookie : cookies) {\n        if (cookie.getName().equals(\"\
    maxRecords\")) {\n            maxRecordsCookie = cookie;\n            break;\n\
    \        }\n    }\n}\n```\n\nUnfortunately, there is no **getByName** method to\
