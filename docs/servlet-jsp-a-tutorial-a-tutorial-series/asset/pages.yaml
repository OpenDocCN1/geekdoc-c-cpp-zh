  md: '# Chapter 10: Application Design 275


    The DependencyInjector class hard-codes many of its values, including the JDBC
    URL and the database user name and password. In a framework, property values normally
    come from an editable configuration file, which most of the time takes the form
    of an XML document. Let''s keep it simple this time.


    To obtain an object from the DependencyInjector, call its getObject method, passing
    the Class of the expected object. DependencyInjector supports the following types
    in app10e: ProductValidator, ProductDAO, GetProductsAction, and SaveProductAction.
    For example, to get an instance of ProductDAO, you would getObject by passing
    ProductDAO


    ```

    ProductDAO productDAO = (ProductDAO)

    dependencyInjector.getObject(ProductDAO.class);

    ```


    The beauty of DependencyInjector (and all dependency injection frameworks) is
    that the object it returns comes injected with dependencies. If a dependency has
    dependencies, the dependency is also injected with its own dependencies.


    The servlet controller in app10e is given in Listing 10.25. Note that it instantiates
    the DependencyInjector in its init method and calls the DependencyInjector''s
    shutdown method in its destroy method. The servlet no longer creates a dependency
    on its own. Instead, it obtains it from the DependencyInjector.


