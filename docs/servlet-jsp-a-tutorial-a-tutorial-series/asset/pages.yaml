  md: "element to avoid delay in the response for the first request to the servlet,\
    \ caused by the servlet loading to memory. If this element is present and a jsp-file\
    \ element is specified, the JSP file is precompiled into a servlet and the resulting\
    \ servlet is loaded.\n\nload-on-startup is either empty or has an integer value.\
    \ The value indicates the order of loading this servlet when there are multiple\
    \ servlets in the same application. For example, if there are two servlet elements\
    \ and both contain a load-on-startup element, the servlet with the lower load-on-startup\
    \ value is loaded first. If the value of the load-on-startup is empty or a negative\
    \ number, it is up to the web container to decide when to load the servlet. If\
    \ two servlets have the same load-on-startup value, the loading order between\
    \ the two servlets cannot be determined.\n\nDefining run-as overrides the security\
    \ identity for calling an Enterprise JavaBean by that servlet in this application.\
    \ The role name is one of the security rules defined for the current web application.\n\
    \nThe security-role-ref element maps the name of the role reference from a servlet\
    \ using isInRole(name) to the name of a security role defined for the application.\
    \ The security-role-ref element contains an optional description element, a role-name\
    \ element, and a role-link element.\n\nThe role-link element is used to link a\
    \ role reference to a defined security role. The role-link element must contain\
    \ the name of one of the security roles defined in the security-role elements.\n\
    \nThe async-supported element is an optional element that can have a true or false\
    \ value. It indicates whether or not this servlet supports asynchronous processing.\n\
    \nThe enabled element is also an optional element whose value can be true or false.\
    \ Setting this element to false disables this servlet.\n\nFor example, to map\
    \ the security role reference \"PM\" to the security role with role-name \"payingMember,\"\
    \ the syntax would be as follows.\n\n```\n<security-role-ref>\n  <role-name>PM</role-name>\n\
    \  <role-link>payingMember</role-link>\n</security-role-ref>\n```"
