    # Interceptors


    As mentioned earlier, there are a lot of things a filter dispatcher must do. Code
    that would otherwise reside in the filter dispatcher class is modularized into
    interceptors. The beauty of interceptors is they can be plugged in and out by
    editing the Struts 2 configuration file. In fact, Struts 2 achieves a high degree
    of modularity using this strategy. New code for action processing can be added
    without recompiling the main framework.


    Table 18.1 lists Struts 2''s default interceptors. The words in the brackets in
    the Interceptor column are the names used to register the interceptors in the
    configuration file. Yes, as you will see shortly, you need to register an interceptor
    in the configuration file before you can use it. For example, the registered name
    for the Alias interceptor is alias.


    There are quite a number of interceptors, and this can be confusing to a beginner.
    The thing is you don''t have to know about interceptors intimately before you
    can write a Struts 2 application. Just know that interceptors play a vital role
    in Struts.'
