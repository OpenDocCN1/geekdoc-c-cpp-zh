  md: '# # Chapter 15

    Security


    Security is a very important aspect in web application development and deployment.
    This is especially true because web applications are accessible to anyone with
    a browser and access to the world wide web. Securing an application can be done
    declaratively or programmatically. The following four issues are the cornerstones
    of web security: authentication, authorization, confidentiality, and data integrity.


    Authentication is to do with verifying the identity of a web entity, especially
    a user trying to access an application. You normally authenticate a user by asking
    the user for a user name and password.


    Authorization is normally done after authentication is successful and is concerned
    with the access level an authenticated user has. It attempts to answer the question
    “Should an authenticated user be allowed to enter a certain area of the application?”


    Confidentiality is an important topic because sensitive data, such as credit card
    details or social security numbers, should be protected. And, as you may know,
    data is relayed from one computer to another before reaching its destination on
    the Internet. Intercepting it is not technically difficult. As such, sensitive
    data should be encrypted when being transferred over the Internet.


    Since data packets can be easily intercepted, tampering with them is almost as
    easy as those equipped with the right tools and knowledge. Frankly, it is also
    possible to maintain data integrity by making sure sensitive data travel through
    a secure channel.


    You’ll learn about these aspects of security in this chapter. A lengthy discussion
    is also allocated for SSL, which is used as the protocol for creating secure channels
    over the Internet.'
  merge: -1
  pgno: 346
- img_proc: true
  md: '# Authentication and Authorization


    Authentication is the process of examining that someone is really who he/she claims
    to be. In a servlet/JSP application, authentication is normally done by asking
    the user for a user name and password.


    Authorization is concerned with determining what level of access a user has. It
    applies to applications that consists of multiple zones where a user may have
    access to one section of an application but not to the others. For example, an
    online store may be divided into the general sections (for the general public
    to browse and search for products), the buyers section (for registered users to
    place orders), and the admin section (for administrators). Of the three, the admin
    section requires the highest level of access. Not only would admin users be required
    to authenticate themselves, they would also need to have assigned access to the
    admin section.


    Access levels are often called roles. At deployment a servlet/JSP application
    can be conveniently split into sections and configured so that each section can
    be accessed by users in a particular role. This is done by declaring security
    constraints in the deployment descriptor. In other words, declarative security.
    At the other end of spectrum, content restriction is also commonly achieved practically
    by trying to match pairs of user names and passwords with values stored in a database.


    In the majority of servlet/JSP applications authentication and authorization are
    done programmatically by first authenticating the user name and password against
    a database table. Once authentication is successful, authorization can be done
    by checking another table or in the same table that stores user names and passwords.
    Using declarative security saves you some programming because the servlet/JSP
    container takes care of the authentication and authorization processes. In addition,
    the servlet/JSP container can be configured to authenticate against a database
    you''re already using in the application. On top of that, with declarative authentication
    the user name and password can be encrypted by the browser prior to sending them
    to the server. The drawback of declarative security is that the authentication
    method that supports data encryption can only be used with a default login dialog
    whose which look and feel cannot be customized. This reason alone is enough to
    make people walk away from declarative'
