  md: '# HttpServlet


    For every HTTP request, the servlet container creates an instance of HttpServletRequest
    and passes it to the servlet''s service method. The HttpServletRequest encapsulates
    information about the request.


    These are some of the methods in the HttpServletRequest interface.


    ```

    public int getContentLength()

    ```


    Returns the number of bytes in the request body. If the length is not known, this
    method returns -1.


    ```

    public java.lang.String getContentType()

    ```


    Returns the MIME type of the request body or null if the type is not known.


    ```

    public java.lang.String getParameter(java.lang.String name)

    ```


    Returns the value of the requested parameter.


    ```

    public java.lang.String getProtocol()

    ```


    Returns the name and version of the protocol of this HTTP request.


    getParameter is the most frequently used method in HttpServletRequest. A common
    use of this method is to return the value of an HTML form field. You''ll learn
    how you can retrieve form values in the section “Working with Forms” later in
    this chapter.


    getParameter can also be used to get the value of a query string. For example,
    if a servlet is invoked using this URI


    ```

    http://domain/context/servletName?id=123

    ```


    you can retrieve the value of id from inside your servlet using this statement:


    ```

    String id = request.getParameter("id");

    ```


    Note that getParameter returns null if the parameter does not exist.


    In addition to getParameter, you can also use getParameterNames, getParameterMap,
    and getParameterValues to retrieve field names and values as well as query strings.
    See the section “HttpSession” for examples of how to use these methods.'
