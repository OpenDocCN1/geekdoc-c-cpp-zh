  md: '# A Tutorial


    # Servlet & JSP


    Servlet and JavaServer Pages (JSP) are the underlying technologies for developing
    web applications in Java. They are essential for any programmer to master in order
    to effectively use frameworks such as JavaServer Faces, Struts, 2, or Spring MVC.


    Covering Servlet 3.0 and JSP 2.2, this book explains the important programming
