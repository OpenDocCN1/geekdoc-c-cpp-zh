  md: '# Chapter 5

    JSTL


    The JavaServer Pages Standard Tag Library (JSTL) is a collection of custom tag
    libraries for solving common problems such as iterating over a map or collection,
    conditional testing, XML processing, and even database access and data manipulation.


    This chapter discusses the most important tags in JSTL, especially those for accessing
    scoped objects, iterating over a collection, and formatting numbers and dates.
    If you are interested to know more, a complete discussion of all JSTL tags can
    be found in the JSTL Specification document.


    # Downloading JSTL


    JSTL is currently at version 1.2 and defined by JSR-52 expert group under the
    Java Community Process (www.jcp.org). The implementation is available for download
    from java.net:


    ```

    http://jstl.java.net

    ```


    There are two pieces of software you need to download, the JSTL API and the JSTL
    implementation. The JSTL API contains the javax.servlet.jsp.jstl package, which
    consists of types defined in the JSTL specification. The JSTL implementation contains
    the implementation classes. You must copy both jar files to the WEB-INF/lib directory
    of every application utilizing JSTL.'
  merge: -1
  pgno: 132
