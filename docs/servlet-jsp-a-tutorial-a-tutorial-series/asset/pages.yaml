    \n# JSP-Specific Elements\n\nThe jsp-config element under <web-app> contains elements\
    \ specific to JSP. It can have zero or more taglib elements and zero or more jsp-property-group\
    \ elements. The taglib element is explained in the first subsection of this section\
    \ and the jsp-property-group element in the second subsection.\n\n# taglib\n\n\
    The taglib element describes a JSP custom tag library. The taglib element contains\
    \ a taglib-uri element and a taglib-location element.\n\nThe taglib-uri element\
    \ specifies the URI of the tag library used in the servlet/JSP application. The\
    \ value for <taglib-uri> is relative to the location of the deployment descriptor.\n\
