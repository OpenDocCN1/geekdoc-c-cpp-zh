    # Cookies


    URL rewriting and hidden fields are only suitable for retaining information that
    does not need to span many pages. If the information needs to be carried over
    more than a few pages, the two techniques become much harder to implement because
    you have to manage the information for every page. Fortunately, cookies can tackle
    what URL rewriting and hidden fields are not capable of handling.


    A cookie is a small piece of information that is passed back and forth between
    the web server and the browser automatically. Cookies are suitable for information
    that needs to span many pages. Because cookies are embedded as HTTP headers, the
    process of transferring them is handled by the HTTP protocol. Apart from that,
    you can make a cookie live as long or as short as you want. A web browser is expected
    to support up to twenty cookies per web server.


    The downside of cookies is a user can refuse to accept cookies changing his/her
    settings.


    To use cookies, you need to be familiar with the javax.servlet.Cookie class as
    well as a couple of methods in the HttpServletRequest and HttpServletResponse
    interfaces.


    To create a cookie, pass a name and a value to the Cookie class’s constructor:


    ```

    Cookie cookie = new Cookie(name, value);

    ```


    For example, to create a language selection cookie, write this.


    ```

    Cookie languageSelectionCookie = new Cookie("language", "Italian");

    ```


    After you create a Cookie, you can set its domain, path, and maxAge properties.
    The maxAge property is of special interest because it determines when a cookie
    is to expire.'
