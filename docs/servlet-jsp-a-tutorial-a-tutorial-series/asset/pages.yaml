  md: "# Defining A Resource\n\nYou can define a JNDI resource that your application\
    \ can use in your Tomcat context definition. A resource is represented by the\
    \ Resource element under the Context element.\n\nFor instance, to add a DataSource\
    \ resource that opens connections to a MySQL database, add to this Resource element.\n\
    \n```\n<Context [path=\"/appName\"] docBase=\"...\">\n<Resource name=\"jdbc/dataSourceName\"\
    \n    auth=\"Container\"\n    type=\"javax.sql.DataSource\"\n    username=\"...\"\
    \n    password=\"...\"\n    driverClassName=\"com.mysql.jdbc.Driver\"\n    url=\"\
    ...\"\n/>\n\n</Context>\n```\n\nMore information on the Resource element can be\
    \ found here.\nhttp://tomcat.apache.org/tomcat-7.0.doc/indi-resources-howto.html\n\
    \n# Installing SSL Certificates\n\nOnce you receive your certificate and import\
    \ it into your keystore, the next step is to install it on your server. If you're\
    \ using Tomcat, simply copy your keystore in a location on the server and configure\
    \ Tomcat. Then, open your conf/server.xml file and add the following Connector\
    \ element under <service>\n\n```\n<Connector port=\"443\"\n    minSpareThreads=\"\
    5\"\n```"
