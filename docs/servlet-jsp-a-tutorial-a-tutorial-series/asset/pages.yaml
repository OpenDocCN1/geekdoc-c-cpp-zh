    A package element must have the name attribute. The namespace attribute is optional
    and if it is not present, the default value “/” is assumed. The namespace attribute
    has a non-default value, the namespace must be added to the URI that invokes the
    action in the package. For example, the URI for invoking an action in a package
    with a default namespace is:

    /context/actionName.action


    To invoke an action in a package with a non-default namespace, you use this URI:

    /context/namespace/actionName.action


    A package element almost always extends the struts-default package defined in
    struts-default.xml. By doing so, all actions in the package can use the result
