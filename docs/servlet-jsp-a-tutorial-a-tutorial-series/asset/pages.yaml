  md: '# ServletContextListener


    A ServletContextListener responds to the initialization and destruction of the
    ServletContext. When the ServletContext is initialized, the servlet container
    calls the contextInitialized method on all registered ServletContextListener s.
    Its signature is as follows.


    ```

    void contextInitialized(ServletContextEvent event)

    ```


    When the ServletContext is about to be decommissioned and destroyed, the servlet
    container calls the contextDestroyed method on all registered ServletContextListener
    s. Here is the signature of contextDestroyed.


    ```

    void contextDestroyed(ServletContextEvent event)

    ```


    Both contextInitialized and contextDestroyed receive a ServletContextEvent from
    the servlet container. A descendant of java.util.EventObject, the javax.servlet.ServletContextEvent
    class defines a getServletContext method that returns the ServletContext:


    ```

    ServletContext getServletContext()

    ```


    This method is as important as it is the only easy way to access the ServletContext.
    Many ServletContextListeners are there to store an attribute in the ServletContext.


    As an example, consider the app08a application that accompanies this book. The
    AppListener class in Listing 8.1 is a ServletContextListener that places a Map
    containing country codes and names as a ServletContext attribute right after the
    ServletContext is initialized.


