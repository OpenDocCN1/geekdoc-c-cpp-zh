  md: '# 80 Servlet & JSP: Tutorial


    JSP pages run on a JSP container. A servlet container is normally also a JSP container.
    Tomcat, for instance, is a servlet/JSP container.


    The first time a JSP page is requested, a servlet/JSP container does two things:


    +   1. Translate the JSP page into a JSP page implementation class, which is a
    Java class that implements the `javax.servlet.jsp.JspPage` interface or its superinterface
    `javax.servlet.jsp.HttpJspPage`. JSP is a subinterface of `javax.servlet.Servlet`
    and makes every JSP page a servlet. The class name of the generated servlet is
    dependent on the servlet/JSP container. You do not have to worry about this because
    you do not have to work with it directly. If there is a translation error, an
    error message will be sent to the client.

    2. If the translation was successful, the servlet/JSP container compiles the servlet
    class. The container then loads and instantiates the Java bytecode as well as
    performs the lifecycle operations it normally does a servlet.


    For subsequent requests for the same JSP page, the servlet/JSP container checks
    if the JSP page has been modified since the last time it was translated. If so,
    it will be retranslated, recompiled, and executed. If not, the JSP servlet in
    memory is used. This way, the first invocation of a JSP page always takes longer
    than subsequent requests because it involves translation and compilation. To get
    around this problem, you can do one of the following:


    +   * Configure the application so that all JSP pages will be called (and, in
    effect, translated and compiled) when the application starts, rather than at first
    requests.

    * Precompile the JSP pages and deploy them as servlets.


    JSP comes with an API that comprises four packages:


    +   * `javax.servlet.jsp`. Contains core classes and interfaces used by the servlet/JSP
    container to translate JSP pages into servlets.

    JspPage` and `HttpJspPage` interfaces are important members of this package. All
    JSP page implementation classes must implement either `JspPage` or `HttpJspPage`.
    In the HTTP environment, `HttpJspPage` is the obvious choice.'
