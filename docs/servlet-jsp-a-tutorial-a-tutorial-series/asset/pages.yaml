    # Summary


    In this chapter you''ve learned the various listener types that can be found in
    the Servlet API. Those listeners may fall into one of three scopes: application,
    session, and request. Putting listeners to work is straightforward, involving
    a simple registration process. You can register a listener by annotating the implementation
    class using @EventListener or by using the listener element in the deployment
    descriptor.'
