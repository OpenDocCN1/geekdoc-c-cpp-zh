  md: "# 270 Servlet & JSP: A Tutorial\n\n![](img/45889fd1b2eef3ac27c1c5a024fe40c7_279_0.png)\n\
    \nFigure 10.8: The welcome file in app10d\n\nIf you have two components, A and\
    \ B, and A depends on B, you can say A is dependent on B or B is a dependency\
    \ of A. Suppose A has a method, importantMethod(), that uses B as defined in the\
    \ following code fragment:\n\n```\npublic class A {\n    public void importantMethod()\
    \ {\n        B b = ... // get an instance of B\n        b.usefulMethod();\n  \
    \  }\n}\n}\n```\n\nA must obtain an instance of B before it can use B. While it\
    \ is as straightforward as using the new keyword if B is a Java concrete class,\
    \ it can be problematic if B is not and there are various implementations of B.\
    \ You will have to choose an implementation of B and by doing so you"
  merge: -1
  pgno: 279
- img_proc: true
  md: "reduce the reusability of A because you cannot use A with implementations of\
    \ B that you did not choose.\n\nTake the ProductDAO interface in app10d (shown\
    \ in Listing 10.17) as a concrete example. Its implementation, ProductDAOImpl\
    \ in Listing 10.18, depends on the getConnection method of its parent, BaseDAO,\
    \ to obtain a connection. The problem is the connection comes from a JNDI object\
    \ maintained by the container. How do you test ProductDAO outside the container?\
    \ You can't without changing the BaseDAO class. The testability of ProductDAO\
    \ (and all DAO implementations that may be added) has been reduced because of\
    \ its dependency on another object. To test a DAO object in app10d you have to\
    \ first deploy the whole application in a container and use a browser to enter\
    \ values for the DAO object. How much productivity is lost?\n\nWith dependency\
    \ injection each component has its dependencies injected into it and this makes\
    \ testing each component easier. For easier for a class to be used in a dependency\
    \ injection environment, you have to make it inject-ready. One way to do it is\
    \ to create a set method for each dependency. For example, the SaveProductAction\
    \ class in Listing 10.22 and GetProductsAction in 10.23 are part of the app10\
    \ application. What differentiates this class from its predecessors in the previous\
    \ example is that they have a setProductDAO method that a dependency injection\
    \ framework can call to inject a ProductDAO. Injection can also occur through\
    \ a constructor or a class field, but I will stick with set methods in this book.\n\
    \nListing 10.22: The modified SaveProductAction that is inject-ready\n\n```\n\
    package app10e.action;\nimport app10e.dao.DAOException;\nimport app10e.dao.ProductDAO;\n\
    import app10e.model.Product;\n\npublic class SaveProductAction {\n\n    private\
    \ ProductDAO productDAO;\n    public void setProductDAO(ProductDAO productDAO)\
    \ {\n        this.productDAO = productDAO;\n    }\n```"
