  md: '# Chapter 4

    The Expression Language


    One of the most important features in JSP 2.0 was the Expression Language (EL),
    which JSP authors can use to access application data. Inspired by both the ECMAScript
    and the XPath expression languages, the EL is designed to make it possible and
    easy to author script-free JSP pages, that is, pages that do not use JSP declarations,
    expressions, or scriptlets.(Chapter 10, "Servlet/JSP Application Design" explains
    why script-free JSP pages are considered good practice.)


    The EL that was adopted into JSP 2.0 first appeared in the JSP Standard Tag Library
    (JSTL) 1.0 specification. JSP 1.2 programmers could use the language by importing
    the standard libraries into their applications. JSP 2.0 and later developers can
    use the EL without JSTL, even though JSTL is still needed in many applications
    as it also contains other tags not related to the EL.


    The EL in JSP 2.1 and JSP 2.2 is an attempt to unify the EL in JSP 2.0 and the
    expression language defined in JavaServer Faces (JSF) 1.0. JSP is a framework
    for rapidly building web applications in Java and was built on top of JSP 1.2.
    Because JSP 1.2 lacked an integrated expression language and the JSP 2.0 EL did
    not meet all the requirements of JSF, a variant of the EL was developed for JSF
    1.0. The two language variants were later unified. This chapter is only concerned
    with the EL for non-JSF developers.


    # The Expression Language Syntax


    An EL expression starts with ${ and ends with }. The construct of an EL expression
    is as follows:


    ```

    ${expression}

    ```'
  merge: -1
  pgno: 114
- img_proc: true
  md: '# 106 Servlet JSP: A Tutorial


    For example, to write the expression x+y, you use the following construct

    ${x+y}


    It is also common to concatenate two expressions. A sequence of expressions will
    be evaluated from left to right, coerced to Strings, and concatenated. If a+b
    equals 8 and c+d equals 10, the following two expressions produce 810:


    ```

    ${a+b}${c+d}

    ```


    And ${a+b}and${c+d} results in 8and10.


    If an expression is used in an attribute value of a custom tag, the expression
    will be evaluated and the resulting string coerced to the attribute''s expected
    type:

    <my:tag someAttribute="${expression}"/>


    The ${ sequence of characters denotes the beginning of an EL expression. If you
    want to use the literal ${ instead, you need to escape the first character: \$$.


    # Reserved Words


    The following words are reserved and must not be used as identifiers:


    +   and eq gt true instanceof

    oror ne le false empty

    not lt ge null div mod


    # The [ ] and . Operators


    An EL expression can return any type. If an EL expression results in an object
    that has a property, you can use the [] or . operators to access the property.
    The [] and . operators function similarly; [] is a more generalized form, but
    provides a nice shortcut.


    To access an object''s property, you use one of the following forms.


    ```

    ${object["propertyName"]}

    ```'
