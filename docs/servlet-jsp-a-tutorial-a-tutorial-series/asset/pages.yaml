  md: '# Model 2 with A Filter Dispatcher


    While a servlet is the most common controller in a Model 2 application, a filter
    can act as a controller too. Note, however, that a filter does not have the privilege
    to act as a welcome page. Simply typing the domain name won''t invoke a filter
    dispatcher. Struts 2 uses a filter as a controller because the filter is used
    to serve static contents too.


