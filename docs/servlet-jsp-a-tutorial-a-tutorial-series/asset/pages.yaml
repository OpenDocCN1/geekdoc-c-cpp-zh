  md: '# Chapter 9: Filters 217


    Unless a filter class is declared in multiple filter element in the deployment
    descriptor, the servlet container will only create a single instance of each type
    of filter. Since a servlet/JSP application is normally a multi-user application,
    a filter instance may be accessed by multiple threads at the same time and you
    need to handle multi-threading issue carefully. For an example of how to handle
    thread safety, see the Download Counter filter example later in this chapter.


    # Filter Configuration


    After you finish writing a filter class, you still have to configure the filter.
    Filter configuration has these objectives:


    +   * Determine what resources the filter will intercept.

    * Setup initial values to be passed to the filter’s init method.

    * Give the filter a name. Giving a filter name in most cases does not have much
    significance but can sometimes be helpful. For example, you might want to log
    the time a filter starts, and if you have multiple filters in the same application,
    it is often useful to see the order in which the filters are invoked.


    The FilterConfig interface allows you to access the ServletContext through its
    getServletContext method.


    ```

    ServletContext getServletContext()

    ```


    If a filter has a name, the getFilterName method in FilterConfig returns the name.
    Here is the signature of getFilterName.


    ```

    java.lang.String getFilterName()

    ```


    However, you are most often interested in getting initial parameters, which are
    initialization values that the developer or deployer passes to the filter. There
    are two methods you can use to handle initial parameters, the first of which is
    getParameterNames:


    ```

    java.util.Enumeration<java.lang.String> getInitParameterNames()

    ```'
