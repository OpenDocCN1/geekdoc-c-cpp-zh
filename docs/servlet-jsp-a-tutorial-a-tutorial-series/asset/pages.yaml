    # Session Listeners


    There are four HttpSession-related listener interfaces, HttpServletListener, HttpSessionActivationListener,
    HttpSessionAttributeListener, and HttpSessionBindingListener. All these interfaces
    are members of the javax.servlet.http package and are explained in the sections
    below.


    # HttpSessionListener


    The servlet container calls all registered HttpServletListeners when an HttpSession
    is created or destroyed. The two methods defined in HttpServletListener are sessionCreated
    and sessionDestroyed.


    ```

    void sessionCreated(HttpSessionEvent)

    void sessionDestroyed(HttpSessionEvent)

    ```


