  md: '# forward


    The forward action forwards the current page to a different resource. For example,
    the following forward action forwards the current page to the login.jsp page.


    ```

    <jsp:forward page="jspf/login.jsp">

    <jsp:param name="text" value="Please login"/>

    </jsp:forward>

    ```


    Error HandlingError handling is well supported in JSP. Java code be handled using
    the try statement, however you can also specify a page that will be displayed
    should any of the pages in the application encounters an uncaught exception. In
    such events, your users will see a well designed page that explains what happened,
    and not an error message that makes them frown.


    You make a JSP page error by using the isPage attribute of the page directive.
    The value of the attribute must be true. Listing 3.13 shows such an error handler.


    # Listing 3.13: The errorHandler.jsp page


    ```

    <@page isError="true%%

    <html>

    <head><title>Error</title></head>

    <body>

    An error has occurred. <br/>

    Error message:

    <% out.println(exception.toString()); %>

    </body>

    </html>

    ```


    Other pages that need protection against uncaught exceptions will have to use
    the errorPage attribute of the page directive, citing the path to the error handling
    page as the value. For example, the buggy.jsp page in Listing 3.14 uses the error
    handler in Listing 3.13.


    # Listing 3.14: The buggy.jsp page


    ```

    <@page errorPage="errorHandler.jsp%">

    ```'
