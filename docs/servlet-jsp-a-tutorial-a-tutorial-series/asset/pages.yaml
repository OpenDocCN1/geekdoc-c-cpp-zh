  md: "connection pool to a MySQL database named test. The JNDI name for the DataSource\
    \ and the MySQL database is assumed to be in the same computer as the one running\
    \ Tomcat. The user name and password for accessing the database is testurer and\
    \ secret, respectively.\n\n```\n<Context path=\"/app10d\" docBase=\"/path/to/app\"\
    \ reloadable=\"true\"\n  auth=\"Container\">\n  <Resource name=\"jdbc/myDataSource\"\
    \n    type=\"javax.sql.DataSource\"\n    username=\"testurer\"\n    password=\"\
    secret\"\n    driverClassName=\"com.mysql.jdbc.Driver\"\n    url=\"jdbc:mysql://localhost:3306/test\"\
    />\n</Context>\n```\n\nEven though more recent applications tend to use a dependency\
    \ injection framework to manage database connections, many applications today\
    \ still depend on the older method of JNDI lookup, which is why we give it a try\
    \ in the app10d application.\n\n# The Data Access Object (DAO) Pattern\n\nA good\
    \ approach to accessing data in a database is by using a separate module for managing\
    \ the connection and building SQL statements. The DAO design pattern is a simple\
    \ pattern that does this job very well. There are a few variants of this pattern,\
    \ but one of the simplest is depicted in Figure 10.7.\n\nWith this pattern, you\
    \ write a class for each type of object you need to persist. For example, if your\
    \ application needs to persist three types of objects—Product, Customer, and Order—you\
    \ need three DAO classes, each of which takes care of an object type. Therefore,\
    \ you would have the following classes: ProductDAO, CustomerDAO, and OrderDAO.\
    \ The DAO suffix at the end of the class name indicates that the class is a DAO\
    \ class. It is a convention that you should follow unless you have compelling\
    \ reasons not to do so."
