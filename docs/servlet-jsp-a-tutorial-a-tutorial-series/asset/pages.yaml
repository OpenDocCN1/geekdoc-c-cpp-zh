  md: '# Chapter 10

    Application Design


    There are two model used in Java web application design, conveniently called Model
    1 and Model 2. Model 1 is page-centric and suitable for very small applications
    only. Model 2 is the recommended architecture for all the simplest Java web applications.


    This chapter discusses Model 2 in minute detail and provides five Model 2 sample
    applications. The first example features a basic Model 2 application with a servlet
    as controller. The second example is also a simple Model 2 application, however
    it uses a filter as controller. The third example introduces the validator component
    for validating user input. The fourth example shows how you can use the Data Access
    Object pattern to facilitate database access and data manipulation in a Model
    2 application. Finally, the fifth example presents a Model 2 application with
    support for dependency injection.


    # Model 1 Overview


    When you first learn JSP, your sample applications would normally enable navigation
    from one page to another by providing a clickable link to the latter. While this
    navigation method is straightforward, in medium-sized or large applications with
    significant numbers of pages this can cause a maintenance headache. Changing the
    name of a JSP page, for instance, could force you to rename the links to the page
    in many other pages. As such, Model 1 is not recommended unless your application
    will only have two or three pages.'
