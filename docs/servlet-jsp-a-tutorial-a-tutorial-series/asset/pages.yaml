    \ between the new service method and the method in the javax.servlet is that the\
    \ former accepts an HttpServletRequest and an HttpServletResponse, instead of\
    \ a ServletRequest and a ServletResponse.\n\nThe servlet container, as usual,\
    \ calls the original service method in javax.servlet, which in HttpServlet is\
    \ written as follows:\n\n```\npublic void service(ServletRequest req, ServletResponse\
    \ res)\n    throws ServletException, IOException {\n    HttpServletRequest request;\n\
    \    HttpServletResponse response;\n    try {\n        request = (HttpServletRequest)\
    \ req;\n        response = (HttpServletResponse) res;\n    } catch (ClassCastException\
    \ e) {\n        throw new ServletException(\"non-HTTP request or response\");\n\
    \    }\n    service(request, response);\n}\n```\n\nThe original service method\
    \ downcasts the request and response objects from the servlet container to HttpServletResponse,\
    \ respectively, and calls the new service method. The downcasting is always successful\
    \ because the servlet container always passes an HttpServletRequest and an HttpServletResponse\
    \ when calling a servlet's service method to anticipate the use of HTTP. Even\
    \ if you are implementing javax.servlet.GenericServlet or extending javax.servlet.GenericServlet,\
