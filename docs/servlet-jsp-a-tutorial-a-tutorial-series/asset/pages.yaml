  md: '# Chapter 6

    Writing Custom Tags


    In Chapter 5, "JSTL," you learned how to use custom tags in JSTL. The libraries
    in JSTL provide tags for solving common problems, but if your problems are not
    so common, you will have to write your own custom tags by extending a member of
    the javax.servlet.jsp.tagext package. This chapter teaches you how.


    # Custom Tag Overview


    Using JSP standard actions to access and manipulate JavaBeans was the first attempt
    to allow separation of presentation (HTML) and business logic implementation (Java
    code). However, standard actions were not powerful enough that using them alone
    developers would often still have to resort to Java code in JSP pages. For example,
    standard actions cannot be used to iterate over a collection the way the JSTL
    for tag can.


    In recognition of the imperfection of JavaBeans as a solution to separation of
    presentation and business logic, JSP 1.1 defined custom tags. Custom tags offer
    benefits that are not present in JavaBeans. Among others, custom tags have access
    to JSP implicit objects and can have attributes.


    Using custom tags enables you to write script-free JSP pages, custom tags in JSP
    1.1 and 1.2, called the classic custom tags, were notoriously hard to write. JSP
    2.0 added two new features that made writing them easier. The first feature was
    a new interface called SimpleTag, which is discussed in this chapter. The second
    feature was a mechanism to write custom tags as tag files. Tag files are explained
    in Chapter 7, "Tag Files."'
  merge: -1
  pgno: 170
