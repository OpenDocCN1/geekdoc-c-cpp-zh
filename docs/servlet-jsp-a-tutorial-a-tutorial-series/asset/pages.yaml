    # Functions


    In addition to custom actions, JSTL 1.1 and 1.2 define a set of standard functions
    you can use in EL expressions. These functions are grouped in the function tag
    library. To use the functions, you must use the taglib directive on top of your
    JSP.


    ```

    <@ taglib uri="http://java.sun.com/jsp/jstl/functions"

    prefix="fn" %>

    ```


    To invoke a function, you use an EL in this format:

    $(fn:functionName)


    where functionName is the name of the function.


    Most of the functions are for string manipulation. For instance, the length function
    works for both strings and collections, returning the number of items in a collection
    or array or the number of characters in a string.


    All these functions are described in the sections to follow.


    # The contains Function


    The contains function tests whether a string contains the specified substring.
    The return value is true if the string contains the substring, and false otherwise.
    Its syntax is as follows:


    ```

    contains(string, substring).

    ```


    For example, both of these EL expressions return true:


    ```

    <c:set var="my" value="Hello World"/>

    ```'
