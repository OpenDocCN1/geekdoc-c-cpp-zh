  md: 'Appendix C: SSL Certificates 435


    # # Getting Certified


    While you can use Keytool to generate pairs of public and private keys and self-signed
    certificates, your certificates will only be trusted by people who already know
    you. To get more acceptance, you need your certificates signed by a certificate
    authority (CA), such as VeriSign, Entrust or Thawave.


    If you intend to do this, you need to generate a Certificate Signing Request (CSR)
    by using the -certreq argument of Keytool. Here is the syntax:


    ```

    keytool -certreq -alias alias -file certregFile

    ```


    The input of this command is the certificate referenced by alias and the output
    is a CSR, which is the file whose path is specified by certregFile. Send the CSR
    to a CA and they will authenticate you offline, normally asking you to provide
    valid ideal identification details, such as a copy of your passport or driver''s
    license.


    If the CA is satisfied with your credentials, they will send you a new certificate
    or a certificate chain that contains your public key. This new certificate is
    used to replace the existing certificate chain you sent (which was self-signed).
    Once you receive the reply, you can import your new certificate into a keystore
    by using the importcert argument of Keytool.


    # # Importing a Certificate into the Keystore


    If you receive a signed document from a third party or a reply from a CA, you
    can store it in a keystore. You need to assign an alias you can easily remember
    to this certificate.


    To import or store a certificate into a keystore, use the importcert argument.
    Here is the syntax.


    ```

    keytool -importcert -alias anAlias -file filename

    ```


    As an example, import the certificate in the file joeCertificate.cer into the
    keystore and give it the alias brotherJoe, you use this:


    ```

    keytool -importcert -alias brotherJoe -file joeCertificate.cer

    ```'
  merge: -1
  pgno: 444
- img_proc: true
  md: 'The advantages of storing a certificate in a keystore is twofold. First, you
    have a centralized store that is password protected. Second, you can easily authenticate
    a signed document from a third party if you have imported the certificate in a
    keystore.


    # Exporting a Certificate from the Keystore


    With your private key you can sign a document. When you sign the document, you
    make a digest of the document and then encrypt the digest with your private key.
    You then distribute the document as well as the encrypted digest.


    For others to authenticate the document, they must have your public key. For security,
    your public key needs to be signed too. You can self-sign it or you can get a
    trusted certificate issuer to sign it.


    The first thing to do is extract your certificate from a keystore and save it
    as a file. Then, you can easily distribute the file. To extract a certificate
    from a keystore, you need to use the `-exportcert` argument and pass the alias
    and the name of the file to contain your certificate. Here is the syntax:

    `keytool -exportcert -alias anAlias -file filename`


    A file containing a certificate is typically given the `.cer` extension. For example,
    to extract a certificate whose alias is Meredith and save it to the mereredithcertificate.cer
    file, you use this command:

    `keytool -exportcert -alias Meredith -file mereredithcertificate.cer`


    # Listing Keystore Entries


    Now that you have a keystore to store your private keys and the certificates of
    parties you trust, you can enquiry its content by listing it using the keystore
    program. You do it by using the `list` argument.


    ```

    keytool -list -keystore myKeyStore -storepass myPassword

    ```


    Again, the default keystore is assumed if the keystore argument is missing.'
  merge: -1
