  md: '# # Chapter 2

    Session Management


    Session management or session tracking is a very important topic in web application
    development. This is due to the fact that HTTP, the language of the web, is stateless.
    A web server by default does not know if an HTTP request comes from a first time
    user or from someone who has visited it before.


    For example, a webmail application requires its users to log in before they can
    check their emails. However, once a user types the correct user name and password,
    the application should not prompt the user to log in again to access different
    parts of the application. The application needs to remember which users have successfully
    logged in. In other words, it must be able to manage user sessions.


    This chapter explores four techniques you can use to retain states: URL rewriting,
    hidden fields, cookies, and the HttpSession objects. The samples presented in
    this chapter are part of the app02a application.


    # ## URL Rewriting


    URL rewriting is a session tracking technique whereby you add a token or multiple
    tokens as a query string to a URL. The token is generally in key=value format:


    ```

    url?key-1=value-1&key-2=value-2 ... &key-n=value-n

    ```


    Note that the URL and the tokens are separated by a question mark. Two tokens
    are separated by an ampersand character (&).


    URL rewriting is suitable if the tokens do not have to be carried around across
    too many URLs. The drawbacks of using URL rewriting include'
