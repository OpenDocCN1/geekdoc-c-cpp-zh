  md: 'In this application, as is the case for most Model 2 applications, you need
    to prevent the JSP pages from being accessed directly from the browser. There
    are a number of ways to achieve this, including:


    +   - Putting the JSP pages under WEB-INF. Anything under WEB-INF or a subdirectory
    under WEB-INF is protected. If you put your JSP pages under WEB-INF you cannot
    access them directly from the browser, but the controller can still dispatch requests
    to those pages. However, this is not a recommended approach since as not all containers
    implement this feature.


    +   - Using a servlet filter and filter out requests for JSP pages.


    +   - Using security restriction in the deployment descriptor. This is easier
    than using a filter since you do not have to write a filter class. This method
    is chosen for this application.


    # Testing the Application


    Assuming you are running the application on your local machine on port 8080, you
    can invoke the application using the following URL:


    ```

    http://localhost:8080/app10a/product_input

    ```


    You will see something similar to Figure 10.2 in your browser.


    When you submit the form, the following URL will be sent to the server:


    ```

    http://localhost:8080/app10a/product_save

    ```


    Using a servlet controller allows you to use the servlet as a welcome page. This
    is an important feature since you can then configure your application so that
    the servlet controller will be invoked simply by typing your domain name (such
    as http://example.com) in the browser''s address box. You can''t do this with
    a filter.'
