    # doBody


    The doBody standard action can only be used from inside a tag file. You use it
    to invoke the body of a tag. You''ve seen doBody action in the tag file in Listing
    7.11. In this section you''ll learn about doBody in more detail.


    The doBody action can have attributes. You use these attributes if you want to
    direct the output of the tag invocation to a variable. If used without an attribute,
    the doBody standard action writes the output to the JspWriter of the calling JSP
    page.


    The doBody standard action’s attributes are given in Table 7.6. All attributes
    are optional.'
