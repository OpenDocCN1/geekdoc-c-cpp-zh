  md: '# The global-results Element


    A package element may contain a global-results element that contains results that
    act as general results. If an action cannot find a matching result under its action
    declaration, it will search the global-results element, if any.


    Here is an example of the global-results element.


    ```

    <global-results>

    <result name="error">/jsp/GenericErrorPage.jsp</result>

    <result name="login" type="redirect-action">Login</result>

    </global-results>

    ```


    # The Interceptor-related Elements


    There are five interceptor-related elements that may appear in a struts.xml file:
    interceptors, interceptor, interceptor-ref, interceptor-stack, and default-interceptor-ref.
    They are explained in this section.


    An action element must contain a list of interceptors that will process the action
    object. Before you use an interceptor, however, you have to register it using
    an interceptor element under <interceptors>. Interceptors defined in a package
    can be used by all actions in the package.


    For example, the following package element registers two interceptors, validation
    and logger.


    ```

    <package name="main" extends="struts-default">

    <interceptors>

    <interceptor name="validation" class="..."/>

    <interceptor name="logger" class="..."/>

    </interceptors>

    </package>

    ```


    To apply an interceptor to an action, use the interceptor-ref element under the
    action element of that action. For instance, the following configuration registers
    four interceptors and apply them to the Product_delete and Product_save actions.


    ```

    <package name="main" extends="struts-default">

    <interceptors>

    <interceptor name="alias" class="..."/>

    <interceptor name="i18n" class="..."/>

    ```'
