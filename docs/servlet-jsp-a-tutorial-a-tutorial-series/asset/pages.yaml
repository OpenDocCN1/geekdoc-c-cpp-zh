    secret\" roles=\"manager,member\"/>\n  <user username=\"jerry\" password=\"secret\"\
    \ roles=\"member\"/>\n</tomcat-users>\n```\n\nThe tomcat-users.xml file is an\
    \ XML document having the tomcat-users root element. Within it are role and user\
    \ elements. The role element defines"
