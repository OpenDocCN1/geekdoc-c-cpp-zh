  md: '# 340 Servlet & JSP: A Tutorial


    a role and the user element defines a user. The role element declares a rolename
    attribute that specifies the name of the role. The user element has username,
    password, and roles attributes. The username attribute specifies the user name,
    the password attribute the password, and the roles attribute the role or roles
    user belongs to.


    The tomcat-users.xml file in Listing 15.1 declares two roles (manager and member)
    and two users (tom and jerry). User tom is a member of both the member and manager
    roles whereas jerry only belongs to the member role. It is obvious that tom has
    more access to the application than jerry.


    Tomcat also supports matching roles and users against database tables. You can
    configure Tomcat to use JDBC to authenticate users.


    # Imposing Security Constraints


    You have learned that you can hide static resources and JSP pages by storing them
    under WEB-INF or a directory under it. A resource placed here cannot be accessed
    directly by typing its URL, but can still be a forward target from a servlet or
    JSP page. While this approach is simple and straightforward, the drawback is resources
    hidden here are hidden forever. There''s no way to access them directly. If you
    simply want to protect resources from unauthorized users, you can put them in
    a directory under the application directory and declare a security constraint
    in the deployment descriptor.


    The security-constraint element specifies a resource collection and the role or
    roles that can access the resources. This element can have two subelements, web-resource-collection
    element and auth-constraint.


    The web-resource-collection element defines a collection of resources and can
    have any of these subelements: web-resource-name, description, url-pattern, http-method,
    and http-method-omission.


    The web-resource-collection element can have multiple url-pattern subelements,
    each of refers to a URL pattern to which the containing security constraint applies.
    You can use an asterisk in the url-pattern element to refer to either a resource
    type (such as *.jsp) or all resources in a directory (such as /* or /jsp/*). However,
    you cannot combine both, i.e. refer to a specific type in a specific directory.
    Therefore,'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# Chapter 15: Security 341


    the following URL pattern meant to refer to all JSP pages in the jsp directory
    is invalid: /jsp/*.jsp. Instead, use /jsp/*, but this will also restrict any non-JSP
    pages in the jsp directory.


    The http-method element names an HTTP method to which the enclosing security constraint
    applies. For example, a web-resource-collection element with a GET http-method
    element indicates that the web-resource-collection element applies only to the
    HTTP Get method. The security constraint that contains the resource collection
    does not protect against other HTTP methods such as Post and Put. The absence
    of the http-method element identifies the security constraint access across all
    HTTP methods. You can have multiple http-method elements in the same web-resource-collection
    element.


    The http-method-omission element specifies an HTTP method that is not included
    in the encompassing security constraint. Therefore, specifying <http-method-omission>GET</http-method-omission>
    restricts access to all HTTP methods except Get.


    The http-method element and the http-method-omission element cannot appear in
    the same web-resource-collection element.


    You can have multiple security-constraint elements in the deployment descriptor.
    If the auth-constraint element is missing from a security-constraint element,
    the resource collection is not protected. In addition, if you specify a role that
    is not defined by the container, no one will be able to access the resource collection
    directly. However, you can still forward to a resource in a servlet or JSP page.


