    servletName, java.lang.String className)

    ```


    To create or add a listener, the class passed to the first addListener method
    must implement one or more of the following interfaces:


    +   - ServletContextListener

    - ServletRequestListener

    - ServletRequestAttributeListener

    - HttpSessionListener

    - HttpSessionAttributeListener


    If the ServletContext was passed to a ServletContextInitializer''s onStartup method,
    the listener class may also implement ServletContextListener. For information
    about the onStartup method and the ServletContextInitializer interface, see the
    section below.


    The return value of the addFilter or addServlet is either a FilterRegistration.Dynamic
    or a ServletRegistration.Dynamic.


    Both FilterRegistration.Dynamic and ServletRegistration.Dynamic are subinterfaces
    of Registration.Dynamic. FilterRegistration.Dynamic allows you to configure a
    filter and ServletRegistration.Dynamic a servlet.'
