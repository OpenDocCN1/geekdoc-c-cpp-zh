  md: '# # Chapter 12

    File Download


    A static resource, such as an image or an HTML file, can be downloaded by simply
    pointing the browser at the right URL. As long as the resource is located in the
    application directory or a subsubdirectory under it and not under WEB-INF, the
    servlet/JSP container will send the resource to the browser. However, sometimes
    a static resource is stored outside the application directory or in a database,
    or sometimes you want to control who can see it and prevent other websites from
    cross-referencing it. In any of these scenarios applies to you, then you have
    to send the resource programmatically.


    In short, programmatic file download lets you selectively send a file to the browser.
    This chapter explains what it takes to programmatically send a resource to the
    browser and presents two examples.


    # # File Download Overview


    To send a resource such as a file to the browser, you need to do the following
    in your servlet. It is uncommon to use JSP pages as you''re sending a binary and
    there''s nothing to display in the browser.


    +   1. Set the response''s content type to the file''s content type. The Content-Type
    header specifies the type of data in the body of an entity and consists of the
    media type and subtype identifiers. Visit http://www.iana.org/assignments/media-types
    for standard content types. If you do not know what the content type is or you
    want the browser to always display the Save As dialog, set it to APPLICATION/OCTET-STREAM.
    This value is not case sensitive.'
  merge: -1
  pgno: 310
- img_proc: true
  md: '# 302 Servlet & JSP: A Tutorial


    2. Add an HTTP response header named Content-Disposition and give it the value
    attachment; filename=fileName, where fileName is the default file name that appears
    in the File Download dialog box. This is normally the same name as the file, but
    does not have to be so.


    For this instance, code sends a file to the browser.


    ```

    InputStream fis = new FileInputStream(file);

    BufferedInputStream bis = new BufferedInputStream(fis);

    byte[] bytes = new byte[bis.available()];

    response.setContentType(contentType);

    OutputStream os = response.getOutputStream();

    bis.read(bytes);

    os.write(bytes);

    ```


    # Warning


    Make sure you do not inadvertently send any characters other than the actual file
    content. This could happen without your realizing it. For example, if you need
    to use the page directive in a JSP page, you might write the directive like this:


    ```

    <@ page import="java.io.FileInputStream%>

    <jsp:useBean id="DBBeanId" scope="page" class="MyBean" />

    ```


    Without realizing it, the carriage return at the end of the page directive will
    be sent to the browser. To prevent extra characters from being sent, write the
    directive as follows:


    ```

    <@ page import="java.io.FileInputStream%>

    <jsp:useBean id="DBBeanId" scope="page" class="MyBean" />

    ```


    It looks unusual, but it helps.


    # Example 1: Hiding A Resource


    The app12a application demonstrates how to send a file to the browser. In this
    application we employ a FileDownload servlet to send a'
