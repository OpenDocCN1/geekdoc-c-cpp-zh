  md: '# # Chapter 3

    # JavaServer Pages


    You learned in Chapter 1, “Servlets” that there are two drawbacks servlets are
    not capable of overcoming. First, all HTML tags in a servlet must be enclosed
    in Java strings, making sending HTTP response a tedious effort. Second, all text
    and HTML tags are hardcoded; as such, even minor changes to the presentation layer,
    such as changing a background color, require recompilation.


    JavaServer Pages (JSP) solves the two problems in servlets. JSP does not replace
    Servlet, Rather, it complements it. Modern Java web applications use both servlets
    and JSP pages. The latest version of JSP at the time of writing is 2.2.


    This chapter starts with an overview of JSP and discusses in detail comments in
    JSP pages, implicit objects, and the three syntactic elements (directives, scripting
    elements, and actions). Error handling is covered towards the end of this chapter.


    JSP can be written in standard syntax or XML syntax. JSP pages written in XML
    syntax are called JSP documents. JSP in XML syntax is very rarely used and is
    not covered here. In this chapter you learn JSP in standard syntax.


    # # An Overview of JSP


    A JSP page is essentially a servlet. However, working with JSP pages is easier
    than servlets for two reasons. First, you do not have to compile JSP pages. Second,
    JSP pages are basically text files with jsp extension and you can use any text
    editor to write them.'
