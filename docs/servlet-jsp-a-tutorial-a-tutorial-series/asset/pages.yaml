    of buffer overflow.


    +   - **isThreadSafe**. Indicates the level of thread safety implemented in the
    page. JSP authors are advised against using this attribute as it could result
    in a generated servlet containing deprecated code.


    +   - **info**. Specifies the return value of the **getServletInfo** method of
    the generated servlet.


    +   - **errorPage**. Indicates that the page will handle errors that may occur
