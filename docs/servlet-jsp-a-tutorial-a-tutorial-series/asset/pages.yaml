  md: '# A Model 2 Application with Database Access


    The app10d application is an example of Model 2 with database access, it was built
    on top of the previous example (app10c) to access a MySQL database called test
    containing a products table. The revised application also has an additional action,
    product_list, that displays all products in the database. In addition, it comes
    with a web.xml file that declares a welcome page.


    The SQL statement for creating the database and the table is given in Listing
    10.11.


    # Listing 10.11: The SQL statement for creating the database and the table


    ```

    CREATE DATABASE /*!32312 IF NOT EXISTS*`test` /*!40100 DEFAULT

    CHARACTER SET latin1 */;\nUSE `test`;

    DROP TABLE IF EXISTS `products`;


    CREATE TABLE `products` (

    `id` int(11) NOT NULL auto_increment,

    `name` varchar(255) NOT NULL,

    `description` varchar(1000) default NULL,

    `price` decimal(10,0) NOT NULL,

    PRIMARY KEY (`id`)

    ) ENGINE=MyISAM AUTO_INCREMENT=6 DEFAULT CHARSET=utf8;

    ```


    A DAO module has been added to app10d and this module consists of the following
    interfaces and classes.


    +   - The DAO interface in Listing 10.12, which all DAO interfaces are derived
    from.

    - The BaseDAO class in Listing 10.13, which provides basic implementation for
    all DAO classes.

    - The DataSourceCache class in Listing 10.14, a utility class that looks up the
    container-managed DataSource and caches it.

    - The DAOFactory class in Listing 10.15, a factory class that creates various
    DAO implementations.

    - The DAOException class in Listing 10.16 that a DAO method throws in the event
    of a runtime exception.'
