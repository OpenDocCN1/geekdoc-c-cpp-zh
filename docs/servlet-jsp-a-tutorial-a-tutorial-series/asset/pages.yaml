  md: "# 368 Servlet &amp; JSP: A Tutorial\n\n# context-param\n\nThe context-param\
    \ element passes values to the ServletContext. These values can be read from servlet/JSP\
    \ page. This element contains a name/value pair that can be retrieved by calling\
    \ the getInit method on the ServletContext. You can have multiple context-param\
    \ elements as long as the parameter names are unique throughout the application.\
    \ ServletContext.getInitParameterNames() returns all ServletContext parameter\
    \ names.\n\nThe context-param element must contain a param-name element and a\
    \ param-value element. The param-name element contains the parameter name, and\
    \ the param-value element contains the parameter value. Optionally, a description\
    \ element also be present to describe the parameter.\n\nThe following are two\
    \ example context-param elements.\n\n```\n<context-param>\n  <param-name>location</param-name>\n\
    \  <param-value>localhost</param-value>\n</context-param>\n<context-param>\n \
    \ <param-name>port</param-name>\n  <param-value>8080</param-value>\n  <description>The\
    \ port number used</description>\n</context-param>\n```\n\n# distributable\n\n\
    If present, the distributable element indicates that the application is written\
    \ to be deployed into a distributed servlet/JSP container. The distributable element\
    \ must be empty. For example, here is a distributable element.\n\n```\n<distributable/>\n\
    ```\n\n# error-page\n\nThe error-page element contains a mapping between an HTTP\
    \ error code to a resource path or between a Java exception type to a resource\
    \ path. The error-page element dictates the container that the specified resource\
    \ should be returned in the event of the HTTP error or if the specified exception\
    \ is thrown."
  merge: -1
