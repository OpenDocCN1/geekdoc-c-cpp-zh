    import pi`，并尝试执行 `dir(math)` 或 `help(math)` 函数，它将不起作用，因为 Python 只有 `pi` 而没有整个模块供其调用。


    你通常会在 Python 提示符中使用 `help()` 和 `dir()` 进行快速查找，而不是在编写应用程序时。使用 `from` 更高效，因为你只引入了你需要的内容。


    你还可以通过在命令末尾列出逗号分隔的名称，从包中导入多个项。假设你的应用程序中需要 `pi` 和平方根。例如，你可以使用以下语法仅将这些导入到你的程序中：


    ```python

    from math import pi, sqrt

    ```


    再次强调，因为你使用了 `from` 语法进行导入，你可以在代码中直接通过名称引用 `pi` 和 `sqrt()`，而无需前导模块名。例如，在执行 `from`
    语句后，执行以下代码：


    ```python

    print(sqrt(pi))

    ```


    将显示如下内容，正如你可能猜到的一样，这是数字 pi 的平方根：


    ```

    1.7724538509055159

    ```


    你可能还会看到这样导入模块：


    ```python

    from math import *

    ```


    星号是“所有”的缩写。所以本质上，该命令与 `import math` 相同，后者也会导入整个 `math` 模块，但存在细微的差别。使用 `from math
    import *` 命令会自动将模块中常量和函数的名称与该 `math` 模块关联。你不再需要在随后的代码中使用 `math` 前缀。换句话说，在你执行了以下操作后：


    ```python

    from math import *

    ```


    你可以执行类似 `print(pi)` 的命令，它将运行，即使不使用 `print(math.pi)`。尽管这种方法看起来聪明又方便，但许多程序员认为它并不
    Pythonic（符合 Python风格）。如果你正在导入很多模块并使用了每个模块的许多不同部分，在代码中避免模块名称会让其他程序员难以阅读和理解代码。


    以上是关于 Python 库、包和模块的内容。这三者都代表了他人编写的代码，你允许在你编写的任何 Python 代码中使用它们。唯一的真实区别在于大小。一个库可能包含几个包，一个包可能包含几个模块，而模块通常包含函数、类或其他你可以自由使用的预写代码块。


    # 第 14 章

    # Python 的十个最核心方面


    能够编写 Python 程序对于现代工程、科学和商业领域的的职场人士来说是一项非常重要的技能。现在有许多人工智能 (AI)、数据科学、数据分析以及控制各种设备和机器人的新工具可用。Python
    正在迅速成为首选编程语言。在本章中，我们将介绍 Python 的十个最核心的方面。


    # 符合 Python 风格（Being Pythonic）


    Python 语言易于学习但难精通。流练并高效使用 Python 语言的道路在于实践。你写的代码越多，你写代码的能力就越强。在 Python 中，仅仅让程序运行起来是不够的——如何实现它也同样重要。这就是我们所说的“Pythonic”。如果你的
    Python 代码难以阅读且复杂，那么你并没有遵循 Python 风格。


    Python 的设计目标是让你写出清晰的代码。清晰的代码并不意味着简洁——它可能有更多的语句——但代码的流程和意图将显而易见。


    美优于丑陋。显式优于隐式。简单优于复杂。可读性很重要。这些都是符合 Python 风格的一些规则。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_181_0.png)


    # 识别缩进的重要性


    Python 使用缩进来显示代码的控制和结构。为什么使用缩进而不是大括号？为了消除冗余（你本来已经在用大括号时做了缩进了！）并让代码更整洁。这对我们来说非常非常
    Pythonic！过了一段时间后，使用缩进将变成你的本能。


    噢，为了引发一个真正的争议，我们建议使用空格而不是制表符（tabs）来进行缩进！养成这个习惯。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_181_1.png)


    # 理解 Python 语法


    Python 语言在整个语言中具有非常一致的语法流。掌握基本语法（参见第 3 章）将以自然的方式开启 Python 语言的所有部分。


    # 欣赏 Python 变量的灵活性


    Python 变量可以几乎任何内容。它们像 C 语言中一样是强类型的（例如，你将 C 变量声明为整数）。相反，它们是动态类型。换句话说，Python 变量可以是你希望的任何类型。在对变量进行数学运算时，记住这一点非常重要——你不能将整数加到字符串变量上。


    # 将列表视为朋友


    列表是 Python 中最重要的复合数据类型。它们允许你同时存储和操作整个项目集合。理解并使用列表是进入 Python 在 AI、机器人和数据科学领域某些重要应用的关键入口。


    # 控制你的程序


    Python 程序并不仅仅在代码列表上单向向下运行。编程应用程序需要你对如何处理数据做出决策（`if` 语句）、执行操作的次数（`for` 和 `while`
    语句）以及如何遍历列表变量中的所有数据。


    # 理解 Python 函数


    组织代码和重用 Python 代码段是非常 Pythonic 的做法，并且对于提高你的编码效率和清晰度非常有帮助。如果你在代码的多个地方执行相同的操作，最好将代码放入函数中，这样如果你需要更改它，你只需要看一个地方。这种方法也让你的代码更容易阅读和维护。


    # 解决错误


    对于初学者来说，Python 最令人恼的方面之一是 Python 默认错误报告的相对晦涩。幸运的是，有很多方法可以提高你代码生成的错误的可读性，并提高 Python
    本身生成的错误的可读性。理解异常和错误将极大提升你的 Python 体验。


    # 使用他人的模块


    如果没有庞大的程序员社区生成你可以导入到 Python 并在程序中使用模块，Python 将一一无所有。有成千上万的预写模块可以帮助你的应用程序。需要矩阵运算？那里有。需要处理图像？那里有。想尝试机器学习？那里有。而且大多数模块都有良好的文档且易于使用。


    # 在遇到问题时使用网络和 AI


    网络搜索和 AI（如 ChatGPT 和 Microsoft Copilot）不仅在你学习 Python 时，而且在你实际开发应用程序时你的好朋友。它们是你获取完成应用程序特定任务的示例和文档的绝佳来源。使用它们。你并没有被
    AI 工具取代——你只是变得更高效了。


