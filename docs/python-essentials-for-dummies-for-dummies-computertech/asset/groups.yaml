    # Chapter 11

    Juggling JSON Data


    JavaScript Object Notation (JSON) is a common marshall format for object-oriented
    data. Marshalling format generally means a format used to send data from one computer
    to another. However, some databases, such as the free Realtime Database at Google''s
    Firebase, store the data in JavaScript Object Notation format as well. The name
    JavaScript at the front sometimes throws people off, especially when you''re using
    Python, not JavaScript, to write your code. But don''t worry. The format just
    got its start in the JavaScript world and is now widely known general-purpose
    format used with all kinds of computers and programming languages.


    In this chapter, you learn exactly what JSON is, as well as how to export and
    import data to and from JSON. If you find that all the buzzwords surrounding JSON
    make you uncomfortable, again, don''t worry. We get through all the jargon first.
    As you''ll see, JSON data is formatted almost the same way as Python dictionaries,
    so there won''t be a lot of new stuff to learn. Also, you already have the free
    Python JSON module, which makes it even easier to work with JSON data.


    CHAPTER 11 Juggling JSON Data 129'
