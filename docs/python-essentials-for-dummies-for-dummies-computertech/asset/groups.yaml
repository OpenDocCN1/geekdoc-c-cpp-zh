    # Opening and Closing Files


    To open a file from a Python app, use this syntax:


    ```

    open(filename.ext[,mode])

    ```


    Replace filename.ext with the name of the file you want to open. If the file is
    not in the same directory as your Python code, you need to specify a path to the
    file. For example, if you''re using Windows and you want to open the foo.txt on
    your desktop and your user account is Alan, you''d use the path C:/Users/Alan/Desktop/foo.txt
    rather than the more common Windows syntax with backslashes (C:\Users\Alan\Desktop\foo.txt).


    The mode is optional (as indicated by the square brackets). Use it to specify
    what kind of access you want your app to have, using the following single-character
    abbreviations:


    +   >> r: (Read): Opens the file but does not allow Python to make any changes.
    This is the default mode and if you use you


