    - Beautiful is better than ugly.

    - Explicit is better than implicit.

    - Simple is better than complex.

    - Complex is better than complicated.

    - Flat is better than nested.

    - Sparse is better than dense.

    - Readability counts.

    - Special cases aren''t special to break the rules.

    - Although practically beats purity.

    - Errors never pass silently.

    - In the face of ambiguity, refuse to guess.

    - There should be one—and preferably one—obvious way to do.

    - Now is better than now.

    - Although never is better than right.

    - If the Implementation is hard to explain, it''s a bad idea.

    - If the Implementation is easy to explain, it may be a good idea.

    - Names are one honking great idea --- that''s more of!


