    \ = soup.article\n```\n\n![](img/ca342ce31cd39db62dca2143d5fa4229_166_0.png)\n\
    \n## Storing the parsed content\n\nWhen scraping a web page, your goal is typically\
    \ to collect specific data of interest. In this case, we want just the URL, image\
    \ source, and the text for a number of links. We know there will be more than\
    \ one line. An easy way to store these is to put them in a list, so in the following\
    \ code, we create an empty list `links_list`:\n\n```python\n# Create an empty\
    \ list to hold a dictionary item.\nlinks_list = []\n```\n\nNext the code needs\
    \ to loop through each tag in the page content. Each link starts with an `<a>`\
    \ tag and ends with an `</</a>` tag. To tell Python to loop through each link\
    \ individually, use the `find_all` method of BeautifulSoup in a loop. In the following\
    \ code, as we loop through the links, we assign the current link to a variable\
    \ named:\n\n```python\n# Loop through all the links in the article.\nfor link\
    \ in content.find_all('a'):\n```\n\nEach link's code will look something like\
    \ this, though each will have a unique URL, image source, and text:\n\nThe three\
    \ items of data we want are as follows:\n\n- Link URL, which is enclosed in quotation\
