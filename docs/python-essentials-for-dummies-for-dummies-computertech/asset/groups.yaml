    # About the Authors


    John Shovic: John has been working with software. Currently he is appointed the
    computer science faculty member, specializing in robotics and artificial intelligence,
    at the University of Idaho in Coeur''Alene, where he is surrounded by a bunch
    of students who are excited about technology and computers.


    Alan Simpson: Alan is the author of more than 100 books on databases, programming,
    and web development. His books have been published throughout the world in more
    than a dozen languages and have sold millions of copies. Alan left the writing
    a few years ago to get out of the ivory tower and into the real world, first as
    a developer and now as a manager of the team in his IT department. Alan has been
    called a “master communicator” throughout his extensive career, and his online
    courses and YouTube videos continue to get rave reviews from his many followers.


    # Dedication


    John Shovic: To my wife, Laurie. She has supported me in many ways including making
    my socks match in the morning, as well as keeping my plant alive. Thank you!


    Alan Simpson: To Susan, Ashley, and Alec.


    # Authors’ Acknowledgments


    John Shovic: I would like to thank the wonderful staff at Wiley and give full
    credit to my co-author, Alan. Our technical reviewer, Rod Stephens, did an excellent
    and thorough job. Thanks to my literary agent Carol Jelen for encouraging me to
    pursue writing this book. I would like to specifically thank the University of
    Idaho for their support and suggestions, especially to Dr. Bob Rinker, Dr. Mary
    Everett, and Dr. Larry Stauffer. Great, great university. Also, no book like this
    would be complete without thanking my fabulous students, including James, Red,
    Garrett, Lacey, Jordan, Hunter, and Doug, who inspire me every day.


    Alan Simpson: Many thanks to Steve Hayes and everyone else at Wiley for offering
    me this great opportunity. Thanks to Susan Pink, my intrepid editor. Thanks to
    my literary agents, Carol Jelen and Margot Maley of Waterside Productions. And
    thanks to my wife, Susan, for her patience while I was working at all of crazy
    hours.


