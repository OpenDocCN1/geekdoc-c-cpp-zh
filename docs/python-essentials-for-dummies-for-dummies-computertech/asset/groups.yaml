    print(content)\n```\n\nThe output is:\n\nI've had a perfectly wonderful evening,\
    \ but this wasn't it.\n\nExecuting another readline() after this would read the\
    \ next line. As you may guess, when it comes to readline() and readlines(), you're\
    \ likely to want to use loops to access all the data in a way that gives you control.\n\
    \n## Looping through a File\n\nYou can loop through a file using either readlines()\
    \ or readline(). The readlines() method always reads the file in the file as a\
    \ whole. If the file is very large, your computer may run out of memory (RAM)\
