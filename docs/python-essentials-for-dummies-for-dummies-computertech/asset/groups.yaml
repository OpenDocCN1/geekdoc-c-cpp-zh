    \ 限制为最可能抛出异常的内容，我们可以在代码进一步运行之前让其停止。如果没有抛出异常，代码将继续运行到 `else` 下方，此时之前的异常处理器不再重要了。这里是带有注释的完整代码：\n\
    \n```python\ntry:\n    # 打开名为 people.csv 的文件\n    the_file = open('people.csv')\n\
    # 监控常见错误，如果发生则停止程序。\nexcept FileNotFoundError:\n    print(\"Sorry, I don't see\
    \ a file named people.csv here\")\n# 捕获任何意外错误。\nexcept Exception as err:\n   \
    \ print(err)\n# 否则，如果目前没有发生任何事，\n# 继续运行。\nelse:\n    # 如果到了这里，文件必须已经打开。\n    print('\\\
    n') # 打印空行\n    # 打印文件的每一行。\n    for one_line in the_file:\n        print(one_line)\n\
    \    the_file.close()\n    print(\"Success!\")\n```\n\n对于 Python，缩进非常重要。确保像本章所示缩进你的代码。否则，你的代码将无法工作。\n\
    \n图 9-6 也显示了在 VS Code 中运行代码及其结果。\n\n```python\nshowfilecontents.py >\ntry:\n \
    \   # 打开名为 people.csv 的文件\n    the_file = open('people.csv')\n# 监控常见错误，如果发生则停止程序。\n\
    except FileNotFoundError:\n    print(\"Sorry, I don't see a file named people.csv\
