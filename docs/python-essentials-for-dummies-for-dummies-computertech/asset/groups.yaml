    # Chapter 7

    Speeding Along with Lists and Tuples


    Sometimes in code you work with one item of data at a time, such as a person''s
    name or a unit price or a username. Other times, you work with larger sets of
    data, such as a list of people''s names or a list of products and their prices.
    These sets of data are often referred to as lists or arrays in most programming
    languages.


    Python has lots of easy, fast, and efficient ways to deal with all kinds of data
    collections, as you discover in this chapter. As always, we encourage you to follow
    along in a .py file. The “doing” part helps with the “understanding” part.


    # Defining and Using Lists


    The simplest data collection in Python is a list. We provided examples of these
    in the preceding chapter. A list is any list of data items, separated by commas,
    inside square brackets. Typically, you assign a name to the list using an = character,
    just as you would with variables. If the list contains numbers, don''t use quotation
    marks around them. For example, here is a list of test scores:


    ```

    scores = [88, 92, 78, 90, 98, 84]

    ```


    If the list contains strings, those strings should, as always, be enclosed in
    single or double quotation marks, as in this example:


    ```

    students = ["Mark", "Amber", "Todd", "Anita", "Sandy"]

    ```


    To display the contents of a list on the screen, you can print it just as you
    would print any regular variable. For example, executing print(students) in your
    code after defining the list displays the following on the screen:


    ```

    [''Mark'', ''Amber'', ''Todd'', ''Anita'', ''Sandy'']

    ```


    This output may not be exactly what you had in mind. But don''t worry: Python
    offers lots of ways to display lists.


    # Referencing list items by position


    Each item in a list has a position number, starting with 0, even though you don''t
    see any numbers. You can refer to any item in the list by using the name for the
    list followed by a number in brackets. In other words, use this syntax:


    ```

    lastname[x]

    ```


    Replace lastname with the name of the list you''re accessing and replace x with
    the position number of the item you want. Remember, the first item is always 0,
    not 1. For example, in the following first line, we define a list named students,
    and then print item number 0 from it. The result, when executing the code, is
    the name Mark displayed:


    ```

    students = ["Mark", "Amber", "Todd", "Anita", "Sandy"]

    print(students[0])

    ```


    The next example shows a list named scores. The print() function prints the value
    of scores[4], which is 84 in this example.


    Remember, the first item is always at position 0. So scores[0] is 88, scores[1]
    is 92 and so forth.


    ```

    scores = [88, 92, 78, 90, 84]

    print(scores[4])

    84

    ```


    If you try to access a list item that doesn''t exist, you get a list out of range
    error. The index part is a reference to the number inside the square brackets.


    # Looping through a list


    To access each item in a list, just use a for loop with this syntax:


    ```python

    for x in list:

    ```


    Replace x with a variable name of your choosing. Replace list with the name of
    the list.


    # Seeing whether a list contains an item


    If you want your code to check the contents of a list to see whether it already
    contains some item, use in list in an if-statement or a variable assignment. For
    example, the code in Figure 7-1 creates a list of names. Then, two variables store
    the results of searching the list for the names Anita and Bob. Printing the contents
    of each variable displays True for the one where Anita is in the list. The test
    to see whether Bob is in the list proves False.


    ```python

    students = ["Mark", "Amber", "Todd", "Anita", "Sandy"]


    # Is Anita in the list?

    has_anita = "Anita" in students

    print(has_anita)


    # Is Bob in the list?

    has_bob = "Bob" in students

    print(has_bob)


    True

    False

    ```


    FIGURE 7-1: Seeing whether an item is in a list.


    # Getting the length of a list


    To determine how many items are in a list, use the len() function (short for length).
    Put the name of the list inside the parentheses. For example, type the following
    code at the Python prompt:


    ```python

    students = ["Mark", "Amber", "Todd", "Anita", "Sandy"]

    print(len(students))

    ```


    Running that code produces this output:


    ```

    5

    ```


    The list has five items, though the index of the last item is always 1 less than
    the list''s length, because Python starts counting at 0. So the last item, Sandy,
    is stored in students[4] and not students[5].


    # Adding an item to the end of a list


    When you want your code to add an item to the end of a list, use the .append()
    method with the value you want to add inside the parentheses. You can use either
    a variable name or a literal value.


    # Inserting an item into a list


    Whereas the append() method adds an item to the end of the list, the insert()
    method adds an item at a specific position.


    # Changing an item in a list


    You can change an item in a list using the assignment operator, just like variables.


    # Combining lists


    If you have two lists that you want to combine into a single list, use the plus
    sign (+). For example, the following code:


    ```python

    list1 = [1, 2, 3]

    list2 = [4, 5, 6]

    list3 = list1 + list2

    print(list3) # [1, 2, 3, 4, 5, 6]

    ```


    # Removing items


    Python offers a remove() method so you can remove a value from the list. If the
    item is in the list multiple times, only the first occurrence is removed.


    ```python

    letters = ["A", "B", "C", "B", "D"]

    letters.remove("B")

    print(letters) # ["A", "C", "B", "D"]

    ```


    If you want to remove an item based on its position, use pop() with an index rather
    than remove().


    ```python

    letters = ["A", "B", "C", "D", "E"]

    letters.pop(0) # Removes the first item

    letters.pop()   # Removes the last item

    print(letters) # ["B", "C", "D"]

    ```


    When you pop() an item from the list, you can store a copy of the value in some
    variable.


    # Clearing out a list


    If you want to delete the contents of a list but not the list itself, use .clear().
    The list still exists, but it contains no items. In other words, it''s an empty
    list.


    # Counting how many times item appears in a list


    You can use a list''s count() method to count how many times an item appears in
    a list. As with other list methods, the syntax is simple:


    ```

    listname.count(x)

    ```


    Replace listname with the name of your list, and x with the value you''re looking
    for (or the name of a variable that contains that).


    # Finding a list item''s index


    Python offers an .index() method that returns a number indicating the position
    of an item in a list, based on the index number. The syntax is


    ```python

    listname.index(x)

    ```


    As always, replace listname with the name of the list you want to search. Replace
    x what you''re looking for (either a literal or a variable name, as always). Of
    course, there''s no guarantee that the item is in the list or in the list only
    once. If the item isn''t in the list, an error occurs. If the item is in the list
    multiple times, the index of the first matching item is returned.


    Figure 7-2 shows an example where the program crashes at the line f_index = grades.index(look_for)
    because there is no F in the list.

