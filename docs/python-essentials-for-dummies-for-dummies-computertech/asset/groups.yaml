    Variables are a big part of Python and all computer programming languages. A variable
    is simply a placeholder for information that may vary (change).


    In your code, a variable is represented by a variable name rather than a specific
    piece of information. Here is another way to think of it. Anytime you buy one
    or more of some product, the extended price is the unit price times the number
    of items you bought. In other words:


    Extended Price = Quantity * Unit Price


    You can consider Quantity and Unit Price to be variables because no what numbers
    you plug in for Quantity and Unit Price, you get the correct extended price. For
    example, if you buy three turtle doves for $1.00 apiece, your extended price is
    $3.00 (* $1.00). If you buy two dozen roses for $1.50 apiece, the extended price
    is $36 because 1.5 * 24 is 36.


    # Creating valid variable names


