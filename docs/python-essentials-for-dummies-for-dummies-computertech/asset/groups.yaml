    You can use generative AI to write code for opening and looping through files.
    For example, ask Copilot or ChatGPT to write python code to open a text file named
    whatever.txt and loop through its contents. Include exception handler for file
    not found. Then just modify the code it generates to suit your needs.


    # Appending versus overwriting files


    Anytime you work with files, it''s important to understand the difference between
    write and append. If a file contains information and you open it in write mode
    and then write to it, your new content will overwrite (replace) whatever is already
    in the file. There is no undo for this. If the content of the file is important,
    you want to make sure you don''t make that mistake. Add content to the end of
    a file, open the file in append (a) mode, and then use `write` to write to the
    file.


    # Using tell() to determine the pointer location


    When you loop through a file, its contents are read top to bottom and left to
    right. Python maintains a pointer to keep track of where it is in the file. When
    you''re reading a text file with readline(), the pointer is always the character
    position of the next line in the file.


    # Moving the pointer with seek()


    Whereas the `tell()` method tells you where the pointer is in an external file,
    the `seek()` method enables you to reposition the pointer. Your syntax is


    ```

    file.seek(position[,whence])

    ```


    Replace `file` with the variable name of the open file. Replace `position` to
    indicate where you want to put the pointer. For example, `0` moves the pointer
    back to the top of the file. The `whence` is optional; you can use it to indicate
    where in the file to set the pointer position. Your choices are


    +   - 0: Set the position relative to the start of the file.

    - 1: Set the position relative to the current pointer position.

    - 2: Set the position relative to the end of the file. Use a negative number for
    `position`.'
  - "[PAGE 137]\n\nIf you omit the whence value, it defaults to 0.\n\nBy far the most\
    \ common use of seek is just to reset the pointer back to the top of the file\
    \ for another pass through the file. The syntax for this is simply .seek(0).\n\
    \n# Reading and Copying a Binary File\n\nSuppose you have an app that changes\
    \ a binary file, and you want to always work with a copy of the original file\
    \ to play it. Binary files can be huge, rather than opening it all at once and\
    \ risking running out of memory, you can read it in chunks and write it out in\
    \ chunks. Binary files do not have human-readable content. Now they have lines\
    \ of text. readline() aren't a good choice for looping through binary files, but\
    \ you can use .read() with a specified size.\n\nFigure 10-2 shows the binarycopy.py\
    \ file, which makes a copy of any binary file. We take you through that code step-by-step\
    \ so that can understand how it works.\n\n```\nbinarycopy.py ~~\n# Specify the\
    \ file to copy\nfile_to_copy = 'happy_pickle.jpg'\n# Create new file name with\
    \ copy before the extension.\nname_parts = file_to_copy.split('.')\nnew_file =\
    \ name_parts[0] + '_' + name_parts[1]\n# Open the original file as read-only binary.\n\
    with open(file_to_copy, 'rb') as original_file:\n    # Create or open file to\
    \ copy into.\n    with open(new_file, 'wb') as copy_to:\n        # Grab a chunk\
    \ of the original file (4KB).\n        chunk = original_file.read(4096)\n    \
    \    # Loop until there are no more chunks.\n        while len(chunk) > 0:\n \
    \           copy_to.write(chunk)\n            # Make sure you read the next chunk\
    \ in this loop.\n            chunk = original_file.read(4096)\n    # Close is\
    \ automatic after loops, show message.\n    print('Done!')\n\n```\n\nFigure 10-2:\
    \ The binarycopy.py file copies any binary file.\n\nFigure 10-3 shows the results\
    \ of running the code. The Terminal simply shows Done. But as you can see, there's\
    \ now a file named happy_pickle_copy.jpg in the folder. Opening this file will\
    \ prove that it is a copy of the original file.\n\nPython Essentials For Dummies\n\
    \n126"
