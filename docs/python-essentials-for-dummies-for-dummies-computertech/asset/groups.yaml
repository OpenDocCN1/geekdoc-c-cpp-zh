    \ error message for this error, `object has no attribute 'readlines'`, as shown\
    \ in Figure 9-5.\n\n![](img/ca342ce31cd39db62dca2143d5fa4229_121_0.png)\n\nFIGURE\
    \ 9-5: The correct error message is displayed.\n\nAgain, if you're thinking about\
    \ handling the `.readlines()` error, that's not an exception for which you'd write\
    \ an exception handler. Exceptions occur when something outside the program upon\
    \ which the program depends isn't available. Programming errors, such as nonexistent\
    \ method names, are errors inside the program and have to be corrected by the\
