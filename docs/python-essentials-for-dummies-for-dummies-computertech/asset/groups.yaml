  - '[PAGE 16]


    to them because they''re not released on a yearly basis. They''re released whenever
    they''re released. The principle is the same, though. The version with the highest
    number is the newest, most recent model, sporting improvements based on experience
    with earlier versions, as well as features relevant to the current times.


    In this book, we focus on versions of Python that are current in 2023 from Python
    3.11 and higher. Don''t worry about version differences after the first and second
    digits. Version 3.11.1 is similar enough to version 3.11.2 that version differences
    aren''t important, especially to a beginner. Most of what''s in Python is the
    same across all recent versions. So you need not worry about investing time in
    learning a version that is or will soon be obsolete.


    # Tools for Success


    Now we need to start getting your computer set up so that you can learn, and do,
    Python hands-on. For one, you''ll need a good Python interpreter and editor. The
    editor lets you type the code, and the interpreter lets you run that code. When
    you run (or execute) code, you''re telling the computer to “do whatever my code
    tells you to.”


    The term code refers to anything written in a programming language to provide
    instructions to a computer. The term coding is often used to describe the act
    of writing code. A code editor is an app that lets you type code, in the same
    way as Microsoft Word or Apple Pages helps you type regular, plain-English text.


    Just as there are many brands of toothpaste, soap, and shampoo in the world, there
    are many brands of code editors that work with Python. There isn''t one right
    or a wrong one, a good one or a bad one, a best one or a worst one. Just a lot
    of different products that basically do the same thing but vary slightly in their
    approach and what editor''s creators think is good.


    If you''ve already started learning Python and are with whatever you''ve been
    using, you''re welcome to continue using that and ignore our suggestions. If you''re
    just getting started with this stuff, we suggest you use VS Code, because it''s
    an excellent, free learning environment.'
- md: '

    ## Installing Python and VS Code


    The editor we recommend and will be using in this book is called Visual Studio
    Code, officially. But most often, it is spoken or written as VS Code. The main
    reasons why it''s our favorite follow are:


    - It is an excellent editor for learning coding.

    - It is an excellent editor for writing code professionally and is used by millions
    of professional programmers and developers.

    - It is relatively easy to learn and use.

    - It works pretty much the same on Windows, Mac, and Linux.

    - It''s free.

    - It integrates beautifully with GitHub Copilot, so you can use modern, generative
    AI to speed both learning and actual coding.


    To use VS Code as your editor for learning and doing Python, you need to download
    and install Python, VS Code, and a VS Code extension. With luck, you already have
    some experience working with apps, so this won''t be difficult. You will have
    to follow onscreen instructions as you go along. If faced with choices you''re
    not sure about along the way, you can just choose the default (suggested) option.
    Here are the steps to download and install VS Code:


    1. Use any web browser to browse to www.python.org.

    2. Click Download and, if asked to select a version, choose the suggested stable
    version.

    3. Open the folder to which you downloaded Python and double-click the icon for
    the file you downloaded to install Python.

    4. Browse to https://code.visualstudio.com/ and download the current version of
    VS Code for your operating system.

    5. Open the folder to which you downloaded Visual Studio code, double-click the
    icon for the downloaded file, and follow the onscreen instructions to install
    VS Code.


    You can just follow the onscreen instructions, and accept any suggested defaults,
    during the installation process.


    After VS Code installed, you should be able to start it like any other app in
    your system. In Windows, click Start and look around the Start menu for Visual
    Studio Code. On a Mac, you should be able to find it in your Applications folder,
    or Launchpad.


    ## Installing the Python extension


    To use VS Code for Python coding, you need to install the VS Code Python extension
    for Python. When you open VS Code, you will see some icons listed down the left
    side of the window. Placing the mouse over any icon reveals its name. Click the
    Extensions icon, shown in Figure 1-1, and then enter Python in the Search box
    at the top of the Extensions panel. Click the button with the Python extension
    from Microsoft (see Figure 1-1).


    ![](img/ca342ce31cd39db62dca2143d5fa4229_18_0.png)


    Extensions icon Install the Python extension from Microsoft


    **FIGURE 1-1**: Obtaining the Python extension in VS Code.


    When you''ve finished installing the Python extension, you might notice that both
    Python and Pylance were added as extensions to VS Code. Don''t worry; that''s
    normal. Pylance just gives you some additional capabilities that make it easier
    to learn and write Python code within the VS Code editor. To ensure the extension
    is activated, exit VS Code and restart it.


    ## Let AI write your Python code


    Modern AI is perfectly capable of writing Python code for you. It''s not as simple
    as commanding it to "Write a Python app that will make me a billionaire," however.
    It doesn’t work that way — yet. Unfortunately. You need to break down into smaller
    chunks, and probably use accurate terminology; in other words, you still have
    to learn enough Python to be able to write your AI prompts accurately. Virtually
    all of these prompts — no matter what AI service you use — will start with "Write
    prompt for..." because AI can do a lot of things. If you don''t tell it, specifically,
    that you want it to write Python code, you might get no code, HTML, JavaScript,
    or whatever. Just make sure you understand that, first and foremost.


    As we write this in 2023, generative AI is still far new and evolving rapidly.
    We can''t make any promises in terms of pricing or availability. Those things
    are likely to change often over the coming years, and competing businesses jockey
    for position and market share. But as of this writing, you can prompt the following
    AI services to write Python code:


    - ChatGPT (https://chat.openai.com)

    - Claude (https://claude.ai)

    - Google Bard (https://bard.google.com)

    - Microsoft Copilot (https://copilot.microsoft.com)


    Most of these tools are free (right now), but again, we can''t make any promises
    about the future.


    ## Using GitHub Copilot


    GitHub Copilot is another AI tool capable of writing code for you. It''s based
    on OpenAI''s GPT-4, like ChatGPT. However, it''s specifically geared towards working
    with code and integrates directly into VS Code. You''re certainly not required
    to use GitHub Copilot to learn Python or use this book, but you might find that
    it really helps your learning process. As we write this book, GitHub is offering
    Copilot for free to students. It offers some paid plans, starting at $10 a month.
    To use Copilot, you need to sign up for GitHub and purchase (or request) access
    to Copilot. Again, this tool is so new that any instructions we give here are
    subject to change. You may need to search Google or YouTube for to use Copilot
    with VS Code to find the most up-to-date instructions. Basically, here''s how
    it works:


    1. If you don''t already have a GitHub account, go to https://github.com and create
    an account.


    2. Open VS Code if it isn''t already open.

    3. Click Extensions in the left column, and then enter Copilot in the Search box.

    4. Click the Install button at the right of GitHub Copilot (not "Copilot Labs"),
    as shown in Figure 1-2.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_20_0.png)


    Extensions icon Install GitHub Copilot


    **FIGURE 1-2**: The GitHub Copilot extension in VS.


    You will see some instructions and tips on a panel to the right. You need not
    do anything with those right now, though. Near the lower-left corner of VS Code,
    you should see an avatar icon for Accounts (see Figure 1-3). Click that icon and
    choose Sign In with GitHub to Use Copilot. But remember: Setting up a Copilot
    account isn''t a requirement, just an option. So you don''t feel you to complete
    the process of purchasing Copilot right now. But if you do add Copilot as an extension,
    you should see its name under Installed Extensions whenever you''re viewing extensions.


    Also, near the lower-right corner of the screen, you''ll see a tiny Copilot icon
    (also shown in Figure 1-3). You can click that icon at any time to deactivate
    Copilot if you feel it''s in your way while learning. Click it to activate Copilot
    whenever you''re ready.


    # Accounts


    # Copilot


    ![](img/ca342ce31cd39db62dca2143d5fa4229_21_0.png)


    **FIGURE 1-3**: The Accounts and Copilot icons in VS Code.


    The simple tasks you''ve completed in this chapter will serve you well through
    your learning process, as well as your professional after you''ve mastered the
    basics. Head on over to Chapter 2, and we''ll delve a bit deeper into Python and
    using the tools you now have available on your computer.


    ## THIS CHAPTER

    - Using interactive mode

    - Creating a development workspace

    - Creating a folder for your code

    - Typing, editing, and debugging code


    ## Chapter 2 Using Interactive Mode, Getting Help, and Writing Apps


    After you''ve installed VS Code, covered in the previous chapter, you''re ready
    to start digging deeper into writing Python code. In this chapter, we take briefly
    through the interactive, help, and code-editing features of VS Code. You''re probably
    anxious to get started on more advanced topics such as data science, artificial
    intelligence, robotics, or whatever, but those topics will be easier if you have
    a good understanding of the many tools available to you — and the skills to use
    them.


    ### Using Python''s Interactive Mode


    One way to get some practical, hands-on experience with Python is to just start
    some commands interactively. The Terminal pane in VS Code is a great place to
    type Python code. So in this chapter, that''s where you''ll start.

