    我们推荐并在本书中使用的编辑器正式名称为 Visual Studio Code。但大多数时候，它被口称为或写为 VS Code。它成为我们最喜欢的工具的主要原因有：


    - 它是学习编程的优秀编辑器。

    - 它是编写专业代码的优秀编辑器，并被数百万专业程序员和开发者使用。

    - 它学习和使用都相对简单。

    - 它在 Windows、Mac 和 Linux 上的运行几乎相同。

    - 它是免费的。

    - 它与 GitHub Copilot 完美集成，因此你可以使用现代生成式 AI 来加速学习和实际编码。


    要将 VS Code 作为你学习和进行 Python 的编辑器，你需要下载并安装 Python、VS Code 以及一个 VS Code 扩展。如果运气好的话，你已经有一些使用应用程序的经验，所以这并不会困难。你只需要按照屏幕上的说明操作。如果在在此过程中遇到不确定的选择，只需选择默认（建议）选项即可。以下是下载和安装
    VS Code 的步骤：


    1. 使用任何网络浏览器访问 www.python.org。

    2. 点击 Download（下载），如果要求选择版本，请选择建议的稳定版本。

    3. 打开你下载 Python 的文件夹，双击你下载的文件图标以安装 Python。

    4. 访问 https://code.visualstudio.com/ 并下载适用于你操作系统的最新版本 VS Code。

    5. 打开你下载 Visual Studio code 的文件夹，双击下载的文件图标，并按照屏幕上的说明安装 VS Code。


    在安装过程中，你只需要按照屏幕上的说明操作，并接受任何建议的默认设置即可。


    VS Code 安装完成后，你应该可以像系统中的任何其他应用程序一样启动它。在 Windows 中，点击“开始”菜单并在开始菜单中查找 Visual Studio
    Code。在 Mac 上，你应该可以在“应用程序（Applications）”文件夹或 Launchpad（启动台）中找到它。


    ## 安装 Python 扩展


    要使用 VS Code 进行 Python 编码，你需要为 Python 安装 VS Code Python 扩展。当你打开 VS Code 时，你会看到窗口左侧列出的一些图标。将鼠标悬停在任何图标上都会显示其名称。点击图
    1-1 所示的扩展（Extensions）图标，然后在扩展面板顶部的搜索框中输入 Python。点击来自 Microsoft 的 Python 扩展按钮（见图
    1-1）。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_18_0.png)


    扩展图标 安装来自 Microsoft 的 Python 扩展


    **图 1-1**: 在 VS Code 中获取 Python 扩展。


    安装完 Python 扩展后，你可能会发现 Python 和 Pylance 都作为扩展被添加到 VS Code。不要担心；这是正常的。Pylance 只是为你提供了一些额外功能，让你在
    VS Code 编辑器中学习和编写 Python 代码变得更加简单。为了确保扩展已激活，请退出 VS Code 并重启它。


    ## 让 AI 编写你的 Python 代码


    现代 AI 完全有能力为你编写 Python 代码。然而，这并不像命令它“写一个能让我变成亿万富翁的 Python 应用”那么简单。它不是这样运作的——目前如此。遗憾的是，你需要将其拆分成较小的部分，并可能需要使用准确的术语；换句话说，你仍然需要学习足够的
    Python，以便能够准确地编写 AI 提示词（prompts）。几乎所有这些提示词——无论你使用哪种 AI 服务——都会以“Write prompt for...（为...编写提示词）”开头，因为
    AI 可以做很多事情。如果你不明确告诉它你想让它写 Python 代码，你可能得不到代码、HTML、JavaScript 或任何东西。请务必首先理解这一点。


    由于我们在 2023 年编写这些内容，生成式 AI 仍然非常新并且正在快速进化。我们无法对定价或可用性做出任何承诺。这些事情在未来几年里可能会经常变化，竞争性企业正在争夺地位和市场份额。但在写作期间，你可以提示以下
    AI 服务来编写 Python 代码：


