    design the function so that it accepts any number of arguments. Note that this
    method is not particularly faster or better, use whichever is easiest or makes
    the most sense. To pass in any number of arguments, use `*args` as the parameter
    name, like this:


    ```

    def sorter(*args):

    ```'
