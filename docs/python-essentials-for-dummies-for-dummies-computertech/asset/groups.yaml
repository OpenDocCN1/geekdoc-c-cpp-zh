  mdcn: "\n\n## 异常的具体化\n\n如果文件打开成功，`print()` 语句就会运行并显示文件名。但如果尝试打开文件抛出异常，程序不会崩溃并显示通用的错误信息。相反，它会显示一条普通计算机可以理解的消息，如图\
