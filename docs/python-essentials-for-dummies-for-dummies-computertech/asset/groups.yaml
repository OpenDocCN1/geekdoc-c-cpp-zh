    # Getting the length of a string


    To determine how many characters are in a string, you use the built-in len() function
    (short for length). The length includes spaces because spaces are characters,
    each one having a length of one. An empty string — that is, a string with nothing
    in it, not even a space — has a length of zero.


    # Working with common string operators


    Python offers several operators for working with sequences of data. One weird
    thing about strings in Python (and in most other programming languages) is that
    when you''re counting characters, the first character counts as 0, not 1. This
    makes no sense to humans, but computers count characters that way because it''s
    the most efficient method. So even though the string is five characters long,
    the last character in that string is the letter E, because the first character
    is number 0. Go figure.


    Table 5–4 summarizes the Python 3 operators for working with strings.'
