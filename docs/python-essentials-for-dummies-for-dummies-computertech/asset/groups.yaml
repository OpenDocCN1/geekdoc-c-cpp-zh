    ## Using the help() function


    The Python prompt also offers a `help()` function with the syntax:


    ```

    help(object)

    ```


    To use it, replace `object` with the object type with which you''re seeking help.
    For example, to get help with `str` objects (strings, which come from the `str`
    class) enter this command at the Python prompt:


    ```

    help(str)

    ```


    The output will be more substantial information about the topic in the parentheses.
    For example, whereas `dir(str)` lists the names of attributes of that type, `help(dir)`
    provides more detail about each item. For example, `dir(str)` tells you that there''s
    a thing called `capitalize` in the `str` class, but `help(dir)` tells you a bit
    more about it, as follows:


    ```

    capitalize(self, /)\Return a capitalized version of the string.

    ```


    More specifically, make the first character have upper case and the rest lower
    case.


    The word self just means that whatever you pass to capitalize is what gets capitalized.
    The / at the end tells you that items listed before the slash are positional only,
    meaning that you can''t use keyword arguments with them.


    When you''re finished viewing help, you don''t have to scroll to the end to get
    back to the prompt. Simply press Ctrl+C.


