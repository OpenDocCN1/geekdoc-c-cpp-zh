    # Uncovering Dates and Times


    In the world of computers, we often use dates and times for scheduling, or for
    calculating when something is due or how many days it''s past due. We use timestamps
    to record exactly when a user did something or when an event occurred. There are
    lots of reasons for using dates and times in Python, but perhaps surprisingly,
    no built-in data type for them exists like the ones for strings and numbers.


    To work with dates and times, you typically need to use the datetime module. As
    with any module, you must import it before you can use its classes. There are
    several classes in the datetime module that you will find useful:


    - date: represents a date (year, month, day)

    - time: represents a time (hour, minute, second, microsecond)

    - datetime: represents a date and time combined

    - timedelta: represents the difference between two dates or times


    Here is an example of how to create objects from these classes:


    ```python

    import datetime


    # Create a date object

    d = datetime.date(2023, 10, 25)


    # Create a time object

    t = datetime.time(14, 30, 0)


    # Create a datetime object

    dt = datetime.datetime(2023, 10, 25, 14, 30, 0)


    # Create a timedelta object

    delta = datetime.timedelta(days=5)

    ```


    Once you have these objects, you can perform operations on them. For example,
    you can add a timedelta to a date to find a date in the future:


    ```python

    future_date = d + delta

    print(future_date)  # Output: 2023-10-30

    ```


    You can also subtract two datetime objects to find the difference between them:


    ```python

    diff = dt - datetime.datetime(2023, 10, 25, 12, 0, 0)

    print(diff)  # Output: 2:30:00

    ```


    To format date and time objects as strings, you use the strftime() method. This
    method takes a format string that defines how the output should look:


    ```python

    now = datetime.datetime.now()

    print(now.strftime("%Y-%m-%d"))  # Output: 2023-10-25

    print(now.strftime("%B %d, %Y"))  # Output: October 25, 2023

    print(now.strftime("%H:%M:%S"))  # Output: 14:30:05

    ```


    On the other hand, you can parse a string into a date or time object using the
    strptime() method:


    ```python

    date_string = "2023/10/25"

    date_object = datetime.datetime.strptime(date_string, "%Y-%m-%d")

    print(date_object)  # Output: 2023-10-25 00:00:00

    ```


    The datetime module is a powerful tool for handling dates and times in Python.
    By mastering these basic concepts, you will be able to handle almost any date-related
    task.

