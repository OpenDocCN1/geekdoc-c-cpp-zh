    ```


    It''s the same amount with or without the leading zero, so just whichever format
    works for you.


    This number format is ideal for Python, and you wouldn''t want to mess with that.
    But if you want to display that number to a human, simply using a `print()` function
    displays it exactly as Python stores it:


    ```python

    sales_tax_rate = 0.065

    print(f"Sales Tax Rate {sales_tax_rate}")

    # Sales Tax Rate 0.065

    ```


    When displaying the sales tax rate for people to read, you''ll probably want to
    use the more familiar 6.5% format than .065. You can use the same idea as with
    fixed numbers (.2f). However, you replace the `f` for fixed numbers with %, like
    this:


    ```python

