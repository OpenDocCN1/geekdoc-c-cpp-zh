    # Opening Terminal


    To use Python interactively with VS Code, follow these steps:


    - 1. Open VS Code.

    - 2. Choose View -> Terminal from the VS Code menu bar.

    - 3. If the word Terminal isn''t highlighted or underlined at the top of the page,
    click Terminal (circled in Figure 2-1).


    ![](img/ca342ce31cd39db62dca2143d5fa4229_23_0.png)


    # Going into the Python Interpreter


    Whichever command gives you the Python version will also take you to a Python
    interpreter, where you can enter Python code directly. You''ll know you''re in
    the right place when you see the prompt change to three greater-than signs (>>>).
    To get to the command prompt now, enter whichever python command worked for you
    before, type --version. For example, just type python (or just python3, or just
    py) and nothing else; then press Enter:


    ```

    python

    ```


    > When, or anyone else, says "enter the command," that means you have to type
    the command and press Enter. Nothing happens until you press Enter. So if you
    just type the command and waiting to happen, you''ll be waiting for a long time.
    You should see some information about the Python version you''re using and the
    >>> prompt, which represents the Python interpreter.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_23_1.png)


    # Entering commands


    Entering commands in the Python interpreter is as simple as typing them anywhere
    else. You must type the command correctly and then press Enter. If you spell something
    wrong in the command, you will likely see an error message, which is just the
    interpreter telling it doesn''t understand what you mean. But don''t worry; you
    can break anything. For example, suppose you type the command


    ```

    howdy

    ```


    After you press Enter, you''ll see some techie gibberish that is trying to tell
    you the interpreter doesn''t know what "howdy" means, and it can''t do anything.
    Nothing has broken. You''re just back to another >>> prompt, where you can try
    again, as shown in Figure 2-2.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_24_0.png)


    FIGURE 2-2: Python doesn''t know what howdy means.


    # Using Python''s built-in help


    One of the prompts in Figure 2-2 mentions that you can type help as a command
    in the Python interpreter. Note that you don''t type the quotation marks, just
    the word help (and then press Enter, as always). This time you see


    ```

    Type help() for interactive help, or help(object)

    for help about object.

    ```


    Now the interpreter is telling you to type help followed by an empty pair of parentheses,
    or type help with a specific word in parentheses (object is the example given).
    Make sure you press Enter after typing your command. Go ahead and enter the following:


    ```

    help()

    ```


    Note the line does not have spaces. After you press Enter, the screen provides
    some information about using Python''s interactive help.


    Seeing help> at the bottom of the window tells you that you''re no longer in the
    operating shell or the Python interpreter (which always shows >>>) but are now
    in a new area that provides help. As described on the screen, you can enter the
    name of any module, keyword, or topic to get help with that term. As a beginner,
    you might not need help with specific rights at the moment. But it''s good to
    know that the help is there if you need it.


    For example, Python uses certain keywords that have special meaning in the language.
    To get a list of those keywords, you type the following at the help> prompt:


    ```

    keywords

    ```


    After you press Enter, you see a list of keywords, as shown in Figure 2-3.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_25_0.png)


    FIGURE 2-3: Keyword help.


    All the technical jargon in the help text will leave the average beginner flummoxed.
    But as you learn about new concepts in Python, realize that you can use the interactive
    help for guidance as needed.


    > If you see --More at the bottom of the text that isn''t a prompt where you type
    commands. Instead, it lets you know that there is more text, perhaps several pages''
    worth. Every time you see --, you can press spacebar or Enter to get to the next
    page. Eventually you''ll get back to the help> prompt. If you want to quit rather
    than scrolling, press Q.


    # Exiting interactive help


    To leave the Python prompt and get back to the operating system, type exit() and
    press Enter. Note that if you make a mistake forgetting the parentheses, you''ll
    get help on the screen. For example, if you type exit and press Enter, you''ll
    see


    ```

    Use exit() or Ctrl+Z to exit.

    ```


    Don''t be thrown by "Ctrl-Z" versus "Ctrl+Z" key combinations; both mean the same
    thing. You''ll know you''ve exited the Python interpreter when you see the operating
    system prompt rather than >>> at the end of the Terminal.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_26_0.png)


    # Searching for specific help


    Python''s built-in help is useful when you know the exact terminology and concept
    you want to look up. But that''s often for beginners. When you''re online, you
    may be better off searching the web; start at youtube.com; if not, stackstackoverflow.com
    is a good place to ask questions, and of course, Bing and other search engines.
    Regardless of what you use to search, remember to start your search with the word
    python. A lot of programming languages share similar concepts and keywords, so
    if you don''t specify the language in your search, you may get any kind of results.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_26_1.png)


    # Creating a Folder for Your Python Code


    In this section, you create a folder to store all the Python code that you write
    in this book all together in one place and it easy to find when you need it. You
    can put this folder anywhere and name it whatever you like.


    In Windows, you can navigate to the folder that contains the new folder (can use
    Desktop, Documents, or any other folder.) Right-click an empty space in the folder
    and choose New Folder (Mac) or New Folder (Windows). Type the folder name and
    press Enter. To follow along with the examples in this chapter, name your folder
    Python Essentials.


    # Typing, Editing, and Debugging Python Code


    Most likely, you''ll write the vast majority of code in an editor. As you probably
    know, an editor enables you to type and edit text. The editor in VS Code is set
    up for typing and editing code, so you may hear it referred to as a code editor.


    Because people tell you to organize code into folders (as we suggest you do for
    this chapter''s examples), your first step is to open the folder that contains
    your code in your editor. There are a few ways to do that. If it is your first
    time, follow these steps:


    - 1. Open VS Code using the Start menu in Windows or Launchpad on a Mac.

    - 2. Click File -> Open Folder from VS Code''s menu bar, navigate to the folder''s
    location, click the name of the folder you want to open, and click Select Folder.


    The name of the currently open folder appears near the top of the Explorer pane
    at the left side of the VS Code window.


    Each Python code you create will be a plain-text file with a .py extension. We
    suggest that you keep any files you create for this book in that Python Essentials
    folder (see the previous section for how to create that folder). You should be
    able to open your Python Essentials folder anytime VS Code and your workspace
    open.


    To create a .py file at any time, follow these steps:


    - 1. If you haven''t already done so, open VS Code and your Python Essentials
    folder.

    - 2. If the Explorer pane isn''t open, click the Explorer icon near the top-left
    of VS Code.

    - 3. To create a file in your Python Essentials folder, click New File to the
    right of the folder name.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_27_0.png)


    - 4. Type the filename with the .py extension (hello.py for this first one) and
    press Enter.


    The new file opens and you can see its name in the tab on the right. The larger
    area below the tab is the editor, where you type the Python code. The filename
    also appears under the Python Essentials folder name in the Explorer pane, because
    that''s where it''s stored.


    # Writing Python code


    Now that you have a .py file open, you can use it to write some Python code. As
    is typical when learning a new programming language, you''ll start by typing a
    simple Hello World program. Here are the steps:


    - 1. Click just to the right of line 1 in the editing area.

    - 2. Type the following:


    ```

    print("Hello World")

    ```


    As you''re typing, you may notice text appearing on the screen. That text is IntelliSense,
    which detects what you''re typing and shows you information about that keyword.
    Exactly how much information you see depends on whether you''re using GitHub Copilot.
    But you don''t have to do anything with that — just keep typing.


    - 3. Press Enter after you''ve typed the line.


    The new line of code is displayed on the screen. You may notice a few other changes,
    as shown in Figure 2-4:


    - The Explorer icon sports a dot, or perhaps a circled 1, indicating that you
    currently have one unsaved change.

    - The hello.py name in the tab displays a dot, which indicates that the file has
    unsaved changes.


    # Saving your code


    Code you type in VS Code is not saved automatically. There are two ways to deal
    with that. One is to try to remember to save anytime you make a change that''s
    worth saving. The easiest way to do that is to choose Save from VS Code''s menu
    bar or press Ctrl+S in Windows or Cmd+S on a Mac.

