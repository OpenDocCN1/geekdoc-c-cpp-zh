    \n假设你手动修复了文件名，使其成为最初预期的 `people.csv`。如之前所示，当你运行代码且没有错误时，输出只是文件名。在打印文件名的行下面，我们添加了另一行代码：\n\
    \n```python\ntry:\n  # 打开文件并显示其名称。\n  the_file = open('people.csv')\n  print(the_file.name)\n\
    \  print(the_file.readlines())\nexcept Exception:\n  print(\"Sorry, I don't see\
    \ a file named people.csv here\")\n```\n\n当你运行这段代码时，文件名没有问题，因此输出显示 `people.csv`，正如你预期的那样。然而，下一行代码\
    \ `print(the_file.readlines())` 抛了一个错误，因为我们没有定义名为 `readlines()` 的方法。遗憾的是，错误信息仍然和之前一样，尽管错误的原因是\
    \ Python 中没有名为 `.readlines()` 的方法：\n\n| people.csv |\n| :--- |\n| Sorry, I don't\
    \ see a file named people.csv |\n\n那么，为什么错误信息说没有找到 `people.csv` 文件，而我们知道它已经找到了，并且是下一行代码导致了错误呢？问题出在\
    \ `except Exception:` 这一行，它的意思是“如果在这个 `try` 块中抛出任何异常，都会执行 `except` 行下方的代码”。\n\n\
    为了解决这个问题 unique，你需要将 `Exception:` 替换为你想让 Python 捕获的特定异常。你如何知道那个特定异常是什么？很简单。抛出的异常是\
    \ `FileNotFoundError: [Errno 2] No such file or directory: 'people.csv'`\n\n第一个词是异常名称，你可以用它来代替通用的\
