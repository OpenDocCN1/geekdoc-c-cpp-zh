    ## Manipulating Strings


    In Python and other programming languages, a string is a sequence of characters.
    In this section, we learn how to use strings.


    ## Concatenating strings


    You can join strings by using the plus sign (+). This process is called concatenation.
    For example:


    ```python

    first_name = "Alan"

    last_name = "Simpson"

    full_name = first_name + " " + last_name

    print(full_name)

    # Alan Simpson

    ```


    When the output of a print() function doesn''t look right, keep in mind two important
    facts about strings in Python:


    - The first character is always number 0.

    - Every space counts as one character, so don''t skip spaces when counting.


    ## Getting the length of a string


    To determine how many characters are in a string, you use the built-in len() function
    (short for length). The length includes spaces, each having length one. An empty
    string — that is, a string with nothing in it — has a length of zero.


    ## Working with common operators


    Python offers several operators for working with sequences of data. One weird
    thing about strings in Python (and most other languages) is that when you'' counting
    characters, the first character counts as 0, not 1. This makes no sense to humans,
    but computers count characters that way because it''s the most efficient. So even
    though the string is five characters long, the last character is the letter E,
    because the first character is 0. Go figure.


    ## TABLE 5-4 Python Sequence Operators That Work with Strings


    | Operator | Purpose |

    | --- | --- |

    | x in s | Returns True if the string x exists somewhere in string s. |

    | x not in s | Returns True if x is not contained in string s. |

    | s*n or n* | Repeats string s n times. |

    | s[i] | The character at position i within string s. |

    | s[i:j] | A slice from string beginning with the character at i up to (excluding)
    the character at j. |

    | s[i:j:k] | A slice of s from i to j with step where k is the distance between
    any characters. Setting k to 2 displays every third character, and so forth. |


