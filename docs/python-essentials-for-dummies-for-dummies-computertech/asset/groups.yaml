    If you want to output your JSON data to a file, use json.dump() rather than json.dumps().
    You can use ensure_ascii=False to maintain non-ASCII characters, and sort_keys=True
    to alphabetize key names. You can also include an indent=option, which can make
    the file more readable for human consumption. However, rarely use JSON to create
    human-readable files. JSON is primarily a marshalling format used to transport
    from databases to apps, and from apps to databases.


    As an example, suppose you want to create a file named hitcounts_new.json (or,
    if it already exists, to overwrite its contents). You want to retain any non-ASCII
    characters that you write to the file. Here''s the code for that; the ''w'' is
    required to make sure the file opens for writing data into it:


    ```python

    open(''hitcounts_new.json'', ''w'',

    encoding=''utf-8'') as out_file:

    ```


    Then, to copy the dictionary named hits as JSON data into this file, use the name
    you assigned at the end of the code in the preceding line. Again, to retain any
    non-ASCII characters and, optionally, alphabetize the key names in each dictionary,
    follow that line with this one, indented so that it''s contained in the block:


    ```python

    json.dump(hits, out_file, ensure_ascii=False,

    sort_keys=True)

    ```


    JSON is a widely used format for storing and sharing data. Luckily, Python has
    lots of built-in tools for accessing and creating JSON data. We''ve covered the
    most important capabilities here. But don''t be shy about doing a web search for
    python json if you want to explore more.


    # Chapter 12

    Interacting with the Internet


    As you probably know, the internet is home to virtually all the world''s knowledge.
    Most of us use the web all the time to find information. We do so by using a web
    browser such as Safari or Google Chrome. To visit a website, you type a Uniform
    Resource Locator (URL) into your browser''s address bar and press Enter, or you
    click a link that sends you to the page automatically. This is the most complicated
    chapter in our book, but it is one of the most interesting to play with.


    As an alternative to browsing the web with your web browser, you can access its
    content programmatically. In other words, you can use a programming language as
    Python to post information to the web, as well as to access web information. In
    this chapter, you learn about the two main modules for accessing the web programmatically
    with Python: urllib and BeautifulSoup.


    # Seeing How the Web Works


    When you open your web browser and type in a URL or click a link, that action
    sends a request to the internet. The internet directs your request to the appropriate
    web server, which in turn sends a response back to your computer. Typically that
    response is a web page, but it can be just any file. Or it can be an error message
    if you requested something no longer exists at location. But the important thing
    is that you, the user (a human being), and your user agent (the program you''re
    using to access the internet) are on the client side of things. The server, which
    is just a computer, not a person, sends back its response, as illustrated in Figure
    12-1.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_157_0.png)


    Figure 12-1: The client makes a request, and the server sends back a response.


    # Understanding the mysterious URL


    The URL is a key part of accessing a web page, because that''s how the internet
    finds the resource you''re seeking. On the web, most resources use Hypertext Transfer
    Protocol (HTTP), thus their URLs start with http:// or https://. The difference
    is that http sends stuff across in its raw form, which makes it susceptible to
    hackers and others who can "sniff out" the traffic. The https protocol is secure
    in that the data is encrypted, which means it''s been converted to a secret code
    that''s not easy to read. Typically, any site with whom you do business and to
    whom you transmit sensitive information, such as passwords and credit numbers,
    uses https to keep that information secret and secure.


    The URL for any website can be relatively simple, such as Alan''s, which is or
    can be complex, to add more information to the request. Figure 12-2 shows the
    parts of a URL, some of which you may have noticed in the past.


    Note that the order matters. For example, it''s possible for a URL to contain
    a path to a specific folder or page starting with a slash right after the domain
    name. The URL can also contain a query string, which is always last and always
    starts with a question mark (?). After the question mark comes one or more name=value
    pairs, basically the same syntax you''ve seen in data dictionaries and JSON. If
    there are multiple name=value pairs, they are separated by ampersands (&).


    ![](img/ca342ce31cd39db62dca2143d5fa4229_158_0.png)


    https://alansimpson.me/python/cheats/beginner/index.html


    ![](img/ca342ce31cd39db62dca2143d5fa4229_158_1.png)


    ![](img/ca342ce31cd39db62dca2143d5fa4229_158_2.png)


    Figure 12-2: Different parts of a URL.


    # Exposing the headers


    When you access the web, the headers provide information about the request and
    the response. Most of the headers you see are hidden from the user, but you can
    see them using your browser''s developer tools. The headers tell you about the
    browser you''re using, the type of content being sent, and many other details.


    The most important headers are the User-Agent, which tells the server what browser
    you are using, and Content-Type, which tells the server what kind of data is being
    sent. Other headers include Cookie, which is used to track your session, and Cache.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_159_0.png)


    Figure 12-3: Inspecting headers with Chrome.


    # Opening a URL from Python


    To access the web from Python, you need to use the urllib library. This library
    consists of modules, each of which provides capabilities for different aspects
    of accessing the internet. Table 12-2 summarizes the packages.


    ```

    GET https://alansimpson.me/python/cheats/beginner/index.html

    Status: HTTP/1.1 200

    Request Headers

    ```


    | | |

    | --- | --- |

    | Accept | text/html,application/xml+xml,application;q=0.9,image/webp,image/*,*q=0.8
    |

    | Accept-Encoding | gzip, deflate, br |

    | Accept-Language | en-US;q=0.9 |

    | Referer | https://alansimpson.me/python/cheats/ |

    | Upgrade-Insecure-Requests | 1 |

    | User-Agent | Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML,
    like Gecko) Chrome |

    | Response Headers | |

