    # Understanding Python Data Types


    You deal with written information all the time and probably don’t think about
    the difference between numbers and text. Numbers are amounts, such as 10 or 123.45.
    Text consists of letters and words. For computers, the big difference is that
    they can do arithmetic (add, subtract, multiple, divide) with numbers, but not
    with letters and words.


    # Numbers


    Numbers in Python must start with a number digit, (0–9); a dot (period), which
    is a decimal point; or a hyphen (-) used as a negative sign for negative numbers.
    A number can contain only one decimal point. It should not contain letters, spaces,
    dollar signs, or anything else that isn’t part of a normal number.


    If you’re worried that the number rules won’t let you work with dollar amounts,
    zip codes, addresses, or anything else, stop worrying. You can store and work
    with all kinds of information, and you’ll see shortly.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_41_0.png)


    # Integers


    An integer is any number, positive or negative. There is no limit to its size.
    Numbers such as 0, -1, and 999999999999999 are all perfectly valid integers. From
    your perspective, an integer is just any valid number that doesn’t contain a decimal
    point.


    # Floats


    A floating-point number, often called a float, is any valid number that contains
    a decimal point. Again, there is no size limit: 1.1 and -12345.789012345 are all
    perfectly valid floats.


    If you work with very large scientific numbers, you can put an e in a number to
    indicate the power of 10. For example, 23e1000 is a valid number, and will be
    treated as a float if there’s no decimal point. If you’re familiar with scientific
    notation, you know 24e3 is 234,000 (replace the e3 with three zeros). If you’re
    not familiar with scientific notation, don’t worry about it. If you’re not using
    it in your day-to-day work now chances you’ll never need it in Python either.


    Python Essentials For Dummies


    # Words (strings)


    Strings are sort of the opposite of numbers. With numbers, you can add, subtract,
    multiply, and divide because the numbers represent quantities. Strings are for
    just about everything else. A name, address, or kind of text you see every day
    would be a string in Python (and in computers in general). It''s called a string
    because it''s a string of characters (letters, spaces, punctuation marks, and
    maybe some numbers). To us, string usually has some meaning, such as a person''s
    name or address. Computers don''t have eyes to see with or brains to think with
    or any awareness humans exist, so to a computer, a piece of information is not
    nothing on which it can do arithmetic, it''s just a string of characters.


    Unlike numbers, a string must always be enclosed in quotation marks. You can use
    double (\") or single ('''') quotation marks. All the following are valid strings:


    ```

    "Hi there, I am a string"

    ''Hello world''

    "123 Oak Tree Lane"

    "(267)555-1234"

    "18901-3384"

    ```


    Note that it''s fine to use numeric characters (0-9) as well as hyphens and dots
    (periods) in strings. Each is still a string because it''s enclosed in quotation
    marks.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_42_0.png)


    A word of caution: If a string contains an apostrophe (single quote), the entire
    string should be enclosed in double quotation marks like this:


    ```

    "Mary''s dog said Woof"

    ```


    # Booleans


    A third data type in Python isn''t exactly a number or a string. It''s called
    a Boolean (named after a mathematician George Boole), and it can be one of two
    values: True or False.


    In Python code, people store True and False values in variables (placeholders
    in code that we discuss later in this chapter) using a format similar to this:


    ```

    x = True

    ```


    or perhaps this:


    ```

    x = False

    ```


    The initial cap is required. In other words, the Boolean values True and False
    must be written as shown.


    # Working with Python Operators


    As we discuss in the preceding section, it helps with Python and computers in
    general to think of information as being one of the following data types: number,
    string, or Boolean. You also use computers to operate on that information, meaning
    to do any necessary math or comparisons or searches or whatever to help you find
    information and organize it in a way that makes sense to you.


    Python offers many different operators for working with and pairing types of information.
    Whether you use an operator in your own work depends on the types of apps you
    develop. For now, it''s sufficient to be aware that they''re available.


    # Arithmetic operators


    Arithmetic operators, as the name implies, are for doing arithmetic: addition,
    subtraction, multiplication, division, and more. Table 4-1 lists Python''s arithmetic
    operators.


    TABLE 4-1 Python''s Arithmetic Operators


    | Operator | Description | Example |

    | --- | --- | --- |

    | + | Addition | 1 + 1 = 2 |

    | - | Subtraction | 10 - 1 = 9 |

    | * | Multiplication | 3 * 5 = 15 |

    | / | Division | 10 / 5 = 2 |


    Python Essentials For Dummies


    # Comparison operators


    As we discuss in the preceding section, it helps with Python and computers in
    general to think of information as being one of the following data types: number,
    string, or Boolean. You also use computers to operate on that information, meaning
    to do any necessary math or comparisons or searches or whatever to help you find
    information and organize it in a way that makes sense to you.


    Python offers many different operators for working with and pairing types of information.
    Whether you use an operator in your own work depends on the types of apps you
    develop. For now, it''s sufficient to be aware that they''re available.


    # Comparison operators


    Comparison operators are used to compare values. Table 4-2 lists Python''s comparison
    operators.


    Table 4-2 Comparison Operators


    | Operator | Meaning | Example |

    | --- | --- | --- |

    | < | Less than | 5 < 10 |

    | <= | Less than or equal to | 5 <= 5 |

    | > | Greater than | 10 > 5 |

    | >= | Greater than or equal to | 10 >= 10 |

    | == | Equal to | 5 == 5 |

    | != | Not equal to | 5 != 10 |


    # Boolean operators


    Boolean operators are used to combine Boolean values. Table 4-3 lists Python''s
    Boolean operators.


    Table 4-3 Boolean Operators


    | Operator | Meaning | Example |

    | --- | --- | --- |

    | and | Both | True and False |

    | or | At least one | True or False |

    | not | Not | not True |


    # Creating Variables


    Variables are used to store information that can change. A variable is simply
    a placeholder for information. In Python, you create a variable by assigning it
    a value. For example:


    ```python

    quantity = 24

    unit_price = 1.5

    ```


    # Creating variable names


    In Python, you can make up your own variable names, but they must conform to the
    following rules:


    - The variable name must start with a letter or an underscore (_).

    - After the first character, you can use only letters, numbers, or underscores.

    - Variable names are case sensitive, so after you make up a name, any reference
    to that variable must use the same uppercase and lowercase letters.

    - Variable names cannot be enclosed in, or contain, single or double quotation
    marks.

    - The variable name cannot be the same as a Python keyword.


    # Creating in code


    To create a variable, you use the following syntax:


    ```

    variablename = value

    ```


    where variablename is the name you make up. You can use x or y, as people often
    do in math, but in larger programs, it''s a good idea to give your variables more
    meaningful names, such as quantity or unit_price or sales_tax or user_name, so
    that you remember what you''re storing in the variable. The value is whatever
    you want to store in the variable. It can be a number, a string, or a Boolean
    True or False value or result of a calculation.


    The = sign the assignment operator and is so named because it assigns the value
    (on the right) to the variable (on the left). example, in the following:


    ```

    x = 10

    ```


    we are storing the number 10 in a variable named x. In other words, we''re assigning
    the value 10 to the x variable.


    And here:


    ```

    user_name = "Alan"

    ```


    we''re putting the string Alan in a variable named user_name.


    # Manipulating variables


