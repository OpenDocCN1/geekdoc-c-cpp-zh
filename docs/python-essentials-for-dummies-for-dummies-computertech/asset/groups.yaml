    library is huge and technical, so don''t expect to understand it right off the
    bat. Instead, use it as an ongoing resource to learn about things that interest
    you as your knowledge of Python develops.


    ## Exploring built-in functions


    Both dir() and help() are examples of Python built-functions, which are always
