    \ Sorry, I don't see a file named people.csv |\n\nSo why is the error message\
    \ saying that the file people.csv wasn't found, when we know it was found and\
    \ the next line of code is causing the error? The problem is in the `except Exception:`\
    \ line, which says \"if any exception is raised in this try block, the code under\
    \ the except line is executed.\"\n\nTo clean up this problem, you need to replace\
    \ `Exception:` with the specific exception you want Python to catch. How do you\
    \ know what that specific exception is? Easy. The exception raised `FileNotFoundError:\
    \ [Errno 2] No such file or directory: 'people.csv'`\n\nThe first word is the\
    \ name of the exception that you can use in place of the generic Exception name,\
    \ like this:\n\n```python\ntry:\n    # Open file and show its name.\n    the_file\
    \ = open('people.csv')\n    print(the_file.name)\n    print(the_file.readlines())\n\
    except FileNotFoundError:\n    print(\"Sorry, I don't see a file named people.csv\"\
    )\n```\n\nGranted, isolating the file-not found error doesn't do anything to help\
    \ with the bad method name. However, the bad method name isn't an exception; it's\
    \ a programming error that needs to be corrected in the code by replacing `.readlines()`\
    \ with the method you want to use. At least the error message you see isn't the\
