    ## Exploring Python Packages


    The Python language supports modular programming, in which a program is broken
    down into smaller, more manageable components, or modules. And some of these components
    might already have been created by someone else and can be reused.


    Any large project, whether you''re working alone or as a team member, can be simplified
    or streamlined if some components can use code that''s already been written, tested,
    debugged, and deemed reliable by members of the Python programming community.
    The packages you hear about in relation to Python are that kind of code — code
    that has been developed and nurtured, is trustworthy, and is generic enough to
    be used as a component of a large project.


    Thousands of packages are available for Python. A good resource for finding packages
    is PyPI, a clever name that''s easy to remember and short for Python Package Index.
    You can check it out at https://pypi.org.


    In addition, a program named pip, for Pip Installs Packages (another clever name)
    is a package manager that you can use to explore, update, and remove existing
    packages from your system.


    To use pip, you have to get to your operating system’s command prompt, which is
    Terminal on a Mac, and cmd.exe or PowerShell in Windows. If you’re using VS Code,
    the simplest way to get to the command prompt is to open VS Code and choose View
    -> Terminal.


    If you already have pip, typing this command at a command prompt will tell you
    which version of pip is currently installed:


    ```

    pip --version

    ```


    If you’re using a Mac and get a “command not found” error, you’ll need to use
    pip3 in place of pip in all commands. For example, use


    ```

    pip3 --version

    ```


    The result will likely look something like this (but with your version’s number,
    and the path to Python in place of the ellipsis [..]):


    ```

    pip 23.1.2 ...

    ```


    To see what packages you already have installed, enter this at the operating system
    command prompt or in the VS Code pane in Windows:


    ```

    pip list

    ```


    Or on a Mac, use pip3 in place of pip if you get an error with pip:


    ```

    pip3 list

    ```


    ## Importing Python Modules


    You’ll hear the word module used with Python all the time. If you think of the
    standard library as a physical library and a package as a book in that library,
    a module is one chapter in book. In other words, a package may contain many modules,
    and a library may contain many packages. The module is a big part of what makes
    Python a modular language, because code is grouped together to function. You don’t
    have to import everything including the kitchen sink to use code. On the other
    hand, if you need to use several related things, such as functions for working
    with dates and times, you don''t have to import them one at a time. Typically,
    importing the entire module will get you what you need.


    You can import functionality from modules in a few ways. The way we just noted
    is one of the most common: import the entire module. To do that, just follow the
    import command with the name of the module you want to import. For example, the
    follow-import command imports the entire module:


    ```

    import math

    ```


    After you import a module, the dir() and help() functions work on that module,
    too. For example, if you tried doing dir(math) or help(math) before import math,
    you''d get an error. That''s because that math package isn''t part of the standard
