    ## Formatting width and alignment


    You can also control the width of your output (and the alignment of content within
    width) by the colon in your f-string with `<` (for left aligned), `^` (for centered),
    or `>` (for right aligned). Put any of these characters after the colon in your
    format string. For example, the following will make the output 20 characters wide,
    with the content aligned:


    ```

    :20

    ```


