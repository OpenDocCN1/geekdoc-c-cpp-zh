    在上一章安装了 VS Code 之后，你已经准备好深入研究编写 Python 代码了。在本章中，我们将简要介绍 VS Code 的交互式、帮助和代码编辑功能。你可能急于开始学习更高级的主题，如数据科学、人工智能、机器人技术等，但如果你对可用的许多工具有良好的了解，这些主题将会变得更容易。


    ### 使用 Python 的交互式模式


    获得一些实践经验的一种方法是交互式地运行一些命令。VS Code 的终端（Terminal）面板是输入 Python 代码的好地方。因此，在本章中，我们将从那里开始。


