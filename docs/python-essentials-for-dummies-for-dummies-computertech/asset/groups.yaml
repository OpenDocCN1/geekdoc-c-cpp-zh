    # 第 12 章

    与互联网交互


    正如你可能知道的，互联网是几乎世界上所有知识的家。我们大多数人一直在使用网络来寻找信息。我们通过使用 Safari 或 Google Chrome 这样的网络浏览器来实现。要访问网站，你需要在浏览器的地址栏中输入统一资源定位符
    (URL) 并按回车，或者点击一个自动将你带到页面的链接。这是我们书中中最复杂的一个章节，但它也是最有趣的章节之一。


    作为使用网络浏览器浏览网页的替代方案，你可以通过编程访问其内容。换句话说，你可以使用 Python 等编程语言向网络发布信息，并访问网络信息。在本章中，你将学习使用
    Python 编程访问网络的两个主要模块：`urllib` 和 `BeautifulSoup`。


    # 了解网页的工作原理


    当你打开网络浏览器并输入 URL 或点击链接时，该操作会向互联网发送一个请求。互联网将你的请求定向到适当的 Web 服务器，服务器反过来向你的计算机发送响应。通常，该响应是一个网页，但也可以是任何文件。或者，如果你请求的内容在某处不再存在，它也可能是一条错误消息。但重要的一点是，你（即用户（人类））以及你的用户代理（你用来访问互联网的程序）都处于客户端侧。服务器仅仅是一台电脑，而不是人，它发回它的响应，如图
    12-1 所示。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_157_0.png)


    图 12-1：客户端发送请求，服务器返回响应。


    # 理解神秘的 URL


    URL 是访问网页的关键部分，因为互联网通过这种方式找到你正在寻找的资源。在 Web 上，大多数资源使用超文本传输协议 (HTTP)，因此它们的 URL 以
    `http://` 或 `https://` 开头。区别在于 http 以其原始形式发送内容，这使其容易受到黑客或其他可以“嗅探”流量的攻击。`https`
    协议是安全的，因为它对数据进行了加密。


    作为网络浏览器访问网页的替代方案，你可以编程访问其内容。URL 还可以包含一个路径，注意在域名后面紧跟的是一个斜杠 (`/`)。URL 还可以包含查询字符串，它始终以问号
    (`?`) 开头。在问号之后是一个或多个键值对，这与你在数据或 JSON 字典中看到的语法非常相似。如果存在多个键值对，它们通过 ampersands (`&`)
    分隔。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_158_0.png)


    https://alansimpson.me/python/cheats/index.html


    ![](img/ca342ce31cd39db62dca2143d5fa4229_158_1.png)


    ![](img/ca342ce31cd39db62dca2143d5fa4229_158_2.png)


    图 12-2：URL 的不同部分。


    # 头部信息


    当你访问网络时，头部提供了有关请求和响应的信息。你看到的头部对用户是隐藏的，但你可以使用浏览器的开发工具查看它们。头部告诉了你正在使用的浏览器以及许多其他细节。


    最重要的头部是 `User-Agent`，它告诉服务器你正在使用的浏览器，以及 `Content-Type`，它告诉服务器正在发送的数据类型。其他头部还包括
    `Cookie`（用于跟踪你的会话）和 `Cache`。


