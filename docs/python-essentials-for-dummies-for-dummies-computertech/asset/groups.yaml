    \n## Keeping Your App From Crashing\n\nYou can stack up `except:` statements in\
    \ a try block to handle different errors. Just be aware when the exception occurs,\
    \ it looks each one starting at the top. If it finds a handler that matches the\
    \ exception, it raises that one. If some exception occurred that you didn't handle,\
    \ you get the standard Python error message. There’s a way around that, too.\n\
    \nIf you want to avoid all Python error messages, you can start the last exception\
    \ handler in the code with `except Exception:`. That line means “If the error\
    \ that occurred wasn’t already handled by one of the previous exceptions, use\
    \ the exception handler instead.”\n\n## Adding an else to the Mix\n\nIn the previous\
    \ example, we used one error handler to handle file-found errors, and a second\
    \ handler for everything. But in real life, you may have to handle many kinds\
    \ of errors. So there may be `except:` blocks for various errors. But what if\
    \ none of the errors you're trying to catch occurs? In that case, you want code\
    \ execution to proceed normally. You can add an `else:` block to your code to\
    \ handle the situation when there is no error to catch.\n\n```python\ntry:\n \
    \   # The thing that might cause an exception\nexcept a common exception:\n  \
    \  # Explain the problem\nexcept Exception as e:\n    # Show the generic error\
    \ message\nelse:\n    # Continue on here only if no exceptions raised\n```\n\n\
    If you convert this code to plain English, the logic of the flow is as follows:\n\
    \n- Try to open the file.\n- If the file isn’t there, tell the user and stop.\n\
    - If there’s some other error, show the generic error message and stop.\n- Otherwise\n\
    - Go on with the rest of the code.\n\nBy limiting `try:` to the thing that's most\
    \ likely to raise an exception, we can stop the code dead in its tracks before\
    \ it tries to go any further. If no exception is raised, the code continues on\
    \ normally, below the `else`, where the previous exception handlers don't matter\
    \ anymore. Here is all the code with comments explaining what's going on:\n\n\
    ```python\ntry:\n    # Open the file named people.csv\n    the_file = open('people.csv')\n\
    # Watch for common error and stop program if it happens.\nexcept FileNotFoundError:\n\
    \    print(\"Sorry, I don't see a file named people.csv here\")\n# Catch any unexpected\
    \ error.\nexcept Exception as err:\n    print(err)\n# Otherwise, if nothing bad\
    \ has happened by now,\n# just keep going.\nelse:\n    # File must be open by\
    \ now if we got here.\n    print('\\n') # Print a blank line.\n    # Print each\
    \ line from the file.\n    for one_line in the_file:\n        print(one_line)\n\
    \    the_file.close()\n    print(\"Success!\")\n```\n\nAs with Python, indentations\
    \ matter a lot. Make sure you indent your own code as shown in this chapter. Otherwise,\
    \ your code will not work.\n\nFigure 9-6 also shows the code and the results of\
    \ running that in VS Code.\n\n```python\nshowfilecontents.py >\ntry:\n    # Open\
    \ the file named people.csv\n    the_file = open('people.csv')\n# Watch for common\
    \ error and stop program if it happens.\nexcept FileNotFoundError:\n    print(\"\
    Sorry, I don't see a file named people.csv here\")\n# Catch any unexpected error.\n\
