    # TABLE 6-1 Python Comparison Operators for Decision-Making


    | Operator | Meaning |

    | --- | --- |

    | == | Is equal to |

    | != | Is not equal to |

    | < | Is less than |

    | > | Is greater than |

    | <= | Is less than or equal to |

    | >= | Is greater than or equal to |


    Python also offers three logical operators, also called Boolean operators, which
    enable you assess multiple comparisons before making a final decision. These operators
    use the English word for, well, basically what they mean, as shown in Table 6-2.


    # TABLE 6-2 Python Logical Operators


    | Operator | Meaning |

    | --- | --- |

    | and | Both are true |

    | or | One or the other is true |

    | not | Is not true |


    All these operators are often used with if ... then ... else decisions to control
    what an app or program does. To make such decisions, you use the Python if statement.


    # Making Decisions with if


    The word if is used a lot in all apps and computer programs to make decisions.
    The simplest syntax for if follows:


    ```

    if condition: do this

    do this no matter what

    ```'
