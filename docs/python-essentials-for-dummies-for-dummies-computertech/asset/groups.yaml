- md: "\nWith this method, the file remains open until you specifically close it using\
    \ the file variable name and the .close() method, like this:\n\n```\nf.close()\n\
    ```\n\nMake sure that your apps close any files they no longer need open. Failure\
    \ to do so allows open file handlers to accumulate, which can eventually cause\
    \ the app to throw an exception and crash, perhaps corrupting some of the files\
    \ along the way.\n\nThe second way to open a file is by using a context manager\
    \ or contextual coding. Contextual coding starts with the word with. You still\
    \ assign a variable name, but you do so near the end of the line. The last thing\
    \ on the line is a colon, which marks the beginning of the with block. All indented\
    \ code below is assumed to be relevant to the context of the open file (like code\
    \ inside a loop). At the end of contextual coding, you don't need to close the\
    \ file because Python does it automatically:\n\n```python\n# Contextual syntax\n\
    open('quotes.txt') as f:\n    filecontents = f.read()\n    print(filecontents)\n\
    \n# The unindented line below is outside the with...\nblock;\nprint('File is closed:\
    \ ', f.closed)\n```\n\nFor the rest of this chapter, we stick with contextual\
    \ syntax because it's generally the preferred and recommended syntax and a good\
    \ habit to acquire right from the start.\n\n## Reading a File's Contents\n\nPreviously\
    \ in this chapter, you saw how you can use .read() to read the contents of an\
    \ open file. But that's not the only way to read a file. You have three choices:\n\
    \n- read([size]): Reads the entire file if you leave the parentheses empty. If\
    \ you specify a size inside the parentheses, it reads that many characters (for\
    \ a text file) or that many bytes (for a binary file).\n- readline(): Reads one\
    \ line of the contents from a text file — the line ends where there's a newline\
    \ character. (The newline character, \\n, ends the line that's displayed and moves\
    \ the cursor down to the next line.)\n- readlines(): Reads all the lines of a\
    \ text file into a list.\n\nBoth the read() and readline() methods read in the\
    \ entire file simultaneously. The only difference is that read reads in the file\
    \ as one big chunk of data, whereas readlines() reads in the file one line at\
    \ a time and stores each line as an item in a list. For example, the following\
    \ code opens quotes.txt, reads in all the contents, and then displays it:\n\n\
    ```python\nwith open('quotes.txt') as f:\n    # Read in entire file\n    content\
