- md: "\nYou can use generative AI to write code for opening and looping through files.\
    \ For example, ask Copilot or ChatGPT to write python code to open a text file\
    \ named whatever.txt and loop through its contents. Include exception handler\
    \ for file not found. Then just modify the code it generates to suit your needs.\n\
    \n## Appending versus overwriting files\n\nAnytime you work with files, it's important\
    \ to understand the difference between write and append. If a file contains information\
    \ and you open it in write mode and then write to it, your new content will overwrite\
    \ (replace) whatever is already in the file. There is no undo for this. If the\
    \ content of the file is important, you want to make sure you don't make that\
    \ mistake. Add content to the end of a file, open the file in append (a) mode,\
    \ and then use `write` to write to the file.\n\n## Using tell() to determine the\
    \ pointer location\n\nWhen you loop through a file, its contents are read top\
    \ to bottom and left to right. Python maintains a pointer to keep track of where\
    \ it is in the file. When you're reading a text file with readline(), the pointer\
    \ is always the character position of the next line in the file.\n\n## Moving\
    \ the pointer with seek()\n\nWhereas the `tell()` method tells you where the pointer\
    \ is in an external file, the `seek()` method enables you to reposition the pointer.\
    \ Your syntax is\n\n```\nfile.seek(position[,whence])\n```\n\nReplace `file` with\
    \ the variable name of the open file. Replace `position` to indicate where you\
    \ want to put the pointer. For example, `0` moves the pointer back to the top\
    \ of the file. The `whence` is optional; you can use it to indicate where in the\
    \ file to set the pointer position. Your choices are:\n\n- 0: Set the position\
    \ relative to the start of the file.\n- 1: Set the position relative to the current\
    \ pointer position.\n- 2: Set the position relative to the end of the file. Use\
    \ a negative number for `position`.\n\nIf you omit the whence value, it defaults\
    \ to 0.\n\nBy far the most common use of seek is just to reset the pointer back\
    \ to the top of the file for another pass through the file. The syntax for this\
    \ is simply .seek(0).\n\n## Reading and Copying a Binary File\n\nSuppose you have\
    \ an app that changes a binary file, and you want to always work with a copy of\
    \ the original file to play it. Binary files can be huge, rather than opening\
    \ it all at once and risking running out of memory, you can read it in chunks\
    \ and write it out in chunks. Binary files do not have human-readable content.\
    \ Now they have lines of text. readline() aren't a good choice for looping through\
    \ binary files, but you can use .read() with a specified size.\n\nFigure 10-2\
    \ shows the binarycopy.py file, which makes a copy of any binary file. We take\
    \ you through that code step-by-step so that can understand how it works.\n\n\
    ```python\nbinarycopy.py\n# Specify the file to copy\nfile_to_copy = 'happy_pickle.jpg'\n\
    # Create new file name with copy before the extension.\nname_parts = file_to_copy.split('.')\n\
    new_file = name_parts[0] + '_' + name_parts[1]\n# Open the original file as read-only\
    \ binary.\nwith open(file_to_copy, 'rb') as original_file:\n    # Create or open\
    \ file to copy into.\n    with open(new_file, 'wb') as copy_to:\n        # Grab\
    \ a chunk of the original file (4KB).\n        chunk = original_file.read(4096)\n\
    \        # Loop until there are no more chunks.\n        while len(chunk) > 0:\n\
    \            copy_to.write(chunk)\n            # Make sure you read the next chunk\
    \ in this loop.\n            chunk = original_file.read(4096)\n    # Close is\
    \ automatic after loops, show message.\n    print('Done!')\n```\n\nFigure 10-2:\
    \ The binarycopy.py file copies any binary file.\n\nFigure 10-3 shows the results\
    \ of running the code. The Terminal simply shows Done. But as you can see, there's\
    \ now a file named happy_pickle_copy.jpg in the folder. Opening this file will\
    \ prove that it is a copy of the original file.\n\nPython Essentials For Dummies\n\
    126\n\n![](img/ca342ce31cd39db62dca2143d5fa4229_138_0.png)\n\nFIGURE 10-3: Running\
    \ binarycopy.py added happy_pickle_copy.jpg to the folder.\n\nCHAPTER 10 Working\
    \ with External Files 127\n\n## IN THIS CHAPTER\n\n- Discovering how to organize\
    \ JSON data\n- Learning about serialization\n- Importing data from JSON files\n\
    - Exporting Python data to JSON\n\n## Chapter 11: Juggling JSON Data\n\nJavaScript\
    \ Object Notation (JSON) is a common marshall format for object-oriented data.\
    \ Marshalling format generally means a format used to send data from one computer\
    \ to another. However, some databases, such as the free Realtime Database at Google's\
    \ Firebase, store the data in JavaScript Object Notation format as well. The name\
    \ JavaScript at the front sometimes throws people off, especially when you're\
    \ using Python, not JavaScript, to write your code. But don't worry. The format\
    \ just got its start in the JavaScript world and is now widely known general-purpose\
    \ format used with all kinds of computers and programming languages.\n\nIn this\
    \ chapter, you learn exactly what JSON is, as well as how to export and import\
    \ data to and from JSON. If you find that all the buzzwords surrounding JSON make\
    \ you uncomfortable, again, don't worry. We get through all the jargon first.\
    \ As you'll see, JSON data is formatted almost the same way as Python dictionaries,\
    \ so there won't be a lot of new stuff to learn. Also, you already have the free\
    \ Python JSON module, which makes it even easier to work with JSON data.\n\nCHAPTER\
    \ 11 Juggling JSON Data 129\n\n## Organizing JSON Data\n\nJSON data is roughly\
    \ the equivalent of a dictionary in Python, which makes JSON files fairly easy\
    \ to work with. JSON data is probably easily to understand when it's compared\
    \ to tabular data. For instance, Figure 11-1 shows some tabular data in an Excel\
    \ sheet. Figure 11-2 shows the same data converted to JSON format. Each row of\
    \ data in the Excel sheet has been converted to a dictionary of `key`: value pairs\
    \ in the JSON file. And there are, course, of curly braces to indicate that the\
    \ data is an object.\n\n| A | B | C | D | E |\n|---|---|---|---|---|\n| 1 | Angst,\
    \ Annie | 1982 | 1/11/2011 | TRUE | $300.00 |\n| 2 | Boñas, Barry | 1973 | 2/3/2003\
    \ | FALSE | -$123.45 |\n| 3 | Schadenfreude, Sandy | 2004 | 3/3/2008 | TRUE |\
    \ $0.00 |\n| 4 | Weltschmerz, Wanda | 1995 | 4/24/1994 | FALSE | $999.999 |\n\
    | 5 | Malaise, Pindy | 2006 | 5/5/2005 | TRUE | $454.01 |\n| 6 | O'Possum, Ollie\
    \ | 1987 | 7/27/1997 | TRUE | -$1,000.00 |\n| 7 | | | | | |\n| 8 | | | | | | |\n\
    | 10 (8) | | | | | |\n| 9 | Pusillanimity, Pamela | 1979 | 8/8/2008 | TRUE | $12,345.67\
    \ |\n\nFigure 11-1: Some data in an Excel spreadsheet.\n\n![](img/ca342ce31cd39db62dca2143d5fa4229_141_0.png)\n\
    \nFigure 11-2: Excel data converted to JSON.\n\n130 Python Essentials For Dummies\n\
    \nTo convert existing Excel data to JSON, choose File �� Export or File �� Save\
    \ As from Excel’s menu and export to CSV (Comma Delimited). You can use similar\
    \ techniques to export CSV from Google Sheets and Apple’s Numbers app. After you\
    \ have a CSV file, you can use the convert.com website to convert to JSON. Look\
    \ for the Convert CSV to JSON option at the site, and follow the onscreen instructions.\n\
    \nExporting data from Excel is just one way to create a JSON file. You can also\
    \ create a keyed JSON file, in which each chunk of data has a single key that\
    \ uniquely identifies it. (No other dictionary in the same file can have the same\
    \ key.) The key can be a number or text; it doesn’t really matter, as long as\
    \ it’s unique to each item. When you’re downloading JSON files created by someone\
    \ else, on Alan’s personal website, he uses the Google Firebase Realtime Database\
    \ to count hits per page and other information about each page. The Realtime Database\
    \ stores the data as shown in Figure 11-3. Those weird things like ~LAQOxg6kmPb4jhniQXS\
    \ are all keys that the Firebase generates automatically for each item of data\
    \ to guarantee uniqueness. + sign next to each key allows you to expand and collapse\
    \ the information under each key.\n\nFigure 11-3: Some data in a Google Firebase\
    \ Realtime Database.\n"
  mdcn: "\n你可以使用生成式 AI 来编写用于打开和遍历文件的代码。例如，让 Copilot 或 ChatGPT 编写 Python 代码来打开一个名为\
    \ `whatever.txt` 的文本文件并遍历其内容。包含一个针对未找到文件的异常处理。然后，只需对它生成的代码进行修改以适应你的需求即可。\n\n##\
    \ 追加文件与覆盖文件\n\n每当你处理文件时，理解写入（write）和追加（append）之间的区别都至关重要。如果一个文件包含信息，而你以写入模式打开它并对其进行写入，你的新内容将覆盖（替换）文件中已有的任何内容。这种操作是无法撤销的。如果文件内容很重要，你希望确保自己不要犯这个错误。要向文件末尾添加内容，请以追加（a）模式模式打开文件，然后使用\
    \ `write` 向文件写入内容。\n\n## 使用 tell() 确定指针位置\n\n当你遍历一个文件时，其内容是从上到下、从左到右被读取的。Python\
    \ 维护一个指针来跟踪它在文件中的位置。当你使用 `readline()` 读取文本文件时，指针始终位于文件中下一行的字符位置。\n\n## 使用 seek()\
    \ 移动指针\n\n`tell()` 方法告诉你指针在外部文件中的位置，而 `seek()` 方法则允许你重新定位指针。其语法为：\n\n```\nfile.seek(position[,whence])\n\
    ```\n\n将 `file` 替换为打开的文件变量名。将 `position` 替换为你想放置指针的位置。例如，`0` 将指针移回文件开头。`whence`\
    \ 是可选的，你可以用它来指定在文件的哪个位置设置指针位置。你有：\n\n- 0：相对于文件开头设置位置。\n- 1：相对于当前指针位置设置位置。\n- 2：相对于文件末尾设置位置。对\
    \ `position` 使用负数。\n\n如果你省略了 `whence` 值，它默认为 0。\n\n到目前为止，`seek` 最常见的用法仅仅是将指针重置回文件开头，以便再次遍历文件。该操作的语法简单为\
    \ `.seek(0)`。\n\n## 读取和复制二进制文件\n\n假设你有一个更改二进制文件的应用程序，并且你希望始终在原始文件的副本上进行操作。二进制文件可能非常巨大，与其一次性打开所有内容以面临内存溢出的风险，你可以分块读取并分块写入。二进制文件没有人类可读的内容。它们不像现在那样有文本文本。`readline()`\
    \ 不是遍历二进制文件的良好选择，但你可以使用指定大小的 `.read()`。\n\n图 10-2 显示了 `binarycopy.py` 文件，它可以创建任何二进制文件的副本。我们将逐步带你了解这段代码，以便你理解它是如何运行的。\n\
    \n```python\nbinarycopy.py\n# 指定要复制的文件\nfile_to_copy = 'happy_pickle.jpg'\n# 在扩展名之前通过添加\
    \ copy 创建新文件名。\nname_parts = file_to_copy.split('.')\nnew_file = name_parts[0]\
    \ + '_' + name_parts[1]\n# 以只读二进制模式打开原始文件。\nwith open(file_to_copy, 'rb') as original_file:\n\
    \    # 创建或打开用于复制的文件。\n    with open(new_file, 'wb') as copy_to:\n        # 获取原始文件的一个数据块\
    \ (4KB)。\n        chunk = original_file.read(4096)\n        # 循环直到没有更多数据块。\n \
    \       while len(chunk) > 0:\n            copy_to.write(chunk)\n            #\
    \ 确保在此循环中读取下一个数据块。\n            chunk = original_file.read(4096)\n    # 循环后自动关闭，显示消息。\n\
    \    print('Done!')\n```\n\n图 10-2：`binarycopy.py` 文件复制任何二进制文件。\n\n图 10-3 显示了运行代码的结果。终端仅显示\
    \ `Done`。但如你所见，文件夹中现在有一个名为 `happy_pickle_copy.jpg` 的文件。打开这个文件将证明它是原始文件的副本。\n\n\
    Python Essentials For Dummies\n126\n\n![](img/ca342ce31cd39db62dca2143d5fa4229_138_0.png)\n\
    \n图 10-3：运行 `binarycopy.py` 向文件夹添加了 `happy_pickle_copy.jpg`。\n\n第 10 章 处理外部文件\
    \ 127\n\n## 本章内容\n\n- 发现如何组织 JSON 数据\n- 学习序列化\n- 从 JSON 文件导入数据\n- 将 Python 数据导出到\
    \ JSON\n\n## 第 11 章：玩转 JSON 数据\n\nJavaScript Object Notation (JSON) 是一种面向对象数据的常用标记格式（marshalling\
    \ format）。标记格式通常意味着用于将数据从一台计算机发送到另一台计算机的格式。然而，某些数据库（例如 Google Firebase 的免费 Realtime\
    \ Database）也以 JavaScript Object Notation 格式存储数据。开头的 JavaScript 一词有时会让人们感到困惑，尤其是当你使用\
    \ Python 而不是 JavaScript 来编写代码时。但别担心。这种格式起源于 JavaScript 世界，现在已是广为人知的、适用于各种计算机和编程语言的通用格式。\n\
    \n在本章中，你将确切学习 JSON 是什么，以及如何向 JSON 导出和从中导入数据。如果你发现围绕 JSON 的所有术语让你感到困惑，请别担心。这种格式只是起源于\
    \ JavaScript 世界，现在已是广为人知的、适用于各种计算机和编程语言的通用格式。由于 JSON 与字典非常相似，你已经有了 `json` 模块，这让处理\
    \ JSON 变得更加容易。\n\n## 处理 JSON 数据\n\n第 11 章 玩转 JSON 数据 129\n\n##  JSON 数据\n\nJSON\
    \ 是一种组织数据的常用方式。JSON 数据与表格数据非常相似，图 11-1 显示了某些表格数据。图 11-2 显示了转换为 JSON 的数据。\n\n|\
    \ A | B | C | D | E |\n|---|---|---|---|---|\n| 1 | Annie | 1982 | 1/11/2011 |\
    \ TRUE | $300.00 |\n| 2 | Barry | 1973 | 2/3/2003 | FALSE | -$123.45 |\n| 3 |\
    \ Sandy | 2004 | 3/3/2008 | TRUE | $0.00 |\n| 4 | Wanda | 1995 | 4/24/1994 | FALSE\
    \ | $999.99 |\n| 5 | Pindy | 2006 | 5/5/2005 | TRUE | $454.01 |\n| 6 | Ollie |\
    \ 1987 | 7/27/1997 | TRUE | -$1,000.00 |\n| 7 | | | | |\n| 8 | | | | |\n| 10 (8)\
    \ | | | | |\n| 9 | Pamela | 1979 | 8/8/2008 | TRUE | $12,345.67 |\n\n**图 11-1：Excel\
