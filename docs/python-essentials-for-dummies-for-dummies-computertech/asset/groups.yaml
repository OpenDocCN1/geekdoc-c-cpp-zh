    大多数时候，你可能会经常用到 `request` 模块，因为它允许你从互联网打开资源。从库中访问单个包的语法如下：


    ```python

    from library import module

    ```


    其中 `library` 是较大库的名称，`module` 是模块的名称。要访问 `urllib` 中 `response` 模块的功能，请在代码顶部使用以下语法（注释行是可选的）：


    ```python

    # 从 urllib 库导入 request 模块

    from urllib import request

    ```


    要打开网页，请使用此语法：


    ```

    variablename = request.urlopen(url)

    ```


    将 `variablename` 替换为你自定义的变量名。将 `url` 替换为你想要访问的资源的 URL，并用单引号或双引号（除非它存储在变量中）。


    运行代码时，结果将是一个 `HttpResponse` 对象。


    例如，你可以在 `.py` 文件中运行以下代码，以访问 Alan 为此目的添加到其网站的示例 HTML 页面：


    ```python

    # 从 urllib 库导入 request 模块

    from urllib import request

    # 目标页面的 URL（地址）。

    sample_url = ''https://freeasy.ai/sample.html''

    # 请求页面并将其放入名为 the_page 的变量中

    the_page = request.urlopen(sample_url)

    # 将响应状态码放入名为 status 的变量中

    status = the_page.code

    # 页面的数据类型是什么？

    print(type(the_page))

    # 状态码是什么？

    print(status)

    ```


    运行此代码将显示此输出：


    ```

    <class ''http.client.HttpResponse''

    200

    ```


    名为 `the_page` 的变量包含一个 `http.client.HttpResponse` 对象，它包含了服务器响应请求返回的所有内容。`200` 是状态码，告诉你是一切正常。


    ## 使用 Python 向网页发布内容


    并不是所有访问网络资源的尝试都能像前面的示例那样顺利。例如，在你的浏览器的地址栏中输入以下 URL 并按回车键：


    ```

    https://www.google.com/search?q=python web scraping tutorial

    ```


    Google 返回了许多包含“python web scraping tutorial”关键词的搜索结果页面和视频。如果你查看地址栏，可能会发现你输入的 URL
    发生了细微变化。空格已全部替换为 `%20`，如下行代码所示：


    ```

    https://www.google.com/search?q=python%20web%20scraping%20tutorial

    ```


    `%20` 是空格的十六进制 ASCII 编码。我们可能熟悉 `%20`，因为 HTTP 不支持在 URL 中使用字面空格。如果需要，传输完成后可以将 `%20`
    回空格。


    现在看看如果使用 Google URL 而不是原始 URL 运行代码会发生什么。以下是该代码：


    ```python

    from urllib import request

    # 目标页面的 URL（地址）。

    sample_url = ''https://www.google.com/search?q=python%20web%20scraping%20tutorial''

    # 请求页面并将其放入名为 tpage 的变量中

    the_page = request.urlopen(sample_url)

    # 将响应状态码放入名为 status 的变量中

    status = the_page.code

    # 页面的数据类型是什么？

    print(type(the_page))

    # 状态码是什么？

    print(status)

    ```


    运行这段代码时，事情并不顺利。你可能会看到几个错误信息，但最重要的信息是：


    `HTTPError: HTTP Error 403: Forbidden`


    错误并不是你的代码出的问题，而是一个 HTTP 错误。具体来说，它是错误代码 403 `Forbidden`（禁止访问）。URL 已发送给 Google，它回答说：“抱歉，你可以通过浏览器搜索我们的网站，但不能通过像这样的
    Python 代码。”


    好消息是，那些不允许你直接使用 Python 或其他编程语言发布内容的网站，允许你通过它们的 API（应用程序编程接口）来发布内容。你仍然可以使用 Python
    作为你的编程语言，你只需要遵守它们的规则即可。


    ## 使用 Python 爬取网页


    每当你从网络请求页面时，它交付给你的的是一个通常由 HTML 和内容组成的页面。HTML 是一种标记语言，配合另一种名为 CSS 的语言，告诉浏览器根据大小、位置、字体、图像以及所有此类视觉、样式标记来显示内容。在浏览器中，你看不到
    HTML 或 CSS 代码。你只能看到内容，这些内容通常包含在页面 HTML 代码块中。


    尽管你在网页上看到的大部分数据来自数据库，但你没有权限直接访问数据库。不过，你可以使用名为“网络爬虫”（web scraping）的技术从网页中提取数据，供其他方式使用。Python
    具有强大的网络爬取能力，这是大多数人想学习的热门话题。因此，我们将从图 12-5 中的示例页面作为工作示例开始学习网络爬虫。


    Python 3 速表


    ![](img/ca342ce31cd39db62dca2143d5fa4229_164_0.png)


    图 12-5：用于网络爬取的示例页面。


    告诉浏览器如何显示页面内容的代码在浏览器中不可见的，除非你查看源代码。在大多数浏览器中，你可以通过按 F12 键或在页面空白处点击右键并选择“查看源代码”或其他选项来实现这一点。在大多数网页上，真实内容——你在浏览器中看到的内容——位于
    `<body>` ... `</body>` 标签之间。在页面主体内，可能会有头部、导航栏、页脚、可能还有广告等部分。在该特定页面中，内容的实质位于 `<article>`
    ... `</article>` 标签之间。你在图 12-5 页面上看到的每个方块被称为*卡片*（card），并且每个卡片都被定义为 `<a>` ... `</a>`
    标签中的链接。


    图 12-6 显示了图 12-5 页面的一些 HTML 代码。我们展示了页面中前两个链接的代码，但所有链接都遵循相同的结构，并且它们都包含在由 `<article>`
    ... `</article>` 标签标记的部分中。


    在 Python 代码中，你需要三个模块。其中一个是 `urllib` 模块，它允许你向网络发送资源请求并读取网络提供的内容。这是 Python 自带的标准模块之一，所以你不需要获取任何新东西。


    对于网络爬虫，你还需要 `BeautifulSoup`（其模块名源自《爱丽丝梦仙游》书中的一首歌）。该模块提供了工具用于解析你检索的网页，以获取你感兴趣的特定数据项。Python
    本身没有自带 BeautifulSoup，所以你必须使用 `pip` 安装它。在 VS Code 中，转到终端（Terminal）面板。如果你使用的是 Windows，输入你的命令行：


    `pip install beautifulsoup4`


