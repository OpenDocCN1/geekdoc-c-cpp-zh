    ## Formatting percent numbers


    Now, suppose your app applies sales tax. The app needs to know the sales tax rate,
    which should be expressed as a decimal number. So if the sales tax rate is 6.5
    percent, it has to be written as 0.065 (or .065, if you prefer) in your code,
    like this:


    ```python

