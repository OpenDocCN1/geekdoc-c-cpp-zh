    \    print(the_file.name)\n    print(the_file.readlines())\nexcept FileNotFoundError:\n\
    \    print(\"Sorry, I don't see a file named people.csv\")\n```\n\n诚然，隔离未找到文件的错误对于解决错误的方法名没有帮助。然而，错误的方法名并不是一个异常；它是一个编程错误，需要通过将\
    \ `.readlines()` 替换为你想使用的的方法在代码中进行纠正。至少，你看到的错误信息不是那个误导性的“Sorry, I don't see a\
    \ file named people.csv here”错误。代码正常运行，因此在指令下会显示文件名。当它运行到包含错误的 `readlines()` 的行时，它会抛出一个错误——但不是与未找到文件相关的错误。它显示了该错误的正确错误信息\
    \ `object has no attribute 'readlines'`，如图 9-5 所示。\n\n![](img/ca342ce31cd39db62dca2143d5fa4229_121_0.png)\n\
