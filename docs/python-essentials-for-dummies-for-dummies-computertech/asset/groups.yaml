    ## Calculating Numbers with Functions


    A function in Python is similar to a function on a calculator, in that you pass
    something into the function, and the function passes something back. For example,
    most calculators and programming languages have a square root function: You provide
    a number, and they tell you the square root of that number.


    Python functions generally have the syntax:


    ```python

    variablename = functionname(param[, param[, ... ]])

    ```


    Because most functions return some value, you typically start by defining a variable
    to store what the function returns. Follow that with the = sign and the function
    name, followed by a pair of parentheses. Inside the parentheses you may pass one
    or more values (called parameters) to the function.


    For example, the abs() function accepts one number and returns the absolute value
    of that number. If you''re not a math nerd, this just means that if you pass a
    negative number, it returns the same number as a positive number. If you pass
    a positive number, it returns the same number you passed it. In other words, the
    abs() function simply converts negative numbers to positive numbers.


    Here''s an example (which you can try out for yourself hands-on) at the Python
    prompt or in a .py file in VS Code:


    ```python

    x = -4

    y = abs(x)

    print(x)

    print(y)


    -4

    4

    ```


    Here, we created a variable named x and assigned it the value -4. Then we created
    a variable y and assigned it the absolute value of x using the abs() function.
    Printing x shows its value, -4, which hasn''t changed. Printing y shows 4, the
    absolute value of x as returned by the abs() function.


    Python has many built-in functions for working with numbers, as shown in Table
    5–1. Some may not mean much to you if you''re not into math in a big way, but
    don''t let that intimidate you. If you don''t understand what a function does,
    chances it''s not something relevant to the kind of work you do. But if you''re
    curious, you can always search the web for python followed by the function name
    for more information. For a more extensive list, search for python 3 built-in
    functions.


    ### TABLE 5-1 Some Built-In Python Functions for Numbers


    | Built-In Function | Purpose |

    |---|---|

    | abs(x) | Returns the absolute value of number x (converts negative numbers to
    positive). |

    | bin(x) | Returns a string representing the value of x converted to binary. |

    | float(x) | Converts a string or number x to the float data type. |

    | format(x, y) | Returns x formatted according to the pattern specified in y.
    Older syntax has been replaced with f-strings in current Python versions. |

    | hex(x) | Returns a string containing x converted to hexadecimal, prefixed with
    0x. |

    | int(x) | Converts x to the integer data type by truncating (not rounding) the
    decimal position and any digits after it. |

    | max(x, y, z, ...) | Takes any number of numeric arguments and returns whichever
    is the largest. |

    | min(x, y, z, ...) | Takes any number of numeric arguments and returns whichever
    is the smallest. |

    | round(x, y) | Rounds the number x to y number of decimal places. |

    | str(x) | Converts the number x to the string data type. |

    | type(x) | Returns a string indicating the data type of x. |


    You can also nest functions — meaning that you can put functions inside functions.
    For example, when z = -999.9999, the expression print(int(abs(z))) prints the
    integer portion of the value of z, which is 999. The original number is converted
    to positive, and then the decimal point and everything to its right are chopped
    off.


    ## Still More Math Functions


    In addition to the built-in functions covered so far, there are still others that
    you can import from the math module. If you need them in an app, put import math
    near the top of the .py file to make those functions available to the rest of
    the code. Or to use them at the command prompt, first enter the import math command.


    One of the functions in the math module is the sqrt() function, which gets the
    square root of a number. Because it''s part of the math module, you can''t use
    it without importing the module first. For example, if you enter the following,
    you''ll get an error because sqrt() isn''t a built-in function:


    ```python

    print(sqrt(81))

    ```


    Even if you do two commands like the following, you''ll still get an error because
    you''re treating sqrt() as a built-in function:


    ```python

    import math

    print(sqrt(81))

    ```


    To use a function from a module, you have to import the module and precede the
    function name with the module name and a dot. So let''s say you have value, x,
    and you want the square root. You have to import the math module and use math.sqrt(x)
    to get the correct answer, as shown in Figure 5-1. Entering that command shows
    9.0 as the result, which is indeed the square root of 81.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_55_0.png)


    Figure 5-1: Using the sqrt() function from the math module.


    ### TABLE 5-2 Some Functions from the math Module


    | Built-In Function | Purpose |

    |---|---|

    | acos(x) | Returns the arccosine of x in radians. |

    | atan(x) | Returns the arctangent of x in radians. |

    | atan2(y, x) | Returns the arctangent of y divided by x in radians. |

    | ceil(x) | Returns the smallest integer greater or equal to x. |

    | cos(x) | Returns the cosine of x in radians. |

    | degrees(x) | Converts angle x from radians. |

    | exp(x) | Returns e raised to the power of x. |

    | factorial(x) | Returns the factorial of x. |

    | floor(x) | Returns the largest integer less than or equal to x. |

    | isnan(x) | Returns True if x is NaN. |

    | log(x) | Returns the logarithm of x. |

    | log2(x) | Returns the base-2 logarithm of x. |

    | pi | Returns the mathematical constant pi. |

    | pow(x, y) | Returns x to to the power y. |

    | radians(x) | Converts angle x from degrees. |

    | sqrt(x) | Returns the square root of x. |

    | sin(x) | Returns the sine of x in radians. |

    | tan(x) | Returns the tangent of x in radians. |

    | tau | Returns the mathematical constant tau. |


    ## Formatting Numbers


    Over the years, Python has offered different methods for displaying numbers in
    formats familiar to us. For example, most people would rather see 1234.56 than
    1234.5600695950. The easiest way to format numbers in Python, starting with version
    3.6, is to use f-strings.


    ## Formatting with f-strings


    Format strings, or f-strings, are the easiest way to format data. All you need
    is a lowercase f or uppercase F followed by some text or expressions enclosed
    in quotation marks. Here is an example:


    ```python

    f"Hello {username}"

    ```


    The f before the first quotation mark tells Python that follows is a format string.
    Inside the quotation marks, the text, called the literal part, is displayed literally
    (as typed). Anything in curly braces is the expression part of the f-string, a
    placeholder for what will appear when the code executes. Inside curly braces,
    you can have an expression (a formula to perform some calculation, a variable
    name, or a combination of the two).


    ## Showing dollar amounts


    When you run this code, the print function displays the word Hello, followed by
    a space, followed by the contents of the username variable, as shown in Figure
    5-2.


    ```python

    username = "Alan"

    print(f"Hello {username}")

    ```


    FIGURE 5-2: A super simple f-string for formatting.


    Here is another example of an expression — the formula quantity times unit price
    inside the curly braces:


    ```python

    unit_price = 49.99

    quantity = 30

    print(f"Subtotal: ${quantity * unit_price}")

    ```


    The output from that, when executed, follows:


    ```

    Subtotal: $1499.7

    ```


    That $1499.7 isn''t an ideal way to show dollar amounts. Typically, we like to
    use commas in the thousands places, and two digits for the pennies, as in the
    following:


    ```python

    Subtotal: $1,499.70

    ```


    Fortunately, f-strings provide you with the means to do this formatting, as you
    learn next.


    To get a comma to appear in the dollar amount and the pennies as as two digits,
    you can use a format string inside the curly braces of an expression in an f-string.
    The format string starts with a colon and needs to be placed inside the closing
    curly brace, right up against the variable name or the value shown.

