    ```

    howdy

    ```


    按下回车后，你会看到一些技术术性的乱码，它们试图告诉你解释器不知道 "howdy" 是什么意思，它无法执行操作。什么都没有坏坏。你只是回到了另一个 >>>
    提示符，你可以再次尝试，如图 2-2 所示。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_24_0.png)


    FIGURE 2-2：Python 不知道 howdy 是什么。


    # 使用 Python 内置帮助


    图 2-2 中的提示符之一提到，你可以在 Python 解释器中输入 help 作为命令。注意不要输入引号，只需输入 help 单词（然后像往一样按回车）。这次你看到


    ```

    输入 help() 获取交互式帮助，或输入 help(object) 获取关于 object 的帮助。

    ```


    现在解释器正要求你输入 help 后跟一对空括号，或者在括号内带上特定单词输入 help（object 是给出的示例）。确保在输入命令后按回车。继续输入以下内容：


    ```

    help()

    ```


    注意该行没有空格。按下回车后，屏幕上会提供一些关于使用 Python 交互式帮助的信息。


    在窗口底部看到 help> 说明你已不再处于操作 shell 或 Python 解释器（它始终显示 >>>），而是进入了一个提供帮助的新区域。正如屏幕上描述的，你可以输入任何模块、关键字或主题的名称来获取该术语的帮助。作为初学者，你目前可能不需要特定方面的帮助。但知道如果需要，帮助就在那里是件好事。


    例如，Python 使用某些在语言中有特殊含义的关键字。要获取这些关键字的列表，在 help> 提示符下输入以下：


    ```

    keywords

    ```


    按下回车后，你会看到关键字列表，如图 2-3 所示。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_25_0.png)


    FIGURE 2-3：关键字帮助。


    帮助文本中的所有技术术语会让初学者困惑。但当你学习 Python 新概念时，会发现需要时可以使用交互式帮助。如果你在帮助文本底部看到 --More，说明有更多文本。你输入命令的地方。每当你看到
    --，都可以按空格键或回车键进入下一页。最终你会回到 help> 提示符。如果你想退出而不是滚动，请按 Q。


    # 退出帮助


    要离开 Python 提示符并返回操作系统，输入 exit() 并按回车。注意，如果你忘记了括号，会在屏幕上看到帮助。例如，如果你输入 exit 并按回车，你会看到


    ```

    使用 exit() 或 Ctrl+Z 退出。

    ```


    不要被 "Ctrl-Z" 与 "Ctrl+Z" 键组合所困；它们的意思相同。当终端末尾看到操作系统提示符而不是 >>> 时，你就已经退出了解释器。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_26_0.png)


    # 搜索特定帮助


    当你想要查找确的术语和概念时，Python 的内置帮助非常有用。但这通常是初学者需要的。当你在线时，最好在网上搜索；从 youtube.com 开始；如果没有，stackoverflow.com
    是提问的好地方，还有 Bing 等搜索引擎。无论你使用什么搜索，记得以单词 python 开始。许多编程语言共享相似的概念和关键字，所以如果你不指定语言，可能会得到各种结果。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_26_1.png)


    # 为你的代码创建文件夹


    在本节中，你创建一个文件夹来存储书中编写的所有 Python 代码，这样在需要时很容易找到。你可以将此文件夹放在任何地方并为它命名。


    在 Windows 中，你可以导航到新文件夹（可以使用桌面、文档或其他文件夹）。右键点击文件夹中的空白处并选择新建文件夹 (Mac) 或新建文件夹 (Windows)。输入文件夹名称并按回车。为了跟随本章示例，将文件夹命名为
    Python Essentials。


    # 输入、编辑和调试 Python 代码


    你可能会在编辑器中编写大部分代码。正如你所知，编辑器允许你输入和编辑文本。VS Code 中的编辑器是为了输入和编辑代码而设计的，所以你可能会听到将其称为代码编辑器。


    由于人们要求代码组织到文件夹中（我们建议在本书中这样做），你的第一步是打开包含代码的文件夹。有几种方法可以实现。如果是第一次，请按照以下步骤操作：


    - 1. 使用 Windows 开始菜单或 Mac 启动台打开 VS Code。

    - 2. 从 VS Code 菜单栏点击 文件 -> 打开文件夹，导航到文件夹位置，点击要打开的文件夹名称，然后选择文件夹。


    当前打开的文件夹名称出现在 VS Code 窗口左侧资源管理器顶部。


    你创建的每个 Python 代码都是带有 .py 扩展名的文本文件。我们建议将书中创建的文件放在 Python Essentials 文件夹中（参见上一节如何创建该文件夹）。只要
    VS Code 和工作区打开，你就应该能够打开 Python Essentials 文件夹。


    要随时创建 .py 文件，请按照以下步骤操作：


    - 1. 如果尚未执行，打开 VS Code 和你的 Python Essentials 文件夹。

    - 2. 如果资源管理器未打开，点击 VS Code 左上角的资源管理器图标。

    - 3. 要要在 Python Essentials 文件夹中创建文件，点击文件夹名称右侧的新建文件。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_27_0.png)


    - 4. 输入带有 .py 扩展名的文件名（第一个为 hello.py）并按回车。


    新文件打开，可以在右侧标签中看到它的名称。标签下方较大的区域是编辑器，你在那里输入 Python 代码。文件名也会出现在资源管理器 Python Essentials
    文件夹名称下方，因为就存储在那里。


    # 编写 Python 代码


    现在你已经打开了一个 .py 文件，可以使用它来编写一些 Python 代码。学习新编程语言时的典型做法是你将从编写一个简单的 Hello World 程序开始。以下是步骤：


    - 1. 点击编辑区域第 1 行的右侧。

    - 2. 输入以下内容：


    ```

    print("Hello World")

    ```


    在你输入时，你可能会注意到屏幕上出现了文本。那些文本是 IntelliSense，它会检测你输入的内容并显示有关该关键字的信息。具体看到多少信息取决于你是否在使用
    GitHub Copilot。但你不需要对它做任何操作——继续输入即可。


    - 3. 输入该行后按回车。


    新行代码显示在屏幕上。你可能会注意到其他变化，如图 2-4 所示：


    - 资源管理器图标上有一个点，或者圆圈数字1，表示你当前有一个未保存的更改。

    - 标签中的 hello.py 名称显示有一个点，表示文件有未保存的更改。


    # 保存你的代码


    你在 VS Code 中输入的代码不会自动保存。有两种处理方法。一种是尝试在每次进行值得保存的更改时记住保存。最简单的方法是从 VS Code 菜单栏中选择保存，或在
    Windows 上按 Ctrl+S 在 Mac 上按下 Cmd+S。


