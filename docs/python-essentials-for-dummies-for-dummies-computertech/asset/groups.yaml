    例如，`abs()` 函数接受一个数字并返回该数字的绝对值。如果你不是一个数学迷，这仅意味着如果你传递一个负数，它会以该数字的正数形式返回。如果你传递一个正数，它会返回你传递的同一个数字。换句话说，`abs()`
