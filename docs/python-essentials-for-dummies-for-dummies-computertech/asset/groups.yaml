    # Formatting Numbers


    Over the years, Python has offered different methods for displaying numbers in
    formats familiar to us humans. For example, most people would rather see dollar
    amounts expressed in the format $1234.56 than 1234.560069595069540569450959. The
    easiest way to format numbers in Python, starting with version 3.6, is to use
    f-strings.


    # Formatting with f-strings


    Format strings, or f-strings, are the easiest way to format data in Python. All
    you need is a lowercase f or uppercase F followed immediately by some text or
    expressions enclosed in quotation marks. Here is an example:


    ```

    f"Hello {username}"

    ```


    The f before the first quotation mark tells Python that follows is a format string.
    Inside the quotation marks, the text, called the literal part, is displayed literally
    (as typed in the f-string). Anything in curly braces is the expression part of
    the f-string, a placeholder for what will appear when the code executes. Inside
    curly braces, you can have an expression (a formula to perform some calculation,
    a variable name, or a combination of the two). Here is an example:


    ```

    username = "Alan"

    print(f"Hello {username}")

    ```'
