    \ in `<span>` ... `</</span>` tags\n\nThe following code teases out each component\
    \ using the `.get()` method on BeautifulSoup to isolate something inside the link\
    \ (that is, between the `<a>` and `</</a>` tags that mark the beginning and end\
    \ of link). The following gets the URL portion of the link and puts it in a variable\
    \ named url:\n\n```python\nurl = link.get('href')\n```\n\nIndent that code under\
    \ the loop so it's executed for each link. The following code gets the image source\
