    - Claude (https://claude.ai)

    - Google Bard (https://bard.google.com)

    - Microsoft Copilot (https://copilot.microsoft.com)


    这些工具大部分（目前）是免费的，但再次，我们对未来无法做出承诺。


    ## 使用 GitHub Copilot


    GitHub Copilot 是另一个能够为你编写代码的 AI 工具。它基于 OpenAI 的 GPT-4，就像 ChatGPT。但它专门针对代码工作设计，并直接集成到
    VS Code 中。你完全不需要使用 GitHub Copilot 来学习 Python 或使用本书，但你可能会发现它确实有助于你的学习过程。在我们编写此书时，GitHub
    正在向学生免费提供 Copilot。它提供了一些付费计划，每月 10 美元起。要使用 Copilot，你需要注册 GitHub 并购买（或申请）Copilot
    的访问权限。再次，该工具太新了，我们在这里提供的任何说明都可能发生变化。你可能需要搜索 Google 或 YouTube 以查找在 VS Code 中使用
    Copilot 的最新说明。基本上，它的工作原理如下：


    1. 如果你还没有 GitHub 账户，访问 https://github.com 并创建一个账户。


    2. 如果 VS Code 尚未打开，请打开它。

    3. 点击左列的扩展（Extensions），然后在搜索框中输入 Copilot。

    4. 点击图 1-2 所示右侧的 Install（安装）按钮安装 Copilot。


    ![](img/ca342ce31cd39db62dca2143d5fa4229_20.png)


    扩展图标 安装 GitHub Copilot


    **图 1-2**: 在 VS 中安装 GitHub Copilot


