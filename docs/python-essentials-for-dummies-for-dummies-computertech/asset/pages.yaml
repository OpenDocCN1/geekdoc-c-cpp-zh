  md: '# Chapter 12

    Interacting with the Internet


    As you probably know, the internet is home to virtually all the world''s knowledge.
    Most of us use the web all the time to find information. We do so by using a web
    browser such as Safari or Google Chrome. To visit a website, you type a Uniform
    Resource Locator (URL) into your browser''s address bar and press Enter, or you
    click a link that sends you to the page automatically. This is the most complicated
    chapter in our book, but it is one of the most interesting to play with.


    As an alternative to browsing the web with your web browser, you can access its
    content programmatically. In other words, you can use a programming language as
    Python to post information to the web, as well as to access web information. In
    this chapter, you learn about the two main modules for accessing the web programmatically
    with Python: urllib and BeautifulSoup.


    # Seeing How the Web Works


    When you open your web browser and type in a URL or click a link, that action
    sends a request to the internet. The internet directs your request to the appropriate
    web server, which in turn'
  merge: -1
  pgno: 156
- img_proc: true
  md: 's a response back to your computer. Typically that response is a web page,
    but it can be just any file. Or it can be an error message if you requested no
    longer exists at location. But the important thing is that you, the user (a human
    being), and your user agent (the program you''re using to access the internet)
    are on the client side of things. The server, which is just a computer, not a
    person, sends back its response, as illustrated in Figure 12-1.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_157_0.png)


    Figure 12-1: The client makes a request, and the server sends back a response.


    # Understanding the mysterious URL


    The URL is a key part of accessing a web page, because that''s how the internet
    finds the resource you''re seeking. On the web, most resources use Hypertext Transfer
    Protocol (HTTP), thus their URLs start with http:// or https://. The difference
    is that http sends stuff across in its raw form, which makes it susceptible to
    hackers and others who can "sniff out" the traffic. The https protocol is secure
    in that the data is encrypted, which means it''s been converted to a secret code
    that''s not easy to read. Typically, any site with whom you do business and to
    whom you transmit sensitive information, such as passwords and credit numbers,
    uses https to keep that information secret and secure.


    The URL for any website can be relatively simple, such as Alan''s, which is or
    can be complex, to add more information to the request. Figure 12-2 shows the
    parts of a URL, some of which you may have noticed in the past.


    Note that the order matters. For example, it''s possible for a URL to contain
    a path to a specific folder or page starting with a slash right after the domain
    name. The URL can also contain a query string, which is always last and always
    starts with a question


