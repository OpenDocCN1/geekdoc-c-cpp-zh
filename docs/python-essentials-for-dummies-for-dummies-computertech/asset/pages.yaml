  md: "# # Looping with readlines()\n\nWhen you read a file with readlines(), you\
    \ read the entire file in one sweep as a list. So you don't really loop through\
    \ the file one row at a time. Rather, you loop through the list of items that\
    \ readlines() stores in memory. The code to do so looks like this:\n\n```\nwith\
    \ open('quotes.txt') as f:\n    # Reads in all lines first, then loops\n    through.\n\
    \    for one_line in f.readlines():\n        print(one_line)\n```\n\nIf you run\
    \ this code, the output will be double-spaced because each list item ends with\
    \ a newline, and then print normally adds its own newline with each pass through\
    \ the loop. If you want to retain the simple spacing, add end='' to print statement\
    \ (make sure you use single or double quotation marks with no spaces after).\n\
    \n# # Looping with readline()\n\nIf you aren't too sure about the size of the\
    \ file you're reading or the amount of RAM in the computer running your app, using\
    \ readlines() to read in an entire file can be risky. If there isn't enough memory\
    \ to hold the entire file, the app will crash when it runs out of memory. To play\
    \ it safe, you can loop through the file one line at a time so that only one line\
    \ of the contents of the file is in memory at any given time.\n\nTo use this method,\
    \ you open the file, read one line, and put it in a variable. Then loop through\
    \ the file as long as (while) the variable isn't empty. Because each line in the\
    \ file contains some text, the variable won't be empty until after the last line\
    \ is read. Here the code for this approach to looping:\n\n```\nwith open('quotes.txt')\
    \ as f:\n    one_line = f.readline()\n    while one_line:\n        print(one_line,\
    \ end='')\n        one_line = f.readline()\n```"
