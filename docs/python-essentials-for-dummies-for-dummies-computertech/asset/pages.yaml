  md: "If you omit the whence value, it defaults to 0.\n\nBy far the most common use\
    \ of seek is just to reset the pointer back to the top of the file for another\
    \ pass through the file. The syntax for this is simply .seek(0).\n\n# Reading\
    \ and Copying a Binary File\n\nSuppose you have an app that changes a binary file,\
    \ and you want to always work with a copy of the original file to play it. Binary\
    \ files can be huge, rather than opening it all at once and risking running out\
    \ of memory, you can read it in chunks and write it out in chunks. Binary files\
    \ do not have human-readable content. Now they have lines of text. readline()\
    \ aren't a good choice for looping through binary files, but you can use .read()\
    \ with a specified size.\n\nFigure 10-2 shows the binarycopy.py file, which makes\
    \ a copy of any binary file. We take you through that code step-by-step so that\
    \ can understand how it works.\n\n```\nbinarycopy.py ~~\n# Specify the file to\
    \ copy\nfile_to_copy = 'happy_pickle.jpg'\n# Create new file name with copy before\
    \ the extension.\nname_parts = file_to_copy.split('.')\nnew_file = name_parts[0]\
    \ + '_' + name_parts[1]\n# Open the original file as read-only binary.\nwith open(file_to_copy,\
    \ 'rb') as original_file:\n    # Create or open file to copy into.\n    with open(new_file,\
    \ 'wb') as copy_to:\n        # Grab a chunk of the original file (4KB).\n    \
    \    chunk = original_file.read(4096)\n        # Loop until there are no more\
    \ chunks.\n        while len(chunk) > 0:\n            copy_to.write(chunk)\n \
    \           # Make sure you read the next chunk in this loop.\n            chunk\
    \ = original_file.read(4096)\n    # Close is automatic after loops, show message.\n\
    \    print('Done!')\n\n```\n\nFigure 10-2: The binarycopy.py file copies any binary\
    \ file.\n\nFigure 10-3 shows the results of running the code. The Terminal simply\
