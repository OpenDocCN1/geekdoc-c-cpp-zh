    # Appending versus overwriting files


    Anytime you work with files, it''s important to understand the difference between
    write and append. If a file contains information and you open it in write mode
    and then write to it, your new content will overwrite (replace) whatever is already
    in the file. There is no undo for this. If the content of the file is important,
    you want to make sure you don''t make that mistake. Add content to the end of
    a file, open the file in append (a) mode, and then use `write` to write to the
    file.


    # Using tell() to determine the pointer location


    When you loop through a file, its contents are read top to bottom and left to
    right. Python maintains a pointer to keep track of where it is in the file. When
    you''re reading a text file with readline(), the pointer is always the character
    position of the next line in the file.


    # Moving the pointer with seek()


    Whereas the `tell()` method tells you where the pointer is in an external file,
    the `seek()` method enables you to reposition the pointer. Your syntax is


    ```

    file.seek(position[,whence])

    ```


    Replace `file` with the variable name of the open file. Replace `position` to
    indicate where you want to put the pointer. For example, `0` moves the pointer
    back to the top of the file. The `whence` is optional; you can use it to indicate
    where in the file to set the pointer position. Your choices are


    +   - 0: Set the position relative to the start of the file.

    - 1: Set the position relative to the current pointer position.

    - 2: Set the position relative to the end of the file. Use a negative number for
    `position`.'
