  md: '# Comparison operators


    Computers can make decisions as part of doing their work. But these decisions
    are not judgment call decisions or anything human like that. These decisions are
    based on absolute facts that are based on comparisons. The comparison operators
    that Python offers to help you write code that makes decisions are listed in Table
    4-2.


    Table 4-2 Python Comparison Operators


    | Operator | Meaning |

    | --- | --- |

    | < | Less than |

    | <= | Less than or equal to |

    | > | Greater than |

    | >= | Greater than or equal to |

    | == | Equal to |

    | != | Not equal to |


    # Boolean operators


    The Boolean operators work with Boolean values (True or False) and are used to
    determine whether one or more things are True or False. Table 4-3 summarizes the
    Boolean operators.


