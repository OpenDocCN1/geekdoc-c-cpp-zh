  md: '# IN THIS CHAPTER


    +   - Discovering why Python is hot


    +   - Finding the tools for success


    +   - Writing Python in VS Code


    # Chapter 1

    Starting with Python


    Because you''re reading this chapter, you probably realize that Python is a great
    language to know if you''re looking for a good job in programming, or if you want
    to expand your existing programming skills into exciting cutting-edge technologies
    such as artificial intelligence (AI), machine learning (ML), data science, or
    robotics, or even if you''re just building apps in general. So we''re not going
    to try to sell you on Python. It sells itself.


    Our approach leans heavily toward the hands-on. A common failure in many programming
    tutorials is that they already assume you''re a professional programmer in some
    language, and they skip over things they assume you know.


    This book is different in that we don''t assume you''re already programming in
    Python or some other language. We assume that you can use a computer and understand
    basics such as files and folders.


    We also assume you''re not up for settling down in an easy chair in front of the
    fireplace to read page after page of theoretical stuff about Python, like some
    kind of boring novel. You don''t have much free time to kill. So we''re going
    to get right into it and focus on doing, hands-on, because that''s the only way
    most of us learn. We''ve never seen anyone read a book about Python and then


    CHAPTER 1 Starting with Python 3'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'at a computer and write Python like a pro. Human brains don’t

    work that way. We learn through practice and repetition, and that

    requires being hands-on.


    # # Why Python Is Hot


    We promised we weren’t going to spend a bunch of time trying to

    sell you on Python, and that’s not our intent here. But we would

    like to talk briefly about why it''s so hot.


    Here are the main reasons for Python’s current popularity:


    +   - Python is relatively easy to learn (and do) in Python is free.

    - Everything you need to learn (and do) in Python is free.

    - Python offers more ready-made tools for current hot

    ologies such as data science, machine learning, artificial

    intelligence, and robotics than most other languages.


    # # Choosing the Right Python


    There are different versions of Python out roaming the world,

    proming a beginner to wonder things such as


    +   - Why are there different versions?

    - How are they different?

    - Which one should I learn?


    All good questions, and we’ll start with the first. A version is kind

    of a car year. You can go out and buy a 1968 Ford Mustang, a

    1990 Ford Mustang, a 2019 Ford Mustang, or a 2020 Ford Mus-

    tang. They’re all Ford Mustangs. The only difference is that the

    one with the highest year number is the most current Ford Mus-

    tang. That Mustang is different from the older models in that it

    has some improvements based on experience with earlier models,

    as well as features current with the times.


    Programming languages (and most other software products)

    work the same way. But as a rule, we don’t ascribe year numbers


    4 Python Essentials For Dummies'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'to them because they''re not released on a yearly basis. They''re released
    whenever they''re released. The principle is the same, though. The version with
    the highest number is the newest, most recent model, sporting improvements based
    on experience with earlier versions, as well as features relevant to the current
    times.


    In this book, we focus on versions of Python that are current in 2023 from Python
    3.11 and higher. Don''t worry about version differences after the first and second
    digits. Version 3.11.1 is similar enough to version 3.11.2 that version differences
    aren''t important, especially to a beginner. Most of what''s in Python is the
    same across all recent versions. So you need not worry about investing time in
    learning a version that is or will soon be obsolete.


    # Tools for Success


    Now we need to start getting your computer set up so that you can learn, and do,
    Python hands-on. For one, you''ll need a good Python interpreter and editor. The
    editor lets you type the code, and the interpreter lets you run that code. When
    you run (or execute) code, you''re telling the computer to “do whatever my code
    tells you to.”


    The term code refers to anything written in a programming language to provide
    instructions to a computer. The term coding is often used to describe the act
    of writing code. A code editor is an app that lets you type code, in the same
    way as Microsoft Word or Apple Pages helps you type regular, plain-English text.


    Just as there are many brands of toothpaste, soap, and shampoo in the world, there
    are many brands of code editors that work with Python. There isn''t one right
    or a wrong one, a good one or a bad one, a best one or a worst one. Just a lot
    of different products that basically do the same thing but vary slightly in their
    approach and what editor''s creators think is good.


    If you''ve already started learning Python and are with whatever you''ve been
    using, you''re welcome to continue using that and ignore our suggestions. If you''re
    just getting started with this stuff, we suggest you use VS Code, because it''s
    an excellent, free learning environment.'
  merge: -1
