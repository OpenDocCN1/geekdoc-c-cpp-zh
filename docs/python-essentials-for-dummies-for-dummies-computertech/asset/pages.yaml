  md: "# Looping with continue\n\nYou can also use a continue statement in a loop,\
    \ which is kind of the opposite of break. Whereas break makes code execution jump\
    \ past the end of the loop and stop looping, continue makes it jump back to the\
    \ top of the loop and continue with the next item (that is, after the item that\
    \ triggered the continue). So here is the same code as the preceding example,\
    \ but instead of break execution hits a blank answer, it continues with the next\
    \ item in the list:\n\n```\nanswers = [\"A\", \"C\", \"\", \"D\"]\nfor answer\
    \ in answers:\n    if answer == \"\":\n        print(\"Incomplete\")\n       \
    \ continue\n    print(answer)\nprint(\"Loop is done\")\n```\n\nThe output of that\
    \ code is as follows. It doesn't print the blank answer, it prints Incomplete,\
    \ but then it goes back and continues looping through the rest of the items:\n\
