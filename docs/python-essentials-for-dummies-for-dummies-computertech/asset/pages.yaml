  md: '# Understanding Exceptions


    In Python (and all other programming languages) the term exception refers to an
    error in your code, or in the environment in which the code is running — basically
    anything that prevents the program from running properly. To see a simple example,
    your Python app open a file. The syntax for that is is:


    ```

    name = open(filename)

    ```


    Replace name with a name of your own choosing. Replace filename with the name
    of the file. If the file is in the same folder as the code, you don''t need to
    specify a path to a folder because the current folder is assumed.


