  md: '# Introduction


    The Python language is becoming more and more popular, and in 2017 it became the
    most popular language in the world according to IEEE Spectrum. The power of Python
    is real.


    Python is the number-one language because it''s easy to learn and use, due partly
    to its simplified syntax and natural–language flow but also to the amazing user
    community and the breadth of applications.


    # About This Book


    This book is a reference manual to guide you through the process of learning the
    essentials of Python. If you''re looking to learn a little bit all of exciting
    things, this is the book for you. It gives you an introduction to the topics that
    you''ll need to explore deeply.


    This is a hands-on book, with examples and code throughout. You''ll enter the
    code, run it, and then modify it to do what you want.


    In this book, we take you through the basics of the Python language in small,
    easy-to-understand steps.


    # Foolish Assumptions


    We assume you know how to use a computer in a basic way. If you can turn on the
    computer and use a mouse, you''re ready for this book. We assume that you don''t
    know how to program yet, although you will have some skills in programming after
    reading this book.'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Icons Used in This Book


    What''s a For Dummies book without icons pointing you in the direction of truly
    helpful information that''s sure to speed along your way? Here we briefly describe
    each icon we use in the book.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_13_0.png)


    The Tip icon points out helpful information that''s likely to make your job easier.


    TIP


    ![](img/ca342ce31cd39db62dca2143d5fa4229_13_1.png)


    The Remember icon marks a generally interesting and useful fact — something you
    may want to remember for later use.


    REMEMBER


    ![](img/ca342ce31cd39db62dca2143d5fa4229_13_2.png)


    The Warning icon highlights lurking danger. When we use this icon, we''re telling
    you to pay attention and proceed with caution.


    WARNING


    # Where to Go from Here


    You can start the book anywhere, but here are a couple of hints. If you''re brand-new
    to Python, start with Chapter 1. If you already have some Python experience and
    you want to learn how to work with bigger chunks of code, head to Chapter 8. For
    anything else, turn to the Table of Contents or the Index and you''ll find what
    you need.'
  merge: -1
