  md: '# Understanding Serialization


    When it comes to JSON, the first buzzword you have to learn is serialization.
    Serialization is the process of converting an object (such as a Python dictionary)
    into a stream of bytes or characters that can be sent across a wire, stored in
    a file or database, or stored in memory. The main purpose is to save all the information
    in an object in a way that can be retrieved easily on any other computer. The
    process of converting the information back to an object is called deserialization.
    To keep things simple, you may just consider these definitions:


    +   - **Serialize**: Convert an object to a string.

    - **Deserialize**: Convert a string to an object.


    The Python standard library includes a json module that helps you work with JSON
    files. Because it''s part of the standard library, you just have to import json
    near the top of your code to access its capabilities. The four main methods for
    serializing and deserializing json are summarized in Table 11-1.


    Table 11-1 Python JSON Methods for Serializing and Deserializing JSON Data


    | Method | Purpose |

    | --- | --- |

    | json.dump() | Write (serialize) Python data to a JSON file (or stream). |

    | json.dumps() | Write (serialize) a Python object to a JSON string. |

    | json.load() | Load (deserialize) JSON from a file or similar object. |

    | json.loads() | Load (deserialize) JSON data from a string. |


    Data types in JSON are similar but not identical to data types in Python. Table
    11-2 lists how data types are converted between the two languages when serializing
    and deserializing.'
