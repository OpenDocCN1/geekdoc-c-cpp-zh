  md: '# Calculating Numbers with Functions


    A function in Python is similar to a function on a calculator, in that you pass
    something into the function, and the function passes something back. For example,
    most calculators and programming languages have a square root function: You provide
    a number, and they tell you the square root of that number.


    Python functions generally have the syntax:


    ```

    variablename = functionname(param[, param)

    ```


    Because most functions return some value, you typically start by defining a variable
    to store what the function returns. Follow that with the = sign and the function
    name, followed by a pair of parentheses. Inside the parentheses you may pass one
    or more values (called parameters) to the function.


    For example, the abs() function accepts one number and returns the absolute value
    of that number. If you''re not a math nerd, this just means that if you pass a
    negative number, it returns same number as a positive number. If you pass a positive
    number, it returns the same number you passed it. In other words, the abs() function
    simply converts negative numbers to positive numbers.


    Here''s an example (which you can try out for yourself hands-on) at the Python
    prompt or in a .py file in VS Code:


    ```

    x = -4

    y =abs(x)

    print(x)

    print(y)


    -4

    4

    ```


    Here, we created a variable named x and assigned it the value -4. Then we created
    a variable y and assigned it the absolute value of x using the abs() function.
    Printing x shows its value, -4, which hasn''t changed. Printing y shows 4, the
    absolute value of x as returned by the abs() function.


    42 Python Essentials For Dummies'
