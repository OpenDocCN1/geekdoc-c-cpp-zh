    or streamlined if some components can use code that''s already been written, tested,
    debugged, and deemed reliable by members of the Python programming community.
    The packages you hear about in relation to Python are that kind of code — code
    that has been developed and nurtured, is trustworthy, and is generic enough to
    be used as a component of a large project.


    Thousands of packages are available for Python. A good resource for finding packages
