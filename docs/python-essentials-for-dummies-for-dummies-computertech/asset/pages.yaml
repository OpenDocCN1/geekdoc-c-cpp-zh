    # Removing data from a dictionary


    To remove data from a JSON structure as you''re going through the loop, use this
    syntax:


    ```

    pop(''keyname'', None)

    ```


    Replace ''keyname'' with the name of the column you want to remove. For example,
    to remove all the lastreferrer key names and data from a dictionary created by
    the Firebase database JSON example, adding the following to the loop:


    ```

    v.pop(''lastreferrer'', None)

    ```


    The None parameter in that code is optional. Including it prevents Python from
    throwing an exception if you try to delete a key that doesn''t exist.


    Figure 11-5 shows an example where lines 1–8 import Firebase data into a Python
    object named hits_data. Line 10 starts a loop that goes through each key (k) and
    value (v) in the dictionary. Line 12 replaces the timestring that was in the lastvisit
    column with that Python date pydate. Then line 14 replaces the timestamp to a
    string in mm/dd/yyyy format. Line 16, v.pop(''lastreferrer'', None), removes the
    lastreferrer key:value pair from each dictionary. The final loop shows what''s
    in the dictionary after making these changes.


    Keep in mind that the changes you make to the dictionary in Python have no effect
    on the file or string from which you loaded the JSON data. If you want to create
    a new JSON string or file, use the json.dumps() or json.dump() method, discussed
    next.'
