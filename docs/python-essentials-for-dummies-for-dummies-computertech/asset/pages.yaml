    people pronounce it like “two-pull.” Some people pronounce it to rhyme with couple.
    But it''s not spelled couple or tuple, so our best guess is that it''s pronounced
    “two-pull.” (Heck, for all we know, there may not be only one correct way to pronounce
    it, but that doesn’t stop people from arguing about it.)


    Anyway, despite the oddball name, a tuple is just an immutable list (like that
    tells you a lot). In other words, a tuple is a list, but you can’t change it after
    it’s defined.


    The syntax for creating a tuple is the same as the syntax for creating a list,
    except you don’t use square brackets. You have to use parentheses, like this:


    ```

