    # Exposing the HTTP headers


    When you''re using the web, all you care about the stuff you see on your screen.
    At a deeper, somewhat hidden level, the two computers involved in the transaction
    are communicating with one another through HTTP headers. The headers are not normally
    visible to the human eye, but they are accessible to Python, your web browser,
    and other programs.


    The product we use most often to view headers is HTTP Headers, which is a Google
    Chrome extension. If you have Chrome and want to try HTTP Headers for yourself,
    you can download and install HTTP Headers from the Chrome Web Store at https://chromewebstore.google.com.
    After you''ve installed the extension, to see the headers involved whenever you''ve
    visited a site, click the HTTP Headers icon in your Chrome toolbar (it looks like
    a cloud) and you''ll see the HTTP header information (Figure 12–3).'
