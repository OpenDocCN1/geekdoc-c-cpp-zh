  md: '# # Creating a Function


    Creating a function is easy. Follow along in a .py file if you want to get hands-on
    experience.


    To create a function, start a new line with `def` (short for definition) followed
    by a space, and then a name of your choosing followed by a pair of parentheses
    with no spaces before or inside. Then put a colon at the end of that line. For
    example, to create a simple function `hello()`, type


    ```

    def hello():

    ```


    This is a function, but it doesn''t do anything. To make the function something,
    you have to write Python code on subsequent lines. To ensure that the new code
    is “inside” the function, indent each of those lines.


    Indentations matter big time in Python. There is no command that marks the end
    of a function. All indented lines below the def line are part of that function.
    The first un-indented line (indented as far out as the `def` line) is outside
    the function.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_101_0.png)


    To make this function do something, put an indented line of code under def. We''ll
    start by just having the function print `hello`. So, your type `print(''Hello'')`
    indented under the `def` line. Now your code looks like this:


    If you run the code now, nothing obvious will happen on your screen. That''s because
    the code inside a function isn''t executed until the function is `called`. You
    call your own functions the same way you call built-in functions: by writing code
    that calls the function by name, including the parentheses at the end.


    For example, if you''re following along, press Enter to add a blank line and type
    `hello()` (no spaces in there) and make sure it''s not indented. (You don''t want
    this code to be indented because it''s calling the function to execute its code;
    it''s not *part of the function*.) So it looks like this:'
