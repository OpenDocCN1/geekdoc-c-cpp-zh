- img_proc: true
  md: '# Installing Python and VS Code


    The editor we recommend and will be using in this book is called Visual Studio
    Code, officially. But most often, it is spoken or written as VS Code. The main
    reasons why it''s our favorite follow:


    +   - It is an excellent editor for learning coding.

    - It is an excellent editor for writing code professionally and is used by millions
    of professional programmers and developers.

    - It is relatively easy to learn and use.

    - It works pretty much the same on Windows, Mac, and Linux.

    - It''s free.

    - It integrates beautifully with GitHub Copilot, so you can use modern, generative
    AI to speed both learning and actual coding.


    To use VS Code as your editor for learning and doing Python, you need to download
    and install Python, VS Code, and a VS Code extension. With luck, you already have
    some experience working with apps, this won''t be difficult. You will have to
    follow onscreen instructions as you go along. If faced with choices you''re not
    sure about along the way, you can just choose the default (suggested) option.
    Here are the steps to download and install VS Code:


    +   1. Use any web browser to browse to www.python.org.

    2. Click Download and, if asked to select a version, choose the suggested stable
    version.

    3. Open the folder to which you downloaded Python and double-click the icon for
    the file you downloaded to install Python.

    4. Browse to https://code.visualstudio.com/ and download the current version of
    VS Code for your operating system.

    5. Open the folder to which you downloaded Visual Studio code, double-click the
    icon for the downloaded file, and follow the onscreen instructions to install
    VS Code.


    You can just follow the onscreen instructions, and accept any suggested defaults,
    during the installation process.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'After Vs Code installed, you should be able to start it like any other app
    in your system. In Windows, click Start and look around the Start menu for Visual
    Studio Code. On a Mac, you should be able to find it in your Applications folder,
    or Launchpad.


    # Installing the Python extension


    To use VS Code for Python coding, you need to install the VS Code Python extension
    for Python. When you open VS Code, you will see some icons listed down the left
    side of the window. Placing the mouse over any icon reveals its name. Click the
    Extensions icon, shown in Figure 1-1, and then enter Python in the Search box
    at the top of the Extensions panel. Click the button with the Python extension
    from Microsoft (see Figure 1-1).


    ![](img/ca342ce31cd39db62dca2143d5fa4229_18_0.png)


    Extensions icon Install the Python extension from Microsoft


    **FIGURE 1-1**: Obtaining the Python extension in VS Code.


    When you''ve finished installing the Python extension, you might notice that both
    Python and Pylance were added as extensions to VS Code. Don''t worry; that''s
    normal. Pylance just gives you some additional capabilities that make it easier
    to learn and write Python code within the VS Code editor. To ensure the extension
    is activated, exit VS Code and restart it.


    # Let AI write your Python code


    Modern AI is perfectly capable of writing Python code for you. It''s not as simple
    as commanding it to "Write a Python'
