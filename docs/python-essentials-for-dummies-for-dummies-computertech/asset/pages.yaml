  md: '# Passing Information to a Function


    You can pass information to a function for it to work on. To do so, enter a parameter
    name in the def statement for each piece of information you''ll be passing to
    the function. You can use any name for the parameter, as long as it starts with
    a letter or underscore, followed by a letter, or a number. The name should not
    contain spaces or punctuation. (Parameter names and variable names follow the
    same rules.) Ideally, the parameter should describe what''s being passed in, for
    code readability, but you can use generic names like x and y, if you prefer.


    Any name you provide as a parameter is local only to that function. For example,
    if you have a variable x outside the function and another variable named x inside
    the function, any changes you make to the x variable inside the function won''t
    affect the x variable outside the function.


    The technical term for the variable work inside functions is local scope, meaning
    the scope of the variables'' existence and influence stays inside the function
    and does not extend further. Variables created and modified inside a function
    literally cease to exist the moment the function stops running, and any variables
    defined outside the function are unaffected by the goes—inside the function. This
    is a good thing because when you''re writing a function, you don''t have to worry
    about accidentally changing a variable outside the function that happens to have
    the same name.


    Suppose you want the hello function to say Hello to whoever is using the app (and
    you have access to that information in some variable). To pass the information
    into the function and use it there, you would do the following:


    +   Put a parameter name inside the function''s parentheses to act as a placeholder
    for the incoming information.


    +   Inside the function, use that name to work with the information passed in.


    For example, suppose you want to pass a person''s name into the hello function
    and then use the name in the print() statement.'
