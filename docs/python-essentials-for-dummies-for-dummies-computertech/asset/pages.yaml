  md: '# Chapter 14

    The Ten Most Essential Aspects of Python


    To be able program in Python is a very important skill for the modern worker in
    engineering, science, and business. So many of the new tools available for artificial
    intelligence (AI), data science, data analysis, and controlling equipment and
    robots of all choice. Python is rapidly become the programming language of choice.
    In this chapter, we fill you in on ten of the most essential aspects of Python.


    # Being Pythonic


    The Python language is easy to learn but hard to master. The path to being fluent
    and effective in the Python language is one of practice. The more code you write,
    the better you become at writing code. In Python, it''s not just making the program
    work that counts — it also matters how you do it. This is what we can being “Pythonic.”
    If your Python code is hard to read and complicated, you aren''t being Pythonic.'
  merge: -1
  pgno: 180
- img_proc: true
  md: 'Python is designed to enable you to write clear code. Clear code isn''t necessarily
    concise — it may have more statements — but the flow and intent of the code will
    be obvious.


    Beautiful is better than ugly. Explicit is better than implicit. Simple is better
    than complex. Readability counts. These are some of the rules for being Pythonic.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_181_0.png)


    # Identifying the Importance of Indents


    Python uses indents to show control and structure in your code. Why indents instead
    of curly brackets? To eliminate redundancy (you were already indenting with curly
    brackets!) and make the code cleaner. Sounds very Pythonic to us! After a short
    while, using indents will become second nature to you.


    Oh, and opening up a real source of contention, we suggest spaces instead of tabs
    for indents! Make it a habit.


    ![](img/ca342ce31cd39db62dca2143d5fa4229_181_1.png)


    # Understanding Python Syntax


    The Python language has a very consistent flow of syntax through the entire language.
    Figuring out the basic syntax (see Chapter 3) will open up all the rest of the
    Python language in a natural way.


    # Appreciating the Flexibility of Python Variables


    Python variables can contain almost anything. They''re strongly typed as they
    are in C (you declare C variables as integers, for example). Instead, they''re
    dynamically typed. In other words, a Python variable will be anything you want
    it to be. This information is important to remember when you''re doing math on
    the variables — you can''t add an integer to a string variable.'
  merge: -1
  pgno: 181
- img_proc: true
  md: '# Seeing Lists as Your Friend


    Lists are the most important compound data type in Python. They allow you to store
    and manipulate a whole collection of items at the same time. Understanding and
    using lists are key entry points into some of the most important applications
    in Python for AI, robotics, and data science.


    # Controlling Your Program


    Programs in Python don''t just run in one direction down the list of code. Programming
    applications require you to make decisions about what to do with your data (if
    statements), how many times to perform an operation (for and while statements),
    and how to move through all the data in your list variables.


    # Understanding Python Functions


    Organizing your code and reusing pieces of Python code is very Pythonic and very
    useful to increasing your coding productivity and clarity. If you''re doing the
    same thing multiple places in your code, you''re better off putting the code into
    a function so you need to change it, you have only one place to look. This approach
    also makes your code easier to read and maintain.


    # Figuring Out Errors


    One of the most irritating aspects of Python for beginners is the relative obtuseness
    of the default error reporting in Python. Lucky for you, there are lots of methods
    to improve the readability of the errors generated by your code and to improve
    the readability of the errors generated by Python itself. Understanding exceptions
    and errors will dramatically improve your Python experience.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '# Using Other People’s Modules


    Python would be nothing without the huge community of programmers who have generated
    modules that you can import into Python and use in your program. Tens of thousands
    of prewritten modules are available to help you out in your application. Need
    matrix math? It’s out there. Need to manipulate images? It’s out there. Want to
    try doing machine learning? It’s out there. And most of the modules are well documented
    and easy to use.


    # Using the Web and AI When You Have Problems


    Web searches and AI (such as ChatGPT and Microsoft Copilot) are your best friends
    not only when you’re learning Python but also when you’re actually developing
    applications. They’re a great source of examples and documentation for doing specific
    tasks for your own applications. Use them. You aren’t being replaced by AI tools
    — you’re just getting to be more productive in your programming.'
