    # Chapter 9

    Sidestepping Errors


    We all want our programs to run perfectly all the time. But sometimes, situations
    in the real world stop a program from running. The problem isn''t with you or
    your program. Usually, the person using the program did something wrong. Error
    handling is all about anticipating these problems, catching the error, and then
    informing users of the problem so they can fix it.


    The techniques we describe aren''t for fixing bugs in your code. You have to fix
    that type of error yourself. We''re talking strictly about errors in the environment
    in which the program is running, over which you have no control. Handling the
    error is simply a way of replacing the tech-speak error message that Python displays,
    which is meaningless to most people, with a message that tells users in plain
    English what''s wrong, and ideally, how to fix it.


    Again, users will be fixing the environment in which the program is running —
    they won''t be fixing your code.


