  md: "# # Bailing out of a loop\n\nTypically, you want a loop to go through an entire\
    \ list or range of items, but you can also force a loop to stop early if some\
    \ condition is met. Use the `break` statement inside a statement to force the\
    \ loop to stop early. The syntax is\n\n```\nfor x in items:\n  if condition:\n\
    \    [do this ...]\n    break\ndo this\n```\n\nThe square brackets in this example\
    \ aren't part of the code. They indicate what is between the brackets is optional.\
    \ Suppose someone completed an exam and we want to loop through the answers. But\
    \ we have a rule that says if an answer is empty, we mark it Incomplete and ignore\
    \ the rest of the items in the list. In the following, all answers are answered\
    \ (blanks):\n\n```\nanswers = [\"A\", \"C\", \"B\", \"D\"]\nfor answer in answers:\n\
    \  if answer == \"\":\n    print(\"Incomplete\")\n    break\n  print(answer)\n\
    print(\"Loop is done\")\n```\n\nIn the result, all four answers are printed:\n\
    \n+   - A\n- C\n- B\n- D\n- Loop is done\n\nThe logic is, as long as some answer\
    \ is provided, the if code is not executed and the loop runs to completion. However,\
    \ if the loop encounters a blank answer, it prints Incomplete and also “breaks”\
    \ the loop, jumping down to the first statement outside the loop (the final un-indented\
    \ statement), which prints `Loop is done`."
