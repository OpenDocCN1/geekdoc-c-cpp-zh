    FIGURE 12-3: Inspecting HTTP headers with Google Chrome.


    Two of the most important things in the HTTP headers are at the top, they tell
    you that a GET request was sent, meaning the URL is just a request for information;
    nothing is uploaded to the server. The URL after the word GET is the requested
    resource. Another type of response is POST, and that means there''s some information
    you''re sending to the server, such as when you post something on Facebook or
    X (formerly Twitter).


    The line below the GET shows the status of the request. The first part indicates
    the protocol used. In the example in Figure 12-4, the protocol is HTTP1.1, which
    just means the web request follows the HTTP version 1.1 rules of communication.
    The 200 is the status code, which in this case means “okay, everything went well.”
    Common status codes are listed in Table 12-1.


    All of what we''ve been telling you here it matters because it''s related to accessing
    the web programmatically with Python, as you''ll see next.


    # Opening a URL from Python


