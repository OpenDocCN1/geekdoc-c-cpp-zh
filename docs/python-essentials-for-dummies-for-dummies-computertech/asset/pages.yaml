  md: '# Dumping Python Data to JSON


    So far we''ve talked about bringing JSON data from the outside world into yours
    so that Python can use its data. Sometimes, you may want to go in the opposite
    direction, to take some data already in your app in an object (like a dictionary)
    and export it to JSON to pass to another app, at large, or whatever. This is where
    `json.dump()` and `json.dumps()` methods come into play.


    The `dumps()` method creates a JSON string of the data, which is in memory, so
    you can use `print()` to see it. For example, the previous code examples imported
    a Firebase database to a Python dictionary, and they looped through that changing
    all the timestamps to `mm/dd/yyyy` dates and removing all the `lastreferrer` key=value`
    pairs. So let''s say that you want to create a JSON string of this new dictionary.
    You could use dumps like the following to create a string named `new_dict`, and
    you could also print that string to the console. The last two lines of code outside
    would be


    ```

    1 import json

    2 import datetime as dt

    3 # This is the Firebase JSON data (keyed).

    4 filename = ''firebase_hitcounts.json''

    5 # Open the file (standard file open stuff).

    6 with open(filename, encoding=''utf-8'') as f:

    7     # load the whole json file into an object named hits

    8     hits = json.load(f)

    9

    10 for k, v in hits.items():

    11     # Convert the hits date to a Python date.

    12     dt.datetime.fromtimestamp(v[''lastvisit'']/1000.0)

    13     # In the dictionary, replace the date with string of Python data.

    14     v[''lastvisit''] = dt(''%Y-%m-%d'')

    15     # Remove the lastreferrer referrer column.

    16     v.pop(''lastreferrer'', None)

    17

    18 # Now look at the lastvisit in the hits dictionary.

    19 for k, v in hits.items():

    20     print(k,v)

    21

    22

    ```


