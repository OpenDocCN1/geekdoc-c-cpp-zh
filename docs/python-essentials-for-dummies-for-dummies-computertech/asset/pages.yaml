    # ## Calculating timespans


    Sometimes just knowing the date or time isn''t enough. You need to know the duration,
    or *timespan*, as it''s typically called in the computer world. In other words,
    not the date, not the o''clock, but the "how long" in terms of years, months,
    weeks, days, hours, minutes, or whatever. For timespans, the Python datetime module
    includes the `datetime.timedelta` class.


    A `timedelta` object is created automatically whenever you subtract two dates,
    times, or datetimes to determine the duration between them. For example, suppose
    you create a couple of variables to store dates, perhaps one for New Year''s Day
    and another for Memorial Day. When you create a third variable named `days_between`
    and put in it the difference you get by subtracting the earlier date from the
    later date, as:


    ```

