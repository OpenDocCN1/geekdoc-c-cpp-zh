  \ info);\n  static void Coeff(Local<String> property,\n    Local<Value> value, const\
  \ PropertyCallbackInfo<Value>& info);\n\n  static v8::Persistent<v8::Function> constructor;\n\
  \  double a_;\n  double b_;\n  double c_;\n};\n```\n\n当迁移到 `Nan::ObjectWrap` 时，发生的重大变化集中在方法声明上。在这种情况下，使用\
  \ NAN 宏处理 `Init`、访问器和成员方法是明智的。此外，由于命名空间问题，`constructor` 对象必须移动到 `WrappedPoly` 之外，并从\
  \ `v8::Persistent<v8::Function>` 修改为 `Nan::Persistent<v8::FunctionTemplate>`。这里是完整的声明：\n\
