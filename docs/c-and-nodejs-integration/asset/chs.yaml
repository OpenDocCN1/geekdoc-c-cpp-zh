  \n## 场景 3：自动化基于文件的 C++ 程序\n\n我将介绍的最后一个场景是：你自动化的程序从文件读取输入，并将输出转到另一个文件。当然，你的场景可能是这里讨论的三个场景的组合——你的场景可能涉及固定的输入输出文件名，或者由用户指定（通过\
  \ stdin 或命令行参数）。无论你的情况如何，你可能都能应用所学。\n\n## 修改素数筛法以使用文件\n\n第一步是将素数筛法改造为使用文件的形式。应用程序将读取输入文件并写入输出文件。我模拟了最简单（但也最常见）的情况，即输入输出文件可以由用户指定（在这种情况下，通过命令行参数）。\n\
  \n```\n[](#cb288-1)#include <iostream>\n[](#cb288-2)#include <stdio.h>\n[](#21-3)#include\
  \ \"prime_sieve.h\"\n[](#cb288-4)using namespace std;\n[](#cb288-5)\n[](#cb288-6)int\
  \ main(int argc, char ** argvs) {\n[](#cb288-7)    int max;\n[](#cb288-8)    cout\
  \ << \"Please enter the maximum number:  \";\n[](#cb288-9)    cin  >> max;\n[](#cb288-10)\
  \    generate_primes(max, stdout);\n[](#cb288-11)}\n```\n\n我们可以通过在 `cpp/standalone_usr`\
  \ 执行熟悉的 `node-gyp configure build` 来构建这个 C++ 程序。这将生成一个 node 可以使用的目标。\n\n## 在 Web\
  \ 上处理基于文件的程序\n\n在深入 Node.js 路由之前，我们来谈谈基于文件的程序所面临的挑战。当这些程序被手动运行时——但如果你将它们放在 Web 上，很容易就会有多个请求（来自不同的浏览器）同时进入。确保这些并发执行的\
  \ C++ 程序不冲突至关重要——你需要确保它们读取和写入不同的文件。\n\n当你没有源代码的访问权限时，这可能说起来容易起来，特别是当应用程序不允许用户指定文件时（即它们硬编码在程序中！）。如果它们是硬编码的但使用相对路径，那么你可以对当前目录做文章，或者在每个\
  \ Web 请求的临时目录创建一个执行程序的副本（或其链接）。这在性能上是昂贵的，但可行的。如果文件路径被硬编码为绝对路径，你就有麻烦了。\n\n我通常通过为每个\
  \ Web 请求创建临时目录，并将输入输出文件放置在该目录来实现。这保护了每个运行实例不受相互干扰，同时保持输入输出名称的一致。\n\n现在让我们进入 Node.js\
  \ 路由。在 `web/routes/standalone_file.js` 顶部，我引入了 `temp` 模块，用它来处理临时目录和文件的创建。它会将临时文件放在对应平台的位置。\n\
  \n```\n[](#cb292-1)var temp = require('temp');\n```\n\n以下是位于 `web/routes/standalone_file.js`\
  \ 中的路由代码。\n\n\n\n\n\n```javascript\nrouter.post('/', function(req, res) {\n    var\
  \ execFile = require('child_process').execFile\n    var program = \n      \"../cpp/standalone_flex_file/build\"\
  +\n      \"/Release/standalone_flex_file\";\n\n    var under = parseInt(req.body.under);\n\
  \n    // Create a temporary directory, with \n    // node_example as the prefix\n\
  \    temp.mkdir('node_example', function(err, dirPath) {\n      // build full paths\
  \ for the input/output files\n      var inputPath = path.join(dirPath, 'input.txt');\n\
  \      var outputPath = path.join(dirPath, 'output.txt');\n\n      // write the\
  \ \"under\" value to the input files\n      fs.writeFile(inputPath, under, function(err)\
  \ {\n        if (err) throw err;\n\n        // once the input file is ready, execute\
  \ the C++ \n        // app with the input and output paths \n        // specified\
  \ on the command line\n        var primes = execFile(program, \n          [inputPath,\
  \ outputPath], function(error) { \n            if (error ) throw error;\n      \
  \      fs.readFile(outputPath, function(err, data) {\n              if (err) throw\
  \ err;\n              var primes = data.toString().split('\\n')\n              \
  \                .slice(0, -3)\n                              .map(function (line)\
  \ {\n                                  return parseInt(line);\n                \
  \              });\n              res.setHeader('Content-Type', 'application/json');\n\
  \              res.end(JSON.stringify({\n                results: primes\n     \
  \         }));\n\n              exec('rm -r ' + dirPath, function(error) {\n   \
  \             if (error) throw error;\n                console.log(\"Removed \"\
  \ + dirPath);\n              })\n          });\n        });\n      });\n    });\n\
  });\n```\n\n上面的代码首先创建了临时目录。然后它写入输入文件，并将输入和输出文件路径作为命令行参数启动子进程。一旦进程完成，我们读取输出文件以获取结果，并像之前一样将其返回给浏览器。最后，我们通过删除父目录来清理临时文件。这是重要的，因为尽管\
  \ `temp` 模块允许跟踪和自动删除临时文件，但它只在进程终止时才会进行清理。由于这是一个 Web 应用，我们（希望！）将等待很长时间让这种情况发生。\n\n\
  如你所见，这段代码受益于更好的控制流模式（如 async、promises 等）。我正尝试保持最精少的操作，这部分留给你们了 :)\n\n除了上面的路由之外，我在\
  \ `web/index.js` 的 `types` 数组中添加了这个最终场景，你可以像测试其他场景一样启动你的 Web 应用并测试这一个。\n\n## 在 Node.js\
  \ 中作为 DLL 调用原生 C++\n\n本节将完全聚焦于将你的 C++ 编译为共享库或 DLL，并使用 FFI 从 Node.js 调用该代码。我还将讨论在尝试将遗留\
  \ C++ 应用程序转换为可用的共享库时可能会遇到常见问题。\n\n*为什么要使用共享库 / DLL？*\n\n在自动化 C++ 应用程序时，你的优势是 JavaScript\
  \ 和 C++ 之间有非常的分离。自动化还允许你与几乎所有编程语言集成——只要它可以通过 stdin/stdout 或输入/输出文件进行自动化。但缺点是，你的\
  \ C++ 只有一个入口点——main。你完全可以在 C++ 和 Node 应用程序之间开发复杂的协调，但当你只想向 C++ 发送输入并等待结果时，自动化效果最好。\n\
  \n通常，你希望在 Node.js 和 C++ 之间进行细粒度的控制和协调。你希望能够通过函数调用 C++，而不仅仅是可执行文件的入口点。此外，你还希望通过返回值（或引用参数）获取这些函数的输出，而不是通过从\
  \ stdout 或某些输出文件中收集输出。\n\n在这种情况下，共享库（或 DLL）是一个极佳的解决方案。如果你的 C++ 已经是 DLL，那么你就可以立即开始——如果不是，你通常可以很容易地将遗留代码编译为\
  \ DLL——你只需要确定想要向调用者暴露哪些方法/函数。一旦有了 DLL，通过 Node.js 利用接口就非常简单（继续阅读下文！）。\n\n当自动化过于繁琐时，将遗留\
  \ C 或 C++ 应用程序转换为 DLL 是一个很好的集成选择。它还让你避免了使用 V8 API 开发 Node.js 程序的复杂性，这并不总是易的。\n\n\
  关于本节，请查看 `dll` 标签\n\n一旦你检出了代码，请花一点时间查看我设置的目录结构。`/cpp` 目录是我为自动化示例开发的所有 C++ 应用程序所在，其中\
  \ `/cpp/prime4standalone` 包含了质数生成的共享源码。现在我们需要修改质数代码，使其能够作为 DLL 良好地工作，我将这些代码放在 `/cpp/prime4lib`\
  \ 中。与之前一样，示例 Web 应用位于 `web` 中。我们将在本文中添加一个路由（`ffi`）——用于共享库的实现。\n\n### 准备 C++ 作为共享库\n\
  \n如果你正尝试将现有的共享库集成到 Node.js，那么你基本上可以跳过本节——你已经准备就绪了！如果你原本是独立程序（或其一部分）的遗留 C++ 代码，你需要先准备你的代码以作为共享库工作。这样做时主要的考虑因素是定义你的\
  \ API —— 即应该被主机代码（在我们的案例中为 Node.js）调用的函数。也许你的 C++ 已经组织得这些函数已准备就绪——但你可能需要进行一些重组。\n\
  \n另一个主要考虑因素是你如何获取 C++ 代码的输出。例如，在自动化期间，我从 Node 运行了一系列独立的 primesieve 应用程序——每个程序要么直接将质数输出到标准输出，要么输出到输出文件。但我们不希望共享库这样做——我们希望将输出返回给调用者。为了实现这一点，你可能需要一点创意——我将在下面的章节中展示我是如何做的。\n\
  \n这里是我希望我的共享库支持的 API。实际上，它并不算是一个 API —— 它只有一个函数！\n\n```cpp\nint getPrimes(int under,\
  \ int primes[]);\n```\n\n第一个参数代表最大值——我们将找到该值以下的所有质数。质数将被填充到第二个参数——一个数组中。假设该数组有足够的空间存储所有生成的质数（`under`\
  \ 是一个很好的“最大”尺寸）。该函数将返回实际找到多少个质数。\n\n#### 捕获输出\n\n现在让我们来看自动化示例中的代码。在 `/cpp/prime4standalone`\
  \ 内部，`primesieve.c` 文件有一个 main 函数：\n\n```cpp\nint generate_args(int argc, char *\
  \ argv[], FILE * out)\n```\n\n它还有一个适配器函数，将 argc/argv 参数替换为 `under`。在这两种情况下，请注意输出正在使用\
  \ `fprintf` 发送到 `out`。对于我们的 API，我们希望将输出放在数组内部。\n\n\n\n\n\n一种方法可能是直接开始修改底层的 `primesieve`\
  \ 实现，将 `fprintf` 调用替换为某些加载数组的代码。这种方法行得通（特别是当这些是新的 C++ 代码，或者至少是相当直观的 C++ 时），但它并不特别具有扩展性（如果你需要执行更复杂的动作来捕获输出该怎么办？）。我发现，修改遗留程序时最好的办法是保持更改简单——这正是我在这里要做的。\n\
  \n## 可从 C 或 C++ 调用的数据交换工具类\n\n与生活中的大多数事情一样，保持某件事的简单往往会让另一件事变得复杂。我的目标是将现有 `primeseive`\
  \ 代码中的每个 `fprintf` 语句替换为类似的简单函数：\n\n```cpp\nvoid pass(int prime);\n```\n\n我希望该 `send`\
  \ 函数能够将素数添加到数组中，该数组由调用的 Node.js 代码传入：\n\n```cpp\n// 由 Node.js 调用 - 调用 send 应该将 prime\
  \ 添加到 primes 中\nint getPrimes(int under, int primes[]);\n```\n\n这看起来足够简单，我们可以通过将\
  \ `send` 成为可以拥有数组引用的对象的成员方法来实现。然而，由于 `primeseive` 是纯 C 代码，这变得复杂了。\n\n让我们从位于 `exchange.h`\
  \ 中的数据交换类开始：\n\n```cpp\n#define _exchangeclass\n#include <iostream>\n#include <functional>\n\
  using namespace std;\n\nclass exchange {\npublic:\n    exchange(const std::function<void\
  \ (void * )> & c) {\n        this->callback = c;\n    }\n    void send(int data){\n\
  \       this->callback(&data);\n    }\nprivate:\n    std::function<void (void *\
  \ )> callback;\n};\n\n#include \"c_exchange.h\"\n```\n\n你会注意到的第一点是，类本身并不包含数组的引用。为了保持通用性，我只是让它持有一个回调函数——在示例中，该函数将负责将给定值存储到数组中，但它可以执行任何操作。\n\
  \n注意最后一行——我包含了一个名为 `c_exchange.h` 的独立头文件。`exchange` 类的 `send` 成员无法从 C 代码（`primesieve`）调用，正如你可能猜到的，`c_exchange.h`\
  \ 包含一个用于解决此问题的函数。让我们看看内部：\n\n```cpp\n#ifdef _exchangeclass\nextern \"C\" {\n#endif\n\
  \nvoid pass(void * exchanger, int data);\n\n#ifdef _exchangeclass\n}\n#endif\n```\n\
  \n首先，这个头文件将被 C++ 和 C 代码包含。声明 `exchange` 类的 `exchange.h` 定义了 `exchangeclass` 符号——因此第一行只是检测该符号是否已经存在。如果存在，则从\
  \ C 调用的 `pass 函数` 被封装在 `extern` 块中。\n\n`pass` 函数接受指向 `exchange` 对象的指针（使用 `void *`，因为\
  \ `exchange` 类对 C 调用者是不可见的）。在位于 `exchange.cpp` 的定义中，我们看到该指针转换回 `exchange` 对象并调用了\
  \ `send` 方法：\n\n```cpp\nvoid pass(void * exchanger, int data) {\n    exchange *\
  \ xchg = (exchange * ) exchanger;\n    xchg->send(data);\n}\n```\n\n这有点复杂，但 `exchange`\
  \ 类及其独立的 `pass` 辅助函数可以丢进几乎任何现有的 C++ 或 C 遗留程序中，只需在遗留代码中获取 `exchange` 对象的指针并将输出调用替换为\
  \ `pass` 即可。让我们在 `primesieve.c` 中这样做。\n\n## 修改 primesieve 使用传递函数\n\n在 `/cpp/prime4lib`\
  \ 内部，我有修改过的 `primesieve.h` 和 `primesieve.c`。旧的 `primesieve.h` 定义了以下两个函数：\n\n```cpp\n\
  // 用于独立程序的 primeseive.h\nint generate_args(int argc, char * argv[], FILE * out);\n\
  int generate_args(int under, FILE * out);\n```\n\n现在我将它们替换为以下签名：\n\n```cpp\n// 用于库调用的\
  \ primesieve.h\nint generate_args(int argc, char * argv[], void * out);\nint generate_args(int\
  \ under, void * out);\n```\n\n在 `primeseive.c` 内部，旧的独立代码在第 43 行有一个 `#define` 设置使用\
  \ `fprintf`（注意，我并不是原始 [primesieve 代码](http://wwwhomes.uni-bielefeld.de/achim/prime_sieve.html)\
  \ 的作者——我不知道那个复杂的打印方案背后的历史或意图。与大多数遗留应用一样，有时这些问题留不问更好！）。我们现在将 `fprintf(out, UL\"\\\
  n\",x)` 调用替换为调用 `pass(out, x)`。\n\n## 共享库入口点\n\n现在我们有了使用 `pass` 的 `primesieve.h/primeseive.c`\
  \ 实现，我们只需要创建一个 C++ 入口点，创建一个 `exchange` 对象并调用 primesieve 代码。我已经在 `/cpp/lib4ffi/primeapi.h`\
  \ 和 `/cpp/lib4ffi/primeapi.cpp` 中完成了工作。\n\n`primeapi.h` 是共享库的入口点，它包含了我上面想要的库 API\
  \ 函数的声明：\n\n```cpp\nextern C {\n    int getPrimes(int under, int primes[]);\n}\n\
  ```\n\n实现使用了 `exchange` 类，并使用 lambda 函数作为回调。如你所见，lambda 函数将发送的所有数据添加到数组中。\n\n```cpp\n\
  int getPrimes(int under, int primes[]) {\n  int count = 0;\n  exchange x(\n    \
  \    & {\n            int * iptr = (int * ) data;\n            primes[count++] =\
  \ * iptr;\n        }\n  );\n\n  generate_primes(under, (void*)&x);\n  return count;\n\
  }\n```\n\n现在，当我们调用定义在 `primesieve.h` 中的 `generate_primes` 时，我们传入我们的交换引用。在 `primesieve.c`\
  \ 中，该 exchange 对象的引用被称为 `out`。`primesieve.c` 中所有对 `pass(out, x)` 的调用导致指针 `out` 被强制转换为\
  \ `exchange` 对象（在 `exchange.cpp` 中），并触发回调（lambda）。最终结果是，`primesieve` 计算的所有值都存在于\
  \ `primes` 数组中。\n\n## 使用 gyp 构建共享库\n\n现在我们需要构建我们的共享库。幸运的是，我们熟悉的同一个工具 set——`node-gyp`——在这里也可以帮助我们。在\
  \ `/cpp/lib4ffi` 内部，你会找到另一个名为 `binding.gyp` 的配置文件。它与自动化示例中独立示例的 gyp 文件非常相似，但它链接的是\
  \ `/cpp/prime4lib` 中的 primesieve 文件，而不是 `/cpp/prime4standalone`，并且其构建类型是 `shared_library`\
  \ 而不是 `executable`。\n\n通过 `cpp/lib4ffi` 执行熟悉的 `node-gyp configure build` 来构建共享库。这将生成一个可以在\
  \ node 中使用的目标共享库。共享库将位于 `/cpp/lib4ffi/build/Release`——带有特定于你操作系统的扩展名（例如，OS X 上的\
  \ `prime.dylib`，Windows 上的 `prime.dll`）。\n\n\n\n\n经过所有的工作，我们已经有了一个共享库 - 现在让我们从 Node.js\
  \ 中调用它。为了做到这一点，我们将使用 Node 的外部函数接口 ([node-ffi](https://github.com/node-ffi/node-ffi))。`node-ffi`\
  \ 是一个 Node.js 插件，用于使用纯 JavaScript 加和调用动态库。你可以在 [`github.com/node-ffi/node-ffi/wiki/Node-FFI-Tutorial`](https://github.com/node-ffi/node-ffi/wiki/Node-FFI-Tutorial)\
  \ 找到一个非常好的教程，它更详细地进行了概述。特别是，请查看 [async](https://github.com/node-ffi/node-ffi/wiki/Node-FFI-Tutorial#async-library-calls)\
  \ 部分，它向你了如何使用 `libuv` 在自己的线程中轻松地调用共享库方法，从而不会阻塞主 Node.js 事件循环！\n\n使用 `node-ffi` 的关键部分之一是掌握\
  \ `ref` 模块，以便在 Node.js `Buffer` 对象（附录 B 的主题）之上构建原生数据类型。这些数据类型（int、数组等）允许你与共享库内部的原生函数进行交互。\n\
  \n我们的 API 只有一个调用，它使用两个整数和一个整数数组作为返回类型和参数：\n\n```\n[](#cb305-1)int getPrimes(int\
  \ under, int primes[]);\n```\n\n简单的整数不需要我们做太多（`node-ffi` 会自动在 JavaScript 数字类型之间进行转换），但我们确实需要分配一个整数数组来存储我们的结果。这里是我们使用\
  \ `ref` 的的方法：\n\n```\n[](#cb306-1)var ArrayType = require('ref-array');\n[](#cb306-2)var\
  \ IntArray = ArrayType(int);\n[](#cb306-3)var a = new IntArray(10); // 创建一个大小为 10\
  \ 的整数数组\n```\n\n接下来，我们使用 `ref` 数据类型标识符和 `node-ffi` 来定义与我们库的接口：\n\n```\n[](#cb307-1)var\
  \ ffi = require('ffi')\n[](#cb307-2)var ref = require('ref')\n[](#cb307-3)var int\
  \ = ref.types.int\n[](#cb307-4)\n[](#cb307-5)var libprime = \n[](#cb307-6)  ffi.Library('../cpp/lib4ffi/build/Release/prime',\
  \ {\n[](#cb307-7)  'getPrimes': [ int, [ int, IntArray] ]\n[](#cb307-8)})\n```\n\
  \n`libprime` 变量现在代表我们在上一节中创建的共享库中的 `getPrimes` 函数。我们可以调用该函数，它的返回类型可以保存到普通的 JavaScript\
  \ 数字变量中。我们可以使用返回的计数从 `IntArray` 中提取质数 - 从而为我们提供 10 以下的所有质数。\n\n```\n[](#cb308-1)var\
  \ count = libprime.getPrimes(under, a);\n[](#cb308-2)var primes = a.toArray().slice(0,\
  \ count);\n```\n\n### 整合一切\n\n现在我们已经有了共享库，以及可以调用它的 Node.js 代码，让我们将其全部封装在我们不断增长的\
  \ Web 应用示例的自己的路由中。在 `/web/index.js` 文件中，我们将添加另一个名为 `ffi` 的路由条目。\n\n```\n[](#cb309-1)var\
  \ types = \n[  {\n[](#cb309-3)    title: \"pure_node\",\n[](#cb309-4)    description:\
  \ \"Execute a really primitive \" + \n[](#cb309-5)        \"implementation of prime\
  \ sieve in Node.js\"\n[](#cb309-6)  },\n[](#cb309-7)  ... 自动化示例路由的条目...\n[](#cb309-8)\
  \  {\n[](#cb309-9)    title: \"ffi\",\n[](#cb309-10)    description: \"Using Node\
  \ Foreign Function \" + \n[](#cb309-11)        \"Interface (ffi) to call C++ code.\
  \  Based on /cpp/lib4ffi\"\n[](#cb309-12)  }\n[](#cb309-13)  ];\n```\n\n该 `type`\
  \ 数组用于通过查找 `web/routes/` 目录中与每个 `title` 属性同名的文件来创建路由：\n\n```\n[](#cb310-1)types.forEach(function\
  \ (type) {\n[](#cb310-2)    app.use('/'+type.title, require('./routes/' + type.title));\n\
  [](#cb310-3)});\n```\n\n现在让我们 `/web/routes/ffi.js` 中添加我们的路由。相关的 post 处理器如下，它看起来与上面的\
  \ `ffi` 示例非常相似：\n\n```\n[](#cb311-1)router.post('/', function(req, res) {\n[](#cb311-2)\
  \    var ffi = require('ffi')\n[](#cb311-3)    var ref = require('ref')\n[](#cb311-4)\
  \    var ArrayType = require('ref-array')\n[](#cb311-5)    var int = ref.types.int\n\
  [](#cb311-6)    var IntArray = ArrayType(int)\n[](#cb311-7)    var libprime = \n\
  [](#cb311-8)    ffi.Library('../cpp/lib4ffi/build/Release/prime', {\n[](#cb311-9)\
  \    'getPrimes': [ int, [ int, IntArray] ]\n[](#cb311-10)})\n[](#cb311-11)    var\
  \ count = libprime.getPrimes(under, a);\n[](#cb311-12)    var primes = a.toArray().slice(0,\
  \ count);\n[](#cb311-13)    res.setHeader('Content-Type', 'application/json')\n\
  [](#cb311-14)    res.end(JSON.stringify({\n[](#cb311-15)      results: primes\n\
  [](#cb311-16)    }));\n```\n\n\n\n现在让我们创建一个执行计算的函数。它的大部分内容在之前关于共享库的文章中很熟悉，我们将使用\
  \ `exchange` 类来收集来自 `primesieve` 的输出。主要的区别在于，我们将数据收集到一个 V8 本地数组（Local Array）中，这可以整体返回给调用它的\
  \ JavaScript 代码。在深入 C++ 之前，这里是该函数在 JavaScript 中（几乎）被使用的方式：\n\n```\n[](#cb313-1)var\
  \ primes = primenode.getPrimes(under);\n[](#cb313-2)// primes 现在是小于 under 的所有质数的数组\n\
  ```\n\n这里是 C++ 代码：\n\n```cpp\n[](#cb314-1)NAN_METHOD(CalculatePrimes) {\n[](#cb314-2)\
  \    Nan:: HandleScope scope;\n[](#cb314-3) \n[](#cb314-4)    int under = To<int>(info[0]).FromJust();\n\
  [](#cb314-5)    v8::Local<v8::Array> results = New<v8::Array>(under);\n[](#cb314-6)\n\
  [](#cb314-7)    int i = 0;\n[](#cb314-8)    exchange x(\n[](#cb314-9)        & {\n\
  [](#cb314-10)            Nan::Set(results, i, \n[](#cb314-11)              New<v8::Number>(*((int\
  \ *) data)));\n[](#cb314-12)            i++;\n[](#cb314-13)       });\n[](#cb314-14)\n\
  [](#cb314-15)    generate_primes(under, (void*)&x);\n[](#cb314-16)\n[](#cb314-17)\
  \    info.GetReturnValue().Set(results);\n[](#cb314-18)}\n```\n\n在提取出必要的参数并为结果创建一个数组后，我们开始处理\
  \ `exchange` 类工作。我们正在创建一个回调，`primesieve` (`generate_primes`) 在每次发现一个质数时都会调用它。在这里，我们不是将每个质数添加到\
  \ vector 中，而是将其添加到我们声明的本地 V8 数组中。注意，该数组将是“过度尺寸的”，因为如果 \"under\" 是 100，那么小于 100 的质数显然没有\
  \ 100 个！以后通过 JavaScript 访问时，未显式设置的元素将被设置为 `undefined`。我们现在调用 primesieve 的实现，它将执行并通过\
  \ `exchange` 对象增量地用质数填充数组。\n\n```cpp\n[](#cb315-1)int i = 0;\n[](#cb315-2)exchange\
  \ x(\n[](#cb315-3)    & {\n[](#cb315-4)        Nan::Set(results, i, New<v8::Number>(*((int\
  \ *) data)));\n[](#cb315-5)        i++;\n[](#cb315-6)   });\n[](#cb315-7)\n[](#cb315-8)generate_primes(under,\
  \ (void*)&x);\n```\n\n最后，我们需要在 V8 中注册此函数 (`CalculatePrimes`)，我们在文件底部完成操作：\n\n```cpp\n\
  [](#cb316-1)NAN_MODULE_INIT(Init) {\n[](#cb316-2)    Nan::Set(target, \n[](#cb316-3)\
  \      New<String>(\"getPrimes\").ToLocalChecked(),\n[](#cb316-4)      GetFunction(\n\
  [](#cb316-5)          New<FunctionTemplate>(CalculatePrimes))\n[](#cb316-6)    \
  \      .ToLocalChecked());\n[](#cb316-7)}\n[](#cb316-9)NODE_MODULE(addon, Init)\n\
  ```\n\n### 编译插件\n\n我们可以使用熟悉的 `binding.gyp` 文件来编译插件：\n\n```json\n[](#cb317-1){\n\
