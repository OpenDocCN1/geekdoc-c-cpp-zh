  \ `N`，特别是当它很大时，非常耗时——然而，我们是连续计算因子的，而不是一次性计算。让我们尝试开发一个 C++ 插件，在计算出因子的同时*发射*它们——这将得到一个看起来类似这样的\
  \ Node.js 程序：\n\n```javascript\n// factorization.js\nvar factor = require(<path\
  \ to addon>);\n\nconst factorization = factor({n:9007199254740991});\n\nfactorizer.on('factor',\
  \ function(factor){\n    console.log(\"Factor:  \" + factor);\n});\n\nfactorizer.on('close',\
  \ function() {\n    console.log(\"Factorization complete\");\n});\n```\n\n我们最终得到如下输出：\n\
  \n```\nFactor:  6361\nFactor:  69431\nFactor:  20394401\nFactorization complete\n\
  ```\n\n如你所见，这个假设的插件发射类型为 `factor` 的事件，以及标准的 `close` 事件（可能还有 `error` 事件！）。\n\n让我们来构建它。\n\
  \n### 构建 C++ 插件\n\nC++ 插件代码的核心是因数分解过程。在进入所有插件的样板代码和线程安全之前，我们可以先建模 C++ 代码实际上应该是什么样的：\n\
  \n```cpp\nvoid factorize(uint32_t n) {\n    while (n%2 == 0) {\n        writeToNode(2);\n\
  \        n = n/2;\n    }\n    for (uint32_t i = 3; i <= n; i = i+2) {\n        while\
  \ (n%i == 0) {\n            writeToNode(i);\n            n = n/i;\n        }\n \
  \   }\n}\n```\n\n这里的关键点是 `send_to_node` 方法必须 (1) 跨线程边界将整数因子从工作线程传递到事件循环线程，并且 (2)\
  \ 映射到一个适当事件发射器上。注意，`send_to_node` 本质上是“发送进度”问题——我们有一个长时间运行并频繁发送更新的插件。正如我们在第 6 章中看到的，`nan`\
  \ 为此类插件提供了一个极佳的起点，即 `AsyncProgressWorker`。我们将很大程度上接持这个类，并进行一些重要的更改，以确保我们的插件接收到我们发送的*每一个*消息\
  \ [2]。\n\n首先，我们创建一个计算因数分解的 `AsyncProgressWorker` 标准实现。由于我们已经在第 6 章中涵盖过这个主题，现在处理起来应该非常简单：\n\
  \n```cpp\nclass Factorizer : public AsyncProgressWorker {\n public:\n  Factorizer(Callback\
  \ *progress, Callback *callback, uint32_t n)\n    : AsyncProgressWorker(callback),\
  \ progress(progress), n(n)\n    {}\n  ~Factorizer() {}\n\n  // 在新的工作线程（后台）执行\n \
  \ void Execute (\n      const AsyncProgressWorker::ExecutionProgress& progress)\
  \ {\n    uint32_t factor = 2;\n    while (n%2 == 0) {\n        progress.Send(\n\
  \            reinterpret_cast<const char*>(&factor), \n            sizeof(uint32_t));\n\
  \        n = n/2;\n    }\n    for (uint32_t i = 3; i <= n; i = i+2) {\n        while\
  \ (n%i == 0) {\n            progress.Send(\n                reinterpret_cast<const\
  \ char*>(&i), \n                sizeof(uint32_t));\n            n = n/i;\n     \
  \   }\n    }\n  }\n\n  // 在事件循环线程执行\n  void HandleProgressCallback(const char *data,\
  \ size_t size) {\n    HandleScope scope; \n    v8::Local<v8::Value> argv[] = {\n\
  \          New<v8::Integer>(\n              *reinterpret_cast<int*>(const_cast<char*>(data)))\n\
  \    };\n    progress->Call(1, argv);\n  } \n\n protected:\n  Callback *progress;\n\
  \  uint32_t n;\n};\n\nNAN_METHOD(Factor) {\n  Callback *progress = new Callback(info[1].As<v8::Function>());\n\
  \  Callback *callback = new Callback(info[2].As<v8::Function>());\n  AsyncQueueWorker(new\
  \ Factorizer( callback, progress\n    , To<uint32_t>(info[0]).FromJust()\n  ));\n\
  }\n\nNAN_MODULE(Init) {\n  v8::Local<v8::Object> target = env->Global();\n  v8::Local<v8::Object>\
  \ exports = target->Exports();\n  exports->Set(exports, v8::String::NewFromUtf8(env,\
  \ \"factorize\").ToLocal(),\n      v8::Function::New(env, factorize).ToLocal()).Check();\n\
  \  return;\n}\n```\n\n上述代码创建了插件，现在我们可以这样使用它：\n\n```javascript\n\"use strict\";\n\
  const path = require(\"path\");\nconst addon = require(path.join(__dirname, \"build/Release/factorization\"\
  ));\nconst factorization = addon({n:9007199254740991});\n\nfactorization.on('factor',\
  \ function(factor){\n    console.log(\"Factor:  \" + factor);\n});\n\nfactorization.on('close',\
  \ function() {\n    console.log(\"Factorization complete\");\n});\n```\n\n遗憾的是，如果你在快速机器上运行它，你将得到一个相当令人失望的输出：\n\
  \n```\nFactor:  65537\nFactorization complete\n```\n\n其他的因子去哪了——例如 3, 5, 17 和 257？同样，`AsyncProgressWorker`\
  \ 的实现在这里再次反噬了我们，因为内部没有内置用于在单个事件循环周期内处理多个“进度”更新的功能。我们在事件循环有机会处理我们的请求之前，最终调用了 5 次\
  \ `progress.Send`——每次都覆盖了“当前”进度。只有最后一个值被传递了。\n\n我们可以通过重新实现 `AsyncProgressWorker`\
  \ 来修复这个问题，但让我们构建一个队列来存放我们发送的每条消息，然后确保每次当 `HandleProgressCallback` 回调被调用时（至少一次，如果工作线程尚未完成），我们清空队列——通过单独的进度回调调用将每个项目发送到\
  \ JavaScript。\n\n\n\n这里是队列，它将在剩余的示例中用到，因此我对其进行了模板化。我们目前只需使用 `readAll`，但在随后的示例中，我们将使用\
  \ `read` 来每次从队列中获取一个项。它使用 C++11 同步原语确保线程安全。\n\n```cpp\ntemplate<typename Data>\n\
  class PCQueue\n{\npublic:\n    void write(Data data) {\n        while (true) {\n\
  \            std::unique_lock<std::mutex> locker(mu);\n            buffer_.push_back(data);\n\
  \            locker.unlock();\n            cond.notify_all();\n            return;\n\
  \        }\n    }\n    Data read() {\n        while (true)\n        {\n        \
  \    std::unique_lock<std::mutex> locker(mu);\n            cond.wait(locker, [this](){\n\
  \                return buffer_.size() > 0;\n            });\n            Data back\
  \ = buffer_.front();\n            buffer_.pop_front();\n            locker.unlock();\n\
  \            cond.notify_all();\n            return back;\n        }\n    }\n  \
  \  void readAll(std::deque<Data> & target) {\n        std::unique_lock<std::mutex>\
  \ locker(mu);\n        std::copy(\n            buffer_.begin(), \n            buffer_.end(),\
  \ \n            std::back_inserter(target));\n        buffer_.clear();\n       \
  \ locker.unlock();\n    }\n    PCQueue() {}\nprivate:\n    std::mutex mu;\n    std::condition_variable\
  \ cond;\n    std::deque<Data> buffer_;\n};\n```\n\n现在让我们其中一个队列放入我们的工作类中（命名为 `toNode`，类型为\
  \ `PCQueue<uint32_t>`），并调整回调，以便队列用于存储进度消息。首先，让我们创建一个私有函数 `drainQueue`，它读取所有项并通过调用提供的回调函数将它们发送到\
  \ Node。\n\n```cpp\n// Factorizer 类中的私有方法\nvoid drainQueue() {\n    HandleScope scope;\n\
  \    // 抽空队列 - 因为对于多次写入，\n    // 该方法可能只被调用一次\n    std::deque<uint32_t> contents;\n\
  \    toNode.readAll(contents);\n    for(uint32_t & item : contents) {\n        v8::Local<v8::Value>\
  \ argv[] = {\n          New<v8::Integer>(*reinterpret_cast<int*>(&item))\n     \
  \   };\n        progress->Call(1, argv);\n    }\n}\n```\n\n我们现在可以在 `HandleProgressCallback`\
  \ 方法中使用此函数，也可以在 `HandleOKCallback` 中使用——它是 `AsyncProgressWorker` 中的一个虚函数，我们现在将重写它。\n\
  \n```cpp\nvoid HandleOKCallback() {\n    drainQueue();\n    callback->Call(0, NULL);\n\
  }\n\nvoid HandleProgressCallback(const char *data, size_t size) {\n  drainQueue();\n\
  }\n```\n\n现在让我们处理将我们的因数放入此队列。让我们创建一个包装函数，接受 `progress` 对象和 `uin32_t` 数据项，并将数据添加到队列并触发进度事件。注意，队列是通过\
  \ `progress.Send` 发送的。实际上，我们可以发送任何内容——我们实际上忽略了发送到此函数的内容，因为这些调用将导致 `drainQueue` 被调用。我将代码清理留给读者——如果我们愿意修改\
  \ `AsynProgressWorker` 本身的实际实现，可以做一些显的简化。\n\n```cpp\n// Factorizer 的保护成员\nvoid writeToNode(\n\
  \    const AsyncProgressWorker::ExecutionProgress& progress, \n    uint32_t & factor){\n\
  \ \n  toNode.write(factor);\n  progress.Send(\n      reinterpret_cast<const char*>(&toNode),\
  \ sizeof(toNode));\n}\n```\n\n我们将用新的包装函数替换 `Execute` 中对 `progress.Send` 的调用，现在我们的输出将捕获所有内容了！\n\
  \n```cpp\nvoid Execute (\n    const AsyncProgressWorker::ExecutionProgress& progress)\
  \ { \n  \n  uint32_t factor = 2;\n  while (n%2 == 0) {\n     writeToNode(progress,\
  \ factor);\n     n = n/2;\n  }\n  for (uint32_t i = 3; i <= n; i++) {\n     while\
  \ (n%2 == 0) {\n        writeToNode(progress, factor);\n        n = n/2;\n     }\n\
  \  }\n}\n```\n\n### 创建 EventEmitter\n\n我们有一个可以运行的插件，但我们最初的目标是将其作为 EventEmitter 进行交互。EventEmitter\
  \ 应该发出命名的事件，外加 \"error\" 和 \"close\"  事件。我们必须在两个方面更改插件以方便其成为 EventEmitter：(1) 我们应该从插件发送键/值对（事件名，事件数据）而不仅仅是数据，(2)\
  \ 我们应该有一个错误回调。\n\n第一个更改非常简单——不再发送 `uint32_t` 实例，让我们发送一个新对象——`Message`。`Message`\
  \ 将是一个键/值对对象——其数据为字符串以最大化灵活性。使用模板而不是将数据序列化为字符串的任务将留给读者作为练习。\n\n```cpp\nclass Message\
  \ {\npublic:\n  string name;\n  string data;\n  Message(string name, string data)\
  \ : name(name), data(data){}\n};\n```\n\n我们最初放在 `Factorizer` 中的队列现在将持有 `Message`\
  \ 对象而不是 `uint32_t`。在向 node 发送数据时，我们将构造名称为 \"factor\" 的消息对象。\n\n第二个更改仅仅是添加错误回调。`AsyncProgressWorker`\
  \ 已经有一个内置的 `HandleCallaback` 虚函数，我们可以重写它在发生错误时调用 JS 回调。我们需要创建一个新的保护成员 `error_callback`，它将在启动插件时被传递给\
  \ `Factorizer` 的构造函数。\n\n```cpp\nvoid HandleErrorCallback() {\n    HandleScope scope;\n\
  \    \n    v8::Local<v8::Value> argv[] = {\n        // ErrorMessage() 是 `AsyncWorker`\
  \ 的方法，\n        // `AsyncProgressWorker` 的基类。\n        v8::Exception::Error(New<v8::String>(ErrorMessage())\n\
  \            .ToLocalChecked())\n    };\n    error_callback->Call(1, argv);\n  }\n\
  ```\n\n这里是完整的代码列表，包括修改后的构造函数以及为了适应错误回调的 Node/nan 样板代码。\n\n\n\n\n\n```cpp\nclass\
  \ Factorizer : public AsyncProgressWorker {\npublic:\n  Factorizer(Callback *progress,\
  \ Callback *callback, \n    Callback *error_callback, uint32_t n)\n    : AsyncProgressWorker(callback),\
  \ progress(progress), \n    error_callback(error_callback), n(n)\n    {\n  }\n\n\
  \  ~Factorizer() {}\n\n  void Execute (\n      const AsyncProgressWorker::ExecutionProgress&\
  \ progress) {\n    uint32_t factor = 2;\n    while (n%2 == 0) {\n        send_factor(progress,\
  \ factor);\n        n = n/2;\n    }\n    for (uint32_t i = 3; i <= n; i = i+2) {\n\
  \        while (n%i == 0) {\n            send_factor(progress, i);\n           \
  \ n = n/i;\n        }\n    }\n  }\n\n  void HandleOKCallback() {\n    drainQueue();\n\
  \    callback->Call(0, NULL);\n  }\n\n  void HandleProgressCallback(const char *data,\
  \ size_t size) {\n    drainQueue();\n  }\n\n  void HandleErrorCallback() {\n   \
  \ HandleScope scope;\n    v8::Local<v8::Value> argv[] = {\n      v8::Exception::Error(New<v8::String>(ErrorMessage())\n\
  \        .ToLocalChecked())\n    };\n    error_callback->Call(1, argv);\n  }\n\n\
  protected:\n  Callback *progress;\n  Callback *error_callback;\n  uint32_t n;\n\
  \  PCQueue<Message> toNode;\n\n  void send_factor(\n      const AsyncProgressWorker::ExecutionProgress&\
  \ progress, \n      long long factor) {\n    Message tosend(\"factor\", std::to_string(factor));\n\
  \    writeToNode(progress, tosend);\n  }\n\n  void writeToNode(\n      const AsyncProgressWorker::ExecutionProgress&\
  \ progress, \n      Message & msg){\n    toNode.write(msg);\n    progress.Send(\n\
  \        reinterpret_cast<const char*>(&toNode), sizeof(toNode));\n  }\n\n  void\
  \ drainQueue() {\n      HandleScope scope;\n      // drain the queue - since we\
  \ might only get \n      // called once for many writes\n      std::deque<Message>\
  \ contents;\n      toNode.readAll(contents);\n\n      for(Message & msg : contents)\
  \ {\n          v8::Local<v8::Value> argv[] = {\n            New<v8::String>(msg.name.c_str()).ToLocalChecked(),\
  \ \n            New<v8::String>(msg.data.c_str()).ToLocalChecked()\n          };\n\
  \          progress->Call(2, argv);\n      }\n  }\n};\n\nNAN_METHOD(Factor) {\n\
  \  Callback *progress = new Callback(info[1].As<v8::Function>());\n  Callback *callback\
  \ = new Callback(info[2].As<v8::Function>());\n  Callback *error_callback = \n \
  \   new Callback(info[3].As<v8::Function>());\n\n  AsyncQueueWorker(new Factorizer(\n\
  \      callback\n    , progress\n    , error_callback\n    , To<uint32_t>(info[0]).FromJust()\n\
  \  ));\n}\n```\n\n### 构建 JS 适配器\n\n我们的最后一步是将此插件封装在一个 `EventEmitter` 中。目前，它将是 `factorization.js`\
  \ 中的一个简单 JavaScript 函数，但稍后我们将对其进行调整以使其可复用。\n\n```javascript\nconst EventEmitter\
  \ = require('events');\n\nvar make_factorizer = function(n) {\n    var addon_path\
  \ = path.join(\n        __dirname, \"build/Release/factorization\");\n\n    const\
  \ worker = require(addon_path);\n    var emitter = new EventEmitter();\n    worker.factorize(n,\n\
  \        function () {\n            emitter.emit(\"close\");\n        },\n     \
  \   function(event, value){\n            emitter.emit(event, value);\n        },\n\
  \        function(error) {\n            emitter.emit(\"error\", error);\n      \
  \  });\n    return emitter;\n}\n```\n\n注意，我们没有返回 worker —— 只返回了 emitter。我们的主 JavaScript\
  \ 现在可以通过以下方式与插件交互：\n\n```javascript\nvar addon = make_factorizer(900719925474091);\n\
  \naddon.on('factor', function(factor){\n    console.log(\"Factor: \" + factor);\n\
  });\n\naddon.on('close', function() {\n    console.log(\"Factorization is complete\"\
  );\n});\n\naddon.on('error', function(e) {\n    console.log(e);\n});\n```\n\n###\
  \ 通用基于事件的插件\n\n在继续后续示例之前，了解我们如何泛化这种结构以使创建插件变得简单将帮助。任何基于此接口的插件都具有一些共同特征：\n\n1. 它必须接受一个完成、进度和错误回调函数。\n\
  2. 它可能需要一些初始化值（对于因数分解，为 `n` - 要分解的数字）。\n3. 它将使用上面创建的 `writeToNode` 方法将数据传回 Node。\n\
  \n为了让这一切变得可复用，我们将创建一个头文件（`streaming-worker.h`）。我们将在其中定义工具类（`PCQueue` 和 `Message`）。此外，我们将创建一个基类\
  \ `StreamingWorker`，它继承自 `AsyncProgressWorker` 并提供通用设施，如 `HandleOkCallback`、`HandleProgressCallback`、`HandleErrorCallback`\
  \ 和 `sendToNode` 方法。我们的各个插件基本上只需要继承自 `StreamingWorker`，重写 `Execute` 方法并提供相应的构造函数。\n\
  \n\n\n\n\n```cpp\nclass StreamingWorker : public AsyncProgressWorker {\npublic:\n\
  \  StreamingWorker(Callback *progress, Callback *callback,\n    Callback *error_callback)\n\
  \    : AsyncProgressWorker(callback), progress(progress), \n    error_callback(error_callback)\n\
  \  {\n    // 注意没有第 4 个参数 - 初始化变量\n    // 将由扩展此类的类处理。\n  }\n\n  // 与质数分解示例相同\n  ~StreamingWorker();\
  \ \n\n  // 与质数分解示例相同\n  void HandleErrorCallback(); \n\n  // 与质数分解示例相同\n  void HandleOKCallback()\
  \ ; \n\n  // 与质数分解示例相同\n  void HandleProgressCallback(const char *data, size_t size)\
  \ ; \n\nprotected:\n\n  // 与质数分解示例相同\n  void writeToNode(\n      const AsyncProgressWorker::ExecutionProgress&\
  \ progress, \n      Message & msg); \n\n  // 与质数分解示例相同\n  void drainQueue();\n\n\
  \  Callback *progress;\n  Callback *error_callback;\n  PCQueue<Message> toNode;\n\
  \  bool input_closed;\n};\n```\n\n这重构了我们对原始 `Factorization` 类的实现。以下代码的功能与之前的实现相同，但创建插件的第\
  \ 4 个参数是一个 JavaScript 对象而不是普通的整数 - 为了允许其他初始化参数。这对于质数分解来说没用，但正如我们稍后看到的，构造函数的签名在所有插件中将保持不变\
  \ - 因此保持灵活性是有意义的。\n\n```cpp\nclass Factorization : public StreamingWorker {\n  public:\n\
  \    Factorization(Callback *data, Callback *complete, \n      Callback *error_callback,\
  \  v8::Local<v8::Object> & options) \n          : StreamingWorker(data, complete,\
  \ error_callback){\n\n        N = -1;\n        if (options->IsObject() ) {\n   \
  \       v8::Local<v8::Value> n_ = \n            options->Get(New<v8::String>(\"\
  n\").ToLocalChecked());\n\n          if ( n_->IsNumber() ) {\n            N = n_->NumberValue();\n\
  \          }\n        }\n\n        if ( N < 0 ) {\n          SetErrorMessage(\"\
  无法计算负数的质因数分解\n            + \"(long long 溢出？！)!\");\n        }\n    }\n\n    void\
  \ send_factor(\n        const AsyncProgressWorker::ExecutionProgress& progress,\
  \ \n        long long factor) {\n\n        Message tosend(\"factor\", std::to_string(factor));\n\
  \        writeToNode(progress, tosend);\n    }\n\n    void Execute (\n        const\
  \ AsyncProgressWorker::ExecutionProgress& progress) { \n\n      long long n = N;\n\
  \      while (n%2 == 0)\n      {\n        send_factor(progress, 2);\n        n =\
  \ n/2;\n      }\n\n      for (long long i = 3; i <= n; i = i+2) {\n          while\
  \ (n%i == 0) {\n            send_factor(progress, i);\n            n = n/i;\n  \
  \        }\n      }\n    }\n  private:\n    long long N;\n};\n```\n\n我们 C++ 设置的另一个问题是，我们提供的唯一“入口”是构造函数\
  \ - 没有机制在插件创建后对其进行控制。我们将通过使用 `Nan::ObjectWrap` 包装我们的插件类来修复这个问题，这将允许我们将插件像真正的对象一样处理，并带有方法（将在后的示例中添加）。这有助于促进通用（可重用）Node/Nan\
  \ 模板代码。\n\n第一步是创建一个 `StreamingWorkerWrapper` 类。该类将包装*任何* `StreamingWorker` 插件 -\
  \ 我们不需要对其进行任何扩展。此代码使用了我们在第 5 章和第 6 章看到的所有概念。注意，在目前状态下，包装器没有关联任何字段（方法） - 但很快就会改变。\n\
  \n```cpp\nclass StreamWorkerWrapper : public Nan::ObjectWrap {\n public:\n  static\
  \ NAN_MODULE_INIT(Init) {\n    v8::Local<v8::FunctionTemplate> tpl = \n        Nan::New<v8::FunctionTemplate>(New);\n\
  \    tpl->SetClassName(\n        Nan::New(\"StreamingWorker\").ToLocalChecked());\n\
  \    tpl->InstanceTemplate()->SetInternalFieldCount(0);\n\n    constructor().Reset(\n\
  \        Nan::GetFunction(tpl).ToLocalChecked());\n    Nan::Set(target,\n      \
  \  Nan::GetFunction(tpl));\n  }\n\n private:\n  explicit StreamWorkerWrapper(StreamingWorker\
  \ * worker)\n    : _worker(worker) {}\n  ~StreamWorkerWrapper() {}\n  static NAN_METHOD(New)\
  \ {\n    if (info.IsConstruct()) {\n      Callback *data_callback = \n        new\
  \ Callback(info[0].As<v8::Function>());\n      Callback *complete_callback = \n\
  \        new Callback(info[1].As<v8::Function>());\n      Callback *error_callback\
  \ = \n        new Callback(info[2].As<v8::Function>());\n      v8::Local<v8::Object>\
  \ options = info[3].As<v8::Object>();\n      StreamWorkerWrapper *obj = new StreamWorkerWrapper(\n\
  \            create_worker(data_callback, complete_callback, \n            error_callback,\
  \ options));\n      obj->Wrap(info.This());\n      info.GetReturnValue().Set(info.This());\n\
  \n      // 启动 worker\n      AsyncQueueWorker(obj->_worker);\n    } else {\n    \
  \  const int argc = 3;\n      v8::Local<v8::Value> argv[argc] = {\n        info[0],\
  \ info[1], info[2]\n      };\n\n      v8::Local<v8::Function> cons = Nan::New(constructor());\n\
  \      info.GetReturnValue().Set(cons->NewInstance(argc, argv));\n    }\n  }\n\n\
  \  static inline Nan::Persistent<v8::Function> & constructor() {\n    static Nan::Persistent<v8::Function>\
  \ my_constructor;\n    return my_constructor;\n  }\n\n  StreamingWorker * _worker;\n\
  };\n```\n\n该包装器中扩展的主要点是构造方法中对 `create_worker` 的调用。各个插件将能够方法实例化 `StreamingWorker`\
  \ 的实际实现。`create_worker` 的原型将在 `streaming-worker.h` 中定义，但其*实现*将在插件自身的源码中。该函数传递 3\
  \ 个回调函数加上第 4 个参数，后者是一个包含初始化参数的对象。\n\n这里是质数分解插件的 `create_worker` 实现（注意，它不是 `Factorizer`\
  \ 的成员方法，而是独立的）。\n\n\n\n\n```cpp\nStreamingWorker * create_worker(\n    Callback\
  \ *data, Callback *complete , \n    Callback *error_callback, v8::Local<v8::Object>\
  \ & options) {\n return new Factorization(data, complete, error_callback, options);\n\
  }\n```\n\n每个插件（addon）需要做的另一事情是通过典型的 `nan` 模板代码将包装类暴露给 JavaScript。\n\n以下是对结构的简要回顾：\n\
  \n### 在 `streaming-worker.h` 中 - 意在每个插件中重用\n\n1. `PQueue` 和 `Message` 类的实现\n2. `StreamingWorker`\
  \ 抽象类的实现 - 每个插件将扩展此类并实现构造函数和 `Execute` 方法\n3. `StreamingWorkerWrapper` 的实现，由每个插件将其暴露给\
  \ JavaScript\n\n### 在插件的源码中，我们将包含 `streaming-worker.h` 然后...：\n\n1. 扩展 `StreamingWorker`\n\
  2. 提供 `create_worker` 的实现，`StreamingWorkerWrapper` 将调用该函数\n3. 使用 `NODE_MODULE(<addon\
  \ name>, StreamWorkerWrapper::Init)` 将包装器暴露给 Node.js。注意，每个插件会有不同的名称。\n\n随着 C++ 代码的重构，我们需要对\
  \ JavaScript 适配器进行一些更改。不再对 `require` 插件返回的工作器对象调用 `factor`，现在插件返回的是新的工作器对象（包装器）构造函数。JavaScript\
  \ 适配器的其余部分已经具有高度的可用性 - 事实上，上面的 `make_factorizer` 函数没有任何部分与因数分解有关。我们需要做的只是让它参数化，以便它可以加载任何\
  \ C++ 插件。\n\n我们将创建一个新模块，存放在单独的文件中（目前为 `index.js`）。它将导出一个工厂函数，与之前的 `make_factorizer`\
  \ 非常相似，但它将接受 C++ 插件的路径以及用于初始化变量的对象（而不仅仅是一个数字）。作为最后的调整，我们不再仅返回发射器（emitter），而是返回一个包含发射器的对象，这样就有扩展功能的空间。\n\
  \n```javascript\nmodule.exports = function(cpp_entry_point, opts) {\n    const factory\
  \ = require(cpp_entry_point);\n    var emitter = new EventEmitter();\n    var worker\
  \ = new factory.StreamingWorker(\n        function () {\n            emitter.emit(\"\
  close\");\n        },\n        function(event, value){\n            emitter.emit(event,\
  \ value);\n        }, \n        function(error) {\n            emitter.emit(\"error\"\
  , error);\n        }, opts);\n    var retval = {\n        from = emitter\n    }\n\
  \    return retval;\n}\n```\n\n现在，各个独立的 JavaScript 程序将引入 `index.js` 中的 JS 适配器代码。之前的\
  \ `factorization.js` 文件看起来如下：\n\n```javascript\n// 这包含了上面的 JS 适配器代码\nconst streaming_worker\
  \ = require(\"./index.js\"); \n\nvar addon_path = path.join(\n    __dirname, \"\
  build/Release/factorization\");\nconst factorizer = worker(addon_path, {n: 9007199254740991});\n\
  \nfactorizer.from.on('factor', function(factor){\n    console.log(\"Factor:  \"\
  \ + factor);\n});\n\nfactorizer.from.on('error', function(e) {\n    console.log(e);\n\
  });\n```\n\n### 从 C++ 发射 JSON\n\n既然我们已经有种相当的方法为插件创建 `EventEmitter` 接口，让我们看看如何从插件向\
  \ JavaScript 发送更详细的数据 - 使用对象。\n\n你一定注意，上一节中创建的 `Message` 类设计为仅携带字符串作为数据。虽然我们中的 C++\
  \ 程序员可能想将 `Message` 转换为模板化类，但请记住，这些消息注定会在 JavaScript 端变成事件。这意味着我们想要发送的任何数据在发送回之前，都必须转换为\
  \ V8 数据类型。对于复杂的 C++ 对象，你一定能看出这如何开始变得困难。在实际上，大多数用例只需要能够从 C++ 返回一个简单的（不带函数的）JavaScript\
  \ 对象即可满足。我们可以通过发送字符串化的 JSON 来实现这一点，并在到达我们的 JavaScript 代码时使用 `JSON.parse` 对其进行解析。\n\
  \n在 C++ 中如何创建字符串化的 JSON？嗯，你可以自己动手 - 但那里有一些非常棒的 C++ 库可以为你完成这项工作。我强烈推荐由 Niels Lohmann\
  \ 编写的 `json`。你可以在 [`github.com/nlohmann/json`](https://github.com/nlohmann/json)\
  \ 获取源码。\n\n如果你曾经处理过传感器/跟踪设备（例如，报告用户头部位置/方向的头戴式器），你就知道它们的主 SDK 通常是用 C++ 编写的。对于使用这些设备的应用程序，你必须用\
  \ C++ 编写它们，或者找到一种跨语言的方法。例如对于虚拟现实，人们可能会发现自己在使用 Node.js 驱动使用 three.js 渲染 3D 场景的 electron\
  \ 应用。在这种情况下，一个发射跟踪数据的 C++ 插件是一个很好的解决方案。作为一个练习，让我们现在构建一个模拟的跟踪/传感器插件，它会定期报告随机的 x/y/z\
  \ 坐标（我们将忽略方向）。插件可以发射 JSON 字符串，一旦它们到达 JavaScript，我们将将其解析为普通对象。\n\n#### 步骤 1 - 构建\
  \ C++ 插件（扩展 StreamingWorker）\n\n第一步当然是创建 `binding.gyp` 和 `package.json`。这些文件本质上与上面的因数分解示例相同，因此我不会在这里重复它们\
  \ - 只需将插件的 `target_name` 更改为 `sensor_sim`。此外，确保你已经添加了可以找到上示例中 `streaming-worker.h`\
  \ 的目录。你可以通过向 `include_dirs` 项添加条目来实现。当我们创建实际的 C++ 代码时就开始进入正题，将其放在 `sensor_sim.cpp`\
  \ 中。\n\n我们首先包含一些库 - `streaming-worker.h` 现在现在还有 `json.hpp`，它需要下载到本地目录（[`github.com/nlohmann/json`](https://github.com/nlohmann/json)）。我还包含了一些\
  \ C++ 额外的头文件，以便我们能够在设定的时间间隔发射随机的位置数据。\n\n```cpp\n#include <iostream>\n#include <chrono>\n\
  #include <random>\n#include <thread>\n\n// 确保 binding.gyp 可以找到这个文件！\n#include \"\
  streaming-worker.h\"\n\n// 从 https://github.com/nlohmann/json 下载\n#include \"json.hpp\"\
  \ \n\nusing namespace std;\nusing json = nlohmann::json;\n...\n```\n\n现在让我们创建工作器类，以及所需的\
  \ `create_worker` 工厂函数：\n\n\n\n\n\n```cpp\nclass Sensor : public StreamingWorker\
  \ {\n  public:\n    Sensor(Callback *data, Callback *complete, \n        Callback\
  \ *error_callback) \n          : StreamingWorker(data, complete, error_callback){\n\
  \n      // no extra options, but certainly tracker name, \n      // perhaps position\
  \ offsets could be passed in here..\n    }\n\n    void send_sample(\n        const\
  \ AsyncProgressWorker::ExecutionProgress& progress, \n        double x, double y,\
  \ double z) {\n\n        json sample;\n        sample[\"position\"][\"x\"] = x;\n\
  \        sample[\"position\"][\"y\"] = y;\n        sample[\"position\"][\"z\"] =\
  \ z;\n        Message tosend(\"position_sample\", sample.dump());\n        writeToNode(progress,\
  \ tosend);\n    }\n\n    void Execute (\n        const AsyncProgressWorker::ExecutionProgress&\
  \ progress) {\n\n      std::random_device rd;\n      std::uniform_real_distribution<double>\
  \ pos_dist(-1.0, 1.0);\n      while (true) {\n        send_sample(progress, \n \
  \           pos_dist(rd), pos_dist(rd), pos_dist(rd));\n\n        std::this_thread::sleep_for(chrono::milliseconds(50));\n\
  \      }\n    }\n};\n\nStreamingWorker * create_worker(Callback *data\n    , Callback\
  \ *complete\n    , Callback *error_callback\n    , v8::Local<v8::Object> & options)\
  \ {\nreturn new Sensor(data, complete, error_callback);\n}\n\nNODE_MODULE(sensor_sim,\
  \ StreamWorkerWrapper::Init)\n```\n\n有趣的代码发生在 `send_sample` 中，它由 `Execute` 调用。`json`\
  \ 库允许你使用非常方便的、类似 map 的 API 来构建 JSON。一旦构建了 `sample`，我们就调用 `dump()` 将其序列化为字符串。\n\n\
  ### 步骤 2 - 在 JavaScript 中使用传感器\n\n接下来，我们需要查看 JavaScript 端。同样，由于我们在上一个示例中花费了大量精力创建一个重用的模块，代码实际上非常简单。这里是实例化我们的传感器插件并向控制台报告发射任何位置样本的完整列表。\n\
  \n```javascript\n\"use strict\"; \n\nconst worker = require(\"streaming-worker\"\
  );\nconst path = require(\"path\");\n\nconst addon_path = path.join(__dirname, \"\
  build/Release/sensor_sim\");\nconst sensor = worker(addon_path);\n\nsensor.from.on('position_sample',\
  \ function(sample){\n    console.log(JSON.parse(sample));\n});\n```\n\n我们的传感器实际上不会停止发射位置数据，因此要停止它，你需要执行\
  \ `ctrl+c`（我们稍后会修复这个问题）。输出应该像这样：\n\n```\n{ position: \n   { x: -0.770311412681532,\n\
  \     y: -0.770311412681532,\n     z: -0.770311412681532 }}{ position: \n   { x:\
  \ 0.456215735702525,\n     y: 0.456215735702525,\n     z: 0.456215735702525 }}....\n\
  ```\n\n## C++ 流输出\n\n对于上面的两个例子，`EventEmitter` 接口可能是一个很好的选择——但在某些情况下，你可能倾向于将创建的数据视为流，也许因为你希望将其写入（日志）文件。事实上，我们的传感器示例可能是此很好的候选者——传感器数据通常被记录到文件中或流到网络套接字！幸运的是，将事件发射器转换为流的努力非常小——我们可以利用\
  \ [`event-stream`](https://github.com/substack/emit-stream) 轻松地从真正的 `EventEmitter`\
  \ 创建流。与之前的示例不同，这些更改只需要在 JavaScript 端完成工作（我们将将其放在 `streaming-worker` JS 模块中）——C++\
  \ 部分不需要更改。\n\n回上文，我们创建了一个重用的模块，它在由文件路径指定的插件周围构建了 `EventEmitter`：\n\n```javascript\n\
  // inside index.js (streaming-worker module)\nmodule.exports = function(cpp_entry_point,\
  \ opts) {\n    const factory = require(cpp_entry_point);\n    var emitter = new\
  \ EventEmitter();\n    var worker = new factory.StreamingWorker(\n        function\
  \ () {\n            emitter.emit(\"close\");\n        },\n        function(event,\
  \ value){\n            emitter.emit(event, value);\n        }, \n        function(error)\
  \ {\n            emitter.emit(\"error\", error);\n        }, opts);\n    var retval\
  \ = {\n        from = emitter\n    }\n    return retval;\n}\n```\n\n现在让我们为 `from`\
  \ 对象添加一个函数来将其转换为流。我们可以在工厂方法内部执行此，但是创建可能不会使用的流可能是浪费的，因此我们将让模块的用户进行一个显式的函数调用。\n\n\
  ```javascript\nconst emitStream = require('emit-stream');\nconst through = require('through');\n\
  \nmodule.exports = function(cpp_entry_point, opts) {\n    // configure the emitter\n\
  \    var retval = {\n        from = emitter\n    }\n    retval.from.stream = function()\
  \ {\n       return emitStream(retval.from).pipe(\n         through(function (data)\
  \ {\n           if (data[0] == \"close\"){\n              this.end();\n        \
  \   }\n           else {\n              this.queue(data);\n           }\n      \
  \   }));\n    }\n    return retval;\n}\n```\n\n`emit-stream` 库导出的函数 `emitStream`\
  \ 接受一个 `EventEmitter`（在本例中为 `retval.from`）并返回一个可读流。你可以在 [`github.com/substack/emit-stream`](https://github.com/substack/emit-stream)\
  \ 查看 `emit-stream` 的细节。一个相关的细节是事件（名称/值对）被转换为原始数组。\n\n我们知道当从插件发射 'close' 事件时，流本身应该关闭，因此我们使用\
  \ `through` 来捕获这些事件并实际关闭流。现在，每当我们的插件发射 'close' 事件时，输出流都会正常关闭。\n\n在 JavaScript 中，我们现在可以创建输出流并像任何其他可读流一样使用它。例如，如果我们想将位置数据流到文件\
  \ (positions.log)，只需创建一个可写文件流。由于文件流不接受原始 JavaScript 对象（例如 `emit-stream` 放入流的数组），我们可以使用\
  \ `JSONStream` 模块将流式数组转换为 JSON 字符串。\n\n```javascript\nconst worker = require(\"\
  streaming-worker\");\nconst through = require('through');\nconst JSONStream = require('JSONStream');\n\
  const path = require(\"path\");\n\nconst addon_path = path.join(\n    __dirname,\
  \ \"build/Release/sensor_sim\");\n\nconst sensor = worker(addon_path);\n\nvar fs\
  \ = require('fs');\nvar wstream = fs.createWriteStream('positions.log');\nconst\
  \ out = sensor.from.stream();\nout.pipe(JSONStream.stringify()).pipe(wstream); \n\
  ```\n\n\n\n\n你会注意到 `positions.log` 中的输出并不美观——整个文件本应该是一个 JSON 字符串化数组——然而它是不完整的，缺少了闭合的\
  \ `]`。这是因为我们的传感器插件（addon）从未停止过（我假设你是通过 `ctrl+c` 停止它的），并且 JSON 流从未被正确终止。我们需要一种停止插件的方法——所以让我们利用\
  \ `StreamingWorkerWrapper` 构建一个 `close` 函数，它会在我们的 `StreamingWorker`（在本例中为 `Sensor`）中设置一个标记。在\
  \ `streaming-worker` 中，我们先添加这个布尔标记：\n\n```cpp\nclass StreamingWorker : public AsyncProgressWorker\
  \ {\npublic:\n    ...\n    void close() {\n      closed = true;\n    }\n\n    ...\n\
  protected:\n    bool isClosed() {\n      return closed;\n    } \nprivate:\n    bool\
  \ closed;\n};\n```\n\n我们希望允许 JavaScript 调用 `close`，所以让我们在包装器（wrapper）中添加它。\n\n```cpp\n\
  class StreamWorkerWrapper : public Nan::ObjectWrap {\npublic:\n  static NAN_MODULE_INIT(Init)\
  \ {\n    v8::Local<v8::FunctionTemplate> tpl = \n        Nan::New<v8::FunctionTemplate>(New);\n\
  \    tpl->SetClassName(\n        Nan::New(\"StreamingWorker\").ToLocalChecked());\n\
  \    tpl->InstanceTemplate()->SetInternalFieldCount(1); \n\n    SetPrototypeMethod(tpl,\
  \ \"close\", closeInput); \n\n    constructor().Reset(\n        Nan::GetFunction(tpl).ToLocalChecked());\n\
  \n    Nan::Set(target, \n        Nan::New(\"StreamingWorker\").ToLocalChecked(),\n\
  \        Nan::GetFunction(tpl).ToLocalChecked());\n  }\n  ... 其余部分省略，与之前相同 ...\n\
  };\n\nstatic NAN_METHOD(closeInput) {\n    StreamWorkerWrapper* obj = \n       \
  \ Nan::ObjectWrap::Unwrap<StreamWorkerWrapper>(info.Holder());\n    obj->_worker->close();\n\
  }\n```\n\n现在我们可以修改 `Sensor` 中的 `Execute` 函数，使其在 `isClosed` 返回 `true` 时停止：\n\n```cpp\n\
  void Execute (\n    const AsyncProgressWorker::ExecutionProgress& progress) { \n\
  \  std::random_device rd;\n  std::uniform_real_distribution<double> pos_dist(-1.0,\
  \ 1.0);\n  while (!closed()) {\n    send_sample(progress, \n        pos_dist(rd),\
  \ pos_dist(rd), pos_dist(rd));\n\n    std::this_thread::sleep_for(chrono::milliseconds(50));\n\
  \  }\n}\n```\n\n让我们在 `streaming-worker` 模块中工厂方法返回的对象中也添加一个 `close` 方法：\n\n```javascript\n\
  ....\n\nretval.close = function (){\n   worker.closeInput();\n}\n\nreturn retval;\n\
  ```\n\n最后，在我们的 JavaScript 程序中 5 秒后关闭传感器：\n\n```javascript\nconst worker = require(\"\
  streaming-worker\");\nconst through = require('through');\nconst JSONStream = require('JSONStream');\n\
  const path = require(\"path\");\n\nconst addon_path = path.join(__dirname, \"build/Release/sensor_sim\"\
  );\nconst sensor = worker(addon_path);\n\nvar fs = require('fs');\nvar wstream =\
  \ fs.createWriteStream('positions.log');\nconst out = sensor.from.stream();\nout.pipe(JSONStream.stringify()).pipe(wstream);\
  \ \n\nsetTimeout(function(){sensor.close()}, 5000); \n```\n\n现在 `positions.log`\
  \ 将是一个格式良好的 JSON 数组。当然，我们可以使用 `through` 来进一步转换发送到此文件的输出——这是无限制的！\n\n顺便提一下，C++ 也有流……你可能想知道是否可以更改\
  \ C++ 插件接口来实现类似这样的操作：\n\n```cpp\ntoNode << msg; \n```\n\n而不是使用 `writeToNode` 方法。答案是——当然可以！这需要扩展\
  \ C++ i/o 流类和流缓冲区类，这本身就是一个很大的课题。我将把它留给心心勃勃的读者作为 C++ 练习题。\n\n## 向 C++ 发射事件\n\n到目前，我们创建的插件要么不接受输入（传感器），要么仅使用初始化变量从\
  \ JavaScript 获取信息（因子化器）。如果我们想随着时间的推移向插件移动大量数据该呢？我们可以反转事件和流 API，也可以从 JavaScript *向\
  \ C++* 发射事件/流数据。\n\n我们现在已经构建过几次新插件了，所以我只展示 `Accumulator` 类。在这个例中，我们的 C++ 插件将收集从\
  \ JavaScript 发送的数据，当接收到哨兵值 (-1）时，它将发射一个 `sum` 事件，并带有发送它的所有数字之和。\n\n\n\n\n```cpp\n\
  class Accumulate : public StreamingWorker {\n  public:\n    Accumulate(Callback\
  \ *data, Callback *complete, \n        Callback *error_callback, \n        v8::Local<v8::Object>\
  \ & options) \n        : StreamingWorker(data, complete, error_callback){\n\n  \
  \      sum = 0;\n        filter = \"\";\n        if (options->IsObject() ) {\n \
  \         v8::Local<v8::Value> filter_ = options->Get(\n              New<v8::String>(\"\
  filter\").ToLocalChecked());\n\n          if ( filter_->IsString() ) {\n       \
  \     v8::String::Utf8Value s(filter_);\n            filter = *s;\n          }\n\
  \        }\n    }\n    ~Accumulate(){}\n\n    bool filter_by_name(string name) {\n\
  \      return ( filter.empty() || name == filter);\n    }\n\n    void Execute (const\
  \ AsyncProgressWorker::ExecutionProgress& progress) {\n      int value ;\n     \
  \ do {\n        Message m = fromNode.read();\n        value = std::stoi(m.data);\n\
  \        if ( filter_by_name(m.name) || value <= 0) {\n          if ( value > 0\
  \ ){\n            sum += value;\n          }\n          else {\n            Message\
  \ tosend(\"sum\", std::to_string(sum));\n            writeToNode(progress, tosend);\n\
  \          }\n        }\n      } while (value > 0);\n    }\n  private:\n    int\
  \ sum;\n    string filter;\n};\n```\n\n注意，我在这个类中添加了一个可选的过滤器，因此它只会累加名称与过滤器匹配的事件。如果在初始化对象中没有指定过滤器，则所有事件都将被累加。累加器的\
  \ `Execute` 函数会在循环中从 `fromNode` 队列中读取单个消息。记住，`PCQueue` 上的 `read` 方法是阻塞的。\n\n让我们编写一个简单的\
  \ JavaScript 程序向插件发送几个数字。我们需要进入 `streaming-worker` 模块并暴露一个方法来调用我们添加的 `sendToAddon`\
  \ 方法。\n\n```javascript\nconst emitStream = require('emit-stream');\nconst through\
  \ = require('through');\n\nmodule.exports = function(cpp_entry_point, opts) {\n\
  \    const factory = require(cpp_entry_point);\n    var emitter = new EventEmitter();\n\
  \    var worker = new factory.StreamingWorker(\n        function () {\n        \
  \    emitter.emit(\"close\");\n        },\n        function(event, value){\n   \
  \         emitter.emit(event, value);\n        }, \n        function(error) {\n\
  \            emitter.emit(\"error\", error);\n        }, opts);\n\n    var retval\
  \ = {\n        from = emitter\n    }\n\n    retval.from.stream = function() {\n\
  \       return emitStream(retval.from).pipe(\n         through(function (data) {\n\
  \           if ( data[0] == \"close\") this.end();\n           else this.queue(data);\n\
  \        }));\n    }\n\n    //////////////////////////////\n    // Create a to object\
  \ to similate\n    // an emitter\n    retval.to = {\n      emit: function(name,\
  \ data) {\n         worker.sendToAddon(name, data); \n      }\n    return retval;\n\
  }\n```\n\n我们添加到工厂返回对象中的 `to` 对象并不是一个真正的 `EventEmitter`，如果你想改进这一点，可以考虑调整此代码以创建一个真正的\
  \ `EventEmitter`，并重写 `emit` 和 `close` 以与插件通信。然而，对于这些示例的目的，上面的实现已经“足够好”了。\n\n现在在我们实际的\
  \ JavaScript 程序中，我们可以利用这个新的 `to` 对象：\n\n```javascript\n\"use strict\"; \n\nconst\
  \ worker = require(\"streaming-worker\");\nconst path = require(\"path\");\n\nvar\
  \ addon_path = path.join(__dirname, \"build/Release/accumulate\");\nconst acc =\
  \ worker(addon_path);\nacc.from.on('sum', function(value){\n    console.log(\"Accumulated\
  \ Sum: \" + value);\n});\n```\n\n\n\n\n\n```\n[](#cb246-1)\"use strict\"; \n[](#cb246-2)\n\
  [](#cb246-3)const worker = require(\"streaming-worker\");\n[](#cb246-4)const path\
  \ = require(\"path\");\n[](#cb246-5)const streamify = require('stream-array');\n\
  [](#cb246-6)\n[](#cb246-7)var addon_path = path.join(__dirname, \"build/Release/accumulate\"\
  );\n[](#cb246-8)const acc = worker(addon_path);\n[](#cb246-9)\nconst input = acc.to.stream(\"\
  value\",\n[](#cb246-10)    function () {\n[](#cb246-11)        acc.to.emit('value',\
  \ -1);\n[](#cb246-12)    });\n[](#cb246-13)\nstreamify([1, 2, 3, 4, 5, 6]).pipe(input);\n\
  [](#cb246-14)\nacc.from.on('sum', function(value){\n[](#cb246-15)    console.log(\"\
  Accumulated Sum:  \" + value);\n[](#cb246-16)});\n```\n\n## 总结\n\n本章的目标是演示我们并不会受限于典型\
  \ C++ 插件提供的基础接口。`streaming-worker` 和 `StreamingWorker` 模型仅作为示例，还有很大的改进空间。如果你想使用本章中介绍的模型（或对其进行扩展或贡献），请查看完整的存储库\
  \ - [`github.com/freezer333/nodecpp-demo`](https://github.com/freezer333/nodecpp-demo)。流式模型位于\
  \ `/streaming` 目录下。\n\n既然我们已经已经费了这么多精力来创建可以以多种方式插入 Node.js 应用程序中的插件，现在我们应该将注意力转向它们的打包和发布，以便让世界从中受益……而这正是下一章的主题！\n\
  \n***\n\n1. 明确的是，质因数分解可能*不是*一个值得构建完整 C++ 插件（更不用说流式接口）的密集型计算任务。然而，像书中的大多数示例一样，它是一个足够简单的问题，不需要大量的解释——但很好地展示了编程模型。\n\
  \n2. `AsyncProgressWorker` 如果连续的进度更新没有被 JavaScript 及时处理，它会将它们合并。例如，如果在工作线程代码中，在下一次事件循环周期之前，都按顺序报告了\
  \ 0%、50%、100% 的进度，那么 Node.js 只会接收到单一的进度指示器 - 100%。从进度报告的角度来看，这很有意义——但对于消息传递来说却不然！\n\
  \n3. 与从 C++ 发送数据数据一样，C++ 中一个很好的改进是创建新的输入流对象，从 `fromNode` 队列中提取消息，允许插件执行诸如 `fromNode\
  \ >> msg;` 的操作。不过，这纯粹是一个 C++ 练习，将留给读者自行完成。\n\n# 第 8 章 - 发布插件\n\n作为本书的最后一章，我们将查看打包和发布\
  \ Node.js 插件的基础知识。虽然大部分工作流遵循发布普通 Node.js 模块（JavaScript）的相同模式，但有一些与编译 C++ 代码有关的细节是必须必须注意到的。作为第一步，让我们回顾一下我们选择的构建工具\
  \ `node-gyp` 的一些重要方面，并查看如何发布这些插件。然后，我们将查看如何确保插件在各种终端用户机器上编译并安装。最后，我们将查看 `node-gyp`\
  \ 的一些替代方案。\n\n本章中的上述代码可以在 `nodecpp-demo` 存储库中完整找到，地址为 [`github.com/freezer333/nodecpp-demo`](https://github.com/freezer333/nodecpp-demo)。\n\
  \n## `node-gyp` 基础回顾\n\n在整本书中，我们使用 `node-gyp` 构建了插件，这是一个由 Google 创建的程序。`gyp` 本身旨在让开发者以一种平台无关的方式设置项目。如果你已经读到了这里，希望你已经安装了：\n\
  \n1. Python 2.7，但不是 Python 3。\n2. 你平台的构建工具，例如 Linux/Mac 上的 `make` 或 Windows 上的 Visual\
  \ Studio。\n\n执行 `node-gyp configure` 将生成必要的项目文件。执行 `node-gyp build` 将编译插件并在 `build/Release`\
  \ 文件夹中创建实际二进制文件。注意 `node-gyp` 使用 Python 进行其构建过程。\n\n让我们创建一个简单的 `binding.gyp` 文件。它指定了目标名称和源文件：\n\
  \n```json\n{\n  \"targets\": [\n    {\n      \"target_name\": \"hello\",\n     \
  \ \"sources\": [\n        \"hello.cpp\"\n      ]\n    }\n  ]\n}\n```\n\n但注意 `gypfile`\
  \ 的包含 - 这很重要 - 它告诉任何使用 `package.json` 文件的程序（如 `npm`），在使用模块之前必须执行一个构建过程。同样注意 `main`\
  \ 条目，它引导 `npm` 指向插件创建的实际位置 - 这正是我们在整本书中硬编码 `require` 语句的地方。\n\n在编写调用插件的 JavaScript\
  \ 之前，让我们将插件打包，以便将其视为一个独立模块。为此，我们需要一个 `package.json` 文件！\n\n```json\n{\n  \"name\"\
  : \"hello-world-nodecpp\",\n  \"version\": \"1.0.0\",\n  \"main\": \"./build/Release/hello_addon\"\
  ,\n  \"gypfile\": true,\n  \"author\": \"Scott Frees <scott.frees@gmail.com> (http://scottfrees.com/)\"\
  ,\n  \"license\": \"ISC\"\n}\n```\n\n但注意 `gypfile` 的包含 - 这很重要 - 它告诉任何使用 `package.json`\
  \ 文件的程序（如 `npm`），在使用模块之前必须执行一个构建过程。\n\n目前在名为 `hello` 的目录中应该有三个文件，看起来如下：\n\n```\n\
  /hello\n | \n |--- hello.cpp\n |--- binding.gyp\n |--- package.json\n```\n\n\n\n\
  \n这些就是拥有一个独立模块所需的所有内容。现在，让我们创建一个新目录（与 `/hello` 同级，名为 `/demo`），并创建一个 Node.js 程序，将我们创建的\
  \ `hello-world-nodecpp` 模块指定为依赖。我们不再在 JavaScript 程序中硬编码文件路径，而是将利用 `npm` 使用本地模块依赖的能力。\n\
  \n让我们创建目录并为 demo 程序添加 `index.js` 和另一个 `package.json` 文件：\n\n```\n/hello\n | \n |---\
  \ hello.cpp\n |--- binding.gyp\n |--- package.json\n/demo\n |\n |--- index.js\n\
  \ |--- package.json\n```\n\n在 `/demo/package.json` 中，我们将添加一个本地依赖项（`npm` 2+ 版本支持）：\n\
  \n```json\n{\n  \"name\": \"demo\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\"\
  ,\n  \"author\": \"Scott Frees <scott.frees@gmail.com> (http://scottfrees.com/)\"\
  ,\n  \"license\": \"ISC\", \n  \"dependencies\": {\n    \"hello-world-nodecpp\"\
  : \"file:../hello\"\n  }\n}\n```\n\n以下是在 `index.js` 中使用模块的方法：\n\n```javascript\n\
  var say = require('hello-world-nodecpp');\nconsole.log( say.hello() );\n```\n\n\
  在 `demo` 目录内执行 `npm install`。`npm` 会查询 `package.json` 文件并看到本地的 `hello-world-nodecpp`\
  \ 依赖。随后 `npm` 将读取 `/hello/package.json` 并发现存在 `gypfile` 标志，然后构建插件。注意，此过程实际上会将插件二进制文件放在\
  \ `/demo/node_modules` 目录中。现在插件已构建并复制到 `/node_modules`，我们可以通过 `node index.js` 运行程序，看到我们的插件正愉快地向我们问候。\n\
  \n```bash\n$ node index.js\nhello\n$\n```\n\n这一部分的核心要点是创建 `package.json` 文件，它直接指向入口点处的插件。当消费程序（使用\
  \ `require` 引入）将插件声明为依赖项时，`npm` 会处理其余工作（执行 `node-gyp`）。我们的插件现在可以整洁地引入，而无需在 JavaScript\
  \ 代码中指定文件路径。\n\n## 发布到 `npm`\n\n虽然我们上面将 `hello-world-nodecpp` 作为本地依赖，但现在没有任何能阻止我们将此插件发布到全局\
  \ `npm` 注册表。让我们继续向注册表添加另一个 hello world 模块吧！\n\n```bash\n# 在 `/hello` 内部\n$ npm publish\n\
  + hello-world-nodecpp@1.0.0\n```\n\n`npm publish` 命令需要你提供一些参数，例如你的 `npmjs.org` 账户凭据。如果你从未向\
  \ `npm` 发布过任何内容，可能需要进行一些配置（请参 [`docs.npmjs.com/getting-started/publishing-npm-packages`](https://docs.npmjs.com/getting-started/publishing-npm-packages)\
  \ 获取设置帮助）。你可以访问 [`www.npmjs.com/package/hello-world-nodecpp`](https://www.npmjs.com/package/hello-world-nodecpp)\
  \ 查看发布结果。\n\n现在我们当然可以修改 `demo/package.json` 以链接到 npm 注册表本身。\n\n```json\n{\n  \"\
  name\": \"demo\",\n  \"version\": \"1.0.0\",\n  \"main\": \"index.js\",\n  \"author\"\
  : \"Scott Frees <scott.frees@gmail.com> (http://scottfrees.com/)\",\n  \"license\"\
  : \"ISC\", \n  \"dependencies\": {\n    \"hello-world-nodecpp\": \"¹.0.0\"\n  }\n\
  }\n```\n\n所有 npm 包管理固有的标准版本规范都适用于插件——没有什么新需要学的。现在，任何时候链接到 `hello-world-nodecpp`，C++\
  \ 源代码将下载到他们的机器上，使用 `node-gyp` 和其本地的 C++ 工具链进行构建，并作为原生二进制文件使用。\n\n## 分发使用 NAN 的插件\n\
  \n大多数较大的插件可能会利用 NAN 来促进跨 Node 版本的兼容性，如果你计划分发插件，这更有意义。幸运的是，将 NAN 声明为依赖非常简单——我们必须在两个地方指定依赖：(1)\
  \ 我们的 `binding.gyp` 文件，以便编译器可以使用 NAN；(2) 我们的 `package.json` 文件，它将指示 `npm` 在安装时获取\
  \ NAN 库。\n\n这里是 C++ 插件——它是之前 hello world 示例的变体：\n\n```cpp\n#include <nan.h>\nusing\
  \ namespace Nan;\nusing namespace v8;\n\nNAN_METHOD(Method) {\n  info.GetReturnValue().Set(\n\
  \    New<String>(\"nan hello\").ToLocalChecked());\n}\n\nNAN_MODULE_INIT(Init) {\n\
  \   Nan::Set(target, \n    New<String>(\"hello\").ToLocalChecked(),\n    GetFunction(New<FunctionTemplate>(Method)).ToLocalChecked());\n\
  } \n\nNODE_MODULE(hello_nan_addon, Init)\n```\n\n在第 6 章中我们看到了如何在 `binding.gyp` 文件中包含\
  \ NAN——这里再次出现：\n\n```json\n{\n  \"targets\": [\n    {\n      \"target_name\": \"\
  hello_nan_addon\",\n      \"sources\": [ \"hello_nan.cpp\" ], \n      \"include_dirs\"\
  \ : [\n        \"<!(node -e \"require('nan')\")\"\n      ]\n    }\n  ]\n}\n```\n\
  \n最后，我们将 `nan` 添加到模块的 `package.json` 文件中：\n\n```json\n{\n  \"name\": \"hello-world-nan-nodecpp\"\
  ,\n  \"version\": \"1.0.0\",\n  \"main\": \"./build/Release/hello_nan_addon\",\n\
  \  \"gypfile\": true,\n  \"author\": \"Scott Frees <scott.frees@gmail.com> (http://scottfrees.com/)\"\
  ,\n  \"license\": \"ISC\", \n  \"dependencies\": {\n    \"nan\": \"².3.3\"\n  }\n\
  }\n```\n\n## 分发使用 C++11 的插件\n\n到此为止，我们在插件中使用的是基础 C++，但在本书的许多地方，我们利用了一些属于 C++ 11（或\
  \ 14, 17..）标准的 C++ 特性。然而，C++11 标准（尤其地）非常常见，但许多编译器需要特殊的“咒语”来启用它——这使得为每个平台正确配置 `node-gyp`\
  \ 至关重要。当然，安装插件的目标机器必须拥有支持 C++ 11 的 C++ 工具链才能使一切运行，但让我们现在看看还需要做什么。虽然无疑有更多可能的配置和选项，但我将展示我发现的涵盖最常见平台配置的\
  \ `binding.gyp` 新增内容。\n\n### C++11 示例\n\n让我们从创建一个异常复杂的 `Add` 函数开始，它利用了 `lambda`\
  \ 和 `auto`。我强调的是，这是一种相两个数字的完全没有必要的方法——但它确实需要 C++11！我也将继续使用 NAN。\n\n\n\n\n```cpp\n\
  #include <nan.h>\nusing namespace Nan;\n\nNAN_METHOD(Add) {\n\n    auto sum = [](int\
  \ x, int y) { return x + y; };\n\n    int a = To<int>(info[0]).FromJust();\n   \
  \ int b = To<int>(info[1]).FromJust();\n\n    Local<Number> retval = Nan::New(sum(a,\
  \ b));\n    info.GetReturnValue().Set(retval); \n}\n\nNAN_MODULE_INIT(Init) {\n\
  \   Nan::Set(target, New<String>(\"add\").ToLocalChecked(),\n        GetFunction(New<FunctionTemplate>(Add)).ToLocalChecked());\n\
  } \n\nNODE_MODULE(cpp11, Init)\n```\n\n假设我们还为这个插件创建了标准的 `binding.gyp` 和 `package.json`\
  \ 文件，让我们将它们添加到 `/demo` 并尝试安装。如果你在 OS X 或 Linux 上使用最新的编译器器进行编译，那么这段代码很有可能确实顺利编译。然而，如果你使用的\
  \ Xcode 或 `clang`/`g++` 版本较旧，你可能需要采取一些额外的步骤。\n\n### 在 Linux 上构建\n\n为了向后兼容，大多数版本的\
  \ `g++` 和 `clang++` 要求明确指定目标为 `c++11`。通常，我只需在 `binding.gyp` 的 `cflags` 下添加一个通用项目以确保使用该标准。你可以选择将其放在专门针对\
  \ Linux 的条件中，但由于它在其他平台上没有任何害处，我建议直接添加。\n\n```json\n\"cflags\": [\"-std=c++11\"],\n\
  ```\n\n你当然也可以在这里添加任何数量的额外标志，这是一个数组。\n\n### 在 OS X 上构建\n\n对于运行 OS X 的用户，你无法指望他们安装了最新版本的\
  \ Xcode。对于早期版本的 Xcode，必须专门包含 C++ 11 和标准库。`gyp` 允许我们通过条件添加特定 OS 的选项——只需包含以下内容，即可允许各种\
  \ Xcode 版本成功编译你的插件：\n\n```json\n\"conditions\": [\n  [ 'OS==\"mac\"', {\n      \
  \ \"xcode_settings\": {\n         'OTHER_CPLUSPLUSFLAGS' : ['-std=c++11','-stdlib=libc++'],\n\
  \         'OTHER_LDFLAGS': ['-stdlib=libc++'],\n         'MACOSX_DEPLOYMENT_TARGET':\
  \ '10.7' }\n       }\n  ]\n]\n```\n\n### 在 Windows 上构建\n\n幸运的是，我们在 Windows 上不需要做什么。虽然我们确实可以通过\
  \ `gyp` (`msvs_settings`) 传递 Visual Studio 编译器标志，但每个版本的 Visual Studio 都会自动应用其支持的最新\
  \ C++ 特性。当然，如果目标机器上安装的 Visual Studio 版本不支持你在插件中使用的特定 C++ 特性，`gyp` 也无能提供帮助。\n\n**经验法则**：在开发插件时，要意识到它们将在最终用户的机器上进行*编译*——无谓使用高级语言特性可能很有趣，但它可能会让你苦恼！\n\
  \n### 包含多个 C++ 文件\n\n书中的大多数插件都包含在单个 C++ 文件中。许多插件将由几十个可能的 C++ 文件构建，`node-gyp` 完全*支持*这一点，但请提个——如果你有复杂的构建/依赖设置，你可能会发现\
  \ `node-gyp` 有点不配合，它很好地支持简单的构建，但很快就会变得繁琐且困难。如果你有复杂的 C++ 构建设置，你可能正在使用 `cmake` 或类似的工具，并可能发现\
  \ `node-gyp` 令人沮丧——请查看下方关于 `cmake-js` 的章节寻求救避。\n\n让我们创建一个简单的插件，添加从 Node.js 的两个数字，但通过包含在单独\
  \ C++ 模块（cpp 文件和头文件）中的 `sum` 函数来实现。再次——为了演示目的，这没必要这么复杂：\n\n```cpp\n// add.h 内容\n\
  int sum(int, int);\n```\n\n```cpp\n// add.cpp 内容\n#include \"add.h\"\n\nint sum(int\
  \ x, int y ) {\n    return x+y;\n}\n```\n\n```cpp\n// addlib.cpp 内容 - 插件入口点\n#include\
  \ <nan.h>\n#include \"add.h\"\nusing namespace Nan;\nusing namespace v8;\n\nNAN_METHOD(Add)\
  \ {\n    int a = To<int>(info[0]).FromJust();\n    int b = To<int>(info[1]).FromJust();\n\
  \n    Local<Number> retval = Nan::New(sum(a, b));\n    info.GetReturnValue().Set(retval);\
  \ \n}\n\nNAN_MODULE_INIT(Init) {\n   Nan::Set(target, New<String>(\"add\").ToLocalChecked(),\n\
  \        GetFunction(New<FunctionTemplate>(Add)).ToLocalChecked());\n}\n\nNODE_MODULE(cpp11,\
  \ Init)\n```\n\n有了额外的源代码，我们只需要在 `binding.gyp` 中添加 `targets` 数组：\n\n```json\n{\n\
  \  \"targets\": [\n    {\n      \"target_name\": \"addlib\",\n      \"sources\"\
  : [ \"add.cpp\", \"addlib.cpp\" ],\n      \"include_dirs\": [ \"<<!(node -p \\\"\
  require('nan').include\\\")\" ],\n      \"cflags\": [ \"<<!(node -p \\\"require('nan').cflags\\\
  \")\" ],\n      \"cflagscc\": [ \"<<!(node -p \\\"require('nan').cflagscc\\\")\"\
  \ ],\n      \"ldflags\": [ \"<<!(node -p \\\"require('nan').ldflags\\\")\" ]\n \
  \   }\n  ]\n}\n```\n\n发布插件时，编译插件所需的所有 C++ 源代码都必须发布。在上面的示例中，这是自动完成的——但如果你的插件有工作目录之外的依赖，你可能会遇到问题。明智之了解\
  \ `npm` 如何确定哪些文件是发布包的一部分，这在 `npm` 的文档中有所描述：https://docs.npmjs.com/developers/keeping-files-out-your-package。\n\
  \n\n\n\n\n领先的替代方案是 `cmake-js`。正如其名称所示，它使用了极其流行且无处不在的 `CMake` 构建工具。`cmake-js` 的优势在于它没有使用\
  \ `binding.gyp`，而是使用 `CMake` 配置文件，并且可能与现有的 C++ 开发者工作流兼容。`CMake` 拥有自己的模块系统、极其详尽的文档，并且不依赖于\
  \ Python。也许最大的优势是它让将 Boost C++ 库作为依赖项引入你的插件变得非常简单——这在在使用 `node-gyp` 时是极难完成的。\n\n\
  `CMake` 不是本书的重点，但如果你是经验丰富的 CMake 用户或 C++ 开发者，花些时间多了解 `CMake` 和 `cmake-js` 可能会是一个非常棒的主意。它是\
  \ `node-gyp` 一个稳固的替代方案。\n\n关于工具的信息可以在以下链接找到：\n\n1. [`npm 上的 cmake-js](https://www.npmjs.com/package/cmake-js):\
  \ https://www.npmjs.com/package/cmake-js\n2. [`cmake-js 的 wiki](https://github.com/cmake-js/cmake-js/wiki):\
  \ https://github.com/cmake-js/cmake-js/wiki 包含了使用各种依赖项和目标（NW.js, Qt Creator）构建插件的教程\n\
  3. [`npm 上的 boost-lib](https://www.npmjs.com/package/boost-lib): https://www.npmjs.com/package/boost-lib\
  \ 用于向你的 Node.js C++ 插件添加 Boost 的工具。\n\n网上还有许多资源。请务必查看附录 A，在其中你将看到如何使用 `node-gyp`\
  \ 构建各种不同类型的目标，例如可执行文件和共享库。\n\n# 附录 A - 插件的替代方案\n\n注意：此附录大部分取自作者网站 [blog.scottfrees.com](http://blog.scottfrees.com/getting-your-c-to-the-web-with-node-js)的一系列博客文章，这些文章涵盖了人们选择将现有遗留\
  \ C/C++ 程序集成到 Node.js Web 应用中的各种方法。该系列与本书是独立的，因此你可能会发现其中一些材料是冗余的，但它展示了集成遗留 C++ 代码的真实世界示例，而不是书中范围较窄的示例。该章节下载代码的\
  \ GitHub 仓库与书中的其他示例也不同。强烈建议你获取代码，因为其中有很多内容在文中给出！\n\n本书 100% 关注将 Node.js C++ 插件作为集成\
  \ Node.js 和 C++ 的选择方法。在许多情况下，插件确实是进行此类集成的最佳替代方案，但还有其他选项——如果不讨论它们，本书将是不完整的。在在此之前，让我们退一步，重新提问第\
  \ 1 章提出的问题：为什么要集成 Node.js 和 C++ ？为了深化讨论，让我们从拥有一个希望放到网上的现有 C++/C 程序的角度来看这个问题。\n\n\
  ## 我不能直接写一个 C++ 网站吗？\n\n嗯……可以——你可以的！长期以来，人们一直使用 CGI 用 C++ 编写应用程序的一部分——尽管 CGI 并不是如今\
  \ Web 上最流行的东西，它缺乏许多让当今 Web 开发变得如此优秀的生产力增强。更重要的是，它引入了一些严重的性能和可扩展性问题。另一方面，C++ 在表达能力方面在过去几年取得了巨大进步，C++14\
  \ 标准实现了一些非常酷的项目，专注于用纯 C++ 编写现代 MVC 风格的 Web 应用。如果这是你的菜，请查看 [Silicon](http://siliconframework.org/)。\n\
  \n大多数 Web 开发者并不是 C++ 程序员，率地说，除非你的 Web 层超高性能至关重要，否则你可能使用提供更高抽象的语言更好。Web 上常见的语言有 Ruby、Go、Node.js、Python、PHP\
  \ 等等……\n\n## 为什么选择 Node.js？\n\nNode.js 有许多优势。首先，它通过几种不同的方式与 C++ 集成得非常完美——其中一种我们在整书中已经过了！通常情况下，Node.js\
  \ 还有许多与你最初使用 C++ 的原因契合的优势——它具有高度的可移植性，促进扩展性能，并拥有繁荣的[生态系统](https://www.npmjs.com/)。\n\
  \n## 为什么不直接重写 C++？\n\n啊……每个开发者的直觉：“让我们重写用 X 语言编写的旧代码，因为 Y 语言要酷得多 | 好 | 快 | Easy！”首先——如果你有一些简单、短小且并不真的需要高性能的遗留\
  \ C++ 代码——这可能就是最好的答案。然而，如果你属于这一类，你可能根本没在读这本书——你可能已经快重写完你的 C++ 代码了。\n\n不重写代码有几个实际理由。首先，你可能没有代码！信不信，如果你在一家使用遗留工具支持业务的公司工作，这些工具的源代码往往随着时间丢失了。此的衍生情况是你的遗留代码使用了第三方依赖，而这些依赖无法被重写或修改。\n\
  \n其次，C/C++ 可能会很复杂——如果它很旧，可能非常难破解。你是一个既是 Web 开发者又是 C++ 大师吗？你确定自己可以完全还原此程序的精确输入/输出吗？如果这是一个关键的业务工具，你正在让自己承担巨大的风险。\n\
  \n第三个不重写你的 C++ 的原因是因为它可能真的想留在 C++ 中！虽然 Node.js 性能不错，但它不是 C/C++。如果你的应用程序有极端的性能标准，你是无法超越\
  \ C++ 的。\n\n## C++ 和 Node.js - 你的选项\n\n将 C++ 代码集成到 Node.js 应用中有三种通用方法尽管每个类别内部都有许多变体：\n\
  \n1. **自动化** - 在子进程中作为独立程序调用你的 C++。\n2. **共享库** - 将你的 C++ 程序封装在共享库 (dll) 中并直接从 Node.js\
  \ 调用这些程序。\n3. **Node.js 插件** - 将你的 C++ 代码编译为原生 Node.js 模块/插件（我们现在对此了如指掌对吧？）\n\n\
  每个选项都有其优缺点，它们主要区别在于你对 C++ 修改的程度、你在调用 C++ 时愿意承担的性能损失，以及你对处理 Node.js 和 V8 API 的熟悉程度/舒适度。\n\
  \n### 如何选择\n\n第一个要问的最明显的问题是，你是否有 C++ 源码，还是只有二进制文件？如果没有源码，你希望 C++ 程序是命令行程序，或者是 dll/lib\
  \ 共享库。如果你看到的是一个只用图形用户界面编写的程序……那么你就陷入了痛苦深渊。你可能需要重写你的应用程序以便它在 Web 上运行。\n\n### 选项 1\
  \ - 自动化\n\n如果你的 C++ 从命令行独立运行，你不需要源代码就可以利用选项 1——自动化选项。你可以使用 Node 的 [child process](https://nodejs.org/api/child_process.html)\
  \ API 在不改变原文的情况下运行你的 C++ 程序。这个选项适用于将几乎任何东西带到 Web 上——如果你只是运行它，你的命令行程序用什么语言编写其实没有区别。如果你阅读这些是希望将\
  \ C 代码、Fortran 代码或其他语言放到 Web 上——那么这个选项值得一读。\n\n自动化选项不仅适用于那些没有底层 C++ 代码的人。如果你有 C++\
  \ 代码，它目前是或可以轻松转换为命令行程序——那么如果你能接受这种性能，并且真的不想陷入语言集成的麻烦，那么这个选项就是合理的。\n\n### 选项 2 -\
  \ 共享库 / DLL\n\n\n\n\n\n如果你正在处理 C++ dll/lib，或者你拥有 C++ 源代码并可以进行小幅修改以创建共享库，那么`shared\
  \ library`（共享库）方法可能适合你。我们在本章中详细介绍如何使用[外部函数接口](https://github.com/node-ffi/node-ffi)\
  \ 模块来实现这一点。此选项允许你更细粒地控制如何将 C++ 集成到 Node 中，因为对 C++ 程的调用可以与 Node.js 代码交替执行。虽然这种方法让你更接近完全集成，但在调用\
  \ C++ 时，你仍然需要处理类型转换和阻塞问题。如果你想获得更好的集成，又不想花费大量时间处理 V8，那么这是一个非常棒的选择。\n\n## 选项 3 - Node.js\
  \ 插件\n\n如果你有 C++ 源代码，那么第三种选项是用你的 C++ 创建一个原生 Node.js 模块。虽然这种方法更具挑战性，但你将获得极大的灵性和性能。你还可以选择异步调用\
  \ C++，这样在 C++ 进行数值计算时，就不会阻塞 Web 应用程序的事件循环。当我们在本节介绍这部分内容时，它很大程度上将是对书中主要章节已介绍材料的回顾。\n\
  \n## 运行示例 - 质数\n\n在本节中，我将向你展示如何实现上述每个选项示例。我想在每个示例中使用同一个基础示例。质数对许多事情（例如密码学）极其重要，而且它们的生成通常非常消耗计算资源。在网上快速搜索通常会引导你找到\
  \ C 和 C++ 的实现——而那些真正高效的实现非常`complicated`（复杂）。查看它们的源码，你会立刻意识到你可能不想重写它们——除非你只是在寻找挑战——这没问题：)。\n\
  \n一种更有效的算法被称为[埃拉托斯特尼筛法](https://en.wikipedia.org/wiki/Sieve_of_Eratosthenes)。有一个非常流行的\
  \ C++ 套件 [primseieve](http://primesieve.org/) ——但它构建起来非常复杂。相反，我找到了一个更适合我们目的的简单实现。你可以在\
  \ [`wwwhomes.uni-bielefeld.de/achim/prime_sieve.html`](http://wwwhomes.uni-bielefeld.de/achim/prime_sieve.html)\
  \ 找到它的源代码，它也在本节的 git 仓库中——[`github.com/freezer333/cppwebify-tutorial`](https://github.com/freezer333/cppwebify-tutorial)。\n\
  \n## 入门 - 一个简单的 Node.js Web 应用\n\n在本节中，我将使用`exact`相同的 Node.js Web 应用程序。它非常简单，只有一个带有\
  \ JavaScript (AngularJS) 的 HTML 页面，向服务器请求小于指定值的质数。服务器返回一个包含质数的 JSON 对象——这些质数是用我将实现的几种技术之一计算出的。\n\
  \n我假设读者对 Node.js Web 应用有一些基础了解。我在后端使用 `Express`，前端使用 `AngularJS` 创建了这个应用，但我避开了任何复杂性和视觉装饰，以免分散这些教程的目的。对于你的\
  \ C++ 代码 API 来说，这也是一个很好的设置——只需要丢弃 UI 即可！\n\n要开始——克隆我的 github 仓库并检出标签 \"start\"。\n\
  \n```\n[](#cb270-1)$ git clone https://github.com/freezer333/cppwebify-tutorial.git\n\
  [](#cb270-2)\n[](#cb270-3)$ git checkout start\n```\n\n你可以自己查看这个 Web 应用——但相关的部分是前端（位于\
  \ `/web/views` 中）和后端（位于 `/index.js` 和 `/routes` 中）。\n\n让我们快速看一眼 `/index.js`。前十行左右只是\
  \ express 的样板代码：\n\n```\n[](#cb271-1)var express = require('express');\n[](#cb271-2)var\
  \ app = express();\n[](#cb271-3)var bodyParser = require('body-parser');\n[](#cb271-4)\n\
  [](#cb271-5)app.use(express.static('public'));\n[](#cb271-6)app.set('view engine',\
  \ 'jade');\n[](#cb271-7)\n[](#cb271-8)app.use(bodyParser.json());\n[](#cb271-9)app.use(bodyParser.urlencoded({\
  \ extended: true }));\n```\n\n下一行是构建一个“类型”数组——它最终将包含该系列文章中每个示例的条目。目前，我们只有一个——一个\
  \ Node.js 质数筛实现。\n\n```\n[](#cb272-1)var types = \n[  {\n[](#cb272-3)    title:\
  \ \"pure_node\",\n[](#cb272-4)    description: \"Execute a really primitive \" +\
  \ \n[](#cb272-5)        \"implementation of prime sieve in Node.js\"\n[](#cb272-6)\
  \  }];\n```\n\n`types` 中的每个条目将对应一个路由，位于 `/routes` 目录中。这些路由从 `index.js` 动态加载，Web\
  \ 服务器由最后几行启动。\n\n```\n[](#cb273-1)types.forEach(function (type) {\n[](#cb273-2)\
  \    app.use('/'+type.title, require('./routes/' + type.title));\n[](#cb273-3)});\n\
  [](#cb273-4)\n[](#cb273-5)app.get('/', function (req, res) {\n[](#cb273-6)  res.render('index',\
  \ { routes: types});\n[](#cb273-7)});\n[](#cb273-8)\n[](#cb273-9)var server = app.listen(3000,\
  \ function () {\n[](#cb273-10)  console.log('Web server listing at http://localhost:%s',\
  \ \n[](#cb273-11)    server.address().port);\n[](#cb273-12)});\n```\n\n要启动 Web 服务器，在终端中导航到\
  \ `/web` 目录并输入以下命令：\n\n```\n[](#cb274-1)$ npm install\n[](#cb274-2)... dependencies\
  \ will be installed\n[](#cb274-3)$ node index\n```\n\n现在将浏览器指向 `http://localhost:3000`。你会得到索引页，它列出了实现选项。目前，你只有一个选项——\"\
  pure_node\"。点击它，你将看到一个只有一个数字框的页面。输入 `100` 并提交——Node.js 的质数筛实现将运行并返回 100 以下的所有质数。\n\
  \n![Results for primes under 100](img/file6.png)\n\n100 以下质数的筛选结果\n\nNode.js 中的质数筛实现位于\
  \ `routes/pure_node.js`。与我们将在本系列的剩余部分使用的 C 实现相比，它简单得令人发指——但它确实完成了任务！处理实际响应的代码是路由的\
  \ post 方法：\n\n```\n[](#cb275-1)router.post('/', function(req, res) {\n[](#cb275-2)\
  \    var under = parseInt(req.body.under); // 来自用户\n[](#cb275-3)\n[](#cb275-4) \
  \   var primes = find_primes(under);\n[](#cb275-5)\n[](#cb275-6)    res.setHeader('Content-Type',\
  \ 'application/json');\n[](#cb275-7)    res.end(JSON.stringify({\n[](#cb275-8) \
  \     results: primes\n[](#cb275-9)    }));\n[](#cb275-10)});\n```\n\n## 从 Node.js\
  \ Web 应用中自动化 C++ 程序\n\n如果你的 C++ 程序可以从命令行独立运行——或者可以被设置为独立运行——你就可以使用 Node 的[子进程](https://nodejs.org/api/child_process.html)\
  \ API 来运行它。此选项适用于将任何内容带到 Web——如果你只是简单地运行它，命令行程序用什么语言编写实际上并不重要。\n\n自动化的两个特性使其非常具有吸引力。首先，由于你是在另一个进程中执行\
  \ C++ 应用程序，你本质上是在`asynchronously`（异步）执行 C++ 工作——这在 Web 端是一个巨大的优势，因为在 C++ 程序工作时，你可以处理其他传入的\
  \ HTTP 流量。其次，你真的不需要进行大量的*language integration*（集成）或使用复杂的 V8 API——实际上非常简单！\n\n对于这个特定部分，请从\
  \ git 仓库检出 **automation** 标签。\n\n```\n[](#cb276-1)$ git checkout automation\n```\n\
  \n### 质数筛 C/C++ 实现\n\n\n\n\n如上所述，我们所有的示例都围绕[埃拉托尼筛法](https://en.wikipedia.org/wiki/Sieve_of_Eratosthenes)质数计算策略的\
  \ C 实现构建。这是一个很好的示例问题，因为对于质数来说，速度至关重要——而且我使用的 C 代码并不是那种你会急于重写的类型！我所使用的示例 - [`wwwhomes.uni-bielefeld.de/achim/prime_sieve.html`](http://wwwhomes.uni-bielefeld.de/achim/prime_sieve.html)\
  \ 与利用 CPU 缓存等更复杂的技术相比，其实相当简单。访问 [primesieve.org](http://primesieve.org/)了解一下。对于质数筛的实现，用户必须输入一个最大值，算法将输出该值“之下”的所有质数。在本章的大部分内容中，我们将输入值称为“under”（之下）。\n\
  \n为了跟上进度，请现在查看原始的 `primesieve.c` 代码，地址位于 [`gist.github.com/freezer333/ee7c9880c26d3bf83b8e`](https://gist.github.com/freezer333/ee7c9880c26d3bf83b8e)\
  \ - 虽然不必太纠结于细节，我们不需要对其进行过多修改（这正是重点所在！\n\n## 对 `primesieve.c` 的修改\n\n在面对集成遗留程序时，你可能没有访问代码的权限。为了本章的内容，我将模拟一些常见的集成场景——我将编辑原始\
  \ `primesieve.c` 的某些部分来实现这种模拟。\n\n- **场景 1**：一个仅从命令行参数获取输入并打印到标准输出（stdout）的应用程序。\n\
  - **场景 2**：一个从用户（`stdin`）获取输入并打印到标准输出的应用程序。\n- **场景 3**：一个从文件获取输入并输出到另一个文件的应用程序。\n\
  \n为了模拟每个场景，我们希望能够将一个文件描述符传递给 `primesieve.c` 的主程序，这样程序就不会*总是*打印到控制台。让我们将 `main` 重命名为\
  \ `generate_args` 并添加一个用于文件描述符的第三参数。我们将在场景 3 中专门使用它。\n\n```cpp\n// 在 cppwebify-tutorial/cpp/prime4standalone/prime_sieve.c\
  \ 中，\n// 我将 int main(int argc, char *argv[]) 重命名\n// 为：\nint generate_args(int argc,\
  \ char * argv[], FILE * out) {\n    ... 复杂的质数处理 ...\n}\n```\n\n我将在另一个文件（`main.cpp`）中编写入口点，因此我会在名为\
  \ `prime_sieve.h` 的头文件中添加 `generate_args` 的声明。\n\n我创建了第二个函数 - `generate`，它提供了一个简化的接口——它只接受\
  \ \"under\" 参数而不是命令行参数。定义在 `prime_sieve.c` 的底部，它只是将参数转换为字符参数并调用 `generate_args`。这样做是为了让我不要过多修改原始代码，并让下面的场景\
  \ 2 稍微整洁。显然，富有想象力的读者可以想出实现这些内容的更好方法 :)\n\n```cpp\n// 在 cppwebify-tutorial/cpp/prime4standalone/prime_sieve.c\
  \ 的底部，\n// 一个在不使用命令行参数时使用的适配器函数\nint generate(int under, FILE *out) {\n  char *\
  \ name = \"primes\";\n  char param [50];\n  sprintf(param, \"%d\", under);\n  char\
  \ * values[] = { name, param};\n  generate_args(2, values, out);\n}\n```\n\n因此，我们留下了以下\
  \ `prime_sieve.h` 头文件 - 使用 `extern C` 确保我们的 C 函数可以正确集成到我在示例中使用的 C++ 主文件中。\n\n```cpp\n\
  extern \"C\" {\n    // 旧的 main，已重命名 - 带有第三个参数\n    // 根据需要将输出重定向到文件\n    int generate_args(int\
  \ argc, char * argv[], FILE * out);\n\n    // 当调用者没有通过命令行参数\n    // 接收 under 时的适配器函数\n\
  \    int generate(int under, FILE * out);\n}\n```\n\n## Node.js 子进程 API\n\nNode.js\
  \ 包含一个 `child_process` 模块，提供了用于创建和控制进程的健壮 API。创建新的子进程有三个基本调用 - 每个调用都有自己的用例。\n\n\
  第一个是 `execFile`，它（至少）接受一个可执行程序的路径路径。你可以传递一个参数数组，这些参数将与程序一起。函数的最后一个参数是一个在程序终止时执行的回调函数。该回调将接收一个错误、一个\
  \ stdout 缓冲区和一个 stderr 缓冲区，可用它们来查询程序的输出。需要注意的是，此回调仅在程序执行后才被调用。`execFile` 还会返回一个表示子进程的对象，你可以向它的\
  \ stdin 流写入内容。\n\n```javascript\n// 标准 node 模块\nvar execFile = require('child_process').execFile\n\
  \n// 这会启动可执行文件并立即返回\nvar child = execFile(\"path to executable\", [\"arg1\", \"\
  arg2\"],\n  function (error, stdout, stderr) {\n    // 该回调在子进程终止时被调用\n    // 你也应该检查\
  \ err/stderr！\n    console.log(\"Here is the complete output of the program: \"\
  );\n    console.log(stdout)\n  });\n\n// 如果程序需要在 stdin 上输入，你可以立即写入\nchild.stdin.setEncoding('utf-8');\n\
  child.stdin.write(\"Hello my child!\\n\");\n```\n\n我发现，当你必须自动化一个具有定义良好的输入并以“单阶段”模式运行的应用程序时——意味着一旦你给了它输入，它就会运行一段时间，并倒出所有的输出——`execFile`\
  \ 函数是最好的。质数筛程序正是这种类型的程序——因此我们将在整个章节中使用 `execFile`。\n\n`child_process` 模块还有两个创建进程的函数\
  \ - `spawn` 和 `exec`。`spawn` 非常像 `execFile`，它接受一个可执行文件并启动它。区别在于 `spawn` 会给你提供一个\
  \ stdout 和 stderr 的流式接口。对于更复杂的 I/O 场景（即你的 node 代码与 C++ 应用之间有往返对话），这非常有效。`exec` 再次与\
  \ `execFile` 非常相似，但它用于 shell 程序（ls, 管道等）。\n\n### 同步选项\n\n在 Node.js v0.12 中引入了[一组\
  \ API](https://strongloop.com/strongblog/whats-new-in-node-js-v0-12-execsync-a-synchronous-api-for-child-processes/)，允许你*同步*地执行子应用程序——当程序启动子进程时，你的程序将阻塞，并在子进程终止（并向你返回输出）时恢复。如果你正在创建\
  \ shell 脚本，这非常棒，但它显然*不适用于* Web 应用。对于我们的质数演示，特别是当我们获取质数的 HTTP 请求时，我们需要等待完整的输出，然后向浏览器提供结果页面——但在此期间，我们应该能够继续处理来自其他浏览器的**其他\
  \ HTTP** 请求！除非你有非常特殊的理由，否则在编写 Web 服务器时，你应该避开 `spawnSync`、`execSync` 和 `execFileSync`。\n\
  \n### 场景 1：带有命令行参数输入的 C++ 程序\n\n最易于自动化的程序类型是接受所有输入作为命令行参数并将输出转到 stdout 的程序——所以我们将从这个场景开始。\n\
  \n那么——让我们“想象”质数筛是这样工作的（实际上，它基本上已经是这样了！）。使用该应用程序时，我们可能会输入：\n\n\n\n\n```\n$ primesieve\
  \ 10\n2\n3\n5\n7\n#### {1 <= primes <= 10} = 4\n0.000000000000  -3.464368964356\n\
  ```\n\n我们可以在屏幕上打印出 10 以下的所有质数（每行一个）——再加上程序打印的一些我们不需要的额外信息。\n\n*在我的所有示例中，我都会保持输出易于解析——显然，如果你的程序输出数据的方式很难解析，你可能需要多做一些工作。*\n\
  \n#### 使用 node-gyp 编译 C++ 质数筛\n\n我们的第一步是实际获取一个可执行的 C++ 应用程序！`cpp/prime4standalone`\
  \ 中的 C++ 代码没有入口点——它只是质数生成代码，将我们我们在这里涵盖的 3 个场景共享。在 `cpp/standalone_stdio` 中，我创建了一个入口点：\n\
  \n```cpp\n#include <iostream>\n#include <stdio.h>\n#include \"prime_sieve.h\"\n\
  using namespace std;\n\nint main(int argc, char ** argvs) {\n    generate_args(argc,\
  \ argvs, stdout);\n}\n```\n\n下一步是构建 C++ 可执行文件——将所有三个文件编译在一起：1. `cpp/standalone_stdio/main.cpp`\
  \ 2. `cpp/prime4standalone/prime_sieve.h` 3. `cpp/prime4standalone/prime_sieve.c`\n\
  \n如果你熟悉 C++ 编译，那么使用你喜欢的任何编译器平台来完成此操作将没有问题。我们最终需要使用 `node-gyp` ——所以我以这种方式设置了所有的 C++\
  \ 示例。\n\n```bash\n$ node-gyp configure build\n```\n\n在 `/cpp/standalone_stdio`目录中，你会找到一个\
  \ `binding.gyp` 文件。它包含了使用 `node-gyp` 构建此特定示例所需的信息——可以把它想象成一个 Makefile。\n\n```json\n\
  {\n  \"targets\": [\n    {\n      \"target_name\": \"standalone\",\n      \"type\"\
  : \"executable\",\n      \"sources\": [ \"../prime4standalone/prime_sieve.c\", \n\
  \        \"main.cpp\"],\n      \"cflags\": [\"-Wall\", \"-std=c++11\"],\n      \"\
  include_dirs\" : ['../prime4standalone'],\n      \"conditions\": [\n        [ 'OS==\"\
  mac\"', {\n            \"xcode_settings\": {\n              'OTHER_CPLUSPLUSFLAGS'\
  \ : ['-std=c++11',\n                '-stdlib=libc++'],\n              'OTHER_LDFLAGS':\
  \ ['-stdlib=libc++'],\n              'MACOSX_DEPLOYMENT_TARGET': '10.7' }\n    \
  \      }\n        ]\n      ]\n    }\n  ]\n}\n```\n\n让我们来看一些基础知识。我们只定义了一个目标 (\"standalone\"\
  ) —— 所以它变成了默认目标。它的 `type` 在这里至关重要，因为 `node-gyp` 还可以编译共享库以及（当然！）原生 Node.js 插件。将 `type`\
  \ 设置为 `executable` 告诉 `node-gyp` 创建一个标准的运行可执行文件。`sources` 数组包含了我们的源代码（头文件不需要，但可以添加）。由于本节稍后的很多\
  \ C++ 代码将使用 C++11，因此我也在 `cflags` 属性中传递了一些编译器标志。我还传递了针对 OS X 特有的内容，以便在带有 XCode 的\
  \ Mac 上运行 C++11。这些特殊选项包含在 `conditions` 属性中并在 Linux 和 Windows 下被忽略。最后，我通过在 `include_dirs`\
  \ 属性下添加路径，确保编译器可以找到头文件。\n\n构建操作的结果 —— `node-gyp configure build` 应该在 `cpp/standalone_stdio/build/Release`\
  \ 中创建一个名为 `standalone` 的可执行文件。你应该能够直接从命令行运行它。**现在让我们从 Node.js 运行它。**\n\n#### 从 Node.js\
  \ 实现自动化\n\n之前我们设置了一个非常简单的 Node.js Web 应用程序，它有一个路由可以使用纯 JavaScript 质数筛实现来计算质数。现在我们将创建第二个路由，使用我们的\
  \ C++ 实现。\n\n在 `cppwebify-tutorial/web/index.js` 中，我们首先在 `types` 数组中为新的 C++ 路由添加一个新条目：\n\
  \n```javascript\nvar types = [\n  {\n    title: \"pure_node\",\n    description:\
  \ \"Execute a really primitive \" + \n      \"implementation of prime sieve in Node.js\"\
  \n  },\n  {\n    title: \"standalone_args\",\n    description: \"Execute C++ executable\
  \ as a \" + \n                 \"child process, using command \" +\n           \
  \      \"line args and stdout.  \" + \n                 \"Based on /cpp/standalone_stdio\"\
  \n  }];\n```\n\n该 `types` 数组通过在 `web/routes/` 目录中查找与每个 `title` 属性同名的来创建路由：\n\n```javascript\n\
  types.forEach(function (type) {\n    app.use('/'+type.title, require('./routes/'\
  \ + type.title));\n});\n```\n\n现在我们在 `/web/routes/standalone_args` 中添加我们的路由。如果你查看，第\
  \ 1-9 行与 `pure_node` 示例基本相同——第 11 行我们开始通过执行 C++ 应用程序来响应用户对质数的实际请求：\n\n```javascript\n\
  router.post('/', function(req, res) {\n    var execFile = require('child_process').execFile\n\
  \    // 我们在上面用 node-gyp 构建了它...\n    var program = \"../cpp/standalone_stdio/build/Release/standalone\"\
  ;\n\n    // 来自浏览器\n    var under = parseInt(req.body.under);\n    var child = execFile(program,\
  \ [under],\n      function (error, stdout, stderr) {\n        // prime_sieve 函数的输出\
  \ \n        // 每行一个质数。 \n        \n        // 最后 3 行是额外信息，\n        // 我们在这里没有使用它们\
  \ —— 所以切片了 \n        // stdout 并每行映射为整数。\n        // 你在解析输出时会需要更小心一点！\n        var\
  \ primes = stdout.split(\"\\n\").slice(0, -3)\n                           map(function\
  \ (line) {\n                             return parseInt(line);\n              \
  \             });\n\n        res.setHeader('Content-Type', 'application/json');\n\
  \        res.end(JSON.stringify({\n          results: primes\n        }));\n\n \
  \       console.log(\"Primes generated from \" + type);\n      });\n});\n```\n\n\
  虽然在处理程序输出（以及处理来自浏览器的输入）时可能需要更健壮一些，但如你所见，调用子进程并向浏览器返回响应非常简单。在 `cppwebify-tutorial/web`\
  \ 终端下输入 `node index.js` 运行 Web 应用程序，并将浏览器指向 `http://localhost:3000/`。选择 \"standalone_args\"\
  \ 策略，你可以输入 100 来获取 100 以下的所有质数 —— 这次使用了更快的 C 语言实现！\n\n![100 以下质数的结果](img/file7.png)\n\
