  \  // Polynomial {c:0}\n```\n\n\n\n\n\n为了完成实现，这里是 `polynomial` 类的完整代码列表。与上面展示的内容相比，有几处变化——即访问器（accessors）的实现。由于\
  \ `polynomial` 类拥有三个属性（`a`、`b`、`c`），人们可能会期望看到三组访问器（getters 和 setters）——但这会导致大量的\
  \ V8 样板代码重复。相反，我创建了一组访问器——`GetCoeff` 和 `SetCoeff`，它们通过检查属性参数来确定要返回或更改哪个系数。这完全取决于取决于个人偏好，你完全可以选择创建\
  \ 6 个不同的函数。此外，`roots` 函数也已经实现。\n\n```cpp\n#include <node.h>\n#include <node_object_wrap.h>\n\
  #include <iostream>\n#include <cmath>\nusing namespace std;\nusing namespace v8;\n\
  \nclass WrappedPoly : public node::ObjectWrap {\n public:\n  static void Init(v8::Local<v8::Object>\
  \ exports) {\n      Isolate* isolate = exports->GetIsolate();\n\n      Local<FunctionTemplate>\
  \ tpl = \n        FunctionTemplate::New(isolate, New);\n      tpl->SetClassName(\n\
  \            String::NewFromUtf8(isolate, \"Polynomial\"));\n      tpl->InstanceTemplate()->SetInternalFieldCount(1);\n\
  \n      NODE_SET_PROTOTYPE_METHOD(tpl, \"at\", At);\n      NODE_SET_PROTOTYPE_METHOD(tpl,\
  \ \"roots\", Roots);\n\n      tpl->InstanceTemplate()->SetAccessor(\n          String::NewFromUtf8(isolate,\
  \ \"a\"), GetCoeff, SetCoeff);\n      tpl->InstanceTemplate()->SetAccessor(\n  \
  \        String::NewFromUtf8(isolate, \"b\"), GetCoeff, SetCoeff);\n      tpl->InstanceTemplate()->SetAccessor(\n\
  \          String::NewFromUtf8(isolate, \"c\"), GetCoeff, SetCoeff);\n\n      constructor.Reset(isolate,\
  \ tpl->GetFunction());\n      exports->Set(String::NewFromUtf8(isolate, \"Polynomial\"\
  ),\n               tpl->GetFunction());\n  }\n\n private:\n  explicit WrappedPoly(double\
  \ a = 0, double b = 0, double c = 0)\n    : a_(a), b_(b), c_(c) {}\n  ~WrappedPoly()\
  \ {}\n\n  static void New(const v8::FunctionCallbackInfo<v8::Value>& args) {\n \
  \     Isolate* isolate = args.GetIsolate();\n\n      if (args.IsConstructCall())\
  \ {\n        // Invoked as constructor: `new Polynomial(...)`\n        double a\
  \ = args[0]->IsUndefined() ? 0 : \n            args[0]->NumberValue();\n       \
  \ double b = args[1]->IsUndefined() ? 0 : \n            args[1]->NumberValue();\n\
  \        double c = args[2]->IsUndefined() ? 0 : \n            args[2]->NumberValue();\n\
  \        WrappedPoly* obj = new WrappedPoly(a, b, c);\n        obj->Wrap(args.This());\n\
  \        args.GetReturnValue().Set(args.This());\n      } else {\n\n        // Invoked\
  \ as plain function `Polynomial(...)`, \n        // turn into construct call.\n\
  \        const int argc = 3;\n        Local<Value> argv[argc] = { args[0] , args[1],\
  \ args[2]};\n        Local<Function> cons = \n            Local<Function>::New(isolate,\
  \ constructor);\n        args.GetReturnValue().Set(cons->NewInstance(argc, argv));\n\
  \      }\n  }\n  static void At(const v8::FunctionCallbackInfo<v8::Value>& args);\n\
  \  static void Roots(const v8::FunctionCallbackInfo<v8::Value>& args);\n\n  static\
  \ void GetCoeff(Local<String> property, \n    const PropertyCallbackInfo<Value>&\
  \ info);\n  static void SetCoeff(Local<String> property, \n    Local<Value> value,\
  \ const PropertyCallbackInfo<void>& info);\n\n  static v8::Persistent<v8::Function>\
  \ constructor;\n  double a_;\n  double b_;\n  double c_;\n};\n\nPersistent<Function>\
  \ WrappedPoly::constructor;\n\nvoid WrappedPoly::At(\n    const v8::FunctionCallbackInfo<v8::Value>&\
  \ args) {\n\n    Isolate* isolate = args.GetIsolate();\n    double x = args[0]->IsUndefined()\
  \ ? 0 : args[0]->NumberValue();\n    WrappedPoly* poly = ObjectWrap::Unwrap<WrappedPoly>(args.Holder());\n\
  \n    double results = x * x * poly->a_ + x * poly->b_ + poly->c_;\n\n    args.GetReturnValue().Set(Number::New(isolate,\
  \ results));\n}\n\nvoid WrappedPoly::Roots(\n    const v8::FunctionCallbackInfo<v8::Value>&\
  \ args) {\n\n    Isolate* isolate = args.GetIsolate();\n    WrappedPoly* poly =\
  \ ObjectWrap::Unwrap<WrappedPoly>(args.Holder());\n    Local<Array> roots = Array::New(isolate);\n\
  \    double desc = poly->b_ * poly->b_ - 4 * poly->a_ * poly->c_;\n    if (desc\
  \ >= 0) {\n        double r = (-poly->b_ + sqrt(desc))/(2 * poly->a_);\n       \
  \ roots->Set(0,Number::New(isolate, r));\n        if (desc > 0) {\n            r\
  \ = (-poly->b_ - sqrt(desc))/(2 * poly->a_);\n            roots->Set(1,Number::New(isolate,\
  \ r));\n        }\n    }\n    args.GetReturnValue().Set(roots);\n}\n\nvoid WrappedPoly::GetCoeff(Local<String>\
  \ property, \n    const PropertyCallbackInfo<Value>& info) {\n\n    Isolate* isolate\
  \ = info.GetIsolate();\n    WrappedPoly* poly = ObjectWrap::Unwrap<WrappedPoly>(info.Holder());\n\
  \    v8::String::Utf8Value s(property);\n    std::string str(*s);\n\n    if (str\
  \ == \"a\") {\n        info.GetReturnValue().Set(Number::New(isolate, poly->a_));\n\
  \    } else if (str == \"b\") {\n        info.GetReturnValue().Set(Number::New(isolate,\
  \ poly->b_));\n    } else if (str == \"c\") {\n        info.GetReturnValue().Set(Number::New(isolate,\
  \ poly->c_));\n    }\n}\n\nvoid WrappedPoly::SetCoeff(Local<String> property, \n\
  \    Local<Value> value, const PropertyCallbackInfo<void>& info) {\n\n    Isolate*\
  \ isolate = info.GetIsolate();\n    WrappedPoly* obj = ObjectWrap::Unwrap<WrappedPoly>(info.Holder());\n\
  \    v8::String::Utf8Value s(property);\n    std::string str(*s);\n\n    if (str\
  \ == \"a\") {\n        obj->a_ = value->NumberValue();\n    } else if (str == \"\
  b\") {\n        obj->b_ = value->NumberValue();\n    } else if (str == \"c\") {\n\
  \        obj->c_ = value->NumberValue();\n    }\n}\n\nvoid InitPoly(Local<Object>\
  \ exports) {\n  WrappedPoly::Init(exports);\n}\n\nNODE_MODULE(polynomial, InitPoly)\n\
  ```\n\n\n\n\n如果在 C++ 代码中已经有了一个 `Polynomial` 类，它只是一个感知不到 V8 和 Node 的普通 C++ 类怎么办？遗憾的是，我们仍然需要执行上面看过的所有步骤。你仍然想要创建一个新的\
  \ `WarppedPoly` 类，并创建所有相同的 V8 函数来暴露如 `roots`、`at` 和属性访问器等功能。在这种情况下，区别在于 `WrappedPolynomial`\
  \ 可能会包含一个你的 `Polynomial` POCO 实例，而不是它自己的三个系数。基于 V8 的函数（如 `roots` 和 `at`）将简单地将调用转发到\
  \ POCO `Polynomial` 实现。这并不是最令人满意的解决方案——因为这意味着要复制类接口——但它将允许你将 POCO 功能导出到你的 Node.js\
  \ 程序中。\n\n## 作为参数的包装对象\n\n作为最后一个例子，让我们来看看你的*包装*类实例从 JavaScript *回传*到 C++ 插件函数的情况。这可能是一个有一个独立\
  \ `add` 函数的插件，该函数接受两个多项式。从 JavaScript 的角度来看，它可能会是这样的：\n\n```\nvar polyA = new addon.Polynomial(1,\
  \ 3, 2);\nvar polyB = new addon.Polynomial(8, -2, 4);\nvar polyC = addon.add(polyA,\
  \ polyB);\n\n// prints 9, 1, -2\nconsole.log(polyC.a + \", \" + polyC.b + \", \"\
  \ + polyC.c);\n```\n\n在这里，`add` 函数是 `Polynomial` 的静态成员。\n\n```\n// 定义在 WrappedPoly\
  \ 类中\nstatic void Add(const FunctionCallbackInfo<Value>& args) {\n    Isolate* isolate\
  \ = args.GetIsolate();\n\n    WrappedPoly* obj1 = \n        node::ObjectWrap::Unwrap<WrappedPoly>(\n\
  \        args[0]->ToObject());\n    WrappedPoly* obj2 = \n        node::ObjectWrap::Unwrap<WrappedPoly>(\n\
  \        args[1]->ToObject());\n\n    double a = obj1->a_ + obj2->a_;\n    double\
  \ b = obj1->b_ + obj2->b_;\n    double c = obj1->c_ + obj2->c_;\n\n    Local<Value>\
  \ argv[3] = { \n        Number::New(isolate, a), \n        Number::New(isolate,\
  \ b), \n        Number::New(isolate, c)};\n\n    Local<Function> cons = \n     \
  \   Local<Function>::New(isolate, constructor);\n    args.GetReturnValue().Set(cons->NewInstance(3,\
  \ argv));\n}\n```\n\n该方法使用标准的 V8 样式从模块导出——它不是作为 JS `Polynomial` 类的一部分导出。\n\n```\n\
  void InitPoly(Local<Object> exports) {\n  WrappedPoly::Init(exports);\n  NODE_SET_METHOD(exports,\
  \ \"add\", WrappedPoly::Add);\n}\n```\n\n# 第 6 章 - Node 的原生抽象 (NAN)\n\n在本书的前五章中，我们一直假设我们创建的插件目标是\
  \ Node.js 0.12 到 6.0 版本。这是一个非常宽的版本范围，但在某些更早的 Node.js 版本中，我们的插件将无法编译/运行。在使用云托管服务时这可能是一个重大问题，因为这些服务可能在使用较早的\
  \ Node.js 版本。在通过 npm 分发插件时也会产生问题——因为你的插件无法分发给所有用户。\n\n为什么我们的插件在早期版本中无法工作？为什么我们应该担心未来的\
  \ Node.js 版本可能会破坏我们的插件？答案是，定义我们与 JavaScript 交互的 API 的并不是 Node.js，而是 V8！V8 API 会随着时间而变化，无法保证它不会再次发生变化。虽然\
  \ V8 开发者确实尝试保持 API 的稳定，但在每个新版本中，经常会引入一些（可能是很小的）破坏性变更。随着新的 V8 版本被引入到 Node.js 版本中，我们面临着插件可能需要修改的持续危险。\n\
  \n考虑到 Node.js 运行版本的流行（许多应用程序仍然运行在 Node.js v0.10、v0.12、v4.0 等上），确实需要某种形式的抽象，以便我们针对一个更稳定（且更干净！）的\
  \ API。[Native Abstractions for Node (NAN)](https://github.com/nodejs/nan) 正是如此。\n\
  \nNAN 由 io.js 工作组管理，旨在提供一组宏和工具以实现两个目标：1) 在所有 Node.js 版本中维护稳定的 API； 2) 提供一组工具帮助简化\
  \ Node.js 和 V8 API 中一些最困难的部分（例如异步插件开发）。虽然在使用 NAN 开发时，只有在你打算支持跨 Node.js v0.10 - 4.0\
  \ 版本的插件时才需要，但熟悉它并在任何你预计在长期内会有大量用户的项目中使用它都是一个好主意。\n\n需要注意的是，NAN *不是* 一个高级 API。虽然有少数工具可以简化异步插件开发，但\
  \ NAN 的大部分只是为标准的 V8 操作提供了替换的宏调用，例如在 JavaScript 堆中创建新的原始类型/对象、定义导出函数，以及 Node.js 操作（如对象包装）。我们到为止学到的\
  \ V8 编程底层规则仍然适用——NAN 仅仅为完成我们之前做过的事情提供了一个略有不同的 API。\n\n在本章中，我将快速展示完成我们在第 1-5 章中所实现的任务的相应“NAN\
  \ 方式”。在随后的章节中，我们将几乎完全地使用 NAN——因为它对于复杂的插件开发非常有帮助，并且在向 npm 公开发布插件时非常有意义。\n\n本章的所有代码可以在\
  \ `nodecpp-demo` 仓库中完整找到，地址为 [`github.com/freezer333/nodecpp-demo`](https://github.com/freezer333/nodecpp-demo)，位于\
  \ \"Conversions_NAN\"、primes\" 和 \"ObjectWrap_NAN\" 部分。\n\n## 基础功能\n\n为了演示简单功能，让我们回到第\
  \ 2 章的插件示例，特别是我们如何在 JavaScript 之间传递原始类型和对象/数组的地方。这是我们在插件内部创建的函数：\n\n```\nNODE_SET_METHOD(exports,\
  \ \"pass_number\", PassNumber);\nNODE_SET_METHOD(exports, \"pass_integer\", PassInteger);\n\
  NODE_SET_METHOD(exports, \"pass_string\", PassString);\nNODE_SET_METHOD(exports,\
  \ \"pass_boolean\", PassBoolean);\nNODE_SET_METHOD(exports, \"pass_object\", PassObject);\n\
  NODE_SET_METHOD(exports, \"increment_array\", IncrementArray);\n```\n\n\n\n\n然而，与大多数通过\
  \ `npm` 安装的模块不同，执行安装并不会安装 JavaScript 包，它只是下载了 `NAN` 的 C++（主要是头文件）分发。你不需要在 JavaScript\
  \ 中引用 `NAN` —— 但你需要在 C++ 代码中引用它，具体通过包含 `nan.h`。\n\n为了将依赖项添加到你的插件中，我们在 `binding.gyp`\
  \ 文件中添加了一点 `node-gyp` 的魔术：\n\n```\n\"include_dirs\" : [\n    \"<!(node -e \\\"require('nan')\\\
  \")\"\n]\n```\n\n该指令将确保在我们编译 C++ 插件时，`nan` 模块的头文件位于构建路径上。\n\n## 创建函数\n\n让我们从实现示例中最简单的函数开始——`pass_number`。我们将创建一个包含插件的文件夹，创建一个\
  \ `package.json`，通过执行 `npm install nan --save` 安装 NAN，并配置以下 `binding.gyp` 文件：\n\n\
  ```json\n{\n  \"targets\": [\n    {\n      \"target_name\": \"basic_nan\",\n   \
  \   \"sources\": [ \"basic_nan.cpp\" ], \n      \"include_dirs\" : [\n        \"\
  <!(node -e \\\"require('nan')\\\")\n      ]\n    }\n  ]\n}\n```\n\n现在我们将创建 `basic_nan.cpp`\
  \ 并设置我们的插件。\n\n```cpp\n#include <nan.h>\nusing namespace Nan;\nusing namespace v8;\n\
  \nNAN_METHOD(PassNumber) {\n    // 现在什么都不做 ... \n}\nNAN_MODULE_INIT(Init) {\n  \
  \  Nan::Set(target, \n      New<String>(\"pass_number\").ToLocalChecked(),\n   \
  \   GetFunction<FunctionTemplate>(PassNumber).ToLocalChecked());\n}\nNODE_MODULE(basic_nan,\
  \ Init)\n```\n\n将此与使用标准 V8 实现相同函数的设置进行对比：\n\n```cpp\n#include <node.h>\nusing namespace\
  \ v8;\nvoid PassNumber(const FunctionCallbackInfo<Value>& args) {\n    // 现在什么都不做\
  \ ... \n}\nvoid Init(Local<Object> exports) {\n  NODE_SET_METHOD(exports, \"pass_number\"\
  , PassNumber);\n}\nNODE_MODULE(basic_nan, Init)\n```\n\n让我们从最底部开始——注意 `NODE_MODULE`\
  \ 是完全相同的。`NODE_MODULE` 已经是一个宏了——不需要为了跨 Node.js 版本的兼容性而对其进行封装。正如 NAN 的模式一样，除非有理由相信\
  \ V8/Node 的 API 变化会导致问题，否则作者们不会发明新的实现方式。向上看，我们有了 `Init` 方法。在纯 V8 方法中，我们在 `NODE_MODULE`\
  \ 中使用一个特定的调用签名——它的返回类型必须是 `void` 并且接受 `exports`（以及可选）。在 NAN 中，提供了一个宏 `NAN_MODULE_INIT`。该宏是参数化的，因此我们仍然可以为初始化例程命名（`Init`），但该宏保护我们免受调用签名任何不一致性的影响。\n\
  \n在 `Init` 内部我们开始看到重大变化，奇怪的是，使用 NAN 实际上变得更复杂了！我们没有使用 `NODE_SET_METHOD` 宏，而是利用 `NAN`\
  \ 内部的 `Set` 函数。注意 NAN 版本的 `Init` 中有一个“魔术”变量叫做 `target`。它由 `NAN_MODULE_INIT` 宏提供，确实就是我们习惯处理的\
  \ `exports` 对象。使用 `NAN` 设置任何对象上的值时，必须使用实际字符串和函数——因此需要额外的代码将 \"pass_numbers\" 转换为\
  \ V8 字符串并将 `PassNumber` 引用 JavaScript 函数。我们稍后会介绍这些转换的细节，因为它们使用了 `NAN` 高度依赖的标准 `New`\
  \ 和 `ToLocalChecked` 方法。\n\n再次向上看，我们查看 `PassNumber` 函数。在原始 V8 代码中，我们必须有一个特定的调用签名——返回\
  \ `void` 并接受一个包含调用信息的 `FunctionCallbackInfo` 对象。这种签名在不同的 V8 版本之间发生了巨大的变化，因此 NAN\
  \ 为我们提供一个宏来快速生成它也不为为奇。`NAN_METHOD` 会根据安装的 Node.js 版本创建一个相应的函数签名。正如我们稍后看到的，它还创建了一个\
  \ `info` 参数，允许我们以一种独立于 V8 版本的方式获取函数参数和所有者（this）。\n\n在两个列表的最顶部，你会注意到我们现在使用了一个额外的命名空间\
  \ `Nan`。`v8` 命名空间仍然在使用，且 `node.h` 已经通过 `nan.h` 包含。\n\n## 处理原始类型\n\n让我们继续留在 `PassNumber`。在最简单的形式下（不进行错误检查），原始\
  \ V8 实现如下：\n\n```cpp\nvoid PassNumber(const FunctionCallbackInfo<Value>& args) {\n\
  \    Isolate * isolate = args.GetIsolate();\n\n    double value = args[0]->NumberValue();\n\
  \n    Local<Number> retval = Number::New(isolate, value + 42);\n    args.GetReturnValue().Set(retval);\n\
  }\n```\n\n转换为使用 NAN 再不过简单了。主要变化将：\n\n1. 不需要获取 `Isolate`。\n2. 我们将使用 `NAN_METHOD`\
  \ 宏提供的内置 `info` 参数，而不是直接使用 `FunctionCallbackInfo`。\n3. 我们将使用 `Nan::New` 创建新数字，而不是\
  \ `V8::Number`（这就是为什么我们不需要 `Isolate`）。\n\n```cpp\nNAN_METHOD(PassNumber) {\n   \
  \ double value = info[0]->NumberValue();\n\n    Local<Number> retval = Nan::New(value\
  \ + 42);\n    info.GetReturnValue().Set(retval); \n}\n```\n\n执行错误检查非常直接，因为 `info`\
  \ 对象与 V8 示例相同：\n\n```cpp\nif ( info.Length() < 1 ) {\n  info.GetReturnValue().Set(Nan::New(0));\n\
  \  return;\n}\nif(info[0]->IsNumber()) {\n  info.GetReturnValue().Set(Nan::New(-1));\n\
  ```\n\n这些函数的布尔变体遵循相同的模式——`Nan::New` 方法被重载以创建适当的值，且 `info` 有 `IntegerValue` 和 `BooleanValue`。\n\
  \n```cpp\nNAN_METHOD(PassInteger) {\n    if ( info.Length() < 1 ) {\n        return;\n\
  \    }\n    if(info[0]->IsInt32()) {\n        return;\n    }\n    int value = info[0]->IntegerValue();\n\
  \    Local<Integer> retval = Nan::New(value + 42);\n    info.GetReturnValue().Set(retval);\n\
  }\n\nNAN_METHOD(PassBoolean) {\n    if ( info.Length() < 1 ) {\n        return;\n\
  \    }\n    if(info[0]->IsBoolean()) {\n        return;\n    }\n    bool value =\
  \ info[0]->BooleanValue();\n    Local<Boolean> retval = Nan::New(!value);\n    info.GetReturnValue().Set(retval);\n\
  }\n```\n\n### Maybe 类型和 `ToLocalChecked`\n\n如果你阅读 NAN 文档，你会很快注意到它非常强调 `Maybe` 类型概念，这是\
  \ V8 的一个较新特性。同样，虽然我们上面的示例以简洁的格式处理参数和新的原始类型，但许多 NAN 示例在创建 JavaScript 原始类型和对象（包括函数）时使用了\
  \ `ToLocalChecked`。事实上，我们在 `Init` 方法本身中就看到了这种风格。\n\n\n\n\n\n让我们假设我们已经导出了 `PassNumber`\
  \ 方法，并使用如下 JavaScript 代码调用它：\n\n```javascript\nconsole.log( addon.pass_number(\"\
  xyz\") );\n```\n\n在我们的原始代码中，`info[0]` 是一个 `Local<Value>`，考虑到传递给 add 的参数，获取“正确”数值是非常轻而易见的：如果参数不是有效的数字，`info[0]->NumberValue()`\
  \ 将返回 `NaN`。不过，还有另一种执行向 Number 转换的方法，即使用 `Nan::To` 和 `ToLocalChecked`。\n\n```cpp\n\
  NAN_METHOD(PassNumber) {\n    Nan::MaybeLocal<Number> value = Nan::To<Number>(info[0]);\
  \ \n    // 如果 value 为空则会崩溃\n    Local<Number> checked = value.ToLocalChecked();\n\
  \    Local<Number> retval = Nan::New(checked->Value() + 42);\n    info.GetReturnValue().Set(retval);\
  \ \n}\n```\n\n在这里我们看到了对 `Maybe` 类型的（简单的）用法，它可能包含值，也可能不包含。`Nan::To` 返回 `Maybe` 类型——而通过调用\
  \ `ToLocalChecked` 实现转换为真正的本地变量。注意，如果 `value` 实际上为空，`ToLocalChecked` 会导致程序崩溃。有趣的是，`value`\
  \ 将始终有一个实际值，因为向 Number 的转换在 JavaScript 中是有定义的——任何非数字的内容都是 `NaN`。在这种情况下，无论我们向 `PassNumber`\
  \ 传递什么，`ToLocalChecked` 都会一直成功。\n\n我们也可以直接转换为 `double`，而不是创建一个 `Local<Number>`。\n\
  \n```cpp\nNAN_METHOD(PassNumber) {\n    Nan::Maybe<double> value = Nan::To<double>(info[0]);\
  \ \n    Local<Number> retval = Nan::New(value.FromJust() + 42);\n    info.GetReturnValue().Set(retval);\
  \ \n}\n```\n\n我们通过这个函数得到的结果与之前相同——在这里我们使用了 `Maybe` 类型的 `FromJust` 方法来获取实际的 double\
  \ 数值。再次，由于数字*总是*从任何其他 JavaScript 类型拥有定义的值——这些 `Maybe` 示例显得有些多余——它们永远不会崩溃！尽管如此，你会在很多地方看到这种风格。\n\
  \n### 处理字符串\n\n从参数中提取字符串与数字和布尔值类似，但将它们转换为实际 C++ 字符串需要额外使用 `Nan::Utf8String` 的步骤，就像我们在直接处理\
  \ V8 时需要使用 `v8::String::Utf8Value` 一样。\n\n```cpp\nNAN_METHOD(PassString) {\n   \
  \ Nan::MaybeLocal<String> tmp = Nan::To<String>(info[0]);\n    Local<String> local_string\
  \ = tmp.ToLocalChecked(); \n    Nan::Utf8String val(local_string); \n    std::string\
  \ str (*val);\n    std::reverse(str.begin(), str.end()); \n    info.GetReturnValue().Set(\n\
  \         Nan::New<String>(str.c_str()).ToLocalChecked()); \n}\n```\n\n在创建新字符串对象时，我们被迫再次直接处理\
  \ `Maybe` 类型，这与创建新数字不同。因为虽然 `Nan::New` 对于大多数 JavaScript 类型返回 `Local`，但在创建字符串、日期、正则表达式和脚本对象时，它返回的是\
  \ `MaybeLocal`。这种不一致性是由层的 V8 API 驱动的。然而，如我们在上面看到的，转换为 `Local` 只需要我们在 `Nan::New<String>`\
  \ 的返回值上使用 `ToLocalChecked`。由于我们专门传递了已知为字符串的内容，我们不需要担心 `ToLocalChecked` 实际上会失败。\n\
  \n还有一种稍微方便的方法从 `info` 对象获取 `Utf8String`，即使用 `Local<Value>` 上定义的 `ToString` 方法。\n\
  \n```cpp\nNAN_METHOD(PassString) {\n    v8::String::Utf8Value val(info[0]->ToString());\n\
  \    std::string str (*val);\n    std::reverse(str.begin(), str.end()); \n    info.GetReturnValue().Set(\n\
  \         Nan::New<String>(str.c_str()).ToLocalChecked()); \n}\n```\n\n### 处理对象\n\
  \n到目前为止，你可能注意到迁移到 NAN 的真实变化集中在对 `Isolate` 的使用（或未使用）以及新变量的分配方式。NAN 并没有取代对大部分 V8 API\
  \ 的直接使用——特别是 `Local<Value>`。当我们处理对象时，这一点变得更加明显。让我们看看第 2 章中我们的 `PassObject` 插件函数的第一个纯\
  \ V8 实现。\n\n```cpp\nLocal<Value> make_return(\n    Isolate * isolate, const Local<Object>\
  \ input ) {\n    Local<String> x_prop = String::NewFromUtf8(isolate, \"x\");\n \
  \   Local<String> y_prop = String::NewFromUtf8(isolate, \"y\");\n    Local<String>\
  \ sum_prop = String::NewFromUtf8(isolate, \"sum\");\n    Local<String> product_prop\
  \ = String::NewFromUtf8(isolate, \"product\");\n    double x = input->Get(x_prop)->NumberValue();\n\
  \    double y = input->Get(y_prop)->NumberValue();\n    HandleScope scope(isolate);\n\
  \    Local<Object> obj = Object::New(isolate);\n    obj->Set(sum_prop, Number::New(x\
  \ + y));\n    obj->Set(product_prop, Number::New(x * y));\n    return obj;\n}\n\n\
  void PassObject(const CallbackInfo<Value>& args) {\n    Isolate * isolate = args.GetIsolate();\n\
  \    if ( args.Length() > 0 ) {\n        Local<Object> target = args[0]->ToObject();\n\
  \        Local<Value> obj = make_return(target);\n        args.GetReturnValue().Set(obj);\n\
  \    }\n}\n```\n\n注意，从 `input` 对象中提取属性的语法发生了变化，因为我们使用 `Nan::New` 来构建字符串属性名。我们还利用\
  \ `Nan::New<Object>` 来创建要返回的新对象。对 `Isolate` 的所有引用都被移除，因为 NAN 在后台为我们处理这些。在上面的示例中，我们仍然在使用\
  \ `Local<Object>` 的原生 V8 `Set` 方法来设置和和积属性。NAN 也有自己的属性设置方法，使用它将进一步保护你免受 V8 API 版本变化的影响：\n\
  \n```cpp\nNan::Set(obj, sum_prop, Nan::New<Number>(x+y));\nNan::Set(obj, product_prop,\
  \ Nan::New<Number>(x*y));\n```\n\n\n\n\n同样，我们可以使用 `Nan::Get` 来获取 `x` 和 `y`，而不是使用原始的\
  \ V8 API。这里是充分发挥 NAN 魅力的 `make_return` 版本：\n\n```\nLocal<Value> make_return(const\
  \ Local<Object> input ) {\n    Local<String> x_prop = \n        Nan::New<String>(\"\
  x\").ToLocalChecked();\n    Local<String> y_prop = \n        Nan::New<String>(\"\
  y\").ToLocalChecked();\n    Local<String> sum_prop = \n        Nan::New<String>(\"\
  sum\").ToLocalChecked();\n    Local<String> product_prop = \n        Nan::New<String>(\"\
  product\").ToLocalChecked();\n\n    Local<Object> obj = Nan::New<Object>();\n  \
  \  double x = Nan::Get(input, x_prop)\n        .ToLocalChecked()->NumberValue();\n\
  \    double y = Nan::Get(input, y_prop)\n        .ToLocalChecked()->NumberValue();\n\
  \n    Nan::Set(obj, sum_prop, Nan::New<Number>(x+y));\n    Nan::Set(obj, product_prop,\
  \ Nan::New<Number>(x*y));\n    return obj;\n}\n```\n\n现在似乎是时候指出一些显而易见的问题了……使用 NAN\
  \ 和 V8 API 并不是“二选一”的关系，混合使用它们没有问题。尽管如此，如果你确实在使用 NAN，那么使用“NAN 方式”编写所有能编写的内容可能是有意义的——这样你就能充分利用版本兼容性的优势。\n\
  \n### 处理数组\n\n完成对第 2 章基础示例的转换后，让我们来看看处理数组时的变化。回想一下，我们构建了一个简单的数组插件函数，它接受一个数字数组，但还有一个名为\
  \ \"not_index\" 的属性，用来演示我们如何仍然访问数组上的命名属性。该插件返回一个包含 3 个元素的数组——第一个和最后一个元素只是输入数组的第一个和最后一个元素并各加\
  \ 1。返回数组中的第二个索引设置为在 \"not_index\" 中找到的值。以下是我们使用 V8 的写法：\n\n```\nvoid IncrementArray(const\
  \ FunctionCallbackInfo<Value>& args) {\n    Isolate * isolate = args.GetIsolate();\n\
  \    Local<Array> array = Local<Array>::Cast(args[0]);\n\n    for (unsigned int\
  \ i = 0; i < array->Length(); i++ ) {\n      if (array->Has(i)) {\n        double\
  \ value = array->Get(i)->NumberValue();\n        array->Set(i, Number::New(isolate,\
  \ value + 1));\n      }\n    }\n\n    Local<String> prop = \n        String::NewFromUtf8(isolate,\
  \ \"not_index\");\n    Local<Array> a = Array::New(isolate);\n    a->Set(0, array->Get(0));\n\
  \    a->Set(1, array->Get(prop));\n    a->Set(2, array->Get(2));\n\n    args.GetReturnValue().Set(a);\n\
  }\n```\n\n让我们直接进入完整的 NAN 实现。关键变化将是创建新数组、新值，并使用 NAN 的 getter 和 setter 来访问数组索引和属性。注意在\
  \ `Nan::Set` 和 `Nan::Get` 中使用了整数，这允许你对数组进行索引。\n\n```\nNAN_METHOD(IncrementArray)\
  \ {\n    Local<Array> array = Local<Array>::Cast(info[0]);\n\n    for (unsigned\
  \ int i = 0; i < array->Length(); i++ ) {\n      if (Nan::Has(array, i).FromJust())\
  \ {\n        double value = Nan::Get(array, i)\n            .ToLocalChecked()->NumberValue();\n\
  \        Nan::Set(array, i, Nan::New<Number>(value + 1));\n      }\n    }\n\n  \
  \  Local<String> prop = \n        Nan::New<String>(\"not_index\").ToLocalChecked();\n\
  \    Local<Array> a = New<v8::Array>(3);\n    Nan::Set(a, 0, Nan::Get(array, 0).ToLocalChecked());\n\
  \    Nan::Set(a, 1, Nan::Get(array, prop).ToLocalChecked());\n    Nan::Set(a, 2,\
  \ Nan::Get(array, 2).ToLocalChecked());\n    args.GetReturnValue().Set(a);\n}\n\
  ```\n\n\n\n该插件中最有趣的方面在于我们如何使用 `NAN` 来帮助我们处理回调，这个回调在我们获得结果后必须被调用。注意 `Callback` 对象的使用，它是一个封装了标准\
  \ `v8::Function` 的 `NAN` 类。在上面的同步代码中，与直接使用 `v8::Function` 相比，它提供的价值有限——但 `Callback`\
  \ 保护了它封装的函数免受垃圾回收（利用了 `Persistent` 句柄）。这一功能在处理异步插件时极大地简化了回调的使用，因此养成使用它的习惯是非常好的。\n\
  \n大多数接受回调的插件都是异步的（否则，为什么不直接返回结果呢！）。在第 4 章中，我们曾直接深入研究了与 `libuv` 的工作，创建了一个多线程插件，在那里我们自己管理了工作线程和\
  \ Node 事件循环线程之间的数据移动。这工作量非常大，而且很容易出错。`NAN` 提供了几个实用类，抽象了在事件循环和工作线程之间移动数据的概念，这让我们能够更快速地专注于实际代码。\n\
  \n`NAN` 提供的关键类是 [`Nan::AsyncWorker`](https://github.com/nodejs/nan/blob/master/doc/asyncworker.md#api_nan_async_worker)。该类允许你创建一个新的工作线程，并便于持久化存储数据、调用工作线程代码以及在完成后调用持久回调。你的第一步是设置一个继承自\
  \ `AsyncWorker` 的类并实现抽象的 `Execute` 方法。通常，输入到你的工作线程将保存在你的类中，通常通过构造函数传递。当你的 `Execute`\
  \ 函数完成时（稍后我们将如何运行它），`AsyncWorker` 将调用它的 `HandleOKCallback`——你通常会重写它以调用回调将结果传回 JavaScript。`AsyncWorker`\
  \ 确保 `Execute` 在后台线程中运行，而 `HandleOKCallback`（如果需要还有 `HandleErrorCallback`）作为事件循环的一部分执行。\n\
  \n下面的代码设置了一个基础的 `AsyncWorker` 实现，它可以与我们的质数代码配合：\n\n```cpp\nclass PrimeWorker : public\
  \ AsyncWorker {\n    public:\n    PrimeWorker(Callback * callback, int limit) \n\
  \        : AsyncWorker(callback), limit(limit) {\n    }\n    // 在工作线程中执行\n    void\
  \ Execute() {\n        find_primes(limit, primes);\n    }\n    // 在事件循环中执行\n   \
  \ void HandleOKCallback () {\n        Local<Array> results = New<Array>(primes.size());\n\
  \        for ( unsigned int i = 0; i < primes.size(); i++ ) {\n            Nan::Set(results,\
  \ i, New<v8::Number>(primes[i]));\n        } \n        Local<Value> argv[] = { results\
  \ };\n        callback->Call(1, argv);\n    }\n    private:\n    int limit;\n  \
  \  vector<int> primes;\n};\n```\n\n注意在 `PrimeWorker` 的构造函数中，我们调用了基类的构造函数来传递回调——`AsyncWorker`\
  \ 将其持久化存储。实际工作在 `Execute` 中完成，它使用成员变量 `limit` 和 `primes` 来计算结果。一旦 `Execute` 完成，就会调用\
  \ `HandleOKCallback`（在事件循环线程上），然后我们调用回调。这段代码与同步版本几乎相同，只是分布在两个成员函数中。\n\n当然，这个类必须实例化。我们将在插件函数中这样做，但不会直接调用\
  \ `Execute`。相反，`NAN` 提供了一个名为 `AsyncQueueWorker` 的实用方法，它接受一个 `AsyncWorker` 并将其执行队列，使得\
  \ `Execute` 在工作线程中运行。这让我们完全无需再直接处理 `libuv`。\n\n```cpp\nNAN_METHOD(Primes) {\n  \
  \  int limit = To<int>(info[0]).FromJust();\n    Callback *callback = new Callback(info[1].As<Function>());\n\
  \n    AsyncQueueWorker(new PrimeWorker(callback, limit));\n}\n```\n\n从 JavaScript\
  \ 调用同步和异步版本的质数插件的方法是相同的，我们也会得到相同的结果——然而，异步版本优越得多，因为对于大的 `N` 值，正在进行的密集型 CPU 计算不会阻塞事件循环去处理其他事情！\n\
  \n### 从异步插件中发送进度更新\n\n在上面的质数插件中，我们在核心 `for` 循环中生成质数，这可能需要一段时间才能完成。我们将所有质数收集在一个 `vector`\
  \ 中，然后在最后一次性全部倒回。如果我们能显示当前的进度，就太好了，这样用户就不会对过程可能需要多久一无所知。虽然我们可以直接使用 `libuv` 实现这一点，但\
  \ `NAN` 在这种情况下真的帮了我们——通过提供一个名为 `AsyncProgressWorker` 的 `AsyncWorker` 子类。`AsyncProgressWorker`\
  \ 为异步执行期间向 JavaScript 发送进度更新构建了一种方便的模式。\n\n`AsyncProgressWorker` 背后的核心原理传递到 `Execute`\
  \ 函数的额外参数。该参数类型为 `ExecutionProgress`，是我们观察我们现在必须实现的第二个回调（`HandleProgressCallback`）调用的窗口。`HandleProgressCallback`将在事件循环中执行，而\
  \ `ExecutionProgress` 提供了一个方法允许我们存储数据（持久化地），并将对 `HandleProgressCallback` 的调用加入队列。这个方法\
  \ `progress.Send` 非常简单——它接受数据指针及其大小。数据被存储在 `ExecutionProgress` 内部的 `Persistent`\
  \ 句柄中，直到在事件循环中调用回调。\n\n下面是对上述 `PrimeWorker` 代码的改编，它现在会发送进度更新，指示距离完成还有多远。在 `Execute`\
  \ 函数中，我们实际上在计算质数，而不是委托给原始的 `find_primes`，因为我们需要发送进度更新（当然，你可以修改 `find_primes` 让它也接受\
  \ `progress` 对象）。注意，我们每次循环后都进行了休眠，仅仅是为了效果（否则我们很快就完成了！）。睡眠代码需要 C++11，并包含 `<thread>`\
  \ 和 `<chrono>` 库。\n\n\n\n\n```cpp\nclass PrimeProgressWorker : public AsyncProgressWorker\
  \ {\n    public:\n    PrimeProgressWorker(Callback * callback, \n        Callback\
  \ * progress, int limit) \n        : AsyncProgressWorker(callback), \n         \
  \   progress(progress), limit(limit) {\n\n    }\n    // 在工作线程中执行\n    void Execute(\n\
  \        const AsyncProgressWorker::ExecutionProgress & progress) {\n\n        std::vector<int>\
  \ is_prime(limit, true);\n        for (int n = 2; n < limit; n++ ) {\n         \
  \   double p = (100.0 * n) / limit;\n            progress.Send(reinterpret_cast<const\
  \ char*>(&p), \n                sizeof(double));\n            if (is_prime[n] )\
  \ primes.push_back(n);\n            for (int i = n * n; i < limit; i+= n) {\n  \
  \              is_prime[i] = false;\n            }\n            std::this_thread::sleep_for(\n\
  \                    chrono::milliseconds(100));\n        }\n    }\n    // 在事件循环中执行\n\
  \    void HandleOKCallback () {\n        Local<Array> results = New<Array>(primes.size());\n\
  \        for ( unsigned int i = 0; i < primes.size(); i++ ) {\n            Nan::Set(results,\
  \ i, New<v8::Number>(primes[i]));\n        } \n        Local<Value> argv[] = { results\
  \ };\n        callback->Call(1, argv);\n    } \n\n    void HandleProgressCallback(const\
  \ char *data, size_t size) {\n        // 必须的，这个不会自动创建\n        Nan::HandleScope\
  \ scope; \n\n        Local<Value> argv[] = {\n            New<v8::Number>(*reinterpret_cast<double*>(\n\
  \                const_cast<char*>(data)))\n        };\n        progress->Call(1,\
  \ argv);\n    }\n    private:\n    Callback *progress;\n    int limit;\n    vector<int>\
  \ primes;\n};\n```\n\n有一个奇怪的特性，与 `HandleOKCallback` 不同，在 `HandleProgressCallback`\
  \ 被调用之前，系统不会为我们自动创建 `HandleScope` —— 因此，在我们分配新的 V8 内存之前，由我们负责创建一个。注意，`AsyncProgressWorker`\
  \ 处理“进度更新”的方式是可覆盖的 —— 意味着每次记录进度消息时，它都会覆盖之前记录的那个。在我们上面的示例中，由于我们在 for 循环的每轮中等待了 100\
  \ 毫秒，你可能会看到屏幕上出现 0%、1%、2%... 100%。然而，如果我们移除这 100 毫秒的等待，你可能会惊讶地发现自己只看到了 100% 完成的消息\
  \ —— 而可能看不到其他任何进度更新。这是因为你每次调用 `SendProgress` 时，任务被被队到事件循环中（即调用 `HandleProgressCallback`\
  \ 的任务）。无法保证该任务会在你的工作线程发送另一个进度消息之前执行 —— 在我们的案例中，对于较小的 `N` 值，很可能在 `libuv` 真正调用 `HandleProgressCallback`\
  \ 之前，所有的进度更新都已经被记录了。\n\n对于进度更新，上述描述的行为是合理的，因为丢弃过时的进度更新并无害。然而，对于向 JavaScript 发送实际数据（如部分结果），这种功能是灾难性的！最终，`AsyncWorker`\
  \ 和 `AsyncProgressWorker` 真的只是示例，它们不应被视为我们能做到范围的代表。在第 7 章中，我们将看到进度更新的概念被扩展到提供插件与插件之间的流式接口。我们将利用额外的队列来确保任何“进度”消息都不会被覆盖，使我们的实现适用于发送真实数据。\n\
  \n顺带提一下，我们刚刚看到的质数示例也是附录 A 的主题，那里讨论了集成现有 C++ 代码的替代方法。\n\n## ObjectWrap\n\n在引入 NAN\
  \ 之前，我们讨论的 C++ 插件最后一个拼图是 `ObjectWrap`，它允许我们将完整的 C++ 类传递给 JavaScript，前提是必须为它们装饰了大量的\
  \ Node/V8 样板代码。这些 Node/V8 样板代码使我们容易版本问题的影响 —— 事实上，`ObjectWrap` API 在 Node.js 的多个版本中发生过变化。\n\
  \n幸运的是，学习使用“NAN”方式进行对象包装非常简单，因为第 5 章的讨论是基于较新版本的 Node.js（v4+），你会发现 NAN 的 `ObjectWrap`\
  \ 实现与我们已经学到的几乎相同。使用它而不是第 5 章中的 API，优势源于能够针对早期版本的 Node.js。\n\n读者不需要重复大量代码，应该回看第 5\
  \ 章中 `WrappedPoly` 的最终实现。你会注意到该类扩展了 `node::ObjectWrap`。要使用 NAN 的实现，只需扩展 `Nan::ObjectWrap`\
  \ 即可（当然，你必须包含 `nan.h`）。在迁移到 NAN 进行 ObjectWrap 时，你最终会做的多数更改源于典型的 NAN 变化（`New`、没有\
  \ `Isolate` 等），但也有一些针对 `Nan::ObjectWrap` 的特定变化。\n\n让我们来看第 5 章中的 `WrappedPoly` 类声明，并强调我们想要做的更改：\n\
  \n```cpp\nclass WrappedPoly : public node::ObjectWrap {\n public:\n  static void\
  \ Init(v8::Local<v8::Object> exports);\n\nprivate:\n  explicit WrappedPoly(double\
  \ a = 0, double b = 0, double c = 0)\n    : a_(a), b_(b), c_(c) {}\n  ~WrappedPoly()\
  \ {}\n\n  static void New(\n        const v8::FunctionCallbackInfo<v8::Value>& args)\
