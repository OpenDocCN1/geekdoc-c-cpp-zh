  \ \n[](#cb163-15)  ////////////////////////////////\n[](#cb163-16)  // 添加访问器 - get/set\n\
  [](#cb163-17)  /////////////////////////////// \n[](#cb163-18)  tpl->InstanceTemplate()->SetAccessor(\n\
  [](#cb163-19)      String::NewFromUtf8(isolate, \"c\"), GetC, SetC);\n[](#cb163-20)\n\
