  \  static NAN_GETTER(Coeff);\n  static NAN_SETTER(Coeff);\n\n  double a_;\n  double\
  \ b_;\n  double c_;\n};\n```\n\n\n\n\n在方法中，更改主要涉及 `Nan::New` 等类的操作，但在 `Init` 中存在一些有趣的变化。以下是第\
  \ 5 章中的原始实现：\n\n```cpp\nstatic void Init(v8::Local<v8::Object> exports) {\n    Isolate*\
