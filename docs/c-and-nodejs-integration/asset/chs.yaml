  \        ] \n[](#cb317-20)      ] \n[](#cb317-21)    }\n[](#cb317-22)  ]\n[](#cb317-23)}\n\
  ```\n\n在这个绑定文件中有几个新变化点。首先，注意这里没有 \"type\" 属性——默认情况下 node-gyp 构建的是 Node.js 插件——所以不需要指定任何内容。我定义目标为\
  \ `nodeprime`，构建的输出将是 `nodeprime.node`。除了指定构建文件和 primesieve 的包含目录外，我还将 Nan 添加到包含目录集中——利用了\
  \ node shell 命令。其余部分（conditions）与之前文章中的编译器设置相同。\n\n### 调用 JavaScript\n\n现在获取 100\
  \ 以内的质数，只需调用函数：\n\n```javascript\n[](#cb321-1)// 异步获取 100 以内的质数\n[](#cb321-2)nodeprime.getPrimes(100,\
  \ function (err, primes) {\n[](#cb321-3)       console.log(primes);\n[](#cb321-4)});\n\
  ```\n\n注意现在 `CalculatePrimes` 获取了两个参数 - under 和回调。我们将从 C++ 开始这里，因为我们需要获取回调的引用以便调用它：\n\
  \n```cpp\n[](#cb322-1)NAN_METHOD(CalculatePrimes) {\n[](#cb322-2)    int under =\
  \ To<int>(info[0]).FromJust();\n[](#cb322-3)    Callback *callback = new Callback(info[1].As<Function>());\n\
  [](#cb322-4)\n[](#cb322-5)    AsyncQueueWorker(new PrimeWorker(callback, under));\n\
  [](#cb322-6)}\n```\n\n现在让我们看看 `PrimeWorker` 类内部到底发生了什么。构造函数非常简单 - 最重要的是它用 JavaScript\
  \ 传的回调初始化了基类 `AsyncWorker`。`under` 值也保存在 `PrimeWorker` 中，用于存储质数结果的 `primes` vector\
  \ 已经过初始化。\n\n```cpp\n[](#cb323-1)PrimeWorker(Callback *callback, int under)\n[](#cb323-2)\
  \        : AsyncWorker(callback), under(under), primes(0) {}\n```\n\n\n\n这里与同步插件有一个很大不同——我们将质数保存在标准的\
  \ C++ `vector` 中，而不是直接保存到 V8 `Local Array` 中。这是因为质数是在工作线程中计算的，而不是在事件循环中。\n\n一旦我们从\
  \ `CalculatePrimes` 调用 `AsyncQueueWorker`，`libuv` 将将我们的 `PrimeWorker` 对象调度到工作线程并调用它的\
  \ `Execute` 方法——如下所示：\n\n```cpp\nvoid Execute () {\n  exchange x(\n    & {\n   \
  \   primes.push_back(*((int *) data));\n    }\n  );\n\n  generate_primes(under,\
  \ (void*)&x);\n}\n```\n\n这与 `CalculatePrimes` 的同步版本做的几乎完全一样——只是在工作线程中执行。一旦 `Execute`\
  \ 完成，`libuv` 将自动在事件循环中调用 `PrimeWorker` 的 `HandleOKCallback` 方法。\n\n```cpp\nvoid\
  \ HandleOKCallback () {\n  Nan:: HandleScope scope;\n\n  v8::Local<v8::Array> results\
  \ = New<v8::Array>(primes.size());\n  int i = 0;\n  for_each(primes.begin(), primes.end(),\n\
  \    & {\n      Nan::Set(results, i, New<v8::Number>(value));\n      i++;\n    });\n\
  \n  Local<Value> argv[] = { Null(), results };\n  callback->Call(2, argv);\n}\n\
  ```\n\n由于此方法实际上是在 Node 事件循环线程中调用的，我们可以分配一个返回给 JavaScript 的 V8 `Local Array`。我们创建一个作用域，初始化数组（这次大小是完全正确的，因为我们已经有了包含质数的\
  \ `vector`）。接下来，我们使用 `for_each` 来填充数组。\n\n最后一步是实际调用作为初始参数发送到我们插件的 JavaScript 回调。我们封装了一个表示参数的参数数组（第一个是\
  \ `Null`，因为没有错误，然后是数组）。最后执行回调并结束——此时控制权再次交回 JavaScript。\n\n你需要再次执行 `node-gyp configure\
  \ build` 来编译此模块，现在我们就可以从 Node.js 中调用它了。\n\n### 从 JavaScript 调用\n\n如上所示，现在我们只需要 `require`\
  \ 该模块即可：\n\n```javascript\nvar nodeprime = require(\"[relative path to code]\" +\
  \ \n  \"/cpp/nodeprime/build/Release/nodeprime\")\n```\n\n现在要获取 100 以下的质数，只需调用函数——传递一个在质数生成后会被调用的回调函数：\n\
  \n```javascript\nprimes.getPrimes(100, function (err, primes){\n  console.log(primes);});\n\
  ```\n\n### 整合这一切...\n\n好了……让我们把它应用到我们正在开发的 Web 应用中。我将向你展示异步版本，因为同步模型真的与 Web 端并不兼容。\n\
  \n在 `/web/index.js` 文件中，我们将添加另一个名为 `ffi` 的路由条目。\n\n```javascript\nvar types = [\n\
  \  {\n    title: \"pure_node\",\n    description: \"在 Node.js 中执行一个非常原始的 \" +\n\
  \      \"质数筛实现\"\n  },\n  //... 自动化和共享库的条目\n  {\n    title: \"addon\",\n    description:\
  \ \"创建一个可以像其他模块一样 \" +\n      \"被调用的 Node 插件。基于 /cpp/nodeprime\"\n  }\n];\n```\n\
  \n该 `types` 数组通过在 `web/routes/` 目录中查找与每个 `title` 属性同名的文件来创建路由：\n\n```javascript\n\
  types.forEach(function (type) {\n    app.use('/'+type.title, require('./routes/'\
  \ + type.title));\n});\n```\n\n现在我们在 `/web/routes/addon.js` 中添加我们的路由。相关的 POST 处理器如下，它看起来与我们已经过的代码非常相似：\n\
  \n```javascript\nrouter.post('/', function(req, res) {\n    var under = parseInt(req.body.under);\n\
  \    primes.getPrimes(under, function (err, primes) {\n        res.setHeader('Content-Type',\
  \ 'application/json');\n        res.end(JSON.stringify({\n            results: primes\n\
  \        }));\n    });\n    console.log(\"Primes generated using \" + type);\n});\n\
  ```\n\n启动 Web 应用（在 `/web` 执行 `node index`）并尝试 `addon` 链接。没有意外。\n\n# 附录 B - Buffers\n\
  \n本书第 2 章涵盖了在与 C++ 插件之间移动数据时使用典型的 JavaScript 数据类型。Node.js 引入了一种新的数据类型 `Buffer`，它在标准\
  \ JavaScript 中并不存在（尽管新版本的 JavaScript 现在有了类型数组，它们提供了许多相同的功能）。Node.js `Buffer` 对象用于表示原始二进制数据，类似于\
  \ C++ 数组（在本例中为整数数组）。当你处理 Node.js 文件 I/O 或 TCP 时，你很可能会与 `Buffer` 对象打交道。虽然将 `Buffer`\
  \ 对象转换为 JavaScript 字符串（通过指定整数数据的编码）很常见，但通常你可能希望直接对二进制数据进行操作。\n\n`Buffer` 对象是 C++\
  \ 插件开发中一个有趣的方面，首先它们实际上不是 V8 的部分——而是 Node.js 的部分。其次，`Buffer` 对象数据的独特之处在于它不是分配在 V8\
  \ 堆内部的的——这一属性允许我们在处理 C++ 插件和工作线程时跳过某些数据拷贝（这将在下文中讨论）。\n\n在本节中，我们将查看如何使用 `NAN` 在 C++\
  \ 插件之间传递 `Buffer` 对象。使用 `NAN` 是因为 `Buffer` 对象 API 实际上最近经历了一些重大变化，而 `NAN` 将保护我们免受这些问题的影响。我们将通过图像转换器的视角来看\
  \ `Buffer` 对象——专门将二进制 png 图像数据转换为位图格式的二进制数据。\n\n本节的所有代码都可以在 `nodecpp-demo` 仓库 [`github.com/freezer333/nodecpp-demo`](https://github.com/freezer333/nodecpp-demo)\
  \ 的 \"Buffers\" 部分完整找到。\n\n## 示例：PNG 和 BMP 图像处理\n\n通常，图像处理是指任何操作/转换图像的行为。当然，图像是一块二进制数据——在最基本的状态下，一个整数（或\
  \ 3 或 4）可以表示图像中的每个像素，这些整数可以存储在文件中或保存在连续分配的数组中。然而，图像数据通常以原始数据形式存储，而是被压缩/编码为 png、gif、bmp、jpeg\
  \ 等其他图像格式。\n\n图像处理是 C++ 插件的理想候选者，因为图像处理通常是耗时的、CPU 密集型的，而且某些处理技术具有 C++ 可以利用的并行性。对于我们现在查看的示例，我们将简单地将\
  \ png 格式的数据转换为 bmp 格式的数据。有很多现有的开源 C++ 库可以帮助我们完成此任务，我将使用 `LodePNG`，因为它没有依赖且非常简单。`LodePNG`\
  \ 可以在 [`lodev.org/lodepng/`](http://lodev.org/lodepng/) 找到，其源代码位于 [`github.com/lvandeve/lodepng`](https://github.com/lvandeve/lodepng)。非常感谢开发者\
  \ Lode Vandevenne 提供如此易用的库！\n\n## 设置插件\n\n对于此插件，我们将创建以下目录结构，包括从 [`github.com/lvandeve/lodepng`](https://github.com/lvandeve/lodepng)\
  \ 下载的源码，即 `lodepng.h` 和 `lodepng.cpp`。\n\n\n\n\n```\n/png2bmp\n | \n |--- binding.gyp\n\
  \ |--- package.json\n |--- png2bmp.cpp  # 插件\n |--- index.js     # 测试插件的程序\n |---\
  \ sample.png   # 输入（将转换为 bmp）\n |--- lodepng.h    # 源自 lodepng 分发版\n |--- lodepng.cpp\
  \  # 源自 loadpng 分发版\n```\n\n要下载完整的插件，请访问 [`github.com/freezer333/nodecpp-demo`](https://github.com/freezer333/nodecpp-demo)，这个特定的示例位于\
  \ `buffers` 目录中。\n\n`lodepng.cpp` 包含了进行图像处理所需全部代码，我将不会详细讨论它的工作原理。此外，lodepng 分发版包含示例代码，允许你专门在\
  \ png 和 bmp 之间进行转换——我对其进行了微调，并将其放入插件源码文件 `png2bmp.cpp` 中，稍后我们将查看它。在深入插件代码本身之前，让我们先看看实际的\
  \ JavaScript 程序是什么：\n\n```javascript\n'use strict';\nconst fs = require('fs');\n\
  const path = require('path');\nconst png2bmp = require('./build/Release/png2bmp');\n\
  var png_file = process.argv[2];\nvar bmp_file = path.basename(png_file, '.png')\
  \ + \".bmp\";\nvar png_buffer = fs.readFileSync(png_file);\n\npng2bmp.saveBMP(bmp_file,\
  \ png_buffer, png_buffer.length);\n```\n\n该程序只需要 `fs`、`path` 和我们的插件，插件将位于 `./build/Releast/png2bmp`。该程序从命令行参数中获取输入\
  \ (png) 文件名，并将 png 读取到 `Buffer` 中。然后，它将 `Buffer` 发送到插件中，插件将转换后的 BMP 保存到指定的文件名。因此，插件将\
  \ png 转换为 BMP 并结果保存到文件中——不返回任何内容。\n\n这里是 `package.json`，它设置了 `npm start` 来调用带有命令行参数\
  \ `sample.png` 的 `index.js` 程序。这是一个通用的图像：\n\n```json\n{\n  \"name\": \"png2bmp\"\
  ,\n  \"version\": \"0.0.1\",\n  \"private\": true,\n  \"gypfile\": true,\n  \"scripts\"\
  : {\n    \"start\": \"node index.js sample.png\"\n  },\n  \"dependencies\": {\n\
  \    \"nan\": \"*\"\n  }\n}\n```\n\n![sample.png](img/file8.png)\n\nsample.png\n\
  \n最后，让我们来看下 `binding.gyp` 文件——除了包含编译 lodepng 需要的几个编译器标志外，它是相当标准的。它还包含了对 NAN 的必要引用。\n\
  \n```json\n{\n  \"targets\": [\n    {\n      \"target_name\": \"png2bmp\",\n   \
  \   \"sources\": [ \"png2bmp.cpp\", \"lodepng.cpp\" ], \n      \"cflags\": [\"-Wall\"\
  , \"-Wextra\", \"-pedantic\", \"-ansi\", \"-O3\"],\n      \"include_dirs\" : [\"\
  <!(node -e \\\"require('nan')\")\"]\n    }\n  ]\n}\n```\n\n`png2bmp.cpp` 将大部分包含\
  \ V8/NAN 代码，但它确实有一个图像处理工具函数——`do_convert`，适配自 lodepng 的 png 到 bmp 示例代码。该函数接受一个包含输入数据（png\
  \ 格式）的 `vector<unsigned char>` 和一个用于存放输出（bmp 格式）数据的 `vector<unsigned char>`。该函数反过来调用\
  \ `encodeBMP`，它直接源自 lodepng 示例。这里是这两个函数的完整代码列表。这些细节对于理解插件的 `Buffer` 对象并不重要，但为了完整性包含在此处。我们的插件入口点将调用\
  \ `do_convert`。\n\n```cpp\n/*\n此文件中的所有 LodePNG 代码均适配自 lodepng 的 \n示例，位于以下 URL：\n\
  https://github.com/lvandeve/lodepng/blob/\nmaster/examples/example_bmp2png.cpp'\n\
  */\n\nvoid encodeBMP(std::vector<unsigned char>& bmp, \n  const unsigned char* image,\
  \ int w, int h)\n{\n  // 输入和输出均每个像素使用 3 字节。\n  int inputChannels = 3;\n  int outputChannels\
  \ = 3;\n \n  // 字节 0-13\n  bmp.push_back('B'); bmp.push_back('M'); //0: bfType\n\
  \  bmp.push_back(0); bmp.push_back(0); \n  bmp.push_back(0); bmp.push_back(0); \n\
  \  bmp.push_back(0); bmp.push_back(0); //6: bfReserved1\n  bmp.push_back(0); bmp.push_back(0);\
  \ //8: bfReserved2\n  bmp.push_back(54 % 256); \n  bmp.push_back(54 / 256); \n \
  \ bmp.push_back(0); bmp.push_back(0); \n  \n  // 字节 14-53\n  bmp.push_back(40);\
  \ bmp.push_back(0); \n  bmp.push_back(0); bmp.push_back(0);  //14: biSize\n  bmp.push_back(w\
  \ % 256); \n  bmp.push_back(w / 256); \n  bmp.push_back(0); bmp.push_back(0); //18:\
  \ biWidth\n  bmp.push_back(h % 256); \n  bmp.push_back(h / 256); \n  bmp.push_back(0);\
  \ bmp.push_back(0); //22: biHeight\n  bmp.push_back(1); bmp.push_back(0); //26:\
  \ biPlanes\n  bmp.push_back(outputChannels * 8); \n  bmp.push_back(0); //28: biBitCount\n\
  \  bmp.push_back(0); bmp.push_back(0); //30: biCompression\n  bmp.push_back(0);\
  \ bmp.push_back(0); //34: biSize\n  bmp.push_back(0); bmp.push_back(0); //34\n \
  \ bmp.push_back(0); bmp.push_back(0); //38: biYPelsMeter\n  bmp.push_back(0); bmp.push_back(0);\
  \ //42: biYPelsMeter\n  bmp.push_back(0); bmp.push_back(0); //46: biClr\n  bmp.push_back(0);\
  \ bmp.push_back(0); //50: biClrImportant\n  int imagerow = outputChannels * w;\n\
  \  imagerow % 4 == 0 ? imagerow : imagerow + (4 - imagerow % 4);\n  for(int y =\
  \ h - 1; y >= 0; y--)\n  {\n    int c = 0;\n    for(int x = 0; x < imagerow; x++)\n\
  \    {\n      if(x < w * outputChannels)\n      {\n        int inc = c;//将 RGB 转换为\
  \ BGR\n        if(c == 0) inc = 2;\n        else if(c == 2) inc = 0;\n        bmp.push_back(image[inputChannels\
  \ * (y * w + x) + inc]);\n      else bmp.push_back(0);\n      c++;\n      if(c >=\
  \ outputChannels) c = 0;\n    }\n  }\n  // 填充大小\n  bmp[2] = bmp.size() % 256;\n\
  \  bmp[3] = (bmp.size() / 256) % 256;\n  bmp[4] = (bmp.size() / 65536) % 256;\n\
  \  bmp[5] = bmp.size() / 16777216;\n}\n\nbool do_convert(\n  std::vector<unsigned\
  \ char> & input_data, \n  std::vector<unsigned char> & bmp)\n{\n  std::vector<unsigned\
  \ char> image; // 原始像素\n  unsigned width, height;\n  unsigned error = lodepng::decode(image,\
  \ width, \n    height, input_data, LCT_RGB, 8);\n  if(error) {\n    std::cout <<\
  \ \"error \" << error << \": \" \n              << lodepng_error_text(error) \n\
  \              << std::endl;\n    return false;\n  }\n  encodeBMP(bmp, &image[0],\
  \ width, height);\n  return true;\n}\n```\n\n\n\n\n\n抱歉……那个列表确实很长，但看到实际上发生了什么非常重要！让我们开始将所有这些代码桥接到\
  \ JavaScript 吧。\n\n## 向插件（addon）传递缓冲区\n\n我们的第一个任务是创建 `saveBMP` 插件函数，它接受一个文件名（目标\
  \ BMP）以及 png 数据。png 图像数据实际上是在 JavaScript 中读取的，因此它是以 Node.js `Buffer` 的形式传递的。第一个需要识别的规则是：`Buffer`\
  \ 是 V8 未知的，它是 Node.js 的一种构造。我们将使用 `NAN` 来访问缓冲区本身（并在稍后用于创建新的 `Buffer` 对象）。每当 `Buffer`\
  \ 对象传递给 C++ 插件时，都有必要将其长度作为一个额外的参数指定出来，因为从 C++ 很难确定 `Buffer` 的实际数据长度。\n\n让我们在 `NAN`\
  \ 中设置第一次函数调用：\n\n```\n[](#cb335-1)\n[](#cb335-2)NAN_METHOD(SaveBMP) {\n[](#cb335-3)\
  \    v8::String::Utf8Value val(info[0]->ToString());\n[](#cb335-4)    std::string\
  \ outfile (*val);\n[](#cb335-5) \n[](#cb335-6)    ....\n[](#cb335-7)}\n[](#cb335-8)\n\
  [](#cb335-9)NAN_MODULE_INIT(Init) {\n[](#cb335-10)   Nan::Set(target, \n[](#cb335-11)\
  \    New<String>(\"saveBMP\").ToLocalChecked(),\n[](#cb335-12)    GetFunction(New<FunctionTemplate>(SaveBMP))\n\
  [](#cb335-13)      .ToLocalChecked());\n[](#cb335-14)}\n[](#cb335-15)\n[](#cb335-16)NODE_MODULE(basic_nan,\
  \ Init)\n```\n\n在 `SaveBMP` 中，我们做的第一步是简单提取输出文件名。接下来，我们必须提取二进制数据（这将由 `unsigned char`\
  \ 数据表示）。\n\n```\n[](#cb336-1)unsigned char* buffer = \n[](#cb336-2)  (unsigned char*)\
  \ node::Buffer::Data(info[1]->ToObject());\n[](#cb336-3)\n[](#cb336-4)unsigned int\
  \ size = info[2]->Uint32Value();\n```\n\n注意这有多么简单……Node.js 在 `Buffer` 类上提供了一个静态\
  \ `Data` 方法，它接受一个标准的 `v8::Object` 句柄并返回指向底层数据的 `unsigned char` 指针。这个指针**并没有**指向由\
  \ V8 管理的数据——它在普通的 C++ 堆上，并且可以像普通内存那样进行处理。我们还从插件函数的第三个参数中提取了大小。\n\n在 C++ 中，我们通常更倾向于处理\
  \ STL 容器而不是原始内存数组，因此我们可以轻松地从这个指针创建一个 `vector` —— 为了调用 `do_convert`，我们必须这样做。下面是完整的代码列表——它将缓冲区的数据指针转换为\
  \ `vector`，调用 `do_convert`（该函数通过其魔魔法将 bmp 数据填充到我们提供的 vector 中），并最后将其保存到指定的输出文件中（使用\
  \ `lodepng` 工具调用 - `save_file`）。\n\n```\n[](#cb337-1)NAN_METHOD(SaveBMP) {\n[](#cb337-2)\
  \  v8::String::Utf8Value val(info[0]->ToString());\n[](#cb337-3)  std::string outfile\
  \ (*val);\n[](#cb337-4) \n[](#cb337-5)  // 将 Node.js Buffer 转换为 C++ Vector\n[](#cb337-6)\
  \  unsigned char*buffer = \n[](#cb337-7)    (unsigned char*) node::Buffer::Data(info[1]->ToObject());\n\
  [](#cb337-8)\n[](#cb337-9)  unsigned int size = info[2]->Uint32Value();\n[](#cb337-10)\
  \  std::vector<unsigned char> png_data(buffer, buffer + size);\n[](#cb337-11)\n\
  [](#cb337-12)  // 转换为 bmp，存储在另一个 vector 中。 \n[](#cb337-13)  std::vector<unsigned\
  \ char> bmp; \n[](#cb337-14)  if ( do_convert(png_data, bmp)) {\n[](#cb337-15) \
  \     info.GetReturnValue().Set(Nan::New(false)); \n[](#cb337-16)  }\n[](#cb337-17)\
  \  else {\n[](#cb337-18)      lodepng::save_file(bmp, outfile); \n[](#cb337-19)\
  \      info.GetReturnValue().Set(Nan::New(true));\n[](#cb337-20)  }\n```\n\n通过执行\
  \ `npm install` 然后 `npm start` 来运行此程序，你会看到生成了一个 `sample.bmp`，它看起来和 `sample.png`\
  \ 极其相似，只是体积要大得多（bmp 的压缩效率远低于 png）。\n\n## 从插件返回缓冲区\n\n如果我们直接返回位图图像数据，而不是在 C++ 内部将其保存为文件，这个插件将会灵活得多。要做到这一点，我们必须学习如何返回\
  \ `Buffer` 对象。这个概念在表面上似乎足够简单——你可以查看 NAN 网站上的示例，看看如何在 C++ 中创建新的 `Buffer` 并将其返回给 JavaScript。然而，仔细观察会发现有些我们必须小心的问题，我们将在这里解决它们。\n\
  \n让我们创建一个新的插件入口点 - `getBMP`，它将像这样从 JavaScript 中调用：\n\n```\n[](#cb338-1)...\n[](#cb338-2)var\
  \ png_buffer = fs.readFileSync(png_file);\n[](#cb338-3)\n[](#cb338-4)bmp_buffer\
  \ = png2bmp.getBMP(png_buffer, png_buffer.length);\n[](#cb338-5)fs.writeFileSync(bmp_file,\
  \ bmp_buffer); \n```\n\n在原始的 C++ 函数中，我们调用了 `do_convert`，它将位图数据放入 `vector<unsigned\
  \ int>` 中并将其写入文件。现在我们必须通过构造一个新的 `Buffer` 对象来*返回*这些数据。NAN 的 `NewBuffer` 调用在这里恰恰地起到了作用——让我们看看插件函数的初版草稿：\n\
  \n```\n[](#cb339-1)\n[](#cb339-2)void buffer_delete_callback(char* data, void* hint)\
  \ {\n[](#cb339-3)    free(data);\n[](#cb339-4)}\n[](#cb339-5)\n[](#cb339-6)NAN_METHOD(GetBMP)\
  \ {\n[](#cb339-7)  unsigned char*buffer = \n[](#cb339-8)    (unsigned char*) node::Buffer::Data(info[0]->ToObject());\n\
  [](#cb339-9)\n[](#cb339-10)  unsigned int size = info[1]->Uint32Value();\n[](#cb339-11)\
  \ \n[](#cb339-12)  std::vector<unsigned char> png_data(buffer, buffer + size);\n\
  [](#cb339-13)  std::vector<unsigned char> bmp = vector<unsigned char>();\n[](#cb339-14)\
  \ \n[](#cb339-15)  if ( do_convert(png_data, bmp)) {\n[](#cb339-16)      info.GetReturnValue().Set(\n\
  [](#cb339-17)          NewBuffer((char *)bmp.data(), \n[](#cb339-18)           \
  \ bmp.size(), buffer_delete_callback, 0)\n[](#cb339-19)            .ToLocalChecked());\n\
  [](#cb339-20)    }\n[](#cb339-21)} \n```\n\n上面的代码示例遵循了大多数在线教程所倡导的方法。我们调用 `NewBuffer`\
  \ 并传入一个 char *（我们通过 `data` 方法从 `bmp` vector 中获取）、我们创建缓冲区时涉及的内存大小，以及另外两个可能会引起你好奇的额外参数。`NewBuffer`\
  \ 的第三个参数是一个回调——当你创建的 `Buffer` 被 V8 回收时会被调用。记住，`Buffer` 是 JavaScript 对象，其数据存储在 V8\
  \ 外部，但对象本身受 V8 控制。从这个角度来看，有一个回调应该是用的——当 V8 销毁缓冲区时，我们需要一种方法来释放我们创建的数据——这些数据作为第一个参数传递给回调。回调的签名由\
  \ NAN 定义——`Nan::FreeCallback()`。第二个参数是辅助释放的提示，我们可以根据需要使用它。它很快就会有用，但现在我们只传递空 (0)。\n\
  \n所以——*这段代码存在问题*：我们返回的缓冲区中包含的数据可能在 JavaScript 使用它之前就被删除了。为什么？如果你熟悉 C++，可能已经看到了问题：`bmp`\
  \ vector 在 `GetBMP` 函数返回时离开作用域。C++ vector 的语义规定，当 vector 离开作用域时，析构函数将删除 vector 内部所有数据——在这种情况下，就是我们的\
  \ bmp 数据！这是一个巨大的问题，因为我们发送回 JavaScript 的 `Buffer 将发现其底层数据被抽空。\n\n我们如何避免这个问题？一种方法是创建一个包含\
  \ `bmp` vector 数据*拷贝*的 `Buffer`。我们可以这样这样做：\n\n```\n[](#cb340-1)if ( do_convert(png_data,\
  \ bmp)) {\n[](#cb340-2)        info.GetReturnValue().Set(\n[](#cb340-3)        \
  \    CopyBuffer(\n[](#cb340-4)              (char *)bmp.data(), \n[](#cb340-5) \
  \             bmp.size()).ToLocalChecked());\n[](#cb340-6)}\n```\n\n\n\n\n这确实是安全的，但它涉及到创建数据的副本——这既慢又浪费内存……避免这一系列混乱的一种方法是不使用\
  \ `vector`，而是将位图数据存储在动态分配的 `char *` 数组中——但这会使位图转换代码变得非常复杂。幸运的是，解决这个问题的答案（让我们仍然可以使用\
  \ `vector`）由 `Nan::FreeCallback` 调用签名给出的——即 `hint` 参数。由于我们的问题是包含位图数据的 `vector` 会离开作用范围，我们可以转而*动态地*分配\
  \ `vector` 本身，并将其传递给释放回调函数，当 `Buffer` 被垃圾回收时，它可以被正确地删除。下面是完整的解决方案——请仔细注意，我们在回调中使用了\
  \ `hint` 参数，并且我们使用了动态分配（堆）的 `vector` 而不是栈上变量。\n\n```\nvoid buffer_delete_callback(char*\
  \ data, void* the_vector) {\n  delete reinterpret_cast<vector<unsigned char> *>\
  \ (the_vector);\n}\n\nNAN_METHOD(GetBMP) { \n  unsigned char*buffer = \n    (unsigned\
  \ char*) node::Buffer::Data(info[0]->ToObject());\n  unsigned int size = info[1]->Uint32Value();\
  \ \n\n  std::vector<unsigned char> png_data(buffer, buffer + size);\n\n  // 在堆上分配\
  \ vector，因为我们\n  // 正在根据它的数据构建一个 buffer\n  // 返回给 Node - 并且不希望让它\n  // 在 buffer\
  \ 离开作用范围之前离开作用范围（参见 buffer_delete_callback）。\n\n  std::vector<unsigned char> * bmp\
  \ = new vector<unsigned char>();\n\n  if ( do_convert(png_data, *bmp)) {\n     \
  \ info.GetReturnValue().Set(\n          NewBuffer((char *)bmp->data(), \n      \
  \      bmp->size(), buffer_delete_callback, bmp)\n            .ToLocalChecked());\n\
  \  }\n}\n```\n\n当运行运行该程序时，JavaScript 现在可以安全地操作返回的 `Buffer`，而无需担心 `vector` 删除了内存。\n\
  \n## 将 Buffer 作为工作线程拷贝问题的解决方案\n\n阅读上面的章节时，你可能会想起第 4 章中关于 V8 内存和工作线程的讨论。在使用异步插件时，我们遇到了一个重大问题，即为执行异步工作而创建的\
  \ C++ 线程*无法*直接访问 V8 数据。除了在 C++ 堆空间中创建数据的副本外，这个问题没有真正的解决方案。对于很多插件来说，这是没问题的——正如当时所建议的，当在\
  \ JavaScript 和 C++ 之间移动大量数据时，这是一个真正的问题。现在我们得以窥一个可能的解决方案——将数据分配为 `Buffer` 对象！\n\n\
  让我们开发一个 png 到位图转换器的异步版本。我们将使用 `Nan::AsyncWorker` 在 C++ 工作线程中执行实际转换。然而，通过使用 `Buffer`\
  \ 对象，我们不再需要创建 png 数据的副本——我们只需要持有指向底层数据的指针，以便我们的工作线程可以访问它。同样，工作线程产生的数据（`bmp` `vector`\
  \ 可以用来创建 `Buffer`，因为我们在本书中已经处理过很多 `AsyncWorker` 了，我直接向你展示代码——它非常简单：\n\n```cpp\n\
  class PngBmpWorker : public AsyncWorker {\npublic:\n    PngBmpWorker(Callback callback,\
  \ v8::Local<v8::Object> pngBuffer, int size)\n        : AsyncWorker(callback) {\n\
  \        unsigned char*buffer =\n          (unsigned char*) node::Buffer::Data(pngBuffer);\n\
  \        std::vector<unsigned char> tmp(\n          buffer, \n          buffer +\
  \ size);\n        png_data = tmp;\n    }\n    void Execute() {\n        bmp = new\
  \ vector<unsigned char>();\n        do_convert(png_data, *bmp);\n    }\n    void\
  \ HandleOK() {\n        v8::Local<v8::Object> bmpData =\n            NewBuffer((char\
  \ *)bmp->data(), \n              bmp->size(), buffer_delete_callback, bmp)\n   \
  \         .ToLocalChecked();\n        v8::Local<v8::Value> argv[] = { bmpData };\n\
  \        callback(argv);\n    }\nprivate:\n    vector<unsigned char> png_data;\n\
  \    std::vector<unsigned char> * bmp;\n};\n\nNAN_METHOD(GetBMP) { \n    int size\
  \ = To<int>(info[1]).FromJust();\n    v8::Local<v8::Object> pngBuffer =\n      \
  \  info[0]->ToObject();\n    Callback *callback = info[2].As<Function>();\n    new\
  \ PngBmpWorker(callback, pngBuffer, size);\n}\n```\n\n现在我们有一个异步函数来获取位图数据——无需任何拷贝。\n\
  \n```javascript\npng2bmp.getBMPAsync(png_buffer, length, function(bmp_buffer) {\n\
  \  fs.writeFileSync(bmp_file, bmp_buffer);\n});\n```\n\n* *\n\n1.  从 png 转换为 bmp*并不是*特别耗时，对于一个插件来说可能大材小用——但为了演示目的这很有处。如果你在寻找纯\
  \ JavaScript 实现的图像处理（包括比 png 转 bmp 多的多的功能），请查看 [`www.npmjs.com/jimp`](https://www.npmjs.com/jimp)\
  \ 中的 JIMP。\n\n# 结语\n\n我真的希望你从书中中学到了有用的知识。我很享受编写这本书，并期待看到 Node 和 C++ 插件未来如何演进。\n\n\
  V8 运行时正在不断演进，书中还有许多我没有触及的重要功能，例如对异常的支持、可能还有类型、承诺、类型数组等。不过，Node.js 并不一定绑定到 V8——虽然它仍在进行中，但\
  \ [Node-Chakra](https://github.com/nodejs/node-chakracore) 允许 Node.js 在 Microsoft\
  \ Edge 的 JavaScript 引擎上运行。使用不同的引擎将使 NAN 这样的项目变得更加重要，因为如果你希望被广泛采用，原生目标仅为 V8 将变得几乎是不可能的。\n\
