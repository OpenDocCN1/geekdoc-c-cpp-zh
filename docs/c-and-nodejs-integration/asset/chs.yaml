  \ 中操作属性时，我们将看到正确的结果。当我们打印对象时，还能看到 `Polynomial` 对象内部的实际属性。\n\n```\n[](#cb166-1)var\
  \ poly = new Polynomial(1, 3, 2);\n[](#cb166-2)console.log(poly.at(4)) // 打印 30\n\
  [](#cb166-3)\n[](#cb166-4)poly.c = 0; // 无错误\n[](#cb166-5)\n[](#cb166-6)// 应该打印\
