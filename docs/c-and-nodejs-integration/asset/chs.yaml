  \n## 添加属性（访问器/修改器）\n\n在 JavaScript 中没有私有成员变量的概念，对象只有属性。尽管如此，以下 JavaScript 代码在“原样”使用我们的插件时会产生奇怪的结果：\n\
  \n```\n[](#cb162-1)var poly = new Polynomial(1, 3, 2);\n[](#cb162-2)console.log(poly.at(4))\
  \ // 打印 30\n[](#cb162-3)\n[](#cb162-4)poly.c = 0; // 无错误\n[](#cb162-5)\n[](#cb162-6)//\
  \ 应该打印 28，但打印了 30！\n[](#cb162-7)console.log(poly.at(4)) \n[](#cb162-8)\n[](#cb162-9)console.log(poly);\n\
  ```\n\n奇怪的地方在于，设置 `poly.c`（理论上）应该让多项式的求值为 28 —— 然而插件仍然报告为 30。原因可能是显而易见的：我们没有在 `Polynomial`\
  \ 返回的 JavaScript 对象中的 `c` 与隐藏在其背后的 `WrappedPoly` 实例内部成员变量 `c_` 之间建立任何桥梁。坦率地说，可以通过在我们创建\
  \ `Polynomial` 构造函数时使用的 `ObjectTemplate` 上设置访问器来修复此。我们通过再次访问 `Init` 来实现：\n\n```\n\
  [](#cb163-1)static void Init(v8::Local<v8::Object> exports) {\n[](#cb163-2)  Isolate*\
  \ isolate = exports->GetIsolate();\n[](#cb163-3)\n[](#cb163-4)  // 构造函数模板\n[](#cb163-5)\
  \  Local<FunctionTemplate> tpl = \n[](#cb163-6)    FunctionTemplate::New(isolate,\
  \ New);\n[](#cb163-7)\n[](#cb163-8)  tpl->SetClassName(\n[](#cb163-9)        String::NewFromUtf8(isolate,\
