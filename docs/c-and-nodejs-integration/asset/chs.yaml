  \ `WrappedPoly` 实例内部成员变量 `c_` 之间建立任何桥梁。坦率地说，可以通过在我们创建 `Polynomial` 构造函数时使用的 `ObjectTemplate`\
  \ 上设置访问器来修复此。我们通过再次访问 `Init` 来实现：\n\n`GetC` 和 `SetC` 的签名比标准插件函数多出参数，定义在当属性被访问或修改时：\n\
