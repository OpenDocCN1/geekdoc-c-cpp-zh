  \  Isolate* isolate = args.GetIsolate();\n[](#cb164-5)  WrappedPoly* poly = ObjectWrap::Unwrap<WrappedPoly>(args.Holder());\n\
  [](#cb164-6)  args.GetReturnValue().Set(Number::New(isolate, poly->c_));\n[](#cb164-7)}\n\
