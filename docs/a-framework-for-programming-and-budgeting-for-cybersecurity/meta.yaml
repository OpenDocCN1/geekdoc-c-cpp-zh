  mdcn: "\n\n# 第三环：暴露 → 减少网络化机器的数量\n\n虽然确定了四项构成最小化不必要暴露的子行动，但仅针对其中一项确定了更具体的行动：减少网络化机器的数量。该行动的子项目列举如下：\n\
    \n- 暴露减少网络化机器的数量 → 减少可寻址机器的数量：我们区分两类机器：一类是因为连接到可以直接寻址的机器而被访问的机器（例如连接在个人电脑上的打印机），另一类是因为其可以直接寻址而被访问的机器（例如具有互联网协议\
    \ [IP] 的网络打印机）。尽管间接可寻址机器仍然面临风险（例如，计算机可能通过网络攻击被破坏，从而被命令向打印机发送有害指令，导致打印机损坏），但移除直接寻址可以减少打印机被攻击的途径（即其攻击面）。\n\
    - 暴露减少网络化机器的数量 → 确定哪些系统应该隔离：这是一项分析性功能，需要在风险与不允许网络机器或外部世界访问系统所带来的成本和不便之间进行权衡。需要进一步分析以确定虚拟隔离（例如加密隔离，允许通过其他网络建立通信链路）与物理隔离之间的权衡，以及间歇访问（例如通过可移动介质）或射频访问的策略（从而理解需要守卫多大的物理边界）。\n\
    - 暴露减少网络化机器的数量 → 根据此项决定对系统进行隔离：在许多情况下，这涉及到断开之前连接的系统（或对之前未加密的进行加密等）。\n- 暴露减少网络化机器的数量\
    \ → 测试隔离：许多组织错误地认为自己的系统是隔离的，要么是因为他们没有彻底理解隔离的含义，要么是因为存在未记录的连接导致它们可以被访问。确保隔离需要对潜在的访问方法进行反复测试，以确定隔离程度符合隔离策略。Shodan\
    \ (www.shodan.com) 就是实现此目的工具之一。\n- 测试隔离的工具：前提是获取和/或开发测试隔离的工具。组织可以决定购买或不，但如果必须开发工具，通常由外部供应商来完成；此类开发必须得到政府研发和/或采购政策的鼓励。\n\
    \n请注意，上述关于开发的陈述适用于任何能力的开发，对于下文的能力将不再显式重复。\n\n# 第三环：中和攻击 → 减少网络攻击尝试的次数\n\n如图所示，有十项行动属于中和攻击这一总行动。所有行动都有其子行动。减少黑客的数量涉及三项子行动：\n\
    \n- *中和攻击 → 减少网络攻击尝试的次数 → 减少黑客的数量* 此项行动假设，能够黑客的人越少，来自黑客的威胁就越低。可以通过两种方式使黑客失效：\n\
    \    - *为潜在黑客寻找工作*，特别是（但不限于）网络安全领域，可以满足许多黑客的收入和心理需求，并可能减少他们的非法黑客行为。例如，冷战后，西方试图雇佣苏联科学家以防止后者作乱（特别是让他们远离潜在的核国家）。替代性工作的效率仍有待观察，潜在的雇主必须小心，不要因雇佣他们而使自己陷入风险。\n\
    \    - *起诉网络犯罪*：通过起诉获得的限制手段（DHS 蓝图能力 1.2）包括监禁、替代性机构化或具有足够限制性的假释。起诉本身也有其副作用。这项行动影响（并因此是）“减少黑客数量”和“减少黑客动机”的子项。\n\
    \    - *调查网络犯罪*：网络犯罪的调查（DHS 蓝图能力 4.4）目前由 FBI、美国秘密警局以及某些情况下由州和地方官员执行。它涉及常用的执法方法并有几个前提：\n\
    \        - *寻找合格的调查员*在很大程度上是寻找和培训合适人员的问题。\n        - *开发调查工具*在很大程度上取决于由政府或其供应商开发（私营部门对为了表征攻击及其如何逃避组织防御的取证有一定兴趣，但对身份溯源的兴趣较小）。\n\
    \        - *收集计算机取证*，反过来取决于说服系统所有者允许从其系统中收集证据。在美国，说服更容易，因为组织日益意识到它们在黑客攻击中面临的风险（FBI\
    \ 如果有线索，可以出具传票获取证据，在目标不配合时汇合案件会更困难，而且 FBI 拥有大量未积压的网络犯罪案件，因此他们有权选择起诉哪一个）。然而，在海外，合作的可能性较小，在俄罗斯或中国等地方极不可能。\n\
    \n- *捕获黑客*：一旦黑客通过姓名（而非在线代号）被识别，在美国捕获黑客是直接的，但在大多数国家困难得多，在俄罗斯或中国则是不可能的（媒体引用的中没有人认为\
    \ 2014 年 5 月被美国起诉的少数人民解放军成员会出现在美国法庭上）。因此，前提是说服其他国家允许其公民因网络犯罪受到制裁。\n\n- *中和攻击 →\
    \ 减少网络攻击尝试的次数 减少反击动机*：该行动旨在通过增加与黑客相关的风险，对黑客的“去/留”决策产生影响（减少黑客收益通常是为降低被攻击或可能被攻击组织的成本而所做努力的副作用）。与此行动相关的前提包括：\n\
    \    - 执行网络犯罪：上文已涵盖。\n    - 在黑客中培养伦理，这可能是加入伦理课（特别是高中，以及计算机专业的大学课程）所想要达到的。\n  \
    \  - 让黑客的系统面临风险是“反击攻击”（hack-backs）的动机之一（尽管它也可以用于起诉）。反击攻击的概念是，如果黑客——至少是他们的成员——因为黑客行为而面临风险，他们中的一些人（特别是那些不严重的）将重新计算黑客的成本效益，从而放弃。首席安全官（CSO）授权此类活动更合理的动机是减少黑客对较危险潜在目标的注意力。没有组织承认进行反击攻击，但有传言组织仍在这样做。\n\
    \    - 编写便利反击的法律使得“让黑客系统面临风险”的总行动成为可能。\n    - 针对犯罪/网络犯罪市场采取行动：网络犯罪市场创建了黑客购买工具和出售工具而无需获取计算机知识的通道。此行动承认了这些市场和通道的增长并对其采取行动。\n\
    \n- *中和攻击 → 减少网络攻击尝试的次数 发现后先发攻击*：在发现后先发攻击假设攻击信号足够足以允许其被中断。这通常是政府的功能，因为其拥有情报能力，尽管一些私营组织也承担部分工作。\n\
    \n"
