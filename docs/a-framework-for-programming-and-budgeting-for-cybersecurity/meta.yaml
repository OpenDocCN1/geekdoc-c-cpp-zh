    +   * Harvesting data from firewall logs should continuously maintain and improve
    the fidelity of the firewall by ensuring that signatures stay current. This information
    can be shared with others, or traded for comparable signatures.


    +   * Establishing a watch data center, such as the National Cybersecurity and
    Communications Integration Center, is an important component in any intrusion
    detection system (IDS/IPS) insofar as it provides human oversight, an ability
    to do deeper forensics on malware detected in the firewall, and a defense against
    attacks from botnets (a DDoS attack) that cannot be simply handled by dropping
    (or “black-holing”) traffic.This is DHS Blueprint capability 4.1.


    +   * The ability to suspect incoming traffic help protect the network, inform
    users why their incoming traffic (e.g., suspect email attachments, malware-laden-
    webs) will not be coming, and provide samples for later analysis.


    +   * Administer correctly: IDS/IPS systems need ad administration. One of the
    primary faults of traditional firewalls is that they can fail if the policy for
    how to administer them is a poor guide for what or should not be let through,
    or if good policy is not well implemented in code and/or instructions.¹


    +   * Block traffic from certain sites: This is part and parcel of firewall management.
    Among other techniques, it uses the list of suspect IP addresses to ensure that
    no incoming traffic from these addresses reaches within the organization.


    +   * Put as many systems between firewalls as possible: This action appears elementary,
    but if one starts with disparate sets of systems that emerged organically, getting
    their traffic routed through a limited number of access points is not trivial
    (it also requires that firewalls be built with enough capacity to handle line
    input with the inevitable growth of network traffic). This action has two prerequisites:


    +   * Improve configuration management: The point of improving configuration management
    is to determine whether or not a particular machine is within the confines of
    the IDS/IPS system, although it has other purposes, as noted above (e.g., to determine
    whether systems are fully patched).


    +   * Invest in host software: Investing in host-based software is also necessary
    for configuration management to work. The host software²² sits on the managed
    devices and talks to the various pieces of network, notably configuration, management
    software.


