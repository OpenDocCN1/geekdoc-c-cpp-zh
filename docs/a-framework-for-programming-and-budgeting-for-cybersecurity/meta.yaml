  md: 'Generate rapid response plans: To respond, it helps to have a plan; to respond
    quickly, it helps to have a plan that mobilizes activity expeditiously. This action
    reflects an expectation that a rapid response plan can be written down, promulgated,
    and assessed by outsiders.


    Increase competence: this is the personnel management part of response. It entails
    having competent people with a combination of the required decision authority
    and sufficient knowledge and training.


    Build the ability to restore systems: The ability to recover a system is a function,
    in part, of the ability to restore a system to its previous configuration (whatever
    features are necessary to forestall a rapid disaster). Just as systems can be
    built so that repair is, alternatively, easier or harder (e.g., are the spark
    plugs accessible?), systems can be built for faster or slower restoration. Install
    systems to detect attacks quickly: This recovery method is specific to cyberattacks
    (as opposed to it proceeds deliberately, or at least diffuses at probabilistic
    rates), the faster it can be detected (under the assumption that it proceeds deliberately,
    or at least diffuses at probabilistic rates), the faster stopped, with correspondingly
    less damage to the availability of or to systems themselves. Note that this is
    a particular case of a specific capability that could also support a ring-zero
    objective of reducing the frequency and consequences of cyberattack.


    Develop methods to rapidly isolate infected systems: This specific capability
    assumes that the attack in question has been detected. Given the detection and
    sufficient characterization of attacks that proceeded non-instantaneously, methods
    that allow decoupling permit fault isolation, which in turn limits the damaged
    baseline from which recovery proceeds.


    Clean out malware from the system: A critical aspect of the recovery phase (again,
    specific to cyberattack) is to ensure that whatever took down the systems is not
    present in the network to repeat the performance. The clean-out phase can sometimes
    last longer than the time required to recover functionality systematically, but
    it often entails reduced performance in the interim because network connections
    are limited to ensure against re-infection during cleanup.'
