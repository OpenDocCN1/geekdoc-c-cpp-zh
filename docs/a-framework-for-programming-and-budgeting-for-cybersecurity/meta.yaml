  md: '# Applying the Model to Broader IT Compliance Efforts


    An additional benefit of this model may be found in other domains involving IT
    policy compliance that is not necessarily cybersecurity-based. For example, Sarbanes
    Oxley, Federal Information Security Management Act (FISMA), and Payment Card Industry
    Data Security Standard (PCI/DSS) compliance involves many complex steps that often
    overwhelm participants within the private sector and federal government. Using
    an approach similar to that contained herein may simplify the process of compliance.
    For example, Sarbanes Oxley consists of 11 major elements, including Auditor Independence
    (Title II), Corporate Responsibility (Title III) and White Collar Crime Penalty
    Enhancement (Title IX). Each of these, in turn, involves a complex set of activities
    to ensure compliance. The Cyber Sunburst Graph we have presented in this report
    can be applied to this set of activities, to enable clarity and allow for prioritization
    by a team engaged in Sarbanes Oxley compliance.'
