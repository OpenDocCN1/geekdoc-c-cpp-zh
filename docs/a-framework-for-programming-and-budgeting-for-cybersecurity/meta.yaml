    \ and ensuring that resilience is kept in mind when making engineering choices.\
    \ Although organizations are responsible for the latter, the former action is\
    \ carried out by external organizations (e.g., universities).\n\n- Resilience\
    \ $\\rightarrow$ Conform to resilience guidelines $\\rightarrow$ Audit against\
    \ resilience standards: This action is called out in the DHS Blueprint 3.5. It\
    \ assumes such standards; a method for measuring conformance to such standards;\
    \ a body of doctrine, practice, and norms for conducting audits; expectations\
    \ for dealing with the results of such audits—and, of course, the auditors themselves.\n\
    \n# Ring 3: Resilience $\\rightarrow$ Improve Cross-System Engineering\n\n- Resilience\
    \ $\\rightarrow$ Improve cross-system engineering $\\rightarrow$ Minimize cascading\
    \ system failures: Engineering for the purpose of minimizing cascading failures\
    \ is a ten of system design, architecture, and management. In some cases, it may\
    \ require analysis and reengineering of systems that were initially engineered\
    \ without sufficient regard to risks (such as from cyberattacks). Under this action\
    \ are several actions specific to single-points-of-failure (SPOFs)—functions whose\
    \ failure portends the failure of the system overall:\n\n- Understand potential\
    \ cascading effects with the potential to create SPOFs.\n\n- Eliminate SPOFs:\
    \ This action limits the damage that can come when something is broken. Elimination\
    \ in turn, requires two actions:\n\n  - Find SPOFs: The ability to understand\
    \ a system well enough to find every feature in the system whose failure could\
    \ impair the entire system is simultaneously rewarding and difficult. The 2003\
    \ Northeast power outage reinforced intensified efforts to find SPOFs within the\
    \ North American power grid, but by the difficulty of doing so correctly illustrated\
    \ by a power outage that struck the Southwest in 2009. Understanding potential\
    \ cascading effects with the potential to create SPOFs is DHS Blueprint capability\
    \ 3.1.\n\n  - Mitigate SPOFs: SPOF elimination is a common way to eliminate SPOFs\
    \ (if there are adequate procedures for bringing spare capacity to play), e.g.,\
    \ having recipient operations default to more reasonable sets of actions if subsystems\
    \ fail to deliver).\n\n- Resilience $\\rightarrow$ Improve cross-system engineering\
    \ $\\rightarrow$ Avoid common-mode failure in software: Redundancy may also extend\
    \ to the software layer, so that attacks on one operating system leave some up\
    \ if most are down.⁵ This is recommended only if the security benefits from multiple\
    \ protocols are not overwhelmed by the additional insecurity associated with managing\
    \ heterogeneous systems. Under this action to perform two specific actions:\n\n\
    - Develop ways to create software diversity: Organizations can deliberately diversify\
    \ their software. Yet few, if any organizations can, change the basic tendency\
    \ within the IT world to converge on a single dominant software supplier. This\
    \ action is DHS Blueprint 9.4, which may be a job for government (national governments\
    \ working together). Under this action is a more specific action:\n\n  - Seek\
    \ alternative software architectures: Which entails actively searching out alternatives\
    \ to mainstream products for particular applications. Often these are open-source\
    \ products, which have specific security advantages (they tend to be simpler and\
    \ gives them a smaller attack surface, and are user-customizable for those who\
    \ prefer greater security) and disadvantages (is Heartbleed).\n\n  - Create standards\
    \ that facilitate the smooth use of heterogeneous software: The role of standards\
    \ is to allow heterogeneous software applications to work in ways that homogeneous\
    \ software applications can through the use of proprietary data standards, API\
    \ (application programming interface), and communication protocols. The work of\
    \ developing standards, as noted above, entails writing a good standard, getting\
    \ it approved, and then persuading enough developers to adopt it, if only as as\
    \ an option alongside their proprietary protocols.\n\n# Ring 3: Recovery $\\rightarrow$\
    \ Generate Response Plans\n\n- Generate rapid response plans: Drafting rapid response\
    \ plans is an organizational responsibility (rather than something that can be\
    \ utilized standardized or made mandatory). It relates specific contingencies\
    \ to specified recovery actions, and, in large organizations, indicates who has\
    \ what responsibility for action (rather than detailing which actions need to\
    \ be performed).\n\n- Generate rapid response plans $\\rightarrow$ Develop partnerships\
    \ for rapid recovery: Developing partnerships for rapid recovery is something\
    \ that takes place among organizations. These partnerships can be vertical: Organizations\
    \ can make emergency arrangements with their suppliers (and can offer alternatives\
    \ for management and expectations of their customers). They can also be horizontal,\
    \ involving, for instance sharing arrangements and working together to allocate\
    \ resources and cover each other's customers in emergencies. This is DHS Blueprint\
    \ capability 4.3.\n\n- Generate rapid response plans $\\rightarrow$ Develop remediation\
    \ plans consistent with standards: Each plan would be specific to the organization\
    \ but presumably influenced by broadly understood best practices. This is DHS\
