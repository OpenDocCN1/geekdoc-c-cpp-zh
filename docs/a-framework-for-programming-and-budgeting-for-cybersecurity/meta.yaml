    # Summary


    In cyberspace, hacker attacks can draw from many options, and the defender must
    be prepared to respond to all possible attacks. These defensive preparations and
    responses cover a wide range of possibilities. Each activity, when taken individually,
    is often tractable, and in some cases, is easy to execute. Nevertheless, the activities
    incur a cost, and no single activity (or subset of activities) is sufficient to
    guarantee security within cyberspace. Hence, the cybersecurity professional is
    faced with the dilemma of selecting an appropriate set of cybersecurity defensive
    measures from a vast array of options, and this selection process occurs for most,
    if not all, professionals while operating with a limited set of resources to employ
    measures.


    This dilemma is faced in both the private and public sectors, including in the
    U.S. Department of Homeland Security (DHS). In 2011, DHS leadership directed a
    broad, department-wide review of the challenges it faced in implementing its charter
    to secure the nation''s defense networks. The resultant report, Blueprint for
    a Secure Cyber Future, outlines the challenges posed by hostile actors, operator
    error, and software design, among others. The DHS Blueprint identifies 75 capabilities
    (25 of them “critical”) that would enhance the security of the nation''s networks.


    A challenge in using the DHS Blueprint as a framework for programming and budgeting
    is that the capabilities are presented as an itemized list. This leads to several
    difficulties:


    - Lack of Inter-Capability Relationships: It is difficult to determine from the
    DHS Blueprint how two capabilities may depend on or influence each other.

    - Lack of Prioritization: Beyond its distinction between priority and non-priority
    capabilities, the DHS Blueprint offers no mechanism for prioritizing the capabilities.

    - Missing Influences: The DHS Blueprint attempts to present a comprehensive list
    of capabilities, but the roles and influences of other non-capability activities
    are not captured.


    In this report, we address these difficulties and help explain the means of actions
    for defending an organization against cyberattack. We present of over 100 actions
    that can serve as examples of a cyberdefense strategy, and we support the selection
    process by identifying the interrelationships among the activities. This approach
    provides a basis by which the practitioner can allocate and prioritize activities
    according to dependencies between the activities. Our approach is in contrast
    to typical cybersecurity guides, in which a set of activities is


    # A Framework for Programming and Budgeting for Cybersecurity


    presented within sequential lists that do not emphasize dependencies—or cost-effectiveness,
    for that matter.²


    We organize the organizations via hierarchical decomposition. This decomposition
    assumes that any two activities that are directly related can be characterized
    as having a parent-child relationship. In our presentation, a parent-child link
    represents one of types of relationships: composition or requisition. In a composition
    relationship, the parent (or general activity) is an aggregation of two or more
    (specific) activities (e.g., a meal is modeled as a parent activity that is composed
    of a salad activity, an appetizer activity, an entry activity, and a dessert activity).
    In a requisition relationship, one or more (specific) activities must be completed
    (required) before the parent (or general) activity can take place (e.g., a meal
    can be modeled as a parent activity that only only after the activities of buying,
    cooking, and serving have occurred). The distinction between composite and requisite
    hierarchy is applied on an as-needed method, and may depend on the reader’s interpretation
    of a set of activities; we raise the distinction principally to allow a flexible
    hierarchy. Inherent in our hierarchical decomposition is the notion that all activities
    have a single parent activity; in practice, this assumption does not hold in the
    context of cybersecurity, but for the purposes of our objective, such a constraint
    is not particularly limiting.


    A hierarchical decomposition approach lends itself to representation in many ways.
    We choose a sunburst graph in order to place the overlapping goal at the center
    of the graph and the various actions are successively at further from the center.
    Furthermore, the chart displays not only vertical relationships (parent-child)
    but relationships across branches. The sunburst chart represents in cinder ring.
    Ring 0 (the center of the ring) contains our overlapping goal of reducing expected
    cost of cyberattacks.³ Ring 1 contains strategies of strategies that support ring
    0, and, more generally, ring N+1 supports ring N. The illustration of the sunburst
    graph is displayed in Figure 1.¹


    The relative importance of each action is indicated by the magnitude of the given
    action’s weight with respect to peer actions. In the case of the four top-level
    strategies, “neutralize attacks” is allocated an angle of 180 degrees, “accelerate
    recovery” and “increase resilience” are both allocated an angle of 70 degrees.
    These angles are intended to serve as approximations of relative importance with
    a nod to prioritization more than precise allocation of resources (e.g., “neutralize
    attacks” is more important than “increase resilience,” which, in turn, is more
    than (“minimize expenses”).


    Our set of cyberdefense actions and the corresponding relationships were derived
    initially as hypotheses based on the authors’ experiences in conjunction with
    relevant literature review. Subsequently, an iterative process involving third-party
    expert review was used to refine the enumerations and relationships. The relationships
    and actions we present throughout this report are meant to be illustrative; valid
    approaches to specifying these could be developed through one of multiple approaches
    (such as empirical evaluation of incident data with a specific system, demand
    elicitation, or analysis of budgets). The value of this approach lies


    not in the precision of the outcome but rather the general shape of the graph
    of activities. Furthermore, the prioritization implied by our depiction of the
    strategies is distinct from the process of assigning actions to the strategies.
    Any given cybersecurity specialist may quibble with the details at the margins
    of our chart, but application of this approach will still provide useful insight.


    It should be noted that, in aggregate, the presented actions are of value to many
    different communities. Some actions are more relevant to CISOs (chief information
    security officers) employed in corporate settings, while other actions have relevance
    to policymakers operating within the federal government. We believe the contents
    of this report will be of interest to both public- and private-sector professionals
    involved in setting policies and creating strategies for ensuring cybersecurity.

