- md: "\n# Ring 1: Four Basic Strategies\n\nOur set of actions are categorized into\
    \ four basic strategies that support the goal of reducing the expected costs of\
    \ cyberattack, as illustrated:\n\n- Minimize exposure.\n- Neutralize attacks.\n\
    - Increase resilience.\n- Accelerate recovery.\n\nAlthough the four are intended\
    \ to be both complete and distinct, in practice there is overlap. For instance,\
    \ although resilience limits the damage of an attack and limits the duration of\
    \ the damage, actions such as instance recovery might be considered part of both.\
    \ As shown in the angles of four top-level strategies in Figure 2.2, “neutralize\
    \ attacks” is allocated an angle of 180 degrees, “accelerate recovery” is allocated\
    \ an angle of 40 degrees, and “minimize exposure” and “increase resilience” are\
    \ both allocated an angle of 70 degrees. These angles are intended to serve as\
    \ approximations of relative importance with a nod to prioritization more than\
    \ precise allocation of resources (i.e., “neutralize attacks” is more important\
    \ than “accelerate recovery”). Thumbnail definitions of the strategies follow:\n\
    \n- **Minimize exposure**: Systems are vulnerable to the extent that others access\
    \ them, and their data can be accessed or corrupted only to the extent that such\
    \ data exists on the system. This action has two components: reducing the linkages\
    \ between a system and the rest of the world (including the access of insiders\
    \ to elements of the system), and reducing the information and computational processes\
    \ (e.g., software programs and executables) that are accessible via the system.\
    \ In some cases, the severing of internal links within a system can limit the\
    \ damage from an attack by making it difficult for one subverted node in a network\
    \ to subvert others.\n- **Neutralize attacks**: This, too, is a twofold action:\
    \ to prevent as many attacks as possible from taking place and to reduce the impact\
    \ of those attacks that do place. This duality corresponds to a division of labor\
    \ between those that prevent infection from gaining hold and those that defeat\
    \ an infection once it does gain.\n- **Increase resilience**: Resilience is related\
    \ to the ability to carry on the broader functions of an organization even though\
    \ systems are degraded. It arises from a combination of redundancy and the ability\
    \ to forego certain support functions (e.g., rearranging schedules). It also exists\
    \ in the ability to manage local failures before they become systemic ones. Resilience\
    \ tends to cover gaps in the short term (the ability to overcome shortfalls without\
    \ them being recovered the reason of why the attacked capability was needed at\
    \ all).\n- **Accelerate recovery**: Recovery applies to the systems being attacked\
    \ (rather than the functions they support); it operates through repair and substitution.\
    \ It applies to attacks on availability may be relevant to corruption (to recover\
    \ the originally created data or processes) and, to a lesser extent, confidentiality\
    \ (to recover the former confidence that data is secured).\n\nNote that all four\
    \ actions have to be taken by or at least behalf of the organizations under attack\
    \ or threat of attack. The government is limited in its power to execute any of\
    \ the four, although, as described at many points below, it is capable of supporting\
    \ or, in some cases, mandating specific actions that enable these general actions.\n\
    \n> 6 Robert Lemos, \"NSA Attempting to Design Crack-Proof Computer,\" ZDNet.com,\
    \ February 1, 2001. \n> 7 Kish S. Trivedi, Dong Seung Kim, and Rahul Ghosh, \"\
    Resilience in Systems and Networks,\" presented at 2009 IEEE/ACM International\
    \ Conference on Computer-Aided Design Digital of Technical Papers, November 2009.\n\
    > 8 Cisco Systems, Inc., \"Disaster Recovery: Best Practices,\" white paper, 2008.\n\
    \n# The Basis of Our Approach\n\nOur approach is based on the strategy-to-task\
    \ decomposition methodology as developed in the late 1980s. The strategy-to-task\
    \ framework provides a link between broad objectives (strategies) and operational\
    \ activities (tasks) at the tactical engagement level. The framework explicitly\
    \ disaggregates activities into functional tasks that enable the successful execution\
    \ of the strategy, and it emphasizes the interrelationships among the tasks. the\
    \ strategy-to-task framework employs hierarchy so that each task can be subsequently\
    \ disregarded into subtasks.\n\nThe strategy-to-task framework was initially developed\
    \ for use by the U.S. Air Force. In context, an example objective might be to\
    \ deter North Korea from attacking South Korea through the strategy of maintaining\
    \ a strong forward military presence. By applying the strategy-to-task framework,\
    \ one recognizes the objectivering North Korea consists of two objectives: (1)\
    \ maintaining a strong forward military presence and (2) isolating North Korea\
    \ diplomatically. These supporting objectives can be further disaggregated into\
    \ subordinate activities through a cascading process that results in hierarchy.\n\
    \nThe work in this report applies the strategy-to-task framework to the domain\
    \ of cybersecurity and extends the framework by leveraging sunburst diagrams to\
    \ improve visualization. Readers who are interested in more details about the\
    \ strategy-to-tasks methodology are directed to publications by Kent and Ochmanck¹⁰\
    \ and Thaler.¹¹\n\n# The Benefits of Our Approach\n\nBefore proceeding with an\
    \ elaboration of the actions that fall under the four strategies, it is worth\
    \ noting the benefits of our approach. Essentially, we are presenting a large\
    \ set of possible cyberfensive actions within a tree structure, and more specifically,\
    \ we are presenting the tree via a sunburst diagram (as shown in Figure 2.1).\
    \ The use of a tree structure facilitates evaluating the actions in a prioritized\
    \ fashion, with priorities existing at the “top” of the tree (though it should\
    \ be stated that our work does not necessarily imply a basis for prioritization).\n\
    \n> David David E. Thaler, Strategies to Tasks: A Framework for Linking Means\
    \ and Ends, Santa Monica, Calif.: RAND Corporation, MR-300-AF, 1993.\n> Glenn\
    \ A. Kent and David Ochmanck, A Framework for Modernization within the United\
    \ States Air Force, Santa Monica, Calif.: RAND Corporation, MR-1706-AF, 2003.\n\
    > ¹¹ Thaler, 1993.\n\ndisplaying the tree as a sunburst diagram, a given prioritization\
    \ is easily conveyed both in a top-down and peer-wise sense.\n\nThese benefits\
    \ can be expanded with the use of digital tools for rendering the graphical representation.¹²\
    \ For example, a digital rendering can use color-coding to highlight groups of\
    \ actions based on similar characteristics. Such renderings and visualization\
    \ methods help minimize the complexity associated with the large set of actions\
    \ and may enable easy consumption by cyber practitioners. In Chapter Five of this\
    \ report, we offer additional ways in which this approach can be used.\n\n> 12\
    \ While extensive digital rendering of the sunburst diagram falls out of scope\
    \ of this work, we have experimented with and found value in simple tools that\
    \ illustrate how actions can be (de-)emphasized with automated color highlighting.\n\
    \n# CHAPTER THREE\n\n# Ring 2\n\nAll ring 1 general actions are, in turn, supported\
    \ by a variety of more specific ring 2 actions. We consider each in turn, starting\
    \ with the action of reducing unneeded exposure.\n\n# Ring 2: Minimize Exposure\n\
    \nWe can organize the strategy of reducing unneeded exposure by considering the\
    \ classes of physical and virtual assets that are subject to access (attack):\n\
    \n- Reduce the number of networked machines.\n- Reduce the number of network access\
    \ points on networked machines.\n- Reduce the amount of computational resources\
    \ on networked machines.\n- Minimize the amount of sensitive data on networked\
    \ machines.\n\nThis portion of the Cyber Sunburst Graph is shown in Figure 3.1.\
    \ As with the other strategies, many of these actions have the potential to impact\
    \ an organization’s productivity. Hence, the associated trade-offs should be considered.\n"
  mdcn: "\n\n# 第一圈：四种基本策略\n\n我们的行动set被分为四种基本策略，这些策略支持降低网络攻击预期成本的目标，如图所示：\n\n- 最小化暴露。\n\
    - 中性化攻击。\n- 增强韧性。\n- 加速恢复。\n\n尽管这四种策略旨在保持完整且互不区别，但在实践中它们存在重叠。例如，虽然韧性限制了攻击的损害并缩短了损害持续时间，但实例恢复等行动可能被视为这两者的共同部分。如图\
    \ 2.2 中四种顶层策略的角度所示，“中性化攻击”被分配了 180 度角，“加速恢复”被分配了 40 度角，而“最小化暴露”和“增强韧性”均分配了 70\
    \ 度角。这些角度旨在作为相对重要性的近似，侧重于优先顺序排序而非精确的资源分配（即“中性化攻击”比“加速恢复”更重要）。以下是策略的简要定义：\n\n-\
    \ **最小化暴露**：系统的脆弱性取决于他人访问它们的程度，而其数据被访问或损坏的程度取决于此类数据在系统中的存在性。此行动包含两个部分：减少系统与世界其他部分之间的连接（包括内部人员对系统元素的访问），以及减少通过系统可以访问的信息和计算过程（例如软件程序和可执行文件）。在某些情况下，切断系统内部的链接可以限制攻击的损害，使网络中一个被攻破的节点难以进一步攻破其他节点。\n\
    - **中性化攻击**：这同样是一个双重行动：尽可能防止攻击发生，并减少已经发生的攻击的影响。这种双重性对应于防止感染获得 foothold的人员与在感染发生后击败感染的人员之间的分工。\n\
    - **增强韧性**：韧性与组织在系统降级的情况下继续执行更广泛功能有关。它源于冗余与放弃某些支持功能（例如重新安排日程）的结合。它也存在于局部故障演变为系统性故障之前管理它们的能力。韧性倾向于涵盖短期的缺口（即在不进行恢复的情况下克服短缺的能力，这正是需要被受攻击能力的原因）。\n\
    - **加速恢复**：恢复适用于正遭受攻击的系统（而非它们支持的功能）；它通过修复和替换来运作。它适用于针对可用性的攻击（可能与损坏有关，以恢复原始创建的数据或过程），以及在较小程度上适用于机密性（恢复此前对数据安全的信心）。\n\
    \n请注意，所有四种行动必须由受攻击或面临威胁的组织执行或至少代表其执行。政府在执行这四种行动的任何方面的权力有限，但正如下面许多处描述的，它能够支持或在某些情况下强制执行这些通用行动的特定行动。\n\
    \n> 6 Robert Lemos, \"NSA Attempting to Design Crack-Proof Computer,\" ZDNet.com,\
    \ February 1, 2001. \n> 7 Kish S. Trivedi, Dong Seung Kim, and Rahul Ghosh, \"\
    Resilience in Systems and Networks,\" presented at 2009 IEEE/ACM International\
    \ Conference on Computer-Aided Design Digital of Technical Papers, November 2009.\n\
    > 8 Cisco Systems, Inc., \"Disaster Recovery: Best Practices,\" white paper, 2008.\n\
    \n# 我们方法的基础\n\n我们的方法基于 20 世纪 80 年代后期开发的“策略到任务”分解方法论。策略到任务框架提供了宏观目标（策略）与战术执行层面的操作活动（任务）之间的联系。该框架将活动明确拆分为能够实现策略成功执行的功能性任务，并强调了任务之间的相互关系。策略到任务框架采用了层次结构，使得每个任务随后可以被忽略。\n\
