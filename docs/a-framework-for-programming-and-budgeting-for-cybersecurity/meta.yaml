  md: '# CHAPTER ONE


    # Motivation


    Cyberwar enthusiasts (and defense pessimists) like quoting the warning given by
    a member of the Irish Republican Army after failing to assassinate Prime Minister
    Margaret Thatcher at the Grand Hotel in Brighton: “Today we were unlucky, but
    remember we only have to be lucky always.” This warning is not only applicable
    to cybersecurity but, from the defender''s perspective, is arguably more acute
    in a cyber context than theirs. Second, computing systems are so complex (in their
    component integration) that many points of access are unknown to their owners.
    Third (and perhaps most importantly), computing systems are dynamic and constantly
    susceptible to attack-à-vis their physical counterparts. First, computing systems
    are highly connected, providing attackers with many points of access. Second,
    computing systems are dynamic and constantly changing, with new installations
    and application upgrades that compound the connectedness and complexity. A cybersecurity
    professional can never rest.


    The result is that in cyberspace, hacker attacks can draw from many options, and
    the defender must be prepared to respond to all possible attacks. Consider the
    cyberattack against Home Depot that was made public in September 2014, in which
    multiple attack points were used to gain malicious incur, including stolen vendor
    credentials, exploitation of a Microsoft operating system vulnerability, compromise
    of the company’s point-of-sale systems, and control of the self-checkout systems.
    The defensive preparations and responses necessary to avoid such an attack cover
    a wide range of possibilities and keeping software systems updated to minimize
    vulnerabilities, installing effective tools for intercepting known attack types,
    encouraging employees and vendors to use appropriate passwords and educating them
    to avoid social engineering, and logging activity to facilitate post-incident
    forensics. Each activity, when individually, is often tractable and, in some cases,
    is easy to execute. Nevertheless, the cost of no activity (or subset of activities)
    is sufficient to guarantee security within cyberspace.


    Given that, if not all, organizations operate with limited resources, the prospect
    of executing all actions is unrealistic (and even overwhelming), and in practice
    many chief information security officers (CISOs) think that the cost of carrying
    out multiple security actions rises nonlinearly. Hence, the cybersecurity professional
    is faced with the dilemma of selecting a set of cybersecurity defensive measures,
    the sum of which must be chosen


