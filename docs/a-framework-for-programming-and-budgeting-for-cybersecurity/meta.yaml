    \ Peter Guttmann, Petr Metrger, Charles Pleeeger, John S. Quarterman, and Bruce\
    \ Schneider, “Cybersecurity: The Cost of Monopoly,” Computer and Communications\
    \ Industry Association Report, September 2003.\n\n> ⁶ For example, Foxit as a\
    \ substitute for Adobe’s products.\n\n- Recovery Generate rapid response plans\
    \ $\\rightarrow$ Exercise rapid response plans: Organizations would develop exercises\
    \ that would presume a cyberattack and its attendant effect on the systems, and\
    \ then go through recommended recovery operations. These exercises can be tabletop\
    \ or realworld. A specific action associated with such plans would be to assess\
    \ the organization's readiness and make appropriate fixes. This is DHS Blueprint\
    \ capability 5.4.\n\n# Ring 3: Recovery $\\rightarrow$ Increase Competence\n\n\
    - Recovery Increase response competence → Exercise crisis response within sectors:\
    \ The value of this action (DHS Blueprint capability 5.2) assumes a response that\
    \ is exercised within one organization would not be indicative of behavior in\
    \ a real, because either its assumptions are optimistic (access to resources considered\
    \ ample may be limited if other organizations within the sector lay claim to them)\
    \ or pessimistic (resources may be acquired from other organizations). A response\
    \ exercise with participant allows good ideas to spread among organizations.\n\
    \n- Increase response competence → Exercise crisis response across sectors: This\
    \ DHS Blueprint capability 5.1 can help intersectoral exercises allow organizations\
    \ to have a better idea of how they would respond if the exercises were confined\
    \ to the sector. To yet to be determined what kind of plausible cyberattack scenario\
    \ would have effects organizations do not share information about, or worst, access\
    \ to common utilities (interference which has significant downstream effects).\n\
    \n- Increase response competence → Develop business continuity plans: Developing\
    \ business continuity plans is a specific element that helps resilience (as hinted\
    \ at “continuity”) and recovery (if minor interruptions are tolerable). These\
    \ plans define core business functions, allowing deviations from such functions\
    \ in emergencies, and plans to recover such functions using alternative capabilities.\
    \ This is DHS Blueprint capability 5.3.\n\n- Recovery Increase response competence\
    \ → Train first responders: An important element of recovery is keeping things\
    \ from getting worse immediately. First responders are an important element in\
    \ preventing excess from cyberattacks that would lead to the denial of (physical)\
    \ services (e.g., natural gas) or those that lead to destruction (e.g., a hacked\
    \ chemical plant that starts a major fire).\n\n# Ring 3: Recovery $\\rightarrow$\
    \ Build the Ability to Restore Systems\n\n- Recovery Build the ability to restore\
    \ systems → Create a priority data plan: A priority data plan would identify which\
    \ data (or data streams) are most critical for business continuity and take steps\
    \ to ensure continued access to such data (streams) in a crisis.\n\n4 Federal\
    \ Energy Regulatory Commission and North American Electric Reliability Corporation,\
    \ Arizona-Southern California Outages on September 8, 2011: Causes and Recommendations,\
