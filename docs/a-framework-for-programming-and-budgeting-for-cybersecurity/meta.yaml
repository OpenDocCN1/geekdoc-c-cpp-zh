  mdcn: "\n……性，并就这些知识在推荐实践方面的指示达成充分的共识。这一行动在《国土安全部蓝图》（DHS Blueprint）中列为能力 3.3。\n\n\
    - 韧性 $\\rightarrow$ 遵循韧性指南 $\\rightarrow$ 对工程师进行韧性标准教育，包括以下步骤：将韧性知识纳入工程课程、毕业后对韧性知识进行孵化（其中大部分是特定于组织的），并确保在做出工程选择时考虑到韧性。虽然组织负责后者，但前者的行动由外部机构（例如大学）执行。\n\
    \n- 韧性 $\\rightarrow$ 遵循韧性指南 $\\rightarrow$ 按照韧性标准进行审计：此行动在《国土安全部蓝图》3.5中列出。它假设此类标准的存在；一种衡量此类标准的方法；一套用于开展审计的学说、实践和规范；对处理此类审计结果的预期——当然，还有审计员本身。\n\
    \n# 第 3 环：韧性 $\\rightarrow$ 改进跨系统工程\n\n- 韧性 $\\rightarrow$ 改进跨系统工程 $\\rightarrow$\
    \ 最小化系统级联故障：为了最小化级联故障而进行的工程是系统设计、架构和管理的核心宗旨。在某些情况下，它可能需要对最初设计时未充分考虑风险（如网络攻击）的系统进行分析和重新工程。在此行动下包含若干针对单点故障（SPOFs）的具体行动——这些功能的故障将预示着整个系统的故障：\n\
    \n- 理解可能产生单点故障的潜在级联效应。\n\n- 消除 SPOF：此行动限制了东西损坏时可能造成的损害。消除行动又需要两个步骤：\n\n  - 寻找\
    \ SPOF：熟悉系统以找到系统中每个可能损害整个系统的特征既回报又困难。2003 年东北部停电加强了在北美电网内寻找 SPOF 的努力，但 2009 年袭击西南部的停电说明了正确执行这一操作的困难性。理解可能产生单点故障的潜在级联效应是《国土安全部蓝图》能力\
    \ 3.1。\n\n  - 缓解 SPOF：消除 SPOF 是消除此类故障的常用方法（前提是有充分的程序来启动备用容量，例如，如果子系统未能交付，接收方操作默认执行更合理的动作集）。\n\
    \n- 韧性 $\\rightarrow$ 改进跨系统工程 $\\rightarrow$ 避免软件中的共模故障：冗余也可以扩展到软件层，使得对一个操作系统的攻击在大多数系统崩溃时仍留一些运行。⁵\
    \ 只有当多个协议带来的安全收益未被管理异构系统相关的额外不安全性所抵消时，才建议这样做。在此行动下执行两个特定行动：\n\n- 开发创建软件多样性的方法：组织可以刻意实现软件的多样化。然而，很少（如果有的）组织能够改变\
    \ IT 世界向单一主导软件供应商收敛的基本趋势。此行动是《国土安全部蓝图》9.4，可能是政府的任务（各国政府共同努力）。在此行动下有一个更具体的行动：\n\
    \n  - 寻求替代软件架构：这涉及积极为特定应用程序寻找主流产品的替代方案。这些通常是开源产品，具有特定的安全优势（它们往往更简单，攻击面更小，并且对于偏好更高安全的用户是可以自定义的）和缺点（例如\
    \ Heartbleed 漏洞）。\n\n  - 创建促进异构软件顺利使用的标准：标准的角色是允许异构软件应用通过使用专用数据标准、API（应用程序编程接口）和通信协议，以与同构软件应用相同的方式运行。开发标准的工作如上所述，涉及编写良好的标准、获得批准，然后说服足够的开发者采用它，即使仅是作为其专用协议的一个选项。\n\
    \n# 第 3 环：恢复 $\\rightarrow$ 生成快速响应计划\n\n- 生成快速响应计划：起草快速响应计划是组织的责任（而不是一种可以标准化的或强制执行的东西）。它将特定的突发情况与特定的恢复行动相关起来，并在大型组织中指明谁对什么行动承担什么责任（而不是详细说明需要执行哪些行动）。\n\
    \n- 生成快速响应计划 $\\rightarrow$ 建立快速恢复的伙伴关系：建立快速恢复的伙伴关系是发生在组织之间的事情。这些伙伴关系可以是纵的：组织可以与其供应商建立应急安排（并可以为客户的管理和预期提供替代方案）。它们也可以是水平的，例如共享安排并共同工作分配资源并在紧急情况下相互覆盖对方的客户。这是《国土安全部蓝图》能力\
    \ 4.3。\n\n- 生成快速响应计划 $\\rightarrow$ 开发符合标准的修复计划：每份计划都将特定于组织，但可能会受到广泛认可的最佳实践的影响。这是《国土安全部蓝图》能力\
    \ 4.2。\n\n> ⁵ 参见例如，Daniel Geer, Rebecca Bae, Peter Guttmann, Petr Metrger, Charles\
    \ Pleeeger, John S. Quarterman and Bruce Schneider，“Cybersecurity: The Cost of\
    \ Monopoly,” Computer and Communications Industry Association Report, 2003年9月。\n\
    \n> ⁶ 例如，用 Foxit 作为 Adobe 产品的替代品。\n\n- 恢复生成快速响应计划 $\\rightarrow$ 演练快速响应计划：组织将开发假设网络攻击及其对系统影响的练习，然后执行推荐的恢复操作。这些练习可以是桌面演练，也可以是真实的。与此类计划相关的特定行动是评估组织的准备情况并进行适当的修复。这是《国土安全部蓝图》能力\
    \ 5.4。\n\n# 第 3 环：恢复 $\\rightarrow$ 提升能力\n\n- 恢复提升响应能力 $\\rightarrow$ 在部门内进行危机响应：此行动的价值（《国土安全部蓝图》能力\
    \ 5.2）假设在单个组织内进行的响应并不代表真实情况的行为，因为其假设可能是乐观的（如果被认为充足的资源被其他组织占用，则可能会有限）或者是悲观的（资源可能从其他组织获取）。参与者的响应演练允许好想法在组织之间传播。\n\
    \n- 提升能力 $\\rightarrow$ 跨部门进行危机响应：此《国土安全部蓝图》能力 5.1 可以帮助跨部门演练让组织更好地了解如果演练仅限于部门内部，他们将如何应对。尚待确定何种合理的网络攻击场景会导致组织之间不共享信息，或者最糟糕的是影响公用设施（产生重大的下游影响）。\n\
    \n- 提升能力 $\\rightarrow$ 开发业务连续性计划：开发业务连续性计划是一个有助于韧性（如“连续性”所暗示）和恢复（如果短期中断是可以接受的）的特定元素。这些计划定义了核心业务功能，允许在紧急情况下偏离这些功能，并使用替代能力恢复这些功能的计划。这是《国土安全部蓝图》能力\
    \ 5.3。\n\n- 恢复提升能力 $\\rightarrow$ 培训应急人员：恢复的一个重要因素是防止情况立即恶化。应急人员是防止由于导致物理服务（例如天然气）拒绝或导致破坏（例如被黑客攻击的化学工厂引发大火）的网络攻击过度的重要因素。\n\
    \n# 第 3 环：恢复 $\\rightarrow$ 构建恢复系统的能力\n\n- 恢复构建恢复系统的能力 $\\rightarrow$ 创建优先级计划：优先级计划将识别哪些数据（或数据流）对业务连续性至关重要，并确保危机期间能够持续访问这些数据（流）。\n\
    \n4 联邦监管委员会和北美电力可靠性协会，“2011年9月8日亚利桑那州-南部加州停电: 原因与建议，”2012年4月。\n\n"
