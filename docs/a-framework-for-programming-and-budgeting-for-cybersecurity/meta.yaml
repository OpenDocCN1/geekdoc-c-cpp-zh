    # CHAPTER SIX


    # Conclusion


    Developing a cyberdefense strategy requires selecting defensive and preventative
    activities from a large set of possible actions. This selection process is difficult
    because there is no way to guarantee that a strategy is sufficient to defend against
    an attack, but as additional actions are added to a strategy, the total cost of
    fulfilling the strategy increases nonarly. The result is that a strategy must
    be judiciously determined with an eye toward both effectiveness and practicality,
    especially given that this process typically occurs in the context of limited
    resources.


    We believe that recognizing the interrelationships among the possible actions
    can facilitate the selection process and provide a basis by which a practitioner
    can allocate and prioritize actions according to the dependencies among them.
    In this regard, we hierarchically organized cyberensive actions according to their
    relationships. If two actions are directly related, we characterize the relationship
    as one of possible types of relationships: composition or requisition. In a composition
    relationship, the parent (or general) action is an aggregation of two or more
    child (specific) actions (e.g., a meal is composed of a salad, soup, main course,
    and dessert). In a requisition relationship, one or more child (specific) actions
    must be completed (are required) by the parent (or general) action can complete
    (e.g., a meal requires buying, cooking, and serving food). We illustrated the
    total set of related actions with a sunburst diagram.


    This approach to considering cyberensive activities is intended to aid cyber CISOs
    and their support teams in taking a circumstance view of an organization''s cyberdefense
    strategy. Resources are moved between different components of a cyberdefense strategy,
    the approach presented here should enable a transparent view of the associated
    costs in terms of money and time. We believe that an extension of this approach
    may also facilitate quantifiable understanding of the relative benefits of the
    cyber actions contained within a strategy. Moreover, by applying this methodology
    across a set of organizations (say, within the same sector, across different sectors,
    or across different government agencies), a good deal of information could be
    learned about best/common practices, outlier organizations, or actions that are
    either under- or over-addressed.'
