    \ indicates in terms of recommended practices. This action is called out in the\
    \ DHS Blueprint as capacity 3.3.\n\n- Resilience $\\rightarrow$ Conform to resilience\
    \ guidelines $\\rightarrow$ Educate engineers on resilience standards one or many\
