    \ in the next ring). This particular general action is an example of a container\
    \ made up of specific actions—rather than something that cannot take place or\
    \ cannot take place as effectively until specific actions occur.\n\nConform to\
    \ resilience guidelines: This action assumes the existence of guidelines that\
    \ have been developed to influence and guide resilience actions. This action speaks\
    \ to the importance of determining the actions taken by the organization are consistent\
    \ with and adequate for meeting such guidelines.\n\nImprove cross-system engineering:\
    \ An important element of resilience is managing cross-system dependency, minimizing\
    \ the likelihood that faults in one subsystem can propagate through other subsystems,\
    \ and reducing single-point failures (as well as common-mode failures).\n\n##\
    \ Ring 2: Accelerate Recovery\n\nAlthough the speed of a recovery from a cyberattack\
    \ can only be known after the attack takes place and crucially depends on exertions\
    \ in the recovery phase, experience (notably with other sources of system failure)\
    \ suggests that many actions prior to an attack can hasten the speed and lower\
    \ the costs of a recovery. Accordingly, the general action of accelerating recovery\
    \ can be facilitated if organizations take the following specific actions:\n\n\
    - *Generate rapid response plans.*\n- Increase response competence.\n- Build the\
    \ ability to restore systems.\n- Install systems to detect attacks quickly.\n\
    - Develop methods to rapidly isolate infected systems.\n- Clean out malware from\
    \ the system.\n\nThis portion of the Cyber Subhorst Graph is shown in Figure 3.4.\n\
    \nFigure 3.4\nThe \"Accelerate Recovery\" Strategy with Actions\n\n![](img/c82d4b10a7f527c659ee1a33fec0b4d8_35_0.png)\n\
    \nGenerate rapid response plans: To respond, it helps to have a plan; to respond\
    \ quickly, it helps to have a plan that mobilizes activity expeditiously. This\
    \ action reflects an expectation that a rapid response plan can be written down,\
    \ promulgated, and assessed by outsiders.\n\nIncrease competence: this is the\
    \ personnel management part of response. It entails having competent people with\
    \ a combination of the required decision authority and sufficient knowledge and\
    \ training.\n\nBuild the ability to restore systems: The ability to recover a\
    \ system is a function, in part, of the ability to restore a system to its previous\
    \ configuration (whatever features are necessary to forestall a rapid disaster).\
    \ Just as systems can be built so that repair is, alternatively, easier or harder\
    \ (e.g., are the spark plugs accessible?), systems can be built for faster or\
    \ slower restoration.\n\nInstall systems to detect attacks quickly: This recovery\
    \ method is specific to cyberattacks (as opposed to it proceeds deliberately,\
    \ or at least diffuses at probabilistic rates), the faster it can be detected\
    \ (under the assumption that it proceeds deliberately, or at least diffuses at\
    \ probabilistic rates), the faster stopped, with correspondingly less damage to\
    \ the availability of or to systems themselves. Note that this is a particular\
    \ case of a specific capability that could also support a ring-zero objective\
    \ of reducing the frequency and consequences of cyberattack.\n\nDevelop methods\
    \ to rapidly isolate infected systems: This specific capability assumes that the\
    \ attack in question has been detected. Given the detection and sufficient characterization\
    \ of attacks that proceeded non-instantaneously, methods that allow decoupling\
    \ permit fault isolation, which in turn limits the damaged baseline from which\
    \ recovery proceeds.\n\nClean out malware from the system: A critical aspect of\
    \ the recovery phase (again, specific to cyberattack) is to ensure that whatever\
    \ took down the systems is not present in the network to repeat the performance.\
    \ The clean-out phase can sometimes last longer than the time required to recover\
    \ functionality systematically, but it often entails reduced performance in the\
    \ interim because network connections are limited to ensure against re-infection\
    \ during cleanup.\n\n## Ring 3\n\nWhen considering the four actions of ring 1\
    \ (accelerate recovery, increase resilience, minimize exposure, and neutralize\
    \ attacks), neutralizing attacks is uniquely associated with cybersecurity; resilience,\
    \ recovery, and (to a slightly lesser degree) exposure minimization are all actions\
    \ that may be taken for reasons other than cybersecurity, such as in preparation\
    \ for a power outage or natural disaster. Our work has been motivated by cybersecurity\
    \ (as opposed to system management), and we have more detail on specific actions\
    \ to block attacks. Furthermore, many specific actions under exposure control,\
    \ recovery, and resilience are functions of the particulars of the system being\
    \ defended and are therefore not displayed. By contrast, actions specific to cybersecurity\
    \ can be generalized across systems (in part because much software is standardized).\n\
    \nAccordingly, as one moves out from the center of the Cyber Sunburst Graph, more\
