    data exists on the system. This action has two components: reducing the linkages
    between a system and the rest of the world (including the access of insiders to
    elements of the system), and reducing the information and computational processes
    (e.g., software programs and executables) that are accessible via the system.
    In some cases, the severing of internal links within a system can limit the damage
    from an attack by making it difficult for one subverted node in a network to subvert
    others.

    - Neutralize attacks: This, too, is a twofold action: to prevent as many attacks
    as possible from taking place and to reduce the impact of those attacks that do
    place. This duality corresponds to a division of labor between those that prevent
    infection from gaining hold and those that defeat an infection once it does gain.

    - Increase resilience: Resilience is related to the ability to carry on the broader
    functions of an organization even though systems are degraded. It arises from
    a combination of redundancy and the ability to forego certain support support
    functions (e.g., rearranging schedules). It also exists in the ability to manage
    local failures before they become systemic ones. Resilience tends to cover gaps
    in the short term (the ability to overcome shortfalls without them being recovered
    the reason of why the attacked capability was needed at all).

    - Accelerate recovery: Recovery applies to the systems being attacked (rather
    than the functions they support); it operates through repair and substitution.
    It applies to attacks on


    > 6 Robert Lemos, "NSA Attempting to Design Crack-Proof Computer," ZDNet.com,
    February 1, 2001.

    7 Kish S. Trivedi, Dong Seung Kim, and Rahul Ghosh, "Resilience in Systems and
    Networks," presented at 2009 IEEE/ACM International Conference on Computer-Aided
    Design Digital of Technical Papers, November 2009.

    8 Cisco Systems, Inc., "Disaster Recovery: Best Practices," white paper, 2008.'
