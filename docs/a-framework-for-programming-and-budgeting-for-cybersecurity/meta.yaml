    ## Core Concepts


    In this report, we present a set of over 100 actions that can serve as elements
    of a cyberdefense strategy. As implied above, not all activities need to be employed,
    and not all are equally important; any organization responsible for managing a
    secure computing system must pick and choose. We believe that an important facility
    necessary to support the selection process is to consider the interrelationships
    among the activities. The key point here is that cybersecurity activities are
    difficult to assess in isolation, because the execution of any activity will affect
    the efficacy of a set of other activities. Our approach provides a basis by which
    the practitioner can allocate and prioritize activities according to dependencies
    among the activities. Our approach is in contrast to typical cybersecurity guides,
    in which a set of activities is presented within sequential lists that do not
    emphasize dependencies—or cost-effectiveness, for that matter.


    We organize the relationships via hierarchical decomposition. This decomposition
    assumes that any two activities that are directly related can be characterized
    as having a parent-child relationship. In our presentation, a parent-child link
    represents one of two types of relationships: composition or requisition. In a
    composition relationship, the parent (or general) activity is an aggregation of
    two or more child (specific) activities (e.g., a meal can be modeled as a parent
    activity that is composed of a salad activity, an appetizer activity, an entrée
    activity, and a dessert activity). In a requisition relationship, one or more
    child (specific) activities must be completed (*required*) before the parent (or
    general) activity can take place (e.g., a meal can be modeled as a parent activity
    that can only occur after the activities of buying, cooking, and serving food
    have occurred). The distinction between composite and requisition hierarchy can
    be applied on an as-needed basis, and may depend on the reader''s interpretation
    of a set of activities; we raise the distinction primarily to allow for a flexible
    hierarchical model. Inherent in our hierarchical decomposition is the notion that
    all child activities have a single parent activity; in practice, this assumption
    does not hold in the context of cybersecurity, but for the purposes of our exposition,
    such a constraint is not particularly limiting.


