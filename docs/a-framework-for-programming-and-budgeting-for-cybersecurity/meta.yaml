    为了获得目标，他们愿意承担多大的风险？如果我有需要执行的操作，这些操作的时间紧迫性如何？安全程序将如何影响这些期限的实现？我在调整操作方面有多大的弹性？如果操作停止，我将承担什么样的法律或合同责任？谁可能对停止此类操作感兴趣？理解安全风险以及最小化这些风险所需的程序是网络安全的先决条件（sine
    qua non）——这一点怎么都不强调。只有在提出此类问题之后，组织才能确定需要保护什么、如何保护以及使用什么工具。


    ## 核心概念


    在本报告中，我们展示了超过 100 种可以作为网络防御策略元素的行动。如上所述，并非所有活动都需要被采用，也不是所有活动都同等重要；任何负责管理安全计算系统的组织都必须进行挑选。我们认为，支持这一选择过程的一个重要环节是考虑活动之间的相互关系。这里的关键点在于，网络安全活动很难孤立地进行评估，因为任何活动的执行都会影响另一组活的效能。我们的方法提供了一个基础，使从业人员能够根据活动之间的依赖关系来分配和优先考虑活动。我们的方法与典型的网络安全指南不同，后者通常在顺序列表中呈现一组活动，而没有强调依赖关系——或者说强调成本效益。


    我们通过分层分解来组织这些关系。这种分解假设任何两个直接相关的活动都可以被描述为具有父子关系。在我们的演示中，父子链接代表两种类型的关系之一：组合（composition）或请求（requisition）。在组合关系中，父级（或通用）活动是两个或多个子级（特定）活动的聚合（例如，一顿饭可以建模为父活动，由沙拉活动、前活动、主菜活动和甜点活动组成）。在请求关系中，在父级（或通用）活动发生之前，必须完成一个或多个子级（特定）活动（*要求*）（例如，一顿饭可以建模为父活动，只有在购买、烹饪和供应食物的活动发生后才能进行）。组合层次与请求层级之间的区别可以根据需要应用，并可能取决于读者对一组活动的解释；我们提出这种区别主要是为了允许建立灵活的层级模型。我们分层分解中固有的观点是，所有子活动只有一个父活动；在实践中，这一假设在网络安全背景下并不成立，但为了我们的阐述目的，这种限制并没有太大的限制。


    ## 6 网络安全规划与预算框架


    不应仅仅简化为组件。在下文中，人们将看到一些通用行动，其实现意义超过其前提条件或组件的总和。


    分层分解方法适用于多种方式的表示。我们选择了太阳射线图（sunburst graph），以便将总目标放在图表中心，并将各种行动成功地放置远离中心。此外，图表不仅显示了垂直关系（父子关系），还显示了跨分支的关系。太阳射线图形成了范围排列。环
    0（图表中心）包含了我们降低网络攻击成本的总目标。环 1 由保护环 0 的策略组成，而且环 N+1 支持环 N。网络太阳射线图的插图见图 2.1。


    每个活动的相对重要性通过活动楔相对于同级节点（同一活动的其他子活动）的角度来指示。角度较大的楔被认为比同一环上角度较小的楔更重要；例如，如图 2.2 所示，“消除攻击”的角度比“增加韧性”大，因此被认为是一种具防御性的策略。这些角度为考虑的一系列网络安全活动的资源分配提供了基础，并本质上在太阳射线图中表示。图中所示的角度遵循相对重要性的近似值的原则，侧重于优先级排序而非精确性。


