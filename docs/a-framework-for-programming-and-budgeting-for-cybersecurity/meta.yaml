    流程与设计是身份管理系统设计中的《网络空间可信身份国家战略》（NSTIC）治理。


    - 中消攻击 → 确保系统硬件和软件的质量 → 采用支持安全的硬件和软件：采用具备安全功能的硬件和软件是 DHS 蓝图能力 12.2。这在很大程度上取决于选择具有高安全级别的硬件和软件，无论是作为默认选项还是可选。


    - 中消攻击 → 确保系统硬件和软件的质量 → 开发采购流程以确保可靠组件的交付：开发可靠组件的采购流程意味着具备能够挫败潜在供应链攻击的能力，这些攻击通过故意插入恶意元素或由于组件设计人员未能对安全给予足够的关注，导致代码和协议中的漏洞被黑客轻易发现.$23$
    在这一更广泛的行动下包含一些具体的行动：


    - 开发在供应链中追踪组件的程序，是生成和采用供应链风险管理最佳实践的问题。后者涉及审查供应商（并在必要时传递此类要求）以及监管链管理，以防止恶意组件替换可靠组件。


    - 开发法规以管理不兼容组件带来的风险，是为政府机构和受政府监管的机构（目前主要是国防承包商，其行为取决于他们签署的合同）创建最佳实践。这显然是一个政府组织而非首席信息安全官（CISO）组织。


    - 避免使用风险组件取决于意志（风险组件成本更低或性能更差）和信息（关于哪些组件具有风险）。在这一通用行动下，一个重要的前提是有关于哪些组件实际上存在风险的可靠信息来源。要发现受损产品的线索必须由众院情报委员会$^{24}$
    发布，但在其机密报告中至少没有“冒枪”证据。同样，官方证词证实了篡改但没有说明是谁干的。$25$


    - 中消攻击 → 确保系统硬件和软件的质量 → 提高软件和硬件卡工程的知识，以全面提高逻辑处理组件、机器和系统构建背后的人员和工具。人员方面基于教育、培训、最新信息和最佳实践。工具应该有助于从设计阶段就将安全性构建到产品中。几个特定行动是这一更广泛行动的组成部分：


    > 23 虽然某些类型的供应链流显然是故意的（例如，如果输入特殊代码，系统会表现出意外之外的行为）。许多流量——例如从工厂出厂就已经被恶意软件感染的产品——也可能是故意的或随机的。请参见
    Gregg Geiger，“Best Buy Sold Infected Digital Pictures,” Computerworld.com. 2008年1月23日。


    > 24 Mike Rogers and C.A. Dutch Ruppersberger, 报告：关于中国电信华为和中兴带来的美国国家安全问题的调查报告,
    Washington, D.C.: U.S. House of Representatives, 2012年10月8日。


    > 25 Josh Smith, “Homeland Security Official: Some Foreign-Made Electronics Compromise
    Cybersecurity,” Nationaljournal.com, 2011年7月7日。


    提高基础知识水平意味着为系统设计人员灌输安全知识和安全责任。他们应该教这些设计人员像黑客一样思考，并时刻意识到，插入到系统中以使其更灵活或更易于操作的功能（例如，所谓的安全提示）会使黑客更容易得手（例如，许多答案属于公开知识）。这一行动是
    DHS 蓝图 8.1。


    - 开发通用知识体系被理解为一种朝向共同材料的学术努力（例如，书籍，或一组共同理解的原则）。一个关于网络安全的知识库可以以成本效益高的方式运行，并且可以被
    CISO 立即使用来保护其网络。这是 DHS 蓝图 8.2。


    - 将安全性纳入软件开发的最佳实践，与软件开发中安全专业知识的发展密切相关。这一行动是 DHS 蓝图 12.3，不仅包括编码，还包括设计、人员管理、测试和检查。在这一行动下，有一个辅助前提，即使用和增强特定的最佳实践，特别是由
    MITRE/SANS 开发的良好编码技术。


    - 鼓励使用良好的编码技术。


    鼓励系统架构的完整性：鼓励系统架构的完整性确保了设计标准的安全合规，以及编码质量，以确保代码符合设计标准。例如对 Chrome 与 Firefox（约2013年）的比较，结论是两个代码库中的漏洞数量在总数上相当，但后者的关键漏洞少十倍，因为浏览器会话不会传播到计算机的其余软件中。同样，考虑
    Apple 与 Android（约2012年），后者由于其封闭的生态系统漏洞多得多，但恶意软件少得多。


    - 中消攻击 → 确保系统硬件和软件的质量 → 缓解软件中的漏洞：缓解软件中的漏洞是指识别并消除已经进入市场且在情况下已安装的软件故障的过程。系统被渗透是因为它们有漏洞。某些漏洞软件制造商是未知的（零日漏洞），或者时间还不够以开发出修复程序。对于其他漏洞，补丁尚未安装。虽然最难攻的目标需要零日漏洞，但大多数目标不需要。这一行动有几个前提：快速且彻底地修复软件漏洞对安全的贡献比推迟它们或定期但低频率地安排修复它们要大得多。这一行动是以下内容的结合：


    > 26 Steve Christy, CWE/25 Most Dangerous Software Errors. The MITRE Corporation,
    2011年9月13日。


    > 27 Matthew Finster, David Wagner, "An Empirical Study of Vulnerability Rewards,"
    presented at USENIX Security, 2013年8月。


    > 28 Symantec Corporation, Internet Security Report 2013, Volume 18, Mountain
    View, Calif.


    快速且彻底地发现软件漏洞是软件制造商勤勉的问题。发现漏洞的进展可以通过以下获得帮助：


    - 鼓励软件制造商在售后后漏洞检测中投入更多资源，这可能涉及督促、公开指责或审查使软件制造商对损害负责的责任制度。然而，部署此类工具也有负面影响（例如，责任制度很大程度上与开源软件不兼容）。


    快速创建软件补丁取决于软件供应商。衡量标准取决于故障的严重程度：例如，将其转换为漏洞的难易程度、黑客利用漏洞可以获得什么权限，以及允许漏洞存在的配置是常见的还是罕见且难以诱发的。严重漏洞可能在几天或几周内得到修复（如
    Heartbleed）；对于通过 Tipping Point 日计划（zerodayinitiative.com）发现的更微妙的漏洞，修复时间可能需要几个月。Oracle
    最初拒绝在季度补丁周期之前修复严重的 Java 漏洞（Oracle 后加速了补丁），让许多安全分析师建议用户卸载 Java 客户端。


    可以修复漏洞的工具将有助于自动补丁管理此类工具必须非常复杂，以处理可能被补丁损坏的软件（软件变得脆弱，当它绕过了访问操作系统、浏览器或其所在软件关键属性的功能并直接对底层函数编码时）。部署此类工具的前提如下：

