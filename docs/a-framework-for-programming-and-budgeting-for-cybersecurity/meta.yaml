    availability may be relevant to corruption (to recover the originally created
    data or processes) and, to a lesser extent, confidentiality (to recover the former
    confidence that data is secured).


    Note that all four actions have to be taken by or at least behalf of the organizations
    under attack or threat of attack. The government is limited in its power to execute
    any of the four, although, as described at many points below, it is capable of
    supporting or, in some cases, mandating specific actions that enable these general
    actions.


    # The Basis of Our Approach


    Our approach is based on the strategy-to-task decomposition methodology as developed
    in the late 1980s. The strategy-to-task framework provides a link between broad
    objectives (strategies) and operational activities (tasks) at the tactical engagement
    level. The framework explicitly disaggregates activities into functional tasks
    that enable the successful execution of the strategy, and it emphasizes the interrelationships
    among the tasks. strategy-to-task framework employs hierarchy so that each task
    can be subsequently disregarded into subtasks.


    The strategy-to-task framework was initially developed for use by the U.S. Air
    Force. In context, an example objective might be to deter North Korea from attacking
    South Korea through the strategy of maintaining a strong forward military presence.
    By applying the strategy-to-task framework, one recognizes the objectivering North
    Korea consists of two objectives: (1) maintaining a strong forward military presence
    and (2) isolating North Korea diplomatically. These supporting objectives can
    be further disaggregated into subordinate activities through a cascading process
    that results in hierarchy.


    The work in this report applies the strategy-to-task framework to the domain of
    cybersecurity and extends the framework by leveraging sunburst diagrams to improve
    visualization. Readers who are interested in more details about the strategy-to-tasks
    methodology are directed to publications by Kent and Ochmanck¹⁰ and Thaler.¹¹


    # The Benefits of Our Approach


    Before proceeding with an elaboration of the actions that fall under the four
    strategies, it is worth noting the benefits of our approach. Essentially, we are
    presenting a large set of possible cyberensive actions within a tree structure,
    and more specifically, we are presenting the tree via a sunburst diagram (as shown
    in Figure 2.1). The use of a tree structure facilitates evaluating the actions
    in a prioritized fashion, with priorities existing at the “top” of the tree (though
    it should be stated that our work does not necessarily imply a basis for prioritization).


    +   David E. Thaler, Strategies to Tasks: A Framework for Linking Means and Ends,
    Santa Monica, Calif.: RAND Corporation, MR-300-AF, 1993.

    Glenn A. Kent and David Ochmanck, A Framework for Modernization within the United
    States Air Force, Santa Monica, Calif.: RAND Corporation, MR-1706-AF, 2003.

    ¹¹ Thaler, 1993.'
  - '[PAGE 28]


    displaying the tree as a sunburst diagram, a given prioritization is easily conveyed
    graphically both in a top-down and peer-wise sense.


    These benefits can be expanded with the use of digital tools for rendering the
    graphical representation.^{12 For example, a digital rendering can use color-coding
    to highlight groups of actions based on similar characteristics. Such renderings
    and visualization methods help minimize the complexity associated with the large
    set of cyber actions and may enable easy consumption by cyber practitioners. In
    Chapter Five of this report, we offer additional ways in which this approach can
    be used.


    > 12 While extensive digital rendering of the sunburst diagram falls out of scope
    of this work, we have experimented with and found value in simple tools that illustrate
    how actions can be (de-)emphasized with automated color highlighting.'
