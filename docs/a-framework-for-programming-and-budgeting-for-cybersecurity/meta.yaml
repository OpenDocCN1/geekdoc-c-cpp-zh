    ## 网络安全编程与预算框架


    计算机安全。尽管如此，最强大的密码（用户合理希望记住的密码）甚至是最强力的密码短语，其效果也不如多因素身份认证（MFA）。¹⁶


    采用多因素身份认证：在联邦政府内部，采用 MFA 已经成为一项既定事实，但在政府之外这是一个特例。MFA——通常是一个令牌和一个 PIN 码——在不破坏所有组件的情况下，很难被直接破解。其中一个因素的失败通常不是其他因素的失败（因为用户会将这些用户提交到会话，或者他们信任发起者）。以下几个特定行动可以加强
    MFA 的使用：


    - 改进令牌：令牌功能的可能改进包括提高易用性（例如，让通过注册表而非手动输入注册的用户），以及提高安全性（2011 年对 RSA 的黑客攻击似乎暴露了洛洛希德马丁公司系统的安全性问题）¹⁷。


    - 改进生物识别：生物识别的可能改进在于寻找能够满足往往冲突的需求的模式和设备，例如易用性、区分度（同时减少假阳性和假阴性）、持久性（随时间推移性）以及抗伪造能力。指纹是金标准，但指纹传感器仍有改进空间，在某些应用中可能需要活检。


    中和攻击 → 阻止网络攻击 → 阻止来自关联实体计算机的网络攻击：阻止来自关联实体计算机的网攻击的能力将为目标公司（Target Corporation）节省大量麻烦，因为攻击源自一个无能的
    HVAC 供应商的系统，该供应商拥有访问系统的权限，而这些系统最终访问了向销售点终端提供软件更新的服务器，¹⁸。可以采用多种方法；从审查关联实体的做法到对来自此类实体的流量进行沙箱处理，以及严格限制赋予实实权限。


    中和攻击 → 阻止网络攻击 → 在网关处阻止有害流量：在网关处阻止有害流量被认为是一项非常重要的行动，因为它代表了国土安全部（DHS）的防御能力 1.1 和
    6.1.¹⁹ 政府阻止恶意软件的卓越能力似乎也是政府在保护关键基础设施发挥作用的主要理由，通过阻止或帮助阻止此类基础设施网关处的有害流量。现代防火墙加载了大量信息，不仅包含可疑模式（恶意软件可能出现的内容），还包含可疑
    IP 地址以及与尝试投放恶意软件相关的其他可疑模式。这一行动背后有四个辅助部门：


    > ¹⁶ Federal News Radio Custom Media, “白宫沙皇的目标：终结密码，”FederalNewsRadio.com, 2014年6月18日。


    > ¹⁷ Angela Moscaritito, “RSA 确认与 SecurD 破解相关的黑客攻击，”SC Magazine, 2011年6月7日。


    > ¹⁸ Brian Krebs, “针对供应商的邮件攻击导致破解，”KrebsOnSecurity.com 博客, 2014年2月12日。


    > ¹⁹ 其中部分涉及多链联动问题。虽然 Einstein III（能力的实例化）的主要目的是入侵检测防御，但一个重要的次要目的是收集攻击信息并将这些信息共享到联邦政府之外。


    - 开发良好的防火墙：开发良好的防火墙意味着需要改进以提高其速度和区分度（在不拦截过多流量的情况下拦截坏流量），同时管理直接成本（例如，系统获取和维护成本）和间接成本（例如，追踪警报的人力）。其有效使用具有几个属性：


    - 从防火墙日志中收集数据应通过确保签名保持更新，持续维护并提高防火墙的保真度。这些信息可以与其他共享，或交换同类签名。


    - 建立监控数据中心（例如国家网络安全和通信集成中心）是任何入侵检测系统（IDS/IPS）的重要组成部分，因为它提供了人工监督、对防火墙检测到的恶意软件进行更深层取证的能力，以及防御来自僵尸网络的攻击（DDoS
    攻击），这种攻击无法简单地通过丢弃流量（或黑洞）。这是 DHS 蓝图能力 4.1。


    - 怀疑入站流量有助于保护网络，告知用户为什么他们的入站流量（例如可疑的邮件附件、带有恶意软件的网站）将无法进入，并提供样本供以后分析。


    - 正确管理：IDS/IPS 系统需要适当的管理。传统防火墙的主要缺陷之一是，如果管理它们的策略对于什么不应通过的指导不良，或者良好的策略在代码和/或指令中没有良好实施，它们可能会失效。⁰


    - 阻止来自某些站点的流量：这是防火墙管理的固有部分。在其他技术中，它使用可疑 IP 地址列表确保没有来自这些地址的入站流量到达组织内部。


    - 在防火墙之间尽可能放置多个系统：此行动看起来是基础性的，但如果从一组自然产生的异构系统集合开始，让它们的流量路由通过有限的访问点并非易事（这还需要防火墙在构建时具有足够的容量，以处理随网络流量不可避免增长的线路输入）。此行动有两个前提条件：


    - 改进配置管理：改进配置管理的点在于确定特定机器是否在 IDS/IPS 范围内，尽管如上述所示，它还有其他用途（例如，确定系统是否已完全通过补丁）。


    - 投资主机软件：投资主机软件对于配置管理生效也是必要的。主机软件¹ 运行在受管设备上，并与网络的各个部分（特别是配置、管理软件）通信。


    ⁰ 在网络上对流量进行黑洞处理是指静地丢弃或删除流量，而不通知源端数据未到达。更多信息，请参阅 https://en.wikipedia.org/wiki/black_hole。


    ¹ 可能需要两个月的时间才能让安全人员学会操作防火墙。Andrew Ginter，“防火墙失效的13种方式，”Wired, 2013年8月12日。


    ¹ 一个例子是美国国防部的主机安全解决方案（HBSS）。


    - 中和攻击 → 在网络被接管后发现并阻止感染：在网络被接管后发现并阻止感染是在边界未能拦截攻击时的第二道防线。有很多方法可以做到，包括检测网络上的异常活动或扫描被认为具有攻击特征的流量。此行动的前提是安装系统，相应的前提是确保这些系统能够做到这一点。


    - 中和攻击 → 在危机期间管理网络的程序：在危机期间管理网络程序假设网络管理应对应对不断变化的威胁可能性保持敏感。这意味着，随着威胁增加，程序被撤回且审查增加；正如人们所希望的相反情况（但在实践中，随着威胁减轻，合规性往往滞后）。注意有两个前提：


    - 与不同级别相关的安全实践：例如，美国国防部根据其认为网络运行的威胁环境建立了 INFOCONS（信息运行条件）；此类条件由外部事件（例如全球危机）和网络攻击威胁指标共同决定。然而，分级条件真实地决定了相应分级的操作程序。


    - 识别国家基本信息基础设施是一项由政府采取的行动。它将断定某些基础设施要素需要受到网络攻击的保护。要具有严肃意义，必须根据系统的关键性制定尚未存在的政策。


    - 确保内部防火墙和过滤器：组织越大，越有可能有内部害鬼，因此对每个面向外部设备的安全措施越必须越严格，以确保不被破解。因此，一个足够大的组织很可能被破解——除非它已经建立了屏障来防止内部作乱。这些防火墙和过滤器还允许敏感进程与不敏感进程共用网络，并允许隔离故障以限制其对组织造成的损害。


    ## 硬件软件的质量


    - 确保硬件软件的质量：开发可以随创新共同演进的流程和设计：此行动对应 DHS 蓝图能力 14.3。设计良好的产品在技术改进或改变网络流性质的产品上市时，不会过时或变得不安全。一个受益于此类系统的示例是


