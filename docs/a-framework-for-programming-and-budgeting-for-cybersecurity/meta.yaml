    # Acknowledgments


    The authors would first like to thank our Department of Homeland Security liaisons,
    Dana Fronczak and Aldo Prosperi, who made this research possible and provided
    useful input as the work progressed. We are also grateful to the experienced RAND
    cyber professionals who provided valuable insights as we engaged in our research
    and developed our methodology. These cyber professionals included Lily Ablon,
    Igor Mikolic-Torreira, and Tim Webb. Finally, we would like to thank our RAND
    reviewers, Sasha Romanosky, David Senty, Cynthia Cook, and Laura Baldwin, whose
    feedback significantly improved our report.


    # Abbreviations


    * API application programmer interface

    * CISO chief information security officer

    * CISSP Certified Information Systems Security Professional

    * CNCI Comprehensive National Cybersecurity Initiative

    * DDOS distributed denial of service

    * DHS U.S. Department of Homeland Security

    * DHS CFO/PA&E U.S. Department of Homeland Security Chief Financial Officer/Analysis
    and Evaluation

    * FBI Federal Bureau of Investigation

    * FTP file transfer protocol

    * IDS/IPS intrusion detection system/intrusion prevention system

    * INFOCON information operation condition

    * IP Internet Protocol

    * ISAC Information Sharing and Analysis Center

    * IT information technology

    * MFA multifactor authentication

    * NIST National Institute of Standards and Technology

    * NSA National Security Agency

    * NSTIC National Strategy for Trusted Identity in Cyberspace

    * NTP Network Time Protocol

    * PIN Personal Identification Number

    * R&D research and development

    * SCADA Supervisory Control And Data Acquisition

    * SPOF single point of failure


    # CHAPTER ONE


    # Motivation


    Cyberwar enthusiasts (and defense pessimists) like quoting the warning given by
    a member of the Irish Republican Army after failing to assassinate Prime Minister
    Margaret Thatcher at the Grand Hotel in Brighton: “Today we were unlucky, but
    remember we only have to be lucky always.” This warning is not only applicable
    to cybersecurity but, from the defender''s perspective, is arguably more acute
    in a cyber context than theirs. Second, computing systems are so complex (in their
    component integration) that many points of access are unknown to their owners.
    Third (and perhaps most importantly), computing systems are dynamic and constantly
    susceptible to attack vis-à-vis their physical counterparts. First, computing
    systems are highly connected, providing attackers with many points of access.
    Second, computing systems are dynamic and constantly changing, with new installations
    and application upgrades that compound the connectedness and complexity. A cybersecurity
    professional can never rest.


    The result is that in cyberspace, hacker attacks can draw from many options, and
    the defender must be prepared to respond to all possible attacks. Consider the
    cyberattack against Home Depot that was made public in September 2014, in which
    multiple attack points were used to gain malicious incur, including stolen vendor
    credentials, exploitation of a Microsoft operating system vulnerability, compromise
    of the company’s point-of-sale systems, and control of the self-checkout systems.
    The defensive preparations and responses necessary to avoid such an attack cover
    a wide range of possibilities and keeping software systems updated to minimize
    vulnerabilities, installing effective tools for intercepting known attack types,
    encouraging employees and vendors to use appropriate passwords and educating them
    to avoid social engineering, and logging activity to facilitate post-incident
    forensics. Each activity, when individually, is often tractable and, in some cases,
    is easy to execute. Nevertheless, the cost of no activity (or subset of activities)
    is sufficient to guarantee security within cyberspace.


    Given that, if not all, organizations operate with limited resources, the prospect
    of executing all actions is unrealistic (and even overwhelming), and in practice
    many chief information security officers (CISOs) think that the cost of carrying
    out multiple security actions rises nonlinearly. Hence, the cybersecurity professional
    is faced with the dilemma of selecting a set of cybersecurity defensive measures,
    the sum of which must be chosen based on practicality more than optimality. Choosing
    among this large set of possibilities is not easy.


    + 1 David Hughes, “Brighton Bombing: Daily Telegraph Journalist Recalls,” The
    Telegraph, October 11, 2009.

    + 2 Shelly Banjo, “Home Depot Hackers Exposed 53 Million Email Addresses,” Wall
    Street Journal, November 6, 2015.


    # 2 Framework for Programming and Budgeting for Cybersecurity


    As the federal agency with the responsibility of securing the nation''s nondefense
    cyber networks, the U.S. Department of Homeland Security (DHS) also faces this
    stark challenge of developing and recommending a cyberdefense strategy. The challenge
    is especially daunting for DHS given that the networks, which DHS must influence,
    are largely owned and operated by private corporations. DHS does not have the
    authority to mandate standards, so it must rely largely on a recommendation that
    encourages the providers to conform to effective security standards in particular
    and best practices generally. This is not to say that DHS not have a harmful influence
    on securing the nation''s networks. It has resources ($38.2 billion in the President''s
    Budget for 2015), a growing research and development (R&D) program, and control
    of gateway services for a widely used network it manages (.gov domain). In 2011,
    DHS leadership directed a broad, department-wide review of the challenges it faced
    in implementing its charter to secure the nation''s networks. The resultant report,
    Blueprint for a Secure Future, outlines the challenges posed by hostile actors,
    operator error and faulty software design, among others. The DHS Blueprint identifies
    75 capabilities (of them “critical”) that would enhance the security of the networks.


    In a preceding study prepared for the DHS Security Chief Financial/Program Analysis
    and Evaluation (DHS CFO/PAE), while RAND gained a great number of useful insights,
    it did not provide an analytic framework for the DHS CFO/PAE staff to make decisions
    on how to allocate constrained resources among competing programs. A challenge
    in using the DHS Blueprint as framework for programming and budgeting is that
    the capabilities are presented as an itemized list. This leads to several difficulties:


    - Lack of Inter-Capability Relationships: It is difficult to determine from the
    DHS Blueprint how any two capabilities may depend on or influence each other.

    - Lack of Prioritization: Beyond the distinction between priority and nonfiction
    capability, the DHS Blueprint offers no mechanism for prioritizing the importance
    of the capability.

    - Missing Information: The DHS Blueprint attempts to present a comprehensive list
    of capabilities, but the roles and the influence of nonfiction activities are
    not captured.


    Given the above backdrop, the aim of this report is to provide a method that organizations
    use for addressing these difficulties and to help explain the menu of actions
    for defending an organization against cyberattack. That noted, no organization
    would plunge into this approach without prior reflection about what its needs
    to defend and how badly. For instance, if I have information on my network, can
    I afford to lose and what I cannot afford to lose? What are the consequences of
    losing it—is my reputation at stake, by my ability to be first to market with
    new products, the privacy of my employees? Who might be interested in it? Why?
    How badly?


    > 3 U.S. Department of Homeland Security, Blueprint for a Secure Cyber Future:
    The Cybersecurity Strategy for the Homeland Security Enterprise, Washington, D.C.,
    2014.

