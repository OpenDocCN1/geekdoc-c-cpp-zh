    ## A Framework for Programming and Budgeting for Cybersecurity


    Computer security. That noted, the strongest password (that users can plausibly
    hope to remember) or even the strongest pass-phrase is less effective than multifactor
    authentication (MFA).¹⁶


    Adopt multifactor authentication: The adoption of MFA is pretty much an accomplished
    fact within the federal government, but it is the exception outside it. MFA—typically
    a token and a PIN—is difficult to break directly without subverting all components.
    Most of the failure of one factor are not failure of the other factors (as users
    submit these users to sessions or they trust initiates). Several specific actions
    would strengthen the use of MFA:


    - Improve tokens: Possible improvement in tokens feature more ease-of-use (e.g.,
    those who register via registry rather than manual entry), as well as higher security
    (a hack on RSA in 2011 appears the security of Lockheed-Martin''s systems)¹⁷.


    - Improve biometrics: Possible improvement in biometrics would look for modalities
    and devices that can satisfy often-in-conflict desiderata, as ease-of-use, discrimination
    (simultaneously false positives and false negatives), persistence (over time),
    and resistance to spoofing. Fingerprints are the gold standard, but fingerprint
    sensors could stand improvement, and live-tests may be needed in certain applications.


    Neutralize Attack → Block cyberattacks → cyberattacks passing from computers of
    affiliates: The ability to block cyberattacks from computers of affiliates would
    have saved Target Corporation a general deal of grief inasmuch as the attack on
    systems originating from a feckless HVAC supplier who had access to systems that,
    themselves, ultimately had access to the server that supplied point-of-sale machines
    with software updates,¹⁸ There are several approaches that can be employed; they
    range from vetting the practices of affiliates, to sandboxing traffic and from
    such affiliates, to rigorously paying the privileges afforded to affiliates.


    Neutralize Attack → Block cyberattacks → Block harmful traffic at gateways: Blocking
    harmful traffic at gateways is considered a very high-profile action, inasmuch
    as it represents DHS Breach capabilities 1.1 and 6.1.¹⁹ The government''s superior
    ability to block malware also appears to be the primary justification for a government
    role in protecting critical infrastructure by blocking or to help block harmful
    traffic at the gateway to such infrastructure. Modern firewalls are loaded with
    information containing not only suspicious patterns (what might appear in malware)
    but also suspicious IP addresses and other suspicious modalities associated with
    the attempt to deliver malware. Behind this action are four subsidiaries:


    > ¹⁶ Federal News Radio Custom Media, "White House Czar’s Goal: Kill The Password
    Dead.," FederalNewsRadio.com, June 18, 2014.


    > ¹⁷ Angela Moscaritito, "RSA Confirms Hack Linked to SecurD Breach," SC Magazine,
    June 7, 2011.


    > ¹⁸ Brian Krebs, "Email Attack on Vendor Set Up Breach," KrebsOnSecurity.com
    blog, February 12, 2014.


    > ¹⁹ Some of this is a matter of multiple-chaining. Although the primary purpose
    of Einstein III, the instantiation of capabilities, is intrusion detection prevention,
    an important secondary purpose is to collect information on attacks and share
    this information beyond the federal government.


    - Develop good firewalls: The development of good firewalls entail improvements
    to improve their speed and discrimination (blocking bad traffic without blocking
    too much traffic while managing direct costs (e.g., system acquisition and maintenance)
    and indirect costs (e.g., manpower to chase down alarms). Useful use has several
    attributes:


    - Harvesting data from firewall logs should continuously maintain and improve
    the fidelity of the firewall by ensuring that signatures stay current. This information
    can be shared with others, or traded for comparable signatures.


    - Establishing a watch data center, such as the National Cybersecurity and Communications
    Integration Center, is an important component in any intrusion detection system
    (IDS/IPS) insofar as it provides human oversight, an ability to do deeper forensics
    on malware detected in the firewall, and a defense against attacks from botnets
    (a DDoS attack) that cannot be simply handled by dropping (or “black-holing”)
    traffic. This is DHS Blueprint capability 4.1.


    - The ability to suspect incoming traffic help protect the network, inform users
    why their incoming traffic (e.g., suspect email attachments, malware-laden webs)
    will not be coming, and provide samples for later analysis.


    - Administer correctly: IDS/IPS systems need proper administration. One of the
    primary faults of traditional firewalls is that they can fail if the policy for
    how to administer them is a poor guide for what should not be let through, or
    if good policy is not well implemented in code and/or instructions.⁰


    - Block traffic from certain sites: This is part and parcel of firewall management.
    Among other techniques, it uses the list of suspect IP addresses to ensure that
    no incoming traffic from these addresses reaches within the organization.


    - Put as many systems between firewalls as possible: This action appears elementary,
    but if one starts with disparate sets of systems that emerged organically, getting
    their traffic routed through a limited number of access points is not trivial
    (it also requires that firewalls be built with enough capacity to handle line
    input with the inevitable growth of network traffic). This action has two prerequisites:


    - Improve configuration management: The point of improving configuration management
    is to determine whether or not a particular machine is within the confines of
    the IDS/IPS system, although it has other purposes, as noted above (e.g., to determine
    whether systems are fully patched).


    - Invest in host software: Investing in host-based software is also necessary
    for configuration management to work. The host software¹ sits on the managed devices
    and talks to the various pieces of network, notably configuration, management
    software.


    ⁰ To black-hole traffic on a network is to silently discard, or drop, without
    informing the source that the data did not reach. For more information, see https://en.wikipedia.org/wiki/black_hole.


    ¹ It can take up to two months of full-time training for a security professional
    to operate a firewall. Andrew Ginter, “13 Ways Your Firewall Could Fail,” Wired.com
    Innovation Insights, August 12, 2013.


    ¹ An example is the U.S. Department of Defense’s Host Based Software (HBSS).


    - Neutralize Attack → Find and block infections after they have taken over the
    network: Finding and blocking infections after they have taken over the network
    is a second line of defense to be employed if malware is not blocked at an organization''s
    perimeters. There are many techniques for doing so, including indications of unusual
    activity on the network or scanning for traffic (e.g., packets) traveling among
    machines that have been deemed characteristic of an attack. This action has a
    prerequisite of installing systems to detect, the concomitant prerequisite of
    ensuring those systems can do so.


    - Neutralize Attack → Improve procedures for managing the network in a crisis:
    Improving procedures for managing the network in a crisis assumes that the administration
    of the network should be sensitive to the varying likelihood of its under attack.
    To wait, as the threat increases, procedures are withdrawn and scrutiny increases;
    as one wants, the opposite takes place (although, in practice, security catches
    up while compliance lags as the threat appears to recede). Note are two prerequisites:


    - Developing security practices tied to various levels: The U.S. Department of
    Defense, for instance, has established INFOCONS (information operation conditions)
    keyed to the threat environment it believes its networks are operating in; such
    conditions are keyed by a combination of external events (e.g., global crises)
    and threat indicators of cyberattack. However, the source, tiered series of conditions
    realistically dictates a correspondingly tiered set of operational procedures.


    - Identifying the country''s minimum essential information infrastructure is an
    action that would be undertaken by the government. It would assert that certain
    elements of the infrastructure need to be rigorously protected against cyberattacks.
    To have serious meaning, there would have to be as-yet-nonexistent policies keyed
    to the level of criticality of systems.


    - Ensure internal firewalls and filters: The larger the organization, the more
    likely it is to have rogue employees, and the tighter its security has to be on
    every outward-facing device to ensure that no compromised. A sufficiently large
    organization is therefore very likely to be compromised—unless it has erected
    barriers to keep mischief at bay within a subsegment. These firewalls and filters
    also allow sensitive processes to be on the network with less sensitive ones,
    and permit isolating a fault so to limit the damage it can do to an organization.


