  mdcn: "\n\n## 第3环：中化攻击 $\\rightarrow$ 应对内部威胁\n\n- 中化攻击 $\\rightarrow$ 应对内部威胁 $\\\
    rightarrow$ 物理上保护计算空间：此行动假设黑客位于机器本身或其附近，或者在机器上或附近构建或损坏了设备¹¹¹。必须阻断多条路径。这样做可以防止黑客进入物理边界，防止违规设备进入射频边界¹¹²，并管理供应链，以防止违规设备替换未受损的设备（供应链管理将在后文中讨论）。\n\
    \n- 中化攻击 $\\rightarrow$ 应对内部威胁 $\\rightarrow$ 减少员工攻击：此行动针对的是采取违规的授权用户（无意内部人员的行为是另一回事，将在后文中讨论），或者至少在系统中获取了他们不拥有的权限。除了之前在减少暴露范围内涵盖的行动（例如，最小权限原则）外，促进减少内部攻击的具体行动包括：\n\
    \    * 审查员工：组织将对员工（包括所有拥有系统权限的人员）进行审查，以确保他们不会为了利益、恐惧（例如勒索）或意识形态而产生作剧。安全审查程序本应由政府执行此工作（要求关键基础设施工作人员通过安全审查的理念时时会出现一次）。\n\
    \    * 向员工灌输组织价值观：向员工灌输组织价值观的过程是为了提醒他们，为什么通过破坏他们所使用的网络来背叛组织是极其重要的（这种灌输可能对防止无意员工的渗透也有用，例如防止访问恶意网站可能发生的情况）。\n\
    \    * 监控员工：组织出于多种原因必须对员工进行监控，以确保他们没有参与网络攻击。其目的之一是判断员工的每一个看似无害的行为，合在一起是否无法解释，除非该员工正在追求其他目的。例如，FBI\
    \ 的监控系统记录了对其中央计算机系统的访问请求，如果 FBI 能更勤奋地分析监控系统收集的数据，本可以抓到罗伯特·汉森（Robert Hansen）。\n\
    \    * 强制休假和/或轮岗：此行动允许其他人在个人临时或永久缺席的情况下检查记录这起源于银行业的惯常做法（防范挪用），其相关性依然存在。\n\n- 攻击\
    \ $\\rightarrow$ 应对内部威胁 $\\rightarrow$ 限制承包商权限：除了避免员工行为的步骤外，还可以针对为组织工作的承包商采取措施。\n\
    \n> ¹¹ David E. Sanger and Thom Shaker, 'N.S.A. Devises Pathway into Computers,'\
    \ *New York Times*, January 14, 2014.\n\n> ¹² 这是信号可以从网络截获或注入的距离。请注意，该边界不是固定的。具有强大发射器/或天线的违规设备可以在更远的地方运行。这种威胁可以通过链路间加密来缓解。\n\
    \n## 第3环：中化攻击 $\\rightarrow$ 针对特定已知威胁开发缓解措施\n\n- 中化攻击 $\\rightarrow$ 针对特定已知威胁开发缓解措施\
    \ $\\rightarrow$ 开发识别和表征黑客的方法：识别特定身份有助于攻击前的过滤（例如，通过创建入侵检测系统可以签名来拦截可疑输入，如电子邮件或网页）。它还可以识别攻击发生后的攻击痕迹。这是\
    \ DHS 蓝图（Blueprint）的 2.3 能力。表征特定攻击的能力取决于两点：\n- 收集网络空间战斗的情报是简单的。NSA 渗透网络以了解潜在黑客可能在做什么以及他们如何做¹³。然而，此类情报也被私人公司收集；例如\
    \ Crowdstrike，它声称追踪了 60 个团体¹⁴。\n- 开发一种快速关联来自不同来源信息的能力，是确定网络空间中身份的目标。这是 DHS 蓝图的\
    \ 2.2 能力——作为一种需要高水平智能共享的数据形式，希望这可以得到自动化方法的辅助。\n- 使高级恶意软件分析中心（AMAC）完全完全运行能力：该中心由美国计算机应急准备小组（USCERT）运营。希望可以对恶意软件产物进行评估，根据它们反映了其开发者的什么信息，以及反映了其设计攻击的系统的什么信息。\n\
    - 评估来自各种威胁行为者的风险：此行动涉及评估哪些团体比其他构成更大的威胁，因为要区分最吸引特定团的目标（例如，某些团体对窃取知识产权感兴趣，而另一些则实施金融犯罪）。\n\
    - 追踪轨迹并以此表征威胁行为者的技术可能包括但不限于蜜洞网络和蜜罐罐（honeypots）。目标是挑战黑客暴露一些与他人不同的自身信息。\n- 表征威胁的标准方法指的是常见的命名和方法论。标准的前提行动是建立一个以标准方法表征这些威胁的利益社区——DHS\
    \ 蓝图 1.5 能力。\n\n## 第3环：中化攻击 $\\rightarrow$ 阻止网络攻击\n\n这是整体防御中最相关的网络防御形式：在攻击时采取的积极措施，以减少黑客渗透系统的尝试，或减少黑客扩大攻击范围的能力。它由几个特定行动组成：\n\
    \n- 中化攻击 $\\rightarrow$ 阻止网络攻击 $\\rightarrow$ 阻止针对客户端计算机的网络攻击：阻止针对客户端（如 PC）的攻击不仅可以保持其清洁（受感染的计算机可能会变砖或被招募用于\
    \ DDOS 攻击，这种攻击可能针对组织以及外部目标），还拒绝了黑客进入组织的常用路径。入侵了边界内部计算机的黑客更容易感染他人，因为此类计算机通常对从外部获取的信息具有特权访问（企业高管往往因为权限广泛而成为钓鱼攻击的首要目标）。通过采取以下一项或两个行动，可以降低此类攻击的概率：\n\
    \n- 公民对互联网风险的意识：此行动有助于确保公民和员工具备网络安全的基本知识以及在机器上的正确行为。这是（在多个层面）非营利机构或为公共利益工作的营利机构的功能。\n\
    \n- 培训用户计算机安全知识：此行动是首席安全官（CISO）的常见功能——也许是最常见的；许多人接受了更频繁、更密集的培训，并不是为了将用户训练到更高的知识水平，而是为了提高意识水平。此行动有两个组成：\n\
    - 教育材料的提供可能是供应商的活动。此类材料的特征可能是与学生的互动更强，课程的留存时间更长（从学生记住了什么以及学生意识到了什么方面来看）：\n- 测试材料的提供也可能是供应商的活动。尽管测试材料通常融入在教育材料中，但某些组织已经开发或获取了自己的测试，以发现他们组织内部具有成为网络安全专业人员潜力的人。\n\
    \n- 中化攻击 $\\rightarrow$ 阻止网络攻击 $\\rightarrow$ 开发最佳客户端实践：DHS 蓝图 11.2 确保用户在面对软件（在某些情况下为硬件）时做出明确选择。这在程度上取决于培训，但也取决于让用户清楚自己在选择什么且与预期没有太大偏差的软件¹⁵\n\
    \n- 人机界面易用性要求：一个重要的前提是开发人机界面易用性要求（DHS 蓝图 13.1），这涉及到人类因素的研究、设计知识以及有利于良好人机交互的激励机制。\n\
    \n- 中化攻击 $\\rightarrow$ 阻止网络攻击 $\\rightarrow$ 审查员工成为无意攻击媒介：审查员工带来的网络风险可能会提高用户安全实践（通过不雇用那些最可能无法工作的人），但这种做法仅建议用于没有自动手段（例如运行在最安全级别的软件）可以使用的最敏感职位。\n\
    \n- 攻击 $\\rightarrow$ 阻止网络攻击 $\\rightarrow$ 安全验证用户：更好地验证用户可以确保在系统中声称拥有权限的人正是他们所称的。身份验证有两条基本路径：\n\
    - 单因素身份验证技术：进入客户端（或公司服务器上的客户端）的第一条路径是猜测用户的密码，对强密码的要求通常是最直接的路径到\n\n"
