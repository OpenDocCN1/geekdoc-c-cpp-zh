    # Ring 3: Neutralize Attack → Test Systems Against Simulated Attacks


    This is also known as red-teaming, of which pen(etration)-testing is an important
    component. Such tests can indicate in general how an organization’s systems are
    and specific indicators of particular weaknesses to be fixed. This action has
    several components:


    +   * Neutralize Attack → Test systems against simulated attacks → Deploy people
    to red-team systems: This involves hiring a team (either in house, or more commonly,
    under contract). CISOs have a good sense of who the red teamers are, what they
    need to test, and under ground rules. One way for DHS to acquire the services
    of such people is to leverage capabilities present at the NSA en route to perhaps
    being able to duplicate them on their own.

    * Neutralize Attack → Test systems against simulated attacks → Acquire red-teaming
    tools: If the team is in-house, the organization will need to acquire red-teaming
    tools; contracted teams tend to bring their own tools. However, the organization
    may also need tools to generalize from the results of the red team to find similar
    weaknesses throughout their systems.


