    - * Improve system administrator capabilities: Improving the capabilities of existing
    system administrators is a matter of training, education, and to some extent,
    selective weeding (this is difficult to do with civil servants, many of whom administer
    federal networks are contractors). A component of this upgrading is adopting a
    maturity model, DHS Blueprint 8.3.

    - * Neutralize Attack → Improve the security-related competence of system administrators
    → Outsource system administration: Outsourcing system administration is an option
    if the acquisition of competence cybersecurity professionals is cost-ineffective.
    It may also be considered concomitant to other information management decisions,
    as illustrated by two forms of outsourcing:

    - * Investigate cloud services: Cloud services may be adopted for any number of
    reasons, as because they offer greater location-independence, or to harvest economies
    of scale in storage and processing. But outsourcing what essentially serves to
    secure companies that specialize in offering cybersecurity (as part of their features
    package) may offer the opportunity to improve cybersecurity in ways that may be
    more cost-effective than doing it themselves.

    - * Investigate securityas: Similarly, companies are investigating outsourcing
    for all or most their entire cybersecurity functions. Movement is so, in part
    this has traditionally been viewed as an organic duty, and partially because it
    means trusting a third party with one’s data. Yet, there may be opportunities
    to achieve similar or better security for less money.


    # Ring 3: Neutralize Attack → Test Systems Against Simulated Attacks


    This is also known as red-teaming, of which pen(etration)-testing is an important
