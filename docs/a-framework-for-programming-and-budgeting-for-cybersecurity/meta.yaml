  md: '○ Finding software vulnerabilities quickly and thoroughly is a matter of diligence
    on the part of software manufacturers prodded or helped by outside entities. Progress
    at finding bugs can be helped by:


    +    Encouraging software makers to invest more resources in postmarket bug detection
    may be a matter of cajailing, naming-and-shaming, or examining liability regimes
    that make software manufacturers responsible for the damage caused by the bugs
    in their products. However, leaning on software manufacturers has downsides (liability
    regimes are largely incompatible with open-source software, for instance).


    +    Developing tools that can find vulnerabilities entails improving the efficiency
    by which defects in software can be found. Fuzzers, for instance, are tools that
    look for vulnerabilities by feeding invalid, unexpected, or random data and seeing
    which data cause system crashes or other faults. Such tools are double-edged swords
    in the sense that their development may also allow bad hackers (black hats) to
    find faults before good hackers (white hats) do.


    +    Bounties have proven at gathering third-party participation in finding software
    faults. Bug contributors now include Google, Microsoft, and Facebook. There are
    also third-party efforts, such as Pwn-to-Own and Pwnium. Currently, the total
    payoff for discovering bugs is in the single-digit millions of dollars (compared
    with the $70 billion spent worldwide on cybersecurity every year). A dark side
    is buying bugs for exploitation rather than mitigation. Suppressing the government-funded
    gray market in vulnerabilities may help boost the efficiency of bug bounty programs.


    Creating software patches expeditiously is up to software vendors. The measure
    depends on the severity of the fault: e.g., how easy it is to convert it into
    an exploit, what privileges hackers can acquire by exploiting the fault, and whether
    the configuration that permits the exploit is common and/or rare and hard to induce.
    Serious vulnerabilities might be patched within days or weeks (as Heartbleed was);
    patch times for the more subtle flaws discovered via Tipping Point''s Zero-Day
    Initiative (zerodayinitiative.com) can take months. Oracle''s initial refusal
    to patch a serious Java vulnerability until their quarterly patch cycle (Oracle
    later accelerated its patch) convinced many cybersecurity analysts to recommend
    that users uninstall their Java client.


    Deploying tools that can fix vulnerabilities would facilitate automatic patch
    management. Such a tool would have to be so sophisticated to deal with software
    that might be broken by the patch (software becomes brittle that when it circumvents
    those functions that grant access to the operating system, browser, or key attributes
    in the software it sits on and codes directly to lower-level functions). Prerequisites
    to the deployment of such tools are as follows:


    > 29 A rogue charger can compromise an iPhone, but success at mounting an attack
    requires onsite presence and a careless user (Timothy Lord, "iPhone Hacked Under
    60 Seconds Using Malicious Charger," Slashdot.com blog, August 2, 2013).


    > 30 Brian Krebs, "Security Fix for Critical Java Flaw Released," KrebsOnSecurity.com
    blog, August 30, 2012.'
