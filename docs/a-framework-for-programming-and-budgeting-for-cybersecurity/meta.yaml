  md: '# Ring 3: Exposure → Reduce the Number of Networked Machines


    Although four subsidiary actions were identified as comprising the minimization
    of unnecessary exposure, more specific actions were identified for only one of
    these: reducing the number of networked machines. The children of this action
    are listed below:


    +   - Exposure Reduce the number of networked machines → Reduce the number of
    addressable machines: We distinguish between those machines that can be accessed
    because they are connected to a directly addressable machine (e.g., a printer
    hanging on a personal computer) and those that can be accessed because they are
    directly addressable (e.g., a network printer with an Internet Protocol [IP]).
    Although indirectly addressable machines are still at risk (e.g., a computer can
    be compromised through cyberattack and thereby commanded to feed the printer harmful
    commands, leading to the printer’s destruction), removing direct addressing reduces
    the number of ways the printer can be attacked (a.k.a. its attack surface).

    - Exposure Reduce the number of networked machines → Determine which systems should
    be isolated: This is an analytic function in which the risk has to be traded off
    against the cost and inconvenience associated with not allowing networked machines
    or the outside world to access the systems. Further analysis would be required
    to determine trade-offs between virtual (e.g., cryptographic) isolation (to permit
    communications links over other networks) and physical isolation, as well as policies
    for intermittent access (e.g., via removable media) or radio-frequency access
    (thus understanding of how large a physical perimeter needs to be guarded).

    - Exposure Reduce the number of networked machines → Isolate systems as per this
    determination: In many cases, this entails disconnecting systems that were previously
    connected (or encrypting links that were previously unencrypted, etc.).

    - Exposure Reduce the number of networked machines → Test isolation: Many organizations
    that believe their systems are isolated in error, either because they have not
    thoroughly understood what isolation entails, or because there are undocumented
    connections that make them accessible. Ensuring isolation requires testing and
    retesting potential access methods in order to determine that the degree of isolation
    is consistent with isolation policies. Shodan (www.shodan.com) is one such tool
    for doing so.

    - Tools for testing isolation: A prerequisite is acquiring and/or developing tools
    for testing isolation. Organizations can decide to buy or not buy, but if the
    tool has to be developed, external vendors are usually the ones to do so; such
    developments have to be encouraged by government R&D and/or acquisition policy.


    Note that the above statement about development is true for the development of
    any capability and will not be explicitly repeated for the capabilities below.'
