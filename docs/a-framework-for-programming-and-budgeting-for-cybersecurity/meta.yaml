  md: '# Using This Work


    The organization of cyberdefensiveactions presented in this report can be used
    in two fundamental ways: (1) to enable auditing of cyberdefensive resource allocation
    by a government or corporate organization that is evaluating the implementation
    of a cybersecurity strategy and (2) to serve as a prescriptive mechanism for consideration
    when an organization is developing a cybersecurity strategy. Both of these uses
    are intended for adoption by a wide variety of organizations, and we believe that
    these uses will be valuable to public- and private-sector entities, independent
    of the entity size (e.g., both large and small).


    # Auditing Mechanism


    The sunburst visualization of the cyberdefensive strategies facilitates the ability
    to assess how cyberdefensive resources are allocated within an organization. This
    was a key motivation behind our work for DHS CFO/PA&E, its role in determining
    program effectiveness. A programming office that records resource allocation for
    cyberdefensive actions (e.g., the budget expended toward other actions, such as
    generating rapid response plans versus the absence of a budget allocated to other
    actions) can review these allocations and visually depict how the resources are
    distributed across the set of possible actions, as well as over-exposed and under-exposed
    actions, as well as other misalignments in a way that can be communicated across
    multiple management layers of a large organization.


    Some challenges will exist in the auditing process, such as the ability to compare
    actions that are difficult to quantify along the same dimension. For example,
    the action of “minimizing exposure” may not necessarily be associated with a financial
    quantity, while actions as “block cyberattacks” (e.g., through firewalls) are
    readily associated with financial amounts. For this reason, a suitable approach
    for quantifying all actions will be necessary depending on the selected auditing
    mechanism.


    # Prescriptive Mechanism


    The cyberdefensive organization presented herein can be used when developing a
    cyberdefense strategy. The actions described in this work are presented in a top-down
    hierarchy that can be used to guide a CISO in identifying appropriate cyberdefensive
    actions for a given organization''s needs. It should be noted that many of the
    actions presented in the preceding pages are'
  merge: -1
  pgno: 66
- img_proc: true
  md: 'universally applicable to all organizations and should be adopted on an as-needed
    basis. For example, it is likely that the strategy of increasing resilience should
    be prioritized over accelerating recovery in the case of organizations that provide
    services for medical emergencies (e.g., critical infrastructure for first responders),
    since increasing resilience focuses on preventing interruptions, whereas recovery
    assumes a system that will go down (though, hopefully for a short period of time).
    Other organizations that can withstand downtime may consider recovery a key component
    of their strategy. Similarly, some organizations may choose to minimize unnecessary
    exposure as a key strategy (especially if the convenience of network-accessibility
    is not a highly valued benefit), while others may not be able to fairly engage
    in this strategy, as may go against the organization''s raison d''être. For organizations
    evaluating the "minimize exposure" strategy, we recommend that careful thought
    be given to the costs and benefits of web accessibility for each class of the
    organization''s information for which network exposure is being considered.


    # Improving the Cyberdefensive Actions


    As mentioned previously, the cyberdefensive actions presented in this report represent
    an iterative process of selection and review, though this process did not incorporate
    consideration for explicit resource allocation. We believe that there is likely
    room for improving some components of the presented actions to arrive at a customized
    set of actions based on an organization''s characteristics. We can think of the
    presented actions as an enumeration (a hierarchical list of actions) with an implicit
    calibration that is indicated by the angles of the sunburst weges (a prioritization
    or allocation strategy) among the actions based on respective wedge sizes. As
    implied in the preceding section, the specific enumeration and calibration will
    vary widely across organizations, in that the space of actions will differ by
    organization (two organizations will generally not share identical enumerations)
    and the relative importance of the various actions will vary across organizations
    (two organizations that share an enumeration may have different priorities).


    To develop the cyberdefensive actions that are appropriate for a given organization,
    we recommend a process that iterates between measuring actual resource allocation
    and subsequent modification of prescriptive resource allocation. The measurement
    phase should involve quantifying the actual allocation of cyber resources, including
    personnel and financial resources. In essence this phase would generate a sunburst
    diagram based on current resources. In addition to measuring allocated resources,
    this phase should include a measure of unwanted cyber activity (e.g., attack attempts,
    successful attacks, losses incurred) over a designated period of time. In the
    modification phase, changes to the allocation of resources should be made. This
    may involve dephasizing and/or expanding actions and adding/removing other actions,
    as appropriate. Upon completion of the modification phase, the measurement phase
    should be repeated, and the process should continue to iterate accordingly. This
    approach can serve as a useful mechanism for optimizing the cyberdefensive strategy
    of a given organization.'
