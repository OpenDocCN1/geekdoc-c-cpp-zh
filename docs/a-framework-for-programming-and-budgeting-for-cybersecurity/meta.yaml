    # 第一章


    # 动机


    网络战爱好者（以及防御的悲观主义者）喜欢引用爱尔兰共和军成员在布莱顿的格兰德大酒店刺杀首相玛格丽特·撒切失败后给出的警告：“我们今天只是运气不好，但请记住，我们只需要一直保持幸运就好。”这一警告不仅适用于网络安全，而且从防御者的角度来看，在网络语境下可能比攻击者的处更为严峻。其次，计算系统极其复杂（在组件集成方面），以至于许多访问点对于所有者来说都是未知的。第三（可能最重要的），计算系统是动态的，与其物理实体相比，更容易受到攻击。首先，计算系统高度连接，为攻击者提供了许多访问点。其次，计算系统是动态且不断变化的，新的安装和应用程序升级加剧了这种连接性和复杂性。网络安全专业人员永远无法休息。


    结果是，在网络空间中，黑客攻击可以有多种选择，防御者必须准备好应对所有可能的攻击。考虑 2014 年 9 月公布的针对家居（Home Depot）的网络攻击，该攻击使用了多个攻击点来恶意入侵，包括盗取的供应商凭据、利用微软操作系统漏洞、入侵公司的销售点系统以及控制自助结账系统。为了避免此类攻击所需的防御准备和响应涵盖了广泛的可能性，包括保持软件系统更新以最大限地减少漏洞、安装有效的工具来拦截已知攻击类型、鼓励员工和供应商使用适当的密码并教育他们防范社会工程学，以及记录活动以便于事后取证。每项活动单独来看通常是可行的，在某些情况下也容易执行。然而，不采取活动（或仅采取部分活动）的代价足以保证网络空间的安全。


    鉴于此，并非所有组织都在资源充足的情况下运行，执行所有行动的前景是不现实的（甚至让人应不暇），在实践中，许多首席信息安全官（CISO）认为执行多项安全措施的成本是非线性增长的。因此，网络安全专业人员面临选择一组安全防御措施的困境，其总和必须根据实用性而非最优性进行选择。在这么多可能性中做出选择并非易事。


    + 1 David Hughes，“布莱顿炸弹：每日电报记者回忆，《每日电报》，2009 年 10 月 11 日。

    + 2 Shelly Banjo，“家居中心黑客泄露了 5300 万个邮箱地址，《华尔街日报》，2015 年 11 月 6 日。


    # 2 网络安全规划与预算框架


    作为负责保护国家非防御网络安全的联邦机构，美国国土安全部（DHS）也面临着制定和建议网络防御策略的这一严峻挑战。对于 DHS 而言，这一挑战尤为艰巨，因为
    DHS 必须影响的网络很大程度上由私人公司拥有和运营。DHS 没有强制标准的权限，因此它必须很大程度上依赖于建议，鼓励提供者符合有效的安全标准，特别是一般的最佳实践。这并不是说
    DHS 在保障国家网络安全方面没有负面影响。它拥有资源（2015 年总统预算中为 382 亿美元）、不断增长的研发（R&D）计划，以及对其管理的广泛使用的网络（.gov
    域名）的网关服务的控制。2011 年，DHS 领导层指导进行了全面的部门审查，研究其在实施保护网络安全章程方面面临的挑战。生成的报告《安全未来蓝图》（Blueprint
    for a Secure Future）概述了敌对势力、操作错误和软件设计缺陷等挑战。DHS 蓝图识别了 75 项能够增强网络安全的能力（其中“关键”）。


    在此前为 DHS 安全首席财务/计划分析与评估部（DHS CFO/PAE）准备的一项研究中，虽然兰德学院获得了许多有用的见解，但它没有为 DHS CFO/PAE
    提供一个如何在竞争项目之间分配有限资源的决策分析框架。使用 DHS 蓝图作为规划和预算框架的一个挑战是，这些能力是以列表形式呈现的。这导致了若干困难：


    - 缺乏能力间的关系：很难从 DHS 蓝图中确定任何两种能力如何相互依赖或相互影响。

    - 缺乏优先级排序：除了优先和非优先能力的区分外，DHS 蓝图没有提供优先考虑能力重要性的机制。

    - 信息缺失：DHS 蓝图试图呈现一份全面的能力列表，但非核心活动的作用和影响没有被捕捉。


    在上述背景下，本报告的目的是提供一种组织用于解决这些困难的方法，并帮助解释防御组织遭受网络攻击的行动方案。尽管如此，没有任何一个组织会在没有对其需要防御的内容以及防御紧迫程度进行事先反思的情况下就投入这种方法的。例如，如果我的网络中有信息，我能承受得起损失吗？哪些是我承受不起损失的？丢失信息的后果是什么——我的声誉是否受到影响、我的新产品上市能力如何、员工的隐私如何？谁可能对此感兴趣？为什么？多多严重？


    > 3 U.S. Department of Homeland Security, Blueprint for a Secure Cyber Future:
    The Cybersecurity Strategy for the Homeland Security Enterprise, Washington, D.C.,
    2014.


