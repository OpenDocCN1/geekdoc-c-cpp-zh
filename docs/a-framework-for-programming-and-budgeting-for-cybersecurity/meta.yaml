  md: 'Take resilience steps: This combines a number of specific steps (enumerated
    in the next ring). This particular general action is an example of a container
    made up of specific actions—rather than something that cannot take place or cannot
    take place as effectively until specific actions occur.


    Conform to resilience guidelines: This action assumes the existence of guidelines
    that have been developed to influence and guide resilience actions. This action
    speaks to the importance of determining the actions taken by the organization
    are consistent with and adequate for meeting such guidelines.


    Improve cross-system engineering: An important element of resilience is managing
    cross-system dependency, minimizing the likelihood that faults in one subsystem
    can propagate through other subsystems, and reducing single-point failures (as
    well as common-mode failures).


    # Ring 2: Accelerate Recovery


    Although the speed of a recovery from a cyberattack can only be known after the
    attack takes place and crucially depends on exertions in the recovery phase, experience
    (notably with other sources of system failure) suggests that many actions prior
    to an attack can hasten the speed and lower the costs of a recovery. Accordingly,
    the general action of accelerating recovery can be facilitated if organizations
    take the following specific actions:


    +   * Generate rapid response plans.

    * Increase response competence.

    * Build the ability to restore systems.

    * Install systems to detect attacks quickly.

    * Develop methods to rapidly isolate infected systems.

    * Clean out malware from the system.


    This portion of the Cyber Subhorst Graph is shown in Figure 3.4.


    Figure 3.4

    The "Accelerate Recovery" Strategy with Actions


    ![](img/c82d4b10a7f527c659ee1a33fec0b4d8_35_0.png)'
