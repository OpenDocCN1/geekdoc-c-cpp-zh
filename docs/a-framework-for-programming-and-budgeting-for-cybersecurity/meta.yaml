    ## 14 A Framework for Programming and Budgeting for Cybersecurity


    Reduce the number of networked machines: The fewer devices that can be addressed
    via the Internet, the smaller the attack surface of an organization. Alternatives
    making such devices local to a particular machine (e.g., a printer that connects
    only to one computer) or more, making them locally rather than globally accessible.
    Machines that contain essentially sensitive assets should be disconnected for
    air-gapping. An air-gapped system is one not connected in real-time to the Internet
    and/or phone system (or other systems so). Strictly air-gapped systems are those
    without intermittent connection (e.g., via thumb drives) and close communications
    (e.g., via Bluetooth, Wi-Fi). CISOs talk about achieving the same level of security
    with virtual air-gapping (e.g., connections among two systems which communicate
    encrypted traffic across the Internet), but virtual air-gapping is only as safe
    as the requisite protocols are.


    Reduce the number of network access points on networked machines: Network-accessible
    computers contain several resources (virtual ports, applications, services) that
    can provide external access. Examples include file transfer protocol (FTP) and
    web application services. This activity limits these points of access. Counterexample
    is a networked printer exposed to the Internet with all of its ports open (e.g.,
    an attacker can Telnet into it). A variation on activity involves using nonstandard
    ports for important network applications (configuring SSH [Secure Shell] with
    a TCP [Transmission Control Protocol] port other than 22, for instance).


    Reduce the amount of computational resources on networked machines: When an external
    actor gains access to a computer node, that''s computational resources become
    access points through which a hacker''s reach can be extended. Any process for
    exploitation on a commanded machine is a potential risk. The fewer processes that
    can be exploited and legal commands that can be exchanged among machines, the
    harder it is to mount an external (or internal) attack on a machine, and the more
    difficult it is to use the infected machine as a platform to infect others. A
    related tactic is to reduce the physical resources (e.g., processors, memory)
    on exploitable machines. Thin-client machines do less internal processing than
    desktop machines typically do. For example, many organizations are replacing desktop
    machines with tablet computers where the additional resources and costs are unnecessary;
    as a side effect, the corresponding cybersecurity risks are lessened. This reduce
    attack surface also acts under the well-known cybersecurity principle of “least
    privilege” which states that at any given time, each user or process in a computer
    system should be able to access only the information and resources that are essential
    to that user’s work.


    Minimize the amount of sensitive data on networked machines: Sensitive data includes
    personally identifiable information as well as strategic organizational information
    that would pose a threat if unauthorized access were gained. Minimizing exposure
    can be achieved by placing such data on machines that are more isolated from the
    Internet (and from potentially rogue insiders). It can also be done by not collecting
    (or collecting but not digitizing) certain data in the first place.


    > J. H. Salt and M. D. Schroeder, “The Protection of Information in Computer Systems,”
    Proceedings of the IEEE, Vol. 63, No. 9, September 1975, p. 1278–1308; see also
    http://en.wikipedia.org/wiki/Principle_of_least_privilege.


    ## Ring 2: Neutralize Attacks


    The challenge of deflecting and defeating attacks is both central to the task
    of minimizing the expected costs of cyberattack and the source of the greatest
    number and diversity of more specific actions (more accurately, classes of actions)
    entailed in a more general action. Accordingly, the Cyberburst Graph identifies
    the following actions as collectively encompassing the variegated efforts needed
    to protect systems from attack:


    - Reduce the number of cyberattack attempts.

    - Develop mitigations for specific known threats.

    - Block cyberattacks.

    - Ensure the quality of software and hardware components in the network.

    - Systematically reduce risks inherent in the network.

    - Improve the security-related competence of system administration.

    - Test system defenses against simulated attacks.

    - Reduce the amount of material infiltrated in attacks.

    - Increase distributed denial of service (DDOS) defenses.

    - Counter the insider threat.


    This portion of the Cyberburst Graph is shown in Figure 3.2. Many of the actions
    listed above (the first eight) are related to operational hygiene in that they
    involve preventative best practices that minimize an attacker''s ability to exploit
    a computing system. A poorly managed system where these measures have not been
    taken becomes easy prey. In contrast, DDoS and insider threat defenses are necessity
    regardless of an organization''s computational best practices. The reader should
    also be reminded that these actions are attempts at neutralizing attacks; there
    are no guarantees that these actions will be successful.


    *Reduce the number of cyberattacks:* This action addresses the environment in
    which hackers operate and extends beyond the confines of a single organization.
    Reducing the incentive for hacking and availability of hackers is rarely a CISO
    responsibility, since it entails public policies associated with prosecution and
    deterrence. CISOs might contribute by convincing hackers that going after their
    organization entails a great deal of frustration (deterrence by denial) or risk
    (e.g., via hack-backs).


    *Develop mitigations for specific known threats:* This action starts with information
    on specific threats. These mitigations support various elements of defense, such
    as sandboxing bad packets (e.g., by developing new signatures for an intrusion
    detection/prevention system) or countering attacks in progress (e.g., by detecting
    network behaviors characteristic of attacks coming from particular threats).²


    *Block cyberattacks:* This action tries to prevent an attack from gaining hold
    on a network. These defenses may take place at an organization''s borders (e.g.,
    at the firewall) or at the client device. These defenses include automatic detection/eradication
    and user-aided defenses (e.g., not clicking on suspect).


    > ² In a cybersecurity context, sandbox a piece of code is to execute it in a
    restricted environment, where the resources it can interact with are limited and
    the harm can be contained. For more information, see https://en.wikipedia.org/wiki/Sandbox_(computer_security).


    ## Ring 2: Increase Resilience


    Increasing resilience involves preparing an organization so that it is minimally
    affected if a cyber attacker is successful. It is supported by the following more
    specific actions:


    - Take (specific) resilience steps.

    - Conform to resilience guidelines.

    - Improve cross-system engineering.

