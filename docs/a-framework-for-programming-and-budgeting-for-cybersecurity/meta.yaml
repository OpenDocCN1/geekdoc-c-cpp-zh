    # Figure 3.2

    The "Neutralize Attacks" Strategy with Actions


    ![](img/c82d4b10a7f527c659ee1a33fec0b4d8_33_0.png)


    Ensure the quality of software and hardware components in the network: Systems
    are hacked because they have vulnerabilities (although a vulnerability-free system
    may be encounter risks from protocol weaknesses). Eradicating or at least reducing
    the number and criticality of vulnerabilities makes systems harder to compromise.


    Systematically reduce risks inherent in the network: Although this action might
    come under "Ensure the quality of software and hardware components in the network,"
    it entails a broader examination of all weaknesses, including those that might
    creep in after they have (or appear to have focused on) eradicated. This action
    is focused on system management more than system improvement.


    Improve the security-related competence of system administration: Better system
    administration means better defense and requires better system administrators.
    This action was listed separately because improving the quality of personnel feeds
    not only most of the actions under stopping attacks but also certain actions under
    "manage exposure," "improve resilience," and "accelerate recovery."'
