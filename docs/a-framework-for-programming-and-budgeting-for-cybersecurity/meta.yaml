    \ DHS 蓝图能力 18。\n\n- 中和攻击 → 提高安全性 → 提高网络安全能力：对网络安全专业人员的教育有助于确保拥有学位的人具备所需的技能组。此行动包含四个部分：\n\
    \    - 吸引优秀人才进入网络安全：薪资质量、工作条件和地位具有很大影响。\n\n- 招募外国人不仅意味着与他们接触，改变移民法律和政策将让他们留下来。在联邦政府内部留住优秀网络安全工作人员是一项挑战，特别是对于那些在私营部门可以赚更多钱的人。如上所述，薪资质量、工作条件和地位具有很大影响。\n\
    \n- 激励机制以诱导人们接受网络安全教育是 DHS 蓝图能力 10.2。一项大型的“服务换学金”计划吸引了超过 1000 名学生主修网络安全专业，随后他们进入联邦政府工作。其他激励措施可能包括提高网络安全专业的地位、允许某些特权或保证第一份工作。\n\
    \n- 黑客马拉松是一项参赛者竞争防御系统免受攻击的比赛。相对廉价的比赛可以提高网络安全的知名度（“酷炫”因素），并可能让人们考虑将网络安全视为一种职业。\n\
    \n## 改进网络安全专业人员的教育\n\n这项行动有助于确保拥有学位的人具备所需的技能组。这项通用行动可以通过两个辅助行动进一步推进：\n\n- 开发严谨的网络安全课程\
    \ DHS 蓝图能力 10.1。美国国家安全局（NSA）处于领先地位，与其学术界的伙伴合作开发严谨的网络安全课程，特别是那些被指定为学术卓越中心的课程。\n\
    \n- 安全专业人员的认证，DHS 蓝图能力 10.4，是指如 CISSP（注册信息安全专家）等认证，以及来自特定公司（例如微软、思科）的认证。人们认为此类认证与专业知识相关，尽管其他机构如国家研究院认为网络安全是一种职业，尚未准备成为一种职业。\n"
