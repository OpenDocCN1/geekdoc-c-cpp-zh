    \n- Resilience $\\rightarrow$ Conform to resilience guidelines $\\rightarrow$\
    \ Write resilience standards entails both developing the knowledge of what actions\
    \ best (or most cost-effectively) promote resilience-\n"
  mdcn: "\n\n**采取韧性步骤**：这结合了许多特定步骤（在接下来的环路中列出）。这一特定的通用行动是由特定行动组成的容器示例——而不是某种无法发生，或者在特定行动发生之前无法发生或无法有效发生的事物。\n\
    \n**符合韧性指南**：此行动假设已经开发了相关指南用以影响和引导韧性行动。此行动强调了确定组织所采取的行动与此类指南保持一致并足以满足此类指南的重要性。\n\
    \n**改进跨系统工程**：韧性的一个重要要素是管理跨系统依赖关系，最大限度地减少一个子系统的故障传播到其他子系统的概率，并减少单点故障（以及共模态故障）。\n\
    \n## 环 2：加速恢复\n\n虽然从网络攻击中恢复的速度只有在攻击发生后才能知道，且关键取决于恢复阶段的努力，但经验（特别是针对其他系统故障源的经验）表明，在攻击之前的许多行动可以加快恢复速度并降低恢复成本。因此，如果组织采取以下特定行动，就可以促进加速恢复这一通用行动的实现：\n\
    \n- *制定快速响应计划。*\n- 提高响应能力。\n- 构建恢复系统的能力。\n- 安装快速检测攻击的系统。\n- 开发快速隔离受感染系统的方法。\n\
    - 清除系统中的恶意软件。\n\n网络 Subhorst 图的这部分如图 3.4 所示。\n\n图 3.4\n带有行动的“加速恢复”策略\n\n![](img/c82d4b10a7f527c659ee1a33fec0b4d8_35_0.png)\n\
    \n**制定快速响应计划**：为了做出响应，有一个计划是有帮助的；为了快速响应，有一个能够迅速动员活动的计划是有帮助的。此行动反映了一种预期：快速响应计划可以被写下来、发布并由外部人员进行评估。\n\
    \n**提高能力**：这是响应中的人员管理部分。它要求拥有具备所需决策权以及足够知识和培训的胜任人员。\n\n**构建恢复系统的能力**：恢复系统的能力在某种程度上取决于系统恢复到其之前配置的能力（无论为了防止快速灾难需要哪些特征）。正如系统可以设计得使得维修变得更容易或更困难（例如，火花塞是否易于触及？），系统也可以为了更快速或更慢的恢复而构建。\n\
    \n**安装快速检测攻击的系统**：这种恢复方法专门针对网络攻击（因为攻击是有目的地进行的，或者至少以概率速率扩散），检测得越快（假设其是有目的地进行的或至少以概率速率扩散），停止得越快，相应对可用性或系统本身的损害就越小。注意，这是特定能力的一种特殊情况，该能力也可以支持减少网络攻击频率和后果的零环目标。\n\
    \n**开发快速隔离受感染系统的方法**：这种特定能力假设相关攻击已被检测。鉴于对非瞬时发生的攻击的检测和充分表征，允许解耦的方法可以实现故障隔离，反过来限制了恢复过程所依据的受损基准。\n\
    \n**清除系统中的恶意软件**：恢复阶段的一个关键方面（再次，专门针对网络攻击）是确保任何导致系统崩溃的因素都不会出现在网络中以重复该行为。清理阶段有时比系统性地恢复功能所需的时间长，但它通常会导致期间性能下降，因为网络连接受到限制，以确保清理期间防止再次感染。\n\
    \n## 环 3\n\n在考虑环路 1 的四个行动（加速恢复、提高韧性、最小化暴露和中和攻击）时，中和攻击与网络安全唯一相关；而韧性、恢复和（程度稍低的）暴露最小化都是可能为了除网络安全之外的其他原因而采取的行动，例如为停电或自然灾害做准备。我们的工作是受网络安全驱动的（而不是系统管理），我们对阻止攻击的特定行动有更多细节。此外，暴露控制、恢复和韧性项下的许多特定行动取决于被防御系统的具体细节，因此未显示。相比之下，特定于网络安全的行动可以跨系统泛化（部分是因为许多软件是标准化的）。\n\
    \n因此，当人们从网络旭日图（Cyber Sunburst Graph）中心外移动时，遇到的更多行动将是中和攻击行动的后代。此外，由于中和攻击的切实性和紧迫性，相应的父子关系由行动-前提链接（一个通用行动需要特定行动）主导，而不是组合关系（一个通用行动由许多特定行动组成）。由于这些原因，我们通过深度优先搜索顺序展示环\
    \ 3 的行动，而不是环 2 的广度优先搜索方法。\n\n## 环 3：韧性 $\\rightarrow$ 采取韧性步骤\n\n“采取韧性步骤”下的附属行动列举如下：\n\
    \n- *韧性* 采取韧性步骤 $\\rightarrow$ 添加通道：冗余通信通道允许组织在主通信通道遭受网络攻击时仍能运行（尽管服务水平有所降低）。注意，冗余可能会受到影响。许多进入同一个路由器或通过公共物理管道的连接对于上游攻击几乎没有冗余性。\n\
    - *韧性* 采取韧性步骤 $\\rightarrow$ 开发优先处理通信的程序：美国军事组织开发了 MINIMIZE（正式名称）程序，以确保在通道受限时，关键信息优先于非关键信息。\n\
    \n> 1 Partnership for Disaster Resilience, Post-Disaster Recovery Planning Forum:\
    \ How-To Guide, 2007.\n\n> 2 “Depth First vs. Breadth First,” Github.com, 2012.\n\
    \n缺乏足够通道的组织可能会采取类似的措施。\n\n- *韧性* 采取韧性步骤 $\\rightarrow$ 创建备用电源：电电力是一切一切的基础，大多数\
    \ IT 电力由持续电源提供（注意，即使是电池供电的系统，为了给电池充电，也对持续电源有间接依赖）。因此，对组织电源供应的威胁很少发生，一旦发生，很少有做好准备的组织能够运行。在此行动下有两个特定行动：\n\
    - 安装备用电源。\n- 练习使用备用电源。\n\n测试备用电源的操作和使用的重要性再怎么强调也不过。在《常态事故》（Normal Accidents）中最强有力的信息之一是，备用的存在限制了灾难概率的假设是如何频繁被备用能力的失效所违反的而这些能力推测从未被使用过，因为它们，\n\
    \n> 3 Charles Perrow, Normal Accidents: Living with High-Risk Technologies. \n\
    \n- *采取韧性步骤* $\\rightarrow$ 根据需要创建复制资产：此行动是上述行动的更通用版本。它可能指的是物理通道、办公设备、机械等。\n-\
    \ *采取韧性步骤* $\\rightarrow$ 开发并使用不可删除备份：备份数据是组织在面对灾难时保持业务连续性采取的最基本的步骤之一。许多组织投入了大量资源来确保在任何给定点，备份都是与其使用的主文件的精确副本。对“不可删除”的强调是为了防止旨在删除（或更改）历史记录的潜在网络攻击。在实践中，这引发了如何保护或至少最小化在归档之前存储信息的电子缓冲区的问题。\n\
    - *采取韧性步骤* $\\rightarrow$ 使易于切断性能的子系统：危险在于受攻击的系统可能会开始向其他系统发送数据，其数量或质量会对这些系统产生风险。切断这些通信（或直接将此类系统下线）的能力可以为级联故障提供某些隔离。\n\
    - *采取韧性步骤* $\\rightarrow$ 记录理解步骤的原理：此类文档有助于评估（如果理解了步骤的原理，就可以根据底层条件修改这些步骤）、培训以及建立管理或更改硬件软件的基准。\n\
    \n- 韧性 $\\rightarrow$ 符合韧性指南 $\\rightarrow$ 编写韧性标准涉及开发关于哪些行动最好（或最具成本效益）促进韧性的知识-\n\
    \n"
