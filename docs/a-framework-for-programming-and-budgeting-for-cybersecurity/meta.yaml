    processes and designs is National Strategy for Trusted Identity in Cyberspace
    (NSTIC) governance of the design of identity management systems.


    - Neutralize Attack → Ensure the quality of a system''s hardware and software
    → Adopt security-enabled hardware and software: The adoption of security-enabled
    hardware and software is DHS Blueprint capability 12.2. This is largely a matter
    of choosing hardware and software that has high levels of security, either as
    a default or as an option.


    - Neutralize Attack → Ensure the quality of a system''s hardware and software
    → Develop acquisition processes to ensure delivery of trustworthy components:
    The development of acquisition processes of trustworthy components entails an
    ability to frustrate potential supply-chain attacks, by deliberate insertion of
    rogue elements or by a failure of component designers to pay sufficient attention
    to security so that vulnerabilities in code and protocols are readily found by
    hackers.$23$ Under this more general action are specific ones:


    - Developing procedures to trace components in the supply chain is a matter of
    generating and adopting best practices for supply-chain risk management. The latter
    involves vetting suppliers (and passing such requirements as far as necessary)
    and chain-of-custody to prevent rogue components from being substituted for trusted
    ones.


    - Developing regulations to manage the risk from incompatible components creates
    best practices for government agencies and those regulated by the government (at
    this point, largely defense contractors whose behavior is a function of the contracts
    they sign). This is clearly a government, not a CISO, organization.


    - Avoiding the use of risky components is a matter of will (risky components cost
    less or perform worse) and information (on what components are risky). Under this
    general action is an important prerequisite that there is a source of reliable
    information on which components are, in fact, risk. To find windings of corrupted
    products would have to be broadcast (by the House Intelligence Committee$^{24$),
    but without evidence of a smoking gun, at least within its classified report.
    Similarly, official testimony that tampering did not say who did it.$25$


    - Neutralize Attack → Ensure the quality of a system''s hardware and software
    → Improve the knowledge behind the engineering of software and hardware cards
    for general improvements in people and tools behind the construction of logic-processing
    components, machines, and systems. The people side is based on education, training,
    up-to-date information, and best practices. Tools should facilitate building security
    into products from design. Several specific actions are components of this broader
    action:


    > 23 Although some types of supply-chain flows are clearly deliberate (e.g., if
    a special code is entered, the system exhibits unexpected behavior). By many flows—as
    a product from the factory that is already infected by malware—could be either.
    See, for instance, Gregg Geiger, “Best Buy Sold Infected Digital Pictures,” Computerworld.com.
    January 23, 2008.


    > 24 Mike Rogers and C.A. Dutch Ruppersberger, Investigative Report on the U.S.
    National Security Issues Posed by Chinese Telecommunications Huawei and ZTE, Washington,
    D.C.: U.S. House of Representatives, October 8, 2012.


    > 25 Josh Smith, “Homeland Security Official: Some Foreign-Made Electronics Compromise
    Cybersecurity,” Nationaljournal.com, July 7, 2011.


    Improving the knowledge of essentials entails inculcation of security knowledge
    and security responsibilities for system designers. They should teach these designers
    to think like a hacker and be constantly mindful that the features inserted into
    systems to make them more flexible or user-friendly (e.g., the so-called security
    hint) makes it easier for hackers (e.g., many of the answers offer public knowledge).
    This action is DHS Blueprint 8.1.


    - Development of a common body of knowledge is understood to be an academic endeavor
    towards a common set of materials (e.g., books, or as a set of commonly understood
    principles). A knowledge base on cybersecurity may work cost-effectively and do
    not so well can be put to immediate use by CISOs in protecting their networks.
    This is DHS Blueprint 8.2.


    - Best practices for incorporating security into software development is cousin
    to the development of security expertise in software development. This action
    is DHS Blueprint 12.3 and includes not just coding but also design, personnel
    management, testing, and inspection. Under this action is the help prerequisite
    of using and enhancing specific best practices, notably developed by MITRE/SANS
    on good coding techniques.


    - Encourage the use of good coding techniques.


    Encourage integrity for system architecture: Encouraging integrity for system
    architecture ensures secure deposits on design criteria as well as the quality
    of coding to ensure that code match design criteria. Examples include a comparison
    of Chrome versus Firefox (circa 2013) that concluded that the number of vulnerabilities
    in both code bases was comparable in terms of total quantity, the former had ten
    times fewer critical vulnerabilities because the browser session did not propagate
    to the rest of the computer''s software. Similarly, consider Apple versus Android
    (circa 2012), in which the former had many more vulnerabilities but far less malware
    as its closed ecology.


    - Neutralize Attack → Ensure the quality of a system''s hardware and software
    → Mitigate vulnerabilities in software: Mitigating vulnerabilities in software
    refers to the process of identifying and eradicating faults in software that have
    already been brought to the market, and in cases always installed. Systems are
    penetrated only because they have vulnerabilities. Some vulnerabilities are unknown
    to the software manufacturer (zero-day vulnerabilities) or have not been long
    enough for a fix to have been developed. For others, patches have not been installed.
    Although the hardest targets require a zero-day exploit, most targets do not.
    This action has several prerequisites: Fixing software vulnerabilities quickly
    and thoroughly does more for security than putting them off or scheduling them
    periodically but infrequently. This action is a combination of the following:


    > 26 Steve Christy, CWE/25 Most Dangerous Software Errors. The MITRE Corporation,
    September 13, 2011.


    > 27 Matthew Finster, David Wagner, "An Empirical Study of Vulnerability Rewards,"
    presented at USENIX Security, August 2013.


    > 28 Symantec Corporation, Internet Security Report 2013, Volume 18, Mountain
    View, Calif.


    Finding software vulnerabilities quickly and thoroughly is a matter of diligence
    on the part of software manufacturers. Progress at finding bugs can be helped
    by:


    - Encouraging software makers to invest more resources in postmarket bug detection
    may be a matter of cajailing, naming-and-shaming, or examining liability regimes
    that make software manufacturers responsible for the damage. However, the deployment
    of such tools has downsides (liability regimes are largely incompatible with open-source
    software, for instance).


    Creating software patches expeditiously is up to software vendors. The measure
    depends on the severity of the fault: e.g., how easy it is to convert it into
    an exploit, what privileges hackers can acquire by exploiting the fault, and whether
    the configuration that permits the exploit is common and/or rare and hard to induce.
    Serious vulnerabilities might be patched within days or weeks (as Heartbleed was);
    patch times for the more subtle flaws discovered via Tipping Point''s Zero-Day
    Initiative (zerodayinitiative.com) can take months. Oracle''s initial refusal
    to patch a serious Java vulnerability until their quarterly patch cycle (Oracle
    later accelerated its patch) convinced many cybersecurity analysts to recommend
    that users uninstall their Java client.


    Deploying tools that can fix vulnerabilities would facilitate automatic patch
    management. Such a tool would have to be so sophisticated to deal with software
    that might be broken by the patch (software becomes brittle that when it circumvents
    those functions that grant access to the operating system, browser, or key attributes
    in the software it sits on and codes directly to lower-level functions). Prerequisites
    to the deployment of such tools are as follows:


    > 29 A rogue charger can compromise an iPhone, but success at mounting an attack
    requires onsite presence and a careless user (Timothy Lord, "iPhone Hacked Under
    60 Seconds Using Malicious Charger," Slashdot.com blog, August 2, 2013).


    > 30 Brian Krebs, "Security Fix for Critical Java Flaw Released," KrebsOnSecurity.com
    blog, August 30, 2012.

