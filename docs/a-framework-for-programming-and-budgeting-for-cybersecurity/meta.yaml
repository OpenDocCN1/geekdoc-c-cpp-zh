  mdcn: "\n\n## 38 网络安全编程与预算框架\n\n- 工具的开发可能由供应商或开源社区承担。\n- 诀窍（know-how）的开发可能是一个组织内部职能。此项行动（DHS\
    \ 蓝图 2.6）的能力范畴比其在通用行动（部署工具修复漏洞）下的分类所指示的更广泛，但为了便于处理而将其置于此处。\n- 开发告知用户其设备/系统可能被感染的方法属于\
    \ DHS 蓝图 11.3。此类工具不仅允许用户了解其机器的脆弱性，而且在许多用户对安全漠不关心的情况下，类似的工具可以告知系统管理员哪些计算机需要升级。升级可以被理解为安装补丁（见下文），也涉及安全设置不当或违反策略的机器。对于关键物理基础设施（例如，监视控制与数据采集\
    \ [SCADA] 系统和其他机器），问题可能在于确定面向互联网的节点的存在和状态。\n- 采用工具寻找漏洞（而非软件漏洞）也有助于保持系统安全。这些工具可以作为更广泛的系统配置指南的一部分。\n\
    - **中立攻击**快速确保系统硬件和软件系统的质量：及时修补系统是必要的，前提是供应商提供的补丁确实有用。它具有以下两个前提条件：\n    - 在软件需要补丁时确定需要安装哪些补丁。在这一行动中，取决于直接或通过中介进行广播能力的开发。\n\
    \    - 开发自动管理补丁的软件属于系统管理问题。对于规模最大和或最复杂的组织，这可能来自软件供应商，而非内部开发。\n\n## 第 3 环：中立攻击\
    \ → 系统化减少网络固有风险\n\n这是系统的一个方面，要求对网络设置、协议、软件和策略进行持续审查和修订。它包含三个组成部分：\n\n- 中立攻击 →\
    \ 系统化地减少网络固有风险 **确保符合网络风险管理性能标准**：确保网络风险管理性能标准的得到满足，其在于确定是否以满意的方式履行了系统管理员应承担的性能标准（这些标准源于由美国标准与技术研究院\
    \ [NIST] 领导的自愿共识）。这本应是一项首席信息安全官 (CISO) 或更高级别的责任，也属于 DHS 蓝图能力 2.4。\n- 中立攻击 → 系统化地减少网络固有风险\
    \ **制定一系列缓解措施**：制定一系列缓解措施是将这些性能标准转化为可采取的行动。这需要对标准的了解、对网络缺陷的准确且及时的理解、修复缺陷的资源，以及获取缺陷修复并确保其确实修复所需的命令与控制。因此，可以识别出两个前提条件：\n\
    \    - **识别必要行动**：识别必要行动将对网络活动的实时报告转换为指示，即此类活动可能是漏洞（或更糟的敌对活动）的迹象，并转化为行动和里程碑计划，以快速且具有成本效益的方式解决缺陷。这一功能反过来涉及网络管理工具的使用；而工具本身是一项特定行动，它具有两个前提条件：\n\
    \        - **开发更卓越的网络管理工具包**：开发卓越的网络管理工具包很大程度上是供应商的责任，并辅以作为顾问和潜在买家的用户输入。这是 DHS\
    \ 蓝图能力 2.5。\n        - **开发网络管理工具的使用指南**：开发网络管理工具的使用指南更接近一组最佳实践指南。这一责任可以由供应商承担，尽管政府和/或专业团体也可以产生更多指南。这是\
    \ DHS 蓝图能力 2.2。\n        - **运行蓝队以确保行动执行**：蓝队确保缓解措施在系统、子系统和机器层面得到执行。随着时间的推移，技术应该允许他们工作的大部分实现自动化——前提是未与主网络管理系统连接的系统可能需要人工管理。\n\
    \    - 中立攻击系统减少网络固有风险 → **在成本效益高时引入新技术**：在成本效益高时引入新技术是确保组织在措施与反措施的持续斗争中具有自我保护能力的一种方式。新技术将使我们（例如）确保网络更新、检测敌对活动和干扰威胁行动变得更容易。这一行动有几个前提条件：\n\
    \        - **鼓励技术创新（以应对新兴威胁）**：整合了促进技术发展的通用联邦政策，包括资金支持、税收政策、知识产权法、市场研究以及创建联邦采购激励。这是\
    \ DHS 蓝图能力 16.6。\n        - **将研发重点放在关键优先事项上**：这是政府系统地评估需求并将资金投向其需要的地方的过程。这是 DHS\
    \ 蓝图能力 3.1。它具有两个前提条件：\n            - 评估研发的过程必然涉及多维度的比较，考虑到研发的目标。\n           \
    \ - 将研发优先化作为综合国家倡议 (CNCI; 白宫，2009) 引导网络安全研发向正确的方向发展。这是 DHS 蓝图能力 3.3。\n- 评估安全产品的能力需要专业知识、组织支持以及在安全产品之间进行比较的声誉。通常，NIST\
    \ 避免这样做，但它会认证可以胜此事的实验室。这是 DHS 蓝图能力 12.4。该能力的一个子组件是供应链风险管理的开发。\n- **将研发快速投入使用**：确保研发进展政策可能包括传播结果的方法、鼓励专业协会以及对技术采用的税收和监管优惠（这在网络空间之外可能有更广泛的适用性）。这是\
    \ DHS 蓝图能力 3.2。\n\n## 第 3 环：中立攻击 → 提高系统管理员的安全能力\n\n给予这一行动应有的重视（并保持 Sunburst 图形严格的层级结构），这一行动被视为是独立的，尽管它是几乎所有其他行动的输入。这一行动有几个前提条件：\n\
    \n- 中立攻击 → 提高系统管理员的安全能力 **改进系统管理员可以访问的信息**：改进系统管理员可以访问信息的动力说明了共同知识库的重要性以及信息共享的益处。虽然某些信息共享是从机器到机器的，但大部分信息必须经过理解后才能使用，因此目前流向人员。因此，改进系统管理员（并扩展到他们的系统）可以访问的信息至关重要。这些信息预计是针对特定威胁且实时的。这一行动有几个元素：\n\
    \    - **从相似组织收集攻击数据**：信息共享的关键要素。信息共享与分析中心 (ISAC) 的开发意味着相似的行业面临相似的威胁。这在某是正确的（某些行业有其特定的威胁，例如网络犯罪分子，某些行业共同具有可能脆弱的机器）；它也可能具有误导性，因为自动化系统是普遍相似的，因此它们脆弱以及可被利用的方式也是相似的。它具有两个前提条件：\n\
    \    - **提高共享信息的质量**：提高共享信息质量的一种方法是以标准格式化信息（并使用标准最小数据元素），以便让细节和重要方面得到准确共享；有了标准格式，目前仅以人类速度在人之间共享。\n\
    \n"
