    ### Goal: Reduce the Expected Cost of Cyberattacks


    Figure 2.1 Cyber Sunburst Graph

    (img/c2d4b10a7f527c659ee1a33fec04d8_24.png) [Note: Text placeholder for image]


    We posit that cybersecurity has an overarching goal: a reduction in the expected
    cost of cyberattacks. Several assumptions are packed into this goal. First, we
    use cost to mean impact, expressed in a quasi-monetized way; in some cases a cyberattack
    leads to an explicit monetary cost involving labor and/or computing resources,
    while in other cases the cost is less tangible (e.g., a military impact may not
    necessarily be reduced to dollars and cents). In truth, many of the risks, even
    for businesses, are hard to capture. Organizations look at lost reputation as
    a cost. Nations might measure reduced privacy or increased risks to national security.
    Second, we use "expected" costs to include the risk of low-likelihood, high-impact
    events, such as a cyberattack on the power grid or a military defeat. These stand
    in contrast to day-to-day costs arising from more common cyberattacks, as cyberterrorism.
    Third, many of the costs of even those cyberattacks that have already occurred
    are unknown and, today, unknowable. If a U.S. firm has its intellectual property
    stolen (e.g., by the Chinese), its share of global markets may not be reduced
    by competition from Chinese products until years, if then. We recognize that cyberattacks
    can have many effects. Some affect confidentiality; others affect integrity; still
    affect availability.


