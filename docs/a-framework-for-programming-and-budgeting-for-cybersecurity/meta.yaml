  md: '# Preface


    The U.S. Department of Homeland Security (DHS) has primary responsibility for
    the security of the nation''s unclassified cyber networks. To function, the nation''s
    economy and government have become increasingly dependent on reliable and secure
    networks, making this mission increasingly critical.


    This study examines the capabilities presented in the DHS Blueprint for a Secure
    Cyber Future and how these capabilities fit in within the context of broad set
    of cybersecurity activities that can be used to defend a network. This study recommends
    an approach to evaluating cybersecurity defensive activities.


    The study was sponsored by Program, Analysis, and Evaluation (PA&E) of the Office
    of the Chief Financial Officer, DHS. It will be of interest to policymakers and
    program managers who have responsibility for cybersecurity, particularly of the
    nation''s unclassified networks.


    This study builds on a broad set of studies that RAND has done in the fields of
    cybersecurity and of program analysis.


    # The RAND Homeland Security and Defense Center


    The research reported here was conducted in the Homeland Security and Defense
    Center (HSD), which conducts analysis to prepare and protect communities and critical
    infrastructure from natural disasters and terrorism. Center projects examine a
    wide range of risk-management problems, including coastal and border security,
    emergency preparedness and response, defense support to civil authorities, transportation
    security, domestic intelligence, and technology acquisition. Center clients include
    the U.S. Department of Homeland Security, the U.S. Department of Justice, and
    other organizations charged with security and disaster preparedness, response,
    and recovery.


    HSD is a joint center of two research divisions: RAND Justice, Infrastructure,
    and Environment and the RAND National Security Research Division. RAND Justice,
    Infrastructure, and Environment is dedicated to improving policy and decisionmaking
    in a wide range of policy domains, including civil and criminal justice, infrastructure
    protection and homeland security, transportation and energy, and environmental
    and natural resource policy. The RAND National Security Research Division conducts
    research and analysis for all national security sponsors other than the U.S. Air
    Force and the Army. The division includes the National Defense Research Institute,
    a federally funded research and development center whose sponsors include the
    Office of the Secretary of Defense, the Joint Staff, the Unified Combatant Commands,
    the defense agencies, and the U.S. Department of the Navy. The National Security
    Research Division also conducts research for the U.S. intelligence community and
    the ministries of defense of U.S. allies and partners.'
