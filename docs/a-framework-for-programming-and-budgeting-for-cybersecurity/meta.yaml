    \ procedures to prioritize communications: U.S. military organizations have developed\
    \ MINIMIZE (formal name) procedures to ensure that if channels are constrained,\
    \ critical messages get priority over noncritical messages.\n\n> 1 Partnership\
    \ for Disaster Resilience, Post-Disaster Recovery Planning Forum: How-To Guide,\
    \ 2007.\n\n> 2 “Depth First vs. Breadth First,” Github.com, 2012.\n\nOrganizations\
    \ that lack sufficiently channels might do something similar.\n\n- *Resilience*\
    \ Take resilience steps $\\rightarrow$ Create backup power sources: Electric power\
    \ underlies everything, and most IT power is provided for continuous power sources\
