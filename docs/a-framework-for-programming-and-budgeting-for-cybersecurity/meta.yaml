    联邦政府。我们相信本报告中提出的策略和行动会对公共和私营部门专业人士感兴趣。


    ### 目标：降低网络攻击的预期成本


    图 2.1 网络太阳射线图

    (img/c2d4b10a7f527c659ee1a33fec04d8_24.png) [注：图像占位符]


    我们认为网络安全有一个总目标：降低网络攻击的预期成本。这个目标包含了几个假设。首先，我们使用“成本”是指影响，并以准货币化的方式表示；在某些情况下，网络攻击会导致涉及劳动力和/或计算资源的显性货币成本，而在另一些情况下，成本是不那么具象的（例如，军事影响不一定还原为美元和分）。事实上，许多风险（即使对于企业而言）也是难以捕捉的。组织将声誉损失视为一种成本。国家可能会衡量隐私的减少或国家安全风险的增加。其次，我们使用的“预期”成本包含了低概率、高影响事件的风险，例如对电网的网络攻击或军事失败。这些与由于更常见的网络攻击（如网络恐怖主义）产生的日常成本形成对比。第三，即使是已经发生的网络攻击，其许多成本也是未知的，且在今天是不可知的。如果一家美国公司的知识产权被盗（例如被中国人盗），其在全球市场的份额可能不会因为中国产品的竞争而减少，直到几年之后，如果那时的话）。我们意识到网络攻击可以产生许多影响。有些影响机密性；有些影响完整性；仍然影响可用性。


