    Urbina，“黑客战术：将数据质质，”，《纽约时报》，2014年6月21日。


    ## 本工作的使用


    本报告中呈现的网络防御行动组织可以从两种基本方式使用：(1) 供评估网络安全策略实施情况的政府或企业组织对网络防御资源分配进行审计；以及(2) 在组织制定网络安全策略时作为一种考虑的规范性机制。这两种用途旨在供各种组织采用，我们相信这些用途对公共和私营部门实体都具有价值，无论实体规模大小（例如，大型和小型实体）。


    ## 审计机制


    网络防御策略的旭日可视化（sunburst visualization）有助于评估组织内部网络防御资源的分配情况。我们为美国国土安全部（DHS）CFO/PA&E
    工作的关键动机，也是决定计划有效性的因素。记录网络防御行动资源分配的规划部门（例如，用于其他行动的预算，如生成快速响应计划与未分配预算的其他行动之间的对比）可以审查这些分配，并视觉化地描述资源在可能行动集中的分布情况、过度暴露和暴露不足的行动，以及其他错配情况，这种方式可以在大型组织的多个管理层之间进行沟通。


    审计过程中将存在一些挑战，例如在同一维度上比较难以量化的行动。例如，“最小化暴露”行动可能并不一定与财务数量相关，而“阻止网络攻击”等行动（例如通过防火墙）则很容易与金额相关联。因此，取决于所选的审计机制，需要一种量化所有行动的合适方法。


    ## 规范性机制


    本文介绍的网络防御组织可以在制定网络防御策略时使用。本工作描述的行动以自上而下的层次结构呈现，可指导首席信息安全官（CISO）根据特定组织的需求识别适当的网络防御行动。需要注意的是，前几页中介绍的许多行动适用于所有组织，应根据需要采用。例如，对于提供医疗急救服务的组织（例如，为急救人员提供的关键基础设施），增加韧性的策略可能应优先于加速恢复的策略，因为增加韧性侧重于防止中断，而恢复则假设系统将会发生故障（尽管希望时间很短）。其他能够忍受停机的组织可能将恢复视为其策略的内核组成部分。同样，某些组织可能选择将“最小化不必要的暴露”作为关键策略（特别是当网络访问的便利性不是一项受重视的利益时），而另一些组织可能无法公平地参与这一策略，因为这可能违背组织的宗旨。对于评估“最小化暴露”策略的组织，我们建议对组织所考虑网络暴露的每类信息的
    Web 访问成本和收益进行仔细思考。


    ## 改进网络防御行动


    如前所述，报告中网络防御行动代表了选择和审查的迭代过程，尽管这一过程没有纳入显式资源分配的考虑。我们认为，所示行动的某些组件可能存在改进空间，以根据组织的特征得出定制的行动集。我们可以将呈现的行动视为一种枚举（行动的层次列表），并带有某种隐含的校准，该校准通过旭日图楔形的角度（优先级或分配策略）根据各行动相应的楔的大小来表明。正如前一节所示，具体的枚举和校准在组织之间会有很大差异，因为行动空间会随组织而异（两个组织通常不会共享相同的枚举），而且各种行动的相对重要性也会随组织而变化（共享相同枚举的两个组织可能有不同的优先级）。


    为了开发适用于特定组织的网络防御行动，我们建议一个在衡量实际资源分配和[文本截断]之间进行迭代的过程。


