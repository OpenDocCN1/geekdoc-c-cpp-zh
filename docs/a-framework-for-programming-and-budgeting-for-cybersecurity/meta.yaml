    Test system defenses against simulated attacks: Figuring out how a competent attacker
    can get is an important step for serious organizations. The results from such
    an exercise inform other actions that can mitigate attacks (or find the right
    level of exposure).


    Reduce the amount of material exfiltrated in attacks: This action comes into play
    if the attackers are wielding control over information they are looking for. It
    can include blocking material, as well as anything that the attacker doubt the
    value of the material taken.


    Increase DDoS defenses: A DDoS attack involves preventing legitimate use of a
    service by either disrupting or flooding the service. DDoS attacks are unique
    in that they can affect otherwise well-managed networks. The various defenses
    available increase the ratio of capacity to inflow and mitigating the ratio of
    processing/storage consumed to inflow levels.


    Counter the insider threat: Although the percentage of mischief in cyberspace
    perpetrated from the outside (rather than the inside) is higher than it was 20
    years ago (thanks to networking), the insider threat is still important, particularly
    for organizations that have taken pains to insulate themselves from the outside
    world (e.g., the National Security Agency [NSA]).


    # Ring 2: Increase Resilience


    Increasing resilience involves preparing an organization so that it is minimally
    affected if a cyber attacker is successful. It is supported by the following more
    specific actions:


    +   * Take (specific) resilience steps.

    * Conform to resilience guidelines.

    * Improve cross-system engineering.


    This portion of the Cyber Sunburst Graph is shown in Figure 3.3.


    Figure 3.3

    nThe “Increase Resilience” Strategy with Actions


