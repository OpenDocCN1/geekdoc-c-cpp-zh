    # CHAPTER THREE


    # Ring 2


    All ring 1 general actions are, in turn, supported by a variety of more specific
    ring 2 actions. We consider each in turn, starting with the action of reducing
    unneeded exposure.


    # Ring 2: Minimize Exposure


    We can organize the strategy of reducing unneeded exposure by considering the
    classes of physical and virtual assets that are subject to access (attack):


    +   - Reduce the number of networked machines.

    - Reduce the number of network access points on networked machines.

    - Reduce the amount of computational resources on networked machines.

    - Minimize the amount of sensitive data on networked machines.


    This portion of the Cyber Sunburst Graph is shown in Figure 3.1. As with the other
    strategies, many of these actions have the potential to impact an organization’s
    productivity. Hence, the associated trade-offs should be considered.


