    \ Accidents: Living with High-Risk Technologies. \n\n- *Take resilience steps*\
    \ $\\rightarrow$ Create duplicate assets where necessary: This action is a more\
    \ general version of the above action. It may refer to physical conduits, office\
    \ equipment, machinery, etc.\n- *Take resilience steps* $\\rightarrow$ Develop\
    \ and use un-erasable backups: Backup data is one of the most elementary steps\
    \ that organizations can take to preserve business continuity in the face of disaster.\
    \ Many organizations develop substantial resources to ensuring that, any given\
    \ point, the backups provide a precise duplicate of the primary files they are\
    \ using. The emphasis on the un-erasable is protection against a potential cyberattack\
    \ that aims to erase (or alter) past records. In practice, this raises the question\
    \ of how to protect or at least minimize the electronic buffer where information\
