  md: '# A Framework for Programming and Budgeting for Cybersecurity


    presented within sequential lists that do not emphasize dependencies—or cost-effectiveness,
    for that matter.²


    We organize the organizations via hierarchical decomposition. This decomposition
    assumes that any two activities that are directly related can be characterized
    as having a parent-child relationship. In our presentation, a parent-child link
    represents one of types of relationships: composition or requisition. In a composition
    relationship, the parent (or general activity) is an aggregation of two or more
    (specific) activities (e.g., a meal is modeled as a parent activity that is composed
    of a salad activity, an appetizer activity, an entry activity, and a dessert activity).
    In a requisition relationship, one or more (specific) activities must be completed
    (required) before the parent (or general) activity can take place (e.g., a meal
    can be modeled as a parent activity that only only after the activities of buying,
    cooking, and serving have occurred). The distinction between composite and requisite
    hierarchy is applied on an as-needed method, and may depend on the reader’s interpretation
    of a set of activities; we raise the distinction principally to allow a flexible
    hierarchy. Inherent in our hierarchical decomposition is the notion that all activities
    have a single parent activity; in practice, this assumption does not hold in the
    context of cybersecurity, but for the purposes of our objective, such a constraint
    is not particularly limiting.


    A hierarchical decomposition approach lends itself to representation in many ways.
    We choose a sunburst graph in order to place the overlapping goal at the center
    of the graph and the various actions are successively at further from the center.
    Furthermore, the chart displays not only vertical relationships (parent-child)
    but relationships across branches. The sunburst chart represents in cinder ring.
    Ring 0 (the center of the ring) contains our overlapping goal of reducing expected
    cost of cyberattacks.³ Ring 1 contains strategies of strategies that support ring
    0, and, more generally, ring N+1 supports ring N. The illustration of the sunburst
    graph is displayed in Figure 1.¹


    The relative importance of each action is indicated by the magnitude of the given
    action’s weight with respect to peer actions. In the case of the four top-level
    strategies, “neutralize attacks” is allocated an angle of 180 degrees, “accelerate
    recovery” and “increase resilience” are both allocated an angle of 70 degrees.
    These angles are intended to serve as approximations of relative importance with
    a nod to prioritization more than precise allocation of resources (e.g., “neutralize
    attacks” is more important than “increase resilience,” which, in turn, is more
    than (“minimize expenses”).


    Our set of cyberdefense actions and the corresponding relationships were derived
    initially as hypotheses based on the authors’ experiences in conjunction with
    relevant literature review. Subsequently, an iterative process involving third-party
    expert review was used to refine the enumerations and relationships. The relationships
    and actions we present throughout this report are meant to be illustrative; valid
    approaches to specifying these could be been developed through one of multiple
    approaches (such as empirical evaluation of incident data with a specific system,
    demand expert elicitation, or analysis of budgets). The value of this approach
    lies


    > ² U.S. Department of Commerce, National Institute of Standards and Technology,
    Security and Privacy Controls for Federal Information Systems and Organizations,
    Special Publication 800-53, 2013; U.S. Department of Energy, 21 Steps to Improve
    Cyber Security of SCADA Networks, 2009.


    > ³ We assume that the cost of cyberattacks is minimized within the context of
