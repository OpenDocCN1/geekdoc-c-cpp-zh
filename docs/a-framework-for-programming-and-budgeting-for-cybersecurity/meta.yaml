    \n- 生成稳健的信息分发流程：拥有稳健的信息传播流程（DHS 蓝图能力 7.1）应该通过消除共享决策与实际共享之间的障碍来促进信息共享，并确保共享给组织的信息到达内部正确的人手中。\n\
    \n- 为信息共享协议开发标准化语言：为信息共享协议开发标准化语言（DHS 蓝图能力 6.4）将通过消除词汇层面的差异并向签署者保证其他人也已达成类似的协议，从而更容易制定此类协议。\n\
    \n- 收集针对所有人的攻击提示：为了从他们的“表兄弟姐妹”（同行）那里收集信息，组织也可以从圈子之外的人那里收集提示中获益。这些提示范围从最佳实践到潜在威胁活动的迹象和警告不等。这涉及两个因素：\n\
    \n- 提高提示的质量（DHS 蓝图能力 11.1）涉及开发工具和技术以减少误报，并专注于那些更有可能且特征更明确的攻击迹象。\n\n- 增加数量意味着找到方法让个人和组织对什么是提示更加敏感，更愿意提交他们的提示，并更有能力以获得适当关注水平的方式和通道呈现他们的信息。这需要增加公众对网络安全提示需求的意识，这可以被看作网络安全领域的“如果你发现了异样，请说出来”。这种转变将通过有效的风险有效沟通策略（DHS\
    \ 蓝图能力 7.3）得到促进，即利用社交媒体和其他媒体来促进风险和提示信息的增加。\n\n- 为利益相关者生成信息以允许自动响应：为利益相关者生成信息以允许自动响应（DHS\
