  md: '# 6 Framework for Programming and Budgeting for Cybersecurity


    not be merely reduced to components. In what follows, one will see general actions
    whose realization is more than the sum of their prerequisites or components.

    A hierarchical decomposition approach lends itself to representation in many ways.
    We chose a sunburst graph in order to place the overarching goal at the center
    of the graph and the various actions successfully further from. Furthermore, the
    chart displays not only vertical relationships (parent-child) but relationships
    across branches. The sunburst chart results in a ranged arrangement. Ring 0 (the
    center of the chart) contains our overarching goal of reducing the cost of cyberattacks.
    Ring 1 consists of strategies to protect ring 0, and, more, ring N+1 supports
    ring N. An illustration of the Cyber Sunburst Graph is displayed in Figure 2.1.

    The relative importance of each action is indicated by the angle of the action''s
    wedge with respect to peer actors (other children of a common action). Wedges
    with larger angles are considered more important than those on the same ring with
    smaller angles; for example, as shown in Figure 2.2, “neutralize attacks” has
    a larger angle than “increase resilience” and therefore is considered a more defensive
    strategy. The angles provide a basis for allocation of resources across a set
    of cybersecurity actions under consideration and are essentially represented in
    a sunburst diagram. The angles shown in the figures follow that serve as approximations
    of relative importance with a nod to prioritization more than precision.

    Our set of cyberdefense actions and the corresponding relationships were derived
    initially as hypotheses based on the authors'' experiences in conjunction with
    relevant literature review. Subsequently, an iterative process however helped
    refine the enumerations and relationships. The value of this approach lies not
    in the precision of the outcome but rather in the underlying logic of the structure
    and interconnections of cyberdefense actions. Any cyberdefense specialist may
    quibble with the details at the margins of the chart (and some of the quibbling
    may be sector-dependent), but application of this approach will still provide
    useful insight. More importantly, our approach does not depend on the specific
    list of actions presented in the sections of this report, or on the relative size
    of the actions. The actions we present throughout this report are to be evaluative;
    various approaches to specifying these could be developed through one of multiple
