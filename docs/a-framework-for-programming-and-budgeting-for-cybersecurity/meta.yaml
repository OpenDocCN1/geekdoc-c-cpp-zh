  md: 'Ring 3 45


    +   * Neutralize Attack → Test systems against simulated attacks Use the results
    to prioritize subsequent investments: The last step, using results to prioritize
    subsequent investments, entails translating vulnerabilities found by what is invariably
    an elite set of hackers to vulnerabilities likely to be found by their potential
    attackers—and prioritizing investments to reduce risks appropriately. This action
    suggests two adjunct actions:


    +   * Find evidence of failed attacks that suggest the possibility of future successful
    attacks: Although successful attacks normally cause a reassessment of an organization''s
    security posture, that failed because of failures at the last step also indicate
    weaknesses in an organization''s security that allowed the attack to get as far
    as it did. Thus, evidence of failed attacks can suggest the possibility of future
    successful attacks.


    +   * Determine good investments as a result: Finally, CISOs can help determine
    good investments by examining the results of re-teaming and forensics on the system
    after failed attacks.


    # Ring 3: Neutralize Attack → Defend Against DDOS Attacks


    DDOS attacks are a particularly difficult (although not yet extremely costly)
    problem in cyberspace because the allow DDOS attacks are almost always in the
    systems of other people (e.g., individual bots) or institutions (e.g., many Wordpress
    accounts hijacked to permit DDOS attacks on banks in late 2012). There are two
    types of approaches that can be taken to reduce the impact of DDOS attacks.


    +   * Neutralize Attack → Defend against DDOS attacks Adopt counter-DDOS policies:
    Counter-DDOS policies are the province of the federal government. They might include
    measures that could include, if deemed cost-effective, the following:


    +   * Holding Internet service providers responsible entails requiring them to
    detect infected computer users (presumably by looking at how many bytes they send
    out) and giving them the choice between cleaning their infections or losing Internet
    service. This would have to be a worldwide policy to do so much.


    +   * Minimizing unnecessary redirection services matters because many large DDOS
    attacks are carried out by sending small packets to redirection services, such
    as network protocol, with the (falsified) return address of the target. The redirection
    service then sends packets back to the target.


    +   * The importance of providing DDOS mitigation to small sensitive sites arises
    because many victims of DDOS attacks are nongovernment organizations who are taking
    on powerful but authoritarian or corrupt governments. This mitigation can be achieved
    by hosting their sites on powerful networks.


