    # 前言


    美国国土安全部（DHS）对国家未分类网络网络的安全负有主要责任。为了运行，国家经济和政府日益依赖可靠且安全的网络，这使得这项任务变得越来越关键。


    本研究审查了《安全网络未来蓝图》（DHS Blueprint for a Secure Cyber Future）中提出的能力，以及这些能力如何融入用于防御网络的广泛网络安全活动背景中。本研究建议了一种评估网络安全防御活动的方法。


    本研究由国土安全部首席财务官办公室的计划、分析与评估（PA&E）部门赞助。它对负责网络安全（特别是国家未分类网络）的决策制定者和计划经理具有价值。


    本研究建立在 RAND 在网络安全和计划分析领域开展的一系列广泛研究的基础上。


    # 兰德国土安全与防御中心


    此处报告的研究是在国土安全与防御中心（HSD）进行的，该中心通过分析准备并保护社区及关键基础设施受自然灾害和恐怖主义的影响。中心的项目涵盖了广泛的风险管理问题，包括海岸和边境安全、应急准备与响应、对民事当局的支持、交通安全、国内情报和技术获取。中心客户包括美国国土安全部、美国司法部以及负责安全、灾害防备、响应和恢复的其他机构。


    HSD 是两个研究分部门的联合中心：兰德司法、基础设施与环境部门（RAND Justice, Infrastructure, and Environment）和兰德国家安全研究部门（RAND
    National Security Research Division）。司法、基础设施与环境部门致力于改进广泛政策领域的政策和决策，包括民事和刑事司法、基础设施保护和国土安全、交通与能源以及环境和自然资源政策。兰德国家安全研究部门为美国空军和陆军之外的所有国家安全赞助者提供研究和分析。该部门包括国防研究研究所，这是一个由联邦资助的研究开发中心，其赞助者包括国防部长办公室、联合参谋部、统一作战司令部、国防机构和美国海军。国家安全研究部门还为美国情报界和美国国防部提供研究。


