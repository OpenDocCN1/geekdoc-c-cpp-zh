    # 44 网络安全编程与预算框架


    在职业选择方面。政府编写劳动力管理条例可能有助于实现留才留用。


    - * 提高系统管理员能力：提高现有系统管理员的能力是一个培训、教育的问题，在某种程度上也涉及选择性的淘汰（这对于公务员来说很难做到，其中许多管理联邦网络的公务员是承包商）。这种升级的一部分是采用成熟度模型，DHS
    蓝图 8.3。

    - * 中和攻击 → 提高系统管理员的安全能力 → 外包系统管理：如果获取网络安全专业人才的成本不高，则外包系统管理是一个选项。它也可能被认为是信息管理决策的配套措施，如两种形式的外包所示：

    - * 调查云服务：出于许多原因可能会采用云服务，因为它们提供了更强的位置无关性，或者为了利用存储和处理的规模经济。但外包那些本质上专门提供网络安全服务的公司（作为其功能包的一部分），可能提供以比自行实施更具成本效益的方式提高网络安全的机会。

    - * 调查安全服务（Securityas）：同样，公司正在调查外包其全部或大部分网络安全功能。这种趋势之所以出现，部分是因为这在传统上被视为内在职责，部分是因为这意味着要将数据信任给第三方。然而，可能有机会以更少的钱获得类似或更好的安全性。


    # 第 3 环：中和攻击 → 模拟攻击测试系统


    这也被红队对抗（red-teaming），其中渗透测试是一个重要组成部分。此类测试可以大致表明组织的系统状况，以及需要修复的特定弱点的指标。此行动包含几个部分：


    - * 中和攻击 → 模拟攻击测试系统 → 部署人员进行红队测试：这涉及聘佣一个团队（内部团队或更常见的合同团队）。首席安全官（CISO）非常清楚红队成员是谁、他们需要测试什么以及在什么规则下。DHS
    获取此类服务的一种方法是利用 NSA 现有的能力，以便以后能够复制这些能力。

    - * 中和攻击 → 模拟攻击测试系统 → 获取红队工具：如果是内部团队，组织将需要获取红队工具；承包团队往往会自带自己的工具。然而，组织可能还需要工具从红队的结果中进行泛化，以便在整个系统中寻找类似的弱点。


    35 但需要采取适当警告：Dan Goodin, "AWS Console Breach Leads to Demise of Service with ‘Proven’
    Backup Plan.", ArTechnica.com, 2014年6月18日。


    - * 中和攻击 → 模拟攻击测试系统 使用结果确定后续投资的优先级：最后一步使用结果确定后续投资的优先级，涉及到将由无疑是精英黑客小组发现的漏洞转化为潜在攻击者可能发现的漏洞——并优先考虑投资以适当降低风险。此行动建议两个辅助行动：


    - * 寻找攻击失败的证据，以暗示未来攻击成功的可能性：虽然成功的攻击通常会导致组织重新评估安全态势，但由于最后一步失败而导致的攻击失败也表明组织的安全中存在弱点，使得攻击能够进行到那种程度。因此，攻击失败的证据可以暗示未来攻击成功的可能性。

    - * 结果确定良好的投资：最后，CISO 可以通过检查攻击失败后对系统的红队测试和取证结果，来帮助确定良好的投资。


    # 第 3 环：中和攻击 → 防御 DDOS 攻击


    DDOS 攻击是网络空间中一个特别困难（尽管尚未极其昂贵）的问题，因为允许 DDOS 攻击的系统几乎总是他人的系统（例如，个人机器人）或机构（例如，2012
    年后期许多劫持的 Wordpress 账户被用于对银行进行 DDOS 攻击）。有两种方法可以减轻 DDOS 攻击的影响。


    - * 中和攻击 → 防御 DDOS 攻击 采取反 DDOS 策略：反 DDOS 策略是联邦政府的管畴。它们可能包括以下措施，如果被认为具有成本效益的话：


    - * 要求互联网服务提供商负责意味着要求他们检测受感染的计算机用户（可能通过查看他们发送的字节数），并让他们在清理感染或失去互联网服务之间做出选择。要做到这一点必须是一项全球性的政策。

    - * 减少不必要的重定向服务非常重要，因为许多大型 DDOS 攻击是通过向重定向服务（如网络）发送小数据包实现的。

    - * 提供缓解措施的重要性源于许多 DDOS 攻击是通过向重定向服务发送小数据包实现的。这种缓解可以通过在网络上托管来实现。


    36 Michael Mimimos, "Hackers Using Brute-Force Attacks to Harvest Sites," ThreatPost.com,
    2013年4月15日。

    37 Lucian Constantin, "Attackers Use NTP Reflection in Huge Attack," Computerworld.com,
    2014年2月11日。


    关闭僵尸网络可以通过许多方式实现，例如劫持它们的命令控制服务器.³⁸


    - * 中和攻击 → 防御 DDoS 攻击 → 采取反 DDOS 缓解：反 DDOS 策略是可以在受到威胁时采取的策略。它们包括以下内容：


    - 获取带宽：DDOS 攻击旨在淹没组织的入口。一种 2012 年后期攻击许多受害者所采用的缓解措施是简单地获取更多带宽，以至于不被流量淹没。

    - 与反 DDoS 公司签订合同：另一种方法是与容量网络（例如 Google）上的托管网站签订合同，或聘用内容分发服务（其原始业务是通过分发优化网络内容）。

    - 检查内部服务器以防止其崩溃：在某些情况下，DDoS 攻击的原理不是通过淹没输入管道，而是通过压垮服务器处理请求的能力（例如 SQL 查询）。检查此类内部服务器并消除允许请求消耗资源的漏洞，或对输入进行黑洞化（black-holing），可能会有所帮助。


