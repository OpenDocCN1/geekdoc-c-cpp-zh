    \ York Times, June 21, 2014.\n\n## Using This Work\n\nThe organization of cyberdefensive\
    \ actions presented in this report can be used in two fundamental ways: (1) to\
    \ enable auditing of cyberdefensive resource allocation by a government or corporate\
    \ organization that is evaluating the implementation of a cybersecurity strategy\
    \ and (2) to serve as a prescriptive mechanism for consideration when an organization\
    \ is developing a cybersecurity strategy. Both of these uses are intended for\
    \ adoption by a wide variety of organizations, and we believe that these uses\
    \ will be valuable to public- and private-sector entities, independent of the\
    \ entity size (e.g., both large and small).\n\n## Auditing Mechanism\n\nThe sunburst\
    \ visualization of the cyberdefensive strategies facilitates the ability to assess\
    \ how cyberdefensive resources are allocated within an organization. This was\
    \ a key motivation behind our work for DHS CFO/PA&E, its role in determining program\
    \ effectiveness. A programming office that records resource allocation for cyberdefensive\
    \ actions (e.g., the budget expended toward other actions, such as generating\
    \ rapid response plans versus the absence of a budget allocated to other actions)\
    \ can review these allocations and visually depict how the resources are distributed\
    \ across the set of possible actions, as well as over-exposed and under-exposed\
    \ actions, as well as other misalignments in a way that can be communicated across\
    \ multiple management layers of a large organization.\n\nSome challenges will\
    \ exist in the auditing process, such as the ability to compare actions that are\
    \ difficult to quantify along the same dimension. For example, the action of “minimizing\
    \ exposure” may not necessarily be associated with a financial quantity, while\
    \ actions as “block cyberattacks” (e.g., through firewalls) are readily associated\
    \ with financial amounts. For this reason, a suitable approach for quantifying\
    \ all actions will be necessary depending on the selected auditing mechanism.\n\
    \n## Prescriptive Mechanism\n\nThe cyberdefensive organization presented herein\
    \ can be used when developing a cyberdefense strategy. The actions described in\
    \ this work are presented in a top-down hierarchy that can be used to guide a\
    \ CISO in identifying appropriate cyberdefensive actions for a given organization's\
    \ needs. It should be noted that many of the actions presented in the preceding\
    \ pages are universally applicable to all organizations and should be adopted\
    \ on an as-needed basis. For example, it is likely that the strategy of increasing\
    \ resilience should be prioritized over accelerating recovery in the case of organizations\
    \ that provide services for medical emergencies (e.g., critical infrastructure\
    \ for first responders), since increasing resilience focuses on preventing interruptions,\
    \ whereas recovery assumes a system that will go down (though, hopefully for a\
    \ short period of time). Other organizations that can withstand downtime may consider\
    \ recovery a key component of their strategy. Similarly, some organizations may\
    \ choose to minimize unnecessary exposure as a key strategy (especially if the\
    \ convenience of network-accessibility is not a highly valued benefit), while\
    \ others may not be able to fairly engage in this strategy, as may go against\
    \ the organization's raison d'être. For organizations evaluating the \"minimize\
    \ exposure\" strategy, we recommend that careful thought be given to the costs\
    \ and benefits of web accessibility for each class of the organization's information\
    \ for which network exposure is being considered.\n\n## Improving the Cyberdefensive\
    \ Actions\n\nAs mentioned previously, the cyberdefensive actions presented in\
    \ this report represent an iterative process of selection and review, though this\
    \ process did not incorporate consideration for explicit resource allocation.\
