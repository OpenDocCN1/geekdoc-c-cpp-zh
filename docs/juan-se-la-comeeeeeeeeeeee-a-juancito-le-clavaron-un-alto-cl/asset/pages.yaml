    We will consider more than one version of Stage 3. For the first version, we will
    suppose that we have available a backspaceable input file reader and a backspaceable
    output writer for the goodfile. In addition to the normal operations on these
    files, we can also execute the operations:


    note; when a note operation is executed, the state of the file, including for
    an input file the contents of the last record read, is remembered by the input-output
    procedure;


    restore; when a restore operation is executed, the file is restored to its state
    at the preceding note; for an input file this includes restoring the contents
    of the last record read (which may be in a user area, whose name must then be
    specified in the restore statement).


    Thus the sequence of operations


    +   open goodfile;

    write record-1;

    note goodfile;

    write record-2;

    write record-3;

    restore goodfile;

    write record-4;

    close goodfile;


