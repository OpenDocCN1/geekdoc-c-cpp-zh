  md: '# Ch. 3] BASIC DESIGN TECHNIQUE 45


    We may now ignore the structure of the output; it will be enough to DISPLAY each
    rational as we encounter it. The program structure may be formed directly from
    the structure of the set of numbers by trivially changing the names of the components:


    ![](img/2af52882003b66fe0217f904c606a0f9_60_0.png)


    We have now completed the first two steps in the design process. Life will not
    often be so easy! We now turn our attention to the third stage.

    Because we have structured our solution as an iteration of zigzags, we will need
    a variable to identify each zigzag: let us call it Z. We will also need two variables,
    S and T, for the numerator and denominator respectively of the rationals. We must
    initialize Z to the value 1, and increment it by 1; both increment decrement them
    by 1; we must initialize S and T from Z; and we must display each generated rational
    and stop when we have finished. So the list of operations is this:


    +   1. S :=1

    2. S :=S+1

    3. S :=S-1

    4. S :=some function of Z

    5. T :=1

