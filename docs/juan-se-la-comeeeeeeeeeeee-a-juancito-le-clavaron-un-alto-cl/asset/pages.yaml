    # ERRORS AND INVALIDITY


    # 103


    This structure is simple, but cumbersome and repetitive. Structures which take
    account of errors are often so.


    # 5.4 Invalidity


    We have drawn a distinction between good and error data. There is another, quite
    different, distinction to be drawn: between valid and invalid data.


    We will say that data is valid for a program component if the operation of the
    component is specified for the data; conversely, data is invalid if operation
    of the component is not specified. It follows immediately that both good and error
    data are valid, because operation of the program component is specified for both.
    Indeed, when we elaborate a data structure to take account of error data, we are
    extending the definition of data valid for the program component in question.
    We must do so, because we want operation to be specified for error data just as
    it is for good data.


    As an illustration, consider the following (simplified) specification of the COBOL
    divide instruction.


    ```

    DIVIDE item-1 INTO item-2

    ON SIZE ERROR imperative-statement.

    ```


    > “The value of item-1 is divided into the value of item-2. The value of the dividend
    (item-2) is replaced by the value of the quotient.


    Item-1 and item-2 must be elementary numeric items.


    > Division by zero results in a size error condition.”


    The first of the three paragraphs describes the operation; the second describes
    the valid data; the third describes a particular possible error. If we try to
    divide by zero, that is an error; operation is specified, the raising of a size
    error condition. But if we try to divide a non-numeric item, or to divide by a
    non-numeric item, that is invalid, and operation is not specified.


    If a program component has no formal written specification, we cannot, in general,
    determine what data is valid for that component; in fact, it is unclear whether
    any useful sense can be attached to the notion of validity for such a component.
    Sometimes we will be able to show that certain data will cause the component to
    invoke a lower-level component with data which is invalid for that lower-level
    component, and we may then perhaps say that'
