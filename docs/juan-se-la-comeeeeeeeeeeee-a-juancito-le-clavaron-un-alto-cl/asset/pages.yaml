    # PROBLEM 13—TELEGRAMS ANALYSIS


    An input file on paper tape contains the texts of a number of telegrams. The tape
    is accessed by a “read block” instruction, which reads into main storage a variable-length
    character string delimited by a terminal EOB: the size of a block cannot exceed
    100 characters, excluding the EOB. Each block contains a number of words, separated
    by space characters; there may be one or more spaces between adjacent words, and
    at the beginning and end of a block there may (but need not) be one or more additional
    spaces. Each telegram consists of a number of words followed by the special word
    "XXXX"; the file is terminated by a special end-file block, whose first is EOF.
    In addition, there is always a null character at the end of the file, in the block
    preceding the special end-file block: this null character consists only of the
    word "XXXX". Except for the fact that the null character always appears at the
    end of the file, there is no particular relationship between blocks and telegrams:
    a telegram may begin and end anywhere within a block, and span several blocks;
    telegrams may share a block.


    The processing required is an analysis of the telegrams. A report is to be produced
    showing for each telegram the number of words it contains and the number of those
    words which are oversize (more than 12 characters). For purposes of the report,
    "XXXX" does not count as a word, nor does the null telegram count as a telegram.
    The format of the report is:'
