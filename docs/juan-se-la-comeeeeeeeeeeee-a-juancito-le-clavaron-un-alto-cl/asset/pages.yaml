  md: '# 16 PRINCIPLES OF PROGRAM DESIGN


    The process continues, level by level, until no component remains which is too
    complex to be coded directly in the programming language as a single executable
    instruction.


    Hierarchical structuring is powerful because it allows us to create large and
    complex programs without using large and complex components: the complexity and
    size of the program is reflected only in the number of components and in the number
    of levels in the hierarchy. The components are of two kinds: elementary and composite.
    The elementary components are single instructions in the programming language;
    the composite components consist only of the coding needed to bring together,
    in correct relationships, the parts of which are directly composed.


    The subject of this book is program design: how to make the right dissection of
    the problem. The subject of this chapter is the nature of the components we shall
    use and the notations by which we shall describe them.


    # 2.2


    We will restrict ourselves to four component types. They are:


    +   elementary components, which are not further dissected and have no parts


    +   three composite types:


    +   (i) sequence, which has two or more parts occurring once each, in order


    +   (ii) iteration, which has one part, occurring zero or more times


    +   (iii) selection, which has two or more parts of which one, and only one, occurs
    once.


    The parts of the composite types may themselves be composite or elementary, without
    restriction. There is therefore no limit to the size of structure which can be
    created or to the number of components.


    The three composite types form an effective structuring system. Each is easy to
    understand, in the sense that the relationship between its parts corresponds to
    an intuitively acceptable idea which is simple and easy to remember. Also, it
    has been shown that any program which can be expressed in a flowchart can be expressed
    as a structure of sequences, iterations and selections, so there is no restriction
    on the programs we may write. More'
