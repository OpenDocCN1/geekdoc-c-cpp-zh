  md: '# 290 PRINCIPLES OF PROGRAM DESIGN


    01 RECA.


    When an input file is read, the record is thought of as as being placed in main
    storage in the area described by the appropriate record description in the file
    section. Where a file contains records of more than one format, the same storage
    locations are allocated to all of the formats. When a file is written, the record
    is thought of as being written from the appropriate record area described in the
    file section.


    # A5. Working-storage Section


    The working-storage section contains declarations of local variables in the form
    of record descriptions. These local variables are like ALGOL “own” variables or
    STATIC variables in PL/I: storage is allocated for them at the beginning of the
    main program, and is not released until the main program has completed execution.
    Working-storage in a sub-program may therefore be used to hold information from
    one invocation of the sub-program to the next.


    In addition to record descriptions, the working-storage section may contain descriptions
    of elementary items which are not grouped into records or any composite structures.
    These items are declared in the same way as ordinary elementary items, but their
    level indicator is 77.


    Elementary items in the working-storage section, whether they are level-77 items
    or parts of records, may receive initial values at compile time. These values
    are specified by writing a value clause in the item description, as in


    +   77 WW PIC 99 VALUE 1.

    77 ZZ PIC X(6) VALUE “MONDAY”.

    01 RECC

    02 RECC1 PIC S9(7)V9(3) VALUE 234651.004.


    If an item has an occurs or redefines clause in its description, then no value
    clause may be written in the description of that item or any of its lower-level
    components.


    # A6. Linkage Section


    The linkage section contains declarations of dummy or formal parameters. Each
    parameter is described either as a level-77 item or as a level-01 record. Naturally,
    initial values may not be specified for linkage section items.'
