  md: 'order. The significance of the level indicators may be easily seen by comparing
    the above description with the structure diagram:


    ![](img/2af52882003b66fe0217f904c606a0f9_303_0.png)


    The items at the lowest levels of a structure are elementary items, which may
    be of various types. The type of an elementary item is specified by PICTURE and
    USAGE clauses in the item description: broadly, the picture clause specifies the
    values the item may take, and the usage clause specifies the internal representation.
    Here are some examples of elementary data item descriptions:


    +   02 CUST-NO PIC X(8). 8 alphanumeric characters; only one internal representation
    is available, so no usage clause is required.


    +   02 AMOUNT PIC S9(6)V99 COMP-3. 8 decimal digits, signed, with an implied decimal
    point between the sixth and seventh; the usage clause COMP-3 specifies internal
    representation in packed decimal form.


    +   02 DAY PIC 99. 2 decimal digits, representing an unsigned integer in the range
    0 through 99; in the absence of a usage clause, internal representation is in
    character form, but arithmetic is still possible (though inefficient).


    +   04 INT PIC Z(4)9. 5 decimal digits, representing an unsigned integer in the
    range 0 through 99999; the Z''s in the picture specify that leading zeros are
    to be replaced by spaces; only character representation is meaningful, so no usage
    clause is required.


    Generally, usage clauses are relevant only for numeric items. The most important
    usage clauses in IBM COBOL, and the only ones used in the examples in this book,
    are COMP-3 (packed decimal) and COMP (binary).

    In addition to the information discussed above, an item description may contain
    an OCCURS clause and/or a REDEFINES clause. The occurs'
