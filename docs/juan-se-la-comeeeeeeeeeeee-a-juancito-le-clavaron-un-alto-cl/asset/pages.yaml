  md: "# APPENDIX\n\n# A7. Referring to Data Items\n\nData items are referred to by\
    \ the name written in the item description entry. If the same name has been used\
    \ in more than one description, as in\n\n```\n01 RECA.\n  02 FLD1 PIC XX.\n```\n\
    \n```\n01 RECB.\n  02 FLD1 PIC 99.\n```\n\nunique reference must be achieved by\
    \ qualifying the ambiguous name, as in\n\nIf a data item has an occurs clause\
    \ in its description, or is a lower-level component of an item which has an occurs\
    \ clause in its description, it must be referred to by a subscript name. Thus,\
    \ given the data description\n\n```\n01 Z.\n  02 Y OCCURS 10.\n  03 W1 PIC 99.\n\
    \  03 W2 PIC XX.\n```\n\nwe may refer to the second occurrence of W1 as\n\n```\n\
    W1 (2)\n```\n\nto the eighth occurrence of W2 as\n\n```\nW2 (8)\n```\n\nand so\
    \ on. Subscripts may be themselves data items, so that we may write\n\n```\n77\
    \ SUB1 PIC 99.\n  01 Z.\n  02 Y OCCURS 10 PIC X.\n```\n\n```\nMOVE SPACE TO Y\
    \ (SUB1).\n```\n\nHowever, subscript expressions are not permitted."
