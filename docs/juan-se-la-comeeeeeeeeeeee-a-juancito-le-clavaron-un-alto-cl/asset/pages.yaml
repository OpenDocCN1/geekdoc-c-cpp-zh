    in the addressing process. Not all of the people who received letters returned
    the reply card. The marketing manager, who is a suspicious fellow, thinks that
    his staff may have stolen some the reply cards for the letters which were not
    sent, and returned the cards so that they could benefit from the offer.


    The letters sent have been recorded on a file; there is one record per letter
    sent, containing the letter-number and other information which does not concern
    us. The reply cards are machine readable, and have been copied to tape; each reply
    card returned gives rise to one record containing the letter-number and some other
    information which again does not concern us. Both the letter file and the reply
    file have been sorted into letter-number order.


    A program is needed to report on the current state of the offer. Each line of
    the report corresponds to a letter-number; there are four types of line, each
    containing the letter-number, a code and a message. The four types of line are:


    +   - NNNNN 1 LETTER SENT AND REPLY RECEIVED

    - NNNNN 2 LETTER SENT, NO REPLY RECEIVED

    - NNNNN 3 NO LETTER SENT, REPLY RECEIVED

    - NNNNN 4 NO LETTER SENT, NO REPLY RECEIVED


    There are three files to process: the letter file, the reply file and the report
    file. Data structures are:


    | LFILE | RFILE | REPORT |

    |---|---|---|

    | LREC* | RREC* | LINE* |

    | | | |

    | TYPE 1° | TYPE 2° | TYPE 3° | TYPE 4° |


