    # 11.5


    But, course, everything is not quite so simple. There are two complicating factors.
    First, practical systems are not so trivial as our commercial loan system: the
    program SYSTEM would, in practice, be much larger and much more complex. This,
    in itself, would not matter very much—we have the necessary tools to master complexity—if
    it were not for the second factor. The second factor is the programming system,
    at the level of our present discussion, is inadequate to our needs.


    There is an obvious analogy between the invocation of a COBOL subprogram with
    a list of parameters and the invocation of a main program with a list of files.
    Just as we write:


    ```

    CALL "SUBPGM" USING AREA1, AREA2, AREA3.

    ```


    so we write:


    ```

    // EXEC PGM=MAINPROG

    //FILEA DD DSNAME=FILE1, ...

    //FILEB DD DSNAME=FILE2, ...

    //FILEC DD DSNAME=FILE3, ...

    ```


    Unfortunately, we cannot carry the analogy as far as we would like to.


    When we implement a program whose elementary operations are invoked by // EXEC
    statements, we are quickly forced to abandon the Job Control Language and to resort
    to natural language instructions to the computer operator:


    > "Job 1234 (Daily Transaction Processing) must be run every day, unless there
    is no input for the day. Job 5678 (Month-end Summary) must be run on the last
    working day of each calendar month, using the Customer Master File as updated
    by Job 1234 if Job 1234 is run on that day.... ."'
