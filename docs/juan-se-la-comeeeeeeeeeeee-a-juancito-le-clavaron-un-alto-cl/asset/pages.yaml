    \ seq\n  print entry number and value;\n  S:=S+1;\nPRT2 end\n```\n\nAll of the\
    \ iterations described above have the same logic flow: the condition is tested\
    \ before every potential execution of the iterated part, including the first.\
    \ This logic flow is shown explicitly in the COBOL section PRINT-REST-OF-THE-TABLE,\
    \ where the test “IF ENTRY-KEY (S) = HIGH-VALUES is made before every potential\
    \ execution of PRT2.\n\nThis logic flow has three important implications, which\
