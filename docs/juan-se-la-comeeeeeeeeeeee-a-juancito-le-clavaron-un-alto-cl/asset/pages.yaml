    matching cases for three files.


    # 4.3


    Although we may regard PMAGIC as a standard form, most collating programs have
    a very different appearance.


    Usually the fourth matching case—type4 is not required; if a key value is missing
    from all of the input files, then key value is not to be processed. We may change
    the program PMAGIC appropriately by simply deleting the statement "write type4".
    The program then runs through the same set of key values as before, but processing
    of the fourth matching case, when the key value is absent from both input files,
    is now null. This change, however, is not usually sufficient. Usually the key
    values in the input files are a very small subset of the set of all possible key
    values, and that set is very large. For example, if the key is an 8-character
    file, and each character has 8 bits, there are 2⁶⁴ possible key values; even if
