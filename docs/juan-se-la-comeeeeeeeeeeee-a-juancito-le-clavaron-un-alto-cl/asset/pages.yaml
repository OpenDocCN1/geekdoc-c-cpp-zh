    Having identified the essential differences between PROCZIG and PROCZAG, we now
    require to devise a suitably generalized component of which they will be special
    cases. The specialization must depend on a parameter which we can set. After some
    experiment, we devise the following scheme.


    We declare SI and TI in the form:


    +   01 SITI.

    02 SI PIC 9(6).

    02 TI PIC 9(6).

    01 NN REDEFINES SITI.

    02 N PIC 9(6) OCCURS 2.


    which allows us to refer to SI as N (1) and TI as N (2). We also declare a variable
    U, which can take the values 1 and 2; U will take the value 1 for PROCZAG, and
    the value 2 for PROCZAG. The generalized component is:


