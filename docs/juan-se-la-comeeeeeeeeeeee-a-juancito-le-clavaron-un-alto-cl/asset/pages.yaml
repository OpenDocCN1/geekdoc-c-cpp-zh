  md: "In this volume the author describes and explains a rational method of designing\
    \ computer programs, adopting a practical, step-by-step approach and differing\
    \ from many writers who have treated the subject with a heavy reliance on intuition\
    \ and inspiration. The method is particularly — but not soially — suited to programming\
    \ for data processing and for systems software, and has been successfully taught\
    \ and practised for several years.\nBuilding the foundations of structured programming,\
    \ the book shows how to analyse a problem by considering the structures of the\
    \ input and output data. Such consideration ensures that ambiguities in the problem\
    \ specification and potential difficulties in the program design are recognised\
    \ at the earliest possible moment, and that the resulting program is robust and\
    \ easy to maintain.\nAn important theme of the work is that the design technique\
    \ applies to systems no less than programs: the distinction between system design\
    \ and program design is artificial, and great benefits are to be obtained from\
    \ restoring their essential unity.\n\nThe design technique is illustrated by many\
    \ example programs. Program designs are exhibited in structure diagrams and in\
    \ program schemas. In many examples, the detailed coding is given in COBOL, but\
    \ the principles and techniques can be just as readily applied to PL/1, FORTRAN,\
    \ ALGOL, or even assembly language programming.\nPrinciples of Program Design\
    \ will be of enormous value to individuals in data processing installations and\
    \ will increase their productivity, and ensure that their programs are more reliable\
    \ and flexible. It is also suited as a textbook for university departments of\
    \ computing science: it will give students an interest and insight into the problems\
    \ of systems analysis and program design.\n book will be understandable to anyone\
    \ with a modest amount of experience in programming, but the novelty of the treatment\
    \ will make it interesting to those with much greater knowledge and experience."
