  md: '# PREFACE vii


    a large and complex problem would demand too much of the available space merely
    to define the problem and to show the program text of the solution. The examples
    are therefore used to illustrate the principles of design, and the solutions given
    are intended to be generally valid. Little or no attention is paid to finding
    solutions which make best use of special facilities of a particular operating
    system or programming language. Above all, optimization is avoided. We follow
    two rules in the matter of optimization:


    +   Rule 1. Don''t do it.


    +   Rule 2 (for experts only). Don''t do it yet—that is, not until you have a
    perfectly clear and unoptimized solution.


    Most programmers do too much optimization, and virtually all do it too early.
    This book tries to act as an antidote. Of course, there are systems which must
    be highly optimized if they are to be economically useful, and Chapter 12 discusses
    some relevant techniques. But two points should be remembered: first, optimization
    makes a system less reliable and harder to maintain, and therefore more expensive
    to build and operate; second, because optimization obscures structure it is difficult
    to improve the efficiency of a system which is already partly optimized.


    # 3.


    Although most of the example problems are drawn from a batch data processing environment,
    the design principles are applicable also to on-line systems and to scientific
    programming. Solutions to the problems are given mainly in schematic logic, a
    kind of abstract programming language which can be readily translated into any
    of the procedural languages in common use.


    Where coding is shown, it is mostly COBOL. COBOL is still the most widely used
    language for data processing, and it is relatively easy for non-users to read
    and understand. Further, it is a very simple language, and we have restricted
    ourselves to an even simpler subset which is described in the appendix. So the
    coded solutions do not depend on all the power of ALGOL, FORTRAN, PL/I or any
    assembler language. They are not intended to show COBOL at its best; they merely
    show that the designs resulting from the technique can be coded without difficulty.


    # 4.


    When you read this book, you should try hard to solve each problem for yourself
    before reading the solution given. Most of the problems, especially in the earlier
    parts, can be solved in an hour or two, and sometimes in a few minutes; some of
    the later problems will take longer. If you have your own solution to compare
    with the solution given in the book you will get more'
