  md: '# PRINCIPLES OF PROGRAM DESIGN


    ```

    Diagnose error

    Read item file

    ELSE PERFORM PROCESS-MATCH.

    PROCESS-MATCH.

    PERFORM START-INVOICE.

    PERFORM PROCESS-ITEM-LINE-AND-REC

    UNTIL end of item file or new invoice.

    PERFORM END-INVOICE.

    PROCESS-ITEM-LINE-AND-REC.

    Process item record, producing invoice line.

    Read item file.

    ```


    Once again, the program works, and the coding is impeccable. But the structure
    is utterly wrong.


    Again, we can see how it is by considering some likely changes to the problem
    specification. This time, the changes are to be applied cumulatively:


    +   * Print on the diagnostic listing the customer numbers of those customers
    for whom at least one invoice has been produced


    +   * Print on the diagnostic listing, and mark with an asterisk, the customer
    numbers of those customers for whom no invoice has been produced


    +   * To each customer number printed by the first change append the total amount
    invoiced for that customer


    +   * Instead of diagnosing each item record in error. print only the customer
    number, marked with an “E”, for each number for which at least one error exists.


    None of these changes are impossibly difficult. Anyone who has worked in data
    processing has seen programs changed in this kind of way, and probably successfully
    changed. But the changes are much more difficult than they ought to be, and as
    we make each successive change the conviction grows that we are storing up further
    difficulties for ourselves. Sometimes, after many changes, the program becomes
    so hard to understand that any further change is dangerous, and a complete redesign
    is then necessary.


    What makes the changes so difficult? They all call for the insertion of coding
    into the program to process one customer. For the first change we need to insert
    a statement “print customer number” at a place in the program where it will be
    executed once for each customer who has at least one invoice. For the second change
    we need to insert a similar statement at a place'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# Ch. 1 INTRODUCTION 9


    where it will be executed once for each customer who has no invoice. The fourth
    change presents a similar problem again. The third change is related to the first;
    at the start of processing each customer who has at least one invoice, we want
    to zero the total amount; when we process each invoice we want to add the invoice
    total to this total amount; at the end of processing the customer we want to print
    the total amount.


    To make the changes, we look for the appropriate places in the program to insert
    the required statements. We easily find where each invoice is processed: the paragraph
    PROCESS-MATCH processes one invoice each time it is executed; the invoice total
    is available after all the items of the invoice have been processed. This accounts
    for a part of the third change, but the rest is much harder. There is no program
    component which processes each customer with invoices, or each customer without
    invoices, or each customer with error items. There is nowhere appropriate to put
    the statements needed for the changes.


    Of the components which do exist in the program structure, PROCESS-MATCH, although
    misnamed, is intelligible: it processes each invoice; and PROCESS-ITEM-LINE-AND-REC
    processes each item within an invoice. But what does PROCESS-ITEM do? The flowchart
    seems plausible: we have a customer record and an item record, and PROCESS-ITEM
    compares their keys and takes the appropriate action according to the result of
    the comparison. This seems natural on the flowchart, but less natural if we ask
    what data is processed by each execution of PROCESS-ITEM. The answer, after we
    have examined the program carefully, turns out to be:


    +   either one billable item record for which no customer record exists,or one
    complete invoice,


    +   or one customer record for which there may or may not have been invoices.


    It is not surprising that we found difficulty with the changes. The program structure
    was always absurd, although it may have seemed reasonable on the flowchart: the
    changes only forced us to recognize what we should always have known.


    # 1.4


    One lesson to be learnt from these examples is that we should avoid flow-charts.


    For many people it has long been an article of faith that flowcharting should
    precede coding. There is a kernel of important truth here: coding'
  merge: -1
