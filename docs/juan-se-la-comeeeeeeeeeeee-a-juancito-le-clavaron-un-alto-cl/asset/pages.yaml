  md: '# PRINCIPLES OF PROGRAM DESIGN


    # 7.6


    At the heart of any clash is a synchronization problem. The program is required
    to execute two or more processes simultaneously, and the processes cannot be synchronized.
    But synchronization is essential for a healthy hierarchical program structure:
    the program has only one linear text, and only one location counter; the current
    place in the text must correspond to the current place in the data structure being
    processed; if there are two data structures the same location counter must serve
    to point to the current place in both.


    The technique we have used to resolve clashes allows the program to ignore structures
    which cannot be synchronized. In Problem 13 (Telegrams Analysis) the first program,
    P1, ignores the report structure: it busies itself with the structure of the paper
    tape, and cannot simultaneously be concerned with telegrams. Because its view
    of the intermediate file is


    ```

    IF1

    ```


    ```

    WORD*

    ```


    it can write each word it finds without asking where that word fits into the structure
    of the report or where it fits into the current telegram.


    In Section 3.7 above we observed that the structure


    ```

    FILE

    ```


    ```

    REC*

    ```


    is almost invariably wrong for a serial input file, because it precludes expression
    of any relationship among the records. The same structure is invaluable when we
    come to handle a structure clash. Precisely because it precludes expression of
    relationships among records we want to use it as an output file structure: we
    want to avoid knowing anything about those relationships: any necessary structure
    can be imposed by some other program when the file is read.'
