    # 4.2 Collating


    The above examples are concerned with correspondences between input and output
    files. An important class of problem is concerned with correspondences between
    two or more input files. Such problems are often referred to as “collating” or
    “matching” problems. Here is one.


    PROBLEM 7—THE MAGIC MAILING COMPANY


    The Magic Mailing Company has just sent out nearly 10 000 letters containing an
    unrepeatable and irresistible offer, each letter accompanied by a returnable acceptance
    card. The letters and cards are individually numbered from 1 to 9999. Not all
    of the letters were actually sent, because some were spoilt'
