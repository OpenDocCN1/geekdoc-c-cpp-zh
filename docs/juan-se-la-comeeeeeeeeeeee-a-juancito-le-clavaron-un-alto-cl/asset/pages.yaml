    # 4.1 Structural Correspondence


    So far, we have considered only problems which are concerned with a single file
    structure. More accurately, we have ignored all but one of the file structures
    in each the printed output in Problems 3, 4 and 5 was handled by DISPLAY statements,
    and we treated the DISPLAY as an elementary operation to be allocated in stage
    3 of the design, taking no account of any structure the printed output might have.


