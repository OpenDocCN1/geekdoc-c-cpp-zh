  md: "# APPENDIX\n\n# DISPLAY E.\nSUBTRACT P FROM Q.\nP2 SECTION.\n\nThe section\
    \ P1 consists of the paragraphs P1-1 and P1-2.\nThe PERFORM statement may be used\
    \ to execute, as subroutines, either sections or paragraphs. Thus the sentences\n\
    \nPERFORM P1.    and    PERFORM P1-1,\nPERFORM P1-2.\n\nhave identical effect,\
    \ where the section P1 is defined as above. Because all data within a compilation,\
    \ no recursion is possible.\nThere are more elaborate forms of the PERFORM statement.\
    \ Instead of specifying a single paragraph or section, it may specify a sequence\
    \ of paragraphs or sections, as in:\n\nPERFORM P1-1 THRU P1-2\n\nbut this facility\
    \ is undesirable and is not used in the examples.\nMore useful are the iterative\
    \ forms of the statement. We may write, with obvious meaning\n\nPERFORM P1-1 5\
    \ TIMES\nor PERFORM P1-1 X TIMES.\n\nInstead of a simple repetition specification\
    \ of this kind, a terminal condition may be specified, with or without a control\
    \ variable. Without a control variable the statement is:\n\nPERFORM sec-or-para\
    \ UNTIL condition-1\n\nwhich has the meaning of the schematic logic:\n\n+   P\
    \ iter until condition-1\n  do sec-or-para\nP end\n\nWith a control variable the\
    \ statement is\n\nPERFORM sec-or-para VARYING cvar FROM init BY incr\nUNTIL condition-2"
  merge: -1
  pgno: 310
- img_proc: true
  md: "# 296 PRINCIPLES OF PROGRAM DESIGN\n\nwhich has the meaning of the schematic\
    \ logic:\n\n```\nP seq\n  cvar :=init;\n  PB iter until condition-2\n    do sec-or-para;\n\
    \      cvar:=cvar +incr;\n  PB end\nP end\n```\n\nThe GO TO statement is used\
    \ to execute a transfer of control to the beginning of a named section or paragraph.\
    \ It has two useful forms. The simple form is\n\nGO TO sec-or-para\n\nwhich transfers\
    \ control to the first statement of sec-or-para. Section and paragraph names,\
    \ like data names, are known globally within a compilation. There is therefore\
    \ no syntactic restriction on the destination of a GO TO statement.\n\nThe second\
    \ form of the GO TO statement is\n\nGO TO p-1, p-2, p-3, ... p-n DEPENDING ON\
    \ var\n\nwhich transfers control to p-1 if var = 1, to p-2 if var = 2, and so\
    \ on. If var has a value outside the range 1 through n, no transfer of control\
    \ is made, and execution proceeds with the statement following the GO TO statement.\
    \ P-1, p-2 etc. be section or paragraph names.\n\n# A11. Procedure Division Structure\n\
    \nExecution of a main program begins at the point immediately following the procedure\
    \ division header, and continues sequentially, subject to PERFORM and GO TO statements,\
    \ until a STOP RUN statement is executed. Execution of a sub-program begins at\
    \ the entry point (which should immediately follow the procedure division header),\
    \ and continues sequentially, subject to PERFORM and GO TO statements, until a\
    \ GOBACK statement is executed. The sequential flow may pass through sections\
    \ and paragraphs which are the objects of PERFORM statements, as in:\n\n```\n\
    PROCEDURE DIVISION.\nP1.\n```"
