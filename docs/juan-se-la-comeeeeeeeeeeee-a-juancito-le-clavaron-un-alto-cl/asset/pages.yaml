    # PROBLEM 12—SERIAL LOOK-UP


    A table in main storage has the format:


    ```

    01 TABLE.

    02 ENUM PIC S9(4) COMP.

    02 TBODY.

    03 ENTRY OCCURS 500.

    04 EKEY PIC X(5).

    04 EVAL PIC X(11).

    ```


    There are 500 locations available for holding entries, but at any moment only
    the locations ENTRY (1), ENTRY (2), . . . ENTRY (ENUM) are occupied. The value
    of ENUM is always non-negative, but may be zero.


    A program E SKEY component is required which will look up a given argument in
    this table. That is, given an argument SKEY, in the form


    ```

    01 SKEY PIC X(5).

    ```


    the table is to be searched for an entry ENTRY (S) such that EKEY (S) = SKEY and
    S ≤ ENUM.'
