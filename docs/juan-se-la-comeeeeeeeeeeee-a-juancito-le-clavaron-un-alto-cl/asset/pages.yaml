    # 8.7


    Program inversion is very important. At a stroke it halves the techniques needed
    to deal with most of the problems we are likely to encounter. There is no difference
    between a file-processing main program and a record-processing sub-program—other
    than trivial difference in the details of coding. Basically, we need only concern
    ourselves with main programs which process serial files: other forms of program,
    such as interrupt handling routines and transaction routines in on-line systems,
    can be derived from these main programs by the use of inversion.


    We may characterize inverted as “variable-state” components. A main file-processing
    program is “fixed state” in the sense that it is always in the same state when
    invoked by the operating system: its action depends only upon the values of the
    inputs received in that one invocation, and not all of what happened in previous
    invocations. A variable-state component, by contrast, behaves each invocation
    in a way which depends both on the values of the inputs passed in that invocation
    and on its internal state—that is, the value of the state variable QS and other
    items in the state vector.'
