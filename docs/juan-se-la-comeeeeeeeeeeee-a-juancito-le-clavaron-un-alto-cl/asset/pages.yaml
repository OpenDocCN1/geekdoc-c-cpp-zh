  md: '# 3. BASIC DESIGN TECHNIQUES


    # 3.1


    The foundation of the design technique is the following three-step procedure:


    +   (i) consider the problem environment and record our understanding of it by
    defining structures for the data to be processed;


    +   (ii) form a program structure based on the data structures;


    +   (iii) define the task to be performed in terms of the elementary operations
    available, and allocate each of those operations to suitable components of the
    program structure.


    When the structure is formed from the data structures it is only a skeleton; we
    will usually need to add some components when we come to allocate the executable
    operations.


    We begin by illustrating the technique in its application to the following simple
    problem.


    # PROBLEM 3—CANTOR''S ENUMERATION OF RATIONALS


    A rational number is a number which can be expressed with perfect accuracy as
    the ratio of two integers: thus 3/5 is not. The question arises: how rational
    numbers are there? Clearly, there is an infinity of rational numbers, but there
    are different sizes of infinity: for example, it can be shown that there are more
    non-terminating decimal fractions than there are integers, although there is an
    infinity of each.


    Cantor showed that the number of rationals is the same as the number of integers.
    He did this by arranging the rationals in a 1–1 correspondence with the integers,
    from which it follows that there must be the same number of each. If we write
    the rationals in an array:'
