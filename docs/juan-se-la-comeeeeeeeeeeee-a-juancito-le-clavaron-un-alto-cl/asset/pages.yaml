    much better than that opposite. In a sense, this structure is the result of some
    optimization; the point is discussed in Chapter 12. The point which concerns us
    now is the correspondence, or absence of correspondence, between the two data
    structures. There is a correspondence between report and ptape: the report is
    derived from the ptape. The heading-body-ending structure of the report is integral
    no difficulty. But there is a boundary clash between block and telegram report:
    the words are the words of the telegrams, and they appear in the same order in
