  md: '# Ch. 6] BACKTRACKING 119


    Because the question whether F2 is good can be meaningfully asked only in the
    context of a F1, and similarly for F3 and F2, we are forced to adopt this disagreeable
    nested structure. We find ourselves, therefore, distinguishing the three possible
    error cases: error in F1; good F1 but error in F2; good F1 and F2 error in F3.
    These three cases rise to the three “do PX” statements in the schematic logic.
    We would prefer to make no such distinction and content ourselves with a single
    “do PX” statement : the distinction, after all, was not in the problem specification.


    # 6.4


    The data structure which fits the problem most naturally is:


    ![](img/2af52882003b66fe0217f904c606a0f9_134_0.png)


    The card is either a good card or a bad card. If it is a bad card, we are not
    interested in its contents; we shall merely execute PX. If it is a good card,
    it consists of a good F1 (on which we shall carry out P1), followed by a good
    F2 (on which we shall carry out P2), followed by a good F3 (on which we shall
    carry out P3). The data structure is perfect; the operations are faultlessly allocated;
    the program is beautifully simple and self-evidently correct. It does not work.
    There is no way in which we can determine entry to the selection CARD whether
    we have a good card or a bad card: only the processing will answer the question,
    and we are demanding an answer before the processing begins.


    We need a new form of selection. We need a form in which the condition test does
    not necessarily come at the head of the selection, at the entry point. Before
    looking in detail at what this means, let us look first at an analogy.


