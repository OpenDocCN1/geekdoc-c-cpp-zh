  md: '# 282 PRINCIPLES OF PROGRAM DESIGN


    must be read as a "read" or as a "write" statement, which is what it is. By reshaping
    the code we would lose the direct correspondence with the schematic logic; we
    would no longer have a program in which the structure of the program text exhibited
    the structure of the data it processes.


    The use of the state variable QS presents another, similar, issue. Surely we should
    avoid the use of internal switches, and create programs which are entrant, pure
    procedures? Again, definitely not. We cannot avoid problems which demand the use
    of inversion. Resulting programs must have some mechanism which allows them to
    resume execution at the point at which execution was suspended. So as long as
    we COBOL, PL/I, ALGOL or FORTRAN, we must provide that mechanism explicitly in
    the form of a state variable. By moving the state variable out of the text of
    the inverted program into the parameter list we achieve nothing of real value
    unless we need to handle multi-threading. Indeed, we may be doing ourselves an
    injury; we may make the state variable visible and accessible to other programs,
    thus undermining its entirely private purpose.


    A more substantial question concerns the use of the quit statement in backtracking.
    This is certainly it; it branches from one context into another without passing
    through upwards and downwards path which we normally demand, and that is why backtracking
    gives rise to side effects problems. Should we forbid the use of the quit statement?
    Only if we are prepared to tolerate the very cumbersome solutions from which backtracking
    technique saves us. For example, in Problem 9 (A Daisy Chain) we must be prepared
    to tolerate the solution in a six-level structure; when the problem grows to 20
    files instead of three we must be prepared to tolerate a 40-level structure. What
    we should not on any account do is to replace the quit statement by switch and
    imagine that we have improved matters. We have merely made the program a little
    more obscure by choosing to record in the setting of the switch what otherwise
    have been recorded in the value of the program sequence counter.


    # 13.3


    Our objective above all has been to create programs which are self-identically
    correct. There is still plenty of scope for error: we may suffer a slip of the
    pen in writing a program statement; the statement may be wrongly keypunched; the
    operator may drop a card on the floor of the computer room when he loads our program
    text in the card reader. All of these things may go wrong, and we will need to
    test our program to ensure that all is well. But we cannot afford any significant
    probability that our program contains a logic error. The logic errors must have
    been eliminated during the design process.'
