  md: '# 2. STRUCTURES AND COMPONENTS


    # 2.1


    We may usefully think of programming in the following way. We are given a problem
    and a machine; the problem is the task to be performed by the program; the machine
    is a hardware and software system which is capable of executing a certain set
    of primitive operations—the executable instructions of our programming language.
    The programmer''s job is to express the task in terms of these primitive operations.


    If the task is entirely trivial, we may be able to express it directly in primitive
    operations. For example, a program to exchange the values of two variables can
    be written down immediately as


    +   MOVE A TO TEMP.

    MOVE B TO A.

    MOVE TEMP TO B.


    But not many programs are trivial as this. A realistic program may contain hundreds
    or thousands of instructions, and cannot be written down directly: the task is
    too large and complex to be held, all at one time, in a human mind. We need some
    way of tackling the work which allows us to devote our attention to only a small
    part of it at any one time.


    Hierarchical structuring is such a way. We wish to create a program P, when executed,
    performs the desired task T. We decompose T into a number of subtasks—say, T1,
    T2 and T3—and make a corresponding decomposition of P into program components
    P1, P2 and P3; when P1 is executed it performs T1, and so on. We now have four
    components to create: P1, P2, P3 and itself. P is needed to bring P1, P2 and P3
    into the correct relationships with each other. Having decided what those relationships
    are, we have effectively completed our consideration of P: all that remains is
    to settle some details of coding. But P is to be written down directly in the
    programming language, and we apply the same technique of decomposition to them
    in turn. We decompose T1 into subtasks—say, T11, T12, T13 and T14—and we decompose
    P1 correspondingly.'
  merge: -1
