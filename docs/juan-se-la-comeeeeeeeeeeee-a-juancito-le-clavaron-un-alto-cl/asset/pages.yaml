    # 5.3


    Design of data structures which accommodate errors is not easy. We have to make
    choices which affect both the kinds of errors that can be distinguished and the
    processing of good data in the presence of errors. These choices are properly
    the concern of a specialist in man-machine interfaces: they depend heavily on
    how often the various errors are likely to occur and how easily the user can correct
    them. But as programmers we may ourselves the following objectives.


    Because the data structure reflects the model of the problem, it should be known
    to the user. He should be aware of the complete data structure, including the
    handling of errors. Most, perhaps all, programming language manuals err in this
    respect: they contain a careful and precise specification of the structure of
    a good program, but no clear description of the structure imposed on a program
    containing errors. One suspects that no such description exists, even in the design
    documentation for the compiler: certainly this would explain the arbitrary and
    perverse treatment of errors which many compilers provide.


    Diagnosis of errors should be related to the data structure. The user should receive
    a clear indication of the interpretation placed on his data.


    So far as possible, the data structure should be designed so that error data does
    not interfere with the processing of good data.


    *'
