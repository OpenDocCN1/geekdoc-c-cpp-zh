  md: '# 12. OPTIMIZATION


    # 12.1


    The word “optimization” is ill-chosen. Its Latin derivation implies that to optimize
    a program is to make it as good as it can be; but what we mean by an optimized
    program is as small or as fast as it can be. In making it small or fast, or if
    we can, both, we are liable to make it bad in various ways: it may become harder
    to understand, harder to maintain and more prone to error.


    In short, optimization costs money. We may define our basic attitude to optimization
    in two rules:


    +   Rule 1: Don’t do it.


    +   Rule 2: Don’t do it yet.


    The first rule tells us that we need a positive quantified justification before
    we optimize, and that often the justification simply does not exist. There is
    no sense in making a program run faster if the result is merely to increase the
    proportion of unused CPU cycles. There is no sense in making a program smaller
    if the result is merely to increase the number of unused locations in a standard-size
    partition of store. There is no sense in reducing the execution time by 5% if
    the result is to increase by 5% the likelihood of a program rerun due to program
    error.


    The second rule tells us that we must always begin with an unoptimized design,
    even if we intend to optimize it eventually. Only an unoptimized design can have
    the clarity and simplicity that are necessary for full under-derstanding: and
    we must understand our program fully if we are to optimize it without introducing
    logical errors. Anyone who has worked on program maintenance knows how dangerous
    it is to change a program which is less than transparently simple: apparently
    innocuous changes can have sur-prising, and disastrous, effects.


    For these reasons the problem solutions presented in this book have been almost
    entirely unoptimized, sometimes perely so. In this chapter we'
  merge: -1
  pgno: 266
- img_proc: true
  md: '252 PRINCIPLES OF PROGRAM DESIGN


    explore some of the transformations which can be used to make the programs faster
    or smaller.


    # 12.2


    We will concern ourselves essentially with transformations of the program structure.
    We will not consider two important techniques: optimization by tuning and optimization
    by algorithm.


    Optimization by tuning consists of adjusting parameters which affect the execution
    characteristics without affecting the structure. Some obvious examples are:


    +   adjusting blocking factors of files to obtain the best compromise between
    the storage space needed for buffers and the number of physical data transfers
    to be executed;


    +   allocation of multiple buffers to improve the overlapping of channel and CPU
    activity;


    +   adjusting queue sizes, especially in on-line systems, to obtain the best compromise
    between space requirements and device utilization;


    +   choice of data types to minimize storage requirements on files or to minimize
    the use of data conversion routines;


    +   segmentation of programs to prevent overlaying or to improve use of virtual
    storage.


    None of these forms of tuning affects program structure (except possibly the last),
    and we will not consider them further.


    Optimization by algorithm is of greater relevance to mathematical than to data
    processing programs. The following problem provides an illustration-


    # PROBLEM 18—BUBBLE SORT


    A table in main storage has the form:


    +   01 TABLE.

    02 MAX PIC S9(4) COMPUTATIONAL.'
