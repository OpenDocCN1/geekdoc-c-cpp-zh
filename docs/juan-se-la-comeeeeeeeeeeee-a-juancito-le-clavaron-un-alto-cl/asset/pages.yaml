    # 6.3


    Multiple reading ahead will solve some problems, but not all. Consider, for example,
    the file


    ![](img/2af52882003b66fe0217f904c606a0f9_131_0.png)


    We cannot process this file by reading any fixed number of records ahead. However
    many we choose to read, and the number must be limited by the availability of
    storage space, we may still encounter a file with containing more T1 records than
    we can accommodate. This is a very common problem in batch processing systems.
    The file may consist of control batches, each terminated by a batch control card;
    if the hash of the detail agrees with the hash total in the batch control card,
    the batch is good. and must be written to the output file; if the hash totals
    do not agree, the batch is bad, and must be rejected.'
