  md: '286 PRINCIPLES OF PROGRAM DESIGN


    # A2. General Structure


    A program has four divisions: IDENTIFICATION or ID division; ENVIRONMENT division;
    DATA division; PROCEDURE division. Each division begins with a header card, such
    as


    # IDENTIFICATION DIVISION.


    in which the word "identification" starts in Area A. There is no way of indicating
    the end of one division except except by the beginning of the next, or by the
    end of the program.


    The identification division contains the program name, the name of the programmer,
    and other similar information. It has been omitted from the examples.


    The environment division is intended to describe the physical environment in which
    the program is to be executed. It therefore contains such information as the allocation
    of files to specific devices. The environment division has been omitted from most
    of the examples.


    The data division contains all the declarations.

    The procedure division contains all of the executable coding.


    A program may be either a main program or a sub-program. A main program is invoked
    by the operating system, which fetches a fresh unused copy of the program text
    for each execution. It is therefore impossible to remember anything from the same
    program except storing execution of a main program to the next execution of the
    same program by storing the information on a file. A sub-program is like a FORTRAN
    subroutine or a PL/I external procedure. It is invoked by a main program or by
    another sub-program. The invocation statement is of the form


    ```

    CALL "PGMA" USING PARAM1, PARAM2, PARAM3.

    ```


    where PGMA is the name of the entry point in the invoked sub-program and PARAM1,
    PARAM2 and PARAM3 are the names of actual parameters for the invocation. At the
    entry point of the invoked sub-program there must be a matching statement


    ```

    ENTRY "PGMA" USING X, Y, Z.

    ```


    where X, Y and Z are names of dummy or formal parameters, declared in the data
    division of PGMA. Call is always by reference; that is, references to X, Y and
    Z in the above example are references to the actual data areas'
