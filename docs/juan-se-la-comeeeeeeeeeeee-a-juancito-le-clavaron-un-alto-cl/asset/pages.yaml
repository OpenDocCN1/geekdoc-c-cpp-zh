    ```

    PROCFBREC end

    read file;

    PROCBODY end

    close file;

    stop;

    PROCFILE end

    ```


    The simplicity of this program depends largely on the fact that no component can
    be executed unless the appropriate data is present. PROCFBREC cannot be executed
    unless either a a T2 or a T3 is present: that is assured by the condition test
    at the head of PROCBODY. Process T2 cannot be executed unless a T2 is present:
    that is assured by the condition test at the head of PROCFBREC. Similarly process
    T3 cannot be executed unless a T3 is present. The read ahead technique ensures
    the necessary data is available in main storage for the condition tests to be
    made. We cannot ever find ourselves engaged in executing a component for which
    the appropriate data is not present.


    This is all very obvious and straightforward. Indeed, the reader may be wondering
    how one could ever construct a program lacking in this simplicity.


