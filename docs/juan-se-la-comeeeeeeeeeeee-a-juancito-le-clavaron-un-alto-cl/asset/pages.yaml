    We are merely forced, because of shortcomings in the language (which it shares
    with PL/I and ALGOL), to code our well-formed iteration in an unusual manner.
    We are writing by hand the text which we would prefer our compiler to generate
    automatically. The true objective of GO TO statements is, of course, they permit
    unrestrained branching from one part of a program to another. The two GO TO statements
    in the example above do no such thing: they are an utterly standardized implementation
    of the schematic logic.


    But might it not be better, nonetheless, to reshape the code of an inverted program
    to conform to the accepted rules of GO TO-less programming style? Definitely not.
    The inverted program is designed, and should be read, as if it were not inverted.
    The coding


    ```

