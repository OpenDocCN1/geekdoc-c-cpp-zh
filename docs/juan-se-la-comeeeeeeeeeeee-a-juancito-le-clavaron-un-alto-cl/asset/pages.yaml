  md: '# 268 PRINCIPLES OF PROGRAM DESIGN


    This is the very simplest illustration of the third approach to reducing the length
    of the program text. We recognize that certain operations occur more than once
    in conjunction, and we devise a routine which is sufficiently general to handle
    every occurrence. In the present simple illustration the four occurrences are
    already identical, and there is no need to generalize.


    This form of optimization is often misunderstood, and mistaken for a fundamental
    design technique. There is a crucial, though not perfectly, distinction between
    common subroutines which are the result of bottom-up design activity and common
    subroutines which are the result of optimization. The former arise from a recognition
    that the hardware/soft-ware machine is not ideally suited to solving a given problem:
    by providing ourselves with new elementary operations, implemented as common subroutines,
    we rebuild the machine nearer to our ideal. We may expect these routines to remain
    valid for the lifetime of the system they motivated—and often to outlive the system.
    The latter, by contrast, arise from a detailed consideration of the text of a
    particular program. We may expect them to be invalidated by changes to the program
    specification, and we will not often find that they can be used in any other program.


    Problem 3 (Cantor''s Enumeration of Rationals) provides a more elaborate illustration
    of this third approach to optimization. The program given in Section 3.1 above
    is:


    ```

    PNSET seq

    Z:=1;

    PSBODY iter until Z > 50\ZPIGZAG seq

    PROZCIG seq

    S:=2*Z-1;

    T:=1;\ZPIGBODY iter until S < 1

    ZPIGNUM seq

    display S/T;

    S:=S-1;

    T:=T+1;

    PIGNUM end\ZPIGBODY end

    PROZCIG end

    PROZCAG seq

    S:=1;

    T:=2*Z;

    PZAGBODY iter until T < 1

    PZAGNUM seq

    ```'
