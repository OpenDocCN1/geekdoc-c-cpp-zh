    PROBLEM 11—GOOD AND BAD BRANCHES


    A tape file contains sorted card-images. Each card carries a branch-number and
    a card-type indicator, together with some other information. A program must be
    designed to purge this file of error data, producing a file of good data and an
    error listing. Detailed diagnosis of errors is not required. If the data for a
    branch is good, according to the criteria given below, it is written to the file
    of good data; otherwise a line is written in the error listing in the form:


    > ERROR DATA FOR BRANCH-NUMBER nnnnnn


    followed by a listing of the card-images for the branch in error.

    Data for a branch is good if and only if, it satisfies all of the following criteria:


    +   there must be exactly two cards for the branch, a T1 and a T2, in that order;


    +   the field F1 in the T1 card and the field F2 in the T2 card must be numeric;


    +   the value of F1 in the T1 card must be strictly greater than the value of
    F2 in the T2 card.


    The card-images have been sorted into ascending order by card-type within branch-number.'
