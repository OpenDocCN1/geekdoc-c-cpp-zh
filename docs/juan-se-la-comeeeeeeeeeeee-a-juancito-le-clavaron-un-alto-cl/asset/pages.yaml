    the group item FA2, the elementary item FA3 and the elementary item FA4. Each
    instance of RECORD-A consists of one instance of each of these parts, in the order
    given.


    ```

    DO;

    A=1;

    B=C;

    CALL X (C);

    END;

    ```'
