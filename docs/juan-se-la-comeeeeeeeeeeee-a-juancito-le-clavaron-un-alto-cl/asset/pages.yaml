    # BASIC DESIGN TECHNIQUE


    # 63


    The file is regarded as an iteration of records, and the program, accordingly,
    consists of a main loop which processes one record on each iteration. A record
    may be either a control-break record or an ordinary record; a control-break record
    is one whose part-number is different from the part-number of the immediately
    preceding record. From this wrong structure many difficulties arise. The processing
    of a control-break record must include both the ending of the preceding part group
    and the initialization of the new part group. We must arrange that the first record
    of all is treated as a control-break record, and that the end-of-file record is
    also treated as a control-break record. But for the first record there is no preceding
    part group to be ended, and for the end of file there is no new group to be initialized.
    We need the first-time-switch to ensure that the first record is treated as a
    control-break, because there is no value we could set initially in PARTNO which
    we must also test the switch at the end of the program to cater for the possibility
    that the file contains no records; there would be no last part group to be ended
    at the end of the program.


    The resulting program is more complex than it need; it is harder to understand,
    and will certainly be harder to maintain. And yet this style of programming is
    traditional in some places. We may attribute this strange tradition, at least
    in part, to the treatment of end file by statements of the form:


    # READ SMF AT END GO TO END-PROGRAM.


    This treatment is unnecessary in COBOL, as we have seen, but is forced upon us
    in FORTRAN and in some low-level languages, where end of file must always cause
    an unconditional GO statement to be executed. This GO TO statement gives rise
