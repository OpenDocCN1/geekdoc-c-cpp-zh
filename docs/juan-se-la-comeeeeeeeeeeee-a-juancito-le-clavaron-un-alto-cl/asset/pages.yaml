  md: '# 1. INTRODUCTION


    # 1.1


    The beginning of wisdom for a programmer is to recognize the difference between
    getting his program to work and getting it right. A program which does not work
    is undoubtedly wrong; but a program which does work is not necessarily right.
    It may still be wrong because it is hard to understand; or because it is hard
    to maintain as the problem requirements change; or because its structure is different
    from the structure of the problem; or because we cannot be sure that it indeed
    work.


    This book is about how to design structured programs so that they will be free
    from these faults. The basic ideas of structured programming have become widely
    accepted. We may summarize them briefly as follows:


    +   Problems should be decomposed into hierarchical structures of parts, with
    an accompanying dissection of the programs into corresponding structures and parts.


    At each level of decomposition we should limit ourselves to the use of three structural
    forms: concatenation (sequential flow), repetition (DO WHILE or REPEAT UNTIL)
    and selection (IF THEN ELSE or CASE).


    The GO TO statement should be avoided completely or so far as possible.


    There is a brilliant description of these basic ideas, and of much more, in Professor
    E. W. Dijkstra''s Notes on Structured Programming.


    An uncomfortable analogy can be drawn between today''s wide acceptance of these
    ideas and the acceptance by an earlier generation of programmers of the ideas
    of Modular Programming. The basic ideas of Modular Programming were these:


    +   Each program should be dissected into modules which can be separately compiled.'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# PRINCIPLES OF PROGRAM DESIGN


    Modules should be as small and simple as possible within the limits dictated by
    the efficient use of the programming and operating systems.


    Modules should be separately tested before integration into the programs which
    use them.


    Modular Programming was not always successful in practice, for various reasons.
    Some compilers imposed very large overhead costs in space and time on separately
    compiled modules; the smallest practicable size for a module was therefore very
    large, and the technique useless for any but the largest problems. Some users
    found great difficulty in integrating modules into workable programs; during "integration
    testing" many interfaces modules had to be specified and many modules rewritten,
    at a cost greater than the savings achieved in originally constructing the modules.
    Certain promised benefits were obtained rarely; few users managed to create a
    library of general-purpose modules so reduce the amount of new code to be written
    for each successful project; many users found that program maintenance became
    harder, not easier, because many modules had to be amended and recompiled when
    only one monolithic program was affected. Almost all users became conscious that
    they had a major new problem in program design: what was the best way to dissect
    a program into modules?—or, more succinctly, what is a module?


    This last problem was crucial. But there were no good answers to the questions.
    Some answers were useful for a limited range of simple problems: "the program
    should have a main-line control module with subordinate modules to process transactions".
    But for the most part the answers perplexed a standard range of buzz-words—“logical
    entity," "functional integrity," "generalized logical function" and many others—and
    no-one was any winner for them. Programmers who had previously written good monolithic
    programs now wrote good modular programs; programmers who had previously written
    bad monolithic programs now wrote bad modular programs.


    # 1.2


    We face a similar difficulty in Structured Programming. It is not enough to decide
    that a program should be built of DO WHILE and IF THEN ELSE constructs: the crucial
    problem is to decide what DO WHILE and IF THEN ELSE constructs are needed for
    this particular program, and how they should be fitted together. If the structure
    is wrongly designed we will not be saved by the fact that each individual part
    is well formed.


    As an illustration, consider the following trivial problem.'
  merge: -1
  pgno: 17
