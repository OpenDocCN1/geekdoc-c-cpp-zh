    When switch=0, the T2 record has already been read by POP1 and no read operation
    is required in P2; when switch=1, POP1 reads the T1 record, and the T2 record
    is still to be read by P2. It should be clear that this is a very bad solution:
    with more complex file structures it will lead to a mass of confusing and error-prone
    statements for setting and testing the necessary switches.


    The technique of reading ahead solves the problem perfectly. As soon as we open
    the first is available for examination, as often as we wish, by the condition
    tests in iterations and selections: it is the next record to be processed. Examination
    of the record does not, itself, affect it; if we decide that it is not what we
    are looking for, we simply leave it alone and it is available for further examination
    elsewhere in the program. When the record is finally processed by some program
    component, the sequence of events is:


    +   stop thinking of the record as the next record to be processed, and think

    of it instead as the current record;

    process the current record completely;


    read another record so that a new record will be available for examination.


    This arrangement, reading one record ahead, allows the program to explore the
    input file structure by examination of the next record to be processed. Some input
    file structures will be such that we cannot explore them effectively without reading
    two or more records ahead: the questions we need to ask'
