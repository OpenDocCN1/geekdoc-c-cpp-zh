  md: '# 7. STRUCTURE CLASHES


    # 7.1


    The structure of a program must be based on the structures of all of the data
    it processes. Each executable operation is associated with some component of some
    data structure; we wish to allocate that operation to an appropriate program component,
    and we must therefore find a program component which corresponds, in its place
    in the program structure, to the data component within the data structure.


    For example, in Problem 5 (Stores Movements Summary) there is an operation “add
    quantity to net movement”. This operation is associated with a receipt record
    in the input file; we cannot allocate correctly in the program structure unless
    the program structure contains a component “process receipt record”. Similarly,
    there is an operation “print net movement line”. This operation is associated
    with a net movement in the printed summary: we cannot allocate correctly unless
    the program structure contains a component “process net movement line”.


    To be sure of able to allocate the operations correctly, we must fit the data
    structures together by identifying the1-1 correspondences between them; only then
    can the program structure correspond to different data structures at the same
    time.


    This chapter is about structure clashes. That is, it is about problems in which
    the data structures cannot be fitted together in the way we would like, in which
    the necessary 1–1 correspondences cannot be found. In this chapter we explore
    the nature of the difficulty caused by a structure clash, and give some examples
    of clashes: the technique of solution is suggested, but is not fully developed
    until Chapters 8 and 9.


    # 7.2


    Consider first the following problem. We have a card file, containing a matrix.
    Each card contains the elements of one row of the matrix. We wish to write a program
    which will print out the matrix by columns: each line of'
