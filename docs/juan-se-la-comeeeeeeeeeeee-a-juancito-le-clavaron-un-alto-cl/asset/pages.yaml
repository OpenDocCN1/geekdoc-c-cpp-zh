    A different method is to avoid altogether the creation of side-effects in B. Instead
    of operating on variables which are known outside B, we may restrict operation
    of B to local variables. We must initialize appropriate local variables on entry
    to B, and at the very end of B, after operation on the local variables is complete,
    we must assign the new values of the local variables to the variables known outside
    B. Thus we would write:


    ```

