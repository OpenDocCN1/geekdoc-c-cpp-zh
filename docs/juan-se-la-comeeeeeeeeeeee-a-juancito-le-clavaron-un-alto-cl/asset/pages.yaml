  md: '# PREFACE


    1.


    This book is about programming. In particular, it is about programming for data
    processing applications. The main theme of the book is that programs can, and
    should, always be simple, even if the tasks they perform are complex. The main
    subject matter is a design technique which allows this simplicity to be achieved.


    Traditionally, programming is distinct from system design. The system designer,
    usually called “systems analyst”, decides what files are needed in the system,
    and specifies these for the programmer; the programmer then writes his programs
    according to the designer’s specifications. This traditional division of labour
    is absurd: it has had several damaging effects on our understanding of computer
    systems and on the way we build them.


    First, it has helped to perpetuate the primitive idea, derived from the earliest
    batch-processing systems, that there is a hard boundary between the tasks of system
    design and program design. We expect to apply different techniques and different
    design criteria, and to use different tools, when the elements of our design are
    programs and files from those we apply and use when the elements are subroutines,
    machine instructions and core storage. The distinction is beginning to break down
    now; we recognize that JCL is a programming language (of a bizarre and unsatisfactory
    kind), and that the word “program” loses much of its meaning in the context of
    an on-line transaction system. The design technique discussed in this book, especially
    the aspects considered in Chapters 7 to 11, undermines the distinction between
    programs and systems in the context of batch processing all.


    Second, it has obscured the nature of the systems analyst''s task. He analyst
    needs to determine what the system ought to do if it is to serve the user well;
    at the same time he must design the higher levels of that system, configuring
    programs and files so that the work can be carried out efficiently on the computer.
    The first job is concerned with the techniques of inventory control, sales forecasting,
    production planning—whatever the particular application may be—and demands knowledge
    of the relevant parts of business management. The second job is concerned with
    computer system design, and demands knowledge of computer science. An unusually
    versatile person is'
