  md: '# 5. ERRORS AND INVALIDITY


    # 5.1 Error Data


    Error processing accounts for a high proportion of the program code in a data
    processing system. Some programs, often called “data vetting” programs, have no
    function other than the detection and elimination of erroneous input: typical
    errors are non-numeric information in numeric fields, wrong combinations of field
    values, wrong record sequences and wrong identifiers. Transaction processing in
    an on-line system often consists largely of dialogue in which the transaction
    program diagnoses input errors and the user resubmits corrected input. Errors
    also occur, especially in batch-processing systems, at later stages: a master
    file updating program must detect such errors as transactions for which no master
    record is present or transactions which are inapplicable to the corresponding
    master records.


    We use the term “error data” for data containing errors of this kind, and we will
    contrast error data with “good data”. The distinction between error data and good
    data is meaningful to the user of a system: broadly; good data is what he tries
    to present to the system; error data is what he presents when he makes a mistake.
    But no such distinction is meaningful to the system itself. both error data and
    good data require processing, and the processing must be correct according to
    the specifications. There is no difference in principle writing a record on an
    error diagnostic file and writing a record on a vetted transactions file, or between
    a dialogue in which the user is correcting an error and a dialogue in which he
    is submitting new information.


    Because error data must be processed correctly, just as good data must, we must
    design our programs to take account of error data. And this means the data structures,
    on which the program design is based, must also take account of errors. It would
    be wrong to design a program to handle only good data, hoping to fit the processing
    into a structure determined solely by the good data. The result would be a partially
    designed program—partially correct, partially intelligible and partially maintainable.'
  merge: -1
  pgno: 110
