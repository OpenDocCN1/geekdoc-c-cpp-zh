    # 11.6


    The main theme of this chapter is that system design is an extension of the program
    design task, and that the same techniques can usefully be applied to both. In
    principle, we may think of a system as a large program:


    ![](img/2af52882003b66fe0217f904c606a0f9_262_0.png)


    The input files are all pictured as tape files, because they are necessarily serial:
    the chronological ordering of the input is always significant. Physically, the
    inputs may arrive on cards, tapes, terminals, disks, computer-readable documents,
    or any other medium. The outputs are all pictured as print-out, because they are
    destined to be read by some human being (or, perhaps, another computer system).


    The design task consists of devising a structure for the system which corresponds
    correctly to the data structures of the input and output files. The executable
    operations, whether they are COBOL statements, transaction-processing routines,
    or complete jobs, must be allocated to appropriate components of the system structure.


    The problems of structure clashes and of backtracking are important at all levels
    of the system. In Chapters 5 through 10 these problems are discussed'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# PRINCIPLES OF PROGRAM DESIGN


    in the context of the lower levels of the system, conventionally thought of as
    the programming context. The solutions proposed there have counterparts in the
    context of the higher levels too.


    The chief techniques for solving structure clashes at the higher levels of the
    system are:


    The introduction of master files to hold state vectors;


    Sorting input or output files;


    The use of file organizations, especially those provided by data-base management
    systems, which permit different logical structures to be imposed on the same physical
    file.


    In backtracking problems the difficulties centre on the handling of side effects.
    The chief techniques here are:


    +   Use of generation data groups (the grandfather, father, son method) to allow
    backspacing over an array of files;


    +   Dumping a database; this is a “note” operation, anticipating the need for
    a later “restore” in the event of erroneous operation;


    +   Use of the “checkpoint” and “restore” facilities of the operating system;


    +   Retention of transaction input records, either in a special file or in master
    file records; this may be thought of as a multiple read ahead device, and is often
    implemented in a highly optimized form in which only the minimum information is
    retained from each record.'
