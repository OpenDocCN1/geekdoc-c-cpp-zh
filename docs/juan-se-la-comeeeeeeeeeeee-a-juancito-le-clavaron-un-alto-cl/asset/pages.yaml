  md: '# Ch. 12] OPTIMIZATION 275


    Clearly we could write a long and boring program to process this file. But it
    will be more agreeable to devise a generalization which will save some main storage
    space. We may choose to regard the file as having the structure:


    ![](img/2af52882003b66fe0217f904c606a0f9_290_0.png)


    The special features of each batch will be described in a “record table” for that
    batch. For example, the record table for the B1 batch will be:


    | T1 |

    | T3 |

    | T6 |

    | T8 |

    | END |


    Similarly, there will be a “batch table” describing the arrangement of the file
    in batches. Each entry of the batch table will be a pointer to a record table.
    The resulting program to process the file is:


    ```

    P seq

    open file;

    read file;

    point to start of batch-table;

    PB iter until end-of-batch-table

    point to record-table start;

    process batch start;

    PBTCH iter until end-of-record-table

    process record against record-table-entry;

    read file;

    point to next record-table-entry;

    nPBTCH end

    process batch end;

    point to next batch-table-entry;

    PB end

    close file;

    stop;

    P end

    ```'
