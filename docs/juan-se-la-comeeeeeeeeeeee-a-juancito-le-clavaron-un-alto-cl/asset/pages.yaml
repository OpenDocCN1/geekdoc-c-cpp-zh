    # 6.1


    We use forms of iteration and selection in which the condition test precedes execution
    of a part. And we use the technique of reading ahead to handle serial input files.
    The result is that our programs are very simple and very easily understood. For
    example, to process the file


    ![](img/2af52882003b66fe0217f904c606a0f9_126_0.png)


    we write the program


    ```

    PROCFILE seq

    open file; read file;

    process T1;

    read file;

    PROCBODY iter until eof (not T2 and not T3)

    PROCFBREC select T2

    process T2;

    PROCFBREC or T3

    process T3;

    ```


    111'
