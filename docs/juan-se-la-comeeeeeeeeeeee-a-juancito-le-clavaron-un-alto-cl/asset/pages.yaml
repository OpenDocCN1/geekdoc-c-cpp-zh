  md: '# APPENDIX


    # COBOL Language


    The preceding chapters contain many example solutions coded in COBOL. The notes
    in this appendix are intended to help readers who are unfamiliar with COBOL to
    understand the solutions.


    That is their split. They do not present an exhaustive or definitive description
    of the language; they do not even contain enough information to guide the simplest
    possible program. Features and facilities which have not been used in the examples
    are ignored. Those which are described informally and usually in a simplified
    form. Obscure features are distorted for clarity.


    The COBOL dialect described is, more or less, the IBM version of ANS COBOL.


    # A1. Card Format


    The text of a COBOL program is arranged as a series of columns card images. Columns
    1 through 6 of each card contain a sequence number; columns 73 through 80 contain
    a name by which the file of card images may be known. Neither of these fields
    is a part of the program text proper, and we will ignore them. Column 7 is used
    to indicate that a word (such as a long character string constant) has been split
    between cards, as words are hyphenated in ordinary text so they may be split between
    lines. This facility is known as "continuation", and is not used in the examples.
    We will therefore ignore column 7 also.


    The remainder of the card image is available for program text. The first four
    columns, columns 8 through 11, are thought of as constituting a special area called
    Area A; the rest, columns 12 through 72, is called Area B. Certain elements of
    the text, as division headers and paragraph names, must be written so that they
    start in Area A; most of the text is written in Area B.'
