  md: 'value and pleasure from what you read. Where the solutions agree, you can proceed
    in a warm glow of mutual approbation between writer and reader; where they disagree,
    you can read on in a more alert and critical frame of mind.


    Exercises and questions for discussion are given at the end of almost every chapter.
    Each exercise is graded (a), (b), or (c). The exercises graded (a) are easy, and
    usually call for minor modification to a program already discussed or for practice
    in the use of a notation. Those graded (b) are harder and present a non-trivial
    design task. Those graded (c) are harder still, and usually call for the design
    of a difficult program.


    The questions for discussion may be of value to teachers who care to use this
    book, and may also give food for thought to the individual reader. Some of the
    questions raise topics and difficulties which are discussed later in the book.'
