    # PROBLEM 8—SOURCE STATEMENT LIBRARY


    A program is to be written which will create a file of source text input for the
    COBOL compiler. The program reads a card file, which may be either:


    +   - a complete COBOL program in source text form,

    - a request to retrieve a COBOL program from the source-statement library, together
    with any number of insertions and deletions to be made.


    If the card file is a COBOL program, it should be copied without change to the
    file of source text for the COBOL compiler. Otherwise, the requested member should
    be retrieved from the source statement library and copied to the file of source
    text, insertions and deletions taking effect on the copied text but not on the
    source statement library.


    The source statement library consists of number members, each containing a COBOL
    program in card-image form. The card images carry sequence numbers in columns
    1–6 and are stored in ascending order by sequence number within each member. The
    library is to be accessed by invoking a procedure which is already available.
    This procedure requires an OPEN command to make the library ready, then a FIND
    command to access an individual book; card images are read serially by a READ
    command, which may return the "end-of-member"; a CLOSE command is required for
    the member, and another for the library. The FIND command may return the result
    "not found".


    The card file, if it is not a COBOL program, consists of the following:


    +   - BASIS card. “BASIS” in columns 1–5, and the name of the requested member
    in columns 7–14. Must be the first card of the file; only one library member can
    be accessed in any one run.'
