    Our conclusions, then, are first, that components of general utility

    do not (and should not) emerge from top-down design; second, the converse

    of the first, that such components can and should be created by the processes

    of bottom-up design; third, that such components must be thought of by

    the, the top-down designer, as elementary components of the machine

    he is using and therefore not susceptible to internal examination; fourth,

    that the top-down designer must create tree structures, working at a level

    at which there can be no shared components.


    Once again we seem to be flying in the face of established good practice.

    Surely it is every programmer''s ambition and duty to design so that a high

    proportion of his code can be used for more than one purpose, thus econom-

    izing valuable storage space? The objection contains its own answer.

    Shared components, other than elementary components, are an optimization

    device; they are discussed in Chapter 12.


    # 27


    A program structure, and the coded program written from it, is a general

    pattern defining a set of possible computation processes. Each time the

    program is run one particular member of that set of processes is executed:


    ![](img/2af52882003b66fe0217f904c606a0f9_51_0.png)'
  merge: -1
  pgno: 51
- img_proc: true
  md: '# Ch. 2 STRUCTURES AND COMPONENTS 37


    it is unlikely, for most realistic programs, that exactly the same process would
    be executed on two different occasions; if we were to keep an exact trace, statement
    by statement, of each execution of the program, we would be very surprised to
    find two identical traces. The set of possible complete processes is very large,
    but at the same time it is tightly constrained by the program structure.


    The same is true of the data structures on which we base our program structures.
    A data structure for a file is a general pattern defining the set of all possible
    instances of that file: the set of all possible instances is large, but at the
    same time it is tightly constrained by the structure. Consider, for example, the
    file structure shown opposite.


    A T1 record has the value 1 in position 1, a T2 record has the value 2, and so
    on. The following instances of files are all properly described by this structure:


    +   - T1, T1, T3;

    - T2, T1, T1, T1, T3;

    - T3:

    - T2, T2, T2, T2, T3;


    but the following are not:


    +   - T1, T2;

    - T4, T3;

    - T3, T1, T1, T2, T3;


    Now, if we base our program structure on the file structure given, because that
    is the structure of the input file which the program is required to process, we
    cannot uniquely predict the operation of the program on those files which are
    not properly described by the structure. We will say that those files are not
    valid input to the program, and that its operation on those files is unspecified.


    Sometimes it is right to draw an exceedingly general data structure. If a program
    processes a punched card file, it would be very inconvenient if the behaviour
    of the program were unspecified merely because of a keypunching error or because
    a card had been dropped from the deck. In such a case we would devise a structure
    which could accommodate all possible card files, and the resulting program would
    operate in a specified manner on any deck of cards we cared to present.


    But this is not the usual case. More often we will want to define data structures
    which are quite tightly constrained. We must then ensure, at a higher level of
    design, that invalid data cannot reach the program.'
