  md: '# PRINCIPLES OF PROGRAM DESIGN


    these versions would be indistinguishable to the invoking program.


    In addition to providing ourselves with the procedure HSV, we will modify the
    program PJ. We will add a communication area to the list of parameters:


    CALL “PJ” USING STATE-VECTOR, COMM, RECORD.


    which will allow P to issue distinct commands to PJ for opening, writing and closing
    the jobaptape, and will allow PJ to return a result indication to P. Specifically,
    the result indication which PJ may return to P on a command “end of jobaptape”,
    returned when PJ has processed the log-off record for the job.


    The new form for P is therefore:


    ```

    P seq

    open logaptape;

    read logaptape;

    PB until eof-logaptape;

    read sv (job-number);

    PSVA select not-found

    create dummy sv;

    insert sv (job-number);

    open PJ (sv, comm, record);

    PSVA end

    write PJ (sv, comm, record);

    .PSVB select end-of-jobaptape

    close PJ (sv, comm, record);

    delete sv (job-number);

    PSVB or not end-of-jobaptape

    update sv (job-number);

    PSVB end

    read logaptape;

    PB end

    P end

    ```


    The “close” invocation of PJ is equivalent to a write invocation in which the
    record passed to PJ is the end marker for the jobtape.


    The associated changes to PJ are these. First, PJ must set the result in the communication
    area: this result is always “OK” except when PJ returns after processing the log-off
    record, when we require:


    ```

    SUBTRACT X FROM LOGOFFTIME GIVING JOBTIME.

    ```'
