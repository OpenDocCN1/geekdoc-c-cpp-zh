    by the special block; for P2 it was indicated by the null telegram. Further, we
    specified that for a valid file these indications must agree: if there is no null
    telegram, or if it is followed by additional words, the file is invalid and we
    need not consider the problem of processing


    These specifications allowed us to restrict the interface between P1 and P2W,
    or between P1W and P2, to a single operation type: every invocation of P2W is,
    a “write” command; every invocation of P1W is, in effect, a “read” command. That
    is why we were able to eliminate the “open” and “close” operations on the word
    file when we inverted P1 and P2.


