  md: '# 38 PRINCIPLES OF PROGRAM DESIGN


    # 2.8


    Our programs are designed for essentially sequential machines, and are written
    accordingly in a sequential language. Some machines are not purely sequential,
    but can carry out more than one operation at a time; for example, in a machine
    with two arithmetic processors the following two operations can be performed:


    ```

    ADD A, B GIVING X.

    MULTIPLY C BY D GIVING Y.

    ```


    one processor calculates X while the other simultaneously calculates Y.

    In the present state of computing technology we are almost always quite happy
    to leave it to the compiler and the hardware between them to recognize the possibility
    of such parallel computation. We are not disturbed by the necessity of writing
    a program which is, in an important sense, overspecific: we have chosen to write
    the MULTIPLY second and the ADD first, while we could equally well have made the
    opposite choice; ideally, perhaps, we would have written the program in a form
    which left the order unspecified.


    To write such programs we would need a different set of structuring rules for
    components from those described in this chapter. We would need to be able to write
    components which were like sequences except that their parts were unordered; like
    selections except that the conditions were tested in any order, or in none; like
    iterations except that the occurrences of the iterated part were taken in any
    order, or in none.


    While we are designing sequential structures for sequential machines we will occasionally
    feel the need for an unordered component; this need arises in one of the exercises
    at the end of this chapter. But the discomfort is small. Where the discomfort
    is large, as when we are dealing with a multi-threading problem, we will need
    to find some way of simulating parallel operation of several processes: the topic
    is discussed in Chapters 10 and 11.'
