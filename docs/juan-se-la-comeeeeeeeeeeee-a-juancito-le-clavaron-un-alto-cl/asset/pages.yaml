  md: '# Ch. 5]


    # ERRORS AND INVALIDITY


    # 107


    giving the complete structure


    ![](img/2af52882003b66fe0217f904c606a0f9_122_0.png)


    Now, of course, GOODCALC is relying on the correct functioning of CALC, as CALC
    itself has previously been relying on the correct functioning of COMP. To avoid
    reliance we must structure GOODCALC as ... and so on, in an endless proliferation
    of futile code. If we are ever to write the program we must eventually reconcile
    ourselves to the idea that it will contain components whose operation is unspecified
    for certain data inputs.


    That reconciliation should come at the earliest possible moment. Some data processing
    systems have been built on the avowed, though self-contradictory, principle that
    every component should check its input data fully. Because the principle is self-contradictory
    it cannot be observed consistently. Usually the result is that the checking is
    done twice or more, some is done once and some is not done at all. This is inevitable,
    because there is no consistent rule for allocating the responsibility for checking.
    The only consistent rule is:


    every component specification must define precisely what data is valid for the
    component;


    every component must be designed and coded on the assumption that its data is
    valid;


    if component B is a part of component A, then A is responsible for ensuring that
    the data passed to B is valid for B.


    Finally, we observe that it is a capital error for a programmer to update a component
    specification to reflect his code. If the original specification is imprecise,
    he should clarify before starting to design and code; if it is precise, he should
    leave it alone.'
