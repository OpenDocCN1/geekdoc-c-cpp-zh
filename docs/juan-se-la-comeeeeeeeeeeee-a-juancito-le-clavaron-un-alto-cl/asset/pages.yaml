  md: '# Ch. 10] MULTI-THREADING 227


    in which the appropriate state vector is found by subscribing, and its new value
    automatically remembered because PJ would update it in situ.


    The disadvantages of this technique are obvious. Apart from the cumbersome enumeration
    of the individual state vectors, due to a defect of the COBOL language, we have
    the disadvantages:


    The number of jobs to be processed must be known at the time P written;


    There must be a simple one-to-one correspondence between the job-numbers and the
    integers;


    Two jobs cannot share a state vector even if one of them is completed before the
    other begins;


    All of the state vectors must be held in core storage;


    The format of a state vector must be known in P, although the state vector is
    essentially private to PJ.


    A better solution is to regard the state vectors as constituting a direct-access
    file. We will need an input-output procedure, HSV, to handle this file. HSV must
    be able to satisfy the following invocations:


    Read sv (job-number); HSV returns the state vector for the specified job-number
    or, if there is no state vector for the specified job-number, returns "not-found"
    result;


    Insert sv (job-number); HSV inserts the state vector as a new record in the file,
    associating it with the specified job-number; there must be no state vector for
    the specified job-number already on the file;


    Delete sv (job-number); HSV deletes the state vector for the specified job-number;


    Update sv (job-number); HSV deletes the existing state vector and inserts the
    new state vector for job-number.


    From the point of view of the invoking program, HSV appears to be an ordinary
    input–output procedure. There is no reason, however, why we should not implement
    various versions of HSV, including one which stores the state vectors in main
    storage and another which stores them on disk:


    ![](img/2af52882003b66fe0217f904c606a0f9_242_0.png)'
  merge: -1
