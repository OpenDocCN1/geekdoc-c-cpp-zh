    Stage 3 is the final stage, when we consider the side-effects. We may classify
    the side-effects as intolerable, neutral and beneficent:


    an intolerable side-effect must be undone; if we have buried the bag of jewels
    we must dig it up again; if we have printed a line on the line printer we must
    backspace and erase it; if we have read a card we must backspace the card reader;
    if we have incremented a variable we must restore it to its original value;


    a neutral side-effect may, but need not, undone: if we have chalked a cross on
    the bridge we may erase it there or leave it; if we have read a disk record into
    main storage we may leave it there or overwrite the buffer, whichever is more
    convenient; if we have set a value in a variable we may preserve it or overwrite
    it;


    a beneficial side-effect is one which does us good; we would be foolish to throw
    away the four-clover leaf, so we keep it.


    In Problem 9 we may perhaps all the side effects as neutral: it does not matter.
    when we come to execute the admit part of the posit. whether or not we have retrieved
    the entry from the table and whether or not we have accessed the disk record.
    So we have no significant work to do at Stage 3.


