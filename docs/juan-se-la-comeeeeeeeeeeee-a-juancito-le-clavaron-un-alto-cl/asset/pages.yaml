    # 1.3


    Here is another illustration of the difference between right and wrong program
    structures.


    # PROBLEM 2—PRINTING INVOICES


    A serial master file contains customer name and address records, arranged in ascending
    sequence by customer number. Another serial file contains billable item records,
    arranged in ascending sequence by date within invoice number with customer number.


    These two files are to be used to print invoices. There may be more than one invoice
    for a customer, but some customers will have no invoices. Due to punching errors,
    there will be billable item records for which no customer record exists; these
    are to be listed on a diagnostic file of messages.


    Shown opposite is a flowchart of a solution. We assume that at the end of each
    file the associated record area is filled with artificially high values.


    Here, in abbreviated and informal style, is skeleton coding for a COBOL program
    corresponding to the flowchart . . .


    ```

    PROCEDURE DIVISION.

    PSTART.

    Read item file.

    Read customer file.

    PERFORM PROCESS-ITEM UNTIL end of item file.

    STOP.

    PROCESS-ITEM.

    IF CUSNO IN ITEM-RECORD > CUSNO IN CUS-

    RECORD

    Read customer file

    ELSE IF CUSNO IN ITEM-RECORD < CUSNO IN CUS-

    RECORD

    ```'
