  md: '# 11. SYSTEMS AND PROGRAMS


    # 11.1


    The concepts of serial file processing are fundamental to the design technique
    presented in this book. We base our program structures on data structures, and
    those data structures are structures of serial files. Sometimes we are dealing
    with files stored on peripheral devices, such as card readers, line printers or
    tape or disk drives; sometimes with files held in main storage, such as character
    strings or tables of serially arranged entries. But there are always serial files
    to be processed. The technique of program inversion allows us to design a program
    to process a complete file, taking full account of the relationships among the
    records of the file, and then to code that program in the form of a record handling
    routine, which processes only one record of the file at each invocation. Further,
    by separating out the state vector, we can use the record handling routine to
    process several instances of the file simultaneously.


    At first it might seem that the applicability of the technique is strictly limited.
    But what system design at the higher levels, where the elementary components are
    themselves application programs? What about software design at the lower levels?
    What about on-line systems? The purpose of this chapter is to indicate the wider
    relevance of the technique, and to suggest an underlying unity of system design
    at all levels.


    The chief obstacles to recognition of this unity are:


    > Problems are often posed in such a way that the designer is given a worm''s
    eye view of the system: he is encouraged to think about individual records when
    he should be thinking about the file, about characters when he should be thinking
    about the string;


    For various reasons, good and some bad, the software environment is radically
    different at different levels: it is not too difficult to see what is common to
    COBOL and machine language, but much harder to see what is common to COBOL and
    the Job Control Language;'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# PRINCIPLES OF PROGRAM DESIGN


    There is a real need for efficiency, especially at the highest and lowest levels
    of a system: design thinking often begins by optimizing the use of the available
    facilities, stressing the unique characteristics of those facilities, instead
    of beginning by reaching a full understanding of the problem, thus stressing its
    general structure, and only then moving to consider its efficient implementation.


    Much of the discussion in this chapter will be based on the following example
    problem. The main purpose of the problem is to serve as a source of illustration
    of various points; very little detail is provided in the problem statement, and
    no unified solution is attempted.


    # PROBLEM 17—LOANS SYSTEM


    The Bank of Timbuktu is in the business of making loans to commercial customers.


    Each new customer must go through a process of negotiation with the bank, in which
    the general terms are agreed for all loans to that customer. Each round of negotiations
    is recorded in a transaction of type TN, and submitted to the computer system
    for evaluation. After the final round of negotiations, agreement is reached (the
    Bank never loses a customer) and the agreed terms are submitted to the system
    in a TA transaction. The customer is permitted to receive any number of loans,
    but only one loan may be current at any time. The transactions submitted for each
    loan are a loan initiation (TI), followed by a number of repayments (TR), followed
    by a loan termination (TT). Naturally, each loan may be in existence for several
