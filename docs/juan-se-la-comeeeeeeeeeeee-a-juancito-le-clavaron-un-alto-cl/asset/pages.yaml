    program fails during execution, we will need some kind of trace facility to help
    us to determine why it has failed, to determine the history of execution before
    the failure. We may also wonder about the design process: was PE designed originally
    as a part of PA or as a part of P? Did the designer have both PA and P in mind
    when he designed PE? In designing PJ, did he have in mind PD, PE as a part of
    PA, PE as a part of P, PF as a part of PB and PF as a part of P, all at the same
    time? If so, his span of attention must have been comfortably worn.


    All this discussion has been based on the assumption that we are practising top-down
    design; it leads to the conclusion that the result of top-down design should be
    a tree structure. But top-down is not the only possible technique. There is also
    bottom-up. In top-down design we say, in effect, “this problem is too complex
    for me; I shall dissect it into a number of smaller problems, and those into smaller
    problems still, until I have a set of problems simple enough to solve”. In bottom-up
    design we say “this machine is not well suited to my problem, because the elementary
    operations are too elementary; I shall therefore use the elementary operations
    to create a more powerful machine, and the operations of that machine to create
    one still more powerful, until I have a machine on which my problem can be easily
    solved"


    In bottom-up design we are paying only the most general attention to the original
    problem: the main impetus of the work is to create a new machine which will be
    more suitable than the old one. For example, if we were forced to write a set
    of mathematical programs in COBOL, involving manipulation of matrices, which was
    capable of arithmetic operations on matrices. We might specify a new COBOL-M data
    type, the matrix, and a set of operations MATRADD, MATSUB, MATMUL and MATRDIV;
    we would find it convenient to introduce new figurative constants MZERO and M1,
    to represent the zero and unit matrices. To implement our new machine we might
    decide that the new data components be defined as members of the source-statement
    library and that the operations should be written as sub-programs. Just as in
    COBOL we can multiply two numbers, A and B, assigning the result to another number
    C, by the statement


    MULTIPLY A BY B GIVING C


    so in our new machine we could multiply two matrices by the statement CALL “MATMUL”
    USING A, B, C.


    Effectively, the matrix operations are elementary operations in the COBOL-M machine.
    They should be so well designed and so carefully specified that we never ask how
    they work or how they were built: it'
