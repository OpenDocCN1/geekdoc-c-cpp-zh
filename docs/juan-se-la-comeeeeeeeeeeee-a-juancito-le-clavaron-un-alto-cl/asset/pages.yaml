    # 13.1


    The central theme of this book has been the relationship between data and program
    structures. The data provides a model of the problem environment, and by basing
    our program structures on data structures we ensure that our programs are intelligible
    and easy to maintain.


    The data structures used are limited in two ways. Firstly, we have avoided recursive
    structures, in which a component may contain itself, directly or indirectly, as
    a part. For example, a COBOL program may contain COPY statements, whose meaning
    is that the specified library member is to be inserted into the program text.
    If we allow library members themselves to contain COPY statements, then the resulting
    structure of a program is:


    ![](img/2af52882003b66fe0217f904c606a0f9_294_0.png)'
