  md: 'We have already used a similar technique to handle the usual end-of-file flag.
    Instead of coding the read operation as:


    ```

    PROCREAD.

    MOVE SPACE TO FILE-EOF.

    READ FILE AT END MOVE "E" TO FILE-EOF.

    ```


    we reduce the number of executions of the "move space" instruction by writing
    the whole program as:


    ```

    PROGSTART.

    MOVE SPACE TO FILE-EOF

    OPEN INPUT FILE.

    READ FILE AT END MOVE "E" TO FILE-EOF.

    ...

    ...

    READ FILE AT END MOVE "E" TO FILE-EOF.

    READ FILE AT END MOVE "E" TO FILE-EOF.

    ...

