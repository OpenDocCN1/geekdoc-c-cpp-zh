    # 2.6 Elementary Components


    The programming language we use provides us with a set of elementary components.
    More precisely, with two sets: one for data and one for programs. To design a
    system we must dissect the data into a structure of which the lowest level components
    are the elementary data types of the programming language; similarly we must dissect
    the program into a structure of which the lowest level components are the elementary
    executable operations of the language.


    By definition, an elementary component has no parts, and can not be dissected
    into a structure of smaller components. For example, if we declare an elementary
    COBOL data item


    # 03 FLDA PIC S9(4) COMP.


    we can execute certain operations on the item taken as a whole, but we cannot
    legitimately execute any operation on an individual digit. It is sometimes possible
    to devise ingenious coding which will operate on less than the whole of an elementary
    item; such coding always relies on knowledge of how the item is represented by
    a particular compiler in a particular machine, and is not a proper use of the
    programming language.


    Of course, we know very well that components which are elementary in the programming
    language are composite from the point of view of the generated machine instructions
    and the internal workings of the machine. For example, we may declare an item


    # 02 FLDB PIC X(20).


    and use the elementary operation


    ```

    MOVE SPACES TO FLDB.

    ```


    Inspection of the generated code shows that it consists of two instructions


    ```

    MVI FLDB, C''

    MVC FLDB=+1(19), FLDB

    ```'
