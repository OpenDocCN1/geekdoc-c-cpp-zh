  md: '# PRINCIPLES OF PROGRAM DESIGN


    Consider the problem of constructing such a compiler. Without delving too deeply
    we can see that the compiler must deal with the structure of the card file and
    the structure of the source-statement library, and must also deal with the structure
    of the syntax of a COBOL program. There are other data structures involved, naturally,
    but we can see immediately that there is a clash between the structure of the
    card file and the structure of COBOL syntax:


    ![](img/2af52882003b66fe0217f904c606a0f9_169_0.png)


    Now, taking the card file and the source statement library together, it is clear
    that they must define a proper COBOL program in which the various components—ID
    Division, Environment Division, Data Division, etc.—appear in their proper order.
    There is no way of knowing where the boundaries between the divisions and sections
    will come in relation to the structure of the card file and library member. For
    instance, the Data Division header may come from the library member, or from the
    card file as part of an insertion, or as part of a deletion, or from the card
    file without any reference to the library at all. We cannot find correspondences
    between the COBOL syntax structure and the structure of the card file.


    We cannot therefore form a single program structure to process both the data structures.
    The form of the program specified in Problem 8 presupposes an obvious solution:
    the compiler is split into two programs, P, one of which, produces the text file
    from the card file and the library, while the other is the COBOL compiler proper.
    Only program P needs to know about the structure of the card file, and only the
    compiler proper needs to know about the structure of COBOL syntax.


    We may call this type of clash a “boundary clash”. There is no difficulty about
    ordering: everything is in an appropriate order already. There is still a clash
    between the structures which completely prevent them from being handled by a single
    program structure. There is no need for a sort; but there is an inescapable need
    for at least two program structures.'
