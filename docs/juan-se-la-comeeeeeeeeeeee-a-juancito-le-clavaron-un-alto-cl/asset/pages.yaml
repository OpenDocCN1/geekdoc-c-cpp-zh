- img_proc: true
  md: '# Ch. 13] RETROSPECT 283


    We cannot hope to find logic errors by testing. Logic errors are concerned with
    combinations of circumstances, and there are too many combinations to test. Instead
    of testing we must think and plan and design so that testing becomes unnecessary.


    Consider, for example, Problem 13 (Telegrams Analysis). If we were asked to devise
    a good set of test data to check out a purported solution to this problem, we
    might wish to include these cases among many others:


    +   - telegram exactly filling one block;


    +   - telegram starting in the middle of a block and ending in the middle of the
    next block;


    +   - telegram starting at the beginning of a block and ending in the middle of
    the next block;


    +   - telegram starting at the beginning of a block and ending in the middle of
    the same block;


    +   - telegram starting in the middle of a block and ending in the middle of the
    next block but one, the intervening block being full of spaces;


    +   - telegram starting in the middle of a block and having its split terminating
    ZZZ word as the first word of the next block.


    These test cases seem reasonable. They are concerned with a point of potential
    difficulty in the problem: the interaction between blocks and telegrams. But the
    solution to this potential difficulty lies in the program design. We designed
    a program, in Chapter 8 above, in which all interaction between blocks and telegrams
    is excluded. We split the program into two parts, P1 and P2: P1 deals only with
    blocks, and knows nothing of telegrams: P2 deals only with telegrams, and knows
    nothing of blocks. The test cases suggested above are quite irrelevant to such
    a program; the errors which they might reveal have been eliminated in the design.
    We know that the program is correct, because we designed it correctly.'
