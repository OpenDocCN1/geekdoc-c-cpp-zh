    report. However, when we come to allocate the executable operations, we realise
    the inadequacy of this program structure. There must be an operation “add 1 to
    number of jobs”, and this operation must be executed once per job. Where is the
    program component which is executed once per job? Perhaps we could use the component
    which processes a record “N”? But what about the operation “subtract log-on time
    from log-off time”? This must be part of a component which processes both the
    log-on and the log-off records for a job:


    And, of course, there is a similar difficulty for program-loads and unloads. The
    resourceful and ingenious reader may well be ahead of me here. We can evade all
    of these difficulties. We write the component “process record” as:


    ```

    PROCREC select log-on

    njobs:=jobs+1;

    totptime:=totjobtime – logontime;

    PROCREC or log-off

    totptime:=totjobtime + logofftime;

    PROCREC or program-load

    nprogs:=nprogs+1;

    totptime:=totprogtime – loadtime;

    PROCREC or program-unload

    totptime:=totprogtime + unload

    PROCREC end

    ```


    There is no need to bring together the log-on and log-off for each job, or the
    load and unload for each program.

    Is this a good solution? It works, and it is cheap and easy. But if we have any
    aspirations to solve Version 2 of the problem, or to make even minor enhancements
    to Version 1, it is quite wrong. The concept of a job and the concept of a program
