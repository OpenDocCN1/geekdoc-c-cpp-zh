  md: '# 106 PRINCIPLES OF PROGRAM DESIGN


    # 5.5


    But should we not try to ensure that operation is always specified? Is it not
    a principle of good design that every program component should check the validity
    of its input? Surely the programmer should update the specification to reflect
    the code he has written


    The short answer is no, no and no again.


    Certainly, any component which receives its input data directly from a human agent,
    or from an unreliable machine source, should be designed so that all input data
    is valid and hence operation is always specified. It would be very inconvenient
    for an on-line system to be vulnerable to a trivial error on the part of a terminal
    user. But components which receive their input data from other components of the
    same system must be able to rely on the correct functioning of those components


