    # 10.6


    Finally, we come to consider the program SUM, which we must design and then invert
    with respect to the output file. The basic form of SUM is:


    ```

    SUM seq

    open output;

    read record from output; (jobinf or eof)

    write report headline;

    initialize totals;

    SUMBODY iter until eof-output

    add jobinf to totals;

    read record from output; (jobinf or eof)

    SUMBODY end

    calculate averages;

    print report;

    close output;

    SUM end

    ```


    It should be clear to the reader that when this program is coded in an inverted
    form its state variable will have two values, one corresponding to the first invocation
    and the other corresponding to the read statement within SUMBODY.


    Thus we will have:


    ```

    ENTRY "SUM" USING JOBINF.

    ```'
