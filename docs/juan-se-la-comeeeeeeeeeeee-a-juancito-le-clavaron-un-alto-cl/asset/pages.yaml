- img_proc: true
  md: '# PRINCIPLES OF PROGRAM DESIGN


    The structure of a library member is recursive, because it contains a library
    member as a component.


    Inherently recursive structures occur only rarely in data processing. Indeed,
    apart from the parts explosion ("a product is made from a number of parts, which
    are made from parts, which ...") it is difficult to think of important examples.
    For that reason, and also recursion is very inconvenient to implement in COBOL,
    we have accepted the limitation. However, the limitation can be easily removed
    if we adopt a language such as PL/I which allows recursive programs to be written
    conveniently; the techniques presented in this book are largely unaffected.


    The second, and more important, limitation on data structures is they are hierarchical
    and must be explored sequentially. The serial file is fundamental. At first sight
    this emphasis on serial files may seem to some readers to absurdly out of date.
    Surely tapes have long since been superseded by disks, processing by on-line systems,
    discrete files by database management software? Yes, have; but these changes are
    relatively superficial. A useful program must have a serial input file. An on-line
    program has a serial input file of messages from the user, and outputs to a serial
    output file of replies. An interrupt-handling routine has a serial input file
    of interrupts. A software routine to provide a sophisticated access method has
    a serial input file of access requests. A program which updates a customer''s
    master record has a serial input file of transactions initiated by or for customer.
    All of these files are serial because the reality which they model is chronologically
    ordered; if we ignore or distort the serial nature of the file we cannot deal
    correctly with the reality.


    We may think of a system as an aggregate of many individual programs—one for each
    individual entity in the real world with which the system is connected. Each individual
    program has a serial input file of transactions pertaining to the corresponding
    entity, and a serial output file of the responses to those transactions. We would
    have a program for each customer, a program for each employee, a program for each
    supplier, a program for each insurance policy, and so on. We also need overall
    control program to direct the transactions to the appropriate individual programs
    and to transfer the outputs either to the final system output or to the input
    of other individual programs. When we come to implement the system in practice
    we make two changes. We group together the individual programs for the entities
    of one class—such as the class of employees—by inverting the programs and storing
    their state vectors as a master file—the employee master file. Also, for reasons
    of efficiency, we may batch the transactions in various ways and disseminate the
    work of the control program over various parts of the operating system, and of
    the special-purpose control programs which'
