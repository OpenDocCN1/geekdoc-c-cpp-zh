  md: '# Ch. 4]


    # MULTIPLE DATA STRUCTURES


    # 73


    Analogous structures may be drawn for RFILE. However, whatever we do to achieve
    correspondence, we will be unable to escape from two constraints:


    neither LFILE nor RFILE can be correctly interpreted by the program without reference
    to the other file


    the program structure cannot contain a component “process lree” or a component
    “process rrec”.


    Both of these constraints are due to the essential nature of any collating problem:
    none of the collated input files can be interpreted in isolation; there cannot
    be a unique program to process each record of an input file because the records
    have various meanings according to the presence or absence of matching records
    on the other files.


    Choosing the simplest of the data structures, distinguishing between matched and
    unmatched records on each file, we have the following correspondences:


    LFILE, RFILE and REPORT correspond:


    MATCHED LREC, MATCHED RREC and TYPE1 correspond;


    UNMATCHED LREC corresponds to TYPE2;


    UNMATCHED RREC corresponds to TYPE3;


    nothing in the input files corresponds to TYPE4.


    Listing and allocating the executable operations is straightforward, and we arrive
    at the following program:


    ```

    PMAGIC seq

    open LFILE; read LFILE;

    open RFILE; read RFILE;

    N:=1;

    PMBODY iter until N > 9999

    PROCNUM select LNO = N = RNO

    write type1;

    read LFILE;

    read RFILE;

    ```'
