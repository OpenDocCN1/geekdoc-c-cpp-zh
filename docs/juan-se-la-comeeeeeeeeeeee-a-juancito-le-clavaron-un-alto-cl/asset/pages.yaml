- img_proc: true
  md: '# PRINCIPLES OF PROGRAM DESIGN


    cannot be the first stage in building a program; it must be preceded by design.
    But flowcharting is not designing. Design is about structure, and flowcharts,
    as their name suggests, are about the flow of control. At the time when the designer
    should be thinking about the shape of his problem, the flowchart encourages him
    to think about execution of the program inside the computer. Of course, some programmers
    who draw flowcharts do produce well structured programs; but their success tend
    to conceal the technique, not because of it. For a given flowchart, there are
    many ways of arranging the symbols on the page, and the programmer must exercise
    superhuman foresight if he is to achieve the arrangement which exhibits the structure
    he has in mind. So we will draw no more flowcharts.


    Another, more positive, lesson is that program structures should be based on data
    structures. There are deeply underlying reasons why this is so, and we depict
    them in the following diagram.


    ![](img/2af52882003b66fe0217f904c606a0f9_25_0.png)


    The problem environment is the real world, or that part of it which affects and
    is affected by the computer system. In Problem 2 this world contains a number
    of customers, individually identifiable; these customers have purchased items
    from the organization served by the computer system; they'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Ch. 1) INTRODUCTION 11


    now owe money in payment for those items, and that money is to be collected by
    sending out invoices; there may be more than one invoice per customer, perhaps
    because he has purchased items from more than one part of the organization.


    The computer system sees the world through the medium of its data structures.
    The customer file is a model, intelligible to the computer, of the set of customers;
    each customer is represented by a record and is individually identifiable by the
    customer number, the key of the record. The item file is a model of the set of
    items purchased by the customers. The invoice file is a model of the customers''
    debts, and at the same time plays a direct part in the real world.


    The task to be performed must make sense in the real world; a customer owes money
    because he has purchased some items, and the total of his debt is the total price
    of those items. We collect together all of the item records and write out the
    required number of invoices. The total line on the invoice is formed by adding
    up the item prices, and the invoice is mailed to the customer''s address.


    The program we are trying to build consists essentially of operations to be executed
    by the computer. Some of these operations are concerned with finding our way around
    the data structures: when we are ready to pass on the next item we must execute
    the operation “read item file”; when we are ready to start a new invoice we must
    skip to the top of a page. Other operations are more directly concerned with the
    task to be performed: for each item in an invoice we must execute the operation
    “add price to invoice total”. Each operation must appear somewhere in the program
    text, in some program component. To make an intelligible and correct program we
    must ensure that for each operation there is an appropriate component in which
    it may appear; “add price to invoice total” must appear in a component which processes
    each item in an invoice; “skip to top of page” must appear in a component which
    processes the start of each invoice.


    In general, both types of operation, those concerned with finding our way around
    the data structures and those more directly concerned with the task to be performed,
    can be associated with components of the data structures. If, therefore, we give
    our program the same structure as the data it processes we can expect that we
    will have no difficulty.


    These ideas are the basis of the design techniques discussed in this book. We
    start by considering the data structures, which we then use to form a program
    structure. We list the executable operations needed to carry out the task, and
    allocate each operation to a component of the program structure. There are, of
    course, further steps in the design process, but these three are the first and
    the most important: the quality of the work we do as we take these steps will
    determine the quality of the programs we write.'
