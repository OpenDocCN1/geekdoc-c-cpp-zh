    \ select and or. To posit is to lay down a hypothesis: we are laying down the\
    \ hypothesis that the card is a good card; if it turns out that our hypothesis\
    \ is wrong, we will admit that the card is a bad card after all. Second, we have\
    \ introduced the statements “quit PCARD if error F1”, etc. These are executable\
    \ statements, placed at each point in the data structure of a good card where\
    \ the hypothesis that the card is good could be falsified by the facts. Thus “quit\
    \ PCARD if error F1” means this is not a good F1, then according to my data structure,\
    \ the card cannot be a good card, and I must accordingly admit that my hypothesis\
    \ is false”. Possible COBOL coding for this program is:\n\n```\n...\nARDPOSIT.\n\
