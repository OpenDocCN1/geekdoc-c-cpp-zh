    # 3.5 End of File


    The physical representation of a serial file must include a special end-of-file
    record of some kind; in general, we can recognize the file has been completely
    processed by encountering this special record.

    In Problem 4, however, we were able to recognize the end of the input file by
    the terminal T2 record. The T2 record acts as a trailer or sentinel, but in addition
    it plays the role of an ordinary record of the file and may be processed in whatever
    we wish. This is not true of the special end-of-file record, which is directly
    recognized by the input-output software and is inaccessible to the programmer.
    Conventionally, in COBOL, PL/I, FORTRAN and other commonly used languages, recognition
    of the end-of-file record is fugitive; it raises a condition which can be evaluated
    only'
  merge: -1
  pgno: 72
- img_proc: true
  md: '# 58 PRINCIPLES OF PROGRAM DESIGN


    as part of the read operation itself, and the programmer must ensure that the
    condition is recorded in a form capable of subsequent evaluation.

    For example, in COBOL he must write


    ```

    READ INFILE AT END imperative-statement

    ```


    where imperative-statement is an assignment statement, a GO TO, a PERFORM or some
    other unconditional statement. In FORTRAN he may write


    ```

    READ (3,100,END=99) A, B, C

    ```


    specifying that control is to be transferred to statement 99 when the special
    end-of-file record is read. In PL/I the end of file is handled by an on-unit:


    ```

    ON ENDFILE (INFILE)

    EOF FLAG="E";

    ```


    when a read statement is executed which causes the end-of-file record to be read,
    the assignment to EOF_FLAG is executed and control returns to the point following
    the read statement.


    Whatever the facilities, or obstacles, provided by the input-output software,
    we must adopt a technique that satisfies these requirements:


    > the read operation must remain closed with respect to the flow of control: that
    is, processing must continue at the point in the text following the read statement,
    whether or not the end-of-file has been reached:


    > the end-of-file record must be effectively recognizable as a possible value
    of "next record", and the test for the value must be capable of being anywhere
    in the program and not only during or immediately after the read operation.


    One obvious technique is to place some unique value in the record area:


    ```

    READ INFILE AT END MOVE HIGH-VALUES TO KEY-FIELD.

    ```


    However, this technique is not sufficiently general. First, why the records of
    a serial file should not be bit-strings. able to take all possible values; there
    is then no unique value available to designate the end of file. Second, some software
    has been designed (wrongly) in such a way that main storage for the record area
    is released when the end of file is'
