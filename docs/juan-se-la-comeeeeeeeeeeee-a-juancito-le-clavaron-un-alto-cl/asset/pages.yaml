  md: '# PRINCIPLES OF PROGRAM DESIGN


    ![](img/2af52882003b66fe0217f904c606a0f9_185_0.png)


    area of main storage (the “buffer”) consists of a data item and a flag X: the
    flag X indicates whether the buffer is full or empty. The “write word” and “read
    word” procedures of P1 and P2 respectively have been replaced by instructions
    which write to the supervisor and read from the buffer. Operation is as follows:


    the supervisor sets the flag X to indicate that the buffer is empty; it then passes
    control to one of the programs, which begins execution:


    when a “write word” operation in P1 is executed, the effect is:


    +   WW seq

    WAIT until buffer is empty;

    move word to buffer;

    SET buffer-flag = full;

    WW end


    the WAIT instruction returns control to the supervisor; control cannot return
    to the “move word” instruction until the buffer is empty:


    when a “read word” operation in P2 is executed, the effect is:


    +   RW seq

    WAIT until buffer is full;

    move data to word;

    SET buffer-flag = empty;

    RW end


    the WAIT instruction returns control to the supervisor; control cannot return
    to the “move data” instruction until the buffer is full:'
