  md: '# APPENDIX


    PARAM1, PARAM2 and PARAM3 as declared in the invoking program. At machine code
    level, the parameter list consists of the addresses of the actual parameter list
    in main storage.


    All data declared in the data division is global within the compilation. Each
    program, whether it is a main program or a sub-program, must be separately compiled.


    # A3. Data Division


    The data division begins with the division header card


    # DATA DIVISION.


    It is arranged in three sections: FILE section; WORKING-STORAGE section; LINKAGE
    section. Each section begins with a section header card, such as


    # WORKING-STORAGE SECTION.


    in which the word "working-storage" starts in Area A.

    The file section declares the files which the program handles, and the formats
    of its records. The working-storage section declares local variables. The linkage
    section contains the declarations of dummy or formal parameters, and is therefore
    required only for sub-programs.


    The fundamental concept in COBOL data declarations is the record. A record is
    a hierarchical structure of data items which occupy fixed locations in main storage.
    Each component of the structure is described by a data item description, consisting
    of a level indicator, a name and certain other (optional) information. For example,
    in the record description:


    ```

    01 CUSREC.

    02 CUST-NO...

    02 AMOUNT...

    02 DATE.

    03 DAY...

    03 MTH...

    03 YEAR...

    ```


    the name of the record is CUSREC; it consists of CUST-NO, AMOUNT and DATE, in
    that order; DATE consists of DAY, MTH and YEAR, in that'
