  md: '# 8. PROGRAM INVERSION


    # 8.1


    All of our solutions to structure clash problems have depended on introducing
    intermediate files. In Problem 8 (Source Statement Library) we introduce the text
    file between program P and the COBOL compiler; in Problem 13 (Telegrams Analysis)
    we introduce the word file between programs P1 and P2; in Problem 14 (System Log)
    we introduce many job files between program P and the output program SUM.


    These intermediate files solve the structure clashes perfectly: the reduced to
    simple processing of structures between which satisfactory correspondences exist.
    But the inefficiencies are inconvenient and sometimes intolerable. We are compelled
    to write the whole of a serial file before we can read any of it, a constraint
    which is often inherent not in the problem but only in our method of solution.
    In the Telegrams Analysis problem there is no reason why we should not begin printing
    the report at the same time as we begin to read the paper tape; as we come to
    the end of each telegram in the paper tape we can print the associated lines in
    the report. But the presence of the intermediate word file forces us to process
    all of the tape before we can start on the report. In the System Log the inefficiency
    is much worse; we have to provide a tape drive, or equivalently, a disk area,
    for each job represented in the log tape: the number of drives needed will certainly
    be greater than the number we can conveniently provide. In the Source Statement
    Library problem we are forced to write the intermediate text file if it proves
    to be no more than a copy of the card input file: we have added a pass to the
    compiler, and sometimes that pass will be entirely useless.


    One of eliminating the intermediate files is to run the programs under the control
    of a multi-programming supervisor. Each successive record of the file is written
    into an area of main storage by the first program and retrieved directly from
    main storage by the second program; no physical tape file is necessary. We may
    picture this scheme as shown on p. 170.


    Taking thes Analysis problem as our illustration, we have the two programs P1
    and P2. P1 writes the word file which is read by P2.'
