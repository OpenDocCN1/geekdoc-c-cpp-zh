  md: '# APIC Studies in Data Processing No. 11


    # DEFINITION

    OF PROGRAMMING LANGUAGES

    BY INTERPRETING AUTOMATA


    Alexander Ollongren

    Central Computing Institute

    Leiden University, The Netherlands

    1975, xii + 290pp.

    0.125.275.350


    This book treats programming languages in a rigorous fashion, using the operational
    method of formally defining a language by its abstract interpreting automaton.
    Syntax is also treated by the traditional method. These methods are a culmination
    and refinement of the approaches pioneered by McCarthy and Landon, and by the
    IBM Research Laboratory for the definition of PL/I. The book concludes by showing
    practical applications of the methods to questions of implementation design and
    correctness, and to parallel programming.

    The book adopts a gentle tutorial style throughout. It starts with a survey of
    the elementary mathematical background, and introduces further theoretical topics
    as required. These are immediately illustrated by practical examples and exercises
    of independent interest, including the definition of a simple but not unrealistic
    programming language. Each chapter concludes with a guide to further reading in
    the literature.


    The intention of the book is to provide much needed theoretical tools for those
    engaged in the design and implementation of new programming languages, as well
    as those engaged in the standardisation of languages, and those concerned with
    machine-independent programming. This study can also be generally recommended
    to teachers and students of computer science, and to those engaged in research
    in the relation of programming theory to practice. It sets high standards for
    the rigorous specification of software products, which can and should become more
    widely observed in programming methodology and software engineering.


    # Contents


    +   Objectives. Basic notions. Formal languages. Pasing. Data structures. Classes
    of data structures. Language transformations. Interpreting automata I. Interpreting
    automata II. Co-operating sequential processes. References. Index.


