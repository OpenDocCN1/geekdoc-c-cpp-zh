  md: "# Ch. 12] OPTIMIZATION 253\n\n02 TABLE-BODY.\n03 ENTRY OCCURS 500.\n04 EKEY\
    \ PIC X(4).\n04 EVAL PIC X(8).\n\nThere are 500 locations available for holding\
    \ entries, but at any moment only the locations ENTRY (1), ENTRY (2), ... ENTRY\
    \ (MAX) are occupied. The value of MAX is always non-negative, but may be zero.\n\
    \nIt is required to design a problem component which will sort this table; that\
    \ is, arrange it so that the values of EKEY (S) are in ascending order for increasing\
    \ S. The sorting method to be used is the bubble sort. A number of passes are\
    \ made over the table. In each pass, which may be from left to right (that is,\
    \ increasing the subscript) or from right to left, successive pairs of adjacent\
    \ entries are examined, wrongly ordered pairs being swapped. Thus, for example,\
    \ if the values of EKEY are\n\n6 1 4 5 3 2 7 0 8\n\nthen after a left-to-right\
    \ pass they will be\n\n1 4 5 3 2 6 0 7 8\n\nNote that after the first left-to-right\
    \ pass the highest entry must arrive in the rightmost position, and after that\
    \ the first right-to-left pass the lowest entry must arrive in the leftmost position.\
    \ It follows that the table can be completely sorted in MAX-1 passes at most.\n\
    \nThe simplest possible algorithm to solve this problem is one in which we make\
    \ MAX-1 left-to-right passes over the complete table. The program would be:\n\n\
    ```\nP1 seq\nNP:=0;\nPB iter until NP >= MAX-1\nS:=1; T:=2;\nPASS iter until S\
    \ >= MAX\nPPAIR select EKEY (S) > EKEY (T)\n  swap;\nPPAIR end\n  S:=S+1; T:=T+1;\n\
    PASS end\nNP:=NP+1;\n```"
