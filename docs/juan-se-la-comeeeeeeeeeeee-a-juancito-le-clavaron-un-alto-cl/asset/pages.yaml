    # 4.4


    The standard form of the collating program may also be distorted by conflating
    parts of the selection: instead of keeping the same program component to process
    two or more cases.


    Consider Version 2 of Problem 6, in which the payments file must be collated with
    the customer master file. Eliminating the fourth matching case, we have the program
    structure shown opposite.


    This is the standard form of the program, and allows us to handle any specification.
    For example, we may specify that unmatched payment groups are to be treated in
    the same way as matched groups, or that they are to be deleted from the edited
    files and a diagnostic message written, or that a special header record for each
    unmatched group is to be written to the edited file or that a diagnostic message
    is to be written for each individual unmatched payment record, or a dummy customer
    record is to be created, or anything else we please. None of these specifications
    will cause difficulty. Because the program structure distinguishes between matched
    and unmatched groups we have complete freedom to define distinct processing.


    However, if we specify identical, or nearly identical, processing for matched
    and unmatched groups, we are tempted to use the same program component for both.
    The justification is, of course, reduction of the length of the program text:
    in a word, optimization.


