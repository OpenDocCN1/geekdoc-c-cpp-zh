  md: '292                               PRINCIPLES OF PROGRAM DESIGN


    # A8. Condition Names


    To simplify the writing of condition tests in the procedure division, conditions
    may be named and described in the data division. For example, we may have an item


    05 CODE PIC XX.


    which can take any of the values "T2", "4R", "GG" and "9L", corresponding to four
    transaction types "debit", "credit", "refund" and "cancel" respectively. We may
    define each transaction type as a condition name associated with a value of CODE:


    05 CODE PIC XX.


    +   88 DEBIT VALUE "T2"

    88 CREDIT VALUE "4R"

    88 REFUND VALUE "GG"

    88 CANCEL VALUE "9L"


    The special level indicator 88 is used to define condition names in this way.
    Having defined the condition names, we may use them in the obvious way:


    ```

    IF DEBIT MOVE CANCEL ADD R TO S

    ELSE IF REFUND MOVE T TO U

    ELSE ADD V TO W.

    Note: DEBIT MOVE P TO Q

    ```


    This statement is in all respects equivalent to


    ```

    IF CODE = "T2" MOVE P TO Q

    ELSE IF CODE = "9L" ADD R TO S

    ELSE IF CODE = "GG" MOVE T TO U

    ELSE ADD V TO W.

    ```


    The usefulness of condition names is greatly reduced by the fact that they cannot
    be used to set the conditions, only to test them.


    # A9. Procedure Division


    The procedure division contains all of the executable coding. It exhibits, more
    than any other part of COBOL, the frustrated hopes of the language'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# APPENDIX


    designers that a program could be written and understood in much the same way
    as natural language English text. The basic components of the procedure division
    are statements; statements may be grouped into sentences, sentences into paragraphs
    and paragraphs into sections. Only sentences are equipped with an end marker:
    a sentence terminates with a full stop, as in English. Statements, paragraphs
    and sections are terminated only by the beginning of the next component at the
    same or a higher level of grouping, or by the physical end of the program text.


    The simplest statements are the imperative, unconditional statements as:


    ```

    MOVE X TO Y

    DIVIDE P INTO Q GIVING R

    OPEN INFILE

    WRITE TOTAL-RECORD

    DISPLAY PRINT-LINE

    ```


    In general, such statements are self-explanatory; the more obscure imperative
    statements have been avoided in the examples. The DISPLAY statement is particularly
    useful in illustrative programs, because it permits output to be written to the
    line printer without a formal file definition and without execution of OPEN and
    CLOSE operations.


    More complex are the conditional statements. We have used only two: the IF statement
    and the READ statement. The READ statement has the form


    ```

    READ INFILE AT END imperative-statements

    ```


    while the IF statement has the form


    ```

    IF condition-1 statements-1 ELSE statements-2.

    ```


    Serious anomalies arise from the fact that there is no end marker for a statement,
    statements-1 and statements-2 in an IF statement may themselves be conditional
    statements, and that the ELSE clause may be omitted. A null statement is provided
    (“NEXT SENTENCE”) so that the ELSE clause can always be written where it is required
    for correct pairing of IF and ELSE clauses, as in:


    ```

    IF X = Y

    IF P = Q

    MOVE A TO B

    ELSE NEXT SENTENCE

    ELSE ADD R TO S.

    ```'
  merge: -1
  pgno: 308
- img_proc: true
  md: '# 294 PRINCIPLES OF PROGRAM DESIGN


    However, the NEXT SENTENCE statement is not merely a null statement: it does actually
    transfer control to the next sentence. It is therefore not permissible to write


    ```

    IF X = Y

    IF P = Q

    MOVE A TO B

    ELSE NEXT SENTENCE

    IF T = U

    MOVE C TO D.

    ```


    # A10. Logic Flow


    Apart from the use of conditional statements, there are two ways of modifying
    the normal sequential flow of control. The PERFORM statement allows paragraphs
    or sections to be invoked as local subroutines (without parameterization); the
    GO TO statement allows arbitrary transfers of control. Section and paragraph groupings
    serve to define local subroutines for the PERFORM statement; section and paragraph
    names serve also as branch points for the GO TO statement. This ambience in the
    meaning of sections and paragraphs causes many difficulties when PERFORM and GO
    TO statements are used in an undisciplined manner.


    A paragraph is defined by writing a paragraph name, starting in Area A, immediately
    before the first statement of the paragraph. Thus, in the text


    +   PARA-1.

    ADD A TO B.

    MOVE C TO D.

    PARA-2.

    ADD E TO F.


    the paragraph PARA-1 consists of the statements ADD A TO B and MOVE C TO D.


    A section is a sequence of paragraphs, prefaced by a section header, as in


    +   P1 SECTION.

    P1-1.

    ADD A TO B.

    MOVE C TO D.

    P1-2.'
