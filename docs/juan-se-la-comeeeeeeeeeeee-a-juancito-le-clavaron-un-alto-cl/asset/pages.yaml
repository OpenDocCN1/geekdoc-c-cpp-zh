  md: '# Ch. 8] PROGRAM INVERSION 171


    when either program is waiting, the supervisor passes or returns control to the
    other (which cannot be waiting, since the buffer must be either full or empty);


    when either program completes execution, it returns control to the supervisor
    finally.


    A realistic multi-programming system is more elaborate than this, but not different
    in principle.


    P1 and P2 are synchronized by the buffer. At no point can P2 read more words than
    P1 has written; nor can P1 have written more than one word than P2 has read. The
    second of these constraints can be relaxed by introducing additional buffers:
    if we have n buffers we allow P1 to write n words more than P2 has read. But the
    total number of records written by P1 must be the same as the total number read
    by P2: otherwise one of the programs will complete execution leaving the other
    waiting for an event which will never happen.


    # 8.2 Program Inversion


