  md: '# Ch. 12] OPTIMIZATION 271


    We could use this component directly in the existing program, writing


    MOVE 1 TO U. PERFORM PROCZUG.


    in place of PROZIG, and similarly for PROZAG. However, by generaliz- ing we have
    removed the necessity of treating PZIGZAG as a sequence: we could treat it as
    an iteration instead:


    PZIGZAG. PERFORM PROCZUG VARING U FROM 1 BY 1 UNTIL U > 2.


    Further, we could merge together the two iterations PSBODY and PZIGZAG: instead
    of having an iteration of two within an iteration of 50, we could have a single
    iteration of 100 occurrences within:


    ```

    PNSET seq

    Z:=1;

    U:=1;

    PSBODY iter until Z > 100

    PROCZUG seq

    SI:=Z;

    TI:=1;

    PZUGUBODY iter until SI < 1

    PZUGNUM seq

    display N(U)/N(3-U);

    SI:=SI-1;

    TI:=TI+1;

    PZUGNUM end

    PZUGUBODY end

    PROCZUG end

    Z:=Z+1;

    U:=3-U;

    PSBODY end

    stop;

    PNSET end

    ```


    Note that the meaning of Z has changed: Z now counts the zugs whereas previously
    it was counting the zigzags; happily, the new value of Z gives the exact value
    of Z to SI at the beginning of each zug. Note too that the statement “U:=3-U;”
    causes the value of U to alternate between 1 and 2.


    Further optimization of this program is suggested in an exercise at the end of
    this chapter.'
