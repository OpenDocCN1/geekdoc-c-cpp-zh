- img_proc: true
  md: 'We may change the program by changing only the entries in the batch

    and record tables. But there are tight constraints on the changes we

    may make in this way: the file must be a sequence of batches, and each batch

    must be a sequence of records. By changing only the tables we could not

    arrange to process a file whose batches were iterations of records, or which

    contained selections: for that we would need to change both the tables and

    the form of the tables and the program P.


    Essentially, what has happened is this. The program P plays the role of a

    special-purpose computer: this computer is programmed in a special language,

    amely the language in which we define the batch table and record tables.

    When we allow the file structure to contain selections or iterations, we find

    that the special-purpose computer, and its programming language, are no

    longer adequate. We have built a computer whose programs consist only of

    sequences, interpretive schemes, whose parts in turn must also be sequences.


    Interpretive schemes, in which a fixed program (P in the example above)

    interprets data (the batch and record tables) describing the required process-

    s, can save large amounts of main storage space. But their effective design

    is governed by our second rule for optimization: we must always start from

    the unoptimized form, from a consideration of the programs which we will

    want to write in the interpreted data.'
