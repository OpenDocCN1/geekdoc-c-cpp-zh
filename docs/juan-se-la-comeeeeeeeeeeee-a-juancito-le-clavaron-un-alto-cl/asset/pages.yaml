    ![](img/2af52882003b66fe0217f904c606a0f9_129_0.png)


    Some of these questions cannot be answered simply; they touch on points which
    form the substance of this chapter. But we can do something to tidy up the technique
    of multiple reading ahead.


    Suppose, to be definite, that we want to read ahead three records. That is, at
    any point in the program we want to be able to examine the next record, the next
    plus 1 and the next plus 2. We declare three record areas:


    +   - 01 RA1.

    - 01 RA2.

    - 01 RA3.


    At any point in the program RA1 will contain the next record; RA2 will contain
    the next plus 1; RA3 will contain the next plus 2. Because we think of end-of-file
    flag as an extension to the record, we will need an end-of-file flag for each
    record area:


    +   - 01 RA1.

    - 02 EF1 PIC X.

    - 02 DATA1 PIC(n).

    - 01 RA2.

    - 02 EF2 PIC X.

    - 02 DATA2 PIC(n).

    - 01 RA3.

    - 02 EF3 PIC X.

    - 02 DATA3 PIC(n).


    The general form of a single read operation must be:


    ```

    RA1 := RA2; (next + 1 record to next-area)

    RA2 :=RA3; (next + 2 record to next + 1-area)

    read file into RA3; (new record to next + 2-area).

    ```


    Taking account of the possibility that end of file has already been reached, we
    construct the paragraph:


    ```

    SREAD. MOVE RA2 TO RA1.

    MOVE RA3 TO RA2.

    ```'
