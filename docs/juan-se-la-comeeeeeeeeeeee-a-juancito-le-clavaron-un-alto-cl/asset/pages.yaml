  md: '# Ch. 8] PROGRAM INVERSION 187


    This distinction is important, and is not destroyed by placing the state vector
    in the parameter list, thus creating a “re-entrant” or “pure procedure” component.
    The contents of the state vector are private to the component: they are truly
    “own variables” in the sense that no other component should be able to inspect
    or change them, or to take any cognizance of their formats and values.


    Any system must contain such variable-state components. It matters greatly how
    we construct them, because they are potentially the most difficult to design.
    A traditional method of designing is to define a number of switches, each switch
    indicating some aspect of the component’s state. For example, for Program 15 (Generating
    Test Data) we might begin by defining these switches:


    +   SW: on if the component has not been previously invoked, otherwise off (the
    traditional “first-time switch”);


    +   SW: on if the component is engaged in processing an X group, off if it is
    processing a Y group;


    +   SW3: on if X has been invoked at least once, otherwise off;


    +   SW4: on if Y has been invoked at least once, otherwise off.


    It is not clear that this is the right set of switches, even for this very simple
    problem: more or fewer or a different altogether may be required. In a realistically
    larger problem, dozens of switches may be needed. However, even in the simple
    problem, we have an immediate difficulty. There are 4 binary switches. Together
    they define 16 possible states of the component. So it appears that we ought to
    construct a program containing 16 labels, each a possible starting point for some
    invocation of the component. But we can see at once that if switch 1 is off switches
    3 and 4 must also be off. (Check that calculation!) So are not more than 10 possible
    states. And no other similar arguments can be made. The arguments, and the calculations,
    are very prone to error. In any case, they are usually made explicitly. What usually
    happens is that the programmer informally and intuitively decides to treat certain
    states as possible and distinct, as possible argued in groups of equivalent states,
    and others again as impossible. To do this correctly, especially by informal intuitive
    methods, is very hard. Resulting bugs may include, in a typical data processing
    program:


    parts of the program can never be executed, whatever the inputs; states thought
    to be possible are in fact impossible;'
