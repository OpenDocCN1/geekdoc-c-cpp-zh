    # 2.3 Sequences


    A sequence has two or more parts, occurring once each, in order. Here are some
    examples of sequences of sequences in COBOL and PL/I data and procedure coding.


    ```

    PA. ADD X TO Y.

    CALL "Q" USING Y, W, Z.

    PERFORM PB.

    ```


    The paragraph PA is a sequence of three parts: the ADD operation, sub-program
    Q and paragraph (or section) PB. Each time PA is executed, each of these is executed
    once, in the order given.


