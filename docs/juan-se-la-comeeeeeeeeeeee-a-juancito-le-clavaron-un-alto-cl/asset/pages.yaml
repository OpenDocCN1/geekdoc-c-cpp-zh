    PROBLEM 10—DELIMITED STRINGS


    A program component is to be designed which will analyse a character string, recognizing
    and printing two substrings, S1 and S2. S1 is terminated by a character ''@"'',
    and S2 by a character ''\&''; the complete string is terminated by a character
    ''%%''.


    On entry to the component two items of input data are available: the complete
    string, and a pointer or subscript which points to a current location in the string.
    S1 is defined to be the substring whose first character is the character pointed
    at and whose last character is the terminating ''@"''; S2 has as first character
    the character following the terminating ''@"'' of S1, and its last character is
    the terminating ''\&''; Either or both strings may be empty of non-terminating
    characters.


    It is known that the complete string is terminated (ie a ''%%'' occurs) within
    100 characters of the current location on entry: this fact can, and should be
    relied upon. However, it is not known that correct substrings S1 and S2 may be
    present. If both are present and correct, a report should be printed in the form


    ```

    GOOD STRING

    S1=xxxxxxxxxx@

    S2=yyyyyy&

    ```


    otherwise the string should be printed from the current location up to the terminator,
    in the form


    ```

    BAD STRING

    CHAR-001=f

    CHAR-002=g

    ...

    CHAR-nnn=%%

    ```


