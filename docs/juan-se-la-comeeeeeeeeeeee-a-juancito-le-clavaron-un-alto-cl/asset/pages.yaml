  md: 'MOVE X TO Y.

    ADD P TO Q.

    MOVE R TO S.

    PERFORM P1.

    SUBTRACT T FROM U.


    Clearly, this arrangement is error-prone. It is usually considered good practice
    to place sections and paragraphs which are the objects of PERFORM statements at
    the end of the program text, and to avoid executing them by sequential flow of
    control.


    A difficulty arises in the internal design of sections which are the objects of
    PERFORM statements. There is no form of return statement corresponding to the
    PERFORM; execution of the PERFORMMed section terminates when its last paragraph
    terminates. A special null paragraph is therefore provided:


    para-name.

    EXIT.


    This may be written as the physically last paragraph of the section. Execution
    of the section may then be terminated by the statement


    GO TO para-name.'
