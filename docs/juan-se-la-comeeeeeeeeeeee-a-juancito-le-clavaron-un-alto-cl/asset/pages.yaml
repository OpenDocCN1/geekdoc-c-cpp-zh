  md: '# Ch. 1] INTRODUCTION 5


    The essence of the difficulty is this. We wanted to make simple and localized
    changes to the specification: to alter the choice of numbers to be printed within
    each line; to alter the order of printing the lines; to alter the choice and values
    of numbers to be printed in each line. We therefore looked to make similarly localized
    changes to the program: where is the component which determines the choice of
    numbers to be printed? where is the component which determines the order of the
    lines? where is the component which determines the values of the numbers? And
    the answers were not so simple as we hoped. PLINE appears superbly to be the component
    which processes each line. In fact, however, PLINE prints line N and generates
    line N+1 when it is executed for the Nth time. So PLINE is executed 9 times, and
    the first line is generated by PSTART and the 10th line is printed by PSTART.
    Furthermore, the printable values in each line persist in the next line, unless
    they are overwritten; PRINT-LINE is cleared only once, at the beginning of PSTART.
    So in considering what is to be printed in each line we have to bear in mind what
    was in the previous line.


    In short, the program structure does not match the problem structure. The program
    should instead have been as follows:


    ```

    ...\DATA DIVISION.

    WORKING-STORAGE SECTION.

    77 LINE-NO PIC 99.

    77 COL-NO PIC 99.

    01 PRINT-LINE.

    02 NUM OCCURS 10 PIC ZZZ9.

    PROCEDURE DIVISION.

    PTABLE.

    PERFORM PLINE VARYING LINE-NO

    FROM 1 BY 1 UNTIL LINE-NO > 10.

    STOP RUN.

    PLINE.

    MOVE SPACES TO PRINT-LINE.

    PERFORM PNUM HAVING COL-NO

    FROM 1 BY 1 UNTIL COL-NO > LINE-NO.

    PNUM.

    MULTIPLY LINE-NO BY COL-NO GIVING NUM (COL-NO).

    ```


    The paragraph PTABLE processes the whole table. The paragraph PLINE processes
    each line. The paragraph PNUM processes each number. The table'
