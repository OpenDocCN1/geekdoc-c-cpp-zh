  md: '# Ch. 2] STRUCTURES AND COMPONENTS 23


    zero occurrences of the iterated part is a legitimate instance of the iteration;
    if, therefore, a particular instance of A consists of zero occurrences of B, it
    would be wrong to say “A is not executed” or “the data component A is not present";


    the iteration always consists of the maximum possible number of occurrences of
    the iterated part; truth of an “until” condition is a necessary as well as a sufficient
    condition for termination; truth of a “while” condition is a sufficient as well
    as a necessary condition for a further occurrence.


    There is another possible form of iteration, in which the condition test is at
    the tail of the iteration, following each occurrence of the iterated part. This
    form of iteration is used in FORTRAN, and is sometimes referred to as “REPEAT
    UNTIL”, contrasted with “DO WHILE” which is the form we use. There are some situations
    in which the “REPEAT UNTIL” form is more convenient, but we will avoid it altogether.
    The additional complexity in design which would be created by having alternative
    forms of iteration is too high a price to pay for the small improvement in convenience.
    More importantly, the “REPEAT UNTIL” is significantly harder to use correctly;
    because the first occurrence of the iterated part is not preceded, in this form,
    by execution of the condition test, we are obliged to consider two distinct contexts
    for the iterated part; the context for the first occurrence is determined by the
    condition test. This difficulty in the context on entry to the iteration component,
    while the context for each subsequent occurrence is determined by the condition
    test is not trivial; it can be a source of gratuitous error.


    Sometimes, where it is particularly important to emphasize that an iteration must
    contain at least one occurrence of the iterated part, we will be forced to show
    the first occurrence separately. For example, if A consists of one or more B’s,
    we may be forced to represent A in the form:


    ![](img/2af52882003b66fe0217f904c606a0f9_38_0.png)


    We will usually find in such cases that there is some special characteristic of
    the first occurrence which makes it proper to depict it separately in this way.'
