    The PERFORM PTELGRAM SECTION sets a return link address in the exit paragraph
    PTGX. This return link must be preserved across each complete execution of PTELGRAM,
    to ensure that control can return correctly to the condition test in the PERFORMS
    statement. But the COBOL language specification does not guarantee that the return
    link will survive execution of the GOBACK. It would be foolish to rely on the
    fact that the link survives in the code generated by this or by that particular
    compiler: the compiler does not define the language.


    In principle, the limitation to be observed is this. We are assuming that certain
    language constructs do, or may, give rise to an increase in the stacking level
    in the run-time environment: in COBOL there are few such constructs, but PERFORM
    and CALL are among them. We are assuming also that the operating environment for
    the language is incapable of maintaining multiple stacks. We must therefore code
    an inverted program in such manner that the stacking level is always zero when
    an "inverted input-output statement" is executed. If the local variables for the
    inverted program are held in a stack, as would be in PL/I or ALGOL, we must either
    push them up, or else "freeze" them, by declaring them as STATIC in PL/I or as
    variables in ALGOL. The limitation of course does not apply to procedure code
    or variables which are never active when an inverted input-output statement is
    executed.


    In practice, in COBOL, we will find it more convenient to adhere to the PERFORM-free
    style of coding throughout an inverted program. Similar conventions can be devised
    for other languages. Ideally, the compiler would tackle the whole problem for
    us; while we are waiting for such a COBOL compiler we forced to carry out a part
    of its task by hand.


