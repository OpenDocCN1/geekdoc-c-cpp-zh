  md: '# Chapter 8 – Arrays


    The data types introduced up to this point in the course only have the capacity
    to store a single value. Repetition in the previous chapter opened the possibility
    to accepting and processing a large data set. How does that work with our existing
    data types?


    Problem: A recent exam was taken by ten students and we''d like to calculate maximum,
    minimum, and average. We know from a previous example that we can calculate maximum,
    minimum, and average without needing to store all of the scores in variables at
    the same time, but to calculate the median and mode we do need to keep all values
    and sort those values to assist in making these calculations.


    One possibility may include declaring variables for each value to be entered.


    ```

    int score0;

    int score1;

    int score2;

    int score3;

    int score4;

    int score5;

    int score6;

    int score7;

    int score8;

    int score9;

    ```


    The task of input and output for ten individual variables will require either
    ten print and scan statements, one print and scan statement with ten placeholders,
    or calling a function ten times or with ten parameters. The amount of code should
    not depend on data set size!


    Perhaps it is possible to manage this small number of variables, but what if I
    had 100 students? Or even 1,000 students?


    +   - What is needed is a more practical way to store and access a collection
    of related data items.


    An array is a consecutive series of variables that share one name and data type.
    Each variable, or element, of an array has a number known as an index value that
    represents its position in the array. When we reference the name of the array
    along with a given index value we are referring to a specific individual value
    stored in that array.'
