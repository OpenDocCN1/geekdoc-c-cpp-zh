  md: '# Arrays and Pointers


    You might have already been able to make this observation, but arrays and pointers
    are related. The name of an array, much like that of a pointer, represents a memory
    address with the index representing the offset from that address. Unlike a pointer,
    the address to which an array refers cannot change.


    +   * Key Point: Pointer variables are variable in that they can change the memory
    address to which they point. Arrays will always point to the same memory and are
    constants in that respect.


