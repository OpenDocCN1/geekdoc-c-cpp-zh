- pgno: 32
  md: '# Structure Charts


    +   - Large programs are complex structures consisting of many interrelated parts
    and must be carefully designed.

    +   - The structure chart shows how we are going to break out the larger problem
    into logical sub problems and how data will flow in between these modules.


    # Flowcharts


    +   - The purpose of a flowchart is to describe visually the logic of an individual
    function (smaller task of the larger problem).

    +   - A flowchart should be developed for each sub problem identified on a structure
    chart.


    Each step invested in planning will assist you in eliminating logical errors that
    are often very time consuming to resolve later.


    Problem: Given a loan amount, annual interest rate, and the term of the loan in
    years, determine the monthly payment.


    # Step #1 – What is specified of the program?


    +   - Input – Three values. Loan amount, annual interest rate, and term. Output
    – Monthly payment.


    # Step #2 – Analyze the problem


    +   - What type of mathematical operations do we need?


    | Variable | Description | Expression |

    |---|---|---|

    | years | Term of the loan in years. | Input by user |

    | numMonths | Number of months for the loan. | years * 12 |

    | annualRate | Annual interest rate of the loan (as a percentage). | Input by
    user |

    | monthRate | Monthly interest rate (decimal). | (annualRate / 12) / 100 |

    | loanAmount | Total amount to borrow. | Input by user |

    | P | | pow((1 + monthRate), numMonths) |

    | Q | | (P / (P - 1)) |

    | monthPayment | Monthly payment. | loanAmount * monthRate * Q |'
  merge: -1
