  md: '# CS 159 – C Programming (Applications for Engineers) Fall 2023 Syllabus


    # Course Staff


    | Instructor: | Instructor Office Location: | Instructor Office Hours: |

    |---|---|---|

    | | Building: HAAS Room: Southeast corner of Third Street and University Street
    | |


    Please visit during instructor office hours for any administrative concerns regarding
    the course.


    +   * If you have a concern then it is expected that you make the effort to visit
    office hours of your instructor.


    # TA Office Hours


    # Course Motivation and Objectives


    CS 159 introduces the tools of software development that have become essential
    for innovative and creative problem solving in science and engineering. Educators
    and employers agree that it is important for future technical professionals to
    be able to function as part of a technical team and develop the ability to efficiently
    communicate complex concepts. CS 159 will require students to work in assigned
    teams for lab assignments. Educational research informs us that structured collaboration
    leads to increased learning gains for all students participating in an introductory
    programming course.


    Collaboration is a requirement of the course. You will be assigned to your teams
    by your instructor.


    CS 159 explores the concepts of programming using a language and development environment
    that are new to most students. The primary objective of the course is to help
    students recognize how programming concepts are common to various languages to
    which you are exposed in your undergraduate education and how those concepts can
    be used to solve a problem.


    # Course Prerequisites and Preparation


    CS 159 is an introductory programming course without official prerequisite but
    does assume mathematical and physical science knowledge typical of a first-year
    engineering student.


    The University expects students to invest 6-9 hours per week in preparation, in
    addition to time spent in class, for a three credit hour course. Previous students
    in CS 159 have reported that their keys to success included; attending lecture,
    active participation in lab, preparation and regular review of course materials,
    and planning to start and complete all assignments well in advance of the due
    date.


    # Course Required Materials


    +   * Computer Science, A Structured Programming Approach Using C, Forouzan and
    Gilberg, THIRD EDITION, ISBN: 0-534-49132-4

    +     * An e-book alternative is available (Cengage Unlimited): https://www.cengage.com/shop/isbn/9781337907651

    +   * Programming Applications for Engineers Course Packet (Fall 2023 edition)

    +     * Physical copy available only in local bookstores. See Brightspace for
    a link to purchase an electronic version.

    +   * Vocareum License, instructions will be provided on Brightspace to complete
    purchase.


    # Learning Resources


    +   * All relevant class information, updates, and announcements will be available
    on the Brightspace site https://purdue.brightspace.com/.'
