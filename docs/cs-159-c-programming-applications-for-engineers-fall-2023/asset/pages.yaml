- pgno: 152
  md: 'Where do the pointer variables, as previously declared, x, y, and z initially
    point?


    +   Answer: We do not know! We have seen how this can be bad with data variables
    already this semester; however, with pointers the unknown value may be an invalid
    memory address, then if the pointer is referenced before it is ever initialized
    the result will be a segmentation fault.


    When passing by address the pointers are initialized as a result of the addresses
    that were sent from the calling function:


    ```

    exchangeValues(&x, &y);


    printf("After the function: x = %d y = %d\n", x, y);


    return(0);

    }

    void exchangeValues(int *a, int *b)

    {

    ```


    # Initialization of Locally Declared Pointers


    In order for a pointer to be initialized we must provide a meaningful place in
    memory for it to point (reference). Another variable is one valid place to which
    a pointer can point. We need to assign (=) a memory address to the pointer.


    ```

    int a = -123;

    int *p;


    printf("Address of a: %p\n", &a);

    printf("Address of p: %p\n", &p);


    p = &a;


    printf("Location to which p references: %p\n", p);

    ```


    | Variable | Data | Address |

    |---|---|---|

    | int a = -123; | -123 | 0x7fffcb0fc1c |

    | int *p; | Unknown | 0x7fffcb0fc10 |


    p = &a;


    | Variable | Data | Address |

    |---|---|---|

    | a | -123 | 0x7fffcb0fc1c |

    | *p | 0x7fffcb0fc1c | 0x7fffcb0fc10 |'
