- pgno: 57
  md: '# Why use functions?


    # Top-Down Design


    The identification of smaller tasks within the larger problem is known as **factoring**
    and results in small manageable sub-parts of a program to be designed and individually
    developed then implemented. This process of factoring tasks into more manageable
    parts is known as **top-down design**.


    # When does the factoring stop?


    This factoring should continue until the task “consists only of elementary processes
    that are intrinsically understood and cannot be further subdivided.” (page 150,
    C Programming text)


    +   - In simple terms, a function should consist of a **single task**. Be careful
    not to divide tasks such that the resulting functions are trivial. For example,
    the act of input of a value includes the `printf`, `scanf`, and validation of
    the input. To divide this task of input further would result in functions that
    are trivial.


    +   - More good examples of “single task” functions can be found in the `math.h`
    library. These functions accept as input one or more values and generate a single
    value as a result. No additional tasks such as input, output, or further calculations
    are included alongside the task of these functions. The “single task” philosophy
    does improve the likelihood that the function can be reused in the future.


    # When is a new function necessary?


    +   - A function that accomplishes only a single task is known to be **functionally
    cohesive**. Our goal is to develop such functions and to avoid placing multiple
    unrelated tasks inside of the same function.


    +   - The logic behind the task that a function accomplishes in a program should
    **appear only once** in the program. The motivation for this idea is that we desire
    to **eliminate redundant code**, that is logic which appears in more than one
    place in a program.


    +   - The task that the function is completing should be **testable** by itself
    separate of the rest of the program.'
  merge: -1
  img_proc: true
- pgno: 58
  md: "# Basic Function Terminology\n\nBehind ALL WELL-WRITTEN programs is the same\
    \ fundamental component, the function. The function will be the implementation\
    \ and contain the solution of the single sub-task previously described. What is\
    \ a function? According to the Gilberg and Forouzan text, \"A named block of code\
    \ that performs a process within a program; an executable unit of code, consisting\
    \ of a header, function name, and a body, that is designed to perform a task within\
    \ the program.\"\n\n+   - When the services of a function are requested it must\
    \ be called. The function making the call is known as the calling function and\
    \ the function being called is the called function.\n+   - It is common that data\
    \ needs to be exchanged between the calling and called functions.\n+     - The\
    \ act of sending (passing) data to a function is known as parameter passing.\n\
    +     - It is possible that the function may complete a calculation and wish to\
    \ share the result with the calling function. We refer to this as returning a\
    \ value from a function.\n+   - In the C programming language, a function is only\
    \ capable of returning at most one value.\n\n```\n#include<stdio.h>\nvoid greeting(void);\
    \ //FX DECLARATION\nint main(void)\n{\n //LOCAL DECLARATIONS - NONE\n //EXECUTABLE\
    \ STATEMENTS\n greeting(); //FX CALL\n return (0);\n}\n\n//FUNCTION DEFINITION\n\
    void greeting(void)\n{\n //LOCAL DECLARATIONS - NONE\n //EXECUTABLE STATEMENTS\n\
    \ printf(\"Hello World!\\\\n\");\n return;\n}\n```\n\nIn the above example we\
    \ observe a main function that contains two statements, one statement is a call\
    \ to a function named greeting and the second statement is the terminal return\
    \ [return (0) ;] statement. When the function greeting is called by main control\
    \ of the program leaves main. The function greeting will execute its two statements\
    \ which will print Hello World! to the monitor and then return control of the\
    \ program to the calling function main. The main function will continue from where\
    \ it left off following the function call, in this case, main's next statement\
    \ will be the terminal return (0) statement.\n\n+   - The sequence of which instructions\
    \ are executed in the program now jumps from main to greeting when the function\
    \ is called.\n+   - It is \"remembered\" where in main the function call was made\
    \ so that when the called function (greeting) terminates the execution of statements\
    \ in main will continue with the statement following the function call."
