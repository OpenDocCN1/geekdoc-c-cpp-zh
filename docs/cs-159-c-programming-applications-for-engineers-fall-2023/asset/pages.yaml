  md: '# Two-Way Selection


    +   - Logical expressions evaluate to either a true or false value.

    +   - If the resulting logical value is true we have one path to travel, but if
    the result is false we will execute alternative (and unique) statements found
    down a second path.

    +   - Two selection constructs are available for two-way selection in C programming:
    if/else and the conditional expression.


    # if / else


    +   - The if/else construct, or a very similar variation, exists in about every
    programming language. The idea is that a logical expression is evaluated with
    one set of statements to be executed when the logical expression is true and an
    alternative set of statements to be executed when it is false.


    ```

    if(logical expression)

    {

    //TRUE ACTIONS TO EXECUTE

    }

    else

    {

    //FALSE ACTIONS TO EXECUTE

    }

    ```


    +   - If the first condition (logical expression) listed is evaluated to be true
    the statements found in the body of the if will be executed, otherwise execute
    the statements found in the body of the else.


    # Diagram of Two-way Logic:'
