- pgno: 102
  md: "# Loops in C\n\nThe C programming language provides three constructs for the\
    \ looping technique of repetition. These are; while, for, and do-while. We will\
    \ begin with the similar while and do-while constructs.\n\n# The while Loop\n\n\
    The while construct is a pretest loop. As with all loops the while makes use of\
    \ a loop control expression to determine whether the loop should begin or continue\
    \ to iterate. Being a pretest loop the loop control expression is evaluated prior\
    \ to the first iteration of the loop, then while the expression is evaluated to\
    \ be true then the loop will complete another iteration.\n\n+   The iterations\
    \ will continue WHILE the loop control expression is true. When the control expression\
    \ evaluates to false the iterative process stops.\n\n# Basic Syntax of the While\
    \ Loop\n\n```\nwhile(loop control expression)\n{\n    //EXECUTABLE STATEMENT DESIGNATED\n\
    \    //FOR REPETITION – BODY OF THE LOOP\n}\n```\n\n> Note: There is no semicolon\
    \ after the loop control expression of the while statement, because the loop is\
    \ followed a body which contains the actions to repeat.\n\n# The do-while Loop\n\
    \nThe do-while construct is a post-test loop. Similar to the while a loop control\
    \ expression is used to determine if repetition continues, but as is the case\
    \ of a post-test construct the expression is evaluated after the initial execution\
    \ of the instructions inside of the body.\n\n+   In contrast to the while loop,\
    \ the keyword while in a do-while is terminated with a semicolon.\n\n| Course\
    \ Standard: Indent all statements that compose the body of a loop two additional\
    \ spaces. | Course Standard: With all loops (and if statements) the braces that\
    \ mark the start and end of the loop body MUST be used. |\n|---|---|\n\n# Basic\
    \ Syntax of the Do While Loop\n\n```\ndo\n{\n    //EXECUTABLE STATEMENT DESIGNATED\n\
    \    //FOR REPETITION – BODY OF THE LOOP\n}while(loop control expression) ;\n\
    ```"
  merge: -1
  img_proc: true
