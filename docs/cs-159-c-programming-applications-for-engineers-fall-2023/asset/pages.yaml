    int main(void)\n{\n int a = 10;\n int b = 7;\n int *x;\n int *y;\n x = &b;\n y\
    \ = &a;\n *x = -a % 5;\n *y -= b;\n printf(\"a = %d b = %d\\n\", a, b);\n x =\
    \ y;\n b /= *x;\n y = &b;\n printf(\"*x = %d *y = %d\\n\", *x, *y);\n return(0);\n\
    }\n```\n\n+   45. Which of the following is the output generated by the FIRST\
    \ print statement in the program above?\n+   A) a = 6 b = 4\n+   B) a = 5 b =\
    \ 4\n+   C) a = 5 b = 5\n+   D) None of the above.\n\n+   46. Which of the following\
    \ is the output generated by the SECOND print statement in the program above?\n\
    +   A) *x = 0 *y = 0\n+   B) *x = 5 *y = 5\n+   C) *x = 5 *y = 0\n+   D) None\
    \ of the above.\n\n+   47. Which of the following statements regarding sorting\
    \ algorithms is TRUE?\n+   A) The order of the data in the array cannot remain\
    \ the same after a single pass of the selection sorting algorithm.\n+   B) Values\
    \ once placed in the sorted sub-list of the insertion sort are subject to be moved\
    \ again as the algorithm progresses.\n+   C) The bubble sorting algorithm is optimized\
    \ to stop the sorting process when the array is detected as being in a sorted\
    \ state.\n+   D) None of the above."
