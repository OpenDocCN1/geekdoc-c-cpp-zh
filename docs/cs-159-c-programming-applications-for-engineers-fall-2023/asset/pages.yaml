  md: '# Symbolic Constant Examples:


    | Preprocessor Directive | Good or Bad Usage? Why? |

    | :--- | :--- |

    | `#define NUMSTUDENTS 100` | Good, clearly represents the number of students
    in the course. |

    | `#define ONE 1` | Bad, vague! If the value 1 has several purposes in your program
    then create a constant for each! |

    | `#define NUMBEROFEXAMS 4;` | Bad. Semi-colons are not typically used. A constant
    will substitute *all* values that follow the name. |

    | `#define MaxPtsOnExam 100` | Bad, always use all upper-case letters in a symbolic
    constant name. |


    Course Standard: Attempt to minimize your use of literal constants and maximize
    your use of symbolic constants.


    # Comparing Symbolic/Defined Constants with Variables:


    # Misapplication of Symbolic/Defined Constants


    | What is in your code: | What is really being compiled on line #10: |

    | :--- | :--- |

    | 3 `#define APPROX_PI = 3.1415;`

    4

    5 `int main(void)`

    6 `{`

    7 `float radius = 4.25;`

    8 `float circumference;`

    9

    10 `circumference = 2 * APPROX_PI * radius;` | `circumference = 2 * = 3.1415;
    * radius;`

    • The substitution of all that follows the symbol APPROX_PI generates an error
    on line #10.

    • When observing an error on a line that contains a symbolic/defined constant
    remember that the source of the error may be in the definition at the top of your
