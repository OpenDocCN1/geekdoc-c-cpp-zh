  md: '# User-Defined Functions


    As with variables, functions must be both declared and defined.


    | The function declaration will appear in the global declaration section of the
    program.


    The function declaration statement will tell the compiler:

    (1) The type of value being returned from the function.

    (2) The name of the function.

    (3) The data being sent to the function. The number of parameters, type of parameters,
    and order of parameters is determined by the declaration of the function.


    The function definition contains the code needed to complete the task. | What
    is the compiler looking for?

    • All three components of a user-defined function, (declaration, definition, and
    call) are in agreement.


    What is the error generated when the definition cannot be found?

    undefined reference


    What is the error generated when the declaration cannot be found?

    warning: implicit declaration of function |


    # Basic Function Designs


    | | Yes Parameters | No Parameters |

    |---|---|---|

    | 1. A function with no parameters that returns no value.

    2. A function with no parameters that returns a value.

    3. A function with parameters that returns a value.

    4. A function with parameters that returns no value.


    What is "void" about a void function?

    • Such a function does NOT return a value. | Yes Value Returned | |

    | | No Value Returned | |


    # What does it mean to describe a function by a data type?


    +   • Describing a function by a data type is a reference to the type of value
    that it returns.'
