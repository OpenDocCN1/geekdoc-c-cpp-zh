  md: "# Pointer Arithmetic and Arrays (Single Dimension Arrays only)\n\n+   What\
    \ takes place when you attempt to add an integer to an address? The result is\
    \ another address and this type of arithmetic can be used to access and change\
    \ elements of an array.\n\n```\n#define SIZE 5\n\nvoid printArray(int*);\nvoid\
    \ changeArray(int*);\n\nint main(void)\n{\n   int x[SIZE] = {3, 5, 7, 9, 10};\n\
    \n   changeArray(x);\n   printArray(x);\n\n   return(0);\n}\n```\n\n```\nvoid\
    \ changeArray(int *y)\n{\n   int i;\n   int temp;\n\n   temp = *y;\n\n   for(i\
    \ = 1; i < SIZE; i++)\n   {\n      *(y + i - 1) = *(y + i);\n   }\n\n   *(y +\
    \ i - 1) = temp;\n}\n```\n\n```\nvoid printArray(int *y)\n{\n   int i;\n\n   for(i\
    \ = 0; i < SIZE; i++)\n   {\n      printf(\"y[%d] = %d\\n\", i, *(y + i));\n \
    \  }\n}\n```\n\nOutput Generated:\ny[0] = 5\ny[1] = 7\ny[2] = 9\ny[3] = 10\ny[4]\
    \ = 3\n\n```\nint a[5] = {2, 4, 5, 3, 1};\n\n| 2 | 4 | 5 | 3 | 1 |\n|---|---|---|---|---|\n\
    \ a[0]  a[1]  a[2]  a[3]  a[4]\n *(a+0) *(a+1) *(a+2) *(a+3) *(a+4)\n```\n\nThe\
    \ application of the indirection operator (*) to the sum of the starting memory\
    \ address and an integer produces the element at the index of the integer.\n\n\
    a[x] == *(a + x)"
