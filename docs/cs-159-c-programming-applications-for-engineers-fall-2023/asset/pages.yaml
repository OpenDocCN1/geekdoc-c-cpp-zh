  md: '+   What happens if the update of the loop control variable occurs in the middle
    of body of the loop, will this change cause the loop to terminate immediately
    at this point?

    +   * No. The loop will only terminate when the loop control expression is evaluated
    and found to be false.

    +   * There is no "mid-test" loop in the C programming language, only pretest
    and post-test.


    # Factorial Example


    +   * The factorial problem will permit a demonstration of both the do-while with
    input validation and the while to calculate the factorial.


    ```

    int calcFactorial(int);

    int getInput(void);

    void displayResults(int, int);

    ```


    ```

    int main(void)

    {

    int num;

    int fact;


    num = getInput();

    fact = calcFactorial(num);

    displayResults(num, fact);


    return(0);

    }

    ```


    ```

    int calcFactorial(int num)

    {

    int nFact = 1;


    while(num > 0)

    {

    nFact = nFact * num;

    num --;

    }


    return(nFact);

    }

    ```


    # Is there reason to be concerned that the value of zero may be multiplied?


    +   * No, the loop control expression is evaluated and false prior to the multiplication
    of zero.


    The value entered by the user is stored locally in the variable num, how does
    changing num on each iteration influence what is going on back in the calling
    function?


    +   * No, the variable has been passed by value.'
