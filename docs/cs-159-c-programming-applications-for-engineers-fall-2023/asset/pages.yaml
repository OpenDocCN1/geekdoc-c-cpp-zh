  md: '# Insertion Sort


    +   - **Description of algorithm:** Compare the value in the unsorted list that
    is adjacent to the sorted list and determine where among the values in the sorted
    list it is to be inserted.


    The insertion sort is concerned with maintaining its sorted list in a sorted state.
    It is possible that a value once placed in the sorted list may move again on a
    future pass.'
