- pgno: 55
  md: '# Selection via Calculation


    Wait, this is not the chapter on selection, is it? Where are the if/else if/else
    constructs? How can we simulate selection with a calculation? The fundamental
    idea here is that we can create an expression that can be activated or not based
    on the value of a factor which is multiplied by the expression to determine whether
    it remains a part of the final calculation. The factor is often a result of comparing
    two values to determine which of the two is larger. Given that this chapter has
    placed an emphasis on data types it is indeed that idea which plays a major part
    in the calculation of such a factor.


    # Example: Given two integers display the larger of the two.


    ```

    ```

    1 #include<stdio.h>

    2

    3 int main(void)

    4 {

    5   int x;

    6   int y;

    7   int max;

    8

    9   printf("Enter two integers: ");

    10  scanf("%d %d", &x, &y);

    11

    12  max = x / y * x + y / x * y;

    13

    14  printf("Max value input is: %d\n", max);

    15

    16  return(0);

    17 }

    ```

    ```


    # Example Executions:


    Enter two integers: 5 8

    Max value input is: 8


    Enter two integers: 9 6

    Max value input is: 9


    Enter two integers: 10 3

    Max value input is: 30


    +   - See the problem when one of the numbers is two or more times greater than
    the other?

    +   - How do we fix this? How can we make sure that the quotients calculated are
    always 0 or 1?


    # Revision to eliminate multiplying the larger value by a factor greater than
    one:


    ```

    ```

    factor1 = x / y;

    factor2 = y / x;


    factor1 = (factor1 + 2) % (factor1 + 1);

    factor2 = (factor2 + 2) % (factor2 + 1);


    max = factor1 * x + factor2 * y;

    ```

    ```


    +   - Two integers factor1 and factor2 are introduced to store the values comparing
    x and y.

    +   - We know the value that is zero represents the smaller of the two values
    and the value greater than zero is the larger.

    +   - The modulus operator is used here to scale all non-zero values to 1 while
    not changing the factor storing zero because 2 % 1 is zero.


    # Example Executions of Revised Program:


    Enter two integers: 10 3

    Max value input is: 10


    Enter two integers: 8 8

    Max value input is: 16


    +   - We still have a problem when both integer values are the same!'
