    \ complex problem easier to solve and test. | |\n\n# The Infinite Loop\n\nThe\
    \ infinite loop is a logical error in which the condition of the loop control\
    \ expression will never be false. As a logical error the form in which infinite\
    \ loops may appear while the program is running can vary. One sure sign of an\
    \ infinite loop is the production of infinite output. However, the error can appear\
    \ in forms in which little or no output is generated.\n\n+   * You can terminate\
