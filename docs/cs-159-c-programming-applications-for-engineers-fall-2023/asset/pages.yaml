- pgno: 159
  md: '# Chapter 11 – Strings: Character Arrays


    +   • A string is a series of characters with the capability to be treated as
    a single unit.


    The C programming language does not have a string data type but attempts to provide
    some capacity to work with string data through the use of character arrays.


    Similar to numeric arrays we can declare a string to be of any predetermined size.
    A problem common to character arrays involves the number of elements necessary
    for the string data can vary during the execution of the program. For example,
    a given character array may have a capacity of 20 elements and initially stores
    ‘Computer’ with that data being replaced later with “Science”. How do we, and
    the functions that we use with string data, know where the data ends and the unused
    portion of the array begins?


    We are able to identify where the data in a character array ends through the use
    of a character known as a delimiter. This delimiter character ‘\0’ represents
    the end of the data within a character array. This will be important to many functions
    that operate with strings.


    Strings in the C programming language are variable-length and delimited strings.


    +   • What is variable-length? The amount of data found in the array at a given
    time.


    +   • What does it mean to be delimited? A character is inserted into the array
    to separate the data from the unused portion of the array.


    # Declaring Strings and Accessing String Elements


    +   • We are able to access each individual elements of a character array in a
    manner similar to that of numeric arrays.


    | Examining the elements of a character array: | Output: |

    |---|---|

    | `int lcv;`<br>`char str[11] = "Good Day";`<br>`for(lcv = 0; lcv < 11; lcv++)`<br>`{`<br>`    printf("str[%2d]
    = %c %5d\n", lcv, str[lcv], str[lcv]);`<br>`}`<br>`printf("\n");` | str[ 0] =
    G   71<br>str[ 1] = o  111<br>str[ 2] = o  111<br>str[ 3] = d  100<br>str[ 4]
    =    32<br>str[ 5] = D   68<br>str[ 6] = a   97<br>str[ 7] = y  121<br>str[ 8]
    =    0<br>str[ 9] =    0<br>str[10] =    0 |


    What is in the remaining **unused elements** (at index 9 and 10) of the character
    array?


    +   • Because we initialized the array above the remaining elements are filled
    with zeros.'
