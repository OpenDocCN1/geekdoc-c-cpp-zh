- pgno: 73
  md: '# How to Read a Structure Chart


    Structure charts are read top-down and then left-right. The book is inconsistent
    when it comes to what should be in the top-most box, we will recommend that this
    box be a representation of the main function. A structure chart shows only the
    order in which user-defined functions are called and that data exchanged, it will
    contain no code!


    The following is a summary of the basic structure chart rules:


    +   (1) Each rectangle in a structure chart represents a user-defined function.
    Standard C functions (`stdio.h`, `math.h`) are not included.

    +   (2) The name in the rectangle should communicate the purpose of the function.
    It is the name that will be used in the program.

    +   (3) The structure chart contains only the function flow, no other code is
    indicated.

    +   (4) Common functions, those functions called more than once in a program,
    are indicated by a slash in the lower right corner of the rectangle. If such a
    function contains other function calls then the complete structure need be shown
    only once.


    You may find it helpful in certain circumstances to list the values going into
    and out from a user-defined function. The symbols on the left can be used to designate
    such values going in and out of a function. Variables sent to a function should
    be listed to the left of the line and those coming out of a function on the right.


    # Structure Chart from calculator problem demonstrated in the notes:


    ![](img/50641bd70680c74d7c49fe705f0d8389_73_0.png)


    How does the design of the above structure chart represent the expectation regarding
    the role of the `main` function in a well-designed program?


    +   * In general, the structure charts are more horizontal (wide) than they are
    vertical (deep). This indicates that most, if not all, of the user-defined functions
    should be called from within the `main` function.

    +   * As mentioned previously, every user-defined function should be limited to
    completing a single task of the larger problem which your program is designed
    to solve.'
