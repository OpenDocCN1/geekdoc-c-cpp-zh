- pgno: 208
  md: "# Use the program below for problems #48 - #49\n\n```\n#include<stdio.h>\n\
    void changeArr(int*, int*);\n\nint main(void)\n{\n    int *x;\n    int y[6] =\
    \ {5, -1, 9, 10, 8};\n    x = &y[5];\n    changeArr(y, x);\n    printf(\"%d %d\\\
    n\", *x, y[3]);\n    return(0);\n}\n\nvoid changeArr(int *a, int *b)\n{\n    int\
    \ i;\n    int temp;\n    for(i = 0; i < 3; i++)\n    {\n        temp = *(b - i);\n\
    \        *(b - i) = a[i];\n        a[i] = temp;\n    }\n}\n```\n\n48. Which of\
    \ the following is the output generated by the program above?\nA) 0 5\nB) 10 0\n\
    C) 5 9\nD) None of the above.\n\n49. Which of the following are the final two\
    \ elements of array y in the main function after the changeArr function terminates?\n\
    A) 0 8\nB) -1 5\nC) 10 9\nD) None of the above.\n\n50. Which of the following\
    \ statements regarding the end of the semester is TRUE?\nA) Assignments entered\
    \ into the Brightspace gradebook more than 5 days ago cannot be appealed at this\
    \ time.\nB) Any changes to the minimum point cutoffs for each letter grade will\
    \ be announced on Brightspace by 5:00 PM on Tuesday, May 9.\nC) Grades are calculated\
    \ based ONLY on points earned; matters external to the course cannot be considered\
    \ when determining letter grades.\nD) All of the above!"
