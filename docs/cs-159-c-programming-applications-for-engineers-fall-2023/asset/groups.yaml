    # Selection via Calculation


    Wait, this is not the chapter on selection, is it? Where are the if/else if/else
    constructs? How can we simulate selection with a calculation? The fundamental
    idea here is that we can create an expression that can be activated or not based
    on the value of a factor which is multiplied by the expression to determine whether
    it remains a part of the final calculation. The factor is often a result of comparing
    two values to determine which of the two is larger. Given that this chapter has
    placed an emphasis on data types it is indeed that idea which plays a major part
    in the calculation of such a factor.


    # Example: Given two integers display the larger of the two.


    ```

    ```

    1 #include<stdio.h>

    2

    3 int main(void)

    4 {

    5   int x;

    6   int y;

    7   int max;

    8

    9   printf("Enter two integers: ");

    10  scanf("%d %d", &x, &y);

    11

    12  max = x / y * x + y / x * y;

    13

    14  printf("Max value input is: %d\n", max);

    15

    16  return(0);

    17 }

    ```

    ```


    # Example Executions:


    Enter two integers: 5 8

    Max value input is: 8


    Enter two integers: 9 6

    Max value input is: 9


    Enter two integers: 10 3

    Max value input is: 30


    +   - See the problem when one of the numbers is two or more times greater than
    the other?

    +   - How do we fix this? How can we make sure that the quotients calculated are
    always 0 or 1?


    # Revision to eliminate multiplying the larger value by a factor greater than
    one:


    ```

    ```

    factor1 = x / y;

    factor2 = y / x;


    factor1 = (factor1 + 2) % (factor1 + 1);

    factor2 = (factor2 + 2) % (factor2 + 1);


    max = factor1 * x + factor2 * y;

    ```

    ```


    +   - Two integers factor1 and factor2 are introduced to store the values comparing
    x and y.

    +   - We know the value that is zero represents the smaller of the two values
    and the value greater than zero is the larger.

    +   - The modulus operator is used here to scale all non-zero values to 1 while
    not changing the factor storing zero because 2 % 1 is zero.


    # Example Executions of Revised Program:


    Enter two integers: 10 3

    Max value input is: 10


    Enter two integers: 8 8

    Max value input is: 16


    +   - We still have a problem when both integer values are the same!'
  - '[PAGE 56]


    # Revision to eliminate the duplication of the output when the two values entered
    are the same:


    ```

    factor1 = x / y;

    factor2 = y / x;


    factor1 = (factor1 + 2) % (factor1 + 1);

    factor2 = (factor2 + 2) % (factor2 + 1);


    max = factor1 * x + factor2 * y;


    max = max / (factor1 + factor2);

    ```


    +   - Only when the sum of the factors is two are both values the same. In all
    other cases the sum of the factors will be one.

    +   - With that being the case we only need to divide the max by the sum of the
    factors to remove this unwanted doubling of the value.


    Example: Using what we now know about data types and expressions, given the total
    number of points earned during a semester calculate the letter grade earned.


    | | |

    |---|---|

    | Enter total points earned: 470

    Points Earned: 470 Grade Earned: A | Enter total points earned: 305

    Points Earned: 305 Grade Earned: D |

    | Enter total points earned: 415

    Points Earned: 415 Grade Earned: B | Enter total points earned: 304

    Points Earned: 304 Grade Earned: F |


    # Solution:


    ```

    #define A_MIN 470

    #define B_MIN 415

    #define C_MIN 360

    #define D_MIN 305


    int totalPoints; //TOTAL POINTS EARNED BY STUDENT

    char courseGrade; //GRADE EARNED BY STUDENT

    int gradePoints; //4 - A, 3 - B, 2 - C, 1 - D, 0 - F


    printf("Enter total points earned: ");

    scanf("%d", &totalPoints);


    gradePoints = totalPoints / A_MIN;

    gradePoints += totalPoints / B_MIN;

    gradePoints += totalPoints / C_MIN;

    gradePoints += totalPoints / D_MIN;


    courseGrade = ''F'' - gradePoints;

    courseGrade -= totalPoints / D_MIN; //TO ACCOUNT FOR ''E''

    printf("Points Earned: %d Grade Earned: %c\n", totalPoints, courseGrade);

    ```'
  - '[PAGE 57]


    # Why use functions?


    # Top-Down Design


    The identification of smaller tasks within the larger problem is known as **factoring**
    and results in small manageable sub-parts of a program to be designed and individually
    developed then implemented. This process of factoring tasks into more manageable
    parts is known as **top-down design**.


    # When does the factoring stop?


    This factoring should continue until the task “consists only of elementary processes
    that are intrinsically understood and cannot be further subdivided.” (page 150,
    C Programming text)


    +   - In simple terms, a function should consist of a **single task**. Be careful
    not to divide tasks such that the resulting functions are trivial. For example,
    the act of input of a value includes the `printf`, `scanf`, and validation of
    the input. To divide this task of input further would result in functions that
    are trivial.


    +   - More good examples of “single task” functions can be found in the `math.h`
    library. These functions accept as input one or more values and generate a single
    value as a result. No additional tasks such as input, output, or further calculations
    are included alongside the task of these functions. The “single task” philosophy
    does improve the likelihood that the function can be reused in the future.


    # When is a new function necessary?


    +   - A function that accomplishes only a single task is known to be **functionally
    cohesive**. Our goal is to develop such functions and to avoid placing multiple
    unrelated tasks inside of the same function.


    +   - The logic behind the task that a function accomplishes in a program should
    **appear only once** in the program. The motivation for this idea is that we desire
    to **eliminate redundant code**, that is logic which appears in more than one
    place in a program.


    +   - The task that the function is completing should be **testable** by itself
    separate of the rest of the program.'
