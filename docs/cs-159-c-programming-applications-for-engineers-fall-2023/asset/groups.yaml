  mdcn: "\n\n## 使用按地址传递技术修改前示例\n\n```\n#include<stdio.h>\n\nvoid exchangeValues(int*,\
    \ int*);\n\nint main(void)\n{\nint x = 3;\nint y = 5;\n\nprintf(\"Before the function:\
    \ x = %d y = %d\\n\", x, y);\n\nexchangeValues(&x, &y);\n\nprintf(\"After the\
    \ function: x = %d y = %d\\n\", x, y);\n\nreturn(0);\n}\n\nvoid exchangeValues(int\
    \ *a, int *b)\n{\nint temp;\n\nprintf(\"Before the exchange: a = %d b = %d\\n\"\
    , *a, *b);\n\ntemp = *a;\n*a = *b;\n*b = temp;\n\nprintf(\"After the exchange:\
    \ a = %d b = %d\\n\", *a, *b);\n}\n```\n\n- 注意：使用按地址传递的函数不一定是 void 类型，仍可通过 return\
    \ 关键字返回值。此类函数也不要求所有参数均按地址传递。\n\n## 描述 `exchangeValues` 函数中两个打印语句之间的三个赋值语句表达式：\n\
    \n- `temp = *a;` 将 `a` 所指向位置中的值赋给 `temp` 变量。\n- `*a = *b;` 检索 `b` 所指向位置中的值，并将其赋给\
    \ `a` 所指向的位置。\n- `*b = temp;` 将 `temp` 的值赋给 `b` 所指向的位置。\n\n## 何时使用按地址传递？\n\n当需要修改多个值，并且在被调用函数终止后，该修改仍需保留在调用函数中时。\n\
    \n## 并且\n\n该函数仍满足功能内聚的定义，即它只完成一项基本任务。\n\n## 作用域\n\n对象（可视为变量或函数）的作用域是指程序中定义该对象且可以通过其声明标识符引用它的区域。两个或多个对象可以拥有相同的标识符吗？答案是肯定的，前提是每个对象的**作用域**不重叠！在许多情况下，重叠作用域中重复使用标识符是编译器错误。在其他情况下，这是一种糟糕的设计选择。\n\
    \n本课程使用两种作用域级别：**全局**和**局部**。所有**函数**将**全局**声明，所有**变量**将局部声明。\n\n## 结构图\n\n**结构图**是程序的主要设计工具。在尝试开发任何流程图或编写任何代码之前，你应先完成程序的结构图。结构图将表示程序中存在的每个用户定义函数及其调用顺序。结构图完成后，你可以为每个函数创建流程图。\n\
    \n## 结构图规则与符号\n\n左侧的两个符号用于指示函数调用。第一个符号表示程序中仅调用一次的函数。函数名称将放在方框内。\n\n第二个符号在右下角包含一个“交叉网格”。所有带有此类交叉网格的函数表示它在程序中被调用多次。为了限制结构图中子函数的数量，你只需列出该特定函数调用的子函数（如果有）一次（即第一次使用时）。\n\
    \n## 如何读取结构图\n\n结构图自上而下、再从左到右阅读。书籍在顶部方框应包含什么内容上不一致，我们建议此方框表示 main 函数。结构图仅显示用户定义函数的调用顺序以及交换的数据，它不包含任何代码！\n\
    \n以下是基本结构图规则的摘要：\n\n- (1) 结构图中的每个矩形表示一个用户定义函数。标准 C 函数（`stdio.h`、`math.h`）不包括在内。\n\
    - (2) 矩形中的名称应传达函数的目的。它是程序中将使用的名称。\n- (3) 结构图仅包含函数流程，不指示其他代码。\n- (4) 常用函数（即程序中被调用多次的函数）通过矩形右下角的斜线表示。如果此类函数包含其他函数调用，则完整结构只需显示一次。\n\
    \n在某些情况下，列出进入和退出用户定义函数的值可能会有所帮助。左侧的符号可用于指定进入和退出函数的此类值。发送到函数的变量应列在线条左侧，而从函数出来的变量应列在右侧。\n\
    \n![](img/50641bd70680c74d7c49fe705f0d8389_73_0.png)\n\n## 上述结构图的设计如何体现对良好设计程序中\
    \ `main` 函数角色的预期？\n\n- 一般来说，结构图更倾向于水平（宽）而非垂直（深）。这表明大部分，如果不是全部，用户定义的函数都应从 `main`\
