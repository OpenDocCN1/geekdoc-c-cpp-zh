    \ C 语言教材第 323 页。\n- 使用永久循环将违反禁止使用控制强制语句的预期。\n- 递归仅可用于计数器控制的进程。\n\n## Control Forcing\
    \ Statements\n\n- **你会在教材中观察到控制强制语句的使用，但在本课程中禁止使用。** 存在更好的方法来指导程序的控制流，而无需使用以下任一语句：\n\
    \  - `exit`, `goto`, `break`（仅允许与 `switch` 结构一起使用）, `continue`\n  - **同一函数中存在多个\
    \ return 语句。** 函数，就像我们将在讲座中讨论的流程图一样，必须有一个共同的（且只有一个）起点和终点。使用多个 `return` 语句会使单个函数（算法）拥有多个终点。\n\
    \n## Standard Libraries and Functions\n\n- 你可以使用课堂上介绍的标准 C 库中的许多函数。**你有责任**就课堂上未讨论过的你想要使用的函数或库向课程工作人员咨询。\n\
    \n## User-Defined Functions\n\n在引入用户定义函数（第 4 章）后，程序的 `main` 函数中仅允许以下内容：\n\n1.\
    \ 声明需要在函数之间传递的变量。\n2. 由 `main` 调用的函数。\n3. 最少量的控制结构（循环、选择），以保持 `main` 作为程序的控制中心。\n\
    \n`main` 函数旨在成为程序的 _主函数_，大多数函数调用应源自 `main`。程序中定义的大部分数据应在 `main` 中完成。\n\n**根据函数的定义，每个函数只能有一个单独的（单一的）特定任务。**\
    \ 在相关作业中未能很好地利用用户定义函数将导致不给予部分分数。\n\n函数定义第一行中声明的所有（参数）变量必须具有显式数据类型。\n\n按地址传递单个值应满足以下条件：\n\
    \n1. 当需要修改多个值，并且该修改在被调用函数终止后保留在调用函数中时。\n2. 函数继续满足 **功能内聚** 的定义，即在正在解决的较大问题中仅完成单一基本任务。\n\
    \n## Declaration of Arrays\n\n在我们介绍 C 语言教材第 9 和 10 章中的 **动态内存分配** 主题之前，所有数组都将是静态的（固定长度）。如第\
    \ 478–479 页示例中所示的可变长度数组的应用将违反课程标准，因为它允许函数中的局部声明和可执行语句重叠。\n\n- 在数组声明中使用变量表示数组大小是不可接受的。\n\
    - 在所有作业中声明数组时必须使用符号/定义的常量。\n\n## Advanced Topics/Implementations\n\n- 在所有编程作业中，我们将指定开发解决方案时可以参考哪些章节。\n\
    - 我们通常将代码中的高级实现（讲座中尚未讲授或课程未涵盖的材料）视为可疑，因为此类工作超出了课程中大多数学生的能力范围，并且我们认为代码作者可能不是当前课程的学生。\n\
    \n## Efficient Design\n\n- 衡量所有作业质量的一个标准是实现高效设计。科学和工程领域创新工作的学生应预期并认识到，设计对包括软件在内的任何产品的评估至关重要。\n\
    - 我们要求你在作业中实现高效且逻辑正确的算法。在某些情况下，这可能决定作业的等级。要获得作业满分，我们期望逻辑正确且设计良好。\n\n## Some guidelines\
    \ related to the efficient use of the limited resources of the computer:\n\n-\
    \ 节省内存。\n  - 当一个数组足以完成任务时，不要使用多个数组（或维度）。\n  - 不要将数组声明为超出数据需求（由作业指定）的大小。\n  - 当不需要数组时，不要使用数组。\n\
    - 节省处理器的工作量。\n  - 对于可以用一个（或零个）循环完成的任务，不要编写嵌套循环。\n- 代码越短通常越好。识别代码中的模式。避免程序中重复相同或相似的逻辑。\n\
    \  - 如果发现自己在多个地方重复代码，请创建一个函数，使代码在程序中只出现一次，并在需要时调用。\n  - 另一种常见情况是已经编写了几个本质上做相同事情或包含大量相似代码的函数。在这种情况下，你应尽可能合并。\n\
    - 使用自顶向下设计。每个函数应有一个明确定义的任务，而不是一系列任务。\n- 高效设计的主题将在讲座中适当评论。\n\n## Syntax Errors\
    \ and Warnings\n\n- 任何带有源代码中 **语法错误** 的作业提交尝试都将被拒绝，且 **不考虑部分学分**。你有责任在提交前彻底测试你的工作。\n\
    - 编译器警告将导致扣分，应在提交最终工作之前予以纠正。\n\n## Course Tools and Technologies for Developing\
    \ Code\n\n1. 我们不鼓励你在 Vocareum 中找到的任何编辑器或编译器之外的任何编辑器或编译器中开发、编译或测试你的代码。并非所有 C 语言编译器都完全兼容。你应该希望在课程处理和测试你的代码的相同条件下测试你的工作。\n\
    2. 你有责任在学期第一周演示的方式，在 Vocareum 中彻底测试你的代码，然后再提交你的最终工作。\n3. 我们将不支持 Vocareum 上找到的编译器、编辑器和编程开发环境之外的任何内容。\n\
    \n建议你在作业截止日期前留出足够的时间，以便在提交作业时遇到困难时寻求帮助。不接受逾期作业。\n\n## LECTURE NOTES\n\n## Chapter\
    \ 1 – Introduction to Computers\n\n### Hardware Basics\n\n计算机的四个主要组件：\n1. 中央处理器\n\
    2. 主内存\n3. 输入/输出硬件\n4. 系统互连 - 连接上述所有内容\n\n作为程序员，计算机的以下两个硬件组件对我们很重要：\n1. 中央处理器或处理器。\n\
    2. 主内存存储。\n\n为什么是这两个特定组件？了解处理器的运行方式以及主内存在我们本学期将要编写的程序员所起的作用，将使我们能够更好地利用计算机的这些有限资源。\n\
    \n处理器（CPU）值得关注，因为所有指令和相关数据的处理都将在此处进行。CPU 可以描述为具有四个基本组件：\n1. 寄存器 - 处理器本地的少量内存，用于与当前正在执行的指令相关的临时存储。\n\
    2. 算术逻辑单元 - 负责指令所需计算的硬件。\n3. 控制单元 - 协调处理器的操作。\n4. 互连 - 连接上述所有内容。\n\n"
