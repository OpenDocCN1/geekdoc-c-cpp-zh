    ```\n\n- 关于注释的规则：\n  - 注释可以出现在程序的任何位置。\n  - 不要对你编写的每一行代码都加注释。\n  - 你提交的每个作业都必须包含作业标头。标头中写得好的描述将减少代码中对注释的需求。\n\
    \  - 你必须对程序中的每个变量都加注释。\n\n- 注意：多行注释不能嵌套。\n\n标识符允许我们为程序中的数据和其他对象命名。\n\n- 程序使用的数据可能由计算机存储在唯一的内存地址中，作为程序员，我们只需记住选择的标识符，而无需记住特定的内存地址，即可从计算机内存中存储和检索数据值。\n\
    \n| 良好标识符 | 不良标识符 |\n|---|---|\n| numStudents | x |\n| depth | DEPTH |\n| examAvg\
