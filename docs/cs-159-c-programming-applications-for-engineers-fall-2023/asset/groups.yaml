    本页面按优先级（从高到低）列出 C 运算符。它们的结合性指示在表达式中优先级相同的运算符的应用顺序。


    | 运算符 | 描述 | 结合性 |

    | :--- | :--- | :--- |

    | () [] ++ -- | 括号（函数调用），方括号（数组下标），后置递增/递减 | 从左到右 |

    | ++ -- + - ! ~ (type) * & sizeof | 前置递增/递减，一元正/负，逻辑非，强制类型转换（改变类型），解引用，地址，确定字节大小
    | 从右到左 |

    | * / % | 乘法/除法/取模 | 从左到右 |

    | + - | 加法/减法 | 从左到右 |

    | < <= > >= | 关系运算：小于/小于或等于，关系运算：大于/大于或等于 | 从左到右 |

    | == != | 关系运算：等于/不等于 | 从左到右 |

    | && | 逻辑与 | 从左到右 |

    | \|\| | 逻辑或 | 从左到右 |

    | ?: | 三元条件运算 | 从右到左 |

