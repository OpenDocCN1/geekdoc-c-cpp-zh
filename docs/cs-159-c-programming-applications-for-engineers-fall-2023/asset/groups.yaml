    \ **按值传递**。函数之间数据保护的概念以按值传递方法为基础。调用函数将接收到的值存储在新的内存位置中，可以自由地对其值的副本进行更改，而无需担心此类更改可能如何导致调用函数中出现逻辑错误。\n\
    \n## 如果相应的变量具有相同的名称和数据类型，之前程序的结果会改变吗？\n\n- 在调用函数和被调用函数中使用相同的数据类型并不决定数据是否按值传递。\n\
    \n## 在按值传递范式中，调用函数和被调用函数中的变量标识符起什么作用？\n\n- 在调用函数和被调用函数中使用相同的标识符并不决定值是否按值传递。\n\n\
    ## 按值传递（向下通信）与按地址传递（向上通信）\n\n此时你应该思考的几个问题是：\n\n- 1. 从函数中“返回”多个值是否可能？\n- 2. 是否有按值传递的替代方案？\n\
    \n两个问题的答案都是肯定的，并且涉及相同的想法。我们需要能够做的不是传递参数值的副本，而是在被调用函数中的变量与调用函数中的变量之间建立连接。为此，我们必须将变量的**内存地址**传递给函数，而不是传递该变量值的副本。通过将调用函数中变量的内存地址传递给被调用函数，我们现在可以更改该内存地址的内容，任何此类更改都是永久的，并且在被调用函数终止后仍可供调用函数使用。\n\
    \n要使用按地址传递，我们需要了解一些关于 **指针** 的知识。我们将在第 9 和 10 章详细介绍指针，但现在使用它们来实现按地址传递将对我们有益。\n\
    \n## 指针操作\n\n- 要传递单个变量的地址，我们在该变量名称之前使用地址（&）运算符。\n- **指针** 是一个变量，它**存储内存地址**作为其值。我们需要这样的变量来接收从调用函数发送到被调用函数的地址。\n\
    \n"
