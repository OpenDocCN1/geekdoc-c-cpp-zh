    \n- 因为 % 在 printf 的格式字符串中已经有特殊含义，所以需要两个才能在屏幕上显示一个。\n\n> 注意：取模运算符的两个操作数都必须是整型。\n\
    \n## 赋值表达式\n\n赋值表达式会对赋值运算符 (=) 右侧的操作数求值，并将该值保存在左侧变量的内存中。\n\n> 注意：赋值表达式的左操作数必须是单个变量。\n\
    \n### 简单赋值示例\n\n| | |\n|------|------|\n| `int x;`<br>`int y = 2;`<br><br>`x =\
