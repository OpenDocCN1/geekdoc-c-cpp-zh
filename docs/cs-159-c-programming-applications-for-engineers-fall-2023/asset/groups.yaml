    讲座测验（最多55分）

    从学期第二周开始，每次讲座都会进行讲座测验。测验可能在讲座开始、中间和/或结束时进行。必须坐在指定座位上，才能保留讲座测验获得的任何学分。


    参与讲座测验需要使用普渡大学凭据访问 Hotseat (openhotseat.org)。每次讲座请携带您选定的设备。如果您的设备故障或忘记携带设备，可在讲座后使用教师提供的表格提交书面测验。整个学期该方法仅可使用一次。仅接受提供的表格，且必须在当前讲座结束时提交。


