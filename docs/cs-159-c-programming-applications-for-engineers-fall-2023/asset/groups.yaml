    \ Basic Syntax of the While Loop\n\n```\nwhile(loop control expression)\n{\n \
    \   //EXECUTABLE STATEMENT DESIGNATED\n    //FOR REPETITION – BODY OF THE LOOP\n\
    }\n```\n\n> Note: There is no semicolon after the loop control expression of the\
    \ while statement, because the loop is followed a body which contains the actions\
    \ to repeat.\n\n# The do-while Loop\n\nThe do-while construct is a post-test loop.\
    \ Similar to the while a loop control expression is used to determine if repetition\
    \ continues, but as is the case of a post-test construct the expression is evaluated\
    \ after the initial execution of the instructions inside of the body.\n\n+   In\
