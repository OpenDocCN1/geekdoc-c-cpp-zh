    # Modification of previous example to use Pass-by-address Technique


    ```

    #include<stdio.h>


    void exchangeValues(int*, int*);


    int main(void)

    {

    int x = 3;

    int y = 5;


    printf("Before the function: x = %d y = %d\n", x, y);


