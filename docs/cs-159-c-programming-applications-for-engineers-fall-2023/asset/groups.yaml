    \n## CS 159 – 面向工程师的 C 语言编程（Applications for Engineers）2023 秋季学期 大纲\n\n## 课程教师\n\
    \n| 教师： | 教师办公室位置： | 教师办公时间： |\n|---|---|---|\n| | 大楼：HAAS 房间：第三街和大学街东南角 | |\n\
    \n如有关于课程的任何行政事宜，请在教师办公时间前往咨询。\n\n- 如果您有任何问题，预计您会主动前往教师的办公时间。\n\n## 助教办公时间\n\n\
    ## 课程动机与目标\n\nCS 159 介绍了软件开发的工具，这些工具已成为科学与工程领域创新和创造性问题解决的必备条件。教育工作者和雇主都认为，未来的技术专业人员能够作为技术团队的一员发挥作用，并具备高效传达复杂概念的能力非常重要。CS\
    \ 159 将要求学生在实验室作业中以指定团队形式合作。教育研究表明，结构化协作能提高所有参与入门编程课程的学生的学习成果。\n\n协作是本课程的要求。您将由教师分配到各个团队。\n\
    \nCS 159 使用大多数学生不熟悉的语言和开发环境来探索编程概念。本课程的主要目标是帮助学生认识到编程概念在本科教育中接触到的各种语言之间是共通的，以及这些概念如何用于解决问题。\n\
    \n## 课程先修条件与准备\n\nCS 159 是一门入门编程课程，没有正式的先修课程，但假设学生具备一年级工程专业学生典型的数学和自然科学知识。\n\n\
    大学期望学生每周投入 6-9 小时进行课外准备，此外还包括上课时间，针对三学分课程。之前的 CS 159 学生报告称，成功的关键包括：参加讲座、积极参与实验室、准备并定期复习课程材料，以及计划在截止日期前很早就开始并完成所有作业。\n\
    \n## 课程必备材料\n\n- Computer Science, A Structured Programming Approach Using C,\
    \ Forouzan and Gilberg, THIRD EDITION, ISBN: 0-534-49132-4\n  - 提供电子书替代方案（Cengage\
    \ Unlimited）：https://www.cengage.com/shop/isbn/9781337907651\n- Programming Applications\
    \ for Engineers Course Packet (2023 秋季学期版)\n  - 仅在当地书店有实体版。请参阅 Brightspace 获取购买电子版的链接。\n\
    - Vocareum License，相关购买说明将在 Brightspace 上提供。\n\n## 学习资源\n\n- 所有相关课程信息、更新和公告均可在\
    \ Brightspace 网站 https://purdue.brightspace.com/ 上查看。\n\n## 补充教学\n\n本课程提供补充教学（SI）学生研习班。这些学生小组对任何修读本课程并希望跟上课程进度、更好地理解课程内容的人开放。参加这些研习班是自愿的，但为了获得最大收益，您应定期参加。学习研习班的时间表可在网上查找：http://www.purdue.edu/si。\n\
    \n参加这些互动研习班的学生将发现自己正在与同伴合作，比较笔记、演示和讨论相关问题及重要概念，并分享学习和应试策略。\n\n- 学生需携带讲义笔记和教科书，并在研习班期间准备好与他人一起参与。\n\
    - SI 领导者是之前在本课程中表现非常出色的本科生，他们将向在校学生示范自己的成功策略。\n- 每次研习班都会讲授新内容，且不会有两次研习班重复相同内容。\n\
    \n## 重要日期\n\n| 期中考试 #1 | 期中考试 #2 | 期末考试 | 学术日历 |\n|---|---|---|---|\n| 日期：时间：地点：\
    \ | 日期：时间：地点： | 日期：时间：地点： | 最后退课日期：11 月 27 日（星期一） |\n\n- 期末考试可能定于 2023 年 12 月\
    \ 16 日（星期六）。除大学规定的原因外，不会考虑替代考试安排的请求。**请据此安排您的学期末行程。**\n\n## 评分\n\n| 作业 | 分数 |\n\
    |---|---|\n| 家庭作业 | 70 |\n| 实验任务 | 60 |\n| 实验测验 | 65 |\n| 期中考试 | 200 |\n| 期末考试\
    \ | 150 |\n| 讲座测验 | 55 |\n| 总分： | 600 |\n\n## 成绩\n\n| 成绩 | 所需分数 |\n|---|---|\n\
    | A | 510 |\n| B | 450 |\n| C | 390 |\n| D | 330 |\n\n教师保留降低每个等级最低分数要求的权利。如有任何更改，将在**期末考试后。**才公布。\n\
    \n- 在学期内任何时候，都不会推测是否会这样做，也不会推测任何给定分数线会降低多少。您不应期望所有分数线如果移动，都会移动相同的数量。\n- 对于那些非常接近但未达到某个公布最低分数的少数人，将考虑使用加号（+）和减号（-）对成绩进行调整。\n\
    \n## 出勤\n\n**您本学期应参加每次实验课。** 要有资格保留实验编程作业及相关实验测验获得的分数，您必须在实验课开始后 5 分钟内到达指定的实验室。您的实验课教师将提供登记出勤所需的步骤。实验课是协作式编程作业，期望您的实验伙伴或助教将迟到或缺席的学生纳入团队工作是不公平的。**迟到或缺席超过两次实验课的学生将不及格本课程。**\n\
    \n**您本学期应参加每次讲座。** 讲座厅将分配座位并进行考勤，以确保只有正式注册并亲自出席每个班级的学生才有资格获得讲座测验参与的分数。\n\n## 紧急缺勤与补做作业\n\
    \n只有有文档证明的严重困难才会被视为缺勤作业的补做理由。如果您有您认为属于此类困难的文档证明，则必须在**您能够恢复参加课程的办公时间内**及时联系教师。任何预先知道将缺勤的学生必须在缺勤前一周提出考虑请求。\n\
    \n- 关于缺勤报告的大学政策可从学生院长办公室获取：https://www.purdue.edu/advocacy/students/absences.html\n\
    - 出于**疾病原因**的补做请求**必须附有医疗专业人员的证明文件**，注明您接受其治疗的日期以及获准返回学校/工作的日期。\n\n## 作业\n\n###\
    \ 考试（两次晚间期中考试，每次 100 分，一次期末考试 150 分）\n\n考试将是对您知识的**个人评估**。考试将包含涵盖编程概念、最佳编程实践、先前的编程作业以及代码解释的选择题。\n\
    \n课程讲义包中提供了旧考试以供您准备。请阅读本节的封面页，了解旧考试如何成为您全面准备过程的有用部分。\n\n| 家庭作业（共 7 次，每次 10 分）家庭作业是**个人**完成的，旨在让您有机会在不借助其他学生帮助的情况下独立解决编程问题。大多数作业将在截止日期前\
    \ 10-12 天在 Brightspace 上发布。请查阅课程政策，了解本文档后文中关于**学术诚信**的相关规定。 | 家庭作业 | 截止时间为晚上 11\
    \ 点 |\n|---|---|---|\n| | 1 | 9 月 4 日 |\n| | 2 | 9 月 18 日 |\n| | 3 | 10 月 2 日\
    \ |\n| | 4 | 10 月 16 日 |\n| | 5 | 10 月 30 日 |\n| | 6 | 11 月 13 日 |\n| | 7 | 12\
    \ 月 1 日 |\n\n### 实验任务（共 12 次，每次 5 分）：\n\n实验作业需在您指定的实验小组内**协作**完成，每次实验编程作业将在下一次实验课召开前\
    \ 30 分钟截止（详见本文档后文中的日程安排）。\n\n- 协作小组应沟通谁将提交作业、何时提交作业，以及如何与所有参与小组成员确认进度。\n- 为小组每位成员设定期望，将提高提交完整作业的可能性。\n\
    - 未能参与并为所有小组成员满意地做出贡献的实验伙伴，将不获得实验作业学分。\n- 实验小组将在学期中第 4 次和第 8 次实验课后重新分配。入学和参与变化可能需要额外调整。\n\
    \n### 实验测验（共 13 次，每次 5 分）\n\n每次实验课结束时，将对与讲座中介绍的主题以及最近讲座和作业中实现的内容相关的知识进行**个人**评估。课程标准和良好编程实践的知识将在整个学期中得到评估。\n\
    \n- 备考测验的最佳方式是观看讲座录像，并在解决实验的过程中积极与团队合作，包括参与书面问题和编程问题解决方案的开发。\n- 实验测验只能在您的正式实验地点完成。测验期间不允许使用任何资源。\n\
    \n"
