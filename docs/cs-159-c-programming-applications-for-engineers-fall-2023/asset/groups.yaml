    n\", a, *x, *y, b); | 输出： |\n| --- | --- |\n\n### 数组与指针\n\n你可能已经能够做出这一观察，但数组和指针是相关的。数组的名称，很像指针的名称，代表一个内存地址，而索引表示从该地址的偏移量。与指针不同，数组所引用的地址不能更改。\n\
