    Based on the results of the previous program we are left to conclude that it is
    only a copy of the value of the variable that is passed from calling function
    to the called function. This particular paradigm of passing data to a function
    is commonly called **passing by value**. The concept of data protection between
    functions finds its basis in the pass by value approach. The calling function
    stores the value received in a new memory location and is free to make changes
    to its copy of the value without worry about how such changes may result in a
    logical error back in the calling function.


    # Is the outcome of the previous program changed if the corresponding variables
    had the same name AND data type?


    +   • Using the same data type in calling and called function is not that which
    determines whether the data is passed by value.


    # What roles do the identifiers of the variables in the calling and called function
    play in the pass by value paradigm?


    +   • Using the same identifier in calling and called function is not that which
    determines whether a value is passed by value or not.


    # Pass by Value (downward communication) versus Pass by Address (upward communication)


    A few questions that you should be pondering at this point are:


    +   1. Is it ever possible to "return" more than one value from a function?


    +   2. Are there are alternatives to pass by value?


    The answer to both questions is YES and involves the same idea. What we need to
    be able to do is not pass a copy of the value of a parameter, but rather to make
    a connection between a variable in the called function to a variable back in the
    calling function. To do this, we must **pass the memory address of the variable**
    to a function rather than passing a copy of that variable''s value. By passing
    the memory address of a variable in the calling function to the called function
    we can now make changes to the contents of that memory address and making any
    such changes is permanent and remains available to the calling function after
    the called function terminates.


    To use pass by address we need to know a little bit about **pointers**. We will
    cover pointers in detail in chapters 9 and 10, but using them to accomplish pass
    by address will benefit us now.


    # Pointer Operations


    +   • To pass the address of a single variable we use the address (&) operator
    before the name of that variable.


    +   • A **pointer** is a variable that **stores the memory address** of another
    variable as its value. We need such a variable to receive the address being sent
    from the calling function to the called function.'
