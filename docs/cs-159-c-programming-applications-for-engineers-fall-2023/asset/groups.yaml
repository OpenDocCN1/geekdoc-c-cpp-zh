    \ condition when another call is to be made is the **recursive case**. When no\
    \ more calls are to be made then the **base case** has been reached.\n\nRemember,\
    \ control of a program always returns from the called function to the calling\
    \ function. In addition to the control of the program a value may be returned\
    \ as well.\n\nThe **factorial** is one of the most common first examples given\
    \ to demonstrate the use of recursion.\n\nConsider how a factorial for a number\
    \ n is calculated: n * (n - 1) * (n - 2) * ... * 2 * 1\n\nYou could also say that\
    \ n! is equivalent to n * (n - 1)! for n > 1, but what about when n = 1? It is\
    \ at this point where we find our base case or a definition that when n = 1 then\
    \ n! = 1.\n\nLet's take 4! as an example:\n\n```\n4! = 4 * 3!\n3! = 3 * 2!\n2!\
    \ = 2 * 1!\n1! = 1\n```\n\n### Solving the factorial with the while loop:\n\n\
    ```cpp\nint factorial(int n)\n{\n   int nFact = 1;\n   while (n > 0)\n   {\n \
    \     nFact *= n--;\n   }\n   return(nFact);\n}\n```\n\n### Solving the factorial\
    \ using a recursive function:\n\n```cpp\nint factorial(int n)\n{\n   int nFact\
    \ = 1;\n   if(n > 1)\n   {\n      nFact = n * factorial(n - 1);\n   }\n   return(nFact);\n\
