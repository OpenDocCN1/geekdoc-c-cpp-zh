  mdcn: "\n\n## 使用循环访问数组元素的示例：\n\n```\n#define NUMLABS 10\n\nint main(void)\n{\n int\
    \ i;\n float labScores[NUMLABS];\n\n for(i = 0; i < NUMLABS; i++)\n {\n   printf(\"\
    Enter lab #%d score -> \", i + 1);\n   scanf(\"%f\", &labScores[i]);\n }\n\n //PROCESS\
    \ DATA\n for(i = 0; i < NUMLABS; i++)\n {\n   printf(\"Lab #%d score: %.2f\\n\"\
    , i + 1, labScores[i]);\n }\n\n return(0);\n}\n```\n\n## 索引范围检查\n\n大小为 NUMLABS\
    \ 的数组的有效索引值范围是 0 到 NUMLABS 减 1。如果在程序执行期间尝试访问此范围之外的索引，会发生什么情况？\n\n例如，如果我们尝试访问 labScores[10]，而对于声明大小为\
    \ 10 的数组，唯一有效的索引值是 0 - 9，会怎样？这里描述的场景意味着这个潜在问题是一个运行时错误。编译器不会，也无法，检测索引范围检查问题。\n\n\
    由于这是一个运行时错误，它可能有多种不同形式。尝试访问数组边界之外的索引可能会产生哪些后果？\n\n| 可能的观察结果 | 可能发生此情况的原因 |\n|\
    \ :--- | :--- |\n| 没有问题，程序按预期工作。 | 超出数组限制并进入未为数组目的保留的内存，可能未为任何其他目的保留。 |\n| 程序执行，但结果不符合预期。\
    \ | 超出数组限制并进入未为数组目的保留的内存，可能为任何其他目的保留，并且对同一内存的多次编辑可能会留下存储了意外值。 |\n| 程序崩溃。 | 超出数组限制并尝试访问不存在或程序无权访问的内存。\
    \ |\n\n## 超出数组定义限制的示例\n\n```\nint x[5] = {8, 4, 5, 2, 3};\n```\n\n| | 8 | 4 |\
    \ 5 | 2 | 3 |\n|---|---|---|---|---|---|\n| 0 | 1 | 2 | 3 | 4 | |\n\n| | 8 | 4\
    \ | 5 | 2 | 3 |\n|---|---|---|---|---|---|\n| 0 | 1 | 2 | 3 | 4 | |\n\n| | 8 |\
    \ 4 | 5 | 2 | 3 |\n|---|---|---|---|---|---|\n| 0 | 1 | 2 | 3 | 4 | |\n\n## 数组与函数（函数间通信）\n\
    \n- 如果数组仅限于声明它们的函数内使用，那么它们对我们来说用途有限。与用户定义的函数共享数组数据有两种方法，我们可以**发送一个元素**，或者**多个元素**，或者**整个数组**。\n\
    \n### 在每种方法中，我们必须了解以下内容：\n\n- 函数声明、函数调用和函数定义在语法上如何变化。\n- 传递的值是**按值传递**还是**按地址传递**，以及是否可以使用非默认方法。\n\
    \n### 传递单个元素\n\n您可以像传递任何其他变量一样将单个元素传递给函数，只要数组元素类型与函数参数类型匹配，就可以成功地将其传递给函数。\n\n\
    ```\n#define SIZE 5\n\nint calcFactorial(int);\n\nint main(void)\n{\n int num\
    \ = 8;\n int data[SIZE] = {2, 4, 6, 3, 5};\n\n printf(\"Result: %d\\n\", calcFactorial(num));\n\
    \n printf(\"Result: %d\\n\", calcFactorial(data[2]));\n\n return(0);\n}\n\nint\
    \ calcFactorial(int x)\n{\n int xFact = 1;\n\n while(x > 1)\n {\n xFact *= x--;\n\
    \ }\n\n return(xFact);\n}\n```\n\n### 示例：给定一个已初始化的整数数组，打印数组中每个整数的平方。\n\n```\n\
    #define ARRAYSIZE 5\nvoid print_square(int);\nint main(void)\n{\n   int lcv;\n\
    \   int base[ARRAYSIZE] = {3, 7, 2, 4, 5};\n   for(lcv = 0; lcv < ARRAYSIZE; lcv++)\n\
    \   {\n      print_square(base[lcv]);\n   }\n   printf(\"\\n\");\n   return(0);\n\
    }\nvoid print_square(int x)\n{\n   printf(\"%d squared = %d\\n\", x, x * x);\n\
    }\n```\n\n- 从前面的程序中观察到：\n  - 将数组的单个元素传递给函数时，必须指定数组名称，后跟在 [ ] 大括号中传递的值的特定索引。\n\n\
    ### 按值传递回顾\n\n- 回顾一下，如果我们将单个变量传递给函数，传递的只是变量值的副本，因此对该副本的更改不会改变调用函数中的变量。\n- 数组的单个元素如何传递给函数？接下来的第一个示例演示了第\
    \ 4 章中展示的按值传递技术。第二个示例试图演示数组的单个元素是按值传递还是按地址传递。\n  - 如果在最后的打印语句中 x[1] 应为 24，那么我们将得出该元素是按值传递的结论。\n\
