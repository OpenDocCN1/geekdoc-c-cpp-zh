    \ 7: grade = 'C';<br>break;<br>case 6: grade = 'D';<br>break;<br>default: grade\
    \ = 'F';<br>} |\n\n## 提醒：\n\n- 很容易下意识地总是对所有选择需求都使用 if/else。\n- 考虑在某些情况下，使用 switch\
    \ 或条件表达式可能是更好的选择。结果可能是更简洁、更易读的逻辑。\n\n## 第 6 章 – 重复\n\n计算机的真正威力在于能够快速重复执行一个操作或一系列操作。这种重复行为通常称为循环，但该术语并未涵盖所有重复技术。\n\
    \n## 循环基础和术语\n\n- 如果此图表示循环的逻辑，那么你可能会想知道这个过程何时、如何或是否会停止？\n\n![](img/50641bd70680c74d7c49fe705f0d8389_96_0.png)\n\
    \n## 首先，几个术语：\n\n- loop - 循环，是两种重复技术之一，利用构造在预定义条件下重复执行指定语句。\n- loop iteration\
    \ - 循环迭代，即循环构造体内指令的一次执行。\n- loop control expression - 循环控制表达式，用于确定循环是否应发起另一次迭代的逻辑表达式。\n\
    - loop initialization - 循环初始化，即在第一次求值循环控制表达式之前需要完成的准备工作。\n- loop update - 循环更新，是在循环体内找到的可执行语句，当执行足够多次后，会导致循环控制表达式求值发生变化。\n\
    - loop control variable - 循环控制变量，即被初始化、作为循环控制表达式的一部分，并接收更新操作的变量。\n\n## 重复流程图示例\
    \ #1：\n\n编写一个算法来计算未知数量考试分数的平均值、最大值和最小值。测试分数范围可以是 0 – 100，且全部为整数值。\n\n### 重复\n\n\
    - 要完成此问题，我们需要能够重复执行若干条指令。\n- 重复允许我们识别一段代码，在给定的逻辑表达式为真时重复执行。\n\n### 步骤 #1 – 程序需要完成什么？\n\
    \n- 输入 – 0 到 100 之间的整数（包含端点），直到输入一个值表示输入结束。\n  - 我们不需要数组（第 8 章的主题）将整个数据集存储在计算机内存中。解决此问题所需的内存不会取决于数据集的大小（参加考试的学生人数）。\n\
    - 输出 – 平均值（浮点数）、最大值（整数）和最小值（整数）。\n\n### 步骤 #2 – 分析问题\n\n- **需要哪些公式？** 要计算平均值，我们需要知道所有分数的总和和分数的数量。我们需要在输入时比较值，以确定它们是最大值还是最小值。\n\
    - 我们还需要确定用户将如何指示输入已结束。\n\n**如何处理输入终止条件？**\n\n1. 要求用户统计考试数量。\n2. 要求用户在输入每个值后，说明是否还有更多分数要输入。\n\
    3. 要求用户在完成时输入一个超出考试分数范围的值。\n\n### 解决方案的结构图：\n\n### 步骤 #3 – 软件解决方案\n\n## 前测和后测循环结构\n\
    \n在**前测**循环中，循环控制表达式在循环迭代一次之前必须为真。在每次迭代开始之前（包括第一次），都会求值循环控制表达式，只要该表达式保持为真，重复就会继续。如果循环控制表达式为假，则不会再进行进一步的迭代。\n\
    \n**关键点：** 前测循环体被迭代的最小次数是 **零**。如果表达式从不为真，则循环指令（循环体）**永远不会被执行**。\n\n在**后测**循环中，循环体的指令会在求值循环控制表达式之前执行。循环控制表达式会在每次迭代结束时求值，以确定是否继续进行另一次迭代。\n\
    \n- **最大区别是什么？** 后测循环体被迭代的最小次数是一次。无论表达式是否为假，循环都会迭代一次，然后测试条件以确定迭代是否继续。\n\n## 选择错误的构造\n\
    \n有哪些迹象可能表明你为解决方案选择了错误的循环类型（前测或后测）？（1）逻辑在循环体内外都重复。（2）使用了一个“技巧”来强制循环至少迭代一次。如果你使用过一种语言，其中既没有前测选项也没有后测选项（MATLAB），这些选项可能看起来很熟悉。\n"
