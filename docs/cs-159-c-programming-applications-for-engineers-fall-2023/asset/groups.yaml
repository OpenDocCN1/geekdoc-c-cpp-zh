    of an assignment.


    ## Minimum consequences for violating course policies will include:


    - First offense, a zero for the assignment, a reduction of one letter grade at
    the end of the semester, AND a referral to the Office of the Dean of Students
    for disciplinary action.


    - Second offense, a zero for the assignment, a failing grade for the course, AND
    a referral to the Office of the Dean of Students for disciplinary action.


    ## Notable exceptions to the first offense minimum consequences:


    - Any violation on an exam will result in a failing grade for the course and a
    Dean of Students referral.


    - Acts such as a misrepresentation of identity or location will result in a failing
    grade for the course and a Dean of Students referral.


    - Posting to, requesting from, or accessing solutions found on unapproved sources,
    particularly those found on-line, will result in a failing grade for the course
    and a Dean of Students referral.

