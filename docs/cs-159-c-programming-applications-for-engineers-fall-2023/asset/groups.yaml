    The following is a summary of the basic structure chart rules:


    +   (1) Each rectangle in a structure chart represents a user-defined function.
    Standard C functions (`stdio.h`, `math.h`) are not included.

    +   (2) The name in the rectangle should communicate the purpose of the function.
    It is the name that will be used in the program.

    +   (3) The structure chart contains only the function flow, no other code is
    indicated.

    +   (4) Common functions, those functions called more than once in a program,
    are indicated by a slash in the lower right corner of the rectangle. If such a
    function contains other function calls then the complete structure need be shown
