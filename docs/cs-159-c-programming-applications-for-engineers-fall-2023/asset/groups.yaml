    \ main 函数中。\n\n此外，每个用户定义的函数可以代表你较大程序中的单个任务。未能如这里和课程标准中所述良好使用用户定义的函数，将导致所有要求使用用户定义函数的作业得零分。\n\
    \n## 参数传递\n\n当我们向函数发送数据时，计算机内存中发生了什么？\n\n有两种可能性：\n\n- 1. 传递给函数的值被存储在表示新且唯一内存位置的新变量中。结果本质上是对原始值进行副本。\n\
