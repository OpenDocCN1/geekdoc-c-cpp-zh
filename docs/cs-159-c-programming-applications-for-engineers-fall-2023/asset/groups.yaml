    \ or unmodified. Neither have I provided access to my code\n*   to another. The\
    \ effort I am submitting is my own original work.\n*\n*   Program Description:\n\
    *\n********************************************************************/\n```\n\
    \n- 你必须在 Vocareum 内使用 vi 的 :hhw 命令插入家庭作业标题。\n- 每次成功提交家庭作业后，你将收到一封确认电子邮件。\n\n请确保你的实验和家庭作业标题中以下各项均正确：\n\
    \n- 学术诚信声明将为你提供，并且必须保留在标题中。不要对该声明做任何更改。\n- 每个作业标题开头和结尾的交替字符是安全和识别功能的一部分，不应修改。\n\
    - 详细的程序描述是必要的。如果你的实验教师在快速浏览你的代码后无法跟上你的逻辑，那么他们应该能够从你的描述中确定你试图实现的算法。详细的程序描述将意味着你的程序代码中所需的注释更少。\n\
    \n## 函数标题\n\n```\n/********+*--*--*-----*-----*-----*-----*--*---*-----*--*---*-----*--*---*---*---*---*---*/\n\
    *\n*   Function Information\n*\n*   Name of Function:\n*\n*   Function Return\
    \ Type:\n*\n*   Parameters (list data type, name, and comment one per line):\n\
    *       1.\n*       2.\n*       3.\n*\n*   Function Description:\n*\n*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*/\n\
    ```\n\n- 你必须在 Vocareum 内使用 vi 的 :hfx 命令插入家庭作业标题。\n- 在使用函数时，在标题中注释你的参数（函数接收的那些值）很重要！函数定义的第一行没有足够的空间来注释参数，因此必须在此标题中包含它们。\n\
    \n## 对象名称/标识符\n\n- 在本课程中，我们将以下内容视为对象：**变量、函数、符号/定义常量**。你必须为你的对象命名，以反映它们在程序中的目的。\n\
    \n| int x;<br>int y;<br>int z; | 仅根据变量名，你能确定变量 x、y 和 z 在程序中完成什么吗？也许它们保存了关于 3D\
    \ 点的信息？如果程序中不包含 3D 坐标数据，那么将 x、y 和 z 用作变量名就不清楚了。 |\n\n- **对象的单字符标识符很少有意义**。合理的例外是用于简单计数或访问数组元素的循环控制变量。\n\
    - 使用下划线开头标识符不是本课程将采用的做法。\n\n| int numStudents;<br>float objectMass;<br>char courseGrade;\
    \ | 相关的变量、常量和函数名称有助于你试图实现的逻辑的**文档化**和**可读性**。 |\n\n## 变量声明\n\n- 每行只声明一个变量。\n-\
    \ 所有变量声明必须出现在函数的局部声明部分中。不允许变量声明具有全局作用域，并且任何声明都不应出现在可执行语句中。\n\n## 变量初始化\n\n```\n\
    int numStudents = 0;                                //OKAY TO KEEP HERE\nfloat\
    \ objectMass = calcMass(acceleration, velocity); //PLACE AMONG EXECUTABLES\n```\n\
    \n- 一般来说，初始化在用户定义函数的局部声明部分中声明的变量是可以接受的。如果用于初始化变量的表达式比常量赋值更复杂，那么最好在函数的可执行语句部分中为变量赋予其第一个值。\n\
    \n## 符号/定义常量\n\n- 符号/定义常量的标识符选择必须全部大写。此标准允许任何程序员区分表达式中常见操作数的变量、函数调用和常量。\n- 在程序顶部紧随作业标题之后定义所有符号/定义常量。\n\
    - 因为使用符号/定义常量可以改善程序的文档化，本课程的标准是你应尝试**最大化**使用符号/定义常量并**最小化**使用字面常量（参见第 3 章）。\n\n\
    ## 注释\n\n在 C 编程语言中，有两种可能的注释实现：\n\n- 单行注释 // 将指示编译器忽略 // 之后直到行尾的所有内容。\n- 多行注释 /*\
    \ */ 将指示编译器忽略 /* 和 */ 之间的所有内容。有关此类注释的示例，请参见上面的标题。在 C 编程语言中，多行注释不能嵌套。\n\n### 必须注释的内容\n\
    \n- 你声明的每个变量都必须有一个简短的注释来描述其在程序中的目的！\n  - 在函数的局部声明部分中，将变量注释放在声明的右侧。\n- 在给定函数中，预期偶尔的复杂代码段会被文档化，以告知他人你试图实现的逻辑。\n\
    \  - 例如，建议在任何重要的选择或重复结构之前放置一两行注释。\n\n## 缩进\n\n你必须将结构体内的所有代码缩进**两个（额外）空格**！你几乎永远不应该在编辑器的第一列开始一行代码！以下是根据我们的标准正确缩进的一些常见结构：\n\
    \n| | | |\n|---|---|---|\n| for(x = 1; x <= MAX; x++) { printf(\"%d\", x); } |\
    \ if (y == 3) { for(g = 0; g > MIN; g--) { y = y - g; } } | do { e = m * c * c;\
    \ avg = sum/number; }while(r == 0); |\n\n### 更多缩进示例：\n\n| Correct | Incorrect\
    \ | Also Incorrect |\n|---|---|---|\n| if(x == 3 || y == 2) { z++; a = a - 1;\
    \ } | if(x == 3 || y == 2) { z++; a = a - 1; } | if(x == 3 || y == 2) { z++; a\
    \ = a - 1; } |\n\nswitch 结构将按照 C 编程教材中的示例进行缩进 - 参见第 258 页。\n\n## 空白间距\n\n- 请在各部分之间放置一个额外的行，以帮助按与同一任务相关的逻辑对代码进行分组。\n\
    - 在代码中平衡使用额外行和不放置任何行。\n- 不需要对所有代码行进行双倍行距或包含多个连续空行。\n- 要求在运算符和操作数之间放置一个空格，例如：`y\
    \ = y - g;`\n\n## 编程标准\n\n编程标准有众多动机；在本课程中，此处描述的此类标准的目的是帮助你为未来的编程工作培养良好习惯。对一些学生来说，这一要求将需要打破之前养成的编程习惯。\n\
    \n### 什么使习惯或编程实践不那么可取？\n\n任何使初学者编程更加困难、增加软件被黑客攻击或崩溃的脆弱性、不必要地创建复杂代码，或代表编程语言正在过时的特性的事物。\n\
    \n## 将局部声明与可执行语句分开\n\n- 本课程中 `gcc` 编译器的默认设置要求所有变量必须在可执行语句开始之前声明。有关更多信息，请参见 C 编程教材第\
    \ 2 章第 2 章中的图 2-2。\n\n## 作用域\n\n- 变量绝不允许具有全局作用域。\n- 你需要与另一个函数共享变量吗？你需要变量值在函数内更改并在函数终止后保留该更改吗？\n\
    \  - 你必须了解如何将变量/值传递给用户定义函数并从中返回它们。\n  - 我们保留为实现全局变量的作业打**零分**的权利。\n- 我们期望在本课程中，所有函数声明都将具有全局作用域。\n\
    - 不要为两个具有重叠作用域的对象重用标识符。\n\n## 符号/定义常量和其他预处理器指令\n\n- 所有预处理器指令必须放在程序顶部，紧随文件相应作业标题之后。\n\
    - 你可以在 C 编程教材（附录 G）中阅读更多关于符号/定义常量的内容，但符号/定义常量的一个目的是在未来修改程序要求时，使你作为程序员的工作更加容易。\n\
    \n## { 和 } 的使用\n\n- 你将在 C 编程教材中观察到，在某些情况下可以省略 `if`、`for` 和 `while` 等结构体周围的花括号。不要养成或继续这种习惯！初学者已经很难配对花括号，而错位的花括号可能是最难解决的错误之一。\n\
    - 我们将在第 5 章（C 编程教材第 245 页，图 5-14）讨论**悬空 `else`** 问题，作为当你像我们要求的那样省略花括号时难以调试的一个困难逻辑错误的示例。当你试图理解教材第\
    \ 8 章中编码的排序算法时，你也会遇到书中缺少 { 和 } 的情况。\n\n对于 C 中所有相关的选择和重复结构，使用 { 和 } 是必需的。\n\n"
