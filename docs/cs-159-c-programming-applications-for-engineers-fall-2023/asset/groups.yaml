    \n## Chapter 1 – Introduction to Computers\n\n### Hardware Basics\n\nThe four\
    \ primary components of a computer:\n1. A Central Processing Unit\n2. Main Memory\n\
    3. Input/Output Hardware\n4. Systems Interconnection - connecting all of the above\n\
    \nThe following two hardware components of a computer are important to us as programmers:\n\
    1. The central processing unit or processor.\n2. The main memory storage.\n\n\
    Why these two particular components? An understanding of how the processor operates\
    \ and what role the main memory plays for programmers we will write this semester\
    \ will allow us to better utilize these limited resources of the computer.\n\n\
    The processor (CPU) is of interest as it is where all of the processing of instructions\
    \ and associated data will take place. The CPU can be described as having four\
    \ fundamental components:\n1. Registers - A small amount of memory local to the\
    \ processor used for temporary storage related to the current instruction being\
