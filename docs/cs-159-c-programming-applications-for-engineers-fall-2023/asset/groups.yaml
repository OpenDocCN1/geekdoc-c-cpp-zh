    \n- 8. 你可以预期，成绩和官方考试答案将于 3 月 30 日星期四下午 5:00 前在 Brightspace 上发布。在答案发布之前，请勿就错误（如有）联系课程工作人员。如果你在答案发布后仍认为存在错误，则可以在\
    \ 4 月 7 日星期五前提出书面复核申请，并在讲师的办公时间将其交给讲师。你的申请必须是纸质副本（不接受电子邮件），并包含详细描述（如适用可使用代码），说明你认为发布答案错误的原因。\n\
    \n- 9. 宣布时间到时，所有书写必须停止。时间一到，你不得继续修改考试中的任何答案。\n\n## 以下程序用于第 #1–#2 题\n\n```c\n#include\
