    \ x is %d\\n\", x);\n```\n\n### Why are there no recognizable differences between\
    \ the post-fix and prefix examples above?\n\n- When used on a line without any\
    \ other expression the post-fix and prefix operations are interchangeable.\n-\
    \ Additionally, under those same conditions a simple or complex assignment could\
    \ be substituted for the post-fix or prefix operations.\n\n### When are the differences\
    \ between the post-fix and prefix operations demonstrable?\n\n- When those operators\
    \ are used within another expression.\n\n| Result of Post-fix: | Result of Prefix:\
    \ |\n|---|---|\n| | |\n\nExample to demonstrate the differences between the prefix\
    \ and post-fix operations:\n\n```\nint x = 0;\nprintf(\"The value of ++x is: %d\\\
    n\", ++x);\nx = 0; //RESET x\nprintf(\"The value of x++ is: %d\\n\", x++);\nprintf(\"\
    final value of x: %d\\n\", x);\n```\n\n## Multiple Modifications in a Single Expression\n\
    \n```\nint x = 0;\nint y = 0;\n\ny = x++ + ++x - --x - x--;\n\nprintf(\"x: %d\
    \ y: %d\\n\", x, y);\n```\n\n```\nint x = 0;\nint y = 0;\nint z = 0;\n\nx = z++\
    \ + ++y;\n\nprintf(\"x: %d y: %d z: %d\\n\", x, y, z);\n```\n\nAn expression such\
    \ as y = x++ + ++x - --x - x-- may not be interpreted the same way by different\
    \ compilers. In general, undefined operations should not remain in your program\
    \ even if you have determined how exactly the operation is defined for our server.\n\
    \n> Warning: In the C programming language, if a single variable is modified more\
    \ than once in an expression, the result in undefined.\n\n## Mixed and Single\
    \ Data Type Expressions\n\nWe have seen examples already of expression evaluations\
    \ that produce results other than what we expect if we were in mathematics (or\
    \ using a calculator, Excel, or MATLAB).\n\n```\n3 / 2 = 1\n```\n\n- The above\
    \ example is another one of those situations! What happens here in C programming\
    \ is that the division of two integer values must result in another integer!\n\
    \nHowever, if we mix the types as seen the statement below the remainder is preserved\
    \ in the sum.\n\n```\n3 + 2.1 = 5.1\n```\n\nThe mixed type expression in the previous\
    \ example will implicitly type convert the integer 3 to a floating-point 3.0 such\
    \ that the expression is evaluated as if two floating-point values were present.\
    \ Do you see any problem converting 3 to 3.0 before it is added to 2.1?\n\n- No,\
    \ there is no potential loss of data and the implicit conversion is referred to\
    \ as safe.\n"
  mdcn: "\n\n## 运行时错误\n\n这是程序运行时发生的任何错误。运行时错误可能导致崩溃。崩溃是导致程序执行意外停止的事件。导致崩溃的两种非常常见的运行时错误是\
    \ **段错误** 和 **浮点异常**。为什么编译器没有检测到这些错误？编译器可能在代码编译完成且用户输入零作为将用于表达式分母的值之前，都不知道会发生除以零的尝试（浮点异常）。\n\
    \n更难诊断的错误是不会导致崩溃的运行时错误！此类错误通常是因为输出（结果）不符合预期而被发现的。\n\n```\nLogical error example,\
