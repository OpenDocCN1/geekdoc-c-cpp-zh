    # Multidimensional Arrays


    The arrays we have seen so far are single dimension arrays. Each single dimension
    array is one row of indexed column values. Mastery of logic with single dimension
    arrays is necessary before considering multidimensional structures that may increase
    memory usage significantly.


    With multidimensional arrays we can add a second dimension (multiple rows each
    with its own columns), a third dimension (planes, rows, and columns), and further
    as necessary. Your only limitation may be memory, but rarely does a problem call
    for an array with more than three dimensions.


