    # Width Modifiers:


    +   • A width modifier is used with a conversion character to reserve a given
    amount of space for a value to be displayed.


    +   • If the number of characters in the data to display is less than that specified
    by the width modifier then the data will be right aligned in the spaces reserved.


    +   • Left alignment can be achieved by prepending the – prior to the width modifier.
    This option is known as the flag.


    # Precision Modifiers:


    +   • A precision modifier is used with floating-point data to determine the number
    of digits to display to the right of the decimal point.


    # Placeholder Summary:


    | % | | | | Size | Code |

    |---|---|---|---|---|---|


    The flag attribute is the character used for subtraction and will shift the default
    alignment from right to left. For example: %-10d'
