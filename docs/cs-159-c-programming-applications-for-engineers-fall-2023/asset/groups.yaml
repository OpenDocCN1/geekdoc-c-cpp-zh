    ## 关系和相等运算符


    C 语言中有四个关系运算符和两个相等运算符。这些运算符都是二元运算符，对两个操作数进行求值。关系表达式的结果是一个逻辑（0, 1）值。


    ## 关系和相等运算符（图 5-4，第 236 页）：


    | 类型 | 运算符 | 含义 | 优先级 |

    | --- | --- | --- | --- |

    | 关系 | < | 小于 | 10 |

    | | <= | 小于或等于 | |

    | | > | 大于 | |

    | | >= | 大于或等于 | |

    | 相等 | == | 等于（相等） | 9 |

    | | != | 不等于（不相等） | |


    ## 复合语句


    可以将一系列关系、相等和逻辑运算符组合起来，形成所谓的复合语句。此类语句（或表达式）的结果将是一个（true 或 false）逻辑值。


    当复合逻辑表达式仅包含单个变量（例如 x > 0 && x < 10）时，其含义是明确的。


    通常，通过加入括号可以使复合语句更易读。你能确定下面哪个表达式与其他两个不同吗？


    ### 示例：


    ```

    int x = 3;

    int y = 2;

    int z = 3;


    printf("Result #1 = %d\n", x <= 3 || y >= 2 && z != 3);

    printf("Result #2 = %d\n", x <= 3 || (y >= 2 && z != 3));

    printf("Result #3 = %d\n", (x <= 3 || y >= 2) && z != 3);

    ```


    > 注：当在同一表达式中使用 && 和 || 时，我们的编译器会发出警告，建议使用 ( 和 )。


    ## 扩展前面的示例：


    ```

    int x = 3;

    int y = 2;

    int z = 3;

    printf("Result = %d\n", x++ <= 3 || y++ >= 2 && z++ != 3);

    printf("x: %d y: %d z: %d\n", x, y, z);

    ```


    | 上面程序的输出是什么？ | 什么是运算符绑定？这与优先级有何关系？ |

    | --- | --- |

    | | 运算符的优先级可以确定表达式中哪些操作数绑定到它。<br>因为逻辑 AND 运算符的优先级高于逻辑 OR 运算符，表达式 y++ >= 2 是 AND
    运算符的左操作数，而不是 OR 运算符的右操作数。 |


    | 示例： | 如何求值？ |

    | --- | --- |

    | int x = 7;<br>int y = 9;<br>int z = 5;<br>int result;<br>result = !(++y - 9)
    || -5 + z++ && x++;<br>printf("x: %d y: %d z: %d\n", x, y, z); | |


    ## 补


    关系、相等和逻辑运算符中的每一个都是另一个关系、相等或逻辑运算符的补。每当一个逻辑表达式为 true 时，其补为 false；每当一个逻辑表达式为 false
    时，其补为 true。


    - 例如，x < 3 表示所有小于 3 的数，其补 x >= 3 表示所有其他值。


    ## 关系和相等运算符的补：


    ## 逻辑运算符的补：


    | 原始表达式： | 补： | |

    | --- | :--- | :--- |

    | x > 0 && x < 10 | | |

    | x > 0 && x < 10 || y != 0 | | |

    | !(x != 1 && x != 2) | 补 #1： | 补 #2： |

    | !x && !y | 补 #1： | 补 #2： |

    | x == 0 || y == 0 | 补 #1： | 补 #2： |


