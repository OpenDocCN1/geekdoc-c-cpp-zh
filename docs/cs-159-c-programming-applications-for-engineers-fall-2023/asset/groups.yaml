    \ x[5]);\n return(0);\n}\nvoid swapValues(int *ax, int *ay)\n{\n int temp;\n temp\
    \ = *ax;\n *ax = *ay;\n *ay = temp;\n}\n```\n\n### 传递整个数组\n\n- 如果我们有一个大小为 10 的数组，需要将所有\
