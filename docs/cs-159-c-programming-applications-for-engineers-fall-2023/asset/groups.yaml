    \n- 1. 在答题卡上填写你的姓名和学生身份证件号码（填写并涂黑所有要求的信息）。\n  - “试卷表单”和“部分”区域可以留空。\n  - 学生身份证件号码错误将导致本次考试得零分。所有学生身份证件号码均以\
