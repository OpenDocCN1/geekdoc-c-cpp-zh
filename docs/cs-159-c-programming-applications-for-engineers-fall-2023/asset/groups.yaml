    \ A pointer is a variable that stores a memory address, typically of another variable,\
    \ and through the memory address the data stored there can be accessed and manipulated.\n\
    \n### Working With Addresses, the & Operator\n\nWe have seen the address operator\
    \ (`&`) required in `scanf` statements and being used to pass variables by address\
