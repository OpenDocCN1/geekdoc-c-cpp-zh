    n\", a, n);\n  return(0);\n}\n\nint makeCalc(int a, int result)\n{\n  do\n  {\n\
    \    result *= a--;\n  }while(a > 1);\n  return(result);\n}\n```\n\n- 1. 以上程序生成的第一行输出是以下哪项？\n\
