    \ = getQuantity();\n\n    data = (int*)malloc(sizeof(int) * quantity);\n    getData(data,\
    \ quantity);\n    printData(data, quantity);\n\n    return(0);\n}\n```\n\n```\n\
    int getQuantity(void)\n{\n\tint qty;\n\n\tprintf(\"Enter quantity of data -> \"\
    );\n\tscanf(\"%d\", &qty);\n\n\treturn(qty);\n}\n```\n\n```\nvoid getData(int\
    \ *data, int size)\n{\n\tint i;\n\n\tprintf(\"Enter %d integers -> \", size);\n\
    \n\tfor(i = 0; i < size; i++)\n\t{\n\t\tscanf(\"%d\", data + i);\n\t}\n}\n```\n\
    \n```\nvoid printData(int *data, int size)\n{\n\tint i;\n\n\tprintf(\"\\nContents\
    \ of data set: \");\n\n\tfor(i = 0; i < size; i++)\n\t{\n\t\tprintf(\"%d \", *(data\
    \ + i));\n\t}\n\n\tprintf(\"\\n\");\n}\n```\n\n注：为简单起见，我们跳过了确认分配是否成功以及完成后释放内存等重要任务。\n\
    \n## 第11章 – 字符串：字符数组\n\n- 字符串是一系列字符，具有被视为单个单元的能力。\n\nC 编程语言没有字符串数据类型，但试图通过使用字符数组来提供处理字符串数据的某些能力。\n\
    \n与数值数组类似，我们可以将字符串声明为任何预定大小。字符数组常见的问题是，字符串数据所需的元素数量在程序执行期间可能会变化。例如，给定的字符数组可能有20个元素的容量，最初存储‘Computer’，随后该数据被替换为“Science”。我们以及用于处理字符串数据的函数，如何知道数据在哪里结束，数组的未使用部分从哪里开始？\n\
    \n我们可以通过使用称为分隔符的字符来识别字符数组中数据的结束位置。这个分隔符字符‘\\0’表示字符数组中数据的结束。这对于许多操作字符串的函数非常重要。\n\
    \nC 编程语言中的字符串是可变长度且带分隔符的字符串。\n\n- 什么是可变长度？给定时间内数组中找到的数据量。\n- 什么是带分隔符？在数组中插入一个字符，以将数据与数组的未使用部分分开。\n\
    \n### 声明字符串和访问字符串元素\n\n- 我们可以以类似于数值数组的方式访问字符数组的每个单独元素。\n\n| 检查字符数组的元素： | 输出： |\n\
    |---|---|\n| `int lcv;`<br>`char str[11] = \"Good Day\";`<br>`for(lcv = 0; lcv\
    \ < 11; lcv++)`<br>`{`<br>`    printf(\"str[%2d] = %c %5d\\n\", lcv, str[lcv],\
    \ str[lcv]);`<br>`}`<br>`printf(\"\\n\");` | str[ 0] = G   71<br>str[ 1] = o \
    \ 111<br>str[ 2] = o  111<br>str[ 3] = d  100<br>str[ 4] =    32<br>str[ 5] =\
    \ D   68<br>str[ 6] = a   97<br>str[ 7] = y  121<br>str[ 8] =    0<br>str[ 9]\
    \ =    0<br>str[10] =    0 |\n\n字符数组中剩余的**未使用元素**（索引 9 和 10）中有什么？\n\n- 因为我们在上面初始化了数组，剩余元素被填充为零。\n\
    \n### 字符串输入/输出函数\n\n这里有一个值得思考的问题，如果我们要将数据加载到数组中，是否必须始终一次一个元素地输入数据，直到数组填满？这是否意味着为了输入字符串，我们必须一次输入一个字符？\n\
    \n- 好消息！答案是否定的！虽然我们没有可用的字符串数据类型，但 C 编程语言中确实有许多函数和功能，允许我们方便地操作字符串。\n\n### %s 占位符\n\
    \n- %s 占位符表示一个字符串，并用于熟悉的输入和输出函数中。\n\n%s 占位符的示例：\n\n```\nchar str1[SIZE];\n\nprintf(\"\
    Enter a string -> \" );\nscanf(\"%s\", str1); //NOTICE NO &, WHY IS THIS?!\n\n\
    printf(\"The string you entered was %s.\\n\", str1);\n```\n\n### 前面代码段的输出\n\n\
    输入字符串 -> Purdue\n您输入的字符串是 Purdue。\n\n- scanf 函数只读取数据，直到输入新行（'\\n'）或任何空白字符。\n\n\
    输入字符串 -> Go Purdue\n您输入的字符串是 Go。\n\n- 解决方案？寻找 scanf 的替代品！\n\n```\nprintf(\"Enter\
    \ a string -> \" );\ngets(str1);\n\nprintf(\"The string you entered was %s.\\\
    n\", str1);\n```\n\n用户输入的 '\\n' 字符会怎样？gets 函数将接受输入，以新行终止，并将其制成一个以分隔符结尾的字符串。\n\n\
    ### 关于 `scanf` 和 `gets` 函数的顾虑\n\n- 我们本学期使用的编译器不再对与 `gets` 函数相关的潜在问题保持沉默。警告：`gets`\
    \ 函数很危险，不应使用。\n\n### 什么使得 `gets`（出于同样的原因 `scanf`）“危险”且“不应使用”？\n\n- 这两个函数都不会在字符数组填充到其定义容量时停止接受输入。\n\
    - 超出数组的定义容量将导致与范围检查问题相同的问题。\n\n### 输入的替代（更安全）方法\n\n```\nvoid getString(char x[])\n\
    {\n    int index = 0;\n\n    printf(\"Enter your string --> \");\n\n    do\n \
    \   {\n        x[index++] = getchar();\n    }while(index < SIZE && x[index - 1]\
    \ != '\\n');\n\n    //REPLACE THE FINAL CHARACTER WITH A DELIMITER CHARACTER\n\
    \    x[index - 1] = '\\0';\n}\n```\n\n- `getchar` 函数将接受单个字符的输入。\n- 上面的 do-while\
    \ 将在**当用户输入新行字符**或**当达到数组的定义大小时**终止接受输入。\n- 因为 `getchar` 函数仅处理单个字符输入，它不会将分隔符字符放入数组，但它会将新行字符（ASCII\
    \ 值 10）放入数组，必须将分隔符分配给数组，并将在上述函数中覆盖新行字符。\n\n### 字符串操作函数\n\nC 编程语言为我们提供了一组足够的字符串函数，可以在\
    \ `string.h` 库中找到。我们将考虑的函数包括：`strcpy`、`strcmp`、`strlen`，稍后我们将回来查看使用 `strstr` 的示例。类似于\
    \ `printf` 和 `scanf`，这些函数将使用数组名称所代表的地址以及数组中存储的分隔符来完成其任务。\n\n### 确定字符串的长度\n\n要介绍的\
    \ string.h 中的第一个函数是 strlen 函数，它将返回字符串中的字符数。该函数不计算终止分隔符字符，但返回的值确实表示分隔符在数组中的位置（索引）。\n\
    \n```\nchar str1[SIZE];\nint length;\n\ngetString(str1);\nlength = strlen(str1);\n\
    \nprintf(\"Your string [length %d]: %s\\n\", length, str1);\n```\n\n### 示例执行\n\
    \n| 输入您的字符串 -> Purdue<br>您的字符串 [长度 6]: Purdue | 输入您的字符串 -> Go Purdue!!!<br>您的字符串\
    \ [长度 13]: Go Purdue!!! |\n\n### 复制字符串，复制单个变量很容易，但字符串呢？我们可以使用赋值运算符吗？\n\n```\n\
    char str1[SIZE];\nchar str2[SIZE];\n\ngetString(str1); //SEE USER-DEFINED FUNCTION\
    \ ON PREVIOUS PAGE.\n\nstr2 = str1;\n\nprintf(\"The string you entered was %s.\\\
    n\", str1);\nprintf(\"The copy of the string you entered is %s.\\n\", str2);\n\
    ```\n\n### 编译器生成的消息是什么？\n\n- 错误：从类型 'char *' 赋值给类型 'char[150]' 时类型不兼容\n\n### 上面示例中表达式\
    \ str2 = str1 实际上正在赋予什么？\n\n- 该赋值试图强制 str2 放弃其分配的内存，并引用与 str1 相同的内存。如果这是可能的，内存中仍然只会有一个字符串的副本。\n"
