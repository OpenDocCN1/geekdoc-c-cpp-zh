  - '[PAGE 20]


    # Proper Use of Repetition


    +   - Use `for` loops only with counter-controlled processes.

    +   - Make use of all three expressions with every `for` loop. Do not leave expressions
    empty or place meaningless statements in any of the expressions such as `x = x`.

    +   - The use of the comma operator is probably unnecessary in `for` loops for
    this class. See page 323 of the C programming text.

    +   - The use of perpetual loops would violate the expectation that control-forcing
    statements are prohibited.

    +   - Recursion must only be used with counter-controlled processes.


    # Control Forcing Statements


    +   - **You will observe control forcing statements being used in the text but
    their use is prohibited within the course.** There are better ways to direct the
    control of your program without using one of the following statements:

    +     - `exit`, `goto`, `break` (permitted only with `switch` structures), `continue`

    +     - **Multiple return statements in the same function.** A function, much
    like the flowcharts we will discuss in lecture, must have a common (only one)
    starting and ending point. Using multiple `return` statements enables multiple
    ending points for a single function (algorithm).


    # Standard Libraries and Functions


    +   - You are permitted to use many of the functions in the standard C libraries
    introduced in class. **It is your responsibility** for asking a course staff member
    about a function or library we have not discussed in class that you would like
    to use.


    # User-Defined Functions


    Upon introduction of user-defined functions (chapter 4) only the following will
    be permitted in the `main` function of a program:


    +   1. Declaration of those variables that need to be passed between functions.

    +   2. Functions called by `main`.

    +   3. A minimum amount of control structures (loops, selection) to maintain `main`
    as the control center of the program.


    The `main` function is intended to be _the main function_ of the program and a
    majority of the function calls should originate in `main`. Most of the data defined
    in the program should be done in `main`.


    **According to the definition of a function, each function must only have an individual
    (single) specific task.** Failing to make good use of user-defined functions on
    relevant assignments will result in no partial credit.


    All (parameters) variables declared in the first line of the function definition
    must have an explicit data type.


    Passing individual values by address should meet the following criteria:


    +   1. When more than one value needs to be revised and that revision be retained
    in the calling function once the called function terminates.

    +   2. The function continues to meet the definition of being **functionally cohesive**
    such that it completes only a single fundamental task within the larger problem
    being solved.


    # Declaration of Arrays


    All arrays will be static (of fixed-length) until we introduce the topic of **dynamic
    memory allocation** in chapters 9 and 10 of the C programming text. The application
    of variable-length arrays as seen in the example on pages 478 – 479 will violate
    course standards as it permits the local declarations and executable statements
    in a function to overlap.


    +   - It is unacceptable to make use of a variable to represent the size of an
    array in an array declaration.

    +   - A symbolic/defined constant must be used when declaring arrays in all assignments.'
  - '[PAGE 21]


    # Advance Topics/Implementations


    +   * In all programming assignments we will specify from which chapters you may
    reference when developing your solution.

    +   * We commonly view advanced implementations (material not covered yet in lecture
    or not covered in the course) in code as suspicious in that such work is beyond
    what most students in the course are capable of using and believe that the author
    of the code may be someone not currently in the class.


    # Efficient Design


    +   * One measure regarding the quality of ALL assignments is the implementation
    of efficient design. Students of innovative work in science and engineering should
    anticipate and appreciate that design is critical to the evaluation of any product
    including software.

    +   * We require that you implement an efficient and logically correct algorithm
    as part of your assignment. In some cases this may make the distinction between
    letter grades on the assignment. To receive full credit on an assignment we expect
    correct logic AND good design.


    # Some guidelines related to the efficient use of the limited resources of the
    computer:


    +   * Conserve memory.

    +       * Do not use multiple arrays (or dimensions) when one will do the job.

    +       * Do not declare arrays to be large beyond your data needs (specified
    by the assignment).

    +       * Do not use arrays when they are unnecessary.

    +   * Conserve the effort of the processor.

    +       * Do not write nested loops for tasks that can be done in one (or none).

    +   * Shorter code is usually better. Recognize patterns in your code. Avoid duplication
    of the same, or similar, logic within a program.

    +       * If you find yourself repeating code in several places, create a function
    such that the code only appears once in your program and is called when needed.

    +       * Another common scenario involves several functions have been written
    that do essentially the same thing, or contain a considerable amount of similar
    code. In such cases you should attempt to consolidate as much as possible.

    +   * Use the top-down design. Each function should have a well-defined task and
    not a series of tasks.

    +   * Topics of efficient design will be commented on, where appropriate, in lecture.


    # Syntax Errors and Warnings


    +   * Any assignment submit attempt with a **syntax error in the source code**
    will be rejected and **no consideration given for partial-credit**. You are responsible
    for testing your work thoroughly prior to submission.

    +   * Compiler warnings will result in a loss of points and should be remedied
    prior to submission of your final effort.


    # Course Tools and Technologies for Developing Code


    +   1. We DO NOT encourage that you develop, compile, or to test your code in
    ANY editor or compiler other than those found within Vocareum. Not all C programming
    language compilers are fully compatible. You should want to test your work under
    the same conditions that it will be processed and tested by the course.

    +   2. It is your responsibility to thoroughly test your code within Vocareum
    as demonstrated during the first week of the semester prior to making the final
    submission of your work.

    +   3. We will not support compilers, editors, and programming development environments
    other than those found on Vocareum.


    You are advised to leave sufficient time prior to the assignment deadline to seek
    assistance should you encounter a difficulty with assignment submission. No late
    work will be accepted.'
