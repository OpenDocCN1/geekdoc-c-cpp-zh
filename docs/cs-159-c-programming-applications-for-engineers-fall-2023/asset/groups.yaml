  mdcn: "\n\n## 作为技术团队成员的协作学习/组队/参与\n\nHere are our expectations of you and your group:\n\
    \n- 1. **Make time to meet with your group regularly.** There are 168 hours in\
    \ a week, finding some common time for a group to meet should not be difficult.\
    \ It is acceptable for part of the group to meet some of the time if everyone\
    \ cannot participate in every meeting. Ultimately, each individual is responsible\
    \ for planning and documenting their contribution to the group effort accordingly.\n\
    \  - Reflect on the roles and responsibilities you had on each lab programming\
    \ assignment. Recognize when you are not being utilized in a way that contributes\
    \ to a better understanding of course content.\n\n- 2. **Allow everyone an opportunity\
    \ to express their ideas** on how to approach an assignment. One benefit of collaborative\
    \ teaming is that everyone brings a different set of skills to the group and the\
    \ resulting effort often is a stronger one than if it was completed individually.\n\
    \  - When a group member becomes unresponsive to requests to meet or fails to\
    \ update the other members of the group then those contributing members must prepare\
    \ to continue without the unresponsive member.\n\n- 3. **All group members must\
    \ be satisfied with the final submission.** It is not acceptable for a group to\
    \ submit an assignment that is not approved by all group members. “It is good\
    \ enough” may be true for you but it is unfair for the others in the group who\
    \ aspire for the highest grade possible.\n  - Likewise, each group member must\
    \ be satisfied with your contribution to the group effort.\n\n- 4. **Each group\
    \ member must fully understand the entire assignment submitted.** Do not start\
    \ your group meetings by trying to delegate the tasks to the different group members.\
    \ Everyone must understand and contribute to every aspect of the assignment and\
    \ its development.\n  - Assignments are an opportunity for you to demonstrate\
    \ your knowledge of the programming concepts being utilized. Use assignments to\
    \ serve as a measure of what you do and do not know and how to direct your future\
    \ efforts in the course.\n\n- 5. **Designate who will turn in the assignment,\
    \ when it will be turned in, and how successful submission will be communicated\
    \ with the rest of the group.** Set a goal to submit the assignment well in advance\
    \ of the due date to avoid any last minute problems.\n\n- 6. **You will work with\
    \ the group assigned.** Please contact us with concerns you may have with your\
    \ group. Take a professional approach with your group experience as similar to\
    \ what you may experience at an internship or co-op experience.\n  - Groups will\
    \ be re-assigned after every four labs.\n  - Future group assignments may take\
    \ into consideration lecture attendance and assignment completion as an indicator\
    \ of your interest in participating in the course. Active students in the course\
    \ should not be burdened with partners who are not willing to stay current with\
    \ course content.\n\n## Nondiscrimination Statement\n\nPurdue University is committed\
    \ to maintaining a community which recognizes and values the inherent worth and\
    \ dignity of every person; fosters tolerance, sensitivity, understanding, and\
    \ mutual respect among its members; and encourages each individual to strive to\
    \ reach his or her own potential. In pursuit of its goal of academic excellence,\
    \ the University seeks to develop and nurture diversity. The University believes\
    \ that diversity among its many members strengthens the institution, stimulates\
    \ creativity, promotes the exchange of ideas, and enriches campus life.\n\n##\
    \ Students with Disabilities\n\nPurdue University strives to make learning experiences\
    \ as accessible as possible. If you anticipate or experience physical or academic\
    \ barriers based on disability, you are welcome to inform your instructor to discuss\
    \ options. You are also encouraged to contact the Disability Resource Center at:\
    \ drc@purdue.edu or by phone: 765-494-1247.\n\nStudents with an existing letter\
    \ of accommodation are to refer that letter to their instructor and follow up\
    \ with an e-mail to initiate a conversation regarding how your accommodations\
    \ may be implemented in the course.\n\n## Emergency Preparation\n\nIn the event\
    \ of a major campus emergency, course requirements, deadlines, and grading percentages\
    \ are subject to changes that may be necessitated by a revised semester calendar\
    \ or other circumstances.\n\n- In case of a campus emergency, check Brightspace\
    \ for announcements. Follow all official university issued instructions. See https://www.purdue.edu/ehps/emergency_preparedness/\
    \ for more information.\n\n## Mental Health/Wellness/Basic Needs Statement\n\n\
    Purdue University is committed to advancing the mental health and well-being of\
    \ its students. If you or someone you know is feeling overwhelmed, depressed,\
    \ and/or in need of mental health support, services are available. For help, such\
    \ individuals should contact Counseling and Psychological Services (CAPS) at 765-494-6995\
    \ during and after hours, on weekends and holidays, or by going to the CAPS office\
    \ on the second floor of the Purdue University Student Health Center (PUSH) during\
