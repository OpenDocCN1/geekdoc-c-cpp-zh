    \  - 单字符标识符很少有意义。\n  - 全大写的标识符表示符号/定义常量，即在程序执行期间不会改变的值。\n\n### 关于选择标识符的规则：\n\n\
    - 第一个字符必须是字母字符。\n- 必须仅由字母字符、数字或下划线组成。\n- 标识符的前 63 个字符有意义。\n- 不能重复保留字。（C 语句中使用的单词包括；main,\
    \ int, return, void，参见附录 B）\n\n## 数据类型\n\n### 数据类型决定了什么？\n\n- 存储给定类型值所需的内存量。\n\
    - 给定类型的值在计算机内存中的存储方式。\n- 可以对值执行哪些操作。某些操作仅限于特定的数据类型。\n\n整数（int）类型是没有小数部分的数字。C 支持不同大小的整数数据类型：short、int、long\
    \ 和 long long。\n\n- 你将使用的整数类型取决于你计划存储的整数数据的潜在范围。较长的类型将需要更多内存。\n\n| int range,\
    \ -2147483648 to 2147483647 | 实际范围将取决于系统。 |\n|---|---|\n\n字符（char）是计算机“字母表”中可以表示的任何值。每个字符都有一个对应的小整数值。这种整数值与等效字符并列的标准表称为\
    \ ASCII 表。你将在文本的附录 A 中找到 ASCII 表。\n\n- 由于字符在内存中存储为表示该字符 ASCII 码的整数，因此可以对字符执行算术运算！\n\
    \n布尔（bool）值表示逻辑数据（真或假）。在 C 语言的 C99 标准之前，仅使用整数来表示真值。课程当前使用的编译器默认不识别 bool 数据类型。\n\
    \n- 为了向后兼容性，非零数字表示真，零值可用于表示假。\n- 本学期我们不会使用 bool 数据类型，可以使用整数值来代替。\n\n浮点（float）数具有小数部分，例如\
    \ 3.14159。C 支持不同大小（从小到大）的浮点数据类型：float、double 和 long double。最常见的实现将是 double 和 float。较长的类型将提供额外的精度并需要更多内存。\n\
    \n> 注意：许多编程参考资料会将任何非整数的数值称为实数。这种用法可能与你从数学中了解的实数和虚数不一致。\n\n## 变量\n\n变量是具有数据类型的命名内存位置。\n\
    \n程序中的每个变量都必须声明和定义。在 C 中，声明用于命名对象（例如变量），而定义用于创建对象。\n\n- 声明 - 为变量命名。\n- 定义 - 为变量保留内存。\n\
    \n要创建变量（在一步中同时完成声明和定义），你首先需要列出变量的预期数据类型，然后是所选标识符，以及一个终止分号。\n\n- `int count; //COUNTS\
    \ THE NUMBER OF GPAs GREATER THAN INPUT VALUE`\n\n### 你需要知道：变量被定义为表示特定的数据类型，并且只能存储和表示该类型的值！\n\
    \n> 课程标准：每行只声明一个变量。\n\n那些有类似 C 语言编程经验的人可能知道可以在一个语句中声明多个变量。但是，课程编程标准不允许这种做法。组织函数的数据需求可能是一项挑战，每行一个声明有助于此，并改善代码的文档和可读性。\n\
    \n### 变量初始化\n\n可以在创建变量的同时对其进行初始化。\n\n```\nint count = 0;\n```\n\n上述内容将为整数 count\
    \ 保留的内存空间初始化为零值。除非我们初始化变量，否则不能假设分配给变量的内存有任何默认值。未初始化的变量将被分配一个内存位置，该位置可能包含先前使用的现有数据。此类数据被称为垃圾，因为它对程序员来说没有可预测的值。\n\
    \n> 课程标准：将复杂的初始化表达式移动到函数的可执行语句部分。\n\n## 常量 - 字面常量\n\n字面常量是用于指定数据的未命名值。例如，我们想要计算圆的周长：\n\
    \n```\ncircumference = 2 * 3.14159 * radius;\n```\n\n- 上述表达式中的值 2 和 3.14159 都是字面常量。当这些值未由符号表示时，我们经常将其称为“硬编码”（下一主题）。\n\
    \n## 常量 - 符号/定义常量\n\n#define 预处理指令用于创建符号常量。\n\n![](img/50641bd70680c74d7c49fe705f0d8389_41_0.png)\n\
    \n当此语句出现在预处理指令中时，程序编译前，此后出现的所有 `symbol` 都将自动替换为 `replacement value`。\n\n> 注意：替换不会在引号内进行。\n\
    \n### 为什么使用符号/定义常量？\n\n- 当程序很长且包含许多复杂计算时，很难确定算术表达式中字面常量值代表什么。使用常量可以通过为表达式中的操作数赋予意义来帮助记录程序。\n\
    \n- 使用常量的另一个绝佳理由是使你的程序更易于维护。例如，也许一门课程有 100 名学生。你可能在加载数据或确定平均值时使用值 100，但你也可能使用\
    \ 100 将 .853 转换为 85.3%。现在，如果学生人数变为 105 呢？你需要搜索程序，确定程序中出现的哪些 100 值与课程的学生人数相关，并仅将这些值更改为\
    \ 105。\n\n> 课程标准：不鼓励使用内存常量。为什么要为永远不会改变的值请求内存？\n"
