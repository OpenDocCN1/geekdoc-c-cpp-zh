    \ 0;\nint y = 0;\nint z = 0;\n\nx = z++ + ++y;\n\nprintf(\"x: %d y: %d z: %d\\\
    n\", x, y, z);\n```\n\n诸如 y = x++ + ++x - --x - x-- 之类的表达式，不同编译器可能以不同方式解释。通常，未定义的操作不应保留在你的程序中，即使你已经确定了该操作在我们服务器上的确切定义方式。\n\
    \n> 警告：在 C 编程语言中，如果单个变量在表达式中被修改多次，结果是未定义的。\n\n## 混合和单一数据类型表达式\n\n我们已经看到过表达式求值的示例，其结果与我们在数学（或使用计算器、Excel\
    \ 或 MATLAB）时预期的不同。\n\n```\n3 / 2 = 1\n```\n\n- 上面的例子又是这种情况！在 C 编程中，两个整数值的除法必须结果为另一个整数！\n\
    \n但是，如果像下面的语句那样混合类型，余数会保留在和中。\n\n```\n3 + 2.1 = 5.1\n```\n\n前一个示例中的混合类型表达式会将整数\
