    \n- 4. 你必须假设所有 C 程序和代码段都在 Vocareum 上实现，并将使用 gcc 编译器编译。当只呈现代码段时，你可以假设适当的包含语句已存在，且代码位于一个完全可运行的函数或程序内。\n\
