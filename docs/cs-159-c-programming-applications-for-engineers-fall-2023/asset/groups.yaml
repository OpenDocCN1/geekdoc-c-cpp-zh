    \ g = %d\\n\", g);\n}\n```\n\n```\nvoid passTest(int g)\n{\n    printf(\"Before\
    \ g = %d\\n\", g);\n    g = g / 8;\n    printf(\"After g = %d\\n\", g);\n}\n```\n\
    \n### 上面程序的输出：\n\n从输出可以看出，数组的单个元素被视为传递给函数的单个变量，也就是说，数组的单个元素是按值传递的。\n\n- 是否可以对数组的单个元素使用按地址传递？\n\
    \n### 示例：按地址传递 x[1] 元素。\n\n```\n#include <stdio.h>\nvoid passTest(int*);\nint\
    \ main(void)\n{\n int x[3] = {16, 24, 32};\n printf(\"Before x[1] = %d\\n\", x[1]);\n\
