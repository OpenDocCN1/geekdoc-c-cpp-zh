    \n上一页的阶乘问题是计数器控制过程的示例。计数器（也是循环控制变量）控制循环体重复的次数。\n\n在事件控制过程中，会发生一个事件，将循环控制表达式从 true\
    \ 改为 false，从而使重复停止。通过这种过程，可以确定是否会进行另一次循环迭代，但无法确定剩余迭代的次数。考试统计问题是事件控制过程的示例。如果你知道最近的输入，那么你就知道是否会有另一次迭代，但仅此而已。\n\
    \n关键点：如果你能计算或计算出循环执行期间将进行的迭代总次数，那么它是计数器控制过程，否则该过程是事件控制的。\n\n## 输入验证\n\n- 向输入函数添加代码的目标是确保，在函数被允许终止之前，我们有一个有意义的值供程序其余部分处理。\n\
    \  - 输入验证的任务通常位于输入函数中。从这一点开始，输入函数将不仅仅是 print-scan-return 语句。\n- 必须始终为用户提供无限次输入有意义数据的机会。\n\
    - 由于其复杂性，您不会针对特定数据类型进行验证，只针对指定数据类型中的可接受值进行验证。\n  - 您将假设用户始终会输入预期的数据类型。\n- 输入验证的一个重要部分是向用户显示适当的消息，让他们意识到自己的错误以及所需的输入。\n\
    - 由于输入验证确实使输入函数更加复杂，因此不建议使用按地址传递来尝试从单个输入函数“返回”多个值。与按地址传递和相关指针操作（第 9 章和第 10 章）相关的语法使其难以应用于输入验证。\n\
    \n## 输入验证函数的流程图：\n\n![](img/50641bd70680c74d7c49fe705f0d8389_101_0.png)\n\n##\
    \ C 中的循环\n\nC 编程语言提供了三种用于重复循环技术的结构。它们是：while、for 和 do-while。我们将从相似的 while 和 do-while\
    \ 结构开始。\n\n## while 循环\n\nwhile 结构是一个预测试循环。与所有循环一样，while 使用循环控制表达式来确定循环是否应该开始或继续迭代。作为预测试循环，循环控制表达式在第一次迭代之前被求值，然后只要表达式求值为\
    \ true，循环就会完成另一次迭代。\n\n- 只要循环控制表达式为 true，迭代就会继续。当控制表达式求值为 false 时，迭代过程停止。\n\n\
    ## While 循环的基本语法\n\n```\nwhile(loop control expression)\n{\n    //EXECUTABLE STATEMENT\
    \ DESIGNATED\n    //FOR REPETITION – BODY OF THE LOOP\n}\n```\n\n> 注意：while 语句的循环控制表达式后没有分号，因为循环后面跟着一个包含要重复的操作的主体。\n\
    \n## do-while 循环\n\ndo-while 结构是一个后测试循环。与 while 类似，使用循环控制表达式来确定重复是否继续，但作为后测试结构，表达式在主体内的指令初始执行之后被求值。\n\
    \n- 与 while 循环相反，do-while 中的关键字 while 后面加有分号。\n\n| 课程标准：缩进构成循环主体的所有语句，额外缩进两个空格。\
    \ | 课程标准：对于所有循环（和 if 语句），标记循环体开始和结束的大括号必须使用。 |\n|---|---|\n\n## Do While 循环的基本语法\n\
    \n```\ndo\n{\n    //EXECUTABLE STATEMENT DESIGNATED\n    //FOR REPETITION – BODY\
    \ OF THE LOOP\n}while(loop control expression) ;\n```\n\n- 如果循环控制变量的更新发生在循环体中间，此更改是否会导致循环在此点立即终止？\n\
    \  - 不。只有在循环控制表达式被求值并发现为 false 时，循环才会终止。\n  - C 编程语言中没有“中间测试”循环，只有预测试和后测试。\n\n\
    ## 阶乘示例\n\n- 阶乘问题将允许演示带有输入验证的 do-while 以及用于计算阶乘的 while。\n\n```\nint calcFactorial(int);\n\
    int getInput(void);\nvoid displayResults(int, int);\n```\n\n```\nint main(void)\n\
    {\n    int num;\n    int fact;\n\n    num = getInput();\n    fact = calcFactorial(num);\n\
    \    displayResults(num, fact);\n\n    return(0);\n}\n```\n\n```\nint calcFactorial(int\
    \ num)\n{\n    int nFact = 1;\n\n    while(num > 0)\n    {\n        nFact = nFact\
    \ * num;\n        num--;\n    }\n\n    return(nFact);\n}\n```\n\n## 是否需要担心零值可能被相乘？\n\
    \n- 不需要，在乘以零之前，循环控制表达式已被求值并为 false。\n\n用户输入的值局部存储在变量 num 中，每次迭代更改 num 如何影响调用函数中正在发生的事情？\n\
    \n- 不，该变量是按值传递的。\n\n```\nint getInput(void)\n{\n    int num;\n    do\n    {\n\
    \        printf(\"Enter n to calculate n! -> \");\n        scanf(\"%d\", &num);\n\
    \        if(num < 0)\n        {\n            printf(\"\\nError! Non-negative values\
    \ only!!\\n\");\n        }\n    }while(num < 0);\n    return(num);\n}\nvoid displayResults(int\
    \ num, int fact)\n{\n    printf(\"\\n%d! = %d\\n\", num, fact);\n}\n```\n\n##\
    \ 为什么不为输入验证使用“if 循环”？\n\n- if 结构只允许用户有第二次机会输入可接受的数据。我们希望用户有无限次机会输入有效数据。\n\n##\
    \ “if 循环”一词有什么问题？\n\n- if 是选择结构，而不是重复结构。\n\n## 嵌套循环\n\n## 什么是嵌套循环？\n\n- 嵌套循环，或任何形式的嵌套重复，是指一个重复过程位于另一个重复过程之中。\n\
    \n## 该定义如何帮助解决使用嵌套循环的问题？\n\n- 更好的定义是考虑循环解决一个重复过程。那么嵌套循环就是位于另一个重复过程之中的一个重复过程。\n\
    \n## 解决嵌套循环问题的推荐方法是什么？\n\n- 首先，解决并测试嵌套过程，将其放在其自己的用户定义函数中。\n- 接下来，解决将调用嵌套过程的过程。我们必须确保嵌套过程正确，然后再尝试反复使用（调用）它。\n\
