    \n- 6. 考试期间不允许使用任何资源。这包括但不限于教材、笔记、计算器、手机、音频设备和计算机。如果考试期间任何个人电子设备发出声音，则你将被要求立即交卷并离开考场。\n\
    \n- 7. 考试结束后，请前往大厅提交答题卡并离开设施。在我们接受你的作业之前，你需要出示带照片的身份证件。你将保留这份试卷。一旦提交考试，你不得返回座位。\n\
    \n- 8. 你可以预期，成绩和官方考试答案将于 2 月 24 日星期五下午 5:00 前出现在 Brightspace 上。在答案发布之前，请勿就错误（如有）联系课程工作人员。如果你在答案发布后仍认为存在错误，则可以在\
