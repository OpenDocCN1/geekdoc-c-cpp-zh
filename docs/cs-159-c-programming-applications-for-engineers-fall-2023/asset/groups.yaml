    # Expression 1 (Initialization)


    +   - Expression 1 is evaluated only when the `for` loop is encountered for the
    first time. It is in this expression that the loop control variable will be initialized.


    # Expression 2 (Evaluation)


    +   - After expression 1 is evaluated we immediately evaluate expression 2 which
    is the loop control expression.

    +   - If expression 2 is initially evaluated to be false then the loop will not
    iterate! The `for` loop is a pretest construct.

    +   - Upon completion of every iteration the loop control expression must be re-evaluated
    to determine whether another iteration is needed.


    # Expression 3 (Update)


    +   - This final expression is evaluated at the end of every iteration and before
    the next evaluation of expression 2.

    +   - Essentially, any expression changing the loop control variable is acceptable
    for the third expression.


    # Syntax


    +   - Semicolons are necessary between expression 1 and 2 and between expression
    2 and 3.

    +   - As with any looping construct the `for` loop has a body and the body will
    begin and end with `{` and `}`. The body of instructions can be one or more instruction.


    # When to use a `for` loop?


    Otherwise... consider a `while` for your pretest iteration needs.'
