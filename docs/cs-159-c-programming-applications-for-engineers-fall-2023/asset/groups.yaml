  - '[PAGE 47]


    # The run-time errors


    This is any error that occurs when the program is running. The run-time error
    may result in a crash. A crash is an event that causes the execution of the program
    to cease unexpectedly. Two very common run-time errors that result in a crash
    are the **segmentation fault** and the **floating exception**. Why aren''t these
    errors detected by the compiler? The compiler may not know an attempt to divide
    by zero (floating exception) will occur until after the code has been compiled
    and the user enters a zero for a value that will then be used in the denominator
    of an expression.


    The more difficult error to diagnose is a run-time error that does not lead to
    a crash! Such an error is often noticed because the output (results) is not as
    expected.


    ```

    Logical error example, determine the average of three numbers:


    average = x + y + z / 3;

    average = (x + y + z) / 3;

    ```


    Both statements would be syntactically correct; the first statement will not cause
    a crash, but will result in the display of an incorrect value. The second statement
    is the desired result without the logical error.


    +   * A logical error is a run-time error in which **the programmer is responsible**
    for implementing a flaw in the logic of the program.


    # Debugging


    +   * The process of resolving errors is known as debugging. All semester we will
    look at various approaches to debugging your errors including:

    +     * Inserting **diagnostic print statements** into your code to verify the
    expected values at a given point in time in the execution of your program.

    +     * Writing small sections of code that accomplish a sub-task within the larger
    problem that you are trying to solve.

    +     * Developing test cases that represent a variety of expected input.


    # Chapter 3 – Structure of a C Program


    # Expressions


    An expression always reduces to a single value in the C programming language.


    # Expression Terminology Review:


    +   * **operator** - "language-specific syntactical token that requires an action
    to be taken." For example: `+`, `-`, `*`, `/`, and some others that may be new
    to you. If you can take one thing away from the definition above, focus on "language-specific"
    in that in the C programming language the operators and their meanings might be
    different from what you may have seen in mathematics or another programming language
    (namely MATLAB, Python, Excel).


    +   * **operand** - "receives an operator''s action." In other words values operated
    on by the operator. Depending on the operator there may be one, two, or more operands
    necessary to evaluate the operation.'
  - '[PAGE 48]


    Another idea that you should be familiar with in some form is the idea of operator
    **precedence**. The precedence of an operator determines (1) to which operator
    an operand belongs and (2) the order in which it will be evaluated in an expression.
    The inside cover of the text book has a list of the **order of precedence** for
    the C language.


    # Printing Expression Evaluations:


    | |

    |---|

    | `int a = 17; //FIRST OPERAND`<br>`int b = 5; //SECOND OPERAND`<br><br>`printf(
    "%d + %d = %d\\n", a, b, a + b );`<br><br>`printf( "%d / %d = %d\\n", a, b, a
    / b );`<br><br>`printf( "%d %% %d = %d\\n", a, b, a % b );` |

    | |


    Why are there two % characters in the format string of the third printf?


    +   * Because the % already has a special meaning in the format string of a printf
    it takes two to display one to the screen.


    > Note: Both operands of the modulus operator must be integral types.


    # Assignment Expressions


    An assignment expression evaluates the operand on the right side of the assignment
    operator (=) and saves that value in the memory of the variable on the left.


    > Note: The left operand in an assignment expression must be a single variable.


    # Examples of Simple Assignment


    | |

    |---|

    | `int x;`<br>`int y = 2;`<br><br>`x = 3 * 4;`<br>`y = y * 3;`<br>`x = x + y;`
    | Course Standard: Place a space between your operators and operands! |


    # Examples of Compound Assignment


    +   * It is common to add (or apply another common mathematical operation to)
    a value to a variable and store that new value back to the variable.'
  - '[PAGE 49]


    For example, x = x + 3;


    +   Consider what is happening above in terms of memory. On the right we retrieve
    the value of x from memory and add three to it and then store the sum back in
    to the memory location represented by x.


    The compound assignment example:


    +   x += 3; //SAME AS x = x + 3;


    | Compound Assignment Expression | Equivalent Simple Assignment Expression |

    | :--- | :--- |

    | x += expression | |

    | x -= expression | |

    | x *= expression | |

    | x /= expression | |

    | x %= expression | |


    # Example:


    ```

    int x = 3;

    int y = 5;

    int z = 7;

    float a = 2.5;

    float b = 5.0;


    x += 4;

    y /= 2;

    a *= 2;

    b /= 2;


    z %= 4;


    printf("x = %d y = %d z = %d\n", x, y, z);


    printf("a = %.2f b = %.2f\n", a, b);

    ```'
  - '[PAGE 50]


    ```

    Example #2:

    int x = 3;

    int y = 5;

    x /= x + y;

    printf("x = %d y = %d\n", x, y);

    ```


    # Is the result x = x / y + y or x = x / (x + y)?


    +   * Answer: In the case above, the expression will be interpreted as: x = x
    / (x + y)


    # What does this tell you about the operator precedence of /= and + ?


    +   * The addition operator has precedence over the compound assignment operations.


    # Prefix & Post-fix Operators


    +   * Within many programs there is a need to count and this is often done in
    increments of +1 or -1. These two notations, prefix and post-fix, provide a shorter
    alternative to the simple or compound equivalents but can also be combined with
    other expressions and there it is where we find that the position of the operators
    with respect to the operand makes a difference.


    # A post-fix expression involves one operand followed by the operator.


    ```

    int x = 0;

    x++; //POSTFIX INCREMENT

    printf("The value of x is: %d\n", x);

    x--; //POSTFIX DECREMENT

    printf("The value of x is %d\n", x);

    ```


    # A prefix expression involves the operator followed by the operand.


    ```

    int x = 0;

    ++x; //PREFIX INCREMENT

    printf("The value of x is: %d\n", x);

    --x; //PREFIX DECREMENT

    printf("The value of x is %d\n", x);

    ```'
  - '[PAGE 51]


    # Why are there no recognizable differences between the post-fix and prefix examples
    above?


    +   - When used on a line without any other expression the post-fix and prefix
    operations are interchangeable.

    +   - Additionally, under those same conditions a simple or complex assignment
    could be substituted for the post-fix or prefix operations.


    # When are the differences between the post-fix and prefix operations demonstrable?


    +   - When those operators are used within another expression.


    | Result of Post-fix: | Result of Prefix: |

    |---|---|

    | | |


    Example to demonstrate the differences between the prefix and post-fix operations:


    ```

    int x = 0;

    printf("The value of ++x is: %d\n", ++x);

    x = 0; //RESET x

    printf("The value of x++ is: %d\n", x++);

    printf("final value of x: %d\n", x);

    ```'
  - '[PAGE 52]


    # Multiple Modifications in a Single Expression


    ```

    int x = 0;

    int y = 0;


    y = x++ + ++x - --x - x--;


    printf("x: %d y: %d\n", x, y);

    ```


    ```

    int x = 0;

    int y = 0;

    int z = 0


    x = z++ + ++y;


    printf("x: %d y: %d z: %d\n", x, y, z);

    ```


    An expression such as y = x++ + ++x - --x - x-- may not be interpreted the same
    way by different compilers. In general, undefined operations should not remain
    in your program even if you have determined how exactly the operation is defined
    for our server.


    > Warning: In the C programming language, if a single variable is modified more
    than once in an expression, the result in undefined.


    # Mixed and Single Data Type Expressions


    We have seen examples already of expression evaluations that produce results other
    than what we expect if we were in mathematics (or using a calculator, Excel, or
    MATLAB).


    ```

    3 / 2 = 1

    ```


    +   * The above example is another one of those situations! What happens here
    in C programming is that the division of two integer values must result in another
    integer!


    However, if we mix the types as seen the statement below the remainder is preserved
    in the sum.


    ```

    3 + 2.1 = 5.1

    ```


    The mixed type expression in the previous example will implicitly type convert
    the integer 3 to a floating-point 3.0 such that the expression is evaluated as
    if two floating-point values were present. Do you see any problem converting 3
    to 3.0 before it is added to 2.1?


    +   * No, there is no potential loss of data and the implicit conversion is referred
    to as safe.'
