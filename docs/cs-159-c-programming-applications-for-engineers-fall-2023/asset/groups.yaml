  mdcn: "\n## 为什么在函数定义中（如上所示）需要指定第二维的范围？\n\n- 数组的名称仅存储其在计算机内存中的起始位置。不存储有关维度的任何信息。\n\
    \n## 第 9 章和第 10 章 – 指针与指针应用\n\n- 指针是存储内存地址的变量，通常是另一个变量的地址，并通过该内存地址可以访问和操作存储在那里的数据。\n\
    \n### 使用地址，& 运算符\n\n我们已经看到地址运算符（`&`）在 `scanf` 语句中是必需的，并且被用来按地址将变量传递给函数，但这个运算符到底有什么作用？\n\
    \n- 地址运算符（`&`）将返回分配给变量的内存地址。在下表中，你可以看到两个字符变量 `a` 和 `b`。这两个变量在计算机内存中都被分配了一个唯一位置来存储字符值。`printf`\
    \ 语句将显示 `a` 和 `b` 的内存地址，而不会打印这些变量的内容。\n\n- `%p` 占位符通常用于打印变量的地址。`p` 转换代码表示指针值（内存地址）。\n\
    \n- 在数组名称前放置 `&` 并非必要，因为数组名称本身就代表一个内存地址。\n\n| char a = 'X'; char b = 'Y'; printf(\"\
    Address of a = %p\\n\", &a); printf(\"Address of b = %p\\n\", &b); | Address of\
    \ a = 0x7ffd7167170f Address of b = 0x7ffd7167170e |\n\n### 指针变量\n\n- 与所有变量一样，我们必须先声明指针，然后才能向其分配内存地址。\n\
    \n- 指针的声明与声明单个变量非常相似，我们需要一个数据类型和变量的名称（标识符），并在名称前加上 `*` 以指示该变量是指针。\n\n| 局部指针声明示例：\
    \ | |\n| --- | --- |\n| - int *x; - float *y; - char *z; | |\n| 替代且等效的格式： | |\n\
    | - int * x; - float* y; - char* z; | |\n\n先前声明的指针变量 x、y 和 z 最初指向哪里？\n\n- 答案：我们不知道！我们本学期已经看到这对数据变量可能有多糟糕；然而，对于指针，未知值可能是一个无效的内存地址，如果在指针被初始化之前就引用它，结果将是段错误。\n\
    \n按地址传递时，指针会作为调用函数发送的地址的结果进行初始化：\n\n```\nexchangeValues(&x, &y);\n\nprintf(\"\
