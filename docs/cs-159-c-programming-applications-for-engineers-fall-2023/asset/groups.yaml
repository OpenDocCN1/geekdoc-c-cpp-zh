    \ Loop\n\n```\nwhile(loop control expression)\n{\n    //EXECUTABLE STATEMENT DESIGNATED\n\
    \    //FOR REPETITION – BODY OF THE LOOP\n}\n```\n\n> Note: There is no semicolon\
    \ after the loop control expression of the while statement, because the loop is\
    \ followed a body which contains the actions to repeat.\n\n## The do-while Loop\n\
    \nThe do-while construct is a post-test loop. Similar to the while a loop control\
    \ expression is used to determine if repetition continues, but as is the case\
    \ of a post-test construct the expression is evaluated after the initial execution\
    \ of the instructions inside of the body.\n\n- In contrast to the while loop,\
    \ the keyword while in a do-while is terminated with a semicolon.\n\n| Course\
    \ Standard: Indent all statements that compose the body of a loop two additional\
    \ spaces. | Course Standard: With all loops (and if statements) the braces that\
    \ mark the start and end of the loop body MUST be used. |\n|---|---|\n\n## Basic\
    \ Syntax of the Do While Loop\n\n```\ndo\n{\n    //EXECUTABLE STATEMENT DESIGNATED\n\
    \    //FOR REPETITION – BODY OF THE LOOP\n}while(loop control expression) ;\n\
    ```\n\n- What happens if the update of the loop control variable occurs in the\
    \ middle of body of the loop, will this change cause the loop to terminate immediately\
    \ at this point?\n  - No. The loop will only terminate when the loop control expression\
    \ is evaluated and found to be false.\n  - There is no \"mid-test\" loop in the\
    \ C programming language, only pretest and post-test.\n\n## Factorial Example\n\
    \n- The factorial problem will permit a demonstration of both the do-while with\
    \ input validation and the while to calculate the factorial.\n\n```\nint calcFactorial(int);\n\
    int getInput(void);\nvoid displayResults(int, int);\n```\n\n```\nint main(void)\n\
    {\n    int num;\n    int fact;\n\n    num = getInput();\n    fact = calcFactorial(num);\n\
    \    displayResults(num, fact);\n\n    return(0);\n}\n```\n\n```\nint calcFactorial(int\
    \ num)\n{\n    int nFact = 1;\n\n    while(num > 0)\n    {\n        nFact = nFact\
    \ * num;\n        num--;\n    }\n\n    return(nFact);\n}\n```\n\n## Is there reason\
    \ to be concerned that the value of zero may be multiplied?\n\n- No, the loop\
    \ control expression is evaluated and false prior to the multiplication of zero.\n\
    \nThe value entered by the user is stored locally in the variable num, how does\
    \ changing num on each iteration influence what is going on back in the calling\
    \ function?\n\n- No, the variable has been passed by value.\n\n```\nint getInput(void)\n\
    {\n    int num;\n    do\n    {\n        printf(\"Enter n to calculate n! -> \"\
    );\n        scanf(\"%d\", &num);\n        if(num < 0)\n        {\n           \
    \ printf(\"\\nError! Non-negative values only!!\\n\");\n        }\n    }while(num\
    \ < 0);\n    return(num);\n}\nvoid displayResults(int num, int fact)\n{\n    printf(\"\
    \\n%d! = %d\\n\", num, fact);\n}\n```\n\n## Why don't we use an \"if loop\" for\
    \ input validation?\n\n- An if construct would only permit the user a second opportunity\
    \ to enter acceptable data. We want the user to have an unlimited number of opportunities\
    \ to enter valid data.\n\n## What is wrong with the term \"if loop\"?\n\n- An\
    \ if is a selection construct and not a repetition construct.\n\n## Nested Loops\n\
    \n## What is a nested loop?\n\n- Nested loops, or any form of nested repetition,\
    \ is when one repetitive process is found inside of another.\n\n## How does that\
    \ definition help solve problems that make use of nested loops?\n\n- A better\
    \ definition would be to consider that a loop solves a repetitive process. A nested\
    \ loop would then be a repetitive process found inside of another repetitive process.\n\
    \n## What is the recommended approach to solving nested looping problems?\n\n\
    - First, solve and test the nested process placing it in its own user-defined\
    \ function.\n- Next, solve the process that will call the nested process. We must\
    \ ensure that the nested process is correct before we attempt to make use of (call)\
    \ it repeatedly.\n\nCalculating a Range of Factorials: Instead of calculating\
    \ a single factorial the user will specify a range of values and desires the output\
    \ of the factorial for all integers in the range.\n\nFor example, if the user\
    \ enters 2 and 5 then they want to see the result of 2!, 3!, 4!, and 5!.\n\n-\
    \ What are the two repetitive processes here? One is the calculation of a single\
    \ factorial and the other is counting from the starting value to the ending value.\n\
    - Which process is the nested process? The calculation of a single factorial.\
    \ We have already confirmed that we are able to accept an integer and calculate\
    \ the factorial of that number.\n- Next we need to add to the existing program\
    \ such that we can calculate each n! for all integers n in the range from a to\
    \ b.\n- New tasks or revisions needed:\n  - Get the start and end values and validate\
    \ both such that the end is not less than the start. Why is there a parameter\
    \ for getEnd but not for getStart?\n  - Calculate and print the factorial for\
    \ each integer between start and end (inclusive).\n\n```\nint calcFactorial(int);\
    \       //UNCHANGED FROM PREVIOUS EXAMPLE\nint getStart(void);\nint getEnd(int);\n\
    void displayResults(int, int);       //UNCHANGED FROM PREVIOUS EXAMPLE\n\nint\
    \ main(void)\n{\n    int fact;\n    int start;\n    int end;\n\n    start = getStart();\n\
    \    end = getEnd(start);\n\n    while (start <= end)\n    {\n        fact = calcFactorial(start);\n\
    \        displayResults(start, fact);\n        start++;\n    }\n\n    return(0);\n\
    }\n```\n\n- Course Standard Note: A limited amount of control structures (selection,\
    \ repetition) is permissible in the main function to ensure that it is the main\
    \ function which makes most of the function calls for the program.\n"
  mdcn: "\n\n示例：一个数的阶乘是从 1 到该数的所有整数的乘积。设计一个函数，给定一个非负整数，计算其阶乘。\n\n## 阶乘流程图：\n\n| 识别循环控制变量：\
