    # String Input/Output Functions


    Here is a point to ponder, if we want to load data into an array must we always
    input that data one element at a time until the array is filled? Would this imply
    that we have to enter one character at a time in order to input a string?


    +   * Good news! The answer is no! While we do not have a string data type available
    we do have many functions and features in the C programming language that allows
    us to operate with strings with some convenience.


    # The %s Placeholder


    +   * The %s placeholder represents a string and is used in both familiar input
    and output functions.


    Example of %s placeholder in action:


    ```

    char str1[SIZE];


    printf("Enter a string -> " );

    scanf("%s", str1); //NOTICE NO &, WHY IS THIS?!


    printf("The string you entered was %s.\n", str1);

    ```


    # Output of previous code segment


    Enter a string -> Purdue

    The string you entered was Purdue.


    +   * The scanf function only reads in the data up until a new line ( ''\n'' )
    or any white space is entered.


    Enter a string -> Go Purdue

    The string you entered was Go.


    # The solution? Find an alternative to scanf!


    ```

    printf("Enter a string -> " );

    gets(str1);


    printf("The string you entered was %s.\n", str1);

    ```


    What happens to the ''\n'' character entered by the user? The gets function will
    accept the input, terminated by a new line, and make a delimiter-terminated string
    out of it.'
  - "[PAGE 161]\n\n# Concerns with both `scanf` and `gets` functions:\n\n+   • The\
    \ compiler we are using this semester no longer remains silent regarding the potential\
    \ problems associated with the `gets` function. warning: the `gets' function is\
    \ dangerous and should not be used.\n\n# What makes `gets` (and for the same reason\
    \ `scanf`) “dangerous” and “should not used”?\n\n+   • Neither function will stop\
    \ accepting input when the character array has been filled to its defined capacity.\n\
    \n+   • Exceeding the defined capacity of the array will result in the same problems\
    \ associated with range checking issues.\n\n# Alternative (safer) approach to\
    \ input:\n\n```\nvoid getString(char x[])\n{\n    int index = 0;\n\n    printf(\"\
    Enter your string --> \");\n\n    do\n    {\n        x[index++] = getchar();\n\
    \    }while(index < SIZE && x[index - 1] != '\\n');\n\n    //REPLACE THE FINAL\
    \ CHARACTER WITH A DELIMITER CHARACTER\n    x[index - 1] = '\\0';\n}\n```\n\n\
    +   • The `getchar` function will accept the input of a single character.\n\n\
    +   • The do-while above will terminate the accepting of input **when the user\
    \ enters a new line character** or **when the defined size of the array has been\
    \ reached**.\n\n+   • Because the `getchar` function handles only individual character\
    \ input it does not place the delimiter character in the array, but it will place\
    \ the new line character (ASCII value 10) into the array, the delimiter must be\
    \ assigned to the array and will overwrite the new line character in the function\
    \ above.\n\n# String Manipulation Functions\n\nThe C programming language provides\
    \ us with an adequate set of string functions that can be found in the `string.h`\
    \ library. Functions we will consider include: `strcpy`, `strcmp`, `strlen`, and\
    \ we will come back later to see an example using `strstr`. Similar to `printf`\
    \ and `scanf` these functions will use the addresses represented by the names\
    \ of the arrays and the delimiters stored within to complete their tasks."
