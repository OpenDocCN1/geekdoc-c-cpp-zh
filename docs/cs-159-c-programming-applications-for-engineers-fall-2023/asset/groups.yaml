    # Selection Sort


    +   • Description of algorithm: Traverse the unsorted list to identify the smallest
    (or largest) value. Exchange this value with the value in the unsorted list that
    is adjacent to the sorted list. Repeat until the unsorted list is empty.'
  - '[PAGE 135]


    # Bubble Sort


    +   - Description of algorithm: Traverse the unsorted list and compare neighboring
    elements. Each time there is a pair of elements that are out of order, swap them.


    A pass constitutes comparing all neighboring elements in the unsorted list. In
    the selection sort on a single exchange was possible involving at most two elements,
    but in the bubble sort many swaps can occur on a single pass causing great change
    in the array.'
  - '[PAGE 136]


    # Insertion Sort


    +   - **Description of algorithm:** Compare the value in the unsorted list that
    is adjacent to the sorted list and determine where among the values in the sorted
    list it is to be inserted.


    The insertion sort is concerned with maintaining its sorted list in a sorted state.
    It is possible that a value once placed in the sorted list may move again on a
    future pass.'
