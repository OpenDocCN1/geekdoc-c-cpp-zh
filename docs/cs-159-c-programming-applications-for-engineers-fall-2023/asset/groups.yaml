    # Determining the Length of a String


    The first function from string.h to introduce is the strlen function which will
    return the number of characters in the string. This function does not count the
    terminal delimiter character, but the value returned does represent the location
    (index) of the delimiter in the array.


    ```

    char str1[SIZE];

    int length;


    getString(str1);

    length = strlen(str1);


    printf("Your string [length %d]: %s\n", length, str1);

    ```


    # Example Executions:


    | Enter your string -> Purdue

    Your string [length 6]: Purdue | Enter your string -> Go Purdue!!!

    Your string [length 13]: Go Purdue!!! |

    |---|---|


    # Copying Strings, it is easy to make a copy of a single variable, but how about
    strings? Can we use the assignment operator?


    ```

    char str1[SIZE];

    char str2[SIZE];


    getString(str1); //SEE USER-DEFINED FUNCTION ON PREVIOUS PAGE.


    str2 = str1;


    printf("The string you entered was %s.\n", str1);

    printf("The copy of the string you entered is %s.\n", str2);

    ```


    # What is the message generated by the compiler?


    +   - error: incompatible types when assigning to type ''char[150]'' from type
    ''char *''


    # What is REALLY being assigned in the expression str2 = str1 found in the example
    above?


    +   - The assignment is an attempt to force str2 to abandon the memory to which
    it was allocated and to refer to the same memory as str1. If this were possible
    there would still be only a single copy of the string in memory.'
