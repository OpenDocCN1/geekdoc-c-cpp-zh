    # Sorting Introduction


    Often data requires sorting in order to be processed efficiently. This is evident
    when one considers data such as medical records, student academic records, or
    banking records. Without sorting data by some common field (last name or identification
    numbers) it would be difficult to locate or access a desired record when the number
    of patients, students, or bank customers becomes large.


    Before we begin to look at the following simple sorting algorithms accept this
    disclaimer. The simplest sorting algorithms perform poorly. We introduce them
    to you as beginners because they are relatively easy to understand, write, test,
    and debug. Much more complex algorithms are often needed for good performance;
    such algorithms require data structures too complex for this course.


    # Exchanging Values


    +   Sorting may require values found to be out of order to be exchanged, or swapped,
    within the array. For example, exchange the two elements found at index 0 and
    index 3.


    | Incorrect Method of Exchanging Elements in an Array: | Correct Method of Exchanging
    Elements in an Array: |

    |---|---|

    | `int x[8] = {12, 17, 11, 9, 21, 13, 19, 16};` | |

    | Array: 12 17 11 9 21 13 19 16 (indices 0-7) | `temp = x[0];` (temp=12) |

    | `x[0] = x[3];` -> Array: 9 17 11 9 ... | `x[0] = x[3];` -> Array: 9 17 11 9
    |

    | `x[3] = x[0];` -> Array: 9 17 11 9 (Data loss) | `x[3] = temp;` -> Array: 9
    17 11 12 |


    There are a few common terms we need to introduce prior to explaining the sorting
    algorithms we will study this semester.


    +   - List - The array will be separated into the unsorted list and sorted list.
    The goal is each algorithm is to move data from the unsorted list to the sorted
    list.

    +   - Pass - The process of moving an element from the unsorted list to the sorted
    list. Several passes will be necessary to sort most data sets. [The final pass
    through the selection and bubble sorts will deviate from this general rule.]'
