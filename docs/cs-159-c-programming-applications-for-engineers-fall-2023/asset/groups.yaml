    ## 主内存


    - 计算机的内存将存储我们本学期将要编写的程序的**数据和指令**。


    - 你可能已经观察到，你个人机器上的主内存（RAM，8-16 GB）容量与二级内存（硬盘，1 TB 或更多）的大小相比相当小。


    - 因此，当前执行程序的每条指令或数据并不都能存储在主内存中，但当需要指令或数据时，必须从硬盘中**获取，或检索**，并加载到主内存中以供使用。


    - 类似于街道上房屋的地址，计算机内存中也有地址，指令和数据可以位于这些地址。


    - 在我们的程序中，我们将选择对程序员有意义的名称，而不是引用内存中的特定地址来表示和定位数据。


    ## 处理指令


    - CPU 使用称为指令周期的过程来执行指令。


    ## 指令周期图：


    | 为什么二级内存比主内存慢？ | 如果主内存更快，为什么不扩大这一层级的容量并消除二级内存？ |

    |---|---|

    | - 许多二级设备仍然具有移动或机械部件。<br>- 距离 CPU（或机器）的物理距离更远。<br>- 在高容量设备中定位特定内容所需的时间增加。 | -
    当前模式对消费者来说是一种经济模式。 |


    ## 自然语言与机器语言


    - 当我们描述希望解决的问题时，我们使用**自然语言**。


    - **自然语言**是口语，并随着其使用在几个世纪中演变。


    - **自然语言**充满了不适合计算机使用的属性。


    ## 编程语言的概念


    本学期，为了向计算机发出指令，我们将使用一种**编程语言**，具体来说，就是 C 编程语言。C 编程语言由来自自然语言的关键字组成，但使用时没有歧义。作为初学者，C
    编程语言的语法起初看起来会很陌生，但计算机完全无法读懂它！


    计算机有自己的语言，称为**机器语言**，它可以将其解释为特定于将执行任务的单个机器的指令。这种机器语言仅由 0 和 1 编写，因为计算机的内部电路由开关、晶体管和其他电子设备组成，这些设备可以处于两种状态之一：关闭
    (0) 或开启 (1)。


    程序员很快就意识到，用机器语言编码非常具有挑战性，而在机器语言中开发、调试和维护指令的整个过程并非大多数人乐于从事的事情。从机器语言向自然语言演变的过程一直在进行，并促成了今天的编程语言。


    ## 自然语言


    ![](img/50641bd70680c74d7c49fe705f0d8389_29_0.png)


    - **高级语言**

    - 使用更易于使用、理解和开发的自然语言元素。

    - 不依赖特定硬件。


    - **低级语言**

    - 专门为某台机器硬件编写的指令不能轻易在不同机器上使用。

    - 要求程序员以小的、渐进的步骤考虑算法。

    - 程序员需要承担管理内存的任务。


    ## 机器语言


    如果计算机的所有指令都由 0 和 1（二进制数）组成，计算机如何理解这些高级编程语言？


    ## 创建和运行程序


    要回答上一个问题，我们必须探索将 C 程序转换为可在本地机器上执行的文件的过程。


    ## 编程过程由开发过程中重复多次的步骤组成：


    ![](img/50641bd70680c74d7c49fe705f0d8389_29_1.png)


    ## 编写和编辑程序


    第一步是编写程序（实际上，第一步是开发你的解决方案，但我们此时描述的是解决方案的实现），这将需要使用一种称为文本编辑器的软件。本学期的首选文本编辑器是 vi（发音为
    vee-eye）。如果你坚持使用其他编辑器，那么你将承担理解其操作以及与我们服务器可能存在的任何兼容性问题的责任。我们发现使用 vi 编写代码非常强大。请理解
    vi 有一个学习曲线，但经过足够的练习，你也将能熟练使用 vi！


    ## 保存更改


    请务必牢记定期保存工作的重要性！过去有太多学生因为连接中断、计算机冻结或停电而丢失了大量未保存的工作，原因是他们在进展过程中未能保存工作。


    - 你也应该定期测试你的工作！很容易写出大量代码，然后才发现有很多错误，或者初始方向很差，以至于纠正所有问题比重新开始更困难！

    - 定期测试不应意味着你应该在编码时创建解决方案，但必须强调的是，当你编写代码时，它不应只是一个设计良好的算法的实现。如果没有规划，你的解决方案就归结为通过试错来开发，这往往是一个低效且令人沮丧的过程。

    - 对于给定的作业，可以进行多次提交。但是，只有最后一次提交会被保留用于评分。所有之前的提交都会被覆盖，无法恢复。


    > 在你的协作实验小组中，并且对于每个实验作业，你必须指定一名个人来代表小组进行所有提交。


    示例：假设我们正在实现一个问题的解决方案，并且在编码中已经进展到想要测试迄今输入内容的程度。


    接下来应该做什么？


    1. 保存工作，以确保包含我们 C 代码的源文件已存储并反映我们最近的更改。

    2. 将源文件发送到编译器，以便其中的指令可以准备由计算机执行。


    ## 编译器


    编译器是一类用于将源编程语言代码转换为计算机机器语言的软件。


    ## 语法


    语法是编程语言的一组规则。编译器将尝试使用 C 编程语言的语法验证你的源代码，同时创建一个新的可执行文件。


    违反语法规则可能会导致无法创建新的可执行文件的错误。


    编译过程中有一个特别引起我们兴趣的阶段：


    - **预处理器** - 读取源代码并为翻译器做准备。有称为**预处理器指令**的特殊指令，你可以将其提供给预处理器，以便为翻译准备源代码。


    在我们的服务器上，编译过程的所有步骤都通过一条指令完成，这使得许多步骤对程序员来说是透明的。


    ## 实现代码的过程


    ## 程序执行（测试/运行可执行文件）


    编译成功后将创建一个可执行文件。默认情况下，此可执行文件的名称为 `a.out`。要执行或运行程序，只需在 UNIX 提示符下键入 `a.out`。假设测试程序时，你位于与
    `a.out` 文件相同的目录中。


    每次修改源文件时，你都必须重新编译代码并创建一个新的 `a.out`，以查看源代码中反映的更改。新的可执行文件将替换任何先前存在的文件。在大多数情况下，不希望保留旧的可执行文件。


    - 如果你的程序编译失败，将不会创建新的可执行文件。

    - 编译尝试失败可能不会导致现有的 `a.out` 文件被删除。


    ## 程序开发


    我们在 CS 159 中的目标：能够以逻辑算法的形式开发解决方案作为问题的解决方案，而无需考虑你可能使用的编程语言的任何特定语法。


    接触良好的编程实践对于介绍设计“产生正确结果、设计良好、高效且遵循课程文档和编程标准的程序”所需的方法非常重要。


    '
