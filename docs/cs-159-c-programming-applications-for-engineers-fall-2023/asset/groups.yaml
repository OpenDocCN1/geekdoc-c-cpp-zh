    ## 结构化程序设计 – 它是什么？


    - 结构化程序设计中有三个基本思想：选择、重复和序列。

    - **序列**是第 4 章（用户定义函数）的主题。使用函数允许程序的各个指令按除第一条语句到最后一条语句以外的顺序执行，有些语句可能会被执行多次。

    - **选择**是第 5 章的主题。选择结构允许根据给定条件执行某些指令，而排除其他指令。这是学期中第一个点，在此点程序中的代码可能不会在每个测试用例中全部执行。

    - **重复**是第 6 章的主题。通常，当满足特定条件或直到满足条件时，需要重复执行一组指令。重复结构允许使用逻辑来指定条件并识别要重复的指令。


    ## 第 5 章 – 选择


    函数允许我们编写模块化代码并在函数之间转移控制（改变执行的代码**序列**）以完成各个任务，而我们接下来需要的是**选择**和**重复**代码的能力。**选择**正是第
    5 章的主题。


    到目前为止，在课程中，我们始终观察到程序中的所有语句至少被执行一次。


    - 虽然用户定义的函数允许我们在此阶段改变序列，但当我们进行函数调用时，该函数中的所有代码都会被执行。

    - 选择的概念涉及根据条件选择要执行或排除的代码。


    ## 逻辑数据


    如果一段数据传递 true 或 false 的值，则称为**逻辑**数据。逻辑数据由**逻辑表达式**生成。逻辑表达式用于选择和重复结构中。C 语言传统上没有专门用于逻辑数据的数据类型，而是使用数值类型来表示
    true 和 false。


    > 注：我们通常使用 1 表示 true 值，但是，任何非零值都被视为 true。


    ## 逻辑运算符


    主要有三个逻辑运算符。逻辑运算符的操作数根据其逻辑状态（true 或 false）进行考虑。


    | 运算符 | 字符 | 描述 | 优先级 |

    | --- | --- | --- | --- |

    | NOT | ! | 一元运算符，将 true 值改为 false，将 false 值改为 true。 | |

    | AND | && | 二元运算符，仅当两个操作数都为 true 时为 true，其他所有情况为 false。 | |

    | OR | || | 二元运算符，仅当两个操作数都为 false 时为 false，其他所有情况为 true。 | |


    ## 逻辑运算符真值表：


    | | 非 | | | 与 | | | 或 | | |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | x | !x | x | y | x && y | x | y | x || y |

    | 真 | | 真 | 真 | | 真 | 真 | |

    | | | 真 | 假 | | 真 | 假 | |

    | 假 | | 假 | 真 | | 假 | 真 | |

    | | | 假 | 假 | | 假 | 假 | |


    ## 求值逻辑表达式


    - 即，求值包含逻辑运算符的表达式。

    - 求值数学表达式时，不考虑每个运算符的情况极为罕见。

    - 如何在求值表达式的每个运算符之前对表达式求值？对于逻辑表达式，只有两种可能的结果，我们将看到，当表达式的结果可以确定时，求值将停止，或短路，在不需要求值每个运算符时提前停止。


