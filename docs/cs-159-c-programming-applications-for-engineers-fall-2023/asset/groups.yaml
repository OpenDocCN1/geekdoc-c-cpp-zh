    # Structured Programming – What is it?


    +   - There are three fundamental ideas in structured programming; selection,
    repetition, and sequence.

    +   - **Sequence** was the topic of chapter 4 (user-defined functions). The use
    of functions permit the individual instructions of a program to be executed in
    an order other than first statement to the last statement and some statements
    may be executed more than once.

    +   - **Selection** is the topic of chapter 5. Selection constructs will allow
    instructions to be executed based on a given criteria and other instructions to
    be excluded. This is the first point in the semester where not all code in a program
    may be executed in each test case.

    +   - **Repetition** is the topic of chapter 6. Often a set of instructions needs
    to be repeated while a particular condition is met, or until a condition is met.
    Repetition constructs allow the use of logic to specify conditions and to identify
    those instructions to repeat.


    # Chapter 5 – Selection


    While functions permit us to make modular code and shift control (alter **sequence**
    of code executed) between functions to accomplish individual tasks, what we need
    next are the abilities to **select** and **repeat** code. It is **selection**
    that is the topic of chapter 5.


    Up to this point in the course we have always observed all statements in a program
    being executed at least one time.


    +   - While user-defined functions allow us to alter the sequence at this point
    in the course when we make a function call all of the code in that function is
    executed.

    +   - The idea of selection involves selecting code to execute or exclude based
    on a condition.


    # Logical Data


    A piece of data is called **logical** if it conveys the value of true or false.
    Logical data is generated by a **logical expression**. Logical expressions are
    utilized in both selection and repetition constructs. The C programming language
    did not traditionally have a data type specifically for logical data and instead
    would utilize a numeric type to represent true and false.


    > Note: We often use 1 to represent a true value, however, ANY non-zero value
    is considered true.'
