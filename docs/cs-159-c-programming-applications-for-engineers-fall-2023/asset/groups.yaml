    # Summary Thoughts


    **How many passes are required to guarantee an array of N elements is sorted?**


    * N-1 passes would be necessary to complete the task of sorting.


    **Why is it possible for an array to reach a sorted state prior to the required
    number of passes to guarantee sorting?**


    * The initial status of the data was such that fewer than N-1 sort passes were
    needed to complete the task.


    **Are these sorting algorithms optimized to end when the data reaches a sorted
