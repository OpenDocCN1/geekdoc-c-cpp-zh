    # Assignment Conversions:


    +   - This type of conversion occurs when the data type of the expression on the
    right-hand side of an assignment expression does not match the data type of the
    variable on the left-hand side of the assignment operator.

    +   - The result of the expression on the right-hand side of the assignment expression
    will be converted to match that of the variable on the left-hand side. Such a
    conversion has the potential to be unsafe.


    # Example - rounding and truncation


    ```

    int a = 3;

    int c = 1;

    float x = 3.99;

    float y = 2.29;

    float z = 8;


    printf("The value of z is %f\n", z);


    c = x; //ASSIGNING A FLOAT TO AN INT - ASSIGNMENT CONVERSION


    printf("The value of c is %d\n", c);


    printf("The value of x is %.1f and y is %.1f\n", x, y);


    printf("Using mixed up placeholders: \n");

    printf("x is %d and a is %f\n", x, a);


    printf("Using a cast to fix placeholders: \n");

    printf("x is %d and a is %f\n", (int)x, (float)a);

    ```


    Note: The warning issued as a result of incorrect conversion codes is an indication
    of another undefined behavior. How the values displayed are determined is based
    on the individual processor.


    Reminder: An explicit type conversion applied to a variable WILL NOT alter the
    variable''s data type for the remainder of a program. You can consider the type
    conversion is applied AFTER the data value for a variable has been retrieved from
    its allocated memory.


    # How the value of variables are changed:


    +   - The assignment operator has the ability to alter the value of a variable.
    Similarly, the compound assignment operations can change what is stored in the
    memory assigned to a variable.

    +   - The use of the address operator in a scanf function call will change what
    a variable is storing in memory.

    +   - Prefix and post-fix increment and decrement will make a change to the value
    of a variable. The particular operator used will determine when this change will
    take place.'
