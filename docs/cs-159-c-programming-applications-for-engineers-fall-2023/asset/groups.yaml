    \ to submission.\n- Compiler warnings will result in a loss of points and should\
    \ be remedied prior to submission of your final effort.\n\n## Course Tools and\
    \ Technologies for Developing Code\n\n1. We DO NOT encourage that you develop,\
    \ compile, or to test your code in ANY editor or compiler other than those found\
    \ within Vocareum. Not all C programming language compilers are fully compatible.\
    \ You should want to test your work under the same conditions that it will be\
