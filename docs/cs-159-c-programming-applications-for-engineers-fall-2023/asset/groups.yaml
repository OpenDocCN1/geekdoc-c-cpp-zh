  mdcn: "\n\n## 结构图\n\n- 大型程序是由许多相互关联的部分组成的复杂结构，必须经过精心设计。\n- 结构图展示了我们将如何将较大的问题分解为逻辑子问题，以及数据将如何在这些模块之间流动。\n\
    \n## 流程图\n\n- 流程图的目的是以可视化方式描述单个函数（较大问题的较小任务）的逻辑。\n- 应该为结构图中识别的每个子问题开发一个流程图。\n\n\
    在规划上投入的每一步都将帮助您消除日后解决起来往往非常耗时的逻辑错误。\n\n问题：给定贷款金额、年利率和贷款期限（年），确定每月还款额。\n\n## 步骤\
    \ #1 – 程序指定了什么？\n\n- 输入 – 三个值。贷款金额、年利率和期限。输出 – 每月还款额。\n\n## 步骤 #2 – 分析问题\n\n-\
    \ 我们需要哪种数学运算？\n\n| 变量 | 描述 | 表达式 |\n|---|---|---|\n| years | 贷款期限（年）。 | Input\
    \ by user |\n| numMonths | 贷款的月数。 | years * 12 |\n| annualRate | 贷款的年利率（百分比）。\
    \ | Input by user |\n| monthRate | 月利率（小数）。 | (annualRate / 12) / 100 |\n| loanAmount\
    \ | 要借款的总金额。 | Input by user |\n| P | | pow((1 + monthRate), numMonths) |\n| Q\
    \ | | (P / (P - 1)) |\n| monthPayment | 每月还款额。 | loanAmount * monthRate * Q |\n\
    \n## 步骤 #3 – 设计软件解决方案\n\n- 在这里，我们考虑为解决问题而必须实现的单个步骤或指令。\n\n## 流程图符号/指令类型\n\n| Symbol\
    \ | Description | Symbol | Description |\n|---|---|---|---|\n| | 终止符 - 算法的开始和结束<br><br>**课程标准：**\
    \ 本课程仅允许一个起点和终点（终止符）。所有其他实现均违反标准。 | | 条件语句<br><br>• 始终标记您的真路径和假路径！ |\n| | 赋值语句\
    \ / 表达式<br><br>• 包含函数调用！ | | 重复结构<br><br>• 始终标记您的真路径和假路径！ |\n| | 指定用于输入和/或输出的数据<br><br>•\
    \ 不必担心宽度修饰符和转换代码。 | | 连接符<br><br>• 因为纸张在任何维度上都不是无限的。 |\n\n## 首先处理输入：\n\n![](img/50641bd70680c74d7c49fe705f0d8389_34_0.png)\n\
    \n您会注意到，在 C 语言教材中，接受（读取）输入时没有描述性提示。如果不明显，最好在 I/O 符号中至少引用变量名。\n\n- 流程图绘制在 C 语言教材的附录\
    \ C 中进行讨论。使用的符号可能适用于任何编程语言。\n\n## 继续进行计算并以输出结束：\n\n![](img/50641bd70680c74d7c49fe705f0d8389_34_1.png)\n\
    \n## 继续编写、保存、编译、测试、修订...\n\n- 测试。除了所有作业中提供的示例执行外，您或您的小组（针对实验作业）还应考虑创建其他测试用例，以验证解决方案的正确性和效率。\n\
    - 改进是问题解决过程中的一个重要但常被忽视的步骤。您的第一个解决方案并不总是最好的，对算法的进一步改进可能会提高程序的效率并消除任何先前未观察到的错误。\n\
    \n## 第 2 章 – C 语言简介\n\n### C 程序的结构\n\n预处理器的特殊指令，告诉它如何为编译准备您的程序。\n\n声明对程序所有部分可见（可用）的“对象”。\n\
    \n**课程标准：** 变量**绝不**可作为全局变量。\n\n最后一部分代表函数。C 程序由一个或多个函数组成，其中一个必须命名为 `main`。\n\n\
    **课程标准：** 函数的两个部分**绝不**得重叠！\n\n其他函数将在第 4 章中介绍。\n\n### 我们的第一个程序\n\n| #include<stdio.h><br>int\
    \ main(void)<br>{<br>\\tprintf(\"Hello World!\\\\n\");<br>\\treturn(0);<br>} |\
    \ 不要将 stdio 与 studio 混淆！ |\n\n### 对上述程序的分析\n\n### 预处理器指令部分\n\n- 唯一的预处理器指令语句是 #include<stdio.h>\n\
    - 此特定语句请求包含一个标准库（stdio.h），以允许在程序中使用标准输入/输出函数（例如 printf）。\n- stdio.h 库将出现在您本学期编写的所有\
    \ C 程序中。其他库，例如 math.h、stdlib.h、ctype.h 和 string.h 将在本学期介绍。有关库和可用函数的列表，请参见 C 语言教材的附录\
    \ F。\n\n### 全局声明部分\n\n- 此程序中没有全局声明。\n- 您的程序中**绝不会**有全局变量声明。\n- main 函数不需要声明，并且由于没有其他用户定义的函数，此部分保持空白。\n\
    \n> **请务必记住：** 声明部分和执行部分**绝不**得重叠！您必须在可执行语句开始之前完成所有声明。\n\n### 函数部分\n\n- 此程序中只有一个函数，该函数名为\
    \ main。\n- main 函数是程序开始（和结束）执行的地方。\n- 每个函数都有两个不同的部分：\n  1. 局部定义部分 – 建立当前函数的数据需求。\n\
    \  2. 语句（执行）部分 – 完成函数任务的逻辑。\n\n`main` 函数中只有两条可执行语句。第一条语句将在显示器上打印引号中的消息。\n\n- 引号内包含的一个特殊字符\
    \ \\n 将打印一个新行（类似于键盘上按下回车键）。\n- 另一个特殊字符（本示例未使用）\\t 用于显示制表符，但由于制表符的解释方式不同，最好避免使用它们以保持输出的一致外观。\n\
    \n第二条语句是 `return(0);`，该语句表示程序控制权从 `main` 函数返回到操作系统，终止程序。本学期稍后我们将看到 `return` 语句如何用于将程序控制权（带或不带值）从一个用户定义的函数返回到另一个函数。\n\
    \n### 来自我们第一个程序的更多观察\n\n| `#include<stdio.h>`<br>`int main(void)`<br>`{`<br>`\
    \ printf(\"Hello World!\\\\n\");`<br>` return(0);`<br>`}` | **课程标准：** { 和 } 之间的所有语句均缩进两个空格。\
    \ |\n\n1. 注意 { 和 } 的用法，它们指示 `main` 函数的开始 { 和结束 }。任何带有主体（花括号之间的内容）的 C 结构都不会以分号结束。\n\
    2. 大多数其他 C 语句（和声明）将以分号结束。上述规则通常成立，但总会有例外！\n\n**注释：** 可以合理地期望一名优秀的程序员能够阅读他人编写的代码，但在逻辑复杂的片段中，代码的含义（和/或编码者的思考过程）有时并不明显。如果编写代码的人添加详细注释来帮助阅读者（可能是评分者、导师、同学或同事），那将很有帮助。**注释**是内部文档，编译器会忽略它们，旨在供源代码的其他查看者阅读。\n\
    \n像许多其他语言一样，C 编程语言提供两种注释方法：\n\n1. 单行注释\n2. 多行注释\n\n**单行注释**仅从注释开始延伸到当前行的末尾。单行注释以\
    \ `//` 开头，之后的文本在当前行剩余部分中被忽略。\n\n```\naverage = sum / numberStudents; //CALCULATING\
    \ THE EXAM AVERAGE\n```\n\n"
