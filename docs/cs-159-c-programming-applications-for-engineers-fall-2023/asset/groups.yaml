    \n- 逻辑错误是一种运行时错误，由 **程序员负责** 在程序逻辑中实现缺陷。\n\n## 调试\n\n- 解决错误的过程称为调试。整个学期我们将探讨调试错误的各种方法，包括：\n\
    \  - 将 **诊断打印语句** 插入到代码中，以验证程序执行过程中特定时间点的预期值。\n  - 编写完成你正在解决的较大问题中的子任务的小代码段。\n\
    \  - 开发代表各种预期输入的测试用例。\n\n## 第 3 章 – C 程序结构\n\n## 表达式\n\n在 C 编程语言中，表达式始终归约为一个单一值。\n\
    \n### 表达式术语回顾：\n\n- **运算符** - \"需要采取操作的特定于语言的语法标记。\" 例如：`+`、`-`、`*`、`/` 以及一些可能对你来说是新的其他运算符。如果你能从上面的定义中记住一件事，请关注\
    \ \"特定于语言\"，因为在 C 编程语言中，运算符及其含义可能与你在数学或其他编程语言（例如 MATLAB、Python、Excel）中看到的不同。\n\
    \n- **操作数** - \"接收运算符操作的值。\" 换句话说，就是被运算符操作的值。根据运算符的不同，评估该操作可能需要一个、两个或多个操作数。\n\n\
    你应该以某种形式熟悉的另一个概念是运算符 **优先级**。运算符的优先级决定 (1) 操作数属于哪个运算符，以及 (2) 它在表达式中被评估的顺序。教科书的封面内侧列出了\
    \ C 语言的 **优先级顺序**。\n\n### 打印表达式求值：\n\n| 代码 |\n|------|\n| `int a = 17; //FIRST\
    \ OPERAND`<br>`int b = 5; //SECOND OPERAND`<br><br>`printf( \"%d + %d = %d\\\\\
    n\", a, b, a + b );`<br><br>`printf( \"%d / %d = %d\\\\n\", a, b, a / b );`<br><br>`printf(\
