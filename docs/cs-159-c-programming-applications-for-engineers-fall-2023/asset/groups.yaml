    \ expression.\n- loop update - An executable statement found inside the body of\
    \ the loop that when executed a sufficient number of times will lead to a change\
    \ in the evaluation of the loop control expression.\n- loop control variable -\
    \ The variable that is initialized, part of the loop control expression, and the\
    \ recipient of the update action.\n\n## Repetition Flowchart Example #1:\n\nWrite\
    \ an algorithm to calculate the average, maximum, and minimum of an unknown number\
    \ of exam scores. The scores on the test can range from 0 – 100 and will all be\
    \ integer values.\n\n### Repetition\n\n- To complete this problem we need the\
    \ ability to repeat a number of instructions.\n- Repetition permits us to identify\
    \ a segment of code to be repeated while a given logical expression is true.\n\
    \n### Step #1 – What is specified of the program?\n\n- Input – Integers between\
    \ 0 and 100, inclusive of the end points, until a value is entered to signify\
    \ the end of input.\n  - We do not need an array (subject of chapter 8) to store\
    \ the entire data set in the memory of the computer. The memory necessary to solve\
    \ this problem will not be dependent on the size of the data set (number of students\
    \ taking the exam).\n- Output – Average (floating-point), maximum (integer), and\
    \ minimum (integer) values.\n\n### Step #2 – Analyze the problem\n\n- **What formulas\
    \ are needed?** To calculate the average we need to know the sum of all scores\
    \ and the number of scores. We will have to compare values as they are entered\
    \ to determine their status as the maximum or minimum value.\n- We also need to\
    \ determine how the user will indicate that the input has ended.\n\n**How to approach\
    \ the terminating input condition?**\n\n- 1. Ask the user to count the exams.\n\
    - 2. Ask the user to input after each value whether they have more scores to enter.\n\
    - 3. Ask the user to input a value outside of the range of exam scores when done.\n\
    \n### Structure Chart for Solution:\n\n### Step #3 – The Software Solution\n\n\
    ## Pretest and Post-test Looping Constructs\n\nIn a **pretest** loop, the loop\
    \ control expression must be true prior to iterating the loop even one time. Prior\
    \ to the start of each iteration, including the first, the loop control expression\
    \ is evaluated and while that expression remains true the repetition continues.\
    \ If the loop control expression is false then no further iterations will be conducted.\n\
    \n**Key Point:** The minimum number of times the body of a pretest loop will be\
    \ iterated is **zero**. If the expression is never true, then the loop instructions\
    \ (body of the loop) will **never be executed**.\n\nIn a **post-test** loop the\
    \ instructions of the body of the loop will be executed prior to the evaluation\
    \ of the loop control expression. The loop control expression will be evaluated\
    \ at the end of each iteration to determine whether or not to continue with another\
    \ iteration.\n\n- **What is the big difference?** The minimum number of times\
    \ the body of a post-test loop will be iterated is one. Regardless if the expression\
    \ is false the loop will iterate once and then test the condition to determine\
    \ whether iteration continues.\n\n## Selecting the Wrong Construct\n\nWhat signs\
    \ might indicate that you selected the wrong type of loop, pretest or post-test,\
    \ for a solution? (1) Logic repeated both inside and outside of the body of the\
    \ loop. (2) A \"trick\" is used to force the loop to iterate at least one time.\
    \ These options might look familiar if you have worked with a language in which\
    \ both pretest and post-test options are not available (MATLAB).\n"
