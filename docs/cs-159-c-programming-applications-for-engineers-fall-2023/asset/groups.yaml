    There are only two executable statements in the `main` function. The first statement
    will print the message in quotes on the monitor.


    +   - One special character \n included inside of the quotes will print a new
    line (similar to hitting the enter key on your keyboard).

    +   - Another special character (not used in this example) \t is used to display
    a tab, but because tabs are interpreted differently it is best to avoid their
    use for a consistent appearance of your output.


    The second statement is `return(0);`, this statement indicates that control of
    the program returns from the `main` function to the operating system, terminating
    the program. Later this semester we will see how the `return` statement is used
    to return control of the program, with or without a value, from one user-defined
    function to another.


    # More Observations from Our First Program


    | `#include<stdio.h>`<br>`int main(void)`<br>`{`<br>` printf("Hello World!\\n");`<br>`
    return(0);`<br>`}` | **Course Standard:** All statements between the { and } are
    indented two spaces. |


    +   1. Notice the use of { and } that indicate the beginning { and end } of the
    `main` function. Any C structure that has a body, the contents between the curly
    braces, will not terminate with a semicolon.

    +   2. Most other C statements (and declarations) will terminate with a semicolon.
    The rules above usually hold true but there will always be exceptions!


    **Commenting:** It is reasonable to expect that a good programmer would be able
    to read code written by another, but sometimes the meaning of the code (and/or
    the thought-process of the coder) is not obvious in a logically complex segment.
    It is helpful if the person who wrote the code adds detailed notes to assist the
    reader who might be a grader, tutor, fellow student, or a colleague. **Comments**
    are internal documentation which are ignored by the compiler and are intended
    to be read by another viewer of the source code.


    The C programming language, like many other languages, provides two methods of
    commenting:


    +   1. Single-line comments

    +   2. Multiple-line comments


    **Single-line comments** only span from the start of the comment to the end of
    the current line. A single-line comment begins with `//` and the text that follows
    is ignored for the remainder of the current line.


