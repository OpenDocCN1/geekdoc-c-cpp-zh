    # Event-Controlled and Counter-Controlled Processes


    The factorial problem from the previous page is an example of a counter-controlled
    process. The counter, which is also the loop control variable, controls the number
    of times the body of the loop is to be repeated.


    In an event-controlled process, an event takes place that changes the loop control
    expression from true to false and bringing the repetition to a halt. With such
    a process one can determine whether another iteration of the loop will take place
    but determining the number of remaining iterations is not possible. The exam statistics
    problem is an example of an event-controlled process. If you know the most recent
    input then you know if there will be another iteration, but nothing more.


    Key Point: If you can count or calculate the total number of iterations that will
    take place during the execution of a loop, then it is a counter-controlled process,
    otherwise the process is event-controlled.


