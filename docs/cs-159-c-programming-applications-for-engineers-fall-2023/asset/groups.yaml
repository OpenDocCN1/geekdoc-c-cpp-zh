    \ | int a[5] = {2, 4, 5, 3, 1}; |\n| --- | --- |\n| `int a[5] = {2, 4, 5, 3, 1};`\
    \ `printf(\"Address of array a = %p\\n\", a);` `printf(\"Address of array a[0]\
    \ = %p\\n\", &a[0]);` | [2] [4] [5] [3] [1] a &a[0] |\n\n在以下示例中，指针表示法用于声明和定义的第一行。一旦进入函数，指针变量可以表现得像数组一样。\n\
    \n| `#define SIZE 5` `void printArray(int*);` `int main(void)` `{` ` int x[SIZE]\
    \ = {3, 5, 7, 9, 10};` ` printf(\"Array x address: %p\\n\", x);` ` printArray(x);`\
    \ ` return(0);` `}` | `void printArray(int *y)` `{` ` int i;` ` printf(\"Array\
    \ y address: %p\\n\", y);` ` for(i = 0; i < SIZE; i++)` ` {` ` printf(\"y[%d]\
    \ = %d\\n\", i, y[i]);` ` }` `}` |\n\n关于示例中显示的两个内存地址，哪些是正确的？\n\n### 指针运算与数组（仅限一维数组）\n\
    \n- 当你尝试将整数加到地址时会发生什么？结果是另一个地址，这种运算可用于访问和更改数组元素。\n\n```\n#define SIZE 5\n\nvoid\
    \ printArray(int*);\nvoid changeArray(int*);\n\nint main(void)\n{\n   int x[SIZE]\
    \ = {3, 5, 7, 9, 10};\n\n   changeArray(x);\n   printArray(x);\n\n   return(0);\n\
    }\n```\n\n```\nvoid changeArray(int *y)\n{\n   int i;\n   int temp;\n\n   temp\
    \ = *y;\n\n   for(i = 1; i < SIZE; i++)\n   {\n      *(y + i - 1) = *(y + i);\n\
    \   }\n\n   *(y + i - 1) = temp;\n}\n```\n\n```\nvoid printArray(int *y)\n{\n\
    \   int i;\n\n   for(i = 0; i < SIZE; i++)\n   {\n      printf(\"y[%d] = %d\\\
    n\", i, *(y + i));\n   }\n}\n```\n\n生成的输出：\ny[0] = 5\ny[1] = 7\ny[2] = 9\ny[3]\
    \ = 10\ny[4] = 3\n\n| 2 | 4 | 5 | 3 | 1 |\n| --- | --- | --- | --- | --- |\n|\
    \ a[0] | a[1] | a[2] | a[3] | a[4] |\n| *(a+0) | *(a+1) | *(a+2) | *(a+3) | *(a+4)\
    \ |\n\n将间接运算符（*）应用于起始内存地址与整数的和，会产生该整数索引处的元素。\n\na[x] == *(a + x)\n\n### 想要地址吗？\n\
    \n与索引值一样，添加到 `a` 的值表示从 `a` 所代表的内存地址值的偏移量。加法会产生一个新的内存地址。不同的数据类型是否需要不同的内存量？是的，但向指针加\
    \ 1 会根据数组的类型推进到数组中的下一个元素。在我们服务器上的整数数据中，加 1 将是四个字节的增量。\n\n```\nvoid printArray(int*);\n\
    \nint main(void)\n{\n   int a[5] = { 2, 4, 5, 3, 1};\n\n   printf(\"Array a address:\
    \ %p\\n\", a);\n\n   printArray(a);\n\n   return(0);\n}\n```\n\n![](img/50641bd70680c74d7c49fe705f0d8389_156_0.png)\n\
    \n```\nvoid printArray(int *y)\n{\n   int i;\n\n   printf(\"Array y address: %p\\\
    n\", y);\n\n   for(i = 0; i < 5; i++)\n   {\n      printf(\"&y[%d] = %p\\n\",\
    \ i, y + i);\n   }\n}\n```\n\n生成的输出：\nArray a address: 0x7ffd003f7680\nArray y\
    \ address: 0x7ffd003f7680\n&y[0] = 0x7ffd003f7680\n&y[1] = 0x7ffd003f7684\n&y[2]\
    \ = 0x7ffd003f7688\n&y[3] = 0x7ffd003f768c\n&y[4] = 0x7ffd003f7690\n\n### 内存分配函数\n\
    \n在程序编译之前声明数组的容量有几种你可能已经考虑过的局限性。首先，我们可能为问题预留的内存不够。其次，我们可能预留了太多内存，限制了留给其他数据的内存。我们进入动态内存分配的探索将提高我们请求问题所需精确内存的能力。\n\
    \n要动态分配内存，我们将使用一个名为 malloc 的预定义函数，它位于 stdlib.h 库中。\n\n- malloc（内存分配）函数将分配指定数量的字节内存。必须使用指针变量来引用\
