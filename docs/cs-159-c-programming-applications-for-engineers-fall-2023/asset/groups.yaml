    \ p 指向的地址，接下来我们需要一种方法来访问该内存位置存储的值。在指针变量前放置的**间接运算符（*）**将允许访问指针引用的位置存储的值。\n\n|\
    \ int a = -123; int *p; p = &a; //p POINTS TO a printf(\"The value of a is: %d\\\
    n\", a); printf(\"The value to which p references is: %d\\n\", *p); | The value\
