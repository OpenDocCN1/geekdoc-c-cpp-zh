    \  - 运算符优先级表和 ASCII 表已提供在本试卷的最后一页。\n\n- 3. 考试期间不回答任何问题。由于在场工作人员有限，我们不会在考试期间回答问题。为我们来说，补救一道有误的试题比回答问题或在考试期间有效发布公告更容易。请相应安排你的时间！\n\
    \n- 4. 你必须假设所有 C 程序和代码片段均在 Vocareum 上实现，并将使用 `gcc` 编译器编译。当仅展示代码片段时，你可以假设适当的包含语句已存在，且代码位于一个完全可运行的函数或程序内部。\n\
