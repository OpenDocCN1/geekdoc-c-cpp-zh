  mdcn: "\n\n## 基本函数术语\n\n在所有编写良好的程序背后都有相同的基本组件，即函数。函数将是先前描述的单个子任务的实现，并包含其解决方案。什么是函数？根据\
    \ Gilberg 和 Forouzan 的教材，“一个在程序中执行过程的命名代码块；一个由头部、函数名和主体组成的可执行代码单元，旨在在程序中执行任务。”\n\
    \n- 当请求函数的服务时，必须调用它。发起调用的函数称为调用函数，被调用的函数称为被调用函数。\n- 在调用函数和被调用函数之间交换数据是常见的。\n \
    \ - 向函数发送（传递）数据的行为称为参数传递。\n  - 函数可能会完成计算并希望将结果与调用函数共享。我们将此称为从函数返回一个值。\n- 在 C 编程语言中，函数最多只能返回一个值。\n\
    \n```c\n#include<stdio.h>\nvoid greeting(void); // FUNCTION DECLARATION\nint main(void)\n\
    {\n    // LOCAL DECLARATIONS - NONE\n    // EXECUTABLE STATEMENTS\n    greeting();\
    \ // FUNCTION CALL\n    return (0);\n}\n\n// FUNCTION DEFINITION\nvoid greeting(void)\n\
    {\n    // LOCAL DECLARATIONS - NONE\n    // EXECUTABLE STATEMENTS\n    printf(\"\
    Hello World!\\n\");\n    return;\n}\n```\n\n在上述示例中，我们观察到 main 函数包含两条语句，一条语句是调用名为\
    \ greeting 的函数，第二条语句是终止返回 return (0); 语句。当 main 调用函数 greeting 时，程序控制权离开 main。函数\
    \ greeting 将执行其两条语句，将 Hello World! 打印到显示器上，然后将程序控制权返回给调用函数 main。main 函数将在函数调用后从中断处继续执行，在此例中，main\
    \ 的下一条语句将是终止返回 return (0) 语句。\n\n- 当调用函数时，程序中指令执行的顺序现在会从 main 跳转到 greeting。\n\
    - 会“记住”在 main 中进行函数调用的位置，以便当被调用函数（greeting）终止时，main 中语句的执行将继续执行函数调用之后的语句。\n\n\
    ## 用户定义的函数\n\n与变量一样，函数必须同时进行声明和定义。\n\n| | |\n|---|---|\n| 函数声明将出现在程序的全局声明部分。 |\
    \ 编译器在寻找什么？ |\n| 函数声明语句将告诉编译器：<br>(1) 从函数返回的值的类型。<br>(2) 函数的名称。<br>(3) 发送到函数的数据。参数的数量、参数的类型和参数的顺序由函数的声明确定。\
    \ | • 用户定义函数的三个组件（声明、定义和调用）保持一致。 |\n| 函数定义包含完成任务所需的代码。 | 当找不到定义时生成什么错误？<br>undefined\
    \ reference |\n| | 当找不到声明时生成什么错误？<br>warning: implicit declaration of function\
    \ |\n\n## 基本函数设计\n\n| | 有参数 | 无参数 |\n|---|---|---|\n| 有返回值 | 带参数且返回值的函数。 | 不带参数但返回值的函数。\
    \ |\n| 无返回值 | 带参数但不返回值的函数。 | 不带参数也不返回值的函数。 |\n\nvoid 函数中“void”是什么意思？\n• 这样的函数不返回值。\n\
    \n## 用数据类型来描述函数是什么意思？\n\n- 用数据类型描述函数是指它返回的值的类型。\n\n## 无参数且无返回值的函数\n\n- greeting\
    \ 函数是 void 函数的一个示例，适用于处理不需要返回值的任务。\n\n```c\n#include<stdio.h>\n\nvoid welcome(void);\
    \ // FUNCTION DECLARATION\n\nint main(void)\n{\n    welcome(); // FUNCTION CALL\n\
    \n    return(0);\n}\n```\n\n```\n/********************************************************************************\n\
    *                                                                       *\n* \
    \  Function Information                                                *\n*  \
    \                                                                     *\n*   Name\
    \ of Function: welcome                                           *\n*        \
    \                                                               *\n*   Function\
    \ Return Type: void                                          *\n*            \
    \                                                           *\n*   Parameters\
    \ (list data type, name, and comment one per line): NONE   *\n*              \
    \                                                         *\n*   Function Description:\
    \ Displays the welcome message to the user.     *\n*                         \
    \                                              *\n********************************************************************************/\n\
    ```\n\n```c\nvoid welcome(void)\n{\n    printf(\"\\n\\nWelcome to our calculator\
    \ program!\\n\\n\");\n}\n```\n\n**课程标准：** 为每个用户定义的函数使用课程头文件（.hfx）。`main` 函数不需要头文件。作业头文件将充当\
    \ `main` 的头文件。\n\n## 无参数但有返回值的函数\n\n- 输入函数是这类函数的良好示例：这类函数不向函数中传入数据，但能够生成并返回一个单一值。\n\
    \n```c\n#include<stdio.h>\n// FUNCTION DECLARATIONS\nvoid welcome(void);\nint\
    \ getInput(void);\nint main(void)\n{\n// LOCAL VARIABLE DECLARATIONS\nint operand1;\
    \ // FIRST OPERAND ENTERED BY USER\nint operand2; // SECOND OPERAND ENTERED BY\
    \ USER\n// EXECUTABLE STATEMENTS\nwelcome();\noperand1 = getInput(); // THE ASSIGNMENT\
    \ OPERATOR AWAITS THE\noperand2 = getInput(); // VALUE RETURNED FROM operandInput\n\
    return(0);\n}\n```\n\n函数调用的顺序为什么重要？为什么不将新的两条可执行语句添加到最前面？\n\n你为什么会考虑在两个函数调用后添加一条打印语句来显示这两个整数的值？\n\
    \n如果在两个函数调用之前打印这两个整数，会发生什么？\n\n## 将输入函数的定义添加到我们正在进行的工作中：\n\n```\n/*************************************************************\n\
    * Function Information\n* Name of Function: getInput\n* Function Return Type:\
    \ int\n* Parameters (list data type, name, and comment one per line): NONE\n*\
    \ Function Description: Accept and return user integer input.\n***************************************************************/\n\
    int getInput(void)\n{\n    // LOCAL DECLARATIONS\n    int op; // USER'S OPERAND\
    \ INPUT - ONLY VARIABLE AVAILABLE TO THIS FUNCTION\n    printf(\"Enter integer\
    \ operand --> \");\n    scanf(\"%d\", &op);\n    return(op);\n}\n```\n\n// 为了节省空间，已从此函数中删除课程函数头部\n\
    \n```c\nvoid welcome(void)\n{\n    printf(\"\\n\\nWelcome to our calculator program!\\\
    n\");\n}\n```\n\n## 观察：\n\n- 用户输入的值将返回给调用函数，并在 main 中完成赋值表达式。\n- 请注意，函数声明列出了返回类型\
    \ int，并通过空括号指示没有参数。\n\n## 带参数且有返回值的函数\n\n```c\n#include<stdio.h>\n// FUNCTION\
    \ DECLARATIONS\nvoid welcome(void);\nint getInput(void);\nint calcRemainder(int,\
    \ int);\nint calcQuotient(int, int);\nint main(void)\n{\n// LOCAL VARIABLE DECLARATIONS\n\
    int operand1; // FIRST OPERAND ENTERED BY USER\nint operand2; // SECOND OPERAND\
    \ ENTERED BY USER\nint remain; // HOLDS THE RESULT OF THE REMAINDER\nint quotient;\
    \ // HOLDS THE RESULT OF INT DIVISION\n// EXECUTABLE STATEMENTS\nwelcome();\n\
    operand1 = getInput(); // THE ASSIGNMENT OPERATOR AWAITS THE\noperand2 = getInput();\
    \ // VALUE RETURNED FROM operandInput\nremain = calcRemainder(operand1, operand2);\n\
    quotient = calcQuotient(operand1, operand2);\nreturn(0);\n}\n```\n\n"
