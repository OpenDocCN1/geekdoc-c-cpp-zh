  mdcn: "\n我们如何知道要请求多少字节的内存？我们可能知道数据的数量，但如何确保总量足以容纳数据集的数据类型？\n\n- sizeof 函数将接受一个数据类型，并返回存储该类型一个值所需的字节数。\n\
    - malloc 函数的参数将是 sizeof 函数返回的值与所需数据数量的乘积。\n\n![](img/50641bd70680c74d7c49fe705f0d8389_157_0.png)\n\
    \n```\ndata = (int*)malloc(sizeof(int) * 20);\n```\n\n示例 - 询问用户需要存储的整数数据数量。接受数据集作为输入并按输入顺序显示。\n\
    \n```\nint getQuantity(void);\nvoid getData(int*, int);\nvoid printData(int*,\
