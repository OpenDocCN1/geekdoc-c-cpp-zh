    # The Idea of a Programming Language


    To give instructions to a computer this semester, we will use a **programming
    language**, in particular, the C programming language. The C programming language
    is composed of keywords that come from a natural language but are used without
    the ambiguity. Initially the C programming language syntax will look foreign to
    you as a beginner, but it is completely unreadable by the computer!


    The computer has its own language, called a **machine language** that it can interpret
    as instructions specific to the individual machine that will perform the task.
    This machine language is written only in 0''s and 1''s because the internal circuits
    of a computer are made of switches, transistors, and other electronic devices
    can be in one of two states: off (0) or on (1).


    It didn''t take long for programmers to recognize that coding in a machine language
    is very challenging and the entire process of developing, debugging, and maintaining
    instructions in a machine language is not something most would enjoy doing. A
    process of evolution away from a machine language towards a natural language has
    been ongoing and has resulted in the programming languages of today.'
