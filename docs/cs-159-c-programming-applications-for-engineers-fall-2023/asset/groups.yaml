  mdcn: "\n\n## 为什么编译器不批准这个特定的赋值表达式？\n\n- 静态声明数组分配的内存在大小和位置上是固定的。\n- 根据前面的陈述，我们可以说数组所引用的内存地址是常量。\n\
    \n### 替代方案 - 使用 string.h 函数 strcpy\n\n- 函数 strcpy 将获取第二个参数并将其值复制到第一个。在此情况下，str1\
    \ 的内容被复制到 str2。\n\n```c\nchar str1[SIZE];\nchar str2[SIZE];\ngetString(str1);\n\
    strcpy(str2, str1);\nprintf(\"Your input: %s\\n\", str1);\nprintf(\"Your input\
    \ copy: %s\\n\", str2);\n```\n\n### 输出：\n\n输入您的字符串 -> Go Purdue!\n您的输入: Go Purdue!\n\
    您的输入副本: Go Purdue!\n\n## 是否存在复制的数据多于内存中预留空间的问题？\n\n- 是的！strcpy 函数将继续复制字符，直到找到分隔符。请验证目标数组是否具有所需容量！\n\
    \n## 比较两个字符串\n\n- 正如我们不能将一个字符串赋值给另一个字符串一样，我们也无法使用相等和关系运算符成功比较两个字符串的相等性。\n\n###\
    \ 示例：\n\n| 代码 | 说明 |\n| :--- | :--- |\n| `char str1[SIZE];`<br>`char str2[SIZE];`<br>`getString(str1);`<br>`strcpy(str2,\
    \ str1);`<br>`if(str1 == str2)`<br>`{`<br>`printf(\"The strings are equal!\\\\\
    n\");`<br>`}` | 有人可能会认为，如果相等运算符比较字符串内容，那么输入的任何值都会导致每次执行前面的代码段时都打印相等语句。 |\n\n**输出是什么？**\
    \ 无。\n\n**当对两个字符串使用关系或相等运算符时，这告诉我们正在比较什么？**\n\n使用相等运算符的比较测试的是内存地址，而不是字符串数据。\n\n\
    ### 替代方案 - 使用 string.h 函数 strcmp\n\nstring.h 库中的这个第三个函数将接受两个字符串作为参数，并返回一个整数，指示两个字符串的不同之处。存储相同数据的两个字符串没有差异。\n\
    \n| 场景 | 说明 |\n| :--- | :--- |\n| 输入您的字符串 -> company<br>输入您的字符串 -> corporate<br>比较结果:\
    \ -5 | 在第一个示例中，第三个元素是发现第一个差异的位置。此差异值从 `strcmp` 函数返回。第二个参数的元素减去第一个参数的元素。 |\n| 输入您的字符串\
    \ -> company<br>输入您的字符串 -> companion<br>比较结果: 16 | |\n| 输入您的字符串 -> ABC123<br>输入您的字符串\
    \ -> ABC123<br>比较结果: 0 | |\n| 输入您的字符串 -> ABC123<br>输入您的字符串 -> ABC123<br>比较结果:\
    \ -18 | 计算差异时使用的不是差异之和，而是从最低索引到最高索引顺序中的第一个差异。 |\n| 输入您的字符串 -> ABC12<br>输入您的字符串\
    \ -> ABC123<br>比较结果: -51 | 如果两个字符串的元素数量不同怎么办？ |\n| 输入您的字符串 -> ABC123<br>输入您的字符串\
    \ -> AbC123<br>比较结果: -32 | 字符大小写有意义吗？ |\n\n### 代码：\n\n```c\nchar str1[SIZE];\n\
    char str2[SIZE];\nint compare;\n\ngetString(str1);\ngetString(str2);\n\ncompare\
    \ = strcmp(str1, str2);\n\nprintf(\"Compare result: %d\\n\", compare);\n```\n\n\
    问题：实现 ROT13 加密算法。ROT13 并不真正是一种加密算法，但通过这种方法处理文本确实使其难以阅读。对于字母表前半部分的字符，我们加 13 将其旋转到后半部分。对于字母表后半部分的字符，我们减\
    \ 13 将其旋转到前半部分。非字母字符在此过程中不会更改。需要注意的是，加密过程与解密过程相同。\n\n输入您的字符串 -> Go Purdue!!!\n\
    原始字符串: Go Purdue!!!\n旋转后字符串: Tb Cheghr!!!\n原始字符串: Go Purdue!!!\n\n![](img/50641bd70680c74d7c49fe705f0d8389_165_0.png)\n\
    \n![](img/50641bd70680c74d7c49fe705f0d8389_165_1.png)\n\n## 解决方案：\n\n```c\n#define\
    \ SIZE 51\n\nvoid getString(char []);\nvoid rot13(char []);\n\nint main(void)\n\
    {\n    char str1[SIZE];\n\n    getString(str1);\n\n    printf(\"Original String:\
    \ %s\\n\", str1);\n    rot13(str1);\n    printf(\"Rotated String: %s\\n\", str1);\n\
    \    rot13(str1);\n    printf(\"Original String: %s\\n\", str1);\n\n    return(0);\n\
    }\n\nvoid rot13(char x[])\n{\n    int lcv;\n\n    for(lcv = 0; lcv < strlen(x);\
    \ lcv++)\n    {\n        if((x[lcv] >= 'a' && x[lcv] <= 'z') || (x[lcv] >= 'A'\
    \ && x[lcv] <= 'Z'))\n        {\n            if((x[lcv] >= 'a' && x[lcv] <= 'm')\
    \ || x[lcv] <= 'M')\n            {\n                x[lcv] += 13;\n          \
    \  }\n            else\n            {\n                x[lcv] -= 13;\n       \
    \     }\n        }\n    }\n}\n```\n\n## 搜索子字符串\n\n要介绍的 `string.h` 库中的最后一个函数 (strstr)\
    \ 有能力在字符串中定位子字符串。\n\n`strstr` 函数接受两个内存地址作为参数，并返回子字符串在字符串中的位置。当找不到子字符串时，返回的值是一个称为\
    \ NULL 的定义零。\n\n如果函数返回一个地址，那么该值将被赋给哪种类型的变量？答案：字符指针。\n\n### 问题 - 给定一个字符串和子字符串，确定子字符串在字符串中出现的次数。\n\
    \n```\n输入字符串 -> ATATATA\n输入子字符串 -> AT\n子字符串 AT 在字符串 ATATATA 中出现 3 次。\n```\n\n\
    ```\n输入字符串 -> ATATATA\n输入子字符串 -> ATA\n子字符串 ATA 在字符串 ATATATA 中出现 3 次。\n```\n\n\
    ## 解决方案：\n\n```c\n#define SUB_INPUT 1\n#define STR_INPUT 2\n#define SUBSTR 21\n\
    #define STRING 50\nvoid getString(char[], int, int);\nint ctStrings(char[], char[]);\n\
    int main(void)\n{\n   char sub[SUBSTR];\n   char str[STRING];\n   int count;\n\
    \   getString(str, STR_INPUT, STRING);\n   getString(sub, SUB_INPUT, SUBSTR);\n\
    \   count = ctStrings(str, sub);\n   printf(\"The substring %s appears %d time(s)\
    \ in the string %s.\\n\", sub, count, str);\n   return(0);\n}\n```\n\n```c\nvoid\
    \ getString(char x[], int option, int size)\n{\n\tint index = 0;\n\n\tif(option\
    \ == SUB_INPUT)\n\t{\n\t\tprintf(\"Enter the substring -> \");\n\t}\n\telse if(option\
    \ == STR_INPUT)\n\t{\n\t\tprintf(\"Enter the string -> \");\n\t}\n\tdo\n\t{\n\t\
    \tx[index++] = getchar();\n\t}while(index < size && x[index - 1] != '\\n');\n\n\
    \tx[index - 1] = '\\0';\n}\n```\n\n```c\nint ctStrings(char str[], char sub[])\n\
    {\n\tint ct = 0;\n\tchar *ptr;\n\n\tptr = strstr(str, sub); //LOOK FOR sub AT\
    \ START OF str\n\n\twhile(ptr != NULL)\n\t{\n\t\tct++;\n\t\tptr = strstr(ptr +\
    \ 1, sub); //PERMITS OVERLAP\n\t\t//ptr = strstr(ptr + strlen(sub), sub); //NO\
    \ OVERLAP\n\t}\n\n\treturn(ct);\n}\n```\n\n## 2023 年春季考试及答案\n\n### 考试 #1：\n\n\
