    \ for more information.\n\n## Scope\n\n- VARIABLES ARE NEVER PERMITTED TO HAVE\
    \ GLOBAL SCOPE.\n- Do you need to share a variable with another function? Do you\
    \ need a variable value to change within a function and to retain that change\
    \ after the function terminates?\n  - You must understand how to pass the variables/values\
    \ to and return them from a user-defined function.\n  - We reserve the right to\
    \ assign a **score of zero** for the implementation of global variables.\n- We\
    \ expect in this course that all function declarations will have a global scope.\n\
    - Do not reuse an identifier with two objects that have overlapping scope.\n\n\
    ## Symbolic/Defined Constants and other Pre-processor Directives\n\n- All pre-processor\
    \ directives must be placed at the top of your program just below the appropriate\
    \ assignment header of the file.\n- You can read much more about symbolic/defined\
    \ constants in your C programming text (appendix G) but one purpose of a symbolic/defined\
    \ constant is to make your role as programmer easier when the requirements for\
    \ a program are modified in the future.\n\n## The use of { and }\n\n- You will\
    \ observe in the C programming text that it is possible in certain situations\
    \ to omit the curly braces around the body of structures such as `if`, `for`,\
    \ and `while`. Do not develop or continue this habit! Beginners have a difficult\
    \ enough time pairing up their curly braces and a misplaced brace can be one of\
    \ the more challenging errors to resolve.\n- We will discuss the **dangling `else`**\
    \ problem in chapter 5 (page 245 of the C programming text, figure 5-14) as an\
    \ example of one difficult logical error to debug when you omit the braces as\
    \ we have required. You will also encounter the book's lack of { and } when you\
    \ try to make sense of the sorting algorithms coded in chapter 8 of the text.\n\
    \nFor all relevant selection and repetition constructs in C the use of { and }\
    \ is required.\n"
  mdcn: "\n\n## 作业标题\n\n- 作业标题在课程中用于对程序或用户定义函数中正在实现的逻辑提供详细描述。\n- 本学期我们将总共使用三个标题。一个用于实验，一个用于家庭作业，另一个用于用户定义函数。\n\
    - 使用标题绝不得干扰你程序的编译。\n\n### 实验作业标题\n\n```\n/********************************************************************\n\
    *\n*   Lab #:\n*\n*   Academic Integrity Statement:\n*\n*   We have not used source\
    \ code obtained from any other unauthorized source,\n*   either modified or unmodified.\
    \ Neither have we provided access to our code\n*   to another. The effort we are\
    \ submitting is our own original work.\n*\n*   Program Description:\n*\n********************************************************************/\n\
    ```\n\n- 你必须在 Vocareum 内使用 vi 的 :hlb 命令插入实验作业标题。\n- 每次成功提交实验作业后，Vocareum 团队的所有成员都将收到一封确认电子邮件。\n\
    \n### 家庭作业标题\n\n```\n/********************************************************************\n\
    *\n*   Homework #:\n*\n*   Academic Integrity Statement:\n*\n*   I have not used\
