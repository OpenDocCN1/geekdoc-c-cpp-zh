    \ the same thing, or contain a considerable amount of similar code. In such cases\
    \ you should attempt to consolidate as much as possible.\n- Use the top-down design.\
    \ Each function should have a well-defined task and not a series of tasks.\n-\
    \ Topics of efficient design will be commented on, where appropriate, in lecture.\n\
    \n## Syntax Errors and Warnings\n\n- Any assignment submit attempt with a **syntax\
