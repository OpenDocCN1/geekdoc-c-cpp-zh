    a, b, a && b);<br>printf("%2d && %2d = %2d\n", a, c, a && c);<br><br>printf("%2d
    || %2d = %2d\n", a, b, a || b);<br>printf("%2d || %2d = %2d\n", a, c, a || c);<br><br>printf("%2d
    && %2d = %2d\n", a, !c, a && !c);<br>printf("%2d || %2d = %2d\n", !a, c, !a ||
    c);<br><br>printf("---a && !c = %2d\n", --a && !c);<br>printf("b++ || ++c = %2d\n",
    b++ || ++c);<br><br>printf("a = %d b = %d c = %d\n", a, b, c); | 1.<br>2.<br>3.<br>4.<br>5.<br>6.<br>7.<br>8.<br>9.
    |


