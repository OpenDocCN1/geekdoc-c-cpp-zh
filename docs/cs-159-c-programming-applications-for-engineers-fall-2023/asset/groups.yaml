    \ | :--- |\n| floor (6.99) | | (int) 6.99 | |\n| floor (6.5) | | (int) 6.5 | |\n\
    | floor (6.0) | | (int) 6.0 | |\n| floor (6.75 + 0.5) | | (int) (6.75 + 0.5) |\
    \ |\n\n## Assignment Conversions:\n\n- This type of conversion occurs when the\
    \ data type of the expression on the right-hand side of an assignment expression\
    \ does not match the data type of the variable on the left-hand side of the assignment\
    \ operator.\n\n- The result of the expression on the right-hand side of the assignment\
    \ expression will be converted to match that of the variable on the left-hand\
    \ side. Such a conversion has the potential to be unsafe.\n\n### Example - rounding\
    \ and truncation\n\n```c\nint a = 3;\nint c = 1;\nfloat x = 3.99;\nfloat y = 2.29;\n\
    float z = 8;\n\nprintf(\"The value of z is %f\\n\", z);\n\nc = x; //ASSIGNING\
    \ A FLOAT TO AN INT - ASSIGNMENT CONVERSION\n\nprintf(\"The value of c is %d\\\
    n\", c);\n\nprintf(\"The value of x is %.1f and y is %.1f\\n\", x, y);\n\nprintf(\"\
    Using mixed up placeholders: \\n\");\nprintf(\"x is %d and a is %f\\n\", x, a);\n\
    \nprintf(\"Using a cast to fix placeholders: \\n\");\nprintf(\"x is %d and a is\
    \ %f\\n\", (int)x, (float)a);\n```\n\nNote: The warning issued as a result of\
    \ incorrect conversion codes is an indication of another undefined behavior. How\
    \ the values displayed are determined is based on the individual processor.\n\n\
    Reminder: An explicit type conversion applied to a variable WILL NOT alter the\
    \ variable's data type for the remainder of a program. You can consider the type\
    \ conversion is applied AFTER the data value for a variable has been retrieved\
    \ from its allocated memory.\n\n## How the value of variables are changed:\n\n\
    - The assignment operator has the ability to alter the value of a variable. Similarly,\
    \ the compound assignment operations can change what is stored in the memory assigned\
    \ to a variable.\n\n- The use of the address operator in a scanf function call\
    \ will change what a variable is storing in memory.\n\n- Prefix and post-fix increment\
    \ and decrement will make a change to the value of a variable. The particular\
    \ operator used will determine when this change will take place.\n\n## Selection\
    \ via Calculation\n\nWait, this is not the chapter on selection, is it? Where\
    \ are the if/else if/else constructs? How can we simulate selection with a calculation?\
    \ The fundamental idea here is that we can create an expression that can be activated\
    \ or not based on the value of a factor which is multiplied by the expression\
    \ to determine whether it remains a part of the final calculation. The factor\
    \ is often a result of comparing two values to determine which of the two is larger.\
    \ Given that this chapter has placed an emphasis on data types it is indeed that\
    \ idea which plays a major part in the calculation of such a factor.\n\n### Example:\
    \ Given two integers display the larger of the two.\n\n```c\n#include<stdio.h>\n\
    \nint main(void)\n{\n  int x;\n  int y;\n  int max;\n\n  printf(\"Enter two integers:\
    \ \");\n  scanf(\"%d %d\", &x, &y);\n\n  max = x / y * x + y / x * y;\n\n  printf(\"\
    Max value input is: %d\\n\", max);\n\n  return(0);\n}\n```\n\n### Example Executions:\n\
    \nEnter two integers: 5 8\nMax value input is: 8\n\nEnter two integers: 9 6\n\
    Max value input is: 9\n\nEnter two integers: 10 3\nMax value input is: 30\n\n\
    - See the problem when one of the numbers is two or more times greater than the\
    \ other?\n\n- How do we fix this? How can we make sure that the quotients calculated\
    \ are always 0 or 1?\n\n### Revision to eliminate multiplying the larger value\
    \ by a factor greater than one:\n\n```c\nfactor1 = x / y;\nfactor2 = y / x;\n\n\
    factor1 = (factor1 + 2) % (factor1 + 1);\nfactor2 = (factor2 + 2) % (factor2 +\
    \ 1);\n\nmax = factor1 * x + factor2 * y;\n```\n\n- Two integers factor1 and factor2\
    \ are introduced to store the values comparing x and y.\n\n- We know the value\
    \ that is zero represents the smaller of the two values and the value greater\
    \ than zero is the larger.\n\n- The modulus operator is used here to scale all\
    \ non-zero values to 1 while not changing the factor storing zero because 2 %\
    \ 1 is zero.\n\n### Example Executions of Revised Program:\n\nEnter two integers:\
    \ 10 3\nMax value input is: 10\n\nEnter two integers: 8 8\nMax value input is:\
    \ 16\n\n- We still have a problem when both integer values are the same!\n\n###\
    \ Revision to eliminate the duplication of the output when the two values entered\
    \ are the same:\n\n```c\nfactor1 = x / y;\nfactor2 = y / x;\n\nfactor1 = (factor1\
    \ + 2) % (factor1 + 1);\nfactor2 = (factor2 + 2) % (factor2 + 1);\n\nmax = factor1\
    \ * x + factor2 * y;\n\nmax = max / (factor1 + factor2);\n```\n\n- Only when the\
    \ sum of the factors is two are both values the same. In all other cases the sum\
    \ of the factors will be one.\n\n- With that being the case we only need to divide\
    \ the max by the sum of the factors to remove this unwanted doubling of the value.\n\
    \n### Example: Using what we now know about data types and expressions, given\
    \ the total number of points earned during a semester calculate the letter grade\
    \ earned.\n\n| | |\n|---|---|\n| Enter total points earned: 470<br>Points Earned:\
    \ 470 Grade Earned: A | Enter total points earned: 305<br>Points Earned: 305 Grade\
    \ Earned: D |\n| Enter total points earned: 415<br>Points Earned: 415 Grade Earned:\
    \ B | Enter total points earned: 304<br>Points Earned: 304 Grade Earned: F |\n\
    \n### Solution:\n\n```c\n#define A_MIN 470\n#define B_MIN 415\n#define C_MIN 360\n\
    #define D_MIN 305\n\nint totalPoints; //TOTAL POINTS EARNED BY STUDENT\nchar courseGrade;\
    \ //GRADE EARNED BY STUDENT\nint gradePoints; //4 - A, 3 - B, 2 - C, 1 - D, 0\
    \ - F\n\nprintf(\"Enter total points earned: \");\nscanf(\"%d\", &totalPoints);\n\
    \ngradePoints = totalPoints / A_MIN;\ngradePoints += totalPoints / B_MIN;\ngradePoints\
    \ += totalPoints / C_MIN;\ngradePoints += totalPoints / D_MIN;\n\ncourseGrade\
    \ = 'F' - gradePoints;\ncourseGrade -= totalPoints / D_MIN; //TO ACCOUNT FOR 'E'\n\
    printf(\"Points Earned: %d Grade Earned: %c\\n\", totalPoints, courseGrade);\n\
    ```\n\n## Why use functions?\n\n### Top-Down Design\n\nThe identification of smaller\
    \ tasks within the larger problem is known as **factoring** and results in small\
    \ manageable sub-parts of a program to be designed and individually developed\
    \ then implemented. This process of factoring tasks into more manageable parts\
    \ is known as **top-down design**.\n\n### When does the factoring stop?\n\nThis\
    \ factoring should continue until the task “consists only of elementary processes\
    \ that are intrinsically understood and cannot be further subdivided.” (page 150,\
    \ C Programming text)\n\n- In simple terms, a function should consist of a **single\
    \ task**. Be careful not to divide tasks such that the resulting functions are\
    \ trivial. For example, the act of input of a value includes the `printf`, `scanf`,\
    \ and validation of the input. To divide this task of input further would result\
    \ in functions that are trivial.\n\n- More good examples of “single task” functions\
    \ can be found in the `math.h` library. These functions accept as input one or\
    \ more values and generate a single value as a result. No additional tasks such\
    \ as input, output, or further calculations are included alongside the task of\
    \ these functions. The “single task” philosophy does improve the likelihood that\
    \ the function can be reused in the future.\n\n### When is a new function necessary?\n\
    \n- A function that accomplishes only a single task is known to be **functionally\
    \ cohesive**. Our goal is to develop such functions and to avoid placing multiple\
    \ unrelated tasks inside of the same function.\n\n- The logic behind the task\
    \ that a function accomplishes in a program should **appear only once** in the\
    \ program. The motivation for this idea is that we desire to **eliminate redundant\
    \ code**, that is logic which appears in more than one place in a program.\n\n\
    - The task that the function is completing should be **testable** by itself separate\
    \ of the rest of the program.\n"
  mdcn: "\n\n什么是隐式？计算机在程序员没有显式请求进行转换的情况下就自动完成了！隐式数据类型转换的规则在上图中有所说明。\n\n- 是否存在显式数据类型转换，如果存在，如何实现显式类型转换？\n\
    \n### 需要显式类型转换的示例：我想计算 3 / 2，但我需要答案是 1.5！\n\n我们在混合类型表达式中看到，整数在数据类型层次结构中被隐式提升为浮点数。我们可以在除法表达式的两个操作数之一上显式请求类型转换，从而强制除法涉及浮点数和整数。商随后将作为浮点数值生成，因为表达式现在是混合类型表达式，且第二个操作数（下面示例中的分母）被隐式更改。\n\
    \n```c\n(float) 3 / 2 = 1.5\n```\n\n尝试以下内容：\n\n| 表达式 | 求值 |\n| :--- | :--- |\n\
    | 3 / (float) 2 | |\n| (float) 3 / (float) 2 | |\n| (float) (3 / 2) | |\n\n上述表达式的结果说明了显式类型转换的优先级是什么？\n\
    \n### 另一次数学复习：数字舍入是问题解决中的常见任务。在本学期编程时，你必须牢记关于舍入的规则，或者更好的是，能够进行各种测试来识别你的值是如何进行舍入的。\n\
    \n- 有时会发生一种称为截断的“极端”舍入形式。截断是移除整个小数值，而不考虑剩余整数的舍入。\n\n- floor 函数（位于 math.h 中，也是\
    \ MATLAB 和 Excel 中常用的函数）将移除余数并将数字减小到下一个较小的整数值。请注意其行为与 float 到 int 的转换相似。\n\n|\
    \ 表达式 | 求值 | 表达式 | 求值 |\n| :--- | :--- | :--- | :--- |\n| floor (6.99) | | (int)\
    \ 6.99 | |\n| floor (6.5) | | (int) 6.5 | |\n| floor (6.0) | | (int) 6.0 | |\n\
    | floor (6.75 + 0.5) | | (int) (6.75 + 0.5) | |\n\n## 赋值转换：\n\n- 当赋值表达式右侧表达式的数据类型与赋值运算符左侧变量的数据类型不匹配时，会发生这种类型的转换。\n\
    \n- 赋值表达式右侧表达式的结果将被转换以匹配左侧变量的类型。这种转换可能是不安全的。\n\n### 示例 - 舍入和截断\n\n```c\nint a\
    \ = 3;\nint c = 1;\nfloat x = 3.99;\nfloat y = 2.29;\nfloat z = 8;\n\nprintf(\"\
    The value of z is %f\\n\", z);\n\nc = x; //ASSIGNING A FLOAT TO AN INT - ASSIGNMENT\
    \ CONVERSION\n\nprintf(\"The value of c is %d\\n\", c);\n\nprintf(\"The value\
    \ of x is %.1f and y is %.1f\\n\", x, y);\n\nprintf(\"Using mixed up placeholders:\
    \ \\n\");\nprintf(\"x is %d and a is %f\\n\", x, a);\n\nprintf(\"Using a cast\
    \ to fix placeholders: \\n\");\nprintf(\"x is %d and a is %f\\n\", (int)x, (float)a);\n\
    ```\n\n注意：由于转换代码不正确而发出的警告是另一种未定义行为的指示。显示值的确定方式基于各个处理器。\n\n提醒：应用于变量的显式类型转换 WILL\
    \ NOT 在程序剩余部分更改该变量的数据类型。你可以认为类型转换是在从变量分配的内存中检索数据值 AFTER 应用的。\n\n## 变量值如何更改：\n\n\
    - 赋值运算符有能力更改变量的值。同样，复合赋值运算可以更改存储在变量分配内存中的内容。\n\n- 在 scanf 函数调用中使用地址运算符将更改变量在内存中存储的内容。\n\
    \n- 前缀和后缀递增及递减将更改变量的值。所使用的特定运算符将确定此更改何时发生。\n\n## 通过计算进行选择\n\n等等，这不是选择章节，对吧？if/else\
    \ if/else 结构在哪里？我们如何通过计算来模拟选择？这里的基本思想是，我们可以创建一个表达式，根据一个因子的值来决定是否激活该表达式，该因子乘以表达式以确定它是否仍然是最终计算的一部分。该因子通常是比较两个值以确定哪个更大的结果。鉴于本章强调了数据类型，正是这个想法在计算此类因子中起着主要作用。\n\
    \n### 示例：给定两个整数，显示较大的那个。\n\n```c\n#include<stdio.h>\n\nint main(void)\n{\n  int\
    \ x;\n  int y;\n  int max;\n\n  printf(\"Enter two integers: \");\n  scanf(\"\
    %d %d\", &x, &y);\n\n  max = x / y * x + y / x * y;\n\n  printf(\"Max value input\
    \ is: %d\\n\", max);\n\n  return(0);\n}\n```\n\n### 示例执行：\n\n输入两个整数：5 8\n输入的最大值是：8\n\
    \n输入两个整数：9 6\n输入的最大值是：9\n\n输入两个整数：10 3\n输入的最大值是：30\n\n- 当其中一个数字是另一个数字的两倍或更多时，你看到问题了吗？\n\
    \n- 我们如何修复这个问题？我们如何确保计算的商始终是 0 或 1？\n\n### 修订以消除将较大值乘以大于一的因子：\n\n```c\nfactor1\
    \ = x / y;\nfactor2 = y / x;\n\nfactor1 = (factor1 + 2) % (factor1 + 1);\nfactor2\
    \ = (factor2 + 2) % (factor2 + 1);\n\nmax = factor1 * x + factor2 * y;\n```\n\n\
    - 引入两个整数 factor1 和 factor2 来存储比较 x 和 y 的值。\n\n- 我们知道值为零表示两个值中较小的那个，而大于零的值是较大的那个。\n\
    \n- 这里使用模运算符将所有非零值缩放为 1，同时不更改存储零的因子，因为 2 % 1 是零。\n\n### 修订程序的示例执行：\n\n输入两个整数：10\
    \ 3\n输入的最大值是：10\n\n输入两个整数：8 8\n输入的最大值是：16\n\n- 当两个整数值相同时，我们仍然有问题！\n\n### 修订以消除当输入两个值相同时输出重复的问题：\n\
    \n```c\nfactor1 = x / y;\nfactor2 = y / x;\n\nfactor1 = (factor1 + 2) % (factor1\
    \ + 1);\nfactor2 = (factor2 + 2) % (factor2 + 1);\n\nmax = factor1 * x + factor2\
    \ * y;\n\nmax = max / (factor1 + factor2);\n```\n\n- 只有当因子之和为二时，两个值才相同。在所有其他情况下，因子之和将为一。\n\
    \n- 既然如此，我们只需要将 max 除以因子之和，以消除这种不需要的值翻倍。\n\n### 示例：利用我们现在对数据类型和表达式的了解，给定学期获得的总分，计算获得的字母等级。\n\
    \n| | |\n|---|---|\n| 输入获得的总分：470<br>获得的分数：470 获得的等级：A | 输入获得的总分：305<br>获得的分数：305\
    \ 获得的等级：D |\n| 输入获得的总分：415<br>获得的分数：415 获得的等级：B | 输入获得的总分：304<br>获得的分数：304 获得的等级：F\
    \ |\n\n### 解决方案：\n\n```c\n#define A_MIN 470\n#define B_MIN 415\n#define C_MIN\
    \ 360\n#define D_MIN 305\n\nint totalPoints; //TOTAL POINTS EARNED BY STUDENT\n\
    char courseGrade; //GRADE EARNED BY STUDENT\nint gradePoints; //4 - A, 3 - B,\
    \ 2 - C, 1 - D, 0 - F\n\nprintf(\"Enter total points earned: \");\nscanf(\"%d\"\
    , &totalPoints);\n\ngradePoints = totalPoints / A_MIN;\ngradePoints += totalPoints\
    \ / B_MIN;\ngradePoints += totalPoints / C_MIN;\ngradePoints += totalPoints /\
    \ D_MIN;\n\ncourseGrade = 'F' - gradePoints;\ncourseGrade -= totalPoints / D_MIN;\
    \ //TO ACCOUNT FOR 'E'\nprintf(\"Points Earned: %d Grade Earned: %c\\n\", totalPoints,\
    \ courseGrade);\n```\n\n## 为什么使用函数？\n\n### 自顶向下设计\n\n在较大问题中识别较小任务被称为**因式分解**，并导致程序的小型可管理子部分被设计、单独开发然后实现。将任务分解为更可管理的部分的过程称为**自顶向下设计**。\n\
    \n### 因式分解何时停止？\n\n这种因式分解应持续进行，直到任务“仅由内在理解且无法进一步细分的基本过程组成。”（第 150 页，C 程序设计文本）\n\
    \n- 简单来说，一个函数应包含**单个任务**。要小心不要将任务划分得使得生成的函数是平凡的。例如，输入一个值的操作包括 `printf`、`scanf`\
    \ 和输入的验证。进一步划分此输入任务将导致平凡的函数。\n\n- `math.h` 库中可以找到更多“单个任务”函数的良好示例。这些函数接受一个或多个值作为输入，并生成一个单一值作为结果。除了这些函数的任务外，不包括输入、输出或进一步计算等附加任务。“单个任务”理念确实提高了函数未来可重用的可能性。\n\
    \n### 何时需要新函数？\n\n- 只完成单个任务的函数被称为**功能内聚**。我们的目标是开发此类函数，并避免将多个不相关的任务放在同一个函数中。\n\
    \n- 函数在程序中完成任务背后的逻辑在程序中应**仅出现一次**。这一想法的动机是我们希望**消除冗余代码**，即出现在程序多个位置的逻辑。\n\n- 函数正在完成的任务本身应与程序其余部分分开**可测试**。\n\
    \n"
