  - '[PAGE 16]


    # Assignment Headers


    +   - Assignment headers are used in the course to provide a detailed description
    of the logic being implemented in a program or user-defined function.

    +   - There are three total headers we will use this semester. One for labs, one
    for homework, and another for user-defined functions.

    +   - The use of a header MUST NOT interfere with the compilation of your program.


    # Lab Assignment Header


    ```

    /********************************************************************

    *

    *   Lab #:

    *

    *   Academic Integrity Statement:

    *

    *   We have not used source code obtained from any other unauthorized source,

    *   either modified or unmodified. Neither have we provided access to our code

    *   to another. The effort we are submitting is our own original work.

    *

    *   Program Description:

    *

    ********************************************************************/

    ```


    +   - You must insert the lab assignment header using vi''s :hlb command inside
    Vocareum.

    +   - After each successful submission of a lab assignment, all members of the
    Vocareum team will receive a confirmation e-mail.


    # Homework Assignment Header


    ```

    /********************************************************************

    *

    *   Homework #:

    *

    *   Academic Integrity Statement:

    *

    *   I have not used source code obtained from any other unauthorized source,

    *   either modified or unmodified. Neither have I I provided access to my code

    *   to another. The effort I am submitting is my own original work.

    *

    *   Program Description:

    *

    ********************************************************************/

    ```


    +   - You must insert the homework assignment header using vi''s :hhw command
    inside Vocareum.

    +   - After each successful submission of a homework assignment, you will receive
    a confirmation e-mail.


    Be sure each of the following are correct in your lab and homework assignment
    headers:


    +   - The academic integrity statement will be provided for you and MUST remain
    in the header. Do not make any changes to this statement.

    +   - The alternating characters at the beginning and end of each assignment header
    are part of a security and identification feature and should not be modified.

    +   - A verbose program description is necessary. If your lab instructor is unable
    to follow your logic after a quick glance at your code then they should be able
    to determine from your description the algorithm you were attempting to implement.
    A verbose program description will mean fewer necessary comments within the code
    of your program.'
  - '[PAGE 17]


    # Function Header


    ```

    /********+*--*--*-----*-----*-----*-----*--*---*-----*--*---*-----*--*---*---*---*---*---*/

    *

    *   Function Information

    *

    *   Name of Function:

    *

    *   Function Return Type:

    *

    *   Parameters (list data type, name, and comment one per line):

    *       1.

    *       2.

    *       3.

    *

    *   Function Description:

    *

    *-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*-----*/

    ```


    +   - You must insert the homework assignment header using vi''s :hfx command
    inside Vocareum.

    +   - With functions, it is important to comment your parameters (those values
    received by a function) in the header! There is insufficient space to comment
    parameters in the first line of the function definition and it must be included
    here within the header.


    # Object Names / Identifiers


    +   - We will consider the following to be objects in this course: **variables,
    functions, symbolic/defined constants**. You must give your objects names that
    reflect their purpose in the program.


    | int x;

    int y;

    int z; | Can you determine what the variables x, y, and z accomplish for the program
    based only on the name of the variable? Perhaps they hold information on a 3D
    point? If the program contains no 3D coordinate data, then the use of x, y, and
    z as variable names is unclear. |


    +   - **Rarely is a single character identifier for an object meaningful**. A
    reasonable exception would be for a loop control variable used for simple counting
    or to access the elements of the array.

    +   - The use of the underscore to begin an identifier is not a practice that
    we will use in the course.


    | int numStudents;

    float objectMass;

    char courseGrade; | Relevant variable, constant, and function names assist in
    the **documentation**, and **readability**, of the logic you are attempting to
    implement. |


    # Variable Declarations


    +   - Declare only a single variable per line.

    +   - All variable declarations must appear in the local declaration section of
    a function. No variable declarations are permitted to be global and scope and
    neither should any declarations appear among the executable statements.


    # Variable Initialization


    ```

    int numStudents = 0;                                //OKAY TO KEEP HERE

    float objectMass = calcMass(acceleration, velocity); //PLACE AMONG EXECUTABLES

    ```


    +   - In general it is acceptable to initialize a variable declared in the local
    declaration section of a user-defined function. If the expression used to initialize
    the variable is more complex than a constant assignment then it is best to give
    the variable its first value inside of the executable statement section of the
    function.'
  - '[PAGE 18]


    # Symbolic/Defined Constants


    +   - THE SELECTION OF IDENTIFIERS FOR SYMBOLIC/DEFINED CONSTANTS MUST BE IN ALL
    CAPS. This standard allows any programmer to differentiate between a variable,
    a function call, and a constant that commonly occur as operands in an expression.

    +   - Define all symbolic/defined constants at the top of your program immediately
    following the assignment header.

    +   - Because the use of symbolic/defined constants can improve the documentation
    of a program it is a standard of the course that you attempt to **maximize** your
    use of symbolic/defined constants and **minimize** your use of literal constants
    (see chapter 3).


    # Commenting


    In the C programming language we have two possible implementations of comments:


    +   - The single line comment // that will instruct the compiler to ignore everything
    after // to the end of the line.

    +   - The multi-line comment /* */ that will instruct the compiler to ignore everything
    between the /* and */. See the headers above for an example of this type of comment.
    Multi-line comments cannot be nested in the C programming language.


    # What must be commented?


    +   - EVERY variable that you declare must have a brief comment to describe its
    purpose in the program! o Comment variables to the right of where they are declared
    in the local declaration section of a function.

    +   - Within a given function it is expected that the occasional complex segment
    of code be documented in order to inform others regarding that logic you are attempting
    to implement. o For example. It is recommended that you place a line or two of
    comments before any significant selection or repetition construct.


    # Indenting


    You must indent all code inside the body of a structure **two (additional) spaces**!
    Rarely should you ever begin a line of code in the first column of your editor!
    Here are some common structures properly indented according to our standards:


    | for(x = 1; x <= MAX; x++) { printf("%d", x); } | if (y == 3) { for(g = 0; g
    > MIN; g--) { y = y - g; } } | do { e = m * c * c; avg = sum/number; }while(r
    == 0); |


    # More Indenting Examples:


    | Correct | Incorrect | Also Incorrect |

    |---|---|---|

    | if(x == 3 || y == 2) { z++; a = a - 1; } | if(x == 3 || y == 2) { z++; a = a
    - 1; } | if(x == 3 || y == 2) { z++; a = a - 1; } |


    Switch constructs will be indented as seen in the C programming text - See page
    258.'
  - '[PAGE 19]


    # White-Spacing


    +   - Please place an additional line between sections to help group the code
    by logic related to the same task.

    +   - Balance the use of additional lines and failing to place any throughout
    your code.

    +   - There is no need to double space all lines of code or to include multiple
    consecutive blank lines.

    +   - It is a requirement to place a space between operators and operands, such
    as: `y = y - g;`


    # Programming Standards


    There are numerous motivations for programming standards; in this course the purpose
    of such standards as described here is to help you develop good habits for your
    future programming endeavors. For some students this requirement will require
    breaking previously developed programming habits.


    # What makes a habit or programming practice less desirable?


    Anything that makes programming harder for beginners, increases the vulnerability
    of software to hacking or crashing, unnecessarily creates complex code, or represent
    features of a programming language that are becoming obsolete.


    # Keep Local Declarations Separate from Executable Statements


    +   - The default settings of the `gcc` compiler in this class requires that all
    variables are declared prior to the start of the executable statements. See Figure
    2-2 in Chapter 2 of C programming text for more information.


    # Scope


    +   - VARIABLES ARE NEVER PERMITTED TO HAVE GLOBAL SCOPE.

    +   - Do you need to share a variable with another function? Do you need a variable
    value to change within a function and to retain that change after the function
    terminates?

    +     - You must understand how to pass the variables/values to and return them
    from a user-defined function.

    +     - We reserve the right to assign a **score of zero** for the implementation
    of global variables.

    +   - We expect in this course that all function declarations will have a global
    scope.

    +   - Do not reuse an identifier with two objects that have overlapping scope.


    # Symbolic/Defined Constants and other Pre-processor Directives


    +   - All pre-processor directives must be placed at the top of your program just
    below the appropriate assignment header of the file.

    +   - You can read much more about symbolic/defined constants in your C programming
    text (appendix G) but one purpose of a symbolic/defined constant is to make your
    role as programmer easier when the requirements for a program are modified in
    the future.


    # The use of { and }


    +   - You will observe in the C programming text that it is possible in certain
    situations to omit the curly braces around the body of structures such as `if`,
    `for`, and `while`. Do not develop or continue this habit! Beginners have a difficult
    enough time pairing up their curly braces and a misplaced brace can be one of
    the more challenging errors to resolve.

    +   - We will discuss the **dangling `else`** problem in chapter 5 (page 245 of
    the C programming text, figure 5-14) as an example of one difficult logical error
    to debug when you omit the braces as we have required. You will also encounter
    the book''s lack of { and } when you try to make sense of the sorting algorithms
    coded in chapter 8 of the text.


    For all relevant selection and repetition constructs in C the use of { and } is
    required.'
