    \ required of an instruction.\n3. Control Unit - Coordinates the operations of\
    \ the processor.\n4. Interconnection - connecting all of the above.\n"
  mdcn: "\n\n## Proper Use of Repetition\n\n- 仅在计数器控制的进程中使用 `for` 循环。\n- 每个 `for`\
