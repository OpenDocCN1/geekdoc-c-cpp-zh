    \nprintf 函数用于向显示器显示消息和格式化数据。\n\n- 要打印数据，printf 函数需要两样东西：格式化数据的指令和要打印的实际数据。\n\n\
    我们在之前的示例中看到了以下用于仅显示文本的内容：\n\n- printf(\"Hello World!\\n\");\n\n在 printf 语句中可以打印由常量或变量表示的数据：\n\
    \n- printf(\"The year is: %d\\n\", 2023);\n\n其中 %d 是整数字面常量 2023 的占位符。\n\n- 提示：本笔记中使用术语“占位符”，书籍将把\
    \ % 称为起始标记，后面跟一个转换代码（在上面的示例中，“d”是整数值的转换代码）。\n\nprintf 语句的格式是：printf( format string,\
    \ data list );\n\n- 其中 format string 是双引号内的所有内容，要打印的变量在逗号之后的 data list 中。\n\n\
    - data list 可以包含由逗号分隔的多个值。\n\n可以通过在占位符中使用不同的转换代码，用 printf 打印所有典型的 C 数据类型：\n\n\
    - int（整数系列值）使用 %d\n\n- float（浮点系列值）使用 %f\n\n- char（单个字符值）使用 %c\n\n### 转换代码的更全面列表：\n\
    \n| 家族 | 类型 | 大小 | 代码 | 示例 |\n|---|---|---|---|---|\n| 整数 | char | None | c |\
    \ %c |\n| | int | None | d | %d |\n| | long | | d | |\n| | long long | | d | |\n\
    | 浮点 | float | None | f | %f |\n| | double | | f | |\n| | long double | | f |\
    \ |\n\n### 宽度修饰符：\n\n- 宽度修饰符与转换字符一起使用，为要显示的值保留给定的空间量。\n\n- 如果要显示的数据中的字符数少于宽度修饰符指定的数量，则数据将右对齐在保留的空间中。\n\
    \n- 通过在宽度修饰符之前加上 - 可以实现左对齐。此选项称为标志。\n\n### 精度修饰符：\n\n- 精度修饰符与浮点数据一起使用，以确定小数点右侧要显示的位数。\n\
    \n### 占位符摘要：\n\n| % | | | | 大小 | 代码 |\n|---|---|---|---|---|---|\n\n标志属性是用于减法的字符，并将默认对齐从右向左移动。例如：%-10d\n\
    \n### 宽度修饰符、精度修饰符和变量精度修饰符的示例：\n\n```\n--------------------------------\nCircumference:\
    \       26.70\nCircumference:   26.703514\nCircumference:       26.704\n--------------------------------\n\
    ```\n\n### 关于代码段的注释：\n\n- 所需的小数位数存储在名为 `decimalPlaces` 的变量中。\n\n- 然后使用此值来表示要显示的所需小数位数，并替换占位符中的\
    \ *。\n\n- 宽度修饰符是固定值 18。这也可以用变量表示，类似于精度的实现方式。\n\n### 用于生成左侧输出的代码：\n\n```\n#include<stdio.h>\n\
    #define APPROX_PI 3.14159\n\nint main(void)\n{\n\tfloat radius = 4.25;\n\tfloat\
    \ circumference;\n\n\tint decimalPlaces = 3;\n\n\tcircumference = 2 * APPROX_PI\
    \ * radius;\n\n\tprintf(\"------------------\\n\");\n\tprintf(\"Circumference:\
    \ %18.2f\\n\", circumference);\n\tprintf(\"Circumference: %18f\\n\", circumference);\n\
    \tprintf(\"Circumference: %18.*f\\n\", decimalPlaces, circumference);\n\tprintf(\"\
    ------------------\\n\");\n\n\treturn (0);\n}\n```\n\n### 本学期我们将使用的主要输入函数称为 `scanf`\n\
    \n`scanf` 函数的格式与 `printf` 类似，它由逗号分隔的两个部分组成。\n\n```\nscanf ( format string, address\
    \ list );\n```\n\n- format string 将列出预期作为输入的数据类型。在单个 `scanf` 语句中读取多个数据是可能的。address\
    \ list 指示输入值应存储在计算机内存的哪个位置。\n\n```\nprintf (\"Enter current year -> \");\nscanf\
    \ (\"%d\", &year);\n```\n\n用户将输入一个整数，该整数将分配给变量 `year`。\n\n- `year` 前面的 `&` 是什么？\n\
    \n- `&` 是**地址运算符**，指变量 `year` 表示的地址。\n\n- 用户输入的值将存储在内存中，地址由 `year` 表示。\n\nscanf\
    \ 函数使用与 printf 相同的占位符：\n\n- int 使用 %d\n\n- float 使用 %f\n\n- char 使用 %c\n\n> 记住：\\\
    n 表示输出的换行符，在 scanf 语句中不应预期。\n\n## 错误讨论\n\n在学期中，我们无法涵盖你可能遇到的每个特定错误，但今天我们将把错误分为不同的类别，并在学习新主题时尽量提及常见错误。本简短部分的目的是帮助你更好地理解你正在尝试解决的错误，并与可能试图提供帮助的其他人进行沟通。\n\
    \n| 错误分类： | 遇到错误时，尝试回答以下问题： |\n|---|---|\n| 1. 语法错误<br>2. 逻辑错误 | 1. 错误何时发生？<br>2.\
    \ 你对错误有什么观察？ |\n\n### 语法错误\n\n当你尝试编译 C 代码时，会意识到语法错误。语法错误也可以说是**编译时错误**。通常，此错误是由于你犯了一个违反\
    \ C 编程语言**语法规则**的错误，导致编译器停止工作。\n\n- 常见的语法错误包括分号位置错误、未配对所有引号以及其他拼写错误。\n\n- **警告**是编译器提供的反馈，表明你可能犯了一个错误。在提交作业之前，应修正所有警告。如果你正确设置了帐户，则将使用警告选项进行编译。如果未启用此选项，或使用替代编译器，你可能不会注意到任何警告。\n\
    \n### 可执行文件的创建\n\n当编译器因语法错误而必须终止工作时，不会创建新的可执行文件 (a.out)。这里的关键字是**错误**，它通常包含在编译器生成的消息中。如果编译器报告**仅警告**，则可能会创建新的可执行文件\
    \ (a.out)。发出警告时，编译器已检测到语法的潜在误用，这在程序执行时通常会表现为逻辑错误。\n\n### 警告消息示例：\n\n```\ntest.c:\
    \ In function 'main':\ntest.c:10: warning: 'ct' is used uninitialized in this\
    \ function\n```\n\n"
