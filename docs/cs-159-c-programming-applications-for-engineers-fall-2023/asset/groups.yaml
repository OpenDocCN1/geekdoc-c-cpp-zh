  - "[PAGE 60]\n\n# A Function with no Parameters that Returns no Value\n\n+   • The\
    \ greeting function is an example of a void function and are useful to handle\
    \ tasks that require no value to be returned.\n\n```\n#include<stdio.h>\n\nvoid\
    \ welcome(void); //FUNCTION DECLARATION\n\nint main(void)\n{\n    welcome(); //FUNCTION\
    \ CALL\n\n    return(0);\n}\n```\n\n```\n/********************************************************************************\n\
    *                                                                       *\n* \
    \  Function Information                                                *\n*  \
    \                                                                     *\n*   Name\
    \ of Function: welcome                                           *\n*        \
    \                                                               *\n*   Function\
    \ Return Type: void                                          *\n*            \
    \                                                           *\n*   Parameters\
    \ (list data type, name, and comment one per line): NONE   *\n*              \
    \                                                         *\n*   Function Description:\
    \ Displays the welcome message to the user.     *\n*                         \
    \                                              *\n********************************************************************************/\n\
    ```\n\n```\nvoid welcome(void)\n{\n    printf(\"\\n\\nWelcome to our calculator\
