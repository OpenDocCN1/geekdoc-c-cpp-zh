    ## 第5章 特殊函数


    与经典的数字计算机编程一样，在模拟计算机设置中经常会出现一些*特殊函数*，例如反函数（如（平方）根）、极限、迟滞等。本章描述了典型的“库”函数，它们可以用作更复杂程序的构建模块。正如在算法领域，尤其是在
    Perl 程序员中，“不止一种方法”这句话对于模拟计算机程序同样适用。这里描述的函数通常既不是唯一的实现方式，也不一定是最佳的。


    如有疑问或需要寻找其他函数时，应查阅大量经典文献。强烈推荐进一步阅读以下权威书籍：[KORN et al. 1964]、[GILOI et al. 1963]（德语），以及
    [HAUSNER 1971]、[GILLILAND 1967]、[AMMON 1966] 和 [CARLSON et al. 1967]。


    ### 5.1 反函数


    函数生成的一种非常强大的技术是反函数，例如基于函数 $f(x)=x^2$ 得到平方根。回顾加法器和积分器的基本设置，产生反函数的设置思想很简单，它依赖于运算放大器试图将其反相输入端
    SJ 保持为零这一事实。图 5.1 显示了生成反函数的基本设置。


    ![](img/91599d88757ed8c75960eb83f4f85a12_91_0.png)


    图 5.1. 生成反函数的基本设置


    该电路的核心是一个函数发生器，它构成开环放大器的反馈元件。当输入信号为 x 时，如果 −x = f(−y)，且 y = f^{−1}(x) 是放大器输出端的值，则求和结将为零。


    如果反函数未在 [−1, 1] 的整个范围内定义，则需要采取一些预防措施以防止放大器过载。如果基本设置显示出不稳定迹象，有时也有必要在运算放大器的输出与其求和结之间连接一个小电容，通常为几十
    pF。<sup>49</sup>


    ### 5.1.1 平方根


    反函数的一个很好的例子是图 5.2 所示的平方根电路。这基本上与图 5.1 所示的设置相同，但增加了两个部分。一个二极管和一个小电容连接在开环放大器的输出端与其求和结之间。当输入变为正时，二极管可防止放大器饱和，因为在这种情况下，放大器的输入和乘法器的输出都将为正，从而将放大器的输出驱动到其最大负电平。


    虽然这不会损坏放大器，但使其进入饱和状态将产生溢出，并给出无意义的输出值。此外，放大器可能需要一些时间才能从这种状态中恢复。对于经典模拟计算机尤其如此，它们的恢复时间可能长达数秒。请注意，由于二极管的正向阈值电压——标准硅二极管约为
    0.7 V，肖特基二极管低至 0.2 V——二极管将使放大器的输出略微低于零。


    ![](img/91599d88757ed8c75960eb83f4f85a12_92_0.png)


    **图 5.2.** 典型平方根电路


    ![](img/91599d88757ed8c75960eb83f4f85a12_92_1.png)


    **图 5.3.** 由图 5.2 所示计算机设置生成的函数，其中 −1 ≤ x ≤ 1


    小电容可防止放大器输出接近零时产生振铃。在某些情况下，根据所使用的开环放大器的行为，可以省略它。图 5.3 显示了该电路的行为。输入值由单个积分器生成，产生从
    −1 到 +1 的斜坡。该斜坡也用于示波器的 x 偏转。


    ### 5.1.2 除法


    上述平方根电路可以很容易地修改为实现除法运算。图 5.4 显示了基本设置：乘法器连接到放大器的输出端和输入变量 $y$，开环放大器将使其输出趋向 −x/y，这样乘法器的输出产生
    −x，从而抵消通过 x 输入及其相关输入电阻传递到放大器反相输入的电流。


    如前所述，应在放大器的输出与其求和结之间连接一个约 68 pF 的小电容，以防止电路的不稳定行为。还应注意，该电路不执行四象限除法运算。


    有些系统配备了预接线模块，用于计算常见的反函数，如平方根和除法。图 5.6 显示了一个 Analog Paradigm MDS2 模块，其中包含两个计算元件，可通过开关选择执行乘法、除法或平方根运算。


    ![](img/91599d88757ed8c75960eb83f4f85a12_94_0.png)


    图 5.7. 生成 1/τ


    ![](img/91599d88757ed8c75960eb83f4f85a12_94_1.png)


    图 5.8. 生成 τ⁻¹，其中 τ₀⁻¹ = 1，每格 2.5 V


    ![](img/91599d88757ed8c75960eb83f4f85a12_94_2.png)


    图 5.9. 生成 τ 的连续幂


    ### 5.3 幂与多项式


    在计算机设置中，通常需要 τ 的幂和/或由这些幂构成的多项式。乍一看，这些幂当然可以通过向乘法器馈送线性斜坡信号（例如 −1 ≤ τ ≤ 1）来生成，但这并不总是现实的，因为乘法器很昂贵，而且模拟计算机（尤其是老式计算机）通常只有少数几个乘法器。此外，许多乘法器（如四分之一平方乘法器）在输入值接近零时会出现不可忽略的误差。


    因此，通常更可取的做法是通过连续积分来生成线性时变变量 τ 的幂，如图 5.9 所示。该设置对 −1 ≤ τ ≤ 1 生成 τ、−τ² 和 τ³ 的幂。<sup>50</sup>


    ![](img/91599d88757ed8c75960eb83f4f85a12_95_0.png)


    图 5.10. 通过连续积分生成 τ 的连续幂


    该电路显然可以扩展到 τ 的更高次幂，并且一些系数电位器可以很容易地通过连接下一个积分器的输入端来替换，例如，加权为 10 的输入前面的因子 0.2 可以通过将该值馈送到两个相连的输入端（每个权重为
    1）来代替，等等。通过这种设置生成的 τ 的连续幂也可以加在一起（通过加法器可选地改变符号）以及添加系数来形成任意多项式。图 5.10 显示了上述设置生成的随时间变化的函数。


    ### 5.4 低通滤波器


    有时，例如在处理实验收集的数据时，低通滤波器是很有用的。从一个相当简化的角度来看，这种设备只允许低于某一阈值的频率通过。


    这种电路的另一个应用是对由噪声发生器产生的（白）噪声信号进行滤波。这些信号经过滤波并可能整形为合适的分布（例如高斯分布），在分析受随机激励的机械系统的行为时非常有用。


    尽管一些经典模拟计算机（如 EAI-231(RV) 或 Telefunken RA 770）具有产生正态分布输出信号的噪声发生器，但这种设备如今已很少见。可以改用用于音频目的、馈入低通滤波器的噪声发生器；下文对此进行描述。如果需要输出信号的正态分布，可以通过使用合适的函数发生器轻松获得。


    ![](img/91599d88757ed8c75960eb83f4f85a12_96_0.png)


    图 5.11. 低通滤波器基本电路


    在模拟计算机上实现低通滤波器非常简单，因为它类似于一阶时间滞后，其一般传递函数为


    $F(p) = \frac{1}{1 + pT}$


    其中 $T$ 表示延迟线的时间常数。<sup>52</sup> 该设置如图 5.11 所示，基本上产生其输入信号的时变平均值。随着电路时间常数的增加，该平均值变得“更好”——但这也意味着电路需要更长的时间来稳定到平均值。


    通常，两个系数电位器设置为相同的值，但有时根据期望的输出信号，与“理想”设置有一定偏差可能是有利的。


    图 5.12 显示了从专业噪声发生器获得的白噪声信号，频率范围从 0 Hz 到 100 kHz，位于屏幕的上三分之一处。中间的曲线是应用一个上述结构的低通滤波器的结果，而下面的迹线表示连接到第一个滤波器输出的第二个低通滤波器的输出信号。


    ### 5.5 三角波/方波发生器


    有时需要提供三角波或方波信号。三角波的典型应用是示波器或绘图仪的 x 偏转，而方波通常便于控制电子开关，以在示波器上显示多个曲线或图形。<sup>53</sup>


    <sup>52</sup> 参见 [GILOI et al. 1963, p. 308] 和附录 B 了解更多细节。p 是实现时间导数的算子。


    <sup>53</sup> 参见 [KORN et al. 1964, ch. 9-5]。


