    = \frac{a}{(\Delta r)^2} \left( \left(1 + \frac{1}{2(i+1)}\right) T_{i+1} - 2
    T_i + \left(1 - \frac{1}{2(i+1)}\right) T_{i-1} \right)


    项 $1 + \frac{1}{2(i+1)}$ 当然会超过 1，因此需要进行粗略的缩放。引入一个比例因子 $\lambda$ 使得


    \frac{a}{\lambda (\Delta r)^2} = \frac{1}{2}


