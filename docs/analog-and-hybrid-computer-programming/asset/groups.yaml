    \n*模拟计算机* 的概念源于希腊词 ανάλογον（“*类比物*”），该词在“*类比*”和“*类似物*”等术语中得以延续。这非常贴切地描述了模拟计算机，并将其与当今的数字计算机区分开来。后者具有固定的内部结构，并由存储在某种随机存取存储器中的程序控制。\n\
    \n相比之下，模拟计算机根本没有程序存储器，其编程是通过实际改变其结构，直到它形成给定问题的类似物、一个 *模型*。这种方法与当今编程课程中所教授的内容大相径庭（除\
    \ FPGA 相关课程外）。问题不是以逐步（算法）的方式解决，而是通过以合适的方式连接模拟计算机的各种计算元件，形成一个作为所研究问题模型的 *电路*。图\
    \ 1.1 和 1.2 说明了这两种根本不同的计算方法。虽然经典数字计算机或多或少以顺序方式工作，但模拟计算机的计算元件以完美的并行方式工作，没有数字计算中经常遇到的同步问题。\n\
    \n### 1.2 直接与间接类比\n\n就类比而言，有必要区分 *直接* 和 *间接* 类比，它们取决于所解决问题的底层原理以及用于解决它们的类比。简而言之，直接类比基本上植根于与相应问题相同的物理原理，例如用肥皂泡模拟最小曲面、用带加热器和热电偶的金属板研究热流模式等。如果问题和模拟计算机的底层物理原理不同，则该计算机称为间接模拟计算机。\n\
    \n在本书记述的其余部分中，仅考虑间接类比，因为它们在应用上比其直接对应物更具通用性。通常，这类机器基于模拟电子计算元件，如求和器、积分器、乘法器等。\n\n\
    尽管听起来矛盾，模拟计算机可以使用纯数字元件实现。两种此类机器是 *数字微分分析器* (*DDAs*) 和 *随机计算机*，多年来已建造了此类机器的示例，虽然它们会周期性复兴，但从未进入计算主流。对这些机器的编程基本上遵循与对模拟电子模拟计算机编程相同的思路（简单\n"
