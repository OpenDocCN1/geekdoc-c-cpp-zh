    # 6.15 Chua attractor


    A much more complex chaotic system, the CHUA-oscillator, is described in this
    section. This system was discovered in 1983 by LEON ONG CHUA and is a classic
    example of an electronic circuit exhibiting chaotic behaviour. This oscillator
    generates a unique and particularly beautiful attractor called the Double Scroll
    attractor. At its heart is a (hypothetical) nonlinear device called a CHUA-diode.'
  - '[PAGE 162]


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_0.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_1.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_2.png)


    Fig. 6.40. Typical behaviour of the LORENZ-84 system, the three screen shots show
    x vs. y, z vs. z, and y vs. z


    The mathematical description of this particular oscillator is based on three coupled
    differential equations of the form


    ```

    \dot{x} = c_1 (y - x - f(x)),    (6.36)

    \dot{y} = c_2 (x - y + z), and    (6.37)

    \dot{z} = -c_3 y                 (6.38)

    ```


    where f(x) describes the behaviour of the CHUA-diode and is defined as


    ```

    f(x) = m_1 x + (m_0 - m_1)/2 (|x + 1| - |x - 1|).    (6.39)

    ```


    The standard values for the parameters are


    +   - c₁ = 15.6,

    +   - c₂ = 1,

    +   - c₃ = 28,

    +   - m₀ = −1.143, and

    +   - m₁ = −0.714.'
  - '[PAGE 163]


    Scaling this system of coupled differential equations is not simple due to its
    pronounced non-linear behaviour. The ranges of the various terms were determined
    by computing example solutions on a digital computer—a technique that was already
    used in the 1960s. These results were then used to guide the scaling process.
    To simplify the overall process, equations (6.37), (6.38), and (6.39) were split
    into individual terms resulting in the following set of scaled equations. (6.36)
    is replaced by


    $$\begin{aligned}

    x_0 &= 0.1 && (6.40)\\

    x_1 &= -10(x+f(x)) && (6.41)\\

    x_2 &= y+\frac{1}{2}x_1 && (6.42)\\

    x &= 3.12\int x_2\,dt+x_0 && (6.43)

    \end{aligned}$$


    where (6.40) represents the initial condition for the integration.


    (6.37) is split into


    $$\begin{aligned}

    y_1 &= z-\frac{1}{8}y && (6.44)\\

    y_2 &= 1.25x+2y_1 && (6.45)\\

    y &= 4\int y_2\,dt && (6.46)

    \end{aligned}$$


    while (6.38) becomes


    $$z=-\int 3.5y\,dt. \qquad (6.47)$$


    The implementation of the central element, the CHUA-diode, is quite costly as
    the implementation of each of the absolute value functions requires at least two
    diodes and an op amplifier. $f(x)$ is broken down and scaled like this:


    $$\begin{aligned}

    f_1 &= |0.7143x+0.2857| && (6.48)\\

