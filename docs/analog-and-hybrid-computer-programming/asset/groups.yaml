    ### B.1.2 德尔塔函数

    在许多情况下，DIRAC德尔塔函数¹⁵⁶ δ(t) 被用作动态系统的输入。¹⁵⁷ 它的宽度为零，但满足


    ∫_{-∞}^{∞} δ(t) dt = 1


    因此通常被称为单位脉冲。它可以理解为单位阶跃函数 u(t) 的导数。因此，其拉普拉斯变换可以通过分部积分推导如下：


    ℒ{δ(t)} = ∫_{0-}^{∞} (d/dt u(t)) e^{-st} dt = [u(t)e^{-st}]_{0-}^{∞} - ∫_{0-}^{∞}
    u(t)(-s e^{-st}) dt = 0 + s ∫_{0-}^{∞} e^{-st} dt


    如前所述，代入 φ = -st 可得 dt = -1/s dφ，因此


    s ∫_{0-}^{∞} e^{-st} dt = - ∫_{0-}^{∞} e^{φ} dφ = [e^{-st}]_{0-}^{∞} = 1。


    因此，ℒ{δ(t)} = 1。


    ### B.1.3 斜坡函数

    另一个基本函数是斜坡函数


    f(t) = { 0  t < 0 ; a t  t > 0 }


    其拉普拉斯变换可以如下利用分部积分推导：


    ℒ{f(t)} = a ∫_{0-}^{∞} t e^{-st} dt = a ( [ - t e^{-st} / s ]_{0-}^{∞} - ∫_{0-}^{∞}
    e^{-st} / s dt ) (B.4)


    再次代入 \(\varphi=-st\) 可得


    \[

    -\int_{0}^{\infty}\frac{e^{-st}}{s}\,dt=\frac{1}{s^{2}}\int_{0}^{\infty}e^{-\varphi}\,d\varphi=\left[\frac{e^{-st}}{s^{2}}\right]_{0}^{\infty}.
    \tag{B.5}

    \]


    结合 (B.4) 和 (B.5) 得到


    \[

    \mathcal{L}(f(t))=a\left[\frac{te^{-st}}{s}-\frac{e^{-st}}{s^{2}}\right]_{0}^{\infty}-a\left[\frac{(st+1)e^{-st}}{s^{2}}\right]_{0}^{\infty}=\frac{a}{s^{2}}.

    \]


    ### B.1.4 指数函数和三角函数

    指数函数的拉普拉斯变换具有如下形式


    \[

    \mathcal{L}(e^{-at})=\int_{0}^{\infty}e^{-at}e^{-st}\,dt=\left[\frac{e^{-(s+a)t}}{-(s+a)}\right]_{0}^{\infty}=\frac{1}{s+a}.

    \]


    基本的三角函数也可以利用以下恒等式直接进行变换


    \[

    \sin(\varphi)=\frac{e^{i\varphi}-e^{-i\varphi}}{2i}

    \] 以及


    \[

    \cos(\varphi)=\frac{e^{i\varphi}+e^{-i\varphi}}{2}.

    \]


    利用 (B.6) 得到


    \[

    \begin{aligned}

    \mathcal{L}(\sin(\omega t))&=\int_{0}^{\infty}\sin(\omega t)e^{-st}\,dt

    =\int_{0}^{\infty}\left(\frac{e^{i\omega t}-e^{-i\omega t}}{2i}\right)e^{-st}\,dt\\

    &=\frac{1}{2i}\int_{0}^{\infty}\left(e^{(i\omega-s)t}-e^{-(i\omega+s)t}\right)dt

    =\left[\frac{e^{(i\omega-s)t}}{i\omega-s}\right]_{0}^{\infty}-\left[\frac{e^{-(i\omega+s)t}}{-i\omega-s}\right]_{0}^{\infty}\\

    &=\frac{1}{2i}\left(\frac{1}{-s+i\omega}-\frac{1}{-s-i\omega}\right)=\frac{\omega}{s^{2}+\omega^{2}}.

    \end{aligned}

    \]


    利用 (B.7) 可以类似地推导出关系式


    \[

    \mathcal{L}(\cos(\omega t))=\frac{s}{s^{2}+\omega^{2}}

    \]


    158\quad 可以证明 \(\mathcal{L}(t^n)=\frac{n!}{s^{n+1}}\)。


    ## B.2 基本运算的拉普拉斯变换

    当计算的是运算而非简单函数的拉普拉斯变换时，情况才真正变得有趣。下面针对函数的时间导数和时间积分进行说明。设


    $f(t)=\frac{dx}{dt}$


    则使用分部积分得到


    $\mathcal{L}\{f(t)\}=\int_{0^-}^{\infty}\frac{dx}{dt}e^{-st}\,dt$

    $=\left[xe^{-st}\right]_{0^-}^{\infty}-\int_{0^-}^{\infty}-sxe^{-st}\,dt$

    $=s\mathcal{L}\{x\}-x(0^-).$


    这里 $x(0^-)$ 表示 $x$ 在 $t=0^-$ 处的初值。有趣的事实是，函数 $f(t)$ 的时间导数可以转化为该函数拉普拉斯变换与 $s$ 相乘这一简单得多的运算。这也可以推广到更高阶导数。由


    $f(t)=\frac{d^2x}{dt^2}$


    可得


    $\mathcal{L}\{f(t)\}=\int_{0^-}^{\infty}\frac{d^2x}{dt^2}e^{-st}\,dt=s^2\mathcal{L}\{f(t)\}-sx(0^-)-\left[\frac{dx}{dt}\right]_{t=0}$


    依此类推。


    如果乘以 $s$ 是时间导数的变换，那么自然会猜测积分将变换为除以 $s$。事实正是如此。设


    $f(t)=\int_{0^-}^{t}x\,dt+c$


    其中 $c$ 为实常数。其拉普拉斯变换为


    $\mathcal{L}\{f(t)\}=\int_{0^-}^{\infty}\left(\int_{0^-}^{t}x\,dt\right)e^{-st}\,dt+\frac{c}{s}$


    = \left[ -\frac{1}{s} e^{-st} \int_{0-}^{t} x \,dt \right]_{0-}^{\infty} + \frac{1}{s}
    \int_{0-}^{\infty} x e^{-st} \,dt + \frac{c}{s}


    = \frac{1}{s} \mathcal{L}(f(t)) + \frac{c}{s}.


    常数 $\frac{c}{s}$ 是积分的初值。


    ## B.3 进一步的性质

    给定两个函数 $f(t)$ 和 $g(t)$，它们的拉普拉斯变换分别为 $F(s)$ 和 $G(s)$，该变换具有以下有用性质：


    $\mathcal{L}(\lambda f(t) + g(t)) = \lambda F(s) + G(s)$ \quad\quad (线性)

    $\mathcal{L}(f(\lambda t)) = \frac{1}{\lambda} F\left(\frac{s}{\lambda}\right)$
    \quad\quad (尺度因子)

    $\mathcal{L}(e^{-\beta t} f(t)) = F(s + \beta)$ \quad\quad (指数衰减)

    $\mathcal{L}(f(t - T) u(t - T)) = e^{-T s} F(s)$ \quad\quad (时移)

    $\mathcal{L}((f * g)(t)) = F(s) G(s)$ \quad\quad (卷积，参见 (C.1))


    ## B.4 拉普拉斯逆变换

    拉普拉斯逆变换定义为


    $f(t) = \mathcal{L}^{-1}(F(s)) = \frac{1}{2\pi i} \lim_{T \to \infty} \int_{\gamma
    - iT}^{\gamma + iT} e^{st} F(s) \, ds$


    其中 $\gamma \in \mathbb{R}$ 表示复数平面中的一条垂直线。选择 $\gamma$ 使得 $F(s)$ 的所有奇点都位于其左侧。此变换称为
    Bromwich 积分，以 THOMAS JOHN L''ANSON BROMWICH 的名字命名，通常使用留数定理求解。$^{160}$


    通常，为了避免这一过程，会使用函数及其拉普拉斯变换的表格，例如：


    $\mathcal{L}\{\delta(t)\}=1$

    $\mathcal{L}\{\delta(t-T)\}=e^{-Ts}$

    $\mathcal{L}\{u(t)\}=\frac{1}{s}$

    $\mathcal{L}\{\frac{1}{\sqrt{\pi t}}\}=\frac{1}{\sqrt{s}}$

    $\mathcal{L}\{t^n\}=\frac{n!}{s^{n+1}}$

    $\mathcal{L}\{t^n e^{-at}\}=\frac{n!}{(s+a)^{n+1}}$

    $\mathcal{L}\{\frac{1}{a}(1-(1+at)e^{-at})\}=\frac{1}{s(s+a)^2}$

    $\mathcal{L}\{\frac{e^{-at}-e^{-bt}}{b-a}\}=\frac{1}{(s+a)(s+b)}$

    $\mathcal{L}\{\sin(\omega t)\}=\frac{\omega}{s^2+\omega^2}$

    $\mathcal{L}\{\cos(\omega t)\}=\frac{s}{s^2+\omega^2}$

    $\mathcal{L}\{e^{-at}\sin(\omega t)\}=\frac{\omega}{(s+a)^2+\omega^2}$

    $\mathcal{L}\{e^{-at}\cos(\omega t)\}=\frac{s+a}{(s+a)^2+\omega^2}$

    $\mathcal{L}\{\sinh(\omega t)\}=\frac{\omega}{s^2-\omega^2}$

    $\mathcal{L}\{\cosh(\omega t)\}=\frac{s}{s^2-\omega^2}$

    $\mathcal{L}\{\frac{\sqrt{a^2+\omega^2}}{\omega}\sin(\omega t+\tan^{-1}(\frac{\omega}{a}))\}=\frac{s+a}{s^2+\omega^2}\quad\text{(B.8)}$

    $\mathcal{L}\{\frac{\sin(\omega t)}{t}\}=\arctan\left(\frac{\omega}{s}\right)$


    ## B.5 示例

    使用拉普拉斯变换求解如下微分方程


    $\ddot{x}+x=\delta(t)$


    相当直接。首先，对方程两边同时进行变换得到


    $s^2\mathcal{L}\{x\}-s x(0-)-[\dot{x}]_{t=0}+\mathcal{L}\{x\}=1.$


    利用模拟计算元件，可以方便地建立由方框图及相应传递函数描述的复杂系统的仿真。


    关于这一超出本书范围的技术的细节，可在 [SENSICLE 1968]、[JOHNSON 1956, pp. 45 ff.]、[GILOI et al. 1963,
    pp. 288 ff.]、[CARLSON et al. 1967, pp. 191 ff.]、[SYDOW 1964, pp. 128] 及其他经典教材中找到。很好的应用实例描述于
    [WEEDY et al. 1998] 和 [GILES 1976]。


