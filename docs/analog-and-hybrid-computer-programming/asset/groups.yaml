    ## 6.13 Lorenz attractor


    Another, even more famous, chaotic system is the intriguing LORENZ-attractor developed
    in 1963 by EDWARD NORTON LORENZ as a simplified model for atmospheric convection
    and first described in [LORENZ 1963]. Although this seminal work was performed
    on a digital computer, a Royal McBee LGP-30, the LORENZ-attractor is, of course,
    ideally suited to being implemented on an analog computer as will be shown below.


    This dynamic chaotic attractor is described by the following system of three coupled
    differential equations:


    ```

    \dot{x} = \sigma(y - x)

    \dot{y} = x(\rho - z) - y

    \dot{z} = xy - \beta z

    ```


    The parameters are σ = 10, β = 8/3, and ρ = 28. Obviously, this set of DEQs must
    be scaled in order to be implemented on an analog computer. The resulting scaled
    equations look like this:


    ```

    x = \int (1.8y - x) dt + C

    s = 1 - 2.678z

    y = \int (1.5556xs - 0.1y) dt

    z = \int (1.5xy - 0.2667z) dt

    ```


    C denotes the initial condition of the integrator yielding x and is not critical.
    Taking into account that every summer and integrator of an analog computer performs
    an implicit change of sign and further noting that xy = -x(-y), these equations
    can be further simplified saving two inverters in the resulting computer setup:


    ```

    -x = - \int (1.8y - x) dt + C

    ```


    ![](img/91599d88757ed8c75960eb83f4f85a12_159_0.png)


    Fig. 6.45. Computer setup for the Lorenz attractor (the value of 0.2667 in the
    feedback of the second integrator can be decreased to about 0.125 to yield a nice
    result)


    ![](img/91599d88757ed8c75960eb83f4f85a12_161_0.png)


    Fig. 6.48. Program for the chaotic LORENZ-84 system


    \dot{x} = -y^2 - z^2 - a x + a f,

    \dot{y} = x y - b x z - y + g, and

    \dot{z} = b x y + x z - z


    with the parameters $a = \frac{1}{4}$, $b = 4$, $f = 8$, and $g = 1$.


    Scaling this system is pretty straight-forward as a quick numerical experiment
    shows that $|x|$ and $|y|$, $|z|$ are bounded by 2. The resulting analog computer
    program is shown in figure 6.48. Tweaking the parameters is quite interesting
    and a typical set of solutions is shown in figure 6.49.


    ## 6.15 Chua attractor


    A much more complex chaotic system, the CHUA-oscillator, is described in this
    section. This system was discovered in 1983 by LEON ONG CHUA and is a classic
    example of an electronic circuit exhibiting chaotic behaviour. This oscillator
    generates a unique and particularly beautiful attractor called the Double Scroll
    attractor. At its heart is a (hypothetical) nonlinear device called a CHUA-diode.


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_0.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_1.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_2.png)


    Fig. 6.40. Typical behaviour of the LORENZ-84 system, the three screen shots show
    x vs. y, z vs. x, and y vs. z


    The mathematical description of this particular oscillator is based on three coupled
    differential equations of the form


    ```

    \dot{x} = c_1 (y - x - f(x)),    (6.36)

    \dot{y} = c_2 (x - y + z), and    (6.37)

    \dot{z} = -c_3 y                 (6.38)

    ```


    where f(x) describes the behaviour of the CHUA-diode and is defined as


    ```

    f(x) = m_1 x + (m_0 - m_1)/2 (|x + 1| - |x - 1|).    (6.39)

    ```


    The standard values for the parameters are

    - c₁ = 15.6,

    - c₂ = 1,

    - c₃ = 28,

    - m₀ = −1.143, and

    - m₁ = −0.714.


    Scaling this system of coupled differential equations is not simple due to its
    pronounced non-linear behaviour. The ranges of the various terms were determined
    by computing example solutions on a digital computer—a technique that was already
    used in the 1960s. These results were then used to guide the scaling process.
    To simplify the overall process, equations (6.37), (6.38), and (6.39) were split
    into individual terms resulting in the following set of scaled equations. (6.36)
    is replaced by


    $$\begin{aligned}

    x_0 &= 0.1 && (6.40)\\

    x_1 &= -10(x+f(x)) && (6.41)\\

    x_2 &= y+\frac{1}{2}x_1 && (6.42)\\

    x &= 3.12\int x_2\,dt+x_0 && (6.43)

    \end{aligned}$$


    where (6.40) represents the initial condition for the integration.


    (6.37) is split into


    $$\begin{aligned}

    y_1 &= z-\frac{1}{8}y && (6.44)\\

    y_2 &= 1.25x+2y_1 && (6.45)\\

    y &= 4\int y_2\,dt && (6.46)

    \end{aligned}$$


    while (6.38) becomes


    $$z=-\int 3.5y\,dt. \qquad (6.47)$$


    The implementation of the central element, the CHUA-diode, is quite costly as
    the implementation of each of the absolute value functions requires at least two
    diodes and an op amplifier. $f(x)$ is broken down and scaled like this:


    $$\begin{aligned}

    f_1 &= |0.7143x+0.2857| && (6.48)\\

    f_2 &= |0.7143x-0.2857| && (6.49)\\

    f_3 &= f_1-f_2 && (6.50)\\

    f(x) &= -0.714x-0.3003f_3 && (6.51)

    \end{aligned}$$


    Deriving a computer setup from these equations is straightforward. The first set
    of equations, (6.40, 6.41, 6.42, 6.43), is implemented as shown in figure 6.50.
    The second set of equations (6.44, 6.45, 6.46, 6.47) are implemented as shown
    in figure 6.51.


    It may be necessary to add small capacitors between the summing junction and the
    output of each of the two op amplifiers in the circuit for $f(x)$, if the setup
    shows signs of instability. Figure 6.52 shows the program for (6.48), (6.49),
    (6.50), and (6.51).


    ![](img/91599d88757ed8c75960eb83f4f85a12_165_0.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_165_1.png)


