    # 6.19 Rotating spiral


    The following example displays a rotating spiral on an oscilloscope and is a real
    eye-catcher. It creates a three-dimensional spiral on an oscilloscope screen using
    a circuit like the one shown in figure 6.44 in section 6.12. Since continuous
    rotation is required the two potentiometers which give the values sin(φ) and cos(φ)
    in that program are replaced by a simple harmonic oscillator yielding a sin(ωt)
    and cos(ωt) signal pair.103


    Figure 6.61 shows the overall computer setup. At the top is a harmonic oscillator
    running at high speed with a time scale factor of k0 = 10³ or, even better, k0
    = 10⁴. The potentiometer α determines the amount of damping and thus the form
    of the spiral. A three-dimensional spiral requires another time-dependent variable
    τ, which is generated by the integrator in the middle of the schematic and which
    has a time scale factor of k0 = 10². These three integrators run in repetitive
    mode with an operating time of 20 ms.


    The oscillator at the bottom of figure 6.61 generates an undamped sine/cosine
    signal pair and is run in continuous mode with its time scale factor set to k0
    = 1. The two oscillator integrators are externally controlled by connecting their
    respective ModeIC inputs to +1 using a manual switch. If the switch is open,104
    these integrators are in IC-mode. With the switch closed both integrators are
    set to OP-mode. The actual projection of the three-dimensional spiral onto two
    dimensions is done by the two multipliers followed by a summer shown in the middle
    of the schematic.


    Figure 6.62 shows two typical snapshots of the rotating spiral. In both cases
    the rotation had been stopped by placing the two oscillator integrators at the
    bottom of figure 6.61 into HLT-mode by means of their ModeOP-inputs (not shown
    in the setup). The left picture was taken with the time scale factors of the two
    topmost integrators set to k0 = 10³ while the right picture corresponds to k0
    = 10⁴. If the integrators used do not offer this time scale factor directly, additional
    input resistors giving a sufficiently large input weight can be connected to their
    SJ inputs. Input weights of up to 100 may be achieved by this technique.


    # 6.20 Flow around an airfoil


    The program described in this section simulates the flow of air around a special
    type of airfoil, a JOUKOWSKY airfoil105 The basic idea is to simulate the flow
    of air'
