    ## 6.8 Rutherford scattering


    In the early 20th century Ernest Rutherford performed a seminal experiment in
    which he bombarded a thin gold foil with \(\alpha\)-particles.[89] He observed
    that the vast majority of these particles just went through the gold foil without
    being deflected or absorbed. Nevertheless, some of these particles were deflected
    through large angles with even fewer \(\alpha\)-particles being reflected by the
    gold foil, a phenomenon called Rutherford scattering. This led to the planetary
    Rutherford model of the atom, which then became the basis of the Bohr model.


