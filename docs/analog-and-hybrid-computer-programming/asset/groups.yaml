    ## 函数发生器：


    大多数函数发生器基于使用偏置二极管，通过折线来逼近函数。如有可能，建议采用其他方法（如泰勒逼近等）来生成特殊函数。由于函数发生器设置耗时，并且用多边形逼近通常光滑的函数会引入误差，因此它们是最后的手段。


    ![](img/91599d88757ed8c75960eb83f4f85a12_50_0.png)


    图 2.28. 通过将对数相加并取反对数实现乘法


    另一种在历史上更广泛采用的乘法器实现方式利用了一个事实：


    xy = 1/4 ((x + y)^2 - (x - y)^2)。


    这种方式只需要两个函数发生器，而不是上述对数技术所需的三个。同样，自变量不再局限于正区间。由于它使用两个平方函数并乘以 1/4 因子，这类乘法器被称为四分之一平方乘法器（quarter
    square multiplier）。它的实现通常需要其两个自变量 e0 和 e1 的正负版本。通常这些值在周围的计算机设置中已经现成可用。如果没有，则使用专用反相器（只有单输入的加法器）。


    允许自变量 -1 ≤ e0 ≤ +1 和 -1 ≤ e1 ≤ +1 的乘法器通常称为四象限乘法器，与之相对的是两象限乘法器，后者仅在笛卡尔坐标系的四个象限中的两个象限产生结果。


    图 2.29 展示了一个现代的 Analog Paradigm MLT8 乘法器模块，其中包含八个独立的四象限吉尔伯特单元乘法器。


    图 2.30 显示了一个简单应用，其中乘法器与积分器配合使用来生成抛物线。积分器产生从 +1 到 -1 的线性电压斜坡，该斜坡被馈入乘法器的两个输入端，乘法器再在其输出端产生抛物线函数。


    > **乘法等：**

    > 许多传统模拟计算机采用四分之一平方乘法器，这种乘法器需要同时具备正号和负号的两个输入变量。通过交换 x 或 y 的两个输入，即可实现结果符号的反转，而无需额外的反相器。


    ![](img/91599d88757ed8c75960eb83f4f85a12_53_0.png)


    图 2.34. 四路比较器模块


    时间延迟以及同一时刻触发的不同继电器开关闭合和断开的时间变化，可能会给计算带来相当大的误差。只要可能，就应使用电子开关与比较器配合。


    许多经典模拟计算机中与比较器配合使用的继电器相当脆弱，可能会因插接错误而损坏，例如通过其触点将 m− 与 m+ 短路。


    与机电继电器不同，电子开关通常具有专用输入和输出。


    ## 2.9 输入/输出设备


    模拟电子模拟计算机非常适合直接与使用模拟信号的传感器和执行器接口。因此，可用于模拟计算机的输入/输出设备种类繁多。两种最常见的输出设备是笔式绘图仪和示波器。笔式绘图仪通常用于将模拟计算机设置为单次运行模式，允许在
    x、y 模式下绘制一条函数曲线；而示波器通常与重复运算配合使用，或者与长时间处于 OP 模式的模拟计算机配合使用。这


