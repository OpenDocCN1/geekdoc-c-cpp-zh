    to avoid the ever-increasing amplitude that would otherwise inevitably result.
    These two measures will, of course, cause some, but normally negligible, distortion
    of the resulting waveform, especially when the sine/cosine signals are used to
    drive some sort of display.


    Figure 4.11 shows a typical setup of a quadrature generator with amplitude stabilization:
    At its heart is the circuit shown before with the difference that the central
    feedback loop uses integrator inputs weighted with 10 so that the overall time
    scale factor is 10ω₀. The potentiometer labelled α introduces some positive feedback
    into the loop thus steadily increasing the amplitude of the output signal. Depending
    on the analog computer used this positive feedback may be unnecessary. If the
    amplitude decreases without it, it is sufficient to set α to a very small value
    (less than 10⁻², typically). To avoid running into an overload this some negative
    feedback is necessary to keep the overall amplitude stabilized. This is implemented
    by the potentiometer α* which is one of the rare cases where a free potentiometer
    is required. The output (wiper) of that potentiometer is connected to a diode
    that is in turn connected to an integrator input weighted with 1.


    The idea here is to apply a negative bias to the diode so that it starts conducting
    only when the output of the leftmost integrator is higher than this bias voltage.
    Then the diode will start conducting, essentially implementing a negative feedback
    loop (with negative exponential characteristics). It is important that the weight
    of the input connected to the diode is at least a factor 10 smaller than the input
    for the main feedback loop.


    This setup works well on analog computers with buffered coefficient potentiometers,
    such as the Analog Paradigm Model-1 used here. If a classic analog computer without
    buffered potentiometers is used, the cathode of the diode connected to the potentiometer
    α* should be connected to the summing junction of the leftmost integrator.⁴⁰'
