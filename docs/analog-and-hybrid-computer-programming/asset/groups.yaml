    # 5.6 Ideal diode


    Diodes are very useful components as they let current pass only in one direction
    – at least that is what an ideal diode should do. Real diodes have some nasty
    traits. First of all, they exhibit some forward threshold voltage, i.e. they won’t
    start conducting exactly when their input crosses zero but only when it exceeds
    the small voltage that is an intrinsic characteristic of every diode. These threshold
    voltages are typically between 0.2 V for SCHOTTKY diodes and can go up to 0.7
    V for a classic silicon diode.


    Using an open amplifier a real diode can be readily transformed into an almost
    ideal diode using the setup shown in figure 5.15. The amplifier has two feedback
    paths. One connects its output via a diode to its summing junction, thus limiting
    its output to (near) zero when this diode starts conducting. The second path runs
    through a second diode to one of the inputs of the summer, causing it to behave
    like a classic inverter when this diode starts conducting. Accordingly, the output
    of the amplifier will be higher than the output of the overall circuit by the
    amount of threshold voltage of the diode used.'
  - '[PAGE 99]


    ![](img/91599d88757ed8c75960eb83f4f85a12_99_0.png)


    Fig. 5.16. Behaviour of the circuit shown in figure 5.15


    ![](img/91599d88757ed8c75960eb83f4f85a12_99_1.png)


    Fig. 5.17. Behaviour of the circuit shown in figure 5.15 with both diodes reversed


    In some cases it may be necessary to connect a small capacitor (about 68 pF) between
    the summer''s output and its summing junction to avoid instabilities.


    Obviously, a comparator with an associated (electronic) switch can also be used
    to implement an ideal-diode look-alike. In this case, one input of the switch
    is left open or is grounded while the other is connected to the input signal,
    which is also connected to the comparator input. Since all comparators exhibit
    some hysteresis to ensure stable operation, this setup may result in non-negligible
    errors of the diode-approximation. This setup should be avoided on a classic machine
    which uses electro-mechanical relays in conjunction with its comparators because
    relays exhibit significant variations in their closing time as well as contact
    bounce.


    # 5.7 Absolute value


    An idealized diode can now be used to implement an absolute value function. A
    typical setup is shown in figure 5.18. The left half of the circuit is the ideal
    diode circuit shown before. Its output feeds two paralleled inputs of a second
    summer. These two inputs behave like a single input weighted with 2. A third input
    of the second summer is directly connected to the input of the overall circuit.


    When the output of the diode circuit is at zero, which is the case for a negative
    input value, the second summer acts as a simple inverter yielding a positive output.
    As soon as x > 0 the idealized diode starts conducting and yields −x. The summer
    on the right now computes x − 2x = −x again yielding a positive output. Figure
    5.19 shows the behaviour of this circuit. As before, it might be necessary to
    add one or two small capacitors to improve the stability of the circuit.


