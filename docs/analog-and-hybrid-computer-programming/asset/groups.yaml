  - '[PAGE 22]


    On the other side of the Atlantic, PHILBRICK''s electronic analog computer, named
    *Polyphemus* due to its peculiar appearance with a single oscilloscope mounted
    in the top position of its rack, was not aimed at military applications at all.
    His machine was designed and used to solve problems that typically arise in process
    control in the chemical industry.


    MACNEE''s machine, developed at MIT, was a purely academic research instrument
    and probably the first high-speed electronic analog computer capable of *repetitive
    operation*, in which a problem is solved over and over again at such high speed
    that a (nearly) flicker-free picture of the solution can be displayed on an oscilloscope
    screen.


    From today''s perspective, these early analog computers seem quite familiar. Except
    for their particular implementation with vacuum tubes, they already featured all
    of the typical analog computing elements such as summers, integrators, multipliers,
    function generators etc. Furthermore, they were programmed employing the same
    techniques that are still used today. More information on the history of analog
    computing can be found in [ULMANN 2013]⁹ and [SMALL 2001].


    # 1.4 Characteristics of analog computers


    Although computing by setting up indirect analog computers by myriads of interconnecting
    wires looks like a disadvantage at first sight, it is probable that this method
    of programming will soon be replaced by intricate and highly integrated cross-bar
    switches controlled by an accompanying digital computer. But even with a traditional
    patch panel interconnecting a variety of computing elements instead of having
    an algorithm stored in some memory has some tremendous advantages.


    First of all, there is no need for memory lookup operations at all in an analog
    computer, speeding up the overall computation considerably. Further, without any
    memory there is nothing like a *critical section*, no need to synchronize things,
    no communications overhead, nothing of the many trifles that haunt traditional
    parallel digital computers. There is no equivalent of *AMDAHL''s law*¹⁰ in the
    realm of analog computation. All computing elements work in perfect parallelism.


    Another basic advantage of analog computers is their extremely low power consumption,
    which easily outperforms classic digital computers. This makes analog computing
    attractive for applications where low power consumption is of utmost importance,
    such as medical application, embedded devices powered by energy harvesting etc.
    Furthermore, analog computers are ideal for high performance'
  - '[PAGE 23]


    computing (HPC) where power is available in abundance and sheer computing power
    is required.


    Finally, analog computers are not prone to problems such as poor stability as
    is sometimes the case with numerical algorithms for classic digital computers
    operating on floating point numbers. Even *stiff* differential equations are normally
    easily solvable by an analog computer whilst many numerical procedures require
    at least excessive run-times for such problems.


    These characteristics of analog computers have led to the recent and impressive
    increase in interest in this particular model of computation. The most common
    form of an analog computer in the near future will be as part of a hybrid computer
    setup, i.e. closely coupled with a digital computer, thereby relieving it from
    calculations involving differential equations etc.'
