    ## 第 6 章


    ## 示例


    以下章节描述了使用模拟计算机求解的各种不同复杂度的难题。在模拟计算机上重现这些解法不仅极具启发性，而且非常有收获，最后但并非最不重要的是，很有趣。


    ### 6.1 化学动力学


    化学、生物学、药学等领域的一个核心问题是描述和分析化学反应发生的速率。在此背景下有两个重要的通用术语。首先是物质 A 转化为产物 X 的反应速度，该过程通常表示为
    $A \rightarrow X$。第二个术语是反应级数，它描述了反应速度对反应中各种物质浓度依赖性的情况：


    - **0 级：** 反应速度恒定。当参与反应的物质充足时通常如此。

    - **1 级：** 这描述了反应 $A \rightarrow X$，遵循方程 $-\dot{a}=ka$，其中 $k$ 是描述反应速度的常数。

    - **2 级：** 形式为 $A+B \rightarrow X$ 或 $A+A \rightarrow X$ 的反应，遵循 $-\dot{a}=kab$
    或 $-\dot{a}=ka^2$，如果仅需要试剂 A。


    ![](img/91599d88757ed8c75960eb83f4f85a12_124_0.png)


    **图 6.3.** 方程 $\dot{a}=\dot{b}=-kab$ 的设置


    ![](img/91599d88757ed8c75960eb83f4f85a12_124_1.png)


    **图 6.4.** 反应 $A+B\xrightarrow{k}C$ 的典型仿真结果


    得到方程 $\dot{a}=\dot{b}=-kab$，该方程可轻松转换为图 6.3 所示的程序。这给出了图 6.4 所示的典型结果。


    像这样的两步反应系统


    $$

    A \xrightarrow{k_1} B \xrightarrow{k_2} C

    $$


    可以由以下一组耦合微分方程描述


    $$

    \begin{aligned}

    \dot{a} &= -k_1a \\

    \dot{b} &= k_1a-k_2b \text{ and} \\

    \dot{c} &= k_2b.

    \end{aligned}

    $$


    ![](img/91599d88757ed8c75960eb83f4f85a12_125_0.png)


    图 6.5. 反应 $A \xrightarrow{k_1} B \xrightarrow{k_2} C$ 的计算机设置


    ![](img/91599d88757ed8c75960eb83f4f85a12_125_1.png)


    图 6.6. 反应 $A \xrightarrow{k_1} B \xrightarrow{k_2} C$ 的仿真结果


    图 6.5 和 6.6 显示了该问题的程序和典型结果。⁷⁶


    MICHAELIS-MENTEN 动力学是酶动力学的一个经典模型，其形式为


    $$

    S + E \underset{k_1}{\stackrel{k_2}{\rightleftharpoons}} \varepsilon \xrightarrow{k_3}
    P + E,

    $$


    其中 $S$、$E$、$\varepsilon$ 和 $P$ 分别表示底物、酶、酶-底物复合物和反应的最终产物的浓度。右侧的游离酶可用于新的酶-底物复合物，即酶在整个过程中不会被消耗。⁷⁷
    该系统由以下一组方程描述：⁷⁸


    $$

    \begin{aligned}

    \dot{s} &= -k_1 e s + k_2 \varepsilon \\

    \dot{e} &= -k_1 e s + (k_2 + k_3) \varepsilon \\

    \dot{\varepsilon} &= k_1 e s - (k_2 + k_3) \varepsilon \\

    \dot{p} &= k_3 \varepsilon

    \end{aligned}

    $$


    图 6.7 显示了由此产生的计算机设置，而图 6.8 显示了典型的仿真结果。


    ![](img/91599d88757ed8c75960eb83f4f85a12_129_0.png)


    图 6.11. 显示混沌行为的典型仿真结果


    ### 6.3 马修方程


    以下章节基于另一个由著名的 MATHIEU 方程描述的振荡系统——一个具有许多应用的线性齐次二阶微分方程。它可用于描述椭圆鼓的振动、倒立摆的行为等等。81


    #### 6.3.1 引言


    MATHIEU 方程的一般形式为


    $$

    \ddot{y} + (a - 2q \cos(2t)) y = 0

    $$


    初始条件为


    $y_0 = 1$ and

    $\dot{y}_0 = 0$.


    根据 [EAI 1964]，通过令 $a := 2q$ 去掉参数 $a$。定义一个函数


    $$

    x(t) = 1 - \cos(2t) \tag{6.3}

    $$


    显著简化了方程，得出


    $$

    \ddot{y} + a x y = 0. \tag{6.4}

    $$


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_0.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_1.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_2.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_3.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_4.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_5.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_6.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_133_7.png)


    图 6.14. MATHIEU 方程在某些值 0 ≤ a/10 ≤ 1 下的典型解


    ![](img/91599d88757ed8c75960eb83f4f85a12_135_0.png)


    图 6.16. VAN DER POL 方程的最终计算机设置


    ![](img/91599d88757ed8c75960eb83f4f85a12_138_0.png)


    图 6.19. 生成势阱


    ![](img/91599d88757ed8c75960eb83f4f85a12_138_1.png)


    图 6.20. SCHRÖDINGER 方程的典型解


    这显示在上部波形中。接下来的两条曲线显示 $\Psi$ 和 $\Psi^2$。这里假设 $\Psi_0$ 为零，而 $\dot{\Psi}_0$ 在实验中设定，使得图
    6.18 中的两个积分器不会过载。


    模拟计算机的一个巨大优势，即参数变化易于测试，在此程序中变得非常清晰。改变 $E$、$V_0$、$\Psi_0$ 和 $\dot{\Psi}_0$ 可以很好地体会一维
    SCHRÖDINGER 方程的行为。


    ### 6.6 弹道轨迹


    以下示例计算从大炮发射的弹丸的二维弹道轨迹，同时考虑随速度变化的阻力，该阻力会减慢弹丸速度。这种阻力会导致轨迹偏离简单的对称抛物线，因为其后段路径比前段更陡。阻力
    $\delta(v)$ 假定为一般形式


    $$\delta(v) = r v^2 \tag{6.17}$$


    其中 $v = \sqrt{\dot{x}^2 + \dot{y}^2}$。


    这有点过于简化，因为根据 Siacci 例如，历史弹丸的真实阻力函数形式为


    $$\delta(v) = 0.2002v - 48.05 + \sqrt{9.6 + (0.1648v - 47.95)^2} + \frac{0.0442v(v
    - 300)}{371 + (v/200)^{10}}.$$


    然而，(6.17) 对于以下示例已足够。


    该二维问题中弹丸的一般运动方程为


    $$\ddot{x} = -\frac{\delta(v)}{m} \cos(\phi) \quad (6.18) \qquad \ddot{y} = -g
    - \frac{\delta(v)}{m} \sin(\phi) \quad (6.19)$$


    其中 $g$ 表示重力加速度，$v$ 表示弹丸速度，$m$ 为其质量。因此，$\cos(\phi) = \dot{x} / v$ 且 $\sin(\phi)
    = \dot{y} / v$。


    设质量 $m := 1$ 并重新排列 (6.18) 和 (6.19) 得到以下一组微分方程：


    $$

    \ddot{x} = -\frac{\delta(v)}{v} \dot{x}, \qquad \ddot{y} = -g - \frac{\delta(v)}{v}
    \dot{y}.

    $$


