    equations which describe the satellite''s trajectory in Cartesian coordinates:


    $\ddot{x}_3 = (x_1 - x_3) \frac{G}{\Delta r_{13}^3} + (x_2 - x_3) \frac{G}{\Delta
    r_{23}^3} \quad \text{and} \quad (6.31)$


    $\ddot{y}_3 = -y_3 \left( \frac{G}{\Delta r_{13}^3} + \frac{G}{\Delta r_{23}^3}
