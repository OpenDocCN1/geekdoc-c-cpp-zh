    *Fig. 6.87. Configuration of the inverted pendulum*


    The Lagrangian \(L = T - V\) is used where \(T\), as usual, represents the total
    kinetic energy while \(V\) is the potential energy of the system.[122] The total
    potential energy is


    \[

    V = mgl\cos(\varphi), \tag{6.72}

    \]


    with \(g\) representing the gravitational acceleration. The total kinetic energy
    is the sum of the kinetic energies of the pendulum bob having mass \(m\) and the
    moving cart with mass \(M\), i.e.


    \[

    T = \frac{1}{2}\left(Mv_c^2 + mv_p^2\right). \tag{6.73}

    \]


    where \(v_c\) is the velocity of the cart, and \(v_p\) is the velocity of the
    pendulum bob. Obviously,


    \[

    v_c = \dot{x} \tag{6.74}

    \]


    and (a bit less obviously)


    \[

    v_p = \sqrt{\left(\frac{d}{dt}(x-l\sin(\varphi))\right)^2 + \left(\frac{d}{dt}(l\cos(\varphi))\right)^2}

    \]


    The left term under the square root is


    \[

    (\dot{x}-l\dot{\varphi}\cos(\varphi))^2 = \dot{x}^{\,2} - 2\dot{x}l\dot{\varphi}\cos(\varphi)
    + l^2\dot{\varphi}^{\,2}\cos^2(\varphi)

    \]


    > [122] The following derivation follows basically https://en.wikipedia.org/wiki/Inverted_pendulum,
    retrieved March 29th, 2019.


    ![](img/91599d88757ed8c75960eb83f4f85a12_198_0.png)


    *Fig. 6.90. Display of the pendulum mounted on its cart*


    To generate a flicker-free display, an amplitude-stabilized quadrature signal
    pair \(\sin(\omega t)\) and \(\cos(\omega t)\) of some kHz is required; this can
    be derived from the computer setup shown in figure 4.11 or 4.13 in section 4.2.
    This signal is used to draw a circular or elliptical cart as well as the rotating
    pendulum rod mounted on the cart.


    The length of the rod is set by the potentiometer labelled \(l\). Since the pendulum
    rod has one of its ends fixed at the center of the cart figure, the \(\sin(\omega
    t)\)-signal has to be shifted by an amount \(r\). The actual rotation is done
    by multiplication with \(\sin(\varphi)\) and \(\cos(\varphi)\). The circuit yields
    two output signal-pairs: \(P_x\) and \(P_y\) are used to draw the pendulum rod
    while \(C_x\) and \(C_y\) display the moving cart. Therefore, an oscilloscope
    with two independent (multiplexed) \(x,y\)-inputs is required for this simulation,
    if both, cart and pendulum, are to be displayed. A screenshot of a typical resulting
    display with the pendulum just tipping over is shown in figure 6.91.


    What happens when the mass of the pendulum bob is no longer negligible? In this
    case equation (6.77) can no longer be simplified as before but must be fully taken
    into account to implement the influence of the swinging pendulum on the cart.
    Solving this equation for \(\ddot{x}\) yields


    \[

    \ddot{x} = \frac{1}{M + m} \left( F + m l \ddot{\varphi} \cos(\varphi) - m l \dot{\varphi}^2
    \sin(\varphi) \right)

    \]


    which can be easily transformed into a computer setup as shown in figure 6.92.


    ![](img/91599d88757ed8c75960eb83f4f85a12_199_0.png)


    *Fig. 6.91. Display of the pendulum mounted on its cart*


    ![](img/91599d88757ed8c75960eb83f4f85a12_199_1.png)


    *Fig. 6.92. Effect of a heavy mass pendulum on the moving cart*


    The function \(\ddot{x}\) generated by this circuit is now fed into the associated
    input of the subcircuit shown in figure 6.88. An external force acting on the
    cart can be introduced by means of switch \(S_1\) while \(\gamma_3\) controls
    the strength of this force.


    ## 6.26 Double pendulum


    Even more complicated but also more mesmerizing is the simulation on an analog
    computer of the double pendulum arrangement shown in figure 6.93.[125]


    The equations of motion will be derived as before by determining the Lagrangian
    \(L = T - V\) with the two generalized coordinates \(\varphi_1\) and \(\varphi_2\).
    \(T\) represents the total kinetic energy while \(V\) is the potential energy
    of the system. This potential energy is


    \[

    V=-g\left((m_1+m_2)l_1\cos(\varphi_1)+m_2l_2\cos(\varphi_2)\right) \tag{6.79}

    \]


    with \(m_1\) and \(m_2\) representing the masses of the two bobs mounted on the
    tips of the two pendulum rods (which are assumed as being weightless). As always,
    \(g\) represents the gravitational acceleration.


    > [125] This has also been done by [Mahrenholtz 1968, pp. 159–165] which served
    as an inspiration for this application note, especially for the display circuit.

