    标记为 α 和 α* 的电位器的设置之间存在一定的相互作用。由于 α 决定输出信号的初始幅度，因此应设置 α* 使二极管偏置电压与该初始幅度大小相同。如果
    α > α*，幅度稳定电路将在将计算机设置为 OP 模式后立即启动。这会导致幅度迅速减小，这通常是不期望的。


    图 4.12 显示了在模拟计算机设置为连续操作、ω = ½ 且 k0 = 10³ 时该电路的输出。示波器的 x 偏转仍如前设置为每格 2 ms。


