    图 6.28. \(y_0\) 的自动/手动生成


    ![](img/91599d88757ed8c75960eb83f4f85a12_147_1.png)


    图 6.29. 卢瑟福散射的模拟


    ## 6.9 天体力学


    模拟（或确定）具有给定参数的三个（天体）物体的运动，例如质量、引力常数、物体坐标和速度的初始条件，被称为 *三体问题*。[90] 首先解决这个问题的是艾萨克·牛顿爵士，在他的
    *Principia* 第一卷第 XI 节中，据乔治·比德尔·艾里爵士称，该章节被认为是“有史以来写过的关于物理科学的最有价值的章节”。[91]


    尽管在更简单的两体情况下存在解析解，约瑟夫-路易·拉格朗日能够为更困难的三体问题给出一些特定解。由于这些内容超出了本节范围，读者可参考标准文献 [BATTIN
    1999, pp. 365 ff.] 和 [MOULTON 1923, p. 363]。


    90. 这是 *n* 体问题的特例，这里将不再进一步研究。


    91. 参见 [MOULTON 1923, p. 363]。

