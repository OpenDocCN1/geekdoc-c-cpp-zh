    Notably, $l$ as an operator allows “calculating” with it as if it were a number
    or a function. A naturally occurring question concerns the powers of $l$ – what
    do these look like? $l^2 = l\{1\} = \left\{\int_0^t 1 d\tau\right\} = \{t\}$ $l^3
    = l\{t\} = \left\{\int_0^t \tau d\tau\right\} = \left\{\frac{1}{2}t^2\right\}$
    $l^4 = l\left\{\frac{1}{2}t^2\right\} = \left\{\frac{1}{2}\int_0^t \tau^2 d\tau\right\}
    = \left\{\frac{1}{6}t^3\right\}$ etc. This can be generalized to $l^n = \left\{\frac{t^{\,n-1}}{(n-1)!}\right\}$
    for $n \in \mathbb{N}.$


    ## APPENDIX D

    ### An oscilloscope multiplexer


    Most oscilloscopes provide at least two y-channels, which allow the display of
    two curves at once on the screen. Although this is often sufficient for work with
    an analog computer, sometimes it is desirable to have not only two y-inputs but
    several pairs of x- and y-inputs. This allows multiple figures, each defined by
    a corresponding x, y signal pair, to be displayed. Since this is not possible
    with most standard oscilloscopes the need for an x, y oscilloscope multiplexer
    arises.166


    Figure D.1 shows the schematic of a simple, yet powerful, four channel x, y oscilloscope
    multiplexer. It features four y- and four x-inputs and yields a single y- and
    x-output to the oscilloscope. In addition to this, a z-signal is generated which
    can be used for automatic beam blanking, if the oscilloscope supports an external
    beam control input.


    The lower third of the figure contains the clock circuitry, which can be run in
    either of two modes as determined by the position of switch S1. In the upper position
    the multiplexer is free running controlled by a simple astable multivibrator based
    on a NE555 (IC1). If S1 is set to the lower position, the clock signal is activated
    every time the analog computer is in OP-mode. This is especially useful when repetitive
    operation is selected as the oscilloscope will switch from one input pair to the
    next in conjunction with the operation cycles. This circuit also generates the
    z-signal which turns the beam off whenever the analog computer is not in OP-mode
    as well as while switching from one input channel to another.


    The operational amplifier IC3 in conjunction with the potentiometer R5 is used
    to adjust the blanking signal level between +15 V and −15 V to suit the particular
    oscilloscope.


    The middle section of the schematic shows the two bit counter which selects one
    out of the four input signal pairs. The counter itself is built from two JK-flip-flops
    (IC6). Using switch S2 the number of channels displayed can be selected from one
    to four. The two address bits feed a two-to-four demultiplexer (IC4B) which yields
    four active-low logic signals controlling the two electronic quad switches IC7
    and IC9. Both outputs to the oscilloscope are buffered by simple impedance converters
    (IC8 and IC10).


    ## APPENDIX E

    ### A log() function generator


    The logarithm is a particularly useful function as has been seen in section 6.20
    where this function was required for the simulation of an air flow. The literature
    abounds with electronic logarithm function generators – either based on polygon
    approximation, see section 2.6, or using a suitable PN-junction in the feedback
    path of an operational amplifier. Both approaches are quite tricky to implement
    due to the non-negligible temperature coefficients of the diodes and transistors
    required. Fortunately, there exists an integrated circuit, the LOG112, which implements
    a high-precision logarithm function generator that can be easily interfaced to
    an analog computer.


    V_out = 1/2 log₁₀ ( I_in / I_ref ) ( 1 + (R3 + R4) / R2 )


    where I_in and I_ref denote an input and a reference current.


    Figure E.1 shows the circuit of the overall computing element: The reference current
    I_ref is defined by R5 which should have a precision of at least 0.05%. The input
    current I_in is defined by R1, which should have the same precision.


    The input/output voltage relation of this circuit is shown in table E.1. Input
    values less than 0.001 V will result in an overload that could be detected either
    by means of an analog computer comparator or by a dedicated detector circuit based
    on an LM339 or the like. The values of the table should be used to calibrate the
    circuit by setting the potentiometer R4 accordingly.


    ## APPENDIX F

    ### A sine/cosine generator


    In some cases, such as the inverted pendulum simulation which was used to train
    a machine learning system, basic harmonic functions such as sin(φ) and cos(φ)
    cannot be generated using the quadrature generator described in section 6.25,
    figure 6.89, because computing element variations will cause φ and the derived
    functions sin(φ) and cos(φ) to drift apart over time.


    If the argument φ can be guaranteed to be in an interval like [−1,1], functions
    like sin(φ) etc. can be generated using special function generators based on polygonal
    approximation. The AD639¹⁶⁸ is a rare but useful integrated circuit which generates
    basic trigonometric functions; this was used to build the dedicated function generator
    shown in figure F.1.


    Both potentiometers R2 and R6 have to be adjusted so that an input voltage in
    the range of [−2π,2π] rad ≡ [−1,1] ≡ [−10,10] V is mapped to the interval [−7.2,7.2]
    V.


    ![](img/91599d88757ed8c75960eb83f4f85a12_257_0.png)


    Fig. F.1. Sine/cosine generator based on the AD639 universal trigonometric function
    converter


    ## APPENDIX G

    ### A simple joystick interface


    Since an analog computer is ideally suited for all kinds of dynamic systems simulations,
    a joystick interface is a really versatile peripheral device as it makes “man
    in the loop” simulations possible. This appendix describes a simple adapter circuit,
    which allows a two-channel analog joystick, as commonly used for controlling models,
    to be used with an analog computer.


    The joystick used here is a two-channel joystick from an old model remote control.
    It consists of two 4k7 (4700 Ω) potentiometers – one for the x- and one for the
    y-direction. A simple handheld enclosure was built, as shown on the left in figure
    G.2. This also holds a push button which can be used to control an electronic
    switch or a comparator in the analog computer.


    The circuit shown in figure G.1 is pretty straightforward: First, the two reference
    voltages of ±10 V are buffered by the operational amplifiers IC1A and IC1B. R1
    and R2 are the joystick’s potentiometers while R1* and R2* are used to set the
    origin of the joystick (putting the joystick into its middle position with respect
    to x and y should yield a value of 0 on each channel).


    Since the potentiometers used in a typical joystick allow for a 270 degree travel
    and as the joystick only allows for a much smaller deflection, the wiper will
    never hit its end positions. Accordingly, the output signals x and y must be amplified
    to satisfy -10 V ≤ x,y ≤ +10 V. This is done by the two operational amplifiers
    IC1C and IC1D. The capacitors C1 and C2 suppress any unwanted oscillations which
    otherwise may occur. The slight non-linearity due to the load resistance of 10
    k on the wipers of the joystick potentiometers is negligible in this application,
    so no additional buffer stage is required.

