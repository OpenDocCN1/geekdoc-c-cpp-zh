    # APPENDIX D


    # An oscilloscope multiplexer


    Most oscilloscopes provide at least two y-channels, which allow the display of
    two curves at once on the screen. Although this is often sufficient for work with
    an analog computer, sometimes it is desirable to have not only two y-inputs but
    several pairs of x- and y-inputs. This allows multiple figures, each defined by
    a corresponding x, y signal pair, to be displayed. Since this is not possible
    with most standard oscilloscopes the need for an x, y oscilloscope multiplexer
    arises.166


    Figure D.1 shows the schematic of a simple, yet powerful, four channel x, y oscilloscope
    multiplexer. It features four y- and four x-inputs and yields a single y- and
    x-output to the oscilloscope. In addition to this, a z-signal is generated which
    can be used for automatic beam blanking, if the oscilloscope supports an external
    beam control input.


    The lower third of the figure contains the clock circuitry, which can be run in
    either of two modes as determined by the position of switch S1. In the upper position
    the multiplexer is free running controlled by a simple astable multivibrator based
    on a NE555 (IC1). If S1 is set to the lower position, the clock signal is activated
    every time the analog computer is in OP-mode. This is especially useful when repetitive
    operation is selected as the oscilloscope will switch from one input pair to the
    next in conjunction with the operation cycles. This circuit also generates the
    z-signal which turns the beam off whenever the analog computer is not in OP-mode
    as well as while switching from one input channel to another.'
