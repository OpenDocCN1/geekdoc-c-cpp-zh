    either of the two diodes shown, it will short-circuit the built-in feedback resistor
    of the summer and thus limits its output to the forward-bias voltage set on the
    two free potentiometers.


    This circuit has two disadvantages. First, since it requires two free potentiometers
    without output buffers, it is best suited for classic analog computers which use
