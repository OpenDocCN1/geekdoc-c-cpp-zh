    on the analog computer. Since the suns'' masses are equal to 1 the satellite''s
    mass cancels out, yielding


    $$\ddot{\vec{r}}_3 = G \frac{\vec{r}_1 - \vec{r}_3}{|\vec{r}_1 - \vec{r}_3|^3}
    + G \frac{\vec{r}_2 - \vec{r}_3}{|\vec{r}_2 - \vec{r}_3|^3}. \qquad (6.28)$$


    Introducing two distance terms


    $$\Delta r_{13}^3 = \left(\sqrt{(x_1 - x_3)^2 + y_3^2}\right)^3 \qquad (6.29)$$


    $$\Delta r_{23}^3 = \left(\sqrt{(x_2 - x_3)^2 + y_3^2}\right)^3 \qquad (6.30)$$


    and splitting (6.28) into its \(x\)- and \(y\)-components yields the following
    two equations which describe the satellite''s trajectory in Cartesian coordinates:


    $$\ddot{x}_3 = (x_1 - x_3) \frac{G}{\Delta r_{13}^3} + (x_2 - x_3) \frac{G}{\Delta
    r_{23}^3} \qquad (6.31)$$


    $$\ddot{y}_3 = -y_3 \left( \frac{G}{\Delta r_{13}^3} + \frac{G}{\Delta r_{23}^3}
    \right). \qquad (6.32)$$


    These equations can now easily be implemented on an analog computer. Figure 6.30
    shows the partial computer setup yielding the distance terms (6.29) and (6.30).


    ![](img/91599d88757ed8c75960eb83f4f85a12_149_0.png)


    Fig. 6.30 Distance terms


    ![](img/91599d88757ed8c75960eb83f4f85a12_151_0.png)


    Fig. 6.32. Typical satellite trajectory for a small value of G


    ![](img/91599d88757ed8c75960eb83f4f85a12_151_1.png)


    Fig. 6.33. Trajectory for a larger value of G


    Figure 6.34 shows the basic idea of the simulation: The bounding box is assumed
    as the rectangle \([−1,1]\times[−1,1]\) and the position of the ball within this
    box is described by the coordinates \((x,y)\). At the start of a simulation run
    the ball has two initial conditions: an initial velocity \(v_0\) (of which only
    the \(x\)-component will be given) and an initial \(y\)-position \(y_0\), set
    to 1.


    The \(x\)- and \(y\)-components of the ball''s position are completely independent,
    so they can be generated by two separate sub-programs. The \(x\)-component of
    the ball''s velocity is assumed to decrease linearly over time. The actual \(x\)-position
    of the ball is derived by integrating over its velocity. Every time the ball hits
    the left or right wall of the box, it changes its direction, i.e. it is reflected
    by the wall.


    The \(y\)-component is that of a free-falling ball bouncing back elastically when
    hitting the floor. Figure 6.35 shows those two variables over time as displayed
    on an oscilloscope: Starting from the left, the computer is first in IC-mode.
    As soon as the OP-mode starts, the ball begins to drop until it hits the floor
    while the \(x\)-component increases (trace in the middle) with decreasing velocity
    until it reaches the right wall etc.


    Figure 6.36 shows the computer setup yielding the \(x\)-component of the ball''s
    position. The leftmost integrator generates the velocity component \(v_x\) of
    the ball which starts at +1 and decreases linearly controlled by the Δv-potentiometer.⁹⁵
    It should be noted that this setup differs slightly from the triangle generator
    shown in figure 5.13 in section 5.5 by the introduction of a second comparator
    with an associated electronic switch. This yields a stable comparison value of
    ±1 for the first comparator since its associated switch no longer yields ±1 at
    its output because it is driven by the leftmost integrator in this setup.


    ![](img/91599d88757ed8c75960eb83f4f85a12_152_0.png)


    Fig. 6.34. Movement of the bouncing ball


    ![](img/91599d88757ed8c75960eb83f4f85a12_152_1.png)


    Fig. 6.35. x- and y-component of the bouncing ball


    ![](img/91599d88757ed8c75960eb83f4f85a12_152_2.png)


    Fig. 6.36. Generating the x-component


    The output of this circuit is fed to the \(x\)-input of an oscilloscope set to
    \(x,y\)-display mode. The time scale factors of the integrators in this example
    were set to \(10^2\) and \(10^3\) respectively.


    The \(y\)-component of the ball in flight can be described by


    $$\ddot{y} = -g + d\dot{y} \qquad (6.33)$$


    where \(d\) denotes the damping coefficient due to air friction. This friction
    is assumed to be proportional to the ball''s velocity which is a significant simplification.
    When the ball hits the ceiling or floor of the box an additional term is introduced
    which is proportional to the depth of penetration:


    $$\ddot{y} = -g + d\dot{y} + \begin{cases} +c(-y - 1) & \text{if } y < -1 \\ -c(y
    - 1) & \text{if } y > 1. \end{cases}$$


    ![](img/91599d88757ed8c75960eb83f4f85a12_155_0.png)


    Fig. 6.39. Analog computer program for equations (6.34) and (6.35)


    ![](img/91599d88757ed8c75960eb83f4f85a12_155_1.png)


    Fig. 6.40. Results of a typical zombie simulation


    Figure 6.39 shows the resulting qualitative (i.e. unscaled) program for equations
    (6.34) and (6.35). A typical simulation result obtained with this setup is shown
    in figure 6.40. The computer was run in repetitive mode with the time scale factors
    of the integrators set to \(k_0 = 10^3\). Additionally, all integrator inputs
    had a weight of 10 further speeding up the simulation by another factor of 10.
    The OP-time was set to 60 ms. The oscilloscope, relying on its built-in time-deflection,
    was explicitly triggered by one of the trigger outputs of the CU to obtain a stable
    display.


    The parameters used were derived experimentally by manually changing the coefficients
    until an oscillatory behaviour was obtained. The output shown corresponds to \(h_0
    = z_0 = 0.6\), \(\alpha = 0.365\), \(\beta = 0.95\), \(\delta = 0.84\) (very successful
    zombies, indeed), \(\gamma = 0.44\), and \(\zeta = 0.09\). As in most predator-prey-systems
    it is quite difficult to find a parameter setting which gives oscillatory behaviour
    with stable minima and maxima amplitudes. Since neither species becomes extinct
    with this particular parameter set there is plenty of scope for many Zombie movies
    in years to come.


    ## 6.12 Rössler attractor


    An electronic analog computer is ideally suited to studying continuous-time dynamic
    systems of which those exhibiting chaotic behaviour are not only fascinating but
    also yield aesthetically pleasing phase space plots. The following sections describe
    a number of such systems; the first of these was developed and studied in 1976
    by Otto Rössler.⁹⁸ This system is described by the three coupled differential
    equations


    $$\dot{x}=-(y+z),$$


    $$\dot{y}=x+ay,$$


    $$\dot{z}=b+z(x-c)$$


    where \(a = 1/5\), \(b = 1/5\), and \(c = 5.7\). A remarkable property of this
    particular system is that only one of these equations is non-linear.


    Since the variables in these equations will exceed the valid range \([-1,1]\)
    of the machine units, the equations must be scaled before setting up the computer.
    Due to the non-linear nature of the problem, this scaling process is rather cumbersome
    and is best done in a multi-step fashion. The final set of scaled coupled DEQs
    for this problem looks like this:


    $$\dot{x}=-0.8y-2.3z$$


    $$\dot{y}=1.25x+a^*y$$


    $$\dot{z}=b^*+15z(x-c^*)$$


    with \(a^* = 0.2\), \(b^* = 0.005\), and \(c^* = 0.3796\). The resulting computer
    setup is shown in figure 6.41 while figure 6.42 shows an \(x\)-\(y\) plot of the
    attractor, photographed with ISO 100 and a time scale factor \(k_0 = 10^3\) set
    on all three integrators.


    A particularly beautiful picture can be obtained with a simple (static) 3D projection
    of the attractor. One input of the oscilloscope, which is set to \(x,y\)-mode,
    is directly fed by \(x\) while the other input is fed from a summer yielding


    $$y^* = -(y\sin(\varphi)+z\cos(\varphi)),$$

