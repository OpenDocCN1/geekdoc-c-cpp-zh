    ## CHAPTER 6


    ## Examples


    The following chapter describes a variety of problems of different complexity
    which have been solved using an analog computer. Reproducing these solutions on
    an analog computer is not only highly instructive but also very rewarding and,
    last but not least, fun.


    ### 6.1 Chemical kinetics


    A central problem in chemistry, biology, pharmacy etc. is to describe and analyse
    the rates at which chemical reactions occur. Two general terms are important in
    this context. First, the speed of a reaction in which a substance A is transformed
    into a product X, a process typically denoted by $A \rightarrow X$. The second
    term is the order of the reaction, which describes the dependency of the reaction
    speed on the concentration of the various substances within the reaction:


    - **Order 0:** The speed of the reaction is constant. This is typically the case
    when the substances involved are available in abundance.

    - **Order 1:** This describes a reaction $A \rightarrow X$, following the equation
    $-\dot{a}=ka$, where $k$ is a constant describing the speed of the reaction.

    - **Order 2:** A reaction of the form $A+B \rightarrow X$ or $A+A \rightarrow
    X$ following $-\dot{a}=kab$ or $-\dot{a}=ka^2$, if only reagent A is required.


    ![](img/91599d88757ed8c75960eb83f4f85a12_124_0.png)


    **Fig. 6.3.** Setup for the equation $\dot{a}=\dot{b}=-kab$


    ![](img/91599d88757ed8c75960eb83f4f85a12_124_1.png)


    **Fig. 6.4.** Typical simulation result for the reaction $A+B\xrightarrow{k}C$


    yielding the equation $\dot{a}=\dot{b}=-kab$ which is easily converted into the
    program shown in figure 6.3. This gives the typical results shown in figure 6.4.


    A two step reaction system such as


    $$

    A \xrightarrow{k_1} B \xrightarrow{k_2} C

    $$


    can be described by the following set of coupled differential equations


    $$

    \begin{aligned}

    \dot{a} &= -k_1a \\

    \dot{b} &= k_1a-k_2b \text{ and} \\

    \dot{c} &= k_2b.

    \end{aligned}

    $$


    ![](img/91599d88757ed8c75960eb83f4f85a12_125_0.png)


    Fig. 6.5. Computer setup for the reaction $A \xrightarrow{k_1} B \xrightarrow{k_2}
    C$


    ![](img/91599d88757ed8c75960eb83f4f85a12_125_1.png)


    Fig. 6.6. Simulation result for the reaction $A \xrightarrow{k_1} B \xrightarrow{k_2}
    C$


    Figures 6.5 and 6.6 show the program and typical results for this problem.⁷⁶


    MICHAELIS-MENTEN kinetics is a classic model of enzyme kinetics and takes the
    form


    $$

    S + E \underset{k_1}{\stackrel{k_2}{\rightleftharpoons}} \varepsilon \xrightarrow{k_3}
    P + E,

    $$


    with $S$, $E$, $\varepsilon$, and $P$ denoting the concentrations of a substrate,
    the enzyme, the enzyme-substrate complex, and the final product of the reaction.
    The free enzyme on the right-hand side is available for new enzyme-substrate complexes,
    i. e. the enzyme is not consumed during the overall process.⁷⁷ This system is
    described by the following set of equations:⁷⁸


    $$

    \begin{aligned}

    \dot{s} &= -k_1 e s + k_2 \varepsilon \\

    \dot{e} &= -k_1 e s + (k_2 + k_3) \varepsilon \\

    \dot{\varepsilon} &= k_1 e s - (k_2 + k_3) \varepsilon \\

    \dot{p} &= k_3 \varepsilon

    \end{aligned}

    $$


    Figure 6.7 shows the resulting computer setup while figure 6.8 shows a typical
    simulation result.


