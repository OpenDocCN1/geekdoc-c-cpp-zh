    Table H.1. The Analog Paradigm Model-1 bus system


    When designing new hardware for the Analog Paradigm Model-1 analog computer, the
    following constraints should be taken into account:


    - Signals denoted by an overline are active-low logic signals.

    - Analog and digital ground (AGND/DGND) should never be connected to each other
    on a module as this would introduce a ground loop and deteriorate system performance.

    - When POTSET is active, i.e. low, the computer is set to potentiometer setting
    mode. The integrators are halted and the inputs of all potentiometers are connected
    to the positive reference voltage. Using the readout feature described below,
    the value set on each potentiometer can then be displayed on a DVM.

    - The OVERLOAD line can be driven by a computing module to signal an overload
    condition to the control unit. The driver must be of the open collector type.
    (A standard TTL-driver can be used but must be decoupled by a diode.)

    - The signals MODEIC and MODEOP control the operation of the integrators of the
    overall system.

    - To read the output value of a computing element its address must be placed onto
    the address lines A15–A0 and the READ line must be driven low. The element selected
    in this way will then connect its output to the READOUT line by means of an electronic
    switch (or a relay). In addition to this, each computing element can drive the
    data lines (D7–D0) to show its module type which can then be displayed on a readout
    unit.

    - The 16 address bits consist of a rack number (A15–A12 – this will be typically
    0000), a chassis number (A11–A8 – from bottom to top in a rack), a slot number
    (A7–A4 – from left to right), and an element number (A3–A0). Each card can hold
    up to 16 computing elements.

    - The lines labelled RS, SCA, SCL, and WRITE are reserved for future use.


    ## HyCon commands


    The Model-1 hybrid controller, HC, is connected by means of a serial line USB
    interface to a digital computer which sends appropriate commands to control the
    operation of the analog computer. Using a serial line terminal program it is possible
    to control the analog computer by typing in these commands:¹⁶⁹


    - 4: Enable halt-on-overflow. When enabled, any overload condition will immediately
    HALT the analog computer so that the element(s) causing this condition can be
    identified by their respective overload indicators.

    - a: Disable halt-on-overflow.

    - B: Enable external halt – a trigger signal on the HALT-input of the hybrid controller
    will place the analog computer into HALT mode regardless of its current mode of
    operation.

    - b: Disable external halt.

    - c: This command expects a six-digit decimal number which specifies the OP-time
    for repetitive or single-run operation in milliseconds. If values less than 10⁵
    milliseconds are required, which is typically the case, the number has to be padded
    with zeros on the left.

    - C: This command also expects a six-digit decimal number specifying the time
    for setting initial conditions in milliseconds.

    - d: Clear the digital output port which is specified by an address digit in the
    range of 0 to 7.

    - D: Like d but set the digital output port specified by a single-digit address
    following the command.

    - e: Issuing this command starts repetitive operation. The analog computer will
    cycle through the modes IC and OP with the respective times set by the c- and
    C-commands until it is halted.

    - E: This command starts a single-run cycle, i.e. the analog computer runs through
    the sequence IC, OP, HALT with the IC- and OP-times as specified above.

    - f: If a readout-group has been defined with the G-command, issuing an f will
    read all of the elements in that group sequentially and return their respective
    values.

    - F: This command, too, starts a single-run cycle. The main difference to the
    E-command is that a message will be returned at the end of the cycle allowing
    to synchronize the analog and digital computer.

    - g: To read the value of a single computing element, the g-command, followed
    by a four digit hexadecimal address, is issued.¹⁷⁰ The hybrid controller will
    return the ID of the computing element as well as its current value.

    - G: This command expects a semicolon separated list of four digit hexadecimal
    addresses which must be terminated by a single dot to let the hybrid controller
    know that no more entries follow.

    - h: Set the analog computer into HALT-mode.

    - i: Set the analog computer into IC-mode.

    - l: Return all values sampled during the last OP cycle if a readout group had
    been defined previously.

    - o: Set the analog computer to OP-mode.

    - P: This command is used for setting a digital potentiometer and expects the
    four digit hexadecimal address of the module containing the potentiometer to be
    set, followed by a two digit address of the potentiometer, followed by a four
    digit decimal (!) value in the range of 0000 to 1023.¹⁷¹ To set the digital potentiometer
    three on the module with the base address 0x0090 to 1/2, the command P0090030511
    would be required.

    - q: This prints out the current digital potentiometer setting.

    - R: Read all eight digital input ports and return their respective values.

    - s: Print out status information.

    - S: Set the analog computer into POTSET-mode. This is useful for setting manual
    potentiometers – see section 2.5.

    - t: During an OP-phase this command will print the elapsed time since the OP-mode
    started.

    - x: Reset the hybrid controller.

    - X: Configure a crossbar switch module.¹⁷²

    - ?: Print help.


    169 It should be noted that these commands should not be followed by a carriage
    return (<CR>) and/or line feed (<LF>) control character. The hybrid controller
    firmware parses its input data in a bytewise fashion and is not record oriented.
    Spurious <CR>/<LF> or whitespace characters will result in error messages as they
    are regarded as illegal commands.


    The following example shows how the hybrid controller can be controlled by manually
    issuing appropriate commands.¹⁷³ First, the OP- and IC-times are set to 500 and
    100 milliseconds respectively as echoed by the controller (lines 1 to 4). Then
    a repetitive run is started by issuing an e-command which is eventually terminated
    by forcing the analog computer into HALT-mode (line 6). Then the digital output
    with address 0 is set to high before another repetitive run is started and later
    terminated by the h-command.


    The command in line 10 reads the value from the computing element with the hexadecimal
    address 0160. The hybrid controller returns 0.0061 1, the first part being the
    value read while the second number is the identification number of the computing
    element being read.


    Line 12 defines a readout group consisting of two computing elements with the
    respective hexadecimal addresses 0160 and 0161. Issuing an s-command returns complete
    status information of the hybrid controller also containing the addresses of all
    elements in the readout group. The f-command in line 16 reads all elements of
    this group and returns their values as -0.0004;-0.0002.


    ```

    example.yml

    1 c000500

    2 T_OP=500

    3 C000100

    4 T_IC=100

    5 e

    6 h

    7 DO

    8 e

    9 h

    10 g0160

    11 0.0061 1

    12 G0160;0161.

    13 s

    14 STATE=NORM,MODE=IC,EXTH=DIS,OVLH=DIS,IC-time=100,OP-time=500,

    ```

