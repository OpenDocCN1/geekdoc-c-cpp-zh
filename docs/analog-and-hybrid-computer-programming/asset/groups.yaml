    The notion of an *analog computer* has its roots in the Greek word ανάλογον (“*analogon*”)
    which lives on in terms like “*analogy*” and “*analogue*”. This quite aptly characterizes
    an analog computer and separates it from today’s digital computers. The latter
    have a fixed internal structure and are controlled by a program stored in some
    kind of random access memory.


    In contrast, an analog computer has no program memory at all and is programmed
    by actually changing its structure until it forms an analogue, a *model*, of a
    given problem. This approach is in stark contrast to what is taught in programming
    classes today (apart from those dealing with FPGAs). Problems are not solved in
    a step-wise (algorithmic) way but instead by connecting the various computing
    elements of an analog computer in a suitable manner forming a *circuit* that serves
    as a model of the problem under investigation. Figures 1.1 and 1.2 illustrate
    these two fundamentally different approaches to computing. While a classic digital
    computer works more or less in a sequential fashion, the computing elements of
    an analog computer work in perfect parallelism with none of the synchronization
    issues that are often encountered in digital computing.


    # 1.2 Direct vs. indirect analogies


    When it comes to analogies in general, it is necessary to distinguish between
    *direct* and *indirect* analogies, which depend on the underlying principles of
    the problems being solved and the analogies used to solve them. In short, a direct
    analogy has its roots basically in the same physical principles as the corresponding
    problem, i.e. a soap-bubble being used to model a minimal surface, a metal sheet
    with heaters and thermocouples to investigate heat-flow patterns etc. If the physical
    principles underlying the problem and analog computer differ, the computer is
    called an indirect analog computer.


    For the remainder of this book only indirect analogies will be considered, as
    these are much more versatile in application than their direct counterparts. Typically,
    such machines are based on analog-electronic computing elements such as summers,
    integrators, multipliers and the like.


    Although it sounds like a contradiction, analog computers can be implemented using
    purely digital components. Two such types of machine are *digital differential
    analyzers* (*DDAs*) and *stochastic computers*, examples of which have been built
    over many years and whilst they enjoy periodic renaissances, they have never entered
    the mainstream of computing. Programming these machines follows basically the
    same lines as programming analog-electronic analog computers (simply'
