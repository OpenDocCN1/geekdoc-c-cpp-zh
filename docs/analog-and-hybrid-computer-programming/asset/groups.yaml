    ## 6.25 倒立摆


    本节描述倒立摆的仿真，即质量位于其支点上方并安装在能够水平移动的小车上的摆。图 6.87 显示了配置。


    ![](img/91599d88757ed8c75960eb83f4f85a12_194_0.png)


    *图 6.87. 倒立摆的配置*


    使用拉格朗日量 \(L = T - V\)，其中 \(T\) 如常表示总动能，而 \(V\) 是系统的势能。[122] 总势能为


    \[

    V = mgl\cos(\varphi), \tag{6.72}

    \]


    其中 \(g\) 表示重力加速度。总动能是摆锤质量为 \(m\) 的动能和移动小车质量为 \(M\) 的动能之和，即


    \[

    T = \frac{1}{2}\left(Mv_c^2 + mv_p^2\right). \tag{6.73}

    \]


    其中 \(v_c\) 是小车的速度，\(v_p\) 是摆锤的速度。显然，


    \[

    v_c = \dot{x} \tag{6.74}

    \]


    而（稍微不那么显然）


    \[

    v_p = \sqrt{\left(\frac{d}{dt}(x-l\sin(\varphi))\right)^2 + \left(\frac{d}{dt}(l\cos(\varphi))\right)^2}

    \]


    平方根下的左边项为


    \[

    (\dot{x}-l\dot{\varphi}\cos(\varphi))^2 = \dot{x}^{\,2} - 2\dot{x}l\dot{\varphi}\cos(\varphi)
    + l^2\dot{\varphi}^{\,2}\cos^2(\varphi)

    \]


    > [122] 以下推导基本遵循 https://en.wikipedia.org/wiki/Inverted_pendulum，检索于 2019 年 3
    月 29 日。


    ![](img/91599d88757ed8c75960eb83f4f85a12_198_0.png)


    *图 6.90. 安装在其小车上的摆的显示*


    为了生成无闪烁的显示，需要一些 kHz 的幅度稳定正交信号对 \(\sin(\omega t)\) 和 \(\cos(\omega t)\)；这可以从第 4.2
    节中图 4.11 或 4.13 所示的计算机设置中导出。该信号用于绘制圆形或椭圆形小车以及安装在小车上的旋转摆杆。


    杆的长度由标记为 \(l\) 的电位器设定。由于摆杆的一端固定在小车图形的中心，\(\sin(\omega t)\) 信号必须偏移 \(r\) 量。实际旋转通过与
    \(\sin(\varphi)\) 和 \(\cos(\varphi)\) 相乘完成。该电路产生两对输出信号：\(P_x\) 和 \(P_y\) 用于绘制摆杆，而
    \(C_x\) 和 \(C_y\) 显示移动的小车。因此，如果要同时显示小车和摆，则该仿真需要一台具有两个独立（多路复用）\(x,y\) 输入的示波器。摆刚好倾倒时的典型结果显示的屏幕截图如图
    6.91 所示。


    当摆锤的质量不再可忽略时会发生什么？在这种情况下，方程 (6.77) 不再能像以前那样简化，但必须完全考虑以实现摆动摆对小车的影响。求解该方程得到 \(\ddot{x}\)


    \[

    \ddot{x} = \frac{1}{M + m} \left( F + m l \ddot{\varphi} \cos(\varphi) - m l \dot{\varphi}^2
    \sin(\varphi) \right)

    \]


    这可以很容易地转换为如图 6.92 所示的计算机设置。


    ![](img/91599d88757ed8c75960eb83f4f85a12_199_0.png)


    *图 6.91. 安装在其小车上的摆的显示*


    ![](img/91599d88757ed8c75960eb83f4f85a12_199_1.png)


    *图 6.92. 重质量摆对移动小车的影响*


    此电路生成的函数 \(\ddot{x}\) 现在馈入图 6.88 所示子电路的关联输入。作用于小车的外部力可以通过开关 \(S_1\) 引入，而 \(\gamma_3\)
    控制该力的强度。


    ## 6.26 双摆


    更复杂但也更迷人的是对如图 6.93 所示双摆装置在模拟计算机上的仿真。[125]


    运动方程将像以前一样通过确定拉格朗日量 \(L = T - V\) 来推导，其中有两个广义坐标 \(\varphi_1\) 和 \(\varphi_2\)。\(T\)
    表示总动能，而 \(V\) 是系统的势能。该势能为


    \[

    V=-g\left((m_1+m_2)l_1\cos(\varphi_1)+m_2l_2\cos(\varphi_2)\right) \tag{6.79}

    \]


    其中 \(m_1\) 和 \(m_2\) 表示安装在两个摆杆末端的两个摆锤的质量（假设为无重）。如常，\(g\) 表示重力加速度。


    > [125] 这也由 [Mahrenholtz 1968, 第 159–165 页] 完成，它为本应用说明提供了灵感，尤其是显示电路。


