    is used where $T$ as usual represents the total kinetic energy while $V$ is the
    potential energy of the system.¹²² The total potential energy is


    $$V = mgl\cos(\varphi), \tag{6.72}$$


    with $g$ representing the gravitational acceleration. The total kinetic energy
    is the sum of the kinetic energies of the pendulum bob having mass $m$ and the
    moving cart with mass $M$, i.e.


    $$T = \frac{1}{2}\left(Mv_c^2 + mv_p^2\right). \tag{6.73}$$


    where $v_c$ is the velocity of the cart, and $v_p$ is the velocity of the pendulum
    bob. Obviously,


    $$v_c = \dot{x} \tag{6.74}$$


    and (a bit less obviously)


    $$v_p = \sqrt{\left(\frac{d}{dt}(x-l\sin(\varphi))\right)^2 + \left(\frac{d}{dt}(l\cos(\varphi))\right)^2}$$


    The left term under the square root is


    $$(\dot{x}-l\dot{\varphi}\cos(\varphi))^2 = \dot{x}^{\,2} - 2\dot{x}l\dot{\varphi}\cos(\varphi)
    + l^2\dot{\varphi}^{\,2}\cos^2(\varphi)$$


    > ¹²² The following derivation follows basically https://en.wikipedia.org/wiki/Inverted_pendulum,
