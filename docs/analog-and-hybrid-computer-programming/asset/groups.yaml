    ## B.3 Further characteristics

    Given two functions $f(t)$ and $g(t)$ which can be subjected to a LAPLACE transform
    yielding $F(s)$ and $G(s)$, the transform has the following useful characteristics:


    $\mathcal{L}(\lambda f(t) + g(t)) = \lambda F(s) + G(s)$ \quad\quad (linearity)

    $\mathcal{L}(f(\lambda t)) = \frac{1}{\lambda} F\left(\frac{s}{\lambda}\right)$
    \quad\quad (scale factor)

    $\mathcal{L}(e^{-\beta t} f(t)) = F(s + \beta)$ \quad\quad (exponential damping)

    $\mathcal{L}(f(t - T) u(t - T)) = e^{-T s} F(s)$ \quad\quad (time shift)

    $\mathcal{L}((f * g)(t)) = F(s) G(s)$ \quad\quad (convolution, see (C.1))


    ## B.4 Inverse Laplace transform

    The inverse LAPLACE transform is defined as


    $f(t) = \mathcal{L}^{-1}(F(s)) = \frac{1}{2\pi i} \lim_{T \to \infty} \int_{\gamma
    - iT}^{\gamma + iT} e^{st} F(s) \, ds$


    with $\gamma \in \mathbb{R}$ denoting a vertical line in the complex number plane.
    $\gamma$ is chosen so that all singularities of $F(s)$ are on its left. This transform
    is known as the Bromwich integral, after THOMAS JOHN L''ANSON BROMWICH and is
    typically solved using the residue theorem.$^{160}$


    Normally, this process is avoided by using tables of functions and their LAPLACE
    transforms e.g.:


    $\mathcal{L}\{\delta(t)\}=1$

    $\mathcal{L}\{\delta(t-T)\}=e^{-Ts}$

    $\mathcal{L}\{u(t)\}=\frac{1}{s}$

    $\mathcal{L}\{\frac{1}{\sqrt{\pi t}}\}=\frac{1}{\sqrt{s}}$

    $\mathcal{L}\{t^n\}=\frac{n!}{s^{n+1}}$

    $\mathcal{L}\{t^n e^{-at}\}=\frac{n!}{(s+a)^{n+1}}$

    $\mathcal{L}\{\frac{1}{a}(1-(1+at)e^{-at})\}=\frac{1}{s(s+a)^2}$

    $\mathcal{L}\{\frac{e^{-at}-e^{-bt}}{b-a}\}=\frac{1}{(s+a)(s+b)}$

    $\mathcal{L}\{\sin(\omega t)\}=\frac{\omega}{s^2+\omega^2}$

    $\mathcal{L}\{\cos(\omega t)\}=\frac{s}{s^2+\omega^2}$

    $\mathcal{L}\{e^{-at}\sin(\omega t)\}=\frac{\omega}{(s+a)^2+\omega^2}$

    $\mathcal{L}\{e^{-at}\cos(\omega t)\}=\frac{s+a}{(s+a)^2+\omega^2}$

    $\mathcal{L}\{\sinh(\omega t)\}=\frac{\omega}{s^2-\omega^2}$

    $\mathcal{L}\{\cosh(\omega t)\}=\frac{s}{s^2-\omega^2}$

    $\mathcal{L}\{\frac{\sqrt{a^2+\omega^2}}{\omega}\sin(\omega t+\tan^{-1}(\frac{\omega}{a}))\}=\frac{s+a}{s^2+\omega^2}\quad\text{(B.8)}$

    $\mathcal{L}\{\frac{\sin(\omega t)}{t}\}=\arctan\left(\frac{\omega}{s}\right)$


    ## B.5 Example

    Solving a differential equation such as


    $\ddot{x}+x=\delta(t)$


    using the LAPLACE transform is pretty straightforward. First, the transform is
    applied to both sides yielding


    $s^2\mathcal{L}\{x\}-s x(0-)-[\dot{x}]_{t=0}+\mathcal{L}\{x\}=1.$


    Using analog computing elements, simulations of complex systems described by block
    diagrams and corresponding transfer functions can easily be set up.


    Details of this technique, which exceeds the scope of this book, can be found
    in [SENSICLE 1968], [JOHNSON 1956, pp. 45 ff.], [GILOI et al. 1963, pp. 288 ff.],
    [CARLSON et al. 1967, pp. 191 ff.], [SYDOW 1964, pp. 128], and other classic text
    books. Good examples of application are described in [WEEDY et al. 1998] and [GILES
    1976].


