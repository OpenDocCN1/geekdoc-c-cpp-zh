    \ 6.99. 双摆仿真运行的长时间曝光\n\n## 第 7 章\n\n## 混合计算\n\n虽然模拟计算机本身极其强大，但模拟计算机与数字计算机结合形成的*混合计算机*则更为强大。\n\
    \n这一想法绝非新事——早在 1956 年，*太空技术实验室*就开发了 *ADDAVERTER*，这是一个能够通过 15 个 ADC 和 10 个 DAC¹²⁶\
    \ 将模拟计算机与数字计算机耦合的系统，每个转换器的精度为 ±0.1%。这种设置的根本原因在于，数字计算机擅长模拟计算机存在缺陷的领域，反之亦然。由于其计算能力和能源效率，它们的组合应用非常广泛。\n\
    \n混合计算机通常以两种基本模式之一运行：\n\n- **交替运行：** 在这种运行模式下，数字计算机通常控制模拟计算机设置的参数。模拟计算机基于这样的参数集执行一次运算，并通过\
    \ ADC 将其计算结果返回给数字计算机。基于这些结果，数字计算机可以推导出新的参数集，依此类推。由于数字计算机和模拟计算机的运行不重叠，这种模式在通信延迟、ADC\
    \ 转换时间等方面没有时间紧迫性。交替运行通常用于求解优化问题、多维参数搜索、偏微分方程求解、随机分析及相关问题。\n\n- **并行运行：** 这种运行模式要求数字计算机实时运行，因为它与模拟计算机并行工作，并且必须尽可能低延迟地读取和提供数值。在这种设置下，数字计算机不仅可以在运行时更改系数，还可以生成函数、充当延迟电路、基于模拟变量的值做出决策等。\n\
    \n### 7.1 混合控制器\n\n以下示例和解释基于 Analog Paradigm 混合控制器，但所介绍的思想和技术绝不限于此特定设备。过去已有类似的耦合设备，并且可以使用廉价的现成硬件（如\
    \ Arduino® 板等）来构建。这样的混合控制器可以通过 USB 连接到数字计算机，通常提供以下功能：\n\n- **控制线：** 混合控制器必须能够控制模拟计算机积分器的运行模式。在最简单的情况下，它将接受来自数字计算机的命令，如\
    \ `ic`、`op` 或 `halt`，并相应地设置 ModeIC 和 ModeOP 控制线。\n\n  根据其与数字计算机的连接方式，由于通信延迟，信号交换可能存在相当大的延迟。在需要精确控制\
    \ IC 和 OP 时间的应用中，这可能是个问题。因此，建议混合控制器本身应配备一个至少具有 1 μs 分辨率的时钟，所有定时问题均由混合控制器本地处理——无需与所连接的数字计算机通信。\n\
    \n  混合控制器还应能够检测过载状况，控制 POTSET 线，并应具有用于外部暂停信号的输入线。\n\n- **数字电位器：** 这种类型的电位器，类似于*乘法\
    \ DAC*，通常提供 10 位分辨率，允许以约 0.1% 的分辨率设置参数。如果这种电位器的输入端连接到 +1 或 −1，它甚至可以用作简单廉价的 DAC，使数字计算机不仅能控制参数，还能向模拟计算机馈送时变值。\n\
    \n- **数字输入：** 许多应用（例如参数优化）包含一些必须由数字计算机感测的条件，以便中止计算机运行或更改某些参数。这通常通过比较器实现，比较器产生数字输出信号，数字计算机可以使用混合控制器的数字输入通道读取该信号。\n\
    \n- **数字输出：** 使用混合控制器的数字输出线，所连接的数字计算机可以控制诸如 CMP4 模块中使用的电子开关。一个典型的应用是向仿真系统施加阶跃函数。\n\
    \n- **读出：** 混合控制器必须实现的最重要功能之一是读出能力，包括数据记录功能。理想情况下，模拟计算机具有中央读出系统，允许无歧义地寻址每个计算元件。在这种情况下，混合控制器接管该系统地址线的控制，而模拟读出线连接到混合控制器的\
    \ ADC。单次读出操作所需的时间非常关键，包括寻址和选择计算元件的时间、ADC 完成一次转换所需的时间，以及将数字值传输到数字计算机的时间。如果在计算过程中需要反复读取许多元件，则可能有必要在开始读出操作之前将模拟计算机置于\
    \ HALT 模式，并在之后重新激活 OP 模式，以避免所读取的各个数据值之间出现过大偏差。随着给定设置中积分器 k₀ 值（时间缩放）的增加，这一点变得越来越重要。\n\
    \n图 7.1 显示了 Analog Paradigm 混合控制器（HC）的前面板。上半部分的 16 个 2 mm 插孔组连接到八个数字电位器，每个具有 10\
    \ 位分辨率。下半部分的第二组 16 个插孔连接到八条数字输入线和八条数字输出线。左侧是 USB 端口，而右下侧提供了额外的 HALT 输入和触发输出。该模块控制所有地址、数据和控制\n\
    \n"
