    # APPENDIX F


    # A sine/cosine generator


    In some cases, such as the inverted pendulum simulation which was used to train
    a machine learning system, basic harmonic functions such as sin(φ) and cos(φ)
    cannot be generated using the quadrature generator described in section 6.25,
    figure 6.89, because computing element variations will cause φ and the derived
    functions sin(φ) and cos(φ) to drift apart over time.


    If the argument φ can be guaranteed to be in an interval like [−1,1], functions
    like sin(φ) etc. can be generated using special function generators based on polygonal
    approximation. The AD639¹⁶⁸ is a rare but useful integrated circuit which generates
    basic trigonometric functions; this was used to build the dedicated function generator
    shown in figure F.1.


    Both potentiometers R2 and R6 have to be adjusted so that an input voltage in
    the range of [−2π,2π] rad ≡ [−1,1] ≡ [−10,10] V is mapped to the interval [−7.2,7.2]
    V.'
