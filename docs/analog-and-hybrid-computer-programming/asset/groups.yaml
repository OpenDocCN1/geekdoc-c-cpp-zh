    which is shown in the upper trace. The two following curves show $\Psi$ and $\Psi^2$.
    Here $\Psi_0$ was assumed to be zero while $\dot{\Psi}_0$ was set experimentally
    so that the two integrators in figure 6.18 did not go into overload.


    One of the big advantages of an analog computer, namely the ease with which parameter
    variations can be tested, becomes very clear in this program. Varying $E$, $V_0$,
    $\Psi_0$, and $\dot{\Psi}_0$ gives a good feel for the behaviour of the one-dimensional
    SCHRÖDINGER equation.


    ### 6.6 Ballistic trajectory


    The following example computes the two-dimensional ballistic trajectory of a projectile
    fired from a cannon taking the velocity-dependent drag, which slows down the projectile,
    into account. This drag causes the trajectory to deviate from a simple symmetric
    parabola as it will be steeper on its trailing path than on its leading part.
    The drag $\delta(v)$ is assumed to be of the general form


    $$\delta(v) = r v^2 \tag{6.17}$$


    with $v = \sqrt{\dot{x}^2 + \dot{y}^2}$.


    This is a bit oversimplified as, according to Siacci for example, a realistic
    drag function for a historic projectile has the form


    $$\delta(v) = 0.2002v - 48.05 + \sqrt{9.6 + (0.1648v - 47.95)^2} + \frac{0.0442v(v
    - 300)}{371 + (v/200)^{10}}.$$


    Nevertheless, (6.17) will suffice for the following example.


    The general equations of motion of the projectile in this two-dimensional problem
    are


    $$\ddot{x} = -\frac{\delta(v)}{m} \cos(\phi) \quad (6.18) \qquad \ddot{y} = -g
    - \frac{\delta(v)}{m} \sin(\phi) \quad (6.19)$$


    with $g$ representing the acceleration of gravity, $v$ denoting the projectile''s
    velocity, and $m$ being its mass. Accordingly, it is $\cos(\phi) = \dot{x} / v$
    and $\sin(\phi) = \dot{y} / v$.


    Setting the mass $m := 1$ and rearranging (6.18) and (6.19) gives the following
