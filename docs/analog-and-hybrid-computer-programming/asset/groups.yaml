    ## 6.12 Rössler 吸引子


    电子模拟计算机非常适合研究连续时间动态系统，其中表现出混沌行为的系统不仅令人着迷，而且还能产生美观的相空间图。以下各节描述了若干此类系统；其中第一个系统由
    Otto Rössler 于 1976 年开发并研究。⁹⁸ 该系统由三个耦合微分方程描述


    $$\dot{x}=-(y+z),$$


    $$\dot{y}=x+ay,$$


    $$\dot{z}=b+z(x-c)$$


    其中 \(a = 1/5\)，\(b = 1/5\)，且 \(c = 5.7\)。该系统的显著特性是其中只有一个方程是非线性的。


    由于这些方程中的变量会超出机器单位的有效范围 \([-1,1]\)，因此在设置计算机之前必须对方程进行缩放。由于问题的非线性性质，该缩放过程相当繁琐，最好以多步方式进行。该问题的最终缩放耦合微分方程组如下所示：


    $$\dot{x}=-0.8y-2.3z$$


    $$\dot{y}=1.25x+a^*y$$


    $$\dot{z}=b^*+15z(x-c^*)$$


    其中 \(a^* = 0.2\)，\(b^* = 0.005\)，且 \(c^* = 0.3796\)。所得的计算机设置如图 6.41 所示，而图 6.42
    显示了吸引子的 \(x\)-\(y\) 图，用 ISO 100 拍摄，所有三个积分器的时间比例因子 \(k_0\) 均设置为 \(10^3\)。


    通过对吸引子进行简单的（静态）三维投影，可以获得特别美丽的图像。示波器的一个输入端设置为 \(x,y\) 模式，直接由 \(x\) 馈送，而另一个输入端由一个求和器馈送，得到


    $$y^* = -(y\sin(\varphi)+z\cos(\varphi)),$$

