    A very simple, yet often practical limiter circuit just employs two suitable ZENER-Diodes
    with their cathodes (or anodes) connected between the output of a summer or integrator
    and its respective summing junction.


    # 5.9 Dead-space


    Many mechanical systems, such as gear trains, linkages etc., exhibit a phenomenon
    called backlash, which is caused by unavoidable gaps between moving parts. A dead-space
    circuit is used to model this behaviour on an analog computer.


    The literature contains a plethora of such circuits – the basic idea is to use
    a pair of suitably forward-biased diodes feeding a summer. The simplest form of
    such a circuit consists of just two diodes, two free potentiometers and a summer.
    This simplicity comes at a cost because the setup of the potentiometers is not
    straightforward, and the diodes are far from being ideal.


