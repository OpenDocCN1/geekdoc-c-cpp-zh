    # B.1 Basic functions


    This section presents the derivation of the LAPLACE transforms for some basic
    functions.


    # B.1.1 Step function


    One of the most basic functions is the *step function*


    $$f(t)=\begin{cases}0 & t<0\\a & t>0\end{cases}$$


    with amplitude $a\in\mathbb{R}^+$. In the case of $a=1$ it is called *unit step
    function*, denoted $u(t)$ which is also known as *HEAVISIDE step function* after
    OLIVER HEAVISIDE.[^154] Its LAPLACE transform is[^155]


    $$\mathcal{L}\{u(t)\}=\int_0^\infty ae^{-st}\,dt=a\int_0^\infty e^{-st}\,dt.$$  \tag{B.2}


    Substituting $\varphi=-st$ yields $dt=-\frac{1}{s}\,d\varphi$, so (B.2) simplifies
    to


    $$\mathcal{L}\{u(t)\}=\frac{a}{s}\int_0^\infty e^{\varphi}\,d\varphi=\frac{a}{s}\left[e^{-st}\right]_0^\infty=\frac{a}{s}.$$  \tag{B.3}


    A variant of the step function is the *delayed unit step function*


    $$u(t-T)=\begin{cases}0 & t<T\\1 & t>T\end{cases}$$


    with the following LAPLACE transform


    $$\begin{aligned}\mathcal{L}\{u(t-T)\}&=\int_0^\infty u(t-T)e^{-st}\,dt\\&=\int_0^T
    u(t-T)e^{-st}\,dt+\int_T^\infty u(t-T)e^{-st}\,dt\\&=\int_T^\infty e^{-st}\,dt=-\frac{1}{s}\left[e^{-st}\right]_T^\infty=\frac{e^{-sT}}{s}.\end{aligned}$$


    [^154]: See [Yavetz 1995] for more information on Heaviside’s work.


    [^155]: Note the lower bound of integration.'
