    20 世纪早期，欧内斯特·卢瑟福进行了一项开创性的实验，他用 \(\alpha\) 粒子轰击薄金箔。[89] 他观察到绝大多数粒子只是穿过金箔而不被偏转或吸收。然而，其中一些粒子被偏转了很大角度，甚至有更少的
    \(\alpha\) 粒子被金箔反射，这一现象称为卢瑟福散射。这导致了行星状卢瑟福原子模型，随后成为玻尔模型的基础。


    以下模拟计算机模拟的动机来自 [BORCHARDT]。假设金原子的核处于固定位置——具体来说是底层坐标系的原点，以便简化 \(\alpha\) 粒子的距离计算。当
    \(\alpha\) 粒子的位置为 \((x, y)\) 时，它到金核的距离为

    \[

    r^2 = x^2 + y^2.

    \]


    89. 这些是氦核，因此相当大。


    作用在 \(\alpha\) 粒子上的力由库仑定律描述

    \[

    F = k_e \frac{q_1 q_2}{r^2} \tag{6.26}

