    \(\beta < 1\) 会相应减慢机器时间。


    对于半衰期为 \(T_{1/2} = 24.1\) 天的 \(^{234}_{90}\mathrm{Th}\)，相对于问题时间大幅加快机器时间是可取的。为了在示波器上获得无闪烁显示，机器时间将被缩放，使得
