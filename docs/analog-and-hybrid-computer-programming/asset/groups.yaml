    ## 4.1.2 使用模拟计算机


    对两边应用 exp() 并显式写出自变量 \(t\)，可得


    \[

    N(t) = e^{-\lambda t + c} = e^{-\lambda t} e^{c}.

    \]


    设 \(N(0)\) 表示在 \(t = 0\) 时存在的原子数，则得到


    \[

    N(0) = e^{0} e^{c} = e^{c},

    \]


    最终得到


    \[

    N(t) = N(0) e^{-\lambda t}, \quad (4.3)

    \]


    即*放射性衰变的普适定律*，其中 \(\lambda\) 表示*衰变率*。


    通常，同位素表中给出的并不是 \(\lambda\)，而是*半衰期* \(T_{1/2}\)。\(T_{1/2}\) 表示在 \(t = 0\) 时存在的原子中有一半发生衰变所需的时间。它与
    \(\lambda\) 的关系为


    \[

    T_{1/2} = \frac{\ln(2)}{\lambda},

    \]


    由此得到教科书中常见的指数衰变形式：


    \[

    N(t) = N(0) e^{-\frac{\ln(2)}{T_{1/2}} t}.

    \]


    如前所述，描述“真实”问题的微分方程如此简单、可以轻易解析求解的情况并不常见。当不存在解析解，或者求解所需工作量过大时，可以使用模拟计算机来模拟所研究微分方程描述的动态系统的行为。为此，需要将方程或方程组转换为计算机上的设置（setup）或程序，后续小节将展示这一点。这主要有两种方式：KELVIN
    *反馈技术（feedback technique）*或*替换技术（substitution technique）*。


    在下面的示例中，将使用比较简单直接的 KELVIN 反馈技术：首先重新整理微分方程，将最高阶导数单独放在方程左侧；然后假设该导数是已知的。将它送入一系列积分器（必要时配合加法器以反转符号等），即可得到方程右侧的所有低阶导数。随后，利用适当的计算元件组合这些低阶导数，得到最初开始逐次积分的那个最高阶导数。再将此输出连接到积分器链的输入端，从而形成*反馈回路*。


    ![](img/91599d88757ed8c75960eb83f4f85a12_67_0.png)


    图 4.2 衰变问题的初始计算机设置


    ![](img/91599d88757ed8c75960eb83f4f85a12_67_1.png)


    图 4.3 衰变问题的最终计算机设置


    在放射性衰变中，微分方程的最高阶导数已经在左侧：


    \[

    \dot{N} = -\lambda N. \quad (4.4)

    \]


    假设 \(\dot{N}\) 已知，可将其送入积分器，积分器输出端即可得到 \(-N\)。用 \(\lambda\) 乘以该值，得到 \(-\lambda
    N\)，这正是(4.4)的右侧。由于左右两侧必须相等，现在可将 \(-\lambda N\) 作为推导 \(-N\) 所用积分器的输入，从而有效形成图 4.2
    中的中央反馈回路。


    这个设置还不完整，因为它缺少设置初始条件 \(N(0)\) 的方式。同时，最好将 \(N\) 而不是 \(-N\) 作为输出值。图 4.3 所示的程序同时满足这两个要求。


    这两个子电路在 Analog Paradigm Model-1 模拟计算机上的最终设置如图 4.4 所示。典型的解曲线可见于图 4.5 的示波器截图。所显示的解明显具有
    \(\exp(-x)\) 的形式，这与解析解(4.3)的预期一致。


    ![](img/91599d88757ed8c75960eb83f4f85a12_68_0.png)


