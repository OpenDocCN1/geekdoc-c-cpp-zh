    \ connected to a microcontroller which stores the values into successive memory\
    \ locations of a suitable *random access memory (RAM)*. These values are then\
    \ read out with suitable address offset and fed to a *digital/analog-converter*,\
    \ a *DAC*, thereby achieving the desired delay, which is determined by the sampling\
    \ rate and the address offset. Using off-the-shelf hardware like an Arduino®,\
    \ such a digital delay can be implemented easily and cheaply. If more than one\
    \ channel is to be delayed, special precautions must be taken to trigger all input\
    \ sample and hold circuits in parallel and to employ similar stages following\
    \ the DACs to avoid data skew.\n\nThe main disadvantage of this approach is that\
    \ time as well as the signal values are necessarily quantized. The time discretization\
    \ is determined mainly by the speed of the ADCs/DACs, the amount of available\
    \ memory, and the maximum required delay time *T*. The signal value discretization\
    \ is determined by the resolution of the ADCs/DACs. Although such circuits are\
    \ readily available with 16 bits of resolution, careful layout of the printed\
