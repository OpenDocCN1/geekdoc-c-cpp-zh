    that the gold atom’s nucleus is at a fixed position — specifically the point of
    origin of the underlying coordinate system to simplify the distance calculation
    for the \(\alpha\)-particle. With the \(\alpha\)-particle’s position being \((x,
    y)\), its distance to the gold nucleus is then

    \[

    r^2 = x^2 + y^2.

    \]


    89. These are helium nuclei and thus rather large.


    The force exerted on the \(\alpha\)-particle is described by Coulomb’s law

    \[

    F = k_e \frac{q_1 q_2}{r^2} \tag{6.26}

    \]

    where \(k_e = 8.9875 \cdot 10^9\ \mathrm{N\,m^2\,C^{-2}}\) is Coulomb’s constant
    and \(q_1, q_2\) are the magnitudes of the charges involved. Since the following
    simulation will be a qualitative one, all of these constants, including masses,
    can be gathered together in a new variable \(\gamma\).


    The force \(F\) acts proportionally to \(\cos(\varphi)\) and \(\sin(\varphi)\)
    on \(x\) and \(y\), with

    \[

    \cos(\varphi) = \frac{x}{r} \quad\text{and}\quad \sin(\varphi) = \frac{y}{r}.

    \]


    Together with (6.26) and \(\gamma\), this yields the following two coupled differential
    equations which govern the path of the \(\alpha\)-particle:

    \[

    \ddot{x} = \gamma \frac{x}{r^3},\qquad

    \ddot{y} = \gamma \frac{y}{r^3}.

    \]


    The setup for this problem, which is pretty straightforward, is shown in figure
    6.27. It should be noted that there is an explicit additional feedback path for
    the summer adding \(x^2\) and \(y^2\), which gives a scaling factor of \(1/2\).
    Accordingly, the resulting sum satisfies \(0 \le r_s \le 1\), so no overload condition
    can occur here. As mentioned above, all constants, including this factor \(1/2\),
    are gathered into the parameter \(\gamma_s\). A typical value for this parameter
    — yielding nice scattering behaviour — is \(\approx 0.01\).


    The only other free parameter is the initial height of the \(\alpha\)-particle’s
    trajectory \(y_0\). This can be either set manually by means of a free potentiometer
    connected to \(+1\) and \(-1\) or automatically as shown in figure 6.28 by means
    of a triangle wave generator consisting of an integrator working in conjunction
    with two comparators.


    To run this program, the analog computer is set to repetitive operation with an
    operation time \(t_{\mathrm{OP}} = 30\ \mathrm{ms}\). The integrator of the triangle
    wave generator must be disconnected from the central timing control by patching
    its Mode C-input to \(+1\) (only the third or fourth integrator of an INT4 module
    can be used for that purpose), so that it will not be reset between two successive
    computing runs.


    The picture shown in figure 6.29 was obtained with time constants \(k_I = 100\)
    on the four integrators in figure 6.27 and \(k_0 = 1\) in the triangle-wave generator.
    The camera was set to ISO 100 with an exposure time of 8 seconds.


    ![](img/91599d88757ed8c75960eb83f4f85a12_147_0.png)


    Fig. 6.28. Automatic/manual generation of \(y_0\)


    ![](img/91599d88757ed8c75960eb83f4f85a12_147_1.png)


    Fig. 6.29. Simulation of Rutherford scattering


    ## 6.9 Celestial mechanics


    Simulating (or determining) the movement of three (celestial) bodies with given
    parameters, such as masses, gravitational constant, initial conditions for the
    bodies’ coordinates and velocities, is known as the *three-body problem*.[90]
    The first one to tackle this problem was Sir Isaac Newton in the first book, section
    XI, of his *Principia*, which was considered “the most valuable chapter that was
    ever written on physical science” according to Sir George Biddell Airy.[91]


    Although an analytical solution is possible in the simpler case of two bodies,
    Joseph-Louis Lagrange was able to give some particular solutions for the much
    more difficult three-body problem. Since these are beyond the scope of this section,
    the reader is referred to the standard texts [BATTIN 1999, pp. 365 ff.] and [MOULTON
    1923, p. 363].


    90. This is a special case of the *n*-body problem which will not be investigated
    further here.


    91. Cf. [MOULTON 1923, p. 363].

