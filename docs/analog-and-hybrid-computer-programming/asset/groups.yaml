    ## APPENDIX H


    ### The Analog Paradigm bus system


    The Analog Paradigm Model-1 analog computer features a bus system that makes it
    easy to extend the system with additional modules for special operations such
    as the logarithm function generator described in the preceding section. All computing
    modules are based on standard *Eurocards* (160 mm × 100 mm) using two-row (A/C)
    DIN 41612 connectors. Table H.1 shows the signals available on this bus system.


    | A | Pin no. | C |

    |---|---|---|

    | +15 V | 1 | +15 V |

    | −15 V | 2 | −15 V |

    | AGND | 3 | AGND |

    | +10 V | 4 | +10 V |

    | −10 V | 5 | −10 V |

    | AGND | 6 | AGND |

    | READOUT | 7 | READOUT |

    | AGND | 8 | AGND |

    | AGND | 9 | AGND |

    | POTSET | 10 | OVERLOAD |

    | MODEOP | 11 | MODEIC |

    | RS4 | 12 | RS3 |

    | RS2 | 13 | RS1 |

    | A15 | 14 | A14 |

    | A13 | 15 | A12 |

    | A11 | 16 | A10 |

