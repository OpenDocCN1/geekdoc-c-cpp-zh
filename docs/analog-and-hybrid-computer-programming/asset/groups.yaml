    温度 T 为时间 t 和位置向量 x 的函数，即 T(x,t)。为避免方程中不必要的冗余，函数 T 的参数通常被省略。


    ∇² 是拉普拉斯算子，常也记为 Δ。它为


    ∇²T = ΔT = div(grad(T)).   (6.53)


    由于图 6.69 所示电缆二维截面的固有旋转对称性，从中心到圆周的一维平面切片足以描述整体问题。根据 (6.53)，拉普拉斯算子可简化为


    ∇²T = T''''.


    由于所讨论的电缆包含热源，通用热方程 (6.52) 必须通过添加另一项导数项进行如下调整：


    ∂T/∂t = a ( ∂²T/∂r² + (1/r) ∂T/∂r )   (6.54)


    本问题进一步由以下边界条件确定，如前所述：


    $T(r,t)=\begin{cases}T_0=\text{const.}&\text{if }r\le r_c\\0&\text{if }r>r_i\end{cases}$


    此外，假设在 $t=0$ 时绝缘体均匀冷却至 0，则有以下初始条件成立：


    $T(r,0)=\begin{cases}T_0=\text{const.}&\text{if }r\le r_c\\0&\text{else}\end{cases}\quad(6.55)$


    为了设计求解 (6.54) 的模拟计算机程序，厚度为 $r_i-r_c$ 的绝缘体将被细分为 $n\in\mathbb N$ 个厚度相等、为 $\Delta
    r$ 的切片。因此，$T(r,t)$ 被有限数量的 $T_i(t)$ 所替代，通过用关于 r 的微分商近似微分，从而得到一组可由模拟计算机易于求解的耦合常微分方程。这基于对一阶和二阶导数的以下近似


    $\left.\frac{\partial f(x,t)}{\partial x}\right|_{x_i}\approx\frac{f_{i+1}(t)-f_{i-1}(t)}{2\Delta
    x}\quad\text{and}\quad(6.56)$

    $\left.\frac{\partial^2 f(x,t)}{\partial x^2}\right|_{x_i}\approx\frac{f_{i+1}(t)-2f_i(t)+f_{i-1}(t)}{(\Delta
    x)^2}.\quad(6.57)$


    将 (6.56) 和 (6.57) 应用于 (6.54) 得到以下一般表达式


    $\dot T_i = a\left(\frac{T_{i+1}-2T_i+T_{i-1}}{(\Delta r)^2}+\frac{1}{r_c+i\Delta
    r}\frac{T_{i+1}-T_{i-1}}{2\Delta r}\right).\quad(6.58)$

    该式可直接在模拟计算机上实现，因为它仅包含关于 $t$ 的导数。


    在以下示例中，绝缘体将被分为四个等宽切片，并假设 $r_i=5r_c$，从而得到 $\Delta r=\frac{r_i-r_c}{4}=r_c$。相应地，(6.58)
    可重写如下：

    $\dot T_i = a\left(\frac{T_{i+1}-2T_i+T_{i-1}}{(\Delta r)^2}+\frac{T_{i+1}-T_{i-1}}{2(i+1)(\Delta
    r)^2}\right)$

    $=\frac{a}{(\Delta r)^2}\left(T_{i+1}-2T_i+T_{i-1}+\frac{1}{2(i+1)}(T_{i+1}-T_{i-1})\right)$


    ![](img/91599d88757ed8c75960eb83f4f85a12_180_0.png)


