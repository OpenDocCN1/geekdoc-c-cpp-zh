    # Acknowledgments and disclaimer


    This book would not have been possible without the support and help of many people.
    First of all, I would like to thank my wife RIKKA MITSAM who never complained
    about the many hours I spent writing this book. In addition to that, she did a
    lot of proofreading and post-processed all of the oscilloscope screenshots and
    various pictures to make them print-ready.


    I am also greatly indebted to Dr. CHRIS GILES who not only gave much constructive
    criticism but also pointed out lots of additional interesting literature and programming
    examples. He also extended OCCAM’s razor into OCCAM’s chainsaw during the process
    of proofreading and enhancing this book. :-)


    In addition, I wish to express sincere thanks to Dr. DUNCAN CADD, MAIKEL HAJJABADI,
    FELIX LETKEMANN, BERND JOHANN, NICOLÉ MATJE, OLIVER BACH, JENS FLEMMER, Dr. Christian
    KaminSKI, Dr. Robert Schore and IAN S. KING who have proofread this book and offered
    helpful advice. Discussions with JENS BREITENBACH greatly enhanced appendix C
    for which I am very grateful. He also spotted numerous errors and inconsistencies
    which were rectified accordingly.


    I am also indebted to Mr. MIRKO HOLZER who programmed the digital portion of the
    hybrid computer setup described in section 7.5.


    Last but not least, I would like to thank TIBOR FLORESTAN PLUTO for his permission
    to use some of his photographs in this book (figure 6.53 and the title picture).


    All of the worked examples in the book have been implemented on an Analog Paradigm
    Model-1 analog computer, for two reasons. First, the author is one of the main
    developers of this system and second, the machine seems to be the only analog
    computer currently available on a commercial basis. All of the examples can be
    (and have been to a large degree) programmed on other machines, like the classic
    Telefunken or EAI table-top computers, if the relatively minor differences'
