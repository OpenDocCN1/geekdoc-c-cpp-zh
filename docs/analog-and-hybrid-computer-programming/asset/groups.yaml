    ## CHAPTER 5 Special functions


    As in classic digital computer programming there are *special functions* that
    frequently occur in analog computer setups, such as inverse functions (like (square)
    roots), limits, hysteresis etc. This chapter describes typical "library" functions
    which can be used as building blocks for more complex programs. As in the algorithmic
    domain, especially among Perl programmers, the saying "there is more than one
    way to do it" holds true for analog computer programs. The functions described
    here are typically neither the only possible implementations nor necessarily the
    best.


    In case of doubt or when searching for other functions, the vast classic literature
    should be consulted. The definitive books [KORN et al. 1964] and [GILOI et al.
    1963] (German) as well as [HAUSNER 1971], [GILLILAND 1967], [AMMON 1966], and
    [CARLSON et al. 1967] are highly recommended for further reading.


    ### 5.1 Inverse functions


    A very powerful technique for function generation is that of inverse functions,
    for example obtaining a square root based on the function $f(x)=x^2$. Recalling
    the basic setup of summers and integrators, the idea of a setup yielding an inverse
    function is simple and relies on the fact that the operational amplifier tries
    to keep its inverting input, SJ, at zero. Figure 5.1 shows the basic setup to
    generate an inverse function.


    ![](img/91599d88757ed8c75960eb83f4f85a12_91_0.png)


    Fig. 5.1. Basic setup for generating an inverse function


    At the heart of this circuit is a function generator that forms the feedback element
    of an open amplifier. With an input signal of x the summing junction will be at
    zero, if −x = f(−y) with y = f^{−1}(x) being the value at the output of the amplifier.


    If the inverse function is not defined over the full range of [−1, 1], some precautions
    are necessary to prevent the amplifier from overloading. It is also sometimes
    necessary to connect a small capacitor, typically 10s of pF, between the output
    of the operational amplifier and its summing junction, if the basic setup shows
    signs of instability.<sup>49</sup>


    ### 5.1.1 Square root


    A good example of an inverse function is the square root circuit shown in figure
    5.2. This is basically the same as the setup shown in figure 5.1 with two additional
    parts. A diode and a small capacitor are connected between the output of the open
    amplifier and its summing junction. The diode prevents saturation of the amplifier
    when the input becomes positive as in this case the input to the amplifier and
    the output of the multiplier will both be positive, thus driving the amplifier''s
    output to its maximum negative level.


    Although this does not harm the amplifier, driving it into saturation will generate
    an overflow in addition to yielding a nonsensical output value. Furthermore, the
    amplifier may take some time to recover from this condition. This is especially
    true for classic analog computers, which can exhibit recovery times of up to several
    seconds. Note that the diode will keep the amplifier''s output a tad below zero
    due to its forward threshold voltage – which is about 0.7 V for a standard silicon
    diode and as low as 0.2 V for a SCHOTTKY diode.


    ![](img/91599d88757ed8c75960eb83f4f85a12_92_0.png)


    **Fig. 5.2.** Typical square root circuit


    ![](img/91599d88757ed8c75960eb83f4f85a12_92_1.png)


    **Fig. 5.3.** Function generated by the computer setup shown in figure 5.2 with
    −1 ≤ x ≤ 1


    The small capacitor prevents ringing when the amplifier’s output is near zero.
    In some cases it could be omitted depending on the behaviour of the open amplifier
    used. Figure 5.3 shows the behaviour of this circuit. The input value has been
    generated by a single integrator yielding a ramp running from −1 to +1. This ramp
    has also been used for the x-deflection of the oscilloscope, too.


    ### 5.1.2 Division


    The square root circuit shown above can be easily modified to implement a division
    operation. Figure 5.4 shows the basic setup: With the multiplier connected to
    the output of the amplifier and to the input variable $y$, the open amplifier
    will drive its output towards −x/y, so that the output of the multiplier yields
    −x which cancels the current delivered through the x-input and its associated
    input resistor to the inverting input of the amplifier.


    As noted before, a small capacitor of about 68 pF should be connected between
    the output of the amplifier and its summing junction to prevent unstable behaviour
    of the circuit. It should be also noted that this circuit does not perform a four-quadrant
    division operation.


    Some systems feature pre-wired modules to compute common inverse functions such
    as square roots and divisions. Figure 5.6 shows an Analog Paradigm MDS2 module
    containing two computing elements that can be switch selected to perform either
    multiplication, division, or square rooting.


    ![](img/91599d88757ed8c75960eb83f4f85a12_94_0.png)


    Fig. 5.7. Generating 1/τ


    ![](img/91599d88757ed8c75960eb83f4f85a12_94_1.png)


    Fig. 5.8. Generation of τ⁻¹ with τ₀⁻¹ = 1 and 2.5 V per division


    ![](img/91599d88757ed8c75960eb83f4f85a12_94_2.png)


    Fig. 5.9. Generating successive powers of τ


    ### 5.3 Powers and polynomials


    Powers of τ and/or polynomials built from such powers are often required within
    a computer setup. At first glance such powers can, of course, be generated by
    means of multipliers fed with a linear ramp signal such as −1 ≤ τ ≤ 1 but this
    is not always realistic as multipliers are expensive and analog computers, especially
    historic ones, typically have only few of them. Furthermore, many multipliers
    such as quarter square multipliers show non-negligible errors when their input
    values approach zero.


    Consequently, it is often more advisable to generate powers of a linearly time
    varying variable τ by means of successive integration as shown in figure 5.9.
    This setup yields the powers τ, −τ², and τ³ for −1 ≤ τ ≤ 1.<sup>50</sup>


    ![](img/91599d88757ed8c75960eb83f4f85a12_95_0.png)


    Fig. 5.10. Successive powers of τ generated by successive integrations


    This circuit can obviously be extended for higher powers of τ and some of the
    coefficient potentiometers can readily be replaced by joining inputs of the following
    integrator, i.e. a factor 0.2 in front of an input weighted with 10 can be replaced
    by feeding the value into two connected inputs, each with weight 1 etc. The successive
    powers of τ generated by such a setup can also be added together (with optional
    changes of sign by means of summers) and coefficients to form arbitrary polynomials.
    Figure 5.10 shows the time-dependent functions generated by the setup shown above.


    ### 5.4 Low pass filter


    Sometimes, for instance when processing data gathered from experiments, a low
    pass filter is useful. From a rather simplified point of view such a device lets
    only frequencies below a certain threshold pass.


    Another application for such a circuit is the filtering of a (white) noise signal
    obtained from a noise generator. Such signals, filtered and possibly shaped into
    a suitable distribution (e.g. Gaussian), are extremely useful when the behaviour
    of mechanical systems exposed to random excitation is to be analyzed.


    Although some classic analog computers such as the EAI-231(RV) or the Telefunken
    RA 770 feature noise generators yielding a normally-distributed output signal,
    such devices are rare nowadays. Noise generators intended for audio purposes feeding
    a low pass filter may be used instead; this is described below. If a normal distribution
    of the output signal is required, it can be readily obtained by using a suitable
    function generator.


    ![](img/91599d88757ed8c75960eb83f4f85a12_96_0.png)


    Fig. 5.11. Basic circuit of a low pass filter


    Implementing a low pass filter on an analog computer is extremely simple as it
    just resembles a 1st-order time lag with the general transfer function


    $F(p) = \frac{1}{1 + pT}$


    where $T$ represents the time constant of the delay line.<sup>52</sup> This setup,
    shown in figure 5.11, basically yields a time varying mean value of its input
    signal. This mean gets "better" as the time constant of the circuit increases
    – but this also implies that the circuit needs a longer time span to settle on
    the mean value.


    Typically, both coefficient potentiometers are set to identical values although
    sometimes a certain deviation from the "ideal" setting may be advantageous depending
    on the desired output signal.


    Figure 5.12 shows a white noise signal ranging from 0 Hz to 100 kHz obtained from
    a professional noise generator in the upper third of the screen. The curve in
    the middle is the result of applying one low pass filter of the structure shown
    above while the lower trace result represents the output signal of a second low
    pass filter connected to the output of the first filter.


    ### 5.5 Triangle/square wave generator


    Sometimes it is desirable to have a triangle or square wave signal available.
    Typical applications for a triangle wave are the x-deflection for an oscilloscope
    or plotter while square waves are often handy to control electronic switches to
    display more than one curve or figure on an oscilloscope.<sup>53</sup>


    <sup>52</sup> Cf. [GILOI et al. 1963, p. 308] and appendix B for more details.
    p is an operator implementing a time derivative.


    <sup>53</sup> Cf. [KORN et al. 1964, ch. 9-5].

