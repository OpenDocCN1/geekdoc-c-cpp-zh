    图 2.13. 通过对常数进行双重积分生成抛物线


    模拟计算机最简单的运算周期由 IC-OP-HALT 模式序列组成，在 OP 模式下所花费的时间要么手动决定，要么由精密定时器决定。这通常称为手动控制，常用于低速计算。


    然而，在许多情况下，希望在示波器上显示变量随时间变化的、无闪烁或基本无闪烁的图像，这需要一种称为重复运算的自动运行方式。在这种方式下，精密定时器使积分器按照
    IC-OP-IC-OP-... 的模式序列重复循环。若时间比例因子足够高，就可以每隔几毫秒重复一次完整的模拟运行，从而能够在示波器上显示一组图形。


    当然，由于可以在任意时刻手动更改计算机设置的系数和初始条件，因此重复运算可以让人立即了解问题相对于其参数化的行为方式，因为可以在显示器上即时看到参数变化的效果。


    这种运行方式的一种变体称为单次运行，由预设 IC 时间和 OP 时间的单个 IC-OP-HLT 序列组成。当使用笔式绘图仪作为输出设备时，这尤其有用，因为单次运行可以绘制出问题的特定解。


    图 2.13 所示的计算机设置演示了重复运算。它由两个串联的积分器组成，最左侧的积分器输入常数 +1。一个只有单输入的加法器用于反转第一个积分器输出的符号。


    将两个积分器设置为相同的时间比例因子 k0 = 10^n，并将 OP 时间设置为 2·10^3−n 毫秒（例如 k0 = 100，OP 时间为 20 ms），会得到一个线性


    这些计算元件的输入能力。此外，它们还可以用于建立专门的反馈路径，以构建能够产生绝对值、迟滞、符号函数等功能的计算机电路，稍后将予以展示。


    图 2.15 展示了三个典型的 Analog Paradigm 自由元件模块的前面板。


    最左侧的模块称为 XIR，因为它包含两个自由电阻网络，可以连接到任何加法器或积分器的求和点，以扩展可用输入的数量。除了权重为 1 和 10 的标准输入外，该模块还具有权重为
    0.1 和 100 的输入电阻。


    中间的模块 XID 包含六个肖特基二极管以及两个 10 V 齐纳二极管，有时也称为 Z 二极管，常用于实现限幅器等。


    右侧的模块 XIBNC 拥有四个 BNC 插孔，可用于将示波器、函数发生器等外围设备连接到模拟计算机系统。


    ## 2.5 电位器


    如果一台机器在设置中无法设定系数，那么一旦问题比上面所示的简单抛物线稍微复杂一点，它就会变得相当无用。在模拟电子模拟计算机中，所谓的系数电位器，或简称电位器，口语中也称“pots”，被用作可调衰减器来引入系数。这种设备最简单的形式就是用作分压器的电位器。


    图 2.16 顶部显示了系数电位器的两种基本电路，以及模拟计算机编程中使用的图形表示。左侧所示的简单分压器允许设置 0 到 1 范围内的系数。在某些情况下，使用图中右半部分所示的所谓自由电位器，在两个输入值之间连续交叉渐变。


    分压器基本上可以看作由一个上电阻 Ru 和一个下电阻 Rl 串联在输入信号与地之间组成。输出端连接到两个电阻的连接点。两个电阻之间的比例由电位器旋钮的角度位置
    α 决定：


    Ru = (1 − α)R


    Rl = αR


    显然，α = 0 时完全没有输出信号，因为此时输出端实际上接地。


