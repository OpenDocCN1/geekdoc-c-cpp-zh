    ## 4.4 数学摆


    本节描述了如图 4.16 所示数学摆尖端的运动仿真。它由一根无重杆组成，该杆在点 0 处铰接，可在无摩擦的情况下绕其摆动。在杆的另一端安装了一个点质量 m。角
    α₀ 表示摆的最大位移，即其初始条件，而 α 表示相对于通过位于 0 处的支点的垂直线的当前角度。


    该质量受到由重力加速度引起的力 F_g = mg 的作用。这可以分解为作用在质量上的两个力：切向力 (F_t) 和径向力 (F_r)：


    F_t = -mg sin(α)

    F_r = mg cos(α)


    F_t 是恢复力，它将把质量驱动回其静止位置。它引起切向加速度


    a_t = F_t / m = l α̈


    ![](img/91599d88757ed8c75960eb83f4f85a12_79_0.png)


    图 4.16. 数学摆（参见 [HORT 1910, p. 1]）


    ### 4.4.1 直接实现


    如果不是这个方程中的 sin(α) 项，它可以用模拟计算机很容易求解，只需使用求和器、积分器和系数电位器。这个正弦项使事情变得稍微复杂一些。如果有正弦函数发生器可用，可以用它来实现该方程。否则必须采用以下两种方法之一：


    如果 α 足够小⁴³ sin(α) 可以近似为


    $\sin(\alpha) \approx \alpha$


    这将 (4.6) 简化为


    $\ddot{\alpha} = -\frac{g}{l}\,\alpha$


    这只是 (4.5)，其中 $\omega^2 = g/l$，因此摆可以用之前已显示在图 4.9 中的计算机设置来仿真。


    如果 α 不足够小，则需要正弦函数发生器，或者可以采用上面描述的扫描电路来生成正弦函数


    43 什么算足够小实际上取决于该问题解所需的精度。通常，−π/8 ≤ α ≤ π/8 可以认为足够小，因为误差将保持在 1% 以下。


    ![](img/91599d88757ed8c75960eb83f4f85a12_80_0.png)


    图 4.17. 带正弦发生器电路的摆仿真


    其参数基于 α̇ 而不是 α。幸运的是，α̇ 已经可用，因为 α̈ 必须进行积分。图 4.17 显示了由 α̇ 控制的正弦发生器的计算机设置。


    需注意：尽管这种正弦/余弦发生器子电路很有用，但它会受到漂移和乘法器平衡误差的影响。通常不应将其用于长时间仿真，最好在计算机设置为重复操作且 OP 时间较短时使用。


    ### 4.4.2 变体


    尽管这种实现相当优雅，但它需要付出代价，因为仅用于生成正弦函数就需要两个乘法器、两个积分器和一个求和器。在像这种数学摆的情况下，其中三角函数的参数是受限的（只要摆不翻转就是这种情况），其他实现变体可能更有优势。


    一个直接的方法是使用泰勒级数


    $$\sin(\varphi) = \sum_{n=0}^{\infty} (-1)^n \frac{\varphi^{2n+1}}{(2n+1)!}$$


    来近似所需的谐波函数。根据所需的精度，而精度又取决于参数 φ 的范围，通常足以设定


    $$\sin(\varphi) \approx \varphi - \frac{\varphi^3}{6}\tag{4.7}$$


    对于限制在 $-\pi/4 \le \varphi \le \pi/4$ 的参数。


    该函数可以用两个乘法器、一个求和器和一个系数电位器轻松生成，从而不仅节省了一些额外的计算电-


