    they can be generated by two separate sub-programs. The x-component of the ball''s
    velocity is assumed to decrease linearly over time. The actual x-position of the
    ball is derived by integrating over its velocity. Every time the ball hits the
    left or right wall of the box, it changes its direction, i.e. it is reflected
    by the wall.


