  mdcn: "\n![](img/91599d88757ed8c75960eb83f4f85a12_168_0.png)\n\n图 6.58. AIZAWA 吸引子的\
    \ x、z 相空间图\n\n缩放这些方程以确保没有任何变量超过 ±1 的机器单位是直接的：x、y 和 z 对应的缩放因子分别为 λₓ = 1/3、λᵧ =\
    \ 1/4 和 λ_z = 1/2。值 z − β 按 2/5 缩放。由此得到的计算机设置相当复杂，如图 6.57 所示。总共需要三个积分器、四个求和器、七个乘法器和十一个系数电位计来实现此程序。图\
    \ 6.58 显示了 AIZAWA 吸引子的 x、z 相空间图——一个异常美丽的结构。为了实现这一点，图 6.57 中用 * 和 ** 标记的两个缩放得到的参数被略微改变以获得“更美观”的图像。通过缩放得到的这些值分别为\
    \ 0.95 和 0.27。\n\n## 6.18 Nosé-Hoover 振子\n\n另一个美丽的混沌系统是 Nosé-Hoover 振子，其描述见 [SPROTT\
    \ 2010, pp. 95 ff.]。该系统由以下一组耦合微分方程描述：\n\n```\n\\dot{x} = y\n\\dot{y} = y z - x\n\
    \\dot{z} = 1 - y^2\n```\n\n## 6.19 旋转螺旋\n\n以下示例在示波器上显示一个旋转螺旋，极具吸引力。它使用类似于第 6.12\
    \ 节图 6.44 所示的电路，在示波器屏幕上产生一个三维螺旋。由于需要连续旋转，该程序中给出 sin(φ) 和 cos(φ) 值的两个电位计被一个简单的谐振荡器取代，后者产生一个\
    \ sin(ωt) 和 cos(ωt) 信号对。103\n\n图 6.61 显示了整体计算机设置。顶部是一个高速运行的谐振荡器，其时间尺度因子为 k0 =\
    \ 10³ 或，更好的是 k0 = 10⁴。电位计 α 决定阻尼量，从而决定螺旋的形状。三维螺旋还需要另一个时间相关变量 τ，它由原理图中间的积分器产生，其时间尺度因子为\
    \ k0 = 10²。这三个积分器以重复模式运行，工作时间为 20 ms。\n\n图 6.61 底部的振荡器产生一个无阻尼的正弦/余弦信号对，并以其时间尺度因子设置为\
    \ k0 = 1 的连续模式运行。两个振荡器积分器通过使用手动开关将其各自的 ModeIC 输入连接到 +1 来进行外部控制。如果开关打开，104 这些积分器处于\
    \ IC 模式。开关闭合时，两个积分器均设置为 OP 模式。三维螺旋到二维的实际投影由原理图中间所示的两个乘法器后接一个求和器完成。\n\n图 6.62 显示了旋转螺旋的两个典型快照。在这两种情况下，旋转都已通过利用其\
    \ ModeOP 输入将图 6.61 底部的两个振荡器积分器置于 HLT 模式而停止（设置中未显示）。左图是在将两个最上方积分器的时间尺度因子设置为 k0\
    \ = 10³ 的情况下拍摄的，而右图对应于 k0 = 10⁴。如果所用积分器不直接提供此时间尺度因子，则可以在其 SJ 输入端连接提供足够大输入权重的附加输入电阻。通过这种技术可以实现高达\
    \ 100 的输入权重。\n\n![](img/91599d88757ed8c75960eb83f4f85a12_171_0.png)\n\n图 6.61.\
    \ 旋转螺旋的计算机设置\n\n![](img/91599d88757ed8c75960eb83f4f85a12_171_1.png)\n\n图 6.62.\
    \ 不同时间尺度因子的旋转螺旋快照\n\n## 6.20 机翼周围的流动\n\n本节描述的程序模拟空气在一种特殊类型的机翼、JOUKOWSKY 机翼 105\
    \ 周围的流动。基本思想是模拟空气在无限长旋转圆柱体周围的流动，然后通过保角映射将其连同周围气流一起变换成机翼形状。106\n\n在空气中运动的旋转物体，如高尔夫球或旋转圆柱体，会受到一种力的作用，该力源于其旋转与周围介质的共同作用。这被称为\
    \ MAGNUS 效应，以德国物理学家 HEINRICH GUSTAV MAGNUS 命名，他首次对这一现象给出了可理解的解释。下面将使用以下假设来模拟旋转圆柱体周围的气流：\n\
    \n- 圆柱体具有圆形截面，是无限长的。\n- 气流始终垂直于圆柱体轴线。此外，它是静止且保守的，即\n\n  v dot = 0 and A dot =\
    \ 0\n\n  其中 v 和 A 分别表示气流的速度和面积。\n- 空气被假定为不可压缩且无摩擦。\n\n这种气流是势流，其速度场因此可以描述为某个复函数\
    \ f(z) 的梯度，该函数称为速度势。函数\n\nf(z) = v0 ( z e^{i varphi} + r^2 e^{-i varphi} / z )\
    \ - i Gamma / (2 pi) log(z)\n\n将在本例中使用。这里 r 表示空气流动的圆柱体半径。v0 是气流的初始速度，varphi 是攻角，Gamma\
    \ 是环量分量。\n\n首先需要一个电路来产生旋转圆柱体的周长，即一个圆。这与之前一样通过求解经典微分方程 y double dot = -y 实现，如第\
    \ 4.2 节图 4.11 所示。半径通过控制负反馈的参数 alpha* 以及第一个积分器的初始条件 a 设置约为 0.4。这两者必须匹配，以避免模拟运行开始时的伪影。如前所述，系数\
    \ alpha 提供一个非常小的正反馈。如果半径在长时间运行中不减小，则可以省略它。如果需要，应将其设置为约 0.005，否则正弦/余弦信号将被失真。两个积分器的时间尺度因子应至少设置为\
    \ k0 = 10^3。\n\n复速度势的程序更为复杂，如图 6.63 所示。该电路期望三个参数/输入值：\n\n![](img/91599d88757ed8c75960eb83f4f85a12_174_0.png)\n\
    \n图 6.64. 生成 ±τ 的电路\n\n![](img/91599d88757ed8c75960eb83f4f85a12_174_1.png)\n\n\
    图 6.65. 旋转圆柱体周围的流动\n\nof 20 ms, the integrator used to generate this signal must\
    \ be controlled externally. On an Analog Paradigm Model-1 this can be achieved\
    \ by patching the IC-input of one of the two rightmost integrators of an INT4\
    \ module to +1. The actual range of y can be controlled by an additional coefficient\
    \ potentiometer at the output of the triangle signal generator.\n\n将所有这些组合起来并使用具有两个独立\
    \ (x,y) 输入的显示器，可以可视化旋转圆柱体周围的气流，如图 6.65 所示。\n\n使用保角或保角映射，现在可以将圆柱体截面变换成机翼形状。将相同的映射应用于圆柱体周围的流线，可得到该特定机翼周围的相应流线。\n\
