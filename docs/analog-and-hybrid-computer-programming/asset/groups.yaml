    现在，$0 < \omega < 1$ 怎么办？一个简单的解决方案难道不需要在图 4.8 所示设置中的反相器之后仅使用一个系数电位器吗？不幸的是，情况并非如此，因为
    $\omega$ 实际上会影响两个积分器的时间缩放！仅使用反相器之后的一个电位器，从而位于最左侧积分器输入之前，只会将其时间比例因子更改为 $\omega
    k_0$，而第二积分器仍以 $k_0$ 运行。因此，通常有必要同时改变两个积分器的时间比例因子，如图 4.9 所示。


    图 4.10 显示了 $\omega = \frac{1}{2}$ 时最左侧积分器的输出信号。屏幕上一个 x 分格对应 2 ms，如前所述。因此，所显示正弦信号的一个周期约为
    12.55 ms，这对于该特定 $\omega$ 值来说是对 $4\pi$ 的良好近似。


    到目前为止显示的结果是在计算机设置为重复操作且 OP 间隔为 20 ms 时生成的。在某些情况下，像图 4.9 所示那样的电路必须长时间运行，例如要在示波器上显示一个球（基于正弦/余弦信号对的缩小单位圆），当它在盒子中弹跳时。在这种情况下，像这样简单的计算机设置通常是不够的，因为所产生的正弦/余弦信号对的幅度在长时间内不会保持恒定。这源于真实计算元件不可避免的缺陷。根据所用计算机的不同，幅度可能随时间减小或增大，要么坍缩为零，要么导致积分器和反相器的过载条件。


    因此，需要一些额外的电路用于 *幅度稳定*。其背后的思想相当简单。一方面，为了避免幅度减小，必须引入一些正反馈。这就使得限幅电路成为必要，以避免否则必然会出现的不断增加的幅度。这两种措施当然会引起一些，但通常可以忽略的波形失真，尤其是在正弦/余弦信号用于驱动某种显示时。


    图 4.11 显示了一个带幅度稳定的正交发生器的典型设置：其核心是之前所示的电路，不同之处在于中心反馈环路使用加权为 10 的积分器输入，使得整体时间比例因子为
    10ω₀。标记为 α 的电位器向环路引入一些正反馈，从而稳步增加输出信号的幅度。根据所用模拟计算机的不同，这种正反馈可能是不必要的。如果没有它幅度减小，将
    α 设置为一个很小的值（通常小于 10⁻²）就足够了。为了避免过载，需要一些负反馈来保持整体幅度稳定。这是通过电位器 α* 实现的，这是需要自由电位器的罕见情况之一。该电位器的输出（电刷）连接到二极管，而二极管又连接到加权为
    1 的积分器输入。


    这里的想法是对二极管施加负偏置，使其仅在最左侧积分器的输出高于该偏置电压时开始导通。然后二极管开始导通，本质上实现了负反馈环路（具有负指数特性）。重要的是，与二极管相连的输入的权重至少比主反馈环路的输入小
    10 倍。


    该设置在具有缓冲系数电位器的模拟计算机上工作良好，例如本文使用的 Analog Paradigm Model-1。如果使用没有缓冲电位器的经典模拟计算机，则应将连接到电位器
    α* 的二极管的阴极连接到最左侧积分器的求和节点。⁴⁰


