    如图 6.85 所示。如果计算机具有分解器单元，则可以使用其中一个来实现旋转，而不用使用四个乘法器和两个求和器。[120]


    > [120] 基本上，分压器结合了所需的函数发生器、乘法器和求和器，这些是像极坐标到直角坐标的变换及其反向或坐标系旋转等操作所需的。


