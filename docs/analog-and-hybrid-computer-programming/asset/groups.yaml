    4.3 所示计算机设置中就可以表示为 \(N(0) = 1\)。如果一段时间后反相器输出 \(N\) 读数为 0.4，则对应 \(0.4 \cdot 0.12
    = 0.048\) 摩尔。


    因此，有必要区分所谓*问题变量*和*机器变量*：前者是问题数学表示中出现的变量，后者是对应变量在给定缩放后的计算机设置中的形式。机器变量常带帽子记号：


    \[

    \hat{N} = \alpha N \quad \text{with} \quad \alpha = \frac{1}{\max(N)}

    \]


    其中 \(\alpha\) 是该变量的比例因子。在上面的例子中，


    \[

    \alpha = \frac{1}{0.12} \approx 8.333.

    \]


    这种变量幅度缩放只是问题的一个方面。还需要区分*问题时间*，即实际问题运行的时间，和*机器时间*，即当前模拟运行的时间。将问题时间转换为机器时间的过程称为*时间缩放*。为了区分这两个时间，常用符号
    \(t\) 和 \(\tau\) 分别代表问题时间和机器时间；它们通过比例因子 \(\beta\) 联系，且有 \(\tau = \beta t\)。\(\beta\)
    由给定设置中积分器的 \(k_0\) 与它们各自输入权重的乘积确定。


