    ## 6.13 洛伦兹吸引子


    另一个更为著名的混沌系统是引人入胜的洛伦兹吸引子（LORENZ-attractor），它由爱德华·诺顿·洛伦兹于 1963 年提出，作为大气对流的简化模型，最初在
    [LORENZ 1963] 中描述。尽管这项开创性工作是在数字计算机（Royal McBee LGP-30）上完成的，但洛伦兹吸引子当然也特别适合在模拟计算机上实现，如下所示。


    这个动态混沌吸引子由以下三个耦合微分方程组描述：


    ```

    \dot{x} = \sigma(y - x)

    \dot{y} = x(\rho - z) - y

    \dot{z} = xy - \beta z

    ```


    参数为 σ = 10、β = 8/3 和 ρ = 28。显然，这组微分方程必须进行缩放才能在模拟计算机上实现。得到的缩放后方程如下：


    ```

    x = \int (1.8y - x) dt + C

    s = 1 - 2.678z

    y = \int (1.5556xs - 0.1y) dt

    z = \int (1.5xy - 0.2667z) dt

    ```


    C 表示生成 x 的积分器的初始条件，并不关键。考虑到模拟计算机的每个加法器和积分器都会隐式地改变符号，并且注意到 xy = -x(-y)，这些方程可以进一步简化，从而在最终的计算机接线图中节省两个反相器：


    ```

    -x = - \int (1.8y - x) dt + C

    ```


    ![](img/91599d88757ed8c75960eb83f4f85a12_159_0.png)


    图 6.45. 洛伦兹吸引子的计算机接线图（第二个积分器反馈回路中的 0.2667 可以减小到约 0.125，以获得更好的结果）


    ![](img/91599d88757ed8c75960eb83f4f85a12_161_0.png)


    图 6.48. 混沌 LORENZ-84 系统的程序


    ```

    \dot{x} = -y^2 - z^2 - a x + a f,

    \dot{y} = x y - b x z - y + g, and

    \dot{z} = b x y + x z - z

    ```


    参数为 $a = \frac{1}{4}$，$b = 4$，$f = 8$，$g = 1$。


    对该系统进行缩放非常直接，因为快速的数值实验表明 $|x|$、$|y|$、$|z|$ 都以 2 为界。由此得到的模拟计算机程序如图 6.48 所示。调整参数相当有趣，一组典型的解如图
    6.49 所示。


    ## 6.15 蔡氏吸引子


    本节描述一个更为复杂的混沌系统——蔡氏振荡器（CHUA-oscillator）。该系统由蔡少棠（LEON ONG CHUA）于 1983 年发现，是展现混沌行为的电子线路的经典范例。该振荡器产生一个独特且特别美丽的吸引子，称为双涡卷吸引子。其核心是一个（假设的）非线性器件，称为蔡氏二极管。


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_0.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_1.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_162_2.png)


    图 6.40. LORENZ-84 系统的典型行为，三个屏幕截图分别显示 x 对 y、z 对 x、以及 y 对 z


    这个特定振荡器的数学描述基于三个耦合微分方程，形式如下


    ```

    \dot{x} = c_1 (y - x - f(x)),    (6.36)

    \dot{y} = c_2 (x - y + z), and    (6.37)

    \dot{z} = -c_3 y                 (6.38)

    ```


    其中 f(x) 描述蔡氏二极管的行为，定义为


    ```

    f(x) = m_1 x + (m_0 - m_1)/2 (|x + 1| - |x - 1|).    (6.39)

    ```


    参数的标准值为

    - c₁ = 15.6，

    - c₂ = 1，

    - c₃ = 28，

    - m₀ = −1.143，

    - m₁ = −0.714。


    由于该耦合微分方程组具有显著的非线性行为，其缩放并不简单。各个项的范围是通过在数字计算机上计算示例解来确定的——这种技术早在 1960 年代就已使用。随后用这些结果来指导缩放过程。为简化整个过程，将方程
    (6.37)、(6.38) 和 (6.39) 拆分为单独各项，得到如下一组缩放后的方程。(6.36) 替换为


    $$\begin{aligned}

    x_0 &= 0.1 && (6.40)\\

    x_1 &= -10(x+f(x)) && (6.41)\\

    x_2 &= y+\frac{1}{2}x_1 && (6.42)\\

    x &= 3.12\int x_2\,dt+x_0 && (6.43)

    \end{aligned}$$


    其中 (6.40) 表示积分的初始条件。


    (6.37) 拆分为


    $$\begin{aligned}

    y_1 &= z-\frac{1}{8}y && (6.44)\\

    y_2 &= 1.25x+2y_1 && (6.45)\\

    y &= 4\int y_2\,dt && (6.46)

    \end{aligned}$$


    而 (6.38) 变为


    $$z=-\int 3.5y\,dt. \qquad (6.47)$$


    核心元件蔡氏二极管的实现相当昂贵，因为每个绝对值函数的实现至少需要两个二极管和一个运算放大器。$f(x)$ 被分解并按如下方式缩放：


    $$\begin{aligned}

    f_1 &= |0.7143x+0.2857| && (6.48)\\

    f_2 &= |0.7143x-0.2857| && (6.49)\\

    f_3 &= f_1-f_2 && (6.50)\\

    f(x) &= -0.714x-0.3003f_3 && (6.51)

    \end{aligned}$$


    从这些方程推导计算机接线图十分直接。第一组方程 (6.40, 6.41, 6.42, 6.43) 的实现如图 6.50 所示。第二组方程 (6.44, 6.45,
    6.46, 6.47) 的实现如图 6.51 所示。


    如果接线图出现不稳定迹象，可能需要在 $f(x)$ 电路中两个运算放大器各自的求和节点与输出之间添加小电容。图 6.52 显示了方程 (6.48)、(6.49)、(6.50)
    和 (6.51) 的程序。


    ![](img/91599d88757ed8c75960eb83f4f85a12_165_0.png)


    ![](img/91599d88757ed8c75960eb83f4f85a12_165_1.png)


    **图 6.53.** 蔡氏振荡器在 Analog Paradigm Model-1 模拟计算机原型上的接线图


    **图 6.54.** 双涡卷吸引子的相空间显示


    图 6.53 显示了该程序在 Analog Paradigm Model-1 模拟计算机早期原型上的实现，该原型配备专用的双绝对值函数模块，大大简化了 $f(x)$
    的实现。


    根据此程序中积分器所选择的时间比例因子，既可以在示波器上显示双涡卷吸引子的相空间图，也可以使用传统笔式绘图仪将其绘制出来。图 6.54 显示了时间比例因子设为
    $k_0 = 10^3$ 时运行计算的典型屏幕截图。


    ## 6.16 非线性混沌


    另一个出奇简单的混沌系统也将绝对值函数作为核心非线性元件。该系统在 [Kiers et al. 2003] 中有所描述。其特征由以下微分方程给出：


    $\ddot{x} = -\lambda\dot{x} - \dot{x} + |x| - 1$


    一个显著的特点是，该系统的行为仅由一个参数 $\lambda$ 控制。缩放后的计算机程序如图 6.55 所示。如果所用的模拟计算机上没有现成的绝对值函数，可以按图
    5.18 所示搭建一个。


    图 6.56 显示了 $\lambda \approx 0.62$ 时基于 $-\ddot{x}$ 和 $\dot{x}$ 的相空间图示例。


    ![](img/91599d88757ed8c75960eb83f4f85a12_166_0.png)


    图 6.55. 非线性混沌的计算机接线图


    ![](img/91599d88757ed8c75960eb83f4f85a12_166_1.png)


    图 6.56. 混沌吸引子的相空间图


    ## 6.17 相泽吸引子


    到目前为止最漂亮的混沌吸引子之一是相泽吸引子（AIZAWA attractor）¹⁰¹，它由以下三个耦合微分方程描述


    ˙x = x(z − β) − δy，

    ˙y = δx + y(z − β)，以及

    ˙z = γ + αz − z³/3 + εzx³


    参数为 α = 0.095、β = 0.7、γ = 0.65、δ = 3.5 和 ε = 0.1。关于该特定系统行为的详尽数值研究可参见 [LANGFORD
    1984]。


    101 参见 [COPE 2017]。


    102 原系统的 γ = 0.6，但通常取 0.65 会得到更好的结果。


