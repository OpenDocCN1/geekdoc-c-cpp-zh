    Since this is a closed physical system all forces add up to zero yielding the
    following second order differential equation which describes the dynamic behaviour
    of this mass-spring-damper system:


    $$m\ddot{y} + d\dot{y} + s y = 0 \tag{4.8}$$


    Here, $m$ denotes the mass, $d$ is the damper constant, and $s$ the spring constant.
    Without the damping force $F_d$ this would just be an undamped harmonic oscillator,
    as in the previous examples.


    ### 4.5.1 Analytical solution


    This mechanical system is still simple enough to be solved analytically, which
    is useful as this solution can be compared later with the solutions obtained by
    means of an analog computer. Dividing (4.8) by $m$ yields


    $$\ddot{y} + \frac{d}{m}\dot{y} + \frac{s}{m} y = 0. \tag{4.9}$$


    With the following definitions of the damping coefficient


    $$\beta := \frac{d}{2m}$$


    and the (undamped) angular eigenfrequency[44]


    $$\omega_0 = \sqrt{\frac{s}{m}}$$


    this can be rewritten as


    $$\ddot{y} + 2\beta\dot{y} + \omega_0^2 y = 0. \tag{4.10}$$


    A classic approach to tackle such a differential equation is the exponential function.


    “Guessing”


    $$y = a e^{\mu t}$$


    yields


    $$\dot{y} = \mu a e^{\mu t} \quad \text{and} \quad \ddot{y} = \mu^2 a e^{\mu t}.$$


    Substituting these into (4.10) yields


    $$\mu^2 a e^{\mu t} + 2\beta\mu a e^{\mu t} + \omega_0^2 a e^{\mu t} = 0.$$


    Dividing by $a e^{\mu t}$ results in the following quadratic equation


    $$\mu^2 + 2\beta\mu + \omega_0^2 = 0$$


    which can be readily solved by applying the quadratic formula


    $$\mu_{1,2} = -\frac{p}{2} \pm \sqrt{\frac{p^2}{4} - q}$$


    with $p = 2\beta$ and $q = \omega_0^2$ yielding the solutions


    $$\mu_{1,2} = -\beta \pm \sqrt{\beta^2 - \omega_0^2} \tag{4.11}$$


    With the definition of


    $$\omega^2 = \omega_0^2 - \beta^2$$


    (4.11) can be rearranged to


    $$\mu_{1,2} = -\beta \pm i \omega.$$


    The solution of (4.9) is thus given by the linear combination


    $$y = a e^{\mu_1 t} + b e^{\mu_2 t} = a e^{-(\beta + i \omega)t} + b e^{-(\beta
    - i \omega)t} = a e^{-\beta t} e^{i \omega t} + b e^{-\beta t} e^{-i \omega t}
    = e^{-\beta t} (a e^{i \omega t} + b e^{-i \omega t}) \tag{4.12}$$


    As known from complex analysis[45]


    $$e^{i \omega t} = \cos(\omega t) + i \sin(\omega t) \quad \text{and} \quad e^{-i
    \omega t} = \cos(\omega t) - i \sin(\omega t).$$


    Applying this to (4.12) yields


    $$y = e^{-\beta t} \left( a (\cos(\omega t) + i \sin(\omega t)) + b (\cos(\omega
    t) - i \sin(\omega t)) \right) = e^{-\beta t} \left( (a + b) \cos(\omega t) +
    i (a - b) \sin(\omega t) \right) \tag{4.13}$$


    The $e^{-\beta t}$ term is the damping term of this oscillating system while $a
    + b$ and $a - b$ are determined by the initial conditions. If it is assumed that
    the mass has been deflected by an amount $y_0$ at $t = 0$, this will obviously
    be the maximum amplitude of its movement. If the mass is then just released at
    $t = 0$ without any initial velocity given to it, the following initial conditions
    hold:


    $$y(0) = y_0 \quad \text{and} \quad \dot{y}(0) = 0.$$


    ![](img/91599d88757ed8c75960eb83f4f85a12_85_0.png)


    Fig. 4.19. Mass-spring-damper system


    Using the two potentiometers labelled $-\dot{y}_0$ and $y_0$ the initial conditions
    of the mass-spring-damper system can be set. $y_0$ controls the initial deflection
    of the mass while $-\dot{y}_0$ sets its initial velocity at the start of a simulation
    run. Figures 4.20 to 4.23 show the qualitative results of four simulation runs
    with the mass set to 1 (i.e. omitting the potentiometer following the rightmost
    summer altogether) and different settings for the spring and damper constants
    $s$ and $d$. As can be clearly seen a stiffer spring requires a stronger damper
    in order to bring the oscillation down quickly. Furthermore, a stiffer spring
    results in a higher resonance frequency of the oscillating system.


    The setup shown in figure 4.19 has the advantage that all three parameters can
    be set independently from each other. This comes at a cost, though, as two summers,
    one acting as an inverter, are required. Taking into account that integrators
    typically feature multiple inputs and that integrators and summers both perform
    an implicit sign inversion, the simplified computer setup shown in figure 4.24
    saves one summer.


    This, however, has a drawback. The parameters $s$ and $d$ can no longer be set
    independently from $m$ as


    $$\nu = \frac{s}{m} \quad\text{and}\quad \mu = \frac{d}{m}.$$


    This does match nicely with (4.9) above.


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_0.png)


    Fig. 4.20. s = 0.2, d = .8


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_1.png)


    Fig. 4.21. s = 0.6, d = .8


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_2.png)


    Fig. 4.22. s = 0.8, d = .6


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_3.png)


    Fig. 4.23. s = 0.8, d = 1


    ### 4.5.3 RLC-circuit


    A physical system exhibiting similar behaviour to the mass-spring-damper system
    can be set up from a resistor R, a capacitor C and an inductance L, as shown in
    figure 4.25. This system, which can also be seen as an analogue for a mass-spring-damper
    system, will be used here as an example for scaling an analog computer program.


    This circuit is described by the differential equation


    $$L\ddot{Q} + R\dot{Q} + \frac{1}{C}Q = 0 \quad (4.14)$$


    with Q denoting the charge. This is structurally identical to (4.8), so everything
    derived so far can be applied to this RLC-circuit as well. Rearranging yields


    $$\ddot{Q} = -\frac{R}{L}\dot{Q} - \frac{1}{LC}Q.$$


    The following example is based on the computer setup shown above in figure 4.24
    with $-\dot{y} = 0$. The following component values will be assumed:


    - C = 1.2 µF

    - L = 5.1 mH

    - R = 20 Ω

    - E = 6.94 V


    ![](img/91599d88757ed8c75960eb83f4f85a12_87_0.png)


    Fig. 4.24. Simplified mass-spring-damper setup


    ![](img/91599d88757ed8c75960eb83f4f85a12_87_1.png)


    Fig. 4.25. Simple RLC-circuit


    with E representing the voltage delivered by the battery in the circuit. A fully
    charged capacitor at $t = 0$ yields the initial condition


    $$Q_0 = CE = 8.328 \cdot 10^{-6}\,\mathrm{As}$$


    which is also the maximum amplitude of the charge variable that can be exhibited
    by the oscillating system.


    This readily yields the following amplitude scaling factor


    $$\alpha = \frac{1}{8.328 \cdot 10^{-6}\,\mathrm{As}} \approx 120077\,(\mathrm{As})^{-1}$$


    Sacrificing some of the machine unit range of [−1, 1]


    $$\alpha = 0.1 \cdot 10^6\,(\mathrm{As})^{-1}$$


    will be chosen as this greatly simplifies the scaling process.


    Applying this to (4.14) yields the following scaled equation.[47]


    $$\widehat{Q}'''' = -3.92 \cdot 10^3 \widehat{Q}'' - 1.63 \cdot 10^8 \widehat{Q}$$


    The initial condition $Q_0$ must be scaled accordingly yielding (approximately)


    $$\widehat{Q}_0 = 0.833.$$


    With these scaled amplitudes the remaining step is time scaling. The (un-damped)
    angular frequency[48] of the basic RLC-circuit shown in figure 4.25 is


    $$\omega = \frac{1}{\sqrt{LC}} \approx 12783\ \text{s}^{-1}$$


    resulting in


    $$\nu \approx 2\ \text{kHz}$$


    since $\nu = \omega/2\pi$. A time-scaling factor of $\beta = 10^4$ is chosen which
    finally yields


    $$\frac{d^2 \widehat{Q}}{d\tau^2} = -0.392 \frac{d\widehat{Q}}{d\tau} - 1.63\widehat{Q}.$$


    The coefficients 0.392 and 1.63 can now be readily set as $\mu$ and $\nu$ in the
    computer setup shown in figure 4.24 with 1.63 represented by $\nu = 0.163$ feeding
    an integrator input weighted by 10.


    This example concludes the introductory section on analog computer programming.
    The following chapter presents a number of useful special-purpose circuits which
    also serve as additional programming examples.

    '
