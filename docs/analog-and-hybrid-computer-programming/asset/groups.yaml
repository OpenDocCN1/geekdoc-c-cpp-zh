    ![](img/91599d88757ed8c75960eb83f4f85a12_81_0.png)


    图 4.18. 简单的质量-弹簧-阻尼系统


    ments 但也消除使用前一节所述方法随时间累积可能出现的漂移问题。


    某些时变变量的幂可以很容易地使用两个具有适当时间比例因子的积分器串联生成，而完全不需要任何乘法器。在这种情况下，可以从 $\int\left(\int \varphi
    \,d\tau\right) d\tau = \frac{1}{6}\varphi^3$ 开始，从而得到 (4.7) 的第二项。改变该解的符号并加上 $\varphi$
    即可得到所需的正弦近似，这种方法将在第 5.3 节中详细说明。


    ## 4.5 质量-弹簧-阻尼系统


    除第 4.2 节所示的振幅稳定方案外，到目前为止所展示的问题都表现出无阻尼的振荡行为。下一个示例使用图 4.18 所示的简单质量-弹簧-阻尼系统引入阻尼。在本例中，$y$
    表示质量相对于其静止位置的垂直位置。忽略作用在质量上的任何重力加速度，需要考虑三个力：


    - 由于运动质量产生的力，$F_m = ma = m\ddot{y}$。

    - 由弹簧引起的力，假设其与施加在弹簧上的应变呈线性关系，$F_s = s y$，以及

    - 由速度线性阻尼器引起的力，$F_d = d v = d \dot{y}$。


    由于这是一个封闭的物理系统，所有力之和为零，从而得到以下二阶微分方程，该方程描述了该质量-弹簧-阻尼系统的动态行为：


    $$m\ddot{y} + d\dot{y} + s y = 0 \tag{4.8}$$


    这里，$m$ 表示质量，$d$ 是阻尼常数，$s$ 是弹簧常数。如果没有阻尼力 $F_d$，这只是一个无阻尼谐振子，如前例所示。


    ### 4.5.1 解析解


    该机械系统仍然足够简单，可以解析求解，这很有用，因为该解以后可以与通过模拟计算机获得的解进行比较。将 (4.8) 除以 $m$ 得到


    $$\ddot{y} + \frac{d}{m}\dot{y} + \frac{s}{m} y = 0. \tag{4.9}$$


    采用以下阻尼系数的定义


    $$\beta := \frac{d}{2m}$$


    以及（无阻尼）角固有频率[44]


    $$\omega_0 = \sqrt{\frac{s}{m}}$$


    这可以改写为


    $$\ddot{y} + 2\beta\dot{y} + \omega_0^2 y = 0. \tag{4.10}$$


    处理此类微分方程的经典方法是使用指数函数。


    “猜测”


    $$y = a e^{\mu t}$$


    得到


    $$\dot{y} = \mu a e^{\mu t} \quad \text{and} \quad \ddot{y} = \mu^2 a e^{\mu t}.$$


    将这些代入 (4.10) 得到


    $$\mu^2 a e^{\mu t} + 2\beta\mu a e^{\mu t} + \omega_0^2 a e^{\mu t} = 0.$$


    除以 $a e^{\mu t}$ 得到以下二次方程


    $$\mu^2 + 2\beta\mu + \omega_0^2 = 0$$


    该方程可通过应用二次公式轻松求解


    $$\mu_{1,2} = -\frac{p}{2} \pm \sqrt{\frac{p^2}{4} - q}$$


    其中 $p = 2\beta$ 且 $q = \omega_0^2$，解为


    $$\mu_{1,2} = -\beta \pm \sqrt{\beta^2 - \omega_0^2} \tag{4.11}$$


    采用定义


    $$\omega^2 = \omega_0^2 - \beta^2$$


    (4.11) 可整理为


    $$\mu_{1,2} = -\beta \pm i \omega.$$


    因此 (4.9) 的解由线性组合给出


    $$y = a e^{\mu_1 t} + b e^{\mu_2 t} = a e^{-(\beta + i \omega)t} + b e^{-(\beta
    - i \omega)t} = a e^{-\beta t} e^{i \omega t} + b e^{-\beta t} e^{-i \omega t}
    = e^{-\beta t} (a e^{i \omega t} + b e^{-i \omega t}) \tag{4.12}$$


    如复分析[45]所知


    $$e^{i \omega t} = \cos(\omega t) + i \sin(\omega t) \quad \text{and} \quad e^{-i
    \omega t} = \cos(\omega t) - i \sin(\omega t).$$


    将其应用于 (4.12) 得到


    $$y = e^{-\beta t} \left( a (\cos(\omega t) + i \sin(\omega t)) + b (\cos(\omega
    t) - i \sin(\omega t)) \right) = e^{-\beta t} \left( (a + b) \cos(\omega t) +
    i (a - b) \sin(\omega t) \right) \tag{4.13}$$


    $e^{-\beta t}$ 项是该振荡系统的阻尼项，而 $a + b$ 和 $a - b$ 由初始条件决定。如果假设质量在 $t = 0$ 时被偏离了 $y_0$
    的量，这显然是其运动的最大振幅。如果质量随后在 $t = 0$ 时被释放且未赋予任何初始速度，则以下初始条件成立：


    $$y(0) = y_0 \quad \text{and} \quad \dot{y}(0) = 0.$$


    ![](img/91599d88757ed8c75960eb83f4f85a12_85_0.png)


    图 4.19. 质量-弹簧-阻尼系统


    使用标有 $-\dot{y}_0$ 和 $y_0$ 的两个电位器可以设置质量-弹簧-阻尼系统的初始条件。$y_0$ 控制质量的初始偏转，而 $-\dot{y}_0$
    在模拟运行开始时设置其初始速度。图 4.20 至 4.23 显示了四次模拟运行的定性结果，其中质量设为 1（即完全省略最右侧求和器的后继电位器），并且弹簧和阻尼常数
    $s$ 和 $d$ 的设置不同。显然，更硬的弹簧需要更强的阻尼器才能迅速降低振荡。此外，更硬的弹簧会导致振荡系统的共振频率更高。


    图 4.19 所示的设置具有所有三个参数可以相互独立设置的优点。然而，这需要付出代价，因为需要两个求和器，其中一个作为反相器。考虑到积分器通常具有多个输入，并且积分器和求和器都执行隐式的符号反转，图
    4.24 所示的简化计算机设置节省了一个求和器。


    然而，这也有一个缺点。参数 $s$ 和 $d$ 不再能独立于 $m$ 设置，因为


    $$\nu = \frac{s}{m} \quad\text{and}\quad \mu = \frac{d}{m}.$$


    这与上面的 (4.9) 非常吻合。


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_0.png)


    图 4.20. s = 0.2, d = .8


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_1.png)


    图 4.21. s = 0.6, d = .8


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_2.png)


    图 4.22. s = 0.8, d = .6


    ![](img/91599d88757ed8c75960eb83f4f85a12_86_3.png)


    图 4.23. s = 0.8, d = 1


    ### 4.5.3 RLC 电路


    可以由电阻 R、电容器 C 和电感 L 组成一个表现出与质量-弹簧-阻尼系统相似行为的物理系统，如图 4.25 所示。该系统也可以被视为质量-弹簧-阻尼系统的类比，在这里将作为模拟计算机程序缩放的示例。


    该电路由微分方程描述


    $$L\ddot{Q} + R\dot{Q} + \frac{1}{C}Q = 0 \quad (4.14)$$


    其中 Q 表示电荷。这在结构上与 (4.8) 相同，因此迄今为止推导出的所有内容同样适用于此 RLC 电路。整理后得到


    $$\ddot{Q} = -\frac{R}{L}\dot{Q} - \frac{1}{LC}Q.$$


    以下示例基于图 4.24 所示的计算机设置，其中 $-\dot{y} = 0$。将假设以下元件值：


    - C = 1.2 µF

    - L = 5.1 mH

    - R = 20 Ω

    - E = 6.94 V


    ![](img/91599d88757ed8c75960eb83f4f85a12_87_0.png)


    图 4.24. 简化的质量-弹簧-阻尼设置


    ![](img/91599d88757ed8c75960eb83f4f85a12_87_1.png)


    图 4.25. 简单的 RLC 电路


    其中 E 表示电路中电池提供的电压。在 $t = 0$ 时完全充电的电容器产生初始条件


    $$Q_0 = CE = 8.328 \cdot 10^{-6}\,\mathrm{As}$$


    这也是振荡系统所能表现的电荷变量的最大振幅。


    这很容易得出以下振幅缩放因子


    $$\alpha = \frac{1}{8.328 \cdot 10^{-6}\,\mathrm{As}} \approx 120077\,(\mathrm{As})^{-1}$$


    牺牲机器单位范围 [−1, 1] 的一部分


    $$\alpha = 0.1 \cdot 10^6\,(\mathrm{As})^{-1}$$


    将选择 $\alpha = 0.1 \cdot 10^6\,(\mathrm{As})^{-1}$，因为这大大简化了缩放过程。


    将其应用于 (4.14) 得到以下缩放方程。[47]


    $$\widehat{Q}'''' = -3.92 \cdot 10^3 \widehat{Q}'' - 1.63 \cdot 10^8 \widehat{Q}$$


    初始条件 $Q_0$ 必须相应缩放，得到（近似）


    $$\widehat{Q}_0 = 0.833.$$


    在这些缩放振幅下，剩余步骤是时间缩放。图 4.25 所示基本 RLC 电路的（无阻尼）角频率[48]为


    $$\omega = \frac{1}{\sqrt{LC}} \approx 12783\ \text{s}^{-1}$$


    得到


    $$\nu \approx 2\ \text{kHz}$$


    因为 $\nu = \omega/2\pi$。选择时间缩放因子 $\beta = 10^4$，最终得到


    $$\frac{d^2 \widehat{Q}}{d\tau^2} = -0.392 \frac{d\widehat{Q}}{d\tau} - 1.63\widehat{Q}.$$


    系数 0.392 和 1.63 现在可以很容易地在图 4.24 所示的计算机设置中设置为 $\mu$ 和 $\nu$，其中 1.63 由 $\nu = 0.163$
    表示，并馈入加权为 10 的积分器输入。


    本例结束了模拟计算机编程的介绍部分。下一章介绍了许多有用的专用电路，它们也作为额外的编程示例。

    '
