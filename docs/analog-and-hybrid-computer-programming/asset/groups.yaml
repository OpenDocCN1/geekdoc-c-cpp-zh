    \nFig. 6.99. Long-term exposure of a double pendulum simulation run\n\n## CHAPTER\
    \ 7\n\n## Hybrid computing\n\nAlthough analog computers are extremely powerful\
    \ on their own, the combination of an analog computer and a digital computer forming\
    \ a *hybrid computer* is even more powerful.\n\nThis idea is by no means new –\
    \ as early as 1956 *Space Technology Laboratories* developed the *ADDAVERTER*,\
    \ a system capable of coupling an analog computer with a digital computer by means\
    \ of 15 ADCs and 10 DACs¹²⁶ each featuring a precision of ±0.1 %. The rationale\
    \ behind such a setup is that digital computers are good in areas where analog\
    \ computers have deficiencies and vice versa. Applications for their combination\
    \ are abundant due to their computational power and energy efficiency.\n\nA hybrid\
    \ computer typically operates in one of two basic modes:\n\n- **Alternating operation:**\
    \ In this mode of operation the digital computer typically controls the parameters\
    \ of an analog computer setup. The analog computer performs an operation run based\
    \ on such a parameter set returning the results of its computation to the digital\
    \ computer by means of ADCs. Based on these results the digital computer can then\
    \ derive a new set of parameters and so forth. Since the operation of the digital\
    \ and analog computers do not overlap, this mode is not time critical with respect\
    \ to communication latencies, ADC conversion times, etc. Alternating operation\
    \ is typically employed for the solution of optimization problems, multidimensional\
    \ parameter searches, the solution of partial differential equations, stochastic\
    \ analyses, and related problems.\n\n- **Parallel operation:** This mode of operation\
    \ requires real time operation by the digital computer as it operates in parallel\
    \ with the analog computer and has to read and supply values with as little latency\
    \ as possible. In a setup like this, the digital computer can not only change\
    \ coefficients at run-time but also generate functions, act as a delay circuit,\
    \ make decisions based on the values of analog variables, and much more.\n\n###\
    \ 7.1 Hybrid controllers\n\nThe following examples and explanations are based\
    \ on the Analog Paradigm hybrid controller but the ideas and techniques presented\
    \ are by no means restricted to this particular device. Similar and coupling devices\
    \ have been available in the past and can be built using cheap off-the-shelf hardware\
    \ such as Arduino®-boards etc. A hybrid controller like this might be connected\
    \ via USB to the digital computer and will typically provide the following functions:\n\
    \n- **Control lines:** The hybrid controller must be able to control the mode\
    \ of operation of the analog computer’s integrators. In the simplest case it will\
    \ accept commands like ic, op, or halt from the digital computer and set the ModeIC\
    \ and ModeOP control lines accordingly.\n\n  Depending on its connection to the\
    \ digital computer there might be considerable delays in the exchange of signals\
    \ due to communication latencies. This can be problematic in applications where\
    \ precise timing of IC- and OP-times is required. It is therefore recommended\
    \ that the hybrid controller itself should feature a clock with at least a 1 μs\
    \ resolution with all timing issues being performed locally by the hybrid controller\
    \ – without the need to communicate with the attached digital computer.\n\n  The\
    \ hybrid controller should also be able to sense overload conditions, to control\
    \ the POTSET line, and it should feature an input line for an external halt signal.\n\
    \n- **Digital potentiometers:** This type of potentiometer, similar to a *multiplying\
    \ DAC*, typically offers 10 bit resolution, allowing parameters to be set with\
    \ a resolution of about 0.1%. If the input of such a potentiometer is connected\
    \ to +1 or −1, it can even be used as a simple and cheap DAC allowing the digital\
    \ computer not only to control parameters but also to feed time-varying values\
    \ to the analog computer.\n\n- **Digital inputs:** Many applications, such as\
    \ parameter optimization, include some conditions which have to be sensed by the\
    \ digital computer in order to abort a computer run or to change some parameters.\
    \ This is typically achieved by means of comparators yielding a digital output\
    \ signal which can be read by the digital computer using a digital input channel\
    \ of the hybrid controller.\n\n- **Digital outputs:** Using digital output lines\
    \ of the hybrid controller, electronic switches, such as those used in the CMP4\
    \ module, can be controlled by the attached digital computer. A typical application\
    \ for this is to apply step functions to a simulated system.\n\n- **Readout:**\
    \ One of the most important functions a hybrid controller must implement is a\
    \ readout capability including provisions for data logging. Ideally, the analog\
    \ computer features a central readout system which allows every computing element\
    \ to be addressed unambiguously. In this situation, the hybrid controller takes\
    \ over control of the address lines of this system while the analog readout line\
    \ is connected to the hybrid controller’s ADC. The time required for a single\
    \ readout operation is highly critical and includes the time to address and select\
    \ the computing element, the time required by the ADC for one conversion, and\
    \ the time for transmitting the digital value to the digital computer. If many\
    \ elements have to be read during a computation over and over again, it can be\
    \ necessary to place the analog computer in HALT-mode before starting readout\
    \ operations and to reactivate OP-mode afterwards in order to avoid excessive\
    \ skew between the individual data values being read. This becomes more and more\
    \ important with increasing k₀ values (time scaling) of the integrators in a given\
    \ setup.\n\nFigure 7.1 shows the front panel of the Analog Paradigm hybrid controller\
    \ (HC). The group of 16 2 mm jacks in the upper half is connected to eight digital\
    \ potentiometers each with a resolution of 10 bits. The second group of 16 jacks\
    \ in the lower half connects to eight digital input lines and eight digital output\
    \ lines. On the left is the USB port while an additional HALT-input and a trigger\
    \ output are provided on the lower right. The module controls all address, data,\
    \ and con-\n"
