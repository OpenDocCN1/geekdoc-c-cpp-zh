    # Summer basics:


    The behaviour of an (ideal) summer is described by $e_o = - \sum_{i=1}^{n} a_i
    e_i$ with the weights $a_i$ being typically 1 or 10. It yields the negative sum
    of the weighted voltages applied to its inputs. Typical summers have about six
    inputs, three of which have input weight 1 while the remaining three inputs are
    weighted by 10.


    In some cases it is necessary to disconnect the resistive feedback loop of a summer
    in order to introduce an external feedback circuit. This case is represented by
