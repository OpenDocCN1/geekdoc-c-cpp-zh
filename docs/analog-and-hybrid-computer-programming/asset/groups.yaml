    Since the input current $i_i$ of a typical operational amplifier is less than
    a few nA at most, it can be neglected, so that (2.2) simplifies to


    $$\frac{e_i-e_{SJ}}{R_i}=-\frac{e_o-e_{SJ}}{R_f}.$$


    Substituting (2.1) into this yields


    $$\frac{e_i+\frac{e_o}{\mathcal{A}}}{R_i}=-\frac{e_o+\frac{e_o}{\mathcal{A}}}{R_f}.$$


    Some rearranging results in


    $$e_o\left(\frac{1}{\mathcal{A}R_i}+\frac{1}{R_f}+\frac{1}{\mathcal{A}R_f}\right)=-\frac{e_i}{R_i}$$


    which can then be solved for $e_o$:


    $$e_o=\frac{-\frac{e_i}{R_i}}{\frac{R_f+\mathcal{A}R_i+R_i}{\mathcal{A}R_iR_f}}$$


    $$=\frac{-\frac{e_i}{R_i}\mathcal{A}R_iR_f}{R_f+\mathcal{A}R_i+R_i}$$


    $$=\frac{-\frac{R_f}{R_i}e_i}{1+\frac{1}{\mathcal{A}}\left(\frac{R_f}{R_i}+1\right)}.\tag{2.3}$$


    Since $\mathcal{A}$ is typically very large$^{15}$ and $R_f/R_i$ is typically
    $\leq 10$, the denominator of (2.3) can normally be neglected, yielding the simplified
    form


    $$e_o=-\frac{R_f}{R_i}e_i.\tag{2.4}$$


    describing the output voltage of the feedback circuit shown in figure 2.3.$^{16}$


    $^{15}$ In fact, classical high-precision operational amplifiers used in analog
    computers had gains of up to $\mathcal{A}=10^9$.


    $^{16}$ A more informal approach to the behaviour of such circuits is to assume
    that the open-loop gain of the operational amplifier is extremely large, therefore,
    the voltage at the summing junction is approximately zero. Since the input current
    of the amplifier is negligible, applying Kirchhoff''s law to the currents at the
    summing junction shows that the current through the feedback element is minus
    the sum of the currents through the input resistors. Applying Ohm''s law then
    readily yields the output voltage of the computing element.'
