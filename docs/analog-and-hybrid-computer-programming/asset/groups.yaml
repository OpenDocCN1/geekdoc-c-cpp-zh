    要运行此程序，模拟计算机设置为重复操作，操作时间为 \(t_{\mathrm{OP}} = 30\ \mathrm{ms}\)。三角波发生器的积分器必须通过将其
    Mode C 输入连接到 \(+1\) 来与中央定时控制断开（只有 INT4 模块的第三或第四个积分器可用于此目的），以便在两次连续计算运行之间不会被复位。


