    ![](img/91599d88757ed8c75960eb83f4f85a12_19_0.png)


    图 1.4. 用于积分的简单微分分析仪设置（参见 [KARPLUS et al. 1958, p. 190]. [SOROKA 1962, p. 8-10]）


    该装置的核心是图底部所示的积分器。基本上，它由中央电机驱动的旋转平板盘和在盘表面滚动的摩擦轮组成。该轮在盘上的径向位置现在由输入台上十字线的垂直分量控制。在旋转盘具有一定的角速度时，摩擦轮的角速度取决于其径向位置。如果它位于盘轴正上方，则完全不会旋转，而如果它位于盘边缘，则其角速度将达到最大值。因此，该装置有效地执行了基本形式为
    $\int_{0}^{T} f(\tau) d\tau$ 的积分运算


    其中 $\tau$ 表示 *machine time*（稍后会详细介绍）——在本例中为水平盘的旋转——而 $f(\tau)$ 控制摩擦轮的径向位置。积分器在时间区间
    $[0, T]$ 内运行。图 1.5 显示了在 *Oslo differential analyzer.* 中使用的积分器的实际实现。


    ![](img/91599d88757ed8c75960eb83f4f85a12_20_0.png)


    图 1.5. 来自奥斯陆微分分析仪的积分器（参见 [WILLERS 1943, p. 237]）


    摩擦轮的输出随后在该装置中用于控制输出台的⁷（图片右上方）笔的垂直位置，而其水平位置由中央电机控制。所得图形是输入函数积分的图像。


    像这样机械微分分析仪仅使用了很短一段时间，因为其缺点难以克服。其设置繁琐耗时，许多机械部件需要大量维护工作，且由于旋转和移动部件不可忽略的质量，其计算速度有限。


    曾有一些尝试构建机电微分分析仪，其中基本计算元件仍然是纯机械的，而其互连则通过伺服电机和同步电机实现。⁸ 同步电机的输出可以通过中央电配线场连接到伺服电机的输入，从而至少简化了此类计算机的基本设置。


    在第二次世界大战期间，机械和机电模拟计算机以火控系统的形式被大量使用。作为非常专业的模拟计算机，这些机器对该领域进一步的发展没有直接影响。


    在大西洋彼岸，PHILBRICK 的电子模拟计算机名为 *Polyphemus*，因其奇特的外观——机架顶部位置安装了单个示波器——而得名，完全不是面向军事应用的。他的机器被设计并用于解决化学工业过程控制中通常出现的问题。


    在 MIT 开发的 MACNEE 的机器是一台纯粹的学术研究仪器，很可能是第一台能够进行 *repetitive operation* 的高速电子模拟计算机，在这种操作中，问题以如此高的速度反复求解，以至于解的（几乎）无闪烁图像可以在示波器屏幕上显示。


    从今天的角度来看，这些早期的模拟计算机看起来相当熟悉。除了使用真空管的特定实现外，它们已经具备了所有典型的模拟计算元件，如求和器、积分器、乘法器、函数发生器等。此外，它们采用的编程技术与今天仍在使用的方法相同。有关模拟计算历史的更多信息可在
    [ULMANN 2013]⁹ 和 [SMALL 2001] 中找到。


    ## 1.4 模拟计算机的特性


    尽管通过无数互连电线搭建间接模拟计算机进行计算乍一看像是缺点，但这种编程方法很可能会很快被精细且高度集成的交叉开关所取代，这些开关由随附的数字计算机控制。但即使使用传统的配线面板互连各种计算元件，而不是将算法存储在某种存储器中，也具有巨大的优势。


    首先，模拟计算机完全不需要内存查找操作，从而大大加快了整体计算速度。此外，由于没有内存，就不存在类似 *critical section* 的概念，无需同步事物，无通信开销，也没有困扰传统并行数字计算机的诸多琐事。在模拟计算领域不存在
    *AMDAHL''s law*¹⁰ 的等价物。所有计算元件都以完美的并行方式工作。


    模拟计算机的另一个基本优势是其极低的功耗，这很容易超过经典数字计算机。这使得模拟计算对于低功耗至关重要的应用具有吸引力，例如医疗应用、由能量收集供电的嵌入式设备等。此外，模拟计算机非常适合高性能计算（HPC），在那里电力充足且需要纯粹的计算能力。


    最后，模拟计算机不易出现诸如稳定性差等问题，而经典数字计算机在浮点数上运行的数值算法有时会出现此类问题。即使是 *stiff* 微分方程通常也能由模拟计算机轻松求解，而许多数值方法对于此类问题至少需要过长的运行时间。


    模拟计算机的这些特性导致了人们对这种特定计算模型的兴趣最近显著增加。在不久的将来，模拟计算机最常见的形式将作为混合计算机系统的一部分，即与数字计算机紧密耦合，从而使其免于涉及微分方程等的计算。


    ![](img/91599d88757ed8c75960eb83f4f85a12_26_0.png)


    图 2.1. 具有三个输入 e3、e2、e1 和求和节点输入 s1 的求和器的抽象符号


    ![](img/91599d88757ed8c75960eb83f4f85a12_26_1.png)


    图 2.2. 运算放大器的图形符号


    要理解求和器的行为，有必要对其实现进行考察。与大多数其他模拟计算机元件一样，它基于运算放大器，简称为 opamp，其图形符号如图 2.2 所示。运算放大器有两个输入，一个反相输入和一个同相输入，在图中分别用
    − 和 + 表示。它输出施加到这些输入的值之和，并由其大（理想情况下无限）的开环增益 A 放大，该增益是特定运算放大器的特征。通常可以实现 10^5 到 10^9
    的增益。12 这种放大器在模拟计算机中的使用催生了运算放大器这一名称，因为它们构成了实现某些数学运算的计算元件的基础。


    在典型的模拟计算机电路中，运算放大器的同相输入被接地，即连接到模拟地线，通常用 GND 表示，其电位代表零值；这有效地禁用了该输入。13


