    # 4.4 Mathematical pendulum


    This section describes the simulation of the movement of the tip of a mathematical
    pendulum as shown in figure 4.16. It consists of a weightless rod which is pivoted
    at point 0 around which it can swing without friction. Mounted at the other end
    of the rod is a punctiform mass m. The angle α₀ denotes the maximum displacement
    of the pendulum, i. e. its initial condition, while α represents the current angle
    with respect to the vertical running through the pivot located at 0.


    The mass is subjected to the force F_g = mg which is caused by the acceleration
    due to gravity. This can be resolved into two forces acting tangentially (F_t)
    and radially (F_r) on the mass:


    F_t = -mg sin(α)

    F_r = mg cos(α)


    F_t is the restoring force which will drive the mass back to its position of rest.
    It causes a tangential acceleration


    a_t = F_t / m = l α̈'
