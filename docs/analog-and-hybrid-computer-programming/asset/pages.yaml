- pgno: 214
  md: '# 7.4 Data gathering


    Using a hybrid controller it is also possible to gather data either during HALT
    periods in a lengthy computer run or continuously during an OP period as shown
    in the following example.¹³⁹ The goal is to solve the one-dimensional wave equation


    $\frac{1}{c}\ddot{u} - \frac{\partial^2 u}{\partial x^2}=0.$


    As before, the derivatives with respect to $x$ are approximated by a difference
    quotient yielding


    $\frac{1}{c}\ddot{u} - \frac{u_{i-1}-2u_i+u_{i+1}}{(\Delta x)^2}=0$


    with $\Delta x = \frac{x}{n}$ and $n \in \mathbb{N}$. Defining


    $\lambda := -\frac{c}{(\Delta x)^2}=\frac{c n^2}{x^2}$


    results in a form suitable to derive an analog computer setup:


    $\ddot{u}_i = \lambda \frac{u_{i-1}-2u_i+u_{i+1}}{(\Delta x)^2}$


    To simplify things further it is assumed that $n=4$ and $\lambda=1$ finally yielding
    the following set of coupled ordinary differential equations:


    +   - $\ddot{u}_0 = \delta(t)$

    +   - $\ddot{u}_1 = u_0 -2u_1 + u_2$

    +   - $\ddot{u}_2 = u_1 -2u_2 + u_3$

    +   - $\ddot{u}_3 = u_2 -2u_3 + u_4$

    +   - $\ddot{u}_4 = u_3 -2u_4 + u_5$

    +   - $u_5 = 0$


    $\delta(t)$ represents an impulse occurring at the start of a simulation run,
    i.e. at $t=0$. Figure 7.3 shows the resulting computer setup consisting of four
    basically identical cells, each containing two integrators, an inverting summer
    and a coefficient potentiometer. Using the hybrid controller as a data logger
    it is now possible to gather the variables $u_1,\dots,u_4$ during a simulation
    run.¹⁴⁰'
  merge: -1
  img_proc: true
- pgno: 215
  md: "![](img/91599d88757ed8c75960eb83f4f85a12_215_0.png)\n\n# Fig. 7.3. Computer\
