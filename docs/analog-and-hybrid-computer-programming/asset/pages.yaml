    # 6.8 Rutherford-scattering


    In the early 20th century ERNEST RUTHERFORD performed a seminal experiment in
    which he bombarded a thin gold foil with α-particles.⁸⁹ He observed that the vast
    majority of these particles just went through the gold foil without being deflected
    or absorbed. Nevertheless, some of these particles were deflected through large
    angles with even fewer α-particles being reflected by the gold foil, a phenomenon
    called RUTHERFORD-scattering. This led to the planetary RUTHERFORD model of the
    atom, which then became the basis of the BOHR model.


    The following analog computer simulation was motivated by [BORCHARDT]. It is assumed
    that the gold atom''s nucleus is at a fixed position – specifically the point
    of origin of the underlying coordinate system to simplify the distance calculation
    for the α-particle. With the α-particle''s position being (x, y) its distance
    to the gold nucleus is then


    $r^2 = x^2 + y^2.$


    89 These are Helium nuclei and thus rather large.'
