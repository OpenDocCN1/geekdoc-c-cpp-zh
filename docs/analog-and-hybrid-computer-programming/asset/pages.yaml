- pgno: 216
  md: 'The problem-section has been added. It contains the various timing settings,
    the definition of a readout group (ro-group) and other optional subsections which
    are not required here. The readout group defines a list of computing elements
    which will be read during the OP phase of the simulation at equally-spaced intervals.
    In this case the readout group consists of the elements labelled U1, U2, U3, and
    U4.


    The corresponding Perl program using this configuration file is shown below:


    ```

    ```perl

    use strict;

    use strict;

    use warnings;

    use IO::HyCon;


    my $ac = IO::HyCon->new();  # Create a new hybrid controller object.

    $ac->setup();               # Setup the analog computer

    $ac->single_run_sync();     # Start a single run.

    $ac->get_data();            # Get the data gathered

    $ac->plot();                # and generate a plot.

    ```

    ```


    The method call $ac->setup() performs all basic setup operations such as setting
    initial and operating times as well as defining the readout group if one is specified
    in the configuration file. If such a group is defined, data will be gathered automatically
    by the hybrid controller during each analog computer run. The data gathered is
    stored in the $ac object and can be extracted by calling the method $ac->get_data()
    which returns an array reference. Another useful method is $ac->plot() which can
    be parameterized to yield different plotting styles and requires that gnuplot
    is installed on the digital computer.


    Just calling $ac->plot() as in the example above yields the result shown in figure
    7.4. The four lines in the graph represent the four variables u1,...,u4. Each
    variable represents one location along the x-axis of the one-dimensional wave
    equation problem.


    In problems like this it would be nicer to have a more 3d-ish display of the variables
    being recorded. The plot() method supports such a display style, too. Calling
    $ac->plot(type => ''3d'') yields the plot shown in figure 7.5 which is much more
    intuitive than the overlaid 2d plots shown previously.'
  merge: -1
