  md: '![](img/91599d88757ed8c75960eb83f4f85a12_31_0.png)


    Fig. 2.7. Analog Paradigm SUM8 module


    # 2.3 Integrators


    At first sight it is astonishing that an analog computer features integration
    as one of its basic operations. This makes it the ideal machine to solve problems
    that can be described by differential equations and systems thereof. But there
    is a catch: Integration on an analog-electronic analog computer is always with
    respect to time, so all integrations are basically of the form


    $$e_o=-\left(\int_0^t\sum_{i=1}^{n}a_i e_i\,d\tau+e(0)\right) \tag{2.7}$$


    with some constant $e(0)$ called the *initial condition*. In particular, this
    means that *partial differential equations*, i. e. differential equations in which
    derivatives with respect to more than one variable occur, cannot be handled directly
    on an analog computer without explicit discretization or other techniques!


    Obviously, the output of an integrator depends on the history of its input values,
    so this computing element is a kind of memory. In contrast to a simple summer,
    this necessitates some control of its operation as an integration has'
