  md: '![](img/91599d88757ed8c75960eb83f4f85a12_168_0.png)


    Fig. 6.58. The x, z phase space plot of the AIZAWA attractor


    Scaling these equations to ensure that no variable exceeds the machine units of
    ±1 is straight-forward: The scaling factors corresponding to x, y, and z are λₓ
    = 1/3, λᵧ = 1/4, and λ_z = 1/2. The value z − β is scaled by 2/5. The resulting
    computer setup is rather convoluted as shown in figure 6.57. In total three integrators,
    four summers, seven multipliers, and eleven coefficient potentiometers are required
    for this program. Figure 6.58 shows the x, z phase space plot of the AIZAWA attractor
    – an exceptionally beautiful structure. To achieve this two of the parameters
    resulting from the scaling, marked by * and ** in figure 6.57, were varied slightly
    to achieve a “nicer” picture. The values for these obtained by scaling are 0.95
    and 0.27 respectively.


    # 6.18 Nosé-Hoover oscillator


    Another beautiful chaotic system is the Nosé-Hoover oscillator, which is described
    in [SPROTT 2010, pp. 95 ff.]. This system is described by the following set of
    coupled differential equations:


    ```

    \dot{x} = y

    \dot{y} = y z - x

    \dot{z} = 1 - y^2

    ```'
