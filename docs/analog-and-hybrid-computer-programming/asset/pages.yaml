  md: '# CHAPTER 3


    # Analog computer operation


    Although, at first sight, using an analog computer to solve a problem may appear
    to be a daunting prospect, in practice it is a relatively straightforward process.
    Figures 3.1 and 3.2 show two classic analog computers – an EAI-580 and a Telefunken
    RA770 precision analog computer.


    The most obvious feature of both machines is the large, central patch panel, which
    contains several thousand jack sockets; these are typically shielded on high precision
    analog computers. Whilst most manufacturers developed their own cable and connector
    system, small table-top analog computer use standard 4 mm or 2 mm banana plugs
    for interconnecting their computing elements. The analog computer program is set
    up by linking the jacks on the patch panel with the patch leads creating a *circuit*
    which is an analogue for the problem being investigated.


    Figure 3.3 shows a patch panel being removed from such a classic machine. Programs
    were typically pre-patches and the patch panels stored in a cabinet when not in
    use. As archaic as this seems from today’s perspective, it is a viable means of
    storing and “loading” analog programs.


    A more detailed look at the EAI-580 in figure 3.1 shows that its left half is
    divided into four subunits. At the bottom is the main control panel allowing the
    operator to select the desired mode of operation (IC, OP, HLT, repetitive operation).
    It also contains the push-button controls for setting up the servopotentiometers
    which were normally fitted in medium to large analog computers. These replaced
    most of the manual precision potentiometers and consist of a potentiometer mechanically
    coupled to a small motor that is in turn controlled by a simple servo-loop. Using
    such an arrangement it is possible to setup these potentiometers by selecting
    a potentiometer address and entering the desired value'
