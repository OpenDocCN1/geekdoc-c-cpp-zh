- pgno: 148
  md: '[MOULTON 1923, pp. 277 ff.] for an analytical treatment of this problem and
    some background information. However, using an analog computer, it is straightforward
    to investigate the three-body problem.


    In this section a simple universe consisting of two suns with fixed positions
    $\vec{r}_1 = (x_1, y_1)$ and $\vec{r}_2 = (x_2, y_2)$, masses $m_1 = m_2 = 1$,
    and a satellite of negligible mass criss-crossing between these two celestial
    bodies will be simulated. This system can be readily described by the following
    set of coupled differential equations:


    $m_1 \ddot{\vec{r}}_1 = G m_1 m_2 \frac{\vec{r}_2 - \vec{r}_1}{|\vec{r}_2^2 -
    \vec{r}_1^2|^3} + G m_1 m_3 \frac{\vec{r}_3 - \vec{r}_1}{|\vec{r}_3^2 - \vec{r}_1^2|^3}$


    $m_2 \ddot{\vec{r}}_2 = G m_2 m_3 \frac{\vec{r}_3 - \vec{r}_2}{|\vec{r}_3^2 -
    \vec{r}_2^2|^3} + G m_2 m_1 \frac{\vec{r}_1 - \vec{r}_2}{|\vec{r}_1^2 - \vec{r}_2^2|^3}$


    $m_3 \ddot{\vec{r}}_3 = G m_3 m_1 \frac{\vec{r}_1 - \vec{r}_3}{|\vec{r}_1^2 -
    \vec{r}_3^2|^3} + G m_3 m_2 \frac{\vec{r}_2 - \vec{r}_3}{|\vec{r}_2^2 - \vec{r}_3^2|^3}
    \quad (6.27)$


    The vectors $\vec{r}_i$, $1 \le i \le 3$ describe the positions of the different
    bodies with masses $m_i$ while $G$ is the gravitational constant.


    Assuming that the two suns are stationary, only equation (6.27) has to be implemented
    on the analog computer. Since the suns'' masses are equal to 1 the satellite''s
    mass cancels out, yielding


    $\ddot{\vec{r}}_3 = G \frac{\vec{r}_1 - \vec{r}_3}{|\vec{r}_1^2 - \vec{r}_3^2|^3}
    + G \frac{\vec{r}_2 - \vec{r}_3}{|\vec{r}_2^2 - \vec{r}_3^2|^3}. \quad (6.28)$


    Introducing two distance terms


    $\Delta r_{13}^3 = \left(\sqrt{(x_1 - x_3)^2 + y_3^2}\right)^3 \quad \text{and}
    \quad (6.29)$


    $\Delta r_{23}^3 = \left(\sqrt{(x_2 - x_3)^2 + y_3^2}\right)^3 \quad (6.30)$


    and splitting (6.28) into its $x$- and $y$-components yields the following two
    equations which describe the satellite''s trajectory in Cartesian coordinates:


    $\ddot{x}_3 = (x_1 - x_3) \frac{G}{\Delta r_{13}^3} + (x_2 - x_3) \frac{G}{\Delta
    r_{23}^3} \quad \text{and} \quad (6.31)$


    $\ddot{y}_3 = -y_3 \left( \frac{G}{\Delta r_{13}^3} + \frac{G}{\Delta r_{23}^3}
    \right). \quad (6.32)$


    These equations can now easily be implemented on an analog computer. Figure 6.30
    shows the partial computer setup yielding the distance terms (6.29) and (6.30).'
