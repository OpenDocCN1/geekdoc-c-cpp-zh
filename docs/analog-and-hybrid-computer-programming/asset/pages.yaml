  md: '![](img/91599d88757ed8c75960eb83f4f85a12_19_0.png)


    Fig. 1.4. A simple differential analyzer setup for integration (cf. [KARPLUS et
    al. 1958, p. 190]. [SOROKA 1962, p. 8-10])


    At the heart of this setup is an integrator shown at the bottom of the figure.
    Basically, it consists of a rotating flat disk driven by the central motor and
    a friction-wheel rolling on the surface of the disk. The radial position of this
    wheel on the disk is now controlled by the vertical component of the crosshairs
    on the input table. Given some angular velocity of the rotating disk, the angular
    velocity of the friction-wheel depends on its radial position. If it were located
    directly above the disk''s axis, it would not rotate at all while its angular
    velocity would be at its maximum if it were positioned at the edge of the disk.
    Thus, this device effectively performs an integration operation of the basic form
    $\int_{0}^{T} f(\tau) d\tau$


    where $\tau$ represents the *machine time* (more about that later) – in this case
    the rotation of the horizontal disk – and $f(\tau)$ controls the radial position
    of the friction-wheel. The integrator is running during the time interval $[0,
    T]$. Figure 1.5 shows an actual implementation the integrator which was used in
    the *Oslo differential analyzer.*'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/91599d88757ed8c75960eb83f4f85a12_20_0.png)


    Fig. 1.5. Integrator from the Oslo differential analyzer (see [WILLERS 1943, p.
    237])


    The output from the friction-wheel is then used in this setup to control the vertical
    position of the output table''s⁷ (upper right of the picture) pen position while
    its horizontal position is controlled by the central motor. The resulting figure
    is the graph of the integral over the input function.


    Mechanical differential analyzers like this one were only used for a short period
    of time as their disadvantages could not easily be overcome. Their setup is cumbersome
    and time-consuming, the many mechanical parts require a lot of maintenance work,
    and their speed of computation is limited due to the non-negligible masses of
    the rotating and moving parts.


    There were some attempts to build electro-mechanical differential analyzers in
    which basic computing elements were still purely mechanical while their interconnection
    was accomplished by servo-motors and synchros.⁸ The outputs of the synchros could
    be connected to the inputs of the servo-motors by means of a central electric
    patch field, thus at least simplifying the basic setup of such a computer.


    Mechanical and electro-mechanical analog computers were used in staggering numbers
    in the form of fire control systems during World War II. Being very specialized
    analog computers, these machines had no direct influence on the further development
    of the art.'
