- pgno: 122
  md: '# CHAPTER 6


    # Examples


    The following chapter describes a variety of problems of different complexity
    which have been solved using an analog computer. Reproducing these solutions on
    an analog computer is not only highly instructive but also very rewarding and,
    last but not least, fun.


    # 6.1 Chemical kinetics


    A central problem in chemistry, biology, pharmacy etc. is to describe and analyse
    the rates at which chemical reactions occur. Two general terms are important in
    this context. First, the speed of a reaction in which a substance A is transformed
    into a product X, a process typically denoted by \(A \rightarrow X\). The second
    term is the order of the reaction, which describes the dependency of the reaction
    speed on the concentration of the various substances within the reaction:


    +   - **Order 0:** The speed of the reaction is constant. This is typically the
    case when the substances involved are available in abundance.

    +   - **Order 1:** This describes a reaction \(A \rightarrow X\), following the
    equation \(-\dot{a}=ka\), where \(k\) is a constant describing the speed of the
    reaction.

    +   - **Order 2:** A reaction of the form \(A+B \rightarrow X\) or \(A+A \rightarrow
    X\) following \(-\dot{a}=kab\) or \(-\dot{a}=ka^2\), if only reagent A is required.'
