    node $u_{i,j}$ yields the following expression for the voltage at this node:


    $$\frac{(u_{i,j-1} - u_{i,j}) + (u_{i,j+1} - u_{i,j}) + (u_{i-1,j} - u_{i,j})
    + (u_{i+1,j} - u_{i,j})}{R} - \frac{\dot{u}_{i,j}}{C} + I_{i,j} = 0.$$


