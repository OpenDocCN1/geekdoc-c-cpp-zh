- pgno: 206
  md: '# CHAPTER 7


    # Hybrid computing


    Although analog computers are extremely powerful on their own, the combination
    of an analog computer and a digital computer forming a *hybrid computer* is even
    more powerful.


    This idea is by no means new – as early as 1956 *Space Technology Laboratories*
    developed the *ADDAVERTER*, a system capable of coupling an analog computer with
    a digital computer by means of 15 ADCs and 10 DACs¹²⁶ each featuring a precision
    of ±0.1 %. The rationale behind such a setup is that digital computers are good
    in areas where analog computer have deficiencies and vice versa. Applications
    for their combination are abundant due to their computational power and energy
    efficiency.


    A hybrid computer typically operates in one of two basic modes:


    # **Alternating operation:**


    In this mode of operation the digital computer typically controls the parameters
    of an analog computer setup. The analog computer performs an operation run based
    on such a parameter set returning the results of its computation to the digital
    computer by means of ADCs. Based on these results the digital computer can then
    derive a new set of parameters and so forth. Since the operation of the digital
    and analog computers do not overlap, this mode is not time critical with respect
    to communication latencies, ADCs conversion times, etc. Alternating operation
    is typically employed for the solution of optimization problems, multidimensional
    parameter searches,'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'the solution of partial differential equations, stochastic analyses, and related
    problems.


    **Parallel operation:** This mode of operation requires real time operation by
    the digital computer as it operates in parallel with the analog computer and has
    to read and supply values with as little latency as possible. In a setup like
    this, the digital computer can not only change coefficients at run-time but also
    generate functions, act as a delay circuit, make decisions based on the values
    of analog variables, and much more.


    # 7.1 Hybrid controllers


    The following examples and explanations are based on the Analog Paradigm hybrid
    controller but the ideas and techniques presented are by no means restricted to
    this particular device. Similar and coupling devices have been available in the
    past and can be built using cheap off-the-shelf hardware such as Arduino®-boards
    etc. A hybrid controller like this might be connected via USB to the digital computer
    and will typically provide the following functions:


    **Control lines:** The hybrid controller must be able to control the mode of operation
    of the analog computer’s integrators. In the simplest case it will accept commands
    like ic, op, or halt from the digital computer and set the ModeIC and ModeOP control
    lines accordingly.


    Depending on its connection to the digital computer there might be considerable
    delays in the exchange of signals due to communication latencies. This can be
    problematic in applications where precise timing of IC- and OP-times is required.
    It is therefore recommended that the hybrid controller itself should feature a
    clock with at least a 1 μs resolution with all timing issues being performed locally
    by the hybrid controller – without the need to communicate with the attached digital
    computer.


    The hybrid controller should also be able to sense overload conditions, to control
    the POTSET line, and it should feature an input line for an external halt signal.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '**Digital potentiometers:** This type of potentiometer, similar to a *multiplying
    DAC*, typically offers 10 bit resolution, allowing parameters to be set with a
    resolution of about 0.1%. If the input of such a potentiometer is connected to
    +1 or −1, it can even be used as a simple and cheap DAC allowing the digital computer
    not only to control parameters but also to feed time-varying values to the analog
    computer.


    **Digital inputs:** Many applications, such as parameter optimization, include
    some conditions which have to be sensed by the digital computer in order to abort
    a computer run or to change some parameters. This is typically achieved by means
    of comparators yielding a digital output signal which can be read by the digital
    computer using a digital input channel of the hybrid controller.


    **Digital outputs:** Using digital output lines of the hybrid controller, electronic
    switches, such as those used in the CMP4 module, can be controlled by the attached
    digital computer. A typical application for this is to apply step functions to
    a simulated system.


    **Readout:** One of the most important functions a hybrid controller must implement
    is a readout capability including provisions for data logging. Ideally, the analog
    computer features a central readout system which allows every computing element
    to be addressed unambiguously. In this situation, the hybrid controller takes
    over control of the address lines of this system while the analog readout line
    is connected to the hybrid controller’s ADC. The time required for a single readout
    operation is highly critical and includes the time to address and select the computing
    element, the time required by the ADC for one conversion, and the time for transmitting
    the digital value to the digital computer. If many elements have to be read during
    a computation over and over again, it can be necessary to place the analog computer
    in HALT-mode before starting readout operations and to reactivate OP-mode afterwards
    in order to avoid excessive skew between the individual data values being read.
    This becomes more and more important with increasing k₀ values (time scaling)
    of the integrators in a given setup.


    Figure 7.1 shows the front panel of the Analog Paradigm hybrid controller (HC).
    The group of 16 2 mm jacks in the upper half is connected to eight digital potentiometers
    each with a resolution of 10 bits. The second group of 16 jacks in the lower half
    connects to eight digital input lines and eight digital output lines. On the left
    is the USB port while an additional HALT-input and a trigger output are provided
    on the lower right. The module controls all address, data, and con-'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/91599d88757ed8c75960eb83f4f85a12_209_0.png)


    Fig. 7.1. Hybrid controller


    trol lines of the analog computer''s system bus¹³¹ and features a 16 bit ADC for
    readout.


    The following examples give a basic overview of the general capabilities of a
    hybrid computer. More information on hybrid computing with many applications can
    be found in [BEKEY et al. 1968], [KORN et al. 1964], [SCHÖNEFELD 1977], and other
    classic text books.


    # 7.2 Basic operation


    The Model-1''s hybrid controller used in these examples is connected to the digital
    computer by means of a USB interface which emulates a serial line.¹³² To facilitate
    programming the digital computer a Perl¹³³ module (IO::HyCon) has been implemented;
    it provides an object oriented interface to the hybrid controller.¹³⁴'
  merge: -1
  img_proc: true
- pgno: 210
  md: "IO::HyCon requires a configuration file in YAML-format<sup>135</sup> which\
    \ describes the actual setup of the analog computer, i.e. the addresses of the\
    \ various computing elements, the serial line parameters, etc. A typical minimum\
    \ example is shown in the following listing:<sup>136</sup>\n\n```\n```yaml\nserial:\n\
    \  port: /dev/cu.usbserial-DN05OL10\n  bits: 8\n  baud: 115200\n  parity: none\n\
    \  stopbits: 1\n  poll_interval: 10\n  poll_attempts: 20000\ntypes:\n  0: PS\n\
    \  1: SUM8\n  2: INT4\n  3: PT8\n  4: CU\n  5: MLT8\n  6: MDS2\n  7: CMP4\n  8:\
    \ HC\nmanual_potentiometers:\nelements:\n  INT-0: 0x0030\n  INT-1: 0x0031\n  INT-2:\
    \ 0x0032\n  INT-3: 0x0033\n```\n```\n\nIt consists of the following sections:\n\
    \n**serial:** This section describes the communication setup. port defines the\
    \ serial device. Its name depends on the operating system and the USB-serial-adapter\
    \ being used. The remaining parameters are defaults and can be adopted unchanged\
    \ in most cases.\n\n135 See https://yaml.org/spec/1.2/spec.html (retrieved October\
    \ 3rd, 2019) for a detailed description of YAML.\n\n136 There are more optional\
    \ sections and settings which will be introduced when required."
  merge: -1
  img_proc: true
- pgno: 211
  md: '**types:** Each computing element in an Analog Paradigm Model-1 returns an
    eight bit value on the data bus when selected for readout. This section contains
    the mapping between these codes and the actual computing element types.


    **manual_potentiometers:** This section allows the definition of manual potentiometers
    which can be read by the hybrid controller. This is useful, if a simulation requires
    user input by means of coefficient potentiometers whose values are of interest
    during or after an analog computer run.


    **elements:** All elements which are to be read out by the hybrid controller have
    to be defined in this section. Names like INT-0 should be avoided in favour of
    meaningful variable names such as phi-dot or the like.


    A typical hybrid computer program starts like this:


    ```

    use strict;

    use warnings;

    use IO::HyCon;


    my $ac = IO::HyCon->new();

    ```


    The scalar variable `$ac` is an object with access to all the methods implemented
    in `IO::HyCon` to control the operation and setup of the analog computer. The
    call `$ac->ic()` will set the analog computer to IC mode, `$ac->op()` will initiate
    an OP phase, and so on.


    # 7.3 Shell trajectory


    This first example is based on the ballistic trajectory simulation described in
    section 6.6 and is an example of the digital and analog computers working in an
    alternating fashion. The analog computer setup shown in figure 6.21 is used in
    this hybrid computer setup. The only difference here is that the coefficient potentiometers
    for


    $\dot{x}_0 = \cos(\varphi)$


    $\dot{y}_0 = \sin(\varphi)$


    are two of the hybrid controller’s eight digital potentiometers. $\dot{x}_0$ corresponds
    to DPT0 and $\dot{y}_0$ to DPT1.


    The aim of this simulation is to determine the elevation angle of the cannon in
    this two-dimensional setup in order to hit a target at a user defined $x$-coordinate.
    The digital computer sets an elevation angle $\varphi$, and thus $\dot{x}_0$ and
    $\dot{y}_0$, then starts a simulation run and reads the $x$ component where the
    shell hit the ground. Based'
