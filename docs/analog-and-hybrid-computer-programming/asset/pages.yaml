- pgno: 116
  md: 'Proceeding in a rather informal way, s can be interpreted as the differential
    operator d/dt. Replacing the LAPLACE transforms y_i(p) and y_o(t) by their corresponding
    time based functions then yields


    $$\sum_{k=0}^{n} a_k \frac{d^k}{dt^k} y_o(t) = \sum_{k=0}^{m} b_k \frac{d^k}{dt^k}
    y_i(t),$$


    which can now be used to derive an analog computer program for a given transfer
    system like the delay function.


    Unfortunately, the naive approach


    $$e^{-sT} = \sum_{k=0}^{\infty} \frac{(-1)^k (sT)^k}{k!}$$


    is not particularly well suited for an analog computer program since it requires
    an exorbitant amount of circuitry, for even a rough approximation. AMELING$^{67}$
    gives some interesting additional series expansions which, unfortunately, are
    also not very useful for a practical implementation.


    An interesting approach is to abandon the direct implementation of a power series
    representation of the delay operator and to use its macroscopic behaviour instead
    to derive a suitable approximation. With s = iω the LAPLACE delay operator satisfies


    $$|e^{-i\omega T}| = 1,$$


    i.e. it exhibits a constant unit gain. Furthermore, it is


    $$\arg \left(e^{-i\omega T}\right) = -\omega T = -2\pi f T$$


    with ω = 2πf as usual, so e^{-sT} yields a frequency-proportional phase shift
    for a pure sinusoidal input. Accordingly, this operator can be seen as an all-pass
    filter. Based on this observation a different approach to its implementation on
    an analog computer is possible.


    The required unit gain forces the enumerator of (5.3) to be the complex conjugate
    of its denominator yielding a transfer function of the general form


    $$F(p) = \frac{\sum_{k=0}^{\infty} (-1)^k a_k s^k T^k}{\sum_{k=0}^{\infty} a_k
    s^k T^k}.$$'
