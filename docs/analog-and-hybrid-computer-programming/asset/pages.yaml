  md: 'input capabilities of these computing elements. In addition to that they can
    be used to establish specialized feedback paths in order to setup computer circuits
    yielding functions such as absolute value, hysteresis, signum function etc. as
    will be shown later.


    Figure 2.15 shows the front panel of three typical Analog Paradigm free element
    modules.


    The module on the far left is called XIR as it contains two free resistor networks
    which can be connected to the summing junction of any summer or integrator in
    order to extend the number of available inputs. In addition to the standard input
    with weights of 1 and 10, this module also features input resistors with weights
    0.1 and 100.


    The module in the middle, XID, contains six SCHOTTKY diodes as well as two 10
    V ZENER-diodes, sometimes called Z-diodes, which are often used to implement limiters
    etc.


    The module on the right, XIBNC, holds four BNC jacks which can be used to connect
    peripheral equipment such as oscilloscopes, function generators etc. to the analog
    computer system.


    # 2.5 Potentiometers


    A machine without the possibility of setting coefficients in a setup would be
    pretty useless as soon as problems get even a little bit more complicated than
    the simple parabola shown above. In analog-electronic analog computers, so-called
    coefficient potentiometers, or just potentiometers or colloquially "pots", are
    used as adjustable attenuators to introduce coefficients. The simplest form of
    such a device is just a potentiometer used as a voltage divider.


    Figure 2.16 shows the two basic circuits for coefficient potentiometers at the
    top as well as the graphical representation used in analog computer programming.
    A simple voltage divider as shown on the left allows setting coefficients ranging
    from 0 to 1. In some cases a so-called free potentiometer as shown on the right
    half of the figure is employed to continuously cross-fade between two input values.


    A voltage divider basically can be seen as being consisting of an upper resistor
    Ru and a lower resistor Rl connected in series between the input signal and ground.
    The output is connected to the connection between both resistors. The proportion
    between the two resistors is determined by the angular position α of the potentiometer
    dial:


    Ru = (1 − α)R

    Rl = αR


    Obviously, α = 0 yields no output signal at all since the output connection is
    then effectively tied to ground.'
