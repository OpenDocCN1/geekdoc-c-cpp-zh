    Figure 6.34 shows the basic idea of the simulation: The bounding box is assumed
    as the rectangle [−1,1]×[−1,1] and the position of the ball within this box is
    described by the coordinates (x,y). At the start of a simulation run the ball
    has two initial conditions: an initial velocity v0 (of which only the x-component
    will be given) and an initial y-position y0, set to 1.


    The x- and y-components of the ball''s position are completely independent, so
    they can be generated by two separate sub-programs. The x-component of the ball''s
    velocity is assumed to decrease linearly over time. The actual x-position of the
    ball is derived by integrating over its velocity. Every time the ball hits the
    left or right wall of the box, it changes its direction, i.e. it is reflected
    by the wall.


    The y-component is that of a free-falling ball bouncing back elastically when
    hitting the floor. Figure 6.35 shows those two variables over time as displayed
    on an oscilloscope: Starting from the left, the computer is first in IC-mode.
    As soon as the OP-mode starts, the ball begins to drop until it hits the floor
    while the x-component increases (trace in the middle) with decreasing velocity
    until it reaches the right wall etc.


    Figure 6.36 shows the computer setup yielding the x-component of the ball''s position.
    The leftmost integrator generates the velocity component vx of the ball which
    starts at +1 and decreases linearly controlled by the Δv-potentiometer.95 It should
    be noted that this setup differs slightly from the triangle generator shown in
    figure 5.13 in section 5.5 by the introduction of a second comparator with an
    associated electronic switch. This yields a stable comparison value of ±1 for
    the first comparator since its associated switch no longer yields ±1 at its output
    because it is driven by the leftmost integrator in this setup.'
