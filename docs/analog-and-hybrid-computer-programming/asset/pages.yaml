  md: '# CHAPTER 8


    # Summary and outlook


    Programming analog, and therefore hybrid computers, is fundamentally different
    from the algorithmic approach used in digital computers as the preceding chapters
    have shown. At first sight, using an analog computer seems to be much more involved
    and complicated than programming a digital computer. This is deceptive. Apart
    from the scaling issues, programming analog computers is much more straightforward
    than programming digital computers because the mathematical description of a problem
    is basically enough to set up an analog computer – while in the case of a digital
    computer a plethora of additional quirks and complications have to be taken into
    account.


    The main advantages of analog computers, either as stand-alone systems or as part
    of a hybrid computer setup, are


    +   - the extremely high degree of parallelism that this class of machines exhibits,

    +   - the equally high energy efficiency, and

    +   - the stability of solutions obtained by analog computers – for example, there
    is nothing like numerical instability.


    Every change of a bit from 0 to 1 or vice versa in a digital computer requires
    a small parasitic capacitance to be charged or discharged. Together with other
    effects, such as the structure of typical output driver stages of logic gates,
    this results in a superlinear relationship between clock frequency and the overall
    energy consumption of a digital computer. Given today’s clock frequencies of up
    to several GHz this results in power requirements of way over 100 W for a typical
    multi-core'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'CPU chip. Apart from the challenge of cooling such devices, this is, quite
    simply, an excessive amount of energy for the computations.147


    Increasing the clock frequency further to achieve higher computing power is not
    easy because the problem of heat removal gets increasingly worse.


    Digital computers are plagued by other problems as well – one of the most important
    effects is the upper bound of parallelism that can be obtained by an algorithmic
    approach for a certain problem as described by Amdahl’s law. Only few problems
    are so well behaved that they can exploit the computing power of a highly-parallel
    supercomputer. The majority of programs can’t be scaled effectively over many
    processing units.


    It is obvious that alternative approaches to classic digital computing are required
    to fulfill the ever increasing demands for computational power. Analog computers
    will be a central part of such novel systems where they will act as co-processors
    to speed up time-consuming or time-critical simulations, etc., as they do not
    suffer from the aforementioned problems.


    Due to the continuous representation of values as voltages or currents and the
    continuous time of operation within an analog computer, all signals (with the
    exception of comparator and switch outputs) representing variables are continuous
    variables without any steps. This results in very little energy consumption due
    to charging and discharging parasitic capacitances within the system.


    Giving up the idea of a central memory system which stores commands and data to
    be processed in favor of interconnecting individual computing elements in order
    to set up an analog computer for a given problem, there is nothing like a von
    Neumann bottleneck and no algorithm at all which would limit the amount of parallelism
    achievable within an analog computer setup.


    A lot of development work is required in the future to turn the classic analog
    computer with its exposed patch panel into a useful, general purpose, reconfigurable
    integrated circuit.148 A main challenge will be the design and implementation
    of the configuration circuitry which would allow the elements of such an analog
    computer to be interconnected automatically under the control of a digital computer
    which would act as a host system. In addition to the hardware, a software ecosystem
    must be developed including a suitable (standardized) hardware description language
    to describe the required interconnections of a particular ana-'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'log computer setup, libraries allowing the tight integration of the analog
    computer on chip into a hybrid computer, etc.


    These challenges are formidable but the possibilities of analog computing are
    nearly endless and will more than justify all research and development expenses
    necessary.


    Given the high energy efficiency of analog computers compared with digital approaches
    they will create new fields of application – such as medical implants which could
    consume so little electrical energy that they could be powered by thermocouples,
    thus making energy storage devices that must be changed or recharged at regular
    intervals superfluous. It will also find numerous applications in mobile and wearable
    devices for signal pre- and post-processing to save precious battery capacity.
    Even rather complex tasks such as trigger word detection for assistance systems
    can be implemented using analog computer techniques, thus saving power in standby
    mode.


    Other applications will benefit from the fact that a system that is not controlled
    by a program stored in some volatile memory can not be “hacked” in a traditional
    way.149. This will make analog computers the systems of choice when it comes to
    control systems in critical infrastructure systems, systems on which human lifes
    depend, etc.


    Also, most branches of artificial intelligence, (AI), machine learning will benefit
    from the application of analog computing techniques. Spiking neurons can be directly
    implemented as analog circuits and the fact that neuronal networks are basically
    defined by their interconnection structure, together with their synaptic weights,
    fits well with the paradigm of analog computing.


    Analog computing is a very promising approach for future high performance and/or
    low energy computing and will become part of future computing and communication
    systems.


    Happy analog computing!'
  merge: -1
  img_proc: true
