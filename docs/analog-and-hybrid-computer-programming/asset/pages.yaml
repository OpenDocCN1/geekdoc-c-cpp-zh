    If α is not sufficiently small, either a sine function generator is required or
    one can resort to using the sweep circuit described above to generate the sine
    function


    43 What sufficiently small means actually depends on the precision required for
    a solution of this problem. Typically, −π/8 ≤ α ≤ π/8 can be considered small
