  md: '![](img/91599d88757ed8c75960eb83f4f85a12_50_0.png)


    Fig. 2.28. Multiplication by adding logarithms and taking the antilog


    Another, historically more widely employed, implementation of a multiplier made
    use of the fact that


    xy = 1/4 ((x + y)^2 - (x - y)^2).


    This requires only two function generators instead of the three required for the
    logarithm-technique described above. Likewise, the arguments are no longer restricted
    to a positive interval. Due to its use of two squaring functions in conjunction
    with the factor of 1/4, this type of multiplier became known as quarter square
    multiplier. Its implementation typically required positive and negative versions
    of both of its arguments e0 and e1. Often these values were readily available
    in the surrounding computer setup. If not, dedicated inverters (summers with only
    one input) were used.


    Multipliers allowing arguments -1 ≤ e0 ≤ +1 and -1 ≤ e1 ≤ +1 are generally called
    four quadrant multipliers in contrast to two quadrant multipliers which only yield
    results in two of the four quadrants of a Cartesian coordinate system.


    Figure 2.29 shows a modern Analog Paradigm MLT8 multiplier module containing eight
    individual four quadrant Gilbert-cell multipliers.


    A simple application is shown in Figure 2.30 where a multiplier in conjunction
    with an integrator is used to generate a parabola. The integrator yields a linear
    voltage ramp running from +1 to -1 which is fed into both inputs of a multiplier,
    which in turn yields a parabola function at its output.


    > **Multiplication etc.:**

    > Many traditional analog computers feature quarter square multipliers which need
    both input variables with positive and negative signs. By reversing the two inputs
    for either x or y a sign-reversal of the result can be achieved without the need
    for an additional inverter.'
