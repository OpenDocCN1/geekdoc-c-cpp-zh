    Fig. 6.93. Double pendulum


    To derive the total kinetic energy the positions of the pendulum arm tips (x₁,
    y₁) and (x₂, y₂) are required:


    x₁ = l₁ sin(φ₁)

    y₁ = l₁ cos(φ₁)

    x₂ = l₁ sin(φ₁) + l₂ sin(φ₂)

    y₂ = l₁ cos(φ₁) + l₂ cos(φ₂)


    The first derivatives of these with respect to time are


    ẋ₁ = φ̇₁ l₁ cos(φ₁),

    ẏ₁ = -φ̇₁ l₁ sin(φ₁),

    ẋ₂ = φ̇₁ l₁ cos(φ₁) + φ̇₂ l₂ cos(φ₂) and

    ẏ₂ = -φ̇₁ l₁ sin(φ₁) - φ̇₂ l₂ sin φ₂.


    The kinetic energy of the system is then

    T = ½ (m₁(ẋ₁² + ẏ₁²) + mₛ(ẋ₂² + ẏ₂²))  (6.80)


    with

    ẋ₁² = φ̇₁² l₁² cos²(φ₁)

    ẏ₁² = φ̇₁² l₁² sin²(φ₁)

    ẋ₂² = φ̇₁² l₁² cos²(φ₁) + 2 φ̇₁ φ̇₂ l₁ l₂ cos(φ₁) cos(φ₂) + φ̇₂² l₂² cos²(φ₂)

    ẏ₂² = φ̇₁² l₁² sin²(φ₁) + 2 φ̇₁ φ̇₂ l₁ l₂ sin(φ₁) sin(φ₂) + φ̇₂² l₂² sin²(φ₂)


    and thus'
