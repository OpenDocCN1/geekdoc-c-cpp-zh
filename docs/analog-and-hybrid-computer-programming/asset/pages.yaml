  md: '![](img/91599d88757ed8c75960eb83f4f85a12_178_0.png)


    Fig. 6.69. Structure of the heated cable


    r_i. The current flowing through the center conductor heats it to a constant temperature
    T0. The outside of the insulated cable is held at a fixed temperature 0. The aim
    of this simulation is to determine the heat distribution within the insulating
    material with respect to time t and radius r.


    The general homogenous form of the heat equation has the form


    ∂T/∂t − a∇²T = 0   (6.52)


    where a is a constant term describing the thermal diffusivity of the material.
    Generally, it is


    α = k / (ρ c_p)


    where k is the thermal conductivity of the material, ρ is its density, and c_p
    is the specific heat capacity.


    The temperature T within the material is a function of time t and a location vector
    x, i.e. T(x,t). The arguments of the function T are typically omitted as always
    to avoid unnecessary clutter in the equations.


    ∇² is the LAPLACE operator which is often also denoted by Δ. It is


    ∇²T = ΔT = div(grad(T)).   (6.53)


    Due to the inherent rotational symmetry of the two-dimensional cross section of
    the cable shown in figure 6.69, a one-dimensional flat slice running from the
    center to the circumference is sufficient to describe the overall problem. Due
    to (6.53) the LAPLACE operator can be simplified to


    ∇²T = T''''.


    Since the cable in question contains a heat source, the general heat equation
    (6.52) has to be adapted as follows by adding another derivative term:


    ∂T/∂t = a ( ∂²T/∂r² + (1/r) ∂T/∂r )   (6.54)'
