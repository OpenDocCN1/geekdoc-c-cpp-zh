  md: '# APPENDIX C


    # MIKUSIŃSKI''s operational calculus


    This appendix briefly describes an alternative technique to the LAPLACE transformation,
    which can be used to solve certain differential equations analytically.


    # C.1 Introduction


    The polish mathematician JAN MIKUSIŃSKI developed an *operational calculus*, the
    *Calculus of MIKUSIŃSKI*[^162], which will be explored here. His work justified
    the empirical operator calculus developed and used by OLIVER HEAVISIDE to tackle
    the problems of signal transmission along undersea cables.[^163]


    MIKUSIŃSKI starts his work with the *convolution* of two integrable functions
    $f,g: [0,\infty) \to \mathbb{R}$,


    $(g * f)(t) = \int_0^t g(t - \tau) f(\tau) d\tau$, \quad (C.1)


    which is basically an operation on two functions $f$ and $g$ yielding a third
    function. One of the two functions involved, such as $g$ above, can be interpreted
    as a'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'weighting function, which is then multiplied pointwise with the second function
    during the integration process. It should be noted that $\int_0^t g(t - \tau)f(\tau)d\tau
    = \int_0^t f(t - \tau)g(\tau)d\tau$ so either the left- or the right-hand function
    can be interpreted as the weighting function. For the purposes of this discussion
    it will be assumed that the left-hand function is the weighting function.


    To eliminate the somewhat clumsy convolution notation MIKUSIŃSKI introduces the
    notation $\{f(t)\}$ to denote the function $t \mapsto f(t)$ while $f(t)$ represents
    the value this function takes at $t$. Using this notation (C.1) reduces to $\{g(t)\}\{f(t)\}$.
    This looks quite like a multiplication operation and paves the way for the next
    step.$^{164}$


    The special case of $g(t) \equiv 1$ immediately yields $\{1\}\{f(t)\} = \left\{\int_0^t
    f(\tau)d\tau\right\}$ which suggests the interpretation of $l := \{1\}$ as an
    integration operator. $l$ can now be used in the following way for example: $l\{\sin(t)\}
    = \left\{\int_0^t \sin(\tau)d\tau\right\} = -\cos(\tau)\Big|_0^t = 1 - \cos(t)$


    Notably, $l$ as an operator allows “calculating” with it as if it were a number
    or a function. A naturally occurring question concerns the powers of $l$ – what
    do these look like? $l^2 = l\{1\} = \left\{\int_0^t 1 d\tau\right\} = \{t\}$ $l^3
    = l\{t\} = \left\{\int_0^t \tau d\tau\right\} = \left\{\frac{1}{2}t^2\right\}$
    $l^4 = l\left\{\frac{1}{2}t^2\right\} = \left\{\frac{1}{2}\int_0^t \tau^2 d\tau\right\}
    = \left\{\frac{1}{6}t^3\right\}$ etc. This can be generalized to $l^n = \left\{\frac{t^{\,n-1}}{(n-1)!}\right\}$
    for $n \in \mathbb{N}.$'
