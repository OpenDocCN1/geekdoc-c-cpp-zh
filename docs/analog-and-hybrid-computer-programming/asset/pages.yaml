- pgno: 258
  md: '# APPENDIX G


    # A simple joystick interface


    Since an analog computer is ideally suited for all kinds of dynamic systems simulations,
    a joystick interface is a really versatile peripheral device as it makes “man
    in the loop” simulations possible. This appendix describes a simple adapter circuit,
    which allows a two-channel analog joystick, as commonly used for controlling models,
    to be used with an analog computer.


    The joystick used here is a two-channel joystick from an old model remote control.
    It consists of two 4k7 (4700 Ω) potentiometers – one for the x- and one for the
    y-direction. A simple handheld enclosure was built, as shown on the left in figure
    G.2. This also holds a push button which can be used to control an electronic
    switch or a comparator in the analog computer.


    The circuit shown in figure G.1 is pretty straightforward: First, the two reference
    voltages of ±10 V are buffered by the operational amplifiers IC1A and IC1B. R1
    and R2 are the joystick’s potentiometers while R1* and R2* are used to set the
    origin of the joystick (putting the joystick into its middle position with respect
    to x and y should yield a value of 0 on each channel).


    Since the potentiometers used in a typical joystick allow for a 270 degree travel
    and as the joystick only allows for a much smaller deflection, the wiper will
    never hit its end positions. Accordingly, the output signals x and y must be amplified
    to satisfy 10 V ≤ x,y ≤ +10 V. This is done by the two operational amplifiers
    IC1C and IC1D. The capacitors C1 and C2 suppress any unwanted oscillations which
    otherwise may occur. The slight non-linearity due to the load resistance of 10
    k on the wipers of the joystick potentiometers is negligible in this application,
    so no additional buffer stage is required.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/91599d88757ed8c75960eb83f4f85a12_259_0.png)


    Fig. G.1. Joystick adapter circuit


    ![](img/91599d88757ed8c75960eb83f4f85a12_259_1.png)


    Fig. G.2. Joystick mounted in enclosure and prototype adapter circuit


    The switch S1 which is also mounted in the joystick''s enclosure can be seen on
    the right side of the schematic. As long as it is open the output is tied to +10
    V by means of a 100k resistor. Closing the switch will yield a negative value
    so that either a comparator or an electronic switch (in the case of an Analog
    Paradigm Model-1 analog computer) can be controlled by this switch.


    The right half of figure G.2 shows the prototype circuit built on a standard 160×100
    mm² breadboard. The joystick is plugged into the 9-pin SUB-D connector visible
    on the upper left of the circuit board. The 2 mm sockets yield the output signals
    – the red sockets yield x and y while the yellow socket yields the signal from
    the push button switch.'
  merge: -1
