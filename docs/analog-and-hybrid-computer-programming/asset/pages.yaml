    # 6.17 Aizawa attractor


    One of the prettiest chaotic attractors by far is the AIZAWA attractor¹⁰¹ which
    is described by the following three coupled differential equations


    ˙x = x(z − β) − δy,

    ˙y = δx + y(z − β), and

    ˙z = γ + αz − z³/3 + εzx³


    with the parameters α = 0.095, β = 0.7, γ = 0.65¹⁰² δ = 3.5, and ε = 0.1. A thorough
    numerical study of the behaviour of this particular system can be found in [LANGFORD
    1984].


    101 Cf. [COPE 2017].


    102 The original system has γ = 0.6 but 0.65 typically yields a better result.'
