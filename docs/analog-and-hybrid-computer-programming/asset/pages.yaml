    μ_{1,2} = -β \pm i ω.


    The solution of (4.9) is thus given by the linear combination


    y = a e^{μ₁ t} + b e^{μ₂ t} = a e^{-(β + i ω)t} + b e^{-(β - i ω)t} = a e^{-β
