- pgno: 202
  md: '![](img/91599d88757ed8c75960eb83f4f85a12_202_0.png)


    Fig. 6.94. Implementation of equation (6.88)


    Dividing by $l_1^2(m_1+m_2)$ results in


    $0 = \dot{\varphi}_1 + \frac{m_2}{m_1+m_2}\frac{l_2}{l_1}\dot{\varphi}_2\cos(\varphi_1-\varphi_2)
    + \frac{m_2}{m_1+m_2}\frac{l_2}{l_1}\dot{\varphi}_2^2\sin(\varphi_1-\varphi_2)
    + \frac{g}{l_1}\sin(\varphi_1)$


    which can be further simplified as


    $0 = \dot{\varphi}_1 + \frac{m_2}{m_1+m_2}\frac{l_2}{l_1}\big[\dot{\varphi}_2\cos(\varphi_1-\varphi_2)+\dot{\varphi}_2^2\sin(\varphi_1-\varphi_2)\big]+\frac{g}{l_1}\sin(\varphi_1).
    \quad (6.86)$


    Proceeding analogously, (6.85) eventually yields


    $0 = \dot{\varphi}_2 + \frac{l_1}{l_2}\big[\dot{\varphi}_1\cos(\varphi_1-\varphi_2)-\dot{\varphi}_1^2\sin(\varphi_1-\varphi_2)\big]+\frac{g}{l_2}\sin(\varphi_2).
    \quad (6.87)$


    To simplify things further, assuming that $m_1=m_2=1$ and $l_1=l_2=1$ in arbitrary
    units yields the following two equations of motion for the double pendulum based
    on (6.86) and (6.87):


    $\dot{\varphi}_1 = -\frac{1}{2}\big[\dot{\varphi}_2\cos(\varphi_1-\varphi_2)+\dot{\varphi}_2^2\sin(\varphi_1-\varphi_2)+2g\sin(\varphi_1)\big]
    \quad (6.88)$


    $\dot{\varphi}_2 = -\big[\dot{\varphi}_1\cos(\varphi_1-\varphi_2)-\dot{\varphi}_1^2\sin(\varphi_1-\varphi_2)+g\sin(\varphi_2)\big]
    \quad (6.89)$


    The implementation of equations (6.88) and (6.89) is straightforward, as shown
    in figures 6.94 and 6.95. Both circuits require the functions $\sin(\varphi_1-\varphi_2)$,
    $\cos(\varphi_1-\varphi_2)$, $\sin(\varphi_1)$, and $\sin(\varphi_2)$, which are
    generated by three distinct subcircuits like the one shown in figure 6.96. These
    circuits yield sine and cosine of an angle based on the first time-derivative
    of this angle, so the simulation is not limited to a finite range for the two
    angles $\varphi_1$ and $\varphi_2$.


    It should be noted that each of the two integrators of each of these three harmonic
    function generators has a potentiometer connected to its respective initial value
    input. When a simulation run with given initial values for $\varphi_1(0)$ and
    $\varphi_2(0)$ is to be started, these potentiometers have to be set to $\cos(\varphi_1(0))$,
    $\sin(\varphi_1(0))$ and $\cos(\varphi_2(0))$, $\sin(\varphi_2(0))$, respectively.'
  merge: -1
