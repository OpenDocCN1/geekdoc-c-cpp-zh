  md: '![](img/91599d88757ed8c75960eb83f4f85a12_33_0.png)


    # Fig. 2.8. Behaviour of a typical integrator


    with time scale factors k_q = 10^n with n ∈ ℕ typically ranging from 0 to 3 although
    some large historic systems, such as the EAI 680,20 feature time scale factors
    up to 10^5.


    By changing the time scale factors of the integrators in a computer setup it is
    possible to speed up a calculation or slow it down. This is known as time scaling.
    Consequently, it is necessary to distinguish between problem time t, the time
    scale the problem under investigation runs in, and machine time τ, the time scale
    the computer operates in, as determined by the time scale factors set on the integrators.


    Figure 2.9 shows the graphical representation of an integrator as it is used in
    analog computer programming. It differs from the symbol for a summer by the addition
    of a rectangle on its left-hand side, with a vertical bar on its top to which
    the initial condition value e(0) is connected (this input is always drawn vertically).
    Like the summer it has a number of inputs with associated weights of typically
    1 and 10.


    Figure 2.10 shows the front panel of an Analog Paradigm INT4 quad integrator module.
    Each of its integrators can be set to a time scale factor of 1, 10, 100, or 1000
    by a rotary switch and features three inputs weighted by 1 as well as three inputs
    weighted by 10. In addition to this, each integrator has an initial condition
    input labelled IC, and a jack yielding +1 or -1 in its vicinity as these values
    are often used as initial conditions.'
