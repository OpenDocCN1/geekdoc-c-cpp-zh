    two-dimensional sheet of conductive material such as a thin metal plate as described
    by


    $$\dot{u} = \alpha \nabla^2 u.$$ (A.1)


    To model the behaviour of this equation by means of a discrete two-dimensional
    grid of passive elements, it is approximated by finite differences yielding


    $$\dot{u}_{i,j} = \alpha (u_{i-1,j} + u_{i+1,j} + u_{i,j-1} + u_{i,j+1} - 4u_{i,j})
    + q_{i,j}$$


