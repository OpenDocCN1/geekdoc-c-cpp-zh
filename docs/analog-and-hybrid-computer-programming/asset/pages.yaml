    \ file for the hybrid controller looks basically like the minimal example shown\
    \ on page 197 with the following changes and additions:\n\n```\n```yaml\nwave_equation.yml\n\
    elements:\n  U1: O260\n  U2: O261\n  U3: O262\n  U4: O263\nproblem:\n  times:\n\
    \    ic: 10\n    op: 200\n  ro-group:\n    - U1\n    - U2\n    - U3\n    - U4\n\
    wave_equation.yml\n```\n```"
