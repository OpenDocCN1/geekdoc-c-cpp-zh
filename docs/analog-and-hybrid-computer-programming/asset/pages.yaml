    # 6.3 Mathieu''s equation


    This following section is based on another oscillating system described by the
    well-known MATHIEU equation – a linear homogenous second order differential equation
    with many applications. It can be used to describe the vibrations in an elliptic
    drum, the behaviour of an inverted pendulum, and much more.81


    # 6.3.1 Introduction


    The general form of MATHIEU’s equation is


    $$\ddot{y} + (a - 2q \cos(2t)) y = 0$$


    with the initial conditions


    y₀ = 1 and

    \dot{y}₀ = 0.


    Following [EAI 1964], the parameter a is removed by letting a := 2q. Defining
    a function


    $$x(t) = 1 - \cos(2t)\tag{6.3}$$


    simplifies the equation considerably yielding

    $$\ddot{y} + a x y = 0.\tag{6.4}$$'
