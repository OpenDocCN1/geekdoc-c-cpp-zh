    \ f(t) \\, dt\n= \\int_{0}^{\\infty} e^{-s T} e^{-s t} f(t) \\, dt\n= e^{-s T}\
    \ F(s)\n\nThe resulting term $e^{-sT}$ is called the LAPLACE delay operator. Practical\
    \ delay circuits can now be obtained by interpreting this operator as a transfer\
    \ system which is described by its transfer function. Generally, given a time-dependent\
    \ input/output signal pair $y_i(t)$ and $y_o(t)$ the behaviour of the transfer\
    \ system can be described by\n\n$$F(s) = \\frac{y_o(s)}{y_i(s)}\\tag{5.3}$$\n\n\
    with\n\n$$y_o(s) = \\mathcal{L}\\{y_o(t)\\} \\text{ and } \ny_i(s) = \\mathcal{L}\\\
    {y_i(t)\\}$$\n\nbeing the LAPLACE transforms of the time varying input and output\
    \ signals. Such transfer systems can be grouped into two classes:\n\n+   1. Systems\
    \ which can be described by ordinary differential equations and\n+   2. systems\
    \ which must be described by partial differential equations.\n\nOnly systems of\
    \ the first class will be considered here. These can be described by a rational\
    \ function of the form\n\n$$F(p) = \\frac{\\sum_{k=0}^{m} b_k s^k}{\\sum_{k=0}^{n}\
    \ a_k s^k}.\\tag{5.4}$$\n\nCombining (5.3) and (5.4) and rearranging yields\n\n\
    $$\\sum_{k=0}^{n} a_k s^k y_o(p) = \\sum_{k=0}^{m} b_k s^k y_i(p).$$"
