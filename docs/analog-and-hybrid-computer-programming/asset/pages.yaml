    Quadratic square plates like this exhibits symmetry not only along its x- and
    y-axes but also with respect to the 45 degree diagonals as shown in figure 6.71.
    Accordingly, it is sufficient to take only one octant of the plate into account
    in the simulation, thus saving a considerable number of computing elements. Nevertheless,
    this comes at the cost that additional boundary conditions are required.


    If only one octant instead of a quadrant of the plate as shown in figure 6.71
    is implemented as a grid of computing nodes, the nodes along the diagonal and
    those along the x-axis require some attention as they have to be connected to
    their “mirror” neighbor nodes which replace the missing neighbor nodes in the
    adjacent octants. The nodes along the vertical right hand side of the octant are
    held at the fixed temperature T. The node in the center of the plate is denoted
    by u0,0 and is the only node that allows heat to be injected or extracted.


