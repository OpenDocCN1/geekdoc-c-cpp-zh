    # 6.26  Double pendulum


    Even more complicated but also more mesmerizing is the simulation on an analog
    computer of the double pendulum arrangement shown in figure 6.93.¹²⁵


    The equations of motion will be derived as before by determining the Lagrangian
    $L = T - V$ with the two generalized coordinates $\varphi_1$ and $\varphi_2$.
    $T$ represents the total kinetic energy while $V$ is the potential energy of the
    system. This potential energy is


    $$V=-g\left((m_1+m_2)l_1\cos(\varphi_1)+m_2l_2\cos(\varphi_2)\right)$$  \tag{6.79}


    with $m_1$ and $m_2$ representing the masses of the two bobs mounted on the tips
    of the two pendulum rods (which are assumed as being weightless). As always, $g$
    represents the gravitational acceleration.


    ¹²⁵ This has also been done by [Mahrenholtz 1968, pp. 159–165] which served as
    an inspiration for this application note, especially for the display circuit.'
