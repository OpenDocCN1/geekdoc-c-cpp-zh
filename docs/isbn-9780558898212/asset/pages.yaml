    \ read as follows:\n\n```\nvoid BankAccount::update(int years) {\n    if (years\
    \ == 1) {\n        post_one_year();\n    } else if (years > 1) {\n        update(years\
    \ - 1);\n        post_one_year();\n    }\n}\n```\n\nRecursion and Overloading\n\
    Do not confuse recursion and overloading. When you overload a function name, you\
    \ are giving two different functions the same name. If the definition of one of\
    \ these two functions includes a call to the other, that is not recursion. In\
    \ a recursive function definition, the definition of the function includes a call\
    \ to the exact same function with the exact same definition, not to some other\
    \ function that coincidentally uses the same name. It is not too serious an error\
    \ if you confuse overloading and recursion, since they are both legal. It is simply\
    \ a question of getting the terminology straight so that you can communicate clearly\
    \ with other programmers, and so that you understand the underlying processes."
