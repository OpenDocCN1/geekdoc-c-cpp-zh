  md: 'The areas of medicine, bioengineering, and computer science were meant for
    the development of the computerized axial tomography (CAT) scanner machine. This
    instrument can generate three-dimensional images or two-dimensional slices of
    an object using X-rays that are generated from different angles around the object.
    Each X-ray measures a density from its angle, and very complicated algorithms
    combine the information from all X-rays to reconstruct a clear image of the inside
    of the object. CAT scans are routinely used to identify tumors, clots, and brain
    abnormalities. The U.S. Army continues to develop rugged, lightweight CAT scanners
    that can be transported to medical stations in combat zones.


    Lasers are waves that have the same frequency and travel in a narrow beam that
    can be directed and focused. $CO_2$ lasers are used to drill holes in materials
    that range from ceramics to composite materials. Lasers are also used in medical
    procedures to treat detached retinas, seal blood vessels, vaporize tumors, and
    perform inner-ear surgery. Three-dimensional pictures called holograms are also
    generated with lasers.


    The prediction of weather, climate, and global change requires that we understand
    the coupled atmosphere and ocean system. Understanding climate dynamics in the
    atmosphere and ocean, ozone depletion, and climate changes due to the releases
    of chemicals or energy, includes solar interactions. A major eruption from a solar
    storm near a "coronal hole" (a venting point for the solar wind) can eject vast
    amounts of hot gases from the sun''s surface towards the earth''s surface at speeds
    over million miles per hour. This jet of hot gases hits the earth with X-rays
    and can interfere with communication and cause power fluctuations in power lines.
    Learning to predict changes in climate, and global change involves collecting
    large amounts of data for study and developing new models that represent the interdependence
    of many variables. We will analyze the weather patterns at Denver International
    Airport over a 1-year period in later chapters. We will also use satellite data
    to develop a model for predicting mixing ratios in the atmosphere and analyze
    the altitude and velocity information for a helium-filled weather balloon.


    Computed speech understanding could revolutionize our communication systems, but
    many problems are involved. Software that teaches a computer to understand words
    from a smaller vocabulary set is currently in use. However, developing systems
    that are speaker-independent and understand words from large vocabularies and
    different languages is very difficult. Subtle changes in one''s voice, such as
    those caused by cold or stress, can affect the performance of speech-recognition
    systems. Even assuming that the computer can recognize the words, it is not simple
    to determine their meaning. Many words are context-dependent, and thus must be
    analyzed separately. Intonation as raising one''s voice can change a statement
    into a question. Although there are still many problems to address in automatic
    speech recognition and understanding, exciting applications are everywhere. Imagine
    a telephone system that detects the languages being spoken and translates the
    speech signals so that each person hears the conversation in or her native language.
    We will analyze actual speech data to demonstrate some of the techniques used
    in word recognition.


    # Changing Engineering Environment


    The engineer of the 21st century will work in an environment that requires many
    nontechnical skills and capabilities. Although the computer will be the primary
    computational tool of most engineers, the computer will also be useful in developing
    additional not abilities,'
