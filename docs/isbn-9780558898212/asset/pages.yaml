  md: "```\nint main() {\n    /* Define objects. */\n    double t, f;\n    ifstream\
    \ dsine;\n\n    /* Generate data file. */\n    dsine.open(\"dsine.dat\");\n  \
    \  for (int k=1; k<=100; k++) {\n        t = 0.1*(k-1);\n        f = exp(-t)*sin(2*PI*t);\n\
    \        dsine << t << \" \" << f << endl;\n    }\n    /* Close data file and\
    \ exit program. */\n    dsine.close();\n    return 0;\n}\n\n```\n\n# ## ASCII\
    \ Data File Generated by the C++ Program\n\nThe data file generated by this program\
    \ is an ASCII file that contains two numbers per line. The first few lines of\
    \ information and the last line of information are\n\n| 0.0 | 0.000 |\n| 0.1 |\
    \ 0.532 |\n| 0.2 | 0.779 |\n\n9.9 0.000\n\n# ## Generating a Plot with MATLAB\n\
    \nTo generate a plot of this information with MATLAB, we only need two statements.\
    \ The first statement loads the file into the MATLAB workarea, and the second\
    \ statement generates the x-plot:\n\n```\n>>load dsine.dat\n>>plot(dsine(:,1),dsine(:,2))\n\
    ```\n\nThese steps generate the plot in Figure 1.\n it is important to label the\
    \ information in the plot, we could also add the statements to give the plot a\
    \ label, to the axes, and to add a background grid:\n\n```\n>>load dsine.dat\n\
    >>plot(dsine(:,1),dsine(:,2))\n>>title('Damped Sine Function')\n>>xlabel('Time,\
    \ s'), ylabel('f(t)'), grid\n```\n\nThe plot with these labels is shown in Figure\
    \ 2."
