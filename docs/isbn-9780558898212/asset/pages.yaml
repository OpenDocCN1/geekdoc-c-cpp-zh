    # Overflow and Underflow


    The values stored in a memory have a wide range of allowed values. However, if
    the result of a computation exceeds the range of allowed values, an error occurs.
    For example, assume that the exponent range of a floating-point value is from
    -38 to 38. This range should accommodate most computations, but it is possible
    for the results of an expression to be outside of this range. For, suppose that
    we execute the following commands:


    +   x = 2.5e30;

    y = 1.0e30;

    z = x*y;


    The values of x and y are within the allowable range. However, the value of z
    should be 2.5e60, but this value exceeds the range. This error is called exponent
    overflow because the result of an arithmetic operation is too large to store in
    the memory assigned to the object. The action generated by an exponent overflow
    is system dependent.


    Exponent underflow is a similar error caused by the result of an arithmetic operation
    being too small to store in the memory assigned to the object. Using the same
    allowable range as in the previous example, we obtain an exponent underflow with
    the following commands:


    +   x = 2.5e-30;

    y = 1.0e-30;

    z = x/y;


    Again, the values of x and y are within the allowable range, but the value of
    z should be 2.5e-60. Because the exponent is less than the minimum value allowed,
    we have caused an exponent underflow. Again, the action generated by an exponent
    underflow is system dependent: on some systems, the result of an operation with
    exponent underflow is set to zero.


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_63_0.png)


