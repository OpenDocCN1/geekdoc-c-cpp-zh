  md: '# Problem Definition


    We have been commissioned by the Quick-Shop supermarket chain to write a program
    that will determine the retail price of an item given suitable input. Their pricing
    policy is that any item that is expected to sell in one week or less is marked
    up 5%, and any item that is expected to stay on the shelf for more than one week
    is marked up 10% over the wholesale price. Be sure to notice that the low markup
    of 5% is used for up to 7 days and that at 8 days the markup changes to 10%. It
    is important to be precise exactly when a program should change from one form
    of calculation to a different one.


    As always, we should ensure we have a clear statement of the input required and
    the output produced by the program.


    # Input


    The input will consist of the wholesale price of an item and the expected number
    of days until the item is sold.


    # Output


    The output will give the retail price of the item.


    # Analysis of the Problem


    Like many simple programming tasks, this one breaks down into three main subtasks:


    +   1. Input the data.

    2. Compute the retail price of the item.

    3. Output the results.


    These three subtasks will be implemented by three functions. The three functions
    are described by their function declarations and accompanying comments, which
    are given below. Note that only those items that are changed by the functions
    are call-by-reference parameters. The remaining formal parameters are call-by-value
    parameters.


    ```

    void get_input(double& cost, int& turnover);

    //Precondition: User is ready to enter values correctly.

    //Postcondition: The value of cost has been set to the

    //wholesale cost of one item. The value of turnover has been been

    //set to the expected number of days until the item is sold.


    double price(double cost, int turnover);

    //Precondition: cost is the wholesale cost of one item.

    //turnover is the expected number of days

    //until sale of the item.

    //Returns the retail price of the item.

    ```'
