    values in output statements such as the following:


    ```

    cout << "This is a string";

    ```


    We have also used string values as arguments to the member function open. Whenever
    you use a literal string, as in the cout statement shown, you must place the string
    in double quotes.


    string variable In order to read a file name into your program, you need a variable
    that is capable of holding a string. A variable to hold a string value is declared
    as in the example:


    ```

    char file_name[16];

    ```


    This declaration is the same as if you had declared the variable to be of type
    char, except that the variable name is followed by an integer in square brackets
    that specifies the maximum number of characters you can have in a string stored
    in the variable. This number must be one greater than the maximum of characters
    in the string value. In our example, the variable file_name can contain any string
    that contains 15 or fewer characters. The file_name can be replaced by any other
    identifier (that is not a keyword), and the number 16 can be replaced by any other
    integer.


    string input You can input a string value to a string variable the same way that
    you input values of other types. For example, consider the following piece of
    code:


    ```

    cout << "Enter the file name (maximum of 15 characters):\n";ncin >> file_name;

    out << "OK, I will edit the file " << file_name << endl << endl;

    ```


