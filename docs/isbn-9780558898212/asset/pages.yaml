    # SUMMARY


    An array is a data structure often used to store engineering data that are analyzed
    in a program. If the data best represented by a table or grid of information,
    a two-dimensional array is used. Many examples were developed in this chapter
    to illustrate definitions, initializations, computations and input with two-dimensional
    arrays, and two-dimensional arrays as function parameters. The Gauss elimination
    technique for solving a system of simultaneous linear equations was also presented,
    and a C++ program developed to implement this technique. The vector class was
    used in an example to model a two-dimensional array.


    # Key Terms


    | column offset | nonsingular |

    | declared column size | pivoting |

    | determinant | row offset |

    | Gauss elimination | simultaneous linear equations |

    | hyperplane | square matrix |

    | ill conditioned | subarray |

    | inner product | system of equations |

    | matrix | transpose |

    | matrix multiplication | two-dimensional array |


    # C++ Statement Summary


    Two-dimensional array declaration:

    double x[10] [5]:


    # Style


    +   1. Use symbolic constants to declare the size of an array so that it is easy
    to modify.

    2. In documentation, describe a two-dimensional array as a grid with rows and
    columns.

    3. The objects i and j are commonly used as offsets for a two-dimensional array.


    # Debugging Notes


    +   1. The declared column size of an array must be specified in the formal parameter
    list and in the function prototype.

    2. Be careful not to exceed the maximum offset value when referencing an element
    in a multidimensional array.

    3. Be sure to enclose each offset in its own set of brackets when referencing
    elements of a multidimensional array.


