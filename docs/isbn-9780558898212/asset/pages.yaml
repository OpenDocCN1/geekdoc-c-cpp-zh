    # CHAPTER SUMMARY


    +   All subtasks in a program can be implemented as functions, either as functions
    that return a value or as void functions.


    +   A formal parameter is a kind of placeholder that is filled with a function
    argument when the function is called. There are two methods of performing this
    substitution, call-by-value and call-by-reference.


    +   In the call-by-value substitution mechanism, the value of an argument is substituted
    for its corresponding formal parameter. In the call-by-reference substitution
    mechanism, the argument should be a variable and the entire variable is substituted
    for the corresponding argument.


    +   The way to indicate a call-by-reference parameter in a function definition
    is to attach the ampersand sign, &, to the type of the formal parameter.'
