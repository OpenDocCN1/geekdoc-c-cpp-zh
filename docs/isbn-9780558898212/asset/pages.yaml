  md: '# Introduction to Computing and Engineering Problem Solving


    We can see that we are repeating the pattern of 1001 and will never arrive at
    a terminating zero of zero. Thus, the binary approximation of $0.6_{10}$ is the
    repeating binary $0.100110011001...$. Expanding this to 8 bits of precision, we
    have:


    ```

    $1^{-1} + 0*2^{-2} + 0*2^{-3} + 1*2^{-4} + 1*2^{-5} + 0*2^{-6} + 0*2^{-7} + 1*2^{-8}
    =\n1*(\frac{1}{2}) + 0*(\frac{1}{4}) + 0*(\frac{1}{8}) + 1*(\frac{1}{16}) + 1*(\frac{1}{32})
    + 0*(\frac{1}{64}) + 0*(\frac{1}{128}) + 1*(\frac{1}{256})$

    ```


    $0.5 + 0 + 0.0625 + 0.03125 + 0 + 0.00390625 = 0.59765625$


    > $12.6_{10} \approx 1100.10011001_2$


    It is important to know that the binary representation of a floating point decimal
    is an approximation, not an equality. This affects the way we use and test floating
    point values in programs and it affects the accuracy of numerical calculations.


    # 5 An Engineering Problem-Solving Methodology


    Problem solving is a key part of not only engineering courses, but also of courses
    in computer science, mathematics, physics, and chemistry. Therefore, it is important
    to have a consistent approach to solving problems. It is also helpful if the approach
    is general enough to work for all these different areas so we do not have to learn
    one technique for mathematics problems, a different technique for physics problems,
    and so on. The problem-solving process that present works for engineering problems
    and can be tailored to solve problems in other areas as well; however, it does
    assume that we are using the computer to help solve the problem.


    The process or methodology for problem solving that we will use throughout this
    text has steps:


    +   1. State the problem clearly.

    2. Describe the input and output information of the problem.

    3. Work the problem by hand (or with a calculator) for a simple set of data.

    4. Develop a solution and convert it to a computer program.

    5. Test the solution with a variety of data.


    We now discuss each of these steps using an example of computing the distance
    between two points in a plane.'
