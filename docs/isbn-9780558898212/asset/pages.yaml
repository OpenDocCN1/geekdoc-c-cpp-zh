  md: "# 4. ALGORITHM DEVELOPMENT\n\nThe first step in the development of an algorithm\
    \ is the decomposition of the problem into a set of sequentially executed steps:\n\
    \nDecomposition Outline\n\n+   1. Read the coordinates of the adjacent points\
