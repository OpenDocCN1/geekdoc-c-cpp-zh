  md: 'In order to convert this pseudocode into the code for a C++ function, all we
    need to do is translate the following two pieces of pseudocode into C++ expressions:


    the number n with the last digit removed


    and


    the last digit of n


    These expressions can easily be translated into C++ expressions using the integer
    division operators / and % as follows:


    +   - n / 10 //the number n with the last digit removed

    - n % 10 //the last digit of n


    For example: 1234 / 10 evaluates to 123, and 1234 % 10 evaluates to 4.

    Several factors influenced our selection of the two subtasks we used in this algorithm.
    One that we could easily compute the argument for the recursive call to write_vertical
    (shown in color) that we used in the pseudocode. The number n with the last digit
    removed is easily computed as n/10. As an alternative, you might have been tempted
    to divide the subtasks as:


    +   1. Output the first digit of n.

    2. Output the number n with the first digit removed.


    This is a valid decomposition of the task into subtasks, and it can be implemented
    recursively. However, it is difficult to calculate the result of removing the
    first digit from a number, but it is easy to calculate the result of removing
    the last digit from a number.

    Another reason for choosing these sorts of decompositions is that one of the subcases
    does not involve a recursive call. A successful definition of a recursive function
    always includes at least one case that does not involve a recursive call (as well
    as one or more cases that do involve at least one recursive call). This aspect
    of the recursive algorithm is discussed in the subsections that follow this case
    study.


