    If any errors are detected by the compiler during compilation, corresponding error
    messages are printed. We must correct our program statement and perform the compilation
    step again. The errors identified during this stage are called parse errors or
    syntax errors. For example, if we want to divide the value stored in a variable
    sum by 3, the correct expression in C++ is sum/3. If we incorrectly write the
    expression with the backslash, as in sum\3, we have a syntax error and an error
    message will be reported by the compiler when we attempt to compile our program.
    The process of compiling, correcting statements that have syntax errors, and recompiling
    must be repeated several times before the program runs without errors. When there
    are no syntax errors, the compiler can successfully translate the program and
    generate a program in the language specified by the original C++. The C++ program
    is referred to as the source file, and the machine language version is called
    an object file. Thus, the source program and the object program specify the same
    steps, but the source program is in a high-level language and the object program
    is in machine language.


    Once the program has compiled, additional steps are necessary to prepare the statement
    to the object program and then loading the program into memory. If this linking/loading,
    the steps are then executed by the compiler. New errors execution errors, run-time
    errors, or logic errors may be identified in this stage; these errors are called
    program bugs. For example, the program statement may require an reference to an
    invalid memory location, which may generate an execution error. Execution errors
    do not stop the program from executing, but they may cause incorrect results to.
    These types of errors can be caused by programmer in determining the correct solutions
    in and by errors in the data processed by the program. When execution errors occur
    due to the errors in the program statements, we must correct the errors in the
    source program and then again with the compilation step. This process is called
    debugging and can be quite time consuming. Even when a program appears to execute
    properly, we must check the answers fully to be sure that they are correct. The
    compiler will perform the steps as specified; if there are no syntax errors, it
    will execute these (but syntactically legal) steps and then present us with an
    answer that is correct. The processes of compilation, linking/loading, and execution
    are outlined in Figure 3.


