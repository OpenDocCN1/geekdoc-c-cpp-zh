    Application Software. Numerous application programs are available to perform operations.
    For example, word processors as Word and Pages are application programs that have
    been written to help you create formatted documents such as resumes, newsletters
    and reports. Word processors have capabilities that allow you to enter mathematical
    equations and to check your spelling and grammar. Text editors, such as Notepad
    and WordPad, are provided for the creation of text files such as C++ programs
    and data files. Most sophisticated software, such as an IDE, includes compilers
    and provides a friendly environment for developing application programs. Spreadsheets
    are tools that allow you to work easily with data that can be displayed in a grid
    of rows and columns. Spreadsheets and engineering problems can be easily solved
    using spreadsheets. Most spreadsheets include plotting capabilities, so they can
    be especially useful in analyzing and displaying information. Lotus 1-2-3, Office,
    and Excel are popular spreadsheet packages.


    Another popular group of software tools is database management software, such
    as MySQL and Oracle. These programs allow you to efficiently store and retrieve
