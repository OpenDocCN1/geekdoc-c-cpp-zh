  md: '# I/O Streams as an Introduction to Objects and Classes


    In the previous example, there are two calls to the function set, and these two
    calls set the flags ios::fixed and ios::showpoint. The flag ios::fixed causes
    the stream to output numbers of type double in what is called fixed-point notation,
    which is a fancy phrase for the way we normally write numbers. If the flag ios::fixed
    is set (by a call to set()), then all floating point numbers (such as numbers
    of type double) that are output to that stream will be written in ordinary notation,
    rather than scientific notation.


    The ios::showpoint tells the stream to always include a decimal point in floating-point
    numbers, as numbers of type double. So if the number to be output has a value
    of 2.0, then it will be output as 2 and not simply as 2; that is, the output will
    include the decimal point even if all the digits after the decimal point are 0.
    Some common flags and the actions they described in Display 5.


    # DISPLAY 5 Formatting for flags


    | Flag | Meaning | Default |

    | ios::fixed | If this flag is set, floating-point numbers are not written in
    e-notation. (Setting this automatically unsets the flag ios::scientific.) | Not
    set |

    | ios::scientific | If this flag is set, floating-point numbers are written in
    e-notation. (Setting this automatically unsets the flag ios::fixed.) If neither
    fixed nor ios::scientific is set, then the system decides how to output each number.
    | Not set |

    | ios::showpoint | If this flag is set, a decimal point and trailing zeros are
    always shown for floating-point numbers. If it is not set, a number with all zeros
    after the decimal point might be output without the decimal point and following
    zeros. | Not set |

    | ios::showpos | If this flag is set, a plus sign is output before positive integer
    | Not set |

    | ios::right | If this flag is set and some field-width value is given with a
    call to the member function width, then the next item output will be at the right
    end of the space specified by width. In other words, any extra blanks are placed
    before the item output. (Setting this flag automatically unsets the flag ios::left.)
    | Set |

    | ios::left | If this flag is set and some field-width value is given with a call
    to the member function width, then the next item output will be at the left end
    of the space specified by width. In other words, any extra blanks are placed after
    the item output. (Setting this flag automatically unsets the flag ios::right.)
    | Not set |'
