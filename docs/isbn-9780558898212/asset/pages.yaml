  md: 'false. The value of in_stream.eof( ) will not change from false true until
    the program tries to read one more character. That is why the while loop ends
    with in_stream.get(next). The loop needs to read one extra character to end the
    loop.


    There is a special end-of-file marker at the end of a file. The member function
    does not change from false until this end-of-file marker is read. That''s why
    the while loop could read one character beyond what you think is the last character
    in the file. However, this end-of-file marker is not an ordinary character and
    should not be manipulated like an ordinary character. You can read this end-of-file
    marker, but you should not write it again. If you write out the end-of-file marker,
    the result is unpredictable. The system automatically places this end-of-file
    marker at the end of each file for you.


    The next Programming Example uses the eof member function to determine when the
    program reads the input file.


    You now have two methods for detecting the end of a file. You can use the eof
    member function or you can use the method described in the Programming Tip "Checking
    for the End of File." In many situations you can use either method, but programmers
    prefer the two methods in different situations. If you have any other reason to
    prefer one of these two methods, then use the following rule: Use the eof member
    function when you are treating the input as text and reading the input with the
    get member function; use the other method when you are processing numeric data.


