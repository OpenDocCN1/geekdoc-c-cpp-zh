  md: '# Functions for All Subtasks


    Recall that the principle of procedural abstraction says that functions should
    be designed so that they can be used as black boxes. For a programmer to use a
    function effectively, all the programmer need to know is the function declaration
    and the accompanying comment that says what the function accomplishes. The programmer
    should not know any of the details contained in the function body. In this section
    we discuss a manner of topics that deal with this principle in more detail.


    # Functions Calling Functions


    A body may contain a call to another function. The situation for these sorts of
    function calls is exactly the same as would be if the function call had occurred
    in the main function of the program; the only restriction is that the function
    declaration before the function is used. If you set up your programs as we have
    been doing, this will happen automatically, since all function declarations before
    the main function and all function definitions after the main function. Although
    you may include a call within the definition of another function, you cannot place
    the definition of one function within the body of another function definition.


    Display 8 shows an enhanced version of the program shown in Display 4. The program
    in Display 4 always reverses the values of the variables first_num and second_num.
    The program in Display 8 reverses the variables only some of the time. The program
    in Display 8 uses the function order to reorder the variables in these variables
    so to ensure that


    ```

    first_num <= second_num

    ```


    If this condition is already true, then nothing is to the variables first_num
    and second_num. If, however, first_num is greater than second_num, then the function
    swap_values is called to interchange the values of these two variables. This ordering
    for exchanging of variable values takes place within the body of the function
    order. Thus, the function swap_values is called within the body of the function
    order. This presents no special problems. Using the principle of procedural abstraction,
    we think of the function swap_values as performing an action (namely, interchanging
    the values of two variables); this action is the same no matter where it occurs.


    # Preconditions and Postconditions


    One good way to write a function declaration comment is to break it into two kinds
    of information. call a precondition and a postcondition. The precondition states
    what is assumed to be true when the function is called. The function should not
    be used and cannot expected to perform correctly unless the precondition holds.
    The postcondition tells what will be true after the function call; that, is, the
    postcondition tells what will be true after the'
