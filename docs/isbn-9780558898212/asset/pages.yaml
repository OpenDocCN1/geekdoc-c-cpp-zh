    November 2006. You can view a gallery of images acquired by the Mars Orbiter Camera
    at http://mars.jpl.nasa.gov/mgs/gallery/images.html.


    Some of the images collected by the Mars Surveyor suggest that liquid water has
    seeped onto the surface in the geologically recent past, leading NASA to develop
    and launch the Mars Reconnaissance Orbiter to search for evidence that water was
    persisted on the planet long. The Mars Reconnaissance Orbiter uses a new spacecraft
    design from the ground up for aerobraking, a rigorous phase of the mission where
    the orbiter uses the friction of the atmosphere to slow down and settle into its
    final orbit. The Orbiter began orbit around March 10, 2006. From March to November
    2006, the spacecraft shrunk its orbit by dipping more than 400 kilometers into
    the top of the atmosphere to reduce velocity and return to nearly circular, orbit
    at altitudes of 150 to km.


    One of six science instruments aboard the Orbiter is the Compact Reconnaissance
    Imaging Spectrometer for Mars (CRISM), designed and built by the Johns Hopkins
    Applied Physics Laboratory in Laurel, MD. CRISM will read colors in reflected
    sunlight to detect minerals in the surface. Its highest resolution is 20 times
    faster than any previous look at Mars. High-resolution images most likely to have
    captured water, and also determine the best potential landing sites for the Mars
    Explorers. The Mars Explorers are designed to move across the surface of the planet
    and examine the water and rocks in detail fine.


    The space program provided much of the impetus for the development of application
    satellites that are used to provide weather information, relay communication signals,
    map uncharted areas and provide environmental updates on the composition of the
    atmosphere.

    The Global Positioning System (GPS) is a constellation of 24 satellites that broadcasts
    position, velocity, and time information. GPS receivers measure the time it takes
    for signals to travel from the GPS satellite to the receiver. Using information
    from four satellites, a microprocessor in the receiver can then determine precise
    measurements of the receiver''s location; the accuracy varies from a few meters
    to centimeters, depending on the techniques used.


    The aircraft industry was the first to develop and use composite materials consisting
    of materials that can be bonded in such a way that one material reinforces the
    fibers of the other. Advanced composite materials were developed to provide lighter,
    stronger, and more resistant materials for aircraft and spacecraft. Additional
    markets for composites now exist in many other fields. For example, downhill skis
    use layers of Kevlar fibers to increase their strength and weight, and club shafts
    of graphite/epoxy are stronger and lighter than the steel in sports. Composite
    materials are also used in the design of prosthetics for limbs.


    The development of advanced composite materials is aided by computer simulation
    for experimentation that may not be possible, due to size, speed, dangers to health,
    or the economics of conducting the experiment. In simulations, mathematical models
    of physical phenomena are translated into computer software that specifies how
    calculations are performed. By repeatedly running the software using different
    data, an understanding of the phenomenon of interest emerges. We will write a
    program to simulate the design of a molten plastic material developed for insulating
    critical components in electronic assemblies from thermal and mechanical shock.


