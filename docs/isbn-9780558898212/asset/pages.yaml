    # ## Two-Dimensional Arrays


    A set of data values that is visualized as a row or column is easily represented
    by a one-dimensional array. However, there are many examples in which the best
    way to visualize a set of data is with a grid or a table of data.


    Suppose we want to display a table of temperature values recorded at eight hour
    intervals over a period of four days. The could be displayed as shown in the following
    array which has four rows corresponding to the number of days and three columns
    corresponding to the number of temperatures recorded during a twenty four hour
    period:


    | | 50 | 70 | 60 |

    | row 0 | | | |

    | row 1 | 48 | 78 | 62 |

    | row 2 | 51 | 69 | 60 |

    | row 3 | 52 | 78 | 63 |'
