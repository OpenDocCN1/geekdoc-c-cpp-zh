    # Function to Convert from int to double


    The notation static_cast<double> can be used as a predefined function and will
    convert a value of some other type to a value of type double. For example, static_cast<double>(2)
    returns 2.0. This is called type casting. (Type casting can be done with types
    other than double, but until later in this book, we will do type casting only
    with the type double).


    SYNTAX


    ```

    static_cast<double>(Expression_of_Type_int)

    ```


    EXAMPLE


    ```

    int total_pot, number_of_winners;

    double your_winnings =

    static_cast<double>(total_pot)/number_of_winners;

    ```


    # Older Form of Type Casting


    The use of static_cast<double>, as discussed in the previous section, is the preferred
    way to perform a type cast. However, older versions of C++ use a different notation
    for type casting. This older notation simply uses the type as if it were a function
    name, so double(9) returns 9.0. Thus, if candy_per_person is a variable of type
    double, and if both total_candy and number_of_people are variables of type int,
    then the following two assignments are:


    double used as a function


    ```

    candy_per_person =

    static_cast<double>(total_candy)/number_of_people;

    ```


    and


    ```

    candy_per_person =

    double(total_candy)/number_of_people;

    ```'
