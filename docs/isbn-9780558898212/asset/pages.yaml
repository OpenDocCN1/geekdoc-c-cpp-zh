  md: '# Recursion 361


    Now let''s look at an example that involves a recursive call. Consider the expression


    ```

    power(2, 1)

    ```


    When the function is called on the stack, the value of x is set equal to 2, the
    value of n is set equal to 1, and the code in the body of the function definition
    is executed. Since this value of n is greater than 0, the following return statement
    is used to determine the value returned:


    ```

    return (power(x, n - 1)*x);

    ```


    in which this case is equivalent to


    ```

    return (power(2, 0)*2);

    ```


    At this point the computation of power(2, 1) is suspended, a copy of this suspended
    computation is placed on the stack, and the computer then starts a new function
    call to compute the value of power(2, 0). As you have already seen, the value
    of power(2, 0) is 1. After determining the value of power(2, 0), the computer
    replaces the expression power(2, 0) with its value of 1 and resumes the suspended
    computation. The resumed computation determines the final value for power(2, 0)
    by the above return statement as follows:


    ```

    power(2, 0)*2 is 1*2, which is 2.

    ```


    Thus, the final value returned for power(2, 1) is 2. The following would set the
    value of z equal to 2:


    ```

    int z = power(2, 1);

    ```


    Larger numbers for the second argument will produce longer chains of recursive
    calls. For example, consider the statement


    ```

    cout << power(2, 3);

    ```


    The value of power(2, 3) is calculated as follows:


    ```

    power(2, 3) is power(2, 2)*2

    power(2, 2) is power(2, 1)*2

    power(2, 1) is power(2, 0)*2

    power(2, 0) is 1 (stopping case)

    ```


    When the computer reaches the stopping case, power(2, 0), there are three suspended
    computations. After calculating the value returned for the stopping case, it resumes
    the most recently suspended computation to determine the value of power(2, 1).
    After that, the computer completes each of the other suspended computations, using
    each value computed as a value to plug into another suspended computation, until
    it reaches and completes the computation for the original call, power(2, 3). The
    details of the entire computation are illustrated in Display 4.'
