  md: '# # RECURSIVE FUNCTIONS FOR TASKS


    I remembered too that night which is at the middle of the Thousand and One Nights
    when Scheherazade (through a magical oversight of the copyist) begins to relate
    word for the story of the Thousand and One Nights, establishing the risk of coming
    once again to the night when she must repeat it, and thus to infinity.

    JORGE LUIS BORGES, *The Garden of Fork Paths*


    When you are writing a function to solve a task, one basic design technique is
    to break the task into subtasks. Sometimes it turns out that least one of the
    subtasks is a smaller example of the same task. For example, if the task is to
    search an array for a particular value, you might divide this into the subtask
    of searching the first half of the array and the subtask of searching the second
    half of the array. The subtasks of searching the halves of the array are "smaller"
    versions of the original task. Whenever one subtask is a smaller version of the
    original task to be accomplished, you can solve the original task using a recursive
    function. It takes a little training to easily decompose this way, but once you
    learn the technique, it can be one of the quickest ways to design an algorithm,
    and ultimately a C++ function. We begin with a simple case study to illustrate
    this technique.


    > Recursion

    In C++ function definition may contain a call to the function being defined. In
    such cases the function is said to be recursive.


    # CASE STUDY Vertical Numbers


    In this case study we design a recursive void` function that writes numbers to
    the screen with the digits written vertically, so that, for example, 1984 would
    be written as


    +   - 1

    9

    8

    4'
