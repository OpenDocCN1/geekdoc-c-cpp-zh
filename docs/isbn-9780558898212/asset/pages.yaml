  md: 'connected to an output stream called out_stream, you can use these same commands
    to ensure that numbers with a decimal point will be written in the way we normally
    write amounts of money. Just insert the following in your program:


    ```

    out_stream.setf(ios::fixed);

    out_stream.setf(ios::showpoint);

    out_stream.precision(2);

    ```


    To explain this magic formula, we will consider the instructions in reverse order.


    Every output stream has a member function named precision. When your program executes
    a call to precision as the previous one for your out_stream, then from that point
    in your program, any number with a decimal point that is output to two digits
    after the decimal point, depending on when your compiler was written. The following
    is some possible output from a compiler that sets two significant digits:


    ```

    23. 2.2e7 2.2 6.9e-1 0.0069

    ```


    The following is some possible output from a compiler that sets two digits after
    the decimal point:


    ```

    23.56 2.26e7 2.21 0.69 0.69e-4

    ```


    In this book, we assume the compiler sets two digits after the decimal point.
    If your program has another output stream named out_stream_two, then the call
    to out_stream.precision affects the output to the out_stream but has no effect
    on the stream out_stream_two. Of course, you can also call precision with the
    stream out_stream_two, you can even specify a different number of digits for the
    numbers output to the stream out_stream_two, as in the following:


    ```

    out_stream_two.precision(3);

    ```


    The other formatting instructions in our magic formula are more complicated than
    the member function precision. We now discuss other instructions. The following
    are two calls to the member function setf with the out_stream as the calling object:


    ```

    out_stream.setf(ios::fixed);

    out_stream.setf(ios::showpoint);

    ```


    setf is an abbreviation for flags. A flag is an instruction to do something in
    one of two possible ways. If a flag is given as an argument to setf, then the
    flag tells the computer to write output to that stream in some specific way. What
    it causes the stream to depends on the flag.'
