  md: 'When the only postcondition is a description of the value returned, programmers
    often omit the word postcondition. A common and acceptable alternative for the
    previous function declaration comments is the following:


    Another example of precond and postconditions is given by the following function
    declaration:


    ```

    void post_interest(double& balance, double rate);

    //Precondition: balance is a nonnegative savings

    //account balance. rate is the interest rate

    //expressed as a percent, such as 5%.

    //Postcondition: The value of balance has been

    //increased by rate percent.

    ```


    You do not need to know the definition of the function post_interest to use this
    function, so we have given only the function declaration and accompanying comments.


    Preconditions and postconditions are more than a way to summarize a function''s
    actions. They should be the first step in designing and writing a function. When
    you design a program, you should specify what each function does before you design
    how the function will do it. In particular, the function declaration comments
    and the function declaration should be designed and written down before starting
    to design the function body. If you later discover that your specification cannot
    be realized in a reasonable way, you may need to go back and rethink what the
    function should do, by clearly specifying what you should do, you will minimize
    design errors and wasted writing code that does not fit the task at hand.


    Some programmers prefer to use the words precondition and postcondition in their
    function comments. However, whether you use the words or not, your function comment
    should always contain the precondition and postcondition information.


    # CASE STUDY Supermarket Pricing


    This case study solves a very simple programming task. It may seem that it contains
    more detail than needed for such a simple task. However, if you see the design
    elements in the context of a simple task, you can concentrate on learning them
    without the distraction of any side issues. Once you learn the techniques that
    are illustrated in this simple case study, you can apply these techniques to much
    more complicated programming tasks.'
