  md: '> There was a most ingenious Architect who had contrived a new method for building
    Houses, by beginning at the Roof, and working downward to the Foundation.

    JONATHAN SWIFT, Gulliver''s Travels


    # INTRODUCTION


    A program can be thought of consisting of subparts, such as obtaining the input
    data, calculating the output data, and displaying the output data. C++, like most
    programming languages, has facilities to name and conquer each of these subparts
    separately. In C++ these subparts are called *functions*. In this chapter we present
    the basic syntax for one of the two main kinds of C++ functions—namely those designed
    to conquer a single value. We also discuss how these functions aid in program
    design. We begin with a discussion of a fundamental design principle.


    # TOP-DOWN DESIGN


    Remember that the way to write a program is to first design the method that the
    program will use and to write out method in English, as if the instructions were
    followed by a human clerk. This set of instructions is called an *algorithm*.
    A good plan of attack for designing the algorithm is to break down the task into
    smaller subtasks, decompose each of these subtasks into subtasks so small that
    they are trivial to implement in C++. This method is called *top-down design*.
