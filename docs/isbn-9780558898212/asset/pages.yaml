    # Stacks for Recursion


    In order to keep track of recursion, and a number of other things, most computer
    systems make use of a structure called a stack. A stack is a very specialized
    kind of memory structure that is analogous to a stack of paper. In this analogy
    there is an inexhaustible supply of extra blank sheets of paper. To place some
    information in the stack, it is written on one of these sheets of paper and placed
    on top of the stack. To place more information in, a clean sheet of paper is taken,
    the information is written on it, and this new sheet of paper is placed on top
    of the stack. In this straightforward way and more information may be placed on
    the stack.


    Getting information out of the stack is also accomplished by a very simple procedure.
    The top sheet of paper can be read, and when it is no longer needed, it is thrown
    away. There is one complication: only the top of the stack two sheets must be
    thrown away. Since the last sheet that is on the stack is the first one off-the-stack,
    and first-out, a stack is often called a last-in/first-out (LIFO) memory structure.


    Using a stack, the computer can easily keep track of recursion. Whenever a function
    is called, a new sheet of paper is put onto this sheet of paper, and the arguments
    are plugged in for the function parameters. The computer starts to execute the
    body of the function definition. When it encounters a recursive call, it stops
    the computation it is doing on that sheet in order to compute the recursive call.
    But before computing the recursive call, it saves enough information so that,
    when it does finally complete the recursive call, it can continue the stopped
    computation. Saved information is written on a sheet of paper and placed on the
    stack. A new sheet of paper is used for the recursive call. The computer writes
    a second copy of the function'
