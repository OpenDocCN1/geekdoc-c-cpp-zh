    4. Print currents.\n\nIn step 1 we read the information necessary to specify the\
    \ circuit values, and in step 2 we use this information to specify the coefficients\
    \ for the system of equations. Then, in step 3, we develop the details of the\
    \ elimination and back-substitution steps. To keep the main function short and\
    \ readable, functions are used for both the elimination and the back substitution.\n\
    \nThe coefficients of the simultaneous equations are stored in a two-dimensional\
    \ array; the solution is stored in a one-dimensional array. The variable index\
    \ indicates which variable is being eliminated in the elimination function; this\
    \ variable ranges from 0 to $n-1$ to match the subscripting in C++.\n\nThe algorithm\
    \ for Gauss elimination is a difficult algorithm to describe in pseudocode because\
    \ of the detailed description that must be specified. Go through this pseudocode\
