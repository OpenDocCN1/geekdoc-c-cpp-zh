    # ENGINEERING CHALLENGE:

    Data Collection


    Weather balloons are used to collect data from the upper atmosphere. The balloons
    are filled with helium and rise to an equilibrium point where the difference between
    the densities of the helium inside the balloon and the air outside the balloon
    is just enough to support the weight of the balloon. During the day, the sun warms
    the balloon, causing it to rise to a new equilibrium point; in the evening, the
    balloon cools, and it descends to a lower altitude. The balloon can be used to
    measure the temperature, pressure, humidity, chemical concentrations, or other
    properties of the air around the balloon. A weather balloon may stay aloft for
    only a few hours or as long as several years collecting environmental data. The
    balloon falls back to earth as the helium leaks out or is released.'
