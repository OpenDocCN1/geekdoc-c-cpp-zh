    # ENGINEERING CHALLENGE:

    Hricane Tracking


    Tropical storms with very strong winds and heavy rains are called hurricanes in
    North and South America. (They are called typhoons in the western North Pacific
    Ocean, and cyclones in the Indian Ocean.) These tropical storms, or cyclones,
    are low-pressure cells that typically form in the summer and early fall. The large
    rotating air masses are easily seen on satellite images, and the storms are carefully
    tracked because of the potential for damage in populated areas. If the winds in
    a storm are between 38 and 74 miles per hour, it called a tropical storm; if the
    winds exceeds 74 miles per hour, the storm is a tropical cyclone, or hurricane.
    The Saffir-Simpson scale [x] defines categories of hurricane intensity based on
    the wind speed. A category 1 hurricane contains winds from 74–95 miles per hour,
    and causes minimal damage. A category 5 hurricane contains winds above 155 miles
    per hour, and causes catastrophic damage. In this chapter, we analyze hurricane
    data for the strongest hurricanes in the last 50 years.'
