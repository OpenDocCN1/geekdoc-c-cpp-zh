    defined to specify the number of rows and the number of columns in the original
    matrix; these symbolic constants are ROWS and NCOLS. Note that the function does
    not return a value, hence, the return type is void. Note also that the symbolic
    constants ROWS and NCOLS must be defined in a program that uses this function:'
