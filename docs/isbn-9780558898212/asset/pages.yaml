    # Problem Solving Applied: Freezing Temperature of Seawater


    In this section, we use the new statements presented in this chapter along linear
    interpo-lation to solve a problem related to the salinity of seawater.


    Recall from the chapter opening discussion that the salinity of seawater is a
    measure of the amount of dissolved material in the seawater. Salinity varies from
    one location to another in the ocean, but typically falls in the range of 33 to
    38 parts per thousand (ppt), or a percentage of 3.3 to 3.8.


    Salinity is often measured using an instrument that measures the electrical conduct-ity
    of the water, the more dissolved materials in the water, the more it conducts
    electricity. Measurements of salinity are especially important in colder regions
    because the temperature at which seawater freezes is dependent upon its salinity.
    The higher the salinity, the lower the tem-perature at which seawater freezes.
    The following table contains a set of salinity measurements and corresponding
    freezing temperatures; the values are also plotted in Figure 6


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_78_1.png)


    Figure 6 Freezing temperature of seawater.'
