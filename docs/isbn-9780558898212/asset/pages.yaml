  md: '# 1. PROBLEM STATEMENT


    The first step is to state the problem clearly. It is extremely important to give
    a clear, concise problem statement to avoid any misunderstandings. For this example,
    the problem statement is the following:

    Compute the straight-line distance between two points in a plane.


    # 2. INPUT/OUTPUT DESCRIPTION


    The second step is to describe the information, or data values, that are required
    to solve the problem and then identify the values that need to be computed for
    the final solution. Each of these values will be represented by an object in a
    C++ program. These objects represent the input and the output for the problem,
    and collectively can be called input/output, or I/O. For many problems, a diagram
    that shows the input and output is useful. At this point, the program is an "abstraction"
    because we are not defining the steps to determine the output; instead, we are
    only showing the information that is required to compute the desired output.

    The I/O diagram for this example follows.


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_34_0.png)


    # 3. HAND EXAMPLE


    The third step is to work the problem by hand or with a calculator, using a simple
    set of data. This is a very important step and should not be skipped even for
    simple problems. This is the step in which you work out the details of the problem
    solution. If you cannot take a simple set of numbers and compute the output (either
    by hand or with a calculator), then you are not ready to move on to the next step;
    you should reread the problem, and perhaps consult reference material. The solution
    by hand for this specific example follows:


    Let the points p1 and p2 have the following coordinates:

    p1 = (1, 5); p2 = (4, 7)


    We want to compute the distance between the two points, which is the hypotenuse
    of a right triangle, as shown in Figure 5. Using the Pythagorean theorem, we can
    compute the distance with the following equation:


    ```

    distance = √((side1)² + (side2)²)

    = √((4-1)² + (7-5)²)

    = √13

    ```


    3.61'
