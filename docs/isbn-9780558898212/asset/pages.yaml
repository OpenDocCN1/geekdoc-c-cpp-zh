  md: '# Introduction to Computing and Engineering Problem Solving


    # 7


    Their work resulted in the development of the ENIAC (Electronic Numerical Integrator
    and Calculator). The ENIAC weighed thirty tons and could calculate several hundred
    operations per second. It was used for research until 1955. Today, processors
    weigh ounces and are capable of processing trillions of operations per second.


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_14_0.png)


    # Recent Engineering Achievements


    The development of the digital computer has facilitated many significant engineering
    achievements over the past 5 decades. These achievements illustrate the multidisciplinary
    nature of engineering and demonstrate how engineering has improved our lives and
    expanded the possibilities for the future. We now briefly discuss a few of these
    major achievements.


    The moon landing: on July 21, 1969, mankind first landed on the moon, which was
    perhaps the most complex engineering project ever attempted. Major breakthroughs
    were required in the design of the Apollo spacecraft, the lunar lander, and the
    three-stage Saturn V rocket. Even the design of the spacecraft a major engineering
    project resulted in a system that had a three-piece suit and backpack, which together
    weighed 190 pounds. The computer played a key role not only in the designs of
    the various systems, but also played a critical role in the communications required
    during an individual moon flight; a single flight required the coordination of
    over 450 people in the launch control center and over 7,000 on 9 ships, in 54
    aircraft, and at stations located around the earth.


    Exploration of space has motivated recent engineering achievements in the collection
    of scientific data. The Mars Global Surveyor was a spacecraft that was developed
    by NASA and launched in 1996 to collect scientific data while in orbit around
    the planet Mars. The Mars Global Surveyor carried state of the art instruments
    including the Mars Orbiter Camera for acquiring images and the High Gain Antenna
    for sending and receiving data at high rates of speed. The spacecraft made its
    last communication with earth on'
