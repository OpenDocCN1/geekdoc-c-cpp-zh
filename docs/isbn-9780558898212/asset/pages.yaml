  md: '# Procedural Abstraction Functions That Return a Value


    Whenever a subtask takes some values, such as some numbers, and returns a single
    value, it is natural to implement the subtask as a function. Whenever two or more
    subtasks perform the same computation, they can be implemented as same function
    called with different arguments it is used. We therefore decide to use a function
    called unitprice to compute the price per inch of a pizza. The function declaration
    and explanatory comment for this function will be as:


