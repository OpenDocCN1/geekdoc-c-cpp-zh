    **Gauss Elimination.** The accuracy of the Gauss elimination can be improved by
    a process called pivoting. To perform row pivoting, we first reorder the equations
    so that the equation with the largest absolute value for the first coefficient
    is the first equation. We then eliminate the first object from the equations that
    follow the first equation. Then, starting with the second equation, we reorder
    the equations such that the second equation has the largest coefficient (absolute
    value) for the second object. We then eliminate the second object from all equations
    after the second equation. The process continues similarly for the rest of the
    objects. Assume that a symbolic N contains the number of equations.


