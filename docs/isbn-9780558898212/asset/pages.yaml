    parameter names with _par so that it will be easier for us to distinguish them
    from other items in a program. Notice that a function declaration ends with a
    semicolon.


    The first word in a function declaration specifies the type of the value returned
    by the function. Thus, for the function total_cost, the type of the value returned
    is double.


