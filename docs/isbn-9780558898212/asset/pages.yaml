    | 1 | 3,951.88 | 0.94 |

    | 2 | 6,994.08 | 0.76 |

    | 3 | 9,414.28 | 0.59 |

    | 4 | 11,277.28 | 0.45 |

    | 5 | 12,645.00 | 0.32 |


    We can also determine the maximum altitude for this table, which is 12,645.00
    meters; it occurred at 5 hours.


    # ALGORITHM DEVELOPMENT


    We first develop the decomposition outline because it breaks the solution into
    a series of sequential steps.


    # Decomposition Outline


    +   1. Get user input to specify times for the table.

    2. Generate and print conversion table and find maximum height and corresponding
    time.

    3. Print maximum height and corresponding time.


    The second step in the decomposition outline represents a loop in which we generate
    the table and, at the same time, keep track of the maximum height. As we refine
    this outline, and particularly step 2 into more detail, we need to think carefully
    about finding the maximum height. Look back at the hand example. Once the table
