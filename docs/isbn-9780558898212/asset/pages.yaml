    material in the seawater. Chlorine represents about 55% of the constituents in
    seawater, where sodium is about 30.6%. The remaining primary constituents are
    sulfate (7.7%), magnesium (3.7%), calcium (1.2%), and potassium (1.1). Salinity
    varies from one location to another in the ocean, which typically falls in the
    range of 33 to 38 parts per thousand (ppt), or a percentage of 3.3 to 3.8. Salinity
