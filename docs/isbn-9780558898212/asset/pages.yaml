  md: '# A Closer Look at Recursion


    The definition of the function write_vertical uses recursion. We did nothing new
    or different in evaluating the function call write_vertical (123). We treated
    it just like any of the function calls we saw in previous chapters. We just substituted
    the argument 123 for the parameter n and then executed the code in the body of
    the function definition. When we reached the recursive call


    ```

    write_vertical(123 / 10);

    ```


    we simply repeated keeps track of recursive calls in the following way. When a
    function is called, the computer pulls the arguments for the parameter(s) and
    begins to execute the code. If it should encounter a recursive call, then it temporarily
    stops its computation. This is it must know the result of the recursive call before
    it can proceed. It saves all the information it needs to continue the computation
    later on, and proceeds to evaluate the recursive call. When the recursive call
    is completed, the computer returns to the outer computation.


    The language places no restrictions on how recursive calls are used in functions.
    However, in order for a recursive function definition to be useful, it must be
    designed so that any of the function must terminate with some code that does not
    depend on recursion. The function may call itself, and recursive call may call
    the function again. The process may be repeated any number of times. However,
    the process will not terminate unless one of the recursive calls does not depend
    on recursion. The general outline of a successful recursive function definition
    is as follows:


    +   - One or more cases in which the function accomplishes its task using recursive
    calls to accomplish one or smaller versions of the task.

    - One or more cases in which the function accomplishes its task without the use
    of recursive calls. These cases without any recursive calls are called base cases
    or stopping.


    Often if-else statement determines which of the cases will be executed. A typical
    scenario is for the original function to execute a case that includes a recursive
    call. That recursive call may turn into case that requires another recursive call.
    For some number of times each recursive call produces another recursive call,
    but eventually one of the stopping cases should apply. Every call of the function
    must eventually lead to a stopping case, or the function will never end because
    a call that includes an infinite chain of recursive calls will usually terminate
    abnormally rather than actually running forever.


    The most common way to ensure that a stopping case is reached is to write the
    function so that some (positive) numeric quantity is decreased by each recursive
    call and to provide a stopping case for "small" value.'
