  md: '# Introduction to Computing Engineering Problem Solving


    **Example** Convert $12.25_{10}$ to binary.


    First, the integral part, $12_{10}$ is converted to binary:


    ```

    0 R1

    2/1 R1

    2/3 R0

    2/6 R0

    2/12 = 1100

    ```


    Next we will convert the fractional part, $.25_{10}$ to binary by repeatedly multiplying
    the fractional part by 2 and recording the carry bits:


    ```

    .25 * 2 = 0.5 C0

    .5 * 2 = 1.0 C1

    ```


    The integral and fraction parts are now combined to form the equivalent binary
    value. Thus, the value $12.25_{10} = 1100.01_2$.


    To convert the floating point number $1100.01_2$ back to decimal, the binary digits
    to the right of the decimal point are multiplied by negative powers of 2, as shown
    below:


    ```

    $1*2^{-1} + 1*2^{-2} + 0*2^{-3} + 0*2^{-4} + 0*2^{-5} + 1*2^{-6} =

    $1*8 + 1*4 + 0*2 + 0*1 + 0*(1/2) + 1*(1/4) =

    $1.25$

    ```


    $1100.01_2 = 12.25_{10}$


    In this example, we found an exact binary representation for the value $12.25_{10}$.
    Unfortunately, many floating decimals have only an approximate binary representation,
    as illustrated in the next example.


    **Example** Convert $12.6_{10}$ to binary.


