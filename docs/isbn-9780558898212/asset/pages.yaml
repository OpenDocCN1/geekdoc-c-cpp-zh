    # Function Definition–Syntax Summary


    Function declarations are normally placed before the main part of your program
    and function definitions are normally placed after the main part of your program
    (or, as we will later in this book, in a separate file). Display 6 gives a summary
    of the syntax for a function declaration and definition. There is actually a bit
    more freedom than that display indicates. The declarations and executable statements
    in the function definition can be intermixed, as long as each variable is declared
    before it is used. The rules about intermixing declarations and statements in
    a function definition are the same as they are for the main part of a program.
    Unless you have reason to do otherwise, it is best to place the declarations first,
    as indicated in Display 6.


    Since a function does not return a value until it executes a return statement,
    a function must contain one or more return statements in the body of the function.
    The function may contain more than one return statement. For example, the code
    of an if statement might contain an else statement, and each branch might contain
    different return statement, illustrated in Display 5.


    A reasonable pattern of spaces and line breaks in a function definition will be
    accepted by the compiler. However, you should use the same rules for indenting
    and laying out a function as you use for the main part of a program. In particular,
    notice the placement of braces {} in our function definitions and in Display 6.
    The opening and closing braces that mark the ends of the function body are each
    placed on a line by themselves. This sets off the function body.


