    parameters that can easily be converted into sequential parameters. For example,
    suppose that a set of data representing temperature measurements is taken from
    the floor of a large chemical reaction chamber. Furthermore, this set of temperatures
    is taken at specific intervals of time during a chemical reaction. In this case,
    we might choose to use a three-dimensional array, using the first offset to specify
    a specific time, and the other two offset to indicate the location within the
    floor. The offsets [3][2][5] would then specify the value taken at the fourth
    time value and at position [2][5] in the grid of temperatures.


    Arrays with more than three offsets are seldom used because it is difficult to
    visualize them. However, a simple way to visualize arrays with more than three
    offsets is to consider a building. The building has floors and a rectangular grid
    of rooms on each floor. Assume that each room can contain a single value. The
    three-dimensional array representing the building uses three offsets to specify
    a room; the first offset is the floor number, and the other two offsets specify
    the row and column number of the room on the specified floor.


    A four-dimensional array is a row of buildings, as shown in Figure 6. The first
    offset specifies the building, and the remaining three offsets specify the room
    in the building.


    A five-dimensional array is a block of buildings, as shown in Figure 7. The first
    two offsets specify the building in the block, and the remaining three offsets
    specify the room in the building.


    This analogy could continue with a row of blocks, a city of blocks, a group of
    cities, a state of cities, and so on. Although we have shown you how to visualize
    higher dimensional arrays, we also want to caution you about using higher order
    arrays. Higher order arrays are


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_481_1.png)


    Figure 7 Five-dimensional array.'
