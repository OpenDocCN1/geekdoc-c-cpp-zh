    Suppose that we have a decimal number that we wish to represent in base 2. The
    equivalent binary number will be a sequence of binary digits. To generate these
    digits, we will use a conversion algorithm that repeatedly divides the decimal
    number by 2, and records the remainder of each division as a successive digit
    of the binary number.


    We illustrate the use of the algorithm in the example below. Note that the remainder
    of the first division is recorded as the least significant digit (LSD) of the
    equivalent binary number, the remainder of the last division is recorded as the
    most significant digit (MSD), and we divide until the quotient becomes zero.


    Example


    | Quotient is 0 |

    |---||

    | 0 R | MSD |

    | 2^1 R |

    | 2^3 R |

    | 2^7 R |

    | 2^15 R |

    | 2^30 R |

    | 2^61 R | LSD |

    | 2^122 | First Division |


    $245_{10} = 11110101_2$.


    The above conversion algorithm can be used to convert from base 10 to any other
    base. The base of the other number system defines the divisor, as we will see
    in the following sections.


    Octal Numbers. The octal, or base 8, number system has 8 octal digits, (0–7).
    Octal numbers are useful for understanding 8 bit character codes, and for setting
    permissions on files and directories on a linux/unix platform. For example, if
    we have a file that we want to be readable, writable, and executable by everyone,
    we can use the chmod command to set the permissions on the file as:


    ```

    chmod 777 aFile

    ```


    Permissions for aFile will be set to 78, or 112 for the owner, the group and the
    world. If we need a long listing,


    ```

    ls -l

    ```


    we will see something like the following:


    ```

    -rwxr-xr- 1 janeinei janeinei 258 Jun 26 12:27 aFile.

    ```


    The above indicates that r(read)w(write)x(execute) permission is granted to the
    owner, the group and the world. If we wish to grant only read-only status to the
    group and the world, we can change the permissions with the following command:


    ```

    chmod 744 aFile

    ```


    A long listing will now display the following:


    ```

    -rw-r--r-- 1 janeinei janeinei 258 Jun 26 12:27 aFile

    ```'
