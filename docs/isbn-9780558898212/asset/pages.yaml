    # 5 GENERAL DEBUGGING TECHNIQUES


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_332_0.png)


    Video Note Debugging


    Careful testing through the use of stubs and drivers can detect a large number
    of bugs that may exist in a program. However, examination of the code and the
    output of test cases may be insufficient to track down many logic errors. In this
    case, there are a number of general debugging techniques that you may employ.


    # Keep an Open Mind


    Examine the system as a whole and do not assume that the bug occurs in one particular
    place. If the program is giving incorrect output values then you should examine
    the source code, different test cases for the input and output values, and the
    logic behind the algorithm itself. For example, consider the code to determine
    price for the supermarket example in Display 9. If the wrong price is displayed,
    the error might simply be that the input values were different from those you
    were expecting in this test case, leading to an apparently incorrect program.'
