    # Computer Software


    Computer software contains the instructions or commands that we want the computer
    to perform. There are several important categories of software, which include
    operating systems, software tools, and language compilers. Figure 2 illustrates
    the interaction between these categories of software and the computer hardware.
    We now discuss each of these software categories in more detail.


    operating systems


    Operating Systems. Some software, such as the operating system, typically comes
    with the computer hardware when it is purchased. The operating system provides
    an interface between you (the user) and the hardware by providing a convenient
    and efficient environment in which you can select and execute the software on
    your system.


    Operating systems also contain a group of programs called utilities that allow
    you to perform functions such as printing files, copying files, and listing the
    files that you have saved on file system. Whereas these utilities are common to
    most operating systems, the environment for executing commands varies from operating
    system to operating system. For example, to list your files with UNIX (a powerful
    operating system frequently used with workstations), or Linux (UNIX for PCs) from
    the command line is ls. Some operating systems simplify the interface'
