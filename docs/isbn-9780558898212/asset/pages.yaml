    # 5 Problem Solving: Weather Balloons


    Weather balloons are used to gather temperature and pressure at various altitudes
    in the atmosphere. The balloon rises because the density of the helium in the
    balloon is less than the density of the air outside the balloon. As the balloon
    rises, the surrounding air becomes less dense, and the balloon''s acceleration
    slows until it reaches a point of equilibrium. During the day, sunlight warms
    the helium trapped inside the balloon, which causes the balloon to expand and
    become less and rise higher. During the night, the helium in the balloons cools
    dense and becomes more dense, causing the balloon to descend to a lower altitude.
    The next day, the sun heats the helium again and the balloon rises. Over time,
    this process generates a set of altitude measurements that can be approximated
    with a polynomial equation.


    Assume that the polynomial h(t) = -0.12t^4 + 12t^3 - 380t^2 + 4100t + 220, where
    t is in hours, represents the altitude or height in meters during the first 48
    hours following the launch of a weather balloon. The corresponding polynomial
    model for the velocity in meters per hour is v(t) = -760t + 4100.


    Print the altitude and the velocity for this weather balloon using units of meters
    and meters per second. The user enter the start time, increment in time between
    lines of table, and ending time, where all the time values must be less than 48
    hours. In addition to printing the table, also the peak altitude and its corresponding
    time.


