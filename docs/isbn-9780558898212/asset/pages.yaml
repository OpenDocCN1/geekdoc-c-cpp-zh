  md: "To determine the peaks, we compare a potential peak with its four neighboring\
    \ points.\nIf all four neighboring points are less than the potential peak, then\
    \ the potential peak is a real peak. Note that the points on the edges of the\
    \ array or grid cannot be potential peaks\nbecause we do not have elevation information\
    \ on all four sides of the points.\n\n# 4. ALGORITHM DEVELOPMENT\n\nWe first develop\
    \ the decomposition outline because it divides the solution into a series of\n\
    sequential steps:\n\nDecomposition Outline\n\n+   1. Read the terrain data into\
    \ an array.\n2. Determine and print the location of the peaks.\n\nStep 1 involves\
    \ reading the data file and storing the information in a two-dimensional\n. Step\
    \ 2 is a loop that evaluates all potential peaks and prints their locations if\
    \ they\nare determined to be real peaks. We will write a boolean function to determine\
    \ whether a\nlocation is a peak.\n\nRefinement in Pseudocode\n\n```\nmain: read\
    \ nrows ncols from the data file\n      read the terrain data into an array\n\
    \      set i to 0\n      while i < nrows -\n        set j to 0\n        while\
    \ j < ncols -\n          if (ispeak(grid[i,j]))\n            print peak location\n\
    \          increment j by 1\n      increment i by 1\n\npeak:\n  if ((grid[i-1][j]<grid[i][j])\
