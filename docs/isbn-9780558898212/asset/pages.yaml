    # Data Types and Storage


    When data is represented in memory, it is represented as a sequence of bits. The
    sequence of bits may represent an instruction, a numeric value, a character, a
    portion of an image or digital signal, or some other type of data. If we look
    at the binary 010001102, for example, it has a decimal value of 70. It is also
    the American Standard Institute (ANSI) character code for the character F.


    Data representation is an increasingly important and interesting field in engineering,
    math and computer science. The amount of data that can be generated and processed
    is increasing as computers become more powerful, and the use of data in integers
    applications such as bio-computing, communications and signal processing present
    new challenges for defining and representing data. We discuss the digital representation
    of two basic data types, integer and floating point.


    Integer Data Type. In the previous section, we used an algorithm to convert from
    base 10 to base 2. This algorithm works for any base 10, so in theory we can represent,
    exactly all base 10 integers in base 2. In practice, we may be limited by the
    size of our computer system. Integer data is stored in memory using 4 bytes, or
    32 bits. The left most bit is for the sign, leaving 31 bits for the magnitude
    of the number.


    Consider the example that uses a word size of 8 for simplicity. The largest signed
    integer that can be represented in 8 bits is 2^7 - 1 = 127₁₀, as illustrated below.


    ```

    01111111

    ```


    The representation of data in a digital computer affects the efficiency of arithmetic
    and logic operations. Many computer systems store positive signed integers as
    illustrated above, and store negative integers in their 2''s complement form allows
    for efficient execution of arithmetic operations, without checking the sign bit.
    First, we illustrate how to form the 2''s complement of a negative number, then
    we will illustrate how storing negative numbers in their 2''s complement form
    can simplify arithmetic operations.


    The 2''s complement of a binary number is formed by negating all of the bits and
    adding one. A negative bit matches the value, or of a bit from 1 to 0, or from
    0 to 1. Negating all the bits of a binary number results in the 1''s complement
    of the number. Adding one to the 1''s complement results in the 2'' complement
    of the number. Using a word size of 8, the 2''s complement of -127₁₀ is computed
    in the following example.


    Example Compute the 2''s complement representation for the value -127₁₀.

    127₁₀ = 01111111.

    To form the 2''s complement of a negative integer, we begin with the binary representation
    of the unsigned value.


    Next, we negate the bits to form the 1''s complement.

    10000000₂.'
