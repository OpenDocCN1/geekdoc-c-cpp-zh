    # INTRODUCTION


    You have encountered a few cases of circular definitions that worked out satisfactorily.
    The most prominent examples are the definitions of certain C++ statements. For
    example, the definition of a *while* statement says that it can contain other
    (smaller) statements. Since one of the possibilities for these smaller statements
    is another *while* statement, there is a kind of circularity in that definition.
    The definition of the while statement, if written out in detail, will contain
    a reference to while statements. In mathematics, this kind of circular definition
    is called a recursive definition. In C++ a function may be defined in terms of
    itself the same way. To put it more precisely, a function may contain a call to
    itself. In such cases the function is said to be recursive. This chapter discusses
    recursion in C++ and more generally discusses recursion as a programming and problem-solving
    technique.'
