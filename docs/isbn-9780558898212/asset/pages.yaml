  md: '# Introduction to Computing and Engineering Problem Solving


    # Computing Systems


    We begin our presentation of C++, a brief discussion of computing systems will
    be useful. A computing system is a complete, working system. The system includes
    not only a computer, but also software and peripheral devices. A computer is a
    machine that is designed to perform operations that are specified with a set of
    instructions called. Computer hardware refers to the physical parts of the system
    that have mass and can be actually touched. Hardware includes the computer and
    peripheral devices such as the keyboard, the mouse, the display disk, the pen,
    and the ink.


    Computer software refers to programs that reside and run electronically on the
    hardware such as compilers, operating systems, and application programs. Software
    provides a human computer interface (HCI) and defines the operations that a computer
    will perform.


    # Computer Hardware


    Recall Menabrea''s description of Babbage''s Analytical Engine as a machine capable
    of solving any problem using inputs, outputs, and programs written on punch cards.
    In 1946, John von Neumann proposed a computing model as shown in Figure 1 that
    is still used today in the design of most digital computers. In von Neumann''s
    model, we see an input device, an output device, a memory unit, and a machine
    that consists of a control unit and an arithmetic logic unit (ALU) with an accumulator
    unit. The memory unit controls the transfer and processing of data. The unit retrieves
    and interprets instructions stored in memory data from an input device such as
    a keyboard or a mouse, stores data to a specified output device such as a printer
    or a display, and stores data in the memory unit.


    Suppose that we wrote a program to instruct a computer to add two values and display
    the result. The control will interpret the executable instructions and send data
    to the ALU. The ALU will perform the addition and send result to the output device.
    Together the control unit and the ALU are referred to as the Central Processing
    Unit or CPU. The accumulator in the ALU is a collection of high-speed registers
    for the temporary storage of values and results of arithmetic and logic operations.
    The time required to access the memory unit is large compared to the time required
    by the ALU to perform an arithmetic or logic operation. Thus, the use of registers
    within the ALU increases the overall speed of an


    | MEMORY | ARITHMETIC LOGIC UNIT |

    | --- | --- |

    | CONTROL UNIT | accumulator |

    | INPUT | OUTPUT | |


    Figure 1 von Neumann computing model.'
