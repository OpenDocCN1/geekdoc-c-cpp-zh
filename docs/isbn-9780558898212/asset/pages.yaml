  md: '# Appendix ASCII Character Codes


    The following table contains the 128 ASCII characters and their equivalent integer
    values and binary values. The characters that correspond to the integers 1 through
    31 have special significance to the computer system. For example, the character
    BEL is represented by the integer 7 and causes the bell to sound on the keyboard.

    The order of the characters from low to high is the collating sequence and has
    several interesting characteristics. Note that the digits are less than uppercase
    letters and uppercase letters are less than lowercase letters. Also, note that
    special characters are not grouped together. Some are before digits, some are
    after digits, and some are between uppercase and lowercase characters.


