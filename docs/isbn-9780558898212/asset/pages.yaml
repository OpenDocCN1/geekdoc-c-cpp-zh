    # The Black Box Analogy


    A person who uses a program should not need to know the details of how the program
    is coded. Imagine how miserable your life would be if you had to know and remember
    the code for the compiler you use. A program has a job to do, so as to compile
    your program or check the spelling of words in your paper. You need do not (or
    at least should) need to know how the program does its job. A function is a small
    program and should be used in a similar way. A programmer who uses a function
    needs to know what the function does (such as calculate a square root or convert
    a temperature from degrees Fahrenheit to Celsius), but does not need to know how
    the function accomplishes its task. This is often referred to lasting the function
    as a black box.


    Calling something a black box is a figure of speech intended to convey the mechanism
    of a physical device that you know how to use whose operation is a mystery, because
    it is enclosed in a black box and you cannot see inside (and cannot it!). If a
    function is well designed, the programmer can use the function as if it were a
    black box. All the programmer needs to know is if he or she puts appropriate arguments
    into the black box, then an appropriate returned value will come out of the black
    box. Designing a function so that it can be used as a black box is sometimes called


