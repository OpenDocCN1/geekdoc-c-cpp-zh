  md: "# Recursion\n\n# Efficiency\n\nThe binary search algorithm is extremely fast\
    \ compared to an algorithm that simply tries all array elements in order. In the\
    \ binary search, you eliminate about half the array from consideration right at\
    \ the start. You eliminate a quarter, then an eighth of the array, and so forth.\
    \ These savings add up to a dramatically fast algorithm. For an array of 100 elements,\
    \ the binary search will never need to compare more than seven elements to the\
    \ key. A simple search could compare as many as 100 elements to the key and on\
    \ the average will compare about 50 array elements to the key. Moreover, the larger\
    \ the array, the more dramatic the savings will be. On an array with 1,000 elements,\
    \ the binary search will only need to compare about 10 array elements to the key,\
    \ as compared to an average of 500 for the simple search algorithm.\n\niterative\
    \ version\n\nAn iterative version of the function search is given in 500 on some\
    \ systems the iterative version will run more efficiently than the recursive version.\
    \ The algorithm for the iterative version was derived by mirroring the recursive\
    \ version. In the iterative version, the local variables first and last mirror\
    \ the roles of the parameters in the recursive version, which are also named first\
    \ and last. As this example illustrates, it often makes sense to derive a recursive\
    \ algorithm even if you expect to later convert it to an iterative algorithm.\n\
    \n# PROGRAMMING A Recursive Member Function\n\nA member of a class can be recursive.\
    \ Member functions can use recursion in the same way that ordinary functions do.\
    \ Display 9 contains an example of a recursive member function. In the class Account\
    \ used in that display, we have overloaded the member function name update. The\
    \ first version of update has no arguments and posts one year of simple interest\
    \ to the bank account balance. The other (new) version of update takes an int\
    \ argument posting the interest for that many years. The new version of update\
    \ has one parameter, called years, and uses the following algorithm:\n\n```\n\
    if the number of years is 1, then //Stopping case:\n    call the other function\
    \ named update (the one with no arguments)\nif the number of years is greater\
    \ than 1, then //Recursive case:\n    make a recursive call to post years - 1\
    \ worth of interest, and then\n    call the other function called update (the\
    \ one with no arguments)\n    post one year's worth of interest.\n```"
