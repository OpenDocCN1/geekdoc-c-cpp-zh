    Floating Data Type. A floating point number or real number, such as $12.25_{10}$
    includes a decimal point. The digits to the left of the decimal point form the
    integral part of the number and the digits to the right of the decimal point form
    the fractional part of a number. The fractional part of a decimal number can be
    converted to binary by repeatedly multiplying the fractional part by 2 and recording
    the **carry bits** until the fractional part becomes zero. This algorithm is illustrated
    in the following example.'
