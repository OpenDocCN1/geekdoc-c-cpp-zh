  md: '# Increment and Decrement Operators


    The C++ language contains unary operators for incrementing and decrementing objects;
    these operators cannot be used with constants or expressions. The increment operator
    ++ and the decrement operator — can be applied in a prefix position (before the
    identifier), as in ++++, or in a postfix position (after the identifier), as in
    count++. If an increment or decrement operator is used in a statement by itself,
    it is equivalent to an assignment statement that increments or decrements the
    object. Thus, the statement


    is equivalent to the statement


    ```

    x++;

    ```


    If the increment or decrement operator is used in an expression, then the expression
    must be evaluated carefully. If the increment or decrement operator is in a prefix
    position, the identifier is modified, and then the new value is used in evaluating
    the rest of the expression. If the increment or decrement operator is in a postfix
    position, the old value of the identifier is used to evaluate the rest of the
    expression, and then the execution of


    ```

    x = ++x - y;

    ```


    is equivalent to the execution of this pair of statements:


    ```

    x = x + 1;

    w = x-- - y;

    ```


    Similarly, the statement


    ```

    x = x++ - y;

    ```


    is equivalent to the pair of statements


    ```

    x = --x - y;

    x = --x + 1;

    ```


    When executing Equation (1) or Equation (2), if we assume that the value of x
    is equal to 6. However, after executing Equation (1), the value of y is equal
    to 3, then the value of w is 3, but after executing Equation (2), the value of
    w is 2.


    The increment and decrement operators have the same precedence as the other operators.
    If several unary operators are in an expression, they are associated from right
    to left. When using postfix notation, the value of the object will be incremented
    by the time the end of the statement is reached. Exactly when the increment occurs
    is system dependent. For this reason, the value of the object being modified is
    not definite from the point at which the operator is applied to the end of the
    statement.


