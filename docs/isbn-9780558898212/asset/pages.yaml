  md: '# Simple C++ Programs


    Preprocessor directives give instructions to the files that are prepared before
    the program is compiled. The most common directive inserts additional statements
    in the program; it contains the characters #include followed by the name of the
    file containing the additional statements. This program contains the following
    two preprocessor directives:


    ```

    #include <iostream>

    #include <cmath>

    ```


    These directives specify statements in the files iostream and cmath should be
    included in place of these two statements before the program is compiled. The
    < > characters around the file names indicate that the files are included with
    the Standard C++ library; this library is contained in the files as an ANSI C++
    compiler. The file iostream contains information related to the output statement
    used in program, and the file cmath contains information related to the function
    used in program to compute the square root of a value. Preprocessor directives
    are generally included after the initial comments describing the program''s purpose.
    The next statement


    using namespace std;


    is called a using directive. The using directive tells the compiler to use the
    library filenames declared in part of the new ANSI Standard++. Some older compilers
    do not support namespaces. If your compiler does not accept the using statement
    then you will need to omit the using namespace std; statement and change the name
    of the files used in the preprocessor directives to the following:


    ```

    #include<iostream.h>

    #include<cmath.h>

    ```


    Older compilers use a h extension for most of their header file names. You will
    see the file math.h included in C programs, as well as C++ programs because math.h
    is the C library file names. The C++ name for math.h is the same as the C with
    the following changes: the h is dropped and the c is added to the beginning of
    the file name. We will use the ANSI Standard C++ names in this.


    Every C++ program contains exactly one block of code called a main function. In
    C++, a block of code is defined by a set of braces, { }. The keyword int indicates
    that the function returns an integer to the operating system. The parentheses
    following main are required because main is a function. In order to easily identify
    the block of code that defines the function, we place the code on lines by themselves.
    Thus, the two lines following the preprocessor directives specify the beginning
    of the main function:


    ```

    int main()

    ```


    The main function contains two types of commands: declarations and statements.
    The declarations define identifiers and allocate memory and therefore must precede
    any statements that reference these identifiers. The declarations may or not give
    initial values to be stored'
