  md: '# Salinity (ppt)


    # Freezing Temperature (degrees F)


    | Salinity (ppt) | Freezing Temperature (degrees F) |

    |---|---|

    | 0 (fresh water) | 32 |

    | 10 | 31.1 |

    | 20 | 30.1 |

    | 24.7 | 29.6 |

    | 30 | 29.1 |

    | 35 | 28.6 |


    Suppose that we would like to use linear interpolation to determine the freezing
    temperature for which we have measured the salinity. Write a program that allows
    the user to enter the data for two points and a salinity measure between those
    points. The program should compute the corresponding freezing temperature.


    # 1. PROBLEM STATEMENT


    Use linear interpolation to compute a new freezing temperature for water with
    a specified salinity.


    # 2. INPUT/OUTPUT DESCRIPTION


    The following diagram shows that the input to the program includes two consecutive
    points $(a, f(a))$ and $(c, f(c))$ and the new salinity measurement $b$. The output
    is the new freezing temperature.


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_79_0.png)


    # 3. HAND EXAMPLE


    Suppose that we want to determine the freezing temperature for water with a salinity
    measurement of 33 ppt. From the data, we see that this point falls between 30
    and 35 ppt:


    | 30 | 29.1 | f(a) |

    |---|---|---|

    | 33 | ? | f(b) |

    | 35 | 28.6 | f(c) |


    Using the linear equation formula, we can compute $f(b)$:


    ```

    f(b) = f(a) + (b-a)/(c-a)*(f(c)-f(a))


    = 29.1 + 3/5*(28.6-29.1)

    ```


    As expected, this value falls between $f(a)$ and $f(c)$.'
