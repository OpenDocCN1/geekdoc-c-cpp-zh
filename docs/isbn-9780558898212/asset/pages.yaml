  md: "# Statistical Measurements\n\nAnalyzing data collected from engiring experiments\
    \ is an important part of evaluating the experiments. This analysis ranges from\
    \ simple computations on the data, such as calculating the average value, to more\
    \ complicated analysis. Many of the computations or measurements using data are\
    \ statistical measurements because they have statistical properties that change\
    \ from one set to another. For example, the size of 60 degrees is an exact value\
    \ that is the same value every time we compute it, but the number of miles to\
    \ the gallon that we get with our car is a statistical measurement because it\
    \ varies somewhat, depending on parameters such as temperature, the speed we travel,\
    \ the type of road, and whether we are in the mountains or the desert.\n\n# Simple\
    \ Analysis\n\nWhen evaluating a set of experimental data, we often compute the\
    \ maximum value, minimum mean or average value, and the median. We develop functions\
    \ that can be used to compute these values using an array input. These functions\
    \ (stored in a file stat_lib.cpp) will be useful in many of the programs that\
    \ we develop later in the text and in solutions to problems at the end of the\
    \ chapters. It is important to note that the functions assume there is at least\
    \ one value in the array. The functions also assume that the array contains double\
    \ values.\n\nMaximum, Minimum. A function for determining the maximum value in\
    \ an array was presented in the previous section; a similar function for determining\
    \ the minimum value presented here:\n\n```\n/* /\n* This function returns the\
    \ minimum */\n* value in an array x with n elements. */\n```\n\n```\ndouble minval(const\
    \ double x[], int n)\n// Declare objects.\ndouble min_x;\n// Determine minimum\
    \ value in the array.\nmin_x = x[0];\nfor (int k=1; k<=n-1; ++k)\n{\n    if (x[k]\
    \ < min_x)\n    min_x = x[k];\n}\n```\n\n```\n// Return minimum value.\nreturn\
    \ min_x;\n```"
