  md: '# I/O Streams as an Introduction to Objects and Classes


    input stream flows from a file, then your program will take its input from that
    file. Similarly, an output stream can go to the screen or to a file.


    Although you may not realize you have already been using streams in your programs,
    cin is an input stream connected to the keyboard, and cout is an output stream
    connected to the screen. These two streams are automatically available to your
    program, as long as it has an input directive that names the file stream. You
    can define other streams that come from or to file objects; once you have defined
    them, you can use them in your program in the same way you use cin and cout.


    For example, suppose your program defines a stream called in_stream that from
    some file. (We''ll tell you how to define it shortly.) You can then fill an int
    variable the_number with a number from this file by using it in the following
    program:


    ```

    int the_number;

    in_stream >> the_number;

    ```


    Similarly, if your program defines an output stream, named out_stream, that goes
    to another file, then you can output the value of this variable to that other
    file. The following will output the string "the_number is " followed by the contents
    of the variable the_number to the output file that is connected to out_stream.


    ```

    out_stream << "the_number is " << the_number << endl;

    ```


    Once the streams are connected to the desired files, your program can do file
    I/O the same way it does I/O using the keyboard and screen.


    # Why Use Files for I/O?


    The input and screen output we have used so far deal with temporary data. When
    the program ends, the data typed in at the keyboard and the data left on the screen
    go. Files provide you with a way to store data permanently. The contents of a
    file remain until a person or program changes the file. If your program sends
    its output to a file, the output will remain after your program has finished.
    An input file can be used over and again by many programs without the need to
    type in the data separately for each program.


    The input and output files used by your program are the same kind of files that
    you read and write with an editor, as the editor you use allows you to write programs.
    This means you can create an input file for your program or read an output file
    produced by your program whenever it''s convenient for you, as opposed to having
    to do all your reading and writing while the program is running.


    Files also provide you with a convenient way to deal with large quantities of
    data. When your program takes its input from a large input file, your program
    receives a lot of data without making the user do lot of typing.'
