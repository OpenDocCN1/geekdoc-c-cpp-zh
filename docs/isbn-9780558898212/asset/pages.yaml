  md: '# # C++ Keywords


    The following keywords should not be used for anything other than their predefined
    names in the C++ language. In particular, do not use them for variable names or
    for programmer-defined functions. In addition to the keywords listed below, identifiers
    containing a double underscore (__) are reserved for use by C++ implementations
    and standard libraries and should not be used in your programs.


    | asm | do | inline | return | typedef |

    | auto | double | int | short | type |

    | bool | dynamic_cast | log | signed | typename |

    | break | else | long | | union |

    | case | enum | mutable | static | unsigned |

    | catch | explicit | namespace | static_cast | using |

    | char | extern | new | struct | virtual |

    | class | false | operator | switch | void |

    | const_cast | float | protected | private | this | wchar_t |

    | continue | friend | public | throw | while |

    | default | goto | register | true | |

    | delete | if | reinterpret_cast | | |


    These alternative representations for operators and punctuation are reserved and
    also should not be used otherwise.


    | and && | and_eq &= | bitand & | bitor | compl ~ | not ! |

    | not_eq != | || | or_eq |= | xor ^ | xor_eq ^= | |'
