    \ so that there are two different functions named update: one that takes no arguments\
    \ and one that takes a single argument. Do not confuse the calls to the two functions\
    \ when concerned, just coincidentally happen to have the same name. When the compiler\
    \ sees the definition of the function with one argument the version of update\
    \ that takes one argument includes a call to the version of update that takes\
    \ no argument that is not a recursive call. Only the call to the version of update\
    \ with the exact same function declaration is a recursive call. To see what is\
    \ involved here, note that we could have named it update(), instead of naming\
