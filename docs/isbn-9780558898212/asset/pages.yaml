    Computer Languages. Computer languages can be described in terms of levels. Lowlevel
    languages or machine languages are the most primitive languages. Machine language
    is tied closely to the design of the computer hardware. Because computer designs
    are based on two-state technology (devices with two states such as open or closed
    circuits, or off switches, positive or negative charges), machine language is
    written using symbols, which are usually represented using the digits 0 and 1.
    Therefore, machine language is also a binary language, and because machine language
    is tied to the design of the computer hardware, the machine language for a Sun
    computer, is different from the machine language for a HP computer.


    An assembly language is unique to a specific computer design, its instructions
    are written in mnemonic statements instead of binary code. They do not have many
    types of statements, and writing programs in assembly language can be tedious.
    In addition, to use an assembly language, you must also know assembly language
    to take advantage of the specific computer hardware. Instrumentation that utilizes
    microprocessors often requires that the real-time programs operate very fast,
    and thus the programs are usually written in assembly language to enable computer
    hardware to perform the steps. High-level languages are computer languages that
    have English-like commands and instructions and include languages such as C++,
    C, Fortran, Ada, and Basic. Writing programs in high-level languages is certainly
    easier than writing programs in machine language or in assembly language. However,
    a highlevel language contains a large number of commands and an extensive set
    of syntax or (grammar) rules required by both software tools and high-level languages,
