    # Problem Solving Applied: Terrain Navigation


    Terrain navigation is a key component in the design of robotic spacecraft. Robotic
    spacecraft refers to spacecraft with no humans on board. These spacecraft can
    travel on land, such as the Mars Exploration Rovers, or fly above land in the
    Mars Renaissance Orbiter. A robotic spacecraft contains numerous onboard computers
    that store terrain information for the area in which it is to be operated. By
    knowing at any time it is (perhaps with the aid of a global positioning system
    (GPS) receiver), the vehicle can select the best path to get to designated spot.
    If the destination changes, the vehicle can refer to its internal maps to recompute
    the new path.


    The computer software that guides these vehicles must be tested over a variety
    of land formations and topologies. Elevation information for large grids of land
    is available in computer databases. One way of measuring the “difficulty” of a
    land grid with respect to terrain navigation'
