    Another testing strategy is to test boundary values. Unfortunately, boundary value
    is a value at which the program behavior changes. For example, in our supermarket
    program, the program''s behavior changes at an expected shelf of 7 days. 7 is
    a boundary value; the program behaves differently for a number of days that is
    less than or equal to 7 it does for a number of days that is greater than 7. Hence,
    we should test our program on at least one case in which the item should remain
    on the shelf for exactly 7 days. Normally, you should also test input one step
