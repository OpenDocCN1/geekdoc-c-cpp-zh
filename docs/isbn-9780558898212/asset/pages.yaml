    \  2x + 3y - z = 1\n   -x - 2y - 3z = -1\n\n# Problem Solving Applied: Electrical\
    \ Circuit Analysis*\n\nThe analysis of an electrical circuit frequently involves\
    \ finding the solution of a set of simultaneous equations. These equations are\
    \ often derived using either current equations that describe the currents entering\
    \ and leaving a node or voltage equations that describe the voltages around mesh\
