    # Basic Functions Included in the C++ Standard Library


    Arithmetic expressions that solve engineering problems often require computations
    other than addition, subtraction, multiplication, and division. For example, many
    expressions require the use of logarithms, exponentials, and trigonometric functions.
    In this section, we discuss pre-defined mathematical functions and character functions
    that are available in the Standard C+ library. For example, the following statement
    computes the sine of an angle and stores the result in the object b:


    ```

    b = sin(theta);

    ```


    The sin() function assumes that the argument theta is in radians. If theta contains
    a value in degrees, we can convert the degrees to radians with a separate statement.
    (Recall that 180 degrees = \pi radians.)


    ```

    double PI = acos(-1.0);

    ...

    theta_rad = theta*PI/180;

    b = sin(theta_rad);

    ```


    The conversion can also be specified in the function reference


    ```

    b = sin(theta*PI/180);

    ```


    A function reference, such as sin(theta), returns a single value. The parameters
    following the function name may contain the inputs to the function, which are
    function arguments. A function may contain no arguments, one, or many arguments,
    depending on its definition. If a function contains more than one argument, it
    is very important to list the arguments in the correct order. Some functions also
    require that the arguments be in specific units. For example, the trigonometric
    functions assume that arguments are in radians. Most of'
