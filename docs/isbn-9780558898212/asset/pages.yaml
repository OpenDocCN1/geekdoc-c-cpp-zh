    with the operating system using icons and menus; examples of user-friendly Graphical
    User Interface (GUI) systems, in the Macintosh environment and the Windows environment.


    Because C++ programs can run on many different platforms or computer systems and
    because a specific computer can use different operating systems, it is not feasible
    to discuss the wide variety of operating systems that you might use while taking
    this course. We assume that professor will provide the specific operating system
    information that you need to know the computers available at your university;
