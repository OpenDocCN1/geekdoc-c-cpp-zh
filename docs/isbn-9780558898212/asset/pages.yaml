  md: '# # Appendix Using MATLAB to Plot Data from ASCII Files


    To understand engineering problems and engineering solutions to problems, it is
    important to be able to visualize the numerical information that is involved.
    Therefore, the ability to easily obtain simple xy-plots from data files is an
    important capability in solving engineering problems.


    In this appendix we present a simple C++ program that generates a data file, and
    we show how to use MATLAB to obtain a plot of the data. We chose MATLAB (MATRIX
    Laboratory) to generate the plots in this appendix and also in the text chapters
    because it is an extremely powerful software for interactive numeric computations,
    data analysis, and graphics. An extensive discussion on generating different types
    of plots and on additional options that can be used within the plots is included
    in Chapter 7 of *Engineering Problem Solving with MATLAB*, by D. M. Etter, Prentice
    Hall, 1993.


    In the following example, we use a C++ program to generate an ASCII (American
    Standard for Information Interchange) data file and we then plot the information
    using MATLAB. An ASCII data file can also be generated using a word processor,
    and then the same steps can be used to plot the information for MATLAB. If the
    data file is generated with a word processor, it is important to select the options
    for saving the file so that it is saved as a text file instead of a word processor.


    $f(t) = e^{-t} \sin(2\pi t)$


    where $t = 0.0, 0.1, 0.2, \dots, 9.9$ seconds.


    # ## C++ Program to Generate a Data File


    ```

    /**************************************************/

    /* Program app-c                                     */

    /* This program generates a data file of values      */

    /* from a damped sine function.                       */


    #include <iostream>

    #include <fstream>

    #include <cmath>

    using namespace std;

    const double PI = 3.1415933;

    ```


    From Appendix C of Engineering Problem Solving with C++, Second Edition. Delores
    Etter, Jeanine Ingber.

    Copyright © 2009 by Pearson Education, Inc. Published by Pearson Prentice Hall.
    All rights reserved.'
