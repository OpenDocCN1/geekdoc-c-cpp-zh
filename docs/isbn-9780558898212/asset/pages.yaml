  md: '# Checking the Recursion


    In the subsection entitled "Recursive Design Techniques," we gave three criteria
    that you should check to ensure that a recursive void function definition is correct.
    Let''s check these three things for the function search given in Display 6.


    +   1. There is no infinite recursion: On each recursive call, the value of first
    is increased or the value of last is decreased. The chain of recursive calls does
    not end in some other way, and eventually the function will be called with first
    larger than last, and that is a stopping call.

    2. Each stopping case performs the correct action for that case: There are two
    stopping cases: when first > last and when key = a[mid]. Let''s consider each
    case


    +   * if last > first, there are no elements between a[first] and a[last], and
    key is not in this segment of the array. So if first > last, the function search
    correctly sets equal to false.


    +   * if key = a[mid], the algorithm correctly sets equal to true and location
    equal to mid, both stopping cases are correct.


    +   3. For each of the cases that involve recursion, if all recursive calls perform
    their actions correctly then the entire case performs correctly. There are two
    cases in which there are recursive calls: when key < a[mid] and key > a[mid].
    We need to check each of these two cases.


    First suppose key < a[mid]. In this case, since the array is sorted, we know if
    key is anywhere in the array, then key is one of the elements a[first] through
    a[mid - 1]. Thus, the function need only search these elements, which is exactly
    what the recursive call


    ```

    search(a, first, mid - 1, key, found, location);

    ```


    So. if the recursive call is correct, the entire action is correct.

    Next, suppose key > a[mid]. In this case, since the array is sorted, we know if
    key is anywhere in the array, then key is one of the elements a[mid + 1] through
    a[last]. Thus, the function need only search these elements, which is exactly
    what the recursive call


    ```

    search(a, mid + 1, last, key, found, location);

    ```


    So. if the recursive call is correct, the entire action is correct.

    Thus, in both cases the function performs the correct action (assuming that the
    recursive calls perform the correct action).


    The function passes all three of our tests, so it is a good recursive function
    definition.'
