    # Overloading a Function Name


    If you have two or more function definitions for the same function name, that
    is called overloading. When you overload a function name, the function definitions
    must have different numbers of formal parameters or some formal parameters of
    different types. When there is a function call, the compiler uses the function
    definition whose formal parameters match the arguments in the function call.


    Overloading is not really new to you. If both operands are of type int, as in
    13/2, then the value returned is the result of integer division, in this case
    6. On the other hand, if one or both operands are of type double, then the value
    returned is the result of regular division; for example, 13/2.0 returned the value
    6.5. There are two definitions for the division operator /, and the two definitions
    are distinguished not by having different numbers of operands, but rather by requiring
    operands of different types. The difference between overloading of / and overloading
    function names is that the compiler has already done the overloading of / but
    you program the overloading of the function name. We will see in a later chapter
    how to overload operators as +, -, *, and so on.


