    criteria for void functions


    # CASE STUDY Binary Search—An Example of Recursive Thinking


    In this study we develop a recursive function that searches for an array to find
    out whether it contains a specific value. The array may contain a list of numbers
    for credit cards that are no longer valid. A store clerk needs to search the list
    to see if a customer''s card is valid or invalid. We discussed a simple method
    for searching an array by simply checking every element. In this section we will
    develop a method for searching a sorted array that is much faster.


    The indices of the array are the integers through final_index. In order to make
    the task of searching the array easier, we assume that the array is sorted. Hence,
    we know the following:


    ```

    a[0] << a[1] << ... << a[final_index]

    ```


    When searching an array, you are likely to know both whether the value is in the
    list and, if it is, where it is in the list. For example, if we are searching
    for a credit card number, the array index may serve as a record number. Another
    array indexed by these indexes may hold a phone number or other information to
    use for reporting the suspicious card. Hence, if the sought-after value is in
    the array, we will want our function to tell where that value is in the array.


    # Problem Definition


    We will design our function to use call-by-reference parameters to return the
    outcome of the search. One parameter, called found, will be of type bool. If the
    value is found, then found will be set to true. If the value is found, another
    parameter, called location, will be set to the index of the value found.'
