    # Mixed Parameter Lists


    Whether a formal parameter is a call-by-value parameter or a call-by-reference
    parameter is determined by whether there is an ampersand attached to its type
    specification. If the ampersand is present, the formal parameter is a call-by-reference
    parameter. If there is no ampersand associated with the formal parameter, then
    it is a call-by-value parameter.


    It is perfectly to mix call-by-value and call-by-reference parameters in the same
    function. For example, the first and last of the formal parameters in the following
    function declaration are call-by-reference parameters and the middle one is a
    call-by-value parameter:


    ```

    void code_stuff(int* p1, int* p2, double p3);

    ```


    Call-by-reference parameters are not restricted to void functions. You can also
    use them in functions that return a value. Thus, a function with a call-by-reference
    parameter could change both the value of a variable as an argument and return
    a value.


    # PROGRAMMING TIP


    What Kind of Parameter to Use


    Display 6 illustrates the differences between how the compiler treats call-by-value
    and call-by-reference formal parameters. The parameters par1_value and par2_ref
    are both assigned a value inside the body of the function. But since they are
    different kinds of parameters, the effect is in the two cases:


    par1_value is a call-by-value parameter, so it is a local variable. When the function
    is called as follows


    ```

    do_stuff(n1, n2);

    ```


    the local variable par1_value is initialized to the value of n1. That is, the
    local variable par1_value is initialized to 1 and the variable n1 is then ignored
    by the function. As you can see from the sample dialogue, the formal parameter
    par1_value (which is a local variable) is set to 111 in the function body and
    this value is output to the screen. However, the value of the argument n1 is not
    changed. As shown in the sample dialogue, n1 has retained its value of 1.


