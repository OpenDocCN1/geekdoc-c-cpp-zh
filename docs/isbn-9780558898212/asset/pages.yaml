  md: '# A Function Is Like a Small Program


    To understand functions, keep the following three points in mind:


    +   - A function definition is like a small program and calling the function is
    the same thing as running this "small program."

    - A function uses formal parameters, rather than c-in, for input. The arguments
    to the function are the input and they are plugged in for the formal parameters.

    - A function (of the kind discussed in this chapter) does not normally send any
    output to the screen, but it sends a "output" back to the program. The function
    returns a value, which is like the "output" for the function. The function uses
    a return statement instead of a cout statement for this "output."


    number_par and price_par, respectively. This substitution process is known as
    the call-by-value mechanism, and the formal parameters are often referred to as
    call-by-value formal parameters, or simply as call-by-value parameters. There
    are three things that you should note about this substitution process:


    +   1. It is the values of the arguments that are plugged in for the formal parameters.
    If the arguments are variables, the values of the variables, not the variables
    themselves, are plugged.

    2. The first argument is plugged in for the first formal parameter in the parameter
    list, the second argument is plugged in for the second formal parameter in the
    list, and so on.

    3. When an argument is plugged in for a formal parameter (for instance 2 is plugged
    in for number_par), the argument is plugged in for all instances of the formal
    parameter that occur in the function body (for instance 2 is plugged in for number_par
    each time it appears in the function body).


    The entire process involved in the function call shown in Display 3 is described
    in detail in Display 4.


    # Functions That Return a Boolean Value


