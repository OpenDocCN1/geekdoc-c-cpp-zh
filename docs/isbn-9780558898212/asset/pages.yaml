    # INTRODUCTION


    The top-down design strategy is an effective way to design an algorithm for a
    program. You divide the program''s task into subtasks and then implement the algorithms
    for these subtasks as functions. Thus far, we have seen how to define functions
    that start with the values of some arguments and return a single value as the
    result of the function call. A subtask that computes a value is a very important
    kind of subtask, but it is not the only kind. In this chapter we will complete
    our description of C++ functions and present techniques for designing functions
    that perform other kinds of subtasks.


    # 1 void FUNCTIONS


    Subtasks are implemented as functions in C++. The functions always return a single
    value, but there are other forms of subtasks. A subtask might produce several
    values or it might produce no values at all. In C++, a function must return a
    subtask that produces several different values is usually (and perhaps paradoxically)
    implemented as a function that returns no value. For the moment, however, let
    us avoid that complication and focus on subtasks that intuitively produce no values
    at all and let us see how these subtasks are implemented. A function that returns
    no value is called a void function. For example, one typical subtask for a program
    is to output the results of some calculation. This subtask produces output on
    the screen, but it produces no values for the rest of the program to use. This
    kind of subtask would be a void function.


    void functions return no value


