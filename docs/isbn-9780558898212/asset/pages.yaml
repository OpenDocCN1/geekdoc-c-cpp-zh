  md: 'Some novice programmers will "randomly" change portions of the code hoping
    that it will fix the error. Avoid this technique at all costs! Sometimes this
    approach will work for the first few simple programs that you write. However,
    it will almost certainly fail for larger programs and will often introduce new
    errors to the program. Make sure that you understand logical impact a change to
    the code will make before committing the modification.


    Finally, if allowed by your instructor, you could show the program to someone
    else. A fresh set of eyes can sometimes quickly pinpoint an error that you have
    been missing. Taking a break and returning to the problem a few hours later or
    the next day can also sometimes help in discovering an error.


    # Check Common Errors


    One of the first mistakes you should look for common errors that are easy to make,
    as throughout the textbook in the Pitfall and Programming Tip sections. Examples
    of sources for common errors include (1) uninitialized variables, (2) off-by-one
    errors, (3) exceeding a boundary, (4) automatic type conversion, and (5) using
    = instead of ==.


    # Localize the Error


    Determining the precise cause and location of a bug is one of the first steps
    to fixing the error. Examining the input and output behavior for different cases
    is one way to localize the error. A related technique is to add count statements
    to strategic locations in the program that print out the values for critical variables.
    The count statements also serve to show what code the program is executing. This
    is the strategy of tracing variables, but it can be used even when there are no
    loops in the code.


    For example, consider the code in Display 12 that is intended to convert a temperature
    from Fahrenheit to Celsius using the formula:


    ```

    C = \frac{5(F-32)}{9}

    ```


    When this program is executed with an input of 100 degrees Fahrenheit, the output
    is "Temperature in Celsius is 0". This is obviously incorrect, the correct answer
    is 37.8 Celsius.


    To track the error we can print the value of critical variables. In this case,
    something appears to be wrong with the conversion formula, so we try a two-step
    approach. In the first step we compute (Fahrenheit - 32) and in the second step
    we compute (5 / 9) and then output both values. This is illustrated in Display
    13. We also commented out the original line of code by placing // at the beginning
    of the line. This tells the compiler to ignore the original line'
