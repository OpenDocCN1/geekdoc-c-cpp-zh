    returns a nonzero (true) value if and only if the input character is a digit or

    uercase or lowercase letter

    int isalpha(int c);

    returns a nonzero (true) value if and only if the input character is an uppercase
    or

    lowercase letter

    ```


    From Appendix A of Engineering Problem Solving with C++, Second Edition. Delores
    Eiter, Jeanine Ingber.

