    # PROGRAMMING EXAMPLE Converting Temperatures


    The program in Display 2 takes a Fahrenheit temperature as input and outputs the
    equivalent Celsius temperature. A Fahrenheit temperature $F$ can be converted
    to an equivalent Celsius temperature C as follows:


    ```

    C = (5/9)(F - 32)

    ```


    The Celsius shown in Display 2 uses this formula to do the temperature conversion.


    # return Statements in void Functions


    Both void and functions that return a value can have return void statements. In
    the case of a function that returns a value, the return statement specifies the
    value returned. In the case of a void function, the return statement simply ends
    the function. As we saw in the previous chapter, every function that returns a
    value must end by executing a return statement. However, a void function need
    not contain a return statement. If it does not contain a return statement, it
    will end after executing the code in the function body as if there were an implicit
    return statement just before the final closing brace } at the end of the function
    body. For example, the functions initialize_screen in Display 2 would perform
    exactly the same if we omitted the return statements from their function definitions.


    The fact that there is an implicit return statement before the final brace means
    that you never need a return statement in a void function. For example, the function
    definition in Display 3 might be used as part of a restaurant-management program.
    That outputs instructions for giving a given amount of each among the people at
    a table. If there are no people at the table, or if number equals 0, then the
    return statement within the statement terminates the call and avoids a division
    by zero. If it is not 0, then the function calls when the last count statement
    is executed at the end of the function body.


    By now you may have guessed that the main part of a program is actually the definition
    of a function called main. When the program is run, the function main is automatically
    called and, in turn, may call other functions. It may seem that the return statement
    in the main part of a program should be optional, officially it is not. Technically,
    the main part of a program is a function that returns a value of type int, so
    it requires a return statement. However, the function main is used as if it were
    a void function. Treating the main part of your program as a function that returns
    an integer sound


    The main part of a program is a function'
