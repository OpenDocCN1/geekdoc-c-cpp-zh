  md: "# Procedural Abstraction and Functions That Return a Value\n\n```\ndouble mpg(double\
    \ miles, double gallons)\n//Returns miles per gallon.\n{\n    return (miles/gallons);\n\
    }\n```\n\nIf you call the function mpg with arguments of type int, C++ will automatically\
    \ convert any argument of type int to a value of type double. Hence, the following\
    \ will output 22.5 miles per gallon to the screen:\n\n```\ncout << mpg(45, 2)\
    \ << \" miles per gallon\";\n```\n\nC++ converts 45.0 and 2 to 2.0, then performs\
    \ the division 45.0/2.0 to obtain the value returned, which is 22.5.\n\nIf a function\
    \ requires an argument of type double and you give it an argument of type int,\
    \ C++ will automatically convert the int to a value of type double. This is useful\
    \ and natural that we gladly gave it a thought. However, overloading can interfere\
    \ with this type conversion. Let's look at an example:\n\nNow, suppose you had\
    \ (foolishly) overloaded the function name mpg so your program also contained\
    \ the following definition of mpg (as well as the previous one):\n\n```\nint mpg(int\
    \ goals, int misses)\n//Returns the measure of Perfect Goals\n//which is computed\
    \ as (goals - misses).\n{\n    return (goals - misses);\n}\n```\n\nIn a program\
    \ that contains both of these definitions for the function name mpg, the following\
    \ will (unfortunately) output 43 miles per gallon (since 45 - 2):\n\n```\ncout\
    \ << mpg(45, 2) << \" miles per gallon\";\n```\n\nWhen C++ sees the function call(45,\
    \ 2), which has two arguments of type int, C++ first looks for a function definition\
    \ of mpg that has two formal parameters of type int. If it finds such function\
    \ definition, C++ uses that function definition. C++ does not convert an int argument\
    \ to a value of type double unless it is the only way it can find a matching function\
    \ definition.\n\nThe mpg example illustrates one more point about overloading.\
    \ You should not use the same function name for two unrelated functions. Such\
    \ careless use of function names is certain to eventually produce confusion."
