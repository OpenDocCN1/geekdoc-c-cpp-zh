  md: '# Functions for All Subtasks


    like this one is called driver programs. These driver programs are temporary tools,
    and can be quite minimal. They need not have fancy input routines. They need not
    perform all the calculations the final program will perform. They need do obtain
    reasonable values for the function arguments in as simple way as possible—typically
    from the user—then execute the function and show the result. A loop, in the program
    in Display 10, will allow you to test the function on different arguments without
    having to rerun the program.


    If you test each function separately, you will find most of the mistakes in your
    program. Moreover, you will find out which functions contain the mistakes. If
    you were to test the entire program, you would probably find out if there is a
    mistake, but you would have no idea where the mistake is. Even worse, you may
    think you know where the mistake is, but wrong.


    Once you have fully tested a function, you can use it for some other function.
    Each function should be tested in a program in which it is the only untested function.
    However, it is fine to use a fully tested function when testing some other function.
    If a bug is found, you know the bug is in the untested function. For example,
    by fully testing the function get_input routine in driver program in Display 10,
    you can get_input as the input routine to test the remaining functions.


    It is impossible or inconvenient to test a function using some other function
    that has not been written or has not been tested. These simplified functions are
    called stubs. Stubs will not necessarily perform the correct calculation, but
    they will deliver values for testing, and then you can have confidence in their
    performance. For example, the program in Display 11 is designed to test the function
    get_output from Display 9 as the basic layout of the program. This program uses
    the function get_input, which we already tested using the driver program shown
    in Display 10. This program also includes the function initialize_screen, which
    we assume has been tested using simple driver of own, though we have not bothered
    to show that simple driver. Since we have not yet tested the function price, we
    have used a stub to stand for it. Notice that we could use this program before
    we even written the function price. This way we can test the basic program layout
    before we fill in the details of all the functions.


    Using a program outline with stubs allows you to test and then "flush out" the
    basic program outline rather than writing a completely new program to test each
    function. For this reason a program outline is usually the most efficient method
    of testing A common approach is to use driver programs to test some basic functions,
    like input and output functions, and then use a program with stubs to test the
    remaining functions. The stubs are replaced by functions one at a time: One stub
    is replaced by a complete function and tested; once that function is fully tested,
    another stub is replaced by a full function and, so forth until the final program
    is produced.'
