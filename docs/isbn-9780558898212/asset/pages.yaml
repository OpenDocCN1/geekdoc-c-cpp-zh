    # ## ENGINEERING CHALLENGE:

    Terrain Navigation


    The Mars Exploration Rovers are designed to move across the surface of Mars and
    examine the soil and rocks in fine detail. The auto-navigation system takes pictures
    of the nearby terrain using one of the rover''s stereo camera pairs. After stereo
    images are taken, 3-D terrain maps are generated automatically by the rover software.
    Traversability and safety is then determined from the height and density of rocks
    or steps, excessive tilts and roughness of the terrain. Dozens of possible paths
    are considered before the rover chooses the shortest, safest path toward the programmed
    geological goal. Moving from place to place, the rovers perform on-site geological
    investigations. The robotic arm is capable of movement in-much the same way as
    a human arm with an elbow and wrist, and can place instruments directly up against
    rock and soil targets of interest. In this chapter we analyze elevation data from
    a terrain map to determine the number and location of peaks within the terrain.'
