    # INTRODUCTION


    I/O refers to program input and output. Input can be taken from the keyboard

    or a file. Similarly, output can be sent to the screen or to a file. This

    chapter explains how you can write your programs to take input from a file and

    and output to another file.


    Input is delivered to your program via a C++ construct known as a stream,

    and output from your program is delivered to the output device via a stream.

    Streams are our first examples of objects. An object is a special kind of variable

    that has its own special-purpose functions that are, in a sense, attached to the

    variable. The ability to handle objects is one of the features that sets

    C++ apart from earlier programming languages. In this chapter we tell

    what streams are and how to use them for program I/O. In the process

    of explaining streams we will introduce you to the basic ideas about what

    objects are and about how objects are used in a program.


    # 1 STREAMS AND BASIC FILE I/O


    Good Heavens! For more than forty years I have been speaking prose without

    knowing it.


    > MOLIÈRE, Le Bourgeois Gentilhome


    You are already using files to store your programs. You can also use files to

    store input for a program or receive output from a program. The files used

    for program I/O are the same kind of files as you use to store your programs.

    Streams, which we discuss next, allow you to write programs that handle file

    input and keyboard input in a unified way and that handle file output

    screen output in a unified way.


    A stream is a flow of characters (or other kind of data). If the flow is into

    your program, the stream is called an input stream. If the flow is out of your

    program, the stream is called an output stream. Then your program will take input
    from the keyboard. If the'
