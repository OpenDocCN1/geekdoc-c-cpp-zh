  md: '# INTRODUCTION TO COMPUTING AND ENGINEERING PROBLEM SOLVING


    CHAPTER OUTLINE


    # Objectives


    +   1 Historical Perspective

    2 Recent Engineering Achievements

    3 Computing Systems

    4 Data Representation and Storage

    5 An Engineering Problem-Solving Methodology Summary, Key Terms, Problems


    # OBJECTIVES


    In this chapter we provide an introduction to computing and engineering problem
    solving, including:


    +   * a brief history of computing

    * recent engineering achievements

    * a discussion of hardware and software

    * a discussion of number systems

    * a five-step problem-solving methodology


    # Historical Perspective


    In the early 1800s, Charles Babbage, an English mathematician, conceptualized
    a computer, which he called the Analytical Engine. Designed to process base ten
    numbers, the Analytical Engine had four parts: an input device, a "storehouse"
    or storage unit, a processing unit and an output device. The storage unit consisted
    of an indefinite number of columns of discs. Each disc was inscribed with the
    10 digits (0-9), the next rotated about a column. The lowest disc on a column
    represented the ones position, the next disc the tens position, the next the hundreds
    position, and so on. By arranging the discs of one column, a decimal number could
    be displayed.


    In 1842, the French engineer and mathematician, Luigi Menabrea, published a paper
    "Sketch of the Analytical Engine Invented by Charles Babbage, Esq, with notes
    by Ada Lovelace.\ In his paper, Menabrea described Babbage''s vision of a machine
    capable of solving any problem using inputs, outputs and programs written on punch
    cards. You will see in the following sections of this chapter, the Analytical
    Engine resembles the digital computers we use today in so far as they have input
    and output devices, storage units and processing units: however, digital computers
    represent data in base 2 rather than base ten. Although we longer'
