    In this chapter we develop problem solutions containing:


    +   - selection structures that allow us to provide alternative paths in a program

    - repetition structures that allow us to repeat a set of steps as long as a condition
    is true

    - algorithm development and descriptions of algorithms using flowcharts and pseudocode

    - three common forms of input loops


    # Algorithm Development


    In simple C++ programs the steps are sequential, and typically involved reading
    information from the keyboard, computing new information, and then printing the
    new information. In solving engineering problems, most of the solutions require
    more complicated steps, and thus we need to expand the algorithm development part
    of our problem-solving process.


    # Top-Down Design


    Top-down design presents a “big picture” description of the problem solution in
    sequential steps. This overall description of the problem is then refined until
    the steps are detailed enough to translate to language statements. This outline
    is written in sequential steps,'
