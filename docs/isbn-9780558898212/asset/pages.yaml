    # 2. INPUT/OUTPUT DESCRIPTION


    The I/O diagram shows that the resistor values and the voltage values are the
    input values. The three mesh currents are the output values.


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_475_0.png)


    # 3. HAND EXAMPLE


    By using the resistor values and the voltage values, a system of three equations
    are defined, using this rearranged set of equations from the definition of the
    problem:


    ```

    $(R_1 + R_2)i_1 - R_2i_2 + 0i_3 = V_1$,

    $-R_2i_1 + (R_2 + R_3 + R_4)i_2 - R_4i_3 = 0$,

    0i_1 - R_4i_2 + (R_4 + R_5)i_3 = -V_2$.

    ```


    For example, suppose that each of the resistor values is 1 ohm and both of the
    voltage sources are 5 volts. Then the corresponding set of equations is the following:


    ```

    $2i_1 - i_2 + 0i_3 = 5$,

    $-i_1 + 3i_2 - i_3 = 0$,

    0i_1 - i_2 + 2i_3 = -5$.

    ```'
