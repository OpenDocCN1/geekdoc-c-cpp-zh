  md: '# Numerical Technique: Solution to Simultaneous Equations*


    The need to solve a system of simultaneous equations occurs frequently in engineering
    problems. A number of methods exist for solving a system of equations, and each
    method has its advantages and disadvantages. In this section, we present the Gauss
    elimination method of solving a set of simultaneous linear equations: the equations
    are called linear because the equations contain only linear (degree-1) terms such
    as x, y, and z. However, before we present the details of this technique, we first
    present a graphical interpretation of the solution to a set of equations.


    # Graphical Interpretation


    A linear equation with two variables, such as 2x - y = 3, defines a straight line
    and is often written in the form as y = mx + b, where m represents the slope of
    the line and b represents the y-intercept. Thus, 2x - y = 3 can also be written
    as y = 2x - 3. If we have two linear equations, they can represent two different
    lines that intersect in a single point, they can represent two parallel lines
    that never intersect, or they can represent the same line; these possibilities
    are shown in Figure 1.


    Equations that represent intersecting lines can be easily identified because they
    have different slopes, as in y = 2x - 3 and y = -x + 3. Equations that represent
    parallel lines will have the same slope, but different y-intercepts, as in y =
    2x - 3 and y = 2x + 1. Equations that represent the same line have the same slope
    and y-intercept, as in y = 2x - 3 and y = 3x - 6.


    If a linear equation contains three variables, x, y, and z, it represents a plane
    in three-dimensional space. If we have two equations with three variables, they
    can represent two planes that intersect in a straight line, they can represent
    two parallel planes, or they can represent the same plane; these possibilities
    are shown in Figure 2. If we have three equations with three variables, the three
    planes can intersect in a single point, they can intersect the plane, they can
    have no common intersection point, or they can represent the same plane. Examples
    of the possibilities that exist if the three equations represent different three
    planes are shown in Figure 3. These ideas can be extended to more than three variables,
    although it is harder to visualize the situations.


    We call the set defined by an equation with more than three variables a hyper-plane.
    In general, we consider a set of m linear equations that contain n unknowns, where
    each equation defines a hyperplane that is not identical to another hyperplane
    in the set of equations. If m < n then the system is underspecified, and a unique
    solution does not exist. If m = n, then a unique solution will exist if the equations
    represent parallel hyperplanes. If m > n, the system is overdetermined, and a
    unique solution does not exist. A set of equations is also called a nonsingular
    system of equations, and a system with no unique solution is called a singular
    set of equations.


    As a specific example, consider the following system of equations:


    ```

    3x + 2y - z = 10

    -x + 3y + 2z = 5

    -x - y - z = -1.

    ```'
