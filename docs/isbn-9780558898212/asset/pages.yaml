    Writing and using functions as if they were black boxes is also procedural abstraction.
    When programming in C++ it might make sense to call it functional abstraction.
    However, procedure is a more general term than function. Computer scientists use
    the term for ''function-like'' sets of instructions, and so we use procedural
    abstraction. The term abstraction is intended to convey the idea that when you
    use a function as a black box, you are abstracting away the details of the code
    contained in the body. You can call this technique the black box principle or
    the principle of procedural abstraction or information hiding. The three mean
    the same thing. Whatever you call this principle, the important point is that
    you should use it when designing and writing your functions definitions.


    procedural abstraction


    # Procedural Abstraction


    When applied to a function definition, the principle of procedural abstraction
    means that your function should be written so that it can be used like a black
    box. This means that the programmer who uses the function should not need to look
    at the body of the function definition and the accompanying comment should be
    all the programmer needs to know in order to use the function. To ensure that
    your function definitions have this important property, you should strictly adhere
    to the following rules:


    # HOW TO WRITE A BLACK-BOX FUNCTION DEFINITION (THAT RETURNS VALUE)


    +   The function declaration comment should tell the programmer and all conditions
    that are required of the arguments to the function and should describe the value
    that is returned by the function when called with these arguments.

    All variables used in the function body should be declared in the function body.
    (The formal parameters do not need to be declared, because they are listed in
    the function declaration.)


