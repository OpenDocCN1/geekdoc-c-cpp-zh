    # PROGRAMMING EXAMPLE Another Powers Function


    We introduced the predefined function that computes powers. For example, pow(2.0,
    3.0) returns pow 2.0^3, so the following sets the variable x to 8.0:


    ```

    double x = pow(2.0, 3.0);

    ```


    The function power takes two arguments of type double and returns a value of type
    double. Display 3 contains a recursive definition for a function that is similar
    but works with the type int than double. This new function is called power. For
    example, the following will set the value of y to 8, since 2^3 is 8:


    ```

    int y = power(2, 3);

    ```


    Our main reason for defining the function power is to have a simple example of
    a recursive function, but there are situations in which the function power would
    be preferable to the function power. The function power returns values of type
    double, which are only approximate quantities. In some situations, you might need
    the additional accuracy provided by the function power.


    The definition of the function power is based on the following formula:

    x^n = x^(n-1)*x


    Translating this formula into C++ says that the value returned by power(x, n)
    should be the same as value of the expression


    ```

    power(x, n-1)*x

    ```


    The definition of the function power given in Display 3 return this value for
    power(x, n), provided n > 0.


    The case where n is equal to 0 is the stopping case. If n is 0, then power(x,
    n) simply returns 1 (since x^0 is 1).


