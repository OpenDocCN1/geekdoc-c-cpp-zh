    the x-, y-, and z-coordinates if you position the array at the origin of a three-dimensional
    space, as shown in Figure 5. Thus, the position that is shaded corresponds to
    b[2][0][1].


    Most engineering problems that need arrays can be solved using one-dimensional
    or two-dimensional arrays. However, there are occasionally problems that are good
    candidates for using higher dimensional arrays. These problems typically involve
