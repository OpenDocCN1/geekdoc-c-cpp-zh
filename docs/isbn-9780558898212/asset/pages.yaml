    # Data Representation and Storage


    Recall that the design of the Analytical Engine''s storage unit consisted of an
    indefinite number of columns of digits, each disc inscribed with the 10 decimal
    digits (0–9). By arranging the discs of one column, a decimal number could be
    stored.


    A modern digital computer follows a similar design except information is represented
    in base 2, rather than base 10. The base two number system has only two binary
    digits, 0 and 1, a single binary can be represented by one bit in a digital computer.
    The value of a bit at any given time can be either 0 or, or high, if it has a
    value of 1.


    Binary numbers can be stored in memory as bits, called a word. The right bit of
    a word represents the first position, the next bit represents the two''s position,
    and the left bit represents the 2ⁿ position where n is the number of bits. Each
    additional bit in a word increases the word size by a power of 2, and doubles
    the range of values that can be represented. The number of words available in
    memory is referred to as the memory space, or address space.


    Figure 4 provides a diagram of memory that has an address space of 8 (2³) and
    a word size of 16 (2⁴). The binary value stored at address 000 is 0000101010110110
    = 2710. It is important to note that the word size determines the range of values
    that can be stored in word and the address space determines the number of words
    that can be stored. The Analytical Engine had a word size defined by the number
    of digits on a column and a memory space defined by the number of columns.


    The C++ programming language has built-in types for representing integer values,
    floating point values, characters, and boolean values. Each built-in data type
    has a pre-defined size measured in bytes, where a byte is a sequence of 8 bits.
    Type declaration statements are required to identify and allocate memory. When
