  md: '# Precedence of Operators


    All the operators in a given box have the same precedence. Operators in higher
    boxes have higher precedence than operators in lower boxes. Unary operators and
    the assignment operator are executed left to right when operators have the same
    precedence. For example, x = y = z means x = (y = z). Other operators have the
    same precedences are executed left to right. For example, x + y + z means (x +
    y) + z.


    From Problem Solving with C++, Seventh Edition. Walter Savitch. Copyright © 2008
    by Pearson Education, Inc. Published by Pearson Addison-Wesley. All rights reserved.'
