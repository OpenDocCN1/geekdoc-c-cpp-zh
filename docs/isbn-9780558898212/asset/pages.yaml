    # Algorithm Design


    +   subtask 1: Subtask 1 is straightforward. The program will simply ask for the
    input values and store them in four variables, which we will call diameter_small,
    diameter_large, price_small, and price_large.

    subtask 4 and 5: Subtask 4 is routine. To determine which pizza is the best buy,
    we will compare the cost per square inch of the two pizzas using the less-than-operator.
    Subtask 5 is a routine output of the results.

    subtask 2 and 3: Subtask 2 and 3 are implemented as calls to the function unitprice.
    Next, we design the algorithm for this function. The hard part of the algorithm
    is determining the area of the pizza. Once we know the area, we can easily determine
    the price per square inch using division, as follows:


    price/area


    where is a variable that holds the area of the pizza. This expression will be
    the value returned by the function unitprice. But we still need to formulate a
    method for computing the area of the pizza.


    A pizza is basically a circle (made of bread, cheese, sauce, and so forth).

    The area of a circle (and half a pizza) is $\pi r^2$, where $r$ is the radius
    of the circle, and $\pi$ is the number called "$\pi$" which is approximately equal
    to 3.14159. The radius is half of the diameter.


    The algorithm for the function unitprice can be outlined as follows:


    # Algorithm Outline for the Function unitprice


    +   1. Compute the radius of the pizza.

    2. Compute the area of the pizza using the formula $\pi r^2$.

    3. Return the value of the expression (price/area).


    We will give this outline a bit more detail before translating into C++ code.
    We will express this more detailed version of our algorithm in pseudocode. Pseudocode
    is a mixture of C++ and ordinary English. Pseudocode allows us to make our algorithm
    precise without worrying about the details of


    pseudocode'
