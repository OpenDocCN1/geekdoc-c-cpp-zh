  md: '# Introduction to Computing and Engineering Problem Solving


    Engineers need strong communication skills for both oral presentations and for
    writing materials. Computers provide the software to assist in writing outlines
    and developing materials and graphs for presentations and technical reports. The
    problems at the end of this chapter include written and oral presentations to
    provide practice of these important skills.


    The design/manufact path, which consists of taking an idea from a concept to a
    product, is one that engineers must understand first-hand. Every step of this
    process uses computers from design analysis, machine control, robotic assembly,
    quality assurance, and market analysis. Several problems in the relation to these
    topics are there. For example, in Chapter 4, programs are designed to simulate
    the reality of systems that use multiple components.


    Engineering teams of the future will be interdisciplinary teams, just as the engineering
    teams of today are interdisciplinary teams. The discussions of the engineering
    achievements of the last 50 years clearly show the interdisciplinary nature of
    these achievements. The teams address, and eventually solve, the challenges of
    the future will also be interdisciplinary. Learn to interact in and develop organizational
    structures for effective team communication is an important skill for engineers.
    A good way to begin developing team skills is to engineer teams to study for assigns.
    Assign specific topics to members of the team with the assignment that they return
    these topics for, with examples and potential questions.


    The engineers of the 21st century need to understand the world marketplace. This
    involves understanding different cultures, political systems, and business environments.
    Courses in these topics and in foreign languages provide some understanding, but
    exchange programs with experiences provide invaluable knowledge in developing
    a broader understanding.


    Engine are problem solvers, but problems are not always formulated correctly.
    An engineer must be able to extract a problem statement from a problem discussion,
    and determine important issues related to the problem. This involves not only
    developing, but also learning to correlate choices. It means not only analyzing
    the data, but synthesizing many pieces of information. The integration of ideas
    can be as important as the decomposition of the problem into manageable pieces.
    A problem solution may involve not only abstract thinking about the problem, but
    also experimental learning from the environment.


    Problem solutions may also be considered in their societal context. Environmental
    concerns should be addressed as alternative solutions to problems being considered.
    Engineers must also be conscious of ethical issues in providing test results,
    quality verifications, and design limitations. Ethical issues are never easy to
    resolve, and some of the exciting new technological advancements will bring more
    ethical issues with them. For example, the mapping of the genome will potentially
    drive ethical, legal, and social implications. Should prospective patients be
    given detailed information related to the physical and mental characteristics
    of an author? What therapy that allows diabetes also be used to enhance athletic
    ability? What of privacy does an individual have over his or her genetic code?
    Very complicated use with any technological advancement because the same capabilities
    that can do a great deal also can often be applied in ways that are harmful.


    The material presented in this text is only the beginning building the knowledge,
    confidence, and understanding needed by engineers of the 21st century. However,
    we enthusiastically bring in an introduction to the range of computing systems
    available to engineers and an introduction to a problem-solving methodology that
    will be used throughout this text as we use C++ to implement engineering problems.'
