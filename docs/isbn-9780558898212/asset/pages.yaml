  md: "# Problem Definition\n\nThe declaration and header comment for our function\
    \ is as follows:\n\n```\nvoid write_vertical(int n);\n//Precondition: n >= 0;\n\
    //Postcondition: The number n is written to the screen\n//vertically with each\
    \ digit on a separate line.\n```\n\n# Algorithm Design\n\nOne case is very simple.\
    \ If n, the number to be written out, is only one digit long, just write out the\
    \ number. As simple as it is, this case is still important, so to keep track of\
    \ this case.\n\nSimple Case: If n < 10, then write the number n to the screen.\n\
    \nNow let's consider the more typical case in which the number to consists of\
    \ more than one digit. Suppose you want to write the number 1234 vertically so\
    \ that the result is\n\n+   1\n2\n3\n4\n\nOne way to decompose this task into\
    \ two subtasks is the following:\n\n+   1. Output all the digits except the last\
    \ digit like so:\n\n+   1\n2\n3\n\nOutput the last digit, which in this example\
    \ is 4.\n\nSubtask 1 is a smaller version of the original task, so we can implement\
    \ this subtask with a recursive call. Subtask 2 is just the simple case we wrote\
    \ earlier. Thus, an outline of our algorithm for the function write_vertical with\
    \ parameter n is given by the following pseudocode:\n\n```\nif (n < 10)\n{\n \
    \ cout << n << endl;\n}\nelelse // n is two or more digits:\n{\n  write_vertical(the\
    \ number n with the last digit removed);\n  cout << the last digit of n << endl;\n\
    }\n```"
