  md: "When more than one statement is used, they are separated by commas, and are\
    \ executed from left to right. This, comma operator is executed last in operator\
    \ precedence.\n\n# break and continue Statements\n\nWe used the break statement\
    \ in a previous section with the switch statement. The break statement can also\
    \ be used with any of the loop structures presented in this section to immediately\
    \ exit the loop in which it is contained. In contrast, the continue statement\
    \ is used to skip the remaining statements in the current pass or iteration of\
    \ the loop, and then continue with the next iteration of the loop. Thus, in while\
    \ loop, the condition is evaluated to determine if the statements in the loop\
    \ are to be executed. In for loop, the loop-control object is modified, and the\
    \ repetition-continuation condition is evaluated to determine whether the statements\
    \ in the loop are to be executed. Both the break and continue statements are useful\
    \ in exiting the current iteration or the loop respectively, when error conditions\
    \ are encountered.\n\nTo illustrate the difference between the break and the continue\
    \ statements, consider the following loop that reads values from the keyboard:\n\
    \n```\nsum =\nfor (int k=1; k<20; ++k) {\n    cin >> x;\n    if (x > 10.0) {\n\
    \        break;\n        sum += x;\n    }\n}\n```\n\ncout << \"Sum = \" << sum\
    \ << endl;\nThis loop reads up to 20 values from the keyboard. If all 20 values\
    \ are less than or equal to 10.0, then the statements compute the sum of the values\
    \ and print the sum. But, if a value is read that is greater than 10.0, then the\
    \ break statement causes control to break out of the loop, and execute the cout\
    \ statement. Thus, the sum printed is only the sum of the values up to the value\
    \ 10.0.\n\nNow, consider this variation of the previous loop:\n\n```\nsum =\n\
    for (int k=1; k<20; ++k) {\n    cin >> x;\n    if (x > 10.0) {\n        continue;\n\
    \        sum += x;\n    }\n}\n```\n\ncout << \"Sum = \" << sum << endl;\nIn this\
    \ loop, the sum of all 20 values is printed if all values are less than or equal\
    \ to 10.0. However, if a value is greater than 10.0, then the continue statement\
    \ causes control to skip the rest of the statements in that iteration of the loop,\
    \ and to continue with the next iteration of the loop. Hence, the sum printed\
    \ is the sum of all values in the 20 values that are less than or equal to 10."
