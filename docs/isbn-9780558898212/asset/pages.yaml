  md: '# Custom Header Files


    The functions developed in the previous sections are frequently used in solving
    engineering problems. To facilitate their use, we generate a custom header file
    that contains the prototypes for these function. Then, instead of writing all
    the prototypes in a main function, a preprocessor directive can be used that includes
    the custom header file.


    The header file named stat_lib.h contains the following function prototypes:


    ```

    double maxval(const double x[], int n);

    double minval(const double x[], int n);

    double mean(const double x[], int n);

    double median(const double x[], int n);

    double variance(const double x[], int n);

    double std_dev(const double x[], int n);

    ```


    The statement that includes these in a main function is


    ```

    #include "stat_lib.h"

    ```


    The use of this custom header is illustrated in the program in the next section.


    In addition to the custom header file with the statement, a program must also
    have access to the file stat_lib.cpp containing the statistical functions. The
    specific details of providing this access are platform dependent and may involve
    adding a file name to the operating system command that performs the compilation
    and loading operations.


