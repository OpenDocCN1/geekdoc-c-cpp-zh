    \ is the elements indexed by θ through mid -1. In the other case it is the elements\
    \ indexed by mid + 1 through final_index. The two extra parameters will specify\
    \ the first and last indices of the search, so we will call them first and last.\
    \ Using these parameters for the lowest and highest indices, instead of θ and\
    \ final_index, we can express the pseudocode more precisely as:\n\nTo search a[first]\
    \ through a[last] do the following:\n\n```\nfound = false; so for.\nmid = approximate\
    \ midpoint between first and last;\nif (key < a[mid])\n{\n  found = true;\n  location\
    \ = mid;\n}\nel if (key < a[mid])\n  search(a[first] through a[mid - 1]);\nelse\
    \ if (key > a[mid])\n  search(a[mid + 1] through a[last]);\n```\n\nTo search the\
    \ entire array, the algorithm would be executed with first set to 0 and last equal\
    \ to final_index. The recursive calls will use other values for first and last.\
    \ The first recursive call would set first equal to 0 and last equal to the calculated\
    \ value mid -1.\nWith any recursion we must ensure that our algorithm ends rather\
    \ than producing infinite recursion. If the sought-after number is not on the\
    \ list, there is no recursive call and the process terminates, and we need some\
    \ way to detect when the number is not on the list. On each recursive call, the\
    \ value of first is increased or the value of last is decreased. If ever pass\
    \ each other and first becomes larger than last, then we will know that there\
    \ are no more indexes to check and that the key is not in array. If we add this\
    \ to our pseudocode, we obtain a complete solution as in Display 5.\n\n# Coding\n\
