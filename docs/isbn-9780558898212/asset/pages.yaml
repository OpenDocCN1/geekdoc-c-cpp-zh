    A more involved process is necessary for computing determinants of matrices with
    more three rows and columns. This process is discussed in the problems at the
    end of this chapter.


    # Transpose


    The transpose of a matrix is a new matrix in which the rows of the original matrix
    are the columns of the new matrix. We use a superscript T after a matrix name
    to refer to the transpose. For example, consider the following matrix and its
    transpose:


    | 2 | 5 | 1 | | 2 | 7 | 4 | 16 |

    | B = 7 | 3 | 8 | | B^T = 5 | 3 | 5 | 13 |

    | | 4 | 5 | 21 | | 1 | 8 | 21 | 0 |

    | | 16 | 0 | | |


    If we consider an array of elements, we see that the value in position (3, 1),
    has moved to position (1, 3), and that the value in position (4, 2) has now moved
    to position (2, 4). In fact, we have exchanged the row and column offset so that
    we are moving the value in position (i, j) to (j, i). Also, note that the size
    of the transpose is different from the original matrix unless the is a square
    matrix (i.e., a matrix with the same number of rows as columns).


    We now develop a function that generates the transpose of a matrix. The formal
    arguments of the function include two-dimensional arrays that represent the original
    matrix and the matrix to contain the transpose of the original matrix. To allow
