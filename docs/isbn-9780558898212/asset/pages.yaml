  md: '# Control Structures


    Nested if/else statements do not always translate to a switch statement.

    However, when the conversion works, the switch statement is usually easier to
    read. It is also easier to determine the statement grouping needed for the switch
    statement.


    The switch statement selects the statements to perform based on a controlling
    expression, which must be an expression of integer or character. In the general
    form below, the case labels (label_1, label_2,...) determine which statements
    are executed, and thus in some languages this structure is called a case structure.
    The statements executed are ones that correspond to the case for which the label
    is equal to the controlling expression. The case labels must be unique constants;
    an error occurs if two or more of the case labels have the same value. The default
    clause is used to give a statement to execute if none of the other statements
    is executed; the default clause is optional.


    switch (controlling expression)


    ```

    case label_1:

    statements:

    case label_2:

    statements:

    ```


    ```

    default:

    statements:

    ```


    The statements in the switch structure usually contain the break statement. When
    the break statement is executed, the execution of the program breaks out of the
    switch structure and continues executing with the statement following the switch
    structure. Without the break statement, all statements will be executed that follow
    the ones selected with the case label


    Although the default clause in the switch statement is optional, we recommend
    that the steps are clearly specified for the situation in which none of the case
    labels is equal to the controlling expression. We also use the break statement
    in the default clause to emphasize that the program continues with the statement
    following the switch statement.


    It is valid to use several case labels with the same statement, as in


    switch (op_code)


    ```

    case ''N'':

    case ''R'':

    cout << "Normal operating range." << endl;

    break;

    case ''M'':

    cout << "Maintenance needed." << endl;

    break;

    default:

    cout << "Error in code value." << endl;

    break;

    ```


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_125_0.png)'
