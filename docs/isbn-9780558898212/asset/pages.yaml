  md: 'and can be shown in a diagram or a step-by-step outline. For very simple problems,
    such as the one that follows, we can go from the decomposition outline directly
    to the C++ statements:


    # Decomposition Outline


    +   1. Read the new time value.

    2. Compute the corresponding velocity and acceleration values.

    3. Print the new velocity and acceleration.


    For most problem solutions, we need to refine the decomposition outline into a
    description with more detail. This process is often referred to as a divide-and-conquer
    strategy, because we keep breaking the problem solution into smaller and smaller
    portions. To describe this stepwise refinement, we use pseudocode or flowcharts.


    The refinement of an outline into detailed steps can be done with pseudocode or
    a flowchart. Pseudocode uses English-like statements to describe the steps in
    an algorithm, and a flowchart uses a diagram to describe the steps in an algorithm.
    The fundamental steps in most algorithms are shown in Figure 1, along with the
    corresponding in pseudocode and flowcharts.


    Pseudocode and flowcharts are tools to help determine the order of steps to solve
    a problem. Both are commonly used, although they are not generally used with the
    same problem. In order to give examples of both, some solutions will use pseudocode
    and others use flowcharts; the choice between pseudocode and flowcharts to develop
    complex problem solutions; this is the stepwise refinement that we mentioned previously
    in this section. Decomposition outlines, pseudocode, and flowcharts are working
    models of the solution, and thus are not unique. Each person working on a solution
    will have different decomposition outlines and pseudocode or flowchart descriptions,
    just like the C++ programs developed by different people will be somewhat different,
    although they solve the problem.


    # Structured Programming


    A structured program is one written using simple structures to organize the solution
    to a problem. A simple structure is usually defined to be a sequence, selection,
    or a repetition. A sequence structure contains steps that are performed one after
    another; a selection structure contains one of steps that is performed if a condition
    is false; a repetition structure contains a set of steps that is repeated as long
    as a condition is true. We now discuss each of these simple structures and use
    pseudocode and flowcharts to give specific examples.


    A sequence contains steps that are performed one after another. For example, the
    pseudocode for the program that performed the linear interpolation follows, and
    the flowchart for the program that computed the velocity and acceleration of the
    aircraft with the undu engine is shown in Figure 2.'
