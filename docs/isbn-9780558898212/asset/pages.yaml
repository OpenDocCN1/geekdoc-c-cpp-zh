    };\n```\n```\n\nWe assign a type and an identifier to an array and distinguish\
    \ between **elements**, or values, in the array using **offsets**, also referred\
    \ to as indices or subscripts. Thus, by using the example arrays, the first value\
    \ in the array is referenced by `s[0]`, the second value in the array is referenced\
