    # Elementary Math Functions


    The elementary math functions include functions to perform a number of common
    computations such as computing the absolute value of a number and the square root
    of a number. In addition, they also include a group of functions used for perform
    rounding. These functions assume that the type of all arguments is double, and
    the functions return a double; if an argument is not a double, a conversion will
    occur using the rules in Section 2. The following preprocessor directive should
    be used in programs referencing the mathematical functions available in the Standard
    C++ library.


    We list these functions with a brief description:


    | fabs(x) | This function computes the absolute value of x. |

    | sqrt(x) | This function computes the square root of x, where x >= 0. |

    | pow(x,y) | This function is used to compute x to the power of y, or x^y. |

    | ceil(x) | Errors occur if x < 0 or y < 0 and y is not an integer. This function
    rounds x to the nearest integer infinity. For example, ceil(2.1) is equal to 3.
    |

    | floor(x) | This function rounds x to the nearest integer negative infinity.
    For example, floor(2.1) is equal to 2. |

    | exp(x) | This function computes the value of e^x, where e is the base for logarithms,
    and approximately 2.71828. This function returns ln x, the natural logarithm of
    x to the base e. Errors occur if x < 0. |

    | log(x) | This function returns log10x, the common logarithm of x to the base
    10. Errors occur if x <= 0. |


    ![](img/72b2466bd9e66322ea9c7b883e8b006c_83_0.png)


    Remember that the logarithm of a negative value or zero does not exist, and thus
    an error occurs if you use a logarithm function with a negative value for its
    argument.'
