  md: '# # Appendix C++ Standard Library


    This appendix presents a short discussion on the information defined in a few
    of the many header files in the C++ Library. These brief discussions are not intended
    to provide all the details necessary to use the functions, but to provide enough
    information so that you can determine whether the functions be of use in a particular
    application; you can then obtain more details from the Web. A good Web resource
    is http://www.cplusplus.com/ref/


    <cassert> provides a definition of the assert function that can be used to provide
    diagnostic information when testing a program. This system-dependent diagnostic
    information is stored in the error file, which can be accessed after a program
    is completed.


    <cctype> defines several functions for testing and converting characters. The
    function prototype statements and corresponding discussions use the following
    definitions:


    | | |

    | :--- | :--- |

    | digit | one of the characters 0123456789 |

    | hexadecimal digit | a digit or one of the characters ABCDEFabcdef |

    | uppercase letter | one of the characters ABCDEFGHIJKLQRSTUVWXYZ |

    | lowercase letter | one of the characters abcdefghijklmnopqrstuvwxyz |

    | alphabetic character | an uppercase or a lowercase letter |

    | alphanumeric character | a digit or an alphabetic character |

    | punctuation character | one of the characters !"#$%&''()*+,-./:;<=>?@[\]^_`{|}~
    |

    | graph character | an alphabetic character or a punctuation character |

    | print character | a graph character or one of the motion control characters
    form feed (FF), new line (LINE), carriage return (CR), horizontal tab (HT), vertical
    tab (VT) whitespace | the space character or one of the motion control characters
    control character | one of the motion control characters or bell (BEL) or backspace
    (BS) |


    We now list each function prototype and give a brief definition for the corresponding
    function:


    ```

