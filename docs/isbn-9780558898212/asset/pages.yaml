    to control an if-else statement, to control a loop statement, or be used anywhere
    else that a Boolean expression is allowed. The returned type for such a function
    should be the bool.


    A call to a function that returns a Boolean value of true or false can be used
    anywhere that a Boolean expression is allowed. This can often make a program easier
    to read. By means of a function declaration, you can associate a complex Boolean
    expression with a meaningful name and use the name as'
