  md: '# PROGRAMMING EXAMPLE Editing a Text File


    The program discussed here is a very simple example of text editing applied to
    files. It might be used by a software firm to update its advertising literature.
    The firm has been marketing compilers for the C programming language and has recently
    introduced a line of C++ compilers. This program can be used to automatically
    generate C++ advertising material from the C advertising material. The program
    takes its input from a file that contains advertising copy that says good about
    C and similar advertising copy about C++ in another file. The file that contains
    the C advertising copy is called c.dat, and the new file that receives the C++
    advertising copy is called cplusad.dat. The program is shown in Display.


    The program simply reads every character in the file c.dat and copies the characters
    to the file cplusad.dat. Every character is copied unchanged, except when the
    uppercase letter ''C'' is read from the input, the program writes "C++" to the
    output file. This program assumes that whenever the letter ''C'' occurs in the
    input file, it names the C programming language; thus, this change is exactly
    what is needed to produce the updated advertising copy.


    Notice the line breaks are preserved when the program reads characters from the
    input file and writes the characters to the output file. The new-line character
    ''\n'' is treated just like any other character. It is read from the input file
    with the member function get, and is written to the output file using the insertion
    operator <<. We must use the extraction operator >> to read the input, the program
    would skip over all the whitespace if we use the extraction operator, which means
    that none of the blanks and none of the new-line characters would be read from
    the input file, so they would not be copied to the output file.


    Also notice that the member function eof is to detect the end of the input file
    and the while loop.


    # Predefined Character Functions


    In processing, you want to convert lowercase letters to uppercase or vice versa.
    The predefined function toupper can be used to convert a lowercase letter to an
    uppercase letter. For example, the function toupper(''a'') returns ''A''. The
    argument to the function toupper is anything other than a lowercase letter, then
    toupper simply returns the argument unchanged. So toupper(''A'') also returns
    ''A''. The function tolower is similar except that it converts an uppercase letter
    to its lowercase version.


    The functions toupper and tolower are in the library with the header file cctype,
    so any program that uses these functions, or any other functions in this library,
    must contain the following include directive:


    ```

    #include <ctype>

    ```'
