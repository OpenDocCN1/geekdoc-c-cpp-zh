    for Ada a heavy dose of mathematics and science instruction. In 1842, Ada wrote
    the English translation of Menabrea''s Sketch of the Analytical Engine from its
    original French text. Her translation included lengthy and extensive commentary
    and detailed instructions for numerical computations.


    Ada Byron also envisioned the multidisciplinary potential of the Analytical Engine,
