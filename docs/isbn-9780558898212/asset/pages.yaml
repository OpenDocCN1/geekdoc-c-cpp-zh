  md: "to view the values of critical variables. The interface, commands, and capabilities\
    \ of debuggers vary among C++ compilers, so check your user manual or check with\
    \ your instructor for help on how to use these features.\n\n# The assert Macro\n\
    \nIn 3 we discussed the concept of preconditions and postconditions for subroutines.\
    \ The assert macro is a tool to ensure that the expected conditions are true at\
    \ the location of the assert statement. If the condition is not met then the program\
    \ will display an error message and abort. To use assert, include the definition\
    \ of assert in your program with the following include statement:\n\n```\n#include\
    \ <assert>\n```\n\nTo use assert add the following line of code at the location\
    \ where you would like to enforce the assertion with a boolean expression that\
    \ should evaluate to true:\n\n```\nassert(boolean_expression);\n```\n\nThe assert\
    \ statement is a macro, which is a construct similar to a function. For an example,\
    \ a subroutine that uses Newton's method to calculate the square root of n:\n\n\
    ![](img/72b2466bd9e66322ea9c7b883e8b006c_336_0.png)\n\nHere $\\sqrt{t_0}=1$ and\
    \ $\\sqrt{t_1}$ approaches the square root of $n$ as $i$ approaches infinity.\
    \ A subroutine that implements this algorithm requires that $n$ be a positive\
    \ number and the number of iterations we will repeat the calculation is also a\
    \ positive number. We can guarantee this condition by adding assert to the subroutine\
    \ as shown below:\n\n```\n// Approximates the square root of n using Newton's\
    \ Iteration.\n// Precondition: n is positive, num_iterations is positive\n// Postcondition:\
    \ returns the square root of n\ndouble double_sqroot(double n, int num_iterations)\n\
    {\n    double answer = 1;\n    int i = 0;\n    assert((n > 0) && (num_iterations\
    \ > 0));\n    while (i < num_iterations) {\n        answer = 0.5 * (answer + n\
    \ / answer);\n        i++;\n    }\n    return answer;\n}\n```"
