    \ data, 2, 100); // 向地址为 0x50 的设备发送 2 字节\n```\n\n#### 代码示例说明\n\n● 向地址为 `0x50`\
    \ 的 I2C 设备发送两个字节：将 `data` 的内容发送到 I2C 设备。\n\n#### 注意事项\n\n● 正确设置目标设备的 I2C 地址。\n\
