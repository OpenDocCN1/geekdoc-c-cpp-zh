    ## Summary


    This chapter covered PWM, GPIO interrupts, and I2C communication for advanced
    I/O operations on the STM32 NUCLEO-F446RE. The final project demonstrated PWM
    for LED brightness control and an interrupt to toggle the LED on/off with a button.
    These techniques enable versatile applications in embedded systems.


    # Timers in STM32


    ## Chapter Overview


    Timers are essential in embedded systems for managing delays, measuring time,
    and generating periodic signals. The STM32 NUCLEO-F446RE provides multiple hardware
    timers that can be configured for various timing functions, such as delays, pulse
    generation, and event timing. This chapter explains how to configure and use timers
    effectively, with a final project demonstrating LED blinking using timer-based
    interrupts.


    ## Chapter Goal


    ● Understand how to configure and use timers for delay and periodic events.


    ●      Learn how to create time delays and measure intervals.


    ●      Learn how to use timer interrupts for event-driven applications.


    ● Complete a project using a timer to create a periodic LED blink.


    ## Rules


    ● Enable Timer Clock: Enable the clock for each timer before configuring it.


    ● Set Timer Prescaler and Period: Adjust prescaler and period to define the timing
    interval.


    ● Use Timer Interrupts for Event-Driven Applications: Configure and enable interrupts
    for precise timing events.


    ● Configure Timer for PWM: Use timers to generate PWM signals if required.


    ● Use Auto-Reload Register for Repeated Intervals: Set the auto-reload register
    to repeat events automatically.


    ## Syntax Table


    | Serial No | Topic | Code Snippet | Simple Example |


    | 1 | Enable Timer Clock | __HAL_RCC_TIMx_CLK_ENABLE() | __HAL_RCC_TIM2_CLK_ENABLE()
    |


    | 2 | Configure Timer Prescaler | htim.Init.Prescaler = value | htim.Init.Prescaler
    = 8399 |


    | 3 | Set Timer Period | htim.Init.Period = value | htim.Init.Period = 999 |


    | 4 | Start Timer | HAL_TIM_Base_Start(&htim) | HAL_TIM_Base_Start(&htim2) |


    | 5 | Enable Timer Interrupt | HAL_TIM_Base_Start_IT(&htim) | HAL_TIM_Base_Start_IT(&htim2)
    |


    | 6 | Set Timer Auto-Reload | TIMx->ARR = value | TIM2->ARR = 1000 |


    | 7 | Delay using HAL | HAL_Delay(ms) | HAL_Delay(1000) |


    * * *


    ## Topic Explanations


    ### 1\. Enable Timer Clock


    #### What is Enabling the Timer Clock?


    Enabling the timer clock powers the timer peripheral, allowing it to be configured
    and used for timing operations like delays, counters, or periodic signals.


    #### Use Purpose


    ●      Power the Timer: Activates the timer clock to make it functional.


    ● Required for Timer Configuration: Without enabling the clock, the timer settings
    will have no effect.


    #### Syntax


    __HAL_RCC_TIMx_CLK_ENABLE();


    #### Syntax Explanation


    ● __HAL_RCC: Prefix for Reset and Clock Control functions in STM32’s HAL library.


    ●      TIMx: Specifies the timer to enable, such as  TIM2,  TIM3, etc.'
