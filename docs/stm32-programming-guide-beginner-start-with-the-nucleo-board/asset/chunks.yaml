  raw: 'Boolean operators allow logical operations to be performed on expressions,
    enabling complex decision-making within a program. In embedded systems, Boolean
    operators are crucial for evaluating multiple conditions simultaneously, such
    as checking multiple sensor thresholds or handling input from various buttons.
    This chapter covers the primary Boolean operators (AND,  OR, and  NOT), their
    syntax, and their practical use in STM32 embedded programming.


    ## Chapter Goal


    ●      Understand and use the main Boolean operators:  AND(&&),  OR(||), and  NOT(!).


    ●      Learn how to combine Boolean operators to create complex logical expressions.


    ● Implement Boolean logic in a practical project to control an LED based on multiple
    sensor conditions.


    ## Rules


    ● Use  AND to Check Multiple Conditions: Use the  && operator to ensure that all
    conditions are true.


    ● Use  OR for Alternative Conditions: Use the  || operator to allow actions if
    any of the conditions are true.


    ● Apply  NOT to Invert Conditions: Use the ! operator to reverse the logical state
    of a condition.


    ● Control Operator Precedence with Parentheses: Use parentheses to clarify and
    control the order of evaluation in complex expressions.


    ● Avoid Complex Expressions in Conditions: Keep expressions simple to maintain
    readability and prevent errors.


    ## Syntax Table


    | Serial No | Operator | Code Snippet | Simple Example |


    | 1 | AND (&&) | if (cond1 && cond2) { statements; } | if (temp > 25 && humidity
    < 50) { LED_ON(); } |


    | 3 | NOT (!) | if (!condition) { statements; } | if (!doorClosed) { LED_BLINK();
    } |


    * * *


    ## Topic Explanations


    ### 1\. AND Operator (&&)


    #### What is the AND Operator?


    The  && (AND) operator is a Boolean operator that evaluates to  true only if both
    conditions are true. In embedded systems,  && is useful for ensuring that multiple
    criteria are met before executing a specific action, such as turning on a fan
    only when both temperature and humidity exceed certain thresholds.


    #### Use Purpose


    ●      Check Multiple Conditions: Ensures that all specified conditions are true.


    ● Control System Responses: Used for actions that require multiple parameters,
    like checking sensor values.


    #### Syntax


    if  (condition1 && condition2)  {


    statements;


    }


    #### Syntax Explanation


    ●      condition1: The first logical expression to evaluate.


    ● &&: The AND operator, which requires both  condition1 and  condition2 to be
    true.


    ●      condition2: The second logical expression to evaluate.


    ● Operands: Can be variables, expressions, or function calls that return a boolean
    result.


    ●      Result: The statement block executes only if both conditions are true.


    #### Simple Code Example


    int temp =  30;


    int humidity =  40;


    if  (temp >  25  && humidity <  50)  {


    LED_ON(); // Turns on LED if temp > 25 and humidity < 50


    }


    #### Code Example Explanation


    ● Checks if both  temp is greater than 25 and  humidity is less than 50: Only
    if both conditions are true does the LED turn on.


    #### Notes


    ● Use  && to combine conditions that must all be true for the action to execute.


    ●      Combine multiple  && operators to check more than two conditions.


    #### Warnings


    ●      Avoid overly complex expressions to maintain readability.


    ●      Ensure all conditions are valid and won’t cause side effects.


    * * *


    ### 2\. OR Operator (||)


    #### What is the OR Operator?


    The  || (OR) operator is a Boolean operator that evaluates to  true if at least
    one of the specified conditions is true. In embedded systems, the OR operator
    is used to trigger actions when any one of multiple conditions is met, such as
    activating an alarm if either temperature or pressure exceeds a safe threshold.


    #### Use Purpose


    ● Alternative Condition Checking: Allows actions if one or more conditions are
    met.


    ●      Set Multiple Triggers: Useful for monitoring various inputs or sensors.


    #### Syntax


    if  (condition1 || condition2)  {


    statements;


    }


    #### Syntax Explanation


    ●      condition1: The first condition to evaluate.


    ● ||: The OR operator, which returns true if either  condition1 or  condition2
    is true.


    ●      condition2: The second condition to evaluate.


    ●      Operands: Typically variables, expressions, or functions returning boolean
    results.


    ● Result: The statement block executes if at least one of the conditions is true.


    #### Simple Code Example


    int button1 =  1;


    int button2 =  0;


    if  (button1 ==  1  || button2 ==  1)  {


    LED_TOGGLE(); // Toggles LED if either button1 or button2 is pressed


    }


    #### Code Example Explanation


    ● Checks if either  button1 or  button2 is pressed: The LED toggles if any of
    the buttons are pressed.


    #### Notes


    ● Use  || for conditions where any one of several triggers will execute the action.


    ●      Combine multiple  || operators to check more than two conditions.


    #### Warnings


    ● Be cautious with  || in complex expressions, as it can lead to unintended results.


    ●      Ensure conditions are simple for readability and maintainability.


    * * *


    ### 3\. NOT Operator (!)


    #### What is the NOT Operator?


    The ! (NOT) operator reverses the truth value of a condition. If the condition
    is true, ! makes it false, and if it is false, ! makes it true. In embedded systems,
    ! is used to check if a condition is not met, such as verifying that a switch
    is not pressed before turning on an LED.


    #### Use Purpose


    ● Invert Condition: Used when the action should occur only if the condition is
    false.


    ● Check Negative Conditions: Useful for checking if a state is inactive or a condition
    is unmet.


    #### Syntax


    if  (!condition)  {


    statements;


    }


    #### Syntax Explanation


    ●      !: The NOT operator, which inverts the result of the condition.


    ●      condition: The condition to be inverted.


    ●      Operand: A boolean condition or variable.


    ●      Result: The statement block executes only if the condition is false.


    #### Simple Code Example


    int doorClosed =  0;


    if  (!doorClosed)  {


    LED_BLINK();  // Blinks LED if door is not closed


    }


    #### Code Example Explanation


    ● Checks if  doorClosed is false (0): If  doorClosed is false, the LED blinks.


    #### Notes


    ● Use ! to simplify code where actions are required if a condition is not true.


    ●      Ideal for checking flags or status indicators.


    * * *


    ## Final Project: LED Control Based on Multiple Sensor Conditions


    ### Project Objective


    Control an LED based on readings from multiple sensors, using Boolean operators
    to manage complex conditions.


    ### Project Circuit


    | Component | Pin Description | Connection Details |


    | STM32 Microcontroller | GPIO Input (Sensors) | Reads input from temperature
    and humidity sensors |


    | LED | GPIO Output | Indicates conditions met |


    ### Project Code


    #include  "stm32f4xx_hal.h"


    ADC_HandleTypeDef hadc1;


    void ADC_Init(void)  {


    __HAL_RCC_ADC1_CLK_ENABLE();


    hadc1.Instance  = ADC1;


    hadc1.Init.Resolution  = ADC_RESOLUTION_12B;


    HAL_ADC_Init(&hadc1);


    }


    void LED_Control(int temp,  int humidity)  {


    if  (temp >  25  && humidity <  50)  {


    LED_ON();       // Turns on LED if temp > 25 and humidity < 50


    }  else  if  (temp >  30  || humidity >  60)  {


    LED_BLINK();    // Blinks LED if temp > 30 or humidity > 60


    }  else  if  (!temp)  {


    LED_OFF();      // Turns off LED if temp is zero (an error condition)


    }


    }


    int main(void)  {


    HAL_Init();


    ADC_Init();


    uint32_t tempValue, humidityValue;


    int temp, humidity;


    while  (1)  {


    HAL_ADC_Start(&hadc1);


    if  (HAL_ADC_PollForConversion(&hadc1, HAL_MAX_DELAY)  == HAL_OK)  {


    tempValue = HAL_ADC_GetValue(&hadc1);


    temp =  (tempValue *  100)  /  4095;  // Convert ADC value to temperature


    // Assuming a second ADC channel or conversion for humidity


    humidityValue = HAL_ADC_GetValue(&hadc1);


    humidity =  (humidityValue *  100)  /  4095;  // Convert ADC to humidity


    LED_Control(temp, humidity);


    }


    HAL_Delay(1000);


    }


    }


    ### Save and Run


    1.  Save the code as  main.c.


    2.  Compile and upload to the STM32 NUCLEO-F446RE using STM32CubeIDE or Keil.


    ### Check Output


    Expected behavior:'
