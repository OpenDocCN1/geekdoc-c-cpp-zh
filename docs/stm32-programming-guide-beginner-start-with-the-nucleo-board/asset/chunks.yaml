    \ `operand2`, executing the code in `{ }`.\n\n### Simple Code Example\n```c\n\
    int temp = 10;\n\nif (temp < 15) {\n    HEATER_ON(); // Turns on heater if temp\
    \ is below 15\n}\n```\n\n### Code Example Explanation\n- Checks if `temp` is less\
    \ than 15: If true, the heater turns on.\n\n### Notes\n- Useful for lower threshold\
    \ checks, like minimum safe values.\n- Often used in range checks along with the\
    \ `>` operator.\n\n***\n\n## 5. Greater Than or Equal To (>=)\n\n### What is the\
    \ Greater Than or Equal To Operator?\nThe `>=` operator checks if one value is\
    \ greater than or equal to another, ensuring that the value meets or exceeds a\
    \ specified level.\n\n### Use Purpose\n- Inclusive Upper Bound: Checks if a value\
    \ is above or exactly at a threshold.\n- Range Validation: Ensures a variable\
