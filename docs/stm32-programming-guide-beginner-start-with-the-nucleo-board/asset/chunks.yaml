    \n### 项目代码\n\n```c\n#include \"stm32f4xx_hal.h\"\n#include <stdio.h>\n\nADC_HandleTypeDef\
    \ hadc1;\n\nvoid ADC_Init(void) {\n    __HAL_RCC_ADC1_CLK_ENABLE();\n    hadc1.Instance\
