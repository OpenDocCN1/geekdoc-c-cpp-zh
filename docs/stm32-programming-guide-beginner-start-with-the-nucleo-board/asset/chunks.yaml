- fmt: "\nBoolean operators allow logical operations to be performed on expressions,\
    \ enabling complex decision-making within a program. In embedded systems, Boolean\
    \ operators are crucial for evaluating multiple conditions simultaneously, such\
    \ as checking multiple sensor thresholds or handling input from various buttons.\
    \ This chapter covers the primary Boolean operators (`AND`, `OR`, and `NOT`),\
    \ their syntax, and their practical use in STM32 embedded programming.\n\n## Chapter\
    \ Goal\n\n- Understand and use the main Boolean operators: `AND(&&&)`, `OR(||)`,\
    \ and `NOT(!(!)`.\n- Learn how to combine Boolean operators to create complex\
    \ logical expressions.\n- Implement Boolean logic in a practical project to control\
    \ an LED based on multiple sensor conditions.\n\n## Rules\n\n- Use `AND` to Check\
    \ Multiple Conditions: Use the `&&` operator to ensure that all conditions are\
    \ true.\n- Use `OR` for Alternative Conditions: Use the `||` operator to allow\
    \ actions if any of the conditions are true.\n- Apply `NOT` to Invert Conditions:\
    \ Use the `!` operator to reverse the logical state of a condition.\n- Control\
    \ Operator Precedence with Parentheses: Use parentheses to clarify and control\
    \ the order of evaluation in complex expressions.\n- Avoid Complex Expressions\
    \ in Conditions: Keep expressions simple to maintain readability and prevent errors.\n\
    \n## Syntax Table\n\n| Serial No | Operator | Code Snippet | Simple Example |\n\
    | :--- | :--- | :--- | :--- |\n| 1 | AND (&&) | `if (cond1 && cond2) { statements;\
    \ }` | `if (temp > 25 && humidity < 50) { LED_ON(); }` |\n| 3 | NOT (!!) | `if\
    \ (!condition) { statements; }` | `if (!doorClosed) { LED_BLINK(); }` |\n\n***\n\
    \n## Topic Explanations\n\n### 1. AND Operator (&&)\n\n#### What is the AND Operator?\n\
    \nThe `&&` (AND) operator is a Boolean operator that evaluates to `true` only\
    \ if both conditions are true. In embedded systems, `&&` is useful for ensuring\
    \ that multiple criteria are met before executing a specific action, such as turning\
    \ on a fan only when both temperature and humidity exceed certain thresholds.\n\
    \n#### Use Purpose\n\n- Check Multiple Conditions: Ensures that all specified\
    \ conditions are true.\n- Control System Responses: Used for actions that require\
    \ multiple parameters, like checking sensor values.\n\n#### Syntax\n\n```c\nif\
    \ (condition1 && condition2) {\n    statements;\n}\n```\n\n#### Syntax Explanation\n\
    \n- `condition1`: The first logical expression to evaluate.\n- `&&`: The AND operator,\
    \ which requires both `condition1` and `condition2` to be true.\n- `condition2`:\
    \ The second logical expression to evaluate.\n- Operands: Can be variables, expressions,\
    \ or function calls that return a boolean result.\n- Result: The statement block\
    \ executes only if both conditions are true.\n\n#### Simple Code Example\n\n```c\n\
    int temp = 30;\nint humidity = 40;\n\nif (temp > 25 && humidity < 50) {\n    LED_ON();\
    \ // Turns on LED if temp > 25 and humidity < 50\n}\n```\n\n#### Code Example\
    \ Explanation\n\n- Checks if both `temp` is greater than 25 and `humidity` is\
    \ less than 50: Only if both conditions are true does the LED turn on.\n\n####\
    \ Notes\n\n- Use `&&` to combine conditions that must all be true for the action\
    \ to execute.\n- Combine multiple `&&` operators to check more than two conditions.\n\
    \n#### Warnings\n\n- Avoid overly complex expressions to maintain readability.\n\
    - Ensure all conditions are valid and won’t cause side effects.\n\n***\n\n###\
    \ 2. OR Operator (||)\n\n#### What is the OR Operator?\n\nThe `||` (OR) operator\
    \ is a Boolean operator that evaluates to `true` if at least one of the specified\
    \ conditions is true. In embedded systems, the OR operator is used to trigger\
    \ actions when any one of multiple conditions is met, such as activating an alarm\
    \ if either temperature or pressure exceeds a safe threshold.\n\n#### Use Purpose\n\
    \n- Alternative Condition Checking: Allows actions if one or more conditions are\
    \ met.\n- Set Multiple Triggers: Useful for monitoring various inputs or sensors.\n\
    \n#### Syntax\n\n```c\nif (condition1 || condition2) {\n    statements;\n}\n```\n\
    \n#### Syntax Explanation\n\n- `condition1`: The first condition to evaluate.\n\
    - `||`: The OR operator, which returns true if either `condition1` or `condition2`\
    \ is true.\n- `condition2`: The second condition to evaluate.\n- Operands: Typically\
    \ variables, expressions, or functions returning boolean results.\n- Result: The\
    \ statement block executes if at least one of the conditions is true.\n\n####\
    \ Simple Code Example\n\n```c\nint button1 = 1;\nint button2 = 0;\n\nif (button1\
    \ == 1 || button2 == 1) {\n    LED_TOGGLE(); // Toggles LED if either button1\
    \ or button2 is pressed\n}\n```\n\n#### Code Example Explanation\n\n- Checks if\
    \ either `button1` or `button2` is pressed: The LED toggles if any of the buttons\
    \ are pressed.\n\n#### Notes\n\n- Use `||` for conditions where any one of several\
    \ triggers will execute the action.\n- Combine multiple `||` operators to check\
    \ more than two conditions.\n\n#### Warnings\n\n- Be cautious with `||` as it\
    \ can lead to unintended results.\n\n***\n\n### 3. NOT Operator (!)\n\n#### What\
    \ is the NOT Operator?\n\nThe `!` (NOT) operator is a Boolean operator that evaluates\
    \ to `true` only if both conditions are true. In embedded systems, `!` reverses\
    \ the logical state of a condition, such as turning on a fan.\n\n#### Use Purpose\n\
    \n- Invert Condition: Reverses the logical state of a condition.\n- Check Negative\
