- fmt: "\n- Enable Precise Calculations: Allows integer values to be used in floating-point\
    \ calculations without truncating results.\n- Avoid Integer Division Truncation:\
    \ Converting integers to floats before division prevents loss of decimal places.\n\
    \n#### Syntax\n\n```c\nfloat_var = (float)int_var;\n```\n\n#### Syntax Explanation\n\
    \n- `float_var`: The variable that will store the converted float value.\n- `(float)`:\
    \ Casts the integer to a float type.\n- `int_var`: The integer variable to convert.\n\
    \n#### Simple Code Example\n\n```c\nint i = 10;\nfloat f = (float)i; // Converts\
    \ i to 10.0 in float form\n```\n\n#### Code Example Explanation\n\n- Converts\
    \ integer `i` to `float`: Enables `f` to store `10.0`, allowing it to be used\
    \ in floating-point calculations.\n\n#### Notes\n\n- Conversion to `float` does\
    \ not change the value but changes how it’s stored and used in calculations.\n\
    \n#### Warnings\n\n- Implicitly converting integers to floats in expressions may\
    \ cause rounding errors in critical calculations.\n\n***\n\n## 4. Float to Integer\
    \ Conversion\n\n#### What is Float to Integer Conversion?\n\nFloat-to-integer\
    \ conversion removes the decimal part of a floating-point number, leaving only\
    \ the integer portion. This conversion is often used when an integer value is\
    \ required.\n\n#### Use Purpose\n\n- Truncate Decimal Part: Retains only the integer\
    \ part of a `float`.\n- Simplify Calculations: Converts floating-point results\
    \ to integers where fractional values are unnecessary.\n\n#### Syntax\n\n```c\n\
    int_var = (int)float_var;\n```\n\n#### Syntax Explanation\n\n- `int_var`: The\
    \ variable that will store the converted integer value.\n- `(int)`: Casts the\
    \ float to an integer type.\n- `float_var`: The floating-point variable to convert.\n\
    \n#### Simple Code Example\n\n```c\nfloat f = 2.7;\nint i = (int)f; // Converts\
    \ f to integer 2\n```\n\n#### Code Example Explanation\n\n- Truncates `f` to `2`:\
    \ The integer `i` receives only the integer part, discarding the decimal.\n\n\
    #### Notes\n\n- Truncation removes the fractional part; rounding is not performed.\n\
    - Use rounding functions like `round()` if needed.\n\n#### Warnings\n\n- Data\
    \ loss occurs as the fractional component is discarded.\n\n***\n\n## 5. String\
    \ to Integer Conversion\n\n#### What is String to Integer Conversion?\n\nString-to-integer\
    \ conversion parses a numeric string and returns its integer value. It’s commonly\
    \ used when receiving numeric data as text, like user input or serial data.\n\n\
    #### Use Purpose\n\n- Convert Numeric Strings: Allows numeric strings to be processed\
    \ as integers in calculations.\n- Parse User Input: Enables handling of numeric\
    \ input entered as text.\n\n#### Syntax\n\n```c\nint_var = atoi(string_var);\n\
    ```\n\n#### Syntax Explanation\n\n- `int_var`: The integer variable to store the\
    \ converted value.\n- `atoi`: Function that converts a string to an integer.\n\
    - `string_var`: The string variable containing the numeric value.\n\n#### Simple\
    \ Code Example\n\n```c\nchar s[] = \"123\";\nint i = atoi(s); // Converts string\
    \ \"123\" to integer 123\n```\n\n#### Code Example Explanation\n\n- Converts `s`\
    \ to integer: The string `\"123\"` becomes the integer `123`, allowing it to be\
    \ used in calculations.\n\n#### Notes\n\n- `atoi` returns `0` if the string is\
    \ non-numeric.\n- Use error checking to handle invalid strings.\n\n#### Warnings\n\
    \n- Converting a non-numeric string results in undefined behavior.\n\n***\n\n\
    ## 6. String to Float Conversion\n\n#### What is String to Float Conversion?\n\
    \nString-to-float conversion converts a numeric string to a floating-point value.\
    \ This is useful for processing numeric text that needs to be used in calculations.\n\
    \n#### Use Purpose\n\n- Convert Text to Float: Enables numeric text to be used\
    \ in floating-point calculations.\n- Handle Sensor Data: Useful when sensor readings\
    \ are received as strings.\n\n#### Syntax\n\n```c\nfloat_var = atof(string_var);\n\
    ```\n\n#### Syntax Explanation\n\n- `float_var`: The float variable to store the\
    \ converted value.\n- `atof`: Function that converts a string to a float.\n- `string_var`:\
    \ The string containing the numeric value.\n\n#### Simple Code Example\n\n```c\n\
    char s[] = \"3.14\";\nfloat f = atof(s); // Converts string \"3.14\" to float\
    \ 3.14\n```\n\n#### Code Example Explanation\n\n- Converts `s` to `float`: The\
    \ string `\"3.14\"` becomes the floating-point value `3.14`, allowing precise\
    \ calculations.\n\n#### Notes\n\n- `atof` does not handle non-numeric strings\
    \ well; it may return `0`.\n\n#### Warnings\n\n- Converting a non-numeric string\
    \ results in unexpected.\n\n***\n\n## 7. Integer to String Conversion\n\n####\
    \ What is Integer to String Conversion?\n\nInteger-to-string conversion transforms\
    \ integer values into text format. This is commonly used to display numbers on\
    \ screens.\n\n#### Use Purpose\n\n- Display Numbers: Useful for showing data.\n\
    - Prepare for Transmission: Sends numeric data as message.\n\n#### Syntax\n\n\
    ```c\nsprintf(string_var, \"%d\", int_var);\n```\n\n#### Syntax Explanation\n\n\
    - `string_var`: The variable to store the converted value.\n- `sprintf`: Function\
    \ to format data into a string.\n- `int_var`: The integer variable to convert.\n\
    \n#### Simple Code Example\n\n```c\nint i = 100;\nchar s[10];\nsprintf(s, \"%d\"\
    , i);\n```\n\n#### Code Example Explanation\n\n- Converts `i` to string: The integer\
    \ `100` is stored in `s`, making it suitable for display.\n\n#### Notes\n\n- Ensure\
    \ the buffer is large enough to hold the text.\n\n***\n\n## 8. Float to String\
    \ Conversion\n\n#### What is Float to String Conversion?\n\nFloat-to-string conversion\
    \ transforms floating-point values into text format. This is commonly used to\
    \ display measurements.\n\n#### Use Purpose\n\n- Display Measurements: Useful\
    \ for showing data on screens.\n- Prepare for Transmission: Sends data as message.\n\
    \n#### Syntax\n\n```c\nsprintf(string_var, \"%.2f\", float_var);\n```\n\n####\
    \ Syntax Explanation\n\n- `string_var`: The variable to store the converted value.\n\
    - `sprintf`: Function to format data into a string.\n- `float_var`: The floating-point\
    \ variable to convert.\n\n#### Simple Code Example\n\n```c\nfloat f = 3.14;\n\
    char s[10];\nsprintf(s, \"%.2f\", f);\n```\n\n#### Code Example Explanation\n\n\
    - Converts `f` to string: The floating-point value `3.14` is stored in `s`, suitable\
    \ for display.\n\n#### Notes\n\n- The `%.2f` specifier limits the output to 2\
    \ decimal places.\n\n***\n\n## Final Project: Sensor Data Conversion and Display\n\
    \n### Project Objective\n\nRead a sensor value, convert it to floating-point for\
    \ calculations, then display it as a string.\n\n### Project Circuit (In Table)\n\
    \n| Component | Pin Description | Connection Details |\n| :--- | :--- | :--- |\n\
    | STM32 Microcontroller | ADC Channel | Reads sensor voltage |\n| Potentiometer\
    \ or Sensor | Connected to ADC input | Provides analog data for conversion |\n\
    | LCD or Serial Monitor | Display | Shows converted sensor value |\n\n### Circuit\
    \ Analysis\n\n- ADC Input: Reads analog voltage from a sensor or potentiometer.\n\
    - Conversion: Converts ADC reading to float for calculations, then to string for\
    \ display.\n\n### Project Code\n\n```c\n#include \"stm32f4xx_hal.h\"\n#include\
    \ <stdio.h>\n\nADC_HandleTypeDef hadc1;\n\nvoid ADC_Init(void) {\n    __HAL_RCC_ADC1_CLK_ENABLE();\n\
    \    hadc1.Instance = ADC1;\n    hadc1.Init.Resolution = ADC_RESOLUTION_12B;\n\
    \    HAL_ADC_Init(&hadc1);\n}\n\nint main(void) {\n    HAL_Init();\n    ADC_Init();\n\
    \    char displayBuffer[20];\n    uint32_t adcValue;\n    float voltage;\n\n \
    \   while (1) {\n        HAL_ADC_Start(&hadc1);\n        if (HAL_ADC_PollForConversion(&hadc1,\
    \ HAL_MAX_DELAY) == HAL_OK) {\n            adcValue = HAL_ADC_GetValue(&hadc1);\n\
    \            voltage = (float)adcValue * (3.3 / 4095); // Convert ADC value to\
    \ voltage\n        }\n    }\n}\n```\n"
  raw: '● Enable Precise Calculations: Allows integer values to be used in floating-point
    calculations without truncating results.


    ● Avoid Integer Division Truncation: Converting integers to floats before division
    prevents loss of decimal places.


    #### Syntax


    float_var =  (float)int_var;


    #### Syntax Explanation


    ●      float_var: The variable that will store the converted float value.


    ●      (float): Casts the integer to a float type.


    ●      int_var: The integer variable to convert.


    #### Simple Code Example


    int i =  10;


    float f =  (float)i; // Converts i to 10.0 in float form


    #### Code Example Explanation


    ● Converts integer i to float: Enables f to store 10.0, allowing it to be used
    in floating-point calculations.


    #### Notes


    ● Conversion to float does not change the value but changes how it’s stored and
    used in calculations.


    #### Warnings


    ● Implicitly converting integers to floats in expressions may cause rounding errors
    in critical calculations.


    * * *


    ### 4\. Float to Integer Conversion


    #### What is Float to Integer Conversion?


    Float-to-integer conversion removes the decimal part of a floating-point number,
    leaving only the integer portion. This conversion is often used when an integer
    value is required.


    #### Use Purpose


    ●      Truncate Decimal Part: Retains only the integer part of a float.


    ● Simplify Calculations: Converts floating-point results to integers where fractional
    values are unnecessary.


    #### Syntax


    int_var =  (int)float_var;


    #### Syntax Explanation


    ●      int_var: The variable that will store the converted integer value.


    ●      (int): Casts the float to an integer type.


    ●      float_var: The floating-point variable to convert.


    #### Simple Code Example


    float f =  2.7;


    int i =  (int)f; // Converts f to integer 2


    #### Code Example Explanation


    ● Truncates f to 2: The integer i receives only the integer part, discarding the
    decimal.


    #### Notes


    ●      Truncation removes the fractional part; rounding is not performed.


    ●      Use rounding functions like  round() if needed.


    #### Warnings


    ●      Data loss occurs as the fractional component is discarded.


    * * *


    ### 5\. String to Integer Conversion


    #### What is String to Integer Conversion?


    String-to-integer conversion parses a numeric string and returns its integer value.
    It’s commonly used when receiving numeric data as text, like user input or serial
    data.


    #### Use Purpose


    ● Convert Numeric Strings: Allows numeric strings to be processed as integers
    in calculations.


    ●      Parse User Input: Enables handling of numeric input entered as text.


    #### Syntax


    int_var = atoi(string_var);


    #### Syntax Explanation


    ●      int_var: The integer variable to store the converted value.


    ●      atoi: Function that converts a string to an integer.


    ●      string_var: The string variable containing the numeric value.


    #### Simple Code Example


    char s[]  =  "123";


    int i = atoi(s); // Converts string "123" to integer 123


    #### Code Example Explanation


    ● Converts s to integer: The string "123" becomes the integer 123, allowing it
    to be used in calculations.


    #### Notes


    ●      atoi returns 0 if the string is non-numeric.


    ●      Use error checking to handle invalid strings.


    #### Warnings


    ●      Converting a non-numeric string results in undefined behavior.


    * * *


    ### 6\. String to Float Conversion


    #### What is String to Float Conversion?


    String-to-float conversion converts a numeric string to a floating-point value.
    This is useful for processing numeric text that needs to be used in calculations.


    #### Use Purpose


    ● Convert Text to Float: Enables numeric text to be used in floating-point calculations.


    ●      Handle Sensor Data: Useful when sensor readings are received as strings.


    #### Syntax


    float_var = atof(string_var);


    #### Syntax Explanation


    ●      float_var: The float variable to store the converted value.


    ●      atof: Function that converts a string to a float.


    ●      string_var: The string containing the numeric value.


    #### Simple Code Example


    char s[]  =  "3.14";


    float f = atof(s); // Converts string "3.14" to float 3.14


    #### Code Example Explanation


    ● Converts s to float: The string "3.14" becomes the floating-point value 3.14,
    allowing precise calculations.


    #### Notes


    ●      atof does not handle non-numeric strings well; it may return 0.


    ●      Handle errors for non-numeric strings.


    #### Warnings


    ●      Conversion of invalid strings may cause unexpected results.


    * * *


    ### 7\. Integer to String Conversion


    #### What is Integer to String Conversion?


    Integer-to-string conversion allows integer values to be converted into text format.
    This is often used to display numbers on screens or send numeric data as text.


    #### Use Purpose


    ● Display Numbers as Text: Essential for sending numeric data to displays or serial
    monitors.


    ● Prepare for Text-Based Communication: Sends integer values as part of string
    messages.


    #### Syntax


    sprintf(string_var,  "%d", int_var);


    #### Syntax Explanation


    ●      sprintf: Function to format data into a string.


    ●      string_var: The destination string.


    ●      "%d": Format specifier for integers.


    ●      int_var: The integer variable to convert.


    #### Simple Code Example


    int i =  100;


    char s[10];


    sprintf(s,  "%d", i); // Converts integer 100 to string "100"


    #### Code Example Explanation


    ● Converts i to string: Stores "100" in s, making it suitable for display or transmission.


    #### Notes


    ●      The  sprintf function is versatile, handling multiple data types.


    ● Ensure the string buffer is large enough to hold the converted text.


    * * *


    ### 8\. Float to String Conversion


    #### What is Float to String Conversion?


    Float-to-string conversion transforms a floating-point value into a text format.
    It’s commonly used to display measurements or send data as text.


    #### Use Purpose


    ●      Display Floating-Point Data: Useful for showing precise measurements on
    displays.


    ● Prepare Data for Transmission: Sends floating-point data as part of a string
    message.


    #### Syntax


    sprintf(string_var,  "%.2f", float_var);


    #### Syntax Explanation


    ●      sprintf: Function to format data into a string.


    ●      string_var: The destination string.


    ●      "%.2f": Format specifier for floats with 2 decimal places.


    ●      float_var: The floating-point variable to convert.


    #### Simple Code Example


    float f =  3.14;


    char s[10];


    sprintf(s,  "%.2f", f); // Converts float 3.14 to string "3.14"


    #### Code Example Explanation


    ● Converts f to string: Stores "3.14" in s, suitable for display or transmission.


    #### Notes


    ●      The  %.2f format specifier limits the output to 2 decimal places.


    ●      Adjust decimal places as needed.


    #### Warnings


    ●      Ensure sufficient buffer size to avoid overflow.


    * * *


    ## Final Project: Sensor Data Conversion and Display


    ### Project Objective


    Read a sensor value, convert it to floating-point for calculations, then display
