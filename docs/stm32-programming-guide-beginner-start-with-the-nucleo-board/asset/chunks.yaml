    # Printing Output in STM32


    ## Chapter Overview


    Printing output is essential for debugging, testing, and displaying data in embedded
    systems. Unlike general-purpose computers, microcontrollers often lack built-in
    display interfaces, so output is usually printed via serial communication to a
    terminal. The  printf function in C can be used with serial communication libraries
    to display information on a serial monitor. This chapter covers setting up  printf
    for serial output, using  printf formatting, and debugging techniques for STM32.


    ## Chapter Goal


    ●      Learn how to configure  printf for serial communication on STM32 microcontrollers.


    ●      Understand different  printf formatting options for various data types.


    ● Use  printf for debugging and displaying real-time data from sensors or other
    sources.


    ## Rules


    ● Redirect  printf to Serial Port: Use the  HAL_UART_Transmit function to send  printf
    output to a serial port.


    ● Use Format Specifiers Appropriately: Ensure the format specifier matches the
    data type being printed.


    ● Set Baud Rate Correctly: Match the baud rate in the serial monitor with the
    STM32’s UART configuration.


    ● Buffer Output Carefully: Use buffers to handle and format strings before sending
    data.


    ● Limit Printing in Real-Time Loops: Excessive printing can slow down real-time
    applications, so limit the frequency of output.


    ## Syntax Table


    | Serial No | Function | Code Snippet | Simple Example |


    | 1 | Print Integer | printf("%d", integer); | printf("Value: %d\n", 25); |


    | 2 | Print Float | printf("%f", floatValue); | printf("Temperature: %.2f\n",
    25.3); |


    | 3 | Print Character | printf("%c", character); | printf("Letter: %c\n", ''A'');
    |


    | 4 | Print String | printf("%s", string); | printf("Hello, %s\n", "World"); |


    | 5 | Print Hexadecimal | printf("%x", hexValue); | printf("Hex: %x\n", 255);
    |


    * * *


    ## Topic Explanations


    ### 1. Configuring  printf for Serial Communication


    #### What is Serial Communication with  printf?


    The  printf function in C, typically used for console output, can be redirected
    to a UART (serial port) to display output on a terminal monitor. This configuration
    is essential for STM32 microcontrollers, as they lack native display interfaces.
    The output can be viewed on a connected computer through a serial terminal (such
    as PuTTY or the Serial Monitor in STM32CubeIDE).


    #### Use Purpose


    ● Display Output: Send values, messages, and debugging information to a serial
    terminal.


    ● Debugging: Print sensor values, loop counts, and error codes to diagnose issues.


    #### Syntax


    int _write(int file,  char  *ptr,  int len)  {


    HAL_UART_Transmit(&huart2,  (uint8_t*)ptr, len, HAL_MAX_DELAY);


    return len;


    }


    #### Syntax Explanation


    ●      _write: The function that  printf calls internally to write output.


    ●      file: Ignored for standard  printf output in embedded systems.


    ●      ptr: The pointer to the string being printed.


    ●      len: The length of the string.


    ● HAL_UART_Transmit: Transmits data over UART, with  &huart2 specifying the UART
    handle (adjustable based on your configuration).


    ●      len: Returns the number of characters sent.


    #### Simple Code Example


    #include  "stm32f4xx_hal.h"


    #include  <stdio.h>


    UART_HandleTypeDef huart2;


    int _write(int file,  char  *ptr,  int len)  {


    HAL_UART_Transmit(&huart2,  (uint8_t*)ptr, len, HAL_MAX_DELAY);


    return len;


    }


    int main(void)  {


    HAL_Init();


    // UART2 initialization here (baud rate, GPIO config)


    printf("Hello, STM32!\n");


    }


    #### Code Example Explanation


    ●      Configures  printf for UART2: Redirects  printf output to UART2.


    ●      Prints "Hello, STM32!": Displays the text on the connected serial monitor.


    #### Notes


    ● Set up the UART with the desired baud rate, typically 9600 or 115200 bps.


    ●      _write is called by  printf to send data through UART.


    #### Warnings


    ● Ensure that UART configuration (baud rate, stop bits) matches the terminal settings.


    * * *


    ### 2\. Print Integer (%d)


    #### What is Integer Printing?


    Using  %d in  printf prints an integer value in decimal format. Integers are often
    used to represent discrete values like sensor readings or status codes.


    #### Use Purpose


    ●      Display Values: Print integer values like counts, IDs, and statuses.


    ●      Debugging: Observe integer values to check program flow or verify calculations.


    #### Syntax


    printf("%d", integer);


    #### Syntax Explanation


    ●      %d: Format specifier for printing integers.


    ●      integer: The variable containing the integer to print.


    #### Simple Code Example


    int  value  =  25;


    printf("Value: %d\n",  value); // Prints "Value: 25"


    #### Code Example Explanation


    ●      Displays the integer value of  value: Outputs  25 in decimal format.


    #### Notes


    ●      %d is for signed integers; use  %u for unsigned integers.


    #### Warnings


    ●      Mismatched format specifiers and data types can lead to incorrect output.


    * * *


    ### 3\. Print Float (%f)


    #### What is Float Printing?


    Using  %f in  printf displays a floating-point number. Floats are commonly used
    for decimal values, such as sensor readings and calculated results.


    #### Use Purpose


    ●      Display Measurements: Print values with decimal precision, like temperature
    or voltage.


    ●      Debugging Calculations: Display results of calculations with fractional
    values.


    #### Syntax


    printf("%f", floatValue);


    #### Syntax Explanation


    ●      %f: Format specifier for printing floating-point values.


    ●      floatValue: The variable containing the floating-point number to print.


    #### Simple Code Example


    float temperature =  25.3;


    printf("Temperature: %.2f\n", temperature); // Prints "Temperature: 25.30"


    #### Code Example Explanation


    ●      Prints  temperature to two decimal places: Outputs  25.30 with specified
    precision.


    #### Notes


    ●      Use  %.2f to print to two decimal places.


    ●      STM32 may require enabling  float printing in the standard library.


    #### Warnings


    ●      Floating-point printing may slow down real-time applications.


    * * *


    ### 4\. Print Character (%c)


    #### What is Character Printing?


    Using  %c in  printf prints a single character. This is useful for displaying
    individual symbols or ASCII values in embedded systems.


    #### Use Purpose


    ●      Display Characters: Print single characters or control characters.


    ●      Debugging: Useful for observing ASCII values or debugging text parsing.


    #### Syntax


    printf("%c", character);


    #### Syntax Explanation


    ●      %c: Format specifier for printing a character.


    ●      character: The variable containing the character to print.


    #### Simple Code Example


    char letter =  ''A'';


    printf("Letter: %c\n", letter); // Prints "Letter: A"


    #### Code Example Explanation


    ●      Displays  letter as a character: Outputs A to the terminal.


