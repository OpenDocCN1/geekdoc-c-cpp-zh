    # Random Numbers in STM32


    ## Chapter Overview


    Random number generation is widely used in embedded systems for applications like
    data simulation, randomized testing, and game development. In C programming, the
    standard library provides functions to generate pseudo-random numbers. Although
    true random number generation is limited on STM32 microcontrollers, we can use
    functions to create repeatable pseudo-random sequences suitable for most embedded
    applications. This chapter covers the essential functions for generating random
    numbers, seeding the random number generator, and applying random numbers within
    STM32 projects.


    ## Chapter Goal


    ● Understand and use the main functions for generating random numbers in C.


    ● Learn how to initialize the random number generator with a seed value.


    ●      Apply random numbers in a practical project to simulate sensor data.


    ## Rules


    ● Use  srand to Seed the Generator: Always initialize the random number generator
    with  srand to produce different random sequences on each run.


    ● Apply a Seed Based on Time: For a new random sequence in each execution, use
    a varying seed, such as the system time.


    ● Understand the Range of  rand: The  rand function generates numbers from 0 to  RAND_MAX,
    so apply modulo or scaling to restrict the range.


    ● Use Pseudo-Random Sequences: Recognize that  rand produces pseudo-random numbers,
    suitable for most embedded applications but not for cryptographic purposes.


    ● Optimize Random Usage in Real-Time Applications: Avoid overuse of random functions
    in timing-critical code to maintain performance.


    ## Syntax Table


    | Serial No | Function | Code Snippet | Simple Example |


    | 1 | Seed Random Number | srand(seed); | srand(time(NULL)); |


    | 2 | Generate Random Number | rand(); | int randomNumber = rand(); |


    | 3 | Random in Range | (rand() % range) + min; | int randomInRange = (rand()
    % 10) + 1; |


    * * *


    ## Topic Explanations


    ### 1\. Seed Random Number (srand)


    #### What is the Seed Random Number Function?


    The  srand function initializes the random number generator with a seed value,
    making the random number sequence different on each program execution. Without
    setting a seed,  rand generates the same sequence every time the program runs,
    which can be useful in debugging but may not be desirable in many applications.


    #### Use Purpose


    ● Randomize Sequence: Seeds the generator for different random sequences on each
    run.


    ●      Controlled Random Sequences: Use a fixed seed for repeatable pseudo-random
    sequences.


    #### Syntax


    srand(seed);


    #### Syntax Explanation


    ●      srand: Function that seeds the random number generator.


    ● seed: The value to initialize the random number sequence. A common choice is  time(NULL),
    which uses the current system time.


    #### Simple Code Example


    #include  <stdlib.h>


    #include  <time.h>


    srand(time(NULL)); // Seeds random generator with current time


    #### Code Example Explanation


    ● Uses the current time as the seed: Each execution generates a different random
    sequence based on the time of day.


    #### Notes


    ● Always seed the generator with  srand before calling  rand to avoid generating
    the same sequence.


    ● Use a constant seed (like  srand(1)) if you need the same random sequence each
    time.


    #### Warnings


    ● Calling  srand multiple times within the same program can reset the sequence
    unpredictably; call it once at the beginning of the program.


    * * *


    ### 2\. Generate Random Number (rand)


    #### What is the Random Number Generation Function?


    The  rand function generates a pseudo-random integer between 0 and  RAND_MAX.  RAND_MAX
    is defined in  stdlib.h and is often 32767, but it may vary depending on the system.


    #### Use Purpose


    ●      Basic Random Generation: Generates a pseudo-random number in a fixed range.


    ● Data Simulation: Useful for simulating sensor data, testing algorithms, and
    creating random behavior.


    #### Syntax


    int randomValue = rand();


    #### Syntax Explanation


    ●      rand: Function that generates a pseudo-random integer.


    ●      randomValue: Stores the generated random number.


    ●      Return Range: The value is between 0 and  RAND_MAX.


    #### Simple Code Example


    #include  <stdlib.h>


    int randomNumber = rand(); // Generates a random integer


    #### Code Example Explanation


    ● Generates a random integer: The result is a pseudo-random value between 0 and  RAND_MAX.


    #### Notes


    ● Calling  rand without  srand generates the same sequence each run, so always
    seed with  srand first.


    ● Use modulo arithmetic with  rand to limit the result to a specific range.


    * * *


    ### 3\. Generate Random Number in a Specific Range


    #### What is the Random Range Function?


    By using modulo and offset with  rand, you can generate random numbers within
    a specified range. This is useful in applications where you need a specific minimum
    and maximum value, such as generating temperatures or positions.


    #### Use Purpose


    ● Limit Range: Produces random values within a specified minimum and maximum range.


    ● Simulation Control: Used in simulation to generate values that fit specific
    requirements.


    #### Syntax


    int randomInRange =  (rand()  % range)  + min;


    #### Syntax Explanation


    ● rand() % range: Limits the random number to  range possible values (0 to  range
    - 1).


    ●      + min: Shifts the result to start at  min.


    ● Operands:  range is the size of the range, and  min is the minimum value of
    the range.


    #### Simple Code Example


    #include  <stdlib.h>


    #include  <time.h>


    srand(time(NULL));


    int randomInRange =  (rand()  %  10)  +  1; // Generates a random number between
    1 and 10


    #### Code Example Explanation


    ● Generates a random number between 1 and 10: The modulo limits the result to
    10 possible values, and adding 1 shifts it to the range of 1–10.


    #### Notes


    ●      Adjust  range and  min as needed for other specific ranges.


    ● Useful for simulating specific data ranges, like sensor values or game positions.


    * * *


    ## Final Project: Randomized Sensor Data Simulation


    Simulate temperature data from a sensor by generating random values within a realistic
    range. Display the random temperature data periodically to simulate a real-time
    sensor reading.


