    ### 7\. Send I2C Data


    #### What is Sending I2C Data?


    Sending data over I2C allows the microcontroller to communicate with I2C-compatible
    devices such as sensors and EEPROMs.


    #### Use Purpose


    ● Transmit Data to I2C Devices: Sends commands or data to devices on the I2C bus.


    ● Interface with Sensors: Used for applications like reading sensor data or controlling
    displays.


    #### Syntax


    HAL_I2C_Master_Transmit(&hi2c, address, data, size, timeout);


    #### Syntax Explanation


    ● HAL_I2C_Master_Transmit: HAL function for sending data from the microcontroller
    to an I2C device.


    ● &hi2c: Pointer to the I2C handle, representing the I2C peripheral in use.


    ●      address: The I2C address of the target device.


    ●      data: Pointer to the data buffer to transmit.


    ●      size: Number of bytes to transmit.


    ●      timeout: Maximum wait time for data transmission to complete.


    #### Simple Code Example


    uint8_t data[2]  =  {0x01,  0x02};


    HAL_I2C_Master_Transmit(&hi2c1,  0x50, data,  2,  100); // Transmits 2 bytes to
    device at address 0x50


    #### Code Example Explanation


    ● Transmits two bytes to an I2C device at address 0x50: Sends the contents of  data
    to the I2C device.


    #### Notes


    ●      Set the target device’s I2C address properly.


    ● Use appropriate data size and timeout based on the device’s communication needs.


    #### Warnings


    ●      Mismatched addresses or data size errors can cause communication failure.


