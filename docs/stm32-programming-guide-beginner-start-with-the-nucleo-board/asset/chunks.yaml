    # Constants and Variables in STM32


    ## Chapter Overview


    Constants and variables are foundational in embedded systems programming, allowing
    you to store and manipulate data. Constants hold fixed values that do not change,
    while variables can store information that changes over time. Understanding how
    to declare, use, and manage constants and variables effectively is crucial in
    STM32 embedded applications.


    ## Chapter Goal


    ● Learn how to declare, initialize, and use constants and variables in C.


    ● Understand the different types of variables (local, global, static) and their
    scope.


    ● Explore best practices for using constants and variables in embedded systems
    programming.


    ## Rules


    ● Use Constants for Fixed Values: Store values that should remain the same throughout
    the program using constants.


    ● Declare Variables Based on Scope Needs: Use local variables for temporary data,
    global variables for shared data, and static variables to retain values across
    function calls.


    ● Choose the Correct Data Type: Optimize memory and processing by selecting the
    appropriate data type for each variable.


    ● Avoid Unnecessary Global Variables: Limit the use of global variables to reduce
    memory usage and prevent data conflicts.


    ## Syntax Table


    | Serial No | Topic | Code Snippet | Simple Example |


    | 1 | Declare Constant | #define CONSTANT_NAME value | #define PI 3.14159 |


    | 2 | Declare Global Variable | data_type variable_name; | int counter; |


    | 3 | Declare Local Variable | data_type variable_name; | float temperature; |


    | 4 | Initialize Variable | data_type variable_name = value; | int count = 0;
    |


    | 5 | Declare Static Variable | static data_type variable_name = value; | static
    int persistent_value = 5; |


    | 6 | Declare Constant with  const | const data_type variable_name = value; |
    const float GRAVITY = 9.81; |


    | 7 | Scope of Variables | Local: Within function, Global: Outside functions |
    void func() { int x = 5; } int y = 10; |


    * * *


    ## Topic Explanations


    ### 1\. Declare Constant


    #### What is Declaring a Constant?


    Declaring a constant allows you to define a fixed value that remains unchanged
    throughout the program. In embedded systems, constants are often used for settings,
    configuration values, or mathematical constants.


    #### Use Purpose


    ● Store Fixed Values: Holds values that should not change during program execution,
    such as PI, speed limits, or sensor thresholds.


    ● Improve Code Readability: Named constants provide a clear description of their
    purpose, improving code readability.


    #### Syntax


    #define CONSTANT_NAME value


    #### Syntax Explanation


    ●      #define: Preprocessor directive used to create constants.


    ● CONSTANT_NAME: The name of the constant, typically written in uppercase to distinguish
    it from variables.


    ●      value: The fixed value assigned to the constant.


    #### Simple Code Example


    #define PI 3.14159 // Declares a constant for the value of PI


    #### Code Example Explanation


    ● Defines  PI as 3.14159:  PI is a constant and cannot be modified, representing
    the mathematical constant π.


    #### Notes


    ●      Constants declared with  #define do not take up memory space.


    ●      Use uppercase names for constants to distinguish them from variables.


    #### Warnings


    ● Do not attempt to change a constant’s value, as it may lead to unexpected behavior.


    * * *


    ### 2\. Declare Global Variable


    #### What is Declaring a Global Variable?


    A global variable is accessible from any part of the program. Declaring a variable
    globally allows it to be shared across multiple functions.


    #### Use Purpose


    ● Share Data Across Functions: Useful for counters, flags, and configuration values
    that need to be accessed globally.


    ●      Store Persistent Data: Retains value throughout the program’s execution.


    #### Syntax


    data_type variable_name;


    #### Syntax Explanation


    ● data_type: Specifies the type of the variable, such as  int,  float, or  char.


    ● variable_name: The name of the variable, which follows naming rules and conventions.


    #### Simple Code Example


    int counter; // Declares a global integer variable named ''counter''


    #### Code Example Explanation


    ● Defines  counter as a global integer:  counter can be accessed and modified
    from any function within the program.


    #### Notes


    ● Global variables are generally declared at the top of the program file.


    ●      Use descriptive names to indicate the purpose of global variables.


    #### Warnings


    ● Excessive use of global variables can lead to memory conflicts and make debugging
    more difficult.


    * * *


    ### 3\. Declare Local Variable


    #### What is Declaring a Local Variable?


    A local variable is declared within a function and is accessible only within that
    function. Local variables help encapsulate data within specific parts of a program.


    #### Use Purpose


    ● Limit Variable Scope: Local variables are confined to the function they are
    declared in, preventing unintended modifications from other parts of the program.


    ● Manage Temporary Data: Useful for storing temporary data needed only within
    a specific function.


    #### Syntax


    data_type variable_name;


    #### Syntax Explanation


    ● data_type: Defines the type of the variable, such as  int,  float, or  char.


    ●      variable_name: The name of the variable, following naming conventions.


    #### Simple Code Example


    void exampleFunction()  {


    int temperature =  25; // Declares a local variable ''temperature''


    }


    #### Code Example Explanation


    ● Defines  temperature as a local integer:  temperature is confined to  exampleFunction
    and cannot be accessed outside it.


    #### Notes


    ●      Local variables are initialized each time the function is called.


    ●      Use meaningful names to represent the data stored in local variables.


    #### Warnings


    ●      Local variables do not retain their values between function calls.


    * * *


    ### 4\. Initialize Variable


    #### What is Initializing a Variable?


    Initializing a variable involves assigning it an initial value at the time of
    declaration. This ensures the variable has a defined value before it is used.


    #### Use Purpose


    ● Avoid Uninitialized Data: Initialization prevents the use of undefined or random
    values.


    ● Prepare Variables for Use: Sets starting values for counters, flags, or configuration
    parameters.


    #### Syntax


    data_type variable_name =  value;


    #### Syntax Explanation


    ●      data_type: Specifies the type of the variable.


    ●      variable_name: The name of the variable.


    ●      value: The initial value assigned to the variable.


    #### Simple Code Example


    int count =  0; // Initializes ''count'' with a value of 0


