    ## Topic Explanations


    ### 1\. Implicit Conversion


    #### What is Implicit Conversion?


    Implicit conversion happens automatically when one data type is assigned to a
    variable of another compatible type. In C, this occurs when an expression combines
    different types, and the compiler converts one type to another without explicit
    instructions.


    #### Use Purpose


    ● Automatic Conversion in Expressions: Simplifies code by automatically adjusting
    types in mixed-type expressions.


    ● Maintain Precision in Calculations: When combining integers and floats, implicit
    conversion promotes the integer to float for accurate results.


    #### Syntax


    result = integer +  float;


    #### Syntax Explanation


    ●      integer: An integer variable or value.


    ● + float: The integer is implicitly converted to a float to perform the addition
    with the float value.


    ●      result: The result is stored as a float, maintaining precision.


    #### Simple Code Example


    int i =  5;


    float f =  2.5;


    float result = i + f; // i is implicitly converted to float


    #### Code Example Explanation


    ● Integer i is implicitly converted to float: The addition produces a floating-point
    result of 7.5, stored in  result.


    #### Notes


    ● Implicit conversion occurs when combining types, such as adding an integer to
    a float.


    ●      Conversion follows a hierarchy: smaller types are converted to larger types.


    #### Warnings


    ● Implicit conversions can cause data loss when converting from float to int.


    * * *


    ### 2\. Explicit Conversion (Casting)


    #### What is Explicit Conversion (Casting)?


    Explicit conversion, or casting, allows you to convert a variable to a specific
    type manually. This provides more control over data conversions and avoids unintended
    implicit conversions.


    #### Use Purpose


    ●      Ensure Correct Type Conversion: Useful when converting between incompatible
    types.


    ● Avoid Data Loss Warnings: Explicit conversion prevents compiler warnings about
    possible data loss.


    #### Syntax


    (new_type)variable_name;


    #### Syntax Explanation


    ●      (new_type): The type to which you want to convert the variable.


    ●      variable_name: The variable to convert.


    #### Simple Code Example


    float f =  3.14;


    int i =  (int)f; // Explicitly converts f to int, resulting in 3


    #### Code Example Explanation


    ● Converts f to an integer: By casting, f is truncated to 3, as the decimal part
    is removed.


    #### Notes


    ● Explicit conversion is necessary when converting from  float to  int or between
    incompatible types.


    ●      Casting is also used to avoid unintended implicit conversions.


    #### Warnings


    ●      Casting a floating-point number to an integer discards the fractional part.


    * * *


    ### 3\. Integer to Float Conversion


    #### What is Integer to Float Conversion?


    Integer-to-float conversion is an explicit type conversion that changes an integer
    to a floating-point number. This is often necessary for accurate calculations
    involving both integers and floats.


