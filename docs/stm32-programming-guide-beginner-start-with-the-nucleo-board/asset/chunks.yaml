    \ 配置的实际应用。\n\n## 重要的规则\n\n- 启用 GPIO 时钟：在没有外部连接时，内部上拉和下拉电阻有助于在 GPIO 输入引脚上保持稳定的逻辑电平（高或低）。这对于稳定的信号读取至关重要，特别是对于开关。\n\
    - 设置引脚模式：GPIO 引脚可以配置为数字输入或输出。\n- 使用上拉/下拉电阻：在没有外部连接时，内部上拉和下拉电阻有助于在 GPIO 输入引脚上保持稳定的逻辑电平（高或低）。这对于稳定的信号读取至关重要，特别是对于开关。\n\
    \n- 配置 GPIO 引脚模式：必须设置 GPIO 引脚的模式以确定其行为（例如，输入、输出、复用）。\n- 使用上拉/下拉电阻：在没有外部连接时，内部上拉和下拉电阻有助于在\
    \ GPIO 输入引脚上保持稳定的逻辑电平（高或低）。这对于稳定的信号读取至关重要，特别是对于开关。\n\n- 启用 GPIO 时钟：在没有外部连接时，内部上拉和下拉电阻有助于在\
    \ GPIO 输入引脚上保持稳定的逻辑电平（高或低）。这对于稳定的信号读取至关重要，特别是对于开关。\n\n#### 什么是启用 GPIO 时钟？\n启用\
    \ GPIO 时钟为 GPIO 端口提供供电，使其引脚可以用于配置和使用。如果不启用时钟，对端口的任何操作将无效。\n\n#### 语法\n启用时钟的语法。\n\
    \n#### 语法说明\n- __HAL_RCC：用于 STM32 HAL（硬件抽象层）中与复位和时钟控制（RCC）相关的的前缀。\n- GPIOx：指定要启用的\
    \ GPIO 端口，例如 `GPIOA`、`GPIOB` 或 `GPIOC`。\n- CLK_ENABLE()：启用指定外设时钟的宏函数，使其接收电源并工作。\n\
    \n#### 简单代码示例\n`__HAL_RCC_GPIOA_CLK_ENABLE();` // 启用 GPIOA 时钟\n\n#### 代码示例说明\n\
    - 启用 GPIOA 时钟：为 GPIO 端口 A 电，使其引脚可以进行配置和使用。\n- GPIO 操作是必须的：如果没有此行，任何涉及 GPIOA 的配置将失效。\n\
    \n#### 注意事项\n- 仅对用到的 GPIO 端口启用时钟以优化功耗。\n- 每个 GPIO 端口都需要自己的时钟启用函数。\n\n#### 警告\n\
    - 跳过时钟启用会导致端口的 GPIO 配置和操作无效。\n\n***\n\n### 2. 配置 GPIO 引脚模式\n\n#### 什么是配置 GPIO\
    \ 引脚模式？\n\n"
- fmt: "\nThe GPIO pin mode setting determines how each GPIO pin behaves—whether it\
    \ acts as an input, output, or alternate function pin.\n\n#### Purpose\n\n- Define\
    \ Pin Functionality: Configures the pin to function as an input, output, or alternate\
    \ function pin.\n- Control Signal Direction: Sets the pin to either send (output)\
    \ or receive (input) digital signals.\n\n#### Syntax\n\n```\nGPIO_InitStruct.Mode\
    \ = GPIO_MODE_xxx;\n```\n\n#### Syntax Explanation\n\n- `GPIO_InitStruct`: A structure\
    \ in the STM32 HAL library that holds the configuration settings for a GPIO pin.\n\
    - `.Mode`: A member of `GPIO_InitStruct` that defines the mode for the GPIO pin.\n\
    - `GPIO_MODE_xxx`: Mode options include:\n  - `GPIO_MODE_INPUT`: Configures the\
    \ pin to act as a digital input.\n  - `GPIO_MODE_OUTPUT_PP`: Sets the pin as a\
    \ push-pull output, where the pin actively drives high and low states.\n  - `GPIO_MODE_AF_PP`:\
    \ Configures the pin for an alternate function (e.g., UART, SPI) in push-pull\
    \ mode.\n\n#### Simple Code Example\n\n```\nGPIO_InitTypeDef GPIO_InitStruct;\n\
    GPIO_InitStruct.Pin = GPIO_PIN_5;\nGPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\
    \ // Sets pin as push-pull output\n```\n\n#### Code Example Explanation\n\n- Defines\
    \ a configuration structure (`GPIO_InitStruct`): Holds settings for configuring\
    \ GPIO.\n- Sets GPIO pin 5 as output: Configures pin 5 to actively drive high\
    \ and low voltages for controlling devices like LEDs.\n\n#### Notes\n\n- Push-pull\
    \ mode is commonly used for digital outputs.\n- For alternate functions (e.g.,\
    \ UART, SPI), use `GPIO_MODE_AF_PP` with the appropriate alternate function number.\n\
    \n#### Warnings\n\n- Incorrect mode selection, such as configuring an input pin\
    \ as an output, may result in hardware conflicts or malfunction.\n\n***\n\n###\
    \ 3. Configure GPIO Speed\n\n#### What is Configuring GPIO Speed?\n\nThe GPIO\
    \ speed setting specifies how fast a GPIO pin can change states, affecting the\
    \ maximum frequency of output signals. Faster speeds enable quick state changes\
    \ but increase power consumption and noise.\n\n#### Purpose\n\n- Control Signal\
    \ Switching Rate: Sets the maximum frequency at which a GPIO pin can switch between\
    \ high and low.\n- Optimize Power and Performance: Lower speeds conserve power,\
    \ while higher speeds allow rapid changes for high-frequency signals.\n\n####\
    \ Syntax\n\n```\nGPIO_InitStruct.Speed = GPIO_SPEED_xxx;\n```\n\n#### Syntax Explanation\n\
    \n- `GPIO_InitStruct`: Configuration structure for GPIO settings.\n- `.Speed`:\
    \ A member of `GPIO_InitStruct` that defines the switching speed of the GPIO pin.\n\
    - `GPIO_SPEED_xxx`: Options include:\n  - `GPIO_SPEED_LOW`: Reduces power consumption,\
    \ suitable for slower signals.\n  - `GPIO_SPEED_MEDIUM`: Balances power usage\
    \ and performance.\n  - `GPIO_SPEED_HIGH`: Maximizes speed, suitable for high-frequency\
    \ signals, but consumes more power.\n\n#### Simple Code Example\n\n```\nGPIO_InitStruct.Speed\
    \ = GPIO_SPEED_LOW; // Configures the pin with low speed\n```\n\n#### Code Example\
    \ Explanation\n\n- Sets GPIO pin speed to low: Reduces power usage, ideal for\
    \ applications where the signal does not need to change rapidly.\n\n#### Notes\n\
    \n- Choose lower speeds when possible to save power and reduce noise.\n- Use higher\
    \ speeds only when necessary for high-frequency signaling.\n\n#### Warnings\n\n\
    - Using high-speed settings unnecessarily increases power consumption and can\
    \ cause electromagnetic interference (EMI).\n\n***\n\n### 4. Set Output High\n\
    \n#### What is Setting Output High?\n\nSetting a GPIO output high drives the pin\
    \ to a logical high level, providing a positive voltage (typically 3.3V or 5V)\
    \ to power or signal connected components.\n\n#### Purpose\n\n- Activate External\
    \ Devices: Provides a high logic level to power LEDs, relays, or other components.\n\
    - Signal Logical High: Sets the pin to a logic \"1\" or high voltage level, commonly\
    \ used to turn on connected components.\n\n#### Syntax\n\n```\nHAL_GPIO_WritePin(GPIOx,\
    \ GPIO_PIN_y, GPIO_PIN_SET);\n```\n\n#### Syntax Explanation\n\n- `HAL_GPIO_WritePin`:\
    \ HAL function that writes a logical state (high or low) to a specified GPIO pin.\n\
    - `GPIOx`: The GPIO port where the pin is located (e.g., `GPIOA`).\n- `GPIO_PIN_y`:\
    \ The specific GPIO pin number on the port (e.g., `GPIO_PIN_5`).\n- `GPIO_PIN_SET`:\
    \ Sets the output to a high logic level (3.3V or 5V, depending on system configuration).\n\
    \n#### Simple Code Example\n\n```\nHAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_SET);\
    \ // Sets PA5 to high\n```\n\n#### Code Example Explanation\n\n- Sets GPIO pin\
    \ PA5 to high: Provides a logic high voltage on `PA5`, turning on an LED or signaling\
    \ a connected device.\n- Configures pin as output: The pin must be set as an output\
    \ in `GPIO_InitStruct` for this command to work.\n\n#### Notes\n\n- Ensure the\
    \ pin must be set as an output in `GPIO_InitStruct` for this command to work.\n\
    - `GPIO_PIN_SET` drives the output to a high level.\n\n#### Warnings\n\n- Incorrect\
    \ mode selection, such as configuring an input pin as an output, may result in\
    \ hardware conflicts or malfunction.\n\n***\n\n### 5. Set Output Low\n\n#### What\
    \ is Setting Output Low?\n\nSetting a GPIO output low drives the pin to a logical\
    \ low level, pulling it to ground.\n\n#### Purpose\n\n- Deactivate External Devices:\
    \ Provides a low logic level to power LEDs, relays, or other components.\n- Signal\
    \ Logical Low: Sets the pin to a logic \"0\" or low voltage level, commonly used\
    \ to turn off connected components.\n\n#### Syntax\n\n```\nHAL_GPIO_WritePin(GPIOx,\
    \ GPIO_PIN_y, GPIO_PIN_RESET);\n```\n\n#### Syntax Explanation\n\n- `HAL_GPIO_WritePin`:\
    \ HAL function that writes a logical state (high or low) to a specified GPIO pin.\n\
    - `GPIOx`: The GPIO port where the pin is located (e.g., `GPIOA`).\n- `GPIO_PIN_y`:\
    \ The specific GPIO pin number on the port (e.g., `GPIO_PIN_5`).\n- `GPIO_PIN_RESET`:\
    \ Sets the output to a low logic level (0V).\n\n#### Simple Code Example\n\n```\n\
    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_RESET); // Sets PA5 to low\n```\n\
    \n#### Code Example Explanation\n\n- Sets GPIO pin PA5 to low: Provides a logic\
    \ low voltage on `PA5`, turning off an LED or signaling a connected device.\n\
    - Configures pin as output: The pin must be set as an output in `GPIO_InitStruct`\
    \ for this command to work.\n\n#### Notes\n\n- Ensure the pin must be set as an\
    \ output in `GPIO_InitStruct` for this command to work.\n- `GPIO_PIN_RESET` drives\
    \ the output to a low level.\n\n#### Warnings\n\n- Incorrect mode selection, such\
    \ as configuring an input pin as an output, may result in hardware conflicts or\
    \ malfunction.\n\n***\n\n### 6. Toggle GPIO Pin\n\n#### What is Toggling GPIO\
    \ Pin?\n\nToggling a GPIO pin switches it between high and low states. It is commonly\
    \ used for blinking LEDs or generating square waves.\n\n#### Purpose\n\n- Create\
    \ Blinking or Pulsing Effects: Toggling at regular intervals is useful for indicators.\n\
    - Generate Square Waves: Useful for producing clock or timing signals.\n\n####\
    \ Syntax\n\n```\nHAL_GPIO_TogglePin(GPIOx, GPIO_PIN_y);\n```\n\n#### Syntax Explanation\n\
    \n- `HAL_GPIO_TogglePin`: HAL function that inverts the current state of the GPIO\
    \ pin.\n- `GPIOx`: The GPIO port where the pin is located (e.g., `GPIOA`).\n-\
    \ `GPIO_PIN_y`: The specific GPIO pin number to toggle on the port.\n\n#### Simple\
    \ Code Example\n\n```\nHAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5); // Toggles PA5\n\
    ```\n\n#### Code Example Explanation\n\n- Flips the state of GPIO pin PA5: Changes\
    \ `PA5` from high to low or vice versa, creating a blinking effect when done repeatedly.\n\
    \n#### Notes\n\n- Toggling in a timed loop can create blinking or pulsing effects.\n\
    - The toggle frequency affects visual effects, such as LED blinking rates.\n\n\
    #### Warnings\n\n- Frequent toggling increases power consumption and may cause\
    \ noise in high-frequency applications.\n\n***\n\n### 7. Read GPIO Input\n\n####\
    \ What is Reading GPIO Input?\n\nReading GPIO input allows the STM32 to detect\
    \ external signals, like button presses or sensor outputs, by checking the voltage\
    \ level on the pin.\n\n#### Purpose\n\n- Monitor External Devices: Reads states\
    \ from switches, buttons, or sensors.\n- Detect Digital Signals: Checks if the\
    \ input is high (3.3V) or low (0V).\n\n#### Syntax\n\n```\nHAL_GPIO_ReadPin(GPIOx,\
    \ GPIO_PIN_y);\n```\n\n#### Syntax Explanation\n\n- `HAL_GPIO_ReadPin`: HAL function\
    \ that reads the logical state of a specified GPIO pin.\n- `GPIOx`: The GPIO port\
    \ where the pin is located (e.g., `GPIOA`).\n- `GPIO_PIN_y`: The specific GPIO\
    \ pin number to read.\n"
  raw: 'The GPIO pin mode setting determines how each GPIO pin behaves—whether it
    acts as an input, output, or alternate function pin.


    #### Use Purpose


    ● Define Pin Functionality: Configures the pin to function as an input, output,
    or alternate function pin.


    ● Control Signal Direction: Sets the pin to either send (output) or receive (input)
    digital signals.


    #### Syntax


    GPIO_InitStruct.Mode  = GPIO_MODE_xxx;


    #### Syntax Explanation


    ● GPIO_InitStruct: A structure in the STM32 HAL library that holds the configuration
    settings for a GPIO pin.


    ● .Mode: A member of  GPIO_InitStruct that defines the mode for the GPIO pin.


    ●      GPIO_MODE_xxx: Mode options include:


    ○      GPIO_MODE_INPUT: Configures the pin to act as a digital input.


    ○ GPIO_MODE_OUTPUT_PP: Sets the pin as a push-pull output, where the pin actively
    drives high and low states.


    ○ GPIO_MODE_AF_PP: Configures the pin for an alternate function (e.g., UART, SPI)
    in push-pull mode.


    #### Simple Code Example


    GPIO_InitTypeDef GPIO_InitStruct;


    GPIO_InitStruct.Pin  = GPIO_PIN_5;


    GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_PP; // Sets pin as push-pull output


    #### Code Example Explanation


    ●      Defines a configuration structure (GPIO_InitStruct): Holds settings for
    configuring GPIO.


    ● Sets GPIO pin 5 as output: Configures pin 5 to actively drive high and low voltages
    for controlling devices like LEDs.


    #### Notes


    ●      Push-pull mode is commonly used for digital outputs.


    ● For alternate functions (e.g., UART, SPI), use  GPIO_MODE_AF_PP with the appropriate
    alternate function number.


    #### Warnings


    ● Incorrect mode selection, such as configuring an input pin as an output, may
    result in hardware conflicts or malfunction.


    * * *


    ### 3\. Configure GPIO Speed


    #### What is Configuring GPIO Speed?


    The GPIO speed setting specifies how fast a GPIO pin can change states, affecting
    the maximum frequency of output signals. Faster speeds enable quick state changes
    but increase power consumption and noise.


    #### Use Purpose


    ● Control Signal Switching Rate: Sets the maximum frequency at which a GPIO pin
    can switch between high and low.


    ● Optimize Power and Performance: Lower speeds conserve power, while higher speeds
    allow rapid changes for high-frequency signals.


    #### Syntax


    GPIO_InitStruct.Speed  = GPIO_SPEED_xxx;


    #### Syntax Explanation


    ●      GPIO_InitStruct: Configuration structure for GPIO settings.


    ● .Speed: A member of  GPIO_InitStruct that defines the switching speed of the
    GPIO pin.


    ●      GPIO_SPEED_xxx: Options include:


    ○      GPIO_SPEED_LOW: Reduces power consumption, suitable for slower signals.


    ○      GPIO_SPEED_MEDIUM: Balances power usage and performance.


    ○      GPIO_SPEED_HIGH: Maximizes speed, suitable for high-frequency signals,
    but consumes more power.


    #### Simple Code Example


    GPIO_InitStruct.Speed  = GPIO_SPEED_LOW; // Configures the pin with low speed


    #### Code Example Explanation


    ● Sets GPIO pin speed to low: Reduces power usage, ideal for applications where
    the signal does not need to change rapidly.


    #### Notes


    ●      Choose lower speeds when possible to save power and reduce noise.


    ●      Use higher speeds only when necessary for high-frequency signaling.


    #### Warnings


    ● Using high-speed settings unnecessarily increases power consumption and can
    cause electromagnetic interference (EMI).


    * * *


    ### 4\. Set Output High


    #### What is Setting Output High?


    Setting a GPIO output high drives the pin to a logical high level, providing a
    positive voltage (typically 3.3V or 5V) to power or signal connected components.


    #### Use Purpose


    ● Activate External Devices: Provides a high logic level to power LEDs, relays,
    or other components.


    ● Signal Logical High: Sets the pin to a logic "1" or high voltage level, commonly
    used to turn on connected components.


    #### Syntax


    HAL_GPIO_WritePin(GPIOx, GPIO_PIN_y, GPIO_PIN_SET);


    #### Syntax Explanation


    ● HAL_GPIO_WritePin: HAL function that writes a logical state (high or low) to
    a specified GPIO pin.


    ●      GPIOx: The GPIO port where the pin is located (e.g.,  GPIOA).


    ●      GPIO_PIN_y: The specific GPIO pin number on the port (e.g.,  GPIO_PIN_5).


    ● GPIO_PIN_SET: Sets the output to a high logic level (3.3V or 5V, depending on
    system configuration).


    #### Simple Code Example


    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_SET); // Sets PA5 to high


    #### Code Example Explanation


    ● Sets GPIO pin PA5 to high: Provides a logic high voltage on PA5, turning on
    an LED or signaling a connected device.


    ● Configures pin as output: The pin must be set as an output in  GPIO_InitStruct
    for this command to work.


    #### Notes


    ● Ensure the pin is configured as an output before writing a high or low state.


    ● GPIO_PIN_SET drives the pin to a high voltage, turning on components like LEDs.


    #### Warnings


    ● Writing high to an input-configured pin will have no effect and may cause conflicts
    in other configurations.


    * * *


    ### 5\. Set Output Low


    #### What is Setting Output Low?


    Setting a GPIO output low drives the pin to a logical low level, typically pulling
    it to 0V, effectively turning off or deactivating connected components.


    #### Use Purpose


    ● Deactivate External Devices: Provides a low logic level to turn off LEDs, relays,
    or other components.


    ● Signal Logical Low: Sets the pin to a logic "0" or low voltage level.


    #### Syntax


    HAL_GPIO_WritePin(GPIOx, GPIO_PIN_y, GPIO_PIN_RESET);


    #### Syntax Explanation


    ● HAL_GPIO_WritePin: HAL function that writes a logical state (high or low) to
    a specified GPIO pin.


    ●      GPIOx: The GPIO port where the pin is located (e.g.,  GPIOA).


    ●      GPIO_PIN_y: The specific GPIO pin number on the port (e.g.,  GPIO_PIN_5).


    ●      GPIO_PIN_RESET: Sets the output to a low logic level (0V).


    #### Simple Code Example


    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_RESET); // Sets PA5 to low


    #### Code Example Explanation


    ● Sets GPIO pin PA5 to low: Provides a logic low voltage, turning off an LED or
    signaling a connected device to deactivate.


    #### Notes


    ● Ensure the pin is configured as an output before setting a high or low state.


    ●      GPIO_PIN_RESET pulls the pin voltage to ground (0V).


    #### Warnings


    ● Writing low to an input-configured pin has no effect and may interfere with
    other configurations.


    * * *


    ### 6\. Toggle GPIO Pin


    #### What is Toggling a GPIO Pin?


    Toggling a GPIO pin switches it between high and low states. It is commonly used
    for blinking LEDs or generating square wave signals.


    #### Use Purpose


    ● Create Blinking or Pulsing Effects: Toggling at regular intervals is useful
    for indicators.


    ●      Generate Square Waves: Useful for producing clock or timing signals.


    #### Syntax


    HAL_GPIO_TogglePin(GPIOx, GPIO_PIN_y);


    #### Syntax Explanation


    ● HAL_GPIO_TogglePin: HAL function that inverts the current state of the specified
    GPIO pin.


    ●      GPIOx: The GPIO port where the pin is located (e.g.,  GPIOA).


    ●      GPIO_PIN_y: The specific GPIO pin number to toggle on the port.


    #### Simple Code Example


    HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5); // Toggles PA5


    #### Code Example Explanation


    ● Flips the state of GPIO pin PA5: Changes PA5 from high to low or vice versa,
    creating a blinking effect when done repeatedly.


    #### Notes


    ●      Toggling in a timed loop can create blinking or pulsing effects.


    ●      The toggle frequency affects visual effects, such as LED blinking rates.


    #### Warnings


    ● Frequent toggling increases power consumption and may cause noise in high-frequency
    applications.


    * * *


    ### 7\. Read GPIO Input


    #### What is Reading GPIO Input?


    Reading GPIO input allows the STM32 to detect external signals, like button presses
    or sensor outputs, by checking the voltage level on the pin.


    #### Use Purpose


    ●      Monitor External Devices: Reads states from switches, buttons, or sensors.


    ● Detect Digital Signals: Checks if the input is high (3.3V) or low (0V).


    #### Syntax


    HAL_GPIO_ReadPin(GPIOx, GPIO_PIN_y);


    #### Syntax Explanation'
