- fmt: "\nThe `floor` function returns the largest integer less than or equal to a\
    \ given number, effectively rounding down.\n\n### Use Purpose\n\n- **Resource\
    \ Partitioning**: Rounds down values for partitioning resources without exceeding\
    \ limits.\n- **Lower Bound Rounding**: Ensures calculations stay within a specific\
    \ limit.\n\n### Syntax\n\n```c\nresult = floor(x);\n```\n\n### Syntax Explanation\n\
    \n- `result`: Stores the floor value of `x`.\n- `floor`: The floor function.\n\
    - `x`: The input value.\n\n### Simple Code Example\n\n```c\nfloat result = floor(4.9);\
    \ // result is 4.0\n```\n\n***\n\n## Final Project: Sensor Data Processing with\
    \ Math Functions\n\n### Project Name\nReal-Time Sensor Data Analysis Using Math\
    \ Functions\n\n### Project Objective\nUse math functions to process sensor data,\
    \ calculate averages, peak values, logarithmic scale, and display the square root\
    \ of the averaged data.\n\n### Project Circuit\n\n| Component | Pin Description\
    \ | Connection Details |\n| :--- | :--- | :--- |\n| STM32 Microcontroller | ADC\
    \ Channel | Reads data from temperature sensor |\n| Temperature Sensor | Connected\
    \ to ADC input | Provides temperature data |\n| LCD or Serial Monitor | Display\
    \ | Shows processed data output |\n\n### Project Code\n\n```c\n#include \"stm32f4xx_hal.h\"\
    \n#include <math.h>\n#include <stdio.h>\n\nADC_HandleTypeDef hadc1;\n\nvoid ADC_Init(void)\
    \ {\n    __HAL_RCC_ADC1_CLK_ENABLE();\n    hadc1.Instance = ADC1;\n    hadc1.Init.Resolution\
    \ = ADC_RESOLUTION_12B;\n    HAL_ADC_Init(&hadc1);\n}\n\nint main(void) {\n  \
    \  HAL_Init();\n    ADC_Init();\n    uint32_t adcValue;\n    float temp, sumTemp\
    \ = 0, avgTemp, peakTemp = 0;\n    int sampleCount = 10;\n    for (int i = 0;\
    \ i < sampleCount; i++) {\n        HAL_ADC_Start(&hadc1);\n        if (HAL_ADC_PollForConversion(&hadc1,\
    \ HAL_MAX_DELAY) == HAL_OK) {\n            adcValue = HAL_ADC_GetValue(&hadc1);\n\
    \            temp = (adcValue * 3.3) / 4095; // Convert ADC to voltage\n     \
    \       sumTemp += temp;\n            if (temp > peakTemp) {\n               \
    \ peakTemp = temp;\n            }\n        }\n        HAL_Delay(500);\n    }\n\
    \    avgTemp = sumTemp / sampleCount;  // Calculate average\n    float rootAvg\
    \ = sqrt(avgTemp);    // Square root of average\n    float logAvg = log10(avgTemp);\
    \    // Logarithmic transformation of average\n    printf(\"Average Temp: %.2f\
    \ V\\n\", avgTemp);\n    printf(\"Peak Temp: %.2f V\\n\", peakTemp);\n    printf(\"\
    Square Root of Avg Temp: %.2f V\\n\", rootAvg);\n    printf(\"Log10 of Avg Temp:\
    \ %.2f V\\n\", logAvg);\n    while (1) {}\n}\n```\n\n### Save and Run\n1. Save\
    \ the code as `main.c`.\n2. Compile and upload to the STM32 NUCLEO-F446RE using\
    \ STM32CubeIDE or Keil.\n\n### Check Output\nExpected behavior:\n- The program\
