    \ systems to take action when a sensor reading exceeds a threshold.\n\n### Use\
    \ Purpose\n- Threshold Checking: Triggers actions when a value exceeds a predefined\
    \ limit.\n- Comparison in Loops: Often used in loops for counting or monitoring\
    \ variables.\n\n### Syntax\n```c\nif (operand1 > operand2) {\n    statements;\n\
    }\n```\n\n### Syntax Explanation\n- `operand1`: The value to check if it is greater\
