    #### 语法解释\n- `variable`: 用于存储余数的变量。\n- `%=`: 取模赋值运算符，它用于计算 `variable % value`。\n\
    - `value`: 除数。\n- `Operands`: 操作数必须是整数，取模运算才有意义。\n- `Result`: `variable` 存储被除以\
    \ `value` 后的余数。\n\n#### 简易代码示例\n```c\nint counter = 10;\ncounter %= 3; // counter\
    \ 现在的值为 1\n```\n\n#### 代码示例解释\n- 计算 `counter / 3` 的余数：`counter` 的新值为 `1`，因为 10\
    \ 除以 3 得到的余数为 `1`。\n\n#### 注意事项\n- `counter %= max;` 可以实现在达到最大值时重置的循环计数器。\n- 非常适合管理循环中的周期性任务。\n\
    \n#### 警告\n- 对 0 进行取模运算会导致运行时错误。\n\n***\n\n## 最终项目：使用复合运算符处理传感器数据\n\n### 项目目标\n\
    使用复合运算符处理实时传感器数据，以更新值、计算平均值并根据阈值控制 LED。\n\n### 项目电路图\n| 组件 | 引脚描述 | 连接细节 |\n|\
    \ :--- | :--- | :--- |\n| STM32 微控制器 | ADC 通道 | 从温度传感器读取数据 |\n| 温度传感器 | 链接到 ADC\
    \ 输入 | 提供温度数据 |\n| LED | GPIO 输出 | 指示温度是否超过阈值 |\n\n### 项目代码\n```c\n#include \"\
    stm32f4xx_hal.h\"\n\nADC_HandleTypeDef hadc1;\n\nvoid ADC_Init(void) {\n  __HAL_RCC_ADC1_CLK_ENABLE();\n\
    \  hadc1.Instance  = ADC1;\n  hadc1.Init.Resolution  = ADC_RESOLUTION_12B;\n \
    \ HAL_ADC_Init(&hadc1);\n}\n\nvoid LED_Control(int temp) {\n  if (temp >= 30)\
    \ {\n    LED_ON();\n  } else {\n    LED_OFF();\n  }\n}\n\nint main(void) {\n \
    \ HAL_Init();\n  ADC_Init();\n  uint32_t adcValue;\n  int temp;\n  int totalTemp\
    \ = 0;\n  int sampleCount = 0;\n  while (1) {\n    HAL_ADC_Start(&hadc1);\n  \
    \  if (HAL_ADC_PollForConversion(&hadc1, HAL_MAX_DELAY) == HAL_OK) {\n      adcValue\
    \ = HAL_ADC_GetValue(&hadc1);\n      temp = (adcValue * 100) / 4095; // 将 ADC\
    \ 转换为温度\n      // 使用复合运算符更新 totalTemp 和 sampleCount\n      totalTemp += temp;\n\
    \      sampleCount += 1;\n      if (sampleCount == 10) { // 每 10 个采样计算一次平均值\n\
    \        int averageTemp = totalTemp / sampleCount;\n        LED_Control(averageTemp);\
    \ // 根据平均温度控制 LED\n        // 重置 totalTemp 和 sampleCount\n        totalTemp =\
