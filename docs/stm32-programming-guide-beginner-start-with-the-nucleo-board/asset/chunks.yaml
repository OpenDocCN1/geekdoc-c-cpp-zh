    | Serial No | Topic | Code Snippet | Simple Example |


    | 1 | If Statement | if (condition) { statements } | if (temp > 25) { LED_ON();
    } |


    | 2 | If-Else Statement | if (condition) { statements } else { } | if (temp >
    25) { LED_ON(); } else { LED_OFF(); } |


    | 3 | Else-If Statement | if (cond1) {} else if (cond2) {} | if (temp > 30) {}
    else if (temp > 20) {} |


    | 4 | For Loop | for (init; cond; update) { statements } | for (int i = 0; i <
    5; i++) { LED_ON(); } |


    | 5 | While Loop | while (condition) { statements } | while (button == 1) { LED_ON();
    } |


    | 6 | Do-While Loop | do { statements } while (condition); | do { LED_ON(); }
    while (button == 1); |


    | 7 | Switch Statement | switch (variable) { case value: ... } | switch (command)
    { case 1: LED_ON(); break; } |


