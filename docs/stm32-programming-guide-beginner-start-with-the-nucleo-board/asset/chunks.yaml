    ## Final Project: Potentiometer-Controlled LED Brightness


    ### Project Objective


    Use the ADC to read the position of a potentiometer and control an LED’s brightness
    based on the potentiometer reading using the DAC.


    ### Project Circuit


    | Component | Pin Description | Connection Details |


    | STM32 Microcontroller | ADC Channel (Potentiometer) | Analog input connected
    to potentiometer |


    | Potentiometer | VCC, GND, Analog Output | Connect output to ADC pin |


    | LED | Anode to DAC, Cathode to GND | Adjust brightness using DAC output |


    ### Circuit Analysis


    ●      ADC Channel: Reads voltage from the potentiometer to measure its position.


    ●      DAC Output: Controls LED brightness based on the potentiometer reading.


    ●      Variable Brightness: ADC readings adjust DAC output, allowing brightness
    changes.


    ### Project Code


    #include  "stm32f4xx_hal.h"


    ADC_HandleTypeDef hadc1;


    DAC_HandleTypeDef hdac;


    void ADC_Config(void)  {


    __HAL_RCC_ADC1_CLK_ENABLE();


    hadc1.Instance  = ADC1;


    hadc1.Init.Resolution  = ADC_RESOLUTION_12B;


    HAL_ADC_Init(&hadc1);


    }


    void DAC_Config(void)  {


    __HAL_RCC_DAC_CLK_ENABLE();


    hdac.Instance  = DAC;


    HAL_DAC_Init(&hdac);


    HAL_DAC_Start(&hdac, DAC_CHANNEL_1);


    }


    int main(void)  {


    HAL_Init();


    ADC_Config();


    DAC_Config();


    while  (1)  {


    HAL_ADC_Start(&hadc1);


    if  (HAL_ADC_PollForConversion(&hadc1,  100)  == HAL_OK)  {


    uint32_t adcValue = HAL_ADC_GetValue(&hadc1);


    HAL_DAC_SetValue(&hdac, DAC_CHANNEL_1, DAC_ALIGN_12B_R, adcValue);


    }


    HAL_Delay(10);


    }


    }


    ### Save and Run


    1.  Save the code as  main.c.


    2.  Compile and upload to the STM32 NUCLEO-F446RE using STM32CubeIDE or Keil.


    ### Check Output


    Expected behavior:


    ●      The LED brightness changes based on potentiometer position.


    * * *


    ## Summary


    This chapter covered ADC and DAC configurations on the STM32 NUCLEO-F446RE, demonstrating
    how to read and output analog signals. The final project showcased a potentiometer-controlled
    LED brightness application. These skills are foundational for interfacing with
    analog devices in embedded systems.


    # Advanced I/O in STM32


    ## Chapter Overview


    Advanced I/O capabilities extend the basic digital and analog I/O functionalities,
    allowing for more sophisticated control of external components. These include
    Pulse Width Modulation (PWM) for precise control of devices like motors and LEDs,
    interrupts for event-based handling, and I2C communication for interfacing with
    sensors and peripherals. This chapter covers configuring and using PWM, interrupts,
    and I2C on the STM32 NUCLEO-F446RE.


