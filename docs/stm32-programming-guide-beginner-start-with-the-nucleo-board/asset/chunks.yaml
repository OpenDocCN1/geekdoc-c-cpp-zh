    # Data Conversion in STM32


    ## Chapter Overview


    Data conversion allows the transformation of one data type to another, such as
    converting integers to floating-point numbers or strings to numbers. Conversions
    are essential in embedded systems to ensure that data is handled correctly, especially
    when interfacing with sensors, displays, or external devices. This chapter covers
    different types of conversions, including implicit and explicit conversions, along
    with techniques specific to embedded systems.


    ## Chapter Goal


    ●      Understand the difference between implicit and explicit type conversions
    in C.


    ●      Learn to convert between integer and floating-point types.


    ●      Explore techniques for converting numbers to strings and vice versa.


    ● Apply data conversion techniques in a practical project for displaying sensor
    data.


    ## Rules


    ● Use Implicit Conversions with Caution: Implicit conversions can lead to data
    loss, especially when converting from a larger to a smaller data type.


    ● Prefer Explicit Conversions for Clarity: Use explicit type casting to ensure
    the intended conversion, avoiding unexpected results.


    ● Avoid Precision Loss: When converting from  float to  int, consider rounding
    if necessary to minimize data loss.


    ● Use Standard Library Functions for String Conversions: Utilize functions like  sprintf,  atoi,
    and  atof for converting between strings and numbers.


    ● Check for Conversion Errors: Handle errors, especially in string conversions,
    to avoid unexpected behavior.


    ## Syntax Table


    | Serial No | Topic | Code Snippet | Simple Example |


    | 1 | Implicit Conversion | result = integer + float; | int i = 5; float f = 2.5;
    float result = i + f; |


    | 2 | Explicit Conversion (Casting) | (new_type)variable_name | float f = 3.14;
    int i = (int)f; |


    | 3 | Integer to Float Conversion | float_var = (float)int_var; | int i = 10;
    float f = (float)i; |


    | 4 | Float to Integer Conversion | int_var = (int)float_var; | float f = 2.7;
    int i = (int)f; |


    | 5 | String to Integer Conversion | int_var = atoi(string_var); | char s[] =
    "123"; int i = atoi(s); |


    | 6 | String to Float Conversion | float_var = atof(string_var); | char s[] =
    "3.14"; float f = atof(s); |


    | 7 | Integer to String Conversion | sprintf(string_var, "%d", int_var); | int
    i = 100; char s[10]; sprintf(s, "%d", i); |


    | 8 | Float to String Conversion | sprintf(string_var, "%.2f", float_var); | float
    f = 3.14; char s[10]; sprintf(s, "%.2f", f); |


