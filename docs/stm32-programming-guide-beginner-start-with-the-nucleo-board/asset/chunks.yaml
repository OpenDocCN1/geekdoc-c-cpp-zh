    \n# STM32 中的比较运算符\n\n## 章节概述\n\n比较运算符是编程中的基础，允许程序评估值之间的关系，例如相等、大于或小于。在嵌入式系统中，比较运算符在条件语句和决策中起着关键作用，能够对传感器输入、用户命令或系统状态做出响应。本章涵盖了\
    \ C 语言中主要的比较运算符、其用法、语法以及在 STM32 嵌入式编程中的实际应用。\n\n## 章节目标\n\n- 理解并使用比较运算符：等于、不等于、大于、小于、大于等于和小于等于。\n\
    - 学习如何在条件结构中实现比较操作。\n- 在实际项目中应用比较运算符，根据传感器数据控制 LED。\n\n## 规则\n\n- **在条件中使用比较运算符**：比较运算符通常用于\
    \ `if`、`while` 或 `for` 条件，以评估值之间的关系。\n- **注意数据类型**：确保所比较的变量具有兼容类型，以避免意外行为。\n-\
    \ **理解运算符优先级**：比较运算符的优先级低于算术运算符，因此使用括号来明确复杂的条件。\n- **避免在条件中无意赋值**：使用 `==` 进行比较，而不是\
    \ `=`（赋值 是赋值运算符）。\n- **检查边界条件**：对于范围，根据需要使用 `>=` 和 `<=` 来包含边界值。\n\n## 语法表\n\n\
    | 序号 | 运算符 | 代码片段 | 简单示例 |\n| :--- | :--- | :--- | :--- |\n| 1 | 等于 (==) | `if\
    \ (a == b) { statements; }` | `if (temp == 25) { LED_ON(); }` |\n| 2 | 不等于 (!=)\
    \ | `if (a != b) { statements; }` | `if (temp != 25) { LED_OFF(); }` |\n| 3 |\
    \ 大于 (>) | `if (a > b) { statements; }` | `if (temp > 25) { FAN_ON(); }` |\n|\
    \ 4 | 小于 (<) | `if (a < b) { statements; }` | `if (temp < 15) { HEATER_ON(); }`\
    \ |\n| 5 | 大于等于 (>=) | `if (a >= b) { statements; }` | `if (temp >= 20) { LED_ON();\
    \ }` |\n| 6 | 小于等于 (<=) | `if (a <= b) { statements; }` | `if (temp <= 10) { LED_OFF();\
    \ }` |\n\n***\n\n## 话题解释\n\n### 1. 等于 (==)\n\n#### 什么是等于运算符？\n\n`==` 运算符检查两个值是否相等，如果相等则返回真。在嵌入式系统中，这通常用于检查条件是否满足。\n\
    \n#### 用途\n\n- **检查相等性**：确认两个值是否相同。\n- **条件测试**：常用于 `if` 语句。\n\n#### 语法\n\n```\n\
    if (operand1 == operand2) {\n  statements;\n}\n```\n\n#### 语法解释\n\n- `operand1`:\
    \ 比较的第一个值或变量。\n- `==`: 等于运算符，检查 `operand1` 和 `operand2` 是否相等。\n- `operand2`: 用于比较的第二个值或变量。\n\
    - 操作数：：可以是整数、浮点数或字符。\n- ：：如果两个操作数相等，则执行 `{ }` 中的代码。\n\n#### 简单代码示例\n\n```c\nint\
    \ temp = 25;\nif (temp == 25) {\n  LED_ON();\n}\n```\n\n#### 代码示例解释\n\n- 将 `temp`\
    \ 与 25 比较：如果 `temp` 是 25，则 LED 开启。\n\n#### 注意事项\n\n- 比较时始终使用 `==`，而不是用于赋值的 `=`。\n\
    - 比较可以用于不同类型，但要确保兼容性。\n\n#### 警告\n\n- 误用 `=` 代替 `==` 会导致逻辑错误。\n\n***\n\n### 2.\
    \ 不等于 (!=)\n\n#### 什么是不等于运算符？\n\n`!=` 运算符检查两个值是否不同，如果不相等则返回真。这通常用于嵌入式系统在特定条件不满足时执行操作。\n\
    \n#### 用途\n\n- **检查不等性**：确认两个值不同。\n- **反向条件**：当你想确保变量不等于某个值时使用。\n\n#### 语法\n\n\
    ```\nif (operand1 != operand2) {\n  statements;\n}\n```\n\n#### 语法解释\n\n- `operand1`:\
    \ 比较中的第一个值或变量。\n- `!=`: 不等于运算符，检查 `operand1` 是否不等于 `operand2`。\n- `operand2`:\
    \ 用于比较的第二个值或变量。\n- 操作数：可以是各种类型（整数、浮点数、字符）。\n- 条件：如果 `operand1` 和 `operand2` 不同，则执行\
    \ `{ }` 中的代码。\n\n#### 简单代码示例\n\n```c\nint temp = 25;\nif (temp != 25) {\n  LED_OFF();\n\
    }\n```\n"
