    ### 项目代码\n\n```c\n#include \"stm32f4xx_hal.h\"\n\nTIM_HandleTypeDef htim2;\n\n\
    void Timer_Config(void) {\n  __HAL_RCC_TIM2_CLK_ENABLE();\n  htim2.Instance =\
    \ TIM2;\n  htim2.Init.Prescaler = 8399;\n  htim2.Init.Period = 9999; // 10 kHz\
    \ 定时器频率下间隔为 1 秒\n  HAL_TIM_Base_Init(&htim2);\n  HAL_TIM_Base_Start_IT(&htim2);\n\
    }\n\nvoid TIM2_IRQHandler(void) {\n  if (__HAL_TIM_GET_FLAG(&htim2, TIM_FLAG_UPDATE)\
    \ != RESET) {\n    __HAL_TIM_CLEAR_IT(&htim2, TIM_IT_UPDATE);\n    HAL_GPIO_TogglePin(GPIOA,\
    \ GPIO_PIN_5);  // 翻转 PA5 上的 LED\n  }\n}\n\nint main(void) {\n  HAL_Init();\n\
    \  __HAL_RCC_GPIOA_CLK_ENABLE();\n  GPIO_InitTypeDef GPIO_InitStruct;\n  GPIO_InitStruct.Pin\
    \ = GPIO_PIN_5;\n  GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\n  GPIO_InitStruct.Pull\
    \ = GPIO_NOPULL;\n  GPIO_InitStruct.Speed = GPIO_SPEED_LOW;\n  HAL_GPIO_Init(GPIOA,\
    \ &GPIO_InitStruct);\n  Timer_Config();\n  while (1) {\n    // LED 闪烁由 TIM2 中断控制\n\
    \  }\n}\n```\n\n### 保存并运行\n\n1. 将代码保存为 `main.c`。\n2. 使用 `STM32CubeIDE` 或 `Keil`\
    \ 编译并上传到 STM32 `NUCLEO-F446RE`。\n\n### 输出\n\n预期行为：\n- 连接到 `PA5` 的 LED 根据 `TIM2`\
    \ 中断每秒闪烁一次。\n\n# STM32 中的常量与变量\n\n## 概述\n\n常量和变量是嵌入式系统编程的基础，允许你存储和操作数据。常量持有不改变的固定值，而变量可以存储随时间变化的信息。在\
    \ STM32 嵌入式应用中，有效率声明、使用和管理常量与变量至关重要。\n\n## 目标\n\n- 学习如何在 `C` 中声明、初始化和使用常量与变量。\n\
    - 理解不同类型的变量（局部、全局、静态）及其作用域。\n- 探索在嵌入式系统编程中使用常量和变量的最佳实践。\n\n## 规则\n\n- **使用常量处理固定值**：使用常量存储在程序运行过程中保持不变的值。\n\
    - **根据作用域需求声明变量**：使用局部变量处理临时数据，全局变量处理共享数据，使用静态变量在跨函数调用时保留值。\n- **选择正确的数据类型**：通过为每个变量选择合适的数据类型来优化内存和处理。\n\
    - **避免不必要的全局变量**：限制全局变量的使用以减少内存占用并防止数据冲突。\n\n## 语法表\n\n| 序号 | 主题 | 代码段 | 简单示例\
    \ |\n| :--- | :--- | :--- | :--- |\n| 1 | 声明常量 | `#define CONSTANT_NAME value`\
    \ | `#define PI 3.14159` |\n| 2 | 声明全局变量 | `data_type variable_name;` | `int counter;`\
    \ |\n| 3 | 声明局部变量 | `data_type variable_name;` | `float temperature;` |\n| 4 |\
    \ 初始化变量 | `data_type variable_name = value;` | `int count = 0;` |\n| 5 | 声明静态变量\
    \ | `static data_type variable_name = value;` | `static int persistent_value =\
    \ 5;` |\n| 6 | 使用 `const` 声明常量 | `const data_type variable_name = value;` | `const\
    \ float GRAVITY = 9.81;` |\n| 7 | 变量的作用域 | 局部：函数内，全局：函数外 | `void func() { int\
    \ x = 5; } int y = 10;` |\n\n## 主题详解\n\n### 1. 声明常量\n\n#### 什么是声明常量？\n声明常量允许你定义一个在整个程序过程中保持不变的固定值。在嵌入式系统中，常量常用于设置、配置值或数学常量。\n\
    \n#### 目的\n- **存储固定值**：持有在程序执行期间不应改变的值，例如 `PI`、速度限制或传感器阈值。\n- **提高代码可读性**：命名的常量提供了其用途的清晰描述，提高了代码的可读性。\n\
    \n#### 语法\n`#define CONSTANT_NAME value`\n\n#### 语法解释\n- `#define`：用于创建常量的预处理器。\n\
    - `CONSTANT_NAME`：常量的名称，通常用大写以区别于变量。\n- `value`：分配给常量的固定值。\n\n#### 简单代码示例\n```c\n\
    #define PI 3.14159 // 为 PI 的值声明常量\n```\n\n#### 代码示例解释\n- 定义 `PI` 为 `3.14159`：`PI`\
    \ 是一个常量且不能修改，代表数学常量 π。\n\n#### 注意事项\n- 使用 `#define` 声明的常量不占用内存空间。\n 使用 使用大写名称命名常量以与变量区分。\n\
    \n#### 警告\n- 不要尝试更改常量的值。\n\n### 2. 声明全局变量\n\n#### 什么是声明全局变量？\n全局变量可以在程序的任何部分进行访问。\n\
    \n#### 目的\n- **跨函数共享数据**：用于计数器、标志和配置值。\n- **保留值**：在执行期间持续存在。\n\n#### 语法\n`data_type\
    \ variable_name;`\n\n#### 语法解释\n- `data_type`：变量的类型，如 `int`、`float` 或 `char`。\n\
    - `variable_name`：变量的名称。\n\n#### 简单代码示例\n```c\nint counter; // 声明全局变量\n```\n\n\
    #### 代码示例解释\n- 定义 `counter`：可以从任何函数访问。\n\n#### 注意事项\n- 全局变量通常声明在文件顶部。\n 使用描述性名称指示全局变量的用途。\n\
    \n#### 警告\n- 过度使用全局变量会导致冲突并难以调试。\n\n### 3. 声明局部变量\n\n#### 什么是声明局部变量？\n局部变量在函数内部声明，在该函数内可见。\n\
    \n#### 目的\n- **限制变量作用域**：局部变量局限于函数，防止其他部分的意外修改。\n- **管理临时数据**：用于存储特定函数内部需要的数据。\n\
    \n#### 语法\n`data_type variable_name;`\n\n#### 语法解释\n- `data_type`：定义变量的类型。\n-\
    \ `variable_name`：变量的名称。\n\n#### 简单代码示例\n```c\nvoid exampleFunction() {\n  int\
    \ temperature = 25; // 声明局部变量 temperature\n}\n```\n\n#### 代码示例解释\n- 定义 `temperature`：`temperature`\
    \ 局限于 `exampleFunction` 无法在外部访问。\n\n#### 注意事项\n- 局部变量在每次调用函数时都会初始化。\n 使用 有意义的名称表示存储在局部变量中的数据。\n\
    \n#### 警告\n- 局部变量在跨函数调用时不保留值。\n\n### 4. 初始化变量\n\n#### 什么是初始化变量？\n初始化是在声明变量时为其分配初始值。这确保变量在使用具有定义的值。\n\
    \n#### 目的\n- **避免未定义的数据**：初始化防止使用未定义或随机值。\n- **为变量使用准备**：为计数器、标志或配置参数设置起始值。\n\n\
    #### 语法\n`data_type variable_name = value;`\n\n#### 语法解释\n- `data_type`：指定变量的类型。\n\
    - `variable_name`：变量的名称。\n- `value`：分配给变量的初始值。\n\n#### 简单代码示例\n```c\nint count\
    \ = 0; // 将 count 初始化为 0\n```\n\n"
- fmt: "\n● Sets `count` to 0: Ensures `count` starts with a defined value, avoiding\
    \ errors from uninitialized data.\n\n#### Notes\n\n● Always initialize variables\
    \ before using them in calculations or logic.\n● For larger arrays, consider initializing\
    \ values in loops.\n\n#### Warnings\n\n● Using uninitialized variables may produce\
    \ unpredictable results.\n\n* * *\n\n### 5. Declare Static Variable\n\n#### What\
    \ is Declaring a Static Variable?\n\nA static variable retains its value between\
    \ function calls, even if it is declared locally within a function. Static variables\
    \ are useful for maintaining state across multiple function executions.\n\n####\
    \ Use Purpose\n\n● Maintain State: Stores values that need to persist across function\
    \ calls, like counters or configuration flags.\n● Limit Scope but Retain Value:\
    \ Static variables are local to the function but keep their value between calls.\n\
    \n#### Syntax\n\n`static data_type variable_name = value;`\n\n#### Syntax Explanation\n\
    \n● `static`: The keyword that makes the variable retain its value across function\
    \ calls.\n● `data_type`: Specifies the type of the variable.\n● `variable_name`:\
    \ The name of the variable.\n● `value`: Initial value assigned to the variable.\n\
    \n#### Simple Code Example\n\n```c\nvoid countCalls() {\n    static int callCount\
    \ = 0; // Static variable to count function calls\n    callCount++;\n}\n```\n\n\
    #### Code Example Explanation\n\n● Increments `callCount` each time `countCalls`\
    \ is called: Since `callCount` is `static`, it retains its value between calls,\
    \ making it useful for tracking the number of times the function runs.\n\n####\
    \ Notes\n\n● Static variables are initialized only once and retain their value\
    \ throughout program execution.\n● Useful for counters or flags within functions.\n\
    \n#### Warnings\n\n● Overuse of static variables can increase memory usage.\n\n\
    * * *\n\n### 6. Declare Constant with const\n\n#### What is Declaring a Constant\
    \ with const?\n\nThe `const` keyword is another way to define constants, making\
    \ a variable’s value unchangeable after it is initialized. Unlike `#define`, `const`\
    \ constants have a type and are stored in memory.\n\n#### Use Purpose\n\n● Store\
    \ Unmodifiable Values: Holds values that should remain constant throughout the\
    \ program.\n● Increase Code Readability: Using `const` gives the compiler additional\
    \ information about the variable’s intent.\n\n#### Syntax\n\n`const data_type\
    \ variable_name = value;`\n\n#### Syntax Explanation\n\n● `const`: Keyword indicating\
    \ that the variable’s value cannot be modified.\n● `data_type`: Specifies the\
    \ type of the variable.\n● `variable_name`: The name of the constant.\n● `value`:\
    \ The constant’s initial value.\n\n#### Simple Code Example\n\n```c\nconst float\
    \ GRAVITY = 9.81; // Declares a constant for gravity\n```\n\n#### Code Example\
    \ Explanation\n\n● Defines `GRAVITY` as a constant float with a value of 9.81:\
    \ This value cannot be modified, ensuring `GRAVITY` remains consistent.\n\n####\
    \ Notes\n\n● Use `const` for fixed values with a defined type, unlike `#define`\
    \ which is a preprocessor directive.\n● Constants declared with `const` are stored\
    \ in memory.\n\n#### Warnings\n\n● Attempting to change a `const` variable will\
    \ result in a compilation error.\n\n* * *\n\n### 7. Scope of Variables\n\n####\
    \ What is Variable Scope?\n\nVariable scope determines where a variable can be\
    \ accessed in the program. Variables can be local (only within a function) or\
    \ global (accessible throughout the program).\n\n#### Use Purpose\n\n● Manage\
    \ Data Accessibility: Control where variables are accessed and modified to avoid\
    \ conflicts and errors.\n● Organize Program Structure: Use local variables for\
    \ temporary data and global variables for shared data.\n\n#### Syntax\n\n```c\n\
    // Local variable\nvoid func() {\n    int x = 5;  // Local to func\n}\n\n// Global\
    \ variable\nint y = 10; // Accessible from any function\n```\n\n#### Syntax Explanation\n\
    \n● Local variables: Declared within functions and are only accessible in that\
    \ function.\n● Global variables: Declared outside of functions and accessible\
    \ from any part of the program.\n\n#### Simple Code Example\n\n```c\nvoid increment()\
    \ {\n    int count = 0;  // Local variable\n    count++;\n}\n\nint total = 0;\
    \ // Global variable\n```\n\n#### Code Example Explanation\n\n● `count` is a local\
    \ variable: Exists only within `increment`.\n● `total` is a global variable: Accessible\
    \ from any function in the program.\n\n#### Notes\n\n● Limit global variables\
    \ to prevent unexpected data changes.\n● Local variables are ideal for temporary\
    \ data that doesn’t need to persist.\n\n#### Warnings\n\n● Overuse of global variables\
    \ can lead to data conflicts.\n\n* * *\n\n## Final Project: Using Constants and\
    \ Variables to Control an LED\n\n### Project Objective\n\nCreate a program to\
    \ blink an LED at a specific interval using constants and variables.\n\n### Project\
    \ Circuit (In Table)\n\n| Component | Pin Description | Connection Details |\n\
    | :--- | :--- | :--- |\n| STM32 Microcontroller | GPIO Output (PA5) | Controls\
    \ LED blinking |\n| LED | Anode to PA5 | |\n\n### Circuit Analysis\n\n● LED connected\
    \ to PA5: Configured to blink.\n● Interval is 1 second: Defined by `BLINK_DELAY`.\n\
    \n### Project Code\n\n```c\n#include \"stm32f4xx_hal.h\"\n\n#define LED_PIN GPIO_PIN_5\n\
    #define BLINK_DELAY 1000\n\nvoid LED_Init(void) {\n    HAL_Init();\n    __HAL_RCC_GPIOA_CLK_ENABLE();\n\
    \    \n    GPIO_InitTypeDef GPIO_InitStruct = {0};\n    GPIO_InitStruct.Pin =\
    \ LED_PIN;\n    GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\n    GPIO_InitStruct.Pull\
    \ = GPIO_NOPULL;\n    GPIO_InitStruct.Speed = GPIO_SPEED_LOW;\n    HAL_GPIO_Init(GPIOA,\
    \ &GPIO_InitStruct);\n}\n\nint main(void) {\n    LED_Init();\n    while (1) {\n\
    \        HAL_GPIO_TogglePin(GPIOA, LED_PIN);\n        HAL_Delay(BLINK_DELAY);\n\
    \    }\n}\n```\n\n### Save and Run\n\n1. Save the code as `main.c`.\n2. Compile\
    \ and upload to the STM32 NUCLEO-F44RE using STM32Cube.\n\n### Check Output\n\n\
    Expected behavior:\n● LED connected to PA5 blinks at a 1-second interval.\n"
