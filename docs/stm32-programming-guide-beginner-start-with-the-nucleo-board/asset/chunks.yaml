  trans: "\n开始 STM32 开发需要了解设置功能完开发环境所需的工具、软件和步骤。本章将引导你如何设置 `STM32CubeIDE`、使用 `STM32CubeMX`\
    \ 配置硬件、将程序烧录到微控制器中、设置项目以及进行基础调试。在章末结束时，你将掌握开始构建基于 STM32 应用程序的基础技能。\n\n## 章节目标\n\
    \n- 在你的计算机上成功设置 STM32 开发环境。\n- 学习使用 `STM32CubeMX` 配置外设、引脚和时钟。\n- 了解将编译后的代码（烧录）到\
    \ STM32 微控制器的过程。\n- 熟悉 `STM32CubeIDE` 的操作，用于进行项目设置、代码管理和项目构建。\n- 掌握基础调试技术，以测试和排除嵌入式应用程序的故障。\n\
    \n***\n\n## 1. 设置开发环境\n\n为了为 STM32 微控制器开发应用程序，你需要安装特定的工具和软件，并设置必要的硬件。以下是分步骤指南，以确保你准备好开始编码。\n\
    \n### 所需的软件和工具\n\n1. `STM32CubeIDE`:\n   - 说明：`STM32CubeIDE` 是一个全位的集成开发环境 (IDE)，它将代码编辑、编译、调试以及使用\
    \ `STM32CubeMX` 进行硬件配置相结合。\n   - 特性：\n     - 内置 `STM32CubeMX` 用于图形化硬件配置。\n   \
    \  - 具有语法高亮、代码建议和错误检测功能的代码编辑器。\n     - 集成编译器和调试器，用于无缝代码开发。\n   - 安装：\n     - 从\
    \ STMicroelectronics 官网下载 `STM32CubeIDE`。\n     - 按照安装向导，根据你的操作系统（Windows、macOS\
    \ 或 Linux）选择安装选项。\n     - 安装后打开 `STM32CubeIDE` 以确认其运行正常。\n\n2. `STM32CubeMX`:\n\
    \   - 说明：`STM32CubeMX` 是一个配置和代码生成工具，用于设置微控制器外设、时钟和引脚分配。\n   - 独立版与集成版：`STM32CubeMX`\
    \ 集成在 `STM32CubeIDE` 中，但也提供独立版本。\n   - 安装：如果你正在使用 `STM32CubeIDE`，则已包含 `STM32CubeMX`，因此不需要额外安装。\n\
    \n3. `ST-LINK/V2` 或 `ST-LINK/V3` 调试器：\n   - 目的：`ST-LINK` 硬件调试工具用于烧录（编程）和调试 STM32\
    \ 微控制器。\n   - 连接：通过 USB 连接到计算机，并通过 `SWD`（串行调试）接口或 `JTAG` 连接到 STM32 开发板。\n\n4.\
    \ `ST-LINK USB 驱动`（适用于 Windows 用户）：\n   - 目的：`ST-LINK` USB 驱动程序允许 Windows 识别并与\
    \ `ST-LINK` 调试器通信。\n   - 安装：从 STMicroelectronics 官网下载 `ST-LINK` USB 驱动并按照提供的说明进行安装。\n\
    \n### 开发硬件\n\n1. STM32 开发板：常见的板包括 STM32 Nucleo、Discovery 和评估板。选择一个符合你项目要求的板子（例如，`STM32F446RE\
    \ Nucleo`）。\n2. USB 线：USB 线将 STM32 板连接到你的计算机，用于供电、烧录和调试。\n\n### 验证安装和设置\n\n1.\
    \ 打开 `STM32CubeIDE`：启动 `STM32CubeIDE` 确保其无问题地打开。\n2. 连接 STM32 板：通过 USB 将你的 STM32\
    \ 开发板连接到计算机。\n3. 检查设备检测：在 `STM32CubeIDE` 中，通过检查运行 (Run) 或调试 (Debug) 配置来验证板子是否被检测。板子应该出现在列表中，显示设备名称和序列号。\n\
    \n***\n\n## 2. STM32CubeMX：代码生成与配置\n\n`STM32CubeMX` 是一个强大的图形化工具，用于配置 STM32 微控制器的硬件设置。使用\
    \ `STM32CubeMX`，你可以设置外设、配置 GPIO 引脚、调整时钟设置并生成 `STM32CubeIDE` 使用的初始化代码。\n\n### 使用\
    \ `STM32CubeMX` 的步骤\n\n1. 创建新项目：\n   - 打开 `STM32CubeIDE` 并导航到 `File > New > STM32\
    \ Project`。\n   - 在目标选择（Target Selection）窗口中，选择你的 STM32 型号。你可以按系列过滤（例如，`STM32F4`）或直接通过零件号搜索（例如，`STM32F103C8`）。\n\
    \   - 选择所需的微控制器，点击 Next，并输入项目名称、位置和工具链（`STM32CubeIDE`）。\n\n2. 配置 GPIO 引脚和外设：\n\
    \   - 在图形界面中，点击引脚以分配特定功能（例如 `GPIO`、`UART`、`I2C`、`ADC`）。\n   - 每个外设提供可调设置。例如：\n\
    \     - `GPIO`：将引脚设置为输入、输出或复用。\n\n3. 配置时钟：\n   - 打开时钟配置（Clock Configuration）设置系统时钟。\n\
    \   - 选择内部 (HSI) 或外部 (HSE) 时钟源，并调整分频器和分频。\n\n4. 设置中间件（可选）：\n   - 在 Middleware\
    \ 选项卡中，启用 FreeRTOS、USB 或 FATFS 等库。\n\n5. 生成代码：\n   - 完成设置后，点击 Project > Generate\
    \ Code。\n   - STM32CubeMX 将根据配置生成初始化代码。\n\n### 生成的代码结构\n\n- `main.c`：包含应用程序逻辑的文件。\n\
    - `stm32xx_hal_conf.h`：启用或禁用 HAL 模块的配置文件。\n- `Drivers/`：包含外设驱动和 STM32 HAL 库。\n\
    - `system_stm32xx.c`：设置系统时钟。\n\nSTM32CubeMX 生成的代码确保了初始设置已就绪。\n\n***\n\n## 3. 将程序烧录到\
    \ STM32\n\n向微控制器烧录程序是将编译后的二进制文件传输到微控制器中，使其执行代码。`STM32CubeIDE` 使用内置的 `ST-LINK`\
    \ 简化了烧录过程。\n\n### 烧录步骤\n\n1. 构建项目：\n   - 在 `STM32CubeIDE` 中，点击 `Project > Build\
    \ Project`。\n   - 这编译代码并生成用于烧录的二进制文件 (.bin 或 .hex)。\n   - 查看控制台是否有错误或警告。\n\n2.\
    \ 设置烧录设置：\n   - 确保 STM32 板已通过 `ST-LINK` 连接到计算机。\n   - 在 `STM32CubeIDE` 中，进入 `Run\
    \ > Debug Configurations` 打开配置设置。\n   - 选择 `ST-LINK` 作为调试探针并检查微控制器是否正确。\n\n3.\
    \ 将代码烧录到 STM32 微控制器：\n   - 点击 `Debug`（如果不需要调试则点击 `Run`）。\n   - STM32CubeIDE 将擦除当前闪存，写入新的二进制文件并开始执行程序。\n\
    - 烧录成功后，程序将在微控制器上自动运行。\n\n### 验证程序执行\n\n- LED 或输出：如果你的程序涉及 LED，验证行为是否符合预期。\n-\
    \ 串口输出：对于使用 `UART` 的程序，打开串口终端（例如 PuTTY）以监控来自 STM32 的输出。\n\n***\n\n## 4. 使用 STM32CubeIDE\
    \ 进行项目设置\n\nSTM32CubeIDE 是代码开发的主要工作空间，提供了用于管理代码文件、构建项目和调试的集成环境。\n\n### 在 STM32CubeIDE\
    \ 中创建和管理项目\n\n1. 开始新项目：\n   - 打开 `STM32CubeIDE` 并导航到 `File > New > STM32 Project`。\n\
    \n"
- fmt: "\n- Select the STM32 microcontroller you are using, give the project a name,\
    \ choose the location, and finish setup.\n\n## 2. Editing Code\n\n- STM32CubeIDE\
    \ provides syntax highlighting, code suggestions, and error checking, making it\
    \ easier to code efficiently.\n- Write custom functions and application logic\
    \ in the `main.c` file, under the main loop or as separate functions.\n\n## 3.\
    \ Building the Project\n\n- Build the project by clicking `Project` > `Build All`\
    \ or using the `Build` icon.\n- Compilation messages will appear in the `Console`\
    \ and `Problems` tabs, highlighting any errors or warnings.\n\n## 4. Setting Up\
    \ Build and Debug Configurations\n\n- Open `Project Properties` to configure compiler\
    \ settings, including optimization levels and linker settings.\n- In `Debug Configurations`,\
    \ confirm that the debug probe is set to `ST-LINK` and the correct microcontroller\
    \ is selected.\n\n### Understanding Key Project Files\n\n- `main.c`: The core\
    \ file containing the main loop where most application code is written.\n- `stm32xxxx_hal_conf.h`:\
    \ Configuration file that controls which HAL modules are enabled.\n- `system_stm32xxxx.c`:\
    \ Configures system initialization, including setting up clocks and interrupts.\n\
    - `Drivers` folder: Contains the HAL libraries for each peripheral and the CMSIS\
    \ (Cortex Microcontroller Software Interface Standard) files.\n\n***\n\n## 5.\
    \ Debugging Basics\n\nDebugging is an essential skill in embedded programming,\
    \ allowing you to locate and fix issues in your code. STM32CubeIDE provides powerful\
    \ debugging tools, including breakpoints, variable inspection, and step-through\
    \ execution.\n\n### Setting Up Debugging\n\n1. Connect the `ST-LINK` Debugger:\n\
    \   - Make sure the `ST-LINK` debugger is connected to both the computer and the\
    \ STM32 development board.\n   - In STM32CubeIDE, open `Debug Configurations`\
    \ and confirm that the `ST-LINK` debugger is selected.\n\n2. Starting a Debugging\
    \ Session:\n   - Click `Debug` to start a debugging session.\n   - STM32CubeIDE\
    \ will build the project, flash the code to the board, and halt execution at the\
    \ beginning of `main()`.\n\n3. Using Breakpoints:\n   - Set breakpoints by clicking\
    \ on the left margin next to the line number in `main.c`.\n   - Breakpoints stop\
    \ the code execution at specified points, allowing you to inspect program variables\
    \ and states.\n\n4. Step-Through Execution:\n   - `Step Into`: Steps into the\
    \ function call to debug line-by-line.\n   - `Step Over`: Executes the current\
    \ line and moves to the next without entering functions.\n   - `Step Out`: Completes\
    \ the current function and returns to the caller.\n\n5. Inspecting Variables and\
    \ Expressions:\n   - Use the `Variables` tab to monitor and modify variable values\
    \ at runtime.\n   - Add specific expressions in the `Expressions` tab to track\
    \ variable changes or expressions during program execution.\n\n6. Debug Console:\n\
    \   - The console provides real-time information on program execution, error messages,\
    \ and debugging insights.\n   - Using `Watches`: Add watches for key variables\
    \ to track their values in real time.\n\n# Introduction to GPIO\n\n## Chapter\
    \ Overview\n\nGPIO (General-Purpose Input/Output) is a fundamental feature of\
    \ microcontrollers, enabling interaction with external components like LEDs, buttons,\
    \ sensors, and relays. STM32 microcontrollers offer flexible GPIO configurations,\
    \ allowing each pin to be set as input, output, analog, or an alternate function.\
    \ This chapter will cover the basics of GPIO, how to configure GPIO pins in STM32CubeMX,\
    \ different GPIO modes, and practical examples for input and output.\n\n## Chapter\
    \ Goal\n\n- Understand the GPIO architecture and functions in STM32 microcontrollers.\n\
    - Learn to configure GPIO pins as input and output.\n- Explore different GPIO\
    \ modes and their applications.\n- Implement basic input and output examples,\
    \ such as controlling an LED and reading a button state.\n\n***\n\n## 1. GPIO\
    \ Overview in STM32\n\nGPIO (General-Purpose Input/Output) pins provide digital\
    \ input and output capabilities, allowing microcontrollers to interface with other\
    \ digital components. Each GPIO pin can be configured to perform different roles\
    \ such as input, output, or to act as an alternate function (e.g., `UART`, `SPI`,\
    \ `I2C`).\n\n### GPIO Port and Pin Structure\n\n- Ports: STM32 microcontrollers\
    \ organize GPIO pins into ports, typically labeled as `GPIOA`, `GPIOB`, `GPIOC`,\
    \ etc. Each port can have up to 16 pins.\n- Pins: Each port pin is numbered from\
    \ 0 to 15 (e.g., `PA0`, `PB5`, `PC13`).\n- Multipurpose Functionality: Each pin\
    \ can be set to a different mode, such as digital input, digital output, analog,\
    \ or alternate function for peripherals.\n\n### GPIO Pin Modes in STM32\n\n1.\
    \ Input Mode:\n   - Used to read a digital state (high or low) from an external\
    \ source, like a button.\n2. Output Mode:\n   - Used to send digital signals to\
    \ external devices, like turning an LED on or off.\n3. Alternate Function Mode:\n\
    \   - Enables the pin to serve as an input/output for internal peripherals, such\
    \ as `UART`, `SPI`, `I2C`.\n4. Analog Mode:\n   - Configures the pin for analog\
    \ input/output, typically for `ADC` (Analog-to-Digital Converter) or `DAC` (Digital-to-Analog\
    \ Converter).\n\n### GPIO Speed, Pull-Up, and Pull-Down\n\n- Speed: Controls the\
    \ speed at which a pin can toggle (Low, Medium, High, or Very High).\n- Pull-Up/Pull-Down:\
    \ Internal resistors can be configured as pull-up, pull-down, or none.\n\n***\n\
    \n## 2. Configuring GPIO with STM32CubeMX\n\nSTM32CubeMX is used to configure\
    \ GPIO pins, simplifying the process.\n\n### Steps to Configure GPIO\n\n1. Open\
    \ STM32CubeMX and Create a New Project:\n   - Select your microcontroller model\
    \ or board.\n2. Assign Pin Functions:\n   - Click on each pin in the graphical\
    \ interface.\n   - Choose `GPIO_Output` for output pins (e.g., controlling an\
    \ LED) or `GPIO_Input` for input pins (e.g., reading a button).\n3. Configure\
    \ GPIO Parameters:\n   - Mode: Select `Input`, `Output`, `Analog`, or `Alternate\
    \ Function`.\n   - Pull-Up/Pull-Down: Choose between No Pull, Pull-Up, or Pull-Down.\n\
    \   - Speed: Set the speed of the pin based on requirements.\n4. Generate Code:\n\
    \   - Click `Project` > `Generate Code` to create files.\n\n### Understanding\
    \ GPIO Initialization Code in main.c\n\nThe generated code in `main.c` contains\
    \ functions and macros to initialize and control GPIO pins. Here’s an example\
    \ of typical GPIO initialization:\n\n```c\nvoid MX_GPIO_Init(void) {\n  GPIO_InitTypeDef\
    \ GPIO_InitStruct = {0};\n\n  /* Enable GPIO Clock */\n  __HAL_RCC_GPIOA_CLK_ENABLE();\n\
    \  __HAL_RCC_GPIOB_CLK_ENABLE();\n\n  /* Configure GPIO pin as output */\n  GPIO_InitStruct.Pin\
    \ = GPIO_PIN_5;\n  GPIO_InitStruct.Mode = GPIO_MODE_OUTPUT_PP;\n  GPIO_InitStruct.Pull\
    \ = GPIO_NOPULL;\n  GPIO_InitStruct.Speed = GPIO_SPEED_FREQ_LOW;\n  HAL_GPIO_Init(GPIOA,\
    \ &GPIO_InitStruct);\n\n  /* Configure GPIO pin as input */\n  GPIO_InitStruct.Pin\
    \ = GPIO_PIN_13;\n  GPIO_InitStruct.Mode = GPIO_MODE_INPUT;\n  GPIO_InitStruct.Pull\
    \ = GPIO_PULLUP;\n  HAL_GPIO_Init(GPIOC, &GPIO_InitStruct);\n}\n```\n\n- Clock\
    \ Enable: Enables the clock for `GPIOA` and `GPIOC`, allowing those ports to be\
    \ used.\n- GPIO Initialization: Configures the pins with specified modes, pull-up/pull-down\
    \ resistors, and speed.\n\n***\n\n## 3. Using GPIO for Output\n\nGPIO output mode\
    \ allows the STM32 microcontroller to control external devices by setting a pin\
    \ to a high or low state. For example, controlling an LED involves setting a GPIO\
    \ pin high to turn it on and low to turn it off.\n"
