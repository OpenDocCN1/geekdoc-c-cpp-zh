    \n***\n\n## 4. 小于 (<)\n\n### 什么是小于运算符？\n`<` 运算符用于检查一个值是否小于另一个值。它在嵌入式系统中用于检查读取值是否低于安全水平或阈值。\n\
    \n### 用途\n- 下限检查：当值低于指定限制时触发操作。\n- 范围检查：与 `>` 结合使用，测试值是否在特定范围内。\n\n### 语法\n```c\n\
