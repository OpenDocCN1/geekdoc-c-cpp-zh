    ### 6\. Print Hexadecimal (%x)


    #### What is Hexadecimal Printing?


    Using  %x in  printf displays an integer value in hexadecimal format. Hexadecimal
    output is useful for debugging memory addresses, flags, and binary data.


    #### Use Purpose


    ●      Memory and Debugging: Displays values in a compact, hexadecimal format.


    ●      Display Addresses: Print memory addresses, which are usually in hexadecimal.


    #### Syntax


    printf("%x", hexValue);


    #### Syntax Explanation


    ●      %x: Format specifier for printing hexadecimal values.


    ●      hexValue: The integer variable to print as hexadecimal.


    #### Simple Code Example


    int hexValue =  255;


    printf("Hex: %x\n", hexValue); // Prints "Hex: ff"


    #### Code Example Explanation


    ●      Prints  hexValue in hexadecimal format: Outputs  ff as hexadecimal for
    255.


    #### Notes


    ●      Use  0x%x to prefix with  0x for clearer hexadecimal display.


    #### Warnings


    ●      Mismatched format specifiers can result in incorrect output.


    * * *


    ## Final Project: Displaying Sensor Data with  printf


    ### Project Objective


    Collect data from a temperature sensor and display it over UART using  printf.
    This project demonstrates using different  printf format specifiers to print temperature
    values and system messages on a serial terminal.


