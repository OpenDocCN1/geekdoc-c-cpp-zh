    \n***\n\n### 5. 打印字符串 (%s)\n\n#### 什么是字符串打印？\n在 `printf` 中使用 `%s` 可以显示一个字符串，字符串是一系列字符。字符串通常用于输出消息、提示信息以及显示传感器名称。\n\
    \n#### 用途\n- 显示消息：打印提示信息、名称和文本字符串。\n- 用户界面：以可读的格式向用户提供反馈。\n\n#### 语法\n```c\nprintf(\"\
    %s\", string);\n```\n\n#### 语法说明\n- `%s`: 用于打印字符串的格式说明符。\n- `string`: 指向要打印字符字符串的指针。\n\
    \n#### 简单代码示例\n```c\nchar name[] = \"STM32\";\n\nprintf(\"Hello, %s!\\n\", name);\
