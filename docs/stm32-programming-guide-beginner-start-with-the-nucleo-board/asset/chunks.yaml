    ```\n\n#### 保存并运行\n1. 将代码保存为 `main.c`。\n2. 使用 STM32CubeIDE 或 Keil 编译并上传到 STM32\
    \ NUCLEO-F446RE。\n\n#### 检查输出\n- LED 根据每 10 次采样计算出的平均温度进行控制，使用复合运算符管理数据累加和重置。\n\
    \n***\n\n## 总结\n本章介绍了 STM32 编程中重要的 C 语言复合运算符，包括加赋值、减赋值、乘赋值、除赋值和取模赋值。复合运算符有助于简化嵌入式系统的计算并提高代码的可读性。最终项目演示了如何使用复合运算符管理传感器数据处理。\n\
    \n"
- fmt: "\nThe bitwise XOR operator (`^`) performs a binary XOR operation between corresponding\
    \ bits of two operands. It’s commonly used to toggle specific bits, flipping them\
    \ from 0 to 1 or from 1 to 0.\n\n### Use Purpose\n\n- Toggling Bits: Flips specific\
    \ bits while leaving others unchanged.\n- Clear Bits in a Masked Pattern: Clears\
    \ bits based on a predefined pattern.\n\n### Syntax\n\n```\nresult = operand1\
    \ ^ operand2;\n```\n\n### Syntax Explanation\n\n- `result`: Stores the outcome\
    \ of the bitwise XOR operation.\n- `operand1`: The first value.\n- `^`: The XOR\
    \ operator, which sets each bit in `result` to 1 if the corresponding bits in\
    \ `operand1` and `operand2` are different.\n- `operand2`: The second value.\n\
    - Operands: Can be literals, variables, or masks.\n- Result: Each bit in `result`\
    \ is 1 if the bits in the operands differ.\n\n### Simple Code Example\n\n```\n\
    int state = 0b10101010;\nint toggleMask = 0b00000001;\nint result = state ^ toggleMask;\
    \ // result is 0b10101011\n```\n\n### Code Example Explanation\n\n- Toggles the\
    \ least significant bit in `state`, changing it from 0 to 1.\n\n### Notes\n\n\
    - `^` is useful for toggling bits, especially in situations where you need to\
    \ flip specific bits periodically.\n- XOR with a bitmask of all 1s (`^ 0xFF`)\
    \ inverts all bits in a variable.\n\n***\n\n### 4. Bitwise NOT (~)\n\n#### What\
    \ is the Bitwise NOT Operator?\n\nThe bitwise NOT operator (`~`) inverts all bits\
    \ in an operand, changing 1s to 0s and 0s to 1s. This operator is often used to\
    \ create inverse masks or to toggle all bits in a variable.\n\n### Use Purpose\n\
    \n- Invert All Bits: Changes each 0 to 1 and each 1 to 0.\n- Create Masks: Inverts\
    \ a mask to flip its behavior.\n\n### Syntax\n\n```\nresult = ~operand;\n```\n\
    \n### Syntax Explanation\n\n- `result`: Stores the inverted value.\n- `~`: The\
    \ NOT operator, which flips each bit in `operand`.\n- `Operand`: Any variable\
    \ or literal.\n- Result: All bits in `operand` are inverted.\n\n### Simple Code\
    \ Example\n\n```\nint value = 0b00001111;\nint result = ~value; // result is 0b11110000\n\
    ```\n\n### Code Example Explanation\n\n- Inverts all bits in `value`: Changes\
    \ each 1 to 0 and each 0 to 1.\n\n### Notes\n\n- `~` is often used to create complementary\
    \ masks.\n- Inverts all bits, so it may produce negative values for signed integers.\n\
    \n### Warnings\n\n- When working with signed integers, the result may become negative.\n\
    \n***\n\n### 5. Left Shift (<<)\n\n#### What is the Left Shift Operator?\n\nThe\
    \ left shift operator (`<<`) shifts all bits in a variable to the left by a specified\
    \ number of positions, filling the rightmost bits with 0s. Each shift to the left\
    \ multiplies the number by 2.\n\n### Use Purpose\n\n- Efficient Multiplication:\
    \ Multiplies a number by powers of 2.\n- Position Bits: Useful for setting specific\
    \ bit positions.\n\n### Syntax\n\n```\nresult = operand << n;\n```\n\n### Syntax\
    \ Explanation\n\n- `result`: Stores the shifted value.\n- `operand`: The value\
    \ to shift.\n- `<<`: The left shift operator, which moves bits to the left.\n\
    - `n`: The number of positions to shift.\n- Operand: An integer variable or literal.\n\
    - Result: `operand` shifted to the left by `n` positions.\n\n### Simple Code Example\n\
    \n```\nint value = 0b00000001;\nint result = value << 2; // result is 0b00000100\n\
    ```\n\n### Code Example Explanation\n\n- Shifts `value` two positions left, multiplying\
    \ it by 4.\n\n### Notes\n\n- Each shift left by 1 position doubles the value.\n\
    - Commonly used to set specific bits in a control register.\n\n### Warnings\n\n\
    - Shifting too far can lead to overflow, losing significant bits.\n\n***\n\n###\
    \ 6. Right Shift (>>)\n\n#### What is the Right Shift Operator?\n\nThe right shift\
    \ operator (`>>`) shifts all bits in a variable to the right by a specified number\
    \ of positions, filling the leftmost bits with 0s (or the sign bit in signed integers).\
    \ Each shift to the right divides the number by 2.\n\n### Use Purpose\n\n- Efficient\
    \ Division: Divides a number by powers of 2.\n- Clear Lower Bits: Useful for isolating\
    \ high bits in a byte or word.\n\n### Syntax\n\n```\nresult = operand >> n;\n\
    ```\n\n### Syntax Explanation\n\n- `result`: Stores the shifted value.\n- `operand`:\
    \ The value to shift.\n- `>>`: The right shift operator, which moves bits to the\
    \ right.\n- `n`: The number of positions to shift.\n- Operand: An integer variable\
    \ or literal.\n- Result: `operand` shifted to the right by `n` positions.\n\n\
    ### Simple Code Example\n\n```\nint value = 0b00001000;\nint result = value >>\
    \ 2; // result is 0b0000010\n```\n\n### Code Example Explanation\n\n- Shifts `value`\
    \ two positions right, dividing it by 4.\n\n### Notes\n\n- Each shift right by\
    \ 1 position halves the value.\n- Useful for dividing by powers of 2 without using\
    \ division.\n\n### Warnings\n\n- Shifting signed integers may retain the sign\
    \ bit, leading to unexpected results.\n\n***\n\n## Final Project: LED Pattern\
    \ Control Using Bitwise Operators\n\n### Project Objective\n\nUse bitwise operators\
    \ to control an 8x8 LED matrix, creating patterns by setting, clearing, and toggling\
    \ specific bits.\n\n### Project Circuit\n\n| Component | Pin Description | Connection\
    \ Details |\n| :--- | :--- | :--- |\n| STM32 Microcontroller | GPIO Output Pins\
    \ | Controls rows and columns of LED matrix |\n| LED Matrix | 8x8 Matrix | Creates\
    \ display based on bit patterns |\n\n### Project Code\n\n```c\n#include \"stm32f4xx_hal.h\"\
    \n\nvoid LED_Matrix_Init(void) {\n    // Initialization code for GPIO pins controlling\
    \ the LED matrix\n}\n\nvoid Set_Row_Pattern(uint8_t row, uint8_t pattern) {\n\
    \    // Use bitwise operations to control each row's LED pattern\n    for (int\
    \ i = 0; i < 8; i++) {\n        if (pattern & (1 << i)) {\n            // Set\
    \ specific column pin high\n        } else {\n            // Set specific column\
    \ pin low\n        }\n    }\n}\n\nint main(void) {\n    HAL_Init();\n    LED_Matrix_Init();\n\
    \    while (1) {\n        Set_Row_Pattern(0, 0b10101010); // Example row pattern\n\
    \        HAL_Delay(500);\n        Set_Row_Pattern(0, ~0b10101010); // Invert pattern\
    \ using NOT operator\n        HAL_Delay(500);\n    }\n}\n```\n\n### Save and Run\n\
    \n1.  Save the code as `main.c`.\n2.  Compile and upload to the STM32 NUCLEO-F446\
    \ using STM32CubeIDE or Keil.\n\n### Check Output\n\nExpected behavior:\n\n- The\
    \ LED matrix displays alternating patterns based on bitwise operations, demonstrating\
    \ bitwise manipulation for visual control.\n"
