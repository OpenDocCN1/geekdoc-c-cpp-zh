    # Comparison Operators in STM32


    ## Chapter Overview


    Comparison operators are fundamental in programming, allowing the program to evaluate
    relationships between values, such as equality, greater than, or less than. In
    embedded systems, comparison operators play a key role in conditional statements
    and decision-making, enabling responses to sensor inputs, user commands, or system
    states. This chapter covers the main comparison operators in C, their usage, syntax,
    and practical applications in STM32 embedded programming.


    ## Chapter Goal


    ● Understand and use comparison operators: equal to, not equal to, greater than,
    less than, greater than or equal to, and less than or equal to.


    ●      Learn how to implement comparison operations within conditional structures.


    ● Apply comparison operators in a practical project for controlling an LED based
    on sensor data.


    ## Rules


    ● Use Comparison Operators in Conditions: Comparison operators are typically used
    in  if,  while, or  for conditions to evaluate relationships between values.


    ● Be Mindful of Data Types: Ensure the variables being compared are of compatible
    types to avoid unexpected behavior.


    ● Understand Operator Precedence: Comparison operators have lower precedence than
    arithmetic operators, so use parentheses to clarify complex conditions.


    ● Avoid Unintended Assignments in Conditions: Use  == for comparison, not =, which
    is an assignment operator.


    ● Check for Boundary Conditions: For ranges, use  >= and  <= to include boundary
    values as needed.


    ## Syntax Table


    | Serial No | Operator | Code Snippet | Simple Example |


    | 1 | Equal To (==) | if (a == b) { statements; } | if (temp == 25) { LED_ON();
    } |


    | 2 | Not Equal To (!=) | if (a != b) { statements; } | if (temp != 25) { LED_OFF();
    } |


    | 3 | Greater Than (>) | if (a > b) { statements; } | if (temp > 25) { FAN_ON();
    } |


    | 4 | Less Than (<) | if (a < b) { statements; } | if (temp < 15) { HEATER_ON();
    } |


    | 5 | Greater Than or Equal (>=) | if (a >= b) { statements; } | if (temp >= 20)
    { LED_ON(); } |


    | 6 | Less Than or Equal (<=) | if (a <= b) { statements; } | if (temp <= 10)
    { LED_OFF(); } |


