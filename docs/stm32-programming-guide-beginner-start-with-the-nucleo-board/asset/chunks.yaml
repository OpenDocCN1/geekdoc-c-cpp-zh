    \ { case value: ... }` | `switch (command) { case 1: LED_ON(); break; }` |\n\n\
    ***\n\n## 主题解释\n\n### 1. If 语句\n\n#### 什么是 If 语句？\n\n`if` 语句是一种控制结构，只有当指定的条件为真时才会执行代码块。在嵌入式系统中，它对于根据传感器读取值、按钮状态或其他条件做出决策至关重要。\n\
    \n#### 用途\n\n● 条件执行：当满足条件时运行代码。\n● 决策：允许程序做出动态响应，例如当温度超过阈值时开启 LED。\n\n#### 语法\n\
    \n```\nif (condition) {\n    statements;\n}\n```\n\n#### 语法解释\n\n● `if`: 启动条件语句的关键字。\n\
    ● `(condition)`: 结果为真或假的逻辑条件（例如 `temp > 25`）。\n● `statements`: 如果条件为真则执行的代码。通常为了清晰起见包含在大括号\
    \ `{ }` 中。\n● 条件: 必须是产生 `true` 或 `false` 的逻辑表达式。示例包括 `>`、`<`、`==` 以及逻辑运算符 `&&`（与）和\
    \ `||`（或）。\n● 大括号：虽然对于单语句可选可选，但使用 `{}` 可以提高可读性，并在以后扩展代码时防止错误。\n\n#### 简单代码示例\n\
    \n```c\nint temp = 30;\n\nif (temp > 25) {\n    LED_ON(); // 如果温度大于 25，则开启 LED\n\
    }\n```\n\n#### 代码示例解释\n\n● 计算条件 `temp > 25`：如果 `temp` 大于 25，则执行 `LED_ON()` 开启\
    \ LED。\n● 如果条件为假则跳过代码：如果 `temp` 不大于 25，则不执行 `LED_ON()`。\n\n#### 注意事项\n\n● 使用 `if`\
    \ 语句进行单条件决策。\n● 条件可以是简单的。\n\n#### 警告\n\n● 条件可以是复杂的。\n\n***\n\n### 2. If-Else 语句\n\
    \n#### 什么是 If-Else 语句？\n\n`if-else` 语句扩展了 `if` 语句，当条件为假时执行另一个代码块。它在嵌入式系统中用于根据传感器读取值、按钮状态或其他条件做出决策。\n\
    \n#### 用途\n\n● 二 执行：当条件满足时运行代码。\n● 二 决策：例如当温度超过阈值时开启 LED。\n\n#### 语法\n\n```\n\
    if (condition) {\n    statements_if_true;\n} else {\n```\n\n#### 语法解释\n\n● `if`:\
    \ 启动条件检查。\n● `else`: 当 `if` 条件为假时执行的代码块。\n● `statements_if_true`: 当 `if` 条件为真时执行。\n\
    ● `statements_if_false`: 当 `if` 条件为假时执行。\n● 条件: 类似于 `if` 语句，决定执行哪个代码块。\n● `else`:\
    \ 在条件不满足时的备用方案。\n\n#### 简单代码示例\n\n```c\nint temp = 20;\n\nif (temp > 25) {\n \
    \   LED_ON();\n} else {\n    LED_OFF();\n}\n```\n\n#### 代码示例解释\n\n● 根据温度开启或关闭\
    \ LED：如果 `temp` 大于 25，则执行 `LED_ON()`；否则执行 `LED_OFF()`。\n\n#### 注意事项\n\n● 使用 `if-else`\
    \ 进行二选决策。\n\n#### 警告\n\n● 避免过度嵌套 `if-else`。\n\n***\n\n### 3. Else-If 语句\n\n####\
    \ 什么是 Else-If 语句？\n\n`else-if` 语句允许按顺序检查多个条件。当根据条件有多个可选操作时非常有用，例如根据温度设置不同的风扇速度。\n\
    \n#### 用途\n\n● 多条件决策：在单一结构中测试多个条件。\n● 范围操作：适用于管理范围，如根据传感器输入调整设备状态。\n\n#### 语法\n\
    \n```\nif (condition1) {\n    statements_if_true1;\n} else if (condition2) {\n\
    \    statements_if_true2;\n} else {\n    statements_if_all_false;\n}\n```\n\n\
    #### 语法解释\n\n● `if`: 检查第一个条件。\n● `else if`: 如果之前的条件为假时检查的额外条件。\n● `else`: 如果没有任何一个条件为真则执行。\n\
    ● `statements_if_true1`: 如果第一个条件为真时执行。\n● `statements_if_true2`: 如果第二个条件为真时执行。\n\
    ● 多个条件：允许测试各种条件。第一个为真的条件会执行其块并跳过其余部分。\n\n#### 简单代码示例\n\n```c\nint temp = 22;\n\
    \nif (temp > 30) {\n    LED_HIGH();\n} else if (temp > 20) {\n    LED_MEDIUM();\n\
    } else {\n    LED_LOW();\n}\n```\n\n#### 代码示例解释\n\n● 根据温度调整 LED 亮度：根据温度范围将 LED\
    \ 设置为高、中、低亮度。\n\n"
