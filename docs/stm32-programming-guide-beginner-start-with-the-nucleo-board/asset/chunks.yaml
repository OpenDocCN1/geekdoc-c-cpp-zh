    ## Topic Explanations


    ### 1\. If Statement


    #### What is an If Statement?


    An  if statement is a control structure that executes a block of code only if
    a specified condition is true. It’s essential in embedded systems for making decisions
    based on sensor readings, button states, or other conditions.


    #### Use Purpose


    ●      Conditional Execution: Runs code when a condition is met.


    ● Decision-Making: Allows a program to react dynamically, such as turning on an
    LED when a temperature exceeds a threshold.


    #### Syntax


    if  (condition)  {


    statements;


    }


    #### Syntax Explanation


    ●      if: Keyword that initiates the conditional statement.


    ● (condition): A logical condition that evaluates to true or false (e.g.,  temp
    > 25).


    ● statements: Code that executes if the condition is true. Typically enclosed
    in braces  { } for clarity.


    ● Condition: Must be a logical expression resulting in  true or  false. Examples
    include >, <,  ==, and logical operators like  && (AND) and  || (OR).


    ● Braces: Although optional for single statements, using  {} improves readability
    and prevents errors when expanding the code later.


    #### Simple Code Example


    int temp =  30;


    if  (temp >  25)  {


    LED_ON(); // Turns on the LED if temperature is greater than 25


    }


    #### Code Example Explanation


    ● Evaluates the condition  temp > 25: If  temp is greater than 25,  LED_ON() is
    executed to turn on the LED.


    ● Skips the code if condition is false: If  temp is not greater than 25,  LED_ON()
    is not executed.


    #### Notes


    ●      Use  if statements for single-condition decisions.


    ● Conditions can be simple or complex and may include multiple logical operators.


    #### Warnings


    ●      Avoid overly complex conditions to keep the code readable and maintainable.


    * * *


    ### 2\. If-Else Statement


    #### What is an If-Else Statement?


    An  if-else statement extends the  if structure to provide an alternative block
    of code if the condition is false. This is helpful for binary decisions, such
    as toggling a device on and off.


    #### Use Purpose


    ● Binary Decision-Making: Executes one block of code if a condition is true and
    another if it is false.


    ●      Simple Alternative Actions: Useful for toggling states based on input conditions.


    #### Syntax


    if  (condition)  {


    statements_if_true;


    }  else  {


    statements_if_false;


    }


    #### Syntax Explanation


    ●      if: Initiates the conditional check.


    ● else: Specifies an alternative block of code if the  if condition is false.


    ●      statements_if_true: Executes if the condition is true.


    ●      statements_if_false: Executes if the condition is false.


    ● Condition: Similar to the  if statement, evaluated to decide which block runs.


    ● Else Block: Runs only if the  if condition is false. Enclose it in  {} to avoid
    errors when adding more code.


    #### Simple Code Example


    int temp =  20;


    if  (temp >  25)  {


    LED_ON();  // LED turns on if temp > 25


    }  else  {


    LED_OFF();  // LED turns off if temp <= 25


    }


    #### Code Example Explanation


    ● Turns LED on or off based on temperature: If  temp is above 25, the LED turns
    on; otherwise, it turns off.


    #### Notes


    ●      Use  if-else for simple binary choices.


    ●      Avoid nesting  if-else statements excessively to maintain readability.


    #### Warnings


    ●      Keep conditions clear and simple to avoid logical errors.


    * * *


    ### 3\. Else-If Statement


    #### What is an Else-If Statement?


    An  else-if statement allows checking multiple conditions in sequence. This is
    useful when there are more than two possible actions to take based on a condition,
    such as setting different fan speeds based on temperature ranges.


    #### Use Purpose


    ●      Multi-Condition Decision-Making: Allows testing multiple conditions in
    a single structure.


    ● Range-Based Actions: Useful for managing ranges, like adjusting device states
    based on sensor input.


    #### Syntax


    if  (condition1)  {


    statements_if_true1;


    }  else  if  (condition2)  {


    statements_if_true2;


    }  else  {


    statements_if_all_false;


    }


    #### Syntax Explanation


    ●      if: Checks the first condition.


    ●      else if: Additional conditions to check if previous ones are false.


    ●      else: Executes if none of the previous conditions are true.


    ●      statements_if_true1: Runs if the first condition is true.


    ●      statements_if_true2: Runs if the second condition is true.


    ● Multiple Conditions: Allows testing various conditions. The first true condition
    executes its block, skipping the rest.


    ● Final Else: Optional but useful as a default if no conditions are met.


    #### Simple Code Example


    int temp =  22;


    if  (temp >  30)  {


    LED_HIGH();


    }  else  if  (temp >  20)  {


    LED_MEDIUM();


    }  else  {


    LED_LOW();


    }


    #### Code Example Explanation


    ● Adjusts LED brightness based on temperature: Sets the LED to high, medium, or
    low brightness based on temperature ranges.


