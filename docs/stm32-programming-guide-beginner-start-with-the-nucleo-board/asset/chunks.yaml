    \n    while (1) {\n        HAL_ADC_Start(&hadc1);\n        if (HAL_ADC_PollForConversion(&hadc1,\
    \ HAL_MAX_DELAY) == HAL_OK) {\n            adcValue = HAL_ADC_GetValue(&hadc1);\n\
    \            temp = (adcValue * 100) / 4095; // Convert ADC value to temperature\
    \ estimate\n            LED_Control(temp);\n        }\n        HAL_Delay(1000);\n\
    \    }\n}\n```\n\n### Save and Run\n1. Save the code as `main.c`.\n2. Compile\
