    \n- `%.2f` 格式化限制输出为两位小数。\n\n***\n\n## 最终项目：传感器数据转换与显示\n\n### 项目目标\n\n读取传感器值，将其转换为浮点数进行计算，然后以字符串形式显示。\n\
