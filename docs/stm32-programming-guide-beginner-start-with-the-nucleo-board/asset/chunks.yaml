  trans: "\n\n- 用场景：适用于需要高度优化代码和复杂调试的项目。\n\n### 其他工具\n- `STM32 ST-LINK Utility`: 用于\
    \ `STM32` 固件烧录和调试的工具。\n- `STM32CubeProgrammer`: 用于烧录、调试和固件升级，支持线和无线更新。\n\n## 5.\
    \ ARM Cortex-M 核心简介\n\nSTM32 微控制器由 `ARM Cortex-M` 核心驱动，该内核专为嵌入式应用设计，提供高效、低功耗和实时处理能力。\n\
    \n### ARM Cortex-M 核心概述\n\n1. `Cortex-M0` 和 `M0+`:\n   - 具有基础功能的入门级内核，针对低功耗应用进行了优化。\n\
    \   - 适用于成本敏感型低功耗项目。\n2. `Cortex-M3`:\n   - 中端性能，具有更高的效率并集成了调试功能。\n   - 常用于通用应用。\n\
    3. `Cortex-M4`:\n   - 增加了 `DSP`（数字信号处理）能力，适用于需要信号处理的应用。\n   - 用于电机控制、传感器数据处理和音频处理等应用。\n\
    4. `Cortex-M7`:\n   - 高性能内核，同时具备 `DSP` 和 `FPU`（浮点单元），适用于密集计算型应用。\n   - 适用于机器人、实时处理和高速数据采集。\n\
    5. `Cortex-A` (`STM32MP` 系列):\n   - 支持 `Linux` 等高级操作系统，并由 `Cortex-M` 核心处理实时控制。\n\
    \   - 适用于需要实时控制和操作系统功能结合级系统。\n\n### 6. ARM Cortex-M 核心的 6 大特性\n\n- 高效的中断处理：`NVIC`（嵌套向量中断控制器）确保实时应用的低延迟响应。\n\
    - 调试支持：内置对 `SWD`（串行线调试）和 `JTAG` 调试的支持。\n- 内存保护单元 (`MPU`)：通过分段内存访问增强应用程序的安全性和稳定性。\n\
    - `FPU`：在 `Cortex-M4` 和 `M7` 内核上能够高效处理浮点运算。\n- `DSP` 扩展：支持数据处理和操纵，对于信号处理应用至关重要。\n\
    \n## STM32 Nucleo-F401RE 开发板指南\n\n`STM32 Nucleo-F401RE` 是一款高度通的开发板，采用 `STM32F401RET6`\
    \ 微控制器进行原型设计，该微控制器属于 `ARM Cortex-M4` 家族。它结合了强大的性能、电源效率和灵活性，是嵌入式系统、`IoT` 和机器人项目的理想选择。\n\
    \n### 主要优势\n- 兼容 `Arduino UNO R3` 扩展板。\n- 通过 `STM32 Morpho` 引脚扩展功能。\n- 集成 `ST-LINK/V2-1`，可实现无缝调试和编程。\n\
    \n### 关键特性\n1. 微控制器：`STM32F401RET6`\n   - 带有浮点单元 (`FPU`) 的 32 位 `ARM Cortex-M4`\
    \ 处理器。\n   - 运行主频为 `84 MHz`。\n2. 内存：\n   - `512 KB` `Flash Memory` 用于程序存储。\n \
    \  - `96 KB` `SRAM` 用于高效数据处理。\n3. 电源：\n   - 内部以 `3.3V` 运行。\n   - 通过 `VIN` 支持 `7V-12V`\
    \ 外部输入电压。\n   - USB 供电，带有板电压调节器。\n4. 板载调试器：集成的 `ST-LINK/V2-1`，支持 `SWD` 和 `JTAG`\
    \ 协议。\n5. 引脚兼容性：\n   - `Arduino UNO R3` 引脚用于扩展板集成。\n   - `STM32 Morpho` 引脚用于访问所有\
    \ `GPIOs` 和外设。\n6. LED 和按钮：\n   - `LD1`:USB 通信指示灯。\n   - `LD2`:用户可编程 LED。\n  \
    \ - `LD3`:电源指示灯。\n   - 两个按钮：一个用于复位，另一个用于用户控制。\n\n## 引脚配置\n\n![](img/image_rsrc8B6.jpg)\n\
    \n### 1. Arduino 兼容引脚\n- 兼容 `Arduino` 扩展板。\n- 分为四类：`CN5`、`CN6`、`CN8`、`CN9`。\n\n\
    | 类别 | 引脚类型 | 引脚名称 | 描述 |\n| :--- | :--- | :--- | :--- |\n| `CN6` (电源) | 参考电压\
    \ | `IOREF` | 为扩展板提供的 `3.3V` 参考电压引脚。 |\n| | 复位 | `RESET` | 重置微控制器。 |\n| | 输出输出\
    \ | `+3.3V`, `+5V` | 提供 `3.3V` 和 `5V` 输出。 |\n| | 地 | `GND` | 系统地引脚。 |\n| `CN8`\
    \ (模拟) | 模拟输入引脚 | `A0`, `A1` | 用于电压量的模拟引脚（12 位 `ADC`）。 |\n| | `I2C` 通信 | `A4 (SDA)`,\
    \ `A5 (SCL)` | `I2C` 通信引脚。 |\n| `CN5` (数字) | 数字 `GPIO` 引脚 | `D8-D15` | 通用数字输入/输出引脚。\
    \ |\n| | `SPI` 通信 | `D10 (CS)`, `D11 (MOSI)`, `D12 (MISO)`, `D13 (SCK)` | |\n\n"
- fmt: "\nGetting started with STM32 development requires understanding the tools,\
    \ software, and steps necessary to set up a functioning development environment.\
    \ This chapter will guide you through setting up `STM32CubeIDE`, using `STM32CubeMX`\
    \ to configure hardware, flashing programs onto the microcontroller, setting up\
    \ projects, and performing basic debugging. By the end of this chapter, you will\
    \ be equipped with the foundational skills to start building STM32-based applications.\n\
    \n## Chapter Goal\n\n- Successfully set up the STM32 development environment on\
    \ your computer.\n- Learn to use `STM32CubeMX` for configuring peripherals, pins,\
    \ and clocks.\n- Understand the process of flashing compiled code onto an STM32\
    \ microcontroller.\n- Navigate `STM32CubeIDE` for project setup, code management,\
    \ and building projects.\n- Acquire basic debugging techniques to test and troubleshoot\
    \ embedded applications.\n\n***\n\n## 1. Setting up the Development Environment\n\
    \nTo develop applications for STM32 microcontrollers, you’ll need to install specific\
    \ tools and software, as well as set up the necessary hardware. Here’s a step-by-step\
    \ guide to ensure you’re prepared to start coding.\n\n### Required Software and\
    \ Tools\n\n1. `STM32CubeIDE`:\n   - Description: `STM32CubeIDE` is an all-in-one\
    \ integrated development environment (IDE) that combines code editing, compiling,\
    \ debugging, and hardware configuration using `STM32CubeMX`.\n   - Features:\n\
    \     - Built-in `STM32CubeMX` for graphical hardware configuration.\n     - Code\
    \ editor with syntax highlighting, code suggestions, and error detection.\n  \
    \   - Integrated compiler and debugger for seamless code development.\n   - Installation:\n\
    \     - Download `STM32CubeIDE` from the STMicroelectronics website.\n     - Follow\
    \ the installation wizard, choosing installation options based on your operating\
    \ system (Windows, macOS, or Linux).\n     - Open `STM32CubeIDE` after installation\
    \ to confirm it’s working properly.\n\n2. `STM32CubeMX`:\n   - Description: `STM32CubeMX`\
    \ is a configuration and code-generation tool used for setting up microcontroller\
    \ peripherals, clocks, and pin assignments.\n   - Standalone vs. Integrated: `STM32CubeMX`\
    \ is integrated within `STM32CubeIDE`, but a standalone version is also available.\n\
    \   - Installation: If you’re using `STM32CubeIDE`, `STM32CubeMX` is already included,\
    \ so no additional installation is required.\n\n3. `ST-LINK/V2` or `ST-LINK/V3`\
    \ Debugger:\n   - Purpose: The `ST-LINK` hardware debugging tool is used to flash\
    \ (program) and debug STM32 microcontrollers.\n   - Connection: Connects via USB\
    \ to your computer and to the STM32 development board via the `SWD` (Serial Wire\
    \ Debug) interface or `JTAG`.\n\n4. `ST-LINK USB Driver` (for Windows users):\n\
    \   - Purpose: The `ST-LINK` USB driver allows Windows to recognize and communicate\
    \ with the `ST-LINK` debugger.\n   - Installation: Download the `ST-LINK` USB\
    \ driver from the STMicroelectronics website and install it following the provided\
    \ instructions.\n\n### Development Hardware\n\n1. STM32 Development Board: Common\
    \ boards include STM32 Nucleo, Discovery, and Evaluation boards. Select a board\
    \ that meets your project requirements (e.g., `STM32F446RE Nucleo`).\n2. USB Cable:\
    \ A USB cable connects the STM32 board to your computer for power, flashing, and\
    \ debugging.\n\n### Verifying Installation and Setup\n\n1. Open `STM32CubeIDE`:\
    \ Launch `STM32CubeIDE` to ensure it opens without issues.\n2. Connect the STM32\
    \ Board: Connect your STM32 development board to the computer via USB.\n3. Check\
    \ for Device Detection: In `STM32CubeIDE`, verify that the board is detected by\
    \ checking the Run or Debug configurations. The board should appear in the list\
    \ with its device name and serial number.\n\n***\n\n## 2. STM32CubeMX: Code Generation\
    \ and Configuration\n\n`STM32CubeMX` is a powerful graphical tool used for configuring\
    \ the hardware settings of STM32 microcontrollers. Using `STM32CubeMX`, you can\
    \ set up peripherals, configure GPIO pins, adjust clock settings, and generate\
    \ initialization code that `STM32CubeIDE` uses.\n\n### Steps for Using `STM32CubeMX`\n\
    \n1. Create a New Project:\n   - Open `STM32CubeIDE` and navigate to `File > New\
    \ > STM32 Project`.\n   - In the Target Selection window, select your STM32 model.\
    \ You can filter by series (e.g., `STM32F4`) or directly search by part number\
    \ (e.g., `STM32F103C8`).\n   - Select the desired microcontroller, click Next,\
    \ and enter the project name, location, and toolchain (`STM32CubeIDE`).\n\n2.\
    \ Configure GPIO Pins and Peripherals:\n   - In the graphical interface, click\
    \ on pins to assign specific functions (e.g., `GPIO`, `UART`, `I2C`, `ADC`).\n\
    \   - Each peripheral will offer adjustable settings. For example:\n     - `GPIO`:\
    \ Set pins as input, output, or alternate function.\n\n3. Configure Clock:\n \
    \  - Open the Clock Configuration to set up system clocks.\n   - Select internal\
    \ (HSI) or external (HSE) clock source, and adjust prescalers and dividers.\n\n\
    4. Set Middleware (Optional):\n   - In the Middleware tab, enable libraries like\
    \ FreeRTOS, USB or FATFS.\n\n5. Generate Code:\n   - After completing the setup,\
    \ click on Project > Generate Code.\n   - STM32CubeMX will generate initialization\
    \ code based on configuration.\n\n### Understanding the Generated Code Structure\n\
    \n- `main.c`: The main file containing the application logic.\n- `stm32xx_hal_conf.h`:\
    \ Configuration file that enables or disables HAL modules.\n- `Drivers/`: Contains\
    \ peripheral drivers and STM32 HAL libraries.\n- `system_stm32xx.c`: Sets up system\
    \ clocks and resets.\n\nThe code generated by `STM32CubeMX` ensures the initial\
    \ setup is ready for use, enabling developers to focus on building applications.\n\
    \n***\n\n## 3. Flashing Programs to STM32 Microcontrollers\n\nFlashing a program\
    \ to an STM32 microcontroller involves transferring the compiled binary to the\
    \ microcontroller’s memory, enabling it to execute the code. `STM32CubeIDE` simplifies\
    \ the flashing process using the built-in `ST-LINK`.\n\n### Steps for Flashing\n\
    \n1. Build the Project:\n   - In `STM32CubeIDE`, click `Project > Build Project`\
    \ or click the Build button.\n   - This compiles the code and generates a binary\
    \ file (`.bin` or `.hex`) ready for flashing.\n   - Review the Console output\
    \ for any errors or warnings.\n\n2. Set Up Flash Settings:\n   - Ensure the STM32\
    \ board is connected to your computer via the `ST-LINK`.\n   - In `STM32CubeIDE`,\
    \ go to `Run > Debug Configurations` to open the configuration settings.\n   -\
    \ Select `ST-LINK` as the debug probe and check that the correct microcontroller\
    \ is detected.\n\n3. Flash the Code to the STM32 Microcontroller:\n   - Click\
    \ `Debug` (or `Run` if debugging isn’t required).\n   - `STM32CubeIDE` will erase\
    \ the current flash memory, write the new binary file, and start executing the\
    \ program.\n- Upon successful flashing, the program will automatically start running\
    \ on the microcontroller.\n\n### Verifying Program Execution\n\n- LED or Output:\
    \ If your program involves LEDs, verify that the behavior matches the expected\
    \ output.\n- Serial Output: For programs using `UART`, open a serial terminal\
    \ (e.g., PuTTY) to monitor the output from the STM32.\n\n***\n\n## 4. Using STM32CubeIDE\
    \ for Project Setup\n\nSTM32CubeIDE` serves as the primary workspace for code\
    \ development, offering an integrated environment for managing code files, building\
    \ projects, and debugging.\n\n### Creating and Managing a Project in STM32CubeIDE\n\
    \n1. Starting a New Project:\n   - Open `STM32CubeIDE` and navigate to `File >\
    \ New > STM32 Project`.\n"
  raw: 'Getting started with STM32 development requires understanding the tools, software,
    and steps necessary to set up a functioning development environment. This chapter
    will guide you through setting up STM32CubeIDE, using STM32CubeMX to configure
    hardware, flashing programs onto the microcontroller, setting up projects, and
    performing basic debugging. By the end of this chapter, you will be equipped with
    the foundational skills to start building STM32-based applications.


    ## Chapter Goal


    ●      Successfully set up the STM32 development environment on your computer.


    ●      Learn to use STM32CubeMX for configuring peripherals, pins, and clocks.


    ●      Understand the process of flashing compiled code onto an STM32 microcontroller.


    ●      Navigate STM32CubeIDE for project setup, code management, and building
    projects.


    ●      Acquire basic debugging techniques to test and troubleshoot embedded applications.


    * * *


    ## 1\. Setting up the Development Environment


    To develop applications for STM32 microcontrollers, you’ll need to install specific
    tools and software, as well as set up the necessary hardware. Here’s a step-by-step
    guide to ensure you’re prepared to start coding.


    ### Required Software and Tools


    1.  STM32CubeIDE:


    ○ Description: STM32CubeIDE is an all-in-one integrated development environment
    (IDE) that combines code editing, compiling, debugging, and hardware configuration
    using STM32CubeMX.


    ○      Features:


    ■     Built-in STM32CubeMX for graphical hardware configuration.


    ■ Code editor with syntax highlighting, code suggestions, and error detection.


    ■     Integrated compiler and debugger for seamless code development.


    ○      Installation:


    ■     Download STM32CubeIDE from the STMicroelectronics website.


    ■ Follow the installation wizard, choosing installation options based on your
    operating system (Windows, macOS, or Linux).


    ■     Open STM32CubeIDE after installation to confirm it’s working properly.


    2.  STM32CubeMX:


    ○ Description: STM32CubeMX is a configuration and code-generation tool used for
    setting up microcontroller peripherals, clocks, and pin assignments.


    ○ Standalone vs. Integrated: STM32CubeMX is integrated within STM32CubeIDE, but
    a standalone version is also available.


    ○ Installation: If you’re using STM32CubeIDE, STM32CubeMX is already included,
    so no additional installation is required.


    3.  ST-LINK/V2 or ST-LINK/V3 Debugger:


    ○ Purpose: The ST-LINK hardware debugging tool is used to flash (program) and
    debug STM32 microcontrollers.


    ○ Connection: Connects via USB to your computer and to the STM32 development board
    via the SWD (Serial Wire Debug) interface or JTAG.


    4.  ST-LINK USB Driver (for Windows users):


    ○ Purpose: The ST-LINK USB driver allows Windows to recognize and communicate
    with the ST-LINK debugger.


    ○ Installation: Download the ST-LINK USB driver from the STMicroelectronics website
    and install it following the provided instructions.


    ### Development Hardware


    1.  STM32 Development Board: Common boards include STM32 Nucleo, Discovery, and
    Evaluation boards. Select a board that meets your project requirements (e.g.,
    STM32F446RE Nucleo).


    2.  USB Cable: A USB cable connects the STM32 board to your computer for power,
    flashing, and debugging.


    ### Verifying Installation and Setup


    1.  Open STM32CubeIDE: Launch STM32CubeIDE to ensure it opens without issues.


    2.  Connect the STM32 Board: Connect your STM32 development board to the computer
    via USB.


    3.  Check for Device Detection: In STM32CubeIDE, verify that the board is detected
    by checking the Run or Debug configurations. The board should appear in the list
    with its device name and serial number.


    * * *


    ## 2\. STM32CubeMX: Code Generation and Configuration


    STM32CubeMX is a powerful graphical tool used for configuring the hardware settings
    of STM32 microcontrollers. Using STM32CubeMX, you can set up peripherals, configure
    GPIO pins, adjust clock settings, and generate initialization code that STM32CubeIDE
    uses.


    ### Steps for Using STM32CubeMX


    1.  Create a New Project:


    ○      Open STM32CubeIDE and navigate to File > New > STM32 Project.


    ○ In the Target Selection window, select your STM32 model. You can filter by series
    (e.g., STM32F4) or directly search by part number (e.g., STM32F103C8).


    ○ Select the desired microcontroller, click Next, and enter the project name,
    location, and toolchain (STM32CubeIDE).


    2.  Configure GPIO Pins and Peripherals:


    ○ In the graphical interface, click on pins to assign specific functions (e.g.,
    GPIO, UART, I2C, ADC).


    ○      Each peripheral will offer adjustable settings. For example:


    ■     GPIO: Set pins as input, output, or alternate function.


    ■     UART: Configure TX/RX pins and set baud rate.


    ■ I2C and SPI: Set clock speed and choose appropriate pins.


    3.  Configure the Clock:


    ○ Open the Clock Configuration tab to set up system and peripheral clocks.


    ○ Select an internal (HSI) or external (HSE) clock source, and adjust prescalers
    and dividers.


    ○ Configure the clock frequency for the core and buses (AHB, APB1, and APB2).


    4.  Set Middleware Options (Optional):


    ○ In the Middleware tab, enable libraries like FreeRTOS (for real-time OS), USB,
    or FATFS (for file systems).


    ○ Set up middleware parameters if your project requires advanced features like
    USB or RTOS.


    5.  Generate Code:


    ○      After completing the setup, click on Project > Generate Code.


    ○ STM32CubeMX will generate initialization code based on the configured peripherals,
    including HAL (Hardware Abstraction Layer) library setup.


    ○ The generated code includes  main.c, peripheral initialization functions, and
    other project files required to start coding.


    ### Understanding the Generated Code Structure


    ● main.c: The main file containing the core application logic and the main loop.


    ●      stm32xxxx_hal_conf.h: Configuration file that enables or disables HAL modules.


    ●      Drivers folder: Contains peripheral drivers and STM32 HAL libraries.


    ●      system_stm32xxxx.c: Sets up system clocks and resets.


    The code generated by STM32CubeMX ensures the initial setup is ready for use,
    enabling developers to focus on building their application without manual configuration.


    * * *


    ## 3\. Flashing Programs to STM32 Microcontrollers


    Flashing a program to an STM32 microcontroller involves transferring the compiled
    binary to the microcontroller’s memory, enabling it to execute the code. STM32CubeIDE
    simplifies the flashing process using the built-in ST-LINK debugger.


    ### Steps for Flashing Programs


    1.  Build the Project:


    ○ In STM32CubeIDE, click Project > Build Project or click the Build button.


    ○ This compiles the code and generates a binary file (.bin or .hex) ready for
    flashing.


    ○      Review the Console output for any errors or warnings.


    2.  Set Up Flash Settings:


    ○ Ensure the STM32 board is connected to your computer via the ST-LINK debugger.


    ○ In STM32CubeIDE, go to Run > Debug Configurations to open the configuration
    settings.


    ○ Select ST-LINK as the debug probe and check that the correct microcontroller
    model is detected.


    3.  Flash the Code to the STM32 Microcontroller:


    ○      Click Debug (or Run if debugging isn’t required).


    ○ STM32CubeIDE will erase the current flash memory, write the new binary file,
    and start executing the program.


    ○ Upon successful flashing, the program will automatically start running on the
    microcontroller.


    ### Verifying Program Execution


    ● LED or Output: If your program involves LEDs, verify that the behavior matches
    the expected output.


    ● Serial Output: For programs using UART, open a serial terminal (e.g., PuTTY)
    to monitor the output from the STM32.


    * * *


    ## 4\. Using STM32CubeIDE for Project Setup


    STM32CubeIDE serves as the primary workspace for code development, offering an
    integrated environment for managing code files, building projects, and debugging.


    ### Creating and Managing a Project in STM32CubeIDE


    1.  Starting a New Project:


    ○      Open STM32CubeIDE and go to File > New > STM32 Project.'
