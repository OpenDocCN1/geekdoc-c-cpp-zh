    \ 语法\n\n```c\nHAL_I2C_Master_Transmit(&hi2c, address, data, size, timeout);\n\
    ```\n\n#### 语法说明\n\n● `HAL_I2C_Master_Transmit`: 用于微控制器向 I2C 设备发送数据的 HAL 函数。\n\
    \n● `&hi2c`: 指向 I2C 句的指针，表示正在使用的 I2C 外设。\n\n● `address`: 目标设备的 I2C 地址。\n\n● `data`:\
