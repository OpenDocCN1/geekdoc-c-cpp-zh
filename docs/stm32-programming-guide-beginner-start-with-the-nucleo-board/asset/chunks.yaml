  trans: "\n\n![](img/image_rsrc8B5.jpg)\n\n# STM32 编程指南\n\n第一版\nSarful Hassan\n\n\
    ## 前言\n本书是一份关于 STM32 微控制器编程的全面指南。它提供了详细的解释、实用示例和可操作的技巧，旨在帮助不同水平的开发者。无论你是探索嵌入式系统的初学者，还是希望深耕\
    \ STM32 知识的资深开发者，本书都能满足你的需求。\n\n## 本书适用对象\n本书适用于广泛的读者：\n* 为学术项目或研究学习 STM32 的学生。\n\
    * 有兴趣于使用 STM32 微控制器创建 DIY 项目的爱好者。\n* 正在构建或优化基于 STM32 系统的工程师。\n* 使用 STM32 作为嵌入式系统概念教学的教育工作者。\n\
    * 从其他平台迁移到 STM32 或希望提升技能的开发者。\n\n## 本书的结构\n本书分为几个结构良好的章节：\n1. STM32 微控制器和工具简介。\n\
    2. 输入/输出 (I/O) 操作，包括 `GPIO` 和高级技术。\n3. 编程基础知识，如变量、数据类型和控制结构。\n4. 高级主题，如定时器、数学函数和位运算。\n\
    5. 针对实际应用的实用示例。\n\n每一章都循序渐进，确保无缝的学习体验。\n\n## 未涵盖的主题\n为了保持重点突出且范围可控，以下主题未进行深入介绍：\n\
    * 针对 STM32 开发板的特定硬件设计原理。\n* 非 STM32 特定的外设模块。\n* 高级调试、分析和优化技术。\n\n如需进一步探索这些主题，读者可以参考官方\
    \ STM32 文档。\n\n## 代码风格（关于代码）\n本书中的所有代码示例均遵循清晰且一致的风格：\n* 易于读并有详细注释，以便理解。\n* 适用于各种\
    \ STM32 模型。\n* 在 STM32 `Nucleo` 和 `Discovery` 板上进行过测试以确保准确性。\n\n我们建议使用 `STM32CubeIDE`\
    \ 或同工具以获得最佳体验。\n\n## 更新说明\n此更新版本包含：\n* 关于定时器和位运算等高级主题的新示例。\n* 增强了对初学者友好的解释。\n\
    * 内容更新以反映最新的 STM32 开发工具和库。\n\n## 第一版说明\n本书的第一版为学习 STM32 编程奠定了基础。根据读者的宝贵反馈，此修订版增加了更丰富的内容和实践见解。\n\
    \n## MechatronicsLAB 在线学习\n获取更多资源、教程和支持，请访问 `MechatronicsLAB`：\n* 邮箱：`mechatronicslab@gmail.com`\n\
    * 网站：`mechatronicslab.net`\n\n## 第一版感谢\n感谢所有对本书成功做出贡献的人，包括评审员、测试人员和 STM32 社区。\n\
    \n## 版权\n© MechatronicsLAB。保留所有。未经 `MechatronicsLAB` 事先许可，不得复制或发本书的任何部分。\n\n##\
    \ 免责声明\n本书内容按“现状”提供。尽管已尽力确保准确，但作者和出版商对使用本文所含信息引起的任何错误、遗漏或损害不承担责任。\n\n## 目录\n*\
    \ STM32 编程指南\n* STM32 简介\n* STM32 入门\n* GPIO 简介\n* STM32 中的数字 I/O\n* STM32 中的模拟\
    \ I/O\n* STM32 中的高级 I/O\n* STM32 中的定时器\n* STM32 中的常量与变量\n* STM32 中的数据类型\n* STM32\
    \ 中的数据转换\n* STM32 中的控制结构\n* STM32 中的算术运算符\n* STM32 中的比较运算符\n* STM32 中的布尔运算符\n\
    * STM32 中的复合运算符\n* STM32 中的位运算符\n* STM32 中的数学函数\n* STM32 中的字符\n* STM32 中的随机数\n\
    * STM32 中的输出打印\n\n# STM32 简介\n\n## 章节概述\nSTM32 微控制器由意法半导体（STMicroelectronics）创建，是多功能、高性能的设备，广泛广泛嵌入式系统。这些微控制器在计算能力和能量效率之间取得了平衡，提供了广泛的外设支持，并在各种型号和系列中提供了良好的可扩展性。本章介绍了\
    \ STM32 家族，解释了其架构和核心特性，指导读者如何根据特定应用选择合适的 STM32 模型，并涵盖了基本的开发工具和软件。它概述了作为 STM32\
    \ 微控制器动力的 `ARM Cortex-M` 内。\n\n## 章节目标\n* 理解 STM32 家族的结构以及每个系列的目标应用领域。\n* 熟悉 STM32\
    \ 架构和使其适用于嵌入式应用的关键特性。\n* 学习为不同项目选择正确 STM32 模型的标准。\n* 探索用于 STM32 编程、调试和测试的开发工具和软件。\n\
    * 获得 `ARM Cortex-M` 内的基础知识，它是 STM32 微控制器的处理引擎。\n\n***\n\n## 1. STM32 家族概览\nSTM32\
    \ 微控制器的设计兼顾了灵活性、可扩展性和效率，适用于简单和复杂的嵌入式应用。STM32 家族提供了各种系列，以满足不同的应用需求，例如通用、高性能、低功耗和无线连接。\n\
    \n### STM32 家族中的关键系列\n1. **STM32F 系列 - 通用 MCU**\n    * 描述：`STM32F` 系列在性能和功能方面最全全，适用于通用应用。\n\
    \    * 关键特性：高速内部时钟、多个 `ADC` 通道、大容量 `Flash` 内存和广泛的外设支持。\n* 子系列：\n        * `STM32F0`：用于基础控制的入门级低成本系列。\n\
    \        * `STM32F1`：由于平衡了性能，被广泛应用。\n        * `STM32F4`：高性能系列，具有带有 `DSP` 能力的\
    \ `ARM Cortex-M4` 内核。\n        * `STM32F7：具有 M7 内核的高性能。\n    * 应用：工业控制、电机控制、音频处理和消费电子。\n\
    \n2. **STM32L 系列 - 低功耗 MCU**\n    * 描述：`STM32L` 微控制器具有节电功能，适用于电池供电和能量敏感的应用。\n\
    \    * 关键特性：超低功耗模式、多个时钟源和低功耗外设。\n    * 子系列：\n        * `STM32L0` 和 `L1`：适用于简单\
    \ `IoT` 应用的入门级低功耗系列。\n        * `STM32L4` 和 `L5`：具有 `ARM Cortex-M4` 和 `Cortex-M33`\
    \ 内核的高性能系列。\n    * 应用：可穿戴设备、环境监测传感器和便携式医疗设备。\n\n3. **STM32H 系列 - 高性能 MCU**\n \
    \   * 描述：`STM32H` 系列针对需要密集计算能力的应用进行了优化。\n    * 关键特性：双核选项、大量内存、高速 `ADCs` 和 `DSP`\
    \ 能力。\n    * 应用：实时数据处理、机器人、复杂的电机控制和汽车应用。\n\n4. **STM32G 系列 - 具有高效的通用 MCU**\n \
    \   * 描述：在成本效益和性能之间取得了平衡，其功能为成本敏感型应用定制。\n    * 关键特性：节能型、广泛的外设支持和增强的安全特性。\n\n"
- fmt: "\n## 5. STM32WB Series - Wireless MCUs\n\n- Applications: Consumer electronics,\
    \ IoT devices, and general-purpose applications.\n- Description: Integrated with\
    \ Bluetooth and Zigbee connectivity, the `STM32WB` series is designed for wireless\
    \ applications.\n- Key Features: Dual-core setup with `ARM Cortex-M4` and `Cortex-M0+`\
    \ cores, optimized for wireless stacks and application processing.\n- Applications:\
    \ Smart home devices, wearables, and connected sensors.\n\n## 6. STM32MP Series\
    \ - Microprocessors with ARM Cortex-A\n\n- Description: Combines `ARM Cortex-A`\
    \ cores for high-level OS and `Cortex-M` cores for real-time processing.\n- Key\
    \ Features: Supports `Linux` and real-time control, integrates advanced multimedia\
    \ and connectivity features.\n- Applications: Industrial automation, control panels,\
    \ and complex IoT applications requiring both real-time control and high-level\
    \ OS.\n\n### STM32 Naming Convention\n\nSTM32 part numbers are structured to help\
    \ identify the microcontroller series, performance level, and package type. A\
    \ typical STM32 part number is structured as follows:\n\n- Prefix (`STM32`): Identifies\
    \ the `STM32` family.\n- Product Series (e.g., `F4`, `L1`): Denotes the series\
    \ and subfamily (e.g., `F4` for high-performance).\n- Memory Size, Pin Count,\
    \ and Package: Specifies details such as Flash memory, `RAM`, `GPIO` count, and\
    \ package type (e.g., `STM32F446RE` has 512 KB Flash, 100 pins).\n\n## 2. STM32\
    \ Architecture and Core Features\n\nSTM32 microcontrollers are built around `ARM\
    \ Cortex-M` cores, offering low power consumption, high performance, and a rich\
    \ set of peripherals to cater to a broad range of applications. The architecture\
    \ of STM32 microcontrollers is optimized for embedded applications, combining\
    \ efficient processing with powerful peripheral interfaces.\n\n### Key Features\
    \ of STM32 Architecture\n\n1. **ARM Cortex-M Cores**:\n   - STM32 microcontrollers\
    \ utilize `ARM Cortex-M0`, `M0+`, `M3`, `M4`, and `M7` cores, each tailored to\
    \ offer different levels of performance.\n   - `DSP` capabilities in `Cortex-M4`\
    \ and `M7` cores provide support for applications involving real-time data processing.\n\
    \n2. **Extensive Peripheral Support**:\n   - STM32 MCUs integrate a variety of\
    \ peripherals such as `ADC`, `DAC`, `PWM`, `UART`, `SPI`, `I2C`, and `CAN`, enabling\
    \ seamless interfacing with sensors, actuators, and external memory.\n   - Specialized\
    \ peripherals, like `USB`, `Ethernet`, and `SDIO`, support more complex connectivity\
    \ requirements.\n\n3. **High-Speed Memory and Flash Options**:\n   - STM32 microcontrollers\
    \ offer up to 2MB of Flash memory, with options for external memory support (`NOR`,\
    \ `NAND`, and `SDRAM`).\n   - Configurable memory architecture allows for data\
    \ and code separation, enhancing performance.\n\n4. **Advanced Power Management**:\n\
    \   - Multiple power-saving modes (`Sleep`, `Stop`, `Standby`) provide flexibility\
    \ in managing power consumption.\n   - Designed to accommodate battery-operated\
    \ applications through advanced power control.\n\n5. **Enhanced Security**:\n\
    \   - Certain STM32 models include security features like secure boot, cryptographic\
    \ accelerators, and memory protection, suitable for IoT and secure communication.\n\
    \n6. **Flexible Clock Configuration**:\n   - Configurable clock sources and clock\
    \ dividers allow customization of CPU and peripheral speeds, optimizing both performance\
    \ and power usage.\n\n### Core Components of STM32 MCUs\n\n- **CPU (Central Processing\
    \ Unit)**: `ARM Cortex-M` cores provide the necessary processing power for embedded\
    \ applications, with support for efficient task management and `DSP`.\n- **Memory\
    \ Architecture**: On-chip `Flash` and `SRAM`, alongside external memory support,\
    \ allow STM32 MCUs to handle large data and complex code requirements.\n- **System\
    \ Peripherals**:\n   - `GPIO`: Allows control of input and output signals.\n \
    \  - `Timers`: Provides accurate time-keeping, `PWM` generation, and event handling.\n\
    \   - `Analog Peripherals`: `ADC` and `DAC` channels support analog signal processing.\n\
    \n## 3. Choosing the Right STM32 Model\n\nSelecting the right STM32 microcontroller\
    \ involves evaluating factors like performance, memory, power requirements, and\
    \ peripheral support. Different STM32 series cater to specific applications and\
    \ project requirements.\n\n### Application-Based Model Selection\n\n1. **Basic\
    \ Control Applications (Entry-Level)**:\n   - Suggested Series: `STM32F0`, `STM32G0`\n\
    \   - Typical Applications: Home automation, basic IoT devices, simple motor control.\n\
    \   - Considerations: Opt for lower-cost models with essential peripherals.\n\n\
    2. **Battery-Powered and Low-Power Applications**:\n   - Suggested Series: `STM32L`\
    \ series\n   - Typical Applications: Wearable devices, environmental sensors,\
    \ battery-operated devices.\n   - Considerations: Focus on models with ultra-low-power\
    \ modes and energy-efficient peripherals.\n\n3. **High-Performance and DSP Applications**:\n\
    \   - Suggested Series: `STM32F4`, `STM32F7`, `STM32H7`\n   - Typical Applications:\
    \ Robotics, data processing.\n   - Considerations: Prioritize `Flash` and advanced\
    \ peripherals.\n\n4. **Wireless Applications**:\n   - Suggested Series: `STM32WB`\n\
    \   - Typical Applications: Smart home systems, Bluetooth-enabled.\n   - Considerations:\
    \ Ensure compatibility with `Zigbee`.\n\n5. **Embedded Systems with Real-Time\
    \ Requirements**:\n   - Suggested Series: `STM32MP`\n   - Typical Applications:\
    \ Industrial automation, real-time control.\n   - Considerations: Requires `Linux`\
    \ OS.\n\n### Considerations for Model Selection\n\n- **Required Peripherals**:\
    \ Match `ADC`, `DAC`, etc.\n- **Power Consumption**: Prioritize for battery-dependent\
    \ projects.\n- **Memory Requirements**: Ensure sufficient `Flash` and `RAM`.\n\
    - **Cost Constraints**: Ensure the selected model aligns with budget.\n\n## 4.\
    \ Development Tools and Software\n\nSTM32 microcontrollers are supported by a\
    \ range of development environments and tools. The primary tool recommended for\
    \ STM32 is `STM32CubeIDE`, but others like `Keil` and `IAR` are popular.\n\n###\
    \ STM32CubeIDE\n\n- **Overview**: `STM32CubeIDE` is an integrated development\
    \ environment that combines the graphical configuration of `STM32CubeMX` with\
    \ the Eclipse IDE, providing a complete tool for STM32 development.\n- **Key Features**:\n\
    \  - Supports `STM32CubeMX`.\n  - Integrated editor, compiler, and debugger.\n\
    \  - Extensive debugging capabilities using STM32 debuggers.\n- **Use Case**:\
    \ Ideal for both beginners and advanced users, offering a complete solution for\
    \ setting up, configuring, and debugging STM32 projects.\n\n### STM32CubeMX\n\n\
    - **Overview**: `STM32CubeMX` is a configuration tool that simplifies hardware\
    \ setup by allowing users to visually configure the MCU’s peripherals, pins, and\
    \ clock tree.\n- **Key Features**:\n  - Graphical configuration of `GPIO`, peripherals,\
    \ and clocks.\n  - Generates initialization code for STM32 projects.\n- **Use\
    \ Case**: Essential for configuring the microcontroller’s hardware setup before\
    \ coding.\n\n### Keil MDK-ARM\n\n- **Overview**: A professional IDE optimized\
    \ for `ARM Cortex-M` microcontrollers, featuring a highly efficient compiler and\
    \ extensive debugging capabilities.\n- **Key Features**:\n  - Optimized compiler\
    \ for `ARM`, with real-time operating system (`RTOS`) support.\n  - Debugging\
    \ tools with real-time performance monitoring.\n- **Use Case**: Suitable for commercial\
    \ projects that require code optimization and professional debugging tools.\n\n\
    ### IAR Embedded Workbench\n\n- **Overview**: Another high-performance IDE that\
    \ offers a robust compiler and advanced debugging tools for embedded development.\n\
    - **Key Features**:\n  - Advanced code profiling and power debugging capabilities.\n"
  raw: '○      Applications: Consumer electronics, IoT devices, and general-purpose
    applications.


    5.  STM32WB Series - Wireless MCUs


    ○ Description: Integrated with Bluetooth and Zigbee connectivity, the STM32WB
    series is designed for wireless applications.


    ○ Key Features: Dual-core setup with ARM Cortex-M4 and Cortex-M0+ cores, optimized
    for wireless stacks and application processing.


    ○      Applications: Smart home devices, wearables, and connected sensors.


    6.  STM32MP Series - Microprocessors with ARM Cortex-A


    ○ Description: Combines ARM Cortex-A cores for high-level OS and Cortex-M cores
    for real-time processing.


    ○ Key Features: Supports Linux and real-time control, integrates advanced multimedia
    and connectivity features.


    ○ Applications: Industrial automation, control panels, and complex IoT applications
    requiring both real-time control and high-level OS.


    ### STM32 Naming Convention


    STM32 part numbers are structured to help identify the microcontroller series,
    performance level, and package type. A typical STM32 part number is structured
    as follows:


    ●      Prefix (STM32): Identifies the STM32 family.


    ● Product Series (e.g., F4, L1): Denotes the series and subfamily (e.g., F4 for
    high-performance).


    ● Memory Size, Pin Count, and Package: Specifies details such as Flash memory,
    RAM, GPIO count, and package type (e.g., STM32F446RE has 512 KB Flash, 100 pins).


    * * *


    ## 2\. STM32 Architecture and Core Features


    STM32 microcontrollers are built around ARM Cortex-M cores, offering low power
    consumption, high performance, and a rich set of peripherals to cater to a broad
    range of applications. The architecture of STM32 microcontrollers is optimized
    for embedded applications, combining efficient processing with powerful peripheral
    interfaces.


    ### Key Features of STM32 Architecture


    1.  ARM Cortex-M Cores:


    ○ STM32 microcontrollers utilize ARM Cortex-M0, M0+, M3, M4, and M7 cores, each
    tailored to offer different levels of performance.


    ○ DSP capabilities in Cortex-M4 and M7 cores provide support for applications
    involving real-time data processing.


    2.  Extensive Peripheral Support:


    ○ STM32 MCUs integrate a variety of peripherals such as ADC, DAC, PWM, UART, SPI,
    I2C, and CAN, enabling seamless interfacing with sensors, actuators, and external
    memory.


    ○ Specialized peripherals, like USB, Ethernet, and SDIO, support more complex
    connectivity requirements.


    3.  High-Speed Memory and Flash Options:


    ○ STM32 microcontrollers offer up to 2MB of Flash memory, with options for external
    memory support (NOR, NAND, and SDRAM).


    ○      Configurable memory architecture allows for data and code separation, enhancing
    performance.


    4.  Advanced Power Management:


    ○ Multiple power-saving modes (Sleep, Stop, Standby) provide flexibility in managing
    power consumption.


    ○      Designed to accommodate battery-operated applications through advanced
    power control.


    5.  Enhanced Security:


    ○ Certain STM32 models include security features like secure boot, cryptographic
    accelerators, and memory protection, suitable for IoT and secure communication.


    6.  Flexible Clock Configuration:


    ○ Configurable clock sources and clock dividers allow customization of CPU and
    peripheral speeds, optimizing both performance and power usage.


    ### Core Components of STM32 MCUs


    ● CPU (Central Processing Unit): ARM Cortex-M cores provide the necessary processing
    power for embedded applications, with support for efficient task management and
    DSP.


    ● Memory Architecture: On-chip Flash and SRAM, alongside external memory support,
    allow STM32 MCUs to handle large data and complex code requirements.


    ●      System Peripherals:


    ○      GPIO: Allows control of input and output signals.


    ○      Timers: Provides accurate time-keeping, PWM generation, and event handling.


    ○      Analog Peripherals: ADC and DAC channels support analog signal processing.


    * * *


    ## 3\. Choosing the Right STM32 Model


    Selecting the right STM32 microcontroller involves evaluating factors like performance,
    memory, power requirements, and peripheral support. Different STM32 series cater
    to specific applications and project requirements.


    ### Application-Based Model Selection


    1.  Basic Control Applications (Entry-Level):


    ○      Suggested Series: STM32F0, STM32G0


    ○      Typical Applications: Home automation, basic IoT devices, simple motor
    control.


    ○      Considerations: Opt for lower-cost models with essential peripherals.


    2.  Battery-Powered and Low-Power Applications:


    ○      Suggested Series: STM32L series


    ○      Typical Applications: Wearable devices, environmental sensors, battery-operated
    devices.


    ○      Considerations: Focus on models with ultra-low-power modes and energy-efficient
    peripherals.


    3.  High-Performance and DSP Applications:


    ○      Suggested Series: STM32F4, STM32F7, STM32H7


    ○      Typical Applications: Industrial automation, robotics, data processing.


    ○      Considerations: Prioritize processing power, memory, and advanced peripherals.


    4.  Wireless IoT Applications:


    ○      Suggested Series: STM32WB


    ○      Typical Applications: Smart home systems, Bluetooth-enabled wearables.


    ○      Considerations: Ensure compatibility with Bluetooth or Zigbee wireless
    protocols.


    5.  Embedded Systems with Real-Time OS Requirements:


    ○      Suggested Series: STM32MP1 series


    ○ Typical Applications: Systems requiring both high-level OS and real-time control,
    such as industrial HMI panels.


    ○ Considerations: Requires a dual-core setup to handle both Linux OS tasks and
    real-time processing.


    ### Considerations for Model Selection


    ● Required Peripherals: Match the MCU’s peripherals with project needs (e.g.,
    ADC, DAC, communication protocols).


    ●      Power Consumption: Low-power models should be prioritized for battery-dependent
    projects.


    ● Memory Requirements: Choose a model with sufficient Flash and RAM to handle
    the application code and data.


    ●      Cost Constraints: Ensure the selected model aligns with the project’s budget.


    * * *


    ## 4\. Development Tools and Software


    STM32 microcontrollers are supported by a range of development environments and
    tools. The primary tool recommended for STM32 development is STM32CubeIDE, but
    others like Keil and IAR are popular in commercial applications.


    ### STM32CubeIDE


    ● Overview: STM32CubeIDE is an integrated development environment that combines
    the graphical configuration of STM32CubeMX with the Eclipse IDE, providing a complete
    tool for STM32 development.


    ●      Key Features:


    ○      Supports STM32CubeMX for hardware configuration.


    ○      Integrated editor, compiler, and debugger.


    ○      Extensive debugging capabilities using STM32 debuggers.


    ● Use Case: Ideal for both beginners and advanced users, offering a complete solution
    for setting up, configuring, and debugging STM32 projects.


    ### STM32CubeMX


    ● Overview: STM32CubeMX is a configuration tool that simplifies hardware setup
    by allowing users to visually configure the MCU’s peripherals, pins, and clock
    tree.


    ●      Key Features:


    ○      Graphical configuration of GPIO, peripherals, and clocks.


    ○      Generates initialization code for STM32 projects.


    ●      Use Case: Essential for configuring the microcontroller’s hardware setup
    before coding.


    ### Keil MDK-ARM


    ● Overview: A professional IDE optimized for ARM Cortex-M microcontrollers, featuring
    a highly efficient compiler and extensive debugging capabilities.


    ●      Key Features:


    ○      Optimized compiler for ARM, with real-time operating system (RTOS) support.


    ○      Debugging tools with real-time performance monitoring.


    ● Use Case: Suitable for commercial projects that require code optimization and
    professional debugging tools.


    ### IAR Embedded Workbench


    ● Overview: Another high-performance IDE that offers a robust compiler and advanced
    debugging tools for embedded development.


    ●      Key Features:


    ○      Advanced code profiling and power debugging capabilities.'
