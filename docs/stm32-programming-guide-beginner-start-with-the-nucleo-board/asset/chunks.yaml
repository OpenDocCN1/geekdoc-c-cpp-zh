  raw: '●      Simplify Cyclic Operations: Useful for creating loops that reset periodically.


    #### Syntax


    variable %=  value;


    #### Syntax Explanation


    ●      variable: The variable to store the remainder.


    ●      %=: The modulus assignment operator, which calculates  variable % value.


    ●      value: The divisor.


    ●      Operands: Must be integers for modulus to be meaningful.


    ●      Result:  variable stores the remainder after division by  value.


    #### Simple Code Example


    int counter =  10;


    counter %=  3; // counter is now 1


    #### Code Example Explanation


    ● Calculates remainder of  counter / 3: The new value of  counter is 1, as 10
    divided by 3 leaves a remainder of 1.


    #### Notes


    ● counter %= max; can implement cyclic counters that reset when they reach a maximum.


    ●      Ideal for managing periodic tasks in loops.


    #### Warnings


    ●      Using modulus with zero will result in a runtime error.


    * * *


    ## Final Project: Sensor Data Processing with Compound Operators


    ### Project Objective


    Process real-time sensor data using compound operators to update values, calculate
    averages, and control an LED based on thresholds.


    ### Project Circuit


    | Component | Pin Description | Connection Details |


    | STM32 Microcontroller | ADC Channel | Reads data from temperature sensor |


    | Temperature Sensor | Connected to ADC input | Provides temperature data |


    | LED | GPIO Output | Indicates if temperature exceeds threshold |


    ### Project Code


    #include  "stm32f4xx_hal.h"


    ADC_HandleTypeDef hadc1;


    void ADC_Init(void)  {


    __HAL_RCC_ADC1_CLK_ENABLE();


    hadc1.Instance  = ADC1;


    hadc1.Init.Resolution  = ADC_RESOLUTION_12B;


    HAL_ADC_Init(&hadc1);


    }


    void LED_Control(int temp)  {


    if  (temp >=  30)  {


    LED_ON();


    }  else  {


    LED_OFF();


    }


    }


    int main(void)  {


    HAL_Init();


    ADC_Init();


    uint32_t adcValue;


    int temp;


    int totalTemp =  0;


    int sampleCount =  0;


    while  (1)  {


    HAL_ADC_Start(&hadc1);


    if  (HAL_ADC_PollForConversion(&hadc1, HAL_MAX_DELAY)  == HAL_OK)  {


    adcValue = HAL_ADC_GetValue(&hadc1);


    temp =  (adcValue *  100)  /  4095;  // Convert ADC to temperature


    // Update totalTemp and sampleCount using compound operators


    totalTemp += temp;


    sampleCount +=  1;


    if  (sampleCount ==  10)  {  // Every 10 samples, calculate the average


    int averageTemp = totalTemp / sampleCount;


    LED_Control(averageTemp);  // Control LED based on average temperature


    // Reset totalTemp and sampleCount


    totalTemp =  0;


    sampleCount =  0;


    }


    }


    HAL_Delay(1000);


    }


    }


    ### Save and Run


    1.  Save the code as  main.c.


    2.  Compile and upload to the STM32 NUCLEO-F446RE using STM32CubeIDE or Keil.


    ### Check Output


    ● The LED is controlled based on the average temperature calculated every 10 samples,
    using compound operators to manage data accumulation and reset.


    * * *


    ## Summary


    This chapter covered essential compound operators in C for STM32 programming,
    including addition assignment, subtraction assignment, multiplication assignment,
    division assignment, and modulus assignment. Compound operators help simplify
    calculations and improve code readability in embedded systems. The final project
    demonstrated how to use compound operators to manage sensor data processing and
    control an LED based on temperature thresholds.


    # Bitwise Operators in STM32


    ## Chapter Overview


    Bitwise operators allow manipulation of individual bits within a variable, which
    is particularly useful in embedded systems where efficient data processing is
    essential. Bitwise operations are commonly used to control hardware, manage flags,
    and perform low-level data manipulation. This chapter covers the essential bitwise
    operators in C, explaining their usage, syntax, and practical application in STM32
    programming.


    ## Chapter Goal


    ● Understand and use the main bitwise operators: AND (&), OR (|), XOR (^), NOT
    (~), left shift (<<), and right shift (>>).


    ● Learn how to manipulate individual bits for tasks like setting, clearing, toggling,
    and checking specific bits.


    ● Apply bitwise operations in a practical project to control an LED matrix based
    on specific bit patterns.


    ## Rules


    ● Use Bitwise AND to Mask Bits: Apply the & operator to clear or isolate specific
    bits.


    ● Apply Bitwise OR to Set Bits: Use | to turn on specific bits without affecting
    others.


    ● Use XOR to Toggle Bits: Apply ^ to flip bits from 0 to 1 or from 1 to 0.


    ● Use Shifts for Efficient Multiplication and Division: Left shift (<<) to multiply
    by powers of 2, right shift (>>) to divide.


    ● Control Operator Precedence with Parentheses: Use parentheses in complex expressions
    to ensure correct order of operations.


    ## Syntax Table


    | Serial No | Operator | Code Snippet | Simple Example |


    | 1 | AND (&) | result = a & b; | mask = value & 0x0F; |


    | 3 | XOR (^) | result = a ^ b; | toggle = state ^ 0x01; |


    | 4 | NOT (~) | result = ~a; | inverted = ~value; |


    | 5 | Left Shift (<<) | result = a << n; | shifted = value << 2; |


    | 6 | Right Shift (>>) | result = a >> n; | shifted = value >> 3; |


    * * *


    ## Topic Explanations


    ### 1\. Bitwise AND (&)


    #### What is the Bitwise AND Operator?


    The bitwise AND operator (&) performs a binary AND operation between corresponding
    bits of two operands. It’s commonly used to mask bits, clearing unwanted bits
    while keeping specific bits intact.


    #### Use Purpose


    ●      Masking: Clears bits selectively to isolate specific parts of a value.


    ● Bit Checking: Checks if specific bits are set by masking all other bits.


    #### Syntax


    result = operand1 & operand2;


    #### Syntax Explanation


    ●      result: Stores the outcome of the bitwise AND operation.


    ●      operand1: The first value.


    ● &: The AND operator, which sets each bit in  result to 1 if both corresponding
    bits in  operand1 and  operand2 are 1.


    ●      operand2: The second value.


    ●      Operands: Often used with hexadecimal masks to isolate specific bits.


    ● Result: Each bit in  result is 1 only if the corresponding bits in both operands
    are 1.


    #### Simple Code Example


    int  value  =  0b10101101;


    int mask =  0b00001111;


    int result =  value  & mask; // result is 0b00001101


    #### Code Example Explanation


    ● Applies  mask to  value: Only the last four bits are retained; the rest are
    cleared.


    #### Notes


    ●      & is commonly used to clear bits by applying a mask.


    ●      Often used to check the status of specific bits.


    #### Warnings


    ●      Be cautious with mask values to avoid clearing unintended bits.


    * * *


    ### 2\. Bitwise OR (|)


    #### What is the Bitwise OR Operator?


    The bitwise OR operator (|) performs a binary OR operation between corresponding
    bits of two operands. It’s used to set specific bits without affecting other bits
    in a variable.


    #### Use Purpose


    ●      Setting Bits: Turns on specific bits while leaving others unchanged.


    ●      Combining Flags: Used to combine multiple binary flags.


    #### Syntax


    result = operand1 | operand2;


    #### Syntax Explanation


    ●      result: Stores the outcome of the bitwise OR operation.


    ●      operand1: The first value.


    ● |: The OR operator, which sets each bit in  result to 1 if either corresponding
    bit in  operand1 or  operand2 is 1.


    ●      operand2: The second value.


    ●      Operands: Can be variables, literals, or masks.


    ● Result: Each bit in  result is 1 if either bit in the operands is 1.


    #### Simple Code Example


    int flags =  0b00001000;


    int enableBit =  0b00000010;


    int result = flags | enableBit; // result is 0b00001010


    #### Code Example Explanation


    ●      Sets a specific bit in  flags without altering other bits.


    #### Notes


    ● | is useful for setting individual bits in a control register or flag variable.


    ●      Use carefully to avoid unintentionally setting unwanted bits.


    #### Warnings


    ●      Ensure mask values don’t unintentionally alter required bits.


    * * *


    ### 3\. Bitwise XOR (^)


    #### What is the Bitwise XOR Operator?'
