  trans: "\n\n### 示例：闪烁 LED\n\n此示例演示了如何使用输出模式下的 GPIO 使 LED 闪烁。\n\n1. 硬件设置：\n- 将 LED\
    \ 连接到 `GPIOA` 引脚 `PA5`，在 LED 和引脚之间接入限流电阻（例如 `220Ω`）。\n\n2. 在 STM32CubeMX 中配置 GPIO：\n\
    - 在 STM32CubeMX 中将 `PA5` 设置为 `GPIO_Output`。\n- 将引脚模式配置为 `Output`（输出），并设为 `No Pull`（无上下拉）和\
    \ `Low Speed`（低速）。\n\n3. LED 闪烁代码示例：\n\n```c\n#include  \"main.h\"\n\nint main(void)\
    \  {\n  HAL_Init();\n  MX_GPIO_Init();  // 初始化 GPIO 配置\n  while  (1)  {\n    HAL_GPIO_WritePin(GPIOA,\
    \ GPIO_PIN_5, GPIO_PIN_SET);  // 开启 LED\n    HAL_Delay(500);                 \
    \              // 延迟 500 毫秒\n    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_RESET);\
    \  // 关闭 LED\n    HAL_Delay(500);                               // 延迟 500 毫秒\n\
    \  }\n}\n```\n\n### 代码说明\n- `HAL_GPIO_WritePin`: 将 `GPIOA` 引脚 5 置高电平（`GPIO_PIN_SET`）以开启\
    \ LED，置低电平（`GPIO_PIN_RESET`）以关闭。\n- `HAL_Delay`: 在状态变化之间创建 500 毫秒的延迟，产生闪烁效果。\n\
    \n***\n\n## 4. 使用 GPIO 输入\n\nGPIO 输入模式允许 STM32 微控制器从外部设备（如开关、按钮和传感器）读取数字信号。\n\n\
    ### 示例：读取按钮状态\n\n在此示例中，我们配置一个 GPIO 引脚来检测按钮是否被按下或释放。\n\n1. 硬件设置：\n- 将按键连接到 `GPIOC`\
    \ 引脚 `PC13`，一端接地，另一端连接到 `PC13`。确保引脚已启用内部上拉电阻。\n\n2. 在 STM32CubeMX 中配置 GPIO：\n\
    - 将 `PC13` 设置为 `GPIO_Input`。\n- 将引脚模式配置为 `Input`（输入），并使用 `Pull-Up`（上拉）电阻以确保按钮未按下时保持默认高电平。\n\
    \n3. 按钮输入代码示例：\n\n```c\n#include  \"main.h\"\n\nint main(void)  {\n  HAL_Init();\n\
    \  MX_GPIO_Init();  // 初始化 GPIO 配置\n  while  (1)  {\n    if  (HAL_GPIO_ReadPin(GPIOC,\
    \ GPIO_PIN_13)  == GPIO_PIN_RESET)  {\n      // 按钮按下\n      HAL_GPIO_WritePin(GPIOA,\
    \ GPIO_PIN_5, GPIO_PIN_SET);  // 开启 LED\n    }  else  \n      // 按钮释放\n      HAL_GPIO_WritePin(GPIOA,\
    \ GPIO_PIN_5, GPIO_PIN_RESET);  // 关闭 LED\n    }\n  }\n}\n```\n\n### 代码说明\n- `HAL_GPIO_ReadPin`:\
    \ 读取 `GPIOC` 引脚 13 的状态。当按钮按下时，引脚状态为低电平（`GPIO_PIN_RESET`），否则为高电平（`GPIO_PIN_SET`）。\n\
    - `If-Else` 语句：如果按钮被按下，LED 开启；如果释放，LED 关闭。\n\n***\n\n## 5. GPIO 中断\n\nGPIO 中断允许\
    \ STM32 微控制器响应 GPIO 引脚状态的变化（例如当按下按钮时）。中断能够实现高效处理，因为允许 MCU 立即响应事件，而无需不断轮询。\n\n\
    ### 设置 GPIO 中断\n\n1. 在 STM32CubeMX 中配置引脚中断：\n- 将 `PC13` 设置为 `GPIO_Input` 并配置为\
    \ `Pull-Up`（上拉）。\n- 在 NVIC 设置中启用 `PC13` 的 `EXTI Line 13` 中断。\n\n2. 按钮中断代码示例：\n\
    \n```c\n#include  \"main.h\"\n\nvoid HAL_GPIO_EXTI_Callback(uint16_t GPIO_Pin)\
    \  {\n  if  (GPIO_Pin == GPIO_PIN_13)  {\n    HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5);\
    \  // 翻转 LED \n  }\n}\n\nint main(void)  {\n  HAL_Init();\n  MX_GPIO_Init(); \
    \ // 初始化 GPIO 配置\n  while  (1)  {\n    // 主循环可以执行其他任务\n  }\n}\n```\n\n### 代码说明\n\
    - `HAL_GPIO_EXTI_Callback`: 由 `PC13` 中断触发的回调函数。检查中断是否来自 `GPIO_PIN_13` 并相应地翻转 LED\
    \ 状态。\n- 翻转 LED：`HAL_GPIO_TogglePin` 每次按下按钮时都会改变 LED 的状态。\n\n***\n\n## 6. GPIO\
    \ 上拉电阻和下拉电阻\n\n内部上拉和下拉电阻有助于在没有外部连接时，在 GPIO 输入引脚上保持稳定的逻辑电平（高或低）。这对于稳定的信号读取至关重要，特别是对于按钮和开关。\n\
    \n### 电阻的类型\n- 上拉电阻：在没有输入信号时，将引脚保持在高逻辑电平（`Vcc`）。\n- 下拉电阻：在没有输入信号时，将引脚保持在低逻辑电平（`ground`）。\n\
