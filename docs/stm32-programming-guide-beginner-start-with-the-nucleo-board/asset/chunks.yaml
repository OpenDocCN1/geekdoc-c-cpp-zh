    ## 6. Set Timer Auto-Reload


    ### What is Setting Timer Auto-Reload?

    Auto-reload allows the timer to reset after reaching a value.


    ### Use Purpose

    - **Continuous Timing**: Useful for applications requiring continuous timing.

    - **Periodic Interrupts**: Sets the point at which the counter re-loads back to
    zero.


    ### Syntax

    ```c

    TIMx->ARR = value;

    ```


    ### Syntax Explanation

    - `TIMx`: The specific timer, such as `TIM2` or `TIM3`.

    - `ARR`: The auto-reload register, which defines the period.

    - `value`: The auto-reload value, which determines the interval.


    ### Simple Code Example

    ```c

    TIM2->ARR = 1000; // Sets auto-reload to 1000

    ```


    ### Code Example Explanation

    - Sets `TIM2` to auto-reload at `1000`: This enables interrupts.


    ## Notes

    - Setting ARR correctly is essential for precise timing.

    - Auto-reload is useful for PWM or periodic tasks.


    ## Warnings

    - Incorrect values in ARR can lead to timing errors.


    ***


    ## 7. Delay using HAL


    ### What is Delay using HAL?

    The HAL delay function creates a delay in milliseconds, pausing code execution
    for the specified time.


    ### Use Purpose

    - **Simple Time Delays**: Useful for debouncing or short pauses.

    - **Non-Precise Timing**: Suitable for basic delays without strict timing.


    ### Syntax

    ```c

    HAL_Delay(ms);

    ```


    ### Syntax Explanation

    - `HAL_Delay`: HAL function that creates a blocking delay.

    - `ms`: The delay duration in milliseconds.


    ### Simple Code Example

    ```c

    HAL_Delay(1000); // Delays execution for 1 second

    ```


    ### Code Example Explanation

    - Pauses execution for `1000 ms`: Creates a 1-second delay, halting further code
    execution.


    ## Notes

    - `HAL_Delay` is not suitable for precise timing tasks.

    - It blocks code execution, so avoid using it in time-sensitive sections.


    ## Warnings

    - Using long delays may affect system responsiveness.

