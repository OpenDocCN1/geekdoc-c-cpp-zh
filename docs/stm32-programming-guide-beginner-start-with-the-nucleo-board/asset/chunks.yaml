    \n***\n\n### 6. 打印十六进制 (%x)\n\n#### 什么是十六进制打印？\n在 `printf` 中使用 `%x` 可以以十六进制格式显示整数值。十六进制输出对于调试内存地址、标志位和二进制数据非常有用。\n\
