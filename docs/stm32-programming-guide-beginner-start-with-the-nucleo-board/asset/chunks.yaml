  raw: '### Example: Blinking an LED


    This example demonstrates how to blink an LED using GPIO in output mode.


    1.  Hardware Setup:


    ○ Connect an LED to GPIOA pin PA5, with a current-limiting resistor (e.g., 220Ω)
    between the LED and the pin.


    2.  GPIO Configuration in STM32CubeMX:


    ○      Set PA5 as GPIO_Output in STM32CubeMX.


    ○ Configure the pin as  Output mode, with  No Pull and  Low Speed.


    3.  Code Example for LED Blinking:


    #include  "main.h"


    int main(void)  {


    HAL_Init();


    MX_GPIO_Init();  // Initializes GPIO configurations


    while  (1)  {


    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_SET);  // Turn on LED


    HAL_Delay(500);                                      // Delay 500 ms


    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_RESET);  // Turn off LED


    HAL_Delay(500);                                      // Delay 500 ms


    }


    }


    ### Explanation of the Code


    ● HAL_GPIO_WritePin: Sets GPIOA pin 5 high (GPIO_PIN_SET) to turn on the LED and
    low (GPIO_PIN_RESET) to turn it off.


    ● HAL_Delay: Creates a delay of 500 milliseconds between each state change, resulting
    in a blinking effect.


    * * *


    ## 4\. Using GPIO for Input


    GPIO input mode allows the STM32 microcontroller to read digital signals from
    external devices, such as switches, buttons, and sensors.


    ### Example: Reading a Button State


    In this example, we configure a GPIO pin to detect whether a button is pressed
    or released.


    1.  Hardware Setup:


    ○ Connect a push-button to GPIOC pin PC13, with one terminal connected to ground
    and the other connected to PC13\. Ensure the pin has an internal pull-up resistor
    enabled.


    2.  GPIO Configuration in STM32CubeMX:


    ○      Set PC13 as GPIO_Input.


    ○ Configure the pin mode as  Input, with a  Pull-Up resistor to ensure a default
    high state when the button is not pressed.


    3.  Code Example for Button Input:


    #include  "main.h"


    int main(void)  {


    HAL_Init();


    MX_GPIO_Init();  // Initializes GPIO configurations


    while  (1)  {


    if  (HAL_GPIO_ReadPin(GPIOC, GPIO_PIN_13)  == GPIO_PIN_RESET)  {


    // Button pressed


    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_SET);  // Turn on LED


    }  else  {


    // Button released


    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_RESET);  // Turn off LED


    }


    }


    }


    ### Explanation of the Code


    ● HAL_GPIO_ReadPin: Reads the state of GPIOC pin 13\. When the button is pressed,
    the pin state is low (GPIO_PIN_RESET), otherwise, it is high (GPIO_PIN_SET).


    ● If-Else Statement: If the button is pressed, the LED turns on. If released,
    the LED turns off.


    * * *


    ## 5\. GPIO Interrupts


    GPIO interrupts allow the STM32 microcontroller to respond to changes in a GPIO
    pin state (e.g., when a button is pressed). Interrupts enable efficient processing,
    as they allow the MCU to react to events immediately without constant polling.


    ### Setting Up a GPIO Interrupt


    1.  Configure the Pin for Interrupt in STM32CubeMX:


    ○      Set PC13 as GPIO_Input with  Pull-Up.


    ○      Enable EXTI Line 13 interrupt for PC13 in the NVIC settings.


    2.  Code Example for Button Interrupt:


    #include  "main.h"


    void HAL_GPIO_EXTI_Callback(uint16_t GPIO_Pin)  {


    if  (GPIO_Pin == GPIO_PIN_13)  {


    HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5);  // Toggle LED


    }


    }


    int main(void)  {


    HAL_Init();


    MX_GPIO_Init();  // Initializes GPIO configurations


    while  (1)  {


    // Main loop can perform other tasks


    }


    }


    ### Explanation of the Code


    ● HAL_GPIO_EXTI_Callback: A callback function triggered by an interrupt on PC13\.
    It checks if the interrupt is from GPIO_PIN_13 and toggles the LED accordingly.


    ● Toggle LED:  HAL_GPIO_TogglePin changes the LED state each time the button is
    pressed.


    * * *


    ## 6\. GPIO Pull-Up and Pull-Down Resistors


    Internal pull-up and pull-down resistors help maintain a stable logic level (high
    or low) on GPIO input pins when there’s no external connection. This is essential
    for stable signal reading, especially with buttons and switches.


    ### Types of Resistors


    ● Pull-Up Resistor: Keeps the pin at a high logic level (Vcc) when no input signal
    is present.


    ● Pull-Down Resistor: Keeps the pin at a low logic level (ground) when no input
    signal is present.


    # Digital I/O in STM32


    ## Chapter Overview


    Digital I/O (Input/Output) functionality is fundamental in embedded systems, enabling
    microcontrollers to interact with external components like LEDs, switches, sensors,
    and relays. The STM32 NUCLEO-F446RE provides General Purpose Input/Output (GPIO)
    pins that can be configured as digital inputs or outputs. This chapter covers
    GPIO configurations and demonstrates practical usage in a final project.


    ## Chapter Goal


    ● Learn how to configure GPIO pins as digital inputs and outputs on the STM32
    NUCLEO-F446RE.


    ● Understand how to control external components, such as LEDs, using GPIO outputs.


    ●      Learn to read signals from components, like buttons, using GPIO inputs.


    ● Complete a hands-on project to toggle an LED based on button presses, demonstrating
    practical GPIO usage.


    ## Rules


    ● Enable GPIO Clock: Enable the clock for each GPIO port before configuring pins
    to power the port.


    ● Set Pin Mode: Define each pin as input, output, or alternate function.


    ● Use Pull-Up/Down Resistors: Configure internal pull-up or pull-down resistors
    to stabilize input signals and avoid floating inputs.


    ●      Output Control: Use GPIO output to control external devices.


    ●      Input Reading: Set GPIO pins as inputs to read external signals.


    ## Syntax Table


    | Serial No | Topic | Code Snippet | Simple Example |


    | 1 | Enable GPIO Clock | __HAL_RCC_GPIOx_CLK_ENABLE() | __HAL_RCC_GPIOA_CLK_ENABLE()
    |


    | 2 | Configure GPIO Pin Mode | GPIO_InitStruct.Mode = GPIO_MODE_xxx | GPIO_InitStruct.Mode
    = GPIO_MODE_OUTPUT_PP |


    | 3 | Configure GPIO Speed | GPIO_InitStruct.Speed = GPIO_SPEED_xxx | GPIO_InitStruct.Speed
    = GPIO_SPEED_LOW |


    | 4 | Set Output High | HAL_GPIO_WritePin(GPIOx, GPIO_PIN_y, GPIO_PIN_SET) | HAL_GPIO_WritePin(GPIOA,
    GPIO_PIN_5, GPIO_PIN_SET) |


    | 5 | Set Output Low | HAL_GPIO_WritePin(GPIOx, GPIO_PIN_y, GPIO_PIN_RESET) |
    HAL_GPIO_WritePin(GPIOA, GPIO_PIN_5, GPIO_PIN_RESET) |


    | 6 | Toggle GPIO Pin | HAL_GPIO_TogglePin(GPIOx, GPIO_PIN_y) | HAL_GPIO_TogglePin(GPIOA,
    GPIO_PIN_5) |


    | 7 | Read GPIO Input | HAL_GPIO_ReadPin(GPIOx, GPIO_PIN_y) | HAL_GPIO_ReadPin(GPIOB,
    GPIO_PIN_0) |


    * * *


    ## Topic Explanations


    ### 1\. Enable GPIO Clock


    #### What is Enabling the GPIO Clock?


    Enabling the GPIO clock provides power to a GPIO port, making the port’s pins
    accessible for configuration and use. Without enabling the clock, any operations
    on the port will be ineffective.


    #### Use Purpose


    ● Activate GPIO Ports: Powers the selected GPIO port (e.g.,  GPIOA,  GPIOB) to
    make it operational.


    ●      Essential for GPIO Operations: Enables communication and configuration
    of GPIO pins.


    #### Syntax


    __HAL_RCC_GPIOx_CLK_ENABLE();


    #### Syntax Explanation


    ● __HAL_RCC: Prefix used in STM32 HAL (Hardware Abstraction Layer) functions related
    to Reset and Clock Control (RCC).


    ● GPIOx: Specifies the GPIO port to enable, such as  GPIOA,  GPIOB, or  GPIOC.


    ● CLK_ENABLE(): Macro function that enables the clock for the specified peripheral,
    allowing it to receive power and function.


    #### Simple Code Example


    __HAL_RCC_GPIOA_CLK_ENABLE(); // Enables clock for GPIO port A


    #### Code Example Explanation


    ● Enables clock for GPIOA: Powers up GPIO port A, making its pins ready for configuration
    and use.


    ● Mandatory for GPIO operations: This line is essential; without it, any configurations
    or functions involving GPIOA will fail.


    #### Notes


    ● Enable clocks only for the GPIO ports in use to optimize power consumption.


    ● Each GPIO port (e.g.,  GPIOA,  GPIOB) requires its own clock enable function.


    #### Warnings


    ● Skipping clock enablement will result in ineffective GPIO configurations and
    operations on that port.


    * * *


