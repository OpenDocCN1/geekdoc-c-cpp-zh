  trans: "\n\nGPIO 引脚模式设置决定了每个 GPIO 引脚的行为——即它是作为输入、输出还是复用功能引脚工作。\n\n#### 用途\n\n- 定义引脚功能：配置引脚作为输入、输出或复用功能引脚。\n\
    - 控制信号方向：将引脚设置为发送（输出）或接收（输入）数字信号。\n\n#### 语法\n\n```\nGPIO_InitStruct.Mode = GPIO_MODE_xxx;\n\
    ```\n\n#### 语法解释\n\n- `GPIO_InitStruct`: STM32 HAL 库中的一个结构体，用于保存 GPIO 引脚的配置设置。\n\
    - `.Mode`: `GPIO_InitStruct` 的一个成员，用于定义 GPIO 引脚的模式。\n- `GPIO_MODE_xxx`: 模式选项包括：\n\
    \  - `GPIO_MODE_INPUT`: 将引脚配置为数字输入。\n  - `GPIO_MODE_OUTPUT_PP`: 将引脚设置为推挽输出，该引脚会主动驱动高电平和和低电平。\n\
    \  - `GPIO_MODE_AF_PP`: 将引脚配置为推挽模式下的复用功能（例如 UART、SPI）。\n\n#### 简单代码示例\n\n```\n\
    GPIO_InitTypeDef GPIO_InitStruct;\nGPIO_InitStruct.Pin = GPIO_PIN_5;\nGPIO_InitStruct.Mode\
    \ = GPIO_MODE_OUTPUT_PP; // 设置引脚为推挽输出\n```\n\n#### 代码示例解释\n\n- 定义配置结构体 (`GPIO_InitStruct`)：持有配置\
    \ GPIO 的设置。\n- 设置 GPIO 引脚 5 为输出：配置引脚 5 主动驱动高电压和低电压，以控制 LED 等设备。\n\n#### 注意事项\n\
    \n- 推挽模式常用于数字输出。\n- 对于复用功能（如 UART、SPI），使用带有适当复用功能编号的 `GPIO_MODE_AF_PP`。\n\n####\
    \ 警告\n\n- 模式选择错误（例如将输入引脚配置为输出）可能会导致硬件冲突或功能异常。\n\n***\n\n### 3. 配置 GPIO 速度\n\n\
    #### 什么是配置 GPIO 速度？\n\nGPIO 速度设置指定了 GPIO 引脚改变状态的速度，影响输出信号的最大频率。更快的速度可以实现快速的状态切换，但会增加功耗和噪声。\n\
    \n#### 用途\n\n- 控制信号切换率：设置 GPIO 引脚在高、低电平之间切换的最大频率。\n- 优化功率与性能：低速度可以节电，而高速度允许高频信号的快速变化。\n\
    \n#### 语法\n\n```\nGPIO_InitStruct.Speed = GPIO_SPEED_xxx;\n```\n\n#### 语法解释\n\n\
    - `GPIO_InitStruct`: 用于 GPIO 设置的配置结构体。\n- `.Speed`: `GPIO_InitStruct` 的一个成员，用于定义\
    \ GPIO 引脚的切换速度。\n- `GPIO_SPEED_xxx`: 选项包括：\n  - `GPIO_SPEED_LOW`: 降低功耗，适用于较慢信号。\n\
    \  - `GPIO_SPEED_MEDIUM`: 平衡功率消耗与性能。\n  - `GPIO_SPEED_HIGH`: 最大化速度，适用于高频信号，但功耗更高。\n\
    \n#### 简单代码示例\n\n```\nGPIO_InitStruct.Speed = GPIO_SPEED_LOW; // 将引脚配置为低速度\n```\n\
    \n#### 代码示例解释\n\n- 设置 GPIO 引脚速度为低：减少功率消耗，理想适用于信号不需要快速变化的应用程序。\n\n#### 注意事项\n\n\
    - 尽可能选择较低的速度以节省电量并减少噪声。\n- 仅在需要高频信号传输时才使用高速度。\n\n#### 警告\n\n- 不必要的使用高速度设置会增加功耗，并可能导致电磁干扰\
    \ (EMI)。\n\n***\n\n### 4. 设置输出高电平\n\n#### 什么是设置输出高电平？\n\n设置 GPIO 输出高电会将引脚驱动至逻辑高电平，为连接的组件提供正电压（通常为\
    \ 3.3V 或 5V）。\n\n#### 用途\n\n- 激活外部设备：提供高逻辑电平为 LED、继电器或其他组件供电。\n- 逻辑高信号：将引脚设置为逻辑“1”或高电压电平，通常用于开启连接的组件。\n\
    \n#### 语法\n\n```\nHAL_GPIO_WritePin(GPIOx, GPIO_PIN_y, GPIO_PIN_SET);\n```\n\n\
    #### 语法解释\n\n- `HAL_GPIO_WritePin`: 向指定的 GPIO 引脚写入逻辑状态（高或电低）的 HAL 函数。\n- `GPIOx`:\
    \ 引脚所在的 GPIO 端口（例如 `GPIOA`）。\n- `GPIO_PIN_y`: 端口上特定的 GPIO 引脚号（例如 `GPIO_PIN_5`）。\n\
    - `GPIO_PIN_SET`: 将输出设置为高逻辑电平（取决于系统配置，为 3.3V 或 5V）。\n\n#### 简单代码示例\n\n```\nHAL_GPIO_WritePin(GPIOA,\
    \ GPIO_PIN_5, GPIO_PIN_SET); // 将 PA5 设置为高\n```\n\n#### 代码示例解释\n\n- 设置 GPIO 引脚\
    \ PA5 为高电：在 `PA5` 上提供逻辑高电压，开启 LED 或向连接的设备发送信号。\n- 配置引脚为输出：为了使此命令生效，必须在 `GPIO_InitStruct`\
    \ 中将引脚设置为输出。\n\n#### 注意事项\n\n- 确保在 `GPIO_InitStruct` 中将引脚设置为输出以便此命令生效。\n- `GPIO_PIN_SET`\
    \ 将输出驱动至高水平。\n\n#### 警告\n\n- 模式选择错误（例如将输入引脚配置为输出）可能会导致硬件冲突或功能异常。\n\n***\n\n###\
    \ 5. 设置输出低电平\n\n#### 什么是设置输出低电平？\n\n设置 GPIO 输出低电会将引脚驱动至逻辑低电平，将其拉至地。\n\n#### 用途\n\
    \n- 禁用外部设备：提供低逻辑电平为 LED、继电器或其他组件供电。\n- 逻辑低信号：将引脚设置为逻辑“0”或低电压电平，通常用于关闭连接的组件。\n\n\
    #### 语法\n\n```\nHAL_GPIO_WritePin(GPIOx, GPIO_PIN_y, GPIO_PIN_SET);\n```\n\n####\
    \ 语法解释\n\n- `HAL_GPIO_WritePin`: 向指定的 GPIO 引脚写入逻辑状态（高或低）的 HAL 函数。\n- `GPIOx`:\
    \ 引脚所在的 GPIO 端口（例如 `GPIOA`）。\n- `GPIO_PIN_y`: 端口上特定的 GPIO 引脚号（例如 `GPIO_PIN_5`）。\n\
    - `GPIO_PIN_SET`: 将输出设置为高逻辑电平。\n\n#### 简单代码示例\n\n```\nHAL_GPIO_WritePin(GPIOA,\
    \ GPIO_PIN_5, GPIO_PIN_SET); // 设置 PA5 为低\n```\n\n#### 代码示例解释\n\n- 设置 GPIO 引脚\
    \ PA5 为低电：在 `PA5` 上提供逻辑低电压，关闭 LED 或向连接的设备发送信号。\n- 配置引脚为输出：为了使此命令生效，必须在 `GPIO_InitStruct`\
    \ 中将引脚设置为输出。\n\n#### 注意事项\n\n- 确保在 `GPIO_InitStruct` 中将引脚设置为输出以便此命令生效。\n- `GPIO_PIN_SET`\
    \ 将输出驱动至高水平。\n\n#### 警告\n\n- 模式选择错误（例如将输入引脚配置为输出）可能会导致硬件冲突或功能异常。\n\n***\n\n###\
    \ 6. 翻转 GPIO 引脚\n\n#### 什么是翻转 GPIO 引脚？\n\n翻转 GPIO 引脚使其在高低状态之间切换。它通常用于 LED 闪烁或产生方波。\n\
    \n#### 用途\n\n- 创建闪烁或脉冲效果：定期翻转常用于指示器。\n- 生成方波：用于产生时钟信号。\n\n#### 语法\n\n```\nHAL_GPIO_TogglePin(GPIOx,\
    \ GPIO_PIN_y);\n```\n\n#### 语法解释\n\n- `HAL_GPIO_TogglePin`: 反转 GPIO 引脚当前状态的 HAL\
    \ 函数。\n- `GPIOx`: 引脚所在的 GPIO 端口（例如 `GPIOA`）。\n- `GPIO_PIN_y`: 端口上要翻转的 GPIO 引脚号。\n\
    \n#### 简单代码示例\n\n```\nHAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5); // 翻转 PA5\n```\n\n\
    #### 代码示例解释\n\n- 翻转 GPIO 引脚 PA5 状态：`PA5` 在高低之间之间切换，重复执行时可产生闪烁效果。\n\n#### 注意事项\n\
    \n- 在定时循环中翻转可以创建闪烁或脉冲效果。\n- 翻转频率影响视觉效果，如 LED 的闪烁频率。\n\n#### 警告\n\n- 频繁翻转会增加功耗并在高频应用中引起噪声。\n\
    \n***\n\n### 7. 读取 GPIO 输入\n\n#### 什么是读取 GPIO 输入？\n\n读取 GPIO 输入允许 STM32 通过检查引脚上的电压水平来检测外部信号，例如按钮按下或传感器输出。\n\
    \n#### 用途\n\n- 监控外部设备：读取开关、按钮的状态。\n- 检测数字信号：检查输入是高（3.3V）还是低（0V）。\n\n#### 语法\n\n\
    ```\nHAL_GPIO_ReadPin(GPIOx, GPIO_PIN_y);\n```\n\n#### 语法解释\n\n- `HAL_GPIO_ReadPin`:\
    \ 读取指定 GPIO 引脚逻辑状态的 HAL 函数。\n- `GPIOx`: 引脚所在的 GPIO 端口（例如 `GPIOA`）。\n- `GPIO_PIN_y`:\
    \ 端口上要读取的特定 GPIO 引脚号。\n\n"
- fmt: "\n● `HAL_GPIO_ReadPin`: HAL function that reads the current digital state\
    \ of a specified GPIO pin.\n\n● `GPIOx`: The GPIO port (e.g., `GPIOA`).\n\n● `GPIO_PIN_y`:\
    \ The specific GPIO pin number on the port.\n\n● Returns: `GPIO_PIN_SET` if the\
    \ pin is high; `GPIO_PIN_RESET` if it is low.\n\n### Simple Code Example\n\n```c\n\
    if (HAL_GPIO_ReadPin(GPIOB, GPIO_PIN_0) == GPIO_PIN_SET) {\n    // Perform an\
    \ action if PB0 is high\n}\n```\n\n### Code Example Explanation\n\n● Reads GPIO\
    \ pin `PB0`: Checks if `PB0` is at a high logic level.\n● Conditional logic: Executes\
    \ an action if `PB0` is high, commonly used for detecting button presses.\n\n\
    ### Notes\n\n● Use internal pull-up or pull-down resistors for stable input states.\n\
    ● `GPIO_PIN_SET` and `GPIO_PIN_RESET` indicate high and low logic levels, respectively.\n\
    \n### Warnings\n\n● Floating input pins (without pull-up or pull-down) may produce\
    \ unreliable readings.\n\n***\n\n# Final Project: LED Toggle with Button Control\n\
    \n### Project Objective\n\nCreate a circuit and code that toggles an LED on or\
    \ off each time a button is pressed. This project demonstrates digital I/O by\
    \ using GPIO pins for both input and output.\n\n### Project Circuit\n\n| Component\
    \ | Pin Description | Connection Details |\n| :--- | :--- | :--- |\n| STM32 Microcontroller\
    \ | GPIO PA5 (LED) | Configured as digital output |\n| LED | Anode to PA5, Cathode\
    \ to GND | Toggles state on button press |\n| Button | GPIO PB0 | Configured as\
    \ digital input |\n| Pull-down Resistor | PB0 to GND | Ensures stable default\
    \ state |\n\n### Circuit Analysis\n\n● `GPIO PA5`: Configured as an output to\
    \ control an LED.\n● `GPIO PB0`: Configured as an input to detect button presses.\n\
    ● Button Press Logic: Each press toggles the LED on or off.\n\n### Project Code\n\
    \n```c\n#include \"stm32f4xx_hal.h\"\n\nvoid GPIO_Config(void) {\n    __HAL_RCC_GPIOA_CLK_ENABLE();\
    \  // Enable GPIOA clock\n    __HAL_RCC_GPIOB_CLK_ENABLE();  // Enable GPIOB clock\n\
    \    GPIO_InitTypeDef GPIO_InitStruct;\n\n    // Configure LED Pin (PA5) as output\n\
    \    GPIO_InitStruct.Pin  = GPIO_PIN_5;\n    GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_PP;\n\
    \    GPIO_InitStruct.Pull  = GPIO_NOPULL;\n    GPIO_InitStruct.Speed  = GPIO_SPEED_LOW;\n\
    \    HAL_GPIO_Init(GPIOA, &GPIO_InitStruct);\n\n    // Configure Button Pin (PB0)\
    \ as input with pull-down\n    GPIO_InitStruct.Pin  = GPIO_PIN_0;\n    GPIO_InitStruct.Mode\
    \  = GPIO_MODE_INPUT;\n    GPIO_InitStruct.Pull  = GPIO_PULLDOWN;\n    HAL_GPIO_Init(GPIOB,\
    \ &GPIO_InitStruct);\n}\n\nint main(void) {\n    HAL_Init();\n    GPIO_Config();\n\
    \    int button_state = 0;\n    while (1) {\n        if (HAL_GPIO_ReadPin(GPIOB,\
    \ GPIO_PIN_0) == GPIO_PIN_SET) {\n            HAL_Delay(100);  // Debounce delay\n\
    \            if (button_state == 0) {\n                HAL_GPIO_TogglePin(GPIOA,\
    \ GPIO_PIN_5);  // Toggle LED\n                button_state = 1;\n           \
    \ }\n        } else {\n            button_state = 0;\n        }\n    }\n}\n```\n\
    \n### Save and Run\n\n1. Save the code as `main.c`.\n2. Compile and upload to\
    \ the STM32 NUCLEO-F446RE using STM32CubeIDE or Keil.\n\n### Check Output\n\n\
    Expected behavior:\n\n● The LED toggles on or off each time the button is pressed.\n\
    \n***\n\n# Analog I/O in STM32\n\n## Chapter Overview\n\nAnalog I/O allows STM32\
    \ microcontrollers to interact with real-world analog signals such as temperature\
    \ or light intensity. The STM32 NUCLEO-F446RE board includes an Analog-to-Digital\
    \ Converter (ADC) for reading analog inputs and a Digital-to-Analog Converter\
    \ (DAC) for outputting analog voltages. This chapter covers the setup and operation\
    \ of both the ADC and DAC and demonstrates a practical application.\n\n## Chapter\
    \ Goal\n\n● Understand how to configure the ADC to read analog signals.\n● Learn\
    \ how to use the DAC to generate adjustable analog output voltages.\n● Complete\
    \ a project to control an LED’s brightness based on a potentiometer reading, demonstrating\
    \ practical ADC and DAC usage.\n\n## Rules\n\n● Enable Clocks for ADC and DAC:\
    \ Ensure clocks are enabled for each peripheral to provide power.\n● Select ADC\
    \ Channel: Choose the correct ADC channel corresponding to the analog input pin.\n\
    ● Set ADC Resolution and Sampling Time: Adjust these settings based on precision\
    \ and speed requirements.\n● Choose DAC Output Channel: Select the DAC output\
    \ channel to control the analog output.\n● Use DMA: Direct Memory Access for data\
    \ transfer.\n\n### 1. Enable ADC Clock\n\n#### What is Enabling ADC Clock?\n\n\
    Enabling the ADC clock provides power to the ADC, making it functional.\n\n####\
    \ Use Purpose\n\n● Power the ADC: Activates the ADC clock, allowing it to operate.\n\
    \n#### Syntax\n\n```c\n__HAL_RCC_GPIOA_CLK_ENABLE();\n```\n\n#### Explanation\n\
    \n● `__HAL_RCC`: Prefix indicating the function is part of Reset and Clock Control.\n\
    ● `GPIOA_CLK_ENABLE()`: Macro to enable the clock for the specific peripheral.\n\
    \n### 2. Configure ADC Channel\n\n#### What is Configuring ADC Channel?\n\nThe\
    \ ADC channel selection determines which input pin the ADC will read from. Each\
    \ ADC channel corresponds to a specific pin.\n\n#### Use Purpose\n\n● Select Analog\
    \ Input: Configures the correct ADC channel based on the input pin.\n\n#### Syntax\n\
    \n```c\nsConfig.Channel = ADC_CHANNEL_0;\n```\n\n#### Explanation\n\n● `sConfig`:\
    \ A structure that holds configuration settings for the ADC, including the channel.\n\
    ● `.Channel`: Member of the `sConfig` structure that specifies the ADC channel\
    \ to sample.\n● `ADC_CHANNEL_0`: Specifies the ADC channel, such as `channel 0`.\n\
    \n### 3. Start ADC Conversion\n\n#### What is Starting ADC Conversion?\n\nStarting\
    \ an ADC conversion initiates the process of reading the voltage on the configured\
    \ pin and converting it into a digital value based on the ADC’s resolution.\n\n\
    #### Use Purpose\n\n● Begin Analog Sampling: Starts converting the analog signal\
    \ to a digital value that can be used in the program.\n\n#### Syntax\n\n```c\n\
    HAL_ADC_Start(&hadc);\n```\n"
  raw: '● HAL_GPIO_ReadPin: HAL function that reads the current digital state of a
    specified GPIO pin.


    ●      GPIOx: The GPIO port (e.g.,  GPIOA).


    ●      GPIO_PIN_y: The specific GPIO pin number on the port.


    ● Returns:  GPIO_PIN_SET if the pin is high;  GPIO_PIN_RESET if it is low.


    #### Simple Code Example


    if  (HAL_GPIO_ReadPin(GPIOB, GPIO_PIN_0)  == GPIO_PIN_SET)  {


    // Perform an action if PB0 is high


    }


    #### Code Example Explanation


    ● Reads GPIO pin PB0: Checks if PB0 is at a high logic level.


    ● Conditional logic: Executes an action if PB0 is high, commonly used for detecting
    button presses.


    #### Notes


    ●      Use internal pull-up or pull-down resistors for stable input states.


    ●      GPIO_PIN_SET and GPIO_PIN_RESET indicate high and low logic levels, respectively.


    #### Warnings


    ●      Floating input pins (without pull-up or pull-down) may produce unreliable
    readings.


    * * *


    ## Final Project: LED Toggle with Button Control


    ### Project Objective


    Create a circuit and code that toggles an LED on or off each time a button is
    pressed. This project demonstrates digital I/O by using GPIO pins for both input
    and output.


    ### Project Circuit


    | Component | Pin Description | Connection Details |


    | STM32 Microcontroller | GPIO PA5 (LED) | Configured as digital output |


    | LED | Anode to PA5, Cathode to GND | Toggles state on button press |


    | Button | GPIO PB0 | Configured as digital input |


    | Pull-down Resistor | PB0 to GND | Ensures stable default state |


    ### Circuit Analysis


    ●      GPIO PA5: Configured as an output to control an LED.


    ●      GPIO PB0: Configured as an input to detect button presses.


    ●      Button Press Logic: Each press toggles the LED on or off.


    ### Project Code


    #include  "stm32f4xx_hal.h"


    void GPIO_Config(void)  {


    __HAL_RCC_GPIOA_CLK_ENABLE();  // Enable GPIOA clock


    __HAL_RCC_GPIOB_CLK_ENABLE();  // Enable GPIOB clock


    GPIO_InitTypeDef GPIO_InitStruct;


    // Configure LED Pin (PA5) as output


    GPIO_InitStruct.Pin  = GPIO_PIN_5;


    GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_PP;


    GPIO_InitStruct.Pull  = GPIO_NOPULL;


    GPIO_InitStruct.Speed  = GPIO_SPEED_LOW;


    HAL_GPIO_Init(GPIOA,  &GPIO_InitStruct);


    // Configure Button Pin (PB0) as input with pull-down


    GPIO_InitStruct.Pin  = GPIO_PIN_0;


    GPIO_InitStruct.Mode  = GPIO_MODE_INPUT;


    GPIO_InitStruct.Pull  = GPIO_PULLDOWN;


    HAL_GPIO_Init(GPIOB,  &GPIO_InitStruct);


    }


    int main(void)  {


    HAL_Init();


    GPIO_Config();


    int button_state =  0;


    while  (1)  {


    if  (HAL_GPIO_ReadPin(GPIOB, GPIO_PIN_0)  == GPIO_PIN_SET)  {


    HAL_Delay(100);  // Debounce delay


    if  (button_state ==  0)  {


    HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5);  // Toggle LED


    button_state =  1;


    }


    }  else  {


    button_state =  0;


    }


    }


    }


    ### Save and Run


    1.  Save the code as  main.c.


    2.  Compile and upload to the STM32 NUCLEO-F446RE using STM32CubeIDE or Keil.


    ### Check Output


    Expected behavior:


    ● The LED toggles on or off each time the button is pressed.


    * * *


    # Analog I/O in STM32


    ## Chapter Overview


    Analog I/O allows STM32 microcontrollers to interact with real-world analog signals
    such as temperature or light intensity. The STM32 NUCLEO-F446RE board includes
    an Analog-to-Digital Converter (ADC) for reading analog inputs and a Digital-to-Analog
    Converter (DAC) for outputting analog voltages. This chapter covers the setup
    and operation of both the ADC and DAC and demonstrates a practical application.


    ## Chapter Goal


    ●      Understand how to configure the ADC to read analog signals.


    ● Learn how to use the DAC to generate adjustable analog output voltages.


    ● Complete a project to control an LED’s brightness based on a potentiometer reading,
    demonstrating practical ADC and DAC usage.


    ## Rules


    ● Enable Clocks for ADC and DAC: Ensure clocks are enabled for each peripheral
    to provide power.


    ● Select ADC Channel: Choose the correct ADC channel corresponding to the analog
    input pin.


    ● Set ADC Resolution and Sampling Time: Adjust these settings based on precision
    and speed requirements.


    ● Choose DAC Output Channel: Select the DAC output channel to control the analog
    output.


    ● Use DMA for Continuous Sampling: Consider using DMA (Direct Memory Access) for
    efficient, continuous ADC sampling if needed.


    ## Syntax Table


    | Serial No | Topic | Code Snippet | Simple Example |


    | 1 | Enable ADC Clock | __HAL_RCC_ADCx_CLK_ENABLE() | __HAL_RCC_ADC1_CLK_ENABLE()
    |


    | 2 | Configure ADC Channel | sConfig.Channel = ADC_CHANNEL_xx | sConfig.Channel
    = ADC_CHANNEL_0 |


    | 3 | Start ADC Conversion | HAL_ADC_Start(&hadc) | HAL_ADC_Start(&hadc1) |


    | 4 | Read ADC Value | HAL_ADC_GetValue(&hadc) | adcValue = HAL_ADC_GetValue(&hadc1)
    |


    | 5 | Enable DAC Clock | __HAL_RCC_DAC_CLK_ENABLE() | __HAL_RCC_DAC_CLK_ENABLE()
    |


    | 6 | Start DAC Output | HAL_DAC_Start(&hdac, DAC_CHANNEL_x) | HAL_DAC_Start(&hdac,
    DAC_CHANNEL_1) |


    | 7 | Set DAC Output Value | HAL_DAC_SetValue(&hdac, DAC_CHANNEL_x, DAC_ALIGN_12B_R,
    value) | HAL_DAC_SetValue(&hdac, DAC_CHANNEL_1, DAC_ALIGN_12B_R, 2048) |


    * * *


    ## Topic Explanations


    ### 1\. Enable ADC Clock


    #### What is Enabling the ADC Clock?


    Enabling the ADC clock provides power to the ADC peripheral, allowing it to be
    configured and used for analog-to-digital conversion.


    #### Use Purpose


    ● Power the ADC Peripheral: Activates the ADC clock, making it functional for
    reading analog signals.


    ● Essential for ADC Configuration: Without the clock, ADC configurations and operations
    will not work.


    #### Syntax


    __HAL_RCC_ADCx_CLK_ENABLE();


    #### Syntax Explanation


    ● __HAL_RCC: Prefix indicating the function is part of Reset and Clock Control
    (RCC) in STM32’s HAL library.


    ●      ADCx: Specifies which ADC peripheral to enable, such as  ADC1.


    ● CLK_ENABLE(): Macro to enable the clock, allowing the ADC peripheral to operate.


    #### Simple Code Example


    __HAL_RCC_ADC1_CLK_ENABLE(); // Enables clock for ADC1


    #### Code Example Explanation


    ● Enables ADC1 clock: Provides power to ADC1, allowing it to be configured and
    used for analog-to-digital conversions.


    #### Notes


    ●      Each ADC peripheral requires its clock to be enabled individually.


    ● Without enabling the clock, any attempts to use ADC functions will fail.


    #### Warnings


    ●      Ensure only necessary ADC clocks are enabled to save power.


    * * *


    ### 2\. Configure ADC Channel


    #### What is Configuring the ADC Channel?


    The ADC channel selection determines which input pin the ADC will read from. Each
    ADC channel corresponds to a specific analog-capable pin.


    #### Use Purpose


    ● Select Analog Input: Configures the correct ADC channel based on the input pin
    connected to the analog signal.


    #### Syntax


    sConfig.Channel  = ADC_CHANNEL_xx;


    #### Syntax Explanation


    ● sConfig: A structure that holds configuration settings for the ADC, including
    the channel and sampling time.


    ● .Channel: Member of the  sConfig structure that specifies the ADC channel to
    sample.


    ● ADC_CHANNEL_xx: Specifies the ADC channel, such as  ADC_CHANNEL_0, which corresponds
    to a specific pin.


    #### Simple Code Example


    ADC_ChannelConfTypeDef sConfig;


    sConfig.Channel  = ADC_CHANNEL_0; // Configures the ADC to read from channel 0


    #### Code Example Explanation


    ● Configures ADC to sample from channel 0: Tells the ADC which pin to read from,
    with each channel mapped to a specific pin.


    #### Notes


    ● Refer to the STM32 pinout for available ADC channels and their corresponding
    pins.


    ●      Only analog-capable pins can be used as ADC channels.


    #### Warnings


    ● Using a non-analog-capable pin as an ADC channel may cause errors or unexpected
    behavior.


    * * *


    ### 3\. Start ADC Conversion


    #### What is Starting ADC Conversion?


    Starting an ADC conversion initiates the process of reading the voltage on the
    configured pin and converting it into a digital value based on the ADC’s resolution.


    #### Use Purpose


    ● Begin Analog Sampling: Starts converting the analog signal to a digital value
    that can be used in the program.


    #### Syntax


    HAL_ADC_Start(&hadc);


    #### Syntax Explanation'
