    #### Notes


    ●      Always initialize variables before using them in calculations or logic.


    ●      For larger arrays, consider initializing values in loops.


    #### Warnings


    ●      Using uninitialized variables may produce unpredictable results.


    * * *


    ### 5\. Declare Static Variable


    #### What is Declaring a Static Variable?


    A static variable retains its value between function calls, even if it is declared
    locally within a function. Static variables are useful for maintaining state across
    multiple function executions.


    #### Use Purpose


    ● Maintain State: Stores values that need to persist across function calls, like
    counters or configuration flags.


    ● Limit Scope but Retain Value: Static variables are local to the function but
    keep their value between calls.


    #### Syntax


    static data_type variable_name =  value;


    #### Syntax Explanation


    ● static: The keyword that makes the variable retain its value across function
    calls.


    ●      data_type: Specifies the type of the variable.


    ●      variable_name: The name of the variable.


    ●      value: Initial value assigned to the variable.


    #### Simple Code Example


    void countCalls()  {


    static  int callCount =  0; // Static variable to count function calls


    callCount++;


    }


    #### Code Example Explanation


    ● Increments  callCount each time  countCalls is called: Since  callCount is static,
    it retains its value between calls, making it useful for tracking the number of
    times the function runs.


    #### Notes


    ● Static variables are initialized only once and retain their value throughout
    program execution.


    ●      Useful for counters or flags within functions.


    #### Warnings


    ●      Overuse of static variables can increase memory usage.


    * * *


    ### 6\. Declare Constant with  const


    #### What is Declaring a Constant with  const?


    The  const keyword is another way to define constants, making a variable’s value
    unchangeable after it is initialized. Unlike  #define,  const constants have a
    type and are stored in memory.


    #### Use Purpose


    ● Store Unmodifiable Values: Holds values that should remain constant throughout
    the program.


    ● Increase Code Readability: Using  const gives the compiler additional information
    about the variable’s intent.


    #### Syntax


    const data_type variable_name =  value;


    #### Syntax Explanation


    ●      const: Keyword indicating that the variable’s value cannot be modified.


    ●      data_type: Specifies the type of the variable.


    ●      variable_name: The name of the constant.


    ●      value: The constant’s initial value.


    #### Simple Code Example


    const  float GRAVITY =  9.81; // Declares a constant for gravity


    #### Code Example Explanation


    ● Defines  GRAVITY as a constant float with a value of 9.81: This value cannot
    be modified, ensuring  GRAVITY remains consistent.


    #### Notes


    ● Use  const for fixed values with a defined type, unlike  #define which is a
    preprocessor directive.


    ●      Constants declared with  const are stored in memory.


    #### Warnings


    ● Attempting to change a  const variable will result in a compilation error.


    * * *


    ### 7\. Scope of Variables


    #### What is Variable Scope?


    Variable scope determines where a variable can be accessed in the program. Variables
    can be local (only within a function) or global (accessible throughout the program).


    #### Use Purpose


    ● Manage Data Accessibility: Control where variables can be accessed and modified
    to avoid conflicts and errors.


    ● Organize Program Structure: Use local variables for temporary data and global
    variables for shared data.


    #### Syntax


    // Local variable


    void func()  {


    int x =  5;  // Local to func


    }


    // Global variable


    int y =  10; // Accessible from any function


    #### Syntax Explanation


    ● Local variables: Declared within functions and are only accessible in that function.


    ● Global variables: Declared outside of functions and accessible from any part
    of the program.


    #### Simple Code Example


    void increment()  {


    int count =  0;  // Local variable


    count++;


    }


    int total =  0; // Global variable


    #### Code Example Explanation


    ●      count is a local variable: Exists only within  increment.


    ● total is a global variable: Accessible from any function in the program.


    #### Notes


    ●      Limit global variables to prevent unexpected data changes.


    ● Local variables are ideal for temporary data that doesn’t need to persist.


    #### Warnings


    ●      Overuse of global variables can lead to data conflicts.


    * * *


    ## Final Project: Using Constants and Variables to Control an LED


    ### Project Objective


    Create a program to blink an LED at a specific interval using constants and variables.


    ### Project Circuit (In Table)


    | Component | Pin Description | Connection Details |


    | STM32 Microcontroller | GPIO Output (PA5) | Controls LED blinking |


    | LED | Anode to PA5, Cathode to GND | LED toggles based on interval |


    ### Circuit Analysis


    ●      GPIO PA5: Configured to control LED blinking.


    ●      Interval Control: The interval for blinking is defined by a constant.


    ### Project Code


    #include  "stm32f4xx_hal.h"


    #define LED_PIN GPIO_PIN_5 // Constant for LED pin


    #define BLINK_DELAY 1000 // Constant for delay interval in milliseconds


    void LED_Init(void)  {


    __HAL_RCC_GPIOA_CLK_ENABLE();


    GPIO_InitTypeDef GPIO_InitStruct =  {0};


    GPIO_InitStruct.Pin  = LED_PIN;


    GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_PP;


    GPIO_InitStruct.Pull  = GPIO_NOPULL;


    GPIO_InitStruct.Speed  = GPIO_SPEED_LOW;


    HAL_GPIO_Init(GPIOA,  &GPIO_InitStruct);


    }


    int main(void)  {


    HAL_Init();


    LED_Init();


    while  (1)  {


    HAL_GPIO_TogglePin(GPIOA, LED_PIN);  // Toggle LED state


    HAL_Delay(BLINK_DELAY);               // Delay using constant interval


    }


    }


    ### Save and Run


    1.  Save the code as  main.c.


    2.  Compile and upload to the STM32 NUCLEO-F446RE using STM32CubeIDE or Keil.


    ### Check Output


    Expected behavior:


    ● The LED connected to PA5 blinks at a 1-second interval based on the  BLINK_DELAY
    constant.


    * * *


    ## Summary


    This chapter covered the use of constants and variables, including types, scope,
    and initialization. The final project demonstrated how to control LED blinking
    using constants for configuration and variables for data storage, providing a
    practical foundation in STM32 programming.


    # Data Types in STM32


    ## Chapter Overview


    Data types are fundamental in C programming, especially in embedded systems, where
    efficient memory usage and precise data representation are crucial. The STM32
    NUCLEO-F446RE uses C data types to represent various forms of data, such as integers,
    floating-point numbers, characters, and pointers. Understanding and choosing the
    appropriate data type helps optimize memory usage and processing efficiency, which
    is essential in embedded systems programming.


    ## Chapter Goal


    ● Understand the basic data types available in C, such as integers, floating-point
    numbers, characters, and pointers.


    ● Learn how to choose the correct data type based on memory, precision, and range
    requirements.


    ● Explore typedefs and custom data types for improved code readability and modularity.


    ## Rules


    ● Use Integer Types for Whole Numbers: Choose signed or unsigned integer types
    based on the application requirements.


    ● Choose Floating-Point Types for Precise Calculations: Use floating-point types
    for calculations that require decimal precision.


    ● Use Characters for ASCII Text: Use the  char type to represent single ASCII
    characters.


    ● Apply Typedefs for Custom Types: Use  typedef to create custom names for data
    types, improving code readability.


    ● Optimize Data Type Size: Select the smallest data type necessary to minimize
    memory usage and processing load.


    ## Syntax Table


