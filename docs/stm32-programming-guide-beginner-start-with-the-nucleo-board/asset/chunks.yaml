    | :--- | :--- | :--- | :--- |

    | 1 | 平方根 | `sqrt(x);` | `result = sqrt(16.0);` |

    | 2 | 次方 | `pow(base, exponent);` | `result = pow(2, 3);` |

    | 3 | 正弦 | `sin(angle);` | `result = sin(3.14159 / 2);` |

    | 4 | 余弦 | `cos(angle);` | `result = cos(0);` |

    | 5 | 正切 | `tan(angle);` | `result = tan(3.14159 / 4);` |

    | 6 | 对数（以 e 为底） | `log(x);` | `result = log(2.71828);` |

    | 7 | 对数（以 10 为底） | `log10(x);` | `result = log10(100);` |

    | 8 | 绝对值 | `fabs(x);` | `result = fabs(-5.3);` |

    | 9 | 四舍五入 | `round(x);` | `result = round(3.6);` |

    | 10 | 向上 | `ceil(x);` | `result = ceil(2.3);` |

    | 11 | 取下 | `floor(x);` | `result = floor(4.9);` |


    ## 题解释


    ### 1. 平方根 (sqrt)


    #### 什么是平方根函数？

    `sqrt` 函数计算非负数的平方根。它常用于嵌入式系统中的距离和信号处理计算。


    #### 用途

    - 距离计算：计算点之间的欧几得距离。

    - 信号处理：在信号分析中计算均方根 (RMS) 值至关重要。


    #### 语法

    ```

    result = sqrt(x);

    ```


    #### 语法解释

    - `result`：存储 `x` 的平方根。

    - `sqrt`：平方根函数。

    - `x`：需要开根的非负数。


    #### 简单代码示例

    ```c

    float value = 16.0;

    float result = sqrt(value); // result 是 4.

    ```


    #### 注意事项

    - `x` 必须是非负的；负值会导致域错误。

    - `sqrt` 返回 `double` 类型。


    ### 2. 次方 (pow)


    #### 什么是次方函数？

    `pow` 函数将底数提升到指定的指数，使其对于涉及指数增长、缩放或多项式方程的计算有用。


    #### 用途

    - 指数增长：模拟具有指数特征的数据。

    - 多项式方程：评估带有变量幂的表达式。


    #### 语法

    ```

    result = pow(base, exponent);

    ```


    #### 语法解释

    - `result`：存储 `base` 的 `exponent` 次幂的值。

    - `pow`：次方函数。

    - `base`：要提升的数。

    - `exponent`：`base` 的幂。


    #### 简单代码示例

    ```c

    float result = pow(2.0, 3.0); // result 是 8.0

    ```


    #### 注意事项

    - `pow` 适用于正指数和负指数。

    - 结果是一个 `double`。


    ### 3. 正弦 (sin)


    #### 什么是正弦函数？

    `sin` 函数计算角度（弧度）的正弦，通常用于嵌入式系统中的波形生成和角度计算。


    #### 用途

    - 波形生成：生成正弦波。

    - 角度计算：为三角应用计算角度的正弦值。


    #### 语法

    ```

    result = sin(angle);

    ```


    #### 语法解释

    - `result`：存储 `angle` 的正弦。

    - `sin`：正弦函数。

    - `angle`：弧度为单位的角度。


    #### 简单代码示例

    ```c

    float result = sin(3.14159 / 2); // result 大约为 1.0

    ```


    #### 注意事项

    - 角度必须是弧度。

    - 返回一个 `double`。


    ### 4. 余弦 (cos)


    #### 什么是余弦函数？

    `cos` 函数计算弧度角度的余弦。它在波形生成、旋转和角度投影中有用。


    #### 用途

    - 角度投影：使用角度的余弦计算投影。

    - 波形：为信号生成波形。


    #### 语法

    ```

    result = cos(angle);

    ```


    #### 语法解释

    - `result`：存储 `angle` 的余弦。

    - `cos`：余弦函数。

    - `angle`：弧度为单位的角度。


    #### 简单代码示例

    ```c

    float result = cos(0); // result 是 1.0

    ```


    #### 注意事项

    - 角度必须是弧度。

    - 返回一个 `double`。


    ### 5. 正切 (tan)


    #### 什么是正切函数？

    `tan` 函数计算角度（弧度）的正切。它常用于斜率、角度和波形计算。


    #### 用途

    - 三角函数计算：用于斜率和与角度相关的计算。

    - 波形：有助于生成基于正切的波形。


    #### 语法

    ```

    result = tan(angle);

    ```


    #### 语法解释

    - `result`：存储 `angle` 的正切。

    - `tan`：正切函数。

    - `angle`：弧度为单位的角度。


    #### 简单代码示例

    ```c

    float result = tan(3.14159 / 4); // result 大约为 1.0

    ```


    ### 6. 对数（以 e 为底） (log)


    #### 什么是对数函数？

    `log` 函数计算数字的自然对数（以 e 为底）。它在缩放、增长和衰减计算有用。


    #### 用途

    - 数据缩放：将数据转换为对数尺度。

    - 指数衰减：模拟衰减率。


    #### 语法

    ```

    result = log(x);

    ```


    #### 语法解释

    - `result`：存储 `x` 的自然对数。

    - `log`：自然对数函数。

    - `x`：需要计算对数的正数。


    #### 简单代码示例

    ```c

    float result = log(2.71828); // result 大约为 1.0

    ```


    ### 7. 对数（以 10 为底） (log10)


    #### 什么是对数（以 10 为底）函数？

    `log10` 函数计算以 10 为底的对数，常用于信号处理中的分贝计算。


    #### 用途

    - 分贝计算：在信号处理中计算分贝。

    - 数据缩放：用于对数尺度。


    #### 语法

    ```

    result = log10(x);

    ```


    #### 语法解释

    - `result`：存储 `x` 的对数。

    - `log10`：对数函数。

    - `x`：一个正数。


    #### 简单代码示例

    ```c

    float result = log10(100); // result 是 2.0

    ```


    ### 8. 绝对值 (fabs)


    #### 什么是绝对值函数？

    `fabs` 函数返回浮点数的绝对值，消除了负号。


    #### 用途

    - 幅度计算：无论正负计算幅度。

    - 误差测量：计算误差值。


    #### 语法

    ```

    result = fabs(x);

    ```


    #### 语法解释

    - `result`：存储 `x` 的绝对值。

    - `fabs`：浮点数绝对值函数。

    - `x`：可以是正也可以是负。


    #### 简单代码示例

    ```c

    float result = fabs(-5.3); // result 是 5.3

    ```


    ### 9. 四舍五入 (round)


    #### 什么是四舍五入函数？

    `round` 将浮点数四舍五入到最接近的整数，适用于准备数值。


    #### 用途

    - 近似计算：用于近似计算的浮点数。

    - 整数转换：在转换为整数之前四舍五入。


    #### 语法

    ```

    result = round(x);

    ```


    #### 语法解释

    - `result`：存储 `x` 的舍值。

    - `round`：四舍五入函数。

    - `x`：可能带有小数的数值。


    #### 简单代码示例

    ```c

    float result = round(3.6); // result 是 4.0

    ```


    ### 10. 向上 (ceil)


    #### 什么是向上函数？

    `ceil` 函数返回大于或等于给定数字的最小整数，向上取整数值。


    #### 用途

    - 资源计算：向上取整以确保资源充足。

    - 步数计算：向上取整以确保完整的步数。


    #### 语法

    ```

    result = ceil(x);

    ```


    #### 语法解释

    - `result`：存储 `x` 的向上值。

    - `ceil`：向上函数。

    - `x`：输入值。


    #### 简单代码示例

    ```c

    float result = ceil(2.3); // result 是 3.0

    ```


