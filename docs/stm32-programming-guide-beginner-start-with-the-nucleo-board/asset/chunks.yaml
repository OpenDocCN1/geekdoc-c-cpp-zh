    choose the location, and finish setup.


    2.  Editing Code:


    ○ STM32CubeIDE provides syntax highlighting, code suggestions, and error checking,
    making it easier to code efficiently.


    ○ Write custom functions and application logic in the  main.c file, under the
    main loop or as separate functions.


    3.  Building the Project:


    ○ Build the project by clicking Project > Build All or using the Build icon.


    ○ Compilation messages will appear in the Console and Problems tabs, highlighting
    any errors or warnings.


    4.  Setting Up Build and Debug Configurations:


    ○ Open Project Properties to configure compiler settings, including optimization
    levels and linker settings.


    ○ In Debug Configurations, confirm that the debug probe is set to ST-LINK and
    the correct microcontroller is selected.


    ### Understanding Key Project Files


    ● main.c: The core file containing the main loop where most application code is
    written.


    ●      stm32xxxx_hal_conf.h: Configuration file that controls which HAL modules
    are enabled.


    ●      system_stm32xxxx.c: Configures system initialization, including setting
    up clocks and interrupts.


    ● Drivers folder: Contains the HAL libraries for each peripheral and the CMSIS
    (Cortex Microcontroller Software Interface Standard) files.


    * * *


    ## 5\. Debugging Basics


    Debugging is an essential skill in embedded programming, allowing you to locate
    and fix issues in your code. STM32CubeIDE provides powerful debugging tools, including
    breakpoints, variable inspection, and step-through execution.


    ### Setting Up Debugging


    1.  Connect the ST-LINK Debugger:


    ○ Make sure the ST-LINK debugger is connected to both the computer and the STM32
    development board.


    ○ In STM32CubeIDE, open Debug Configurations and confirm that the ST-LINK debugger
    is selected.


    2.  Starting a Debugging Session:


    ○      Click Debug to start a debugging session.


    ○ STM32CubeIDE will build the project, flash the code to the board, and halt execution
    at the beginning of  main().


    3.  Using Breakpoints:


    ○ Set breakpoints by clicking on the left margin next to the line number in  main.c.


    ○ Breakpoints stop the code execution at specified points, allowing you to inspect
    program variables and states.


    4.  Step-Through Execution:


    ○      Step Into: Steps into the function call to debug line-by-line.


    ○ Step Over: Executes the current line and moves to the next without entering
    functions.


    ○      Step Out: Completes the current function and returns to the caller.


    5.  Inspecting Variables and Expressions:


    ○ Use the Variables tab to monitor and modify variable values at runtime.


    ○ Add specific expressions in the Expressions tab to track variable changes or
    expressions during program execution.


    6.  Debug Console:


    ○ The console provides real-time information on program execution, error messages,
    and debugging insights.


    ○ Using Watches: Add watches for key variables to track their values in real time.


    # Introduction to GPIO


    ## Chapter Overview


    GPIO (General-Purpose Input/Output) is a fundamental feature of microcontrollers,
    enabling interaction with external components like LEDs, buttons, sensors, and
    relays. STM32 microcontrollers offer flexible GPIO configurations, allowing each
    pin to be set as input, output, analog, or an alternate function. This chapter
    will cover the basics of GPIO, how to configure GPIO pins in STM32CubeMX, different
    GPIO modes, and practical examples for input and output.


    ## Chapter Goal


    ●      Understand the GPIO architecture and functions in STM32 microcontrollers.


    ●      Learn to configure GPIO pins as input and output.


    ●      Explore different GPIO modes and their applications.


    ● Implement basic input and output examples, such as controlling an LED and reading
    a button state.


    * * *


    ## 1\. GPIO Overview in STM32


    GPIO (General-Purpose Input/Output) pins provide digital input and output capabilities,
    allowing microcontrollers to interface with other digital components. Each GPIO
    pin can be configured to perform different roles such as input, output, or to
    act as an alternate function (e.g., UART, SPI, I2C).


    ### GPIO Port and Pin Structure


    ● Ports: STM32 microcontrollers organize GPIO pins into ports, typically labeled
    as GPIOA, GPIOB, GPIOC, etc. Each port can have up to 16 pins.


    ● Pins: Each port pin is numbered from 0 to 15 (e.g., PA0, PB5, PC13).


    ● Multipurpose Functionality: Each pin can be set to a different mode, such as
    digital input, digital output, analog, or alternate function for peripherals.


    ### GPIO Pin Modes in STM32


    1.  Input Mode:


    ○ Used to read a digital state (high or low) from an external source, like a button.


    2.  Output Mode:


    ○ Used to send digital signals to external devices, like turning an LED on or
    off.


    3.  Alternate Function Mode:


    ○ Enables the pin to serve as an input/output for internal peripherals, such as
    UART, SPI, I2C.


    4.  Analog Mode:


    ○ Configures the pin for analog input/output, typically for ADC (Analog-to-Digital
    Converter) or DAC (Digital-to-Analog Converter).


    ### GPIO Speed, Pull-Up, and Pull-Down


    ● Speed: Controls the speed at which a pin can toggle between high and low (Low,
    Medium, High, or Very High speed). Faster speeds consume more power but are essential
    for high-frequency signals.


    ● Pull-Up/Pull-Down Resistors: Internal resistors can be configured as pull-up,
    pull-down, or none. Pull-up resistors set the default state to high when no external
    signal is connected, while pull-down resistors set it to low.


    * * *


    ## 2\. Configuring GPIO with STM32CubeMX


    STM32CubeMX is used to configure GPIO pins in a graphical interface, simplifying
    the setup process. You can assign each pin’s function, mode, pull-up/pull-down
    state, and speed.


    ### Steps to Configure GPIO Pins


    1.  Open STM32CubeMX and Create a New Project:


    ○      Start STM32CubeIDE or the standalone STM32CubeMX tool.


    ○ Select your microcontroller model or board (e.g., STM32F103C8T6 or Nucleo-F446RE)
    to create a new project.


    2.  Assign Pin Functions:


    ○      Click on each pin in the graphical interface to configure it.


    ○ Choose GPIO_Output for output pins (e.g., controlling an LED) or GPIO_Input
    for input pins (e.g., reading a button).


    3.  Configure GPIO Parameters:


    ○      Mode: Select  Input,  Output,  Analog, or  Alternate Function.


    ○      Pull-Up/Pull-Down: Choose between No Pull, Pull-Up, or Pull-Down resistor
    options.


    ○ Speed: Set Low, Medium, High, or Very High speed depending on the application.


    4.  Generate Code:


    ○ Click Project > Generate Code to create initialization code for the configured
    GPIO pins.


    ○ STM32CubeMX will generate code files that include initialization functions for
    each GPIO pin.


    ### Understanding GPIO Initialization Code in main.c


    The generated code in  main.c contains functions and macros to initialize and
    control GPIO pins. Here’s an example of typical GPIO initialization code:


    void MX_GPIO_Init(void)  {


    GPIO_InitTypeDef GPIO_InitStruct =  {0};


    /* Enable GPIO Clock */


    __HAL_RCC_GPIOA_CLK_ENABLE();


    __HAL_RCC_GPIOB_CLK_ENABLE();


    /* Configure GPIO pin as output */


    GPIO_InitStruct.Pin  = GPIO_PIN_5;


    GPIO_InitStruct.Mode  = GPIO_MODE_OUTPUT_PP;


    GPIO_InitStruct.Pull  = GPIO_NOPULL;


    GPIO_InitStruct.Speed  = GPIO_SPEED_FREQ_LOW;


    HAL_GPIO_Init(GPIOA,  &GPIO_InitStruct);


    /* Configure GPIO pin as input */


    GPIO_InitStruct.Pin  = GPIO_PIN_13;


    GPIO_InitStruct.Mode  = GPIO_MODE_INPUT;


    GPIO_InitStruct.Pull  = GPIO_PULLUP;


    HAL_GPIO_Init(GPIOC,  &GPIO_InitStruct);


    }


    ● Clock Enable: Enables the clock for GPIOA and GPIOC, allowing those ports to
    be used.


    ● GPIO Initialization: Configures the pins with specified modes, pull-up/pull-down
    resistors, and speed.


    * * *


    ## 3\. Using GPIO for Output


    GPIO output mode allows the STM32 microcontroller to control external devices
    by setting a pin to a high or low state. For example, controlling an LED involves
    setting a GPIO pin high to turn it on and low to turn it off.'
