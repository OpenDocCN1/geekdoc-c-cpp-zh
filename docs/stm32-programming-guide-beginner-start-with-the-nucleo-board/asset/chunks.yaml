    - **Manage Temporary Data**: Useful for storing data needed only within a specific\
    \ function.\n\n#### Syntax\n`data_type variable_name;`\n\n#### Syntax Explanation\n\
    - `data_type`: Defines the type of the variable.\n- `variable_name`: The name\
    \ of the variable.\n\n#### Simple Code Example\n```c\nvoid exampleFunction() {\n\
    \  int temperature = 25; // Declares a local variable 'temperature'\n}\n```\n\n\
    #### Code Example Explanation\n- Defines `temperature` as a local integer: `temperature`\
    \ is confined to `exampleFunction` and cannot be accessed outside it.\n\n####\
    \ Notes\n- Local variables are initialized each time the function is called.\n\
    - Use meaningful names to represent the data stored in local variables.\n\n####\
