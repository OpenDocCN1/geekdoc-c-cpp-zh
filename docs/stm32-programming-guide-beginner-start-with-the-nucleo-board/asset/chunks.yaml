    \ values that should not change during program execution, such as `PI`, speed\
    \ limits, or sensor thresholds.\n- **Improve Code Readability**: Named constants\
    \ provide a clear description of their purpose, improving code readability.\n\n\
    #### Syntax\n`#define CONSTANT_NAME value`\n\n#### Syntax Explanation\n- `#define`:\
    \ Preprocessor directive used to create constants.\n- `CONSTANT_NAME`: The name\
    \ of the constant, typically written in uppercase to distinguish it from variables.\n\
    - `value`: The fixed value assigned to the constant.\n\n#### Simple Code Example\n\
    ```c\n#define PI 3.14159 // Declares a constant for the value of PI\n```\n\n####\
    \ Code Example Explanation\n- Defines `PI` as `3.14159`: `PI` is a constant and\
    \ cannot be modified, representing the mathematical constant π.\n\n#### Notes\n\
    - Constants declared with `#define` do not take up memory space.\n- Use uppercase\
    \ names for constants to distinguish them from variables.\n\n#### Warnings\n-\
    \ Do not attempt to change a constant’s value.\n\n### 2. Declare Global Variable\n\
    \n#### What is Declaring a Global Variable?\nA global variable is accessible from\
    \ any part of the program.\n\n#### Purpose\n- **Share Data Across Functions**:\
    \ Useful for counters, flags, and configuration values.\n- **Retain Value**: Persists\
    \ throughout the execution.\n\n#### Syntax\n`data_type variable_name;`\n\n####\
    \ Syntax Explanation\n- `data_type`: Specifies the type of the variable, such\
    \ as `int`, `float`, or `char`.\n- `variable_name`: The name of the variable.\n\
    \n#### Simple Code Example\n```c\nint counter; // Declares a global variable\n\
