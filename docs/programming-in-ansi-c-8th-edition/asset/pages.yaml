  md: "# Problem – Develop an algorithm to find the sum of the first N natural numbers\
    \ where N would be input by the user.\n\n```\nAlgorithm SUM-N\nStep 0 START\n\
    Step 1 INPUT N\nStep 2 I = 1\nStep 3 SUM = 0\nStep 4 REPEAT Steps (a) - (b) WHILE\
    \ I <=N\n  (a) SUM = SUM + I\n  (b) I = I + 1\n  END WHILE\nStep 5 DISPLAY SUM\n\
    Step 6 END\n```\n\nThe objective of this algorithm is to calculate 1 + 2 + ...\
    \ + N. We use the variable SUM to store the result. The variable I is initialized\
    \ to 1 and the variable SUM to 0. The algorithm works by first adding 1 into SUM,\
    \ followed by 2, and then by 3 and so on. The process continues till N is added\
    \ into SUM. The values 1, 2, 3, ..., N are generated by the variable I. If I is\
    \ initially 1, it then incremented to become 2, followed by 3, ..., finally N.\
    \ The following are the sequence of steps that would be executed one after another:\n\
    \n```\nSUM = SUM + 1\nSUM = SUM + 2\nSUM = SUM + 3\n....\nSUM = SUM + N\n```\n\
    \nInstead of writing N addition statements (note that the value of N is not known\
    \ at development time) one after another, we use the following form:\n\n```\n\
    SUM = SUM + I, for all I = 1 to N\n```\n\nWe monotonically increment the value\
    \ of I and repeat the execution of the statement SUM = SUM + I until the last\
    \ value of I, viz. N, has been added into SUM. Incrementing I next value would\
    \ cause it to hold N + 1. This is when the condition at Step 4 'I<= N' fails and\
    \ the control of the algorithm moves to step 5. The execution of the statements\
    \ ‘SUM = SUM + I’ and ‘I = I + I’ would be repeated while ‘I<=N’. The control\
    \ of the algorithm remains within the loop (iteration) till the condition ‘I <=\
    \ N’ evaluates to true."
