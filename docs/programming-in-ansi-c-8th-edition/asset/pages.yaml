    point number. Declaration statements must appear at the beginning of the functions
    as shown in Fig. 2.4. All declaration statements end with a semicolon; C supports
    many other types and they are discussed in detail in Chapter 3.


    The words such as int and float are called the keywords and cannot be used as
    variable names. A list of keywords is given in Chapter 3.


    Data is stored in a variable by assigning a data value to it. This is done in
    lines 8 and 10. In line-8, an integer 100 is assigned to the variable number and
    in line-10, the result of addition of two real numbers 30.75 and 75.35 is assigned
    to the floating point variable amount. The statements


    ```

    number = 100;

    amount = 30.75 + 75.35;

    ```


    are called the assignment statements. Every assignment statement must have a semicolon
    at the end.


    The next statement is an output statement that prints the value of number. The
    print statement


    ```

    printf("%d%d\n", number);

    ```


    contains two arguments. The first argument "%d" tells the compiler that the value
    of the second argument number should be printed as a decimal integer. Note that
