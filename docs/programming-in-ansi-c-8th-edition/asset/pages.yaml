    Floating point (or real) numbers are stored in 32 bits (on all 16 bit and 32 bit
    machines), with 6 digits of precision. Floating point numbers are defined in C
    by the keyword **float**. When the accuracy provided by a **float** number is
    not sufficient, the **double** can be used to define the number. A **double**
    data type number uses 64 bits giving a precision of 14 digits. These are known
    as *double precision*. Remember that double type represents the same data type
    that **float** represents, but with a greater precision. To extend the precision
    further, we may use **long double** which uses 80 bits. Floating point numbers
    are represented within the computer''s memory using the IEEE standard. The relationship
    among floating types is illustrated **Fig. 3.6.**


    # Void Types


    The **void** type has no values. This is usually used to specify the type of functions.
    The type of a function is said to be **void** when it does not return any value
    to the calling function. It can also play the role of a generic type, meaning
    that it can represent any of the other standard types.


    # Character Types


    A single character can be defined as a **character(char)** type data. Characters
    are usually stored in 8 bits (one byte) of internal storage. The qualifier **signed**
    or **unsigned** may be explicitly applied to char. While **unsigned chars** have
    values between 0 and 255, **signed chars** have values from -128 to 127.'
