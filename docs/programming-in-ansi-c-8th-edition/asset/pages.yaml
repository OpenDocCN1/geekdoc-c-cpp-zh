  md: 'Every word is classified as either a keyword or an identifier. All keywords
    have fixed meanings and these meanings cannot be changed. Keywords serve as basic
    building blocks for program statements. The list of all keywords of ANSI C are
    listed in Table 3.3. All keywords must be written in lowercase. Some compilers
    may use additional keywords that must be identified from the C manual.


    > C99 adds some keywords. See the Appendix "C99 Features".


    Identifiers refer to the names of variables, functions and arrays. These are user-defined
    names and consist of a sequence of letters and digits, with a letter as a first
    character. Both uppercase and lowercase letters are permitted, although lowercase
    letters are commonly used. The underscore is also permitted in identifiers. It
    is usually used as a link between two words in long identifiers.


    Table 3.3 ANSI C Keyword


    | auto | double | int | struct |

    |---|---|---||}{

    | break | else | long | switch |

    | case | enum | register | typedef |

    | char | extern | return | union |

    | const | float | short | unsigned |

    | continue | for | signed | void |

    | default | goto | sizeof | volatile |

    | do | if | static | while |


    Rules for Identifiers


    +   1. First character must be an alphabet (or underscore).

    2. Must consist of only letters, digits or underscore.

    3. Only first 31 characters are significant.

    4. Cannot use a keyword.

    5. Must not contain white space


