    Iterative constructs are thus used to simulate repetition. They are used when
    one or more statements need to be executed repeatedly. Consider the situation
    where we want to display the word ‘HELLO’ 100 times. We can write DISPLAY ‘HELLO’
    100 times as follows:


    ```

    DISPLAY ''HELLO'' (1st, time)

    DISPLAY ''HELLO'' (2nd, time)

    DISPLAY ''HELLO'' (3rd, time)..

    DISPLAY ''HELLO'' (100th, time)

    ```


    We need to repeat just one statement 100 times. Similarly, if we want to repeat
    the execution of an entire statement block 10000 times or even more, imagine the
    length of such an algorithm. Writing codes in such a manner may become a bit cumbersome.
    Instead we can put the statement in an iterative construct and iterate (repeat)
    it 100 times. A variable such as I would be used to keep track of the number of
    times the iteration has taken place. The modified construct would be as follows:


    ```

    REPEAT steps (a)-(b) while I << 100

    (a) DISPLAY ''HELLO''

    (b) I = I + 1

    END WHILE

    ```


    Like before, I would have to be initialized to 1.


