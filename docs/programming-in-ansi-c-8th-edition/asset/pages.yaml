  md: 'We have seen in the previous section how the software is invisible but indispensable
    part of a computer that enables the users to interact with the computer and makes
    it work as per one’s specification and requirements to achieve a computation objective.
    A software can be considered as a set of programs which work in a cohesive manner
    to perform a task. A program is a set of instructions which when executed in sequence
    performs a task.


    ![](img/0696179f80a06738f7af12d3a451f26d_30_0.png)


    Let us consider the example of a program which when executed would enable the
    user to enter two numbers, add them and display the result. It is clear that this
    program would contain three sets of instructions; the first set would enable users
    to input the data, the second set to add the numbers and the third set to display
    the result. When writing the program, the programmer would have planned these
    three sets and used statements within it to implement each of them. The example
    considered here is an extremely simple one.


    However, more often than not, the problems which a computer is supposed to solve
    be more complex than this. Such complex problems would invariably require complex
    solutions. These solutions involve a lot of complex arithmetic operations and
    logical decision making. The need of the hour is a tool which would enable us
    to represent the logic required in the program and make it possible to transform
    the logic to an equivalent set of instructions which when executed by the computer
    would solve the problem. Algorithms and flowcharts are two tools. These tools
    are independent of the programming language as well as the target machine. Thus,
    the logic represented using one of these tools may be used to write programs in
    any language of the programmer’s choice. In fact, logic should always be independent
    of programming languages. Irrespective of the tool and language chosen to write
    a program, programming logic constructs are of three important types (apart from
    input/output and sub-routine call constructs):


    +   - Imperative statements (action)


    +   - Conditional statements (decision making)'
