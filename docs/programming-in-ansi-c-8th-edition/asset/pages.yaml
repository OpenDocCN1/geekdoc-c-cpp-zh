  md: 'the same period, Sun Microsystems of USA created a new language Java modelled
    on C and C++.


    | | | |

    | 1960 | ALGOL | International Group |

    | 1967 | BCPL | Martin Richards |

    | 1970 | B | Ken Thompson |

    | 1972 | Traditional C | Dennis Ritchie |

    | 1978 | K&R C | Kernighan and Ritchie |

    | 1989 | ANSI C | ANSI Committee |

    | 1990 | ANSI/ISO C | ISO Committee |

    | 1999 | C99 | Standardization Committee |


    Fig. 2.1 History of ANSI C


    All popular computer languages are dynamic in nature. They continue to improve
    their power and scope by incorporating new features and C is no exception. Although
    C++ and Java were evolved out of C, the standardization committee of C felt that
    a few features of C++/Java, if added to C, would enhance the usefulness of the
    language. The result was the 1999 standard for C. This version is usually referred
    to as C99. The history and development of C is illustrated in Fig. 2.1.


    Although C99 is an improved version, still many commonly available compilers do
    not support all of the new features incorporated in C99. We, therefore, discuss
    all the new features added by C99 in an appendix separately so that the readers
    who are interested can quickly refer to the new material and use them wherever
    possible.'
