  md: 'statements and therefore anything between /* and */ is ignored by the compiler.
    In general, a comment can be inserted wherever blank spaces can occur—at the beginning,
    middle or end of a line—“but never in the middle of a word”.


    Although comments can appear anywhere, they cannot be nested in C. That means,
    we cannot have comments inside comments. Once the compiler finds an opening token,
    it ignores everything until it finds a closing token. The comment line


    ```

    /* === === === === ===== */

    ```


    is not valid and therefore results in an error.


    Since comments do not affect the execution speed and the size of a compiled program,
    we should use them liberally in our programs. They help the programmers and other
    users in understanding the various functions and operations of a program and serve
    as an aid to debugging and testing. We shall see the use of comment lines more
    in the examples that follow.


    Let us now look at the printf(), the only executable statement of the program.


    ```

    printf("I see, I remember");

    ```


    printf is a predefined standard C function for printing output. Predefined means
    that it is a function that has already been written and compiled, and linked together
    with our program at the time of linking. The concepts of compilation and linking
    are explained later in this chapter. The printf function causes everything between
    the starting and the ending quotation marks to be printed out. In this case, the
    output will be:


    I see, I remember


    Note that the print line ends with a semicolon. Every statement in C should end
    with a semicolon (;) mark.


    Suppose we want to print the above quotation in two lines as


    I see,


    I remember!


    This can be achieved by adding another printf function as shown below:


    ```

    printf("I see, \n");

    ```


    ```

    printf("I remember !\");"

    ```'
