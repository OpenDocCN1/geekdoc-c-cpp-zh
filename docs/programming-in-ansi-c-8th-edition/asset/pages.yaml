  md: '# Fig. 3.5 Integer types


    In order to provide some control over the range of numbers and storage space,
    C has three classes of integer storage, namely short int, int, and long int, both
    signed and unsigned forms. ANSI C defines these types so that they can be organized
    from the smallest to the largest, as shown in Fig. 3.5. For example, short int
    represents fairly small integer values and requires half the amount of storage
    as a regular int number. Unlike integers, unsigned int uses all the bits for the
    magnitude of the number and are always positive. Therefore, for a 16 bit machine,
    the range of unsigned integer numbers will be from 0 to 65,535.


    We declare long and unsigned integers to increase the range of values. The use
    of qualifier signed on integers is optional because the default declaration assumes
    a signed number. Table 3.8 shows all the allowed combinations of basic types and
    qualifiers and their size and range on a 16-bit machine.


    > Note C99 allows long long integer types. See the Appendix "C99 Features".


    Table 3.8 Size and Range of Data Types on a 16-bit Machine


    | Type | Size (bits) | Range |

    |---|---|--|

    | char or signed char | 8 | -128 to 127 |

    | unsigned char | 8 | 0 to 255 |

    | int or signed int | 16 | -32,768 to 32,767 |

    | unsigned int | 16 | 0 to 65535 |

    | short int or | | |

    | signed short int | 8 | -128 to 127 |

    | unsigned short int | 8 | 0 to 255 |

