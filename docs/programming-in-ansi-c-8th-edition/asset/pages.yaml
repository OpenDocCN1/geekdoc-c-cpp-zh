  md: '# Overview of C


    Upon completing this chapter, you will be able to:


    +   - L0 2.1 Produce an overview of C programming language

    - L0 2.2 Exemplify the elementary C concepts through sample programs

    - L0 2.3 Illustrate the use of user-defined functions and math functions through
    sample programs

    - L0 2.4 Describe the basic structure of C program

    - L0 2.5 Recognize the programming style of C language

    - L0 2.6 Describe how a C program is compiled and executed


    # HISTORY OF C


    ‘C’ seems a strange name for a programming language. But this strange sounding
    language is one of the most popular computer languages today because it is a structured,
    high-level, machine independent language. It allows software developers to develop
    programs without worrying about the hardware platforms where they were implemented.


    The root of all modern languages is ALGOL, introduced in the early 1960s. ALGOL
    was the first computer language to use a block structure. Although it never became
    popular in USA, it was widely used in Europe. ALGOL gave the concept of structured
    programming to the computer science community. Computer scientists like Corrado
    Bohm, Guiseppe Jacopini and Edsger Dijkstra popularized this concept during 1960s.
    Subsequently, several languages were announced.


    In 1967, Martin Richards developed a language called BCPL (Basic Combined Programming
    Language) primarily for writing system software. In 1970, Ken Thompson created
    a language using many features of BCPL and called it simply B. B was used to create
    early versions of UNIX'
  merge: -1
  pgno: 48
- img_proc: true
  md: 'operating system at Bell Laboratories. Both BCPL and B were “typeless” system
    programming languages.


    C was evolved from ALGOL, BCPL and B by Dennis Ritchie at the Bell Laboratories
    in 1972. C uses many concepts from these languages and added the concept of data
    types and other powerful features. Since it was developed along with the UNIX
    operating system, it is strongly associated with UNIX. This operating system,
    which was also developed at Bell Laboratories, was coded almost entirely in C.
    UNIX is one of the most popular network operating systems in use today and the
    heart of the Internet superhighway.


    For many years, C was used mainly in academic environments, but eventually with
    the release of C compilers for commercial use and the increasing popularity of
    UNIX, it began to gain widespread support among computer professionals. Today,
    C is running under a variety of operating system and hardware platforms.


    During 1970s, C evolved into what is now known as “traditional C”. The language
    became more popular after publication of the book ‘The C Programming Language’
    by Brian Kernighham and Dennis Ritchie in 1978. The book was so popular that the
    language came to be known as “K&R” among the programming community. The rapid
    growth of C led to the development of different versions of the language that
    were similar but often incompatible. This posed a serious problem for system developers.


    To assure that the C language remains standard, in 1983, American National Standards
    Institute (ANSI) appointed a technical committee to define a standard for C. The
    committee approved a version of C in December 1989 which is now known as ANSI
    C. It was then approved by the International Standards Organization (ISO) in 1990.
    This version of C is also referred to as C89.


    During 1990''s, C++, a language entirely based on C, underwent a number of improvements
    and changes and became an ANSI/ISO approved language in November 1977. C++ added
    several new features to C to make it not only a true object-oriented language
    but also a more versatile language. During'
