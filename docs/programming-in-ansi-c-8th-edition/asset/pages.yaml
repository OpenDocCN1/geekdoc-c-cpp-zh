  md: '# Integer Constants


    An integer constant refers to a sequence of digits. There are three types of integers,
    namely, decimal integer, octal integer and hexadecimal integer.


    Decimal integers consist of a set of digits, 0 through 9, preceded by an optional
    – or + sign. Valid examples of decimal integer constants are:


    ```

    123 - 321 0 654321 +76

    ```


    ![](img/0696179f80a06738f7af12d3a451f26d_87_0.png)


    Fig. 3.2 Basic types of C constants


    Embedded spaces, commas, and non-digit characters are not permitted between digits.
    For example,


    ```

    15 750 20,000 $1000

    ```


    are illegal numbers.


    > Note ANSI C supports unary plus which was not defined earlier.


    An octal constant consists of any combination of digits from the set 0 through
    7, with a leading 0. Some examples of octal integer are:


    ```

    037 0 0435 0551

    ```


    A sequence of digits preceded by 0x or 0X is considered as hexadecimal integer.
    They may also include alphabets A through F or through a f. The letter A through
    F represent the numbers 10 through 15. Following are the examples of valid hex
    integers:


    ```

    0X2 0x9F 0Bbcd 0x

    ```


    We rarely use octal and hexadecimal numbers in programming.'
