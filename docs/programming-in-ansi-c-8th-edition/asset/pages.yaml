  md: '+   • Iterative statements (repetition/Loops)


    The tools which we are talking about should be capable of representing each of
    these three kinds of constructs because a program comprises statements which fall
    into one of these three categories.


    It is advisable to always use tools such as algorithms and flowcharts first plan
    and then write a program. After all it has been rightly said that well planned
    is half done.


    # Algorithm


    An algorithm is a finite set of unambiguous instructions which, when executed,
    performs a task correctly. There are three characteristic features in this description
    of an algorithm. They are:


    +   • The number of steps required to perform the task should be finite.


    +   • Each of the instruction in the algorithm should be unambiguous in nature;
    meaning on the execution of each such instruction, the outcome should be definite
    and predictable.


    +   • Finally, the algorithm should solve the problem correctly. In other words,
    on the execution of the algorithm, the objective should be fulfilled.


    There are no defined rules to write an algorithm. However, most authors prefer
    to use English-like statements to represent the action that needs to be performed
    at each step. We will consider different examples to demonstrate each of the three
    logic constructs.


    EXAMPLE 1 (Use of imperative constructs)


    Problem – Develop an algorithm to find the average of three numbers taken as input
    from the user.


