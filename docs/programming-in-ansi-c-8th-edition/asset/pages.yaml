  md: 'Integer numbers are inadequate to represent quantities that vary continuously,
    such as distances, heights, temperatures, prices, and so on. These quantities
    are represented by numbers containing fractional parts like 17.548. Such numbers
    are called *real* (or floating point) constants. Further examples of real numbers
    are:


    ```

    0.0083 -0.75 435.36 +247.0

    ```


    These numbers are shown in *decimal notation*, having a whole number followed
    by a decimal point and the fractional part. It is possible to omit digits after
    the decimal point, or digits after the decimal point. That is,


    ```

    21.95 -71 +5

    ```


    are all valid numbers.


    A real number may also be expressed in *exponential* (or scientific **notation**).
    For example, the value 21.65 may be written as 2.1565e2 in exponential notation.
    e2 means multiply by 10². The general for is:


    ![](img/0696179f80a06738f7af12d3a451f26d_89_0.png)


    The mantissa is either a real number expressed in *decimal notation* or an integer.
    The *exponent* is an integer number with an optional *plus* or *minus sign*. The
    letter e e separating the mantissa and the exponent can be written in either lowercase
    or uppercase. Since the exponent causes the decimal point to “float”, this notation
    is said to represent a real number in *floating-point form*. Examples of legal
    floating-point constants are:


    ```

    0.65e4 12e-2 1.5e+5 3.18E3-1.2E-1

    ```


    Embedded white space is not allowed.


    Exponential notation is useful for representing numbers that are either very large
    or very small in magnitude. For example, 7500000000 may be written as 7.5E9 or
    75E8. Similarly, -0.00000368 is equivalent to -3.68E-7.


    Floating-point constants are normally represented as double-precision quantities.
    However, the suffixes f or F may be used to force single-precision and 1 or L
    to extend double precision further.


    Some examples of valid and invalid numeric constants are given in Table 3.4.'
