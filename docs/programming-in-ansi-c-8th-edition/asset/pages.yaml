  md: 'The information contained between the parentheses is called the argument of
    the function. This argument of the first printf function is “I see, \n” and the
    second is “I remember!”. These arguments are simply strings of characters to be
    printed out.


    Notice that the argument of the first printf contains a combination of two characters
    \ and n at the end of the string. This combination is collectively called the
    newline character. A newline character instructs the computer to go to the next
    (new) line. It is similar in concept to the carriage return key on a typewriter.
    After printing the string comma (,) the presence of the newline character \n causes
    the string “I remember !” to be printed on the next line. No space is allowed
    between \ and n.


    If we omit the newline character from the first printf statement, then the output
    will be again a single line as shown below.


    I see, I remember !


    This is similar to the output of the program in Fig. 2.2. However, note that there
    is no space between, and I.


    It is also possible to produce two or more lines of output by one printf statement
    with the use of newline character at appropriate places. For example, the statement


    ```

    printf("I see,\n I remember !\");"

    ```


    will output


    I see,

    remember !


    while the statement


    ```

    printf("I\n., see,\n... ... I\n... ... remember !\");"

    ```


    will print out


    ```

    I

    .. see,

    ... ... I

    ... ... remember !

    ```


    > Note Some authors recommend the inclusion of the statement.


    ```

    #include <stdio.h>

    ```'
