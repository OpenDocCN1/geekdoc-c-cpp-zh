  md: '| Documentation Section |

    | Link Section (Include section) |

    | Definition Section |

    | Global Declaration Section |

    | main ( ) Function Section |

    | { |

    | Declaration part |

    | Executable part |

    | } |


    | Declaration part Executable part |

    | Subprogram section |

    | Function 1 |

