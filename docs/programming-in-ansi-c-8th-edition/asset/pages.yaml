    # Creating Your Own Executable File


    Note that the linker always assigns the same name a.out. When we compile another
    program, this file will be overwritten by the executable object code of the new
    program. If we want to prevent from happening, we should rename the file immediately
    by using the command.


    ```

    mv a.out name

    ```


    We may also achieve this by specifying an option in the cc command as follows:


    ```

    cc -o name source-file

    ```


    This will store the executable object code in the file name and prevent the old
    file a.out from being destroyed.


    # Multiple Source Files


    To compile and link multiple source program files, we must append all the file
    names to the cc command.


    ```

    cc filename-1.c ....filename-n.c

    ```


    These files will be separately compiled into object files called


    ```

    filename-i.o

    ```


    and then linked to produce an executable program file a.out as shown in Fig. 2.12.'
