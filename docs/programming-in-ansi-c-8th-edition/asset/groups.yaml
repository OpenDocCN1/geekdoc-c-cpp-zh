  mdcn: "\n\n# C 语言概述\n\n完成本章后，你将能够：\n\n- L0 2.1 生成 C 编程语言的概述\n- L0 2.2 通过示例程序阐述 C\
    \ 的基本概念\n- L0 2.3 通过示例程序说明自定义函数和数学函数的使用\n- L0 2.4 描述 C 程序的基本结构\n- L0 2.5 识别 C\
    \ 语言的编程风格\n- L0 2.6 描述 C 程序的编译和执行过程\n\n# C 语言的历史\n\n“C”对于编程语言来说似乎是一个很奇怪的名字。但这种听起来很奇怪的语言是今天最流行的计算机语言之一，因为它是一种结构化的、高级的与硬件无关的语言。它允许软件开发者开发程序，而无需担心实现它们的硬件平台。\n\
    \n所有现代语言的根源是 ALGOL，它于 20 世纪 60 年代初引入。ALGOL 是第一个使用块结构的计算机语言。尽管它在美国并没有流行，但在欧洲被广泛使用。ALGOL\
    \ 为计算机科学界引入了结构化编程的概念。Corrado Bohm、Guiseppe Jacopini 和 Edsger Dijkstra 等计算机科学家在\
    \ 20 世纪 60 年代普及了这一概念。随后，几种语言相继诞生。\n\n1967 年，Martin Richards 开发了一种名为 BCPL（基础组合编程语言）的语言，主要用于编写系统软件。1970\
    \ 年，Ken Thompson 创建了一种使用 BCPL 许多特性的语言，并简单地将其称为 B。B 用于在贝尔实验室创建早期版本的 UNIX 操作系统。BCPL\
    \ 和 B 都是“无类型”的系统编程语言。\n\nC 语言是 Dennis Ritchie 于 1972 年在贝尔实验室由 ALGOL、BCPL 和 B 演变而来的。C\
    \ 使用了这些语言中的许多概念，并添加了数据类型概念和其他强大的功能。由于它是与 UNIX 操作系统一起开发的，因此它与 UNIX 有着紧密的联系。这个同样在贝尔实验室开发的操作系统几乎完全是用\
    \ C 语言编写的。UNIX 是当今正在使用的最流行的网络操作系统之一，也是互联网超级高速公路的核心。\n\n多年来，C 主要用于学术环境，但随着用于商用的\
    \ C 编译器的发布以及 UNIX 普及度的提高，它开始在计算机专业人士中获得广泛支持。今天，C 运行在各种操作系统和硬件平台上。\n\n在 20 世纪 70\
    \ 年代，C 演变成了现在所谓的“传统 C”。在 Brian Kernighham 和 Dennis Ritchie 于 1978 年出版《C 编程语言》一后，这种语言变得更加流行。这本书非常受欢迎，以至于这种语言在编程社区中被称为“K&R”。C\
    \ 的快速增长导致了不同版本的语言的发展，这些版本相似但往往互不兼容。这为系统开发人员带来了严重的问题。\n\n为了确保 C 语言保持标准，1983 年，美国国家标准协会（ANSI）任命了一个技术委员会来定义\
    \ C 的标准。该委员会在 1989 年 12 月批准了一个 C 语言，现在被称为 ANSI C。它随后在 1990 年被国际标准组织（ISO）批准。这一版本的\
    \ C 语言也被称为 C89。\n\n在 20 世纪 90 年代，完全基于 C 语言的 C++ 经过了多次改进和变化，并于 1977 年 11 月成为 ANSI/ISO\
    \ 批准的语言。C++ 为 C 添加了几个新功能，使其不仅是一种真正的面向对象的语言，还是一种更多功能的语言。在同一时期，美国的太阳微系统创建了一种以 C\
    \ 和 C++ 为模型的新语言 Java。\n\n| 年份 | 语言 | 开发者 |\n| :--- | :--- | :--- |\n| 1960 | ALGOL\
    \ | 国际小组 |\n| 1967 | BCPL | Martin Richards |\n| 1970 | B | Ken Thompson |\n|\
    \ 1972 | 传统型 C | Dennis Ritchie |\n| 1978 | K&R C | Kernighan and Ritchie |\n\
    | 1989 | ANSI C | ANSI 委员会 |\n| 1990 | ANSI/ISO C | ISO 委员会 |\n| 1999 | C99 |\
    \ 标准化委员会 |\n\n图 2.1 ANSI C 的历史\n\n所有流行的计算机语言在本质上都是动态的。它们通过引入新功能不断提高自己的能力和范围，C\
    \ 也不例外。尽管 C++ 和 Java 是从 C 演变出来的，但 C 的标准化委员会认为，如果将 C++/Java 的某些功能加入 C 中，将增强该语言的实用性。结果就是\
    \ 1999 年的 C 标准。这个版本通常被称为 C99。C 的历史和发展如图 2.1 所示。\n\n尽管 C99 是一个改进版本，但许多常用的编译器仍然不支持支持\
    \ C99 中包含的所有新功能。因此，我们在附录中单独讨论了 C99 添加的所有新功能，以便感兴趣的读者快速查阅新材料并尽可能使用它们。\n\n# C 语言的重要性\n\
