    **Fig. 2.9** An overview of a C program


    The documentation section consists of a set of comment lines giving the name of
    the program, the author and other details, which the programmer would like to
    use later. The link section provides instructions to the compiler to link functions
    from the system library. The definition section defines all symbolic constants.


    There are some variables that are used in more than one function. Such variables
    are called **global** variables and are declared in the **global** declaration
    section that is outside of all the functions. This section also declares all the
    user-defined functions.


    Every C program must have one **main()** function section. This section contains
    two parts, declaration part and executable part. The declaration part declares
    all the variables used in the executable part. There is at least one statement
    in the executable part. These two parts must appear between the opening and the
    closing braces. The program execution begins at the opening brace and ends at
    the closing brace. The closing brace of the main function section is the logical
    end of the program. All statements in the declaration and executable parts end
    with a semicolon(;)


    The subprogram section contains all the user-defined functions that are called
    in the **main** function. User-defined functions are generally placed immediately
    after the **main** function, although they may appear in any order.'
- md: "\nAll sections, except the main function section may be absent when they are\
    \ not required.\n\n## PROGRAMMING STYLE\n\nUnlike some other programming languages\
    \ (COBOL, FORTRAN, etc.) C is a free-form language. That is, the C compiler does\
    \ not care, where on the line we begin typing. While this may be a licence for\
    \ bad programming, we should try to use this fact to our advantage in developing\
    \ readable programs. Although several alternative styles are possible, we should\
    \ select one style and use it with total consistency.\n\nFirst of all, we must\
    \ develop the habit of writing programs in lowercase letters. C program statements\
    \ are written in lowercase letters. Uppercase letters are used only for symbolic\
    \ constants.\n\nBraces, group statements together and mark the beginning and the\
    \ end of functions. A proper indentation of braces and statements would make a\
    \ program easier to read and debug. Note how the braces are aligned and the statements\
    \ are indented in the program of Fig. 2.5.\n\nSince C is a free-form language,\
    \ we can group statements together on one line. The statements\n\n```\na = b;\n\
    x = y + 1;\nz = a + x;\n```\n\ncan be written on one line as\n\n```\na = b; x\
    \ = y+1; z = a+x;\n```\n\nThe program\n\n```\nmain() \n{\n    printf(\"Hello C\"\
    );\n}\n```\n\nmay be written on one line like\n\n```\nmain() (printf(\"Hello C\"\
    ));\n```\n\nHowever, this style make the program more difficult to understand\
    \ and should not be used. In this book, each statement is written on a separate\
    \ line.\n\nThe generous use of comments inside a program cannot be overemphasized.\
    \ Judiciously inserted comments not only increase the readability but also help\
    \ to understand the program logic. This is very important for debugging and testing\
    \ the program.\n\n## EXECUTING A ‘C’ PROGRAM\n\nExecuting a program written in\
    \ C involves a series of steps. These are:\n\n- 1. Creating the program;\n- 2.\
    \ Compiling the program;\n- 3. Linking the program with functions that are needed\
    \ from the C library; and\n- 4. Executing the program.\n\nFigure 2.10 illustrates\
    \ the process of creating, compiling and executing a C program. Although these\
    \ steps remain the same irrespective of the *operating system*, system commands\
    \ for implementing the steps and conventions for naming *files* may differ on\
    \ different systems.\n\nAn operating system is a program that controls the entire\
    \ operation of a computer system. All input/output operations are channeled through\
    \ the operating system. The operating system, which is an interface between the\
    \ hardware and the user, handles the execution of user programs.\n\n![](img/0696179f80a06738f7af12d3a451f26d_68_0.png)\n\
    \nFig. 2.10 Process of compiling and running a C program\n\nSource code is the\
    \ file containing the C source program. This program is input to a compiler. The\
    \ compiler is a system software that translates the source program to object code.\
    \ The object code contains an equivalent set of machine instructions corresponding\
    \ to the source program which is understood by the computer. A given C program\
    \ may make use of several library functions. Thus, the object code of the program\
    \ would have to be linked to the object codes of the library functions. The linker\
    \ is a system software that links together all the object codes to generate the\
    \ final executable code. This executable code is submitted to the operating system\
    \ for execution whenever required. The generation of the executable code is shown\
    \ in Fig. 2.11.\n\n![](img/0696179f80a06738f7af12d3a451f26d_69_0.png)\n\n**Fig.\
    \ 2.11 Generation of executable code from source code**\n\nIn this respect, it\
    \ is worth noting that the compiler is specific to a programming language, and\
    \ the object code is dependent upon the platform on which it is meant to run.\n\
    \n## UNIX SYSTEM\n\n### Creating the Program\n\nOnce we load the UNIX operating\
    \ system into the memory, the computer is ready to receive program. The program\
    \ must be entered into a file. The file name can consist of letters, digits and\
    \ special characters, followed by a dot and a letter c. Examples of valid file\
    \ names are:\n\n```\nhello.c\nprogram.c\nebgl.c\n```\n\nThe file is created with\
    \ the help of a text editor, either ed or vi. The command for calling the editor\
    \ and creating the file is\n\n```\ned filename\n```\n\nIf the file existed before,\
    \ it is loaded. If it does not yet exist, the file has to be created so that it\
    \ is ready to receive the new program. Any corrections in the program are done\
    \ under the editor. (The name of your system's editor may be different. Check\
    \ your system manual.)\n\nWhen editing is over, the file is saved on disk. It\
    \ can then be referenced any time later by its file name. The program that is\
    \ entered into the file is known as the source program, since it represents the\
    \ original form of the program.\n\n### Compiling and Linking\n\nLet us assume\
    \ that the source program has been created in a file named ebg1.c. Now the program\
    \ is ready for compilation. The compilation command to achieve this task under\
    \ UNIX is\n\n```\ncc ebg1.c\n```\n\nThe source program instructions are now translated\
    \ into a form that is suitable for execution by the computer. The translation\
    \ is done after examining each instruction for its correctness. If everything\
    \ is alright, the compilation proceeds silently and the translated program is\
    \ stored on another file with the name ebg1.o. This program is known as object\
    \ code.\n\nLinking is the process of putting together other program files and\
    \ functions that are required by the program. For example, if the program is using\
    \ exp() function, the object code of this function should be brought from the\
    \ math library of the system and linked to the main program. Under UNIX, the linking\
    \ is automatically done (if no errors are detected) when the cc command is used.\n\
    \nIf any mistakes in the syntax and semantics of the language are discovered,\
    \ they are listed out and the compilation process ends right there. The errors\
    \ should be corrected in the source program with the help of the editor and the\
    \ compilation is done again.\n\nThe compiled and linked program is called the\
    \ executable object code and is stored automatically in another file named a.out.\n\
    \nNote that some systems use different commands for linking. The compiled and\
    \ linked program is:\n\n```\ncc -lm\n```\nis the command under UNIX V operating\
    \ system.\n\n### Executing the Program\n\nExecution is a simple task. The command\n\
    \n```\n/a.out\n```\n\nwould load the executable code into the computer memory\
    \ and execute the instructions. During execution, the program may request some\
    \ data. Perhaps, something is wrong with the program logic. In case the source\
    \ program is modified, the entire process of compiling, linking and executing\
    \ should be repeated.\n\n### Creating Your Executable File\n\nNote that the linker\
    \ always assigns the same name a.out. If we want to prevent this from happening,\
    \ we should rename the file immediately by using the command\n\n```\nmv a.out\
    \ name\n```\n\nThis will store the executable code in the name. We may also achieve\
    \ this by specifying an option in the cc command as:\n\n```\ncc -o name source-file\n\
    ```\n\nto prevent the old file from being destroyed.\n\n### Multiple Source Files\n\
    \nTo compile and link multiple source files, we must append all the file names\
    \ to the cc command.\n\n```\ncc filename-1.c ....filename-n.c\n```\n\nThese files\
    \ will be separately compiled into objects called\n\n```\nfilename-i.o\n```\n\n\
    and then linked to produce an executable program as shown in Fig. 2.12.\n\n![](img/0696179f80a06738f7af12d3a451f26d_72_0.png)\n\
    \nFig. 2.12 Compilation of multiple files\n\nIt is also possible to compile each\
    \ file separately and link them later. For example, the commands\n\n```\ncc -c\
    \ mod1.c\ncc -c mod2.c\n```\n\nwill compile the source files mod1.c and mod2.c\
    \ into objects mod1.o and mod2.o. They can be linked by the command\n\n```\ncc\
    \ mod1.o mod2.o\n```\n\nWe may also combine the source files and object files\
    \ as follows:\n\n```\ncc mod1.c mod2.o\n```\n\nThis approach is useful when one\
    \ of the multiple source files need to be changed and recompiled or an already\
    \ existing object file is to be used with the program to be compiled.\n\n## MS-DOS\
    \ SYSTEM\n\nThe program can be created using any word processing software in non-document\
    \ mode. The file name should end with the characters “.c” like program.c, pay.c,\
    \ etc. Then the command\n\n```\nMSC pay.c\n```\n\nunder MS-DOS operating system\
    \ would load the program stored in the file pay.c and generate the object code.\
    \ This code is stored in another file name pay.obj. In any language errors are\
    \ found, the compilation is not completed. The program should then be corrected\
    \ and compiled again.\n\nThe linking is done by the command\n\n```\nLINK pay.obj\n\
    ```\n"
  mdcn: "\n\n除主函数部分外，所有章节在不需要时都可以缺失。\n\n## 编程风格\n\n与某些其他编程语言（如 COBOL、FORTRAN 等）不同，C\
    \ 语言是一种自由格式的语言。这意味着，C 编译器并不关心我们在行的行的何种位置开始打字。虽然这可能成为编写糟糕代码的借口，但我们应该尝试利用这一特点来开发出具有可读性的程序。尽管有多种可选的风格，但我们应该选择一种风格，并保持完全一致性地使用它。\n\
    \n首先，我们必须养成使用小写字母编写程序的习惯。C 程序语句是用小写字母写的。大写字母仅用于符号常量。\n\n大括号将语句分组在一起，并标记函数的开始和结束。对大括号和语句进行适当的缩进会让程序更易于阅读和调试。注意图\
    \ 2.5 程序中大括号是如何对齐的，语句是如何缩进的。\n\n由于 C 是一种自由格式语言，我们可以将多个语句分在同一行。这些语句\n\n```\na =\
    \ b;\nx = y + 1;\nz = a + x;\n```\n\n可以写在同一行：\n\n```\na = b; x = y+1; z = a+x;\n\
    ```\n\n程序\n\n```\nmain() \n{\n    printf(\"Hello C\");\n}\n```\n\n可以写成一行，如：\n\n\
    ```\nmain() (printf(\"Hello C\"));\n```\n\n然而，这种风格会让程序更难以理解，不应被使用。在书中，每个语句都单独写在一行。\n\
    \n在程序内部大量使用注释这一点再怎么强调也不过。审慎地插入注释不仅可以增加可读性，还有助于理解程序逻辑。这对于调试和测试程序非常重要。\n\n## 执行“C”程序\n\
    \n执行用 C 编写的程序涉及一系列步骤。这些步骤是：\n\n- 1. 创建程序；\n- 2. 编译程序；\n- 3. 将程序与 C 库所需的函数链接；以及\n\
    - 4. 执行程序。\n\n图 2.10 展示了创建、编译和执行 C 程序的流程。尽管这些步骤无论*操作系统*如何相同，但实现这些步骤的系统命令和*文件*命名约定在不同系统上可能不同。\n\
    \n操作系统是一个控制计算机系统整个运行的程序。所有的输入/输出操作都通过操作系统进行。作为硬件和用户之间接口的操作系统处理用户程序的执行。\n\n![](img/0696179f80a06738f7af12d3a451f26d_68_0.png)\n\
    \n图 2.10 编译和运行 C 程序的过程\n\n源代码是包含 C 源程序的文件。该程序被输入到编译器。编译器是一个将源程序翻译为目标代码的系统软件。目标代码包含一组与源程序等效的机器指令，这些指令是计算机理解的。给定的\
    \ C 程序可以使用几个库函数。因此，程序的目标代码必须与库函数的目标代码链接。链接器是一个将所有目标代码链接在一起以生成最终可执行代码的系统软件。每当需要，该可执行代码就会提交给操作系统执行。可执行代码的生成见图\
    \ 2.11。\n\n![](img/0696179f80a06738f7af12d3a451f26d_69_0.png)\n\n**图 2.11 从源代码生成可执行代码**\n\
    \n在这方面，值得注意的是，编译器是特定于编程语言的，而目标代码取决于它意图运行的平台。\n\n## UNIX 系统\n\n### 创建程序\n\n一旦我们加载了程序，我们需要养成使用小写字母编写程序的习惯。C\
    \ 程序语句是用小写字母写的。大写字母仅用于符号常量。在 UNIX 中，文件名可以由字母、数字和特殊字符组成，后面跟一个点和扩展名。\n\n使用大括号将语句分组在一起，并标记函数的开始和结束。\n\
    \n有效的文件名示例如下：\n\n```\nhello.c\nprogram.c\nfilename.c\n```\n\n使用 ed 或 vi 编辑器创建文件。由于\
    \ C 是一种自由格式语言，我们可以将多个语句分在同一行。\n\n```\na = b;\nx = y + 1;\nz = a + x;\n```\n\n\
    可以写在同一行：\n\n```\na = b; x = y+1; z = a+x;\n```\n\n程序\n\n```\nmain() \n{\n    printf(\"\
    Hello C\");\n}\n```\n\n可以写成一行：\n\n```\nmain() (printf(\"Hello C\"));\n```\n\n\
    然而，这种风格会让程序更难以理解，不应被使用。在书中，每个语句都单独写在一行。\n\n一旦我们加载了程序，我们需要养成使用小写字母编写程序的习惯。C 程序语句是用小写字母写的。大写字母仅用于符号常量。\n\
