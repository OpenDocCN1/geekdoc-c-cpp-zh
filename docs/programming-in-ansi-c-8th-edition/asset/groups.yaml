    ```\n\n我们只需要重复一个语句 100 次。同样，如果我们想重复执行整个语句块 10000 次或更多次，想象一下这样一个算法的长度。以这种方式编写代码可能会有些繁琐。相反，我们可以将语句放在迭代构造中并迭代（重复）\
    \ 100 次。像 I 这样的变量将用于跟踪迭代发生的次数。修改后的构造如下：\n\n```\nREPEAT steps (a)-(b) while I <<\
