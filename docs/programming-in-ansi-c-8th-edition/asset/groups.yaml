    \ 1。\n\n## 伪代码\n\n伪代码是以编码形式表示算法的手段。伪代码中使用的规范在语法上不像程序代码那样严格。然而，它们以编码形式表示了算法的步骤。伪代码以编码形式表示算法的步骤。给定伪代码，将其转换为程序代码是相对容易的。以下是算法\
    \ 的伪代码：\n\n```\n(\n  print 'Enter a value for the number '\n  scan N\n  I = 1\n\
    \  SUM = 0\n  while I <= N (\n    SUM = SUM + I\n    I = I + 1\n  )\n  print 'The\
    \ sum is: ', SUM\n)\n```\n\n需要注意的是，伪代码的形式接近程序代码。上述伪代码对应的 C 代码如下：\n\n```c\n#include\
    \ <stdio.h>\nint main() {\n  int I=1, SUM=0, N;\n  printf(\"\\nEnter a value for\
    \ the number: \", N);\n  scanf(\"%d\", &N);\n  while(I <= N) {\n    SUM = SUM\
    \ + I;\n    I++;\n  }\n  printf(\"The sum is: %d\\n\", SUM);\n}\n```\n\n## 流程图\n\
    \n与算法一样，流程图也是表示逻辑的工具。正如名称所示，流程图帮助我们图形化控制流。有时当我们面前有一张图时，理解逻辑变得更容易。此时流程图非常有用。与算法不同，流程图使用标准符号进行图形表示。表\
    \ 1.1 显示了常用构造的图形表示。\n\n### 表 1.1 流程图中的符号\n\n| 名称 | 描述 | 符号 |\n|---|---|---|\n\
    | 终端 | 此符号用于标记流程图的开始和结束。 | |\n| 输入/输出框 | 此框用于表示输入操作或输出操作。 | |\n| 处理框 | 此框用于表示处理操作。具体来说，此符号用于表示命令式逻辑构造。\
    \ | |\n| 决策框 | 菱形符号用于表示条件语句构造。每个框有两个出口，分别对应条件评估为真和假的结果。 | |\n| 连接符（页内） | 此符号用于将控制流从页面内的一点传输到另一点。连接符通常会标记以与其对应项匹配。\
    \ | |\n| 页外连接符（页间） | 此符号用于将控制流从一个页的这一点传输到另一个页的这一点。这种表示在流程图跨越多个页面时有用。 | |\n| 箭头线\
    \ | 用于显示从一个框到另一个框的流序列。 | |\n\n这里显示的符号是流程图中的一些基本符号。除此之外，还存在其他用于表示更复杂的构造，例如子程序调用、从数据库读取和打印。\n\
    \n现在让我们了解如何使用这些符号来绘制流程图。为了方便理解，我们考虑与理解算法时相同的示例。\n"
