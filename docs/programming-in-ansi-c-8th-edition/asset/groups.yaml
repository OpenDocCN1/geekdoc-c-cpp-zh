    are used by the computer to convey messages back to the users. The most common
    output device that almost all computers have is the monitor. The monitor is used
    to display the results of computations, messages, etc. Other examples of output
    devices are printers, speakers, plotters, etc.


    The input and the output devices are sometimes known as peripheral devices. These
    auxiliary devices may be connected to a computer and used. They are auxiliary
    because their existence within a computer is not mandatory unlike the CPU or the
    memory.


    # Memory


    Memory/storage unit is the component of a computer that serves data storage purposes.
    These units are of varying access speeds and volatility. Access speed refers to
    the time taken to store/retrieve data from the memory. Volatility refers to the
    duration of time or the conditions under which data is stored in the memory. Based
    on these characteristic features, the computer’s memory may be categorized into
    different types. Figure 1.3 shows the classification of the computer’s memory.


    ![](img/0696179f80a06738f7af12d3a451f26d_25_0.png)


    Fig. 1.3 Classification of the computer’s memory'
  - '[PAGE 26]


    As shown in the figure, the memory is broadly classified into primary memory and
    secondary memory. The primary memory, also known as the main memory, is so called
    because the CPU can directly interact with it through the data bus and the address
    bus. The main memory is of two major types, the random access memory (RAM) and
    the read only memory (ROM). The RAM is a volatile memory that stores instructions
    and data related to the program currently being executed. The RAM is volatile
    because it would lose all the information stored in it as soon as the power to
    the computer is switched off. Unlike the RAM which allows both the read and write
    operations, the ROM is a read-only, non-volatile memory. The ROM does not permit
    any write operation and is non-volatile because the information stored in it would
    be retained after the computer has switched off. Apart from other important routines,
    the ROM houses the boot strap loader. The boot strap loader is a system software
    that is responsible for loading the memory resident portion of the operating system
    from the secondary memory into the RAM once the computer has been switched on
    and the power on self tests (POST) have been conducted. The secondary memory,
    also known as auxiliary memory, is a large depository of nonvolatile storage space
    that can store information for as long as we want. In this respect it is worth
    mentioning that the secondary memory is slower compared to the access time of
    the primary memory. The hard disk, flash drives, etc. are some examples of secondary
    memory.


    # CONCEPT OF HARDWARE AND SOFTWARE


    The hardware of a computer consists of various electronic, electromechanical and
    electromagnetic devices along the interfacing buses connecting them. In other
    words, the hardware of the computer consists of the bare machinery. Software,
    on the other hand, consists of the set of instructions, commands, programs, etc.
    that can make the bare machinery operate and fulfill our objectives. If the hardware
    is the body, then the software is the soul of a system. For a computer to operate,
    both the hardware and the software are indispensable.'
  - '[PAGE 27]


    # Types of Software


    Depending upon the type of work a software is required to perform, it can be classified
    into two categories, system software and application software.


    # System Software


    System softwares are the ones that closely interact with the hardware of a computer.
    These softwares depend upon the architecture of the underlying computer. They
    are responsible for controlling the resources of the system and perform other
    activities related to the system. The different kinds of system softwares are
    operating system, loader, linker and translators.


    # Operating System


    Operating system is a system software which acts as an interface between the user
    and the bare hardware. The operating systems currently in use are Linux, UNIX,
    macOS High Sierra, etc. The major functions of an operating system are:


    +   - Process and processor (CPU) management


    +   - Memory management


    +   - Device management


    +   - File management


    To put it simply, the operating system manages all the resources of a computer.
    It interprets all the commands that it receives from the user to the underlying
    hardware. Today’s operating systems come with a smart graphic user interface (GUI)
    that is easy to operate. They also offer several utilities such as calculators,
    text editors, scanning softwares, drawing tools and image editing tools.


    # Translators'
