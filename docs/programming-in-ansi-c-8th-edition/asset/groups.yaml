- md: "\ndivisor is 0. We use the word ‘IF’ to do so. The condition ‘B != 0’ is evaluated\
    \ to check whether B is 0. If B is not 0, the condition is evaluated to be true.\
    \ In this case, the two statements ‘Q = A / B’ and ‘DISPLAY Q’ would be executed\
    \ in sequence. Once done, the control would move on to step 4 which causes the\
    \ algorithm to halt. In case B is 0, the condition would evaluate to be false.\
    \ Then the control of the algorithm would directly move to step 4 without attempting\
    \ the division operation. The symbol, ‘!=’ corresponds to ‘not equal to’. Again\
    \ this is not a standard notation for an algorithm. Some authors use ‘<>’ instead\
    \ of ‘not equal to’. When transforming into a program, ‘not equal to’ would be\
    \ replaced by the corresponding logical operator supported by the programming\
    \ language. The ‘END IF’ in step 3 indicates the end of the conditional construct.\n\
    \n## EXAMPLE 3 (Conditional construct)\n\n```\nAlgorithm MAXIMUM\nStep 0 START\n\
    Step 1 INPUT first number into variable A\nStep 2 INPUT second number into variable\
    \ B\nStep 3 IF A > B THEN\n    MAX = A\n    ELSE\n    MAX = B\nEND IF\nStep 4\
    \ DISPLAY MAX\nStep 5 END\n```\n\nProblem – Develop an algorithm to find the maximum\
    \ of two numbers input by the user.\n\nThis, like the previous one, also demonstrates\
    \ a conditional statement construct. However, depending upon the outcome of the\
    \ condition ‘A > B’ is true or false two different tasks would be performed. The\
    \ use of the word ‘ELSE’ makes this algorithm slightly different from the previous\
    \ one. However, decision-making is involved in both of them. The values of A and\
    \ B are compared to determine whether A is greater than B (A > B). If A is greater\
    \ than B, then it implies that A is the maximum of the two (MAX = A), else it\
    \ implies that B is the maximum of the two (MAX = B).\n\n## EXAMPLE 4 (Iteration\
    \ construct)\n\n## Problem – Develop an algorithm to find the sum of the first\
    \ N natural numbers where N would be input by the user.\n\n```\nAlgorithm SUM-N\n\
    Step 0 START\nStep 1 INPUT N\nStep 2 I = 1\nStep 3 SUM = 0\nStep 4 REPEAT Steps\
    \ (a) - (b) WHILE I <=N\n  (a) SUM = SUM + I\n  (b) I = I + 1\n  END WHILE\nStep\
    \ 5 DISPLAY SUM\nStep 6 END\n```\n\nThe objective of this algorithm is to calculate\
    \ 1 + 2 + ... + N. We use the variable SUM to store the result. The variable I\
    \ is initialized to 1 and the variable SUM to 0. The algorithm works by first\
    \ adding 1 into SUM, followed by 2, and then by 3 and so on. The process continues\
    \ till N is added into SUM. The values 1, 2, 3, ..., N are generated by the variable\
    \ I. If I is initially 1, it then incremented to become 2, followed by 3, ...,\
    \ finally N. The following are the sequence of steps that would be executed one\
    \ after another:\n\n```\nSUM = SUM + 1\nSUM = SUM + 2\nSUM = SUM + 3\n....\nSUM\
    \ = SUM + N\n```\n\nInstead of writing N addition statements (note that the value\
    \ of N is not known at development time) one after another, we use the following\
    \ form:\n\n```\nSUM = SUM + I, for all I = 1 to N\n```\n\nWe monotonically increment\
    \ the value of I and repeat the execution of the statement SUM = SUM + I until\
    \ the last value of I, viz. N, has been added into SUM. Incrementing I next value\
    \ would cause it to hold N + 1. This is when the condition at Step 4 'I<= N' fails\
    \ and the control of the algorithm moves to step 5. The execution of the statements\
    \ ‘SUM = SUM + I’ and ‘I = I + I’ would be repeated while ‘I<=N’. The control\
    \ of the algorithm remains within the loop (iteration) till the condition ‘I <=\
    \ N’ evaluates to true.\n\nwriting this algorithm, a strong assumption has been\
    \ made, that is, the user always inputs a positive whole number for N.\n\nIterative\
    \ constructs are thus used to simulate repetition. They are used when one or more\
    \ statements need to be executed repeatedly. Consider the situation where we want\
    \ to display the word ‘HELLO’ 100 times. We can write DISPLAY ‘HELLO’ 100 times\
    \ as follows:\n\n```\nDISPLAY 'HELLO' (1st, time)\nDISPLAY 'HELLO' (2nd, time)\n\
    DISPLAY 'HELLO' (3rd, time)..\nDISPLAY 'HELLO' (100th, time)\n```\n\nWe need to\
    \ repeat just one statement 100 times. Similarly, if we want to repeat the execution\
    \ of an entire statement block 10000 times or even more, imagine the length of\
    \ such an algorithm. Writing codes in such a manner may become a bit cumbersome.\
    \ Instead we can put the statement in an iterative construct and iterate (repeat)\
    \ it 100 times. A variable such as I would be used to keep track of the number\
    \ of times the iteration has taken place. The modified construct would be as follows:\n\
    \n```\nREPEAT steps (a)-(b) while I << 100\n(a) DISPLAY 'HELLO'\n(b) I = I + 1\n\
    END WHILE\n```\n\nLike before, I would have to be initialized to 1.\n\n## Pseudocode\n\
    \nPseudocodes are a means to represent an algorithm in a coded form. The specifications\
    \ used in a pseudocode are syntactically not stringent as in a program code. However,\
    \ they represent the steps of an algorithm in a coded form which very closely\
    \ resembles program code. Given a pseudocode, translation of the same into program\
    \ code is relatively easy. A pseudocode may be considered to be an intermediate\
    \ code between an algorithm and program code. The pseudocode for the algorithm\
    \ in Example 4 is as follows:\n\n## Pseudocode SUMN\n\n```\n(\n  print 'Enter\
    \ a value for the number N: '\n  scan N\n  I = 1\n  SUM = 0\n  while I <= N (\n\
    \    SUM = SUM + I\n    I = I + 1\n  )\n  print 'The sum is: ', SUM\n)\n```\n\n\
    It should be noted that a pseudocode is slightly more cryptic compared to an algorithm\
    \ and is closer in form to a C program code. The C code for the pseudocode shown\
    \ here would be as follows:\n\n```c\n#include <stdio.h>\nint main() {\n  int I,\
    \ SUM, N;\n  printf(\"\\nEnter a value for the number N:%d\\n\", N);\n  scanf(\"\
    %d\", &N);\n  while(I <= N) {\n    SUM = SUM + I;\n    I = I + 1;\n  }\n  printf(\"\
    The sum is: %d\\n\", SUM);\n}\n```\n\n## Flowchart\n\nJust like the algorithm,\
    \ the flowchart is also a tool to represent logic. As the name indicates, a flowchart\
    \ helps us graphically visualize the flow of control within the sequence. At times\
    \ it becomes easier for us to understand logic when we have a picture in front\
    \ of us. A flowchart proves to be really handy at such times. Unlike the algorithm,\
    \ the flowchart uses some standard notation to graphically represent. Table 1.1\
    \ shows the graphical representation of some common constructs.\n\n### Table 1.1\
    \ Notations in a flowchart\n\n| Name | Description | Symbol |\n|---|---|---|\n\
    | Terminal symbol | This symbol is used to mark the beginning and end of a flowchart.\
    \ | |\n| Input/output box | This box is used to represent input operations or\
    \ output operations. | |\n| Process box | This box is used to represent processing\
    \ operations. More specifically, this symbol is used to represent the imperative\
    \ logic construct. | |\n| Decision box | This diamond-shaped symbol is used to\
    \ represent conditional statement constructs. Each box has two exit points which\
    \ correspond to the evaluation of the condition to true and false. | |\n| Connector\
    \ (intra-page) | This symbol is used to transfer the flow of control from one\
    \ point to another within a page. A connector is usually labeled to match with\
    \ its counterpart. | |\n| Off-page connector (inter-page) | This symbol is used\
    \ to transfer the flow of control from one point on a page to another point on\
    \ a different page. This notation is useful when the flowchart spans more than\
    \ one page. | |\n| Arrowed lines | These are used to show the sequence of flow\
    \ from one box to another. | |\n\nThe symbols shown here are some basic ones that\
    \ are used in flowcharts. Apart from them, there also exist other symbols to represent\
    \ more constructs such as sub-routine call, reading from database and printing.\n\
    \nLet us now understand the use of these symbols to draw flowcharts. For ease\
    \ of understanding, we consider the same set of examples which we have considered\
    \ for understanding algorithms.\n"
