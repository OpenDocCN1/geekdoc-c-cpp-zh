    # Fig. 2.12 Compilation of multiple files


    It is also possible to compile each file separately and link them later. For example,
    the commands


    ```

    cc -c mod1.c

    cc -c mod2.c

    ```


    will compile the source files mod1.c and mod2.c into objects mod1.o and mod2.o.
    They can be linked by the command


    ```

    cc mod1.o mod2.o

    ```


    we may also combine the source files and object files as follows:


    ```

    cc mod1.c mod2.o

    ```


    Only mod1.c is compiled and linked with the object file mod2.o. This approach
    is useful when one of the multiple source files need to be changed and recompiled
    or an already existing object files is to be used along with the program to be
    compiled.


    # MS-DOS SYSTEM


    The program can be created using any word processing software in non-document
    mode. The file name should end with the characters “.e” like **program.c, pay.c**,
    etc. Then the command


    ```

    MSC pay.c

    ```


    under MS-DOS operating system would load the program stored in the file pay.c
    and generate the object code. This code is stored in another file name pay.obj.
    In any language errors are found, the compilation is not completed. The program
    should then be corrected and compiled again.


    The linking is done by the command


    ```

    LINK pay.obj

    ```'
