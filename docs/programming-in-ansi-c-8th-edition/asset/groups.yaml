    # Compiling and Linking


    Let us assume that the source program has been created in a file named ebg1.c.
    Now the program is ready for compilation. The compilation command to achieve this
    task under UNIX is


    ```

    cc ebg1.c

    ```


    The source program instructions are now translated into a form that is suitable
    for execution by the computer. The translation is done after examining each instruction
    for its correctness. If everything is alright, the compilation proceeds silently
    and the translated program is stored on another file with the name ebg1.o. This
    program is known as object code.


    Linking is the process of putting together other program files and functions that
    are required by the program. For example, if the program is using exp() function,
    the object code of this function should be brought from the math library of the
    system and linked to the main program. Under UNIX, the linking is automatically
    done (if no errors are detected) when the cc command is used.


    If any mistakes in the syntax and semantics of the language are discovered, they
    are listed out and the compilation process ends right there. The errors should
    be corrected in the source program with the help of the editor and the compilation
    is done again.


    The compiled and linked program is called the executable object code and is stored
    automatically in another file named a.out.


    Note that some systems use different compilation command for linking mathematical
    functions.


    ```

    cc filename - lm

    ```


    is the command under UNIPLUS SYSTEM V operating system.


    # Executing the Program


    Execution is a simple task. The command


    ```

    /a.out

    ```'
  - '[PAGE 71]


    would load the executable object code into the computer memory and execute the
    instructions. During execution, the program may request for some data to be entered
    through the keyboard. Sometimes the program does not produce the desired results.
    Perhaps, something is wrong with the program logic or data. Then it would be necessary
    to correct the source program or the data. In case the source program is modified,
    the entire process of compiling, linking and executing the program should be repeated.


    # Creating Your Own Executable File


    Note that the linker always assigns the same name a.out. When we compile another
    program, this file will be overwritten by the executable object code of the new
    program. If we want to prevent from happening, we should rename the file immediately
    by using the command.


    ```

    mv a.out name

    ```


    We may also achieve this by specifying an option in the cc command as follows:


    ```

    cc -o name source-file

    ```


    This will store the executable object code in the file name and prevent the old
    file a.out from being destroyed.


    # Multiple Source Files


    To compile and link multiple source program files, we must append all the file
    names to the cc command.


    ```

    cc filename-1.c ....filename-n.c

    ```


    These files will be separately compiled into object files called


    ```

    filename-i.o

    ```


    and then linked to produce an executable program file a.out as shown in Fig. 2.12.'
