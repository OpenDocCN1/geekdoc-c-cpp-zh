  mdcn: "\n翻译器是一类系统软件，用于将用一种编程语言编写的程序转换为另一种语言。编译器、汇编器、解释器等是常用的几种翻译器。源编程语言可以是高级编程语言或汇编语言。在几乎所有情况下，目标语言都是机器语言，其本质上是二进制的（1\
    \ 和 0——高电压和低电压）。翻译器属于系统软件，因为它们需要对底层硬件的体系配置有深入的理解。这种知识是必要的，因为目标代码是依赖机器的。特定架构支持的机器指令集可能不被其他架构支持。\n\
    \n**编译器**是将用高级编程语言（HLL）编写的程序转换为机器语言的系统软件。C、C++、Java 等都是高级语言的示例。因此，必须意识到 HLL 的语法细微差别，以及目标程序预期执行的机器的指令集、寻址模式、寄存器配置等。编程语言的语法规范通过该语言的语法提供给编译器。因此，为\
    \ C 语言设计的编译器将无法处理用 Java 语言编写的程序。这是因为 C 编译器提供了 C 语言的语法规则，它会将使用 Java 编写的语句视为错误。编译器的输出是机器语言，并使用计算机\
    \ CPU 支持的指令。因此，为使用 Intel 处理器的计算机生成机器码的编译器将无法为包含 Motorola 处理器的计算机生成机器码。对于任何编译器，指定源语言以及输出程序将执行的目标机器都是关重要的。编译器生成的机器码被称为对象。\n\
    \n**汇编器**将用汇编语言编写的程序转换为机器语言。汇编语言由底层处理器支持的指令组成。汇编语言与机器语言的区别在于，汇编语言使用如 ADD、SUB 等助记符，而机器语言对这些助记符使用对应的二进制操作码。\n\
    \n# 链接器 (Linker)\n\n链接器将属于程序所有子程序/函数的目标代码连接在一起，形成可执行代码。这些可执行代码可以存储在辅助内存中，并在需要执行时加载到主内存中。\n\
    \n# 加载器 (Loader)\n\n加载器是将待执行的程序从辅助内存加载到主内存指定区域的系统软件。现代操作系统内部集成了加载器。绝对加载器、可重定位加载器、直接链接加载器是加载器的几种形式。在这方面，称为引导加载器（bootstrap\
    \ loader）的特殊加载器值得特别提及。正如前面提到的，引导加载器在计算机启动后立即将操作系统的内存驻部分加载到主内存中。然后操作系统接管计算机的控制权。\n\
    \n# 应用程序 (Application Software)\n\n应用程序是用于执行特定活动并在各个方面帮助用户的。文字处理软件、图像编辑软件、电子表格软件包、数据库软件和会计软件都是应用程序的示例。这些每种软件都是为了特殊目的而设计的。\n\
    \n# 通过算法和流程图进行编程艺术\n\n在上一节中，我们看到软件是计算机不可见但不可或缺的部分，它使用户能够与计算机交互，并按照个人的规范和要求工作，以实现计算目标。软件可以被视为一组以协调方式工作执行任务的程序。程序是一组指令，按顺序执行时会执行任务。\n\
    \n![](img/0696179f80a06738f7af12d3a451f26d_30_0.png)\n\n让我们考虑一个程序的示例，该程序执行时将允许用户输入两个数字，将它们相加并显示结果。显然，这个程序将包含三组指令：第一组允许用户输入数据，第二组用于数字相加，第三组用于显示结果。在编写程序时，程序员已经计划了这三组，并使用了其中的语句来实现它们中的每一个。这里考虑的示例是极其简单的。\n\
    \n然而，在大多数情况下，计算机需要解决的问题要比这复杂得多。此类复杂的问题不可避免需要复杂的解决方案。这些解决方案涉及许多复杂的算运算和逻辑决策。当务之急的是一种工具，能够让我们表示程序所需的逻辑，并使逻辑转换为等效指令集，当这些指令由计算机执行时就能解决问题。算法和流程图就是两种工具。这些工具独立于编程语言也独立于目标机器。因此，使用这些工具之一表示的逻辑可以用于用程序员选择的任何语言来编写程序。事实上，逻辑应该始终独立于编程语言。无论选择何种工具和语言来编写程序，编程逻辑结构都有三种重要类型（除了输入/输出和子程序调用结构外外）：\n\
    \n- 命令式语句（动作）\n- 条件判断语句（决策制定）\n- 迭代语句（重复/循环）\n\n我们所讨论的工具应该能够表示这三类结构中的每一种，因为程序包含了属于这三类之一的语句。\n\
    \n建议始终使用算法和流程图等工具先计划，然后编写程序。毕竟，俗话所说，计划周意味着成功了一半。\n\n# 算法 (Algorithm)\n\n算法是一组有限的、无歧的指令，执行时能正确完成任务。这种对算法的描述有三个特征性。它们是：\n\
    \n- 执行任务所需的步骤数应该是有限的。\n- 算法中的每条指令都应该是无歧的；意味着在算法执行时，结果应该是确定的且可预测的。\n- 最后，算法应该正确解决问题。也就是说，在算法执行时，目标应该得以实现。\n\
    \n编写算法没有定义的规则。然而，大多数作者倾向于使用类似英语的语句来表示每个步骤需要的操作。我们将考虑不同的示例来演示这三类结构。\n\n示例 1（使用命令式结构）\n\
    \n问题——开发一个算法来计算三个输入数字的平均值。\n\n# 平均 AVERAGE\n\nStep 0 开始\nStep 1 将第一个数字存入变量 A\n\
    Step 2 将第二个数字存入变量 B\nStep 3 将第三个数字存入变量 C\nStep 4 计算 SUM = A + B + C\nStep 5 计算\
    \ AVG = SUM / 3\nStep 6 显示 AVG\nStep 7 结束\n\n步骤 1、2 和 3 是启用输入数字的语句。步骤 6 用于显示结果。步骤\
    \ 4 和 5 对我们特别感兴趣，因为这些是指示执行计算的命令式语句。因此，命令式语句是命令处理器执行任务的语句。\n\n正如前面提到的，编写算法没有固定规则。同样的算法完全可以不用步骤\
    \ 4 和 5 中的“计算”一词。同样，步骤 1 可以简单地写为“输入 A”。步骤 1 中“第一个数字存入变量”这样的短语作为注释，增加了算法的可读性和理解性。\n\
    \n# 示例 2（条件结构）\n\n问题——开发一个算法将一个数字除以另一个数字并求商。\n\n算法 DIVISION\nStep 0 开始\nStep 1\
    \ 将第一个数字存入变量 A\nStep 2 将第二个数字存入变量 B\nStep 3 如果 B != 0 则\n  Q = A/B\n  显示 Q\n结束\n\
    Step 4 结束```\n\n将一个数字除以另一个数字可能是给 CPU 处理的最简单的指令之一。然而，在除两个数字时，应始终小心检查除数是否为 0。计算机没有存储无限大数字的方法。因此，它不允许除以\
    \ 0。强制尝试这样做会导致计算机产生运行时“溢出”错误并立即中止处理。这里开发的算法检查除数 B 是否为 0。只有当 B 不为 0 时，才执行除法并显示结果。步骤\
    \ 3 是决定是否的\n"
