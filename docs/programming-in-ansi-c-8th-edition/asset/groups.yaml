    it 100 times. A variable such as I would be used to keep track of the number of
    times the iteration has taken place. The modified construct would be as follows:


    ```

    REPEAT steps (a)-(b) while I << 100

    (a) DISPLAY ''HELLO''

    (b) I = I + 1

    END WHILE

    ```


    Like before, I would have to be initialized to 1.


    # Pseudocode


    Pseudocodes are a means to represent an algorithm in a coded form. The specifications
    used in a pseudocode are syntactically not stringent as in a program code. However,
    they represent the steps of an algorithm in a coded form which very closely resembles
    program code. Given a pseudocode, translation of the same into program code is
    relatively easy. A pseudocode may be considered to be an intermediate code between
    an algorithm and program code. The pseudocode for the algorithm in Example 4 is
    as follows:'
  - "[PAGE 36]\n\n# Pseudocode SUMN\n\n```\n(\n  print 'Enter a value for the number\
    \ N: '\n  scan N\n  I = 1\n  SUM = 0\n  while I <= N (\n    SUM = SUM + I\n  \
    \  I = I + 1\n  )\n  print 'The sum is: ', SUM\n)\n```\n\nIt should be noted that\
    \ a pseudocode is slightly more cryptic compared to an algorithm and is closer\
    \ in form to a C program code. The C code for the pseudocode shown here would\
    \ be as follows:\n\n```\n#include <stdio.h>\nint main() {\n  int I, SUM, N;\n\
    \  printf(\"\\nEnter a value for the number N:%d\\n\", N);\n  scanf(\"%d\", &N);\n\
    \  while(I <= N) {\n    SUM = SUM + I;\n    I = I + 1;\n  }\n  printf(\"The sum\
    \ is: %d\\n\", SUM);\nn}\n```\n\nA quick comparison between the pseudocode and\
    \ the corresponding program using the C language shows that function names as\
    \ 'printf' and 'scanf' have replaced pseudocodes as 'print' and 'scan'. 'print'\
    \ and 'scan' are codes for representing display and input operations. They are\
    \ pseudo (false) because these codes would not be understood by the C compiler\
    \ or the machine. Nevertheless, they are still in an encoded form. It is worth\
    \ noting that the statements in the C program are syntactically bound. However,\
    \ such restrictions are not to be found in a pseudocode.\n\n# Flowchart"
  - '[PAGE 37]


    Just like the algorithm, the flowchart is also a tool to represent logic. As the
    name indicates, a flowchart helps us graphically visualize the flow of control
    within the sequence of statements. At times it becomes easier for us to understand
    logic better when we have a picture in front of us. A flowchart proves to be really
    handy at such times. Unlike the algorithm, the flowchart uses some standard notation
    to graphically represent logic. Table 1.1 shows the graphical representation of
    some common constructs.


    # ### Table 1.1 Notations in a flowchart


    | Name | Description | Symbol |

    |---|---|---|n| Terminal symbol | This symbol is used to mark the beginning and
    end of a flowchart. | |

    | Input/output box | This box is used to represent input operations or output
    operations. | |

    | Process box | This box is used to represent processing operations. More specifically,
    this symbol is used to represent the imperative logic construct. | |

    | Decision box | This diamond-shaped symbol is used to represent conditional statement
    constructs. Each box has two exit points which correspond to the evaluation of
    the condition to true and false. | |

    | Connector (intra-page) | This symbol is used to transfer the flow of control
    from one point to another within a page. A connector is usually labeled to match
    with its counterpart. | |

    | Off-page connector (inter-page) | This symbol is used to transfer the flow of
    control from one point on a page to another point on a different page. This notation
    is useful when the flowchart spans more than one page. | |

    | Arrowed lines | These are used to show the sequence of flow from one box to
    another. |


    The symbols shown here are some basic ones that are used in flowcharts. Apart
    from them, there also exist other symbols to represent more constructs such as
    sub-routine call, reading from database and printing.


    Let us now understand the use of these symbols to draw flowcharts. For ease of
    understanding, we consider the same set of examples which we have considered for
    understanding algorithms.'
