    \n## 前言\n\nC 是一种强大、灵活、可移植且结构优雅的编程语言。由于 C 结合了高级语言的特征和汇编的元素，它既适用于系统编程也适用于应用程序编程。它无疑是使用最广泛的通用语言。\n\
    \n## 本版新增\n\n自 1989 年标准化以来，C 语言经历了一系列变化。作为畅销书之一，《ANSI C语言编程》正向着完美迈出又一步。书中引入了一个新章节“计算导论”。编程章节也通过写作得到了丰富。\n\
    \n## 书籍结构\n\n《ANSI C语言编程》第八版从两个介绍性章节开始。第一章“计算导论”向学生介绍了计算机的不同组成部分并讨论了问题的解决方法。第二章“C语言概述”讨论了\
    \ C 的基本结构及其执行。第三章讨论了如何声明常量、变量和数据类型。第四章介绍了运算符和表达式。第五章涉及输入输出操作的管理。第六章讲述了分支。第七章解释了决策和循环的概念。第八章和第九章分别讨论了数组、字符数组和字符串。第十章和第十一章涵盖了用户定义函数、结构体和联合体，第十二章讲述了指针。第十三章简述了\
    \ C 语言中的文件管理。第十四章介绍了动态内存分配和链表。第十五章章解释了预处理器。第十六章列出了开发 C 程序的指南。\n\n## 本书主要特点\n\n\
    - 一本涵盖 C 语言基础及最新功能的全面著作。\n- 每个章节都根据布鲁姆分类法遵循基于结果的学习方法。\n- 强大的教学功能，包括：\n  - 例题\n\
    \  - 提示和重要笔记\n  - 24 个详细案例研究\n  - 多选题\n  - 编程与调试题\n  - 面试题\n- 两个全新的有趣项目，涉及：\n\
    \  - 电力管理系统\n  - 使用 C 构建 Web 服务\n- 一个关于“使用 C 进行图形编程”的引人胜的附录\n\n## 数字资源\n\n可以通过链接访问数字资源（http://www.mhhe.com/balagurusamy/ansic8e）。它包含：\n\
    \n- 项目\n- 电子案例研究\n- 补充信息和问题\n\n## 致谢\n\n本书是我在浩瀚无限的知识海洋中留下足迹的诚意尝试。我请求读者尽可能地利用这本书。\n\
    \n我特别对麦格罗集团教育（印度）整个团队表示感谢。\n\nE Balagurusamy\n\n## 出版者说明\n\n麦格罗集团教育（印度）邀请您的建议和意见，所有意见均可发送至\
