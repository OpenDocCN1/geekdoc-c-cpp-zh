    Integers are numbers with a range of values supported by a particular machine.
    Generally, integers occupy one word of storage, and since the word sizes varies
    (typically, 16 or 32 bits) the size of an integer that can be stored depends on
    the computer. If we use a 16 bit word length, the size of the integer value is
    limited to the range −32768 to +32767 (that is, $-2^{15}$ to $+2^{15}-1$). A signed
    integer uses one bit for sign and 15 bits for the magnitude of the number. Similarly,
    a 32 bit word length can store an integer ranging from -2,147,483,648 to 2,147,483,647.


    ![](img/0696179f80a06738f7af12d3a451f26d_94_1.png)


    ### Fig. 3.5 Integer types


    In order to provide some control over the range of numbers and storage space,
    C has three classes of integer storage, namely short int, int, and long int, both
    signed and unsigned forms. ANSI C defines these types so that they can be organized
    from the smallest to the largest, as shown in Fig. 3.5. For example, short int
    represents fairly small integer values and requires half the amount of storage
    as a regular int number. Unlike integers, unsigned int uses all the bits for the
    magnitude of the number and are always positive. Therefore, for a 16 bit machine,
    the range of unsigned integer numbers will be from 0 to 65,535.


