    # Preface


    C is a powerful, flexible, portable and elegantly structured programming language.
    Because C combines the features of the high-level language with the elements of
    an assembler, it is suitable for both systems and applications programming. It
    is undoubtedly the most widely used general-purpose language today in operating
    systems, and embedded system development. Its influence is evident in almost all
    modern programming languages. Since its standardization in 1989, C has undergone
    a series of changes and improvements in order to enhance the usefulness of the
    language. The version that incorporates the new features is now referred to as
    C11.


    # New to this Edition


    Distinguished as one of the bestsellers in the market, ‘Programming in ANSI C’
    is taking forward another step in the pursuit of perfection. The title keeps up
    with its predecessors by balancing theory and practical approach of the subject.
    In order to build a firm foundation, a new chapter ‘Introduction to Computing’
    has been introduced. The appendix ‘Projects’ has been revamped with two new and
    exciting projects, that will help students to hone their programming skills and
    bring them to practical usefulness. Existing chapters have been further enriched
    with additional write-ups, tips and a new ‘Test Your Skills’ section around the
    content. Two new sections, Multiple Choice Questions and Interview Questions,
    have been introduced in each chapter, with the intent to give more practice to
    students and prepare them for different interviews and competitive exams. The
    section on Programming Exercises has also been enriched with some new questions.


