    # Chapter 1


    # Introduction to Computing


    ## LEARNING OBJECTIVES

    Upon completing this chapter, you will be able to:


    - LO 1.1 Know the structure of a computer and have an idea about its functioning

    - LO 1.2 Learn to develop programming logic through algorithms and flowcharts


    ## INTRODUCTION


    Computing is an operation that involves processing of data by making use of a
    computer. To be able to use a computer and perform computation, we first need
    to be aware of the different components that are present in it and understand
    how these components may be used to serve our purposes. In this chapter, we will
    briefly discuss the different hardware components of a computer. We will also
    discuss methods to develop programs using which we can achieve our objective to
    solve problems and perform various computational activities.


    ## COMPONENTS OF A COMPUTER


    A computer is an electronic device which may be used to perform various computations
    involving arithmetic and logical operations. Figure 1.1 shows the major components
    of a computer.


    | LO 1.1 |

    | :--- |

    | Know the structure of a computer and have an idea about its functioning |


    ![](img/0696179f80a06738f7af12d3a451f26d_23_0.png)


    # Fig. 1.1 Components of a computer


    As seen in the figure, the major components in a computer are the central processing
    unit (CPU), input device(s), output devices(s) and the memory. These components
    interact with each other using buses, as shown in the figure.


    ## Central Processing Unit


    The CPU is the unit in which all processing activities take place. The CPU is
    a classic example of a very large scale integrated (VLSI) electronic circuit that
    consists of the arithmetic and logic unit (ALU), the control unit (CU) and some
    registers. Figure 1.2 shows the layout of a CPU. The ALU contains circuits through
    which various arithmetic and logical operations may be executed. These circuits
    include adders (for addition), subtractors (for subtraction), comparators (for
    comparison of operands), etc. The CU, also known as the brain of a computer, is
    the unit responsible for generating control signals. These control signals control
    the working of the various components within a computer. The registers present
    inside the CPU may be considered a set of high-speed storage devices to serve
    as working memory for the ALU. Some of these registers are assigned the task of
    holding special data or instructions. Such registers are known as special purpose
    registers, whereas others are known as general purpose registers. The units present
    inside the CPU interact with each other through an internal bus. Signals generated
    by the CU also control the activities of the various components within the CPU.
    Apart from the internal bus, three other buses also interface the CPU. The control
    bus carries control signals generated by the CU to the memory and all the peripherals.
    The address bus carries an address to locate a word in the memory. Finally, the
    data bus is used to carry data and information to and from between the components
    of the computer. In addition to the units mentioned so far, modern day CPUs are
    also equipped with high-speed, on-chip memory units known as the cache memory.


    ![](img/0696179f80a06738f7af12d3a451f26d_24_0.png)


    Fig. 1.2 Layout of a model CPU


    ## Input Devices


    Input devices are the ones through which users are allowed to input data and other
    instructions to the computer. The most popular choices for input devices are the
    keyboard and the mouse. Other examples include scanners, readers, etc. Most input
    devices are electro-mechanical in nature which accept the inputs from the user
    through mechanical means, such as depressing of keys in a keyboard to enter some
    data or moving the mouse around on a surface to locate a position. Information
    acquired through mechanical means is digitized (converted into electronic signals)
    and transmitted to the CPU/memory.


    ## Output Devices


    Just as input devices are used to convey messages to the computer, output devices
    are used by the computer to convey messages back to the users. The most common
    output device that almost all computers have is the monitor. The monitor is used
    to display the results of computations, messages, etc. Other examples of output
    devices are printers, speakers, plotters, etc.


    The input and the output devices are sometimes known as peripheral devices. These
    auxiliary devices may be connected to a computer and used. They are auxiliary
    because their existence within a computer is not mandatory unlike the CPU or the
    memory.


    ## Memory


    Memory/storage unit is the component of a computer that serves data storage purposes.
    These units are of varying access speeds and volatility. Access speed refers to
    the time taken to store/retrieve data from the memory. Volatility refers to the
    duration of time or the conditions under which data is stored in the memory. Based
    on these characteristic features, the computer’s memory may be categorized into
    different types. Figure 1.3 shows the classification of the computer’s memory.


    ![](img/0696179f80a06738f7af12d3a451f26d_25_0.png)


    Fig. 1.3 Classification of the computer’s memory


    As shown in the figure, the memory is broadly classified into primary memory and
    secondary memory. The primary memory, also known as the main memory, is so called
    because the CPU can directly interact with it through the data bus. The main memory
    is of two major types, random access memory (RAM) and read only memory (ROM).
    The RAM is a volatile memory that stores instructions and data currently being
    executed. The RAM is volatile because it would lose all the information stored
    in it as soon as the power to the computer is switched off. Unlike the RAM which
    allows both read and write operations, the ROM is a read-, nonvolatile memory.
    Apart from other important routines, the ROM houses the bootstrap loader. The
    secondary memory, also known as auxiliary memory, is a large depository of nonvolatile
    storage space that can store information for long as we want. In this respect
    it is worth mentioning that the secondary memory is slower compared to the access
    time of the primary memory. The hard disk, flash drives, etc. are some examples
    of secondary memory.


    ## CONCEPT OF HARDWARE AND SOFTWARE


    The hardware of a computer consists of various electronic, electromechanical and
    electromagnetic devices along the interfacing buses connecting them. In other
    words, the hardware of the computer consists of the bare machinery. Software,
    on the other hand, consists of the set of instructions, commands, programs, etc.
    that can make the bare machinery operate and fulfill our objectives. If the hardware
    is the body, then the software is the soul of a system. For a computer to operate,
    both the hardware and the software are indispensable.


    ## Types of Software


    Depending upon the type of work a software is required to perform, it can be classified
    into two categories, system software and application software.


    ## System Software


    System softwares are the ones that closely interact with the hardware of a computer.
    These softwares depend upon the architecture of the underlying computer. They
    are responsible for controlling the resources of the system and perform other
    activities related to the system. The different kinds of system softwares are
    operating system, loader, linker and translators.


    ## Operating System


    Operating system is a system software which acts as an interface between the user
    and the bare hardware. The operating systems currently in use are Linux, UNIX,
    macOS High Sierra, etc. The major functions of an operating system are:


    - Process and processor (CPU) management

    - Memory management

    - Device management

    - File management


    To put it simply, the operating system manages all the resources of a computer.
    It interprets all the commands that it receives from the user to the underlying
    hardware. Today’s operating systems come with a smart graphic user interface (GUI)
    that is easy to operate. They also offer several utilities such as calculators,
    text editors, scanning softwares, drawing tools and image editing tools.

