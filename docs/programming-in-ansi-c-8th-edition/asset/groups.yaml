    When an adjective (qualifier) short, long, or unsigned is used without a basic
    data type specifier, C compilers treat the data type as an **int**. If we want
    to declare a character variable as unsigned, then we must do so using both the
    terms like **unsigned char**.


    ## Default Values of Constants


    Integer constants, by default, represent **int** type data. We can override the
    default by specifying unsigned or long after the number (by appending U or L)
    as shown below:


    | Literal | Type | Value |

    |---|---|---|

    | 111 | int | 111 |

    | -222 | int | -222 |

    | -45678 | unsigned int | 45,678 |

    | -56789L | long int | -56,789 |

    | 987654UL | unsigned long | 9,876,544 |


    Similarly, floating constants, by default represent **double** type data. If we
    want the resulting data type to be **float** or **long double**, we must append
    the letter f or F to the number for **float** and letter L for **long double**
    as shown below:


    | Literal | Type | Value |

    |---|---|---|

    | 0 | double | 0.0 |

    | .0 | double | 0.0 |

    | 12.0 | double | 12.0 |

    | 1.234 | double | 1.234 |

    | -1.2f | float | -1.2 |

    | 1.23456789L | long double | 1.23456789 |


