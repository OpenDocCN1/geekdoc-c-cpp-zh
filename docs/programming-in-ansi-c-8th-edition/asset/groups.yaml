    # EXECUTING A ‘C’ PROGRAM


    Executing a program written in C involves a series of steps. These are:


    +   1. Creating the program;

    2. Compiling the program;

    3. Linking the program with functions that are needed from the C library; and

    4. Executing the program.


    Figure 2.10 illustrates the process of creating, compiling and executing a C program.
    Although these steps remain the same irrespective of the *operating system*, system
    commands for implementing the steps and conventions for naming *files* may differ
    on different systems.


    An operating system is a program that controls the entire operation of a computer
    system. All input/output operations are channeled through the operating system.
    The operating system, which is an interface between the hardware and the user,
    handles the execution of user programs.'
