    \ > B”真或假的结果，将执行两个不同的任务。单词“ELSE”的使用这个算法与上一个略有不同。然而，两者都涉及决策。通过比较 A 和 B 的值来确定 A\
    \ 是否大于 B (A > B)。如果 A 大于 B，则意味着 A 是两个数中的最大值 (MAX = A)，否则意味着 B 是两个数中的最大值 (MAX =\
    \ B)。\n\n## 示例 4（迭代构造）\n\n## 问题 – 开发一个算法，计算前 N 个自然数的和，其中 N 由用户输入。\n\n```\nAlgorithm\
    \ SUM-N\nStep 0 START\nStep 1 INPUT N\nStep 2 I = 1\nStep 3 SUM = 0\nStep 4 REPEAT\
    \ Steps (a) - (b) WHILE I <=N\n  (a) SUM = SUM + I\n  (b) I = I + 1\n  END WHILE\n\
    Step 5 DISPLAY SUM\nStep 6 END\n```\n\n该算法的目标是计算 1 + 2 + ... + N。我们使用变量 SUM 来存储结果。变量\
    \ I 初始化为 1，变量 SUM 初始化为 0。算法的工作原理是首先将 1 加到 SUM，然后是 2，然后是 3，以此此类推。该过程持续直到 N 加到 SUM。值\
    \ 1, 2, 3, ..., N 是由变量 I 生成的。如果 I 初始为 1，它将递变为 2，然后是 3, ..., 最后是 N。以下将按顺序执行的步骤序列：\n\
    \n```\nSUM = SUM + 1\nSUM = SUM + 2\nSUM = SUM + 3\n....\nSUM = SUM + N\n```\n\
    \n与其连续地编写 N 个加法语句（注意 N 的值在开发时是未知的），我们使用以下形式：\n\n```\nSUM = SUM + I, for all I\
    \ = 1 to N\n```\n\n我们单调地增加 I 的值，并重复执行语句 SUM = SUM + I，直到 I 的最后一个值（即 N）被加到 SUM\
    \ 中。增加 I 的下一个值将使其持有 N + 1。此时，第 4 步的条件 'I<= N' 失败，算法控制流移动到第 5 步。语句‘SUM = SUM +\
    \ I’和‘I = I + I’的执行将在‘I<=N’期间重复。算法的控制流保持在循环（迭代）中，直到条件‘I <= N’评估为真。\n\n在编写此算法时，有一个强力的假设，即用户始终为\
