    # # BASIC STRUCTURE OF C PROGRAMS


    The examples discussed so far illustrate that a C program can be viewed as a group
    of building blocks called functions. A function is a subroutine that may include
    one or more statements designed to perform a specific task. To write a C program,
    we first create functions and then put them together. A C program may contain
    one or more sections as shown in Fig. 2.9.


