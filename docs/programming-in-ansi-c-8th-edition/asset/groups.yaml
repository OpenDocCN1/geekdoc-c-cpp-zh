    # 计算简介


    ## 学习目标

    完成本章后，你将能够：


    - LO 1.1 了解计算机的结构并对其工作原理有初步认识

    - LO 1.2 学习通过算法和流程图开发编程逻辑


    ## 引言


    计算是一项利用计算机对数据进行处理的操作。为了能够使用计算机并执行计算，我们首先需要了解其中存在的不同组件，并理解这些组件如何被用于我们的目的。在本章中，我们将简要讨论计算机的不同硬件组件。我们还将讨论开发程序的方法，通过这些程序来实现解决问题和执行各种计算活动的目标。


    ## 计算机组件


    计算机是一种电子设备，可执行涉及算术和逻辑运算的各种计算。图 1.1 显示了计算机的主要组件。


    | LO 1.1 |

    | :--- |

    | 了解计算机的结构并对其工作原理有初步认识 |


    ![](img/0696179f80a06738f7af12d3a451f26d_23_0.png)


    # 图 1.1 计算机的组件


    如图所示，计算机的主要组件是中央处理器 (CPU)、输入设备、输出设备和内存。这些组件通过总线相互作用，如图所示。


    ## 中央处理器


    CPU 是进行所有处理活动的单元。CPU 是超大规模集成 (VLSI) 电子电路的典型示例，它由算术逻辑单元 (ALU)、控制单元 (CU) 和一些寄存器组成。图
    1.2 显示了 CPU 的布局。ALU 包含了通过其可以执行各种算术和逻辑运算的电路。这些电路包括加器（用于加法）、减法器（用于减法）、比较器（用于操作数比较）等。CU
    也称为计算机的大脑，是负责生成控制信号的单元。这些控制信号控制着计算机内部各种组件的工作。CPU 内部的寄存器可以被视为一组高速存储设备，作为 ALU 的工作内存。其中一些寄存器被分配了持有特殊数据或指令的任务。此类寄存器被称为特殊用途寄存器，而另一些被称为通用寄存器。CPU
    内部的单元通过内部总线相互作用。CU 生成的信号也控制 CPU 内部各种组件的活动。除了内部总线外，还有三个总线与 CPU 连接。控制总线将 CU 生成的控制信号传输到内存和所有外设。地址总线传输用于定位内存中字的地址。最后，数据总线用于在上述组件单元之外，现代
    CPU 还配备了高速片上内存单元，称为缓存内存。


    ![](img/0696179f80a06738f7af12d3a451f26d_24_0.png)


    图 1.2 示例 CPU 的布局


    ## 输入设备


    输入设备是允许用户向计算机输入数据和其他指令的设备。输入设备最常用的选择是键盘和鼠标。其他示例包括扫描仪、阅读器等。大多数输入设备本质上是机电的，通过机械手段接受用户的输入，例如通过按下键盘上的键输入某些数据，或在表面上移动鼠标以确定位置。通过机械手段获取的信息会被数字化（转换为电子信号）并传输到
    CPU/内存。


    ## 输出设备


    正如输入设备用于向计算机传递信息一样，计算机使用输出设备向用户传回信息。几乎所有计算机都有的最常见输出设备是显示器。显示器用于显示计算结果、消息等。其他输出设备的示例包括打印机、扬声器、绘图仪等。


    输入输出设备有时被称为外设备。这些辅助设备可以连接到计算机并使用。它们之所以被称为辅助，是因为与 CPU 或内存不同，它们在计算机中的存在并非强制性的。


    ## 内存


    内存/存储单元是计算机中用于存储数据的组件。这些单元具有不同的访问速度和易失性。访问速度指的是从内存中存储/检索数据所需的时间。易失性是指数据存储在内存中的持续时间或条件。根据这些特征，计算机内存可以分为不同的类型。图
    1.3 显示了计算机内存的分类。


    ![](img/0696179f80a06738f7af12d3a451f26d_25_0.png)


    图 1.3 计算机内存的分类


    如图所示，内存大致分为主存和辅存。主存也称为主内存，是因为 CPU 可以通过数据总线与之交互。主内存有两个主要类型：随机存存储器 (RAM) 和只读存储器
    (ROM)。RAM 是一种易失内存，存储当前执行的指令和数据。RAM 是易失的，因为一旦关闭计算机电源，存储的所有信息就会丢失。与允许读写操作 RAM 不同，ROM
    是非易失内存。除了其他重要的程序外，ROM 包含了引导加载程序。辅存也称为辅助内存，是一个巨大的非易失存储空间，可以根据我们的需要长期存储信息。值得注意的是，与主内存的访问时间相比，辅存较慢。硬盘、闪存等都是辅存的示例。


    ## 硬件与软件的概念


    计算机硬件由各种电子、机电和电磁设备以及连接它们的总线组成。换句话之，计算机硬件是裸机器。另一方面，软件是由一组使裸机器运行并实现目标的指令、命令、程序等组成的。如果硬件是身体，软件就是系统的灵魂。对于计算机的运行，硬件和软件都是不可或缺的。


    ## 类型


    根据软件需要执行的工作类型，它可以分为两类：系统软件和应用软件。


    ## 系统软件


    系统软件与计算机硬件紧密交互的软件。这些软件取决于底层计算机的架构。它们负责控制系统资源并执行与系统相关的活动。不同类型的系统软件包括操作系统、加载器、链接器和翻译器。


    ## 操作系统


    操作系统是作为用户与裸硬件之间接口的系统软件。目前的操作系统有 Linux、UNIX、macOS High Sierra 等。操作系统的主要功能包括：


    - 进程和处理器管理

    - 内存管理

    - 设备管理

    - 文件管理


    简单来说，操作系统管理计算机的所有资源。它将从用户处接收的所有命令解释给底层硬件。今天的操作系统配备了智能图形用户界面 (GUI)，便于操作。它们还提供了许多实用程序，如计算器、文本编辑器、扫描软件、绘图工具和图像编辑工具。


