    \ 1: PRINTING A MESSAGE\n\nConsider a very simple program given in Fig. 2.2.\n\
    \n```c\n#include <stdio.h>\nmain() {\n    /* printing begins */\n    printf(\"\
    I see, remember\\n\\n    /* printing ends */\n}\n```\n\nLO 2.2 Exemplify the elementary\
    \ C concepts through sample programs\n\n**Fig. 2.2** A program to print one line\
    \ of text\n\nThis program when executed will produce the following output:\n\n\
    > I see, remember\n\nLet us have a close look at the program. The first line informs\
    \ the system that the name of the program is **main** and the execution begins\
    \ at this line. The **main**() is a special function used by the C system to tell\
    \ the computer where the program starts. Every program must have exactly *one\
    \ main* function. We use more than one **main** function, the compiler cannot\
    \ understand which one marks the beginning of the program.\n\nThe empty pair of\
    \ parentheses immediately following **main** indicates that the function **main**\
    \ has no arguments (or parameters). The concept of arguments will be discussed\
    \ in detail later when we discuss functions in Chapter 10).\n\nThe opening brace\
