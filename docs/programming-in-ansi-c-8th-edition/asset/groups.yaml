    # # UNIX SYSTEM


    ## Creating the Program


    Once we load the UNIX operating system into the memory, the computer is ready
    to receive program. The program must be entered into a file. The file name can
    consist of letters, digits and special characters, followed by a dot and a letter
    c. Examples of valid file names are:


    ```

    hello.c

    program.c

    ebgl.c

    ```


    The file is created with the help of a text editor, either ed or vi. The command
    for calling the editor and creating the file is


    ```

    ed filename

    ```


    If the file existed before, it is loaded. If it does not yet exist, the file has
    to be created so that it is ready to receive the new program. Any corrections
    in the program are done under the editor. (The name of your system''s editor may
    be different. Check your system manual.)


    When editing is over, the file is saved on disk. It can then be referenced any
    time later by its file name. The program that is entered into the file is known
    as the source program, since it represents the original form of the program.'
