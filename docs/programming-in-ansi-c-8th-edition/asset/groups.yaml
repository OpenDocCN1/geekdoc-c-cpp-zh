    Source code is the file containing the C source program. This program is input
    to a compiler. The compiler is a system software that translates the source program
    to object code. The object code contains an equivalent set of machine instructions
    corresponding to the source program which is understood by the computer. A given
    C program may make use of several library functions. Thus, the object code of
    the program would have to be linked to the object codes of the library functions.
    The linker is a system software that links together all the object codes to generate
    the final executable code. This executable code is submitted to the operating
    system for execution whenever required. The generation of the executable code
    is shown in Fig. 2.11.'
