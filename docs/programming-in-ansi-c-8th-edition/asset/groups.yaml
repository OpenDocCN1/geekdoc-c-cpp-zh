    # WINDOWS SYSTEM


    Unlike the Linux system, the Windows system does not come with an inbuilt C compiler.
    There are several IDEs. An IDE is an integrated development environment which
    provides programmers the ways and means to write, save, compile, edit, link and
    run programs. These IDEs have to be separately installed on a Windows system to
    be used. Typical examples are Borland C/C++, Microsoft Visual Studio, Dev-C++,
    Turbo C/C++, etc. Most of these IDEs have an extremely friendly graphic user interface.
    Thus, most of the work can be done by the click of a mouse. Some of these IDEs
    also work in the DOS environment. The IDE then have to be invoked by opening the
    DOS box/command prompt. In the IDE environments, the tools offered by it would
    help us perform the required activities of compiling, linking and executing.


    # KEY CONCEPTS


    +   * #define: Is a preprocessor compiler directive. [LO 2.2]

    * printf: Is a predefined standard C function that writes the output to the stdout
    (standard output) stream. [LO 2.2]

    * scanf: Is a predefined standard C function that reads formatted input from stdin
    (standard input) stream. [LO 2.2]

    * PROGRAM: Is a sequence of instructions written to perform a specific task in
    the computer. [LO 2.4]


    # ALWAYS REMEMBER


    +   * C is a structured, high-level, machine independent language. [LO 2.1]'
  - '[PAGE 74]


    +   - ANSI C and C99 are the standardized versions of C language.


    +   - C combines the capabilities of assembly language with the features of a
    high level language.


    +   - C is robust, portable and structured programming language.


    +   - Every C program requires a main() function (Use of more than one main()
    is illegal). The place main is where the program execution begins.


    +   - The execution of a function begins at the opening brace of the function
    and ends at the corresponding closing brace.


    +   - C programs are written in lowercase letters. However, uppercase letters
    are used for symbolic names and output strings.


    +   - All the words in a program line must be separated from each other by at
    least one space, or a tab, or a punctuation mark.


    +   - Every program statement in a C language must end with a semicolon.


    +   - All variables must be declared for their types before they are used in the
    program.


    +   - A comment can be inserted almost anywhere a space can appear. Use of appropriate
    comments in proper places increases readability and understandability of the program
    and helps in debugging and testing. Remember to match the symbols /* and * appropriately.


    +   - Compiler directives such as define and include are special instructions
    to the compiler to help it compile a program. They do not end with a semicolon.


    +   - The sign # of compiler directives must appear in the first column of the
    line.


    +   - We must make sure to include header files using #include directive when
    the program refers to special names and functions that it does not define.


    +   - The structure of a C program comprises of various sections including Documentation,
    Link, Definition, Global Declaration, main () function and Sub program section.'
