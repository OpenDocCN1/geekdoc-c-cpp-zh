    # The #define Directive


    A #define is a preprocessor compiler directive and not a statement. Therefore
    #define lines should not end with a semicolon. Symbolic constants are generally
    written in uppercase so that they are easily distinguished from lowercase variable
    names. #define directives are usually placed at the beginning before the main()
    function. Symbolic constants are not declared in declaration section. Preprocessor
    directives are discussed in Chapter 15.


    We must note that the defined constants are not variables. We may not change their
    values within the program by using an assignment statement. For example, the statement


    ```

    PRINCIPAL = 10000.0;

    ```


    is illegal.


    The declaration section declares year as integer and amount, value and inrate
    as floating point numbers. Note all the floating-point variables are declared
    in one statement. They can also be declared as


    ```

    float amount;

    float value;

    float inrate;

    ```


    When two or more variables are declared in one statement, they are separated by
    a comma,


    All computations and printing are accomplished in a while loop. while is a mechanism
    for evaluating repeatedly a statement or a group of statements. In this case long
    as the value of year is less than or equal to the value of PERIOD, the four statements
    that follow while are executed. Note that these four statements are grouped by
    braces. We exit the loop when year becomes greater than PERIOD. The concept and
    types of loops are discussed in Chapter 7.


    C supports the basic four arithmetic operators (-, +, *, /) along with several
    others. They are discussed in Chapter 4.'
