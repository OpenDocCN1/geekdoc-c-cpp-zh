    \ closing “}” in the last line indicates the end of the function. In this case,\
    \ the closing brace also marks the end of the program. All the statements between\
    \ these two braces form the *function body*. The function body contains a set\
    \ of instructions to perform the given task.\n\nIn this case, the function body\
    \ contains three statements out of which only the **printf** line is an executable\
