  md: "# High-Performance Computing in Financial Systems\n\nUnder the hood, tbb::concurrent_vector\
    \ uses a combination of atomic operations and fine-grained locking to ensure safety.\
    \ When a new element is added to the vector, it uses an atomic operation to increase\
    \ the size of the vector and determine the index for the new element. If the new\
    \ element fits within the current capacity of the vector, it is added without\
    \ any locking. If the vector needs to be resized, tbb::concurrent_vector uses\
    \ a lock to ensure that only one thread performs the resize. This approach allows\
    \ tbb::concurrent_vector to provide high concurrency when adding and accessing\
    \ elements, making it excellent choice for your high-performance trading scenario\
    \ where performance is critical.\n\nIn the context of our LOS system, TBB can\
    \ have several advantages over traditional locks, seen improvements over the others\
    \ by a factor of 10, and the implementation will look like the following:\n\n\
    ```\nusing namespace array;\nclass LockFreeLimitOrderBook : public LimitOrderBook\
    \ {\nprivate:\n    tbb::concurrent_vector<Order> bids;\n    tbb::concurrent_vector<Order>\
    \ offers;\npublic:\n    LockFreeLimitOrderBook(int precision, int depth) : LimitOrderBook(precision,\
    \ depth) {\n        bids.resize(depth);\n        offers.resize(depth);\n    }\n\
    \    void add order(const Order& order, bool is_bid) override {\n        if (is_bid)\
    \ {\n            int index = price_to_index(order.price, true);\n            if\
    \ (index > -1)\n                bids[index] = order;\n        } else {\n     \
    \       int index = price_to_index(order.price, false);\n            if (index\
    \ > -1)\n                offers[index] = order;\n        }\n    }\n    Order*\
    \ get_best_bid() override {\n        return _ptr_bid_end;\n    }\n    Order* get_best_offer()\
    \ {\n        return _ptr_offer_ini;\n    }\n};\n```\n\nFigure 3.18 – Lock-free\
    \ structures\n\nCode example: https://github.com/PacktPublishing/C-High-Performance-for-Financial-Systems-/blob/main/chapter03/lockfree_limitorderbook.hpp.\n\
    \nThis implementation ensures that multiple threads can add orders and read the\
    \ best bid/offer concurrently without explicit locking, which can significantly\
    \ improve performance in a high-contention scenario."
