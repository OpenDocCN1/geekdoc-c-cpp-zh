    amount of processing time


    +   - Batch processing: Aggregate operations where possible to handle multiple
    tasks in a single execution frame, reducing the need for context switches


    Understanding the low-level behavior of context switches and their impact on system
    performance is crucial for optimizing software, in environments where process
