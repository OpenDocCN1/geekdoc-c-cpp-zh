  md: '# Factory method pattern usage


    The factory method pattern is employed in the strategy module, facilitating the
    creation of various types of orders. As you may recall, we have different types
    of strategies – low latency and non-low latency. These strategies, based on their
    specific logic and market data, generate different types of orders, such as market
    orders, limit orders, or stop orders:


    ![](img/fd18cd5346b04410d56373e6a4e6367c_88_0.png)


    Figure 2.21 – The factory method pattern


    This is where the factory method pattern comes into play. Instead of having the
    strategy class code base instantiate these types of orders directly, which could
    lead to a complex and hard-to-maintain code base, we use the factory method pattern.
    We define an interface (or an abstract class) – the “factory” – that encapsulates
    the object creation process. Then, each strategy will have a specific factory
    implementation to create the type of Order it needs.


    For instance, if a particular strategy requires the generation of a market order,
    the corresponding factory implementation will create and return a MarketOrder
    object. If another strategy demands a limit order, its factory will generate and
    return a LimitOrder object. This approach allows us to encapsulate the object
    creation process and ensure that each strategy can generate the type of orders
    it requires without affecting others.


    The advantage of using the factory method pattern in this context is the ability
    to standardize the order creation process across strategies. It promotes loose
    coupling between the strategies and the order types, making the system more flexible
    and easier to maintain. If a new order type needs to be introduced in the future,
    we can simply create a new factory for that order type and integrate it into the
    relevant strategy, without affecting the rest of the system.'
