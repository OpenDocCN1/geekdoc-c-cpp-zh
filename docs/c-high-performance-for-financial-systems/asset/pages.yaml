    low latency. However, components such as position management, which are part of
    the OMS but not latency-sensitive, can be designed as separate, scalable services.
    This allows us to achieve some level of scalability within the OMS without compromising
    on performance.


    The distributed components of our system—the messaging hub and low-latency strategies—provide
    us with scalability. The messaging hub, designed as a separate service, can be
    scaled independently to accommodate an increase in market data. This granular
    scalability enhances the overall capacity of our system and adds a level of resilience
