  md: '# Ring buffer usage


    In our trading system, the LOB uses the ring buffer pattern to distribute market
    data to the strategy module and the messaging hub. When the LOB receives new market
    data, it writes the data to the ring buffer. Meanwhile, the strategy module and
    the messaging hub continuously read from the buffer. If writing is faster than
    reading, the writer pointer might catch up to the reader pointer, signifies that
    the buffer is full. In such a case, the system could be designed to either overwrite
    old data or wait until there''s space to write new data, depending on the specific
    requirements of the system.


    As we saw, the use of a ring buffer in this scenario has multiple benefits. First,
    it helps keep the flow steady and manageable, even when there is a surge in market
    data. The second, lock-free nature of the buffer allows the LOB, strategy module
    and messaging hub to operate continuously without any costly for lock operations.
    This is particularly important in high-frequency trading where every microsecond
    counts.


    Let''s consider a scenario to illustrate this. Suppose theres a surge of market
    activity, resulting in a burst of updates to the LOB. The LOB quickly writes these
    updates to the ring buffer. Simultaneously, the strategy module is reading from
    the ring buffer, processing the data, and potentially generating orders. The messaging
    hub is also reading from the buffer and distributing the data. All of this happens
    concurrently, without any locks, thanks to the ring buffer pattern:


    ![](img/fd18cd5346b04410d56373e6a4e6367c_86_0.png)


    Figure 2.19 – The ring buffer in our system


    In conclusion, the ring buffer pattern is a powerful tool in the arsenal of our
    system''s architecture. Its efficient, lock-free design significantly contributes
    to the system''s overall performance and its ability to process high volumes of
    market data with minimal latency. As we continue to explore the other design patterns
    and techniques used in our system, we will see how they work together to create
    a high-performance, robust trading system.


    # Busy/wait usage


    In the realm of concurrent programming and high-performance systems, busy/wait
    is a technique where a process repeatedly checks to see if a condition is true,
    such whether a lock is available, or a specific piece of data has been computed.
    If the condition hasn''t been met, the process continues to wait. This is different
    from blocking, where a process cannot continue is moved out of the CPU until its
    necessary condition is satisfied.'
