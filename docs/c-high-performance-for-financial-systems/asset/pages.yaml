  md: "# Machine Learning in Financial Systems\n\n# The DRL agent\n\nThe DRL agent\
    \ is the heart of the IOR. It uses an NN, specifically a DQN, to predict Q-values\
    \ for each possible action based on the current state. These Q-values represent\
    \ the expected future reward for each action. Key components and processes include\
    \ the following:\n\n+   - Epsilon-greedy strategy: Balancing exploration and exploitation\
    \ is vital. Early in training, the agent explores more to discover good strategies.\
    \ Over time, as it gains confidence in its strategies, it exploits them more frequently.\n\
    \n+   - Experience replay: The agent stores recent experiences (state, action,\
    \ reward, next state) in its memory. By periodically sampling from this memory\
    \ to train its DQN, the agent ensures diverse and stable learning experiences.\n\
    \n+   - Training: Using its experiences from its memory, the agent computes Q-values\
    \ and trains its DQN to minimize the difference between predicted and target Q-values.\
    \ This iterative process refines the agent's strategy over:\n\n```\n```python\n\
    # hyperparameter settings\ntrain_steps = 100000\nbatch_size = 64\nlearning_rate\
    \ = 0.001\nepsilon_start = 1.0\nepsilon_end = 0.01\nepsilon_decay = 0.99995\n\
    gamma = 0.99\nn_actions = 10\n# target network setup\ntarget_model = build_model(_input_shape=state_input_shape,\
    \ n_actions)\ntarget_model.set_weights(model.get_weights())\n# main network setup\n\
    model = build_model(_input_shape=state_input_shape, n_actions)\nmodel.compile(optimizer=Adam(learning_rate=learning_rate),\
    \ loss='mse')\n# training loop\nfor step in range(train_steps):\n    state = env.reset()\n\
    \    action = epsilon_greedy(state, epsilon)\n    next_state, reward, done, _\
    \ = env.step(action)\n    memory.append((state, action, reward, next_state, done))\n\
    \    if len(memory) > batch_size:\n        batch = memory.sample(batch_size)\n\
    \        states, actions, rewards, next_states, dones = zip(*batch)\n        targets\
    \ = model.predict(states)\n        next_q = target_model.predict(next_states)\n\
    \        for i in range(batch_size):\n            if dones[i]:\n             \
    \   targets[i][actions[i]] = rewards[i]\n            else:\n                targets[i][actions[i]]\
    \ = rewards[i] + gamma * np.max(next_q[i])\n        model.fit(states, targets,\
    \ verbose=0)\n    epsilon = max(epsilon_end, epsilon * epsilon_decay)\n```\n```\n\
    \nFigure 4.16 – DRL agent class. The screenshot is for illustration. High-quality\
    \ screenshots are available for reference in the GitHub repository."
