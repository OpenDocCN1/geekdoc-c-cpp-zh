    The goals and objectives of this book are not limited to helping experienced developers
    get into the financial industry but also to teach them how to build financial
    trading systems. This includes various subjects such as market data handlers,
    exchange protocols, liquidity aggregators, OMSs, smart order routing (SOR), and
