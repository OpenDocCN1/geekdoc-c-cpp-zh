  md: '# Best practices for achieving scalability


    191


    The mechanisms range from local failovers, such as a switch to a backup server
    within the same data center, to global failovers, involving switching to a server
    in a completely different geographic location. Failover systems can be hot, warm,
    or cold, each representing the readiness of the backup system to take over. Hot
    systems are running in parallel with the primary system, warm systems are on standby
    and can be activated quickly, cold systems require a longer time to become operational.


    # Disaster recovery – Beyond immediate failover


    While failover mechanisms deal with the immediate aftermath of a system failure,
    disaster recovery is the long-term plan to restore normal operations after a catastrophic
    event. Disaster recovery is about having a documented, well-rehearsed plan in
    place that covers data recovery, system restoration, and even workspace recovery
    in the event of physical damage to a trading floor or data center.


    Disaster recovery plans involve regular backups, off-site storage, and the use
    of disaster recovery sites that can be located far from the primary site to ensure
    they are not affected by the same disaster. These sites are equipped to take over
    the full operations of the trading system, ensuring that trading can continue
    even under the most adverse conditions.


    # Embracing failure to forge resilience


    Designing for failure is a paradigm that acknowledges the inevitability of system
