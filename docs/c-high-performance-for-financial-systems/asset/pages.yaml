    \n# Lock-free structures\n\nThreading building blocks (TBBs) are a C++ library\
    \ developed by Intel that simplifies the process of leveraging multi-core processor\
    \ performance. It provides a rich and complete approach to expressing parallelism\
    \ in a C++ program, making it easier to build software that scales with available\
    \ hardware. TBB is not a threads-replacement library but a broad framework for\
    \ parallelism that includes parallel algorithms, concurrent containers, a scalable\
    \ memory allocator, a work-stealing task scheduler, and low-level synchronization\
    \ primitives.\n\nThe key component we're using from TBB is: tbb::concurrent_vector.\
    \ This is a container that allows multiple threads to concurrently access and\
    \ modify elements. It's designed to provide thread-safe operations without the\
    \ need for explicit locking.\n\nIn our implementation, we are using two tbb::concurrent_vector\
    \ instances, bids and offers, to store bid and offers respectively. When we call\
    \ the add_order function, we calculate the index for the order price and then\
    \ direct the order to the corresponding index in the bids or offers vector. Because\
    \ tbb::concurrent_vector is thread-safe, this operation can be performed concurrently\
    \ by multiple threads without causing data races or other concurrency issues.\n\
    \nThe get_best_bid() and get_best_offer functions return the best bid and offer\
    \ by directly accessing the corresponding elements in the bids and offers vectors.\
    \ Again, thanks to the thread safety of tbb::concurrent_vector, these operations\
    \ can be performed concurrently by multiple threads."
