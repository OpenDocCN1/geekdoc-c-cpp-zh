  md: '# Balanced binary search tree


    One of the data structures that can be leveraged to ensure efficient real-time
    data processing and management is the balanced binary search tree (BBST).


    A BBST is a binary tree where the height of the two subtrees of every node differs
    by more than one. This property ensures the tree remains balanced, preventing
    the worst-case scenario where the tree becomes a linear chain of nodes.


    In our context specifically, LOB maintains a list of buy and sell orders for a
    specific security or financial instrument, organized by price level. A BBST is
    a suitable data structure for implementing an LOB due to its efficient search,
    insert, and delete operations.


    In LOB, new orders are continually added, while existing orders are frequently
    canceled or deleted. Moreover, the best bid or offer is often queried. As discussed,
    these operations can be efficiently managed using a BBST, such as a red-black
    tree or an AVL tree. These structures facilitate operations in O(log n) time,
    ensuring that the LOB can be updated and queried effectively in real-time.


    It''s important to note, however, while a BBST enables the LOB to be maintained
    in a key-ordered manner this is not the same. The BBST allows for efficient binary
    search capabilities by ensuring that for any given node, all elements in its left
    subtree have lesser values... ordering is crucial for quickly identifying the
    minimum (best bid) and maximum (best offer) elements in the tree, which are pivotal
    operations in an LOB. Nevertheless, it should be clarified that this ordering
    is a result of the tree''s hierarchical structure and not an indication of linear
    sorting. The sorted appearance of elements is an outcome of the tree''s in-order
    traversal, which sequentially accesses elements according to their key order.


    In our implementation, we use the std::set container from the C++ Standard Library,
    which is typically implemented as a red-black tree. Each node in this tree represents
    an order, which is an object of the Order class containing id, price, and quantity
    attributes. The order< is overloaded in the Order class to compare the prices
    of the orders, which allows the std::set to organize its elements by not sorting
    in the traditional sense but by determining their placement in the tree structure.
    This placement ensures that when we traverse std::set, we can access the elements
    in the order of ascending prices. Similarly, a reverse-in-order traversal would
    access elements in the order of descending prices.


    The add_order function adds new orders to the LOB using the std::set container
    from the C++ Standard Library. This container efficiently manages order insertion
    and retrieval. When an order is added, if the number of existing orders is less
    than the LOB capacity, it is simply inserted. However, if std::set is at capacity
    with the new order price exceeding the highest in the set, we remove the lowest-priced
    order to accommodate the new, higher-priced one. This strategy ensures std::set
    consistently maintains the orders with the highest prices:'
