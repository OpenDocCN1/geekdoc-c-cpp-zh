  md: '# Challenges


    ML has emerged as a transformative force in financial systems, driving innovations
    in areas such as algorithmic trading, risk management, and smart order routing.
    However, while the potential of ML is vast, its deployment presents several challenges.
    From the nuances of training models on historical data to the intricacies of real-time
    prediction and production deployment, financial professionals need to navigate
    a complex landscape. This section will discover some of the key challenges faced
    when integrating ML into financial systems.


    # Differences between training models with historical data (offline) and making
    predictions in real-time


    Training ML models on historical data offers the advantage of a controlled environment.
    Engineers and data scientists can validate models, refine hyperparameters, and
    evaluate performance metrics using vast amounts of past data. However, transitioning
    from this offline training to real-time predictions introduces several:


    +   **Non-stationarity:** Financial markets are dynamic, with underlying patterns
    and relationships evolving over time. A model trained on past data might not account
    for these shifts, leading to suboptimal or erroneous predictions in real-time
    scenarios.


    +   **Latency concerns:** In real-time trading, especially in high-frequency setups,
    decision-making needs to be swift. There’s often limited time to process new data,
    run predictions, and execute trades. Any delay can result in missed opportunities
    or increased costs.


    +   ** freshness:** Unlike historical data, which is static, real-time data streams
    can have missing values, outliers, or noise. Ensuring data quality and consistency
    in real-time is more challenging than in offline setups.


    +   **Feedback loops:** In live environments, the predictions or actions of a
    model can influence future data. For instance, a trading model''s actions could
    affect market prices. This creates feedback loops, where the model''s decisions
    shape the very data it''s trained on – a scenario seldom encountered in offline
    training.'
