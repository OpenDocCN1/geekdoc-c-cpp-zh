- img_proc: true
  md: 'Busy/wait might sound counterintuitive or inefficient at first. After all,
    why would a process spend CPU cycles just waiting for a condition to be true?
    However, in certain high-performance, low-latency systems such as our trading
    system, busy/wait can be an advantageous technique.


    The crux of the matter lies in the trade-off between latency and CPU utilization.
    In a system like ours, where latency is the critical factor, busy/wait can provide
    the best possible performance.


    In the context of our trading system, busy/wait is employed within the low-latency
    strategies in the strategy module. The strategies continuously monitor market
    data from the LOB through a ring buffer. Rather than being event-driven and reacting
    to incoming data, the strategies actively poll or “busy wait” for new data to
    appear in the ring buffer.


    The LOB updates the ring buffer with market data updates, and the strategy module
    is continually checking – or busy waiting – for these updates. When new data arrives
    in the ring buffer, the strategy module can immediately process it and potentially
    generate orders, which are then sent to the OMS for execution. This direct polling
    mechanism ensures that the strategies are responsive as possible to changes in
    the market data.


    The busy/wait technique in our system should be applied with careful consideration
    of the underlying hardware and system configurations. In particular, the system
    should employ CPU pinning, which assigns a specific CPU core to a specific process
    or thread. Without CPU pinning, the busy/wait technique may not deliver the desired
    low-latency benefits.


    Therefore, while employing busy/wait in our system, it’s vital to implement CPU
    pinning. This combination ensures that our system can maintain the desired latency,
    and react swiftly to the updates in our market data:


    ![](img/fd18cd5346b04410d56373e6a4e6367c_87_0.png)


    Figure 2.20 – The ring buffer in our system


    It is a crucial technique in our trading system that, when combined with CPU pinning,
    helps achieve the low latency necessary for high-frequency trading. As we continue
    to examine the design and techniques in our trading system, we will see how they
    interplay to create a high-performance, efficient trading platform.'
