    data

    structures, which we will discuss in a later section.


    Next, let''s discuss what strategies we can apply to these situations.


    # Concurrent readers/writers


    C++ provides robust support for multi-threading and synchronization through its
    Standard Library.

    One of the key features is the ability to create concurrent readers and writers
    using synchronization

    primitives such as std::shared_mutex and std::shared_lock.


    In a typical scenario, a mutex (short for "mutual exclusion") is used to protect
    data from being

    sultaneously accessed by multiple threads. However, a standard mutex does not
    distinguish between

    reading and writing operations, which can lead to unnecessary blocking. For example,
    multiple threads

    can read shared data concurrently, but a standard mutex would still block them.


    This is where std::shared_mutex comes into play. It allows multiple threads to
    read shared

    data concurrently but only one to write at a time, providing more fine-grained
    control over

    synchronization. This is particularly beneficial in our scenario where the LOB
    is frequently read by

    the Strategy Data Risk Management modules and updated at a different frequency
    by the

    Market Data module (not necessarily faster or slower).


    By using std::shared_mutex, we can allow multiple threads to read the LOB concurrently,

    improving the overall system performance. However, when the Market Data module
    needs to

    update the LOB, it can lock the std::shared_mutex for writing, blocking other
    threads from

    reading or writing until the update is complete.


    While std::shared_mutex enables multiple concurrent readers, reducing contention
    compared

    to exclusive locks, it does not eliminate contention entirely. Write operations
    still require exclusive

    access, leading to potential wait times for other operations. This mechanism,
    while improving

    read efficiency, highlights a trade-off between read optimization and potential
    write contention in

    high-frequency environments.'
