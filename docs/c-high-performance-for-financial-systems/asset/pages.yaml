  md: 'When using multicast in financial trading systems, it is important to consider
    several metrics to ensure optimal performance. One key metric is multicast latency,
    which is the time it takes for a market data feed to reach all the clients in
    the multicast group. Other metrics include the packet loss rate, which measures
    the percentage of packets lost during transmission, and the jitter, which measures
    the variation in delay of packet delivery.


    Multicasting is widely used in financial trading systems for the dissemination
    of market data. This is very important to know it because it will help us design
    our systems further. Exchanges and venues typically multicast their market feeds
    to clients, who are connected to their network via low-latency switches and NICs.
    By using multicast, exchanges can deliver market data to a large number of clients
    with minimal delay and without overloading the network.


    One example of a financial trading system that uses multicast is the NASDAQ ITCH
    protocol. ITCH is a binary protocol that''s used for the dissemination of real-time
    market data for NASDAQ-listed securities. The protocol is multicast on a specific
    IP address and port, and clients can subscribe to the multicast group to receive
    the data. The use of multicast allows NASDAQ to deliver market data to a large
    number of clients in real-time with minimal delay.


    ITCH is a binary protocol that''s used by exchanges to stream real-time market
    data to market participants. It is a highly efficient protocol that is specifically
    designed to provide low-latency data transmission, making it an ideal choice for
    high-frequency trading systems.


    The ITCH protocol operates at the data link layer of the OSI model and is based
    on UDP for its transport. UDP is a protocol that does not guarantee packet delivery
    or sequence but is optimized for low latency and high throughput. This makes it
    an ideal choice for market delivery as it allows market data to be disseminated
    quickly to clients without the overhead of TCP.


    One of the key challenges in handling incoming ITCH messages is processing the
    large volume of data that can be generated by the exchanges. To handle this volume
    of data, designers must manage their software architecture to minimize latency
    and ensure that their systems can be scaled as volumes increase. This includes
    using high-performance networking equipment, such as NICs and switches, that are
    capable of handling the high volume of data generated by high-frequency trading
    systems.


    ITCH uses binary encoding to reduce the size of the data being transmitted, and
    some of its characteristics are as follows:


    +   **Message-based architecture**: ITCH is inherently message-driven. Each message
    is encoded in binary for efficiency, and the type of each message is identified
    by its message type field. This makes the protocol compact and fast, tailored
    for real-time applications.


    +   **Order building**: One of the primary objectives of ITCH is to facilitate
    the construction of the order book. As such, it provides messages detailing events
    such as additions, modifications, and deletions of orders. By processing these
    messages sequentially, a system can reconstruct the state of the order book at
    any point in time.'
