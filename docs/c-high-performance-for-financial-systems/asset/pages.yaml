    # Design patterns and their application in our system


    Software design patterns are fundamental to crafting robust, efficient, and scalable
    software systems. They provide a reusable solution to common problems that occur
    during software design. These patterns aren’t complex in themselves but are more
    akin to templates, providing a way to structure code to address a particular concern.
    When developing a low-latency trading system as ours, it is crucial to select
    design patterns that minimize latency, maximize throughput, and ensure data integrity.


    The beauty of design patterns lies in their proven record and the common language
    they offer to developers. Instead of describing the specifics of the entire design,
    developers can use the pattern’s name to abstract the overall idea behind a design.
    This section will delve into the software design patterns that underpin our trading
    system, how they fit into the grand scheme of things, and why they are an integral
    part of our low latency system.


    # Messaging hub as publisher/subscriber


    This pattern is particularly relevant to our trading system’s messaging hub. The
    messaging hub adopts the role of the publisher. It is responsible for distributing
    market data, which it receives from the LOB via a ring buffer. However, the LOB’s
    primary concern is achieving the lowest latency possible, so it doesn’t handle
    subscriber management. This responsibility falls to the messaging hub, making
    it an ideal place for implementing the publisher/subscriber pattern.


    The subscribers in this setup are the non-latency strategies and the OMS, RMS,
    and the historical database module. Unlike the low-latency strategies that continuously
    poll data from the LOB using busy/wait, these non-latency modules operate on an
    event-based model. They subscribe to the messaging hub and receive updates whenever
    new market data is available. This approach allows modules to stay updated with
    the latest market data without the need for continuous polling, which might not
    be as critical for their operation as it is for the low-latency strategies.'
