    # OMS


    Another key component is the module that will handle all the orders that are sent
    and receive updates on their statuses during the trading operation. The OMS is
    a component''s used by financial institutions and brokers to manage and execute
    securities trades. It is responsible for managing the life cycle of an order,
    from order entry to execution, and keeping track of relevant information such
    as order status, position, and risk exposure.


    It is a critical component of a trading system that maintains the state of order
    executions, including all open orders for a particular security. The OMS must
    keep track of the order status as the exchange sends updates, from the moment
    the order is sent, to the exchange''s acknowledgment, followed by an acceptance
    or rejection, depending on the order value and market conditions. If accepted,
    the exchange will keep sending updates regarding whether the order is being filled
    or partially filled.


    It is essential to keep all orders'' statuses updated inside the OMS so that other
    modules can be aware of what is happening with each order. The OMS also typically
    includes a graphical user interface (GUI) that allows users to monitor their orders''
    status at a glance.


    Keep in mind that in our design, this module will have two inputs: the market
    data and the order updates coming from the exchange. We will differentiate these
    two inputs between real-time (non-latency sensitive) for the market data and ultra-low
    latency input for order updates. This is an important distinction to make so that
    we can avoid overhead over the market data.'
