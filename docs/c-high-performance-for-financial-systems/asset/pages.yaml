  md: '# Challenges in translating research findings into production-ready code


    Integrating novel ML techniques or algorithms discovered in research into production
    systems seldom straightforward. Several challenges arise in this translation:


    +   - Optimization for speed: Research code is often written with a focus on flexibility
    and experimentation, rather than speed. In a production environment, especially
    in finance where milliseconds matter, the code needs to be highly optimized to
    reduce latency.

    - Robustness: While research models might work well under specific conditions
    or datasets, they need to be robust to a variety of scenarios in a live environment.
    This includes handling edge cases, anomalies, or unexpected inputs gracefully.

    - Integration with existing systems: Financial systems are intricate, with multiple
    components interfacing with each other. Newly developed ML models need to seamlessly
    integrate with these systems, which may be built using different technologies
    or architectures.

    - Scalability: A model that performs well on a small dataset might struggle when
    deployed in a live environment with massive data streams. Ensuring that ML scales
    effectively is critical.

    - Maintainability: Research code might not adhere to the best coding practices
    or standards. In production, the code needs to be maintainable, modular, and well
    documented, allowing other engineers to understand, modify, or extend it.

    - Continuous learning and adaptation: Financial models may need to be updated
    frequently to reflect the latest market conditions. Building infrastructure for
    continuous learning, where models are periodically retrained or fine-tuned, becomes
    essential.


    # Limitations in ML based on our use case


    In the context of the IOR and other financial systems, such as an RMS or a PO
    system, ML brings undeniable advantages. However, it is essential to understand
    its limitations:


    +   - Model interpretability: DL models, such as the DQNs in the IOR, can be “black
    boxes,” making it challenging to interpret their decisions. In the finance domain,
    accountability is crucial, this lack of transparency can be a significant concern.

    - Overfitting to historical data: While IOR trains on historical data to learn
    optimal routing decisions, there’s a risk of overfitting, where the model becomes
    too tailored to past events and fails to generalize to new, unforeseen market
    conditions.'
