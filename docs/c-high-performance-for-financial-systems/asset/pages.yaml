  md: '# Understanding the components of a financial trading system and their interdependence


    One important concept in market data processing is the use of a limit order book
    (LOB). A LOB is a record of outstanding orders to buy or sell a security at a
    specified price. As the primary data structure, it aggregates and processes order
    flow streaming from numerous exchanges, offering an instantaneous snapshot of
    market data and the intricate balance of supply-demand dynamics for the security
    in question.


    Ensuring optimal performance when managing and processing the LOB is paramount;
    any latency or inefficiency can compromise the fidelity of market representation,
    thereby skewing trading strategies based on real-time data.


    The LOB is maintained by the exchange and contains all the information necessary
    to execute trades, including the quantity and price of each order. Everything
    your system does be around this data structure in your entire system: the LOB.


    When a new order is placed, it is added to the order book in the appropriate location
    based on its price and time priority. Similarly, when an order is canceled or
    executed, the corresponding entry is removed from the order book. To keep the
    order book up-to-date, the trading system must continuously consume the market
    data feed and process the incoming messages. This is typically done by a market
    adapter or consumer, which receives the parsed market data from the FIX engine
    or ITCH and updates the order book accordingly:


    # A LIMIT ORDER BOOK


    | SELL LIMITS | |

    |---||

    | $ 100.03 | 360 |

    | $ 100.02 | 390 |

    | $ 100.01 | 200 |

    | $ 100.00 | 175 ← BEST OFFER |

    | $ 99.99 | 80 ← BEST BID |

    | $ 99.98 | 175 |

    | $ 99.97 | 220 |

    | $ 99.96 | 500 |

    | BUY LIMITS |


    Figure 2.3 – LOB dynamic'
