- img_proc: true
  md: 'Another significant advantage is the consistency and control it. With this
    pattern, we can ensure that every Order object in the system is correctly instantiated
    and fully compliant with the required interface. It provides a single point of
    control if specific actions or logging need to be performed every time an Order
    object is created.


    This pattern is a critical design tool in our high-frequency trading system. It
    provides the necessary flexibility and control in the order creation process,
    making the system more robust and maintainable. By decoupling the strategies from
    specific order types, we can ensure the system can easily adapt to new requirements
    or changes in the trading strategies.


    # Decorator pattern usage


    In our high-frequency trading system, the decorator pattern is employed in the
    OMS to validate orders before they are sent for execution. As you recall, the
    OMS has the critical responsibility of managing the life cycle of orders. It receives
    orders from strategies, sends them to the EMS for execution, and updates the status
    of orders based on responses from exchanges.


    One of the OMS''s essential tasks is to validate the orders before sending them
    for execution. This validation could include checks to ensure the order details
    are correct and that the order is compliant with any applicable regulations or
    risk guidelines. This is where the Decorator pattern comes into play:


    ![](img/fd18cd5346b04410d56373e6a4e6367c_89_0.png)


    Figure 2.22 – The decorator pattern


    We create a base Order class that contains the basic order functionality. Then,
    we create a ValidatedOrder class that acts as a decorator for the Order class.
    This decorator class takes an Order object as input and adds validation functionality
    to it.'
