  md: '# System Design and Architecture


    Separating the real-time data from the less sensitive latency modules can help
    improve the overall performance of the system. In this section, we will explore
    how to design real-time distribution and non-latency-sensitive modules to achieve
    high performance.


    The goal is to decouple the system from the real-time needs – or as we used to
    call it, the hot path so that we can feed less latency-sensitive modules without
    interfering in that hot path. The real-time data will reconstruct the LOB, which
    will be the source of data for the entire system. The data inside this structure
    is the hot path for the strategies. We can channel an additional module – the
    hub – to be the publisher for all non-latency-sensitive modules.


    To achieve this, we can use messaging systems such as ZeroMQ. These messaging
    systems provide a decoupling layer that can separate the real-time data from the
    less sensitive latency modules. The hub can be set up as a publisher that receives
    real-time data from LOB and publishes it to the messaging system. The non-latency-sensitive
    modules can then subscribe to the messaging system to receive the data.


    The impact on the hot path is minimal because the hub is responsible for publishing
    the data to the messaging system, and the hot path is only responsible for reconstructing
    the LOB. The hub can be designed to handle the message publishing process with
    minimal latency and a minimal impact on the hot path.


    So, for the non-latency-sensitive modules, we are going to choose a design pattern;
    here we will choose the publish-subscribe pattern. This pattern allows the hub
    to function as a publisher and distribute the real-time data to multiple subscribers:


    # TRADING SYSTEM


    ![](img/fd18cd5346b04410d56373e6a4e6367c_58_0.png)


    Figure 2.7 - The blocks of our trading system


    In this way, each module can subscribe to the specific data it needs, and the
    hub will publish the market data accordingly. This decouples the hot path from
    the rest of the system, ensuring that it does not get bogged down with the load
    of serving data to multiple modules.'
