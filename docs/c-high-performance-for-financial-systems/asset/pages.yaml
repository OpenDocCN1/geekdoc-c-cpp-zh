  md: '# System Design and Architecture


    +   **Tag-value encoding:** At its core, FIX uses a simple tag-value encoding
    scheme. Messages are composed of a series of fields, where each field is represented
    by a tag number, an equals sign, and a value. For example, 55=MSFT signifies that
    the tag (55) is for Microsoft.


    +   **Message structure:** Each FIX message begins with a standard header, followed
    by the message body, and concludes with a standard trailer. The header contains
    crucial fields such as `BeginString` (FIX version), `SenderCompID`, `TargetCompID`,
    and `MsgType`.


    +   **Message types:** FIX defines various message types to facilitate different
    trading activities. range from administrative messages such as Heartbeat (D) and
    Test Request (1) to application messages as New Order – Single (D) and Execution
    Report (8).


    +   **Performance optimizations:** Given the low-latency requirements of modern
    trading systems, there are adaptations of FIX, such as `Simple Binary Encoding`
    (SBE) and the FAST protocol, which aim to reduce the message size and parsing
    overhead.


    As a software architect designing trading systems, it is essential to consider
    the use of FIX and any of these protocols for communicating with other market
    participants. This involves designing a FIX engine that can handle incoming and
    outgoing messages, and ensuring that the module is scalable, reliable, and efficient.


