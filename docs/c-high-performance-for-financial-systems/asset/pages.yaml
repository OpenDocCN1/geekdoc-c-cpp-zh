    # Choosing the right data structure


    An LOB is a critical component of modern financial systems. It is a record of
    outstanding orders for a particular security, organized by the price level. The
    LOB plays a vital role in maintaining market liquidity and facilitating the matching
    of buy and sell orders. However, maintaining an efficient LOB is a challenging
    task due to the high-frequency updates, multiple concurrent readers, and the need
    for low latency.


    The choice of data structure for implementing an LOB can significantly impact
    its efficiency and performance. Different data structures have different strengths
    and weaknesses, and the choice of data structure can affect the Big O notation
    of the algorithms involved. For example, a vector, which is a simple and commonly
    used data structure, has an O(1) complexity for accessing elements but an O(n)
    complexity for inserting or deleting elements. Other data structures, such as
    lists, hashes, trees, have their own trade-offs, and we will explore these in
    detail throughout this chapter.


    Moreover, in high-performance trading systems, where LOBs are updated at a rapid
    pace, contention becomes a critical issue. Contention occurs when multiple threads
    access to or modify the same data simultaneously, leading to conflicts and performance
    degradation. To mitigate this, we need to consider nonblocking data structures
    that allow concurrent access without locking.


    In the context of our system architecture, the LOB will be accessed by several
    modules. For instance, the market data module will be responsible for updating
    the LOB with new orders, cancellations, and modifications. On the other hand,
    the strategy module will need constant access to the top of the book to make trading
    decisions, while the risk management module may need to access the entire depth
    of the book to assess market liquidity. Therefore, the choice of data structure
    for the LOB will have a significant impact on the overall system performance.


    We will discuss various data structures that can be utilized for implementing
    a limit order book (LOB), examine their respective advantages and disadvantages,
    and provide C++ code to illustrate these concepts. In the context of high-performance
    computing, particularly with the challenges of high-frequency updates and managing
    multiple concurrent readers, the selection of an appropriate data structure is
    crucial. The efficiency and performance of the LOB are heavily influenced by this
    choice.


    In our exploration, we will traverse from the least performant to the most efficient
    data structures, analyzing their impact on the LOB’s overall efficiency and the
    Big O notation of the algorithms involved. This approach will offer a comprehensive
    understanding of why certain data structures are more suited to high-frequency
    financial environments.


    Let’s dive deep into the technical specifics of these data structures, beginning
    with the basic models and gradually progressing to the most optimal choices for
    our scenario.'
