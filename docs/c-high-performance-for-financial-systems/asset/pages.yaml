    - **Monitoring system architecture:** Design a distributed monitoring system that
    can handle the scale of data generated by the trading system. This should be capable
    of processing large streams of data in real-time, offering both aggregated and
    detailed views of system performance.

    - **Thresholds and alerts:** Define the thresholds for key performance indicators.
    If these thresholds are crossed, the system should trigger alerts. For example,
    if the latency of order processing exceeds a predefined limit, it would trigger
    an alert, indicating a potential issue that needs immediate attention.

