    Figure 3.24 – perf command line


    The output of perf report will show you a list of functions in your program, sorted
    by the amount of CPU time consumed. This can help you identify functions that
    are potential bottlenecks.


    perf report reads from a file named perf.data in the current directory by default,
    which is the output file generated by perf record. It generates a report that
    shows the functions most of the CPU time, sorted by the percentage of CPU time
    consumed:


    | Overhead | Command | Shared Object | Symbol |

    |---|---|---|--|

    | 60.00% | my_program | libmylib.so.1 | [ ] my_function |

    | 20.00% | my_program | libanotherlib.so | [ ] another_function |

    | 10.00% | my_program | my_program | [ ] main |

    | 10.00% | my_program | libc-2.27.so | [ ] _libc_start_main |


    Figure 3.25 – perf output report


    In this example, the following can be:


    +   - The Overhead column shows the percentage of CPU time consumed by each function.
    In this case, my_function consumed 60% of the CPU time.

    - The Command column shows the name of the process that was running. In this case,
    it''s my_program.

    - The Shared Object column shows the library or executable in which the function
    resides. For example, my_function resides in libmylib.so.1.

    - The Symbol column shows the name of the function that was consuming CPU time.
    If the function name is not available, it will show the memory address of that
    function instead.


    You can navigate through the report using the arrow keys, and you can press Enter
    to see more detailed information about a particular function. Press h to get help
    on more commands and options you can use within perf report.'
