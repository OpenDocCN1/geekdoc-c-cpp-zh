  md: '# System Design and Architecture


    With the LOB, your trading system will know what the best price for certain security
    is and the best amount you can buy or sell on the phone. Many researchers use
    historical change on the LOB to find patterns, it is also a good idea that your
    system stores historical information about this.


    However, handling a LOB can be a challenge due to its size and frequent updates.
    The LOB can have millions of orders, and each update can result in a complete
    rewrite of the book. This can create a significant amount of overhead and impact
    system performance if not designed correctly. To address these challenges, trading
    systems often make use of high-performance data structures such as lockfree queues
    and optimized hash tables. Additionally, techniques such as batching and pipelining
    can be used to minimize latency and maximize throughput.


    In addition to consuming the market data efficiently, it is important to normalize
    the data. Market data normalization is the process of transforming data from different
    exchanges to a standardized format. This is important because exchanges can use
    different data formats and structures, which can make it challenging to integrate
    the data into a single system.


    The normalization process typically involves mapping the data from different exchanges
    to a common format, which allows for easy integration and analysis. So, the data
    handler must pass through the normalization process, something that all incoming
    data will do. Overall, the processing and normalization of market data is a critical
    component of any high-performance trading system. By carefully designing the market
    handlers and using optimized data structures and algorithms, trading systems can
    achieve low latency and high throughput while maintaining accuracy and consistency
    in the order book.


    After we have the market data inside our system, well parsed, and up to date within
    the LOB structure, we need to think about its distribution within other modules
    in the system. Pretty much all modules need to have access to the market data
    at some point, so distribution is key.


    We want to divide this into two parts: real-time distribution and others (non-critical
    modules, batches, storage, and so on).


    # Real-time distribution


    For real-time distribution, we can use several models and design patterns to handle
    data throughout a system. Here, we will navigate patterns that we are interested
    in for real-time, low-latency market data processing. We will go from the least
    appropriate to the most likely. Keep in mind that this will be different when
    approaching non-latency-sensitive data processing.


    # Observer design pattern


    One of the most used for these situations is the observer design pattern. This
    pattern can be used to provide a solution for real-time distribution of market
    data to multiple strategies running simultaneously. This pattern maintains a list
    of dependents, or observers, and automatically notifies them of any changes. In
    the case of trading systems, the subject could be the market data feed and the
    observers could be the trading strategies:'
  merge: -1
  pgno: 52
- img_proc: true
  md: '![](img/fd18cd5346b04410d56373e6a4e6367c_53_0.png)


    Figure 2.4 – Observer design pattern diagram


    However, sequentially processing each strategy in response to notifications from
    the subject can result in a delay in the execution of the strategies, which is
    unacceptable for high-frequency trading systems where low latency is critical.


    To address this, modifications to the observer design pattern can be made to allow
    for parallel processing of multiple strategies. One approach is to use the *publish-subscribe
    pattern*, which is a variation of the observer design pattern that allows for
    efficient and parallel distribution of events to multiple subscribers. In the
    publish-subscribe pattern, the subject (publisher) broadcasts events or messages
    to multiple subscribers (observers) without requiring knowledge of or direct communication
    with each subscriber. Instead, subscribers indicate their interest in a particular
    type of event or message by subscribing to a topic or channel, and the publisher
    simply sends events and messages to that topic or channel.


    This approach allows for multiple strategies to receive market data updates in
    parallel, improving the overall throughput and reducing latency. Additionally,
    it provides a more scalable and flexible solution for distributing market data
    to multiple consumers.


    When implementing the publish-subscribe pattern, it is important to consider the
    system''s architecture and choose the appropriate technology and messaging protocols.
    For example, using a high-performance messaging middleware, such as Apache Kafka
    or ZeroMQ, can help optimize the message delivery process and reduce latency.'
