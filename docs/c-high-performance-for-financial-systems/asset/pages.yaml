  md: '# Understanding the components of a financial trading system and their interdependence


    +   - **Timestamps**: Every message in ITCH is stamped with a timestamp to ensure
    data integrity and order. This allows to accurately reconstruct the sequence of
    market events.


    +   - **Trade messages**: Apart from order book messages, ITCH also conveys trade
    messages that detail executed trades, indicating not only the trade''s price and
