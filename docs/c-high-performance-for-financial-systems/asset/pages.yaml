    # The chosen one – Circular array


    The final data structure we will discuss is the circular buffer with a fixed array.
    This data structure is the most efficient among the ones we have discussed and
    the chosen one for our implementation due to its superior performance.


    A circular buffer, also known as a cyclic buffer or ring buffer, is a data structure
    that uses a single, fixed-size buffer as it were connected end-to-end. This structure
    is a type of queue that uses a fixed-size array and two pointers to keep track
    of the start and end. When the end of the buffer is reached, the next element
    to be read or written is at the beginning of the array, forming a virtual circle
    or ring.


    The circular buffer is especially advantageous in scenarios where data is produced
    and consumed at varying rates. While it provides constant time O (1) insertions
    and deletions at both ends, similar to a deque, it stands out to other structures,
    like dynamic arrays, which typically don''t offer constant time for both operations.
    For linked lists, where insertions at known points are O (1), finding the insertion
    point in a sorted list is O(n), differentiating the circular buffer''s efficiency
    in certain scenarios.


    In the context of an LBO, a circular buffer can be particularly beneficial. A
    limit order book is a record of outstanding orders for a security, which is organized
    by price level. The highest bid and the lowest are represented at the top of the
    book, which are the best available prices for traders who wish to sell or buy
    the security, respectively.


    However, one of the challenges of using an array is maintaining the sorted order
    of the limit order book as orders are added or removed. To handle this, we use
    a technique to map the price level to its actual position in the circular array.
    This involves maintaining an index that keeps track of the order of elements in
    the array. When an order is added or removed, instead of shifting all the elements
    in the array, we simply update the index. This allows us to perform add and remove
    operations in constant time (O (1 ))'
