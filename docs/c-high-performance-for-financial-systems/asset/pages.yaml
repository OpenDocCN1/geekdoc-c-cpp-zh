  md: '# Activity diagrams


    Activity diagrams are a type of UML diagram that visually represents the flow
    of control or object flow within a system. They are particularly useful for modeling
    business processes, workflows, or complex algorithms like those found in an algorithmic
    trading system.


    In the context of our algorithmic trading system, an activity diagram helps illustrate
    the diverse activities undertaken by the system, the order in which they occur,
    and how they interrelate. This includes activities such as receiving and processing
    market data, triggering and executing orders, managing risk, and storing data,
    among others.


    This diagram aids in understanding the system''s behavior, highlighting parallel
    processes, and identifying potential areas for improvement or optimization. By
    studying the activity diagram, you can gain insights into how the system operates,
    making it an invaluable tool for both developers and stakeholders.


    Let''s look at what activities occur:


    +   **Receive market data**: This is the starting point of the process and is
    where the market data feed module receives real-time messages from various exchanges.
    These messages are typically in FIX or ITCH format, standardized formats for transmitting
    financial data.

    **Parse market data**: This activity occurs within the market data feed module.
    The incoming messages, often in FIX format, are parsed by the FIX engine into
    a format that can be understood by our system, extracting the required information,
    such as price, volume, and other trade details.

    **Normalize market data**: Still within the market data feed module after the
    FIX engine parses the incoming messages, the data is sent to a sub-module for
    normalization. This step ensures that market data from different exchanges is
    brought to a common format, facilitating uniform processing downstream.

    **Update LOB**: The normalized data is then channeled to the LOB. Here, updates
    are made based on the incoming. These could be new orders (insertions), cancellations
    (deletions), or modifications to existing orders.

    **Distribute market data**: The LOB then distributes the updated data to the strategies
    module and the messaging hub. To achieve the lowest latency possible, this process
    typically employs techniques such as ring buffer design and busy/wait, ensuring
    that the data is processed as quickly as it arrives.'
