  md: '# Understanding the components of a financial trading system and their interdependence


    First, let''s take a look at how market data is typically distributed by exchanges
    and venues. In most cases, market data is delivered in real-time through a data
    feed, which can take a variety of forms depending on the exchange or venue in.
    Some exchanges, for example, may provide market data through a proprietary protocol,
    while others use more standardized protocols as Financial Information eChange
    (FIX) or Intelligent Trading Control Hub (ITCH). These two are widely used protocols
    for exchanging market data and trade information in financial trading systems.
    FIX was developed in the early 1990s as a messaging protocol for communication
    between different parties in financial trading, including brokers, exchanges,
    and institutional investors. ITCH, on the other hand, is a proprietary protocol
    used by the Nasdaq exchange to distribute real-time quote and trade data.


    One important consideration when designing systems to consume market data is the
    volume and velocity of the data being produced. In high-frequency trading environments,
    market data can be generated at a rate of thousands or even millions of updates
    per second. As a result, system designers need to ensure that their systems are
    capable of handling this level of data throughput, without introducing any levels
    of latency or other performance issues.


    To achieve this, the first step is to be co-located.


    Some exchanges and venues offer co-location services, which allow traders to physically
    locate their trading systems close to the exchange''s data center, thereby reducing
    the amount of network latency involved in receiving and processing market data.
    In addition to physical proximity, exchanges also offer high-speed networking
    solutions to their colocation clients. For example, the CME offers a highspeed
    fiber optic network between their matching engine and their colocation data centers,
    which can provide sub-millisecond latency. This high-speed network allows traders
    to quickly transmit orders and receive market data updates, further reducing latency
    and improving system performance:


    ![](img/fd18cd5346b04410d56373e6a4e6367c_45_0.png)


    Figure 2.1 – How exchanges work (simplified version)'
