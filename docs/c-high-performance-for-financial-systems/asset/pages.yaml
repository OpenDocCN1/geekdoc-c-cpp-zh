  md: '# The training loop


    The primary training loop runs for the number of episodes specified in total_episodes.
    For each episode, the following happens:


    +   - Environment reset: At the beginning of each episode, the simulated environment
    is reset to its initial state.

    - Episode initialization: A variable, episode_reward, is initialized to zero.
    This variable will accumulate the rewards obtained during the episode, giving
    insight into the agent''s performance.

    - Action decision: The agent decides on an action using the epsilon-greedy strategy.
    If a randomly generated number is below the current exploration rate (epsilon),
    the agent explores by choosing a random action. Otherwise, it exploits its current
    knowledge by selecting the action predicted to yield the highest Q-value.

    - Action execution: The chosen action is executed in the simulated environment.
    In response, the environment provides the agent with a reward and the resulting
    state.

    - State update: The agent updates its internal state based on the environment''s
    feedback. It then stores the experience (state, action, reward, memory) in replay
    memory for future learning.

    - Periodic training: If the episode number is a multiple of the training_interval
    parameter, the agent samples a batch of experiences from its replay memory and
    trains its DQN.

    - Exploration rate update: After each episode, the exploration rate (epsilon)
    decays by the specified decay rate, ensuring a gradual transition from exploration
    to exploitation.

    - Logging: The total reward obtained during the episode (episode_reward) is output,
    providing a real-time update on the agent''s performance.


    At the end of all episodes, the main() function concludes, signaling the completion
    of the training process. By this point, the DRL agent (IOR) has undergone extensive
    training and has refined its routing strategy based on its interactions with the
    simulated environment.


    This function encapsulates the entire training process, bringing together the
    various components of the IQR system to achieve optimal routing decisions through
    DRL.


