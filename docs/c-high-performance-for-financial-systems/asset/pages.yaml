    # Linked list


    A linked list is a linear data structure where each element is a separate object.
    Each element (we will call it a node) of a list comprises two items: the data
    and a reference to the next node. The last node has a reference to null. The entry
    point into a linked list is called the head of the list. It should be noted that
    the head is not a separate node but the reference to the first node. If the linked
    list is empty, then the value of the head is null.


    In the context of an LOB, a linked list can be a suitable choice for maintaining
    a list of orders. The linked list allows for efficient insertion and deletion
    of orders, which are common operations in an LOB. However, finding the best bid
