  \ 条件 1 为真，条件 2 为假 | i++ | i=1, j=4, pivot=30 |\n\n表 13.1：变量的初始值、执行的操作以及根据测试条件得到的最终值\n\
  \n上一个步骤后，数组看起来如图 13.6：\n\n![](img/Figure_13.6.png)\n\n图 13.6：第一步后的数组\n\n参考表 13.2：\n\
  \n| 初始值 | 测试条件 | 动作 | 变量值 |\n| :--- | :--- | :--- | :--- |\n| i=1, j=4, A[i]=50,\
  \ A[j]=20, pivot=30 | 1. 50<=30 && 1<4 2. 20>30 | 两个条件均为假 | 交换 A 中的 i(th)和 j(th)元素如(i<j)\
  \ | i=1, j=4, pivot=30 |\n\n表 13.2：变量的初始值、执行的操作以及根据测试条件得到的最终值\n\n上一个步骤后，数组看起来如图\
  \ 13.7：\n\n![](img/Figure_13.7.png)\n\n图 13.7：第二步后的数组\n\n参考表 13.3：\n\n| 初始值 | 测试条件\
  \ | 动作 | 变量值 |\n| :--- | :--- | :--- | :--- |\n| i=1, j=4, A[i]=20, A[j]=50, pivot=30\
  \ | 1. 20<=30 && 1<4 2. 50>30 | 两个条件均为真 | i++j-- | i=2, j=3, pivot=30 |\n\n表 13.3：变量的初始值、执行的操作以及根据测试条件得到的最终值\n\
  \n上一个步骤后，数组看起来如图 13.8：\n\n![](img/Figure_13.8.png)\n\n图 13.8：第三步后的数组\n\n参考表 13.4：\n\
  \n| 初始值 | 测试条件 | 动作 | 变量值 |\n| :--- | :--- | :--- | :--- |\n| i=2, j=3, A[i]=10,\
  \ A[j]=40, pivot=30 | 1. 10<=30 && 2<4 2. 40>30 | 两个条件均为真 | i++j-- | i=3, j=2, pivot=30\
  \ |\n\n表 13.4：变量的初始值、执行的操作以及根据测试条件得到的最终值\n\n上一个步骤后，数组看起来如图 13.9：\n\n![](img/Figure_13.9.png)\n\
  \n图 13.9：第四步后的数组\n\n参考表 13.5：\n\n| 初始值 | 测试条件 | 动作 | 变量值 |\n| :--- | :--- | :---\
  \ | :--- |\n| i=3, j=2, A[i]=40, A[j]=10, pivot=30 | 1. 40<=30 && 3<4 2. 10>30 |\
  \ 两个条件均为假 | 交换 A[Pivot]与 j(th)元素 | i=3, j=2, pivot=10 |\n\n表 13.5：变量的初始值、执行的操作以及根据测试条件得到的最终值\n\
  \n上一个步骤后，数组看起来如图 13.10：\n\n![](img/Figure_13.10.png)\n\n图 13.10：第五步后的数组\n\n图 13.10\
  \ 在逻辑上被分为两半，如图 13.11 所示：\n\n![](img/Figure_13.11.png)\n\n\n\n\n\n# 图 13.11：将基值移动到其目标位置\n\
  \n## 快速排序算法\n\n1. 开始。\n2. 声明数组 `A[]` 和 `last`，其中 `last` 是数组 `A` 的最后一个元素。\n3. `Quicksort(A,0,last)`\n\
  4. {\n5. 将基值移动到其所在的位置，使得基值左侧的元素比基值小，基值右侧的元素比基值大。\n6. 对左半部分进行快速排序，即 `Quicksort(A,0,j-1)`。\n\
  7. 对右半部分进行快速排序，即 `Quicksort(A,j+1,last)`。\n8. }\n\n```c\n// 程序 13.6 显示快速排序的工作原理\n\
  #include <stdio.h>\n\nvoid Quicksort(int A[50],int first,int last)\n{\nint i,j,pivot,temp;\n\
  if(first<last)\n{\npivot=first;\ni=first;\nj=last;\nwhile(i<j)\n{\nwhile(A[i]<=A[pivot]&&\
  \ i<last)\ni++;\nwhile(A[j]>A[pivot])\nj--;\nif(i<j)\n{ // 交换第 i 和第 j 个元素\ntemp=A[i];\n\
  A[i]=A[j];\nA[j]=temp;\n}\n}\n}\ntemp=A[pivot]; // 交换第 j 个元素和 pivot\nA[pivot]=A[j];\n\
  A[j]=temp;\nQuicksort(A,0,j-1); // 递归排序左侧小子子数组\nQuicksort(A,j+1,last); // 递归排序右侧小子子数组\n\
  }\n}\n\nvoid main()\n{\nint A[50];\nint n,i;\nprintf(\"Enter the size of an array:\\\
  n\");\nscanf(\"%d\",&n);\nprintf(\"Enter Elements:\\n\");\nfor (i = 0; i < n; i++)\n\
  scanf(\"%d\", &A[i]);\nprintf(\"The unsorted array is: \\n\");\nfor (i = 0; i <\
  \ n; i++)\nprintf(\"%d\\t\", A[i]);\nQuicksort(A,0,n-1);\nprintf(\"\\nThe sorted\
  \ array is: \\n\");\nfor (i = 0; i < n; i++)\nprintf(\"%d \\t\", A[i]);\n}\n```\n\
  \n### 输出:\n```\nEnter the size of an array:\n5\nEnter Elements:\n30\n50\n10\n40\n\
  20\nThe unsorted array is:\n30 50 10 40 20\nThe sorted array is:\n10 20 30 40 50\n\
  ```\n\n## 结论\n\n本章讨论了编程中被称为“递归”的重要概念。递归函数是一种通过自我调用将问题分解为更小的子问题来解决问题的函数。在本章中，使用递归解决了各种问题，例如求数字的阶乘、斐波那契数列、阿曼函数、合并排序和快速排序。数字的阶乘是通过相乘该数字之前的所有正整数得到的。斐波那契数列是一个序列，其中每个数字都是前两个数字之和。阿曼函数是一种用于说明计算复杂性的数学函数。合并排序是一种将数组划分、递归地排序子数组然后将其合并的排序算法。快速排序是另一种排序算法，它选择一个基值，划分元素并递归地排序子数组。\n\
  \n接下来的章节提供了两种特殊的用户定义数据类型：结构体（structure）和联合体（union）。它说明了如何使用指针访问结构体的内容。\n\n## 要点\n\
  \n* 递归函数反复调用自身；这种函数调用被称为递归调用。这个过程被称为递归。\n* 停止条件或基准情况用于停止递归过程。因此，它充当递归过程的终止器。\n*\
  \ 数字的阶乘是通过相乘从 1 到该数字的所有正整数得到的。\n* 在斐波那契数列中，每一项都是其前两项之和。它从 0 开始，接着是 1。\n* 德国数学家威廉·阿曼（Wilhelm\
  \ Ackermann）于 1928 年开发了阿曼函数。这是一个递归数学函数。\n* 阿曼函数接受两个输入（`m` 和 `n`），两者是非负整数。\n* 合并将数组递归地拆分为较小的数组直到数组大小为一。对它们进行单独排序，然后重新合并在一起产生一个有序数组。\n\
  * 快速排序选择一个元素作为基值（第一个元素），然后根据该基值将数组分为两个部分。\n* 基值元素将数组分为两个子数组，即左数组和右数组，使得左数组中的元素小于基值元素的值，右数组中的元素大于基值。\n\
  * 合并排序和快速排序算法与合并排序一样，都是分治法算法。\n\n## 常见问题\n\n1. 什么是递归？它是如何工作的？\n2. 递归函数中的基准情况是什么？它为什么重要？\n\
