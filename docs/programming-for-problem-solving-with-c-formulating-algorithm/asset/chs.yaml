  \    *   `1111+1101`\n    *   `1111–1101`\n    *   `1010*10`\n    *   `1110/11`\n\
  11. 数字 25 的格雷码是多少？\n12. 二进制数制表示哪些类型的数字？简述。\n13. ASCII 字符集包含多少个字符？为什么？\n14. 两个二进制数的加减法规则是什么？\n\
  \n\n\n\n在本章中，我们将学习计算机编程背景下解决问题的基础方面。我们将探索各种解决问题的技术，并理解编程语言在表达我们的解决方案中的作用。此外，我们将学习语言翻译器或处理器，它们有助于将人类可读的代码转换为机器可执行的指令。另外，我们还将探索程序的编译和执行过程，并对在编译期间处理语法错误和逻辑错误获得见解。在本章结束时，你将为开启编程之旅打下坚实的基础，并从容应对各种挑战。\n\
  \n## 结构\n\n在本章中，我们将涵盖以下主题：\n\n*   解决问题的方法\n*   解决问题的技术\n*   编程语言\n*   语言翻译器或处理器\n\
  *   编译和执行过程\n*   编译中的语法和逻辑错误\n*   在编写、编译和执行 C 程序时生成的不同文件\n\n## 目标\n\n本章的目标是让读者理解问题解决和编程概念。它涵盖了解决问题的方法和技术、编程语言、语言翻译器、编译和执行过程、语法和逻辑错误的处理，以及编写、编译和执行\
  \ `C` 程序时生成的文件。其目的是让读者具备自信地应对编程挑战并编写高效、无错误的 `C` 程序的能力。\n\n## 解决问题\n\n解决问题是弄清楚需要做什么来解决问题的过程。它从描述问题开始，以找到修复问题的最佳方法结束。在找到解决方案之前，必须正确识别问题，然后将其转换为每个人都能理解的清晰的可执行步骤。在这些步骤中使用了不同的运算符来获取所需的解决方案。\n\
  \n## 逻辑和数值问题的解决步骤\n\n逻辑和数值问题的解决涉及以下解决任何问题的几个主要步骤：\n\n1.  **分析问题**：这是理解问题的过程。为了更好地理解问题，你应该知道输入是什么，以及可能的输出是什么。这简单意味着知道解决问题所需的条件及其可能的解决方案。此外，还会检查问题的可行性，以查看是否可以使用现有技术解决该问题。\n\
  2.  **将复杂问题拆分为较小、简单的任务**：如果一个问题复杂且巨大，首先将其拆分为不同的模块。解决单个模块并把它们组合起来形成最终解决方案。（这是一个可选步骤。）\n\
  3.  **制定解决问题的计划**：在这一步中，将制定一个解决问题的计划。它包括将问题写成伪代码、流程图或算法形式。伪代码、流程图和算法代表了你解决问题的逐步策略。这一步为解决问题提供了逻辑。\n\
  4.  **执行计划**：通过使用合适的编程语言（如 `C`、`C++`、`Python` 等）将算法或伪代码转换为程序（实际代码）。将程序输入计算机。根据程序和数据生成结果作为输出。该输出可以用来做出良好的决策。\n\
  5.  **回溯**：一旦获得输出结果，你就可以返回对程序或计划进行一些更改，以进一步改进结果。你可能会考虑以不同的方式解决问题以产生更好的结果。这一步有时被称为测试和调试阶段。\n\
  \n## 解决逻辑问题\n\n让我们来解决一个经典的逻辑问题：水桶问题。假设要求你使用两个容量分别为 3 升和 5 升的水桶来量出 4 升水。需要遵循以下步骤：\n\
  \n1.  **分析问题**：首先，你将验证是否有必要的原料（如水源、水桶等），这些将作为输入。其次，输出是 4 升水。\n2.  **将复杂问题拆分为较小、简单的任务**：这是一个非常简单的问题，因此没有必要将其进一步拆分为子问题。（这是一个可选步骤。）\n\
  3.  **制定计划**：下面的伪代码（步骤）用简单的语言表示计划。这些是实现问题解决方案的步骤。\n    1.  将 5 升桶装满水。\n    2.  将水从\
  \ 5 升桶倒入 3 升桶，在 5 升桶中留下 2 升水。\n    3.  倒空 3 升桶。\n    4.  将 5 升桶中剩余的 2 升水倒入 3 升桶。\n\
  \    5.  再次将 5 升桶装满水。\n    6.  小心地将水从 5 升桶倒入 3 升桶，直到 3 升桶装满。将在 5 升桶中恰好留下 4 升水。\n\
  4.  **执行计划**：使用合适的编程语言（如 `C`、`C++`、`Python` 等）将算法或伪代码转换为程序（实际代码）。将程序输入计算机，你将获得所需的输出。\n\
  5.  **回溯**：假设在几步之后，你发现水的分配没有导致 5 升桶中出现 4 升水的预期结果。与其放弃，不如回溯到上一个步骤，在那个步骤你有其他选择（例如，装满哪个桶，何时倒水等）。然后你尝试不同的选择，看看它是否能产生想要的结果。\n\
  \n## 解决数值问题\n\n让我们以两个数字相加的数值为例，并按照前面的步骤解决解决：\n\n在这里，我们需要三个变量：两个输入，一个输出。设数字 `A` 和\
  \ `B` 为输入，`C` 为输出。所以我们可以这样写：\n\n1.  **分析问题**：\n    *   输入：整数 `A` 和 `B`\n    *  \
  \ 输出：整数 `C`\n2.  **划分复杂问题**：这已经是一个简单的问题，因此没有必要将其拆分为小模块。\n3.  **制定计划**：伪代码用简单的语言表示计划。两个数字\
  \ `A` 和 `B` 加到第三个数字 `C` 的伪代码如下：\n    1.  开始\n    2.  输入：整数 `A` 和 `B`\n    3.  输出：整数\
  \ `C`\n    4.  `C=A+B`\n    5.  打印 `C`\n    6.  结束\n4.  **执行计划**：现在，此伪代码可以转换为编程语言。以下代码用\
  \ `C` 语言表示它：\n\n```c\n#include<stdio.h>\nint main()\n{\n    int A, B, Sum = 0;\n\
  \    printf(\"Enter two numbers A and B : \\n\");\n    scanf(\"%d%d\", &A, &B);\n\
  \    Sum = A + B;\n    printf(\"Sum of A and B is: %d\", Sum);\n    return 0;\n\
  }\n```\n\n5.  **回溯**：一旦获得输出结果，你可以尝试替代方法来解决它。\n\n## 解决问题技术\n\n`算法`、伪代码和流程图是使用计算机解决问题的关键技术或工具。此外，这些这些使用编程语言（如\
  \ `C`、`C++` 等）转换为实际计算机程序。\n\n## 算法\n\n在没有计算机硬件软件的情况下逐步解决问题的计划被称为算法。然后，使用编程语言（如 `C`、`C++`\
  \ 等）将这些步骤以程序的形式写下来。这就是制作程序的方法。换句话说，算法是计算机程序的计划。\n\n## 算法的特征\n\n\n\n\n\n- **有限性**：算法在执行一定数量的步骤后必须结束。\n\
  - **无歧性或清晰性**：它的每一个步骤及其输入输出应该是易于理解的，并且只能产生一种含义。\n- **输入**：它必须有清晰的提供输入的方式。\n- **输出**：算法必须明确结果将是什么。\n\
  - **有效性**：每一步都必须必须的。\n- **语言无关性**：它可以用任何编程语言编写。\n\n以下给出算法的一些简单示例：\n\n- 一个将两个数字 `A`\
  \ 和 `B` 加到第三个数字 `C` 中的算法：\n    1. `开始`\n    2. 声明三个整数 `A`、`B` 和 `C`\n    3. 输入 `A`\
  \ 和 `B` 的值\n    4. 将 `A` 和 `B` 的值相加\n    5. 将第 4 步的输出存储到 `C`\n    6. 打印 `C`\n  \
  \  7. `停止`\n\n- 一个寻找两个数中较大者的算法：\n    1. `开始`\n    2. 声明两个整数 `A`、`B`\n    3. 输入 `A`\
  \ 和 `B` 的值\n    4. 如果 `A > B`，则打印“A 较大”\n    5. 否则打印“B 较大”\n    6. 否则打印“数字相等”\n\
  \    7. `停止`\n\n- 一个判断一个数字是偶数还是奇数的算法：\n    1. `开始`\n    2. 声明一个整数 `A`\n    3. 输入\
  \ `A` 的值\n    4. 如果 `A % 2 = 0`，则“打印数字是偶数”\n    5. 否则“打印数字是奇数”\n    6. `停止`\n\n\
  - 一个 `交换` 两个数字的算法：\n    1. `开始`\n    2. 声明三个整数 `A`、`B` 和 `T`\n    3. 输入 `A` 和 `B`\
  \ 的值\n    4. 设置 `T = A`\n    5. 设置 `A = B`\n    6. 设置 `B = T`\n    7. 打印 `A`、`B`\n\
  \    8. `停止`\n\n## 流程图\n\n流程图是一种显示解决问题步骤（类似于算法）的图表。它用于展示算法是如何运作的。它就像算法的图形化表示。换句话说，它是表示问题的另一种技术，但以图表或图片的形式呈现。它使用连接在一起的不同符号来显示信息和控制流。以下是流程图使用的一些基本符号：\n\
  \n- **开始**：这是起始符号，用椭圆形表示。\n- **结束**：这是结束符号，用椭圆形表示。\n- **箭头**：箭头连接流程图中的符号，并显示程序的控制流。\n\
  - **处理**：用矩形表示。它用于显示处理步骤。\n- **输入**：用于接受输入，用平行四边形表示。\n- **输出**：用于显示输出，用平行四边形表示。\n\
  - **决策/条件**：菱形符号用于判断语句中。它总是由两个箭头连接，并标记为 `Yes`（是）和 `No`（否）。根据菱形的条件，一次仅有一个箭头产生输出。\n\
  - **连接符**：用圆形表示。它用于占据多页的复杂且庞大的流程图。该符号用于连接多页流程图。它还包含一个标记的圆。`表 5.1` 显示了流程图中使用的符号：\n\
  \n| 符号 | 描述 | 名称 |\n| :--- | :--- | :--- |\n| ![](img/Table_5._A.jpg) | 控制流 | 箭头\
  \ |\n| ![](img/Table_5._B.jpg) | 处理 | 矩形 |\n| ![](img/Table_5._C.jpg) | 开始和结束 |\
  \ 椭圆 |\n| ![](img/Table_5._D.jpg) | 输入和输出 | 平行四边形 |\n| ![](img/Table_5._E.jpg) |\
  \ 决策或条件 | 菱形 |\n| ![](img/Table_5._F.jpg) | 连接符 | 圆形 |\n\n表 5.1：流程图中使用的符号\n\n两个数字\
  \ `A` 和 `B` 加到第三个数字 `C` 中的流程图如图 `图 5.1` 所示，以便说明上述符号：\n\n![](img/Figure_5.1.png)\n\
  \n图 5.1：两个数相加的流程图\n\n另一个寻找两个数中较大者的流程图如图 `图 5.2` 所示：\n\n![](img/Figure_5.2.png)\n\
  \n图 5.2：两个数较大者的流程图\n\n判断一个数字是偶数还是奇数的流程图如图 `图 5.3` 所示：\n\n![](img/Figure_5.3.png)\n\
  \n图 5.3：判断数字奇偶的流程图\n\n交换两个数字的流程图如 示 `图 5.4` 所示：\n\n![](img/Figure_5.4.png)\n\n图\
  \ 5.4：交换两个数字的流程图\n\n## 伪代码\n\n流程图、算法和伪代码用于解决问题。（此处省略重复的句子翻译，已按要求处理）\n\n\n\n\n2.\
  \ 通常，机器级程序是使用八进制或十六进制表示的。\n\n### 2. 高级语言 (HLL)\n它通过使用类似英语的自然语言来编写程序，简化了编程。因为它使用了自然语言，所以它很容易学习。计算机无法直接理解这种语言编写的代码，因为计算机只能理解二进制语言。因此，需要一个翻译器将高级语言（HLL）转换为低级语言（LLL），例如编译器、解释器等。因为它非常人类，人类可以轻松理解它。它是机器无关且可移植的，因此它的程序可以在任何计算机上运行。用这种语言编写程序很容易，而且非常容易调试（删除错误）。高级语言的示例有\
  \ C、C++、JAVA、FORTRAN、PYTHON、PROLOG 等。下面的程序展示了一个用 C 语言编写的高级语言程序。示例：两个数相加的 C 程序所示：\n\
  \n```c\n#include<stdio.h>\n\nint main()\n{\n    int A, B, Sum = 0;\n    printf(\"\
  Enter two numbers A and B : \\n\");\n    scanf(\"%d%d\", &A, &B);\n    Sum = A +\
  \ B;\n    printf(\"Sum of A and B is: %d\", Sum);\n    return 0;\n}\n```\n\n###\
  \ 3. 汇编语言\n它使用符号来编写程序。这些符号被称为助记符，很容易记忆，例如 `ADD`、`SUB`、`MUL` 和 `DIV`。这些助记符是用英文写的。它也被称为中间语言，因为它同时使用了自然语言和符号。它具有高级语言和低级语言的特点。计算机不直接理解它们。汇编语言编写的程序需要一个翻译器（称为汇编器）将其从汇编语言转换为低级语言。汇编语言编写的所有指令随机器而异，因此它们依赖于机器；也就是说，在计算机上编写的程序不会在不同的计算机上执行。因为它依赖机器，所以它与计算机非常接近。与低级语言相比，用这种语言编写程序很容易且非常容易调试（删除错误），但与高级语言相比则很困难。\n\
  \n示例：两个数相加的汇编语言程序。以下程序包含三个语句：\n\n```\nLOAD A\nADD B\nSTORE C\n```\n\n在 C 语言中，可以写如下：\n\
  \n```c\nC=A+B;\n```\n\n## 语言翻译器\n语言翻译器或处理器将用一种语言编写的程序翻译或转换为另一种语言，例如从高级语言转换为低级语言。用编程语言编写的程序被称为源代码；当它被翻译成机器语言时，就变成了目标代码。语言处理器的简单机制如图\
  \ 5.5 所示：\n\n![](img/Figure_5.5.png)\n\n图 5.5：语言翻译器\n\n通常有三种语言翻译器，在下面的小节中给出：\n\n\
  * **编译器**：是一个将高级语言转换为低级语言的程序。它将整个高级语言程序作为输入并转换为低级语言。源代码是用高级语言编写的程序。当它转换为低级语言时，它就变成了目标代码。因此，编译器将源代码转换为所谓的目标代码。一旦找到了目标代码，就可以运行它获得结果。这种翻译被称为编译。编译器的工作如图\
  \ 5.6 所示：\n\n    ![](img/Figure_5.6.png)\n\n    图 5.6：编译器\n\n### 编译器的功能\n* 主要任务是将高级语言转换为低级语言。\n\
  * 根据语言的语法（规则）查找源代码中的错误。\n* 显示错误以便程序员可以删除它们。\n* 在主内存中为程序分配空间。\n* 产生目标代码。\n\n* **解释器**：它逐行将高级语言程序转换为低级语言程序；也就是说，一次翻译并立即执行一条语句。程序语句直接逐行翻译成机器语言，而不产生任何目标代码。与编译器相比，解释器是一个占用内存空间较少的简单程序。与编译相比，解释程序是非常耗时的，因为在解释器中，每条语句都必须单独翻译。因此，编译过程比解释过程所需的时间短。解释器的工作如图\
  \ 5.7 所示：\n\n    ![](img/Figure_5.7.png)\n\n    图 5.7：解释器\n\n* **汇编器**：将汇编语言程序转换为机器或低级语言的软件称为汇编器。用汇编语言编写的程序被称为源代码，汇编器的输出被称为目标代码。获取目标代码后，运行它获得结果。见图\
  \ 5.8：\n\n    ![](img/Figure_5.8.png)\n\n    图 5.8：汇编器\n\n### 汇编器的功能\n* 主要任务是将汇编语言转换为低级语言。\n\
  * 根据语言的语法（规则）查找源代码中的错误。\n* 显示错误以便程序员可以删除它们。\n* 在主内存中为程序分配空间。\n* 产生目标代码。\n\n除了上述程序外，以下程序还支持：\n\
  * **编辑器**：编辑器是一个提供编写、修改和编辑源代码平台的程序。此文本有其自己的命令，用于编写、修改和编辑文本。\n* **链接器**：它通过将两个或多个文件合并为一个文件来创建一个带有\
  \ `.exe` 扩展的可执行文件，例如将我们程序的目标代码和库函数的目标代码合并到一个文件中。\n* **加载器**：是一个从链接器加载可执行代码、将其放入主内存并为计算机执行做准备的程序。它在主内存中为程序分配内存空间。\n\
  \n如今，所有之前提到的工具都集成在一个软件软件包中，被称为集成开发环境 (IDE)。IDE 的示例有 Turbo C、CodeBlocks、Visual Studio、Microsoft\
  \ C++、Eclipse 等。\n\n## 编译和执行过程\n将 C 程序（源代码）翻译成可执行文件涉及许多步骤，讨论如下：\n\n1. 在编辑器中编写程序，这是一个扩展名为\
  \ `.c` 的源代码。\n2. 将源代码输入给编译器，编译器生成扩展名为 `.o` 的目标代码。如果发生某些错误（语法错误），程序员再次在编辑器中打开源代码，找到错误，删除它们并重新编译。\n\
  3. 通过链接器将目标代码与一些附加文件（如库文件和程序执行所需的其他代码）链接起来。链接器生成带有 `.exe` 扩展名的二进制可执行文件。如果在链接出现任何错误，例如链接器无法将文件链接到目标代码，则它被称为链接错误。\n\
  4. 加载器将可执行文件加载到主内存中。\n5. 之后，执行程序并生成结果形式的输出。如果发生某些错误（运行时错误），程序员再次在编辑器中打开源代码，找到错误并删除它。\n\
  \n图 5.9 显示了完整的编译过程如下：\n\n![](img/Figure_5.9.png)\n\n图 5.9：编译和执行过程\n\n## 编译中的语法和逻辑错误\n\
  每种语言都有一套编写语句的规则。它们被称为语言的语法。C 也有编写其程序的语法。它具有以下两种类型：\n\n\n\n\n## 1. 语法错误 (Syntax error)\n\
  如果程序员在编写语句时违反了语法规则，就会发生语法错误。它与语句的语法（编写语句语法的规则）有关。例如，语句末尾缺少分号、在程序中使用未声明的变量、写了错误的关键词等。编译器在编译时就能识别出它。检查以下程序：\n\
  \n```c\n#include<stdio.h>\n\nvoid main()\n{\nint a=2,b=3,c;\n\nc = a + b // 缺少分号：语法错误\n\
  \nprintf(\"Sum is %d\",c);\n\ngetch();\n}\n```\n\n## 2. 逻辑或语义（意义）错误 (Logical or\
  \ semantic error)：当程序的逻辑错误时，就会发生这种错误。它与语句的含义有关。例如，如果程序员在加号的位置使用了减号。它在编译时不会被识别，而是在程序产生错误结果的运行时被识别。\n\
  \n一些逻辑错误如下所示：\n\n`A + B = C;`\n\n`A = B / 0;`\n\n检查以下程序：\n\n```c\n#include<stdio.h>\n\
  \nvoid main()\n{\nint a = 6, b = 3, c;\n\nc = a + b / 2; // 逻辑错误缺少括号：语义错误\n\nprintf(\"\
  Average of two number is = %d\", c);\n\ngetch();\n}\n```\n\n## C 程序生命周期中生成的文件\n\
  在编写、编译和执行 C 程序时，会生成不同的文件。其中一些重要文件如下：\n\n*   **源代码 (Source code)**：当我们编写程序时，必须使用\
  \ `.c` 扩展名保存。保存程序的过程会生成一个文件。例如，创建并保存一个名为 `sum.c` 扩展的文件。这个文件被称为源代码。\n*   **目标代码 (Object\
  \ code)**：将源代码输入给编译器，编译器会生成另一个被称为目标代码的文件。它具有 `.o` 扩展名，例如 `sum.o` 扩展。编译器的输入是源代码，编译器的输出是目标代码。\n\
  *   **可执行代码 (Executable code)**：通过链接器，目标代码与一些额外的文件（如库文件和程序执行所需的其他代码段）链接在一起。链接器生成一个具有\
  \ `.exe` 扩展的二进制执行文件，被称为可执行代码。例如，目标代码 `sum.o` 被转换为 `sum.exe`。\n\n成功执行后，所有三个文件都存储在\
  \ C 工作目录中。完整过程见图 5.9。\n\n## 结论\n本章重点关注解决问题的方法以及在解决问题时使用的许多方法，如流程图、算法和伪代码。此外，它还讨论了计算机语言的几个层次，如高级、、低级和汇编级，以及用于在这些层次之间转换的工具，如编译器、解释器和汇编器。它还解释了将算法转换为程序的过程。\n\
  \n因此，下一章将讨论 C 编程语言的介绍和历史。这是因为所有的程序解决方案都需要转换为计算机程序。此外，我们还将讨论 C 程序的核心组件以及执行程序的方法。\n\
  \n## 要点\n*   解决问题是弄清楚解决问题需要做什么的过程。\n*   解决逻辑和数值问题的步骤步骤是：分析问题、将复杂问题拆分为小而简单的任务、制定解决问题的计划、执行计划以及回溯。\n\
  *   解决问题的三个主要工具是算法、流程图和伪代码。\n*   算法是在没有计算机硬件和软件的情况下，分步解决问题的计划。\n*   流程图是一种显示解决问题步骤的图表，类似于算法。\n\
  *   伪代码是一种用结构化英语编写程序的非正式方法。它关注于算法的逻辑，而不涉及语言语法的细节。\n*   为了指示计算机执行任务，需要一种被称为编程语言的语言。\n\
  *   `LLL` 只有两个符号，0 和 1。\n*   `HLL` 使用像英语这样的自然语言来编写程序。\n*   汇编语言使用符号来编写程序。这些符号被称为助记符（mnemonics），很容易记忆，例如\
  \ `ADD`、`SUB`、`MUL` 和 `DIV`。\n*   语言翻译器或处理器将用一种语言编写的程序翻译或转换为另一种语言，例如从 `HLL` 转换为\
  \ `LLL`。\n*   `compiler`compiler）是将 `HLL` 转换为 `LLL` 的程序。它将整个 `HLL` 程序作为输入并将其转换为\
  \ `LLL`。\n*   `interpreter`（解释器）逐行将 `HLL` 程序转换为 `LLL`。\n*   `assembler`（汇编器）是将汇编语言程序转换为机器码或\
  \ `LLL` 的软件。\n*   `editor`（编辑器）是一个提供平台以编写、修改和编辑源代码或文本的程序。\n*   `linker`（链接器）在目标文件中搜索并附加所有使文件可执行的库。\n\
  *   `loader`（加载器）是一个从链接器处加载可执行代码、将其放入主内存并准备好计算机执行的程序。\n\n\n\n\n\n# 为什么选择 C？\n* C\
