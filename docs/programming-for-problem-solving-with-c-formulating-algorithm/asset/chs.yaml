  \n### 引言](#contents.xhtml_sc2_327a)\n\n本章将教我们如何定义结构体、访问其元素并初始化。我们还将探索结构体数组、结构指针、联合体以及作为参数传递结构体。这些知识将使你能够处理复杂数据。\n\
  \n### 结构体](#contents.xhtml_sc2_328a)\n\n在本章中，我们将讨论以下主题：\n\n* 定义结构体\n* 访问结构体元素\n\
  * 结构体的初始化\n* 结构体数组\n* 结构体指针\n* 联合体\n* 函数中的结构体\n\n### 目标](#contents.xhtml_sc2_329a)\n\
  \n本章旨在提供对编程结构化数据的全面理解。读者将学习如何定义和操作结构体，访问并初始化元素，并探索结构体数组、结构指针、联合体和嵌套结构等高级概念。此外，我们还将介绍如何将结构体作为参数传递。\n\
  \n\n\n\n结构体声明告知了结构名称及其成员名称，但没有为它们分配任何内存空间。一旦声明了结构体，就会创建结构体的对象，从而为其成员分配内存。对于上述语法，拥有两个对象\
  \ `Object_1` 和 `Object_2` 的结构体内存视图如图图 14.1 所示：\n\n![](img/FIGURE_14.1.png)\n\n图\
  \ 14.1：内存中的结构表示\n\n让我们为两个学生 `S1` 和 `S2` 创建结构体，包含以下信息：\n\n*   学生姓名\n*   学生班级\n* \
  \  学生系\n*   学生学号\n\n以下代码存储了两个学生 `S1` 和 `S2` 的信息：\n\n```c\nstruct student // 结构体声明\n\
  {\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n} S1, S2; // 结构体定义或对象声明\n\
  ```\n\n图 14.2 显示了上述代码创建的场景：\n\n![](img/FIGURE_14.2.png)\n\n图 14.2：内存中两个学生的详情\n\n\
  对象 `S1` 和 `S2` 也可以通过以下方法创建：\n\n```c\nstruct student\n{\nchar Name[10];\nchar Class[10];\n\
  char Section[10];\nint Roll;\n};\n\nstruct student S1,S2; // 对象声明\n```\n\n## 访问结构体元素\n\
  \n结构体成员变量通过对象名后跟点运算符和成员名来访问。访问结构体成员的语法所示所示：\n\n`object_name.member_name;`\n\n例如，考虑以下示例来访问之前创建的结构体的成员：\n\
  \n```c\nS1.Name // 访问学生 S1 的姓名\nS1.Class\nS2.Section // 访问学生 S2 的系\nS2.Roll\n```\n\
  \n### 结构体的初始化\n\n通过给其成员赋值可以初始化结构体。赋值是通过结构化对象帮助完成的。如果结构体没有初始化，整数和浮点数成员将初始化为零，字符成员默认初始化为\
  \ `\\0`。可以使用以下方法来初始化结构体。\n\n### 方法 1：在对象声明时初始化，如下代码所示：\n\n```c\nstruct structure_name\n\
  {\ndatatype member_name_1;\ndatatype member_name_2;\n....................\ndatatype\
  \ member_name_N;\n} obj1={val_1, val_2,……val_N}; // 声明时的初始化\n```\n\n### 方法 2：结构体声明后的初始化，如下代码所示：\n\
  \n```c\nstruct structure_name\n{\ndatatype member_name_1;\ndatatype member_name_2;\n\
  ....................\ndatatype member_name_N;\n};\n\nstruct structure_name obj={val_1,\
  \ val_2,……val_N}; // 结构体声明后的初始化\n```\n\n以下代码通过方法 1 初始化对象 `S1` 和 `S2`：\n\n```c\n\
  struct student\n{\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n\
  } S1={\"KAMAL\",\"B.Tech\",\"Mechanical\",1},\nS2={\"Ajay\", \"B.Tech\",\"Mechanical\"\
  ,2};\n// 程序 14.1 显示使用方法 1 初始化结构体变量\n```\n\n```c\n#include <stdio.h>\n#include <string.h>\n\
  struct student\n{\nchar Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n\
  }S1={\"KAMAL\",\"B.Tech\",\"Mechanical\",1},\nS2={\"Ajay\",\"B.Tech\",\"Mechanical\"\
  ,2};\n\nint main()\n{\n/* 打印学生 1 的信息 */\nprintf( \"Student Name: %s\\n\", S1.Name);\n\
  printf( \"Student Class: %s\\n\", S1.Class);\nprintf( \"Student Section: %s\\n\"\
  , S1.Section);\nprintf( \"Student Roll Number: %d\\n\", S1.Roll);\n/* 打印学生 2 的信息\
  \ */\nprintf( \"Student Name: %s\\n\", S2.Name);\nprintf( \"Student Class: %s\\\
  n\", S2.Class);\nprintf( \"Student Section: %s\\n\", S2.Section);\nprintf( \"Student\
  \ Roll Number: %d\\n\", S2.Roll);\nreturn 0;\n}\n```\n\n输出：\nStudent Name: KAMAL\n\
  Student Class: B.Tech\nStudent Section: Mechanical\nStudent Roll Number: 1\nStudent\
  \ Name: Ajay\nStudent Class: B.Tech\nStudent Section: Mechanical\nStudent Roll Number:\
  \ 2\n\n以下代码通过方法 2 初始化对象 `S1` 和 `S2`，即在结构体声明之后：\n\n```c\nstruct student\n{\nchar\
  \ Name[10];\nchar Class[10];\nchar Section[10];\nint Roll;\n};\nstruct student S1={\"\
  KAMAL\", \"B.Tech\",\"Mechanical\",1};\nstruct student S2={\"Ajay\", \"B.Tech\"\
  ,\"Mechanical\",2};\n// 程序 14.2 显示初始化\n```\n\n\n\n\n结构体指针类似于一个包含另一个变量地址的指针，它指向存储该结构体的内存块的地址。结构体指针允许访问和操作结构体的成员。\n\
  \n### 结构体指针的声明\n\n在指针声明中，指针名称前使用星号 `*` 符号。结构体指针声明使用以下语法：\n\n```c\nstruct structure_name\n\
  {\n    //structure members\n}object1;\n\nstruct structure_name *ptr; // 声明一个结构体指针\n\
  ```\n\n在这里，`ptr` 是结构体指针。\n\n### 结构体指针的初始化\n\n在声明结构体指针后，我们需要对其进行初始化。使用取地址运算符 `&`\
  \ 来为结构体指针提供对象的地址，如下：\n\n```c\nptr = &structure_variable;\n```\n\n例如，\n\n```c\nptr\
  \ = &object1; // ptr 持有对象 object1 的地址\n```\n\n### 使用指针访问结构体成员：\n\n结构体指针可以通过两种方式访问结构体成员：\n\
  \n*   使用箭头 `->` 运算符。\n*   使用星号 `*` 间接运算符和点 `.` 运算符。\n\n以下程序展示了如何使用箭头 `->` 运算符处理结构体成员：\n\
  \n```c\n//Program 14.5 使用箭头 (->) 运算符处理结构体成员\n#include <stdio.h>\n\nstruct Student\n\
  {\n    char name[30];\n    int age;\n    char gender[30];\n}std1,std2;\n\n// 带指针的结构体变量\n\
  struct Student *ptr1, *ptr2;\n\nint main()\n{\n    ptr1 = &std1; // ptr1 持有 std1\
  \ 的地址\n    ptr2 = &std2; // ptr2 持有 std2 的地址\n    printf (\" \\n First Student:\
  \ \\n\");\n    printf (\" Enter the name of the Student: \");\n    scanf (\" %s\"\
  , &ptr1->name);\n    printf (\" Enter the age of the Student: \");\n    scanf (\"\
  \ %d\", &ptr1->age);\n    printf (\" Enter the gender of the Student: \");\n   \
  \ scanf (\" %s\", &ptr1->gender);\n    printf (\" \\n Second Student: \\n\");\n\
  \    printf (\" Enter the name of the Student: \");\n    scanf (\" %s\", &ptr2->name);\n\
  \    printf (\" Enter the age of the Student: \");\n    scanf (\" %d\", &ptr2->age);\n\
  \    printf (\" Enter the gender of the Student: \");\n    scanf (\" %s\", &ptr2->gender);\n\
  \    printf (\"\\n Display the details of the Student using the structure Pointer\"\
  );\n    printf (\"\\n Details of the Student \\n\");\n    printf(\" Name: %s\\n\"\
  , ptr1->name);\n    printf(\" Age: %d\\n\", ptr1->age);\n    printf(\" Gender: %s\\\
  n\", ptr1->gender);\n    printf (\"\\n Details of the Student \\n\");\n    printf(\"\
  \ Name: %s\\n\", ptr2->name);\n    printf(\" Age: %d\\n\", ptr2->age);\n    printf(\"\
  \ Gender: %s\\n\", ptr2->gender);\n    return 0;\n}\n```\n\n**输出：**\n```\nFirst\
  \ Student:\nEnter the name of the Student: Kamal\nEnter the age of the Student:\
  \ 30\nEnter the gender of the Student: Male\nSecond Student:\nEnter the name of\
  \ the Student: John\nEnter the age of the Student: 25\nEnter the gender of the Student:\
  \ Male\nDisplay the details of the student using the structure Pointer\nDetails\
  \ of the Student\nName: Kamal\nAge: 30\nGender: Male\nDetails of the Student\nName:\
  \ John\nAge: 25\nGender: Male\n```\n\n以下程序展示了使用 `*` 星号（间接运算符）和点 `.` 运算符：\n\n```c\n\
  //Program 14.6 使用 (*) 星号或间接运算符和点 (.) 运算符\n#include <stdio.h>\n\nstruct Student\n\
  {\n    char name[30];\n    int age;\n    char gender[30];\n};\n\n// 定义带指针的结构体变量\n\
  struct Student std1, std2, *ptr1, *ptr2;\n\nint main()\n{\n    // 存储 std1 和 std2\
  \ 结构体变量的地址\n    ptr1 = &std1;\n    ptr2 = &std2;\n    printf (\" \\n First Student:\
  \ \\n\");\n    printf (\" Enter the name of the Student: \");\n    scanf (\" %s\"\
  , &ptr1->name);\n    printf (\" Enter the age of the Student: \");\n    scanf (\"\
  \ %d\", &ptr1->age);\n    printf (\" Enter the gender of the Student: \");\n   \
  \ scanf (\" %s\", &ptr1->gender);\n    printf (\" \\n Second Student: \\n\");\n\
  \    printf (\" Enter the name of the Student: \");\n    scanf (\" %s\", &ptr2->name);\n\
  \    printf (\" Enter the age of the Student: \");\n    scanf (\" %d\", &ptr2->age);\n\
  \    printf (\" Enter the gender of the Student: \");\n    scanf (\" %s\", &ptr2->gender);\n\
  \    printf (\"\\n Display the Details of the Student using the structure pointer\"\
  );\n    printf (\"\\n Details of the Student \\n\");\n    printf(\"Name: %s\\n\"\
  , (*ptr1).name);\n    printf(\"Age: %d\\n\", (*ptr1).age);\n    printf(\"Gender:\
  \ %s\\n\", (*ptr1).gender);\n    printf (\"\\n Details of the Student \\n\");\n\
  \    printf(\"Name: %s\\n\", (*ptr2).name);\n    printf(\"Age: %d\\n\", (*ptr2).age);\n\
  \    printf(\"Gender: %s\\n\", (*ptr2).gender);\n    return 0;\n}\n```\n\n\n\n\n\
  因此，结构 `A` 的总大小为 4 + 4（填充） + 8 + 2 = 18 字节。然而，由于内存对齐的要求，结构体的实际大小将向上取整到最大成员大小的倍数，即\
  \ 8 字节（`double` 的大小）。因此，该结构的大小为 24 字节，如图图 14.4 所示：\n\n![](img/FIGURE_14.4.png)\n\
  \n图 14.4：程序 14.8 占用的内存空间\n\n```c\n// 程序 14.9 显示了结构中填充的概念\n\n#include <stdio.h>\n\
  \nint main()\n{\n    struct A\n    {\n        double z; // sizeof(double) = 8\n\
  \        int x; // sizeof(int) = 4\n        short int y; // sizeof(short int) =\
  \ 2\n    };\n\n    printf(\"Size of struct: %ld\", sizeof(struct A));\n\n    return\
  \ 0;\n}\n```\n\n输出:\nSize of struct: 16\n\n程序 14.9 占用的内存如图图 14.5 所示：\n\n![](img/FIGURE_14.5.png)\n\
  \n图 14.5：程序 14.9 占用的内存空间\n\n## 嵌套结构\n\n嵌套结构是指在另一个结构中定义一个结构的概念。它允许创建分级或嵌套结构，其中一个结构是另一个结构的成员。参见下面的程序，它接受个人的出生日期。出生日期进一步包含了日、月、年：\n\
  \n```c\n// 程序 14.10 使用嵌套结构接受出生日期\n\n#include <stdio.h>\n\nstruct Date {\n    int\
  \ day;\n    int month;\n    int year;\n};\n\nstruct Person\n{\n    char name[50];\n\
  \    struct Date dob; // 嵌套结构\n};\n\nint main()\n{\n    struct Person person;\n\
  \    printf(\"Enter name: \");\n    scanf(\"%s\", person.name);\n    printf(\"Enter\
  \ the date of birth (DD MM YYYY):\");\n    scanf(\"%d%d%d\",&person.dob.day,&person.dob.month,\
  \ &person.dob.year);\n    printf(\"\\nPersonal Details:\\n\");\n    printf(\"Name:\
  \ %s\\n\", person.name);\n    printf(\"Date of Birth: %02d-%02d-%04d\\n\", person.dob.day,\
  \ person.dob.month, person.dob.year);\n    return 0;\n}\n```\n\n输出:\nEnter name:\
  \ KAMALDEEP\nEnter the date of birth (DD MM YYYY):05 07 1987\nPersonal Details:\n\
  Name: KAMALDEEP\nDate of Birth: 5-7-1987\n\n在前面的程序中，我们有两个结构：`Date` 和 `Person`。`Date`\
  \ 结构表示一个包含三个整数成员：`day`、`month` 和 `year` 的日期。`Person` 结构包含一个字符数组 `name` 和一个用于存储出生日期的嵌套结构\
  \ `dob`。\n\n在 `main()` 函数中，我们创建了一个名为 `person` 的 `Person` 结构对象。第一个 `scanf()` 接受名称并将其存储在\
  \ `person.name` 中。第二个 `scanf()` 要求输入出生日期并存储在 `person.dob.day`、`person.dob.month`\
  \ 和 `person.dob.year` 中。最后，`printf()` 显示输入的信息。\n\n## 在函数中传递结构\n\n要将结构作为函数参数传递，你可以使用值传递或引用传递。程序\
  \ 14.11 显示了两种方法：\n\n```c\n// 程序 14.11 显示了使用值传递和引用传递传递结构的概念\n#include <stdio.h>\n\
  \nstruct Point\n{\n    int x;\n    int y;\n};\n\nvoid fun1(struct Point p) // 值传递\n\
  {\n    printf(\"Co-ordinates fun1: (%d,%d)\\n\", p.x, p.y);\n    p.x = 100; // 修改本地副本不影响原始结构\n\
  }\n\nvoid fun2(struct Point* p) // 引用传递（使用指针）\n{\n    printf(\"Co-ordinates fun2:\
  \ (%d,%d)\\n\", p->x, p->y);\n    p->x = 100; // 修改指向的结构影响原始结构\n}\n\nint main()\n\
  {\n    struct Point P = {10, 20};\n    fun1(P);\n    printf(\"Modified values after\
  \ pass-by-value: (%d,%d)\\n\", P.x, P.y);\n    fun2(&P);\n    printf(\"Modified\
  \ values after pass-by-reference: (%d,%d)\\n\", P.x, P.y);\n    return 0;\n}\n```\n\
  \n输出:\nCo-ordinates fun1: (10,20)\nModified values after pass-by-value: (10,20)\n\
  Co-ordinates fun2: (10,20)\nModified values after pass-by-reference: (100,20)\n\n\
  在 `fun1` 中，值传递的副本不会影响原始结构。在 `fun2` 中，引用传递（使用指针）修改指向的结构会影响原始结构。在 `fun1` 中，值传递后的修改后的值；在\
  \ `fun2` 中，引用传递后的修改后的值。根据需求选择适当的方法。\n\n## 结论\n\n本章阐述了结构和联合，它们是 C 语言中组织数据的概念。接下来的章节将介绍搜索和排序的基本概念。将详细讨论常用的搜索技术以及排序算法。\n\
  \n## 记忆要点\n\n- 联合和结构都允许将不同类型的变量组合到一个实体中。\n- 结构是包含不同类型（成员）的自定义类型。\n- 在结构中，每个成员都有自己的分配内存空间。\n\
  - 结构的成员可以使用运算符 `.` 进行访问。\n- 结构通常用于表示记录、对象或数据包等复杂数据结构。\n- 联合也是一种自定义类型，可以包含不同类型，但所有成员共享相同的内存空间。\n\
  - 与结构每个成员都有独立内存空间不同，联合只允许一个成员处于激活。\n- 修改联合中某个成员的值会覆盖其他成员的值。\n- 当需要在同一位置存储不同类型的数据时，联合可以节省内存。\n\
  - 联合在低层编程和对内存效率要求极高的场景中经常使用。\n- 联合的大小由其包含的最大成员决定。\n- 结构可以嵌套在其他结构或联合中，创建复杂的分级数据结构。\n\
  - 结构和联合可以与数组、指针和其他高级语言功能结合使用。\n- 结构可以为其成员分配默认值，而联合不能。\n- 结构通常用于组织相关数据，而联合用于多种数据类型共享内存空间的场景。\n\
  - 结构和联合提供了数据组织、处理和内存管理的强大工具。\n\n## 思考问题\n\n1. 结构和联合有什么区别？\n2. 如何声明结构？\n3. 使用结构的目的是什么？\n\
