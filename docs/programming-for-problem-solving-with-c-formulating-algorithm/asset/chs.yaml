  \ printf 部分)*\n\n\n\n\n## 数组 (Array)\n\n数组是存储在连续内存位置的相同数据类型的组合。它由 `int`、`float`\
  \ 等基本数据类型组成；因此它被称为派生数据类型。整数数据数组被称为整数数组；使用 `float` 数据类型时，它就变成了浮点数组。\n\n例如，为了存储一个学生在五门科目中的成绩，我们不需要为每个科目的成绩取五个不同的变量，而是可以使用数组将成绩存放在系列内存位置的单个单元中。因此，使用数组，我们可以在一个名称下存储许多相同类型的值。\n\
  \n## 数组的声明\n\n声明数组涉及将数据类型、数组名和其大小放在括号内，并在后面跟一个分号。其通用格式如下：\n\n```\ndata_type array_name[array_size];\n\
  ```\n\n在这里，\n\n*   `array_size` 表示数组的大小，即它可能包含的值的数量限制。\n*   `array_name` 提供有关数组名称的信息。\n\
  *   `data_type` 告诉存储在数组中的值的数据类型，例如整数、浮点数等。\n\n让我们通过以下语句查看声明数组的示例：\n\n```\nint num[5];\n\
  ```\n\n它将在内存的五个连续空间内存储五个整数值。请参考下方的图 10.1 进行说明：\n\n![](img/FIGURE_10.1.png)\n\n图\
  \ 10.1: 内存中的五元素数组\n\n在前面的图中：\n\n*   `num` 是数组的名称，其大小固定不变。\n*   数组中第一个成员的地址是 1000，也称为基地址。\n\
  *   数组中最后一个元素的地址是 1016，数组长度为五。\n*   数组中的所有值都是整数类型。\n\n方括号中的数字被称为索引（indexes, indices）或下标（subscripts）。C\
  \ 语言数组的索引从 0 开始。因此，对于一个有 N 个元素的数组，最后一个元素的索引是 N–1。在前面的示例中，第一个元素将放在 `num[0]` 中，称为下界（lower\
  \ bound）；第二个数字将放在 `num[1]` 中，依此类推。最后一个元素存储在 `num[4]` 中，被称为上界（upper bound）。\n\n##\
  \ 数组的初始化\n\n通常可以使用以下三种方法初始化数组。\n\n### 方法 1：直接赋值元素\n\n在这种方法中，直接使用数组的索引存储元素。见以下语句：\n\
  \n```\nnum[0]=30; //初始化数组[0]\nnum[1]=40;\nnum[2]=50;\nnum[3]=60;\nnum[4]=80;\n```\n\
  \n通过编写上述代码行，数组 `num` 的情况可以在图 10.2 中所示：\n\n![](img/FIGURE_10.2.png)\n\n图 10.2: 数组\
  \ `num[5]` 初始化后的内存图\n\n在这里，\n\n*   第一个位置的名称是 `num[0]`，持有值 30。\n*   最后一个位置的名称是 `num[4]`，持有值\
  \ 80。\n*   数组 `num` 分配的总空间为 20 字节，因为一个整数在内存中占用四个字节的空间（在 32 位编译器中）。\n\n### 访问数组元素\n\
  \n通过下标访问数组的元素。为了为了起，假设我们想要访问前面数组的第一个值；它通过 `num[0]` 获取，依此类推。\n\n```\n// 程序 10.1 显示数组的声明、初始化和访问\n\
  #include<stdio.h>\n\nint main()\n{\n    int i=0;\n    int num[5]; //声明数组\n    num[0]=30;\
  \ //初始化数组的第一个元素\n    num[1]=40;\n    num[2]=50;\n    num[3]=65;\n    num[4]=80;\n\
  \n    printf(\"%d\\n\",num[0]);\n    printf(\"%d\\n\",num[1]);\n    printf(\"%d\\\
  n\",num[2]);\n    printf(\"%d\\n\",num[3]);\n    printf(\"%d\\n\",num[4]);\n\n \
  \   return 0;\n}\n```\n\n输出：\n\n```\n30\n40\n50\n65\n80\n```\n\n### 方法 2：一次初始化数组\n\
  \n也可以在声明期间通过编写以下通用代码填充数组：\n\n```\ndata_type array_name[array_size]={元素列表};\n```\n\
  \n例如，\n\n```\nint num [5]={30,40,50,60,80};\n```\n\n上述语句将在内存中分配五个空间，如图 10.3 所示：\n\
  \n![](img/FIGURE_10.3.png)\n\n图 10.3: 数组 num[5] 初始化后的内存图\n\n第一个元素 `num[0]` 由值 30\
  \ 初始化，`num[1]` 等依此类推。\n\n```\n// 程序 10.2 用于输入和显示\n#include<stdio.h>\n\nint main()\n\
  {\n    int i=0;\n    int num [5]={30,40,50,60,80};\n\n    printf(\"%d\\n\",num[0]);\n\
  \    printf(\"%d\\n\",num[1]);\n    printf(\"%d\\n\",num[2]);\n    printf(\"%d\\\
  n\",num[3]);\n    printf(\"%d\\n\",num[4]);\n\n    return 0;\n}\n```\n\n输出：\n\n\
  ```\n30\n40\n50\n60\n80\n```\n\n### 方法 3：使用循环初始化数组\n\n也可以使用循环填充数组。通常使用 `scanf` 语句填充数组。\n\
  \n```\n// 程序 10.3 填充数组\n#include<stdio.h>\n\nint main()\n{\n    int i;\n    int\
  \ num[5];\n    printf(\"输入数组的值：\");\n    for(i=0; i<5; i++) {\n        scanf(\"\
  %d\", &num[i]);\n    }\n\n    printf(\"值为：\");\n    for(i=0; i<5; i++) {\n     \
  \   printf(\"%d\\n\", num[i]);\n    }\n\n    return 0;\n}\n```\n\n## 数组的地址\n\n由于数组元素存储在连续的位置，它们的地址也是顺序的。你可以使用地址运算符确定其地址。以下代码将输出数组的地址：\n\
  \n```\n// 程序 10.4\n#include<stdio.h>\n\nint main()\n{\n    int i=0;\n    int num[5]={30,40,50,60,70};\n\
  \n    printf(\"数组元素存储在以下地址：\");\n    for(i=0;i<5;i++) {\n        printf(\"\\n 元素\
  \ %d 的地址是 %p \", i, &num[i]);\n    }\n\n    return 0;\n}\n```\n\n输出：\n\n```\n数组元素存储在以下地址：\n\
  元素 0 的地址是 0x7fffda0\n元素 1 的地址是 0x7fffda4\n元素 2 的地址是 0x7fffda8\n元素 3 的地址是 0x7fffdac\n\
  元素 4 的地址是 0x7fffdae\n```\n\n## 数组的类型\n\n数组根据维度按以下两种方式分类。\n\n### 一维或单维数组\n\n单维数组存储一行值。它以线性形式存储数据，类似于列表。一维数组只使用一个索引值。到目前，我们只使用了一维数组。它的声明和初始化已讨论如下：\n\
  \n\n\n\n以下代码执行了 1D 数组的声明：\n\n```c\nint num [5];\n```\n\n以下代码执行了 1D 数组的初始化。\n\n```c\n\
  int num[5]={30,40,50,60,80};\n```\n\n前述代码将占用内存中的空间，如图图 10.5 所示：\n\n![](img/Figure_10.5.png)\n\
  \n图 10.5：1D 数组 `num`\n\n### 多维数组\n\n它包含多个维度，例如二维、三维等。它使用多个索引。最流行的多维数组是二维（2D）数组。\n\
  \n### 2D 数组\n\n我们使用二维数组来创建数学矩阵。它有两个索引：一个用于行，另一个用于列。二维数组 `a` 的声明和初始化可以通过以下行代码实现：\n\
  \n```c\nint a[2][2] = {{10,20},\n{30,40}};\n```\n\n或者\n\n```c\nint a[2][2] = {{10,20},{30,40}};\n\
  ```\n\n以下代码也可以对 2 数组进行初始化：\n\n```c\na[0][0] = 10; // 初始化数组\na[0][1] = 20;\na[1][0]\
  \ = 30;\na[1][1] = 40;\n```\n\n前述代码将在内存中创建一个二维数组，可以如图 10.6 所示进行想象：\n\n![](img/FIGURE_10.6.png)\n\
