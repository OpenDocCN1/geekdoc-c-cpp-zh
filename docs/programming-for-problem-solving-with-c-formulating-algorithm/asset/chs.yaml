  {\nint a[100],n,i,j,temp;\nprintf(\"Enter the number of elements\\n\");\nscanf(\"\
  %d\",&n);\nprintf(\"Enter %d elements\\n\", n);\nfor(i=0;i<n;i++)\nscanf(\"%d\"\
  ,&a[i]);\nfor(i=0;i<n-1;i++)\n{\nfor(j=0;j<n-i-1;j++)\n{\nif (a[j] > a[j+1])\n{\n\
  temp=a[j];\na[j]=a[j+1];\na[j+1]=temp;\n}\n}\n}\nprintf(\"The sorted 1D array in\
  \ ascending order is:\\n\");\nfor(i=0;i<n;i++)\nprintf(\"%d\\n\", a[i]);\nreturn\
  \ 0;\n}\n```\nOutput:\n```\nEnter the number of elements\n5\nEnter 5 elements\n\
