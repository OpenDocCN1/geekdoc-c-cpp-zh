  \n![](img/fm1.png)\n\n# 第 17 章 控制台输入输出函数\n\n## 引言\n\n本章将深入探讨 C 编程中的输入输出函数。这些函数是你的程序与用户之间通信的基石，因此不可或缺。在接下来的章节中，我们将探索如何使用\
  \ `printf()` 和 `scanf()` 进行格式化输入输出，以及其他函数如 `getch()`、`getchar()` 和 `puts()`。我们还将讨论如\
  \ `fflush(stdin)` 等用于高效 I/O 处理的技术，使你能够创建交互式且响应迅速的 C 程序。\n\n## 结构\n\n在本章中，我们将讨论以下主题：\n\
  \n- `printf()`\n- `scanf()`\n- `getch()`、`getche()` 和 `putch()`\n- `getchar()` 和\
  \ `putchar()`\n- `fgetchar()` 和 `fget()`\n- `gets()` 和 `puts()`\n- `fflush(stdin)`\
  \ 的使用\n\n## 目标\n\n本章旨在对 C 编程中的输入输出函数提供全面的理解。读者将学习如何使用 `printf()` 和 `scanf()` 进行格式化输入输出，以及其他基本函数如\
  \ `getch()`、`getchar()`、`puts()`，以及如 `fflush(stdin)` 等技术来有效处理输入输出。这些知识将使读者具备创建交互式且用户友好\
  \ C 程序的能力。\n\n## 控制台输入–输出函数\n\n输出语句在屏幕上显示数据或将数据写入打印机或文件，而输入函数则从键盘或文件读取数据。显示器屏幕和键盘统称为控制台。本章将仅讨论控制台输入输出（I/O）函数。文件\
  \ I/O 函数将在第 19 章：C 语言文件处理中讨论。\n\nC 语言提供了许多内置控制台函数。所有这些内置函数都指定在头文件中。在使用函数之前，我们必须在程序包含相关的头文件。例如，`printf()`\
  \ 和 `scanf()` 函数定义在 `stdio.h` 中。因此，在使用这些函数时，必须在程序中包含它。\n\n输入输出函数分为两类，如图 17.1 所示。\n\
  \n- 格式化 I/O 函数\n- 非格式化 I/O 函数\n\n![](img/Figure_17.1.png)\n\n图 17.1：格式化和非格式化输入输出函数\n\
  \n- 格式化输出函数：输出函数控制数据的的外观，使其更容易处理和理解。例如，`printf()` 是格式化输出函数。它将输出到标准输出（控制台）或文件。它使用格式说明符指定输出的数据类型和格式。\n\
  - 格式化输入函数：格式化输入函数按特定格式从用户处读取数据。`scanf()` 是格式化输入函数。用于从标准输入（键盘）读取输入。它使用格式说明符指定输入的数据类型和格式。\n\
  - 非格式化输出函数：非格式化输出函数用于原样将数据写入屏幕。它不需要任何格式。例如，这些函数无法在输出变量之间插入空格、换行、制表符等。`putch()`、`putchar()`\
  \ 和 `puts()` 等函数是非格式化输出函数。\n- 非格式化输入函数：它们原样读取数据。C 中常用的非格式化输入函数包括 `getch()`、`getche()`、`getchar()`\
  \ 和 `gets()`。\n\n## printf()\n\n`printf()` 函数用于格式化输出。它是标准输入输出库 (`stdio.h`）的一部分，用于在输出控制台上显示格式化数据。printf\
  \ 的名称代表格式化打印。以下语句显示了其语法：\n\n```\nprintf(\"format_string\", list_of_variables);\n\
  ```\n\n`format_string` 包含以下项：\n\n字体 原样打印的字符或字符串。\n- 以 % 符号开头的格式说明符：详情请见第 6 章：C 基础。\n\
  \n\n\n\n-   以 `\\` 符号开头的转义序列，例如 `\\n` 和 `\\t`：更多详情请参见第 6 章：C 语言基础。\n\n### 格式说明符\
  \ (Format Specifiers)\n\n格式说明符以 `%` 字符开头，定义了对应参数的数据类型和格式选项。一些常用的格式说明符包括 `%d`、`%u`、`%f`\
  \ 等。\n\n可以在格式说明符中添加格式选项来控制输出的外观和排列。常用的格式选项包括：\n\n-   **宽度 (Width)**：指定输出的最小字段宽度。例如，`%5d`\
  \ 将为整数分配至少五个字段。\n-   **精度 (Precision)**：告知浮点数小数点后的数字位数。例如，`%.2f` 将显示两位小数的数字。\n-\
  \   **标志 (Flags)**：提供额外的格式选项，如添加、前导零和对齐方式。例如，`%04d` 将为整数添加前导零。\n\n以下程序演示了带有不同格式说明符和格式选项的\
  \ `printf()`：\n\n```c\n// 程序 17.1 演示了带有不同格式说明符和格式选项的 printf()\n#include <stdio.h>\n\
  \nint main()\n{\n    int num = 10;\n    float pi = 3.14159;\n    char letter = 'A';\n\
  \    char name[] = \"John\";\n    printf(\"Number: %d\\n\", num); // 输出: Number:\
  \ 10\n    printf(\"Pi: %.5f\\n\", pi); // 输出: Pi: 3\\. 14159\n    printf(\"Letter:\
  \ %c\\n\", letter); // 输出: Letter: A\n    printf(\"Name: %s\\n\", name); // 输出:\
  \ Name: John\n    return 0;\n}\n```\n\n输出：\n```\nNumber: 10\nPi: 3.14159\nLetter:\
  \ A\nName: John\n```\n\n// 程序 17.2 演示了使用 `printf()` 输出带有指定数量的输出：\n\n```c\n#include<stdio.h>\n\
  \nint main()\n{\n    int a=8;\n    printf(\"%d\\n\", a); // 打印 a 的值。\n    printf(\"\
  %10d\\n\", a);// 占用 10 个空间并右对齐\n    printf(\"%-5d\", a); // 占用 5 个空间并左对齐\n    printf(\"\
  %d\", a); // 打印 a 的值\n    return 0;\n}\n```\n\n输出：\n```\n8\n8\n8 8\n```\n\n以下程序演示了使用\
  \ `printf()` 为浮点值输出带有指定数量的输出：\n\n```c\n// 程序 17.3 演示了使用 `printf()` 为浮点值输出带有指定数量的输出\n\
  #include<stdio.h>\n\nint main()\n{\n    float a=8.5430;\n    printf(\"%f\\n\", a);\
  \ // 打印 a 的值。\n    printf(\"%10.2f\", a); // 占用 10 个空间，其中 2 用于小数点后的数字并右对齐\n    return\
  \ 0;\n}\n```\n\n输出：\n```\n8.543000\n8.54\n```\n\n以下程序演示了使用 `printf()` 为浮点值输出带有指定数量的输出：\n\
  \n```c\n// 程序 17.4 演示了使用 `printf()` 为浮点值输出带有指定数量的输出\n#include<stdio.h>\n\nint main()\n\
  {\n    float a=8.543;\n    printf(\"%f\\n\", a);\n    printf(\"%10.2f\\n\",a); //右对齐\n\
  \    printf(\"%-10.2f\",a); //左对齐\n    return 0;\n}\n```\n\n输出：\n```\n8.543000\n\
  8.54\n8.54\n```\n\n### scanf()\n\n`scanf()` 函数从键盘读取输入。括号内包含用双引号（`\"\"`）括起的格式说明符列表，以及变量列表（变量以地址运算符（`&`）开头并用逗号分隔）。`scanf`\
  \ 的名称代表“格式化扫描”（scan formatted）。以下语句显示了 `scanf()` 函数的语法：\n\n```c\nscanf(\"format_string\"\
  , list_of_addresses_of_variables);\n```\n\n`format_string` 包含以下项：\n-   格式说明符以 `%`\
  \ 符号开头。\n-   转义序列以 `\\` 符号开头。\n\n例如：\n```c\n// 用于输入整数数据类型的变量\nint a;\nscanf(\"%d\"\
  , &a);\n\n// 用于分别输入整数和浮点数据类型的两个变量\nint a;\nfloat b;\nscanf(\"%d %f\", &a, &b);\n\
  ```\n\n变量的地址通过地址运算符（`&`）提供给 `scanf()` 函数。因为来自键盘的值进入这些地址，所以必须使用换行、空格或制表符（Tab）来插入键盘的值。\n\
  \n### scanf() 的局限性\n\n`scanf()` 函数也有一些局限性，如下：\n-   **处理空格的困难**：默认情况下，`scanf()` 使用空格（空格、制表符和换行）来输入值。这使得读取包含空格字符的输入变得困难。\n\
  -   **缓冲区溢出**：当使用 `%s` 格式说明符读取字符串时，`scanf()` 不进行边界检查。如果用户输入的字符串超过了目标缓冲区的大小，就会发生溢出。\n\
  \n\n\n\n\n```c\n// 程序 17.9 使用 putch(), putchar(), fputchar() 打印字符。\n\n#include<stdio.h>\n\
  #include<conio.h>\n\nvoid main()\n{\n    putch('A');\n    putchar('B');\n    fputchar('C');\n\
  }\n```\n\n输出：\n字符为：\nABC\n\n##  [`gets()` 和 `puts()`() 的用法\n\n现在让我们来详细讨论这些函数：\n\n\
  *   `gets()`：它接受一个字符串。它还能接受字符串之间的空白符，而 `scanf()` 无法接受字符串之间的空格。它存在于 `string.h` 头文件中。\n\
  *   `puts()`：它在屏幕上打印字符串。它与 `gets()` 配合使用。\n\n以下程序使用 `gets()` 和 `puts()` 接收并打印字符串：\n\
  \n```c\n//Program 17.10 使用 gets() 和 puts() 接收并打印字符串\n\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\n    char A[10];\n    printf(\"Enter a string:\\n\");\n    gets(A);\n\
  \    printf(\"The string is:\\n\");\n    puts(A);\n}\n```\n\n输出：\nEnter a string:\n\
  kamal deep\nThe string is:\nkamal deep\n\n以下程序使用 `scanf()` 和 `printf()` 接收并打印字符串：\n\
  \n```c\n//Program 17.11 使用 scanf() 和 printf() 接收并打印字符串\n\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\n    char A[10];\n    printf(\"Enter a string:\\n\");\n    scanf(\"\
  %s\",A);\n    printf(\"The string is:\\n\");\n    printf(\"%s\",A);\n}\n```\n\n\
  输出：\nEnter a string:\nKamal Deep\nThe string is:\nKamal\n\n注意：在输出中，`scanf()` 不会考虑空格之后的字符串。\n\
  \n##  [`fflush(stdin)` 的用法\n\n当我们从键盘输入值时，这些值会进入 `stdin` 缓冲区，这是一个临时存储区域。`scanf()`\
  \ 从缓冲区中获取值并将其赋值给变量，如图 17.2 所示。查看程序 17.12：\n\n```c\n// 程序 17.12 用于打印一个整数和一个字符\n\n\
  #include<stdio.h>\n\nvoid main()\n{\n    char A;\n    int B;\n    printf(\"Enter\
  \ an integer\\n\");\n    scanf(\"%d\",&B);\n    printf(\"Enter a character:\\n\"\
  );\n    scanf(\"%c\",&A);\n    printf(\"The values are:%d,%c\",B,A);\n}\n```\n\n\
  输出：\nEnter an integer\n10\nEnter a character:\nThe values are:10\n\n之前的程序 17.12\
  \ 在整数值之后没有接收字符的值，因为当我们输入整数并按下回车键时，整数和回车键的 ASCII 值进入 `stdin` 缓冲区。`scanf` 函数将 `10`\
  \ 赋值给 `B`，将 ASCII 值赋值给 `A`，如图 17.2 所示：\n\n![](img/Figure_17.2.png)\n图 17.2：`stdin`\
  \ 缓冲区和 `scanf()`\n\n因此，为了清除 `stdin` 并移除缓冲区中的 `\\n`，我们在打印整数后使用 `fflush(stdin)`，如程序\
  \ 17.13 和图 17.3 所示：\n\n![](img/Figure_17.3.png)\n图: 17.3：使用 `fflush(stdin)` 后的 stdin\
  \ 缓冲区\n\n```c\n// 程序 17.13 使用 fflush(stdin) 打印一个整数和一个字符\n\n#include<stdio.h>\n\n\
  void main()\n{\n    char A;\n    int B;\n    printf(\"Enter an integer\\n\");\n\
  \    scanf(\"%d\",&B);\n    fflush(stdin);\n    printf(\"Enter a character:\\n\"\
  );\n    scanf(\"%c\",&A);\n    printf(\"The values are:%d,%c\",B,A);\n}\n```\n\n\
  输出：\nEnter an integer\n10\nEnter a character:\nA\nThe values are10,A\n\n## 总结\n\n\
  本章涵盖了控制台输入输出函数，包括格式化 I/O 函数如 `printf()` 和 `scanf()`。这些函数提供了对输入和输出格式的控制。然而，`scanf()`\
  \ 有其局限性，例如难以处理错误输入且需要精确的格式。此外，诸如 `getch()`、`getche()`、`putch()`、`getchar()`、`putchar()`、`fgetchar()`\
  \ 和 `ffputchar()` 等基本函数允许简单的基于字符的控制台操作。理解并使用这些函数使程序员能够创建高效且用户友好的控制台应用程序。\n\n接下来的章节将详细解释预处理器指令。它包括各种类型的预处理指令，如文件包含指令、宏展开指令、条件指令以及各种指令。\n\
  \n## 要点\n\n*   控制台输入输出函数对于通过控制台与用户交互至关重要。\n*   格式化 I/O 函数（如 `printf()` 和 `scanf()`）允许对输入和输出格式进行精确控制。\n\
  *   非格式化 I/O 函数提供了基本的控制台输入输出操作。\n*   `printf()` 用于显示格式化输出，允许以结构化且视觉美观呈现数据。\n*  \
  \ `printf()` 支持各种格式选项，包括指定字段宽度、精度和对齐方式。\n*   `scanf()` 用于格式化输入，允许程序从用户输入中提取数据。\n\
  *   `scanf()` 可以用于格式化输入，允许程序从用户输入中提取数据。\n\n\n\n\n\n-   条件指令\n-   未定义指令\n\n## 目标\n\
  \n本章的目的是让读者对 C 语言中的预处理器指令有全面的理解。读者将学习如何使用文件包含、宏展开、条件编译和未定义指令。\n\n## 预处理器\n\n顾其名，预处理器是一个在编译之前处理我们源代码的程序。它以哈希（`#`）符号开头。\n\
  \n## 预处理器指令\n\n预处理器指令是预处理器命令。它们以哈希（`#`）符号开头。预处理器声明末尾不需要分号。\n\n图 `18.1` 显示了预处理器的工作原理。编辑器编写源代码。在源代码传递给编译器之前，预处理器会首先检查任何指令。如果程序中存在该指令，它将会被处理，并将结果以展开后的源文件形式传递给编译器。这段展开后的源代码传递给编译器，由编译器生成目标代码：\n\
  \n![](img/Figure_18.1.png)\n\n图 18.1: 预处理器的工作原理\n\n有以下类型的指令：\n\n-   文件包含指令\n-  \
  \ 宏展开指令\n-   条件指令\n-   未定义指令\n\n## 文件包含指令\n\n该指令用于包含一个文件，例如源代码中的头文件。它在要包含的文件名之前使用\
  \ `#include`。其语法如下：\n\n```c\n#include<filename>\n```\n\n例如，\n\n```c\n#include<stdio.h>\n\
  ```\n\n它在程序中包含一个 `stdio.h` 头文件。它在系统目录的标准列表中搜索文件名。文件名必须写在尖括号中。\n\n## 宏展开指令\n\n`#define`\
  \ 用于在程序中编写宏。宏的名字必须大大写。在理解宏的概念之前，先分析以下程序。\n\n```c\n//Program 18.1 使用宏计算圆面积\n#include<stdio.h>\n\
  \n#define PI 3.141592\n\nvoid main()\n{\n    float area, r;\n    printf(\"Enter\
  \ the value of radius:\");\n    scanf(\"%f\",&r);\n    area=PI*r*r;\n    printf(\"\
  The area of a circle is:%f\",area);\n}\n```\n\n输出：\nEnter the value of radius: 3\n\
  The area of a circle is 28.274328\n\n在前面的程序中，`PI` 是宏名（宏模板），而值 `3.141592` 是宏展开。当预处理器在程序中遇到\
  \ `#define` 时，它会在整个程序中搜索所有的宏模板，并将它们替换为宏展开。\n\n因此，宏定义了一个符号名称。在代码实际编译之前，宏名会被替换为宏展开；例如，语句\
  \ `area=PI*r*r` 在替换后会变为 `area=3.141592 *r*r`。\n\n我们还可以像函数一样将变量传递给宏。分析以下程序：\n\n```c\n\
  //Program 18.2 将变量传递给宏\n#include<stdio.h>\n\n#define AREA(x) (3.141592*x*x)\n\n\
  void main()\n{\n    float r, a;\n    printf(\"Enter the value of radius:\");\n \
  \   scanf(\"%f\",&r);\n    a=AREA(r);\n    printf(\"The area of a circle is:%f\"\
  , a);\n}\n```\n\n输出：\nEnter the value of radius: 3\nThe area of a circle is: 28.274328\n\
  \n| 注意：`AREA` 和 `(x)` 之间没有空格。宏展开，即 `(3.141592*x*x)`，必须包含在括号内。 |\n\n## 宏与函数的区别\n\n\
  表 `18.1` 显示了宏与函数之间的区别：\n\n| 宏 | 函数 |\n| :--- | :--- |\n| 它的展开在预处理阶段发生。它是一个预处理器指令实体。\
  \ | 函数是编译实体。 |\n| 编译时错误无法被检测，因为它们在传递给编译器之前就已经处理了。 | 它会检查编译时错误。 |\n| 宏可能会导致代码重复，因为宏名在每次出现时都会被替换为其值，可能会增加编译后代码的大小。\
  \ | 函数促进了代码重用。它们可以定义一次并从程序的不同部分调用多次。这减少了代码重复。 |\n| 宏不进行类型检查，因为它们是纯粹的文本替换；也就是说，宏中的参数不对其类型进行求值。\
  \ | 函数执行类型检查。传递给函数的参数类型将与函数的参数类型进行比对。 |\n| 在某些情况下，执行时间比函数短。 | 函数的执行时间更长。 |\n| 宏名在编译之前被替换为宏值。\
  \ | 发生了从调用函数到被调用函数的控制转移。 |\n| 当小代码被多次使用时，它很有用。 | 当大代码需要使用几次时，它很有用。 |\n| 宏没有返回值。\
  \ | 函数可以返回值。 |\n\n表 18.1: 宏与函数的对比\n\n## 条件指令\n\n条件指令在预处理阶段根据特定条件包含或排除代码段。两个主要的指令是：\n\
  \n-   `#ifdef` 和 `#endif`\n-   `#if` 和 `#elif`\n\n### #ifdef 和 #endif\n\n这些用于根据预处理器符号的存在有条件地包含或排除代码段。其语法如下：\n\
  \n```c\n#define macro_name\nvoid main()\n{\n    #ifdef macro_name\n    语句 1;\n \
  \   #endif\n    语句 2;\n}\n```\n\n如果 `macro_name` 在程序中已定义，则该代码块将被执行；否则将被跳过。请看以下程序。\n\
  \n```c\n// Program 18.3 实现 #ifdef 和 #endif\n#include<stdio.h>\n\n#define macro1\n\
  void main()\n{\n    #ifdef macro1\n        printf(\"HEY!\\n\");\n    #endif\n  \
  \  #ifdef macro2\n        printf(\"Hello!\\n\");\n    #endif\n}\n```\n\n输出：\nHEY!\n\
  \n注意：`macro2` 在程序中没有定义，因此被跳过了。\n\n### #if 和 #endif\n\n`#if` 和 `#endif` 指令在编译过程中根据特定条件包含或排除代码段。`#if`\
  \ 提供了一个由编译器评估的条件。如果条件为真（非零），则包含 `#if` 后的代码。如果条件为假，则跳过。`#endif` 指令标记块的结束。它的工作方式与\
  \ `else if` 链类似。\n\n```c\n// Program 18.4 展示 #if 和 #endif 的用法\n#include<stdio.h>\n\
  \n#define NUM 1\n\nvoid main()\n{\n    #if NUM < 1\n        printf(\"Hello 1!\\\
  n\");\n    #elif NUM < 2\n        printf(\"Hello 2!\\n\");\n    #else\n        printf(\"\
  Hello 3!\\n\");\n    #endif\n}\n```\n\n输出：\nHello 2!\n\n## 未定义指令\n\n用于移除之前定义的宏定义。例如，`#undef`\
  \ 是一个未定义指令。\n\n### #undef\n\n`#undef` 指令用于取消或移除之前定义的宏定义。阅读以下代码：\n\n```c\n#define\
  \ PI 3.14159\n// 使用 PI 的代码\n#undef PI\n// PI 宏现在未定义\n// 不使用 PI 的代码\n```\n\n`#define`\
  \ 指令定义了宏 `PI` 并将其赋值为 `3.14159`。`#define PI 3.14159` 之后的将使用它。`#undef` 指令用于移除 `PI`\
  \ 宏。这意味着 `#undef` 指令之后的任何代码都不能再使用 `PI` 宏：\n\n```c\n// Program 18.5 展示 #undef 指令的用法\n\
  #include <stdio.h>\n\n#define PI 3.14159\n\nint main()\n{\n    // 使用 PI 的代码\n  \
  \  double radius = 5.0;\n    double circumference= 2*PI*radius;\n    printf(\"The\
  \ circumference of a circle=%f\\n\",circumference);\n\n    #undef PI\n    // PI\
  \ 宏现在未定义\n    // 不使用 PI 的代码\n}\n```\n\n\n\n\n\n```\n//double area = PI*radius*radius;\
  \ the statement will not work here\n\n//printf(\"The area of a square=%.2f.\\n\"\
  ,area);\n\nreturn 0;\n\n}\n```\n\n输出：\n\n圆周长=31.42\n\n在前面的程序中，使用了 `#undef` 指令来移除\
  \ `PI` 宏。在 `#undef PI` 指令之后的任何代码都无法再次使用 `PI` 宏。\n\n## 结论 (#contents.xhtml_sc2_407a)\n\
  \n本章详细介绍了预处理的细节。预处理器提供了允许文件包含、宏展开、条件编译和宏取消指令。`#include` 指令包含文件，实现了模块化的代码组织。使用 `#define\
  \ 定义的宏提供了文本替换，而 `#undef` 则移除宏定义。`#ifdef`、`#endif`、`#if` 和 `#elif` 等条件指令根据条件控制代码的包含。\n\
  \n后续章节将处理文件，包括对文件进行的各种操作。此外，它将通过 `malloc()`、`calloc()`、`realloc()` 和 `free()` 等各种函数阐明动态内存分配的概念，这对于程序中高效内存内存至关重要。\n\
  \n## 记忆要点 (#contents.xhtml_sc2_408a)\n\n*   C 语言中的预处理器是一个在编译前对源代码进行各种处理的工具。\n* \
  \  预处理器指令是预处理器的指令，通过行开头的 `#` 符号指定。\n*   文件包含指令（`#include`）用于将其他文件的内容包含当前源文件中。\n\
  *   宏展开指令（如 `#define`）允许定义用于文本替换的宏。\n*   宏展开可以使用对象类宏（`#define`）或函数宏（带参数的 `#define`）完成。\n\
  *   条件指令（如 `#ifdef`、`#endif`、`#if` 和 `#elif`）根据条件控制代码段的编译。\n*   取消指令（`#undef`）移除之前定义的宏的定义。\n\
  *   `#include` 指令通常包含标准库头文件或用户定义的头文件。\n*   `#ifdef` 检查宏是否已定义，如果是，则包含后续代码块，而 `#endif`\
  \ 标记该块的结束。\n*   `#if` 指令评估常量表达式，如果表达式为真，则包含后续块。\n*   `#elif` 指令与 `#if` 配合使用，指定额外的条件，类似于\
  \ else-if 阶梯。\n*   宏由预处理器展开，而函数在运行时被编译并执行。\n*   宏不进行类型检查，如果使用不当，可能会导致意想不到的行为。\n\
  *   与宏相比，函数提供了模块化、代码可重用性和类型安全。\n\n## 重要问题 (#contents.xhtml_sc2_409a)\n\n1.  预处理器的目的是什么？\n\
  2.  在源代码中如何识别预处理器指令？\n3.  文件包含指令（`#include`）的作用是什么？\n4.  `#define` 指令是如何促进宏展开的？\n\
  5.  什么是条件指令？请举一个合适的例子进行解释。\n6.  `#ifdef` 和 `#endif` 指令如何协同工作实现条件编译？\n7.  `#if` 指令的目的是什么？你如何使用\
  \ `#elif` 指令指定额外的条件？\n8.  `#undef` 指令的意义是什么？\n9.  通常如何使用 `#include` 指令包含头文件？\n10.\
  \ 宏的常见用途有哪些？\n11. 宏展开和函数执行之间有什么区别？\n12. 在不仔细考虑的情况下使用宏有哪些潜在风险？\n13. 函数相比宏提供了哪些优势？\n\
  14. 预处理器指令如何影响源文件的大小？\n15. 使用预处理器指令时有哪些最佳实践？\n\n加入我们书籍的 Discord 空间\n\n加入书籍的 Discord\
  \ 工作区，以获取最新更新、优惠、全球科技动态、新发布内容以及与作者的交流会：\n\n`https://discord.bpbonline.com`\n\n![](img/fm1.png)\n\
  \n# 第 19 章 C 语言中的文件处理 (#contents.xhtml_ch19a)\n\n## 引言 (#contents.xhtml_sc2_410a)\n\
  \n本章探索了 C 语言编程中文件处理和内存分配的世界。文件对于数据存储和检索至关重要，理解如何操作它们是一项基本技能。在接下来的章节中，我们将讨论文件的重要性、文件的类型以及使用内置函数执行的操作。此外，我们将深入探讨使用\
  \ `malloc()`、`calloc()`、`free()` 和 `realloc()` 等函数的动态内存分配技术，这些对于程序中高效内存内存至关重要。\n\
  \n## 结构 (#contents.xhtml_sc2_411a)\n\n在本章中，我们将讨论以下主题：\n\n*   文件\n*   文件的需求\n*  \
  \ 文件的类型\n*   通过内置函数对文件进行的操作\n    *   打开文件\n    *   读取文件\n    *   关闭文件\n    *   删除文件\n\
  *   内存分配\n    *   `malloc()`\n    *   `calloc()`\n    *   `free()`\n    *   `realloc()`\n\
  \n## 目标 (#contents.xhtml_sc2_412a)\n\n本章旨在提供全面理解编程中的文件处理和内存分配。读者将学习文件的重要性、不同的文件类型以及如何使用内置函数对文件进行操作。此外，本章涵盖了使用\
  \ `malloc()`、`calloc()`、`free()` 和 `realloc()` 等函数的内存分配技术，使读者掌握内存管理和优化的基本技能。\n\n\
  ## 文件 (#contents.xhtml_sc2_413a)\n\n存储在辅助存储设备（如硬盘）中的一组相关数据被称为文件。文件处理是用于从文件中存储和检索信息的的基本概念。C\
  \ 语言中的文件处理涉及创建、打开、读取、写入和关闭文件。文件处理操作通过文件指针和标准库提供的系列函数来实现。\n\n## 文件的需求 (#contents.xhtml_sc2_414a)\n\
  \n程序的输出通常接收在显示器上。有时，在屏幕上显示数据是不够的。显示的数据可能很大，而且屏幕有限。由于内存（RAM）是易失性的，不适合永久存储数据。文件克服了这些限制。文件可以用于永久存储未来需要的数据。文件存储在硬盘等非易性内存中。我们在需要时访问存储的文件。\n\
  \n## 文件的类型 (#contents.xhtml_sc2_415a)\n\n通常，C 处理以下两种类型的文件：\n\n*   文本文件：包含人类可读的文本数据。文件中的字符使用\
  \ ASCII 编码表示。文本文件通常使用编辑器创建和编辑。文本文件使用 `fopen()`、`fprintf()`、`fscanf()`、`fgets()`\
  \ 和 `fputs()` 等函数进行处理。\n*   二进制文件：以二进制格式存储数据，这意味着它们包含任何类型的数据，包括图像、音频、视频等非文本数据。当数据的精确表示至关重要时使用二进制文件。二进制文件使用\
  \ `fread()`、`fwrite()` 和 `fseek()` 等函数进行处理。\n\n## 通过内置函数对文件进行的操作 (#contents.xhtml_sc2_416a)\n\
  \n通过 `stdio.h` 头文件中的内置函数，我们可以对文件执行以下操作：\n\n*   创建文件：为了对文件进行操作，必须先创建它。文件是由 `fopen()`\
  \ 函数创建的。\n*   打开文件：可以使用 `fopen()` 函数打开文件，与创建类似。打开文件允许读取或修改其内容。\n\n\n\n\n\n*   读取文件：可以使用\
  \ `fscanf()` 或 `fgets()` 等函数读取文件数据。这些函数从文件中检索数据并将其存储在变量中以供后续处理。\n*   写入文件：可以使用 `fprintf()`\
  \ 或 `fputs()` 等函数将数据写入文件。\n*   关闭文件：在我们完成对文件的操作后，必须使用 `fclose()` 将其关闭。这一步骤确保了文件占用的所有系统资源都被释放。\n\
  *   删除文件：使用 `remove()` 来删除文件。\n\n### 打开文件\n\n通过 `fopen()` 创建文件。它接受两个参数：一个是要创建的文件名（包括路径），另一个是打开文件时采用的模式（例如：`w`\
  \ 用于写入模式，`r` 用于读取，`a` 用于追加，`w+` 用于读、写和修改，`r+` 用于读、写和修改现有文件，`a+` 用于读取并在文件末尾添加新内容，等等）。\n\
  \n请看以下示例：\n\n```\nFILE *fp;\nfp=fopen(\"sum.c\", \"r\");\n```\n\n`sum.c` 文件将以读取模式\
  \ (`r`) 打开，并设置一个指向文件第一个字符的指针 `fp`。该指针由 `FILE *fp` 声明。指针 `fp` 的类型为指向 `FILE` 的指针。如果由于由于原因无法打开（例如文件损坏、磁盘不可用等），`fp`\
  \ 将返回 `NULL`。\n\n`fopen()` 的工作原理如下：\n\n1. 它查找你想要打开的文件。\n2. 它从磁盘检索文件并将其放入内存中一个称为缓冲区的临时内存。\n\
  3. 它将第一个字符的地址分配给文件指针，如图 19.1 所示。\n4. 如果无法打开文件，指针将返回 `NULL`。\n\n### 读取文件\n\n使用 `fgetc()`\
  \ 通过 `fopen()` 中使用的指针从当前位置读取一个字符。请看以下示例：\n\n```\nch = fgetc(fp);\n```\n\n它读取变量 `ch`\
  \ 中的字符，并将指针 `fp` 增一。如果指针返回 `EOF`，则意味着没有更多字符可以读取。`EOF` 是一个宏，定义在 `stdio.h` 头文件中。`EOF`\
  \ 字符放置在文件末尾，表示结束。\n\n查看图 19.1，图中磁盘上包含两个文件：`Abc.txt` 和 `sum.c`。内存中的缓冲区持有 `Abc.txt`\
  \ 的所有字符并以 `EOF` 字符结束。字符指针 `fp` 指向第一个字符。\n\n参考图 19.1：\n\n![](img/Figure_19.1.png)\n\
  \n图 19.1: 次级存储器文件\n\n### 关闭文件\n\n完成所有任务后，必须关闭文件以释放文件占用的资源。以下给出了关闭文件的示例：\n\n```\n\
  fclose(fp);\n```\n\n它关闭具有指针 `fp` 的文件。\n\n### 删除文件\n\n`remove()` 函数删除参数中指定的文件。该函数可以在\
  \ `stdio.h` 文件中找到。请查看程序 19.7 了解其工作。考虑以下语句：\n\n```\nint d = remove(\"abc.c\");\n\
  ```\n\n其中 `abc.c` 是我们想要删除的文件。如果删除成功，它返回零；否则返回一个非零值。\n\n```c\n// 程序 19.1 以读取模式打开文件并在输出屏幕上显示其内容\n\
  #include<stdio.h>\n\nvoid main()\n{\n    FILE *fp;\n    char ch;\n    fp=fopen(\"\
  sum.c\",\"r\");\n    while(1)\n    {\n        ch=fgetc(fp);\n        if(ch==EOF)\n\
  \            break ;\n        printf(\"%c\",ch);\n    }\n    fclose (fp) ;\n}\n\
  ```\n\n输出：\n如果文件 `sum.c` 存在，则打印该文件的内容。\n\n要查看结果，请在当前工作目录（文件夹）创建一个 `sum.c` 文件，添加一些文本，然后运行程序。程序将在屏幕上显示文件的文本。\n\
  \n```c\n// 程序 19.2 将一个文件的内容复制到另一个文件中\n#include <stdio.h>\n#include <stdlib.h> //for\
  \ exit(0) function\n\nvoid main()\n{\n    FILE *fp1,*fp2;\n    char c;\n    // 打开一个文件进行读取\n\
  \    fp1=fopen(\"source.c\",\"r\");\n    if(fp1==NULL)\n    {\n        printf(\"\
  Cannot open file\");\n        exit(0);\n    }\n    fp2=fopen(\"target.c\", \"w\"\
  ); // 如果不存在则创建\n    if(fp2==NULL)\n    {\n        printf(\"Cannot open file\");\n\
  \        exit(0);\n    }\n    // 读取文件内容\n    while (1)\n    {\n        c = fgetc(fp1);\
  \ // 从源文件读取一个字符\n        if(c==EOF) // 检查文件结束\n            break;\n        else\n\
  \            fputc(c,fp2);// 向目标文件写入一个字符\n    }\n    fclose(fp1);\n    fclose(fp2);\n\
  }\n```\n\n输出：\n文件 `sum.c` 的内容被复制到 `target.c`。\n\n\n\n\n\n*   `sizeof()` 是一个用于计算\
  \ `data_type` 大小的运算符，并以字节为单位返回结果。\n\n*   它接受一个形式为 `n * sizeof(data_type)` 的参数，这是要分配的总空间。用户在运行时给出\
  \ `n` 的值。`n` 的值与类型类型相乘。\n\n例如：\n\n```c\nint* ptr;\n\nptr = (int*) malloc(10 * sizeof(int));\n\
  ```\n\n该语句动态分配了等同于 10 个整数大小的空间。语句成功执行后，第一个位置的地址被赋值给指针 `ptr`。如果无法分配内存，`ptr` 将被赋值为\
  \ `NULL` 指针。\n\n```c\n// 程序 19.8 使用 malloc 函数计算用户输入的 n 个数字之和\n\n#include <stdio.h>\n\
  \n#include <stdlib.h>\n\nint main()\n{\nint *ptr;\nint n, i, sum = 0;\nprintf(\"\
  Enter the number of elements: \");\nscanf(\"%d\", &n);\nptr = (int*) malloc(n *\
  \ sizeof(int));\nif(ptr == NULL) // 如果无法分配内存\n{\nprintf(\"Error! Memory not allocated.\"\
  );\nexit(0);\n}\nprintf(\"Enter elements: \");\nfor(i = 0; i < n; i++)\n{\nscanf(\"\
  %d\", &ptr[i]);\nsum = sum + *(ptr + i);\n}\nprintf(\"Sum = %d\", sum);\nfree(ptr);\
  \ // 释放 malloc() 分配的空间\nreturn 0;\n}\n```\n\n输出：\n```\nEnter the number of elements:\
  \ 5\nEnter elements: 1\n3\n5\n7\n9\nSum = 25\n```\n\n## calloc()\n\n`calloc` 代表连续分配（contiguous\
  \ allocation）。它同样在运行时（动态地）分配内存。默认情况下，它将分配的内存初始化为零。如果分配内存失败，它返回 `NULL`。通常，它的写法如下：\n\
  \n```c\ncast_type* ptr;\n\nptr = (cast_type*) calloc(n, sizeof(data_type));\n```\n\
  \n其中：\n\n*   `ptr` 是一个 `cast_type` 类型的指针。\n*   `malloc()` 是函数名（注此处原文可能应为 calloc）。\n\
  *   `n` 是 `data_type` 类型的内存块数量。\n*   `sizeof()` 是用于计算 `data_type` 大小的运算符。\n*   它接受两个参数：`n`\
  \ 和 `sizeof(data_type)`。\n\n例如：\n\n```c\nint* ptr;\n\nptr = (int*) calloc(10, sizeof(int));\n\
  ```\n\n该语句动态分配了等同于 10 个整数大小的空间。语句成功执行后，第一个位置的地址被赋值给指针 `ptr`。如果无法分配内存，`ptr` 将被赋值为\
  \ `NULL` 指针。\n\n```c\n// 程序 19.9 计算用户输入的 n 个数字之和\n\n#include <stdio.h>\n\n#include\
  \ <stdlib.h>\n\nint main()\n{\nint *ptr;\nint n, i, sum = 0;\nprintf(\"Enter the\
  \ number of elements: \");\nscanf(\"%d\", &n);\nptr = (int*) calloc(n , sizeof(int));\n\
  if(ptr == NULL) // 如果无法分配内存\n{\nprintf(\"Error! memory not allocated.\");\nexit(0);\n\
  }\nprintf(\"Enter elements: \");\nfor(i = 0; i < n; i++)\n{\nscanf(\"%d\", &ptr[i]);\n\
  sum = sum + ptr[i];\n}\nprintf(\"Sum = %d\", sum);\nfree(ptr); // 释放 calloc() 分配的空间\n\
  return 0;\n}\n```\n\n输出：\n```\nEnter the number of elements: 5\nEnter elements:\
  \ 1\n2\n3\n4\n5\nSum = 15\n```\n\n## free()\n\n系统本身会释放静态内存分配的空间，但在动态分配内存的情况下，必须由用户来释放。因此，使用\
  \ `free()` 函数来释放动态占据的空间。其语法如下：\n\n```c\nfree(ptr);\n```\n\n`ptr` 是在 `malloc()` 和\
  \ `calloc()` 中使用的指针。\n\n## realloc()\n\n`realloc` 代表重新分配（re-allocation）。`realloc()`\
  \ 函数用于调整或重新分配动态分配内存块的大小。它允许我们增加或减少之前分配的空间。它接受两个参数：一个指针和想要分配的新字节大小。如语法所示，它接受两个参数。通用语法如下：\n\
  \n```c\nptr = realloc(ptr, n * sizeof(data_type));\n```\n\n其中：\n\n*   `ptr` 是在 `malloc()`\
  \ 或 `calloc()` 中使用的指针。\n*   `realloc()` 是函数名。\n*   `n` 是 `data_type` 类型的内存块数量。\n\
  *   `sizeof()` 是用于计算 `data_type` 大小的运算符。\n\n例如：\n\n```c\nint *ptr;\n\nptr = realloc(ptr,\
  \ n * sizeof(int));\n```\n\n```c\n// 程序 19.10 计算用户输入的 n 个数字之和\n\n#include <stdio.h>\n\
  \n#include <stdlib.h>\n\nint main()\n{\nint n, n1, i, *ptr, sum=0;\nprintf(\"Enter\
  \ number of elements: \");\nscanf(\"%d\",&n);\nptr = (int*) calloc(n,sizeof(int));\n\
  if(ptr==NULL) // 如果无法分配内存\n{\nprintf(\"Error! memory not allocated.\");\nexit(0);\n\
  }\nprintf(\"Enter elements: \");\nfor(i=0;i<n;i++)\n{\nscanf(\"%d\",&ptr[i]);\n\
  sum = sum +ptr[i];\n}\nprintf(\"Sum = %d\",sum);\nprintf(\"\\nEnter the new size:\
  \ \");\nscanf(\"%d\",&n1);\n//重新分配内存\nptr = realloc(ptr,n1*sizeof(int));\nprintf(\"\
  Enter some more elements: \");\nfor(i = 0;i<n1;i++)\n{\nscanf(\"%d\",&ptr[i]);\n\
  sum = sum+ptr[i];\n}\nprintf(\"Sum=%d\",sum);\nfree(ptr); // 释放\nreturn 0;\n}\n\
  ```\n\n输出：\n```\nEnter number of elements:4\nEnter elements:1\n2\n3\n4\nSum=10\n\
  Enter the new size:5\nEnter some more elements:1\n2\n3\n4\n5\nSum=25\n```\n\n##\
  \ 结论\n\n本章探讨了 C 语言中的文件处理，涵盖了文本文件和二进制文件。下一章将引入时间复杂和空间复杂度的概念。\n\n\n\n\n\n## 结构\n\n\
  在本章中，我们将讨论以下主题：\n\n* 算法分析\n* 渐近表示法\n    * 大 O 符号 (Big-Oh)\n    * Omega\n    * Theta\n\
  * 为什么用大 O？\n* 测量时间复杂度\n* 测量空间复杂度\n* 大 O 渐近表示法之间的关系\n* 时间复杂度\n* 空间复杂度\n\n## 目标\n\n\
  本章旨在让人对算法分析和渐近表示法有全面的理解。读者将学习如何使用 `Big-Oh`、`Omega` 和 `Theta` 表示法来评估算法效率，以及这些表示法的重要性。本章还涵盖了时间和复杂度的测量、渐近表示法之间的关系以及如何分析算法性能。这些知识为读者设计和评估高效算法提供了必要的技能。\n\
  \n# 算法\n\n算法是完成特定任务或解决特定问题的一系列步骤。算法用于许多领域，包括计算机科学、数学、工程和日常问题解决。在计算机科学中，算法对于编写计算机程序尤为重要。\n\
  \n它是一种解决问题的系统方法，提供了一个清晰且无歧的操作序列，遵循该序列就能得到预期的结果。\n\n更好的算法具有以下特征：\n\n* **定义良好的步骤**：算法必须具有精确定义且无歧的步骤，这些步骤必须是清晰易懂的。\n\
  * **有限性**：算法必须在有限的时间内结束。\n* **输入**：算法接收输入。\n* **输出**：算法产生输出。\n* **确定性**：在每次执行时，对于相同的输入应该产生相同的输出。\n\
  * **有效性**：它应该解决问题。每一步都应该有其目的。\n* **可行性**：可以使用可用资源（如时间、内存和计算能力）实现算法。\n* **正确性**：它对所有有效输入都应该产生正确的输出。\n\
  * **最优性**：在时间和内存使用方面，它应该达到最好的解决方案。优化的算法比未优化的算法更高效。因此，始终优选优化算法而非未优化算法。\n\n# 算法分析\n\
  \n它是研究算法效率的学科。效率根据算法解决特定问题所花费的时间空间来计算。分析算法所花费的时间空间的技术术语分别是时间复杂和空间复杂度。\n\n# 为什么需要算法分析？\n\
  \n让我们分析以下两个程序，它们用于计算 n 个数字数的和。问题是：哪一个更好？\n\n```c\n//Program 20.1 使用循环计算两个数字之和\n\
  #include<stdio.h>\n\nvoid main()\n{\n    double sum, n,i;\n    printf(\"Enter the\
  \ value of n:\");\n    scanf(\"%lf\",&n);\n    sum=0;\n    for(i=0;i<n;i++)\n  \
  \  {\n        sum=sum+i;\n    }\n    printf(\"The sum is:%lf\",sum);\n}\n```\n输出:\n\
  Enter the value of n:10000000000\nThe sum is:49999999990067864000.000000\n\n```c\n\
  //Program 20.2 使用公式计算两个数字之和\n#include<stdio.h>\n\nvoid main()\n{\n    double sum,\
  \ n,i;\n    printf(\"Enter the value of n:\");\n    scanf(\"%lf\",&n);\n    sum=0;\n\
  \    sum=(n*(n-1))/2;;\n    printf(\"The sum is:%lf\",sum);\n}\n```\n输出:\nEnter\
  \ the value of n: 10000000000\nThe sum is: 49999999994999996000.000000\n\n当我们执行这些程序时，第一个程序花费的时间比第二个程序长。因此，第二个程序更高效。应该存在某种机制来衡量程序的效率并选择更好的那一个。\n\
  \n以下是说明为什么需要算法分析的关键点：\n\n* **算法选择**：算法分析有助于在将算法实现为程序之前，为问题选择最合适的算法。\n* **性能预测**：通过算法分析，我们可以在实际实现之前估计算法的运行时间和内存占用。\n\
  * **效率评估**：算法分析以时间和空间复杂度的形式告诉我们不同算法的有效性。\n* **设计改进**：算法分析使我们能够识别算法在设计和实现中可以改进的地方。\n\
  * **扩展性行为**：算法分析有助于理解算法随输入规模增长而变化的性能情况。这一知识对于高效处理大规模规模问题至关重要。\n* **研究与创新**：算法分析是计算机科学研究和创新的基础。它为开发新算法、改进现有算法以及推进对算法效率的理论理解提供了基础。\n\
  \n表示算法时间和空间复杂度的方法被称为渐近表示法。\n\n# 渐近表示法\n\n它是一种表示方法，告诉我们在不执行程序的情况下性能如何随着输入规模的增大而变化。使用渐近表示法，我们可以衡量算法的最佳情况、平均情况和最坏情况，描述如下：\n\
  \n* **最好情况**描述了算法对于给定输入规模执行时可能花费的最短时间。它也被称为下界。\n* **最坏情况**代表了算法对于给定输入规模可能花费的最长时间。它也被称为上界。\n\
  * **平均情况**描述了算法对于给定输入规模将花费的精确时间。它被称为紧确界（tight bound）。\n\n通常，渐近法中使用三种表示法：`Big-Oh`、`Omega`\
  \ 和 `Theta`。\n\n# Big-Oh\n\n`Big-Oh` 代表算法对于给定输入规模可以的最大的时间。它也被称为上界。`f(n) = O(g(n))`\
  \ 表示 `f(n)` 的增长速度不于 `g(n)`。\n\n常数 `C` 和 `f(n) <= C * g(n)` 对于所有 `n >= k`，其中 `C >\
  \ 0` 和 `k >= 0`。\n\n![Relationship between f(n) and g(n)](img/Figure_20.1.png)\n\
  \n图 20.1 显示在某个值 `k` 之后，`g(n)` 将始终大于 `f(n)`。\n\n`f(n) = O(g(n))` Eq.(1)\n\n方程 (1)\
  \ 可以读作 `f of n` 是 `g of n` 的大 O。通过插入常数 `C`，也可以写成方程 (2)：\n\n`f(n) <= C * g(n)` Eq.(2)\n\
  \n方程 (2) 对于 `n >= k` 成立。\n\n示例 1：为函数 `f(n) = n+10` 和 `g(n) = n` 找到 `k` 和 `C`。\n\n\
  由于 `f(n) = O(g(n))`\n\n且 `f(n) <= C * g(n)`\n\n代入函数的值。\n\n所以，`(n+10) <= C*n` Eq.(1)\n\
  \n为了满足这个方程，让我们选择 `C = 1` 和 `n = 0` 并代入前面的方程 (1)，然后\n\n`0+10 <= 1*0`\n\n`10<=0`，该条件不满足。\n\
  \n让我们选择 `C = 2`，`n = k = 10`，那么方程 (1) 变为：\n\n`20<=20`\n\n因此对于 `C = 2` 和 `k >= 10`，函数\
  \ `g(n)` 将始终大于 `f(n)`。\n\n`(n+10) = O(n)`\n\n示例 2：用大 O 表示 `f(n) = 3n² + n + 10`\
  \ 和 `g(n) = n²`。\n\n如我们知，`f(n) <= C * g(n)` Eq. (1)\n\n`(3n² + n + 10) <= C.(n²)`\n\
  \n\n\n\n为了满足前面的方程，考虑 `C = 5`，`n = k = 2`，并代入前面的方程 (1)\n\n```\n12+2+10 <= 5*4\n24<=20,\n\
  ```\n\n条件不满足。因此，对于 `C = 5`，现在取 `n = 3 = k = 3`。通过将这些值代入方程 (1)，得到：\n\n```\n40<=45,\n\
  ```\n\n因此对于 `C = 5` 且 `n >= 3`：\n`(3n² + n + 10) <= C.(n²)` 或我们可以说：\n`(3n² + n +\
  \ 10) = O(n²)`\n\n### 如何选择 C 和 k 的值？\n\n将表达式中的所有项替换为最高次项（主导项）；表达式 `3n² + n + 10`\
  \ 可以写为 `3n² + n² + n²`。将所有项相加得到 `5n²`。该项的系数是 `5`。因此，取 `C` 的值为 `5`。现在根据 Big-Oh 的定义，表达式\
  \ `(3n² + n + 10) = O(n²)` 可以写为 `(3n² + n + 10) <= 5.(n²)`。\n\n当 `n=1` 时，表达式如下：\n\
  \n```\n(3.1² + 1 + 10) <= 5.(1²)\n14 <= 5, 这是不成立的\n```\n\n当 `n=2` 时：\n\n```\n(3.2²\
  \ + 1 + 10) <= 5.(2²)\n23 <= 20, 这是不成立的\n```\n\n当 `n=3` 时：\n\n```\n(3.3² + 1 + 10)\
  \ <= 5.(3²)\n38 <= 45, 这是成立\n```\n\n从 `n=3` 开始，`f(n)` 的值将始终小于等于 `C.g(n)`，因此选择此值作为\
  \ `k=5`。\n\n### Omega\n\n它代表算法解决问题的时间下限（最小或至少限制）。它代表了最优情况。它描述了算法在给定输入规模下执行所需的最短时间。它由\
  \ `omega (Ω)` 表示。请参考图 20.2：\n\n![](img/Figure_20.2.png)\n\n图 20.2：Omega 中 `f(n)`\
  \ 与 `g(n)` 的关系\n\n图 20.2 描述了在某个值 `k`, `C` 之后，`g(n)` 将始终小于 `f(n)`。它可以通过方程 (1) 和 (2)\
  \ 表示：\n\n```\nf(n) = Ω g(n) Eq.(1)\nf(n) >= C.g(n) Eq.(2)\n```\n\n方程 2 对于每一个满足 `n>=k`\
  \ 的 `n` 都成立，其中：\n\n```\nC > 0\nn >= k\nk >= 0\n```\n\n示例 3：用 omega 表示函数 `f(n)= 3n²\
  \ + n`。\n\n我们需要找到 `g(n)`。选择 `g(n) = n²`，因为它是 `f(n)= 3n² + n` 中的主导项。根据 omega 的定义：\n\
  \n```\nf(n) >= C.(n²) put C=3\n3n² + n >= 3n² Eq.1\nn >= 3n² - 3n²\nn >= 0\n```\n\
  \n通过代入 `n=2` 进行检查：\n\n```\n3.2² + 2 >= 3.2²\n14 >= 12\n```\n\n因此对于所有的 `n >= 0` 和\
  \ `C = 3`，条件 `3n² + n >= 3n²` 成立，因此我们可以选择 `k` 的值为等于 `n`。用 omega 表示的函数如下：\n\n`f(3n²\
  \ + n)= Ω g(n²)`\n\n### Theta\n\n它代表算法解决问题所需的精确时间。它被用于表示平均情况。它告诉我们随着输入规模的增长，算法运行的精确速率。它由\
  \ `theta (Θ)` 表示。请参考图 20.3：\n\n![](img/Figure_20.3.png)\n\n图 20.3：Theta 中 `f(n)`\
  \ 与 `g(n)` 的关系\n\n图 20.3 描述了在某个值 `k`, `C` 之后，`f(n)` 将始终处于 `C2.g(n)` 和 `C1.g(n)`\
  \ 之间。它由方程 (1) 表示：\n\n```\nΘ.g(n) <= f(n) <= Θ.g(n) Eq.(1)\n```\n\n对于 `C1` 和 `C2`，也可以写成：\n\
  \n```\nC1.g(n) <= f(n) <= C2.g(n)\n```\n对于所有的 `n >= k`。\n\n\n\n\n\n## 引言\n\n如果一个算法需要常数时间，那么它就不依赖于输入长度\
  \ `n`，而线性时间则线性地依赖于输入。例如，如果我们增加了 `n` 的数量，时间将随之增加。渐进表示法之间的关系如下：\n\n`O(1) < O(log n)\
  \ O(n) < O(n log n) < O(n²) < O(n³)`\n\n请参考表 20.1：\n\n| n | O(1) | O(log n) | O(n)\
  \ | O(n log n) | O(n²) | O(n³) |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| 1 | 1 | 0 | 1 | 0 | 1 | 1 |\n| 2 | 1 | 1 | 2 | 2 | 4 | 8 |\n| 3 | 1 | 1.58\
  \ | 3 | 4.78 | 9 | 27 |\n| 4 | 1 | 2 | 4 | 8 | 16 | 64 |\n| 5 | 1 | 2.32 | 5 | 11.6\
  \ | 25 | 125 |\n| 6 | 1 | 2.58 | 6 | 15.48 | 36 | 216 |\n\n表 20.1：不同输入值 (n) 的大 O\
  \ 符号比较\n\n有关上表的图示表示，请参考图 20.4：\n\n![](img/Figure_20.4.png)\n\n图 20.4：代码占用空间与输入大小之间的关系\n\
  \n## 示例 5：计算函数 `f(n) = n(n-1)/2` 的大 O 复杂度\n\n`= (n² – n)/2`\n`= ½(n²) – ½(n)` (由于\
  \ `½` 是常数系数，所以可以舍弃)。\n`= (n² – n)`\n\n在这个表达式中，与 `n` 相比，`n²` 是主导项。因此，移除 `n`，前面的表达式在大\
  \ O 形式下表示如下：\n\n`= O(n²)`\n\n## 示例 6：计算以下函数的大 O 复杂度。同时找到 `C` 和 `k`\n\n`f(n) = 4n³\
  \ + 6n² + 3`\n\n在这个表达式中，与 `6n²+3` 相比，`4n³` 是主导项。因此移除项 `6n²+3`，前面的表达式可以表示：\n\n`=\
  \ 4n³`\n\n由于 `4` 是常数系数，可以舍弃，大 O 形式的表达式可以表示：\n\n`= O(n³)`\n\n`4n³ + 6n² + 3 = O(n³)`\n\
  \n将左侧的所有项替换为主导项（`(n³`）我们我们得到：\n\n`4n³ + 6n³ + n³ = O(n³)`\n`11n³ = O(n³)`\n\n左侧项的系数是\
  \ `11`，因此选择 `C=11`。于是，表达式变为：\n\n`4n³ + 6n² + 3 <= 11(n³)`\n\n让我们选择 `k` 的值：\n\n取\
  \ `n=1`\n`4.1³ + 6.1² + 3 <= 11(1³)`\n`13<=11`，这是一个假条件。\n\n取 `n=2`\n`4.2³ + 6.2²\
  \ + 3 <= 11(2³)`\n`59 <= 88`\n\n因此选择 `k` 为 `2`。\n\n对于所有 `n>=2` 的值且 `C=11`，`C.g(n)`\
  \ 将始终始终大于 `f(n)`。\n\n## 示例 7：确定以下语句的时间复杂度\n\n```\nfor(j=1; j<=n; j++)\n    printf(\"\
  Hello\");\n```\n\n在此处，执行 `printf(\"Hello\")` 语句所花费的时间是常数，即为 `C`。请参考表 20.2：\n\n|\
  \ 循环变量 (j) 值 | 内部语句执行时间 |\n| :--- | :--- |\n| j = 1 | C |\n| j = 2 | C |\n| . |\
  \ . |\n| . | . |\n| j <= n | C |\n\n表 20.2：示例 7 中每次迭代的 `j` 值和花费的时间\n\n循环变量 `(j)`\
  \ 将执行最多 `n` 次，每次执行 `printf` 语句需要常数时间 `C`。因此，我们可以说执行循环的时间为：\n\n`Time = 循环执行的次数 *\
  \ 执行其内部语句/语句的时间`\n`= n * C`\n`= C.n`\n\n在大 O 符号法中，我们可以舍弃这个常数 `C`，因此前面的表达式在大 O 形式下表示：\n\
  \n`= O(n)`\n\n注意：在前面，对于循环变量 `j` 的每一步递增，循环执行 `n/1` 次，即 `n` 次。现在，如果每次递增/递减为 `2`，即\
  \ `j=2`，循环执行 `n/2` 次。通常，如果递增/递减为 `k`，即 `j=k`，循环执行 `n/k` 次。但最终，由于大 O 形式会舍弃常数项，得到了\
  \ `O(n)` 复杂度。\n\n## 示例 8：确定以下语句的时间复杂度\n\n```\nfor(j=n; j>1; j = j-10)\n    printf(\"\
  Hello\");\n```\n\n参考表 20.3：\n\n| 循环变量 (j) 值 | 内部语句执行时间 |\n| :--- | :--- |\n| j =\
  \ n | C |\n| j = n-10 | C |\n| j = n-20 | C |\n| . | . |\n| . | . |\n| j > 1 | C\
  \ |\n\n表 20.3：每次迭代的 `j` 值和执行时间\n\n所以，循环在 `j = 1` 时执行 `n, n-10, n-20, …………`。从前面可以看出\
  \ `n / 10 = P`，其中 `P` 代表循环的次数。为了得到 `n = 10^p` 中的 `p` 值，对两边进行对数运算，基数为 `10`，因为 `log1010\
  \ = 1`。所以前面的表达式变为：\n`log10n = p.log1010 = p`。\n\n简而言之，前面的程序执行最多 `log10n` 次，在大 O\
  \ 符号法中，时间复杂度可以表示：\n`= O(n)`\n\n## 示例 9：确定以下语句的时间复杂度\n\n```\nfor(j=1; j<n; j = j*2)\n\
  \    printf(\"Hello\");\n```\n\n参考表 20.4：\n\n| 循环变量 (j) 值 | 内部语句执行时间 |\n| :--- |\
  \ :--- |\n| j = 1 | C |\n| j = 2 | C |\n| j = 4 | C |\n| . | . |\n| . | . |\n| j\
  \ < n | C |\n\n表 20.4：每次迭代的 `j` 值和执行时间\n\n该循环执行 `2⁰, 2¹, 2², 2⁴ ..........` 并在 `2^p\
  \ = n` 时停止。所以让我们找到 `p` 的值，它是循环执行的次数。`2^p = n`。为了得到 `p` 值，对两边进行对数运算。`p.log2 = log2n`，因为我们知道\
  \ `log2 是 1`。所以这个表达式变为：\n`p = log2n`。简称，前面的程序执行 `log2n` 次，在大 O 符号法中，时间复杂度可以表示：\n\
  `= O(log n)`\n\n注意：对于循环变量 `j` 值乘以或除以某个因子 `q` 的程序，它以对数的形式给出性能（即 `log`）。\n\n## 示例\
  \ 10：确定以下语句的时间复杂度\n\n```\nfor(j=n; j>1; j = j/10)\n    printf(\"Hello\");\n```\n\
  \n参考表 20.5：\n\n| 循环变量 (j) 值 | 内部语句执行时间 |\n| :--- | :--- |\n| j = n | C |\n| j =\
  \ n/10 | C |\n| j = n/10² | C |\n| . | . |\n| . | . |\n| j > 1 | C |\n\n表 20.5：每次迭代的\
  \ `j` 值和执行时间\n\n该循环执行 `j = n, n/10, n/10², …………` 并在 `n/10^p = 1` 时停止。为了得到 `n = 10^p`\
  \ 中的 `p` 值，对两边进行基数为 `10` 的对数运算，因为 `log1010 = 1`。所以前面的表达式变为：\n`log10n = p.log1010\
  \ = p`。\n\n简而言之，前面的程序执行最多 `log10n` 次，在大 O 符号法中，时间复杂度可以表示：\n`= O(log n)`\n\n在大 O\
  \ 形式表示时，可以舍弃对数底。\n\n## 示例 11：确定以下语句的时间复杂度\n\n```\nfor(x=1; x<n; x = x++)\nfor(y=1;\
  \ y<n; y=y+2)\n    printf(\"Hello\");\n```\n\n参考表 20.6：\n\n| 外层循环变量 (x) 值 | 每个 x\
  \ 对应时 y 执行的次数 | 内部循环执行时间 |\n| :--- | :--- | :--- |\n| x = 1 | n / 2 | n/2 * C |\n\
  | x = 2 | n / 2 | n/2 * C |\n| . | . | . |\n| . | . | . |\n| x < n | n / 2 | n/2\
  \ * C |\n\n表 20.6：`x` 的值和执行时间\n\n对于 `x` 的每次迭代，内部语句执行最多 `n/2` 次，每个语句花费的时间为 `C`。因此，总花费的时间为：\n\
  `n/2*C + n/2*C + ………… + n/2*C`，共 `n` 次。\n`时间复杂度 = n * n/2 * C = ½ *C (n²)`。舍弃常数项\
  \ `½ *C` 表示大 O：\n`= O(n²)`\n\n## 示例 12：确定以下语句的时间复杂度\n\n```\nfor(x=1; x<n; x = x*2)\n\
  for(y=1; y<n; y = y*2)\n    printf(\"Hello\");\n```\n\n参考表 20.7：\n\n| 外层循环变量 x 值\
  \ | 每个 x 对应时 y 执行的次数 | 内部循环执行时间 |\n| :--- | :--- | :--- |\n| x = 1 | log n | log\
  \ n * C |\n| x = 2 | log n | log n * C |\n| x = 4 | log n | log n * C |\n| . | .\
  \ | . |\n| . | . | . |\n| x < n | log n | log n * C |\n\n表 20.7：示例 12 中 `x` 的值和执行时间\n\
  \n所以，每次 `x` 内部语句执行最多 `log n` 次，每个语句花费的时间为 `C`。因此，总花费的时间为：\n`log n *C + log n *C\
  \ …………………+ log n *C`，共 `log n` 次。\n`时间复杂度 = log n * (log n *C) = log n.log n`，舍弃常数\
  \ `C` 和对数底：\n`= O (log n.log n)`\n\n\n\n\n\n给定语句的空间复杂度是常数，即 O(1)，因为它不需要任何随输入规模 (n)\
  \ 比例缩放的额外空间。唯一使用的空间是用于循环变量（`x` 和 `y`），无论输入规模如何，它们需要的内存都是常数。`printf` 语句也没有增加空间复杂度，因为它只打印一个固定字符串（\"\
  Hello\"），并且不需要额外的内存分配。\n\n### 示例 13：确定以下语句的时间复杂度：\n\n```c\nx = 1;\nwhile(x<=n)\n\
  {\n    printf(\"Hello\");\n    x = x+10;\n    x = x-15;\n    x = x+10;\n}\n```\n\
  \n在这里，循环变量 `x = 5` 的整体变化值为 5。因此，此循环最多将执行 `n/5` 次。因此，执行此循环的总时间为：\n\n时间复杂度 = `C *\
  \ n/5`\n= `C/5 * (n)`， 舍弃常数项，用 `C/5` 表示大 O 符号\n= `O(n)`\n\n### 示例 14：确定以下语句的时间复杂度：\n\
  \n```c\nfor(x=1; x<n; x++)\nfor(y=1; y<n; y = y*2)\n    printf(\"Hello\");\n```\n\
  \n参考 表 20.8：\n\n| 外层循环变量 (x) 的值 | 每个 x 值对应的 y 执行的次数 | 内层循环语句执行时间 |\n| :--- | :---\
  \ | :--- |\n| x = 1 | log n | log n * C |\n| x = 2 | log n | log n * C |\n| . |\
  \ . | . |\n| . | . | . |\n| x < n | log n | log n * C |\n\n表 20.8：示例 14 中 `x` 的值和执行时间\n\
  \n因此，`x` 的每次迭代中内部语句最多执行 `log n` 次，每个语句的时间为 `C`。因此，所花费的总时间如下：\n\n`log n *C + log\
  \ n *C + ……………………+ log n *C`，重复 `n` 次。\n\n时间复杂度 = `n * (log n *C)`\n= `n.log n`，\
  \ 舍弃常数 `C` 和对数底以表示大 O 符号\n= `O (n.log n)`\n\n### 示例 15：确定以下语句的时间复杂度：\n\n```c\nfor(x=1;\
  \ x<n; x++)\nfor(y=1; y<n; y = y++)\n    printf(\"Hello\");\n```\n\n参考 表 20.9：\n\
  \n| 外层循环变量 (x) 值 | 每个 x 值对应的 y 执行的次数 | 内层循环语句执行时间 |\n| :--- | :--- | :--- |\n| x\
  \ = 1 | n | n * C |\n| x = 2 | n | n * C |\n| . | . | . |\n| . | . | . |\n| x <\
  \ n | n | n * C |\n\n表 20.9：示例 15 中的执行时间\n\n因此，`x` 的每次迭代中内部语句最多执行 `n` 次，每个语句的时间为\
  \ `C`。因此，所花费的总时间如下：\n\n`n*C + n*C + ……………………………+ n*C`，重复 `n` 次。\n\n时间复杂度 = `n *\
  \ (n*C)`\n= `n * n`， 舍弃常数 `C` 并用大 O 符号表示\n= `O (n²)`\n\n### 示例 16：确定以下语句的时间和空间复杂度：\n\
  \n```c\nfct(k)\nif k == 0\n    return 1\nelse\n    return k * fct(k - 1)\n```\n\n\
  #### 时间复杂度\n\n在每次递归调用中，函数执行常数量的工作（乘法和减法）。调用次数等于输入数字 `k` 的值，因为这里 `k` 的值减少了 1。因此，时间复杂度可以表示为\
  \ `O(k)`。\n\n例如，如果我们调用 `fct(4)`，函数将总共四次递归调用：`fct(3)`、`fct(2)`、`fct(1)` 以及最后的 `fct(0)`。每次调用都执行常数量的工作，导致线性时间复杂度。\n\
  \n#### 空间复杂度\n\n每次递归调用都会向栈中添加一个新的帧（空间）。每个帧所需的空间是常数。在这个阶乘函数中，调用栈的最大深度等于 `k` 的值。例如，如果我们调用\
  \ `fct(4)`，最大递归深度为 4。因此，空间复杂度可以表示为 `O(k)`。\n\n#### 结论\n\n本章涵盖了更优秀算法的特征以及用于衡量其效率的分析方法。一个良好的算法应该产生正确的结果，并通过以最少的资源消耗在合理的时间内完成任务来证明效率。算法分析涉及评估时间和空间复杂度。时间复杂度衡量运行时间如何随输入规模而增长，而空间复杂度则衡量所需的内存。渐近符号（包括大\
  \ O、Omega 和 Theta）描述了算法相对于输入规模的增长率。衡量时间复杂度涉及时间与规模之间的关系。\n\n#### 要点回顾\n\n*   算法分析是关于算法效率的评估。\n\
  *   空间复杂度衡量随输入规模变化的所需内存。\n*   时间复杂度衡量随输入规模变化的运行时间。\n*   渐近符号包括大 O、Omega 和 Theta，描述了算法相对于输入规模的增长率。\n\
  *   大 O 表示算法在给定输入规模下可能执行的最长时间。表示 `O`。\n*   Omega 表示算法的时间下限。描述了算法在给定输入规模下可能执行的最短时间。表示\
  \ `Ω`。\n*   Theta 表示算法解决问题的精确时间。它告诉我们随着输入规模增长，算法运行的精确速率。表示 `Θ`。\n*   大 O 符号通常优于其他渐近符号，因为它具有简单性、对上界的强调以及标准化。\n\
  \n#### 重要问题](#contents.xhtml_sc2_448a)\n\n1. 什么是算法？请举例说明。\n2. 更优秀算法的特征有哪些？\n3. 解释算法分析。为什么需要算法分析？\n\
  4. 算法分析如何帮助评估效率？\n5. 什么是渐近符号？\n6. 解释大 O 符号的概念及其在时间复杂度分析中的作用。\n7. Omega 在算法复杂度方面代表什么？\n\
  8. Theta 符号如何提供紧界？\n9. 我们如何选择 `C` 和 `k` 的值？\n10. 为什么我们优选大 O？\n11. 在算法分析中衡量时间复杂度的重要性是什么？\n\
  12. 在算法分析中衡量空间复杂度的意义是什么？\n13. 解释最坏情况时间复杂度的概念及其对算法分析的影响。\n14. 最坏和最好时间复杂度的区别是什么？\n\
