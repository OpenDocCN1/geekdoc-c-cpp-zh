  * 数据类型\n* 类型修饰符\n* 类型转换或强制\n* 变量声明 vs 定义\n\n## 目标\n本章旨在全面介绍 C 编程语言，涵盖其历史、意义和实际应用。它采用结构化的方法探索\
  \ C 的字符集、标记用法和程序结构。它提供了创建和运行 C 程序的实践经验，解释了头文件，深入探讨了数据类型和修饰符，并揭开了类型转换的神秘。本章还澄清了变量声明与定义之间的区别，为读者自信地接触\
  \ C 的基础概念和应用奠定了坚实的基础。\n\n## C 语言简介\n语言是彼此之间通信的过程，例如印地语和英语。为了与计算机通信，我们需要一种被称为编程语言的特殊语言。`C`\
  \ 是一种计算机编程语言。它用于编写与计算机通信的计算机程序。`C` 的创建是为了编写 `UNIX` 操作系统。Dennis Ritchie 于 1972 年在美国美国电话电公司（AT&T）贝尔实验室创建了它。它被命名为\
  \ `C`是因为它是 `B` 语言的继承者。\n\n## C 语言的历史\n以下是 `C` 编程语言历史发展的要点概述：\n\n* `ALGOL` 代表算法语言（Algorithmic\
  \ Language）。它是所有当前编程语言的母体。国际小组于 1960 年首次引入了它。\n* Martin Richard 于 1967 年创建了基础组合编程语言（`BCPL`）。\n\
  * Ken Thompson 于 1970 年创建了 `B` 编程语言。\n* Dennis Ritchie 于 1972 年创建了 `C` 编程语言。它被命名为\
  \ `C`是因为它是 `B` 语言的继承者。之前语言（如 `B` 和 `BCPL`）的某些特性在 `C` 中被继承。\n* 在 Brian Kerningham\
  \ 和 Dennis Ritchie 于 1978 年出版《C 程序设计》一书后，`C` 语言变得流行起来；因此，`C` 通常被称为 `K&R C`。\n* 美国国家标准协会（`ANSI`）小组于\
  \ 1989 年标准化了 `C` 语言，被称为 `ANSI C`，以确保其标准性。\n* 它于 1990 年被国际标准组织（`ISO`）委员会批准。`C89`\
  \ 或 `C90`（`ANSI/ISO C`）是该版本的名称。\n* 1999 年，`JAVA` 和 `C++` 的某些功能被引入 `C` 中，ISO 将其批准为\
  \ `C99`。\n\n`C` 语言发展的年代顺序见[图 6.1]。\n\n![](img/Figure_6.1.png)\n\n图 6.1：C 开发时间线\n\
  \n## 为什么选择 C？\n以下是为什么学习 `C` 编程语言对于任何渴望成为精通的程序员或深入软件开发领域的人来说都是基础的几个有力理由：\n\n* 在不学习\
  \ `C` 的情况下直接学习其他高级语言是不容易。许多语言如 `C++`、`Java` 和 `Python` 的语法都源自 `C`。因此，它被视为它们的基础语言。\n\
  * 它学习起来简单，因为它使用英语编写程序，英语是一种常用且易于理解的语言。\n* 你在 `C` 中编写的程序编译和执行速度比其他语言快得多。这是因为没有记录垃圾值、数组索引边界检查、运行时类型检查、异常处理和其他额外的处理开销。此外，它是一门基于编译器的语言，因为它使用编译器来执行程序，而编译器比解释器快。\n\
  * `C` 语言结合了低级语言和高级语言的优点。它速度很快，类似于与硬件紧密工作的低级语言；而且用户友好（易于编写代码），类似于高级语言。\n* 它具有可移植性，因为它的程序可以很容易转移到其他计算机。它在本质上是硬件无关的。\n\
  * 微控制器由用 `C` 编写的嵌入式程序运行。机器人、计算机自动化都使用这些微控制器。它与硬件紧密交互。\n* 由于速度快，许多操作系统和系统程序是用 `C`\
  \ 编写的，如 `UNIX`。此外由于其良好的速度，它也被用于游戏开发。\n\n## C 语言学习\n学习 `C` 语言与学习英语有相似之处。当我们学习英语时，首先学习符号或字母表，然后组合字母形成单词。此外，单词的集合形成句子，然后遵循语法规则的句子的集合形成段落。同样，在\
  \ `C` 中，我们首先学习符号，然后这些符号构成标记（变量、常量、关键字等）。此外，这些标记构成了指令、语句或命令，这些语句组合在一起形成一个程序。[图 6.2]\
  \ 显示了 C 学习步骤：\n\n![](img/Figure_6.2.png)\n\n图 6.2：C 学习步骤\n\n## C 字符或符号集\n它是编写有效\
  \ `C` 程序所需的字母、数字和特殊符号的集合。如果在程序中写这些字符以外的任何字符，编译器将生成错误。`C` 字符集包含以下项目：\n\n* 26 个英语字母（小写）：`a`\
  \ 到 `z`\n* 26 个英语字母（大写）：`A` 到 `Z`\n* 10 个数字字符：`0` 到 `9`\n* 31 个特殊字符：`#` `%` `^`\
  \ `&` `*` `(` `)` `-` `_` `=` `+` `~` `‘` `”` `:` `;` `?` `/` `|` `\\` `{` `}` `[`\
  \ `]` `,` `<` `>` `$` `@` `!`\n\n这 31 个特殊字符的符号和名称见[表 6.1]：\n\n| 符号 | 名称 | 符号 | 名称\
  \ | 符号 | 名称 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| `~` | 波浪号 (Tilde)\
  \ | `=` | 等于 (Equal to) | `;` | 分号 (Semi-colon) |\n| `%` | 百号 (Per cent sign) |\
  \ `&` | 取与符号 (Ampersand) | `]` | 右括号 (Right bracket) |\n| `|` | 竖线 (Vertical bar)\
  \ | `$` | 美元符号 (Dollar sign) | `!` | 感叹号 (Exclamation mark) |\n| `@` | 符号 (At the\
  \ rate symbol) | `/` | 斜斜杠 (Slash) | `,` | 逗号 (Comma) |\n| `+` | 加号 (Plus sign)\
  \ | `(` | 左括号 (Left parenthesis) | `{` | 左大 (Left brace) |\n| `<` | 小于 (Less than)\
  \ | `*` | 星号 (Asterisk) | `?` | 问号 (Question mark) |\n| `>` | 大于 (Greater than)\
  \ | `\\` | 反斜杠 (Backslash) | `.` | 点 (Period) |\n| `_` | 下划线 (Underscore) | `)`\
  \ | 右括号 (Right parenthesis) | `}` | 右大 (Right brace) |\n| `-` | 减号 (Minus sign)\
  \ | `′` | 单引号 (Apostrophe) | `#` | 号 (Number sign) |\n| `^` | 幂符号 (Caret) | `:`\
  \ | 冒号 (Colon) | | |\n| `[` | 左括号 (Left bracket) | `“` | 双引号 (Quotation mark) |\
  \ | |\n\n表 6.1：字符及其名称\n\n## 空格字符或转义序列\n某些字符组合形成特殊字符，被称为空白字符/执行字符/转义序列。它们由两个字符组成，但被视为单个字符。它们无法被打印，因此不会在显示器上。它们通常与\
  \ `printf` 使用。它由一个反斜杠 `\\` 后跟一个字母或数字组合组成。[表 6.2] 显示了一些常用的转义序列：\n\n| 符号 | 名称 | 用途\
  \ |\n| :--- | :--- | :--- |\n| `\\b` | 退格 (Back space) | 将光标移到上一个位置 |\n| `\\t` |\
  \ 水平制表 (Horizontal tab) | 插入水平制表 |\n| `\\v` | 垂直制表 (Vertical tab) | 插入垂直制表 |\n|\
  \ `\\r` | 回车 (Carriage return) | 移动到行首 |\n| `\\f` | 换页 (Form feed) | 移动到下一页的起始位置\
  \ |\n| `\\n` | 换行 (New line) | 移动到下一行 |\n| `\\\\` | 反斜杠 (Backslash) | 显示反斜杠 |\n\
  | `\\'` | 单引号 (Single quote) | 显示单引号 |\n| `\\\"` | 双引号 (Double quote) | 显示双引号 |\n\
  | `\\?` | 问号 (Question mark) | 显示问号 |\n| `\\0` | 空字符 (Null) | 用于字符串中的空字符 |\n| `\\\
  a` | 警报 (Alarm) | 产生蜂哔声 |\n\n表 6.2：空白字符\n\n## 格式说明符\n\n\n\n\n\n格式说明符指定了 `printf`\
  \ 和 `scanf` 等格式化输入输出语句中使用的变量的数据类型和格式，用于指定数据的显示或读取方式。\n\nC 语言中最常用的格式说明符如表 6.3 所示：\n\
  \n| 符号 | 用途 |\n| :--- | :--- |\n| %d | 显示整数 |\n| %f | 显示浮点数值 |\n| %c | 显示字符 |\n\
  | %s | 显示字符串 |\n| %p | 显示内存地址 |\n| %x | 显示十六进制值 |\n| %o | 显示八进制值 |\n\n表 6.3：格式说明符\n\
  \n这些说明符的前面有一个百分号（`%`），后面跟着可选的标志，用于改变输出格式。例如，`%d` 格式说明说明符可以使用以下标志进行修改：\n\n* `%5d`:\
  \ 在宽度为五个字符的字段中显示整数值\n* `%-5d`: 在宽度为五个字符的字段中显示整数值，并左对齐\n\n详细讨论将在第 17 章：控制台输入输出函数中提供。\n\
  \n## C 语言中的令牌](#contents.xhtml_sc2_167a)\n\n在 C 语言中，令牌（tokens）是最小的独立元素。例如，在英语中，如果不使用单词就无法构建句子。同样，如果不使用令牌，我们就无法编写\
  \ C 语句。令牌等同于英语中的单词。因此，我们可以说 C 语言中的令牌是创建 C 程序的构建块。\n\n### C 语言中令牌的分类](#contents.xhtml_sc3_168a)\n\
  \n令牌分为以下类别：\n\n* 关键字\n* 变量\n* 常量\n* 标识符\n* 运算符\n* 特殊符号\n\n让我们在接下来的章节中详细讨论这些类别。\n\
  \n### 关键字](#contents.xhtml_sc3_169a)\n\nC 语言关键字是 C 语言编程语言中具有特定含义和功能的保留字。C 语言共有 32\
  \ 个关键字。这些关键字不能在 C 程序中用作变量、函数或其他标识符名。它们是语言语法的一部分，用于定义程序的结构和行为。图 6.3 是 C 语言中 32 个关键字的列表：\n\
  \n![](img/Figure_6.3.png)\n\n图 6.3：C 语言 32 个关键字列表\n\n关键字的简要用法如下：\n\n* `auto`: 用于在代码块内声明局部作用域的变量。\n\
  * `break`: 结束循环或 switch 语句，并将控制转移到循环或 switch 语句之后的语句。\n* `case`: 用于 `switch` 语句中，指定要匹配的特定条件或值。\n\
  * `char`: 用于定义字符数据类型。\n* `const`: 用于将变量声明常量。\n* `continue`: 用于跳到下一次循环迭代。\n* `default`:\
  \ 用于 `switch` 语句中，当没有其他 case 匹配项时的默认条件。\n* `do`: 与 `while` 配合使用，创建一个名为 do-while\
  \ 的循环。\n* `double`: 用于定义双倍精度的浮点数据类型。\n* `else`: 用于在 `if` 语句条件为假时指定要执行的备选代码块。\n*\
  \ `enum`: 用于定义一组命名的整数常量。\n* `extern`: 用于声明在单独文件中定义的变量。\n* `float`: 用于定义单精度的浮点数据类型。\n\
  * `for`: 用于指定执行指定次数代码块的循环。\n* `goto`: 用于将控制转移到程序中带有标签的语句。\n* `if`: 用于指定条件语句，当特定条件为真时执行代码块。\n\
  * `int`: 用于定义整数数据类型。\n* `long`: 定义具有扩展范围的整数数据类型。\n* `register`: 用于将变量声明为寄存器变量，将其存储在\
  \ CPU 寄存器中以便快速访问。\n* `return`: 用于从函数返回值。\n* `short`: 定义比 `int` 范围更小的整数数据类型。\n* `signed`:\
  \ 用于定义有符号整数数据类型。\n* `sizeof`: 告诉变量或数据类型按字节的大小。\n* `static`: 具有局部作用域，并在函数调用之间保留其值。\n\
  * `struct`: 定义包含多个不同数据类型变量的结构体数据类型。\n* `switch`: 该关键字用于根据表达式的值指定多路分支语句。\n* `typedef`:\
  \ 为现有数据类型定义新名称。\n* `union`: 存储共享内存空间的不同数据类型。\n* `unsigned`: 用于定义无符号整数数据类型。\n* `void`:\
  \ 在函数名之前使用时表示函数不返回值。\n* `volatile`: 表示变量可以被外部源修改，且不应被编译器优化。\n* `while`: 一个执行指定次数代码块的循环。\n\
  \n### 变量](#contents.xhtml_sc3_170a)\n\n计算机内存被划分为单元（内存位置）。每个单元都有一个地址。变量是能够存储特定数据类型值的内存位置的名称。\n\
  \n\n\n\n它只能接受正或负整数值。它不接受实数或小数值。整数常数的范围从 –32768 到 +32767（对于 16 位编译器）。表 6.5 显示了一些有效和无效整数的示例：\n\
  \n| 整数常量 | 是否有效 |\n| :--- | :--- |\n| 10 | 有效 |\n| 9.5 | 无效，因为包含小数 |\n| -9 | 有效\
  \ |\n| 565656 | 无效，因为超出范围 |\n\n表 6.5：有效和无效的整数常量\n\n## 实数常量](#contents.xhtml_sc4_173a)\n\
  \n它包含小数（实数）或浮点数。这些数字由两部分组成：小数点之前和小数之后，例如 `58.4`。它可以是正数也可以是负数。一些有效和无效实数常量的示例见表 6.6：\n\
  \n| 实数常量 | 是否有效 |\n| :--- | :--- |\n| 10.5 | 有效 |\n| 9,5 | 无效，因为包含逗号 |\n| -9.5 |\
  \ 有效 |\n| 565 656 | 无效，因为不允许空格 |\n\n表 6.6：有效和无效的实数常量\n\n## 字符常量](#contents.xhtml_sc4_174a)\n\
  \n字符常量是用两个单引号（‘’）包裹的单个字符（符号）。表 6.7 展示了有效和无效字符常量的示例：\n\n| 字符常量 | 是否有效 |\n| :--- |\
  \ :--- |\n| 'a' | 有效 |\n| '97' | 有效 |\n| 'A' | 有效 |\n| '=' | 有效 |\n| A | 无效，因为缺少单引号\
  \ |\n\n表 6.7：有效和无效的字符常量\n\n## 字符串常量](#contents.xhtml_sc4_175a)\n\n它是一组字符。字符串是由双引号括的字符集合。表\
  \ 6.8 展示了有效和无效字符串常量的示例：\n\n| 字符常量 | 是否有效 |\n| :--- | :--- |\n| “KD” | 有效 |\n| “Hello”\
  \ | 有效 |\n| “A” | 有效 |\n\n表 6.8：有效和无效的字符串常量\n\n注意：“A” 和 ‘A’ 是不同的\n\n## 标识符](#contents.xhtml_sc3_176a)\n\
  \n标识符是用户定义的单词。它是赋予内存位置的名字。这些单词在 C 语言中用于命名变量、函数、数组、结构体等。C 中构造标识符的规则如下：\n\n* 标识符名称可以包含字母、数字和下划线。\n\
  * 标识符名称只能以字母或下划线开头。不能以数字开头。\n* 变量名中除了下划线外，不能有空格和特殊字符如 `@`、`!`、`#`、`%` 等。\n* 标识符名称不能包含保留字或关键字，如\
  \ `int`、`float` 等。\n* 标识符名称对大小写敏感，因为 C 语言区分大写和小写字母。\n* 由于只有 31 个字符是有效的，因此标识符名称不应超过\
  \ `31`。语言规范没有显式定义标识符名称的长度，但大多数 C 编译器对标识符名称的长度有实际限制，通常为 31 到 63 个字符。\n* 标识符应该以意义明确、简洁且易于理解风格表示。\n\
  \n## 运算符](#contents.xhtml_sc3_177a)\n\n运算符是对操作数执行操作的符号。例如 `a+b` 中的 `+` 就是运算符。运算符的类型如下：\n\
  \n* 算术运算符 `+`、`-`、`*`、`/`\n* 关系运算符 `>`、`<`、`>=`、`==`\n* 逻辑运算符 `&&`、`||`\n* 赋值运算符\
  \ `=`、`+=`、=`\n\n## 特殊符号](#contents.xhtml_sc3_178a)\n\n特殊符号用于区分程序的的不同部分。例如，在表达式中\
  \ `a`、`b` 和 `c` 是操作数。特殊符号包括：\n\n* 大括号 `{}`\n* 圆括号 `()`\n* 分号 `;`\n* 逗号 `,`\n* 冒号\
  \ `:`\n\n## 程序结构](#contents.xhtml_sc3_179a)\n\n程序的结构通常由以下部分组成。例如：\n\n```c\n#include\
  \ <stdio.h>\n\nint main()\n{\n    // 语句\n    return 0;\n}\n```\n\n## 注释](#contents.xhtml_sc3_180a)\n\
  \n注释用于在代码中添加人类可读的文本。它们会被编译器忽略。注释有两种类型：\n\n1. 单行注释：以双斜杠 `//` 开始，持续到行尾。例如：\n```c\n\
  // 这是一个单行注释\n```\n2. 多行注释：以 `/*` 开始，以 `*/` 结束。它适用于多行或段落。例如：\n```c\n/* 这是一个\n多行注释\
  \ */\n```\n\n## printf() 和 scanf() 函数](#contents.xhtml_sc3_181a)\n\n`printf` 和 `scanf`\
  \ 是 C 语言中常用的两个函数。它们如下：\n\n* `printf`：用于在屏幕上输出。`printf` 函数中双引号里的内容将原样打印。考虑以下代码：\n\
  ```c\nprintf(\"HELLO C\");\n```\n其输出为 `HELLO C`。考虑以下语句：\n`printf(format_string,\
  \ argument_list)`\n`format_string` 是格式化字符串列表，`argument_list` 是与格式化符对应的值。\n\n下面是使用\
  \ `printf` 打印整数变量值的示例：\n```c\nint a = 42;\nprintf(\"The value of a is %d\", a);\n\
  ```\n输出为：`The value of a is 42`。`%d` 是 `format_string`，`a` 是 `argument_list`。\n\n\
  3. `scanf`：用于从键盘读取输入。基本语法如下：\n`scanf(format_string, argument_list)`\n`format_string`\
  \ 是格式化字符串列表，`argument_list` 是与格式化符对应的变量。\n\n取以下示例：\n```c\nint num;\nscanf(\"%d\"\
  , &num);\n```\n它要求用户输入一个整数。`&` 运算符将变量的地址传递给 `scanf`。\n\n## 如何编译和运行 C 程序？](#contents.xhtml_sc3_184a)\n\
  \n\n\n\n以下是编译和运行 C 程序的两种方法：\n\n*   使用菜单：要编译 C 程序，进入编译（compile）菜单，然后进入编译（compile）子菜单。然后，从运行（run）菜单中选择运行（run）子菜单来运行\
  \ C 程序。\n*   使用快捷键：在 Turbo C 中编译程序按 `Alt + f9`，运行程序按 `Ctrl + f9`。`F2` 用于以 `.C` 扩展保存程序，`Alt\
  \ + Enter` 用于全屏模式。\n\n# 头文件\n\n它们被放在程序的开头。这些文件包含了预定义函数、数据类型、常量等的定义。扩展名为 `.h` 的头文件通过\
  \ `#include` 预处理指令添加到程序中。例如，`#include<stdio.h>`。\n\n头文件有两种类型：\n\n1.  **内置头文件**：这些文件在\
  \ C 语言中已经可用。它们也被称为标准头文件。我们需要在程序中包含它们。以下是一些标准头文件：\n\n    *   `#include<stdio.h>`：代表标准输入输出头文件。它包含了\
  \ `scanf()` 和 `printf()` 等函数。\n    *   `#include<conio.h>`：代表控制输入输出头文件。它包含了 `clrscr()`\
  \ 和 `getch()` 等函数。\n    *   `#include<string.h>`：包含了字符串处理函数，如 `strlen()`、`strcmp()`、`strcpy()`\
  \ 等。\n    *   `#include<math.h>`：包含了许多数学运算，如 `sqrt()`、`pow()` 等。\n    *   `#include<stdlib.h>`：代表标准库头文件。它包含了一些杂函数，如\
  \ `malloc()`、`calloc()`、`realloc()`、`free()`、`abs()`、`exit()` 等。\n\n2.  **用户定义头文件**：由用户根据自己的需求创建，并可以在需要时随时导入程序。创建用户定义的头文件需要以下步骤：\n\
  \n    1.  编写你自己的 C 函数，将该文件保存为 `.h` 扩展名并运行它。例如：\n\n        ```c\n        // 创建用户定义的函数。\n\
  \        void add ()\n        {\n        int a,b,c;\n        printf(\"Enter two\
  \ numbers\\n\");\n        scanf(\"%d%d\",&a,&b);\n        c=a+b;\n        printf(\"\
  The sum is =%d\",c);\n        }\n        ```\n\n    2.  创建一个主程序，通过编写 `#include \"\
  name_of_header_file\"` 将之前创建的头文件包含到程序并运行。例如：\n\n        ```c\n        // 程序 6.2\
  \ 调用上面创建的用户定义的头文件\n        #include<stdio.h>\n        #include \"sum.h\" // 包含用户定义的头文件\n\
  \        void main()\n        {\n        add(); // 从 sum.h // 头文件中调用 add()\n   \
  \     }\n```\n\n# 数据类型\n\n它说明了程序中使用的数据类型。程序中的每个变量都有一个关联的数据类型。为了处理数据类型（例如整数、实数、字符等），C\
  \ 语言支持丰富的数据类型。这些类型可以分为两类，如图图 6.6 所示：\n\n![](img/Figure_6.6.png)\n\n图 6.6：数据类型的类型\n\
  \n## 基本数据类型\n\n这些也被称为基本或内置数据类型。其类型如图 6.7 所示：\n\n![](img/Figure_6.7.png)\n\n图 6.7：基本数据类型的类型\n\
  \n基本数据类型进一步分为五个子部分，如下。\n\n### 字符\n\n它用于存储字符。它持有单个字符。例如，a, b, c, A, B, C 等。以下是它的主要特征：\n\
  \n*   使用 `char` 关键字进行声明。\n*   它占用一个字节的内存来存储字符。\n*   它可以存储 `2⁸` (256) 个不同的值。\n* \
  \  它的格式说明符是 `%c`。\n\n例如，它的声明和定义如下：\n\n```c\nchar ch;\nch='A'\n```\n\n程序 6.3 将对其进行详细介绍。\n\
  \n```c\n// 程序 6.3 打印字符\n#include<stdio.h>\nvoid main()\n{\nchar ch;\nch='A';\nprintf(\"\
  %c\",ch);\n}\n```\n\n输出：\nA\n\n它声明了一个名为 `ch` 的字符变量并将其初始化为 `'A'`。当程序运行时，它将在控制台输出字符\
  \ `'A'`。\n\n字符数据类型进一步分为两种类型：\n\n1.  **有符号字符数据类型**\n    *   它可以持有正值和负值。\n    *  \
  \ 使用 `unsigned char` 关键字进行声明。（注：原文说是 `unsigned char` 但上下文暗示为 `char`）。\n    *   它占用一个字节的内存来存储字符。\n\
  \    *   它可以存储 `2⁸` 个不同的值（–128 到 +127）。\n    *   它的格式说明符是 `%c`。\n\n2.  **无符号字符数据类型**\n\
  \    *   它只持有正值。\n    *   使用 `unsigned char` 关键字进行声明。\n    *   它占用一个字节的内存来存储字符。\n\
  \    *   它的格式说明符是 `%c`。\n\n### 整数\n\n它用于存储整数。它的特征如下：\n\n*   使用 `int` 关键字声明。\n* \
  \  它占用一个字内存来存储整数。\n*   它的格式说明符是 `%d`。\n\n整数数据类型进一步分为类型：\n\n1.  **有符号整数类型**\n   \
  \ *   它可以持有正值和负值。\n    *   使用 `int` 关键字进行声明。\n    *   它占用一个字内存来存储整数。\n    *   它可以存储\
  \ `2¹⁵ - 1` 个不同的值。\n    *   它的格式说明符是 `%d`。\n\n2.  **无符号整数类型**\n    *   它可以只持有正值。\n\
  \    *   使用 `unsigned int` 关键字进行声明。\n    *   它占用一个字内存来存储整数。\n    *   它可以存储 `2¹⁶`\
  \ 个不同的值。\n    *   它的格式说明符是 `%u`。\n\n此外，这些类型可以使用修饰符进行修改，即 `long` 和 `short`。\n\n1.\
  \  **短有符号整数类型**\n    *   它可以持有正值和负值。\n    *   使用 `short int` 关键字声明。\n    *   它占用两个字节内存来存储整数。\n\
  \    *   它可以存储 `2¹⁵ - 1` 个不同的值。\n    *   它的格式说明符是 `%d`。\n\n2.  **短无符号整数类型**\n  \
  \  *   它可以只持有正值。\n    *   使用 `unsigned short int` 关键字声明。\n    *   它占用两个字节内存来存储整数。\n\
  \    *   它可以存储 `2¹⁶` 个不同的值。\n    *   它的格式说明符是 `%u`。\n\n3.  **长有符号整数类型**\n    * \
  \  它可以持有正值和负值。\n    *   使用 `long int` 关键字声明。\n    *   它占用四个字节内存来存储整数。\n    *   它可以存储\
  \ `2³¹ - 1` 个不同的值。\n    *   它的格式说明符是 `%ld`。\n\n4.  **长无符号整数类型**\n    *   它可以只持有正值。\n\
  \    *   使用 `unsigned long int` 关键字声明。\n    *   它占用四个字节内存来存储整数。\n    *   它可以存储 `2³²`\
  \ 个不同的值。\n    *   它的格式说明符是 `%lu`。\n\n注意：整数的大小取决于机器的字长，例如 16 位或 32 位。之前的描述是针对 16\
  \ 位字长机器的。对于 32 位字长机器，整数的大小会翻倍，即 4 字节。字是处理器一次处理的比特数，在现代系统中通常是 32 位和 64 位。假设字长为 16\
  \ 位，整数所需的内存空间为一个字或两个字节。\n\n### 实数数据类型\n\n它也被称为浮点数据类型。它用于存储小数，包括正数和小数，具有六位精度，例如 25.210000。以下是它的主要特征：\n\
  \n\n\n\n\n*   它的声明是通过 `unsigned float` 关键字完成的。\n*   它占用四个字节内存来存储实数。\n*   它可以存储从\
  \ `3.4e–38` 到 `3.4e+38` 范围的值。\n*   它的格式说明符是 `%f`。\n\n这些范围值是近似值，因为它们取决于具体的实现和硬件。范围在不同系统之间可能会略有不同。\n\
  \n## Double 数据类型\n\n它也用于存储实数。它还用于存储比浮点数更大的小数或实数，包括正数和负数。以下是它的主要特征：\n*   它的声明是通过\
  \ `double` 关键字完成的。\n*   它占用八字节内存存储。\n*   它可以存储从 `1.7e–308` 到 `1.7e+308` 范围的值。\n\
  *   它的格式说明符是 `%lf`。\n\n这些范围值是近似值，因为它们取决于具体的实现和硬件。范围在不同系统之间可能会有不同。\n\n## Void\n\n\
  `void` 一词意味着“空”。它告诉我们函数的返回类型。例如，`void main()` 意味着 `main` 不返回任何值。也可以传递给函数以指定没有参数。它还用于创建通用指针。以下是它的主要特征。\n\
  *   它的声明是通过 `void` 关键字完成的。\n*   `void` 用于表示值或数据类型的缺失。\n*   它表示函数不返回任何值。\n*   它用于创建一个可以指向任何数据类型的通用指针。\n\
  \n## 派生数据类型\n\n它们派生自基本数据类型。它们也被称为次级数据类型。以下是派生数据类型的类型：\n*   **数组 (Arrays)**：它是相似数据类型的集合；例如，学生姓名是字符的集合。班号是整数的集合。\n\
  *   **字符串 (String)**：它是以空字符（``\\0```）终止的字符集合。例如，一个人的名字就是一个字符串。\n*   **结构体 (Structures)**：它是不同数据类型的集合。它可能包含如整数、字符、`float`、`double`\
  \ 等数据类型。结构体用于保存记录。例如，学生的记录可能包含学生的姓名、学号、班级等。\n*   **联合体 (Union)**：它是像结构体一样的不同数据类型的集合。\n\
  *   **指针 (Pointers)**：它持有变量的地址。\n*   **枚举 (Enum)**：它允许你定义一组命名常量。`enum` 中的每个常量都被分配一个整数值，默认从\
  \ 0 开始。例如，在 `enum color{Red, Green, Blue}` 中，`Red` 初始化为 0，`Green` 初始化为 1，`Blue`\
  \ 初始化为 2，其中 `enum` 是一个关键字。如果你愿意，也可以为常量分配不同的整数值。以下程序说明了枚举的概念：\n\n```c\n// Program\
  \ 6.4 illustrates the enum\nenum color{Red, Green, Blue};\nint main()\n{\n    enum\
  \ color C;\n    C = Green;\n    printf(\"%d\",C);\n    return 0;\n}\n```\n程序的输出结果是\
  \ 1。\n\n数组、结构体、联合体等有时也称为用户定义数据类型，因为程序员使用基本数据类型来创建它们。后续章节将给出这些数据类型的详细描述。\n\n声明用户定义数据类型变量的另一种方法是使用\
  \ `typedef` 关键字。它为现有的数据类型定义一个新名称。例如：\n\n```c\n// Program 6.5 illustrates typedef\n\
  #include <stdio.h>\ntypedef unsigned int uint;\nint main()\n{\n    uint x = 42;\n\
  \    printf(\"x = %u\\n\", x);\n    return 0;\n}\n```\n输出：42\n\n在此程序中，使用了 `typedef`\
  \ 来定义一个新类型 `uint`，它等同于 `unsigned int`。然后，一个类型为 `uint` 的变量 `x` 被赋值为 42。最后，我们使用 `printf`\
  \ 打印 `x` 的值。\n\n程序的输出如下：\nx = 42\n\n## 数据类型修饰符\n\n修饰符是放在数据类型之前的关键字，用于修改（增加或减少）分配给变量的存储空间。它们用于指定额外的属性，例如可以存储的值范围、数据的精度或数据在内存中的存储方式。图\
  \ 6.8 显示了 C 语言中使用的数类型修饰符。\n\n![](img/Figure_6.8.png)\n图 6.8：数据类型修饰符\n\n以下描述了 C 语言中使用的主要数据类型修饰符：\n\
  *   **Long (长)**：它用于增加当前数据类型的容量。它可以应用于 `int` 或 `double` 数据类型。例如，整数占用两个字节内存。当使用 `long`\
  \ 配合整数变量时，它占用四个字节内存。例如：\n    ```c\n    long int a;\n    ```\n*   **short (短)**：它在每个操作系统中都占用两个字节内存空间。它通常与\
  \ `int` 数据类型配合。例如：\n    ```c\n    short int a;\n    ```\n*   **unsigned (无符号)**：它可以仅用于接受正数据类型。例如：\n\
  \    ```c\n    unsigned int a =50; // 正确\n    ```\n*   **signed (有符号)**：它可以接受正负值，这是任何数据类型的默认值。例如：\n\
  \    ```c\n    signed int a=50; // 正确\n    ```\n\n## 类型转换或类型转换\n\n是将一种数据类型转换为另一种的过程。可以通过程序员手动转换（显式类型转换），也可以由编译器自动转换（隐式类型转换）。它们如下：\n\
  \n*   **隐式类型转换 (Implicit conversion)**：它在内部完成。当小类型转换为大类型时，被称为“提升”，当大类型转换为小类型时，被称为“降级”。参见图\
  \ 6.9：\n\n    ![](img/Figure_6.9.png)\n    图 6.9：类型转换\n\n    在示例中，整数 `a` 在内部提升为浮点值：\n\
  \    ```c\n    int a=20;\n    float b;\n    b=a; // 隐式转换\n    ```\n    ```c\n  \
  \  // Program 6.6 shows implicit conversion (promotion)\n    #include <stdio.h>\n\
  \    int main()\n    {\n        int i=20;\n        float a;\n        a=i;\n    \
  \    printf(\"After type conversion:%f\\n\",a);\n    }\n    ```\n    输出：20.000000\n\
  \n    让我们下面的代码。在示例中，浮点数 `b` 在内部降级为整数：\n    ```c\n    int a;\n    float b=10;\n \
  \   a=b; // 隐式降级\n    ```\n    ```c\n    // Program 6.7 shows implicit type conversion\
  \ (Demotion)\n    #include <stdio.h>\n    int main()\n    {\n        int a;\n  \
  \      float b=10;\n        a=b;\n        printf(\"After type conversion:%d\\n\"\
  ,a);\n    }\n    ```\n    输出：10\n\n*   **显式类型转换 (Explicit type conversion)**：它是用户通过将所需的数据类型放在括号中完成的。它也被类型转换（typecasting）。在下面的示例中，整数\
  \ `a` 被类型强制转换为浮点值：\n    ```c\n    int a=50,b=7;\n    float c;\n    c=(float)a/b;\n\
  \    ```\n    ```c\n    // Program 6.8 shows explicit type conversion\n    #include\
  \ <stdio.h>\n    int main()\n    {\n        int a=50,b=7;\n        float c;\n  \
  \      c=(float)a/b;\n        printf(\"After type conversion:%f\\n\",c);\n    }\n\
  \    ```\n    输出：7.142857\n\n## 变量声明与定义\n\n**变量声明 (Variable declaration)**：这是一个指定程序将使用的变量数据类型和名称的语句。声明通常发生在程序的开头。\n\
  \n例如，\n```c\nint x; // 变量声明\nfloat y; // 变量声明\n```\n`x` 和 `y` 分别声明为整数和浮点型变量。这意味着程序知道这些变量的存在，但尚未为它们分配内存空间。\n\
  \n\n\n\n\n## 变量定义\n\n变量定义：变量定义是指为变量分配值并为其保留内存空间的语句。定义可以出现在程序的任何地方，通常紧跟声明之后。\n\n\
  例如，\n\n```c\nint x = 10; // 变量定义\n\nfloat y = 3.14; // 变量定义\n```\n\n`x` 和 `y` 分别定义为整数和浮点型变量。这意味着程序为这些预留了内存空间并为它们分配了初始值。\n\
  \n## 结论\n\n本章介绍了 C 语言的介绍和历史。它还关注了 C 语言的构建模块，例如字符集和标记（即关键字、变量、常量等）。它还介绍了 C 程序的组成部分和执行方法。这里还讨论了基本数据类型和类型转换。\n\
  \n接下来的章节将讨论 C 语言中使用的运算符和表达式。本章还讨论了算术、递增、递减、关系、逻辑、位、移、赋值、逗号、`sizeof()`、条件和地址运算符。\n\
  \n## 要点回顾\n\n*   Dennis Ritchie 在 1972 年创建了 C 语言语言用于编写 UNIX 操作系统。\n*   C 语言命名为 C\
  \ 是因为它是 B 语言的继任者。\n*   学习 C 语言类似于学习英语。\n*   字符集包括编写有效 C 程序所使用的字母表、数字或特殊符号的集合。\n\
  *   格式指定符指定了格式化输入输出语句中使用的变量的数据类型和格式。它们前面带有一个百分号（%）。\n*   标记（Tokens）是程序中最小的单元。\n\
  *   关键字是保留字。C 编程语言有 32 个保留关键字。\n*   变量是内存单元的名称，用于存储数据。\n*   常量值在程序的执行过程中保持不变。\n\
  *   标识符是用户定义的单词。这些单词在 C 中用于命名变量、函数、数组、结构体等。\n*   注释用于在源代码中添加人类可读的文本，而不影响程序的行为。\n\
  *   头文件置于程序的开头。这些文件包含了预定义标准库函数、数据类型、常量等的定义。\n*   数据类型告知程序中所使用的数据类型。\n*   整数（integer）存储全整数（正、负或零）。\n\
  *   有符号整数可以存储 `2¹⁶` 个不同的值（–32,768 到 +32,667）。\n*   无符号整数（unsigned integer）可以存储 0\
  \ 到 65,535 的值。\n*   浮点型（float）存储正、负小数。\n*   `void` 告知函数的返回类型。\n*   派生数据类型由基本数据类型组成。\n\
  *   修饰符是放在数据类型之前的关键字，用于修改（增加或减少）变量的值。\n*   类型转换是将一种数据类型转换为另一种数据类型的过程。\n*   变量声明不为变量预留内存，而变量定义会预留。\n\
  *   变量定义是指为变量分配值并为其保留内存空间的语句。定义可以在程序的任何地方。\n\n## 思考题\n\n1.  学习英语类似于学习 C 语言。请证明这一观点。\n\
  2.  解释 C 语言的发展时间线。\n3.  为什么 C 语言在程序员世界中受到青睐？\n4.  写出 C 程序的基本组件及其语法。\n5.  C 语言中的字符集是什么？我们可以使用\
  \ C 字符集以外的其他字符吗？请证明这一观点。\n6.  解释格式指定符和转义序列的用途。\n7.  什么是标记（tokens）？解释它们的不同类型。\n8.\
  \  什么是关键字？可以使用关键字名作为变量名吗？\n9.  变量和常量有什么区别？\n10. 什么是标识符？为什么在 C 中使用它们？\n11. 解释程序中注释的作用。讨论它的类型。\n\
  12. 什么是头文件？为什么要将它们包含在程序中？解释它的类型。\n13. 你如何创建自己的头文件？写出将其包含在程序中的。\n14. 什么是数据类型？为什么要使用它们？列出它的类型。\n\
  15. 为什么在程序中使用修饰符？\n16. 什么是类型转换？写出其中的提升（promotion）和降级（demotion）过程。还要通过合适的示例讨论类型转换（type\
  \ casting）的类型。\n17. 区分变量声明和变量定义。\n18. 通过合适的示例区分隐式（implicit）和显式（explicit）类型转换。\n\n\
