  \    return 0;\n}\n```\n\n输出：\n第一层的第一个元素= 1\n第二层的第一个元素= 5\n\n### 数组的属性\n\n数组的某些属性如下：\n\
  \n- 数组是固定大小的，在声明时给出。一旦创建，其大小就不能更改。\n- 每个数组元素具有相同的数据类型，并在内存中占据相同的空间。\n- 数组是零索引的，这意味着元素保存在连续内存中。\n\
  - 借助数组第一个索引的基地址，可以访问元素。\n- 数组可以是多维的，这意味着它可以有多个索引。\n\n使用数组的优势\n\n使用数组有许多优势：\n\n-\
  \ 连续内存使用：允许快速访问。\n- 易于操作：只需要几行代码即可进行排序、搜索等操作。\n- 随机访问：通过提供索引可以快速读取元素。\n\n基于数组的练习程序\n\
