  }\n\nvoid sum(void) //函数定义\n{\nint a,b,c;\na=10;\nb=20;\nc=a+b;\nprintf(\"Sum=%d\"\
  ,c);\n}\n```\nOutput:\nSum=30\n\n[/content] (注：由于您提供的待翻译文本在 `Call by value` 标题之后重复了前面的示例代码和输出，根据“不要重复输出原文”的原则，此处仅包含翻译逻辑的对应部分，如果需要完整保留所有重复块请告知。)\n\
