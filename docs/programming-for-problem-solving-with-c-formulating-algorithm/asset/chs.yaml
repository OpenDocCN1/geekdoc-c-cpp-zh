  \ swapping: 20. 10\nThe values of a and b in the main are: 20, 10\n\n### 调用约定\n\n\
  调用约定规定了参数传递给函数的顺序以及函数处理这些参数的顺序。C 语言中的函数允许从右到左的调用约定。考虑以下语句：\n\n```c\nint a=10;\n\
  printf(\"%d %d %d %d\",a,--a,a++,--a);\n```\n\n上一行似乎会生成输出 `10 9 9 9`；但惊讶的是，它产生了\
  \ `9 9 9 9`。\n\n正如我们所知，在函数中，值的求解是从右到左按顺序进行的，这意味着表达式 `--a`（前递减）首先求解，生成值 `9`。\n\n\
  同样，按照相同的顺序，表达式 `a++` 打印值 `9`。由于它是一个后自增运算符，该值会加 1。现在，内存中 `a` 的值为 `10`。`10` 被 `--a`\
  \ 减了 1，然后打印 `9`。最后，原样打印出 `9`。因此，输出是 `9 9 9 9`。\n\n### 将数组传递给函数\n\n默认情况下，数组在函数中使用引用传递模式传递。这意味着数组的地址（基地址）被传递到调用函数中。调用函数内部对数组的任何修改也会影响调用函数中的原始数组。\n\
  \n以下是两种常用方法：\n\n*   **将数组作为指针传递**：此方法将数组名传递给实际参数，数组名充当数组的基地址。形式参数中使用指针来保存数组的基地址，并从实际参数传入：\n\
  \n    ```c\n    // Program 12.8 prints an array using passing an array using a pointer\n\
  \    #include <stdio.h>\n    void a(int *p, int size)\n    {\n        for (int i\
  \ = 0; i < size; i++)\n        {\n            printf(\"%d \", p[i]);\n        }\n\
  \        printf(\"\\n\");\n    }\n\n    int main()\n    {\n        int A[] = {1,\
  \ 2, 3, 4, 5};\n        int size = sizeof(A) / sizeof(A[0]);\n        a(A, size);\n\
  \        return 0;\n    }\n    ```\n    输出：\n    1 2 3 4 5\n\n    在上程序中，数组 `A` 的基地址和大小被传递给打印函数。在函数内部使用指针\
  \ `p[i]` 访问数组。语句 `print(A, size)` 等于 `print(&A[0], size)`。\n\n*   **传递带有显式大小的数组**：数组名传递给实际参数。在形式参数中，数组名连同数据类型和\
  \ `[]` 作为参数传递，将整个数组传递给函数。`[]` 表示数组的维度；即如果使用单个 `[]`，意味着传递的是一维数组。如果使用两个 `[][]`，则传递的是二维数组，以此此类推。当向函数传递二维数组时，必须给出列的大小。因为\
  \ C 语言要求在编译时知道列的大小，以便计算数组元素的正确内存地址。\n\n    ```c\n    // Program 12.9 shows passing\
  \ an array with an explicit size\n    #include <stdio.h>\n    void print(int a[]\
  \ , int size)\n    {\n        for (int i = 0; i < size; i++)\n        {\n      \
  \      printf(\"%d \", a[i]);\n        }\n        printf(\"\\n\");\n    }\n\n  \
  \  int main()\n    {\n        int A[] = {1, 2, 3, 4, 5};\n        int size = sizeof(A)\
  \ / sizeof(A[0]);\n        print(A, size);\n        return 0;\n    }\n    ```\n\
  \    输出：\n    1 2 3 4 5\n\n    在前面的程序中，我们直接将数组 `A` 传递给 print 函数。在函数内部，该数组的处理方式就像声明为\
  \ `int a[]` 一样，我们再次可以使用 `a[i]` 访问其元素。\n\n注意：函数接收到的不是整个数组的副本，而是其起始的指针。以下程序关注一维和二维数组的传递。\n\
