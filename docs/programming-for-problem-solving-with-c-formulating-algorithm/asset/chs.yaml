  {\nint a[100],n,i,j,temp;\nprintf(\"Enter number of elements:\");\nscanf(\"%d\"\
  ,&n);\nprintf(\"Enter %d elements:\\n\", n);\nfor (i=0;i<n;i++)\nscanf(\"%d\",&a[i]);\n\
  for(i=0;i<n-1;i++)\n{\nfor(j=0;j<n-i-1;j++)\n{\nif (a[j] > a[j+1])\n{\ntemp=a[j];\n\
  a[j]=a[j+1];\na[j+1]=temp;\n}\n}\n}\nprintf(\"The largest element in the array is:\
  \ %d\",a[n-1]);\nprintf(\"\\nThe second largest element in the array is: %d\",a[n-2]);\n\
