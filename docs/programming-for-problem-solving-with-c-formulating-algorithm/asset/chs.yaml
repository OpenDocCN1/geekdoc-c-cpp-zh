  Enter number of elements: 10\nEnter 10 elements:\n20\n62\n54\n63\n85\n95\n74\n84\n\
  65\n55\nThe largest element in the array is: 95\nThe second largest element in the\
  \ array is: 85\nThe smallest element in the array is: 20\nThe second smallest element\
  \ in the array is: 54\n```\n\n\n\n\n\n*   `k^(th)` 个元素的地址为 `= 基地址 + 元素大小 * (第 k^(th)\
  \ 个元素的索引)`\n*   一维数组以线性形式存储一组值，类似于列表。`1D` 数组只使用一个索引值。\n*   多维数组包含一个以上的维度，例如两个、三个等。它使用多个一个索引。\n\
  *   二维数组（2D arrays）被用于创建数学矩阵。它有两个索引：一个用于行，另一个用于列。\n*   三维数组（3D array）是数组的数组。它有三个索引。\n\
  *   每个数组元素都具有相同的数据类型，并在内存中占据相同的空间。\n*   数组项按顺序地址存储在内存中。\n*   C 语言数组是零索引的，这意味着数组的基地址索引为\
  \ 0。\n*   连续的内存分配允许快速且高效的内存访问。\n*   数组元素可以随机访问，这意味着可以通过提供任何元素的地址或索引来访问该元素。\n*  \
  \ 由于数组元素存储在连续的内存中，因此几行代码即可读取和存储数组中的数据。\n\n### 重要问题\n\n1. “数组”这一术语是什么意思？\n2. 如何声明一个数组？写出其语法的解释。\n\
