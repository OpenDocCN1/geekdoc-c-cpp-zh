  n\");\n}\n```\n（注：提供的文本包含碎片逻辑）。\n\n### C 语言中的存储类\n\n存储类决定了变量存储在哪里、存在多长时间以及何时可用。当我们声明变量时，存储类决定了变量的以下属性：\n\
  \n*   **内存位置**：变量存储的位置，如 RAM 或 CPU 寄存器。\n*   **默认值**：如果没有初始化时的初始值。\n*   **生命周期/存在期**：该变量在内存中存在多久。\n\
  *   **作用域/可见性**：指定程序中可以访问变量值的位置。\n\n存储类的类型如下：\n\n*   **自动的 (Automatic)**：在变量声明中使用\
  \ `auto` 关键字。默认情况下，C 语言中的每个局部变量都是自动的。可以这样声明：\n\n    `auto int a`\n\n    上一行与 `int\
  \ a` 相同。自动变量具有以下特征：\n\n    *   **内存**：驻留在 RAM 中。\n    *   **默认值**：变量由随机值初始化，即垃圾值。\n\
  \    *   **生命周期**：当你离开创建自动变量的块时，给它的内存就会释放。\n    *   **作用域**：范围限于定义的块。\n\n    程序\
  \ 12.12 显示一个自动变量：\n\n```c\n// Program 12.12 shows an auto variable\n#include <stdio.h>\n\
  void main()\n{\n    auto int a;\n    printf(\"%d\",a);\n}\n```\n输出：\n任意垃圾值\n\n*\
  \   **静态的 (Static)**：使用 `static` 关键字。声明如下：\n\n    `static int a`\n\n    静态变量具有以下特征：\n\
  \n    *   **内存**：驻留在 RAM 中。\n    *   **默认值**：自初始化为零。\n    *   **生命周期**：它保持其值直到主程序结束，并在多次函数调用之间保持其值。\n\
  \    *   **作用域**：只有定义变量的函数或块可以查看这些变量的值。\n\n    程序 12.13 显示一个静态变量：\n\n```c\n// Program\
  \ 12.13 shows a static variable\n#include <stdio.h>\nvoid main()\n{\n    static\
  \ int a;\n    printf(\"%d\",a);\n}\n```\n输出：\n0\n\n*   **寄存器的 (Register)**：使用 `register`\
  \ 关键字。它将内存保存在 CPU 寄存器中。因此，它们的访问速度比自动变量更快。由于 CPU 寄存器尺寸很小，我们可以声明非常少的寄存器变量。例如，它的声明如下：\n\
  \n    `register int a`\n\n\n\n\n\n`register` 变量具有以下特征：\n\n- **内存**：它存储在 CPU 寄存器中。\n\
  - **默认值**：任意随机值。\n- **生命周期**：离开代码块后，分配给 `register` 变量的内存将被释放，供程序其他部分使用。\n- **作用域**：作用域限于定义它的块。\n\
  \n程序 12.14 显示了一个 register 变量代码：\n\n```c\n// Program 12.14 shows a register variable\n\
  #include <stdio.h>\n\nvoid main()\n{\n    register int a;\n    printf(\"%d\",a);\n\
  }\n```\n\n输出：\n任意垃圾值\n\n### 外部或全局\n它使用 `extern` 关键字。这些变量定义在函数外部。例如：\n\n```c\nextern\
