  \n![](img/fm1.png)\n\n# 第 11 章 字符串\n\n## 引言\n\n本章重点关注字符串的基础知识。在本章中，我们将探索字符串的声明和初始化，揭示\
  \ `scanf()` 函数的局限性，并学习标准的内置字符串函数，如 `strlen()`、`strcat()` 等。我们还将处理二维字符串、`ctype.h`\
  \ 头文件，并提供实际程序来强化你的字符串处理技能。\n\n### 章节结构\n\n在本章中，我们将讨论以下主题：\n\n*   字符串的声明与初始化\n* \
  \  `scanf` 函数的局限性\n*   标准内置字符串函数\n    *   `strlen()`\n    *   `strcat()`\n    *\
  \   `strcmp()`\n    *   `strcpy()`\n    *   `strrev()`\n    *   `strupr()`\n   \
  \ *   `strlwr()`\n    *   `strncat()`\n    *   `strncpy()`\n    *   `strncmp()`\n\
  *   二维字符串\n*   `ctype.h` 头文件\n*   字符串练习程序\n\n## 目标\n\n本章的目标是让读者对编程中的字符串操作有全面的理解。通过探索字符串声明、初始化以及输入函数的局限性，读者将熟练使用常用的内置字符串函数。此外，我们将涵盖二维字符串、`ctype.h`\
  \ 头文件，并提供实际程序以增强文本处理技能。\n\n## 字符串\n\n字符串是一个以空字符（`'\\0'`）结尾的字符集合。`'\\0'` 是空字符是因为它的\
  \ ASCII 值为 0，而数字 0 的 ASCII 值为 48。因此，我们必须在字符串中多留出一个额外的空间来存储空字符。更多详细说明请参考[图 11.1]。对于字符串，`%s`\
  \ 被格式格式说明。\n\n不以空字符结尾的字符串不是字符串。它将是一个简单的字符数组。因此，字符数组只是字符的集合。\n\n### 字符串的声明与初始化\n\n\
  字符串通常通过以下三种方法声明和初始化。\n\n#### 方法 1：逐字符方法\n\n看下行：\n\n```c\nchar A[]={'K', 'A', 'M',\
  \ 'A', 'L', '\\0'};\n```\n\n上述语句声明了一个名为 `A` 的字符串，并用 `'K'`、`'A'`、`'M'`、`'A'`、`'L'`\
  \ 和空字符 `'\\0'` 进行初始化。`'\\0'` 代表字符串的结束。\n\n### 方法 2：直接方法\n\n在这种方法中，C 会自动插入空字符。因此，你不需要在字符串末尾写\
  \ `\\0`。考虑以下语句：\n\n```c\nchar A[] = \"KAMAL\";\n```\n\n#### 方法 3：按索引初始化\n\n在这种方法中，通过显式指定索引逐逐地为字符串赋值。看下行：\n\
  \n```c\nchar A[6];\nA[0] = 'K';\nA[1] = 'A';\nA[2] = 'M';\nA[3] = 'A';\nA[4] = 'L';\n\
  A[5] = '\\0';\n```\n\n这段代码声明了一个字符串 `A`，它可以包含六个字符（包括空字符）。然后将 `'K'`、`'A'`、`'M'`、`'A'`、`'L'`\
  \ 和 `'\\0'`（空字符）赋值给字符串的元素。\n\n### scanf 函数的局限性\n\n`scanf()` 函数无法处理字符串，因为它不接受空格后的字符串。看以下示例：\n\
  \n```c\nchar A[20];\nprintf(\"输入字符串：\\n\");\nscanf(\"%s\",A);\nprintf(\"字符串是：\\\
  n\");\nprintf(\"%s\",A);\n```\n\n为了克服 `scanf()` 函数的局限性，C 还有两个函数，如下：\n\n1.  `gets()`：用于从键盘获取（输入）跟随回车键的字符串。\n\
  2.  `puts()`：用于在显示器屏幕上输出（显示）字符串。\n\n在 `stdio.h` 头文件中找到这些函数的定义：\n\n```c\nchar A[5];\n\
  printf(\"输入字符串：\\n\");\ngets(A);\nprintf(\"字符串是：\\n\");\nputs(A);\n```\n\n\n\n\n\
  \n*   `strcpy()`: 将一个字符串复制到另一个字符串。\n*   `strrev()`: 反转字符串。\n*   `strupr()`: 将字符串转换为大写。\n\
  *   `strlwr()`: 将字符串转换为小写字符串。\n*   `strncat()`: 将一个字符串中的若干字符附加到另一个字符串的末尾。\n*   `strncpy()`:\
  \ 将指定数量的字符从一个字符串复制到另一个。\n*   `strncmp()`: 比较两个字符串的前 n 个字符。\n\n让我们来看这些函数。\n\n###\
  \ `strlen()`\n\n它测量字符串的长度，包括空格。它以整数值返回长度。它不计算空字符。`strlen()` 函数的语法如下：\n\n```\ni=strlen(A);\n\
  ```\n\n在这里，`A` 是一个字符串，`i` 是整数值。考虑[图 11.2]中所示的字符串。`strlen(A)` 将返回 10，即字符串的长度。\n\n\
  ![](img/Figure_11.2.png)\n图 11.2: 内存中的字符串 A\n\n// 程序 11.5 显示了 `strlen()` 函数的作用\n\
  ```c\n#include<stdio.h>\n#include<string.h>\n\nvoid main()\n{\nchar A[10];\nint\
  \ i;\nprintf(\"Enter the string:\\n\");\ngets(A);\ni=strlen(A);\nprintf(\"The length\
  \ of the string is %d\", i);\n}\n```\nOutput:\n```\nEnter the string:\nKamaldeep\n\
  The length of the string is 9\n```\n\n### `strcat()`\n\n它合并或拼接两个字符串。它接受两个字符串并将第二个字符串连接到第一个字符串之后。因此，第一个字符串的大小能够容纳第二个字符串的数据。假设[图\
  \ 11.3]中拼接前的字符串 `A` 和 `B`：\n\n![](img/Figure_11.3.png)\n图 11.3: 拼接前的字符串 A 和 B\n\n\
  在用 `strcat(A, B)` 拼接后，字符串 `A` 将像[图 11.4]所示：\n\n![](img/Figure_11.4.png)\n图 11.4:\
  \ 拼接后的字符串 A\n\n// 程序 11.6 用于拼接两个字符串\n```c\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\nchar A[20];\nchar B[10];\nint i;\nprintf(\"Enter the 1st string:\\\
  n\");\ngets(A);\nprintf(\"Enter the 2nd string:\\n\");\ngets(B);\nstrcat(A,B); //\
  \ 将 B 接到 A 中\nprintf(\"The concatenated string is :\\n\");\nputs(A);\n}\n```\nOutput:\n\
  ```\nEnter the 1st string:\nKamal\nEnter the 2nd string:\ndeep\nThe concatenated\
  \ string is:\nKamaldeep\n```\n\n### `strcmp()`\n\n它比较两个字符串。该函数比较两个字符串中的每个对应字符，直到遇到空字符或发现差异。请看下述语句：\n\
  \n```\ni=strcmp(A,B);\n```\n\n在这里，`i` 是一个整数，`A` 和 `B` 是两个字符串。\n\n*   如果两者相等，它返回零，如[图\
  \ 11.5]所示。\n*   如果 `A` 大于 `B`，`strcmp` 返回一个正整数，如[图 11.6]所示。\n*   如果 `B` 更大，`strcmp`\
  \ 返回一个负整数，如[图 11.7]所示。\n\n比较是通过相减 `A` 和 `B` 中对应字符的 ASCII 值完成的。如果结果的差异为零，则继续比较下一个字符。如果差异不为零，函数将差异作为结果返回。某些编译器分别返回\
  \ 1、0、–1 分表示正差异、相等差异和负差异。通常情况下，它返回第一个不匹配字符的差异。\n\n参考[图 11.5]：\n\n![](img/Figure_11.5.png)\n\
  图 11.5: 字符串的 ASCII 值之间没有差异\n\n参考[图 11.6]：\n\n![](img/Figure_11.6.png)\n图 11.6: 第一个不匹配字符之间的正差异\n\
  \n参考[图 11.7]：\n\n![](img/Figure_11.7.png)\n图 11.7: 第一个不匹配字符之间的负差异\n\n// 程序 11.7\
  \ 比较两个字符串\n```c\n#include<stdio.h>\n#include<string.h>\n\nvoid main()\n{\nchar A[10];\n\
  char B[10];\nint i;\nprintf(\"Enter the 1st string:\\n\");\ngets(A);\nprintf(\"\
  Enter the 2nd string:\\n\");\ngets(B);\ni=strcmp(A,B);\nif(i==0)\nprintf(\"Strings\
  \ are equal\");\nelse\nprintf(\"Strings are not equal.\\n\");\nprintf(\"The difference\
  \ between the first non-matching character is %d\",i);\n}\n```\nOutput:\n```\nEnter\
  \ the 1st string:\nhello\nEnter the 2nd string:\nhillo\nStrings are not equal.\n\
  The difference between the first non-matching character is -4\n```\n\n### `strcpy()`\n\
  \n它用于将一个字符串复制到另一个。它接受两个参数：一个是源字符串，另一个是目标字符串。如果目标字符串为空，该函数将覆盖源字符串。假设内存中有一个字符串 `A`，如[图\
  \ 11.8]所示：\n\n![](img/Figure_11.8.png)\n图 11.8: 内存中的字符串\n\n考虑如下情况：\n\n```\nstrcpy(B,A);\n\
  ```\n\n在前一行中，字符串 `B` 的大小足够容纳字符串 `A`。[图 11.9]显示了将字符串 `A` 复制后的 `B`：\n\n![](img/Figure_11.9.png)\n\
  图 11.9: 复制后的字符串 B\n\n// 程序 11.8 复制字符串\n```c\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\nchar A[10];\nchar B[10];\nint i;\nprintf(\"Enter the string:\\\
  n\");\ngets(A);\nstrcpy(B,A); // 将 A 复制到 B 中\nprintf(\"The copied string is:\\n\"\
  );\nputs(B);\n}\n```\n\n### `strrev()`\n\n它用于反转字符串。它接受一个字符串作为输入。我们想要反转的是内存中的字符串\
  \ `A`，如[图 11.10]所示：\n\n```\nstrrev(A);\n```\n\n该函数将反转字符串 `A`，如[图 11.11]所示：\n\n![](img/Figure_11.10.png)\n\
  图 11.10: 反转前的字符串 A\n\n// 程序 11.9 反转字符串\n```c\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\nchar A[10];\nint i;\nprintf(\"Enter the string:\\n\");\ngets(A);\n\
  strrev(A);\nprintf(\"The reversed string is:\\n\");\nputs(A);\n}\n```\nOutput:\n\
  ```\nEnter the string:\nHello\nThe reversed string is:\nolleH\n```\n\n\n小写字符串是：\n\
  \nhello\n\n### `strncat()`\n\n它将一个字符串的 `n` 个字符追加到另一个字符串的末尾。`n` 是整数。当拼接了 `n` 个字符时，拼接停止。\n\
  \n它可以写为 `strncat(A,B,n)`。\n\n它接受三个参数（`A`、`B`、`n`分别为目标字符串、源字符串和要追加的字符数，如程序 11.12\
  \ 所示：\n\n```c\n// Program 11.12 concatenates two strings\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\n    char A[20];\n    char B[10];\n    int i;\n    printf(\"Enter\
  \ the 1st string:\\n\");\n    gets(A);\n    printf(\"Enter the 2nd string:\\n\"\
  );\n    gets(B);\n    strncat(A,B,3); //Concatenate 3 characters of B at the end\
  \ of A\n    printf(\"The concatenated string is :\\n\");\n    puts(A);\n}\n```\n\
  \n输出：\nEnter the 1st string:\nHello\nEnter the 2nd string:\nFriends!\nThe concatenated\
  \ string is:\nHelloFri\n\n### `strncpy()`\n\n它将一个字符串的 `n` 个字符复制到另一个字符串。它也接受三个参数。例如，`strncpy(B,A,3);`\
  \ 将将 `A` 的前三个字符复制到 `B` 中。程序 11.13 详细说明了 `strncpy()` 函数的工作原理：\n\n```c\n// Program\
  \ 11.13 copies three characters of one string into another string\n#include<stdio.h>\n\
  #include<string.h>\n\nvoid main()\n{\n    char A[10];\n    char B[10];\n    int\
  \ i;\n    printf(\"Enter the 1st string:\\n\");\n    gets(A);\n    strncpy(B,A,3);\
  \ // Copy first 3 characters of A in B\n    printf(\"The first three characters\
  \ of B are:\\n\");\n    puts(B);\n}\n```\n\n输出：\nEnter the 1st string:\nHELLO\n\
  The first three characters of B are:\nHEL\n\n### `strncmp()`\n\n它比较一个字符串与另一个字符串的前\
  \ `n` 个字符。如果它们相同，则返回 `0`。它接受三个参数。程序 11.14 显示了 `strncmp` 函数的工作原理：\n\n```c\n// Program\
  \ 11.14 compares the first two characters of two strings\n#include<stdio.h>\n#include<string.h>\n\
  \nvoid main()\n{\n    char A[10];\n    char B[10];\n    int i;\n    printf(\"Enter\
  \ the 1st string:\\n\");\n    gets(A);\n    printf(\"Enter the 2nd string:\\n\"\
  );\n    gets(B);\n    i=strncmp(A,B, 2); // compare first 2 characters of A and\
  \ B\n    printf(\"The difference is %d :\",i);\n}\n```\n\n输出：\nEnter the 1st string:\n\
  HAY\nEnter the 2nd string:\nHAPPY\nThe difference is: 0\n\n### 二维字符串\n\n我们也可以像创建二维矩阵一样创建一个二维二维字符串。它使用两个索引，一个用于行，一个用于列。看下面的代码：\n\
  \n```c\nchar name [4][6]={ \"JOHN\",\n\"SAM\",\n\"KAMAL\",\n\"DEEP\"\n};\n```\n\n\
  前面的代码声明了一个名为 `name` 的二维字符串，维度为四行六列，并用四个字符串对其初始化，所有字符串都以空字符结束，如图 11.16 所示：\n\n![](img/Figure_11.16.png)\n\
  \n图 11.16：内存中的二维字符串\n\n```c\n// Program 11.15 demonstrate 2D string\n#include <stdio.h>\n\
  int main() {\n    char names[4][10] = {\n        \"JOHN\",\n        \"SAM\",\n \
  \       \"KAMAL\",\n        \"DEEP\"\n    };\n    for(int i = 0; i < 4; i++)\n \
  \   {\n        printf(\"Name %d: %s\\n\", i+1, names[i]);\n    }\n    return 0;\n\
  }\n```\n\n输出：\nName 1: JOHN\nName 2: SAM\nName 3: KAMAL\nName 4: DEEP\n\n### `ctype.h`\
  \ 头文件\n\n该头文件包含了处理字符的内置函数。这些函数接受整数类型的输入。如果我们传递字符而不是整数，它们会被强制类型转换为对应的 ASCII 整数，并将结果数字作为参数传递。其中一些函数如下：\n\
  \n* `int isalpha()` 函数用于判断提供的字符是否为字母。\n* `int isdigit()` 函数用于判断给定的字符是否为十进制数字。\n\
  * `int isalnum()` 函数判断提供的字符是否为字母数字。\n* `int islower()` 函数判断检查的字符是否为小写字母。\n* `int\
  \ isupper()` 函数判断检查的字符是否为大写字母。\n* `int isspace()` 函数判断所提供的字符是否为空格。\n* `int iscatri()`\
  \ 函数判断提供的字符是否为控制字符。\n* `int isprint()` 函数判断所提供的字符是否可打印。\n* `int ispunct()` 函数用于判断提供的字符是否为标点符号。\n\
  * `int tolower()` 函数将大写字符转换为小写。\n* `int toupper()` 用于将字符转换为大写。\n\n\n\n\n\n```c\n\
  printf(\"Concatenated string: %s\\n\", A);\n\nreturn 0;\n\n}\n```\n\n输出：\n输入第一个字符串:\
  \ HELLO\n输入第二个字符串: UIET!\n拼接后的字符串: HELLOUIET!\n\n```c\n// 程序 11.23 检查一个字符串是否为回文\n\
  // 程序 11\\. 23 检查一个字符串是否为回文\n\n#include <stdio.h>\n#include <string.h>\n\nint main()\n\
  {\n    char string[100];\n    int i = 0, j = 0, palindrome = 1;\n\n    printf(\"\
  Enter a string: \");\n    scanf(\"%s\", string);\n\n    j = strlen(string) - 1;\n\
  \    while (i < j)\n    {\n        if (string[i] != string[j]) {\n            palindrome\
  \ = 0;\n            break;\n        }\n        i++;\n        j--;\n    }\n\n   \
  \ if (palindrome)\n    printf(\"%s is a palindrome.\\n\", string);\n    else\n \
  \   printf(\"%s is not a palindrome.\\n\", string);\n\n    return 0;\n}\n```\n\n\
  输出：\n输入一个字符串: ABCBA\nABCBA 是回文。\n\n```c\n// 程序 11.24 将大写字符串转换为小写\n#include <stdio.h>\n\
  #include <ctype.h>\n\nint main()\n{\n    char input_string[100], output_string[100];\n\
  \    int i;\n\n    printf(\"Enter a string: \");\n    scanf(\"%s\", input_string);\n\
  \n    for (i = 0; input_string[i] != '\\0'; i++)\n    {\n        output_string[i]\
  \ = tolower(input_string[i]);\n    }\n    output_string[i] = '\\0';\n    printf(\"\
  The string in lowercase is: %s\\n\", output_string);\n\n    return 0;\n}\n```\n\n\
  输出：\n输入一个字符串: HELLO\n小写后的字符串是: hello\n\n```c\n// 程序 11.25 在不使用 tolower 函数的情况下将大写转换为小写\n\
  #include <stdio.h>\n#include <string.h>\n\nint main() {\n    char string[100];\n\
  \    int i;\n\n    printf(\"Enter a string: \");\n    gets(string);\n\n    for (i\
  \ = 0; string[i] != '\\0'; i++)\n    {\n        if (string[i] >= 'A' && string[i]\
  \ <= 'Z')\n            string[i] = string[i] + 32;\n    }\n    printf(\"The converted\
  \ string is: %s\\n\", string);\n\n    return 0;\n}\n```\n\n输出：\n输入一个字符串: HELLO\n\
  转换后的字符串是: hello\n\n## 结论\n\n本章讨论了字符串，它是一种以空字符（null character）结尾的字符序列，可以使用 `char`\
  \ 数据类型声明，并用双引号包含字符串值来初始化。`scanf()` 函数可以用于读取字符串，但它存在一些问题，例如不接受空格后的字符串。这种局限性通过 `gets()`\
  \ 函数得以消除。C 语言还有几个内置字符串函数可以用于处理字符串。这些包括 `strlen()`、`strcat()`、`strcmp()`、`strcpy()`、`strrev()`、`strupr()`、`strlwr()`、`strncmp()`、`strncat()`\
  \ 和 `strncpy()`。二维字符串是字符串的集合。\n\n`ctype.h` 头文件包含了几个内置函数方法，可以用于字符的 er 和操作。这些函数包括如\
  \ `isalpha()`、`isdigit()` 和 `toupper()` 等。你可以使用这些方法之一来识别字符是否为字母或数字，或者相应地将字符转换为全大写字母。\n\
  \n在接下来的章节中，我们将介绍编写函数的流程、为什么它们是必要的、不同类型的函数以及调用函数的两种不同方式：按值传递和按引用传递。此外，还将详细讨论存储类（storage\
  \ classes）。\n\n## 记忆要点\n\n*   字符串是一个以空字符结尾的字符集合。\n*   `'\\0'` 是空字符，因为它的 ASCII 值为\
  \ 0。\n*   不以空字符结尾的字符串不是字符串。它将是一个简单的字符数组。\n*   `scanf` 函数无法处理字符串，因为它不接受空格后的字符串。\n\
  *   `gets()` 用于从键盘获取（输入）字符串，然后按回车键。\n*   `puts()` 用于在显示器屏幕上输出（显示）字符串。\n*   `strlen()`\
  \ 测量字符串长度，包括空格。\n*   `strcmp()` 比较两个字符串。\n*   `strcpy()` 用于将一个字符串拷贝到另一个字符串。\n* \
  \  `strrev()` 用于反转字符串。它接受一个字符串作为输入。\n*   `strupr()` 将小写字符串转换为大写。\n*   `strlwr()`\
  \ 将大写字符串转换为小写。\n*   `strncat()` 将一个字符串的 n 个字符附加另一个字符串的末尾。\n*   `strncpy()` 将一个字符串的\
  \ n 个字符拷贝到另一个字符串。\n*   `strncmp()` 比较两个字符串的前 n 个字符。\n*   二阶字符串有两个索引，一个用于行，一个用于列。它是字符串的字符串。\n\
  *   `ctype.h` 头文件包含了几个内置函数方法，可以用于字符的处理和操作。这些函数包括如 `isalpha()`、`isdigit()` 和 `toupper()`\
  \ 等。\n\n# 第 12 章：函数\n\n## 引言\n\n本章介绍了函数，它是编程中的基础构建单元。在本章中，我们将讨论函数的必要性、不同类型的函数以及调用函数的两种不同方式：按值传递和按引用传递。此外，还将详细讨论存储类。\n\
  \n## 结构\n\n在本章中，我们将讨论：\n\n*   函数的必要性\n*   函数的类型\n*   参数类型\n*   根据函数参数划分的类型\n*  \
  \ 调用约定\n*   将数组传递给函数\n*   存储类\n\n## 目标\n\n本章的目标是让读者理解函数。读者将探索函数的重要性、类型、参数分类以及调用约定。本章还将深入探讨将数组传递给函数。\n\
  \n\n\n\n\n- **模块化**：函数将大问题划分为较小的子问题。可以使用函数轻松地解决这些子问题。\n- **可重用性**：函数一旦写好，就可以在程序中通过简单的调用来重复使用。因此，函数增加了可重用性。\n\
  - **易用性**：用户可以使用内置函数，而无需担心这些函数的内部代码。\n\n### 函数的类型\n\n用户可以创建自己的函数，也可以使用现有的函数。以下是两种类型的函数。\n\
  \n- **内置或预定义函数**：`C` 中的头文件提供了大量的内置函数，可以根据需要从程序中调用。例如，`printf()`、`scanf()`、`strcat()`\
  \ 等。在程序中调用它们之前，必须包含定义这些函数的头文件。\n- **用户定义函数**：由用户根据自己的需求创建。用户可以方便地决定函数的名称。创建这些函数需要以下部分：\n\
  \n    - **函数声明或原型声明**：在不实际提供函数实现的情况下，它告诉编译器函数的返回类型、函数名和参数列表。它写在头文件之后的程序顶部。声明末尾必须加分号。如果被调用的函数定义在调用函数之前，则可以避免函数原型声明。函数原型的通用格式如下：\n\
  \n      ```\n      return_type function_name(parameter list);\n      ```\n\n   \
  \ - **函数定义**：它由函数头和函数体组成。函数头包含返回类型、名称和形式参数（如果有的话），列在括号内。函数原型以分号结束，但函数定义头不是；这是两者之间唯一的区别。以下是函数定义各部分的描述。\n\
  \n        - **返回类型**：函数可以向调用函数返回一个值，这被称为返回类型。不返回任何值的函数在名称前使用 `void`。\n        -\
  \ **函数名**：它是函数的名称。\n        - **参数**：它是从调用函数传递到被调用函数的信息。它充当函数的输入。如果函数没有参数，可以在括号中使用\
  \ `void`，也可以留空括号。\n        - **函数体**：这些是花括号内的语句，告诉我们函数的功能。\n\n      函数定义为函数分配了内存空间。其语法如下：\n\
  \n      ```\n      return_type function_name(parameter list) // 函数头\n      {\n \
  \     // 函数体\n      }\n      ```\n\n    - **函数调用**：每当主程序需要函数时，就可以调用。在程序中调用函数需要函数名和参数。当调用函数时，控制权从调用函数转移到被调用函数。分号结束函数调用。其语法如下：\n\
  \n      ```\n      function_name(parameter list);\n      ```\n\n      上述语法在实际代码中可以写为：\n\
  \n      ```\n      sum(x, y);\n      ```\n\n      `sum` 是函数名，`x` 和 `y` 是括号中的整数参数。\n\
  \n```\n// 程序 12.1 使用函数打印 HELLO\n#include<stdio.h>\n\nvoid print (void); // 函数声明或原型\n\
  \nvoid main()\n{\n  print( ); // 函数调用\n}\n\nvoid print() //函数定义\n{\n  printf(\"\
  HELLO\");\n}\n```\nOutput:\nHELLO\n\n```\n// 程序 12.2 在不传递参数时使用函数两个两个相加\n#include<stdio.h>\n\
  \nvoid sum(void); // 函数声明或原型\n\nvoid main()\n{\n  sum(); // 函数调用\n}\n\nvoid sum(void)\
  \ //函数定义\n{\nint a,b,c;\na=10;\nb=20;\nc=a+b;\nprintf(\"Sum=%d\",c);\n}\n```\nOutput:\n\
  Sum=30\n\n```\n// 程序 12.3 使用参数传递使用函数两个数字相加\n#include<stdio.h>\n\nvoid sum(int, int);\
  \ // 函数声明\nvoid main()\n{\nint a,b;\na=10;\nb=20;\nsum(a,b); // 函数调用\n}\nvoid sum(int\
  \ x, int y) //函数定义\n{\nint c;\nc = x+y;\nprintf(\"Sum=%d\",c);\n}\n```\nOutput:\n\
  Sum=30\n\n```\n// 程序 12.4 使用参数传递两个数相加，并将结果返回给主函数\n#include<stdio.h>\n\nint sum(int,\
  \ int); // 函数声明\nvoid main()\n{\nint a,b, d;\na=10;\nb=20;\nd = sum(a,b);// 函数调用\n\
  printf(\"Sum=%d\",d);\n}\nint sum(int x, int y) //函数定义\n{\nint c;\nc = x+y;\nreturn\
  \ c;\n}\n```\nOutput:\nSum=30\n\n### 参数的类型\n\n参数有两种类型。\n\n- **实际参数**：这些参数在函数调用中传递。不需要在实际参数中指定数据类型。它们也被称为实（argument）。看以下函数调用：\n\
  \n  ```\n  Sum = add(3,5);\n  ```\n\n  在这里，`3` 和 `5` 是实际参数。\n- **形式参数**：这些参数在函数定义中传递。我们必须为每个形式参数使用数据类型。\n\
  \n  ```\n  return_type function_name(parameter list) // 函数头\n  ```\n\n  在这里，`a`\
  \ 和 `b` 是形式参数。\n\n### 值传递\n\n上述语法在实际代码中可以写为：\n\n```\nsum(x, y);\n```\n\n`sum` 是函数名，`x`\
  \ 和 `y` 是括号中的整数参数。\n\n```\n// 程序 12.1 使用函数打印 HELLO\n#include<stdio.h>\n\nvoid print\
