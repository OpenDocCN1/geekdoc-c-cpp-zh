    # 致谢


    感谢那些从未放弃过我（你们知道自己是谁）的朋友和家人，给了我无尽的赞美和支持，成就了今天的我。我站在这里是因为有你们，我永远不会忘记。


    感谢 Anthony Robbins 和 Tim Ferriss，你们启发了我，释放了一位肩负使命的男人，他将继续推动一场造福世界的运动。谢谢。你们是我真正的英雄。


    特别感谢 Tayfun Karadeniz（又名 TK，又名 TNutz）。没有你，这一切都不可能。感谢你让我有机会拥有今天的生活。我们是异父异母，成为你的业务伙伴是我的荣幸。我们还有许多战场要征服，可以说，没有别人比你更希望留在我身边的人了。


    感谢 Kate James（又名 Super Kate），你是将一切粘合在一起的胶水。感谢你成为摇巨星，并包容我那游泊、混乱的倾向。


    感谢我的母亲 Charlene Dindo，在每一个阶段都在我身边给予全力支持。感谢你的照顾，保护我免受世界的伤害。我为你的儿子感到自豪，这光芒将为了纪念你而继续闪耀。


    感谢 Robert Dindo。如果没有你对我的信任以及你提供的 `$1,800` 让我开启了这项创业，我的梦想生活将只是想象中的片段。


