    # 5. Lifestyle (45,286 active)


    Here are some more mind-blowing stats:


    * Apple hit the 15-billion app download mark in three years—it took Apple over
    7 years to sell 15 billion songs through `iTunes`.

    * According to a study commissioned by mobile application store operator, `GetJar`,
    the mobile application market will reach $17.5B by 2012.

    * Canalys is forecasting growth of $37B by 2015. Apple reports that `iOS` app
    developers have collectively made more than $3 billion in revenues since the `App
    Store` opened.

    * Google’s `Android` market, a rival platform and operating system to Apple’s
    `iPhone`, hit 250,000 apps with more than 6 billion total downloads in mid-2011.

    * On average, over 60 apps have been downloaded for every `iOS` device sold, according
    to market research firm `Asymco`.

    * More than 30 million apps are downloaded every day, according to `Asymco`.

    * The average selling price of paid apps will rise 14 percent year after year
    according to estimates by `Piper Jaffray` research firm and as reported in the
    `Wall Street Journal`.

    * Apple expects to make more money on apps than on music by 2014 according to
    `Asymco`.


    ## TAKE ADVANTAGE OF THIS PHENOMENON NOW


    When I was first getting started, I didn’t know about these business trends. I
    was excited to learn about entrepreneurs who had no previous experience in this
    business but were making money and enjoying freedom. It made sense to me. I had
    missed the Internet boom, and I wasn’t about to miss this one, so I jumped in.
    Because of that, I can say that this is my time and it can be your time too.


    This is the best time to launch into this business and take advantage of such
    an incredible opportunity.


    Mobile technology is fun, exciting, and filled with possibilities. It isn’t just
    a virtual reality. Instead, it’s a business reality for anyone who is open and
    dedicated to making it work.


    That being said, I will add one important distinction about the app business.
    People think that if they have one app idea, they can win the app lottery. The
    app business isn’t about getting rich quickly with one app. It’s about research,
    creativity, timing, and sound business sense, which includes creating several
    products instead of only one.


    ## THE PLAYERS


    Apps live on smartphones, just as various software programs live on computers.
    In smartphones, you can find several kinds of operating systems, called platforms.
    These platforms compete with each other for dominance in the smartphone market.


    The three biggest players offering different platforms are `Apple (iOS)`, `Google
    (Android)`, and `RIM (BlackBerry)`. Some app developers create products for all
    three platforms. Others specialize in one.


    Focusing on creating apps for Apple’s platform is the easiest easiest way to make
    money in the app business because Apple dominates the app market and because it’s
    easier to create apps for their devices. Apple devices all come with standard
    resolutions and compatible hardware, and there is only one mobile store for `iOS`
    apps. In contrast, Google’s `Android` has different phones with different screen
    sizes and multiple app stores. This makes developers’ lives harder and more complicated.
    They have to do additional programming for each `Android` device. It’s a hassle
    and costs you more. You can focus on creating more apps and more successful apps
    when you don’t have to spend time adapting your apps to all the different devices.


    Consumers trust Apple’s brand, and they have strong loyalty to Apple’s line-up
    of `iOS` devices. The company is known for its intuitive and innovative products,
    and the brand continually grows stronger with its cult-like following.


    So, start with the easiest, most well-known platform. Once you master that and
    gain more confidence, move to the other platforms and master those.


    [Table 1.1](#Chapter01.html_table1-1) shows the platforms in this app market.


    [Table 1.1](#Chapter01.html_tableanchor1-1) Platforms Available in the App Market


    ![image](images/f010-01.jpg)


    Even though Apple is my preference and leads the industry, more platforms mean
    more consumers are downloading apps. The new markets are expanding and may be
    fertile ground as you grow in your app business. While creating apps for Apple
    products is the most efficient starting point, it’s is important not to focus
    solely on one platform without checking in to see how the others are doing. Be
    flexible and keep an open mind. As the saying goes, the only constant in life
    is change, so be ahead of the curve and anticipate it as much as you can.


    ## APPLE—IPHONE/IPAD/IPOD


    Apple customers are fanatics. They will wait outside an Apple store for hours
    in the freezing cold to buy their products.


    Do you see people standing in line for the products of other platforms? No way.
    They don’t have the same type of loyal and raving fans. You can create apps for
    `Android` and `BlackBerry` as well. Almost everything I teach you in this book
    will rock your apps, regardless of what platform you choose, but I recommend starting
    with Apple, especially if you’re a newbie.


    Alan Johansen is another successful appreneur with zero coding experience. In
    two years, working as a solo apprenuer, he launched 30 apps, which have been downloaded
    over 11 million times.


    Alan has seen the `Apple App Store` evolve over the years and believes it is in
    its infancy. He says, “It’s refreshing to see the app stores support and reward
    independent developers. It’s refreshing to see them promote independent titles
    (instead of only promoting their own titles).”


    ## GOOGLE AND ANDROID


    `Android` is the second-largest mobile platform on the market and is available
    on more 100 devices made by manufacturers. It’s an open-source platform, which
    allows manufacturers of smartphones to adapt and use it without any costs. This
    has made Android the number one operating system in the world.


    Even though Apple sells more apps on its iPhones, Android is used on more phones.
    Year after year, Android has made the biggest gains in these markets, predominantly
    taking market share away from Apple’s `iOS` and RIM’s BlackBerry.


    But the research group `Kantar Worldpanel Comtech` believes that Apple’s `iOS`
    will make new advances against Android as the iPhone is made available to more
    carriers. Regardless of this, you should consider Android as the second platform
    you create apps for after making some money on Apple’s iOS apps.


    ## BlackBerry


    The BlackBerry app world is growing, too, at a steady pace of 69 percent per year.
    However, at this time, BlackBerry’s 772 million app downloads is dwarfed compared
    to Apple’s 18 billion and Android’s 6 billion downloads.


    ## SETTING UP SHOP


    The app business has practically zero overhead. I have no office, no equipment,
    and no employees. I have a `Macbook-Pro` and an `iPhone`, and that’s it. I run
    everything from my `iPhone`, even the daily management of independent contractors.
    I use my apps to advertise each other, so I have little to no marketing costs.


    What other business offers this kind of freedom? Few others, if any, can be run
    without an office and from anywhere in the world. You might not want to stay in
    a beach hut in Fiji, see the Seven Wonders of the World, or swim with sharks,
    but I’m sure you would love to do other things with your extra time.


    To start an app business, you need to sign up as a developer with the platform
    for which you’re looking to create apps. Don’t be intimidated by the word developer.
    It doesn’t mean you have to be the programmer. It’s simply the name used for somebody
    who publishes apps. (We cover outsourcing the programming of your apps in Chapter
    5.) All you have to do is set up a `developer account` so you can offer your apps
    for sale in one of the app stores.


    Here are the links for signing up with the different platforms and a brief overview
    of the requirements for each.

    '
