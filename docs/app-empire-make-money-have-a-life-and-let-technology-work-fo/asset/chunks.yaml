    能够在你那条连接点成线的旅程中为你提供灵感，我深感荣幸。


    # 引言


    ## 我是如何意外成为应用百万富翁的


    ### 地上最快乐的人


    我生命中最快乐的几天是在席睡在泥地上、觅食食物度过的。我徒步穿越雨林，看到隐藏的瀑布。我与村民一起狩猎野猪，并用椰子壳装着一种名为 `kava kava`
    的苦味药酒向部落 97 岁的酋敬酒。


    我当时在 `Savusavu` 岛上，它是斐济群岛 336 个岛屿中最偏远的地方之一。那里的人易于朗笑，饮食简单，依山自然而生。岛屿由充满活力的绿色山脉组成，从南太平洋清澈的蓝绿色海水中拔地而起。


    我选择在那里与村民生活一周，因为他们被认为是世界上最快乐的人之一。`Savusavu` 村民看起来比人们所能达到的更加满足满意，尽管他们的生活方式有时令我困惑，但他们的笑容不会撒谎的。


    看到斐济人的生活方式令人耳目一新，这与我以前过的任何经历都不同。我在如此短的时间内从这种文化中学到的东西可以总结为七个字：少即是多，爱无处。


    离开村庄后，我深受启发，想让其他人和我分享这段经历。令我惊讶的是，我在岛上一个偏远的商店里找到了 `WiFi` 信号，并给我的两个哥们 `Patrick`
    和 `Nadim` 发了邮件。


    ## 应用创业者（APPRENEUR）的生活方式


    我的生活就是一边做我热爱的事一边获得轻松的收入。我通过 `iPhone` 经营业务。我在虚拟世界工作，赚取真实的美元。我曾在澳洲内陆徒步艾尔斯岩，在沙漠与原住民一起远涉，曾徒步穿越洛基山脉，获得了了单人跳伞认证，在加拿大的惠斯勒滑滑雪，曾在球场旁观看
    `NBA` 总决赛，曾在火上行走，曾体验过蹦极，最重要的是，我学会了不要把生活对待得那么严肃。


    对于我的下一次冒险，我计划在我想去的九个地方每个呆三个月。这包括在阿根廷的布宜斯艾利斯学习武术，在哥伦比亚的波哥塔跳尔萨舞，在西班牙的潘普洛纳斗牛，以及在意大利威尼斯的运河乘贡船。


    我拥有着神奇的生活，事实是，无论背景如何，任何人都可以拥有这种生活方式。我是不断壮大的应用创业者群体的一员，他们通过应用程序（或简称应用）赚钱，这些应用运行在如
    `iPhone` 和 `Droid` 等智能手机，以及 `iPad` 或 `iPod Touch` 等移动设备上。应用创业者可以住在任何地方，无论处于生活的哪个阶段都可以创业。截至目前，世界上最年轻的应用创业者
    9 岁，最老的 80 岁。


    应用创业者在赚钱的同时，创造了极其自由的生活。我的两个应用创业者朋友每年有几个月在 `越南` 从事公益，而他们的业务正在产生七位数的收入。另一位朋友正带着孩子去看世界七大奇迹，为家人创造了无价的回忆。还有一位朋友带着妻子一年中大部分时间在欧洲背包旅行。


