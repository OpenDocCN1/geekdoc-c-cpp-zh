- fmt: "\n### Advantages\n\n* **Lots of programmers**—These sites have large databases\
    \ of programmers competing for your project.\n* **Fast responses**—You often get\
    \ bids within an hour or two of your posting.\n* **Skill and work history**—Programmers\
    \ have profiles that list their skills. You can review the previous projects they\
    \ have worked on. With this information, you can evaluate if they have the specific\
    \ skills for your app.\n* **Performance rating and reviews**—Clients can rate\
    \ and review the programmer. You’ll know if it’s worth spending more time assessing\
    \ the person.\n* **Price comparison**—Before posting your job, you can review\
    \ active and closed job listings of others to get an idea for what others have\
    \ paid for apps similar to yours.\n* **Escrow services**—Your funds are protected\
    \ and you only release them at certain milestones if you’re happy with the work.\n\
    \n### Disadvantages\n\n* **Communication**—Most of these programmers are overseas.\
    \ This can present issues with communication and time zone differences, so a `Skype`\
    \ interview is an absolute must before you continue.\n* **Protecting your idea**—Because\
    \ these sites are public bidding grounds, your ideas can get hijacked. When posting\
    \ a job, never post your idea or marketing plan. Use general descriptions until\
    \ you have an NDA.\n\n### Posting a Job\n\nHere are five pointers on posting a\
    \ job on `oDesk` and assessing the responses. The process is similar on the other\
    \ sites. Your ad should cast a wide net to attract as many applicants as possible.\
    \ You can filter later.\n\n1. **Enter the skill requirements**—What programming\
    \ languages do they know? `Odesk` and `Freelancer` allow you to list up to five.\
    \ This way only programmers with those skills will receive your job post. For\
    \ `iPhone` apps, the skills I use are `iPhone`, `Objective C`, `Cocoa`, and `C\
    \ Programming`.\n2. **Give a basic description of your project**—Keep it simple\
    \ and skill-specific. Tell the applicants that you will discuss details during\
    \ the selection process.\n3. **Post your ad only for a few days**—This way programmers\
    \ have a sense of urgency to quickly bid on your job.\n4. **Filter applicants**—I\
    \ always filter applicants using these criteria:\n    * They have a rating of\
    \ four or five stars.\n    * They have at least 100 hours of work logged.\n  \
    \  * Their English is good.\n5. **Compose a message to all suitable applicants**—This\
    \ message invites the applicant to a `Skype` call for further screening. Disqualify\
    \ anyone who is not willing to jump a `Skype` call.\n\nAs you interview more programmers\
    \ (regardless of where you find them) you’ll get skilled at finding the talented\
    \ ones. Even if a programmer passes all your tests, trust your gut because it’s\
    \ usually right.\n\n### How to Convey Your Idea\n\nWhen I began working with programmers,\
    \ I would explain to them what kind of app I wanted and how it should work. I\
    \ thought I was being clear and was surprised when I received products that weren’t\
    \ close to my vision. It would take several iterations and a lot of time and frustration\
    \ to fix things. I was even getting upset at the programmers at times, but it\
    \ turned out it wasn’t their fault. It was mine. I wasn’t communicating accurately\
    \ and was making the process frustrating for both of us. Once I realized what\
    \ the problem was, everything changed. Projects were completed much faster and\
    \ everybody was happier.\n\nTo convey my idea properly, I draw it on a piece of\
    \ paper. Maybe it will look like a three-year-old’s artwork, but it will still\
    \ convey what you’re trying to do. Some people like putting this together in digital\
    \ form on their computer. Whatever you’re most comfortable with and whatever gives\
    \ the programmers the details they need is the way to go.\n\nTo make things easier,\
    \ I look at certain apps in the `App Store`, and reference them to more accurately\
    \ show my programmers what I’m looking for. For example, I’ll say, “Download the\
    \ `XYZ` app. I want the `ABC` functionality to work like theirs. Take a look at\
    \ the screenshots from this other app, and change this.” I take certain components\
    \ of apps that I’d like to emulate, and give them to the programmer so that we\
    \ are as clear as possible.\n\nThe clearer you are, the fewer misunderstandings\
    \ and problems you will have. The idea is to convey what the app will look like,\
    \ where everything will be placed, and what happens if certain buttons are selected.\
    \ This helps the programmer know what you want and is a useful tool when designing\
    \ your app. Do not be vague or ambiguous. You should know what every part of your\
    \ app will do. If you don’t, you need to develop your idea more thoroughly. The\
    \ programmer will be unable to deliver what you want if you are uncertain what\
    \ that is.\n\nWhen I send the sketch to the programmer, I arrange a meeting over\
    \ `Skype`. My sketch usually is as detailed as possible but inevitably the programmer\
    \ has questions or points out flaws or technical hurdles. We talk it out, and\
    \ we ensure we understand how every screen, button, and feature is going to work\
    \ and look. This can take several iterations before we get it right. Programmers\
    \ shouldn’t write a single line of code until the design is finalized.\n\nThis\
    \ is part of figuring out the app’s complexity and functionality. As programmers\
    \ quote different features, they often give you new ideas that can improve your\
    \ apps. You don’t want to add too many extra features in the beginning due to\
    \ cost and time but you never know when you might get a free gold nugget worth\
    \ including. Sometimes you will find your idea is impossible and can move on without\
    \ wasting too much time.\n\nYou have to consider the design to be final once the\
    \ coding begins. You will have ideas for additional features as you start testing\
    \ the initial versions of your app. Changing things after some work has been done\
    \ can frustrate a programmer. It’s like telling your builder who has installed\
    \ your fireplace that you want it on the other side of the living room. That will\
    \ not go over too well. Most people don’t realize this is what they are demanding\
    \ of their programmer. That’s why you should take your time planning the app during\
    \ the design and why the quoting process is important.\n\nOn the other hand, you\
    \ can’t anticipate every question that may arise during development, and you may\
    \ have to change your design. This is normal and programmers expect this to a\
    \ certain degree. Nonetheless, don’t make major changes that negate days or work\
    \ and put your team on edge.\n\n### Testing Hired Programmers\n\nNow it’s time\
    \ to get quotes and test the candidates. I recommend going to three different\
    \ programmers to get quotes for each one of your three ideas. Most people think\
    \ they have to invest a lot of money to create a hit app. To give you an idea\
    \ of my initial start-up costs with my first app, I paid the developer `$1800`\
    \ and the return on that investment was in the six figures. Pricing will vary\
    \ based on the app but, keep your initial development costs as low as possible.\
    \ As you gain more experience and are making money, you can safely move up to\
    \ higher cost projects.\n"
