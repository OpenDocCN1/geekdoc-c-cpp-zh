    严格来说，这是一种利益冲突，因为你的竞争对手正在开发你的产品。这种现象在行业中非常普遍，你可能无法避免它。只需通过向程序员展示你对此的警觉来尽可能地保护自己，并让他们签署
    `NDAs`（保密协议），可能还有针对特定应用程序的竞业协议。但不要让这阻碍你继续前进。


    # 招聘和挑选程序员


    当我 2009 年初创办自己的公司时，这个行业还非常新，很难找到高质量的程序员。由于全球范围内的 App 热潮，现在你可以更容易找到他们了。许多软件开发公司现在都专注于
    App 开发。许多独立程序员也出现在世界各地。


    对于我的前几个应用，我发现与一家知名公司合作比与独立程序员合作容易得多，在与独立程序员合作之前，他们可以手手手指导。这是一个很好的起点，因为这家公司擅长与没有经验的客户交道。我建议你也采取同样的路线，因为大公司在教育这些新手出炉方面有更经验。这将帮助你加速学习
    App 开发的基础知识，并教你如何与程序员交流。与这家公司的合作带了我在 App 业务中继续前进所需的信心和动力。


    你是如何寻找程序员的？嗯，你有许多寻找程序员的方法，例如简单的 `Google` 搜索、像 `Monster`、`Craigslist` 这样的招聘网站、App
    会议、聚会小组、程序员论坛、口碑以及外包网站（如 `oDesk` 和 `Freelancer`）。这些方法中有些比其他方法更容易，但并没有什么万能公式。你必须利用各种来源并评估多个程序员，直到你找到几个让你觉得可以放心地合作的人。


    在评估每个程序员或公司时，你的方法基本上是相同的。一旦你在电话里或 `Skype` 上联系了程序员，就一直面试他们，直到你觉得可以进入报价阶段为止。这是一场工作面试，而你是老板。以下是我的问题清单：


    * 你开发 App 多久了？

    * 你做过多少个 App？

    * 我可以看看你做过的 App 吗？

    * 你有网站吗？地址是什么？

    * 你有可以让我交流的推荐人吗？

    * 你的时间安排怎样的？什么时候可以开始？

    * 获得报价需要多长时间？

    * 我们之间的时差是多少？（如果他们在不同的时区）

    * 你通常什么时间工作？你的工作时间是怎样的？

    * 与客户合作时什么让你感到沮丧？

    * 你是和团队合作吗？他们的技能是什么？

    * 你能制作图形吗，或者你有人可以做吗？

    * 我可以看看图形作品的示例吗？

    * 如果你在项目期间生病了怎么办？

    * 如果你在项目期间遇到技术障碍怎么办？你有其他团队成员或可以帮助你的程序员脉网络吗？

    * 你能提供固定费用报价吗？

    * 你的支付计划是怎样的？

    * 你可以创建与付款挂钩里程碑吗？

    * 你会在 `App Store` 上发布自己的 App 吗？

    * 你如何确保自己不会与客户竞争？

    * 你是如何将 App 提交到 `App Store` 的？（他们可以引导你吗，还是他们让你觉得脑力受挑战？）


    这个列表会根据你交谈的对象而改变。一家成熟的开发公司可能拥有了自己的开发和图形团队，但在继续进行之前，你必须获得上述问题的答案。此外，你不需要听起来像个事教官或问一些愚蠢的面试问题。上述列出的问题很重要，如果你以友好的语气询问，不应该让交谈的对象产生防御心理。在面试期间，我总是面前拿着这份问题清单，并在获得回答时做笔记。我发现，在商务对话中，加入一些个性并增加一点乐趣是好的。在提问时请记住这一点。


    在交谈过程中，注意他们说明自己的能力如何。他们表达清晰吗？他们使用了过多的术语吗？他们真的说的是同一种语言吗？他们对答案看起来自信吗？他们的语气和态度如何？如果你有任何问题或担心，你可能想换别人。如果你能与他们交流，并且你的直觉告诉你可以，你就想进入下一步。


    无论结果如何，都要感谢他们的时间，并提到如果你决定继续，将跟进一份 `NDA` 协议。不要在这次初步对话中透露你的想法。每当提到这个话题时，就说在签署 `NDA`
    后你会非常乐意讨论一切。你必须保护你的想法、源代码和任何其他知识产权，因为这些是你的资产。


    处理你代码的人也要小心。随着业务的增长，你不仅会创建新的 App，还要维护现有的 App。这意味着你必须把代码交给任何需要对其进行更改的人。只有在你建立了一定程度的信任后才这样做。这对于你的热门
    App 来说尤为如此。


    一旦 `NDA` 落实，就是时候深入研究并确保开发者有技能完成你的 App。在这里你没有任何回旋的余地，特别是对于你的第一个 App。要么他们知道如何做，要么他们不知道。你想听到的是诸如“我确切知道怎么做”或“我做过类似的
    App，所以这不是问题”之的话。你不想听到诸如“我应该能做到，但我得研究一下”或“我不确定但我可能可以办法”之的话。如果你听到这些词，就换一个他们有他们 App，或者赶紧溜之。


    例如，假设你正在开发一个具有复杂需求的新 App。你可以找到做过很多 App 的优秀程序员，但如果他们从未处理过音频，那么他们就是糟糕的选择。利用他们的专业知识来完成你的其他
    App，并为音频 App 寻找另一个人。


    在整个整个过程中，你将获得关于他们响应能力的反馈。如果他们签署 `NDA` 和澄清事情花费了太长时间，这可能表明开发过程将会非常缓慢。


    使用外包网站可以是寻找熟练、低成本程序员的绝佳工具。这些网站允许程序员对你发布的职位进行竞标。正如你想象的，这种竞争创造了竞标热潮，你有机会以低廉的价格获得高质量的工作。以下是三个顶级外包网站（参见图
    5.1）：


    图 5.1 Elance、oDesk 和 freelancer 的截图。


    ![image](img/f086-01.jpg)


    image


    image


    1. `oDesk` (`appempire.com/odesk`](http://appempire.com/odesk))——它的工作日记功能跟踪程序员为你工作的时间，并定期间隔捕捉程序员桌面的屏幕。你可以查看这些图像，确认程序员正在处理你的项目而不是而不是参加当地的躲球锦赛。

    2. `Freelancer` (`appempire.com/freelancer`](http://appempire.com/freelancer))——这个网站列出的程序员最多。他们声称会有两倍的程序员响应你的广告，我发现事实大部分如此。

    3. `Guru/Elance` (`appempire.com/guru-appempire.com/elance`](http://appempire.com/guru-appempire.com/elance))——这些网站有大量的程序员列表，让不同的人才储备池为你的业务竞争总是是好事。


    以下是这些网站的优缺点。


