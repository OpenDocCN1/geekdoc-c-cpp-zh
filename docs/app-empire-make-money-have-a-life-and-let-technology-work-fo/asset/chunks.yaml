    The App Store analyzer, Chomp, publishes a series of metrics relating to both
    the App Store (Apple) and Android Market (Google) each month, which provides valuable
    insight into the mobile market (see [Figure 3.3](#Chapter03.html_figure3-3)).
    Take note of these statistics, especially the interests and spending habits of
    consumers.


    [FIGURE 3.3](#Chapter03.html_figureanchor3-3) Chomp’s iOS Search Analytics Report.


    ![image](images/f043-01.jpg)


    The illustration below shows that 83 percent of all searches on the App Store
    are based on functionality or a category, such as puzzle games or photography,
    rather than a specific name of an application. With more than 500,000 applications
    on the App Store, users probably know few, if any, apps by name. This type of
    insight can mean the difference between sleeping on your buddy’s futon or living
    in a penthouse overlooking San Francisco Bay.


    ## HOW DEVELOPERS MAKE MONEY


    You won’t have to be a cheesy used car salesman or wear a suit and tie to sell
    apps. This can be the easy part when it comes to your business. Apple has single-handedly
    revolutionized the world of software distribution. Once you create an app and
    publish it on the App Store, it becomes accessible on every iOS device in over
    120 countries. (See [Figure 3.4](#Chapter03.html_figure3-4).)


    [FIGURE 3.4](#Chapter03.html_figureanchor3-4) App stores in Europe.


    ![image](images/f045-01.jpg)


    The nice thing for developers is that these little 99-cent transactions can snowball
    into millions of dollars, especially when they happen around the world at all
    hours of the day.


    Paid apps can cost anywhere from 99 cents to $999 per download. Most paid apps
    are 99 cents like the highly successful apps Doodle Jump or AppZilla, but a small
    number of apps like the bar exam prep app called `BarMax` or the exclusive VIP
    venues app called `iVip Black` go for as high as $999.


    With such a large range, you might be asking yourself what’s the best price point
    for an app. Those dollar stores you see all over the place have it figured out.
    Like discount stores that offer everything on their shelves for under a dollar,
    the sweet spot for paid app pricing is 99 cents.


    This is the most lucrative price point for developers and I don’t recommend selling
    apps at higher prices because the market share is too small. You might make money,
    but you are less likely to make big bucks, and it’s risky.


    Becoming a millionaire by selling millions of downloads at 99 cents is easier
    than 50,000 downloads for $20 each. The lower price gives you an easier sell,
    and the App Store top charts ranking you get from having more downloads gives
    you more visibility.


    My goal is to help you create the lifestyle you want sooner than later, which
    means making as much money as possible and as quickly as possible. If you go the
    route of the 99-cent app, or even the free app model, you are more likely to have
    the market share and funds to support the lifestyle that you want.


    Some high-end game companies, like Electronic Arts, charge more for its paid apps,
    such as $4.99 versus 99 cents. Unless you have millions of dollars in brand recognition,
    higher price points are not the way to go.


    Even though paid apps continue to be a major source of revenue for developers,
    free apps have surpassed paid apps as the primary source of revenue. Many developers
    have created their own money tree by offering free apps. Free apps can make developers
    a lot of money, and they are a great way to give the market a litmus test. You
    can find out if users have an appetite for your app and adjust your strategy accordingly.


    Free apps can be monetized in a number of ways. Sometimes, they have basic functionality
    and are used to advertise their full-featured paid versions. This tool is so important
    that even the developers of successful paid apps, like `Angry Birds`, use free
    apps to funnel traffic to their paid apps.


    Developers occasionally make their paid apps free for a limited amount of time
    to increase their app’s user base more quickly and give the app a chance to go
    viral.


    Another use is a full-featured free app that is monetized by advertising or in-app
    purchases. If users like the app, they’ll continue to buy additional paid features
    within the app. As you can imagine, multiple sales within a free app can be much
    more lucrative for a developer then a one-time upfront sale.


    Free apps fail when the customer gets bored and stops using them. An inactive
    customer is a lost customer, which means less money going into your bank account.
    Therefore, you must keep the user engaged by providing additional free and paid
    features and benefits. Allowing users to brag about their achievements on Facebook
    or other platforms gives an app a shot at going viral. This type of visibility
    gets more people interested in the app.


    `Songify` is a great example of a free app that uses the techniques mentioned
    above. The app allows users to create songs using their own voice. The user’s
    recorded voice is auto-tuned (think T-Pain) and layered over one of the soundtracks
    provided with the app. The result is a surprising masterpiece of fun music that
    turns the average shower singer into a Grammy award winner. This app keeps users
    engaged because they can create new recordings and mix and match them with different
    songs. The developers monetize and add more value to `Songify` by offering additional
    songs users can purchase for 99 cents. Users can post their creations and show
    them off to the world using Facebook, email, or Twitter.


    We will go over app revenue models in much greater detail in Chapter 9.


    ## THE IMPULSE BUY


    Apps appeal to buyers for many reasons. One main reason so much money is spent
    on them, and why a recession is unlikely to affect the core business is because
    app sales are instantaneous. The impulse buy happens in the blink of an eye, with
    a specific purchase process. I tested this with many users and found that, in
    the App Store, the average customer goes through the same six-step process:


    1. They discover the app by searching or browsing the App Store (see [Figures
    3.5](#Chapter03.html_figure3-5) and [3.6](#Chapter03.html_figure3-6)).


    [FIGURE 3.5](#Chapter03.html_figureanchor3-5) Discovered through search.


    ![image](images/f048-01.jpg)


    [FIGURE 3.6](#Chapter03.html_figureanchor3-6) Discovered through browsing.


    ![image](images/f048-02.jpg)


    2. They check out the app’s icon. People are visual. They like interesting icons
    that tell them what the app does, like a camera for a photo app. `Flight Control`’s
    icon has a big plane on it and the cartoon vibe tips users off that it’s a game.


    3. Next, the customers read the title and glance at the rating; `Flight Control`.
    The title says it all. “If you want something exciting, this is your game.” With
    9,060 ratings and 4.5 stars, there’s no question about the app’s popularity.


    4. The customers’ eyes then fall on the description, which they scan as they move
    down to the screen shots. (See [Figure 3.7](#Chapter03.html_figure3-7).)


    [FIGURE 3.7](#Chapter03.html_figureanchor3-7) Icon, name, ratings, and description.

