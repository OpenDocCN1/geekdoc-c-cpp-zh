- fmt: '

    # Testing


    Hand the app to them and say something like, “Hey check this out.” Don’t mention
    that it’s your app, what it’s supposed to do, or how it works. Give as little
    information as possible and watch them as they understand and navigate your app.
    This experience will be similar to the one your real user will have because you’re
    not there to explain things to them as well. Watch them testing your app and ask
    yourself these questions:


    1. Are they confused?

    2. Are they stuck?

    3. Are they complaining?

    4. Are they using the app the way you intended?

    5. Did they find a mistake (also called a bug) because of using the app in a different
    way?

    6. Are they having fun?

    7. Are they making suggestions for improvements? If yes, which ones?


    Get them to tell about their experience with it. They will be more honest if they
    don’t know the app is yours. Don’t get offended if you hear something you don’t
    like. This feedback is priceless. Assess each response to see if your app has
    a problem. Ask yourself these questions:


    1. Would other users have the same issues? If yes, how can you fix it?

    2. Should you move things around?

    3. Should you change colors to improve visibility?

    4. Would adding some instructions help?

    5. Should you improve navigation?


    I showed one of my latest apps to my friend, Jason. While he was testing it, he
    had a small problem. “Chad, it looks nice, and it seems pretty cool,” he said.
    “But how do I get back to the main menu?”


    “Right there,” I said. “Where?” he asked. And it dawned on me. The back button
    was the same color as the background, and it was small. It was not registering
    as a button in his mind, and I realized this would be an issue for others. Those
    extra 10 minutes showing him the app paid off.


    After you gather the feedback, have your programmers make the fixes or changes.
    You want to guarantee the app works on different models of iPhones, iPod Touches,
    and maybe iPads. Apple continues to innovate and come out with new devices every
    year. The more of these your app can support the better. This is something to
    discuss early on with your programmers. Make sure they create the app with the
    different devices in mind.


    Again, you want to test your app on all these devices but that’s impractical when
    you’re getting started. It will be your programmers’ job initially to test the
    app on all the different devices. I ask my programmers to create a detailed feature
    checklist that I look over and improve if necessary. I test each feature until
    everything works as expected.


    Testing and debugging will take several iterations, like the design and development
    stages. This is all part of the process. Use the `TestFlight` app and service
    mentioned before to save lots of time with the mechanics of installing test versions
    of your app. At some point, you’ll be wrapping up changes and sending the app
    off to the iTunes store for distribution.


    It’s a good idea to have your programmers show you or someone on your team how
    to submit your first few apps. Don’t give out your online developer portal login
    information to your programmer or anybody else. The best way to do this is to
    use `Skype` or `GoToMeeting` and share your screen while they walk you through
    the process. As your business grows, you might want to delegate this work to someone
    on your team.


    And keep in mind, all of this is much easier than it sounds. Now that you understand
    the importance and process of creating a development team, it’s time to take things
    up a notch and have some fun. In the next chapter, we’re going to discuss your
    most important job, which is marketing your apps.


    ## What I Learned

    1.

    2.

    3.


    ## Actions to Take

    1. Look for programmers.

    2. Interview at least 10 and select the best three.

    3. Create a thorough design for your app idea.

    4. Get quotes from the three programmers you selected.

    5. Choose one and test him.


