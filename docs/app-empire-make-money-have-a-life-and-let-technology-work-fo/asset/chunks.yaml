    With my free Phone Security app, I was getting around 30,000 downloads a day without
    generating much revenue. To address this, I added a nag screen to get consumers
    to upgrade to the pro version. This added around $650 a day immediately. I was
    converting about 3 percent of the daily free traffic into sales of my paid app.
    This had such a profound effect that my paid ranking moved up the rankings from
    280 to 26, which created more visibility and, ultimately, sales. This upward positive
    spiral was all fueled by the nag screen on my free app. This is the power of the
    app network.


    ## Implementing Nag Screens


    When adding a nag screen, explain to your developer what you are looking for,
    and reference specific examples of other apps that have nag screens. Be sure you
    can change the nag screen without submitting a new update to the app store. To
    do this, tell the developer you want your nag screen to be dynamic. That way you
    can change the marketing message and the app you’re advertising at any time. This
    will allow you to redirect your app network traffic within seconds. This is an
    absolute must. Your nag screens will lose a huge part of their effectiveness if
    you cannot change them on the fly.


    For this to happen, the developer must implement something called a server-client
    interaction so every time the app launches, it checks in with the server and gets
    the latest version of the nag screen. You’ll be able to edit your nag screen on
    the server, and your app will show the new version of your nag screen. Your developer
    should be able to understand this concept and create the dynamic nag screens you’re
    looking for. You also need to be able to turn off your nag screens and turn them
    back on.


    Keep your nag screens simple, short, and benefit-oriented. The amount of space
    you have is limited. Maximize the impact of your message by focusing on the benefits
    of the app you’re promoting. It’s crucial to include a call to action as well
    as seen in [Figure 8.1](#Chapter08.html_figure8-1).


    How do you assess the effectiveness of your nag screen? All you have to do is
    keep track of how many times you show a particular nag screen as opposed to how
    many of those users click on `yes` to check out the app you’re promoting. This
    is called your click-through rate, and the higher the percentage the better.


    Special promotions usually receive higher click-through rates. “Upgrade now before
    the price goes back up” or “Free only for a few days so get it now” are useful
    calls to action. You should test and change your nag screen message on a regular
    basis to see if can get better click-through rates. Track all of this activity
    with `Flurry` so you can make informed decisions on what nag screen copy converts
    the best.


    Add nag screens to all of your apps, even the paid ones. You should not turn on
    the nag screens of your paid apps because that will really annoy your users. But
    you never know when you might decide to make one of your paid apps free for a
    certain amount of time. You want to have the freedom to turn that app’s nag screen
    on and direct its traffic to another app in your app network, especially if it
    takes off and starts generating lots of traffic. If you don’t, you could lose
    out on a lot of money.


    ## Promo Pages


    If the nag screen is your most important cross-promotion tool, your promo page
    will be your second most important (see [Figure 8.3](#Chapter08.html_figure8-3)).
    Unlike the nag screen, you can cross-promote more than one app at a time, and
    that is the power of the promo page. This is essentially a section of your app
    that lists all of your other apps and the apps of the developers with whom you’re
    cross-promoting.


    [FIGURE 8.3](#Chapter08.html_figureanchor8-3) Promo page example.


    ![image](images/f139-01.jpg)


    The promo page example shows several apps covering the entire page. Users are
    able to scroll down to see more listed apps. Keep this page simple like the nag
    screen. Only include the `icon`, `title`, and a short description of the apps
    that you are promoting. Make sure your short description is enticing, and avoid
    clutter at all costs. You need to have an arrow at the right side of each app.
    This shows users they will get more information when they touch the banner, and
    it’s a subtle call to action.


    Each one of those banners links to the promoted app. When users touch the banner,
    they are taken to the App Store to review and download that app. This is a powerful
    tool to further increase sales. I’ve tested several color schemes for the promo
    page and have found that the bright gray and dark gray banner background color
    scheme of the App Store works best. I recommend you do the same if you want to
    maximize the click-through rates of your promo pages.


    Each one of the banner positions of your promo page will be worth a certain amount
    of money based on the daily traffic of your app. The higher the banner position,
    the more money it is worth because it gets more visibility and thus users click
    on it more often. For example, if one of your apps is getting 10,000 downloads
    a day, you can assume that a certain number of your users will enter your promo
    page. Let’s say 25 percent of the 10,000, which is 2,500 users. If you can generate
    sales from only 10 percent of those users who have entered your promo page, you
    will have another 250 sales, which is about $175. And that’s from the promo page
    of only one of your apps.


    You might wonder how to direct people to the promo pages in your apps. Every one
    of your apps needs to have a button to the promo pages. Every one of your apps
    needs to have a button to the promo pages. Every one of your apps needs to have
    a button to the promo pages. Every one of your apps needs to have a button to
