    I dedicate this book to every student of life who consistently dances in the face
    of fear, who pushes through obstacles with unyielding certainty, who has unrealistic
    dreams and pursues them against all odds, and, as President Theodore Roosevelt
    once put it, “Whose place shall never be with those timid souls who know neither
    victory nor defeat.”


    I am humbled by the opportunity to inspire you in your own journey to connect
    the dots.


    # Introduction


    ## How I Accidentally Became an App Millionaire


    ### THE HAPPIEST PEOPLE ON EARTH


    I spent some of the happiest days of my life sleeping on dirt and foraging for
    food. I hiked through rainforests and saw hidden waterfalls. I hunted wild boar
    alongside the villagers, and I toasted the tribe’s 97-year-old chief with a bitter
    tonic called `kava kava`, which we drank from coconut shells.


    I was on the island of `Savusavu`, one of the remotest of 336 islands along Fiji’s
    archipelago. The people there laughed easily, ate simply, and lived off the earth.
    The island was made up of vibrant green mountains that shot up out of the pristine
    turquoise waters of the South Pacific.


    I chose to spend a week living amongst the villagers there because they are considered
    to be some of the happiest people on earth. The people of the `Savusavu` villages
    seemed about as content and satisfied as one could get, and though their ways
    puzzled me at times, their smiles didn’t lie.


    It was refreshing to see how the Fijian people lived, which differed from anything
    I had ever experienced before. What I learned from this culture in such a short
    time can be summed up in seven words: Less is more, and love is everywhere.


    After leaving the village, I was so inspired that I wanted others to share the
    experience with me. To my surprise, I found a `WiFi` signal in a remote shop on
    the island, and I e-mailed two of my buddies, `Patrick` and `Nadim`.


    ## THE APPRENEUR LIFESTYLE


    My life is about doing what I love while earning easy income. I run my business
    from my `iPhone`. I work in a virtual world, earning real dollars. I’ve hiked
    `Ayers Rock` in the Australian Outback, trekked with `Aborigines` across the desert,
    hiked the `Rocky Mountains`, got certified in solo skydiving, heli-skied in `Whistler`,
    Canada, saw my favorite team play in the `NBA` finals from courtside seats, walked
    on fire, went bungee jumping, and most important of all, learned not to take life
    so seriously.


    For my next adventure, I plan to spend three months at a time in nine places I
    have always wanted to visit. This includes learning martial arts in `Buenos Aires`,
    Argentina; dancing salsa in `Bogotá`, Colombia; running with the bulls in `Pamplona`,
    Spain; and riding gondolas on the canals of `Venice`, Italy.


    I have an amazing life and the truth is anyone can have this lifestyle regardless
    of his or her background. I am part of a growing community of appreneurs, entrepreneurs
    who make money from applications, or apps, that are used on smartphones like `iPhones`
    and `Droids`, and other mobile devices such as `iPads` or `iPod Touches`. Appreneurs
    can live anywhere and can start a business regardless of their stage in life.
    As of this writing, the world’s youngest appreneur is nine, and the oldest is
    80.


    Appreneurs earn money, while creating lifestyles of great freedom. Two of my appreneur
    friends spend several months of the year doing nonprofit work in `Vietnam`, while
    their businesses are generating seven-figure incomes. Another is taking his kids
    to see the Seven Wonders of the World, creating priceless memories with his family.
    Still another friend goes backpacking throughout Europe with his wife for most
    of the year.

