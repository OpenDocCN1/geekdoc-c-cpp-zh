- fmt: '

    My friends Michael Moon and Quoc Bui make $80,000 to $100,000 a month on the App
    Store with their company FreeTheApps. Michael always says, “Don’t be discouraged
    if you see that your idea has already been done. That just means that there is
    a market for your idea, and if anything, this should be encouragement!”


    Some of the greatest app ideas are improvements on an existing app or a twist
    on an old idea, taking it in a fresh, new direction. The story of Smack Talk and
    the series of Talking Friends apps is a perfect example of the idea of emulation
    at work.


    Smack Talk was an app that became successful in the early days of the App Store.
    (See [Figure 4.3](#Chapter04.html_figure4-3).) The app portrays cute, little animals
    repeating whatever you say but in a high-pitched voice. It was an intuitive, innovative,
    first of its kind, incredibly entertaining app. Seriously, who wouldn’t love a
    little hamster sounding like someone who had inhaled helium repeating your own
    words?


    [FIGURE 4.3](#Chapter04.html_figureanchor4-3) Smack Talk.


    ![image](images/f064-01.jpg)


    Smack Talk stayed on the top charts for quite some time and was a sensation. This
    was a great accomplishment for a great app. Many developers followed this app
    in awe, wishing it was their idea. They didn’t dare to compete because trying
    to surpass such a successful app seemed like fighting a losing battle. They accepted
    that this genre had been cornered by Smack Talk and continued with business as
    usual.


    However, a company called Outfit7 had other plans. It didn’t hesitate to compete
    and take the concept to a new level. It made a variant of the application called
    Talking Tom ([Figure 4.4](#Chapter04.html_figure4-4)), which included the basic
    voice playback feature in addition to a 3D interactive cartoonish cat. The user
    was entertained through the voice playback and could enjoy a new set of features
    such as the ability to touch the cat and get a reaction. The app offered new ways
    of interacting, more animation, and brilliant marketing.


    [FIGURE 4.4](#Chapter04.html_figureanchor4-4) Talking Tom.


    ![image](images/f065-01.jpg)


    Talking Tom overtook Smack Talk in 2010, but Outfit7 pressed on to create an entire
    suite of Talking Friends apps with lots of different animals. This made Outfit7
    a multimillion-dollar company and one of the most successful app companies to
    date. Its apps have been downloaded over 200 million times and have consistently
    appeared in the top 100 paid and free apps overall.


    Who would’ve thought that a well-developed and successful app could be taken to
    such new heights? These opportunities are all over the App Store waiting to be
    discovered.


    If you’re just starting out, stick to creating apps in areas that have high demand.
    Find something that a large group of people, from teenagers to adults, can find
    useful or fun instead of catering to a niche group. Stick to low-risk, high-probability
    apps.


    Does this mean you should never be innovative and try something that hasn’t been
    done before?


    Actually, yes. Well, sort of . . .


    ### LEARN FROM EXISTING APPS


    Most inexperienced apprenuers spend far too much of their time trying to be original,
    when what they are looking for is right in front of them.


    I’m not suggesting you copy another developer’s app, but your first step should
    be to get curious and see what other successful developers are doing. You should
    spend time figuring out why their apps work, read user reviews, and collect data.


    Whenever you decide to look into emulating an app, ask yourself these six questions:


    1. Why are people purchasing this?

    2. Can I do something to emulate this idea and take it to another level?

    3. What other apps would this app’s demographic like?

    4. How many other similar apps are in the market? (Go to [appempire.com/topappcharts](http://appempire.com/topappcharts)
    to find out.)

    5. How successful and consistent have they been?

    6. How does their marketing and pricing model work?


    When you look at all the top lists, think about which applications you would genuinely
    consider downloading. Why do you like them, and what stands out about them?


    Think about how to take the same concept to the next level while continuing to
    attract the same demographic. Write what improvements you would make. Would you
    add a new feature? Change the look? Add better graphics and marketing? How would
    you give users more value?


    Look at more than one competitor. Download all of the successful competitors of
    this app. Learn what these apps do right and where they fall short. Decide whether
    you can do this better, while incorporating what your audience is asking for.


    I see this happening on the App Store on a consistent basis, and here is a recent
    example of how I put the power of emulating other apps into action.


    After the Apple ranking algorithm change, I started noticing a shift in app rankings.
    During my daily research, I saw that some apps that had rarely appeared in the
    top charts, like emoticon apps, were starting to rise in the rankings. I love
    using those emoticons and wanted to do an Emoji app, but until that time, I had
    not seen the market get too excited about them. Also, most Emoji apps are simple
    and are used only once: to unlock the Emoji keyboard.


    With the markets interest increasing, I decided to take a closer look and downloaded
    all the major emoticon apps. I liked what I saw, but I noticed the apps had limited
    functionality. How could my app be better than a competitor’s if the Emoji keyboard
    had a limited number of emoticons that could not be increased? How lucrative could
    an app be if it is used once? I think most other developers would have allowed
    these limitations to stop them from pursuing this idea, but I’ve always been stubborn
    and this time it paid off.


    So, I kept brainstorming until it hit me. If I could not add more smileys to the
    Emoji keyboard, then why not include a bunch of smileys within the app that people
    could send as images via text messages, emails, or any other medium that could
    handle images? With that in mind, I created an app that unlocked the Emoji keyboard
    and added value with more 450 smileys, which could be shared via SMS, e-mail,
    Facebook, and so on. This became more fun for users because they had to return
    to the app to send an emoticon. (See [Figure 4.5](#Chapter04.html_figure4-5).)


    [FIGURE 4.5](#Chapter04.html_figureanchor4-5) Emoji screenshots.


    ![image](images/f068-01.jpg) ![image](images/f068-02.jpg) ![image](images/f068-03.jpg)


    This Emoji app was developed in two weeks. It followed the freemium model, meaning
    free, with an in-app purchase option. The app hit the number one spot in the App
    Store’s productivity category and the number 12 spot in the top free overall category
    within six days, raking in nearly $500 a day. BINGO.


    ### NARROW DOWN YOUR IDEAS


    As you do your research, make sure to capture the top app ideas you would like
    to emulate. You might have a bunch of ideas and not know which one to focus on,
    but don’t worry because this is normal. One way of simplifying things is to remember
    from Chapter 3 that only two types of apps exist: entertainment and utility. You
    can always focus on one of these first if it makes your task simpler.

