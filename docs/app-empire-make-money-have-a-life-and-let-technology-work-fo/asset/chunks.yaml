  trans: '

    随着你在该领域经验的积累，所需的指导会越来越少，但初期这至关重要。你会很快发现你交道的程序员是否天生就具备这种特质。他们会向你提问，并通常会为你提供一门快速课程，帮助你理解想要创建的应用范围。这非常重要。程序员不应该是你唯一的教育来源，因此，也要依靠自己来学习这门业务所需的知识。


    另一个非常重要的一点是响应速度。你已经窥见过这个行业节奏有多快了。有时候一周的延迟就会导致数千美元的差异。你必须能够随时做出更改，因此你需要尽可能响应迅速的程序员。如果你面对的程序员工作量过大，请找那些能将你列为首要任务的人。时刻关注程序员的响应情况，特别是在项目期间。不要允许任何疏忽，如果发现问题要及时提及。


    顺便说一下，这对你你自己也是如此。程序员也和你我一样的人，如果他们觉得时间被浪费了，会感到沮丧。如果他们需要你提供什么，请尽快提供。像你期望他们做的那样保持响应。在刚开始，我曾因为没有给程序员提供他们所需的东西而声名狼著，并经常导致瓶颈和延迟。


    此外，收敛起你内心的控制欲，不要要求得过高。你必须掌控全局，但过度的沟通会减慢程序员的速度并可能让他们感到沮丧。我通常会问他们喜欢多久讨论一次项目。制定一个兼顾双方的时间表并坚持执行。


    另一个重要的步骤是，对于与不同时区的程序员合作要保持谨慎。将时差降到最低，因为这可能成为沟通中的主要障碍。如果你早上起床时，你的程序员进入了睡眠周期的第三阶段，那么维持业务的势头将变得困难。


    我以前合作过的最才华的程序员之一住在德国，每当我在西海岸时，九小时的时差让我们几乎无法共同工作。当他下午 5 点下班时，我这里是早晨 8 点。当然，他有时可以破例而为，但这种做法是不可持续的。一些外包公司会调整员工的工作时间来匹配美国的工作时间，但如果你没有至少三到四小时的重叠时间，请找别人。


    ## 团队


    尽可能与团队合作而不是与个人合作，特别是在开始阶段。这有几个优势。团队可以更可靠，因为如果负责你项目的程序员生病或无法可用，他们可以接手。正如你想象的，这非常重要。确保所有事情不要压在一个人的肩上，特别是当你的项目变得越来越复杂时。


    更大的团队完成任务更快。应用开发不能总是平均分配给固定数量的人，但一个优秀的团队会知道如何在不丢失项目进度的情况下更快地完成工作。


    使用团队的最大原因是团队将包含图形设计师，有时还有项目经理。你可以拥有世界上最好的代码，但如果你的图形看起来不好，人们就不可能给你的应用一个机会。理想的情况是有一个既能写代码又能设计图形的程序员。这很罕见，因此次优方案是有程序员和平面设计师协同工作，像一台运转良好的机器。你还会使用图形来营销你的应用，所以拥有一个能够创作杀伤性营销材料的平面设计师是必须的。


    与团队合作的另一个好处是程序员技能组合的多样性。起初，你想为你的第一个应用寻找合适的人才。但当你创建更多类型的应用时，你可能会达到程序员能力的极限。你的程序员应该能够联系他的团队成员或专业网络寻求帮助。


    这些是指南而不是严格的规则。随着你经验的增加，特殊情况可能需要你使用一个不团队合作或不具备图形能力、但拥有你所需的特定技能组合的程序员。尽量减少这种情况，因为将所有事情放在同一个屋檐下更容易，风险也更小。


    ## 定价


    你可以预见到到广泛的价格和服务，因为许多公司和独立开发者都在竞争你的业务。项目可以按固定成本或小时率计费。


    从提供固定费用的承包商开始，他们会提供一定次数的免费修改（称为迭代）。我很少按小时率计费开发应用，因为我觉得程序员没有动力去快速完成。我希望他们在开发应用时能像我一样有紧迫感。按小时计费会有相反的效果。这并不适用于所有开发者，但这种策略对我非常有效，并根据我的经验这已成为我的首选。如果人们过去为你做过一些高质量的工作，而且他们倾向于按小时计费，那可能就是你的选择。


    固定价格项目的另一个优势是，如果你知道工作将花费多少，更容易控制预算。你想用初始预算尽可能将应用推向市场。选择固定价格项目可能意味着创建两个应用和一个应用之间的区别。


    你可能会问：“我如何知道我的应用获得的是公平的报价？”通常，公司收得更高，因为他们比独立程序员有更多的开销。你可以通过对每个想法从三个不同的开发人员那里获取报价来避免过付。价格之间会存在差异，当你弄清楚原因时，你将学到关于程序员和你的应用的大量知识。不要害怕告诉程序员你倾向于其他比他们更低的报价（仅在属实的情况下）。他们可能会匹配价格。这是商业常识。


    至于支付，你不应该一次性全额付款。如果可以，尽量避免预付款，但如果不行，请程序员提供清晰的里程碑和价格。在确认里程碑要求达成之前，不要释放付款。像 `oDesk`
    和 `Freelancer` 这样的网站的好处是它们通过作为托管服务并提供与里程碑相关的支付系统，缓解了支付流程。


    在支付应用费用时，对使用分成协议要谨慎。有些开发者会降低开发成本，只要获得应用收入的一部分（称为分成）。人们很容易认为：“噢，放弃 10% 或 20% 并不是什么大事。”如果他们有投入，程序员可能会做得更好，但与分成协议的潜在缺点相比，这些优势是微不足道的。


    分成协议本质上让程序员成为了你的合伙人，这可能会变得很麻烦。如果你对应用进行他们不同意的更改怎么办？或者如果他们干扰了你的营销努力？当你有出售应用或公司的机会时会发生什么？应用可以是一项长期资产，放弃其中的一部分会损失很多钱。跟踪分成付款可能也很麻烦。


    ## 利益冲突


    程序员有时会创建自己的应用并发布在 `App Store` 上。他们的希望是能一发，，在此期间，他们通过为他人开发应用来赚取额外收入。


    '
- fmt: '

    Strictly speaking, this is a conflict of interest because your competition is
    creating your products. This is so prevalent in the industry that you probably
    won’t be able to avoid it. Just be protected as much as possible by showing the
    programmers your awareness of this and have them sign `NDAs` and possibly app-specific
    non-compete agreements. But don’t let this prevent you from moving forward.


    #ING AND SELECTING PROGRAMMERS


    When I started my company in early 2009, the industry was so new that it was hard
    to find quality programmers. Because of the worldwide app craze, you can now find
    them more easily. Many software development companies now focus on app development.
    Quite a few independent programmers have appeared all over the place.


    For my first few apps, I found it much easier to work with a well-known company
    that could hold my hand before diving in with independent programmers. This was
    a good starting point because the company was versed in working with inexperienced
    clients. I recommend you go the same route because bigger companies have more
    experience with educating people who are wet behind the ears. This will help you
    accelerate your learning the basics of app development and teach you how to communicate
    with programmers. Working with this company gave me the confidence and momentum
    I needed to continue to forge ahead in the app business.


    How do you look for programmers? Well, you have many ways to look for programmers
    such as a simple `Google` search, job sites like `Monster`, `Craigslist`, app
    conferences, meet-up groups, programmer forums, word of mouth, and outsourcing
    sites (such as `oDesk` and `Freelancer`). Some of these methods are easier than
    others, but no magic formula exists. You’ll have to use various sources and assess
    multiple programmers until you find several who you’re comfortable pulling the
    trigger with.


    Your approach will basically be the same with each programmer or company you’re
    assessing. Once you have programmers on the phone or on `Skype`, interview them
    until you’re comfortable with moving to the quoting step. This is a job interview,
    and you’re the boss. Here is my question checklist:


    * How long have you been developing apps?

    * How many apps have you worked on?

    * Can I see the apps you’ve worked on?

    * Do you have a website? What is it?

    * Do you have references I can talk to?

    * Whats your schedule like? How soon can you start?

    * How long will it take to get a quote?

    * What’s our time difference? (if they are in a different time zone)

    * What time do you usually work? What are your hours?

    * What’s frustrating for you when working with clients?

    * Are you working with a team? What are their skills?

    * Can you create graphics, or do you have somebody who can?

    * Can I see examples of the graphics work?

    * What happens if you become sick during a project?

    * What if you hit a technical hurdle during the project? Do you have other team
    members or a network of programmers who can help you?

    * Can you provide flat-fee quotes?

    * What’s your payment schedule?

    * Can you create milestones tied to payments?

    * Do you publish your own apps on the `App Store`?

    * How do you ensure that you don’t compete with your clients?

    * How do you submit an app to the `App Store`? (Can they walk you through, or
    do they make you feel brain challenged?)


    This list will change based on whom you’re talking to. An established development
    company will most likely have a team of developers and graphics people on staff
    but you must get answers to the above questions before moving forward. Also, you
    don’t need to sound like a drill sergeant or ask silly interview questions. The
    questions listed above are important, and they shouldn’t make the person you’re
    talking to defensive if you ask them in a friendly tone. I always have this question
    list in front of me during an interview and take notes as I get the responses.
    I’ve found that, in business conversations, it’s good to throw some personality
    in there and have a little fun. Keep this in mind when you’re asking your questions.


    During the conversation, pay attention to how well they were able to explain themselves.
    Were they articulate? Did they use too much techno babble? Did they actually speak
    the same language? Did they seem confident with their answers? How was their tone
    and demeanor? If you had any issues or worries, you may want to move on to somebody
    else. If you can communicate with them and your gut is telling you yes, you’ll
    want to move to the next step.


    In either case, thank them for their time and mention that you will follow with
    an `NDA` agreement if you decide to move forward. Don’t give away your ideas during
    this initial conversation. Whenever the topic comes up, say you’ll be more than
    happy to discuss everything after they sign the `NDA`. You must protect your ideas,
    source code, and any other intellectual property because these are your assets.


    Be careful with the people who handle your code as well. As your business grows,
    you will not only be creating new apps but also maintaining your existing ones.
    This means you’ll have to give your code to whoever has to make changes to it.
    Only do this after you have established a certain level of trust. This is especially
    true with your popular apps.


    Once the `NDA` is in place, it’s time to dive in and ensure the developers have
    the skill to complete your app. You do not have any wiggle room here, especially
    for your first app. Either they know how to do it or they don’t. You want to hear
    things like, “I know exactly how to do that” or “I’ve done similar apps, so it
    will not be a problem.” You don’t want to hear things like, “I should be able
    to do that, but I have to research a few” or “I’m not sure but I can probably
    figure it out.” If you hear those words, move to an app they are confident about
    or run for the hills.


    For example, let’s say you’re developing a new app with sophisticated requirements.
