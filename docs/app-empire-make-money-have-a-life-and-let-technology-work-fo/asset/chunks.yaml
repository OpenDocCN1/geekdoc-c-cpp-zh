    ## Introduction


    This is great because you can send more ad requests to the networks that make
    you the most money. You can turn off certain networks if you don’t want any ad
    requests to be sent to them. You’ll always have the option to turn them back on.


    You can also select the backfill priority of your ad request. (See [Figure 9.3](#Chapter09.html_figure9-3).)
    That means you decide the order in which `AdWhirl` should request ads from other
    ad networks if the current network did not return an ad. This level of control
    will allow you to extract the most amount of money from your banner advertising.


    [FIGURE 9.3](#Chapter09.html_figureanchor9-3) Selecting backfill priority on AdWhirl.


    ![image](images/f157-02.jpg)


    Another cool feature of `AdWhirl` is you can have in-house ads. That means, you
    can advertise your own apps within your own banner ads. All you have to do is
    upload a nice-looking banner of your app and the link for it. Then you decide
    what percent of the time you want your own ad to be displayed and there you go.
    Your ad will appear with ads of the other ad networks and your users won’t be
    able to tell the difference.


    One thing I like doing is adding `AdWhirl` to my paid apps as well. Like with
    your nag screen, you’ll want to turn off banner ads in a paid app. But if you
    ever decided to do a `FreeAppADay` promotion and make your paid app free for a
    limited amount of time, you can jump on `AdWhirl` and turn on your ads to capitalize
    on your temporarily free traffic. This could make you thousands of extra dollars.
    You have to give yourself that flexibility to monetize all your apps at all times.


    As for how to integrate `AdWhirl`, like with your nag screen and promo pages,
    your programmers need to be experienced with this. Let them handle all the details
    and check that everything is working before you submit the app.


    ## Affiliate Marketing


    Affiliate marketing is relatively widespread on the Internet and many people are
    still making lots of money with it. The basic concept is that if people have something
    to sell online, they give you a certain percentage of any sale generated by customers
    you brought to their website. You (the affiliate) are getting a commission from
    sellers for connecting them with buyers.


    If I were selling a $100 audio course on how to make iPhone apps, I could decide
    that I want to give 50 percent of the sales to my affiliates. You might be a developer
    who has a blog on how to make iPhone apps and you might like my product. You decide
    to put an ad on your blog that promotes my product. Lots of people visit your
    site daily, and some of them will see your ad, click on it, and be directed to
    my site. Some of those people who clicked on your ad will buy my product. For
    every person that comes from your site and buys my product, you would be entitled
    to 50 percent or $50 dollars.


    That’s cool because you would be making money from a product that you didn’t create.
    Furthermore, you have users (traffic) on your website so why not show them something
    that might interest them and make some money at the same time? The seller knows
    the traffic came from you because each affiliate gets a unique identifying link,
    called the `affiliate link`. That way no confusion occurs about where users came
    from and all affiliates get what they are entitled to.


    Affiliate marketing has been around since the beginning of the Internet. Thousands
    of products on the Internet are being promoted by affiliates. As a result, there
    are websites that serve as intermediaries between the sellers and the affiliates.
    The sellers posts their products and the commission amount, and affiliates can
    browse through these offers and pick the ones they find most lucrative or relevant
    to their traffic. One such website is `LinkShare` ([`appempire.com/linkshare`](http://appempire.com/linkshare)).


    `LinkShare` connects sellers with affiliates. It also serves as an affiliate sales
    tracking service. Once you sign up as an affiliate with `LinkShare`, you can find
    the links you need to use to promote certain products. After you start promoting
    those products, you can log into `LinkShare` any time and see detailed statistics
    on how much revenue your traffic is generating for the seller. (See [Figure 9.4](#Chapter09.html_figure9-4).)
    You can see how much money you have made from those sales. `LinkShare` collects
    your earnings from the seller and sends them to you on a regular basis, which
    is simple and effective.


    [FIGURE 9.4](#Chapter09.html_figureanchor9-4) LinkShare reporting.


    ![image](images/f159-01.jpg)


    So, why are we talking about all this affiliate mumbo jumbo if all of this action
    is happening on the Internet? We are because affiliate marketing also exists on
    smartphones. Apple is one of the biggest sellers of digital content on the Internet
    and as such it has partnered with `LinkShare` to offer a commission to any affiliate
    that sends it customers who purchase their movies, songs, digital books, and apps.
    What does that mean in practical terms? Any affiliate that directs traffic to
    Apple’s iTunes store is entitled to 5 percent of any purchase the users make for
    the next 72-hour period.


    You should care because you are in the business of building apps and directing
    traffic using your app network. Anytime one of your users clicks on your nag screens
    or promo page banners, you are sending them to the App Store. The stronger your
    app network becomes, the more traffic you will be sending on a daily basis to
    Apple and the more affiliate revenue you will be generating.


    All you have to do is sign up with `LinkShare` and use the correct `affiliate
    link` that will attribute to you the traffic you send to Apple. You’re linking
    people to your apps anyway, so use a `affiliate link` and start collecting that
    commission you deserve. (See [Figure 9.5](#Chapter09.html_figure9-5).)


    [FIGURE 9.5](#Chapter09.html_figureanchor9-5) Creating affiliate links.


    ![image](images/f160-01.jpg)


    Here is an example of a regular link:

    ```

    http://itunes.apple.com/us/app/fingerprint-security-pro/id312912865?mt=8

    ```


    Here is an example of a LinkShare affiliate link:

    ```

    http://click.linksynergy.com/fs-bin/click?id=LjQr0YBXPSs&subid=&offerid=146261.1&type=10&tmpid=3909&RD_PARM1=http%3A%2F%2Fitunes.apple.com%2Fus%2Fapp%2Ffingerprint-security-pro%2Fid312912865%3Fmt%3D8

    ```


    Don’t be intimidated by the size of the `affiliate link`. Remember that `LinkShare`
    will create it for you, and all you have to do is copy and paste that particular
    link instead of the first one. Your programmer is the one who is going to handle
    all of this anyway.

