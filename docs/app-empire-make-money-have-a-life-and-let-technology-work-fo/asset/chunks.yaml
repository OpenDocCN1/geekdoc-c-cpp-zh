    Chapter 9


    Show Me the Money!


    Monetizing Your Apps


    Money can’t buy happiness but neither can poverty.


    —Leo Rosten


    When I was a kid, I realized pretty quickly that I needed more money than the
    small allowance I was getting every week for making my bed. Like most 10-year-olds,
    I wanted to buy things like baseball cards and an awesome shiny red bike I had
    seen in a magazine.


    School was out for the summer and since my cousin had similar aspirations as me,
    we decided to sell lemonade from a stand on the sidewalk with hopes of making
    some money. We were two cute little kids selling lemonade for a dollar a cup and
    we thought that we were going to be an instant hit.


    To our surprise, we didn’t make that much money. Setting up the stand and making
    all those drinks ended up being a lot of work. We were determined and we kept
    at it for a few weeks before we realized there had to be a better way. If we were
    ever going to get those amazing bikes, we needed to make some changes, and make
    them quickly.


    First, we tried charging two dollars per cup thinking that would make us more
    money; that actually made us less money because fewer people were buying. Next,
    we changed the time of day when we were selling the lemonade, figuring that we’d
    get the most amount of buyers around five o’clock when people were getting off
    work. This move did increase the number of people stopping by, and we started
    to sell more lemonade. Unfortunately, we still had the same problem. Selling cups
    of lemonade was not making us nearly as much money as we had anticipated because
    people were spending $1 and leaving. Things were moving too slowly, and we felt
    deflated and completely frustrated. What were we doing wrong? Were we not that
    cute after all?


    On the day our short-lived careers as lemonade entrepreneurs were about to end,
    we had an aha moment. We realized that most of our customers were stopping by
    before they headed to the grocery store to pick up food for dinner.


    This gave us an idea. We were doing well drawing people in but it seemed that
    we were not able to get the people who were stopping by to spend much money. Selling
    lemonade alone wasn’t going to make us enough money to buy those bikes. If we
    could sell them some of the food they were going to buy at the grocery store,
    we could make money faster.


    Luckily, my family had a big garden with more veggies than we could eat. All we
    needed to do was to pick them. Bingo. We immediately changed our game plan and
    offered free lemonade to attract more customers so we could sell them the produce
    from our garden. It worked perfectly. People stopped by, grabbed some free lemonade,
    and bought veggies. It was great, everyone was happy, and let me tell you, I had
    a blast riding that bike all summer long.


    Looking back at those early days, I realize that after some trial and error, my
    cousin and I had discovered how to optimize and fully monetize our traffic, a
    skill that is essential in business. Whether you are working a lemonade stand
    or running a big company, you need to be flexible and constantly look for new
    ways to monetize your business. Here is the crucial question you should be asking
    yourself every day: “How else can I further monetize my traffic?”


    Nine months after launching my app business, I was getting around 30,000 downloads
    a day with my free and paid apps. That brought roughly $650 a day in revenue.
    After learning about and deciding to try several new monetization tactics, I took
    that same 30,000 downloads and turned it into about $2,200 a day in revenue. That’s
    a 238 percent increase.


    Utilizing the same traffic I had before, I was able to bring in more money because
    I understood how to monetize my apps in multiple ways. Some of the main monetization
    techniques I use are regular paid app sales, banner advertising, affiliate marketing,
    in-app purchases, and translations (all discussed later in this chapter). All
    of these techniques, once implemented, will increase your revenue without any
    additional work. This is money sitting on the table and all you have to do is
    reach out and grab it.


    THE THREE REVENUE MODELS


    The App Store has three major revenue models. They include the free model, the
    premium model, and the freemium model. A common misconception among developers
    is that you can only make money with paid apps. You have plenty of ways to generate
    revenue from free and freemium apps as well, and oftentimes these last two models
    are easier to monetize.


    When I first got into the business, I didn’t know that multiple ways to make money
    existed. I used the paid model, pricing my apps at 99 cents. As the monetization
    models evolved, I had to adapt. I created many free apps and some freemium apps.
    This is what you should do as well. Don’t focus on generating revenue from one
    model but maximize your gains from each one of them. Let’s take a closer look
    at the three revenue models.


    Free Model. When the App Store opened, most of the available apps were paid, so
    when I jumped in, I thought it would be crazy to give apps away for free. Now,
    developers have to provide free apps to keep up with the competition.'
