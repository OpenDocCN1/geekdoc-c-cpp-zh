    几天后，我发现杂志上的那家开发公司离我当时在佛特蒙的地方只有两小时车程。当时，我仍然固着老式的房地产观念，认为生意必须面对面谈。因此，我决定去一趟，和他们进行面对面的会议。


    “很高兴见到你，”老板 John 在我和他团队握手时说道。他们的眼睛紧紧盯着我，这让我感到完全格格不入。也许这并不是个好主意，我心里想。我内心的那个“负能量女孩”（Negative
    Nancy）在不断作祟。我尴尬地坐在他们的会议室桌子旁，开始向他们介绍我的想法，并告诉他们我对这个全新的应用世界一无所知，但我渴望学习。


    “别担心。我们会帮助你的，”项目经理 Kevin 说道。在讨论了几分钟关于 App 如何运作、需要多长时间以及成本多少后，我的不安感消失了，我开始感到更有信心。


    在那个阳光明媚的周五下午，我昂首挺胸、走路轻快地离开了办公室。与他们的交谈让我豁然开朗，消除了我之前看到的许多障碍。正那时，我理解了开发公司所做工作的重要性，以及它们能为
    App 业务带来的价值。突然之间，我相信 App 世界里几乎一切都是可能的。我的大脑打开了，想法变成了一场无法控制的创意雪崩。可能性似乎是无限的。“好的，我们可以做这个，也可以做那个。”我开始产生各种想法，而且我确实有可以执行这些想法的人。问题解决了。下一个。


    作为一个“应用创业者”（appreneur），遇到障碍很容易的，因为你可能不知道技术是否支持你的 App 想法。程序员最棒的地方在于他们可以给你提供答案。与其阻碍你的创造力，不如雇佣对的人并善用资源。我的第一个开发团队运气很好，然后通过多次经历（有好的有坏的），我学会了如何雇佣优秀的人。在本章中，你将学习如何寻找、雇佣、管理和辞退开发者，以及建立帮助你将可能变为现实的系统。


    # 程序员的重要性


    到本章为止，你一直在进行市场调研，并利用上一章创建了最多三个深思熟虑的 App 想法。现在呢？如果你是一个程序员或对技术敏感，你可能会想：“酷酷，我可以写自己的
    App”或者“我会自学如何编写一个 App。”你可能会买几本关于编程的书，然后在深夜疯狂的时刻，连接着装满咖啡的输液瓶开始写代码。


    嗯，你可以这样做，但我强烈建议不要这么做。保持你的势头并尽快将 App 推向市场至关重要。自己编写 App 代码，特别是当你同时在自学时，会花费太长时间。你被卡住并放弃的可能性非常高。


    当你同时创建多个 App 并持续更新现有 App 时，这种模式从长远来看也是不可持续的。毕竟，核心目的是夺回你的时间，逃离无休止的职场竞争（rat race）。


    外包 App 开发的另一个原因是，你必须专注于经营者的角色。这意味着要对业务的关键方面要有全局观，如市场研究、营销、人脉拓展等。如果你把所有时间都花在第一线战斗中，你就无法做到这一点。你总没见过唐纳德·特朗普在他新摩天大楼的
    40 层戴着安全帽到处乱跑钉子吧？


    你必须决定专注于公司的高层运营，而不是迷失在执行微小细节中。程序员将成为你业务的基石，让你能够快速创建 App 并轻松扩展，这将让你保持这艘船的船长地位。


    # 在程序员中寻找什么


    由于程序员在你的业务中扮演着至关重要的角色，在选择他们时你必须格外审慎。就像你不会让任何人来建造你的梦想家一样，你需要谨慎对待谁来为你的移动帝国铺设虚拟砖块。


    在选择程序员时，你必须关注某些关键领域。这些包括经验、沟通、团队、定价和利益冲突。


    ## 经验


    你需要评估的第一点是程序员的经验水平。与没有开发过很多 App 的程序员合作不是好主意。有时当程序员刚开始时，他们会提供廉低的价格。这就像是请一个只飞过几次的飞行员开直升机。我不建议这样做。


    在考虑新程序员时，我要求查看的第一件事就是他们创建过的 App。如果说图片胜过千言，那么对我来说，一个 App 胜过万言。下载程序员的 App 并评估工作质量。它看起来是精美且运行无良好的，还是很笨拙？看起来是专业的还是不符合标准？


    有时他们受保密协议（`NDAs`）的限制，无法他们他们过的 App，或者他们只参与了 App 的部分。无论如何，你必须看到他们的产品运行起来。如果你不能，除非你喜欢不试驾就买车，否则请看下一个。


    程序员的网站可以是一个很有用的评估工具。这对于开发公司来说尤其如此，他们通常会在网站上展示自己的作品。它应该突出他们做过的一些 App，并让你相信他们不是一家过路的小草公司。网站的质量可以指示他们创建的
    App 的质量。独立程序员并不总有漂亮的网站，但如果他们的 App 作品集令人印象深刻，你应该继续评估他们。


    雇佣程序员时，要求提供推荐人。至少和一个与该程序员合作过的人交谈。我倾向于两个或三个，这可能很难，但为什么不试试呢？对于你在外包网站上找到程序员，这一点并不那么重要，例如
    oDesk（appempire.com/odesk）或 Freelancer（appempire.com/freelancer）。在这些网站上，评估开发者更容易，因为你可以查看之前的详细数据。你会看到之前客户的评价和评分，并判断他们是否是你想要合作的人。


    在对程序员的技能进行通用评估后，你需要确保他们拥有完成 App 所需的特定经验。我通常在第二次对话中进入这一点，在我完成了初步评估并让程序员签署了 `NDA`
    之后。通过查看之前的工作你可以估计技能水平，但你仍然必须确保程序员拥有你的 App 所要求的特定技能。


    ## 沟通


    虽然其他开发成本可能较低，但语言障碍可能是种麻烦。与和你母语相同的程序员合作。你必须能够与你的开发者有效沟通。这可能成本更高，但你会获得更高质量的工作和更少的头疼。


    我对程序员的另另一件事是技术指导。当我开始时，我是一个完全的新手，但我很幸运能与程序员合作，他们在整个过程中教我技术术语。并不是所有擅长创建应用的程序员都擅长这一点。确保你的第一批程序员愿意并能够用非技术术语向你解释。


    '
- fmt: '

    As you gain experience in the field, you will need less guidance, but initially
    this is important. You will find out quickly if you are talking to programmers
    who do this inherently. They will ask you questions and often give you a crash
    course to help you understand the scope of the application you want to create.
    This is huge. Programmers should not be your only source of education, therefore
    rely on yourself as well to learn what is necessary for this business.


    Another big one is responsiveness. You’ve had a peek at how fast-paced this industry
    is. Sometimes a delay of a week can make a difference of a few thousand dollars.
    You must be able to make changes on the fly, therefore you need programmers who
    are as responsive as possible. If you’re dealing with programmers who have too
    much on their plate, find people who can make you their priority. Keep an eye
    on the programmers’ responsiveness at all times, especially during projects. Don’t
    allow for any lapses, and mention problems if you see them.


    By the way, this is true for yourself as well. Programmers are people like you
    and me, and they can get frustrated if they feel their time is wasted. If they
    need something from you, get it to them quickly. Be as responsive as you expect
    them to be. In the beginning, I was notorious for not getting my programmers what
    they needed and often created bottlenecks and delays.


    Also, silence your inner control freak and do not be too high maintenance. You
    have to stay on top of things but excessive communication will slow down and possibly
    frustrate the programmers. I usually ask them how often they like to talk about
    the project. Come up with a schedule that accommodates both of you and stick to
    it.


    Another important step is being cautious of working with programmers in different
    time zones. Keep the time difference to a minimum because it can become a major
    hiccup in communication. Maintaining the momentum of your business will be difficult
    if by the time you get up in the morning your programmer has hit stage three of
    his sleep cycle.


    One of the most brilliant programmers I’ve worked with before lives in Germany,
    and whenever I’m on the West Coast, the nine-hour difference makes it almost impossible
    for us to work together. When he closes shop at 5 p.m., it’s 8 a.m. here. Of course,
    he can make exceptions at times, but this is unsustainable. Some outsourcing companies
    rearrange their employees’ workday to match it to the U.S. workday, but if you
    don’t have at least a three- to four-hour window of shared time, find someone
    else.


    ## Team


    Whenever possible, work with a team rather than an individual especially in the
    beginning. This has several advantages. Teams can be more reliable since they
    can pick up the slack if the programmer working on your project gets sick or becomes
    unavailable. This is a big one as you can imagine. Ensure that not everything
    rests on one person’s shoulders especially as your projects become more complex.


    A bigger team can get things done faster. App development can’t always be evenly
    distributed among a set number of people, but a skilled team will know how to
    get things done faster without losing track of the overall project.


    The biggest reason for using a team is that a team will include graphics designers
    and sometimes project managers. You can have the best code in the world, but if
    your graphics look bad, people will be less likely to give your app a chance.
    The ideal situation would be to have a programmer who can code and create the
    graphics. This is rare, so the second-best option is having programmers and graphic
    designers working in tandem, like a well-oiled machine. You will also use graphics
    to market your apps, so having a graphic designer who can create killer marketing
    materials is a must.


    One more benefit of working with a team is the variety in the programmers’ skill
    sets. Initially you will want to have the right talent for your first app. But
    as you create a greater variety of apps, you might reach the limits of a programmer’s
    abilities. Your programmer should be able to reach out to his team members or
    his professional network for assistance.


    These are guidelines and not strict rules. As you gain more experience, special
    circumstances may warrant using a programmer who does not work with a team or
    have graphics capabilities but has a specific skill set that you need. Keep this
    to a minimum because it’s easier and less risky to have everything under one roof.


    ## Pricing


    You can expect a wide range of prices and services since many companies and independent
    developers compete for your business. Projects can be billed at a fixed cost or
    hourly rate.


    Start with contractors who offer a flat fee, with a certain number of free refinements
    (called iterations). I rarely develop apps on an hourly rate because I feel programmers
    don’t have an incentive to finish fast. I want them to feel the same sense of
    urgency that I do when it comes to developing apps. Being on an hourly rate has
    the opposite effect. This is not true for all developers, but this strategy has
    served me well and has become my preference based on my experiences. If people
    have done some quality work for you in the past, and they prefer hourly rates,
    that might be the way to go for you.


    Another advantage of fixed-rate projects is that it’ll be much easier to stay
    within your budget if you know how much the work will cost. You want to get as
    many apps to the market as possible with your initial budget. Going for fixed-rate
    projects might mean the difference between creating two apps versus one.


    You might ask, “How do I know that I’m getting a fair quote for my app?” Typically,
    companies are going to charge more because they have more overhead than individual
    programmers. You can avoid overpaying by getting quotes from three different developers
    for each one of your ideas. Discrepancies will exist between the prices, and as
    you figure out why, you will learn a tremendous amount about the programmers and
    about your app. Don’t be afraid to tell programmers you prefer that you have other
    quotes that are lower than theirs (only if this is true, of course). They might
    match it. Business 101.


    As for payment, you should never pay upfront in full. Avoid a down payment if
    you can, but if you can’t, ask the programmer to provide clear milestones and
    prices for each of them. Don’t release a payment until you’re confident the requirements
    of the milestone have been met. The nice thing about sites like `oDesk` and `Freelancer`
    is that they mitigate the payment process by acting as an escrow service and providing
    a payment system that corollates with the milestones.


    Be cautious about using royalty agreements when it comes to paying for apps. Some
    developers will lower their development cost if they receive a cut of the app’s
    income (called royalties). It’s easy to think, “Oh, giving up 10 or 20 percent
    is not a big deal.” You might save money or the programmers may do a better job
    if they are vested, but these advantages are negligible to the potential disadvantages
    of a royalty deal.


    A royalty deal essentially makes the programmers your business partner, which
    can get messy. What if you want changes to the app they disagree with? Or what
    if they interfere with your marketing efforts? What happens if you have an opportunity
    to sell the app or your company? An app can be a long-term asset and giving up
    a piece of it can take away a lot of money. Keeping track of royalty payments
    can be cumbersome as well.


    ## Conflict of Interest


    Sometimes programmers create their own apps and publish them on the `App Store`.
    Their hope is they might strike gold, but in the meantime, they will make extra
    cash by developing apps for others. These will mostly be independent developers,
    but some development companies do this as well.

