  trans: "\n\n### 优势\n\n*   **大量的程序员**——这些网站拥有大型程序员数据库，他们会为你你的项目竞争。\n*   **响应快速**——你通常在发布任务后一或两小时内就能收到报价。\n\
    *   **技能和工作经历**——程序员有列出其技能的个人资料。你可以查看他们之前参与过的项目。通过这些信息，你可以评估他们是否具备你应用所需的特定技能。\n\
    *   **性能评分和评价**——客户可以对程序员进行评分和评价。你将知道是否值得花更多时间来评估这个人。\n*   **价格比较**——在发布职位描述之前，你可以查看其他人的活跃和已关闭的职位列表，以了解其他人为与你类似的应用软件（apps）支付了多少钱。\n\
    *   **托管服务**——你的资金会受到保护，只有当你对工作结果满意时，你才会在特定的里程碑阶段释放资金。\n\n### 缺点\n\n*   **沟通**——大部分这些程序员都在海外。这可能会带来沟通和时差方面的问题，因此在继续之前，通过\
    \ `Skype` 面试是绝对必须的。\n*   **保护你的创意**——因为这些网站是公开竞标场，你的创意可能会被劫持。在发布职位时，千万不要发布你的创意或营销计划。在签署保密协议（NDA）之前，请使用通用的描述。\n\
    \n### 发布职位\n\n以下是在 `oDesk` 上发布职位并评估回复的五个要点。在其他网站上的过程也类似。你的广告应该广撒网，以吸引尽可能多的申请者。你可以对他们进行筛选。\n\
    \n1.  **输入需求**——他们知道哪些编程语言？`oDesk` 和 `Freelancer` 允许你列出需求。对于你的应用，你需要 `iPhone`、`Cocoa`\
    \ 和 `C`。\n2.  **给出你的项目基本描述**——保持简单。在选择过程中与他们讨论细节。\n3.  **在发布职位时仅提供几天内的信息**——这有助于你获得报价。这让你找到符合要求的程序员。\n\
    4.  **筛选申请者**——根据以下标准进行筛选：\n    *   他们的评分是否如何。\n    *   他们至少有多少年的经验。\n    *  \
    \ 他们的英语水平如何。\n5.  **给申请者发消息**——无论他们是否通过了测试，都要通过 `Skype` 进行沟通。\n\n当你开始与程序员交流时，通过\
    \ `Skype` 安排会议。无论他们是否通过了测试，这都能帮助你发现问题。\n\n### 如何传达你的创意\n\n当你开始与程序员工作时，你需要清楚地告诉他们你的视觉以及它是如何工作的。在收到你的草稿之前，你可能会对想法进行修改。在你的应用设计完成之前，确保传达想法是准确的。这通常需要多次迭代，这会让程序员感到沮丧。为了准确地传达你的创意，你应该在纸上画出来。当你向程序员发送草稿时，你需要明确：你想要什么样的功能。这在\
    \ `App Store` 上是很有用的。当程序员报价时，可能会改变想法。当你测试你的应用初始版本时，你想要增加额外的功能。这通常需要多次迭代。在开始编写代码之前，你必须认为设计是最终的。如果你不确定，程序员将无法交付你想要的东西。\n\
    \n"
- fmt: '

    At this point, you have found programmers, screened them, signed NDAs, conveyed
    your ideas, received a few quotes, and picked the ones to work with. Rather than
    jumping into a full-fledged project with both feet, I usually test them on something
    small first. I systematically ask for these three things every time I’m working
    with a new programmer:


    1. **Icon**—Ask the programmer to create and deliver the icon of the app. [Figure
    5.2](#Chapter05.html_figure5-2) is the picture you see when you are looking at
    an app on iTunes or on your phone. After you have outlined your app idea, you
    will probably have several ideas for icons as well. Pass these on and ask for
    a finished 512 × 512 iTunes Artwork version of the icon. They will know what that
    means.


    [FIGURE 5.2](#Chapter05.html_figureanchor5-2) App icons.


    ![image](images/f091-01.jpg)


    2. **Hello, World! app**—Ask the programmer for a “Hello, World!” app. This will
    take them 10 minutes to create and is a simple app that opens up and shows a page
    that displays “Hello, World!” (See [Figure 5.3](#Chapter05.html_figure5-3).) Programmers
    will know what this is. The idea here is not to test their programming skills
    but to determine how they will deliver apps to you for testing. This app should
    include the icons so you can see how it will look on your phone.


    [FIGURE 5.3](#Chapter05.html_figureanchor5-3) Hello, World!


    ![image](images/f092-01.jpg)


    3. **App Delivery**—When the programmers are ready to show you a test version
    of your app, they have to create something called an “ad hoc.” This ad hoc version
    of your app needs to be installed on your phone before you can test it. The installation
    process was a bit cumbersome in the past but a new service called `TestFlight`
    has simplified this process (`appempire.com/testflightapp](http://appempire.com/testflightapp),
    see [Figure 5.4](#Chapter05.html_figure5-4)). I ask all programmers to use this
    service even if they have not used it before. They will be able to figure it out,
    and you’ll be able to install your test apps with a few touches on your phone.


    [FIGURE 5.4](#Chapter05.html_figureanchor5-4) `TestFlight` service.


    ![image](images/f092-02.jpg)


    I never spend more than a couple of hundred dollars, but this test helps me see
    the graphics capabilities, implementation speed, and overall work dynamic (such
    as communication and time zone). You want to start off on the right foot or get
    out quickly if you need to, and this is the best way to do it.


    Mention that you like to start things off with this test during the Skype interview.
    Do this so programmers don’t get surprised after they have provided a quote. Sometimes
    they’re happy to get this test done without a charge but sometimes they want a
    small fee. In either case, be clear with this requirement and have them include
    it in the quote.


    If you have selected your programmer and you’re happy with the results of your
    initial test, you’ll be well on your way to creating your first app. But if you’re
    not happy with the results, don’t hesitate to move on.


    The process of finding programmers might take some time but this is time well
    spent. Don’t cut any corners. This will help you avoid unnecessary delays, costs,
    and frustration in the future. You’ll always be looking to add new talent to your
    team, so learning how to quickly and effectively assess programmers is an important
    skill to have.


    # HOW TO MANAGE PROGRAMMERS


    It can take a lot of energy to find good programmers. The trick is to manage them
    properly on a daily basis to keep them happy and your business strong. These are
    some lessons I’ve learned along the way when it comes to managing programmers.


    ## Stay on Top of What’s Happening with Your Project


    At some point, you might decide to hire programmers for full-time work. Until
    then, you will be working with companies and independent programmers who will
    have multiple projects running at the same time. This can lead to less than an
    optimal flow of information between you and programmers. They may not be as focused
    as they need to be with keeping you appraised of their progress. If left unchecked,
    this can lead to projects taking longer than they should and to a final product
    different from what you had in mind. You’re the project manager and business owner,
    and it’s your task to keep things on track rather than expecting the programmer
    to do this for you.


    This is something I handled poorly early on. I was letting my developers take
    their time and didn’t diligently check on progress. I learned to ask for milestones
    and timelines during the quoting process. This has allowed me to know how the
    app will look and function at each milestone and how long the project will take
    before a single line of code has been written. I periodically check in and review
    what’s working and what still needs to be tweaked. We go back and forth like that
    from start to finish. Most applications go through multiple iterations during
    design and development, and I don’t release partial payments until I’m fully satisfied
    with each milestone. Don’t let your plane get off course for too long otherwise
    you could end up in Antarctica freezing your butt off.


    ## Hire Slowly, Fire Quickly


    Once you get a few apps under your belt, and things seem to be smooth with your
    developer or development team, you might want to consider hiring one of them for
    full-time work. While the flexibility of using subcontractors as needed is great,
    the danger is other clients can hire them.


    As soon as you feel you are happy with the work of particular programmers and
    are making some money, lock them in. I have several guys I keep on monthly retainers.
    If you notice problems, such as lack of responsiveness or sloppy work, cut your
    losses quickly and fire them. If you do not, they can become a drag on your company.
    Like with any breakup, you should part ways amicably. It’s just business, and
    you don’t want to piss off who handle your assets.


    The best way to fire programmers is to clarify they did not meet your expectations
    and you want to stop work. Salvage as much of the work as possible and compensate
    the programmer fairly, but move on as quickly as possible and chalk it up as learning
    lesson.


    # HOW TO TEST YOUR APPS


    Congratulations. You’ve gone through all of the development milestones, and you’ve
    got your app back. Before you pass out the champagne glasses, you need to do a
    few critical things. If you were having a house built, before you signed off,
    you’d want everything in working order. You would check major things like the
    roof and plumbing all the way down to minor things like the crown molding or anything
    cosmetic. You need to do the same thing with your app.


    To start, the app must perform as expected. Pull out your initial design document
    and go through every feature. Never assume that something works because it worked
    last time you tested the app. Test each feature every time, especially before
    the final release. Don’t stop here because, as the creator of your own app, you
    know how everything should work. It makes sense to you, but it might not to others.


    If you worked for a major software development company, you would have a team
    of well-paid engineers to poke, prod, twist, and stretch your app any which they
    could. As a solo, bootstrap appreneur, you probably don’t have those resources.
    You can, however, accomplish the same thing with a resource that all of us have:
    our friends and family plan. Your job is to get everyone you know, from your 75-year-old
    grandmother to your 12-year-old nephew to test your app.


    The time you spend on testing is crucial because you will see how consumers use
    your product, what’s easy, what they don’t understand, and their patterns. They
    will have questions that won’t occur to you because you designed the app and everything
    about it is obvious to you.

