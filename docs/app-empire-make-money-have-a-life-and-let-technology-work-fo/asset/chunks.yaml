    Praise for App Empire


    “Five months ago, I started making iPhone apps and was generating about $25 per
    day. Then I met Chad. Chad taught me that marketing in the app store differs from
    every other medium in the world. It’s absolutely nothing like advertising in newspapers,
    radio, or online. Using the techniques Chad told me in just one meeting put me
    in the top 20 of the app store multiple times. I often have days where I break
    $2,000 profit and more. This is a book you don’t want to put on the shelf. Read
    this from beginning to end as it has simple secrets that are making people millions.”


    —Trey Smith, Underground Marketer and iPhone Game Developer


    “Chad has radically changed the game again. He is insightful but challenges the
    status quo in the mobile app space. His proven system breaks down the daunting
    tasks of researching and creating apps all the way through to marketing and monetization.
    App Empire is a must-read for anyone in the app game or anyone who wants to quit
    his or her nine-to-five for a long-term sustainable business. And not just any
    business. A business where you have the flexibility to work from anywhere, pick
    your own hours, and have higher margins than almost any other business.”


    —Amish Shah, World Renowned Marketing Expert, Co-founder of Digispace, an Inc.
    500 company of 2010


    “Chad is a total gangster when it comes to iPhone apps. The money he has made
    in such a short time is astonishing.”


    —Frank Kern, Highest-Paid Internet Marketing Consultant in the World


    “Make millions with apps while traveling all over the world? Well, there is a
    book for that, and you’re holding it in your hands. I’ve seen first hand the amazing
    results Chad’s strategies can produce in the App Store. Seize this opportunity
    to become a top appreneur and join the growing ranks of the new rich.”


    —Tayfun Karadeniz, Leading iPhone App Monetization Gangster


    “The strategies for making money with apps detailed in this book are proven, effective,
    and simple. There are very few people in the app space equipped to author this
    book, and Chad is one of them based on his repeated success from the beginning.
    The market for apps is still in its infancy so my best advice is to read the book
    and execute. Chad has made it easy for you.”


    —Alan Johanson, App Publisher, 18m App Downloads, 11 Apps in Top Overall


    “It’s not just about having an idea. It’s about executing it. As the app market
    grows, it’s getting harder to gain visibility, and visibility is the key to success.
    This book breaks down the process into understandable concepts. It guides you
    step by step in executing the most efficient way to gain that visibility you need.
