  trans: "\n\n在我参加的活动和派对中，我经常听到人们对这项业务的怀疑。我不怪他们。我曾经历过这些，必须经过了自己的历程才克服了那些局限性信念。\n\n\
    以下是我从人们那里听到的最常见的一些恐惧：\n\n* “我从未做过这个 . . . 我没有经验 . . . 我没有背景。”\n\n  我曾处于同样的境地。但我找到了可以学习的成功人士。\n\
    \n  如果你想获得成功，你要做的就是找到模仿那些成功者的方法。尽快找到一个可以模仿的对象。\n\n  从小处开始，随着时间不断学习。你可能会犯一些错误，但你会变得更有信心和知识。在你回过神来之前，别人就会模仿你了。\n\
    \n* “这太难了 . . . 我看不懂 . . . 我不够聪明。”\n\n  任何人都可以做这份生意，即使你不理解它。就像生活中的任何事情一样，你必须从某个地方开始。这是最容易入手的业务之一，因为市场正在告诉你该做什么。你需要做的就是倾听。\n\
    \n这项业务的核心在于观察市场、理解市场，并给用户你认为他们想要的东西。你第一次上场可能无法击出全垒，但你必须在整个比赛中不断站起来挥棒。\n\n* “我不是电脑人”，“我不是开发者”，“我不是代码员。”\n\
    \n  我也不是。我不知道如何编写任何程序，也不想知道。无论你的计算机技能，都可以进入 App 业务。如果你能画出一个 App 创意并将概念传达给程序员或设计师，那么他们就可以为你完成工作。即使你会写代码，我也建议雇佣其他人来完成大部分工作，这样你可以把更多精力放在经营和建立业务上。\n\
    \n  我的两个创业者朋友在开始创建 App 时都拥有软件工程学位。他们很快意识到他们必须向外包给其他程序员，这样他们才能成为创业者。\n\n* “这需要很多钱\
    \ . . . 我没有钱可以浪费 . . . 我没有钱建立 App 业务。”\n\n  你不需要很多钱就能开始。开发简单的 App 成本在 500 美元到\
    \ 5000 美元之间。一旦发布了 App，根据你的销售情况，可能在两个月内就能看到钱进入你的银行账户。\n\n  我开始时欠了巨额债务，从继父那里借了钱进行孤注一掷。我没有任何员工，所有的工作都是外包的。\n\
    \n  在这项业务中，准入门槛低得离谱。你不需要学位。你不需要像股票经纪那样获得执照。你不需要投入 60,000 美元或更多资金接受四年的教育。你不需要支付\
    \ 50,000 美元的特许经营许可费。你不需要许多员工、大量设备、开销或商业空间。\n\n  即使你搞砸了，损失也是相对小的。如果你坚持下去并从错误中学习，你将获得赚大钱的机会。\n\
    \n* “我不是做生意的人 . . . 我不知道如何成为一名创业者。”\n\n  你不必是。而且这比大多数其他类型的业务要容易得多。\n\n  苹果公司负责分销，你就可以把时间花在营销上。如果你能不断测试市场并根据数据进行纠偏，你就可以经营一家成功的\
    \ App 业务。\n\n* “我没有足够的时间 . . . 我有一全职工作 . . . 我没有时间学习这个。”\n\n  这项业务关乎夺回你的时间和生活。即使你全职工作每年赚\
    \ 100,000 美元，如果你永远见不到孩子或配偶，或者没有充实的生活，这值得吗？\n\n  这项业务的迷之处在于，你可以选择从兼职开始，随着你学习得更多并获得信心，你可以迈出更大的步。\n\
    \n  当你因为收入翻倍而辞职时，你会有多到不知道该做什么的时间，这就是这项业务带给你的。在任何时间、任何地点、和任何人做你想做的事的自由。\n\n* “我失去了信心\
    \ . . . 自失业以来一直很低落 . . . 衰退对我打击很大。”\n\n  当我还是孩子的时候，经常在社区里和一个叫 Smalls 的家伙一起踢足球。我们以前欺负他。他可能湿透了也只有\
    \ 110 磅，但你可以撞他，他几乎不会倒下。如果他倒了，他会立刻弹起来，仿佛什么都没发生过一样。这不符合逻辑，因为每个人都比他更高、更强。他到底是如何承受如此巨大的撞并屹立不地的？所以，有一天在学校的食堂里，我走向他：\n\
    \n  “Smalls，你在球场上被撞得那么重时是如何保持站立的？”我问道。“你那么小。你的秘密是什么？”\n\n  “你真的想知道吗？”\n\n  “是的，我真的想知道。”\n\
    \n  “我一直在移动，”他说。\n\n  “什么？”\n\n  “我被撞到时看着我的脚，”他说。“我从不停下。是的，我从不停止。”\n\n  我的反应是觉得他说的话很愚蠢，但在思考之后，我看到了更深层的意义。这是合理的。我们可以成为自己最大的敌人或最伟大的英雄，但最终我们有权选择并决定我们要关注什么。\n\
    \n  如果我的车没有翻掉，我就会获得改变所需的杠杆。很多时候，我们比想象中更接近保持站立。只要我们能说服自己，痛苦可以成为我们最好的礼物和最大的武器。\n\
    \n* “只有少数人能在这项业务中赚钱 . . . 与大玩家竞争很难 . . . 因为所有的创意都被占用了，很难赚钱。”\n\n  大玩家也和你一样。这个行业还处于婴儿期，任何人都可以像他们一样制作\
    \ App。他们可能有大量的营销资金，但你仍然可以用很少或没有资金来营销你的 App，正如书中后面会提到的的那样。\n\n  这项业务的独特之处在于，大玩家和大家都在同一个竞技场上。他们和你将面临同样的问题和挑战。\n\
    \n  这个行业刚刚开始。正如我之前所说，它就像电子商务开始时的互联网。你有机会随着行业一起成长。你不需要发明新创意。如果你能改进现有的 App 创意，你就可以赚钱。\n\
    \n* “我是为了淘金热来的 . . . 我不需要工作就能赚大钱。”\n\n  很多人带着快速发富的心态和不切实际的预期加入了 App 淘金热。不要变成那样。这本书给了你工具，让你像企业主一样思考，并有一张寻找黄金的地图。你必须工作，但你不需要在这个过程中挣扎并让生活流逝。\n\
    \n  这不是一次性的 App 彩票奖，你不能那样对待它。我们都想要即时满足，但如果你把这项业务视为一项长期事业，它就会成长并成为可持续的收入来源。\n\n\
    * “仅仅因为别人成功了，并不意味着我也会成功。”\n\n  没错。这项业务中最重要的就是你的心态。我们可以成为自己最大的敌人或最伟大的英雄，但最终我们有权选择并决定我们要关注什么。\n\
    \n# 创造黄金心态\n\n"
- fmt: '

    You must create beliefs around wealth that allow you to get out of your own way.
    Learn to see the opportunities instead of all the reasons things won’t work or
    haven’t worked in the past. By shifting your beliefs, you can turn challenges
    into opportunities to learn and grow.


    Anthony Robbins changed my life in many ways. While I was recovering in the hospital
    from my car accident, someone gave me his `Get The Edge` program as a gift. His
    words unlocked a part of me I didn’t know existed.


    I realized that up to that point in my life, I had focused on the tools of business.
    I asked questions like, “How do I get more sales?” “How can I get better at marketing?”
    “Whom do I hire to work for me?”


    Tony Robbins taught me to ask questions on a deeper level: “What kind of life
    do I want to live?” “What’s important to me?” “How do I want to express myself?”
    “What do I want from making money?” “What’s my mission?” These questions made
    me think about business and life in a different way, weeding out the junk and
    giving myself true alignment.


    I realized that to live the life I wanted, I needed to do a major shift of my
    mindset and realign my core beliefs.


    When I changed my beliefs, I started to have a tenacious mindset. I knew what
    I wanted, I wasn’t going to let other people’s agendas get in my way, and I was
    happy. I realized that without my body, without my inner clarity and peace, I
    was nothing. That gave me a sense of gratitude. I had a different energy and a
    strong, positive mind. That made my business and way of life exciting every day.


    Look, you don’t have to go through a major traumatic event the way I did to learn
    these lessons, and I would never wish what happened to me on anyone. Do whatever
    you need to strengthen your mental and emotional muscles. My accident radically
    changed me because I felt I was given a second chance, and I wasn’t going to abuse
    that gift. Your second chance and new beginning starts now.


    # Qualities of a Winning Mindset


    The following are key elements of a winning mindset, along with actions you can
    take to thrive in the app world and in your life.


    ## Know Your “Why”


    Ask yourself, “Why do I want to make money in the app business?” Everyone needs
    a driving force, so hone in on yours, and you’ve won half the battle for success.
    This why might be unique to you, or similar to the “why” of other appreneurs.


    Whatever it is, you cannot be successful without knowing your primary reason for
    success. It could be that you want to travel around the world, pay for your child’s
    college tuition, do charity work, support your aging parents, or help the environment.


    Show me people with a big enough reason why they want to accomplish something,
    and I can assure you, it’s only a matter of time before it becomes a reality.
    What’s your “why?”


    ## Powerful Questions


    As you can see from the previous section, asking thoughtful questions is more
    important than having quick answers.


    Powerful questions trigger your brain to search for powerful answers. I’ve learned
    that high levels of enlightenment and incredible success are a direct result of
    the quality of the questions you ask yourself on a consistent basis.


    Be sure to ask yourself powerful questions every day. The results will amaze you.
    What will manifest from this habit will propel your business to new levels.


    Here are some powerful questions you can ask yourself before launching your app
    business:


    * What will I do with the newfound freedom that I’ll have?

    * Who am I doing this for? Why?

    * How will being successful at this change the lives of my loved ones?

    * What am I committed to doing to guarantee my success?


    Another powerful tool is taking immediate action however small the step may seem.
    Humor me, grab a piece of paper, and take five minutes to consider and answer
    these questions.


    In later chapters, I share with you more detailed questions you can ask, related
    directly to specific parts of your business.


    ## Vision/Outcomes


    Create a vision that ignites your passion. Then specify outcomes you want from
    that vision.


    Creating a vision for your business is essential for figuring out where you want
    to go. Would you jump into a car and drive without knowing your destination? Well,
    we know that many people go through life’s motions half-asleep, taking on task
    after task to keep themselves in busy mode. I’m assuming if you picked up a book
    about creating a successful app business and reinventing your life, that isn’t
    your style.


    When you create a vision, continue your inner dialogue until you get a better
    understanding of your motivation:


    * You might say, “I want to make a certain amount of money.”

    * Okay, well why do you really want this?

    * You might say, “I want to pay off debt, and not worry about money all the time.”

    * Okay, well, what will that give you?

    * Maybe “It will lift a heavy burden off my shoulders and allow me to feel free.”

    * Well, why is this freedom so important?

    * “It will allow me to feel good again. I will be able to spend time with my family,
    see them laugh, have fun, and enjoy life. I can catch up with old friends, travel
    to places I’ve always wanted to see, experience life in new ways, remember what
    it felt like to be a kid again, revive the dreams that I let die, etc.”


    Keep delving deeper because the initial responses are usually superficial and
    don’t reveal the real motivations behind our actions. Usually when you do this,
    at some point something inside of you will click. You will feel like you are ready
    to explode, fully alive, and passionate. That’s when you will have reached your
    true vision. When you are challenged to be specific, the truth comes out, and
    you will manifest what you want.


    Once you have that clarity, set your outcomes or goals around that to accomplish
    the vision. For another example, ask yourself, “What is the vision for my company,
    and what do I want to create?”


    Be specific. Make it emotional, something you would strive for, and create your
    future now. Relate your outcome to something tangible. For instance, “If I can
    make `$10,000/month`, I’m going to travel to Italy and paddle around in a boat
    through the Grand Canal.” Maybe it’s a yearly goal with a reward, like, “I’ll
    fully fund my kids’ education,” “I’ll buy a bigger house,” or “I’ll get myself
    out of debt.”


    Write it where you will see it throughout your day. It will keep you motivated
    and give you the energy to overcome unforeseen and uncontrollable obstacles that
    could sidetrack you. I write my outcomes on the bathroom mirror, using an erasable
    black marker because I know that every morning, I’ll go to the bathroom, brush
    my teeth, and look in the mirror. Over the years, I’ve written things like, `Get
    to $1,000/month cash flow`, `Travel somewhere exotic`, or `Sell my app business
    for seven figures`. Seeing those every day made them happen faster, and instantly
    gave me the motivation I needed to push through that day’s challenges.


    ## Faith/Optimism


    Whatever your goal, you must consistently believe you have a way to achieve it,
    and you must be resolute in this belief. To attract success, learn to see it,
    feel it, and manifest it. I’ve always had faith on a superficial level but never
    truly allowed myself to embrace it. After my accident and hearing the voice that
    pulled my mind out of that dark place, I can’t deny the power of something greater
    than myself. I realize that not everyone has an experience like this, but I urge
    you to connect or reconnect to whatever higher power you believe in. It will be
    a game changer for you.


    ## Passion


    You need to be enthusiastic about your business and whatever you do in life. Since
    you’re spending time building this new enterprise, you are in a position to make
    it feel less like work and more like fun and play, otherwise you will burn out
    quickly.

