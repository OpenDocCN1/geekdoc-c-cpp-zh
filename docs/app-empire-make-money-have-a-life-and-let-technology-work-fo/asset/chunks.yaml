    A few days later, I found out that the development company in the magazine was
    located only two hours away from where I was staying in Vermont. At the time,
    I still had the old-school real estate mentality that business had to be done
    in person. So, I decided to take a trip down to have a face-to-face meeting with
    them.


    “Nice to meet you,” John, the owner, said as I shook hands with him and the team.
    Their eyes were glued on me, which made me feel completely out of place. Maybe
    this wasn’t a good idea, I thought to myself. My inner Negative Nancy was chiming
    in. I awkwardly sat down at their boardroom table, and started telling them my
    idea and how I knew nothing about this new world of apps but that I was eager
    to learn.


    “No worries. We will help you out,” said Kevin, the project manager. After a few
    minutes discussing how the app would work, how long it would take, and how much
    it would cost, my uneasiness drifted away and I began to feel more confident.


    I left the office that sunny Friday afternoon with my head held high and a swagger
    in my step. Talking to them had given me clarity and removed many of the hurdles
    I had seen before me. That’s when I understood the importance of what development
    companies do and the value they can bring to an app business. Suddenly I believed
    almost anything was possible in the app world. My brain opened up and my thoughts
    turned into an uncontrollable creative avalanche. The possibilities seemed endless.
    “Okay, we can do this, and we can do that.” I started coming up with all kinds
    of ideas and I actually had the people to execute them. Problem solved. Next.


    As an appreneur, it’s easy to hit a barrier because you may not know if the technology
    will support your app ideas. The great thing about programmers is they can give
    you answers. Instead of blocking your creativity, hire the right people and be
    resourceful. I lucked out with my first development team, and then through multiple
    experiences, some good and some bad, I learned how to hire good people. In this
    chapter, you will learn how to find, hire, manage, and fire developers and to
    set up systems that will help you turn your possibilities into realities.


    # THE IMPORTANCE OF PROGRAMMERS


    As of this chapter, you have been researching the market on a regular basis and
    have used the last chapter to create up to three well thought-out app ideas. Now
    what? If you are a programmer or are technically inclined you might think “Cool,
    I can write my own apps” or “I’ll teach myself how to code an app.” You might
    get a few books on how to program and start writing code at crazy hours of the
    night hooked up to an IV full of coffee.


    Well, you could do that but I would highly advise against it. It’s important that
    you keep your momentum and get an app out to the market as soon as possible. Coding
    your own app, especially if you’re teaching yourself at the same time, will take
    too long. The likelihood of you getting stuck and giving up is very high.


    This model will also be unsustainable over the long run when you want to create
    several apps at the same time and consistently update your existing apps. After
    all, the idea is to get your time back and escape the long hours of the rat race.


    Another reason to outsource app development is that you have to focus on the role
    of a businessowner. This means having a bird’s-eye view of key aspects of your
    business like market research, marketing, networking, and so on. You won’t be
    able to do that if you’re spending all your time in the trenches. You don’t see
    Donald Trump running around with a hard hat on the 40th floor of his new skyscraper
    and hammering in nails do you?


    You must decide that you will focus on the high-level operations of your company
    rather than getting lost in executing minute details. Programmers will be the
    foundation of your business and allow you to create apps quickly and scale easily,
    which will allow you to remain the captain of your ship.


    # WHAT TO LOOK FOR IN PROGRAMMERS


    Since programmers play such a vital role in your business, you must be particularly
    discerning when it comes to selecting them. Just as you wouldn’t let anyone build
    your dream home, you need to use care with who is laying the virtual bricks of
    your mobile empire.


    When it comes to selecting programmers, you have to focus on certain key areas.
    These include experience, communication, team, pricing, and conflict of interest.


    ## Experience


    The first thing you need to assess is the programmer’s level of experience. It’s
    not a good idea to work with programmers who haven’t worked on many apps. Sometimes
    when programmers are beginning, they will offer cheap rates. This is like taking
    a helicopter ride with a pilot who has only flown a few times. I wouldn’t recommend
    it.


    One of the first things I ask to see when considering new programmers is the apps
    they have created. If a picture speaks a thousand words, to me, an app speaks
    10 thousand. Download the programmers’ apps and assess the quality of the work.
    Does it look sharp and work flawlessly, or is it clumsy? Does it look professional
    or substandard?


    Sometimes they are bound by nondisclosure agreements (`NDAs`) and are not able
    to disclose the apps they have worked on, or they have only worked on parts of
    an app. Regardless of this, you have to see their products in action. If you can’t,
    move on unless you’re into buying cars without test-driving them.


    The programmer’s website can be a useful assessment tool. This is particularly
    true for development companies, which often showcase their work on their website.
    It should highlight some of the apps they’ve done and give you confidence they
    aren’t a fly-by-night company. The quality of the website can indicate the quality
    of apps they create. Independent programmers don’t always have a nice website,
    but if their portfolio of apps is impressive, you should continue assessing them.


    When hiring a programmer, ask for references. Talk to at least one person who
    has worked with this programmer before. I prefer two or three, which can be difficult
    to get, but why not try? This is not as important for programmers that you find
    on outsourcing websites, such as `oDesk` (`appempire.com/odesk`) or `Freelancer`
    (`appempire.com/freelancer`). On these sites, assessing developers is easier because
    you can review detailed statistics on their previous work performance. You will
    see reviews and ratings from their previous clients and can determine if they’re
    somebody you would want to work with.


    After doing a general assessment of the programmers’ skills, you need to ensure
    they have the specific experience necessary to complete the app. I get into this
    usually during a second conversation after I’ve done my initial assessment and
    had the programmer sign an `NDA`. You will be able to estimate the skill level
    when you look at the previous work, but you still have to make sure the programmer
    has the specific skills your app requires.


    ## Communication


    Even though cost of development in other countries may be lower, the language
    barrier can be a hassle. Work with programmers who share your native language.
    You must be able to communicate with your developer effectively. It may cost more,
    but you will get higher quality work and fewer headaches. Does this mean you should
    never work with somebody from another country? Of course not, but just make sure
    they’re fluent in your language.


    Something else I expect from programmers is technical guidance. When I started,
    I was a complete novice, but I was fortunate to work with programmers who educated
    me about technical jargon during the entire process. Not all programmers are skilled
    at this even if they’re good at creating applications. Make sure your first programmers
    are willing and able to explain things to you in non-technical terms.

