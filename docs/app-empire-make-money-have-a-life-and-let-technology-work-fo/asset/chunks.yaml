    “What do I do now?” I asked my friends. Through multiple conversations they made
    me realize that it takes a different set of skills and a deeper level of understanding
    to keep a relationship going and take it to the next level. They were right. What
    had worked in the beginning wasn’t enough anymore and I had to step up my game.


    A similar pattern can happen in business as well. Initially, everything seems
    great because you experience immediate and significant growth when you start from
    zero. You attract a great customer base with your initial marketing. You see your
    traffic and income grow, and you think your growth spurt will never end. At some
    point, you hit a wall, and you watch as your business starts to plateau or drop
    off. As with any business, you can’t become complacent with your initial success
    and must be open to implementing new strategies to keep your business strong.


    In the app world, many advanced marketing strategies are available to attract
    new users and keep them coming back, upgrading, and spending more money.


    Every technique I talk about in this chapter is designed to drive as much traffic
    as possible to your apps and keep them from stagnating. The beauty of these techniques
    is that most of them are free and don’t necessarily require more time or effort.
    By using a few of these advanced tactics, you can catapult yourself from app newbie
    to app expert.


    ## HITTING A PLATEAU


    I knew the after party had ended for my first app as soon as I saw the numbers
    dropping for a week straight. I realized I had gotten complacent and had stopped
    experimenting with new marketing strategies because I had been making good money.


    Taking the hint, I sprang into action but continued to see my numbers decline
    for about a month and a half. I tried strategies that had worked previously but
    to no avail. I watched, trying new things, as revenue dropped from more than $900
    a day to about $300 a day. I was not about to give up and began testing a bunch
    of new strategies to generate more revenue. Every week, I would use a new marketing
    technique to see if I could invigorate my fading app.


    Finally, after some trial and error, a few of these techniques worked, and the
    downtrend reversed. Two months later, I was consistently averaging more than $800
    a day. I was back in the game and those skills I learned were priceless.


    These tested advanced techniques include the app network, nag screens, more pages,
    push notifications, the developer network, updates, and paid traffic.


    ## YOUR APP NETWORK


    I like the phrase “no man is an island.” It means that human beings can’t thrive
    when isolated from others. This is true for apps as well. You can create a single
    app that may do well, but when you create additional apps and link them to each
    other with cross-promotion, you’ll move toward your app empire’s full financial
    potential.


    An app network is a web of interconnected apps that use their active users (traffic)
    to promote each other. As mentioned in Chapter 7, you should consider each one
    of your apps as a source of traffic much like a website on the Internet. This
    traffic contains gold, especially if you use the power of your app network to
    monetize it.


    For example, if you only have one free app that is doing 50,000 downloads a day,
    you will be making a certain amount of money with banner advertising and perhaps
    some affiliate marketing. If you have multiple apps that promote each other with
    nag screens and promo pages (which will be explained), then you can funnel those
    50,000 users to your other apps and generate hundreds of additional dollars. That’s
    essentially the app network: your own superhighway of app users that you direct
    and redirect on a consistent basis to find the traffic patterns that yield the
    most amount of money.


    The app network is so vital that few if any app companies can be successful for
    a long period of time without building one. Your app network allows you to boost
    your app rankings and gives you credibility with other app developers, which makes
    them more likely to cross-promote with you. It’s crucial when it comes to launching
    a new app because you can immediately get lots of eyeballs on it using your app
    network. The more downloads and traffic you get with your app network the more
    you start growing a vibrant app ecosystem. Most major players have figured this
    out, which is why they can push their apps into the top rankings consistently.


    This is why you have to make developing your app network a priority from day one.
    You’re in the business of creating apps and in the business of creating a kick-ass
    app network. Most of the following sections in this chapter will focus on teaching
    you how to do that.


    ## NAG SCREENS


    Have you ever been to a nice restaurant where the waitress upsells you? She says,
    “Hey, that pesto pasta is awesome. Would you like me to add some shrimp to that?”
    You think about it for a second and sometimes say, “Sure. Why not?” You didn’t
    think about the shrimp, but when presented with the option, you went for it.


    That’s the job of the nag screen (see [Figure 8.1](#Chapter08.html_figure8-1)).
    It’s a pop-up window that appears when an app is started. It has a short call
    to action, giving the users the option to download the pro version of the app
    that has more features than the one they downloaded.


    [FIGURE 8.1](#Chapter08.html_figureanchor8-1) Nag screen example.


    ![image](images/f136-01.jpg)


    The nag screen plays into the users’ impulse buy mentality. Once users have downloaded
    and opened up your free app, you can offer that premium content and expect a reasonable
    conversion rate. Make sure that you don’t throw just anything up there. Like any
    upsell, you do have to be strategic in how and what you promote to your customers.
    A slick demonstration of value on a nag screen may hook potential buyers, but,
    if done improperly, it can turn customers away entirely.


    Nag screens are usually used to upsell from a free version of an app to its pro
    version but you can use them to advertise your other apps as well. You can even
    promote your other free apps to grow your app network. After all, who wouldn’t
    like to get another one of your free apps?Nag screens have two styles. One is
    the default blue nag screen, which looks like all the other alerts you get on
    your phone. This version is easy to implement and good for starting. When you
    generate more revenue, you can move to a better looking nag screen, one that fills
    the screen and is more engaging (see [Figure 8.2](#Chapter08.html_figure8-2)).
    On average, these advanced nag screens receive three times more click-throughs
    than the default ones.


    [FIGURE 8.2](#Chapter08.html_figureanchor8-2) Advanced nag screen.


    ![image](images/f137-01.jpg)


    Nag screens have been the most critical advanced marketing strategy for my business.
    You have to utilize them. You might think, “I don’t want to annoy my users with
    these ads,” and that is a valid thought, but think of this as adding value for
    users. If they have downloaded your free app and are using it, you have users
    who are interested in your apps and in that type of app. They might want to get
    the pro version with the additional features. For those who don’t, a quick pop-up
    message is a small price to pay for using your free app.


    You have to accept this and not shy away from this type of marketing. If you’re
    still on the fence, consider this: When Apple launched its iBooks app, it used
    a nag screen within the App Store app. If you had an iPhone at the time, you may
    remember seeing that pop-up inviting you to download iBooks. Well, you were nagged
    by the one and only Apple.

