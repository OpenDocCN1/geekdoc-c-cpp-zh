    \n[FIGURE 6.2](#Chapter06.html_figureanchor6-2) Fingerprint Security - Pro description.\n\
    \n![image](images/f107-01.jpg)\n\nOne of the Top Apps Worldwide\n\nThis marketing\
    \ copy would not apply to all apps. If you’re starting out, you can write other\
    \ descriptions that catch users’ attention by pointing out how your app is different\
