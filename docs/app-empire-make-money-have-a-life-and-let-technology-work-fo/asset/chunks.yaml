    要在应用业务中取得成功，你不需要发明地球上最创新的应用。你只需要只需要提供价值，并理解营销你的应用的策略，以便你的客户能够发现并购买它们。


    在本章中，我将向你展示简单但强大的营销技术，这些技术将带来流量并让客户蜂拥而向你的 App。


    # 盛装打扮（DRESSED TO KILL）


    与任何生意一样，你必须让自己从竞争中脱颖而出。你的 App 需要是一个设计良好、质量可靠的应用，但如果人们找不到它，或者在找到它后对其价值不信服并选择不下载，那么即使是世界上最好的
    App 对你也没有大帮助。


    大多数开发者几乎完全精力集中在创建 App 上，严重低估了实施一些最基础营销技术的重要性。这些技术非常有效且成本并不高。你应该将它们视为 App 开发过程的一部分。随着你业务的增长，你可以投入一些资金在更高级的营销上。（我将在第
    8 章中讨论这一点。）我建议你在看到 App 的需求并开始通过它获利之前，不要这样做。


    以下是 App 成功的公式：


    `有效的营销 = 流量 = 下载量 = $$$ = 开心的老板`


    这是一个显而易见的道理，但大多数人并没有关注它。你的营销越有效，看到你 App 的人就越多。看到你 App 的人越多，获得的下载和收入就越多。把它看作是一个数字游戏。例如，假设每天有
    10,000 人查看你的 App，而你的转化率仅为 1%。这将每天为你带来 100 次下载，对于一个付费 App 来说，每天就是 70 美元，每月大约 2,100
    美元。这是一个转化率相当低的 App。所以，请记住，你的工作是创建出色的 App，并投入相同的时间和精力让它们出现在尽可能多的视野中。当然，通过进入 `Apple’s
    App Store`，你会获得一些曝光率，但由于那里有如此多的 App，你不能寄于此。


    ## 那么，你如何给 App 打扮呢？


    在第 3 章关于冲动购买的讨论中，我们了解到用户在下载 App 之前通常会评估图标、标题、描述和截图。了解 App 的这些基本元素如何成为营销机会（让你能够为你的
    App 精装打扮），对于在应用业务中取得成功至关重要。你的工作是创建一个从图标到下载按钮的无缝衔接。让我们仔细观察其中的每一个。


    ### 图标（ICONS）


    图标是用户在查看你的 App 时看到的第一个东西。它是 App 标题左侧带有圆角的小方形图像。它也是用户在安装你的 App 后在手机上看到的图像。


    图标之所以重要，是因为用户通过它识别你的 App。它应该捕捉 App 的精髓。它必须看起来好看，吸引用户的注意力，并促使他们研究你的 App。它是你 App
    的视觉 ID。


    图标是你给用户留下的第一印象。“你没有第二次机会来创造第一印象”这句老话在这里同样适用。你希望在求职时穿睡衣还是穿最体面的西装出现？确保你有一个高质量的图标来代表代表你的
    App，并让用户觉得它有价值。


    你的图标应该吸引你想要吸引的客户。如果图标显示的是一只可爱的卡通动物，你可能不会指望它身上寻求导航帮助，对吧？许多开发者把创建图标当作事后考虑，并将所有精力都集中在
    App 本身上。在项目的设计阶段，与你的程序员和平面设计师合作，为你的 App 精心图标至关重要。


    ### App 标题（APP TITLE）


    你的标题应该是令人兴奋、简洁、时尚且朗朗上口的。如果它符合这些标准，人们自然会想要查看它。但你 App 的标题不仅仅是一个名字。（参见 `图 6.1`](`Figure
    6.1`）。）它对于帮助用户在应用商店进行关键词搜索时找到你的 App 也至关重要。标题中的每个词都作为最有价值的关键词，就像搜索引擎关键词一样。把标题想象成你的
    `URL`。如果你在 `App Store` 搜索框中输入“angry”，`Angry Birds` App 将作为搜索结果返回。


    图 6.1 高收入 App 标题。


    ![image](img/f105-01.jpg)


    你的标题需要被记住，并且具体描述你的 App 功能。在决定 App 标题时，考虑 `App Store` 中其他成功的 App。我经常这样做，并问自己以下三个问题：


    1. 为什么这些标题有效？

    2. 是什么让它们如此朗朗上口？

    3. 人们搜索哪些词来找到这些 App？


    把标题中的词看作寻找你 App 的用户的载体会有帮助。创建可爱的名字很有趣，但如果没人能找到它们，就不那么有趣了。


    在为 App 命名时，请记住 `Chomp` 数据分析（第 3 章提到）。`App Store` 中超过 90% 的搜索集中在 App 的功能上而不是特定的
    App 名称。所以，当你决定将 App 命名为 `Fun Colors` 还是 `Flashlight` 时，你应该选择更具描述性的名称，即 `Flashlight`。


    ### 描述（DESCRIPTIONS）


    接下来是描述。为你的 App 准备一个引入人的描述就像有一个出色的开场白。如果你激发了他们的兴趣，他们更愿意了解关于你的信息。


    描述的第一部分需要充满信息。在适用的情况下，使用像“2012 年顶级 App”或“App Store 中最成瘾的游戏之一”之类的陈述。然后跟上行动号召，例如“查看截图并亲眼验证”。


    例如，`Fingerprint Security`（`图 6.2`](`Figure 6.2`））的描述以简短的标题开头：


    图 6.2 Fingerprint Security - 专业版描述。


    ![image](img/f107-01.jpg)


    全球顶级 App 之一


    这种营销文案并不适用于所有 App。如果你是刚开始，你可以编写其他描述来吸引用户的注意力，通过指出你的 App 与竞争对手相比何不同且更好，并包含用户证言。例如，如果我开始做
    `Fingerprint Security`，我会写类似这样的话：“App Store 中最真实的指纹扫描恶搞。”或者获取来自用户的正面证言，例如：“这个
    App 惊呆了我。它的声音和画面简直不可思议。”另一个例子是“限时免费”。这给了客户一种紧迫感和下载 App 的动力。


    在描述之后，用几句话解释为什么用户必须下载这个 App：“市场上最令人印象深刻且真实的指纹安全应用。查看截图并亲眼验证。你不会失望的。”


    ### 截图（SCREENS）


    截图是你随 App 描述提供的图片，向客户展示你的 App。将它们视为你 App 的图形化描述。俗称是电影的预告片。基础截图是 App 的屏幕捕捉。更高级的截图是吸引人的、包含营销内容并传达
    App 如何工作的图形设计（参见`图 6.3`](`Figure 6.3`)).


    图 6.3 基础截图（上方）；高级截图（下方）。


    ![image](img/f108-01.jpg)


    ![image](img/f108-02.jpg)


