    交叉推广的概念并非应用行业独有。在房地产领域，每位经纪人在职业生涯初期都会被教导与为购房过程提供服务的人建立人脉。例如，你会与贷款经纪人建立关系，他们会向你推荐寻找房子的人；作为回报，你会向他们推荐寻找贷款的人。


    通过 `Alan`，我立即看到了这种模式如何应用于应用世界，并决定和他一起进行应用的交叉推广。但我并没有停于此。我联系了其他娱乐应用公司，包括 `Doodle
    Jump` 的创建者 `Lima Sky`。时机非常完美，因为他们当时正在发布新应用 `Bubble Wrap`。我成功地让他们与我进行交叉推广，这增加了我应用网络的流量。


    如果你与几位开发者一起采用这种策略，而不是一个人，你就有潜力看到你的流量飙升。找到那些与你的应用流量相当、受众群体相似的开发者，并最大化你的转化率。例如，工具类应用对游戏的交叉推广效果可能没有对其他工具类应用好，因为受众群体不同。


    ## 推送通知


    推送通知是另一种有效的高级营销策略。推送通知向手机上安装了你应用的客户发送消息。推送通知可以包含你想要传递给用户的任何信息。它像短信一样出现在屏幕上，要求用户忽略该消息或打开发送该消息的应用。推送通知的巧妙之处在于，它在提醒用户你的应用，并给他们触碰屏幕即可打开应用的机会。


    由于这些通知以短信的形式显示，其打开率接近 100%。毕竟，你难道从来没有读过屏幕上弹出的短信吗？这对于营销你的应用来说是巨大的，而且是任何行业的任何其他类型的广告都无法比拟的。


    推送通知是一种强有力的、直面的应用营销方式，必须谨慎使用。不要每天发送推送通知，否则客户会感到厌烦并删除你的应用。在他们积极使用你的某一个应用时向他们展示广告是一回事，但向他们发送推送通知并中断他们当时可能正在做的任何事情则是另一回事了。


    这种策略在你建立起坚实的粉丝基础后效果最好，这些粉丝热衷于使用你的应用或期待你的下一次更新。公司 `Outfit7` 凭借极其成功的 `Talking Tom`
    和其他“会说话的程序”在这方面做得非常好。他们很少发送推送通知，只有在偶尔会发送一些有趣的内容，如“我想你了”或“来陪我吧”。有时他们还会宣传新功能。


    让我们考虑推送通知的财务影响。假设你有一个活跃用户量为 `250,000` 的应用。如果你发送了一条推送通知，只有 10% 的用户查看了，那么这一天你就为你的应用网络注入了额外的
    `25,000` 用户。这些流量将通过额外的销售、横幅点击和联盟收入增加你的收益。这就像点击按钮印钱一样。


    ## 你的开发者网络


    发布几个月后，我的热门应用开始排名下降，我不知道如何停止它。我问自己：“我能做什么让这成为一项可持续的业务，而不是一个昙花之粉？”于是，我想：“在这个行业里我认识谁可以帮我？谁可以成为导师？我可以向谁学习成功？”这就是每当我想要更上一层楼时一直想过的。


    现实情况是，我在这个行业里并不认识任何人。当时的应用行业非常新颖，大多数开发者都集中在硅谷，所以我决定去那里。我带着所有的行李（两个包）到了旧金山。我充满动力，准备好建立人脉并开始我的应用创业者（appreneur）生活。我的跨国迁移将我的业务推向了新的高度。我建立的第一联系是
    `Alan`，从那里开始，我的开发者网络起飞了。我与其他应用创业者建立联系，学习了他们用于应用变现的策略。我自己从未想过其中一些点。


    你不需要脱离生活搬到旧金山来建立人脉，因为开发者无处不在，而且你可以利用技术。但你的成功取决于找到志同道合的人建立人脉。从做得好的人身上学习可以帮助你比自己摸索业务门道更快地进步。


    你可以在哪里找到他们？使用 `Meetup` (`appempire.com/meetup`) 或类似的社交网站、行业会议、开发者博客等。`Meetup`
    将你与处于相似行业或有相似爱好的人联系在一起。在我参加的第一次 iPhone 开发者聚会上，我遇到了几位非常出色的开发者，他们向我介绍了他们的开发者朋友。我们建立了一个智囊小组（mastermind
    group），这对我们的成功至关重要。他们教我他们的技能，我也能向他们展示一些东西，帮助他们将业务推向新水平。


    受智囊小组结果的激励，我参加了应用会议并扩大了我的开发者网络。这些会议是人脉建立者的梦想，让应用创业者学习新的、有用的信息并遇到志同道合的人。有一次，我参加了
    `BizTech` 会议，互联网营销专家兼应用开发者 `Joel Comm` 在那里演讲。演讲结束时，我向 `Comm` 先生提了一个问题，并从介绍自己开始在大量观众面前推销我的应用。


    之后，有几个人过来对我说：“我也是一个应用开发者。”这是一个结识人的好方法，但我必须让自己表现出来。


    好消息是，你不需要在数百人面前站起来说话就能成功建立人脉。当你参加聚会和技术会议时，一对一对地介绍自己并提问以获取更多信息。询问他们来自哪里，做什么的等等。每个人都是为了学习和结识他人，所以不需要害羞。对于你参加的每一个会议，你的目标是带一个人进入你的“圈子”。不知不觉中，你就拥有了一个梦幻的应用创业者网络。


    投入你的开发者网络，就像你投入你的应用网络一样。


    ## 更新


    猜怎么着。没有所谓的“完工”的应用。你将不断地修复漏洞、添加新功能或应对竞争。要让你的用户获得应用的最新版本，你所做的只是将其上传 Apple 进行审核，就像你第一次发布应用时一样。在
    Apple 批准后，所有在设备上安装了你的应用的用户都会看到可用更新（见 `图 8.6`）。这看起来简单而易见，但更新是一个巨大的营销机会。


    [FIGURE 8.6] App Store 应用中的应用更新。


    ![image](img/f146-01.jpg)


