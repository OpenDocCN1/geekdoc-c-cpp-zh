    ## 引言


    这非常棒，因为你可以向那些为你带来最多收益的平台发送更多广告请求。如果你不想向某些平台发送广告请求，可以关闭它们。你始终拥有重新开启它们的选项。


    你还可以选择广告请求的备补优先级（backfill priority）（参见图 9.3）。这意味着你可以决定当当前网络没有返回广告时，`AdWhirl` 向其他广告网络请求广告的顺序。这种程度的控制将使你能够从你的横幅广告中榨取最大的利润。


    图 9.3 在 AdWhirl 上选择备补优先级。


    ![image](img/f157-02.jpg)


    `AdWhirl` 的另一个酷功能是你可以拥有“内源广告”。这意味着，你可以在自己的横幅广告中推广自己的 App。你只需要上传一张你 App 的精美横幅图及其对应的链接即可。然后，你决定想让自己的广告显示的百分比，这样就完成了。你的广告将与其他广告网络的广告一起出现，你的用户将无法看出其中的区别。


    我喜欢做的一件事是将 `AdWhirl` 也加入到我的付费 App 中。就像你的提示界面（nag screen）一样，你可能会在付费 App 中关闭横幅广告。但如果你以后决定进行
    `FreeAppADay` 促销并让你的付费 App 在有限时间内免费，你就可以接入 `AdWhirl` 并开启广告，以利用你临时的免费流量来获利。这可能会为你多赚数千美元。你必须赋予自己这种灵活性，以便随时对你所有的
    App 实现变现。


    至于如何集成 `AdWhirl`，就像处理你的提示界面和促销页面一样，你的程序员需要在这方面拥有经验。让他们处理所有细节，并在你提交 App 之前检查一切是否运行正常。


    ## 联盟营销 (Affiliate Marketing)


    联盟营销在互联网上相对广泛，许多人仍然通过它赚取大量的钱。基本概念是：如果人们在线上有东西要卖，他们会将为你带入客户进入其网站后产生的每笔销售额的一部分分成给你。你（联盟营销人员）通过为卖家连接买家从他们那里获得佣金。


    如果我在卖一门价值 100 美元的如何制作 iPhone App 的音频课程，我可以决定将销售额的 50% 分给我的联盟伙伴。你可能是一个拥有关于如何制作
    iPhone App 博客的开发者，而且你可能喜欢我的产品。你决定在你的博客上放一条推广我产品的广告。每天有许多人访问你的网站，其中一些人会看到你的广告、点击它并被重定向到我的网站。在点击你广告的人中，有些人会购买我的产品。对于每一个从你网站来到并购买我产品的人，你将权获得
    50% 或 50 美元的佣金。


    这很酷，因为你正在从一个你并非创作的产品中获利。此外，你的网站上上有用户（流量），为什么不给他们展示一些可能他们感兴趣的内容并同时赚点钱呢？卖家知道流量来自你，因为每个联盟营销人员都会获得一个唯一的标识链接，被称为
    `affiliate link`（联盟链接）。这样，就不会产生关于用户从哪里来的困惑，所有联盟伙伴都能获得他们应得的。


    联盟营销自互联网诞生以来一直存在。互联网上成千上万的产品正由联盟伙伴推广。因此，出现了一些作为卖家和联盟伙伴之间中介的网站。卖家发布他们的产品和佣金金额，联盟伙伴可以浏览这些报价，并挑选他们认为最有利或与他们的流量最相关的。其中一个网站就是
    `LinkShare`（[`appempire.com/linkshare`](http://appempire.com/linkshare)）。


    `LinkShare` 连接卖家和联盟伙伴。它还作为一个联盟销售跟踪服务。一旦你注册成为 `LinkShare` 的联盟营销人员，你就可以找到用于推广某些产品所需的链接。开始推广这些产品后，你可以随时登录
    `LinkShare`，查看你的流量为卖家产生了多少收入的详细统计数据。（参见图 9.4）。你可以看到从这些销售中赚了多少钱。`LinkShare` 定期从卖家那里收取你的收益并定期发送给你，这既简单又有效。


    图 9.4 LinkShare 报告。


    ![image](img/f159-01.jpg)


    所以，既然这一切操作都发生在互联网上，我们为什么还要讨论这些联盟营销的术话呢？是因为联盟营销也存在于智能手机上。苹果是互联网上最大的数字内容销售者之一，因此它与
    `LinkShare` 合作，为任何向其发送购买电影、歌曲、电子书和 App 客户的联盟伙伴提供佣金。在实际操作中这意味着什么？任何将流量引向苹果 iTunes
    商店的联盟伙伴都有权获得用户在随后 72 小时内所做任何购买金额的 5%。


    你应该关注这一点，因为你从事的是构建 App 并使用你的 App 网络引导流量的业务。每当你的一个用户点击你的提示界面或促销页面横幅时，你就将他们发送到 App
    Store。你的 App 网络越强大，你每天发送给苹果的流量就越多，你产生的联盟收入就越多。


    你所做的仅仅是注册 `LinkShare` 并使用正确的 `affiliate link`，这将你发送给苹果的流量归给你。反正你都在把人们引向你的 App，所以使用
    `affiliate link` 并收集你应得的佣金。（参见图 9.5）。


    图 9.5 创建联盟链接。


    ![image](img/f160-01.jpg)


    这是一个普通链接的示例：

    ```

    http://itunes.apple.com/us/app/fingerprint-security-pro/id312912865?mt=8

    ```


    这是一个 LinkShare 联盟链接的示例：

    ```

    http://click.linksynergy.com/fs-bin/click?id=LjQr0YBXPSs&subid=&offerid=146261.1&type=10&tmpid=3909&RD_PARM1=http%3A%2F%2Fitunes.apple.com%2Fus%2Fapp%2Ffingerprint-security-pro%2Fid312912865%3Fmt%3D8

    ```


    不要被 `affiliate link` 的长度吓到。记住 `LinkShare` 会为你创建它，你只需要复制粘贴那个特定的链接而不是第一个。反正你的程序员会处理这一切的。


