- fmt: '

    Year after year, like a broken record, we watch as Greg runs to the local gym
    without a good thought-out plan and thinking that action alone will yield the
    results he wants. Although he makes some progress, getting toned up for one or
    two months, his efforts are unsustainable. He gets hurt or loses interest, and
    gives up with pure disgust in himself. His New Year’s goal becomes shattered again,
    and he lives the rest of the year telling himself, This isn’t for me, and I’m
    not that guy, missing out on the outcome he was an inch away from achieving.


    Do you know anyone like this?


    The same thing happens to most newbie appreneurs. They rush into this business,
    with lots of hope and dollar signs flashing in front of their eyes, but they don’t
    realize there is a system for everything. Whether you are forging steel abs or
    creating a million-dollar app biz, you need to learn to funnel your enthusiasm
    into a system. Otherwise, you will likely give up at the first signs of difficulty.
    Many appreneurs quit after their first app fails, when they may have been on the
    verge of succeeding.


    It doesn’t have to be that way for you. This chapter will be your personal trainer
    to keep you on track and show you strategies to help you generate successful app
    ideas. You will learn how to create and implement money-making ideas consistently,
    analyzing and sifting through each idea you have.


    Will all of your ideas be a hit or make money? No, most likely not. However, I
    can assure you that if you use this process, you won’t have to wrestle a leprechaun
    for that pot of gold at the end of the rainbow.


    ## DON’T FALL IN LOVE WITH YOUR IDEA


    I’m sure you’ve heard the expression: “If you build it, they will come.” Most
    developers believe this is true for apps, but that’s not how it works in the app
    world.


    They build an app and expect someone, or a whole lot of someones, to find it immediately
    and download it. That rarely happens. You have to figure out what people are interested
    in and the kinds of apps they’re downloading, and you build your app based on
    that insight.


    As I explained in Chapter 3, your market research will give you these insights.
    Make time for market analysis every day. This will help you generate the most
    lucrative ideas. You will see how consumers are behaving, and it’s your job to
    recognize, understand, track, and take advantage of this insider information.


    If you are passionate about a specific subject, that’s a good starting point to
    explore app ideas. It’s always advantageous to work on something that you enjoy
    because you will have more insight on the topic and will be more dedicated to
    making it work. This would be the ideal situation, but remember this should be
    a starting point. If the market is not showing demand for your idea, nix it. On
    the other hand, if the market seems to like the topic you are passionate about,
    focus on creating apps in that area.


    How do you know if the market wants your app? Just look at the top app charts.
    Are apps like the ones you want to do listed there? If yes, you’ve got a potential
    winner. If not, keep looking. It’s that simple.


    When you follow in the footsteps of successful apps, you will have a better chance
    of succeeding because these apps have proven demand and an existing user base.
    This takes the guesswork out of creating app ideas.


    I can’t stress enough the importance of emulating existing apps. It’s easy for
    people to fall in love with their own idea even if the market doesn’t show an
    appetite for it. This is one of the most costly mistakes you can make.


    Developers make this mistake all the time. They focus on generating original ideas
    and spend a lot of time and effort creating those apps. When it doesn’t work,
    instead of learning from the market, they go to the next untested idea. Often
    times, they repeat this cycle until they run out of money and are frustrated with
    the app game. This doesn’t have to be your experience.


    One example of an app that seemed to be a great idea, but didn’t do so well is
    the `Pocket Dream Girl` app. (See [Figure 4.1](#Chapter04.html_figure4-1).) It
    was created by a friend of mine, and the premise behind it was that the user can
    create the face of his dream girl by mixing and matching the hair, eyes, nose,
    and mouth of over 20 women. As a result, the user could create over 150,000 Weird
    Science-type women.


    [FIGURE 4.1](#Chapter04.html_figureanchor4-1) Pocket Dream Girl.


    ![image](images/f061-01.jpg) ![image](images/f061-02.jpg) ![image](images/f061-03.jpg)


    When I heard the idea, I thought it was a good app and that it could work. Before
    starting development, I would have researched the market, realized no demand for
    this type of app existed, and moved on. But my friend was in love with his idea
    and had the app developed without being discerning or doing any market research.
    It was nicely done, but as you can imagine, the app flopped.


    You want to avoid this mistake with your apps, and if you listen to the market,
    you will.


    Another trap to watch for is being sidetracked by others. In my experience, the
    first rule of making cash as an appreneur is to stick to your game plan, and avoid
    advice from anyone who hasn’t had any success in the app business. Generally,
    your friends, family, and peers will think they are experts in the industry. Most
    will even graciously help you with new ideas to guarantee you have a money-making
    concept.


    However, I’ve always found this enthusiasm distracting. Other people’s advice
    is usually based on fantasies of striking it rich, with minimal market research
    in the form of their girlfriends, their cousins, or their parole officer. I can’t
    tell you how many times I’ve heard people tell me, “That will make you so much
    money!” or, “I have the best app idea. You have to do it; you’re going to be rich!”


    While support from others can be encouraging, don’t let it cloud your judgment,
    or you will be sure to catch the empty pocket syndrome. Treat family and friends
    as who they are: consumers. Let them test your apps and give feedback as a user,
    especially if they are in your demographic. Don’t, however, take business advice
    from them if they haven’t proven themselves to be successful in this industry.


    Taking their advice is an easy trap to fall into because whenever people ask you
    “What do you do?” you’ll unintentionally invite lots of questions, advice, and
    suggestions since everyone is interested in this exciting industry. Everybody
    has their own million-dollar idea and will be sure to make you listen to it. Be
    discerning, stick to your game plan, and stay focused on your idea from concept
    to development. Allow yourself to be swayed in a new direction based on facts
    and objective data and not by one person’s subjective opinion.


    ## STOP HATIN’, START EMULATIN’


    Emulating competitors is one of the most fundamental concepts in business. When
    Apple launched the first `iPod` in 2001, MP3 players weren’t anything new. The
    first mainstream MP3 music player entered the market three years before the `iPod`
    came along. The `iPod` became a massive success because it was sleek, intuitive,
    and fun.


    The `iPhone` wasn’t the first smartphone, but Apple saw a need for more innovative
    features, and took smartphones to the next level as it did with MP3 players. With
    focus on the consumer and beautiful design, Apple made the `iPod` and `iPhone`
    the game-changing successes they are today.


    Facebook is notorious for recognizing something that works, making it better,
    and adapting it into its platform. Facebook offers integrated e-mail, newsfeeds,
    instant messaging, video chat, and apps. You can get each of these somewhere else,
    but they’re more fun or easier to use on Facebook.


    FIGURE 4.2 No need to reinvent the wheel.


    ![image](images/f063-01.jpg)


    The find-something-that-works-and-make-it-better philosophy has been around since
    the beginning of time. Thank God, because if that wasn’t the case, we might still
    be swinging from branches and picking our butts.

    '
