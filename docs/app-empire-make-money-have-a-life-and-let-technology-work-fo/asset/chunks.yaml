    # 5. 生活方式 (45,286 位活跃用户)


    这里是一些更令人震惊的数据：


    * Apple 在三年内应用下载量突破了 150 亿次——而 Apple 花了 7 年时间才通过 `iTunes` 售出 150 首歌。

    * 根据移动应用商店运营商 `GetJar` 委托的一项研究，移动应用市场到 2012 年将达到 175 亿美元。

    * Canalys 预测到 2015 年将增长 370 亿美元。Apple 报告称，自 `App Store` 开放以来，`iOS` 开发者总计创造了超过
    30 亿美元的收入。

    * Google 的 `Android` 市场是 Apple iPhone 的竞争平台和操作系统，在 2011 年年中应用数量已达到 25 万个，总下载量超过
    60 亿次。

    * 根据市场研究公司 `Asymco` 的数据，平均每售出一台 `iOS` 设备，就会被下载 60 多个应用。

    * 根据 `Asymco` 的数据，每天有超过 3000 万个应用被下载。

    * 根据 `Piper Jaffray` 研究公司的估计以及《华尔街日报》的报道，付费应用的平均售价将每年增长 14%。

    * 根据 `Asymco`，Apple 预计到 2014 年，在应用上赚的钱将超过音乐。


    ## 现在就利用这一现象


    当我刚开始时，我并不知道这些业务趋势。当我了解到那些没有该行业以往经验却能赚到钱并享受自由的创业者时，我感到非常兴奋。这对我来说是很有意义。我错过了互联网热潮，但我不想再错过这一波，于是我投入了进去。正因如此，我可以说这是我的时代，也可以是你的时代。


    现在是进入这个行业并利用这种绝佳机会的最佳时机。


    移动技术充满趣味、令人兴奋且充满可能性的。它不仅仅是虚拟现实。相反，对于任何持开放态度并致力于使其取得成功的人来说，它是商业现实。


    话虽如此，我将对应用业务额外说明一点重要的区别。人们认为，如果他们有一个应用主意，就能赢得应用彩票。应用业务并不是通过一个应用快速致富。它关乎研究、创意、时机和健全的商业逻辑，这包括创建几个产品而不仅仅是一个。


    ## 参与者


    应用运行在智能手机上，就像各种软件程序运行在电脑上一样。在智能手机中，你可以找到几种操作系统，被称为平台。这些平台在智能手机市场的主导地位上相互竞争。


    提供不同平台的三大参与者是 `Apple (iOS)`、`Google (Android)` 和 `RIM (BlackBerry)`。一些应用开发者为所有三个平台创建产品。另一些则专门负责一个。


    专注于为 Apple 平台创建应用是应用业务中赚钱最容易的方法，因为 Apple 主导了应用市场，而且为他们的设备创建应用更容易。Apple 设备都配有标准分辨率和兼容的硬件，且
    `iOS` 应用只有一个移动商店。相比之下，Google 的 `Android` 具有不同屏幕尺寸的手机和多个应用商店。这让开发者的生活变得更加困难和复杂。他们必须为每个
    `Android` 设备进行额外的编程。这很麻烦，而且会让你花费更多成本。当你不需要花时间将应用适配到所有不同的设备时，你就可以专注于创建更多、更成功的应用。


    消费者信任 Apple 的品牌，并且对 Apple 的 `iOS` 设备系列有很强的忠诚度。该公司以其直观和创新的产品而闻名，品牌随着其粉丝般的追随不断变得强大。


    所以，从最简单、最著名的平台开始。一旦你精通它并获得了更多信心，就移动到其他平台并精通它们。


    表 1.1 显示了应用市场中的平台。


    表 1.1 应用市场中的可用平台


    ![image](img/f010-01.jpg)


    尽管 Apple 是我的首选且领先行业，但更多的平台意味着更多的消费者在下载应用。新市场正在扩大，当你应用业务增长时，那里可能是肥沃土地。虽然为 Apple
    产品创建应用是最高效的起点，但只专注于一个平台而不检查其他平台的状况是非常重要的。要灵活，保持开放的心态。正如俗语说，生命中唯一不变的是变化，所以要领先一步并尽可能地预判。


    ## APPLE—IPHONE/IPAD/IPOD


    Apple 客户是狂热粉。他们会在严寒中在 Apple Store 外等上几个小时来购买他们的产品。


    你看到有人为其他平台的产品排队吗？绝不可能。他们没有同种类型的忠诚且疯狂的粉丝。你也可以为 `Android` 和 `BlackBerry` 创建应用。我在书中教你的几乎所有内容都能让你的应用大放异彩，无论你选择什么平台但我但我从
    Apple 开始，特别是如果你是新手的话。


    Alan Johansen 是另一个零编程经验的成功应用创业者。在两年时间里，作为一个独立创业者工作，他发布了 30 个应用，下载量超过了 1100 万次。


    Alan 见证了 `Apple App Store` 多年的演变，认为它还处于婴儿阶段。他说：“看到应用商店支持并奖励独立开发者令人目一新。看到他们推广独立作品（而不是只推广自己的作品）令人目一新。”


    ## GOOGLE 和 ANDROID


    `Android` 是市场上第二大的移动平台，适用于制造商制造的数百种设备。它是一个开源平台，允许制造商在无需任何费用的情况下适配并使用。这使 Android
    成为世界第一大操作系统。


    尽管 Apple 在 iPhone 上销售更多应用，但 Android 的手机更多。一年又一年，Android 在这些市场中获得了最大的增长，从 Apple
    的 `iOS` 和 RIM 的 BlackBerry 手中夺走了市场份额。


    但研究小组 `Kantar Worldpanel Comtech` 认为随着 iPhone 进入更多运营商，`iOS` 将取得新进展。无论如何，在 iOS
    应用上赚到钱后，你应该考虑 Android 作为创建应用的第二个平台。


    ## BlackBerry


    BlackBerry 的应用世界也在增长，速度稳定，每年增长 69%。然而，目前，BlackBerry 的 7.7 亿应用下载量与 Apple 的 180
    亿以及 Android 的 60 亿相比是小不足道的。


    ## 准备业务


    应用业务几乎没有开销。我没有办公室，没有设备，也没有员工。我只有一个 MacBook 和一个 iPhone。通过 iPhone 运行一切，甚至每天对外包人员的管理。我用我的应用互相广告，所以我几乎没有营销成本。


    还有什么业务能提供这种自由？很少，或者说没有可以在没有办公室的情况下从世界上任何地方运行的业务。你可能不想住在斐济的海滩小屋里、看世界七奇迹或与鲨鱼一起游泳，但我确定你可能想用你的额外时间做其他事情。


    要开始应用业务，你需要为你想要创建应用的平台注册成为开发者。不要被“开发者”这个词吓到。它并不意味着你必须是程序员。它只是用来发布应用的人的名称。（我们在第五章中讨论了外包应用编程工作。）你只需要设置一个
    `开发者账户`，这样你就可以在应用商店中出售你的应用了。


    以下是注册不同平台的链接以及每个平台要求的简要概述。


