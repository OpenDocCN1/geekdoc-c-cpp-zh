    # Screenshots


    Screenshots are great marketing tools because they give a snapshot of what users
    will experience using your app. Many people shopping for apps often don’t read
    the description but instead scroll down to the screenshots. The screenshots need
    to convey the main functionality of the app without showing too many details that
    may confuse users. If your screenshots are cluttered, it will be as ineffective
    as selling a house with messy rooms. The brain gets overwhelmed and buyers have
    more trouble seeing the product’s true value. Therefore, the screenshots you include
    should be clean, appealing, and informative so users are not overwhelmed yet are
    compelled to download the app.


    When I started out, I used screen captures of my apps to create basic screenshots.
    The capture was simple; most developers were doing this. While looking through
    the app store, I noticed some successful apps had more elaborate screenshots.
    They were adding banners that attracted the user’s attention and explained the
    benefits of the app. I tried these advanced screenshots for one of my apps and
    the results convinced me to create them for all of my apps.


    These days almost all top apps have advanced screenshots. Most developers have
    understood that their screenshots are a major tool to make an impression on users.
    This is another reason why you must work with a team that has a graphic designer.
    Your graphics guy will create the graphics in your app and your icon and will
    create killer screenshots that persuade the users to buy the app now.


    Also, be aware that the sequence of your screenshots is important. You can showcase
    a maximum of five images. Be sure your screenshots tell a story that compels users
    to click the download button (see [Figure 6.4](#Chapter06.html_figure6-4)).


    [FIGURE 6.4](#Chapter06.html_figureanchor6-4) Screenshots that tell a story.


    ![image](images/f110-01.jpg)


    ![image](images/f110-02.jpg)


    These are great examples of advanced graphics. Through the images, users quickly
    understand how the app works. Text banners further clarify each step, and as an
    added bonus, these advanced screenshots include the app’s graphics.


    ## Keywords


    Unlike your icon and title, keywords are not something the users get to see. When
    you submit your app on the `App Store`, you’re allowed to provide keywords relevant
    to your app. When users search for one of the terms you chose, your app appears
    in the search results.


    For example, if you type in the word “kids” or “game” on the `App Store`, you
    will find that Angry Birds is one of the search results. The terms `kids` and
    `game` are not in the app title, therefore, the makers of Angry Birds most likely
    chose those keywords to associate with their app. This makes perfect sense as
    Angry Birds appeals to a lot of kids and anybody searching with those terms will
    find the app.


    As you can see, keywords are important because your target demographic will use
    them to find your apps. Each word in your app title represents a keyword, so you
    don’t have to repeat them when you’re providing the keywords during app submission.


    The best way to determine keywords for your app is to think like users. What is
    your target audience searching for? Do not use keywords that are irrelevant because
    you can only provide a limited amount of keywords. When Apple introduced the keyword
    tool some time after the `App Store` opened, I added keywords I thought people
    would be searching for. For my app, `Fingerprint Security`, I used terms like
    “camera” and “video.” I thought that’s how the keyword tool worked and my rationale
    was that if people were searching for a camera app, they might see my app and
    get interested in it.


    I realized that app shopping is like any other kind of shopping. If you go in
    for batteries and walk past a toothbrush, you’re not likely to buy a toothbrush
    when all you need are batteries. So, the keywords must be relevant, or users will
    ignore your product even if it’s part of the search results.


    A good example of effective keyword usage is an app I created called `Flashlight`.
    Since the name is `Flashlight`, we came up with keywords, such as “bright,” “help,”
    “light,” and “camping.”


    When coming up with keywords, consider these three questions:


    1. What is the demographic?

    2. What are the users’ needs?

    3. What are they searching for?


    I don’t use any particular tools to brainstorm for keywords. I use common sense
    and think like an app user.


    ## Categories


    Most app stores organize apps into specific categories to help users find them
    more easily. Some of the categories in the `App Store` include `Games`, `Entertainment`,
    `Utilities`, `Books`, `Business`, `Education`, and so on. In addition to the top
    overall rankings of all apps, each category has its own top rankings and, therefore,
    generates a certain amount of visibility based on these charts. An app that doesn’t
    show up in the top 200 overall, might still be in the top 10 of a particular category.
    Users looking for certain apps often browse through these category charts without
    looking at the top overall charts.


    When you’re submitting your app for review, you have to select the category you
    would like your app to appear in. Make sure to select the most relevant category
    for your app. For example, an alarm clock app should be in the `Utilities` category
    rather than in the `Games` category. On the other hand, many apps could be classified
    into more than one category. You have to choose one but you can change the category
    during an update. Some categories are more competitive than others. Check out
    the categories of competing apps to see which category they seem to be popular
    in. This is usually a good indication of where you should place your app.


    # The Power of Free Apps


    Prepare the basic marketing elements mentioned above for all of your apps. After
    you take care of the basics, your greatest marketing tool will be free apps. They
    generate traffic and visibility that you otherwise wouldn’t get. Using free apps
    is the equivalent of having a brick and mortar retail business on Main Street
    as opposed to five miles of town.


    Free apps create the most traffic because they have the smallest barrier to entry.
    It takes five seconds to download, and it’s free. Why wouldn’t you push the button?
    More free apps are downloaded than paid apps. After all, if you can’t give away
    your app for free, how are you going get people to pay for it? Once the free version
    of your app gains some traction, you can use it to advertise the paid version.
    This is like getting those food samples at the supermarket. If you like the sample
    you tasted, you might buy the whole bag and become a long-term customer.


    In Chapter 9, I show you how to take that free traffic and convert it into dollars.
    Using the free apps as part of your marketing strategy will dramatically increase
    the likelihood of having a paid app.


    ## Course Correcting


    After you launch the free version of your app, you need to give it some time to
    generate interest. I give it about one to two weeks while I assess the incoming
    data and continue the market research. During that time, the `App Store` customers
    will vote with their downloads, and let you know whether your idea or marketing
    is working.


    Give the marketing basics your best shot for your app launch, but you will not
    always hit the bull’s eye with your first attempt. You must understand and accept
    this concept. Most developers make the mistake of ignoring these marketing basics.
    Of those developers who don’t make this mistake, many make another mistake, which
    is to think that they need to worry about the marketing only once. They create
    an icon they like, pick a title that excites them, and publish the app.


    When it doesn’t work out, they blame the app. “It was just not a good app” or
    “The market was not ready for it” are some of the excuses. This may be true, but
    their initial marketing angle may not have been the correct one even though the
    app was good.

