    *   `Apple iOS` ([http://developer.apple.com/programs/register/])—注册要求包括每年 99
    美元的费用并接受服务条款。

    *   `Android` ([http://developer.android.com/guide/index.html])—注册要求包括每年 25 美元的费用并接受服务条款。

    *   `BlackBerry` ([http://us.blackberry.com/developers/])—注册要求包括每发布 10 个应用需支付
    200 美元的费用。你必须与 BlackBerry 的创建者 `RIM` 签署 BlackBerry World 应用供应商协议以分发应用。


    # 未来趋势


    正如前面提到的，消费者热爱即时获得他们想要的东西的便利。人们喜欢在通话期间能看到心爱的人。短信正在超越电子邮件和语音邮件，因为它是一种简单且即时的沟通方式。App
    正契合这种移动的生活方式。


    随着手机价格的下降和越来越多的人购买智能手机，应用市场将扩张得更快。人们对实时信息的渴望和即时需求正像野火一样蔓延。


    移动生活方式将长期存在。所有的趋势都指向一种日益移动化的生活方式，这意味着为开发者提供了更多机会。


    # 前 10 大应用趋势


    透视应用行业的水晶球，研究公司 `Gartner`, `Inc.` 预测了以下前 10 大趋势：


    1.  **基于位置的服务**。更多的消费者将使用根据其当前地理位置提供更智能服务的 App。

    2.  **社交网络**。人们将花费更多时间在网上社交，使用支持如网络对话和照片分享等活动的 App。

    3.  **移动搜索**。人们将信息搜索与行动相结合，例如订购披萨或寻找网球店。

    4.  **移动商务**。消费者将使用手机购买更多产品。

    5.  **移动支付**。商店里的顾客将通过手机支付商品和服务费用。

    6.  **情感知服务**。App 将根据个人兴趣、历史、日程、喜爱的活动等定制服务，为消费者提供更具个性化的体验。

    7.  **物体识别**。App 将允许消费者识别周围环境，包括特定的感兴趣物体。这些 App 将依靠相机功能来实现这一点。

    8.  **移动即时通讯**。移动即时通讯系统将开始整合更多互动元素，如视频。此类应用服务可能会取代传统的电话使用。

    9.  **移动电子邮件**。更多人将通过手机手机发送和接收电子邮件。

    10. **移动视频**。手机将拥有更大的屏幕和更高的分辨率。同时，手机运营商将与视频服务（如 `YouTube` 和 `Vimeo`）合作，通过手机提供高清观看。


    # 打造金矿


    数据告诉你，应用行业是下一次淘金热。然而，你必须像对待生意一样对待它，而不是当作暴富计划。你的金矿需要坚实基础的支持：积极且专注的心态，以及理解市场和发展业务的技能。


    在下一章中，我将与你分享在应用业务中赚钱的获胜心态。这需要思维的转变和开放的心态，但回报将是丰厚的。你的心态是建立蓬勃业务和你想要生活的关键。


    ## 我学到了什么


    1.

    2.

    3.


    ## 需要采取的行动


    1. 在 `Apple iOS` 平台上注册成为开发者。


    # 第 2 章：先安装这个


    ## 应用万富翁心态


    在我的职业生涯中，我错过了超过 9,000 次投篮。我输了近 300 场比赛。26 次，我被信任投决定比赛的一球却投丢了。我的生命中失败了一次又一次。而这正是我成功的原因。


    ——迈克尔·乔丹


    在车祸之后，我在术后康复中度过了一多半。医生告诉我，我无法再次正常使用我的惯手了。


    什么？


    思绪如潮水般冲击我的脑海。


    不能再打篮球了吗？不能和我那些还没有的孩子玩棒球了吗？我甚至还没结婚。一个女人现在跟我在一起会什么感觉？我再也为她开门了。如果我无法支撑身体，我如何性生活？我不能开车了吗？我不能写字了吗？我是个男人。如果我不能使用手臂，我如何为我和家人过上完整的生活？我才
    27 岁！！！


    这些想法在脑海中尖叫，在无尽的黑暗洞穴中回响。尽管我有时会充满动力并下定证明医生是错的，但我内心是心碎且恐惧的。


    每天，我都要经历两个小时痛苦的物理治疗，试图重建左臂的肌肉，努力开发出某种活动范围。剧烈的疼痛在全身脉动，在每次课程后变成彻底完全的绝望。在每日的战斗之后，我会吸入止痛药，坐在宽大的
    `La-Z-Boy` 躺椅上痛苦地度过一天的剩余时间，感到挫败。


    在事故发生之前，我也有很多人一样的问题，比如：我的生活意味着什么？我接下来要做什么？之后，我也有其他问题：我该如何恢复手臂的功能？如果这还不够成为问题，我该如何赚足够的钱来支付我累积的
    10 万美元医疗单？


    疼痛是难以忍受的，由于我无法躺下，我无法睡眠。在这一点，我有五星期没有睡好觉，疲劳侵蚀着我的身心。我感到如此痛苦，甚至想要彻底放弃。


    那是我陷入了人生的最低点。一个下午，我独自一人，大脑陷入了一个黑暗的地方。我甚至不感激自己从那场惨祸中生存。我清醒着，泪水顺着脸流下。突然，我内心有什么东西在尖叫，就像机场里的扬音器一样。


    你不止于此！那个声音说。战斗吧，`Chad`。战斗吧！不要放弃。你仍然拥有想要的生活。你只需要相信并让它发生。


    我不确定那天发生了什么，或者那个声音从哪里来。称它为我的`创造者`，称它为我的理性，但那个声音对我影响如此巨大，以至于我知道没有选择。我必须听从，从那时起，在所有的黑暗中，我瞥到了我几乎完全放弃的生活的可能性，希望开始从缝隙中渗入。


    一切开始改变。第一次，我理解了信念和信仰的重要性和力量。我决定不再做我生活电影中的配角了。是时候成为编剧和制片人了。


    从那时起再也没有回头，你猜怎么着？我的生活电影是一部每天都在变得更好的史诗。


