    app on all the different devices. I ask my programmers to create a detailed feature
    checklist that I look over and improve if necessary. I test each feature until
    everything works as expected.


    Testing and debugging will take several iterations, like the design and development
    stages. This is all part of the process. Use the TestFlight app and service mentioned
    before to save lots of time with the mechanics of installing test versions of
    your app. At some point, you’ll be wrapping up changes and sending the app off
    to the iTunes store for distribution.


    It’s a good idea to have your programmers show you or someone on your team how
    to submit your first few apps. Don’t give out your online developer portal login
    information to your programmer or anybody else. The best way to do this is to
    use Skype or GoToMeeting and share your screen while they walk you through the
    process. As your business grows, you might want to delegate this work to someone
    on your team.


    And keep in mind, all of this is much easier than it sounds. Now that you understand
    the importance and process of creating a development team, it’s time to take things
    up a notch and have some fun. In the next chapter, we’re going to discuss your
    most important job, which is marketing your apps.


    What I Learned


    1.


    2.


    3.


    Actions to Take


    1\. Look for programmers.


    2\. Interview at least 10 and select the best three.


    3\. Create a thorough design for your app idea.


    4\. Get quotes from the three programmers you selected.


    5\. Choose one and test him.


    Chapter 6


    Sex App-eal


    Marketing Basics to Attract More Buyers


    Any man has a chance to sweep any woman off her feet. He just needs the right
    broom.


    —Hitch


    “Get a hold of yourself, Chad. Not cool. Come on, man, get it together.”


    My mind raced as I walked awkwardly through the noisy crowd. I was a freshman
    in college, attending the first party of the year for the 2003 class. Colored
    lights dotted the room, songs by Snoop Dog, and Jay-Z blasted overhead, while
    kegs of beer were flowing like Niagara Falls.


    The girls were wearing dresses and heels, and the guys looked as though they had
    walked out of a GQ magazine. I seemed to be the only one there who didn’t get
    the memo about the dress code. Though everyone else was dressed for a night on
    the town, I was wearing a T-shirt, jeans, and sandals with socks. My hair was
    disheveled and my untrimmed beard made me appear as if I had walked in from a
    campsite rather than a magazine spread.


    People were laughing and joking with each other. As I shuffled through the crowd,
    I tried to look confident. I threw out a smile, which somehow stayed stuck like
    I had been injected with Botox. I felt uncomfortable, self-conscious, and out
    of place.


    As I walked through the crowd, I could feel the eyes of the people I walked past
    staring at me. I nervously jetted to the nearest open spot and sat down.


    Suddenly, the most gorgeous girl I had ever seen walked by.


    She had luscious long brown hair, deep ocean-blue eyes, and a smile that could
    light up a small city. She was wearing a classy, long, black dress that perfectly
    fit her tall, athletic body. Excitement and anxiety swept over my body like a
    tsunami, reckless and uncontrollable.


    I felt compelled to stand up, walk to her, and say something.


    “Hi, uh,” I stammered. “This is a cool place.”


    “Yeah, it is,” she said as she sized me up by glancing at my evening attire. I
    could tell she had made up her mind. I had lost her at hello and since I had used
    all my oxygen on those five words, I had nothing left to say. I gave her a nervous
    smile and turned away. She disappeared.


    I felt like a complete loser, empty and rejected. I realized I didn’t know the
    first thing about making myself attractive to the opposite sex. It didn’t matter
    who I was or what I had to offer because the outside wrapping didn’t match what
    was inside.


    In other words, I was clueless how to market myself. I was sure I had a great
    product, but I didn’t know how to package it. I didn’t know how to attract interest.


    After a while, I decided to leave the party. As I was making my way to the door,
    I heard laughter coming from another room. I looked to see what was going on.


    A group of beautiful women were intently listening to one guy telling a funny
    story. He was dressed in a sports coat and designer jeans that said “expensive.”
    His hair was perfect, and his posture commanded attention. Every move he made
    exuded confidence.


    He must have been saying all the right things because the girls were laughing,
    and I saw more people gathering around, leaning in to hear what he was saying.


    How did he do it?


    I knew the answer to my question. People were drawn to him because he looked great
    and said the right things. He was confident and owned the room. His name was Monaco.


    As I made my way home, I decided I would learn from him, so I could light up a
    room when I walked in. I befriended Monaco, who later taught me how he was able
    to draw people in and entertain them. After that, my social life changed.


    I was still the same guy who had cluelessly walked into that first party, but
    I had learned how to present myself to get a new result. The lesson translated
    well in business. At a fundamental level, that’s how all marketing works. You
    want to create an experience that intrigues people from the beginning, so they
    feel confident with their decision to invest their time.


    The app stores are filled with thousands of great apps, but most developers are
    not skilled enough in marketing. Meanwhile, many poorly designed apps rank highly
    because their developers have figured out the marketing game.'
