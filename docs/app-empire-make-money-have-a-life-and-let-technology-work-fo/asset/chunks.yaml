    Free apps can be fully functional, but they often are lite versions of their full-featured
    counterparts. The “try it before you buy it” strategy is an old business concept,
    and most developers offer free, versions of their apps that have fewer features
    to upsell to their pro versions.


    We’ve discussed the importance of free apps previously but we need to mention
    them again because they will be the bread and butter of your monetization strategy.
    Free apps serve many purposes. They are the main source of traffic for your app
    network, they are your main cross-promotion tool (using nag screens and promo
    pages), and they can be easily and lucratively monetized using banner advertising,
    affiliate marking, and translations.


    ## Premium Model

    The premium model includes all paid apps on the App Store and you make money when
    a user purchases your app. In contrast to free apps, consumers must buy before
    they try. This can be a deterrent, which is why it is a good idea to simultaneously
    offer ad-supported lite versions of your paid app. The initial sale is not the
    only way to monetize premium apps. You can monetize them more with affiliate marketing,
    in-app purchases, and translations. You have to have paid apps because you’re
    going to want to direct a lot of your app network traffic toward them.


    ## Freemium Model

    The freemium model is a hybrid of the free and premium model. These free apps
    have optional paid content (in-app purchases). The idea is, like with free apps,
    the users can try before they buy. But unlike free apps, instead of sending the
    user back to the app store to review and buy a paid app, freemium apps have the
    premium content included in the app, which can be unlocked and used with an in-app
    purchase. This is powerful because a freemium app provides the traffic-generation
    power of free apps with the sales benefit of premium apps. Essentially, they allow
    you to have your cake and eat it, too.


    ## Banner Advertising

    As the number of customers with smart phones increases, more advertisers are switching
    to mobile advertising to reach their target audiences ([Figure 9.1](#Chapter09.html_figure9-1)).
    As intermediaries, mobile ad networks handle the sales and placement of mobile
    ads. Advertisers can buy ad space from the ad networks and developers can use
    their apps to display the ads. The advertisers benefit from the sales that result
    from their ads, and you, the developer, earn revenue from the ads. The ad networks
    keep 40 percent, and the developers receive 60 percent of the proceeds from advertising
    revenue generated from this process.


    [FIGURE 9.1](#Chapter09.html_figureanchor9-1) Example of banner advertising.


    ![image](images/f154-01.jpg)


    If you have a smartphone, you probably have seen ads on the top or bottom of your
    screen inside of an app before. The developers of those apps are making money
    every time one of those ads is displayed or clicked on. You should take banner
    ads seriously as they can be a major income source.


    For example, a top-10 free app can make at least $500 a day from displaying banner
    ads alone. Granted, not all of your apps will be in the top ten, but even if you’re
    generating $50 a day per app with only three apps, you’ll be making some serious
    cash with ads. That’s around $150 a day or $4,500 a month or $54,000 a year. It’s
    a good deal for only having to dedicate a small space in your app for ads and
    not having to do any more work.


    The terms used in banner advertising can seem like a big bowl of alphabet soup
    at first. Let’s take a look at some of the most common ones. You don’t have to
    know these to make money with ads but they can help later when you’re maximizing
    your banner ad gains.


    *   **Impressions**: Whenever one of your apps displays an ad to users, you have
    “served” one ad impression. Impressions are usually low revenue generators because
    it’s unclear if the users saw the ad or paid attention to it. This is more of
    a shotgun approach where advertisers pay for lots of impressions and hope the
    ads will catch some of the users’ attention.

    *   **Clicks**: a click occurs every time users click (or touch) an ad. Advertisers
    are willing to pay a premium for receiving clicks since that means consumers are
    showing genuine interest in the ad.

    *   **Fill Rate**: Advertising networks are not always able to supply developers
    with ads. Your fill rate is essentially the percentage of times your app received
    an ad when it made a request to the ad network server. The optimal fill rate is
    100 percent.

    *   **CPM or cost-per-mille (thousand)**: the price that advertisers pay ad networks
    in exchange for 1,000 ad impressions.

    *   **CPC or cost-per-click**: the price that advertisers pay ad networks in exchange
    for consumers clicking their ad.

    *   **CTR or click-through-rate**: the number of times consumers click ads relative
    to the number of times they see it (impressions).

    *   **eCPM or effective cost-per-mille**: the revenue your application generates
    per 1,000 ad impressions, calculated by the following formula: `[total earnings
    / impressions] × 1000`.

    *   **eCPC or effective cost-per-click**: the same as eCPM. Instead of impressions,
    this measures clicks. Given that clicks generate more revenue than impressions,
    eCPC will be higher than eCPM.


    Some of the top advertising networks that allow you to place ads in your apps
    are Apple’s `iAd`, Google’s `AdMob`, and Millennial Media. Many others exist,
    but these three are good ones to start with.


    So, which one should you use? Use all of them because that will allow you to maximize
    your fill rate. As mentioned above, ad networks don’t always serve an ad when
    your app requests one. This means you’re missing out on income when you’re working
    only with one. But what if you could request ads from multiple networks, switching
    from one to the other anytime your request does not result in an ad? That could
    guarantee 100 percent fill rate and, therefore, maximize your ad income.


    Each of these platforms is designed to be used separately. If you wanted to use
    them all, your programmer would have to interface with each one and create the
    logic that would alternate between. You could do this, but that’s extra programming.


    ## How to use multiple networks

    Use AdWhirl.


    AdWhirl ([appempire.com/adwhirl](http://appempire.com/adwhirl)) is a service (owned
    by Google) that allows you to integrate more than one ad network into your apps
    and seamlessly handles the distribution of your ad requests. Whenever one of your
    apps does not get an ad when it asks for it, `AdWhirl` redirects that request
    to another ad network based on your preferences. Once you link three or four ad
    networks to your `AdWhirl` account, you will have 100 percent fill rates consistently
    without doing any additional work.


    I was initially only using iAds, but my apps were getting 10–50 percent fill rates.
    After I found out about `AdWhirl` and had it implemented in all my apps, my ad
    network revenue tripled. I could have done this sooner, but I didn’t know about
    it. That’s where your developer networks and masterminds will come in handy. They
    will help you discover techniques like these much faster.


    `AdWhirl` is useful because you have full control over everything. You can assign
    ad request percentages to the ad networks. (See [Figure 9.2](#Chapter09.html_figure9-2).)
    You might want 50 percent of your request to go to `iAd`, 25 percent to `AdMob`,
    and the remaining 25 percent to Millennial Media. Or you can evenly distribute
    your requests among all of them. You choose.


    [FIGURE 9.2](#Chapter09.html_figureanchor9-2) Distributing ad traffic on AdWhirl.


    ![image](images/f157-01.jpg)

