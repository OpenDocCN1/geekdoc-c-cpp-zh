    # 第 9 章

    # 见钱！


    ## App App 变现


    金钱买不到幸福，贫困也买不到。

    —Leo Rosten


    当我还是个孩子时候，我很快意识到，我比每周通过铺床得到的那些微薄零花钱需要更多的钱。像大多数 10 岁的孩子一样，我想买棒球卡片，还有我在杂志上看到的一辆酷炫闪闪的红自行车。


    暑假开始了，由于我的表弟也有类似的志向，我们决定在人行道上摆个摊位卖柠檬水，希望能赚点钱。我们是两个可爱的小孩子，每杯柠檬水卖 1 美元，我们本以为自己会立即大红。


    令我们惊讶的是，我们并没有赚到多少钱。搭建摊位和制作所有饮料实际上是一项非常辛苦的工作。我们下定决心，坚持了几个周，才意识到必须有更好的方法。如果我们想要买到那些了不起的自行车，我们需要做一些改变，而且要快。


    首先，我们尝试每杯收 2 美元，认为这样能赚到更多钱；结果实际上让我们赚的钱更少了，因为买的人少了。接着，我们改变了卖柠檬水的时间，认为在下午五点左右，人们下班的时候，会有最多的买家。这一举措确实增加了路过人数，我们开始卖出更多柠檬水。遗憾的是，我们仍然面临同样的问题。卖柠檬水并没有为我们赚到预想中的那么多钱，因为人们花了
    1 美元就走了。进展太慢了，我们感到很沮气且完全挫败。我们到底哪里做错了？难道我们其实并不那么可爱吗？


    在我们短暂的柠檬水创业者生涯即将结束的那一天，我们产生了一个灵感（aha moment）。我们意识到，大多数客户是在去超市买晚饭食材之前顺路路过的。


    这给了我们一个主意。我们很擅长吸引人流，但似乎无法让这些路过的人花很多钱。光靠卖柠檬水无法赚到买那些自行车的钱。如果我们能卖给他们一些本要在超市买的食物，我们就能更快地挣钱。


    幸运的是，我的家里有一个大花园，蔬菜比我们能吃的还多。我们只需要把它们摘下来。太棒了。我们立即改变了计划，提供免费柠檬水来吸引更多客户，以便向他们售卖我们花园里的农产品。效果非常完美。人们停下来，拿了免费柠檬水，然后买了蔬菜。这太棒了，每个人都很开心，让我告诉你，我整个夏天骑着那辆自行车，简直极了快乐。

