    When you push out an update, a portion of your users will download this new version
    of your app. Based on your user base, the number of people downloading your update
    could surpass your regular daily traffic. I’ve seen many updates that increased
    my daily traffic by 5 to 10 times. So, if you have 10,000 downloads per day, your
    update could add 50,000 to 100,000 additional downloads that day. These will not
    count for your ranking and not every user opens up your app after an update, but
    your daily traffic can double even if a small percentage of users decides to check
    out your update. This will cause a spike in your income and remind the users about
    your app.


    Update frequently for any reason you can think of. Don’t wait to for your programmer
    to add 10 features to submit and update. It’s better to submit 10 updates, one
    for each feature as you build them out. Your users won’t mind and will get the
    impression you are constantly improving your app. I consider updates free advertising
    because you capture a percentage of the users who download the update to see what
    features have been added.


    So, keep in mind: Updates = Dollars.


    ### PAID TRAFFIC


    Another advanced strategy you can use is to pay for traffic to grow your app network
    quickly. A few companies have specialized in getting massive amounts of traffic
    for your apps. Some of the big names are FreeAppADay ([[appempire.com/freeappaday](http://appempire.com/freeappaday))
    and TapJoy ([appempire.com/tapjoy](http://appempire.com/tapjoy)). FreeAppADay
    will promote your app to its large user database if you offer your paid app free
    for a limited time. You pay a fee to the company for the traffic it sends you.
    I used it to promote my Alarm Security app, which had been ranked number 180 in
    the utilities category and was getting about 1,000 downloads a day. I spent $2,500
    to get the FreeAppADay traffic. The app shot up in the rankings to number 17 overall,
    increasing the traffic to about 40,000 a day. This helped me to grow my app network
    and increase my overall income. As the app world grows, look for more and more
    of these companies to pop up. Only use this strategy if it makes economic sense,
    but exhaust all of the free tactics first.


    Now that you have learned how to build your app network, let’s find out how to
    squeeze the most amount of dollars from it in the next chapter.


    ### What I Learned


    1.

    2.

    3.


    ### Actions to Take


    1. Add nag screens to your app.

    2. Add more buttons and promo pages to cross-promote your apps.

    3. Add push notifications to your apps.

    4. Network with other app developers on a regular basis.

    5. Update your apps on a regular basis.

    6. Consider paid options to grow your app network.


    # Chapter 9

    # Show Me the Money!


    ## Monetizing Your Apps


    Money can’t buy happiness but neither can poverty.

    —Leo Rosten


    When I was a kid, I realized pretty quickly that I needed more money than the
    small allowance I was getting every week for making my bed. Like most 10-year-olds,
    I wanted to buy things like baseball cards and an awesome shiny red bike I had
    seen in a magazine.


    School was out for the summer and since my cousin had similar aspirations as me,
    we decided to sell lemonade from a stand on the sidewalk with hopes of making
    some money. We were two cute little kids selling lemonade for a dollar a cup and
    we thought that we were going to be an instant hit.


    To our surprise, we didn’t make that much money. Setting up the stand and making
    all those drinks ended up being a lot of work. We were determined and we kept
    at it for a few weeks before we realized there had to be a better way. If we were
    ever going to get those amazing bikes, we needed to make some changes, and make
    them quickly.


    First, we tried charging two dollars per cup thinking that would make us more
    money; that actually made us less money because fewer people were buying. Next,
    we changed the time of day when we were selling the lemonade, figuring that we’d
    get the most amount of buyers around five o’clock when people were getting off
    work. This move did increase the number of people stopping by, and we started
    to sell more lemonade. Unfortunately, we still had the same problem. Selling cups
    of lemonade was not making us nearly as much money as we had anticipated because
    people were spending $1 and leaving. Things were moving too slowly, and we felt
    deflated and completely frustrated. What were we doing wrong? Were we not that
    cute after all?


    On the day our short-lived careers as lemonade entrepreneurs were about to end,
    we had an aha moment. We realized that most of our customers were stopping by
    before they headed to the grocery store to pick up food for dinner.


    This gave us an idea. We were doing well drawing people in but it seemed that
    we were not able to get the people who were stopping by to spend much money. Selling
    lemonade alone wasn’t going to make us enough money to buy those bikes. If we
    could sell them some of the food they were going to buy at the grocery store,
    we could make money faster.


    Luckily, my family had a big garden with more veggies than we could eat. All we
    needed to do was to pick them. Bingo. We immediately changed our game plan and
    offered free lemonade to attract more customers so we could sell them the produce
    from our garden. It worked perfectly. People stopped by, grabbed some free lemonade,
    and bought veggies. It was great, everyone was happy, and let me tell you, I had
    a blast riding that bike all summer long.

