    ## About the Author


    ![image/f197-01.jpg]( Over the past decade, Chad Mureta’s professional and personal
    lives have impacted each other in profound and unexpected ways. In 2009, a devastating
    car accident confined him to a hospital bed, where Chad discovered the possibilities
    of the emerging app market while experimenting with his iPhone. During that time,
    Chad realized that his real estate business was not only consuming his life, it
    was also in no way connected to what he was passionate about.


    Without any tech experience, he developed an idea for a mobile application called
    `Fingerprint Security Pro`, that would go on be a best-seller in the App Store
    and serve as the catalyst for a new company, career, and way of life. Now almost
    three years later, he has spearheaded the development and marketing of 46 apps,
    which have been downloaded over 35 million times.


    While Chad loves the exciting nature of the app business, it’s his true passion
    for living a life free from the 9-to-5 grind that propels him as an appreneur.
    By letting technology work for him, Chad has been living his bucket list: traveling
    the world, learning salsa, becoming a certified scuba diver and skydiver, and
    his list continues to grow every year. Chad uses the app business as a means to
    work less and truly “have a life.”


    As an author, speaker, consultant, and entrepreneur, Chad Mureta’s unique insight,
    experience, and tenacity have enabled him to make his businesses thrive, all while
    living the life of his dreams and traveling the world.


    Follow the author at `chadmureta.com`.


