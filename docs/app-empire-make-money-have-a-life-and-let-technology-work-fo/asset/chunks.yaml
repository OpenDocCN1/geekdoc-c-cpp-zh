- fmt: "\nAt the events and parties I go to, I hear people’s doubts about this business.\
    \ I don’t blame them. I was there once and had to go through my own journey to\
    \ get through my limiting beliefs.\n\nHere are some of the most common fears I\
    \ hear from people:\n\n* “I’ve never done this before . . . I don’t have the experience\
    \ . . . I don’t have the background.”\n\n  I was in that same spot. But I found\
    \ successful people to learn from.\n\n  If you want to achieve success, all you\
    \ need to do is find a way to model those who have succeeded. Find someone to\
    \ model as soon as possible.\n\n  Start small and learn over time. You may make\
    \ some mistakes, but you will develop more confidence and knowledge. Before you\
    \ know it, others will model you.\n\n* “It’s difficult . . . I don’t understand\
    \ it . . . I’m not smart enough.”\n\n  Anyone can do this business, even if you\
    \ don’t understand it. Like anything in life, you have to start somewhere. This\
    \ is one of the easiest businesses to get into, because the market is telling\
    \ you what to do. All you have to do is to listen.\n\n  This business is about\
    \ looking at the market, understanding it, and giving users what you think they\
    \ want. You may not hit home runs your first time at bat, but you have to keep\
    \ getting up to swing throughout the whole game.\n\n* “I’m not a computer person,”\
    \ “I’m not a developer,” “I’m not a coder.”\n\n  Neither am I. I don’t know how\
    \ to program anything and don’t want to. You can get into the app business regardless\
    \ of your computer skills. If you can draw an app idea and convey the concept\
    \ to programmers or designers, then they can do the work for you. Even if you\
    \ know how to code, I recommend hiring others to do most of it so you can focus\
    \ more on running and building the business.\n\n  Two of my appreneur friends\
    \ had software engineering degrees when they started creating apps. They soon\
    \ realized they had to outsource to other programmers, so they could be appreneurs.\n\
    \n* “It costs a lot of money . . . I don’t have money to waste . . . I don’t have\
    \ money to set up an app business.”\n\n  You don’t need a lot of money to start.\
    \ It costs anywhere from $500 to $5,000 to develop simple apps. As soon as you\
    \ launch your app, depending on your sales, you could see money hit your bank\
    \ account within two months.\n\n  I got started by being in a crazy amount of\
    \ debt, borrowing money from my stepfather for a Hail Mary shot. I didn’t have\
    \ any employees and outsourced all the work.\n\n  In this business, the barrier\
    \ to entry is ridiculously low. You don’t need a degree. You don’t have to get\
    \ a license like a stockbroker. You don’t have to invest $60,000 or more for a\
    \ four-year education. You don’t have to pay $50,000 for a franchise license.\
    \ You don’t need many employees, lots of equipment, overhead, or commercial space.\n\
    \n  Even if you mess up, the loss is relatively small. If you keep going, and\
    \ learn from your mistakes, you will have an opportunity to make a lot of money.\n\
    \n* “I’m not a businessperson . . . I don’t know how to be an entrepreneur.”\n\
    \n  You don’t have to be. And this is much easier to do than most other kinds\
    \ of businesses.\n\n  Apple does the distribution so you can spend your time on\
    \ marketing. If you can keep testing the market and course correct based on data,\
    \ you can run a successful app business.\n\n* “I don’t have enough time . . .\
    \ I’ve got a full-time job . . . I don’t have enough time to learn this.”\n\n\
    \  This business is about getting your time and life back. Even if you’re making\
    \ $100,000 a year at your full-time job, is it worth it if you never see your\
    \ kids or spouse or don’t have a fulfilling life?\n\n  The beauty with this business\
    \ is that you have the option to start part-time, and as you learn more and gain\
    \ more confidence, you can take bigger steps.\n\n  When you quit your job because\
    \ you doubled your income, you’ll have more time than you know what to do with,\
    \ and that’s what this business gives you. Time and freedom to do what you want,\
    \ when you want, and with whom you want.\n\n* “I’ve lost my confidence . . . I’ve\
    \ been down since I lost my job . . . The recession has been hard on me.”\n\n\
    \  When I was a kid, I used to play football in my neighborhood with a guy called\
    \ Smalls. We used to pick on him. He was probably 110 pounds soaking wet, but\
    \ you could hit this guy and he would hardly ever go down. If he did, he would\
    \ pop right back up as if nothing had happened. It didn’t make any sense because\
    \ everyone was bigger and stronger than he was. How the heck did he take such\
    \ big hits and remain on his feet? So, one day at the lunchroom in school, I walked\
    \ up to him:\n\n  “Smalls, how do you stay on your feet when you get hit so hard\
    \ on the football field?” I asked. “You are so small. What’s your secret?”\n\n\
    \  “Do you really wanna know?”\n\n  “Yeah, I really wanna know.”\n\n  “I keep\
    \ moving,” he said.\n\n  “What?”\n\n  “Watch my feet when I get hit,” he said.\
    \ “I never stop. Yeah, I never stop.”\n\n  My reaction was that what he said was\
    \ stupid, but after thinking about it, I saw the deeper meaning. It made sense.\
    \ We can be our biggest enemy or our greatest hero, but ultimately, we have the\
    \ freedom to choose and decide what we are going to focus on. \n\n  If my truck\
    \ had not flipped over, I would have had the leverage I needed for change. Most\
    \ times we are closer to staying our feet than we think. Pain can be our best\
    \ gift and biggest weapon to succeed as long as we convince ourselves that way.\n\
    \n* “Only a few people make money in this business. . . . The big players are\
    \ hard to compete against. . . . It’s too hard to make money because every idea\
    \ is taken.”\n\n  The big players are like you. This industry is in infancy, and\
    \ anyone can make an app as well as they can. They might have big marketing dollars,\
    \ but you can still market your app with no to little money as you’ll see later\
    \ on the book.\n\n  What makes the app business unique is that the big players\
    \ are on the same field as everyone else. They have the same questions and challenges\
    \ as you and I will.\n\n  The industry is just getting started. As I said before,\
    \ it’s like the Internet when e-commerce began. You have the opportunity to grow\
    \ with the industry. You don’t have to come up with new ideas. If you improve\
    \ on existing app ideas, you can make money.\n\n* “I’m in for the gold rush. .\
    \ . . I can make a lot of money without working.”\n\n  Many people are joining\
    \ the app gold rush with a get-rich-quick mentality and unrealistic expectations.\
    \ Don’t let this be you. This book gives you the tools to think like a business\
    \ owner with a map to find the gold. You have to work, but you won’t have to struggle\
    \ and let life pass you by in the process.\n\n  This is not a one-time app lottery,\
    \ and you can’t treat it as such. We all want instant gratification, but if you\
    \ think of this as a long-term business, it will grow and be a sustainable source\
    \ of income.\n\n* “Just because someone else was successful, it doesn’t mean I\
    \ will be.”\n\n  That’s right. The most important thing in this business is your\
    \ mindset. We can be our biggest enemy or our greatest hero, but ultimately, we\
    \ have the freedom to choose and decide what we are going to focus on.\n\n# CREATE\
    \ A GOLDEN MINDSET\n"
