    ### Accept This As My Gift To You


    Dear Apprenuer,


    You’re one step closer to your goals and to creating a lifestyle of absolute freedom.
    Since you’ve come this far, I know you’re serious about creating your own App
    Empire and will take action immediately.


    As with any new journey, there may be road blocks or unexpected setbacks. But
    don’t worry. The book you hold in your hands, `App Empire`, is actually just a
    small part of a much bigger multimedia program which you can access right now
    absolutely free.


    Enjoy your free multimedia experience at `www.AppEmpire.com/bonus`!


    —Chad

