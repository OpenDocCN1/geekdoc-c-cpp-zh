  raw: 'No matter what your dream lifestyle is, you can have it as an appreneur. You
    don’t have to be versed in computer programming to do this.


    When I started, I didn’t have a clue about programming languages or how to write
    code. I still don’t, but I was motivated to succeed at this business.


    Due to my unique circumstances at the time, failing wasn’t an option.


    STARTING FROM A HOSPITAL BED


    When you are on your deathbed, will you be able to say you lived a fulfilled life?


    I nearly couldn’t.


    I started this business from a hospital bed, wondering if I even wanted to live.
    I had survived a terrible car accident that shattered my left arm. I had gone
    through two groundbreaking operations, and spent 18 months in painful rehabilitation.


    With limited insurance, I had racked up $100,000 in medical bills. Even though
    I survived, I had no clue how to get out of the deep hole I felt trapped in.


    Up until that point, I had worked for and started several companies and ultimately
    failed because I had burned myself out. My last business was a real estate franchise
    I started right before the real estate bubble burst.


    Yes, my timing was exquisite.


    Even as my own boss, I was tired of working 18-hour days without freedom. I wasn’t
    an employee. I was a slave to my own business with all the pressure and responsibility.
    So, it was much worse.


    The doctors put my arm back together with a titanium rod holding things in place
    from my elbow to my shoulder. It was an agonizingly painful ordeal but a huge
    wake-up call that I realize I was lucky enough to receive. After that, I made
    the decision that my old way of going through the motions of life would not do
    anymore. I had to find a way to live a life I could look back on without regret.


    After my accident, I was moved to a physical rehabilitation center and worked
    on reconstructing my body, my mind, and ultimately my life. While rehabilitating,
    the books of thought pioneers like Anthony Robbins, author of Unlimited Power,
    strengthened my mind, and Timothy Ferris, author of The 4-Hour Workweek, inspired
    me with the idea of lifestyle freedom.


    During that time, my good friend and future business partner, Tayfun, gave me
    an article about appreneurs and told me I should get into the business. I learned
    that most appreneurs were one- or two-person teams, with low costs, and the successful
    ones were bringing in millions in profits. Still in my hospital bed, I drew app
    ideas while taking intense pain medication.


    Three weeks after my last surgery, desperate, broke, and grasping at straws, I
    borrowed $1,800 from my stepdad and jumped with both feet into the app business.
    The result?


    In just over two years, I created and sold three app companies and made millions.
    Two months after launching my company, one of my apps averaged $30,000 a month
    cash flow. Later, the company’s income reached $120,000 in one month. In all,
    I’ve developed more than 40 apps and have had more than 35 million app downloads
    across the globe. Over 90 percent of my apps were successful and have made money.


    To this day, I still don’t know how to upload or update apps. I outsource that
    work to programmers and let Apple do the distribution. I focus on monitoring trends
    and doing creative work while leading my company. Although I concentrate on Apple’s
    iPhone apps in my business, most concepts I show you can be applied to other platforms,
    including Google Android and BlackBerry.


    Every morning when I wake up, I lie in bed for an hour, viewing reports on my
    iPhone. After that, I go for a run and eat breakfast, I take another hour to outsource
    tasks, and I spend the rest of the day living an incredible life.


    GAME PLAN


    My success came from having a game plan.


    Even though I work a few hours a day, I want to build an empire that will last
    for years to come. To do that, I developed core areas of my business I can monitor
    daily, weekly, and monthly. I call this core the seven pillars of an app business.
    Understanding these pillars will turn your business from a one-time lottery winner
    to an unlimited gold mine.


    The chapters in this book are set up in a modular fashion, so if you need marketing
    ideas, reread the marketing chapter and so on. The ideas I share will help at
    every stage of growth, from launch to expansion. Sure, you can find answers to
    specific questions, but I suggest learning the overall game plan first because
    this will bring you long-term riches.


    Each chapter ends with actions for you to take. You can use these while building
    your business to ensure you stay on track every step of the way. You can also
    find additional helpful resources at [www.AppEmpire.com/resources](http://www.AppEmpire.com/resources).


    THE REAL QUESTION


    Why wouldn’t you get into the app space now? Mobile technology isn’t going away,
    and the industry is exploding worldwide. Look around and see how many people use
    their mobile phones to find a restaurant, text friends, or update their status
    on Facebook. This hot industry is only getting started. It’s the perfect time
    to jump into the mobile game.


    You can run your own app business because you don’t need a lot of money, skill,
    or knowledge to begin. All you need is a mobile phone and a desire to succeed.
    This industry allows you the freedom to work from anywhere and to earn a paycheck
    to support it. Plus, the best part, is it’s fun.


    In this book, I give you the roadmap to riches in the app business. Whether you
    are a total novice or an experienced developer, I guide you in building a business
    that supports the lifestyle you want while growing your bank account year after
    year.


    I’ll share with you how to:


    *   Tune your mind for success.


    *   Make insane amounts of money, while working part-time.


    *   Outsource nearly everything, so you can enjoy your lifestyle.


    *   Work with people who can do the technology side of things, so you don’t have
    to.


    *   Make your product crazy attractive, so people love to give you money.


    *   Partner with others who can double and triple your profits.


    *   Create a sustainable app business.


    *   Live life on your terms.


    This is a time in history when technology has given us the tools to live as we
    want. All you need is the desire and a game plan. No matter your background, gender,
    race, education, or situation, you can build an app empire, while you are living
    the life you deserve.


    You don’t have to wait till someday to fulfill your dreams. You can start today.


    Chapter 1


    The Treasure in Your Hand


    Why Mobile Apps Can Make You Rich


    Change is the law of life. And those who look only to the past or present are
    certain to miss the future.


    —John F. Kennedy


    After I sold my first app business, on a whim, I packed my bags, went to the airport,
    and jumped on the next plane that was leaving. I’m glad I brought a pillow because
    I ended up in Sydney, Australia. With time to spare and no set plans, I decided
    to hang out Down Under for the next five weeks and experience the place I had
    always dreamed of visiting.


    The harbor in Sydney is stunningly beautiful—filled with the white sails of sailboats,
    deep blue water, clear sky, and a buzz of great people. The sound of gulls fills
    the air, and brightly colored street markets and vendors line the shore.


    Walking along the harbor with the sun on my face, I remembered that during my
    spontaneous moment I hadn’t told anyone where I was going. I wanted to surprise
    my mom by sharing this experience with her, so I called her using the Skype app
    on my iPhone. The video phone call showed my face with the harbor in the background.


    “Where are you?” she asked, not recognizing the backdrop.


    “Sydney,” I said.


    She had a perplexed look on her face and paused for about 20 seconds in silence.


    “Australia?”


    It blew her away. It blew me away that she was able to see the view and enjoy
    it with me. It was amazing to be able to share that moment, and it was even more
    special because that wouldn’t have been possible a year earlier.'
