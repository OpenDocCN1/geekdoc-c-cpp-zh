- fmt: "\nOnce you move away from the old-school mindset of having employees under\
    \ one roof, you will feel comfortable managing your team from anywhere, even far-flung\
    \ places, like Fiji or Chile. Online project management sites like `Basecamp`\
    \ ([appempire.com/basecamphq](http://appempire.com/basecamphq)) will help you\
    \ coordinate with all members of your team. Everyone can be working on the same\
    \ project from multiple locations around the world.\n\nYour programmer and technical\
    \ assistant need not meet in person. Online tools like `Skype` and `Basecamp`\
    \ allow you and members of your team to communicate and coordinate any time to\
    \ get the task done.\n\nI manage all my employees from my `iPhone`. With the `Basecamp`\
    \ app, I can see what my team members are doing, and how far along they are for\
    \ any given projects. I can communicate what needs to be done and let them handle\
    \ their work while I am planning my next adventure.\n\n# OUTSOURING YOUR LIFE\n\
    \nWhile you’re optimizing and automating your business, don’t forget to do the\
    \ same with your personal life. We do many things on a daily basis that we could\
    \ outsource. Once you get to a certain level, it will make little sense for you\
    \ to handle things like booking your hotels and flights, answering calls, and\
    \ buying groceries. Many people think they have to be rich to have a personal\
    \ assistant, but this is false. You can free much of your time without spending\
    \ much money.\n\nImagine having somebody who helps you out 20 hours a week for\
    \ $15 per hour. That’s $300 a week or $1,200 a month, which will buy you an extra\
    \ 80 hours a month. You can use that extra time to spend time with you family,\
    \ go on a new adventure, or execute a plan to double your income.\n\nI wanted\
    \ to free up more time and take my lifestyle to the next level. So, I hired `Kate`,\
    \ or `Super Kate`, as I call her. She used to be a personal assistant for A-List\
    \ Hollywood actors and actresses. Now I have someone to answer calls, check my\
    \ mail, set up my transportation, find the physical therapists I need for my arm,\
    \ and so on. `Super Kate` allows me to spend more time in the zone, doing the\
    \ things that I want to do. I am more productive, happier, and more fulfilled.\n\
    \nIf it’s time to take your lifestyle to the next level and, if you have the money,\
    \ hire yourself a `Super Kate`. Even if you get somebody for a few hours a week,\
    \ do it. You will be happy you did.\n\n# THE SEVEN PILLARS OF AN APP BUSINESS\n\
    \nYou can outsource almost everything in your business besides the businessowner\
    \ role. You will always need to maintain a bird’s-eye view of your business at\
    \ every stage of growth. Even though others might steer at times, you have only\
    \ one captain per ship and your responsibility is to plot the course and ensure\
    \ everything stays on track.\n\nThe key to monitoring your business while letting\
    \ your team handle most of the action is to consistently focus on and check in\
    \ on seven key areas. I call these the seven pillars of the app business:\n\n\
    1. Psychology and a Winning Mindset\n2. Market Research\n3. App Development and\
    \ Maintenance\n4. Analytics and Tweaking\n5. Marketing and Monetization\n6. Team\
    \ and Systems\n7. Professional Networking\n\nI check in on these key areas every\
    \ day. Even if I don’t take action in every area, this reminds me of what I need\
    \ to focus on. I’ve created specific questions for each one of these areas and\
    \ reading these consistently puts me in a resourceful state and gives me new ideas\
    \ to implement. Here is a brief recap for each area and the questions that you\
    \ should answer on a regular basis. You can use these as an initial guide and\
    \ add your own as you see fit.\n\n## 1. Psychology and a Winning Mindset\nA winning\
    \ mindset is vital because this is where everything starts. If you don’t have\
    \ a vision, don’t feel passionate about what you do, and do not have the flexibility\
    \ and tenacity to adapt to the market, then you will have trouble focusing and\
    \ maintaining the energy to make your business a long-term success.\n\n### Questions\
    \ to Ask Yourself\n* What is my vision for this company, and am I moving toward\
    \ it?\n* Why do I want to be successful in the app business? Who else will benefit\
    \ from it?\n* Is my attitude consistently positive and resourceful? How can I\
    \ reinforce it?\n* What can I do to strengthen my mind, body, or spirit more?\n\
    * Am I aligning myself with positive people who share my passion?\n* Am I flexible\
    \ and willing to change as the app business does?\n* Do I believe I can make this\
    \ work, or am I sabotaging myself by second-guessing my actions?\n\n## 2. Market\
    \ Research\nThe app store is your market, and like any market, it dictates how\
    \ you need to run your business. The store fluctuates constantly, and you must\
    \ monitor it so you can adapt to these changes quickly and seamlessly. Unlike\
    \ most markets, it runs globally 24 hours a day, 7 days a week, with no downtime.\n\
    \n### Questions to Ask Yourself\n* What’s working in the Top 200 app charts? Which\
    \ apps are making money?\n* What are other developers doing that I can emulate\
    \ with my apps?\n* What new apps can I develop?\n* What are the long-term business\
    \ trends?\n* Read online articles and blogs to discover:\n    * What are current\
    \ market trends?\n    * What are top app developers discussing?\n    * How can\
    \ I take advantage of the new phone hardware or software?\n\n## 3. App Development\
    \ and Maintenance\nYou always need to have one or more new apps in the development\
    \ pipeline. You need to tweak your existing apps. This allows you to increase\
    \ the traffic of your app network and to sustain and increase your income.\n\n\
    ### Questions to Ask Yourself\n* Do I have a new app in development?\n* How long\
    \ is it going to take to get new apps out? How can I accelerate the process?\n\
    * How can I improve my current apps?\n* Am I investing enough revenue in my new\
    \ and existing apps?\n* Can I use some existing code to create new apps more?\n\
    \n## 4. Analytics and Tweaking\nMonitoring your analytics will allow you to make\
    \ informed decisions about your business. Analytics give critical feedback about\
    \ the performance of your apps. Keeping track of this information and responding\
    \ to it is vital to your success.\n\n### Questions to Ask Yourself\n* How can\
    \ I automate the tracking of my numbers?\n* What numbers should I be tracking?\n\
    * How are my apps doing, and what can I tweak to increase sales?\n* What are the\
    \ results of my tweaks?\n* Are my app rankings going up or down? Why?\n* Are my\
    \ downloads going up or down? Why?\n* Are my sales going up or down? Why?\n* Can\
    \ I use the feedback in my reviews to improve my apps?\n* How can I improve my\
    \ apps to appeal to more users?\n\n## 5. Marketing and Monetization\nEffective\
    \ marketing of your apps is as important as their development. Consistently tweak\
    \ and improve your marketing efforts. Always look for ways to generate the most\
    \ amount of money from the traffic you have. Mastering marketing and monetization\
    \ is a must if you want to make a lot of money with apps and keep the money coming\
    \ for years.\n\n### Questions to Ask Yourself\n* Am I using all known strategies\
    \ to monetize my apps?\n* Am I looking for new ways to monetize my apps?\n* Are\
    \ my marketing materials translated? What other languages can I translate to?\n\
    * Am I using affiliate links in my apps?\n* How can I further improve my apps’\
    \ icons, titles, descriptions, screenshots, keywords, and categories?\n* Are my\
    \ nag screens and promo pages set up, and are they pointing to the right apps?\n\
    * How can I add in-app purchases?\n* How can I increase ad revenue?\n* What can\
    \ I do to increase traffic more and grow my app network?\n* How can I get other\
    \ developers to cross-promote with me?\n"
