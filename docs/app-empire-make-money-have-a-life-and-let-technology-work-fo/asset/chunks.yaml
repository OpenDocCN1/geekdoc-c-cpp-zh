    # 截图


    截图是极好的营销工具，因为它们展示了用户使用你的 App 时的体验快照。许多在为 App 购物的人通常不会阅读描述，而是直接向下滚动查看截图。截图需要传达应用的核心功能，而不需要显示过多可能令困惑用户的细节。如果你的截图杂乱无章，其效果将像卖一间房间凌乱的房子一样低效。大脑会无所适从，买家也更难看出产品的真实价值。因此，你包含的截图应该是整洁、有吸引力且信息丰富的，这样用户既不会感到压力，又会发想要下载该
    App。


    在我刚开始时，我使用自己 App 的截屏来制作基础截图。截屏过程非常简单；大多数开发者都是这样做。在浏览应用商店时，我注意到一些成功的应用拥有更精美的截图。它们添加了吸引用户注意的横幅，并解释了
    App 的优势。我为其中一个 App 尝试了这些高级截图，结果说服了我为所有的 App 都创建这样的截图。


    如今，几乎所有的顶级 App 都拥有高级截图。大多数开发者已经意识到，截图是给用户留印象的主要工具之一。这也是为什么你必须与拥有图形设计师的团队合作的另一个原因。你的图形设计师会创建
    App 中的图形和图标，并制作出杀伤级的截图，说服用户立即购买该 App。


    此外，请注意截图的顺序很重要。你最多可以展示五张图片。确保你的截图能够讲述一个迫使用户点击下载按钮的故事（参见图 6.4）。


    FIGURE 6.4 会讲故事的截图。


    ![image](img/f110-01.jpg)


    ![image](img/f110-02.jpg)


    这些都是高级设计的绝佳示例。通过图片，用户可以快速理解 App 是如何工作的。文字横幅进一步明确了每一步，作为额外奖励，这些高级截图还包含了 App 的图形。


    ## 关键词


    与你的图标和标题不同，关键词是用户看不到的内容。当你在 `App Store` 上提交 App 时，你可以提供与你的 App 相关的关键词。当用户搜索你选择的术语之一时，你的
    App 就会出现在搜索结果中。


    例如，如果你在 `App Store` 上输入“kids”（孩子）或“game”（游戏），你会发现《愤怒的大鸟》是搜索结果之一。术语 `kids` 和 `game`
    并没有出现在 App 标题中，因此，《愤怒的大鸟》的制作者可能选择了这些关键词与他们的 App 关联。这完全合理，因为《愤怒的大鸟》吸引了很多孩子，任何搜索这些术语的人都能找到这个
    App。


    如你所见，关键词非常重要，因为你的目标群体会使用它们来寻找你的 App。App 标题中的每个词都代表一个关键词，因此在提交 App 时提供关键词，你不需要重复它们。


    确定你 App 关键词的最佳方法是像用户一样思考。你的目标受众在搜索什么？不要使用无关的关键词，因为你能提供的关键词数量是的。当 Apple 在 `App
    Store` 开放一段时间后引入关键词工具时，我添加了我认为人们会搜索的关键词。对于我的 App `Fingerprint Security`（指纹安全），我使用了“camera”（相机）和“video”（视频）等术语。我以为关键词工具就是这样工作的，我的理由是，如果人们在搜索相机
    App，他们可能会看到我的 App 并产生兴趣。


    我意识到 App 购物就像任何其他购物一样。如果你去买电池却路过一把牙刷，当你只需要电池时，你不太可能买牙刷。所以，关键词必须相关，否则即使你的产品出现在搜索结果中，用户也会忽略它。


    有效使用关键词的一个很好的例子由我创建的一个名为 `Flashlight`（手电筒）的 App。由于名字是 `Flashlight`，我们想到了关键词，如“bright”（明亮）、“help”（帮助）、“light”（光）和“camping”（露营）。


    在想关键词时，考虑以下三个问题：


    1. 目标群体是谁？

    2. 用户的需求是什么？

    3. 他们在搜索什么？


    我不使用任何特定的工具来头脑风暴关键词。我使用常识并像 App 用户一样思考。


    ## 分类


    大多数应用商店将 App 组织到特定的类别中，以帮助用户更容易找到。`App Store` 中的某些类别包括`Games`(游戏）、`Entertainment`(娱乐）、`Utilities`(工具）、`Books`(书籍）、`Business`(商业）、`Education`教育）等。除了所有
    App 的总排名顶部排名外，每个类别都有自己的顶部排名，并根据这些图表产生一定程度的可见性。一个没有进入总排名前 200 名的 App，可能仍在某个特定类别的前
    10 名。寻找特定 App 的用户通常会浏览这些类别图表，而不是看总排名图表。


    当你提交 App 进行审核时，你必须选择你希望你的 App 出现的类别。确保选择与你的 App 最相关的类别。例如，闹钟 App 应该在`Utilities`工具类别中，而不是在`Games`游戏类别中。另一方面，许多
    App 可以被归类为多个类别。你必须选择一个，但你可以在更新期间更改类别。某些类别比其他类别竞争激烈。查看竞争对手 App 的类别，看看它们似乎在哪个类别中流行。这通常是你应该将
    App 放在哪个位置的良好指示。


    # 免费 App 的力量


    为你所有的 App 准备上述提到的基础营销元素。在处理好基础之后，你最大的营销工具将是免费 App。免费 App 会产生你原本无法获得的流量和可见度。免费
    App 等同于在主街开了一家实体店，而不是在城外。


