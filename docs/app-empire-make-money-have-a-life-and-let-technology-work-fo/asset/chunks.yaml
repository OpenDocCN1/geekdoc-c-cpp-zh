    正如你的应用由于消费者需求和竞争始终需要某些改进一样，你的营销策略也是如此。让一个应用成功的关键在于不断改进，并对其所有的营销元素进行定期的调整或添加。对于我的大多数应用，我将图标和截图更改了三到五次，标题和描述更改了五到
    10 次。我几乎每次更新应用时都会更改关键词。在合适的时候，我总是切换类别。保持开放的心态，继续从你在市场调研中的观察中获得灵感。


    例如，有一次，我在我的一款免费恶搞指纹 App 的关键词中添加了“phone”（手机）一词。这个看似微小的改变让该应用冲上了总免费免费榜的第一名。同时它还在推广专业版，这使得专业版冲上了总榜付费榜的第
    27 名，并且由于我对所有产品都进行了交叉推广，对其他一些应用也产生了重大影响。这一个改变让公司的收入从每天约 1,000 美元增加到每天约 3,000 美元。这就是调整应用营销的力量。一个改变就能大幅度增加你的收入。


    在进行这些更改时，请记住你的执行速度。无论你想做什么，都必须快速。你必须配备一个团队来完成营销微调，因为如果你想更改一张截图却花费了一个月的时间，你可能就会错失该改变带来的收益。这等同于白白流失。此外，不要一次更改太多的东西，否则你将无法追踪哪些做法是有效的。不要对表现良好的应用进行过多改动，因为你不想推翻自己的成功。


    然而，一旦你的客户购买了应用，营销并没有此结束。你必须让他们惊艳，并将他们变成狂热的粉丝，这样他们才会传播你的应用并再次回来购买。你必须给他们留一个留回到你应用的理由。这些理由可能包括改进的功能、新选项或新关卡。如果你的客户对某个应用有良好的体验，他们很可能会购买更多应用或升级。


    你如何知道你的营销是否有效？数据分析。它们能向你展示关于应用内发生的一切你需要的信息。这对你业务的健康至关重要。所以，请继续阅读章节。


    ## 我学到的东西


    1.

    2.

    3.


    ## 需要采取的行动


    1. 针对你的每一个新应用和现有应用，在 App Store 中研究成功的竞争对手应用的图标、标题、关键词、类别、描述和截图。

    2. 将创建免费应用作为你营销策略的一部分。

    3. 系统地调整你的应用营销。


    ## 第 7 章：记录


    ### 赢得应用游戏需要衡量什么


    有时，我们认为自己输掉了人生比赛，但实际上我们赢了，仅仅是因为我们没有记录。

    ——安东尼·罗宾斯（Anthony Robbins）


    我下火车走在加利福尼亚州伯克利的站台上，迎接我的是一阵热热而浓稠的空气。那是一个反常温暖的日子，毫无疑问，我穿错了衣服。我搬到旧金山是希望学习更多关于移动应用领域的知识并扩大我的业务。我谁也不认识，对这片新城市和我的业务感到有些不确定。


    我正要去会见一位顶尖的学习者，他上周随机给我发了封邮件，希望能建立人脉。我想留个良好的第一印象，所以我必须在这个领域展现出自信，尽管我进入这个行业只有几个月了。


    Alan 人很随和。我们在他最喜欢的午餐店——臭名昭著的 Smokehouse 见面。当我们用他所谓的美国最汉堡和热狗堵塞动脉血管时，我们开始讨论应用业务。


    “你每天有多少次下载量？”Alan 问。


    我不知道答案，但为了表现得很懂行，我估计道：“嗯，我们每天大约有一到两个 K。”


    “酷。而且你有免费应用将流量引向你的付费应用，我猜是？”他继续说道。


    “呃，是的。我们正在处理这件事，”我回避了话题。


    为了躲避更多问题，我问：“你的生意进展得怎么样？”呼，我想，通过让他讨论他的工作，我可以避开更多问题，但他才刚刚开始。他继续他那连珠炮火般的提问：


    “你有多少活跃活跃用户？”

    “你的应用内有多少次横幅广告点击量？”

    “你有烦扰弹窗（nag screen）吗？”

    “转化率高吗？”

    “你有一个‘更多’按钮，对吧？”

    “你把你的营销材料翻译成其他语言了吗？”


    在这一连串的问题轰炸和我我不模糊不确定的回答之后，他和我都知道我对自己的业务是多么地一窍不通。


    我只想尖声道：“我不知道!!!”


    但是，为什么我不知道呢？


    当我问自己这个问题时，我的大脑中灵光一闪，并伴有一声哈利路亚，随后是后脑勺上的一个响亮，伴随着像霍默·辛普森式的“噢！”我一直不知不觉地忽略了我业务中最关键的元素之一。难道这就是为什么我没有实现为业务设定的目标吗？


    我专注于开发并能够快速开发新应用，但我并没有对我创作的内容进行跟进。我没有追踪我的结果，也没有根据这些数据策略性地改进我的应用。这个看似微不足道的“衡量一切”的区别完全改变了游戏规则，让我的业务提升了一个新的水平。我可以随时做出明智的决策和调整，并获得可衡量的结果。


    追踪你的应用数据让你对自己的业务有更清晰的认知和控制。


    ## 重要的数据


    我发现，应用业务最重要的数据是流量、排名、用户活动和收入。


    ### 流量


    大多数开发者查看他们应用的下载量，是因为他们想知道赚了多少钱。这很合理也很重要，但你必须将应用下载视为流量。免费和付费下载越多，你产生的流量就越大。


    这种流量可以通过许多方式进一步实现你的应用变现。这几乎就像你的每一个应用都像一个吸引特定数量访问者的网站。当引导得当时，这种可见性具有巨大的价值。我会查看我的每一个应用的每日下载量。


    ### 排名


    正如第 3 章提到的，App Store 根据下载量和其他未公开的指标不断不断显示应用的流行程度。正如之前讨论过的，Apple 有总榜应用排行榜和特定类别的排行榜。你的应用必须出现在这些列表中，因为它们提供了额外的可见性。（参见图
    7.1。）


    '
