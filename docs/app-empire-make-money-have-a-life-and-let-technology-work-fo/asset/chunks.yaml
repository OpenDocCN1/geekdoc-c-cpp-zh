    \ Its sounds and graphics are unbelievable.” Another example is “Free for a limited\
    \ time.” This gives customers a sense of urgency and incentive to download the\
    \ app.\n\nAfter this description, follow it with a few sentences explaining why\
    \ the users must download this app: “The most impressive and realistic fingerprint\
    \ security application on the market. Check out the screenshots and see for yourself.\
    \ You will not be disappointed.”\n\n### SCREENS\n\nScreenshots are pictures you\
    \ supply with your app description to show the customer your app. Consider them\
    \ the graphical description of your app. The trailer to the movie, so to speak.\
    \ Basic screenshots are images that are screen captures of the app. More advanced\
    \ screenshots are graphic designs that are appealing, contain marketing, and convey\
    \ how the app works (see [`Figure 6.3](#Chapter06.html_figure6-3)`](`Figure 6.3`)).\n\
    \n[FIGURE 6.3](#Chapter06.html_figureanchor6-3) Basic screenshot (top); Advanced\
    \ screenshop (bottom).\n\n![image](images/f108-01.jpg)\n\n![image](images/f108-02.jpg)\n"
  raw: 'To be successful in the app business, you don’t need to come up with the most
    innovative app on the planet. All you need to do is provide value and understand
    the strategies to market your apps so your customers discover and purchase them.


    In this chapter, I show you simple but powerful marketing techniques that will
    drive traffic and get customers flocking to your apps.


    DRESSED TO KILL


    As with any business, you will have to set yourself apart from the competition.
    Your app needs to be a well-designed, quality app, but the best app in the world
    won’t do you much good if people can’t find it or, when they do find it, they
    are unconvinced of its value and choose not to download it.


    Most developers focus almost exclusively on creating apps and severely underestimate
    the importance of implementing some of the most basic marketing techniques. These
    techniques are effective and won’t cost much. You should consider them part of
    the app development process. As you grow your business, you can spend some money
    on more advanced marketing. (I discuss this in Chapter 8.) I recommend you don’t
    do this until you have seen demand for your app and have started to make money
    with it.


    Here’s the formula for app success:


    Effective marketing = Traffic = Downloads = $$$ = Happy Business Owner


    This is a no brainer, but most people don’t pay attention to it. The more effective
    your marketing, the more people will see your apps. The more people see your apps,
    the more downloads and dollars you will get. Think of it as a numbers game. For
    instance, assume that you have 10,000 people looking at your app every day and
    you converted only 1 percent of them. That would give you 100 downloads a day
    and for a paid app that’s $70 a day which is about $2,100 a month. That’s one
    app with a rather low conversion rate. So, remember that your job is to create
    great apps and to put in the same time and effort to get them in front of as many
    eye balls as possible. Sure, you’re going to get some visibility by being in Apple’s
    App Store, but with so many apps there, you can’t count on that.


    So, how do you dress up an app?


    During the impulse buy discussion in Chapter 3, we learned that users typically
    assess the icon, title, description, and screenshots before downloading an app.
    Understanding how each of these basic elements of an app are marketing opportunities
    that allow you to dress up your app is essential to being successful in the app
    business. Your job is to create a seamless flow from the icon all the way to the
    download button. Let’s take a closer look at each one of these.


    ICONS


    The icon is the first thing users will see when they are checking out your apps.
    It’s the small square image with the rounded corners to the left of the app title.
    It’s also the image that users see on their phone after they install your app.


    The icon is important because it’s how the users will identify with your app.
    It should capture the essence of the app. It must look good, attract the users’
    attention, and compel them to investigate your app. It’s the visual ID of your
    app.


    The icon is the first impression you will make on the users. The old expression
    “you don’t get a second chance to make a first impression” applies here. Would
    you want to show up in your pajamas or your best suit to a job interview? Make
    sure you have a quality icon that represents your app and makes the users feel
    it has value.


    Your icon should appeal to the customers you want to attract. If the icon displays
    a cute, cartoon animal, you probably won’t look in it for help with navigation,
    right? Many developers create icons as an afterthought and focus all of their
    effort on the app itself. It’s crucial to work with your programmers and graphic
    designers during the design phase of your project to craft the icon for your app.


    APP TITLE


    Your title should be exciting, snappy, trendy, and catchy. If it meets these criteria,
    people naturally are going to want to check it out. But the title of your app
    is more than just a name. (See [Figure 6.1](#Chapter06.html_figure6-1).) It is
    also critical in helping users find your app when they perform a keyword search
    on the app store. Each word in your title serves as the most valuable keyword,
    much like keywords in search engines. Think of the title as your URL. If you type
    “angry” into the App Store search field, the Angry Birds apps will return as a
    search result.


    [FIGURE 6.1](#Chapter06.html_figureanchor6-1) Top grossing app titles.


    ![image](images/f105-01.jpg)


    Your title needs to be memorable and specific to what your app does. When deciding
    on a title for your app, consider other successful apps in the App Store. I do
    this often, and ask myself the following three questions:


    1\. Why are these titles working?


    2\. What makes these catchy?


    3\. What terms are people searching for to find these apps?


    It helps to think about words in your title as the vehicles of users who will
    find your app. It’s fun to create cute names, but it’s not so much fun if nobody
    can find them.


    When naming your apps, keep in mind the Chomp analytics (mentioned in Chapter
    3). Over 90 percent of searches in the App Store are focused on the functionality
    of the app rather than a specific app name. So, when you’re deciding whether to
    name your app Fun Colors or Flashlight you should go with the more descriptive
    name, which is Flashlight.


    DESCRIPTIONS


    Next comes the description. Having a compelling description for your app is like
    having a great opening line. People are more willing to learn more about you if
    you pique their interest. Following the impulse buy theory, you should not have
    an overly long description. Most people won’t take the time to read the whole
    thing.


    The first chunk of the description needs to be packed with information. It should
    tell users just about everything they need to know about the app. You should make
    it interesting or funny. Add two or three sentences of marketing copy here. Where
    applicable, use statements like “Top App 2012” or “One of the Most Addictive Games
    in the App Store.” Then, follow it up with a call to action such as, “Check out
    the screenshots and see for yourself.”


    For example, the description for Fingerprint Security ([Figure 6.2](#Chapter06.html_figure6-2))
    starts with the short headline:


    [FIGURE 6.2](#Chapter06.html_figureanchor6-2) Fingerprint Security - Pro description.


    ![image](images/f107-01.jpg)


    One of the Top Apps Worldwide


    This marketing copy would not apply to all apps. If you’re starting out, you can
    write other descriptions that catch users’ attention by pointing out how your
    app is different and better than the competition and by including testimonials.
    For instance, if I were starting out with Fingerprint Security, I would write
    something like this: “The Most Realistic Fingerprint Scanner Prank in the App
    Store.” Or get a positive testimonial from a user, such as, “This app blew my
    mind. Its sounds and graphics are unbelievable.” Another example is “Free for
    a limited time.” This gives customers a sense of urgency and incentive to download
    the app.


    After this description, follow it with a few sentences explaining why the users
    must download this app: “The most impressive and realistic fingerprint security
    application on the market. Check out the screenshots and see for yourself. You
    will not be disappointed.”


    SCREENSHOTS


    Screenshots are pictures you supply with your app description to show the customer
    your app. Consider them the graphical description of your app. The trailer to
    the movie, so to speak. Basic screenshots are images that are screen captures
    of the app. More advanced screenshots are graphic designs that are appealing,
    contain marketing, and convey how the app works (see [Figure 6.3](#Chapter06.html_figure6-3)).


    [FIGURE 6.3](#Chapter06.html_figureanchor6-3) Basic screenshot (top); Advanced
    screenshop (bottom).


    ![image](images/f108-01.jpg)


    ![image](images/f108-02.jpg)'
