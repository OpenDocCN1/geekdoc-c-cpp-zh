- fmt: '

    I use my iPhone for everything: to find restaurants, manage my employees, or look
    at my apps’ daily stats and rankings. I can order a shrimp burrito from my phone,
    put in my credit card info, and go pick it up or have it delivered. I can have
    yoga lessons on my iPhone without going to a yoga class. I can stand in line at
    an airport and with a push of a button find out how much my business earned that
    day.


    If used properly, the virtual world can be a potent tool to simplify and improve
    every aspect of your life.


    As this virtual world evolves, people expect to have access to lots of things
    more quickly and easily. Consumer demands are changing because we can do more
    on our phones, and they are always in our pocket traveling with us wherever we
    go.


    We have apps that can control cars, allow us to play the piano, teach languages,
    and even recognize songs and name the artists. Apps are vital assets that streamline
    information, enhancing our lives while educating and entertaining us. With apps,
    it’s all about convenience, convenience, convenience.


    Apps are changing the way we communicate and relay information, allowing us to
    connect with people from Cape Town in South Africa to Montreal in Canada to Shanghai
    in China. Everywhere!


    You have to understand this about the app business: At the core, it’s about how
    consumers are using this technology to connect with the world. The more you are
    aware of this, the more money you can make with apps.


    But how fast is this industry growing? Will it last? Who are the biggest players?
    What are the trends? In this chapter, you will gain essential insights into the
    industry, which will serve as the foundation of your successful app business.


    # A BIGGER OPPORTUNITY THAN THE INTERNET!


    Newsflash: Mobile technology is the next big thing, and it’s still in its infancy,
    growing rapidly every day. It’s causing an information revolution and creating
    a new age where everyone is connected. Even in places like Africa, many people
    who don’t have the means to own computers are bypassing them and using smartphones
    instead. In Egypt, social media posts from cell phones contributed to the revolution
    that brought down President Hosni Mubarak.


    More than 4.6 billion cell phones are being used worldwide, enough for two-thirds
    of the people on Earth. This is a global market and it’s growing at an unprecedented
    pace. (See [`Figure 1.1](#Chapter01.html_figure1-1)`.)


    [`FIGURE 1.1](#Chapter01.html_figureanchor1-1)` By 2014, mobile Internet will
    be used more than desktop Internet.


    ![image](images/f005-01.jpg)


    The app industry exists entirely on the Internet with no physical presence necessary,
    making it easy to do business from anywhere in the world. What about the Internet?
    This is the new Internet, transforming the way we transmit and assimilate information,
    opening doors to a new way of making money. It is the fastest growing industry
    in history and shows no signs of slowing down.


    As you’ve heard before, timing is everything. The mobile industry is in its early
    stages, as the Internet was in 1997. People who saw the opportunity then, jumped
    in and made bucket-loads of money. In fact, those people are still making money
    because they have more experience and a competitive advantage over most.


    Back in the early days, the Internet offered many new and easy ways to make lots
    of money. People were buying domain names for peanuts and selling them for millions.
    They were creating useful websites and selling advertising. A few websites, like
    `Google` and `eBay`, became integral parts of our lives and made their creators
    multi-billionaires. Years later, people are still making money from the Internet.
    The longer people waited to jump into the Internet money-making game, the more
    difficult it became.


    What happened with websites is exactly what’s happening now with apps and mobile
    technology. The only difference is that we have experienced the rise of the Internet
    and are conditioned to react more quickly to the app revolution. This means that
    the app world is running light-years ahead of the Internet, when it was at the
    same development stage. Developing apps is a chance to jump ahead of the masses
    and not be left behind, saying years from now, “I wish I had. . . .”


    The numbers are off the charts. According to the technology research firm `Gartner,
    Inc.`, total worldwide mobile app revenue is expected to explode to $58 billion
    by 2014. With more than 500,000 apps in the `Apple` app store, this industry is
    going to keep growing. There’s no limit to the number of new apps that could be
    created because of our constant desire to be entertained or do more work with
    less effort. This demand will continue to be fueled by our society’s hardwired
    need to evolve and grow.


    Even with the recent global economic downturn, the app industry continues to grow.
    Many market researchers predict the mobile industry will continue to soar, but
    I’m not going to bog you down with more numbers. I will say that if you start
    now, you will be way ahead of the game. If you start later, you will still have
    plenty of opportunities, but why wait to live the lifestyle you can have today?


    Another beautiful thing about this business is that you can start out part-time
    and go full-time later. That’s how Lynn Duke started `Fossil Software`, one of
    the top app companies in the `App Store`. The company was born from the concept
    of bundling multiple, simple apps into one. He and his buddy, `Marshall Womack`,
    a designer, were working 80 hours a week at a gaming company. Their friend sent
    them an article about a guy who made $250,000 in a month from a simple app.


    Lynn was unhappy, gaining weight, working overtime and tired of his long days.
    So, he worked with Marshall during nights and weekends.


    # LUDICROUS SPEED


    In the movie `Spaceballs`, Colonel Sandurz and Dark Helmet have to steer their
    space ship faster than the speed of light. It’s called ludicrous speed. That’s
    what I think is happening in the app business. Technology is moving at ludicrous
    speed.


    If you think about it, all the major change in human history has come with shifts
    in technology. When humans invented the wheel, life changed. When they created
    the steam engine and the cotton gin, the industrial revolution kicked off. When
    the World Wide Web became popular, we entered the Information Age. People could
    instantaneously connect and communicate with the rest of the world from their
    home or office. Now we carry the power of the Internet in our pockets and can
    call and text people any time from anywhere. Our lives are truly moving at ludicrous
    speed. Strap yourself in and enjoy the ride.


    # MOBILE APP TRENDS


    These numbers from `148Apps.biz` show how many apps are out there and how they’re
    being used. I’m sure these numbers will be dwarfed quickly.


    ## Apple App Store Stats (January 2012)


    ### Count of Active Applications in the App Store

    - Total Active Apps (currently available for download): 556,793

    - Total Inactive Apps (no longer available for download): 156,412

    - Total Apps Seen in U.S. App Store: 713,205


    ### Application Approval Delay

    - Maximum delay: 41 days

    - Average delay: 5.26 days


    ### Application Price Distribution

    - Current Average App Price: $2.10

    - Current Average Game Price: $0.99

    - Current Average Overall Price: $1.95


    ### Application Category Distribution (Most Popular Categories)

    1. Games (96,187 active)

    2. Books (60,707 active)

    3. Entertainment (57,351 active)

    4. Education (53,819 active)

