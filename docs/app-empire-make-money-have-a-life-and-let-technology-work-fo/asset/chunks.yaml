- fmt: '

    One thing to keep in mind with affiliate marketing is that the links you create
    are country specific. Apple has decided to use `LinkShare` for the United States
    and Canada. You have to use a different link for each one of these countries.
    For Europe, Apple has chosen to partner with `LinkShare`’s European counterpart,
    which is `TradeDoubler` ([[appempire.com/tradedoubler](http://appempire.com/tradedoubler)).
    For Australia and New Zealand, Apple has partnered with `DGM` ([[appempire.com/dgmpro](http://appempire.com/dgmpro)).
    Initially, you can stick to using U.S. `LinkShare` links because the United States
    has the largest app market. Once you gain some traction with your apps, you’ll
    want your apps to be aware of the country they are being used in. That way you
    can use the correct affiliate link for each country and collect the affiliate
    commission you otherwise would not.


    Set up international affiliate marketing links because your international traffic
    could be half of your app network traffic. That was the case for me. It took me
    some time to set the international affiliate links, and during that time, I was
    leaving money on the table, similar to not getting 100 percent fill rates with
    my banner ads. Your programmer will know how to handle this and again it might
    be best to make this part of your server backend and have an integrated system.


    ## IN-APP PURCHASES


    When the App Store first opened, you couldn’t sell content to the user from within
    the apps. You could only pay for an app when you purchased it or could download
    the app free. At some point, Apple saw the need for a system that would allow
    developers to sell content within their apps, and it created in-app purchases
    FYI: look out for any changes like this because they mean $$.


    The concept is as simple as the name implies. Developers can sell various items
    inside of their apps. Users select the item and get a prompt that reads something
    like “Do you want to purchase this xyz feature for 99 cents?” If users agree,
    they have to enter their `iTunes` account password, as when purchasing apps on
    the App Store. Whatever content users have purchased unlocks or becomes available
    in the app ([Figure 9.6](#Chapter09.html_figure9-6)).


    [FIGURE 9.6](#Chapter09.html_figureanchor9-6) Example of an in-app purchase notification.


    ![image](images/f162-01.jpg)


    The beauty of the in-app purchases is that they are seamless. Apple still handles
    the financial transaction as with regular app sales and users never have to leave
    the app. This is great for the users because they can get additional functionality
    after they ensure they like the app. It’s great for developers because they can
    make lots of extra cash while keeping users engaged, and it’s great for Apple
    because it still gets 30 percent of each transaction. It’s a win-win-win.


    Consequently, in-app purchases have changed the landscape of app monetization.
    While most developers were focusing on making money with paid apps, they began
    to offer more free apps with paid content in them. In-app purchases created the
    freemium model, which is the primary revenue model many developers utilize. If
    you look at the top 25 overall grossing apps on the App Store, you will see that
    at least half of them are free. That means the 12–15 apps that are making the
    most money in the App Store are generating their revenue solely with in-app purchases.


    In-app purchases are particularly popular in games. Usually, users can play the
    game without any restrictions, but if they want to progress faster or use fun
    add ons, they can get them with in-app purchases. It seems unlikely but many people
    pay for virtual items. Some utility apps offer additional content or functionality
    with in-app purchases as well. When I released my Emoji app, I decided to make
    it a freemium app and give users the option to purchase additional emojis with
    an in-app purchase. That strategy paid off handsomely. (See [Figure 9.7](#Chapter09.html_figure9-7).)


    [FIGURE 9.7](#Chapter09.html_figureanchor9-7) Example of several in-app purchases
    in one app.


    ![image](images/f163-01.jpg)


    When it comes to in-app purchases, it’s up to your imagination what you might
    offer. Anything you can think of that your users might want and would pay for
    can be in your app as an in-app purchase.


    The other cool thing is that you can offer as many in app purchases as you like,
    and depending on the value of the item, the in-app purchase can have a high price.
    Users that would have never paid $15 to purchase an app have no problem paying
    that amount inside an app they like, especially if they want that additional item,
    feature, or content. (See [Figure 9.8](#Chapter09.html_figure9-8).)


    [FIGURE 9.8](#Chapter09.html_figureanchor9-8) Top in-app purchases.


    ![image](images/f164-01.jpg)


    When it comes to app monetization, you must use in-app purchases whenever you
    can. Always figure out what content and feature you could turn into an in-app
    purchase to create more user value. If you have an app generating a lot of traffic,
    some of those users will want more from your app. It makes sense to utilize the
    traffic you have to make more money. Let’s consider some numbers. Assume you have
    an app with 10,000 downloads per day. If only 2 percent of your users decided
    to get your in-app purchase, you would have 200 extra sales and make another $140
    per day.


    The nice thing is that you can do this without any negative impact on your app.
    By the way, your app doesn’t have to be free for you to offer in-app purchases.
    Many games do this as well. Integrating in-app purchases will increase your development
    cost a little. The return on investment is usually really good. Plan it before
    development like the rest.


    ## TRANATING YOUR APPS


    One of the best ways to monetize your apps more is to increase their global visibility.
    This requires translating your marketing components (title, description, keywords,
    screenshots) into different languages, which is also called localization. This
    allows people in other countries to find your apps. This also allows them to understand
    all of your marketing components, which increases your international traffic and
    revenue.


    The great thing about this is that you don’t have to localize for specific countries.
    You only have to localize for languages because when you add a certain language,
    such as Spanish, your app will show up in Spanish for all of the Spanish-speaking
    countries. That’s powerful. (See [Figures 9.9](#Chapter09.html_figure9-9) and
    [9.10](#Chapter09.html_figure9-10).)


    [FIGURE 9.9](#Chapter09.html_figureanchor9-9) Alarm Security description in English.


    ![image](images/f166-01.jpg)


    [FIGURE 9.10](#Chapter09.html_figureanchor9-10) Alarm Security description translated
    into German.


    ![image](images/f166-02.jpg)


    When I was searching for ways to grow my app business, I asked my developers and
    masterminds what they were doing to take their businesses to the next level. Localization
    turned out to be a major way to grow traffic and increase revenue with existing
    apps.


    Prior to localizing my apps, most of my time and effort had been spent on the
    English-speaking markets. Because of that, 80 percent of my revenue came from
    English-speaking countries, and 20 percent came from the others. I wasn’t getting
    more international traffic because most non-English speakers were not finding
    my apps and could not understand my marketing because of the language barrier.

