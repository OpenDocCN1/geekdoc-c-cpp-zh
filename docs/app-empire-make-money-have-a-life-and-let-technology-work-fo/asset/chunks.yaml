  trans: "\n通过与其他应用创业者（appreneurs）建立联系，我学习了让收入翻倍甚至三倍的技巧，并强化了我的获胜心态。我从他人那里学习并获取新想法，同时也为他们的应用世界贡献力量，帮助他们的业务增长。\n\
    \n最后，应用本章中的相同技术，让我获得了克服事故并建立一家成功的应用公司所需的心理和身体力量。我完全相信，这些技术也将对你有所帮助。\n\n# 我学到了什么\n\
    \n1.\n2.\n3.\n\n# 需要采取的行动\n\n1. 问问自己这些问题并写下答案：\n    * 我的初衷是什么？当我实现它后，我的生活会发生什么变化？\n\
    \    * 我能看到自己在应用业务中做什么来赚钱？我的热情是什么？\n    * 我想用拥有的自由做些什么？\n    * 我对实现这件事投入有多大的决心？成功的对我对我有多重要？\n\
    \    * 我将会在何时以及如何每天检查自己的获胜心态？\n    * 还有谁会从这种新的生活和财富方式中获益？这对他们和对我意味着什么？\n2. 写下你打算每天都联系在一起的新赋能信念。\n\
    \n# 第 3 章：发现新世界\n\n## App Store\n\n真正的发现之旅不在于寻找新的景观，而在于拥有新的视角。\n——马尔塞尔·普鲁斯特（Marcel\
    \ Proust）\n\n“周五快乐，”银行柜员说道。\n\n“谢谢。这是我人生中最棒的一天了！”我满脸笑容地说道。\n\n兑现那张 `$73,322` 的支票带给我经历过的最棒的感觉之一。我欣喜若狂，因为这笔钱比我这辈子赚的钱还要多，而且它来自一笔真实的房地产交易。\n\
    \n那笔交易对我来说意义不仅仅是钱。它象征着胜利和一种拥有新机会的新生活。我曾竭尽全力，经历了挣扎、付血、汗水和泪水，才实现了我从小从小就开始幻想的美国梦。\n\
    \n当大多数二十多头的男生在狂欢、追逐女孩，或者无所事事地虚度时光时，我发现自己正在看书、研究当地房地产市场、向成功的房地产投资者学习，当然，也还在追女孩。我希望效仿他们，过上他们所过的生活。交易完成那天，手里拿着支票，我满怀感激。所有的努力都得到了报报，我成功了。\n\
    \n2006 年 1 月 6 日，24 岁的我回到了南卡罗来州的默特尔海滩（Myrtle Beach），我在那里创办了一家房地产公司，以为自己已经掌控了这个行业。\n\
    \n每个人都在房地产领域赚钱，几乎没有人预料到这场派会对结束。不到一年后，市场毫无征兆地崩盘了，我计划和努力的一切都化为乌有。\n\n当崩溃时，我所有的努力都变成了一堆账单，而且还没有支付账单的钱。我在七个月内就花完了第一笔房地产交易赚来的钱，没有剩余钱来度过低迷期。\n\
    \n绝望中，我看向了住在纽约的导师之一。我确定他会有答案，但当他的“灵丹妙药”是这样时，我愤怒了：“继续在你成功时所做的任何事情，因为我想你已经忘记了你辛苦努力学习的东西。”\n\
    \n这到底是什么意思？我想。。两周后，我正正在刷牙，突然间，就像从昏迷中醒来一样，我有了“顿悟”时刻。\n\n我意识到，我一直是从房地产所有者的视角来看待市场的，而不是从客户的视角。我之前之所以获得成功，是因为我痴迷于研究市场并像客户（即购房者）一样思考。我理解市场的能力一直带给我竞争优势。\n\
    \n我意识到，即使在低迷市场，默特尔海滩也是一个瞬息万变的地方，人们仍然在寻找住处。我必须弄清楚在哪里、寻找什么样的房子，以及如何找到那些买家。\n\n我记得当我买房子时，我想住在最好的区域，学校很好且靠近海滩。我推断其他人一定也有特定的需求，并且会有数据告诉我是哪些区域的交易量最高。于是，我进行了研究，发现了与其他地区相比表现优异的最火热、最受欢迎的社区，并决定驻扎在那里。\n\
    \n我的导师是对的。如果这些是最火热的房产，那么我问自己：谁在那些地方卖房子，他们是怎么做的？他们通过什么来吸引买家和/或卖家？\n\n事实证明，那些地区的顶尖房地产经纪人通过报纸广告寻找买家，并使用特定的语言。就是这样。我效仿他们的营销策略并找到了买家。我能够从那些买家身上获利并保持我的业务生存。当市场变化时，我训练自己保持关注并倾听，这样我可以改变策略并顺应趋势，而不是对抗。\n\
    \n房地产低迷持续比我预想的要长，让我的财务状况非常紧张，尽管很困难，但这是一次我感激的宝贵经历。那是我开发业务中生存所需技能的战场。我在我的应用业务中使用同样的策略，但头脑少了很多。我观察大局，研究市场，像消费者一样思考，并效仿最成功的玩家。\n\
    \n好消息是，你可以从第一天起避免战斗伤痕并使用这些策略。听从市场，遵循趋势。作为一个应用创业者，你越了解客户并给他们他们想要的，你的回报就会越大、越持续。\n\
    \n在本章中，我将带你游览 `App Store`，让你像专业人士一样利用这个强大的资源。\n\n## 收集情报\n\n正如任何业务一样，你的成功与你对市场的理解直接相关。`App\
    \ Store` 是应用的市场，因此要理解市场，我们必须研究 `App Store`。\n"
