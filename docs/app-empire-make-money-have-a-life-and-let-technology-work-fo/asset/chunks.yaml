    idea is to focus on the big dogs first and continue with translations in smaller
    markets if it makes sense. Currently, the top markets are the United States, China,
    United Kingdom, Canada, Germany, France, and the Spanish-speaking markets. Always
    keep an eye on the big markets as well as the emerging ones. Some others will
    join the ranks of the major ones.


    Translations will put your international app network on hyper speed. Implement
    them as soon as your apps begin to gain traction.


    REINVESTING IN YOUR BUSINESS


    As you scale your business and are making money, you must reinvest in your business.
    You do this by reinvesting in your existing apps and investing in new apps. Spending
    money to upgrade your apps, offering professional versions, or refreshing their
    look will increase traffic or keep your existing customers coming back. Many developers
    miss this step, and therefore, their business hits a plateau.


    Investing in new apps will replenish and grow your app network. Remember when
    I mentioned building a long-term business, a gold mine, rather than creating a
    one-hit wonder? If you ride your one or two apps, your business will run its course.
    To create a sustainable app company that makes a lot of money and supports your
    new lifestyle, you have to keep creating new apps.


    One of my developer friends has a rule that his company needs to come up with
    two new apps every month. Whether he’s working or hiking through the mountains
    of New Zealand, his team is aware of this goal, and it always meets it. Set your
    own goals for growth and pursue them.


    YOUR BACKEND


    When I started out, I had only a few apps so it was easy to manage various aspects
    of my marketing. I changed my nag screens and promo pages manually. I would log
    on to LinkShare, and grab the affiliate links and so on. This worked well at the
    beginning, but as I created more apps, manually managing everything consumed more
    time. Money was coming in, but my head was spinning. I knew a better way existed,
    so I had a talk with my business partner, and we decided to build software to
    automate and optimize the entire process.


    We needed something that would simplify the management of all of our nag screens
    and promo pages. We wanted them translated so we could monetize our international
    traffic more effectively. Ensuring we were getting all of the international affiliate
    commissions was a high priority. To streamline the entire process, we created
    a simple database. This database contained all of our nag screens, promo pages
    with their translations, and all of the correct international affiliate links.


    Then we added code to our apps that made them region and language aware. Every
    time any of our apps is opened, it checks the users’ region (country) and language.
    This information is available in the users’ device settings. The app communicates
    with our backend database and is supplied with the information it needs. If users
    who have set their region to Germany and their language to French open Fingerprint
    Security, the app communicates with our server and shows users a French nag screen
    and French promo pages, but the international affiliate link will be the one for
    Germany. This process is cool and efficient.


    The result of our efforts is what we call the App Empire Network. It adds additional
    income and I can manage all crucial aspects of my app empire. The reason I mention
    this is because you’ll want to create a backend system like this eventually, to
    save time and to improve your bottom line. Check our screenshots on how we set
    things up at [appempire.com/software](http://appempire.com/software).


    You don’t need a setup like this to succeed, especially in the beginning, but
    a fully integrated backend system can take your business to the next level once
    you start growing and need to manage lots of apps.


    SELLING YOUR APP BUSINESS'
