    Based on this info, I knew where the action was going and that I had to adapt
    my business model. I called my developer and started to update my apps so I could
    increase revenue through in-app purchases. This has been a huge shift in the market,
    and without monitoring the market daily, I would not have picked up on it.


    I see other top developers watching and adjusting to the market constantly as
    well. The more present and informed you are on what’s happening in the marketplace,
    the quicker you can adjust and capitalize on changing conditions.


    ## READ BETWEEN THE APPS


    So, how do you keep pace with the market? The best way to do that is to check
    out Apple’s cheat sheet and study it constantly. The App Store displays the top
    paid, the top free, and the top-grossing apps (the apps that make the most money
    including free apps), almost in real time (see [Figure 3.2](#Chapter03.html_figure3-2)).
    Apple provides the same lists in the individual app categories. This info is golden
    because it tells us volumes about the market. The best part is this information
    is accessible at any moment unlike the market info of any other industry.


    [FIGURE 3.2](#Chapter03.html_figureanchor3-2) Top 25 paid, free, and grossing
    apps.


    ![image](images/f039-01.jpg)


    Review these charts frequently, and look for trends you can take advantage of.
    That’s what I do. This educates me about different pricing models and how successful
    apps are being designed and marketed. When looking at the market, these are some
    of the questions to ask:


    *   Why is this app successful?

    *   What is its rank and has it been consistent?

    *   Why do people want this app? (Look at the reviews.)

    *   Has this app made the customer a raving fan?

    *   Does this app meet any of my needs?

    *   Did I become a raving fan after trying it?

    *   Does this app provoke an impulse buy?

    *   Will the customer use it again?

    *   How are developers marketing to their customers? (Check out the screen shots,
    icon design, and descriptions.)

    *   What else can I learn from the company that created the app?

    *   What is the competitive advantage of this app?


    Be curious, and constantly ask lots of questions. This will help you uncover clues
    to success. This research is simple, costs nothing, and is lots of fun. You will
    be downloading and playing games and testing other apps as well. Rediscover your
    inner child and have fun.


    It’s important to write down what you observe so you can use that information
    to your advantage. Instead of saying, “I think this is what’s going to work,”
    or “My buddy told me this app is great so I’m going for it,” let objective data
    lead you. Few apps, if any, become successful by chance. After you do this for
    some time, you will develop an uncanny sixth sense for what works in the market
    and what doesn’t.


    Every second you spend with an app is part of your market research, which will
    make you more savvy and knowledgeable as an appreneur. Even as your business grows,
    keep learning about new apps. You can discover new ideas and different device
    capabilities.


    When should you research the market? Utilize your idle time as much as possible.
    Checking the pulse of the App Store takes 5 to 10 minutes. In addition to that,
    schedule time to focus on your market research when in front of a computer. This
    will give you the ability to see more on the screen and more easily note any trends.


    ## TWO TYPES OF APPS


    Though you will find many categories of apps in the App Store, such as Games,
    Entertainment, Utility, and Productivity, only two types of apps exist: those
    designed for entertainment purposes and those designed for productivity. I am
    not referring to the entertainment and utility categories in the App Store. Instead,
    I divide apps into two groups because that simplifies the process of researching
    and understanding the demographics of app users.


    Entertainment apps can range from action games, puzzles, and fake IQ tests, to
    gun simulators, prank apps, and many others. They offer fun, are mindless, and
    are usually used to pass the time as a wanted distraction. They usually require
    little effort or thought from the user.


    The top-grossing entertainment apps aren’t just action games like `Angry Birds`.
    They can be apps, like `Talking Ben`, in which an animated interactive dog repeats
    all of your words in a funny lower pitched voice. Another example is an app called
    `Top Girl`, which simulates a virtual world, that lets a girl walk around, get
    a boyfriend, buy clothes for him, and more. This isn’t my cup of tea, but enough
    people love it and keep it highly ranked.


    Another entertainment app that always seems to be one of the top five in the list
    of highest grossing apps is `Tap Pet Hotel`. Inside is a virtual world where the
    user has to care for a pet on a daily basis, paying to upgrade to feed or to teach
    the pet a new trick. This virtual world uses fake currency as its system of rewards,
    which hooks customers and makes them raving fans.


    The ingenuity of the app lies in its deeper goal: hooking the user into returning.


    I would never have guessed in a million years that a virtual pet hotel app would
    be as popular as it is. I would never have come up with it myself. This is a good
    example of remaining objective when judging whether an app could work. Keep emotions
    and personal preferences out of your decision making. I don’t care how much success
    I have, or what I think I may know, I always let the data lead me.


    As of this writing, people put the biggest premium on being entertained and letting
    loose with games. Seventy-five of the top 100 paid applications are entertainment
    apps.


    Only 10 percent of the top 100 highest grossing apps are utility based. I think
    this uneven demand will remain for a while because of the entertainment focus
    of the iPhone user.


    On the other hand, utility apps make the world more convenient, helping people
    with everyday tasks. Examples include apps that turn your iPhone into a flashlight,
    track diets, create grocery lists, perform currency conversions, or send voice
    memos as text messages. These apps significantly extend the functionality and
    usefulness of smartphones. Ever visit a new city, and have no idea of what to
    do, or where to get a decent meal? Well, within seconds, an app like `Yelp` can
    help.


    ## App Discovery


    Another important nugget when it comes to making money in the app business is
    how easily customers discover apps. Without users finding your products, no sale
    can occur. Customers have two ways to find an app: through a keyword search on
    the App Store or through browsing its top charts. This means an app’s visibility
    is determined by the app’s search and top chart rankings. Therefore, you must
    do whatever you can to monitor and improve your rankings at all times. Most developers
    don’t monitor their rankings consistently because they think they don’t have any
    control over them. This couldn’t be further from the truth. These rankings are
    so important that I use them daily to make crucial decisions about my apps.


    Until recently app rankings were based on the number of downloads each app was
    receiving. Then Apple slightly modified its ranking algorithm to include other
    variables such as frequency and duration of app usage. After this change, frequently
    used apps like the `Facebook` app moved up in the charts.

