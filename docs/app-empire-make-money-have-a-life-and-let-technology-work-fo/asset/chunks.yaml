    “Chad 是美国梦的经典典范。我很幸运，从 Chad 的应用取得巨大成功之初就认识了他。他是一个拥有卓越计划的普通人。他应用成功的公式是科学的，而且任何人都可以复制。他脚踏实地的风格对助人的真诚热爱，使其成为了一种易于理解且能快速见效的方法。我通过多年来的过度工作和压力创造了自己的财富和成功。请节省你自己的时间、精力和压力，从今天起遵循
    Chad 简单的应用计划吧。”


    —Joe Barresi，企业家，多家制造公司所有者，近期涉足应用业务的企业主


