    ```


    “Chad has radically changed the game. He is insightful but breaks down the daunting
    tasks of researching and creating apps. App Empire is a book for anyone who wants
    to quit his nine-to-five. A business where you have the flexibility to work from
    anywhere, pick your own hours, and have higher margins than any other business.”

    — **Amish Shah**, World Renowned Marketing Expert, Co-founder of Digispace, an
    Inc. 500


    “Chad is a total gangster when it comes to iPhone apps. The money he has made
    in such a short time is astonishing.”

    — **Frank Kern**, Highest-Paid Internet Consultant


    “Make millions with apps while traveling all over the world? Well, there is a
    book for that, and you’re holding it in your hands. I’ve seen first hand the amazing
    results Chad’s strategies can produce in the store. Seize this opportunity to
    become top appreneur and join the growing ranks.”

    — **Tayfun Karadeniz**, Leading iPhone App Monetization Gangster


    “The strategies for making money with apps detailed in this book are proven, effective,
    and simple. There are very few people in the app space equipped to author this
    book, and Chad is one of them based on his repeated success from the beginning.
    The market for apps is still in its infancy so my best advice is to read the book
    and execute. Chad has made it easy for you.”

    — **Alan Johanson**, App Publisher, 18m App Downloads


    “It’s not just about having an idea. It’s about executing it. As the app market
    grows, it’s getting harder to gain visibility, and visibility is the key to success.
    This book breaks down the process into understandable concepts. It guides you
    step by step in executing the most efficient way to gain that visibility you need.
    Chad has it down to a science.”

    — **Michael Moon** from Free the Apps!


    “If you are starting in appreneurship, Chad Mureta is your perfect personal trainer.
    This is a book that teaches you how to make millions of dollars in apps. Chad
    shares his mistakes and successes on these highly guarded secrets. He guides you
    to focus on the things that make millions of dollars rather than leaving it to
    luck. Often, developers like myself forget the reasons and bury our heads in app
    building. Chad’s methodology will lead you to the lifestyle you dream about.”

    — **Bess Ho**, Mobile Architect at Archimedes Ventures, Book Author, and iOS Instructor
    at Udemy

