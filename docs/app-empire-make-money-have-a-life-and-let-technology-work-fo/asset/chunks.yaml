    Let’s go through the process of assessing your app ideas. First, write down up
    to five of your most promising ideas based on your research. If you don’t have
    any yet, why not check out the `App Store` to see if you can find some inspiration.


    ## My Top Five App Ideas


    1.

    2.

    3.

    4.

    5.


    ## Assessing Your Ideas


    Assess your ideas based on the traits checklist I showed you in `Chapter 3`. Here
    it is again. For each one of your app ideas, check each one of the eight traits
    it has.


    1. Fun/Entertaining own2. Intuitive

    3. Engaging

    4. Addictive

    5. Valuable

    6. Cross-Cultural

    7. Great Graphics/Sounds

    8. Viral


    The more of these you can check off, the better your chance will be to create
    a successful app. I usually check each one of these but might go for an idea that
    is missing one or two. Cross out any apps that have fewer than six traits, and
    go back to the drawing board. Keep going through this exercise until you have
    three ideas that meet six or more of these traits.


    ## App Store Review Guidelines


    Something else to keep in mind, when picking your top three, is the `App Store`
    review guidelines. These rules are used by `Apple` during the review process,
    and if you don’t follow them, your app will be rejected. For example, you may
    have seen the plethora of fart or flashlight apps on the `App Store`. As a result,
    `Apple` has decided to no longer accept those types of apps. Knowing these rules
    can save you a lot of time and effort. If you see any of your ideas conflicting
    with the guidelines, reject them and move on to the next one.


    Make sure to go through this exercise now or at the end of this chapter. We’re
    going to get quotes for your top three ideas once you find developers using the
    methods in the next chapter.


    ## TIMING IS EVERYTHING


    Another crucial component when it comes to deciding what app idea to go with is
    timing. Because the market doesn’t seem to be ready for your idea at the moment
    doesn’t mean that this won’t change in the future.


    For example, during rehab, I found yoga to be incredible for regaining my range
    of motion. I became passionate about it and thought about creating an app for
    other yogis. I went onto `appempire.com/topappcharts` and searched for “yoga.”
    That was around November 2009.


    I found that none of the yoga apps ranked high in the top charts, even in the
    health and fitness category. Even though I was passionate about yoga, I had to
    listen to the data. The market wasn’t big enough for the app.


    More than two years later, in August 2011, I saw that a yoga app ranked second
    in the health and fitness category. At that point, the market had grown enough
    for me to consider spending time on a yoga app.


    If I had created a yoga app two years earlier, could I have made money with it?
    Sure, but the probability of the app being successful would have been low due
    to low visibility. Yes, timing is everything.


    Similarly, as you can be too early for the market, you can also be too late. Make
    sure that you don’t get analysis paralysis. At some point, it will be time to
    execute. If you see something that you think will work, strike immediately. App
    ideas can have a limited window of opportunity and you don’t want to miss that.
    You want to launch your app while the market you’re watching is still hot.


    ## TAKING SMALL STEPS


    Here is a million-dollar question: You have $25,000. You have the option to create
    one app that takes five months to develop and costs $25,000 or 10 apps that each
    take two weeks to develop and cost $2,500 each. Which strategy should you follow?
    Sadly, most developers choose the first route. They think they have an amazing
    idea, and spend a lot of- time and money on it. This is too risky because no matter
    how you select your app ideas, you won’t know if they will be accepted until you
    test them in the marketplace.


    My app strategy has been to create straightforward, low-cost apps that are in
    the same ballpark as those with proven success in the market. The only way to
    know if your idea is successful is to test it in the market. You need to find
    out if customers have an appetite for your idea, and if you can get the marketing
    right before you spend too much money and add everything but the kitchen sink
    to it. You can upgrade and add features after the market embraces your product
    and you have a better understanding of the app’s demographic and longevity.


    The best way to test the market is to launch a free app first. A free app usually
    costs less because typically it has fewer features. It’s cost-effective and has
    the lowest barrier to entry for consumers because it’s free. After all if you
    can’t give away your app for free, how are you going to make people pay for it?
    Don’t worry, there’s plenty of money to be made from a free app even when you’re
    testing the market. In `Chapter 9`, I’ll explain how.


    Make sure you can create your app as cost effectively as possible, without skimping
    on graphics or core functionality. If you can’t develop your current idea at a
    reasonable price, shelve it, and go with your other ideas first.


    As you’ve seen in this chapter, a method behind the madness exists for picking
    hit app ideas. It’s a repeatable process, and the more you use it the better you
    will become. Now that you have all these ideas, it’s time to look for developers
    who can turn them into reality.


    ## What I Learned


    1.

    2.

    3.


    ## Actions to Take


    1. Look at the market and make a list of apps you would like to emulate.

    2. Is the market hungry for this?

    3. See if there’s a way you can improve the functionality and marketing of an
    existing app.

    4. Pick your best ideas based on your research, Apple guidelines, and timing.


    ## Chapter 5


    ### You’re the Brains and They’re the Brawn


    How to Hire Great Programmers


    Coming together is a beginning, staying together is progress, and working together
    is success.

    —Henry Ford


    “Wait, wait. How do you expect to create an app if you’re not a programmer?”


    I responded with a quick, defensive, “Hire someone, of course.”


    Without a skip of a beat he immediately followed with, “Okay. Well, how do you
    find those people?”

