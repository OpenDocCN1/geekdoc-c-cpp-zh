    [FIGURE 4.1](#Chapter04.html_figureanchor4-1) Pocket Dream Girl.


    ![image](images/f061-01.jpg) ![image](images/f061-02.jpg) ![image](images/f061-03.jpg)


    When I heard the idea, I thought it was a good app and that it could work. Before
    starting development, I would have researched the market, realized no demand for
    this type of app existed, and moved on. But my friend was in love with his idea
    and had the app developed without being discerning or doing any market research.
    It was nicely done, but as you can imagine, the app flopped.


    You want to avoid this mistake with your apps, and if you listen to the market,
    you will.


    Another trap to watch for is being sidetracked by others. In my experience, the
    first rule of making cash as an appreneur is to stick to your game plan, and avoid
    advice from anyone who hasn’t had any success in the app business. Generally,
    your friends, family, and peers will think they are experts in the industry. Most
    will even graciously help you with new ideas to guarantee you have a money-making
    concept.


    However, I’ve always found this enthusiasm distracting. Other people’s advice
    is usually based on fantasies of striking it rich, with minimal market research
    in the form of their girlfriends, their cousins, or their parole officer. I can’t
    tell you how many times I’ve heard people tell me, “That will make you so much
    money!” or, “I have the best app idea. You have to do it; you’re going to be rich!”


    While support from others can be encouraging, don’t let it cloud your judgment,
    or you will be sure to catch the empty pocket syndrome. Treat family and friends
    as who they are: consumers. Let them test your apps and give feedback as a user,
    especially if they are in your demographic. Don’t, however, take business advice
    from them if they haven’t proven themselves to be successful in this industry.


    Taking their advice is an easy trap to fall into because whenever people ask you
    “What do you do?” you’ll unintentionally invite lots of questions, advice, and
    suggestions since everyone is interested in this exciting industry. Everybody
    has their own million-dollar idea and will be sure to make you listen to it. Be
    discerning, stick to your game plan, and stay focused on your idea from concept
    to development. Allow yourself to be swayed in a new direction based on facts
    and objective data and not by one person’s subjective opinion.


    STOP HATIN’, START EMULATIN’


    Emulating competitors is one of the most fundamental concepts in business. When
    Apple launched the first iPod in 2001, MP3 players weren’t anything new. The first
    mainstream MP3 music player entered the market three years before the iPod came
    along. The iPod became a massive success because it was sleek, intuitive, and
    fun.


    The iPhone wasn’t the first smartphone, but Apple saw a need for more innovative
    features, and took smartphones to the next level as it did with MP3 players. With
    focus on the consumer and beautiful design, Apple made the iPod and iPhone the
    game-changing successes they are today.


    Facebook is notorious for recognizing something that works, making it better,
    and adapting it into its platform. Facebook offers integrated e-mail, newsfeeds,
    instant messaging, video chat, and apps. You can get each of these somewhere else,
    but they’re more fun or easier to use on Facebook.


    FIGURE 4.2 No need to reinvent the wheel.


    ![image](images/f063-01.jpg)


    The find-something-that-works-and-make-it-better philosophy has been around since
    the beginning of time. Thank God, because if that wasn’t the case, we might still
    be swinging from branches and picking our butts.'
