    ## 哪个分类竞争较小且可能提供更高的可见度？


    你必须像一个剪辑比赛录像的教练。你每天都需要审查你的游戏计划，以决定做出哪些更改。大多数开发者采取散弹式方法，通过同时改进所有内容来解决问题。糟糕的部分是，如果某个功能有效了，他们并不知道是哪里起作用，因为他们同时改变了十个地方。你必须单独测试每一项更改，才能确定哪些更改实际上是有效的。


    提升应用的性能可以很简单。我的其中一个应用 `Alarm Security` 之前运行不佳，我正试图让它的排名回升。起初我尝试更改名称和关键词，但并没有太大变化。我还没有尝试过的一件事将其移出
    `Entertainment`（娱乐）分类。由于它本身更像是一个工具类应用，所以我决定将其移动到 `Utility`（工具）分类。我之所以把它放在 `Entertainment`
    分类是因为该应用包含了各种闹报声，比如大声的尖叫或枪声。我曾假设用户更多是把它们当作开玩笑而不是作为工具，但我错了。


    一旦我将应用移动到 `utilities` 分类，下载量就飙升了。五天后，付费下载量几乎增加了三倍，而这仅仅是因为分类的改变。如果不是不断工作和改进那些低表现的应用，我可能会很容易错过这个带来巨大回报的改变。


    我经常收到的问题之一是：“我应该测试一个微调多久？”当你对某物进行微调以使其更好时，在进行其他更改之前，请测量大约一周的结果。你会很快看到你的改进是否产生了积极结果。


    记住你的预算。许多微调不会花费你任何费用，比如更改标题、`keywords`、`description` 和 `categories`。你应该先尝试这些。你可以对图标和截图进行一些更改，但要保持成本尽可能低。在你仍在测试应用的市场需求并试图收回投资时，不要向你的改进中投入数千美元。只有在你通过营销微调获得增长动力后，再投入精力改进应用。


    我建议你每天设定一个特定的时间来检查你的统计数据。建立一个适合你的惯例并坚持下去。当你查看统计数据并问自己上述问题时，你会有很多改进的想法。确保这些想法不会丢失。一个一个地记录并实施它们。跟踪你的更改并进行跟进，否则你将无法得知哪些更改产生了积极影响。你可以查看
    `appempire.com/trackchanges`，那里有一个表格可以让你轻松跟踪你的更改。


    ## 关注评论


    发现应用中需要改进之处的另一个好方法是应用评论。App Store 允许下载过你应用的人对其评分（一到五星）并留下简短的文字评论。（参见图 7.6）。随着你的应用流行，你会获得更多评论。其中一些非常棒，有些则不然。准备好提琴和纸巾。将用户评论视为建设性的批评至关重要。它们可能会向你展示应用中隐藏的
    Bug，或者揭示许多用户想要看到的某些功能。


    图 7.6 愤怒鸟的评论。


    ![image](img/f127-01.jpg)


    发布井棋应用对我来说关于评论重要性的另一个大教训。在第一个版本中，当人们赢得游戏时，应用会闪一个标志。但多条评论提到没有声音，而且他们希望能够和朋友一起玩。我利用了客户反馈，让我的开发者增加了声音和多用户功能。之后，其中一个之前的评论者又了来说：“嘿，感谢这些更改。这些声音太棒了。”你可以看到这让客户很快了，而且这对应用来说是极佳的营销。


    由于负面评论会对你的收入产生负面影响，正面评论可以增加销量。幽默、令人兴奋并赋予你的应用信誉的评论会转化更多客户。如果评论非常棒，你可能想将它们包含在应用描述中。


    获取更多反馈的另一个方法是检查来自世界其他地区的评论。这有助于从全球角度了解你的应用是如何被接收的。你可以使用 `AppFigures` 服务来检查不同国家的人对你应用的真实看法。`AppFigures`
    会为你翻译评论。这些翻译并不完美，但在大多数情况下你都能明白传达的信息。这将是无价的。


    ## 止损


    和大多数业务一样，应用业务是一场数字游戏。有些应用会奏效，有些不会。有时，即使你有一个很棒的图标、精彩的截图、有吸引力的名称和设计良好的应用，应用的表现也可能不如预期。这就是为什么在看到市场对应用有需求之前，我不会投入大量资金。当你根据本章提到的建议尝试改进应用及其营销元素三个到四个月后，就是时候继续下去并将精力放在另一个应用上了。就像任何关系或投资一样，止损是困难的，但对你和你的业务至关重要。


    例如，我曾创建一个名为 `Flashlight` 的付费应用，它使用 iPhone 的闪光灯将手机变成手电筒。大约九个月时间，该应用运行良好。我注意到销量正在下降。我花了几个月专注于改进核心营销组件，但应用的销量仍然在下降。在那时，我必须决定止损，停止向该应用投入时间和金。我决定将
    `Flashlight` 变为免费应用，并用它为我的其他应用引导流量。虽然 `Flashlight` 从未成为一个巨大的赚钱工具，但它为我的应用引流整体生态系统做出了贡献。


