- fmt: "\nNo matter what your dream lifestyle is, you can have it as an appreneur.\
    \ You don’t have to be versed in computer programming to do this.\n\nWhen I started,\
    \ I didn’t have a clue about programming languages or how to write code. I still\
    \ don’t, but I was motivated to succeed at this business. Due to my unique circumstances\
    \ at the time, failing wasn’t an option.\n\n## STARTING FROM A HOSPITAL BED\n\n\
    When you are on your deathbed, will you be able to say you lived a fulfilled life?\
    \ I nearly couldn’t.\n\nI started this business from a hospital bed, wondering\
    \ if I even wanted to live. I had survived a terrible car accident that shattered\
    \ my left arm. I had gone through two groundbreaking operations, and spent 18\
    \ months in painful rehabilitation.\n\nWith limited insurance, I had racked up\
    \ `$100,000` in medical bills. Even though I survived, I had no clue how to get\
    \ out of the deep hole I felt trapped in.\n\nUp until that point, I had worked\
    \ for and started several companies and ultimately failed because I had burned\
    \ myself out. My last business was a real estate franchise I started right before\
    \ the real estate bubble burst. Yes, my timing was exquisite.\n\nEven as my own\
    \ boss, I was tired of working 18-hour days without freedom. I wasn’t an employee.\
    \ I was a slave to my own business with all the pressure and responsibility. So,\
    \ it was much worse.\n\nThe doctors put my arm back together with a titanium rod\
    \ holding things in place from my elbow to my shoulder. It was an agonizingly\
    \ painful ordeal but a huge wake-up call that I realize I was lucky enough to\
    \ receive. After that, I made the decision that my old way of going through the\
    \ motions of life would not do anymore. I had to find a way to live a life I could\
    \ look back on without regret.\n\nAfter my accident, I was moved to a physical\
    \ rehabilitation center and worked on reconstructing my body, my mind, and ultimately\
    \ my life. While rehabilitating, the books of thought pioneers like Anthony Robbins,\
    \ author of `Unlimited Power`, strengthened my mind, and Timothy Ferris, author\
    \ of `The 4-Hour Workweek`, inspired me with the idea of lifestyle freedom.\n\n\
    During that time, my good friend and future business partner, Tayfun, gave me\
    \ an article about appreneurs and told me I should get into the business. I learned\
    \ that most appreneurs were one- or two-person teams, with low costs, and the\
    \ successful ones were bringing in millions in profits. Still in my hospital bed,\
    \ I drew app ideas while taking intense pain medication.\n\nThree weeks after\
    \ my last surgery, desperate, broke, and grasping at straws, I borrowed `$1,800`\
    \ from my stepdad and jumped with both feet into the app business. The result?\n\
    \nIn just over two years, I created and sold three app companies and made millions.\
    \ Two months after launching my company, one of my apps averaged `$30,000` a month\
    \ cash flow. Later, the company’s income reached `$120,000` in one month. In all,\
    \ I’ve developed more than 40 apps and have had more than 35 million app downloads\
    \ across the globe. Over 90 percent of my apps were successful and have made money.\n\
    \nTo this day, I still don’t know how to upload or update apps. I outsource that\
    \ work to programmers and let `Apple` do the distribution. I focus on monitoring\
    \ trends and doing creative work while leading my company. Although I concentrate\
    \ on `Apple`’s `iPhone` apps in my business, most concepts I show you can be applied\
    \ to other platforms, including `Google Android` and `BlackBerry`.\n\nEvery morning\
    \ when I wake up, I lie in bed for an hour, viewing reports on my `iPhone`. After\
    \ that, I go for a run and eat breakfast, I take another hour to outsource tasks,\
    \ and I spend the rest of the day living an incredible life.\n\n## GAME PLAN\n\
    \nMy success came from having a game plan.\n\nEven though I work a few hours a\
    \ day, I want to build an empire that will last for years to come. To do that,\
    \ I developed core areas of my business I can monitor daily, weekly, and monthly.\
    \ I call this core the seven pillars of an app business. Understanding these pillars\
    \ will turn your business from a one-time lottery winner to an unlimited gold\
    \ mine.\n\nThe chapters in this book are set up in a modular fashion, so if you\
    \ need marketing ideas, reread the marketing chapter and so on. The ideas I share\
    \ will help at every stage of growth, from launch to expansion. Sure, you can\
    \ find answers to specific questions, but I suggest learning the overall game\
    \ plan first because this will bring you long-term riches.\n\nEach chapter ends\
    \ with actions for you to take. You can use these while building your business\
    \ to ensure you stay on track every step of the way. You can also find additional\
    \ helpful resources at `www.AppEmpire.com/resources`. \n\n## THE REAL QUESTION\n\
    \nWhy wouldn’t you get into the app space now? Mobile technology isn’t going away,\
    \ and the industry is exploding worldwide. Look around and see how many people\
    \ use their mobile phones to find a restaurant, text friends, or update their\
    \ status on `Facebook`. This hot industry is only getting started. It’s the perfect\
    \ time to jump into the mobile game.\n\nYou can run your own app business because\
    \ you don’t need a lot of money, skill, or knowledge to begin. All you need is\
