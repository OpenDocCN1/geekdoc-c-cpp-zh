    我的朋友 Michael Moon 和 Quoc Bui 通过他们的公司 FreeTheApps 在 App Store 上每月可以赚取 80,000 到
    100,000 美元。Michael 总是说：“如果你发现你的想法已经被别人做过了，不要灰馁。这只意味着你的想法有市场，如果可以的话，这反而是一种鼓励！”


    一些最伟大的 App 想法是对现有应用的改进，或者是对旧想法进行变形，将其引向一个全新的、独特的方向。Smack Talk 和 Talking Friends（会话朋友）系列应用的故事就是模仿理念运作的完美范例。


    Smack Talk 是一个在 App Store 早期非常成功的应用。（参见图 4.3。）该应用描绘了可爱的小动物重复你说的任何话，但是用高音调发出的。这是一款直观、创新、开创性性、且极具娱乐性的应用。说真的，谁会不喜欢一只听起来像吸了氦气的小仓鼠在重复你自己的话呢？


    图 4.3 Smack Talk。


    ![image](img/f064-01.jpg)


    Smack Talk 在排行榜顶部停留了很段时间，引起了轰动。对于一个伟大的应用来说，这是一个巨大的成就。许多开发者敬畏地效仿这个应用，希望那是自己的主意。他们不敢竞争，因为试图超越这样一个成功的应用似乎像是一场注定失败的战斗。他们接受了这一领域已被
    Smack Talk 占据的事，并继续照常经营。


    然而，一家名为 Outfit7 的公司有其他计划。它毫不犹豫地进行竞争并将该概念提升到了新的高度。它制作了一个名为 Talking Tom 的变体应用（图
    4.4），除了基础的语音播放功能外，还包含了一个 3D 交互卡通猫。用户通过语音播放获得娱乐，并享受一系列新功能，例如触摸小猫并获得反应。该应用提供了新的互动方式、更多的动画和精妙的营销。


    图 4.4 Talking Tom。


    ![image](img/f065-01.jpg)


    Talking Tom 在 2010 年超越了 Smack Talk，但 Outfit7 继续努力，创建了一整套包含许多不同动物的 Talking Friends
    应用。这使得 Outfit7 成为了一家百万美元的公司，并是迄今为止最成功的 App 公司之一。它的应用下载量超过了 2 亿次，并一直出现在总榜付费和免费应用排行榜的前
    100 名。


    谁能想到一个开发良好且成功的应用可以被推到如此新的高度？这些机会遍布 App Store，等待着被发现。


    如果你刚刚起步，请坚持在需求量大的领域创建应用。找到一些大多数人（从青少年到成年人）都能认为有用或有趣的东西，而不是迎合小众群体。坚持开发低风险、高概率的应用。


    这意味着你永远不应该进行创新并尝试以前没有做过的事情吗？


    实际上，是的。嗯，某种程度上如此……


    ### 从现有应用中学习


    大多数没有经验的学习者花费了太多的时间在尝试原创化上，而他们寻找的东西其实就在眼前。


    我并不是建议你复制另一个开发者的应用，但你的第一步应该是保持好奇，看看其他成功的开发者在做什么。你应该花时间研究为什么他们的应用有效，阅读用户评论并收集数据。


    每当你决定研究模仿某个应用时，问自己这六个问题：


    1. 人们为什么要买这个？

    2. 我能做什么来模仿这个想法并将其提升到另一个水平吗？

    3. 这个应用的目标群体还会喜欢哪些应用？

    4. 市场上还有多少类似的应用？（前往 [appempire.com/topappcharts](http://appempire.com/topappcharts)
    查看。）

    5. 他们的成功程度和稳定性如何？

    6. 他们的营销和定价模型是如何运作的？


    当你查看所有顶级列表时，思考哪些应用是你真的考虑下载的。你为什么喜欢它们，它们有什么脱颖之处？


    思考如何在继续吸引相同目标群体的同时，将相同的概念推向下一个水平。写下你将做出哪些改进。你会增加新功能吗？改变外观吗？增加更好的图形和营销吗？你会如何为用户提供更多价值？


    观察不仅仅一个竞争对手。下载该应用的所有成功竞争对手。学习这些应用在哪些做得好，在哪些地方有不足。决定你是否能在融入观众需求的同时，做得更好。


    我看到这种情况在 App Store 上经常发生，这里有一个我如何将模仿其他应用的力量付诸的近期示例。


    在 Apple 排名算法更改后，我开始注意到排名的变化。在日常研究中，我看到一些很少出现在排行榜顶端的应用（如表情符号应用）开始在排名中上升。我喜欢使用那些表情符号，并想做一个
    Emoji 应用，但在那时，我还没有看到市场对它们感到太兴奋。此外，大多数 Emoji 应用都是简单的，且只使用一次：为了解锁 Emoji 键盘。


    随着市场兴趣的增加，我决定仔细观察并下载了所有主要的表情符号应用。我喜欢我看到的内容，但我注意到这些应用的功能有限。如果 Emoji 键盘的表情符号数量有限且无法增加，我的应用如何能比竞争对手更好？如果一个应用只使用一次，它能有多有利可图？我认为大多数开发者会因为这些限制而放弃这个想法，但我一直很固执，这次这得到了回报。


    所以，我继续脑脑暴，直到灵光一现。如果我不能为 Emoji 键盘添加更多表情符号，为什么不在应用中包含许多表情符号，让人可以通过短信、电子邮件或其他任何可以处理图像的媒介发送呢？考虑到这一点，我创建了一个解锁
    Emoji 键盘的应用，并增加了 450 多个表情符号，可以通过短信、电子邮件、Facebook 等进行分享。这让用户变得更有趣，因为他们必须返回应用来发送表情符号。（参见图
    4.5。）


    图 4.5 Emoji 截图。


    ![image](img/f068-01.jpg) ![image](img/f068-02.jpg) ![image](img/f068-03.jpg)


    这个 Emoji 应用是在两周内开发的。它遵循免费增值模式，即免费，带有应用内购买选项。该应用在六天内进入了 App Store 效率类排行榜第一，并在总免费应用排行榜中位第
    12 名，每天收入接近 500 美元。搞定。


    ### 缩小你的想法范围


    当你进行研究时，确保捕捉你想要模仿的热门应用想法。你可能有很多想法，不知道该关注哪一个，但不要担心，这是很正常的。简化问题的一种方法是记住第 3 章提到的，应用只分两类：娱乐和工具。如果这让你的任务变得，你可以先专注于其中一种。


