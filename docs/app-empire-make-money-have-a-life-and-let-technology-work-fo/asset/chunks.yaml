    Chapter 5


    You’re the Brains and They’re the Brawn


    How to Hire Great Programmers


    Coming together is a beginning, staying together is progress, and working together
    is success.


    —Henry Ford


    “Wait, wait wait. How do you expect to create an app if you’re not a programmer?”
    His words pierced through my superficial layers of confidence and left me feeling
    confused, speechless, and wondering the same thing.


    I responded with a quick, defensive, “Hire someone, of course.”


    Without a skip of a beat he immediately followed with, “Okay. Well, how do you
    find those people?”


    Again my answer was less than smooth. I remember becoming frustrated and wishing
    I hadn’t bragged about my million-dollar app idea in the waiting room of my doctor’s
    office to an 88-year-old man who didn’t even know what an iPhone was. Nevertheless,
    he was right, and I didn’t have the slightest clue what I was talking about. I
    figured there had to be a way, and I was going to turn over every rock I could
    to find the answer.


    Later that day, I boarded a plane back to Vermont to continue my recovery at my
    family’s house. Fueled by my frustrations with the conversation earlier in the
    day, I bought a fresh copy of Macworld, a magazine about all things Apple, hoping
    to gain some insight about apps. I started flipping through it and landed on a
    quarter page ad that read “TURN YOUR APP IDEA INTO $$$.” It was an ad from a software
    development company that was offering iPhone app development services. Jackpot.
    I will show you, you cynical waiting room critic, I thought to myself.


    Meanwhile, as I was taking in every bit of information the ad had to offer, the
    pilot had started his “Ladies and gentleman, blah blah, thank you for flying with
    us, blah blah” spiel. When I was done with the ad and looked up full of excitement,
    he was completing his announcement, with “Sit back, relax, and enjoy the ride.”
    Little did I know that his words were not only meant for that plane ride but also
    for my app adventure, which was about to take off.'
