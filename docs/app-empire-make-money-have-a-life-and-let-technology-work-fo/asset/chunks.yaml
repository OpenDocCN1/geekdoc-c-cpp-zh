- fmt: "\nBy networking with other appreneurs, I have learned tips that doubled and\
    \ tripled my income and strengthened my winning mindset. I learn and pick up new\
    \ ideas from others, and I contribute to their app world as well, growing their\
    \ business.\n\nAs an end note, applying the same techniques in this chapter has\
    \ given me the mental and physical strength that I needed to overcome my accident\
    \ and build a successful app company. I have total certainty they will serve you\
    \ as well.\n\n# What I Learned\n\n1.\n2.\n3.\n\n# Actions to Take\n\n1. As yourself\
    \ these questions and write down the answers:\n    * What’s my why, and how will\
    \ my life change when I get it?\n    * What can I see myself doing in the app\
    \ business to make money? What’s my passion?\n    * What do I want to do with\
    \ the freedom I will have?\n    * How committed am I to making this work, and\
    \ how important is it that I succeed?\n    * When and how am I going to check\
    \ in daily on my winning mindset?\n    * Who else is going to benefit from this\
    \ new way of life and money, and what will that mean to them and to me?\n2. Write\
    \ down the new empowering beliefs that you’re going to associate with every day.\n\
    \n# Chapter 3: Discover the New World\n\n## The App Store\n\nThe real voyage of\
    \ discovery consists not in seeking new landscapes but in having new eyes.\n—Marcel\
    \ Proust\n\n“Happy Friday,” the bank teller said.\n\n“Thank you. This is one of\
    \ the best days of my life!” I said, smiling from ear to ear.\n\nCashing the `$73,322`\
    \ check gave me one of the best feelings I had ever experienced. I was ecstatic\
    \ because it was more money than I had made throughout my entire life, and it\
    \ was in one real estate deal.\n\nThat deal meant more than just money to me.\
    \ It symbolized victory and a new life with new opportunities. I had worked my\
    \ butt off, struggled, through blood, sweat, and tears to realize the American\
    \ Dream that I grew up fantasizing about.\n\nWhile most guys in their early twenties\
    \ were partying, chasing girls, or vegging out and doing nothing, I found myself\
    \ reading books, studying local real estate markets, learning from successful\
    \ real estate investors, and of course chasing girls. I was hoping to emulate\
    \ them and live the life they were living. Holding the check that day after the\
    \ closing, I was grateful. All the hard work had paid off, and I had made it.\n\
    \nOn January 6, 2006, at the age of 24, I moved back to Myrtle Beach, South Carolina,\
    \ where I had gone to college, to start a real estate company, thinking I had\
    \ this industry on lockdown.\n\nEveryone was making money in real estate, and\
    \ hardly anyone anticipated that the party would end. Less than a year later,\
    \ without warning, the market tanked, and everything I had planned and worked\
    \ for fell apart.\n\nWhen it crashed, all my efforts turned into a pile of bills\
    \ minus the money to pay them. I burned through the money I had made on my first\
    \ real estate deal in seven months and had no money left to weather the downturn.\n\
    \nDesperate, I looked to one of my mentors who lived in New York. I was positive\
    \ he would have the answer, and I became furious when his magic pill was this:\
    \ “Do whatever you were doing while you were succeeding because I think you have\
    \ forgotten what you worked so hard to learn.”\n\nWhat the hell was that supposed\
    \ to mean? I thought. Two weeks later, I was brushing my teeth, and all of a sudden,\
    \ like someone coming out of a coma, I had my “aha” moment.\n\nI realized I had\
    \ been looking at the market through the lens of a real estate business owner\
    \ instead of through the eyes of a customer. I had found success earlier because\
    \ I became obsessed with researching the market and thinking like customers, meaning\
    \ the homebuyers. My ability to understand the market had always given me a competitive\
    \ edge.\n\nI realized that even in a down market, Myrtle Beach was a transient\
    \ place, and people were still looking for places to live in. I had to figure\
    \ out where, what kind of homes, and how to find those buyers.\n\nI remembered\
    \ that when I bought my house, I wanted to be in the best area, with good schools\
    \ and near the beach. I figured that other people must have specific needs as\
    \ well, and there must be data that would tell me which areas had the highest\
    \ number of transactions. So, I researched and found the hottest, most desirable\
    \ subdivisions that were doing well compared to the rest and decided to park myself\
    \ there.\n\nMy mentor had been right. If these are the hottest properties, I then\
    \ asked myself, Who’s selling houses there, and how are they doing it? What are\
    \ they doing to attract buyers and/or sellers?\n\nIt turned out that the top real\
    \ estate agents in those areas were finding buyers through small newspaper ads,\
    \ and were using specific language. That was it. I emulated their marketing strategies\
    \ and found buyers. I was able to cash in on those buyers and keep my business\
    \ alive. When the market changed, I trained myself to be present and listen, so\
    \ I could change strategies and go with it versus fighting it.\n\nThe real estate\
    \ downturn lasted longer than I anticipated, stretching my finances thin, and\
    \ though it was hard, it was a valuable experience I am grateful for. It was the\
    \ battlefield where I developed skills I needed to survive in business. I use\
    \ the same strategies with my app business with fewer headaches. I look at the\
    \ big picture, research the market, think like a consumer, and emulate the most\
    \ successful players.\n\nThe good news is that you can avoid the battle scars\
    \ and use these strategies from day one. Listen to the market, and follow the\
    \ trends. As an appreneur, the more you understand customers and give them what\
    \ they want, the bigger and more consistent your reward will be.\n\nIn this chapter,\
    \ I take you on a tour of the `App Store`, so you can navigate this powerful resource\
    \ like a pro.\n\n## GATHERING INTELLIGENCE\n\nAs with any business, your success\
    \ will be directly related to your understanding of the marketplace. The `App\
    \ Store` is the marketplace of the app business so to understand the market we\
    \ have to study the `App Store`. This seems rather obvious, but you won’t believe\
    \ how many developers I meet don’t understand this. They don’t watch the market,\
    \ follow the most successful apps, or figure out why those apps are successful.\n\
    \nMost of my success comes from my knowledge of the market. It’s as easy as that.\
    \ I make it a point to check the `App Store` every day. It’s a daily process to\
    \ see which apps are working and which ones are not. This means downloading them,\
    \ playing around with them, and seeing how they are marketed.\n\nThe more time\
    \ you spend with apps, the better you’ll understand the common traits of successful\
    \ apps and what users are looking for. The more you think like the customer, the\
    \ greater your success will be. You need to become an app addict if you want to\
    \ be a successful supplier.\n\nFor instance, a little while ago, I looked at the\
    \ top grossing apps, and I noticed a big change. Until recently, many of the top\
    \ grossing apps were paid apps, but a lot of them have become free (see `Figure\
    \ 3.1`). When I noticed this trend, I asked myself what was happening and why.\
    \ I took a closer look at the top-grossing free apps. I downloaded several of\
    \ them and saw that developers were beginning to take advantage of in-app purchases\
    \ by offering lots of additional, useful paid features within the free apps.\n\
    \n```\nFIGURE 3.1 Top grossing apps: 19 out of 25 are free.\n![image](images/f038-01.jpg)\n\
    ```\n"
  raw: 'By networking with other appreneurs, I have learned tips that doubled and
    tripled my income and strengthened my winning mindset. I learn and pick up new
    ideas from others, and I contribute to their app world as well, growing their
    business.


    As an end note, applying the same techniques in this chapter has given me the
    mental and physical strength that I needed to overcome my accident and build a
    successful app company. I have total certainty they will serve you as well.


    What I Learned


    1.


    2.


    3.


    Actions to Take


    1\. As yourself these questions and write down the answers:


    *   What’s my why, and how will my life change when I get it?


    *   What can I see myself doing in the app business to make money? What’s my passion?


    *   What do I want to do with the freedom I will have?


    *   How committed am I to making this work, and how important is it that I succeed?


    *   When and how am I going to check in daily on my winning mindset?


    *   Who else is going to benefit from this new way of life and money, and what
    will that mean to them and to me?


    2\. Write down the new empowering beliefs that you’re going to associate with
    every day.


    Chapter 3


    Discover the New World


    The App Store


    The real voyage of discovery consists not in seeking new landscapes but in having
    new eyes.


    —Marcel Proust


    “Happy Friday,” the bank teller said.


    “Thank you. This is one of the best days of my life!” I said, smiling from ear
    to ear.


    Cashing the $73,322 check gave me one of the best feelings I had ever experienced.
    I was ecstatic because it was more money than I had made throughout my entire
    life, and it was in one real estate deal.


    That deal meant more than just money to me. It symbolized victory and a new life
    with new opportunities. I had worked my butt off, struggled, through blood, sweat,
    and tears to realize the American Dream that I grew up fantasizing about.


    While most guys in their early twenties were partying, chasing girls, or vegging
    out and doing nothing, I found myself reading books, studying local real estate
    markets, learning from successful real estate investors, and of course chasing
    girls. I was hoping to emulate them and live the life they were living. Holding
    the check that day after the closing, I was grateful. All the hard work had paid
    off, and I had made it.


    On January 6, 2006, at the age of 24, I moved back to Myrtle Beach, South Carolina,
    where I had gone to college, to start a real estate company, thinking I had this
    industry on lockdown.


    Everyone was making money in real estate, and hardly anyone anticipated that the
    party would end. Less than a year later, without warning, the market tanked, and
    everything I had planned and worked for fell apart.


    When it crashed, all my efforts turned into a pile of bills minus the money to
    pay them. I burned through the money I had made on my first real estate deal in
    seven months and had no money left to weather the downturn.


    Desperate, I looked to one of my mentors who lived in New York. I was positive
    he would have the answer, and I became furious when his magic pill was this: “Do
    whatever you were doing while you were succeeding because I think you have forgotten
    what you worked so hard to learn.”


    What the hell was that supposed to mean? I thought. Two weeks later, I was brushing
    my teeth, and all of a sudden, like someone coming out of a coma, I had my “aha”
    moment.


    I realized I had been looking at the market through the lens of a real estate
    business owner instead of through the eyes of a customer. I had found success
    earlier because I became obsessed with researching the market and thinking like
    customers, meaning the homebuyers. My ability to understand the market had always
    given me a competitive edge.


    I realized that even in a down market, Myrtle Beach was a transient place, and
    people were still looking for places to live in. I had to figure out where, what
    kind of homes, and how to find those buyers.


    I remembered that when I bought my house, I wanted to be in the best area, with
    good schools and near the beach. I figured that other people must have specific
    needs as well, and there must be data that would tell me which areas had the highest
    number of transactions. So, I researched and found the hottest, most desirable
    subdivisions that were doing well compared to the rest and decided to park myself
    there.


    My mentor had been right. If these are the hottest properties, I then asked myself,
    Who’s selling houses there, and how are they doing it? What are they doing to
    attract buyers and/or sellers?


    It turned out that the top real estate agents in those areas were finding buyers
    through small newspaper ads, and were using specific language. That was it. I
    emulated their marketing strategies and found buyers. I was able to cash in on
    those buyers and keep my business alive. When the market changed, I trained myself
    to be present and listen, so I could change strategies and go with it versus fighting
    it.


    The real estate downturn lasted longer than I anticipated, stretching my finances
    thin, and though it was hard, it was a valuable experience I am grateful for.
    It was the battlefield where I developed skills I needed to survive in business.
    I use the same strategies with my app business with fewer headaches. I look at
    the big picture, research the market, think like a consumer, and emulate the most
    successful players.


    The good news is that you can avoid the battle scars and use these strategies
    from day one. Listen to the market, and follow the trends. As an appreneur, the
    more you understand customers and give them what they want, the bigger and more
    consistent your reward will be.


    In this chapter, I take you on a tour of the App Store, so you can navigate this
    powerful resource like a pro. You’ll learn how to spot which criteria people are
    using when buying apps, and turn the App Store into your own personal ATM.


    GATHERING INTELLIGENCE


    As with any business, your success will be directly related to your understanding
    of the marketplace. The App Store is the marketplace of the app business so to
    understand the market we have to study the App Store. This seems rather obvious,
    but you won’t believe how many developers I meet that don’t understand this concept.
    They don’t watch the market, follow the most successful apps, or figure out why
    those apps are successful.


    Most of my success comes from my knowledge of the market. It’s as easy as that.
    I make it a point to check the App Store every day. It’s a daily process to see
    which apps are working and which ones are not. This means downloading them, playing
    around with them, and seeing how they are marketed.


    The more time you spend with apps, the better you’ll understand the common traits
    of successful apps and what users are looking for. The more you think like the
    customer, the greater your success will be. You need to become an app addict if
    you want to be a successful supplier. This mindset has been the lifeblood of my
    success.


    For instance, a little while ago, I looked at the top grossing apps, and I noticed
    a big change. Until recently, many of the top grossing apps were paid apps, but
    a lot of them have become free (see [Figure 3.1](#Chapter03.html_figure3-1)).
    When I noticed this trend, I asked myself what was happening and why. I took a
    closer look at the top-grossing free apps. I downloaded several of them and saw
    that developers were beginning to take advantage of in-app purchases by offering
    lots of additional, useful paid features within the free apps. Apple had introduced
    in-app purchases as a tool for developers to sell content within their apps some
    time before that, but it took a while for developers and users to take full advantage
    of them. Users love that the apps are free, and they can pay for additional features
    if they want them.


    [FIGURE 3.1](#Chapter03.html_figureanchor3-1) Top grossing apps: 19 out of 25
    are free.


    ![image](images/f038-01.jpg)'
