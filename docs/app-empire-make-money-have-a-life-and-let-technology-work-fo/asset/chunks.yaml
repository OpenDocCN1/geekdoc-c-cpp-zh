    # Chapter 2: Install This First


    ## The App Millionaire Mindset


    I’ve missed more than 9,000 shots in my career. I’ve lost almost 300 games. 26
    times, I’ve been trusted to take the game winning shot and missed. I’ve failed
    over and over and over again in my life. And that is why I succeed.


    ——Michael Jordan


    After my car accident, I spent over a year and a half in post-op rehabilitation.
    The doctors told me I wouldn’t be able to use my dominant arm in a normal way
    again.


    What?


    An avalanche of thoughts crashed through my head.


    No more basketball? No throwing a baseball with the kids I don’t even have yet?
    I’m not even married. How is a woman going to feel about being with me now? I
    can’t hold a door open for her anymore. How can I have sex if I can’t hold myself
    up? I can’t drive? I can’t write? I’m a man. How am I going to have a full life
    for myself and my family if I can’t use my arm? I’m only 27 years old!!!


    These thoughts screamed in my head, echoing in an endless dark cave. Although
    I had moments when I was driven and determined to prove the doctors wrong, I was
    crushed inside and scared.


    Each day, I went through two hours of torturous physical therapy, trying to rebuild
    the muscles in my left arm, straining to develop some sort of range of motion.
    Sheer pain pulsated throughout my body, turning into total and complete despair
    after each session. After the daily battle, I would inhale pain medication and
    sit up in my oversized `La-Z-Boy` in agony for the remainder of the day, defeated.


    I had the same questions before the accident that many people have, like, What
    was my life about? and What was I going to do next? Afterwards, I had other questions
    too: How was I going to regain the use of my arm? If that weren’t enough of a
    problem, how would I make enough money to pay the $100,000 in medical bills I
    had racked up?


    The pain was excruciating, and since I wasn’t able to lie down, I couldn’t sleep.
    At one point, I hadn’t slept well for five weeks, and the fatigue was taking a
    mental and physical toll. I was in so much pain, I felt like giving up for good.


    That’s when I hit my lowest point. I was alone one afternoon, and my mind went
    to a dark place. I wasn’t even grateful for surviving such a horrid wreck. Instead,
    I wondered why I had survived.


    I was awake, heavily medicated, tears streaming down my face.


    Suddenly, something inside me screamed, like a loudspeaker at an airport.


    You were meant for more than this! the voice said. Fight, `Chad`. Fight! Don’t
    give up. You can still have the life you want. You just have to believe and make
    it happen.


    I’m not sure what happened that day, or where that voice came from. Call it my
    `Creator`, call it my voice of reason, but that voice had such a profound effect
    on me that I knew I had no choice. I had to listen and from that moment on, in
    all that darkness, I had a glimpse of the possibility of a life that I had all
    but given up on, and hope began to slide in through the cracks.


    Everything started to change. For the first time, I understood the importance
    and the strength of one’s beliefs and faith. I decided I didn’t want to be an
    extra in the movie of my life anymore. It was time to be the writer and the producer.


    I haven’t looked back since and guess what? The movie of my life has been an epic
    that gets better every day.


    As you embark on this journey, I ask you to listen to your own loudspeaker. Believe
    in yourself and your app business. Trust your inner cheerleader, and silence the
    nagging victim because great things will come of your efforts.


    ## Winning Beliefs in the App Business


    Maybe you’re thinking, “But `Chad`, I’ve got a good mindset. After all, I’m reading
    this book, right?”


    Well, in the app business your mind plays games with you by saying things like,
    “I don’t know software . . . I don’t have the money . . . I’ve never run a business.”
    We all have beliefs that affect everything we do. When we shift our core beliefs,
    we shift our outcomes. Let me help you change your beliefs about running an app
    business, so you can have the life you want.

