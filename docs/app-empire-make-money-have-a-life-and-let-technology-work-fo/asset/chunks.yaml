    到此时，你已经找到了程序员、筛选了他们、签署了保密协议（NDA）、传达了你的想法、收到了几份报价，并选择了与他们合作的人。与其双脚投入一个完整的项目，我我通常会先让他们在一些小任务上进行测试。每当我与新程序员合作时，我都会有系统地要求他们完成以下三件事：


    1. **图标**——要求程序员创建并交付 App 图标。图 5.2 是你在 iTunes 或手机上查看 App 时看到的图片。在你概述了 App 构思之后，你可能对图标也有几个想法。将这些想法传给他们，并要求提供一个完成的
    512 × 512 iTunes 艺术版本的图标。他们会知道这意味着什么。


    图 5.2 应用图标。


    ![image](img/f091-01.jpg)


    2. **“Hello, World!”应用**——要求程序员写一个“Hello, World!”应用。这只需要他们花 10 分钟就能完成，这是一个简单的应用，打开后会显示一个显示“Hello,
    World!”（参见图 5.3）。程序员会知道这是什么。这里的目的不是测试他们的编程技能，而是确定他们将如何向你交付 App 进行测试。这个应用应该包含图标，这样你可以看到它在手机上的样子。


    图 5.3 Hello, World!


    ![image](img/f092-01.jpg)


    3. **App 交付**——当程序员准备好向你展示 App 的测试版本时，他们必须创建一个名为“ad hoc（内部测试）”的版本。这个 ad hoc 版本的
    App 在测试之前需要安装你的手机上。过去安装过程有点繁琐，但一项名为 `TestFlight` 的新服务简化了这个过程（[appempire.com/testflightapp](http://appempire.com/testflightapp)，参见图
    5.4）。我要求所有程序员使用这项服务，即使他们以前没用过。他们能够学会如何，而你只需要在手机上点几下即可安装你的测试 App。


    图 5.4 `TestFlight` 服务。


    ![image](img/f092-02.jpg)


    我从不花费超过几百美元，但这项测试帮助我看到图形处理能力、实现速度以及整体工作动态（如沟通和时区）。你希望从一开始就良好开始，或者在需要时尽快退出，而这就是实现这一点的最佳方法。


    在 Skype 面试期间提到你喜欢用这项测试开始工作。这样做可以确保程序员在提供报价后不会感到惊讶。有时他们乐意免费完成这项测试，但有时他们会想要小笔费用。无论哪种情况，都要明确这项要求，并让他们将其包含在报价中。


    如果你已经选择了程序员，并且对初始测试的结果表示满意，那么你已经在创建第一个 App 的良好道路上了。但如果你对结果不满意，不要犹豫，继续下一个。


    寻找程序员的过程可能需要一些时间，但这些时间是值得的。不要走捷径。这将帮助你避免未来出现不必要的延迟、成本和挫败。你将一直寻找为团队增加新人才，因此学习如何快速、有效地评估程序员是一项重要的技能。


    # 如何管理程序员


    寻找优秀的程序员可能需要大量精力。诀窍在于每天对他们进行妥善管理，以保持他们的愉快和业务的健康。以下是我在管理程序员方面学到的一些教训。


    ## 紧跟项目进展


    在某个时候，你可能会决定聘佣程序员全职工作。在此之前，你将与公司和独立程序员合作，他们会同时运行多个项目。这可能导致你和程序员之间的信息流不够理想。他们可能不会像他们需要的那样，专注于向你汇报进度。如果不加控制，这可能导致项目耗时比预期的要长，并且最终产品与你的设想不符。你是项目经理也是业务负责人，你的任务是保持事情步入正轨，而不是期望程序员为你做这一点。


    这是我早期处理得不好的地方。我曾让开发人员慢慢来，没有勤恳地检查进度。我学会了在报价过程中询问里程碑和时间表。这让我能够在编写第一行代码之前，就知道 App
    在每个里程碑将长什么样、如何运行，以及项目需要多久。我会定期跟进并审查哪些是有效的，哪些仍然需要调整。我们从头到尾都是这样反复。大多数应用程序在设计和开发过程中会经历多次迭代，在我对每个里程碑完全满意之前，我不会支付部分款项。不要让你的飞机偏离航太久，否则你最终可能会在南极冻得瑟瑟发抖。


    ## 慢招快开


    一旦你掌握了几个 App，并且你与开发人员或开发团队的合作看起来很顺畅，你可能想要聘用其中一人全职工作。虽然按需要使用外包商的灵活性很棒，但危险在于其他客户也可以聘用他们。


    一旦你觉得对某些程序员的工作感到满意并且开始赚钱了，就把他们锁定。我有几个人是按月支付服务金留任的。如果你发现问题，例如响应不及时或工作草率，请迅速止损并开除他们。如果你这样做，他们可能会成为你公司的负担。像任何分手一样，你应该友好地道别。这只是业务，你不想得罪处理你资产的人。


    开除程序员最好的方法是明确说明他们没有达到你的预期，你想停止工作。尽可能地挽救工作成果并对程序员进行合理的补偿，但要尽快离开，并将其视为学习教训。


    # 如何测试你的 App


    恭喜。你已经完成了所有的开发里程碑，并拿回了你的 App。在开启香槟之前，你还需要做几件关键的事情。如果你在盖房子，在签字验收之前，你会希望一切运行正常。你会检查从屋顶、水水等主要项目，一直到护墙线条或任何视觉上的小细节。你需要对你的
    App 做同样的事情。


    首先，App 必须按照预期运行。拿出你的初始设计文档，检查每一个功能。永远不要假设某个功能在上次测试时是有效的。每次都要测试每个功能，特别是最后发布之前。不要在这里停止，因为作为自己
    App 的创建者，你了解一切应该如何工作。这对你来说是有意义的，但对其他人可能不是。


    如果你在大型软件开发公司工作，你会有一个高薪工程师团队来戳、推、扭转和拉伸你的 App。作为一个独立的、自雇的应用创业者，你可能没有这些资源。然而，你可以利用我们人都拥有的资源来实现同样的效果：亲家人计划。你的任务是让你认识的所有人（从
    75 岁的奶奶到 12 岁的侄子）来测试你的 App。


    你花在测试上的时间是至关重要的，因为你会看到消费者如何使用你的产品，哪些是简单的，哪些他们不理解，以及他们的习惯。他们提出的问题是你不会产生的，因为你设计了这款
    App，关于它的切对你来说显而易见。


