    tried changing the name and keywords, and it didn’t move much. The one thing I
    hadn’t tried was switching it out of the Entertainment category. Since it was
    more of a utility app anyway, I decided to move it to the Utility category. The
    reason I had placed it in the Entertainment category was the app contained various
    alarm sounds, like loud screams or gunshots. I assumed users would use it more
    as a goof than as a tool, but I was wrong.


    Once I moved the app into the utilities category, the number of downloads skyrocketed.
    After five days, the paid downloads nearly tripled, and it was only because of
    a category change. If I wasn’t constantly working and improving the low performers,
    I could have easily missed this change that paid off in a big way.


    One of the questions I often get is, “How long should I test a tweak?” When you
    tweak something to make it better, measure the results for about one week before
    you make other changes. You’ll see quickly if your improvements are producing
    positive results.


    Keep your budget in mind. A lot of these tweaks won’t cost you any money like
    changing the title, keywords, description, and categories. You should try those
    first. You can make some changes to the icon and screenshots, but keep costs as
    low as possible. Do not dump thousands of dollars into your improvements while
    you’re still testing the market demand for your app and trying to recoup your
    investment. Work on improving the app only after you have gained traction with
    your marketing tweaks.


    I recommend you set up a specific time you check in with your stats on a daily
    basis. Set up a routine that works for you and stick to it. When you are reviewing
    your stats and asking yourself the questions above, you will have many ideas for
    improvement. Make sure that these don’t get lost. Capture and implement them one
    by one. Keep track of your changes and follow up with them because otherwise you
    will be unable to learn which of your changes had a positive effect. You can check
    out [appempire.com/trackchanges](http://appempire.com/trackchanges) for a spreadsheet
    that will allow you to easily track your changes.


    PAYING ATTENTION TO REVIEWS


    Another good way to find what you need to improve in your apps are your app reviews.
    The App Store allows people who have downloaded your app to rate it (one to five
    stars) and leave a brief text review. (See [Figure 7.6](#Chapter07.html_figure7-6).)
    You will get more reviews as your apps gain popularity. Some of them will be great,
    some not so much. Cue violin and tissues. It’s crucial to view user reviews as
    constructive criticism. They may show you that you have a bug in your app you
    don’t know about or reveal certain features that a lot of users would like to
    see.


    [FIGURE 7.6](#Chapter07.html_figureanchor7-6) Reviews of Angry Birds.


    ![image](images/f127-01.jpg)


    Launching the Tic Tac Toe app was another great lesson for me about the importance
    of reviews. In its first version, the app flashed a sign when people won a game.
    But multiple reviews mentioned that there were no sounds, and that they wanted
    to be able to play against their friends. I used the customer feedback and had
    my developer add sounds and a multi-user feature. After that, one of the previous
    reviewers came back and said, “Hey, thanks for the change. These sounds are great.”
    You could see it made that customers happy, and it was great marketing for the
    app.


    As bad reviews can have a negative effect on your income, positive reviews can
    bolster sales. Reviews that are funny, exciting, and give credibility to your
    app will convert more customers. If the reviews are great, you may want to include
    them in your app description.


    Something else you can do to get more feedback is to check your reviews from other
    parts of the world. It helps to get a perspective of how your apps are being received
    globally. You can use the AppFigures service to check what people in different
    counties are saying about your apps. AppFigures will translate the reviews for
    you. These translations are not perfect, but most of the time you will get the
    message. Priceless.


    CUTTING YOUR LOSSES


    Like most businesses, the app business is a numbers game. Some apps are going
    to work, and some aren’t. Sometimes apps don’t perform as expected even if you
    have an awesome icon, exciting screenshots, an appealing name, and a well-designed
    app. This is why I don’t spend a lot of money to begin with until I see a demand
    in the market for the app. After you’ve tried to improve your app and its marketing
    elements based on the suggestions mentioned earlier in this chapter for three
    to four months, it’s time to move on and focus your energy on a different app.
    Like any relationship or investment, cutting losses is difficult, but it’s vital
    for you and your business.


    For instance, I had created a paid app called Flashlight, which used the iPhone’s
    camera flash to turn the phone into a flashlight. For about nine months, the app
    did alright. I noticed sales were falling. I focused on improving the core marketing
    components for a few months yet the app’s sales still declined. At that point,
    I had to decide to cut my losses and stop investing time and money in the app.
    I decided to make Flashlight a free app and use it to funnel traffic to my other
    apps. Although Flashlight never became a huge money maker, it contributed to the
    overall ecosystem of my app business funneling traffic to my other apps.


    Now that you understand the importance of measuring and how to tweak your apps,
    in the next chapter, you’re going to learn how to increase your firepower with
    some advanced marketing techniques.


    What I Learned


    1.


    2.


    3.


    Actions to Take


    1\. Sign up for AppFigures or App Annie and start becoming familiar with these
    tools.


    2\. Sign up for Flurry to track activity within your apps.


    3\. Decide what activity to track within your apps and why that information is
    important.


    4\. Set up a schedule to check in with the stats daily.


    5\. Create a simple spreadsheet to measure your changes.


    Chapter 8


    Ninja Techniques that Will Grow Your Business


    Advanced Marketing Tips and Tricks


    Notice that the stiffest tree is most easily cracked, while the bamboo or willow
    survives by bending with the wind.


    —Bruce Lee


    Once I figured out that being able to market myself was essential, my confidence
    and ability to attract people soared. I felt as though I had discovered some type
    of superpower, and I was never going back. I went on a few dates and even ended
    up getting together with the beautiful blue-eyed girl, Vicky, whom I had struck
    out with at the freshman party. As we got to know each other, like at the start
    of any relationship, everything was new, exciting, and magical.


    “I’m in love,” I proclaimed to my college roommate Jeffrey, who smirked and rolled
    his eyes. Without a warning, a few months in, things began to change. As the relationship
    got more serious, there were expectations we each had that the other wasn’t meeting.
    The honeymoon was over. I needed to understand more to keep the relationship alive
    and thriving.'
