    the nag screens of your paid apps because that will really annoy your users. But
    you never know when you might decide to make one of your paid apps free for a
    certain amount of time. You want to have the freedom to turn that app’s nag screen
    on and direct its traffic to another app in your app network, especially if it
    takes off and starts generating lots of traffic. If you don’t, you could lose
    out on a lot of money.


    PROMO PAGES


    If the nag screen is your most important cross-promotion tool, your promo page
    will be your second most important (see [Figure 8.3](#Chapter08.html_figure8-3)).
    Unlike the nag screen, you can cross-promote more than one app at a time, and
    that is the power of the promo page. This is essentially a section of your app
    that lists all of your other apps and the apps of the developers with whom you’re
    cross-promoting.


    [FIGURE 8.3](#Chapter08.html_figureanchor8-3) Promo page example.


    ![image](images/f139-01.jpg)


    The promo page example shows several apps covering the entire page. Users are
    able to scroll down to see more listed apps. Keep this page simple like the nag
    screen. Only include the icon, title, and a short description of the apps that
    you are promoting. Make sure your short description is enticing, and avoid clutter
    at all costs. You need to have an arrow at the right side of each app. This shows
    users they will get more information when they touch the banner, and it’s a subtle
    call to action.


    Each one of those banners links to the promoted app. When users touch the banner,
    they are taken to the App Store to review and download that app. This is a powerful
    tool to further increase sales. I’ve tested several color schemes for the promo
    page and have found that the bright gray and dark gray banner background color
    scheme of the App Store works best. I recommend you do the same if you want to
    maximize the click-through rates of your promo pages.


    Each one of the banner positions of your promo page will be worth a certain amount
    of money based on the daily traffic of your app. The higher the banner position,
    the more money it is worth because it gets more visibility and thus users click
    on it more often. For example, if one of your apps is getting 10,000 downloads
    a day, you can assume that a certain number of your users will enter your promo
    page. Let’s say 25 percent of the 10,000, which is 2,500 users. If you can generate
    sales from only 10 percent of those users who have entered your promo page, you
    will have another 250 sales, which is about $175\. And that’s from the promo page
    of only one of your apps.


    You might wonder how to direct people to the promo pages in your apps. Every one
    of your apps needs to have a button with the word “More” on it prominently displayed
    in the main page or menu section inside of your app. (See [Figures 8.4](#Chapter08.html_figure8-4)
    and [8.5](#Chapter08.html_figure8-5).) That’s all. I’ve tested many other promo
    button labels like “More apps,” “I,” or “+,” but “More” had the greatest click-through
    rates. When users hit the more button, they are taken to my promo page, which
    has a back button to return them to where they were before.


    [FIGURE 8.4](#Chapter08.html_figureanchor8-4) Example of a More button.


    ![image](images/f141-01.jpg)


    [FIGURE 8.5](#Chapter08.html_figureanchor8-5) Another example of a More button.


    ![image](images/f142-01.jpg)


    Your More button must be highly visible. One way to do this is to give it some
    bright color or a glow effect to draw your users’ attention. You might think you
    don’t want to be too aggressive with your advertising, but remember the nag screen
    discussion above. You have to get some traffic on your promo page so you can show
    your users all the other cool apps that you or others have created.


    Some developers decide to be more subtle and place the promo page button hidden
    somewhere where users have to move through several pages to see it. Another issue
    is that the promo page button sometimes blends in too much and doesn’t grab the
    users’ attention. If you’re going to do that, then you might as well not have
    a promo page because you will be diminishing its effect. Your users must see it
    as soon as they open the app.


    The reason why it’s so important to get a lot of traffic to your promo page is
    because, along with the nag screen, your promo page is where all your app network
    magic happens. Each banner that’s linking to another one of your apps in your
    promo page is creating a link between those two apps. The sum of these links will
    make up your app network. So, link away, my fellow appreneur.


    How do you set up a promo page? The concept is similar to the nag screen. Whoever
    sets up your nag screen should create your promo pages, so you’ll have an integrated
    system.


    Your promo page will be a useful tool to cross-promote with other developers.
    The reason you want to cross-promote with others is this can increase the number
    of people who see your apps. Your apps will be visible to your own app network
    and to the app network of the developers you’re cross-promoting with. How do you
    do it? Throw their apps on your promo pages and ask them to do the same for you.
    Instant traffic boost.'
