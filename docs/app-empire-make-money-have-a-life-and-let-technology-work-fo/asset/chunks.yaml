- fmt: '

    We like to think we’re indispensable, but that is true for only certain aspects
    of your business. The trick is identifying those and allowing yourself to let
    go and delegate everything else.


    When should you start growing your team? At first, like any startup, you’ll have
    to put in some sweat equity and grow as necessary. You will most likely only be
    working with the programmers you hired to create and manage your first apps. At
    some point, when your income and workload increase, you will want to scale your
    business. Saying when that will be is difficult, but I’ve found that many people
    wait far too long. They think they should add team members when they have made
    a lot of money or are making a specific amount of money per month.


    I recommend you scale as soon as you can even if this takes away from your bottom
    line because you can use the additional free time you’ll get to double or triple
    your business income. Another way to decide if you should start hiring is by asking
    yourself these questions:


    *   Am I the bottleneck of my business and will hiring someone allow my business
    to grow faster?

    *   Am I spending most of my time on little tasks that someone else can do, as
    opposed to focusing on key aspects?


    If the answer to these questions is yes and you’ve got the funds, it’s time to
    scale up so you can spend your time on tasks that will bring in the most amount
    of money.


    # Setting Up Your Team


    The ultimate goal is to hire qualified people you can trust. Do your due diligence
    and follow the strategies outlined in Chapter 5 for hiring programmers. A lot
    of them apply to other hires as well. I often start people part-time. I always
    give them a one- to three-month test period and let them know this is what I’m
    doing. If I’m excited about their performance during the test period, I will make
    them permanent team members. If not, I let them know it is not the right fit and
    move on.


    Your team members’ visions must align with yours. If not, those people can sabotage
    the company, and their discord can spread like a virus. You might have potential
    hires take a personality test like the Myers-Briggs Type Indicator (`MBTI`), so
    you know if the candidate’s personality type is compatible with your team. Do
    not cut corners when hiring people. You can find cheap labor, but that can result
    in poor quality work or drama that will cost you much more.


    In addition to programmers and graphic designers, you will need team members who
    can handle other technical issues such as analyzing statistics, marketing your
    apps, setting up systems, and performing administrative work. Have an accountant
    and a lawyer on hand, too.


    A fully scaled app team has eight positions: programmer, graphic designer, project
    manager, marketing manager, data analyst, technical assistant, accountant, and
    lawyer. Depending on your needs and your team members’ skills, you could have
    one person covering several positions when you’re scaling up. As you grow, you
    might need several people for each position.


    ## 1. Programmer

    The role and importance of programmers has been discussed in detail in Chapter
    5. They will create your apps and initially be your entire team. When it comes
    to programmers, have several on call so not everything comes to a halt when a
    programmer becomes unavailable.


    ## 2. Graphic Designer

    In Chapter 5, we also discussed graphic designers. They will create the visual
    components of your apps and your marketing materials. You want them to be part
    of your programmer’s development team. They can be independent contractors but
    development will be much smoother if the programmer and graphic designer are under
    one roof.


    ## 3. Project Manager

    Project managers play the most critical role on your team. They will manage everybody
    else and report back to you. They have to be versatile and be able to handle all
    parts of the business. They need to understand your vision and communicate with
    your team members to ensure the moving pieces are heading toward your vision.
    When you get started, you will be the project manager, but I suggest you find
    somebody for this role as soon as possible and when financially feasible. This
    will allow you to focus on the company’s direction while the project manager is
    handling daily operations.


    Once I started making money, I decided to bring in my friend who was running his
    own app business and gave him 10 percent of the company. He was the one who told
    me to get into the app business in the first place so it seemed like a good fit.
    He became an integral part of the team, and we doubled and then tripled our income.
    We did so well that we started two more companies together, which became equally
    successful. I would not recommend giving away 10 percent of your company unless
    you’re 100 percent sure that person will bring extreme value.


    ## 4. Marketing Manager

    Marketing managers should be current with all marketing tools and tactics to get
    your apps more downloads. These people constantly check the market, learn what
    strategies work, and implement them. They collaborate with data analysts to see
    how your app network is performing and create tweaks. These managers will write
    marketing copy and suggest changes that increase the app’s traffic and sales conversions.
    This is a critical position because things are always changing, and the marketing
    manager has to stay current.


    In my business, this is my role. I don’t outsource it because it is my strength.
    One of the reasons for my success is that I check the market every day and adapt
    quickly. If you don’t do this job, hire a high-level person who has proven himself
    or herself in the app marketing business.


    ## 5. Data Analyst

    The data analyst’s primary job is to collect and assess every piece of data your
    business is generating. This includes downloads, sales, user analytics, app rankings,
    and so on. This person constantly looks at all of your data and is responsible
    for helping the marketing manager determine what areas need improvement. You want
    someone who can look at the numbers, see the trends, and give advice.


    ## 6. Technical Assistant (TA)

    A `TA` helps with daily technical tasks. These include submitting app updates,
    testing apps, and changing app names, nag screens, and promo pages. This is a
    vital role because the technical assistant is in the trenches. He or she ensures
    all of the project manager’s orders are executed quickly and correctly. The `TA`
    needs to be available at all times. This person needs to be tech savvy and meticulous.
    There is no room for error here since something as simple as a mis-pointed nag
    screen can cost you several hundred dollars a day.


    ## 7. Accountant

    You must have an accountant on your team. She pays all my bills and balances my
    accounts. I approve the payments, but I don’t deal with paying anyone, and that
    frees up my time to work on something else. She pays the taxes, monitors my accounts,
    and gives me tax advice. She looks at the overall business budget and the budget
    for individual apps to see if expenses are where they should be.


    Your accountant is an independent contractor and will work for you on an as-needed
    basis. Spend some time finding the right one because the accountant is critical
    to your financial success.


    ## 8. Attorney

    You need a seasoned attorney on your team to create the nondisclosure and contractor
    agreements that all of your subcontractors will sign. The documents you sign with
    your independent contractors will protect your intellectual property. In most
    cases, you can use standard agreements, but you should still have your attorney
    examine them. Find an attorney who has expertise with technology and start-ups.


    # Remote Management

