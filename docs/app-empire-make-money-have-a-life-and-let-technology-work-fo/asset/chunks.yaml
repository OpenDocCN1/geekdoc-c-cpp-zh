    you might even have a skip in your step. I know I do.


    What I am suggesting is a huge U-turn for many people who feel married to their
    business or job. Traditional entrepreneurs and businessowners are led to believe
    this is how it is supposed to be. I fell into this trap myself but to benefit
    from the app business, you need to relinquish control and divorce yourself from
    many aspects of your business.'
