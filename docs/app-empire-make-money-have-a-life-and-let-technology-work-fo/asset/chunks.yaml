  trans: '

    让我们来看看评估你 App 想法的过程。首先，根据你的研究，写下最多五个你最有前景的想法。如果你还没有任何想法，为什么不去 `App Store` 看看能不能找到一些灵感呢。


    ## 我的前五个 App 想法


    1.

    2.

    3.

    4.

    5.


    ## 评估你的想法


    根据我在 `Chapter 3` 中向你展示的清单来评估你的想法。这里再次列出来。对于你的每一个 App 想法，检查它具备的八项特征。


    1. 有趣/娱乐性

    2. 直观

    3. 具有吸引力

    4. 上瘾性

    5. 价值

    6. 跨文化

    7. 出色的图形/音效

    8. 病毒式传播


    勾选的特征越多，你成功 App 的机会就越大。我通常会检查其中的每一项，但可能会选择一个缺少一两项特征的想法。划掉任何少于六项特征的 App，然后回到起点。继续进行这个练习，直到你有三个符合六项或更多这些特征的想法。


    ## App Store 审核指南


    在选择你的前三个想法时，还需要记住 `App Store` 审核指南。这些规则是 `Apple` 在审核过程中使用的规则，如果你不遵守它们，你的 App 将被拒绝。例如，你可能以前在
    `App Store` 上见过大量的臭屁 App 或手电筒 App。结果，`Apple` 决定不再接受那些类型的 App。了解这些规则可以节省你大量的时间和精力。如果你发现你的任何想法与指南冲突，就拒绝它们并继续考虑下一个。


    确保你现在或在本章结束时完成这个练习。一旦你在下一章中找到了使用这些方法的开发者，我们就会为你的前三个想法获取报价。


    ## 时机决定一切


    在决定采用哪种 App 想法时，另一个关键因素是时机。因为市场目前似乎还没有准备好接纳你的想法，并不意味着未来不会发生变化。


    例如，在康复期间，我发现瑜伽对于恢复我的活动范围非常有帮助。我变得对其充满热情，并考虑为其他瑜伽爱好者创建一个 App。我去了 `appempire.com/topappcharts`
    并搜索了“yoga”。那大约是 2009 年 11 月左右。


    我发现没有任何瑜伽 App 在排行榜上名名前茅，即使在健康与健身分类中也是如此。尽管我对瑜伽充满热情，但我必须听从数据。市场还不够大以容纳这个 App。


    两个多年以后，在 2011 年 8 月，我看到一个瑜伽 App 在健康与健身分类中排名第二。在那时，市场已经足够大，让我考虑花时间在一个瑜伽 App 上了。


    如果我在两年前就创建一个瑜伽 App，我能通过它赚钱吗？当然可以，但由于可见度低，该 App 成功的概率会很低。是的，时机决定一切。


    同样，你可能对市场来说太早了，也可能太晚了。确保不要陷入“分析瘫痪”。在某个时刻，执行是执行的时候了。如果你看到了你认为可行的东西，请立即行动。App 想法可能有有限的机遇窗口，你可不想错过它。你希望在所关注的市场仍然火热时发布你的
    App。


    ## 小步快跑


    这里有一个价值百万美元的问题：你有 25,000 美元。你可以选择创建一个需要五个月开发并花费 25,000 美元的 App，或者创建 10 个每个开发需要两周且花费
    2,500 美元的 App。你应该遵循哪种策略？遗憾的是，大多数开发者选择第一条路线。他们认为自己有一个惊人的想法，并投入了大量的时间和金。这太冒险了，因为无论你如何选择你的
    App 想法，在市场中测试它们之前，你并不知道它们是否会被接受。


    我的 App 策略是创建简单、低成本的 App，这些 App 与市场中已经证明成功的 App 相似。知道你的想法是否成功的唯一方法是在市场中进行测试。你需要弄清楚客户对你的想法是否有兴趣，以及在你花费过多资金并把所有功能都堆进去之前，你是否可以做好营销。在市场接受了你的产品，并且你对
    App 的目标群体和生命周期有了更好的了解之后，你可以升级并添加功能。


    测试市场的最佳方法是先发布一个免费 App。免费 App 通常成本较低，因为通常它的功能较少。它具有成本效益，而且对消费者的入门门槛最低，因为它是免费的。毕竟如果你不能免费赠送你的
    App，你如何让人们付钱呢？不要担心，即使在测试市场时，免费 App 也有大量的钱可以赚。在 `Chapter 9` 中，我会解释如何做到。


    确保你能尽可能以成本效益的方式创建你的 App，而不必图形或核心功能上偷工。如果你无法以合理的价格开发你目前的想法，就把它搁起来，先尝试你的其他想法。


    正如你在这一章中看到的，选择热门 App 想法背后其实有一套方法。这是一个可以重复的过程，你使用得越多，你就会变得越好。现在你已经有了所有这些想法，是时候寻找能够将它们变为现实的开发者了。


    ## 我学到的


    1.

    2.

    3.


    ## 需要采取的行动


    1. 观察市场并列出你想要模仿的 App。

    2. 市场渴望这个吗？

    3. 看看是否有方法改进现有 App 的功能和营销。

    4. 根据你的研究、Apple 指南和时机选择你的最佳想法。

