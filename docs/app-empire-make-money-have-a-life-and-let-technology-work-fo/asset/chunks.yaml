  trans: "\n\n在我获得本地化建议后，我找到了其他国家的人来将我的应用翻译成他们的语言，并更新了应用以在 App Store 中发布这些翻译。在我的应用提供其他语言版本的第一周，我的收入比例从\
    \ 80/20 变变为 60/40。这并不是因为我来自英语国家的收入下降了，而是因为我的国际收入增加了。\n\n我需要几周时间来实现翻译，但我立即看到了新语言带来的差异。一旦我添加了俄语、西班牙语、法语、德语和葡萄牙语（仅列举几个），我的收入几乎翻了一番。\n\
    \n需要记住的一点是，在将应用本地化到其他地方之前，它必须在主要的英语市场（美国、英国、加拿大和澳大利亚）成功。先通过基础营销手段让它运行起来，以确保获得稳定的下载量。如果它在这些主要市场中不成功，那么它在世界其他地方也不可能成功。\n\
    \n要让本地化生效，你必须让其他国家的人容易发现并使用你的应用。此外，翻译需要符合当地文化。其他国家的人说不同的语言，使用单词的方式也不同。除了准确将单词翻译成其他语言外，细微差别和俚语在某些语言中有意义，但在另一些语言中则没有。不要廉价翻译，除非你想浪费时间、金钱并让自己头疼。是的，这是我的经验之谈。\n\
    \n以下是本地化应用的三个建议：\n\n1. **寻找目标语言的母语者。** 使用母语人士，而不是那种会通过在线翻译器运行单词的人。我曾付给一家公司 400\
    \ 美元将一个应用翻译成六种语言，其中一种德语。在请一位说德语的朋友查看后，我发现翻译得很糟糕。现在有很多在线翻译服务。你可以通过查看国际聚会小组、外国语言学校或大学实验室来寻找翻译人员。你可以在\
    \ Elance 或 oDesk 上发布广告。\n\n   例如，我曾翻译过我们其中一个包含“phone”一词的应用。显然，“cell phone”在德语中的翻译是“Mobiletelefon”或“Funktelefon”。这些是德国人能理解的准确翻译，但没有人使用这些词。德语中的常用术语是“Handy”。如果你使用非母语人士，你可能会忽略这些区别，而这可能意味着在该市场中应用大火与失败的区别。\n\
    \n2. **确定在目标国家有效的方案。** 一旦你找到了母语人士，要解释一下应用业务的营销方面。他们必须理解，他们翻译的是营销文案，这些文案在他们的语言中需要像在英语中一样有效。这意味着他们的英语必须和母语一样好。要求他们使用他们语言中常见的术语和短语。\n\
    \n   他们在翻译关键词方面也需要做得出色。人们将使用这些术语来搜索你的应用。在英语中流行的关键词在德语中可能没用，反之亦然。翻译人员必须知道这一点，并必须使用最适合他们语言的关键词。让他们更好地理解的一种良好方法是让他们查看他们母语环境的\
    \ `App Store`。他们可以查看已翻译的竞争应用，感受他们的翻译将如何被使用。他们可以进行关键词研究，协助为他们的语言选择正确的关键词。\n\n3.\
    \ **针对主要市场进行翻译。** `App Store` 可了 120 多个国家。这些国家并非所有都能产生像主要市场那样的收入。因此，将你的应用翻译成每可能的语言是没有意义的。想法是先关注大市场，如果合适，再继续在较小的市场进行翻译。目前，顶级市场是美国、中国、英国、加拿大、德国、法国和西班牙语市场。始终关注大市场以及新兴市场。其他一些国家也将加入主要市场的行列。\n\
    \n翻译将让你的国际应用网络进入“极速”模式。一旦你的应用开始获得关注，请立即实施这些翻译。\n\n## 重新投资你的业务\n\n当你扩大业务规模并赚钱时，你必须对业务进行再投资。你通过对现有应用再投资以及投资新应用来实现这一点。花钱升级你的应用、提供专业版本或刷新它们的外观将增加流量或留住现有客户使其回头。许多开发者都错过了这一步，因此他们的业务会遇到瓶颈。\n\
    \n投资新应用将补充并增长你的应用网络。记得我提到过要建立一个长期业务（一个金矿），而不是创造一个昙花一现的作品吗？如果你只守着一两个应用运行，你的业务就会走到尽头。要创建一个能赚大量钱并支持你新生活的可持续应用公司，你必须不断创建新应用。\n\
    \n我的一位开发者朋友有一条规定，他的公司每月需要推出两个新应用。无论他是在工作还是在新西兰的山区徒足，他的团队都清楚这个目标，并总能达成。为你自己的增长增长设定目标并追求它们。\n\
    \n## 你的后端\n\n当我刚开始时，我只有几个应用，所以很容易管理营销的各个方面。我手动更改我的提醒屏幕（nag screens）和促销页面。我会登录\
    \ `LinkShare`，获取联盟营销链接等。这在开始运行良好，但随着我创建了更多应用，手动管理一切消耗了更多时间。钱在进，但我的头都快炸了。我知道存在更好的方法，于是和我的业务合伙人谈了谈，我们决定开发软件来自动化和优化整个过程。\n\
    \n我们需要能够简化管理我们所有提醒屏幕和促销页面的东西。我们希望它们能被翻译，以便更有效地变化国际流量。确保我们获得所有的国际联盟营销佣金是重务之急。为了简化整个过程，我们创建了一个简单的数据库。这个数据库包含了我们所有的提醒屏幕、带有翻译的促销页面以及所有正确的国际联盟营销链接。\n\
    \n然后我们在应用中添加了代码，使它们能够识别地区和语言。每当我们的任何应用被打开时，它都会检查用户的地区（国家）和语言。这些信息可以在用户的设备设置中找到。应用与我们的后端数据库通信并获取所需的信息。如果将地区设置为德国、语言设置为法语的用户打开\
    \ `Fingerprint Security`，应用会与我们的服务器通信并向用户显示法语提醒屏幕和法语促销页面，但国际联盟营销链接将是德国的。这个过程既酷又高效。\n\
    \n我们努力的结果就是我们所称的 App Empire Network（应用帝国网络）。它增加了额外收入，我可以管理我应用帝国的所有关键方面。我提到这一点是因为你最终会想要创建一个这样的后端系统，以节省时间并提高你的利润。查看我们关于如何设置这些内容的截图，请访问至\
    \ `appempire.com/software`。\n\n你不需要这样的设置就能成功，特别是在开始阶段，但一旦你开始增长并需要管理大量应用，完全集成的后端系统可以将你的业务提升到一个新的水平。\n\
    \n## 出售你的应用业务\n\n"
- fmt: '

    One of the biggest, most over-looked ways to cash in on the app gold rush has
    nothing to do with selling your apps on the App Store. It has to do with selling
    your turn key app business. Due to the mobile app boom and the potential for strong
    cash flow with little overhead, many companies all over the world want to acquire
    app businesses.


    They have four reasons for this:


    1. It’s the hottest industry around.

    2. It’s more turnkey than most businesses.

    3. It’s easily scalable, with low overhead.

    4. The profit margin of a successful app company is hard to match.


    My companies had over 35 million downloads, up to six figures a month of income
    with an 80 percent profit margin, required me to work only 10 hours a week, and
    had almost no customer support requests. It is a dream business/life, and everyone
    wants a piece of it.


    So, what can you do to set things up to be attractive to a buyer? Start your business
    with the goal of selling it in mind. That means keeping good records and automating
    as much as possible. Set it up to be a turnkey business for potential buyers.


    When it’s time to sell, use business brokers. They will get a 10 percent commission
    on the sale, but they will find and screen buyers for you while you are running
    and growing your business. Before you know it, serious buyers will be lining up
    at your door. I recommend using `AppsRevolution` (`appempire.com/apprevolution`);
    they are the leading experts at buying and selling app businesses. I used them
    when I sold `Empire Apps` and my two other app companies. They handled everything
    from start to finish without any hiccups.


    The amount of money you’ll get for your business is going to depend on many factors
    including your revenue. Some business go for as much as five times their annual
    revenue, but this will depend on your personal situation. Ask for a good portion
    of the cash upfront, and maybe even get the rest over time. Doing this will show
    the buyers you’re vested in their success and you won’t disappear after training
    them. This may seem a bit far out for you at the moment, but remember how fast
    the app business moves. Two of the companies I sold had been in operation for
    only eight months!


    Now that you are a lean, mean monetization machine, you don’t want to become a
    slave to your business as your operations grow. So, let’s look at outsourcing
    and what to monitor next.


    ## What I Learned


    1.

    2.

    3.


    ## Actions to Take


    1. Create free, premium, and freemium apps.

    2. Create free apps that push traffic to your paid apps.

    3. Sign up with `AdWhirl`, `iAd`, `AdMob`, and `Millennial Media`. Implement `AdWhirl`
    in all of your apps to ensure you’re getting 100 percent fill rates.

    4. Sign up with `LinkShare`, `TradeDoubler`, and `DGM`. Use affiliate marketing
    links in all of your apps.

    5. Add as many in-app purchases into your apps as you can.

    6. Translate your marketing material into other languages.

    7. Reinvest a certain portion of your revenue in new and existing apps.

    8. Once you have many apps, start thinking about an integrated backend.

    9. Once your app empire is up and running, consider selling your business.


    ## Chapter 10: Cruise Control


    ### How to Automate and Monitor Your Business


    The price of anything is the amount of life you exchange for it.

    —Henry David Thoreau


    Bang! Crack! Boom!


    The sounds echoed off the lake like cannons shooting from old pirate ships.


    “Light it!”

    “Run!”


    I heard the laughter through the volley of shots piercing the night sky. Sprinting
    off the dock like a mad man, I made it to where everyone was standing, and dropped
    down to catch my breath.


    I looked up to take in the moment. The professional fireworks I had lined up looked
    exactly like the ones you usually see in major cities on special occasions. Every
    extravagant burst sporadically illuminated my 80-year-old grandparents who were
    watching in awe. Turning right, I saw `Matty J.`, my old high school buddy, and
    the rest of my family members, smiling from ear to ear, eyes glued to the sky.


    Every year since I was 18, I would imagine renting a lakefront camp during the
    summer and inviting all my friends and family. Year after year, my dream was put
    on hold because of a lack of funds and time and because of my own doubts. I would
    get lost in a pile of papers and mindless work thinking no other way existed.
    Typically, my Fourth of July and holidays were spent working and missing out on
    the excitement around me that I pretended not to notice.


    This year was different. While coming down the mountain from heli-skiing in Whistler,
    Canada, I remembered that Fourth of July was around the corner. I immediately
    called my assistant, `Super Kate`, to find the perfect lakefront camp, and set
    everything up for my friends and family.


    Being able to spend time with my family and friends without distractions from
    work was priceless. I understood, after all these years, what life was all about.
    I will never forget the happiness I felt that week.


    Even after I had my app business figured out and was making good money, it took
    me about a year to put a system in place that allowed me to run my business on
    cruise control while enjoying the lifestyle I had been craving.


    Later on that evening, for a second, my thoughts drifted to my app business. I
    realized I needed to text my programmer to redirect some of our nag screens to
    our new app, which Apple had approved. He was in Germany at the time, and he made
    the changes. I completely forgot about it again and continued to enjoy the evening.


    The next morning, while lying in bed and going through my numbers on my iPhone,
    I saw that sales had jumped the previous day by 40 percent to roughly $2,500!
    It was all from that one move that took two minutes. I was blown away.


    Having a reliable and dependable team is liberating. I don’t have to be at my
    business from nine to five because my team members get work done and support me.
    I can think of ideas spontaneously throughout the day and make them happen even
    while shooting off fireworks in a random lake half world away.


    Before setting up my system, I had trouble delegating and outsourcing, and I didn’t
    have an effective way to monitor my business. Once I figured out how to outsource
    and monitor pivotal areas of my business, changed. I was able to track my business,
    checking stats and managing my team on my iPhone every morning, even when I was
    on vacation.


    In this chapter, I show you ways to do the same thing and put your business on
    cruise control so you will have time to do what you love. That’s why we got into
    this business, remember?


    ## Be Dispensable


    By now, you have researched many app ideas, launched a few apps, marketed them,
    and started making money. The goal is to grow your business without adding more
    work for yourself. You do this by hiring a team. Your trusted team will help you
    leverage your time, while you are taking a zip line in Costa Rica, taking your
    spouse on vacation to Paris, or checking something off your bucket list.


    The peace that comes from knowing you can count on others to work on your business
    when you’re away is priceless. Your efforts become more calculated. You spend
    your time optimizing the areas of your business needing your attention, while
    maximizing your free time. This efficiency puts you in a more relaxed and positive
    frame of mind, and work doesn’t feel like work anymore. Once you reach this level,
    you might even have a skip in your step. I know I do.


    What I am suggesting is a huge U-turn for many people who feel married to their
    business or job. Traditional entrepreneurs and businessowners are led to believe
    this is how it is supposed to be. I fell into this trap myself but to benefit
    from the app business, you need to relinquish control and divorce yourself from
    many aspects of your business.

    '
