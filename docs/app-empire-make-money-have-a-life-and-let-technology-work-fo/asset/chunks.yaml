    *   `Apple iOS` ([http://developer.apple.com/programs/register/])—Registration
    requirements include a fee of $99 per year and accepting the terms of service.

    *   `Android` ([http://developer.android.com/guide/index.html])—Registration requirements
    include a fee of $25 per year and accepting the terms of service.

    *   `BlackBerry` ([http://us.blackberry.com/developers/])—Registration requirements
    include a $200 fee for every 10 apps you publish. You must have a BlackBerry World
    App Vendor Agreement in place with `RIM`, the creator of BlackBerry to to distribute
    apps.


    # Future Trends


    As mentioned earlier, consumers love the convenience of instantly getting something
    they want. People like the ability to see their loved ones during a phone call.
    Text messaging is outpacing e-mail and voicemail messages because it’s simple
    and immediate communication. Apps fit in with this on-the-go lifestyle.


    As the price of phones drop and more people buy smartphones, the app market will
    be expanding even faster. People’s desire and immediate need for real-time information
    is spreading like wildfire.


    The mobile lifestyle is here to stay. The trends all point to an increasingly
    mobile lifestyle, which means more opportunity for developers.


    # Top 10 App Trends


    Looking into the crystal ball of the app industry, research firm `Gartner`, `Inc.`,
    predicts these top 10 trends:


    1.  **Location-based services**. More consumers will use apps that offer more
    intelligent service based on their current geographic location.

    2.  **Social networking**. People will spend more time socializing online, using
    apps that support activities such as web conversations and photo sharing.

    3.  **Mobile search**. People will integrate information searches with action,
    such as ordering a pizza or finding a tennis store.

    4.  **Mobile commerce**. Consumers will buy more products using their phones.

    5.  **Mobile payment**. Customers at stores will pay for goods and services through
    their phones.

    6.  **Context-aware service**. Apps will offer consumers more personalized experiences
    by customizing services based on personal interests, history, schedule, favorite
    activities, and more.

    7.  **Object recognition**. Apps will allow consumers to recognize the user’s
    surroundings, including specific objects of interest. The apps will rely on the
    camera functions to do this.

    8.  **Mobile instant messaging**. Mobile instant messaging systems will start
    to integrate more interactive elements, such as video. Such app services may replace
    traditional phone use.

    9.  **Mobile e-mail**. More people will send and receive e-mails via their mobile
    phones.

    10. **Mobile video**. Mobile phones will have bigger screens and higher resolutions.
    Meanwhile, phone carriers will partner with video services, such as `YouTube`
    and `Vimeo` to offer high-definition viewing through phones.


    # Build a Gold Mine


    The stats show you that the app industry is the next gold rush. However, you have
    to treat this like a business and not a get-rich-quick scheme. Your gold mine
    needs to be supported by a solid foundation: a positive and focused mindset and
    the skills to understand the market and grow your business.


    In the next chapter, I share with you the winning mindset for making money in
    the app business. It will require a shift in thinking and an open mind, but the
    rewards can be substantial. Your mindset is the key to building a thriving business
    and the life you want.


