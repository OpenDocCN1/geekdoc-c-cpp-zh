- fmt: "\nAfter I got the localization tip, I found people in other countries to translate\
    \ my apps into their languages and updated my apps to get the translations released\
    \ in the App Store. The first week after my apps were available in other languages,\
    \ my revenue split went from 80/20 to 60/40. It wasn’t because my revenue from\
    \ English-speaking countries had declined but because my international revenue\
    \ had increased.\n\nI needed a couple of weeks to implement translations, but\
    \ I immediately saw the difference the new languages made. Once I added Russian,\
    \ Spanish, French, German, and Portuguese, to name a few, I saw my income almost\
    \ double.\n\nOne thing to remember is that your app must be successful in the\
    \ major English-speaking markets (United States, United Kingdom, Canada, and Australia)\
    \ first before it makes sense to localize it to others. Get it working with your\
    \ marketing basics first so you have consistent downloads. If it isn’t successful\
    \ in one of these major markets, chances are it’s not going to be successful in\
    \ the rest of the world.\n\nFor localization to work, you must make your app easy\
    \ to find and use for people in other countries. More than that, the translation\
    \ needs to be appropriate to the culture. People in other countries speak different\
    \ languages and use words differently. Beyond accurately translating the words\
    \ to other languages, nuances and colloquialisms will make sense in some languages\
    \ but not in others. Don’t translate on the cheap unless you want to waste time,\
    \ money, and give yourself a headache. Yes, I speak from experience.\n\nHere are\
    \ three recommendations for localizing your apps:\n\n1. **Find a native of your\
    \ target language.** Use somebody who is a native speaker and not somebody who\
    \ will run the words through an online translator. I paid a company 400 dollars\
    \ to translate an app into six languages, one of which was German. After having\
    \ a German-speaking friend take a look, I discovered the translations were bad.\
    \ Lots of online services for translations exist. You can find translators by\
    \ checking out international meet-up groups, foreign language schools, or labs\
    \ at universities. You can also place an ad on Elance or oDesk.\n\n   For example,\
    \ I was translating one of our apps that have the word “phone” in it. Apparently,\
    \ the translation of “cell phone” in German is “Mobiletelefon” or “Funktelefon.”\
    \ These would be proper translations Germans would understand, but nobody uses\
    \ them. The common term in German is “Handy.” If you use a nonnative speaker,\
    \ you may miss these distinctions, which could mean the difference between having\
    \ a hit app in that market or not.\n\n2. **Determine what works in your target\
    \ country.** Once you have found native speakers, explain a bit about the marketing\
    \ aspects of the app business. They must understand they are translating marketing\
    \ copy that needs to be as effective in their language as it is in English. This\
    \ means their English has to be as good as their native language. Ask them to\
    \ use terms and phrases common in their language.\n\n   They also need to do a\
    \ great job when it comes to translating the keywords. People will use these terms\
    \ to search your apps. A keyword popular in English may not be useful in German\
    \ and vice versa. The translators must know this and must use keywords best for\
    \ their language. One good way to get them to understand better is to have them\
    \ check out the `App Store` in their native language. They can look at competing\
    \ apps that have been translated and get a feel for how their translations will\
    \ be used. They can do keyword research to assist in selecting the right keywords\
    \ for their language.\n\n3. **Translate for the major markets.** The `App Store`\
    \ is available in over 120 countries. Not all of these countries generate as much\
    \ revenue as the major ones. Therefore, it wouldn’t make sense to translate your\
    \ apps into every possible language. The idea is to focus on the big dogs first\
    \ and continue with translations in smaller markets if it makes sense. Currently,\
    \ the top markets are the United States, China, United Kingdom, Canada, Germany,\
    \ France, and the Spanish-speaking markets. Always keep an eye on the big markets\
    \ as well as the emerging ones. Some others will join the ranks of the major ones.\n\
    \nTranslations will put your international app network on hyper speed. Implement\
    \ them as soon as your apps begin to gain traction.\n\n## REINVESTING IN YOUR\
    \ BUSINESS\n\nAs you scale your business and are making money, you must reinvest\
    \ in your business. You do this by reinvesting in your existing apps and investing\
    \ in new apps. Spending money to upgrade your apps, offering professional versions,\
    \ or refreshing their look will increase traffic or keep your existing customers\
    \ coming back. Many developers miss this step, and therefore, their business hits\
    \ a plateau.\n\nInvesting in new apps will replenish and grow your app network.\
    \ Remember when I mentioned building a long-term business, a gold mine, rather\
    \ than creating a one-hit wonder? If you ride your one or two apps, your business\
    \ will run its course. To create a sustainable app company that makes a lot of\
    \ money and supports your new lifestyle, you have to keep creating new apps.\n\
    \nOne of my developer friends has a rule that his company needs to come up with\
    \ two new apps every month. Whether he’s working or hiking through the mountains\
    \ of New Zealand, his team is aware of this goal, and it always meets it. Set\
    \ your own goals for growth and pursue them.\n\n## YOUR BACKEND\n\nWhen I started\
    \ out, I had only a few apps so it was easy to manage various aspects of my marketing.\
    \ I changed my nag screens and promo pages manually. I would log on to `LinkShare`,\
    \ and grab the affiliate links and so on. This worked well at the beginning, but\
    \ as I created more apps, manually managing everything consumed more time. Money\
    \ was coming in, but my head was spinning. I knew a better way existed, so I had\
    \ a talk with my business partner, and we decided to build software to automate\
    \ and optimize the entire process.\n\nWe needed something that would simplify\
    \ the management of all of our nag screens and promo pages. We wanted them translated\
    \ so we could monetize our international traffic more effectively. Ensuring we\
    \ were getting all the international affiliate commissions was a high priority.\
    \ To streamline the entire process, we created a simple database. This database\
    \ contained all our nag screens, promo pages with their translations, and all\
    \ the correct international affiliate links.\n\nThen we added code to our apps\
    \ that made them region and language aware. Every time any of our apps is opened,\
    \ it checks the users’ region (country) and language. This information is available\
    \ in the users’ device settings. The app communicates with our backend database\
    \ and is supplied with the information it needs. If users who have set their region\
    \ to Germany and their language to French open `Fingerprint Security`, the app\
    \ communicates with our server and shows users a French nag screen and French\
    \ promo pages, but the international affiliate link will be the one for Germany.\
    \ This process is cool and efficient.\n\nThe result of our efforts is what we\
    \ call the App Empire Network. It adds additional income and I can manage all\
    \ crucial aspects of my app empire. The reason I mention this is because you’ll\
    \ want to create a backend system like this eventually, to save time and to improve\
    \ your bottom line. Check our screenshots on how we set things up at `appempire.com/software`.\n\
    \nYou don’t need a setup like this to succeed, especially in the beginning, but\
    \ a fully integrated backend system can take your business to the next level once\
    \ you start growing and need to manage lots of apps.\n\n## SELLING YOUR APP BUSINESS\n"
