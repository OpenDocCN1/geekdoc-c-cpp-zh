    Just as your app will always need certain refinements due to consumer demand and
    competition, so will your marketing. What makes an app successful is improving
    it and making regular adjustments or additions to all its marketing elements.
    For most of my apps, I have changed the icon and screenshots three to five times
    and the title and description between 5 and 10 times. I change keywords almost
    every time I update apps. I always switch the categories when it makes sense.
    Keep an open mind and continue to be inspired by your observations during your
    market research.


    For example, one time, I added the term “phone” to the keywords of my free prank
    fingerprint app. This seemingly minor change propelled the app to the number one
    top overall free category. It was advertising the pro version at the same time,
    so this shot the pro version to number 27 top overall paid and had a major effect
    on some of the other apps since I was cross-promoting everything. This one change
    moved the income of the company from around $1,000 a day to about $3,000 a day.
    This is the power of tweaking your app marketing. One change can dramatically
    increase your revenue.


    When making these changes, keep your speed of implementation in mind. Whatever
    you want to do, you must do quickly. You have to have a team in place to make
    marketing tweaks because if you want to change a screenshot and it takes a month
    to do it, you’ll possibly miss out on the benefit of that change. This equates
    to leaving a certain amount of money on the table. Also, do not change too many
    things at one time because then you won’t be able to track what’s working. Do
    not mess too much with apps that are doing well since you don’t want to reverse
    your success.


    Once your customers purchase the app, the marketing doesn’t stop there though.
    You have to wow them and turn them into raving fans, so they’ll spread the word
    about your app and come back for more. You have to give them reasons to keep coming
    back to your app. These reasons may include improved functionality, new options,
    or new levels. If your customers have a positive experience with one app, they
    will likely buy more apps or upgrades.


    How do you know if your marketing is working? Analytics. They show you everything
    you need to know about what’s happening in your app. It’s crucial to the health
    of your business. So, follow along in the next chapter.


    ## What I Learned


    1.

    2.

    3.


    ## Actions to Take


    1. For each one of your new and existing apps, research the App Store for icons,
    titles, keywords, categories, descriptions, and screenshots of successful competitor
    apps.

    2. Create free apps as part of your marketing strategy.

    3. Systematically tweak your app marketing.


    ## Chapter 7: Keeping Score


    ### What to Measure to Win the App Game


    Sometimes we think we’re losing the game of life when we’re really winning simply
    because we’re not keeping score.

    —Anthony Robbins


    I stepped off the train and onto the platform in Berkeley, California, and was
    met with a blast of hot, dense air. It was an unseasonably warm day, and without
    question I was wearing the wrong outfit. I had relocated to San Francisco in hopes
    of learning more about the mobile app space and growing my business. I didn’t
    know anyone, and I felt a bit uncertain in this new city and in my business.


    I was on my way to meet a top apprenuer who had randomly emailed me the previous
    week in the hopes of networking. I wanted to make a good first impression, so
    I had to project confidence in this arena even though I had been in this business
    for only a few months.


    Alan was pleasant. We met at his favorite lunch joint, the infamous Smokehouse.
    While clogging our arteries with what he called the best burgers and hot dogs
    in America, we began to discuss the app business.


    “How many downloads do you have per day?” Alan asked.


    Not knowing the answer, but wanting to appear informed, I estimated, “Umm, we
    are doing about one to two K a day.”


    “Cool. And you have free apps with traffic pointing to your paid apps, I’m assuming?”
    he continued.


    “Uh, yeah. We are working on that right now,” I deflected.


    Dodging more questions, I asked, “How is business going for you?” Phew, I thought,
    I’d be able to avoid more questions by getting him to discuss what he did, but
    he was just getting started. He continued with his relentless barrage of questions:


    “How many active users do you have?”

    “How many banner ad clicks do you have inside your apps?”

    “Do you have a nag screen?”

    “Is it converting?”

    “You have a ‘More’ button, right?”

    “Are you translating your marketing materials into other languages?”


    After this onslaught of questions and my vague and uncertain responses, he and
    I knew how clueless I was with my own business.


    I just wanted to scream, “I don’t know!!!”


    But, why didn’t I know?


    As soon as I asked myself that question, a light bulb went off, along with a hallelujah,
    followed by an open hand slap to the back of the head, with a Homer Simpson-like
    “D’oh!” I had been unknowingly neglecting one of the most critical elements of
    my business. Could that be why I was not achieving the goals I had set for my
    business?


    I was focused and was able to develop new apps quickly, but I wasn’t following
    through on what I was creating. I wasn’t tracking my results and strategically
    improving my apps based on that data. That one seemingly minor distinction to
    measure everything was a complete game changer and allowed me to take my business
    to a new level. I could make informed decisions and adjustments on the fly and
    have measurable results.


    Tracking your app stats gives you more clarity and control over your business.


    ## THE STATS THAT MATTER


    I have found that the most important stats to track for your app business are
    your traffic, rankings, user activity, and revenue.


    ### Traffic


    Most developers look at the number of downloads their apps are generating because
    they want to know how much money they made. This makes sense and is important,
    but you must look at app downloads as your traffic. The more free and paid downloads
    your have, the more traffic you are generating.


    This traffic can be used in many ways to further monetize your apps. It’s almost
    as if each one of your apps is acting like a website that attracts a certain number
    of visitors. That visibility is of tremendous value when directed properly. I
    examine the daily downloads of every one of my apps.


    ### Rankings


    As mentioned in Chapter 3, the App Store constantly shows the popularity of apps
    based on the number of downloads and other undisclosed metrics. As talked about
    previously, Apple has top overall app charts and category-specific ones. Your
    apps must appear in these lists because of the additional visibility they provide.
    (See [Figure 7.1](#Chapter07.html_figure7-1).)

