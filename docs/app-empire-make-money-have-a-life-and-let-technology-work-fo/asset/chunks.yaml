  trans: '


    我用我的 iPhone 处理所有事情：寻找餐厅、管理员工，或者查看 App 的每日统计数据和排名。我可以在手机上点一份虾肉墨西哥饼饼，输入信用卡信息，然后去取餐或让它送上门。我可以在
    iPhone 上上瑜伽课程，而不需要去瑜伽教室。我可以在机场排队时，只需按一下按钮就能知道我的业务今天赚了多少钱。


    如果使用得当，虚拟世界可以成为简化和改善你生活各个方面的有力工具。


    随着这个虚拟世界的演变，人们期望更快速、更方便地获取许多事物。消费者需求正在发生变化，因为我们可以在手机上做更多事情，而且手机一直在我们的口袋里，随我们去往哪里。


    我们有可以控制汽车、让我们弹钢琴、教授语言、甚至识别歌曲并命名艺术家的 App。App 是至关重要的资产，它们在精简信息、增强我们生活的同时，教育并娱乐我们。有了
    App，一切的核心就是便利、便利、再便利。


    App 正在改变我们交流和传递信息的方式，让我们能够与从南非开普敦到加拿大蒙特利尔再到中国上海的人建立联系。无处不在！


    你必须理解 App 业务的这一点：其核心在于消费者如何利用这项技术与世界建立联系。你对这一点越了解，通过 App 能赚的钱就越多。


    但这个行业增长得有多快？它会持续吗？最大的玩家是谁？趋势是什么？在本章中，你将获得对该行业的本质见解，这将奠定你成功的 App 业务的基础。


    # 比互联网更大的机会！


    快讯：移动技术是下一个大大趋势，而且它仍然处于婴儿阶段，每天都在飞速增长。它正在引发一场信息革命，并创造了一个每个人都连接在一起的新时代。即使在非洲等地区，许多没有能力拥有电脑的人也跳过了电脑，转而使用智能手机。在埃及，通过手机发布的社交媒体帖子促成了推翻霍斯尼·穆巴拉克总统的革命。


    全球范围内使用的手机超过 46 亿部，足够地球上三分之二的人使用。这是一个全球市场，并且正以前所未有的速度增长。（参见`图 1.1`。）


    `图 1.1` 到 2014 年，移动互联网的使用量将超过桌面端互联网。


    ![image](img/f005-01.jpg)


    App 行业完全存在于互联网上，不需要实体存在，这使得从世界上任何地方做生意都变得容易。那么互联网呢？这是新的互联网，它正在改变我们传输和吸收信息的方式，开启了赚钱新方式的大门。它是历史上增长最快的行业，并且没有任何放缓的迹象。


    正如你以前听过的那样，时机就是一切。移动行业正处于早期，就像 1997 年的互联网一样。那些在当时看到机会的人投入了其中，并赚了巨额金钱。事实上，那些人仍然在赚钱，因为他们比大多数人拥有更丰富的经验和竞争优势。


    在早期，互联网提供了许多新颖且简单的赚大钱的方法。人们以极廉的价格购买域名，然后以数百万美元的价格卖出。他们创建实用的网站并出售广告。一些网站，如 `Google`
    和 `eBay`，变成了我们生活中不可或缺的一部分，并让它们的创造者成为了亿万富翁。多年以后，人们仍然从互联网中赚钱。人们等待进入互联网赚钱游戏的时间越长，情况就变得越困难。


    网站发生过的事情正是现在 App 和移动技术上正在发生的事情。唯一的区别是，我们经历过互联网的兴起，并习惯了对 App 革命做出更快的反应。这意味着，当互联网处于相同发展阶段时，App
    世界已经领先了它几光年。开发 App 是一个超越大众、不被落下的机会，避免在多年后说：“我真希望当时……”


    这些数字已经爆表了。根据技术研究公司 `Gartner, Inc.` 的数据，全球移动 App 总收入预计到 2014 年将爆发到 580 亿美元。随着 `Apple`
    应用商店中超过 50 万个 App，这个行业将继续增长。由于我们不断渴望获得娱乐或以更少的努力完成更多工作，可以创建的新 App 数量是没有限制的。这种需求将继续受到我们社会与生俱来的演化和增长需求的驱动。


    尽管近期全球经济出现低迷，App 行业仍在持续增长。许多市场研究人员预测移动行业将继续飙升，但我不会用更多数字来困扰你。我会说，如果你现在开始，你将遥遥领先。如果你开始得晚，你仍然会有很多机会，但为什么要等待去过你今天就能拥有的生活方式呢？


    这项业务的另一个美好之处是，你可以从兼职开始，以后再全职。Lynn Duke 就是这样创立了 `Fossil Software`，它是 `App Store`
    中顶尖的 App 公司之一。这家公司诞生于将多个简单 App 组合成一个的理念。他和他的伙伴、设计师 `Marshall Womack` 曾在一家游戏公司每周工作
    80 小时。他们的朋友给他们发了一篇文章，关于某人通过一个简单的 App 在一个月内赚了 25 万美元。


    Lynn 并不快乐，他体重增加了，经常加班，并且厌倦了漫长的一天。于是，他与 Marshall 在晚上和周末一起工作。


    # 疯狂的速度


    在电影《太空球》中，沙丘上校和黑帽必须以比光快的速度驾驶他们的太空飞船。这被称为“疯狂的速度”。这就是我认为 App 业务中正在发生的事情。技术正以疯狂的速度移动。


    想想，人类历史上的每一次重大变化都是随着技术的进步而来的。当人类发明轮子时，生活改变了。当他们创造了蒸汽机和棉纺机时，工业革命爆发了。当世界维网流行时，我们进入了信息时代。人们可以从家里或办公室与世界各地连接并通信。现在我们将互联网的力量装在口袋里，可以随时随地打电话、发短信。我们的生活确实以疯狂的速度移动。系好带，享受旅程。


    # 移动 App 趋势


    来自 `148Apps.biz` 的这些数据显示了有多少 App 以及它们是如何被使用的。我确定这些数字很快就会被超越。


    ## Apple 应用商店统计（2012 年 1 月）


    ### 应用商店活跃应用程序数量

    - 总活跃应用（可下载）：556,793

    - 总活跃应用（不再可下载）：156,412

    - 美国 App Store 显示的总应用数：713,205


    ### 应用审核延迟

    - 最大延迟：41 天

    - 平均延迟：5.26 天


    ### 应用价格分布

    - 当前平均应用价格：2.10 美

    - 当前平均游戏价格：0.99 美

    - 当前平均整体价格：1.95 美


    ### 应用类别分布（最热门类别）

    1. 游戏（96,187 个活跃）

    2. 书籍（60,707 个活跃）

    3. 娱乐（57,351 个活跃）

    4. 教育（53,819 个活跃）


