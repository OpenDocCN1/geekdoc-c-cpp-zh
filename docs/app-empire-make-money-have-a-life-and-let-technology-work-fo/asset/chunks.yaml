    免费应用可以具有完整的功能，但它们通常是其全功能对应版本的精简版。“先试用后购买”策略是一个古老的商业概念，大多数开发者会提供功能较少的免费版应用，以此向用户推销专业版（pro
    versions）。


    我们之前讨论过免费应用的重要性，但我们需要再次提到它们，因为它们将成为你变现策略的基石。免费应用有许多用途：它们是你应用网络的主要流量来源，它们是你主要的交叉推广工具（使用引导弹窗
    nag screens 和推广页），并且可以通过横幅广告、联盟营销和翻译进行轻松且有利的变现。


    ## 付费模式 (Premium Model)

    付费模式包含了 App Store 上所有的付费应用，且每当用户购买你的应用时，你就能盈利。与免费应用相反，消费者必须在尝试之前购买。这可能会成为一种阻碍因素，因此同时为你的付费应用提供由广告支持的精简版是一个好主意。初始销售不是变现付费应用的唯一途径。你还可以联盟营销、应用内购买和翻译来获得更多收益。你必须拥有付费应用，因为你会想要将大量的应用网络流量引向它们。


    ## 免费增值模式 (Freemium Model)

    免费增值模式是免费模式和付费模式的混合体。这些免费应用包含可选的付费内容（应用内购买）。其理念与免费应用一样，用户可以先尝试后购买。但与免费应用不同，免费增值应用并不是将用户送回应用商店查看并购买付费应用，而是将付费内容包含在应用内，可以通过应用内购买进行解锁和使用。这是非常强大的，因为它既提供了免费应用的流量生成能力，又兼具付费应用的销售优势。本质上，它们让你能够鱼和兼得。


    ## 横幅广告 (Banner Advertising)

    随着智能手机用户数量的增加，越来越多的广告商正转向移动广告以触达他们的目标群体（见 图 9.1 ）。作为中间商，移动广告网络负责移动广告的销售和投放。广告商可以从广告网络购买广告空间，开发者可以使用他们的应用展示这些广告。广告商从广告带来的销售中获益，而你作为开发者，则从广告中赚收入。广告网络保留
    40%，开发者获得该过程产生的广告收入的 60%。


    图 9.1 横幅广告示例。


    ![image](img/f154-01.jpg)


    如果你有一部智能手机，你可能在应用内看过的屏幕顶部或底部出现过的广告。那些应用的开发者每当这些广告显示或被点击时，都在赚钱。你应该认真对待横幅广告，因为它们可以是一项主要的收入来源。


    例如，一个前十的免费应用仅通过展示横幅广告每天就能至少赚取 500 美元。诚然，并非你所有的应用都能排在前十，但即使你只有三个应用，每个每天产生 50 美元，你也会通过广告赚到笔大钱。这大约是每天
    150 美元，每月 4500 美元或每年 54000 美元。只需要在应用中留出一小块空间放广告，不需要做任何额外工作，这非常划算。


    横幅广告中使用的术语初看起来可能像是一大堆复杂的字母汤。让我们来看一些最常见的术语。你不需要了解这些就能通过广告赚钱，但当你想要最大化横幅广告收益时，它们以后会有帮助。


    *   **展示量 (Impressions)**：每当你的某个应用向用户显示一次广告时，你就“交付”了一次广告展示。展示量通常是低收益产生源，因为不清楚用户是否看到了广告或关注了它。这更像是一种“散网式策略”，广告商为大量的展示付费，并希望广告能吸引部分用户的注意力。

    *   **点击量 (Clicks)**：用户每点击（或触摸）一次广告，就会产生一次点击。广告商愿意支付溢价获取点击，因为这意味着消费者对广告表现出了真正的兴趣。

    *   **填充率 (Fill Rate)**：广告网络并不总是能为开发者提供广告。你的填充率本质上是应用向广告网络服务器发送请求时接收到广告的百分比。理想的填充率
    100%。

    *   **CPM 或千次展示费用 (cost-per-mille)**：广告商为了获得 1000 次广告展示而向广告网络支付的价格。

    *   **CPC 或单次点击费用 (cost-per-click)**：广告商为了获得消费者点击广告而向广告网络支付的价格。

    *   **CTR 或点击率 (click-through-rate)**：消费者点击广告的次数相对于看到广告（展示量）的次数。

    *   **eCPM 或有效千次展示费用 (effective cost-per-mille)**：你的应用每 1000 次广告展示产生的收入，计算公式为：`[总收益
    / 展示量] × 1000`。

    *   **eCPC 或有效单次点击费用 (effective cost-per-click)**：与 eCPM 相同。它衡量的不是展示，而是点击。鉴于点击产生的收益高于展示，eCPC
    会比 eCPM 高。


    允许你在应用中投放广告的一些顶级广告网络包括 Apple 的 `iAd`、Google 的 `AdMob` 以及 Millennial Media。还有许多其他，但这三个是很好的起点。


    那么，你应该用哪一个？全部使用吧，因为这允许你最大化填充率。如上所述，广告网络并不总是会在你请求时提供广告。这意味着如果你只使用一个，就会错失收入。但如果你能从多个网络请求广告，在其中一个没有结果时切换呢？这可以保证
    100% 的填充率，从而最大化你的广告收入。


    这些平台中的每一个设计都是独立使用的。如果你想使用所有平台，你的程序员必须与每一个平台对接，并创建切换的逻辑。你可以这样做，但那是额外的工作。


    ## 如何使用多个网络

    使用 AdWhirl。


    AdWhirl ([appempire.com/adwhirl](http://appempire.com/adwhirl)) 是一项服务（Google 所有），它允许你在应用中集成多个广告网络，并无缝处理你的广告请求。每当你的某个应用在请求时没有获得广告时，AdWhirl
    会根据你的偏好将该请求重定向到另一个广告网络。一旦你将三个或四个广告网络连接到你的 AdWhirl 账户，你无需任何额外工作就能稳定获得 100% 的填充率。


    我最初只使用 iAds，但我的应用填充率只有 10%-50%。当我发现 AdWhirl 并将其应用到所有应用中后，我的广告收入增长了三倍。我本可以早点，但我并不知道它。这就是你的开发者网络和大师派上帮助的地方。他们会帮你更快地发现这些技术。


    AdWhirl 非常有用，因为你对一切都有完全的控制权。你可以为广告网络分配广告请求百分比。（见 图 9.2）。你可能希望将 50% 的请求交给 `iAd`，25%
    给 `AdMob`，剩下的 25% 给 Millennial Media。或者你可以在所有网络之间平均分配请求。由你选择。


    图 9.2 在 AdWhirl 上分配广告流量。


    ![image](img/f157-01.jpg)


