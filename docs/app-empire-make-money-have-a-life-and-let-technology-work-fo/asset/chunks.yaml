    This happens to everyone at one job or another, and your goal is to set this up
    so it doesn’t feel like a job. It should be fulfilling and feel more like something
    you get to do, not something you have to do. Once you create this vision, the
    momentum will pull you forward effortlessly, like a ski lift pulling you straight
    up a mountain of cash.


    To accomplish this, focus on creating apps you can enjoy and make money with.
    For example, if you like playing video games, you probably have an interest and
    knowledge in that category of apps. If you’re a photography buff, and you see
    that photography apps are popular, you can spend some time in that category and
    come up with something that other photography buffs like yourself will enjoy.


    ## Attitude


    When I was in the hospital, a buddy sent me a quote from Stephen Covey, author
    of *Seven Habits of Highly Effective People*. It was profound enough to help me
    change my attitude, and transform my thinking.


    It talks about another percentage, called the `90/10 Principle`. It says this:
    “Ten percent of life is made up of what happens to you. Ninety percent of life
    is decided by how you react.”


    What does this mean? We have little control over what actually happens to us in
    life. We cannot stop a car from breaking down, a plane from arriving late, the
    driver who cuts us off in traffic, or a deer that jumps in front of our truck.
    But we have almost complete control over how we interpret and react to the events
    of life.


    We cannot control a red light, but we can control whether we get mad or shrug
    it off while continuing to jam out to the radio. Simple, yet profoundly effective.


    After I learned the `90/10 Principle`, I realized that life isn’t meant to be
    so hard. Maybe I was sabotaging myself with my negative attitude and making things
    worse for myself. I had a choice of what to focus on, and what meaning I was going
    to give the events of my life.


    I realized that whenever people asked about my real estate business, I would say,
    “Oh, it’s horrible. It’s so hard. I’m not making any money.” I felt weak, and
    people around me would feel miserable, too. It became an endless cycle of negativity
    that manifested bad results and bad feelings.


    When I shifted my attitude, I developed an attitude of optimism and confidence.
    That made a huge difference, and took me on a new course, with a new destination.


    In the app business, things are always changing. You never know what’s going to
    happen. You will be challenged, but if you train yourself to have a strong, positive
    mind. You will have a competitive advantage over 99 percent of other developers/appreneurs.


    ## Plan


    Yes, saying you should plan is obvious, but it is true, and I’ve only realized
    the importance of this in the last few years. If you don’t plan thoroughly, then
    you are planning to fail miserably. In business, you’ll get much better results
    if you plan effectively, instead of sprinting in like a testosterone-fueled bull
    running the streets of Pamplona, Spain.


    Your plan doesn’t need to be so complicated that it prevents you from taking any
    action. Being present and aware versus uncertain about your business is more profitable
    and gives you the certainty and clarity you need to forge ahead.


    ## Flexibility


    Change is constant in this business or any business for the matter. As a business
    owner, you must be open to radically changing your apps and strategies that aren’t
    serving you, and cut the fat immediately.


    The first version of any app rarely succeeds. The goal is to remain objective
    and adapt as soon as you have real data that give you clarity in a particular
    area. If you don’t stay flexible, you will waste time and money and will lose
    motivation. If you constantly refine, you have a greater chance of succeeding.


    Because an idea doesn’t work at first, it doesn’t mean it won’t in the future.
    A little tweaking or a little time is often all that is needed.


    I have had several business failures and not every app brought in the profit I
    desired, but I learned valuable lessons and then adapted. As long as you track
    what you’re doing, and correct your course, you will keep moving in the right
    direction.


    ## Leverage/Outsource


    I have always been a creator, which means I always have wanted to do more, no
    matter what I have had on my plate. The problem with that mindset is that I was
    always working harder and burning myself out without feeling satisfied.


    App developers are notorious for this over-indulgence as well.


    If you want your business to grow, you need to outsource. You must be able to
    count on others and let go. Keith Cunningham, an accomplished entrepreneur and
    speaker, once said, “Growth and control work inversely.” The more you want to
    grow, the more you need to give up control.


    Bogged down with billing? Outsource it. Tired of answering e-mail? Outsource it.
    Can’t stand checking on developers? Let someone else do it. Outsource everything
    that drains your time and motivation. Outsource anything that takes away your
    ability to grow bigger than yourself, and have fun doing the things you like to
    do. This will ensure you have gas in the tank for any adventure that comes your
    way.


    Build a great team that supports and enhances what you are doing. This way, you
    can focus on what you do best, which is visualizing and planning the business.


    ## Presence/Focus


    You should treat your business the way you would a new relationship. Become intimate
    with your business and find the passion. The more you listen to it, nurture it,
    pay attention to it, and give it value, the stronger your relationship will become.
    If you don’t, you’ll be sleeping on the couch in no time, and it’s going to be
    uncomfortable.


    When you are present with your business, you will see better results. If you are
    not present, and if you take it for granted, your business can get off track or
    you can lose it altogether.


    The Apple App Store is a global economy that’s changing every day. If you’re not
    present with your business, constantly adapting and improving, you will get left
    behind.


    It takes discipline to keep your eyes on the prize. You must understand each component
    of your app business, which analytics can help you do. I recommend you evaluate
    what’s going on in each area: daily, weekly, and monthly. Monitor the market,
    track your results, and make course corrections.


    At one point, I was traveling so much that I wasn’t working on my business. It’s
    easy to do in this business because you’re making money, and sometimes you forget.
    One day while traveling in Canada, I realized my complacency had caught up to
    me and I needed to shift gears because the numbers were dropping.


    I put attention on my business for two to three hours a day for three weeks, but
    it was focused time. I got present and took the pulse of each section of my company.
    I knew if our marketing was hitting the mark, and I knew what we needed to change
    to make customers happy. I made my tweaks and gave my business the fuel it needed.
    By doing that, income went up 68 percent!


    It’s not just about “How much money can I make right now?” It’s about being present
    with each step of the process, for the long haul.


    ## Synergy: 1+1 = 1,000,000


    Find other like-minded people to help you grow.


    One excellent way is through mastermind groups. This is when you join a small
    group where everyone is focused on giving each other encouragement and practical
    strategies to succeed. You can share resources and grow together.


    Another way is to network with other appreneurs or developers. Find them online,
    at conferences, and in meet-up groups.


    When you network, you will find successful people to model. Surround yourself
    with people who have a positive mindset and can help you grow. Learn the easy
    way through their experiences as opposed to having to fall on your face to learn
    the hard way on your own.

