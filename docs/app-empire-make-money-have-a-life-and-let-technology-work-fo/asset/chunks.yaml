    App Store 分析工具 Chomp 每月都会发布一系列与 App Store（苹果）和安卓市场（谷歌）相关的指标，这些指标为移动市场提供了宝贵的见解（参见图
    3.3）。请注意这些统计数据，特别是消费者的兴趣和消费习惯。


    图 3.3 Chomp 的 iOS 搜索分析报告。


    ![image](img/f043-01.jpg)


    下面的图显示，App Store 上 83% 的搜索是基于功能或类别（例如益智游戏或摄影），而不是特定的应用程序名称。App Store 上有超过 50 万个应用程序，用户可能只认识、甚至根本不认识几个
    App。这种洞察力可能决定了你是睡在朋友的行垫上，还是住在俯瞰旧金山湾的顶层公寓。


    ## 开发者是如何赚钱的


    销售 App 并不需要成为一个油腻的二手车推销员，也不需要穿西装领带。对于你的业务来说，这可能是最简单的一部分。苹果单枪就彻底改变了软件发行领域。一旦你创建一个
    App 并将其发布在 App Store 上，它就可以在 120 多个国家的每一个 iOS 设备上访问。（参见图 3.4。）


    图 3.4 欧洲的应用商店。


    ![image](img/f045-01.jpg)


    对开发者来说，很好的一点是这些 99 美分的交易可以像滚雪球一样变成数百万，尤其是当它们在全球范围内全天候发生时。


    付费 App 的每次下载费用从 99 美分到 999 美元不等。大多数付费 App 是 99 美分，比如非常成功的 *Doodle Jump* 或 *AppZilla*，但极少数
    App（如名为 `BarMax` 的法考备考 App 或名为 `iVip Black` 的专属 VIP 会场 App）价格高达 999 美元。


    既然价格跨度如此，你可能会问自己 App 的最佳价格点是什么。那些随处可见的廉价商店已经给出了答案。就像那些货架上所有商品都低于 1 美元的折扣商店一样，付费
    App 定价的甜点是 99 美分。


    这是开发者来说最丰厚的价格点，我不建议以更高的价格销售 App，因为市场份额太小了。你可能会赚钱，但不太可能赚大钱，而且风险很大。


    通过以 99 美分卖数百万次下载来成为百万翁，比每个 20 美元卖 50,000 次要容易。较低的价格让你更容易销售，而通过增加下载量获得的 App Store
    榜排名带给你更高的曝光率。


    我的目标是帮助你尽早实现你想要的生活方式，这意味着尽可能快、尽可能多挣钱。如果你选择 99 美分 App 的路线，甚至是免费 App 模型，你更有可能拥有市场份额和资金来支持你想要的生活。


    一些高端游戏公司（如电子艺公司）对其付费 App 收取更高的费用，例如 4.99 美元而非 99 美分。除非你拥有数百万的品牌认可度，否则高价格点不是良策。


    尽管付费 App 仍然是开发者主要的收入来源，但免费 App 已超过付费 App 成为主要收入来源。许多开发者通过提供免费 App 创建了自己的“摇钱树”。免费
    App 可以为开发者赚取大量资金，它们是对市场进行试金石测试极极方法。你可以发现用户对你的 App 是否感兴趣，并据此调整策略。


    免费 App 有多种变现方式。有时，它们具有基本功能，并用于推广其全功能的付费版本。这个工具如此重要，以至于像 `Angry Birds` 这样成功的付费
    App 开发者也使用免费 App 将流量引向他们的付费 App。


    开发者偶尔会让他们的付费 App 在限时间内免费，以便更快地增加用户群，并给 App 一个病毒式传播的机会。


    另一种用途是通过广告或应用内购买变现的全功能免费 App。如果用户喜欢这个 App，他们将继续在 App 内购买额外的付费功能。正如你可以想象的，免费 App
    内的多次销售对开发者来说比一次性的预付费销售要有利得多。


    当客户感到无聊并停止使用时，免费 App 就会失败。不活跃的客户就是流，意味着进入银行账户的钱少了。因此，你必须通过提供额外的免费和付费功能及福利来保持用户的参与度。允许用户在
    Facebook 或其他平台上分享他们的成就，可以让 App 有机会病毒式传播。这种曝光率会引起更多人对 App 的兴趣。


    `Songify` 是使用上述技术的免费 App 的绝佳示例。该 App Allow 用户使用自己的声音创建歌曲。用户的录音会经过自动调音（想象一下 T-Pain），并叠加在
    App 提供的配乐之一上。结果是一个令人惊讶的趣味音乐杰作，让普通的浴室浴室歌者变成了格莱美奖得主。这个 App 保持了用户的参与度，因为他们可以创建新的录音并与不同的歌曲混合匹配。开发者通过提供用户可以用
    99 美分购买的额外歌曲为 `Songify` 变现并增加更多价值。用户可以使用 Facebook、电子邮件或 Twitter 发布他们的作品并向世界展示。


    我们将在第 9 章更详细地讨论 App 模式。


    ## 冲动购买


    App 因许多原因吸引买家。人们之所以花费这么多钱，以及为什么经济衰退可能不会影响核心业务，是因为购买过程是即时的。冲动购买发生在瞬间，并有一个特定的购买流程。我对许多用户进行了测试，发现
    App Store Store 的平均客户遵循以下六个步骤：


    1. 通过搜索或浏览 App Store 发现 App（参见图 3.5 和 3.6）。


    图 3.5 通过搜索发现。


    ![image](img/f048-01.jpg)


    图 3.6 通过浏览发现。


    ![image](img/f048-02.jpg)


    2. 他们查看 App 的图标。人们是视觉驱动的。他们喜欢能告诉他们 App 用法的有趣图标，例如照片 App 的相机。`Flight Control` 的图标上有一架大飞机，卡通风格提示用户这是一个游戏。


    3. 接下来，客户阅读标题并扫评分；`Flight Control`。标题说明了一切切。“如果你想要一些刺激的东西，这就是你的游戏。”凭借 9,060 个评分和
    4.5 星，该 App 的受欢迎程度毋庸置疑。


    4. 客户的目光随后落在描述上，他们在向下查看截图时会进行扫视。（参见图 3.7。）


    图 3.7 图标、名称、评分和描述。


    '
- fmt: '

    ![image](images/f049-01.jpg)


    5\. The screen shots provide great pictures and banner instructions serving as
    a visual app description. (See [Figure 3.8](#Chapter03.html_figure3-8).) Notice
    a pattern here?


    [FIGURE 3.8](#Chapter03.html_figureanchor3-8) Screenshots with banners.


    ![image](images/f050-01.jpg)


    6\. Usually they’ve bought the game after step five. If not, they may read a few
    reviews to ensure other customers liked it. At this point, they’re thinking, “Not
    bad. I guess I will buy it. Everyone else did. And, heck, it’s only a dollar.”
    (See [Figure 3.9](#Chapter03.html_figure3-9).)


    [FIGURE 3.9](#Chapter03.html_figureanchor3-9) Reviews.


    ![image](images/f051-01.jpg)


    Potential customers go through each part of this process mostly subconsciously,
    and each step has to funnel users to the next step, or they won’t download the
    app. This process takes about 10 seconds.


    ### HOOKING THE CUSTOMER


    So, how do you to turn the impulse buyer into a long-term customer? It’s well-known
    in the business world that it is five to seven times harder to get a new customer
    than it is to keep one. This is no different in the App Store. My tests concluded
    that you have to show consumers value within 30 seconds, or they will most likely
    exit your app and delete it forever. If they initially use the app longer than
    30 seconds, it’s much more likely that you will keep them as customers. As you
    can imagine, a long-term customer is worth much more then 99 cents because he
    will buy more of your apps, or purchase additional functionality within your apps,
    or even just click on your banner ads.


    I call the 10-second impulse buy together with the 30 seconds to become a customer
    the `10/30 rule`. It’s incredibly important and I design all of my apps based
    on this concept.


    ### TRAITS OF SUCCESSFUL APPS


    Every success story differs, but the most successful apps share quite a few common
    traits. The following list gives you an idea of most of those traits. In the next
    chapter, I talk about how to use this list when you are brainstorming for app
    ideas.


    When looking at an app, ask yourself if the app has these qualities:


    *   **Fun/Entertaining**—How much entertainment value does the app provide? Does
    it bring joy and excitement to users? Does it make them laugh? Like a great movie,
    a great app keeps users glued to their screens.

    *   **Intuitive**—The best apps are simple and easy to use. People can figure
    them out intuitively and quickly. Consumers shouldn’t have to read extensive instructions
    to get started. `Angry Birds` and `Doodle Jump` are masters at this.

    *   **Engaging**—How engaging is the app? Apps should be as engaging as possible
    while also showing off the innovative capabilities of the device.

    *   **Addictive**—You can’t put it down. You can’t wait to get back to it. You’re
    hooked. That’s how the best apps win their users.

    *   **Value**—the app needs to give far more value in people’s minds than what
    they paid. It should be something they use consistently and feel that they benefit
    from.

    *   **Cross-cultural**—It’s important that apps appeal to the greatest audience
    possible. The more people who understand and use the app, the greater the likelihood
    of the app becoming a hit.

    *   **Great graphics and sounds**—The top apps are like eye candy. They’ve got
    great graphics that are a treat to look at. They also incorporate high-quality
    sounds.

    *   **Viral**—Word-of-mouth is a huge form of advertisement. When people get really
    excited about an app, they share it with lots of people. Why not try to take advantage
    of free marketing?


    Below are some of the top paid apps that have stayed successful from day one.
    They share a lot of the common traits of winning apps mentioned above.


    #### Doodle Jump


    `Doodle Jump` has a cute little green creature that moves towards the top of the
    screen by jumping on ledges. (See [Figure 3.10](#Chapter03.html_figure3-10).)
    You control him by tilting your phone to the left or right. If you miss one of
    the ledges, the creature falls down and dies. It’s a fun addictive game that amuses
    the likes of many.


    [FIGURE 3.10](#Chapter03.html_figureanchor3-10) Doodle Jump.


    ![image](images/f053-01.jpg)


    The `Doodle Jump` app is a perfect example of a very simple, user-friendly, unique
    game that anybody can play. That’s why it’s been so successful. It is so easy
    that you could give your phone to anyone and they could figure it out immediately.
    One of the biggest mistakes most developers make is adding too much complexity
    to their apps making them confusing. Simplicity and ease of use is a common trait
    among almost all successful apps, and you must take note of this.


    #### Fruit Ninja


    `Fruit Ninja` is a game in which different types of fruit fly up into your screen
    at an increasing pace. (See [Figure 3.11](#Chapter03.html_figure3-11).) The goal
    is to slice and dice the fruit in half by sliding your finger across the screen
    at the correct place, using it like a ninja sword. With each piece of fruit you
    slice, you earn points. Bombs come up as well, so if you get too crazy swiping
    your finger, you hit a bomb and blow up.


    [FIGURE 3.11](#Chapter03.html_figureanchor3-11) Fruit Ninja.


    ![image](images/f054-01.jpg)


    A lot of highly successful apps such as `Fruit Ninja`, find ways of incorporating
    the innovations in a creative way. This keeps the user engaged, and excited to
    keep.


    ### SERIOUS FUN


    When I first looked at the App Store, I was blown away when I saw the number-one
    application wasn’t about saving the world or revolutionizing the way we conduct
