    在应用热潮中获利的一种最大且最被忽视的方式，其实与在 App Store 上销售你的应用无关。它与出售你的交钥匙式（turn key）应用业务有关。由于移动应用的蓬勃以及低开销产生强大现金流的潜力，全球许多公司都想收购应用类业务。


    他们有四个原因：


    1. 这是目前最火的行业。

    2. 它比大多数业务更具“交钥匙性”。

    3. 它很容易扩展，且开销低。

    4. 成功的 App 公司的利润率难以比拟。


    我的公司拥有超过 3500 万次下载，每月收入高达六位数，利润率达 80%，每周只需工作 10 小时，而且几乎没有客户支持请求。这是一个梦想般的生意/生活，每个人都想分一杯羹。


    所以，你可以做些什么来让它对买家产生吸引力呢？以出售为目标开始你的业务。这意味着要保持良好的记录并尽可能实现自动化。将其构建成一个对潜在买家来说是交钥匙式的业务。


    到卖卖的时候，使用商业经纪人。他们将获得销售额的 10% 佣金，但可以在你运营和发展业务的同时，他们为你寻找并筛选买家。没过多久，严肃的买家就会排在你的门口。我推荐使用
    `AppsRevolution` (`appempire.com/apprevolution`)；他们是买卖应用业务的领先专家。我在出售 `Empire Apps`
    和另外两家应用公司时使用了他们。他们处理了从头到尾的一切，没有任何故障。


    你为业务获得的资金将取决于许多因素，包括你的收入。有些业务的交易价格高达年收入五倍，但这取决于你的个人情况。要求预大部分现金，甚至可以分期获得剩余部分。这将向买家证明你关注他们的成功，并且不会在培训他们后就消失。这目前对你来说可能有些遥远，但请记住应用业务的发展有多快。我卖掉的两家公司仅运营了八个月！


    现在你已经是一台精简、高效的变现机器，你不希望随着业务的增长而成为业务的奴隶。所以，让我们来看看外包以及接下来要监控什么。


    ## 我学到的东西


    1.

    2.

    3.


    ## 需要采取的行动


    1. 创建免费、高级版和免费增值模式的应用。

    2. 创建将流量引导至付费应用的免费应用。

    3. 注册 `AdWhirl`、`iAd`、`AdMob` 和 `Millennial Media`。在所有应用中实现 `AdWhirl`，以确保你获得 100%
    的填充率。

    4. 注册 `LinkShare`、`TradeDoubler` 和 `DGM`。在所有应用中使用联盟营销链接。

    5. 在你的应用中尽可能增加内购项目。

    6. 将你的营销材料翻译成其他语言。

    7. 将部分收入重新投资到新旧旧应用中。

    8. 一旦你有了很多应用，就开始考虑集成式后端。

    9. 一旦你的应用帝国运转良好，就考虑出售你的业务。


    ## 第 10 章：巡航模式


    ### 如何自动化和监控你的业务


    任何东西的价格都是你为它交换的生命。

    —亨利·大卫·梭梭


    砰！咔！轰！


    这些声音在湖面上回荡，就像旧海盗船上发出的炮声。


    “点火！”

    “跑！”


    我听到密集的枪声穿过夜空中传来的笑声。我像疯子一样冲下码头，来到大家站立的地方，蹲下喘气。


    我抬头沉浸在这一刻。我安排的专业烟花看起来就像你通常在大城市的特殊场合看到的烟花一模一样。每一束奢华的绽放都偶尔照亮了我 80 岁的祖父母，他们正惊奇地注视着。向右看去，我看到了
    `Matty J.`，我的高中老同学，以及我的其他家庭成员，他们笑得合不拢嘴，眼睛紧盯着天空。


    从我 18 岁那起，每年我都会幻想在夏天租用一个湖边营地，邀请所有的朋友和家人。一年又一年，由于缺乏资金和时间以及由于我自己的疑虑，我的梦想被搁置了。我会迷失在一堆纸张和无意义的工作中，认为没有其他出路。通常情况下，我的美国独立日和节日都是在工作中度过的，错过了我假装没有注意到的周围的兴奋氛围。


    今年不同。在从加拿大惠斯勒（Whistler）滑雪雪后下山时，我想起了美国独立日快到了。我立刻打电话给我的助理 `Super Kate` 寻找一个完美的湖边营地，并为我的朋友和家人安排好一切。


    能够在没有工作干扰的情况下与家人和朋友共度时光，是无价的。在多年之后，我终于理解了生活的意义。我永远不会忘记那周感受到的快乐。


    即使在我搞定了应用业务并赚了大钱后，我还是花了大约一年时间才建立一套系统，让我能够在巡航模式下运行业务的同时，享受我一直渴望的生活方式。


    那天晚些时候，有一瞬间，我的思绪到了我的应用业务。我意识到需要给我的程序员发短信，将我们的一些引导页（nag screens）重定向到我们被苹果批准的新应用上。他当时在德国，他做了更改。我又完全忘记了这件事，继续享受那个夜晚。


    第二天早晨，当我躺在床上通过 iPhone 查看数据时，我看到昨天的销量增长了 40%，达到了约 2500 美元！全都是由于那个只需两分钟的动作。我大惊呆。


    拥有一个可靠信赖的团队是解放性的。我不需要从早九点到晚五点都待在业务里，因为我的团队成员会完成工作并支持我。我可以随心想到想法，即使在世界另一半的湖边放烟花。


    在建立系统之前，我在授权和外包方面很困难，而且我没有有效的方法来监控业务。一旦我学会了如何外包和监控业务的关键领域，情况改变了。我能够每天通过 iPhone
    跟踪业务并管理团队，即使在度假时也是如此。


    在本章中，我将向你展示如何让你的业务进入巡航模式，这样你就有时间去做你热爱的事了。这正是我们进入这个行业的原因，还记得吗？


    ## 变得不可替代


    现在，你已经研究了许多应用想法，发布了几个应用，进行了营销，并开始赚钱。目标是在扩大业务的同时不增加自己的工作量。你通过雇佣团队来实现这一点。你信任的团队将帮助你利用时间，无论你是在哥斯达加卡滑索、带配偶去巴黎度假，还是完成愿望清单上的某项任务。


