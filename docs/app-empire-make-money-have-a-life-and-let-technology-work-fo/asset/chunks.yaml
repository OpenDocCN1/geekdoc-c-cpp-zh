    \ most innovative app on the planet. All you need to do is provide value and understand\
    \ the strategies to market your apps so your customers discover and purchase them.\n\
    \nIn this chapter, I show you simple but powerful marketing techniques that will\
    \ drive traffic and get customers flocking to your apps.\n\n# DRESSED TO KILL\n\
    \nAs with any business, you will have to set yourself apart from the competition.\
    \ Your app needs to be a well-designed, quality app, but the best app in the world\
    \ won’t do you much good if people can’t find it or, when they do find it, they\
    \ are unconvinced of its value and choose not to download it.\n\nMost developers\
    \ focus almost exclusively on creating apps and severely underestimate the importance\
    \ of implementing some of the most basic marketing techniques. These techniques\
    \ are effective and won’t cost much. You should consider them part of the app\
    \ development process. As you grow your business, you can spend some money on\
    \ more advanced marketing. (I discuss this in Chapter 8.) I recommend you don’t\
    \ do this until you have seen demand for your app and have started to make money\
    \ with it.\n\nHere’s the formula for app success:\n\n`Effective marketing = Traffic\
    \ = Downloads = $$$ = Happy Business Owner`\n\nThis is a no brainer, but most\
    \ people don’t pay attention to it. The more effective your marketing, the more\
    \ people will see your apps. The more people see your apps, the more downloads\
    \ and dollars you will get. Think of it as a numbers game. For instance, assume\
    \ that you have 10,000 people looking at your app every day and you converted\
    \ only 1 percent of them. That would give you 100 downloads a day and for a paid\
    \ app that’s $70 a day which is about $2,100 a month. That’s one app with a rather\
    \ low conversion rate. So, remember that your job is to create great apps and\
    \ to put in the same time and effort to get them in front of as many eye balls\
    \ as possible. Sure, you’re going to get some visibility by being in `Apple’s\
    \ App Store`, but with so many apps there, you can’t count on that.\n\n## So,\
    \ how do you dress up an app?\n\nDuring the impulse buy discussion in Chapter\
    \ 3, we learned that users typically assess the icon, title, description, and\
    \ screenshots before downloading an app. Understanding how each of these basic\
    \ elements of an app are marketing opportunities that allow you to dress up your\
    \ app is essential to being successful in the app business. Your job is to create\
    \ a seamless flow from the icon all the way to the download button. Let’s take\
    \ a closer look at each one of these.\n\n### ICONS\n\nThe icon is the first thing\
    \ users will see when they are checking out your apps. It’s the small square image\
    \ with the rounded corners to the left of the app title. It’s also the image that\
    \ users see on their phone after they install your app.\n\nThe icon is important\
    \ because it’s how the users will identify with your app. It should capture the\
    \ essence of the app. It must look good, attract the users’ attention, and compel\
    \ them to investigate your app. It’s the visual ID of your app.\n\nThe icon is\
    \ the first impression you will make on the users. The old expression “you don’t\
    \ get a second chance to make a first impression” applies here. Would you want\
    \ to show up in your pajamas or your best suit to a job interview? Make sure you\
    \ have a quality icon that represents your app and makes the users feel it has\
    \ value.\n\nYour icon should appeal to the customers you want to attract. If the\
    \ icon displays a cute, cartoon animal, you probably won’t look in it for help\
    \ with navigation, right? Many developers create icons as an afterthought and\
    \ focus all of their effort on the app itself. It’s crucial to work with your\
    \ programmers and graphic designers during the design phase of your project to\
    \ craft the icon for your app.\n\n### APP TITLE\n\nYour title should be exciting,\
    \ snappy, trendy, and catchy. If it meets these criteria, people naturally are\
    \ going to want to check it out. But the title of your app is more than just a\
    \ name. (See [`Figure 6.1](#Chapter06.html_figure6-1)`](`Figure 6.1`.)) It is\
    \ also critical in helping users find your app when they perform a keyword search\
    \ on the app store. Each word in your title serves as the most valuable keyword,\
    \ much like keywords in search engines. Think of the title as your `URL`. If you\
    \ type “angry” into the `App Store` search field, the `Angry Birds` apps will\
    \ return as a search result.\n\n[FIGURE 6.1](#Chapter06.html_figureanchor6-1)\
    \ Top grossing app titles.\n\n![image](images/f105-01.jpg)\n\nYour title needs\
    \ to be memorable and specific to what your app does. When deciding on a title\
    \ for your app, consider other successful apps in the `App Store`. I do this often,\
    \ and ask myself the following three questions:\n\n1. Why are these titles working?\n\
    2. What makes these catchy?\n3. What terms are people searching for to find these\
    \ apps?\n\nIt helps to think about words in your title as the vehicles of users\
    \ who will find your app. It’s fun to create cute names, but it’s not so much\
    \ fun if nobody can find them.\n\nWhen naming your apps, keep in mind the `Chomp`\
