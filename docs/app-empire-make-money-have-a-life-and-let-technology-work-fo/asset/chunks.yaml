    Every one of your apps needs to have a button to the promo pages. (See [8.4](#Chapter08.html_figure8-4)
    and [8.5](#Chapter08.html_figure8-5).) That’s all. I’ve tested many other promo
    labels like `More apps`, `I`, or `+`, but `More` had the greatest click-through
    rates. When users hit the more button, they are taken to my promo page, which
    has a back button to return them to where they before.


    [FIGURE 8.4](#Chapter08.html_figureanchor-4) Example of a More button.


    ![image](images/f141-01.jpg)


    [FIGURE 8.5](#Chapter08.html_figureanchor-5) Another example of a More button.


    ![image](images/f142-01.jpg)


    Your More button must be highly visible. One way to do this is to give it some
    bright color or glow effect to draw your users’ attention. You might think you
    don’t want to be too aggressive with your advertising, but remember the nag screen
    discussion. Some developers decide to be more subtle and place the promo page
    button hidden where users have to move through several pages to see it. Another
    issue is that the promo page button blends in too much and doesn’t grab the users’
    attention. If you’re going to do that, then you might as well not have a promo
    page because you will be diminishing its effect. Your users must see it as soon
    as they open the app.


    The reason why it’s so important to get a lot of traffic to your promo page is
    because, along with the nag screen, your promo page is where all your app network
    magic happens. Each banner that’s linking to another one of your apps in your
    promo page is creating a link between those two apps. The sum of these links will
    make up your app network. So, link away, my fellow appreneur.


    How do you set up a promo page? The concept is similar to the nag screen. Whoever
    sets up your nag screen should create your promo pages, so you’ll have an integrated
    system.


    Your promo page will be a useful tool to cross-promote with other developers.
    The reason you want to cross-promote with others is this can increase the number
    of people who see your apps. Your apps will be visible to your own app network
    and to the app network of the developers you’re cross-promoting with. How do you
    do it? Throw their apps on your promo pages and ask them to do the same for you.
    Instant traffic boost.

