    5 到 10 倍。所以，如果你每天有 10,000 次下载，那么你的更新在当天可能会为你额外增加 50,000 到 100,000 次下载。虽然这些下载不会计入你的排名，而且并不是每个用户在更新后都会打开你的
    App，但即使只有小部分用户决定查看你的更新，你的日流量也可能翻倍。这将导致你的收入出现激增，并提醒用户关注你的 App。


    出于任何你能想到的理由，都要频繁地更新。不要等到你的程序员增加了 10 个功能后才提交并更新。最好是在开发出一个功能时就提交一次更新，共提交 10 次。你的用户不会介意，并且会留下你正在不断改进
    App 的印象。我将更新视为免费广告，因为你可以捕获百分比例下载更新的用户，他们会来查看增加了哪些功能。


    所以，请记住：更新 = 金钱。


