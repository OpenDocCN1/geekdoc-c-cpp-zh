    5\. 截图提供了极佳的图片和横幅说明，作为直观的应用描述。（参见图 3.8）。注意到这里的规律了吗？


    FIGURE 3.8 带有横幅的屏幕截图。


    ![image](img/f050-01.jpg)


    6\. 他们通常在第五步之后购买游戏。如果没有买，他们可能会阅读几条评论以确保其他客户喜欢它。在此时，他们正在想：“不错。我想我会买的。大家都买了。而且，，呆，这才一美元呢。”（参见图
    3.9。）


    FIGURE 3.9 评论。


    ![image](img/f051-01.jpg)


    潜在客户大部分在潜意识中经历这个过程的每个部分，每一步都必须将用户引导到下一步，否则他们就不会下载该应用。这个过程大约花费 10 秒。


    ### 留住客户


    那么，如何将冲动购买者变成长期客户呢？商界众所周知，获取一个新客户比留住一个客户要困难五到七倍。App Store 也是如此。我的测试结论是，你必须在 30
    秒内向消费者展示价值，否则他们很可能会退出你的应用并永久删除。如果他们最初使用应用的时间超过 30 秒，你更有可能留住他们作为客户。你可以想象，长期客户的价值比
    99 美分高得多，因为他们会购买更多你的应用，或者购买应用内的额外功能，甚至仅仅点击你的横幅广告。


    我将这 10 秒的冲动购买加上 30 秒内成为客户的过程称为 `10/30 原则`。它极其重要，我设计所有的应用都基于这个概念。


    ### 成功应用的特征


    每个成功故事都不相同，但最成功的应用拥有许多共同特征。以下列表让你了解大部分这些特征。在下一章中，我将讨论在对应用创意进行脑风暴时如何使用这个列表。


    在观察一个应用时，问自己该应用是否具有以下品质：


    *   **趣味/娱乐**——该应用提供了多少娱乐价值？它是否给用户带来了快乐和兴奋？它能让他们大笑出来吗？就像一部好电影一样，优秀的应用会让用户紧盯着屏幕。

    *   **直观**——最好的应用是简单易用的。人们可以直观且快速地学会它们。消费者不需要阅读详尽的说明即可开始`Angry Birds` 和 `Doodle
    Jump` 是这方面的大师。

    *   **引人入胜**——该应用的吸引力如何？应用应该尽可能吸引入胜，同时也展示设备的创新功能。

    *   **成瘾性**——你欲罢不能。你迫不及待想回到它身上。你着迷了。这就是顶级应用赢得用户的方式。

    *   **价值**——该应用在人们心中提供的价值需要远高于他们支付的费用。它应该是他们持续使用并感到从从中获益的东西。

    *   **跨文化**——应用能够吸引尽可能大的受众是非常重要的。理解和使用该应用的人越多，应用成为大热门的可能性就越大。

    *   **极佳的图形和音效**——顶级应用就像视觉盛宴。它们有极佳的视觉效果，令人享受。它们还结合了高质量的音频。

    *   **病毒式**——口碑是一种巨大的广告形式。当人们对一个应用感到非常兴奋时，他们会分享给很多人。为什么不尝试利用免费营销呢？


    以下是一些第一天起就保持成功的顶级付费应用。它们共享了上述许多成功应用的共同特征。


    #### Doodle Jump


    `Doodle Jump` 有一个可爱的的小绿色生物，它通过跳跃台阶向屏幕顶部移动。（参见图 3.10）。你通过向左或向右倾斜手机控制它。如果你错过了某个台阶，生物就会掉下去并死亡。这是一个有趣且成瘾的游戏，逗乐了很多人。


    FIGURE 3.10 Doodle Jump。


    ![image](img/f053-01.jpg)


    `Doodle Jump` 应用是一个非常简单、用户友好、独特的游戏的完美范例，任何人都可以玩。这就是为什么它如此成功。它太简单了，你把手机给给任何人，他们都能立刻学会。大多数开发者犯的最严重的错误之一就是给他们的应用增加太多的复杂性，导致它们令人困惑。简单易用是几乎所有成功应用的共同特征，你必须注意这一点。


    #### Fruit Ninja


    `Fruit Ninja` 是一款游戏，其中不同的水的水以不断加快的速度飞向你的屏幕。（参见图 3.11）。目标是在屏幕的正确位置滑动你的手指，像使用忍者刀一样将水果切开并切半。你每切开一个水果，就能获得积分。弹药也会出现，所以如果你把手指滑动得太疯狂，就会撞到弹药并爆炸。


    FIGURE 3.11 Fruit Ninja。


    ![image](img/f054-01.jpg)


    许多成功的应用如 `Fruit Ninja`，找到了以创新方式融入功能的方法。这让用户保持参与感，并期待。


    ### 严肃的乐趣


    当我第一次看 App Store 时，当我看到第一名的应用不是为了拯救世界或改变我们业务的方式时，我感到非常惊讶。


    由于来自严肃、传统的房地产背景，我对这种荒诞的性质持有怀疑。但随后我意识到：大多数 iPhone 用户寻找的是乐趣，而不仅仅是生产力。


