    # [FIGURE 7.1](#Chapter07.html_figureanchor7-1) Top paid apps rankings.


    ![image](images/f120-01.jpg)


    Tracking app rankings is something that most developers neglect because they think
    they have no control over it. That couldn’t be further from the truth. Your rankings
    are an important metric when it comes to assessing your app’s performance, and
    you can improve your rankings through various marketing techniques. I’m constantly
    focused on getting my apps ranked, and once they are in the charts, I keep close
    tabs on their rankings. If I see an app slipping in the charts, I immediately
    focus on it and figure out why that’s happening and what can be done to raise
    the ranking.


    ## User Activity


    Yes, it’s great for users to download your apps, but your ultimate outcome is
    to turn them into customers who use your app consistently. Every user interaction
    presents an opportunity to monetize your app portfolio. The only way to know if
    your users are loving your apps is to track the user activity within your app.
    The nice thing is that it’s easy with `Flurry`. You can track anything, such as
    how many times a button is being touched or how often the app is used.


    For example, at one point I saw in the reviews of one of my apps that the users
    didn’t even know how to use the app. Needless to say they weren’t happy. This
    was surprising to me because the app had an instructions page. Perplexed, I decided
    to track how many people were clicking the button to open the instructions, and
    to my surprise only five percent of users were opening them. To fix this problem,
    I made the button more visible and after that small tweak, 70 percent of users
    were clicking the instructions button. From that point on, more people left positive
    reviews and my app became more successful.


    ## Revenue


    All of the previous metrics are indicators for the most important and obvious
    metric: your revenue. You have to track your revenue every day and continuously
    observe your daily, monthly, and quarterly trends. This sounds obvious, but it’s
    easy to overlook revenue as a metric that can be tuned like the others. As soon
    as I see any positive or negative change in revenue, I want to understand what’s
    causing that activity. Do my apps have more or less traffic? Did they move up
    or down in rankings? Has user activity increased or decreased? I want to understand
    what is causing the change in revenue and take action accordingly. Every change
    in revenue is an opportunity to understand the intricacies of your app business.
    Again, this might sound tedious, but it’s very simple to do. App sales will not
    be your only source of revenue. You will make money from banner ads and affiliate
    marketing, so check on all sources of revenue daily to get the complete picture.


    ## TOOLS FOR TRACKING STATS


    You have various ways to monitor your app metrics. One option is Apple’s Developer
    Portal. Apple shows you the number of downloads, your revenue, when you will be
    paid, and even your iAd banner advertising statistics. The site is intuitive and
    useful. (See [Figure 7.2](#Chapter07.html_figure7-2).)


    # [FIGURE 7.2](#Chapter07.html_figureanchor7-2) Apple developer portal stats.


    ![image](images/f121-01.jpg)


    Even though this is nice, I prefer `AppFigures` (`[appempire.com/appfigures](http://appempire.com/appfigures)).
    `AppFigures` is great for tracking numbers as well as other aspects of your business.
    (See [Figure 7.3](#Chapter07.html_figure7-3).) Once set up, the site automatically
    downloads your stats from your Developer Portal and displays the information in
    a much more intuitive way. You can investigate one app at a time or all of your
    apps together. You can see your app rankings and reviews. You can review your
    app downloads over time or based on countries.


    # [FIGURE 7.3](#Chapter07.html_figureanchor7-3) AppFigures.


    ![image](images/f122-01.jpg)


    `AppFigures` sends daily e-mails that summarize the previous day’s app stats.
    This is nice because you don’t have to log in to get the information. I receive
    an e-mail every morning that gives me a breakdown of apps by the number of downloads
    and the amount of net profit (see [Figure 7.4](#Chapter07.html_figure7-4)). Plus,
    I get a breakdown of the iAd profits. This is convenient and is like getting a
    daily check-up for your business.


    # [FIGURE 7.4](#Chapter07.html_figureanchor7-4) Daily AppFigures summary e-mail.


    ![image](images/f123-01.jpg)


    `App Annie` is another service similar to `AppFigures` (`[appempire.com/appannie](http://appempire.com/appannie)).
    Like `AppFigures`, `App Annie` shows your apps’ movement and rankings and how
    much money you’re making. `App Annie` also shows you the historical ranking data
    of all apps in the App Store.


    There are also mobile apps that can give you this information at a glance. This
    is particularly useful if you have a mobile lifestyle. The app I use is `Position
    App` ([Figure 7.5](#Chapter07.html_figure7-5)), which shows your apps’ rankings
    and whether other apps are moving up or down in popularity.


    # [FIGURE 7.5](#Chapter07.html_figureanchor7-5) PositionApp ranking trends.


    ![image](images/f124-01.jpg)


    Also a useful tool for tracking user activity within your apps is `Flurry` (`[appempire.com/flurry](http://appempire.com/flurry)).
    This takes bit of extra programming within your app.


    ## USING STATS TO YOUR ADVANTAGE


    We talked about the importance of constantly improving your apps. Constant improvement
    is the mechanism that moves this forward.

