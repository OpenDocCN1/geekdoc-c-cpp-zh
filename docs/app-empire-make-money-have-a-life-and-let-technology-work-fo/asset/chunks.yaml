    # 测试


    将 App 交给他们，并说类似这样的话：“嘿，看看这个。”不要提到这是你的 App，不要提到它应该做什么，也不要提到它是如何工作的。尽可能提供少的信息，观察他们如何理解和操作你的
    App。这种体验将与真实用户的体验相似，因为届时你也不会在那里向他们解释事情。观察他们测试你的 App，并问自己这些问题：


    1. 他们感到困惑吗？

    2. 他们遇到卡顿了吗？

    3. 他们在抱怨吗？

    4. 他们是否按照你预想的方式使用 App？

    5. 他们是否因为以不同的方式使用 App 而发现了错误（也称为 bug）？

    6. 他们玩得开心吗？

    7. 他们是否提出了改进建议？如果是，是哪些建议？


    让他们谈谈他们的使用体验。如果他们不知道这个 App 是你的，他们会更加诚实。如果你听到你不喜欢的话，不要感到被犯。这些反馈是无价的。评估每一个回答，看看你的
    App 是否存在问题。问自己这些问题：


    1. 其他用户会遇到相同的问题吗？如果是，你该如何修复？

    2. 你应该调整布局吗？

    3. 你应该改变颜色来提高可见性吗？

    4. 增加一些说明会有帮助吗？

    5. 你应该改进导航吗？


    我向朋友 Jason 展示了我最新的 App 之一。当他测试时，遇到了一个小问题。“Chad，这看起来不错，而且很酷的，”他说，“但我如何回到主菜单呢？”


    “就在那里，”我说。“在哪儿？”他问。我猛然大醒。返回按钮的颜色和背景相同，而且很小。它在他的脑海中没有被识别为一个按钮，我意识到这对其他人来说也会是一个问题。花额外的
    10 分钟向他展示 App 是值得的。


    收集反馈后，让你的程序员进行修复或更改。你想要确保 App 在不同型号的 iPhone、iPod Touch 以及可能的 iPad 上运行。Apple 每年都会创新并推出新设备。你的
    App 支持的设备类型越多越好。这是在早期就该与程序员讨论的内容。确保他们在创建 App 时考虑了不同的设备。


    再次，你确实想在所有这些设备上测试你的 App，但在刚开始时这是不可行的。最初，将是程序员的任务在所有不同设备上测试 App。我要求程序员创建一个详细的功能清单，我会进行查看并在必要时进行改进。我会测试每个功能，直到一切运行都符合预期。


    测试和调试将经历多次迭代，就像设计和开发阶段一样。这都是整个过程的一部分。使用之前提到的 `TestFlight` App 和服务可以节省大量安装测试版本
    App 的机械操作时间。在某个时刻，你将完成更改并将 App 发送到 iTunes 商店进行分发。


    让程序员向你或团队中的某人演示如何提交前几个 App 是一个好主意。不要向程序员或任何人提供你的在线开发者门户登录信息。此此的方法是使用 `Skype` 或
    `GoToMeeting` 并共享你的屏幕，让他们引导你完成过程。随着你业务的增长，你可能希望将这项工作委托给团队中的某人。


    请记住，这一切都比听起来要容易得多。现在你已经理解了创建开发团队的流程，是时候更上一层楼并享受乐趣了。在下一章中，我们将讨论你最重要的工作，即营销你的 App。


    ## 我学到了什么

    1.

    2.

    3.


    ## 需要采取的行动

    1. 寻找程序员。

    2. 至少面试 10 人并选择最好的三位。

    3. 为你的 App 创意创建一个详尽的设计。

    4. 从你选择的三位程序员那里获取报价。

    5. 选择其中一人并测试他。


    # 第 6 章：性魅力（App-eal）


    ## 吸引更多买家的营销基础


    任何男人都有机会让任何女性心醉神倒。他只需要一把正确的扫帚。

    —Hitch


    “清醒点，Chad。这不酷。来吧，哥们儿，振作起来。”


    当我尴尬地穿过嘈闹的人群时，我的大脑在飞速运转。我是一个大一新生，正在参加 2003 级年度第一场派对。彩灯点缀着房间，Snoop Dog 和 Jay-Z
    的歌曲在头顶回响，啤酒桶像尼加拉瀑布一样倾泻。


    女孩们穿着连衣裙和高跟鞋，男孩子们看起来像是从 GQ 杂志里走出来的。我似乎是那里唯一一个没收到着装通知的人。尽管其他人都是为了享受夜生活而打扮的，但我穿着
    T 恤、牛仔裤和带着袜子的凉鞋。我的头发凌乱，没修剪的胡须让我看起来像是从营地走来的，而不是从杂志插画里出来的。


    人们互相大笑开玩笑。当我穿过人群时，我试着看起来很自信。我露出了微笑，这个微笑不知为何像打了肉毒杆菌一样僵在脸上。我感到不自在、局促且格格不入。


    当我穿过人群时，我能感觉到路过的人的目光在盯着我。我紧张地冲向最近的空位并坐下。


    突然，一个我见过的最漂亮的女孩走过。


    她留着波波浓密的褐色长发，深邃的海蓝色眼睛，以及一个能点亮一座小城市的微笑。她穿着一件优雅的黑色长连衣裙，非常合身。


