    在使用联盟营销时需要记住的一点是，你创建的链接是特定国家的。Apple 决定在美国和加拿大使用 `LinkShare`。你必须为这些每个国家使用不同的链接。对于欧洲，Apple
    选择了与 `LinkShare` 的欧洲对应伙伴 `TradeDoubler`（[appempire.com/tradedoubler](http://appempire.com/tradedoubler)）合作。对于澳大利亚和新西兰，Apple
    与 `DGM`（[appempire.com/dgmpro](http://appempire.com/dgmpro)）建立了合作。最初，你可以坚持使用美国的
    `LinkShare` 链接，因为美国拥有最大的应用市场。一旦你的应用获得了一些流量，你就会希望你的应用能够识别出它们所在的国家。这样，你就可以为每个国家使用正确的联盟链接，并获得原本无法获得的联盟佣金。


    设置国际联盟营销链接，因为你的国际流量可能是你应用网络流量的一半。我以前就是如此。我花了一些时间来设置国际联盟链接，在此期间我白白损失了机会，就像我的横幅广告没有获得
    100% 的填充率一样。你的程序员知道如何处理这一点，而且最好将这部分作为服务器后端的一部分并建立一个集成系统。


    ## 应用内购买


    当 App Store 刚开放时，你无法从应用内部向用户出售内容。你只能在购买应用时支付费用，或者免费下载应用。在某个时刻，Apple 看到需要一个系统来允许开发者在应用内销售内容，于是创建了应用内购买。顺便说一下：留意此类变化，因为它们意味着金钱。


    这个概念正如名称所示的那样简单。开发者可以在应用内出售各种项目。用户选择项目后，会弹出一个类似“您想花 99 美分购买此 xyz 功能吗？”的提示。如果用户同意，他们必须输入他们的
    `iTunes` 账户密码，就像在 App Store 上购买应用一样。用户购买的任何内容都会在应用中解锁或变得可用（见 图 9.6）。


    图 9.6 应用内购买示例。


    ![image](img/f162-01.jpg)


    应用内购买的妙之处在于它们是无缝的。Apple 仍然像处理普通应用销售一样处理财务交易，用户永远不需要离开应用。这对用户来说非常棒，因为他们可以在确认自己喜欢该应用后获得额外功能。这对开发者来说很棒，因为他们可以在保持用户参与度的同时赚取大量额外现金，这对
    Apple 来说也很棒，因为他们仍然从每笔交易中获得 30%。这是一个三赢的局面。


    因此，应用内购买改变了应用变现的格局。当大多数开发者都在关注通过付费应用赚钱时，他们开始提供更多带有付费内容的免费应用。应用内购买创造了“免费增值模式”（freemium），这是许多开发者使用的首要营收模式。如果你查看
    App Store 上总收入排名前 25 的应用，你会发现其中至少有一半是免费的。这意味着在 App Store 中挣钱最多的 12–15 个应用完全是通过应用内购买产生收入的。


    应用内购买在游戏中尤为流行。通常，用户可以无任何限制地玩游戏，但如果他们想更快地进度或使用有趣的插件，可以通过应用内购买来获得。这听起来不太可能，但很多人确实为虚拟物品付费。一些工具类应用也会通过应用内购买提供额外的内容或功能。当我发布我的
    Emoji 应用时，我决定将其制作成免费增值应用，并给用户通过应用内购买购买额外表情的选择。那个策略获得了丰厚的回报。（见 图 9.7）。


    图 9.7 一个应用中多个应用内购买示例。


    ![image](img/f163-01.jpg)


    涉及到应用内购买，你可以提供什么取决于你的想象。任何你能想到的用户可能想要并愿意付费的东西，都可以作为应用内购买出现在你的应用中。


    另一个酷的地方是，你可以提供任意数量的应用内购买，并且根据项目的价值，应用内购买的价格可以很高。那些从未愿意花 15 美元购买应用的用户，在他们喜欢的应用内支付金额完全没有问题，特别是当他们想要额外的项目、功能或内容时。（见
    图 9.8）。


    图 9.8 热门应用内购买。


    ![image](img/f164-01.jpg)


    在应用变现方面，只要可能，你就必须使用应用内购买。始终弄清楚哪些内容和功能可以转换为应用内购买以创造更多用户价值。如果你有一个产生大量流量的应用，某些用户会希望从你的应用中获得更多。利用已有的流量赚更多钱是合理的。让我们来看数字。假设你的应用每天有
    10,000 次下载。如果只有 2% 的用户决定购买应用内项目，你每天将获得额外的 200 订单并多赚 140 元。


    很好的是，你可以这样做而不对你的应用产生任何负面影响。顺便说，你的应用不需要免费也可以提供应用内购买。很多游戏也是这样做。集成应用内购买会稍微增加开发成本。投资回报率通常非常好。和其他一样，在开发之前做好计划。


    ## 翻译你的应用


    增加应用收入的方法之一是增加它们的全球可见性。这需要将你的营销组件（标题、描述、关键词、截图）翻译成不同的语言，这也称为本地化。这允许其他国家的人找到你的应用。这也让他们理解你所有的营销组件，从而增加你的国际流量和收入。


    这很棒的一点是，你不需要针对特定国家进行本地化。你只需要针对语言进行本地化，因为当你添加某种语言（如西班牙语）时，你的应用所有西班牙语国家显示西班牙语。这非常强大。（见
    图 9.9 和 9.10）。


    图 9.9 英语版 Alarm Security 。


    ![image](img/f166-01.jpg)


    图 9.10 翻译成德语的 Alarm Security 。


    ![image](img/f166-02.jpg)


    当我寻找增长应用业务的方法时，询问我的开发者和大师们是如何提升业务的。本地化证明是增加现有应用流量和收入的一种主要方式。


    在本地化应用之前，我的大部分时间和精力的都花在了英语市场上。因此，80% 的收入来自英语国家，20% 来自其他国家。我没有获得更多国际流量，因为大多数非英语母语者找不到我的应用，而且由于语言障碍无法理解我的营销内容。


