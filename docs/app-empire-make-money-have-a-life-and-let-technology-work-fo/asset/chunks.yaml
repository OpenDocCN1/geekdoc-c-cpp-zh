  trans: "\n一旦你摒弃了员工必须在同一处屋檐下的旧观念，你就会发现从任何地方管理团队都是舒适的，即使是偏远地区，如斐济或智利。像 `Basecamp`\
    \ ([appempire.com/basecamphq](http://appempire.com/basecamphq)) 这样的在线项目管理网站将帮助你与团队的所有成员进行协作。每个人可以在世界各地的多个地点同时开展同一个项目。\n\
    \n你的程序员和技术助理不需要面对面交流。`Skype` 和 `Basecamp` 等在线工具允许你和团队成员随时进行沟通和协调，以完成任务。\n\n我通过\
    \ `iPhone` 管理所有的员工。通过 `Basecamp` 应用程序，我可以看到团队成员在做什么，以及他们某个特定项目的进展如何。我可以交流需要完成的工作，并在我规划下一次冒险时让他们处理好自己的工作。\n\
    \n# 外包你的生活\n\n当你在优化和自动化你的业务时，不要忘记对你的个人生活也做同样的事情。我们每天做的很多事情是可以外包的。一旦你达到某个水平，亲自处理预订酒店和机票、接电话以及购买杂货等事情就意义不大了。很多人认为他们必须富有才能请私人助理，但事实并非如此。你不需要花很多钱就能释放大量时间。\n\
    \n想象一下，有人每小时花费 $15，每周帮你工作 20 小时。这意味着每周花费 $300 或每月 $1,200，这可以为你多出 80 小时。你可以利用这些额外时间与家人共处，开启新的冒险，或者执行一个让收入翻倍的计划。\n\
    \n我想释放更多时间，让我的生活方式提升一个层次。于是，我雇佣了 `Kate`，或者我叫她 `Super Kate`。她曾是好莱坞一线流影星的私人助理。现在，我有人帮我接电话、检查邮件、安排交通工具、寻找我手臂需要的物理治疗师，等等。`Super\
    \ Kate` 让我能够花更多时间进入工作状态，去做我想做的事情。我变得更高效、更快乐，也更有成就感。\n\n如果是时候让你的生活方式提升一个层次了，而且如果你有钱，就为你自己请一个\
    \ `Super Kate` 吧。即使每周只找人几个小时，也要这样做。你会为自己的决定感到高兴。\n\n# 应用业务的七大支柱\n\n除了业务主的角色外，你可以外包业务中的几乎一切。你需要在成长的每个阶段保持对业务的全局视角。尽管有时其他人会负责掌舵，但每艘船只有一个船长，你的责任是规划航线并确保一切在正轨上运行。\n\
    \n在让团队处理大部分行动的同时监控你的业务的关键，在于持续关注并检查七个关键领域。我将这些称为应用业务的七大支柱：\n\n1. 心态与获胜者思维\n2.\
    \ 市场研究\n3. 应用开发与维护\n4. 数据分析与调整\n5. 营销与变现\n6. 团队与系统\n7. 专业人脉网络\n\n我每天都会检查这些关键领域。即使我没有在每个领域都采取行动，这也会提醒我需要关注什么。我为这些每一个领域都创建了特定的问题，持续阅读这些问题能让我处于一种资源丰富的状态，并给我提供可以实施的新点子。以下是每个领域的简要回顾，以及你应该定期回答的问题。你可以将它们作为初始指南，并根据需要添加自己的。\n\
    \n## 1. 心态与获胜者思维\n获胜者思维至关重要，因为这是一切的起点。如果你没有愿景，对你所做的事情没有热情，并且缺乏适应市场的灵活性和韧性，那么你将在专注和维持能量使业务取得长期成功方面面临困难。\n\
    \n### 问问自己的问题\n* 我对这家公司的愿景是什么？我是否正朝着这个目标努力？\n* 我为什么想在应用业务中获得成功？还有谁会从中受益？\n* 我的态度是否始终积极且富有资源？我该如何强化它？\n\
    * 我可以做什么来进一步增强我的大脑、身体或精神？\n* 我是否与那些志同道合的积极的人在一起？\n* 随着应用业务的变化，我是否足够灵活并愿意改变？\n\
    * 我相信我可以成功吗？还是说我正在通过怀疑自己的行为来自我破坏？\n\n## 2. 市场研究\n应用商店就是你的市场，就像任何市场一样，它决定了你需要如何运营业务。商店不断波动，你必须监控它，以便快速且无缝地适应这些变化。与大多数市场不同，它是全球\
    \ 24 小时、7 天候运行，没有停机时间。\n\n### 问问自己的问题\n* 前 200 强榜单中哪些是有效的？哪些应用在赚钱？\n* 其他开发者在做什么是我可以应用到我的应用中的吗？\n\
    * 我可以开发哪些新应用？\n* 长期业务趋势是什么？\n* 阅读在线文章和博客以发现：\n    * 目前的市场趋势是什么？\n    * 顶尖应用开发者在讨论什么？\n\
    \    * 我可以如何利用新的手机硬件或软件？\n\n## 3. 应用开发与维护\n你始终需要在开发流水线中保持一个或多个新应用。你需要调整现有的应用。这允许你增加你的应用网络的流量，并维持及增加你的收入。\n\
    \n### 问问自己的问题\n* 我有正在开发的新应用吗？\n* 发布新应用需要多久？我该如何加速这一过程？\n* 我可以如何改进现有的应用？\n* 我是否在新旧应用上都投入了足够的收入？\n\
    * 我是否可以使用现有代码更多地创建新应用？\n\n## 4. 数据分析与调整\n监控数据分析使你能够对业务做出明智决策。数据提供了应用性能的关键反馈。跟踪这些信息并做出回应对你的成功至关重要。\n\
    \n### 问问自己的问题\n* 我可以如何实现数据跟踪自动化？\n* 我应该跟踪哪些数据？\n* 我的应用表现如何？我该调整什么来增加销量？\n* 调整的结果如何？\n\
    * 我的应用排名是在上升还是下降？为什么？\n* 我的下载量是在上升还是下降？为什么？\n* 我的销量是在上升还是下降？为什么？\n* 我可以利用评论中的反馈来改进我的应用吗？\n\
    * 我可以如何改进应用以吸引更多用户？\n\n## 5. 营销与变现\n应用的有效营销与其开发同样重要。持续地调整和改进你的营销工作。始终寻找从现有流量中产生最多收益的方法。如果你想通过应用赚大钱并长期获得收益，掌握营销和变现是必修课。\n\
    \n### 问问自己的问题\n* 我是否使用了所有已知的应用变现策略？\n* 我是否在寻找应用变现的新方法？\n* 我的营销材料翻译了吗？我还可以翻译成哪些其他语言？\n\
    * 我在应用中使用了联盟链接吗？\n* 我可以如何进一步改进应用的图标、标题、描述、截图、关键词和分类？\n* 我的引导弹窗和促销页面设置好了吗？它们是否指向了正确的应用？\n\
    * 我可以如何添加应用内购买功能？\n* 我可以如何增加广告收入？\n* 我可以做什么来增加流量并扩大我的应用网络？\n* 我可以如何与其他开发者进行交叉推广？\n\
    \n"
- fmt: "\n## 6. Team and Systems\nYou must have a well-trained team in place. It will\
    \ help you execute quickly and free up your time so you can focus on key business\
    \ areas. Surround yourself with positive and intelligent people and take full\
    \ advantage of technology to systemize as much of your business as possible.\n\
    \n### Questions to Ask Yourself\n* Has my business reached a point where I need\
    \ to add another team member?\n* What role do I need to fill?\n* Where can I find\
    \ the best talent?\n* Am I delegating and managing my team?\n* How are my team\
    \ members performing?\n* Do I need to fire any of my team members?\n* How well\
    \ are my online collaboration tools working?\n* What else can I automate in my\
    \ business?\n* Am I a positive role model for my team and inspiring it to improve?\n\
    \n## 7. Professional Networking\nNetworking within the app community creates an\
    \ environment where you and other appreneurs can learn from each other. When you’re\
    \ part of a network, you will learn much faster and grow your business more easily.\
    \ Other appreneurs can infuse new and lucrative ideas into your business, and\
    \ you can do the same for them. It’s beneficial to be part of a community that\
    \ you share similar interests and aspirations with.\n\n### Questions to Ask Yourself\n\
    * Have I checked in with my developer network recently?\n* How can I help other\
    \ appreneurs?\n* What do I want to ask my appreneuer network?\n* How can I meet\
    \ other appreneurs?\n* What online app communities can I plug into?\n* What app\
    \ industry conferences, meet-up groups, or workshops can I attend?\n* How else\
    \ can I grow my developer network?\n* Am I growing my mastermind group?\n\n##\
    \ YOUR DAILY ROUTINE\nThe best way to check in with the seven pillars of your\
    \ business is to create a daily routine you can follow. I developed my routine\
    \ when I was recovering from my accident. To this day, I lie in bed every morning\
    \ and review my analytics from my `iPhone`. I use this time to research the market\
    \ to see what’s working.\n\nIn addition to tracking metrics and doing market research,\
    \ I spend some time making a list of things I want to get done for the day. I\
    \ pass on my tweaks to my project manager, and let my team execute them. I check\
    \ in on the progress throughout the day and see if the team has any questions.\n\
    \nI use unplanned “net-time” to check in with these pivotal areas. By that I mean\
    \ I use free time throughout the day to check my apps and my team, like when I’m\
    \ waiting in line somewhere, when I’m traveling, or when I have other idle time\
    \ that would be unproductive. I use these brief moments to look at the market\
    \ and take pulse of what’s happening with my business.\n\nThis may seem a bit\
    \ counterintuitive at first. Many people are used to working or playing for extended\
    \ periods of time. The faster you can adapt this more free-flowing work style,\
    \ the sooner you can enjoy the appreneur lifestyle.\n\nYour routine can differ\
    \ from mine, but turn it into a habit like brushing your teeth every morning so\
    \ you don’t have to think about it. You do it, and your business keeps humming\
    \ along while you are enjoying life.\n\n## What I Learned\n1.\n2.\n3.\n\n## Actions\
    \ to Take\n1. Decide to be dispensable.\n2. Hire team members and scale your team\
    \ as necessary.\n3. Set up online systems to manage your team remotely.\n4. Hire\
    \ a `Super Kate` and outsource your life.\n5. Check in on the seven pillars of\
    \ your app business on a daily basis.\n6. Create a daily routine for your business.\n\
    \n## Afterword\n### JUMP!\nAfter attending an event in Southern California, I\
    \ overheard two people talking about California’s `Route 1` and how breathtaking\
    \ the narrow rustic road was that hugged the coastline.\n\nWith my app business\
    \ on cruise control, I rented a silver `Mustang` convertible to drive up the coast\
    \ from Long Beach to San Francisco. I invited my friend `Nella`, who was at the\
    \ event, to join me, since she had never experienced the famous coastline drive\
    \ either. As we enjoyed the bright blue sky and wide-open road, we grooved to\
    \ the radio, and laughed like kids with no worries in the world.\n\nRounding a\
    \ bend on a narrow cliff road, I saw a random sign that said, “Skydiving. Take\
    \ a right.”\n\nNella didn’t see the sign because she was busy playing her extraordinary\
    \ air guitar, so I took advantage of the moment and turned right, heading down\
    \ the gravel road. Above us, small planes were rising and dipping slowly. Ahead,\
    \ a field opened into a sketchy looking airport that seemed desolate.\n\nNella\
    \ asked with a nervous tone, “Where are we going?”\n\nI looked at her and said,\
    \ “We’re going skydiving.”\n\n“What?” she asked.\n\n“Yeah. It’s go time, `Iceman`,”\
    \ I said.\n\nThirty minutes later, with parachutes attached, we were on a small\
    \ plane, climbing higher into the open sky. Adrenaline was coursing through my\
    \ veins as I looked down through the open airplane door. The Pacific Ocean was\
    \ vast and seemed unforgiving. We climbed to an altitude of 10,000 feet, and instead\
    \ of relaxing and turning on the approved electronic devices, it was time to jump.\n\
    \nNella was up first. She was understandably scared and was clinging to the opening\
    \ of the plane but was quickly repositioned by her jumping instructor. As the\
    \ wind sucked them out of the plane, her screams made every hair on my body stand\
    \ up on end. I was anxious yet exhilarated to let go.\n\n“JUUUUUUMP!!”\n\nAs I\
    \ dropped uncontrollably through the air, I realized that asking the instructor,\
    \ who was attached to me, to do multiple flips might not have been the best idea.\
    \ My stomach flew up to my throat, and it never returned.\n\nAs soon as I pulled\
    \ the parachute, the screeching air that had been rearranging my face came to\
    \ a halt and then: complete silence. My tense muscles released, and I was floating,\
    \ seemingly weightless. The view was incredible. I could see the exotic redwood\
    \ trees along the coast, the magnificent rippling light blue ocean, and the strip\
    \ of beach where we were going to land. It felt as if time stood still. I became\
    \ overwhelmed with gratitude for everything I had in my life, and it brought me\
    \ to tears.\n\nIn some ways, I parallel this jump to my jump into the app business.\
    \ It’s scary at first when you are about to do something you’ve never done before.\
    \ That first step out of the plane seems unimaginable. You muster all your strength,\
    \ will power, and faith. You have an overwhelming angst that wants to pull you\
    \ back and keep you safe. You can talk yourself out of taking that first step\
    \ and let the opportunity of a lifetime pass you by.\n\nBut this time, for you,\
    \ needs to be different.\n\nThis time has to be different.\n\nLet this book serve\
    \ as your parachute as you embark on your journey to fulfill your dreams and enjoy\
    \ the lifestyle you’ve always wanted. Yes, things will be scary when you jump.\
    \ They always are. You will be challenged, and it might feel as if you are free\
    \ falling for a while. But when everything comes together and your chute opens,\
    \ your life will be different.\n\nApps were my vehicle to freedom, but there are\
    \ countless opportunities. If apps are not for you, find something that is. Don’t\
    \ settle for what is going on with your life, if it’s not what you want it to\
    \ be. Pick something else, and take action. The life you are meant to live is\
    \ closer than you think. Don’t hesitate. It’s time. \n\n## Resources\n### WEBSITE\n\
    [www.AppEmpire.com](http://www.AppEmpire.com)\n[Chadmureta.com](http://Chadmureta.com)\
    \ (to follow the author)\nApp Empire App, iTunes—[www.AppEmpire.com/theapp](http://www.AppEmpire.com/theapp)\n\
    \n### MARKET NEWS AND RESEARCH\nMashable—[www.AppEmpire.com/mashable](http://www.AppEmpire.com/mashable)\n\
    Chomp Analytics—[www.AppEmpire.com/chomp](http://www.AppEmpire.com/chomp)\n148Apps—[www.AppEmpire.com/148apps](http://www.AppEmpire.com/148apps)\n\
    Gartner—[www.AppEmpire.com/gartner](http://www.AppEmpire.com/gartner)\nElectronista—[www.AppEmpire.com/electronista](http://www.AppEmpire.com/electronista)\n\
    Mobile Entertainment—[www.AppEmpire.com/mobile-ent](http://www.AppEmpire.com/mobile-ent)\n"
  raw: '6\. Team and Systems. You must have a well-trained team in place. It will
    help you execute quickly and free up your time so you can focus on key business
    areas. Surround yourself with positive and intelligent people and take full advantage
    of technology to systemize as much of your business as possible.


    Questions to Ask Yourself


    *   Has my business reached a point where I need to add another team member?


    *   What role do I need to fill?


    *   Where can I find the best talent?


    *   Am I delegating and managing my team?


    *   How are my team members performing?


    *   Do I need to fire any of my team members?


    *   How well are my online collaboration tools working?


    *   What else can I automate in my business?


    *   Am I a positive role model for my team and inspiring it to improve?


    7\. Professional Networking. Networking within the app community creates an environment
    where you and other appreneurs can learn from each other. When you’re part of
    a network, you will learn much faster and grow your business more easily. Other
    appreneurs can infuse new and lucrative ideas into your business, and you can
    do the same for them. It’s beneficial to be part of a community that you share
    similar interests and aspirations with.


    Questions to Ask Yourself


    *   Have I checked in with my developer network recently?


    *   How can I help other appreneurs?


    *   What do I want to ask my appreneuer network?


    *   How can I meet other appreneurs?


    *   What online app communities can I plug into?


    *   What app industry conferences, meet-up groups, or workshops can I attend?


    *   How else can I grow my developer network?


    *   Am I growing my mastermind group?


    YOUR DAILY ROUTINE


    The best way to check in with the seven pillars of your business is to create
    a daily routine you can follow. I developed my routine when I was recovering from
    my accident. To this day, I lie in bed every morning and review my analytics from
    my iPhone. I use this time to research the market to see what’s working.


    In addition to tracking metrics and doing market research, I spend some time making
    a list of things I want to get done for the day. I pass on my tweaks to my project
    manager, and let my team execute them. I check in on the progress throughout the
    day and see if the team has any questions.


    I use unplanned “net-time” to check in with these pivotal areas. By that I mean
    I use free time throughout the day to check my apps and my team, like when I’m
    waiting in line somewhere, when I’m traveling, or when I have other idle time
    that would be unproductive. I use these brief moments to look at the market and
    take pulse of what’s happening with my business.


    This may seem a bit counterintuitive at first. Many people are used to working
    or playing for extended periods of time. The faster you can adapt this more free-flowing
    work style, the sooner you can enjoy the appreneur lifestyle.


    Your routine can differ from mine, but turn it into a habit like brushing your
    teeth every morning so you don’t have to think about it. You do it, and your business
    keeps humming along while you are enjoying life.


    What I Learned


    1.


    2.


    3.


    Actions to Take


    1\. Decide to be dispensable.


    2\. Hire team members and scale your team as necessary.


    3\. Set up online systems to manage your team remotely.


    4\. Hire a Super Kate and outsource your life.


    5\. Check in on the seven pillars of your app business on a daily basis.


    6\. Create a daily routine for your business.


    Afterword


    JUMP!


    After attending an event in Southern California, I overheard two people talking
    about California’s Route 1 and how breathtaking the narrow rustic road was that
    hugged the coastline.


    With my app business on cruise control, I rented a silver Mustang convertible
    to drive up the coast from Long Beach to San Francisco. I invited my friend Nella,
    who was at the event, to join me, since she had never experienced the famous coastline
    drive either. As we enjoyed the bright blue sky and wide-open road, we grooved
    to the radio, and laughed like kids with no worries in the world.


    Rounding a bend on a narrow cliff road, I saw a random sign that said, “Skydiving.
    Take a right.”


    Nella didn’t see the sign because she was busy playing her extraordinary air guitar,
    so I took advantage of the moment and turned right, heading down the gravel road.
    Above us, small planes were rising and dipping slowly. Ahead, a field opened into
    a sketchy looking airport that seemed desolate.


    Nella asked with a nervous tone, “Where are we going?”


    I looked at her and said, “We’re going skydiving.”


    “What?” she asked.


    “Yeah. It’s go time, Iceman,” I said.


    Thirty minutes later, with parachutes attached, we were on a small plane, climbing
    higher into the open sky. Adrenaline was coursing through my veins as I looked
    down through the open airplane door. The Pacific Ocean was vast and seemed unforgiving.
    We climbed to an altitude of 10,000 feet, and instead of relaxing and turning
    on the approved electronic devices, it was time to jump.


    Nella was up first. She was understandably scared and was clinging to the opening
    of the plane but was quickly repositioned by her jumping instructor. As the wind
    sucked them out of the plane, her screams made every hair on my body stand up
    on end. I was anxious yet exhilarated to let go.


    “JUUUUUUMP!!”


    As I dropped uncontrollably through the air, I realized that asking the instructor,
    who was attached to me, to do multiple flips might not have been the best idea.
    My stomach flew up to my throat, and it never returned.


    As soon as I pulled the parachute, the screeching air that had been rearranging
    my face came to a halt and then: complete silence. My tense muscles released,
    and I was floating, seemingly weightless. The view was incredible. I could see
    the exotic redwood trees along the coast, the magnificent rippling light blue
    ocean, and the strip of beach where we were going to land. It felt as if time
    stood still. I became overwhelmed with gratitude for everything I had in my life,
    and it brought me to tears.


    In some ways, I parallel this jump to my jump into the app business. It’s scary
    at first when you are about to do something you’ve never done before. That first
    step out of the plane seems unimaginable. You muster all your strength, will power,
    and faith. You have an overwhelming angst that wants to pull you back and keep
    you safe. You can talk yourself out of taking that first step and let the opportunity
    of a lifetime pass you by.


    But this time, for you, needs to be different.


    This time has to be different.


    Let this book serve as your parachute as you embark on your journey to fulfill
    your dreams and enjoy the lifestyle you’ve always wanted. Yes, things will be
    scary when you jump. They always are. You will be challenged, and it might feel
    as if you are free falling for a little while. But when everything comes together
    and your chute opens, your life will be different forever.


    Apps were my vehicle to freedom, but there are countless other opportunities.
    If apps are not for you, find something that is. Don’t settle for what is going
    on with your life, if it’s not what you want it to be. Pick something else, and
    take action. The life you are meant to live is closer than you think. Don’t hesitate.
    It’s time.


    It’s time to jump.


    Resources


    WEBSITE


    [www.AppEmpire.com](http://www.AppEmpire.com)


    [Chadmureta.com](http://Chadmureta.com) (to follow the author)


    App Empire App, iTunes—[www.AppEmpire.com/theapp](http://www.AppEmpire.com/theapp)


    MARKET NEWS AND RESEARCH


    Mashable—[www.AppEmpire.com/mashable](http://www.AppEmpire.com/mashable)


    Chomp Analytics—[www.AppEmpire.com/chomp](http://www.AppEmpire.com/chomp)


    148Apps—[www.AppEmpire.com/148apps](http://www.AppEmpire.com/148apps)


    Gartner—[www.AppEmpire.com/gartner](http://www.AppEmpire.com/gartner)


    Electronista—[www.AppEmpire.com/electronista](http://www.AppEmpire.com/electronista)


    Mobile Entertainment—[www.AppEmpire.com/mobile-ent](http://www.AppEmpire.com/mobile-ent)'
