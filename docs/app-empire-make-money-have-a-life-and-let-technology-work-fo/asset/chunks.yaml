    The concept of cross-promotion is not unique to the app business. In real estate,
    every agent is taught at the beginning of their career to network with people
    who provide services for the home buying process. For example, you build relationships
    with mortgage brokers, and they send you people looking for houses. In return,
    you send them people looking for loans.


    With `Alan`, I immediately saw how this applied to the app world and decided to
    cross-promote my apps with him. But I didn’t stop there. I got in touch with other
    entertainment app companies including `Lima Sky`, the creators of `Doodle Jump`.
    It was great timing because they were releasing their new `Bubble Wrap` app. I
    was able to get them to cross-promote with me and this increased the amount of
    traffic to my app network.


    If you model this strategy with several developers, instead of one, you have the
    potential of seeing your traffic skyrocket. Find developers whose apps have similar
    amounts of traffic and similar demographics to your own and maximize your conversion
    rate. Utility apps, for example, will not cross-promote as well to games as they
    do to other utility apps because the demographic differs.


    ## Push Notifications


    Push notifications are another effective advanced marketing tactic. A push notification
    sends a message to customers who have your app on their phone. The notification
    can contain whatever message you want to pass on to the user. It pops up on the
    screen like a text message, requiring the user to discard the message or to open
    the app that has sent it. The ingenuity of push notifications is that you’re reminding
    users of your app and giving them the option to open it up with a touch of the
    screen.


    Since these notifications are displayed like text messages, the open rate is close
    to 100 percent. After all, have you ever not read a text message that popped up
    on your screen? That’s huge for marketing your app and untouched by any other
    type of advertising in any industry.


    Push notifications are a powerful in-your-face way of marketing your app and have
    to be used tactfully. Don’t send push notifications every day because customers
    will get annoyed and delete your app. It’s one thing to show them some advertising
    when they are actively engaged with one of your apps, but it’s different to send
    them a push notification, interrupting whatever else they may be doing at that
    time.


    This strategy works best after you’ve built a solid fan base that is excited to
    use your apps or to see what your next update will be. The company `Outfit7`,
    with their hugely successful `Talking Tom` and other “talking apps,” do a great
    job with this. They rarely send push notifications and when they do it’s something
    fun like “I miss you” or “Come play with me.” Sometimes they also advertise a
    new feature.


    Let’s consider the financial impact of push notifications. Assume you have an
    app that has an active user base of `250,000`. If you send out a push notification
    and only 10 percent of your users check it out, you will have infused your app
    network with an additional `25,000` users for that particular day. That traffic
    will increase your revenue through additional sales, banner clicks, and affiliate
    income. It’s like printing money with the click of button.


    ## Your Developer Network


    A few months after its release, my top app started dropping in the rankings, and
    I didn’t know how to stop it. I asked myself: “What can I do to make this a sustainable
    business rather than a one-hit wonder?” So, I thought, “Whom do I know in this
    business who can help me? Who can be a mentor? Who can I model for success?” That
    was what I had always thought of when I wanted to take things to the next level.


    The reality was that I didn’t know anybody in the business. The app industry was
    so new at the time that most developers were concentrated in Silicon Valley, so
    that’s where I decided to go. I landed in San Francisco with everything I owned
    in two bags. I was dedicated, ready to network and start my life as an appreneur.
    My cross-country move propelled my business to new heights. The first contact
    I made was `Alan`, and from there my developer network took off. I networked with
    other appreneurs and learned the strategies they were using to monetize their
    apps. I never would have thought of some of these on my own.


    You don’t have to uproot your life and move to San Francisco to network since
    developers are everywhere and you can leverage technology. But your success depends
    on finding like-minded people to network with. Learning from somebody who’s doing
    well can help you make progress faster than figuring out the ins and outs of the
    business yourself.


    Where can you find them? Use `Meetup` (`appempire.com/meetup`) or similar networking
    sites, industry conferences, developer blogs, and so on. `Meetup` connects you
    with people in similar industries or with similar hobbies. At the first iPhone
    developer meet-up I went to, I met a few great developers, and they introduced
    me to their developer friends. We created a mastermind group that became pivotal
    to our success. They taught me their skills, and I was able to show them a few
    things to help them take their businesses to the next level.


    Motivated by the results of the mastermind group, I attended app conferences and
    grew my developer network. These conferences are a networker’s dream, allowing
    appreneurs to learn new, useful information and meet like-minded people. One time,
    I went to the `BizTech` conference, where Internet marketing expert and app developer
    `Joel Comm` was speaking. At the end of his speech, I asked Mr. `Comm` a question
    and began by introducing myself and plugging my app in front of a large crowd
    of attendees.


    Afterward, several people came over to me and said, “I’m an app developer, too.”
    It was a great way to meet people, but I had to put myself there.


    The good news is that you don’t have to get up and talk in front of hundreds to
    network successfully. When you attend meet-ups and technology conferences, introduce
    yourself to people one at a time and ask questions to find out more. Ask where
    they are from, what they do, and so on. Everybody is there to learn and meet others
    so you don’t need to be shy. For every conference you go to, make it your goal
    to bring one person into your “inner circle.” Before you know it, you’ll have
    a dream team appreneur network.


    Another good way to connect and learn from other developers is developer blogs.
    Now that the app industry is growing in leaps and bounds, many developers are
    creating blogs to talk about their successes. I recommend checking them out and
    contacting a few. Make comments on their blogs and ask questions. You can contact
    other people who post comments on their sites to see what they are working on.
    It’s another opportunity to network and share ideas. A single new connection can
    lead to an influx of revenue for your business and, who knows, a new friendship.


    Work on your developer network as much as you’re working on your app network.


    ## Updates


    Guess what. There is no such thing as a finished app. You’ll be fixing bugs, adding
    new features, or responding to competition on a consistent basis. To get the newest
    version of your app to your users, all you have to do is upload it to Apple for
    review, much like the first time you publish your app. After Apple’s approval,
    all users who have your app installed on their device will see that an update
    is available (see `Figure 8.6`). This seems simple and obvious but updates are
    a huge marketing opportunity.


    [FIGURE 8.6] App updates on the App Store app.


    ![image](images/f146-01.jpg)

