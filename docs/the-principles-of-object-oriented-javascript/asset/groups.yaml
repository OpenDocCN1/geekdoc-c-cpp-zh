    \n2013048973\n\nNo Starch Press 及 No Starch Press 徽标是 No Starch Press, Inc. 的注册商标。本书中提及的其他产品和公司名称可能是其各自所有者的商标。我们没有在每次出现商标名称时都使用商标符号，而仅以编辑方式使用这些名称，以利于商标所有者，并无意侵犯商标。\n\
    \n本书中的信息按“原样”分发，不提供任何担保。尽管在编写本作品时已采取一切预防措施，但作者和 No Starch Press, Inc. 对任何人或实体因本书所含信息直接或间接造成的任何损失或损害不承担任何责任。\n\
    \n# 关于作者\n\n尼古拉斯·C. 扎卡斯是 Box 公司的软件工程师，以撰写和演讲 JavaScript 最新最佳实践而闻名。他在雅虎公司五年的经历中磨练了自己的技能，期间担任雅虎首页的首席前端工程师。他著有多本书，包括《可维护的\
    \ JavaScript》（O'Reilly Media, 2012）和《JavaScript 高级程序设计》（Wrox, 2012）。\n\n# 关于技术审校\n\
    \n安格斯·克罗尔来自英国，现在是 Twitter 旧金山网络框架团队的一员，也是 Twitter 开源 Flight 框架的合著者和主要维护者。他对 JavaScript\
    \ 和文学的热爱不相上下，并积极倡导艺术家和创造性思维者更多地参与软件开发。安格斯经常在世界各地的会议上发表演讲，目前正在为 No Starch Press\
    \ 撰写两本书。可以通过 Twitter 联系他：@angustweets。\n\n# 简明目录\n\n- 前言（科迪·林德利）........................................................\
    \ xiii\n- 致谢............................................................... xv\n\
    - 引言............................................................... xvii\n- 第\
    \ 1 章：原始类型和引用类型........................................... 1\n- 第 2 章：函数...........................................................\
    \ 17\n- 第 3 章：理解对象............................................... 31\n- 第 4 章：构造函数与原型...........................................\
    \ 49\n- 第 5 章：继承......................................................... 65\n\
    - 第 6 章：对象模式..................................................... 79\n- 索引...............................................................\
    \ 93\n\n# 前言\n\n尼古拉斯·扎卡斯这个名字本身就是 JavaScript 开发的代名词。我可以花上几页篇幅罗列他的专业成就，但我不打算这么做。尼古拉斯是众所周知的高水平\
    \ JavaScript 开发者和作者，无需介绍。不过，在赞扬本书的内容之前，我想说一些个人感想。\n\n我与尼古拉斯的关系源于多年来作为一个 JavaScript\
    \ 学习者研读他的书、阅读他的博客文章、观看他的演讲，并关注他的 Twitter 更新。我们第一次见面是在几年前我邀请他在一次 jQuery 会议上演讲时。他为\
    \ jQuery 社区带来了一场高质量的演讲，从那时起，我们就在互联网上公开和私下交流。在那段时间里，我对他不仅仅是钦佩，他不仅是 JavaScript 社区的领袖和开发者。他的言辞总是亲切而深思熟虑，他的态度总是和蔼可亲。\n\
    \n他作为开发者、演讲者和作者的意图始终是帮助、教育和改进。当他讲话时，你应该倾听，不仅因为他是 JavaScript 专家，更因为他的品格超越了他的专业地位。\n\
    \n本书的书名和引言清楚地表明了尼古拉斯的意图：他写这本书是为了帮助具有类思维（即 C++ 或 Java）的程序员过渡到一种没有类的语言。在书中，他解释了在编写\
    \ JavaScript 时如何实现封装、聚合、继承和多态。这是让一位有经验的程序员进入面向对象 JavaScript 开发领域的理想读物。如果你作为来自其他语言的开发者阅读这本书，你将获得一本简洁而措辞巧妙的\
    \ JavaScript 书籍。\n\n然而，这本书同样适用于 JavaScript 领域内的程序员。许多 JavaScript 开发者对对象的理解仅限于\
    \ ECMAScript 3（ES3），他们需要一份对 ECMAScript 5（ES5）对象特性的恰当介绍。这本书可以作为这样的介绍，弥合 ES3 对象和\
    \ ES5 对象之间的知识鸿沟。\n\n现在，你可能会想：“有什么大不了的。有几本书已经包含了关于 ES5 中 JavaScript 新增内容的章节或注释。”\
    \ 好吧，确实如此。然而，我相信这是迄今为止唯一一本在整本书中始终将 ES5 对象视为一等公民来关注对象本质的书。这本书不仅对 ES5 对象进行了连贯的介绍，还涵盖了你在学习\
    \ ES5 中许多新特性时需要掌握的 ES3 相关内容。\n\n作为一位作者，我坚信，鉴于这本书对面向对象原则和 ES5 对象更新的关注，在我们等待 ES6\
