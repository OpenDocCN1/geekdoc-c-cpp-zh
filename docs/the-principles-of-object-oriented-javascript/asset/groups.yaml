    \ for-in 循环遍历 supplier 中的属性，然后将该属性的值赋给 receiver 上同名的属性来实现。需要注意的是，这是一个浅拷贝，因此如果某个属性包含一个对象，那么提供者和接收者都将指向同一个对象。这种模式经常用于向\
    \ JavaScript 中已存在于其他对象上的对象添加新行为。\n\n例如，你可以通过混入而不是继承为对象添加事件支持。首先，假设你已经为使用事件定义了一个自定义类型：\n\
