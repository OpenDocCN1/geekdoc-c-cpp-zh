  mdcn: "\n\n## 摘要\n\nJavaScript 通过原型链支持继承。当一个对象的 `[[Prototype]]` 被设置为另一个对象时，对象之间就建立了原型链。所有普通对象都会自动继承自\
    \ `Object.prototype`。如果想创建一个继承自其他对象的对象，可以使用 `Object.create()` 来为新对象指定 `[[Prototype]]`\
    \ 的值。\n\n通过在构造函数上创建原型链，可以实现自定义类型之间的继承。将构造函数的 `prototype` 属性设置为另一个值，就可以在自定义类型的实例与那个值的原型之间建立继承关系。该构造函数的所有实例共享同一个原型，因此它们都继承自同一个对象。这种技术非常适合继承其他对象的方法，但无法通过原型继承自有属性。\n\
    \n要正确继承自有属性，可以使用构造函数窃取（constructor stealing），即通过 `call()` 或 `apply()` 调用构造函数，使所有初始化都在子类型对象上完成。构造函数窃取与原型链相结合，是在\
    \ JavaScript 中实现自定义类型继承最常用的方式。这种组合常被称为“伪经典继承”（pseudoclassical inheritance），因为它与基于类的语言中的继承非常相似。\n\
    \n你可以通过直接访问超类型的原型来调用超类型的方法。这样做时，必须使用 `call()` 或 `apply()` 在子类型对象上执行超类型方法。\n\n\
    ## 6\n\n## 对象模式\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_99_0.png)\n\nJavaScript\
    \ 有很多创建对象的模式，通常完成同一件事不止一种方式。你可以随时定义自己的自定义类型或通用对象。可以使用继承在对象之间共享行为，也可以采用其他技术（如混入\
    \ mix-ins）。还可以利用 JavaScript 的高级特性来防止对象结构被修改。本章讨论的模式基于你的使用场景，为你提供了管理和创建对象的强大方式。\n\
    \n## 私有成员与特权成员\n\nJavaScript 中所有对象属性都是公开的，也没有明确的方式来表示某个属性不应在特定对象外部被访问。然而，有时你可能不希望数据公开。例如，当一个对象使用某个值来确定某种状态时，如果在该对象不知情的情况下修改了这个数据，就会使状态管理过程陷入混乱。避免这种情况的一种方法是使用命名约定。例如，当属性不打算公开时，通常会给属性加下划线前缀（如\
    \ `_name`）。然而，有些隐藏数据的方法不依赖约定，因此在防止私有信息被修改方面更加“万无一失”。\n\n模块模式是一种对象创建模式，旨在创建带有私有数据的单例对象。其基本方法是使用一个立即调用函数表达式（IIFE）来返回对象。IIFE\
    \ 是一个函数表达式，定义后会立即调用以产生结果。该函数表达式可以包含任意数量的局部变量，这些变量无法从函数外部访问。由于返回的对象是在该函数内部定义的，因此对象的方法可以访问这些数据。（在\
    \ IIFE 内部定义的所有对象都可以访问相同的局部变量。）以这种方式访问私有数据的方法称为特权方法。以下是模块模式的基本格式：\n\n```\nvar yourObject\
    \ = (function() {\n  // private data variables\n  return {\n    // public methods\
    \ and properties\n  };\n})();\n①\n```\n\n在这种模式中，会创建并立即执行一个匿名函数。（注意函数末尾的额外括号①。使用此语法可以立即执行匿名函数。）这意味着该函数只存在片刻，执行后即被销毁。IIFE\
    \ 在 JavaScript 中是一种非常流行的模式，部分原因就是它可用于模块模式。\n\n模块模式允许你将普通变量用作事实上的对象属性，这些属性不会公开暴露。实现方式是将闭包函数创建为对象方法。闭包就是访问自身作用域之外数据的函数。例如，每当你在函数中访问全局对象（如\
    \ Web 浏览器中的 `window`）时，该函数就在访问自身作用域之外的变量。模块函数的不同之处在于，变量是在 IIFE 内声明的，而同样在 IIFE\
    \ 内声明的函数会访问这些变量。例如：\n\n```\nvar person = (function() {\n  ① var age = 25;\n  return\
    \ {\n    name: \"Nicholas\",\n    ② getAge: function() {\n      return age;\n\
    \    },\n    ③ growOlder: function() {\n      age++;\n    }\n  };\n})();\n\nconsole.log(person.name);\
    \ // \"Nicholas\"\nconsole.log(person.getAge()); // 25\n\nperson.age = 100;\n\
    console.log(person.getAge()); // 25\n\nperson.growOlder();\nconsole.log(person.getAge());\
    \ // 26\n```\n\n这段代码使用模块模式创建了 `person` 对象。`age` 变量①充当对象的私有属性。它无法从对象外部直接访问，但可以被对象的方法使用。对象上有两个特权方法：`getAge()`②读取\
    \ `age` 变量的值，`growOlder()`③使 `age` 递增。这两个方法都可以直接访问 `age` 变量，因为它定义在包含这些方法的外部函数中。\n\
    \n模块模式有一种变体，称为“揭示模块模式”（revealing module pattern），它将所有变量和方法放在 IIFE 的顶部，然后简单地将它们赋给返回的对象。你可以使用揭示模块模式将前面的示例改写如下：\n\
    \n```\nvar person = (function() {\n  var age = 25;\n  function getAge() {\n  \
    \  return age;\n  }\n  function growOlder() {\n    age++;\n  }\n  return {\n \
    \   name: \"Nicholas\",\n    getAge: getAge,\n    growOlder: growOlder\n  };\n\
    })();\n```\n\n在揭示模块模式中，`age`、`getAge()` 和 `growOlder()` 都定义为 IIFE 的局部内容。随后，`getAge()`\
    \ 和 `growOlder()` 函数被赋给返回的对象①，实际上是在 IIFE 外部“揭示”了它们。这段代码本质上与之前使用传统模块模式的示例相同；不过，有些人更喜欢这种模式，因为它将所有变量和函数声明放在一起。\n\
    \n模块模式非常适合定义具有私有属性的单个对象，但那些也需要自身私有属性的自定义类型呢？你可以在构造函数内部使用与模块模式类似的模式来创建实例特有的私有数据。例如：\n\
    \n```\nfunction Person(name) {\n  // define a variable only accessible inside\
    \ of the Person constructor\n  var age = 25;\n  this.name = name;\n  this.getAge\
    \ = function() {\n    return age;\n  };\n```\n\n```\nthis.growOlder = function()\
    \ {\n    age++;\n};\n}\n\nvar person = new Person(\"Nicholas\");\n\nconsole.log(person.name);\
    \    // \"Nicholas\"\nconsole.log(person.getAge());    // 25\n\nperson.age = 100;\n\
    console.log(person.getAge());    // 25\n\nperson.growOlder();\nconsole.log(person.getAge());\
    \    // 26\n```\n\n在这段代码中，`Person` 构造函数有一个局部变量 `age`。该变量被用于 `getAge()`① 和 `growOlder()`②\
    \ 方法。当你创建 `Person` 的实例时，该实例会获得自己的 `age` 变量、`getAge()` 方法和 `growOlder()` 方法。这在很多方面与模块模式类似，构造函数创建了一个局部作用域并返回\
    \ `this` 对象。正如第 4 章讨论的，将方法放在对象实例上比放在原型上效率更低，但当你需要私有且实例特有的数据时，这是唯一可行的方法。\n\n如果你希望私有数据在所有实例之间共享（就像放在原型上一样），可以使用一种混合方法，它看起来像模块模式，但使用了构造函数：\n\
    \n```\nvar Person = (function() {\n\n    // everyone shares the same age\n   \
    \ var age = 25;\n\n    function InnerPerson(name) {\n        this.name = name;\n\
    \    }\n\n    InnerPerson.prototype.getAge = function() {\n        return age;\n\
    \    };\n\n    InnerPerson.prototype.growOlder = function() {\n        age++;\n\
    \    };\n\n    return InnerPerson;\n\n})();\n```\n\n"
