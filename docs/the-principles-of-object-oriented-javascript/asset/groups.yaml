    \ JavaScript 中定义和执行函数的各种方式。因为函数是对象，所以它们的行为与其他语言中的函数不同，而这种行为对于深入理解 JavaScript 至关重要。\n\
    \n### 声明与表达式\n\n实际上有两种函数字面量形式。第一种是函数声明，以 function 关键字开头，后面紧跟函数名称。函数内容用大括号括起来，如下所示：\n\
    \n```\nfunction add(num1, num2) {\n    return num1 + num2;\n}\n```\n\n第二种形式是函数表达式，它不需要在\
    \ function 后面有名称。这些函数被视为匿名函数，因为函数对象本身没有名称。相反，函数表达式通常通过变量或属性来引用，如下面的表达式所示：\n\n\
    ```\nvar add = function(num1, num2) {\n    return num1 + num2;\n};\n```\n\n这段代码实际上将一个函数值赋给了变量\
    \ add。函数表达式与函数声明几乎相同，只是缺少名称和末尾的分号。赋值表达式通常以分号结尾，就像你赋值任何其他值一样。\n\n尽管这两种形式非常相似，但它们的区别非常重要。函数声明在代码执行时会被提升到上下文的顶部（无论是声明所在的函数还是全局作用域）。这意味着你实际上可以在代码中使用函数之后再定义它，而不会产生错误。例如：\n\
    \n```\nvar result = add(5, 5);\n\nfunction add(num1, num2) {\n    return num1\
    \ + num2;\n}\n```\n\n这段代码看起来可能会导致错误，但实际上运行良好。这是因为 JavaScript 引擎将函数声明提升到顶部，并实际上执行代码，就好像代码是这样写的：\n\
    \n```\n// how the JavaScript engine interprets the code\nfunction add(num1, num2)\
    \ {\n    return num1 + num2;\n}\n\nvar result = add(5, 5);\n```\n\n函数提升只发生在函数声明上，因为函数名称是事先已知的。另一方面，函数表达式不能被提升，因为这些函数只能通过变量来引用。所以以下代码会导致错误：\n\
    \n```\n// error!\nvar result = add(5, 5);\n\nvar add = function(num1, num2) {\n\
    \    return num1 + num2;\n};\n```\n\n只要始终在使用函数之前定义它们，你既可以使用函数声明，也可以使用函数表达式。\n\n\
    ### 函数作为值\n\n由于 JavaScript 拥有一等函数，你可以像使用任何其他对象一样使用它们。你可以将它们赋值给变量、添加到对象中、作为参数传递给其他函数，并从函数中返回它们。基本上，你可以在任何使用其他引用值的地方使用函数。这使得\
    \ JavaScript 函数异常强大。考虑以下示例：\n\n```\n① function sayHi() {\n    console.log(\"Hi!\"\
    );\n}\n\nsayHi();      // outputs \"Hi!\"\n\n② var sayHi2 = sayHi;\n\nsayHi2();\
    \     // outputs \"Hi!\"\n```\n\n"
