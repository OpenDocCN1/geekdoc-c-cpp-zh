    \ instanceof Object);    // true\nconsole.log(object instanceof Object);   //\
    \ true\nconsole.log(object instanceof Array);    // false\nconsole.log(reflect\
    \ instanceof Function); // true\nconsole.log(reflect instanceof Object);   //\
    \ true\n```\n\nEach reference type is correctly identified as an instance of Object,\
    \ from which all reference types inherit.\n\n# Identifying Arrays\n\nAlthough\
    \ instanceof can identify arrays, there is one exception that affects web developers:\
