    \ 启蒙》和《jQuery 启蒙》的作者\n爱达荷州博伊西\n2013 年 12 月 16 日\n\n# 致谢\n\n我要感谢凯特·松平说服我，自助出版电子书是将这些信息传播出去的最佳方式。如果没有她的建议，我可能还在纠结该如何处理这本书中的信息。\n\
