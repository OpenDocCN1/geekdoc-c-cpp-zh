    \n当 `new` 与函数一起调用时，由 `this` 代表的新创建对象已经是构造函数所代表的自定义类型的实例。因此可以使用 `instanceof` 来判断函数调用中是否使用了\
    \ `new`：\n\n```\nfunction Person(name) {\n    if (this instanceof Person) {\n\
    \        // called with \"new\"\n    } else {\n        // called without \"new\"\
    \n    }\n}\n```\n\n使用这样的模式，你可以根据函数是带 `new` 还是不带 `new` 调用来控制其行为。你可能希望针对不同情况做出不同处理，但通常你希望函数表现相同（通常是为了防止意外遗漏\
    \ `new`）。Person 的作用域安全版本如下：\n\n```\nfunction Person(name) {\n    if (this instanceof\
    \ Person) {\n        this.name = name;\n    } else {\n        return new Person(name);\n\
    \    }\n}\n```\n\n对于这个构造函数，当使用 `new` 时，`name` 属性会像往常一样被赋值。如果未使用 `new`，则通过 `new`\
    \ 递归调用构造函数，以创建合适的对象实例。这样，以下两种写法是等价的：\n\n```\nvar person1 = new Person(\"Nicholas\"\
    );\nvar person2 = Person(\"Nicholas\");\n\nconsole.log(person1 instanceof Person);\
    \   // true\nconsole.log(person2 instanceof Person);   // true\n```\n\n没有使用 `new`\
    \ 运算符而创建新对象正变得越来越常见，以尽力避免因遗漏 `new` 而导致的错误。JavaScript 本身有几种具有作用域安全构造函数的引用类型，例如\
    \ `Object`、`Array`、`RegExp` 和 `Error`。\n\n## 总结\n\n在 JavaScript 中，创建和组合对象有许多不同的方式。虽然\
    \ JavaScript 没有正式的私有属性的概念，但你可以创建只能从对象内部访问的数据或函数。对于单例对象，你可以使用模块模式隐藏对外部世界的数据。你可以使用立即调用函数表达式（IIFE）定义局部变量和函数，这些变量和函数只能由新创建的对象访问。特权方法是对象上能够访问私有数据的方法。你也可以通过构造函数函数中定义变量，或使用\
    \ IIFE 创建所有实例共享的私有数据，来创建具有私有数据的构造函数。\n\n混入（Mixin）是一种在避免继承的同时向对象添加功能的有力方式。混入将一个对象的属性复制到另一个对象，这样接收对象就获得了功能，而无需继承自提供对象。与继承不同，混入不允许你在对象创建后识别这些能力的来源。因此，混入最适合用于数据属性或小段功能。当你想获得更多功能并知道功能来源时，继承仍然是更好的选择。\n\
    \n作用域安全构造函数是你可以带或不带 `new` 调用的构造函数，用于创建新对象实例。这种模式利用了构造函数一旦开始执行，`this` 就是自定义类型的实例这一事实，从而允许你根据是否使用\
    \ `new` 运算符来改变构造函数的行为。\n\n## 索引\n\n## 符号\n\n{ }（花括号）\n  用于函数内容，18\n  以及对象属性，9\n\
    ==（双等号运算符），5\n===（三等号运算符），5\n[ ]（方括号）\n  用于数组字面量，10\n  用于属性访问，11–12\n[[ ]]（双方括号表示法），17\n\
