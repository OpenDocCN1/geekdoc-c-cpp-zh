  - "[PAGE 59]\n\n# Common Attributes\n\nThere are two property attributes shared\
    \ between data and accessor properties. One is [[Enumerable]], which determines\
    \ whether you can iterate over the property. The other is [[Configurable]], which\
    \ determines whether the property can be changed. You can remove a configurable\
    \ property using delete and can change its attributes at any time. (This also\
    \ means configurable properties can be changed from data to accessor properties\
    \ and vice versa.) By default, all properties you declare on an object are both\
    \ enumerable and configurable.\n\nIf you want to change property attributes, you\
    \ can use the Object.defineProperty() method. This method accepts three arguments:\
    \ the object that owns the property, the property name, and a property descriptor\
    \ object containing the attributes to set. The descriptor has properties with\
    \ the same name as the internal attributes but without the square brackets. So\
    \ you use enumerable to set [[Enumerable]], and configurable to set [[Configurable]].\
    \ For example, suppose you want to make an object property nonenumerable and nonconfigurable:\n\
    \n```\nvar person1 = {\n    name: \"Nicholas\"\n};\n\nObject.defineProperty(person1,\
    \ \"name\", {\n    enumerable: false\n});\n\nconsole.log(\"name\" in person1);\
    \          // true\nconsole.log(person1.propertyIsEnumerable(\"name\"));  // false\n\
    \nvar properties = Object.keys(person1);\nconsole.log(properties.length);    \
    \       // 0\n\nObject.defineProperty(person1, \"name\", {\n    configurable:\
    \ false\n});\n\n// try to delete the Property\ndelete person1.name;\nconsole.log(\"\
    name\" in person1);          // true\nconsole.log(person1.name);             \
    \   // \"Nicholas\"\n\nObject.defineProperty(person1, \"name\", {  // error!!!\n\
    \    configurable: true\n});\n```\n\nThe name property is defined as usual ①,\
    \ but it’s then modified to set its [[Enumerable]] attribute to false ②. The propertyIsEnumerable()\
    \ method now returns false ③ because it references the new value of [[Enumerable]]."
  - "[PAGE 60]\n\nAfter that, name is changed to be nonconfigurable ④. From now on,\
    \ attempts to delete name fail because the property can't be changed, so name\
    \ is still present on person1 ⑤. Calling Object.defineProperty() on name again\
    \ would also result in no further changes to the property. Effectively, name is\
    \ locked down as a property on person1.\n\nThe last piece of the code tries to\
    \ redefine name to be configurable once again ⑥. However, this throws an error\
    \ because you can't make a nonconfigurable property configurable again. Attempting\
    \ to change a data property into an accessor property or vice versa should also\
    \ throw an error in this case.\n\n> NOTE When JavaScript is running in strict\
    \ mode, attempting to delete a nonconfigurable property results in an error. In\
    \ nonstrict mode, the operation silently fails.\n\n# Data Property Attributes\n\
    \nData properties possess two additional attributes that accessors do not. The\
    \ first is [[Value]], which holds the property value. This attribute is filled\
    \ in automatically when you create a property on an object. All property values\
    \ are stored in [[Value]], even if the value is a function.\n\nThe second attribute\
    \ is [[Writable]], which is a Boolean value indicating whether the property can\
    \ be written to. By default, all properties are writable unless you specify otherwise.\n\
    \nWith these two additional attributes, you can fully define a data property using\
    \ Object.defineProperty() even if the property doesn't already exist. Consider\
    \ this code:\n\n```\nvar person1 = {\n    name: \"Nicholas\"\n};\n```\n\nYou've\
    \ seen this snippet throughout this chapter; it adds the name property to person1\
    \ and sets its value. You can achieve the same result using the following (more\
    \ verbose) code:\n\n```\nvar person1 = {};\n\nObject.defineProperty(person1, \"\
    name\", {\n    value: \"Nicholas\",\n    enumerable: true,\n    configurable:\
    \ true,\n    writable: true\n});\n```"
  - "[PAGE 61]\n\nWhen Object.defineProperty() is called, it first checks to see if\
    \ the property exists. If the property doesn’t exist, a new one is added with\
    \ the attributes specified in the descriptor. In this case, name isn’t already\
    \ a property of person1, so it is created.\n\nWhen you are defining a new property\
    \ with Object.defineProperty(), it’s important to specify all of the attributes\
    \ because Boolean attributes automatically default to false otherwise. For example,\
    \ the following code creates a name property that is nonenumerable, nonconfigurable,\
    \ and nonwritable because it doesn’t explicitly make any of those attributes true\
    \ in the call to Object.defineProperty().\n\n```\nvar person1 = {};\n\nObject.defineProperty(person1,\
    \ \"name\", {\n    value: \"Nicholas\"\n});\n\nconsole.log(\"name\" in person1);\
    \                // true\nconsole.log(person1.propertyIsEnumerable(\"name\"));\
    \  // false\n\ndelete person1.name;\nconsole.log(\"name\" in person1);       \
    \         // true\n\nperson1.name = \"Greg\";\nconsole.log(person1.name);    \
    \                  // \"Nicholas\"\n```\n\nIn this code, you can’t do anything\
    \ with the name property except read the value; every other operation is locked\
    \ down. If you’re changing an existing property, keep in mind that only the attributes\
    \ you specify will change.\n\n> NOTE Nonwritable properties throw an error in\
    \ strict mode when you try to change the value. In nonstrict mode, the operation\
    \ silently fails.\n\n# Accessor Property Attributes\n\nAccessor properties also\
    \ have two additional attributes. Because there is no value stored for accessor\
    \ properties, there is no need for [[Value]] or [[Writable]]. Instead, accessors\
    \ have [[Get]] and [[Set]], which contain the getter and setter functions, respectively.\
    \ As with the object literal form of getters and setters, you need only define\
    \ one of these attributes to create the property.\n\n> NOTE If you try to create\
    \ a property with both data and accessor attributes, you will get an error."
  - "[PAGE 62]\n\nThe advantage of using accessor property attributes instead of object\
    \ literal notation to define accessor properties is that you can also define those\
    \ properties on existing objects. If you want to use object literal notation,\
    \ you have to define accessor properties when you create the object.\n\nAs with\
    \ data properties, you can also specify whether accessor properties are configurable\
    \ or enumerable. Consider this example from earlier:\n\n```\nvar person1 = {\n\
    \  _name: \"Nicholas\",\n\n  get name() {\n    console.log(\"Reading name\");\n\
    \    return this._name;\n  },\n\n  set name(value) {\n    console.log(\"Setting\
    \ name to %s\", value);\n    this._name = value;\n  }\n};\n```\n\nThis code can\
    \ also be written as follows:\n\n```\nvar person1 = {\n  _name: \"Nicholas\"\n\
    };\n\nObject.defineProperty(person1, \"name\", {\n  get: function() {\n    console.log(\"\
    Reading name\");\n    return this._name;\n  },\n  set: function(value) {\n   \
    \ console.log(\"Setting name to %s\", value);\n    this._name = value;\n  },\n\
    \  enumerable: true,\n  configurable: true\n});\n```\n\nNotice that the get and\
    \ set keys on the object passed in to Object.defineProperty() are data properties\
    \ that contain a function. You can’t use object literal accessor format here.\n\
    \nSetting the other attributes ([[Enumerable]] and [[Configurable]]) allows you\
    \ to change how the accessor property works. For example, you can create a nonconfigurable,\
    \ nonenumerable, nonwritable property like this:\n\n```\nvar person1 = {\n  _name:\
    \ \"Nicholas\"\n};\n```"
