    \ }）\n  用于函数内容，18\n  以及对象属性，9\n方括号表示法，用于属性访问，11–12\n内置对象原型，62–63\n内置类型，实例化，8–11\n\
    \n## C\n\ncall() 方法，26–27, 75\n[[Call]] 属性，17\n大写，构造函数名称，50\ncapitalize() 方法，用于字符串，62\n\
