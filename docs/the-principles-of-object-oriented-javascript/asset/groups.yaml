  - "[PAGE 52]\n\n# Defining Properties\n\nRecall from Chapter 1 that there are two\
    \ basic ways to create your own objects: using the Object constructor and using\
    \ an object literal. For example:\n\n```\nvar person1 = {\n  name: \"Nicholas\"\
    \n};\n\nvar person2 = new Object();\nperson2.name = \"Nicholas\";\n\n① person1.age\
    \ = \"Redacted\";\nperson2.age = \"Redacted\";\n\n② person1.name = \"Greg\";\n\
    person2.name = \"Michael\";\n```\n\nBoth person1 and person2 are objects with\
    \ a name property. Later in the example, both objects are assigned an age property\
    \ ①. You could do this immediately after the definition of the object or much\
    \ later. Objects you create are always wide open for modification unless you specify\
    \ otherwise (more on that in “Preventing Object Modification” on page 45). The\
    \ last part of this example changes the value of name on each object ②; property\
    \ values can be changed at any time as well.\n\nWhen a property is first added\
    \ to an object, JavaScript uses an internal method called [[Put]] on the object.\
    \ The [[Put]] method creates a spot in the object to store the property. You can\
    \ compare this to adding a key to a hash table for the first time. This operation\
    \ specifies not just the initial value, but also some attributes of the property.\
    \ So, in the previous example, when the name and age properties are first defined\
    \ on each object, the [[Put]] method is invoked for each.\n\nThe result of calling\
    \ [[Put]] is the creation of an own property on the object. An own property simply\
    \ indicates that the specific instance of the object owns that property. The property\
    \ is stored directly on the instance, and all operations on the property must\
    \ be performed through that object.\n\n> NOTE Own properties are distinct from\
    \ prototype properties, which are discussed in Chapter 4.\n\nWhen a new value\
    \ is assigned to an existing property, a separate operation called [[Set]] takes\
    \ place. This operation replaces the current value of the property with the new\
    \ one. In the previous example, setting name"
  - "[PAGE 53]\n\nto a second value results in a call to [[Set]]. See Figure 3-1 for\
    \ a step-by-step view of what happened to person1 behind the scenes as its name\
    \ and age properties were changed.\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_53_0.png)\n\
    \nFigure 3-1: Adding and changing properties of an object\n\nIn the first part\
    \ of the diagram, an object literal is used to create the person1 object. This\
    \ performs an implicit [[Put]] for the name property. Assigning a value to person1.age\
    \ performs a [[Put]] for the age property. However, setting person1.name to a\
    \ new value (\"Greg\") performs a [[Set]] operation on the name property, overwriting\
    \ the existing property value.\n\n# Detecting Properties\n\nBecause properties\
    \ can be added at any time, it’s sometimes necessary to check whether a property\
    \ exists in the object. New JavaScript developers often incorrectly use patterns\
    \ like the following to detect whether a property exists:\n\n```\n// unreliable\n\
    if (person1.age) {\n    // do something with age\n}\n```\n\nThe problem with this\
    \ pattern is how JavaScript’s type coercion affects the outcome. The if condition\
    \ evaluates to true if the value is truthy (an object, a nonempty string, a nonzero\
    \ number, or true) and evaluates to false if the value is falsy (null, undefined,\
    \ 0, false, NaN, or an empty string). Because an object property can contain one\
    \ of these falsy values, the example code can yield false negatives. For instance,\
    \ if person1.age is 0, then the if condition will not be met even though the property\
    \ exists. A more reliable way to test for the existence of a property is with\
    \ the in operator."
  - "[PAGE 54]\n\nThe in operator looks for a property with a given name in a specific\
    \ object and returns true if it finds it. In effect, the in operator checks to\
    \ see if the given key exists in the hash table. For example, here’s what happens\
    \ when in is used to check for some properties in the person1 object:\n\n```\n\
    console.log(\"name\" in person1);    // true\nconsole.log(\"age\" in person1);\
    \      // true\nconsole.log(\"title\" in person1);    // false\n```\n\nKeep in\
    \ mind that methods are just properties that reference functions, so you can check\
    \ for the existence of a method in the same way. The following adds a new function,\
    \ sayName(), to person1 and uses in to confirm the function’s presence.\n\n```\n\
    var person1 = {\n    name: \"Nicholas\",\n    sayName: function() {\n        console.log(this.name);\n\
    \    }\n};\n\nconsole.log(\"sayName\" in person1);  // true\n```\n\nIn most cases,\
    \ the in operator is the best way to determine whether the property exists in\
    \ an object. It has the added benefit of not evaluating the value of the property,\
    \ which can be important if such an evaluation is likely to cause a performance\
    \ issue or an error.\n\nIn some cases, however, you might want to check for the\
    \ existence of a property only if it is an own property. The in operator checks\
    \ for both own properties and prototype properties, so you’ll need to take a different\
    \ approach. Enter the hasOwnProperty() method, which is present on all objects\
    \ and returns true only if the given property exists and is an own property. For\
    \ example, the following code compares the results of using in versus hasOwnProperty()\
    \ on different properties in person1:\n\n```\nvar person1 = {\n    name: \"Nicholas\"\
    ,\n    sayName: function() {\n        console.log(this.name);\n    }\n};\n\nconsole.log(\"\
    name\" in person1);                     // true\nconsole.log(person1.hasOwnProperty(\"\
    name\"));        // true\n\nconsole.log(\"toString\" in person1);            \
    \     // true\nconsole.log(person1.hasOwnProperty(\"toString\"));    // false\n\
    ```"
  - "[PAGE 55]\n\nIn this example, name is an own property of person1, so both the\
    \ in operator and hasOwnProperty() return true. The toString() method, however,\
    \ is a prototype property that is present on all objects. The in operator returns\
    \ true for toString(), but hasOwnProperty() returns false ①. This is an important\
    \ distinction that is discussed further in Chapter 4.\n\n# Removing Properties\n\
    \nJust as properties can be added to objects at any time, they can also be removed.\
    \ Simply setting a property to null doesn't actually remove the property completely\
    \ from the object, though. Such an operation calls [[Set]] with a value of null,\
    \ which, as you saw earlier in the chapter, only replaces the value of the property.\
    \ You need to use the delete operator to completely remove a property from an\
    \ object.\n\nThe delete operator works on a single object property and calls an\
    \ internal operation named [[Delete]]. You can think of this operation as removing\
    \ a key/value pair from a hash table. When the delete operator is successful,\
    \ it returns true. (Some properties can't be removed, and this is discussed in\
    \ more detail later in the chapter.) For example, the following listing shows\
    \ the delete operator at work:\n\n```\nvar person1 = {\n  name: \"Nicholas\"\n\
    };\n\nconsole.log(\"name\" in person1);    // true\n\ndelete person1.name;   \
    \             // true - not output\nconsole.log(\"name\" in person1);    // false\n\
    console.log(person1.name);          // undefined\n```\n\nIn this example, the\
    \ name property is deleted from person1. The in operator returns false after the\
    \ operation is complete. Also, note that attempting to access a property that\
    \ doesn't exist will just return undefined ①. Figure 3-2 shows how delete affects\
    \ an object.\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_55_0.png)\n\nFigure 3-2:\
    \ When you delete the name property, it completely disappears from person1."
  - "[PAGE 56]\n\n# Enumeration\n\nBy default, all properties that you add to an object\
    \ are enumerable, which means that you can iterate over them using a for-in loop.\
    \ Enumerable properties have their internal [[Enumerable]] attributes set to true.\
    \ The for-in loop enumerates all enumerable properties on an object, assigning\
    \ the property name to a variable. For example, the following loop outputs the\
    \ property names and values of an object:\n\n```\nvar property;\n\nfor (property\
    \ in object) {\n    console.log(\"Name: \" + property);\n    console.log(\"Value:\
    \ \" + object[property]);\n}\n```\n\nEach time through the for-in loop, the property\
    \ variable is filled with the next enumerable property on the object until all\
    \ such properties have been used. At that point, the loop is finished and code\
    \ execution continues. This example uses bracket notation to retrieve the value\
    \ of the object property and output it to the console, which is one of the primary\
    \ use cases for bracket notation in JavaScript.\n\nIf you just need a list of\
    \ an object's properties to use later in your program, ECMAScript 5 introduced\
    \ the Object.keys() method to retrieve an array of enumerable property names,\
    \ as shown here:\n\n```\nvar properties = Object.keys(object);\n\n// if you want\
    \ to mimic for-in behavior\nvar i, len;\n\nfor (i=0, len=properties.length; i\
    \ < len; i++){\n    console.log(\"Name: \" + properties[i]);\n    console.log(\"\
    Value: \" + object[properties[i]]);\n}\n```\n\nThis example uses Object.keys()\
    \ to retrieve the enumerable properties from an object ①. A for loop is then used\
    \ to iterate over the properties and output the name and value. Typically, you\
    \ would use Object.keys() in situations where you want to operate on an array\
    \ of property names and for-in when you don't need an array.\n\n> NOTE There is\
    \ a difference between the enumerable properties returned in a for-in loop and\
    \ the ones returned by Object.keys(). The for-in loop also enumerates prototype\
    \ properties, while Object.keys() returns only own (instance) properties. The\
    \ differences between prototype and own properties are discussed in Chapter 4."
