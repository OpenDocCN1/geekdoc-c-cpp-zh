    \ \"Nicholas\"\n```\n\n在这段代码中，你只能读取 name 属性的值；所有其他操作都被锁定。如果你正在更改现有属性，请记住只有你指定的属性才会更改。\n\
    \n> NOTE 在严格模式下，当你尝试更改不可写属性的值时，会抛出错误。在非严格模式下，该操作会静默失败。\n\n## 访问器属性属性\n\n访问器属性也有两个额外的属性。因为访问器属性不存储值，所以不需要\
    \ [[Value]] 或 [[Writable]]。相反，访问器具有 [[Get]] 和 [[Set]]，分别包含 getter 和 setter 函数。与对象字面量形式的\
    \ getter 和 setter 一样，你只需要定义其中一个属性即可创建该属性。\n\n> NOTE 如果你尝试创建一个同时具有数据和访问器属性的属性，你会得到一个错误。\n\
    \n使用访问器属性属性而不是对象字面量表示法来定义访问器属性的优点是，你也可以在现有对象上定义这些属性。如果你想使用对象字面量表示法，你必须在创建对象时定义访问器属性。\n\
    \n与数据属性一样，你也可以指定访问器属性是否可配置或可枚举。考虑以下来自之前的示例：\n\n```\nvar person1 = {\n  _name:\
    \ \"Nicholas\",\n\n  get name() {\n    console.log(\"Reading name\");\n    return\
    \ this._name;\n  },\n\n  set name(value) {\n    console.log(\"Setting name to\
    \ %s\", value);\n    this._name = value;\n  }\n};\n```\n\n此代码也可以写成如下形式：\n\n```\n\
    var person1 = {\n  _name: \"Nicholas\"\n};\n\nObject.defineProperty(person1, \"\
    name\", {\n  get: function() {\n    console.log(\"Reading name\");\n    return\
    \ this._name;\n  },\n  set: function(value) {\n    console.log(\"Setting name\
    \ to %s\", value);\n    this._name = value;\n  },\n  enumerable: true,\n  configurable:\
    \ true\n});\n```\n\n请注意，传递给 Object.defineProperty() 的对象上的 get 和 set 键是包含函数的 数据属性。你不能在此处使用对象字面量访问器格式。\n\
    \n设置其他属性（[[Enumerable]] 和 [[Configurable]]）允许你更改访问器属性的工作方式。例如，你可以像这样创建一个不可配置、不可枚举、不可写的属性：\n\
    \n```\nvar person1 = {\n  _name: \"Nicholas\"\n};\n```\n"
