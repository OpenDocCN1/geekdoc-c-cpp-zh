  - "[PAGE 65]\n\n# Preventing Object Modification\n\nObjects, just like properties,\
    \ have internal attributes that govern their behavior. One of these attributes\
    \ is [[Extensible]], which is a Boolean value indicating if the object itself\
    \ can be modified. All objects you create are extensible by default, meaning new\
    \ properties can be added to the object at any time. You’ve seen this several\
    \ times in this chapter. By setting [[Extensible]] to false, you can prevent new\
    \ properties from being added to an object. There are three different ways to\
    \ accomplish this.\n\n# Preventing Extensions\n\nOne way to create a nonextensible\
    \ object is with Object.preventExtensions(). This method accepts a single argument,\
    \ which is the object you want to make nonextensible. Once you use this method\
    \ on an object, you’ll never be able to add any new properties to it again. You\
    \ can check the value of [[Extensible]] by using Object.isExtensible(). The following\
    \ code shows examples of both methods at work.\n\n```\nvar person1 = {\n  name:\
    \ \"Nicholas\"\n};\n\n① console.log(Object.isExtensible(person1));    // true\n\
    \n② Object.preventExtensions(person1);\nconsole.log(Object.isExtensible(person1));\
    \    // false\n\n③ person1.sayName = function() {\n  console.log(this.name);\n\
    };\n\nconsole.log(\"sayName\" in person1);    // false\n```\n\nAfter creating\
    \ person1, this example checks the object’s [[Extensible]] attribute ① before\
    \ making it unchangeable ②. Now that person1 is nonextensible, the sayName() method\
    \ ③ is never added to it.\n\n> NOTE\n> Attempting to add a property to a nonextensible\
    \ object will throw an error in strict mode. In nonstrict mode, the operation\
    \ fails silently. You should always use strict mode with nonextensible objects\
    \ so that you are aware when a nonextensible object is being used incorrectly.\n\
    \n# Sealing Objects\n\nThe second way to create a nonextensible object is to seal\
    \ the object. A sealed object is nonextensible, and all of its properties are\
    \ nonconfigurable. That means not only can you not add new properties to the object,"
  - "[PAGE 66]\n\nbut you also can’t remove properties or change their type (from\
    \ data to accessor or vice versa). If an object is sealed, you can only read from\
    \ and write to its properties.\n\nYou can use the Object.seal() method on an object\
    \ to seal it. When that happens, the [[Extensible]] attribute is set to false,\
    \ and all properties have their [[Configurable]] attribute set to false. You can\
    \ check to see whether an object is sealed using Object.isSealed() as follows:\n\
    \n```\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nconsole.log(Object.isExtensible(person1));\
    \ // true\nconsole.log(Object.isSealed(person1)); // false\n```\n\n+   ① Object.seal(person1);\n\
    +   ② console.log(Object.isExtensible(person1)); // false\n+   console.log(Object.isSealed(person1));\
    \ // true\n+   ③ person1.sayName = function() {\n+     console.log(this.name);\n\
    +   };\n+   console.log(\"sayName\" in person1); // false\n+   ④ person1.name\
    \ = \"Greg\";\n+   console.log(person1.name); // \"Greg\"\n+   ⑤ delete person1.name;\n\
    +   console.log(\"name\" in person1); // true\n+   console.log(person1.name);\
    \ // \"Greg\"\n+   \n+   var descriptor = Object.getOwnPropertyDescriptor(person1,\
    \ \"name\");\n+   console.log(descriptor.configurable); // false\n\nThis code\
    \ seals person1 ① so you can’t add or remove properties. Since all sealed objects\
    \ are nonextensible, Object.isExtensible() returns false ② when used on person1,\
    \ and the attempt to add a method called sayName() ③ fails silently. Also, though\
    \ person1.name is successfully changed to a new value ④, the attempt to delete\
    \ ⑤ fails.\n\nIf you’re familiar with Java or C++, sealed objects should also\
    \ be familiar. When you create a new object instance based on a class in one of\
    \ those languages, you can’t add any new properties to that object. However, if\
    \ a property contains an object, you can modify that object. In effect, sealed\
    \ objects are JavaScript’s way of giving you the same measure of control without\
    \ using classes.\n\n**NOTE**\n\nBe sure to use strict mode with sealed objects\
    \ so you’ll get an error when someone tries to use the object incorrectly."
  - "[PAGE 67]\n\n# Freezing Objects\n\nThe last way to create a nonextensible object\
    \ is to freeze it. If an object is frozen, you can't add or remove properties,\
    \ you can't change properties' types, and you can't write to any data properties.\
    \ In essence, a frozen object is a sealed object where data properties are also\
    \ read-only. Frozen objects can't become unfrozen, so they remain in the state\
    \ they were in when they became frozen. You can freeze an object by using Object.freeze()\
    \ and determine if an object is frozen by using Object.isFrozen(). For example:\n\
    \n```\nvar person1 = {\n    name: \"Nicholas\"\n};\n\nconsole.log(Object.isExtensible(person1));\
    \    // true\nconsole.log(Object.isSealed(person1));        // false\nconsole.log(Object.isFrozen(person1));\
    \        // false\n\n① Object.freeze(person1);\n② console.log(Object.isExtensible(person1));\
    \  // false\n③ console.log(Object.isSealed(person1));      // true\nconsole.log(Object.isFrozen(person1));\
    \        // true\n\nperson1.sayName = function() {\n    console.log(this.name);\n\
    };\n\nconsole.log(\"sayName\" in person1);           // false\n\n④ person1.name\
    \ = \"Greg\";\nconsole.log(person1.name);                    // \"Nicholas\"\n\
    \ndelete person1.name;\nconsole.log(\"name\" in person1);              // true\n\
    console.log(person1.name);                    // \"Nicholas\"\n\nvar descriptor\
    \ = Object.getOwnPropertyDescriptor(person1, \"name\");\nconsole.log(descriptor.configurable);\
    \         // false\nconsole.log(descriptor.writable);             // false\n```\n\
    \nIn this example, person1 is frozen ①. Frozen objects are also considered nonextensible\
    \ and sealed, so Object.isExtensible() returns false ② and Object.isSealed() returns\
    \ true ③. The name property can't be changed, so even though it is assigned to\
    \ \"Greg\", the operation fails ④, and subsequent checks of name will still return\
    \ \"Nicholas\".\n\n> NOTE Frozen objects are simply snapshots of an object at\
    \ a particular point in time. They are of limited use and should be used rarely.\
    \ As with all nonextensible objects, you should use strict mode with frozen objects."
