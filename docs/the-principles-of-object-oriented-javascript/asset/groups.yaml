  - "[PAGE 57]\n\nKeep in mind that not all properties are enumerable. In fact, most\
    \ of the native methods on objects have their [[Enumerable]] attribute set to\
    \ false. You can check whether a property is enumerable by using the propertyIsEnumerable()\
    \ method, which is present on every object:\n\n```\nvar person1 = {\n    name:\
    \ \"Nicholas\"\n};\n\nconsole.log(\"name\" in person1);                     //\
    \ true\nconsole.log(person1.propertyIsEnumerable(\"name\"));   // true\n\nvar\
    \ properties = Object.keys(person1);\n\nconsole.log(\"length\" in properties);\
    \                 // true\nconsole.log(properties.propertyIsEnumerable(\"length\"\
    )); // false\n```\n\nHere, the property name is enumerable, as it is a custom\
    \ property defined on person1 ①. The length property for the properties array,\
    \ on the other hand, is not enumerable ② because it's a built-in property on Array.prototype.\
    \ You'll find that many native properties are not enumerable by default.\n\n#\
    \ Types of Properties\n\nThere are two different types of properties: data properties\
    \ and accessor properties. Data properties contain a value, like the name property\
    \ from earlier examples in this chapter. The default behavior of the [[Put]] method\
    \ is to create a data property, and every example up to this point in the chapter\
    \ has used data properties. Accessor properties don't contain a value but instead\
    \ define a function to call when the property is read (called a getter), and a\
    \ function to call when the property is written to (called a setter). Accessor\
    \ properties only require either a getter or a setter, though they can have both.\n\
    \nThere is a special syntax to define an accessor property using an object literal:\n\
    \n```\nvar person1 = {\n    _name: \"Nicholas\",\n\n    get name() {\n       \
    \ console.log(\"Reading name\");\n        return this._name;\n    },\n```"
