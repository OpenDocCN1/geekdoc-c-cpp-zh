    ```\n\n此示例在 Array.prototype 上创建了一个名为 sum() 的方法，它只是将数组中的所有项相加并返回结果。numbers 数组通过原型自动获得了访问该方法的权限。在\
    \ sum() 内部，this 指向 numbers，它是 Array 的一个实例，因此该方法可以自由使用其他数组方法，如 reduce()。你可能还记得，字符串、数字和布尔值都有内置的原始包装类型，用于像访问对象一样访问原始值。如果像本示例那样修改原始包装类型的原型，你实际上可以为这些原始值添加更多功能：\n\
