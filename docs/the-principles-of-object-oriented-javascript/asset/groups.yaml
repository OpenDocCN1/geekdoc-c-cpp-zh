    \n## 内置对象原型\n\n现在，你可能会想，原型是否也允许你修改 JavaScript 引擎中内置的标准对象。答案是肯定的。所有内置对象都有构造函数，因此它们也有你可以更改的原型。例如，为所有数组添加一个新方法只需修改\
