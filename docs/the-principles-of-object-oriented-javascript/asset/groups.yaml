    \n## 2\n\n## 函数\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_37_0.png)\n\n如第 1\
    \ 章所讨论的，函数实际上是 JavaScript 中的对象。函数的一个决定性特征——使它区别于任何其他对象——是存在一个名为 [[Call]] 的*内部属性*。内部属性不能通过代码访问，而是定义代码执行时的行为。ECMAScript\
