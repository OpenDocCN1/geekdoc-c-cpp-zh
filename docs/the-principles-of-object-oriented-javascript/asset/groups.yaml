  md: "\n## Summary\n\nIt helps to think of JavaScript objects as hash maps where\
    \ properties are just key/value pairs. You access object properties using either\
    \ dot notation or bracket notation with a string identifier. You can add a property\
    \ at any time by assigning a value to it, and you can remove a property at any\
    \ time with the delete operator. You can always check whether a property exists\
    \ by using the in operator on a property name and object. If the property in question\
    \ is an own property, you could also use hasOwnProperty(), which exists on every\
    \ object. All object properties are enumerable by default, which means that they\
    \ will appear in a for-in loop or be retrieved by Object.keys().\n\nThere are\
    \ two types of properties: data properties and accessor properties. Data properties\
    \ are placeholders for values, and you can read from and write to them. When a\
    \ data property holds a function value, the property is considered a method of\
    \ the object. Unlike data properties, accessor properties don’t store values on\
    \ their own; they use a combination of getters and setters to perform specific\
    \ actions. You can create both data properties and accessor properties directly\
    \ using object literal notation.\n\nAll properties have several associated attributes.\
    \ These attributes define how the properties work. Both data and accessor properties\
    \ have [[Enumerable]] and [[Configurable]] attributes. Data properties also have\
    \ [[Writable]] and [[Value]] attributes, while accessor properties have [[Get]]\
    \ and [[Set]] attributes. By default, [[Enumerable]] and [[Configurable]] are\
    \ set to true for all properties, and [[Writable]] is set to true for data properties.\
    \ You can change these attributes by using Object.defineProperty() or Object.defineProperties().\
    \ It’s also possible to retrieve these attributes by using Object.getOwnPropertyDescriptor().\n\
    \nWhen you want to lock down an object’s properties in some way, there are three\
    \ different ways to do so. If you use Object.preventExtensions(), objects will\
    \ no longer allow properties to be added. You could also create a sealed object\
    \ with the Object.seal() method, which makes that object non-extensible and makes\
    \ its properties nonconfigurable. The Object.freeze() method creates a frozen\
    \ object, which is a sealed object with nonwritable data properties. Be careful\
    \ with nonextensible objects, and always use strict mode so that attempts to access\
    \ the objects incorrectly will throw an error.\n\n## 4 CONSTRUCTORS AND PROTOTYPES\n\
    \nYou might be able to get pretty far in JavaScript without understanding constructors\
    \ and prototypes, but you won’t truly appreciate the language without a good grasp\
    \ of them. Because JavaScript lacks classes, it turns to constructors and prototypes\
    \ to bring a similar order to objects. But just because some of the patterns resemble\
    \ classes doesn’t mean they behave the same way. In this chapter, you’ll explore\
    \ constructors and prototypes in detail to see how JavaScript uses them to create\
    \ objects.\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_69_0.png)\n\nA constructor\
    \ is simply a function that is used with new to create an object. Up to this point,\
    \ you’ve seen several of the built-in JavaScript constructors, such as Object,\
    \ Array, and Function. The advantage of constructors is\n\nthat objects created\
    \ with the same constructor contain the same properties and methods. If you want\
    \ to create multiple similar objects, you can create your own constructors and\
    \ therefore your own reference types.\n\nBecause a constructor is just a function,\
    \ you define it in the same way. The only difference is that constructor names\
    \ should begin with a capital letter, to distinguish them from other functions.\
    \ For example, look at the following empty Person function:\n\n```\nfunction Person()\
    \ {\n // intentionally empty\n}\n```\n\nThis function is a constructor, but there\
    \ is absolutely no syntactic difference between this and any other function. The\
    \ clue that Person is a constructor is in the name—the first letter is capitalized.\n\
    \nAfter the constructor is defined, you can start creating instances, like the\
    \ following two Person objects:\n\n```\nvar person1 = new Person();\nvar person2\
    \ = new Person();\n```\n\nWhen you have no parameters to pass into your constructor,\
    \ you can even omit the parentheses:\n\n```\nvar person1 = new Person;\nvar person2\
    \ = new Person;\n```\n\nEven though the Person constructor doesn’t explicitly\
    \ return anything, both person1 and person2 are considered instances of the new\
    \ Person type. The new operator automatically creates an object of the given type\
    \ and returns it. That also means you can use the instanceof operator to deduce\
    \ an object’s type. The following code shows instanceof in action with the newly\
    \ created objects:\n\n```\nconsole.log(person1 instanceof Person); // true\nconsole.log(person2\
    \ instanceof Person); // true\n```\n\nBecause person1 and person2 were created\
    \ with the Person constructor, instanceof returns true when it checks whether\
    \ these objects are instances of the Person type.\n\nYou can also check the type\
    \ of an instance using the constructor property. Every object instance is automatically\
    \ created with a constructor property that contains a reference to the constructor\
    \ function that created it. For generic objects (those created via an object literal\
    \ or the Object constructor), constructor is set to Object; for objects created\
    \ with a custom\n\nconstructor, constructor points back to that constructor function\
    \ instead. For example, Person is the constructor property for person1 and person2:\n\
    \n```\nconsole.log(person1.constructor === Person);    // true\nconsole.log(person2.constructor\
    \ === Person);    // true\n```\n\nThe console.log function outputs true in both\
    \ cases, because both objects were created with the Person constructor.\n\nEven\
    \ though this relationship exists between an instance and its constructor, you\
    \ are still advised to use instanceof to check the type of an instance. This is\
    \ because the constructor property can be overwritten and therefore may not be\
    \ completely accurate.\n\nOf course, an empty constructor function isn't very\
    \ useful. The whole point of a constructor is to make it easy to create more objects\
    \ with the same properties and methods. To do that, simply add any properties\
    \ you want to this inside of the constructor, as in the following example:\n\n\
    ```\nfunction Person(name) {\n    this.name = name;\n    this.sayName = function()\
    \ {\n        console.log(this.name);\n    };\n}\n```\n\nThis version of the Person\
    \ constructor accepts a single named parameter, name, and assigns it to the name\
    \ property of the this object ①. The constructor also adds a sayName() method\
    \ to the object ②. The this object is automatically created by new when you call\
    \ the constructor, and it is an instance of the constructor's type. (In this case,\
    \ this is an instance of Person.) There's no need to return a value from the function\
    \ because the new operator produces the return value.\n\nNow you can use the Person\
    \ constructor to create objects with an initialized name property:\n\n```\nvar\
    \ person1 = new Person(\"Nicholas\");\nvar person2 = new Person(\"Greg\");\n\n\
    console.log(person1.name);          // \"Nicholas\"\nconsole.log(person2.name);\
    \          // \"Greg\"\n\nperson1.sayName();                  // outputs \"Nicholas\"\
    \nperson2.sayName();                  // outputs \"Greg\"\n```\n\nEach object\
    \ has its own name property, so sayName() should return different values depending\
    \ on the object on which you use it.\n\nNOTE You can also explicitly call return\
    \ inside of a constructor. If the returned value is an object, it will be returned\
    \ instead of the newly created object instance. If the returned value is a primitive,\
    \ the newly created object is used and the returned value is ignored.\n\nConstructors\
    \ allow you to initialize an instance of a type in a consistent way, performing\
    \ all of the property setup that is necessary before the object can be used. For\
    \ example, you could also use Object.defineProperty() inside of a constructor\
    \ to help initialize the instance:\n\n```\nfunction Person(name) {\n\n    Object.defineProperty(this,\
    \ \"name\", {\n        get: function() {\n            return name;\n        },\n\
    \        set: function(newName) {\n            name = newName;\n        },\n \
    \       enumerable: true,\n        configurable: true\n    });\n\n    this.sayName\
    \ = function() {\n        console.log(this.name);\n    };\n}\n```\n\nIn this version\
    \ of the Person constructor, the name property is an accessor property that uses\
    \ the name parameter for storing the actual name. This is possible because named\
    \ parameters act like local variables. Make sure to always call constructors with\
    \ new; otherwise, you risk changing the global object instead of the newly created\
    \ object. Consider what happens in the following code:\n\n```\nvar person1 = Person(\"\
    Nicholas\");        // note: missing \"new\"\n\nconsole.log(person1 instanceof\
    \ Person);    // false\nconsole.log(typeof person1);                // \"undefined\"\
    \nconsole.log(name);                          // \"Nicholas\"\n```\n\nWhen Person\
    \ is called as a function without new, the value of this inside of the constructor\
    \ is equal to the global this object. The variable person1 doesn’t contain a value\
    \ because the Person constructor relies on new to supply a return value. Without\
    \ new, Person is just a function without a return statement. The assignment to\
    \ this.name actually creates a global\n"
  mdcn: "\n## 摘要\n\n将 JavaScript 对象视为哈希映射会很有帮助，其中属性只是键/值对。你可以使用点表示法或带字符串标识符的方括号表示法来访问对象属性。你可以随时通过给属性赋值来添加属性，也可以随时使用\
    \ delete 运算符删除属性。你始终可以使用 in 运算符，在属性名和对象上检查某个属性是否存在。如果该属性是自有属性，你还可以使用每个对象上都存在的\
    \ hasOwnProperty() 方法。默认情况下，所有对象属性都是可枚举的，这意味着它们会出现在 for-in 循环中，或者可以通过 Object.keys()\
    \ 获取。\n\n属性有两种类型：数据属性和访问器属性。数据属性是值的占位符，你可以对它们进行读取和写入。当数据属性保存了一个函数值时，该属性被视为对象的方法。与数据属性不同，访问器属性本身不存储值；它们结合\
    \ getter 和 setter 来执行特定操作。你可以直接使用对象字面量表示法来创建数据属性和访问器属性。\n\n所有属性都有多个相关联的特性。这些特性定义了属性如何工作。数据属性和访问器属性都有\
    \ [[Enumerable]] 和 [[Configurable]] 特性。数据属性还有 [[Writable]] 和 [[Value]] 特性，而访问器属性则有\
    \ [[Get]] 和 [[Set]] 特性。默认情况下，所有属性的 [[Enumerable]] 和 [[Configurable]] 都设置为 true，数据属性的\
    \ [[Writable]] 也设置为 true。你可以使用 Object.defineProperty() 或 Object.defineProperties()\
    \ 来更改这些特性。也可以使用 Object.getOwnPropertyDescriptor() 来检索这些特性。\n\n当你希望以某种方式锁定对象的属性时，有三种不同的方法可以做到。如果你使用\
    \ Object.preventExtensions()，对象将不再允许添加属性。你也可以使用 Object.seal() 方法创建一个密封对象，这会使该对象不可扩展，并使其属性不可配置。Object.freeze()\
    \ 方法创建一个冻结对象，这是一个密封对象，且其数据属性不可写。要小心不可扩展对象，并且始终使用严格模式，以便错误地访问对象时会抛出错误。\n\n## 4\
    \ 构造函数和原型\n\n即使不理解构造函数和原型，你也可能在使用 JavaScript 时走得相当远，但如果没有很好地掌握它们，你就不会真正欣赏这门语言。由于\
    \ JavaScript 缺乏类，它借助构造函数和原型为对象带来类似的秩序。但仅仅因为某些模式类似类，并不意味着它们的行为方式相同。在本章中，你将详细探索构造函数和原型，了解\
    \ JavaScript 如何使用它们来创建对象。\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_69_0.png)\n\
    \n构造函数只是一个与 new 一起使用来创建对象的函数。到目前为止，你已经见过几个内置的 JavaScript 构造函数，例如 Object、Array\
    \ 和 Function。构造函数的好处是，使用同一个构造函数创建的对象包含相同的属性和方法。如果你想创建多个相似的对象，你可以创建自己的构造函数，从而创建自己的引用类型。\n\
    \n因为构造函数只是一个函数，所以你可以用相同的方式定义它。唯一的区别是构造函数名应以大写字母开头，以便与其他函数区分。例如，看下面的空 Person 函数：\n\
    \n```\nfunction Person() {\n // intentionally empty\n}\n```\n\n这个函数是一个构造函数，但它与任何其他函数之间绝对没有语法差异。表明\
    \ Person 是构造函数的线索在于名称——第一个字母大写。\n\n定义构造函数后，你就可以开始创建实例，比如下面两个 Person 对象：\n\n```\n\
    var person1 = new Person();\nvar person2 = new Person();\n```\n\n当没有参数需要传给构造函数时，你甚至可以省略括号：\n\
    \n```\nvar person1 = new Person;\nvar person2 = new Person;\n```\n\n即使 Person\
    \ 构造函数没有显式返回任何内容，person1 和 person2 仍被视为新的 Person 类型的实例。new 运算符会自动创建给定类型的对象并返回它。这也意味着你可以使用\
    \ instanceof 运算符来推断对象的类型。下面的代码演示了 instanceof 与新建对象一起使用的效果：\n\n```\nconsole.log(person1\
    \ instanceof Person); // true\nconsole.log(person2 instanceof Person); // true\n\
    ```\n\n因为 person1 和 person2 是使用 Person 构造函数创建的，所以当 instanceof 检查这些对象是否为 Person\
    \ 类型的实例时，会返回 true。\n\n你还可以使用 constructor 属性来检查实例的类型。每个对象实例都会自动创建一个 constructor\
    \ 属性，其中包含对创建它的构造函数函数的引用。对于泛型对象（通过对象字面量或 Object 构造函数创建的对象），constructor 被设置为 Object；对于使用自定义构造函数创建的对象，constructor\
    \ 会指向那个构造函数函数。例如，Person 就是 person1 和 person2 的 constructor 属性：\n\n```\nconsole.log(person1.constructor\
    \ === Person);    // true\nconsole.log(person2.constructor === Person);    //\
    \ true\n```\n\n在这两种情况下，console.log 函数都会输出 true，因为这两个对象都是使用 Person 构造函数创建的。\n\n\
    即使实例与其构造函数之间存在这种关系，仍建议你使用 instanceof 来检查实例的类型。这是因为 constructor 属性可以被覆盖，因此可能不完全准确。\n\
    \n当然，空的构造函数函数不是很有用。构造函数的全部意义在于轻松创建更多具有相同属性和方法的对象。要做到这一点，只需在构造函数内部把你想添加的任何属性添加到\
    \ this 上，如下例所示：\n\n```\nfunction Person(name) {\n    this.name = name;\n    this.sayName\
    \ = function() {\n        console.log(this.name);\n    };\n}\n```\n\n这个版本的 Person\
    \ 构造函数接受一个名为 name 的单一命名参数，并将其赋值给 this 对象的 name 属性①。构造函数还向对象添加了一个 sayName() 方法②。this\
    \ 对象是在你调用构造函数时由 new 自动创建的，它是构造函数类型的实例。（在这种情况下，this 是 Person 的一个实例。）不需要从函数中返回值，因为\
    \ new 运算符会产生返回值。\n\n现在你可以使用 Person 构造函数创建具有已初始化 name 属性的对象：\n\n```\nvar person1\
    \ = new Person(\"Nicholas\");\nvar person2 = new Person(\"Greg\");\n\nconsole.log(person1.name);\
    \          // \"Nicholas\"\nconsole.log(person2.name);          // \"Greg\"\n\n\
    person1.sayName();                  // outputs \"Nicholas\"\nperson2.sayName();\
    \                  // outputs \"Greg\"\n```\n\n每个对象都有自己的 name 属性，所以 sayName()\
    \ 应该根据你使用它的对象返回不同的值。\n\n注意：你也可以在构造函数内部显式地调用 return。如果返回的值是一个对象，则会返回该对象而不是新创建的对象实例。如果返回的值是一个原始值，则会使用新创建的对象，而返回的值被忽略。\n\
    \n构造函数允许你以一致的方式初始化一个类型的实例，在执行完对象使用前所有必要的属性设置后，对象才能被使用。例如，你也可以在构造函数中使用 Object.defineProperty()\
    \ 来帮助初始化实例：\n\n```\nfunction Person(name) {\n\n    Object.defineProperty(this,\
    \ \"name\", {\n        get: function() {\n            return name;\n        },\n\
    \        set: function(newName) {\n            name = newName;\n        },\n \
    \       enumerable: true,\n        configurable: true\n    });\n\n    this.sayName\
    \ = function() {\n        console.log(this.name);\n    };\n}\n```\n\n在这个版本的 Person\
    \ 构造函数中，name 属性是一个访问器属性，它使用 name 参数来存储实际的名称。这是可能的，因为命名参数的行为类似于局部变量。请务必始终使用 new\
    \ 来调用构造函数；否则，你可能会修改全局对象而不是新创建的对象。考虑下面的代码会发生什么：\n\n```\nvar person1 = Person(\"\
    Nicholas\");        // note: missing \"new\"\n\nconsole.log(person1 instanceof\
    \ Person);    // false\nconsole.log(typeof person1);                // \"undefined\"\
    \nconsole.log(name);                          // \"Nicholas\"\n```\n\n当 Person\
    \ 在没有 new 的情况下作为函数调用时，构造函数内部的 this 值等于全局 this 对象。变量 person1 不包含值，因为 Person 构造函数依赖\
    \ new 来提供返回值。没有 new，Person 只是一个没有 return 语句的函数。对 this.name 的赋值实际上创建了一个全局变量。\n\n"
