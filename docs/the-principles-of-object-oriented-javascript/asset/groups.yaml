  mdcn: "\n\n这个示例与前一个示例在语法上的差异之外是等价的。两者在逻辑上也等价于以下示例：\n\n```\nvar book = new Object();\n\
    book.name = \"The Principles of Object-Oriented JavaScript\";\nbook.year = 2014;\n\
    ```\n\n前面三个示例的结果都相同：一个具有两个属性的对象。模式的选择由你决定，因为功能最终是相同的。\n\n> 注意 使用对象字面量实际上并不会调用\
    \ new Object()。相反，JavaScript 引擎会遵循使用 new Object() 时相同的步骤，只是实际上并未调用构造函数。这对所有引用字面量都成立。\n\
    \n你可以通过在方括号内包含任意数量的逗号分隔值，以类似的方式定义数组字面量。例如：\n\n```\nvar colors = [ \"red\", \"\
    blue\", \"green\" ];\nconsole.log(colors[0]);      // \"red\"\n```\n\n这段代码等价于以下代码：\n\
    \n```\nvar colors = new Array(\"red\", \"blue\", \"green\");\nconsole.log(colors[0]);\
    \      // \"red\"\n```\n\n## 函数字面量\n\n你几乎总是使用字面量形式来定义函数。事实上，由于维护、阅读和调试一段代码字符串而不是实际代码的困难，使用\
    \ Function 构造函数通常是不被推荐的，因此你在代码中很少会看到它。\n\n使用字面量形式创建函数要容易得多，也更不容易出错。例如：\n\n```\n\
    function reflect(value) {\n    return value;\n}\n\n// is the same as\n\nvar reflect\
    \ = new Function(\"value\", \"return value;\");\n```\n\n这段代码定义了 reflect() 函数，它返回传递给它的任何值。即使对于这个简单的函数，字面量形式也比构造函数形式更容易编写和理解。此外，用构造函数形式创建的函数没有好的调试方法：这些函数不被\
    \ JavaScript 调试器识别，因此在你的应用程序中充当黑盒。\n\n## 正则表达式字面量\n\nJavaScript 还具有正则表达式字面量，允许你在不使用\
    \ RegExp 构造器的情况下定义正则表达式。正则表达式字面量看起来与 Perl 中的正则表达式非常相似：模式包含在两个斜杠之间，任何附加选项都是第二个斜杠后的单个字符。例如：\n\
    \n```\nvar numbers = /\\d+/g;\n\n// is the same as\n\nvar numbers = new RegExp(\"\
    \\\\d+\", \"g\");\n```\n\nJavaScript 中正则表达式的字面量形式比构造函数形式更容易处理，因为你不必担心在字符串中转义字符。当使用\
    \ RegExp 构造函数时，你将模式作为字符串传递，因此必须转义任何反斜杠。 （这就是为什么在字面量中使用 \\d 而在构造函数中使用 \\\\d。）除非正则表达式是从一个或多个字符串动态构造的，否则在\
    \ JavaScript 中更喜欢字面量形式而不是构造函数形式。\n\n话虽如此，除了 Function 之外，实例化内置类型其实并没有什么对错之分。许多开发者更喜欢字面量，而有些则更喜欢构造函数。选择你觉得更舒适使用的方法。\n\
    \n## 属性访问\n\n属性是存储在对象上的名称/值对。点表示法是访问 JavaScript 中属性最常见的方式（就像许多面向对象的语言一样），但你也可以使用带字符串的方括号表示法来访问\
    \ JavaScript 对象上的属性。\n\n例如，你可以编写使用点表示法的这段代码：\n\n```\nvar array = [];\narray.push(12345);\n\
    ```\n\n使用方括号表示法，方法名现在包含在方括号内的字符串中，如此示例所示：\n\n```\nvar array = [];\narray[\"push\"\
    ](12345);\n```\n\n这种语法在你想要动态决定访问哪个属性时非常有用。例如，这里方括号表示法允许你使用变量而不是字符串字面量来指定要访问的属性。\n\
    \n```\nvar array = [];\nvar method = \"push\";\narray[method](12345);\n```\n\n\
    在此列表中，变量 method 的值为 \"push\"，因此在数组上调用了 push()。这种能力非常有用，正如你在本书中会看到的那样。需要记住的是，除了语法之外，点表示法和方括号表示法之间在性能或其他方面唯一的差别是，方括号表示法允许你在属性名中使用特殊字符。开发者倾向于认为点表示法更易读，因此你会看到它比方括号表示法使用得更频繁。\n\
    \n## 识别引用类型\n\n函数是最容易识别的引用类型，因为当你对函数使用 typeof 运算符时，运算符应返回 \"function\"：\n\n```\n\
    function reflect(value) {\n    return value;\n}\n\nconsole.log(typeof reflect);\
    \    // \"function\"\n```\n\n其他引用类型更难识别，因为对于函数之外的所有引用类型，typeof 返回 \"object\"。当你处理大量不同类型时，这不是很有帮助。为了更轻松地识别引用类型，你可以使用\
    \ JavaScript 的 instanceof 运算符。\n\ninstanceof 运算符接受一个对象和一个构造函数作为参数。当该值是构造函数指定的类型的实例时，instanceof\
    \ 返回 true；否则返回 false，如下所示：\n\n```\nvar items = [];\nvar object = {};\n\nfunction\
    \ reflect(value) {\n    return value;\n}\n\nconsole.log(items instanceof Array);\
    \      // true\nconsole.log(object instanceof Object);     // true\nconsole.log(reflect\
    \ instanceof Function);  // true\n```\n\n在此示例中，使用 instanceof 和构造函数测试了几个值。通过使用\
    \ instanceof 和代表其真实类型的构造函数，每个引用类型都被正确识别（即使在创建变量时并未使用该构造函数）。\n\ninstanceof 运算符可以识别继承的类型。这意味着每个对象实际上都是\
    \ Object 的实例，因为所有引用类型都继承自 Object。\n\n为了演示，以下列表使用 instanceof 检查了之前创建的三个引用：\n\n\
    ```\nvar items = [];\nvar object = {};\n\nfunction reflect(value) {\n    return\
    \ value;\n}\n\nconsole.log(items instanceof Array);     // true\nconsole.log(items\
    \ instanceof Object);    // true\nconsole.log(object instanceof Object);   //\
    \ true\nconsole.log(object instanceof Array);    // false\nconsole.log(reflect\
    \ instanceof Function); // true\nconsole.log(reflect instanceof Object);   //\
    \ true\n```\n\n每个引用类型都被正确识别为 Object 的实例，所有引用类型都继承自 Object。\n\n## 识别数组\n\n尽管 instanceof\
    \ 可以识别数组，但有一个例外会影响 Web 开发者：JavaScript 值可以在同一网页的不同框架之间传递。这只有在你尝试识别引用值的类型时才会成为问题，因为每个网页都有自己的全局上下文——它自己的\
    \ Object、Array 和所有其他内置类型的版本。因此，当你将数组从一个框架传递到另一个框架时，instanceof 不起作用，因为该数组实际上是来自不同框架的\
    \ Array 的实例。\n\n为了解决这个问题，ECMAScript 5 引入了 Array.isArray()，它可以明确地识别该值无论其来源如何都是\
