    # 5


    # INHERITANCE


    ![](img/dcf53336af93733d4dab8829d31ceb8e_85_0.png)


    Learning how to create objects is the first step to understanding object-oriented
    programming. The second step is to understand inheritance. In traditional object-oriented
    languages, classes inherit properties from other classes. In JavaScript, however,
    inheritance can occur between objects with no classlike structure defining the
    relationship. The mechanism for this inheritance is one with which you are already
    familiar: prototypes.


    # Prototype Chaining and Object.prototype


    JavaScript''s built-in approach for inheritance is called prototype chaining,
    or prototypal inheritance. As you learned in Chapter 4, prototype properties are
    automatically available on object instances, which is a form of inheritance. The
    object instances inherit properties from the prototype. Because'
