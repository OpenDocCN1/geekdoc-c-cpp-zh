    \ to make sense.\n\nFor instance, you can pass a function into another function\
    \ as an argument. The sort() method on JavaScript arrays accepts a comparison\
    \ function as an optional parameter. The comparison function is called whenever\
    \ two values in the array must be compared. The first value is smaller than the\
    \ second, the comparison function must return a negative number. If the first\
    \ value is larger than the second, the function must return a positive number.\
    \ If the two values are equal, the function should return zero.\n\n```\nvar numbers\
    \ = [ 1, 5, 8, 4, 7, 10, 2, 6 ];\n\nnumbers.sort(function(first, second) {\n \
    \ return first - second;\n});\n\nconsole.log(numbers);  // \"[1, 2, 4, 5, 6, 7,\
    \ 8, 10]\"\n```\n\n```\nnumbers.sort();\n\nconsole.log(numbers);  // \"[1, 10,\
    \ 2, 4, 5, 6, 7, 8]\"\n```\n\nIn this example, the comparison function ① that\
    \ is passed into sort() is actually a function expression. Note that there is\
    \ no name for the function; it exists only as a reference that is passed into\
    \ another function (making it an anonymous function). Subtracting the two values\
    \ returns the correct result from the comparison function."
  - "[PAGE 41]\n\nCompare that to the second call to sort() 2, which does not use\
    \ a comparison function. The order of the array is different than expected, as\
    \ 1 is followed by 10. This is because the default comparison converts all values\
    \ to strings before comparing them.\n\n# Parameters\n\nAnother unique aspect of\
    \ JavaScript functions is that you can pass any number of parameters to any function\
    \ without causing an error. That's because function parameters are actually stored\
    \ as an array-like structure called arguments. Just like a regular JavaScript\
    \ array, arguments can grow to contain any number of values. The values are referenced\
    \ via numeric indices, and there is a length property to determine how many values\
    \ are present.\n\nThe arguments object is automatically available inside any function.\
    \ This means named parameters in a function exist mostly for convenience and don't\
    \ actually limit the number of arguments that a function can accept.\n\n> NOTE\
    \ The arguments object is not an instance of Array and therefore doesn't have\
    \ the same methods as an array; Array.isArray(arguments) always returns false.\n\
    \nOn the other hand, JavaScript doesn't ignore the named parameters of a function\
    \ either. The number of arguments a function expects is stored on the function's\
    \ length property. Remember, a function is actually just an object, so it can\
    \ have properties. The length property indicates the function's arity, or the\
    \ number of parameters it expects. Knowing the function's arity is important in\
    \ JavaScript because functions won't throw an error if you pass in too many or\
    \ too few parameters.\n\nHere's a simple example using arguments and function\
    \ arity; note that the number of arguments passed to the function has no effect\
    \ on the reported arity:\n\n```\nfunction reflect(value) {\n  return value;\n\
    }\n\nconsole.log(reflect(\"Hi!\"));      // \"Hi!\"\nconsole.log(reflect(\"Hi!\"\
    , 25));  // \"Hi!\"\nconsole.log(reflect.length);       // 1\n\nreflect = function()\
    \ {\n  return arguments[0];\n};\n\nconsole.log(reflect(\"Hi!\"));      // \"Hi!\"\
    \nconsole.log(reflect(\"Hi!\", 25));  // \"Hi!\"\nconsole.log(reflect.length);\
    \       // 0\n```"
