    ```\nvar person1 = {\n    name: \"Nicholas\"\n};\n```\n\n你在本章中一直看到这段代码片段；它向 person1\
    \ 添加 name 属性并设置其值。你可以使用以下（更冗长）代码实现相同的结果：\n\n```\nvar person1 = {};\n\nObject.defineProperty(person1,\
    \ \"name\", {\n    value: \"Nicholas\",\n    enumerable: true,\n    configurable:\
    \ true,\n    writable: true\n});\n```\n\n当调用 Object.defineProperty() 时，它首先检查属性是否存在。如果属性不存在，则会使用描述符中指定的属性添加一个新属性。在这种情况下，name\
    \ 还不是 person1 的属性，因此它被创建。\n\n当你使用 Object.defineProperty() 定义新属性时，重要的是要指定所有属性，因为布尔属性否则会自动默认为\
    \ false。例如，以下代码创建了一个不可枚举、不可配置且不可写的 name 属性，因为它在调用 Object.defineProperty() 时没有明确使这些属性中的任何一个为\
