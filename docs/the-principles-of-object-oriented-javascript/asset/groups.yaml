  - "[PAGE 73]\n\nvariable called name, which is where the name passed to Person is\
    \ stored. Chapter 6 describes a solution to both this problem and more complex\
    \ object composition patterns.\n\n> An error occurs if you call the Person constructor\
    \ in strict mode without using new. This is because strict mode doesn't assign\
    \ this to the global object. Instead, this remains undefined, and an error occurs\
    \ whenever you attempt to create a property on undefined.\n\nConstructors allow\
    \ you to configure object instances with the same properties, but constructors\
    \ alone don't eliminate code redundancy. In the example code thus far, each instance\
    \ has had its own sayName() method even though sayName() doesn't change. That\
    \ means if you have 100 instances of an object, then there are 100 copies of a\
    \ function that do the exact same thing, just with different data.\n\nIt would\
    \ be much more efficient if all of the instances shared one method, and then that\
    \ method could use this.name to retrieve the appropriate data. This is where prototypes\
    \ come in.\n\n# Prototypes\n\nYou can think of a prototype as a recipe for an\
    \ object. Almost every function (with the exception of some built-in functions)\
    \ has a prototype property that is used during the creation of new instances.\
    \ That prototype is shared among all of the object instances, and those instances\
    \ can access properties of the prototype. For example, the hasOwnProperty() method\
    \ is defined on the generic Object prototype, but it can be accessed on any object\
    \ as if it were an own property, as shown in this example:\n\n```\nvar book =\
    \ {\n  title: \"The Principles of Object-Oriented JavaScript\"\n};\n\nconsole.log(\"\
    title\" in book); // true\nconsole.log(book.hasOwnProperty(\"title\")); // true\n\
    console.log(\"hasOwnProperty\" in book); // true\nconsole.log(book.hasOwnProperty(\"\
    hasOwnProperty\")); // false\nconsole.log(Object.prototype.hasOwnProperty(\"hasOwnProperty\"\
    )); // true\n```\n\nEven though there is no definition for hasOwnProperty() on\
    \ book, that method can be accessed as book.hasOwnProperty() because the definition\
    \ does exist on Object.prototype. Remember that the in operator returns true for\
    \ both prototype properties and own properties."
  - "[PAGE 74]\n\n# IDENTIFYING A PROTOTYPE PROPERTY\n\nYou can determine whether\
    \ a property is on the prototype by using a function such as:\n\n```\nfunction\
    \ hasPrototypeProperty(object, name) {\n  return name in object && !object.hasOwnProperty(name);\n\
    }\n```\n\n```\nconsole.log(hasPrototypeProperty(book, \"title\")); // false\n\
    console.log(hasPrototypeProperty(book, \"hasOwnProperty\")); // true\n```\n\n\
    If the property is in an object but hasOwnProperty() returns false, then the property\
    \ is on the prototype.\n\n# The [[Prototype]] Property\n\nAn instance keeps track\
    \ of its prototype through an internal property called [[Prototype]]. This property\
    \ is a pointer back to the prototype object that the instance is using. When you\
    \ create a new object using new, the constructor's prototype property is assigned\
