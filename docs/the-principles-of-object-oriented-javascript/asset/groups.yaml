  md: "\n## 5\n\n## INHERITANCE\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_85_0.png)\n\
    \nLearning how to create objects is the first step to understanding object-oriented\
    \ programming. The second step is to understand inheritance. In traditional object-oriented\
    \ languages, classes inherit properties from other classes. In JavaScript, however,\
    \ inheritance can occur between objects with no classlike structure defining the\
    \ relationship. The mechanism for this inheritance is one with which you are already\
    \ familiar: prototypes.\n\n### Prototype Chaining and Object.prototype\n\nJavaScript's\
    \ built-in approach for inheritance is called prototype chaining, or prototypal\
    \ inheritance. As you learned in Chapter 4, prototype properties are automatically\
    \ available on object instances, which is a form of inheritance. The object instances\
    \ inherit properties from the prototype. Because\n\nthe prototype is also an object,\
    \ it has its own prototype and inherits properties from that. This is the prototype\
    \ chain: An object inherits from its prototype, while that prototype in turn inherits\
    \ from its prototype, and so on.\n\nAll objects, including those you define yourself,\
    \ automatically inherit from Object.prototype unless you specify otherwise (discussed\
    \ later in this chapter). More specifically, all objects inherit from Object.prototype.\
    \ Any object defined via an object literal has its [[Prototype]] set to Object.prototype,\
    \ meaning that it inherits properties from Object.prototype, just like book in\
    \ this example:\n\n```\nvar book = {\n\ttitle: \"The Principles of Object-Oriented\
    \ JavaScript\"\n};\n\nvar prototype = Object.getPrototypeOf(book);\n\nconsole.log(prototype\
    \ === Object.prototype); // true\n```\n\nHere, book has a prototype equal to Object.prototype.\
    \ No additional code was necessary to make this happen, as this is the default\
    \ behavior when new objects are created. This relationship means that book automatically\
    \ receives methods from Object.prototype.\n\n### Methods Inherited from Object.prototype\n\
    \n- hasOwnProperty() Determines whether an own property with the given name exists\n\
    - propertyIsEnumerable() Determines whether an own property is enumerable\n- isPrototypeOf()\
    \ Determines whether the object is the prototype of another\n- valueOf() Returns\
    \ the value representation of the object\n- toString() Returns a string representation\
    \ of the object\n\nThese five methods appear on all objects through inheritance.\
    \ The last two are important when you need to make objects work consistently in\
    \ JavaScript, and sometimes you might want to define them yourself.\n\n### valueOf()\n\
    \nThe valueOf() method gets called whenever an operator is used on an object.\
    \ By default, valueOf() simply returns the object instance. The primitive wrapper\
    \ types override valueOf() so that it returns a string for String, a Boolean for\
    \ Boolean, and a number for Number. Likewise, the Date object’s valueOf() method\
    \ returns the epoch time in milliseconds (just as Date.prototype.getTime() does).\
    \ This is what allows you to write code that compares dates such as:\n\n```\n\
    var now = new Date();\nvar earlier = new Date(2010, 1, 1);\n\nconsole.log(now\
    \ > earlier);      // true\n```\n\nIn this example, now is a Date representing\
    \ the current time, and earlier is a fixed date in the past. When the greater-than\
    \ operator (>) is used, the valueOf() method is called on both objects before\
    \ the comparison is performed. You can even subtract one date from another and\
    \ get the difference in epoch time because of valueOf().\n\nYou can always define\
    \ your own valueOf() method if your objects are intended to be used with operators.\
    \ If you do define a valueOf() method, keep in mind that you’re not changing how\
    \ the operator works, only what value is used with the operator’s default behavior.\n\
    \n### toString()\n\nThe toString() method is called as a fallback whenever valueOf()\
    \ returns a reference value instead of a primitive value. It is also implicitly\
    \ called on primitive values whenever JavaScript is expecting a string. For example,\
    \ when a string is used as one operand for the plus operator, the other operand\
    \ is automatically converted to a string. If the other operand is a primitive\
    \ value, it is converted into a string representation (for example, true becomes\
    \ \"true\"), but if it is a reference value, then valueOf() is called. If valueOf()\
    \ returns a reference value, toString() is called and the returned value is used.\
    \ For example:\n\n```\nvar book = {\n  title: \"The Principles of Object-Oriented\
    \ JavaScript\"\n};\n\nvar message = \"Book = \" + book;\nconsole.log(message);\
    \      // \"Book = [object Object]\"\n```\n\nThis code constructs the string by\
    \ combining \"Book = \" with book. Since book is an object, its toString() method\
    \ is called. That method is inherited from Object.prototype and returns the default\
    \ value of \"[object Object]\" in most JavaScript engines. If you are happy with\
    \ that value, there's no need to change your object's toString() method. Sometimes,\
    \ however, it's useful to define your own toString() method so that string conversions\
    \ return a value that gives more information. Suppose, for example, that you want\
    \ the previous script to log the book's title:\n\n```\nvar book = {\n    title:\
    \ \"The Principles of Object-Oriented JavaScript\",\n    toString: function()\
    \ {\n        return \"[Book \" + this.title + \"]\"\n    }\n};\n\nvar message\
    \ = \"Book = \" + book;\n\n// \"Book = [Book The Principles of Object-Oriented\
    \ JavaScript]\"\nconsole.log(message);\n```\n\nThis code defines a custom toString()\
    \ method for book that returns a more useful value than the inherited version.\
    \ You don't usually need to worry about defining a custom toString() method, but\
    \ it's good to know that it's possible to do so if necessary.\n\n### Modifying\
    \ Object.prototype\n\nAll objects inherit from Object.prototype by default, so\
    \ changes to Object.prototype affect all objects. That's a very dangerous situation.\
    \ You were advised in Chapter 4 not to modify built-in object prototypes, and\
    \ that advice goes double for Object.prototype. Take a look at what can happen:\n\
    \n```\nObject.prototype.add = function(value) {\n    return this + value;\n};\n\
    \nvar book = {\n    title: \"The Principles of Object-Oriented JavaScript\"\n\
    };\n\nconsole.log(book.add(5));        // \"[object Object]5\"\nconsole.log(\"\
    title\".add(\"end\"));  // \"titleend\"\n\n// in a web browser\nconsole.log(document.add(true));\
    \  // \"[object HTMLDocument]true\"\nconsole.log(window.add(5));       // \"[object\
    \ Window]true\"\n```\n\nThe Object.create() method accepts two arguments. The\
    \ first argument is the object to use for [[Prototype]] in the new object. The\
    \ optional second argument is an object of property descriptors in the same format\
    \ used by Object.defineProperties() (see Chapter 3). Consider the following:\n\
    \n```\nvar book = {\n  title: \"The Principles of Object-Oriented JavaScript\"\
    \n};\n\n// is the same as\n\nvar book = Object.create(Object.prototype, {\n  title:\
    \ {\n    configurable: true,\n    enumerable: true,\n    value: \"The Principles\
    \ of Object-Oriented JavaScript\",\n    writable: true\n  }\n});\n```\n\nThe two\
    \ declarations in this code are effectively the same. The first declaration uses\
    \ an object literal to define an object with a single property called title. That\
    \ object automatically inherits from Object.prototype, and the property is set\
    \ to be configurable, enumerable, and writable by default. The second declaration\
    \ takes the same steps but does so explicitly using Object.create(). The resulting\
    \ book object from each declaration behaves the exact same way. But you'll probably\
    \ never write code that inherits from Object.prototype directly, because you get\
    \ that by default. Inheriting from other objects is much more interesting:\n\n\
    ```\nvar person1 = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \  }\n};\n\nvar person2 = Object.create(person1, {\n  name: {\n    configurable:\
    \ true,\n    enumerable: true,\n    value: \"Greg\",\n    writable: true\n  }\n\
    });\n\nperson1.sayName(); // outputs \"Nicholas\"\nperson2.sayName(); // outputs\
    \ \"Greg\"\n```\n"
  mdcn: "\n\n## 5\n\n## 继承\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_85_0.png)\n\
    \n学习如何创建对象是理解面向对象编程的第一步。第二步是理解继承。在传统的面向对象语言中，类从其他类继承属性。然而在 JavaScript 中，继承可以在没有类式结构定义关系的对象之间发生。这种继承的机制是你已经熟悉的：原型。\n\
    \n### 原型链和 Object.prototype\n\nJavaScript 的内置继承方法称为原型链，或原型继承。正如你在第 4 章中学到的，原型属性会自动在对象实例上可用，这是一种继承形式。对象实例从原型继承属性。因为\n\
    \n原型本身也是一个对象，它有自己的原型并从中继承属性。这就是原型链：一个对象从其原型继承，而该原型又从其原型继承，以此类推。\n\n所有对象，包括你自己定义的，除非另有说明，否则都会自动从\
    \ Object.prototype 继承（本章后面会讨论）。更具体地说，所有对象都从 Object.prototype 继承。任何通过对象字面量定义的对象，其\
    \ [[Prototype]] 都被设置为 Object.prototype，这意味着它从 Object.prototype 继承属性，就像本例中的 book\
    \ 一样：\n\n```\nvar book = {\n\ttitle: \"The Principles of Object-Oriented JavaScript\"\
    \n};\n\nvar prototype = Object.getPrototypeOf(book);\n\nconsole.log(prototype\
    \ === Object.prototype); // true\n```\n\n这里，book 的原型等于 Object.prototype。无需额外代码即可实现，因为这是创建新对象的默认行为。这种关系意味着\
    \ book 自动获得来自 Object.prototype 的方法。\n\n### 从 Object.prototype 继承的方法\n\n- hasOwnProperty()\
    \ 判断是否存在具有给定名称的自身属性\n- propertyIsEnumerable() 判断自身属性是否可枚举\n- isPrototypeOf() 判断该对象是否为另一个对象的原型\n\
    - valueOf() 返回对象的数值表示\n- toString() 返回对象的字符串表示\n\n这五种方法通过继承出现在所有对象上。后两种在你需要让对象在\
    \ JavaScript 中一致工作时很重要，有时你可能想自己定义它们。\n\n### valueOf()\n\n每当运算符作用于对象时，就会调用 valueOf()\
    \ 方法。默认情况下，valueOf() 只是返回对象实例。原始包装类型重写了 valueOf()，使其对 String 返回字符串，对 Boolean 返回布尔值，对\
    \ Number 返回数字。同样，Date 对象的 valueOf() 方法返回以毫秒为单位的纪元时间（就像 Date.prototype.getTime()\
    \ 一样）。这就是允许你编写比较日期的代码的原因，例如：\n\n```\nvar now = new Date();\nvar earlier = new\
    \ Date(2010, 1, 1);\n\nconsole.log(now > earlier);      // true\n```\n\n在这个例子中，now\
    \ 是一个代表当前时间的 Date，而 earlier 是一个过去的固定日期。当使用大于运算符 (>) 时，在比较执行之前会先在两个对象上调用 valueOf()\
    \ 方法。你甚至可以从一个日期中减去另一个日期并得到纪元时间差，这也是因为 valueOf()。\n\n如果你希望对象与运算符一起使用，你可以随时定义自己的\
    \ valueOf() 方法。如果你确实定义了 valueOf() 方法，请记住，你并没有改变运算符的工作方式，只是改变了与运算符默认行为一起使用的值。\n\
    \n### toString()\n\n当 valueOf() 返回引用值而不是原始值时，会调用 toString() 方法作为后备。它也在 JavaScript\
    \ 期望字符串时隐式地对原始值调用。例如，当字符串用作加法运算符的一个操作数时，另一个操作数会自动转换为字符串。如果另一个操作数是原始值，它会被转换为字符串表示（例如，true\
    \ 变成 \"true\"），但如果它是引用值，则会调用 valueOf()。如果 valueOf() 返回引用值，则会调用 toString() 并使用返回的值。例如：\n\
    \n```\nvar book = {\n  title: \"The Principles of Object-Oriented JavaScript\"\
    \n};\n\nvar message = \"Book = \" + book;\nconsole.log(message);      // \"Book\
    \ = [object Object]\"\n```\n\n这段代码通过将 \"Book = \" 与 book 组合来构造字符串。由于 book 是一个对象，因此会调用它的\
    \ toString() 方法。该方法继承自 Object.prototype，并在大多数 JavaScript 引擎中返回默认的 \"[object Object]\"\
    。如果你对该值满意，就无需更改对象的 toString() 方法。然而，有时定义自己的 toString() 方法很有用，这样字符串转换会返回更有信息量的值。假设，例如，你希望之前的脚本记录书籍的标题：\n\
    \n```\nvar book = {\n    title: \"The Principles of Object-Oriented JavaScript\"\
    ,\n    toString: function() {\n        return \"[Book \" + this.title + \"]\"\n\
    \    }\n};\n\nvar message = \"Book = \" + book;\n\n// \"Book = [Book The Principles\
    \ of Object-Oriented JavaScript]\"\nconsole.log(message);\n```\n\n这段代码为 book 定义了一个自定义的\
    \ toString() 方法，它返回的值比继承版本更有用。你通常不需要担心定义自定义 toString() 方法，但知道在必要时可以这样做是好的。\n\n\
    ### 修改 Object.prototype\n\n所有对象默认都从 Object.prototype 继承，因此对 Object.prototype 的更改会影响所有对象。这是一个非常危险的情况。第\
    \ 4 章建议你不要修改内置对象原型，而对 Object.prototype 这一建议更是加倍。看看会发生什么：\n\n```\nObject.prototype.add\
    \ = function(value) {\n    return this + value;\n};\n\nvar book = {\n    title:\
    \ \"The Principles of Object-Oriented JavaScript\"\n};\n\nconsole.log(book.add(5));\
    \        // \"[object Object]5\"\nconsole.log(\"title\".add(\"end\"));  // \"\
    titleend\"\n\n// in a web browser\nconsole.log(document.add(true));  // \"[object\
    \ HTMLDocument]true\"\nconsole.log(window.add(5));       // \"[object Window]true\"\
    \n```\n\nObject.create() 方法接受两个参数。第一个参数是用于新对象 [[Prototype]] 的对象。可选的第二个参数是属性描述符对象，其格式与\
    \ Object.defineProperties() 使用的格式相同（参见第 3 章）。考虑以下内容：\n\n```\nvar book = {\n  title:\
    \ \"The Principles of Object-Oriented JavaScript\"\n};\n\n// is the same as\n\n\
    var book = Object.create(Object.prototype, {\n  title: {\n    configurable: true,\n\
    \    enumerable: true,\n    value: \"The Principles of Object-Oriented JavaScript\"\
    ,\n    writable: true\n  }\n});\n```\n\n这段代码中的两个声明在效果上是相同的。第一个声明使用对象字面量定义一个具有单个属性\
    \ title 的对象。该对象自动从 Object.prototype 继承，并且该属性默认设置为可配置、可枚举和可写。第二个声明采取相同的步骤，但使用 Object.create()\
    \ 显式执行。每个声明产生的 book 对象行为完全相同。但你可能永远不会直接编写从 Object.prototype 继承的代码，因为你默认就会得到它。从其他对象继承更有趣：\n\
    \n```\nvar person1 = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \  }\n};\n\nvar person2 = Object.create(person1, {\n  name: {\n    configurable:\
    \ true,\n    enumerable: true,\n    value: \"Greg\",\n    writable: true\n  }\n\
    });\n\nperson1.sayName(); // outputs \"Nicholas\"\nperson2.sayName(); // outputs\
    \ \"Greg\"\n```\n\n"
