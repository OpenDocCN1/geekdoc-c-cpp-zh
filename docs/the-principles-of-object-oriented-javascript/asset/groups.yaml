    # Primitive Wrapper Types


    Perhaps one of the most confusing parts of JavaScript is the concept of primitive
    wrapper types. There are three primitive wrapper types (String, Number, and Boolean).
    These special reference types exist to make working with primitive values as easy
    as working with objects. (It would be very confusing if you had to use a different
    syntax or switch to a procedural style just to get a substring of text.)


    The primitive wrapper types are reference types that are automatically created
    behind the scenes whenever strings, numbers, or Booleans are read. For example,
    in the first line of this listing, a primitive string value is assigned to name.
    The second line treats name like an object and calls charAt(0) using dot notation.


    ```

    var name = "Nicholas";

    var firstChar = name.charAt(0);

    console.log(firstChar); // "N"

    ```


    This is what happens behind the scenes:


    ```

    // what the JavaScript engine does

    var name = "Nicholas";

    var temp = new String(name);

    var firstChar = temp.charAt(0);

    temp = null;

    console.log(firstChar); // "N"

    ```


    Because the second line uses a string (a primitive) like an object, the JavaScript
    engine creates an instance of String so that charAt(0) will work. The String object
    exists only for one statement before it’s destroyed (a process called autoboxing).
    To test this out, try adding a property to a string as if it were a regular object:


    ```

    var name = "Nicholas";

    name.last = "Zakas";

    console.log(name.last); // undefined

    ```


    This code attempts to add the property last to the string name. The code itself
    is just fine except that the property disappears. What happened? When working
    with regular objects, you can add properties at any time and they stay until you
    manually remove them. With primitive wrapper types, properties seem to disappear
    because the object on which the property was assigned is destroyed immediately
    afterward.'
