    Greg\";\nconsole.log(person1.name);                      // \"Nicholas\"\n```\n\
    \nIn this code, you can’t do anything with the name property except read the value;\
    \ every other operation is locked down. If you’re changing an existing property,\
    \ keep in mind that only the attributes you specify will change.\n\n> NOTE Nonwritable\
    \ properties throw an error in strict mode when you try to change the value. In\
    \ nonstrict mode, the operation silently fails.\n\n## Accessor Property Attributes\n\
    \nAccessor properties also have two additional attributes. Because there is no\
    \ value stored for accessor properties, there is no need for [[Value]] or [[Writable]].\
    \ Instead, accessors have [[Get]] and [[Set]], which contain the getter and setter\
    \ functions, respectively. As with the object literal form of getters and setters,\
    \ you need only define one of these attributes to create the property.\n\n> NOTE\
    \ If you try to create a property with both data and accessor attributes, you\
    \ will get an error.\n\nThe advantage of using accessor property attributes instead\
    \ of object literal notation to define accessor properties is that you can also\
    \ define those properties on existing objects. If you want to use object literal\
    \ notation, you have to define accessor properties when you create the object.\n\
    \nAs with data properties, you can also specify whether accessor properties are\
    \ configurable or enumerable. Consider this example from earlier:\n\n```\nvar\
    \ person1 = {\n  _name: \"Nicholas\",\n\n  get name() {\n    console.log(\"Reading\
    \ name\");\n    return this._name;\n  },\n\n  set name(value) {\n    console.log(\"\
    Setting name to %s\", value);\n    this._name = value;\n  }\n};\n```\n\nThis code\
    \ can also be written as follows:\n\n```\nvar person1 = {\n  _name: \"Nicholas\"\
    \n};\n\nObject.defineProperty(person1, \"name\", {\n  get: function() {\n    console.log(\"\
    Reading name\");\n    return this._name;\n  },\n  set: function(value) {\n   \
    \ console.log(\"Setting name to %s\", value);\n    this._name = value;\n  },\n\
    \  enumerable: true,\n  configurable: true\n});\n```\n\nNotice that the get and\
    \ set keys on the object passed in to Object.defineProperty() are data properties\
    \ that contain a function. You can’t use object literal accessor format here.\n\
    \nSetting the other attributes ([[Enumerable]] and [[Configurable]]) allows you\
    \ to change how the accessor property works. For example, you can create a nonconfigurable,\
    \ nonenumerable, nonwritable property like this:\n\n```\nvar person1 = {\n  _name:\
    \ \"Nicholas\"\n};\n```\n"
  mdcn: "\n\n请记住并非所有属性都是可枚举的。事实上，大多数对象上的原生方法其 [[Enumerable]] 属性都被设置为 false。你可以使用 propertyIsEnumerable()\
    \ 方法来检查一个属性是否可枚举，该方法存在于每个对象上：\n\n```\nvar person1 = {\n    name: \"Nicholas\"\n\
    };\n\nconsole.log(\"name\" in person1);                     // true\nconsole.log(person1.propertyIsEnumerable(\"\
    name\"));   // true\n\nvar properties = Object.keys(person1);\n\nconsole.log(\"\
    length\" in properties);                 // true\nconsole.log(properties.propertyIsEnumerable(\"\
    length\")); // false\n```\n\n这里，属性 name 是可枚举的，因为它是定义在 person1 上的自定义属性 ①。而对于 properties\
    \ 数组而言，length 属性则不可枚举 ②，因为它是 Array.prototype 上的内置属性。你会发现许多原生属性默认都是不可枚举的。\n\n##\
    \ 属性的类型\n\n属性有两种不同的类型：数据属性和访问器属性。数据属性包含一个值，就像本章前面示例中的 name 属性一样。[[Put]] 方法的默认行为是创建数据属性，而本章到目前为止的每个示例都使用了数据属性。访问器属性不包含值，而是定义在读取属性时调用的函数（称为\
    \ getter），以及在写入属性时调用的函数（称为 setter）。访问器属性只需要 getter 或 setter 其一即可，尽管也可以同时拥有两者。\n\
    \n使用对象字面量定义访问器属性有一种特殊语法：\n\n```\nvar person1 = {\n    _name: \"Nicholas\",\n\n\
    \    get name() {\n        console.log(\"Reading name\");\n        return this._name;\n\
    \    },\n```\n\n## 常见属性\n\n数据属性和访问器属性之间共享两个属性。第一个是 [[Enumerable]]，它决定你是否可以遍历该属性。另一个是\
    \ [[Configurable]]，它决定属性是否可以被更改。你可以使用 delete 删除可配置属性，并且可以随时更改其属性。（这也意味着可配置属性可以在数据属性和访问器属性之间相互转换。）默认情况下，你在对象上声明的所有属性都是可枚举且可配置的。\n\
    \n如果你想更改属性属性，可以使用 Object.defineProperty() 方法。此方法接受三个参数：拥有该属性的对象、属性名，以及包含要设置的属性的描述符对象。描述符具有与内部属性相同的名称，但不带方括号。因此你使用\
    \ enumerable 来设置 [[Enumerable]]，使用 configurable 来设置 [[Configurable]]。例如，假设你想使一个对象属性不可枚举且不可配置：\n\
    \n```\nvar person1 = {\n    name: \"Nicholas\"\n};\n\nObject.defineProperty(person1,\
    \ \"name\", {\n    enumerable: false\n});\n\nconsole.log(\"name\" in person1);\
    \          // true\nconsole.log(person1.propertyIsEnumerable(\"name\"));  // false\n\
    \nvar properties = Object.keys(person1);\nconsole.log(properties.length);    \
    \       // 0\n\nObject.defineProperty(person1, \"name\", {\n    configurable:\
    \ false\n});\n\n// try to delete the Property\ndelete person1.name;\nconsole.log(\"\
    name\" in person1);          // true\nconsole.log(person1.name);             \
    \   // \"Nicholas\"\n\nObject.defineProperty(person1, \"name\", {  // error!!!\n\
    \    configurable: true\n});\n```\n\nname 属性按通常方式定义 ①，但随后被修改以将其 [[Enumerable]]\
    \ 属性设置为 false ②。propertyIsEnumerable() 方法现在返回 false ③，因为它引用了 [[Enumerable]] 的新值。\n\
    \n之后，name 被更改为不可配置 ④。从现在开始，尝试删除 name 将失败，因为属性不能被更改，所以 name 仍然存在于 person1 上 ⑤。再次对\
