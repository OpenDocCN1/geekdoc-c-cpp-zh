    \n> NOTE 当 JavaScript 以严格模式运行时，尝试删除不可配置属性会产生错误。在非严格模式下，该操作会静默失败。\n\n## 数据属性属性\n\
    \n数据属性拥有访问器所没有的另外两个属性。第一个是 [[Value]]，它保存属性值。当你在对象上创建属性时，该属性会自动填充。所有属性值都存储在 [[Value]]\
