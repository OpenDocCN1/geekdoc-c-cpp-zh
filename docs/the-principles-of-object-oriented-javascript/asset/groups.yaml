    \ 的第一个参数是新函数的 this 值。所有其他参数代表应永久设置在新函数中的命名参数。你仍然可以在之后传入任何未永久设置的额外参数。\n\n以下代码展示了使用\
    \ bind() 的两个示例。你通过将 this 值绑定到 person1 来创建 sayNameForPerson1() 函数，而 sayNameForPerson2()\
    \ 将 this 绑定到 person2 并将第一个参数绑定为 \"person2\"。\n\n```javascript\nfunction sayNameForAll(label)\
    \ {\n    console.log(label + \":\" + this.name);\n}\n\nvar person1 = {\n    name:\
    \ \"Nicholas\"\n};\n\nvar person2 = {\n    name: \"Greg\"\n};\n\n// create a function\
    \ just for person1\n① var sayNameForPerson1 = sayNameForAll.bind(person1);\nsayNameForPerson1(\"\
    person1\");      // outputs \"person1:Nicholas\"\n\n// create a function just\
    \ for person2\n② var sayNameForPerson2 = sayNameForAll.bind(person2, \"person2\"\
    );\nsayNameForPerson2();                // outputs \"person2:Greg\"\n\n// attaching\
    \ a method to an object doesn't change 'this'\n③ person2.sayName = sayNameForPerson1;\n\
    person2.sayName(\"person2\");         // outputs \"person2:Nicholas\"\n```\n\n\
    没有为 sayNameForPerson1() ① 绑定参数，因此你仍需传入输出的标签。函数 sayNameForPerson2() 不仅将 this 绑定到\
    \ person2，还将第一个参数绑定为 \"person2\" ②。这意味着你可以调用 sayNameForPerson2() 而无需传入任何额外参数。此示例的最后一部分将\
    \ sayNameForPerson1() 添加到 person2 并命名为 sayName ③。函数是绑定的，因此 this 的值不会改变，即使 sayNameForPerson1\
    \ 现在是 person2 上的一个函数。该方法仍然输出 person1.name 的值。\n\n## Summary\n\nJavaScript 函数的独特之处在于它们也是对象，这意味着它们可以被访问、复制、覆盖，并且通常像任何其他对象值一样被处理。JavaScript\
    \ 函数与其他对象之间最大的区别是一个特殊的内部属性 [[Call]]，它包含函数的执行指令。typeof 运算符会在对象上查找此内部属性，如果找到，则返回\
    \ \"function\"。\n\n有两种函数字面量形式：声明和表达式。函数声明包含 function 关键字右侧的函数名，并在其定义的上下文顶部提升。函数表达式用于可以像其他值一样使用的地方，例如赋值表达式、函数参数或另一个函数的返回值。\n\
    \n因为函数是对象，所以存在 Function 构造函数。你可以使用 Function 构造函数创建新函数，但这通常不推荐，因为它会使代码更难理解并使调试变得困难。话虽如此，你在运行时才知道函数的真正形式的情况下，偶尔会遇到其使用情况。\n\
    \n你需要很好地掌握函数才能理解 JavaScript 中面向对象编程的工作方式。由于 JavaScript 没有类的概念，函数和其他对象是你实现聚合和继承所能使用的全部。\n\
    \n## 3 UNDERSTANDING OBJECTS\n\n![](img/dcf53336af93733d4dab8829d31ceb8e_51_0.png)\n\
    \n尽管 JavaScript 中有许多内置引用类型，但你很可能会相当频繁地创建自己的对象。在这样做时，请记住 JavaScript 中的对象是动态的，这意味着它们可以在代码执行期间的任何时间发生变化。而基于类的语言会根据类定义锁定对象，JavaScript\
    \ 对象没有此类限制。\n\nJavaScript 编程很大一部分是管理这些对象，这就是为什么理解对象的工作方式是理解整个 JavaScript 的关键所在。本章后面会更详细地讨论这一点。\n\
    \n"
