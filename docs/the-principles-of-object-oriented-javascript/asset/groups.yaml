    is no good way to debug functions that are created in the constructor form: These
    functions aren’t recognized by JavaScript debuggers and therefore act as a black
    box in your application.


    # Regular Expression Literals


    JavaScript also has regular expression literals that allow you to define regular
    expressions without using the RegExp constructor. Regular expression literals
    look very similar to regular expressions in Perl: The pattern is contained between
    two slashes, and any additional options are single characters following the second
    slash. For example:


    ```

    var numbers = /\d+/g;


    // is the same as


    var numbers = new RegExp("\\d+", "g");

    ```


    The literal form of regular expressions in JavaScript is a bit easier to deal
    with than the constructor form because you don’t need to worry about escaping
    characters within strings. When using the RegExp constructor, you pass the pattern
    in as a string, so you have to escape any backslashes. (That’s why \d is used
    in the literal and \\d is used in the constructor.) Regular expression literals
    are preferred over the constructor form in JavaScript except when the regular
    expression is being constructed dynamically from one or more strings.


    That said, with the exception of Function, there really isn’t any right or wrong
    way to instantiate built-in types. Many developers prefer literals, while some
    prefer constructors. Choose whichever method you find more comfortable to use.


    # Property Access


    Properties are name/value pairs that are stored on an object. Dot notation is
    the most common way to access properties in JavaScript (as in many object-oriented
    languages), but you can also access properties on JavaScript objects by using
    bracket notation with a string.


    For example, you could write this code, which uses dot notation:


    ```

    var array = [];

    array.push(12345);

    ```


    With bracket notation, the name of the method is now included in a string enclosed
    by square brackets, as in this example:


    ```

    var array = [];

    array["push"](12345);

    ```'
