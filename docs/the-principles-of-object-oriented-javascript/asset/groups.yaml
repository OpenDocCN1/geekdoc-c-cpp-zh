    \ *signatures*. A function signature is made up of the function name plus the\
    \ number and type of parameters the function expects. Thus, a single function\
    \ can have one signature that accepts a single string argument and another that\
    \ accepts two numeric arguments. The language determines which version of a function\
    \ to call based on the arguments that are passed in.\n\nAs mentioned previously,\
    \ JavaScript functions can accept any number of parameters, and the types of parameters\
    \ a function takes aren’t specified at all. That means JavaScript functions don’t\
    \ actually have signatures. A lack of function signatures also means a lack of\
    \ function overloading. Look at what happens when you try to declare two functions\
    \ with the same name:\n\n```\nfunction sayMessage(message) {\n    console.log(message);\n\
    }\n\nfunction sayMessage() {\n    console.log(\"Default message\");\n}\n\nsayMessage(\"\
    Hello!\");    // outputs \"Default message\"\n```\n\nIf this were another language,\
    \ the output of sayMessage(\"Hello!\") would likely be \"Hello!\". In JavaScript,\
    \ however, when you define multiple functions with the same name, the one that\
    \ appears last in your code wins. The earlier function declarations are completely\
    \ removed, and the last is the one that is used. Once again, it helps to think\
    \ about this situation using objects:\n\n```\nvar sayMessage = new Function(\"\
    message\", \"console.log(message);\");\n\nsayMessage = new Function(\"console.log(\\\
    \"Default message\\\");\");\n\nsayMessage(\"Hello!\");    // outputs \"Default\
    \ message\"\n```\n\nLooking at the code this way makes it clear why the previous\
    \ code didn’t work. A function object is being assigned to sayMessage twice in\
    \ a row, so it makes sense that the first function object would be lost.\n\nThe\
    \ fact that functions don’t have signatures in JavaScript doesn’t mean you can’t\
    \ mimic function overloading. You can retrieve the number of parameters that were\
    \ passed in by using the arguments object, and you can use that information to\
    \ determine what to do. For example:\n\n```\nfunction sayMessage(message) {\n\
    \    if (arguments.length === 0) {\n        message = \"Default message\";\n \
    \   }\n    console.log(message);\n}\n\nsayMessage(\"Hello!\");      // outputs\
    \ \"Hello!\"\n```\n\nIn this example, the sayMessage() function behaves differently\
    \ based on the number of parameters that were passed in. If no parameters are\
    \ passed in (arguments.length === 0), then a default message is used. Otherwise,\
    \ the first parameter is used as the message. This is a little more involved than\
    \ function overloading in other languages, but the end result is the same. If\
    \ you really want to check for different data types, you can use typeof and instanceof.\n\
    \nNOTE In practice, checking the named parameter against undefined is more common\
    \ than relying on arguments.length.\n\n## Object Methods\n\nAs mentioned in Chapter\
    \ 1, you can add and remove properties from objects at any time. When a property\
    \ value is actually a function, the property is considered a method. You can add\
    \ a method to an object in the same way that you would add a property. For example,\
    \ in the following code, the person variable is assigned an object literal with\
    \ a name property and a method called sayName.\n\n```\nvar person = {\n    name:\
    \ \"Nicholas\",\n    sayName: function() {\n        console.log(person.name);\n\
    \    }\n};\n\nperson.sayName();      // outputs \"Nicholas\"\n```\n\nNote that\
    \ the syntax for a data property and a method is exactly the same—an identifier\
    \ followed by a colon and the value. In the case of sayName, the value just happens\
    \ to be a function. You can then call the method directly from the object as in\
    \ person.sayName(\"Nicholas\").\n\n## The this Object\n\nYou may have noticed\
    \ something strange in the previous example. The sayName() method references person.name\
    \ directly, which creates tight coupling between the method and the object. This\
    \ is problematic for a number of reasons. First, if you change the variable name,\
    \ you also need to remember to change the reference to that name in the method.\
    \ Second, this sort of tight coupling makes it difficult to use the same function\
    \ for different objects. Fortunately, JavaScript has a way around this issue.\n\
    \nEvery scope in JavaScript has a this object that represents the calling object\
    \ for the function. In the global scope, this represents the global object (window\
    \ in web browsers). When a function is called while attached to an object, the\
    \ value of this is equal to that object by default. So, instead of directly referencing\
    \ an object inside a method, you can reference this instead. For example, you\
    \ can rewrite the code from the previous example to use this:\n\n```\nvar person\
    \ = {\n  name: \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n\
    \  }\n};\n\nperson.sayName();      // outputs \"Nicholas\"\n```\n\nThis code works\
    \ the same as the earlier version, but this time, sayName() references this instead\
    \ of person. That means you can easily change the name of the variable or even\
    \ reuse the function on different objects.\n\n```\nfunction sayNameForAll() {\n\
    \  console.log(this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\",\n  sayName:\
    \ sayNameForAll\n};\n\nvar person2 = {\n  name: \"Greg\",\n  sayName: sayNameForAll\n\
    };\n\nvar name = \"Michael\";\n\nperson1.sayName();      // outputs \"Nicholas\"\
    \nperson2.sayName();      // outputs \"Greg\"\n\nsayNameForAll();        // outputs\
    \ \"Michael\"\n```\n\n"
