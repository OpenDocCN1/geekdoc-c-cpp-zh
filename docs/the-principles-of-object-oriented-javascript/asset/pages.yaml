- pgno: 32
  md: "This syntax is very useful when you want to dynamically decide which property\
    \ to access. For example, here bracket notation allows you to use a variable instead\
    \ of the string literal to specify the property to access.\n\n```\nvar array =\
    \ [];\nvar method = \"push\";\narray[method](12345);\n```\n\nIn this listing,\
    \ the variable method has a value of \"push\", so push() is called on the array.\
    \ This capability is quite useful, as you’ll see throughout this book. The point\
    \ to remember is that, other than syntax, the only difference—performance or otherwise—between\
    \ dot notation and bracket notation is that bracket notation allows you to use\
    \ special characters in property names. Developers tend to find dot notation easier\
    \ to read, so you’ll see it used more frequently than bracket notation.\n\n# Identifying\
    \ Reference Types\n\nA function is the easiest reference type to identify because\
    \ when you use the typeof operator on a function, the operator should return \"\
    function\":\n\n```\nfunction reflect(value) {\n    return value;\n}\n\nconsole.log(typeof\
    \ reflect);    // \"function\"\n```\n\nOther reference types are trickier to identify\
    \ because, for all reference types other than functions, typeof returns \"object\"\
    . That’s not very helpful when you’re dealing with a lot of different types. To\
    \ identify reference types more easily, you can use JavaScript’s instanceof operator.\n\
    \nThe instanceof operator takes an object and a constructor as parameters. When\
    \ the value is an instance of the type that the constructor specifies, instanceof\
    \ returns true; otherwise, it returns false, as you can see here:\n\n```\nvar\
    \ items = [];\nvar object = {};\n\nfunction reflect(value) {\n    return value;\n\
    }\n\nconsole.log(items instanceof Array);      // true\nconsole.log(object instanceof\
    \ Object);     // true\nconsole.log(reflect instanceof Function);  // true\n```"
  merge: -1
