- pgno: 121
  md: '# # TAKE CONTROL OF JAVASCRIPT OBJECTS


    > Foreword by Cody Lindley, Best-selling Author and Principal Frontend Architect
    at TandemSeven


    If you’ve used a more traditional object-oriented language, such as C++ or Java,
    JavaScript probably doesn’t seem object-oriented at all. It has no concept of
    classes, and you don’t even need to define any objects in order to write code.
    But don’t be fooled—JavaScript is an incredibly powerful and expressive object-oriented
    language that puts many design decisions right into your hands.


    In The Principles of Object-Oriented JavaScript, Nicholas C. Zakas thoroughly
    explores JavaScript’s object-oriented nature, revealing the language’s unique
    implementation of inheritance and other key characteristics. You’ll learn:


    +   - The difference between primitive and reference values

    +   - What makes JavaScript functions so unique

    +   - The various ways to create objects


    +   - How to define your own constructors

    +   - How to work with and understand prototypes

    +   - Inheritance patterns for types and objects


    The Principles of Object-Oriented JavaScript will leave even experienced developers
    with a deeper understanding of JavaScript. Unlock the secrets behind how objects
    work in JavaScript so you can write clearer, more flexible, and more efficient
    code.


    # ## ABOUT THE AUTHOR


    Nicholas C. Zakas is a software engineer at Box and is known for writing on and
    speaking about the latest in JavaScript best practices. He honed his experience
    during his five years at Yahoo!, where he was principal frontend engineer for
    the Yahoo! home page. He is the author of several books, including Maintainable
    JavaScript and Professional JavaScript for Web Developers.'
