- pgno: 92
  md: "You can also create objects with a null [[Prototype]] via Object.create(),\
    \ such as:\n\n```\nvar nakedObject = Object.create(null);\nconsole.log(\"toString\"\
    \ in nakedObject); // false\nconsole.log(\"valueOf\" in nakedObject); // false\n\
    ```\n\nThe nakedObject in this example is an object with no prototype chain. That\
    \ means built-in methods such as toString() and valueOf() aren’t present on the\
    \ object. In effect, this object is a completely blank slate with no predefined\
    \ properties, which makes it perfect for creating a lookup hash without potential\
    \ naming collisions or inherited property names. There aren’t many other uses\
    \ for an object like this, and you can’t use it as if it were inheriting from\
    \ Object.prototype. For example, any time you use an operator on nakedObject,\
    \ you’ll just get an error along the lines of “Cannot convert object to primitive\
    \ value.” Still, it’s an interesting quirk of the JavaScript language that you\
    \ can create a prototype-less object.\n\n# Constructor Inheritance\n\nObject inheritance\
    \ in JavaScript is also the basis of constructor inheritance. Recall from Chapter\
    \ 4 that almost every function has a prototype property that can be modified or\
    \ replaced. That prototype property is automatically assigned to be a new generic\
    \ object that inherits from Object.prototype and has a single own property called\
    \ constructor. In effect, the JavaScript engine does the following for you:\n\n\
    ```\n// you write this\nfunction YourConstructor() {\n  // initialization\n}\n\
    \n// JavaScript engine does this for you behind the scenes\nYourConstructor.prototype\
    \ = Object.create(Object.prototype, {\n  constructor: {\n    configurable: true,\n\
    \    enumerable: true,\n    value: YourConstructor,\n    writable: true\n  }\n\
    });\n```\n\nSo without doing anything extra, this code sets the constructor's\
    \ prototype property to an object that inherits from Object.prototype, which means\
    \ any instances of YourConstructor also inherit from Object.prototype. YourConstructor\
    \ is a subtype of Object, and Object is a supertype of YourConstructor."
