    \t}\n\t}\n};\n```\n```\n\nThe EventTarget type provides basic event handling for\
    \ any object.\nYou can add ① and remove ③ listeners as well as fire events ② directly\
    \ on the object. The event listeners are stored on a _listeners property that\
    \ is created only when addListener() is called for the first time (this makes\
    \ it easier to mix in). You can use instances of EventTarget like this:\n\n```\n\
    ```javascript\nvar target = new EventTarget();\ntarget.addListener(\"message\"\
    , function(event) {\n\tconsole.log(\"Message is \" + event.data);\n});\ntarget.fire({\n\
    \ttype: \"message\",\n\tdata: \"Hello world!\"\n});\n```\n```\n\nSupport for events\
    \ is useful for objects in JavaScript. If you want to have a different type of\
    \ object that also supports events, you have a few options. First, you can create\
    \ a new instance of EventTarget and then add on the properties that you want:\n\
    \n```\n```javascript\nvar person = new EventTarget();\nperson.name = \"Nicholas\"\
    ;\nperson.sayName = function() {\n\tconsole.log(this.name);\n};\nthis.fire({ type:\
    \ \"namesaid\", name: name });\n```\n```\n\nIn this code, a new variable called\
    \ person is created as an instance of EventTarget, and then the person-related\
    \ properties are added. Unfortunately, this means that person is actually an instance\
    \ of EventTarget instead of Object or a custom type. You also incur the overhead\
    \ of needing to add a bunch of new properties by hand. It would be better to have\
    \ a more organized way of doing this."
