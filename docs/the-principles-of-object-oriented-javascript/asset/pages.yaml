- pgno: 86
  md: "the prototype is also an object, it has its own prototype and inherits properties\
    \ from that. This is the prototype chain: An object inherits from its prototype,\
    \ while that prototype in turn inherits from its prototype, and so on.\n\nAll\
    \ objects, including those you define yourself, automatically inherit from Object.prototype\
    \ unless you specify otherwise (discussed later in this chapter). More specifically,\
    \ all objects inherit from Object.prototype. Any object defined via an object\
    \ literal has its [[Prototype]] set to Object.prototype, meaning that it inherits\
    \ properties from Object.prototype, just like book in this example:\n\n```\n```javascript\n\
    var book = {\n\t\ttitle: \"The Principles of Object-Oriented JavaScript\"\n\t\
    };\n\nvar prototype = Object.getPrototypeOf(book);\n\nconsole.log(prototype ===\
    \ Object.prototype); // true\n```\n```\n\nHere, book has a prototype equal to\
    \ Object.prototype. No additional code was necessary to make this happen, as this\
    \ is the default behavior when new objects are created. This relationship means\
    \ that book automatically receives methods from Object.prototype.\n\n# **Methods\
    \ Inherited from Object.prototype**\n\n+   - hasOwnProperty() Determines whether\
    \ an own property with the given name exists\n+   - propertyIsEnumerable() Determines\
    \ whether an own property is enumerable\n+   - isPrototypeOf() Determines whether\
    \ the object is the prototype of another\n+   - valueOf() Returns the value representation\
    \ of the object\n+   - toString() Returns a string representation of the object\n\
    \nThese five methods appear on all objects through inheritance. The last two are\
    \ important when you need to make objects work consistently in JavaScript, and\
    \ sometimes you might want to define them yourself."
