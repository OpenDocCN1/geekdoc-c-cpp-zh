- pgno: 109
  md: 'In this code, name is defined as an accessor property with only a getter ①.
    That means assigning a value to the property should have no effect. However, because
    the accessor property becomes a data property on the person object, it''s possible
    to overwrite name with a new value ②. During the call to mixin(), the value of
    name is read from the supplier and assigned to the property called name on the
    receiver. At no point during this process is a new accessor defined, making the
    name property on the receiver a data property.


    If you want accessor properties to be copied over as accessor properties, you
    need a different mixin() function, such as:


    ```

    function mixin(receiver, supplier) {

    Object.keys(supplier).forEach(function(property) {

    var descriptor = Object.getOwnPropertyDescriptor(supplier, property);

    Object.defineProperty(receiver, property, descriptor);

    });

    return receiver;

    }


    var person = mixin(new EventTarget(), {

    get name() {

    return "Nicholas"

    },

    sayName: function() {

    console.log(this.name);

    this.fire({ type: "namesaid", name: name });

    }

    });


    console.log(person.name); // "Nicholas"


    person.name = "Greg";

    console.log(person.name); // "Nicholas"

    ```


    This version of mixin() uses Object.keys() ① to get an array of all enumerable
    own properties on supplier. The forEach() method is used to iterate over those
    properties. The property descriptor for each property on supplier is retrieved
    and then added to receiver via Object.defineProperty() ②. This ensures that all
    of the relevant property information is transferred to receiver, not just the
    value. That means the person object has an accessor property called name, so it
    cannot be overwritten.'
  merge: -1
