- pgno: 111
  md: "```\nPerson.prototype.sayName = function() {\n    console.log(this.name);\n\
    };\n\n① var person1 = Person(\"Nicholas\");        // note: missing \"new\"\n\n\
    console.log(person1 instanceof Person);    // false\nconsole.log(typeof person1);\
    \               // \"undefined\"\nconsole.log(name);                         //\
    \ \"Nicholas\"\n```\n\nIn this case, name is created as a global variable because\
    \ the Person constructor is called without new ①. Keep in mind that this code\
    \ is running in nonstrict mode, as leaving out new would throw an error in strict\
    \ mode. The fact that the constructor begins with a capital letter usually indicates\
    \ that it should be preceded by new, but what if you want to allow this use case\
    \ and have the function work without new? Many built-in constructors, such as\
    \ Array and RegExp, also work without new because they are written to be scope\
    \ safe. A scope-safe constructor can be called with or without new and returns\
    \ the same type of object in either case.\n\nWhen new is called with a function,\
    \ the newly created object represented by this is already an instance of the custom\
    \ type represented by the constructor. So you can use instanceof to determine\
    \ whether new was used in the function call:\n\n```\nfunction Person(name) {\n\
    \    if (this instanceof Person) {\n        // called with \"new\"\n    } else\
    \ {\n        // called without \"new\"\n    }\n}\n```\n\nUsing a pattern like\
    \ this lets you control what a function does based on whether it's called with\
    \ new or without. You may want to treat each circumstance differently, but you'll\
    \ often want the function to behave the same way (frequently, to protect against\
    \ accidental omission of new). A scope-safe version of Person looks like this:\n\
    \n```\nfunction Person(name) {\n    if (this instanceof Person) {\n        this.name\
    \ = name;\n    } else {\n        return new Person(name);\n    }\n}\n```"
