    \ and any other function. The clue that Person is a constructor is in the name—the\
    \ first letter is capitalized.\n\nAfter the constructor is defined, you can start\
    \ creating instances, like the following two Person objects:\n\n```\nvar person1\
    \ = new Person();\nvar person2 = new Person();\n```\n\nWhen you have no parameters\
