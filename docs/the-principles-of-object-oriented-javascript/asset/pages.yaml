- pgno: 97
  md: "# Accessing Supertype Methods\n\nIn the previous example, the Square type has\
    \ its own toString() method that shadows toString() on the prototype. It is fairly\
    \ common to override supertype methods with new functionality in the subtype,\
    \ but what if you still want to access the supertype method? In other languages,\
    \ you might be able to say super.toString(), but JavaScript doesn’t have anything\
    \ similar. Instead, you can directly access the method on the supertype’s prototype\
    \ and use either call() or apply() to execute the method on the subtype object.\
    \ For example:\n\n```\n```js\nfunction Rectangle(length, width) {\n  this.length\
    \ = length;\n  this.width = width;\n}\n```\n```\n\n```\n```js\nRectangle.prototype.getArea\
    \ = function() {\n  return this.length * this.width;\n};\n```\n```\n\n```\n```js\n\
    Rectangle.prototype.toString = function() {\n  return \"[Rectangle \" + this.length\
    \ + \"x\" + this.height + \"]\";\n};\n```\n```\n\n// inherits from Rectangle\n\
    \n```\n```js\nfunction Square(size) {\n  Rectangle.call(this, size, size);\n}\n\
    ```\n```\n\n```\n```js\nSquare.prototype = Object.create(Rectangle.prototype,\
    \ {\n  constructor: {\n    configurable: true,\n    enumerable: true,\n    value:\
    \ Square,\n    writable: true\n  }\n});\n```\n```\n\n// call the supertype method\n\
    \n```\n```js\nSquare.prototype.toString = function() {\n  var text = Rectangle.prototype.toString.call(this);\n\
    \  return text.replace(\"Rectangle\", \"Square\");\n};\n```\n```\n\nIn this version\
    \ of the code, Square.prototype.toString() calls Rectangle.prototype.toString()\
    \ by using call(). The method just needs to replace \"Rectangle\" with \"Square\"\
    \ before returning the resulting text. This approach may seem a bit verbose for\
    \ such a simple operation, but it is the only way to access a supertype's method."
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Summary


    JavaScript supports inheritance through prototype chaining. A prototype chain
    is created between objects when the [[Prototype]] of one object is set equal to
    another. All generic objects automatically inherit from Object.prototype. If you
    want to create an object that inherits from something else, you can use Object.create()
    to specify the value of [[Prototype]] for a new object.


    You accomplish inheritance between custom types by creating a prototype chain
    on the constructor. By setting the constructor’s prototype property to another
    value, you create inheritance between instances of the custom type and the prototype
    of that other value. All instances of that constructor share the same prototype,
    so they all inherit from the same object. This technique works very well for inheriting
    methods from other objects, but you cannot inherit own properties using prototypes.


    To inherit own properties correctly, you can use constructor stealing, which is
    simply calling a constructor function using call() or apply() so that any initialization
    is done on the subtype object. Combining constructor stealing and prototype chaining
    is the most common way to achieve inheritance between custom types in JavaScript.
    This combination is frequently called pseudoclassical inheritance because of its
    similarity to inheritance in class-based languages.


    You can access methods on a supertype by directly accessing the supertype’s prototype.
    In doing so, you must use call() or apply() to execute the supertype method on
    the subtype object.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 6


    # OBJECT PATTERNS


    ![](img/dcf53336af93733d4dab8829d31ceb8e_99_0.png)


    JavaScript has many patterns for creating objects, and there''s usually more than
    one way to accomplish the same thing. You can define your own custom types or
    your own generic objects whenever you want. You can use inheritance to share behavior
    between objects, or you can employ other techniques, such as mix-ins. You can
    also take advantage of advanced JavaScript features to prevent an object''s structure
    from being modified. The patterns discussed in this chapter give you powerful
    ways of managing and creating objects, all based on your use cases.'
  merge: -1
