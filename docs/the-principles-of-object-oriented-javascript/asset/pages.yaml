  md: "NOTE You can also explicitly call return inside of a constructor. If the returned\
    \ value is an object, it will be returned instead of the newly created object\
    \ instance. If the returned value is a primitive, the newly created object is\
    \ used and the returned value is ignored.\n\nConstructors allow you to initialize\
    \ an instance of a type in a consistent way, performing all of the property setup\
    \ that is necessary before the object can be used. For example, you could also\
    \ use Object.defineProperty() inside of a constructor to help initialize the instance:\n\
    \n```\nfunction Person(name) {\n\n    Object.defineProperty(this, \"name\", {\n\
    \        get: function() {\n            return name;\n        },\n        set:\
    \ function(newName) {\n            name = newName;\n        },\n        enumerable:\
    \ true,\n        configurable: true\n    });\n\n    this.sayName = function()\
    \ {\n        console.log(this.name);\n    };\n}\n```\n\nIn this version of the\
    \ Person constructor, the name property is an accessor property that uses the\
    \ name parameter for storing the actual name. This is possible because named parameters\
    \ act like local variables. Make sure to always call constructors with new; otherwise,\
    \ you risk changing the global object instead of the newly created object. Consider\
    \ what happens in the following code:\n\n```\nvar person1 = Person(\"Nicholas\"\
    );        // note: missing \"new\"\n\nconsole.log(person1 instanceof Person);\
    \    // false\nconsole.log(typeof person1);                // \"undefined\"\n\
    console.log(name);                          // \"Nicholas\"\n```\n\nWhen Person\
    \ is called as a function without new, the value of this inside of the constructor\
