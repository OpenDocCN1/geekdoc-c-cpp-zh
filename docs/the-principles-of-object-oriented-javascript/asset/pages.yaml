- pgno: 33
  md: "In this example, several values are tested using instanceof and a constructor.\
    \ Each reference type is correctly identified by using instanceof and the constructor\
    \ that represents its true type (even though the constructor wasn’t used in creating\
    \ the variable).\n\nThe instanceof operator can identify inherited types. That\
    \ means every object is actually an instance of Object because every reference\
    \ type inherits from Object.\n\nTo demonstrate, the following listing examines\
    \ the three references previously created with instanceof:\n\n```\nvar items =\
    \ [];\nvar object = {};\n\nfunction reflect(value) {\n    return value;\n}\n\n\
    console.log(items instanceof Array);     // true\nconsole.log(items instanceof\
    \ Object);    // true\nconsole.log(object instanceof Object);   // true\nconsole.log(object\
    \ instanceof Array);    // false\nconsole.log(reflect instanceof Function); //\
    \ true\nconsole.log(reflect instanceof Object);   // true\n```\n\nEach reference\
    \ type is correctly identified as an instance of Object, from which all reference\
    \ types inherit.\n\n# Identifying Arrays\n\nAlthough instanceof can identify arrays,\
    \ there is one exception that affects web developers: JavaScript values can be\
    \ passed back and forth between frames in the same web page. This becomes a problem\
    \ only when you try to identify the type of a reference value, because each web\
    \ page has its own global context—its own version of Object, Array, and all other\
    \ built-in types. As a result, when you pass an array from one frame to another,\
    \ instanceof doesn’t work because the array is actually an instance of Array from\
    \ a different frame.\n\nTo solve this problem, ECMAScript 5 introduced Array.isArray(),\
    \ which definitively identifies the value as an instance of Array regardless of\
    \ the value’s origin. This method should return true when it receives a value\
    \ that is a native array from any context. If your environment is ECMAScript 5\
    \ compliant, Array.isArray() is the best way to identify arrays:\n\n```\nvar items\
    \ = [];\n\nconsole.log(Array.isArray(items));     // true\n```"
