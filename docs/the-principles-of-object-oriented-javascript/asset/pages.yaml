- pgno: 110
  md: "Of course, this version of mixin() works only in ECMAScript 5 JavaScript engines.\
    \ If your code needs to work for older engines, you should combine the two mixin()\
    \ approaches into a single function:\n\n```\nfunction mixin(receiver, supplier)\
    \ {\n    if (Object.getOwnPropertyDescriptor) {\n        Object.keys(supplier).forEach(function(property)\
    \ {\n            var descriptor = Object.getOwnPropertyDescriptor(supplier, property);\n\
    \            Object.defineProperty(receiver, property, descriptor);\n        });\n\
    \    } else {\n        for (var property in supplier) {\n            if (supplier.hasOwnProperty(property))\
    \ {\n                receiver[property] = supplier[property]\n            }\n\
    \        }\n    }\n    return receiver;\n}\n```\n\nHere, mixin() checks whether\
    \ Object.getOwnPropertyDescriptor() ① exists to determine whether the JavaScript\
    \ engine supports ECMAScript 5. If so, it goes on to use the ECMAScript 5 version.\
    \ Otherwise, the ECMAScript 3 version is used ②. This function is safe to use\
    \ in both modern and legacy JavaScript engines, as they will apply the most appropriate\
    \ mixin strategy.\n\nNOTE Keep in mind that Object.keys() returns only enumerable\
    \ properties. If you want to also copy over nonenumerable properties, use Object.getOwnPropertyNames()\
    \ instead.\n\n# Scope-Safe Constructors\n\nBecause all constructors are just functions,\
    \ you can call them without using the new operator and therefore affect the value\
    \ of this. Doing so can yield unexpected results, as this ends up coerced to the\
    \ global object in nonstrict mode, or the constructor throws an error in strict\
    \ mode. In Chapter 4, you encountered this example:\n\n```\nfunction Person(name)\
    \ {\n    this.name = name;\n}\n```"
