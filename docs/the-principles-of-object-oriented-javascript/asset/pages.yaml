  md: 'You can read the value of the [[Prototype]] property by using the object.getPrototypeOf()
    method on an object. For example, the following code checks the [[Prototype]]
    of a generic, empty object.


    ```

    ```js

    var object = {};

    var prototype = Object.getPrototypeOf(object);

    console.log(prototype === Object.prototype); // true

    ```

    ```


    For any generic object like this one ①, [[Prototype]] is always a reference to
    Object.prototype.


    > Some JavaScript engines also support a property called __proto__ on all objects.
    This property allows you to both read from and write to the [[Prototype]] property.
    Firefox, Safari, Chrome, and Node.js all support this property, and __proto__
    is on the path for standardization in ECMAScript 6.


    You can also test to see if one object is a prototype for another by using the
    isPrototypeOf() method, which is included on all objects:


    ```

    ```js

    var object = {};

    console.log(Object.prototype.isPrototypeOf(object)); // true

    ```

    ```


    Because object is just a generic object, its prototype should be Object.prototype,
    meaning isPrototypeOf() should return true.


    When a property is read on an object, the JavaScript engine first looks for an
    own property with that name. If the engine finds a correctly named own property,
    it returns that value. If no own property with that name exists on the target
    object, JavaScript searches the [[Prototype]] object instead. If a prototype property
    with that name exists, the value of that property is returned. If the search concludes
    without finding a property with the correct name, undefined is returned.


    Consider the following, in which an object is first created without any own properties:


    ```

    ```js

    var object = {};


    console.log(object.toString()); // "[object Object]"


    object.toString = function() {

    return "[object Custom]";

    };


    console.log(object.toString()); // "[object Custom]"


    // delete own property

    delete object.toString;

    ```

    ```'
