- pgno: 79
  md: "Using the object literal notation to overwrite the prototype changed the constructor\
    \ property so that it now points to Object instead of Person. This happened because\
    \ the constructor property exists on the prototype, not on the object instance.\
    \ When a function is created, its prototype property is created with a constructor\
    \ property equal to the function. This pattern completely overwrites the prototype\
    \ object, which means that constructor will come from the newly created (generic)\
    \ object that was assigned to Person.prototype. To avoid this, restore the constructor\
    \ property to a proper value when overwriting the prototype:\n\n```\n```javascript\n\
    function Person(name) {\n  this.name = name;\n}\n\nPerson.prototype = {\n  ① constructor:\
    \ Person,\n  sayName: function() {\n    console.log(this.name);\n  },\n  toString:\
    \ function() {\n    return \"[Person \" + this.name + \"]\";\n  }\n};\n\nvar person1\
    \ = new Person(\"Nicholas\");\n\nvar person2 = new Person(\"Greg\");\n\nconsole.log(person1\
    \ instanceof Person); // true\nconsole.log(person1.constructor === Person); //\
    \ true\nconsole.log(person1.constructor === Object); // false\n\nconsole.log(person2\
    \ instanceof Person); // true\nconsole.log(person2.constructor === Person); //\
    \ true\nconsole.log(person2.constructor === Object); // false\n```\n```\n\nIn\
    \ this example, the constructor property is specifically assigned on the prototype\
    \ ① . It's good practice to make this the first property on the prototype so you\
    \ don't forget to include it.\n\nPerhaps the most interesting aspect of the relationships\
    \ among constructors, prototypes, and instances is that there is no direct link\
    \ between the instance and the constructor. There is, however, a direct link between\
    \ the instance and the prototype and between the prototype and the constructor.\
    \ Figure 4-3 illustrates this relationship."
