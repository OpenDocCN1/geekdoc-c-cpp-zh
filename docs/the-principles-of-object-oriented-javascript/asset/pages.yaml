- pgno: 100
  md: "# Private and Privileged Members\n\nAll object properties in JavaScript are\
    \ public, and there’s no explicit way to indicate that a property shouldn’t be\
    \ accessed from outside a particular object. At some point, however, you might\
    \ not want data to be public. For example, when an object uses a value to determine\
    \ some sort of state, modifying that data without the object’s knowledge throws\
    \ the state management process into chaos. One way to avoid this is by using naming\
    \ conventions. For example, it’s quite common to prefix properties with an underscore\
    \ (such as _name) when they are not intended to be public. However, there are\
    \ ways of hiding data that don’t rely on convention and are therefore more “bulletproof”\
    \ in preventing the modification of private information.\n\n\n\nThe module pattern\
    \ is an object-creation pattern designed to create singleton objects with private\
    \ data. The basic approach is to use an immediately invoked function expression\
    \ (IIFE) that returns an object. An IIFE is a function expression that is defined\
    \ and then called immediately to produce a result. That function expression can\
    \ contain any number of local variables that aren’t accessible from outside that\
    \ function. Because the returned object is defined within that function, the object’s\
    \ methods have access to the data. (All objects defined within the IIFE have access\
    \ to the same local variables.) Methods that access private data in this way are\
    \ called privileged methods. Here’s the basic format for the module pattern:\n\
    \n```\nvar yourObject = (function() {\n  // private data variables\n  return {\n\
    \    // public methods and properties\n  };\n})();\n①\n```\n\nIn this pattern,\
    \ an anonymous function is created and executed immediately. (Note the extra parentheses\
    \ at the end of the function ①. You can execute anonymous functions immediately\
    \ using this syntax.) That means the function exists for just a moment, is executed,\
    \ and then is destroyed. IIFEs are a very popular pattern in JavaScript, partially\
    \ for their use in the module pattern."
  merge: -1
  img_proc: true
- pgno: 101
  md: "The module pattern allows you to use regular variables as de facto object properties\
    \ that aren’t exposed publicly. You accomplish this by creating closure functions\
    \ as object methods. Closures are simply functions that access data outside their\
    \ own scope. For example, whenever you access a global object in a function, such\
    \ as window in a web browser, that function is accessing a variable outside its\
    \ own scope. The difference with the module function is that the variables are\
    \ declared within the IIFE, and a function that is also declared inside the IIFE\
    \ accesses those variables. For example:\n\n```\nvar person = (function() {\n\
    \  ① var age = 25;\n  return {\n    name: \"Nicholas\",\n    ② getAge: function()\
    \ {\n      return age;\n    },\n    ③ growOlder: function() {\n      age++;\n\
    \    }\n  };\n})();\n\nconsole.log(person.name); // \"Nicholas\"\nconsole.log(person.getAge());\
    \ // 25\n\nperson.age = 100;\nconsole.log(person.getAge()); // 25\n\nperson.growOlder();\n\
    console.log(person.getAge()); // 26\n```\n\nThis code creates the person object\
    \ using the module pattern. The age variable ① acts like a private property for\
    \ the object. It can’t be accessed directly from outside the object, but it can\
    \ be used by the object methods. There are two privileged methods on the object:\
    \ getAge() ②, which reads the value of the age variable, and growOlder() ③, which\
    \ increments age. Both of these methods can access the variable age directly because\
    \ it is defined in the outer function in which they are defined."
  merge: -1
  img_proc: true
- pgno: 102
  md: "There is a variation of the module pattern called the revealing module pattern,\
    \ which arranges all variables and methods at the top of the IIFE and simply assigns\
    \ them to the returned object. You can write the previous example using the revealing\
    \ module pattern as follows:\n\n```\nvar person = (function() {\n  var age = 25;\n\
    \  function getAge() {\n    return age;\n  }\n  function growOlder() {\n    age++;\n\
    \  }\n  return {\n    name: \"Nicholas\",\n    getAge: getAge,\n    growOlder:\
    \ growOlder\n  };\n})();\n```\n\nIn the revealing module pattern, age, getAge(),\
    \ and growOlder() are all defined as local to the IIFE. The getAge() and growOlder()\
    \ functions are then assigned to the returned object ①, effectively “revealing”\
    \ them outside the IIFE. This code is essentially the same as the earlier example\
    \ using the traditional module pattern; however, some prefer this pattern because\
    \ it keeps all variable and function declarations together.\n\n\n\nThe module\
    \ pattern is great for defining individual objects that have private properties,\
    \ but what about custom types that also require their own private properties?\
    \ You can use a pattern that’s similar to the module pattern inside the constructor\
    \ to create instance-specific private data. For example:\n\n```\nfunction Person(name)\
    \ {\n  // define a variable only accessible inside of the Person constructor\n\
    \  var age = 25;\n  this.name = name;\n  this.getAge = function() {\n    return\
    \ age;\n  };\n};\n```"
  merge: -1
  img_proc: true
- pgno: 103
  md: "```\nthis.growOlder = function() {\n    age++;\n};\n}\n\nvar person = new Person(\"\
    Nicholas\");\n\nconsole.log(person.name);    // \"Nicholas\"\nconsole.log(person.getAge());\
    \    // 25\n\nperson.age = 100;\nconsole.log(person.getAge());    // 25\n\nperson.growOlder();\n\
    console.log(person.getAge());    // 26\n```\n\nIn this code, the Person constructor\
    \ has a local variable, age. That variable is used as part of the getAge() ① and\
    \ growOlder() ② methods. When you create an instance of Person, that instance\
    \ receives its own age variable, getAge() method, and growOlder() method. In many\
    \ ways, this is similar to the module pattern, where the constructor creates a\
    \ local scope and returns the this object. As discussed in Chapter 4, placing\
    \ methods on an object instance is less efficient than doing so on the prototype,\
    \ but this is the only approach possible when you want private, instance-specific\
    \ data.\n\nIf you want private data to be shared across all instances (as if it\
    \ were on the prototype), you can use a hybrid approach that looks like the module\
    \ pattern but uses a constructor:\n\n```\nvar Person = (function() {\n\n    //\
    \ everyone shares the same age\n    var age = 25;\n\n    function InnerPerson(name)\
    \ {\n        this.name = name;\n    }\n\n    InnerPerson.prototype.getAge = function()\
    \ {\n        return age;\n    };\n\n    InnerPerson.prototype.growOlder = function()\
    \ {\n        age++;\n    };\n\n    return InnerPerson;\n\n})();\n```"
