- pgno: 24
  md: 'Here, color1 is assigned the value of "red". The variable color2 is then assigned
    the value color1, which stores "red" in color2. Even though color1 and color2
    contain the same value, they are completely separate from each other, and you
    can change the value in color1 without affecting color2 and vice versa. That''s
    because there are two different storage locations, one for each variable. Figure
    1-1 illustrates the variable object for this snippet of code.


    ![](img/dcf53336af93733d4dab8829d31ceb8e_24_0.png)


    Figure 1-1: Variable object


    Because each variable containing a primitive value uses its own storage space,
    changes to one variable are not reflected on the other. For example:


    ```

    var color1 = "red";

    var color2 = color1;


    console.log(color1);    // "red"

    console.log(color2);    // "red"


    color1 = "blue";


    console.log(color1);    // "blue"

    console.log(color2);    // "red"

    ```


    In this code, color1 is changed to "blue" and color2 retains its original value
    of "red".


    # Identifying Primitive Types


    The best way to identify primitive types is with the typeof operator, which works
    on any variable and returns a string indicating the type of data. The typeof operator
    works well with strings, numbers, Booleans, and undefined. The following shows
    the output when using typeof on different primitive values:


    ```

    console.log(typeof "Nicholas");    // "string"

    console.log(typeof 10);             // "number"

    console.log(typeof 5.1);            // "number"

    console.log(typeof true);           // "boolean"

    console.log(typeof undefined);      // "undefined"

    ```'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'As you might expect, typeof returns "string" when the value is a string; "number"
    when the value is a number (regardless of integer or floating-point values); "boolean"
    when the value is a Boolean; and "undefined" when the value is undefined.


    The tricky part involves null.


    ```

    console.log(typeof null); // "object"

    ```


    When you run typeof null, the result is "object". But why an object when the type
    is null? (In fact, this has been acknowledged as an error by TC39, the committee
    that designs and maintains JavaScript. You could reason that null is an empty
    object pointer, making "object" a logical return value, but that’s still confusing.)


    The best way to determine if a value is null is to compare it against null directly,
    like this:


    ```

    console.log(value === null); // true or false

    ```


    # **COMPARING WITHOUT COERCION**


    Notice that this code uses the triple equals operator (===) instead of the double
    equals operator. The reason is that triple equals does the comparison without
    coercing the variable to another type. To understand why this is important, consider
    the following:


    ```

    console.log("5" == 5); // true

    console.log("5" === 5); // false

    console.log(undefined == null); // true

    console.log(undefined === null); // false

    ```


    When you use the double equals, the string "5" and the number 5 are considered
    equal because the double equals converts the string into a number before it makes
    the comparison. The triple equals operator doesn’t consider these values equal
    because they are two different types. Likewise, when you compare undefined and
    null, the double equals says that they are equivalent, while the triple equals
    says they are not. When you’re trying to identify null, use triple equals so that
    you can correctly identify the type.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# Primitive Methods


    Despite the fact that they’re primitive types, strings, numbers, and Booleans
    actually have methods. (The null and undefined types have no methods.) Strings,
    in particular, have numerous methods to help you work with them. For example:


    ```

    var name = "Nicholas";

    var lowercaseName = name.toLowerCase();      // convert to lowercase

    var firstLetter = name.charAt(0);             // get first character

    var middleOfName = name.substring(2, 5);      // get characters 2-4


    var count = 10;

    var fixedCount = count.toFixed(2);            // convert to "10.00"

    var hexCount = count.toString(16);            // convert to "a"


    var flag = true;

    var stringFlag = flag.toString();             // convert to "true"

    ```


    > NOTE Despite the fact that they have methods, primitive values themselves are
    not objects. JavaScript makes them look like objects to provide a consistent experience
    in the language, as you’ll see later in this chapter.


    # Reference Types


    Reference types represent objects in JavaScript and are the closest things to
    classes that you will find in the language. Reference values are instances of
    reference types and are synonymous with objects (the rest of this chapter refers
    to reference values simply as objects). An object is an unordered list of properties
    consisting of a name (always a string) and a value. When the value of a property
    is a function, it is called a method. Functions themselves are actually reference
    values in JavaScript, so there’s little difference between a property that contains
    an array and one that contains a function except that a function can be executed.


    Of course, you must create objects before you can begin working with them.


    # Creating Objects


    It sometimes helps to think of JavaScript objects as nothing more than hash tables,
    as shown in Figure 1-2.


    There are a couple of ways to create, or instantiate, objects. The first is to
    use the new operator with a constructor. (A constructor is simply a function that
    uses new to create an object—any function can be


    ![](img/dcf53336af93733d4dab8829d31ceb8e_26_0.png)


    Figure 1-2: Structure of an object'
  merge: -1
  img_proc: true
- pgno: 27
  md: 'a constructor.) By convention, constructors in JavaScript begin with a capital
    letter to distinguish them from nonconstructor functions. For example, this code
    instantiates a generic object and stores a reference to it in object:


    ```

    var object = new Object();

    ```


    Reference types do not store the object directly into the variable to which it
    is assigned, so the object variable in this example doesn’t actually contain the
    object instance. Instead, it holds a pointer (or reference) to the location in
    memory where the object exists. This is the primary difference between objects
    and primitive values, as the primitive is stored directly in the variable.


    When you assign an object to a variable, you’re actually assigning a pointer.
    That means if you assign one variable to another, each variable gets a copy of
    the pointer, and both still reference the same object in memory. For example:


    ```

    var object1 = new Object();

    var object2 = object1;

    ```


    This code first creates an object (with new) and stores a reference in object1.
    Next, object2 is assigned the value of object1. There is still only the one instance
    of the object that was created on the first line, but both variables now point
    to that object, as illustrated in Figure 1-3.


    ![](img/dcf53336af93733d4dab8829d31ceb8e_27_0.png)


    Figure 1-3: Two variables pointing to one object


    # Dereferencing Objects


    JavaScript is a garbage-collected language, so you don’t really need to worry
    about memory allocations when you use reference types. However, it’s best to dereference
    objects that you no longer need so that the garbage collector can free up that
    memory. The best way to do this is to set the object variable to null.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '```

    var object1 = new Object();


    // do something


    object1 = null;    // dereference

    ```


    Here, object1 is created and used before finally being set to null. When there
    are no more references to an object in memory, the garbage collector can use that
    memory for something else. (Dereferencing objects is especially important in very
    large applications that use millions of objects.)


    # Adding or Removing Properties


    Another interesting aspect of objects in JavaScript is that you can add and remove
    properties at any time. For example:


    ```

    var object1 = new Object();

    var object2 = object1;


    object1.myCustomProperty = "Awesome!";

    console.log(object2.myCustomProperty);    // "Awesome!"

    ```


    Here, myCustomProperty is added to object1 with a value of "Awesome!". That property
    is also accessible on object2 because both object1 and object2 point to the same
    object.


    > NOTE This example demonstrates one particularly unique aspect of JavaScript:
    You can modify objects whenever you want, even if you didn''t define them in the
    first place. And there are ways to prevent such modifications, as you''ll learn
    later in this book.


    In addition to generic object reference types, JavaScript has several other built-in
    types that are at your disposal.


    # Instantiating Built-in Types


    You''ve seen how to create and interact with generic objects created with new
    Object(). The Object type is just one of a handful of built-in reference types
    that JavaScript provides. The other built-in types are more specialized in their
    intended usage and can be instantiated at any time.


    The built-in types are:


    +   - **Array**    An ordered list of numerically indexed values

    +   - **Date**    A date and time'
  merge: -1
  img_proc: true
- pgno: 29
  md: "Error    A runtime error (there are also several more specific error subtypes)\n\
    Function    A function\nObject    A generic object\nRegExp    A regular expression\n\
    \nYou can instantiate each built-in reference type using new, as shown here:\n\
    \n```\nvar items = new Array();\nvar now = new Date();\nvar error = new Error(\"\
    Something bad happened.\");\nvar func = new Function(\"console.log('Hi');\");\n\
    var object = new Object();\nvar re = new RegExp(\"\\\\d+\");\n```\n\n# Literal\
    \ Forms\n\nSeveral built-in reference types have literal forms. A literal is syntax\
    \ that allows you to define a reference value without explicitly creating an object,\
    \ using the new operator and the object's constructor. (Earlier in this chapter,\
    \ you saw examples of primitive literals including string literals, numeric literals,\
    \ Boolean literals, the null literal, and the undefined literal.)\n\n# Object\
    \ and Array Literals\n\nTo create an object with object literal syntax, you can\
    \ define the properties of a new object inside braces. Properties are made up\
    \ of an identifier or string, a colon, and a value, with multiple properties separated\
    \ by commas. For example:\n\n```\nvar book = {\n  name: \"The Principles of Object-Oriented\
    \ JavaScript\",\n  year: 2014\n};\n```\n\nYou can also use string literals as\
    \ property names, which is useful when you want a property name to have spaces\
    \ or other special characters:\n\n```\nvar book = {\n  \"name\": \"The Principles\
    \ of Object-Oriented JavaScript\",\n  \"year\": 2014\n};\n```"
