  md: "```\n① Person.prototype.favorites = [];\n\nvar person1 = new Person(\"Nicholas\"\
    );\nvar person2 = new Person(\"Greg\");\n\nperson1.favorites.push(\"pizza\");\n\
    person2.favorites.push(\"quinoa\");\n\nconsole.log(person1.favorites);    // \"\
    pizza,quinoa\"\nconsole.log(person2.favorites);    // \"pizza,quinoa\"\n```\n\n\
    The favorites property ① is defined on the prototype, which means person1.favorites\
    \ and person2.favorites point to the same array. Any values you add to either\
    \ person's favorites will be elements in that array on the prototype. That may\
    \ not be the behavior that you actually want, so it's important to be very careful\
    \ about what you define on the prototype.\n\nEven though you can add properties\
    \ to the prototype one by one, many developers use a more succinct pattern that\
    \ involves replacing the prototype with an object literal:\n\n```\nfunction Person(name)\
    \ {\n    this.name = name;\n}\n\nPerson.prototype = {\n    ① sayName: function()\
    \ {\n        console.log(this.name);\n    },\n\n    ② toString: function() {\n\
    \        return \"[Person \" + this.name + \"]\";\n    }\n};\n```\n\nThis code\
    \ defines two methods on the prototype, sayName() ① and toString() ②. This pattern\
    \ has become quite popular because it eliminates the need to type Person.prototype\
    \ multiple times. There is, however, one side effect to be aware of:\n\n```\n\
    var person1 = new Person(\"Nicholas\");\n\nconsole.log(person1 instanceof Person);\
    \      // true\nconsole.log(person1.constructor === Person);  // false\n① console.log(person1.constructor\
    \ === Object);  // true\n```"
