- pgno: 38
  md: "expressions, which were thus incorrectly identified as functions. All browsers\
    \ now behave the same, so typeof no longer identifies regular expressions as functions.\n\
    \nThis chapter discusses the various ways that functions are defined and executed\
    \ in JavaScript. Because functions are objects, they behave differently than functions\
    \ in other languages, and this behavior is central to a good understanding of\
    \ JavaScript.\n\n# Declarations vs. Expressions\n\nThere are actually two literal\
    \ forms of functions. The first is a function declaration, which begins with the\
    \ function keyword and includes the name of the function immediately following\
    \ it. The contents of the function are enclosed in braces, as shown in this declaration:\n\
    \n```\nfunction add(num1, num2) {\n    return num1 + num2;\n}\n```\n\nThe second\
    \ form is a function expression, which doesn’t require a name after function.\
    \ These functions are considered anonymous because the function object itself\
    \ has no name. Instead, function expressions are typically referenced via a variable\
    \ or property, as in this expression:\n\n```\nvar add = function(num1, num2) {\n\
    \    return num1 + num2;\n};\n```\n\nThis code actually assigns a function value\
    \ to the variable add. The function expression is almost identical to the function\
    \ declaration except for the missing name and the semicolon at the end. Assignment\
    \ expressions typically end with a semicolon, just as if you were assigning any\
    \ other value.\n\nAlthough these two forms are quite similar, they differ in a\
    \ very important way. Function declarations are hoisted to the top of the context\
    \ (either the function in which the declaration occurs or the global scope) when\
    \ the code is executed. That means you can actually define a function after it\
    \ is used in code without generating an error. For example:\n\n```\nvar result\
    \ = add(5, 5);\n\nfunction add(num1, num2) {\n    return num1 + num2;\n}\n```"
  merge: -1
  img_proc: true
- pgno: 39
  md: "This code might look like it will cause an error, but it works just fine. That's\
    \ because the JavaScript engine hoists the function declaration to the top and\
    \ actually executes the code as if it were written like this:\n\n```\n// how the\
    \ JavaScript engine interprets the code\nfunction add(num1, num2) {\n    return\
    \ num1 + num2;\n}\n\nvar result = add(5, 5);\n```\n\nFunction hoisting happens\
    \ only for function declarations because the function name is known ahead of time.\
    \ Function expressions, on the other hand, cannot be hoisted because the functions\
    \ can be referenced only through a variable. So this code causes an error:\n\n\
    ```\n// error!\nvar result = add(5, 5);\n\nvar add = function(num1, num2) {\n\
    \    return num1 + num2;\n};\n```\n\nAs long as you always define functions before\
    \ using them, you can use either function declarations or function expressions.\n\
    \n# Functions as Values\n\nBecause JavaScript has first-class functions, you can\
    \ use them just as you do any other objects. You can assign them to variables,\
    \ add them to objects, pass them to other functions as arguments, and return them\
    \ from functions. Basically, you can use a function anywhere you would use any\
    \ other reference value. This makes JavaScript functions incredibly powerful.\
    \ Consider the following example:\n\n```\n① function sayHi() {\n    console.log(\"\
    Hi!\");\n}\n\nsayHi();      // outputs \"Hi!\"\n\n② var sayHi2 = sayHi;\n\nsayHi2();\
    \     // outputs \"Hi!\"\n```"
  merge: -1
  img_proc: true
- pgno: 40
  md: "In this code, there is a function declaration for sayHi ①. A variable named\
    \ sayHi2 is then created and assigned the value of sayHi ②. Both sayHi and sayHi2\
    \ are now pointing to the same function, and that means either can be executed,\
    \ with the same result. To understand why this happens, take a look at the same\
    \ code rewritten to use the Function constructor:\n\n```\nvar sayHi = new Function(\"\
    console.log(\\\"Hi!\\\");\");\n\nsayHi();  // outputs \"Hi!\"\n\nvar sayHi2 =\
    \ sayHi;\n\nsayHi2();  // outputs \"Hi!\"\n```\n\nThe Function constructor makes\
    \ it more explicit that sayHi can be passed around just like any other object.\
    \ When you keep in mind that functions are objects, a lot of the behavior starts\
    \ to make sense.\n\nFor instance, you can pass a function into another function\
    \ as an argument. The sort() method on JavaScript arrays accepts a comparison\
    \ function as an optional parameter. The comparison function is called whenever\
    \ two values in the array must be compared. The first value is smaller than the\
    \ second, the comparison function must return a negative number. If the first\
    \ value is larger than the second, the function must return a positive number.\
    \ If the two values are equal, the function should return zero.\n\n```\nvar numbers\
    \ = [ 1, 5, 8, 4, 7, 10, 2, 6 ];\n\nnumbers.sort(function(first, second) {\n \
    \ return first - second;\n});\n\nconsole.log(numbers);  // \"[1, 2, 4, 5, 6, 7,\
    \ 8, 10]\"\n```\n\n```\nnumbers.sort();\n\nconsole.log(numbers);  // \"[1, 10,\
    \ 2, 4, 5, 6, 7, 8]\"\n```\n\nIn this example, the comparison function ① that\
    \ is passed into sort() is actually a function expression. Note that there is\
    \ no name for the function; it exists only as a reference that is passed into\
    \ another function (making it an anonymous function). Subtracting the two values\
    \ returns the correct result from the comparison function."
  merge: -1
