- pgno: 82
  md: "> In practice, you probably won't use prototypes this way very often when developing\
    \ in JavaScript. However, it's important to understand the relationships that\
    \ exist between objects and their prototype, and strange examples like this help\
    \ to illuminate the concepts.\n\n# Built-in Object Prototypes\n\nAt this point,\
    \ you might wonder if prototypes also allow you to modify the built-in objects\
    \ that come standard in the JavaScript engine. The answer is yes. All built-in\
    \ objects have constructors, and therefore, they have prototypes that you can\
    \ change. For instance, adding a new method for use on all arrays is as simple\
    \ as modifying Array.prototype.\n\n```\nArray.prototype.sum = function() {\n \
    \ return this.reduce(function(previous, current) {\n    return previous + current;\n\
    \  });\n};\n\nvar numbers = [ 1, 2, 3, 4, 5, 6 ];\nvar result = numbers.sum();\n\
    \nconsole.log(result);  // 21\n```\n\nThis example creates a method called sum()\
    \ on Array.prototype that simply adds up all the items in the array and returns\
    \ the result. The numbers array automatically has access to that method through\
    \ the prototype. Inside of sum(), this refers to numbers, which is an instance\
    \ of Array, so the method is free to use other array methods such as reduce().\
    \ You may recall that strings, numbers, and Booleans all have built-in primitive\
    \ wrapper types that are used to access primitive values as if they were objects.\
    \ If you modify the primitive wrapper type prototype as in this example, you can\
    \ actually add more functionality to those primitive values:\n\n```\nString.prototype.capitalize\
    \ = function() {\n  return this.charAt(0).toUpperCase() + this.substring(1);\n\
    };\n\nvar message = \"hello world!\";\n\nconsole.log(message.capitalize());  //\
    \ \"Hello world!\"\n```\n\nThis code creates a new method called capitalize()\
    \ for strings. The String type is the primitive wrapper for strings, and modifying\
    \ its prototype means that all strings automatically get those changes."
