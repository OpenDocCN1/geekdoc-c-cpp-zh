  md: '# About the Author


    Nicholas C. Zakas is a software engineer at Box and is known for writing on and
    speaking about the latest in JavaScript best practices. He honed his experience
    during his five years at Yahoo!, where he was principal frontend engineer for
    the Yahoo! home page. He is the author of several books, including *Maintainable
    JavaScript* (O''Reilly Media, 2012) and *Professional JavaScript for Web Developers*
    (Wrox, 2012).


    # About the Technical Reviewer


    Originally from the UK, Angus Croll is now part of Twitter’s web framework team
    in San Francisco and is the co-author and principal maintainer of Twitter’s open
    source Flight framework. He’s obsessed with JavaScript and literature in equal
    measure and is a passionate advocate for the greater involvement of artists and
    creative thinkers in software development. Angus is a frequent speaker at conferences
    worldwide and is currently working on two books for No Starch Press. He can be
    reached on Twitter at @angustweets.'
