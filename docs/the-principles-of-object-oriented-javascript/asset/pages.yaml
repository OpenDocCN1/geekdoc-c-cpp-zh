    \ {\n\tconstructor: {\n\t\tconfigurable: true,\n\t\tenumerable: true,\n\t\tvalue:\
    \ Square,\n\t\twritable: true\n\t}\n});\n\nSquare.prototype.toString = function()\
    \ {\n\treturn \"[Square \" + this.length + \"x\" + this.width + \"]\";\n};\n```\n\
    ```\n\nIn this version of the code, Square.prototype is overwritten with a new\
    \ object that inherits from Rectangle.prototype, and the Rectangle constructor\
    \ is never called. That means you don't need to worry about causing an error by\
    \ calling the constructor without arguments anymore. Otherwise, this code behaves\
    \ exactly the same as the previous code. The prototype chain remains intact, so\
    \ all instances of Square inherit from Rectangle.prototype and the constructor\
    \ is restored in the same step.\n\n**NOTE** Always make sure that you overwrite\
    \ the prototype before adding properties to it, or you will lose the added methods\
    \ when the overwrite happens.\n\n# Constructor Stealing\n\nBecause inheritance\
    \ is accomplished through prototype chains in JavaScript, you don't need to call\
    \ an object's supertype constructor. If you do want to call the supertype constructor\
    \ from the subtype constructor, then you need to take advantage of how JavaScript\
    \ functions work. \n\nIn Chapter 2, you learned about the call() and apply() methods,\
    \ which allow functions to be called with a different this value. That's exactly\
    \ how constructor stealing works. You simply call the supertype constructor from\
    \ the subtype constructor using either call() or apply() to pass in the newly\
    \ created object. In effect, you're stealing the supertype constructor for your\
    \ own object, as in this example:\n\n```\n```js\nfunction Rectangle(length, width)\
    \ {\n\tthis.length = length;\n\tthis.width = width;\n}\n```\n```"
