- pgno: 30
  md: "This example is equivalent to the previous one despite the syntactic differences.\
    \ Both examples are also logically equivalent to the following:\n\n```\nvar book\
    \ = new Object();\nbook.name = \"The Principles of Object-Oriented JavaScript\"\
    ;\nbook.year = 2014;\n```\n\nThe outcome of each of the previous three examples\
    \ is the same: an object with two properties. The choice of pattern is up to you\
    \ because the functionality is ultimately the same.\n\n> NOTE Using an object\
    \ literal doesn’t actually call new Object(). Instead, the JavaScript engine follows\
    \ the same steps it does when using new Object() without actually calling the\
    \ constructor. This is true for all reference literals.\n\nYou can define an array\
    \ literal in a similar way by enclosing any number of comma-separated values inside\
    \ square brackets. For example:\n\n```\nvar colors = [ \"red\", \"blue\", \"green\"\
    \ ];\nconsole.log(colors[0]);      // \"red\"\n```\n\nThis code is equivalent\
    \ to the following:\n\n```\nvar colors = new Array(\"red\", \"blue\", \"green\"\
    )\nconsole.log(colors[0]);      // \"red\"\n```\n\n# Function Literals\n\nYou\
    \ almost always define functions using their literal form. In fact, using the\
    \ Function constructor is typically discouraged given the challenges of maintaining,\
    \ reading, and debugging a string of code rather than actual code, so you’ll rarely\
    \ see it in code.\n\nCreating functions is much easier and less error prone when\
    \ you use the literal form. For example:\n\n```\nfunction reflect(value) {\n \
    \   return value;\n}\n\n// is the same as\n\nvar reflect = new Function(\"value\"\
    , \"return value;\");\n```\n\nThis code defines the reflect() function, which\
