- pgno: 105
  md: "of that property to a property of the same name on receiver. Keep in mind that\
    \ this is a shallow copy, so if a property contains an object, then both the supplier\
    \ and the receiver will be pointing to the same object. This pattern is used frequently\
    \ for adding new behaviors to JavaScript objects that already exist on other objects.\n\
    \nFor example, you can add event support to an object through a mixin rather than\
    \ inheritance. First, suppose you've already defined a custom type for using events:\n\
    \n```\nfunction EventTarget(){\n}\n\nEventTarget.prototype = {\n\n    constructor:\
    \ EventTarget,\n\n    addListener: function(type, listener){\n        // create\
    \ an array if it doesn't exist\n        if (!this.hasOwnProperty(\"_listeners\"\
    )) {\n            this._listeners = [];\n        }\n\n        if (typeof this._listeners[type]\
    \ == \"undefined\"){\n            this._listeners[type] = [];\n        }\n\n \
    \       this._listeners[type].push(listener);\n    },\n\n    fire: function(event){\n\
    \        if (!event.target){\n            event.target = this;\n        }\n\n\
    \        if (!event.type){ // falsy\n            throw new Error(\"Event object\
    \ missing 'type' property.\");\n        }\n\n        if (this._listeners && this._listeners[event.type]\
    \ instanceof Array){\n            var listeners = this._listeners[event.type];\n\
    \            for (var i=0, len=listeners.length; i < len; i++){\n            \
    \    listeners[i].call(this, event);\n            }\n        }\n    },\n```"
