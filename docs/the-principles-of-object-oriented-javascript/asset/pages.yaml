- pgno: 74
  md: "# IDENTIFYING A PROTOTYPE PROPERTY\n\nYou can determine whether a property\
    \ is on the prototype by using a function such as:\n\n```\nfunction hasPrototypeProperty(object,\
    \ name) {\n  return name in object && !object.hasOwnProperty(name);\n}\n```\n\n\
    ```\nconsole.log(hasPrototypeProperty(book, \"title\")); // false\nconsole.log(hasPrototypeProperty(book,\
    \ \"hasOwnProperty\")); // true\n```\n\nIf the property is in an object but hasOwnProperty()\
    \ returns false, then the property is on the prototype.\n\n# The [[Prototype]]\
    \ Property\n\nAn instance keeps track of its prototype through an internal property\
    \ called [[Prototype]]. This property is a pointer back to the prototype object\
    \ that the instance is using. When you create a new object using new, the constructor's\
    \ prototype property is assigned to the [[Prototype]] property of that new object.\
    \ Figure 4-1 shows how the [[Prototype]] property lets multiple instances of an\
    \ object type refer to the same prototype, which can reduce code duplication.\n\
    \n![](img/dcf53336af93733d4dab8829d31ceb8e_74_0.png)\n\n> Figure 4-1: The [[Prototype]]\
    \ properties for person1 and person2 point to the same prototype."
