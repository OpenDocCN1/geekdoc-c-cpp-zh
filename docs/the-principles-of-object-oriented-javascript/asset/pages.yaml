  md: '# 2


    # FUNCTIONS


    ![](img/dcf53336af93733d4dab8829d31ceb8e_37_0.png)


    As discussed in Chapter 1, functions are actually objects in JavaScript. The defining
    characteristic of a function—what distinguishes it from any other object—is the
    presence of an *internal property* named [[Call]]. Internal properties are not
    accessible via code but rather define the behavior of code as it executes. ECMAScript
    defines multiple internal properties for objects in JavaScript, and these internal
    properties are indicated by double-square-bracket notation.


    The [[Call]] property is unique to functions and indicates that the object can
    be executed. Because only functions have this property, the typeof operator is
    defined by ECMAScript to return "function" for any object with a [[Call]] property.
    That led to some confusion in the past, because some browsers also included a
    [[Call]] property for regular'
  merge: -1
