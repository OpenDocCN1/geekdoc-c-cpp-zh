  md: "# Using Prototypes with Constructors\n\nThe shared nature of prototypes makes\
    \ them ideal for defining methods once for all objects of a given type. Because\
    \ methods tend to do the same thing for all instances, there’s no reason each\
    \ instance needs its own set of methods.\n\nIt’s much more efficient to put the\
    \ methods on the prototype and then use this to access the current instance. For\
    \ example, consider the following new Person constructor:\n\n```\nfunction Person(name)\
    \ {\n    this.name = name;\n}\n\n① Person.prototype.sayName = function() {\n \
    \   console.log(this.name);\n};\n\nvar person1 = new Person(\"Nicholas\");\nvar\
    \ person2 = new Person(\"Greg\");\n\nconsole.log(person1.name);        // \"Nicholas\"\
    \nconsole.log(person2.name);        // \"Greg\"\n\nperson1.sayName();        \
    \        // outputs \"Nicholas\"\nperson2.sayName();                // outputs\
    \ \"Greg\"\n```\n\nIn this version of the Person constructor, sayName() is defined\
    \ on the prototype ① instead of in the constructor. The object instances work\
    \ exactly the same as the example from earlier in this chapter, even though sayName()\
    \ is now a prototype property instead of an own property. Because person1 and\
    \ person2 are each base references for their calls to sayName(), the this value\
    \ is assigned to person1 and person2, respectively.\n\nYou can also store other\
    \ types of data on the prototype, but be careful when using reference values.\
    \ Because these values are shared across instances, you might not expect one instance\
    \ to be able to change values that another instance will access. This example\
    \ shows what can happen when you don’t watch where your reference values are pointing:\n\
    \n```\nfunction Person(name) {\n    this.name = name;\n}\n\nPerson.prototype.sayName\
    \ = function() {\n    console.log(this.name);\n};\n```"
