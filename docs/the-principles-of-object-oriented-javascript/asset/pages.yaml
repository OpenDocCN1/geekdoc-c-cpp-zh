- pgno: 21
  md: '# 1


    # PRIMITIVE AND

    REFERENCE TYPES


    ![](img/dcf53336af93733d4dab8829d31ceb8e_21_0.png)


    Most developers learn object-oriented programming by working with class-based
    languages such as Java or C#. When these developers start learning JavaScript,
    they get disoriented because JavaScript has no formal support for classes. Instead
    of defining classes from the beginning, with JavaScript you can just write code
    and create data structures as you need them. Because it lacks classes, JavaScript
    also lacks class groupings such as packages. Whereas in languages like Java, package
    and class names define both the types of objects you use and the layout of files
    and folders in your project, programming in JavaScript is like starting with a
    blank slate: You can'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'organize things any way you want. Some developers choose to mimic structures
    from other languages, while others take advantage of JavaScript’s flexibility
    to come up with something completely new. To the uninitiated, this freedom of
    choice can be overwhelming, but once you get used to it, you’ll find JavaScript
    to be an incredibly flexible language that can adapt to your preferences quite
    easily.


    To ease the transition from traditional object-oriented languages, JavaScript
    makes objects the central part of the language. Almost all data in JavaScript
    is either an object or accessed through objects. In fact, even functions (which
    languages traditionally make you jump through hoops to get references to) are
    represented as objects in JavaScript, which makes them first-class functions.


    Working with and understanding objects is key to understanding JavaScript as a
    whole. You can create objects at any time and add or remove properties from them
    whenever you want. In addition, JavaScript objects are extremely flexible and
    have capabilities that create unique and interesting patterns that are simply
    not possible in other languages.


    This chapter focuses on how to identify and work with the two primary JavaScript
    data types: primitive types and reference types. Though both are accessed through
    objects, they behave in different ways that are important to understand.


    # What Are Types?


    Although JavaScript has no concept of classes, it still uses two kinds of types:
    primitive and reference. Primitive types are stored as simple data types. Reference
    types are stored as objects, which are really just references to locations in
    memory.


    The tricky thing is that JavaScript lets you treat primitive types like reference
    types in order to make the language more consistent for the developer.


    While other programming languages distinguish between primitive and reference
    types by storing primitives on the stack and references in the heap, JavaScript
    does away with this concept completely: It tracks variables for a particular scope
    with a variable object. Primitive values are stored directly on the variable object,
    while reference values are placed as a pointer in the variable object, which serves
    as a reference to a location in memory where the object is stored. However, as
    you’ll see later in this chapter, primitive values and reference values behave
    quite differently although they may initially seem the same.


    Of course, there are other differences between primitive and reference types.'
  merge: -1
  img_proc: true
