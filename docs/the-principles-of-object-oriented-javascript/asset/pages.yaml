  md: "```\n```js\nvar person1 = new Person(\"Nicholas\");\nvar person2 = new Person(\"\
    Greg\");\nconsole.log(person1.name); // \"Nicholas\"\nconsole.log(person1.getAge());\
    \ // 25\nconsole.log(person2.name); // \"Greg\"\nconsole.log(person2.getAge());\
    \ // 25\nperson1.growOlder();\nconsole.log(person1); // Person { name: 'Nicholas',\
    \ age: 26 }\nconsole.log(person1.getAge()); // 26\nconsole.log(person2.getAge());\
    \ // 26\n```\n```\n\nIn this code, the InnerPerson constructor ② is defined inside\
    \ an IIFE. The variable age ① is defined outside the constructor but is used for\
    \ two prototype methods. The InnerPerson constructor is then returned and becomes\
    \ the Person constructor in the global scope. All instances of Person end up sharing\
    \ the age variable, so changing the value with one instance automatically affects\
    \ the other instance.\n\n# # Mixins\n\nAlthough pseudoclassical inheritance and\
    \ prototypal inheritance are used frequently in JavaScript, there is also a type\
    \ of pseudoinheritance accomplished through mixins. Mixins occur when one object\
    \ acquires the properties of another object without modifying the prototype chain.\
    \ The first object (a receiver) actually receives the properties of the second\
    \ object (the supplier) by copying those properties directly. Traditionally, you\
    \ create mixins using a function such as this:\n\n```\n```js\nfunction mixin(receiver,\
    \ supplier) {\n  for (var property in supplier) {\n    if (supplier.hasOwnProperty(property))\
    \ {\n      receiver[property] = supplier[property]\n    }\n  }\n  return receiver;\n\
    }\n```\n```\n\nThe mixin() function accepts two arguments: the receiver and the\
    \ supplier. The goal of the function is to copy all enumerable properties from\
    \ the supplier onto the receiver. You accomplish this using a for-in loop that\
    \ iterates over the properties in supplier and then assigns the value"
  merge: -1
