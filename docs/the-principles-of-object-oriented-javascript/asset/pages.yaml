- pgno: 90
  md: "The Object.create() method accepts two arguments. The first argument is the\
    \ object to use for [[Prototype]] in the new object. The optional second argument\
    \ is an object of property descriptors in the same format used by Object.defineProperties()\
    \ (see Chapter 3). Consider the following:\n\n```\nvar book = {\n  title: \"The\
    \ Principles of Object-Oriented JavaScript\"\n};\n\n// is the same as\n\nvar book\
    \ = Object.create(Object.prototype, {\n  title: {\n    configurable: true,\n \
    \   enumerable: true,\n    value: \"The Principles of Object-Oriented JavaScript\"\
    ,\n    writable: true\n  }\n});\n\n```\n\nThe two declarations in this code are\
    \ effectively the same. The first declaration uses an object literal to define\
    \ an object with a single property called title. That object automatically inherits\
    \ from Object.prototype, and the property is set to be configurable, enumerable,\
    \ and writable by default. The second declaration takes the same steps but does\
    \ so explicitly using Object.create(). The resulting book object from each declaration\
    \ behaves the exact same way. But you'll probably never write code that inherits\
    \ from Object.prototype directly, because you get that by default. Inheriting\
    \ from other objects is much more interesting:\n\n```\nvar person1 = {\n  name:\
    \ \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n  }\n};\n\
    \nvar person2 = Object.create(person1, {\n  name: {\n    configurable: true,\n\
    \    enumerable: true,\n    value: \"Greg\",\n    writable: true\n  }\n});\n\n\
    person1.sayName(); // outputs \"Nicholas\"\nperson2.sayName(); // outputs \"Greg\"\
    \n```"
