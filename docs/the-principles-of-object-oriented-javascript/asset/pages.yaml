- pgno: 43
  md: "# Overloading\n\nMost object-oriented languages support *function overloading*,\
    \ which is the ability of a single function to have multiple *signatures*. A function\
    \ signature is made up of the function name plus the number and type of parameters\
    \ the function expects. Thus, a single function can have one signature that accepts\
    \ a single string argument and another that accepts two numeric arguments. The\
    \ language determines which version of a function to call based on the arguments\
    \ that are passed in.\n\nAs mentioned previously, JavaScript functions can accept\
    \ any number of parameters, and the types of parameters a function takes aren’t\
    \ specified at all. That means JavaScript functions don’t actually have signatures.\
    \ A lack of function signatures also means a lack of function overloading. Look\
    \ at what happens when you try to declare two functions with the same name:\n\n\
    ```\nfunction sayMessage(message) {\n    console.log(message);\n}\n\nfunction\
    \ sayMessage() {\n    console.log(\"Default message\");\n}\n\nsayMessage(\"Hello!\"\
    );    // outputs \"Default message\"\n```\n\nIf this were another language, the\
    \ output of sayMessage(\"Hello!\") would likely be \"Hello!\". In JavaScript,\
    \ however, when you define multiple functions with the same name, the one that\
    \ appears last in your code wins. The earlier function declarations are completely\
    \ removed, and the last is the one that is used. Once again, it helps to think\
    \ about this situation using objects:\n\n```\nvar sayMessage = new Function(\"\
    message\", \"console.log(message);\");\n\nsayMessage = new Function(\"console.log(\\\
    \"Default message\\\");\");\n\nsayMessage(\"Hello!\");    // outputs \"Default\
    \ message\"\n```\n\nLooking at the code this way makes it clear why the previous\
    \ code didn’t work. A function object is being assigned to sayMessage twice in\
    \ a row, so it makes sense that the first function object would be lost."
  merge: -1
  img_proc: true
- pgno: 44
  md: "The fact that functions don’t have signatures in JavaScript doesn’t mean you\
    \ can’t mimic function overloading. You can retrieve the number of parameters\
    \ that were passed in by using the arguments object, and you can use that information\
    \ to determine what to do. For example:\n\n```\nfunction sayMessage(message) {\n\
    \    if (arguments.length === 0) {\n        message = \"Default message\";\n \
    \   }\n    console.log(message);\n}\n\nsayMessage(\"Hello!\");      // outputs\
    \ \"Hello!\"\n```\n\nIn this example, the sayMessage() function behaves differently\
    \ based on the number of parameters that were passed in. If no parameters are\
    \ passed in (arguments.length === 0), then a default message is used. Otherwise,\
    \ the first parameter is used as the message. This is a little more involved than\
    \ function overloading in other languages, but the end result is the same. If\
    \ you really want to check for different data types, you can use typeof and instanceof.\n\
    \nNOTE In practice, checking the named parameter against undefined is more common\
    \ than relying on arguments.length.\n\n# Object Methods\n\nAs mentioned in Chapter\
    \ 1, you can add and remove properties from objects at any time. When a property\
    \ value is actually a function, the property is considered a method. You can add\
    \ a method to an object in the same way that you would add a property. For example,\
    \ in the following code, the person variable is assigned an object literal with\
    \ a name property and a method called sayName.\n\n```\nvar person = {\n    name:\
    \ \"Nicholas\",\n    sayName: function() {\n        console.log(person.name);\n\
    \    }\n};\n\nperson.sayName();      // outputs \"Nicholas\"\n```\n\nNote that\
    \ the syntax for a data property and a method is exactly the same—an identifier\
    \ followed by a colon and the value. In the case of sayName, the value just happens\
    \ to be a function. You can then call the method directly from the object as in\
    \ person.sayName(\"Nicholas\")."
  merge: -1
  img_proc: true
- pgno: 45
  md: "# The this Object\n\nYou may have noticed something strange in the previous\
    \ example. The sayName() method references person.name directly, which creates\
    \ tight coupling between the method and the object. This is problematic for a\
    \ number of reasons. First, if you change the variable name, you also need to\
    \ remember to change the reference to that name in the method. Second, this sort\
    \ of tight coupling makes it difficult to use the same function for different\
    \ objects. Fortunately, JavaScript has a way around this issue.\n\nEvery scope\
    \ in JavaScript has a this object that represents the calling object for the function.\
    \ In the global scope, this represents the global object (window in web browsers).\
    \ When a function is called while attached to an object, the value of this is\
    \ equal to that object by default. So, instead of directly referencing an object\
    \ inside a method, you can reference this instead. For example, you can rewrite\
    \ the code from the previous example to use this:\n\n```\nvar person = {\n  name:\
    \ \"Nicholas\",\n  sayName: function() {\n    console.log(this.name);\n  }\n};\n\
    \nperson.sayName();      // outputs \"Nicholas\"\n```\n\nThis code works the same\
    \ as the earlier version, but this time, sayName() references this instead of\
    \ person. That means you can easily change the name of the variable or even reuse\
    \ the function on different objects.\n\n```\nfunction sayNameForAll() {\n  console.log(this.name);\n\
    }\n\nvar person1 = {\n  name: \"Nicholas\",\n  sayName: sayNameForAll\n};\n\n\
    var person2 = {\n  name: \"Greg\",\n  sayName: sayNameForAll\n};\n\nvar name =\
    \ \"Michael\";\n\nperson1.sayName();      // outputs \"Nicholas\"\nperson2.sayName();\
    \      // outputs \"Greg\"\n\nsayNameForAll();        // outputs \"Michael\"\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 46
  md: "In this example, a function called sayName is defined first. Then, two object\
    \ literals are created that assign sayName to be equal to the sayNameForAll function.\
    \ Functions are just reference values, so you can assign them as property values\
    \ on any number of objects. When sayName() is called on person1, it outputs \"\
    Nicholas\"; when called on person2, it outputs \"Greg\". That's because this is\
    \ set when the function is called, so this.name is accurate.\n\nThe last part\
    \ of this example defines a global variable called name. When sayNameForAll()\
    \ is called directly, it outputs \"Michael\" because the global variable is considered\
    \ a property of the global object.\n\n# Changing this\n\nThe ability to use and\
    \ manipulate the this value of functions is key to good object-oriented programming\
    \ in JavaScript. Functions can be used in many different contexts, and they need\
    \ to be able to work in each situation. Even though this is typically assigned\
    \ automatically, you can change its value to achieve different goals. There are\
    \ three function methods that allow you to change the value of this. (Remember\
    \ that functions are objects, and objects can have methods, so functions can,\
    \ too.)\n\n# The call() Method\n\nThe first function method for manipulating this\
    \ is call(), which executes the function with a particular this value and with\
    \ specific parameters. The first parameter of call() is the value to which this\
    \ should be equal when the function is executed. All subsequent parameters are\
    \ the parameters that should be passed into the function. For example, suppose\
    \ you update sayNameForAll() to take a parameter:\n\n```\nfunction sayNameForAll(label)\
    \ {\n    console.log(label + \":\" + this.name);\n}\n\nvar person1 = {\n    name:\
    \ \"Nicholas\"\n};\n\nvar person2 = {\n    name: \"Greg\"\n};\n\nvar name = \"\
    Michael\";\n\nsayNameForAll.call(this, \"global\");      // outputs \"global:Michael\"\
    \nsayNameForAll.call(person1, \"person1\");  // outputs \"person1:Nicholas\"\n\
    sayNameForAll.call(person2, \"person2\");  // outputs \"person2:Greg\"\n```"
  merge: -1
  img_proc: true
- pgno: 47
  md: "In this example, sayNameForAll() accepts one parameter that is used as a label\
    \ to the output value. The function is then called three times. Notice that there\
    \ are no parentheses after the function name because it is accessed as an object\
    \ rather than as code to execute. The first function call uses the global this\
    \ and passes in the parameter \"global\" to output \"global:Michael\". The same\
    \ function is called two more times, once each for person1 and person2. Because\
    \ the call() method is being used, you don't need to add the function directly\
    \ onto each object—you explicitly specify the value of this instead of letting\
    \ the JavaScript engine do it automatically.\n\n# The apply() Method\n\nThe second\
    \ function method you can use to manipulate this is apply(). The apply() method\
    \ works exactly the same as call() except that it accepts only two parameters:\
    \ the value for this and an array or array-like object of parameters to pass to\
    \ the function (that means you can use an arguments object as the second parameter).\
    \ So, instead of individually naming each parameter using call(), you can easily\
    \ pass arrays to apply() as the second argument. Otherwise, call() and apply()\
    \ behave identically. This example shows the apply() method in action:\n\n```\n\
    ```javascript\nfunction sayNameForAll(label) {\n  console.log(label + \":\" +\
    \ this.name);\n}\n\nvar person1 = {\n  name: \"Nicholas\"\n};\n\nvar person2 =\
    \ {\n  name: \"Greg\"\n};\n\nvar name = \"Michael\";\n\nsayNameForAll.apply(this,\
    \ [\"global\"]); // outputs \"global:Michael\"\nsayNameForAll.apply(person1, [\"\
    person1\"]); // outputs \"person1:Nicholas\"\nsayNameForAll.apply(person2, [\"\
    person2\"]); // outputs \"person2:Greg\"\n```\n```\n\nThis code takes the previous\
    \ example and replaces call() with apply(); the result is exactly the same. The\
    \ method you use typically depends on the type of data you have. If you already\
    \ have an array of data, use apply(); if you just have individual variables, use\
    \ call()."
  merge: -1
  img_proc: true
- pgno: 48
  md: "# The bind() Method\n\nThe third function method for changing this is bind().\
    \ This method was added in ECMAScript 5, and it behaves quite differently than\
    \ the other two. The first argument to bind() is the this value for the new function.\
    \ All other arguments represent named parameters that should be permanently set\
    \ in the new function. You can still pass in any parameters that aren’t permanently\
    \ set later.\n\nThe following code shows two examples that use bind(). You create\
    \ the sayNameForPerson1() function by binding the this value to person1, while\
    \ sayNameForPerson2() binds this to person2 and binds the first parameter as \"\
    person2\".\n\n```\nfunction sayNameForAll(label) {\n    console.log(label + \"\
    :\" + this.name);\n}\n\nvar person1 = {\n    name: \"Nicholas\"\n};\n\nvar person2\
    \ = {\n    name: \"Greg\"\n};\n\n// create a function just for person1\n① var\
    \ sayNameForPerson1 = sayNameForAll.bind(person1);\nsayNameForPerson1(\"person1\"\
    );      // outputs \"person1:Nicholas\"\n\n// create a function just for person2\n\
    ② var sayNameForPerson2 = sayNameForAll.bind(person2, \"person2\");\nsayNameForPerson2();\
    \                // outputs \"person2:Greg\"\n\n// attaching a method to an object\
    \ doesn't change 'this'\n③ person2.sayName = sayNameForPerson1;\nperson2.sayName(\"\
    person2\");         // outputs \"person2:Nicholas\"\n```\n\nNo parameters are\
    \ bound for sayNameForPerson1() ①, so you still need to pass in the label for\
    \ the output. The function sayNameForPerson2() not only binds this to person2\
    \ but also binds the first parameter as \"person2\" ②. That means you can call\
    \ sayNameForPerson2() without passing in any additional arguments. The last part\
    \ of this example adds sayNameForPerson1() onto person2 with the name sayName\
    \ ③. The function is bound, so the value of this doesn’t change even though sayNameForPerson1\
    \ is now a function on person2. The method still outputs the value of person1.name."
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Summary


    JavaScript functions are unique in that they are also objects, meaning they can
    be accessed, copied, overwritten, and generally treated just like any other object
    value. The biggest difference between a JavaScript function and other objects
    is a special internal property, [[Call]], which contains the execution instructions
    for the function. The typeof operator looks for this internal property on an object,
    and if it finds it, returns "function".


    There are two function literal forms: declarations and expressions. Function declarations
    contain the function name to the right of the function keyword and are hoisted
    to the top of the context in which they are defined. Function expressions are
    used where other values can also be used, such as assignment expressions, function
    parameters, or the return value of another function.


    Because functions are objects, there is a Function constructor. You can create
    new functions with the Function constructor, but this isn’t generally recommended
    because it can make your code harder to understand and debugging much more difficult.
    That said, you will likely run into its usage from time to time in situations
    where the true form of the function isn’t known until runtime.


    You need a good grasp of functions to understand how object-oriented programming
    works in JavaScript. Because JavaScript has no concept of a class, functions and
    other objects are all you have to work with to achieve aggregation and inheritance.'
  merge: -1
  img_proc: true
