- pgno: 87
  md: "# valueOf()\n\nThe valueOf() method gets called whenever an operator is used\
    \ on an object. By default, valueOf() simply returns the object instance. The\
    \ primitive wrapper types override valueOf() so that it returns a string for String,\
    \ a Boolean for Boolean, and a number for Number. Likewise, the Date object’s\
    \ valueOf() method returns the epoch time in milliseconds (just as Date.prototype.getTime()\
    \ does). This is what allows you to write code that compares dates such as:\n\n\
    ```\nvar now = new Date();\nvar earlier = new Date(2010, 1, 1);\n\nconsole.log(now\
    \ > earlier);      // true\n```\n\nIn this example, now is a Date representing\
    \ the current time, and earlier is a fixed date in the past. When the greater-than\
    \ operator (>) is used ①, the valueOf() method is called on both objects before\
    \ the comparison is performed. You can even subtract one date from another and\
    \ get the difference in epoch time because of valueOf().\n\nYou can always define\
    \ your own valueOf() method if your objects are intended to be used with operators.\
    \ If you do define a valueOf() method, keep in mind that you’re not changing how\
    \ the operator works, only what value is used with the operator’s default behavior.\n\
    \n# toString()\n\nThe toString() method is called as a fallback whenever valueOf()\
    \ returns a reference value instead of a primitive value. It is also implicitly\
    \ called on primitive values whenever JavaScript is expecting a string. For example,\
    \ when a string is used as one operand for the plus operator, the other operand\
    \ is automatically converted to a string. If the other operand is a primitive\
    \ value, it is converted into a string representation (for example, true becomes\
    \ \"true\"), but if it is a reference value, then valueOf() is called. If valueOf()\
    \ returns a reference value, toString() is called and the returned value is used.\
    \ For example:\n\n```\nvar book = {\n  title: \"The Principles of Object-Oriented\
    \ JavaScript\"\n};\n\nvar message = \"Book = \" + book;\nconsole.log(message);\
    \      // \"Book = [object Object]\"\n```"
  merge: -1
  img_proc: true
- pgno: 88
  md: "This code constructs the string by combining \"Book = \" with book. Since book\
    \ is an object, its toString() method is called. That method is inherited from\
    \ Object.prototype and returns the default value of \"[object Object]\" in most\
    \ JavaScript engines. If you are happy with that value, there's no need to change\
    \ your object's toString() method. Sometimes, however, it's useful to define your\
    \ own toString() method so that string conversions return a value that gives more\
    \ information. Suppose, for example, that you want the previous script to log\
    \ the book's title:\n\n```\nvar book = {\n    title: \"The Principles of Object-Oriented\
    \ JavaScript\",\n    toString: function() {\n        return \"[Book \" + this.title\
    \ + \"]\"\n    }\n};\n\nvar message = \"Book = \" + book;\n\n// \"Book = [Book\
    \ The Principles of Object-Oriented JavaScript]\"\nconsole.log(message);\n```\n\
    \nThis code defines a custom toString() method for book that returns a more useful\
    \ value ① than the inherited version. You don't usually need to worry about defining\
    \ a custom toString() method, but it's good to know that it's possible to do so\
    \ if necessary.\n\n# Modifying Object.prototype\n\nAll objects inherit from Object.prototype\
    \ by default, so changes to Object.prototype affect all objects. That's a very\
    \ dangerous situation. You were advised in Chapter 4 not to modify built-in object\
    \ prototypes, and that advice goes double for Object.prototype. Take a look at\
    \ what can happen:\n\n```\nObject.prototype.add = function(value) {\n    return\
    \ this + value;\n};\n\nvar book = {\n    title: \"The Principles of Object-Oriented\
    \ JavaScript\"\n};\n\nconsole.log(book.add(5));        // \"[object Object]5\"\
    \nconsole.log(\"title\".add(\"end\"));  // \"titleend\"\n\n// in a web browser\n\
    console.log(document.add(true));  // \"[object HTMLDocument]true\"\nconsole.log(window.add(5));\
    \       // \"[object Window]true\"\n```"
