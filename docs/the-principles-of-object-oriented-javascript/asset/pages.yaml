- pgno: 80
  md: "![](img/dcf53336af93733d4dab8829d31ceb8e_80_0.png)\n\nFigure 4-3: An instance\
    \ and its constructor are linked via the prototype.\n\nThis nature of this relationship\
    \ means that any disruption between the instance and the prototype will also create\
    \ a disruption between the instance and the constructor.\n\n# Changing Prototypes\n\
    \nBecause all instances of a particular type reference a shared prototype, you\
    \ can augment all of those objects together at any time. Remember, the [[Prototype]]\
    \ property just contains a pointer to the prototype, and any changes to the prototype\
    \ are immediately available on any instance referencing it. That means you can\
    \ literally add new members to a prototype at any point and have those changes\
    \ reflected on existing instances, as in this example:\n\n```\nfunction Person(name)\
    \ {\n    this.name = name;\n}\n\nPerson.prototype = {\n    constructor: Person,\n\
    \n    sayName: function() {\n        console.log(this.name);\n    },\n\n    toString:\
    \ function() {\n        return \"[Person \" + this.name + \"]\";\n    }\n};\n\
    ```"
