- pgno: 107
  md: "A second way to solve this problem is to use pseudoclassical inheritance:\n\
    \n```\nfunction Person(name) {\n    this.name = name;\n}\n\n① Person.prototype\
    \ = Object.create(EventTarget.prototype);\nPerson.prototype.constructor = Person;\n\
    \nPerson.prototype.sayName = function() {\n    console.log(this.name);\n    this.fire({\
    \ type: \"namesaid\", name: name });\n};\n\nvar person = new Person(\"Nicholas\"\
    );\n\nconsole.log(person instanceof Person);    // true\nconsole.log(person instanceof\
    \ EventTarget); // true\n```\n\nIn this case, there is a new Person type that\
    \ inherits from EventTarget ①. You can add any further methods you need to Person's\
    \ prototype afterward. However, this isn't as succinct as it could be, and you\
    \ could argue that the relationship doesn't make sense: A person is a type of\
    \ event target? By using a mixin instead, you can reduce the amount of code necessary\
    \ to assign those new properties to the prototype:\n\n```\nfunction Person(name)\
    \ {\n    this.name = name;\n}\n\n① mixin(Person.prototype, new EventTarget());\n\
    mixin(Person.prototype, {\n    constructor: Person,\n    sayName: function() {\n\
    \        console.log(this.name);\n        this.fire({ type: \"namesaid\", name:\
    \ name });\n    }\n});\n\nvar person = new Person(\"Nicholas\");\n\nconsole.log(person\
    \ instanceof Person);    // true\nconsole.log(person instanceof EventTarget);\
    \ // false\n```\n\nHere, Person.prototype is mixed in with a new instance of EventTarget\
    \ ① to get the event behavior. Then, Person.prototype is mixed in with constructor\
    \ and sayName() to complete the composition of the prototype. Instances of Person\
    \ are not instances of EventTarget in this example because there is no inheritance."
  merge: -1
  img_proc: true
- pgno: 108
  md: "Of course, you might decide that while you do want to use an object's properties,\
    \ you don't want a constructor of pseudoclassical inheritance at all. In that\
    \ case, you can use a mixin directly when you create your new object:\n\n```\n\
    var person = mixin(new EventTarget(), {\n\n    name: \"Nicholas\",\n\n    sayName:\
    \ function() {\n        console.log(this.name);\n        this.fire({ type: \"\
    namesaid\", name: name });\n    }\n\n});\n```\n\nIn this example, a new instance\
    \ of EventTarget is mixed in with some new properties to create the person object\
    \ without affecting person's prototype chain.\n\nOne thing to keep in mind about\
    \ using mixins in this way is that accessor properties on the supplier become\
    \ data properties on the receiver, which means you can overwrite them if you're\
    \ not careful. That's because the receiver properties are being created by assignment\
    \ rather than by Object.defineProperty(), meaning the current value of the supplier\
    \ property is read and then assigned to a property of the same name on the receiver.\
    \ For example:\n\n```\nvar person = mixin(new EventTarget(), {\n\n    get name()\
    \ {\n        return \"Nicholas\"\n    },\n\n    sayName: function() {\n      \
    \  console.log(this.name);\n        this.fire({ type: \"namesaid\", name: name\
    \ });\n    }\n\n});\n\nconsole.log(person.name);      // \"Nicholas\"\n\nperson.name\
    \ = \"Greg\";\nconsole.log(person.name);      // \"Greg\"\n```"
  merge: -1
