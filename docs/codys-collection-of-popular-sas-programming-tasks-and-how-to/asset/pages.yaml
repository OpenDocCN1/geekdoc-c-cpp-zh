  md: 'You use the RENAME= data set option to rename the two variables: ICD9 and Description.
    The value of Fmtname is assigned using a RETAIN statement. This is more efficient
    than using an assignment statement because an assignment statement would execute
    for each iteration of the DATA step and the RETAIN statement executes only once.
    You also set Type to ''C'' (stands for character). This is not necessary since
    the format name begins with a dollar sign, but you might want to include it anyway.


    Here is a list of data set:


    | Start Label | Fmtname | Type |

    |---|---|---||

    | 020 | Plague | SICDFMT | C |

    | 022 | Anthrax | SICDFMT | C |

    | 390 | Rheumatic fever | SICDFMT | C |

    | 410 | Myocardial infarction | SICDFMT | C |

    | 493 | Asthma | SICDFMT | C |

    | 540 | Appendicitis | SICDFMT | C |


    The next step is to run PROC FORMAT with the Control data specified with the CNTLIN=option,
    like this:


    # Program 5.2: Using a control data set to create a format


    ```

    proc format cntlin=Control;

    select $SICDFMT;

    run;

    *Using the CNTLIN= created set;

    data disease;

    input ICD9 = $5. @@;

    datalines;

    020 410 500 493

    ntitle "Listing of DISEASE";nproc report data=disease headline;

    columns ICD9-Unformatted ICD9;

    define ICD9 / "Formatted Value" width=11 format=$SICDFMT;

    define Unformatted / "Original Unformatted Value" width=11;

    run;

    ```'
