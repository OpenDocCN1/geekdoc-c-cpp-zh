  md: '# Task: Matching names from two SAS data sets where the names may not be spelled
    the same (fuzzy merge)


    # Keywords


    +   - Fuzzy merge


    +   - Inexact matching


    +   - SPEDIS function


    If you are called upon merge data from two SAS data sets when you do not have
    a unique identifier in both files, sometimes you have to resort to using names
    (and other variables) to determine which observations from the two data sets belong
    together.


    Two useful tools for performing this task are SPEDIS function (standing for spelling
    distance) that helps you determine words that have similar spelling but are not
    an exact match, and PROC SQL, that can perform a Cartesian product.


    The SPEDIS function takes two arguments. If these two arguments are identical,
    the function returns a zero. For each category of spelling error, the function
    assigns penalty points. Some spelling errors are more serious than others and
    are assigned more penalty points. For example, if the first letter is not the
    same in the two strings, the function assigns a large penalty. Adding a letter
    or changing the position of two letters (ie versus ei for example), the function
    assigns a relatively small penalty.


    After the function adds all the penalty points, it divides the total penalty by
    the length of the first argument. This makes sense, since getting a letter wrong
    in a three-letter word is a much more serious error than getting a letter wrong
    in a 10-letter word.


    It is a matter of trial and error to decide what you consider a large spelling
    error. If you try to match two names and allow for a large distance, you may match
    two names that are actually different—if you insist on a small spelling error
    before you consider two names to be a match, you may fail to match two names that
    actually belong to the same person.


    PROC SQL can create a Cartesian product between two data sets. This is accomplished
    by creating every combination of observations in one data set with every observation
    in a second data set.'
