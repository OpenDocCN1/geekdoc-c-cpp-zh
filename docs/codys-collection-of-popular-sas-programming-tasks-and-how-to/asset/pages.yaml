- img_proc: true
  md: "However, if you would like an exact solution, use the YRDIF function, introduced\
    \ with SAS 9 and modified in SAS 9.3. Here is the program:\n\n# Program 8.1: Computing\
    \ a person's age, given a date of birth\n\n```\n*Computing a person's age, given\
    \ a date of birth;\ndata Compute_Age;\n    set Demographic;\n    Age_Exact = yrdif(DOB,'01jan2012'd);\n\
    \    Last_Birthday = int(Age_Exact);nrun;\n```\n\nSet Demographic contains the\
    \ date of birth in a variable called DOB. The YRDIF function takes as its first\
    \ two arguments, the earlier date and the later date, respectively. There is a\
    \ third, optional argument called a basis that allows you to specify the number\
    \ of days in a year. Some financial calculations use 30 months and 360 days, regardless\
    \ of the actual months involved or it is a leap year.\n\nTo use the YRDIF function\
    \ in SAS 9.3, you need to specify \"ACT/ACT\" as the third argument to the function\
    \ or off by one day if both of the dates involves a leap year. Using SAS 9.3 or\
    \ later, you can omit this third argument and the function defaults to a basis\
    \ called \"AGE\" that computes age correctly.\n\nOnce you have computed an age\
    \ (or any other difference between two dates), you can use the INT function to\
    \ compute the age as the last birthday or the ROUND function to round the age\
    \ to an integer (or other value).\n\nIf you want to compute an age of the current\
    \ date, use the TODAY function for the second argument of the YRDIF function.\n\
    \n# Task: Computing a SAS date given a month, day, and year (even if the day value\
    \ is missing)\n\n# Keywords\n\nSAS Date\n\nMDY function\n\nCOALESCE function\n\
    \nIf you have a SAS date set with values of month, day, and year, you can use\
    \ the MDY function to compute a SAS date. If the day of the month is missing,\
    \ you might choose to use the 15th of the month for the day of the month."
