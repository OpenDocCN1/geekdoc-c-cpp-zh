  md: '124 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    # Task: Presenting a macro to compute a moving average


    # Keywords


    Moving average


    Moving average


    If you frequently need to compute moving averages or if you want the moving average
    of a large number of data points, you may wish to use the macro presented here.


    You call the macro (Moving_Ave) with the name of your input data set, the name
    of the new data set that will include all variables from the input data set along
    with the moving average, the name of the variable to be assigned, and how many
    observations to include in each average.


    Following the macro is a brief explanation of how it works:


    # Program 12.9: Presenting a macro to compute a moving average


    ```

    *Presenting a macro to compute a moving average;

    *macro Moving_ave(In_ds=, /*Input data set name */

    Out_ds=, /*Output data set name */

    Var=, /*Variable to compute

    the average */ /*Variable for moving average */

    Moving=, /*Number of observations on which

    to compute the average */);

    ndata &Out_ds;

    set &In_ds;

    n=1;

    var &Var;

    do i = 1 %to &n - 1;

    let Num = %eval(&i + 1);

    &xNum = lag(Num)(&&Var);

    end;


    ****if the observation number is greater than or equal to the

    number of values needed for the moving average, output;

    if _n >= &n then do;

    &Moving = mean(_x1 - _xn);

    output;

    end;

    drop _x_;

    run;

    %end Moving_ave;

    ```


    You start with a DATA step that brings in each observation from the input data
    set (&In_ds). You need to assign names for the original variable and each of ''it''
    lag values. You use the variable _x1 for the non-lagged value of your variable,
    _x2 for the LAG1 value, _x3 for the LAG2 value


    Cody, Ron. Cody''s Collection of Popular SAS® Programming Tasks and How to Tackle
    Them. © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.
    For additional SAS resources, visit support.sas.com/bookstore.'
