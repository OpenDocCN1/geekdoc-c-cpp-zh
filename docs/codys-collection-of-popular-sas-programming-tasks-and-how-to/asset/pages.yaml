  md: '# Chapter 7: Restructuring (Transposing) SAS Data Sets 77


    # Program 7.1: Converting a data set with one observation per subject into one
    multiple observations per subject (using a DATA step)


    *One observation per subject to several observations per subject

    Data step approach:


    ```

    data ManyPer;

    set OnePer;

    array Dx[3];

    do Visit = 1 to 3;

    if not missing(Dx[Visit]) then do;

    Diagnosis = Dx[Visit];

    output;

    end;

    keep Subj Visit;

    run;

    ```


    You first make an array of the three variables (Dx1-Dx3). Next, set up a DO loop
    to process each element in the array. If you have a missing Dx, you do not want
    to output an observation in the ManyPer data set. You set the value of Diagnosis
    equal to Dx for non-missing values of Dx, and then output an observation to the
    ManyPer data set. It is important that the OUTPUT statement is the Do loop. In
    that way, you create multiple observations in set ManyPer from a single observation
    in set OnePer. You can see the listing of data set ManyPer in the “Introduction”
    section in this chapter.


    # Task: Converting a data set with one observation per subject into one with multiple
    observations per subject (using PROC TRANSPOSE)


    # Keywords


    +   -Transpose


    +   - Restructure


    +   - Multiple observations per subject


    +   - PROC TRANSPOSE


    You can accomplish the same result as in the previous task by using PROC TRANSPOSE.
    If you run the following program, you will create a data set with multiple observations
    per subject; however, you will need to tweak it bit to make the new data set look
    identical to the DATA step solution.'
  merge: -1
  pgno: 98
- img_proc: true
  md: "78 Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \n# Program 7.2: Converting a data set with one observation into one with multiple\
    \ observations per subject (using PROC TRANSPOSE)\n\n```\nsas\n*PROC TRANSPOSE\
    \ solution;\n  *First try;\n  proc transpose data=oneper\n      out=manyper;\n\
    \n    by Subj;\n    var Dx1-Dx3;\n  run;\n```\n\nYou supply PROC TRANSPOSE with\
    \ an input data set (identified by DATA=) and an output data set (identified by\
    \ OUT-). Because you want each of the rows Dx codes for each Subj, you need to\
    \ include a BY statement identifying Subj as your BY variable. You also identify\
    \ the variables you want to transpose, in this case Dx1- Dx3. The resulting data\
    \ set looks like this:\n\n| Subj | _NAME_ | COL1 |\n|---|---|--|\n| 001 | Dx1\
    \ | 450 |\n| 001 | Dx2 | 430 |\n| 001 | Dx3 | 410 |\n| 002 | Dx1 | 250 |\n| 002\
    \ | Dx2 | 240 |\n| 002 | Dx3 | . |\n| 003 | Dx1 | 410 |\n| 003 | Dx2 | 250 |\n\
    | 003 | Dx3 | 500 |\n| 004 | Dx1 | 240 |\n| 004 | Dx2 | . |\n| 004 | Dx3 | . |\n\
    \nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and How to Tackle\
