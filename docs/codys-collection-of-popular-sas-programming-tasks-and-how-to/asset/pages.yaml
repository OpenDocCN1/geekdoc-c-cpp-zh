  md: "# Introduction\n\nBecause the word miscellaneous is in the title of this chapter,\
    \ don't be misled into thinking these tasks\nare not useful——it's just that they\
    \ do not fit in any convenient category.\n\n# Task: Determining the number of\
    \ observations in a SAS data set (using the NOBS= SET option)\n\n# Keywords\n\n\
    +   Number of observations\n\n+   NOBS\n\nThere are several ways to determine\
    \ the number of observations in a SAS data set. One of the most\ncommon methods\
    \ is to use the NOBS=variable_name option on a SET statement. At compile time,\n\
    variable_name is equal to the number of observations in the data set named on\
    \ the SET statement.\n\nIn this example, you want to determine the number of observations\
    \ in the Stocks data set.\n\n# Program 12.1: Using the NOBS= SET option to determine\
    \ the number of observations in a\nSAS data set\n\n```\n*Determining the number\
    \ of observations in a SAS data set;\n*Using the SET option NOBS;\ndata New;\n\
    \  set Stocks nobs=Number_of_obs;\n  if _n =1 then\n    put \"The number of observations\
    \ in data set STOCKS: \" \n      Number of obs;\n    How_Var = _n / Number_of_obs;\n\
    run;\n```\n\nYou use the NOBS= option on the SET statement to obtain the number\
    \ of observations in the Stocks\ndata set (and assign this value to Number_ Obs).\
    \ In this example, you want to compute the\noff number divided by the total number\
    \ of observations in the Stocks data set. You also use a\nPUT statement to output\
    \ this number to the SAS Log. A listing of the first eight observations in data\
    \ set\nNew is displayed here:"
