  md: '# Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    You can now use the macro variable in other DATA steps. For example, to list the
    last five observations

    in the Stocks data set, you could use the following program:


    # Program 12.3: Listing the last five observations in data set Stocks


    ```

    %let Start = eval(N_of_obs - 4);

    data Last_Five;

    set Stocks(firstobs=%Start);

    run;

    ```


    The %LET statement creates another macro variable (Start) that is equal to the
    number of observations

    in the Stocks data set minus 4. You need the %EVAL function to compute the Start
    value

    because all macro values are text and cannot subtract 4 from a text value. The
    %EVAL function tells the program to treat each macro value as a number and perform
    the specified arithmetic.


