    The most straightforward way to put these two data sets together and create a
    new data set is by using a SET statement. Before putting these data sets together,
    it is a good idea to consider the storage lengths of all of the character variables.
    If there are any differences, the length of the variables in the first data set
    listed on the SET statement will determine the length of the variables in the
