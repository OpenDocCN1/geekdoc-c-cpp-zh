    Program 1.5:Converting a specific value such as ''NA'' to a missing value for
    all character variables in a SAS data set


    ```

    *Converting a specific value such as "NA" to a missing value for all

    character variables in a SAS data set;

    Char_missing;

    set Demographic;

    array Char[*] = character_;

    doi i = 1 to dim(Chars);

    if Char[i] = ''NA'' then Char[i] = '' '';

    end;

    drop i;

    run;

