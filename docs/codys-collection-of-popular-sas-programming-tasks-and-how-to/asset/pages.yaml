    | 005 | M | 45 | 69 | 188 |


    The next program demonstrates the NODUPRECS option.


    The NODUPRECS option (also called NODUP) removes duplicate observations, that,
    observations that have the same value for all variables. In previous versions
    of SAS, this option was called NODUP and you can still use that. However, this
    author believes that it is better to use NODUPRECS because it makes it clearer
    to someone reading the program that you are removing duplicate observations (records).


    The next program demonstrates this option:


    # *12. Demonstrating the NODUPRECS option of PROC SORT


    ```

    *Using PROC SORT to detect duplicate records;

    proc sort data=Duplicates out=noduprecs;

    by Subj;

    run;

    ```


