  md: 'The next program shows how to use a LENGTH statement before the SET statement
    to assign a length for selected character variables. Here is the program:


    # #### Program 4.4: Using a LENGTH statement before the SET statement to assign
    appropriate lengths


    ```

    Data Combined;

    length Gender $2 Name $18;

    set Name2 Name3;

    run;

    ```


    Because the LENGTH statement precedes the SET statement, the length of Name is
    18 and the length of Gender is 2.


    After running Program 4.4, the variable Name in the newly created data set (Combined)
    has a length of 18 and Gender has a length of 2.


    # ## Task: Developing a macro to concatenate two SAS data sets that contain character
    variables of different lengths


    # ### Keywords


    +   - Concatenating SAS data sets

    - Concatenating macro


    The macro developed in this task concatenates two data sets and automatically
    assigns the appropriate length for each character variable.


    This macro uses an interesting technique: It writes out a SAS program to an external
    file and uses %INCLUDE statement to execute the program. Here is a summary of
    the approach taken:


    +   - Use PROC CONTENTS to output data sets containing the lengths of all the
    character variables in the data sets you concatenate.

    - Compare the lengths from the two data sets and choose the longer length for
    each character variable.

    - Write a LENGTH statement using these lengths.

    - Using PUT statements, write a short DATA step using these lengths.

    - Run this program using a %INCLUDE statement.


    To automate the process, the first step is to determine the lengths of all the
    character variables in both data sets using PROC CONTENTS:'
  merge: -1
  pgno: 64
- img_proc: true
  md: "# Program 4.5: Using PROC CONTENTS to output a data set of character variable\
    \ storage lengths\n\n```\nproc contents data=Name2 noprint\n    out=Out1 (keep=Name\
    \ Type where=(Type=2));\nrun;\nproc contents data=Name3 noprint\n    out=Out2\
    \ (keep=Name Type where=(Type=2));\nrun;\n```\n\nYou use OUTPUT statement to output\
    \ the variable attributes to a SAS data set. The variables of interest are Name,\
    \ Type, and Length (PROC chose those names). A Type has a value of 1 for numeric\
    \ and 2 for character variables. The WHERE= data set option selects information\
    \ only on the character variables (Type = 2).\n\nTo help visualize the process,\
    \ here is a list of data sets Out1 and Out2\n\n# Listing of data set Out1\n\n\
    | NAME | TYPE | LENGTH |\n|---|---|---|n| Gender | 2 | 1 |\n| Name | 2 | 10 |\n\
    \n# Listing of data set Out2\n\n| NAME | TYPE | LENGTH |\n|---|---|---|n| Gender\
    \ | 2 | 2 |\n| Name | 2 | 18 |\n\nThe next step is to combine the two data sets\
    \ created by PROC CONTENTS into a single data set. You do a this with a MERGE\
    \ statement, using a RENAME= option on the second data set (renaming Length to\
    \ Length2) and using Name as the BY variable.\n\nHere is list of the merged data\
    \ set:\n\n| NAME | TYPE | LENGTH | Length2 |\n|---|---|---|---|n| Gender | 2 |\
    \ 1 | 2 |\n| Name | 2 | 10 | 18 |\n\nA quick-side considering the MERGE statement:\
    \ You can set a system option MERGENOBY to either NOWARN, WARN, or ERROR. If you\
    \ choose ERROR and forget a BY statement after a MERGE, the DATA step will stop\
    \ and you will get an error message in the SAS Log. If you set this option to\
    \ WARN, the program will perform the merge and a warning message will be printed\
    \ in the Log. The default value for the MERGENOBY option is NOWARN. With NOWARN"
