  md: '# Chapter 12: Miscellaneous Tasks


    Program 12.16: Extracting the first and last name (possibly a middle name or initial)
    from a variable containing the first and last name (possibly a middle name or
    initial) in a single variable


    ```

    *Extracting the first and last name (possibly a middle initial) from a variable
    containing first (possibly middle) and last name in a single variable;

    Data Seperater;

    set Full Name;

    First = Scan(Name,1, '' '');

    Last = Scan(Name,-1, '' '');

    Middle = scan(Name,2, '' '');

    if missing(Scan(Name,3)) then Middle = '' '';

    run;

    ```


    You obtain the first name by extracting the first word in the string and the last
    name by entering one as the second argument to the SCAN function. If there is
    a middle name, it will be the second word. However, if there is no middle name,
    there is no third word. The SCAN function returns a missing value in case. So,
    if you obtain a missing value for the third word, you know there is no middle
    name and you set the variable Middle to a missing value.


    A list of data separates follows:


    | Name | First | Last | Middle |

    |---|---|---|--|

    | Jane Ireland | Jane | Ireland | |

    | Ronald P. Cody | Ronald | Cody | P. |

    | Robert Louis Stevenson | Robert | Stevenson | Louis |

    | Daniel Friedman | Daniel | Friedman | |

    | Louis H. Horvath | Louis | Horvath | H. |

    | Mary Williams | Mary | Williams | |


    Now you have a solution to a very common programming task.


    # Conclusion


    Although this chapter contains an eclectic collection of tasks, they are, nevertheless,
    tasks that are fairly common. Many of the tasks were helped in several ways—some
    straightforward, some elegant.


    My hope is that this book will help you in several ways: One is practical—you
    can copy or modify a task solution to solve a problem of your own. I also hope
    that by reading this book, I have acquainted you with programming techniques that
    you may not have seen before.'
