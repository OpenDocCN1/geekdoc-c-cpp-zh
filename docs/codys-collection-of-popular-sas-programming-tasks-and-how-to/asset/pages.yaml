  md: '# Task: Converting a specific value such as 999 to a missing value for all
    numeric variables in a SAS data set


    Keywords

    Numeric variables

    _numeric_

    Array


    You will find many occasions where you need to perform an operation on all numeric
    (or character) variables in a SAS data set. For example, you may have a SAS data
    set where specific values, such as 999 or 9999, were used to represent a missing
    value. In the character domain, you may want to convert all character values to
    uppercase or convert a specific value such as ''NA'' to a SAS missing value. The
    approach to all of these tasks is the same. You create an array of all numeric
    or character variables. Once you do this, you can use a DO loop to perform any
    operation you desire on all of the variables in the array.


    This first example converts a value of 999 to a SAS missing value for all the
    numeric variables in data set Demographic.


    A listing of data set Demographic is shown here:


