- img_proc: true
  md: '# 30 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle
    Them


    You first use PROC MEANS to create the output data set. You use the NOPRINT option
    since you do not want any printed output, just the summary data set. The Summary
    data set contains one observation and one variable (Mean_HR). The trick is how
    to add this single value to each observation in the original Blood_Pressure data
    set. Many programmers think of using a MERGE statement. The problem with this
    solution is that there is no BY variable. You can use a conditional statement
    to accomplish your goal as shown in the following DATA step:


    Program 3.9: Demonstrating a conditional SET statement (to combine data set with
    detail)


    ```

    data Percent_Of_Mean;

    set Blood_Pressure(keep=Heart_Rate Subj);

    if N = 1 then summary;

    Percent = round(100*(Heart_Rate / Mean_HR));

    run;

    ```


    It''s important to understand exactly what is happening here and why you need
    to set the summary data set only once. In the first iteration of the DATA step,
    you bring in the first observation from the Blood_Pressure data set (with the
    two variables Heart_Rate and Subj). Since this is the first iteration of the DATA
    step, _N is equal to 1, the IF statement evaluates as true, and the SET SUMMARY
    statement executes, bringing in the one (and only) observation from the Summary
    data set.


    In the second iteration of the DATA step, you first bring in the second observation
    from the Blood_Pressure data set. Since _N is equal to 2, the IF statement is
    not true and the SET statement does not execute. You may think this is a missing
    value. But SAS only sets being read from raw data or values defined in an assignment
    statement are missing at the top of the DATA step. The value of Mean_HR comes
    from a SAS data set—therefore it is retained. The value is not initialized to
    missing because the SET statement executes only once, the value of Mean_HR remains
    in the PDV and is added to every observation in the Percent_Of_Mean data set.


    To demonstrate a practical reason why you might want to combine detail and summary
    data, the program computes a variable called Percent that represents the person''s
    heart rate as a percentage of the average of all heart rates.


    Here are the five observations in the Percent_Of_Mean data set:


