  md: '# Chapter 9: Data Tasks 91


    Suppose you want to perform the following tests on data set Blood_Pressure:


    +   1. Heart_Rate is between 40 and 100 and missing values are to be considered
    errors.

    2. SBP (systolic blood pressure) should be between 80 and 200 and missing values
    are to be ignored.

    3. DBP (diastolic blood pressure) should be between 60 and 120 and missing values
    are to be ignored.


    The ID variable in this set is called Sub; Run the following lines of code to
    accomplish these goals:


    ```

    *Test the macro;

    %let Dsn = Blood_Pressure;

    %let How = Sub;

    %errors(Var=Heart_Rate, Low=40, High=100, Missing=error)

    %errors(Var=SBP, Low=80, High=200, Missing=ignore)

    %errors(Var=DBP, Low=60, High=120, Missing=ignore)

    %report

