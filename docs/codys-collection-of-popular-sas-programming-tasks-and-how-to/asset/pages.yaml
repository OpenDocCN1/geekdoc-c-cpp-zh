  md: '# Chapter 9: Data Cleaning Tasks


    +   Introduction ................................................................................................................87

    Task: Looking for possible data errors using a given range .................................................................88

    Task: Demonstrating a macro to report on outliers using fixed ranges.........89

    Task: Demonstrating a macro that performs automatic outlier detection......92

    How the macro works ...................................................................................................................................94

    Conclusion ...................................................................................................................................96


    # Introduction


    One of the first tasks a data analyst is to check for possible invalid numeric
    values. For some variables, you can decide if a value might be an error if it
    is outside a given range. For example, a value for resting heart rate would be
    unusual if it were 40 or above 100.


    Another approach for identifying possible outliers is to see if a given data value
    does not seem to “belong” with the other values. A common approach is to compute
    a mean and standard deviation and declare a value as outlier if it is a given
    number of standard deviations above or below the mean. Many statisticians use
    values of two or three standard deviations to identify possible outliers.


    As you will see, automatic outlier detection, using a mean and standard deviation
    computed from the entire data set may not work if you have some large data errors.
    You will see how to overcome this problem so that you can use automatic outlier
    detection for many of your numeric variables.


    Cody, Ron. Cody’s Collection of Popular SAS® Programming Tasks and How to Tackle
