    \ |\n| 1234 | 2004 | 20.5 |\n| 1234 | 2005 | 22.0 |\n| 1234 | 2006 | 26.0 |\n\
    | 1234 | 2007 | 27.0 |\n| 1234 | 2008 | 37.0 |\n\n# Listing of data set Goals\n\
    \n| Year | Goal |\n| --- | --- |\n| 2004 | 20 |\n| 2005 | 21 |\n| 2006 | 24 |\n\
    | 2007 | 28 |\n| 2008 | 34 |\n\nYou can use a MERGE statement to add the Goal\
    \ values to each observation in the Sales data set like this:\n\n# Program 6.1:\
    \ Using a MERGE to perform a table lookup\n\n```\nproc sort data=Goals;\n  by\
    \ Year;\nrun;\n\nproc sort data=Sales;\n  by Year;\nrun;\n\ndata Sales_Goals;\n\
    \  merge Goals Sales;\n  by Year;\n  Difference = Sales - Goal;\nrun;\n\nproc\
    \ sort data=Sales_Goals;\n  by Sales_ID Year;\nrun;\n```"
