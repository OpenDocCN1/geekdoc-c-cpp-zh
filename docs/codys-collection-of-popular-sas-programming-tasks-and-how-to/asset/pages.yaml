    # Task: Combining summary information (a single mean) with detail data: Using
    a macro variable


    # Keywords


    Grand mean


    Combining summary and detail data


    Macro variable


    CALL SYMPUTX


    The next program demonstrates yet one method of combining detail and summary information.
    Once you have created the Summary data set (using PROC MEANS), you can run a data
    _NULL step to assign the mean_ HR to a macro variable. You can use this macro
    variable in any subsequent DATA or PROC step. Submit the following DATA step to
    create the macro variable:


    # Procedure 3.12: Combining information with detail data using a macro variable


    ```

    *Solution using macro variable;

    date _null;

    set summary;

    call symputx(''Macro_Mean'', Mean_HR);

    run;

    ```


    The two arguments to CALL SYMPUTX are the name of a macro variable and a DATA
    step variable that contains the value. In this example, you want to assign the
    value of Mean_HR to the macro variable Macro_Mean.


    An even elegant solution was suggested to me by Mark Jordan, a veteran SAS instructor.
    By using an INTO clause, you can create a macro variable directly with PROC SQL
    like this:'
