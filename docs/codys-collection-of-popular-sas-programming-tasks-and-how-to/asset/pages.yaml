  md: '# Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    ```

    if missing(Inches) then Inches = 0;

    Height_Inches = 12*Feet + Inches;

    drop Feet;

    run;

    ```


    You start extracting the digits from Weight using the COMPRESS function with the
    modifiers ''kd'' (keep digits). It is important to include two commas before the
    first argument of the COMPRESS function so that the function interprets ''kd''
    as modifier and not the second argument of the COMPRESS function that is used
    to list the characters you want to compress from a string. Since the result of
    the COMPRESS function is a character value, you use the INPUT function to perform
    the character-to-numeric conversion. All you need to do is test the original variable
    (Weight) to see if it contains ''K'' in uppercase or lowercase. Use the FINDC
    function with the ''i'' modifier (ignore case) to do this. If you find a ''K'',
    you multiply by 2.2 to convert kilograms to pounds.


    The Weight variable presents more of a challenge. You first use the COMPRESS function
    with three modifiers, ''kd'' (keep digits and space characters). The variable
    now contains two sets of digits (or only a single digit if there are zero an)
    and can use the SCAN function to extract the feet and inch values. The SCAN function
    returns a missing value for Inches if Height only contains a single number (feet).
    You can add 12 times the feet plus the number of inches to obtain the height in
    inches. Here is the listing of the data set No_Units:


    | Sub | Height | Weight_Lbs | Height_Inches |

    |---|---|---|---||

    | 001 | 80kgs | 5 | 176 | 63 |

    | 002 | 190lbs | 6 | 190 | 73 |

    | 003 | 70.KG. | 5 | 154 | 71 |

    | 004 | 177lbs. | 5 | 177 | 71 |

    | 005 | 100kgs | 6 | 220 | 72 |


    Solving this task without the COMPRESS and SCAN functions would certainly be a
    challenge—with these functions, it''s a snap.


