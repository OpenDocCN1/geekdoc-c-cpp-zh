  md: "# Chapter 12: Miscellaneous Tasks 121\n\nProgram 12.6: Counting the number\
    \ of Y's and N's in a list of SAS variables (using arrays and loops)\n\n```\n\
    *Counting the number of a specific response in a list of variables;\n*Old Fashioned;\
    \ solution;\n\ndata Count_YN;\n  set Questionnaire;\n  array Q[5];\n  Num_Y =\
    \ 0;\n  Num_N = 0;\n  do i = 1 to 5;\n    if upcase(Q[i]) eq 'Y' then Num_Y =\
    \ Num_Y + 1;\n    else if upcase(Q[i]) eq 'N' then Num_N = Num_N + 1;\n  end;\n\
    \  drop i;\nrun;\n```\n\nYou first create an array of the five variables. Next,\
    \ you initialize the two variables that will hold the counts, Num_Y and Num_X,\
    \ to zero. Finally, you use a DO loop to check the value of each variable and\
    \ check if it is a 'Y' or 'N'. The UPPERCASE function is needed because some of\
    \ the may be in lowercase.\n\nA listing of the Q_YN data set is shown next:\n\n\
    | Subj | Q1 | Q2 | Q3 | Q4 | Q5 | Num_Y | Num_N |\n| 1 | y | n | n | y | | 3 |\
    \ 2 |\n| 2 | N | n | Y | n | | 1 | 3 |\n| 4 | y | Y | n | Y | | 3 | 2 |\n| 5 |\
    \ y | Y | n | y | | 5 | 0 |\n\nA more elegant solution to this task is to use\
    \ two SAS functions, CATS and COUNTC. The CATS function can take each of the arguments,\
    \ stripping leading and trailing blanks, and concatenates the strings. The COUNTC\
    \ function counts the number of times a particular character (or characters) appears\
    \ in a string. Together, these functions make for a very compact and elegant solution,\
    \ as shown here:\n\nProgram 12.7: Using the CATS and COUNTC functions to count\
    \ responses\n\n```\n*Solution using the Count and Cats functions;\ndata Count_YN;\n\
    \  set Questionnaire;\n  Num_Y = countc(cats of Q1-Q5),'Y','i');\n  Num_N = countc(cats\
    \ of Q1-Q5),'N','i');\nrun;\n```\n\nCody, Ron, Cody's Code of Popular SAS® Programming\
    \ Tasks and How to Tackle Them. Copyright © 2012, SAS Institute Inc.,Cary, North\
    \ Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore."
  merge: -1
