  md: '# Task: Replacing the first eight digits of a credit card number with asterisks


    # Keywords


    +   - Masking characters

    - SUBSTR function

    - CATS function

    - SUBSTR function on the left-hand side of the sign


    This task is not limited to masking digits in credit card numbers—you can use
    this technique any time you want to replace characters in a string. You will see
    two solutions to this task: one simple and straightforward, the other, very elegant.


    In this solution, you use the SUBSTR function to extract the last 4 digits of
    the credit card number and you follow this with the CATS function to concatenate
    asterisks with these four digits. Here is the code:


    ```

    Program 12.11: Replacing the first eight digits of a credit card number with asterisks
    (method 1)

    *Replacing the first 8 digits of a credit card number

    with asterisks;

    *Using substrings and concatenation functions;

    data Credit_Report;

    length Last_Four $ 12;

    set Credit;

    Last_Four = cats(''******'',substr(Account, 9));

    run;

    ```


    A more elegant solution is to use the SUBSTR function on the left-hand side of
    the sign like this:


    ```

    Program 12.12: Replacing the first eight digits of a credit card number with asterisks
    (method 2)

    *Using the SUBSTR function on the left-hand side of the equal sign;

    data Credit_report;

    set Credit;

    Last_Pour = Account;

    substr(Last_Four,1,8) = ''******'';

    run;

    ```


    As a review, the SUBSTR function on the left-hand side of the equal sign places
    the characters to the right of the equal sign into the variable named on the left-hand
    side of the equal sign, starting at the position specified by the second argument
    of the function a length specified by the third argument of the function. Yes,
    this program is only one line shorter than the previous program, but this author
    considers it a more elegant solution—and isn''t your goal—to write elegant programs?'
  merge: -1
