  md: "# Chapter 4: Combining and Updating SAS Data Sets 55\n\n| Name1 | DOB1 | Gender1\
    \ | Name2 | DOB2 | Gender2 |\n|---|---|---|---|---|--|\n| Chien | 21OCT1965 |\
    \ F | Gregory | 05FEB1955 | F |\n| MacDonald | 12FEB201 | M | Freeman | 14JUL1946\
    \ | M |\n| MacDonald | 12FEB2001 | M | Chen | 21OCT1965 | F |\n| MacDonald | 12FEB2001\
    \ | M | McDonald | 12FEB2001 | M |\n\nFor this example, want to find observations\
    \ in the Cartesian product data set where the date of birth and the gender are\
    \ the same in each data set and where the spelling distance between the two names\
    \ is less than a predetermined value. Here is the PROC SQL code to produce a list\
    \ of possible matches and exact matches:\n\n# 4.14: Performing a “fuzzy” match\
    \ between two SAS data sets\n\n```\nproc sql;\ncreate table Possible_Matches as\n\
    \  select * from Name One, Name_Two\n  where speris(upcase(Name1),upcase(Name2))\
    \ between 1 and 25\n  DOB1 eq DOB2 and\n  Gender1 eq Gender2;\nquit;\n```\n\n\
    ```\nproc sql;\ncreate table Exact_Matches as\n  select * from Name One, Name_Two\n\
    \  where speris(upcase(Name1),upcase(Name2)) eq 0 and\n  DOB1 eq DOB2 and\n  Gender1\
    \ eq Gender2;\nquit;\n```\n\nThe first PROC SQL step creates a Cartesian product\
    \ between Name One and Name. Two. The WHERE clause selects observations in the\
    \ Cartesian product data set where the names are within a spelling distance of\
    \ 25 (but not zero, which would be an exact match). To be sure match names that\
    \ are not in the same case, use the UPCASE function on both names. As a further\
    \ effort to determine which observations belong together, you can check that the\
    \ date of birth and the gender are the same. This program ignores missing values\
    \ for date of birth and gender. You may want to insist that these variables are\
    \ not missing before attempting a match.\n\nCody, Ron. Cody's Collection of Popular\
    \ SAS® Programming Tasks and How to Tackle Them. Copyright © 2012, SAS Institute\
