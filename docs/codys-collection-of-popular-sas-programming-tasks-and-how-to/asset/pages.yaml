    # Task: Concatenating two SAS data sets—Using PROC APPEND


    +   Keywords

    Concatenating data sets

    PROC APPEND


    Program 4.1 requires SAS to read all the observations from Name1 as well as Name2.
    If the first data Name1(in the example) is large, this uses considerable computer
    resources. An alternative is to use PROC APPEND add the observations from Name2
    to end of data set. PROC APPEND jumps directly to the end of Name1 and starts
    adding the observations from Name2. In this case, the two data sets have identical
    variables and attributes, this is a very efficient solution.


    Because PROC APPEND adds the new data to the first set (and thereby changes it),
    you can''t undo the process. You might consider making a copy of the first data
    before running PROC APPEND.


    Program 4.2 demonstrates how you can use PROC APPEND to concatenate two data sets:


    # Program 4.2 - Concatenating SAS data sets using PROC APPEND


    ```

    *Method 2 - Using PROC APPEND;

    proc append base=Name1 data=Name2;

    run;

    ```


    You name the first data set with the BASE= option, and the data to be added with
    the DATA= option. After you run this program, the Name1 data contains six observations.


