    # Task: Changing all character values to either uppercase, lowercase, or proper
    case


    Keywords


    +   - Uppercase

    - Lowercase

    - Proper case

    - _character_


    In similar manner to the previous program, you can use an array of all your character
    variables to convert them all to a unified case: uppercase, lowercase, or proper
    case. Please refer to the previous program if you would like an explanation of
    this program. As you can see, this program is converting all the character values
    in the Demographic data set to uppercase. The two other functions that convert
    character values to lowercase or proper case are LOWERCASE and PROCASE, respectively.
    Here is the program:


    Program 1.6: Changing all character variables in a SAS data set


    ```

    *Converting all character values to uppercase (or lower- or proper-

    case);

    data;

    set Demographic;

    array Chars[*] character;

    doi i = 1 to dim(Chars);

    Chars[i] = upcase(Chars[i]);

    end;

    drop i;

    run;

    ```


    If the character variables are dealing with names and addresses, after you have
    converted all the values to a consistent case, you may want to take the additional
    step and use the COMPBL function to convert multiple blanks to a single blank,
    to help standardize the names and addresses.'
