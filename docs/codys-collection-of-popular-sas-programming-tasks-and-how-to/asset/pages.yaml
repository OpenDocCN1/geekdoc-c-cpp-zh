  md: '# # Chapter 6: Table Lookup Techniques


    +   Introduction ................................................................................................................65

    Task: Performing a one-way table lookup using a MERGE statement..................................65

    Task: Performing a one-way table lookup using user-defined informats.........................67

    Task: Creating an INFORMAT using a control data set..................................................................69

    Task: Performing a one-way table lookup using a temporary array..................................70

    Task: Performing a two-way table lookup using a temporary array...............................71

    Conclusion .......................................................................................................................73


    # # Introduction


    Table lookup is the process where you use one or more key values, such as an item
    number, and associate it with another value, such as the item''s price. SAS has
    a variety of ways of performing one-way or multi-way table lookup. One easy and
    straightforward way is to use a MERGE statement. Other, more efficient methods,
    such as temporary arrays, formats, or informats, store the table information in
    memory. You will see examples of all of these methods in this chapter.


    # ## Task: Performing a one-way table lookup using a MERGE statement


    +   * **Keywords**

    Table lookup

    MERGE


    You have sales data, arranged by year, in your Sales data set and yearly data,
    also arranged by year, in your Goals data set. The first five observations from
    each of these data sets are listed here:'
  merge: -1
