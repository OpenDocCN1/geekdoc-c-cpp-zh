    # Task: Converting character values to numeric values using a macro


    # Keywords


    +   Character-to-numeric conversion


    +   Conversion macro


    Because character-to-numeric conversion is required in many situations, this chapter
    offers you a macro that performs the conversion automatically. In the previous
    program, the resulting data set uses the same variable names as the original data
    set that contains the character variables. Here is the macro, followed by an explanation:


    # Program 1.2: Presenting a macro to perform character-to-numeric conversion


    ```

    *Macro to convert selected character variables to

    numeric variables;

    /*Name of the input data set*/

    macro char_to_num(In_dsn,

    /*Name of the output data set*/

    Out_dsn,

    List of character variables that you

    want to convert character to

    numeric, separated by spaces*/

    ```


    ```

    /*Check for null list */

    if &var list ne %then do;

    /*Count the number of variables in the list */

    let len=%sysfunc(countw(&var_list));

    data &Out_dsn;

    set &In_dsn(rename=(

    _do 1 to &len = _var

    ));run;

    ```


