  md: '# Task: Identifying observations with exactly ''n'' observations per subject


    Keywords


    Multiple observations per subject


    “n'' observations per subject


    There are times when you expect a fixed number of observations per subject (or
    other BY variable). You can accomplish this task by initializing a counter when
    you are reading the first observation per subject, incrementing the counter for
    each successive observation with the same subject number, and checking the counter
    when you are reading the last observation for each subject.


    Data set TwoRecords was created to demonstrate this task. Here is the listing:


    | Subj | Weight |

    |---|---|

    | 001 | 200 |

    | 001 | 190 |

    | 002 | 155 |

    | 002 | 157 |

    | 003 | 123 |

    | 004 | 220 |

    | 004 | 221 |

    | 005 | 111 |

    | 005 | 112 |


    Subjects 001, 002, and 005 have two observations each. You can output the observations
    for all subjects who do not have exactly two observations with the following program:'
  merge: -1
  pgno: 130
- img_proc: true
  md: "# Program 11.8: Identifying subjects who have exactly two observations\n\n\
    ```\nproc sort data=Two_Records;\n  by Subj;\n  run;\n\ndata Not_Two;\n  set Two_Records;\n\
    \  by subj;\n  if first.Subj then n=0;\n  n + 1;\n  if last.Subj and n ne 2 then\
    \ output;\n  run;\n```\n\nEach time you are processing the first observation for\
    \ a subject, you set your counter (n) equal to zero. You then increment the counter\
    \ using a SUM statement. Finally, when you reach the last observation for each\
    \ subject and n is not equal to 2, you output an observation.\n\nThe following\
    \ listing shows all the subjects who do not have exactly two observations:\n\n\
    | Subj | Weight | n |\n|---|---|--|\n| 003 | 123 | 1 |\n| 004 | 210 | 3 |\n\n\
    # Task: Computing differences between observations (for each subject)\n\n# Keywords\n\
    \n# Differences between observations\n\n# LAG function\n\nOne of the most common\
    \ requirements when you have multiple observations per subject is to compute differences\
    \ between observations. To demonstrate this, take a look at the Visits data set.\
    \ (Each subject has a unique value of the variable Patient.)\n\n| Patient | Visit\
    \ | Weight |\n|---|---|--|\n| 001 | 1 | 120 |\n| 001 | 2 | 124 |\n| 001 | 3 |\
    \ 124 |\n| 002 | 1 | 200 |\n| 003 | 1 | 310 |"
  merge: -1
  pgno: 131
- img_proc: true
  md: "# Chapter 11: Tasks Involving Multiple Observations per Subject 111\n\n| Patient\
    \ | Visit | Weight |\n|---|---|--|\n| 003 | 2 | 305 |\n| 003 | 3 | 298 |\n| 003\
    \ | 3 | 290 |\n| 004 | 1 | 160 |\n| 004 | 2 | 162 |\n\nEach patient has one to\
    \ three visits. You want to see the weight change from visit to visit for each\
    \ patient. The simplest way is to use the LAG function, like this:\n\n# Program\
    \ 11.9: Using the LAG function to compute differences between observations\n\n\
    ```\n*Computing inter-patient differences;\nproc sort data=Visits;\n  by Patient\
    \ Visit;\nrun;\n\ndata Difference;\n  set Visits;\n  by Patient;\n  Diff_Wt =\
    \ Weight - lag(Weight);\n  if not first.Patient then output;\nrun;\n```\n\nThe\
    \ LAG function returns the value of its argument the last time the function was\
    \ executed. If you execute the LAG function for every iteration of the DATA step,\
    \ it will return a value from a previous observation. You may be tempted to execute\
    \ the LAG function when you are reading the first observation for each patient,\
    \ as the lag value is the last value from the previous patient. This is OK. You\
    \ are only outputting differences for the second observation for each patient.\
    \ If you use a statement such as:\n\n```\nif not first.Patient then Diff_Wt =\
    \ lag(Weight);\n```\n\nit will not work the next time you execute the LAG function\
    \ it will still return the last value from the previous patient. Unless you are\
    \ using the LAG function in a very unusual situation, such as in Program 11.11,\
    \ you should not use the LAG function in conditional logic.\n\nIn the previous\
    \ program, you can use the DIF function (DIF(Weight)) instead of the LAG function\
    \ (equal to Weight – LAG(Weight)) if you prefer.\n\nCody, Ron. Cody's Collection\
    \ of Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012,\
    \ SAS Institute Inc.\nary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore."
  merge: -1
  pgno: 132
- img_proc: true
  md: "112 Cody’s Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \nHere is a list of data set Difference:\n\n| Patient | Visit | Weight | Diff_Wt\
    \ |\n| 001 | 2 | 124 | 4 |\n| 001 | 3 | 124 | 0 |\n| 003 | 2 | 305 | -5 |\n| 003\
    \ | 3 | 298 | -7 |\n| 003 | 3 | 290 | -8 |\n| 004 | 2 | 162 | 2 |\n\n# Task: Computing\
    \ the difference between the first and last observation\n each subject\n\n# Keywords\n\
    \n+   Differences between first and last observations\nRETAIN statement\nLAG function\
    \ (executed conditionally)\n\nA similar task to the previous task is to compute\
    \ differences between the first and last visit for each patient. There are two\
    \ interesting ways to accomplish this: The first method uses retained variables\
    \ (ones that are not set back to missing for each iteration of the DATA step).\
    \ The other method uses the LAG function in a very unconventional way..\n\nHere\
    \ is the program, followed by an explanation:\n\nProgram 11.10: Computing the\
    \ differences between the first visit and last visit for each patient\n\n```\n\
    *Computing the differences between the first visit and last visit;\nproc sort\
    \ data=Visits;\nby Patient;\nrun;\ndata First_Last;\nset Visits;\nby Patient;\n\
    *Delete observations where only one visit;\nif first.Patient and last.Patient\
    \ then delete;\nretain First_Wt;\nif first.Patient then First_Wt = Weight;\n```\n\
    \nCody, Ron. Cody’s Collection of Popular SAS Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute Inc.\nCary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore."
  merge: -1
  pgno: 133
- img_proc: true
  md: "# Chapter 11: Tasks Involving Multiple Observations per Subject 113\n\n```\n\
    if last.Patient then do;\n  Diff_Wt = Weight - First_Wt;\n  output;\nend;\nrun;\n\
    ```\n\nYou need the data set sorted by Patient to create the First.Patient and\
    \ Last.Patient variables. However, it is a good idea, when you are sorting, to\
    \ Visit in the sort to ensure that all the visits for each patient are also in\
    \ order (don't assume when you don't have to).\n\nNext, remove any patient with\
    \ only one observation—you can't compute differences between patients. You accomplish\
    \ this by deleting all observations where First.Patient and Last.Patient are both\
    \ true. Next, use a RETAIN statement for the variable First_Wt. When you read\
    \ the first observation for any patient, you set First_Wt equal to Weight. When\
    \ you read the last visit for any patient, you compute the difference of First_Wt\
    \ and Last_Wt.\n\nA listing of data First, Last is shown here:\n\n| Patient |\
    \ Visit | First_Wt | Diff_Wt |\n|---|---|---|--|\n| 001 | 3 | 124 | 4 |\n| 003\
    \ | 3 | 290 | 310 | -20 |\n| 004 | 2 | 160 | 2 |\n\nAn interesting and unconventional\
    \ program to solve this task is shown next:\n\n# Program 11.1: Using the LAG function\
    \ to compute differences between the first and last visit for each patient\n\n\
    ```\n*Redoing the previous program using the LAG function;\ndata First_Last;\n\
    \  set Visits;\n  by Patient;\n  *Delete observations where only one visit;\n\
    \  if first.Patient and last.Patient then delete;\n  if first.Patient or last.Patient\
    \ then Diff_Wt = Weight -\n    lag(Weight);\n  if last.Patient then output;\n\
    run;\n```\n\nRemember, in this chapter you were cautioned not to execute the LAG\
    \ (or DIF) function conditionally. However, for this application you. First eliminate\
    \ any patient with one visit (as in the previous program). Next, use the LAG function\
    \ only when you are reading the first or last observation for each patient. When\
    \ you are reading a value from the last observation for a patient, you need to\
    \ realize that the LAG function executed was at the first visit. There, you are\
    \ obtaining a difference between the first and last visits.\n\nCody, Ron. Cody's\
    \ Collection of Popular SAS® Programming Tasks and How to Tackle Them. Copyright\
    \ © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/bookstore."
  merge: -1
  pgno: 134
