  md: "Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \nThe first argument of the COUNTC function is the string you want to query, the\
    \ second argument specifies one or more characters that you want to count, and\
    \ the third argument is a modifier. The 'I' modifier means, ignore case. Running\
    \ this program produces the same output as the longer program described previously.\n\
    \n# Task: Computing a moving average\n\n# Keywords\n\n+   Moving average\n\n+\
    \   LAG function\n\nA moving average is used to see trends in data that might\
    \ have large fluctuations. In this example, you want to average three days of\
    \ stock prices to see a trend that may be hard to see because of the large day-to-day\
    \ fluctuations. The first average is the average of days 1, 2 and 3, the second\
    \ average is the average of days 2, 3, and 4 and so forth. Since each daily price\
    \ is in a separate observation (sorted by date), you can use the LAG function\
    \ to obtain values from previous observations.\n\n# Program 12.8: Computing a\
    \ moving average\n\n```\n* To compute a moving average;\nset Stocks;\n Last =\
    \ lag(Price);\n Twoback = lag(Price);\n if n_n ge 3 then Moving = mean(Price,Last,Twoback);\n\
    run;\ntitle \"Plots of Stock Price and Three Day Moving Average\";\nproc sgplot\
    \ data=Y;\n series x=Date y=Moving;\nrun;\n```\n\nSince you execute the LAG (and\
    \ LAG2) functions for every iteration of the DATA step, the LAG value is the price\
    \ from the previous observation, and the LAG2 value is the price from the observation\
    \ before that. You could start outputting averages from the start, but in this\
    \ example, you start outputting observations only when you get to the third observation\
    \ (when n_n is greater than or equal to 3).\n\nCody, Ron. Cody's Collection of\
    \ Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012, SAS\
    \ Institute Inc.\nary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore."
