  md: "# Chapter 7: Restructuring (Transposing) SAS Data Sets 79\n\nThis is close\
    \ to the result you. You need to rename Coll1 to Diagnosis, drop the variable\
    \ _Name_, remove observations that have a missing value for Dx, as demonstrated\
    \ in the next program:\n\nProgram 7.3: Making a few changes to the PROC TRANSPOSE\
    \ program to produce the output set you want\n\n```\nproc transpose data=OnePer\n\
    \    out=ManyPer (rename=(coll=Diagnosis)\n    drop=_name_\n    where=(Diagnosis\
    \ is not null));\n  by Subj;\n  var Dx1-Dx3;\nrun;\n```\n\nYou use a data set\
    \ option to rename Coll to drop the variable _Name_, and a WHERE set option to\
    \ remove observations where the Diagnosis is a missing value. The resulting data\
    \ set is almost identical to the ManyPer data set produced by the DATA step—the\
    \ only difference being the variable Visit is not in the data set created by PROC\
    \ TRANSPOSE.\n\n# Task: Converting a data set with multiple observations per subject\
    \ into one with one observation per subject (using a DATA step)\n\n# Keywords\n\
    \n+   * **Transpose**\n* **Restructure**\n* Multiple observations per subject\n\
    \nThis is the reverse of the first task described in this section. The approach,\
    \ using a DATA step, is to create an array of the variables that will hold values\
    \ from multiple observations in the input data set. Because you are adding one\
    \ value to each array for each iteration of the DATA step, you need to retain\
    \ all of the variables making you array. Be careful! If you do not set all of\
    \ the new variables to a missing value for each subject, you might wind up with\
    \ non-missing values from a previous subject. The following program accomplishes\
    \ this:\n\nProgram 7.4: Converting a data set with multiple observations per subject\
    \ into one with observation per subject (using a DATA step)\n\n> *Going from a\
    \ data set with several observations per subject to one with one observation per\
    \ subject.\n\n```\nproc sort data=ManyPer;\n    by Subj Visit;\nrun;\n```\n\n\
    Cody, Ron, Cody's Collection of Popular SAS® Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore."
