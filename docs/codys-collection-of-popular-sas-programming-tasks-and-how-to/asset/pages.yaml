    \n| ICD9 | Description |\n|---|---|\n| 410 | Myocardial infarction |\n| 493 |\
    \ Asthma |\n| 540 | Appendicitis |\n\nThe variable ICD9 (stands for International\
    \ Classification of Diseases version 9) is a code for each of the medical conditions\
    \ stored in the Description. You would like to create a format for each of the\
    \ ICD9 codes using the value of Description as the format label.\n\nThe first\
    \ step is to create a control data set from the Codes data set. Variables in a\
    \ control data set are follows:\n\n| Variable Name | Description |\n|---|---|\n\
    | Fmtname | A character variable that contains the name of the format you want\
    \ to create. If you want to create a character format, this value should begin\
    \ with a dollar sign (S). |\n| Type | Values of Type are 'C' for a character format\
    \ and 'N' for a numeric format. If the Fmtname starts with a S, the variable is\
    \ optional. |\n Start | This is a single value or the starting value in a range.\
    \ |\n End | If you specify a range, End is the ending value. |\n Label | This\
    \ character variable holds the format label. |\n HLO | This variable allows you\
    \ to specify values for the keywords High, Low, or Other. |\n\nFor this task,\
    \ the variable ICD9 to be renamed Start, and Description to be renamed Label.\
    \ If you want to format it, assign $ICDFMT, this value to Fmtname. You will see\
    \ how to use the HLO variable in the next task.\n\nThe following DATA step creates\
    \ a control data set from Codes:\n\n# Program 5.1: Creating a control data set\
    \ from a data set containing codes and labels\n\n```\n*Program to create a control\
    \ data set from a SAS data set;\ndata Control;\n  set Codes(rename=\n    (ICD9\
    \ = Start\n    Description = Label));\n  retain Fmtname '$ICDFMT'\n  Type 'C';\n\
    run;\n```\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and\
