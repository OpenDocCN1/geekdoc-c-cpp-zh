  md: 'The next program demonstrates how to use library tables to determine the number
    of observations in the Stocks data set:


    # Program 12.4: Determining the number of observations in a data set using library
    tables


    ```

    data

    _null;;

    set sashelp.vtable;

    where libname="WORK" and memname="STOCKS";n**Note:you must use uppercase values
    for libname and memname;

    **Num_nobs= total number of observations, including deleted ones

    Delobs is the number of deleted observations;

    put Delobs: = num_obs;

    run;

    ```


    It is important to remember that the libname and memname must be entered in uppercase,
    because that is the way they are stored in the table. The two variables you need
    from the table are Nobs (the total number of observations including ones marked
    for deletion) and Delobs (the number of observations marked for deletion). When
    you run this program, the line produced by the PUT statement is:


    ```

    nobs = num_obs = 42

    ```


