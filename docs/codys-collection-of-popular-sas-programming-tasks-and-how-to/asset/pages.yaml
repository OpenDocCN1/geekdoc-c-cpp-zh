  md: "# Task: Reading a numeric value that contains units such as Lbs. or Kgs. in\
    \ the value\n\nKeywords\n\n+   * Character-to-numeric conversion\n* Removing units\
    \ from a value\n* Extracting digits from a string\n* COMPRESS function\n* SCAN\
    \ function\n\nData sets Units contain a character variable called Height that\
    \ includes units such as Lbs. and Kgs. (pounds and kilograms). To add injury,\
    \ the variable Height also contains units and it is expressed in feet and inches\
    \ (sometimes the inches value is missing (when the inches value is zero). listing\
    \ of data sets Units is shown here:\n\n| Subj | Weight | Height |\n|---|---||}{\n\
    | 001 | 80kgs | 5ft 3in |\n| 002 | 190lbs | 6' 1' |\n| 003 | 70KG. | 5ft 11in\
    \ |\n| 004 | 177Lbs. | 5' 11in |\n| 005 | 100kgs | 6ft |\n\nNotice that the Weight\
    \ units are not always in the same case and some of the units end in periods.\
    \ For Height, the abbreviation 'ft' or 'in' is used; sometimes a single quote\
    \ and double quote represent feet and inches.\n\nYou would like to create two\
    \ new variables (Weight_Lbs and Height_Inches) that are numeric variables and\
    \ are equal to the weight in pounds and the height in inches, respectively. Here\
    \ is the program:\n\n# Program 1.7: Reading data values that contain units\n\n\
    ```\n*Reading data values that contain units;\n  data No Units;\n  set Units;\n\
    \  Weight_Lbs = input(compress(Weight,'kd'),12);\n  if find(Weight,'k',i) then\
    \ Weight_lbs = Weight*2.2;\n  Height = compress(Height,'ks');\n  Feet = input(scan(Height,1,'\
    \ '),12);\n  Inches = input(scan(Height,2,' '),12);\n```"
