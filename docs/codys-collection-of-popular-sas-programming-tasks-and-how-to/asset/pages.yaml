  md: '# Conclusion


    You can use a variety of methods to create variables that represent groups of
    continuous variables.

    Although IF-THEN-ELSE statements in a DATA step are the most common method for
    grouping values, keep in mind that user-written formats along with a PUT function
    are an easy and efficient way to create groups. If you want to create a number
    of groups of equal size, keep PROC RANK in mind.'
