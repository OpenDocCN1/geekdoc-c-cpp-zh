    # Task: Grouping values using user-defined formats


    # Keywords


    Grouping data


    Formats


    PUT function


    You can use a format along with a PUT function to accomplish the same goal as
    the previous example. This technique is easy to program—it is also an efficient
    method for grouping values.


    The first step is to define a format with your desired ranges. Then, you can use
    a PUT function to create the new variable representing your groups. This example
    places heart rates into the same groups as the previous example:'
