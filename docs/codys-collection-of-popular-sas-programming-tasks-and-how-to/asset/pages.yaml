  md: "# Task: Sorting within an observation (using the ORDINAL function)\n\n# Keywords\n\
    \n+   - Sorting within observation\n\n+   Ordinal function\n\nThere are numerous\
    \ occasions where you would like to sort values within an observation. For example,\
    \ you might have a number of scores per person and you want to order the scores\
    \ from lowest to highest. The first solution presented here, uses the ORDINAL\
    \ function to accomplish this goal. This function takes a number as the first\
    \ argument, and a list of values as the remaining arguments. When the number is\
    \ equal to one, the function returns the smallest value, when the number is equal\
    \ to two, the function returns the second smallest value, when the number does\
    \ not ignore missing values, so the smallest value may be a missing value. Another\
    \ ordering function, SMALLEST, does ignore missing values—it returns the smallest\
    \ value in a list of values, not counting any missing values.\n\nYou want to order\
    \ 10 scores (Score1-Score10) from lowest to highest. These scores are stored in\
    \ data set, as shown below:\n\n| Name | Score1 | Score2 | Score3 | Score4 | Score5\
    \ | Score6 | Score7 | Score8 | Score9 | Score10 |\n|---|---|---|---|---|---|---|---|---|---||}{\n\
    | John | 95 | 92 | 87 | 100 | 96 | 88 | 89 | 78 | 2 | 95 |\n| Mary | | 98 | 96\
    \ | 93 | 89 | 95 | 95 | 94 | | | 99 |\n| Sarpal | | 84 | 87 | 88 | 80 | | | 81\
    \ | 77 | 72 |\n| Sophie | | 78 | 79 | 81 | 82 | 84 | 85 | 86 | 88 | 90 | 95 |\n\
    \nFor this task, you want to create 10 new variables (Sorted1-Sorted10) equal\
    \ to the 10 scores sorted from smallest to largest.\n\n# Program 12.13: Using\
    \ the ORDINAL function to sort within an observation\n\n```\n* Sorting within\
    \ an observation: Using the ORDINAL function;\ndata Observed_Scores;\n  set Scores;\n\
    \  array Score[10];\n  array Sorted[10];\n  do i = 1 to 10;\n    Sorted[i] = ordinal(i,\
    \ Score[*]);\n  end;\ndrop i;\nrun;\n```"
  merge: -1
  pgno: 148
- img_proc: true
  md: "# Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \nYou may wonder why there are no variables names listed on the two ARRAY statements.\
    \ If you define an array with the number of elements in the brackets following\
    \ the array name, and you do not include a list of variables, SAS will use the\
    \ array name with numbers from 1 to appended. For example, SAS has 10 variables,\
    \ Score1–Score10. This program also uses Score[*] as the second argument to the\
    \ ORDINAL function. This is equivalent to writing Score1-Score10.\n\nAs you iterate\
    \ the DO loop, the values of Score are placed in the Sorted variables from smallest\
    \ to largest.\n\n# Task: Sorting within an observation (using CALL SORTN)\n\n\
    # Keywords\n\nSorting within an observation\n\nCALL SORTN\n\nCALL SORTN is a call\
    \ routine that was introduced in SAS 9.3. (Note: CALL SORTN was actually in earlier\
    \ versions of SAS 9, but considered experimental.)\n\nFor this example, you want\
    \ to sort the variables Score1–Score10 from smallest to largest. To use the SORTN\
    \ routine, you enter a list of variable names as arguments to the routine. If\
    \ you have a list in the form Score1–Score10, you need to precede the list with\
    \ the keyword OF. Following the call, the values of all the variables listed in\
    \ the routine are ordered from smallest to largest.\n\nHere is an example:\n\n\
    Program 12.14: Sorting within an observation (using CALL SORTN)\n\n```\n*Sorting\
    \ within an observation: Using CALL SORTN;\ndata Ordered_Scores;\n Scores;\n call\
    \ sortn(Score1-Score10);\nrun;\n```\n\nAfter this program, the values for Score1–Score10\
    \ have been placed in order from smallest (Score1) to show Score10 as in the following\
    \ listing:\n\n| Name | Score1 | Score2 | Score3 | Score4 | Score5 | Score6 | Score7\
    \ | Score8 | Score9 | Score10 |\n|---|---|---|---|---|---|---|---|---|---||\n\
    | John | 2 | 78 | 87 | 88 | 89 | 92 | 95 | 95 | 96 | 100 |\n| Mary | | | 89 |\
    \ 93 | 94 | 95 | 96 | 98 | 99 | |\n| Sarpal | | | 77 | 80 | 81 | 84 | 85 | 86\
    \ | 87 | 88 | 92 |\n| Sophie | | | 79 | 81 | 82 | 84 | 85 | 86 | 88 | 90 | 95\
    \ |"
