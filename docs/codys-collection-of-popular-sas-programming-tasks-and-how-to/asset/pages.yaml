  md: '# Task: Demonstrating a macro that performs automatic outlier detection


    # Keywords


    +   - Outliers


    +   - Automatic outlier detection


    +   - Trimmed statistics


    For some variables, it is possible to identify possible outliers, without specifying
    ranges. You can compute a mean and standard deviation and identify data points
    as possible outliers if they are more than a given number of standard deviations
    above or below the mean. There are several problems with this concept. First,
    if you have a highly skewed distribution, this technique may not work well. Second,
    if you have a few extreme data errors (a misplaced decimal point, for example),
    the standard deviation might be so inflated that this technique will fail to identify
    data errors.


    One method you can use to rectify this latter problem is to use trimmed statistics.
    Although this sounds complicated, the concept is really quite simple. That is,
    you throw away values from both ends of the distribution before performing the
    calculations for the mean and standard deviation.


    PROC UNIVATE has the ability to compute trimmed statistics. The macro that is
    presented next uses PROC UNIVATE to compute trimmed statistics, and outputs these
    values to a SAS data set using ODS. The output data set from the object called
    TrimmedMeans contains the trimmed mean but it does not contain the standard deviation.
    Instead, you will find values for the trimmed standard error (the standard deviation
    divided by the square root of the sample size), and the degrees of freedom (in
    this case, to the sample size minus 1).


    In addition to those slight problems, you need to restructure (transform) your
    original data set so that it can be merged with the ODS obtained data set.


    The purpose of presenting the Auto Outlier macro is to allow you to copy and use
    it. For readers interested in the inner-workings of this macro, an explanation
    is included.


    To call the Auto Outlier, you need to identify your data name, the ID variable,
    and a list of the variables you want to test (separated by spaces). Two additional,
    optional arguments are the amount of trimming you want and the number of standard
    deviations you want to declare as outliers. You have a choice on how to specify
    much to trim your variables: If you enter a proportion (less than .5), this proportion
    will be trimmed from both ends of the distribution; if you specify an integer,
    this number of values will be trimmed from each end of the distribution.


    A listing of the Auto_Outlier macro follows:'
  merge: -1
  pgno: 113
- img_proc: true
  md: "# Chapter 9: Data Cleaning Tasks 93\n\n# Program 9.5: Presenting a macro for\
    \ automatic detection of possible outliers\n\n```\n* using automatic outlier detection\n\
    %macro Auto Outliers(\nDsn, /* Data set name */\nID, /* Name of ID variable */\n\
    Var list, /* List of variables to check */\n  /* separate names with spaces */\n\
    Trim=.1, /* Integer 0 to n = number to trim */\n  /* from each tail; if between\
    \ 0 and .5, */\n  /* proportion to trim in tail */\nNd=2 /* Number of standard\
    \ deviations */\n);\nods listing close;\nods output data=Means=Trimmed(keep=VarName\
    \ Mean StdMean DF);\nvar Var_list;\nproc univariate data=&Dsn trim=Trim;\nrun;\n\
    ods output close;\ndata Restructure;\nset &Dsn;\nlength Vname $ 32;\narray vars[]\
    \ = &Var_list;\n i=1 to dim(vars);\n  VarName = varm(vars[i]);\n  Value = vars[i];\n\
    \  output;\nend;\n  keep &ID Varname Value;\nrun;\nproc sort data=trimmed;\nby\
    \ VarName;\nrun;\nproc sort data=restructure;\nby VarName;\nrun;\ndata Outliers;\n\
    merge Restructure Trimmed;\nby VarName;\nStd = StdMean(sqrt(DF + 1));\nif Value\
    \ > Mean & &N_sd*Std and not missing(Value)\nthen do;\n  Reason = 'Low ';\n  output;\n\
    end;\nelse if Value gt Mean + &N_sd*Std\nthen do;\n  Reason = 'High';\n  output;\n\
    end;\n```\n\nCody, Ron's Collection of Popular SAS® Programming Tasks and How\
    \ to Tackle Them. Copyright ©2012, SAS Institute Inc., Cary, North Carolina, USA.\
    \ ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore."
  merge: -1
  pgno: 114
- img_proc: true
  md: '```

    run;


    proc sort data=Outliers;

    by &ID;

    run;

    \ods listing;

    title "Outliers Based on Trimmed Statistics";

    proc print data=Outliers;

    id &ID;

    var Varname Value Reason;

