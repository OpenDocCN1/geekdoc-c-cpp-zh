  md: "# Chapter 1: Tasks Involving Conversion\n\nMy son, who is a student at programming,\
    \ suggested I solve this problem using a Perl regular expression. This solution\
    \ is not simpler than the previous solution, but it demonstrates the versatility\
    \ of regular expressions.\n\nYou start by using PRXPARSE to compile the regular\
    \ expression:\n\n/ ^(\\d+)(\\D) /\n\nThis regex is what Perl calls regular expressions\
    \ is looking for one or more digits followed by a non-digit. The \" in the beginning\
    \ of the expression says to start the search at the beginning of the string. The\
    \ digit and non-digit values will be placed in capture buffers because each of\
    \ these expressions is a set of parentheses. You use the PRMATCH function to search\
    \ for the pattern of a number followed by a nonnumber. The PRXPOSN function extracts\
    \ the values in each of the capture buffers. The INPUT function performs the character-to-numeric\
    \ conversion as in the previous task.\n\nIf the value in the capture buffer is\
    \ 'K', you perform the kilogram to pound conversion.\n\n# Program 1.8: Using a\
    \ Perl regular expression to extract the digit and units part of a capture variable\n\
    \n```\n*Solution using Perl regular expressions;\nData Units:\n  set Units (drop=Height);\n\
    \  if n = 1 then do\n    Regex = \"(\\d+)(\\D)\\\n```\n\nThe resulting data set\
    \ contains values for Weight_Lbs that are identical to the previous task.\n\n\
    # Conclusion\n\nIt is quite likely that you will need to perform one of the tasks\
    \ described in this chapter on a regular basis. The character-to-numeric conversion\
    \ is one of the most common tasks, you may choose to store the conversion in your\
    \ macro library.\n\nAlso keep in mind that using the special keywords _NUMERIC_\
    \ and _CHARACTER to define an array can save you immense time when you need to\
    \ perform an operation on all character or numeric variables in a data set.\n\n\
