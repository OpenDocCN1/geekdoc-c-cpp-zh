    Converting this program to a macro is straightforward. You need to substitute
    macro variables for the input SAS data sets and the concatenated data set. So
    finally, here is the macro:


    # Program 4.8: A macro to concatenate two SAS data sets with variable values of
    different lengths


    ```

    %macro concatenate

    (Dsn1=/*Name of the first data set */

    Dsn2=/*Name of the second data set */

    Out=/*Name of combined data set */)


    proc contents data=&Dsn1 noprint

    out=out1(keep=Name Type where=(Type=2));

    run;


    proc contents data=&Dsn2 noprint

    out=out2(keep=Name Type where=(Type=2));

    run;


    data out1;

    set out1;

    Name = propcase(Name);

    run;


    data out2;

    set out2;

    Name = propcase(Name);

    run;


    data null;

    file "c:\tasks\combined.sas";

    merge out1 out2(rename=(Length=Length2)) end=Last;

    by Name;

    if n_ = 1 then put "Data out";

    1 = max(Length, Length2);

    put length Name "$ L 2. ";

    if Last then do;

    put set &Dsn1 &Dsn2";

    put "run";

    end;

    run;


    %include "c:\tasks\Combined.sas";

    %mend concatenate;

    ```'
