  md: '# Chapter 4: Combining and Updating SAS Data Sets 45


    set, the merge will proceed and it will merge the first observation in file one
    with the first observation in file two, and so forth. It is very unlikely this
    is something you want to do, so I recommend that you set this option to WARN or
    ERROR. I have mine set to ERROR.


    The next steps are 1) Write a DATA statement to the external file. 2) Compare
    the two values, Length and Length2, and determine which is larger. 3) Write a
    length statement for each character variable using this length. 4) Write out a
    SET and RUN statement. 5) Use a %INCLUDE statement to run the program in the external
    file.


    To accomplish these goals, run the following DATA step:


    # Program 4.6: Using a DATA step to write out as an external file


    ```

    data _null;

    merge Out1;

    Out2(rename=(Length=Length2))

    end;

    by Name;

    file "c:\books\tasks\Combined.sas";


    * Step 1 /* /

    if _n = 1 then put "Data Combined";


    * Step 2 /* /

    L = max(Length, Length2);


    * Step 3 /* /

    put " Name " $ L 3. ";


    * Step 4 /* /

    if Last then do;

    set Name2;

    put "run";

    end;

    run;


    * Step 5 /* /

    %include "combined.sas";

    ```


    When _N is equal to 1, write out the DATA statement. Then for each character variable,
    you write out a LENGTH statement using the longer length.


    The MERGE statement included an END= option. You need this so that you can write
