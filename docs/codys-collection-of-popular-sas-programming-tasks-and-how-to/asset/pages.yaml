    percent of the mean, directly in the SELECT clause.


    > Program 3.11: Combining summary information with detail data using PROC SQL
    without using PROC MEANS


    ```

    *PROC SQL solution not using PROC MEANS;

    proc sql;

    create table Percent_of Mean as

    select Subj,Heart_Rate, round(100*Heart_Rate / mean(Heart_Rate))

    as Percent

    from Blood_Pressure;

