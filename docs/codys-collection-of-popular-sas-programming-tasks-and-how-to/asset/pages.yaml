- img_proc: true
  md: "# Chapter 8: Tasks Involving Dates 85\n\nThe first program presented here uses\
    \ a straightforward method of accomplishing this goal—the second program uses\
    \ a clever and elegant method. Data set MoDayYear contains the variables Month,\
    \ Day, and Year, but it does not contain a SAS date.\n\nHere is the first program:\n\
    \n# Program 8.2: Computing a SAS date given a month, day, and year value (even\
    \ if the day of the month is missing)\n\n```\n*Creating a SAS date when the day\
    \ of the month may be missing;\ndata ComputeDate;\n  set MoDayYear;\n  if missing(Day)\
    \ then Date = MDY(Month, 15, Year);\n  else Date = MDY(Month, Day, Year);\n  format\
    \ Date date9;\nrun;\n```\n\nI like this program because it uses one of my favorite\
    \ functions, the MISSING function. This function can take character or numeric\
    \ arguments. It returns a value of 1 (true) if the argument is missing, and a\
    \ value of 0 (false) if the argument is not missing.\n\nThe next program uses\
    \ the COALESCE function. You provide this function with a list of values and it\
    \ returns the first value in the list that is not missing. I would like to thank\
    \ Mark Jordan, an instructor for SAS, who thought up this solution, which is shown\
    \ next:\n\n# Program 8.3: Computing a SAS date given a month, day, and year value\
    \ (using the COALESCE function)\n\n```\n*Alternative (elegant) solution suggested\
    \ by Mark Jordan;\ndata ComputeDate;\n  set MoDayYear;\n  Date = MDY(Month, coalesce(Day,\
    \ 15), Year);\n  format Date date9;\nrun;\n```\n\nThe value of Day in this program\
    \ is either the actual value or 15 if Day is a missing value.\n\n# Conclusion\n\
    \nAlthough this chapter only covered two tasks involving dates, you will find\
    \ that these two tasks are essential to many of the program you write."
