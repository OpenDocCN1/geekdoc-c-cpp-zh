    # Task: Computing the average of the ''n'' highest scores


    # Keywords


    +   - Sorting within an observation


    +   - CALL SORTN


    As a practical example of why it is useful to sort values within an observation,
    consider the following: You have 10 scores (Score1-Score10) and you want to compute
    the average of the highest scores.


    One solution that comes to mind, is to use the ORDINAL function to set the two
    lowest values to missing, and then use the MEAN function to compute the average.


    CALL SORTN provides a very simple way to solve this problem.


    # Program 12:15: Computing the average of the ''n'' highest scores (using CALL
    SORTN)


    ```

    *Sorting within an observation: Using CALL SORTN;

    data Ordered_Scores;

    set Scores;

    call sortn(of Score1-Score10);

    Average = mean(of Score3-Score10);

    run;

    ```


    CALL SORTN switches the values of the variables Score1 to Score10 from lowest
    to highest. The average of the highest scores is therefore the mean of Score3
    through Score10.


    If you prefer to have the scores in descending order, you can write your call
    routine like this:


    ```

    call sortn(of Score10-Score1);

    ```


    This way, Score1 will contain the highest value, Score2, the second highest, and
    so forth. To compute the mean of the highest scores, you would code:


    ```

    Average = mean(of Score1-Score8);

    ```


    Thanks to Rick Langston at SAS Institute for this clever idea.'
