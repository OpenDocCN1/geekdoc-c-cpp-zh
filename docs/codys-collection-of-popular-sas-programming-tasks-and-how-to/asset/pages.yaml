  md: "# 28 Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \nFor example, the mean Heart_Rate for females (regardless of which drug they\
    \ are taking) is 71.3846.\nThe mean Heart_Rate for females on drug A is 73.3000.\n\
    \nThe next step is to separate the observations in the summary data set into separate\
    \ data sets for each value of _TYPE_. The following DATA step does:\n\n# Program\
    \ 3.7: Using the _TYPE_ variable to send summary data to separate data sets\n\n\
    ```\ndata Grand(drop Drug Gender)\nByGender(drop=Gender)\nByDrug(drop=Drug)\n\
    ByGender;\ndrop _type _freq_\nset Summary;\nif _type_ = '00' then output Grand;\n\
    else _type_ = '01' then output ByGender;\n if _type_ = '10' then output ByDrug;\n\
    \ if _type_ = '11' then output DrugGender;\nrun;\n```\n\nThis single DATA step\
    \ produces four data sets. Because the value of Drug is missing for all observations\
    \ in the ByGender data set and the value of Gender is missing for all observations\
    \ in the ByDrug data set, you use a DROP= data option to remove these variables.\
    \ Here is a listing of each of these sets:\n\nData set Grand\n\n| Mean_HR |\n\
    | 69.25 |\n\nData set ByGender\n\n| Gender Mean_HR |\n| F | 71.3846 |\n| M | 67.4000\
    \ |\n\nData set ByDrug\n\n| Drug Mean_HR |\n| Drug A | 73.3000 |\n| Drug B | 65.3500\
    \ |\n| Placebo | 69.0625 |\n\nCody, Ron. Cody's Collection of Popular SAS® Programming\
    \ Tasks and How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North\
