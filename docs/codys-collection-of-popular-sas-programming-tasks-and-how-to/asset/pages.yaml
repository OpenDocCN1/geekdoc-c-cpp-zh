  md: '# Chapter 6: Table Lookup Techniques 71


    # Program 6.5: Using a temporary array to perform a table lookup


    ```

    *Load a temporary with the Goals data;

    data Sales_Goals;

    array Goalsarray[2004:2012] _temporary;

    if n = 1 then do Year = 2004 to 2012;

    set Goals;

    goalsarray[Year] = Goal;

    end;


    set Sales;

    Difference = Sales - Goalsarray[Year];

    run;

    ```


    The goals for the 2004 to 2012 are stored in the Goals data set. You create a
    temporary array called Goalsarray and the set array bounds as 2004 to 2012. Following
    this, you enter the keyword _TEMPORARY_


    On the first iteration of the DATA step (when the automatic N_ variable is equal
    to 1), you read in the nine sales goals into the nine array elements. The goals
    for any year is simply the array element with the subscript being the desired
    year.


