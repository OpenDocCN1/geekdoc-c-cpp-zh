  md: "# Task: Using PROC SORT to detect duplicate BY values or duplicate observations\
    \ (records)\n\n# Keywords\n\n+   - PROC SORT\n- Duplicates\n- NODUPKEY\n- NODUPRECS\n\
    \nThe data set Duplicates was created to demonstrate how to detect duplicate BY\
    \ variables or duplicate observations in a SAS data set. Here is a listing:\n\n\
    | Subj | Gender | Age | Height | Weight |\n|---|---|---|---|---||\n| 001 | M |\
    \ 23 | 63 | 122 |\n| 002 | F | 44 | 59 | 109 |\n| 002 | F | 44 | 59 | 109 |\n\
    | 003 | M | 87 | 67 | 200 |\n| 004 | F | 100 | 53 | 112 |\n| 004 | F | 50 | 59\
    \ | 201 |\n| 005 | M | 45 | 69 | 188 |\n\nSome subjects only have one observation.\
    \ Subject 002 has a duplicate observation (the same value for all variables),\
    \ while subject 004 has observations with the same subject number but different\
    \ values for the other variables.\n\nYou can use PROC SORT to detect both of these\
    \ conditions and remove either type of duplicate.\n\nYou can use the NODUPKEY\
    \ option to remove any observations that have duplicate values on each of the\
    \ BY variables. Suppose you want one observation for each of the subjects in the\
    \ Duplicates set. Use the NODUPKEY option as follows:\n\n# Program 11.1: Demonstrating\
    \ the NODUPKEY option of PROC SORT\n\n```\n* Using PROC SORT to detect duplicate\
    \ By values;\nproc sort data=Duplicates out=nodupkey;\n  by Subj;\nrun;\n```"
  merge: -1
