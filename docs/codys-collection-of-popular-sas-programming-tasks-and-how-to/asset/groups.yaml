    # # Introduction


    Table lookup is the process where you use one or more key values, such as an item
    number, and associate it with another value, such as the item''s price. SAS has
    a variety of ways of performing one-way or multi-way table lookup. One easy and
    straightforward way is to use a MERGE statement. Other, more efficient methods,
    such as temporary arrays, formats, or informats, store the table information in
    memory. You will see examples of all of these methods in this chapter.


    # ## Task: Performing a one-way table lookup using a MERGE statement


    +   * **Keywords**

    Table lookup

    MERGE


    You have sales data, arranged by year, in your Sales data set and yearly data,
    also arranged by year, in your Goals data set. The first five observations from
    each of these data sets are listed here:'
  - "[PAGE 87]\n\n# Listing of data set Sales\n\n| Sales_ID | Year | Sales |\n| ---\
    \ | --- | --- |\n| 1234 | 2004 | 20.5 |\n| 1234 | 2005 | 22.0 |\n| 1234 | 2006\
    \ | 26.0 |\n| 1234 | 2007 | 27.0 |\n| 1234 | 2008 | 37.0 |\n\n# Listing of data\
    \ set Goals\n\n| Year | Goal |\n| --- | --- |\n| 2004 | 20 |\n| 2005 | 21 |\n\
    | 2006 | 24 |\n| 2007 | 28 |\n| 2008 | 34 |\n\nYou can use a MERGE statement to\
    \ add the Goal values to each observation in the Sales data set like this:\n\n\
    # Program 6.1: Using a MERGE to perform a table lookup\n\n```\nproc sort data=Goals;\n\
    \  by Year;\nrun;\n\nproc sort data=Sales;\n  by Year;\nrun;\n\ndata Sales_Goals;\n\
    \  merge Goals Sales;\n  by Year;\n  Difference = Sales - Goal;\nrun;\n\nproc\
    \ sort data=Sales_Goals;\n  by Sales_ID Year;\nrun;\n```"
  - '[PAGE 88]


    First, you need to sort each data set by Year (if it is not already in the correct
    order). Next, you perform a MERGE between the two data sets, Year as the BY variable.
    In this example, you want to see the difference between actual sales and goals
    for each sales person. The final Sort places the observations in Sales_ID order.
    The resulting data set is shown next:


    | Year | Goal | Sales_ID | Sales | Difference |

    |---|---|---|---|---||

    | 2004 | 20 | 1234 | 20.5 | 0.5 |

    | 2005 | 21 | 1234 | 22.0 | 1.0 |

    | 2006 | 24 | 1234 | 26.0 | 2.0 |

    | 2007 | 28 | 1234 | 27.0 | -1.0 |

    | 2008 | 34 | 1234 | 37.0 | 3.0 |


    You can improve the efficiency of this operation by using temporary arrays or
    formats (or informats). This is the topic of the next two tasks.


    # Task: Performing a one-way table lookup using user-defined informats


    # Keywords


    +   Table lookup


    +   Informats


    +   Input function


    User-defined formats and informats provide you with an extremely powerful tool
    for performing table lookup. One advantage of this technique is that formats are
    stored in memory, making the task fast and efficient. The reason you might prefer
    an informat over a format is that you can use an informat in an INPUT function
    to create a numeric variable. You will see an example of this in the next program.
    If you use a format and a PUT function, you will create a character variable.


    This first example shows how to create an informat and use that to perform the
    lookup. Following this task, you will see how to use a SAS data set to create
    a control data set that, in turn, creates the informat.'
  - '[PAGE 89]


    You create an informat much the same you create a format. Instead of using a VALUE
    statement, you use an INVALUE statement. The informat called Goalfmint is created
    in the short program shown here:


    # Program 6.2: Creating a user-defined informat to be used for table lookup


    ```

    *Creating the FORMAT "manually" using PROC FORMAT;

    proc format;

    invalue Goalfmint 2004-20

    2005-21

    2006-24

    2007-28

    2008-34

    2009-40

    2010-49

    2011-60

    2012-75;

    run;

    ```


    Notice how this code resembles the creation of a format. There are two differences:
    You use the keyword INVALUE instead of VALUE, and you do not place the values
    to the right of the equal signs in quotes. Goalfmint is a numeric informat, and
    the result of using it in an INPUT statement or function is a numeric. The next
    step is to use this informat in a DATA step to perform your lookup:


    # Program 6.3: Using the informat to perform the table lookup


    ```

    data Sales_Goals;

    set Sales;

    Goal = input(put(Year,4.),goalfmint);

    Difference = Sales - Goal;

    run;

    ```


    The INPUT function takes a SAS value as the first argument and "reads" it using
    the INFORMAT listed as the second argument. You need the PUT function in this
    example because the first argument must be a character value. (You could leave
    it out, and SAS will perform a character-to-numeric conversion automatically and
    it will print a numeric character to the Log. However, this is not recommended.)


    Suppose the first year in the Sales data set is 2008. The Goalfmint converts this
    value to the numeric value 34, and assigns this value to the variable Goal. Because
    creating an informat (or format) can be tedious, the next section describes how
    to use a control data set to create formats.'
  - "[PAGE 90]\n\n# Task: Creating an INFORMAT using a control data set\n\n# Keywords\n\
    \n+   Control data set\n\n+   Informs\n\nYou can create a format or informat using\
    \ a Control data set. You can read about how to create formats using a control\
    \ data set in the previous chapter. Here, you will see how to create an informat\
    \ using this same technique.\n\nIf you want to create an informat rather than\
    \ a format, the format name must start with an @ sign and the variable called\
    \ Type must be set to \"I\" (stands for Informat). You can create a control data\
    \ set from the Goals data set by renaming the variables and the Fmtname and Type\
    \ variables. Here is the code:\n\n# Program 6.4: Using a control data set to create\
    \ an informat\n\n```\n*Creating the INFORMAT using a CNTLIN data set;\ndata Control;\n\
    \  set Goals(rename=(Year=Start Goal=Label));\n  retain Fmtname '@goalfmt' Type\
    \ 'I';\nrun;\n\nproc cntlin=Control;\n  select @goalfmt;\nrun;\n```\n\nYou want\
    \ Year to be the start value (if there were a range instead of a single value,\
    \ you would also have to define an End value), and Goal to be the label. An efficient\
    \ way to assign the values of Fmtname and Type is with a RETAIN statement (as\
    \ explained in the first task in Chapter 5)."
