    \ 19\n\n## 引言\n\n本章描述了如何使用年龄或收入等单个值，并创建代表组的新变量。例如，你可能想按 20 年一个间隔对年龄进行分组，或者你可能想将收入转换为十分分位数。在本章中，你将看到实现这些目标的几种方法。\n\
    \n## 任务：使用 IF-THEN-ELSE 语句对值进行分组\n\n- 关键字\n- 值分组\n- If-Then-Else 语句\n\n在这个示例中，你有一个名为\
    \ `Heart_Rate` 的变量，代表人的每分钟心跳次数。在所有的 SAS 编程中，假设 `Heart_Rate` 可能是缺失值。以下是代码：\n\n\
    ### 程序 2.1：使用 IF-THEN-ELSE 逻辑对值进行分组\n\n```\n*Grouping values using if-then-else\
    \ statements;\ndata Grouped;\nlength HR_Group ($10);\nset Blood_Pressure(keep=Sub\
    \ Heart_Rate);\nif missing(Heart_Rate) then HR_Group = ' ';\nelse if Heart_Rate\
    \ < 40 then HR_Group = '<40';\nelse if Heart_Rate < 60 then HR_Group = '40-60';\n\
    else if Heart_Rate < 80 then HR_Group = '60-80';\nelse if Heart_Rate < 100 then\
