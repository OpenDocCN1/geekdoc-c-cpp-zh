    \n## 任务：提供一个用于计算移动平均的宏\n\n## 关键词\n\n移动平均\n\n如果你经常需要计算移动平均值，或者你想对大量数据点的平均值，你可能希望使用这里提供的宏。调用宏\
    \ `Moving_Ave` 时需要输入数据集名称、包含输入数据集所有变量以及移动平均值的新数据集名称、要赋值的变量名称，以及每个平均值包含的观测值数量。\n\
    \n随后是该宏工作原理的简要说明：\n\n## 程序 12.9：提供一个用于计算移动平均的宏\n\n```sas\n*Presenting a macro\
