  - '[PAGE 139]


    # Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    You can now use the macro variable in other DATA steps. For example, to list the
    last five observations

    in the Stocks data set, you could use the following program:


    # Program 12.3: Listing the last five observations in data set Stocks


    ```

    %let Start = eval(N_of_obs - 4);

    data Last_Five;

    set Stocks(firstobs=%Start);

    run;

    ```


    The %LET statement creates another macro variable (Start) that is equal to the
    number of observations

    in the Stocks data set minus 4. You need the %EVAL function to compute the Start
    value

    because all macro values are text and cannot subtract 4 from a text value. The
    %EVAL function tells the program to treat each macro value as a number and perform
    the specified arithmetic.


    Using value of Start with the FIRSTOBS= data set option gives you the last five
    observations in the

    data set. Here is the listing:


    | Date | Price |

    | 22FEB2012 | 31 |

    | 23FEB2012 | 31 |

    | 24FEB2012 | 33 |

    | 27FEB2012 | 37 |

    | 28FEB2012 | 33 |


    # Task: Determining the number of observations in a SAS data set (using library
    tables)


    # Keywords


    +   - Number of observations


    +   - Library tables


    SAS tables contain metadata relating to your data sets, and you can obtain this
    information from

    SASHELP8.VTABLE by specifying the LIBNAME and the name of the data set you are
    interested in.

    This method of determining the number of observations in a SAS data set has an
    advantage over

    the previous methods described so far. That is, if you (or other people) are modifying
    a data set, you need

    to know the total number of observations in a data set as well as the number of
    observations that have

    been marked for deletion (but are still counted when you use the NOBS= SET option).'
  - '[PAGE 140]


    The next program demonstrates how to use library tables to determine the number
    of observations in the Stocks data set:


    # Program 12.4: Determining the number of observations in a data set using library
    tables


    ```

    data

    _null;;

    set sashelp.vtable;

    where libname="WORK" and memname="STOCKS";n**Note:you must use uppercase values
    for libname and memname;

    **Num_nobs= total number of observations, including deleted ones

    Delobs is the number of deleted observations;

    put Delobs: = num_obs;

    run;

    ```


    It is important to remember that the libname and memname must be entered in uppercase,
    because that is the way they are stored in the table. The two variables you need
    from the table are Nobs (the total number of observations including ones marked
    for deletion) and Delobs (the number of observations marked for deletion). When
    you run this program, the line produced by the PUT statement is:


    ```

    nobs = num_obs = 42

    ```


