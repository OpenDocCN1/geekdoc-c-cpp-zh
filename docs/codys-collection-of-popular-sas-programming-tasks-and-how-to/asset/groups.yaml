- md: "\n# Chapter 1: Tasks Involving Conversion\n\nMy son, who is a student at programming,\
    \ suggested I solve this problem using a Perl regular expression. This solution\
    \ is not simpler than the previous solution, but it demonstrates the versatility\
    \ of regular expressions.\n\nYou start by using PRXPARSE to compile the regular\
    \ expression:\n\n`/^(\\d+)(\\D)/`\n\nThis regex is what Perl calls regular expressions\
    \ is looking for one or more digits followed by a non-digit. The \"^\" in the\
    \ beginning of the expression says to start the search at the beginning of the\
    \ string. The digit and non-digit values will be placed in capture buffers because\
    \ each of these expressions is a set of parentheses. You use the PRMATCH function\
    \ to search for the pattern of a number followed by a nonnumber. The PRXPOSN function\
    \ extracts the values in each of the capture buffers. The INPUT function performs\
    \ the character-to-numeric conversion as in the previous task.\n\nIf the value\
    \ in the capture buffer is 'K', you perform the kilogram to pound conversion.\n\
    \n# Program 1.8: Using a Perl regular expression to extract the digit and units\
    \ part of a capture variable\n\n```\n*Solution using Perl regular expressions;\n\
    Data Units:\n  set Units (drop=Height);\n  if n = 1 then do\n    Regex = \"(\\\
    d+)(\\D)\n```\n\nThe resulting data set contains values for Weight_Lbs that are\
    \ identical to the previous task.\n\n# Conclusion\n\nIt is quite likely that you\
    \ will need to perform one of the tasks described in this chapter on a regular\
    \ basis. The character-to-numeric conversion is one of the most common tasks,\
    \ you may choose to store the conversion in your macro library.\n\nAlso keep in\
    \ mind that using the special keywords _NUMERIC_ and _CHARACTER to define an array\
    \ can save you immense time when you need to perform an operation on all character\
    \ or numeric variables in a data set.\n\nCody, Ron, Cody's Collection of Popular\
    \ SAS® Programming Tasks and How to Tackle Them. Copyright © 2012, SAS Institute\
    \ Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/bookstore.\n\n# Chapter 2: Grouping Data\n\n- Introduction\
    \ .....................................................................................................\
    \ 13\n- Task: Grouping values using IF-THEN-ELSE statements ...........................................\
    \ 13\n- Task: Grouping values using user-defined formats ................................................\
    \ 14\n- Task: Creating groups using PROC RANK ................................................................\
    \ 15\n- Conclusion ...............................................................................................................\
    \ 19\n\n## Introduction\n\nThis chapter describes how to use individual values\
    \ such as ages or income and create new variables that represents groups. For\
    \ example, you may want to group ages in 20-year intervals or you may want to\
    \ convert income into deciles. In this chapter, you will see several ways to accomplish\
    \ these goals.\n\n## Task: Grouping values using IF-THEN-ELSE statements\n\n-\
    \ Keywords\n- Grouping values\n- If-Then-Else statement\n\nFor this example, you\
    \ have a variable called Heart_Rate that represents a person's heart rate in beats\
    \ per minute. With all SAS programming, assume that Heart_Rate may be a missing\
    \ value. Here is the code:\n\n### Program 2.1: Using IF-THEN-ELSE logic to group\
    \ values\n\n```\n*Grouping values using if-then-else statements;\ndata Grouped;\n\
    length HR_Group ($10);\nset Blood_Pressure(keep=Sub Heart_Rate);\nif missing(Heart_Rate)\
    \ then HR_Group = ' ';\nelse if Heart_Rate < 40 then HR_Group = '<40';\nelse if\
    \ Heart_Rate < 60 then HR_Group = '40-60';\nelse if Heart_Rate < 80 then HR_Group\
    \ = '60-80';\nelse if Heart_Rate < 100 then HR_Group = '80-100';\nelse HR_Group\
    \ = '100+';\nrun;\n```\n\nThe first step is to use a LENGTH statement to define\
    \ the length of the HR_Group variable. We use the MISSING function to test if\
    \ Heart_Rate is missing. If so, set HR_Group to a character value. Once you do\
    \ this, it is straightforward to test the Heart_Rate values and create HR_Group\
    \ variable. Here are the first 10 observations from data Grouped:\n\nListing of\
    \ data set Grouped\n\n| HR_Group | Subj | Heart_Rate |\n|---|---|---|\n| 60-<80\
    \ | 1 | |\n| 60-<80 | 2 | |\n| 60-<80 | 3 | |\n| 60-<80 | 4 | |\n| 60-<80 | 5\
    \ | |\n| 80-<100 | 6 | |\n| 40-<60 | 7 | |\n| 40-<60 | 8 | |\n| 40-<60 | 9 | |\n\
    | 60-<80 | 10 | |\n\n## Task: Grouping values using user-defined formats\n\n-\
    \ Keywords\n- Grouping data\n- Formats\n- PUT function\n\nYou can use a format\
    \ with a PUT function to accomplish the same goal as the previous example. This\
    \ technique is easy to program—it is also an efficient method for grouping values.\
    \ The first step is to define a format with your desired ranges. Then you can\
    \ use a PUT function to create the new variable representing your groups. This\
    \ example places heart rates into the same groups as the previous example:\n\n\
    ### Program 2.2: Using formats to group variables\n\n```\n*Grouping values using\
    \ formats;\nproc format;\nvalue HRGrp\n  0 - 39 = '<40'\n  40 - 59 = '40-60'\n\
    \  60 - 79 = '60-80'\n  80 - 99 = '80-100'\n  100 - high = '100+';\nrun;\n\ndata\
    \ Grouped;\n  set Blood_Pressure(keep=Sub Heart_Rate);\n  HR_Group = put(Heart_Rate,\
    \ HRGrp);\nrun;\n```\n\nYou name the format HRGrp and use the same ranges as used\
    \ previously. Next, you read Heart_Rate and use a PUT function to create HR_Group.\
    \ You do not need to use a LENGTH statement because SAS uses the longest length\
    \ for the new variable. Missing values are not a problem. If Heart_Rate is missing,\
    \ HR_Group will also be missing (because it does not match any of the ranges you\
    \ have defined in the format, it remains a missing value). Values for HR_Group\
    \ are identical to the values in the previous program.\n\n## Task: Creating groups\
    \ using PROC RANK\n\n- Keywords\n- Grouping data\n- PROC RANK\n- Deciles\n\nAnother\
    \ way to group data is to put your values into a number of equal groups. This\
    \ is especially useful for creating statistical models with variables that have\
    \ highly skewed distributions. For example, you may want to include income in\
    \ a predictive model. Since income is usually skewed (that is, there are some\
    \ values much larger than the average), you may decide to create deciles (10 equal\
    \ groups) of income. You can use PROC RANK to convert a continuous variable into\
    \ any number of equal groups. Before you get started with the task at hand, take\
    \ a moment to review PROC RANK.\n\nThe syntax is:\n\n```\nPROC RANK DATA=data-set-name\
    \ OUT=output-data-name GROUPS=n;\n  VAR list of variables;\n  RANKS list of variables\
    \ holding the rank values;\nrun;\n```\n\nHere is a simple example that demonstrates\
    \ how PROC RANK works when you include the GROUPS option. Data set Raw_Data contains\
    \ three variables: Subj, X, and Y, and four observations. Here is a listing:\n\
    \n| Subj | X | Y |\n|---|---|---|\n| 001 | 3 | 10 |\n| 002 | 7 | 20 |\n| 003 |\
    \ 2 | 30 |\n| 004 | 4 | 40 |\n\nFirst, run PROC RANK without the GROUPS= option\
    \ like this:\n\n### Program 2.3: Demonstrating PROC RANK\n\n```\nproc rank data=Raw_Data\
    \ out=Rank_Data;\n  var X;\n  ranks Rank_X;\nrun;\n```\n\nYou want to create a\
    \ new data set (Rank_Data) that contains a new variable you decided to call Rank_X.\
    \ Values of this variable are the ranks of X. If you supply a list of variables\
    \ on the VAR statement, be sure to include another list that contains the same\
    \ number of variables on the RANKS statement. Each variable you list on the RANKS\
    \ statement will be the rank of the corresponding variable on the VAR statement.\n\
    \nTo create ranks, PROC RANK sorts the values of the variables you specify on\
    \ the VAR statement and gives the smallest value a rank of 1, the next smallest\
    \ value a rank of 2, and so forth. Here is a listing of data set Rank_Data:\n\n\
    | Subj | X | Y | Rank_X |\n|---|---|---|---|\n| 001 | 3 | 10 | 2 |\n| 002 | 7\
    \ | 20 | 4 |\n| 003 | 2 | 30 | 1 |\n| 004 | 4 | 40 | 3 |\n\nThere are several\
    \ things to notice about this output data set. First, Rank_X represents the ranks\
    \ of variable X. By default, if you leave out the RANKS statement, PROC RANK will\
    \ replace the original variables (X in this example) with the ranks of these variables.\
    \ I strongly recommend that whenever you use PROC RANK, both VAR and RANKS statements.\n\
    \nNext, notice variable Y is in the output data set even if Y was not listed on\
    \ the VAR statement. This is a feature of PROC RANK: every variable in the input\
    \ data set is included in the output data set. Therefore, if you don't want all\
    \ the variables in the input data set to appear in the output data set, leave\
    \ a KEEP= option on the input data set, listing the variables you want.\n\nTo\
    \ divide into groups use the option GROUPPS=2 like this:\n\n### Program 2.4: Demonstrating\
    \ the GROUPPS=option of PROC RANK\n\n```\nproc rank data=Raw_Data (keep=Subj X)\
    \ out=Rank_Data groups=2;\n  var X;\n  ranks Rank_X;\nrun;\n```\n\nYou include\
    \ a KEEP= data set option so that the output data set will only contain the variables\
    \ Subj, X, and Rank_X.\n\nHere is the result:\n\n| Subj | X | Rank_X |\n|---|---|---|\n\
    | 001 | 3 | 0 |\n| 002 | 7 | 0 |\n| 003 | 2 | 0 |\n| 004 | 4 | 1 |\n"
  mdcn: "\n\n# 第1章：涉及转换的任务\n\n我的儿子是一名学习编程的学生，他建议我使用 Perl 正则表达式来解决这个问题。这个解决方案并不比之前的方案简单，但它展示了正则表达式的灵活性。\n\
    \n首先，你使用 `PRXPARSE` 来编译正则表达式：\n\n`/^(\\d+)(\\D)/`\n\n这个正则就是 Perl 所说的正则表达式，它在寻找一个或多个数字，后面紧跟一个非数字字符。表达式开头的\
    \ \"^\" 表示从字符串的开头开始搜索。数字和非数字值将被置于捕获缓冲区（capture buffers）中，因为这些表达式每一个都是一组括号。你使用\
    \ `PRMATCH` 函数来搜索数字后跟非数字的模式。使用 `PRXPOSN` 函数提取每个捕获缓冲区中的值。`INPUT` 函数执行与上一个任务相同的字符到数字的转换。\n\
    \n如果捕获缓冲区中的值为 'K'，则执行从千克到磅的转换。\n\n# 程序 1.8：使用 Perl 正则表达式提取捕获变量的数字和单位部分\n\n```\n\
    *Solution using Perl regular expressions;\nData Units:\n  set Units (drop=Height);\n\
    \  if n = 1 then do\n    Regex = \"(\\d+)(\\D)\n```\n\n结果的数据集包含 Weight_Lbs 的值，这与上一个任务相同。\n\
    \n# 结论\n\n你很可能需要定期执行本章中描述的任务之一。字符到数字的转换是最常见的任务之一，你可以选择将此转换存储在你的宏库中。\n\n此外请记住，使用特殊关键字\
    \ `_NUMERIC_` 和 `_CHARACTER` 来定义数组，当你对数据中的所有字符或数值变量进行操作时，可以节省大量时间。\n\nCody, Ron,\
