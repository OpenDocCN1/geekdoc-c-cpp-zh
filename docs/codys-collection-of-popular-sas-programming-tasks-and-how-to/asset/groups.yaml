    # Introduction


    You can use procedures such as PROC MEANS, PROC UNIVARIATE, and PROC TABULATE
    to

    print summary information such as means, medians, standard deviations, etc., but
    there are occasions

    where you need this summary information in a SAS data set.'
  - '[PAGE 43]


    # 22 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    You might use this information for further analysis or you might need to combine
    this summary information with the detail information in your original SAS data
    set.


    This chapter describes how to accomplish these tasks.


    # Task: Using PROC MEANS to create a data set containing summary information


    # Keywords


    +   * PROC MEANS


    +   * Summary data set


    +   * Grand mean


    Let''s start out by computing the mean of all observations and outputting this
    value to a SAS data set. Later in this chapter, you will see how to combine data
    in one data set with detail in another. This program uses the Blood_Pressure data
    set and computes the mean for the variable Heart_Rate.


    # Program 3.1: Computing the mean of all observations and outputting it to a SAS
    data set


    ```

    *Computing the mean of all observations and outputting it to a

    SAS data set;

    proc means data=Blood_Pressure noprint;

    var Heart_Rate;

    out=Summary(keep=Mean_HR) mean=Mean_HR;

    run;

    ```


    The NOPRINT option instructs the program not to produce any output because you
    only want the value in a SAS data set. You may, if you wish, produce both printed
    output and a data set. List the variables to summarize with a VAR statement. In
    this example, you only want statistics on Heart_Rate. The OUTPUT statement is
    an instruction to PROC MEANS that you want to create an output data set. Name
    the data set following the single variable OUT=. The KEEP= data set option in
    the output data set requests only the single variable Mean_HR in the output data
    set. Without this KEEP= data set option, PROC MEANS adds two other variables in
    the output set: _TYPE_and _FREQ (about these later). Here is a listing of data
    set Summary:


    | Mean_HR |

    | 69.3448 |


    This small (OK, very small) data set contains a single observation and one variable
    (the mean Heart_Rate).


    Cody, Ron. Cody''s Collection of Popular SAS® Programming Tasks and How to Tackle
    Them. Copyright© 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS
    RESERVED. For additional SAS resources, visit support.sas.com/bookstore.'
  - '[PAGE 44]


    # Task: Computing the mean of a variable broken down by values of another variable:
    Using a BY variable


    Keywords

    PROC MEANS

    BY variable

    Summary data set


    The next task is similar to the previous task except that this time you want to
    output means for each of a BY variable. You first need to sort the data set (in
    this example by Drug) and then run PROC MEANS. Here is the code:


    ```

    *Computing the mean for each value of a BY variable;

    proc sort data=Blood_Pressure;

    by Drug;

    run;


    proc means data=Blood_Pressure noprint;

    var Heart_Rate;

    output out=Summary mean=Mean_HR;

    run;

    ```


    Program 3.2: Computing the mean for each value of a BY variable


    Notice that in this case, the KEP= data set option was not used. This allows you
    to see exactly what PROC MEANS places in its output data set. Here is the listing
    of:


    | Drug | TYPE | FREQ | Mean_HR |

    |---|---|---|--|

    | Drug A | 0 | 20 | 73.3000 |

    | Drug B | 0 | 20 | 65.3500 |

    | Placebo | 0 | 20 | 69.3889 |


    This data set contains the mean Heart_Rate for each of the three values of Drug.


    When you use a BY statement to create an output data set with PROC MEANS, the
    _TYPE_ variable will always be zero. Later, when you use a CLASS statement, this
    variable will take on different values and can be quite useful. The variable _FREQ_
    tells you the number of observations in each of the three Drug groups (missing
    and non-missing).'
- md: "\n# Task: Computing the mean of a variable broken down by values of another\
    \ variable: Using a CLASS statement\n\n## Keywords\n- PROC MEANS\n- CLASS statement\n\
    - Summary data set\n\nYou can accomplish the same goal as the previous example\
    \ by using a CLASS statement instead of a BY statement. The resulting data set,\
    \ however, is not the same. This is important.\n\nIt is not necessary to sort\
    \ your data when you use a CLASS statement. Here is the code, followed by a listing\
    \ of the output data set:\n\n## Program 3.3: Using PROC MEANS with a CLASS statement\
    \ to create a summary data set\n\n```sas\n*Using PROC MEANS to create a summary\
    \ data set;\nproc means data=Blood_Pressure noprint;\nclass Drug;\nvar Heart_Rate;\n\
    output out=Summary mean=Mean_HR;\nrun;\n```\n\nAnd here is a listing of data set\
    \ Summary:\n\n| Drug | _TYPE_ | FREQ | Mean_HR |\n|---|---|---|---|\n| | 0 | 60\
    \ | 69.3448 |\n| Drug A | 1 | 20 | 73.3000 |\n| Drug B | 1 | 20 | 65.3500 |\n\
    | Placebo | 1 | 20 | 69.3889 |\n\nNotice that this data set contains more observation\
    \ than the data set created using a BY statement. The first observation (_TYPE\
    \ = 0) is the mean of all the non-missing observations. Heart Rate in the Blood_Pressure\
    \ data set represent the mean Heart_Rate for each value of Drug. Since you probably\
    \ do not want the grand mean in your output data set, the NWAY option with PROC\
    \ MEANS. This option instructs the procedure to output only the means for each\
    \ combination of the CLASS variable(s).\n\nThe next program is identical to this\
    \ program except that the NWAY option was included:\n\n## Program 3.4: Demonstrating\
    \ the NWAY option of PROC MEANS\n\n```sas\n*Demonstrating the NWAY option;\nproc\
    \ means data=Blood_Pressure noprint nway;\nclass Drug;\nvar Heart_Rate;\noutput\
    \ out=Summary mean=Mean_HR;\nrun;\n```\n\nHere is the resulting output data set:\n\
    \n| Drug | TYPE | FREQ | Mean_HR |\n|---|---|---|---|\n| Drug A | 1 | 20 | 73.3000\
    \ |\n| Drug B | 1 | 20 | 65.3500 |\n| Placebo | 1 | 20 | 69.3889 |\n\nThis data\
    \ set contains only the Heart_Rate for each value of Drug—the grand mean is no\
    \ longer included.\n\n## Task: Have PROC MEANS name the variables in the output\
    \ data set automatically (the AUTENAME option)\n\n## Keywords\n- AUTENAME\n- PROC\
    \ MEANS\n- Summary data set\n\nYou can request PROC MEANS name all the variables\
    \ in the output data set by using the OUTPUT option called AUTENAME. This option\
    \ creates variable names in the output data set by using the variable names on\
    \ the VAR statement and adding a suffix related to the requested statistic. For\
    \ example, if you have a variable called Heart_Rate and you request a mean, the\
    \ variable name that PROC MEANS creates Heart_Rate_Mean. That is, it takes the\
    \ name of the statistic, adds an underscore, and the name of the requested statistic.\
    \ The following program requests four statistics (n, mean, min, and max) and uses\
    \ the AUTENAME option to name the newly created variables:\n\n## Program 3.5:\
    \ Demonstrating the AUTONAME option on the OUTPUT statement in PROC MEANS\n\n\
    ```sas\n*Demonstrating the AUTONAME option;\nproc means data=Blood_Pressure noprint\
    \ nway;\nclass Drug;    var Heart_Rate;\noutput out=Summary(drop=_type_ _freq_)\n\
    \    n= mean= min max= / autoname;\nrun;\n```\n\nBecause AUTONAME is an option\
    \ on the OUTPUT statement, you place the option following a forward slash. Notice\
    \ that you follow each statistic by an equal sign but do not include any variable\
    \ names following the equal sign. This is a very useful option and by using it,\
    \ you will always have consistent names in your. Since you do not need the _TYPE_\
    \ variable in the output data set. You may also drop _FREQ_ as shown in this program.\
    \ Here is a listing of data set Summary:\n\n| Drug | Heart_Rate_N | Heart_Mean\
    \ | Heart_Min | Heart_Rate_Max |\n|---|---|---|---|---|\n| Drug A | 20 | 73.3000\
    \ | 42 | 98 |\n| Drug B | 20 | 65.3500 | 37 | 89 |\n| Placebo | 18 | 69.3899 |\
    \ 38 | 116 |\n\n## Task: Creating multiple output data sets from PROC MEANS, each\
    \ with a different combination of CLASS variables\n\n## Keywords\n- PROC option\n\
    - CHARTYPE option\n- Summary data set\n\nThere are times when you want summary\
    \ data sets for various combinations of your CLASS variables. For example, you\
    \ may want to see the average heart rate for each level of Drug, each level of\
    \ Gender, and each combination of Drug and Gender. As you previously, if you leave\
    \ off the NWAY option the output data set will contain all of these values, with\
    \ _TYPE_.\n\nThe interpretation of the values of _TYPE_ is somewhat complicated.\
    \ To make things easier, use the CHARTYPE procedure to convert _TYPE_ to a character\
    \ string of ones and zeros. An explanation of this string is provided following\
    \ the output.\n\n## Program 3.6: Demonstrating the CHARTYPE option with PROC MEANS\n\
    \n```sas\n*Demonstrating the CHARTYPE option;\nproc means data=Blood_Pressure\
    \ noprint chartype;\nclass Drug Gender;\nvar Heart_Rate;\noutput out=Summary mean=Mean_HR;\n\
    run;\n```\n\nA listing of data summary is shown:\n\n| | Gender | _TYPE_ | FREQ\
    \ | Mean_HR |\n|---|---|---|---|---|\n| | 00 | 58 | 69.2500 |\n| | F | 01 | 28\
    \ | 71.3846 |\n| | M | 01 | 30 | 67.4000 |\n| Drug A | 10 | 20 | 73.3000 |\n|\
    \ Drug B | 10 | 20 | 65.3500 |\n| Placebo | 10 | 18 | 69.0625 |\n| Drug A | F\
    \ | 11 | 10 | 81.2000 |\n| Drug A | M | 11 | 10 | 65.4000 |\n| Drug B | F | 11\
    \ | 10 | 63.9000 |\n| Drug B | M | 11 | 10 | 66.8000 |\n| Placebo | 11 | 8 | 67.5000\
    \ |\n| Placebo | M | 11 | 10 | 70.0000 |\n\nThe four values of _TYPE_ are '00',\
    \ '01', '10', and '11'. Here's how to interpret these values: The CLASS variables\
    \ are Drug and Gender. Imagine that the first character of _TYPE_ under Drug,\
    \ and the second character of _TYPE_ under Gender. When you have a '1' under your\
    \ variable variable values you see are mean for each level of CLASS variable.\
    \ When you have a '0' under your class variable, the values you see are all levels\
    \ of CLASS variable, as shown in the following table:\n\n| Class | Drug | Gender\
    \ | Interpretation |\n|---|---|---|---|\n| 0 | 0 | The grand mean—all Drugs and\
    \ all Genders |\n| 0 | 1 | Mean heart rate for each value of Gender |\n| 1 | 0\
    \ | Mean heart rate for each value of Drug |\n| 1 | 1 | Mean heart rate for each\
    \ combination of Drug and Gender |\n\n## Program 3.7: Using the _TYPE_ variable\
    \ to send summary data to separate sets\n\n```sas\ndata Grand(drop Drug Gender)\n\
    ByGender(drop=Gender)\nByDrug(drop=Drug)\nByGender;\ndrop _type _freq_\nset Summary;\n\
    if _type_ = '00' then output Grand;\nelse if _type_ = '01' then output ByGender;\n\
    if _type_ = '10' then output ByDrug;\nif _type_ = '11' then output DrugGender;\n\
    run;\n```\n\nThis single DATA step produces four data sets. Because the value\
    \ of Drug is missing for all observations in the ByGender set and the value of\
    \ Gender is missing for all observations in the ByDrug set, you use a DROP= data\
    \ option to remove these variables. Here is a listing of each of these sets:\n\
    \nData set Grand\n| Mean_HR |\n| 69.25 |\n\nData set ByGender\n| Gender | Mean_HR\
    \ |\n| F | 71.3846 |\n| M | 67.4000 |\n\nData set ByDrug\n| Drug | Mean_HR |\n\
    | Drug A | 73.3000 |\n| Drug B | 65.3500 |\n| Placebo | 69.0625 |\n\nData set\
    \ ByDrugGender\n| Drug | Gender | Mean_HR |\n|---|---|---|\n| Drug A | F | 81.2\
    \ |\n| Drug A | M | 65.4 |\n| Drug B | F | 63.9 |\n| Drug B | M | 66.8 |\n| Placebo\
    \ | F | 67.5 |\n| Placebo | M | 70.0 |\n\nYou can now see how useful the CHARTYPE\
    \ option can be.\n"
