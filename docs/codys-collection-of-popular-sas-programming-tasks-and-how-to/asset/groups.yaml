    \ observations (records)\n\n# Keywords\n\n+   - PROC SORT\n- Duplicates\n- NODUPKEY\n\
    - NODUPRECS\n\nThe data set Duplicates was created to demonstrate how to detect\
    \ duplicate BY variables or duplicate observations in a SAS data set. Here is\
    \ a listing:\n\n| Subj | Gender | Age | Height | Weight |\n|---|---|---|---|---||\n\
    | 001 | M | 23 | 63 | 122 |\n| 002 | F | 44 | 59 | 109 |\n| 002 | F | 44 | 59\
    \ | 109 |\n| 003 | M | 87 | 67 | 200 |\n| 004 | F | 100 | 53 | 112 |\n| 004 |\
    \ F | 50 | 59 | 201 |\n| 005 | M | 45 | 69 | 188 |\n\nSome subjects only have\
    \ one observation. Subject 002 has a duplicate observation (the same value for\
    \ all variables), while subject 004 has observations with the same subject number\
    \ but different values for the other variables.\n\nYou can use PROC SORT to detect\
    \ both of these conditions and remove either type of duplicate.\n\nYou can use\
    \ the NODUPKEY option to remove any observations that have duplicate values on\
    \ each of the BY variables. Suppose you want one observation for each of the subjects\
    \ in the Duplicates set. Use the NODUPKEY option as follows:\n\n# Program 11.1:\
    \ Demonstrating the NODUPKEY option of PROC SORT\n\n```\n* Using PROC SORT to\
    \ detect duplicate By values;\nproc sort data=Duplicates out=nodupkey;\n  by Subj;\n\
    run;\n```"
- md: "\n## Chapter 11: Tasks Involving Multiple Observations per Subject\n\nSince\
    \ there is only one BY listed, the output data set (Sorted) will keep the first\
    \ observation for each subject and remove all other observations with the same\
    \ subject number. PROC SORT sorts information about the Log, as shown here:\n\n\
    NOTE: There were 7 observations read from the data set WORK.DUPLICATES.\nNOTE:\
    \ 2 observations with duplicate key values were deleted.\nNOTE: The data set WORK.SORTED\
    \ has 5 observations and 5 variables.\n\nYou see here that two observations with\
    \ duplicate key (BY) values were deleted. Here is the listing:\n\n| Subj | Gender\
    \ | Age | Height | Weight |\n|---|---|---|---|--|\n| 001 | M | 23 | 63 | 122 |\n\
    | 002 | F | 44 | 59 | 109 |\n| 003 | M | 87 | 67 | 200 |\n| 004 | F | 100 | 53\
    \ | 112 |\n| 005 | M | 45 | 69 | 188 |\n\nThe next program demonstrates the NODUPRECS\
    \ option.\n\nThe NODUPRECS option (also called NODUP) removes duplicate observations,\
    \ observations that have the same value for all variables. In previous versions\
    \ of SAS, this option was called NODUP and you can still use that. However, this\
    \ author believes that it is better to use NODUPRECS because it makes it clearer\
    \ to someone reading the program that you are removing duplicate observations\
    \ (records).\n\nThe next program demonstrates this option:\n\n### *12. Demonstrating\
    \ the NODUPRECS option of PROC SORT\n\n```sas\n*Using PROC SORT to detect duplicate\
    \ records;\nproc sort data=Duplicates out=noduprecs;\nby Subj;\nrun;\n```\n\n\
    The resulting SAS Log and output are shown here:\n\nNOTE: There were 7 observations\
    \ read from the data set WORK.DUPLICATES.\nNOTE: 1 duplicate observations were\
    \ deleted.\nNOTE: The data set WORK.SORTED has 6 observations and 5 variables.\n\
    \nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute Inc.\nCary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\n\
    Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\n\
    This time only one observation (from Subj 002) was removed. Here is the listing:\n\
    \n| Subj | Gender | Age | Height | Weight |\n|---|---|---|---|---|\n| 001 | M\
    \ | 23 | 63 | 122 |\n| 002 | F | 44 | 59 | 109 |\n| 003 | M | 87 | 67 | 200 |\n\
    | 004 | F | 100 | 53 | 112 |\n| 004 | F | 50 | 59 | 201 |\n| 005 | M | 45 | 69\
    \ | 188 |\n\nThere is a possible problem when you use the NODUPRECS option. First\
    \ take a look at a listing of data set Multiple:\n\n| Subj | X | Y |\n|---|---|--|\n\
    | 001 | 1 | 2 |\n| 001 | 3 | 2 |\n| 001 | 1 | 2 |\n| 002 | 5 | 7 |\n| 003 | 7\
    \ | 8 |\n| 003 | 7 | 8 |\n| 005 | 4 | 5 |\n\nAll of the observations in **bold**\
    \ represent duplicate observations. Let's see what happens when you run PROC SORT\
    \ with the NODUPRECS option:\n\n### Program 11.3: Demonstrating a possible problem\
    \ with the NODUPRECS option\n\n```sas\n*Demonstrating a feature of noduprecs;\n\
    proc sort data=Multiple out=Features noduprecs;\nby Subj;\nrun;\n```\n\nCody,\
    \ Ron. Cody's Collection of Popular SAS® Programming Tasks and How to Tackle Them.\
    \ Copyright © 2012, SAS Institute, Inc.\nNorth Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/bookstore.\n\n## Chapter\
    \ 11: Tasks Involving Multiple Observations per Subject\n\nHere is the surprising\
    \ result:\n\n# Listing of data set Features\n\n| Subj | X | Y |\n|---|---|---|\n\
    | 001 | 1 | 2 |\n| 001 | 3 | 2 |\n| 001 | 1 | 2 |\n| 002 | 5 | 7 |\n| 003 | 7\
    \ | 8 |\n| 005 | 4 | 5 |\n\nThe duplicate observation for subject 003 was removed,\
    \ but there is still a duplicate observation for subject 001. What's going on?\n\
    \nIf you read the documentation on NODUPRECS option of PROC SORT, you will find\
    \ that NODUPRECS removes successive duplicates. What does this mean? When you\
    \ sort the observations by subject, the two duplicate observations for subject\
    \ 001 were not successive. An easy solution to ensure that duplicate observations\
    \ are successive is to sort by all BY variables. So, if you rewrite Program 11.3\
    \ like this:\n\n### Program 11.4: Fixing the problem with the NODUPRECS option\n\
    \n```sas\n*solution to the problem;\nproc sort data=Multiple out=Features noduprecs;\n\
    all;\nrun;\n```\n\nYou will get the desired result as follows:\n\n| Subj | X |\
    \ Y |\n|---|---|---|\n| 001 | 1 | 2 |\n| 001 | 3 | 2 |\n| 002 | 5 | 7 |\n| 003\
    \ | 7 | 8 |\n| 005 | 4 | 5 |\n\nIn practice, when you have a large data set with\
    \ a large number of variables, you may not want to sort by ALL. If you list several\
    \ BY variables, especially ones that have different values, you can be confident\
    \ that duplicate observations are successive.\n\n### Task: Extracting the first\
    \ and last observation in a BY group\n\n# Keywords\n- First. variables\n- Last.\
    \ variables\n\nSAS programs are observation oriented. That is, you process one\
    \ observation at a time. When you are done, a new observation enters the PDV (program\
    \ data vector) and the previous observation is gone (unless some values were retained,\
    \ either by default or due to a RETAIN statement). To perform operations involving\
    \ multiple observations per subject, SAS provides you with useful tools. The two\
    \ logical variables First.by-variable-name and Last.by-variable-name are created\
    \ when you follow a SET statement with a BY statement.\n\nThese are temporary\
    \ variables that exist only while the DATA step is processing, and they allow\
    \ you to determine when you are reading the first observation in a BY group or\
    \ the last observation in a BY group. The next program demonstrates how this works.\n\
    \n### Program 11.5 Demonstrating First. and Last variables\n\n```sas\nproc sort\
    \ data=Duplicates out=Sorted_Duplicates;\n  by Subj;\nrun;\ndata _null;\n  set\
    \ Sorted_Duplicates;\n  by Subj;\n  put Subj=First.Subj Last.Subj;\nrun;\n```\n\
    \nYou sort your data set by one or more BY variables. In this example, you sort\
    \ the Duplicates data set by Subj. In the data _NULL step, you follow the SET\
    \ statement with a BY statement. This creates the two logical variables First.Subj\
    \ and Last.Subj. As you might expect, First.Subj is true when you are reading\
    \ the first observation for a subject, and Last.Subj is true when you are reading\
    \ the last observation for a subject. A value of 1 indicates true; a value of\
    \ 0 indicates false.\n\nHere is the portion of the SAS Log that shows the values\
    \ of these two variables:\n\n```\nSubj=001 FIRST.Subj=1 LAST.Subj=1\nSubj=002\
    \ FIRST.Subj=1 LAST.Subj=0\nSubj=002 FIRST.Subj=0 LAST.Subj=1\nSubj=003 FIRST.Subj=1\
    \ LAST.Subj=1\nSubj=004 FIRST.Subj=1 LAST.Subj=0\nSubj=004 FIRST.Subj=0 LAST.Subj=1\n\
    Subj=005 FIRST.Subj=1 LAST.Subj=1\n```\n\nFirst and Last variables are extremely\
    \ useful. You may need to perform some operations when you are reading the first\
    \ observation for a subject (such as initializing counters), and also perform\
    \ operations when reading the last observation for a subject (such as outputting\
    \ an observation).\n\nAs an example, if you want to output the last observation\
