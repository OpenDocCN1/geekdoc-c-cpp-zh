    # Task: Adding new format values to an existing format


    # Keywords


    Adding formats


    CNTLOUT= option


    Suppose you want to add some formats to the ICDFMT format you created previously.
    One way is to run PROC FORMAT with the option CNTLOUT= to write the existing Control
    data set, and use this data set to create a new data set containing the additional
    codes and labels.


    As an example, suppose you want to add codes for 427.5 (Cardiac Arrest) and 466
    (Bronchitis) to the ICDFMT format. You need to be careful if any of your new labels
    are longer than any of the existing labels. If that is the case, be sure to use
    a LENGTH statement to define the new length for the variable Label. Here is the
    program:


    # Program 5.4: Adding new formats to an existing format using a CNTLOUT data set


    ```

    Adding new formats to an existing format using a CNTLOUT data set;

    proc format cntnout=Control_Out;

    select icdfmf;

    data New_control;

    length $ 25;

    set Control_Out (drop=End) end=Last;

    out;

    if Last then do;

    Hlo = '' '';

    Start = ''427.5'';

    Label = ''Cardiac Arrest'';

    out;

    Start = ''466'';

    Label = ''Bronchitis - nonspecific'';

    out;

    end;

    proc format cntlin=New_control;

    select ICDFMT;

    ```


    You by running PROC FORMAT with the option CNTLOUT= to output your existing data
    set does not contain ranges, in this example, you name this data set Control Out).
    Since the existing format does not want, you drop it. Next, you use the END= option
    of the SET statement to add the new codes and labels. Notice that the LENGTH statement
    to define the length for the variable Label comes before the SET statement (otherwise,
    it would have no effect). Also, you need to set HLO to a missing value because
    you already assigned a label for the Other category. Finally, run PROC FORMAT
    using your new data set'
