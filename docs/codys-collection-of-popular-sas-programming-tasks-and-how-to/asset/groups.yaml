- md: "\n# Conclusion\n\nEven though SAS is an observation-based language, it has\
    \ all the tools you need when analyzing data sets with multiple observations per\
    \ subject.\n\n## Chapter 12: Miscellaneous Tasks\n\nIntroduction ................................................................................................................................\
    \ 116\n\nTask: Determining the number of observations in a SAS data set (using\
    \ the NOBS= SET option)...................................... 116\n\nTask: Determining\
    \ the number of observations in a SAS data set and assigning the value to a macro\
    \ variable ........................ 117\n\nTask: Determining the number of observations\
    \ in a SAS data set (using library tables)......................................................\
    \ 118\n\nTask: Determining the number of observations in a SAS data set (using\
    \ SAS functions) .......................................... 119\n\nTask: Counting\
    \ the number of a specific response in a list of variables ...................................................................\
    \ 120\n\nTask: Computing a moving average......................................................................................................................\
    \ 122\n\nTask: Presenting a macro to compute a moving average ................................................................................\
    \ 124\n\nTask: Replacing the first eight digits of a credit card number with asterisks..................................................................\
    \ 126\n\nTask: Sorting within an observation (using the ORDINAL function) ................................................................\
    \ 127\n\nTask: Sorting within an observation (using CALL SORTN) .......................................................................\
    \ 128\n\nTask: Computing the average of the 'n' highest scores..................................................................\
    \ 129\n\nTask: Extracting the first and last name (and possibly a middle name)\
    \ from a variable containing the first and last name (and possibly a middle name)\
    \ in a single variable .......................................... 130\n\nConclusion\
    \ ..........................................................................................................................\
    \ 131\n\n## Introduction\n\nBecause the word miscellaneous is in the title of\
    \ this chapter, don't be misled into thinking these tasks\nare not useful——it's\
    \ just that they do not fit in any convenient category.\n\n## Task: Determining\
    \ the number of observations in a SAS data set (using the NOBS= SET option)\n\n\
    ### Keywords\n\n- Number of observations\n- NOBS\n\nThere are several ways to\
    \ determine the number of observations in a SAS data set. One of the most\ncommon\
    \ methods is to use the NOBS=variable_name option on a SET statement. At compile\
    \ time,\nvariable_name is equal to the number of observations in the data set\
    \ named on the SET statement.\n\nIn this example, you want to determine the number\
    \ of observations in the Stocks data set.\n\n### Program 12.1: Using the NOBS=\
    \ SET option to determine the number of observations in a\nSAS data set\n\n```sas\n\
    *Determining the number of observations in a SAS data set;\n*Using the SET option\
    \ NOBS;\ndata New;\n  set Stocks nobs=Number_of_obs;\n  if _n =1 then\n    put\
    \ \"The number of observations in data set STOCKS: \" \n      Number of obs;\n\
    \    How_Var = _n / Number_of_obs;\nrun;\n```\n\nYou use the NOBS= option on the\
    \ SET statement to obtain the number of observations in the Stocks\ndata set (and\
    \ assign this value to Number_ Obs). In this example, you want to compute the\n\
    off number divided by the total number of observations in the Stocks data set.\
    \ You also use a\nPUT statement to output this number to the SAS Log. A listing\
    \ of the first eight observations in data set\nNew is displayed here:\n\n| Date\
    \ | Price | How_Far |\n|---|---|---|\n| 02JAN2012 | 24 | 0.02381 |\n| 03JAN2012\
    \ | 24 | 0.04762 |\n| 04JAN2012 | 33 | 0.07143 |\n| 05JAN2012 | 25 | 0.09524 |\n\
    | 06JAN2012 | 25 | 0.11905 |\n| 09JAN2012 | 24 | 0.14286 |\n| 10JAN2012 | 33 |\
    \ 0.16667 |\n| 11JAN2012 | 34 | 0.19048 |\n\nA section from the SAS Log shows\
    \ that there were 42 observations in the Stocks data set:\n\nThe number of observations\
    \ in data set STOCKS is: 42\n\n## Task: Determining the number of observations\
    \ in a SAS data set and assigning the value to a macro variable\n\n### Keywords\n\
    \n- Number of observations\n- NOBS\n\nYou may want to set a macro variable equal\
    \ to the number of observations in a SAS data set. Take a look at the rather interesting\
    \ program shown next:\n\n### Program 12.2: Placing the number of observations\
    \ in a SAS data set into a macro variable\n\n```sas\n*Putting the number of observations\
    \ in a SAS data set into\nmacro variable;\ndata _null;\n  if 0 then Stocks nobs=Number_of_obs;\n\
    \    call putx('N of obs',Number_of_obs);\n  put \"The number of observations\
    \ in STOCK is &N_of_obs\";\n  stop;\nrun;\n```\n\nYes, the IF statement definitely\
    \ looks false, the SET statement never executes. The NOBS= option does its magic\
    \ at compile time. CALL SYMPUTS assigns the value of Number_of_obs to the macro\
    \ variable N_of_obs.\n\n## Task: Determining the number of observations in a SAS\
    \ data set (using library tables)\n\n### Keywords\n\n- Number of observations\n\
    - Library tables\n\nSAS tables contain metadata relating to your data sets, and\
    \ you can obtain this information from SAS8.VTABLE by specifying the LIBNAME and\
    \ the name of the data set. This method of determining the number of observations\
    \ has an advantage over the previous methods described so far. That is, if you\
    \ (or other people) are modifying a data set, you need to know the total number\
    \ of observations as well as the number of observations that have been marked\
    \ for deletion (but are still counted when you use the NOBS= option).\n\n### Program\
    \ 12.4: Determining the number of observations in a data set using library tables\n\
    \n```sas\ndata _null;\nset sashelp.vtable;\nwhere libname=\"WORK\" and memname=\"\
    STOCKS\";\nNote:you must use uppercase values for libname and memname;\n**Num_nobs=\
    \ total number of observations, including deleted ones\nDelobs is the number of\
    \ deleted observations;\nput Delobs: = num_obs;\nrun;\n```\n\n## Task: Determining\
    \ the number of observations in a SAS data set (using SAS functions)\n\n### Keywords\n\
    \n- Number of observations\n- Exist function\n- Attrn function\n\nWhat, another\
    \ way to determine the number of observations in a SAS data set? A group of functions\
    \ in the category File I/O allow you to obtain information about a SAS data set.\n"
