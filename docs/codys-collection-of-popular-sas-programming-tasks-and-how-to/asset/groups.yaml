    # # How the macro works


    This section is included for readers who want to understand the details of the
    Auto_Outlier macro. For this discussion, the macro was run on data set Blood_Pressure
    with the value of the macro variable equal to "Heart_Rate SBP D".


    The first step is to run PROC UNIVARIATE and capture the trimmed statistics in
    a SAS data set. You use an ODS OUTPUT to show this. Shown is a listing of data
    set Trimmed:


    | VarName | Mean | StdMean | DF |

    |---|---|---|-|

    | Heart_Rate | 69.3913 | 2.599517 | 45 |

    | SBP | 132.000 | 2.396861 | 43 |

    | DBP | 79.7727 | 0.938919 | 43 |


    You need to combine this information with the values from the Blood_Pressure data
    set. However, that data set has Subj, Heart_Rate, SBP, and DBP. Your next step
    is to restructure the Blood_Pressure data set so merge it with the Trimmed data
    set. You accomplish this in DATA step Structure. Refer to Chapter 7 for details
    on restructuring SAS data sets.


    You may be unfamiliar with the VNAME function used in this DATA step. This very
    useful function returns a variable name, given an array element as the argument.'
