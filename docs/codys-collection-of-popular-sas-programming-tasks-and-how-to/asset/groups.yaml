    \ | Name2 | DOB2 | Gender2 |\n|---|---|---|---|---|---|\n| Friedman | 14JUL1946\
    \ | M | Friedman | 14JUL1946 | M |\n| Chien | 21OCT1965 | F | Chen | 21OCT1965\
    \ | F |\n| MacDonald | 12FEB2001 | M | McDonald | 12FEB2001 | M |\n\n### Listing\
    \ of data set Exact_Matches\n\n| Name1 | DOB1 | Gender1 | Name2 | DOB2 | Gender2\
    \ |\n|---|---|---|---|---|---|\n| Fitzgerald | 04AUG1966 | M | Fitzgerald | 04AUG1966\
    \ | M |\n| GREGORY | 05FEB1955 | F | Gregory | 05FEB1955 | F |\n\nInspection of\
    \ the Possible_Matches data shows matches between names that are spelled differently\
    \ but probably belong together.\n\n## Conclusion\n\nAt some time in your programming\
