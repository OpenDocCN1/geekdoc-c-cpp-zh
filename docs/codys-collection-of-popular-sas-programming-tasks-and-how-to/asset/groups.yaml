    # ## Introduction


    The basic approach to creating a user-defined format or inform is to run PROC
    FORMAT and supply labels for each value or a range of values that you want to
    format. There are times when this becomes very tedious. If the information you
    need to create a format is already stored in a SAS data set, you can convert this
    data set into a control data set that can then be used to create your format.
    This chapter demonstrates how to create a control data set and how to add or modify
    values in an existing format.


    # ## Task: Using a SAS data set to create a format (by creating a control data
    set)


    Keywords


    +   - PROC FORMAT

    - Control data set


    Data sets contain disease codes and descriptions of these codes. Here is a listing
    of the Codes data set:


    | ICD9 | Description |

    |---||

    | 020 | Plague |

    | 022 | Anthrax |

    | 390 | Rheumatic fever |


    Cody, Ron. Cody''s Collection of Popular SAS® Programming Tasks and How to Tackle
    Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS
    RESERVED. For additional SAS resources, visit support.sas.com/bookstore.'
- md: "\n# Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \n| ICD9 | Description |\n|---|---|\n| 410 | Myocardial infarction |\n| 493 |\
    \ Asthma |\n| 540 | Appendicitis |\n\nThe variable ICD9 (stands for International\
    \ Classification of Diseases version 9) is a code for each of the medical conditions\
    \ stored in the Description. You would like to create a format for each of the\
    \ ICD9 codes using the value of Description as the format label.\n\nThe first\
    \ step is to create a control data set from the Codes data set. Variables in a\
    \ control data set are follows:\n\n| Variable Name | Description |\n|---|---|\n\
    | Fmtname | A character variable that contains the name of the format you want\
    \ to create. If you want to create a character format, this value should begin\
    \ with a dollar sign ($). |\n| Type | Values of Type are 'C' for a character format\
    \ and 'N' for a numeric format. If the Fmtname starts with a $, the variable is\
    \ optional. |\n| Start | This is a single value or the starting value in a range.\
    \ |\n| End | If you specify a range, End is the ending value. |\n| Label | This\
    \ character variable holds the format label. |\n| HLO | This variable allows you\
    \ to specify values for the keywords High, Low, or Other. |\n\nFor this task,\
    \ the variable ICD9 to be renamed Start, and Description to be renamed Label.\
    \ If you want to format it, assign $ICDFMT, this value to Fmtname. You will see\
    \ how to use the HLO variable in the next task.\n\nThe following DATA step creates\
    \ a control data set from Codes:\n\n## Program 5.1: Creating a control data set\
    \ from a data set containing codes and labels\n\n```\n*Program to create a control\
    \ data set from a SAS data set;\ndata Control;\n  set Codes(rename=\n    (ICD9\
    \ = Start\n    Description = Label));\n  retain Fmtname '$ICDFMT'\n  Type 'C';\n\
    run;\n```\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and\
    \ How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \nYou use the RENAME= data set option to rename the two variables: ICD9 and Description.\
    \ The value of Fmtname is assigned using a RETAIN statement. This is more efficient\
    \ than using an assignment statement because an assignment statement would execute\
    \ for each iteration of the DATA step and the RETAIN statement executes only once.\
    \ You also set Type to 'C' (stands for character). This is not necessary since\
    \ the format name begins with a dollar sign, but you might want to include it\
    \ anyway.\n\nHere is a list of data set:\n\n| Start Label | Fmtname | Type |\n\
    |---|---|---|---|\n| 020 | Plague | $SICDFMT | C |\n| 022 | Anthrax | $SICDFMT\
    \ | C |\n| 390 | Rheumatic fever | $SICDFMT | C |\n| 410 | Myocardial infarction\
    \ | $SICDFMT | C |\n| 493 | Asthma | $SICDFMT | C |\n| 540 | Appendicitis | $SICDFMT\
    \ | C |\n\nThe next step is to run PROC FORMAT with the Control data specified\
    \ with the CNTLIN=option, like this:\n\n## Program 5.2: Using a control data set\
    \ to create a format\n\n```\nproc format cntlin=Control;\nselect $SICDFMT;\nrun;\n\
    *Using the CNTLIN= created set;\ndata disease;\ninput ICD9 = $5. @@;\ndatalines;\n\
    020 410 500 493\nntitle \"Listing of DISEASE\";\nproc report data=disease headline;\n\
    columns ICD9-Unformatted ICD9;\ndefine ICD9 / \"Formatted Value\" width=11 format=$SICDFMT;\n\
    define Unformatted / \"Original Unformatted Value\" width=11;\nrun;\n```\n\nYou\
    \ run PROC FORMAT with the option CNTLIN=Control. The SELECT statement in this\
    \ program is not necessary to create the format—it is a request to list the contents\
    \ of the format for documentation purposes. It produced the following output:\n\
    \n| FORMAT NAME: $SICDFMT LENGTH: 21 NUMBER OF VALUES: 6 |\n| MIN LENGTH: 1 MAX\
    \ LENGTH: 40 DEFAULT LENGTH: 21 FUZZ: 0 |\n| START | LABEL (VER, V7|V8) 19MAR2012:09:07:25)\
    \ |\n| 020 | 020 | Plague |\n| 022 | 022 | Anthrax |\n| 390 | 390 | Rheumatic\
    \ fever |\n| 410 | 410 | Myocardial infarction |\n| 493 | 493 | Asthma |\n| 540\
    \ | 540 | Appendicitis |\n\nFinally, the short DATA step and PROC REPORT portion\
    \ of the program demonstrate how the SICDFMT format works. PROC REPORT was used\
    \ instead of PROC PRINT so that you can see both the unformatted and formatted\
    \ values for the variable ICD9. Here is the listing:\n\n| Original Unformatted\
    \ Value | Formatted Value |\n| 020 | Plague |\n| 410 | Myocardial infarction |\n\
    | 500 | |\n| 493 | Asthma |\n\nThree of the ICD9 codes are formatted correctly;\
    \ however, the ICD9 code 500 does not have a corresponding label and does not\
    \ get formatted. To add a category to your format, you set the HLO to 'O' and\
    \ provide the label like this:\n\n## Program 5.3: Adding a category to your format\n\
    \n```\n*Adding a category to your format;\ndata Control;\n  set Codes(rename=\n\
    \    (ICD9 = Start\n    Description = Label));\n  retain Fmtname '$ICDFMT'\n \
    \ Type 'C';\nrun;\n\ntitle \"Adding an OTHER category\";\nproc format cntlin=Control;\n\
    select $SICDFMT;\nrun;\n```\n\nYou need to add a category to your format, you\
    \ set the HLO to 'O' and provide the label like this:\n\n| FORMAT NAME: $SICDFMT\
    \ LENGTH: 21 NUMBER OF VALUES: 6 |\n| MIN LENGTH: 1 MAX LENGTH: 40 DEFAULT LENGTH:\
    \ 21 FUZZ: 0 |\n| START | LABEL (VER, V7|V8) 19MAR2012:09:07:25) |\n| 020 | 020\
    \ | Plague |\n| 022 | 022 | Anthrax |\n| 390 | 390 | Rheumatic fever |\n| 410\
    \ | 410 | Myocardial infarction |\n| 493 | 493 | Asthma |\n| 540 | 540 | Appendicitis\
    \ |\n| 500 | | |\n\nNotice that the ICD9 code 500 does not have a corresponding\
    \ label and does not get formatted. To add a category to your format, you set\
    \ the HLO to 'O' and provide the label like this:\n\n## Program 5.4: Adding new\
    \ formats to an existing format\n\n```\n*Adding new formats to an existing format;\n\
    data ControlOut;\n  set Codes(rename=\n    (ICD9 = Start\n    Description = Label));\n\
    \  retain Fmtname '$ICDFMT'\n  Type 'C';\nrun;\n\ntitle \"Adding an OTHER category\"\
    ;\nproc format cntlin=ControlOut;\nselect $SICDFMT;\nrun;\n\ndata disease;\n \
    \ input ICD9 = $5. @@;\n  datalines;\n020 410 500 493\nntitle \"Listing of DISEASE\"\
    ;\nproc report data=disease headline;\ncolumns ICD9-Unformatted ICD9;\ndefine\
    \ ICD9 / \"Formatted Value\" width=11 format=$SICDFMT;\ndefine Unformatted / \"\
    Original Unformatted Value\" width=11;\nrun;\n```\n\n## Conclusion\n\nThere are\
    \ two situations where it is convenient to create a format from a SAS data set.\
    \ One is when you already have a SAS data set containing codes and labels (and\
    \ it is relatively large). The other is when you want to use formats for table\
    \ lookup and you have the lookup values in an existing SAS data set. In both of\
    \ these cases, control data set will save you time.\n"
