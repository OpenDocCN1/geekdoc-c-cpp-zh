    # 任务：合并包含不同长度字符变量的两个 SAS 数据集并控制字符变量的长度


    # 关键字


    - 合并 SAS 数据集

    - SET 语句

    - LENGTH 语句


    当你想要合并的两个数据集具有不同长度的字符变量时，该怎么办？如果第一个数据集中的所有长度都比第二个数据集长，可以使用简单的 SET 语句按顺序列出数据集，或者使用带有
    FORCE 选项的 PROC APPEND。当然，生活从不是那么简单。根据墨菲定律，你可以确定第一个数据集中的某些长度较长，而第二个数据集中的某些长度较长。


