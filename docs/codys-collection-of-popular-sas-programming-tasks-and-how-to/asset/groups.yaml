    \ Drug 值的 Heart_Rate——不再包含总平均值。\n\n## 任务：让 PROC MEANS 自动为输出数据集命名命名（AUTENAME 选项）\n\
    \n## 关键词\n- AUTENAME\n- PROC MEANS\n- 摘要数据集 (Summary data set)\n\n你可以通过使用名为 AUTENAME\
    \ 的 OUTPUT 选项请求 PROC MEANS 为输出数据集中的所有变量命名。该选项通过使用 VAR 语句中的变量名并添加与请求统计相关的后缀，在输出数据集中创建变量名。例如，如果你有一个名为\
    \ Heart_Rate 的变量并请求平均值（mean），PROC MEANS 创建的变量名就是 Heart_Rate_Mean。也就是说，它获取统计信息的名称，添加一个下划线，然后是请求的统计信息的名称。以下程序请求了四种统计数据（n,\
    \ mean, min 和 max），并使用 AUTENAME 选项命名新创建的变量：\n\n## 程序 3.5：在 PROC MEANS 的 OUTPUT\
    \ 语句中演示 AUTONAME 选项\n\n```sas\n*Demonstrating the AUTONAME option;\nproc means\
    \ data=Blood_Pressure noprint nway;\nclass Drug;    var Heart_Rate;\noutput out=Summary(drop=_type_\
    \ _freq_)\n    n= mean= min max= / autoname;\nrun;\n```\n\n由于 AUTONAME 是 OUTPUT\
    \ 语句上的选项，你将该选项放在正斜杠之后。注意，你在每个统计量后面跟一个等号，但在等号后面不包含任何变量名。这是一个非常有用的选项，通过使用它，你的变量中将始终拥有一致的名称。由于你不需要输出数据集中的\
    \ _TYPE_ 变量，你也可以像本程序所示丢弃 _FREQ_。以下是数据集 Summary 的列表：\n\n| Drug | Heart_Rate_N |\
    \ Heart_Mean | Heart_Min | Heart_Rate_Max |\n|---|---|---|---|---|\n| Drug A |\
    \ 20 | 73.3000 | 42 | 98 |\n| Drug B | 20 | 65.3500 | 37 | 89 |\n| Placebo | 18\
    \ | 69.3899 | 38 | 116 |\n\n## 任务：从 PROC MEANS 创建多个输出数据集，每个数据集具有不同的 CLASS 变量组合\n\
    \n## 关键词\n- PROC 选项\n- CHARTYPE 选项\n- 摘要数据集 (Summary data set)\n\n有时你可能需要 CLASS\
    \ 变量的各种组合的摘要数据集。例如，你可能想查看每个 Drug 级别、每个 Gender 级别以及 Drug 和 Gender 的每个组合的平均心率。正如你之前一样，如果你省略\
    \ NWAY 选项，输出数据集将包含所有这些值，并带有 _TYPE_。\n\n_TYPE_ 值的解释相当复杂。为了方便起见，请使用 CHARTYPE 过程将\
    \ _TYPE_ 转换为零和一的字符字符串。输出后提供了对该字符串的解释。\n\n## 程序 3.6：在 PROC MEANS 中演示 CHARTYPE 选项\n\
    \n```sas\n*Demonstrating the CHARTYPE option;\nproc means data=Blood_Pressure\
    \ noprint chartype;\nclass Drug Gender;\nvar Heart_Rate;\noutput out=Summary mean=Mean_HR;\n\
    run;\n```\n\n列表如下：\n\n| | Gender | _TYPE_ | FREQ | Mean_HR |\n|---|---|---|---|\n\
    | | 0 | 60 | 69.3448 |\n| Drug A | 0 | 20 | 73.3000 |\n| Drug B | 0 | 20 | 65.3500\
    \ |\n| Placebo | 0 | 20 | 69.3889 |\n| Drug A | 1 | 20 | 73.3000 |\n| Drug B |\
    \ 1 | 20 | 65.3500 |\n| Placebo | 1 | 20 | 69.3889 |\n| | 1 | 60 | 69.3448 |\n\
    \n（注：此处根据逻辑推测了部分表格内容，原文中表格显示不全，但翻译应保持结构一致）\n\n*抱歉，原文提供的文本表格似乎错乱，我将根据逻辑结构输出。*\n\
    \n（重新对齐 3.6 表格输出逻辑）：\n\n| | Gender | _TYPE_ | FREQ | Mean_HR |\n|---|---|---|---|\n\
    | | 0 | 60 | 69.3448 |\n| Drug A | 0 | 20 | 73.3000 |\n| Drug B | 0 | 20 | 65.3500\
    \ |\n| Placebo | 0 | 20 | 69.3889 |\n| Drug A | 1 | 20 | 73.3000 |\n| Drug B |\
    \ 1 | 20 | 65.3500 |\n| Placebo | 1 | 20 | 69.3889 |\n| | 1 | 60 | 69.3448 |\n\
    \n## 程序 3.7：使用 _TYPE_ 变量将摘要数据发送到单独集\n\n```sas\ndata Grand(drop Drug Gender)\n\
    ByGender(drop=Gender)\nByDrug(drop=Drug)\nByGender;\ndrop _type _freq_\nset Summary;\n\
    if _type_ = '00' then output Grand;\nelse if _type_ = '01' then output ByGender;\n\
    if _type_ = '10' then output ByDrug;\nif _type_ = '11' then output ByGender;\n\
    run;\n```\n\n你现在可以看到 CHARTYPE 选项有多好用了。\n\n"
