    The calling arguments in this macro are the names of the input and output data
    sets and a list of the variables that you wish convert from character to numeric.
    You enter each of variable in this list, separated by spaces.


    The first task of the macro is to rename each of the original variable names by
    adding the prefix C_ to each of the names. To determine how many variable names
    are there in a string, use the COUNT function. This function computes the number
    of words in a string. To obtain each of the names, you use the %SCAN macro function.
    This works in the same way as the regular non-SCAN function. The first argument
    is the list of variable names. The second argument specifies which "word" you
    want in the string. The macro uses a %do loop to extract each of the individual
    variables.


    The next %do loop performs the character-to-numeric conversion using the INPUT
    function. The first argument of the INPUT function is the original variable name
    with the C_ prefix added. Finally, a DROP statement deletes all of the C_ variables.


    To test the macro, you can use the original data set Char values and enter Age
    and Weight as the argument of Var_list. Here is the code:


    # Program 1.3: Testing the character-to-numeric conversion macro


    ```

    *Test the macro;

    char_to_num(In dsn=char_values, Out_dsn=Num_values, Var_list=Age Weight)

    ```


    After you run the macro, the output data set (Num values) is identical to the
    one created by the previous program.'
