    # # Conclusion


    There are two situations where it is convenient to create a format from a SAS
    data set. One is when you already have a SAS data set containing codes and labels
    (and it is relatively large). The other is when you want to use formats for table
    lookup and you have the lookup values in an existing SAS data set. In both of
    these cases, control data set will save you time.'
- md: "\n## Chapter 6: Table Lookup Techniques\n\n- Introduction ................................................................................................................65\n\
    - Task: Performing a one-way table lookup using a MERGE statement..................................65\n\
    - Task: Performing a one-way table lookup using user-defined informats.........................67\n\
    - Task: Creating an INFORMAT using a control data set..................................................69\n\
    - Task: Performing a one-way table lookup using a temporary array..................................70\n\
    - Task: Performing a two-way table lookup using a temporary array...............................71\n\
    - Conclusion .......................................................................................................................73\n\
    \n## Introduction\n\nTable lookup is the process where you use one or more key\
    \ values, such as an item number, and associate it with another value, such as\
    \ the item's price. SAS has a variety of ways of performing one-way or multi-way\
    \ table lookup. One easy and straightforward way is to use a MERGE statement.\
    \ Other, more efficient methods, such as temporary arrays, formats, or informats,\
    \ store the table information in memory. You will see examples of all of these\
    \ methods in this chapter.\n\n## Task: Performing a one-way table lookup using\
    \ a MERGE statement\n\n- **Keywords**\n  Table lookup\n  MERGE\n\nYou have sales\
    \ data, arranged by year, in your Sales data set and yearly data, also arranged\
    \ by year, in your Goals data set. The first five observations from each of these\
    \ data sets are listed here:\n\nListing of data set Sales\n\n| Sales_ID | Year\
    \ | Sales |\n| --- | --- | --- |\n| 1234 | 2004 | 20.5 |\n| 1234 | 2005 | 22.0\
    \ |\n| 1234 | 2006 | 26.0 |\n| 1234 | 2007 | 27.0 |\n| 1234 | 2008 | 37.0 |\n\n\
    Listing of data set Goals\n\n| Year | Goal |\n| --- | --- |\n| 2004 | 20 |\n|\
    \ 2005 | 21 |\n| 2006 | 24 |\n| 2007 | 28 |\n| 2008 | 34 |\n\nYou can use a MERGE\
    \ statement to add the Goal values to each observation in the Sales data set like\
    \ this:\n\nProgram 6.1: Using a MERGE to perform a table lookup\n\n```\nproc sort\
    \ data=Goals;\n  by Year;\n\nproc sort data=Sales;\n  by Year;\n\ndata Sales_Goals;\n\
    \  merge Goals Sales;\n  by Year;\n  Difference = Sales - Goal;\n\nproc sort data=Sales_Goals;\n\
    \  by Sales_ID;\n```\n\nFirst, you need to sort each data set by Year (if it is\
    \ not already in the correct order). Next, you perform a MERGE between the two\
    \ data sets, Year as the BY variable. In this example, you want to see the difference\
    \ between actual sales and goals for each person. The final sort places observations\
    \ in Sales_ID order. The resulting data set is shown next:\n\n| Year | Goal |\
    \ Sales_ID | Sales | Difference |\n| --- | --- | --- | --- | --- |\n| 2004 | 20\
    \ | 1234 | 20.5 | 0.5 |\n| 2005 | 21 | 1234 | 22.0 | 1.0 |\n| 2006 | 24 | 1234\
    \ | 26.0 | 2.0 |\n| 2007 | 28 | 1234 | 27.0 | -1.0 |\n| 2008 | 34 | 1234 | 37.0\
    \ | 3.0 |\n\nYou can improve the efficiency of this operation by using temporary\
    \ arrays or formats (or informats). This is the topic of the next tasks.\n\n##\
    \ Task: Performing a one-way table lookup using user-defined informats\n\n- **Keywords**\n\
    \  Table lookup\n  Informats\n  Input function\n\nUser-defined formats and informats\
    \ provide you with an extremely powerful tool for table lookup. One advantage\
    \ of this technique is that formats are stored in memory, making the task fast.\
    \ The reason you might prefer an informat over a format is that you can use an\
    \ informat in an INPUT function to create a numeric variable. You will see an\
    \ example of this in the next program. If you use a format and a PUT function,\
    \ you will create a character variable. This first example shows how to create\
    \ an informat and use that to perform the lookup. Following this task, you will\
    \ see how to use a SAS data set to create the informat.\n\nYou create an informat\
    \ much the same you create a format. Instead of using a VALUE statement, you use\
    \ an INVALUE statement. The informat called goalfmt is created in the short program:\n\
    \nProgram 6.2: Creating a user-defined informat to be used for table lookup\n\n\
    ```\n*Creating the informat \"manually\" using PROC FORMAT;\nproc format;\ninvalue\
    \ goalfmt\n2004=20\n2005=21\n2006=24\n2007=28\n2008=34\n2009=40\n2010=49\n2011=60\n\
    2012=75;\nrun;\n```\n\nNotice how this code resembles the creation of a format.\
    \ There are two differences: you use the keyword INVALUE instead of VALUE, and\
    \ you do not place the values to the right of equal signs in quotes. goalfmt is\
    \ a numeric informat, and the result of using it in an INPUT statement or function\
    \ is a numeric. The next step is to use this informat in a DATA step to perform\
    \ the lookup:\n\nProgram 6.3: Using the informat to perform the table lookup\n\
    \n```\ndata Sales_Goals;\nset Sales;\nGoal = input(Year,4.),goalfmt);\nDifference\
    \ = Sales - Goal;\nrun;\n```\n\nThe INPUT function takes a SAS value as the first\
    \ argument and \"reads\" it using the INFORMAT as the second argument. You need\
    \ the PUT function in this example because the first argument must be a character\
    \ value. (You could leave it out, and SAS will perform character-to-numeric conversion\
    \ automatically and will print a numeric to the Log. However, this is not recommended.)\n\
    \nSuppose the first year in the Sales data set is 2008. The goalfmt converts this\
    \ value to the numeric value 34, and assigns this value to the variable Goal.\
    \ Because creating an informat (or format) can be tedious, the next section describes\
    \ how to use a control data set to create formats.\n\n## Task: Creating an INFORMAT\
    \ using a control data set\n\n- **Keywords**\n  Control data set\n  Informats\n\
    \nYou can create a format or informat using a control data set. You can read about\
    \ how to create formats using a control data set in the previous chapter. Here,\
    \ you will see how to create an informat using this same technique.\n\nIf you\
    \ want to create an informat rather than a format, the informat name must start\
    \ with an @ sign and the variable called Type must be set to \"I\" (stands for\
    \ Informat). You can create a control data set from the Goals data set by renaming\
    \ the variables the Fmtname and Type variables. Here is the code:\n\nProgram 6.4:\
    \ Using a control data set to create an informat\n\n```\n*Creating the INFORMAT\
    \ using a CNTLIN data set;\ndata Control;\n  set Goals(rename=(Year=Start Goal=Label));\n\
    \  retain Fmtname '@goalfmt' Type 'I';\nrun;\n\nproc cntlin=Control;\n  select\
    \ @goalfmt;\nrun;\n```\n\nYou want Year to be the start value (if there were a\
    \ range instead of a single value, you would also have to define an End value),\
    \ and Goal to be the label. An efficient way to assign the values of Fmtname and\
    \ Type is with a RETAIN statement (as explained in the first task in Chapter 5).\n\
    \nNow that you have a properly structured control data set, run FORMAT with the\
    \ option CNTLIN=Control. The SELECT statement provides you with the following\
    \ output:\n\n| INFORMAT NAME: @goalfmt LENGTH: 12 NUMBER OF VALUES: 9 |\n| MIN\
    \ LENGTH: 1 MAX LENGTH: 40 DEFAULT LENGTH: 12 FUZZ: 0 |\n| START END INVALUE(VER.,\
    \ V7|V8) 12APR2012:10:47:22) |\n| 2004 2004 20 |\n| 2005 2005 21 |\n| 2006 2006\
    \ 24 |\n| 2007 2007 28 |\n| 2008 2008 34 |\n| 2009 2009 40 |\n| 2010 2010 49 |\n\
    | 2011 2011 60 |\n| 2012 2012 75 |\n\n## Task: Performing a one-way table lookup\
    \ using a temporary array\n\n- **Keywords**\n  Temporary array\n  Table lookup\n\
    \nYou can use a temporary array to store values for table lookup. This is one\
    \ of my favorite methods. Temporary arrays are defined by an ARRAY statement with\
    \ the keyword _PORARY_following the array name. Temporary arrays do not have any\
    \ associated variables—they are simply subscribed, stored in memory (very fast)\
    \ when you store values. You can load a temporary array by assigning initial values\
    \ when you define the array, or by loading the array from raw data or a SAS set\
    \ data.\n\nYou can change the bounds on temporary arrays, just as you do with\
    \ regular arrays. In addition, you can have multi-dimensional arrays that you\
    \ can perform table lookup based on two or more values. You will see an example\
    \ of this at the end of this chapter.\n\nFor this example, you load a temporary\
    \ array with the sales goals for the years 2004 to 2012 (the same as the previous\
    \ examples). Once you do this, you can obtain the sales goal for any year by using\
    \ the year as the array subscript. Here is the program:\n"
  mdcn: "\n\n## 第 6 章：表查找技术\n\n- 引言 ................................................................................................................65\n\
    - 任务：使用 MERGE 语句执行单向表查找..................................................65\n\
    - 任务：使用自定义 informats 执行单向表查找.........................................67\n- 任务：使用控制数据集创建\
    \ INFORMAT..................................................................69\n\
    - 任务：使用临时数组执行单向表查找..................................................70\n- 任务：使用临时数组执行双向表查找...............................................71\n\
    - 结论 .......................................................................................................................73\n\
    \n## 引言\n\n表查找是指使用一个或多个键值（如项目编号），将其与另一个值（如项目价格）关联的过程。SAS 有多种执行单向或多向表查找的方法。一种简单直接的方法是使用\
    \ `MERGE` 语句。其他更高效的方法，如临时数组、格式（formats）或输入格式（informats），会将表信息存储在内存中。你将在本章中看到所有方法的示例。\n\
    \n## 任务：使用 MERGE 语句执行单向表查找\n\n- **关键词**\n  表查找\n  MERGE\n\n你的 `Sales` 数据集中有按年份排列的销售数据，`Goals`\
    \ 数据集中存有同样按年份排列的年度目标数据。以下是这些数据集的前五个观测值列表：\n\nSales 数据集列表\n\n| Sales_ID | Year\
    \ | Sales |\n| --- | --- | --- |\n| 1234 | 2004 | 20.5 |\n| 1234 | 2005 | 22.0\
    \ |\n| 1234 | 2006 | 26.0 |\n| 1234 | 2007 | 27.0 |\n| 1234 | 2008 | 37.0 |\n\n\
    Goals 数据集列表\n\n| Year | Goal |\n| --- | --- |\n| 2004 | 20 |\n| 2005 | 21 |\n\
    | 2006 | 24 |\n| 2007 | 28 |\n| 2008 | 34 |\n\n你可以使用 `MERGE` 语句将 `Goal` 值添加到 `Sales`\
    \ 数据集的每个观测值中，如下：\n\n程序 6.1：使用 MERGE 执行表查找\n\n```\nproc sort data=Goals;\n  by\
    \ Year;\n\nproc sort data=Sales;\n  by Year;\n\ndata Sales_Goals;\n  merge Goals\
    \ Sales;\n  by Year;\n  Difference = Sales - Goal;\n\nproc sort data=Sales_Goals;\n\
    \  by Sales_ID;\n```\n\n首先，你需要按 `Year` 对每个数据集进行排序（如果尚未按正确顺序排列）。接下来，在两个数据集之间执行\
    \ `MERGE`，并将 `Year` 作为 `BY` 变量。在本例中，你想查看每个人实际销售额与目标之间的差异。最后的排序按 `Sales_ID` 顺序放置观测值。生成的数据所示：\n\
    \n| Year | Goal | Sales_ID | Sales | Difference |\n| --- | --- | --- | --- | ---\
    \ |\n| 2004 | 20 | 1234 | 20.5 | 0.5 |\n| 2005 | 21 | 1234 | 22.0 | 1.0 |\n| 2006\
    \ | 24 | 1234 | 26.0 | 2.0 |\n| 2007 | 28 | 1234 | 27.0 | -1.0 |\n| 2008 | 34\
    \ | 1234 | 37.0 | 3.0 |\n\n你可以通过使用临时数组或格式（或 informats）来提高此操作的效率。这是下一个的话题。\n\n\
    ## 任务：使用自定义 informats 执行单向表查找\n\n- **关键词**\n  表查找\n  Informats\n  Input 函数\n\n\
    自定义格式和输入格式（informats）为你提供了一个非常强大的表查找工具。这种技术的优点之一是格式存储在内存中，从而使任务更快。你可能倾向于使用 informat\
    \ 而不是格式，是因为可以在 `INPUT` 函数中创建数值变量。如果你使用格式和 `PUT` 函数，将创建一个字符变量。第一个示例显示了如何创建 informat\
    \ 并使用它进行查找。完成此任务后，你将看到如何使用 SAS 数据集创建 informat。\n\n创建 informat 的方式与创建格式非常相似。不是使用\
    \ `VALUE` 语句，而是使用 `INVALUE` 语句。名为 `goalfmt` 的 informat 在短程序中创建：\n\n程序 6.2：创建用于表查找的自定义\
    \ informat\n\n```\n* 使用 PROC FORMAT 手动创建 informat\nproc format;\ninvalue goalfmt\n\
    2004=20\n2005=21\n2006=24\n2007=28\n2008=34\n2009=40\n2010=49\n2011=60\n2012=75;\n\
    run;\n```\n\n注意这段代码与创建格式相似。有两个不同：你使用了 `INVALUE` 而不是 `VALUE`，并且你没有给值加引号。`goalfmt`\
    \ 是一个数值 informat。下一步是在 `DATA` 步中使用此 informat 进行查找：\n\n程序 6.3：使用 informat 执行表查找\n\
    \n```\ndata Sales_Goals;\nset Sales;\nGoal = input(Year,4.$goalfmt);\nDifference\
    \ = Sales - Goal;\nrun;\n```\n\n`INPUT` 函数将 SAS 值作为第一个参数，并使用 `INFORMAT` 作为第二个参数“读取”它。在本例中，你需要\
    \ `PUT` 函数是因为第一个参数必须是字符值。（你可以省略它，SAS 将自动执行字符到数值的转换并打印到 Log，但不建议这样做。）假设 `Sales`\
    \ 数据集的第一个年份是 2008。`goalfmt` 将此值转换为数值 34，并将此值分配给 `Goal`。由于创建 informat（或格式）可能很麻烦，下一节将描述如何使用控制数据集。\n\
    \n## 任务：使用控制数据集创建 INFORMAT\n\n- **关键词**\n  控制数据集\n  Informats\n\n你可以使用控制数据集创建格式或\
    \ informat。在上一章介绍了如何使用控制数据集创建格式。在这里，你将看到如何使用相同的技术创建 informat。\n\n如果你想创建 informat\
    \ 而不是格式，informat 名称必须以 `@` 符号开头，名为 `Type` 的变量必须设置为 \"I\"代表 Informat）。你可以通过重命名\
    \ `Fmtname` 和 `Type` 变量从 `Goals` 数据集创建一个控制数据集。以下是代码：\n\n程序 6.4：使用控制数据集创建 informat\n\
    \n```\n* 使用 CNTLIN 数据集创建 INFORMAT\ndata Control;\n  set Goals(rename=(Year=Start\
    \ Goal=Label));\n  retain Fmtname '@goalfmt' Type 'I';\nrun;\n\nproc cntlin=Control;\n\
    \  select @goalfmt;\nrun;\n```\n\n你希望 `Year` 是起始值（如果是范围而不是单个值，你还需要定义一个 End 值），`Goal`\
    \ 是标签。分配 `Fmtname` 和 `Type` 值的有效方法是使用 `RETAIN` 语句（如第 5 章第一个任务中所述）。\n\n现在你有了结构良好的控制数据集，带有\
    \ `CNTLIN=Control` 运行 `FORMAT`。`SELECT` 语句提供了以下输出：\n\n| INFORMAT NAME: @goalfmt\
    \ LENGTH: 12 NUMBER OF VALUES: 9 |\n| MIN LENGTH: 1 MAX LENGTH: 40 DEFAULT LENGTH:\
    \ 12 FUZZ: 0 |\n| START END INVALUE(VER., V7|V8) 12APR2012:10:47:22) |\n| 2004\
    \ 2004 20 |\n| 2005 2005 21 |\n| 2006 2006 24 |\n| 2007 2007 28 |\n| 2008 2008\
    \ 34 |\n| 2009 2009 40 |\n| 2010 2010 49 |\n| 2011 2011 60 |\n| 2012 2012 75 |\n\
    \n## 任务：使用临时数组执行单向表查找\n\n- **关键词**\n  临时数组\n  表查找\n\n你可以使用临时数组来存储用于表查找的值。这是我喜欢的方法之一。临时数组通过\
    \ `ARRAY` 语句定义，并在数组名后跟 `TEMPORARY` 关键字。临时数组没有任何关联变量——当你存储值时，它们只是被订阅并存储在内存中（非常快）。你可以通过定义数组时分配初始值来加载临时数组，或者从原始数据或\
    \ SAS 数据集加载数组。\n\n你可以像处理普通数组一样调整临时数组的边界。此外，你还可以拥有多维数组，并根据两个或多个值执行表查找。你将在本章末尾看到这种示例。\n\
    \n对于此示例，你加载 2004 年到 2012 年的销售目标临时数组（与之前的示例相同）。一旦这样做，你就可以使用年份作为数组下标获取任何年份的销售目标。\n\
    \n"
