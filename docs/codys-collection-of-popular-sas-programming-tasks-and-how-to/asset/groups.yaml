    \ of the %DO loop, i is equal to 1, 2, and the assignment statement resolves _x2\
    \ = lag(variable). Once you have computed all of the lag values, you use the MEAN\
    \ function to compute the moving average.\n\nTo get a feel for how this works,\
    \ let's call the macro this:\n\n### Program 12.10: Calling the moving_ave macro\n\
    \n```\n*Testing the macro;\nmoving_Ave(In_name=Stocks,\nout=moving_stocks,\nVar=Price,\n\
    Moving=Average,\nn=5)\n```\n\nand inspect the SAS log to see the macro generated\
