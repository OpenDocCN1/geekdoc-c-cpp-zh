    In general, any data set reaches the end of file in a DATA step, the DATA step
    stops.


    # Task: Combining summary information (a single mean) with detail data: Using
    PROC SQL


    # Keywords


    +   Grand mean


    +   Combining summary and detail data


    +   PROC SQL


    +   Cartesian product


    A very simple and elegant solution to combining summary and detail data uses PROC
    SQL and something called a Cartesian product. A Cartesian product is a combination
    of every observation in data set with every observation in another data set. For
    example, if one data set has 10 observations and the other has 15 observations,
    the Cartesian product data set will have 10 times 15 or 150 observations. Since
    the data set has only one observation, the Cartesian product data set adds this
    one observation to each observation in the detail data set. Here is the code:


    # Program 3.10: Combining summary information with detail data using PROC SQL


    ```

    *proc SQL;

    table Percent_of_Mean as

    select Subj,Heart_Rate,Mean_HR

    from Blood_Pressure,Summary;

    quit;

    ```


    If you are not familiar with PROC SQL, the CREATE TABLE statement is similar to
    a DATA statement. You use a SELECT clause to tell PROC SQL what variables you
    want to select and use it a FROM clause to name the data sets that it will use
    to create the Cartesian product.'
