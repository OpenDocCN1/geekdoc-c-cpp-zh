    \ RESERVED. 如需更多 SAS 资源，请访问 support.sas.com/bookstore。\n\n## 任务：用星号替换信用卡号的前八位数字\n\
    \n### 关键字\n\n- 掩码字符\n- SUBSTR 函数\n- CATS 函数\n- 符号左侧的 SUBSTR 函数\n\n此任务不仅限于掩码信用卡号中的数字——你任何想要替换字符串中字符的时刻都可以使用这种技术。你将看到此任务的两种解决方案：一个简单直观，另一个非常优雅。\n\
    \n在第一个解决方案中，你使用 SUBSTR 函数提取信用卡号的最后 4 位数字，然后使用 CATS 函数将星号与这四个数字连接起来。以下是代码：\n\n\
    ```\nProgram 12.11: Replacing the first eight digits of a credit card number with\
    \ asterisks (method 1)\n*Replacing the first 8 digits of a credit card number\n\
    with asterisks;\n*Using substrings and concatenation functions;\ndata Credit_Report;\n\
    length Last_Four $ 12;\nset Credit;\nLast_Four = cats('******',substr(Account,\
    \ 9));\nrun;\n```\n\n一个更优雅的解决方案是像这样在等号左侧使用 SUBSTR 函数：\n\n```\nProgram 12.12: Replacing\
    \ the first eight digits of a credit card number with asterisks (method 2)\n*Using\
    \ the SUBSTR function on the left-hand side of the equal sign;\ndata Credit_report;\n\
    set Credit;\nLast_Four = Account;\nsubstr(Last_Four,1,8) = '******';\nrun;\n```\n\
    \n回顾一下，等号左侧的 SUBSTR 函数将等号右侧字符放入等号左侧命名的变量中，起始位置由函数的第二个参数指定，长度由函数的第三个参数指定。是的，这个程序只比上一个程序少了一行，但这位作者认为这是一个更优雅的解决方案——难道编写优雅的程序不是你的目标吗？\n\
    \n## 任务：在观测值内排序（使用 ORDINAL 函数）\n\n### 关键字\n\n- 观测值内排序\n- Ordinal 函数\n\n在许多情况下，你希望对观测值内的值进行排序。例如，你可能有每个人的若干分数，并希望从低到高对分数排序。这里提供的第一个解决方案使用\
    \ ORDINAL 函数来实现此目标。该函数接受数字作为第一个参数，并将值列表作为剩余参数。当数字等于 1 时，函数返回最小的值；当数字等于 2 时，函数返回第二小的值；当数字不忽略缺失值时，最小值可能是一个缺失值。另一个排序函数\
    \ SMALLEST 则会忽略缺失值——它返回值列表中的最小值，不计算任何缺失值。\n\n你想对 10 个分数（Score1-Score10）从低到高排序。这些分数存储在数据中，如下所示：\n\
    \n| Name | Score1 | Score2 | Score3 | Score4 | Score5 | Score6 | Score7 | Score8\
    \ | Score9 | Score10 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- |\n| John | 95 | 92 | 87 | 100 | 96 | 88 | 89 | 78 | |\
    \ 95 |\n| Mary | | 98 | 96 | 93 | 89 | 95 | 94 | | 99 |\n| Sarah | | 84 | 87 |\
    \ 88 | 80 | | 81 | 77 | 72 |\n| Sophie | | 78 | 79 | 81 | 82 | 84 | 85 | 88 |\
    \ 90 | 95 |\n\n对于此任务，你想创建 10 个新变量（Sorted1-Sorted10）。\n\n### 程序 12.13：使用 ORDINAL\
    \ 函数在观测值内排序\n\n```\n* Sorting within an observation\ndata test;\nset test_data;\n\
    array Score[10];\narray Sorted[10];\ndo i = 1 to 10;\n  Sorted[i] = ordinal(i,\
    \ Score);\nend;\ndrop i;\n```\n"
