    \n# Introduction\n\nThis chapter contains programs to perform character-to-numeric\
    \ conversion, one of the common tasks you will face as a SAS programmer. You will\
    \ see a sample program as well as a useful macro that accomplishes this goal.\n\
    \nAnother task that you will probably face is converting a specific numeric value\
    \ such as 999 or a specific text value such as 'NA' to a SAS missing value.\n\n\
    In this chapter, you will also see how to convert every character variable to\
    \ a specific case, such as uppercase.\n\n# Cody's Collection of Popular SAS Programming\
    \ Tasks and How to Tackle Them\n\nThe last task in this chapter demonstrates how\
    \ to read data values that contain units, such as 100Lbs. or 50Kgs., and create\
    \ a numeric variable with all of the values using the same units.\n\n# Task: Converting\
    \ character values to numeric values\n\n### Keywords\n- Character-to-numeric conversion\n\
    - Swap and Drop\n\nHow many times have you been given a SAS data set with variables\
    \ such as Height or Weight, instead of being numeric variables? The following\
    \ example describes how to convert these character variables to numeric variables,\
    \ maintaining the original variable names.\n\nFor this example, you start out\
    \ with a SAS data set called Char_values. Here is a listing:\n\n| Age | Weight\
    \ | Gender | DOB |\n|---|---|---|--|\n| 23 | 150 | M | 10/21/1983 |\n| 67 | 220\
    \ | M | 09/02/2001 |\n| 77 | 101 | F | 05/06/1977 |\n\nIf you run PROC CONTENTS\
    \ on this data set, you will see that Age and Weight are character variables.\
    \ The following program performs the conversion:\n\n## Program 1.1: Converting\
    \ character values to numeric values\n\n```\n*Converting character values to numeric;\n\
    data NewM;\n  set Char_Values(rename=(Age = C_Age\n  Weight = C_Weight));\n  Age\
    \ = input (C_Age,best12);\n  Weight = input (C_Weight,best12);\n  drop C_;\nrun;\n\
    ```\n\nThe \"trick\" here is to rename the variables as they are read from the\
    \ input data set. This allows you to use the original variable names for the resulting\
    \ numeric variables. The character-to-numeric conversion is performed using the\
    \ INPUT function. You don't have to worry about the FORMAT used in the INPUT function\
    \ represents more digits than you need—unlike an INPUT statement, you can never\
    \ read past the end of a character value when using the INPUT function.\n\nNotice\
    \ the variable list on the DROP statement C_: The colon acts as a wildcard suffix,\
    \ C_: represents all variables that begin with the characters C followed by an\
    \ underscore.\n\nThe resulting data set has the same variables as the original\
    \ data set except the two variables Age and Weight are now numeric. A partial\
    \ listing from PROC CONTENTS confirms this:\n\n| Alphabetic List of Variables\
    \ and Attributes |\n| # Variable | Type | Len | Format |\n| 3 Age | Num | 8 |\
    \ |\n| 2 DOB | Num | 8 | MDDDY10. |\n| 1 Gender | Char | 1 | |\n| 4 Weight | Num\
    \ | 8 | |\n\n# Task: Converting character values to numeric values using a macro\n\
    \n### Keywords\n- Character-to-numeric conversion\n- Conversion macro\n\nBecause\
    \ character-to-numeric conversion is required in many situations, this chapter\
    \ offers you a macro that performs the conversion automatically. In the previous\
    \ program, the resulting data set uses the same variable names as the original\
    \ data set that contains the character variables. Here is the macro, followed\
    \ by an explanation:\n\n## Program 1.2: Presenting a macro to perform character-to-numeric\
    \ conversion\n\n```\n*Macro to convert selected character variables to\nnumeric\
    \ variables;\n/*Name of the input data set*/\nmacro char_to_num(In_dsn,\n/*Name\
    \ of the output data set*/\nOut_dsn,\n/*List of character variables that you\n\
    want to convert character to\nnumeric, separated by spaces*/\n\n/*Check for null\
    \ list */\nif &var_list ne %then do;\n/*Count the number of variables in the list\
    \ */\nlet len=%sysfunc(countw(&var_list));\ndata &Out_dsn;\nset &In_dsn(rename=(\n\
    %do i=1 to %len\n  %scan(&var_list, &i) = C_%scan(&var_list, &i)\n%end\n));\n\
    %do i=1 to %len\n  %scan(&var_list, &i) = input(C_%scan(&var_list, &i),best12);\n\
    %end;\ndrop C_;\nrun;\n%mend char_to_num;\n```\n\nThe calling statement would\
