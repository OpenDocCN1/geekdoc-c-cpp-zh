    And you want to create a data set that looks like this:


    # Listing of data set ManyPer


    | Subj | Visit | Diagnosis |

    |---|---|--|

    | 001 | 1 | 450 |

    | 001 | 2 | 430 |

    | 001 | 3 | 410 |

    | 002 | 1 | 250 |

    | 002 | 2 | 240 |

    | 003 | 1 | 410 |

