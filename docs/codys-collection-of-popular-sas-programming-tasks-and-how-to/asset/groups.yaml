  - "[PAGE 126]\n\n# Chapter 11: Tasks Involving Multiple Observations per Subject\
    \ 105\n\nHere is the surprising result:\n\n# Listing of data set Features\n\n\
    | Subj | X | Y |\n|---|---||\n| 001 | 1 | 2 |\n| 001 | 3 | 2 |\n| 001 | 1 | 2\
    \ |\n| 002 | 5 | 7 |\n| 003 | 7 | 8 |\n| 005 | 4 | 5 |\n\nThe duplicate observation\
    \ for subject 003 was removed, but there is still a duplicate observation for\
    \ subject 001. What's going on?\n\nIf you read the documentation on the NODUPRECS\
    \ option of PROC SORT, you will find that NODUPRECS option removes successive\
    \ duplicates. What does this mean?\n\nWhen you sort the observations by subject,\
    \ the two duplicate observations for subject 001 were not successive. An easy\
    \ solution to ensure that all duplicate observations are successive is to sort\
