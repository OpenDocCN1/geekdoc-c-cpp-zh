    # # Chapter 8: Tasks Involving Dates


    +   Introduction ............................................................................................................83

    Task: Computing a person''s age, given his or date of birth ................................................83

    Task: Computing a SAS date given a month, day, and year (even if the day value
    is missing)...................................................................................84

    Conclusion .....................................................................................................................85


    # ## Introduction


    This short chapter includes one of the most common tasks—computing a person''s
    age date of birth. Another task discussed is how to compute a SAS date given a
    month, day, and year. To make the task a bit more interesting, the program presented
    here uses the 15th day of the month to compute the date if month is missing. Let''s
    get started.


    # ## Task: Computing a person''s age, given his or date of birth


    +   * Keywords

    * Age computation

    * YRDIF function

    * TODAY function


    For this task, you want to compute a person''s age as of January 1, 2012, given
    a date of birth (DOB). In the “old” days, you might approach this problem by taking
    the difference between January 1, 2012, and the DOB and dividing by 365.25. That
    almost works since there is a leap year every four years.'
  - "[PAGE 105]\n\nHowever, if you would like an exact solution, use the YRDIF function,\
    \ introduced with SAS 9 and modified in SAS 9.3. Here is the program:\n\n# Program\
    \ 8.1: Computing a person's age, given a date of birth\n\n```\n*Computing a person's\
    \ age, given a date of birth;\ndata Compute_Age;\n    set Demographic;\n    Age_Exact\
    \ = yrdif(DOB,'01jan2012'd);\n    Last_Birthday = int(Age_Exact);nrun;\n```\n\n\
    Set Demographic contains the date of birth in a variable called DOB. The YRDIF\
    \ function takes as its first two arguments, the earlier date and the later date,\
    \ respectively. There is a third, optional argument called a basis that allows\
    \ you to specify the number of days in a year. Some financial calculations use\
    \ 30 months and 360 days, regardless of the actual months involved or it is a\
    \ leap year.\n\nTo use the YRDIF function in SAS 9.3, you need to specify \"ACT/ACT\"\
    \ as the third argument to the function or off by one day if both of the dates\
    \ involves a leap year. Using SAS 9.3 or later, you can omit this third argument\
    \ and the function defaults to a basis called \"AGE\" that computes age correctly.\n\
    \nOnce you have computed an age (or any other difference between two dates), you\
    \ can use the INT function to compute the age as the last birthday or the ROUND\
    \ function to round the age to an integer (or other value).\n\nIf you want to\
    \ compute an age of the current date, use the TODAY function for the second argument\
    \ of the YRDIF function.\n\n# Task: Computing a SAS date given a month, day, and\
    \ year (even if the day value is missing)\n\n# Keywords\n\nSAS Date\n\nMDY function\n\
    \nCOALESCE function\n\nIf you have a SAS date set with values of month, day, and\
    \ year, you can use the MDY function to compute a SAS date. If the day of the\
    \ month is missing, you might choose to use the 15th of the month for the day\
    \ of the month."
- md: "\n## Chapter 8: Tasks Involving Dates 85\n\nThe first program presented here\
    \ uses a straightforward method of accomplishing this goal—the second program\
    \ uses a clever and elegant method. Data set MoDayYear contains the variables\
    \ Month, Day, and Year, but it does not contain a SAS date.\n\nHere is the first\
    \ program:\n\n### Program 8.2: Computing a SAS date given a month, day, and year\
    \ value (even if the day of the month is missing)\n\n```sas\n*Creating a SAS date\
    \ when the day of the month may be missing;\ndata ComputeDate;\n  set MoDayYear;\n\
    \  if missing(Day) then Date = MDY(Month, 15, Year);\n  else Date = MDY(Month,\
    \ Day, Year);\n  format Date date9;\nrun;\n```\n\nI like this program because\
    \ it uses one of my favorite functions, the MISSING function. This function can\
    \ take character or numeric arguments. It returns a value of 1 (true) if the argument\
    \ is missing, and a value of 0 (false) if the argument is not missing.\n\nThe\
    \ next program uses the COALESCE function. You provide this function with a list\
    \ of values and it returns the first value in the list that is not missing. I\
    \ would like to thank Mark Jordan, an instructor for SAS, who thought up this\
    \ solution, which is shown next:\n\n### Program 8.3: Computing a SAS date given\
    \ a month, day, and year value (using the COALESCE function)\n\n```sas\n*Alternative\
    \ (elegant) solution suggested by Mark Jordan;\ndata ComputeDate;\n  set MoDayYear;\n\
    \  Date = MDY(Month, coalesce(Day, 15), Year);\n  format Date date9;\nrun;\n```\n\
    \nThe value of Day in this program is either the actual value or 15 if Day is\
    \ a missing value.\n\n## Conclusion\n\nAlthough this chapter only covered two\
    \ tasks involving dates, you will find that these two tasks are essential to many\
    \ of the program you write.\n\n## Chapter 9: Data Cleaning Tasks\n\n- Introduction\
    \ ................................................................................................................87\n\
    - Task: Looking for possible data errors using a given range .................................................................88\n\
    - Task: Demonstrating a macro to report on outliers using fixed ranges.........89\n\
    - Task: Demonstrating a macro that performs automatic outlier detection......92\n\
    - How the macro works ...................................................................................................................................94\n\
    - Conclusion ...................................................................................................................................96\n\
    \n## Introduction\n\nOne of the first tasks a data analyst is to check for possible\
    \ invalid numeric values. For some variables, you can decide if a value might\
    \ be an error if it is outside a given range. For example, a value for resting\
    \ heart rate would be unusual if it were 40 or above 100.\n\nAnother approach\
    \ for identifying possible outliers is to see if a given data value does not seem\
    \ to “belong” with the other values. A common approach is to compute a mean and\
    \ standard deviation and declare a value as outlier if it is a given number of\
    \ standard deviations above or below the mean. Many statisticians use values of\
    \ two or three standard deviations to identify possible outliers.\n\nAs you will\
    \ see, automatic outlier detection, using a mean and standard deviation computed\
    \ from the entire data set may not work if you have some large data errors. You\
    \ will see how to overcome this problem so that you can use automatic outlier\
    \ detection for many of your numeric variables.\n\nCody, Ron. Cody’s Collection\
    \ of Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012,\
    \ SAS Institute, Inc. ary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore.\n\n## Task: Looking for possible\
    \ data errors using a given range\n\n### Keywords\n\n- Outliers\n- Range checking\n\
    \nIf you can determine a reasonable range for some of your numeric variables,\
    \ you can write a program like the following one to identify possible data errors:\n\
    \n### Program 9.1: Looking for possible data errors using a given range\n\n```sas\n\
    *Method using known ranges;\ntitle \"Listing of Patient Numbers and Invalid Data\
    \ Values\";\ndata null_;\nset Blood_Pressure;\nfile print;\n***Check Heart_Rate;\n\
    if (Heart_Rate lt 40 and not missing(Heart_Rate)) or Heart_Rate gt 100 then Subj=10\
    \ Heart_Rate=;\n***Check SBP;\nif (SBP lt 80 and not missing(SBP)) or SBP gt 200\
    \ then Subj=10 SBP=;\n***Check DBP;\nif (DBP lt 60 and not missing(DBP)) or DBP\
    \ gt 120 then Subj=10 DBP=;\n```\n\nThis program reads data from the Blood_Pressure\
    \ data set and prints out for any subject whose heart rate, systolic pressure,\
    \ or diastolic pressure is outside predetermined ranges. Output from this program:\n\
    \nListing of Patient Numbers and Invalid Data Values\nSubj=16 Heart_Rate=36\n\
    Subj=17 Heart_Rate=16\nSubj=39 DBP=130\nSubj=42 Heart_Rate=37\nSubj=45 Heart_Date=38\n\
    Subj=47 Heart_Rate=38\nSubj=49 Heart_Rate=38\n\nThis solution is fine if you only\
    \ have a few variables to test, but it can become tedious when you have a large\
    \ number of variables.\n\n## Task: Demonstrating a macro to report on outliers\
    \ using fixed ranges\n\n### Keywords\n\n- Outliers\n- Range checking\n- Outliers\n\
    - Range checking\n\nThe macro, named Errors, allows you to specify lower and upper\
    \ bounds for numeric variables. You run the Errors macro for each variable and,\
    \ when finished, call another macro (listed later) to generate a consolidated\
    \ error report.\n\n### Program 9.2: Presenting a macro for range checking\n\n\
    ```sas\n*Macro to perform range checking for numeric variables;\n%macro Errors(Var,\
    \ /* Variable to test */\nLow=, /* Low value */\nHigh=, /* High value */\nMissing=IGNORE\
    \ /* To treat missing values */);\n\ndata Temp;\nset Dsn(Var);\nlength $10 $32;\n\
    Variable = \"&Var\";\nValue = &Var;\nif &Var lt Low and not missing(&Var) then\
    \ do;\nReason='Low';\noutput;\nend;\nelse if missing(&Var) then do;\nReason='Missing';\n\
    output;\nend;\nelse if &Var gt High then do;\nReason='High';\noutput;\nend;\n\
    drop &Var;\nrun;\n\nproc append base=Errors data=Tmp;\nrun;\n%mend errors;\n```\n\
    \nTo the Errors macro, you first need to use a %LET to assign values to the macro\
    \ variables Dsn (the data set name) and Idvar (the name of the variable). Because\
    \ you will be calling the macro several times, using %LET statements to assign\
    \ these values saves you the trouble of reentering them each time you call the\
    \ macro.\n\nYou call the Errors macro for Var (the variable you want to test),\
    \ Low (the lower bound), High (the upper bound), and Missing (with the value of\
    \ IGNORE) to ignore missing values, or with any value equal to IGNORE to treat\
    \ missing values as errors.\n\n### Program 9.3: Presenting the Report macro that\
    \ generates a report after the Errors macro has run\n\n```sas\n*Macro to generate\
    \ an error report after the errors macro has run;\n%macro report;\nproc sort data=errors;\n\
    by &Idvar;\nrun;\nproc print data=errors;\ntitle \"Error Report for Data Set &Dsn\"\
    ;\nid &Idvar;\nvar Variable Value Reason;\nrun;\nproc datasets library=work nolist;\n\
    delete errors;\ndelete tmp;\nrun;\nquit;\n%mend report;\n```\n"
  mdcn: "\n\n## 第 8 章：涉及日期的任务 85\n\n这里介绍的程序使用了实现此目标的简单方法——而第二个程序则使用了一种巧妙且优雅的方法。数据集\
    \ MoDayYear 包含 Month、Day 和 Year 变量，但它不包含 SAS 日期。\n\n以下是第一个程序：\n\n### 程序 8.2：给定月、日、年值计算\
    \ SAS 日期（即使日期部分缺失）\n\n```sas\n*当日期部分可能缺失时创建 SAS 日期；\ndata ComputeDate;\n  set\
    \ MoDayYear;\n  if missing(Day) then Date = MDY(Month, 15, Year);\n  else Date\
    \ = MDY(Month, Day, Year);\n  format Date date9;\nrun;\n```\n\n我喜欢这个程序，因为它使用了我最喜欢的函数之一\
    \ `MISSING` 函数。该函数可以接受字符或数值参数。如果参数缺失，它返回值 1（真）；如果参数缺失，则返回值 0（假）。\n\n下一个程序使用了 `COALESCE`\
    \ 函数。你为该函数提供一个值列表，它会返回列表中第一个非缺失的值。我要感谢 SAS 讲师 Mark Jordan，他想出了这种解决方案，如下所示：\n\n\
    ### 程序 8.3：给定月、日、年值计算 SAS 日期（使用 COALESCE 函数）\n\n```sas\n*Mark Jordan 提供的替代（优雅）解决方案；\n\
    data ComputeDate;\n  set MoDayYear;\n  Date = MDY(Month, coalesce(Day, 15), Year);\n\
    \  format Date date9;\nrun;\n```\n\n在该程序中，Day 的值要么是实际值，要么在 Day 为缺失值为 15。\n\n##\
    \ 结论\n\n尽管本章只涵盖了两个涉及日期的任务，但你会发现这两个任务对于你编写的许多程序至关重要。\n\n## 第 9 章：数据清洗任务\n\n- 引言\
    \ ................................................................................................................87\n\
    - 任务：使用给定范围查找可能的数据错误 .................................................................88\n\
    - 任务：演示使用固定范围报告离群值的宏..................89\n- 任务：演示执行自动离群值检测的宏......92\n- 宏的工作原理\
    \ ...................................................................................................................................94\n\
    - 结论 ...................................................................................................................................96\n\
    \n## 引言\n\n数据分析师的首要任务之一是检查可能的无效数值。对于某些变量，如果一个值不在给定范围内，你就可以判断该值是否可能是错误。例如，如果静息心率的值为\
    \ 40 或 100 以上，那将是不常的。\n\n识别可能的离群值的另一种方法是看给定的数据值是否看起来“属于”其他值。常用方法是计算平均值和标准差，如果一个值比平均值高或低若干个标准差，则将其宣布为离群值。许多统计学家使用两个或三个标准差来识别可能的离群值。\n\
    \n正如你将看到的，如果存在较大的数据错误，使用从整个数据集计算出的平均值和标准差进行自动离群值检测可能无效。你将看到如何克服这个问题，以便你对许多数值变量使用自动离群值检测。\n\
    \nCody, Ron. Cody’s Collection of Popular SAS® Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute, Inc. ary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. 更多 SAS 资源，请访问 support.sas.com/bookstore.\n\n## 任务：使用给定范围查找可能的数据错误\n\
    \n### 关键字\n\n- 离群值\n- 范围检查\n\n如果你能为某些数值变量确定一个合理的范围，你可以编写类似下面的程序来识别可能的数据错误：\n\n\
    ### 程序 9.1：使用给定范围查找可能的数据错误\n\n```sas\n*使用已知范围的方法；\ntitle \"患者编号和无效数值列表\";\ndata\
    \ null_;\nset Blood_Pressure;\nfile print;\n***检查心率;\nif (Heart_Rate lt 40 and\
    \ not missing(Heart_Rate)) or Heart_Rate gt 100 then Subj=10 Heart_Rate=;\n***检查收缩压;\n\
    if (SBP lt 80 and not missing(SBP)) or SBP gt 200 then Subj=10 SBP=;\n***检查舒张压;\n\
    if (DBP lt 60 and not missing(DBP)) or DBP gt 120 then Subj=10 DBP=;\n```\n\n\
    该程序从 `Blood_Pressure` 数据集中读取数据，并为任何心率、收缩压或舒张压不在预定范围内的主体打印输出。该程序的输出如下：\n\n患者编号和无效数值列表\n\
    Subj=16 Heart_Rate=36\nSubj=17 Heart_Rate=16\nSubj=39 DBP=130\nSubj=42 Heart_Rate=37\n\
    Subj=45 Heart_Date=38\nSubj=47 Heart_Rate=38\nSubj=49 Heart_Rate=38\n\n如果你只有几个变量需要测试，这个解决方案是可以行的，但当你有大量变量时，它会变得繁琐。\n\
    \n## 任务：演示使用固定范围报告离群值的宏\n\n### 关键字\n\n- 离群值\n- 范围检查\n- 离群值\n- 范围检查\n\n名为 `Errors`\
    \ 的宏允许你为数值变量指定下限和上限。你为每个变量运行 `Errors` 宏，完成后，调用另一个宏（后文所示）来生成报告。\n\n### 程序 9.2：用于范围检查的宏\n\
    \n```sas\n*对数值变量进行范围检查的宏；\n%macro Errors(Var, /* 要测试的变量 */\nLow=, /* 低值 */\nHigh=,\
    \ /* 高值 */\nMissing=IGNORE /* 处理缺失值 */);\n\ndata Temp;\nset Dsn(Var);\nlength\
    \ $10 $32;\nVariable = \"&Var\";\nValue = &Var;\nif &Var lt Low and not missing(&Var)\
    \ then do;\nReason='Low';\noutput;\nend;\nelse if missing(&Var) then do;\nReason='Missing';\n\
    output;\nend;\nelse if &Var gt High then do;\nReason='High';\noutput;\nend;\n\
    drop &Var;\nrun;\n\nproc append base=Errors data=Tmp;\nrun;\n%mend errors;\n```\n\
    \n对于 `Errors` 宏，你首先需要使用 `%LET` 为宏变量 `Dsn`（数据集）和 `Idvar`（变量名）赋值。由于你会多次调用该宏，使用 `%LET`\
    \ 语句分配这些值可以避免每次调用时都重新输入的麻烦。\n\n你调用 `Errors` 宏时，传入 `Var`（你想测试的变量）、`Low`（下限）、`High`（上限），以及\
    \ `Missing`（值为 `IGNORE`）以忽略缺失值，或者传入任何等于 `IGNORE` 的值将缺失值视为错误。\n\n### 程序 9.3：在 `Errors`\
    \ 宏运行后生成报告的宏\n\n```sas\n*在 errors 宏运行后生成错误报告的宏；\n%macro report;\nproc sort data=errors;\n\
    by &Idvar;\nrun;\nproc print data=errors;\ntitle \"数据集 &Dsn 的错误报告\";\nid &Idvar;\n\
    var Variable Value Reason;\nrun;\nproc datasets library=work nolist;\ndelete errors;\n\
    delete tmp;\nrun;\nquit;\n%mend report;\n```\n\n"
