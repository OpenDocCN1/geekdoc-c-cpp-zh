    # Task: Using a MODIFY statement to update a master file from a transaction file


    Keywords


    +   - Modify


    +   - Transaction file


    If you prefer to update your original SAS data set with data from a transaction
    file, you can use a MODIFY statement. Unlike UPDATE, this technique does not create
    a new data set but modifies the original data set.


    Although do not have to sort your master file and transaction file when using
    a MODIFY statement followed by a BY statement, doing so will improve efficiency.


    The following short program shows how you can update a master file from a transaction
    file using MODIFY:


    Program 4.11: Using a MODIFY statement to update a master file from a transaction
    file


    ```

    data Hardware;

    modify Hardware_New_Prices;

    run;

    ```


    After you run this program, the SAS data set Hardware will be identical to the
    Hardware_June2012 data set created in the previous task.


