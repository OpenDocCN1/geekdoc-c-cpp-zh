    \nHere is a listing of data School:\n\n| ID | Grade |\n|---|---|\n| 001 | 97 |\n\
    | 002 | 99 |\n| 003 | A |\n| 004 | C |\n| 005 | 72 |\n| 006 | f |\n| 007 | b |\n\
    \nAs you can see, each student now has a grade.\n\n## Conclusion\n\nWriting your\
    \ own informat is an easy and elegant method for reading a combination of character\
    \ and numeric data. Give it a try next time you are presented with.\n\n## Chapter\
    \ 11: Tasks Involving Multiple Observations\n\n- Introduction .....................................................................................................101\n\
    - Task: Using PROC SORT to detect duplicate values or duplicate observations (records)\
    \ ........................................................................................102\n\
    - Task: Extracting the first or last observation for each subject...............................106\n\
