    \ FIRST.Subj=1 LAST.Subj=1\n```\n\nFirst  变量非常有用。你可能需要在读取主题的第一个观测值时执行某些操作（例如初始化计数器），并在读取主题的最后一个观测值时执行操作（例如输出观测值）。\n\
