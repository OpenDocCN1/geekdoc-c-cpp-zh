    ```

    *方法2 - 使用 PROC APPEND;

    proc append base=Name1 data=Name2;

    run;

    ```


    你使用 `BASE=` 选项命名第一个数据集，使用 `DATA=` 选项命名要添加的数据。运行此程序后，Name1 数据包含六个观测值。


