    \ : output;\nMPRINT (MOVING_AVE) : end;\nMPRINT (MOVING_AVE) : drop _x;\nMPRINT\
    \ (MOVING_AVE) : run;\n```\n\n记住，你可以通过 SAS 网站 (support.sas.com/cody) 复制此宏以及书中的所有程序。\n\
    \nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and How to Tackle\
