    \n## Introduction\n\nJust about every SAS programmer can create and use formats.\
    \ But not as many SAS programmers use PROC FORMAT to create their own informats.\
    \ This is a very powerful feature of SAS. It is quite easy to do—if you know how\
    \ to write a format, you only need to learn a few things to be able to write an\
    \ informat.\n\n## Task: Reading a combination of character and numeric data\n\n\
    - Keywords\n- PROC FORMAT\n- Informat\n\nEnhanced numeric informat\n\nFor this\
    \ first task, you want to read peoples' oral temperatures. Instead of entering\
    \ 98.6 (a normal body temperature), you want to enter an uppercase or lowercase\
    \ 'n' (to save you some typing). The first program handles this problem using\
    \ a traditional approach:\n\n# 98 Cody's Collection of Popular SAS Programming\
    \ Tasks and How to Tackle Them\n\n# Program 10.1: Reading a combination of character\
    \ and numeric data (traditional approach)\n\n```\n*A traditional approach to reading\
    \ a combination of character and numeric data;\ndata Temperature;\ninput Dummy\
    \ $ 8;\nif upcase (Dummy) = 'N' then Temp = 98.6;\nelse Temp = input (Dummy, 8);\n\
    if Temp gt 10 or Temp lt 96 then Temp = .;\ndrop Dummy;\ndatalines;\n101 97.3\
    \ 111 n 104.5 85\n;\n```\n\nFirst, you read each value as a character. Next, test\
    \ if the value is an uppercase or lowercase 'n'. If so, you set the value of Temp\
    \ to 98.6. If not, use the INPUT function to perform the character-to-numeric\
    \ conversion.\n\nHere is a listing of data set Temperatures:\n\n| Temp |\n|---|---||\
    \ 101.0 |\n| 98.6 |\n| 97.3 |\n| - |\n| 98.6 |\n| 98.6 |\n| 104.5 |\n| - |\n\n\
    You can accomplish the same goal by creating your own informat, as follows:\n\n\
    # Program 10.2: Reading a combination of character and numeric data (using a user-defined\
    \ informat)\n\n```\n*Using an enhanced informat to read a combination of character\
    \ and numeric data;\nproc format;\ninvalue readtemp (upcase)\n96 - 106 = _same\n\
    '*N*' = 98.6\nother = .;\nrun;\n```\n\nCody, Ron. Cody's Collection of Popular\
    \ SAS® Programming Tasks and How to Tackle Them. Copyright © 2012, SAS Institute\
    \ Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/bookstore.\n\n## Chapter 10: Reading Data with User-Defined\
    \ INFORMATS 99\n\n```\ndata Temperatures;\ninput Temp : readtemp5. @@;\ndatalines;\n\
    101 N 97.3 111 n 67 104.5 85\n;\n```\n\nYou use a value to make a format—use an\
    \ INVALUE statement to make an informat. Because the n's may be in lowercase,\
    \ you use the UPCASE option (placed in parentheses following the informat name)\
    \ to convert all letters to uppercase. Values between 96 and 106 are left alone\
    \ (the keyword _SAME does this). A value of 98.6 (a numeric value) is used when\
    \ the letter 'N' is read. All other values result in a missing value. An informat\
    \ that reads both character and numeric data is referred to as an informat. Data\
    \ set Temperatures is identical to the one listed previously.\n\nThis is an efficient\
    \ and elegant method for reading combinations of character and numeric data.\n\
    \nThe next example reads a combination of numeric or letter grades and converts\
    \ the letter grades to numeric values. Here is the program:\n\n# Program 10.3:\
    \ Reading letter grades and converting them to numeric values using an informat\n\
    \n```\nproc format;\nvalue readgrade(upcase just)\n'A' = 95\n'B' = 85\n'C' = 75\n\
    'F' = 65\nother = _same;\nrun;\n\ndata School;\ninput ID = $3. Grade = readgrade;\n\
    datalines;\n001 97\n002 99\n003 A\n004 C\n005 72\n006 f\n007 b\n;\n```\n\nTwo\
    \ options, UPCASE and JUST, are used here. UPCASE, as described in the previous\
    \ program, converts all letters to uppercase. The JUST option left justifies all\
