    # About This Book


    # Purpose


    There are quite a few programming tasks that, at some point in your programming
    career, you need to accomplish one of them. For example, you may need to convert
    character values to numeric values or combine summary data with detail data. Why
    "reinvent the wheel" every time you need to accomplish one of these tasks? That''s
    what this book is all about—it contains annotated programs to solve many of the
    common programming tasks you face on a daily basis.


    # Is This Book for You?


    This book is useful for all levels of programmers, from novice to expert.


    # Prerequisites


    To benefit from this book, you need to be able to write SAS programs, using either
    the Base SAS Enhanced Editor or SAS Enterprise Guide.


    # Scope of This Book


    There are 12 chapters in this book, covering many of the more popular programming
    tasks. In many cases, the book presents a macro to solve a task as well as a macro
    that performs the task automatically. You will find several macros in the book
    that will save you hours of tedious programming. Many of the tasks, as determining
    the number of observations in a SAS data set, are solved four or five different
    approaches. This allows you to choose the method you prefer as well as providing
    a "teaching moment" to explore programming techniques you may not have seen.


    # Highlights


    Were you given a SAS set with variables such as Height, Weight, or Age, and were
    they all character values? If so, join the club. One of the Tasks in this book
    shows you how to convert character variables into numeric variables. Better still,
    we include a macro that allows you to specify an input and output data set name,
    with a list of character variables need converting, and the macro automatically
    creates a new data set with all the character converted to numeric variables,
    maintaining the original variable names.


    Do you ever need to check for errors in your numeric values? If so, you will find
    two macros in this book that will help you. One of them allows you to specify
    ranges for each numeric variable and generate an error report for any observations
    where a value is outside the specified range. The other macro uses automatic outlier
    detection to report possible data errors.'
  - '[PAGE 15]


    # vi About This Book


    Have you ever needed to concatenate two SAS data sets? With detail data. Of course
    you have! This is easily accomplished using a SET statement or PROC APPEND. What
    if the two data sets have character variables lengths are not the same in the
    two data sets? This problem is solved by a macro that concatenates the two data
    sets, using the longer length of any character variables that are not the same
    in the two data sets.


    It is convenient to perform an operation on every numeric variable or every character
    variable in a SAS data set. For example, you may want to convert all numeric values
    of 999 to a SAS missing value, or you may want to convert all character variables
    to uppercase. These tasks are demonstrated in this book.


    How about combining data (perhaps a mean of all observations)? One of the chapters
    shows you several interesting ways to accomplish such tasks.


    Restructuring (also called transposing) a data set from one observation to many
    or vice versa is a common programming requirement. You will find programs to perform
    these tasks using a DATA step approach and using PROC TRANSPOSE.


