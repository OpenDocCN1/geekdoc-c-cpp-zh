    \ y | n | n | y | | 3 | 2 |\n| 2 | N | n | Y | n | | 1 | 3 |\n| 4 | y | Y | n\
    \ | Y | | 3 | 2 |\n| 5 | y | Y | n | y | | 5 | 0 |\n\n该任务更优雅的解决方案是使用两个 SAS 函数：CATS\
