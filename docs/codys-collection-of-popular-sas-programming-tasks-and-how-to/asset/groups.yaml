    - Task: Computing differences between observations (for each subject).........110\n\
    - Task: Computing the difference between the first and last observation for each\
    \ subject.......112\n- Conclusion .................................................................................................114\n\
    \n## Introduction\n\nThis chapter demonstrates some of the techniques you need\
    \ when you have multiple observations per subject (or any other). For example,\
    \ you may have a SAS data set containing visits to a clinic. Each patient could\
    \ have a different number of visits. Some of the tasks you may want to perform\
