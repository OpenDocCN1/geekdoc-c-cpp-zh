    \n## 程序 12.7：使用 CATS 和 COUNTC 函数统计响应\n\n```sas\n*Solution using the Count and\
    \ Cats functions;\ndata Count_YN;\n  set Questionnaire;\n  Num_Y = countc(cats\
    \ of Q1-Q5),'Y','i');\n  Num_N = countc(cats of Q1-Q5),'N','i');\nrun;\n```\n\n\
    Cody, Ron, Cody's Code of Popular SAS® Programming Tasks and How to Tackle Them.\
    \ Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. 更多 SAS 资源，请访问 support.sas.com/bookstore.\n\n`COUNTC` 函数的第一个参数是你想要查询的字符串，第二个参数指定了你想要统计的一个或多个字符，第三个参数是修饰符。'I'\
    \ 修饰符意味着忽略大小写。运行此程序的输出与之前描述的较长程序相同。\n\nCody 常用 SAS 编程任务合集及解决方案\n\n## 任务：计算移动平均值\n\
    \n## 关键词\n\n- 移动平均\n- LAG 函数\n\n移动平均用于观察可能存在大幅波动的数据趋势。在示例中，你希望平均三天的数据以观察波动难以观察的趋势，第二个是四天，以此类推。由于你需要平均三个观测值，可以使用\
