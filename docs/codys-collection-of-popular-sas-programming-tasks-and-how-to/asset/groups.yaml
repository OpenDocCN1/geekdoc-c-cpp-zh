    data Demographic_June2012;\nupdate Demographic New_Values;\nby Subj;\nrun;\n```\n\
    \nThe newly created data set, Demographic_June2012, is identical to the old Demographic\
    \ data set except for the new values for subjects 2 and 7.\n\n## Task: Matching\
    \ names from two SAS data sets where the names may not be spelled the same (fuzzy\
    \ merge)\n\n### Keywords\n\n- Fuzzy merge\n- Inexact matching\n- SPEDIS function\n\
    \nIf you are called upon to merge data from two SAS data sets when you do not\
    \ have a unique identifier in both files, sometimes you have to resort to using\
    \ names (and other variables) to determine which observations from the two data\
    \ sets belong together.\n\nTwo useful tools for performing this task are SPEDIS\
    \ function (standing for spelling distance) that helps you determine words that\
    \ have similar spelling but are not an exact match, and PROC SQL, that can perform\
    \ a Cartesian product.\n\nThe SPEDIS function takes two arguments. If these two\
    \ arguments are identical, the function returns a zero. For each category of spelling\
    \ error, the function assigns penalty points. Some spelling errors are more serious\
    \ than others and are assigned more penalty points. For example, if the first\
    \ letter is not the same in the two strings, the function assigns a large penalty.\
    \ Adding a letter or changing the position of two letters (ie versus ei for example),\
    \ the function assigns a relatively small penalty.\n\nAfter the function adds\
    \ all the penalty points, it divides the total penalty by the length of the first\
    \ argument. This makes sense, since getting a letter wrong in a three-letter word\
    \ is a much more serious error than getting a letter wrong in a 10-letter word.\n\
    \nIt is a matter of trial and error to decide what you consider a large spelling\
    \ error. If you try to match two names and allow for a large distance, you may\
    \ match two names that are actually different—if you insist on a small spelling\
    \ error before you consider two names to be a match, you may fail to match two\
    \ names that actually belong to the same person.\n\nPROC SQL can create a Cartesian\
    \ product between two data sets. This is accomplished by creating every combination\
    \ of observations in one data set with every observation in a second data set.\n\
    \n# 54 Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \nTo help visualize this, two SAS data sets, Name_One and Name_Two, are listed\
    \ next:\n\n### Listing of Name_One\n\n| Name1 | DOB1 | Gender |\n| --- | --- |\
    \ --- |\n| Friedman | 14JUL1946 | M |\n| Chien | 21OCT1965 | F |\n| MacDonald\
    \ | 12FEB2001 | M |\n| Fitzgerald | 04AUG1966 | M |\n| GREGORY | 05FEB1955 | F\
    \ |\n\n### Listing of Name_Two\n\n| Name2 | DOB2 | Gender |\n| --- | --- | ---\
    \ |\n| Friedman | 14JUL1946 | M |\n| Chen | 21OCT1965 | F |\n| McDonald | 12FEB2001\
    \ | M |\n| Fitzgerald | 04AUG1966 | M |\n| Gregory | 05FEB1955 | F |\n\nThe first\
    \ 13 observations in a Cartesian product of these two data sets Name_One and Name_Two\
    \ are shown next:\n\n| Name1 | DOB1 | Gender | Name2 | DOB2 | Gender |\n| ---\
    \ | --- | --- | --- | --- | --- |\n| Friedman | 14JUL1946 | M | Friedman | 14JUL1946\
    \ | M |\n| Friedman | 14JUL1946 | M | Chen | 21OCT1965 | F |\n| Friedman | 14JUL1946\
    \ | M | McDonald | 12FEB2001 | M |\n| Friedman | 14JUL1946 | M | Fitzgerald |\
    \ 04AUG1966 | M |\n| Friedman | 14JUL1946 | M | Gregory | 05FEB1955 | F |\n| Chien\
    \ | 21OCT1965 | F | Friedman | 14JUL1946 | M |\n| Chien | 21OCT1965 | F | Chen\
    \ | 21OCT1965 | F |\n| Chien | 21OCT1965 | F | McDonald | 12FEB2001 | M |\n| Chien\
    \ | 21OCT1965 | F | Fitzgerald | 04AUG1966 | M |\n\n# Chapter 4: Combining and\
    \ Updating SAS Data Sets 55\n\n| Name1 | DOB1 | Gender1 | Name2 | DOB2 | Gender2\
    \ |\n|---|---|---|---|---|---|\n| Chien | 21OCT1965 | F | Gregory | 05FEB1955\
    \ | F |\n| MacDonald | 12FEB2001 | M | Freeman | 14JUL1946 | M |\n| MacDonald\
    \ | 12FEB2001 | M | Chen | 21OCT1965 | F |\n| MacDonald | 12FEB2001 | M | McDonald\
    \ | 12FEB2001 | M |\n\nFor this example, want to find observations in the Cartesian\
    \ product data set where the date of birth and the gender are the same in each\
    \ data set and where the spelling distance between the two names is less than\
    \ a predetermined value. Here is the PROC code to produce a list of possible matches\
    \ and exact matches:\n\n## 4.14: Performing a “fuzzy” match between two data sets\n\
    \n```sas\nproc sql;\ncreate table Possible_Matches as\nselect * from Name_One,\
    \ Name_Two\nwhere speris(upcase(Name1),upcase(Name2)) between 1 and 25\n  and\
    \ DOB1 = DOB2\n  and Gender = Gender2;\nquit;\n```\n\n```sas\nproc sql;\ncreate\
    \ table Exact_Matches as\nselect * from Name_One, Name_Two\nwhere speris(upcase(Name1),upcase(Name2))\
    \ = 0\n  and DOB1 = DOB2\n  and Gender = Gender2;\nquit;\n```\n\nThe first PROC\
    \ SQL step creates a Cartesian product between Name_One and Name_Two. The WHERE\
    \ clause selects observations in the Cartesian product data set where the names\
    \ are within a distance of 25 (but not zero, which would be an exact match). To\
    \ be sure match names are not in the same case, use the UPCASE function on both\
    \ names. As a further effort to determine which observations belong together,\
    \ you can check that the date of birth and the gender are the same. You may want\
    \ to insist that these variables are not missing before attempting a match.\n\n\
    The second step creates a data set of exact matches. A listing of both data sets\
