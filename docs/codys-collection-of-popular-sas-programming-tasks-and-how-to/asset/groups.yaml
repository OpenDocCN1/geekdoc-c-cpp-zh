    # ## Introduction


    This chapter describes how to use individual values such as ages or income and
    create new variables that represents groups. For example, you may want to group
    ages in 20-year intervals or you may want to convert income into deciles. In this
    chapter, you will see several ways to accomplish these goals.


    # ## Task: Grouping values using IF-THEN-ELSE statements


    +   Keywords

    Grouping values

    If-Then-Else statement


    For this example, you have a variable called Heart_Rate that represents a person''s
    heart rate in beats per minute. With all SAS programming, assume that Heart_Rate
    may be a missing value. Here is the code:


    # ### Program 2.1: Using IF-THEN-ELSE logic to group values


    ```

    *Grouping values using if-then-else statements;*

    data Grouped;

    length HR_Pressure ($ 10,);

    set Blood_Pressure(keep=Sub) Heart_Rate);

    if missing(Heart_Rate) then HR_Group = '' ''

    else if Heart_Rate lt 40 then HR_Group = ''<40'';

    else if Heart_Rate lt 60 then HR_Group = ''40-60'';

    ```'
  - '[PAGE 35]


    ```

    else if Heart_Rate lt 80 then HR_Group = ''60-<80'';

    else if Heart_Rate lt 100 then HR_Group = ''80-<100'';

    else HR_Group = ''100+'';

    run;

    ```


    The first step is to use a LENGTH statement to define the length of the new HR_Group
    variable. We use the MISSING function to test if Heart_Rate is missing. If so,
    you set HR_Group to a character missing value. Once you do this, it is straightforward
    to test the HR_Rate values and create the HR_Group variable. Here are the first
    10 observations from data set Grouped:


    Listing of data set Grouped


    | HR_Group | Subj | Heart_Rate |

    |---|---|---|n| 60-<80 | 1 | 71 |

    | | 2 | |

    | 60-<80 | 3 | 78 |

    | | 4 | 60 |

    | 60-<80 | 5 | 79 |

