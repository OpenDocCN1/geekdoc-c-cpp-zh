    \nConverting this program to a macro is straightforward. You need to substitute\
    \ macro variables for the input SAS data sets and the concatenated data set. So\
    \ finally, here is the macro:\n\n## Program 4.8: A macro to concatenate two SAS\
    \ data sets with variable values of different lengths\n\n```sas\n%macro concatenate\n\
    (Dsn1=/*Name of the first data set */\nDsn2=/*Name of the second data set */\n\
    Out=/*Name of combined data set */)\n\nproc contents data=&Dsn1 noprint\nout=out1(keep=Name\
    \ Type where=(Type=2));\nrun;\n\nproc contents data=&Dsn2 noprint\nout=out2(keep=Name\
    \ Type where=(Type=2));\nrun;\n\ndata out1;\nset out1;\nName = propcase(Name);\n\
    run;\n\ndata out2;\nset out2;\nName = propcase(Name);\nrun;\n\ndata null;\nfile\
    \ \"c:\\tasks\\combined.sas\";\nmerge out1 out2(rename=(Length=Length2)) end=Last;\n\
    by Name;\nif n_ = 1 then put \"Data out\";\nLength = max(Length, Length2);\nput\
