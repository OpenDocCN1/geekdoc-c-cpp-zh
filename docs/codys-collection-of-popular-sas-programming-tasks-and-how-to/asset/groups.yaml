    Subj=004 FIRST.Subj=0 LAST.Subj=1

    Subj=005 FIRST.Subj=1 LAST.Subj=1

    ```


    First and Last variables are extremely useful. You may need to perform some operations
    when you are reading the first observation for a subject (such as initializing
    counters), and also perform operations when reading the last observation for a
    subject (such as outputting an observation).


    As an example, if you want to output the last observation for each subject, then
    proceed as follows:


    # Program 11.6: Selecting the last observation for each subject


    ```

    proc sort data=Duplicates out=Sorted_Duplicates;

    by Subj;

    run;

    ndata Last;

    set Sorted_Duplicates;

    by Subj;

    if Last.Subj;

    run;

    ```


    The statement BY creates the two variables First.Subj and Last.Subj. The subsetting
    IF statement is only true when you are reading the last observation for each subject
    (it is also equivalent to: if Last.Subj = 1), and the resulting data set contains
    the last observation for each subject as shown in the following list:


    | Subj | Gender | Age | Height | Weight |

    |---|---|---|---||

    | 001 | M | 23 | 63 | 122 |

    | 002 | F | 44 | 59 | 109 |

    | 003 | M | 87 | 67 | 200 |

    | 004 | F | 50 | 59 | 201 |

    | 005 | M | 45 | 69 | 188 |


    You can also use a similar technique to output the first observation for each
    subject.'
- md: "\n# Task: Detecting duplicate BY values using a DATA step\n\nKeywords\n- PROC\
    \ SORT\n- Duplicate BY values\n- First. variables\n- Last. variables\n\nYou can\
    \ use the First. and Last variables described in the previous section to perform\
    \ tasks involving duplicates and multiple observations per subject.\n\nIf you\
    \ want to determine if there are any duplicate values for Subj in the Duplicates\
    \ data set (and output them to a SAS data set), proceed as follows:\n\n## Program\
    \ 11.7: Detecting duplicate BY values using a DATA step\n\n```sas\n*Using a DATA\
    \ step to detect duplicate BY values;\nproc sort data=Duplicates out=Sorted_Duplicates;\n\
    \  by=Subj;\nrun;\ndata Dups;\n  set Sorted_Duplicates;\n  by=Subj;\n  if First.Subj\
    \ and last.Subj then delete;\nrun;\n```\n\nIf there is only one observation for\
    \ a value of Subj, then both First.Subj and Last.Subj will be true. If you delete\
    \ these observations, you are left with a data set of duplicate BY values, as\
    \ shown in the following listing:\n\n| Subj | Gender | Age | Height | Weight |\n\
    |---|---|---|---|---||\n| 002 | F | 44 | 59 | 109 |\n| 002 | F | 44 | 59 | 109\
    \ |\n| 004 | F | 100 | 53 | 112 |\n| 004 | F | 50 | 59 | 201 |\n\n# Task: Identifying\
    \ observations with exactly 'n' observations per subject\n\nKeywords\n- Multiple\
    \ observations per subject\n- 'n' observations per subject\n\nThere are times\
    \ when you expect a fixed number of observations per subject (or other BY variable).\
    \ You can accomplish this task by initializing a counter when you are reading\
    \ the first observation per subject, incrementing the counter for each successive\
    \ observation with the same subject number, and checking the counter when you\
    \ are reading the last observation for each subject.\n\nData set TwoRecords was\
    \ created to demonstrate this task. Here is the listing:\n\n| Subj | Weight |\n\
    |---|---|\n| 001 | 200 |\n| 001 | 190 |\n| 002 | 155 |\n| 002 | 157 |\n| 003 |\
    \ 123 |\n| 004 | 220 |\n| 004 | 221 |\n| 005 | 111 |\n| 005 | 112 |\n\nSubjects\
    \ 001, 002, and 005 have two observations each. You can output the observations\
    \ for all subjects who do not have exactly two observations with the following\
    \ program:\n\n## Program 11.8: Identifying subjects who have exactly two observations\n\
    \n```sas\nproc sort data=Two_Records;\n  by Subj;\n  run;\n\ndata Not_Two;\n \
    \ set Two_Records;\n  by subj;\n  if first.Subj then n=0;\n  n + 1;\n  if last.Subj\
    \ and n ne 2 then output;\nrun;\n```\n\nEach time you are processing the first\
    \ observation for a subject, you set your counter (n) equal to zero. You then\
    \ increment the counter using a SUM statement. Finally, when you reach the last\
    \ observation for each subject and n is not equal to 2, you output an observation.\n\
    \nThe following listing shows all the subjects who do not have exactly two observations:\n\
    \n| Subj | Weight | n |\n|---|---|---|\n| 003 | 123 | 1 |\n| 004 | 210 | 3 |\n\
    \n# Task: Computing differences between observations (for each subject)\n\nKeywords\n\
    - Differences between observations\n- LAG function\n\nOne of the most common requirements\
    \ when you have multiple observations per subject is to compute differences between\
    \ observations. To demonstrate this, take a look at the Visits data set. (Each\
    \ subject has a unique value of the variable Patient.)\n\n| Patient | Visit |\
    \ Weight |\n|---|---|---|\n| 001 | 1 | 120 |\n| 001 | 2 | 124 |\n| 001 | 3 | 124\
    \ |\n| 002 | 1 | 200 |\n| 003 | 1 | 310 |\n\n| Patient | Visit | Weight |\n|---|---|---|\n\
    | 003 | 2 | 305 |\n| 003 | 3 | 298 |\n| 003 | 3 | 290 |\n| 004 | 1 | 160 |\n|\
    \ 004 | 2 | 162 |\n\nEach patient has one to three visits. You want to see the\
    \ weight change from visit to visit for each patient. The simplest way is to use\
    \ the LAG function, like this:\n\n## Program 11.9: Using the LAG function to compute\
    \ differences between observations\n\n```sas\n*Computing inter-patient differences;\n\
    proc sort data=Visits;\n  by Patient Visit;\nrun;\n\ndata Difference;\n  set Visits;\n\
    \  by Patient;\n  Diff_Wt = Weight - lag(Weight);\n  if not first.Patient then\
    \ output;\nrun;\n```\n\nThe LAG function returns the value of its argument the\
    \ last time the function was executed. If you execute the LAG function for every\
    \ iteration of the DATA step, it will return a value from a previous observation.\
    \ You may be tempted to execute the LAG function when you are reading the first\
    \ observation for each patient, as the lag value is the last value from the previous\
    \ patient. This is OK. You are only outputting differences for the second observation\
    \ for each patient. If you use a statement such as\n\n```sas\nif not first.Patient\
    \ then Diff_Wt = lag(Weight);\n```\n\nit will not work the next time you execute\
    \ the LAG function it will still return the value from the previous patient. Unless\
    \ you are using the LAG function in a very unusual situation, such as in Program\
    \ 111, you should not use the LAG function in conditional logic. In the previous\
    \ program, you can use the DIF function (DIF(Weight)) instead of the LAG function\
    \ (LAG(Weight)) if you prefer.\n\nHere is a list of data Difference:\n\n| Patient\
    \ | Visit | Weight | Diff_Wt |\n|---|---|---|---|\n| 001 | 2 | 124 | 4 |\n| 001\
    \ | 3 | 124 | 0 |\n| 003 | 2 | 305 | -5 |\n| 003 | 3 | 298 | -7 |\n| 003 | 3 |\
    \ 290 | -8 |\n| 004 | 2 | 162 | 2 |\n\n# Task: Computing the difference between\
    \ the first and last observation each subject\n\nKeywords\n- Differences between\
    \ first and last observations\n- RETAIN statement\n- LAG function (executed conditionally)\n\
    \nA similar task to the previous task is to compute differences between the first\
    \ and last visit for each patient. There are two interesting ways to accomplish\
    \ this: The first method uses retained variables (that are not set back to missing\
    \ for each iteration of the DATA step). The other method uses the LAG function\
    \ in a unconventional way. Here is the program, followed by an explanation:\n\n\
    ## Program 11.10: Computing the differences between the first visit and last visit\
    \ for each patient\n\n```sas\n*Computing the differences between the first visit\
    \ and last visit;\nproc sort data=Visits;\n  by Patient;\nrun;\ndata First_Last;\n\
    \  set Visits;\n  by Patient;\n*Delete observations where only one visit;\nif\
    \ first.Patient and last.Patient then delete;\nretain First_Wt;\nif first.Patient\
    \ then First_Wt = Weight;\nif last.Patient then do;\n  Diff_Wt = Weight - First_Wt;\n\
    \  output;\nend;\nrun;\n```\n\nYou need the data set sorted by Patient to create\
    \ the First.Patient and Last.Patient variables. However, it is a good idea, when\
    \ you are sorting, to Visit in the sort to ensure that all the visits for each\
    \ patient are also in order (don't assume when you don't have to).\n\nNext, remove\
    \ any patient with one observation—you can't compute differences between patients.\
    \ You accomplish this by deleting all observations where First.Patient and Last.Patient\
    \ are both true. Next, use a RETAIN statement for the variable First_Wt. When\
    \ you read the first observation for any patient, you set First_Wt equal to Weight.\
    \ When you read the last visit for any patient, you compute the difference of\
    \ First_Wt and Last_Wt.\n\nA listing of data First, Last is shown here:\n\n| Patient\
    \ | Visit | First_Wt | Diff_Wt |\n|---|---|---|---|\n| 001 | 3 | 124 | 4 |\n|\
    \ 003 | 3 | 310 | -20 |\n| 004 | 2 | 160 | 2 |\n\nAn interesting and unconventional\
    \ program to solve this task is shown next:\n\n## Program 11.1: Using the LAG\
    \ function to compute differences between the first and last visit for each patient\n\
    \n```sas\n*Redoing the previous program using the LAG function;\ndata First_Last;\n\
    \  set Visits;\n  by Patient;\n*Delete observations where only one visit;\n  if\
    \ first.Patient and last.Patient then delete;\n  if first.Patient or last.Patient\
    \ then Diff_Wt = Weight -\n    lag(Weight);\n  if last.Patient then output;\n\
    run;\n```\n\nRemember, in this chapter you were cautioned not to execute the LAG\
    \ (or DIF) function conditionally. However, for this application you first eliminate\
    \ any patient with one visit (as in the previous program). Next, use the LAG function\
    \ only when you are reading the first or last observation for each patient. When\
    \ you are reading a value from the last observation for a patient, you need to\
    \ realize that the LAG function executed was at the first visit. There, you are\
    \ obtaining a difference between the first and last visits.\n\nCody, Ron. Cody's\
    \ Collection of Popular SAS® Programming Tasks and How to Tackle Them. Copyright\
    \ © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/bookstore.\n"
  mdcn: "\n\n# 任务：使用 DATA step 检测重复的 BY 值\n\n关键字\n- PROC SORT\n- 重复的 BY 值\n- First.\
    \ 变量\n- Last. 变量\n\n你可以使用上一节中描述的 `First.` 和 `Last.` 变量来执行涉及重复值和每个受试者多个观测值的任务。\n\
    \n如果你想确定 `Duplicates` 数据集中每个 `Subj` 是否存在任何重复值（并将其输出到 SAS 数据集中），请按照以下步骤操作：\n\n\
    ## 程序 11.7：使用 DATA step 检测重复的 BY 值\n\n```sas\n*Using a DATA step to detect duplicate\
    \ BY values;\nproc sort data=Duplicates out=Sorted_Duplicates;\n  by=Subj;\nrun;\n\
    data Dups;\n  set Sorted_Duplicates;\n  by=Subj;\n  if First.Subj and last.Subj\
    \ then delete;\nrun;\n```\n\n如果某个 `Subj` 的值只有一个观测值，那么 `First.Subj` 和 `Last.Subj`\
    \ 都为真（true）。如果你删除了这些观测值，就会剩下的一个包含重复 BY 值的数据集，如下列表所示：\n\n| Subj | Gender | Age\
    \ | Height | Weight |\n|---|---|---|---|---||\n| 002 | F | 44 | 59 | 109 |\n|\
    \ 002 | F | 44 | 59 | 109 |\n| 004 | F | 100 | 53 | 112 |\n| 004 | F | 50 | 59\
    \ | 201 |\n\n# 任务：识别每个受试者恰好有 'n' 个观测值\n\n关键字\n- 每个受试者多个观测值\n- 每个受试者 'n' 个观测值\n\
    \n在某些情况下，预期每个受试者（或其他 BY 变量）有固定数量的观测值。你可以通过读取每个受试者的第一个观测值时初始化计数器，为每个具有相同受试者编号的后续观测增加计数，并在读取每个受试者的最后一个观测值时检查计数器来完成此任务。\n\
    \n创建了数据集 `TwoRecords` 来演示此任务。列表如下：\n\n| Subj | Weight |\n|---|---|\n| 001 | 200\
    \ |\n| 001 | 190 |\n| 002 | 155 |\n| 002 | 157 |\n| 003 | 123 |\n| 004 | 220 |\n\
    | 004 | 221 |\n| 005 | 111 |\n| 005 | 112 |\n\n受试者 001、002 和 005 分别有两个观测值。你可以使用以下程序输出所有恰好具有两个观测值的受试者的观测值：\n\
    \n## 程序 11.8：识别恰好具有两个观测值的受试者\n\n```sas\nproc sort data=Two_Records;\n  by Subj;\n\
    \  run;\n\ndata Not_Two;\n  set Two_Records;\n  by subj;\n  if first.Subj then\
    \ n=0;\n  n + 1;\n  if last.Subj and n ne 2 then output;\nrun;\n```\n\n每当你处理一个受试者的第一个观测值时，你将计数器（n）\
    \ 设置为零。然后，你使用 `SUM` 语句增加计数器。最后，当你到达每个受试者的最后一个观测值且 `n` 不等于 2 时，你就输出该观测值。\n\n以下列表显示了所有恰好具有两个观测值的受试者：\n\
    \n| Subj | Weight | n |\n|---|---|---|\n| 003 | 123 | 1 |\n| 004 | 210 | 3 |\n\
    \n# 任务：计算观测值之间的差异（针对每个受试者）\n\n关键字\n- 观测值之间的差异\n- LAG 函数\n\n当每个受试者有多个观测值时，最常见的要求之一是计算观测值之间的差异。为了演示这一点，请查看\
    \ `Visits` 数据集。（每个受试者的 `Patient` 变量都有唯一值。）\n\n| Patient | Visit | Weight |\n|---|---|---|\n\
    | 001 | 1 | 120 |\n| 001 | 2 | 124 |\n| 001 | 3 | 124 |\n| 002 | 1 | 200 |\n|\
    \ 003 | 1 | 310 |\n\n| Patient | Visit | Weight |\n|---|---|---|\n| 003 | 2 |\
    \ 305 |\n| 003 | 3 | 298 |\n| 003 | 3 | 290 |\n| 004 | 1 | 160 |\n| 004 | 2 |\
    \ 162 |\n\n每个患者有一次到三次访问。你想查看每个患者从一次访问到下一次访问的体重变化。简单的方法是使用 `LAG` 函数，如下：\n\n## 程序\
    \ 11.9：使用 LAG 函数\n\n[Note: The original text ends at this point without the code\
    \ block for 11.9]\n\n"
