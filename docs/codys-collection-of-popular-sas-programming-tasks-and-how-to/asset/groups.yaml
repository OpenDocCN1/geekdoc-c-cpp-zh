    # Chapter 4: Combining and Updating SAS Data Sets 49


    You can either update the original data set or create a new one. It is a good
    idea to use a different name for the new, updated data. Before showing you the
    next section of the program, let''s take a moment to review the UPDATE statement.


    Unlike a MERGE, missing values in the right-most data set (New_Prices in this
    example) do not replace values in the left-most data set (Hardware in this example).
    Also, unlike a MERGE, you must follow an UPDATE statement with a BY statement.


    The remaining portion of the program, demonstrating the UPDATE statement, follows:


    ```

    Hardware_June2012;

    update Hardware_New_Prices;

    by Item_Number;

    run;

    ```


    The following listing shows the prices for the two items (2002 and 4006) have
    been updated:


