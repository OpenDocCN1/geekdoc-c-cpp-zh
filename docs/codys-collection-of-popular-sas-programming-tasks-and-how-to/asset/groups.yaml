    # # Chapter 10: Reading Data with User-Defined INFORMATS


    +   - Introduction ............................................................................................................................97

    - Task: Reading a combination of character and numeric data ................................97

    - Conclusion ...................................................................................................................100


    # ## Introduction


    Just about every SAS programmer can create and use formats. But not as many SAS
    programmers use PROC FORMAT to create their own informats. This is a very powerful
    feature of SAS. It is quite easy to do—if you know how to write a format, you
    only need to learn a few things to be able to write an informat.


    # ## Task: Reading a combination of character and numeric data


    +   - Keywords

    - PROC FORMAT

    - Informat


    Enhanced numeric informat


    For this first task, you want to read peoples'' oral temperatures. Instead of
    entering 98.6 (a normal body temperature), you want to enter an uppercase or lowercase
    ''n'' (to save you some typing). The first program handles this problem using
    a traditional approach:'
  - '[PAGE 119]


    # 98 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    # Program 10.1: Reading a combination of character and numeric data (traditional
    approach)


    ```

    *A traditional approach to reading a combination of character and numeric data;

    data Temperature;

    input Dummy $ 8;

    if upcase (Dummy) = ''N'' then Temp = 98.6;

    else Temp = input (Dummy, 8);

    if Temp gt 10 or Temp lt 96 then Temp = .;

    drop Dummy;

    datalines;

    101 97.3 111 n 104.5 85

    ;

    ```


    First, you read each value as a character. Next, test if the value is an uppercase
    or lowercase ''n''. If so, you set the value of Temp to 98.6. If not, use the
    INPUT function to perform the character-to-numeric conversion.


    Here is a listing of data set Temperatures:


    | Temp |

    |---||

    | 101.0 |

    | 98.6 |

    | 97.3 |

    | - |

    | 98.6 |

    | 98.6 |

    | 104.5 |

    | - |


    You can accomplish the same goal by creating your own informat, as follows:


    # Program 10.2: Reading a combination of character and numeric data (using a user-defined
    informat)


    ```

    *Using an enhanced informat to read a combination of character and numeric data;

    proc format;

    invalue readtemp (upcase)

    96 - 106 = _same

    ''*N*'' = 98.6

    other = .;

    run;

    ```


    Cody, Ron. Cody''s Collection of Popular SAS® Programming Tasks and How to Tackle
    Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS
    RESERVED. For additional SAS resources, visit support.sas.com/bookstore.'
  - '[PAGE 120]


    # Chapter 10: Reading Data with User-Defined INFORMATS 99


    ```

    data Temperatures;

    input Temp : readtemp5. @@;

    datalines;

    101 N 97.3 111 n 67 104.5 85

    ;

    ```


    You use a value to make a format—use an INVALUE statement to make an informat.
    Because the n''s may be in lowercase, you use the UPCASE option (placed in parentheses
    following the informat name) to convert all letters to uppercase. Values between
    96 and 106 are left alone (the keyword _SAME does this). A value of 98.6 (a numeric
    value) is used when the letter ''N'' is read. All other values result in a missing
    value. An informat that reads both character and numeric data is referred to as
    an informat. Data set Temperatures is identical to the one listed previously.


    This is an efficient and elegant method for reading combinations of character
    and numeric data.


    The next example reads a combination of numeric or letter grades and converts
    the letter grades to numeric values. Here is the program:


    # Program 10.3: Reading letter grades and converting them to numeric values using
    an informat


    ```

    proc format;

    value readgrade(upcase just)

    ''A'' = 95

    ''B'' = 85

    ''C'' = 75

    ''F'' = 65

    other = _same;

    run;


    data School;

    input ID = $3. Grade = readgrade;

    datalines;

    001 97

    002 99

    003 A

    004 C

    005 72

    006 f

    007 b

    ;

    ```


    Two options, UPCASE and JUST, are used here. UPCASE, as described in the previous
    program, converts all letters to uppercase. The JUST option left justifies all
    text.


    Cody, Ron. Cody''s Collection of Popular SAS® Programming Tasks and How to Tackle
    Them. Copyright © 2012, SAS Institute, Inc., Cary, North Carolina, USA. ALL RIGHTS
    RESERVED. For additional SAS resources, visit support.sas.com/bookstore.'
