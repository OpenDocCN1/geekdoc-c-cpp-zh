- md: "\n## Chapter 6: Table Lookup Techniques 71\n\n### Program 6.5: Using a temporary\
    \ array to perform a table lookup\n\n```sas\n*Load a temporary array with the\
    \ Goals data;\ndata Sales_Goals;\narray Goalsarray[2004:2012] _temporary;\nif\
    \ _n = 1 then do Year = 2004 to 2012;\nset Goals;\ngoalsarray[Year] = Goal;\n\
    end;\n\nset Sales;\nDifference = Sales - Goalsarray[Year];\nrun;\n```\n\nThe goals\
    \ for the 2004 to 2012 are stored in the Goals data set. You create a temporary\
    \ array called Goalsarray and set the array bounds as 2004 to 2012. Following\
    \ this, you enter the keyword _TEMPORARY\n\nOn the first iteration of the DATA\
    \ step (when the automatic _N_ variable is equal to 1), you read in the nine sales\
    \ goals into the nine array elements. The goals for any year is simply the array\
    \ element with the subscript being the desired year.\n\n### Task: Performing a\
    \ two-way table lookup using a temporary array\n\n### Keywords\n\n- Table lookup\n\
    - Two-way table lookup\n- Temporary array\n\nThis example is similar to the previous\
    \ one now that you have separate sales goals for each four job categories. This\
    \ information is stored in a SAS data set Goals_Job and the first 10 observations\
    \ are listed here:\n\nCody, Ron. Cody's Collection of Popular SAS® Programming\
    \ Tasks and How to Tackle Them. Copyright © 2012, SAS Institute, Inc. Cary, North\
    \ Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \n### Listing of the first 10 observations from data set Goals_Job\n\n| Year |\
    \ Category | Goal |\n|---|---|---|\n| 2004 | 1 | 20 |\n| 2004 | 2 | 21 |\n| 2004\
    \ | 3 | 24 |\n| 2004 | 4 | 28 |\n| 2005 | 1 | 34 |\n| 2005 | 2 | 40 |\n| 2005\
    \ | 3 | 49 |\n| 2005 | 4 | 60 |\n| 2006 | 1 | 75 |\n| 2006 | 2 | 21 |\n\nOnce\
    \ you load a two-dimensional array with these values, you can obtain the sales\
    \ goal for any year and job category by accessing the array element as the first\
    \ dimension and the job category as the second dimension. Here is the code:\n\n\
    ### Program 6.6: Demonstrating a two-way array to perform a table lookup\n\n```sas\n\
    *Tweway table lookup using temporary arrays;\ndata Two_Way;\narray Goals_Job[2004:2012,4]\
    \ _temporary_;\nif _n = 1 then do Year = 2004 to 2012;\ndo Job = 1 to 4;\nset\
    \ Goals_Job;\nGoals_Job[Year,Job] = Goal;\nend;\n\nset Sales_Job;\ndrop Goals_Job;\n\
    Difference = Sales - Goals_Job[Year,Job];\nrun;\n```\n\nAs in the previous program,\
    \ you use a colon to define the bounds of the first dimension of the array (representing\
    \ the year), and a comma to specify that there are four values for the second\
    \ dimension (representing each of the four job codes). On the first iteration\
    \ of the DATA step, you load values into the temporary array from the Goals data\
    \ set. Then, given any value for Year and Job, the array element returns the Goal\
    \ value. The resulting data set Two_Way is listed next:\n\n| Year | Sales_ID |\
    \ Sales | Difference |\n|---|---|---|---|\n| 2004 | 1234 | 20.5 | 0.5 |\n| 2005\
    \ | 1234 | 22.0 | -12.0 |\n| 2006 | 1234 | 26.0 | -49.0 |\n| 2007 | 1234 | 27.0\
    \ | -3.0 |\n| 2008 | 1234 | 37.0 | -30.0 |\n| 2009 | 1234 | 45.0 | 16.0 |\n| 2010\
    \ | 1234 | 55.0 | -7.0 |\n| 2011 | 1234 | 61.0 | 23.0 |\n| 2012 | 1234 | 72.0\
    \ | 12.0 |\n| 2004 | 7477 | 18.0 | -3.0 |\n\nUsing multi-dimensional temporary\
    \ arrays is an easy and elegant way to perform table lookup.\n\n## Conclusion\n\
    \nFormats, and temporary arrays are efficient ways to perform table lookup. Formats\
    \ and informats seem to be one of the more popular methods used by SAS programmers.\
    \ However, try using temporary arrays the next time you have a table lookup problem\
    \ and you may become a fan of this technique.\n\nCody, Ron. Cody's Collection\
    \ of Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012,\
    \ SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore.\n\n## Chapter 7: Restructuring\
    \ (Transposing)\nSAS Data Sets\n\nIntroduction ...................................................................................................................................................75\n\
    \n- Task: Converting a data set with one observation per subject into one with\
    \ multiple observations per subject (using a DATA step).......................76\n\
    \n- Task: Converting a data set with one observation per subject into one with\
    \ multiple observations per subject (using PROC TRANSPOSE)................................77\n\
    \n- Task: Converting a data set with multiple observations per subject into one\
    \ with one observation per subject (using a DATA step)..........................................79\n\
    \n- Task: Converting a data set with multiple observations per subject into one\
    \ with one observation per subject (using PROC TRANSPOSE) ..........80\n\nConclusion\
    \ ................................................................................................................................................81\n\
    \n## Introduction\n\nAt some point in your programming career you will need to\
    \ restructure data sets. For example, you might have a data set that looks like\
    \ this:\n\nListing of data set OnePer\n\n| Subj | Dx1 | Dx2 | Dx3 |\n|---|---|---|---|\n\
    | 001 | 450 | 430 | 410 |\n| 002 | 250 | 240 | .\n- 003 | 410 | 250 | 500 |\n\
    | 004 | 240 | . | . |\n\nAnd you want to create a data set that looks like this:\n\
    \nListing of data set ManyPer\n\n| Subj | Visit | Diagnosis |\n|---|---|---|\n\
    | 001 | 1 | 450 |\n| 001 | 2 | 430 |\n| 001 | 3 | 410 |\n| 002 | 1 | 250 |\n|\
    \ 002 | 2 | 240 |\n| 003 | 1 | 410 |\n| 003 | 2 | 250 |\n| 003 | 3 | 500 |\n|\
    \ 004 | 1 | 240 |\n\nYou might also want to reverse the process and go from a\
    \ data set with multiple observations per subject to one observation per subject.\
    \ In this chapter, you will see how to use a DATA step or PROC TRANSPOSE to accomplish\
    \ this.\n\n### Task: Converting a data set with one observation per subject into\
    \ one with multiple observations per subject (using a DATA step)\n\n### Keywords\n\
    \n- Transpose\n- Restructure\n- Multiple observations per subject\n\nThis first\
    \ task is to start with a data set that has one observation per subject and create\
    \ one with multiple observations. Data step approach:\n\n```sas\ndata ManyPer;\n\
    set OnePer;\narray Dx[3];\ndo Visit = 1 to 3;\nif not missing(Dx[Visit]) then\
    \ do\nDiagnosis = Dx[Visit];\noutput;\nend;\nrun;\n```\n\n### Task: Converting\
    \ a data set with one observation per subject into one with multiple observations\
    \ per subject (using PROC TRANSPOSE)\n\n### Keywords\n\n- Transpose\n- Restructure\n\
    - Multiple observations per subject\n\nYou can accomplish the same result as in\
    \ the previous task by PROC TRANSPOSE. However, you will need to tweak it to make\
    \ the new data set identical to the DATA step.\n\n```sas\n*PROC TRANSPOSE solution;\n\
    *First try;\n  proc transpose data=oneper\n      out=manyper;\n\n    by Subj;\n\
    \    var Dx1-Dx3;\n  run;\n```\n\nThe resulting data set looks like this:\n\n\
    | Subj | _NAME_ | COL1 |\n|---|---|---|\n| 001 | Dx1 | 450 |\n| 001 | Dx2 | 430\
    \ |\n| 001 | Dx3 | 410 |\n| 002 | Dx1 | 250 |\n| 002 | Dx2 | 240 |\n| 003 | Dx1\
    \ | 410 |\n| 003 | Dx2 | 250 |\n| 003 | Dx3 | 500 |\n| 004 | Dx1 | 240 |\n"
