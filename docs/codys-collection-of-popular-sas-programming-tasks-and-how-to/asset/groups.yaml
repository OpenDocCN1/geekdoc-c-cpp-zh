    # Task: Extracting the first and last name (and possibly a middle name)

    from a variable containing the first and last name (and possibly a middle name)
    in a single variable


    # Keywords


    - Extract last name

    - Parsing a string

    - SCAN function


    The last task in this chapter solves a common problem: You have a single variable
    that contains the first and last name and, possibly, a middle name (or initial).


    The way to solve this is to use the SCAN function to extract each of the names
    and assign each to a separate variable. This function takes a character string
    as the first argument and the number of the word you want as the second argument.
    An optional third argument lets you specify a list of delimiters. Since the first,
    middle and last names are separated by spaces in this example, you specify spaces
    as delimiters.


    Here is a listing of data set Full_Name:


    | Name |

    | :--- |

    | Jane Ireland |

    | Ronald P. Cody |

    | Robert Louis Stevenson |

    | Daniel Friedman |

    | Louis H. Horvath |

    | Mary Williams |


    Notice that some names contain only a first and last name—some names contain a
    middle name or initial.


    You can extract the first name by requesting the first word in the Name variable.
    The last name will either be the third word (if there is a middle name or initial)
    or the second word if there is not. If you enter a negative number for the second
    argument of the SCAN function, the function searches for words from right to left.
    Therefore, to obtain the last name, use a minus for the second argument. Here
    is the program:


    # Chapter 12: Miscellaneous Tasks


    Program 12.16: Extracting the first and last name (possibly a middle name or initial)
    from a variable containing the first and last name (possibly a middle name or
    initial) in a single variable


    ```

    *Extracting the first and last name (possibly a middle initial) from a variable
    containing first (possibly middle) and last name in a single variable;

    Data Separator;

    set Full Name;

    First = Scan(Name,1, '' '');

    Last = Scan(Name,-1, '' '');

    Middle = scan(Name,2, '' '');

    if missing(Scan(Name,3)) then Middle = '' '';

    run;

    ```


    You obtain the first name by extracting the first word in the string and the last
    name by entering one as the second argument to the SCAN function. If there is
    a middle name, it will be the second word. However, if there is no middle name,
    there is no third word. The SCAN function returns a missing value in case. So,
    if you obtain a missing value for the third word, you know there is no middle
    name and you set the variable Middle to a missing value.


    A list of data separates follows:


    | Name | First | Last | Middle |

    | :--- | :--- | :--- | :--- |

    | Jane Ireland | Jane | Ireland | |

    | Ronald P. Cody | Ronald | Cody | P. |

    | Robert Louis Stevenson | Robert | Stevenson | Louis |

    | Daniel Friedman | Daniel | Friedman | |

    | Louis H. Horvath | Louis | Horvath | H. |

    | Mary Williams | Mary | Williams | |


    Now you have a solution to a very common programming task.


    # Conclusion


    Although this chapter contains an eclectic collection of tasks, they are, nevertheless,
    tasks that are fairly common. Many of the tasks were helped in several ways—some
    straightforward, some elegant.


