    \ Program 11.4: Fixing the problem with the NODUPRECS option\n\n```\n* solution\
    \ to the problem;\nproc sort data=Multiple out=Features noduprecs;\n  all;\nrun;\n\
    ```\n\nYou will get the desire result as follows:\n\n| Subj | X | Y |\n|---|---||\n\
    | 001 | 1 | 2 |\n| 001 | 3 | 2 |\n| 002 | 5 | 7 |\n| 003 | 7 | 8 |\n| 005 | 4\
    \ | 5 |"
  - "[PAGE 127]\n\n106 Cody's Collection of Popular SAS Programming Tasks and How\
    \ to Tackle Them\n\nIn practice, when you have a large data set with a large number\
    \ of variables, you may not want to sort by _ALL_, if you simply list several\
    \ BY variables, especially ones that have lots of different values, you can be\
    \ confident that any duplicate observations are successive.\n\n# Task: Extracting\
    \ the first and last observation in a BY group\n\n# Keywords\n\n+   First. variables\n\
    \n+   Last. variables\n\nSAS programs are observation oriented. That is, you process\
    \ one observation at a time. When you are done, a new observation enters the PDV\
    \ (program data vector) and the previous observation is gone (unless some' values\
    \ were retained, either by default or due to a RETAIN statement). To perform operations\
    \ involving multiple observations per subject, SAS provides you with useful tools.\
    \ The two logical variables First.by-variable-name and Last.by-variable-name are\
    \ created when you follow a SET statement with a BY statement.\n\nThese are temporary\
    \ variables that exist only while the DATA step is processing, and they allow\
    \ you to determine when you are reading the first observation in a BY group or\
    \ the last observation in a BY group. The next program demonstrates how this works.\n\
    \n# Program 11:5 Demonstrating First. and Last variables\n\n```\nproc sort data=Duplicates\
    \ out=Sorted_Duplicates;\n  by Subj;\nrun;\ndata _null;\n  set Sorted_Duplicates;\n\
    \  by Subj;\n  put Subj=First.Subj Last.Subj;\nrun;\n```\n\nYou sort your data\
    \ set by one or more BY variables. In this example, you sort the Duplicates data\
    \ set by Subj. In the data _NULL DATA step, you follow the SET statement with\
    \ a BY statement. This creates the two logical variables First.Subj and Last.Subj.\
    \ As you might expect, First.Subj is true when you are reading the first observation\
    \ for a subject, and Last.Subj is true when you are reading the last observation\
    \ for a subject. A value of 1 indicates true; a value of 0 indicates false.\n\n\
    Cody, Ron. Cody's Collection of SAS® Programming Tasks and How to Tackle Them.\
    \ Copyright © 2012, SAS Institute Inc.\nary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ For additional SAS resources, visit support.sas.com/bookstore."
