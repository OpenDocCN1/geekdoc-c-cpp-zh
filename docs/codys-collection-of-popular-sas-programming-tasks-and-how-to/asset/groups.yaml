    do i = 1 to dim(Chars);\nChars[i] = upcase(Chars[i]);\nend;\ndrop i;\nrun;\n```\n\
    \n如果字符变量处理的是姓名和地址，在将所有值转换为一致的大小后，你可能希望使用 `COMPBL` 函数将多个空格转换为单个空格，以帮助标准化姓名和地址。\n\
    \n## 任务：读取包含 Lbs. 或 Kgs. 单位的数值值\n\n### 关键字\n\n- 字符转数值转换\n- 从值中删除单位\n- 从字符串中提取数字\n\
    - COMPRESS 函数\n- SCAN 函数\n\n数据集 Units 包含一个名为 `Height` 的字符变量，包括 Lbs. 和 Kgs.（磅和公斤）等单位。此外，`Height`\
    \ 变量也包含单位并以英尺和英寸表示（有时英寸值缺失，值为0）。这里是 Units 数据集的列表：\n\n| Subj | Weight | Height\
