    # Chapter 3: Summarizing Data 35


    This example uses a CLASS statement to compute the mean Heart_Rate for each value
    of Gender. You need to use the NWAY option since you do not want the mean for
    both genders combined. An alternative would be to use PROC SORT (by Gender) and
    a BY statement instead of a CLASS statement.


    Here is a list of the By_Gender data set:


    | Gender | Mean_HR |

    | :--- | :--- |

    | F | 71.3846 |

    | M | 67.4000 |


    All you need to do now is to merge the By_Gender data set with the Blood_Pressure
    data set, using Gender as your BY variable. Of course, you need to sort the Blood_Pressure
    data set first. (Note: You do not have to sort the By_Gender data set because
    PROC MEANS sorts it in the order of the CLASS variables.) Here is the code:


    # Program 3.16: Combining summary data with detail data for each category of a
    BY variable


    ```

    proc sort data=Blood_Pressure;

    by Gender;

    run;

    data Percent_of_Mean;

    merge Blood_Pressure (keep=Heart_Rate Gender Subj);

    by Gender;

    Percent = round(100*(Heart_Rate / Mean_HR));

    run;

    * Put the observations back in Subj order;

    proc sort data=Percent_of_Mean;

    by Subj;

    run;

    ```


