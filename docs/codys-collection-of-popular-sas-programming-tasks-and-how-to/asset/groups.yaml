    # Acknowledgments


    It seems that with each book I write, more and more people are needed to move
    the book from concept to final product. In the "old days," SAS Press only needed
    to produce a book—on paper. Today, books are made available on a wide variety
    of devices such as Kindles, iPads, etc., making for a lot of extra work.


    After all the chapters are complete, a team of reviewers, some from SAS Institute,
    some from outside of SAS, read all or part of the book for technical errors. This
    group of technical reviewers did a splendid job of spotting errors (who, me?)
    and sometimes suggesting some clever and elegant solutions for some of my tasks.
