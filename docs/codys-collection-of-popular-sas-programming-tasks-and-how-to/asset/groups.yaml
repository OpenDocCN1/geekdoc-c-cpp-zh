    # Task: Converting a specific value such as 999 to a missing value for all numeric
    variables in a SAS data set


    Keywords

    Numeric variables

    _numeric_

    Array


    You will find many occasions where you need to perform an operation on all numeric
    (or character) variables in a SAS data set. For example, you may have a SAS data
    set where specific values, such as 999 or 9999, were used to represent a missing
    value. In the character domain, you may want to convert all character values to
    uppercase or convert a specific value such as ''NA'' to a SAS missing value. The
    approach to all of these tasks is the same. You create an array of all numeric
    or character variables. Once you do this, you can use a DO loop to perform any
    operation you desire on all of the variables in the array.


    This first example converts a value of 999 to a SAS missing value for all the
    numeric variables in data set Demographic.


    A listing of data set Demographic is shown here:


    | Subj | Score | Weight | Heart_Rate | DOB Gender | Party |

    |---|---|---|---|---|-|

    | 1 | 70 | 999 | 76 | 04NOV1955 Male | NA |

    | 2 | 26 | 160 | 62 | 08APR1955 NA | NA |

    | 3 | 71 | 195 | 71 | 20JUL1955 Male | na |

    | 4 | 40 | 132 | 74 | 08JAN1955 Male | Republican |

    | 5 | 999 | 181 | 62 | 15AUG1951 Female | Democrat |

    | 6 | 62 | 71 | 52 | 24JAN1950 Male | democrat |

    | 7 | 24 | 136 | 72 | 26NOV1950 Female | democrat |

    | 8 | 5 | 174 | 71 | 08NOV1950 Female | democrat |

    | 9 | 5 | 172 | 47 | 28DEC1951 Male | Democrat |

    | 10 | 94 | 173 | 999 | 06MAY1953 Male | republican |

    | 11 | 99 | 170 | 63 | 27FEB1950 na | NA |

    | 12 | 10 | 133 | 63 | 18MAR1954 Male | democrat |

    | 13 | 6 | 131 | 60 | 26MAR1954 Female | republican |'
- md: "\n# Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \n| Subj | Score | Weight | Heart_Rate | DOB | Gender | Party |\n|---|---|---|---|---|---|---|\n\
    | 14 | 999 | 140 | 79 | 01OCT1950 | NA | na |\n| 15 | 999 | 124 | 999 | 12OCT1950\
    \ | NA | na |\n| 16 | 44 | 194 | 72 | 31DEC1952 | Female | republican |\n| 17\
    \ | 62 | 196 | 68 | 09MAR1951 | Female | democrat |\n| 18 | 57 | 133 | 72 | 15SEP1951\
    \ | Female | Democrat |\n| 19 | 45 | 137 | 86 | 16NOV1951 | NA | Republican |\n\
    | 20 | 90 | 170 | 80 | 01OCT1951 | Female | Republican |\n\nYou will use this\
    \ data set for several of the tasks in this chapter. For example, notice that\
    \ there are values of 999 for the variables Score, Weight, and Heart_Rate.\n\n\
    Here is the code to perform the conversion:\n\n## Program 1.4: Converting a specific\
    \ value such as 999 to a missing value for all numeric variables in a SAS data\
    \ set\n\n> *Converting a specific value such as 999 to a missing value for all\
    \ numeric variables in a SAS data set;\n\n```\ndata Num_missing;\n  set Demographic;\n\
    \  Array Num [_numeric];\n  do i = 1 to dim(Nums);\n    if Num[i] = 999 then Num[i]\
    \ = .;\n  end;\n  drop i;\nrun;\n```\n\nThe key to this, as well as programs to\
    \ follow, is to create an array using the keyword _NUMERIC_. When used in a DATA\
    \ step, _NUMERIC represents all the numeric variables that have been defined up\
    \ to that point in the DATA step. The ARRAY statement sets the name, contains\
    \ all of the variables in data Demographic (Subj, Score, Heart_Rate, and DOB).\
    \ To make this important point clear, if you placed the ARRAY statement before\
    \ the SET statement, the array would not contain any variables.\n\nYou certainly\
    \ do not want to count all the numeric variables in a large data set. Therefore,\
    \ you use an asterisk in the brackets for the array name. When you do this, SAS\
    \ will count the number of variables for you. But, what value do you use in the\
    \ DO loop? You can use the DIM (dimension) function to determine how many variables\
    \ are in the array. Your work is almost finished. All you need to do is to check\
    \ for values of 999 and convert them to a SAS numeric value. Don't forget to drop\
    \ the loop counter.\n\n![](img/3ac868221c19b51b8305260d45f92ed5_27_0.png)\n\n\
    The first five observations in data set Num_missing are shown next, to demonstrate\
    \ that the program worked as expected:\n\n| Subj | Score | Heart_Rate | DOB |\
    \ Gender | Party |\n|---|---|---|---|---|---|\n| 1 | 70 | | 76 | 04NOV1955 | Male\
    \ | NA |\n| 2 | 26 | 160 | 62 | 08APR1955 | NA | NA |\n| 3 | 71 | 195 | 71 | 20JUL1955\
    \ | male | na |\n| 4 | 40 | 132 | 74 | 08JAN1955 | Male | Republican |\n| 5 |\
    \ | 181 | 62 | 15AUG1955 | Female | Democrat |\n\n## Task: Converting a specific\
    \ value such as 'NA' to a missing value for all character variables in a SAS data\
    \ set\n\n### Keywords\n\nCharacter variables character_Array\n\nThis task is similar\
    \ to the previous task. The difference is that you want to convert a specified\
    \ character value to a SAS character missing value. All you need to do is use\
    \ the keyword _CHARACTER to create an array of all character variables. Here is\
    \ the program:\n\n### Program 1.5: Converting a specific value such as 'NA' to\
    \ a missing value for all character variables in a SAS data set\n\n```\ndata Char_missing;\n\
    *Converting a specific value such as \"NA\" to a missing value for all\ncharacter\
    \ variables in SAS data set;\nset Demographic;\narray Chars[*] character;\ndo\
    \ i = 1 to dim(Chars);\nif Char[i] = 'NA' then Char[i] = ' ';\nend;\ndrop i;\n\
    run;\n```\n\nArray contains all the character variables in data Demographic (Gender\
    \ and Party). As in the previous task, the DIM function returns the number of\
    \ variables in the array. To make the program more general, it looks for uppercase\
    \ or lowercase values of 'NA'. Here is a listing of the first five observations\
    \ in data set Char_missing:\n\n| Subj | Score | Weight | Heart_Rate | DOB | Gender\
    \ | Party |\n|---|---|---|---|---|---|---|\n| 1 | 70 | 999 | 76 | 04NOV1955 |\
    \ Male | |\n| 2 | 26 | 160 | 62 | 08APR1955 | | | |\n| 3 | 71 | 195 | 71 | 20JUL1955\
    \ | male | na |\n| 4 | 40 | 132 | 74 | 08JAN1955 | Male | Republican |\n| 5 |\
    \ | 181 | 62 | 15AUG1955 | Female | Democrat |\n\n## Task: Changing all character\
    \ values to either uppercase, lowercase, or proper case\n\n### Keywords\n\n- Uppercase\n\
    - Lowercase\n- Proper case\n- character\n\nIn similar manner to the previous program,\
    \ you can use an array of all character variables to convert them all to uppercase,\
    \ lowercase, or proper case. As you see, this program is converting all the character\
    \ values in the data set to uppercase. The two other functions that convert character\
    \ values to lowercase or proper case are LOWERCASE and PROCASE, respectively.\
    \ Here is the program:\n\n### Program 1.6: Changing all character variables in\
    \ a SAS data set\n\n```\ndata Char_upper;\n*Converting all character values to\
    \ uppercase (or lower or proper case);\nset Demographic;\narray Chars[*] character;\n\
    do i = 1 to dim(Chars);\nChars[i] = upcase(Chars[i]);\nend;\ndrop i;\nrun;\n```\n\
    \nIf the character variables are dealing with names and addresses, after you have\
    \ converted all the values to a consistent case, you may want to take the additional\
    \ step and use the COMPBL function to convert multiple blanks to a single blank,\
    \ to help standardize the names and addresses.\n\n## Task: Reading a numeric value\
    \ that contains units as Lbs. or Kgs. in the value\n\n### Keywords\n\n- Character-to-numeric\
    \ conversion\n- Removing units from a value\n- Extracting digits from a string\n\
    - COMPRESS function\n- SCAN function\n\nData sets Units contain a character variable\
    \ called Height that includes units such as Lbs. and Kgs (pounds and kilograms).\
    \ In addition, the variable Height also contains units and is expressed in feet\
    \ and inches (sometimes the inches value is missing (when the inches value is\
    \ zero)). Listing of data set Units is shown here:\n\n| Subj | Weight | Height\
    \ |\n|---|---|---|\n| 001 | 80kgs | 5ft 3in |\n| 002 | 190lbs | 6ft 1in |\n| 003\
    \ | 70KG. | 5ft 11in |\n| 004 | 177Lbs. | 5ft 11in |\n| 005 | 100kgs | 6ft |\n\
    \nNotice that the Weight units are not always in the same case and some of the\
    \ units end in periods. For Height, the abbreviation 'ft' or 'in' is used; sometimes\
    \ a single quote and double quote represent feet and inches.\n\nYou would like\
    \ to create two new variables (Weight_Lbs and Height_Inches) that are numeric\
    \ variables and are equal to the weight in pounds and the height in inches, respectively.\
    \ Here is the program:\n\n### Program 1.7: Reading data values that contain units\n\
    \n```\n*Reading data values that contain units;\n  data No_Units;\n  set Units;\n\
    \  Weight_Lbs = input(compress(Weight,'kd'),12);\n  if find(Weight,'k',i) then\
    \ Weight_lbs = Weight*2.2;\n  Height = compress(Height,'ks');\n  Feet = input(scan(Height,1,'\
    \ '),12);\n  Inches = input(scan(Height,2,' '),12);\nif missing(Inches) then Inches\
    \ = 0;\n  Height_Inches = 12*Feet + Inches;\n  drop Feet;\nrun;\n```\n\nYou start\
    \ extracting the digits from Weight using the COMPRESS function with the modifiers\
    \ 'kd' (keep digits). It is important to include two commas before the first argument\
    \ of the COMPRESS function so that the function interprets 'kd' as modifier and\
    \ not the second argument of the COMPRESS function that is used to list the characters\
    \ you want to compress from a string. Since the result of the COMPRESS function\
    \ is a character value, you use the INPUT function to perform the character-to-numeric\
    \ conversion. All you need to do is test the original variable (Weight) to see\
    \ if it contains 'K' in uppercase or lowercase. Use the FIND function with the\
    \ 'i' modifier (ignore case) to do this. If you find a 'K', you multiply by 2.2\
    \ to convert kilograms to pounds.\n\nThe Weight variable presents more of a challenge.\
    \ You first use the COMPRESS function with three modifiers, 'kd' (keep digits\
    \ and space characters). The variable now contains two sets of digits (or only\
    \ a single digit if there are an) and can use the SCAN function to extract the\
    \ feet and inch values. The SCAN function returns a missing value for Inches if\
    \ Height only contains a single number (feet). You can add 12 times the feet plus\
    \ the number of inches to obtain the height in inches.\n\n## Solving part of the\
    \ previous task using a Perl regular expression\n\nSolving this task without the\
    \ COMPRESS and SCAN functions would certainly be a challenge—with these functions,\
    \ it's a snap.\n"
