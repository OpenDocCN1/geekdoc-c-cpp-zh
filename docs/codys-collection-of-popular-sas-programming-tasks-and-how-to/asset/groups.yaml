    # Task: Looking for possible data errors using a given range


    # Keywords


    Outliers


    Range checking


    If you can determine a reasonable range for some of your numeric variables, you
    can write a program like the following one to identify possible data errors:


    Program 9.1: Looking for possible data errors using a given range


    ```

    *Method using known ranges;

    title "Listing of Patient Numbers and Invalid Data Values";ndata null_;

    set Blood_Pressure;

    file print;

    ***Check Heart_Rate;

    if (Heart_Rate lt 40 and not missing(Heart_Rate)) or Heart_Rate gt 100 then Subj=10
    Heart_Rate=;

    ***Check SBP;

    if (SBP lt 80 and not missing(SBP)) or SBP gt 200 then Subj=10 SBP=;

    ***Check DBP;

    if (DBP lt 60 and not missing(DBP)) or DBP gt 120 then Subj=10 DBP=;

    ```


    This program reads data from the Blood_Pressure data set and prints out for any
    subject whose heart rate, systolic pressure, or diastolic pressure is outside
    predetermined ranges. Output from this program:


    +   Listing of Patient Numbers and Invalid Data Values

    Subj=16 Heart_Rate=36

    Subj=17 Heart_Rate=16

    Subj=39 DBP=130

    Subj=42 Heart_Rate=37

    Subj=45 Heart_Date=38

    Subj=47 Heart_Rate=38

    Subj=49 Heart_Rate=38


    This solution is fine if you only have a few variables to test, but it can become
    tedious when you have a large number of variables.'
  - '[PAGE 110]


    # Task: Demonstrating a macro to report on outliers using fixed ranges


    # Keywords


    +   Outliers


    +   Range checking


    +   Errors macro


    The macro, named Errors, presents here, also allows you to specify lower and upper
    bounds for each numeric variable you want to test. In addition, you can determine
    if missing values should be flagged as errors. You run the macro once for each
    variable and, when finished, call another macro called Report (shown later) to
    print out a final report.


    You can see an explanation of the macro following:


    # Program 9.2: Presenting a macro for range checking of numeric variables


    ```

    /*Macro to perform range checking for numeric variables;*

    %macro Errors(Var, /* Variable to test */

    Low=, /* Low value */

    High=, /* High value */

    Missing=IGNORE /* How to treat missing values */

    /* Ignore is the default. To flag

    /* missing values as errors set */

    /* Missing=error */);


    data Temp;

    set Dsn(Var=&IdVar);

    length Keep $10 $Var $32;

    Variable = "&Var";

    Value = &Var;

    if &Var=lt and not missing(&Var) then do;

    Reason=''Low'';

    output;

    end;

    if uppercase(&Missing) ne IGNORE then do;

    else if missing(&Var) then do;

    Reason=''Missing'';

    output;

    end;

    else if &Var gt &High then do;

    Reason=''High'';

    output;

    end;

    drop &Var;

    run;

    ```'
  - '[PAGE 111]


    # 90 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    ```

    proc append base=Errors data=Tmp;

    run;

    %mend errors;

    ```


    To use the Errors macro, you first need to use a %LET to assign values to the
    two macro variables Dsn (the data set name) and Idvar (the name of the ID variable).
    Because you will be calling the macro several times, using %LET statements to
    assign these values saves you the trouble of reentering them each time you call
    the Errors macro.


    You call the Errors macro for Var (the variable you want to test), Low (the lower
    bound), High (the higher bound), and Missing (with the value of IGNORE) to ignore
    missing values, or with a value of ERROR (actually, any value not equal to IGNORE)
    to treat missing values as errors.


    Each time you run the macro, containing errors are written out to set Tmp. Variables
    in this data set are Reason (High, Low, or Missing), Variable (the name of the
    variable being tested), and Value (the value of the variable being tested). You
    use PROC APPEND to add each of these observations to the data set Errors.


    When you run the Errors macro for all of the variables of interest, call the Report
    macro (listed in the following program) to generate a consolidated error report.


    # Program 9.3: Presenting the Report macro that generates a report after the Errors
    macro has run


    ```

    *Macro to generate an error report after the errors macro has been run;

    %macro report;

    proc sort data-errors;

    by &Idvar;

    run;

    proc print data-errors;

    title "Error Report for Data Set &Dsn";

    id &Idvar;

    var Variable Value Reason;

    run;

    proc datasets library=work nolist;

    delete errors;

    delete tmp;

    run;

    quit;

    %mend report;

    ```


    This macro consists of a PROC SORT and a PROC PRINT. You run PROC DATASSETS to
    delete the two temporary data sets (Tmp and Errors).


