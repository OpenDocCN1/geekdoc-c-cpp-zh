    \ 131\n\n## 引言\n\n由于“杂任务”一词出现在本章标题中，不要被误认为这些任务没有用处——它们只是不符合任何方便的分类而已。\n\n## 任务：确定\
    \ SAS 数据集中的观测数（使用 NOBS= SET 选项）\n\n### 关键词\n\n- 观测数\n- NOBS\n\n有几种方法可以确定 SAS 数据集的观测数。最常用的方法之一是在\
    \ SET 语句中使用 `NOBS=variable_name` 选项。在编译时，`variable_name` 等于 SET 语句中指定的数据集的观测数。\n\
    \n在这个示例中，你想要确定 Stocks 数据集中的观测数。\n\n### 程序 12.1：使用 NOBS= SET 选项确定 SAS 数据集中的观测数\n\
    \n```sas\n*Determining the number of observations in a SAS data set;\n*Using the\
    \ SET option NOBS;\ndata New;\n  set Stocks nobs=Number_of_obs;\n  if _n =1 then\n\
    \    put \"The number of observations in data set STOCKS: \" \n      Number of\
    \ obs;\n    How_Var = _n / Number_of_obs;\nrun;\n```\n\n你在 SET 语句上使用 `NOBS=` 选项来获取\
    \ Stocks 数据集的观测数（并将此值赋值给 `Number_Obs`）。在这个示例中，你想计算 Stocks 数据集中总观测数的倒数。你还使用 `PUT`\
    \ 语句将此数字输出到 SAS Log中。这里显示了 New 数据集中前八个观测值的列表：\n\n| Date | Price | How_Far |\n\
    |---|---|---|\n| 02JAN2012 | 24 | 0.02381 |\n| 03JAN2012 | 24 | 0.04762 |\n| 04JAN2012\
    \ | 33 | 0.07143 |\n| 05JAN2012 | 25 | 0.09524 |\n| 06JAN2012 | 25 | 0.11905 |\n\
    | 09JAN2012 | 24 | 0.14286 |\n| 10JAN2012 | 33 | 0.16667 |\n| 11JAN2012 | 34 |\
    \ 0.19048 |\n\nSAS Log 的一个部分显示 Stocks 数据集中有 42 个观测值：\n\nThe number of observations\
    \ in data set STOCKS is: 42\n\n## 任务：确定 SAS 数据集中的观测数并将值赋值给宏变量\n\n### 关键词\n\n-\
    \ 观测数\n- NOBS\n\n你可能想设置一个宏变量等于 SAS 数据集中的观测数。看看下面非常有趣的程序：\n\n### 程序 12.2：将 SAS\
    \ 数据集中的观测数放入宏变量\n\n```sas\n*Putting the number of observations in a SAS data set\
    \ into\nmacro variable;\ndata _null;\n  if 0 then Stocks nobs=Number_of_obs;\n\
    \    call putx('N of obs',Number_of_obs);\n  put \"The number of observations\
    \ in STOCK is &N_of_obs\";\n  stop;\nrun;\n```\n\n是的，IF 语句看起来确实是假的，SET 语句从不执行。`NOBS=`\
    \ 选项在编译时起了作用。`CALL SYMPUTS` 将 `Number_of_obs` 的值赋值给宏变量 `N_of_obs`。\n\n## 任务：确定\
    \ SAS 数据集中的观测数（使用库表）\n\n### 关键词\n\n- 观测数\n- 库表\n\nSAS 表包含与你的数据集相关的元数据，你可以通过指定\
    \ `LIBNAME` 和数据集名称从 `SAS8.VTABLE` 中获取这些信息。这种确定观测数的方法比到目前为止描述的其他方法具有优势。即，如果你（或其他人）正在修改数据集，你需要知道总观测数，以及被标记为删除的观测数（但在使用\
    \ `NOBS=` 选项时它们仍会被计入内）。\n\n### 程序 12.4：使用库表确定数据集的观测数\n\n```sas\ndata _null;\n\
    set sashelp.vtable;\nwhere libname=\"WORK\" and memname=\"STOCKS\";\nNote:you必须对\
    \ libname 和 memname 使用大写值;\n**Num_nobs= 总观测数，包括已删除的\nDelobs 是已删除的观测数；\nput Delobs:\
    \ = num_obs;\nrun;\n```\n\n## 任务：确定 SAS 数据集中的观测数（使用 SAS 函数）\n\n### 关键词\n\n- 观测数\n\
    - Exist 函数\n- Attrn 函数\n\n还有什么方法可以确定 SAS 数据集的观测数？文件 I/O 类别中的一组函数允许你获取有关 SAS 数据集的信息。\n\
    \n"
