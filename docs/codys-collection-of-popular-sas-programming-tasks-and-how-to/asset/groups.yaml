    本章向你展示了合并 SAS 数据或向现有数据集添加新数据的方法。使用简单的 `SET` 语句列出你想要合并的数据集是其中方法。在适当的情况下，`PROC APPEND`
    提供了一个极其高效的解决方案。如果你的两个数据集包含相同的变量，但某些字符变量的长度在两个数据集中不一致，问题就会变得更加复杂。本章将讨论如何完成最后一项任务，并开发一个宏来自动化该过程。


    另一个常见任务涉及用新值更新数据集。例如，你可能有一个包含产品标识符和价格的数据集，你想更新某些价格。你将看到完成此任务的几种创新方法。你也可以使用相同的技术修正
