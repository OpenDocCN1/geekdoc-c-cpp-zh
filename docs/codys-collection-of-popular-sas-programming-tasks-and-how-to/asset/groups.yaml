    # Keywords


    +   Transpose


    +   Restructure


    +   Multiple observations per subject


    This first task is to start with a data set that has one observation per subject,
    and create a data set that has multiple observations per subject. Let’s start
    with the OnePer data set listed in the “Introduction” section. You can convert
    this data set into one with multiple observations per subject with the following
    program:'
  - '[PAGE 98]


    # Chapter 7: Restructuring (Transposing) SAS Data Sets 77


    # Program 7.1: Converting a data set with one observation per subject into one
    multiple observations per subject (using a DATA step)


    *One observation per subject to several observations per subject

    Data step approach:


    ```

    data ManyPer;

    set OnePer;

    array Dx[3];

    do Visit = 1 to 3;

    if not missing(Dx[Visit]) then do;

    Diagnosis = Dx[Visit];

    output;

    end;

    keep Subj Visit;

    run;

    ```


    You first make an array of the three variables (Dx1-Dx3). Next, set up a DO loop
    to process each element in the array. If you have a missing Dx, you do not want
    to output an observation in the ManyPer data set. You set the value of Diagnosis
    equal to Dx for non-missing values of Dx, and then output an observation to the
    ManyPer data set. It is important that the OUTPUT statement is the Do loop. In
    that way, you create multiple observations in set ManyPer from a single observation
    in set OnePer. You can see the listing of data set ManyPer in the “Introduction”
    section in this chapter.


    # Task: Converting a data set with one observation per subject into one with multiple
    observations per subject (using PROC TRANSPOSE)


    # Keywords


    +   -Transpose


    +   - Restructure


    +   - Multiple observations per subject


    +   - PROC TRANSPOSE


    You can accomplish the same result as in the previous task by using PROC TRANSPOSE.
    If you run the following program, you will create a data set with multiple observations
    per subject; however, you will need to tweak it bit to make the new data set look
    identical to the DATA step solution.'
  - "[PAGE 99]\n\n78 Cody's Collection of Popular SAS Programming Tasks and How to\
    \ Tackle Them\n\n# Program 7.2: Converting a data set with one observation into\
    \ one with multiple observations per subject (using PROC TRANSPOSE)\n\n```\nsas\n\
    *PROC TRANSPOSE solution;\n  *First try;\n  proc transpose data=oneper\n     \
    \ out=manyper;\n\n    by Subj;\n    var Dx1-Dx3;\n  run;\n```\n\nYou supply PROC\
    \ TRANSPOSE with an input data set (identified by DATA=) and an output data set\
    \ (identified by OUT-). Because you want each of the rows Dx codes for each Subj,\
    \ you need to include a BY statement identifying Subj as your BY variable. You\
    \ also identify the variables you want to transpose, in this case Dx1- Dx3. The\
    \ resulting data set looks like this:\n\n| Subj | _NAME_ | COL1 |\n|---|---|--|\n\
    | 001 | Dx1 | 450 |\n| 001 | Dx2 | 430 |\n| 001 | Dx3 | 410 |\n| 002 | Dx1 | 250\
    \ |\n| 002 | Dx2 | 240 |\n| 002 | Dx3 | . |\n| 003 | Dx1 | 410 |\n| 003 | Dx2\
    \ | 250 |\n| 003 | Dx3 | 500 |\n| 004 | Dx1 | 240 |\n| 004 | Dx2 | . |\n| 004\
    \ | Dx3 | . |\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks\
    \ and How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore."
- md: "\n## Chapter 7: Restructuring (Transposing) SAS Data Sets 79\n\nThis is close\
    \ to the result you. You need to rename Coll1 to Diagnosis, drop the variable\
    \ _Name_, remove observations that have a missing value for Dx, as demonstrated\
    \ in the next program:\n\nProgram 7.3: Making a few changes to the PROC TRANSPOSE\
    \ program to produce the output set you want\n\n```sas\nproc transpose data=OnePer\n\
    \    out=ManyPer (rename=(coll=Diagnosis)\n    drop=_name_\n    where=(Diagnosis\
    \ is not null));\n  by Subj;\n  var Dx1-Dx3;\nrun;\n```\n\nYou use a data set\
    \ option to rename Coll to drop the variable _Name_, and a WHERE set option to\
    \ remove observations where the Diagnosis is a missing value. The resulting data\
    \ set is almost identical to the ManyPer data set produced by the DATA step—the\
    \ only difference being the variable Visit is not in the data set created by PROC\
    \ TRANSPOSE.\n\n## Task: Converting a data set with multiple observations per\
    \ subject into one with one observation per subject (using a DATA step)\n\n##\
    \ Keywords\n\n- **Transpose**\n- **Restructure**\n- Multiple observations per\
    \ subject\n\nThis is the reverse of the first task described in this section.\
    \ The approach, using a DATA step, is to create an array of the variables that\
    \ will hold values from multiple observations in the input data set. Because you\
    \ are adding one value to each array for each iteration of the DATA step, you\
    \ need to retain all of the variables making you array. Be careful! If you do\
    \ not set all of the new variables to a missing value for each subject, you might\
    \ wind up with non-missing values from a previous subject. The following program\
    \ accomplishes this:\n\nProgram 7.4: Converting a data set with multiple observations\
    \ per subject into one with observation per subject (using a DATA step)\n\n> *Going\
    \ from a data set with several observations per subject to one with one observation\
    \ per subject.*\n\n```sas\nproc sort data=ManyPer;\n    by Subj Visit;\nrun;\n\
    ```\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and How\
    \ to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \n## 80 Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \n```sas\ndata OnePer;\nset ManyPer;\nby Sub;\narray Dx[3];\nretain Dx1-Dx3;\n\
    if first.Sub then call missing(of Dx1-Dx3);\nDx[Visit] = Diagnosis;\nif last.Sub\
    \ then output;\nkeep Sub Dx1-Dx3;\nrun;\n```\n\nYou need to sort the ManyPer data\
    \ by Sub in order to create the two automatic BY group variables First.Sub and\
    \ Last.Sub. Each time you are reading the first observation for a subject, you\
    \ set each of the Dx variables to a missing value (using the CALL MISSING routine).\
    \ Next, you set each of the array elements to Diagnosis. Finally, when you are\
    \ reading the last observation for each subject, you output an observation. The\
    \ resulting data set is identical to the OnePer data set listed in the \"Introduction\"\
    \ in this chapter.\n\n## Task: Converting a data set with multiple observations\
    \ per subject into one observation per subject (using PROC TRANSPOSE)\n\n## Keywords\n\
    \n- Transpose\n- Restructure\n\nThe final task in section is identical to the\
    \ previous task, except you use PROC TRANSPOSE to perform the conversion. The\
    \ program shown next has all of the options and data set options necessary to\
    \ create the OnePer data set, which is identical to the previous task. Here it\
    \ is:\n\n## Problem 7.5: Converting a data set with multiple observations per\
    \ subject into one with observation per subject (using PROC TRANSPOSE)\n\n```sas\n\
    proc data=ManyPer out=OnePer(drop=Name_)\nprefix=Dx;\nby Sub;\nid Visit;\nvar\
    \ Diagnosis;\nrun;\n```\n\nThe PREFIX= option with SAS as the ID variable tells\
    \ PROC TRANSPOSE to combine the prefix (Dx) with the values of Visit (1,2,3) to\
    \ create three variables Dx1, Dx2, and Dx3. That is, the PREFIX= and the ID statement\
    \ interact to create the names of the transformed variables in the output data\
    \ set. The VAR statement allows you to select which variables in your data set\
    \ you want transposed. Since all the variables in the ManyPer data have been identified\
    \ in the BY and ID statements, you do not need to include the statement VAR DIAGNOSIS\
    \ in this example. If you had other variables in the input data set, the VAR statement\
    \ would have been necessary. It was included here since, in most real world problems,\
    \ there would have been variables in the input data set that you did not want\
    \ to transform.\n\n## Conclusion\n\nRestructuring or transforming data sets, either\
    \ from one-to-many or many-to-one is a task that most SAS programmers face at\
    \ some point in their careers. Using a DATA step to accomplish your goals gives\
    \ you more flexibility. If you use PROC TRANSPOSE frequently and don't have to\
    \ rely on SAS help every time you use it (as does this author), you may find that\
    \ you can solve your transposing problem faster with PROC TRANSPOSE compared to\
    \ a DATA step. It's nice to.\n\n## Chapter 8: Tasks Involving Dates\n\n- Introduction\
    \ ............................................................................83\n\
    - Task: Computing a person's age, given date of birth ................................83\n\
    - Task: Computing a SAS date given a month, and year (even if the day is missing)...................................................84\n\
    - Conclusion .................................................................................85\n\
    \n## Introduction\n\nThis short chapter includes one of the most common tasks—computing\
    \ a person's age. Another task discussed is to compute a SAS date given a month,\
    \ and year. To make the task bit more interesting, the program presented here\
    \ uses 15th day of month. Let's get started.\n\n## Task: Computing a person's\
    \ age, given date of birth\n\n- Age computation\n- YRDIF function\n- TODAY function\n\
    \nFor this task, you want to compute a person's age as of January 1, 2012, given\
    \ date of birth. In the “old” way, you might approach this problem by taking the\
    \ difference between January 1, 2012, and the DOB and dividing by 365.25.\n\n\
    ## Program 8.1: Computing a person's age, given a date of birth\n\n```sas\n*Computing\
    \ a person's age, given date of birth;\ndata Compute_Age;\n    set Demographic;\n\
    \    Age_Exact = yrdif(DOB,'01jan2012'd);\n    Last_Birthday = int(Age_Exact);\n\
    run;\n```\n\nSet Demographic contains the date of birth in a variable DOB. The\
    \ YRDIF function takes as its first two arguments, the earlier date and the later\
    \ date, respectively. There is a third, optional argument called a basis that\
    \ allows you to specify the number of days in a year. Some financial calculations\
    \ use 30 months and 360 days, regardless of the actual months involved or it a\
    \ leap year.\n\nTo use the YRDIF function in SAS 9.3, you need to specify \"ACT/ACT\"\
    \ as the third argument to the function or off by one day if both of the dates\
    \ involves a leap year. Using SAS 9.3 or later, you can omit this third argument\
    \ and the function defaults to a basis called \"AGE\" that computes age correctly.\n\
    \nOnce you have computed an age (or any other difference between two dates), you\
    \ can use the INT function to compute the age as the last birthday or the ROUND\
    \ function to round the age to an integer (or other value).\n\nIf you want to\
    \ compute an age of the current date, use the TODAY function for the second argument\
    \ of the YRDIF function.\n\n## Task: Computing a SAS date given a month, day,\
    \ and year (even if the day is missing)\n\n- MDY function\n- COALESCE function\n\
    \nIf you have a SAS date set with values month, day, and year, you can use the\
    \ MDY function to compute a SAS date. If the day of the month is missing, you\
    \ might choose to use the 15th of the month for the day of the month.\n"
  mdcn: "\n\n## 第 7 章：重构（转置）SAS 数据集 79\n\n这已经接近你想要的结果了。你需要将 Coll1 重命名为 Diagnosis，删除变量\
    \ `_Name_`，并移除 Dx 为缺失值的观测值，如下程序所示：\n\n程序 7.3：对 PROC TRANSPOSE 程序进行几处修改以生成你需要的输出集\n\
    \n```sas\nproc transpose data=OnePer\n    out=ManyPer (rename=(coll=Diagnosis)\n\
    \    drop=_name_\n    where=(Diagnosis is not null));\n  by Subj;\n  var Dx1-Dx3;\n\
    run;\n```\n\n你使用数据集选项来重命名 Coll 并删除变量 `_Name_`，使用 WHERE 集合选项来移除 Diagnosis 为缺失值的观测值。生成的数据集与\
    \ DATA 步生成的 ManyPer 数据集几乎完全相同——唯一的区别是 Visit 变量不在 PROC TRANSPOSE 创建的数据集中。\n\n##\
    \ 任务：将每个主题具有多个观测值的数据集转换为每个主题只有一个观测值的数据集（使用 DATA 步）\n\n## 关键字\n\n- **转置 (Transpose)**\n\
    - **重构 (Restructure)**\n- 每个主题多个观测值\n\n这是本节中描述的第一个任务的反向操作。使用 DATA 步的方法是创建一个变量数组，用于存储输入数据集中多个观测值值。因为在\
    \ DATA 步的每次迭代中，你都会为每个数组添加一个值，因此你需要保留构成该数组的所有变量。注意！如果你没有为每个主题将所有新变量都设置为缺失值，你可能会得到来自上一个主题的非缺失值。以下程序实现了此点：\n\
    \n程序 7.4：将每个主题具有多个观测值的数据集转换为每个主题只有一个观测值的数据集（使用 DATA 步）\n\n> *从每个主题有几个观测值的数据集转换为每个主题只有一个观测值的数据集.*\n\
    \n```sas\nproc sort data=ManyPer;\n    by Subj Visit;\nrun;\n```\n\nCody, Ron.\
    \ Cody's Collection of Popular SAS® Programming Tasks and How to Tackle Them.\
    \ Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. 如需更多 SAS 资源，请访问 support.sas.com/bookstore.\n\n## 80 Cody 收集的常用 SAS\
    \ 编程任务及解决方法\n\n```sas\ndata OnePer;\nset ManyPer;\nby Sub;\narray Dx[3];\nretain\
    \ Dx1-Dx3;\nif first.Sub then call missing(of Dx1-Dx3);\nDx[Visit] = Diagnosis;\n\
    if last.Sub then output;\nkeep Sub Dx1-Dx3;\nrun;\n```\n\n你需要按照 `Sub` 对 ManyPer\
    \ 数据进行排序，以便创建两个自动的 BY 组变量 `First.Sub` 和 `Last.Sub`。每当你读取一个主题的第一个观测值时，你将每个 Dx 变量都设置为缺失值（使用\
    \ `CALL MISSING` 语句）。接下来，你将数组的每个元素设置为 `Diagnosis`。最后，当你读取每个主题的最后一个观测值时，输出该观测值。生成的数据集与本章“引言”部分列出的\
    \ OnePer 数据集相同。\n\n## 任务：将每个主题具有多个观测值的数据集转换为每个主题只有一个观测值数据集（使用 PROC TRANSPOSE）\n\
    \n## 关键字\n\n- 转置 (Transpose)\n- 重构 (Restructure)\n\n本节的最后一个任务与上一个任务相同，只是你使用 PROC\
    \ TRANSPOSE 来执行转换。接下来的程序包含了创建 OnePer 数据集所需的所有选项和数据集选项，这与上一个任务相同。这里是代码：\n\n## 问题\
    \ 7.5：将每个主题具有多个观测值的数据集转换为每个主题只有一个观测值数据集（使用 PROC TRANSPOSE）\n\n```sas\nproc data=ManyPer\
    \ out=OnePer(drop=Name_)\nprefix=Dx;\nby Sub;\nid Visit;\nvar Diagnosis;\nrun;\n\
    ```\n\n带有 SAS 作为 ID 变量的 `PREFIX=` 选项告诉 PROC TRANSPOSE 将前缀 (Dx) 与 Visit 的值 (1,2,3)\
    \ 结合，以创建三个变量 Dx1、Dx2 和 Dx3。也就是说，`PREFIX=` 和 `ID` 语句相互作用，创建了输出数据集中转换后变量的名称。`VAR`\
    \ 语句允许你选择数据集中想要转置的哪些变量。由于 ManyPer 数据中的所有变量已经在 BY 和 ID 语句中被识别，因此在此示例中你不需要包含 `VAR\
    \ DIAGNOSIS` 语句。如果输入数据集中还有其他变量，则 `VAR` 语句将是必要的。在这里包含它是是因为在大多数现实问题中，输入数据集中会有你不想转换的变量。\n\
    \n## 结论\n\n重构或转换数据集（无论是从一对多还是多对一）都是大多数 SAS 程序员在职业生涯某个阶段都会面临的任务。使用 DATA 步来实现你的目标可以提供更大的灵活性。如果你频繁使用\
    \ PROC TRANSPOSE 并且不需要每次使用时都依赖 SAS 帮助（像作者我这样），你可能会发现与 DATA 步相比，使用 PROC TRANSPOSE\
    \ 可以更快地解决转置问题。这感觉很不错。\n\n## 第 8 章：涉及日期的任务\n\n- 引言 ............................................................................83\n\
    - 任务：给定出生日期计算一个人的年龄 ................................................83\n- 任务：给定月份和年份计算\
    \ SAS 日期（即使日期缺失）..................................................................84\n\
    - 结论 .................................................................................85\n\
    \n## 引言\n\n这个简短的章节包含了一个最常见的任务之一——计算人的年龄。讨论的另一个任务是给定月份和年份计算 SAS 日期。为了让任务变得有点趣，这里的程序使用了\
    \ 15 号。让我们开始吧。\n\n## 任务：给定出生日期计算一个人的年龄\n\n- 年龄计算\n- YRDIF 函数\n- TODAY 函数\n\n对于此任务，你想计算截至\
    \ 2012 年 1 月 1 日的年龄。在“旧”方法中，你通过计算 2012 年 1 月 1 日与 DOB 之间的差并除以 365.25 来解决这个问题。\n\
    \n## 程序 8.1：给定出生日期计算一个人的年龄\n\n```sas\n*给定出生日期计算人的年龄;\ndata Compute_Age;\n    set\
    \ Demographic;\n    Age_Exact = yrdif(DOB,'01jan2012'd);\n    Last_Birthday =\
    \ int(Age_Exact);\nrun;\n```\n\n"
