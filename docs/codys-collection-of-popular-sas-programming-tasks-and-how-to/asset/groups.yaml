    # Introduction


    This chapter shows you ways to concatenate SAS data sets or to add new data to
    an existing data set. A simple SET statement, listing the data sets you want to
    concatenate, is one approach. PROC

    APPEND, under the right circumstances, provides an extremely efficient solution.
    If your two data sets contain the same variables, but the length of some of the
    character variables is not consistent in the two data sets, the problem becomes
    more complicated. This chapter discusses how to accomplish this last task and
    proceeds to develop a macro to automate the process.


    Another common task involves updating a data set with new values. For example,
    you might have a data set with product identifiers and prices and you wish to
    update some of the prices. You will see several innovative ways to accomplish
    this task. You can also use the same techniques to correct data errors in a SAS
    data set.


    Finally, the last task in this chapter discusses how to perform a "fuzzy" match—matching
    names from two SAS data sets where the names may not be spelled exactly the same.


    # Task: Concatenating two SAS data sets—Using a SET statement


    # Keywords


    - Concatenating data sets

    - SET statement


    Suppose you have two data sets, Name1 and Name2, and you want to add the data
    from Name2 to Name1. To help visualize the process, here are the listings of the
    two data sets:


    Listing of Name1

    | Name | Gender | Weight |

    | :--- | :--- | :--- |

    | Horath | F | 63 |

    | Chien | M | 64 |

    | Morgan | F | 72 |

    | Hicks | M | 66 |

    | Bailey | F | 69 |


    Listing of Name2

    | Name | Gender | Weight |

    | :--- | :--- | :--- |

    | Snow | M | 51 |

    | Hillary | F | 35 |


    The most straightforward way to put these data sets together and create a new
    data set is by using a SET statement. Before putting these data sets together,
    it is a good idea to consider the lengths of the character variables. If there
    are any differences, the length of the first data set will determine the length
    in the newly created data set.


    The lengths of the character variables are identical in each of the two files.
    Later in this chapter, you will see how to approach this task when the lengths
    are not the same.


    You can now go and concatenate the two files using a SET statement as follows:


    # Program 4.1: Concatenating data sets using a SET statement


    ```

    *Concatenating SAS data sets;

    data Combined;

    set Name Name2;

    run;

    ```


    Data set Combined contains six observations, four from Name1 and two from Name2.


    # Task: Concatenating two SAS data sets—Using PROC APPEND


    # Keywords


    - Concatenating data sets

    - PROC APPEND


    Program 4.1 requires SAS to read all the observations from Name1 as well as Name2.
    If the first data Name1(in the example) is large, this uses considerable computer
    resources. An alternative is to use PROC APPEND add the observations from Name2
    to end of data set. PROC APPEND jumps directly to the end of Name1 and starts
    adding the observations from Name2. In this case, the two data sets have identical
    variables and attributes, this is a very efficient solution.


