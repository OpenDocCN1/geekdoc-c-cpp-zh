    # Chapter 11: Tasks Involving Multiple Observations per Subject 107


    Here is the portion of the SAS Log that shows the values of these two variables:


    ```

    Subj=001 FIRST.Subj=1 LAST.Subj=1

    Subj=002 FIRST.Subj=1 LAST.Subj=0

    Subj=002 FIRST.Subj=0 LAST.Subj=1

    Subj=003 FIRST.Subj=1 LAST.Subj=1

