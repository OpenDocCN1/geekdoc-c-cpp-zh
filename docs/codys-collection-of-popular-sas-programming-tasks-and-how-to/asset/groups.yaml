    # # Introduction


    This chapter demonstrates some of the techniques you need when you have multiple
    observations per subject (or any other grouping). For example, you may have a
    SAS data set containing visits to a clinic. Each patient could have a different
    number of visits. Some of the tasks you may want to perform are selecting the
    first or last visit for each patient, computing differences in values from one
    visit to the next, or computing differences in values from the first visit to
    the last visit. Another common task is to determine the number of visits for each
    patient. You will find solutions to these tasks plus other useful techniques in
    this chapter.'
