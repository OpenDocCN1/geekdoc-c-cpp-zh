    You might also want to reverse the process and go from a data set with several
    observations per subject to a data set containing one observation per subject.
    In this chapter, you will see how to accomplish these tasks using a DATA step,
    and if you are brave enough, PROC TRANSPOSE.


    # Task: Converting a data set with one observation per subject into one with multiple
