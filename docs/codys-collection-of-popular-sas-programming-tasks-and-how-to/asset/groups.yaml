    # 80 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    ```

    data OnePer;

    set ManyPer;

    by Sub;

    array Dx[3];

    retain Dx1-Dx3;

    if first.Sub then call missing(of Dx1-Dx3);

    Dx[Visit] = Diagnosis;

    if last.Sub then output;

    keep Sub Dx1-Dx3;

    ```


    You need to sort the ManyPer data by Sub in order to create the two automatic
    BY group variables First.Sub and Last.Sub. Each time you are reading the first
    observation for a subject, you set each of the Dx variables to a missing value
    (using the CALL MISSING routine). Next, you set each of the array elements to
    Diagnosis. Finally, when you are reading the last observation for each subject,
    you output an observation. The resulting data set is identical to the OnePer data
    set listed in the "Introduction" in this chapter.


    # Task: Converting a data set with multiple observations per subject into one
    observation per subject (using PROC TRANSPOSE)


    # Keywords


    +   * Transpose

    * Restructure


    The final task in section is identical to the previous task, except you use PROC
    TRANSPOSE to perform the conversion. The program shown next has all of the options
    and data set options necessary to create the OnePer data set, which is identical
    to the previous task. Here it is:


    # Problem 7.5: Converting a data set with multiple observations per subject into
    one with observation per subject (using PROC TRANSPOSE)


    ```

    proc data=ManyPer out=OnePer(drop=Name_)

    prefix=Dx;

    by Sub;

    id Visit;

    var Diagnosis;

    run;

    ```


    The PREFIX= option with SAS as the ID variable tells PROC TRANSPOSE to combine
    the prefix (Dx) with the values of Visit (1,2,3) to create three variables Dx1,
    Dx2, and Dx3. That is, the PREFIX= and the ID statement interact to create the
    names of the transformed variables in the output data set. The VAR statement allows
    you to select which variables in your data set you want transposed. Since all
    the variables in the ManyPer data have been identified in the BY and ID


