    \ Num_Y = Num_Y + 1;\n    else if upcase(Q[i]) eq 'N' then Num_N = Num_N + 1;\n\
    \  end;\n  drop i;\nrun;\n```\n\nYou first create an array of the five variables.\
    \ Next, you initialize the two variables that will hold the counts, Num_Y and\
