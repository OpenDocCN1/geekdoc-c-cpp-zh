  - '[PAGE 130]


    # Task: Identifying observations with exactly ''n'' observations per subject


    Keywords


    Multiple observations per subject


    “n'' observations per subject


    There are times when you expect a fixed number of observations per subject (or
    other BY variable). You can accomplish this task by initializing a counter when
    you are reading the first observation per subject, incrementing the counter for
    each successive observation with the same subject number, and checking the counter
    when you are reading the last observation for each subject.


    Data set TwoRecords was created to demonstrate this task. Here is the listing:


    | Subj | Weight |

    |---|---|

    | 001 | 200 |

    | 001 | 190 |

    | 002 | 155 |

    | 002 | 157 |

    | 003 | 123 |

    | 004 | 220 |

    | 004 | 221 |

    | 005 | 111 |

    | 005 | 112 |


    Subjects 001, 002, and 005 have two observations each. You can output the observations
    for all subjects who do not have exactly two observations with the following program:'
  - "[PAGE 131]\n\n# Program 11.8: Identifying subjects who have exactly two observations\n\
    \n```\nproc sort data=Two_Records;\n  by Subj;\n  run;\n\ndata Not_Two;\n  set\
    \ Two_Records;\n  by subj;\n  if first.Subj then n=0;\n  n + 1;\n  if last.Subj\
    \ and n ne 2 then output;\n  run;\n```\n\nEach time you are processing the first\
    \ observation for a subject, you set your counter (n) equal to zero. You then\
    \ increment the counter using a SUM statement. Finally, when you reach the last\
    \ observation for each subject and n is not equal to 2, you output an observation.\n\
    \nThe following listing shows all the subjects who do not have exactly two observations:\n\
    \n| Subj | Weight | n |\n|---|---|--|\n| 003 | 123 | 1 |\n| 004 | 210 | 3 |\n\n\
    # Task: Computing differences between observations (for each subject)\n\n# Keywords\n\
    \n# Differences between observations\n\n# LAG function\n\nOne of the most common\
    \ requirements when you have multiple observations per subject is to compute differences\
    \ between observations. To demonstrate this, take a look at the Visits data set.\
    \ (Each subject has a unique value of the variable Patient.)\n\n| Patient | Visit\
    \ | Weight |\n|---|---|--|\n| 001 | 1 | 120 |\n| 001 | 2 | 124 |\n| 001 | 3 |\
    \ 124 |\n| 002 | 1 | 200 |\n| 003 | 1 | 310 |"
  - "[PAGE 132]\n\n# Chapter 11: Tasks Involving Multiple Observations per Subject\
    \ 111\n\n| Patient | Visit | Weight |\n|---|---|--|\n| 003 | 2 | 305 |\n| 003\
    \ | 3 | 298 |\n| 003 | 3 | 290 |\n| 004 | 1 | 160 |\n| 004 | 2 | 162 |\n\nEach\
    \ patient has one to three visits. You want to see the weight change from visit\
    \ to visit for each patient. The simplest way is to use the LAG function, like\
    \ this:\n\n# Program 11.9: Using the LAG function to compute differences between\
    \ observations\n\n```\n*Computing inter-patient differences;\nproc sort data=Visits;\n\
    \  by Patient Visit;\nrun;\n\ndata Difference;\n  set Visits;\n  by Patient;\n\
    \  Diff_Wt = Weight - lag(Weight);\n  if not first.Patient then output;\nrun;\n\
    ```\n\nThe LAG function returns the value of its argument the last time the function\
    \ was executed. If you execute the LAG function for every iteration of the DATA\
    \ step, it will return a value from a previous observation. You may be tempted\
    \ to execute the LAG function when you are reading the first observation for each\
    \ patient, as the lag value is the last value from the previous patient. This\
    \ is OK. You are only outputting differences for the second observation for each\
    \ patient. If you use a statement such as:\n\n```\nif not first.Patient then Diff_Wt\
    \ = lag(Weight);\n```\n\nit will not work the next time you execute the LAG function\
    \ it will still return the last value from the previous patient. Unless you are\
    \ using the LAG function in a very unusual situation, such as in Program 11.11,\
    \ you should not use the LAG function in conditional logic.\n\nIn the previous\
    \ program, you can use the DIF function (DIF(Weight)) instead of the LAG function\
    \ (equal to Weight – LAG(Weight)) if you prefer.\n\nCody, Ron. Cody's Collection\
    \ of Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012,\
    \ SAS Institute Inc.\nary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore."
