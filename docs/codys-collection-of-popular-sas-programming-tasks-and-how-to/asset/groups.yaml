- md: "\n# Chapter 9: Data Tasks 91\n\nSuppose you want to perform the following tests\
    \ on data set Blood_Pressure:\n\n- 1. Heart_Rate is between 40 and 100 and missing\
    \ values are to be considered errors.\n- 2. SBP (systolic blood pressure) should\
    \ be between 80 and 200 and missing values are to be ignored.\n- 3. DBP (diastolic\
    \ blood pressure) should be between 60 and 120 and missing values are to be ignored.\n\
    \nThe ID variable in this set is called Sub; Run the following lines of code to\
    \ accomplish these goals:\n\n```sas\n*Test the macro;\n%let Dsn = Blood_Pressure;\n\
    %let How = Sub;\n%errors(Var=Heart_Rate, Low=40, High=100, Missing=error)\n%errors(Var=SBP,\
    \ Low=80, High=200, Missing=ignore)\n%errors(Var=DBP, Low=60, High=120, Missing=ignore)\n\
    %report\n```\n\nYou can call the errors three times, once for each of your variables.\
    \ You can then call the Report macro to generate the final report, as shown next:\n\
    \n| Sub Variable | Value | Reason |\n|---|---|---|\n| 2 Heart_Rate | | Missing\
    \ |\n| 8 Heart_Rate | | Missing |\n| 16 Heart_Rate | 38 | Low |\n| 17 Heart_Rate\
    \ | 116 | High |\n| 39 DBP | 130 | High |\n| 42 Heart_Rate | 37 | Low |\n| 45\
    \ Heart_Rate | 38 | Low |\n| 47 Heart_Rate | 38 | Low |\n| 49 Heart_Rate | 38\
    \ | Low |\n\nNotice that the two subjects with missing values for Heart_Rate are\
    \ listed, but the missing values for SBP and DBP are ignored and not listed in\
    \ the report as errors.\n\nCody, Ron. Cody's Collection of Popular SAS® Programming\
    \ Tasks and How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North\
    \ Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \n# Task: Demonstrating a macro that performs automatic outlier detection\n\n\
    ## Keywords\n\n- Outliers\n- Automatic outlier detection\n- Trimmed statistics\n\
    \nFor some variables, it is possible to identify possible outliers, without specifying\
    \ ranges. You can compute a mean and standard deviation and identify data points\
    \ as possible outliers if they are more than a given number of standard deviations\
    \ above or below the mean. There are several problems with this concept. First,\
    \ if you have a highly skewed distribution, this technique may not work well.\
    \ Second, if you have a few extreme data errors (a misplaced decimal point, for\
    \ example), the standard deviation might be so inflated that this technique will\
    \ fail to identify data errors.\n\nOne method you can use to rectify this latter\
    \ problem is to use trimmed statistics. Although this sounds complicated, the\
    \ concept is really quite simple. That is, you throw away values from both ends\
    \ of the distribution before performing the calculations for the mean and standard\
    \ deviation.\n\nPROC UNIVARIATE has the ability to compute trimmed statistics.\
    \ The macro that is presented next uses PROC UNIVARIATE to compute trimmed statistics,\
    \ and outputs these values to a SAS data set using ODS. The output data set from\
    \ the object called TrimmedMeans contains the trimmed mean but it does not contain\
    \ the standard deviation. Instead, you will find values for the trimmed standard\
    \ error (the standard deviation divided by the square root of the sample size),\
    \ and the degrees of freedom (in this case, to the sample size minus 1).\n\nIn\
    \ addition to those slight problems, you need to restructure (transform) your\
    \ original data set so that it can be merged with the ODS obtained data set.\n\
    \nThe purpose of presenting the Auto Outlier macro is to allow you to copy and\
    \ use it. For readers interested in the inner-workings of this macro, an explanation\
    \ is included.\n\nTo call the Auto Outlier, you need to identify your data name,\
    \ the ID variable, and a list of the variables you want to test (separated by\
    \ spaces). Two additional, optional arguments are the amount of trimming you want\
    \ and the number of standard deviations you want to declare as outliers. You have\
    \ a choice on how to specify much to trim your variables: If you enter a proportion\
    \ (less than .5), this proportion will be trimmed from both ends of the distribution;\
    \ if you specify an integer, this number of values will be trimmed from each end\
    \ of the distribution.\n\nA listing of the Auto_Outlier macro follows:\n\n# Chapter\
    \ 9: Data Cleaning Tasks 93\n\n## Program 9.5: Presenting a macro for automatic\
    \ detection of possible outliers\n\n```sas\n* using automatic outlier detection\n\
    %macro AutoOutliers(\nDsn, /* Data set name */\nID, /* Name of ID variable */\n\
    Var_list, /* List of variables to check */\n  /* separate names with spaces */\n\
    Trim=.1, /* Integer 0 to n = number to trim */\n  /* from each tail; if between\
    \ 0 and .5, */\n  /* proportion to trim in tail */\nNd=2 /* Number of standard\
    \ deviations */\n);\nods listing close;\nods output data=Trimmed(keep=VarName\
    \ Mean StdMean DF);\nvar Var_list;\nproc univariate data=&Dsn trim=Trim;\nrun;\n\
    ods output close;\ndata Restructure;\nset &Dsn;\nlength Vname $ 32;\narray vars[]\
    \ = &Var_list;\n i=1 to dim(vars);\n  VarName = varm(vars[i]);\n  Value = vars[i];\n\
    \  output;\nend;\n  keep &ID Varname Value;\nrun;\nproc sort data=trimmed;\nby\
    \ VarName;\nrun;\nproc sort data=restructure;\nby VarName;\nrun;\ndata Outliers;\n\
    merge Restructure Trimmed;\nby VarName;\nStd = StdMean(sqrt(DF + 1));\nif Value\
    \ > Mean - &N_sd*Std and not missing(Value)\nthen do;\n  Reason = 'Low ';\n  output;\n\
    end;\nelse if Value gt Mean + &N_sd*Std\nthen do;\n  Reason = 'High';\n  output;\n\
    end;\nrun;\n\nproc sort data=Outliers;\nby &ID;\nrun;\nods listing;\ntitle \"\
    Outliers Based on Trimmed Statistics\";\nproc print data=Outliers;\nid &ID;\n\
    var Varname Value;\nrun;\n\nproc datasets work;\ndelete Trimmed Structure;\nrun;\n\
    quit;\nCody, Ron's Collection of Popular SAS® Programming Tasks and How to Tackle\
    \ Them. Copyright ©2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\n\
    ## How the macro works\n\nThis section is included for readers who want to understand\
    \ the details of the Auto Outlier macro. The first step is to run PROC UNIVARIATE\
    \ and capture the trimmed statistics in a data set. Shown is a listing of data\
    \ set Trimmed:\n\n| VarName | Mean | StdMean | DF |\n|---|---|---|---|\n| Heart_Rate\
    \ | 69.3913 | 2.599517 | 45 |\n| SBP | 132.000 | 2.396861 | 43 |\n| DBP | 79.7727\
    \ | 0.938919 | 43 |\n\nYou need to combine this information with the values from\
    \ the Blood_Pressure data set. However, that data set has Heart_Rate, SBP, and\
    \ DBP. Your next step is to restructure the Blood_Pressure data set so merge it\
    \ with the Trimmed data set. Refer to Chapter 7 for details on restructuring data\
    \ sets.\n\nYou may be unfamiliar with the VNAME function used in this DATA step.\
    \ This very useful function returns a variable name, given an array element as\
    \ the argument.\n\nThe first eight observations in data Restructure (after it\
    \ is sorted by Varname) are listed next:\n\n| Subj | Varname | Value |\n|---|---|---|\n\
    | 1 | DBP | 72 |\n| 2 | DBP | 66 |\n| 3 | DBP | 62 |\n| 4 | DBP | 76 |\n| 5 |\
    \ DBP | . |\n| 6 | DBP | 74 |\n| 7 | DBP | 80 |\n| 8 | DBP | 86 |\n\nYou can now\
    \ merge the Trimmed data set and the Restructure data set using Varname as the\
    \ BY variable. Data Trimmed contains a standard error and the degrees of freedom.\
    \ You compute the standard deviation by multiplying the standard error by the\
    \ square root of the sample size (the degrees of freedom plus 1). Once you do\
    \ this, you can compare each value with the mean plus or minus the specified number\
    \ of standard deviations (all on trimmed values).\n\nNow, back to a discussion\
    \ of how to use the Outlier macro. Lets test the macro using the three variables\
    \ Heart, Rate, SBP, and DBP from the Blood_Pressure data set:\n\n# Program 9.6:\
    \ Testing the Outliers macro\n\n```sas\n*Testing the auto macro;\nauto_outliers(Dsn=Blood_Pressure,\n\
    \               ID=Subj,\n               Var_List=Heart_Rate SBP DBP,\n      \
    \         N_Sd=2.5)\n```\n"
  mdcn: "\n\n# 第 9 章：数据任务 91\n\n假设你想对数据集 Blood_Pressure 执行以下测试：\n\n- 1. Heart_Rate\
    \ 介于 40 到 100 之间，且缺失值被视为错误。\n- 2. SBP（收缩压）应在 80 到 200 之间，并忽略缺失值。\n- 3. DBP（舒张压）应在\
    \ 60 到 120 之间，并忽略缺失值。\n\n该集合中的 ID 变量名为 Sub。运行以下代码行以完成这些目标：\n\n```sas\n*Test the\
    \ macro;\n%let Dsn = Blood_Pressure;\n%let How = Sub;\n%errors(Var=Heart_Rate,\
    \ Low=40, High=100, Missing=error)\n%errors(Var=SBP, Low=80, High=200, Missing=ignore)\n\
    %errors(Var=DBP, Low=60, High=120, Missing=ignore)\n%report\n```\n\n你可以调用 errors\
    \ 宏 三次，每个变量调用一次。然后你可以调用 Report 宏生成最终报告，如下所示：\n\n| Sub 变量 | 值 | 原因 |\n|---|---|---|\n\
    | 2 Heart_Rate | | 缺失 |\n| 8 Heart_Rate | | 缺失 |\n| 16 Heart_Rate | 38 | 低 |\n\
    | 17 Heart_Rate | 116 | 高 |\n| 39 DBP | 130 | 高 |\n| 42 Heart_Rate | 37 | 低 |\n\
    | 45 Heart_Rate | 38 | 低 |\n| 47 Heart_Rate | 38 | 低 |\n| 49 Heart_Rate | 38 |\
    \ 低 |\n\n注意，两个 Heart_Rate 缺失的受试者列出了，但 SBP 和 DBP 的缺失值被忽略，未作为错误列在报告中。\n\nCody, Ron.\
    \ Cody's Collection of Popular SAS® Programming Tasks and How to Tackle Them.\
    \ Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. 如需更多 SAS 资源，请访问 support.sas.com/bookstore\n\n# 任务：演示执行自动离群值检测的宏\n\n\
    ## 关键词\n\n- 离群值\n- 自动离群值检测\n- 修剪统计量\n\n对于某些变量，可以在不指定范围的情况下识别可能的离群值。你可以计算平均值和标准差，如果数据点比平均值高或低超过给定倍数的标准差，则将其识别为可能的离群值。这个概念存在几个问题。首先，如果你有一个高度偏态的分布，这种技术可能不起作用。其次，如果你有少数极端的数据错误（例如，小数点位置错误），标准差可能会被过度放大，以至于该技术无法识别数据错误。\n\
    \n解决后一个问题的方法之一是使用修剪统计量（trimmed statistics）。尽管听起来很复杂，但概念实际上非常简单。也就是说，在计算平均值和标准差之前，丢弃分布两端的值。\n\
    \nPROC UNIVARIATE 具有计算修剪统计量的能力。接下来显示的宏使用 PROC UNIVARIATE 计算修剪统计量，并使用 ODS 将这些值输出到\
    \ SAS 数据集中。来自 TrimmedMeans 对象的输出数据集包含修剪平均值，但不包含标准差。相反，你将找到修剪标准误（标准差除以样本量的平方根）和自由度（在这种情况下为样本量减\
    \ 1）的值。\n\n除了这些细微的问题外，你还需要重构（转换）你的原始数据集，以便能与 ODS 获取的数据集合并。\n\n展示 Auto Outlier\
    \ 宏的目的是让你复制并使用它。对于对该宏内部原理感兴趣的读者，文中包含了说明。\n\n要调用 Auto Outlier，你需要识别你的数据名称、ID 变量以及你想要测试的变量列表（用空格分隔）。另外两个可选参数是你想要修剪的量以及想要声明为离群值的标准差倍数。你可以自由选择如何指定修剪变量的程度：如果你输入一个比例（小于\
    \ .5），则该比例将从分布的两端各进行修剪；如果你指定一个整数，则将从分布的每个末端修剪掉相应数量的值。\n\n以下是 Auto_Outlier 宏的列举：\n\
    \n# 第 9 章：数据清洗任务 93\n\n## 程序 9.5：展示一个用于自动检测可能离群值的宏\n\n```sas\n* using automatic\
    \ outlier detection\n%macro AutoOutliers(\nDsn, /* Data set name */\nID, /* Name\
    \ of ID variable */\nVar_list, /* List of variables to check */\n  /* separate\
