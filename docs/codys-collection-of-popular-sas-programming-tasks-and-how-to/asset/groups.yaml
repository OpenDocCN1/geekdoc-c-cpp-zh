    # Program 6.6: Demonstrating a two-way array to perform a table lookup


    ```

    *Tweway table lookup using temporary arrays;

    data Two_Way;

    array Goals_Job[2004:2012,4] _temporary_

    if _n = 1 then do Year = 2004 to 2012;

    do Job = 1 to 4;

    set Goals_Job;

    Goals_Job[Year,Job] = Goal;

    end;


    set Sales_Job;

    drop Goals_Job;

    Difference = Sales - Goals_Job[Year,Job];

    run;

    ```


    As in the previous program, you use a colon to define the bounds of the first
    dimension of the array (representing the year), and a comma to specify that there
    are four values for the second dimension (representing each of the four job codes).
    On the first iteration of the DATA step, you load values into the temporary array
    from the Goals data set. Then, given any value for Year and Job, the array element
    returns the Goal value. The resulting data set Two_Way is listed next:'
