    \ from one visit to the next, or computing differences from the first visit to\
    \ the last. Another common task is to determine the number of visits for each\
    \ patient. You will find solutions to these tasks plus useful techniques in this\
    \ chapter.\n\n## Task: Using PROC SORT to detect duplicate values or duplicate\
    \ observations (records)\n\n- Keywords\n- PROC SORT\n- Duplicates\n- NODUPKEY\n\
    - NODUPCS\n\nThe data set Duplicates was created to demonstrate how to detect\
    \ duplicate variables or duplicate observations in a data set. Here is a listing:\n\
    \n| Subj | Gender | Age | Height | Weight |\n|---|---|---|---|---|\n| 001 | M\
