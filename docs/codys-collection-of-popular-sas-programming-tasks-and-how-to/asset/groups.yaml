    \ RANK 创建 Heart_Rate 的五分位数\n\n```\n*使用 PROC RANK 进行分组;\nproc rank data=Blood_Pressure(Keep=Subj\
    \ Heart_Rate)\n  out=Grouped groups=5;\n  var Heart_Rate;\n  ranks HR_Group;\n\
    run;\n```\n\n以下是 `Grouped` 数据集中前 12 条观测值：\n\n| Sub | Heart_Rate | HR_Group |\n\
    |---|---|---|\n| 1 | 71 | 2 |\n| 2 | | - |\n| 3 | 78 | 3 |\n| 4 | 60 | 1 |\n|\
    \ 5 | 79 | 3 |\n| 6 | 96 | 4 |\n| 7 | 51 | 1 |\n| 8 | | - |\n| 9 | 54 | 1 |\n\
    | 10 | 65 | 1 |\n| 11 | 55 | 1 |\n| 12 | 48 | 0 |\n\n记住，组号是从零开始的。在这个列表中，你有五个心率组，值范围从\
    \ 0 到 4。\n\n带有 `GROUPS=` 选项的 PROC RANK 是是将任何变量划分为组的非常简单的方法。\n\nCody, Ron. Cody's\
    \ Collection of Popular SAS® Programming Tasks and How to Tackle Them. Copyright\
    \ © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ 更多 SAS 资源，请访问 support.sas.com/bookstore。\n\n## 结论\n\n你可以使用多种方法创建代表连续变量分组的变量。\n\
    尽管 DATA step 中的 `IF-THEN-ELSE` 语句是分组最常用的方法，但请记住，用户自定义格式结合 `PUT` 函数是创建分组的简单且高效的方法。如果你想创建等等数量的组，请记住\
    \ PROC RANK。\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks\
    \ and How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. 更多 SAS 资源，请访问 support.sas.com/bookstore。\n\n## 第 3\
    \ 章：数据摘要\n\n- 引言 .......................................................................................................................21\n\
    - 任务：使用 PROC MEANS 创建包含汇总 ...........................22 信息....................................................................................................................................................\n\
    - 任务：按另一个变量的值细分计算变量的平均值 ................23 变量：使用 BY 变量....................................................................................................\n\
    - 任务：按另一个变量的值细分计算变量的平均值 ................24 变量：使用 CLASS语句..................................................................................\n\
    - 任务：让 PROC MEANS 自动命名输出数据集中的变量（AUTENAME 选项）。.......................................................................................25\n\
    - 任务：从 PROC MEANS 创建多个输出数据集，每个具有不同的 CLASS 变量组合.........................................................................................26\n\
    - 任务：将汇总信息（单个平均值）与详细数据合并：使用条件 SET 语句...............................................................................................29\n\
    - 任务：将汇总信息（单个平均值）与详细数据合并：使用 PROC SQL.......................................................................................................................31\n\
    - 任务：将汇总信息（单个平均值）与详细数据合并：不使用 PROC MEANS 的 PROC SQL...............................................................................................32\n\
    - 任务：将汇总信息（单个平均值）与详细数据合并：使用 BY 变量...............................................................................33\n\
    - 任务：将汇总信息（单个平均值）与详细数据合并：按变量................................................................................................34\n\
    - 结论 .................................................................................................36\n\
    \n## 引言\n\n你可以使用 PROC MEANS、PROC UNIVARIATE 和 PROC TABULATE 等过程生成平均值、中位数、标准差等汇总信息，但在某些情况下你需要这些信息放入数据集。本章将介绍如何完成这些任务。\n\
    \n## 任务：使用 PROC MEANS 创建包含汇总信息的数据集\n\n关键字\nPROC MEANS\n汇总数据集\n*平均值\n\n让我们从计算所有观测值的平均值并将其输出到数据集开始。在本章后面，你将看到如何合并。\n\
    \n## 程序 3.1：计算所有观测值的平均值并输出到数据集\n\n```\n*计算所有观测值的平均值并输出到数据集;\nproc means data=Blood_Pressure\
    \ noprint;\nvar Heart_Rate;\nout=Summary(keep=Mean_HR) mean=Mean_HR;\nrun;\n```\n\
    \n`noprint` 选项指示不要产生任何输出，因为你只需要数据集。该程序使用 `Blood_Pressure` 数据集并计算 `Heart_Rate`。注意，在这种情况下没有使用\
    \ `KEEP=` 数据集选项。这让你看到 PROC MEANS 在输出数据集中放置了什么。这里是：\n\n| Mean_HR |\n|---|\n| 69.3448\
    \ |\n\n该数据集包含一个观测值和一个变量（平均值）。\n\nCody, Ron. Cody's Collection of Popular SAS®\
    \ Programming Tasks and How to Tackle Them. Copyright © 2012, SAS Institute Inc.,\
    \ Cary, North Carolina, USA. ALL RIGHTS RESERVED. 更多 SAS 资源，请访问 support.sas.com/bookstore。\n\
    \n## 任务：按另一个变量的值细分计算变量的平均值：使用 BY 变量\n\n关键字\nPROC MEANS\nBY变量\n汇总数据集\n\n下一个任务与上一个任务类似，但这次你想输出每个\
    \ BY 变量的平均值。你首先需要对数据集进行排序（在本例中按 `Drug`），然后运行 PROC MEANS。以下是代码：\n\n```\n*为每个 BY\
    \ 变量计算平均值;\nproc sort data=Blood_Pressure;\nby Drug;\nrun;\n\nproc means data=Blood_Pressure\
    \ noprint;\nvar Heart_Rate;\noutput out=Summary mean=Mean_HR;\nrun;\n```\n\n程序\
    \ 3.2：为每个 BY 变量计算平均值\n\n注意，在这种情况下没有使用 `KEEP=` 数据集选项。这让你看到 PROC MEANS 在输出数据集中放置了什么。这里是列出内容：\n\
    \n| Drug | TYPE | FREQ | Mean_HR |\n|---|---|---|---|\n| Drug A | 0 | 20 | 73.3000\
    \ |\n| Drug B | 0 | 20 | 65.3500 |\n| Placebo | 0 | 20 | 69.3889 |\n\n该数据集包含了三个\
    \ `Drug` 值的每个 `Heart_Rate` 平均值。\n\n当你使用 BY 语句通过 PROC MEANS 创建数据集时，`TYPE` 变量始终为零。稍后当你使用\
    \ `CLASS` 语句时，它将取不同的值并非常有用。`FREQ` 变量告诉你每个 `Drug` 组的观测值数量（包含缺失和非缺失）。\n\n"
