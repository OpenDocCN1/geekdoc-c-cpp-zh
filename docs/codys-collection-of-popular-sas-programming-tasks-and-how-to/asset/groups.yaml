    ## Task: Replacing the first eight digits of a credit card number with asterisks\n\
    \n### Keywords\n\n- Masking characters\n- SUBSTR function\n- CATS function\n-\
    \ SUBSTR function on the left-hand side of the sign\n\nThis task is not limited\
    \ to masking digits in credit card numbers—you can use this technique any time\
    \ you want to replace characters in a string. You will see two solutions to this\
    \ task: one simple and straightforward, the other, very elegant.\n\nIn this solution,\
    \ you use the SUBSTR function to extract the last 4 digits of the credit card\
    \ number and you follow this with the CATS function to concatenate asterisks with\
    \ these four digits. Here is the code:\n\n```\nProgram 12.11: Replacing the first\
    \ eight digits of a credit card number with asterisks (method 1)\n*Replacing the\
    \ first 8 digits of a credit card number\nwith asterisks;\n*Using substrings and\
    \ concatenation functions;\ndata Credit_Report;\nlength Last_Four $ 12;\nset Credit;\n\
    Last_Four = cats('******',substr(Account, 9));\nrun;\n```\n\nA more elegant solution\
    \ is to use the SUBSTR function on the left-hand side of the sign like this:\n\
    \n```\nProgram 12.12: Replacing the first eight digits of a credit card number\
    \ with asterisks (method 2)\n*Using the SUBSTR function on the left-hand side\
    \ of the equal sign;\ndata Credit_report;\nset Credit;\nLast_Four = Account;\n\
    substr(Last_Four,1,8) = '******';\nrun;\n```\n\nAs a review, the SUBSTR function\
    \ on the left-hand side of the equal sign places the characters to the right of\
    \ the equal sign into the variable named on the left-hand side of the equal sign,\
    \ starting at the position specified by the second argument of the function a\
    \ length specified by the third argument of the function. Yes, this program is\
    \ only one line shorter than the previous program, but this author considers it\
    \ a more elegant solution—and isn't your goal—to write elegant programs?\n\n##\
    \ Task: Sorting within an observation (using the ORDINAL function)\n\n### Keywords\n\
    \n- Sorting within observation\n- Ordinal function\n\nThere are numerous occasions\
    \ where you would like to sort values within an observation. For example, you\
    \ might have a number of scores per person and you want to order the scores from\
    \ lowest to highest. The first solution presented here, uses the ORDINAL function\
    \ to accomplish this goal. This function takes a number as the first argument,\
    \ and a list of values as the remaining arguments. When the number is equal to\
    \ one, the function returns the smallest value, when the number is equal to two,\
    \ the function returns the second smallest value, when the number does not ignore\
    \ missing values, so the smallest value may be a missing value. Another ordering\
    \ function, SMALLEST, does ignore missing values—it returns the smallest value\
    \ in a list of values, not counting any missing values.\n\nYou want to order 10\
    \ scores (Score1-Score10) from lowest to highest. These scores are stored in data,\
    \ as shown below:\n\n| Name | Score1 | Score2 | Score3 | Score4 | Score5 | Score6\
    \ | Score7 | Score8 | Score9 | Score10 |\n| :--- | :--- | :--- | :--- | :--- |\
    \ :--- | :--- | :--- | :--- | :--- | :--- |\n| John | 95 | 92 | 87 | 100 | 96\
    \ | 88 | 89 | 78 | | 95 |\n| Mary | | 98 | 96 | 93 | 89 | 95 | 94 | | 99 |\n|\
    \ Sarah | | 84 | 87 | 88 | 80 | | 81 | 77 | 72 |\n| Sophie | | 78 | 79 | 81 |\
    \ 82 | 84 | 85 | 88 | 90 | 95 |\n\nFor this task, you want to create 10 new variables\
    \ (Sorted1-Sorted10).\n\n### Program 12.13: Using the ORDINAL function to sort\
    \ within an observation\n\n```\n* Sorting within an observation: Using the ORDINAL\
    \ function;\ndata Observed_Scores;\n  set Scores;\n  array Score[10];\n  array\
    \ Sorted[10];\n  do i = 1 to 10;\n    Sorted[i] = ordinal(i, Score[]);\n  end;\n\
    drop i;\nrun;\n```\n\n## Cody's Collection of Popular SAS Programming Tasks and\
    \ How to Tackle Them\n\nYou may wonder why there are no variables names on the\
    \ ARRAY statements. If you define an array with the number of elements in the\
    \ brackets following the array name, and you do not include a list of variables,\
    \ SAS will use the array name with numbers from 1. For example, SAS has 10 variables,\
    \ Score1–Score10. This program also uses Score[*] as the second argument to the\
    \ ORDINAL function. This is equivalent to writing Score1-Score10.\n\nAs you iterate\
    \ the DO loop, the values of Score are placed in the Sorted variables from smallest\
    \ to largest.\n\n## Task: Sorting within observation (using CALL SORTN)\n\n###\
    \ Keywords\n\n- Sorting within observation\n- CALL SORTN\n\nCALL SORTN is a call\
    \ routine that was introduced in SAS 9.3. (Note: CALL SORTN was actually in earlier\
    \ versions of SAS 9, but considered experimental.) For this example, you want\
    \ to sort the variables Score1–Score10 from smallest to largest. To use the SORTN\
    \ routine, you enter a list of variable names as arguments to the routine. If\
    \ you have a list in the form Score1–Score10, you need to precede the list with\
    \ the keyword OF. Following the call, the values of all the variables listed in\
    \ the routine are ordered from smallest to largest.\n\nHere is an example:\n\n\
    ### Program 12.14: Sorting within an observation (using CALL SORTN)\n\n```\n*Sorting\
    \ within an observation: Using CALL SORTN;\ndata Ordered_Scores;\nset Scores;\n\
    call sortn(of Score1-Score10);\nrun;\n```\n\nAfter this program, the values for\
    \ Score1–Score10 have been placed in order from smallest (Score1) to Score10 as\
    \ in the following listing:\n\n| Name | Score1 | Score2 | Score3 | Score4 | Score5\
    \ | Score6 | Score7 | Score8 | Score9 | Score10 |\n| :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| John | 2 | 78 | 87 | 88\
    \ | 89 | 92 | 95 | 95 | 96 | 100 |\n| Mary | | | 89 | 93 | 94 | 95 | 96 | 98 |\
    \ 99 | |\n| Sarah | | | 77 | 80 | 81 | 84 | 85 | 86 | 87 | 88 | 92 |\n| Sophie\
    \ | | | 79 | 81 | 82 | 84 | 85 | 86 | 88 | 90 | 95 |\n\n## Chapter 12: Miscellaneous\
    \ Tasks 129\n\nIf you also want to keep the original values of Score1-Score10\
    \ in their original order, you need to copy these values to other variables before\
    \ calling SORTN. It might be easier to use the ORDINAL function if you need the\
    \ original order and the sorted values.\n\n### Task: Computing the average of\
    \ the 'n' highest scores\n\n### Keywords\n\n- Sorting within an observation\n\
    - CALL SORTN\n\nAs a practical example of why it is useful to sort values within\
    \ an observation, consider the following: You have 10 scores (Score1-Score10)\
    \ and you want to compute the average of the highest scores.\n\nOne solution that\
    \ comes to mind, is to use the ORDINAL function to set the two lowest values to\
    \ missing, and then use the MEAN function to compute the average.\n\nCALL SORTN\
    \ provides a very simple way to solve this problem.\n\n### Program 12.15: Computing\
    \ the average of the 'n' highest scores (using CALL SORTN)\n\n```\n*Sorting within\
    \ an observation: Using CALL SORTN;\ndata Ordered_Scores;\nset Scores;\ncall sortn(of\
    \ Score1-Score10);\nAverage = mean(of Score3-Score10);\nrun;\n```\n\nCALL SORTN\
    \ switches the values of the variables Score1 to Score10 from lowest to highest.\
    \ The average of the highest scores is therefore the mean of Score3 through Score10.\n\
    \nIf you prefer to have the scores in descending order, you can write your call\
    \ routine like this:\n\n```\ncall sortn(of Score10-Score1);\n```\n\nThis way,\
    \ Score1 will contain the highest value, Score2, the second highest, and so forth.\
    \ To compute the mean of the highest scores, you would code:\n\n```\nAverage =\
    \ mean(of Score1-Score8);\n```\n\nThanks to Rick Langston at SAS Institute for\
    \ this clever idea.\n"
  mdcn: "\n## 第 12 章：杂项任务 125\n\n以此类推。_x1 的值在 %DO 循环外部设置，而其他每个 _x 值都是通过连接前缀 _x 与 %DO\
    \ 循环计数器加 1 来分配的。例如，在 %DO 循环的第一次迭代中，i 等于 1、2，赋值语句解析为 _x2 = lag(variable)。一旦你计算了所有的\
    \ lag 值，你就可以使用 MEAN 函数来计算移动平均值。\n\n为了直观地了解它的工作原理，让我们把这个宏命名为：\n\n### 程序 12.10：调用\
    \ moving_ave 宏\n\n```\n*Testing the macro;\nmoving_Ave(In_name=Stocks,\nout=moving_stocks,\n\
    Var=Price,\nMoving=Average,\nn=5)\n```\n\n并检查 SAS 日志以查看宏生成的代码（通过开启 MPRINT 选项实现）。以下是生成的代码：\n\
    \n```\nMPRINT (MOVING_AVE) : data Moving_Stocks;\nMPRINT (MOVING_AVE) : set Stocks;\n\
    MPRINT (MOVING_AVE) : **compute the lags;\nMPRINT (MOVING_AVE) : x1 = Price;\n\
    MPRINT (MOVING_AVE) : x2 = lag(Price);\nMPRINT (MOVING_AVE) : x3 = lag2(Price);\n\
    MPRINT (MOVING_AVE) : x4 = lag3(Price);\nMPRINT (MOVING_AVE) : x5 = lag4(Price);\n\
    MPRINT (MOVING_AVE) : **if the number is greater than or\nequal to the number\
    \ of values needed for the moving average, output;\nMPRINT (MOVING_AVE) : if n_\
