    \ | LABEL (VER, V7|V8) 19MAR2012:09:07:25) |\n| 020 | 020 | 瘟疫 |\n| 022 | 022\
    \ | 炭疽 |\n| 390 | 390 | 风湿性热 |\n| 410 | 410 | 心肌梗死 |\n| 493 | 493 | 哮喘 |\n| 540\
    \ | 540 | 阑尾炎 |\n| 500 | | |\n\n注意 `ICD9` 代码 500 没有对应的标签且没有被格式化。要向你的格式中添加类别，你需要将\
    \ `HLO` 设置为 'O' 并按如下方式提供标签：\n\n## 程序 5.4：向现有格式中添加新格式\n\n```\n*向现有格式中添加新格式；\ndata\
    \ ControlOut;\n  set Codes(rename=\n    (ICD9 = Start\n    Description = Label));\n\
    \  retain Fmtname '$ICDFMT'\n  Type 'C';\nrun;\n\ntitle \"添加 OTHER 类别\";\nproc\
    \ format cntlin=ControlOut;\nselect $SICDFMT;\nrun;\n\ndata disease;\n  input\
    \ ICD9 = $5. @@;\n  datalines;\n020 410 500 493\nntitle \"Listing of DISEASE\"\
    ;\nproc report data=disease headline;\ncolumns ICD9-Unformatted ICD9;\ndefine\
    \ ICD9 / \"格式化值\" width=11 format=$SICDFMT;\ndefine Unformatted / \"原始未格式化值\"\
    \ width=11;\nrun;\n```\n\n## 结论\n\n在两种情况下，从 SAS 数据集中创建格式非常方便。一种是你已经有一个包含代码和标签的\
    \ SAS 数据集（且相对较大）。另一种是你想使用格式进行表查找，且查找值存在于现有的 SAS 数据集中。在这两种情况下，控制数据集都会为你节省时间。\n\n"
