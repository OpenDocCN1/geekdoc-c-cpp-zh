    # Task: Combining summary information (a single mean) with detail data: Using
    a conditional SET statement


    # Keywords


    Grand mean


    Combining summary and detail data


    The remaining programs in this chapter show how to combine summary data with detail
    data. For this first example, you can add the mean Heart_Rate (Mean. HR) to each
    observation in the Blood_Pressure data set. There are several ways to accomplish
    this.


    The "classic" approach is to use a SET statement. This is a clever trick that
    I learned years ago at a SAS conference (in a talk by Neil Howard). By the way,
    back then SAS Global Forum was called SUGI (SAS Users Group International).


    First the program, then the explanation:


    # Program 3.8: Adding the mean heart to observation in your data set


    ```

    *Program to compare each person''s heart rate with the mean heart

    rate of all the observations;

    proc means data=Blood_Pressure noprint;

    var Heart_Rate;

    output=Summary(keep=Mean_HR) mean=Mean_HR;

    run;

    ```


    Cody, Ron. Cody''s Collection of Popular SAS® Programming Tasks and How to Tackle
    Them. Copyright © 2012, SAS Institute Inc.

    Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,
    visit support.sas.com/bookstore.'
- md: "\n# 30 Cody's Collection of Popular SAS Programming Tasks and How to Tackle\
    \ Them\n\nYou first use PROC MEANS to create the output data set. You use the\
    \ NOPRINT option since you do not want any printed output, just the summary data\
    \ set. The Summary data set contains one observation and one variable (Mean_HR).\
    \ The trick is how to add this single value to each observation in the original\
    \ Blood_Pressure data set. Many programmers think of using a MERGE statement.\
    \ The problem with this solution is that there is no BY variable. You can use\
    \ a conditional statement to accomplish your goal as shown in the following DATA\
    \ step:\n\nProgram 3.9: Demonstrating a conditional SET statement (to combine\
    \ data set with detail)\n\n```sas\ndata Percent_Of_Mean;\nset Blood_Pressure(keep=Heart_Rate\
    \ Subj);\nif _N = 1 then summary;\nPercent = round(100*(Heart_Rate / Mean_HR));\n\
    run;\n```\n\nIt's important to understand exactly what is happening here and why\
    \ you need to set the summary data set only once. In the first iteration of the\
    \ DATA step, you bring in the first observation from the Blood_Pressure data set\
    \ (with the two variables Heart_Rate and Subj). Since this is the first iteration\
    \ of the DATA step, _N is equal to 1, the IF statement evaluates as true, and\
    \ the SET summary statement executes, bringing in the one (and only) observation\
    \ from the Summary data set.\n\nIn the second iteration of the DATA step, you\
    \ first bring in the second observation from the Blood_Pressure data set. Since\
    \ _N is equal to 2, the IF statement is not true and the SET statement does not\
    \ execute. You may think this is a missing value. But SAS only sets being read\
    \ from raw data or values defined in an assignment statement are missing at the\
    \ top of the DATA step. The value of Mean_HR comes from a SAS data set—therefore\
    \ it is retained. The value is not initialized to missing because the SET statement\
    \ executes only once, the value of Mean_HR remains in the PDV and is added to\
    \ every observation in the Percent_Of_Mean data set.\n\nTo demonstrate a practical\
    \ reason why you might want to combine detail and summary data, the program computes\
    \ a variable called Percent that represents the person's heart rate as a percentage\
    \ of the average of all heart rates.\n\nHere are the five observations in the\
    \ Percent_Of_Mean data set:\n\n| Subj | Heart_Rate | Mean_HR | Percent |\n| :---\
    \ | :--- | :--- | :--- |\n| 1 | 71 | 69.3448 | 102 |\n| 2 | | 69.3448 | - |\n\
    | 3 | 78 | 69.3448 | 112 |\n| 4 | 60 | 69.3448 | 87 |\n| 5 | 79 | 69.3448 | 114\
    \ |\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and How\
    \ to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \nYou may ask why I need the conditional set statement? What happens if I just\
    \ write:\n\n```sas\nset Summary;\n```\n\nThe first observation is fine. However,\
    \ in the second iteration of the DATA step, SAS will try to read the second observation\
    \ in the Summary set—and there isn't one. This causes the DATA step to stop and\
    \ you have a data set with only one observation. In general, any data set reaches\
    \ the end of file in a DATA step, the DATA step stops.\n\n# Task: Combining summary\
    \ information (a single mean) with detail data: Using PROC SQL\n\n## Keywords\n\
    - Grand mean\n- Combining summary and detail data\n- PROC SQL\n- Cartesian product\n\
    \nA very simple and elegant solution to combining summary and detail data uses\
    \ PROC SQL and something called a Cartesian product. A Cartesian product is a\
    \ combination of every observation in data set with every observation in another\
    \ data set. For example, if one data set has 10 observations and the other has\
    \ 15 observations, the Cartesian product data set will have 10 times 15 or 150\
    \ observations. Since the data set has only one observation, the Cartesian product\
    \ data set adds this one observation to each observation in the detail data set.\
    \ Here is the code:\n\n# Program 3.10: Combining summary information with detail\
    \ data using PROC SQL\n\n```sas\nproc sql;\ncreate table Percent_of_Mean as\n\
    select Subj,Heart_Rate,Mean_HR\nfrom Blood_Pressure,Summary;\nquit;\n```\n\nIf\
    \ you are not familiar with PROC SQL, the CREATE TABLE statement is similar to\
    \ a DATA statement. You use a SELECT clause to tell PROC SQL what variables you\
    \ want to select and use a FROM clause to name the data sets it will use to create\
    \ the Cartesian product. A listing of the first five observations:\n\n| Subj |\
    \ Heart_Rate | Mean_HR |\n| :--- | :--- | :--- |\n| 1 | 71 | 69.3448 |\n| 2 |\
    \ | 69.3448 |\n| 3 | 78 | 69.3448 |\n| 4 | 60 | 69.3448 |\n| 5 | 79 | 69.3448\
    \ |\n\nYou see that the mean Heart_Rate has been added to each observation in\
    \ the Blood_Pressure data set.\n\n# Task: Combining summary information (a single\
    \ mean) with detail data: Using PROC SQL without PROC MEANS\n\n## Keywords\n-\
    \ Grand mean\n- Combining summary and detail data\n- PROC SQL\n- Cartesian product\n\
    - Mean function\n\nIf you are comfortable with PROC SQL, you can use it instead\
    \ of PROC MEANS to create the mean and add the mean to each observation in the\
    \ original data set all in one step. In this example, include a calculation for\
    \ Heart_Rate as a percent of the mean directly in the SELECT clause.\n\n# Program\
    \ 3.11: Combining summary information with detail data using PROC SQL without\
    \ PROC MEANS\n\n```sas\nproc sql;\ncreate table Percent_of_Mean as\nselect Subj,Heart_Rate,\
    \ round(100*Heart_Rate / mean(Heart_Rate)) as Percent\nfrom Blood_Pressure;\n\
    quit;\n```\n\nThe denominator for this calculation contains the MEAN function.\
    \ PROC SQL first needs to compute the mean Heart_Rate and then complete the calculation.\
    \ If you look in the SAS Log, you will notice the message: NOTE: The query requires\
    \ merging summary statistics back with original data. The resulting output is\
    \ the same as in the previous task. This is a very nice use of PROC SQL, producing\
    \ the desired data set in one step instead of running PROC MEANS and a DATA step.\n\
    \n# Task: Combining summary information (a single mean) with detail data: Using\
    \ a macro variable\n\n## Keywords\n- Grand mean\n- Combining summary and detail\
    \ data\n- Macro variable\n- CALL SYPUTX\n\nThe next program demonstrates another\
    \ method of combining detail and summary information. Once you have created the\
    \ Summary data set (using PROC MEANS), you can run a data NULL step to assign\
    \ the mean HR to a macro variable. You can use this macro variable in any subsequent\
    \ DATA or PROC step. Submit the following DATA step to create the macro variable:\n\
    \n# Program 3.12: Combining information with detail data using a macro variable\n\
    \n```sas\n*Solution using macro variable\ndata _null;\nset summary;\ncall symputx('Macro_Mean',\
    \ Mean_HR);\nrun;\n```\n\nThe two arguments to CALL SYPUTX are the name of a macro\
    \ variable and a DATA variable that contains the value. In this example, you want\
    \ to assign the value of Mean_HR to the macro variable Macro_Mean. An even elegant\
    \ solution was suggested to me by Mark Jordan, a veteran SAS instructor. By using\
    \ an INTO clause, you can create a macro variable directly with PROC SQL like\
    \ this:\n\n# Program 3.13: Using PROC SQL to create the macro variable\n\n```sas\n\
    proc sql noprint;\n  select mean(Heart_Rate)\ninto :Macro_Mean\nfrom Blood_Pressure;\n\
    quit;\n```\n\nTo demonstrate how you use a macro variable, the short DATA step\
    \ next completes the percent of mean used in the Blood_Pressure data set:\n\n\
    # Program 3.14: Demonstrating how to use a macro variable in a DATA step\n\n```sas\n\
    data Percent_Of_Mean;\nset Blood_Pressure(keep=Heart_Rate Subj);\n  Percent =\
    \ round(100*(Heart_Rate / &Macro_Mean));\nrun;\n```\n\nThe conditional SET statement\
    \ is, perhaps, the most classic method for combining a single observation with\
    \ each observation in a detail data set. However, any of the alternate methods\
    \ demonstrated here fine. Use the one you are most comfortable with.\n\n# Task:\
    \ Combining summary data with detail data—for each category of a BY variable\n\
    \n## Keywords\n- Combining summary and detail data\n- BY variables\n- Merge\n\n\
    When you compute means for each value of another variable (Gender, for example),\
    \ you can use a simple MERGE statement to combine the summary data with the detail\
    \ data because you now have a BY variable you can use. The next examples compare\
    \ the mean Heart_Rate for men and women and use these to compare each person's\
    \ heart rate as a percent of the mean for all subjects of the same gender.\n\n\
    # Program 3.15: Creating a summary data set using PROC MEANS with a CLASS statement\n\
    \n```sas\n*Program to compare each person's heart\nrate with the mean heart rate\
    \ for each\nvalue of Gender;\n\nproc means data=Blood_Pressure noprint nway;\n\
    \  class Gender;\n  var Heart_Rate;\n  output=By_Gender (keep=Gender Mean_HR)\
    \ mean=Mean_HR;\nrun;\n```\n"
  mdcn: "\n\n# Cody 收集的 30 个常用 SAS 编程任务及解决方案\n\n首先，你使用 `PROC MEANS` 创建输出数据集。你使用 `NOPRINT`\
    \ 选项，因为你不需要任何打印输出，只需要摘要数据集。摘要数据集（Summary data set）包含包含一个观测值和一个变量（`Mean_HR`）。技巧之处在于如何将这个唯一的值添加到原始\
    \ `Blood_Pressure` 数据集的每个观测值中。许多程序员会想尝试使用 `MERGE` 语句。这种解决方案的缺点是没有 `BY` 变量。你可以像下面的\
    \ `DATA` 步所示，使用条件语句来完成你的目标：\n\n程序 3.9：演示条件 `SET` 语句（将数据集与明细数据集合并）\n\n```sas\n\
