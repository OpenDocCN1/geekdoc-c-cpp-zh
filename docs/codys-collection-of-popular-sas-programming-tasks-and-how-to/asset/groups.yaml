    ;\nend;\nrun;\n\n%include \"c:\\tasks\\Combined.sas\";\n%mend concatenate;\n```\n\
    \n## Chapter 4: Combining and Updating SAS Data Sets\n\nThis macro takes the extra\
    \ step of converting all of the variable names to proper case, because if they\
    \ were not the same case in each data set, the MERGE would not work.\n\nLet's\
    \ test the macro using the two data sets Name2 and Name3:\n\n## Program 4.9: Testing\
    \ the Concatenate macro\n\n```sas\n*Testing the macro;\n%Concatenate(Dsn1=Name2,\
    \ Dsn2=name3, out=Combined)\n\ntitle \"Contents of COMBINED\";\nproc contents\
    \ data=combined;\nrun;\n```\n\nThe section of output from PROC CONTENTS shows\
    \ next demonstrates that the macro worked as desired. Name has a length of 18\
    \ and Gender has a length of 2.\n\n| Data Set Name | WORK.COMBINED | Observations\
    \ |\n| :--- | :--- | :--- |\n\n| Alphabetic List of Variables and Attributes |\
    \ | |\n| Variable | Type | Len |\n| :--- | :--- | :--- |\n| 3 Age | Num | 8 |\n\
    | 1 Gender | Char | 2 |\n| 4 Height | Num | 8 |\n| 2 Name | Char | 18 |\n| 5 Weight\
    \ | Num | 8 |\n\nYou may want to place a copy of this macro in your macro library\
    \ for solving this common task.\n\n## Task: Updating a SAS data set using a transaction\
    \ data set\n\n### Keywords\n- UPDATE\n- Transaction data set\n\nFor this example,\
    \ you have a master file (Hardware) that contains item numbers (Item_Number) and\
    \ prices (Price). A listing of this data set is shown next:\n\n## 48 Cody's Collection\
    \ of Popular SAS Programming Tasks and How to Tackle Them\n\n| Item_Number | Description\
    \ | Price |\n| :--- | :--- | :--- |\n| 1238 | Cross Cut Saw 18 inch | $18.75 |\n\
    | 1122 | Cross Cut Saw 24 inch | $23.95 |\n| 2001 | Nails, 10 penny | $5.57 |\n\
    | 2002 | Nails, 8 penny | $4.59 |\n| 3003 | Pliers, Needle nose | $12.98 |\n|\
    \ 3035 | Pliers, cutting | $15.99 |\n| 4005 | Hammer, 6 pound | $12.98 |\n| 4006\
    \ | Hammer, 8 pound | $15.98 |\n| 4007 | Hammer, sledge | $19.98 |\n\nYou want\
    \ to change the prices for item numbers 2002 and 4006. You start by creating a\
    \ data set with the items and the new prices.\n\n## Program 4.10: Updating a master\
    \ file with a transaction file\n\n```sas\n*Updating values in a SAS data set using\
    \ a transaction data set;\nData New_Prices;\n  input Item_Number : $4;\ndatalines;\n\
    \  2002 5.98\n  4006 16.98\n;\n```\n\nHere is a listing of the New_Prices data\
    \ set:\n\n| Item Number | Price |\n| :--- | :--- |\n| 2002 | 5.98 |\n| 4006 |\
    \ 16.98 |\n\nThe next step is to sort the Hardware and New_Prices data set, as\
    \ follows:\n\n```sas\nproc sort data=Hardware;\n  by Item_Number;\nrun;\n\nproc\
    \ sort data=New_Prices;\n  by Item_Number;\nrun;\n```\n\nCody, Ron. Cody's Collection\
    \ of SAS® Programming Tasks and How to Tackle Them. Copyright © 2012, SAS Institute\
    \ Inc. Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/bookstore.\n\n## Chapter 4: Combining and Updating SAS\
    \ Data Sets 49\n\nYou can either update the original data set or create a new\
    \ one. It is a good idea to use a different name for the new, updated data. Before\
    \ showing you the next section of the program, let's take a moment to review the\
    \ UPDATE statement. Unlike a MERGE, missing values in the right-most data set\
    \ (New_Prices in example) do not replace values in the left-most data set (Hardware\
    \ in example). Also, unlike MERGE, you must follow an UPDATE statement with a\
    \ BY statement. The remaining portion of the program, demonstrating the UPDATE\
    \ statement, follows:\n\n```sas\nHardware_June2012;\nupdate New_Prices;\nby Item_Number;\n\
    run;\n```\n\nThe following listing shows the prices for the two items (2002 and\
    \ 4006) have been updated:\n\n## Listing of data set Hardware_June2012\n\n| Item_Number\
    \ | Description | Price |\n| :--- | :--- | :--- |\n| 1122 | Cross Cut Saw 24 inch\
    \ | $23.95 |\n| 1238 | Cross Cut Saw 18 inch | $18.75 |\n| 2001 | Nails, 10 penny\
    \ | $5.57 |\n| 2002 | Nails, 8 penny | $5.98 |\n| 3003 | Pliers, Needle nose |\
    \ $12.98 |\n| 3035 | Pliers, cutting | $15.99 |\n| 4005 | Hammer, 6 pound | $12.98\
    \ |\n| 4006 | Hammer, 8 pound | $16.98 |\n| 4007 | Hammer, sledge | $19.98 |\n\
    \nCody, Ron. Cody's Collection of Popular SAS Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute, Inc., Cary, North Carolina, USA. ALL\
    \ RIGHTS RESERVE. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \n## Task: Using a MODIFY statement to update a master file from a transaction\
    \ file\n\n### Keywords\n- Modify\n- Transaction file\n\nIf you prefer to update\
    \ your original SAS data set with a transaction file, you can use a MODIFY statement.\
    \ Unlike UPDATE, this does not create a new data set but modifies the original\
    \ data set. Although you do not have to sort your master file and transaction\
    \ file when using a MODIFY statement followed by a BY statement, doing so will\
    \ improve efficiency. The following short program shows how you can update a master\
    \ file from a transaction file using MODIFY:\n\n## Program 4.11: Using a MODIFY\
    \ statement to update a master file from a transaction file\n\n```sas\ndata Hardware;\n\
    modify New_Prices;\nrun;\n```\n\nAfter you run this program, the SAS data set\
    \ Hardware will be identical to the Hardware_June2012 data set created in the\
    \ previous task.\n\n## Task: Updating several variables using a transaction file\
    \ created with an INPUT method named input\n\n### Keywords\n- Data cleaning\n\
    - Updating\n- Named input\n\nIf you need to change the values of several variables,\
    \ creating the transaction file can become a problem. For example, suppose you\
    \ want to change the values for Score, Weight, Heart_Rate, DOB, and Party for\
    \ several subjects in the Demographic data set, which follows:\n\n## Chapter 4:\
    \ Combining and Updating SAS Data Sets 51\n\n| Subj | Score | Weight | Heart_Rate\
    \ | DOB | Gender | Party |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | 1 | 70 | 999 | 76 | 04NOV1955 | Male | NA |\n| 2 | 26 | 160 | 62 | 08APR1955\
    \ | NA | NA |\n| 3 | 71 | 195 | 71 | 27JUL1955 | male | na |\n| 4 | 40 | 132 |\
    \ 74 | 08JAN1955 | Male | Republican |\n| 5 | 999 | 181 | 62 | 15AUG1951 | Female\
    \ | Democrat |\n| 6 | 62 | 71 | 52 | 24JAN1950 | Male | democrat |\n| 7 | 24 |\
    \ 136 | 72 | 26NOV1950 | Female | democrat |\n| 8 | 5 | 174 | 71 | 08NOV1950 |\
    \ Female | democrat |\n| 9 | 5 | 172 | 47 | 28DEC1951 | Male | Democrat |\n| 10\
    \ | 94 | 173 | 999 | 06MAY1953 | Male | republican |\n| 11 | 99 | 170 | 63 | 27FEB1950\
    \ | na | NA |\n| 12 | 10 | 133 | 63 | 18MAR1954 | Male | democrat |\n| 13 | 6\
    \ | 131 | 60 | 26MAR1951 | Female | republican |\n| 14 | 999 | 140 | 79 | 01OCT1950\
    \ | NA | na |\n| 15 | 999 | 124 | 999 | 12OCT1950 | NA | na |\n| 16 | 44 | 194\
    \ | 72 | 31DEC1952 | Female | republican |\n| 17 | 62 | 196 | 68 | 09MAR1951 |\
    \ Female | democrat |\n| 18 | 57 | 133 | 72 | 15SEP1951 | Female | Democrat |\n\
    | 19 | 45 | 137 | 86 | 16NOV1951 | NA | Republican |\n| 20 | 20 | 170 | 80 | 01OCT1951\
    \ | | Republican |\n\nUsing any of the INPUT methods, such as list input, column\
    \ input, or formatted input, is convenient. If you only need to enter non-missing\
    \ values for a few variables, you can use an input method called *input*. Here's\
    \ how it works.\n\nYou use an FORMAT (or LENGTH) statement to define the length\
    \ for all of your character variables and an appropriate date format for any date\
    \ values you have. Next, you enter each of the variables followed by an equal\
    \ sign on the INPUT statement. Finally, when you enter data, you use the form:\
    \ `Variable_name = Value`.\n"
