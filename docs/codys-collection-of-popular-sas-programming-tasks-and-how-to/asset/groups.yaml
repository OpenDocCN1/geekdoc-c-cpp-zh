    \ | 181 | 62 | 15AUG1955 | Female | Democrat |\n\n## 任务：将所有字符值转换为大写、小写或首字母大写\n\
    \n### 关键字\n\n- Uppercase\n- Lowercase\n- Proper case\n- character\n\n与之前的程序类似，你可以使用所有字符变量数组将它们全部转换为大写、小写或首字母大写。可以看到，此程序将数据集中的所有字符值转换为大写。另外两个将字符值转换为小写或大小大小写的函数分别是\
