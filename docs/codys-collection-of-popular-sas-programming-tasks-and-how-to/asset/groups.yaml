    \ | 55.0 | -7.0 |\n| 2011 | 1234 | 61.0 | 23.0 |\n| 2012 | 1234 | 72.0 | 12.0\
    \ |\n| 2004 | 7477 | 18.0 | -3.0 |\n\n使用多维临时数组是执行表查找的一种简单优雅的方法。\n\n## 结论\n\n格式（Formats）和临时数组是执行表查找的高效方法。格式（Formats）和输入格式（Informats）似乎是\
    \ SAS 程序员使用的最流行的方法之一。然而，下次当你遇到表查找问题时，尝试使用临时数组，你可能会成为这项技术的粉丝。\n\nCody, Ron. Cody's\
    \ Collection of Popular SAS® Programming Tasks and How to Tackle Them. Copyright\
    \ © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED.\
    \ 更多 SAS 资源请访问 support.sas.com/bookstore.\n\n## 第7 章：重构（转置）\nSAS 数据集\n\n引言 ...................................................................................................................................................75\n\
    \n- 任务：将每个受主体一个观测值的数据集转换为每个受主体多个观测值的数据集（使用 DATA 步）。......76\n\n- 任务：将每个受主体一个观测值的数据集转换为每个受主体多个观测值的数据集（使用\
    \ PROC TRANSPOSE）。...............................77\n\n- 任务：将每个受主体多个观测值的数据集转换为每个受主体一个观测值的数据集（使用\
    \ DATA 步）。.........................................79\n\n- 任务：将每个受主体多个观测值的数据集转换为每个受主体一个观测值的数据集（使用\
    \ PROC TRANSPOSE） ..........80\n\n结论 ................................................................................................................................................81\n\
    \n## 引言\n\n在编程生涯的某个时刻，你将需要重构数据集。例如，你可能有一个这样的的数据集：\n\n数据集 `OnePer` 的列出\n\n| 主体\
    \ (Subj) | Dx1 | Dx2 | Dx3 |\n|---|---|---|---|\n| 001 | 450 | 430 | 410 |\n|\
    \ 002 | 250 | 240 | |\n| 003 | 410 | 250 | |\n| 004 | 240 | | |\n\n你想创建一个这样的数据集：\n\
    \n数据集 `ManyPer` 的列出\n\n| 主体 (Subj) | 访问 (Visit) | 诊断 (Diagnosis) |\n|---|---|---|\n\
    | 001 | 1 | 450 |\n| 001 | 2 | 430 |\n| 001 | 3 | 410 |\n| 002 | 1 | 250 |\n|\
    \ 002 | 2 | 240 |\n| 003 | 1 | 410 |\n| 003 | 2 | 250 |\n| 003 | 3 | 500 |\n|\
    \ 004 | 1 | 240 |\n\n你可能也想反转过程，从每个受主体多个观测值的数据集转换为每个受主体一个观测值的数据集。在本章中，你将看到如何使用\
    \ DATA 步或 PROC TRANSPOSE 完成。\n\n### 任务：将每个受主体一个观测值的数据集转换为每个受主体多个观测值的数据集（使用 DATA\
    \ 步）\n\n### 关键字\n\n- 转置 (Transpose)\n- 重构 (Restructure)\n- 每个受主体多个观测值 (Multiple\
    \ observations per subject)\n\n此任务任务是从每个受主体一个观测值的数据集开始，创建一个每个受主体多个观测值的数据集。数据 步方法：\n\
    \n```sas\ndata ManyPer;\nset OnePer;\narray Dx[3];\ndo Visit = 1 to 3;\nif not\
    \ missing(Dx[Visit]) then do\nDiagnosis = Dx[Visit];\noutput;\nend;\nrun;\n```\n\
    \n### 任务：将每个受主体一个观测值的数据集转换为每个受主体多个观测值的数据集（使用 PROC TRANSPOSE）\n\n### 关键字\n\n- 转置\
    \ (Transpose)\n- 重构 (Restructure)\n- 每个受主体多个观测值 (Multiple observations per subject)\n\
    \n你可以通过 PROC TRANSPOSE 实现与上任务相同的结果。然而，你将对其进行调整，以使新数据集与数据 步的结果一致。\n\n```sas\n*PROC\
    \ TRANSPOSE 解决方案\n*第一次尝试;\n  proc transpose data=oneper\n      out=manyper;\n\n\
    \    by Subj;\n    var Dx1-Dx3;\n  run;\n```\n\n生成的数据如下：\n\n| 主体 (Subj) | _NAME_\
