    # Conclusion


    In this chapter, you saw how to create summary data sets using PROC MEANS and
    various ways to combine this summary data with the detail data from your original
    data set. With most aspects of SAS programming, there are several different ways
    to solve a problem. I expect the methods you choose, from the ones discussed in
    this chapter, are the ones that you are most comfortable with. If you are dealing
    with very large data sets, you may decide to try several solutions and choose
    the most efficient one.


