    # Introduction


    This chapter contains programs to perform character-to-numeric conversion, one
    of the common tasks you will face as a SAS programmer. You will see a sample program
    as well as a useful macro that accomplishes this goal.


    Another task that you will probably face is converting a specific numeric value
    such as 999 or a specific text value such as ''NA'' to a SAS missing value.


    In this chapter, you will also see how to convert every character variable to
    a specific case, such as uppercase.'
  - "[PAGE 23]\n\n# Cody's Collection of Popular SAS Programming Tasks and How to\
    \ Tackle Them\n\nThe last task in this chapter demonstrates how to read data values\
    \ that contain units, such as 100Lbs. or 50Kgs., and create a numeric variable\
    \ with all of the values using the same units.\n\n# Task: Converting character\
    \ values to numeric values\n\n+   Keywords\nCharacter-to-numeric conversion\n\
    Swap and Drop\n\nHow many times have you been given a SAS data set with variables\
    \ such as Height or Weight, instead of being numeric variables? The following\
    \ example describes how to convert these character variables to numeric variables,\
    \ maintaining the original variable names.\n\nFor this example, you start out\
    \ with a SAS data set called Char_values. Here is a listing:\n\n| Age | Weight\
    \ | Gender | DOB |\n|---|---|---|--|\\| 23 | 150 | M | 10/21/1983 |\n| 67 | 220\
    \ | M | 09/02/2001 |\n| 77 | 101 | F | 05/06/1977 |\n\nIf you run PROC CONTENTS\
    \ on this data set, you will see that Age and Weight are character variables.\
    \ The following program performs the conversion:\n\n# Program 1.1: Converting\
    \ character values to numeric values\n\n```\n*Converting character values to numeric;\n\
    data New M;\n  set Char_Values(rename=(Age = C_Age\nWeight = C_Weight));\n  Age\
    \ = input (C_Age,best12);\n  Weight = input (C_Weight,best12);\n  drop C_;\nrun;\n\
    ```\n\nThe \"trick\" here is to rename the variables as they are read from the\
    \ input data set. This allows you to use the original variable names for the resulting\
    \ numeric variables. The character-to-numeric conversion is performed using the\
    \ INPUT function. You don't have to worry about the FORMAT used in the INPUT function\
    \ represents more digits than you need—unlike an INPUT statement, you can never\
    \ read past the end of a character value when using the INPUT function."
