    # # Conclusion


    At some time in your programming career, you will need to accomplish most of the
    tasks described in this chapter. Keep in mind that PROC APPEND can be much more
    efficient than using a SET statement. When you want to concatenate two data sets
    that contain character variables of different length, try out the Concatenate
    macro. Finally, consider using named input when you want to create a transaction
    file that only contains a few non-missing values out of a large number of variables.'
