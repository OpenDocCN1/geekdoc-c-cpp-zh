- md: "\n# 120 Cody's Collection of Popular SAS Programming Tasks and How to Tackle\
    \ Them\n\nHere is the program, followed by an explanation:\n\n## Program 12.5:\
    \ Determining the number of observations in a SAS data set using SAS functions\n\
    \n```sas\n*Using SAS functions;\ndata_null;\n  Exist = exist(\"Stocks\");\n  if\
    \ Exist then do;\n    Num_obs = attrn(Dsid,\"Nobs\");\n    *Nobs is the number\
    \ of logical observations,\n      observations not marked for deleting;\n    put\
    \ \"Number of observations in STOCK is: \" Num_obs;\n  end;\n  else put \"Data\
    \ set STOCK does not exist\";\n  RC = close(Dsid);\nrun;\n```\n\nThe EXIST function\
    \ returns a value of true if the data set exists, and a value of false if it does\
    \ not exist. Next, open the data set using the OPEN function. This function returns\
    \ a data ID that you can use with other I/O functions. Enter the data set ID as\
    \ the first argument of the ATTR function, and any one of several character values\
    \ for the second argument of this function. NLOBS gives you the number of logical\
    \ observations (observations not marked for deletion). Another useful value for\
    \ this second argument is NVAR, which returns the number of variables in your\
    \ data set.\n\nThe line in the SAS Log produced by the PUT statement in this program\
    \ is:\n\nNumber of observations in STOCK is: 42\n\nIt is recommended that you\
    \ close the data set (using the CLOSE function) after you are finished.\n\n##\
    \ Task: Counting the number of a specific response in a list of variables\n\n\
    - Keywords\n- CATS function\n- COUNTN function\n\nCounting specific values in\
    \ a list of variables\n\nFor this example, you have a data set (Questionnaire)\
    \ with five variables, Q1–Q5. Each variable is a ‘Y’ or ‘N’ (yes or no) and these\
    \ values may be in uppercase or lowercase. The task is to count the number of\
    \ Y’s and N’s. This first program demonstrates the “old fashioned” way to accomplish\
    \ this goal. Here is the program:\n\nCody, Ron. Cody’s Collection of Popular SAS®\
    \ Programming Tasks and How to Tackle Them. Copyright © 2012, SAS Institute Inc.,\
    \ Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional SAS resources,\
    \ visit support.sas.com/bookstore.\n\n## Chapter 12: Miscellaneous Tasks 121\n\
    \n## Program 12.6: Counting the number of Y's and N's in a list of SAS variables\
    \ (using arrays and loops)\n\n```sas\n*Counting the number of a specific response\
    \ in a list of variables;\n*Old Fashioned; solution;\n\ndata Count_YN;\n  set\
    \ Questionnaire;\n  array Q[5];\n  Num_Y = 0;\n  Num_N = 0;\n  do i = 1 to 5;\n\
    \    if upcase(Q[i]) eq 'Y' then Num_Y = Num_Y + 1;\n    else if upcase(Q[i])\
    \ eq 'N' then Num_N = Num_N + 1;\n  end;\n  drop i;\nrun;\n```\n\nYou first create\
    \ an array of the five variables. Next, you initialize the two variables that\
    \ will hold the counts, Num_Y and Num_N, to zero. Finally, you use a DO loop to\
    \ check the value of each variable and check if it is a 'Y' or 'N'. The UPPERCASE\
    \ function is needed because some of the may be in lowercase.\n\nA listing of\
    \ the Q_YN data set is shown next:\n\n| Subj | Q1 | Q2 | Q3 | Q4 | Q5 | Num_Y\
    \ | Num_N |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| 1 |\
    \ y | n | n | y | | 3 | 2 |\n| 2 | N | n | Y | n | | 1 | 3 |\n| 4 | y | Y | n\
    \ | Y | | 3 | 2 |\n| 5 | y | Y | n | y | | 5 | 0 |\n\nA more elegant solution\
    \ to this task is to use two SAS functions, CATS and COUNTC. The CATS function\
    \ can take each of the arguments, stripping leading and trailing blanks, and concatenates\
    \ the strings. The COUNTC function counts the number of times a particular character\
    \ (or characters) appears in a string. Together, these functions make for a very\
    \ compact and elegant solution, as shown here:\n\n## Program 12.7: Using the CATS\
    \ and COUNTC functions to count responses\n\n```sas\n*Solution using the Count\
    \ and Cats functions;\ndata Count_YN;\n  set Questionnaire;\n  Num_Y = countc(cats\
    \ of Q1-Q5),'Y','i');\n  Num_N = countc(cats of Q1-Q5),'N','i');\nrun;\n```\n\n\
    Cody, Ron, Cody's Code of Popular SAS® Programming Tasks and How to Tackle Them.\
    \ Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\n\
    Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\n\
    The first argument of the COUNTC function is the string you want to query, the\
    \ second argument specifies one or more characters that you want to count, and\
    \ the third argument is a modifier. The 'I' modifier means, ignore case. Running\
    \ this program produces the same output as the longer program described previously.\n\
    \n## Task: Computing a moving average\n\n## Keywords\n\n- Moving average\n- LAG\
    \ function\n\nA moving average is used to see trends in data that might have large\
    \ fluctuations. In this example, you want to average three days to see a trend\
    \ that may be hard to see because of day-to-day fluctuations. The first average\
    \ is of days 3, the second of days 4, and so forth. Since you need to average\
    \ three observations, you can use the LAG function to obtain:\n\n## Program 12.8:\
    \ Computing a moving average\n\n```sas\n* To compute moving average;\nset Stocks;\n\
    Last = lag(Price);\nTwoback = lag(Price);\nif _n >= 3 then Moving = mean(Last,\
    \ Twoback);\n```\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks\
    \ and How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \nCody, Ron. Cody's Collection of Popular SAS Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\n\
    To help see the difference between the individual points and the moving average,\
    \ you can use PROCPLOT as shown next:\n\n## Plots of Stock Price and Day Moving\
    \ Average\n\n![](img/3ac68221c9b51b0d4f92_144.png)\n\nAs you can see, the dashed\
    \ line, representing the moving average, does not fluctuate as much as the raw\
    \ data.\n\nCody, Ron. Cody's Collection of Popular SAS® Programming Tasks and\
    \ How to Tackle Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina,\
    \ USA. ALL RIGHTS RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\
    \n124 Cody's Collection of Popular SAS Programming Tasks and How to Tackle Them\n\
    \n## Task: Presenting a macro to compute a moving average\n\n## Keywords\n\nMoving\
    \ average\n\nIf you frequently need to compute moving averages or if you want\
    \ the average of a large number of data points, you may wish to use the macro\
    \ presented here. You call the macro (Moving_Ave) with the name of your input\
    \ data set, the name of the new data set that will include all variables from\
    \ the input data set along with the moving average, the name of the variable to\
    \ be assigned, and how many observations to include in each average.\n\nFollowing\
    \ the macro is a brief explanation of how it works:\n\n## Program 12.9: Presenting\
    \ a macro to compute a moving average\n\n```sas\n*Presenting a macro to compute\
    \ a moving average;\n*macro Moving_ave(In_ds=, /*Input data set name */\nOut_ds=,\
    \ /*Output data set name */\nVar=, /*Variable to compute\nthe average */ /*Variable\
    \ for moving average */\nMoving=, /*Number of observations on which\nto compute\
    \ the average */);\ndata &Out_ds;\nset &In_ds;\nn=1;\nvar &Var;\ndo i = 1 %to\
    \ &n - 1;\nlet Num = %eval(&i + 1);\n&xNum = lag(Num)(&&Var);\nend;\n\n****if\
    \ the observation number is greater than or equal to the\nnumber of values needed\
    \ for the moving average, output;\nif _n >= &n then do;\n&Moving = mean(_x1 -\
    \ _xn);\noutput;\nend;\ndrop _x_;\nrun;\n%end Moving_ave;\n```\n\nYou start with\
    \ a DATA step that brings in each observation from the input data set (&In_ds).\
    \ You need to assign names for the original variable and each of 'it' lag values.\
    \ You use the variable _x1 for the non-lagged value of your variable, _x2 for\
    \ the LAG1 value, _x3 for the LAG2 value.\n"
  mdcn: "\n\n# 120 Cody 常用 SAS 编程任务合集及解决方案\n\n以下是程序，随后附有相关解释：\n\n## 程序 12.5：使用 SAS\
    \ 函数确定 SAS 数据集中的观测值数量\n\n```sas\n*Using SAS functions;\ndata_null;\n  Exist =\
    \ exist(\"Stocks\");\n  if Exist then do;\n    Num_obs = attrn(Dsid,\"Nobs\");\n\
    \    *Nobs 是逻辑观测值的数量，\n      未标记为删除的观测值；\n    put \"Number of observations in\
    \ STOCK is: \" Num_obs;\n  end;\n  else put \"Data set STOCK does not exist\"\
    ;\n  RC = close(Dsid);\nrun;\n```\n\n当数据集存在时，EXIST 函数返回真值，不存在则返回假值。接下来，使用 `OPEN`\
    \ 函数打开数据集。该函数返回一个数据 ID，你可以将其与其他 I/O 函数一起使用。将数据集 ID 作为 `ATTR` 函数的第一个参数，并将该函数的多个字符值中的任何一个作为第二个参数。NLOBS\
    \ 给你逻辑观测值的数量（未标记为删除的观测值）。该第二个参数的另一个有用值是 NVAR，它返回数据集中变量的数量。\n\n此程序中由 `PUT` 语句在\
    \ SAS 日志中产生的行如下：\n\nNumber of observations in STOCK is: 42\n\n建议在完成后关闭该数据集（使用\
    \ `CLOSE` 函数）。\n\n## 任务：在变量列表中统计特定响应的数量\n\n- 关键词\n- CATS 函数\n- COUNTN 函数\n\n在变量列表中统计特定值\n\
    \n在示例示例中，你有一个包含五个变量（Q1–Q5）的数据集（Questionnaire）。每个变量为‘Y’或‘N’（是或否），且这些值可能是大写的，也可能是小写的。任务是统计\
    \ Y 和 N 的数量。此第一个程序演示了实现这一目标的“旧式”方法。以下是该程序：\n\nCody, Ron. Cody’s Collection of\
    \ Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012, SAS\
    \ Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. 更多 SAS 资源，请访问\
    \ support.sas.com/bookstore.\n\n## 第 12 章：杂项任务 121\n\n## 程序 12.6：统计 SAS 变量列表中\
    \ Y 和 N 的数量（使用数组和循环）\n\n```sas\n*Counting the number of a specific response in\
    \ a list of variables;\n*Old Fashioned; solution;\n\ndata Count_YN;\n  set Questionnaire;\n\
    \  array Q[5];\n  Num_Y = 0;\n  Num_N = 0;\n  do i = 1 to 5;\n    if upcase(Q[i])\
    \ eq 'Y' then Num_Y = Num_Y + 1;\n    else if upcase(Q[i]) eq 'N' then Num_N =\
    \ Num_N + 1;\n  end;\n  drop i;\nrun;\n```\n\n你首先创建一个包含五个变量的数组。接下来，你将存储计数的两个变量\
    \ Num_Y 和 Num_N 初始化为零。最后，你使用 `DO` 循环检查每个变量的值，并检查它是否为 'Y' 或 'N'。需要使用 `UPPERCASE`\
    \ 函数，因为某些值可能是小写的。\n\n下面是 Q_YN 数据集的列出：\n\n| Subj | Q1 | Q2 | Q3 | Q4 | Q5 | Num_Y\
