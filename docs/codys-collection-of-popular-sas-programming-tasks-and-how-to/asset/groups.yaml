    # Task: Grouping values using user-defined formats


    # Keywords


    Grouping data


    Formats


    PUT function


    You can use a format along with a PUT function to accomplish the same goal as
    the previous example. This technique is easy to program—it is also an efficient
    method for grouping values.


    The first step is to define a format with your desired ranges. Then, you can use
    a PUT function to create the new variable representing your groups. This example
    places heart rates into the same groups as the previous example:'
  - "[PAGE 36]\n\n# Program 2.2: Using formats to group variables\n\n```\n*Grouping\
    \ values using formats;\nproc format;\nvalue HRGrp 0 - <60 = '<40'\n      40 -\
    \ <60 = '40-<60'\n      60 - <80 = '60-<80'\n      80 - <100 = '80-<100'\n   \
    \   100 - high = '100+';\n\nrun;\ndata Grouped;\n  set Blood_Pressure(keep=Sub\
    \ Heart_Rate);\n  HR_Grp = put(Heart_Rate,HRGrp.);\nrun;\n```\n\nYou name the\
    \ format HRGrp and use the same ranges as used previously. Next, you read in values\
    \ of Heart_Rate and use a PUT function to create HR_Group. You do not need to\
    \ use a LENGTH statement because SAS uses the longest formatted for the length\
    \ of the new variable. Missing values are not a problem either. If Heart_Rate\
    \ is missing, HR_Group will also be missing.(Because it does not match any of\
    \ the five ranges you have defined in the format, it remains a missing value—a\
    \ character missing value.)\n\nValues for HR_Group are identical to the values\
    \ in the previous program.\n\n# Task: Creating groups using PROC RANK\n\n# Keywords\n\
    \n+   Grouping data\n\n+   PROC RANK\n\n+   Deciles\n\nAnother way to group data\
    \ is to put your values into a number of equal groups. This is especially useful\
    \ for creating statistical models with variables that have highly skewed distributions.\
    \ For example, you may want to include income in a predictive model. Since income\
    \ is usually skewed (that is, there are some values that are much larger than\
    \ the average), you may decide to create deciles (10 equal groups) of income.\n\
    \nYou can use PROC RANK to convert a continuous variable into any number of equal\
    \ groups. Before you get started with the task at hand, take a moment to review\
    \ PROC RANK."
  - '[PAGE 37]


    # 16 Cody''s Collection of Popular SAS Programming Tasks and How to Tackle Them


    The syntax is:


    ```

    PROC RANK DATA=data-set-name OUT=output-data-set-name

    GROUPS=n;

    VAR list of variables;

    RANKS list of variables holding the rank values;

    run;

    ```


    Here is a simple example that demonstrates how PROC RANK works when you include
    the GROUPS option. Data set Raw_Data contains three variables: Subj, X, and Y,
    and four observations. Here is a listing:


    | Subj | X | Y |

    | 001 | 3 | 10 |

    | 002 | 7 | 20 |

    | 003 | 2 | 30 |

    | 004 | 4 | 40 |


    First, run PROC RANK without the GROUPS= option, like this:


    # Program 2.3: Demonstrating PROC RANK


    ```

    proc rank data=Raw_Data out=Rank_Data;

    var X;

    ranks Rank_X;

    run;

    ```


    You want to create a new data set (Rank.Data) that contains a new variable that
    you decided to call Rank_X. Values of this variable are the ranks of X. If you
    supply a list of variables on the VAR statement, be sure to include another list
    that contains the same number of variables on the RANKS statement. Each variable
    you list on the RANKS statement will be the rank of the corresponding variable
    on the VAR statement.'
  - "[PAGE 38]\n\nTo create ranks, PROC RANK sorts the values of the variables you\
    \ specify on the VAR statement and gives the smallest value rank of 1, the next\
    \ smallest value a rank of 2, and so forth. Here is a listing of data set Rank_Data:\n\
    \n| Subj | X | Y | Rank_X |\n|---|---|---||}{\n| 001 | 3 | 10 | 2 |\n| 002 | 7\
    \ | 20 | 4 |\n| 003 | 2 | 30 | 1 |\n| 004 | 4 | 40 | 3 |\n\nThere are several\
    \ things to notice about this output data set. First, Rank_X represents the ranks\
    \ of variable X. By the original, if you leave out the RANKS statement, PROC RANK\
    \ will replace the original variables (X in this example) with the ranks of these\
    \ variables. I strongly recommend that whenever you use PROC RANK, both VAR and\
    \ RANKS statements.\n\nNext, notice variable Y is in the output data set even\
    \ if Y was not listed on the VAR statement. This is a feature of PROC RANK: Every\
    \ variable in the input data set is included in the output data set. Therefore,\
    \ if you don't want all the variables in the input data set to appear in the output\
    \ data set, leave a KEEP= option on the input data set, listing the variables\
    \ you want.\n\nTo divide two extra sets use the option GROUPPS=2 like this:\n\n\
    # Proc 2.4: Demonstrating the GROUPPS=option of PROC RANK\n\n```\nproc rank_data=Raw_Data\
    \ (keep=Subj X) out=Rank_Data groups=2;\n  var X;\n  ranks Rank X;\nrun;\n```\n\
    \nYou include a KEEP= data set option so that the output data set will only contain\
    \ the variables Subj, X, and Rank_X.\n\nHere is the result:\n\n| Subj | X | Rank_X\
    \ |\n|---|---|{}|\n| 001 | 3 | 0 |\n| 002 | 7 | 0 |\n| 003 | 2 | 0 |\n| 004 |\
    \ 4 | 1 |"
- md: "\n## 18 Cody's Collection of Popular SAS Programming Tasks and How to Tackle\
    \ Them\n\nRank_X now groups rather than ranks. When you use the GROUPS=n option,\
    \ PROC RANK numbers the groups starting with zero (why? I have no idea!). If you\
    \ use GROUPS=10, you will have groups going from zero to nine.\n\nNow that you\
    \ see PROC RANK works, you can use it with the Blood_Pressure data set to create\
    \ quintiles of heart rate, like this:\n\n## Program 2.5: Using PROC RANK to create\
    \ quintiles of Heart_Rate\n\n```\n*Grouping using PROC RANK;\nproc rank data=Blood_Pressure(Keep=Subj\
    \ Heart_Rate)\n  out=Grouped groups=5;\n  var Heart_Rate;\n  ranks HR_Group;\n\
    run;\n```\n\nHere is a listing of the first 12 observations in data set Grouped:\n\
    \n| Sub | Heart_Rate | HR_Group |\n|---|---|---|\n| 1 | 71 | 2 |\n| 2 | | - |\n\
    | 3 | 78 | 3 |\n| 4 | 60 | 1 |\n| 5 | 79 | 3 |\n| 6 | 96 | 4 |\n| 7 | 51 | 1 |\n\
    | 8 | | - |\n| 9 | 54 | 1 |\n| 10 | 65 | 1 |\n| 11 | 55 | 1 |\n| 12 | 48 | 0 |\n\
    \nRemember, the group numbers start from zero. In this listing you have five heart\
    \ rate groups with values from 0 to 4.\n\nPROC RANK with the GROUPS= option is\
    \ a very easy way to divide any variable into groups.\n\nCody, Ron. Cody's Collection\
    \ of Popular SAS® Programming Tasks and How to Tackle Them. Copyright © 2012,\
    \ SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS RESERVED. For additional\
    \ SAS resources, visit support.sas.com/bookstore.\n\n## Conclusion\n\nYou can\
    \ use a variety of methods to create variables that represent groups of continuous\
    \ variables.\nAlthough IF-THEN-ELSE statements in a DATA step are the most common\
    \ method for grouping values, keep in mind that user-written formats along with\
