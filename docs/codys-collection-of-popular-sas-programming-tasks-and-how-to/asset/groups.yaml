    # 任务：合并两个 SAS 数据——使用 PROC APPEND


    # 关键词


    - 合并数据集

    - PROC APPEND


    程序 4.1 要求 SAS 读取 Name1 以及 Name2 的所有观测值。如果第一个数据集 Name1（示例中）很大，这将消耗大量的计算资源。另一种方法是使用
    `PROC APPEND` 将 Name2 的观测值添加到数据集末尾。`PROC APPEND` 直接跳转到 Name1 的末尾并开始添加 Name2 的观测值。在这种情况下，两个数据集具有相同的变量和属性，这是一个非常高效的解决方案。


    由于 `PROC APPEND` 将新数据添加到第一个集合（并更改了它），你无法撤销该过程。你可能会在运行 `PROC APPEND` 之前考虑为第一个数据集备份。


