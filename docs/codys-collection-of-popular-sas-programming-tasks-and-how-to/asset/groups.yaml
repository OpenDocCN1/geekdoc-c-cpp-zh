    ## Chapter 3: Summarizing Data\n\n- Introduction .......................................................................................................................21\n\
    - Task: Using PROC MEANS to create a data set containing summary ...........................22\
    \ information....................................................................................................................................\n\
    - Task: Computing the mean of a variable broken down by values of another ................23\
    \ variable: Using a BY variable....................................................................................................\n\
    - Task: Computing the mean of a variable broken down by values of another ................24\
    \ variable: Using a CLASS statement..................................................................................................\n\
    - Task: Have PROC MEANS name the variables in the output data set automatically\
    \ (the AUTENAME option)........................................................................................25\n\
    - Task: Creating multiple output sets from PROC MEANS, each with a different combination\
    \ of CLASS variables.........................................................................................26\n\
    - Task: Combining summary information (a single mean) with detail data: Using\
    \ a conditional SET statement...............................................................................................29\n\
    - Task: Combining summary information (a single mean) with detail data: Using\
    \ PROC SQL.......................................................................................................................31\n\
    - Task: Combining summary information (a single mean) with detail data: Using\
    \ PROC SQL without using PROC MEANS...............................................................................................32\n\
    - Task: Combining summary information (a single mean) with detail data: Using\
    \ a macro variable...............................................................................................................33\n\
    - Task: Combining summary data with detail data—for each category of a BY VARIABLE...............................................................................................................................34\n\
    - Conclusion ........................................................................................................................36\n\
    \n## Introduction\n\nYou can use procedures such as PROC MEANS, PROC UNIVARIATE,\
    \ and PROC TABULATE to print summary such as means, medians, standard deviations,\
    \ but there are occasions where you need this information in a data set. This\
    \ chapter describes how to accomplish these tasks.\n\n## Task: Using PROC MEANS\
    \ to create a data set containing summary information\n\nKeywords\nPROC MEANS\n\
    Summary data set\n* Grand mean\n\nLet's start by computing the mean of all observations\
    \ and outputting it to a data set. Later in this chapter, you will see how to\
    \ combine this with another.\n\n## Program 3.1: Computing the mean of all observations\
    \ and outputting it to a data set\n\n```\n*Computing the mean of all observations\
    \ and outputting it to a data set;\nproc means data=Blood_Pressure noprint;\n\
    var Heart_Rate;\nout=Summary(keep=Mean_HR) mean=Mean_HR;\nrun;\n```\n\nThe NOPINT\
    \ option instructs the program not to produce any output because you only want\
    \ the value in a data set. This program uses the Blood_Pressure data set and computes\
    \ the mean Heart_Rate. Notice that in this case, the KEEP= data set option was\
    \ not used. This allows you to see exactly what PROC MEANS places in its output\
    \ data set. Here is the listing of:\n\n| Mean_HR |\n|---|\n| 69.3448 |\n\nThis\
    \ small data set contains a single observation and one variable (the mean).\n\n\
    Cody, Ron. Cody's Collection of Popular SAS® Programming Tasks and How to Tackle\
    \ Them. Copyright © 2012, SAS Institute Inc., Cary, North Carolina, USA. ALL RIGHTS\
    \ RESERVED. For additional SAS resources, visit support.sas.com/bookstore.\n\n\
    ## Task: Computing the mean of a variable broken down by values of another variable:\
    \ Using a BY variable\n\nKeywords\nPROC MEANS\nBY variable\nSummary data set\n\
    \nThe next task is similar to the previous task except that this time you want\
    \ to output means for each of BY variable. You first need to sort the data set\
    \ (in this example by Drug) and then run PROC MEANS. Here is the code:\n\n```\n\
    *Computing the mean for each value of a BY variable;\nproc sort data=Blood_Pressure;\n\
    by Drug;\nrun;\n\nproc means data=Blood_Pressure noprint;\nvar Heart_Rate;\noutput\
    \ out=Summary mean=Mean_HR;\nrun;\n```\n\nProgram 3.2: Computing the mean for\
    \ each value of a BY variable\n\nNotice that in this case, the KEEP= data set\
    \ option was not used. This allows you to see exactly what PROC MEANS places in\
    \ its output data set. Here is the listing of:\n\n| Drug | TYPE | FREQ | Mean_HR\
    \ |\n|---|---|---|---|\n| Drug A | 0 | 20 | 73.3000 |\n| Drug B | 0 | 20 | 65.3500\
    \ |\n| Placebo | 0 | 20 | 69.3889 |\n\nThis data set contains the mean Heart_Rate\
    \ for each of the three values of Drug.\n\nWhen you use a BY statement to create\
    \ an output data set with PROC MEANS, the _TYPE_ variable will always be zero.\
    \ Later, when you use a CLASS statement, this variable will take on different\
    \ values and can be quite useful. The variable _FREQ_ tells you the number of\
    \ observations in each of the three Drug groups (missing and non-missing).\n"
