    # Task: Performing a one-way table lookup using a temporary array


    # Keywords


    # Temporary array


    # Table lookup


    You can use a temporary array to store values for table lookup. This is one of
    my favorite methods. Temporary arrays are defined by an ARRAY statement with the
    keyword _TEMPORARY_following the array name. Temporary arrays do not have any
    associated variables—they are simply subscribed, stored in memory (very fast)
    when you can store values. You can load a temporary array by assigning initial
    values when you define the array, or by loading the array from raw data or a SAS
    set data.


    You can change the bounds on temporary arrays, just as you do with regular arrays.
    In addition, you can have multi-dimensional arrays that you can perform table
    lookup based on two or more values. You will see an example of this at the end
    of this chapter.


    For this example, you load a temporary array with the sales goals for the years
    2004 to 2012 (the same as the previous examples). Once you do this, you can obtain
    the sales goal for any year by using the year as the array subscript. Here is
    the program:


