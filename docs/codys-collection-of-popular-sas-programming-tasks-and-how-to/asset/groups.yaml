    \nPROC SORT\n\nDuplicate BY values\n\nFirst. variables\n\nLast. variables\n\n\
    You can use the First. and Last variables described in the previous section to\
    \ perform tasks involving duplicates and multiple observations per subject.\n\n\
    If you want to determine if there are any duplicate values for Subj in the Duplicates\
