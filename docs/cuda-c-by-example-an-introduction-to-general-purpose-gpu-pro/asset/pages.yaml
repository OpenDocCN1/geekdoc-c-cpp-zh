    Pretty simple stuff, right? In the next section, we''ll see one of the limitations
    of this thread-only approach. And of course, later we''ll see why we would even
    bother splitting blocks into other parallel components.


    # GPU SUMS OF A LONGER VECTOR


    In the previous chapter, we noted that the hardware limits the number of blocks
    in a single launch to 65,535. Similarly, the hardware limits the number of threads
    per block with which we can launch a kernel. Specifically, this number cannot
    exceed the value specified by the maxThreadsPerBlock field of the device properties
    structure we looked at in Chapter 3. For many of the graphics processors currently
    available, this limit is 512 threads per block, so how would we use a thread-based
    approach to add two vectors of size greater than 512? We will have to use a combination
    of threads and blocks to accomplish this.


    As before, this will require two changes: We will have to change the index computation
    within the kernel, and we will have to change the kernel launch itself.


    Now that we have multiple blocks and threads, the indexing will start to look
    similar to the standard method for converting from a two-dimensional index space
    to a linear space.


    ```

    int tid = threadIdx.x + blockIdx.x * blockDim.x;

    ```


    This assignment uses a new built-in variable, blockDim. This variable is a constant
    for all blocks and stores the number of threads along each dimension of the block.
    Since we are using a one-dimensional block, we refer only to blockDim.x. If you
    recall, gridDim stored a similar value, but it stored the number of blocks along
    each dimension of the entire grid. Moreover, gridDim is two-dimensional, whereas
    blockDim is actually three-dimensional. That is, the CUDA runtime allows you to
    launch a two-dimensional grid of blocks where each block is a three-dimensional
    array of threads. Yes, this is a lot of dimensions, and it is unlikely you will
    regularly need the five degrees of indexing freedom afforded you, but they are
    available if so desired.'
