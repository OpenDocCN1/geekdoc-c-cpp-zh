    \ involves preparing locks for the hash table's buckets. We allocate one lock\
    \ for each bucket in the hash table. Conceivably we could save a lot of memory\
    \ by using only one lock for the whole table. But doing so would utterly destroy\
    \ performance because every thread would have to compete for the table lock whenever\
    \ a group of threads tries to simultaneously add entries to the table. So we declare\
    \ an array of locks, one for every bucket in the array. We then allocate a GPU\
    \ array for the locks and copy them up to the device:"
