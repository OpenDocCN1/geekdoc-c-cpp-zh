  img_proc: true
- pgno: 127
  md: 'When it comes to handling constant memory, NVIDIA hardware can broadcast a
    single memory read to each half-warp. A half-warp—neatly as creatively named as
    a warp—is a group of 16 threads: half of a 32-thread warp. If every thread in
    a half-warp requests data from the same address in constant memory, your GPU will
    generate only a single read request and subsequently broadcast the data to every
    thread. If you are reading a lot of data from constant memory, you will generate
    only 1/16 (roughly 6 percent) of the memory traffic as you would when using global
    memory.


    But the savings don''t stop at a 94 percent reduction in bandwidth when reading
    constant memory! Because we have committed to leaving the memory unchanged, the
    hardware can aggressively cache the constant data on the GPU. So after the first
    read from an address in constant memory, other half-warps requesting the same
    address, and therefore hitting the constant cache, will generate no additional
    memory traffic.


    In the case of our ray tracer, every thread in the launch reads the data corresponding
    to the first sphere so the thread can test its ray for intersection. After we
    modify our application to store the spheres in constant memory, the hardware needs
    to make only a single request for this data. After caching the data, every other
    thread avoids generating memory traffic as a result of one of the two constant
    memory benefits:


    +   - It retrieves the data in a half-warp broadcast.

    +   - It retrieves the data from the constant memory cache.


    Unfortunately, there can potentially be a downside to performance when using constant
    memory. The half-warp broadcast feature is in actuality a double-edged sword.
    Although it can dramatically accelerate performance when all 16 threads are reading
    the same address, it actually slows performance to a crawl when all 16 threads
    read different addresses.


    The trade-off to allowing the broadcast of a single read to 16 threads is that
    the 16 threads are allowed to place only a single read request at a time. For
    example, if all 16 threads in a half-warp need different data from constant memory,
    the 16 different reads get serialized, effectively taking 16 times the amount
    of time to place the request. If they were reading from conventional global memory,
    the request could be issued at the same time. In this case, reading from constant
    memory would probably be slower than using global memory.'
  merge: -1
  img_proc: true
