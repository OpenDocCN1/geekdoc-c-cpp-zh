- pgno: 290
  md: "```\nvoid free_table( Table &table ) {\n    cudaFree( table.pool );\n    cudaFree(\
    \ table.entries );\n}\n```\n\nWe used a routine to check our hash table for correctness\
    \ in the CPU implementation. We need a similar routine for the GPU version, so\
    \ we have two options. We could write a GPU-based version of `verify_table()`,\
    \ or we could use the same code we used in the CPU version and add a function\
    \ that copies a hash table from the GPU to the CPU. Although either option gets\
    \ us what we need, the second option seems superior for two reasons: First, it\
    \ involves reusing our CPU version of `verify_table()`. As with code reuse in\
    \ general, this saves time and ensures that future changes to the code would need\
    \ to be made in only one place for both versions of the hash table. Second, implementing\
    \ a copy function will uncover an interesting problem, the solution to which may\
    \ be very useful to you in the future.\n\nAs promised, `verify_table()` is identical\
    \ to the CPU implementation and is reprinted here for your convenience.\n\n```\n\
    #define SIZE        (100*1024*1024)\n#define ELEMENTS    (SIZE / sizeof(unsigned\
    \ int))\n#define HASH_ENTRIES   1024\n\nvoid verify_table( const Table &dev_table\
    \ ) {\n    Table table;\n    copy_table_to_host( dev_table, table );\n\n    int\
    \ count = 0;\n    for (size_t i=0; i<table.count; i++) {\n        Entry *current\
    \ = table.entries[i];\n        while (current != NULL) {\n            ++count;\n\
    \            if (hash( current->value, table.count ) != i)\n                printf(\
    \ \"%d hashed to %ld, but was located \"\n                        \"at %ld\\n\"\
    , current->value,\n                        hash(current->value, table.count),\
    \ i );\n            current = current->next;\n        }\n    }\n}\n```"
