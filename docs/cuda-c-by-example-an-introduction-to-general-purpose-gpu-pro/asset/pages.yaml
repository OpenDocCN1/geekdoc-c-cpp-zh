- pgno: 46
  md: 'The more interesting addition is the allocation of memory using `cudaMalloc()`.
    This call behaves very similarly to the standard C call `malloc()`, but it tells
    the CUDA runtime to allocate the memory on the device. The first argument is a
    pointer to the pointer you want to hold the address of the newly allocated memory,
    and the second parameter is the size of the allocation you want to make. Besides
    that your allocated memory pointer is not the function''s return value, this is
    identical behavior to `malloc()`, right down to the `void*` return type. The `HANDLE_ERROR()`
    that surrounds these calls is a utility macro that we have provided as part of
    this book''s support code. It simply detects that the call has returned an error,
    prints the associated error message, and exits the application with an `EXIT_FAILURE`
    code. Although you are free to use this code in your own applications, it is highly
    likely that this error-handling code will be insufficient in production code.


    This raises a subtle but important point. Much of the simplicity and power of
    CUDA C derives from the ability to blur the line between host and device code.
    However, it is the responsibility of the programmer to not dereference the pointer
    returned by `cudaMalloc()` from code that executes on the host. Host code may
    pass this pointer around, perform arithmetic on it, or even cast it to a different
    type. But you cannot use it to read or write from memory.


    Unfortunately, the compiler cannot protect you from this mistake, either. It will
    be perfectly happy to allow dereferences of device pointers in your host code
    because it looks like any other pointer in the application. We can summarize the
    restrictions on the usage of device pointer as follows:


    +   You can pass pointers allocated with `cudaMalloc()` to functions that execute
    on the device.


    +   You can use pointers allocated with `cudaMalloc()` to read or write memory
    from code that executes on the device.


    +   You can pass pointers allocated with `cudaMalloc()` to functions that execute
    on the host.


    +   You cannot use pointers allocated with `cudaMalloc()` to read or write memory
    from code that executes on the host.


    If you''ve been reading carefully, you might have anticipated the next lesson:
    We can''t use standard C''s `free()` function to release memory we''ve allocated
    with `cudaMalloc()`. To free memory we''ve allocated with `cudaMalloc()`, we need
    to use a call to `cudaFree()`, which behaves exactly like `free()` does.'
  merge: -1
  img_proc: true
- pgno: 47
  md: 'We''ve seen how to use the host to allocate and free memory on the device,
    but we''ve also made it painfully clear that you cannot modify this memory from
    the host. The remaining two lines of the sample program illustrate two of the
    most common methods for accessing device memory—by using device pointers from
    within device code and by using calls to cudaMemcpy().


    We use pointers from within device code exactly the same way we use them in standard
    C that runs on the host code. The statement *c = a + b is as simple as it looks.
    It adds the parameters a and b together and stores the result in the memory pointed
    to by c. We hope this is almost too easy to even be interesting.


    We listed the ways in which we can and cannot use device pointers from within
    device and host code. These caveats translate exactly as one might imagine when
    considering host pointers. Although we are free to pass host pointers around in
    device code, we run into trouble when we attempt to use a host pointer to access
    memory from within device code. To summarize, host pointers can access memory
    from host code, and device pointers can access memory from device code.


    As promised, we can also access memory on a device through calls to cudaMemcpy()
    from host code. These calls behave exactly like standard C memcpy() with an additional
    parameter to specify which of the source and destination pointers point to device
    memory. In the example, notice that the last parameter to cudaMemcpy() is cudaMemcpyDeviceToHost,
    instructing the runtime that the source pointer is a device pointer and the destination
    pointer is a host pointer.


    Unsurprisingly, cudaMemcpyHostToDevice would indicate the opposite situation,
    where the source data is on the host and the destination is an address on the
    device. Finally, we can even specify that both pointers are on the device by passing
    cudaMemcpyDeviceToDevice. If the source and destination pointers are both on the
    host, we would simply use standard C''s memcpy() routine to copy between them.


    # 3.3 Querying Devices


    Since we would like to be allocating memory and executing code on our device,
    it would be useful if our program had a way of knowing how much memory and what
    types of capabilities the device had. Furthermore, it is relatively common for'
