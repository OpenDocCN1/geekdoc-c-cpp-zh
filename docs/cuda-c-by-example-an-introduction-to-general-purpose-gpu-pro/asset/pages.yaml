    \ that each bin in the GPU and CPU version match. But rather than allocate a new\
    \ histogram array, we'll opt to start with the GPU histogram and compute the CPU\
    \ histogram \"in reverse.\"\n\nBy computing the histogram \"in reverse,\" we mean\
    \ that rather than starting at zero and incrementing bin values when we see data\
    \ elements, we will start with the GPU histogram and decrement the bin's value\
    \ when the CPU sees data elements. Therefore, the CPU has computed the same histogram\
    \ as the GPU if and only if every bin has the value zero when we are finished.\
    \ In some sense, we are computing the difference between these two histograms.\
