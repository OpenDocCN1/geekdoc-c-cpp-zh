  img_proc: true
- pgno: 65
  md: "When we launched the kernel, we specified N as the number of parallel blocks.\
    \ We call the collection of parallel blocks a grid. This specifies to the runtime\
    \ system that we want a one-dimensional grid of N blocks (scalar values are interpreted\
    \ as one-dimensional). These threads will have varying values for blockIdx.x,\
    \ the first taking value 0 and the last taking value N-1. So, imagine four blocks,\
    \ all running through the same copy of the device code but having different values\
    \ for the variable blockIdx.x. This is what the actual code being executed in\
    \ each of the four parallel blocks looks like after the runtime substitutes the\
    \ appropriate block index for blockIdx.x:\n\n# BLOCK 1\n\n```\n__global__ void\n\
    add( int *a, int *b, int *c ) {\n    int tid = 0;\n    if (tid < N)\n        c[tid]\
    \ = a[tid] + b[tid];\n}\n```\n\n# BLOCK 2\n\n```\n__global__ void\nadd( int *a,\
    \ int *b, int *c ) {\n    int tid = 1;\n    if (tid < N)\n        c[tid] = a[tid]\
    \ + b[tid];\n}\n```\n\n# BLOCK 3\n\n```\n__global__ void\nadd( int *a, int *b,\
    \ int *c ) {\n    int tid = 2;\n    if (tid < N)\n        c[tid] = a[tid] + b[tid];\n\
    }\n```\n\n# BLOCK 4\n\n```\n__global__ void\nadd( int *a, int *b, int *c ) {\n\
    \    int tid = 3;\n    if (tid < N)\n        c[tid] = a[tid] + b[tid];\n}\n```\n\
    \nIf you recall the CPU-based example with which we began, you will recall that\
    \ we needed to walk through indices from 0 to N-1 in order to sum the two vectors.\
    \ Since the runtime system is already launching a kernel where each block will\
    \ have one of these indices, nearly all of this work has already been done for\
    \ us. Because we're something of a lazy lot, this is a good thing. It affords\
    \ us more time to blog, probably about how lazy we are.\n\nThe last remaining\
    \ question to be answered is, why do we check whether tid is less than N? It should\
    \ always be less than N, since we've specifically launched our kernel such that\
    \ this assumption holds. But our desire to be lazy also makes us paranoid about\
    \ someone breaking an assumption we've made in our code. Breaking code assumptions\
    \ means broken code. This means bug reports, late"
