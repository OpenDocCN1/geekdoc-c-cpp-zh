- pgno: 183
  md: '# Chapter 9


    # Atomics


    In the first half of the book, we saw many occasions where something complicated
    to accomplish with a single-threaded application becomes quite easy when implemented
    using CUDA C. For example, thanks to the behind-the-scenes work of the CUDA runtime,
    we no longer needed `for ()` loops in order to do per-pixel updates in our animations
    or heat simulations. Likewise, thousands of parallel blocks and threads get created
    and automatically enumerated with thread and block indices simply by calling a
    `__global__` function from host code.


    On the other hand, there are some situations where something incredibly simple
    in single-threaded applications actually presents a serious problem when we try
    to implement the same algorithm on a massively parallel architecture. In this
    chapter, we''ll take a look at some of the situations where we need to use special
    primitives in order to safely accomplish things that can be quite trivial to do
    in a traditional, single-threaded application.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# 9.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn about the *compute capability* of various NVIDIA GPUs.

    +   - You will learn about what atomic operations are and why you might need them.

    +   - You will learn how to perform arithmetic with atomic operations in your
    CUDA C kernels.


    # 9.2 Compute Capability


    All of the topics we have covered to this point involve capabilities that every
    CUDA-enabled GPU possesses. For example, every GPU built on the CUDA Architecture
    can launch kernels, access global memory, and read from constant and texture memories.
    But just like different models of CPUs have varying capabilities and instruction
    sets (for example, MMX, SSE, or SSE2), so too do CUDA-enabled graphics processors.
    NVIDIA refers to the supported features of a GPU as its *compute capability*.


    # 9.2.1 THE COMPUTE CAPABILITY OF NVIDIA GPUS


    As of press time, NVIDIA GPUs could potentially support compute capabilities 1.0,
    1.1, 1.2, 1.3, or 2.0. Higher-capability versions represent supersets of the versions
    below them, implementing a “layered onion” or “Russian nesting doll” hierarchy
    (depending on your metaphorical preference). For example, a GPU with compute capability
    1.2 supports all the features of compute capabilities 1.0 and 1.1. The *NVIDIA
    CUDA Programming Guide* contains an up-to-date list of all CUDA-capable GPUs and
    their corresponding compute capability. Table 9.1 lists the NVIDIA GPUs available
    at press time. The compute capability supported by each GPU is listed next to
    the device’s name.'
