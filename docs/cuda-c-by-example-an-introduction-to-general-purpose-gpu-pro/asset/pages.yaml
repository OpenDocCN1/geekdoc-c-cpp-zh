    # 6.2.4 PERFORMANCE WITH CONSTANT MEMORY


    Declaring memory as __constant__ constrains our usage to be read-only. In taking
    on this constraint, we expect to get something in return. As we previously mentioned,
    reading from constant memory can conserve memory bandwidth when compared to reading
    the same data from global memory. There are two reasons why reading from the 64KB
    of constant memory can save bandwidth over standard reads of global memory:


    +   - A single read from constant memory can be broadcast to other “nearby” threads,
    effectively saving up to 15 reads.


    +   - Constant memory is cached, so consecutive reads of the same address will
    not incur any additional memory traffic.


    What do we mean by the word nearby? To answer this question, we will need to explain
    the concept of a warp. For those readers who are more familiar with Star Trek
    than with weaving, a warp in this context has nothing to do with the speed of
    travel through space. In the world of weaving, a warp refers to the group of threads
    being woven together into fabric. In the CUDA Architecture, a warp refers to a
    collection of 32 threads that are “woven together” and get executed in lockstep.
    At every line in your program, each thread in a warp executes the same instruction
    on different data.'
