- pgno: 113
  md: "Although this may not be the end of the world, your application might be computing\
    \ more important values.\n\nInstead, we need to add a synchronization point between\
    \ the write to shared memory and the subsequent read from it.\n\n```\nshared[threadIdx.x][threadIdx.y]\
    \ =\n  255 * (sinf(x*2.0f*PI / period) + 1.0f) *\n  (sinf(y*2.0f*PI / period)\
    \ + 1.0f) / 4.0f;\n\n__syncthreads();\n\nptr[offset*4 + 0] = 0;\nptr[offset*4\
    \ + 1] = shared[15-threadIdx.x][15-threadIdx.y];\nptr[offset*4 + 2] = 0;\nptr[offset*4\
    \ + 3] = 255;\n}\n```\n\nWith this __syncthreads() in place, we then get a far\
    \ more predictable [and aesthetically pleasing] result, as shown in Figure 5.6.\n\
    \n![](img/d5750f02645080d2a91292047fbe0f98_113_0.png)\n\nFigure 5.6 A screenshot\
    \ after adding the correct synchronization"
