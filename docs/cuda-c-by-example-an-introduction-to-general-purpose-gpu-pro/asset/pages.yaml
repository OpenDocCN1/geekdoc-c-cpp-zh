    # 3.4 Using Device Properties


    Other than writing an application that handily prints every detail of every CUDA-capable
    card, why might we be interested in the properties of each device in our system?
    Since we as software developers want everyone to think our software is fast, we
    might be interested in choosing the GPU with the most multiprocessors on which
    to run our code. Or if the kernel needs close interaction with the CPU, we might
    be interested in running our code on the integrated GPU that shares system memory
    with the CPU. These are both properties we can query with cudaGetDeviceProperties
    ().


    Suppose that we are writing an application that depends on double-precision floating-point
    support. After a quick consultation with Appendix A of the NVIDIA CUDA Programming
    Guide, we know that cards that have compute capability 1.3 or higher support double-precision
    floating-point math. So to successfully run the double-precision application we''ve
    written, we need to find at least one device of compute capability 1.3 or higher.'
  merge: -1
  img_proc: true
- pgno: 54
  md: "Based on what we have seen with cudaGetDeviceCount() and cudaGetDeviceProperties(),\
    \ we could iterate through each device and look for one that either has a major\
    \ version greater than 1 or has a major version of 1 and minor version greater\
    \ than or equal to 3. But since this relatively common procedure is also relatively\
    \ annoying to perform, the CUDA runtime offers us an automated way to do this.\
    \ We first fill a cudaDeviceProp structure with the properties we need our device\
    \ to have.\n\n```\n```c\ncudaDeviceProp prop;\nmemset( &prop, 0, sizeof( cudaDeviceProp\
    \ ) );\nprop.major = 1;\nprop.minor = 3;\n```\n```\n\nAfter filling a cudaDeviceProp\
    \ structure, we pass it to cudaChooseDevice() to have the CUDA runtime find a\
    \ device that satisfies this constraint. The call to cudaChooseDevice() returns\
    \ a device ID that we can then pass to cudaSetDevice(). From this point forward,\
    \ all device operations will take place on the device we found in cudaChooseDevice().\n\
    \n```\n```c\n#include \"../common/book.h\"\n\nint main( void ) {\n    cudaDeviceProp\
    \ prop;\n    int dev;\n\n    HANDLE_ERROR( cudaGetDevice( &dev ) );\n    printf(\
    \ \"ID of current CUDA device: %d\\n\", dev );\n\n    memset( &prop, 0, sizeof(\
    \ cudaDeviceProp ) );\n    prop.major = 1;\n    prop.minor = 3;\n    HANDLE_ERROR(\
    \ cudaChooseDevice( &dev, &prop ) );\n    printf( \"ID of CUDA device closest\
    \ to revision 1.3: %d\\n\", dev );\n    HANDLE_ERROR( cudaSetDevice( dev ) );\n\
    }\n```\n```"
  merge: -1
