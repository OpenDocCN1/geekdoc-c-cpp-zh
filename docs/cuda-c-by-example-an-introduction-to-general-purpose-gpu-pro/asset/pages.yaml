- pgno: 203
  md: "And with this, our two phase histogram computation kernel is complete. Here\
    \ it is from start to finish:\n\n```\n__global__ void histo_kernel( unsigned char\
    \ *buffer,\n   long size,\n   unsigned int *histo ) {\n   __shared__ unsigned\
    \ int temp[256];\n   temp[threadIdx.x] = 0;\n   __syncthreads();\n\n   int i =\
    \ threadIdx.x + blockIdx.x * blockDim.x;\n   int offset = blockDim.x * gridDim.x;\n\
    \   while (i < size) {\n      atomicAdd( &temp[buffer[i]], 1);\n      i += offset;\n\
    \   }\n\n   __syncthreads();\n   atomicAdd( &(histo[threadIdx.x]), temp[threadIdx.x]\
    \ );\n}\n```\n\nThis version of our histogram example improves dramatically over\
    \ the previous GPU version. Adding the shared memory component drops our running\
    \ time on a GeForce GTX 285 to 0.057 seconds. Not only is this significantly better\
    \ than the version that used global memory atomics only, but this beats our original\
    \ CPU implementation by an order of magnitude (from 0.416 seconds to 0.057 seconds).\
    \ This improvement represents greater than a sevenfold boost in speed over the\
    \ CPU version. So despite the early setback in adapting the histogram to a GPU\
    \ implementation, our version that uses both shared and global atomics should\
    \ be considered a success.\n\n# 9.5 Chapter Review\n\nAlthough we have frequently\
    \ spoken at length about how easy parallel programming can be with CUDA C, we\
    \ have largely ignored some of the situations when"
