- pgno: 69
  md: "This function is the meat of the example. We begin by translating our pixel\
    \ coordinate to a coordinate in complex space. To center the complex plane at\
    \ the image center, we shift by DIM/2. Then, to ensure that the image spans the\
    \ range of -1.0 to 1.0, we scale the image coordinate by DIM/2. Thus, given an\
    \ image point at (x, y), we get a point in complex space at ( (DIM/2 - x) / (DIM/2)\
    \ , ( (DIM/2 - y) / (DIM/2) ).\n\nThen, to potentially zoom in or out, we introduce\
    \ a scale factor. Currently, the scale is hard-coded to be 1.5, but you should\
    \ tweak this parameter to zoom in or out. If you are feeling really ambitious,\
    \ you could make this a command-line parameter.\n\nAfter obtaining the point in\
    \ complex space, we then need to determine whether the point is in or out of the\
    \ Julia Set. If we recall the previous section, we do this by computing the values\
    \ of the iterative equation Z<sub>n+1</sub> = Z<sub>n</sub><sup>2</sup> + C. Since\
    \ C is some arbitrary complex-valued constant, we have chosen - 0.8 + 0.156i because\
    \ it happens to yield an interesting picture. You should play with this constant\
    \ if you want to see other versions of the Julia Set.\n\nIn the example, we compute\
    \ 200 iterations of this function. After each iteration, we check whether the\
    \ magnitude of the result exceeds some threshold (1,000 for our purposes). If\
    \ so, the equation is diverging, and we can return 0 to indicate that the point\
    \ is _not_ in the set. On the other hand, if we finish all 200 iterations and\
    \ the magnitude is still bounded under 1,000, we assume that the point is in the\
    \ set, and we return 1 to the caller, kernel().\n\nSince all the computations\
    \ are being performed on complex numbers, we define a generic structure to store\
    \ complex numbers.\n\n```\nstruct cuComplex {\n    float   r;\n    float   i;\n\
    \n    cuComplex( float a, float b ) : r(a), i(b) {}\n\n    float magnitude2( void\
    \ ) { return r * r + i * i; }\n\n    cuComplex operator*(const cuComplex& a) {\n\
    \        return cuComplex(r*a.r - i*a.i, i*a.r + r*a.i);\n    }\n\n    cuComplex\
    \ operator+(const cuComplex& a) {\n        return cuComplex(r+a.r, i+a.i);\n \
    \   }\n};\n```"
