- pgno: 44
  md: 'on Linux operating systems, while Microsoft Visual C compiles it on Windows
    systems. The NVIDIA tools simply feed this host compiler your code, and everything
    behaves as it would in a world without CUDA.


    Now we see that CUDA C adds the __global__ qualifier to standard C. This mechanism
    alerts the compiler that a function should be compiled to run on a device instead
    of the host. In this simple example, nvcc gives the function kernel1() to the
    compiler that handles device code, and it feeds main() to the host compiler as
    it did in the previous example.


    So, what is the mysterious call to kernel1(), and why must we vandalize our standard
    C with angle brackets and a numeric tuple? Brace yourself, because this is where
    the magic happens.


    We have seen that CUDA C needed a linguistic method for marking a function as
    device code. There is nothing special about this; it is shorthand to send host
    code to one compiler and device code to another compiler. The trick is actually
    in calling the device code from the host code. One of the benefits of CUDA C is
    that it provides this language integration so that device function calls look
    very much like host function calls. Later we will discuss what actually happens
    behind the scenes, but suffice to say that the CUDA compiler and runtime take
    care of the messy business of invoking device code from the host.


    So, the mysterious-looking call invokes device code, but why the angle brackets
    and numbers? The angle brackets denote arguments we plan to pass to the runtime
    system. These are not arguments to the device code but are parameters that will
    influence how the runtime will launch our device code. We will learn about these
    parameters to the runtime in the next chapter. Arguments to the device code itself
    get passed within the parentheses, just like any other function invocation.


    # 3.2.3 PASSING PARAMETERS


    We''ve promised the ability to pass parameters to our kernel, and the time has
    come for us to make good on that promise. Consider the following enhancement to
    our "Hello, World!" application:'
  merge: -1
  img_proc: true
- pgno: 45
  md: "```\n#include <iostream>\n#include \"book.h\"\n\n__global__ void add( int a,\
    \ int b, int *c ) {\n    *c = a + b;\n}\n\nint main( void ) {\n    int c;\n  \
    \  int *dev_c;\n    HANDLE_ERROR( cudaMalloc( (void**)&dev_c,\n              \
    \               sizeof(int) ) );\n\n    add<<<1,1>>>( 2, 7, dev_c );\n\n    HANDLE_ERROR(\
    \ cudaMemcpy( &c,\n                             dev_c,\n                     \
    \        sizeof(int),\n                             cudaMemcpyDeviceToHost ) );\n\
    \n    printf( \"2 + 7 = %d\\n\", c );\n    cudaFree( dev_c );\n\n    return 0;\n\
    }\n```\n\nYou will notice a handful of new lines here, but these changes introduce\
    \ only two concepts:\n\n+   - We can pass parameters to a kernel as we would with\
    \ any C function.\n+   - We need to allocate memory to do anything useful on a\
    \ device, such as return values to the host.\n\nThere is nothing special about\
    \ passing parameters to a kernel. The angle-bracket syntax notwithstanding, a\
    \ kernel call looks and acts exactly like any function call in standard C. The\
    \ runtime system takes care of any complexity introduced by the fact that these\
    \ parameters need to get from the host to the device."
