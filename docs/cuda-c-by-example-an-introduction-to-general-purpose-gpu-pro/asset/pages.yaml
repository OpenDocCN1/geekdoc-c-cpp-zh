  md: "GPUAnimBitmap. We also include nearly the same kernel as we examined in Chapter\
    \ 5.\n\n```\n#include \"../../common/book.h\"\n#include \"../../common/gpu_anim.h\"\
    \n\n#define DIM 1024\n\n__global__ void kernel( uchar4 *ptr, int ticks ) {\n \
    \   // map from threadIdx/BlockIdx to pixel position\n    int x = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n    int y = threadIdx.y + blockIdx.y * blockDim.y;\n\
    \    int offset = x + y * blockDim.x * gridDim.x;\n\n    // now calculate the\
    \ value at that position\n    float fx = x - DIM/2;\n    float fy = y - DIM/2;\n\
    \    float d = sqrtf( fx * fx + fy * fy );\n    unsigned char grey = (unsigned\
    \ char)(128.0f + 127.0f *\n                                         cos(d/10.0f\
    \ - \n                                         ticks/7.0f) /\n               \
    \                          (d/10.0f + 1.0f));\n    ptr[offset].x = grey;\n   \
    \ ptr[offset].y = grey;\n    ptr[offset].z = grey;\n    ptr[offset].w = 255;\n\
    }\n```\n\nThe one and only change we've made is highlighted. The reason for this\
    \ change is because OpenGL interoperation requires that our shared surfaces be\
    \ \"graphics friendly.\" Because real-time rendering typically uses arrays of\
    \ four-component red/green/blue/alpha data elements, our target buffer is no longer\
    \ simply an array of unsigned char as it previously was. It's now required to\
    \ be an array of type uchar4. In reality, we treated our buffer in Chapter 5 as\
    \ a four-component buffer, so we always indexed it with ptr [offset+4+k], where\
    \ k indicates the component from 0 to 3. But now, the four-component nature of\
    \ the data is made explicit with the switch to a uchar4 type."
