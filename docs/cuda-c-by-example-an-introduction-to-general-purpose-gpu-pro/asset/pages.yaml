  md: '![](img/d5750f02645080d2a91292047fbe0f98_146_0.png)


    Figure 7.4 A screenshot from the animated heat transfer simulation


    designed to accelerate. Given that we want to use texture memory, we need to learn
    the mechanics of doing so.


    First, we will need to declare our inputs as texture references. We will use references
    to floating-point textures, since our temperature data is floating-point.


    ```

    // these exist on the GPU side

    texture<float> texConstSrc;

    texture<float> texIn;

    texture<float> texOut;

    ```


    The next major difference is that after allocating GPU memory for these three
    buffers, we need to bind the references to the memory buffer using cudaBindTexture
    (). This basically tells the CUDA runtime two things:


    +   - We intend to use the specified buffer as a texture.

    +   - We intend to use the specified texture reference as the texture''s “name.”'
