    \ * gridDim.x;\n\n  int left = offset - 1;\n  int right = offset + 1;\n  if (x\
    \ == 0) left++;\n  if (x == DIM-1) right--;\n\n  int top = offset - DIM;\n  int\
    \ bottom = offset + DIM;\n  if (y == 0) top += DIM;\n  if (y == DIM-1) bottom\
    \ -= DIM;\n\n  float t, l, c, r, b;\n  if (dstOut) {\n    t = tex1Dfetch(texIn,\
    \ top);\n    l = tex1Dfetch(texIn, left);\n    c = tex1Dfetch(texIn, offset);\n\
