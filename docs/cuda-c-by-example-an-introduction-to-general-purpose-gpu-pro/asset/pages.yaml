- pgno: 293
  md: "Our threads walk through the input arrays exactly like they did in the dot\
    \ product example. For each key in the keys[] array, the thread will compute the\
    \ hash function in order to determine which bucket the key/value pair belongs\
    \ in. After determining the target bucket, the thread locks the bucket, adds its\
    \ key/value pair, and unlocks the bucket.\n\n```\nwhile (tid < ELEMENTS) {\n \
    \   unsigned int key = keys[tid];\n    size_t hashValue = hash( key, table.count\
    \ );\n    for (int i=0; i<=32; i++) {\n        if ( ((tid & 32) == i) {\n    \
    \        Entry *location = &table.pool[tid];\n            location->key = key;\n\
    \            location->value = values[tid];\n            lock[hashValue].lock();\n\
    \            location->next = table.entries[hashValue];\n            table.entries[hashValue]\
    \ = location;\n            lock[hashValue].unlock();\n        }\n    }\n    tid\
    \ += stride;\n}\n```\n\nThere is something remarkably peculiar about this bit\
    \ of code, however. The for() loop and subsequent if() statement seem decidedly\
    \ unnecessary. In Chapter 6, we introduced the concept of a warp. If you’ve forgotten,\
    \ a warp is a collection of 32 threads that execute together in lockstep. Although\
    \ the nuances of how this got implemented in the GPU are beyond the scope of this\
    \ book, only one thread in the warp can acquire the lock at a time, and we will\
    \ suffer many a headache if we let all 32 threads in the warp contend for the\
    \ lock simultaneously. In this situation, we’ve found that it’s best to do some\
    \ of the work in software and simply walk through each thread in the warp, giving\
    \ each a chance to acquire the data structure’s lock, do its work, and subsequently\
    \ release the lock.\n\nThe flow of main() should appear identical to the CPU implementation.\
    \ We start by allocating a large chunk of random data for our hash table keys.\
    \ Then we create start and stop CUDA events and record the start event for our\
    \ performance"
