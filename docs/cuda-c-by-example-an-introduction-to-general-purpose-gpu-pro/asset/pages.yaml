    \ a mutex on the GPU. The `Lock` structure that implements this mutex is located\
    \ in `lock.h` and included at the beginning of our improved dot product example:\n\
    \n```\n#include \"../common/book.h\"\n\n#include \"lock.h\"\n\n#define imin(a,b)\
    \ (a<b?a:b)\n\nconst int N = 33 * 1024 * 1024;\nconst int threadsPerBlock = 256;\n\
    const int blocksPerGrid =\n    imin( 32, (N+threadsPerBlock-1) / threadsPerBlock\
    \ );\n```\n\nWith two exceptions, the beginning of our dot product kernel is identical\
