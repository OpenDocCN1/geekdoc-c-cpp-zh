- pgno: 202
  md: "After zeroing the histogram, the next step is remarkably similar to our original\
    \ GPU histogram. The sole differences here are that we use the shared memory buffer\
    \ temp[] instead of the global memory buffer histo[] and that we need a subsequent\
    \ call to __syncthreads() to ensure the last of our writes have been committed.\n\
    \n```\nint i = threadIdx.x + blockIdx.x * blockDim.x;\nint offset = blockDim.x\
    \ * gridDim.x;\nwhile (i < size) {\n    atomicAdd( &temp[buffer[i]], 1 );\n  \
    \  i += offset;\n}\n__syncthreads();\n```\n\nThe last step in our modified histogram\
    \ example requires that we merge each block's temporary histogram into the global\
    \ buffer histo[]. Suppose we split the input in half and two threads look at different\
    \ halves and compute separate histograms. If thread A sees byte 0xFC 20 times\
    \ in the input and thread B sees byte 0xFC 5 times, the byte 0xFC must have appeared\
    \ 25 times in the input. Likewise, each bin of the final histogram is just the\
    \ sum of the corresponding bin in thread A's histogram and thread B's histogram.\
    \ This logic extends to any number of threads, so merging every block's histogram\
    \ into a single final histogram involves adding each entry in the block's histogram\
    \ to the corresponding entry in the final histogram. For all the reasons we've\
    \ seen already, this needs to be done atomically:\n\n```\natomicAdd( &(histo[threadIdx.x]),\
    \ temp[threadIdx.x] );\n}\n```\n\nSince we have decided to use 256 threads and\
    \ have 256 histogram bins, each thread atomically adds a single bin to the final\
    \ histogram's total. If these numbers didn't match, this phase would be more complicated.\
    \ Note that we have no guarantees about what order the blocks add their values\
    \ to the final histogram, but since integer addition is commutative, we will always\
    \ get the same answer provided that the additions occur atomically."
