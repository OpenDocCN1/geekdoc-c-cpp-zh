    \ stop, 0 ) );\nHANDLE_ERROR( cudaEventSynchronize( stop ) );\nfloat   elapsedTime;\n\
    HANDLE_ERROR( cudaEventElapsedTime( &elapsedTime,\n                          \
    \          start, stop ) );\nprintf( \"Time to generate:  %3.1f ms\\n\", elapsedTime\
    \ );\n```\n\nAt this point, we could pass the histogram as input to another stage\
    \ in the algorithm, but since we are not using the histogram for anything else,\
    \ we will simply verify that the computed GPU histogram matches what we get on\
    \ the CPU. First, we verify that the histogram sum matches what we expect. This\
    \ is identical to the CPU code shown here:\n\n```\nlong histoCount = 0;\nfor (int\
    \ i=0; i<256; i++) {\n    histoCount += histo[i];\n}\nprintf( \"Histogram Sum:\
    \ %ld\\n\", histoCount );\n```\n\nTo fully verify the GPU histogram, though, we\
    \ will use the CPU to compute the same histogram. The obvious way to do this would\
    \ be to allocate a new histogram array, compute a histogram from the input using\
