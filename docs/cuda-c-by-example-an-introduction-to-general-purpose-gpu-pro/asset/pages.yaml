- pgno: 280
  md: 'Given what we know about the distribution of words in the English language,
    this hash function leaves much to be desired because it will not map words uniformly
    across the 26 buckets. Some of the buckets will contain very few key/value pairs,
    and some of the buckets will contain a large number of pairs. Accordingly, it
    will take much longer to find the value associated with a word that begins with
    a common letter such as S than it would take to find the value associated with
    a word that begins with the letter X. Since we are looking for hash functions
    that will give us constant-time retrieval of any value, this consequence is fairly
    undesirable. An immense amount of research has gone into the study of hash functions,
    but even a brief survey of these techniques is beyond the scope of this book.


    The last component of our hash table data structure involves the buckets. If we
    had a perfect hash function, every key would map to a different bucket. In this
    case, we can simply store the key/value pairs in an array where each entry in
    the array is what we''ve been calling a bucket. However, even with an excellent
    hash function, in most situations we will have to deal with collisions. A collision
    occurs when more than one keys maps to a bucket, such as when we add both the
    words avocado and aardvark to our dictionary hash table. The simplest way to store
    all of the values that map to a given bucket is simply to maintain a list of values
    in the bucket. When we encounter a collision, such as adding aardvark to a dictionary
    that already contains avocado, we put the value associated with aardvark at the
    end of the list we''re maintaining in the "A" bucket, as shown in Figure A.2.


    After adding the word avocado in Figure A.2, the first bucket has a single key/
    value pair in its list. Later in this imaginary application we add the word aardvark,
    a word that collides with avocado because they both start with the letter A. You
    will notice in Figure A.3 that it simply gets placed at the end of the list in
    the first bucket:


    ![](img/d5750f02645080d2a91292047fbe0f98_280_0.png)


    Figure A.2 Inserting the word avocado into the hash table'
  merge: -1
  img_proc: true
- pgno: 281
  md: "![](img/d5750f02645080d2a91292047fbe0f98_281_0.png)\n\nFigure A.3 Resolving\
    \ the conflict when adding the word aardvark\n\nArmed with some background on\
    \ the notions of a hash function and collision resolution, we're ready to take\
    \ a look at implementing our own hash table.\n\n# A.2.2 A CPU HASH TABLE\n\nAs\
    \ described in the previous section, our hash table will consist of essentially\
    \ two parts: a hash function and a data structure of buckets. Our buckets will\
    \ be implemented exactly as before: We will allocate an array of length N, and\
    \ each entry in the array holds a list of key/value pairs. Before concerning ourselves\
    \ with a hash function, we will take a look at the data structures involved:\n\
    \n```\n#include \"../common/book.h\"\n\nstruct Entry {\n    unsigned int    key;\n\
    \    void*           value;\n    Entry           *next;\n};\n\nstruct Table {\n\
    \    size_t          count;\n    Entry           **entries;\n    Entry       \
    \    *pool;\n    Entry           *firstFree;\n};\n```"
  merge: -1
  img_proc: true
- pgno: 282
  md: "As described in the introductory section, the structure Entry holds both a\
    \ key and a value. In our application, we will use unsigned integer keys to store\
    \ our key/value pairs. The value associated with this key can be any data, so\
    \ we have declared value as a void * to indicate this. Our application will primarily\
    \ be concerned with creating the hash table data structure, so we won't actually\
    \ store anything in the value field. We have included it in the structure for\
    \ completeness, in case you want to use this code in your own applications. The\
    \ last piece of data in our hash table Entry is a pointer to the next Entry. After\
    \ collisions, we'll have multiple entries in the same bucket, and we have decided\
    \ to store these entries as a list. So, each entry will point to the next entry\
    \ in the bucket, thereby forming a list of entries that have hashed to the same\
    \ location in the table. The last entry will have a NULL next pointer.\n\nAt its\
    \ heart, the Table structure itself is an array of “buckets.” This bucket array\
    \ is just an array of length count, where each bucket in entries is just a pointer\
    \ to an Entry. To avoid incurring the complication and performance hit of allocating\
    \ memory every time we want to add an Entry to the table, the table will maintain\
    \ a large array of available entries in pool. The field firstFree points to the\
    \ next available Entry for use, so when we need to add an entry to the table,\
    \ we can simply use the Entry pointed to by firstFree and increment that pointer.\
    \ Note that this will also simplify our cleanup code because we can free all of\
    \ these entries with a single call to free (). If we had allocated every entry\
    \ as we went, we would have to walk through the table and free every entry one\
    \ by one.\n\nAfter understanding the data structures involved, let’s take a look\
    \ at some of the other support code:\n\n```\nvoid initialize_table( Table *table,\
    \ int entries,\n                       int elements ) {\n  table.count = entries;\n\
    \  table.entries = (Entry**)calloc( entries, sizeof(Entry*) );\n  table.pool =\
    \ (Entry*)malloc( elements * sizeof( Entry ) );\n  table.firstFree = table.pool;\n\
    }\n```"
  merge: -1
  img_proc: true
- pgno: 283
  md: "Table initialization consists primarily of allocating memory and clearing memory\
    \ for the bucket array entries. We also allocate storage for a pool of entries\
    \ and initialize the firstFree pointer to be the first entry in the pool array.\n\
    \nAt the end of the application, we'll want to free the memory we've allocated,\
    \ so our cleanup routine frees the bucket array and the pool of free entries:\n\
    \n```\nvoid free_table( Table &table ) {\n    free( table.entries );\n    free(\
    \ table.pool );\n}\n```\n\nIn our introduction, we spoke quite a bit about the\
    \ hash function. Specifically, we discussed how a good hash function can make\
    \ the difference between an excellent hash table implementation and poor one.\
    \ In this example, we're using unsigned integers as our keys, and we need to map\
    \ these to the indices of our bucket array. The simplest way to do this would\
    \ be to select the bucket with an index equal to the key. That is, we could store\
    \ the entry e in table.entries [ e. key ]. However, we have no way of guaranteeing\
    \ that every key will be less than the length of the array of buckets. Fortunately,\
    \ this problem can be solved relatively painlessly:\n\n```\nsize_t hash( unsigned\
    \ int key, size_t count ) {\n    return key % count;\n}\n```\n\nIf the hash function\
    \ is so important, how can we get away with such a simple one? Ideally, we want\
    \ the keys to map uniformly across all the buckets in our table, and all we're\
    \ doing here is taking the key modulo the array length. In reality, hash functions\
    \ may not normally be this simple, but because this is just an example program,\
    \ we will be randomly generating our keys. If we assume that the random number\
    \ generator generates values roughly uniformly, this hash function should map\
    \ these keys uniformly across all of the buckets of the hash table. In your own\
    \ hash table implementation, you may require a more complicated hash function."
  merge: -1
  img_proc: true
- pgno: 284
  md: "Having seen the hash table structures and the hash function, we're ready to\
    \ look at the process of adding a key/value pair to the table. The process involves\
    \ three basic steps:\n\n+   1. Compute the hash function on the input key to determine\
    \ the new entry's bucket.\n+   2. Take a preallocated Entry from the pool and\
    \ initialize its key and value fields.\n+   3. Insert the entry at the front of\
    \ the proper bucket's list.\n\nWe translate these steps to code in a fairly straightforward\
    \ way.\n\n```\n```c\nvoid add_to_table( Table &table, unsigned int key, void*\
    \ value )\n{\n    //Step 1\n    size_t hashValue = hash( key, table.count );\n\
    \n    //Step 2\n    Entry *location = table.firstFree++;\n    location->key =\
    \ key;\n    location->value = value;\n\n    //Step 3\n    location->next = table.entries[hashValue]\
    \ ;\n    table.entries[hashValue] = location;\n}\n```\n```\n\nIf you have never\
    \ seen linked lists (or it's been a while), step 3 may be tricky to understand\
    \ at first. The existing list has its first node stored at table.entries[hashValue].\
    \ With this in mind, we can insert a new node at the head of the list in two steps:\
    \ First, we set our new entry's next pointer to point to the first node in the\
    \ existing list. Then, we store the new entry in the bucket array so it becomes\
    \ the first node of the new list."
  merge: -1
  img_proc: true
- pgno: 285
  md: "Since it's a good idea to have some idea whether the code you've written works,\
    \ we've implemented a routine to perform a sanity check on a hash table. The check\
    \ involves first walking through the table and examining every node. We compute\
    \ the hash function on the node's key and confirm that the node is stored in the\
    \ correct bucket. After checking every node, we verify that the number of nodes\
    \ actually in the table is indeed equal to the number of elements we intended\
    \ to add to the table. If these numbers don't agree, then either we've added a\
    \ node accidentally to multiple buckets or we haven't inserted it correctly.\n\
    \n```\n#define SIZE (100*1024*1024)\n#define ELEMENTS (SIZE / sizeof(unsigned\
    \ int))\n\nvoid verify_table( const Table &table ) {\n    int count = 0;\n   \
    \ for (size_t i=0; i<table.count; i++) {\n        Entry *current = table.entries[i];\n\
    \        while (current != NULL) {\n            ++count;\n            if (hash(\
    \ current->value, table.count ) != i)\n                printf( \"%d hashed to\
    \ %d, but was located \"\n                        \"at %d\\n\", current->value,\n\
    \                        hash( current->value, table.count ), i );\n         \
    \   current = current->next;\n        }\n    }\n    if (count != ELEMENTS)\n \
    \       printf( \"%d elements found in hash table. Should be %d\\n\",\n      \
    \          count, ELEMENTS );\n    else\n        printf( \"All %d elements found\
    \ in hash table.\\n\", count );\n}\n```"
  merge: -1
  img_proc: true
- pgno: 286
  md: "With all the infrastructure code out of the way, we can look at main(). As\
    \ with many of this book's examples, a lot of the heavy lifting has been done\
    \ in helper functions, so we hope that main() will be relatively easy to follow:\n\
    \n```\n#define HASH_ENTRIES 1024\n\nint main( void ) {\n    unsigned int *buffer\
    \ =\n        (unsigned int*)big_random_block( SIZE );\n\n    clock_t start, stop;\n\
    \    start = clock();\n\n    Table table;\n    initialize_table( table, HASH_ENTRIES,\
    \ ELEMENTS );\n\n    for (int i=0; i<ELEMENTS; i++) {\n        add_to_table( table,\
    \ buffer[i], (void*)NULL );\n    }\n\n    stop = clock();\n    float elapsedTime\
    \ = (float)(stop - start) /\n        (float)CLOCKS_PER_SEC * 1000.0f;\n    printf(\
    \ \"Time to hash: %.3f ms\\n\", elapsedTime );\n\n    verify_table( table );\n\
    \n    free_table( table );\n    free( buffer );\n\n    return 0;\n}\n```\n\nAs\
    \ you can see, we start by allocating a big chunk of random numbers. These randomly\
    \ generated unsigned integers will be the keys we insert into our hash table.\
    \ After generating the numbers, we read the system time in order to measure the\
    \ performance of our implementation. We initialize the table and then insert each\
    \ random key into the table using a for() loop. After adding all the keys, we\
    \ read the system time again to compute the elapsed time to initialize and add\
    \ the keys. Finally, we verify the hash table with our sanity check routine and\
    \ free the buffers we've allocated."
  merge: -1
  img_proc: true
- pgno: 287
  md: 'You probably noticed that we are using NULL as the value for every key/value
    pair. In a typical application, you would likely store some useful data with the
    key, but because we are primarily concerned with the hash table implementation
    itself, we''re storing a meaningless value with each key.


    # A.2.3 MULTITHREADED HASH TABLE


    There are some assumptions built into our CPU hash table that will no longer be
    valid when we move to the GPU. First, we have assumed that only one node can be
    added to the table at a time in order to make the addition of a node simpler.
    If more than one thread were trying to add a node to the table at once, we could
    end up with problems similar to the multithreaded addition problems in the example
    from Chapter 9.


    For example, let''s revisit our “avocado and aardvark” example and imagine that
    threads A and B are trying to add these entries to the table. Thread A computes
    a hash function on avocado, and thread B computes the function on aardvark. They
    both decide their keys belong in the same bucket. To add the new entry to the
    list, thread A and B start by setting their new entry’s next pointer to the first
    node of the existing list as in Figure A.4.


    Then, both threads try to replace the entry in the bucket array with their new
    entry. However, the thread that finishes second is the only thread that has its
    update preserved because it overwrites the work of the previous thread. So consider
    the scenario where thread A replaces the entry altitude with its entry for avocado.
    Immediately after finishing, thread B replaces what it believe to be the entry
    for altitude with its entry for aardvark. Unfortunately, it’s replacing avocado
    instead of altitude, resulting in the situation illustrated in Figure A.5.


    ![](img/d5750f02645080d2a91292047fbe0f98_287_0.png)


    Figure A.4 Multiple threads attempting to add a node to the same bucket'
  merge: -1
  img_proc: true
- pgno: 288
  md: '![](img/d5750f02645080d2a91292047fbe0f98_288_0.png)


    Figure A.5 The hash table after an unsuccessful concurrent modification by two
    threads


    Thread A''s entry is tragically “floating” outside of the hash table. Fortunately,
    our sanity check routine would catch this and alert us to the presence of a problem
    because it would count fewer nodes than we expected. But we still need to answer
    this question: How do we build a hash table on the GPU?! The key observation here
    involves the fact that only one thread can safely make modifications to a bucket
    at a time. This is similar to our dot product example where only one thread at
    a time could safely add its value to the final result. If each bucket had an atomic
    lock associated with it, we could ensure that only a single thread was making
    changes to a given bucket at a time.


    # A.2.4 A GPU HASH TABLE


    Armed with a method to ensure safe multithreaded access to the hash table, we
    can proceed with a GPU implementation of the hash table application we wrote in
    Section A.2.2: A CPU Hash Table. We’ll need to include `lock.h`, the implementation
    of our GPU `Lock` structure from Section A.1.1 Atomic Locks, and we’ll need to
    declare the hash function as a `__device__` function. Aside from these changes,
    the fundamental data structures and hash function are identical to the CPU implementation.'
  merge: -1
  img_proc: true
- pgno: 289
  md: "```\n#include \"../common/book.h\"\n#include \"lock.h\"\n\nstruct Entry {\n\
    \    unsigned int key;\n    void* value;\n    Entry *next;\n};\n\nstruct Table\
    \ {\n    size_t count;\n    Entry **entries;\n    Entry *pool;\n};\n\n__device__\
    \ __host__ size_t hash( unsigned int value,\n                                \
    \ size_t count ) {\n    return value % count;\n}\n}\n```\n\nInitializing and freeing\
    \ the hash table consists of the same steps as we performed on the CPU, but as\
    \ with previous examples, we use CUDA runtime functions to accomplish this. We\
    \ use cudaMalloc() to allocate a bucket array and a pool of entries, and we use\
    \ cudaMemset() to set the bucket array entries to zero. To free the memory upon\
    \ application completion, we use cudaFree().\n\n```\nvoid initialize_table( Table\
    \ *table, int entries,\n                       int elements ) {\n    table.count\
    \ = entries;\n    HANDLE_ERROR( cudaMalloc( (void**)&table.entries,\n        \
    \                      entries * sizeof( Entry*) ) );\n    HANDLE_ERROR( cudaMemset(\
    \ table.entries, 0,\n                              entries * sizeof( Entry*) )\
    \ );\n    HANDLE_ERROR( cudaMalloc( (void**)&table.pool,\n                   \
    \           elements * sizeof( Entry) ) );\n}\n```"
