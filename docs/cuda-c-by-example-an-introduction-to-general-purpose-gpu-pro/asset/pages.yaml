  md: "After the three allocations in our heat transfer simulation, we bind the three\
    \ allocations to the texture references declared earlier (texConstSrc, texIn,\
    \ and texOut).\n\n```\nHANDLE_ERROR( cudaMalloc( (void**)&data_dev_inSrc,\n imageSize\
    \ ) );\nHANDLE_ERROR( cudaMalloc( (void**)&data_dev_outSrc,\n imageSize ) );\n\
    HANDLE_ERROR( cudaMalloc( (void**)&data_dev_constSrc,\n imageSize ) );\n\nHANDLE_ERROR(\
    \ cudaBindTexture( NULL, texConstSrc,\n data_dev_constSrc,\n imageSize ) );\n\
    HANDLE_ERROR( cudaBindTexture( NULL, texIn,\n data_dev_inSrc,\n imageSize ) );\n\
    HANDLE_ERROR( cudaBindTexture( NULL, texOut,\n data_dev_outSrc,\n imageSize )\
    \ );\n```\n\nAt this point, our textures are completely set up, and we're ready\
    \ to launch our kernel. However, when we're reading from textures in the kernel,\
    \ we need to use special functions to instruct the GPU to route our requests through\
    \ the texture unit and not through standard global memory. As a result, we can\
    \ no longer simply use square brackets to read from buffers; we need to modify\
    \ blend_kernel () to use tex1Dfetch () when reading from memory.\n\nAdditionally,\
    \ there is another difference between using global and texture memory that requires\
    \ us to make another change. Although it looks like a function, tex1Dfetch ()\
    \ is a compiler intrinsic. And since texture references must be declared globally\
    \ at file scope, we can no longer pass the input and output buffers as parameters\
    \ to blend_kernel () because the compiler needs to know at compile time which\
    \ textures tex1Dfetch () should be sampling. Rather than passing pointers to input\
    \ and output buffers as we previously did, we will pass to blend_kernel () a boolean\
    \ flag dstOut that indicates which buffer to"
