- pgno: 217
  md: 'The opposite of a *synchronous* function is an *asynchronous* function, which
    inspired the name `cudaMemcpyAsync()`. The call to `cudaMemcpyAsync()` simply
    places a *request* to perform a memory copy into the stream specified by the argument
    `stream`. When the call returns, there is no guarantee that the copy has even
    started yet, much less that it has finished. The guarantee that we have is that
    the copy will definitely be performed before the next operation placed into the
    same stream. It is required that any host memory pointers passed to `cudaMemcpyAsync()`
    have been allocated by `cudaHostAlloc()`. That is, you are only allowed to schedule
    asynchronous copies to or from page-locked memory.


    Notice that the angle-bracketed kernel launch also takes an optional stream argument.
    This kernel launch is asynchronous, just like the preceding two memory copies
    to the GPU and the trailing memory copy back from the GPU. Technically, we can
    end an iteration of this loop without having actually started any of the memory
    copies or kernel execution. As we mentioned, all that we are guaranteed is that
    the first copy placed into the stream will execute before the second copy. Moreover,
    the second copy will complete before the kernel starts, and the kernel will complete
    before the third copy starts. So as we’ve mentioned earlier in this chapter, a
    stream acts just like an ordered queue of work for the GPU to perform.


    When the `for` loop has terminated, there could still be quite a bit of work queued
    up for the GPU to finish. If we would like to guarantee that the GPU is done with
    its computations and memory copies, we need to synchronize it with the host. That
    is, we basically want to tell the host to sit around and wait for the GPU to finish
    before proceeding. We accomplish that by calling `cudaStreamSynchronize()` and
    specifying the stream that we want to wait for:


    ```

    // copy result chunk from locked to full buffer

    HANDLE_ERROR( cudaStreamSynchronize( stream ) );

    ```


    Since the computations and copies have completed after synchronizing stream with
    the host, we can stop our timer, collect our performance data, and free our input
    and output buffers.'
