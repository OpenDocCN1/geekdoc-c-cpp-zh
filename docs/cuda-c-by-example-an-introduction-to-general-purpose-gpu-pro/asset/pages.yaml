    # 11.2.2 ZERO-COPY PERFORMANCE\n\nWhat should we expect to gain from using zero-copy\
    \ memory? The answer to this question is different for discrete GPUs and integrated\
    \ GPUs. Discrete GPUs are graphics processors that have their own dedicated DRAMs\
    \ and typically sit on separate circuit boards from the CPU. For example, if you\
    \ have ever installed a graphics card into your desktop, this GPU is a discrete\
    \ GPU. Integrated GPUs are graphics processors built into a system's chipset and\
    \ usually share regular"
