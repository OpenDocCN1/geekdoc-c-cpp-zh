  md: '# Chapter 8


    # Graphics Interoperability


    Since this book has focused on general-purpose computation, for the most part
    we''ve ignored that GPUs contain some special-purpose components as well. The
    GPU owes its success to its ability to perform complex rendering tasks in real
    time, freeing the rest of the system to concentrate on other work. This leads
    us to the obvious question: Can we use the GPU for both rendering and general-purpose
    computation in the same application? What if the images we want to render rely
    on the results of our computations? Or what if we want to take the frame we''ve
    rendered and perform some image-processing or statistics computations on it?


    Fortunately, not only is this interaction between general-purpose computation
    and rendering modes possible, but it''s fairly easy to accomplish given what you
    already know. CUDA C applications can seamlessly interoperate with either of the
    two most popular real-time rendering APIs, OpenGL and DirectX. This chapter will
    look at the mechanics by which you can enable this functionality.


    The examples in this chapter deviate some from the precedents we''ve set in previous
    chapters. In particular, this chapter assumes a significant amount about your
    background with other technologies. Specifically, we have included a considerable
    amount of OpenGL and GLUT code in these examples, almost none of which will we
    explain in great depth. There are many superb resources to learn graphics APIs,
    both online and in bookstores, but these topics are well beyond the'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'intended scope of this book. Rather, this chapter intends to focus on CUDA
    C and the facilities it offers to incorporate it into your graphics applications.
    If you are unfamiliar with OpenGL or DirectX, you are unlikely to derive much
    benefit from this chapter and may want to skip to the next.


    # 8.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn what *graphics interoperability* is and why you might use
    it.

    +   - You will learn how to set up a CUDA device for graphics interoperability.

    +   - You will learn how to share data between your CUDA C kernels and OpenGL
    rendering.


    # 8.2 Graphics Interoperation


    To demonstrate the mechanics of interoperation between graphics and CUDA C, we''ll
    write an application that works in two steps. The first step uses a CUDA C kernel
    to generate image data. In the second step, the application passes this data to
    the OpenGL driver to render. To accomplish this, we will use much of the CUDA
    C we have seen in previous chapters along with some OpenGL and GLUT calls.


    To start our application, we include the relevant GLUT and CUDA headers in order
    to ensure the correct functions and enumerations are defined. We also define the
    size of the window into which our application plans to render. At 512 x 512 pixels,
    we will do relatively small drawings.


    ```

    #define GL_GLEXT_PROTOTYPES

    #include "GL/glut.h"

    #include "cuda.h"

    #include "cuda_gl_interop.h"

    #include "../common/book.h"

    #include "../common/cpu_bitmap.h"


    #define DIM 512

    ```'
