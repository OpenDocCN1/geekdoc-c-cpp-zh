  md: "measurements. We proceed to allocate GPU memory for our array of random keys,\
    \ copy the array up to the device, and initialize our hash table:\n\n```\nint\
    \ main( void ) {\n    unsigned int *buffer =\n        (unsigned int*)big_random_block(\
    \ SIZE );\n\n    cudaEvent_t   start, stop;\n    HANDLE_ERROR( cudaEventCreate(\
    \ &start ) );\n    HANDLE_ERROR( cudaEventCreate( &stop ) );\n    HANDLE_ERROR(\
    \ cudaEventRecord( start, 0 ) );\n\n    unsigned int *dev_keys;\n    void    \
