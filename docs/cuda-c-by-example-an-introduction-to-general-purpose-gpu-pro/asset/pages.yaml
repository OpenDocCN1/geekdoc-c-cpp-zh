    \ the histogram back to the CPU, so we allocate a\n256-entry array and perform\
    \ a copy from device to host.\n\n```\nunsigned int histo[256];\nHANDLE_ERROR(\
    \ cudaMemcpy( histo, dev_histo,\n                          256 * sizeof( int ),\n\
    \                          cudaMemcpyDeviceToHost ) );\n```"
