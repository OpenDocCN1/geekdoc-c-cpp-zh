- pgno: 190
  md: 'Therefore, if our threads get scheduled unfavorably, we end up computing the
    wrong result. There are many other orderings for these six operations, some of
    which produce correct results and some of which do not. When moving from a single-threaded
    to a multithreaded version of this application, we suddenly have potential for
    unpredictable results if multiple threads need to read or write shared values.


    In the previous example, we need a way to perform the read-modify-write without
    being interrupted by another thread. Or more specifically, no other thread can
    read or write the value of x until we have completed our operation. Because the
    execution of these operations cannot be broken into smaller parts by other threads,
    we call operations that satisfy this constraint as atomic. CUDA C supports several
    atomic operations that allow you to operate safely on memory, even when thousands
    of threads are potentially competing for access.


    Now we’ll take a look at an example that requires the use of atomic operations
    to compute correct results.


    # 9.4 Computing Histograms


    Oftentimes, algorithms require the computation of a histogram of some set of data.
    If you haven’t had any experience with histograms in the past, that’s not a big
    deal. Essentially, given a data set that consists of some set of elements, a histogram
    represents a count of the frequency of each element. For example, if we created
    a histogram of the letters in the phrase Programming with CUDA C, we would end
    up with the result shown in Figure 9.1.


    Although simple to describe and understand, computing histograms of data arises
    surprisingly often in computer science. It’s used in algorithms for image processing,
    data compression, computer vision, machine learning, audio encoding, and many
    others. We will use histogram computation as the algorithm for the following code
    examples.


