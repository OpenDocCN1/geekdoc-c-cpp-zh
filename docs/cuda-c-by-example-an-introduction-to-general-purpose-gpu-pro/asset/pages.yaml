  md: "All of this should be commonplace to you now. So, how do we do the actual ray\
    \ tracing? Because we have settled on a very simple ray tracing model, our kernel\
    \ will be very easy to understand. Each thread is generating one pixel for our\
    \ output image, so we start in the usual manner by computing the x- and y-coordinates\
    \ for the thread as well as the linearized offset into our output buffer. We will\
    \ also shift our (x,y) image coordinates by DIM/2 so that the z-axis runs through\
    \ the center of the image.\n\n```\n__global__ void kernel( unsigned char *ptr\
    \ ) {\n    // map from threadIdx/blockIdx to pixel position\n    int x = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n    int y = threadIdx.y + blockIdx.y * blockDim.y;\n\
    \    int offset = x + y * blockDim.x * gridDim.x;\n    float ox = (x - DIM/2);\n\
    \    float oy = (y - DIM/2);\n}\n```\n\nSince each ray needs to check each sphere\
    \ for intersection, we will now iterate through the array of spheres, checking\
    \ each for a hit.\n\n```\nfloat r=0, g=0, b=0;\nfloat maxz = -INF;\nfor(int i=0;\
    \ i<SPHERES; i++) {\n    float n;\n    float t = s[i].hit( ox, oy, &n );\n   \
    \ if (t > maxz) {\n        float fscale = n;\n        r = s[i].r * fscale;\n \
    \       g = s[i].g * fscale;\n        b = s[i].b * fscale;\n    }\n}\n```\n\n\
    Clearly, the majority of the interesting computation lies in the `for()` loop.\
    \ We iterate through each of the input spheres and call its `hit()` method to\
    \ determine whether the ray from our pixel \"sees\" the sphere. If the ray hits\
    \ the current sphere, we determine whether the hit is closer to the camera than\
    \ the last sphere we hit. If it is closer, we store this depth as our new closest\
    \ sphere. In addition, we"
