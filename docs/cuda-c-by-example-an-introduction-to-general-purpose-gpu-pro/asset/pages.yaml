  md: "As an aside, you may be wondering why we fill the input arrays on the CPU.\
    \ There is no reason in particular why we _need_ to do this. In fact, the performance\
    \ of this step would be faster if we filled the arrays on the GPU. But we intend\
    \ to show how a particular operation, namely, the addition of two vectors, can\
    \ be implemented on a graphics processor. As a result, we ask you to imagine that\
    \ this is but one step of a larger application where the input arrays a [ ] and\
    \ b [ ] have been generated by some other algorithm or loaded from the hard drive\
    \ by the user. In summary, it will suffice to pretend that this data appeared\
    \ out of nowhere and now we need to do something with it.\n\nMoving on, our add()\
    \ routine looks similar to its corresponding CPU implementation:\n\n```\n__global__\
    \ void add(int *a, int *b, int *c) {\n    int tid = blockIdx.x;    // handle the\
    \ data at this index\n    if (tid < N)\n        c[tid] = a[tid] + b[tid];\n}\n\
    ```\n\nAgain we see a common pattern with the function add() :\n\n+   - We have\
    \ written a function called add() that executes on the device. We accomplished\
    \ this by taking C code and adding a __global__ qualifier to the function name.\n\
    \nSo far, there is nothing new in this example except it can do more than add\
    \ 2 and 7. However, there _are_ two noteworthy components of this example: The\
    \ parameters within the triple angle brackets and the code contained in the kernel\
    \ itself both introduce new concepts.\n\nUp to this point, we have always seen\
    \ kernels launched in the following form:\n\n```\nkernel<<<1,1>>>( param1, param2,\
    \ ... );\n```\n\nBut in this example we are launching with a number in the angle\
    \ brackets that is not 1:\n\n```\nadd<<<N,1>>>( dev_a, dev_b, dev_c );\n```\n\n\
    What gives?"
