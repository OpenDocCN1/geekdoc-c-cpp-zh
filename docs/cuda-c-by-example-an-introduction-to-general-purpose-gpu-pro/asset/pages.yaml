  md: '# 6.3 Measuring Performance with Events


    Fully aware that there may be either positive or negative implications, you have
    changed your ray tracer to use constant memory. How do you determine how this
    has impacted the performance of your program? One of the simplest metrics involves
    answering this simple question: Which version takes less time to finish? We could
    use one of the CPU or operating system timers, but this will include latency and
    variation from any number of sources (operating system thread scheduling, availability
    of high-precision CPU timers, and so on). Furthermore, while the GPU kernel runs,
    we may be asynchronously performing computation on the host. The only way to time
    these host computations is using the CPU or operating system timing mechanism.
    So to measure the time a GPU spends on a task, we will use the CUDA event API.


    An event in CUDA is essentially a GPU time stamp that is recorded at a user-specified
    point in time. Since the GPU itself is recording the time stamp, it eliminates
    a lot of the problems we might encounter when trying to time GPU execution with
    CPU timers. The API is relatively easy to use, since taking a time stamp consists
    of just two steps: creating an event and subsequently recording an event. For
    example, at the beginning of some sequence of code, we instruct the CUDA runtime
    to make a record of the current time. We do so by creating and then recording
    the event:


    ```

    cudaEvent_t start;

    cudaEventCreate(&start);

    cudaEventRecord( start, 0 );

    ```


    You will notice that when we instruct the runtime to record the event start, we
    also pass it a second argument. In the previous example, this argument is 0. The
    exact nature of this argument is unimportant for our purposes right now, so we
    intend to leave it mysteriously unexplained rather than open a new can of worms.
    If your curiosity is killing you, we intend to discuss this when we talk about
    streams.


    To time a block of code, we will want to create both a start event and a stop
    event. We will have the CUDA runtime record when we start tell it to do some other
    work on the GPU and then tell it to record when we''ve stopped:'
