- pgno: 191
  md: "# 9.4.1 CPU HISTOGRAM COMPUTATION\n\nBecause the computation of a histogram\
    \ may not be familiar to all readers, we'll start with an example of how to compute\
    \ a histogram on the CPU. This example will also serve to illustrate how computing\
    \ a histogram is relatively simple in a single-threaded CPU application. The application\
    \ will be given some large stream of data. In an actual application, the data\
    \ might signify anything from pixel colors to audio samples, but in our sample\
    \ application, it will be a stream of randomly generated bytes. We can create\
    \ this random stream of bytes using a utility function we have provided called\
    \ big_random_block(). In our application, we create 100MB of random data.\n\n\
    ```\n#include \"../common/book.h\"\n\n#define SIZE (100*1024*1024)\n\nint main(\
    \ void ) {\n    unsigned char *buffer = (unsigned char*)big_random_block( SIZE\
    \ );\n}\n```\n\nSince each random 8-bit byte can be any of 256 different values\
    \ (from 0x00 to 0xFF), our histogram needs to contain 256 bins in order to keep\
    \ track of the number of times each value has been seen in the data. We create\
    \ a 256-bin array and initialize all the bin counts to zero.\n\n```\nunsigned\
    \ int histo[256];\nfor (int i = 0; i < 256; i++)\n    histo[i] = 0;\n```\n\nOnce\
    \ our histogram has been created and all the bins are initialized to zero, we\
    \ need to tabulate the frequency with which each value appears in the data contained\
    \ in buffer[]. The idea here is that whenever we see some value z in the array\
    \ buffer[], we want to increment the value in bin z of our histogram. This way,\
    \ we're counting the number of times we have seen an occurrence of the value z."
  merge: -1
  img_proc: true
- pgno: 192
  md: "If buffer [i] is the current value we are looking at, we want to increment\
    \ the count we have in the bin numbered buffer [i]. Since bin buffer [i] is located\
    \ at histo [buffer [i]], we can increment the appropriate counter in a single\
    \ line of code.\n\n```\nhisto[buffer[i]]++;\n```\n\nWe do this for each element\
    \ in buffer [] with a simple for () loop:\n\n```\nfor (int i=0; i<SIZE; i++)\n\
    \    histo[buffer[i]]++;\n```\n\nAt this point, we've completed our histogram\
    \ of the input data. In a full application, this histogram might be the input\
    \ to the next step of computation. In our simple example, however, this is all\
    \ we care to compute, so we end our application by verifying that all the bins\
    \ of our histogram sum to the expected value.\n\n```\nlong histoCount = 0;\nfor\
    \ (int i=0; i<256; i++) {\n    histoCount += histo[i];\n}\nprintf( \"Histogram\
    \ Sum: %ld\\n\", histoCount );\n```\n\nIf you've followed closely, you will realize\
    \ that this sum will always be the same, regardless of the random input array.\
    \ Each bin counts the number of times we have seen the corresponding data element,\
    \ so the sum of all of these bins should be the total number of data elements\
    \ we've examined. In our case, this will be the value SIZE.\n\nAnd needless to\
    \ say(but we will anyway), we clean up after ourselves and return.\n\n```\nfree(\
    \ buffer );\nreturn 0;\n}\n```"
  merge: -1
  img_proc: true
