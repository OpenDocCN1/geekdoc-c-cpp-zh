- pgno: 109
  md: "is inside a conditional block like an if (...) ? Obviously not every thread\
    \ should execute that instruction, right? For example, consider a kernel that\
    \ contains the following fragment of code that intends for odd-indexed threads\
    \ to update the value of some variable:\n\n```\n```c\nint myVar = 0;\nif (threadIdx.x\
    \ % 2 )\n    myVar = threadIdx.x;\n```\n```\n\nIn the previous example, when the\
    \ threads arrive at the line in bold, only the threads with odd indices will execute\
    \ it since the threads with even indices do not satisfy the condition if ( threadIdx.x\
    \ % 2 ). The even-numbered threads simply do nothing while the odd threads execute\
    \ this instruction. When some of the threads need to execute an instruction while\
    \ others don't, this situation is known as thread divergence. Under normal circumstances,\
    \ divergent branches simply result in some threads remaining idle, while the other\
    \ threads actually execute the instructions in the branch.\n\nBut in the case\
    \ of __syncthreads(), the result is somewhat tragic. The CUDA Architecture guarantees\
    \ that no thread will advance to an instruction beyond the __syncthreads() until\
    \ every thread in the block has executed the __syncthreads(). Unfortunately, if\
    \ the __syncthreads() sits in a divergent branch, some of the threads will never\
    \ reach the __syncthreads(). Therefore, because of the guarantee that no instruction\
    \ after a __syncthreads() can be executed before every thread has executed it,\
    \ the hardware simply continues to wait for these threads. And waits. And waits.\
    \ Forever.\n\nThis is the situation in the dot product example when we move the\
    \ __syncthreads() call inside the if (...) block. Any thread with cacheIndex greater\
    \ than or equal to i will never execute the __syncthreads(). This effectively\
    \ hangs the processor because it results in the GPU waiting for something that\
    \ will never happen.\n\n```\n```c\nif (cacheIndex < i) {\n    cache[cacheIndex]\
    \ += cache[cacheIndex + i];\n    __syncthreads();\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 110
  md: "The moral of this story is that __syncthreads() is a powerful mechanism for\
    \ ensuring that your massively parallel application still computes the correct\
    \ results. But because of this potential for unintended consequences, we still\
    \ need to take care when using it.\n\n# 5.3.2 SHARED MEMORY BITMAP\n\nWe have\
    \ looked at examples that use shared memory and employed __syncthreads() to ensure\
    \ that data is ready before we continue. In the name of speed, you may be tempted\
    \ to live dangerously and omit the __syncthreads(). We will now look at a graphical\
    \ example that requires __syncthreads() for correctness. We will show you screenshots\
    \ of the intended output and of the output when run without __syncthreads(). It\
    \ won't be pretty.\n\nThe body of main() is identical to the GPU Julia Set example,\
    \ although this time we launch multiple threads per block:\n\n```\n#include \"\
    cuda.h\"\n#include \"..//common/book.h\"\n#include \"..//common/cpu_bitmap.h\"\
    \n\n#define DIM 1024\n#define PI 3.1415926535897932f\n\nint main( void ) {\n \
    \   CPUBitmap bitmap( DIM, DIM );\n    unsigned char *dev_bitmap;\n\n    HANDLE_ERROR(\
    \ cudaMalloc( (void**)&dev_bitmap,\n                              bitmap.image_size()\
    \ ) );\n\n    dim3    grids(DIM/16,DIM/16);\n    dim3    threads(16,16);\n   \
    \ kernel<<<grids,threads>>>( dev_bitmap );\n```"
  merge: -1
  img_proc: true
