- pgno: 204
  md: 'massively parallel architectures such as the GPU can make our lives as programmers
    more difficult. Trying to cope with potentially tens of thousands of threads simultaneously
    modifying the same memory addresses is a common situation where a massively parallel
    machine can seem burdensome. Fortunately, we have hardware-supported atomic operations
    available to help ease this pain.


    However, as you saw with the histogram computation, sometimes reliance on atomic
    operations introduces performance issues that can be resolved only by rethinking
    parts of the algorithm. In the histogram example, we moved to a two-stage algorithm
    that alleviated contention for global memory addresses. In general, this strategy
    of looking to lessen memory contention tends to work well, and you should keep
    it in mind when using atomics in your own applications.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Chapter 10


    # Streams


    Time and time again in this book we have seen how the massively data-parallel
    execution engine on a GPU can provide stunning performance gains over comparable
    CPU code. However, there is yet another class of parallelism to be exploited on
    NVIDIA graphics processors. This parallelism is similar to the task parallelism
    that is found in multithreaded CPU applications. Rather than simultaneously computing
    the same function on lots of data elements as one does with data parallelism,
    task parallelism involves doing two or more completely different tasks in parallel.


    In the context of parallelism, a task could be any number of things. For example,
    an application could be executing two tasks: redrawing its GUI with one thread
    while downloading an update over the network with another thread. These tasks
    proceed in parallel, despite having nothing in common. Although the task parallelism
    on GPUs is not currently as flexible as a general-purpose processor’s, it still
    provides opportunities for us as programmers to extract even more speed from our
    GPU-based implementations. In this chapter, we will look at CUDA streams and the
    ways in which their careful use will enable us to execute certain operations simultaneously
    on the GPU.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# 10.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn about allocating page-locked host memory.

    +   - You will learn what CUDA streams are.

    +   - You will learn how to use CUDA streams to accelerate your applications.


    # 10.2 Page-Locked Host Memory


    In every example over the course of nine chapters, you have seen us allocate memory
    on the GPU with cudaMalloc(). On the host, we have always allocated memory with
    the vanilla, C library routine malloc(). However, the CUDA runtime offers its
    own mechanism for allocating host memory: cudaHostAlloc(). Why would you bother
    using this function when malloc() has served you quite well since day one of your
    life as a C programmer?


    In fact, there is a significant difference between the memory that malloc() will
    allocate and the memory that cudaHostAlloc() allocates. The C library function
    malloc() allocates standard, pageable host memory, while cudaHostAlloc() allocates
    a buffer of page-locked host memory. Sometimes called pinned memory, page-locked
    buffers have an important property: The operating system guarantees us that it
    will never page this memory out to disk, which ensures its residency in physical
    memory. The corollary to this is that it becomes safe for the OS to allow an application
    access to the physical address of the memory, since the buffer will not be evicted
    or relocated.


    Knowing the physical address of a buffer, the GPU can then use direct memory access
    [DMA] to copy data to or from the host. Since DMA copies proceed without intervention
    from the CPU, it also means that the CPU could be simultaneously paging these
    buffers out to disk or relocating their physical address by updating the operating
    system''s pagetables. The possibility of the CPU moving pageable data means that
    using pinned memory for a DMA copy is essential. In fact, even when you attempt
    to perform a memory copy with pageable memory, the CUDA driver still uses DMA
    to transfer the buffer to the GPU. Therefore, your copy'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'happens twice, first from a pageable system buffer to a page-locked “staging”
    buffer and then from the page-locked system buffer to the GPU.


    As a result, whenever you perform memory copies from pageable memory, you guarantee
    that the copy speed will be bounded by the lower of the PCIe transfer speed and
    the system front-side bus speeds. A large disparity in bandwidth between these
    buses in some systems ensures that page-locked host memory enjoys roughly a twofold
    performance advantage over standard pageable memory when used for copying data
    between the GPU and the host. But even in a world where PCI Express and front-side
    bus speeds were identical, pageable buffers would still incur the overhead of
    an additional CPU-managed copy.


    However, you should resist the temptation to simply do a search-and-replace on
    malloc to convert every one of your calls to use cudaHostAlloc(). Using pinned
    memory is a double-edged sword. By doing so, you have effectively opted out of
    all the nice features of virtual memory. Specifically, the computer running the
    application needs to have available physical memory for every page-locked buffer,
    since these buffers can never be swapped out to disk. This means that your system
    will run out of memory much faster than it would if you stuck to standard malloc()
    calls. Not only does this mean that your application might start to fail on machines
    with smaller amounts of physical memory, but it means that your application can
    affect the performance of other applications running on the system.


    These warnings are not meant to scare you out of using cudaHostAlloc(), but you
    should remain aware of the implications of page-locking buffers. We suggest trying
    to restrict their use to memory that will be used as a source or destination in
    calls to cudaMemcpy() and freeing them when they are no longer needed rather than
    waiting until application shutdown to release the memory. The use of cudaHostAlloc()
    should be no more difficult than anything else you’ve studied so far, but let’s
    take a look at an example that will both illustrate how pinned memory is allocated
    and demonstrate its performance advantage over standard pageable memory.


    Our application will be very simple and serves primarily to benchmark cudaMemcpy()
    performance with both pageable and page-locked memory. All we endeavor to do is
    allocate a GPU buffer and a host buffer of matching sizes and then execute some
    number of copies between these two buffers. We’ll allow the user of this benchmark
    to specify the direction of the copy, either “up” [from host to device] or “down”
    [from device to host]. You will also notice that, in order to obtain accurate
    timings, we set up CUDA events for the start and stop'
