    \ c = 0;\n    float *dev_a, *dev_b, *dev_c;\n\n    // allocate memory on the CPU\
    \ side\n    a = (float*)malloc( N*sizeof(float) );\n    b = (float*)malloc( N*sizeof(float)\
    \ );\n\n    // allocate the memory on the GPU\n    HANDLE_ERROR( cudaMalloc( (void**)&dev_a,\n\
    \                              N*sizeof(float) ) );\n    HANDLE_ERROR( cudaMalloc(\
    \ (void**)&dev_b,\n                              N*sizeof(float) ) );\n    HANDLE_ERROR(\
