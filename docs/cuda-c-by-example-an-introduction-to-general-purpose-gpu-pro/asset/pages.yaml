  md: "```\ncudaFree( dev_histo );\ncudaFree( dev_buffer );\nfree( buffer );\nreturn\
    \ 0;\n}\n```\n\n# HISTOGRAM KERNEL USING GLOBAL MEMORY ATOMICS\n\nAnd now for\
    \ the fun part: the GPU code that computes the histogram! The kernel that computes\
    \ the histogram itself needs to be given a pointer to the input data array, the\
    \ length of the input array, and a pointer to the output histogram. The first\
    \ thing our kernel needs to compute is a linearized offset into the input data\
    \ array. Each thread will start with an offset between 0 and the number of threads\
    \ minus 1. It will then stride by the total number of threads that have been launched.\
    \ We hope you remember this technique; we used the same logic to add vectors of\
    \ arbitrary length when you first learned about threads.\n\n```\n#include \"../common/book.h\"\
    \n\n#define SIZE (100*1024*1024)\n\n__global__ void histo_kernel( unsigned char\
    \ *buffer,\n                              long size,\n                       \
    \       unsigned int *histo ) {\n    int i = threadIdx.x + blockIdx.x * blockDim.x;\n\
    \    int stride = blockDim.x * gridDim.x;\n```\n\nOnce each thread knows its starting\
    \ offset i and the stride it should use, the code walks through the input array\
    \ incrementing the corresponding histogram bin.\n\n```\nwhile ( i < size ) {\n\
    \    atomicAdd( &(histo[buffer[i]]), 1 );\n    i += stride;\n}\n```"
