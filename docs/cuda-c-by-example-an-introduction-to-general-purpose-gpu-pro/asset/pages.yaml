- pgno: 67
  md: "parameters, this boundary forms a fractal, one of the most interesting and\
    \ beautiful curiosities of mathematics.\n\nThe calculations involved in generating\
    \ such a set are quite simple. At its heart, the Julia Set evaluates a simple\
    \ iterative equation for points in the complex plane. A point is not in the set\
    \ if the process of iterating the equation diverges for that point. That is, if\
    \ the sequence of values produced by iterating the equation grows toward infinity,\
    \ a point is considered *outside* the set. Conversely, if the values taken by\
    \ the equation remain bounded, the point *is* in the set.\n\nComputationally,\
    \ the iterative equation in question is remarkably simple, as shown in Equation\
    \ 4.1.\n\n# Equation 4.1\n\n$Z_{n+1} = Z_n^2 + C$\n\nComputing an iteration of\
    \ Equation 4.1 would therefore involve squaring the current value and adding a\
    \ constant to get the next value of the equation.\n\n# CPU JULIA SET\n\nWe will\
    \ examine a source listing now that will compute and visualize the Julia Set.\
    \ Since this is a more complicated program than we have studied so far, we will\
    \ split it into pieces here. Later in the chapter, you will see the entire source\
    \ listing.\n\n```\nint main( void ) {\n\tCPUBitmap bitmap( DIM, DIM );\n\tunsigned\
    \ char *ptr = bitmap.get_ptr();\n\tkernel( ptr );\n\tbitmap.display_and_exit();\n\
    }\n```\n\nOur main routine is remarkably simple. It creates the appropriate size\
    \ bitmap image using a utility library provided. Next, it passes a pointer to\
    \ the bitmap data to the kernel function."
