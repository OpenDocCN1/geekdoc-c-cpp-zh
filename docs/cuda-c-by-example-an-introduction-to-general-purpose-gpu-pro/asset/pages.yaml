  img_proc: true
- pgno: 68
  md: "```\nvoid kernel ( unsigned char *ptr ) {\n    for (int y=0; y<DIM; y++) {\n\
    \        for (int x=0; x<DIM; x++) {\n            int offset = x + y * DIM;\n\n\
    \            int juliaValue = julia( x, y );\n            ptr[offset*4 + 0] =\
    \ 255 * juliaValue;\n            ptr[offset*4 + 1] = 0;\n            ptr[offset*4\
    \ + 2] = 0;\n            ptr[offset*4 + 3] = 255;\n        }\n    }\n}\n```\n\n\
    The computation kernel does nothing more than iterate through all points we care\
    \ to render, calling julia() on each to determine membership in the Julia Set.\
    \ The function julia() will return 1 if the point is in the set and 0 if it is\
    \ not in the set. We set the point's color to be red if julia() returns 1 and\
    \ black if it returns 0. These colors are arbitrary, and you should feel free\
    \ to choose a color scheme that matches your personal aesthetics.\n\n```\nint\
    \ julia( int x, int y ) {\n    const float scale = 1.5;\n    float jx = scale\
    \ * (float)(DIM/2 - x)/(DIM/2);\n    float jy = scale * (float)(DIM/2 - y)/(DIM/2);\n\
    \n    cuComplex c(-0.8, 0.156);\n    cuComplex a(jx, jy);\n\n    int i = 0;\n\
    \    for (i=0; i<200; i++) {\n        a = a * a + c;\n        if (a.magnitude2()\
    \ > 1000)\n            return 0;\n    }\n\n    return 1;\n}\n```"
