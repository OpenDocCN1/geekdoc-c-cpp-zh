- pgno: 84
  md: 'Indexing the data in a linear array using the previous assignment actually
    is quite intuitive. If you disagree, it may help to think about your collection
    of blocks of threads spatially, similar to a two-dimensional array of pixels.
    We depict this arrangement in Figure 5.1.


    If the threads represent columns and the blocks represent rows, we can get a unique
    index by taking the product of the block index with the number of threads in each
    block and adding the thread index within the block. This is identical to the method
    we used to linearize the two-dimensional image index in the Julia Set example.


    ```

    int offset = x + y * DIM;

    ```


    Here, DIM is the block dimension (measured in threads), y is the block index,
    and x is the thread index within the block. Hence, we arrive at the index: tid
    = threadIdx.x + blockIdx.x * blockDim.x.


    The other change is to the kernel launch itself. We still need N parallel threads
    to launch, but we want them to launch across multiple blocks so we do not hit
    the 512-thread limitation imposed upon us. One solution is to arbitrarily set
    the block size to some fixed number of threads; for this example, let''s use 128
    threads per block. Then we can launch N/128 blocks to get our total of N threads
    running.


    The wrinkle here is that N/128 is an integer divisor. This implies that if N were
    127, N/128 would be zero, and we will not actually compute anything if we launch


    | | Thread 0 | Thread 1 | Thread 2 | Thread 3 |

    |---|---|---|---|---|

    | Block 0 | Thread 0 | Thread 1 | Thread 2 | Thread 3 |

    | Block 1 | Thread 0 | Thread 1 | Thread 2 | Thread 3 |

    | Block 2 | Thread 0 | Thread 1 | Thread 2 | Thread 3 |

    | Block 3 | Thread 0 | Thread 1 | Thread 2 | Thread 3 |


    Figure 5.1 A two-dimensional arrangement of a collection of blocks and threads'
