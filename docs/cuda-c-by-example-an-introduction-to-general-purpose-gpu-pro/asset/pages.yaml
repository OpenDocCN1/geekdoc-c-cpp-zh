- pgno: 64
  md: "Recall that we left those two numbers in the angle brackets unexplained; we\
    \ stated vaguely that they were parameters to the runtime that describe how to\
    \ launch the kernel. Well, the first number in those parameters represents the\
    \ number of parallel blocks in which we would like the device to execute our kernel.\
    \ In this case, we’re passing the value N for this parameter.\n\nFor example,\
    \ if we launch with kernel<<<2, 1>>> (), you can think of the runtime creating\
    \ two copies of the kernel and running them in parallel. We call each of these\
    \ parallel invocations a block. With kernel<<<256, 1>>> (), you would get 256\
    \ blocks running on the GPU. Parallel programming has never been easier.\n\nBut\
    \ this raises an excellent question: The GPU runs N copies of our kernel code,\
    \ but how can we tell from within the code which block is currently running? This\
    \ question brings us to the second new feature of the example: the kernel code\
    \ itself. Specifically, it brings us to the variable blockIdx.x:\n\n```\n__global__\
    \ void add(int *a, int *b, int *c) {\n    int tid = blockIdx.x; // handle the\
    \ data at this index\n    if (tid < N)\n        c[tid] = a[tid] + b[tid];\n}\n\
    ```\n\nAt first glance, it looks like this variable should cause a syntax error\
    \ at compile time since we use it to assign the value of tid, but we have never\
    \ defined it. However, there is no need to define the variable blockIdx; this\
    \ is one of the built-in variables that the CUDA runtime defines for us. Furthermore,\
    \ we use this variable for exactly what it sounds like it means. It contains the\
    \ value of the block index for whichever block is currently running the device\
    \ code.\n\nWhy, you may then ask, is it not just blockIdx? Why blockIdx.x? As\
    \ it turns out, CUDA C allows you to define a group of blocks in two dimensions.\
    \ For problems with two-dimensional domains, such as matrix math or image processing,\
    \ it is often convenient to use two-dimensional indexing to avoid annoying translations\
    \ from linear to rectangular indices. Don’t worry if you aren’t familiar with\
    \ these problem types; just know that using two-dimensional indexing can sometimes\
    \ be more convenient than one-dimensional indexing. But you never have to use\
    \ it. We won’t be offended."
