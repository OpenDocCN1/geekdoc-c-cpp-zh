    \ Although we routinely create and schedule this many threads on a GPU, one would\
    \ not dream of creating this many threads on a CPU. Because CPU thread management\
    \ and scheduling must be done in software, it simply cannot scale to the number\
    \ of threads that a GPU can. Because we can simply create a thread for each data\
    \ element we want to process, parallel programming on a GPU can be far simpler\
    \ than on a CPU.\n\nAfter declaring the variables that hold the dimensions of\
    \ our launch, we simply launch the kernel that will compute our pixel values.\n\
    \n```\nkernel<<< blocks,threads>>>( d->dev_bitmap, ticks );\n```\n\nThe kernel\
    \ will need two pieces of information that we pass as parameters. First, it needs\
