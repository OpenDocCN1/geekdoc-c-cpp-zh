- pgno: 71
  md: 'bitmap image using our utility library. But because we will be doing computation
    on a GPU, we also declare a pointer called `dev_bitmap` to hold a copy of the
    data on the device. And to hold data, we need to allocate memory using `cudaMalloc()`.


    We then run our `kernel()` function exactly like in the CPU version, although
    now it is a `__global__` function, meaning it will run on the GPU. As with the
    CPU example, we pass `kernel()` the pointer we allocated in the previous line
    to store the results. The only difference is that the memory resides on the GPU
    now, not on the host system.


    The most significant difference is that we specify how many parallel blocks on
    which to execute the function `kernel()`. Because each point can be computed independently
    of every other point, we simply specify one copy of the function for each point
    we want to compute. We mentioned that for some problem domains, it helps to use
    two-dimensional indexing. Unsurprisingly, computing function values over a two-dimensional
    domain such as the complex plane is one of these problems. So, we specify a two-dimensional
    grid of blocks in this line:


    ```

    dim3 grid(DIM,DIM);

    ```


    The type `dim3` is not a standard C type, lest you feared you had forgotten some
    key pieces of information. Rather, the CUDA runtime header files define some convenience
    types to encapsulate multidimensional tuples. The type `dim3` represents a three-dimensional
    tuple that will be used to specify the size of our launch. But why do we use a
    three-dimensional value when we oh-so-clearly stated that our launch is a *two-dimensional
    grid*?


    Frankly, we do this because a three-dimensional, `dim3` value is what the CUDA
    runtime expects. Although a three-dimensional launch grid is not currently supported,
    the CUDA runtime still expects a `dim3` variable where the last component equals
    1. When we initialize it with only two values, as we do in the statement `dim3
    grid(DIM, DIM)`, the CUDA runtime automatically fills the third dimension with
    the value 1, so everything here will work as expected. Although it''s possible
    that NVIDIA will support a three-dimensional grid in the future, for now we''ll
    just play nicely with the kernel launch API because when coders and APIs fight,
    the API always wins.'
