  md: "So, how do we draw the CUDA-generated buffer using OpenGL? Well, if you recall\
    \ the setup we performed in `main()`, you'll remember the following:\n\n```\n\
    glBindBuffer( GL_PIXEL_UNPACK_BUFFER_ARB, bufferObj );\n```\n\nThis call bound\
    \ the shared buffer as a pixel source for the OpenGL driver to use in all subsequent\
    \ calls to `glDrawPixels()` (). Essentially, this means that a call to `glDrawPixels()`\
    \ () is all that we need in order to render the image data our CUDA C kernel generated.\
    \ Consequently, the following is all that our `draw_func()` needs to do:\n\n```\n\
    static void draw_func( void ) {\n    glDrawPixels( DIM, DIM, GL_RGBA, GL_UNSIGNED_BYTE,\
    \ 0 );\n    glutSwapBuffers( );\n}\n```\n\nIt's possible you've seen `glDrawPixels()`\
    \ with a buffer pointer as the last argument. The OpenGL driver will copy from\
    \ this buffer if no buffer is bound as a `GL_PIXEL_UNPACK_BUFFER_ARB` source.\
    \ However, since our data is already on the GPU and we have bound our shared buffer\
    \ as the `GL_PIXEL_UNPACK_BUFFER_ARB` source, this last parameter instead becomes\
    \ an offset into the bound buffer. Because we want to render the entire buffer,\
    \ this offset is zero for our application.\n\nThe last component to this example\
    \ seems somewhat anticlimactic, but we've decided to give our users a method to\
    \ exit the application. In this vein, our `key_func()` callback responds only\
    \ to the Esc key and uses this as a signal to clean up and exit:\n\n```\nstatic\
    \ void key_func( unsigned char key, int x, int y ) {\n    switch ( key ) {\n \
    \       case 27:\n            // clean up OpenGL and CUDA\n            HANDLE_ERROR(\
    \ cudaGraphicsUnregisterResource( resource ) );\n            glBindBuffer( GL_PIXEL_UNPACK_BUFFER_ARB,\
    \ 0 );\n            glDeleteBuffers( 1, &bufferObj );\n            exit( 0 );\n\
    \    }\n}\n```"
