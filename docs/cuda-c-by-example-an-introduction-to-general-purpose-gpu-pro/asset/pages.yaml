    \ it's very similar to things we have seen so far. The problem with computing\
    \ a histogram from the input data arises from the fact that multiple threads may\
    \ want to increment the same bin of the output histogram at the same time. In\
    \ this situation, we will need to use atomic increments to avoid a situation like\
    \ the one described in Section 9.2: Atomic Operations Overview.\n\nOur main()\
    \ routine looks very similar to the CPU version, although we will need to add\
    \ some of the CUDA C plumbing in order to get input to the GPU and results from\
    \ the GPU. However, we start exactly as we did on the CPU:\n\n```\nint main( void\
    \ ) {\n    unsigned char *buffer = (unsigned char*)big_random_block( SIZE );\n\
    }\n```\n\nWe will be interested in measuring how our code performs, so we initialize\
    \ events for timing exactly like we always have.\n\n```\ncudaEvent_t   start,\
    \ stop;\n\nHANDLE_ERROR( cudaEventCreate( &start ) );\nHANDLE_ERROR( cudaEventCreate(\
    \ &stop ) );\nHANDLE_ERROR( cudaEventRecord( start, 0 ) );\n```\n\nAfter setting\
    \ up our input data and events, we look to GPU memory. We will need to allocate\
    \ space for our random input data and our output histogram. After allocating the\
    \ input buffer, we copy the array we generated with"
