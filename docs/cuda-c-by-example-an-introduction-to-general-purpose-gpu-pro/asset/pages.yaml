  md: "We know that OpenGL and the CUDA runtime will have different names for our\
    \ GPU buffer, and we know that we will need to refer to both of these names, depending\
    \ on whether we are making OpenGL or CUDA C calls. Therefore, our structure will\
    \ store both OpenGLs bufferObj name and the CUDA runtime's resource name. Since\
    \ we are dealing with a bitmap image that we intend to display, we know that the\
    \ image will have a width and height to it.\n\nTo allow users of our GPUAnimBitmap\
    \ to register for certain callback events, we will also store a void* pointer\
    \ to arbitrary user data in dataBlock. Our class will never look at this data\
    \ but will simply pass it back to any registered callback functions. The callbacks\
    \ that a user may register are stored in fAnim, animExit, and clickDrag. The function\
    \ fAnim() gets called in every call to glutIdleFunc(), and this function is responsible\
    \ for producing the image data that will be rendered in the animation. The function\
    \ animExit() will be called once, when the animation exits. This is where the\
    \ user should implement cleanup code that needs to be executed when the animation\
