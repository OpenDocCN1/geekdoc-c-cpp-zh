- pgno: 116
  md: '# 6.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn about using constant memory with CUDA C.

    +   - You will learn about the performance characteristics of constant memory.

    +   - You will learn how to use CUDA events to measure application performance.


    # 6.2 Constant Memory


    Previously, we discussed how modern GPUs are equipped with enormous amounts of
    arithmetic processing power. In fact, the computational advantage graphics processors
    have over CPUs helped precipitate the initial interest in using graphics processors
    for general-purpose computing. With hundreds of arithmetic units on the GPU, often
    the bottleneck is not the arithmetic throughput of the chip but rather the memory
    bandwidth of the chip. There are so many ALUs on graphics processors that sometimes
    we just can’t keep the input coming to them fast enough to sustain such high rates
    of computation. So, it is worth investigating means by which we can reduce the
    amount of memory traffic required for a given problem.


    We have seen CUDA C programs that have used both global and shared memory so far.
    However, the language makes available another kind of memory known as *constant
    memory*. As the name may indicate, we use constant memory for data that will not
    change over the course of a kernel execution. NVIDIA hardware provides 64kB of
    constant memory that it treats differently than it treats standard global memory.
    In some situations, using constant memory rather than global memory will reduce
    the required memory bandwidth.


    # 6.2.1 RAY TRACING INTRODUCTION


    We will look at one way of exploiting constant memory in the context of a simple
    *ray tracing* application. First, we will give you some background in the major
    concepts behind ray tracing. If you are already comfortable with the concepts
    behind ray tracing, you can skip to the “Ray Tracing on the GPU” section.'
