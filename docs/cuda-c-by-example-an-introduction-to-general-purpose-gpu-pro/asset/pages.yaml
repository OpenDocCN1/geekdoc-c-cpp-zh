- pgno: 112
  md: 'And lastly, we store these values back out to the pixel, reversing the order
    of x and y:


    ```

    ptr[offset*4 + 0] = 0;

    ptr[offset*4 + 1] = shared[15-threadIdx.x][15-threadIdx.y];

    ptr[offset*4 + 2] = 0;

    ptr[offset*4 + 3] = 255;

    }

    ```


    Granted, these computations are somewhat arbitrary. We''ve simply come up with
    something that will draw a grid of green spherical blobs. So after compiling and
    running this kernel, we output an image like the one in Figure 5.5.


    What happened here? As you may have guessed from the way we set up this example,
    we''re missing an important synchronization point. When a thread stores the computed
    value in shared[][] to the pixel, it is possible that the thread responsible for
    writing that value to shared[][] has not finished writing it yet. The only way
    to guarantee that this does not happen is by using __syncthreads(). Thus, the
    result is a corrupted picture of green blobs.


    ![](img/d5750f02645080d2a91292047fbe0f98_112_0.png)


    Figure 5.5 A screenshot rendered without proper synchronization'
