  md: "Since we do very little work in the kernel, it is quite likely that the atomic\
    \ operation on global memory is causing the problem. Essentially, when thousands\
    \ of threads are trying to access a handful of memory locations, a great deal\
    \ of contention for our 256 histogram bins can occur. To ensure atomicity of the\
    \ increment operations, the hardware needs to serialize operations to the same\
    \ memory location. This can result in a long queue of pending operations, and\
    \ any performance gain we might have had will vanish. We will need to improve\
    \ the algorithm itself in order to recover this performance.\n\n# HISTOGRAM KERNEL\
    \ USING SHARED AND GLOBAL MEMORY ATOMICS\n\nIronically, despite that the atomic\
    \ operations cause this performance degradation, alleviating the slowdown actually\
    \ involves using *more* atomics, not fewer. The core problem was not the use of\
    \ atomics so much as the fact that thousands of threads were competing for access\
    \ to a relatively small number of memory addresses. To address this issue, we\
    \ will split our histogram computation into two phases.\n\nIn phase one, each\
    \ parallel block will compute a separate histogram of the data that its constituent\
    \ threads examine. Since each block does this independently, we can compute these\
    \ histograms in shared memory, saving us the time of sending each write-off chip\
    \ to DRAM. Doing this does not free us from needing atomic operations, though,\
    \ since multiple threads within the block can still examine data elements with\
    \ the same value. However, the fact that only 256 threads will now be competing\
    \ for 256 addresses will reduce contention from the global version where thousands\
    \ of threads were competing.\n\nThe first phase then involves allocating and zeroing\
    \ a shared memory buffer to hold each block's intermediate histogram. Recall from\
    \ Chapter 5 that since the subsequent step will involve reading and modifying\
    \ this buffer, we need a __syncthreads() call to ensure that every thread's write\
    \ has completed before proceeding.\n\n```\n__global__ void histo_kernel( unsigned\
    \ char *buffer,\n                              long size,\n                  \
    \            unsigned int *histo ) {\n    __shared__ unsigned int temp[256];\n\
    \    temp[threadIdx.x] = 0;\n    __syncthreads();\n```"
