  md: "we update our shared memory variable cache[] and need these updates to be visible\
    \ to every thread on the next iteration through the loop.\n\n```\nint i = blockDim.x/2;\n\
    while (i != 0) {\n    if (cacheIndex < i)\n        cache[cacheIndex] += cache[cacheIndex\
    \ + i];\n    __syncthreads();\n    i /= 2;\n}\n```\n\nObserve that we update our\
    \ shared memory buffer cache[] only if cacheIndex is less than i. Since cacheIndex\
    \ is really just threadIdx.x, this means that only some of the threads are updating\
    \ entries in the shared memory cache. Since we are using __syncthreads only to\
    \ ensure that these updates have taken place before proceeding, it stands to reason\
    \ that we might see a speed improvement only if we wait for the threads that are\
    \ actually writing to shared memory. We do this by moving the synchronization\
    \ call inside the if () block:\n\n```\nint i = blockDim.x/2;\nwhile (i != 0) {\n\
    \    if (cacheIndex < i) {\n        cache[cacheIndex] += cache[cacheIndex + i];\n\
    \        __syncthreads();\n    }\n    i /= 2;\n}\n```\n\nAlthough this was a valiant\
    \ effort at optimization, it will not actually work. In fact, the situation is\
    \ worse than that. This change to the kernel will actually cause the GPU to stop\
    \ responding, forcing you to kill your program. But what could have gone so catastrophically\
    \ wrong with such a seemingly innocuous change?\n\nTo answer this question, it\
    \ helps to imagine every thread in the block marching through the code one line\
    \ at a time. At each instruction in the program, every thread executes the same\
    \ instruction, but each can operate on different data. But what happens when the\
    \ instruction that every thread is supposed to execute"
