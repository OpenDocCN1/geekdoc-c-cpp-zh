    \ to mouse click/drag events. If the user registers this function, it gets called\
    \ after every sequence of mouse button press, drag, and release events. The location\
    \ of the initial mouse click in this sequence is stored in (dragStartX, dragStartY)\
    \ so that the start and endpoints of the click/drag event can be passed to the\
