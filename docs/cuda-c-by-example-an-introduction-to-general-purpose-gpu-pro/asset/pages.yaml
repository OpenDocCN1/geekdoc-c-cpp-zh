    \    HANDLE_ERROR( cudaMalloc( (void**)&dev_values, SIZE ) );\n    HANDLE_ERROR(\
    \ cudaMemcpy( dev_keys, buffer, SIZE,\n                              cudaMemcpyHostToDevice\
    \ ) );\n\n    // copy the values to dev_values here\n    // filled in by user\
    \ of this code example\n\n    Table table;\n    initialize_table( table, HASH_ENTRIES,\
