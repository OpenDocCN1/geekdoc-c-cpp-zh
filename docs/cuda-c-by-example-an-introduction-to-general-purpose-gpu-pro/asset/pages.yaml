- pgno: 79
  md: '# Chapter 5


    # Thread Cooperation


    We have now written our first program using CUDA C as well as have seen how to
    write code that executes in parallel on a GPU. This is an excellent start! But
    arguably one of the most important components to parallel programming is the means
    by which the parallel processing elements cooperate on solving a problem. Rare
    are the problems where every processor can compute results and terminate execution
    without a passing thought as to what the other processors are doing. For even
    moderately sophisticated algorithms, we will need the parallel copies of our code
    to communicate and cooperate. So far, we have not seen any mechanisms for accomplishing
    this communication between sections of CUDA C code executing in parallel. Fortunately,
    there is a solution, one that we will begin to explore in this chapter.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# ## 5.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn about what CUDA C calls threads.

    +   - You will learn a mechanism for different threads to communicate with each
    other.

    +   - You will learn a mechanism to synchronize the parallel execution of different
    threads.


    # ## 5.2 Splitting Parallel Blocks


    In the previous chapter, we looked at how to launch parallel code on the GPU.
    We did this by instructing the CUDA runtime system on how many parallel copies
    of our kernel to launch. We call these parallel copies blocks.


    The CUDA runtime allows these blocks to be split into threads. Recall that when
    we launched multiple parallel blocks, we changed the first argument in the angle
    brackets from 1 to the number of blocks we wanted to launch. For example, when
    we studied vector addition, we launched a block for each element in the vector
    of size N by calling this:


    ```

    add<<<N, 1>>>( dev_a, dev_b, dev_c );

    ```


    Inside the angle brackets, the second parameter actually represents the number
    of threads per block we want the CUDA runtime to create on our behalf. To this
    point, we have only ever launched one thread per block. In the previous example,
    we launched the following:


    ```

    N blocks x 1 thread/block = N parallel threads

    ```


    So really, we could have launched N/2 blocks with two threads per block, N/4 blocks
    with four threads per block, and so on. Let''s revisit our vector addition example
    armed with this new information about the capabilities of CUDA C.


    # ### 5.2.1 VECTOR SUMS: REDUX


    We endeavor to accomplish the same task as we did in the previous chapter. That
    is, we want to take two input vectors and store their sum in a third output vector.
    However, this time we will use threads instead of blocks to accomplish this.'
  merge: -1
  img_proc: true
- pgno: 81
  md: "You may be wondering, what is the advantage of using threads rather than blocks?\
    \ Well, for now, there is no advantage worth discussing. But parallel threads\
    \ within a block will have the ability to do things that parallel blocks cannot\
    \ do. So for now, be patient and humor us while we walk through a parallel thread\
    \ version of the parallel block example from the previous chapter.\n\n# GPU VECTOR\
    \ SUMS USING THREADS\n\nWe will start by addressing the two changes of note when\
    \ moving from parallel blocks to parallel threads. Our kernel invocation will\
    \ change from one that launches N blocks of one thread apiece:\n\n```\nadd<<<N,1>>>(\
    \ dev_a, dev_b, dev_c );\n```\n\nto a version that launches N threads, all within\
    \ one block:\n\n```\nadd<<<1,N>>>( dev_a, dev_b, dev_c );\n```\n\nThe only other\
    \ change arises in the method by which we index our data. Previously, within our\
    \ kernel we indexed the input and output data by block index.\n\n```\nint tid\
    \ = blockIdx.x;\n```\n\nThe punch line here should not be a surprise. Now that\
    \ we have only a single block, we have to index the data by thread index.\n\n\
    ```\nint tid = threadIdx.x;\n```\n\nThese are the only two changes required to\
    \ move from a parallel block implementation to a parallel thread implementation.\
    \ For completeness, here is the entire source listing with the changed lines in\
    \ bold:\n\n```\n#include \"../common/book.h\"\n\n#define N 10\n\n__global__ void\
    \ add( int *a, int *b, int *c ) {\n    int tid = threadIdx.x;\n    if (tid < N)\n\
    \        c[tid] = a[tid] + b[tid];\n}\n```"
