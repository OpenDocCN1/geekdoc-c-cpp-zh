  md: "# # 11.3 Using Multiple GPUs\n\nIn the previous section, we mentioned how devices\
    \ are either integrated or discrete GPUs, where the former is built into the system's\
    \ chipset and the latter is typically an expansion card in a PCI Express slot.\
    \ More and more systems contain both integrated and discrete GPUs, meaning that\
    \ they also have multiple CUDA-capable processors. NVIDIA also sells products,\
    \ such as the GeForce GTX 295, that contain more than one GPU. A GeForce GTX 295,\
    \ while physically occupying a single expansion slot, will appear to your CUDA\
    \ applications as two separate GPUs. Furthermore, users can also add multiple\
    \ GPUs to separate PCI Express slots, connecting them with bridges using NVIDIA's\
    \ scalable link interface (SLI) technology. As a result of these trends, it has\
    \ become relatively common to have a CUDA application running on a system with\
    \ multiple graphics processors. Since our CUDA applications tend to be very parallelizable\
    \ to begin with, it would be excellent if we could use every CUDA device in the\
    \ system to achieve maximum throughput. So, let's figure out how we can accomplish\
    \ this.\n\nTo avoid learning a new example, let's convert our dot product to use\
    \ multiple GPUs. To make our lives easier, we will summarize all the data necessary\
    \ to compute a dot product in a single structure. You'll see momentarily exactly\
    \ why this will make our lives easier.\n\n```\n```c\nstruct DataStruct {\n   \
    \ int    deviceID;\n    int    size;\n    float  *a;\n    float  *b;\n    float\
    \  returnValue;\n};\n```\n```\n\nThis structure contains the identification for\
    \ the device on which the dot product will be computed; it contains the size of\
    \ the input buffers as well as pointers to the two inputs a and b. Finally, it\
    \ has an entry to store the value computed as the dot product of a and b.\n\n\
    To use N GPUs, we first would like to know exactly what value of N we're dealing\
    \ with. So, we start our application with a call to cudaGetDeviceCount() in"
  merge: -1
