    \ launch too many blocks, we will just fix the number of blocks to some reasonably\
    \ small value. Since we like copying and pasting so much, we will use 128 blocks,\
    \ each with 128 threads.\n\n```\nadd<<<128,128>>>( dev_a, dev_b, dev_c );\n```\n\
    \nYou should feel free to adjust these values however you see fit, provided that\
    \ your values remain within the limits we’ve discussed. Later in the book, we\
    \ will discuss the potential performance implications of these choices, but for\
    \ now it suffices to choose 128 threads per block and 128 blocks. Now we can add\
    \ vectors of arbitrary length, limited only by the amount of RAM we have on our\
    \ GPU. Here is the entire source listing:\n\n```\n#include \"../../common/book.h\"\
    \n\n#define N (33 * 1024)\n\n__global__ void add(int *a, int *b, int *c) {\n \
    \   int tid = threadIdx.x + blockIdx.x * blockDim.x;\n    while (tid < N) {\n\
    \        c[tid] = a[tid] + b[tid];\n        tid += blockDim.x * gridDim.x;\n \
    \   }\n}\n```"
