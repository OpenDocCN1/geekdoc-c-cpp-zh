  md: "Additionally, we declare two global variables that will store handles to the\
    \ data we intend to share between OpenGL and data. We will see momentarily how\
    \ we use these two variables, but they will store different handles to the same\
    \ buffer. We need two separate variables because OpenGL and CUDA will both have\
    \ different \"names\" for the buffer. The variable bufferObj will be OpenGL's\
    \ name for the data, and the variable resource will be the CUDA C name for it.\n\
    \n```\nGLuint bufferObj;\ncudaGraphicsResource *resource;\n```\n\nNow let's take\
    \ a look at the actual application. The first thing we do is select a CUDA device\
    \ on which to run our application. On many systems, this is not a complicated\
    \ process, since they will often contain only a single CUDA-enabled GPU. However,\
    \ an increasing number of systems contain more than one CUDA-enabled GPU, so we\
    \ need a method to choose one. Fortunately, the CUDA runtime provides such a facility\
    \ to us.\n\n```\nint main( int argc, char **argv ) {\n    cudaDeviceProp prop;\n\
    \    int dev;\n    memset( &prop, 0, sizeof( cudaDeviceProp ) );\n    prop.major\
    \ = 1;\n    prop.minor = 0;\n    HANDLE_ERROR( cudaChooseDevice( &dev, &prop )\
    \ );\n}\n```\n\nYou may recall that we saw cudaChooseDevice() in Chapter 3, but\
    \ since it was something of an ancillary point, we'll review it again now. Essentially,\
    \ this code tells the runtime to select any GPU that has a compute capability\
    \ of version 1.0 or better. It accomplishes this by first creating and clearing\
    \ a cudaDeviceProp structure and then by setting its major version to 1 and minor\
    \ version to 0. It passes this information to cudaChooseDevice(), which instructs\
    \ the runtime to select a GPU in the system that satisfies the constraints specified\
    \ by the cudaDeviceProp structure. In the next chapter, we will look more at what\
    \ is meant by a GPU's compute capability, but for now it suffices to say that\
    \ it roughly indicates the features a GPU supports. All CUDA-capable GPUs have\
    \ at least compute capability 1.0, so the net effect of this call is that the\
    \ runtime will select any CUDA-capable device and return an identifier for this\
    \ device in the variable dev. There is no guarantee"
  merge: -1
  img_proc: true
- pgno: 162
  md: 'that this device is the best or fastest GPU, nor is there a guarantee that
    the device will be the same GPU from version to version of the CUDA runtime.


    If the result of device selection is so seemingly underwhelming, why do we bother
    with all this effort to fill a cudaDeviceProp structure and call cudaChooseDevice()
    to get a valid device ID? Furthermore, we never hassled with this tomfoolery before,
    so why now? These are good questions. It turns out that we need to know the CUDA
    device ID so that we can tell the CUDA runtime that we intend to use the device
    for CUDA and OpenGL. We achieve this with a call to cudaGLSetGLDevice(), passing
    the device ID dev we obtained from cudaChooseDevice():


    ```

    HANDLE_ERROR( cudaGLSetGLDevice( dev ) );

    ```


    After the CUDA runtime initialization, we can proceed to initialize the OpenGL
    driver by calling our GL Utility Toolkit (GLUT) setup functions. This sequence
    of calls should look relatively familiar to you''ve used GLUT before:


    ```

    // these GLUT calls need to be made before the other GL calls

    glutInit( &argc, argv );

    glutInitDisplayMode( GLUT_DOUBLE | GLUT_RGBA );

    glutInitWindowSize( DIM, DIM );

    glutCreateWindow( "bitmap" );

    ```


    At this point in main(), we''ve prepared our CUDA runtime to play nicely with
    the OpenGL driver by calling cudaGLSetGLDevice(). Then we initialized GLUT and
    created a window named "bitmap" in which to draw our results. Now we can get on
    to the actual OpenGL interoperation!


    Shared data buffers are the key component to interoperation between CUDA C kernels
    and OpenGL rendering. To pass data between OpenGL and CUDA, we will first need
    to create a buffer that can be used with both APIs. We start this process by creating
    a pixel buffer object in OpenGL and storing the handle in our global variable
    GLuint bufferObj:


    ```

    glGenBuffers( 1, &bufferObj );

    glBindBuffer( GL_PIXEL_UNPACK_BUFFER_ARB, bufferObj );

    glBufferData( GL_PIXEL_UNPACK_BUFFER_ARB, DIM * DIM * 4,

    NULL, GL_DYNAMIC_DRAW_ARB );

    ```'
