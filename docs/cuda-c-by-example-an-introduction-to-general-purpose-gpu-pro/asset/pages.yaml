- pgno: 98
  md: "Finally, we clear our shared memory buffer so that later we will be able to\
    \ blindly sum the entire array without worrying whether a particular entry has\
    \ valid data stored there:\n\n```\n// set the cache values\ncache[cacheIndex]\
    \ = temp;\n```\n\nIt will be possible that not every entry will be used if the\
    \ size of the input vectors is not a multiple of the number of threads per block.\
    \ In this case, the last block will have some threads that do nothing and therefore\
    \ do not write values.\n\nEach thread computes a running sum of the product of\
    \ corresponding entries in a and b. After reaching the end of the array, each\
    \ thread stores its temporary sum into the shared buffer.\n\n```\nfloat temp =\
    \ 0;\nwhile (tid < N) {\n    temp += a[tid] * b[tid];\n    tid += blockDim.x *\
    \ gridDim.x;\n}\n\n// set the cache values\ncache[cacheIndex] = temp;\n```\n\n\
    At this point in the algorithm, we need to sum all the temporary values we've\
    \ placed in the cache. To do this, we will need some of the threads to read the\
    \ values that have been stored there. However, as we mentioned, this is a potentially\
    \ dangerous operation. We need a method to guarantee that all of these writes\
    \ to the shared array cache [] complete before anyone tries to read from this\
    \ buffer. Fortunately, such a method exists:\n\n```\n// synchronize threads in\
    \ this block\n__syncthreads ();\n```\n\nThis call guarantees that every thread\
    \ in the block has completed instructions prior to the __syncthreads () before\
    \ the hardware will execute the next"
  merge: -1
  img_proc: true
- pgno: 99
  md: "instruction on any thread. This is exactly what we need! We know know that\
    \ when the first thread executes the first instruction after our __syncthreads(),\
    \ every other thread in the block has also finished executing up to the __syncthreads().\n\
    \nNow that we have guaranteed that our temporary cache has been filled, we can\
    \ sum the values in it. We call the general process of taking an input array and\
    \ performing some computations that produce a smaller array of results a reduction.\
    \ Reductions arise often in parallel computing, which leads to the desire to give\
    \ them a name.\n\nThe naïve way to accomplish this reduction would be having one\
    \ thread iterate over the shared memory and calculate a running sum. This will\
    \ take us time proportional to the length of the array. However, since we have\
    \ hundreds of threads available to do our work, we can do this reduction in parallel\
    \ and take that is proportional to the logarithm of the length of the array. At\
    \ first, the following code will look convoluted; we'll break it down in a moment.\n\
    \nThe general idea is that each thread will add two of the values in cache []\
    \ and store the result back to cache []. Since each thread combines two entries\
    \ into one, we complete this step with half as many entries as we started with.\
    \ In the next step, we do the same thing on the remaining half. We continue in\
    \ this fashion for log2 (threadsPerBlock) steps until we have the sum of every\
    \ entry in cache []. For our example, we're using 256 threads per block, so it\
    \ takes 8 iterations of this process to reduce the 256 entries in cache [] to\
    \ a single sum.\n\nThe code for this follows:\n\n```\n```c\n// for reductions,\
    \ threadsPerBlock must be a power of 2\n// because of the following code\nint\
    \ i = blockDim.x/2;\nwhile (i > 0) {\n    if (cacheIndex < i)\n        cache[cacheIndex]\
    \ += cache[cacheIndex + i];\n    __syncthreads();\n    i /= 2;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 100
  md: "![](img/d5750f02645080d2a91292047fbe0f98_100_0.png)\n\nFigure 5.4 One step\
    \ of a summation reduction\n\nFor the first step, we start with i as half the\
    \ number of threadsPerBlock. We only want the threads with indices less than this\
    \ value to do any work, so we conditionally add two entries of cache [] if the\
    \ thread's index is less than i. We protect our addition within an if (cacheIndex\
    \ < i) block. Each thread will take the entry at its index in cache [], add it\
    \ to the entry at its index offset by i, and store this sum back to cache [].\n\
    \nSuppose there were eight entries in cache [], and, as a result, i had the value\
    \ 4. One step of the reduction would look like Figure 5.4.\n\nAfter we have completed\
    \ a step, we have the same restriction we did after computing all the pairwise\
    \ products. Before we can read the values we just stored in cache [], we need\
    \ to ensure that every thread that needs to write to cache [] has already done\
    \ so. The __syncthreads () after the assignment ensures this condition is met.\n\
    \nAfter termination of the while () loop, each block has but a single number remaining.\
    \ This number is sitting in the first entry of cache [] and is the sum of every\
    \ pairwise product the threads in that block computed. We then store this single\
    \ value to global memory and end our kernel:\n\n```\nif (cacheIndex == 0)\n  \
    \  c[blockIdx.x] = cache[0] ;\n}\n```"
  merge: -1
