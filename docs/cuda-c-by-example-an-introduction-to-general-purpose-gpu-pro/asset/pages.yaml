    \ we get too deep into writing device code, we would love to have a mechanism\
    \ for determining which devices (if any) are present and what capabilities each\
    \ device supports. Fortunately, there is a very easy interface to determine this\
    \ information. First, we will want to know how many devices in the system were\
    \ built on the CUDA Architecture. These devices will be capable of executing kernels\
    \ written in CUDA C. To get the count of CUDA devices, we call cudaGetDeviceCount\
    \ (). Needless to say, we anticipate receiving an award for Most Creative Function\
    \ Name.\n\n```\nint count;\nHANDLE_ERROR ( cudaGetDeviceCount ( &count ) );\n\
    ```\n\nAfter calling cudaGetDeviceCount (), we can then iterate through the devices\
    \ and query relevant information about each. The CUDA runtime returns us these\
