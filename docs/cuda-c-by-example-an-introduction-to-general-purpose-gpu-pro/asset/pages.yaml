  md: "passed to our kernel. We achieve this by instructing the CUDA runtime to map\
    \ the shared resource and then by requesting a pointer to the mapped resource.\n\
    \n```\nuchar4 * devPtr;\nsize_t size;\nHANDLE_ERROR( cudaGraphicsMapResources(\
    \ 1, &resource, NULL ) );\nHANDLE_ERROR(\n    cudaGraphicsResourceGetMappedPointer(\
    \ (void**)&devPtr,\n    &size,\n    resource )\n);\n```\n\nWe can then use devPtr\
    \ as we would use any device pointer, except that the data can also be used by\
    \ OpenGL as a pixel source. After all these setup shenanigans, the rest of main()\
    \ proceeds as follows: First, we launch our kernel, passing it the pointer to\
    \ our shared buffer. This kernel, the code of which we have not seen yet, generates\
    \ image data to be rendered. Next, we unmap our shared resource. This call is\
    \ important to make prior to performing rendering tasks because it allows synchronization\
    \ between the CUDA and graphics portions of the application. Specifically, it\
    \ implies that all CUDA operations performed prior to the call to cudaGraphicsUnmapResources()\
    \ will complete before ensuing graphics calls begin.\n\nLastly, we register our\
    \ keyboard and display callback functions with GLUT ([key_func and draw_func],\
    \ and we relinquish control to the GLUT rendering loop with glutMainLoop().\n\n\
    ```\ndim3 grids(DIM/16,DIM/16);\ndim3 threads(16,16);\nkernel<<<grids, threads>>>(\
    \ devPtr );\n\nHANDLE_ERROR( cudaGraphicsUnmapResources( 1, &resource, NULL )\
    \ );\n\n// set up GLUT and kick off main loop\nglutKeyboardFunc( key_func );\n\
    glutDisplayFunc( draw_func );\nglutMainLoop();\n}\n```"
