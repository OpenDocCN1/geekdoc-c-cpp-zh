  md: "people to have more than one CUDA-capable device per computer. In situations\
    \ like this, we will definitely want a way to determine which processor is which.\n\
    \nFor example, many motherboards ship with integrated NVIDIA graphics processors.\
    \ When a manufacturer or user adds a discrete graphics processor to this computer,\
    \ it then possesses two CUDA-capable processors. Some NVIDIA products, like the\
    \ GeForce GTX 295, ship with two GPUs on a single card. Computers that contain\
