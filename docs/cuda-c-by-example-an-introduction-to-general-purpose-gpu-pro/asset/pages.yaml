- pgno: 38
  md: 'You will again be asked to select your platform from among 32- and 64-bit versions
    of Windows XP, Windows Vista, Windows 7, Linux, and Mac OS. From the available
    downloads, you need to download the CUDA Toolkit in order to build the code examples
    contained in this book. Additionally, you are encouraged, although not required,
    to download the GPU Computing SDK code samples, which contains dozens of helpful
    example programs. The GPU Computing SDK code samples will not be covered in this
    book, but they nicely complement the material we intend to cover, and as with
    learning any style of programming, the more examples, the better. You should also
    take note that although nearly all the code in this book will work on the Linux,
    Windows, and Mac OS platforms, we have targeted the applications toward Linux
    and Windows. If you are using Mac OS X, you will be living dangerously and using
    unsupported code examples.


    # 2.2.4 STANDARD C COMPILER


    As we mentioned, you will need a compiler for GPU code and a compiler for CPU
    code. If you downloaded and installed the CUDA Toolkit as suggested in the previous
    section, you have a compiler for GPU code. A compiler for CPU code is the only
    component that remains on our CUDA checklist, so let''s address that issue so
    we can get to the interesting stuff.


    # WINDOWS


    On Microsoft Windows platforms, including Windows XP, Windows Vista, Windows Server
    2008, and Windows 7, we recommend using the Microsoft Visual Studio C compiler.
    NVIDIA currently supports both the Visual Studio 2005 and Visual Studio 2008 families
    of products. As Microsoft releases new versions, NVIDIA will likely add support
    for newer editions of Visual Studio while dropping support for older versions.
    Many C and C++ developers already have Visual Studio 2005 or Visual Studio 2008
    installed on their machine, so if this applies to you, you can safely skip this
    subsection.


    If you do not have access to a supported version of Visual Studio and aren''t
    ready to invest in a copy, Microsoft does provide free downloads of the Visual
    Studio 2008 Express edition on its website. Although typically unsuitable for
