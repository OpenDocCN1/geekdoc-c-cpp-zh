- pgno: 101
  md: "Why do we do this global store only for the thread with cacheIndex == 0? Well,\
    \ since there is only one number that needs writing to global memory, only a single\
    \ thread needs to perform this operation. Conceivably, every thread could perform\
    \ this write and the program would still work, but doing so would create an unnecessarily\
    \ large amount of memory traffic to write a single value. For simplicity, we chose\
    \ the thread with index 0, though you could conceivably have chosen any cacheIndex\
    \ to write cache [0] to global memory. Finally, since each block will write exactly\
    \ one value to the global array c [], we can simply index it by blockIdx.x.\n\n\
    We are left with an array c [], each entry of which contains the sum produced\
    \ by one of the parallel blocks. The last step of the dot product is to sum the\
    \ entries of c []. Even though the dot product is not fully computed, we exit\
    \ the kernel and return control to the host at this point. But why do we return\
    \ to the host before the computation is complete?\n\nPreviously, we referred to\
    \ an operation like a dot product as a reduction. Roughly speaking, this is because\
    \ we produce fewer output data elements than we input. In the case of a dot product,\
    \ we always produce exactly one output, regardless of the size of our input. It\
    \ turns out that a massively parallel machine like a GPU tends to waste its resources\
    \ when performing the last steps of a reduction, since the size of the data set\
    \ is so small at that point; it is hard to utilize 480 arithmetic units to add\
    \ 32 numbers!\n\nFor this reason, we return control to the host and let the CPU\
    \ finish the final step of the addition, summing the array c []. In a larger application,\
    \ the GPU would now be free to start another dot product or work on another large\
    \ computation. However, in this example, we are done with the GPU.\n\nIn explaining\
    \ this example, we broke with tradition and jumped right into the actual kernel\
    \ computation. We hope you will have no trouble understanding the body of main()\
    \ up to the kernel call, since it is overwhelmingly similar to what we have shown\
    \ before.\n\n```\nconst int blocksPerGrid =\n    imin( 32, (N+threadsPerBlock-1)\
    \ / threadsPerBlock );\n\nint main( void )\n{\n    float *a, *b, c, *partial_c;\n\
    \    float *dev_a, *dev_b, *dev_partial_c;\n```"
  merge: -1
