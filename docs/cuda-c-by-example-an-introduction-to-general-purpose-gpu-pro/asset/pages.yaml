  md: "big_random_block() to the GPU. Likewise, after allocating the histogram, we\n\
    initialize it to zero just like we did in the CPU version.\n\n```\n// allocate\
    \ memory on the GPU for the file's data\nunsigned char *dev_buffer;\nunsigned\
    \ int *dev_histo;\nHANDLE_ERROR( cudaMalloc( (void**)&dev_buffer, SIZE ) );\n\
    HANDLE_ERROR( cudaMemcpy( dev_buffer, buffer, SIZE,\n                        \
    \  cudaMemcpyHostToDevice ) );\n\nHANDLE_ERROR( cudaMalloc( (void**)&dev_histo,\n\
    \                          256 * sizeof( long ) ) );\nHANDLE_ERROR( cudaMemset(\
    \ dev_histo, 0,\n                          256 * sizeof( int ) ) );\n```\n\nYou\
    \ may notice that we slipped in a new CUDA runtime function, cudaMemset().\nThis\
    \ function has a similar signature to the standard C function memset(), and\n\
    the two functions behave nearly identically. The difference in signature is between\n\
    these functions is that cudaMemset() returns an error code while the C library\n\
    function memset() does not. This error code will inform the caller whether\nanything\
    \ bad happened while attempting to set GPU memory. Aside from the\nerror code\
    \ return, the only difference is that cudaMemset() operates on GPU\nmemory while\
    \ memset() operates on host memory.\n\nAfter initializing the input and output\
