    # 9.3 Atomic Operations Overview


    Programmers typically never need to use atomic operations when writing traditional
    single-threaded applications. If this is the situation with you, don''t worry;
    we plan to explain what they are and why we might need them in a multithreaded
    application. To clarify atomic operations, we''ll look at one of the first things
    you learned when learning C or C++, the increment operator:


    ```

    x++;

    ```


    This is a single expression in standard C, and after executing this expression,
    the value in x should be one greater than it was prior to executing the increment.
    But what sequence of operations does this imply? To add one to the value of x,
    we first need to know what value is currently in x. After reading the value of
    x, we can modify it. And finally, we need to write this value back to x.


    So the three steps in this operation are as follows:


    +   1. Read the value in x.

    +   2. Add 1 to the value read in step 1.

    +   3. Write the result back to x.


    Sometimes, this process is generally called a read-modify-write operation, since
    step 2 can consist of any operation that changes the value that was read from
    x.


    Now consider a situation where two threads need to perform this increment on the
    value in x. Let''s call these threads A and B. For A and B to both increment the
    value in x, both threads need to perform the three operations we''ve described.
    Let''s suppose x starts with the value 7. Ideally we would like thread A and thread
    B to do the steps shown in Table 9.2.'
