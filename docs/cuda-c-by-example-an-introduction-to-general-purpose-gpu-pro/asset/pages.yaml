    \ This buffer was copied back to the CPU to compute the final sum. Now, the argument\
    \ c no longer points to a temporary buffer but to a single floating-point value\
    \ that will store the dot product of the vectors in a and b. But even with these\
    \ changes, the kernel starts out exactly as it did in Chapter 5:\n\n```\n__global__\
    \ void dot (Lock lock, float *a,\n    float *b, float *c) {\n    __shared__ float\
    \ cache[threadsPerBlock];\n    int tid = threadIdx.x + blockIdx.x * blockDim.x;\n\
    \    int cacheIndex = threadIdx.x;\n\n    float temp = 0;\n    while (tid < N)\
    \ {\n        temp += a[tid] * b[tid];\n        tid += blockDim.x * gridDim.x;\n\
    \    }\n\n    // set the cache values\n    cache[cacheIndex] = temp;\n\n    //\
    \ synchronize threads in this block\n    __syncthreads();\n\n    // for reductions,\
    \ threadsPerBlock must be a power of 2\n    // because of the following code\n\
    \    int i = blockDim.x/2;\n    while (i != 0) {\n        if (cacheIndex < i)\n\
    \            cache[cacheIndex] += cache[cacheIndex + i];\n        __syncthreads();\n\
    \        i /= 2;\n    }\n}\n```"
  merge: -1
