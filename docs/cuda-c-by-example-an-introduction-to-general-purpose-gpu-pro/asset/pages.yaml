- pgno: 43
  md: "meant to illustrate that, at its most basic, there is no difference between\
    \ CUDA C and the standard C to which you have grown accustomed.\n\nThe simplicity\
    \ of this example stems from the fact that it runs entirely on the host. This\
    \ will be one of the important distinctions made in this book; we refer to the\
    \ CPU and the system memory as the host and refer to the GPU and its memory as\
    \ the device. This example resembles almost all the code you have ever written\
    \ because it simply ignores any computing devices outside the host.\n\nTo remedy\
    \ that sinking feeling that you've invested in nothing more than an expensive\
    \ collection of trivialities, we will gradually build upon this simple example.\
    \ Let's look at something that uses the GPU (a device) to execute code. A function\
    \ that executes on the device is typically called a kernel.\n\n# 3.2.2 A KERNEL\
    \ CALL\n\nNow we will build upon our example with some code that should look more\
    \ foreign than our plain-vanilla “Hello, World!” program.\n\n```\n#include <iostream>\n\
    \n__global__ void kernel( void ) {\n}\n\nint main( void ) {\n    kernel<<<1,1>>>();\n\
    \    printf( \"Hello, World!\\n\" );\n    return 0;\n}\n```\n\nThis program makes\
    \ two notable additions to the original “Hello, World!” example:\n\n+   - An empty\
    \ function named kernel() qualified with __global__\n+   - A call to the empty\
    \ function, embellished with <<<1,1>>>\n\nAs we saw in the previous section, code\
    \ is compiled by your system's standard C compiler by default. For example, GNU\
    \ gcc might compile your host code"
  merge: -1
