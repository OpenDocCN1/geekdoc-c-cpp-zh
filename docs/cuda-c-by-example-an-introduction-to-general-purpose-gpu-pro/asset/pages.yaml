    if (cacheIndex == 0) {\n    lock.lock();\n    *c += cache[0];\n    lock.unlock();\n\
    }\n```\n\nThe main() routine is very similar to our original implementation, though\
    \ it does have a couple differences. First, we no longer need to allocate a buffer\
