- pgno: 292
  md: "to an Entry points somewhere within the `table_pool[]` array, but for the hash\
    \ table to be usable on the host, we need them to point to the same `Entry` in\
    \ the `hostTable.pool[]` array.\n\nGiven a GPU pointer X, we therefore need to\
    \ add the pointer's offset from `table.pool` to `hostTable.pool` to get a valid\
    \ host pointer. That is, the new pointer should be computed as follows:\n\n```\n\
    (X - table.pool) + hostTable.pool\n```\n\nWe perform this update for every `Entry`\
    \ pointer we've copied from the GPU: the `Entry` pointers in `hostTable.entries`\
    \ and the `next` pointer of every `Entry` in the table's pool of entries:\n\n\
    ```\nfor (int i = 0; i < table.count; i++) {\n    if (hostTable.entries[i] !=\
    \ NULL)\n        hostTable.entries[i] =\n            (Entry*) ((size_t) hostTable.entries[i]\
    \ -\n            (size_t) table.pool + (size_t) hostTable.pool);\n}\nfor (int\
    \ i = 0; i < ELEMENTS; i++) {\n    if (hostTable.pool[i].next != NULL)\n     \
    \   hostTable.pool[i].next =\n            (Entry*) ((size_t) hostTable.pool[i].next\
    \ -\n            (size_t) table.pool + (size_t) hostTable.pool);\n}\n```\n\nHaving\
    \ seen the data structures, hash function, initialization, cleanup, and verification\
    \ code, the most important piece remaining is the one that actually involves CUDA\
    \ C atomics. As arguments, the `add_to_table()` kernel will take an array of keys\
    \ and values to be added to the hash table. Its next argument is the hash table\
    \ itself, and the final argument is an array of locks that will be used to lock\
    \ each of the table's buckets. Since our input is two arrays that our threads\
    \ will need to index, we also need our all-too-common index linearization:\n\n\
    ```\n__global__ void add_to_table( unsigned int *keys, void **values,\n      \
    \                           Table table, Lock *lock ) {\n    int tid = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n    int stride = blockDim.x * gridDim.x;\n```"
