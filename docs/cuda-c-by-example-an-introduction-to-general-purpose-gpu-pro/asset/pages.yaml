- pgno: 33
  md: '# Chapter 2


    # Getting Started


    We hope that Chapter 1 has gotten you excited to get started learning CUDA C.
    Since this book intends to teach you the language through a series of coding examples,
    you’ll need a functioning development environment. Sure, you could stand on the
    sideline and watch, but we think you’ll have more fun and stay interested longer
    if you jump in and get some practical experience hacking CUDA C code as soon as
    possible. In this vein, this chapter will walk you through some of the hardware
    and software components you’ll need in order to get started. The good news is
    that you can obtain all of the software you’ll need for free, leaving you more
    money for whatever tickles your fancy.'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# ## 2.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will download all the software components required through this book.

    +   - You will set up an environment in which you can build code written in CUDA
    C.


    # ## 2.2 Development Environment


    Before embarking on this journey, you will need to set up an environment in which
    you can develop using CUDA C. The prerequisites to developing code in CUDA C are
    as follows:


    +   - A CUDA-enabled graphics processor

    +   - An NVIDIA device driver

    +   - A CUDA development toolkit

    +   - A standard C compiler


    To make this chapter as painless as possible, we''ll walk through each of these
    prerequisites now.


    # ### 2.2.1 CUDA-ENABLED GRAPHICS PROCESSORS


    Fortunately, it should be easy to find yourself a graphics processor that has
    been built on the CUDA Architecture because every NVIDIA GPU since the 2006 release
    of the GeForce 8800 GTX has been CUDA-enabled. Since NVIDIA regularly releases
    new GPUs based on the CUDA Architecture, the following will undoubtedly be only
    a partial list of CUDA-enabled GPUs. Nevertheless, the GPUs are all CUDA-capable.


    For a complete list, you should consult the NVIDIA website www.nvidia.com/cuda,
    although it is safe to assume that all recent GPUs (GPUs from 2007 on) with more
    than 256MB of graphics memory can be used to develop and run code written with
    CUDA C.'
  merge: -1
  img_proc: true
