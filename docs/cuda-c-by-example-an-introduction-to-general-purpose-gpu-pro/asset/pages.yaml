- pgno: 276
  md: "At this point in execution, the 256 threads in each block have summed their\
    \ 256 pairwise products and computed a single value that's sitting in cache [0].\
    \ Each thread block now needs to add its final value to the value at c. To do\
    \ this safely, we'll use the lock to govern access to this memory location, so\
    \ each thread needs to acquire the lock before updating the value *c. After adding\
    \ the block's partial sum to the value at c, it unlocks the mutex so other threads\
    \ can accumulate their values. After adding its value to the final result, the\
