  md: "# 5.3.1 DOT PRODUCT\n\nCongratulations! We have graduated from vector addition\
    \ and will now take a look at vector dot products (sometimes called an inner product).\
    \ We will quickly review what a dot product is, just in case you are unfamiliar\
    \ with vector mathematics (or it has been a few years). The computation consists\
    \ of two steps. First, we multiply corresponding elements of the two input vectors.\
    \ This is very similar to vector addition but utilizes multiplication instead\
    \ of addition. However, instead of then storing these values to a third, output\
    \ vector, we sum them all to produce a single scalar output.\n\nFor example, if\
    \ we take the dot product of two four-element vectors, we would get Equation 5.1.\n\
    \n# Equation 5.1\n\n(x1, x2, x3, x4) · (y1, y2, y3, y4) = x1y1 + x2y2 + x3y3 +\
    \ x4y4\n\nPerhaps the algorithm we tend to use is becoming obvious. We can do\
    \ the first step exactly how we did vector addition. Each thread multiplies a\
    \ pair of corresponding entries, and then every thread moves on to its next pair.\
    \ Because the result needs to be the sum of all these pairwise products, each\
    \ thread keeps a running sum of the pairs it has added. Just like in the addition\
    \ example, the threads increment their indices by the total number of threads\
    \ to ensure we don't miss any elements and don't multiply a pair twice. Here is\
    \ the first step of the dot product routine:\n\n```\n#include \"../common/book.h\"\
    \n\n#define imin(a,b) (a<b?a:b)\n\nconst int N = 33 * 1024;\nconst int threadsPerBlock\
    \ = 256;\n\n__global__ void dot( float *a, float *b, float *c ) {\n    __shared__\
    \ float cache[threadsPerBlock];\n    int tid = threadIdx.x + blockIdx.x * blockDim.x;\n\
    \    int cacheIndex = threadIdx.x;\n```"
  merge: -1
  img_proc: true
- pgno: 97
  md: "```\nfloat temp = 0;\nwhile (tid < N) {\n    temp += a[tid] * b[tid];\n   \
    \ tid += blockDim.x * gridDim.x;\n}\n// set the cache values\ncache[cacheIndex]\
    \ = temp;\n```\n\nAs you can see, we have declared a buffer of shared memory named\
    \ cache. This buffer will be used to store each thread's running sum. Soon we\
    \ will see why we do this, but for now we will simply examine the mechanics by\
    \ which we accomplish it. It is trivial to declare a variable to reside in shared\
    \ memory, and it is identical to the means by which you declare a variable as\
    \ static or volatile in standard C:\n\n```\n__shared__ float cache[threadsPerBlock];\n\
    ```\n\nWe declare the array of size threadsPerBlock so each thread in the block\
    \ has a place to store its temporary result. Recall that when we have allocated\
    \ memory globally, we allocated enough for every thread that runs the kernel,\
    \ or threadsPerBlock times the total number of blocks. But since the compiler\
    \ will create a copy of the shared variables for each block, we need to allocate\
    \ only enough memory such that each thread in the block has an entry.\n\nAfter\
    \ allocating the shared memory, we compute our data indices much like we have\
    \ in the past:\n\n```\nint tid = threadIdx.x + blockIdx.x * blockDim.x;\nint cacheIndex\
    \ = threadIdx.x;\n```\n\nThe computation for the variable tid should look familiar\
    \ by now; we are just combining the block and thread indices to get a global offset\
    \ into our input arrays. The offset into our shared memory cache is simply our\
    \ thread index. Again, we don't need to incorporate our block index into this\
    \ offset because each block has its own private copy of this shared memory."
  merge: -1
