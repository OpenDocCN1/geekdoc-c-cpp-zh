- pgno: 117
  md: 'Simply put, ray tracing is one way of producing a two-dimensional image of
    a scene consisting of three-dimensional objects. But isn’t this what GPUs were
    originally designed for? How is this different from what OpenGL or DirectX do
    when you play your favorite game? Well, GPUs do indeed solve this same problem,
    but they use a technique known as rasterization. There are many excellent books
    on rasterization, so we will not endeavor to explain the differences here. It
    suffices to say that they are completely different methods that solve the same
    problem.


    So, how does ray tracing produce an image of a three-dimensional scene? The idea
    is simple: We choose a spot in our scene to place an imaginary camera. This simplified
    digital camera contains a light sensor, so to produce an image, we need to determine
    what light would hit that sensor. Each pixel of the resulting image should be
    the same color and intensity of the ray of light that hits that spot sensor.


    Since light incident at any point on the sensor can come from any place in our
    scene, it turns out it’s easier to work backward. That is, rather than trying
    to figure out what light rays hits the pixel in question, what if we imagine shooting
    a ray from the pixel and into the scene? In this way, each pixel behaves something
    like an eye that is “looking” into the scene. Figure 6.1 illustrates these rays
    being cast out of each pixel and into the scene.


    ![](img/d5750f02645080d2a91292047fbe0f98_117_0.png)


    Figure 6.1 A simple ray tracing scheme'
  merge: -1
  img_proc: true
- pgno: 118
  md: 'We figure out what color is seen by each pixel by tracing a ray from the pixel
    in question through the scene until it hits one of our objects. We then say that
    the pixel would “see” this object and can assign its color based on the color
    of the object it sees. Most of the computation required by ray tracing is in the
    computation of these intersections of the ray with the objects in the scene.


    Moreover, in more complex ray tracing models, shiny objects in the scene can reflect
    rays, and translucent objects can refract the rays of light. This creates secondary
    rays, tertiary rays, and so on. In fact, this is one of the attractive features
    of ray tracing; it is very simple to get a basic ray tracer working, but we can
    build models of more complex phenomenon into the ray tracer in order to produce
    more realistic images.


    # 6.2.2 RAY TRACING ON THE GPU


    Since APIs such as OpenGL and DirectX are not designed to allow ray-traced rendering,
    we will have to use CUDA C to implement our basic ray tracer. Our ray tracer will
    be extraordinarily simple so that we can concentrate on the use of constant memory,
    so if you were expecting code that could form the basis of a full-blown production
    renderer, you will be disappointed. Our basic ray tracer will only support scenes
    of spheres, and the camera is restricted to the z-axis, facing the origin. Moreover,
    we will not support any lighting of the scene to avoid the complications of secondary
    rays. Instead of computing lighting effects, we will simply assign each sphere
    a color and then shade them with some precomputed function if they are visible.


    So, what will the ray tracer do? It will fire a ray from each pixel and keep track
    of which rays hit which spheres. It will also track the depth of each of these
    hits. In the case where a ray passes through multiple spheres, only the sphere
    closest to the camera can be seen. In essence, our “ray tracer” is not doing much
    more than hiding surfaces that cannot be seen by the camera.


    We will model our spheres with a data structure that stores the sphere’s center
    coordinate of {x, y, z}, its radius, and its color of {r, b, g}.'
  merge: -1
  img_proc: true
- pgno: 119
  md: "```\n```cpp\n#define INF 2e10f\n\nstruct Sphere {\n    float r,b,g;\n    float\
    \ radius;\n    float x,y,z;\n    __device__ float hit( float ox, float oy, float\
    \ *n ) {\n        float dx = ox - x;\n        float dy = oy - y;\n        if (dx*dx\
    \ + dy*dy < radius*radius) {\n            float dz = sqrtf( radius*radius - dx*dx\
    \ - dy*dy );\n            *n = dz / sqrtf( radius * radius );\n            return\
    \ dz + z;\n        }\n        return -INF;\n    }\n};\n```\n```\n\nYou will also\
    \ notice that the structure has a method called hit( float ox, float oy, float\
    \ *n ). Given a ray shot from the pixel at (ox, oy), this method computes whether\
    \ the ray intersects the sphere. If the ray does intersect the sphere, the method\
    \ computes the distance from the camera where the ray hits the sphere. We need\
    \ this information for the reason mentioned before: In the event that the ray\
    \ hits more than one sphere, only the closest sphere can actually be seen.\n\n\
    Our main() routine follows roughly the same sequence as our previous image-generating\
