- pgno: 270
  md: '# A.1 Dot Product Revisited


    In Chapter 5, we looked at the implementation of a vector dot product using CUDA
    C. This algorithm was one of a large family of algorithms known as reductions.
    If you recall, the algorithm computed the dot product of two input vectors by
    doing the following:


    +   1. Each thread in each block multiplies two corresponding elements of the
    input vectors and stores the products in shared memory.


    +   2. Although a block has more than one product, a thread adds two of the products
    and stores the result back to shared memory. Each step results in half as many
    values as it started with (this is where the term reduction comes from).


    +   3. When every block has a final sum, each one writes its value to global memory
    and exits.


    +   4. If the kernel ran with N parallel blocks, the CPU sums these remaining
    N values to generate the final dot product.


    This high-level look at the dot product algorithm is intended to be review, so
    if it''s been a while or you''ve had a couple glasses of Chardonnay, it may be
    worth the time to review Chapter 5. If you feel comfortable enough with the dot
    product code to continue, draw your attention to step 4 in the algorithm. Although
    it doesn''t involve copying much data to the host or performing many calculations
    on the CPU, moving the computation back to the CPU to finish is indeed as awkward
    as it sounds.


    But it''s more than an issue of an awkward step to the algorithm or the inelegance
    of the solution. Consider a scenario where a dot product computation is just one
    step in a long sequence of operations. If you want to perform every operation
    on the GPU because your CPU is busy with other tasks or computations, you''re
    out of luck. As it stands, you''ll be forced to stop computing on the GPU, copy
    intermediate results back to the host, finish the computation with the CPU, and
    finally upload that result back to the GPU and resume computing with your next
    kernel.


    Since this is an appendix on atomics and we have gone to such lengths to explain
    what a pain our original dot product algorithm is, you should see where we''re
    heading. We intend to fix our dot product using atomics so the entire computation
    can stay on the GPU, leaving your CPU free to perform other tasks. Ideally,'
  merge: -1
  img_proc: true
- pgno: 271
  md: 'instead of exiting the kernel in step 3 and returning to the CPU in step 4,
    we want each block to add its final result to a total in global memory. If each
    value were added atomically, we would not have to worry about potential collisions
    or indeterminate results. Since we have already used an atomicAdd() operation
    in the histogram operation, this seems like an obvious choice.


    Unfortunately, prior to compute capability 2.0, atomicAdd() operated only on integers.
    Although this might be fine if you plan to compute dot products of vectors with
    integer components, it is significantly more common to use floating-point components.
    However, the majority of NVIDIA hardware does not support atomic arithmetic on
    floating-point numbers! But there''s a reasonable explanation for this, so don''t
    throw your GPU in the garbage just yet.


    Atomic operations on a value in memory guarantee only that each thread''s read-modify-write
    sequence will complete without other threads reading or writing the target value
    while in process. There is no stipulation about the order in which the threads
    will perform their operations, so in the case of three threads performing addition,
    sometimes the hardware will perform (A+B) + C and sometimes it will compute A+
    (B+C). This is acceptable for integers because integer math is associative, so
    (A+B) + C = A+ (B+C). Floating-point arithmetic is not associative because of
    the rounding of intermediate results, so (A+B) + C often does not equal A+ (B+C).
    As a result, atomic arithmetic on floating-point values is of dubious utility
    because it gives rise to nondeterministic results in a highly multithreaded environment
    such as on the GPU. There are many applications where it is simply unacceptable
    to get two different results from two runs of an application, so the support of
    floating-point atomic arithmetic was not a priority for earlier hardware.


    However, if we are willing to tolerate some nondeterminism in the results, we
    can still accomplish the reduction entirely on the GPU. But we''ll first need
    to develop a way to work around the lack of atomic floating-point arithmetic.
    The solution will still use atomic operations, but not for the arithmetic itself.


    # A.1.1 ATOMIC LOCKS


    The atomicAdd() function we used to build GPU histograms performed a read-modify-write
    operation without interruption from other threads. At a low level, you can imagine
    the hardware locking the target memory location while this operation is underway,
    and while locked, no other threads can read or write the value at the location.
    If we had a way of emulating this lock in our CUDA C kernels, we could perform
    arbitrary operations on an associated memory location'
  merge: -1
  img_proc: true
- pgno: 272
  md: "or data structure. The locking mechanism itself will operate exactly like a\
    \ typical CPU mutex. If you are unfamiliar with mutual exclusion [mutex], don't\
    \ fret. It's not any more complicated than the things you've already learned.\n\
    \nThe basic idea is that we allocate a small piece memory to be used as a mutex.\
    \ The mutex will act like something of a traffic signal that governs access to\
    \ some resource. The resource could be a data structure, a buffer, or simply a\
    \ memory location we want to modify atomically. When a thread reads a 0 from the\
    \ mutex, it interprets this value as a “green light” indicating that no other\
    \ thread is using the memory. Therefore, the thread is free to lock the memory\
    \ and make whatever changes it desires, free of interference from other threads.\
    \ To lock the memory location in question, the thread writes a 1 to the mutex.\
    \ This 1 will act as a “red light” for potentially competing threads. The competing\
    \ threads must then wait until the owner has written a 0 to the mutex before they\
    \ can attempt to modify the locked memory.\n\nA simple code sequence to accomplish\
    \ this locking process might look like this:\n\n```\nvoid lock( void ) {\n   \
    \ if( *mutex == 0 ) {\n        *mutex = 1; //store a 1 to lock\n    }\n}\n```\n\
    \nUnfortunately, there's a problem with this code. Fortunately, it's a familiar\
    \ problem: What happens if another thread writes a 1 to the mutex after our thread\
    \ has read the value to be zero? That is, both threads check the value at mutex\
    \ and see that it's zero. They then both write a 1 to this location to signify\
    \ to other threads that the structure is locked and unavailable for modification.\
    \ After doing so, both threads think they own the associated memory or data structure\
    \ and begin making unsafe modifications. Catastrophe ensues!\n\nThe operation\
    \ we want to complete is fairly simple: We need to compare the value at mutex\
    \ to 0 and store a 1 at that location if and only if the mutex was 0. To accomplish\
    \ this correctly, this entire operation needs to be performed atomically so we\
    \ know that no other thread can interfere while our thread examines and updates\
    \ the value at mutex. In CUDA C, this operation can be performed with the function\
    \ atomicCAS(), an atomic compare-and-swap. The function atomicCAS() takes a pointer\
    \ to memory, a value with which to compare the value at that location, and a value\
    \ to store in that location if the comparison is successful. Using this operation,\
    \ we can implement a GPU lock function as follows:"
  merge: -1
  img_proc: true
- pgno: 273
  md: "```\n__device__ void lock( void ) {\n    while( atomicCAS( mutex, 0, 1 ) !=\
    \ 0 );\n}\n```\n\nThe call to atomicCAS() returns the value that it found at the\
    \ address mutex. As a result, the while() loop will continue to run until atomicCAS()\
    \ sees a 0 at mutex. When it sees a 0, the comparison is successful, and the thread\
    \ writes a 1 to mutex. Essentially, the thread will spin in the while() loop until\
    \ it has successfully locked the data structure. We'll use this locking mechanism\
    \ to implement our GPU hash table. But first, we dress the code up in a structure\
    \ so it will be cleaner to use in the dot product application:\n\n```\nstruct\
    \ Lock {\n    int *mutex;\n    Lock( void ) {\n        int state = 0;\n      \
    \  HANDLE_ERROR( cudaMalloc( (void**)& mutex,\n            sizeof(int) ) );\n\
    \        HANDLE_ERROR( cudaMemcpy( mutex, &state, sizeof(int),\n            cudaMemcpyHostToDevice\
    \ ) );\n    }\n\n    ~Lock( void ) {\n        cudaFree( mutex );\n    }\n\n  \
    \  __device__ void lock( void ) {\n        while( atomicCAS( mutex, 0, 1 ) !=\
    \ 0 );\n    }\n\n    __device__ void unlock( void ) {\n        atomicExch( mutex,\
    \ 1 );\n    }\n};\n```\n\nNotice that we restore the value of mutex with atomicExch(\
    \ mutex, 1 ). The function atomicExch() reads the value that is located at mutex,\
    \ exchanges"
  merge: -1
  img_proc: true
- pgno: 274
  md: "it with the second argument [a 1 in this case], and returns the original value\
    \ it read. Why would we use an atomic function for this rather than the more obvious\
    \ method to reset the value at mutex?\n\n```\n*mutex = 1;\n```\n\nIf you're expecting\
    \ some subtle, hidden reason why this method fails, we hate to disappoint you,\
    \ but this would work as well. So, why not use this more obvious method? Atomic\
    \ transactions and generic global memory operations follow different paths through\
    \ the GPU. Using both atomics and standard global memory operations could therefore\
    \ lead to an `unlock()` seeming out of sync with a subsequent attempt to `lock()`\
    \ the mutex. The behavior would still be functionally correct, but to ensure consistently\
    \ intuitive behavior from the application's perspective, it's best to use the\
    \ same pathway for all accesses to the mutex. Because we're required to use an\
    \ atomic to lock the resource, we have chosen to also use an atomic to unlock\
    \ the resource.\n\n# A.1.2 DOT PRODUCT REDUX: ATOMIC LOCKS\n\nThe only piece of\
    \ our earlier dot product example that we endeavor to change is the final CPU-based\
