- pgno: 85
  md: 'zero threads. In fact, we will launch too few threads whenever N is not an
    exact multiple of 128. This is bad. We actually want this division to round up.


    There is a common trick to accomplish this in integer division without calling
    ceil(). We actually compute (N+127) / 128 instead of N/128. Either you can take
    our word that this will compute the smallest multiple of 128 greater than or equal
    to N or you can take a moment now to convince yourself of this fact.


    We have chosen 128 threads per block and therefore use the following kernel launch:


    ```

    add<<< (N+127)/128, 128 >>>( dev_a, dev_b, dev_c );

    ```


    Because of our change to the division that ensures we launch enough threads, we
    will actually now launch too many threads when N is not an exact multiple of 128.
    But there is a simple remedy to this problem, and our kernel already takes care
    of it. We have to check whether a thread''s offset is actually between 0 and N
    before we use it to access our input and output arrays:


    ```

    if (tid < N)

    c[tid] = a[tid] + b[tid];

    ```


    Thus, when our index overshoots the end of our array, as will always happen when
    we launch a nonmultiple of 128, we automatically refrain from performing the calculation.
    More important, we refrain from reading and writing memory off the end of our
    array.


    # GPU SUMS OF ARBITRARILY LONG VECTORS


    We were not completely forthcoming when we first discussed launching parallel
    blocks on a GPU. In addition to the limitation on thread count, there is also
    a hardware limitation on the number of blocks (albeit much greater than the thread
    limitation). As we''ve mentioned previously, neither dimension of a grid of blocks
    may exceed 65,535.


    So, this raises a problem with our current vector addition implementation. If
    we launch N/128 blocks to add our vectors, we will hit launch failures when our
    vectors exceed 65,535 * 128 = 8,388,480 elements. This seems like a large number,
    but with current memory capacities between 1GB and 4GB, the high-end graphics
    processors can hold orders of magnitude more data than vectors with 8 million
    elements.'
  merge: -1
  img_proc: true
- pgno: 86
  md: "Fortunately, the solution to this issue is extremely simple. We first make\
    \ a change to our kernel.\n\n```\n```c\n__global__ void add(int *a, int *b, int\
    \ *c ) {\n    int tid = threadIdx.x + blockIdx.x * blockDim.x;\n    while (tid\
    \ < N) {\n        c[tid] = a[tid] + b[tid];\n        tid += blockDim.x * gridDim.x;\n\
    \    }\n}\n```\n```\n\nThis looks remarkably like our _original_ version of vector\
    \ addition! In fact, compare it to the following CPU implementation from the previous\
    \ chapter:\n\n```\n```c\nvoid add( int *a, int *b, int *c ) {\n    int tid = 0;\
    \ // this is CPU zero, so we start at zero\n    while (tid < N) {\n        c[tid]\
    \ = a[tid] + b[tid];\n        tid += 1; // we have one CPU, so we increment by\
    \ one\n    }\n}\n```\n```\n\nHere we also used a while() loop to iterate through\
    \ the data. Recall that we claimed that rather than incrementing the array index\
    \ by 1, a multi-CPU or multi-core version could increment by the number of processors\
    \ we wanted to use. We will now use that same principle in the GPU version.\n\n\
    In the GPU implementation, we consider the number of parallel threads launched\
    \ to be the number of processors. Although the actual GPU may have fewer (or more)\
    \ processing units than this, we think of each thread as logically executing in\
    \ parallel and then allow the hardware to schedule the actual execution. Decoupling\
    \ the parallelization from the actual method of hardware execution is one of burdens\
    \ that CUDA C lifts off a software developer's shoulders. This should come as\
    \ a relief, considering current NVIDIA hardware can ship with anywhere between\
    \ 8 and 480 arithmetic units per chip!\n\nNow that we understand the principle\
    \ behind this implementation, we just need to understand how we determine the\
    \ initial index value for each parallel thread"
  merge: -1
  img_proc: true
- pgno: 87
  md: "and how we determine the increment. We want each parallel thread to start on\
    \ a different data index, so we just need to take our thread and block indexes\
    \ and linearize them as we saw in the “GPU Sums of a Longer Vector” section. Each\
    \ thread will start at an index given by the following:\n\n```\nint tid = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n```\n\nAfter each thread finishes its work at the\
    \ current index, we need to increment each of them by the total number of threads\
    \ running in the grid. This is simply the number of threads per block multiplied\
    \ by the number of blocks in the grid, or blockDim.x * gridDim.x. Hence, the increment\
    \ step is as follows:\n\n```\ntid += blockDim.x * gridDim.x;\n```\n\nWe are almost\
    \ there! The only remaining piece is to fix the launch itself. If you remember,\
    \ we took this detour because the launch add<<<(N+127) / 128, 128>>>( dev_a, dev_b,\
