  md: "The remainder of the application consists of the three functions we just highlighted,\
    \ kernel(), key_func(), and draw_func(). So, let's take a look at those.\n\nThe\
    \ kernel function takes a device pointer and generates image data. In the following\
    \ example, we're using a kernel inspired by the ripple example in Chapter 5:\n\
    \n```\n// based on ripple code, but uses uchar4, which is the\n// type of data\
    \ graphic interop uses\n__global__ void kernel( uchar4 *ptr ) {\n    // map from\
    \ threadIdx/blockIdx to pixel position\n    int x = threadIdx.x + blockIdx.x *\
    \ blockDim.x;\n    int y = threadIdx.y + blockIdx.y * blockDim.y;\n    int offset\
    \ = x + y * blockDim.x * gridDim.x;\n\n    // now calculate the value at that\
    \ position\n    float fx = x/(float)DIM - 0.5f;\n    float fy = y/(float)DIM -\
    \ 0.5f;\n    unsigned char  green = 128 + 127 *\n                         sin(\
    \ abs(fx*100) - abs(fy*100) );\n\n    // accessing uchar4 vs. unsigned char*\n\
    \    ptr[offset].x = 0;\n    ptr[offset].y = green;\n    ptr[offset].z = 0;\n\
    \    ptr[offset].w = 255;\n}\n```\n\nMany familiar concepts are at work here.\
    \ The method for turning thread and block indices into x- and y-coordinates and\
    \ a linear offset has been examined several times. We then perform some reasonably\
    \ arbitrary computations to determine the color of the pixel at that (x, y) location,\
    \ and we store those values to memory. We're again using CUDA C to procedurally\
    \ generate an image on the GPU. The important thing to realize is that this image\
    \ will then be handed directly to OpenGL for rendering without the CPU ever getting\
    \ involved. On the other hand, in the ripple example of Chapter 5, we generated\
    \ image data on the GPU very much like this, but our application then copied the\
    \ buffer back to the CPU for display."
