  md: "```\nHANDLE_ERROR( cudaMemcpy( bitmap.get_ptr(), dev_bitmap,\n bitmap.image_size(),\n\
    \ cudaMemcpyDeviceToHost ) );\n bitmap.display_and_exit();\n cudaFree( dev_bitmap\
    \ );\n}\n```\n\nAs with the Julia Set example, each thread will be computing a\
    \ pixel value for a single output location. The first thing that each thread does\
    \ is compute its x and y location in the output image. This computation is identical\
    \ to the tid computation in the vector addition example, although we compute it\
    \ in two dimensions this time:\n\n```\n__global__ void kernel( unsigned char *ptr\
    \ ) {\n // map from threadIdx/blockIdx to pixel position\n int x = threadIdx.x\
    \ + blockIdx.x * blockDim.x;\n int y = threadIdx.y + blockIdx.y * blockDim.y;\n\
    \ int offset = x + y * blockDim.x * gridDim.x;\n}\n```\n\nSince we will be using\
    \ a shared memory buffer to cache our computations, we declare one such that each\
    \ thread in our 16 x 16 block has an entry.\n\n```\n__shared__ float shared[16][16];\n\
    ```\n\nThen, each thread computes a value to be stored into this buffer.\n\n```\n\
    // now calculate the value at that position\nconst float period = 128.0f;\nshared[threadIdx.x][threadIdx.y]\
    \ =\n 255 * (sinf(x*2.0f*PI/period) + 1.0f) *\n (sinf(y*2.0f*PI/period) + 1.0f)\
    \ / 4.0f;\n```"
