- pgno: 250
  md: '# 11.4 Portable Pinned Memory


    The last important piece to using multiple GPUs involves the use of pinned memory.
    We learned in Chapter 10 that pinned memory is actually host memory that has its
    pages locked in physical memory to prevent it from being paged out or reallocated.
    However, it turns out that pages can appear pinned to a single CPU thread only.
    That is, they will remain page-locked if any thread has allocated them as pinned
    memory, but they will only appear page-locked to the thread that allocated them.
    If the pointer to this memory is shared between threads, the other threads will
    see the buffer as standard, pageable data.


    As a side effect of this behavior, when a thread that did not allocate a pinned
    buffer attempts to perform a cudaMemcpy() using it, the copy will be performed
    at standard pageable memory speeds. As we saw in Chapter 10, this speed can be
    roughly 50 percent of the maximum attainable transfer speed. What''s worse, if
    the thread attempts to enqueue a cudaMemcpyAsync() call into a CUDA stream, this
    operation will fail because it requires a pinned buffer to proceed. Since the
    buffer appears pageable from the thread that didn''t allocate it, the call dies
    a grisly death. Even in the future nothing works!


    But there is a remedy to this problem. We can allocate pinned memory as portable,
    meaning that we will be allowed to migrate it between host threads and allow any
    thread to view it as a pinned buffer. To do so, we use our trusty cudaHostAlloc()
    to allocate the memory, but we call it with a new flag: cudaHostAllocPortable.
    This flag can be used in concert with the other flags you''ve seen, such as cudaHostAllocWriteCombined
    and cudaHostAllocMapped. This means that you can allocate your host buffers as
    any combination of portable, zero-copy and write-combined.


    To demonstrate portable pinned memory, we''ll enhance our multi-GPU dot product
    application. We''ll adapt our original zero-copy version of the dot product, so
    this version begins as something of a mash-up of the zero-copy and multi-GPU versions.
    As we have throughout this chapter, we need to verify that there are at least
    two CUDA-capable GPUs and that both can handle zero-copy buffers.'
  merge: -1
  img_proc: true
