- pgno: 58
  md: '# 4.1 Chapter Objectives


    Through the course of this chapter, you will accomplish the following:


    +   - You will learn one of the fundamental ways CUDA exposes its parallelism.

    +   - You will write your first parallel code with CUDA C.


    # 4.2 CUDA Parallel Programming


    Previously, we saw how easy it was to get a standard C function to start running
    on a device. By adding the __global__ qualifier to the function and by calling
    it using a special angle bracket syntax, we executed the function on our GPU.
    Although this was extremely simple, it was also extremely inefficient because
    NVIDIA''s hardware engineering minions have optimized their graphics processors
    to perform hundreds of computations in parallel. However, thus far we have only
    ever launched a kernel that runs serially on the GPU. In this chapter, we see
    how straightforward it is to launch a device kernel that performs its computations
    in parallel.


    # 4.2.1 SUMMING VECTORS


    We will contrive a simple example to illustrate threads and how we use them to
    code with CUDA C. Imagine having two lists of numbers where we want to sum corresponding
    elements of each list and store the result in a third list. Figure 4.1 shows this
    process. If you have any background in linear algebra, you will recognize this
    operation as summing two vectors.'
  merge: -1
  img_proc: true
