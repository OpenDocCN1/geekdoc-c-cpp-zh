- pgno: 163
  md: "If you have never used a pixel buffer object (PBO) in OpenGL, you will typically\
    \ create one with these three steps: First, we generate a buffer handle with glGenBuffers().\
    \ Then, we bind the handle to a pixel buffer with glBindBuffer(). Finally, we\
    \ request the OpenGL driver to allocate a buffer for with glBufferData(). In this\
    \ example, we request a buffer to hold a DIM x DIM 32-bit values and use the enumerant\
    \ GL_DYNAMIC_DRAW_ARB to indicate that the buffer will be modified repeatedly\
    \ by the application. Since we have no data to preload the buffer with, we pass\
    \ NULL as the penultimate argument to glBufferData().\n\nAll that remains in our\
    \ quest to set up graphics interoperability is notifying the CUDA runtime that\
    \ we intend to share the OpenGL buffer named bufferObj with CUDA. We do this by\
    \ registering bufferObj with the CUDA runtime as a graphics resource.\n\n```\n\
    HANDLE_ERROR(\n    cudaGraphicsGLRegisterBuffer( &resource,\n                \
    \                      bufferObj,\n                                      cudaGraphicsMapFlagsNone\
    \ )\n);\n```\n\nWe specify to the CUDA runtime that we intend to use the OpenGL\
    \ PBO bufferObj with both OpenGL and CUDA by calling cudaGraphicsGLRegisterBuffer().\
    \ The CUDA runtime returns a CUDA-friendly handle to the buffer in the variable\
    \ resource. This handle will be used to refer to bufferObj in subsequent calls\
    \ to the CUDA runtime.\n\nThe flag cudaGraphicsMapFlagsNone specifies that there\
    \ is no particular behavior of this buffer that we want to specify, although we\
    \ have the option to specify with cudaGraphicsMapFlagsReadOnly that the buffer\
    \ will be read-only. We could also use cudaGraphicsMapFlagsWriteDiscard to specify\
    \ that the previous contents will be discarded, making the buffer essentially\
    \ write-only. These flags allow the CUDA and OpenGL drivers to optimize the hardware\
    \ settings for buffers with restricted access patterns, although they are not\
    \ required to be set.\n\nEffectively, the call to glBufferData() requests the\
    \ OpenGL driver to allocate a buffer large enough to hold DIM x DIM 32-bit values.\
    \ In subsequent OpenGL calls, we'll refer to this buffer with the handle bufferObj,\
    \ while in CUDA runtime calls, we'll refer to this buffer with the pointer resource.\
    \ Since we would like to read from and write to this buffer from our CUDA C kernels,\
    \ we will need more than just a handle to the object. We will need an actual address\
    \ in device memory that can be"
  merge: -1
  img_proc: true
