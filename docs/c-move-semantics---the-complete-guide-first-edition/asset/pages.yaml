    \ << s5 << \")\\n\";\n}\n```\n```\n\nIn this program, you can first see that usually\
    \ empty strings have capacity for some characters due to the *small string optimization\
    \ (SSO)*, which usually reserves 15 or 22 bytes for the value in the string itself.\
    \ Beyond the size for SSO, the string allocates the memory on the heap, which\
    \ has at least size necessary to store the value. Therefore, after\n\n```\n```cpp\n\
    std::string s0{};\nstd::string s1{\"short\"};\nstd::string s2{\"a string with\
    \ an extraordinarily long value\"};\n```\n```\n\nwe might get something like one\
    \ of the following outputs:\n\n+   - Platform A:\n+     - `s0 capa: 15 ('')`\n\
    +     - `s1 capa: 15 ('short')`\n+     - `s2 capa: 43 ('a string with an extraordinarily\
    \ long value')`\n+   \n+   - Platform B:\n+     - `s0 capa: 22 ('')`\n+     -\
    \ `s1 capa: 22 ('short')`\n+     - `s2 capa: 47 ('a string with an extraordinarily\
    \ long value')`"
