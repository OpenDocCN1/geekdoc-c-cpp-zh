  md: "Therefore, the fact that move semantics is not passed through is a feature,\
    \ not a bug. If we were to pass move semantics through, we would not be able to\
    \ use an object that was passed with move semantics twice. For example:\n\n```\n\
    \    void insertTwice(std::vector<std::string>& coll, std::string& str)\n    {\n\
    \        coll.push_back(str);               // copy str into coll\n        coll.push_back(std::move(str));\
    \    // move str into coll\n    }\n```\n\nIf all uses of str implicitly had move\
    \ semantics, the value of str would be moved away with the first push_back() call.\n\
    \nThe important lesson to learn here is that a parameter being declared as an\
    \ rvalue reference restricts what we can pass to this function but behaves just\
    \ like any other non-const object of this type. We again have to specify when\
    \ and where we no longer need the value. See the formal discussion *When Rvalues\
    \ Become Lvalues* for more details.\n\nOne additional note: while the print statement\
    \ of the copy constructor prints the name of the passed customer:\n\n```\n   \
    \ Customer(const Customer& cust)\n      : name(cust.name), values(cust.values)\
    \ {\n        std::cout << \"COPY \" << cust.name << '\\n';  // cust.name still\
    \ there\n    }\n```\n\nthe move constructor cannot use cust.name because in the\
    \ initialization of the constructor the value might have been moved away. We have\
    \ to use the member of the new objects instead:\n\n```\n    Customer(Customer&&\
    \ cust)\n      : name(std::move(cust.name)), values(std::move(cust.values)) {\n\
    \        std::cout << \"MOVE \" << name << '\\n';  // have to use name (cust.name\
    \ moved away)\n    }\n```\n\nNote that you should always implement the move constructor\
    \ with a (conditional) noexcept specification to improve the performance of reallocations\
    \ of a vector of Customers.\n\n# ### 3.2.3 Copy Assignment Operator\n\nThe copy\
    \ assignment operator is implemented as follows:\n\n```\n    class Customer {\n\
    \      private:\n        std::string name;       // name of the customer\n   \
    \     std::vector<int> values; // some values of the customer\n      public:\n\
    \        ...\n        // copy assignment (assign all members):\n        Customer&\
    \ operator= (const Customer& cust) {\n            std::cout << \"COPYASSIGN \"\
    \ << cust.name << '\\n';\n            name = cust.name;\n```"
