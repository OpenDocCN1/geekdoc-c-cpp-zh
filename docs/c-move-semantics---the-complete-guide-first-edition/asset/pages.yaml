    \ ''\ncoll1 (5 elems):  '?', '?', '?', '?', '?'\ncoll2 (5 elems):  'love' 'is'\
    \ 'all' 'you' 'need'\ncoll1 (5 elems):  '?', '?', '?', '?', '?'\ncoll2 (5 elems):\
    \  '?', '?', 'love' 'is' 'all'\n```\n```\n\nA moved-from string is often empty\
    \ but this is not guaranteed. In practice, I even found this output on one platform:\n\
    \n```\n```text\ncoll1 (5 elems):  'love' 'is' 'all' 'you' 'need'\ncoll2 (5 elems):\
