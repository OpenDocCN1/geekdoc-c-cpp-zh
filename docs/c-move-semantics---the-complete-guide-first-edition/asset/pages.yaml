    # ### 2.2.2   Implementation of `std::move()`


    `std::move()` is nothing but a `static_cast` to an rvalue reference. You can achieve
    the same effect by calling `static_cast` manually as follows:


    ```

    ```cpp

    foo(static_cast<decltype(foo)&>(obj));    // same effect as foo(std::move(obj))

