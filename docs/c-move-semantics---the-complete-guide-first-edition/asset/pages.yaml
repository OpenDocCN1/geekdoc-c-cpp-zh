- pgno: 170
  md: '# # Chapter 10


    # # Tricky Details of Perfect Forwarding


    After introducing (perfect) forwarding and universal/forwarding references in
    general in the previous chapter, this chapter discusses tricky details of perfect
    forwarding and universal/forwarding references, such as:


    +   - Non-forwarding universal references

    +   - When exactly we have a universal reference

    +   - Type deduction for universal references


    The following chapters then discuss how to deal with return values that may or
    may not have move semantics in generic code.


    # ## 10.1   Universal References as Non-Forwarding References


    There are applications of universal references (also called forwarding references)
    that have nothing to do with forwarding because there can be other benefits of
    being able to bind to all objects while still knowing the value category and/or
    whether the object is const.


    In this chapter, we discuss some initial examples. After introducing a second
    kind of universal reference, auto&&, we then discuss other practical examples
    of using universal references as non-forwarding references.


    # ### 10.1.1   Universal References and const


    According to the formal rules for binding references, a universal reference is
    the only way we can bind a reference to objects of any value category and still
    preserve whether or not it is const. The only other reference that binds to all
    objects, const&, loses the information about whether the passed argument is const
    or not.'
  merge: -1
  img_proc: true
- pgno: 171
  md: "# Forwarding Constness\n\nThis means that if we want to avoid overloading but\
    \ want to have different behavior for `const` and non-const arguments and support\
    \ all value categories, we have to use universal references.\n\nConsider the following\
    \ example:\n\n`generic/universalconst.cpp`\n\n```\n```cpp\n#include <iostream>\n\
    #include <string>\n\nvoid iterate(std::string::iterator beg, std::string::iterator\
    \ end)\n{\n    std::cout << \"do some non-const stuff with the passed range\\\
    n\";\n}\n\nvoid iterate(std::string::const_iterator beg, std::string::const_iterator\
    \ end)\n{\n    std::cout << \"do some const stuff with the passed range\\n\";\n\
    }\n\ntemplate<typename T>\nvoid process(T&& coll)\n{\n    iterate(coll.begin(),\
    \ coll.end());\n}\n\nint main()\n{\n    std::string v{\"v\"};\n    const std::string\
    \ c{\"c\"};\n\n    process(v);                   // coll binds to a non-const\
    \ lvalue, iterators passed\n    process(c);                   // coll binds to\
    \ a const lvalue, const_iterators passed\n    process(std::string{\"u\"});   //\
    \ coll binds to a non-const prvalue, iterators passed\n    process(std::move(v));\
    \        // coll binds to a non-const xvalue, iterators passed\n    process(std::move(c));\
    \        // coll binds to a const xvalue, const_iterators passed\n}\n```\n```\n\
    \nThe program has the following output:\n\n```\n```text\ndo some non-const stuff\
    \ with the passed range\ndo some const stuff with the passed range\ndo some non-const\
    \ stuff with the passed range\ndo some non-const stuff with the passed range\n\
    do some const stuff with the passed range\n```\n```"
