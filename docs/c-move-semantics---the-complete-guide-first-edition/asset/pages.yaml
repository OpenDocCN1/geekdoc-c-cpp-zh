- pgno: 247
  md: "The thread takes it as an argument for the passed callable `getValue()`, which\
    \ takes the passed promise by value:\n\n```\nvoid getValue(std::promise<std::string>\
    \ p)\n{\n    ...\n}\n```\n\nThis way, `getValue()` receives ownership of the promise\
    \ and destroys this source of the communication mechanism at the end of the thread.\n\
    \n`getValue()` could also take the promise by reference because the thread started\
    \ holds the moved value of the promise until it ends.\n\n# 15.7 Summary\n\nWe\
    \ have learned a lot of individual lessons from the types discussed in this chapter\
    \ but let me summarize here a couple of the more general aspects of using move\
    \ semantics with types of the C++ standard library.\n\n+   - Moved-from standard\
    \ strings are usually empty but that is not guaranteed.\n+   - Moved-from standard\
    \ containers (except `std::array<>`) are usually empty if no special allocator\
    \ is used. For vectors, this is (indirectly) guaranteed; for the other containers,\
    \ it is indirectly guaranteed that all elements are moved away or destroyed and\
    \ inserting new members would make no sense.\n+   - Move assignments can change\
    \ the capacity of strings and vectors.\n+   - To support decaying when passing\
    \ values to universal/forwarding references (often necessary to deduce the same\
    \ type for string literals of different length), use the type trait `std::decay<>`.\n\
    +   - Generic wrapper types should use reference collapsing to overload member\
    \ functions that access the wrapped objects. This might even mean using overloads\
    \ for const rvalue references.\n+   - Avoid copying of shared pointers (e.g.,\
    \ by passing them by value).\n+   - Use `std::jthread` (available since C++20)\
    \ instead of `std::thread`."
