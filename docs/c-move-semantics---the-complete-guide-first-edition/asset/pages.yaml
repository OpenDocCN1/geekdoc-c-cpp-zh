- pgno: 67
  md: "still a request to move an object usually works because the copy member functions\
    \ are used as a fallback (unless the special move member functions are explicitly\
    \ deleted).\n\n+   - The special move member functions disable the normal copying\
    \ and assignment. The copying and other moving special member functions are deleted\
    \ so that you can only move (assign) but not copy (assign) an object (unless the\
    \ other operations are also declared).\n\nLet us look at some details.\n\n# 3.3.2\
    \  By Default, We Have Copying and Moving\n\nAs written, by default, both copying\
    \ and moving special member functions are generated for a class.\nAssume the following\
    \ declaration of a class Person:\n\n```\nclass Person {\n    ...\npublic:\n  \
    \  ...\n    // NO copy constructor/assignment declared\n\n    // NO move constructor/assignment\
    \ declared\n\n    // NO destructor declared\n};\n```\n\nIn this case, a Person\
    \ can be both copied and moved:\n\n```\nstd::vector<Person> coll;\n\nPerson p{\"\
    Tina\", \"Fox\"};\ncoll.push_back(p);              // OK, copies p\ncoll.push_back(std::move(p));\
    \   // OK, moves p\n```\n\n# 3.3.3  Declared Copying Disables Moving (Fallback\
    \ Enabled)\n\nWhen declaring a copying special member function (or the destructor),\
    \ we have the automatic generation of the moving special member functions disabled:\n\
    Assume the following declaration of a class Person:\n\n```\nclass Person {\n \
    \   ...\npublic:\n    ...\n\n    // copy constructor/assignment declared:\n  \
    \  Person(const Person&) = default;\n    Person& operator=(const Person&) = default;\n\
    \n    // NO move constructor/assignment declared\n};\n```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "Because the fallback mechanism works, copying and moving a `Person` compiles\
    \ but the move is performed as a copy:\n\n```\nstd::vector<Person> coll;\n\nPerson\
    \ p{\"Tina\", \"Fox\"};\ncoll.push_back(p);                 // OK, copies p\n\
    coll.push_back(std::move(p));      // OK, copies p\n```\n\nThus, declaring a special\
    \ member function with `=default` is not the same as not declaring it at all.\
    \ The copy constructor and copy assignment are user-declared, which disables move\
    \ construction and move assignment so that moves fall back to copies. A declared\
    \ destructor has the same effect.\n\nYou might wonder why a declared destructor\
    \ disables move semantics. The chapter about moved-from states discusses a concrete\
    \ example of a class with a destructor that causes generated move semantics not\
    \ to work properly.\n\n# 3.3.4  Declared Moving Disables Copying\n\nIf you have\
    \ user-declared move semantics, you have disabled copy semantics. The copying\
    \ special member functions are deleted.\n\nIn other words, if the move constructor\
    \ or the move assignment operator is explicitly declared (implemented, generated\
    \ with `=default`, or disabled with `=delete`), you have disabled to call the\
    \ copy constructor and the copy assignment operator by declaring them with `=delete`.\n\
    \nAssume the following declaration of a class `Person`:\n\n```\nclass Person {\n\
    \    ...\npublic:\n    ...\n    // NO copy constructor declared\n\n    // move\
    \ constructor/assignment declared:\n    Person(Person&&) = default;\n    Person&\
    \ operator=(Person&&) = default;\n};\n```\n\nIn this case, we have a move-only\
    \ type. A `Person` can be moved but not copied:\n\n```\nstd::vector<Person> coll;\n\
    \nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p);                 // ERROR: copying\
    \ disabled\ncoll.push_back(std::move(p));      // OK, moves p\n\ncoll.push_back(Person{\"\
    Ben\", \"Cook\"});  // OK, moves temporary person into coll\n```\n\nAgain, declaring\
    \ a special member function with `=default` is not the same as not declaring it\
    \ at all. However, this time, the consequences of the call are more severe: the\
    \ attempt to copy an object will no longer compile."
  merge: -1
  img_proc: true
- pgno: 69
  md: "A class supporting move operations but not copy operations can make sense.\
    \ You can use such a *move-only* type to pass around ownership or handles of resources\
    \ without sharing or copying them. In the C++ standard library there are a couple\
    \ of move-only types (e.g., I/O stream classes, thread classes, and `std::unique_ptr<>`).\
    \ See the chapter about move-only types for details.\n\n# ### 3.3.5 Deleting Moving\
    \ Makes No Sense\n\nFor the same reason, if you declare the move constructor as\
    \ deleted, you cannot move (you have disabled this operation; any fallback is\
    \ not used) and cannot copy (because a declared move constructor disables copy\
    \ operations):\n\n```\n~~~cpp\nclass Person {\n  public:\n    ...\n    // NO copy\
    \ constructor declared\n\n    // move constructor/assignment declared as deleted:\n\
    \    Person(Person&&) = delete;\n    Person& operator=(Person&&) = delete;\n \
    \   ...\n};\n~~~\n```\n\n```\n~~~cpp\nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p);\
    \           // ERROR: copying disabled\ncoll.push_back(std::move(p)); // ERROR:\
    \ moving disabled\n~~~\n```\n\nYou get the same effect by declaring copying special\
    \ member functions as deleted and that is probably less confusing for other programmers.\n\
    \nDeleting the move operations and enabling the copy operations really makes no\
    \ sense:\n\n```\n~~~cpp\nclass Person {\n  public:\n    ...\n    // copy constructor\
    \ explicitly declared:\n    Person(const Person& p) = default;\n    Person& operator=(const\
    \ Person&) = default;\n\n    // move constructor/assignment declared as deleted:\n\
    \    Person(Person&&) = delete;\n    Person& operator=(Person&&) = delete;\n \
    \   ...\n};\n~~~\n```\n\n```\n~~~cpp\nPerson p{\"Tina\", \"Fox\"};\ncoll.push_back(p);\
    \           // OK: copying enabled\ncoll.push_back(std::move(p)); // ERROR: moving\
    \ disabled\n~~~\n```"
  merge: -1
  img_proc: true
- pgno: 70
  md: "In this case, `=delete` disables the fallback mechanism (and is therefore also\
    \ not the same as not declaring it at all). The compiler finds the declaration\
    \ and reports the call as an error.\n\nA type that supports copying but fails\
    \ when moving is called does not make any sense. For the user of such a class,\
    \ copying would sometimes work, sometimes not. As a guideline: never `=delete`\
    \ the special move member functions.⁴ If you want to disable both copying and\
    \ moving, deleting the copying special member functions is enough.\n\n# 3.3.6\
    \  Disabling Move Semantics with Enabled Copy Semantics\n\nBased on what we have\
    \ just discussed, we now know how to disable move semantics when copying still\
    \ makes sense. Declaring the special move member functions as deleted is usually\
    \ not the right way to do it because it disables the fallback mechanism.\n\nThe\
    \ right way to disable move semantics while providing copy semantics is to declare\
    \ one of the other special member functions (copy constructor, assignment operator,\
    \ or destructor). I recommend that you default the copy constructor and the assignment\
    \ operator (declaring one of them would be enough but might cause unnecessary\
    \ confusion):\n\n```\nclass Customer {\n    ...\npublic:\n    ...\n    Customer(const\
    \ Customer&) = default;            // disable move semantics\n    Customer& operator=(const\
    \ Customer&) = default; // disable move semantics\n};\n```\n\nBecause no generated\
    \ special move member functions are found, a nameless temporary customer or even\
    \ a customer marked with `std::move()` is now copied:\n\n```\nstd::vector<Customer>\
    \ customers;\n...\ncustomers.push_back(createCustomer());           // OK, falls\
    \ back to copying\ncustomers.push_back(std::move(customers[0]));     // OK, falls\
    \ back to copying\n```\n\nHowever, it is usually better to implement the special\
    \ move member functions to fix any problem a default generated move operation\
    \ has. The chapter about moved-from states will discuss examples from practice.\n\
    \nNote that only declaring the special copy member functions breaks the common\
    \ “rule of five,” which we will discuss later in detail. You have to declare the\
    \ special copy member functions but cannot also declare the special move member\
    \ functions (both deleting and defaulting would not work, implementing them makes\
    \ the class unnecessarily complicated). Therefore, if you explicitly declare a\
    \ copying special member function just to disable move semantics, add a big comment\
    \ to ensure that this declaration is neither removed nor extended by a declaration\
    \ of the special move member functions."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# ### 3.3.7 Moving for Members with Disabled Move Semantics\n\nNote that if\
    \ move semantics is unavailable or has been deleted for a type, this has no influence\
    \ on the generation of move semantics for classes that have members of this type.\
    \ The generated default move constructor and assignment operator decide member\
    \ by member whether to copy or to move it. If a move is not possible (even if\
    \ the move operation is deleted), a copy is generated (if possible).\n\nFor example,\
    \ assume the following class:\n\n```\n```cpp\nclass Customer {\n    ...\npublic:\n\
    \    ...\n    Customer(const Customer&) = default;          // copying calls enabled\n\
    \    Customer& operator=(const Customer&) = default; // copying calls enabled\n\
    \    Customer(Customer&&) = delete;                // moving calls disabled\n\
    \    Customer& operator=(Customer&&) = delete;     // moving calls disabled\n\
    };\n```\n```\n\nIf this class is used by a member in the other class:\n\n```\n\
    ```cpp\nclass Invoice {\n    std::string id;\n    Customer cust;\npublic:\n  \
    \  ...  // no special member functions\n};\n```\n```\n\nthe generated move constructor\
    \ will move the id string but copy the customer cust:\n\n```\n```cpp\nInvoice\
    \ i;\nInvoice i1{std::move(i)};   // OK, moves id, copies cust\n```\n```\n\n#\
    \ ### 3.3.8 Exact Rules for Generated Special Member Functions\n\nNow we can summarize\
    \ the new rules for special member functions (when they are generated and how\
    \ they behave).\n\nAs an example, assume we have the following derived class:\n\
    \n```\n```cpp\nclass MyClass : public Base\n{\nprivate:\n    MyType value;\n \
    \   ...\n};\n```\n```\n\nThe one thing missing here is the noexcept specification,\
    \ which we introduce later in the chapter about noexcept. However, we will mention\
    \ the corresponding guarantees here."
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Copy Constructor\n\nThe copy constructor is automatically generated when\
    \ all of the following apply:\n\n+   - No move constructor is user-declared\n\
    +   - No move assignment operator is user-declared\n\nIf generated (implicitly\
    \ or with =default), the copy constructor has the following behavior:\n\n```\n\
    MyClass(const MyClass& obj) noexcept-specifier\n  : Base(obj), value(obj.value)\
    \ {\n}\n```\n\nThe generated copy constructor first passes the source object,\
    \ to the best matching copy constructor of the base class(es). (remember that\
    \ copy constructors are always called on a top-down basis). It prefers the copy\
    \ constructor with the same declaration (usually declared const&), but if that\
    \ is not available it might call the next best matching constructor (e.g., a copy\
    \ constructor template). Afterwards, it copies all members of its class (again\
    \ using the best match).\n\nThe generated copy constructor is declared as noexcept\
    \ if all copy operations (the copy constructors of all base classes and the copy\
    \ constructors of all members) give this guarantee.\n\n# Move Constructor\n\n\
    The move constructor is automatically generated when all of the following apply:\n\
    \n+   - No copy constructor is user-declared\n+   - No copy assignment operator\
    \ is user-declared\n+   - No move assignment operator is user-declared\n+   -\
    \ No destructor is user-declared\n\nIf generated (implicitly or with =default),\
    \ the move constructor has the following behavior:\n\n```\nMyClass(MyClass&& obj)\
    \ noexcept-specifier\n  : Base(std::move(obj)), value(std::move(obj.value)) {\n\
    }\n```\n\nThe generated move constructor first passes the source object, marked\
    \ with std::move() to pass through its move semantics, to the best matching move\
    \ constructor of the base class(es). The best matching move constructor usually\
    \ is the one with the same declaration (declared with &&). However, if that is\
    \ not available it might call the next best matching constructor (e.g., a move\
    \ constructor template or even a copy constructor). Afterwards, it moves all members\
    \ of its class (again using the best match).\n\nThe generated move constructor\
    \ is declared as noexcept if all called move/copy operations (the copy or move\
    \ constructors of all base classes and the copy or move constructors of all members)\
    \ give this guarantee."
