  md: "Consider a class for the cards of a card game.⁴ Assume each object is a valid\
    \ card, such as eight-of-hearts or king-of-diamonds. Assume also that for whatever\
    \ reason, the value is a string and that the invariant of the class is that each\
    \ and every object has a state that represents a valid card. This would mean that\
    \ we probably do not have a default constructor and that an initializer constructor\
    \ asserts that the value is valid. For example:\n\n```\n```cpp\nclass Card {\n\
    private:\n    std::string value;              // rank + \"-of-\" + suit\npublic:\n\
    \    Card(const std::string& v)\n      : value{v} {\n        assertValidCard(value);\
    \     // ensure the value is always valid\n    }\n\n    std::string getValue()\
    \ const {\n        return value;\n    }\n};\n```\n```\n\nIn this class, the generated\
    \ special move member functions create an invalid state that breaks the invariant\
    \ of the class that the value is always the rank followed by \"-of-\" followed\
    \ by the suit (such as \"queen-of-hearts\").\n\nAs long as we do not use std::move()\
    \ or another moving operation this is not a problem (the destructor of the type\
    \ works fine for a moved-from string), but when we call std::move() we can get\
    \ into trouble. Assigning a new value works fine:\n\n```\n```cpp\nstd::vector<Card>\
    \ deck;                  // initialize deck\n...\nCard c{std::move(deck[0])};\
    \              // deck[0] has its valid state\ndeck[0] = Card{\"ace-of-hearts\"\
    };          // deck[0] is valid again\n```\n```\n\nHowever, printing the value\
    \ of a moved-from card might fail:\n\n```\n```cpp\nstd::vector<Card> deck;   \
    \               // initialize deck\n...\nCard c{std::move(deck[0])};         \
    \     // deck[0] has invalid state\nprint(deck[0]);                          //\
    \ passing an object with broken invariant\n```\n```\n\nIf the print function assumes\
    \ that the invariant is not broken, we might get a core dump:\n\n```\n```cpp\n\
    void print(const Card& c) {\n    std::string val{c.getValue()};\n    auto pos\
    \ = val.find(\"-of-\");              // find position of substring (no check)\n\
    \    std::cout << val.substr(0, pos) << ' '\n              << val.substr(pos+4)\
    \ << '\\n';  // OOPS: possible core dump\n}\n```\n```\n\n⁴ Thanks to Tony Van\
    \ Eerd for this example."
