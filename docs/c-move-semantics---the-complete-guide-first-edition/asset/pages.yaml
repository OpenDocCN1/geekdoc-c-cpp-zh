- pgno: 183
  md: "These rules also apply if you use the C++20 feature to declare ordinary functions\
    \ with `auto&&`:\n\n```\n```cpp\nvoid f(auto&& arg) {\n    g(std::forward<decltype(arg)>(arg));\n\
    }\n```\n```\n\n# 10.3.2 Conflicting Template Parameter Deduction with Universal\
    \ References\n\nThe special rule for deducing template parameters of universal\
    \ references (deducing the type as an lvalue reference when lvalues are passed)\
    \ can lead to unexpected errors for code that looks correct.\n\nProgrammers are\
    \ usually surprised when code like the following does not compile:\n\n```\n```cpp\n\
    template<typename T>\nvoid insert(std::vector<T>& vec, T&& elem)\n{\n    vec.push_back(std::forward<T>(elem));\n\
    }\n\nstd::vector<std::string> coll;\nstd::string s;\n...\ninsert(coll, s);   \
    \ // ERROR: no matching function call\n```\n```\n\nThe problem is that both parameters\
    \ can be used to deduce parameter T but the deduced types are not the same:\n\n\
    +   - Using the parameter `coll`, T it is deduced as `std::string`.\n+   - However,\
    \ according to the special rule for universal references, parameter `elem` forces\
    \ to deduce T as `std::string&`.\n\nTherefore, the compiler raises an ambiguity\
    \ error.\nThere are two ways to solve this problem:\n\n+   - You can use the type\
    \ trait `std::remove_reference<>`:\n\n```\n```cpp\ntemplate<typename T>\nvoid\
    \ insert(std::vector<std::remove_reference_t<T>>& vec, T&& elem)\n{\n    vec.push_back(std::forward<T>(elem));\n\
    }\n\nstd::vector<std::string> coll;\nstd::string s;\n...\ninsert(coll, s);   \
    \ // OK, with T deduced as std::string& vec now binds to coll\n```\n```"
  merge: -1
  img_proc: true
- pgno: 184
  md: "+   - You can use two template parameters instead:\n+   \n+     ```cpp\n+ \
    \  template<typename T1, typename T2>\n+   void insert(std::vector<T1>& vec, T2&&\
    \ elem)\n+   {\n+       vec.push_back(std::forward<T2>(elem));\n+   }\n+     ```\n\
    +   \n+     or just:\n+   \n+     ```cpp\n+   template<typename Col1, typename\
    \ T>\n+   void insert(Col1& col1, T&& elem)\n+   {\n+       col1.push_back(std::forward<T>(elem));\n\
    +   }\n+     ```\n\n# 10.3.3  Pure Rvalue References of Generic Types\n\nWith\
    \ the special rule for deducing template parameters of universal references (deducing\
    \ the type as an lvalue reference when lvalues are passed), we can constrain generic\
    \ reference parameters to only bind to rvalues:\n\n```\n```cpp\ntemplate<typename\
    \ T>\nrequires (!std::is_lvalue_reference_v<T>)  // bind to rvalues only\nvoid\
    \ callFoo(T&& arg) {\n    foo(std::forward<T>(arg));\n}\n```\n```\n\nBefore C++20,\
    \ the type trait std::enable_if<> had to be used again:\n\n```\n```cpp\ntemplate<typename\
    \ T,\n         typename\n             = typename std::enable_if<!std::is_lvalue_reference<T>::value\n\
    \                                        >::type>\nvoid callFoo(T&& arg) {\n \
    \   foo(std::forward<T>(arg));\n}\n```\n```\n\n# 10.4  Nasty Details of Perfect\
    \ Forwarding\n\nWhenever something new and complex like move semantics is invented,\
    \ people make mistakes. Making mistakes is human, and over a long period we cannot\
    \ really avoid them because we do not know all applications and extensions of\
    \ move semantics in the future in advance. In the C++ standard we also took a\
    \ few decisions about perfect forwarding and universal references that (looking\
    \ back at least) are mistakes."
