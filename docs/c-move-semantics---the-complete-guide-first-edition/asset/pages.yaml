- pgno: 242
  md: "# 15.5 Move Semantics for IOStreams\n\nIOStreams were introduced with C++98\
    \ as an abstraction for something you can read from or write to (standard I/O,\
    \ files, and even strings). It was an early design decision that it is not possible\
    \ to copy these objects (what would it mean to copy an object representing an\
    \ open file, having two handles for the same files or copying the file, and how\
    \ do you synchronize access?).\n\nHowever, since C++11, move semantics allows\
    \ us to move IOStream objects around and to use temporary streams.\n\n# 15.5.1 Moving\
    \ IOStream Objects\n\nConsider the following example:\n\n`lib/outfile.cpp`\n\n\
    ```\n```cpp\n#include <iostream>\n#include <fstream>\n#include <stream>\n\nstd::ofstream\
    \ openToWrite(const std::string& name)\n{\n    std::ofstream file(name);     \
    \               // open a file to write to\n    if (!file) {\n        std::cerr\
    \ << \"can't open file '\" << name << \"'\\n\";\n        std::exit(EXIT_FAILURE);\n\
    \    }\n    return file;                                 // return ownership (open\
    \ file)\n}\n\nvoid storeData(std::ofstream fstrm)              // takes ownership\
    \ of file (but this might change)\n{\n    fstrm << 42 << '\\n';\n}           \
    \                                      // closes the file\n\nint main()\n{\n \
    \   auto outFile{openToWrite(\"iostream.tmp\")};   // open file\n    storeData(std::move(outFile));\
    \                 // store data\n\n    // better ensure that the file is closed:\n\
    \    if (outFile.is_open()) {\n        outFile.close();\n    }\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "Here, the function `openWrite()` opens and returns an output file stream:\n\
    \n```\nstd::ofstream openToWrite(const std::string& name)\n{\n    std::ofstream\
    \ file(name);                 // open a file to write to\n    ...\n    return\
    \ file;                               // return ownership (open file)\n}\n```\n\
    \nWe use the return value to initialize `outFile` and pass it to `storeData()`:\n\
    \n```\nauto outFile{openToWrite(\"iostream.tmp\")};   // open file\nstoreData(std::move(outFile));\
    \                // store data\n```\n\nBecause `storeData()` takes the argument\
    \ by value, it takes the ownership of the open file. Therefore, at the end of\
    \ `storeData()`, the file is closed:\n\n```\nvoid storeData(std::ofstream fstrm)\
    \   // takes ownership of file (but this might change)\n{\n    ...\n}        \
    \                              // closes the file\n```\n\nHowever, `storeData()`\
    \ might also take the argument by reference, which means that it does not necessarily\
    \ take the ownership. In that case, you might want to double-check the state of\
    \ the passed argument `outFile` afterwards:\n\n```\n// better ensure that the\
    \ file is closed:\nif (!outFile.is_closed()) {\n    outFile.close();\n}\n```\n\
    \nCalling `outFile.close()` is usually enough but would set the `failbit` of the\
    \ file stream if it was already closed.\n\n# 15.5.2  Using Temporary IOStreams\n\
    \nSince C++11, the IOStreams library also provides function overloads to take\
    \ rvalue references, which allows us to take temporary objects. For example:\n\
    \n```\nstd::string s = \"hello, world\";\nstd::ofstream(\"fstream1.tmp\") << s\
    \ << '\\n';             // OK since C++11\n```\n\nYou can even write a string\
    \ literal to a stream that way (this compiled before C++11 but wrote the address\
    \ of the string literals using `operator<<(const void*)`):\n\n```\nstd::ofstream(\"\
    fstream1.tmp\") << \"hello, world\\n\";    // correct since C++11\n          \
    \                                              // (I wrote address before)\n```\n\
    \nIn the same way, you can parse a given string using a temporary string stream:\n\
    \n```\nstd::string name, firstname, lastname;\n...\nname = \"Tina Turner\";\n\
    std::istringstream{name} >> firstname >> lastname;       // OK since C++11\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: "Finally, you can use `std::getline()` to parse the first line from a temporary\
    \ stream:\n\n```\nstd::string multiLineString, firstLine;\n...\nstd::getline(std::stringstream{multiLineString},\
    \    // read from temporary string stream\n             firstLine);\n```\n\n#\
    \ 15.6  Move Semantics for Multithreading\n\nThe C++ standard library has a couple\
    \ of special types that represent running threads or are used to synchronize them.\
    \ Some of them you can neither copy nor move (e.g., atomic types or condition\
    \ variables). However, some of them are move-only types. Let us look at some details\
    \ of them from the perspective of move semantics.\n\n# 15.6.1  `std::thread<>`\
    \ and `std::jthread<>`\n\nObjects representing running threads (`std::thread`\
    \ or since C++20 `std::jthread`) can be passed around but not copied. That allows\
    \ us to put them in containers.\n\nConsider the following example:\n\n```\n```cpp\n\
    #include <iostream>\n#include <thread>\n#include <vector>\n\nvoid doThis(const\
    \ std::string& arg) {\n    std::cout << \"doThis(): \" << arg << '\\\\n';\n}\n\
    void doThat(const std::string& arg) {\n    std::cout << \"doThat(): \" << arg\
    \ << '\\\\n';\n}\n\nint main()\n{\n    std::vector<std::thread> threads;    //\
    \ better std::jthread since C++20\n\n    // start a couple of threads:\n    std::string\
    \ someArg{\"Black Lives Matter\"};\n    threads.push_back(std::thread(doThis,\
    \ someArg));\n```\n```\n\n⁵ `std::jthread` fixes some flaws of class `std::thread`\
    \ by becoming a RAII type (no further need to call `join()` or `detach()`) for\
    \ the thread before the destructor is called) and supporting a cooperative mechanism\
    \ so signal cancellation of the thread. It is always better to use `std::jthread`\
    \ instead of `std::thread`."
  merge: -1
