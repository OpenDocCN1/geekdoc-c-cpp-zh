    \ MyType&) =default;\n    MyType(MyType&&) =default;\n    ...\n};\n```\n```\n\n\
    In general, you should do this for every member function that might modify an\
    \ object.\n\n# 5.3.2  Reference Qualifiers for Other Member Functions\n\nAs demonstrated\
    \ by the example of getters, reference qualifiers could and should also be used\
