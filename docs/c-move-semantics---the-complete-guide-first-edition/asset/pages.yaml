  md: "# noexcept for Copying and Moving Special Member Functions\n\nBy rule, a noexcept\
    \ condition is generated when special member functions are generated but not implemented.³\
    \ In that case, the operations guarantee not to throw if the corresponding operations\
    \ called for all base classes and non-static members guarantee not to throw.\n\
    \nFor example:\n\n`basics/specialnoexcept.cpp`\n\n```\n```cpp\n#include <iostream>\n\
    #include <type_traits>\n\nclass B\n{\n    std::string s;\n};\n\nint main()\n{\n\
    \    std::cout << std::boolalpha;\n    std::cout << std::is_nothrow_default_constructible<B>::value\
    \ << '\\n';\n    std::cout << std::is_nothrow_copy_constructible<B>::value <<\
    \ '\\n';\n    std::cout << std::is_nothrow_move_constructible<B>::value << '\\\
    n';\n    std::cout << std::is_nothrow_copy_assignable<B>::value << '\\n';\n  \
    \  std::cout << std::is_nothrow_move_assignable<B>::value << '\\n';\n}\n```\n\
    ```\n\nThe output of the program is as follows:\n\n```\n```text\ntrue\nfalse\n\
    true\nfalse\ntrue\n```\n```\n\nThe generated copy constructor and copy assignment\
    \ operator might throw because copying a `std::string` might throw. However, the\
    \ generated default constructor, move constructor, and move assignment operator\
    \ guarantee not to throw because the default constructor, move constructor, and\
    \ move assignment operator of class `std::string` guarantee not to throw.⁴\n\n\
    Note that the noexcept condition is even generated when these special member functions\
    \ are user-declared with `=default`. Thus, we have the same effect if we declare\
    \ class B as follows:\n\n³ This also applies to the default constructor, the “pseudo”\
    \ special member functions such as a defaulted `operator<` or `operator==` (available\
    \ since C++20), and even to all inherited constructors.\n\n⁴ For the move assignment\
    \ operator of strings, the noexcept guarantee is only given if the strings use\
    \ the same or an interchangeable allocator."
