  md: "```\nclass B\n{\n    std::string s;\npublic:\n    B(const B&) = default;  \
    \                   // noexcept condition automatically generated\n    B(B&&)\
    \ = default;                          // noexcept condition automatically generated\n\
    \    B& operator= (const B&) = default;         // noexcept condition automatically\
    \ generated\n    B& operator= (B&&) = default;              // noexcept condition\
    \ automatically generated\n};\n```\n\nWhen you have a defaulted special member\
    \ function you can explicitly specify a different noexcept guarantee than the\
    \ generated one. For example:\n\n```\nclass C\n{\n    ...\npublic:\n    C(const\
    \ C&) noexcept = default;          // guarantees not to throw (OK since C++20)\n\
    \    C(C&&) noexcept(false) = default;        // specifies that it might throw\
    \ (OK since C++20)\n    ...\n};\n```\n\nBefore C++20, if the generated and specified\
    \ noexcept condition contradict, the defined function was deleted.\n\n# noexcept\
    \ for Destructors\n\nBy rule, destructors always guarantee not to throw by default.\
    \ This applies to both generated and implemented destructors.\n\nFor example:\n\
    \n```\nclass B\n{\n    std::string s;\npublic:\n    ...\n    ~B() {          \
    \                      // automatically always declared as `B() noexcept\n   \
    \ }\n};\n```\n\nWith noexcept(false), you can declare them without this guarantee,\
    \ but that usually never makes any sense because several guarantees of the C++\
    \ standard library are based on the fact that destructors never throw."
