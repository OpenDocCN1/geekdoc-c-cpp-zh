- pgno: 46
  md: "Although you do not know the value, the string is in a consistent state. For\
    \ example, `s.size()` will return the number of characters so that you can iterate\
    \ over all valid indexes:\n\n```\nfoo(std::move(s));              // keeps s in\
    \ a valid but unclear state\n```\n\n```\nfor (int i = 0; i < s.size(); ++i) {\n\
    \    std::cout << s[i];             // OK\n}\n```\n\nFor user-defined types you\
    \ should also ensure that moved-from objects are in a valid state, which sometimes\
    \ requires the declaration or implementation of move operations. The chapter *Moved-From\
    \ States* will discuss this in detail.\n\n# 2.3.2 Reusing Moved-From Objects\n\
    \nYou might wonder why moved-from objects are still valid objects and are not\
    \ (partially) destroyed. The reason is that we are useful applications of move\
    \ semantics where it makes sense to use moved-from objects again.\n\nFor example,\
    \ consider code where we read line-by-line strings from a stream and move them\
    \ into a vector:\n\n```\nstd::vector<std::string> allRows;\nstd::string row;\n\
    while (std::getline(mStream, row)) {  // read next line into row\n    allRows.push_back(std::move(row));\
    \  // and move it to somewhere\n}\n```\n\nEach time after we read a line into\
    \ row, we use `std::move()` to move the value of row into the vector of all rows.\
    \ Then, `std::getline()` uses the moved-from object row again to read the next\
    \ line into it.\n\nAs a second example, consider a generic function that swaps\
    \ two values:\n\n```\ntemplate<typename T>\nvoid swap(T& a, T& b)\n{\n    T tmp{std::move(a)};\n\
    \    a = std::move(b);      // assign new value to moved-from a\n    b = std::move(tmp);\
    \    // assign new value to moved-from b\n}\n```\n\nHere, we move the value of\
    \ a into a temporary object to be able to move-assign the value of b afterwards.\
    \ The moved-from object b then receives the value of tmp, which is the former\
    \ value of a.\n\nCode like this is used in sorting algorithms for example, where\
    \ we move the values of the different elements around to bring them into a sorted\
    \ order. Assigning new values to moved-from objects happens there all the time.\
    \ The algorithm might even use the sorting criterion for such a moved-from object.\n\
    \nIn general, moved-from objects should be valid objects that can be destroyed\
    \ (the destructor should not fail), reused to get other values, and support all\
    \ other operations object their type supports without knowing the value. The chapter\
    \ *Moved-From States* will discuss this in detail."
