  md: "```\n```cpp\n    }\n    ...\n```\n```\n\nAll valid references extend the lifetime\
    \ of the value they bind to. This also applies to rvalue references.\nHowever,\
    \ we do not bind to the return value of createString() (that would work fine);\
    \ we bind to a\nreference to the return type of createStrings() returned by at().\
    \ This means that we extend the lifetime\nof the reference but not of the return\
    \ value of createString(). Therefore, the loop iterates over strings\nthat were\
    \ already destroyed.\n\n# **Using the Range-Based for Loop**\n\nA universal reference\
    \ can make sense even when *calling* the range-based for loop.\n\nTo modify the\
    \ elements while iterating over them you have to use a non-const reference. Consider\
    \ a function template that assigns a passed value to all elements of a passed\
    \ collection:\n\n```\n```cpp\ntemplate<typename Coll, typename T>\nvoid assign(Coll&\
    \ coll, const T& value) {\n    for (auto& elem : coll) {\n        elem = value;\n\
    \    }\n}\n```\n```\n\nIt looks like it usually works for all container and element\
    \ types (where assignments are supported):\n\n```\n```cpp\nstd::vector<int> coll1{0,\
    \ 8, 15};\n...\nassign(coll1, 42);   // OK\n\nstd::vector<std::string> coll2{\"\
    hello\", \"world\"};\n...\nassign(coll2, \"ok\"); // OK\n```\n```\n\nHowever,\
    \ there is a case where it suddenly does not work:\n\n```\n```cpp\nstd::vector<bool>\
    \ collB{false, true, false};\n...\nassign(collB, true); // ERROR: cannot bind\
    \ non-const lvalue reference to an rvalue\n```\n```\n\nWhat happened? Well, let\
    \ us look at the code the range-based for loop expands to here:\n\n```\n```cpp\n\
    std::vector<bool> coll{false, true, false};\n...\n{\n    auto&& range = coll;\
    \                  // OK: universal reference to reference\n    auto pos = range.begin();\
    \             // OK\n    auto end = range.end();               // OK\n    for\
    \ ( ; pos != end; ++pos ) {         // OK\n        auto& elem = *pos;        \
    \        // ERROR: cannot bind non-const lvalue reference to an rvalue\n     \
    \   elem = elem + elem;\n    }\n}\n```\n```"
