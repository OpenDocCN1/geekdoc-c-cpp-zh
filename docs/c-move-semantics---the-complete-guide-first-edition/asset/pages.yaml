- pgno: 10
  md: '# # Preface


    Move semantics, introduced with C++11, has become a hallmark of modern C++ programming.
    However, it also complicates the language in many ways. Even after several years
    of support, experienced programmers struggle with all the details of move semantics,
    style guides still recommend different consequences for programming even of trivial
    classes, and we still discuss semantic details in the C++ standards committee.


    Whenever I have taught what I have learned about C++ move semantics so far, I
    have said, “Somebody has to write a book about all this,” and the usual answer
    was: “Yes, please do”. So, I finally did.


    As always when writing a book about C++, I was surprised about the number of aspects
    to be taught, the situations to be clarified, and the consequences to be described.
    It really was time to write a book about all aspects of move semantics, covering
    all C++ versions from C++11 up to C++20. I learned a lot and I am sure you will
    too.


    # ## An Experiment


    This book is an experiment in two ways:


    +   - I am writing an in-depth book covering a complex core language feature without
    the direct help of a core language expert as a co-author. However, I can ask questions
    and I do.

    +   - I am publishing the book myself on Leanpub and for printing on demand. That
    is, this book is written step by step and I will publish new versions as soon
    there is a significant improvement that makes the publication of a new version
    worthwhile.


    The good thing is:


    +   - You get the view of the language features from an experienced application
    programmer—somebody who feels the pain a feature might cause and asks the relevant
    questions to be able to motivate and explain the design and its consequences for
    programming in practice.

    +   - You can benefit from my experience with move semantics while I am still
    writing.

    +   - This book and all readers can benefit from your early feedback.


    This means that you are also part of the experiment. So help me out: give feedback
    about flaws, errors, features that are not explained well, or gaps, so that we
    all can benefit from these improvements.'
  merge: -1
  img_proc: true
