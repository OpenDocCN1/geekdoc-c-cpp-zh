- pgno: 186
  md: "# 10.4.2  Why `&&` for Both Ordinary Rvalues and Universal References?\n\n\
    Universal/forwarding references use the same syntax as ordinary rvalue references,\
    \ which is a serious source of trouble and confusion. So why did we not introduce\
    \ a specific syntax for universal references?\n\nAn alternative proposal, for\
    \ example, might have been (and is sometimes discussed as a possible fix):\n\n\
    +   - Use **two** ampersands for ordinary rvalue references:\n\n```\nvoid foo(Coll&&\
    \ arg);              // arg is an ordinary value reference\n```\n\n+   - Use **three**\
    \ ampersands for universal references:\n\n```\ntemplate<typename Coll>\nvoid foo(Coll&&&\
    \ arg);             // arg is universal/forwarding reference\n```\n\nHowever,\
    \ these three ampersands might just look too ridiculous (whenever I show this\
    \ option people laugh). Unfortunately, it would have been better to use the three\
    \ ampersands because it would make code more intuitive.\n\nAs discussed, when\
    \ constraining universal references to concrete types, we would then just have\
    \ to declare\n\n```\nvoid processString(std::string&& arg);  // assume &&& declares\
    \ a universal reference\n```\n\ninstead of\n\n```\ntemplate<typename T>\nrequires\
    \ std::is_convertible_v<T, std::string>\nvoid processString(T&& arg);\n```\n\n\
    or even:\n\n```\ntemplate<typename T,\n         typename =\n           typename\
    \ std::enable_if<std::is_convertible<T, std::string>::value\n                \
    \                  >::type>\nvoid processString(T&& args);\n```\n\nThere is an\
    \ important lesson to be learned here: it is better to have a ridiculous but clear\
    \ syntax than to have a cool but confusing mess.\n\n# 10.5  Summary\n\n+   - You\
    \ can use universal references to bind to all const and non-const objects without\
    \ losing the information about the constness of the object.\n+   - You can use\
    \ universal references to implement special handling for passed arguments with\
    \ move semantics even without using `std::forward<>()`.\n+   - To have a universal\
    \ reference of a specific type, you need concepts/requirements (since C++20) or\
    \ some template tricks (up to C++17).\n+   - Only rvalue references of function\
    \ template parameters are universal references. Rvalue references of class template\
    \ parameters, members of template parameters, and full specializations are ordinary\
    \ rvalue references, you can only bind to rvalues."
  merge: -1
  img_proc: true
- pgno: 187
  md: '+   - When specifying the types of universal references explicitly, they act
    no longer as universal references. Use `Type&` to be able to pass lvalues then.

    +   - The C++ standards committee introduced *forwarding reference* as a “better”
    term for *universal reference*. Unfortunately, the term *forwarding reference*
    restricts the purpose of universal references to a common specific use case and
    creates the unnecessary confusion of having two terms for the same thing. Therefore,
    use *universal/forwarding reference* to avoid even more confusion.'
