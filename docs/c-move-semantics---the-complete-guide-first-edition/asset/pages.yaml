  md: "```\n```cpp\nint main()\n{\n    std::vector<std::string> coll;\n    ...\n \
    \   insert(coll, std::string{\"prvalue\"});   // calls full specialization for\
    \ rvalues\n    std::string str{\"lvalue\"};\n    insert(coll, str);          \
    \             // calls full specialization for lvalues\n    insert(coll, std::move(str));\
