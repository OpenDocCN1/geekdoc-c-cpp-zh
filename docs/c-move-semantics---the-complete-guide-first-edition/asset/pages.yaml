- pgno: 106
  md: '# # Chapter 6


    # # Moved-From States


    Although move semantics as generated or naively implemented usually works fine,
    we should at least have a look at the possible case of a move operation bringing
    objects into a state that is not supported by the C++ standard library or breaks
    invariants of the type.


    In this chapter, we clarify the definition of an “invalid” state according to
    the guarantee of the C++ standard library that moved-from objects are in a valid
    but unspecified state.


    # ## 6.1  Required and Guaranteed States of Moved-From Objects


    After a move operation, the moved-from objects are neither partially nor fully
    destroyed. The destructor has not been called yet and will still be called when
    the lifetime of the moved-from object ends. Therefore, the destructor has to at
    least run smoothly.


    However, the C++ standard library guarantees more for its moved-from types. Moved-from
    objects are in a “valid but unspecified state.” This means that you can use a
    moved-from object just like any object of its type where you do not know its value.
    It is like using a non-const reference parameter of the type without having any
    idea about the value of the passed object. By knowing that we can do more than
    just destroy moved-from objects, we can, for example, use move semantics to implement
    sorting and mutating algorithms.


    To understand how to deal with moved-from objects in more detail, it is better
    to distinguish between two aspects relevant for them:[^1]


    +   - What are the **requirements** for using moved-from objects safely with the
    C++ standard library?

    +   - What **guarantees** should you give moved-from objects of your types so
    that users of these types know how to use them with well-defined behavior?


    Usually, the guarantees you give should at least fulfill the requirements of the
    C++ standard library but they might guarantee more.


    [^1]: Thanks to Sean Parent for pointing that out.'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 6.1.1  Required States of Moved-From Objects


    The requirements for moved-from objects in the C++ standard library are nothing
    special. That is, for any function, the requirements it formulates for the passed
    types and objects also apply to any moved-from objects passed or used internally.


    Basically, you always have to be able to destroy a moved-from object. In addition,
    in many functions, you have to be able to assign a new value to a moved-from object.


    Consider, for example, how we swap the values of two objects a and b (which might
    be part of a sorting operation). Swapping is usually implemented as follows (see
    Figure 6.1):


    +   - Move a to a new temporary object tmp (so that a becomes a moved-from object).

    +   - Move-assign b to the moved-from object a (so that b becomes a moved-from
    object).

    +   - Move-assign tmp to the moved-from object b (so that tmp becomes a moved-from
    object).

    +   - Destroy the moved-from object tmp.


    ![](img/7ef3d1ca55bdc192f1cc0929179f3d21_107_0.png)


    *Figure 6.1. Moved-from objects in swap functions*


    Note that we might also have self-swapping by passing the same object to both
    parameters. In that case, we might even assign an object with a moved-from state
    to itself. This should work (provided a moved-from object still can have any value).


    So, for moved-from objects we have the same basic requirements that usually apply
    to all objects:


    +   - We have to be able to destroy moved-from objects.

    +   - We have to be able to assign a new value to moved-from objects.

    +   - We should be able to copy, move, or assign a moved-from objects to another
    object.


    Moved-from objects should also be able to deal with additional requirements particular
    operations have. For example, to sort objects we have to support calling operator<
    or the sorting criterion for all objects. This also applies to moved-from objects.
    You might argue that in your sorting algorithm you should know which object was
    moved so that you avoid comparing it, but the C++ standard library does not require
    that. This, by the way, also means that you can pass moved-from objects to sort
    them. As long as they support all required operations, everything is fine.'
