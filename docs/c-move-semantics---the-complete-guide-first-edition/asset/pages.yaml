- pgno: 192
  md: "```\nauto&& r1{s};                    // std::string&\nauto&& r2{std::move(s)};\
    \        // std::string&&\n\nauto&& r3{retByValue()};        // std::string&&\n\
    auto&& r4{retByRef()};          // std::string&\nauto&& r5{retByRefRef()};   \
    \    // std::string&&\nauto&& r6{retByConstRef()};     // const std::string&\n\
    auto&& r7{retByConstRefRef()};  // const std::string&&\n```\n\nWhenever we use\
    \ an rvalue (prvalue or xvalue) to initialize a reference declared with `auto&&`,\
    \ we declare an rvalue reference. For example, this is the case when we bind the\
    \ reference to an object marked with `std::move()` or to a returned plain value\
    \ or rvalue reference.\n\nHowever, when we use an lvalue to initialize a reference\
    \ declared with `auto&&`, we declare an lvalue reference. For example, this is\
    \ the case when we bind the reference to an object that has a name or to the return\
    \ value of a function returning an lvalue reference.\n\nBecause string literals\
    \ are lvalues (with a character array as type) we also get an lvalue reference\
    \ when we bind the universal reference to a string literal:\n\n```\nauto&& r8{\"\
    hello\"};             // const char (&) [6]\n```\n\nBecause references to functions\
    \ are always lvalues we also get an lvalue reference when we bind the universal\
    \ reference to a function:\n\n```\nstd::string foo(int);            // forward\
    \ declaration\n\nauto&& r9{foo};                  // lvalue of type std::string\
    \ &(int)\n```\n\n# 11.2.2  Perfectly Forwarding an auto&& Reference\n\nThe same\
    \ way we can perfectly forward the value passed to a universal reference as a\
    \ function template parameter:\n\n```\ntemplate<typename T>\nvoid callFoo(T&&\
    \ ref) {\n    foo(std::forward<T>(ref));    // becomes foo(std::move(ref)) for\
    \ passed rvalues\n}\n```\n\nwe can perfectly forward the universal reference declared\
    \ with `auto&&`:\n\n```\nauto&& ref{...};\n\nfoo(std::forward<decltype(ref)>(ref));\
    \  // becomes foo(std::move(ref)) for rvalues\n```\n\nRemember that the expression\
    \ `std::forward<decltype(ref)>(ref)` is essentially implemented as follows:\n\n\
    +   - If the passed type `decltype(ref)` is an lvalue reference, which it is if\
    \ `ref` was initialized with a returned lvalue reference, the expression casts\
    \ `ref` to an lvalue reference, which means that `ref` is passed without move\
    \ semantics."
