  img_proc: true
- pgno: 181
  md: "That means:\n\n```\n    MyType v;\n    const MyType c;\n```\n\n```\n    f(v);\
    \    // T is deduced as MyType& and arg has this type\n    f(c);    // T is deduced\
    \ as const MyType& and arg has this type\n```\n\nNow consider how std::forward<>\
    \ is defined in contrast to std::move():\n\n+   - `std::move()` always converts\
    \ any type to an rvalue reference:\n+   \n+         static_cast<remove_reference_t<T>&&>(t)\n\
    +   \n+     It removes any references and converts to the corresponding rvalue\
    \ reference type (removes any & and adds &&).\n\n+   - `std::forward<>` only adds\
    \ rvalue referenceness to the passed type parameter:\n+   \n+         static_cast<T&&>(t)\n\
    \nHere, the reference collapsing rules apply again:\n\n+   - If type T is an lvalue\
    \ reference, T&& is still an lvalue reference (&& has no effect). Therefore, we\
    \ cast arg to an lvalue reference, which means that arg has no move semantics.\n\
    +   - However, if T is an rvalue reference (or not a reference at all), T&& is\
    \ (still) an rvalue reference. Therefore, we cast arg to an rvalue reference and\
    \ that way we change the value category to an xvalue, which is the effect of std::move().\n\
    \nIn total, therefore, we get:\n\n```\n    template<typename T>\n    void f(T&&\
    \ arg)              // arg is a universal/forwarding reference\n    {\n      \
    \  g(std::forward<T>(arg));  // perfectly forward (move() only for passed rvalues)\n\
    \    }\n```\n\n```\n    MyType v;\n    const MyType c;\n\n    f(v);          \
    \   // T and arg are MyType&, forward() has no effect in this case\n    f(c);\
    \             // T and arg are const MyType&, forward() has no effect in this\
    \ case\n    f(MyType{});      // T is MyType, arg is MyType&&, forward() is equivalent\
    \ to move()\n    f(std::move(v));  // T is MyType, arg is MyType&&, forward()\
    \ is equivalent to move()\n```\n\nNote that string literals are lvalues so that\
    \ we deduce T and arg for them as follows:\n\n```\n    f(\"hi\");            \
    \  // lvalue passed, so T and arg have type const char (&)[3]\n    f(std::move(\"\
    hi\"));   // rvalue passed, so T is deduced as const char [3]\n              \
    \             //              and arg has type const char (&&)[3]\n```"
