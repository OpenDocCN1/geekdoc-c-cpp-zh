  md: "```\n```cpp\nstd::vector<std::string> createAndInsert()\n{\n    std::vector<std::string>\
    \ coll;\n    coll.reserve(3);\n    std::string s = \"data\";\n\n    coll.push_back(s);\n\
    \n    coll.push_back(s+s);\n\n    coll.push_back(std::move(s));\n\n    return\
    \ coll;\n}\n\nstd::vector<std::string> v;\n\nv = createAndInsert();\n```\n```\n\
    \n![](img/7ef3d1ca55bdc192f1cc0929179f3d21_32_0.png)\n\nNote the following two\
    \ very important things to understand about move semantics:\n\n+   - `std::move(s)`\
    \ only *marks* `s` to be movable in this context. It does not move anything. It\
    \ only says, “*I no longer need this value here.*” It allows the implementation\
    \ of the call to benefit from this mark by performing some optimization when copying\
    \ the value, such as stealing the memory. Whether the value is moved is something\
    \ the caller does not know.\n+   \n+   - However, an optimization that steals\
    \ the value has to ensure that the source object is still in a valid state. A\
