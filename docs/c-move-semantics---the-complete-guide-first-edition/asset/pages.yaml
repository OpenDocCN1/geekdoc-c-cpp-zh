- pgno: 178
  md: "# ### 10.2.3 Rvalue References of Parameters in Full Specializations\n\nAn\
    \ rvalue reference to a parameter of a full specialization of a function template\
    \ is *not* a universal reference. For example:\n\n```\n~~~cpp\ntemplate<typename\
    \ T>            // primary template\nvoid foo(T&& arg);              // - arg\
    \ is a universal reference\n...\ntemplate<>                      // full specialization\
    \ (for rvalues only)\nvoid foo(std::string&& arg);    // - arg is not a universal\
    \ reference\n~~~\n```\n\nFor lvalues of type std::string still the primary template\
    \ will be called. To specialize all cases of the primary template for std::strings\
    \ you have to provide a second full specialization:\n\n```\n~~~cpp\ntemplate<>\
    \                      // full specialization (for lvalues)\nvoid foo(std::string&\
    \ arg);\n~~~\n```\n\nHere is a complete example:\n\n*generic/universalspec.cpp*\n\
    \n```\n~~~cpp\n#include <iostream>\n#include <string>\n#include <vector>\n\n//\
    \ primary template taking a universal reference:\ntemplate<typename Coll, typename\
    \ T>\nvoid insert(Coll& coll, T&& arg)\n{\n    std::cout << \"primary template\
    \ for type T called\\n\";\n    coll.push_back(arg);\n}\n\n// full specialization\
    \ for rvalues of type std::string:\ntemplate<>\nvoid insert(std::vector<std::string>&\
    \ coll, std::string&& arg)\n{\n    std::cout << \"full specialization for type\
    \ std::string&& called\\n\";\n    coll.push_back(arg);\n}\n\n// full specialization\
    \ for lvalues of type std::string:\ntemplate<>\nvoid insert(std::vector<std::string>&\
    \ coll, const std::string& arg)\n{\n    std::cout << \"full specialization for\
    \ type const std::string& called\\n\";\n    coll.push_back(arg);\n}\n~~~\n```"
