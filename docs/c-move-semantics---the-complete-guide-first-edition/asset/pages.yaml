  md: "We have to mark `str` with `std::move()` again:\n\n```\n```cpp\nvoid rvFunc(std::string&&\
    \ str) {\n    rvFunc(std::move(str));      // OK, passing an xvalue\n}\n```\n\
    ```\n\nThis is the formal specification of the rule that **move semantics is not\
    \ passed through** that we have already discussed. Again, note that this is a\
    \ feature, not a bug. If we passed move semantics through, we would not be able\
    \ to use an object that was passed with move semantics twice, because the first\
    \ time we use it it would lose its value. Alternatively, we would need a feature\
    \ that temporarily disables move semantics here.\n\nIf we bind an rvalue reference\
    \ parameter to an rvalue (prvalue or xvalue), the object is used as an lvalue,\
    \ which we have to convert to an rvalue again to pass it to an rvalue reference.\n\
    \nNow, remember that `std::move()` is nothing but a `static_cast` to an rvalue\
    \ reference. That is, what we program in a recursive call is just the following:\n\
    \n```\n```cpp\nvoid rvFunc(std::string&& str) {\n    rvFunc(static_cast<std::string&&>(str));\
    \  // OK, passing an xvalue\n}\n```\n```\n\nWe cast the object `str` to its own\
    \ type. So far, that would be a no-op. However, with the cast, we do something\
    \ else: we change the value category. By rule, with a cast to an rvalue reference\
    \ the lvalue becomes an xvalue and therefore allows us to pass the object to an\
    \ rvalue reference.\n\nThis is nothing new: even before C++11, a parameter declared\
    \ as an lvalue reference followed the rules of lvalues when being used. The key\
    \ point is that a reference in a declaration specifies what can be passed to a\
    \ function. For the behavior inside a function references are irrelevant.\n\n\
    Confusing? Well that is just how we define the rules of move semantics and value\
    \ categories in the C++ standard. Take it as it is. Fortunately, compilers know\
    \ these rules.\n\nIf there is one thing for you to learn here it is that move\
    \ semantics is not passed through. If you pass an object with move semantics you\
    \ have to mark it with `std::move()` again to forward its semantics to another\
    \ function.\n\n# ## 8.6 Checking Value Categories with `decltype`\n\nTogether\
    \ with move semantics, C++11 introduced a new keyword `decltype`. The primary\
    \ goal of this keyword is to get the exact type of a declared object. However,\
    \ it can also be used to determine the value category of an expression.\n\n# ###\
    \ 8.6.1 Using `decltype` to Check the Type of Names\n\nIn a function that takes\
