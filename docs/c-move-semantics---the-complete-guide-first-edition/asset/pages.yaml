  md: "# 8.3 Impact of Value Categories When Binding References\n\nValue categories\
    \ play an important role when we bind references to objects. For example, in C++98/C++03,\
    \ they define that you can assign or pass an rvalue (a temporary object without\
    \ a name or an object marked with `std::move()`) to a const value reference but\
    \ not to a non-const value reference:\n\n```\n```cpp\nstd::string createString();\
    \        // forward declaration\n```\n```\n\n```\n```cpp\nconst std::string& r1{createString()};\
    \    // OK\n```\n```\n\n```\n```cpp\nstd::string& r2{createString()};        \
    \   // ERROR\n```\n```\n\nThe typical error message printed by the compiler here\
    \ is “cannot bind a non-const lvalue reference to an rvalue.”\n\nYou also get\
    \ this error message with the call of `foo2()` here:\n\n```\n```cpp\nvoid foo1(const\
    \ std::string&);       // forward declaration\nvoid foo2(std::string&);      \
    \        // forward declaration\n```\n```\n\n```\n```cpp\nfoo1(std::string{\"\
    hello\"});          // OK\nfoo2(std::string{\"hello\"});          // ERROR\n```\n\
    ```\n\n# 8.3.1 Overload Resolution with Rvalue References\n\nLet us see the exact\
    \ rules when passing an object to a reference.\n\nAssume we have a non-const variable\
    \ `v` and a const variable `c` of a class X:\n\n```\n```cpp\nclass X {\n    ...\n\
    };\n\nX v{...};\nconst X c{...};\n```\n```\n\nTable Rules for binding references\
    \ lists the formal rules for binding references to passed arguments if we provide\
    \ all the reference overloads of a function `f()`:\n\n```\n```cpp\nvoid f(const\
    \ X&);    // read-only access\nvoid f(X&);          // OUT parameter (usually\
    \ long-living object)\nvoid f(X&&);         // can steal value (object usually\
    \ about to die)\nvoid f(const X&&);   // no clear semantic meaning\n```\n```\n\
    \nThe numbers list the priority for overload resolution so that you can see which\
    \ function is called when multiple overloads are provided. The smaller the number,\
    \ the higher the priority (priority 1 means that this is tried first).\n\nNote\
    \ that you can only pass rvalues (prvalues, such as temporary objects without\
    \ a name) or xvalues (objects marked with `std::move()`) to rvalue references.\
    \ That is where their name comes from.\n\nYou can usually ignore the last column\
    \ of the table because const rvalue references do not make much sense semantically,\
    \ meaning that we get the following rules:"
