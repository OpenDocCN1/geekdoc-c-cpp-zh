  md: "# ### 15.3.2 Move Semantics for std::optional<>\n\nstd::optional<> is a value\
    \ type available since C++17 that extends the possible values of a *contained\
    \ type* by the value “*there is no value*.” That avoids the need to mark one specific\
    \ value of the type to have this semantics (such as the value 0 for pointers).\n\
    \nOptional objects also support move semantics. If you move the object as a whole,\
    \ the state is copied and the contained object (if there is one) is moved. As\
    \ a result, a moved-from object still has the same state but any value becomes\
    \ unspecified.\n\nHowever, you can also move a value into or out of the contained\
    \ object. For example:\n\n```\n~~~cpp\nstd::optional<std::string> os;\nstd::string\
    \ s = \"a very very long string\";\nos = std::move(s);          // OK, moves\n\
    std::string s2 = *os;       // OK, copies\nstd::string s3 = std::move(*os);  //\
    \ OK, moves\n~~~\n```\n\nNote that after the last call, os still has a string\
    \ value but as usual for moved-from objects, the value is unspecified. Thus, you\
    \ can use it as long as you do not make any assumption about its value. You can\
    \ even assign a new string value there.\n\nNote also that some overloads ensure\
    \ that temporary optionals are moved. Consider a function that returns an optional\
    \ string:\n\n```\n~~~cpp\nstd::optional<std::string> func();\n~~~\n```\n\nIn this\
    \ case, the following is well-defined to move the value:\n\n```\n~~~cpp\nstd::string\
    \ s4 = func().value();  // OK, moves\nstd::string s5 = *func();         // OK,\
    \ moves\n~~~\n```\n\nThis behavior is possible by using reference qualifiers that\
    \ provide rvalue overloads for the corresponding member functions:\n\n```\n~~~cpp\n\
    namespace std {\n  template<typename T>\n  class optional {\n    ...\n    constexpr\
    \ T& operator*() &;\n    constexpr const T& operator*() const&;\n    constexpr\
    \ T&& operator*() &&;\n    constexpr const T&& operator*() const&&;\n\n    constexpr\
    \ T& value() &;\n    constexpr const T& value() const&;\n    constexpr T&& value()\
    \ &&;\n    constexpr const T&& value() const&&;\n  };\n}\n~~~\n```\n\nBy using\
    \ reference qualifiers, the class can return the moved value when the operation\
    \ is called for rvalues (temporary objects or objects marked with std::move()):"
