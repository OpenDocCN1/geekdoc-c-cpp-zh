  md: "```\n~~~cpp\nstd::string foo()\n{\n    std::string s;\n    ...\n    return\
    \ s;         // best performance (return value optimization or move)\n}\n~~~\n\
    ```\n\nUsing `std::move()` when you already have a temporary object is at least\
    \ redundant. For a function `createString()` that returns an object by value,\
    \ you should just use the return value:\n\n```\n~~~cpp\nstd::string s{createString()};\
    \        // OK\n~~~\n```\n\ninstead of marking it with `std::move()` again:\n\n\
    ```\n~~~cpp\nstd::string s{std::move(createString())};    // BAD: don't do this\n\
    ~~~\n```\n\nCompilers might (have options to) warn about any counterproductive\
    \ or unnecessary use of `std::move()`. For example, gcc has the options `-Wpessimizing-move`\
    \ (enabled with `-Wall`) and `-Wredundant-move` (enabled with `-Wextra`).\n\n\
    There are applications, though, where a `std::move()` in a return statement might\
    \ be appropriate. One example is moving out the value of a member. Another example\
    \ is returning a parameter with move semantics.\n\n# ## 4.3 Initialize Members\
    \ with Move Semantics\n\nA surprising consequence is that you can benefit from\
    \ move semantics even in trivial classes with members of types that benefit from\
    \ move semantics (such as string members or containers).\n\nLet us look at this\
    \ with a simple example.\n\n# ### 4.3.1 Initialize Members the Classical Way\n\
    \nConsider a class with two string members, which we can initialize in the constructor.\
    \ Such a class will typically be implemented like this:\n\n`basics/initclassic.hpp`\n\
    \n```\n~~~cpp\n#include <string>\n\nclass Person {\nprivate:\n    std::string\
    \ first;  // first name\n    std::string last;   // last name\npublic:\n    Person(const\
    \ std::string& f, const std::string& l)\n      : first{f}, last{l} {\n    }\n\
    \    ...\n};\n~~~\n```"
