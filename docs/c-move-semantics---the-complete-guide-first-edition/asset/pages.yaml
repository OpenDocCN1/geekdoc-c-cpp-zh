- pgno: 191
  md: 'The answer is that again, you need a universal/forwarding reference, which,
    however, is not declared as a parameter. For this purpose, `auto&&` was introduced.


    Instead of:


    ```

    ```cpp

    // pass return value of compute() to process():

    process(compute(t));  // OK, uses perfect forwarding of returned value

    ```

    ```


    you can also implement the following:


    ```

    ```cpp

    // pass return value of compute() to process() with some delay:

    auto&& ret = compute(t);                  // initialize a universal reference
    with the return value

    ...

    process(std::forward<decltype(ret)>(ret));  // OK, uses perfect forwarding of
    returned value

    ```

    ```


    Or, when using brace initialization:


    ```

    ```cpp

    // pass return value of compute() to process() with some delay:

    auto&& ret{compute(t)};                   // initialize a universal reference
    with the return value

    ...

    process(std::forward<decltype(ret)>(ret));  // OK, uses perfect forwarding of
    returned value

    ```

    ```


    See `generic/perfectautoretf.cpp` for a complete example with all cases.


    # 11.2.1  Type Deduction of `auto&&`


    If you declare something with `auto&&`, you also declare a *universal reference*.
    You define a reference that binds to all value categories and the type of this
    reference preserves the type and the value category of its initial value.


    If you declare


    ```

    ```cpp

    auto&& ref{...};             // ref is a universal/forwarding reference

    ```

    ```


    the type `ref` is deduced according to the same type deduction rules as **universal
    references being function template parameters**:


    ```

    ```cpp

    template<typename T>

    void callFoo(T&& ref);  // ref is a universal/forwarding reference

    ```

    ```


    By rule, the type of `ref` (which is the type `auto&&` or `T&&`) is


    +   - An lvalue reference if we refer to an lvalue

    +   - An rvalue reference if we refer to an rvalue


    For example:


    ```

    ```cpp

    // forward declarations:

    std::string retByValue();

    std::string& retByRef();

    std::string&& retByRref();

    const std::string& retByConstRef();

    const std::string&& retByConstRref();


    // deduced auto&& types:

    std::string s;

    ```

    ```'
