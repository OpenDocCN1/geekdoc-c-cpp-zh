  md: "However, right after that, we no longer need the temporary return value and\
    \ we destroy it:\n\n```\n```cpp\nstd::vector<std::string> createAndInsert()\n\
    {\n    std::vector<std::string> coll;\n    coll.reserve(3);\n    std::string s\
    \ = \"data\";\n\n    coll.push_back(s);\n\n    coll.push_back(s+s);\n\n    coll.push_back(s);\n\
    \n    return coll;\n}\n\nstd::vector<std::string> v;\n...\nv = createAndInsert();\n\
    ```\n```\n\n![](img/7ef3d1ca55bdc192f1cc0929179f3d21_27_0.png)\n\nAgain, we create\
    \ a copy of a temporary object and destroy the source of the copy immediately\
    \ afterwards, which means that we again unnecessarily allocate and free memory.\
    \ This time it applies to four allocations, one for the vector and one for each\
    \ string element.\n\nFor the state of this program after the assignment in main(),\
    \ we allocated memory ten times and released it six times. The unnecessary memory\
    \ allocations were caused by:\n\n+   - Inserting a temporary object into the collection\n\
    +   - Inserting an object into the collection where we no longer need the value\n\
    +   - Assigning a temporary vector with all its elements\n\nWe can more or less\
    \ avoid these performance penalties. In particular, instead of the last assignment,\
    \ we could do the following:\n\n+   - Pass the vector as an out parameter:\n+\
    \   \n+     ```cpp\n+     createAndInsert(v);   // let the function fill vector\
    \ v\n+     ```\n+   - Use swap():\n+   \n+     ```cpp\n+     createAndInsert().swap(v);\n\
    +     ```\n\nHowever, the resulting code looks uglier (unless you see some beauty\
    \ in complex code) and there is not really a workaround when inserting a temporary\
    \ object.\n\nSince C++11, we have another option: compile and run the program\
    \ with support for move semantics."
