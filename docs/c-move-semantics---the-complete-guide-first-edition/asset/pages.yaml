  img_proc: true
- pgno: 211
  md: "# ### 13.1.1 Declaring Move-Only Types\n\nMove-only types have copying disabled.\
    \ Usually, the copy constructor and the copy assignment operator are deleted,\
    \ while the move constructor and move assignment operator are defaulted or implemented:\n\
    \nFor example:\n\n```\n```cpp\nclass MoveOnly {\npublic:\n  // constructors:\n\
    \  MoveOnly();\n\n  ...\n  // copying disabled:\n  MoveOnly(const MoveOnly&) =\
    \ delete;\n  MoveOnly& operator= (const MoveOnly&) = delete;\n  // moving enabled:\n\
    \  MoveOnly(MoveOnly&&) noexcept;\n  MoveOnly& operator= (MoveOnly&&) noexcept;\n\
    };\n```\n```\n\nBy rule, it would be enough to declare the moving special member\
    \ function (because declaring special move members marks the copying members as\
    \ deleted). However, explicitly marking the copying special member function with\
    \ =delete makes the intention more clear.\n\n# ### 13.1.2 Using Move-Only Types\n\
    \nWith a declaration like the one above, you can create and move but not copy\
    \ objects. For example:\n\n```\n```cpp\nstd::vector<MoveOnly> coll;\n...\ncoll.push_back(MoveOnly{});\
    \    // OK, creates a temporary object, which is moved into coll\n...\nMoveOnly\
    \ mo;\ncoll.push_back(mo);            // ERROR: can't copy mo into coll\ncoll.push_back(std::move(mo));\
    \ // OK, moves mo into coll\n```\n```\n\nTo move the value of a move-only element\
    \ out of the container, simply use std::move() for a reference to the element.\
    \ For example:\n\n```\n```cpp\nmo = std::move(coll[0]);       // move assign first\
    \ element (still there with moved-from state)\n```\n```\n\nHowever, remember that\
    \ after this call, the element is still in the container with a moved-from state.\n\
    \nMoved out all elements is also possible in loops:\n\n```\n```cpp\nfor (auto&\
    \ elem : coll) {      // note: non-const reference\n  coll2.push_back(std::move(elem));\
    \ // move element to coll2\n}\n```\n```\n\nAgain: the elements are still in the\
    \ container with their moved-from state."
  merge: -1
  img_proc: true
- pgno: 212
  md: "For move-only types, a couple of operations that are usually valid are not\
    \ possible:\n\n+   - You cannot use `std::initializer_lists` because they are\
    \ usually passed by value, which requires copying of the elements.\n\n```\nstd::vector<MoveOnly>\
    \ coll{ MoveOnly{}, ... };  // ERROR\n```\n\n+   - You can only iterate by reference\
    \ over all move-only elements of a container:\n\n```\nstd::vector<MoveOnly> coll;\n\
    ...\nfor (const auto& elem : coll) {  // OK\n    ...\n}\n...\nfor (auto elem :\
    \ coll) {        // ERROR: can’t copy move-only elements\n    ...\n}\n```\n\n\
    See `lib/moveonly.cpp` for a complete program with all example statements from\
    \ this section.\n\n# 13.1.3  Passing Move-Only Objects as Arguments\n\nYou can\
    \ pass and return move-only objects by value provided move semantics is used:\n\
    \n```\nvoid sink(MoveOnly arg);          // sink() takes ownership of the passed\
    \ argument\n\nsink(MoveOnly{});\nMoveOnly mo;\nsink(mo);                     \
    \     // ERROR: can’t copy mo to arg\nsink(std::move(mo));               // OK,\
    \ moves mo to arg because passed by value\n```\n\nSemantically, you pass the ownership\
    \ of the associated resource here to the function. However, note that this is\
    \ only the case if the argument is taken by value.\n\nThe `sink()` function can\
    \ also be declared to take a move-only object by (rvalue or universal) reference.\
