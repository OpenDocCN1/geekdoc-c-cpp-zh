- pgno: 132
  md: "# 7.1.3 Is noexcept Worth It?\n\nYou might wonder whether declaring move constructors\
    \ with more or less complicated noexcept expressions is worth it. Howard Hinnant\
    \ demonstrated the effect with a simple program (slightly adapted for this book):\n\
    \n```\n```cpp\n// basics/movenoexcept.cpp\n\n#include <iostream>\n#include <string>\n\
    #include <vector>\n#include <chrono>\n\n// string wrapper with move constructor:\n\
    struct Str\n{\n    std::string val;\n\n    // ensure each string has 100 characters:\n\
    \    Str()\n      : val(100, 'a') {   // don't use braces here\n    }\n\n    //\
    \ enable copying:\n    Str(const Str&) = default;\n\n    // enable moving (with\
    \ and without noexcept):\n    Str (Str&& s) NOEXCEPT\n      : val(std::move(s.val))\
    \ {\n    }\n};\n\nint main()\n{\n    // create vector of 1 Million wrapped strings:\n\
    \    std::vector<Str> coll;\n    coll.resize(1000000);\n\n    // measure time\
    \ to reallocate memory for all elements:\n    auto t0 = std::chrono::steady_clock::now();\n\
    \    coll.reserve(coll.capacity() + 1);\n    auto t1 = std::chrono::steady_clock::now();\n\
    \n    std::chrono::duration<double, std::milli> dt{t1 - t0};\n    std::cout <<\
    \ dt.count() << \"ms\\n\";\n}\n```\n```"
  merge: -1
