    \ application:\n\n```\n```cpp\nclass Person {\nprivate:\n    std::string name;\n\
    \    std::vector<std::string> values;\npublic:\n    Person(std::string n, std::vector<std::string>\
    \ v)\n      : name{std::move(n)}, values{std::move(v)} {\n    }\n    // better\
    \ pass by value and move to create a new element:\n    void addValue(std::string\
    \ s)       // take by value\n    {\n        values.push_back(std::move(s));  \
    \      // and move into the collection\n    }\n    ...\n};\n```\n```\n\n# 4.4\
    \  Move Semantics in Class Hierarchies\n\nAs we have seen, any declaration of\
    \ a copy constructor, copy assignment, or destructor disables the automatic support\
    \ for move semantics. This also applies to polymorphic base classes. However,\
    \ there are a few additional aspects to consider.\n\n# 4.4.1  Implementing a Polymorphic\
    \ Base Class\n\nA polymorphic base class usually introduces the virtual member\
    \ functions you can call for all objects of derived classes. For example:\n\n\
    ```\n```cpp\nclass GeoObj {\npublic:\n    virtual void draw() const = 0;     \
    \ // pure virtual function (introducing the API)\n    ...\n    virtual ~GeoObj()\
    \ = default;        // let delete call the right destructor\n```\n```"
