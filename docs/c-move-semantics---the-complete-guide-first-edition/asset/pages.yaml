  md: "This code might fail at runtime because for a moved-from card, there it is\
    \ no longer a guarantee that the value contains \"-of-\". In that case, `find()`\
    \ initializes `pos` with `std::string::npos`, which throws an exception of type\
    \ `std::out_of_range` when `pos+4` is used as the first argument of `substr()`.\n\
    \nSee *basics/card.hpp* and *basics/card.cpp* for the full example.\n\nThe options\
    \ for fixing this class are as follows:\n\n+   - Disable move semantics:\n\n```\n\
    ```cpp\nclass Card {\n    ...\n    Card(const Card&) = default;              //\
    \ disable move semantics\n    Card& operator=(const Card&) = default;   // disable\
    \ move semantics\n};\n```\n```\n\nHowever, that makes move operations (which,\
    \ for example, are called by `std::sort()`) more expensive.\n\n+   - Disable copying\
    \ and moving at all:\n\n```\n```cpp\nclass Card {\n    ...\n    Card(const Card&)\
    \ = delete;              // disable copy/move semantics\n    Card& operator=(const\
    \ Card&) = delete;   // disable copy/move semantics\n};\n```\n```\n\nHowever,\
    \ you can then no longer shuffle or sort cards.\n\n+   - Fix the broken special\
    \ move member functions.\n\nHowever, what would be a valid fix (is always assigning\
    \ a \"default value\" such as \"ace-of-clubs\" OK)? And how do you ensure that\
    \ objects with the default value perform well without allocating memory?\n\n+\
    \   - Internally allow the new state but disallow calling `getValue()` or other\
    \ member functions.\n\nYou can document this (\"For moved-from objects, you are\
    \ only allowed to assign a new value. All other member functions have the precondition\
    \ that the object is not in a moved-from state.\") or even check this inside the\
    \ member functions and raise an assertion or an exception.\n\n+   - Extend the\
    \ invariant by introducing a new state that a `Card` might have no value.\n\n\
    This means that you have to implement the moving special member functions because\
    \ you have to ensure that for a moved-from object, the member value is in this\
    \ state.\n\nUsually, a moved-from state is equivalent to a default-constructed\
    \ state. Therefore, this is also an opportunity to provide a default constructor.\
    \ Ideally, you might also provide a member function, checking for this state.\n\
    \nWith this change, the users of this class have to take into account that the\
    \ value of the string might be empty and update their code accordingly. For example:\n\
    \n```\n```cpp\nvoid print(const Card& c) {\n    std::string val{c.getValue()};\n\
    \    auto pos = val.find(\"-of-\");                 // find position of substring\n\
    \    if (pos != std::string::npos) {              // check whether it exists\n\
    \        std::cout << val.substr(0, pos) << ' '\n                  << val.substr(pos+4)\
    \ << '\\n';\n    }\n}\n```\n```"
