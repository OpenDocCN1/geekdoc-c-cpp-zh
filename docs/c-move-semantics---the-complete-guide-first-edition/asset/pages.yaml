  md: '# H


    # **header file**


    A file meant to become part of a translation unit through a `#include` directive.
    Such files often contain *declarations* of variables and functions that are referred
    to from more than one translation unit, as well as *definitions* of types, inline
    functions, templates, constants, and macros. They usually have a suffix such as
    `.hpp`, `.h`, `.H`, `.hh`, or `.hxx`. They are also called *include files*. See
    also *CPP file* and *translation unit*.


    # I


    # **include file**


    *See header file.*


    # **incomplete type**


    A class, struct, or unscoped enumeration type that is declared but not defined,
    an array of unknown size, `void` (optionally with `const` and/or `volatile`),
    or an array of an incomplete element type.


    # L


    # **lvalue**


    A category of expressions that produce a location for a stored value that is not
    assumed to be movable (i.e., *glvalues* that are not *xvalues*). Typical examples
    are expressions that denote named objects, string literals, and (references to)
    functions. The chapter about *value categories* describes details.


    # N


    # **named return value optimization (NRVO)**


    A feature that allows us to optimize away the creation of a return value from
    a named object in a return statement. If we already have a local object that we
    return in a function by value, the compiler can use the object directly as a return
    value instead of copying or moving it.


    Note that the *named return value optimization* differs from the *return value
    optimization (RVO)*, which is the optimization for returning an object created
    on the fly in the return statement. The named return value optimization is optional
    in all versions of C++. If the compiler does not generate corresponding code,
    move semantics is used to create the return value.


    # P


    # **prvalue**


    A category of expressions that perform initializations. Prvalues can be assumed
    to designate pure mathematical value such as 1 or true and temporaries (especially
    values returned by value). Any *rvalue* before C++11 is a *prvalue* in C++11.
    The chapter about *value categories* describes details.'
