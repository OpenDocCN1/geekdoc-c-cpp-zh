    ```


    All these references have the same semantics of “we can steal/modify the object
    we refer to, provided the state of the object remains a valid state.” Technically,
    these semantics are not checked by compilers, so we can modify any rvalue reference
    as we can do with any non-const object of the type. We might also decide not to
    modify the value. That is, if you have an rvalue reference to an object, the object
    might receive a different value (which might or might not be the value of a default-constructed
    object) or it might keep its value.


    As we have seen, move semantics allows us to optimize using a value of a source
    that no longer needs the value. If compilers automatically detect that a value
    is used from an object that is at the end of its lifetime, they will automatically
    switch to move semantics. This is the case when:


    +   - We pass the value of a temporary object that will automatically be destroyed
    after the statement.

    +   - We pass a non-const object marked with `std::move()`.


    # 2.1.2  Rvalue References as Parameters


    When we declare a parameter to be an rvalue reference, it has exactly the behavior
    and semantics as introduced above:


    +   - The parameter can bind only to a temporary object that does not have a name
    or to an object marked with `std::move()`.

    +   - According to the semantics of rvalue references:

    +     - The caller claims that it is no longer interested in the value. Therefore,
    you can modify the object the parameter refers to.

    +     - However, the caller might still be interested in using the object. Therefore,
    any modification should keep the referenced object in a valid state.


    For example:


    ```

    ```cpp

    void foo(std::string&& rv);  // takes only objects where we no longer need the
    value

    ...

    std::string s{"hello"};

    ...

    foo(s);                       // ERROR

    foo(std::move(s));            // OK, value of s might change

    foo(returnStringByValue());   // OK

    ```

    ```


    You can use a named object after passing it with `std::move()` but usually you
    should not. The recommended programming style is to no longer use an object after
    a `std::move()`:


    ```

    ```cpp

    void foo(std::string&& rv);  // takes only objects where we no longer need the
    value

    ...

    std::string s{"hello"};

    ...

    foo(std::move(s));            // OK, value of s might change

    ```

    ```'
