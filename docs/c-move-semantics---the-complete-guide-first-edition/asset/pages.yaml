- pgno: 140
  md: '+   - The index operator of vectors and strings is *not* marked with `noexcept`
    even though when used correctly it guarantees not to throw. However, when passing
    an invalid index, we have undefined behavior and implementations are allowed to
    do whatever they want. By not declaring them with `noexcept` these implementations
    could throw in this case.


    The second item is the guideline you should follow when implementing move semantics.
    We propose that you use a conditional `noexcept` declaration only when implementing
    a move constructor, a move assignment operator, or a `swap()` function. For all
    other functions, it is usually not worth the effort to think about the detailed
    conditions under which that function might throw many implementation details.


    With http://wg21.link/p0884, we added that wrapping types should also have conditional
    `noexcept` declarations:


    +   - If a library type has wrapping semantics to transparently provide the same
    behavior as the underlying type, then the default constructor, copy constructor,
    and copy-assignment operator should be marked as conditionally `noexcept` so that
    the underlying exception specification still holds.


    Finally, note that by rule, any destructor is always implicitly declared as `noexcept`.


    The consequences for your code are as follows:


    +   - You should implement the move constructor, the move assignment operator,
    and a `swap()` function with a (conditional) `noexcept`.

    +   - For all other functions, mark them with an unconditional `noexcept` only
    if you know that they cannot throw.

    +   - Destructors do not need a `noexcept` specification.


    # ## 7.5 Summary


    +   - With `noexcept`, you can declare a (conditional) guarantee not to throw.

    +   - If you implement a move constructor, move assignment operator, or `swap()`,
    declare it with a (conditional) `noexcept` expression.

    +   - For other functions, you might just want to mark them with an unconditional
    `noexcept` if they never throw.

    +   - Destructors are always declared with `noexcept` (even when implemented).'
