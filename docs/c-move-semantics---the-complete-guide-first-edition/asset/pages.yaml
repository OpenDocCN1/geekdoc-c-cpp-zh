  md: "# 15.2.3  Move Semantics for `std::array<>`\n\n`std::array<>` is the only container\
    \ that does not allocate memory on the heap. In fact, it is implemented as a templated\
    \ C data structure with an array member:\n\n```\ntemplate<typename T, size_t N>\n\
    struct array {\n  T elems[N];\n  ...\n};\n```\n\nTherefore, we cannot implement\
    \ move operations in a way that they move pointers to internal memory.\n\nAs a\
    \ consequence, `std::array<>` has a couple of different guarantees:\n\n+   - The\
    \ move constructor has linear complexity because it has to move element by element.\n\
    +   - The move assignment operator might always throw because it has to move assign\
    \ element by element.\n\nTherefore, in principle, there is no difference between\
    \ copying or moving an array of numeric values:\n\n```\nstd::array<double, 1000>\
    \ arr;\n...\nauto arr2{arr};                 // copies all double elements/values\n\
    auto arr3{std::move(arr)};       // still copies all double elements/values\n\
    ```\n\nFor all other containers, the latter would only move internal pointers\
    \ to the new object and would therefore be a significantly cheaper operation.\n\
    \nHowever, moving an array is still better than copying if moving the elements\
    \ is cheaper than copying them. For example:\n\n```\nstd::array<std::string, 1000>\
    \ arr;\n...\nauto arr2{arr};                 // copies string by string\nauto\
    \ arr3{std::move(arr)};       // moves string by string\n```\n\nIf the strings\
    \ allocate heap memory (i.e., they have a significant size if the small string\
    \ optimization (SSO) is used), moving the array of strings is usually significantly\
    \ faster.\n\nYou can see this with the program `lib/contmove.cpp`, which checks\
    \ the difference between copying and moving an array and a vector of different\
    \ element types (double, a small string, and a large string). Note that on your\
    \ platform, there might still be small performance differences between copying\
    \ and moving an array of doubles or small strings because slightly different code\
    \ with different optimizations is generated.\n\n# 15.3  Move Semantics for Vocabulary\
    \ Types\n\nThe C++ standard library provides a couple of vocabulary types for\
    \ handling one or multiple values with value semantics (objects hold and copy\
    \ their value autonomously and as a whole).\n\nIn principle, they all provide\
    \ move semantics. However, some of them need special discussion and remarks."
