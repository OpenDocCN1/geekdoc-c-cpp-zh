- pgno: 230
  md: "However, note that we have additional requirements and guarantees that apply\
    \ to the move constructor and move assignment operator of all containers except\
    \ std::array<>. These requirements and guarantees essentially mean that moved-from\
    \ containers are usually empty.\n\n# ## Container Guarantees for Move Constructors\n\
    \nFor the move constructor:\n\n```\n```cpp\nContainerType cont1{...};\nContainerType\
    \ cont2{std::move(cont1)};   // move the container\n```\n```\n\nthe C++ standard\
    \ specifies constant complexity. This means that the duration of a move does not\
    \ depend on the number of elements.\n\nWith this guarantee, implementers have\
    \ no other option but to steal the memory of elements as a whole from the source\
    \ object cont1 to the destination object cont2, leaving the source object cont1\
    \ in an initial/empty state.\n\nYou might argue that the move constructor could\
    \ also create a new value in the source object but that does not make much sense\
    \ because it only makes the operation slower.\n\nFor vectors, providing a value\
    \ in a moved-from object is even indirectly forbidden because the move constructor\
    \ of std::vector<> guarantees never to throw:\n\n```\n```cpp\ntemplate<typename\
    \ T, typename Allocator = allocator<T>>\nclass vector {\npublic:\n  ...\n  vector(const\
    \ vector&);        // copy constructor\n  vector(vector&&) noexcept;    // move\
    \ constructor\n  ...\n};\n```\n```\n\nIn summary, effectively we have the following\
    \ guarantees for containers after using them as source in a move constructor:\n\
    \n+   - For vectors, it is essentially required that the moved-from container\
    \ is empty.\n+   - For the other containers (except std::array<>), being empty\
    \ is not strictly required but it usually makes no sense to implement anything\
    \ else.\n\n# ## Container Guarantees for Move Assignment Operators\n\nFor the\
    \ move assignment operator:\n\n```\n```cpp\nContainerType cont1{...}, cont2{...};\n\
    cont2 = std::move(cont1);          // move assign the container\n```\n```\n\n\
    The C++ standard guarantees that this operation either overwrites or destroys\
    \ each element of the destination object cont2. This guarantees that all resources\
    \ that the elements of the destination container dest2 own on entry are released.\
    \ As a consequence, there are only two ways to implement a move assignment:\n\n\
    +   - Destroy the old elements and move the whole contents of the source to the\
    \ destination (i.e., move the pointer to the memory from the source to the destination)."
