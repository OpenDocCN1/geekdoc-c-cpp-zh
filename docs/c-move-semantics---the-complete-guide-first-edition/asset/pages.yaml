- pgno: 159
  md: "```\nfoo(c);                       // calls foo(const X&)\nfoo(X{});      \
    \               // calls foo(X&&)\nfoo(std::move(v));            // calls foo(X&&)\n\
    foo(std::move(c));            // calls foo(const X&)\n```\n\nNow assume that we\
    \ want to call `foo()` for the same arguments indirectly via a helper function\
    \ `callFoo()`. That helper function would also need the three overloads:\n\n```\n\
    void callFoo(const X& arg) {  // arg binds to all const objects\n  foo(arg); \
    \                  // calls foo(const X&)\n}\nvoid callFoo(X& arg) {        //\
    \ arg binds to lvalues\n  foo(arg);                   // calls foo(X&)\n}\nvoid\
    \ callFoo(X&& arg) {       // arg binds to rvalues\n  foo(std::move(arg));   \
    \     // needs std::move() to call foo(X&&)\n}\n```\n\nIn all cases, `arg` is\
    \ used as an lvalue (being an object with a name). The first version forwards\
    \ it as a `const` object but the other two cases implement the two different ways\
    \ to forward the non-`const` argument:\n\n+   - Arguments declared as lvalue references\
    \ (that bind to objects that do not have move semantics) are just passed as they\
    \ are.\n+   - Arguments declared as rvalue references (that bind to objects that\
    \ have move semantics) are passed with `std::move()`.\n\nThis allows us to forward\
    \ move semantics perfectly: for any argument that is passed with move semantics\
    \ we keep move semantics; but we do not add move semantics when we get an argument\
    \ that does not have it.\n\nOnly with this implementation is the use of `callFoo()`\
    \ to call `foo()` transparent:\n\n```\nX v;\nconst X c;\ncallFoo(v);         \
    \          // calls foo(X&)\ncallFoo(c);                   // calls foo(const\
    \ X&)\ncallFoo(X{});                 // calls foo(X&&)\ncallFoo(std::move(v));\
    \        // calls foo(X&&)\ncallFoo(std::move(c));        // calls foo(const X&)\n\
    ```\n\nRemember that an rvalue passed to an rvalue reference becomes an lvalue\
    \ when used, which means that we need `std::move()` to pass it as an rvalue again.\
    \ However, we cannot use `std::move()` everywhere. For the other overloads, using\
    \ `std::move()` would call the overload of `foo()` for rvalue references when\
    \ an lvalue is passed.\n\nFor *perfect forwarding* in generic code, we would always\
    \ need all these overloads for each parameter. To support all combinations, this\
    \ means having 9 overloads for 2 generic arguments and 27 overloads for 3 generic\
    \ arguments.\n\nTherefore, C++11 introduced a special way to *perfectly forward*\
    \ given arguments without any overloads but still keeping the type and the value\
    \ category."
