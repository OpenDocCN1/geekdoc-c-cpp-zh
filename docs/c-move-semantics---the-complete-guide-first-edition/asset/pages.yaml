    \ can also implement source functions that returns a (new) move-only object by\
    \ value, which means passing the ownership to the caller of the function.\n\n\
    If you return a local object that way, move semantics is automatically used:\n\
    \n```\nMoveOnly source()\n{\n    MoveOnly mo;\n    ...\n    return mo;       \
    \          // moves mo to the caller\n}\n\nMoveOnly m{source()};   // takes ownership\
    \ of the associated value/resource\n```\n\nIt is only if you have non-local data\
    \ that you might need a std::move() in the return statement (e.g., when moving\
    \ out the value of a member in a member function).\n\n# 13.1.5  Moved-From States\
    \ of Move-Only Objects\n\nThe moved-from state of move-only objects is usually\
    \ that they no longer own their resource. This is a defined state, which the user\
    \ of the type should be able to double-check. However, sometimes, move operations\
    \ just swap the internal data so that a move assignment assigns another resource\
    \ to the moved-from object (e.g., the stream classes do this).\n\nThe C++ standard\
    \ library uses different ways and names to check for a “moved-from” state that\
    \ no longer owns a resource. A positive check (Is there (still) a resource?) might,\
    \ for example, look as follows:\n\n+   - `if(s.is_open())` for a file stream `s`\n\
    +   - `if(up)` for a unique pointer `up`\n+   - `if(t.joinable())` for a thread\
