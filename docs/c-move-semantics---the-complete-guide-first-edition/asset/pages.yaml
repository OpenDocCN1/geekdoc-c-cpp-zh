  md: "# 15.3.1 Move Semantics for Pairs\n\nstd::pair<> is a good example of both\
    \ the benefits of move semantics and the complexity it might introduce. In principle,\
    \ we have only a generic data structure with two members (defined in namespace\
    \ std):\n\n```\ntemplate<typename T1, typename T2>\nstruct pair {\n    T1 first;\n\
    \    T2 second;\n    ...\n};\n```\n\nHowever, to support move semantics (and a\
    \ couple of other tricky corner cases, such as reference members), we have the\
    \ following declaration here. I show the C++14 version, which I made a bit more\
    \ readable):\n\n```\ntemplate<typename T1, typename T2>\nstruct pair {\n    //\
    \ types of each member:\n    using first_type = T1;       // same as: typedef\
    \ T1 first_type\n    using second_type = T2;\n    // the members:\n    T1 first;\n\
    \    T2 second;\n\n    // constructors:\n    constexpr pair();\n    constexpr\
    \ pair(const T1& x, const T2& y);\n    template<typename U, typename V> constexpr\
    \ pair(U&& x, V&& y);\n    pair(const pair&) = default;\n    pair(pair&&) = default;\n\
    \    template<typename U, typename V> constexpr pair(const pair<U, V>& p);\n \
    \   template<typename U, typename V> pair& operator=(const pair<U, V>& p);\n \
    \   template<typename... Args1, typename... Args2>\n      pair(piecewise_construct_t,\
    \ tuple<Args1...> first_args,\n           tuple<Args2...> second_args);\n\n  \
    \  // assignments:\n    pair& operator=(const pair& p);\n    pair& operator=(pair&&\
    \ p) noexcept(...);\n    template<typename U, typename V> pair& operator=(const\
    \ pair<U, V>& p);\n    template<typename U, typename V> pair& operator=(pair<U,\
    \ V>&& p);\n\n    // other:\n    void swap(pair& p) noexcept(...);\n};\n```"
