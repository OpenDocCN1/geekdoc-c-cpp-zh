- pgno: 180
  md: "# 10.3　How the Standard Specifies Perfect Forwarding\n\nTo finally understand\
    \ all rules of perfect forwarding, let us see how the rules are formally specified\
    \ in the C++ standard.\n\nAgain, consider you have the following declaration:\n\
    \n```\ntemplate<typename T>\nvoid f(T&& arg)              // arg is universal\
    \ forwarding reference\n{\n    g(std::forward<T>(arg));  // perfectly forward\
    \ (move() only for passed rvalues)\n}\n```\n\nNormally, T would just have the\
    \ type of the passed argument:\n\n```\nMyType v;\n\nf(MyType{});             \
    \   // T is deduced as MyType, so arg is declared as MyType&&\nf(std::move(v));\
    \            // T is deduced as MyType, so arg is declared as MyType&&\n```\n\n\
    However, for universal references, there is a special rule, if lvalues are passed\
    \ (see the section [temp.deduct.call] of the C++ standard):\n\nIf the parameter\
    \ type is an rvalue reference to a cv-unqualified template parameter and the argument\
    \ is an lvalue, the type “lvalue reference to T” is used in place of T for type\
    \ deduction.\n\nThat means that in this case:\n\n+   - If the type of the parameter\
    \ arg is declared with && and not declared with const or volatile\n+   - and an\
    \ lvalue is passed\n+   - then T is deduced as T& instead.\n\nIn our example,\
    \ that means:\n\n```\ntemplate<typename T>\nvoid f(T&& arg);             // arg\
    \ is a universal forwarding reference\n\nMyType v;\nconst MyType c;\n\nf(v); \
    \                      // T is deduced as MyType&\nf(c);                     \
    \  // T is deduced as const MyType&\n```\n\nHowever, we have arg declared as T&&.\
    \ So, if T is T& instead, what does that mean? Here, the *reference collapsing*\
    \ rule of C++ (see the section [dcl.ref] of the C++ standard) gives an answer:\n\
    \n+   - `T& &` becomes `T&`\n+   - `T& &&` becomes `T&`\n+   - `T&& &` becomes\
    \ `T&&`\n+   - `T&& &&` becomes `T&&`\n\n1. Since C++17, the C++ standard uses\
    \ the term *forwarding reference* in this definition."
