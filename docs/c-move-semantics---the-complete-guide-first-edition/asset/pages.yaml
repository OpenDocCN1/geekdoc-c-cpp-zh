  md: "# Chapter 11\n\n# Perfect Passing with `auto&&`\n\nAfter discussing the usual\
    \ case of move semantics in generic code, perfect forwarding a parameter, we now\
    \ have to talk about dealing with return values perfectly. In this chapter, we\
    \ discuss how to forward return values perfectly to somewhere else. For this purpose,\
    \ we introduce `auto&&` as another way to declare a *universal reference* (again\
    \ also called *forwarding reference*). However, we also discuss applications of\
    \ `auto&&` that have nothing to do with forwarding values.\n\nThe next chapter\
    \ then discusses how to perfectly return values.\n\n# 11.1  Default Perfect Passing\n\
    \n```\n```cpp\n// pass return value of compute() to process():\nprocess(compute());\
    \  // OK, uses perfect forwarding of returned value\n```\n```\n\nIn non-generic\
    \ code, you know the types involved. However, in generic code, you want to make\
    \ sure that the return value of `compute()` is perfectly passed to `process()`.\n\
    \nThe good news is: if you pass a return value to another function directly, the\
    \ value is passed perfectly, keeping its type and value category. You do not have\
    \ to worry about move semantics; it will automatically be used if supported.\n\
    \n# 11.1.1  Default Perfect Passing in Detail\n\nHere is a complete example:\n\
    \n```\n```cpp\ngeneric/perfectpassing.cpp\n#include <iostream>\n#include <string>\n\
    \nvoid process(const std::string& str) {\n    std::cout << \"process(const std::string&)\\\
    n\";\n```\n```"
