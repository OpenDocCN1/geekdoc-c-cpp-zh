- pgno: 47
  md: "# 2.3.3  Move Assignments of Objects to Themselves\n\nThe rule that moved-from\
    \ objects are in a valid but unspecified state usually also applies to objects\
    \ after a direct or indirect self-move.\n\nFor example, after the following statement,\
    \ object x is usually valid without its value being known:\n\n```\n`x = std::move(x);\
    \    // afterwards x is valid but has an unclear value`\n```\n\nAgain, the C++\
    \ standard library guarantees that for its objects.[^1] User-defined types should\
    \ usually also provide this guarantee, but sometimes you have to implement something\
    \ to fix the default-generated moved-from states.\n\n# 2.4  Overloading by Different\
    \ References\n\nAfter introducing rvalue references, we now have three major ways\
    \ of call-by-reference:\n\n+   - `void foo(const std::string& arg)` takes the\
    \ argument as const lvalue reference.\n+   \n+     This means that you have only\
    \ read access to the passed argument. Note that you can pass everything to a function\
    \ declared that way if the type fits:\n+     - A modifiable named object\n+  \
    \   - A const named object\n+     - A temporary object that does not have a name\n\
    +     - An object marked with `std::move()`\n+   \n+     The semantic meaning\
    \ is that we give `foo()` read access to the passed argument. The parameter is\
    \ what we call an *in* parameter.\n\n+   - `void foo(std::string& arg)` takes\
    \ the argument as non-const lvalue reference.\n+   \n+     This means that you\
    \ have write access to the passed argument. Note that you can no longer pass everything\
    \ to a function declared that way even if the type fits. You can only pass:\n\
    +     - A modifiable named object\n+   \n+     For all other arguments, the call\
    \ does not compile.\n+   \n+     The semantic meaning is that we give `foo()`\
    \ read/write access to the passed argument. The parameter is what we call an *out*\
    \ or *in/out* parameter.\n\n+   - `void foo(std::string&& arg)` takes the argument\
    \ as non-const rvalue reference.\n+   \n+     This also means that you have write\
    \ access to the passed argument. However, again you have restrictions on what\
    \ you can pass. You can only pass:\n+     - A temporary object that does not have\
    \ a name\n+     - An non-const object marked with `std::move()`\n\n[^1]: The guarantees\
    \ for moved-from library objects were clarified with the *library working group\
    \ issue* 2839 (see http://wg21.link/lwg2839)."
