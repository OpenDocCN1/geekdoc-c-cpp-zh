  md: "# # Chapter 5\n\n# # Overloading on Reference Qualifiers\n\nThis chapter discusses\
    \ overloading member functions for different reference qualifiers. As we will\
    \ see, this will answer the common community question about whether getters should\
    \ return by value or by constant reference.\n\n# ## 5.1 Return Type of Getters\n\
    \nWhen implementing getters for members that are expensive to copy, before C++11\
    \ we had the following alternatives:\n\n+   - Return by value\n+   - Return by\
    \ lvalue reference\n\nLet us discuss these alternatives briefly.\n\n# ### 5.1.1\
    \ Return by Value\n\nA getter returning by value would look like this (remember:\
    \ do not return by value using const otherwise you disable move semantics):\n\n\
    ```\n```cpp\nclass Person\n{\n  private:\n    std::string name;\n  public:\n \
    \   ...\n    std::string getName() const {\n      return name;\n    }\n};\n```\n\
    ```\n\nThis code is safe, but each time we ask for the name, we might copy the\
    \ name."
