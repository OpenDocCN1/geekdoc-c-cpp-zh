- pgno: 205
  md: "In this function, the type of `ret` is just the perfectly deduced type of `f()`.\
    \ By using `if constexpr` (a compile-time if available since C++17), we use the\
    \ two ways of `decltype(auto)` and `decltype` to deduce a type as follows:\n\n\
    +   - If `ret` is declared as an rvalue reference, `decltype(auto)` uses the expression\
    \ `std::move(ret)`, which is an xvalue, to deduce an rvalue reference. So we move\
    \ the value returned by `f()` to the caller of this function.\n+   - If `ret`\
    \ is declared as a plain value or lvalue reference, `decltype(auto)` uses the\
    \ type of the name `ret`, which is then used as a value type or an lvalue reference\
    \ type.\n\nOther solutions do not always work:\n\n+   - The following would do\
    \ the right thing even before C++20, but we have a performance issue:\n\n```\n\
    ```cpp\ndecltype(auto) call(...)\n{\n    decltype(auto) ret{f(...)};\n    ...\n\
    \    return static_cast<decltype(ret)>(ret);  // perfect return but unnecessary\
    \ copy\n}\n```\n```\n\nThe fact that we always use a `static_cast<>` might disable\
    \ move semantics and copy elision. For plain values, it is like having an unnecessary\
    \ `std::move()` in the return statement.\n\n+   - Simply returning `ret` would\
    \ not always work:\n\n```\n```cpp\ndecltype(auto) call(...)\n{\n    decltype(auto)\
    \ ret{f(...)};\n    ...\n    return ret;                         // may be an\
    \ ERROR\n}\n```\n```\n\nThe return type of `call()` would be correct. However,\
    \ if `f()` returns an rvalue reference, we cannot return the lvalue `ret` because\
    \ a non-const rvalue reference does not bind to an lvalue.\n\n+   - Using `auto&&`\
    \ to declare `ret` would not work because you would then always return by reference:\n\
    \n```\n```cpp\ndecltype(auto) call(...)\n{\n    auto&& ret{f(...)};\n    ...\n\
    \    return ret;  // fatal runtime error: returns a reference to a local object\n\
    }\n```\n```\n\nDo **never** put additional parentheses around a returned name\
    \ when using `decltype(auto)`:\n\n```\n```cpp\ndecltype(auto) call(...)\n{\n \
    \   decltype(auto) ret{f(...)};\n\n    if constexpr (std::is_rvalue_reference_v<decltype(ret)>)\
    \ {\n        return std::move(ret);  // move value returned by f() to the caller\n\
    \    }\n}\n```\n```"
