    \      // OK, moves ownership into new element of coll\n```\n\nIf you pass a unique\
    \ pointer to a potential sink function that takes the argument by reference, you\
    \ do not know whether the ownership was moved. Whether the ownership was moved\
    \ depends on the implementation of the function. In that case, you can double-check\
    \ the state with operator bool():\n\n```\nstd::unique_ptr<std::string> up;\n…\n\
    sink(std::move(up));  // might move ownership to sink()\nif (up) {           \
    \   // does it still have the ownership?\n    …\n}\n```\n\nAlternatively, you\
    \ might ensure that the ownership is gone (resource released):\n\n```\nstd::unique_ptr<std::string>\
    \ up;\n…\nsink(std::move(up));  // might move ownership to sink()\nup.reset();\
    \            // ensure ownership is gone (resource deleted)\n```"
