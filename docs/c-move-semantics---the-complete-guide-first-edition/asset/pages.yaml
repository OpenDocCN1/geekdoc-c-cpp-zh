    # # Core Features of Move Semantics


    After the first motivating example, this chapter discusses the basic features
    of move semantics.


    # ## 2.1 Rvalue References


    To support move semantics we introduce a new type of reference: rvalue references.
    Let us discuss what they are and how to use them.


    # ### 2.1.1 Rvalue References in Detail


    Rvalue references are declared with two ampersands. Just as ordinary references,
    which are declared with one ampersand and are now called lvalue references, rvalue
    references refer to an existing object that has to be passed as an initial value.
    However, according to their semantic meaning, rvalue references can refer only
    to a temporary object that does not have a name or to an object marked with `std::move()`:


    ```

    ```cpp

    std::string returnStringByValue();        // forward declaration

    ...

    std::string s{"hello"};

    ...

    std::string&& r1{s};                       // ERROR

    std::string&& r2{std::move(s)};            // OK

    std::string&& r3{returnStringByValue()};   // OK, extends lifetime of return value

    ```

    ```


    The name *rvalue reference* comes from the fact that these objects can usually
    refer only to *rvalues*, a *value category* for temporary objects that do not
    have a name and objects marked with `std::move()`.


    As usual for successful initializations of references from return values, references
    extend the lifetime of the return value until the end of the lifetime of the reference
    (ordinary const lvalue references already had this behavior).


    The syntax used to initialize the reference is irrelevant. You can use the equal
    sign, braces, or parentheses:'
