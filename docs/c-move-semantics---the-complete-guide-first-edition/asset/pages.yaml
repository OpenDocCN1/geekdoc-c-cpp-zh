- pgno: 173
  md: "# 10.1.2   Universal References in Detail\n\nThe previous example demonstrates\
    \ that declaring an argument as a universal reference has more use than just perfectly\
    \ forwarding it to another function. Let us analyze the mechanisms a little further.\n\
    \nConsider the following declaration:\n\n```\n```cpp\ntemplate<typename T>\nvoid\
    \ foo(T&& arg) {\n    ...\n}\n```\n```\n\nWhen we declare arg, we have a reference\
    \ that can bind universally to all types and value categories. For a non-const\
    \ object v and a const object c the type T and the type of arg is deduced as follows:\n\
    \n|   | T | arg |\n|---|---|---|\n| `foo(v)` | `Type&` | `Type&` |\n| `foo(c)`\
    \ | `const Type&` | `const Type&` |\n| `foo(Type&&)` | `Type` | `Type&&` |\n|\
    \ `foo(move(v))` | `Type` | `Type&&` |\n| `foo(move(c))` | `const Type` | `const\
    \ Type&&` |\n\nThat means that the information about the passed argument is split\
    \ as follows:\n\n+   - `arg` still knows the value and its value including whether\
    \ or not it is const. It is an lvalue reference if an lvalue was passed and an\
    \ rvalue reference if an rvalue was passed. `arg` also does know whether an lvalue\
    \ or an rvalue was passed.\n+   - `T` knows the type and has some information\
    \ about the value category of the passed argument (whether an lvalue or rvalue\
    \ was passed). According to a specific template type deduction rule, if an lvalue\
    \ was passed, `T` is an lvalue reference; otherwise, `T` is not a reference.\n\
    \nCalling `std::forward<T>(arg)` brings all information together again to restore\
    \ both constness and value category to perfectly forward the passed argument with\
    \ its current value. However, if you do not need the value category of the passed\
    \ argument for perfect forwarding, you do not need `std::forward<>`.\n\n# Constness\
    \ Dependent Code\n\nIf you only have to know whether the passed argument was const,\
    \ you can use both arg and T. For example:\n\n```\n```cpp\ntemplate<typename T>\n\
    void foo(T&& arg)\n{\n    if constexpr(std::is_const_v<std::remove_reference_t<T>>)\
    \ {\n        ...    // passed argument is const\n    }\n    else {\n        ...\
    \    // passed argument is not const\n    }\n}\n```\n```\n\nHere, we use if constexpr\
    \ (a compile-time if, introduced with C++17) to do different things depending\
    \ on whether the passed argument is const."
