  md: "to the caller of `call()`. Therefore, we can call both functions that return\
    \ by value and functions that return by reference. For example:\n\n*generic/call.cpp*\n\
    \n```\n```cpp\n#include \"call.hpp\"\n#include <iostream>\n#include <string>\n\
    \nstd::string nextString()\n{\n    return \"Let's dance\";\n}\n\nstd::ostream&\
    \ print(std::ostream& strm, const std::string& val)\n{\n    return strm << \"\
    value: \" << val;\n}\n\nstd::string&& returnArg(std::string&& arg)\n{\n    return\
    \ std::move(arg);\n}\n\nint main()\n{\n    auto s = call(nextString);        \
    \         // call() returns temporary object\n\n    auto&& ref = call(returnArg,\
    \ std::move(s)); // call() returns rvalue reference to s\n    std::cout << \"\
    s:  \" << s << '\\n';\n    std::cout << \"ref: \" << ref << '\\n';\n\n    auto\
    \ str = std::move(ref);                 // move value from s and ref to str\n\
    \    std::cout << \"s:   \" << s << '\\n';\n    std::cout << \"ref: \" << ref\
    \ << '\\n';\n    std::cout << \"str: \" << str << '\\n';\n\n    call(print, std::cout,\
    \ str) << '\\n';       // call() returns reference to std::cout\n}\n```\n```\n\
    \nWhen calling\n\n```\n```cpp\nauto s = call(nextString);\n```\n```"
