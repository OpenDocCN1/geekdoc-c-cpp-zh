  md: "# Implementing Move Semantics\n\nThe third option is to implement the move\
    \ operations so that they do not break the invariants of the class. For this,\
    \ we have to decide what the state of a moved-from object should be. To support\
    \ that `asString()` can call `operator*` without checking whether a value exists,\
    \ we would always have to provide a value. We could, for example, have a static\
    \ moved-from value which we assign to objects where the value is moved away.⁶\n\
    \n`basics/sharedint.hpp`\n\n```\n```cpp\n#include <memory>\n#include <string>\n\
    \nclass SharedInt {\n  private:\n    std::shared_ptr<int> sp;\n    // special\
    \ “value” for moved-from objects:\n    inline static std::shared_ptr<int> movedFromValue{std::make_shared<int>(0)};\n\
    \n  public:\n    explicit SharedInt(int val)\n      : sp{std::make_shared<int>(val)}\
    \ {\n    }\n\n    std::string asString() const {\n      return std::to_string(*sp);\
    \    // OOPS: unconditional deref\n    }\n\n    // fix moving special member functions:\n\
    \    SharedInt (SharedInt&& si)\n      : sp{std::move(si.sp)} {\n        si.sp\
    \ = movedFromValue;\n    }\n    SharedInt& operator= (SharedInt&& si) noexcept\
    \ {\n      if (this != &si) {\n        sp = std::move(si.sp);\n        si.sp =\
    \ movedFromValue;\n      }\n      return *this;\n    }\n\n    // enable copying\
    \ (deleted with user-declared move operations):\n    SharedInt (const SharedInt&)\
    \ = default;\n```\n```\n\n⁶ Note that inline static members are only supported\
    \ since C++17. Before C++17, you had to define the member in a separate CPP file\
    \ to respect the *one definition rule* (ODR)."
