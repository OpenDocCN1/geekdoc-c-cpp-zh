- pgno: 151
  md: '| Call | `f(X&)` | `f(const X&)` | `f(X&&)` | `f(const X&&)` |

    |---|---:|---:|---:|---:|

    | `f(v)` | 1 | 2 | no | no |

    | `f(c)` | no | 1 | no | no |

    | `f(X{})` | no | 3 | 1 | 2 |

    | `f(move(v))` | no | 3 | 1 | 2 |

    | `f(move(c))` | no | 2 | no | 1 |


    *Table 8.1. Rules for binding references*


    +   - A non-const lvalue reference takes only non-const values.

    +   - An rvalue reference takes only non-const rvalues.

    +   - A const lvalue reference can take everything and serves as the fallback
    mechanism in case other overloads are not provided.


    The following extract from the middle of the table is the rule for the fallback
    mechanism of move semantics:


    | Call | `f(const X&)` | `f(X&&)` |

    |---|---:|---:|

    | `f(X{})` | 3 | 1 |

    | `f(move(v))` | 3 | 1 |


    If we pass an rvalue (temporary object or object marked with `std::move()`) to
    a function and there is no specific implementation for move semantics (declared
    by taking an rvalue reference), the usual copy semantics is used, taking the argument
    by const&.


    Please note that we will extend this table later when we introduce universal/forwarding
    references.


    There will also learn that sometimes, you can pass an lvalue to an rvalue reference
    (when a template parameter is used). Be aware that not every declaration with
    && follows the same rules. The rules here apply if we have a *type* (or type alias)
    declared with &&.


    # 8.3.2  Overloading by Reference and Value


    We can declare functions by both reference and value parameters: For example:


    ```

    void f(X);        // call-by-value

    void f(const X&);  // call-by-reference

    void f(X&&);

    void f(const X&&);

    ```


    In principle, declaring all these overloads is allowed. However, there is no specific
    priority between call-by-value and call-by-reference. If you have a function declared
    to take an argument by value (which can take any argument of any value category),
    any matching declaration taking the argument by reference creates an ambiguity.


    Therefore, you should usually only take an argument either by value or by reference
    (with as many reference overloads as you think are useful) but never both.'
