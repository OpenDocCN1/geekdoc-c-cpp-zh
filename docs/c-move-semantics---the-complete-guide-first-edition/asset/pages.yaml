  md: "the function `call()` calls the function `nextString()` without any arguments\
    \ and returns its return value perfectly to initialize `s`.\n\nWhen calling\n\n\
    ```\n```cpp\nauto&& ref = call(returnArg, std::move(s));\n```\n```\n\nthe function\
    \ `call()` calls the function `returnArg()` with `s` marked with `std::move()`.\
    \ `returnArg()` returns back the passed argument as an rvalue reference, which\
    \ then `call()` perfectly returns to the caller to initialize `ref`. `str` still\
    \ has its value and `ref` refers to it:\n\n```\n```text\ns:    Let’s dance\nref:\
    \  Let’s dance\n```\n```\n\nWith\n\n```\n```cpp\nauto str = std::move(ref);\n\
    ```\n```\n\nwe move the value of both `s` and `ref` to `str`, which means we get\
    \ the following situation:\n\n```\n```text\ns:\nref:\nstr: Let’s dance\n```\n\
    ```\n\nWhen calling\n\n```\n```cpp\ncall(print, std::cout, ref) << '\\n';\n```\n\
    ```\n\nthe function `call()` calls the function `print()` with `std::cout` and\
    \ `ref` as perfectly forwarded arguments. `print()` returns the passed stream\
    \ back as an lvalue reference, which is then returned perfectly to the caller\
    \ of `call()`.\n\n# ### 12.2.2 Deferred Perfect Returning\n\nTo perfectly return\
    \ a value that was computed earlier, we have to declare a local object with `decltype(auto)`\
    \ and return it with `std::move()` if and only if it is an rvalue reference. For\
    \ example:¹\n\n```\n```cpp\ntemplate<typename Func, typename... Args>\ndecltype(auto)\
    \ call(Func f, Args&&... args)\n{\n    decltype(auto) ret{f(std::forward<Args>(args)...)};\n\
    \    ...\n    if constexpr (std::is_rvalue_reference_v<decltype(ret)>) {\n   \
    \     return std::move(ret);  // move xvalue returned by f() to the caller\n \
    \   }\n    else {\n        return ret;             // return the plain value or\
    \ the lvalue reference\n    }\n}\n```\n```"
