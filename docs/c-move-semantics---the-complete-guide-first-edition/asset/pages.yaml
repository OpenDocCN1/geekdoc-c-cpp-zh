- pgno: 200
  md: "# Chapter 12\n\n# Perfect Returning with\n`decltype(auto)`\n\nAfter discussing\
    \ perfect forwarding a parameter and perfectly passing through a returned value,\
    \ we now have to talk about returning values perfectly. This chapter introduces\
    \ the new placeholder type `decltype(auto)`. We will also see surprising consequences\
    \ such as the strong recommendation not to use unnecessary parentheses in return\
    \ statements.\n\n# ## 12.1  Perfect Returning\n\nIn generic code, we often compute\
    \ a value that we then return to the caller. The question is, how do we perfectly\
    \ return the value but still keep whatever type and value category it has? In\
    \ other words: how should we declare the return type of the following function:\n\
    \n```\n```cpp\ntemplate<typename T>\n??? callFoo(T&& arg)\n{\n    return foo(std::forward<T>(arg));\n\
    }\n```\n```\n\nIn this function, we call a function called `foo()` with the perfectly\
    \ forwarded parameter `arg`. We do not know what `foo()` returns for this type;\
    \ it might be a temporary value (prvalue), an lvalue reference, or an rvalue reference.\
    \ The return type might be const or not const.\n\nSo, how do we perfectly return\
    \ the return value of `foo()` to the caller of `callFoo()`? A couple of options\
    \ do not work:\n\n+   - Return type `auto` will remove the references of the return\
    \ type of `foo()`. If, for example, we give access to the element of a container\
    \ (consider `foo()` as the `at()` member function or index operator of a vector),\
    \ `callFoo()` would no longer give access to the element. In addition, we might\
    \ create an unnecessary copy (if not optimized away)."
  merge: -1
  img_proc: true
- pgno: 201
  md: "+   - Any return type that is a reference (`auto&`, `const auto&`, and `auto&&`)\
    \ will return a reference to a local object if `foo()` returns a temporary object\
    \ by value. Fortunately, compilers can issue a warning when they detect such a\
    \ bug.\n\nThat is, we need a way to say:\n\n+   - Return by value if we got/have\
    \ a value\n+   - Return by reference if we got/have a reference\n\nbut still keep\
    \ both the type and the value category of what we return.\n\nC++14 introduced\
    \ a new placeholder type for this purpose: `decltype(auto)`.\n\n```\ntemplate<typename\
    \ T>\ndecltype(auto) callFoo(T&& arg)        // since C++14\n{\n    return foo(std::forward<T>(arg));\n\
    }\n```\n\nWith this declaration, callFoo() returns by value, if foo() returns\
    \ by value, and callFoo() returns by reference if foo() returns by reference.\
    \ In all cases, both the type and the value category are retained.\n\n# 12.2 \
    \ decltype(auto)\n\nJust like the other placeholder type auto, decltype(auto)\
    \ is a placeholder type that lets the compiler deduce the type at initialization\
    \ time. However, in this case, the type is deduced according to the rules of decltype:\n\
    \n+   - If you initialize it with or return a plain *name*, the return type is\
    \ the type of the object with that name.\n+   - If you initialize it with or return\
    \ an *expression*, the return type is the type and value category of the evaluated\
    \ expression as follows with the following encoding:\n+     - For a **prvalue**,\
    \ it just yields its value type: *type*\n+     - For an **lvalue**, it yields\
    \ its type as an lvalue reference: *type&*\n+     - For an **xvalue**, it yields\
    \ its type as an rvalue reference: *type&&*\n\nFor example:\n\n```\nstd::string\
    \ s = \"hello\";\nstd::string& r = s;\n```\n\n```\n// initialized with name:\n\
    decltype(auto) da1 = s;          // std::string\ndecltype(auto) da2(s);      \
    \     // same\ndecltype(auto) da3{s};           // same\ndecltype(auto) da4 =\
    \ r;          // std::string&\n```\n\n```\n// initialized with expression:\ndecltype(auto)\
    \ da5 = std::move(s);  // std::string&&\ndecltype(auto) da6 = +s;            \
    \ // std::string\ndecltype(auto) da7 = s[0];           // char&\ndecltype(auto)\
    \ da8 = (s);            // std::string&\n```"
