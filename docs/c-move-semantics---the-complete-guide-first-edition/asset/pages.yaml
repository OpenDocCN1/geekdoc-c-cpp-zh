  md: "+   - With noexcept(std::cout << name), we ask whether the call of the output\
    \ expression for the name guarantees not to throw. Here, we use noexcept as an\
    \ operator that tells us whether all the corresponding operations to perform the\
    \ passed expression guarantee not to throw.\n\nAs you might imagine, with this\
    \ declaration, reallocation will use the copy constructor again. The move constructor\
    \ for strings does guarantee not to throw but the output operator does not. However,\
    \ the move constructor usually does not output anything; therefore, in general\
    \ when members do not throw, we can give the guarantee not to throw for the move\
    \ constructor as a whole.\n\nThe good news is that the compiler will detect noexcept\
    \ guarantees for you if you do not implement the move constructor yourself. For\
    \ classes where all members guarantee not to throw in the move constructor, a\
    \ generated or defaulted move constructor will give the guarantee as a whole.\n\
