  md: "memory to bring the vector back to its previous state (the C++ standard library\
    \ assumes and requires that destructors do not throw; otherwise, it would not\
    \ be able to roll back).\n\nReallocation is a perfect place for move semantics\
    \ because we move elements from one location to the other. Therefore, since C++11,\
    \ we want to use move semantics here. However, then we are in trouble: if an exception\
    \ is thrown during the reallocation, we might not be able to roll back. The elements\
    \ in the new memory have already stolen the values of the elements in the old\
    \ memory. Therefore, destroying the new elements would not be enough; we have\
    \ to move them back. But how do we know that moving them back does not fail?\n\
    \nYou might argue that a move constructor should never throw. This might be correct\
    \ for strings (because we just move integral values and pointers around), but\
    \ because we require that moved-from objects are in a valid state, this state\
    \ may need memory, which means that the move might throw if we are out of memory\
    \ (e.g., node-based containers of Visual C++ are implemented that way).\n\nWe\
    \ also cannot give up the guarantee because programs might have used this feature\
    \ to avoid creating a backup of a vector and losing that data could be (safety)\
    \ critical. And no longer supporting `push_back()` would be a nightmare for the\
    \ acceptance of C++11.\n\nThe final decision was to use move semantics on reallocation\
    \ only when the move constructor of the element type guarantees not to throw.\n\
    \n# 7.1.2 Move Constructors with noexcept\n\nTherefore, our small example program\
    \ changes its behavior when we guarantee that the move constructor of class `Person`\
    \ never throws:\n\n`basics/personmove.hpp`\n\n```\n```cpp\n#include <string>\n\
    #include <iostream>\n\nclass Person {\n  private:\n    std::string name;\n  public:\n\
    \    Person(const char* n)\n      : name{n} {\n    }\n\n    std::string getName()\
