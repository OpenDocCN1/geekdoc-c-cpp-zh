- pgno: 85
  md: "# **Overloading for Rvalue and Lvalue References**\n\nWhile functions that\
    \ take rvalue references work fine when we pass temporary objects to them (here,\
    \ we pass temporary std::strings created from string literals), they also have\
    \ restrictions: we cannot pass named objects that still need the value afterwards.\
    \ Therefore, we have only a constructor that takes rvalue references, we cannot\
    \ pass an existing string:\n\n```\n    class Person {\n      ...\n      Person(std::string&&\
    \ f, std::string&& l)\n        : first{std::move(f)}, last{std::move(l)} {\n \
    \     }\n      ...\n    };\n\n    Person p1{\"Ben\", \"Cook\"};  // OK\n\n   \
    \ std::string name1{\"Jane\"}, name2{\"White\"};\n    ...\n    Person p2{name1,\
    \ name2};   // ERROR: can't pass a named object to an rvalue reference\n```\n\n\
    For the case of p2 we would need a traditional constructor, which is declared\
    \ with a const lvalue reference. However, we might also pass a string literal\
    \ and an existing string. Therefore, in total, we need four constructors for all\
    \ possible combinations:\n\n```\n    class Person {\n      ...\n      Person(const\
    \ std::string& f, const std::string& l)\n        : first{f}, last{l} {\n     \
    \ }\n      Person(const std::string& f, std::string&& l)\n        : first{f},\
    \ last{std::move(l)} {\n      }\n      Person(std::string&& f, const std::string&\
    \ l)\n        : first{std::move(f)}, last{l} {\n      }\n      Person(std::string&&\
    \ f, std::string&& l)\n        : first{std::move(f)}, last{std::move(l)} {\n \
    \     }\n      ...\n    };\n```\n\nThat way, we can pass both string literals\
    \ and existing strings in any combination and always have only one allocation\
    \ per member."
