  md: "# 11.4  Perfect Forwarding in Lambdas\n\nIf you want to perfectly forward parameters\
    \ of generic lambdas, you also have to use universal references and std::forward<>.\
    \ However, you simply use auto&& to declare the universal reference.\n\nConsider\
    \ the example, we already had with a function templates:\n\n```\n```cpp\nauto\
    \ callFoo = [](auto&& arg) {        // arg is a universal/forwarding reference\n\
    \    foo(std::forward<decltype(arg)>(arg));  // perfectly forward arg\n};\n```\n\
    ```\n\n```\n```cpp\nstd::string s{\"BLM\"};\ncallFoo(s);                 // OK,\
    \ arg is std::string&\ncallFoo(std::move(s));     // OK, arg is std::string&&\n\
    ```\n```\n\nNote that since C++20, you can avoid using decltype(arg) by declaring\
    \ the lambda with template parameters.\n\nThe following generic lambda uses this\
    \ to perfectly forwards a variadic number of arguments:\n\n```\n```cpp\n[](auto&&...\
    \ args) {\n    ...\n    foo(std::forward<decltype(args)>(args)...);\n};\n```\n\
    ```\n\nRemember that lambdas are just an easy way to define function objects (objects\
    \ with operator() defined to allow their use as functions). The definition above\
    \ expands to a compiler-defined class (closure type) with universal references\
    \ defined as template parameters:\n\n```\n```cpp\nclass NameDefinedByCompiler\
    \ {\n    ...\npublic:\n    template<typename... Args>\n    auto operator() (Args&&...\
    \ args) const {\n        ...\n        foo(std::forward<decltype(args)>(args)...);\n\
    \    }\n};\n```\n```\n\nAgain, note that a generic rvalue reference that is qualified\
    \ with const (or volatile) is not a universal reference. This also applies to\
    \ lambdas. If a parameter is declared with const auto&&, you can only pass rvalues:\n\
    \n```\n```cpp\nauto callFoo = [](const auto&& arg) {  // arg is not a universal\
    \ reference\n    ...\n};\n```\n```\n\n```\n```cpp\nconst std::string cs{\"BLM\"\
    };\ncallFoo(cs);                 // ERROR: s is not an rvalue\ncallFoo(std::move(cs));\
    \     // OK, arg is const std::string&&\n```\n```\n\nInside this lambda, it would\
    \ be enough to use std::move() to perfectly forward the passed argument."
