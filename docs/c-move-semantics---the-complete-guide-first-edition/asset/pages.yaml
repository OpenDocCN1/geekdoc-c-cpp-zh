    ```\n\nEach time we insert a new object, a temporary object is created and moved\
    \ into the vector. Therefore, for each element, we have a MOVE.\n\nIn addition,\
    \ we have several copies marked with COPY. These copies are caused by the fact\
    \ that from time to time, a vector reallocates its internal memory (capacity)\
    \ so that it is big enough for all elements. In this case, the vector grows from\
    \ having memory for 1 to having memory for 2, 4, 8, and finally 16 elements. Therefore,\
    \ we have to copy first 1, then 2, then 4, and then 8 elements already in the\
    \ vector. Calling coll.reserve(20) before the loop would avoid these copies. However,\
    \ you might wonder why no move is used here. This has to do with the missing noexcept\
    \ declarations, which we will discuss in the chapter about move semantics and\
    \ noexcept.\n\nNote that the exact policy of a vector to grow its capacity is\
    \ implementation-specific. Thus, the output might differ when implementations\
    \ grow differently (such as growing by 50% each time).\n\n# **Sorting**\n\nNext,\
    \ we sort all elements by name:\n\n```\n    std::sort(coll.begin(), coll.end(),\n\
