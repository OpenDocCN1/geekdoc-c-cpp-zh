- pgno: 134
  md: "```\n```cpp\nvirtual void foo(int) override;     // ERROR: override giving\
    \ up the noexcept guarantee\nvirtual void bar(int) noexcept;      // OK (here\
    \ we also guarantee not to throw)\n};\n```\n```\n\nHowever, for non-virtual functions,\
    \ derived-class members can hide base-class members with a different noexcept\
    \ declaration:\n\n```\n```cpp\nclass Base {\npublic:\n    ...\n    void foo(int)\
    \ noexcept;\n};\n```\n```\n\n```\n```cpp\nclass Derived : public Base {\npublic:\n\
    \    ...\n    void foo(int);                 // OK, hiding instead of overriding\n\
    };\n```\n```\n\nConditions follow the same rules after being evaluated at compile\
    \ time. For example, consider the following class hierarchy:\n\n```\n```cpp\n\
    class Base {\npublic:\n    virtual void func() noexcept(sizeof(int) < 8);    //\
    \ might throw if sizeof(int) >= 8\n};\n\nclass Derived : public Base {\npublic:\n\
    \    void func() noexcept(sizeof(int) < 4) override;   // might throw if sizeof(int)\
    \ >= 4\n};\n```\n```\n\nIn this case, we will get a compile-time error if the\
    \ size of int is 4, because then the base class guarantees not to throw when func()\
    \ is called, while the derived class no longer gives this guarantee for func().\
    \ When the size of int is less than 4, both are noexcept, which is fine. When\
    \ the size of int is at least 8, both are not noexcept, which is also fine. Therefore,\
    \ derived classes should only restrict exception guarantees further.\n\n# 7.2.2\
    \  noexcept for Special Member Functions\n\nnoexcept conditions may be automatically\
    \ generated for special member functions."
