- pgno: 167
  md: "Note that the universal reference is always the second-best option. A perfect\
    \ match is always better, but the need to convert the type (such as making it\
    \ const or converting an rvalue to an lvalue) is a worse match than just instantiating\
    \ the function template for the exact type.\n\n# 9.4.1 Fixing Overload Resolution\
    \ with Universal References\n\nThe fact that a universal reference binds better\
    \ than a type conversion in overload resolution has a very nasty side effect:\
    \ if you have a constructor that takes a single universal reference, this is a\
    \ better match than\n\n+   - The copy constructor if passing a non-const object\n\
    +   - The move constructor if passing a const object\n\nTherefore, you should\
    \ be very careful when implementing a constructor that has one single universal\
    \ reference parameter.\n\nConsider the following program:\n\n*generic/universalconstructor.cpp*\n\
    \n```\n```cpp\n#include <iostream>\n\nclass X {\n public:\n  X() = default;\n\n\
    \  X(const X&) {\n    std::cout << \"copy constructor\\n\";\n  }\n  X(X&&) {\n\
    \    std::cout << \"move constructor\\n\";\n  }\n\n  template<typename T>\n  X(T&&)\
    \ {\n    std::cout << \"universal constructor\\n\";\n  }\n};\n\nint main()\n{\n\
    \  X xv;\n  const X xc;\n\n  X xcc{xc};             // OK: calls copy constructor\n\
    \  X xvc{xv};             // OOPS: calls universal constructor\n  X xvm{std::move(xv)};\
    \  // OK: calls move constructor\n  X xcm{std::move(xc)};  // OOPS: calls universal\
    \ constructor\n}\n```\n```"
