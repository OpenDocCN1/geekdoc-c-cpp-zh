- pgno: 49
  md: '```

    ```cpp

    foo(returnStringByValue()); // calls foo(), return value is moved to str

    ```

    ```


    If the caller signals that it no longer needs the value of the passed argument
    (by using `std::move()` or passing a temporary object without a name), the parameter
    `str` is initialized with the value moved from the passed argument.


    That means that with move semantics, call-by-value can suddenly become cheap if
    a temporary object is passed or the passed argument is marked with `std::move()`.
    Note that just like returning a local object by value, this move can be optimized
    away. However, if it is not optimized away, the call is guaranteed to be cheap
    now (if move semantics is cheap).


    Note the following difference:


    ```

    ```cpp

    void fooByVal(std::string str);        // takes the object by value

    void fooByRRef(std::string&& str);     // takes the object by rvalue reference

    ...

    std::string s1{"hello"}, s2{"hello"};

    ...

    fooByVal(std::move(s1));               // s1 is moved

    fooByRRef(std::move(s2));              // s2 might be moved

    ```

    ```


    Here, we compare two functions: one taking the string by value and one taking
    the string as an rvalue reference. In both cases we pass a string with `std::move()`.


    +   - The function taking the string by value will use move semantics because
    a new string is created with the value of the passed argument.

    +   - The function taking the string by rvalue reference **might** use move semantics.
    Passing the argument does not create a new string. Whether the value of the passed
    argument is stolen/modified depends on the implementation of the function.


    Thus:


    +   - A function declared to support move semantics **might not** use move semantics.

    +   - A function declared to take an argument by value **will** use move semantics.


    Note again that the effect of move semantics does not guarantee that any optimization
    happens at all or what the effect of any optimization is. All we know is that
    the passed object is subsequently in a valid but unspecified state.


    # ## 2.6 Summary


    +   - Rvalue references are declared with `&&` and no `const`.

    +   - They can be initialized by temporary objects that do not have a name or
    non-const objects marked with `std::move()`.

    +   - Rvalue references extend the lifetime of objects returned by value.

    +   - `std::move()` is a `static_cast` to the corresponding rvalue reference type.
    This allows us to pass a named object to an rvalue reference.

    +   - Objects marked with `std::move()` can also be passed to functions taking
    the argument by `const` lvalue reference but not taking a non-const lvalue reference.'
