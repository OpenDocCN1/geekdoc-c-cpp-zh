  md: '# 13.2 Summary


    +   - Move-only types allow us to move “owned” resources around without being
    able to copy them. The copying special member functions are deleted.

    +   - You cannot use move-only types in `std::initializer_lists`.

    +   - You cannot iterate by value over collections of move-only types.

