  md: "+   - Copy constructor\n+   - Copy assignment operator\n+   - Another move\
    \ operation\n+   - Destructor\n\nNote that I wrote “user-declared.” Any form of\
    \ an explicit declaration of a copy constructor, copy assignment operator, or\
    \ destructor disables move semantics. For example, if we implement a destructor\
    \ that does nothing, we have disabled move semantics:\n\n```\nclass Customer {\n\
    \    ...\n    ~Customer() {  // automatic move semantics is disabled\n    }\n\
    };\n```\n\nEven the following declaration is enough to disable move semantics:\n\
    \n```\nclass Customer {\n    ...\n    ~Customer() = default;  // automatic move\
    \ semantics is disabled\n};\n```\n\nA destructor explicitly requested to have\
    \ its default behavior is user-declared and therefore disables move semantics.\
    \ As usual, copy semantics will be used as a fallback in that case.\n\n**Therefore:\
    \ do not implement or declare a destructor if there is not specific need** (a\
    \ rule a surprising number of programmers do not follow).\n\nThis also means that\
    \ by default, a polymorphic base class has disabled move semantics:\n\n```\nclass\
    \ Base {\n    ...\n    virtual ~Base() {  // automatic move semantics is disabled\n\
    \    }\n};\n```\n\nNote that this means that move semantics is disabled only for\
    \ members that are declared inside this base class. For members of derived classes,\
    \ move semantics is still automatically generated (if the derived class does not\
    \ explicitly declare a special member function). *Move Semantics in Class Hierarchies*\
    \ discusses this in detail.\n\n# 3.1.2 When Generated Move Operations Are Broken\n\
    \nNote that generated move operations might introduce problems even though the\
    \ generated copy operations work correctly. In particular, you have to be careful\
    \ in the following situations:\n\n+   - Members have restrictions on values\n\
    +     - Values of members have restrictions\n+     - Values of members depend\
    \ on each other\n+   - Members with reference semantics are used (pointers, smart\
    \ pointers, ...)\n+   - Objects have no default constructed state"
