- pgno: 83
  md: "# ### 4.3.3 Initialize Members via Rvalue References\n\nThere are even more\
    \ ways to initialize the members of a `Person`, using multiple constructors.\n\
    \n# #### Using Rvalue References\n\nTo support move semantics, we have already\
    \ learned that we can declare a parameter as a non-const rvalue reference. This\
    \ allows the parameter to steal the value from a passed temporary object or an\
    \ object marked with `std::move()`.\n\nConsider we declare the constructor as\
    \ follows:\n\n```\n~~~cpp\nclass Person {\n  ...\n  Person(std::string&& f, std::string&&\
    \ l)\n    : first{std::move(f)}, last{std::move(l)} {\n  }\n  ...\n};\n~~~\n```\n\
    \nThis initialization would also work for our passed string literals:\n\n```\n\
    ~~~cpp\nPerson p{\"Ben\", \"Cook\"};\n~~~\n```\n\nAgain, because the constructor\
    \ needs strings, we would create two temporary strings to which `f` and `l` bind:\n\
    \n![](img/7ef3d1ca55bdc192f1cc0929179f3d21_83_0.png)\n\nAnd because we have non-const\
    \ references, we can modify them. In this case, we mark them with `std::move()`\
    \ so that the initialization of the members can steal the values.\n\nFirst, the\
    \ member `first` steals the value from `f`:"
