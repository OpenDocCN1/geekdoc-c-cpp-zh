  md: "```\n```cpp\ntry {\n    std::string ret{\"vote\"};\n    ...\n    // store result:\n\
    \    p.set_value_at_thread_exit(std::move(ret));\n}\ncatch(...) {\n    // store\
    \ exception:\n    p.set_exception_at_thread_exit(std::current_exception());\n\
    }\n}\n\nint main()\n{\n    std::vector<std::future<std::string>> results;\n\n\
    \    // create promise and future to deal with outcome of the thread started:\n\
    \    std::promise<std::string> p;\n    std::future<std::string> f{p.get_future()};\n\
    \    results.push_back(std::move(f));\n\n    // start thread and move the promise\
    \ to it:\n    std::thread t{getValue, move(p)};\n    t.detach();  // would not\
    \ be necessary for std::jthread\n    ...\n\n    // wait for all threads to end:\n\
    \    for (auto& fut : results) {\n        std::cout << fut.get() << '\\n';\n \
    \   }\n}\n```\n```\n\nHere, in `main()`, we first create a promise to be able\
    \ to send an outcome (value or exception) to the associated future that can read\
    \ it:\n\n```\n```cpp\nstd::promise<std::string> p;\nstd::future<std::string> f{p.get_future()};\n\
    ```\n```\n\nThe future is moved into a collection of handles for futures:\n\n\
    ```\n```cpp\nresults.push_back(std::move(f));\n```\n```\n\nWe could also pass\
    \ the result of `p.get_future()` directly to `push_back()`:\n\n```\n```cpp\nresults.push_back(p.get_future());\n\
    ```\n```\n\nThe promise is moved to the thread started:\n\n```\n```cpp\nstd::thread\
    \ t{getValue, move(p)};\n```\n```"
