    \ by both reference and value qualifiers\n};\n```\n```\n\n# 5.3  When to Use Reference\
    \ Qualifiers\n\nReference qualifiers allow us to implement functions differently\
    \ when they are called for objects of a specific value category. The goal is to\
    \ provide a different implementation when we call a member function for an object\
    \ that no longer needs its value.\n\nAlthough we do have this feature, it is not\
    \ used as much as it could be. In particular, we could (and should) use it to\
    \ ensure that operations that modify objects are not called for temporary objects\
    \ that are about to die.²\n\n# 5.3.1  Reference Qualifiers for Assignment Operators\n\
