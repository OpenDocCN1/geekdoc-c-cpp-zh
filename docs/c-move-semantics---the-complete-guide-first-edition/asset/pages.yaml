    \nFor both members, name and points, the values were moved from p0 to p2.\nNote\
    \ that if you have to implement the move constructor in class Polygon, you need\
    \ special care to provide the right noexcept condition.\n\n# 4.5  Summary\n\n\
    +   - Avoid objects with names.\n+   - Avoid unnecessary `std::move()`. Especially\
    \ do not use it when returning a local object.\n+   - Constructors that initialize\
    \ members from parameters, for which move operations are cheap, should take the\
    \ argument by value and move it to the member.\n+   - Constructors that initialize\
    \ members from parameters, for which move operations take a significant amount\
    \ of time, should be overloaded for move semantics for best performance.\n+  \
    \ - In general, creating and initializing new values from parameters, for which\
    \ move operations are cheap, should take the arguments by value and move. However,\
    \ do not take by value and move to update/modify existing values.\n+   - Do not\
    \ declare a virtual destructor in derived classes (unless you have to implement\
    \ it)."
