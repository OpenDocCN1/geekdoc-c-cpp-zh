    \ {}\n  ...\n};\n\ntemplate<typename T>\nstatic constexpr inline bool is_nothrow_movable_v\n\
    \  = std::is_nothrow_move_constructible_v<Wrapper<T>>;\n\n#endif //IS_NOTHROW_MOVABLE_HPP\n\
    ```\n```\n\nYou can now check even for abstract base classes whether the move\
    \ constructor is noexcept. The following program demonstrates the different behavior\
    \ of the standard and the user-defined type trait:\n\n*poly/isnothrowmovable.cpp*\n\
    \n```\n```cpp\n#include \"isnothrowmovable.hpp\"\n#include <iostream>\n\nclass\
    \ Base {\n  std::string id;\n  ...\npublic:\n  virtual void print() const = 0;\
    \  // pure virtual function (forces abstract base class)\n  ...\n  virtual ~Base()\
    \ = default;\nprotected:\n  // protected copy and move semantics (also forces\
    \ abstract base class):\n  Base(const Base&) = default;\n  Base(Base&&) = default;\n\
    \  // disable assignment operator (due to the problem of slicing):\n  Base& operator=\
    \ (Base&&) = delete;\n  Base& operator= (const Base&) = delete;\n};\n\nint main()\n\
    {\n  std::cout << std::boolalpha;\n  std::cout << \"std::is_nothrow_move_constructible_v<Base>:\
    \ \"\n            << std::is_nothrow_move_constructible_v<Base> << '\\n';\n  std::cout\
    \ << \"is_nothrow_movable_v<Base>:              \"\n            << is_nothrow_movable_v<Base>\
    \ << '\\n';\n}\n```\n```"
