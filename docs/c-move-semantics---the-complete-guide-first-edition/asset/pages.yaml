    \ of Customer) works fine:\n\n```\n~~~cpp\nvoid foo()\n{\n    Customer c{\"Michael\
    \ Spencer\"};\n    ...\n    process(std::move(c));\n    // both name and values\
    \ have valid but unspecified states\n    ...\n} // destructor of c will clean\
    \ up name and values (whatever their state is)\n~~~\n```\n\nAlso, assigning a\
    \ new value to c will work because we assign both the name and the values.\n\n\
    # 6.2.2 Non-Destructible Moved-From Objects\n\nHowever, in rare cases problems\
    \ might occur. In these cases, we have usually implemented an assignment operator\
    \ or a destructor to do more than just assign or destroy the members.<sup>3</sup>\n\
    \nConsider the following class, where we use a fixed-size array of a variable\
    \ number of thread objects, for which we explicitly call join() in the destructor\
    \ to wait for their end:\n\n*basics/tasks.hpp*\n\n```\n~~~cpp\n#include <array>\n\
    #include <thread>\n\nclass Tasks {\nprivate:\n    std::array<std::thread,10> threads;\
    \ // array of threads for up to 10 tasks\n    int numThreads{0};             \
    \     // current number of threads/tasks\npublic:\n    Tasks() = default;\n\n\
    \    // pass a new thread:\n    template <typename T>\n    void start(T op) {\n\
    \        threads[numThreads] = std::thread(std::move(op));\n        ++numThreads;\n\
    \    }\n    ...\n\n    // at the end wait for all started threads:\n    ~Tasks()\
    \ {\n        for (int i = 0; i < numThreads; ++i) {\n            threads[i].join();\n\
    \        }\n    }\n};\n~~~\n```\n\n3 We see here one reason why move semantics\
    \ is disabled by default when a destructor is implemented."
