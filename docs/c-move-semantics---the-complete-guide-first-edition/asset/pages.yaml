    \ last 1 would be moved forward before the 2 so that the last element gets a moved-from\
    \ state.\n\nTherefore, these algorithms can also leave elements in a moved-from\
    \ state. In fact, the following algorithms can create moved-from states:\n\n+\
    \   - `std::remove()` and `std::remove_if()`\n+   - `std::unique()`\n\nLet us\
