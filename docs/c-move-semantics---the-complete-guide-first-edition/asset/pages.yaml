- pgno: 182
  md: "Remember also that references to functions are always lvalues, Therefore, T\
    \ is always deduced as an lvalue reference if we pass a reference to a function\
    \ to a universal reference:\n\n```\n```cpp\nvoid func(int) {\n}\n\nf(func);  \
    \               // lvalue passed to f(), so T and arg have type void(&)(int)\n\
    f(std::move(func));      // lvalue passed to f(), so T and arg have type void(&)(int)\n\
    ```\n```\n\n# 10.3.1  Explicit Specification of Types for Universal References\n\
    \nWhen a universal/forwarding reference is declared, you can also explicitly specify\
    \ the type of the template parameter instead of deducing it. However, remember\
    \ that your parameter is declared as T&&. Therefore, you have the following behavior:\n\
    \n```\n```cpp\ntemplate<typename T>\nvoid f(T&& arg)                  // arg is\
    \ universal/forwarding reference\n{\n    g(std::forward<T>(arg));     // perfectly\
    \ forward (move() only for passed rvalues)\n}\n\nf<std::string>(...);        \
    \    // arg is a raw rvalue reference binding to rvalues only\nf<std::string&>(...);\
    \           // arg is an lvalue reference binding to non-const lvalues only\n\
    f<const std::string&>(...);     // arg is a const lvalue reference binding to\
    \ everything\nf<std::string&&>(...);          // arg is a raw rvalue reference\
    \ binding to rvalues only\n```\n```\n\nThus, with an explicit specification the\
    \ universal reference no longer acts as a universal reference. As a caller, you\
    \ specify which specific kind of reference you get.\n\nTherefore, to pass an lvalue,\
    \ where you still need the value, make sure you specify the template parameter\
    \ as lvalue reference. Otherwise, the code will not compile:\n\n```\n```cpp\n\
    template<typename T>\nvoid f(T&& arg)                  // arg is universal/forwarding\
    \ reference\n{\n    g(std::forward<T>(arg));     // perfectly forward (move()\
    \ only for passed rvalues)\n}\n\nstd::string s;\n...\nf<std::string>(s);     \
    \         // ERROR: cannot bind rvalue reference to lvalue\nf<std::string&>(s);\
    \             // OK, does not move and forward s\nf<std::string>(std::move(s));\
    \   // OK, does move and forward s\nf<std::string&&>(std::move(s));// OK, does\
    \ move and forward s\n```\n```\n\nThe last two calls are equivalent."
  merge: -1
