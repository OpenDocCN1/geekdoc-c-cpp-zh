- pgno: 250
  md: '# R


    # return value optimization (RVO)


    A feature that allows us to optimize away the creation of a return value from
    a temporary object that is created in the return statement. When we create the
    return value in the return statement on the fly and return it by value, the compiler
    can use the temporary object directly as a return value instead of copying or
    moving it.


    Note that the *return value optimization* differs from the *named return value
    optimization (NRVO)*, which is the optimization for returning a named local object.
    The *return value optimization* was optional before C++17 but is mandatory since
    C++17 (named return value optimization is still optional).


    # rvalue


    A category of expressions that are not *values*. An rvalue can be a *prvalue*
    (such as a temporary object without a name) or an *xvalue* (e.g., an lvalue marked
    with `std::move()`). What was called an *rvalue* before C++11 is called a *prvalue*
    since C++11. The chapter about *value categories* describes details.


    # S


    # small/short string optimization (SSO)


    An approach to save allocating memory for short strings by always reserving memory
    for a certain number of characters. A typical value in standard library implementations
    is to always reserve 16 or 24 bytes of memory so that the string can have 15 or
    23 characters (plus 1 byte for the null terminator) without allocating memory.
    This makes all string objects larger but usually saves a lot of running time because
    in practice, strings are often shorter than 16 or 24 characters and allocating
    memory on the heap is quite an expensive operation.


    # T


    # translation unit


    A *CPP* file with all the header files and standard library headers it includes
    using `#include` directives, minus the program text that is excluded by conditional
    compilation directives such as `#if`. For simplicity, it can also be thought of
    as the result of preprocessing a *CPP* file. See *CPP file* and *header file*.


    # U


    # universal reference


    One of two terms for rvalue references of the form T&& where T is a deducible
    template parameter. Special rules that differ from ordinary rvalue references
    apply (see *perfect forwarding*). The term was coined by Scott Meyers as a common
    term for both *lvalue reference* and *rvalue reference*. Because “universal” was,
    well, too universal, the C++17 standard introduced the term *forwarding reference*
    instead.'
