  md: "```\n```cpp\nstd::vector<std::string> createAndInsert()\n{\n    std::vector<std::string>\
    \ coll;\n    coll.reserve(3);\n    std::string s = \"data\";\n\n    coll.push_back(s);\n\
    \n    coll.push_back(s+s);\n\n    coll.push_back(std::move(s));\n\n    return\
    \ coll;\n}\n\nstd::vector<std::string> v;\nv = createAndInsert();\n```\n```\n\n\
    ![](img/7ef3d1ca55bdc192f1cc0929179f3d21_31_0.png)\n\nEssentially, we optimize\
    \ the copying so that we move the ownership of the memory for the value of s+s\
    \ to its copy in the vector.\n\nThis is all done automatically by using a compiler\
    \ that can signal that an object is about to die, so that we can use new implementations\
    \ to copy a string value that steals the value from the source. It is not a technical\
    \ move; it is a semantic move implemented by technically moving the memory for\
    \ the value from the source string to its copy.\n\n+   - The next statement is\
    \ the statement we modified for the C++11 version. Again, we insert s into coll,\
    \ but the statement has changed by calling `std::move()` for the string that we\
    \ insert:\n+   \n+     ```cpp\n+     coll.push_back(std::move(s));\n+     ```\n\
    \nWithout std::move(), the same would happen as with the first call of push_back():\
    \ the vector would create a deep copy of the passed string s. However, in this\
    \ call, we have marked s with std::move(), which semantically means “I no longer\
    \ need this value here.” As a consequence, we have another call of the other implementation\
    \ of push_back(), which was used when we passed the temporary object s+s. The\
    \ third element steals the value by moving the ownership of the memory from the\
    \ value from s to its copy:"
