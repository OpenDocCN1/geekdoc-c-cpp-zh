  md: "```\n```cpp\nthreads.push_back(std::thread{doThat, std::move(someArg)});\n\
    ...\n\n// wait for all threads to end:\nfor (auto& t : threads) {\n    t.join();\n\
    }\n}\n```\n```\n\nHere, we start two threads and put them into a collection of\
    \ all running threads:\n\n```\n```cpp\nstd::vector<std::thread> threads;    //\
    \ better std::jthread since C++20\n\nstd::string someArg{\"black lives matter\"\
    };\nthreads.push_back(std::thread{doThis, someArg});\nthreads.push_back(std::thread{doThat,\
    \ std::move(someArg)});\n```\n```\n\nWe start a thread by declaring an object\
    \ of type std::thread (or better, std::jthread since C++20) and move the temporary\
    \ object into the threads. Behind the argument for the callable (function, lambda,\
    \ function object), we can pass additional arguments that are passed to the callable\
    \ when the thread starts. By default, the constructor of the thread class copies\
    \ these arguments. With std::move(), we switch to move semantics here. Therefore,\
    \ doThis() gets a copy of the passed string someArg, while doThat() gets the moved\
    \ value of the string.\n\nAt the end, we wait for the end of all threads (which\
    \ is necessary to avoid a core dump when std::thread is used):\n\n```\n```cpp\n\
    // wait for all threads to end:\nfor (auto& t : threads) {\n    t.join();\n}\n\
    ```\n```\n\n# 15.6.2  Futures, Promises, and Packaged Tasks\n\nFor some helper\
    \ types for synchronizing the exchange of a (return) value between two threads,\
    \ also move-only types are used (futures, promises, and packaged tasks are move-only).\n\
    \nConsider the following example:\n\n```\n```cpp\nlib/future.cpp\n\n#include <iostream>\n\
    #include <string>\n#include <vector>\n#include <thread>\n#include <future>\n\n\
    void getValue(std::promise<std::string> p)\n{\n```\n```"
