    \nAs usual for overwriting algorithms, the destination container must already\
    \ have enough elements that are overwritten (otherwise you have undefined behavior).\
    \ The number of elements does not change (neither in the source nor in the destination\
    \ range). However, the elements of the source range get a moved-from state. Thus,\
    \ we do not know the values of the strings in the source range after this call\
    \ unless we have specified behavior for moved-from objects such as for move-only\
    \ types.\n\nWhen calling the `std::move_backward()` algorithm in the example,\
    \ we then move assign the first three elements to the end of the same collection:\n\
    \n```\n```cpp\n// move assigning the first three values inside coll2 to the end\n\
    // - not changing any size\nstd::move_backward(coll2.begin(), coll2.begin()+3,\
    \  // source range\n                   coll2.end());                   // destination\
    \ range\n```\n```\n\nAgain, elements where the value was moved away get a moved-from\
    \ state unless another value was moved there. As a result, we do not know the\
    \ value of the first two elements anymore (the value of the third element was\
    \ overwritten with the moved-assigned value of the first element). After this\
    \ call, all we know is that the last three elements of coll2 are \"love\", \"\
