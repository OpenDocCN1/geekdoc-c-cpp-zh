  md: "```\nfoo(Col1{});                  // OK, arg binds to a non-const prvalue\n\
    foo(std::move(v));             // OK, arg binds to a non-const xvalue\nfoo(std::move(c));\
    \             // OK, arg binds to a const xvalue\n```\n\nInside `foo()`:\n\n+\
    \   - The type of arg may or may not be const now.\n+   - In this case, it usually\
    \ does not make sense to use `std::move()`. It only makes sense to use `std::forward<>()`\
    \ when we no longer need the value and want to forward it to another function\
    \ (using `std::move()` is possible but would pass all arguments to `foo()` with\
    \ move semantics, passing the non-const lvalue `v` as an xvalue).\n\n# 9.4 Overload\
    \ Resolution with Universal References\n\nWe have already discussed the formal\
    \ rules when binding objects to ordinary references. Now, after introducing universal\
    \ references, we have to extend these rules.\nAgain, assume we have a class X,\
    \ a non-const variable v thereof, and a const variable c thereof:\n\n```\nclass\
    \ X {\n  ...\n};\n\nX v;\nconst X c{...};\n```\n\nTable Rules for binding all\
    \ references lists the formal rules for binding all kinds of references to passed\
    \ arguments if we provide all possible overloads of a function `f()`:\n\n```\n\
    void f(const X&);    // read-only access\nvoid f(X&);          // OUT parameter\
    \ (usually long-living object)\nvoid f(X&&);         // can steal value (object\
    \ usually about to die)\nvoid f(const X&&);   // contradicting semantic meaning\n\
    template<typename T>\nvoid f(T&&);         // to use perfect forwarding\n```\n\
    \n| Call | f(X&) | f(const X&) | f(X&&) | f(const X&&) | template<typename T>\
    \ f(T&&) |\n|---|---:|---:|---:|---:|---:|\n| f(v) | 1 | 3 | no | no | 2 |\n|\
    \ f(c) | no | 1 | no | no | 2 |\n| f(X{}) | no | 4 | 1 | 3 | 2 |\n| f(move(v))\
    \ | no | 4 | 1 | 3 | 2 |\n| f(move(c)) | no | 3 | no | 1 | 2 |\n\nTable 9.1. Rules\
    \ for binding all references\n\nAgain, the numbers list the priority for overload\
    \ resolution (the smallest numbers have the highest priority) so that you can\
    \ see which function is called when multiple overloads are provided."
