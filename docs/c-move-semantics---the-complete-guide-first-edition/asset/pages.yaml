  md: "In a similar way, we can constrain generic code to let universal references\
    \ bind to rvalues only. However, none of this would be necessary if we had a specific\
    \ syntax for universal references. For example:\n\n```\nvoid processString(std::string&&\
    \ arg);  // assume &&& declares a universal reference\n```\n\nWe do not have this\
    \ specific syntax, however, and now we have existing code with both applications\
    \ of &&.\n\n# 10.2  Universal or Ordinary Rvalue Reference?\n\nThe fact that we\
    \ use the same syntax for ordinary rvalue references and universal/forwarding\
    \ references introduces some interesting corner cases for the question of whether\
    \ an object is an ordinary rvalue reference or a universal reference.\n\n# 10.2.1\
    \  Rvalue References of Members of Generic Types\n\nAn rvalue reference to a member\
    \ type of a template parameter is *not* a universal reference. For example:\n\n\
    ```\ntemplate<typename T>\nvoid foo(typename T::value_type&& arg);  // not a universal\
    \ reference\n```\n\nHere is a complete example:\n\ngeneric/universalmem.cpp\n\n\
    ```\n#include <iostream>\n#include <string>\n#include <vector>\n\ntemplate<typename\
    \ T>\nvoid insert(T& coll, typename T::value_type&& arg)\n{\n    coll.push_back(arg);\n\
    }\n\nint main()\n{\n    std::vector<std::string> coll;\n    …\n    insert(coll,\
    \ std::string{\"prvalue\"});  // OK\n    …\n    std::string str{\"lvalue\"};\n\
    \    insert(coll, str);             // ERROR: T::value_type&& is not a universal\
    \ reference\n    insert(coll, std::move(str));  // OK\n    …\n}\n```"
  merge: -1
  img_proc: true
- pgno: 177
  md: "# ### 10.2.2 Rvalue References of Parameters in Class Templates\n\nAn rvalue\
    \ reference to a template parameter of a class template is *not* a universal reference.\n\
    \nFor example:\n\n```\n```cpp\ntemplate<typename T>\nclass C {\n    T&& member;\
    \          // member is not a universal reference\n    ...\n    void foo(T&& arg);\
    \   // arg is not a universal reference\n};\n```\n```\n\nHere is a complete example:\n\
    \n*generic/universalclass.cpp*\n\n```\n```cpp\n#include <iostream>\n#include <string>\n\
    #include <vector>\n\ntemplate<typename T>\nclass Coll {\nprivate:\n  std::vector<T>\
    \ values;\npublic:\n  Coll() = default;\n\n  // function in class template:\n\
    \  void insert(T&& val) {\n    values.push_back(val);\n  }\n};\n\nint main()\n\
    {\n  Coll<std::string> coll;\n  ...\n  coll.insert(std::string{\"prvalue\"});\
    \  // OK\n  std::string str{\"lvalue\"};\n  coll.insert(str);              //\
    \ ERROR: T&& of Coll<T> is not a universal reference\n  coll.insert(std::move(str));\
    \   // OK\n  ...\n}\n```\n```\n\nIn general, a function in a class template does\
    \ not follow the rule of function templates. It is what we call a *temploid*,\
    \ generic code that follows the rules of ordinary functions when we instantiate\
    \ the class."
  merge: -1
