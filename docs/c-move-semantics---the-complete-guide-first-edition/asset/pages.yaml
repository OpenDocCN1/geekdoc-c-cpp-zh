- pgno: 202
  md: "For the expressions, by rule, the types are deduced as follows:\n\n+   - Because\
    \ `std::move(s)` is an *xvalue*, `da5` is an rvalue reference.\n+   - Because\
    \ `operator+` for strings returns a new temporary string by value (so it is a\
    \ *prvalue*), `da6` is a plain value type.\n+   - Because `s[0]` returns an lvalue\
    \ reference to the first character, it is an *lvalue* and forces `da7` to also\
    \ be an lvalue reference.\n+   - Because `(s)` is an *lvalue*, `da8` is an lvalue\
    \ reference. Yes, the parentheses make a difference here.\n\nIn contrast to `auto&&`,\
    \ which is always a reference, `decltype(auto)` is sometimes just a value (if\
    \ initialized with the name of an object of a value type or with a prvalue expression).\n\
    \nNote that `decltype(auto)` cannot have additional qualifiers:\n\n```\ndecltype(auto)\
    \ da5{s};       // OK\nconst decltype(auto)& da1{s};   // ERROR\ndecltype(auto)*\
    \ da2{s};          // ERROR\n```\n\n# 12.2.1 Return Type `decltype(auto)`\n\n\
    When using `decltype(auto)` as a return type, we use the rules of `decltype` as\
    \ follows:\n\n+   - If the expression returns/yields a plain value, then the value\
    \ category is a *prvalue* and `decltype(auto)` deduces a value type.\n+   - If\
    \ the expression returns/yields an lvalue reference, then the value category is\
    \ an *lvalue* and `decltype(auto)` deduces an lvalue reference.\n+   - If the\
    \ expression returns/yields an rvalue reference, then the value category is an\
    \ *xvalue* and `decltype(auto)` deduces an rvalue reference.\n\nThat is exactly\
    \ what we need for perfect returning: for a plain value, we deduce a value, and\
    \ for a reference, we deduce a reference of the same type and value category.\n\
    \nAs a more general example, consider a helper function of a framework that (after\
    \ some initialization or logging) transparently calls a function as if we were\
    \ to call it directly:\n\n*generic/call.hpp*\n\n```\n#include <utility>  // for\
    \ forward<>()\n\ntemplate <typename Func, typename... Args>\ndecltype(auto) call\
    \ (Func f, Args&&... args)\n{\n    ...\n    return f(std::forward<Args>(args)...);\n\
    }\n```\n\nThe function declares `args` as a variadic number of *universal references*\
    \ (also called *forwarding references*). With `std::forward<>()`, it perfectly\
    \ forwards these given arguments to the function `f` passed as first argument.\
    \ Because we use `decltype(auto)` as the return type, we perfectly return the\
    \ return value of `f()`."
