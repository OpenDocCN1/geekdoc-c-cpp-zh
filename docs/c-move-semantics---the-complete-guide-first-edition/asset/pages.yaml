  md: "```\n```cpp\n}\n```\n```\n\nThe reason we declare `range` as a universal reference\
    \ is that we want to be able to bind it to *every* range so that we can use it\
    \ twice (once to ask for its beginning, and once to ask for its end) without creating\
    \ a copy or losing the information about whether or not the range is const.\n\n\
    The loop should work for:\n\n+   - A non-const value:\n\n```\n```cpp\nstd::vector<int>\
    \ coll;\n...\nfor (int& i : coll) {\n    i *= 2;\n}\n```\n```\n\n+   - A const\
    \ value:\n\n```\n```cpp\nconst std::vector<int> coll{0, 8, 15};\n...\nfor (int\
    \ i : coll) {\n    ...\n}\n```\n```\n\n+   - A prvalue:\n\n```\n```cpp\nfor (int\
    \ i : std::vector<int>{0, 8, 15}) {\n    ...\n}\n```\n```\n\nNote that there is\
    \ no other way to declare range for all these cases:\n\n+   - With `auto`, we\
    \ would create a copy of the range (which takes time and disables modification\
    \ of the elements).\n+   - With `auto&`, we would disable initialization of the\
    \ range with a temporary prvalue.\n+   - With `const auto&&`, we would lose any\
    \ non-constness of the range we iterate over.\n\nHowever, note that there is a\
    \ significant problem with the range-based for loop the way it is specified now.\
    \ Code such as the following:\n\n```\n```cpp\nstd::vector<std::string> createStrings();\n\
    \n...\n\nfor (char c : createStrings().at(0)) {    // fatal runtime error\n  \
    \  ...\n}\n```\n```\n\nbecomes:\n\n```\n```cpp\nstd::vector<std::string> createStrings();\n\
    ...\nauto&& range = createStrings().at(0);    // OOPS: universal reference to\
    \ reference\nauto pos = range.begin();                // return value of createStrings()\
    \ destroyed here\nauto end = range.end();\nfor (; pos != end; ++pos) {\n    char\
    \ c = *pos;\n```\n```"
