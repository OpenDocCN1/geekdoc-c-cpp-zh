    # 2.2 std::move()


    If you have an object for which the lifetime does not end when you use it, you
    can mark it with std::move() to express “I no longer need this value here.” std::move()
    does not move; it only sets a temporary marker in the context where the expression
    is used:


    ```

    void foo1(const std::string& lr);   // binds to the passed object without modifying
    it

    void foo1(std::string&& rv);        // binds to the passed object and might steal/modify
    the value

    ...

    std::string s{"hello"};

    ...

    foo1(s);                            // calls the first foo1(), s keeps its value

    foo1(std::move(s));                 // calls the second foo1(), s might lose its
    value

    ```


    Objects marked with std::move() can still be passed to a function that takes an
    ordinary const lvalue reference:


    ```

    void foo2(const std::string& lr);   // binds to the passed object without modifying
    it

    ...

    std::string s{"hello"};

    ...

    foo2(s);                            // calls foo2(), s keeps its value

    foo2(std::move(s));                 // also calls foo2(), s keeps its value

    ```


    Note that an object marked with std::move() cannot be passed to a non-const lvalue
    reference:


    ```

    void foo3(std::string&);            // modifies the passed argument

    ...

    std::string s{"hello"};

    ...

    foo3(s);                            // OK, calls foo3()

    foo3(std::move(s));                 // ERROR: no matching foo3() declared

    ```


    Note that it does not make sense to mark a dying object with std::move(). In fact,
    this can even be counterproductive for optimizations.


