    \ -5\nCOPY TestCustomer -4\nMOVE TestCustomer -2\nMOVE TestCustomer -1\nCOPY TestCustomer\
    \ -5\nCOPY TestCustomer -4\nCOPY TestCustomer -3\nCOPY TestCustomer -2\n```"
