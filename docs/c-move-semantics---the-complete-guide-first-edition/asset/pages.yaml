    \ (5 elems):  'need' 'you' 'love' 'is' 'all'\n```\n```\n\nAs usual: beware when\
    \ using the moved-from elements.\n\n# 14.2 Removing Algorithms\n\nBy design, C++\
    \ algorithms use iterators to deal with the elements of containers and ranges.\
    \ However, like pointers operating on arrays, iterators can only read and write\
