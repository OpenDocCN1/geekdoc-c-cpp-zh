    \n```\n```cpp\n[] (auto f, auto&&... args) -> decltype(auto) {\n    ...\n    return\
    \ f(std::forward<decltype(args)>(args)...);\n};\n```\n```\n\nFor deferred perfect\
    \ returning, we need the same trick as introduced before: we have to use `std::move()`\n\
