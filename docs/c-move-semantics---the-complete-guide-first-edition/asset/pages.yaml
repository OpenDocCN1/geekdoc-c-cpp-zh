- pgno: 97
  md: "For example, just checking whether we have a person with an empty name would\
    \ have significant overhead:\n\n```\nstd::vector<Person> coll;\n...\nfor (const\
    \ auto& person : coll) {\n    if (person.getName().empty()) {    // OOPS: copies\
    \ the name\n        std::cout << \"found empty name\\n\";\n    }\n}\n```\n\nIf\
    \ you compare this approach with an approach that returns a reference, you can\
    \ see that the version that returns the string by value has a performance overhead\
    \ of a factor of between 2 and 100 (provided the names have a significant length\
    \ so that SSO does not help). Giving access to a member that is an image or a\
    \ collection of thousands of elements might be even worse. In that case, getters\
    \ often return by (const) reference to improve the performance.\n\n# 5.1.2　Return\
    \ by Reference\n\nA getter returning by reference would look as follows:\n\n```\n\
    class Person\n{\nprivate:\n    std::string name;\npublic:\n    ...\n    const\
    \ std::string& getName() const {\n        return name;\n    }\n};\n```\n\nThis\
    \ is faster but somewhat unsafe because the caller has to ensure that the object\
    \ the returned reference refers to lives long enough. In fact, there is a lifetime\
    \ risk that you use the return value of the getter longer than the object you\
    \ call the getter for.\n\nOne way of falling into this trap is to use the range-based\
    \ for loop as follows:\n\n```\nfor (char c : returnPersonByValue().getName())\
    \ {  // OOPS: undefined behavior\n    if (c == ' ') {\n        ...\n    }\n}\n\
    ```\n\nNote that on the right side in the header of the loop there is a function\
    \ that returns a temporary object that we refer to with our getter. However, the\
    \ range-based for loop is defined so that the code above is equivalent to the\
    \ following:\n\n```\nreference range = returnPersonByValue().getName();\n// OOPS:\
    \ returned temporary object destroyed here\nfor (auto pos = range.begin(), end\
    \ = range.end(); pos != end; ++pos) {\n```"
