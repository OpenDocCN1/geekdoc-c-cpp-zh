- pgno: 251
  md: '# V


    # value category


    A classification of expressions. The traditional value categories *lvalues* and
    *rvalues* were inherited from C. C++11 introduced alternative categories: *glvalues*
    (generalized lvalues), whose evaluation identifies stored objects, and *prvalues*
    (pure rvalues), whose evaluation initializes objects. Additional categories subdivide
    *glvalues* into *lvalues* (locatable lvalues) and *xvalues* (Expiring values).
    In addition, since C++11, *rvalues* serve as a general category for both *xvalues*
    and *prvalues* (before C++11, rvalues were what *prvalues* are since C++11). The
    chapter about *value categories* describes details.


    # variadic template


    A template with a template parameter that represents an arbitrary number of types
    or values.


    # X


    # xvalue


    A category of expressions that produce a location for a stored object that can
    be assumed to be no longer needed. A typical example is an *lvalue* marked with
    `std::move()`. The chapter about *value categories* describes details.'
  merge: -1
