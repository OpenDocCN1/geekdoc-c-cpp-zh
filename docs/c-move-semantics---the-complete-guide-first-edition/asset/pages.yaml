- pgno: 76
  md: '# # Chapter 4


    # # How to Benefit From Move Semantics


    Most of the time, programmers benefit from move semantics automatically. However,
    even as an ordinary application programmer, you can benefit from move semantics
    even more when programming slightly differently.


    This chapter discusses how to benefit from move semantics in ordinary application
    code, classes, and class hierarchies beyond the automatic generation of special
    move member functions. The chapter also introduces corresponding new guidelines.


    Note that even several years after introducing move semantics these recommendations
    are not widely known in the community. In fact, one reason for me to write this
    book was to make them state of the art for modern C++ programming.


    # ## 4.1 Avoid Objects with Names


    As we have seen, move semantics allows us to optimize using a value from a source
    that no longer needs that value. If compilers automatically detect that a value
    is used from an object that is at the end of its lifetime, they will automatically
    switch to move semantics. This is the case when:


    +   * We pass a temporary object that will automatically be destroyed after the
    statement.

    +   * We return a local object by value.


    In addition, we can force move semantics by marking an object with `std::move()`.


    Because it is easier to just to let compilers do the work, a first consequence
    of move semantics is the following advice: **avoid objects with names.**


    Instead of


    ```

    MyType x{42, "hello"};

    foo(x);    // x afterwards not used

    ```


    it would be better to program:


    ```

    foo(MyType{42,"hello"});

    ```


    to automatically enable move semantics.'
  merge: -1
  img_proc: true
- pgno: 77
  md: "Of course, the advice to avoid objects with names might conflict with other\
    \ important style guidelines such as readability and maintainability of source\
    \ code. Instead of having a complex statement, it might be better to use multiple\
    \ statements. In that case, you should use `std::move()` if you no longer need\
    \ an object (and know that copying the object might take significant time):\n\n\
    ```\n```cpp\nfoo(std::move(x));\n```\n```\n\n# ### 4.1.1 When You Cannot Avoid\
    \ Using Names\n\nThere are cases where you cannot avoid using `std::move()` because\
    \ you have to give objects names. The most obvious typical examples are:\n\n+\
    \   - You have to use an object multiple times. For example, you might get a value\
    \ to process it twice in a function or loop:\n\n```\n```cpp\nstd::string str{getData()};\n\
    ...\ncoll1.push_back(str);              // copy (still need the value of str)\n\
    coll2.push_back(std::move(str));    // move (no longer need the value of str)\n\
    ```\n```\n\nThe same applies when inserting the value in the same collection twice\
    \ or calling two different functions storing the value somewhere.\n\n+   - You\
    \ have to deal with a parameter. The most common example of this is the following\
    \ loop:\n\n```\n```cpp\n// read and store line by line from myStream in coll\n\
    std::string line;\nwhile (std::getline(myStream, line)) {\n    coll.push_back(std::move(line));\
    \   // move (no longer need the value of line)\n}\n```\n```\n\n# ## 4.2 Avoid\
    \ Unnecessary `std::move()`\n\nAs we saw, returning a local object by value automatically\
    \ uses move semantics if supported. However, just to be safe, programmers might\
    \ try to force this with an explicit `std::move()`:\n\n```\n```cpp\nstd::string\
    \ foo()\n{\n    std::string s;\n    ...\n    return std::move(s);   // BAD: don't\
    \ do this\n}\n```\n```\n\nRemember that `std::move()` is just a static_cast to\
    \ an rvalue reference. Therefore, `std::move(s)` is an expression that yields\
    \ the type `std::string&&`. However, this no longer matches the return type and\
    \ therefore disables the *return value optimization*, which usually allows the\
    \ returned object to be used as a return value. For types where move semantics\
    \ is not implemented, this might even force the copying of the return value instead\
    \ of just using the returned object as the return value.\n\nTherefore, if you\
    \ return local objects by value, do not use `std::move()`:"
