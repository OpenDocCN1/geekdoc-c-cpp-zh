  \n### 4.4.4 红绿灯版本 4 – 带有进度条的原始屏保\n\n在引入了定时事件的概念以及如何使用它们控制应用程序中的事件流之后，将这一想法扩展到创建框架内特定对象的幻象运动就变得非常直观了。一个很好的例子是以现有的\
  \ `Traffic Lights` 应用程序为基础，创建一个原始的屏保。\n\n除了现有的组件外，这种场景下可以使用的另一个组件是 `progressbar`\
  \ 控件。它通过提供有关任何特定状态（即 `green`、`yellow` 和 `red` 红绿灯）已时间和剩余时间的提示，帮助屏保更具信息量。该组件属于 `ttk`\
  \ 库，可以接受多个控制其外观和功能的参数，其中最重要的参数是 `length`、`orient` 和 `mode`。`Length` 决定进度条的大小（即长度），`orient`\
  \ 决定组件的方向（即 `VERTICAL` 垂直或 `HORIZONTAL` 水平），`mode` 则显示的值是预定的（`determinate`）还是未定的（`indeterminate`）。在前者的情况下，条将显示向组件的一端移动，直到达到指定值；而在后者的情况下，条将显示为连续从一端移动到另一端并返回。\n\
  \n以下脚本实现了一个相关的实现示例，其中三个红绿灯控制着 `car` 图像（嵌入在标签控件中）的移动。当绿灯亮时，汽车以特定的速度移动；当黄灯亮时，以其一半的速度移动。同样，当红灯亮时，汽车似乎停止了，进度条显示正在加载，以反映在该特定状态（即红灯）下的已时间以及触发下一个状态（即绿灯）之前的剩余时间。汽车图像似乎在框架中跳动，每当到达父框架边缘时都会向不同的方向移动。汽车图像的运动始终是对角线，并遵循四个不同的方向。当用户中断（关闭）应用程序时，程序停止。相关的\
  \ Python 脚本如下所示：\n\n\n\n\n\n```python\n# 库\nimport tkinter as tk\nfrom tkinter import\
  \ ttk\nfrom tkinter import *\n# 必要的图像处理类\nfrom PIL import Image, ImageTk\n# 用于定时器线程的线程库\n\
