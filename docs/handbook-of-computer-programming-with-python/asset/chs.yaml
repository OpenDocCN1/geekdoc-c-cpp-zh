  \ e^x for each element of the input \\\n13         array:\\n\", np.exp(npArray))\n\
  14\n15  # 使用 array function (Numpy) 创建一个二维数组 (2x3)\n16  newMatrix = np.array([[3,\
  \ 4, 5], [1, 2, 3]])\n17  print(\"\\nThe 2x3 matrix newMatrix is:\\n\", newMatrix)\n\
  18  # 应用 .dot 方法相乘数组 npArray 和 newMatrix\n19  print(\"\\nThe product of npArray\
  \ and newMatrix using the .dot method \\\n20         is:\\n\", npArray.dot(newMatrix))\n\
