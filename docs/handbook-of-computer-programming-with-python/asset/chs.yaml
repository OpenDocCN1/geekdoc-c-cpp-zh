  \ 界面（图 1.1）。要创建一个新的 Python 程序，用户可以从右上角选择`New`并点击`Python 3` 笔记本菜单选项（图 1.2）。此操作将在\
  \ Jupyter 下启动一个默认名的新的 Python 文件。可以通过点击文件名进行更改。\n\n![](img/Fig01_02.jpg)\n\n图 1.2\
  \ 在 Jupyter Notebook 中创建新的 Python 文件。\n\nJupyter 编辑器按单元组织。用户可以将每行代码添加到单独的单元格中，也可以将多行添加到同一个单元格中（图\
  \ 1.3）。主工具栏上的`Run`按钮用于执行选中单元格中的代码。如果代码没有错误，解释器将移动到下一个单元格；否则，会在发生错误的单元格后显示错误消息（图\
  \ 1.4）。\n\n![](img/Fig01_03.jpg)\n\n图 1.3 Jupyter 编辑器。\n\n![](img/Fig01_04.jpg)\n\
  \n图 1.4 在 Jupyter 上运行 Python 程序。\n\n## 1.4 创建独立的可执行文件\n\n除了第 12 章：使用 Python 进行虚拟现实应用开发》讨论了需要特定且高度专业开发平台的应用之外，书中介绍的\
  \ 脚本和示例都是在 Anaconda Jupyter 环境中原生实现和测试的。在这种背景下，开发和测试解决方案的过程是一个相当直接且直观的过程。然而，当涉及到在更真实的场景中部署应用程序时，情况会变得稍微复杂。这主要由于人们开发的\
  \ Python 代码通常依赖于许多`外部库`、`包`和`各种格式的文件`。在 Anaconda 环境中工作时，这些内容会在后台自动提供，但当将脚本导出为`独立`文件时，情况并不如此。所需的库和资源可能位于开发期间使用的计算机和/或网络系统文件结构中的许多不同位置。\n\
  \n\n\n\n在应用部署的背景下，对此类外部文件和对象的引用通常被称为应用 `dependencies`（依赖）。依赖项构成了开发的应用中至关重要且不可的一部分，底层文件必须与最终交付的程序（例如独立的的可执行应用程序）一起提供，因为缺少这些文件将导致程序在缺乏必要库和文件结构的机器上无法正常运行。幸运的是，后者在开发生命周期的\
  \ `deployment`（部署）阶段通过特殊的程序和过程自动选择并打包。这样一来，一旦创建了最终部署包，就可以在其他计算机上运行应用程序，而不论这些计算机是否包含必要的文件和库。\n\
  \n许多 `SDKs` 和编程环境提供了内置的程序（即 `wizards`，向导）用于生成部署包和独立的可执行文件。对于 Anaconda Jupyter 来说，虽然没有用于此类任务的自动化内置向导，但可以求助于许多外部辅助应用程序。此过程的详细逐步教程超出了本书的范畴。然而，下文提供了一些基础的介绍性示例，以帮助对命令行环境缺乏或没有以前经验的读者熟悉此类任务。\n\
  \n在写作时，用于从 Python 脚本生成独立可执行文件的最广泛使用的第三方应用程序有两个：用于 Windows 的 `PyInstaller`（PyInstaller\
  \ Development Team, 2019）和用于 Windows/Mac OS 的 `Py2app`（Oussoren & Ippolito, 2010）。这两个应用程序都可以处理依赖项和\
  \ `linking`（链接），决定使用哪一个取决于当前的操作系统和个人偏好。泛而言，创建独立可执行文件时需要遵循的步骤总结如下：\n\n*   **步骤 1**：无论选择什么程序和过程来生成独立应用程序，必须首先从\
  \ Anaconda Jupyter 导出原始脚本，导出为一个或多个 Python `*.py` 文件。这些文件将作为部署应用程序的输入文件。\n\n*   **步骤\
  \ 2**：另一项核心任务是确保应用程序已安装在系统上。可以通过多种方式实现，在许多相关的在线指南和教程中进行了详细说明（Apple Inc, 2021; Cortesi,\
  \ 2021; Microsoft, 2021a, 2021b; Oussoren & Ippolito, 2010; PyInstaller Development\
  \ Team, 2019）。就本示例而言，一种可能性是使用 `Command Prompt/PowerShell` 窗口安装 `PyInstaller`（Microsoft,\
  \ 2021a, b），并使用以下命令：\n\n    ```bash\n    pip install pyinstaller\n    ```\n\n* \
  \  **步骤 3a (Windows)**：一旦安装了 `PyInstaller`，并且相关文件和命令行环境已妥善设置，生成独立文件可以像执行以下命令简单：\n\
  \n    ```bash\n    pyinstaller yourprogram.py\n    ```\n\n    或者，用户可以参考 `PyInstaller`\
  \ 官方文档，以便根据需要执行带有适当 `parameters`（参数）和 `flags`（标志）的更具体且复杂的命令。例如，使用带有 `--onefile`\
  \ 标志的相同命令将强制生成的执行执行文件打包成一个：\n\n    ```bash\n    pyinstaller --onefile yourprogram.py\n\
  \    ```\n\n*   **步骤 3b (Mac OS)**：在安装了 `PyInstaller` 且考虑到相关文件和命令行环境已正确设置的情况下，使用\
  \ `Py2app`（Oussoren & Ippolito, 2010）的基本原理也适用，尽管过程和命令可能有所不同。例如，在 Mac OS 上使用时，`Py2app`\
  \ 生成的是应用包而不是文件。用户可以使用 `Terminal`（Apple Inc, 2021）首先安装 `Py2app`：\n\n    ```bash\n\
  \    pip install -U py2app\n    ```\n\n    然后可以使用 `Py2app` 创建 `setup` 文件：\n\n  \
  \  ```bash\n    py2app --make-setup yourprogram.py\n    ```\n\n    最后，可以使用该设置文件生成应用包：\n\
  \n    ```bash\n    python setup.py py2app\n    ```\n\n    在两种情况下，独立应用程序通常根据设置和参数放置在指定的目录中。\n\
  \n为了成功执行此处提供的示例，读者可能需要执行许多其他必要的命令并使用命令行环境设置正确的目录。关于如何使用 `PyInstaller` 和 `Py2app`\
  \ 的详细信息可以在官方文档页面（Cortesi, 2021; Oussoren & Ippolito, 2010）以及大量的相关的在线资源中找到。必须注意的是，这里提到的第三方应用程序只是人们选择用于创建基于\
  \ Python 脚本的独立可执行文件的工具之一，并不是处理此类任务的唯一方法。\n\n\n\n\n第三部分（第 10-12 章）涵盖了`机器学习`和`深度学习`概念，同时简要介绍了如何在传统上与该语言不关联的语境中使用\
  \ Python，例如`虚拟现实`（`VR`）应用开发。这部分介绍了一些从背景角度来看可能更高级的概念，但在使用 Python 实现时并不一定更有挑战性。例如，虽然对于本书的许多读者来说，深入理解`机器学习和深度学习`背后的原理和算法可能超出他们的范围，但使用\
  \ Python 提供的各种相关模块和方法来开发应用可能是他们感兴趣的。同样，虽然视频游戏和 VR/AR 应用开发从严格来说确实超出了 Python 教科书的范围，但对如何使用\
  \ Python 语言开发此类应用的基本了解，可能会为最具冒险精神的读者提供有用的见解。\n\n书中所有的脚本和案例研究，以及执行它们所需的相关数据和文件，都作为补充材料包含在附录\
