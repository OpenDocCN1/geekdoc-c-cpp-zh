  从本章提供的示例显易看出，GUI 编程中最重要的概念之一是用户与小部件的交互，因为这是通过事件来触发特定任务的方式。此类交互通常以鼠标点击或键盘事件的形式存在。表\
  \ 5.5 列出了一些重要的交互方法，以供快速参考。\n\n### 表 5.5 (#C_008_c5.xhtml_t5_5b) 常用事件及其描述\n\n| 事件\
  \ | 简要描述 |\n| --- | --- |\n| `<Button-1>, <Button-2>, <Button-3>` | 当在小部件上点击鼠标左键、中键或右键时触发。\
