  \n### 11.3.7 模型过拟合与欠拟合\n\n学习过多或学习过少对任何模型都是没有好处的。必须在前者（过拟合）和后者（欠拟合）之间找到最佳拟合点，尽管所有模型在某种程度上都遭受了其中一种情况的影响。简单来说，当\
  \ `loss` 不够低时，模型处于欠拟合状态，这意味着它没有足够的数据来学习。相反，过拟合，意味着模型使用了过多的数据进行学习，而这些数据被错误地认为是良好数据。图\
  \ 11.6 阐明了这一概念：\n\n最后，读者必须意识到一个需要解决的常见问题。每个深度模型都有一个被称为“容量”的特性。它是关联模式规模和复杂性的指示。在神经网络的情况下，这涉及到神经元和层的数量。为了克服欠拟合，必须增加模型的容量。\n\
  \n*TensorFlow* 提供了一个用于早停（early stopping）的回调方法。如名称所示，该方法在训练过程的每个 `epoch` 之后运行。\n\n\
  \n\n\n\n```python\n1  from tensorflow.keras.callbacks import EarlyStopping\n2\n\
  3  # 定义停止前的最小变化量和等待时间（epochs）\n4  # before stopping\n5  EarlyStopping1 = EarlyStopping(min_delta\
  \ = 0.001, patience = 10,\n6  restore_best_weights = True)\n7\n8  print(\"\\nThe\
  \ observation epochs for the new model: \\n\")\n9  NewObservation = FinalModel.fit(Xtrain,\
  \ Ytrain, validation_data =\n10     (Xtest, Ytest), batch_size = 300, epochs = 400,\n\
  11     callbacks = [EarlyStopping1], verbose = 0)\n12 Observation5DataFrame = pd.DataFrame(NewObservation.history)\n\
  13 Observation5DataFrame.loc[:, ['loss', 'val_loss']].plot();\n```\n\n**输出 11.3.7:**\n\
  \n![](img/un11_19.jpg)\n\n## 11.4 总结\n\n虽然前节介绍的概念应该足以让人神经网络的基本结构组件有一个大致的概念，但在现实中，深度学习（DL）利用许多不同的网络类型和拓扑结构，这些结构扩展并增强了它们的复杂性和功能。示例包括但不限于：\n\
  \n*   **卷积神经网络 (CNN)：** 多层人工神经网络（ANN）的一种`regularized`变体，使用分层方法产生日益复杂的模式。CNN 常用于图像处理。\n\
  \n*   **循环神经网络 (RNN)：** 如名所示，RNN 利用了跨网络组件的`recurrent` 循环和连接。这提供了在网络内部存储数据并将其作为反馈机制来告知事件的能力。RNN\
  \ 在机器翻译应用中尤为流行。\n\n*   **自组织映射 (SOM)：** SOM 与其他 ANN 的区别在于其数据训练方法（即使用`competitive\
  \ learning` 竞争学习而非`error-correction learning`误差修正学习）。此类网络的目标是降低输入数据的维度。\n\n*   **自动编码器\
  \ (Auto-Encoder)：** 自动编码器旨在通过忽略信号或数据中可能存在的`noise` 来高效编码数据。它们被用于各种应用，如信息检索、图像处理与重建以及流行度预测。\n\
  \n由于本章旨在作为神经网络某些基本概念的介绍，因此它没有显式地涵盖这些网络在深度学习背景下可以采取各种类型和拓扑结构。读者可以在参考文献中找到关于这些主题的丰富信息。\n\
  \n## 11.5 案例\n\n1.  第一阶段：构建必要的逻辑门（即 `AND`、`OR`、`XOR`），它们将作为感知器的构建块。\n    *   使用实数而非整数。\n\
  \    *   实现 `sigmoid` 函数：$z = \\sigma(x)$。\n2.  第二阶段：实现以下内容：\n    *   向 `sigmoid`\
  \ 馈样本。\n    *   使用 `backpropagation` 算法：\n        *   计算 `MSE`：$\\text{MSE} = \\\
  frac{1}{n}\\sum_{i=0}^{n-1}(y - \\hat{i})^{2}$\n        *   计算每个输出的误差项。\n      \
  \  *   应用 `delta` 规则。\n        *   为了获得模型结果调整权重。\n3.  第三阶段：验证该类。\n\n\n\n\n过去几年 VR\
  \ 开发快速扩展的一个重要推动因素是，许多开发工作可以在现有的 3D 图形和视频游戏平台（`game engines`）中完成，而很少或完全不需要对其核心组件和工作流进行重大修改。因此，VR\
  \ 开发与 3D 图形和视频游戏开发有许多共同点这并不意外；事实上，对于具有后者领域经验的人来说，与从零开始的人相比，这种转型会要容易得多。与此同时，VR 开发是一种独特的媒介，具有其自身的技术和创作特性以及挑战。因此，尽管\
  \ VR 开发人员在精通这项技能的过程中不可避免地会接触到视频游戏平台和 3D 图形技术，但在没有这些领域领域经验的情况下，开启 VR 开发之旅也是完全可行的。对于进入\
  \ VR 开发的人，阻力最小的路径可能是一种平台，结合了简单的开发界面和坚实且计算强大的基础，能够支持 VR 应用和硬件的巨大需求。本章使用的软件软件包 `Vizard`\
  \ 正是这样：一个 VR 开发平台，提供一个 Python 脚本接口，该接口构建在用于 VR 环境渲染和操作的所需的底层核心类和库之上（WorldViz, 2019）。这使得有志的\
  \ VR 开发人员能够接触基础概念、原理和技术，而无需处理更具挑战性且难以掌握的编程语言，如 `C++` 或 `C#`，这些语言被用于一些领先的商业 VR 开发平台（Epic\
  \ Games, 2019; Unity Technologies, 2019）。\n\n必须注意的是，虽然本章侧重于介绍 Python 在 VR 应用技术实现相关概念的基础介绍，但*VR\
  \ 体验中最重要的元素无疑是一个引人入胜且意义深远的故事，或者是作为核心关注点的关键功能*。如果对 VR 开发的技术方面有理解，却缺乏对该过程概念层面的理解，这更像是一种练习，而不是一种可行的\
  \ VR 开发方法。因此，建议读者一旦对技术实现的主要方面有了基本了解，就参考涵盖 VR 技术出现所带来的概念和美学影响，以及其给内容开发者带来挑战的丰富文献。\n\
  \n本章首先介绍了与 VR 和 3D 游戏开发相关的一些基本概念和技术，然后转向通过 Python 脚本介绍基础的 VR 开发任务。除了介绍 Vizard 平台中用到的一些基础\
  \ Python 命令外，本章的主要目标是让读者接触 VR 开发的一些本质概念和技术方面，以及他们可能希望为此类工作采用的编程逻辑。\n\n假设读者已经对面向对象的编程原理和逻辑有基本的理解。因此，`class`\
  \ 和 `function/method` 结构、`instantiation, inheritance` 和 `polymorphism` 等概念在本文中未被涵盖，尽管它们在本文背景下的相关性与任何其他面向对象的编程情况一样重要。尽管如此，由于\
  \ Vizard 环境中的 Python 脚本命令相对易于使用且自解释性，即使是对这些概念没有深入理解的读者，应该能够跟上本章介绍的编程思路并开始 VR 开发。\n\
  \n为了清晰和兼容，本章开发的 Python 脚本松散地遵循了 Vizard 官方文档和在线教程中提供的某些示例。这样做是为了：a) 如果读者决定深入研究该平台，可以轻松地过渡到非常详尽的\
  \ Vizard 指南和 API 参考；b) 利用标准 Vizard 安装附带的基础 `prefabricated 3D objects` 集合，从而避免随机选择资产可能导致的不一致、混淆以及文件夹结构或文件格式问题。本章展示的代码是在\
  \ Vizard 7 的 64 位版本编写并测试的（WorldViz, 2019）。\n\n## 12.2 3D 视频游戏引擎和 VR 开发平台\n\n在开始编写第一行\
  \ Python 代码之前，需要对使 VR 成为可能的平台和技术建立基本的了解。虽然详细介绍 VR 系统技术基础这样复杂且晦的话题超出了本章的范围，但读者可能会从概念化相关的某些基本想法中受益。这段简要介绍特别针对那些对学习更多\
  \ VR 开发感兴趣，但在 3D 图形或视频游戏开发背景下并不具备编程背景的人。熟悉这些概念的读者可以需要从本章的后续章节开始。\n\n在写作时，许多 VR 开发人员使用现有的游戏开发平台，这些平台提供了创建和运行\
  \ 3D 环境所需的必备工具和功能，而不是从零开始构建。这在商业领域尤其如此，VR 应用通常使用先进的行业标准 3D 游戏开发平台或 `game engines`\
  \ 进行开发，例如 Epic Games 的 `Unreal Engine`（Epic Games, 2019）和 `Unity 3D`（Unity Technologies,\
  \ 2019）。此类平台提供了专门为处理 3D 图形而设计的预建类、函数/方法和工具，以及专门的方法，如 `physics modelling` 和 `3D graphics\
  \ rendering`（Dunn & Parberry, 2011）。由于 3D 游戏引擎支持对全动画 3D 图形的操作，它们也适用于依赖 VR 等功能的其他类型媒体的应用开发（Glover\
  \ & Linowes, 2019）。\n\n\n\n\n典型的 3D 游戏开发环境提供了对开发中 3D 世界的视觉模型的访问，以及对其进行操作所需的工具和接口。对于以前没有接触过游戏引擎的读者，图\
  \ 12.1 中提供了一个 Unity 3D 环境下的项目截屏。在这个示例中，主屏幕从给定角度（即 `camera` 相机或视点）显示 `3D 世界`或`map`（地图）、一个存在于\
  \ 3D 世界中的所有对象列表（左上角）、文件和文件夹结构的层级视图（底部和左下角），以及一个提供 3D 世界内给定对象详细设置和参数的面板（右侧）。在视频游戏和\
  \ VR 开发中，`object`（对象）指的是任何可以添加到 3D 世界的内容，无论其是否可见。例如，在图 12.1 中，山丘和地面是一个单一对象（即 3D\
  \ 世界），植被是基于相同模板的一系列独立对象，而下方的中间选中的白色符号是一个音频对象，当用户进入由淡色球形轮廓围成的区域时即可被触发。读者应该注意，存在于\
  \ 3D 环境中的一切内容都被视为独立的对象，无论其大小、复杂程度属性如何。\n\n![](img/Fig12_01.jpg)\n\n**图 12.1** Unity\
  \ 3D 开发环境。（参见 Unity Technologies, 2019。）\n\n尽管游戏或 VR 开发平台通常提供详尽且精细的工具，通过视觉界面处理许多常见的开发任务，但开发可行的应用程序仍需要大量的编码。因此，这些平台还提供了一个暴露所需的编程类和函数/方法的编程接口。在大多数情况下，这是通过支持内部或外部编码\
  \ `editors`（编辑器）和`compilers`（编译器）的脚本接口实现的。例如，图 12.2 显示了一个作为 `component`（组件）添加到 Unity\
  \ 3D 对象中的脚本，并使用 `external editor`（外部编辑器）打开编辑（Microsoft, 2019; Unity Technologies,\
  \ 2019）。每个开发平台用于脚本的编程语言各异，取决于底层架构、结构以及目标受众。尽管无论使用何种编程语言和工具，重要的是，游戏引擎的功能之一是将编译后的脚本集成到\
  \ 3D 环境中，并将它们分配给目标对象和功能模块。\n\n![](img/Fig12_02.jpg)\n\n**图 12.2** 在 Unity 3D 中创建并在\
  \ Visual Studio 中打开编辑的脚本。（参见 Microsoft, 2019。）\n\n尽管 3D 游戏开发平台目前是 VR 开发领域规模最大的参与者之一，但人们对\
  \ VR 作为一种独立且独特媒介的兴趣日益增长，这导致了许多专门专注于 VR 开发的工具出现。与之前讨论的 3D 游戏开发平台一样，这些平台的结构和目标受众不同，支持的编程语言也是如此。尽管像\
  \ `C++` 这样的低级语言更适合计算密集型任务（如处理动画化的 3D 图形）是一个普遍事实，但某些专用 VR 开发平台针对的是那些需要使用它们但无需深入了解底层编程细节以及\
  \ 3D 动画或物理建模背后数学原理的人。本章使用的平台 Vizard 就是这样一个平台，它为 VR 开发提供了一个易于访问的接口。这就是 `Python` 登场的地方，因为\
  \ Vizard 是少数显式使用它处理所有相关脚本任务的平台之一。通过 Vizard 接口，可以使用 `Python` 脚本来操作和控制 3D 环境的外观、结构和行为，以及用户与\
  \ VR 世界的交互。这是通过专门库和方法实现的，这些方法完成了将 `Python` 命令翻译为相应的低级语言和平台的所有工作。\n\n## 12.3 运动追踪器与头戴式显示器\
  \ VS 键盘、鼠标和显示器\n\nVR 应用与使用普通屏幕显示、键盘和鼠标的应用之间最明显的两个区别是 a) 接收用户输入的方式，以及 b) 视觉内容的交付方法。`motion\
  \ tracker`（运动追踪器）通常指的是跟踪用户移动并将其转换为数值坐标传递给应用程序的传感器。这在本质上取代了手持游戏控制器、键盘和鼠标等传统输入设备。尽管如此，在基础层面，通过运动追踪器或键盘鼠标接收必要的坐标数字并没有太大区别。这里必须指出，虽然原生使用运动追踪器工作以及通过键盘或鼠标工作是两个截然且经常不同的过程，但对于本章介绍的探索性和原型设计任务来说，这些差异并不关键。\n\
  \n与输入设备一样，视频游戏和 VR 应用在处理输出的方式上也有不同。在 VR 中，`Head Mounted Display`（`HMD` 头戴式显示器）使用特殊的短距离投影仪而不是屏幕将\
  \ 3D 环境图像投影到用户的每个眼睛（Glover & Linowes, 2019）。虽然视觉和立体图像投影的研究超出了本章的范围，但感兴趣的读者可以在关于\
  \ `stereoscopic media`（立体媒体）主题的经典教科书中找到更多信息，例如 Ray Zone 的 *Stereoscopic Cinema and\
  \ the Origins of 3-D Film*（Zone, 2007）以及 Bernard Mendiburu 的 *3D Movie Making, Stereoscopic\
  \ Digital Cinema from Script to Screen*（Mendiburu, 2012）。与运动追踪器一样，对于演示和原型设计任务，在屏幕上或通过\
  \ HMD 监控开发工作的差异应该是次要的，尽管诚然，动画师或图形设计师在制作专业作品时确实存在显著差异。在当前语境下，本文介绍的所有概念都可以探索和测试，并不强制要求使用特殊的\
  \ HMD 或运动追踪器。尽管如此，通过 Vizard 提供的专用接口（Vizconnect`）连接此类设备的过程将在本章后半部分简要介绍。\n\n## 12.4\
  \ Vizard 环境与创建图形窗口\n\n\n\n\n\nVizard 提供三种不同类型的许可证，可以从公司官方网站 [WorldViz.com](http://WorldViz.com)\
  \ 下载（WorldViz, 2019）。它提供了一个 Python 脚本接口以及一系列库和工具，用于导航和管理 VR 项目。Python 脚本位于主窗口的右上角，左侧提供了项目/文件浏览器窗口，底部是调试和信息面板（见图\
  \ 12.3）：\n\n![](img/Fig12_03.jpg)\n\n**图 12.3** Vizard 脚本环境。（参见 WorldViz, 2019 ）。\n\
  \n与之前介绍的游戏开发平台示例不同，读者会注意到，在 Vizard 中没有永久可见的 3D 环境。这是因为当执行相应的 Python 命令时，3D 环境会在单独的窗口中*实时渲染*。因此，VR\
  \ 开发人员不需要像在图 12.1 那样直接在现有的 3D 图形设计窗口上工作，而是必须运行 Python 脚本才能显示实际的 VR 环境。可以使用菜单中的 `File  New\
  \ Vizard File` 命令创建一个新脚本。创建和操作 VR 环境所需的 Python 库由 Vizard 提供。与大多数其他编程环境一样，这些库需要显式地声明并导入到脚本中，以便用户能够访问它们的类和对象。在\
  \ Vizard 中，使用 `viz` 关键字来声明用于实例化 3D 世界的主库：\n\n```\nimport viz\n```\n\n一旦导入了库，可以使用\
  \ `viz.go()` 方法创建一个空的 3D 世界：\n\n```\nviz.go()\n```\n\n还可以使用适当的 `flags` 来控制显示 VR\
  \ 环境的窗口的外观和特征。例如，以下命令将创建一个全屏窗口，而不是默认窗口（800   600 像素）：\n\n```\nviz.go(viz.FULLSCREEN)\n\
  ```\n\n同样，使用 `PROMPT` 标志允许用户在启动 VR 环境窗口之前选择演示模式：\n\n```\nviz.go(viz.PROMPT)\n```\n\
  \n所有可用选项的详细列表可以在 Vizard 参考和 API 文档中找到（WorldViz, 2019）。在现阶段，开发的脚本应该如下：\n\n```\n1\
  \   # 导入 viz 库\n2   import viz\n3\n4   # 为 3D 环境创建一个空窗口\n5   viz.go(viz.FULLSCREEN)\n\
  ```\n\n按下 Vizard 工具栏上的 `Run` 按钮或键盘上的 `F5` 将执行该脚本。由于这是第一次执行该脚本，在继续之前必须保存它。脚本可以保存到任何位置，但与任何其他项目一样，保持文件和文件夹结构的合理组织对长远来看无疑有帮助。运行脚本后，托管\
  \ VR 应用程序的窗口（*图形窗口*）将启动。在此阶段，将显示一个空白的黑屏。这是因为脚本目前的形式创建了一个空的 3D 空间，*但没有用任何视觉内容填充该空间*。\n\
  \n## 12.5 创建 3D 世界\n\n发生动作的 3D 环境可以称为*地图*（map）或*3D 世界*（3D world）。在专业的 3D 软件如 `3ds\
  \ Max` 和 Blender（Blender, 2020）中，这种 3D 环境的开发是可以参考的。注意的是，在大多数情况下，3D 环境是由各种 3D 对象组成的。在设计阶段，这些预制对象通常被称为*预制体*（prefabricated）或*预制件*（prefabs）。在本节中，预制\
  \ 3D 模型将作为 VR 应用程序的视觉环境。这种 3D 对象以 Vizard 支持           的 `.osgb` 格式存储（WorldViz, 2019）。在\
  \ Vizard 中，可以使用 `viz.add()` 和 `viz.addChild()` 方法创建或导入 3D 对象。例如，以下命令将加载预制 3D 对象到初始地图中：\n\
  \n```\npiazza = viz.add('piazza.osgb')\n```\n\n对于不熟悉变量基础的人来说，该命令的结构可能会让他们困惑。`.osgb`\
  \ 文件的名称必须在列表中声明并传递给新创建的变量 `piazza`。目前，只需提到当在 3D 世界中创建或导入对象时，*必须被分配给变量*。这一概念将在 12.7\
  \ 节 创建额外的对象中详细讨论。\n\n默认情况下，新添加的 3D 对象的中心点与地图中心对齐。用户观察地图的相机（视点）最初也位于中心（见图 12.4）。\n\
  \n![](img/Fig12_04.jpg)\n\n**图 12.4** 通过主相机/视点观察的 3D 预制模型。（参见 WorldViz, 2019 ）。\n\
  \n当图形窗口激活时，用户可以通过按住左鼠标键并将鼠标指向所需方向在地图中移动。其他的移动模式和方向调整也可以通过按住 a) 右鼠标键或 b) 同时按下左右鼠标键来实现。这些是\
  \ Vizard 的默认导航控制。正如预期的，这些控制可以被修改和重新分配，该主题将在 12.15 节 集成 VR 硬件和导出独立的`.exe*` 文件中进行更详细的介绍。目前，默认控制应足够测试脚本并熟悉\
  \ 3D 环境。以下是本节开发的完整脚本版本：\n\n```\n# 导入 viz 库\nimport viz\n\n# 为 3D 环境创建一个空窗口\nviz.go(viz.FULLSCREEN)\n\
  \n# 添加所选环境的预制 3D 模型\npiazza = viz.add('piazza.osgb')\n```\n\n## 12.6 碰撞与重力\n\n\n\
  \n\n在导航时，读者会注意到相机可以自由地穿过 3D 世界的边界（即建筑物的墙壁和广场地板）。这是因为导入到空 3D 环境中的 3D 模型图形仅仅是图形：如此而已。在这一阶段，尚未特别声明当相机与图形重叠时，应阻止其进一步移动，以模拟更真实的行为。在\
  \ 3D 游戏和 VR 开发中，这被称为 `collision`（碰撞），即当一个物体（例如相机）开始与另一个物体（例如墙壁和/或地板）重叠的空间和时间上发生的事件。检测碰撞何时以及何地发生通常被称为\
  \ `collision detection`（碰撞检测），它是 VR 开发人员工具箱中的关键工具之一。从编程的角度来看，当两个物体发生碰撞时，通常需要执行特定操作，例如物体相互反弹，或触发特定的反应或动画（例如炸弹接触地面时爆炸）。尽管有许多通过代码处理碰撞的方法，但\
  \ Vizard 环境通过提供处理碰撞检测任务的方法和命令简化了操作。在几乎每个 VR 应用中必须控制的碰撞相关任务之一是`相机与 3D 世界图形之间的交互`。在\
  \ Vizard 中，可以通过调用相机对象（`viz.MainView`）的 `collision()` 方法来实现：\n\n```\nviz.MainView.collision()\n\
  ```\n\n之所以通过在 `viz` 库中专门包含 `MainView` 路径来访问碰撞（即 `viz.MainView`），是因为在单个 VR 应用中可能存在多个不同的视图，VR\
  \ 开发人员可能不想同时为所有视图都开启碰撞检测。如果读者不熟悉类和面向对象的编程结构，只需将 `MainView` 视为当前激活的视觉环境（即 3D 广场），并将\
  \ `viz` 视为托管该环境的窗口即可。\n\n`collision()` 方法接受 `viz.ON` 或 `viz.OFF` 标志作为参数，并据此设置相机与\
  \ 3D 世界中其他物体之间碰撞检测的状态：\n\n```\nviz.MainView.collision(viz.ON)\n```\n\n一旦开启碰撞检测，相机将无法再次穿过\
  \ 3D 世界的图形。在这种情况下，大部分工作工作已经由 `viz.MainView.collision()` 方法背后的类处理了。此类任务通常包括精确测量 3D\
  \ 物体表面的位置，以及每个表面的边界和几何形状。然而，在典型的 VR 开发人员通常操作的抽象层次上，这更多是学术兴趣，而非实际操作层面的需求。真正重要的是熟悉碰撞检测的概念以及如\
  \ `viz.MainView.collision()` 等相关命令和方法的使用，并知道在 Vizard 中创建新的 3D 世界时，相机的碰撞检测默认状态为 `OFF`。\n\
  \n用户在开发此阶段导航 3D 世界时会注意到的第二个问题是，相机可以静态地放置在任何给定的点上，无论是垂直方向还是水平方向。在设计各种物体的行为时必须考虑的额外因素是`gravity`（重力）的存在与。这在\
  \ VR 开发中尤为重要，因为通常`相机代表用户的视角`。`viz.MainView.collision(viz.ON)` 命令在提供相机与 3D 物体之间碰撞检测的同时，会自动开启相机的重力功能。默认情况下，重力设置为地球的引力加速度（即\
  \ 9.8 m/s²）。相机将受到引力影响，因此防止静态漂浮，尽管用户在按住鼠标键时仍可以垂直导航。如果在地面上方导航时松开鼠标键，相机将以 9.8 m/s²\
  \ 的速度开始下落，直到撞击地面表面才停止。当然，除非用户刻意导航到广场限制范围之外并穿过建筑，在这种情况下，相机将无限地掉入地图外的虚空空间。\n\n虽然自动调整引力吸引是一个很方便的功能，但在许多情况下，应该专门地定义\
  \ 3D 世界的表观重力。例如，如果 3D 世界应该位于一个引力作用极微的浮浮空间站上，VR 开发人员可能希望完全关闭重力。同样，如果将 VR 世界设置在月球上，重力需要设置到比地球\
  \ 9.8 m/s² 默认设置更低的水平（即 1.62 m/s²）。在最简单的情况下，为 3D 世界设置重力是通过将所需的重力加速度作为数值参数（单位为 m/s²）传递给\
  \ `viz.MainView.gravity()` 方法来实现的。例如：\n\n```\nviz.MainView.gravity(0)\n```\n\n将关闭重力，因为它等于零；而：\n\
  \n```\nviz.MainView.gravity(9.8)\n```\n\n将重力设回地球上的预期速率。相应地：\n\n```\nviz.MainView.gravity(1.62)\n\
  ```\n\n将模拟用户在月球上体验到的重力效果。以下是该部分的完整脚本版本：\n\n```\n1   # 导入 viz 库\n2   import viz\n\
  3\n4   # 为 3D 环境创建一个空窗口\n5   viz.go(viz.FULLSCREEN)\n6\n7   # 添加可选环境的预制 3D 模型\n\
  8   piazza = viz.add('piazza.osgb')\n9\n10  # 为创建的 3D 世界开启碰撞检测和重力\n11  viz.MainView.collision(viz.ON)\n\
  ```\n\n运行此脚本应允许用户使用鼠标控制在 3D 世界中移动而不穿过实体物体，同时受到标准引力的影响。\n\n## 12.7 创建额外的 3D 对象\n\n\
  对于没有面向对象编程知识的人来说，对象的概念可能会令人困惑。然而，在 Vizard 环境中，对象应该更容易识别，因为它们通常代表 3D 世界中的实体元素。所示，之前节中使用的脚本已经包含了物体的创建：\n\
  \n```\npiazza = viz.add('piazza.osgb')\n```\n\n在此实例中，声明了一个名为 `piazza` 的新变量，并通过 `viz.add()`\
  \ 方法将 *piazza.osgb* 3D 模型（在 Vizard 之外预制）分配给它。因此，创建的 3D 物体名称为 `piazza`，并且目前是脚本中显式声明并创建的唯一对象。可以使用相同的结构但不同的变量名来创建额外的对象并将它们添加到\
  \ 3D 世界中。例如，以下命令将使用预制的 *plant.osgb* 模型创建一个名为 `plant` 的新对象：\n\n```\nplant = viz.add('plant.osgb')\n\
  ```\n\n可以以类似的方式导入不同文件类型的对象，而不论它们在设计上是简单还是复杂。例如，以下命令：\n\n```\njane = viz.add('vcc_female.cfg')\n\
  ```\n\n将使用 *vcc_female.cfg* 模型将新对象分配给变量 `jane`。*.cfg* 类型的文件用于 *avatars*（形象），即代表角色的\
  \ 3D 物体，在设计上可以为其附加预制的行为和动画。\n\n\n\n\n```\n# 导入 viz 库\nimport viz\n\n# 为 3D 环境创建一个空窗口\n\
  viz.go(viz.FULLSCREEN)\n\n# 添加广场的 3D 模型并启用碰撞检测\npiazza = viz.add('piazza.osgb')\n\
  viz.MainView.collision(viz.ON)\n\n# 基于 'plant.osgb' 模型创建一个植物对象\nplant = viz.add('plant.osgb')\n\
  \n# 基于 'vcc_female.cfg' 模型创建一个女性角色对象（Jane）\njane = viz.add('vcc_female.cfg')\n```\n\
  \n运行该脚本将实例化一个新的 3D 环境，添加广场模型（3D 世界），开启摄像机的碰撞检测和重力，并添加两个新对象：一株植物和一个名为 Jane 的女性角色。请注意，新对象可能不会立即可见，因为它们都创建在与相机相同的位置（即\
  \ 3D 世界的中心点）。向后稍微移动一点距离，用户就能看到这些对象。\n\n## 12.8 3D（笛卡尔）坐标和基础对象定位\n\n在之前的示例中，广场模型的位置、新创建对象的位置以及相机本身的位置都是由\
  \ Vizard 确定并自动放置在 3D 环境的中心点的。然而，在大多数情况下，VR 开发人员会要求对象位于特定的点。由于 VR 开发是在 3D 环境中进行的，空间中对象的位置最好通过三个轴（`x`、`y`\
  \ 和 `z`）的三维（笛卡尔）坐标系来描述 (DQ, 2019; Dunn & Parberry, 2011)）。Vizard 使用所谓的左手坐标系，因为相对于\
  \ 3D 世界的中心，`x` 定义为从左到右，`y` 为从下向上，`z` 为从后向前 (图 12.5)）。\n\n![](img/Fig12_05.jpg)\n\
  \n图 12.5 Vizard 中的 3D 笛卡尔坐标。（参考 WorldViz, 2019。）\n\n3D 世界中的任何给定位置都可以使用与 `x`、`y`\
  \ 和 `z` 轴对应的三个数字来描述。在编程术语中，处理对象定位的方法或命令通常接受这些数字作为参数。在 Vizard 中，将对象定位到特定点的 Python\
  \ 命令结构如下：\n\n```\n<object>.setPosition([0,0,0])\n```\n\n`<object>` 关键字是所选对象的占位符。例如，以下命令：\n\
  \n```\njane.setPosition([0, 0, 8])\n```\n\n当 3D 世界实例化时，该命令将 Jane 放置在相机正前方（`z` 轴）8\
  \ 个单位处。同样，添加以下命令：\n\n```\nplant.setPosition([-3, 0, 10])\n```\n\n将植物放置在左侧（`x` 轴）3\
  \ 个单位、前方 10 个单位（`z` 轴）处。注意，轴的起点是 3D 世界的中心。因此，`x` 轴上的负值（例如 `-3`）将把对象向左移动。其他轴上的负值和正值的作用方式相同。必要时可以使用任何数字进行定位，但需要对对象的初始定位非常小心，因为碰撞检测和重力功能不会防止对象创建在\
  \ 3D 世界的边界之外。在这种情况下，对象将掉入虚空。作为一个示例，在当前脚本中将轴 `y` 设置为负值，将把对象放置在广场地板下方的空隙中。\n\n必须指出，尽管没有显式定义，但在运行脚本时还会自动创建另一个对象：相机本身。在面向对象的编程中，当某个某物对程序功能至关重要时，它通常会在后台自动创建，尽管也可以允许程序员进行手动访问和控制。在当前语文中，这意味着相机也可以像任何其他对象一样被控制和定位。访问\
  \ `viz` 库层次结构中的不同对象可能需要一些时间来掌握。在不涉及如何操作多个相机和不同视图的情况下，Vizard 允许 VR 开发人员使用 `viz.MainView.setPosition()`\
  \ 方法访问默认相机。在脚本中添加以下行将把相机初始化在 3D 世界中心点后方 10 个单位（`z` 轴）：\n\n```\nviz.MainView.setPosition([0,\
  \ 0, -10])\n```\n\n通过这种方式，在加载 3D 世界后，用户将出现在中心点后 10 个单位处，面对喷泉附近的 Jane 和植物 (图 12.6)。\n\
  \n## 欧拉角和朝向\n\n3D 世界对象的朝向定义和控制与定位类似。在数学中，这被称为欧拉角，每个度表示旋转一周的 1/360。朝向通过绕 `x`、`y`\
  \ 和 `z` 轴的旋转描述为偏航（*yaw*）、俯仰（*pitch*）和滚滚（*roll*）。在 Vizard 中调整欧拉角的命令是：\n\n```\n<object>.setEuler([0,0,0])\n\
  ```\n\n正负值的使用决定了旋转是顺时针还是逆时针。根据此，添加以下命令：\n\n```\njane.setEuler([180, 0, 0])\n```\n\
  \n将使 Jane 在 `y` 轴上顺时针旋转 180 度（偏航），面向相机而不是喷泉。同样，将相机放置在原始位置左侧 10 个单位（`[-10, 0, 0]`）并调整其\
  \ `y` 轴旋转 45 度（`[45, 0, 0]`），将使其靠近广场角落，并以特定角度面向两个 3D 对象所在的区域：\n\n```\nviz.MainView.setPosition([-10,\
  \ 0, 0])\nviz.MainView.setEuler([45, -10, 0])\n```\n\n将植物和摄像机的 `setPosition()` 命令参数值改为：\n\
  \n```\nplant.setPosition([-8, 0, 2])\nviz.MainView.setPosition([-10, 0, 0])\n```\n\
  \n并将摄像机的 `setEuler()` 命令值改为如下：\n\n```\nviz.MainView.setEuler([45, 15, 0])\n```\n\
  \n将使植物初始化在相机前方 2 个单位处，相机以 15 度的向下角度直接面向它 (图 12.7)。\n\n![](img/Fig12_07.jpg)\n\n\
  图 12.7 视点定位与朝向。（参考 WorldViz, 2019。）\n\n\n\n\n\n```python\n# Import the viz library\n\
  import viz\n\n# Create an empty window for the 3D environment\nviz.go(viz.FULLSCREEN)\n\
  \n# Add the 3D model of the plaza and enable collision detection\npiazza = viz.add('piazza.osgb')\n\
  viz.MainView.collision(viz.ON)\n\n# Create a plant object and Jane\nplant = viz.add('plant.osgb')\n\
  jane = viz.add('vcc_female.cfg')\n\n# Set the positions and orientation of the 3D\
  \ objects and the camera\njane.setPosition([0, 0, 8])\njane.setEuler([180, 0, 0])\n\
  plant.setPosition([-8, 0, 2])\nviz.MainView.setPosition([-10, 0, 0])\nviz.MainView.setEuler([45,\
  \ 15, 0])\n```\n\n## 12.10 绝对定位与相对定位\n\n通过静态数字明确定位对象在简单情况下可能有效，但随着项目和任务变得复杂，VR 开发人员需要根据与其他对象的关系来计算定位，而不是通过硬编码的值。以当前版本的脚本作为例如，如果相机要从短距离指向\
  \ Jane，用于其定位和朝向的命令可以更改如下所示：\n\n```python\nviz.MainView.setPosition([0, 0, 5])\n\
  viz.MainView.setEuler([0, 15, 0])\n```\n\n这将相机放置在 Jane 前方三个单位处，而 Jane 目前位于 `[0,\
  \ 0, 8]`（即 `8-5=3`），并且略微向下倾斜（15°）。然而，这种工作方法假设 VR 开发人员在任何时候都知道所有对象的精确 3D 坐标（或者愿意花费大量时间尝试不同的数字，就像本章作者在编写时经常做的那样）。这显然不是一种高效的工作方法，而且通常情况下，对象的定位是动态决定的。因此，读者必须熟悉\
  \ VR 和 3D 内容开发中的另一个核心概念：*绝对*定位与*相对*定位之间的区别。\n\n到为止，作为 `setPosition()` 方法参数使用的值都是绝对值，从这个意义上说，指的是\
  \ 3D 世界中的绝对位置。相对定位忽略了全局 3D 世界坐标，并使用另一个对象作为*参考点*，以此为基准计算坐标值。为了实现这一点，需要一种读取任何给定对象*当前位置*的方法。在\
  \ Vizard 中，可以通过 `getPosition()` 方法实现。与 `setPosition()` 类似，`getPosition()` 返回与三个坐标轴（x,\
  \ y, z）对应的三个数值。然而，由于在本例中这些值是在被*读取*而不是*赋值*，因此不需要传递参数。命令的语法如下：\n\n```\n<object>.getPosition()\n\
  ```\n\n它会自动返回所选对象的全部三个坐标数字。`getPosition()` 返回的值可以存储在变量中，或传递给另一个方法或对象。对于不熟悉将值存储在变量或将其传递给方法等基础编程概念的人，只需提到在\
  \ Python 中，只需通过声明一个唯一的名称即可创建一个可以持有 `getPosition()` 返回信息类型的新变量即可。在当前上下文中，Jane 和植物被创建的情况就是例子：\n\
  \n```python\njane_pos = jane.getPosition()\n```\n\n此行代码将 Jane 当前位置的坐标存储在新创建的 `jane_pos`\
  \ 变量中。注意，此命令应该在 Jane 放置在所需位置之后添加到脚本中，否则它将返回不准确的数字。为了测试和调试，读者可以使用 `print()` 方法监控存储在变量中的值：\n\
  \n```python\njane_pos = jane.getPosition()\nprint(\"Jane's current position is\"\
  , jane_pos)\n```\n\n该行将打印在 Vizard 环境底部面板的*交互*（Interactive）窗口上。\n\n也可以将 `jane_pos`\
  \ 的内容作为另一个对象的直接参数。下一行将植物放置在 Jane 相同的位置：\n\n```python\nplant.setPosition(jane_pos)\n\
  ```\n\n因为传递的 x, y, z 坐标将与 Jane 的坐标对应。一次性分配三个坐标有时很有用，但 VR 开发人员经常需要单独访问和使用三个轴的值。虽然假设读者熟悉*数组*（arrays）和*索引*（indexing）等概念，但对于可能对这些概念感到不完全舒适的人，下面提供了简要解释。`jane_pos`\
  \ 变量将与三个轴对应的三个数字存储为*数组*（array），或者在 Python 术语中称为*列表*（list），即*组织良好的数据值集合*。存储在列表中的值可以通过*索引*（index）单独访问，索引是一个定义存储值在数组内位置的整数。\n\
  \n\n\n\n由于 `jane` 的 z 轴索引值可以直接从 `jane.getPosition()` 读取，而无需传递给变量。上述任何变体都可实现相同的目标，选择哪种方案取决于编程经验、风格和偏好。尽管通常共识是代码应该尽可能简洁（在这种情况下，应优选最后一个版本），但此类决策始终基于效率、易用性和可读性之间的便利性折中。\n\
  \n上面的示例展示了相对定位的真正威力所在：VR 开发者可以将相机锁定在某个物体上，而无需知道它在任何时刻可能处于何处。这在对象在运行时 3D 世界中以随机生成的位置和方向移动的情况下尤为重要。在这些情况下，人们无法在编写代码时知道对象的位置。\n\
  \n一旦建立了对象之间的关系，就可以在设计阶段和运行时通过修改极少的数值来移动 3D 世界中的元素。例如，只需通过更改相机定位命令中从 `jane` 的 z 轴位置上减去的数字，就可以轻松修改相机与\
  \ `jane` 的相对距离：\n\n```\nviz.MainView.setPosition(jane.getPosition()[0], 0, jane.getPosition()[2]\
  \ -11)\n```\n\n同样，在脚本首次定义 `jane` 位置时更改 x 轴和 z 轴的坐标值，不会影响她与相机的相对距离。在特殊情况下这非常方便，因为在\
  \ `jane` 定位期间将 z 轴坐标再次更改为 `8`：\n\n```\njane.setPosition([0, 0, 8])\n```\n\n将把她移回喷泉，同时相机将自动放置在中心点后方三个单位处（即\
  \ `8−11 = -3`）。这将为下一节中将创建的新对象留出足够的空间。\n\n以下是本节开发的完整脚本版本：\n\n```\n1   # 导入 viz 库\n\
  2   import viz\n3\n4   # 为 3D 环境创建一个空窗口\n5   viz.go(viz.FULLSCREEN)\n6\n7   # 添加广场的\
  \ 3D 模型并启用碰撞检测\n8   piazza = viz.add('piazza.osgb')\n9   viz.MainView.collision(viz.ON)\n\
  10\n11  # 创建植物对象和 Jane\n12  plant = viz.add('plant.osgb')\n13  jane = viz.add('vcc_female.cfg')\n\
  14\n15  # 设置 3D 对象和相机的位置与朝向\n16  jane.setPosition([0, 0, 8])\n17  jane.setEuler([180,\
  \ 0, 0])\n18  plant.setPosition([-3, 0, jane.getPosition()[2] + 3])\n19  viz.MainView.setPosition(jane.getPosition()[0],\
  \ 0,\n20  jane.getPosition()[2] - 11)\n```\n\n## 12.11 通过列表创建和定位多个对象\n\n假设读者熟悉基础的编程\
  \ `for` 循环结构。如果读者以前没有接触过 Python 循环的使用，第 2 章 详细介绍了这一主题。\n\n在最基础的形式中，`for` 循环按指定的次数重复执行任务。例如，以下语句：\n\
  \n```\nfor i in range(5):\n    print('Iteration no.', i)\n```\n\n将在运行时打印 `for` 循环经过的迭代次数。`range`\
  \ 关键字仅仅是告诉 `for` 循环执行五次迭代（从 `0` 开始）。对于 3D 对象，`for` 循环可以用于它们的实例化和定位。例如，以下语句：\n\n\
  ```\nfor i in range(5):\n    pigeon = viz.add('pigeon.cfg')\n    pigeon.setPosition([i,\
  \ 0, 0])\n```\n\n将创建五只鸽子，并将它们沿着地图中心点在 x 轴上每隔一个单位放置一个。请注意，一旦 3D 世界实例化，鸽子将出现在相对于相机的右侧。上述示例使用的\
  \ `pigeon.cfg` 形象带有 Vizard 的标准安装附带，这与用于 `jane` 的 `vcc_female.cfg` 女性角色类似。\n\n虽然使用\
