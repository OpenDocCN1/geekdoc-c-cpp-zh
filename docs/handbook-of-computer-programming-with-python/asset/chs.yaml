  \ NaN 值\n\n通常情况下，空单元或带有 NaN 值的单元格会被预定义值或根据其余数据计算出的值填充。在这种情况下，与其使用 `dropna()` 方法（其任何形式），可以使用\
  \ `fillna(<value>, [inplace = true])` 方法。该方法的通用语法如下：\n\n```\n<name of new Data Frame>\
  \ = <name of original Data Frame>.fillna(value[,\nhow = 'all'] [, inplace = True])\n\
  <name of new Data Frame> = <name of original Data Frame>.fillna(value[,\nhow = 'any']\
  \ [, inplace = True])\n```\n\n`value` 可以在运行脚本之前根据现有的数据集值和/或其他计算进行定义（例如，使用相同列中现有数据的*平均值*）。如果\
  \ `inplace` 参数设置为 `true`，则将永久更改数据集中的数据。虽然也可以使用 `false` 值，但这没有太大意义，因为它是 `inplace`\
  \ *未被使用* 时的默认值。\n\n以下脚本及其输出演示了 `fillna()` 方法的使用，同时应用了 `inplace` 参数来实现数据的永久更改。修改空值或缺失值的默认值为零。读者应该注意，`inplace`\
  \ 参数只影响脚本执行产生的数据，而不影响数据源：\n\n```\n1   import pandas as pd\n2   dataset = pd.read_excel('Grades.xlsx',\
  \ sheet_name = \"Grades 2020\")\n3   dataset.fillna(0, inplace = True)\n4   dataset\n\
