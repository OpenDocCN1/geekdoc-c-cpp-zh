  \n\n\n\n本示例中应用程序的使用方式与第 4 章中介绍的原始实现相比有两个主要区别。第一是，在两种情况下，应用程序都被转换为完全过程化的格式，充分利用方法来\
  \ get 所有所需的功能，且没有在程序主体中添加任何语句。第二是，`Speed Control`应用程序经过了某种简化，删除了与`Scale`和`Spinbox`控件及其相应标签相关的控制变量，以避免各种方法之间可能出现的引用问题。\n\
  \n### 5.4.2 多线程应用程序\n\n程序设计中最重要的概念之一，甚至可以说是创建现实应用的最有效工具之一，就是线程（`threads`）和多线程（`threading.`）。线程线程背后的思想非常直观：应用程序的多个实例可以作为独立的进程运行。概念化线程的一种方法是将它们看作`同一类的不同对象`。事实上，这是一个相当准确的描述，额外的元素是利用了操作系统的不同进程。多线程应用程序的主要特征之一是它们旨在`并行（in\
  \ parallel）` 运行。在现实中，即使是使用多核（`multi-core`）计算机系统，这并非完全可行，但这是一种非常专业的计算机架构考虑，超出了本书的范围。\n\
  \n在接下来的示例中，将第 4 章中的`SpeedControl`应用程序转换为类，以便演示线程的实现。该脚本创建了`SpeedControl`类的两个对象，并在两个不同的线程上分别运行它们：\n\
