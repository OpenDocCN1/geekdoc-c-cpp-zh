  \        print(\"显示属性时出错\")\n\n# 根据表选择更新属性\ndef runQuery():\n    global cursor,\
  \ textVar, tables, columns\n    global tablesCombo, columnsCombo, resultsFrame\n\
  \    global columnName, columnType, minCondScale, maxCondScale\n    global minCond,\
  \ maxCond, minValue, maxValue, tableName\n    # 清空结果框架\n    if (resultsFrame !=\
  \ None):\n        resultsFrame.destroy()\n\n    # 准备查询\n    selectedIndex = columnsCombo.current()\n\
  \    if (radioButton.get() == 1):\n        sqlStatement = \"SELECT * FROM \" + str(tableName.get())\
