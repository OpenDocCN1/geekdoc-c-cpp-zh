  \    global minCond, maxCond, minValue, maxValue, tableName\n    try:\n        #\
  \ 显示选定的表\n        if (str(tableName.get())) != \"\":\n            sqlString = \"\
  SELECT * FROM \" + str(tableName.get())\n            cursor.execute(sqlString)\n\
