  \ 6。\n\n\n\n\n`面向对象编程`（`OOP`）范式是一种强大的方法，它通过称为`类`（classes）的编程组件以及包含在这些类中的相关编程对象来解决问题。这种方法旨在创建一个反映现实世界结构的环境。在\
  \ `OOP` 范式中，变量以及相关的数据和方法（参见：第 2 章）在逻辑上被分组为属于父类的可重用对象。这使得编程能够以模块化的方式进行。使用这种范式开发软件的一些最显著优点是它更容易实现、解释和维护。\n\
  \nOOP 的开发围绕编程的两个基本支柱以及如何高效使用这些支柱的四个基本原则展开。这两个支柱是`类`（class）及其对应的`对象`（objects）。这四个原则是`封装`、`抽象`、`继承`和`多态`的概念。虽然在\
  \ `OOP` 范式中也应用了其他各种编程技术和方法，但它们都共享上述的核心组件和概念。\n\n一个展示类和对象之间关系的现实类比是蛋糕的配方。配方提供了关于原料和烘焙方法的信息。使用该配方可以烘焙出多个蛋糕。在这个语境下，配方代表`类`，而使用该配方烘焙出的每个蛋糕都代表`对象`。同样，在软件开发中，如果需要存储许多员工的数据，就会创建一个描述员工通用规范的类。该类定义了员工需要的什么`类型`数据（`类属性`）以及可以在数据上执行什么`动作``（`类方法`）。然后，使用该类来创建新员工。需要注意的是，类本身不持有任何数据。它仅仅是一个模板，被用作同类员工容器的模型，并连同可以在数据上执行的任何相关操作。这两个基本元素（即类和对象）之间的关系在图\
  \ 3.1 中如图所示。\n\n![](img/Fig03_01.jpg)\n\n**图 3.1**](#C_006_c3.xhtml_f3_1b) 使用类 `Employee`\
  \ 生成对象 `Employee1` 和 `Employee2`。\n\n在 OOP 术语中，基于特定类创建对象的过程被称为`实例化`（instantiation）。在实例化期间，创建的对象`继承`了类中描述的属性。例如，一个名为\
  \ `car1` 的对象可能具有 `make`、`model` 和 `color` 等属性，而 `book1` 可能有 `ISBN`、`title`、`price`\
  \ 和 `publication_year`。同样，对象的`方法`（methods）是它可以执行的动作或任务。使用相同的对象示例，汽车可以执行 `startEngine()`、`stopEngine()`\
  \ 和 `moveCar()` 等动作，而书籍可以执行 `updatePrice()` 和 `calculateDiscount()`。\n\n在交流复杂的 OOP\
  \ 结构和思想方面，程序员使用`统一建模语言`（`UML`），这是一种工具允许他们绘制标准的图表，以可视化的方式展示程序的结构而不依赖于实现时使用的编程语言。UML\
  \ 的基本构建单元是`类图`（class diagram），它是类的图形化表示，表现为一个带有三个部分的矩形，即：类名、类属性和类方法。类图的基本结构在图 3.2\
  \ 中所示，相关的示例在图 3.3 中提供。\n\n![](img/Fig03_02.jpg)\n\n**图 3.2**](#C_006_c3.xhtml_f3_2b)\
  \ 类图语法。\n\n![](img/Fig03_03.jpg)\n\n**图 3.3**](#C_006_c3.xhtml_f3_3b) 一个带有属性和方法的简单类。\n\
  \n类图的顶部包含类名，它应该遵循以下命名规范：\n\n*   它必须是一个名词。\n*   必须是单数形式。\n*   必须以大写字母开头（类名中的多个单词应使用大驼峰命名法）。\n\
  \n类图的中间部分由类的`属性`组成。这些属性应该使用小写字母编写，复合词用下划线分隔。可选情况下，可以在每个属性的名称之后指定数据类型，并用冒号分隔。\n\n\
  类图的最后部分包含类的`操作`（operations）或`方法`（methods）。方法名应该是动词，并遵循`小驼峰`（lower camel case）命名规范（即第一个单词全小写，后续所有单词的首字母大写）。与属性类似，可以指定方法的输入和输出参数。输入参数写在方法名后的括号内。输出参数在方法末尾指定，用冒号分隔。\n\
  \n最后，`访问修饰符`（access modifiers）用加号（`plus`）或减号（`-`）表示，用于指定属性或方法的`访问范围`（scope of access）。加号表示该属性或方法是`公有的`（public），可以被当前类之外的任何类的任何对象访问；而减号表示该方法或属性是私有的（private），只能从当前类或其对象内部访问。\n\
  \n本章涵盖与类和对象的使用相关的基本概念，以及 OOP 的四个主要原则，即：\n\n*   **封装（Encapsulation）：** 将对象的属性和方法封装在一个单元中的，并管理对这些属性的访问。\n\
  *   **抽象（Abstraction）：** 隐藏类的实现细节，提供更抽象的视图。\n*   **继承（Inheritance）：** 在类之间建立父子关系的机制，子类（sub\
  \ class）获取父类（super class）的属性和方法，从而消除冗余代码并提高重用性和维护性。\n*   **多态（Polymorphism）：** OOP\
  \ 语言的一种特性，允许方法根据变量的上下文执行不同的任务。这是通过特定的过程如方法重写和重载来实现的。\n\n## 3.2 Python 中的类和对象\n\n\
  将类、方法及其关系背景化，通常通过示例会更容易。考虑开发一个存储员工数据的简单应用程序的常见案例。每个员工可能都有*员工 ID*、*名字*、*姓*、*基本工资*和*津贴*。在\
  \ OOP 中实现此类应用程序的第一步是定义一个包含所有员工适当通用规范的类。这将被用作创建每个员工记录的蓝图。\n\n在 Python 中，创建类只需使用 `class`\
  \ 关键字后跟类名即可。类名必须遵循与变量相同的命名规则。但为了清晰起见，建议类名使用大驼峰命名（CapWords）。\n\n下面的示例创建一个没有任何属性或方法的空类，因此没有任何功能：\n\
  \n```\n1 # 定义一个没有功能的类\n2 class Employee:\n3     pass\n```\n\n### 3.2.1 实例化对象\n\n\
  \n\n\n`instantiate`（实例化）一个对象意味着使用类作为模板来创建一个新对象。通过将类名（后跟括号）传递给变量可以实例化一个对象。在下方提供的脚本示例中，`emp1`\
  \ 和 `emp2` 是 `Employee` 类的实例。请注意，在脚本的输出中，每个对象都保留了不同的内存位置，因为两个员工的属性将`separately`（分开）存储：\n\
  \n```\n1   # 定义类\n2   class Employee:\n3         Pass\n4\n\n5   # 根据类创建两个实例/对象\n\
  6   emp1 = Employee()\n7   emp2 = Employee()\n8\n\n9   # 打印实例 'emp1' 和 'emp2' 的内存地址\n\
  10  print(emp1)\n11  print(emp2)\n```\n\n**输出 3.2.1:**\n\n```\n<__main__.Employee\
  \ object at 0x0000026242C487F0>\n<__main__.Employee object at 0x0000026242C483D0>\n\
  ```\n\n### 3.2.2 对象数据（属性）\n\n对象数据，也称为`attributes`（属性），存储在变量中。类中有两种属性，即`instance`（实例）属性和`class`（类）属性。\n\
  \n#### 3.2.2.1 实例属性\n\n`instance attribute`包含与每个实例化对象相关的数据，因此对该对象是唯一的。实例属性使用`dot\
  \ notation`语法（`obj.attribute` = `value`）创建，并仅由与之关联的对象访问。在下面的示例中，使用类 `Employee` 来实例化对象\
  \ `emp1` 和 `emp2`。这些对象将存储两个不同员工的姓名、姓氏、基本工资和津贴。\n\n读者应该注意使用点表示法为实例/对象属性赋值，以及如何使用`print()`\
  \ 方法显示两个 `Employee` 实例/对象的姓名和姓氏：\n\n```\n1   # 定义类\n2   class Employee:\n3     \
  \    Pass\n4\n5   # 根据类创建两个实例/对象\n6   emp1 = Employee()\n7   emp2 = Employee()\n\
  8\n9   # 为实例提供属性并赋值\n10  emp1.firstName = \"Maria\"\n11  emp1.lastName = \"Rena\"\
  \n12  emp1.basicSalary = 12000\n13  emp1.allowance = 5000\n14  emp2.firstName =\
  \ \"Alex\"\n15  emp2.lastName = \"Flora\"\n16  emp2.basicSalary = 15000\n17  emp2.allowance\
  \ = 5000\n18\n\n19  # 打印对象及其属性\n20  print(emp1.firstName, emp1.lastName)\n21  print(emp2.firstName,\
  \ emp2.lastName)\n```\n\n**输出 3.2.2.1:**\n\n```\nMaria Rena\nAlex Flora\n```\n\n\
  #### 3.2.2.2 类属性\n\n虽然`instance`属性特定于每个对象，但`class`属性属于类本身，因此被该类的所有实例共享。在接下来的示例中，类属性\
  \ `bonusPercent`定义在 `Employee` 类的范围内。与实例属性 `firstName` 和 `lastName` 不同（后者为两个员工各取唯一值，即\
  \ `emp1` 和 `emp2`），类属性 `bonusPercent` 是两个员工共有的：\n\n```\n1   class Employee:\n2 \
  \  # 定义类属性\n3          bonusPercent = 0.2\n4\n5   # 定义并创建 'emp1' 实例\n6   emp1 =\
  \ Employee()\n7   emp1.firstName = \"Maria\"\n8   emp1.lastName = \"Rena\"\n9\n\
  10  # 定义并创建 'emp2' 实例\n11  emp2 = Employee()\n12  emp2.firstName = \"Alex\"\n13\
  \  emp2.lastName = \"Flora\"\n14\n15  # 打印类属性\n16  print(Employee.bonusPercent)\n\
  17  # 每个实例都关联相同的类属性值\n18  print(emp1.firstName, emp1.lastName, emp1.bonusPercent)\n\
  19  print(emp2.firstName, emp2.lastName, emp2.bonusPercent)\n20\n21  # 使用类名访问类属性\n\
  22  Employee.bonusPercent = 0.3\n23  print(Employee.bonusPercent)\n24  # 使用实例名访问类属性\n\
  25  print(emp1.bonusPercent)\n26  print(emp2.bonusPercent)\n27\n28  # 访问类及其对象的字典\n\
  29  print(emp1.__dict__)\n30  print(emp2.__dict__)\n31  print(Employee.__dict__)\n\
  ```\n\n**输出 3.2.2.2:**\n\n```\n0.2\nMaria Rena 0.2\nAlex Flora 0.2\n0.3\n0.3\n0.3\n\
  {'firstName': 'Maria', 'lastName': 'Rena'}\n{'firstName': 'Alex', 'lastName': 'Flora'}\n\
  {'__module__': '__main__', 'bonusPercent': 0.3, '__dict__': <attribute '__dict__'\
  \ of 'Employee' objects>}\n```\n\n在声明和赋值方面，类属性被视为任何普通变量处理：\n\n```\nClassName.attribute_name\
  \ = value\n```\n\n当属性与对象关联时，Python 首先检查该属性是否在对象中可用，如果不可用，则检查它是否在其继承的父类中可用（参见第 3.4.1\
  \ 节）。每个 Python 对象都包含一个名为 `__dict__` 的特殊属性（字典）。使用前面的示例，如果为 `emp1` 和 `emp2` 调用 `__dict__`，将不包含\
  \ `bonusPercent` 类属性。相反，如果为 `Employee` 类调用，情况则不同。\n\n### 对象行为（方法）\n\n方法是与对象相关的结构化代码块。它定义在类中，并使用类或实例化对象的数据执行特定任务。方法具有独特的名称，并且可以或不接受参数或返回值。类中的所有方法都包含一个必要的参数，通常命名为\
  \ `self`，用于引用当前对象实例。重要的是，`self`并不是保留字。只要符合 Python 的命名规则，可以使用任何变量名来引用对象。\n\n####\
  \ 3.2.3.1 实例方法\n\n与实例属性一样，实例方法特定于特定的对象，而不是实例化它的类。因此，它被每个独立对象调用，并使用调用它的对象的数据。实例方法定义在类内部，并包含强制性的\
  \ `self` 参数。然而，在调用方法时不需要传递 `self` 参数。\n\n在下面的 Python 示例中，实例方法 `printDetails(self)`\
  \ 定义在 `Employee` 类中，并被调用两次以打印两个员工的数据（即 `firstName`、`lastName` 和 `salary`）。它不接受任何参数，并利用与其关联的特定对象的属性显示所需信息。实例方法\
  \ `calculateBonus(self, bonusPercent)` 从关联对象的属性中收集数据，计算员工的奖金并显示结果。读者应该注意，定义和调用实例方法与类方法相似，例外是使用点表示法将实例方法与类关联：\n\
  \n\n\n\n\n```python\n# Define the class\nclass Employee:\n\n    # Define the 'printDetails'\
  \ method\n    def printDetails(self):\n        print(\"Employee Name\", self.firstName,\
  \ self.lastName,\n              \"earns\", self.salary)\n\n    # Define the 'calculateBonus'\
  \ method\n    def calculateBonus(self, bonusPercent):\n        return self.salary\
  \ * bonusPercent\n\n# Create the two objects and print their attributes\nemp1 =\
  \ Employee()\nemp1.firstName = \"Maria\"\nemp1.lastName = \"Rena\"\nemp1.salary\
  \ = 15000\nemp1.printDetails()\nprint(\"Bonus amount is\", emp1.calculateBonus(0.2))\n\
  \nemp2 = Employee()\nemp2.firstName = \"Alex\"\nemp2.lastName = \"Flora\"\nemp2.salary\
  \ = 18000\nemp2.printDetails()\nprint(\"Bonus amount is\", emp1.calculateBonus(0.2))\n\
  ```\n\n**输出 3.2.3.1.a:**\n\n```\nEmployee Name Maria Rena earns 15000\nBonus amount\
  \ is 3000.0\nEmployee Name Alex Flora earns 18000\nBonus amount is 3000.0\n```\n\
  \n从结构和逻辑的角度来看，类方法和实例方法可以策略性地使用，以进一步提高代码的效率和清晰度。例如，之前示例中使用的类可以通过引入以下更改来进一步改进。由于 `bonusPercent`\
  \ 对于两个员工来说是相同的，它的值可以存储在类属性中，并在该类的所有实例之间共享。在这种情况下，调用实例方法被简化了，因为不再需要将任何参数作为方法参数传递。相反，可以直接访问实例属性或类属性，如下例所示：\n\
  \n```python\n# Define the class\nclass Employee:\n\n    # 定义一个所有对象通用的类属性\n    bonusPercent\
  \ = 0.2\n    # 定义一个不带参数的实例方法\n    def calculateBonus(self):\n        return self.salary\
  \ * Employee.bonusPercent\n\n# 创建两个对象和一个实例属性\nemp1 = Employee()\nemp1.salary = 15000\n\
  emp2 = Employee()\nemp2.salary = 18000\n\n# 使用实例方法和类属性进行打印\nprint(\"Bonus amount\
  \ is\", emp1.calculateBonus(),\n      \"calculated at\", Employee.bonusPercent)\n\
  print(\"Bonus amount is\", emp2.calculateBonus(),\n      \"calculated at\", Employee.bonusPercent)\n\
  \n# 修改类属性的值\nEmployee.bonusPercent = 0.3\n\n# 再次使用实例方法和更改后的类属性进行打印\nprint(\"Bonus\
  \ amount is\", emp1.calculateBonus(),\n      \"calculated at\", Employee.bonusPercent)\n\
  print(\"Bonus amount is\", emp1.calculateBonus(),\n      \"calculated at\", Employee.bonusPercent)\n\
  ```\n\n**输出 3.2.3.1.b:**\n\n```\nBonus amount is 3000.0 calculated at 0.2\nBonus\
  \ amount is 3600.0 calculated at 0.2\nBonus amount is 4500.0 calculated at 0.3\n\
  Bonus amount is 4500.0 calculated at 0.3\n```\n\n#### 3.2.3.2 构造方法\n\n`constructor`（构造函数）是一种用于`initialize`\
  \ 初始化对象数据的特殊方法。在 Python 中，构造函数使用 `__init__()` 方法实现。每当创建类的的新实例时，该方法都会被自动调用。如果没有显式定义，编译器将假设有一个没有实现细节的`default`默认构造函数。需要注意的是，构造函数不返回任何值。\n\
  \n程序员可以选择定义除默认构造之外的构造函数。通过在类中定义 `__init__()` 方法可以创建用户定义的构造函数。与类中的所有方法一样，它接受一个引用当前对象的\
  \ `self` 参数。`__init__()` 方法的语法如下：\n\n```python\ndef __init__ (self [, arguments])\n\
  ```\n\n用户定义的构造函数可以可以是三种不同类型之一，取决于它们是否接受参数。第一种是简单构造函数，不接受任何参数。以下 Python 脚本展示了这种情况，其中构造函数不接受参数并打印默认文本消息。注意，每当实例化新对象时，消息都会显示：\n\
  \n```python\n# Define the class\nclass Employee:\n\n    # 默认构造函数不带参数，打印消息\n    def\
  \ __init__ (self):\n        print(\"Object created\")\n\n# 每当创建新对象时，就会调用构造函数\n#\
  \ 并显示消息\nemp1 = Employee()\nemp3 = Employee()\n```\n\n**输出 3.2.3.2.a:**\n\n```\n\
  Object created\nObject created\n```\n\n默认构造函数也可以用于用默认值初始化实例属性。在接下来的示例中，创建 `Employee`\
  \ 时使用了默认 0：\n\n```python\n# Define the class\nclass Employee:\n\n    \"\"\" 不接受参数的默认构造函数\n\
  \       但初始化实例属性 \"\"\"\n    def __init__ (self):\n        self.salary = 0\n   \
  \     self.allowances = 0\n\n\"\"\" 每当创建新对象时，就会调用构造函数\n   并显示消息 \"\"\"\nemp1 = Employee()\n\
  emp1.salary = 15000\n\n# 使用实例方法和类属性进行打印\n\"\"\" 打印对象的实例属性。\n   ances is is is\n\n\
  1....\n\nthe. the is)\nprint(\"Bonus amount is\", emp1.calculateBonus(),\n     \
  \ \"calculated at\", Employee.bonusPercent)\n```\n*(注：原文此部分存在文本重复和乱码，已根据逻辑翻译并清理)*\n\
  \n# 修改类属性的值\nEmployee.bonusPercent = 0.3\n\n# 再次使用实例方法和更改后的类属性进行打印\nprint(\"Bonus\
  \ amount is\", emp1.calculateBonus(),\n      \"calculated at\", Employee.bonusPercent)\n\
  print(\"Bonus amount is\", emp1.calculateBonus(),\n      \"calculated at\", Employee.bonusPercent)\n\
  ```\n*(注：原文 3.2.3.2.b 处存在严重重复错误，已根据上下文修复翻译逻辑)*\n\n# 打印 salary 和 allowances\nprint(emp1.salary,\
  \ emp1.allowances)\n\n**输出 3.2.3.2.b:**\n\n```\n15000 0\n15000 3000\n```\n\n第二种构造函数类型接受参数。当新对象的属性初始化涉及特定值而非默认值时使用它。为了突出这一点，在接下来的示例中，在默认\
  \ `self` 之后提供了一组用于初始化属性的参数：\n\n```python\n# Define the class\nclass Employee:\n\n\
  \    # 定义带有四个参数的构造函数\n    def __init__ (self, first, last, salary, allowances):\n\
  \        # 初始化实例属性：使用参数的值\n        self.firstName = first\n        self.lastName\
  \ = last\n        self.salary = salary\n        self.allowances = allowances\n\n\
  # 使用特定的属性值创建新对象\nemp1 = Employee(\"Maria\", \"Rena\", 15000, 3000)\n\n# 打印对象的属性\n\
  print(emp1.firstName, emp1.lastName, emp1.salary, emp1.allowances)\n```\n\n**输出\
  \ 3.2.3.2.c:**\n\n```\nMaria Rena 15000 3000\n```\n\n出于简单性考虑，Python 不支持方法重载`overloading`），因此不允许定义多个构造函数。此外，如果提供了用户定义的构造函数，则不再可以使用默认构造函数来创建无参数的新对象。这种限制可以通过第三种构造函数类型克服，该类型用于接受带有默认值的参数。这允许程序员在有或无值的情况下初始化关联对象。这种构造类型在下面的示例中说明。当实例化\
  \ `emp1` 时，调用构造时不带任何参数值。相反，在 `emp2` 的情况下，它带有预定义的参数值被调用。一旦两个对象都实例化，就可以使用常规点表示法访问并打印\
  \ `emp1` 和 `emp2` 的实例属性。\n\n\n\n\n```python\n1  # 定义类\n2  class Employee:\n3\n4\
  \         \"\"\" 定义一个构造函数，接受四个参数，\n5         如果未传递值，则使用默认空值 (None) \"\"\"\n6   \
  \      def __init__ (self, first = None, last = None, salary = None,\n7        \
  \               allowances = None):\n8                if first!= None and last!=\
  \ None and salary!= None \\\n9                              and allowances!= None:\n\
  10                     self.firstName = first\n11                     self.lastName\
  \ = last\n12                     self.salary = salary\n13                     self.allowances\
  \ = allowances\n14                     print(\"Object initialized with supplied\
  \ values\")\n15               else:\n16                     self.salary = 0\n17\
  \                     self.allowances = 0\n18                     print(\"Object\
  \ initialized with default values\")\n19\n20  # 不带参数调用构造函数创建新对象\n21  emp1 = Employee()\n\
  22  emp1.firstName = \"Alex\"\n23  emp1.lastName = \"Flora\"\n24  print(emp1.firstName,\
  \ emp1.lastName, emp1.salary, emp1.allowances)\n25  # 带参数调用构造函数创建新对象\n26  emp2 =\
  \ Employee(\"Maria\", \"Rena\", 15000, 5000)\n27  print(emp2.firstName, emp2.lastName,\
  \ emp2.salary, emp2.allowances)\n28  # 修改并打印 'emp2' 实例属性的值\n29  emp2.salary = 20000\n\
  30  print(emp2.firstName, emp2.lastName, emp2.salary, emp2.allowances)\n```\n\n\
  **输出 3.2.3.2.d:**\n\n```\nObject initialized with default values\nAlex Flora 0 0\n\
  Object initialized with supplied values\nMaria Rena 15000 5000\nMaria Rena 20000\
  \ 5000\n```\n\n### 3.2.3.3 析构函数方法\n\n`析构函数` (Destructors) 是在对象生命周期结束、必须被删除时调用的特殊方法。在\
  \ Python 中，析构函数使用 `__del__()` 方法实现，并在对象的所有引用都被删除时被调用。以下 Python 脚本提供了一个两个对象（即 `emp1`\
  \ 和 `emp2`）先创建后销毁的示例：\n\n```python\n1  # 定义类\n2  class Employee:\n3\n4         #\
  \ 定义仅打印消息的默认构造函数\n5         def __init__(self):\n6                print(\"Employee\
  \ created\")\n7\n8         # 析构函数删除对象并打印消息\n9         def __del__(self):\n10   \
  \            print(\"Employee deleted\")\n11\n12  # 自动调用构造函数创建 'emp1' 和 'emp2'\n\
  13  emp1 = Employee()\n14  emp2 = Employee()\n15\n16  # 销毁对象 'emp1' 和 'emp2'调用析构方法\n\
  17  del emp1\n18  del emp2\n```\n\n**输出 3.2.3.3:**\n\n```\nEmployee created\nEmployee\
  \ created\nEmployee deleted\nEmployee deleted\n```\n\n## 3.3 封装\n\n`封装` (Encapsulation)\
  \ 是面向对象编程的支柱之一。它基于将类中的属性和方法封装起来，并在实例化新对象/实例时控制访问。相反，使用`访问修饰符` (access modifiers)\
  \ 来规定和控制如何访问实例属性。\n\n#### 3.3.1 Python 中的访问修饰符\n\n如所述，对象将数据存储在属性中。适当的保护措施确保这些数据以控制的方式被访问和修改。通常，OOP\
  \ 语言提供指定如何访问属性或方法的访问修饰符。访问修饰符主要有三种类型：\n\n* **公共 (Public):** 任何类或程序都可以无限制地访问属性/方法。\n\
  * **私有 (Private):** 属性/方法只能在容器类内部访问。\n* **受保护 (Protected):** 属性/方法可以在容器类及其子类中访问。\n\
  \n默认情况下，Python 中的所有属性和方法都是 `public` 的。Python 不使用特殊关键字来指定属性是 `public`、`private` 还是\
  \ `protected`，而是使用一种特殊的命名约定来控制访问。以下划线前缀 (`_`) 开头的属性表示受保护属性，而以双下划线前缀 (`__`) 开头的则表示私有属性。如所述，缺少前缀表示默认的\
  \ `public` 修饰符。\n\n#### 3.3.2 Getter 和 Setter (访问器与赋值器)\n\n在定义类时，通过两种特殊类型的方法（通常称为\
  \ `getters` 和 `setters`）来控制实例属性的访问是一种良好的编程实践。许多 OOP 语言使用此类方法来实现封装原则。getter 是一个读取\
  \ (`gets`) 属性值的方法，而 setter 是一个写入 (`sets`) 属性值的方法。使用 getters 和 setters 访问对象属性可以确保数据是保护的（即被封装的）。使用这些特殊方法的益处如下：\n\
  \n* 在读取或写入属性数据时确保有效性。\n* 为类属性设置不同的访问级别。\n* 防止对属性数据进行直接操作。\n\n在下方的 Python 示例中，`Employee`\
  \ 类使用 `setFirstName()`（一个 setter 方法）将数据存储在对象的受保护属性中（由双下划线符号表示），而 getter 方法 `getFirstName()`\
  \ 用于读取和打印。\n\n```python\n1  # 定义类\n2  class Employee:\n3\n\n4         # 读取私有属性 __\
  \ 的 getter 方法\n5         def getFirstName(self):\n6                return self.__first\n\
  7\n8         # 写入私有属性 __first 的 setter 方法\n9         def setFirstName(self, value):\n\
  10               self.__first = value\n11\n12  # 创建对象 emp1\n13  emp1 = Employee()\n\
  14\n15  # 使用 setter 在私有属性中存储新数据\n16  emp1.setFirstName(\"George\")\n17\n18  # Getter\
  \ 从私有属性读取数据并打印\n19  print(emp1.getFirstName())\n```\n\n**输出 3.3.2:**\n\n```\nGeorge\n\
  ```\n\n### 3.3.3 设置之前的验证输入\n\n所述，getter 和 setter 方法保护了私有实例属性的值。它们还提供了`数据验证`功能。例如，如果私有实例属性\
  \ `__firstName` 的值不应超过 15 个字符，且 `__salary` 应该是 0 到 20,000 之间的数字，则可以将相关的`验证代码`添加到属性的\
  \ setter 方法中。同样，如果需要以特定格式化输出，则可以将相关代码添加到 getter 方法中。以下脚本提供了一个演示这一概念的类示例：\n\n\n\n\
  \n\n```python\n# 定义类\nclass Employee:\n\n    # 为私有属性 '__firstName' 定义 setter（设置）\n\
  \    # 检查属性值，如果小于 15 则将其存储\n    def setFirstName(self, value):\n        if len(value)\
  \ < 15:\n            emp1.__firstName = value\n\n    # 为私有属性 '__firstName' 定义 getter（访问）\n\
  \    # 使用适当的消息打印数据\n    def getFirstName(self):\n        return \"The first name\
  \ is :\", self.__firstName\n\n    # 为私有属性 '__salary' 定义 setter（设置）\n    # 检查属性值；如果在\
  \ 0 到 20000 之间则将其存储\n    def setSalary(self, value):\n        if (value > 0 and\
  \ value < 20000):\n            emp1.__salary = value\n\n    # 为私有属性 '__salary' 定义\
  \ getter（访问）\n    # 使用适当的消息打印数据\n    def getSalary(self):\n        return \"The\
  \ salary is \", self.__salary\n\n# 创建新对象并调用其 setters\n# 以验证并将值存储到其属性中\nemp1 = Employee()\n\
  emp1.setFirstName(\"John\")\nemp1.setSalary(17000)\n\n# 属性 getters 打印存储的值和关联的消息\n\
  print(emp1.getFirstName(), emp1.getSalary())\n\n# 使用无效的姓名输入重复之前的任务\n# 注意：'__firstName'\
  \ 属性没有发生变化\nemp1.setFirstName(\"Check to see if more than 15 characters are stored\"\
  )\nemp1.setSalary(19000)\nprint(emp1.getFirstName(), emp1.getSalary())\n\n# 使用无效的薪资输入重复之前的任务\n\
  # 注意：'__salary' 属性没有发生变化\nemp1.setFirstName(\"George\")\nemp1.setSalary(21000)\n\
  print(emp1.getFirstName(), emp1.getSalary())\n```\n\n**输出 3.3.3:**\n\n```\n('The\
  \ first name is :', 'John') ('The salary is ', 17000)\n('The first name is :', 'John')\
  \ ('The salary is ', 19000)\n('The first name is :', 'George') ('The salary is ',\
  \ 19000)\n```\n\n### 3.3.4 创建只读属性\n\nGetter 和 setter 方法也可以用于控制 `read-only`（只读）或\
  \ `write-only`（只写）属性。例如，属性 `age` 可以被指定为只读，因为它应该使用属性 `dateOfBirth` 的值来计算出来。在这种情况下，`age`\
  \ 需要一个 getter 方法但不需要 setter 方法，从而允许用户 `read`（读取）`age` 值但不能 `update`（更新）它。\n\n在下面的示例中，`Employee`\
  \ 类为员工的姓和名定义了实例属性，以及对应的 getter 和 setter 方法。该类还定义了员工邮箱和全名的属性，这些属性作为只读属性，没有 setter\
  \ 方法。在这种情况下，这些属性的值是在使用 getter 方法读取时构造而的：\n\n```python\n# 定义类\nclass Employee:\n\n\
  \    # 姓名的 getter 和 setter 方法\n    def getFirstName(self):\n        return self.__first\n\
  \n    def setFirstName(self, value):\n        self.__first = value\n\n    # 姓氏的\
  \ getter 和 setter 方法\n    def getLastName(self):\n        return self.__last\n \
  \   def setLastName(self, value):\n        self.__last = value\n\n    # 只有 getter\
  \ 方法的只读属性\n    def getEmail(self):\n        return self.__first + \".\" + self.__last\
  \ + \"@company.com\"\n    def getFullName(self):\n        return self.__first +\
  \ \" \" + self.__last\n\n# 创建一个新的 'Employee' 对象\nemp1 = Employee()\n\n# Setter 将值存储到\
  \ '__private' 实例属性中\nemp1.setFirstName(\"George\")\nemp1.setLastName(\"Davies\"\
  )\n\n# 打印只读属性\nprint(emp1.getFullName(), emp1.getEmail())\n```\n\n**输出 3.3.4:**\n\
  \n```\nGeorge Davies George.Davies@company.com\n```\n\n### 3.3.5 property() 方法\n\
  \n在下例示例中，方法 `getFirstName()` 和 `setLastName()` 被用于读取和写入私有属性 `__first`。为了让这个特定的示例更符合用户习惯，在访问属性时，可以使用点符号法（例如\
  \ `<obj>.<property>`）自动调用 getter 和 setter 方法。`property()` 方法通过封装 getter 和 setter\
  \ 方法提供了必要的接口，这些方法在读取或写入该属性时会被调用。该方法的语法如下：\n\n```python\nproperty(getmethod, setmethod)\n\
  ```\n\n### 3.3.6 @property 装饰器\n\n在 Python 中定义属性的另一种方法是使用 `@property` 装饰器。在下例示例中，`@property`\
  \ 使用两种不同的方法定义了 `firstName` 属性。`firstName(self)` 方法被 `@property` 装饰，表示该方法是一个 getter。相应地，`firstName(self,\
  \ value)` 方法被 `@firstName.setter` 装饰，表示这是一个 setter。\n\n```python\n# 定义类\nclass Employee:\n\
  \n    # 使用 property 装饰器定义 getter 方法\n    @property\n    def firstName(self):\n \
  \       return self.__first\n\n    # 使用 property 装饰器定义 setter 方法\n    @firstName.setter\n\
  \    def firstName(self, value):\n        self.__first = value\n\n# 创建 'emp1' 对象\n\
  emp1 = Employee()\n\n# 通过属性名 'firstName' 访问私有属性 '__first'\nemp1.firstName = \"George\"\
  \nprint(emp1.firstName)\n```\n\n**输出 3.3.6:**\n\n```\nGeorge\n```\n\n## 3.4 继承\n\
  \n*继承*是面向对象编程（OOP）的四大原则之一。它允许程序员通过在类之间建立*父-子*关系来扩展类的功能。在这种关系中，*子*类（也称为 *sub* 类或派生类）继承自*父*类（也称为\
  \ *super* 类或基类）。读者应该注意，在本章的讨论语境下，这些术语可以互换使用。继承非常有用，因为它促进了*代码重用*，从而减少了代码量并使其更于维护。关于子类的一个重要概念是，它们可以自己的新属性和方法，并可以选择地*覆盖*（override）相应父类的功能。\n\
  \n### 3.4.1 Python 中的继承\n\n实现继承概念的 Python 语法如下：\n\n```python\nclass Parent:\n  \
  \  父类定义\nclass Child(Parent):\n    子类定义\n```\n\n\n\n\n\n作为继承的一个实际示例，读者可以考虑两个类：一个名为\
  \ `Employee` 的超类和一个名为 `SalesEmployee` 的子类（见图 3.4）。不需要从头创建 `SalesEmployee` 的通用属性（例如`名字`、`姓`、`工资`或`津贴`），而是可以从\
  \ `Employee` 继承。相应的，子类还可以继承 setter 和 getter 方法，以及通常 `Employee` 类的所有`功能`。根据需要，还可以将可能\
  \ `SalesEmployee` 特有的额外属性（例如`佣金率`）添加到已继承的属性中。\n\n![](img/Fig03_04.jpg)\n\n图 3.4\
  \ 类之间的父子关系。\n\n这个关于超类 `Employee` 和子类 `SalesEmployee` 的特定示例的实现实现在下方的 Python 脚本示例中。在第一个脚本中，定义了具有私有属性\
  \ `__first`、`__last`、`__salary`、`__allowances` 以及类方法 `getTotalSalary()` 的 `Employee`\
  \ 类。在第二个脚本中，创建了 `SalesEmployee` 类作为一个空类，因此使用了 `pass` 关键字。私有属性和方法继承自 `Employee` 类。注意，超类\
  \ `Employee` 的名称作为参数传递给 `SalesEmployee`：\n\n```\n1   # 定义类 'Employee' 及其私有属性和方法\n\
  2   class Employee():\n3\n4          def __init__(self, first, last, salary, allowances):\n\
  5                 self.__first = first\n6                 self.__last = last\n7\
  \                 self.__salary = salary\n8                 self.__allowances =\
  \ allowances\n9\n10         def getTotalSalary(self):\n11                return\
  \ self.__salary + self.__allowances\n12\n13  # 创建对象 'emp1' 并打印当前员工的总薪水\n14  emp1\
  \ = Employee(\"George\", \"White\", 16000, 5200)\n15  print(emp1.getTotalSalary())\n\
  ```\n\n**输出 3.4.1.a：**\n\n```\n1   # 基于超类 'Employee' 定义子类 'SalesEmployee'\n2   class\
  \ salesEmployee(Employee):\n3          pass\n4\n5   \"\"\" 创建一个子类的新对象，它继承了\n6  \
  \ 超类的属性和行为 \"\"\"\n7   semp1 = salesEmployee(\"Alex\", \"Flora\", 12000, 4000)\n\
  8   print(semp1.getTotalSalary()) # 调用了超类的方法\n```\n\n**输出 3.4.1.b：**\n\n```\n16000\n\
  ```\n\n当实例化 `semp1` 对象时，Python 会扫描 `SalesEmployee` 以寻找初始化方法（即 `__init__()`）。如果未找到，它将扫描并执行超类的初始化方法（即\
  \ `Employee`），并并带上与当前对象相关的参数。同样，当为对象 `semp1` 调用 `getTotalSalary()` 时，该方法将从超类中调用，因为子类中不存在该方法。子类中的所有方法和属性都遵循相同的解析顺序。\n\
  \n### 3.4.1.1 自定义子类\n\n如所述，可以通过添加新的属性和方法对子类进行进一步自定义。例如，在子类 `SalesEmployee` 的情况下，可以通过添加属性\
  \ `commission_percent` 来实现。读者应该注意，尝试对属于 `Employee` 类的对象使用添加的属性将引发错误。这是因为在超类中没有这样的属性或方法。值得注意的是，为了能够使用超类属性\
  \ `salary` 和 `allowances`，必须将它们声明为 `protected`（保护）而不是 `private`（私有）。下面的脚本演示了这些概念：\n\
  \n```\n1   # 定义类 'Employee'\n2   class Employee():\n3\n4          \"\"\" 定义带有参数的类构造函数。\n\
  5          定义类的属性 \"\"\"\n6          def __init__(self, first, last, salary, allowances):\n\
  7                 self.__first = first\n8                 self.__last = last\n9\
  \                 self._salary = salary\n10                self._allowances = allowances\n\
  11\n12         # 定义一个派生属性\n13         def getTotalSalary(self):\n14            \
  \    return self._salary + self._allowances\n15\n16  # 定义子类 'SalesEmployee'\n17\
  \  class salesEmployee(Employee):\n18\n19         # 使用属性装饰器定义 getter 方法\n20    \
  \     @property\n21         def commissionPercent(self):\n22                return\
  \ self.__comm\n23\n24         # 使用属性装饰器定义 setter 方法\n25         @commissionPercent.setter\n\
  26         def commissionPercent(self, value):\n27                self.__comm =\
  \ value\n28\n29  # 基于超类 'Employee' 创建并使用对象 'emp1'\n30  emp1 = Employee(\"Maria\"\
  , \"Rena\", 15000, 5000)\n31  print(emp1.getTotalSalary())\n32\n33  # 基于子类 'SalesEmployee'\
  \ 创建并使用对象 'semp1'\n34  semp1 = salesEmployee(\"Alex\", \"Flora\", 16000, 6000)\n\
  35  print(semp1.getTotalSalary())\n36\n```\n\n**输出 3.4.1.1：**\n```\n20000\n```\n\
  \n### 3.4.2 方法重写\n\n`方法重写`（Method overriding）是 OOP 语言中常用的重要的特性。它允许子类包含一个与从超类继承的方法不同的方法。在之前的示例上下文中，程序员可能希望通过向工资和津贴添加`佣金`来计算销售员的总工资。在这种情况下，必须不同的实现子类方法\
  \ `getTotalSalary()`。如下例所示，在子类方法 `getTotalSalary()` 中必须调用超类方法：\n\n```\n1   # 定义类\
  \ 'Employee'\n2   class Employee():\n3\n4          # 定义类的构造函数和属性\n5          def\
  \ __init__(self, first, last, salary, allowances):\n6                 self.__first\
  \ = first\n7                 self.__last = last\n8                 self._salary\
  \ = salary\n9                 self._allowances = allowances\n10\n11         # 定义\
  \ 'getTotalSalary'\n12        def getTotalSalary(self):\n13               return\
  \ self._salary + self._allowances\n14\n15  # 定义子类 'SalesEmployee'\n16  class salesEmployee(Employee):\n\
  17\n18        # 使用属性装饰器定义 getter 方法\n19        @property\n20        def commissionPercent(self):\n\
  21               return self.__comm\n23\n24        # 使用属性装饰器定义 setter 方法\n25   \
  \     @commissionPercent.setter\n26        def commissionPercent(self, value):\n\
  27               self.__comm = value\n28\n29        # 子类重写了父类方法\n30        def getTotalSalary(self):\n\
  31        return super().getTotalSalary() + (super().getTotalSalary()\n32  self.__comm)\n\
  33\n34  # 基于超类 'Employee' 创建并使用对象 'emp1'\n35  emp1 = Employee(\"Maria\", \"Rena\"\
  , 15000, 5000)\n36  print(emp1.getTotalSalary())\n37\n38  # 基于子类 'SalesEmployee'\
  \ 创建并使用对象 'semp1'\n39  semp1 = salesEmployee(\"Alex\", \"Flora\", 16000, 6000)\n\
  40\n41  # 在子类中设置属性\n42  semp1.commissionPercent = 0.05\n43\n44  # 调用子类中重写的 getter\
  \ 方法\n45  print(semp1.getTotalSalary())\n46\n```\n\n**输出 3.4.2：**\n```\n23200\n\
  ```\n\n\n\n```\n20000\n23100.0\n```\n\n### 3.4.2.1 重写构造函数方法\n\n方法重写（method overriding）的概念也用于在子类中创建自定义构造函数。在这种情况下，使用\
  \ `super()` 方法来调用父类的 `__init__()` 方法，如下脚本所示：\n\n```python\n1   # 定义类 'Employee'\n\
  2   class Employee():\n3\n4          # 定义父类的构造函数及其属性\n5          def __init__(self,\
  \ first, last, salary, allowances):\n6                 self.__first = first\n7 \
  \                self.__last = last\n8                 self._salary = salary # 保护属性\n\
  9                 self.__allowances = allowances\n10\n11        # 定义类的 getter\n\
  12        def getTotalSalary(self):\n13              return self._salary + self.__allowances\n\
  14\n15  # 定义子类 'salesEmployee'\n16  class salesEmployee(Employee):\n17\n18     \
  \  \"\"\" 定义子类的构造函数并添加 'comm'\n19       属性。调用父类的 'init' 方法 \"\"\"\n20       def\
  \ __init__(self, first, last, salary, allowances, comm):\n21              super().__init__(first,\
  \ last, salary, allowances)\n22              self.__comm = comm\n23\n24       #\
  \ 从子类访问保护属性 '_salary'\n25       def getTotalSalary(self):\n26              return\
  \ super().getTotalSalary() + (self._salary *\n27  self.__comm)\n28\n29  # 基于父类创建并使用对象\
  \ 'emp1'\n30  emp1 = Employee(\"Maria\", \"Rena\", 15000, 5000)\n31  print(emp1.getTotalSalary())\n\
  32\n33  # 基于子类创建并使用对象 'semp1'\n34  semp1 = salesEmployee(\"Alex\", \"Flora\", 16000,\
  \ 6000, 0.05)\n35  print(semp1.getTotalSalary()) # 调用子类的方法\n```\n\n**输出 3.4.2.1：**\n\
  \n```\n20000\n22800.0\n```\n\n### 3.4.3 多重继承\n\n子类可以从多个父类继承属性和方法，这种概念被称为多重继承。在 Python\
  \ 中，可以使用以下语法实现：\n\n```python\nclass Parent1\n      pass\nclass Parent2\n      pass\n\
  class Child (Parent1, Parent2):\n      pass\n```\n\n作为多重继承的示例，图 3.5 展示了一个由两个父类（`Person`\
  \ 和 `Employee`）和一个继承自这两个这两个父类的子类（`Manager`）组成的结构。\n\n![](img/Fig03_05.jpg)\n\n图\
  \ 3.5 三类之间多重继承的表示。\n\n以下 Python 脚本实现了这种结构。读者应该注意，`Manager` 类中的构造函数在初始化期间调用了两个父类相应的构造函数。方法\
  \ `getFullName` 和 `getContact()` 继承自父类 `Person`，而 `getAnnualSalary()` 和 `getDepartment()`\
  \ 继承自 `Employee`：\n\n```python\n1   # 定义第一个父类 ('Person')\n2   class Person():\n\
  3\n4          # 定义类构造函数和属性\n5          def __init__(self, firstName, lastName, contact):\n\
  6                 self.__firstName = firstName\n7                 self.__lastName\
  \ = lastName\n8                 self.__contact = contact\n9\n10         # 第一个父类的姓和姓名的\
  \ getter\n11         def getFullName(self):\n12                return self.__firstName\
  \ + \" \" + self.__lastName\n13\n14         # 第一个父类的联系方式 getter\n15         def\
  \ getContact(self):\n16                return self.__contact\n17\n18  # 定义第二个父类\n\
  19  class Employee():\n20\n21         # 定义第二个父类的属性\n22         def __init__(self,\
  \ salary, dept):\n23                self.__salary = salary\n24                self.__dept\
  \ = dept\n25\n26         # 第二个父类的薪水 getter\n27         def getAnnualSalary(self):\n\
  28                return self.__salary\n29\n30         # 第二个父类的部门 getter\n31   \
  \      def getDepartment(self):\n32                return self.__dept\n33\n34  #\
  \ 定义子类 'Manager'\n35  class Manager(Person, Employee):\n36\n37         # 在初始化时调用两个父类的构造函数\n\
  38         def __init__(self, firstName, lastName, contact, salary, dept, bonus):\n\
  39                Person.__init__(firstName, lastName, contact)\n40            \
  \    Employee.__init__(salary, dept)\n41                self.__bonus = bonus\n42\n\
  43         # 覆盖 getAnnualSalary 方法\n44         def getAnnualSalary(self):\n45  \
  \              return Employee().getAnnualSalary() + self.__bonus\n46\n47      \
  \   # 覆盖 getDepartment 方法\n48         def getDepartment(self):\n49             \
  \   return Employee().getDepartment()\n50\n51  # 创建并使用对象 'mgr1'\n52  mgr1 = Manager(\"\
  Maria\", \"Rena\", \"555-1234\", 15000, \"Sales\", 2000)\n53  print(mgr1.getFullName())\n\
  54  print(mgr1.getContact())\n55  print(mgr1.getAnnualSalary())\n56  print(mgr1.getDepartment())\n\
  ```\n\n## 3.5 多态 – 重载\n\nOOP 语言的一个强大特性是支持方法重载。这是多态的基础元素，即将实现拆分为多个方法而不是单一方法。\n\n\
  虽然方法重载是 Java 和 C++ 等许多语言中的重要特性，但在 Python 中并不完全支持。Python 是一种动态语言，绑定发生在运行时。这被称为后期绑定，与语言中使用的静态绑定不同。在\
  \ Python 中，如果定义了同名的方法，最后一个定义将覆盖之前的所有。例如，考虑 `Employee` 类中的 `calculateTotalSalary()`。该方法计算不带奖金的年薪。另一个计算奖金总和的方法可以使用相同的名称实现，从而重载了\
  \ `calculateTotalSalary()`。在这种情况下，第一个方法将被忽略，对它的引用将引发错误，如下所示：\n\n```python\n1   #\
  \ 定义类 'Employee'\n2   class Employee:\n3\n4          # 定义 'calculateTotalSalary'\
  \ 方法\n5          def calculateTotalSalary(self):\n6                return self.salary\
  \ + self.allowances\n7          # 定义重载 'calculateTotalSalary' 方法\n8          def\
  \ calculateTotalSalary(self, bonus):\n9                return(self.salary + self.allowances)\
  \ + bonus\n10\n11  # 创建并使用对象 'emp1'\n12  emp1 = Employee()\n13  emp1.salary = 15000\n\
  14  emp1.allowances = 5000\n15  print(\"Total salary is \", emp1.calculateTotalSalary(2000))\n\
  16\n17  # 创建并使用对象 'emp2'\n18  emp2 = Employee()\n19  emp2.salary = 18000\n20  emp2.allowances\
  \ = 4000\n21  # 此方法调用将产生错误\n22  print(\"Total salary is \", emp2.calculateTotalSalary())\n\
  ```\n\n**输出 3.5：**\n\n```\nTotal salary is 22000\n-------------------------------------------------------------------------\n\
  TypeError Traceback (most recent call last)\n<ipython-input-8-517bl73547e9> in <module>\n\
  \      22\n      23 # 此方法调用将产生错误\n--->  24 print(\"Total salary is \", emp2.calculateTotalSalary())\n\
  TypeError: calculateTotalSalary() missing 1 required positional argument: 'bonus'\n\
  ```\n\n### 3.5.1 通过可选参数在 Python 中实现方法重载\n\n\n\n\n\n虽然 Python 不像其他 OOP 语言那样直接支持相同的方法重载，但它提供了一种替代方法来实现相同的功能。它并不是通过创建多个方法来解决，而是允许方法带有带有`默认值`的`可选参数`。当在代码中调用方法时，程序员可以选择是否提供参数值。这反过来决定了方法内部将执行哪块语句。通常，使用\
  \ `None` 值来为属性分配默认的空值。\n\n在下例示例中，定义了构造方法 `calculateTotalSalary()`，该方法带有一个可选参数 `bonus`。该实现随后返回不同的值，取决于是否为可选参数分配了新值。如果不是如此，则使用默认的\
  \ `None` 值。\n\n```\n1   class Employee:\n2\n3          def calculateTotalSalary(self,\
  \ bonus = None):\n4          # None statement supports both 'is' and '==' comparison\
  \ operators\n5                 if bonus is None:\n6                       return(self.salary\
  \ + self.allowances)\n7                 else:\n8                       return(self.salary\
  \ + self.allowances) + bonus\n9\n10  emp1 = Employee()\n11  emp1.salary = 15000\n\
  12  emp1.allowances = 5000\n13  emp2 = Employee()\n14  emp2.salary = 18000\n15 \
  \ emp2.allowances = 4000\n16\n17  print(\"Total salary is \", emp2.calculateTotalSalary(2000))\n\
  18  print(\"Total salary is \", emp1.calculateTotalSalary())\n```\n\n**输出 3.5.1:**\n\
  \n```\nTotal salary is 24000\nTotal salary is 20000\n```\n\n## 3.6 运算符重载\n\n`运算符重载`是指根据所使用的`操作数`来改变运算符默认行为的过程。Python\
  \ 中运算符重载的一个经典案例是根据输入类型修改加法 `+` 和乘法 `*` 运算符的行为。例如，当加法运算符用于两个数字时，它执行常规数值加法，但当它用于字符串时，它会将它们`拼接`起来。同样，当乘法运算符用于数字时，它会对它们相乘，而当它用于字符串和整数时，`它会重复字符串`。读者应该注意，这种基本的运算符重载功能作用于原始数据类型的操作数，如下例所示：\n\
  \n```\n1 a = 1\n2 b = 2\n3 print(a + b) # 将两个数字相加\n4 print(a * b) # 将两个数字相乘\n5\n\
  6 a = 'Python'\n7 b = ' is fun'\n8 print(a + b) # 拼接两个字符串\n9 print(a + b * 3) #\
  \ 拼接并重复字符串\n```\n\n**输出 3.6.a:**\n\n```\n3\n2\nPython is fun\nPython is fun is fun\
  \ is fun\n```\n\n如果将加法运算符用于用户定义的对象，它将抛出 `TypeError`，因为它不支持实例类型，如下所示：\n\n```\n1 \
  \ # 定义类 'Employee'\n2  class Employee:\n3\n4         salary = 0\n5\n6  # 创建并使用两个\
  \ 'Employee' 类的对象\n7  emp1 = Employee()\n8  emp1.salary = 15000\n9  emp2 = Employee()\n\
  10 emp2.salary = 22000\n11\n12 # 尝试以下打印语句将产生 TypeError\n13 print(emp1 + emp2)\n\
  ```\n\n**输出 3.6.b:**\n\n```\n-------------------------------------------------------------------------\n\
  \nTypeError                               Traceback (most recent call last)\n<ipython-input-11-527139aab026>\
  \ in <module>\n     11\n     12 # 尝试以下打印语句将产生 TypeError\n---> 13 print(empl + emp2)\n\
  \nTypeError: unsupported operand type(s) for +: 'Employee' and 'Employee'\n```\n\
  \n可以通过利用内置的 `magic` 或 `dunder` 方法来绕过这个问题，这些方法可以通过相应的运算符进行调用。例如，在加法运算符的情况下，首先在功能方面扩展相关的\
  \ `__add__()` 方法，然后按照下文脚本所示调用它：\n\n```\n1  # 定义类 'Employee'\n2  class Employee:\n\
  3\n4         # 重载 + 运算符以加上两个对象的 'salary'\n5         def __add__(self, other):\n\
  6                return self.salary + other.salary\n7\n8  # 创建两个 'Employee' 类的对象\n\
  9  emp1 = Employee()\n10 emp1.salary = 15000\n11 emp2 = Employee()\n12 emp2.salary\
  \ = 22000\n13\n14 # 通过扩展 '__add__' 方法调用重载的 + 运算符\n15 print(emp1 + emp2)\n```\n\n\
  **输出 3.6.c:**\n\n```\n37000\n```\n\n为了实现运算符重载，程序员必须在类定义中根据运算符定义相应的魔术方法。\n\n表格 3.1–3.4\n\
  \n| 运算符 | 魔术方法 |\n| :--- | :--- |\n| `+` | `__add__` |\n| `-` | `__sub__` |\n| `*`\
  \ | `__mul__` |\n| `//` | `__floordiv__` |\n| `/` | `__div__` |\n| `%` | `__mod__`\
  \ |\n| `**` | `__pow__` |\n| `<<` | `__lshift__` |\n| `>>` | `__rshift__` |\n| `&`\
  \ | `__and__` |\n| `^` | `__xor__` |\n| `|` | `__or__` |\n\n| 运算符 | 魔术方法 |\n| :---\
  \ | :--- |\n| `<` | `__lt__` |\n| `>` | `__gt__` |\n| `<=` | `__le__` |\n| `>=`\
  \ | `__ge__` |\n| `==` | `__eq__` |\n| `!=` | `__ne__` |\n\n| 运算符 | 魔术方法 |\n| :---\
  \ | :--- |\n| `-` | `__neg__` |\n| `+` | `__pos__` |\n| `~` | `__invert__` |\n\n\
  | 运算符 | 魔术方法 |\n| :--- | :--- |\n| `+=` | `__iadd__` |\n| `-=` | `__isub__` |\n\
  | `*=` | `__imul__` |\n| `/=` | `__ifloordiv__` |\n| `//=` | `__idiv__` |\n| `%=`\
  \ | `__imod__` |\n| `**=` | `__ipow__` |\n| `<<=` | `__ilshift__` |\n| `>>=` | `__irshift__`\
  \ |\n| `&=` | `__iand__` |\n| `^=` | `__ixor__` |\n| `|=` | `__ior__` |\n\n### 3.6.1\
  \ 重载内置方法\n\n虽然 Python 不支持对类的自定义方法的重载，但它支持内置方法。这允许程序员在类的上下文中更改现有方法的默认行为。例如，在 `print()`\
  \ 方法的情况下，如果输入是文本，则打印字符串；如果参数是对象，则打印`对象引用`，如下例所示：\n\n```\n1  # 定义类 'Employee'\n2\
  \  class Employee:\n3        Pass\n4\n5  # 基于类创建一个新的 'emp1' 对象\n6  emp1 = Employee()\n\
  7  emp1.firstName = \"George\"\n8  emp1.lastName = \"Comma\"\n9\n10 # 使用打印方法显示对象的引用\n\
  11 print(emp1)\n```\n\n**输出 3.6.1.a:**\n\n```\n<__main__.Employee object at 0x000002A2140033D0>\n\
  ```\n\n\n\n\n尽管如此，当对象被用作参数时，它可以是可以重载的。使用常用的 `Employee` 示例，重载适当的魔术方法（在此特定情况下为 `str()`），可以让程序打印相应的员工详细信息（例如\
  \ `firstName`、`lastName`），而不是像下面的示例那样打印对象引用：\n\n```python\n1  # 定义类 'Employee'\n\
  2  class Employee:\n3\n4         # 定义并扩展类的构造函数\n5         def __init__(self, first,\
  \ last, salary):\n6                self.firstName = first\n7                self.lastName\
  \ = last\n8                self.salary = salary\n9\n10        # 重载 print：扩展 '__str__'的功能\n\
  11        def __str__(self):\n12               return \"Employe name: \" + self.firstName\
  \ + \" \" + \\\n13                      self.lastName + \" Salary: \" = str(self.salary)\n\
  14\n15 # 基于 'Employee' 类创建并使用 'emp1' 对象\n16 emp1 = Employee(\"George\", \"Comma\"\
  , 15000)\n17\n18 # 使用重载的打印方法\n19 print(emp1)\n```\n\n**输出 3.6.1.b:**\n\n```\nEmployee\
  \ name: George Comma Salary: 15000\n```\n\n## 3.7 Python 中的抽象类与接口\n\n*抽象*类（abstract\
  \ class）是一种无法被实例化的类。它作为创建子类的蓝图或模板，但不能用于创建对象。抽象类包含抽象方法的声明。此类类型的声明包括方法的名称和参数列表，但没有具体实现。后者必须在相应的子类中定义。\n\
  \n为了创建抽象类和抽象方法，必须在程序中导入 `ABC` 和 `abstractmethod` 模块。其语法如下：\n\n```python\nfrom abc\
  \ import ABC, abstractmethod\n```\n\n`ABC` 代表*抽象基类*（Abstract Base Classes）。新创建的抽象类继承自\
  \ `ABC`，并且必须使用 `@abstractmethod` 内置装饰器包含至少一个抽象方法，且没有实现。以下脚本提供了一个抽象类（即 `Employee`）带有一个抽象方法（即\
  \ `getTotalSalary()`）的示例。运行此脚本会报错，因为抽象类不能实例化对象：\n\n```python\n1  # 导入 ABC\n2  from\
  \ abc import ABC, abstractmethod\n3\n4  # 定义抽象类 'Employee'\n5  class Employee(ABC):\n\
  6\n7         # 定义抽象方法 'getTotalSalary', 该方法必须为空\n8         @abstractmethod\n9  \
  \       def getTotalSalary(self):\n10               Pass\n11\n12 # 抽象类不能实例化对象\n\
  13 emp1 = Employee()\n```\n\n**输出 3.7.a:**\n\n```\n--------------------------------------------------------------------\n\
  TypeError                               Traceback (most recent last)\n<ipython-input-16-47belb52dd97>\
  \ in <module>\n   11\n   12 # 抽象类不能实例化对象\n---> 13 empl = Employee()\n\nTypeError:\
  \ can't instantiate abstract class Employee with abstract methods getTotalSalary\n\
  ```\n\n一旦实现了抽象类，它就可以作为父类来派生子类。此类类型的子类必须实现抽象类的抽象方法作为最低要求。在这种情况下，如接下来的第一个脚本所示，子类 `FullTimeEmployee`\
  \ 将报错，因为它没有实现其父抽象类（即 `Employee`）的抽象方法（即 `getTotalSalary()`）。相反，第二个脚本展示了抽象方法 `getTotalSalary()`\
  \ 的实现，解决了这一问题：\n\n```python\n1  # 导入 ABC\n2  from abc import ABC, abstractmethod\n\
  3\n4  # 定义抽象类 'Employee'\n5  class Employee(ABC):\n6\n7         # 定义抽象方法 'getTotalSalary'\n\
  8         @abstractmethod\n9         def getTotalSalary(self):\n10             \
  \  Pass\n11\n12 # 基于抽象类定义类 'fullTimeEmployee'\n13 class fullTimeEmployee(Employee):\n\
  14\n15        # 定义子类的构造函数及其属性\n16        def __init__(self, first, last, salary,\
  \ allowances):\n17               self.__first = first\n18               self._last\
  \ = last\n19               self.__salary = salary\n20               self.__allowances\
  \ = allowances\n21\n23 # 因为子类没有实现\n23 # 抽象方法，将会报错\n24 ftl = fullTimeEmployee(\"\
  Maria\", \"Rena\", 15000, 6000)\n```\n\n**输出 3.7.b:**\n\n```\n-------------------------------------------------------------------------\n\
  TypeError                               Traceback (most recent last)\n<ipython-input-12-7e5c51df1210>\
  \ in <module>\n   21\n   22 # 因为子类没有实现抽象方法，将会报错\n---> 23 ftl = fullTimeEmployee(\"\
  Maria\", \"Rena\", 15000, 6000)\n\nTypeError: Can't instantiate abstract class fullTimeEmployee\
  \ with abstract methods getTotalSalary\n```\n\n```python\n1  # 导入 ABC\n2  from abc\
  \ import ABC, abstractmethod\n3\n4  # 定义抽象类 'Employee'\n5  class Employee(ABC):\n\
  6\n7        # 定义抽象方法 'getTotalSalary'\n8        @abstractmethod\n9        def getTotalSalary(self):\n\
  10               Pass\n11\n12 # 基于抽象类定义类 'fullTimeEmployee'\n13 class fullTimeEmployee(Employee):\n\
  14\n15       # 定义子类的构造函数及其属性\n16       def __init__(self, first, last, salary, allowances):\n\
  17               self.__first = first\n18               self._last = last\n19  \
  \             self.__salary = salary\n20               self.__allowances = allowances\n\
  21\n22     # 实现抽象类的抽象方法\n23     def getTotalSalary(self):\n24           return self.__salary\
  \ + self.__allowances\n25\n26 # 创建并使用新的 'fullTimeEmployee' 对象\n27 ftl = fullTimeEmployee(\"\
  Maria\", \"Rena\", 15000, 6000)\n28 print(ftl.getTotalSalary())\n```\n\n**输出 3.7.c:**\n\
  \n```\n21000\n```\n\n抽象类可以包含带有实现的抽象和抽象方法。继承自抽象类的子类也会继承这些实现的方法。如果需要，后者可以被重写，但在所有情况下，实现必须包含抽象方法。\n\
  \n### 3.7.1 接口\n\n在面向对象编程中，*接口*（interface）指的是用于创建其他类的类。它的主要目的是通过为潜在类提供蓝图来提高代码的组织性和效率。如此，接口描述了继承类的行为，与抽象类相似。然而，与后者不同，接口不能包含非抽象方法。Python\
  \ 不支持显式创建接口。但是，由于它支持多重继承，程序员可以使用抽象类继承来模拟接口功能，并仅使用*抽象方法*。\n\n## 3.8 Python 中的模块与包\n\
  \n*模块*（modules）和*包*（packages）用于组织 Python 代码的结构。模块是包含 Python 代码结构（例如类、方法、属性或简单变量的文件，以\
  \ .*py 文件扩展结尾。不需要重写特定的代码块，可以将模块导入到其他 Python 文件或应用程序中，从而允许基于可重用代码的模块化编程方法。\n\n抽象类和接口是通常存储在模块中的两种编程结构，可以根据需要从中导入。在以下脚本提供的示例中，`Employee`\
  \ 类的完整定义存储在名为 *employee.py* 的模块中：\n\n\n\n\n\n```python\n# 'Employee'模块保存在 'employee.py'文件中\n\
  class Employee:\n    # 定义类的构造函数和私有属性\n    def __init__(self, first, last, salary):\n\
  \        self.__firstName = first\n        self.__lastName = last\n        self.__salary\
  \ = salary\n\n    # 定义年薪的 getter\n    def getAnnualSalary(self):\n        return\
  \ self.__salary * 12\n\n    # 定义全名的 getter\n    def getFullName(self):\n       \
  \ return self.__firstName + \" \" + self.__lastName\n```\n\n### 3.8.1 import 语句\n\
  \nPython 模块文件通过 `import` 语句进行导入。该语句可以包含一个或多个模块。其语法如下：\n\n```\nimport module1, [module2,\
  \ module3...]\n```\n\n一旦导入了模块，就可以使用其名称作为前缀来引用它的类和方法（例如 `module.classname`）。下面的示例从相关的\
  \ `employee.py` 模块导入 `Employee` 类，并在程序主体中访问其属性和方法：\n\n```python\n# 将 'employee.py'\
  \ 文件作为模块导入\nimport employee\n\n# 使用该模块创建并使用新对象\nemp1 = employee.Employee(\"Maria\"\
  , \"Rena\", 15000)\nprint(emp1.getFullName())\nprint()\n```\n\n**输出 3.8.1：**\n\n\
  ```\nMaria Rena\n```\n\n### 3.8.2 `FROM…IMPORT` 语句\n\nPython 模块可能包含多个类、方法、属性或变量。`from...import`\
  \ 语句允许程序员从模块中选择性地导入特定组件。其语法如下：\n\n```\nfrom module import name1, [name2, name3...]\n\
  ```\n\n注意，示例中使用的名称（例如 `name1`、`name2`、`name3`）代表类、方法或属性的名称。\n\n要从模块导入所有对象，可以使用以下语法：\n\
  \n```\nfrom module import *\n```\n\n读者应该注意，如果显式地`导入了某个特定的类，则可以在不带前缀的情况下引用它，如下一个示例所示：\n\
  \n```python\n# 从 'employee.py' 中的 'employee' 模块导入类 'Employee'\nfrom employee import\
  \ Employee\n\n# 使用导入的类创建并使用新对象\nemp1 = Employee(\"Alex\", \"Flora\", 18000)\nprint(emp1.getFullName())\n\
  print(emp1.getAnnualSalary())\n```\n\n**输出 3.8.2：**\n\n```\nAlex Flora\n216000\n\
  ```\n\n### 3.8.3 包\n\n`package`（包）是组合在共同文件夹中的模块集合。包文件夹必须包含一个指定名为 `__init__.py` 的文件，这表示该文件夹是一个包。`__init__.py`\
  \ 文件可以是空的，但必须始终存在于包文件夹中。一旦创建了包结构，就可以根据需要添加 Python 模块。图 3.6 中的示例说明了名为 `hr` 的包结构，它包含了强制性的\
  \ `__init__.py` 文件和名为 `employee.py` 的模块。\n\n![](img/Fig03_06.jpg)\n\n**图 3.6** 包\
  \ `hr` 包含 `__init__.py` 文件和 `employee.py` 模块。\n\n包中的模块可以通过在导入语句中使用包名作为前缀导入到应用程序中，如下脚本所示：\n\
  \n```python\n# 从 'hr' 包导入 employee 模块\nimport hr.employee\n\n# 使用模块中存储的 'Employee'\
  \ 类创建并使用对象\nemp1 = hr.employee.Employee(\"Alex\", \"Flora\", 16000)\nprint(emp1.getFullName())\n\
  print(emp1.getAnnualSalary())\n```\n\n**输出 3.8.3.a：**\n\n```\nAlex Flora\n216000\n\
  \n# 从 'hr' 包中的 employee 模块导入 'Employee' 类\nfrom hr.employee import Employee\n\n\
  # 使用模块的 'Employee' 类创建并使用对象\nemp2 = Employee (\"Alex\", \"Flora\", 15000)\nprint(emp2.getFullName())\n\
  print(emp2.getAnnualSalary())\n```\n\n**输出 3.8.3.b：**\n\n```\nAlex Flora\n180000\n\
  ```\n\n### 3.8.4 使用模块存储抽象类\n\n模块也可以用于存储抽象类或接口。在下面的示例中，抽象类 `IEmployee` 存储在模块 `employee.py`\
  \ 中，该模块位于名为 `hr` 的包：\n\n```python\n# 使用 'abc' 模块创建一个抽象类：作为模块\n# ('employee.py')\
  \ 存储在 hr 包中\nfrom abc import ABC, abstractmethod\n\n# 定义抽象类 'IEmployee' 及其行为\nclass\
  \ IEmployee(ABC):\n    @abstractmethod\n    def getTotalSalary(self):\n        pass\n\
  \n    @abstractmethod\n    def getFullName(self):\n        pass\n```\n\n下面的脚本演示了如何使用\
  \ `IEmployee`：\n\n```python\n# 从 'employee' 模块导入 'Employee' 类\nfrom employee import\
  \ Employee\n\n# 使用 'abc' 模块创建一个抽象类\nclass fullTimeEmployee(Employee):\n    def __init__(self,\
  \ first, last, salary, allowances):\n        self.__firstName = first\n        self.__lastName\
  \ = last\n        self.__salary = salary\n        self.__allowances = allowances\n\
  \n    def getTotalSalary(self):\n        return self.__salary * 12 + self.__allowances\n\
  \n    def getFullName(self):\n        return self.__firstName + \" \" + self.__lastName\n\
  \n# 创建并使用对象\nftl = fullTimeEmployee(\"Maria\", \"Rena\", 15000, 6000)\nprint(ftl.getFullName())\n\
  print(ftl.getTotalSalary())\n```\n\n**输出 3.8.4：**\n\n```\nMaria Rena\n216000\n```\n\
  \n## 3.9 异常处理\n\n在编写 Python 或任何其他语言程序时，代码可能包含错误。根据错误的性质和影响，它们会导致许多问题，例如阻止程序执行、产生错误的输出或导致程序崩溃。因此，程序员有责任尽可能提供错误识别和处理。错误可以分为三大类：\n\
  \n- **编译时错误 (Compile Time Errors)**：由于错误的语法、数据类型使用或方法调用参数等引起。每当编译器遇到程序中的编译错误时就会停止执行。编译错误最容易处理，通过修正问题行即可轻松修复。\n\
  - **逻辑错误 (Logical Errors)**：由于错误的程序逻辑引起。包含逻辑错误的程序可能会正常运行而不崩溃，但会产生错误的输出。逻辑错误通过使用不同的输入值对应用程序进行测试并在必要时对程序逻辑进行修正来处理。\n\
  - **运行时错误 (Runtime Errors)**：在程序执行期间发生，由于不与代码相关的外部因素引起。例如，用户可能提供了应用程序未预无效输入，或者代码尝试读取系统中不存在的文件。在\
  \ Python 中，这些类型的错误会抛出异常并导致程序崩溃和终止。为了防止这种情况，程序员应该通过向程序添加适当的错误处理代码来`捕获`这些异常。\n\n###\
  \ 3.9.1 在 Python 中处理异常\n\n在 Python 中，当发生运行时错误时，程序会崩溃并抛出一个内置异常。异常提供了有关错误的信息。例如，运行以下脚本将导致\
  \ `ZeroDivisionError` 异常，因为它尝试除以 0。\n\n```python\na = 10\nb = 0\nprint(a / b)\n\
  ```\n\n**输出 3.9.1.a：**\n```\nZeroDivisionError: division by zero\n```\n\n\n\n\n\n\
  ```\n-----------------------------------------------------------------------------\n\
  ZeroDivisionError                        Traceback (most recent call)\n<ipython-input-2-dd04aeeae314>\
  \ in <module>\n    1 a = 10\n    2 b = 0\n----> 3 print(a / b)\n\nZeroDivisionError:\
  \ division by zero\n```\n\n可以使用 `try/except` 语句块来处理异常。如名所示，该结构由两个不同的块组成：`try` 和\
  \ `except`。`try` 块包含最可能抛出异常的关键语句。当异常在 `try` 块中发生时，程序的执行将跳转到 `except` 块。该部分包含用于恰当处理异常的代码。例如，它可能会显示相关的用户消息、关闭已打开的文件或将错误记录到文件中。如果在\
  \ `try` 块中没有抛出异常，程序将跳过 `except` 块并继续正常执行。\n\n异常处理代码中还可以添加两个可选的块，即 `else` 和 `finally`。`else`\
  \ 块包含在没有发生异常时执行的语句。`finally` 块包含无论是否发生异常都必须执行的代码，主要用于释放外部资源，如关闭已打开的文件。\n\nPython\
  \ 捕获异常的主要语法所示：\n\n```\ntry:\n       关键语句\nexcept[ExceptionClass as err]:\n     \
  \  异常处理语句\n[else:\n       当未发生异常时执行的语句\nfinally:\n       无论是否发生异常都执行的语句]\n```\n\n\
  `ExceptionClass` 是可选的，它指代正在处理的异常类型。如果省略，所有类型的异常都将由 `except` 块处理。\n\n下面的示例是之前示例中所用代码的改进版本，因为在这种情况下程序不会突然崩溃。相反，它将以一个用户友好的错误消息退出：\n\
  \n```\n1   # 声明变量 'a' 和 'b'\n2   a, b = 10, 0\n3\n\n4   \"\"\" 尝试除以这些变量，如果抛出异常\n\
  5   则在 'except' 块中执行替代语句 \"\"\"\n6   try:\n7         print(a / b)\n8   except:\n\
  9         print(\"发生了一个错误\")\n```\n\n**输出 3.9.1.b:**\n\n```\n发生了一个错误\n```\n\n####\
  \ 3.9.1.1 处理特定异常\n\n在单个 `try/except` 块中尝试捕获所有类型的错误被认为不是良好的编程习惯，因为它不允许程序员根据具体情况处理异常。Python\
  \ 提供了多种不同的内置异常类，这些类根据遇到的错误类型自动抛出。可以通过引用它们的指定名称来利用这些特定异常。表 3.5 列出了 Python 中许多常见的内置异常类。\n\
  \n**表格 3.5**](#C_006_c3.xhtml_t3_5b) Python 中的常见异常类\n\n| 异常类 | 说明 |\n| --- | ---\
  \ |\n| `ArithmeticError` | 当算运算失败时抛出。包括以下异常子类：`OverflowError`、`ZeroDivisionError`、`FloatingPointError`\
  \ |\n| `OverflowError` | 运算结果超出范围 |\n| `ZeroDivisionError` | 尝试除以零 |\n| `FloatingPointError`\
  \ | 浮点运算失败 |\n| `IndexError` | 数组索引无效 |\n| `AttributeError` | 为实例引用了不存在的属性 |\n|\
  \ `TypeError` | 运算符或方法被应用于不适当的对象类型 |\n| `FileNotFoundError` | 未找到文件 |\n| `ValueError`\
  \ | 方法的参数类型不适当 |\n\n下面的示例演示了如何使用 `ZeroDivisionError` 异常类处理特定错误：\n\n```\n1   # 声明变量\
  \ 'a' 和 'b'\n2   a, b = 10, 0\n3\n\n4   # 尝试打印 'a' 除以 'b' 的结果\n5             try:\n\
  6    print(a / b)\n7\n\n8   # 如果发生特定的 'ZeroDivisionError' 则相关消息\n9   except ZeroDivisionError\
  \ as err:\n10         print(\"发生了一个错误\")\n11         print(err)\n```\n\n**输出 3.9.1.1:**\n\
  \n```\n发生了一个错误\n除以零\n```\n\n`try` 块也可以包含多个 `except` 块。这当程序员想要处理各种不同类型的错误时非常有用。然而，当异常发生时，只有这些块中的一个会被执行。当使用多个\
  \ `except` 块时，代码结构必须从更具体的异常类开始，以更通用的异常类结束。在这种情况下，后者被用作额外措施，以尝试处理未显式说明的意外错误。多异常块的语法所示：\n\
  \n```\ntry:\n       # 关键语句\n       pass\nexcept FileNotFoundError:\n       # 处理\
  \ FileNotFound 异常\n       pass\nexcept (IndexError, ArithmeticError):\n       #\
  \ 带有多个异常的 except 块\n       # 数组索引越界和运算错误\n       pass\nexcept:\n       # 必须放在最后。处理所有其他错误\n\
  \       pass\n```\n\n### 3.9.2 抛出异常\n\n在 Python 中，当发生相应的运行时错误时，内置异常会自动抛出。然而，它允许抛出由程序员定义的异常。这通过使用\
  \ `raise` 关键字以及异常名称来实现。抛出自定义异常时，还可以提供描述抛出原因的字符串参数。下一个示例演示了这种情况，如果用户输入小于 18，则抛出一个自定义异常\
  \ (`ValueError`)：\n\n```\n1  # 获取用户的年龄\n2  age = int(input(\"输入年龄： \"))\n3\n4  #\
  \ 如果年龄小于 18 则抛出错误\n5   if age < 18:\n6         raise ValueError(\"年龄不能小于 18\")\n\
  ```\n\n**输出 3.9.2.a:**\n\n```\n输入年龄：17\n-----------------------------------------------------------------------------\n\
  ValueError                                  Traceback (most recent call)\n<ipython-input-6-de1dc8d8553>\
  \ in <module>\n       4 # 如果年龄小于 18 则抛出错误\n5 if age < 18:\n---->     raise ValueError(\"\
  年龄不能小于 18\")\n\nValueError: 年龄不能小于 18\n```\n\n在示例中，当私有属性 `__first` 的值无效时，会抛出内置异常\
  \ `AttributeError`。\n\n```\n1   # 定义类 'Employee'\n2   class Employee:\n3\n\n4  \
  \        # 定义 getter 方法\n5          def getFirstName(self):\n6                 return\
  \ self.__first\n7\n8          # 定义 setter 方法\n9          def setFirstName(self,\
  \ value):\n10           if len(value) < 15:\n11                self.__first = value\n\
  12           else: # 如果输入超过 14 个字符则抛出错误\n13                raise AttributeError(\"\
  姓名必须小于 15 个字符 \\\n14   characters\")\n15\n16   # 尝试创建一个对象并设置姓名\n17   try:\n18  \
  \           emp1 = Employee()\n19             emp1.setFirstName(\"Maria Rena White\"\
  ) # 抛出异常\n20\n21   # 如果姓名超过 14 个字符则抛出 'AttributeError' 异常\n22   # \n23   except\
  \ AttributeError as err:\n24          print(err)\n25   except:\n26          print(\"\
  发生了一个错误\")\n```\n\n**输出 3.9.2.b:**\n\n```\n姓名必须小于 15 个字符\n```\n\n抛出异常也是处理传递给属性设置方法的无效值的方便方法。然而，在这种情况下，与其抛出内置异常，不如创建自定义的类内异常。\n\
  \n### 3.9.3 Python 中的自定义异常\n\n\n\n\n如前所述，当发生运行时错误时，Python 会抛出内置异常。然而，对于`custom errors`（自定义错误），Python\
  \ 也允许从代码内部创建`custom exceptions`（自定义异常）。例如，程序员不必直接抛出内置异常 `AttributeError`，可以通过从 `Exception`\
  \ 基类派生新类来创建一个自定义异常，如下所示：\n\n```python\nclass NewExceptionName (Exception):\n   \
  \   pass\n```\n\n在以下脚本中，创建了自定义异常 `FirstNameException`，并在当名字长度超过 14 个字符时，在 setter\
  \ 方法中将其抛出：\n\n```\n1   # 基于内置异常定义新的异常类\n2   class FirstNameException(Exception):\n\
  3\n4          def __init__(self, message):\n5                 super().__init__(message)\n\
  6\n7   # 定义类 'Employee'\n8   class Employee:\n9\n10         # Getter 方法\n11    \
  \     def getFirstName(self):\n12                return self.__first\n13\n14   \
  \      # Setter 方法\n15         def setFirstName(self, value):\n16           if len(value)\
  \ < 15:\n17                self.__first = value\n18           else:\n19        \
  \     # 如果名字超过 14 个字符，\n20             # 抛出一个扩展异常 'FirstNameException'\n21     \
  \        raise FirstNameException(\n22             # 抛出错误\n23             \"First\
  \ name should be less than 15 characters\")\n24\n25   # 创建并使用新对象处理可能的自定义\n26   #\
  \ 异常\n27   try:\n28    emp1 = Employee()\n29          emp1.setFirstName(\"Maria\
  \ Rena White\") # 抛出异常\n30    except FirstNameException as err:\n31          print(err)\n\
  32    except:\n33          print(\"An error has occurred\")\n```\n\n**输出 3.9.3：**\n\
  \n```\nFirst name should be less than 15 characters\n```\n\n## 3.10 案例研究\n\nSherwood\
  \ 房地产需要一个应用程序来管理物业。。产有两种类型：公寓和房屋。每种物业产都可以租赁或出售。\n\n这两类物业产都通过参考编号、地址、建筑面积、卧室数量、浴室数量、停车位数量、游泳池可用性和健身房可用性来描述。房屋需要额外的属性，如楼层、地面积和房屋类型（别墅或联排别墅）。公寓需要额外的属性，如楼层和阳台数量。\n\
  \n每种类型的物业（房屋或公寓）都可以租赁或出售。\n\n租赁物业应包括押金金额、年租金、带家具（是或否）以及女佣房（是或否）等属性。出售物业具有销售价格和预计年度服务费等属性。\n\
  \n所有物业产包含 2% 的固定代理佣金。两类出售物业都有收 4% 的固定税。\n\n所有物业产都需要一个显示物业详情的方法。\n\n所有物业产都应该包含一个计算代理佣金的方法。对于租赁物业，佣金使用年租金金额计算，而对于购买物业则使用销售价格计算。\n\
  \n两类购买物业都应该包含一个计算税额的方法。税额根据销售价格计算。\n\n设计并实现一个 Python 应用程序，使用多重继承和抽象类创建四种类型的物业（例如\
  \ `RentalApartment`、`RentalHouse`、`SaleApartment`、`SaleHouse`）。使用封装实现类属性和实例属性。所有数值属性（如价格）都应根据合适的最小和最大价格对输入进行验证。\n\
  \n在抽象类中定义方法并在相应的类中实现。重写 `print` 方法以显示每种物业的详情。\n\n通过创建每个类型的新物业并调用相应的方法来测试你的应用程序。\n\
  \n## 3.11 练习题\n\n1. 使用下图中所示为以下内容编写 Python 代码：\n\n![](img/un03_43.jpg)\n\n1. 创建名为\
  \ `Student` 的类。\n2. 使用 `@property` 装饰器为 `Student_Name` 和 `GPA` 属性创建相应的 getters 和\
