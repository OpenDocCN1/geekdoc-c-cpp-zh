  \ `NaN` 值。如果决定删除包含缺失数据的行，应该使用以下语法：\n\n```\n<name of new Frame> = <name of Data Frame>.dropna()\n\
  ```\n\n以下脚本演示了 `dropna()` 方法删除所有包含 `NaN` 值的行：\n\n```python\nimport pandas as pd\n\
