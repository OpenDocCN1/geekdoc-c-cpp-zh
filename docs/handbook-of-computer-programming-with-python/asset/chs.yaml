  \ = \"Click to create the new DB\\nin the localhost\")\n31  winButton.bind(\"<Button-1>\"\
  , lambda event, a = textVar: createDB(a))\n32  winButton.grid(column = 0, row =\
  \ 2)\n\n34\n  winFrame.mainloop()\n```\n\n**输出 7.2.1:**\n\n![](img/un07_01.jpg)\
  \ ![](img/un07_02.jpg)\n\n脚本中专门与数据库相关的部分位于第 3–13 行。在第 3 行，导入了处理 MySQL 连接的 `mysql.connector`\
  \ 函数。第 5 行实现了标准的连接配置。一旦 GUI 构建完成，点击按钮事件将调用 `createDB()` 函数，该函数将最常用的数据库格式（`GuiDB`）分配给相关变量（第\
  \ 8 行）。接下来，使用 `mysql.connector.connect(**config)` 适配器连接到 MySQL（第 10 行），以 `sqlString`\
  \ 的形式准备待执行的语句（第 12 行），并执行该语句（第 13 行）。\n\n### 7.2.2 连接到数据库\n\n与上一个示例一样，一旦创建了数据库，就必须建立一个连接（connection）。连接到数据库涉及通过服务器（例如\
  \ Internet 信息服务器 (ISS) 或 Apache）在相关的 DMS（例如 `MySQL`）内部创建指向它的链接。一旦建立连接，必须打开数据库并创建链接附加到其上。这通常需要一些凭据，包括登录用户名、密码、主机地址（即托管数据库的服务器的网络地址）以及数据库本身的名称。对于存储和在本地计算机系统及本地服务器内部使用的数据库（例如通过\
  \ Apache 使用 `MySQL`），主机地址通常为“localhost”。\n\n以下 Python 脚本连接到新创建的数据库。它设置了持有数据库连接凭据的配置字符串（`config`）（第\
  \ 2–3 行）。接下来，通过 `mysql.connector` 将执行语句链接到 MySQL 数据库（第 5 行）。连接建立后，结果将加载到 `cursor`\
  \ 对象中，它始终接收所有执行 SQL 语句的结果（第 6 行）。最后，通过执行 `cursor.execute(\"SHOW TABLES\")`（第 7 行）和\
  \ `cursor.fetchall()`（第 8 行）命令显示数据库表。\n\n在本示例中，读者应注意 `try…except`语句（第 4 行和第 10 行），以便在成功或失败的情况下显示适当的消息。这确保了可能返回错误或意外值的语句执行不会导致应用程序崩溃。例如，使用\
  \ `newDB` 作为数据库名运行此脚本将按预期显示表。然而，如果将数据库名更改为不存在的名称（例如 `newDB1`），将执行第 9 行和第 10 行中的异常处理（exception\
  \ handling）代码，并启动错误消息。值得提到，任何可能导致连接数据库失败的原因都会触发脚本中 `except` 部分的执行。尽管如此，如果数据库是空的，将显示空的表集：\n\
  \n```python\n 1   import mysql.connector\n2   config = {'user': 'root', 'password':\
  \ 'root',\n3          'host': 'localhost', 'database': 'newDB'}\n4   try:\n5   \
  \       link = mysql.connector.connect(**config)\n6          cursor = link.cursor()\n\
  7          cursor.execute(\"SHOW TABLES\")\n8          print(cursor.fetchall())\n\
  9   except:\n10         print(\"There is an error with the connection\")\n```\n\n\
  **输出 7.2.2.a:**\n\n输出 7.2.2.a 显示包含 `Student` 和 `Table 1` 表的数据库结果。\n\n**输出 7.2.2.b:**\n\
  \n```\nThere is an error with the connection\n```\n\n 输出 7.2.2.b 显示包含 `Student`\
  \ 和 `Table 1` 表的数据库结果。\n\n### 7.2.3 创建表\n\n创建数据库后所需的第一个操作是创建其表。这是通过 `CREATE` 语句实现的。不同\
  \ DBMS 之间细微语法差异的详细描述出了本章的范围，但基本结构保持不变。\n\n假设使用常用的关系模型，创建表时需要指定七特定的元素：\n\n1. 表名（table\
  \ name）（即在每个列中存储数据的每个结构的名称，也称为属性/attributes）。\n2. 表的属性数量。\n3. 每个属性的名称，最好是单个单词。\n\
  4. 每个属性的数据类型（data type）（例如 `CHAR`、`INT` 或 `DATE`）。\n5. 每个属性按字节计算的数据长度/大小（length/size）。\n\
  6. 任何属性是否为表的主键（primary key），或是表的复合主键（combined primary key）的一部分。\n7. 任何属性是否为外键（foreign\
  \ key,），引用另一个表中的相应属性。\n\n在指定这七个元素的情况下，创建表时有三种可能的情况：\n\n1. 表没有主键，且其任何属性都没有引用另一个表的属性。在这种情况下，表是单表数据库的一部分，或者它是其他表引用的父表。\n\
  2. 表的一个或多个属性被指定为主键，以确保其每条记录都是唯一的。\n3. 数据库中有多个表，并且它们以某种方式相互关联。当一个或多个属性引用同一数据库中另一个表的相同列时，就会发生这种情况。\n\
  \nPython 为所有三种情况提供了支持。从第一种情况开始，可以创建一个具有若干属性但没有主键或外键的表。可以通过静态或动态的方式进行。静态方法涉及预定义的语句和预定的结果。动态方法允许程序程序在运行时确定表结构。以下脚本和输出是后者的示例：\n\
  \n\n\n\n\n```python\nimport mysql.connector\n\n# 数据库配置详情\nconfig = {'user': 'root',\
  \ 'password': 'root',\n  'host': 'localhost', 'database': 'newDB'}\n\n# 表名及其属性\n\
  tableName = input(\"Enter the name of the table to create: \")\nsqlString = \"CREATE\
  \ TABLE \" + tableName + \"(\"\nnumOfAt = int(input(\"Enter the number of attributes\
  \ in the table\"))\natName = [\"\"]*numOfAt\natType = [\"\"]*numOfAt\natSize = [0]*numOfAt\n\
  \n# 定义表结构（即属性详情）\nfor i in range(numOfAt):\n    atName[i] = input(\"Enter the attribute\
  \ \" + str(i) + \": \")\n    atType[i]=str(input(\"Enter 'char' for char, 'int'\
  \ for int type: \"))\n    atSize[i] = int(input(\"Enter the size of the attribute:\
  \ \"))\n    sqlString += atName[i]+ \" \" + atType[i]+\"(\"+str(atSize[i])+\")\"\
  \n\n    if (i < numOfAt-1):\n        sqlString += \",\"\n    else:\n        sqlString\
  \ += \")\"\n\n# SQL 语句和异常处理机制\nprint(\"The SQL statement to run is: \", sqlString)\n\
