  \ 语句，以及如何使用 `commit()` 函数提交结果。\n\n## 7.4 查询数据库和使用 GUI\n\n从用户的角度来看，从数据库表中查询和报告数据无疑是数据库管理中最实用的部分。因此，剩余的\
  \ SQL 语句专门用于这些目的而设计，这并不令人意外。由于可用的子句非常多，而且嵌套查询以及*条件查询执行*的可能性使得潜在的组合几乎是无限的。因此，对每种可能的查询和报告情况进行详尽覆盖不仅超出了本章的范围，而且通常来说也是徒劳的尝试。本节的重点是展示执行查询和报告任务的一些基本方法，并演示如何将\
  \ GUI 用于演示。\n\n### 7.4.1 select 语句\n\n`SELECT` 语句用于从表中查询和报告数据。其最基础且通用的语法不包含任何规定额外功能或选择标准的子句：\n\
  \n```sql\n SELECT * FROM <table name> WHERE *\n```\n\n此类语句将返回指定表的所有属性，因为星号（`*`）字符被用于包含*所有属性和所有条件*。基于更具体标准的筛选，可以通过添加所需的子句来构建：\n\
  \n```sql\n SELECT <来自一个或多个表的属性列表> OR *\nFROM <表列表>\nWHERE <条件>\n```\n\n`<conditions>`\
  \ 部分指定了数据为了被报告出来而必须满足的特定要求，范围从无条件到非常复杂的多属性和多表条件。同样，`<list of attributes from one\
  \ or more tables>` 部分指定了必须包含在报告中的属性。以下 Python 脚本根据用户的选择从 `Customers`、`Products`、`Orders`\
  \ 等构建查询和报告的详细描述和丰富的资源：\n\n```python\n1   import mysql.connector\n2\n3   # 提供已建立数据库配置\n\
  4   GUIDB = 'GuiDB'\n5   config = {'user': \"root\", 'password': \"root\",\n6  \
  \           'host': \"localhost\", 'database': \"newDB\"}\n7\n8   # 连接到 newDB 数据库\n\
  9   connect = mysql.connector.connect(**config)\n10  cursor = connect.cursor()\n\
  11\n12  try:\n13      # 尝试显示 newDB 数据库中的表\n14      cursor.execute(\"SHOW TABLES\"\
  )\n15      tables = cursor.fetchall()\n16      print(\"DB tables are: \" + str(tables))\n\
