  \ 第 6 章 – 使用 Python 数据结构与算法\n\n### 描述\n\n创建一个实现指定算法和任务的应用程序。该应用程序应使用标签页笔记本形式的 GUI\
  \ 界面，每个标签页对应一个算法。应用程序的要求如下：\n\n1. 实现以下静态排序算法：`bubble sort`（泡沫排序）、`insertion sort`（插入排序）、`shaker\
  \ sort`（冒泡排序）、`merge sort`（合并排序）。\n\n2. 要求用户以表达式的形式输入普通的算术表达式，每个运算符限制为单个数字整数。将中缀表达式转换为后缀表达式。\n\
  \n3. 要求用户输入一组整数，将其插入二叉搜索树中，并实现包含中序遍历和后序遍历的 `BST` 抽象数据类型。\n\n### 解决方案\n\n\n\n\n\n\
  ```python\n# 必要的库\nimport tkinter as tk\nfrom tkinter import ttk\n\n# 随机模块以生成随机数\n\
  import random\nimport time\n\n# 声明和/初始化全局变量和控件\nglobal tab1, tab2, tab3, tab4, tab5\n\
  global i, j, k, mergeComp\nglobal textVar\nglobal winLabel\nglobal tempText\nglobal\
  \ list\n\n# ----------- 案例研究 - A 部分：排序 -----------\n\n## 冒泡排序\n```def bubbleSort(size):\n\
  \    global list\n    comparisons = 0\n\n    # 计时\n    startTime = time.process_time()\n\
  \n    # 冒泡排序算法\n    for i in range (size - 1):\n        for j in range (size - 1):\n\
  \            comparisons += 1\n            if (list[j] > list[j + 1]):\n       \
  \         temp = list[j]\n                list[j] = list[j + 1]\n              \
  \  list[j+1] = temp\n\n    # 结束计时\n    endTime = time.process_time()\n\n    listToString\
  \ = ' '.join(map(str, list))\n    winLabel1 = tk.Label(tab1,\n        text = \"\
  The sorted list is: \" + listToString)\n    winLabel1.grid(column = 1, row = 1)\n\
  \    winLabel2 = tk.Label(tab1,\n        text = \"The number of comparisons is =\
  \ \" + str(comparisons))\n    winLabel2.grid(column = 1, row = 3)\n    winLabel3\
  \ = tk.Label(tab1, text=\"The elapsed time in seconds = \" +\n        str(endTime\
  \ - startTime))\n    winLabel3.grid(column = 1, row = 5)\n```\n\n## 插入排序\n```def\
  \ insertionSort(size):\n    global list\n    comparisons = 0\n\n    # 计时\n    startTime\
  \ = time.process_time()\n\n    # 插入排序算法\n    for i in range(1, size):\n        temp\
  \ = list[i]\n        loc = i\n        while ((loc > 0) and (list[loc - 1] > temp)):\n\
  \            comparisons += 1\n            list[loc] = list[loc - 1];\n        \
  \    loc = loc - 1\n        list[loc] = temp\n\n    # 结束计时\n    endTime = time.process_time()\n\
  \n    listToString = ' '.join(map(str, list))\n    winLabel1 = tk.Label(tab2,\n\
  \        text = \"The sorted list is: \" + listToString)\n    winLabel1.grid(column\
  \ = 1, row = 1)\n    winLabel2 = tk.Label(tab2, text=\"The number of comparisons\
  \ is = \" +\n        str(comparisons))\n    winLabel2.grid(column = 1, row = 3)\n\
  \    winLabel3 = tk.Label(tab2, text=\"The elapsed time in seconds = \" +\n    \
  \    str(endTime - startTime))\n    winLabel3.grid(column = 1, row = 5)\n```\n\n\
  ## 辣椒粉排序\n```def shakerSort(size):\n    global list\n    comparisons = 0\n\n   \
  \ # 计时\n    startTime = time.process_time()\n\n    # 辣椒粉排序算法\n    swapped = True;\
  \ start = 0; end = size - 1\n\n    # 只要发生交换就继续运行辣椒粉排序\n    while (swapped == True):\n\
  \        # 设置交换为假以开始新循环\n        swapped = False;\n\n        # 使用冒泡排序从左到右循环\n  \
  \      for i in range(start, end):\n            comparisons += 1\n            if\
  \ (list[i] > list[i + 1]):\n                temp = list[i]; list[i] = list[I + 1]\n\
  \                list[I + 1] = temp; swapped = True;\n        # 如果没有交换，说明列表已排序\n\
  \        if (swapped == False):\n            break\n        # 如果至少发生一次交换，则将交换置假\n\
  \        # 并继续\n        else:\n            swapped = False\n        # 列表末端减 1，因为又一个最大的\n\
  \        # 元素移动到了右侧\n        end -= 1\n\n        # 使用冒泡排序从右到左循环\n        for i in\
  \ range(end, start, -1):\n            comparisons += 1\n            if (list[i]\
  \ < list[i - 1]):\n                temp = list[i]; list[i] = list[i - 1]\n     \
  \           list[i-1] = temp; swapped = True\n        # 列表起始增加 1，因为更多最小的\n     \
  \   # 元素移动到了左侧\n        start += 1\n    # 结束计时\n    endTime = time.process_time()\n\
  \n    # 输出输出\n    listToString = ' '.join(map(str, list))\n    winLabel1 = tk.Label(tab3,\
  \ text = \"The sorted list is: \" +\n        listToString)\n    winLabel1.grid(column\
  \ = 1, row = 1)\n    winLabel2 = tk.Label(tab3, text=\"The number of comparisons\
  \ is = \" +\n        str(comparisons))\n    winLabel2.grid(column = 1, row = 3)\n\
  \    winLabel3 = tk.Label(tab3, text=\"The elapsed time in seconds = \" +\n    \
  \    str(endTime - startTime))\n    winLabel3.grid(column = 1, row = 5)\n```\n\n\
  ## 合并排序\n```def merge(first, middle, last):\n    global list\n    global i, j, mergeComp\n\
  \    size1 = middle - first + 1; size2 = last - middle\n\n    # 创建临时列表\n    leftList\
  \ = []; rightList = []\n\n    # 将原始列表的数据拷贝到临时列表\n    # leftList 和 rightList\n  \
  \  for i in range(0, size1):\n        leftList.append(list[first + i])\n    for\
  \ j in range(0, size2):\n        rightList.append(list[middle + 1 + j])\n\n    #\
  \ 将临时列表 leftList 和 rightList 合并到\n    # 原始列表直到一个子列表为空\n    i = 0; j = 0; k = first\n\
  \    while (i < size1 and j < size2):\n        if (leftList[i] <= rightList[j]):\n\
  \            list[k] = leftList[i]; i += 1\n        else:\n            list[k] =\
  \ rightList[j]; j += 1\n        mergeComp += 1\n        k += 1\n    # 如果 leftList\
  \ 为空，将剩余元素拷贝\n    # 到原始列表\n    while (i < size1):\n        list[k] = leftList[i];\
  \ i += 1; k += 1\n\n    # 如果 rightList 为空，将剩余元素拷贝\n    # 到原始列表\n    while (j < size2):\n\
  \        list[k] = rightList[j]; j += 1; k += 1\n```````def mergeSort(first, last):\n\
  \    global list\n    # 计时\n    startTime = time.process_time()\n\n    # 递归步骤\n\
  \    if (first <= last-1):\n        middle = (first + last)//2\n        mergeSort(first,\
  \ middle)\n        mergeSort(middle + 1, last)\n        merge(first, middle, last)\n\
  \n    # 结束计时\n    endTime = time.process_time()\n\n    # 输出\n    listToString =\
  \ ' '.join(map(str, list))\n    winLabel1 = tk.Label(tab4,\n        text = \"The\
  \ sorted list is: \" + listToString)\n    winLabel1.grid(column = 1, row = 1)\n\
  \    winLabel2 = tk.Label(tab4,\n        text = \"The number of comparisons is =\
  \ \" + str(mergeComp))\n    winLabel2.grid(column = 1, row = 3)\n    winLabel3 =\
  \ tk.Label(tab4,\n        text = \"The elapsed time in seconds = \" +\n        str(endTime\
  \ - startTime))\n    winLabel3.grid(column = 1, row = 5)\n```\n\n# ----- 排序函数调用\
  \ -----\n```def multiSorting():\n    global list\n    global i, j, k, mergeComp\n\
  \    list = []\n    i, j, k, mergeComp = 0, 0, 0, 0\n    size = 10\n\n    # 使用随机类的\
  \ randint() 方法生成\n    # 随机整数\n    for i in range(size):\n        newNum = random.randint(-100,\
  \ 100)\n        list.append(newNum)\n    # 调用排序函数\n    bubbleSort(size)\n    insertionSort(size)\n\
  \    shakerSort(size)\n    mergeSort(0, size - 1)\n```\n\n## 案例研究 B 部分：中缀表达式到后缀表达式\n\
  ```def infixToPostfix(infixExpression):\n    global textVar\n    global winLabel\n\
  \n    # 初始化运算符集合和优先级字典\n    OPERATORS = set(['+', '-', '/', ')', '^'])\n    PRIORITY\
  \ = {'+':1, '-':1, '/':2, '^':3}\n\n    # 初始化栈和输出\n    stack = []\n    Output =\
  \ ''\n\n    # 中到后缀转换\n    for ch in infixExpression:\n        if ch not in OPERATORS:\n\
  \            Output += ch\n        elif ch == '(':\n            stack.append('(')\n\
  \        elif ch == ')':\n            while stack and stack[-1] != '(':\n      \
  \          Output += stack.pop()\n            stack.pop()\n        else:\n     \
  \       while stack and stack[-1] != '(' and PRIORITY[ch] <= PRIORITY[stack[-1]]:\n\
  \                Output += stack.pop()\n            stack.append(ch)\n    while\
  \ stack:\n        Output += stack.pop()\n    textVar.set(Output)\n```````def createInfixPostfixGUI():\n\
  \    global textVar\n    textVar = tk.StringVar()\n\n    # 创建并初始化标签、按钮和文本框\n   \
  \ winLabel1 = tk.Label(tab5, text = 'Enter In Expression:')\n    winLabel1.grid(column\
  \ = 1, row = 1)\n\n    winLabel2 = tk.Label(tab5, textvariable = textVar)\n    winLabel2.grid(column\
  \ = 2, row = 3)\n\n    textVarLocal = tk.StringVar()\n    textVarLocal.set('(A *\
  \ B) + C - D')\n    winText = ttk.Entry(tab5, textvariable = textVarLocal)\n   \
  \ winText.grid(column = 2, row = 1)\n\n    winButtonConvert = tk.Button(tab5, text\
  \ = 'Convert to Postfix')\n    winButtonConvert.grid(column = 1, row = 3)\n    winButtonConvert.bind('<Button-1>',\n\
  \        lambda event: infixToPostfix(textVarLocal.get()))\n```\n\n## 案例研究 C 部分：BST\
  \ 后序遍历\n```class BinarySearchTree:\n    def __init__(self, key):\n        self.left\
  \ = None\n        self.right = None\n        self.data = key\n```\n```def insert(root,\
  \ newData):\n    if (root == None):\n        return BinarySearchTree(newData)\n\
  \    else:\n        if root.data == newData:\n            return root\n        elif\
  \ root.data < newData:\n            root.right = insert(root.right, newData)\n \
  \       else:\n            root.left = insert(root.left, newData)\n    return root\n\
  ```\n\n## 中序遍历\n```def traverseInorderBST(root):\n    global tempText\n\n    # 如果\
  \ BST 当前节点不是叶子节点，遍历左子树。\n    # 如果是叶子节点，打印其数据并遍历右子树\n    if (root):\n        traverseInorderBST(root.left)\n\
  \        tempText = tempText + ' ' + str(root.data)\n```\n\n\n\n\n\n# 输出：案例研究 第\
