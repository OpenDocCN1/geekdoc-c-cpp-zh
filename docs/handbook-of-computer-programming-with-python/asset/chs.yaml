  \ -3, -3, 8, 17, 23, 64, 64, 65, 78, 82, 83, 89]\nThe number of comparisons is =\
  \ 42\nThe elapsed time in seconds = 0.0\n```该算法在对静态列表排序时的效率与快速排序相当（完成一次比较需要 `1 nanosecond`；`1\
  \ nanosecond=1.0e-9 seconds`）：\n\n- `n=10`: ~20 次比较 (快速排序) -> 约 `2e-4 秒` (快速排序)\n\
  - `n=100`: ~5.4e2 次比较 (快速排序) -> 约 `0.0012 秒` (快速排序为 `1.2e-2`)\n- `n=1,000`: ~8.6e3\
  \ 次比较 (快速排序) -> 约 `0.015 秒` (快速排序为 `9.7e-3`)\n- `n=10,000`: ~1.2e5 次比较 (快速排序) ->\
  \ 约 `0.15 秒` (快速排序为 `0.1`)\n- `n=30,000`: ~4e5 次比较 (快速排序) -> 约 `0.44 秒` (快速排序为 `0.6`)\n\
  - `n=100,000`: ~1.5e6 次比较 (快速排序) -> 约 `1.6 秒` (快速排序为 `5.6`)\n- `n=300,000`: ~5e6\
  \ 次比较 (快速排序) -> 约 `5.5 秒` (快速排序为 48 秒)\n\n通常情况下，归并排序比快速排序更高效，因为它在所有情况下都运行在 `O(n\
  \ logn)` 的时间复杂度上（即*最好*、*平均*和*最坏*情况）。最重要的是，随着列表规模的增大（例如，包含数十万个或更多元素的列表），它的性能会显著提升，具体取决于运行系统的性能、内存和设置。\n\
  \n## 6.5 复杂数据结构\n\n在前面的章节中讨论了线性结构（如栈、队列和链表）。现在我们将讨论非线性结构。\n\n### 6.5.1 栈\n\n栈是一种后进先出的（LIFO）列表。除了顶部的元素外，栈中的元素无法直接访问。作为一个类比，你可以将栈想象成一叠盘子。新的盘子被放在顶部。在使用时，也从顶部取出。\n\
  \n从更正式的技术角度来说，栈 ADS（抽象数据结构）包含：\n\n- 一个指向顶部元素的索引，范围从 `0` 到其最大大小 `-1`。\n- 存储值的栈的主体。\n\
  \n- `初始化` `init(s)`：初始化栈（即创建一个空列表）。\n- `判空` `isEmpty(s)`：检查栈 `s` 是否为空。\n- `推送` `push(x,\
  \ s)`：向栈 `s` 推入新元素 `x`。\n- `弹出` `pop(x, s)`：从栈 `s` 删除顶部元素 `x`。\n- `查看` `top(s)`：返回栈顶部的元素。\n\
  - `大小` `size(s)`：返回栈中元素的总数。\n\n```python\nclass Stack:\n    def __init__(self):\n\
  \        self.items = []\n    def push(self, item):\n        self.items.append(item)\n\
  \    def pop(self):\n        return self.items.pop()\n    def isEmpty(self):\n \
  \       return self.items == []\n    def top(self):\n        if (not self.isEmpty()):\n\
  \            return self.items[-1]\n    def size(self):\n        return len(self.items)\n\
  \    def show(self):\n        return self.items\n```\n\n以下脚本从 *Chapter6Stack.py*\
  \ 导入栈类，以实现栈功能的一个简单示例：\n\n\n\n\n\n```python\n 1   import Chapter6Stack\n2\n3   fruits\
  \ = Chapter6Stack.Stack()\n4\n5   # 确认栈为空\n6   if (fruits.isEmpty() == True):\n\
  7       print (\"The stack is empty\")\n8\n9   # 将元素入栈\n10  fruits.push('apple')\n\
  11  fruits.push('orange')\n12  fruits.push('banana')\n13\n14  # 确认栈不为空并打印其内容\n15\
  \  if (fruits.isEmpty()!= True):\n16       print(\"The stack is not empty: It's\
  \ size is: \", fruits.size())\n17       print(\"The contents of the stack are: \"\
  , fruits.show())\n18\n19  # 返回栈顶元素\n20  print(\"The top item of the stack is: \"\
  , fruits.top())\n21  # 移除栈顶元素，打印新的栈顶元素和栈\n22  print(\"Remove the top item of the\
  \ stack: \", fruits.pop())\n23  print(\"The top item of the stack is now: \", fruits.top())\n\
  24  print(\"The contents of the stack now are: \", fruits.show())\n```\n\n**输出 6.5.1.a:**\n\
  \n```\n The stack is empty\nThe stack is not empty: It's size is: 3\nThe contents\
  \ of the stack are: ['apple', 'orange', 'banana']\nThe top item of the stack is:\
  \ banana\nRemove the top item of the stack: banana\nThe top item of the stack is\
  \ now: orange\nThe contents of the stack now are: ['apple', 'orange']\n```\n\n栈在计算机程序中被广泛使用。一个常见的例子是存储网页浏览器的访问历史。访问的每一个页面都会添加到栈中，当用户点击后退按钮时，从栈中取出最后访问的页面。类似的用法在大多数计算机应用程序包含的\
  \ `undo` 函数中也可以找到。栈被用于存储在应用程序中执行的所有任务，当用户点击相应的按钮时，从栈中取出上一次操作并撤销该操作。栈在`计算表达式`、`回溯`以及`实现递归函数调用`中也非常有用。\n\
  \n作为栈的一个实际用途示例，让我们考虑将十进制数转换为二进制的常用实用任务。该算法非常简单：重复将十进制数除以 2，直到结果为 0，同时将整数除法的余数推入栈。在过程结束时，从栈中弹出所有元素以得到该十进制数的二进制表示。假设要转换的整数是数字\
  \ `21`，上述过程将得到二进制数 `10101`（图 6.2）。\n\n![](img/Fig06_02.jpg)\n\n**图 6.2** 十进制转二进制数转换。\n\
  \n以下脚本实现了栈结构，利用了上一个示例中的 `Stack ADS`（`Chapter6Stack.py`）：\n\n```python\n 1   import\
  \ Chapter6Stack\n2\n3   # decimal 对象使用栈实现转换\n4   decimal = Chapter6Stack.Stack()\n\
  5\n6   # 接收一个整数转换为二进制格式\n7   userInput = int(input(\"Enter the integer to convert\
  \ to binary: \"))\n8\n9   # 重复除以 2；将余数推入栈\n10  while (userInput > 0):\n11      \
  \ decimal.push(userInput % 2)\n12       userInput = userInput//2\n13\n14  # 确认栈不为空并打印其内容\n\
  15  if (decimal.isEmpty()!= True):\n16       print(\"The stack is not empty: It's\
  \ size is: \", decimal.size())\n17       print(\"The contents of the stack are:\
  \ \", decimal.show())\n18\n19  # 返回二进制格式的数字\n20  print(\"The binary form of the\
  \ number is: \", end = '')\n21  for i in range (decimal.size()):\n22       print(decimal.pop(),\
  \ end = '')\n```\n\n**输出 6.5.1.b:**\n\n```\n Enter the integer to convert to binary:\
  \ 56\nThe stack is not empty: It's size is: 6\nThe contents of the stack are: [0,\
  \ 0, 0, 1, 1, 1]\nThe binary form of the number is: 111000\n```\n\n### 6.5.2 中缀、后缀、前缀\n\
  \n栈的另一个在计算机科学中特别重要的应用是`算术表达式的求值`。通常，读者应该意识到有三种算术表示法，即`中缀`（infix）、`前缀`（prefix）和`后缀`（postfix）。`中缀`是人类最习惯的，因为它涉及到出现在两个`操作数`之间的`二元运算符`，并确定它们之间将发生的操作类型（例如\
  \ `3 + 5`）。在`前缀`表示法中，相同的表达式将转换为 `+ 3 5`，其中运算符位于两个操作数之前。同样，`后缀`表示法的形式将为 `3 5 +`，运算符位于两个操作数之后。必须注意的是，后缀表示法是编译器在求值算术表达式时使用的。\n\
  \n以下算法使用栈来存储运算符：\n\n*   初始化栈。\n\n*   从左到右扫描中缀表达式。\n\n*   如果扫描到的字符是操作数，将其直接移动到后缀表达式中。\n\
  \n*   如果字符是运算符，将其与栈顶的运算符进行比较：\n\n    *   当栈顶运算符的优先级高于或等于该字符且不是左括号时，将运算符从栈弹出并移动到后缀表达式中。\n\
  \    *   如果栈为空或栈顶运算符的优先级较低或是左括号，则将该字符推入栈。\n\n*   如果字符是左括号，将其推入栈中。\n\n*   如果字符是右括号，从栈中弹出运算符并将它们移动到后缀表达式中。弹出左括号并忽略它。\n\
  \n*   在扫描完中缀后，从栈中弹出所有剩余的运算符。\n\n例如，图 6.3 说明了使用栈将中缀 `2 + 3 x 5 + 4` 转换为后缀。\n\n![](img/Fig06_03.jpg)\n\
  \n**图 6.3** 待求值的中缀表达式。\n\n*   2 + 3= 5 → 2 3 +\n*   2 x 5 + 3= 13 → 2 5 x 3 +\n\
  *   2 + 5 x 3= 17 → 2 5 3 x\n*   2 x 3 + 5 x 4= 26 → 2 3 x 5 4 x +\n*   2 + 3 x\
  \ 5 + 4= 21 → 2 3 5 x + 4 +\n\n图 6.4 和 6.5 展示了一个更复杂的中缀转后缀表达式转换案例，其中包含括号运算符：*2 x\
  \ (7 + 3 x 4) + 6*。\n\n![](img/Fig06_04.jpg)\n\n**图 6.4** 带括号的中缀转后缀 - 部分 A。\n\n\
  ![](img/Fig06_05.jpg)\n\n**图 6.5** 带括号的中缀转后缀 - 部分 B。\n\n\n\n\n\n- 在扫描完整个后缀表达式后，栈中应该只剩一项，即该表达式的值。\n\
  \n图 6.6 展示了如何使用栈评估表达式 `1 6 + 5 2 – x`。\n\n![](img/Fig06_06.jpg)\n\n图 6.6 评估后缀表达式。\n\
  \n### 6.5.3 队列\n\n队列也是一种线性结构，元素通过称为 `enqueue`（入队）的过程在的一端添加，并通过称为 `dequeue`（出队）的过程从另一端移除。两端被称为\
  \ `rear`（尾）和 `front`（头）。与栈不同，在队列中，**先添加的元素先移除**，因此它也被描述为先进先出（FIFO）结构。队列类比于买票或付账排队的人。排在最前面的人第一个被服务。\n\
  \n以下是队列结构的视觉化说明：\n\n![](img/un06_25.jpg)\n\n图 6.7 下展示了简单队列的执行：\n\n![](img/Fig06_07.jpg)\n\
  \n图 6.7 简单队列的执行。\n\n在计算机科学中，队列被广泛用于调度任务，例如打印或管理 CPU 进程。当多个用户提交打印作业时，打印机会队列所有作业，并按照先进先服务的原则进行打印。同样，当多个进程需要使用\
  \ CPU 时，执行顺序通过队列结构进行调度和执行。\n\n`queue ADS`（队列抽象数据类型）包含以下：\n\n- 指向队列 `front`（头）元素的索引。\n\
  - 指向队列 `rear`（尾）元素的索引。\n- 存储其值的队列体（即列表中的实际数据）。\n- `Initialize` – `init(q)`：初始化队列的函数（即创建一个空列表）。\n\
  - `Empty` – `isEmpty(q)`：检查队列是否为空的函数。\n- `Enqueue` – `enqueue(x, q)`：将元素添加到队列尾端的函数。\n\
  - `Dequeue` – `dequeue(x, q)`：返回队列头元素并将其从队列中移除的函数。\n- `Front` – `peek(q)`：返回队列头元素的函数。\n\
  - `Size` – `size(q)`：返回队列中元素数量的函数。\n\n下方提供的 Python 类（文件名：`Chapter6Queue.py`）是队列\
  \ ADS 的实现：\n\n```python\n class Queue:\n  # Initialize the queue\n     def __init__(self):\n\
  \     self.items = []\n\n  # Check whether the queue is empty\n     def isEmpty(self):\n\
  \     return self.items == []\n\n  # Add an item to the queue\n     def enqueue(self,\
  \ item):\n     self.items.insert(0,item)\n\n  # Delete an item from the queue\n\
  \     def dequeue(self):\n        if not self.isEmpty():\n            return self.items.pop()\n\
  \n     def peek(self):\n        if not self.isEmpty():\n            return self.items[-1]\n\
  \     def size(self):\n        return len(self.items)\n     def show(self):\n  \
  \      return self.items\n```\n\n以下脚本（文件名：`Chapter6QueueExample`）导入并运行了一个简单队列 ADS：\n\
  \n```python\n 1   import Chapter6Queue\n2\n3   q = Chapter6Queue.Queue()\n4   print(q.isEmpty())\n\
  5   q.enqueue('Task A')\n6   print(q.show())\n7   q.enqueue('Task B')\n8   print(q.show())\n\
  9   q.enqueue('Task C')\n10  print(q.show())\n11  print(q.dequeue()) # removes Task\
  \ A\n12  print(q.show())\n13  print(q.dequeue()) # removes Task B\n14  print(q.show())\
  \ # q has only one task left\n15  print(q.size())\n```\n\n**输出 6.5.3：**\n\n```\n\
  \ True\n['Task A']\n['Task B', 'Task A']\n['Task C', 'Task B', 'Task A']\nTask A\n\
  ['Task C', 'Task B']\nTask B\n['Task C']\n1\n```\n\n### 6.5.4 循环队列\n\n循环队列本质上与普通队列相同，但有两个主要区别。首先，循环队列的大小不会改变。这种大小限制可以被视为循环队列的主要缺点。其次，只要有足够的空空间且它们不相互冲突（即头和尾不能位于同一个列表索引上），它的头和尾就会根据\
  \ `enqueue` 和 `dequeue` 的需求以循环的形式不断移动。这是一个重要的观察，因为在循环队列中，**头元素存储在尾元素之前**是可能的。由于这些性质上的差异，循环队列\
  \ ADS 在向其添加新元素之前需要检查队列是否已满。图 6.8\n\n图 6.8 循环队列示例。\n\n以下脚本（文件名：`Chapter6CircularQueue`）导入并运行了队列\
  \ ADS 的实现：\n\n\n\n\n\n## 6.6 动态数据结构\n\n前几节描述的数据结构被描述为*静态的*，因为它们都使用了*本质上是静态的结构*。在某种程度上，需要大量内存、由于任务繁重导致性能低下的以及某种缺乏灵活性等问题，都可以在这些结构中找到溯源。为了解决这个问题，需要更高效的数据结构，它们仅在需要时以最有效的方式分配可用内存。属于这一类别的结构统称为*动态结构*。接下来的章节将介绍并简要讨论其中一些最重要的结构。\n\
  \n### 6.6.1 链表\n\n*链表*是一组通过指针相互连接的 `nodes` 集合。从定义上来说，这种结构是递归的。每个节点包含一个数据值和一个指向后续列表第一个节点的指针，如果后继列表为空，则指向\
  \ `null`。为了遍历链表，有必要创建一个名为 `head` 的独立对象，它始终指向列表的第一个节点。随后的节点通过存储在每个节点中的关联指针来访问。如果列表为空，`head`\
  \ 将简单地指向 `null` 值。同样，最后一个节点的链接指针被设置为 `null`，以标记列表的结束。只有一个 `head`，它始终指向列表的第一个节点。同样，只有一个\
  \ `tail`（即最后一个节点），指向 `null`。所有其他节点被称为 `intermediate`（中间）节点，它们既有前驱节点也有后继节点。向尾部*遍历*（即通过中间节点进行移动）从\
  \ `head` 指向的列表第一个节点开始。为了这一目的，最好是创建另一个通常称为 `current` 的对象，用于在列表的中间节点之间移动。\n\n链表的优势在于其数据是*动态地*存储的，仅在需要时才创建新节点，并在不再使用时删除不不需要的节点。除了数据之外，每个新创建的节点的指针都被设置为指向\
  \ `null`。节点可以存储任何数据类型，但链表的所有节点需要存储相同的数据类型。\n\n图 6.9 展示了链表的结构。注意 `head` 如何指向第一个节点，以及最后一个节点如何指向\
  \ `null`：\n\n\n\n\n链表的实现需要两个类。第一个是 `node` 类，它包含一个数据和一个指向 `next` 项的指针。对于创建的任何新节点，`next`\
  \ 都将指向 `null`。第二个是链表本身，它包含指向列表第一个项的 `head` 指针，以及用于遍历列表的 `current_node`。由于列表中没有项，`head`\
  \ 和 `current_node` 初始都将指向 `null`。\n\n`链表 ADS（抽象数据结构结构）` 包含以下操作：\n\n*   **实例化并初始化列表：**\
  \ 此函数用于创建 `head` 和初始指向 `null` 的当前对象（即空列表；图 6.10）。该函数的 Python 代码如下所示：\n\n    ![](img/Fig06_09.jpg)\n\
  \n    **图 6.9** 链表。\n\n    ![](img/Fig06_10.jpg)\n\n    **图 6.10** 新链表。\n\n    ```python\n\
  \    def __init__(self):\n        self.head = self.current_node = None\n    ```\n\
  \n*   **检查列表是否为空：** 此函数检查链表是否为空，如果是，则无法删除更多节点，任何新插入的节点必须是列表中的第一个。Python 代码如下：\n\n\
  \    ```python\n    def isEmpty(self):\n        current_node = self.head\n     \
  \   if (current_node == None):\n            return True\n    ```\n\n*   **读取并打印列表：**\
  \ 打印列表节点并提供其大小的信息（即它包含的节点数）通常很有用。为了做到，需要从第一个节点开始 `traverse`（即读取）列表。当 `current_node\
  \ value is not null` 时，在遍历列表时会依次读取/打印当前节点的值。图 6.11 用图表说明了这一过程。相关的 Python 代码如下所示：\n\
  \n    ![](img/Fig06_11.jpg)\n\n    **图 6.11** 遍历链表。\n\n    ```python\n    def readList(self):\n\
  \        count = 0\n        current_node = self.head\n        print(\"The current\
  \ list is: \", end = \" \")\n        while (current_node):\n            count +=\
  \ 1\n            print(current_node.data, \" \", end = \"\")\n            current_node = current_node.next\n\
  \        print(\"\\nThe size of the linked list is: \", count)\n    ```\n\n*   **在列表中插入新节点：**\
  \ 新节点既可以在列表为空时作为第一个元素插入，也可以作为最后一个元素 `appended`（追加）到列表中。在第一种情况下，会创建一个新节点（包括关联的数据），将其\
  \ `next` 元素设置为指向 `null`。最后，将 `head` 设置为指向新节点（图 6.12）。在向列表追加新元素的情况下，在创建新节点后，遍历列表直到到达最后一个节点。一旦完成，最后一个节点的\
  \ `next` 元素将设置为指向新创建的节点（图 6.13）。相关的 Python 代码如下所示：\n\n    ![](img/Fig06_12.jpg)\n\
  \n    **图 6.12** 插入第一个节点。\n\n    ![](img/Fig06_13.jpg)\n\n    **图 6.13** 向列表追加节点。\n\
  \n    ```python\n    def append(self, data):\n        # Create the newNode to append\
  \ the linked list\n        newNode = Node(data)\n\n        # Case 1: List is empty\n\
  \        if (self.head == None):\n           self.head = newNode\n           Return\n\
  \n        # Case 2: If the list is not empty start the \n        # current node\
  \ at the head of the list\n        current_node = self.head\n\n        # Loop through\
  \ the linked list untill the current node\n        # has Next pointing to None\n\
  \        while (current_node.next):\n           current_node = current_node.next\n\
  \n        # Add new node to the end of the list\n          current_node.next = newNode\n\
  \    ```\n\n*   **删除节点：** 此操作首先检查链表是否为空。如果不是，则搜索必须删除的数据。如果未找到数据，列表保持原样。如果找到了数据，列表保持原样。这里有两种情况需要考虑。这种情况是是要删除的节点是第一个。图\
  \ 6.14 用图表说明了这一过程。如果找到了数据，被删除节点之前的 `next` 指针将指向其后续节点。最后，删除节点被移除。以下 Python 脚本演示了删除操作：\n\
