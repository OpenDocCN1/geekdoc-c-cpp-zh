  6. Oracle. (2021b). [Oracle.com](http://Oracle.com).\n\n\n\n\n\n# 数据分析\n\n为“数据分析”这一术语下一个正式定义可能比较困难，因为它在当代商业和学术背景下是一个相对新颖且宽泛的概念。然而，一种可能的描述是：该术语指的是对各种来源的数据进行高效分析，以产生辅助决策过程的有意义的结果。如果将其扩展以涵盖大数据分析，那么正如相关的相关的当代文献指出的，相关数据预计将来自多种来源、具有极高的速度（即频率）、海量的规模以及多种格式。`data\
  \ visualization`是另一个相对新颖的概念，它指的是以各种`charts`（图表）的形式展示数据分析结果的常用机制，这些形式可以通过可视化工具提供，也可以通过编程库中的内置方法实现。\n\
  \n快速查阅任何与数据分析相关的书籍或资源，都会发现该过程在很大程度上是相同的，任何细微的差异也很可能与术语有关，而非功能和结构。后者包括以下七个步骤：\n\n\
  *   **研究目标/研究问题：** 数据分析过程的第一部分经常被忽略，因为它可能被认为是一个显而易见的步骤。然而，它是整个过程中至关重要的部分，需要投入精力来开发。更复杂的是，这是一项纯粹的调查性质的任务，因此在特定和自动化工具方面的支持有限。它基本上是一个寻求为任何特定时刻的任务建立待解决的目标和问题的过程。详细讨论这些概念超出了本章的范围。如需更多信息，鼓励读者参考与研究方法和方法论相关的文献。\n\
  *   **数据获取：** 读取存储在各种格式和来源中的数据的过程，包括`spreadsheets`电子表格）、`comma separated files`逗号分隔文件）、网页和数据库。一旦读取了数据，它们将被存储在名为`data\
  \ frame`（数据帧）的特定变量中以便进一步处理。\n*   **数据清洗：** 虽然在获取过程中收集完整无错误的数据是非常理想的，但这种情况并不常见。鉴于数据是由不熟悉数据输入的用户输入的，遇到此类问题是非常可能且符合预期的。`data\
  \ cleaning`（数据清洗）过程专注于消除这类错误。\n*   **探索性分析：** 这是一个在数据清洗之后的过程，目的是识别和总结数据的主要特征。它通常涉及`descriptive\
  \ statistics`（描述性统计）方法的应用和分析。\n*   **建模与验证：** 此过程涉及部署高级工具和技术（如机器学习）来构建与数据相关的模型。这项任务涵盖了广泛深入的研究领域和专业知识，超出了本章的范围。\n\
  *   **结果可视化：** 此任务涉及使用各种设施和编程库来创建图表，有助于数据可视化并辅助决策过程。\n*   **报告：** 编写与数据相关的最终报告，包括任何结论和建议。\n\
  \n显然，该过程涉及多个专业领域，包括`databases`数据库和数据挖掘、人工智能/机器学习、统计学、社会科学等。正是这种整个过程的跨学科性质，导致了广泛使用的`data\
  \ science`（数据科学）术语。\n\n如所述，用于数据处理和可视化的主要 Python 包有`Pandas`、`Numpy`、`Matplotlib`、`Scipy`和`Seaborn`。具体而言，这些库的主要特征如下：\n\
  \n*   **NumPy：** 一个针对单维和多维数组优化的库。适用于机器学习和统计分析任务的工具。\n*   **Pandas：** 一个基于`NumPy`的易于使用的开源库。它在处理一维和二维数据（分别为`Series`和`DataFrame`）时表现非常好。它是统计分析任务的良好选择。\n\
  *   **SciPy：** 另一个基于`NumPy`的库。与`NumPy`相比它提供了额外的功能，使其成为机器学习和统计分析任务的可靠选择。\n*   **Matplotlib：**\
  \ 一个适用于创建基础图表的低级`plotting`绘图）库。虽然它为程序员提供了很大的自由，但在代码要求方面可能要求较高。必须意识到 Matplotlib 无法直接处理分析。因此，在绘图之前需要解决这个问题。\n\
  *   **Python’s Statistics：** 用于描述性统计的内置 Python 库。当数据集不是太大时，它的效果很好（Statistics — Mathematical\
  \ Statistics Functions, 2021）。\n\n在本章中，读者将有机会获得清洗和描述数据以及执行数据可视化的基本技能，同时熟悉与这些任务相关的一些流行库。本章分为四个主要部分：\n\
  \n*   **数据获取与清洗：** 从各种类型的源导入、重新编排和清洗数据。\n*   **数据探索：** 根据需要，通过选择、排序、过滤、分组和/或重新计算行/列来报告数据。\n\
  *   **数据处理/描述性统计：** 在数据帧上应用简单的描述性统计。\n*   **数据可视化：** 使用各种 Python 包提供的可用方法进行数据可视化。\n\
  \nExcel 文件 `Grades.xlsx`和`Grades2.xlsx` 用于本章介绍的所有示例。\n\n## 8.2 导入和清洗数据\n\n在讨论用于分析的数据导入过程之前，有两个需要介绍的关键术语：`arrays/lists`（数组/列表）和`data\
  \ frames`（数据帧）。与 C++ 或 Java 等其他常用编程语言不同，Python 中没有独立的数组对象。相反，此功能由列表提供（如第 2 节所述）。\n\
  \n`data frame`是一种类似于关系数据库表或由行和列组成的 Excel 表格的数据结构。`rows`对应数据帧的实际记录，通过索引号访问。`columns`对应数据库表中的属性/列/字段，通过名称访问。`index`是数据帧的第一列（即从\
  \ 0 开始）。\n\n### 8.2.1 数据获取：导入和查看数据集\n\n为了创建用于从源读取数据并创建数据帧的对象，需要 Pandas 库。它支持各种数据源和格式，包括`Excel`和`Comma\
  \ Separated Values (CSV)`（逗号分隔值）文件、`tables`表格、纯文本、数据库或基于 Web 的源。在所有情况下，从源读取的基本过程都是相同的。然而，取决于源，使用的方法和参数可能会略有不同。\n\
  \n在从 Excel 文件读取数据的情况下，通用语法如下：\n\n```\n<name of data frame> = <name of Pandas\nobject>.read_excel(\"\
