  ```\n\n### 11.2.4 使用 Python 求解方程组\n\nPython 提供了一种将方程组视为 `matrices` 来进行求解的方便方法。其背后的思想是获取一组方程，产生相关的矩阵（即一个包含变量系数的矩阵，另一个包含每个方程结果的矩阵），并调用\
  \ `Numpy` 库中的 `solve()` 方法。考虑以下三个方程组的示例：\n\n$x - 3y + 2z = 10$\n$-4x - 3y - 9z =\
  \ 3$\n$2x + 4y + 3z = 6$\n\n首先，产生以下变量系数矩阵：\n$\\begin{bmatrix} 5 & -3 & 2 \\\\ -4\
  \ & -3 & -9 \\\\ 2 & 4 & 3 \\end{bmatrix}$\n\n接下来是其解的矩阵：\n$[10, 3, 6]$\n\n最后，调用\
  \ `solve()` 方法，产生 `x`、`y` 和 `z` 的对应解：\n\n```python\nimport numpy as np\n# 假设有以下方程组：\n\
  # 5x - 3y + 2z = 10\n# -4x - 3y - 9z = 3\n# 2x + 4y + 3z = 6\n# 使用 solve() 求解方程\n\
  # 创建一个 3x3 矩阵并显示内容\nequations = np.array([[5, -3, 2], [-4, -3, -9], [2, 4, 3]])\n\
  results = np.array([10, 3, 6])\nprint(\"\\nThe solution for x, y, and z is:\\n\"\
  ,\n      np.linalg.solve(equations, results))\n```\n\n**输出 11.2.4:**\n\n```\nThe\
  \ solution for x, y, and z is:\n [3.9022564 1.466154 -2.556398]\n```\n\n###11.2.5\
