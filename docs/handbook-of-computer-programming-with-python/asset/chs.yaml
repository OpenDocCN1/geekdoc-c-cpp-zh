  \n### 5.2.2 带有选项的消息框\n\n消息框通常用于获取用户对运行时过程的确认。在这些情况下，该对象不再仅仅是显示信息，而是必须提示用户确认他们对特定过程执行的许可与（或不批准）。与简单消息一样，带有选项的消息框也有多种可用选项，取决于所请求的确认类型。然而，这两种类型的消息之间存在两个主要区别。首先，在选项消息的情况下，用户做出的选择可能会改变后续过程的执行顺序，这与简单消息框形成对比。输入的类型和格式取决于消息类型（例如\
  \ `OK-Cancel`、`Retry-Cancel`、`Yes-No`）。其次，用户的选择具有实体的值，该值可以存储在变量中，并与其他预定义值进行比较，以确定执行流。在\
  \ `OK-Cancel`、`Retry-Cancel` 和 `Yes-No` 的情况下，这些值是 `True` 或 `False`（不带引号且区分大小敏感）；在问题消息框的情况下，这些值为\
  \ `‘Yes’` 或 `‘No’`（带单引号且区分大小敏感）。\n\n以下 Python 脚本提供了一个集成了所有四种类型选项消息的简单示例。脚本还使用了简单消息框的\
  \ `showinfo()` 和 `showerror()` 方法：\n\n\n\n\n\n```python\n# Import libraries\nimport\
  \ tkinter as tk\nfrom tkinter import messagebox\n\n# 定义 optionMessage() 函数，点击按钮时调用\n\
  def optionMessage(a):\n    if (a == 1):\n        response = messagebox.askokcancel(title\
  \ = \"ok-cancel Message\",\n            message = \"Clicked the OK-Cancel message\"\
  , icon = 'info')\n        if (response == True):\n            messagebox.showinfo(\"\
  Info Message\", \"Clicked OK\")\n        elif (response == False):\n           \
  \ messagebox.showerror(\"Error Message\", \"Clicked Cancel\")\n    elif (a == 2):\n\
  \        response = messagebox.askquestion(title = \"question Message\",\n     \
  \       message = \"Clicked the question message\", icon = 'info')\n        if (response\
  \ == 'yes'):\n            messagebox.showinfo(\"Info Message\", \"Clicked Yes\"\
  )\n        elif (response == 'no'):\n          messagebox.showerror(\"Error Message\"\
  , \"Clicked No\")\n    elif (a == 3):\n        response=messagebox.askretrycancel(title=\"\
