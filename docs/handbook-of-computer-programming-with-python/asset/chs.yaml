  \ | *** |\n    | **** | ******* | ******* | **** |\n    | ***** | ****** | ******\
  \ | ***** |\n    | ****** | ***** | ***** | ****** |\n    | ******* | **** | ****\
  \ | ******* |\n    | ******** | *** | *** | ******** |\n\n2.  编写一个脚本，提示用户输入整数值并计算它们的平均值。使用\
  \ `for` 语句根据用户输入接收并累加整数序列。\n\n3.  一家邮购公司销售五种不同的产品，代码和零售价格如下：`001 = $2.98`，`002 =\
  \ $4.50`，`003 = $9.98`，`004 = $4.49`，`005 = $6.87`。编写一个脚本提示用户：产品编号和数量。脚本应计算所有销售商品的总价值。\n\
  \n### 2.12.4 方法\n\n1.  编写一个使用方法的脚本：（a) 连续向二维列表接受整数，直到用户输入退出值（例如 0），（b）找到并显示每行每列的最小值，（c）找到并显示每行每列的最大值，以及（d）找到并显示每行每列的平均值。\n\
