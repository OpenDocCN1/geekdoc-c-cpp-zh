  \ posx, posy\nglobal winFrame\nglobal progressBar\n\n# 打开交通灯和汽车图像并创建相应的指针 \ndef\
  \ photos():\n    global image1, image2, image3, image4\n    global photo1, photo2,\
  \ photo3, photo4\n\n    image1 = Image.open(\"TrafficLightsGreen.gif\")\n    image1\
  \ = image1.resize((50, 100), Image.ANTIALIAS)\n    photo1 = ImageTk.PhotoImage(image1)\n\
  \n    image2 = Image.open(\"TrafficLightsYellow.gif\")\n    image2 = image2.resize((50,\
  \ 100), Image.ANTIALIAS)\n    photo2 = ImageTk.PhotoImage(image2)\n\n    image3\
