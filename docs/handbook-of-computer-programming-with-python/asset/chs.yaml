  \ 引言\n\n大多数 IT 专业人士和学者同意计算机的特殊之处在于：它们能够以极快的速度对大量数据进行操作。从这两个基础计算思维要素产生了*算法*和*程序*的概念，作为处理和操作数据的手段。在计算机科学、信息系统和信息技术领域，数据的逻辑和物理组织属于更广泛的数据库背景。对数据库相关的各种概念及其结构化设计的深入分析超出了本书的范围。读者可以参考\
  \ Elmasri & Navathe (2017) 获取信息。本章的重点是 Python 编程与一种常见的数据库：*关系型数据库*之间的交汇点。\n\n\n\n\
  \n在关系型数据库中，有三种主要的脚本技术和/或语言用于执行各种相关任务，即`数据定义语言 (DDL)`、`数据操纵语言 (DML)` 和`查询 (Queries)`。DDL\
  \ 用于创建、显示、修改或删除数据库及其结构和表，它与`数据库模式 (database schema)`或`元数据 (metadata)` 相关。DML 用于向各种表中插入数据，并根据需要修改或删除这些数据。它涉及`数据库实例\
  \ (database instance)`或`状态`。查询用于以多种不同的方式显示数据。大多数商用的`数据库管理系统（DBMS）` 都集成了利用这三种机制的功能和工具。\n\
  \n本章选择的 DBMS 是 `MySQL` (2021)。它是一个软件包的一部分，该包包含了 DBMS 和名为 `Apache` (2021) 的本地服务器解决方案。该软件包支持\
  \ Windows 和 Mac OS 系统，这两个相关版本统称为 `MAMP`。这些软件包可以免费下载自 MAMP (2021) 和 Oracle (2021b)，安装过程非常直观且简单。虽然深入学习和理解任何给定系统的工具和技术总是有益的，但必须注意，为了练习和执行本章介绍的示例，不需要具备\
  \ MAMP 的先验知识或实践经验。虽然示例使用了 `MySQL` DBMS 和 `Apache` 服务器，但这只需简单的登录并激活它们，然后访问创建的数据库。本章提供的脚本将完成所有必要的工作，而结果将出现在相关的\
  \ `MySQL` 数据库中。\n\n本章将涵盖以下主题：\n\n*   **DDL（数据定义语言）：** 创建数据库并连接到数据库。修改、删除或显示数据库表、结构和属性。\n\
  *   **DML（数据操纵语言）：** 在表中插入、修改和删除记录。\n*   **查询：** 以多种不同的方式显示一张或多个表的记录。\n*   使用 `GUI\
  \ 编程`，特别是 `Grid` 组件，使用 Python 创建美观的数据库应用程序。\n\n需要注意的是，虽然精通数据库专业知识并非必不可，但可能需要良好地理解`第\
  \ 4 章: 使用 Python 进行图形用户界面编程`和`第 5 章: 使用 Python 进行应用开发`中引入的概念和技术。理想情况下，读者应该熟悉之前所有介绍性章节引入的主要概念，因为这些概念许多将在此处介绍的示例中利用或集成。\n\
  \n## 7.2 数据定义语言的脚本\n\n如所述，MAMP 将提供本章介绍示例所需的某些工具。必须根据需要下载并安装 MAMP 软件包。安装完成后，必须启动\
