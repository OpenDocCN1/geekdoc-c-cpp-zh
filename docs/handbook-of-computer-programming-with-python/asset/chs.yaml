  \ 参数明确定义（第 129–130 行）。`test_size` 参数指的是将数据集分为*训练*和*测试*部分，在本例中为 75% 和 25%。\n\n留出验证的替代方案是*交叉验证*技术，它通过采样来选择训练数据。在这种方法中，每次迭代选择一个固定大小的数据块进行训练。该技术也适用于较小的数据集，但每次迭代的采样会导致大量的计算需求，从而消耗更多的\
  \ CPU 周期。交叉验证的主要类型有*留一法*（leave-p out）和*K 折交叉*（k-fold）。在*K 折交叉*的情况下，最常用的选择是十折（即 `k=10`）。交叉验证语句的示例例如：\n\
