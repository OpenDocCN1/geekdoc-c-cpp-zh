  \ 基础移动\n\n除了更改化身对象状态外，`vizact` 库提供了一种创建复杂化身对象运动的简单方法，例如以控制的方式行走、转身或移动角色的不同部位。\n\n\
  \n\n\n当 Jane 或鸽子处于行走模式时触发了某个状态，它们看起来像是在漂浮。这种不一致性的原因是，最初创建用于通过 `jane_state` 和 `pigeon_state`\
  \ 函数控制 Jane 和鸽子状态的 `ontimer()` 命令，偶尔会在*行走动作仍在进行中时对预设的行走动画进行覆盖*）*。为了解决这类问题，必须控制脚本的逻辑顺序和结构。例如，在\
  \ Jane 移动的情况下，可以通过停止相应的计时器来禁用随机状态分配：\n\n```\n[…]\n\njane_state_timer.setEnabled(0)\n\
  jane_walk = vizact.walkTo([-3, 0, 2])\njane.addAction(jane_walk)\njane_turn = vizact.turn(150)\n\
  jane.addAction(jane_turn)\n\n[...]\n```\n\n`setEnabled(0)` 命令会停止 `jane_state_timer`\
  \ 为 Jane 触发不同的状态。通过传递值 `1` 作为参数可以重新恢复它的作用。\n\n解决此类重叠问题的另一种方法是在同一个计时器和结构下控制化身对象的动画状态和移动，而不是分开控制。在当前的脚本中，对于鸽子的情况，可以选择将状态的随机化和移动统一在一个函数中。这将允许在任何给定时间更精确地控制每个对象的状态，并防止状态的改变覆盖任何特定鸽子的同时移动。对于这种控制，VR\
  \ 开发人员需要利用使用 `if…else` 语句的简单逻辑控制结构（参考第 2 章）。将现有的 `pigeon_state` 函数修改为：\n\n```python\n\
  def pigeon_state_move(rand_pigeon):\n    random_switch = random.choice([1, 2])\n\
  \    if (random_switch == 1):\n       rand_pigeon.clearActions()\n       x = int(random.choice([1,\
  \ 3]))\n       rand_pigeon.state(x)\n    else:\n       walk = vizact.walkTo([random.randint(-5,\
  \ 5), 0, random.randint(0, 8)])\n       rand_pigeon.addAction(walk)\n\npigeon_state_timer\
  \ = vizact.ontimer(1, pigeon_state_move,\nvizact.choice(pigeons))\n```\n\n这将允许以互斥的方式控制任何特定鸽子的状态和移动，避免状态/移动的重叠。在函数开头添加了一个随机值生成器。这是为了确定函数的当前迭代是改变鸽子的\
  \ a) 状态还是 b) 移动。注意，在 `if…else` 语句的开头添加了 `clearActions()` 命令。这会清除在之前的迭代中可能添加到此只鸽子的所有先前操作（例如行走动画）。这样，鸽子要么改变状态，要么移动到新位置，但现在行走时改变状态的可能性已经得到了控制。为了提高清晰度，可以将上述结构放置在鸽子创建部分的正下方。\n\
  \n上述解决这一逻辑问题的方案可能不是最优或最合适的。然而，提供这些方案是为了鼓励读者在构建和控制各种对象动作的顺序及通用逻辑时，开始创造性地思考。这不仅是 VR\
  \ 开发的重要部分，也是通用编程的重要部分，而且是一个非常广泛的主题，无法在单本书章节中进行分析。\n\n作为本节的最后注释，一旦在 3D 世界中添加了动画和移动，用户可能会注意到物体边缘出现一些渲染*伪影*（artefacts）和*锯齿*（aliasing）。Vizard\
  \ 提供了 `viz.setMultiSample()` 方法来平滑此类效果。在脚本开头的 `viz.go()` 命令之前添加以下行：\n\n```python\n\
  viz.setMultiSample(4)\n```\n\n将在渲染 3D 世界时提供*抗锯齿*处理。作为参数传递的数字决定了抗锯齿修正的分率，可以根据效果的严重程度和系统的计算能力进行调整。\n\
