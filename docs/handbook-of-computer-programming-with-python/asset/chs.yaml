  \ in USD:',\n135         width=24)\n136     speedLimit.config(bg = 'light blue',\
  \ fg = 'yellow', bd = 2,\n137         font = 'Arial 14 bold')\n138     speedLimit.grid(column\
  \ = 0, row = 0)\n139     fine = tk.Label(FineFrame, text = 'No fine',\n140     \
  \    width=24)\n141     fine.config(bg = 'light blue', fg = 'red', bd = 2,\n142\
