  \    selectionsFrame.config(bg = 'light grey', fg = 'red', bd = 2, relief = 'sunken')\n\
  \    selectionsFrame.grid(column = 0, row = 0)\n\n    # 创建包含数据库中可用表的组合选择框\n    tablesLabel\
  \ = tk.Label(selectionsFrame, text = \"可用表格:\", bg = \"light grey\")\n    tablesLabel.grid(column\
  \ = 0, row = 0)\n    tablesCombo = ttk.Combobox(selectionsFrame, textvariable =\
  \ tableName, width = 15)\n    tablesCombo['values'] = tables; tablesCombo.current(0)\n\
  \    tablesCombo.grid(column = 1, row = 0)\n\n    # 按钮根据选择的表更新属性框\n    updateAttributesButton\
