  # 附录案例研究解答\n\n## 第 2 章 – Python 编程\n\n### 描述\n编写一个`Python application`，显示以下菜单并根据用户的输入运行相应的函数：\n\
  \n1. 身体质量指数计算器。\n2. 检查客户信誉。\n3. 检查五位数字是否为回文。\n4. 将整数转换为二进制系统。\n5. 初始化整数列表并对其排序。\n\
  6. 退出。\n\n应用程序组件的具体要求：\n\n* **身体质量指数计算器：** 读取用户以公斤为单位的体重和以米为单位的身高，计算并显示用户的身体质量指数。公式为：`BMI\
  \ = (weightKilos)/(heightMeters × heightMeters)`。如果 `BMI` 值小于 `18.5`，显示消息 `Underweight:\
  \ less than 18.5`。如果处于 `18.5` 到 `24.9` 之间，显示消息 `Normal: between 18.5 and 24.9`。如果处于\
  \ `25` 到 `29.9` 之间，显示消息 `Overweight: between 25 and 29.9`。最后，如果大于 `30`，显示消息 `Obese:\
  \ 30 or greater`。\n\n* **检查百货商店客户余额：** 判断百货商店客户的超过记账账户的信用额度。对于每个客户，用户需要输入以下信息：\n\
  \    1. 账号。\n    2. 月初余额。\n    3. 该客户本月所有费用的总和。\n    4. 该客户本月所有贷记的总和。\n    5. 允许的信誉额度。\n\
