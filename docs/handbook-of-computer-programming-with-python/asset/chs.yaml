  \ 3D 世界应该显示出迹迹。然而，使 VR 特殊的主要元素之一仍然缺失。与传统的线性沉浸式媒体相比，VR 的基本特征之一是交互性。交互适用于 VR 体验的许多方面，例如用户与\
  \ 3D 世界之间的交互、不同 3D 对象之间的交互，或者环境特定元素对用户输入的反应方式。为用户提供具体且设计良好的交互系统是一个相当复杂的过程，涉及详尽的规划、技术能力理解以及大量的原型设计和测试。在本节中，将介绍一些基础概念，以便读者理解设计\
  \ VR 交互系统的逻辑和挑战。此类主题的更多信息可以在更广泛涵盖 VR 开发的著作中找到，例如 Sherman 和 Craig 的《Understanding\
  \ Virtual Reality: Interface, Application and Design》（Sherman & Craig, 2018）以及 Glover\
  \ 和 Lineses 的《Complete Virtual Reality and Augmented Reality Development with Unity》（Glover\
  \ & Lineses, 2019）。\n\n\n\n\n在最基础的形式下，交互系统可能由简单的键盘或鼠标命令，或触发特定 `events` 和 `behaviors`\
  \ 的用户移动组成。在 Vizard 中，允许 VR 开发者处理此类任务的命令之一是来自 `vizact` 库的 `onkeydown()` 方法。该方法判断特定的键是否被按下，并据此执行任何相关操作。例如，可以使用键盘指示\
  \ Jane 去跳舞。在要求 Jane 这么做之前，最好从之前创建的脚本末尾删除以下控制 Jane 行走和转动自动化的代码：\n\n```\njane_state_timer.setEnabled(0)\n\
  jane_walk = vizact.walkTo([-3, 0, 2])\njane.addAction(jane_walk)\njane_turn = vizact.turn(160)\n\
  jane.addAction(jane_turn)\n```\n\n将已删除的行替换为以下内容：\n\n```\nvizact.onkeydown('d', jane.state,\
  \ 5)\n```\n\n当按下键盘上的 `d` 键时，Jane 就会跳舞。Jane 将恢复到由下一个 `jane_state_timer` 触发（`jane_state`\
  \ 函数）决定的随机状态之一，因为用于停止这种现象的 `jane_state_timer.setEnabled(0)` 命令被删除了。\n\n上面的操作是一个相当细微的任务，对\
  \ VR 体验的提升不大。用户可能想要再次将跳舞命令替换为以下行：\n\n```\njane_state_timer.setEnabled(0)\nwalk_to_camera\
  \ = vizact.walkTo([viz.MainView.getPosition()[0], 0,\nviz.MainView.getPosition()[2]\
  \ + 3])\njane.addAction(walk_to_camera)\n```\n\n这段代码将首先停止 `jane_state_timer`，然后让\
  \ Jane 向相机走去。`walkTo()` 方法的坐标 x 和 y 坐标是通过相关的 `getPosition()` 列表元素获取并基于其计算的。如果 VR\
  \ 开发者希望 Jane 仅在特定事件发生时（例如，按下某个特定按钮时）才跟随相机，则可以将上述行放入一个函数中按需调用：\n\n```python\ndef\
  \ jane_walk():\n    jane_state_timer.setEnabled(0)\n    walk_to_camera = vizact.walkTo([viz.MainView.getPosition()[0],\
  \ 0,\n    viz.MainView.getPosition()[2] + 3])\n    jane.addAction(walk_to_camera)\n\
  \nvizact.onkeydown('w', jane_walk)\n```\n\n通过随机化 Jane 移动到用户指定地点的意愿，也可以增加 Jane 在行为和对用户输入反应方面的某种独立性，从而为她的行为增加真实感。这个想法可以进一步扩展为更复杂的交互系统，基于\
  \ Jane 表面上随机的情绪，以及通过输入命令控制用户礼貌程度和耐心水平的能力。这是对读者需要注意的另一个元素的极简介绍：人们可以使用简单或复杂的 `artificial\
  \ intelligence`（人工智能）技术来 VR VR 项目中创造真实主义的幻觉。尽管如此，创建这种水平的精细、高度真实的 VR 体验已超出了本章的范围。目前，Jane\
  \ 对用户行走请求的响应可以简单基于随机概率：\n\n```python\ndef jane_walk():\n    jane_state_timer.setEnabled(0)\n\
  \    random_switch = random.choice([1, 2])\n    if random_switch == 1:\n       walk_to_camera\
  \ = vizact.walkTo([viz.MainView.getPosition()[0], 0,\n       viz.MainView.getPosition()[2]\
  \ + 3])\n       jane.addAction(walk_to_camera)\n    else:\n       jane.clearActions()\n\
  \       jane_state_timer.setEnabled(1)\n\nvizact.onkeydown('w', jane_walk)\n```\n\
  \n在 `jane_walk` 函数中，首先禁用导致 Jane 切换状态的定时器，以避免干扰用户的输入。接下来，使用 `random.choice()` 方法随机生成\
  \ `1` 或 `2`。如果生成了 `1`，Jane 向相机走去；否则她将拒绝用户的指令并切换回状态变化的正常循环，因为 `jane_state_timer`\
  \ 被再次启用。注意，使用 `clearActions()` 是为了在重新启动定时器之前停止 Jane 的行走。如果不这样做，她在移动中时进行状态更改会导致她看起来像是悬浮在空中。\n\
  \n与正在开发的 3D 世界的概念和主题一致，脚本中可以添加的另一个功能是 Jane 应请求 `upon request` 喂鸽子的能力。这种任务很有趣，因为它涉及用户与\
  \ Jane 之间的交互，以及 Jane 与鸽子之间的交互。在脚本末尾添加以下函数：\n\n```python\ndef jane_feed_pigeons(no_of_pigeons):\n\
  \    jane_state_timer.setEnabled(0)\n    pigeon_state_timer.setEnabled(0)\n    jane.clearActions()\n\
  \    jane.state(15)\n    for i in range(no_of_pigeons):\n        walk = vizact.walkTo([jane.getPosition()[0],\
  \ 0, jane.\n        getPosition()[2]])\n        pigeons[i].addAction(walk)\n\nvizact.onkeydown('f',\
  \ jane_feed_pigeons, pigeons_no)\nvizact.onkeyup('f', jane_state)\n```\n\n这将禁用控制\
  \ Jane 和鸽子状态分配和移动的定时器，清除现有的动作（例如行走），将 Jane 的状态更改为“喂食”（`state 15`），并只要 Jane 还在喂它们，鸽子就会向她走去。注意在\
  \ `onkeydown()` 之后添加了一个额外的 `onkeyup()` 命令，并使用了相同的键标识符（即 `f`）。这允许用户在按下 `f` 键期间一直喂鸽子，并在松开时恢复到正常状态。最后，在\
  \ `jane_state` 函数的开头添加以下行：\n\n```\npigeon_state_timer.setEnabled(1)\n```\n\n将确保当\
  \ Jane 停止喂鸽子时，它们也会恢复常规行为。这是由于定时器再次开启。\n\n以下是本节开发的完整脚本版本：\n\n\n\n\n\n```python\n\
  # 1 导入库\nimport viz\nimport random\nimport vizact\n\n# 创建用于 3D 环境的空窗口\nviz.setMultiSample(4)\n\
  viz.go(viz.FULLSCREEN)\n\n# 添加广场的 3D 模型并启用碰撞检测\npiazza = viz.add('piazza.osgb')\n\
  viz.MainView.collision(viz.ON)\n\n# 创建一个植物对象和 Jane 角色\nplant = viz.add('plant.osgb')\n\
  jane = viz.add('vcc_female.cfg')\n\n# 设置 3D 对象和摄像机的位置与朝态\njane.setPosition([0, 0,\
  \ 8])\njane.setEuler([180, 0, 0])\nplant.setPosition([-3, 0, jane.getPosition()[2]\
  \ + 3])\nviz.MainView.setPosition(jane.getPosition()[0], 0,\njane.getPosition()[2]\
  \ - 11)\n\n# 创建并定位多个鸽子对象\npigeons_no = 30\npigeons = []\n\ndef create_pigeons(no_of_pigeons,\
  \ pigeon_list):\n    for i in range(no_of_pigeons):\n        pigeon = viz.add('pigeon.cfg')\n\
  \        pigeon.setPosition([random.uniform(-5, 5), 0,\n        random.uniform(2,\
  \ 7)])\n        pigeon.state(random.choice([1, 3]))\n        pigeon_list.append(pigeon)\n\
  \ncreate_pigeons(pigeons_no, pigeons)\n\n# 初始化并随机化鸽子的动画状态与移动\ndef pigeon_state_move(rand_pigeon):\n\
  \    random_switch = random.choice([1, 2])\n    if random_switch == 1:\n       \
  \ rand_pigeon.clearActions()\n        x = int(random.choice([1, 3]))\n        rand_pigeon.state(x)\n\
  \    else:\n        walk = vizact.walkTo([random.randint(-5, 5), 0,\n        random.randint(0,\
  \ 8)])\n        rand_pigeon.addAction(walk)\n\npigeon_state_timer = vizact.ontimer(1,\n\
  pigeon_state_move, vizact.choice(pigeons))\n\n# 随机化 Jane 的动画状态\ndef jane_state():\n\
  \    x = int(random.choice([1, 9]))\n    jane.state(x)\n\njane.state(1)\njane_state_timer\
  \ = vizact.ontimer((random.randint(10, 20)), jane_state)\n\n# Jane 行走行为\ndef jane_walk():\n\
  \    jane_state_timer.setEnabled(0)\n    random_switch = random.choice([1, 2])\n\
  \    if random_switch == 1:\n        walk_to_camera = vizact.walkTo([viz.MainView.getPosition()[0],\n\
  \        0, viz.MainView.getPosition()[2] + 3])\n        jane.addAction(walk_to_camera)\n\
  \    else:\n        jane.clearActions()\n        jane_state_timer.setEnabled(1)\n\
  \nvizact.onkeydown('w', jane_walk)\n\n# Jane 喂鸽子\ndef jane_feed_pigeons(no_of_pigeons):\n\
  \    jane_state_timer.setEnabled(0)\n    pigeon_state_timer.setEnabled(0)\n    jane.clearActions()\n\
  \    jane.state(15)\n    for i in range(no_of_pigeons):\n        walk = vizact.walkTo([jane.getPosition()[0],\
  \ 0,\n        jane.getPosition()[2]])\n        pigeons[i].addAction(walk)\n\nvizact.onkeydown('f',\
  \ jane_feed_pigeons, pigeons_no)\nvizact.onkeyup('f', jane_state)\n```\n\n## 12.15\
  \ 集成 VR 硬件并导出独立执行文件 (.exe)\n\n看起来可能有点奇怪，任何 VR 体验中最为核心的元素——`HMD`（头戴显示器）和`运动追踪控制器`被留到了最后才集成。部分部分是因为，这里展示的大部分开发、测试和原型制作工作可以在没有这些设备的情况下完成。这也让没有获得此类设备的人也能接触到\
  \ VR 开发并跟随本章的内容。从开发的角度来看，为 VR 硬件分配动作与为键盘或鼠标等输入设备分配动作并没有太大区别。同样，通过 HMD 体验 3D 世界，虽然对用户来说更有沉浸感和包裹感，但它并没有展示任何在使用屏幕时所不存在的内容。\n\
  \n从策略的角度来看，在基础构建模块、功能和逻辑到位之后，将 VR 硬件连接到已经开发的 VR 原型中也是一种有效的方案。长时间带着 HMD 处理琐碎任务会增加不适感和疲劳，而利用运动传感器测试基础交互和碰撞任务与使用键盘鼠标命令相比没有本质区别。一旦基础结构建立，读者想要更详细地查看各个开发方面，就可以根据需要将不同的\
  \ VR 硬件集成到现有项目中。当 VR 应用旨在用于多种不同的 VR 硬件产品时，每个产品及其集成情况都需要进行单独测试。这也是为什么选择与硬件无关的方法开始\
  \ VR 开发，并将硬件相关的决策留到开发周期后期的另一个原因。\n\n从实践的角度来看，在像 Vizard 平台上开发的 VR 应用中集成 VR 硬件对于 VR\
  \ 开发者来说并不应该构成巨大挑战。大多数现代 VR 开发平台都为连接来自 VR 硬件的设备提供了充分的支持和工具。设备的连接通常通过相应的`软件开发包 (SDK)`\
  \ 以及相关的库、工具和中间件集合来实现。\n\n\n\n\n上述调整将允许使用键盘上的方向键在 3D 世界中进行导航，并使用鼠标进行 x-y-z 旋转。虽然从严格来说，键盘和鼠标不是\
  \ VR 硬件控制器，但将它们集成到脚本的基本过程与专用的 VR 硬件是相同的。鼓励读者参考详细的 Vizard 教程，以探索 `Vizconnect` 系统提供的众多选项。最终决定取决于\
  \ VR 硬件的可用性、兼容性以及当前 VR 项目的需求。\n\n一旦连接并集成了所选 VR 硬件，就可以使用内置向导（`File > Publish as EXE`）将项目导出为独立应用程序（`*.exe`）。向导会收集并测试项目所需的所有依赖项、组件和文件，因此不需要额外的调整、编码或转换。注意，添加\
  \ VR 硬件不是导出应用程序的必要条件，因此在需要时可以在此类集成的情况下导出项目。\n\n## 12.16 结论\n\n在 VR 开发这样一个复杂且多层面的领域，像这样的一本书章节只能触及表面，并为读者提供一些通用、宽泛的方向。创建一个精良且有意义的\
  \ VR 体验所需的不仅仅是让几个对象及其行为变为动画并随机化。需要进行彻底的规划，以便在编写第一行代码之前理解需求并制定项目的所有细节。最重要的是，VR 体验需要一个故事，或者一个能让用户保持兴趣和投入的关键特性。如果没有这些，一旦用户习惯了技术的新奇感，即使是最壮观的\
  \ VR 环境也会失去光彩。\n\n本章开发的脚本旨在作为 VR 开发人员经常处理的一些基本概念和挑战的介绍。在目前的形式，它创建了一个 3D 世界（地图），添加了\
  \ 3D 对象和化身，通过预制动画提供了移动功能，并提供了用户（摄像）与 3D 对象之间的一些基础交互。在现阶段，该脚本在技术意义上远未完成，甚至还没有完全功能化。仍然存在许多需要解决的主要问题，例如化身缺少碰撞检测且可以穿过\
  \ 3D 世界、3D 世界完全静音、鸽子在喂食时聚集在完全同一个点、交互选择非常有限，以及许多其他移动、结构和逻辑问题。其中一些问题被刻意留之未解决，以便读者可以在下方提供的练习中尝试解决它们。对于更有抱心的读者，Vizard\
  \ 提供了许多专门的 Python 方法和命令，允许以更高效、更有组织的方式处理如本章涵盖的任务。通过序列、调度器和线程实现任务自动化，使用 `waittime()`\
  \ 和 `waitkey()` 等时间与执行管理方法代替简单的计时器，使用复杂的 OPAL 物理系统，以及在类和自定义操作中合并和结构化代码，只是读者可能想要探索的领域领域（WorldViz,\
  \ 2019）。Vizard 提供的丰富工具、库和详尽文档应该足够开始探索 VR 应用开发的更细微细节和挑战。\n\n## 12.17 案例研究\n\n通过添加以下功能来改进现有脚本：\n\
  \n1. 允许 Jane 在没有用户指令的情况下随机时间给鸽子喂食。喂食必须在经过随机时间间隔后自动停止，Jane 应该返回到她的正常状态循环。\n2. 允许\
  \ Jane 在没有用户指令的情况下向随机位置行走。确保限制 Jane 的行走区域，使她不会走到 3D 世界边界之外或穿过 3D 对象。\n3. 让鸽子在进食时分散开，而不是和\
  \ Jane 一样聚集在同一个点上。\n4. 当触发喂食时，让鸽子更快地向 Jane 行走。\n5. 让鸽子在向 Jane 行走喂食后，在随机时间恢复正常状态。\n\
  6. 为 3D 世界添加通用的环境背景音。\n7. 在每轮鸽子喂食开始时让 Jane 吹一次哨子。哨声必须从 Jane 在任何时刻所在的位置发出来，而不是无处不在。注意，对于此类任务，音频文件需要是单声道（MONO）而非立体声（STEREO）。\n\
  8. 为鸽子添加鸣叫声。声音必须分配给随机的鸽子。如上所述，对于此类任务，音频文件需要是单声道（MONO）而非立体声（STEREO）。\n9. 通过增加两种鸣叫声增加鸽子鸣叫的多样性，并在运行时三种不同的声音之间随机切换。显然，为了使这个练习具有实际价值，三种鸣叫声需要有明显的区别。\n\
  10. 为不同鸽子鸣叫触发的间隔增加一些随机性，以提高真实性。\n\n## 参考文献\n\n1. Ardakani, H. A., & Bridges, T.\
