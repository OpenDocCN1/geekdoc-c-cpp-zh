  \  2.9096  0.0036    0.0315\nmarital_widowed   0.4764     0.2229  2.1372  0.0395\
  \    0.9133\n=====================================================\n```\n\n与线性回归一样，输出包含两个部分。第一部分提供了关于因变量和观测数量的信息，而第二部分提供了截距和系数。如所示，`age`\
  \ 和 `marital status` 对烟状态是显著的（p < 0.05），而 `gender` 则不是（p = 0.1231）。\n\n## 9.6 总结\n\
  \n本章重点介绍了统计分析相关的基本概念和术语，以及执行推断统计任务的实践演示。介绍了 `population` 和 `sample`、`hypothesis`、`significance\
  \ levels` 以及 `confidence intervals` 等基本概念。为不同类型的任务选择正确的统计检验提供了实践指南。此外，简要讨论了常见统计分析类型的目的和定义。最后，提供了在\
  \ Python 中实现和执行常见统计分析任务的实践指南。每种统计方法都配有示例代码和结果解释。\n\n本节涵盖的常见统计分析方法以及相应的 Python 库如下：\n\
  \n| **统计检验** | **库** | **代码** |\n| --- | --- | --- |\n| Mann-Whitney U Test | *SciPy*\
  \ | `mannwhitneyu(data1, data2)` |\n| Wilcoxon Signed-rank Test | *SciPy* | `wilcoxon(data1,\
  \ data2)` |\n| Kruskal-Wallis Test | *SciPy* | `kruskal(data1, data2, data3, …)`\
  \ |\n| Paired t-Test | *SciPy* | `ttest_rel(data1, data2)` |\n| Independent t-Test\
  \ | *SciPy* | `ttest_ind(data1, data2)` |\n| Chi-Square of goodness of Fit | *SciPy*\
  \ | `chisquare (data1, data2)` |\n| ANOVA | *SciPy* | `f_oneway(data 1, data 2,\
  \ data3, …)` |\n| Pearson’s Correlation | *SciPy* | `pearsonr(var1, var2)` |\n|\
  \ Pearson’s Correlation (Scatter Plot) | *Matplotlib* | `scatter(var1, var2)` |\n\
  | Pearson’s Chi-Square Test | *SciPy* | `chisquare (data1, data2)` |\n\n\n\n\n\n\
  | 皮尔逊卡方检验（马赛图） | `Statsmodels` | `mosaic(Dataframe, ['var1', 'var2'])` |\n| :---\
  \ | :--- | :--- |\n| 线性回归 | `Statsmodels` | `OLS(y, X).fit()` |\n| 逻辑回归 | `Statsmodels`\
  \ | `Logit(y, X)` |\n\n本章涵盖的基础推断统计检验为其他更高级的统计分析任务奠定了基础，例如生存分析（`time to event`）和时间序列分析。最终，这些方法和结果可以作为更复杂系统仿真的构建模块，例如`马尔可夫模型`、离散事件仿真以及基于智能体的仿真。虽然本章没有涵盖像这些这样高级的统计分析和仿真任务，但读者应该能够基于所获得的信息和知识对它们进行探索。用于进一步学习和自学的相关关键教材和参考文献可以在本章的参考文献找到。\n\
