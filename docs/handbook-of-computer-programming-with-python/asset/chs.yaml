  \        74.0    94.0    65.0          86.0       92\n14        0.00         NaN\
  \     NaN     NaN           NaN       75\n15       62.62        45.5    78.0   \
  \ 56.7          72.0       70\n16        0.00         NaN     NaN     NaN      \
  \     NaN        0\n    Final Grade  Final Exam  Quiz 1  Quiz 2  Midterm Exam  Project\n\
  0         58.57        50.5    76.0    70.7          60.0       55\n5         61.32\
