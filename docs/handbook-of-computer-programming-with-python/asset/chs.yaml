  \n# 11 神经网络与深度学习简介\n\nDimitrios Xanthidis\n伦敦大学学院\n高等技术学院\n\nMuhammad Fahim\n高等技术学院\n\
  \nHan-I Wang\n约克大学\n\nDOI: [10.1201/9781003139010-11](https://doi.org/10.1201/9781003139010-11)\n\
  \n## 11.1 引言\n\n> 深度学习实际上是被称为神经网络的人工智能方法的新名称，这种方法已经流行了 70 多多年。神经网络最早由 Warren McCullough\
  \ 和 Walter Pitts 在 1944 年提出，他们是芝加哥大学的两位研究人员，后并于 1952 年加入麻省理工学院（MIT），成为有时被称为首个认知科学部门的创始成员。\n\
  \n> (Hardesty, 2017)\n\n人类智能是一个进化的、受生物控制的过程。人类根据经验进行学习。同样，*机器*或*人工*智能也会以数据的形式经历相似的经历。在更广泛的背景下，这两种形式的智能的相似之处在于它们遵循一种共同的方法：“基于我所看到的和观察到的，我认为接下来将会发生”。一旦将这一核心思想转移到数学构造和相关的算法（自演化）中，观察到机器能够*自主学习*，这一过程通常被称为*机器学习*（*ML*）。机器学习是*人工智能（AI）*的一个分支，这是一个术语，用于描述能够让机器以更理性、更像人类的方式思考和行动的方法的技术。\n\
  \n*深度学习*（*DL*）是机器学习的一种特定形式，因此是人工智能的另一个分支（图 11.1）。在基础层面，深度学习基于模拟人类思维过程并开发相关的抽象和连接。它由以下元素组成：\n\
  \n![](img/Fig11_01.jpg)\n\n**图 11.1**](#C_014_c11.xhtml_f11_1b) 基于数据的学习技术范围。\n\n\
  1. **学习：** 促进人工获取和处理新信息的功能。\n2. **推理：** 提供以不同的、可能被忽略的方式处理信息的功能。\n3. **理解：** 提供展示所采用模型结果的方法。\n\
  4. **验证：** 提供根据理论对模型结果进行验证的机会。\n5. **发现：** 提供识别数据内部新关系的机制。\n6. **提取：** 允许根据预测因子提取新的含义。\n\
  \nDL 使用多层算法来处理底层数据，这些数据可以是语音、图像、文本或更复杂的对象。数据通常通过相互连接的计算网络层传递，如图 11.2 所示。\n\n![](img/Fig11_02.jpg)\n\
  \n**图 11.2**](#C_014_c11.xhtml_f11_2b) DL 处理和分层结构。\n\n在机器学习中，有两种变量：*因变量*和*自变量*。将这些变量背景化的一种方法是将自变量视为机器学习过程的*输入*，将因变量视为*输出*。例如，通过知道一个人的*身高*可以预测其*体重*。\n\
  \n读者应该熟悉的另一个概念是*数据绘图*。本质上，绘图是一种视觉化数据的方法，旨在识别底层的模式和分组。由于数据可能是*离散的*，在对其绘图时，目标是找到一条代表给定数据集最佳*拟合*情况的*线*。一个简单的方程可以定义这样一个过程：`Y = F(X) + B`，其中`Y`是因变量（预测体重），`X`是自变量（个人的身高）。\n\
  \n在机器学习中，主要有两种预测：\n\n1. **线性回归：** 线性回归侧重于预测*连续*值。这个主题在第 10 章：基于 Python 的机器学习中进行了深入讨论。强烈建议读者在继续本章的后续章节之前先阅读该章节的基础讨论，因为它们为理解深度学习的许多方面提供了有用的基础。\n\
  2. **逻辑回归：** 逻辑回归侧重于预测被*分类*为 0 或 1 的值，它是深度学习的基石之一。\n\nDL 应用于基于*未标记*数据和*未知特征*的学习案例。因此，*特征提取*（FE）是\
  \ DL 的一个至关重要的方面。本章涵盖了：\n\n1. 神经网络（NN）的理论和数学构造，以及相关的示例和脚本。\n2. 使用神经网络构建 DL 的介绍。\n\
  3. 神经网络的 DL 示例。\n\n在机器学习中，由于涉及到许多数学概念，可能会遇到兼容性问题。在这种情况下，了解某些库是否已安装在系统中是非常用的。以下语句可能很有帮助：\n\
