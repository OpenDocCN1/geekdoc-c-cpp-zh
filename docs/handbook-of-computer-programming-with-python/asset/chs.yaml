  \ = 1, row = 0)\n122     speedLimitSelected = tk.Label(finePerKmFrame, text = '...',\n\
  123         textvariable = finePerKmValue)\n124     speedLimitSelected.grid(column\
  \ = 2, row = 0)\n125 # 创建包含罚金组件的框架\n126 def fineFrame():\n127     global fine\n\
