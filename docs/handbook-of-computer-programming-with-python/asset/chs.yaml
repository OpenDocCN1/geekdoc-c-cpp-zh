  \ are the following:\n['BMW', 'Toyota', 'Honda', 'Mercedes']\n['Mercedes', 'Honda',\
  \ 'Toyota', 'BMW']\n['BMW', 'Honda', 'Mercedes', 'Toyota']\n```\n\n最后，通过使用 `in`、`list`、`copy()`、`count()`\
  \ 和 `clear()`，程序员可以在运行时检查特定项是否属于列表（第 8–11 行和 13–16 行）、复制列表的内容（第 23 行）、统计项在列表中出现的次数（第\
  \ 19 行）以及清空列表（第 27 行）：\n\n```python\n# 创建列表\ncars = [\"BMW\", \"Toyota\", \"Honda\"\
  , \"Mercedes\", \"Toyota\"]\n# 打印列表项\nprint(\"The list of the cars is the following:\
  \ \", cars)\n# 根据项是否包含在列表中打印 True 或 False\nif (\"Toyota\" in cars):\n    print(\"\
  Toyota is in the list\")\nelse:\n    print(\"Toyota is not in the list\")\n\nif\
  \ (\"Nissan\" in cars):\n    print(\"Nissan is in the list\")\nelse:\n    print(\"\
  Nissan is not in the list\")\n# 列表在列表中出现的次数\noccurrences = cars.count(\"Toyota\"\
  )\nprint(\"Occurrences of the particular item in the list is: \", occurrences)\n\
  # 将列表的内容复制到另一个\nnewCars = cars.copy()\nprint(\"The contents of the new list are:\
  \ \", newCars)\n# 清空列表\nnewCars.clear()\nprint(\"The newCars list of items is now\
