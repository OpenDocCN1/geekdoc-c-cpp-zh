  \n```python\npigeons = []\n\nfor i in [-5, -3, 2, 4, 5]:\n    pigeon = viz.add('pigeon.cfg')\n\
  \    pigeon.setPosition([i, 0, 0])\n    pigeons.append(pigeon)\n```\n\n将创建五只鸽子，并将它们放置在\
  \ 3D 世界中心点沿 x 轴不对称但预定义的点，最后将它们添加到 `pigeons` 列表中。如讨论过的，现在可以访问 `pigeons` 列表中的单个鸽子以进行进一步操作。在脚本中添加以下行会将鸽子\
  \ `1`、`4` 和 `5` 重新定位到指定的坐标：\n\n```python\npigeons[0].setPosition([-1, 0, 6])\npigeons[3].setPosition([2,\
  \ 0, 3])\npigeons[4].setPosition([4, 0, 4])\n```\n\n最后，通过为鸽子的坐标生成随机值，可以使鸽子的定位看起来更真实，而不是像上一个示例那样尝试显式这样做。Python\
  \ 提供了几种生成随机值的方法。对于此示例，使用了 `random` 库中的 `uniform()` 方法。该方法生成给定范围内的值。例如：\n\n```python\n\
  import random\nprint('Random value', random.uniform(1, 10))\n```\n\n将打印 `1` 和 `10`\
  \ 之间的随机值。在鸽子示例中，`random.uniform()` 可用于为三个轴的任何一个轴随机生成坐标数字。例如，以下命令：\n\n```python\n\
  pigeons[1].setPosition([random.uniform(-5, 5), 0, 0])\npigeons[3].setPosition([0,\
  \ 0, random.uniform(2, 7)])\npigeons[4].setPosition([random.uniform(-5, 5), 0, random.uniform(2,\
  \ 7)])\n```\n\n将把 pigeons 列表中的第二只鸽子（`index = 1`）放置在距离中心点 x 轴 `−5` 到 `5` 单位之间，第四只鸽子（`index\
  \ = 3`）放置在 z 轴 `2` 到 `7` 单位之间，第五只（`index = 4`）放置在 `x = −5` 到 `5` 且 `y = 2` 到 `7`\
  \ 定义的区域内的某处。实际上，此类任务需要进一步自动化，特别是在涉及大量对象的情况下。以下示例将创建五只鸽子，在传递给 `random.uniform()`\
  \ 的参数限制内随机沿 x 轴和 z 轴定位它们，并将每只鸽子添加到 pigeons 列表中供后续使用：\n\n```python\nimport random\n\
  \n[...]\n\npigeons = []\n\nfor i in range(5):\n    pigeon = viz.add('pigeon.cfg')\n\
  \    pigeon.setPosition([random.uniform(-5, 5), 0, random.uniform(2, 7)])\n    pigeons.append(pigeon)\n\
  ```\n\n这种结构的价值在于，VR 开发可以使用完全相同的代码来创建和定位任意数量的鸽子。唯一的在于作为 `range()` 方法参数的值。\n\n随着脚本开始变得有点长，现在可能是快速引入通过\
  \ `functions` 组织代码概念的好时机。这对于下一节中涵盖的任务也是必要的。假设读者对 Python 函数有基础水平的理解。然而，对于不熟悉这方面的人，下面提供了一个简短的示例。可以使用\
  \ `def` 关键字后跟一个（唯一的）名称和冒号来声明 Python 函数。例如：\n\n```python\ndef create_pigeons():\n\
  ```\n\n将声明 `create_pigeons()` 函数。可以以类似于前面所示的 `for` 循环情况的方式向函数中添加命令。例如，如果想将之前开发的所有鸽子实例化和定位命令分组在\
  \ `create_pigeons()` 函数下，其结构可能所示：\n\n```python\ndef create_pigeons():\n    pigeons\
  \ = []\n    for i in range(5):\n        pigeon = viz.add('pigeon.cfg')\n       \
  \ pigeon.setPosition([random.uniform(-5, 5), 0, random.uniform(2, 7)])\n       \
  \ pigeons.append(pigeon)\n```\n\n使用这种结构，VR 开发人员不再需要输入创建新鸽子所需的所有命令，而只需要在需要时调用 `create_pigeons()`\
  \ 即可。\n\n\n\n\n```python\npigeons_no = 30\n\n[...]\n\npigeons = []\n\ndef create_pigeons(no_of_pigeons,\
  \ pigeon_list):\n    for i in range(no_of_pigeons):\n        pigeon = viz.add('pigeon.cfg')\n\
  \        pigeon.setPosition([random.uniform(-5, 5), 0, random.uniform(2, 7)])\n\
  \        pigeon_list.append(pigeon)\n\ncreate_pigeons(pigeons_no, pigeons)\n```\n\
  \n与大多数编程任务一样，有多种方法可以实现相同的结果。总的来说，应该采用最适合自己风格或项目要求的结构化和编程风格，但这种是随着时间推移而发展的，而不是根据书本章节中的几个示例就做决定的。尽管如此，必须提到的是，在\
  \ `Vizard` 的教程页面可以找到实现上述示例中类似结果的各种替代方法。比较不同的方法将帮助读者对同一任务产生不同的编程思路，并对通用编程开发出更具创造性的思维。\n\
  \n以下是本节开发的完整脚本版本，它生成了图 12.8 所示的 3D 环境：\n\n```python\n1   # 导入库\n2   import viz\n\
