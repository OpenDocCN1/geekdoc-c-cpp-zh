  \ 离散程度\n\n另一种描述和总结连续数据的方法是通过离散程度。这些指标量化了数据的变异性；因此也称为离散程度。离散程度通常与集中趋势指标结合使用，以提供数据的清晰概述。离散程度的重要性在于它们可以说明均值在多大程度上代表数据。\n\
  \n数据的范围是最大值和最小值之间的差。计算方法为 `max - min`。\n\n四分位数通过将数据分为四部分（即四分之一）来描述数据的范围。第一分位数（Q1）是样本的\
  \ 25 分位数，将最低的 25%数据与其他数据隔离开；而第二分位数（Q2）是 50 分位数，即中位数；第三分位数（Q3）是 75 分位数。四分位数是一种非常有用的离散度量，因为相对于方差或标准差，它们受离群值的影响小得多。\n\
  \n方差在数值上显示了数据点距离均值的远近。方差是很有用的，因为它与四分位数不同，它考虑了数据集中的所有数据点，并提供了更好的数据表示。数据集的方差表示为 `variance\
  \ = Σ[i]*([i]-mean())²/(-1)`，其中 `i = 1, 2, ...` 且 `mean()` 是均值。为了更好地理解为什么必须除以 `-1`\
  \ 而不是 ` `，读者可以参考贝塞尔修正。\n\n标准差也展示了数据点在均值周围的分布。它是方差的正平方根。较小的标准差表示数据接近均值，而较大的标准差则显示数据距离均值的离散程度。标准差通常是展示数据分布的首选，而且比方差更方便，因为它与数据具有相同的单位。\n\
  \n以下脚本使用 Pandas 和 Statistics Python 库读取 `newGrades.csv` 文件，找到数据集中每列的 `max` 和 `min`\
  \ 值，找到 25%（第一分位数），并使用常规 `std()` 方法和来自统计包中的 `stdev()` 方法计算方差和标准差。最后，创建一个包含所有相关值的新数据集，并报告该数据集：\n\
  \n\n\n\n\n```python\nimport pandas as pd\nimport statistics\n\n# 定义浮点数的格式\npd.options.display.float_format\
  \ = '${:,.2f}'.format\n\ndataset = pd.read_csv('newGrades.csv')\n\nrows = len(dataset)\n\
  cols = [\"Final Grade\", \"Final Exam\", \"Quiz 1\", \"Quiz 2\",\n       \"Midterm\
  \ Exam\", \"Project\"]\n\n# 找出每列的最大值\nmax1 = dataset[\"Final Grade\"].max(); max2\
  \ = dataset[\"Final Exam\"].max()\nmax3 = dataset[\"Quiz 1\"].max(); max4 = dataset[\"\
  Quiz 2\"].max()\nmax5 = dataset[\"Midterm Exam\"].max(); max6 = dataset[\"Project\"\
  ].max()\n\n# 找出每列的最小值\nmin1 = dataset[\"Final Grade\"].min(); min2 = dataset[\"\
  Final Exam\"].min()\nmin3 = dataset[\"Quiz 1\"].min(); min4 = dataset[\"Quiz 2\"\
  ].min()\nmin5 = dataset[\"Midterm Exam\"].min(); min6 = dataset[\"Project\"].min()\n\
  \n# 找出所有列的 25% 分位数\nquartile25a = dataset[\"Final Grade\"].quantile(0.25);\nquartile25b\
  \ = dataset[\"Final Exam\"].quantile(0.25)\nquartile25c = dataset[\"Quiz 1\"].quantile(0.25);\n\
  quartile25d = dataset[\"Quiz 2\"].quantile(0.25)\nquartile25e = dataset[\"Midterm\
  \ Exam\"].quantile(0.25)\nquartile25f = dataset[\"Project\"].quantile(0.25)\n\n\
  # 计算所有列的方差\nvariance1 = statistics.variance(dataset[\"Final Grade\"].dropna())\n\
  variance2 = statistics.variance(dataset[\"Final Exam\"].dropna())\nvariance3 = statistics.variance(dataset[\"\
  Quiz 1\"].dropna())\nvariance4 = statistics.variance(dataset[\"Quiz 2\"].dropna())\n\
  variance5 = statistics.variance(dataset[\"Midterm Exam\"].dropna())\nvariance6 =\
  \ statistics.variance(dataset[\"Project\"].dropna())\n\n# 使用 std() 计算所有列的标准差\nstd1\
  \ = dataset[\"Final Grade\"].std(); std2 = dataset[\"Final Exam\"].std()\nstd3 =\
  \ dataset[\"Quiz 1\"].std(); std4 = dataset[\"Quiz 2\"].std()\nstd5 = dataset[\"\
  Midterm Exam\"].std(); std6 = dataset[\"Project\"].std()\n\n# 使用 stdev() 计算所有列的标准差\n\
  stdev1 = statistics.stdev(dataset[\"Final Grade\"].dropna())\nstdev2 = statistics.stdev(dataset[\"\
  Final Exam\"].dropna())\nstdev3 = statistics.stdev(dataset[\"Quiz 1\"].dropna())\n\
  stdev4 = statistics.stdev(dataset[\"Quiz 2\"].dropna())\nstdev5 = statistics.stdev(dataset[\"\
  Midterm Exam\"].dropna())\nstdev6 = statistics.stdev(dataset[\"Project\"].dropna())\n\
  \n# 输出数据集\ndataset1 = dataset[[\"Final Grade\", \"Final Exam\", \"Quiz 1\", \"Quiz\
  \ 2\",\n       \"Midterm Exam\", \"Project\"]]\nprint(dataset1.iloc[0:rows:1])\n\
  \n# 将最大值添加到数据集\nmaxs = {\"Final Grade\": max1, \"Final Exam\": max2, \"Quiz 1\"\
  : max3,\n       \"Quiz 2\": max4, \"Midterm Exam\": max5, \"Project\": max6}\ndataset1\
  \ = dataset1.append(maxs, ignore_index = True)\n\nmins = {\"Final Grade\": min1,\
  \ \"Final Exam\": min2, \"Quiz 1\": min3,\n        \"Quiz 2\": min4, \"Midterm Exam\"\
  : min5, \"Project\": min6}\ndataset1 = dataset1.append(mins, ignore_index = True)\n\
  \nquartiles = {\"Final Grade\": quartile25a, \"Final Exam\": quartile25b,\n    \
  \         \"Quiz 1\": quartile25c, \"Quiz 2\": quartile25d,\n             \"Midterm\
  \ Exam\": quartile25e, \"Project\": quartile25f}\ndataset1 = dataset1.append(quartiles,\
  \ ignore_index = True)\n\nvariances = {\"Final Grade\": variance1, \"Final Exam\"\
  : variance2,\n             \"Quiz 1\": variance3, \"Quiz 2\": variance4,\n     \
  \        \"Midterm Exam\": variance5, \"Project\": variance6}\ndataset1 = dataset1.append(variances,\
  \ ignore_index = True)\n\nstds = {\"Final Grade\": std1, \"Final Exam\": std2, \"\
  Quiz 1\": std3,\n        \"Quiz 2\": std4, \"Midterm Exam\": std5, \"Project\":\
  \ std6}\ndataset1 = dataset1.append(stds, ignore_index = True)\n\nstdevs = {\"Final\
  \ Grade\": stdev1, \"Final Exam\": stdev2, \"Quiz 1\": stdev3,\n          \"Quiz\
  \ 2\": stdev4, \"Midterm Exam\": stdev5, \"Project\": stdev6}\ndataset1 = dataset1.append(stdevs,\
  \ ignore_index = True)\n\n# 输出包含最大值、最小值、分位数、方差和标准差值的行\nprint(\"Max\"); print(dataset1.iloc[32:33])\n\
  print(\"Min\"); print(dataset1.iloc[33:34])\nprint(\"25% Quartile\"); print(dataset1.iloc[34:35])\n\
  print(\"Variance\"); print(dataset1.iloc[35:36])\nprint(\"Standard Deviation (using:\
  \ std())\"); print(dataset1.iloc[36:37])\n```\n\n### 4.2 输出:\n\n```\nMax\n   Final\
  \ Grade  Final Exam  Quiz 1  Quiz 2  Midterm Exam  Project\n32     100.00      \
  \ 98.00     15.00    14.00      100.00    100.00\nMin\n   Final Grade  Final Exam\
  \  Quiz 1  Quiz 2  Midterm Exam  Project\n33      50.00       45.00      5.00  \
  \    6.00       50.00      50.00\n25% Quartile\n   Final Grade  Final Exam  Quiz\
  \ 1  Quiz 2  Midterm Exam  Project\n34      70.00       65.00    10.00     10.00\
  \       70.00      70.00\nVariance\n   Final Grade  Final Exam  Quiz 1  Quiz 2 \
  \ Midterm Exam  Project\n35     250.00      230.00     25.00      20.00     250.00\
  \     250.00\nStandard Deviation (using: std())\n   Final Grade  Final Exam  Quiz\
  \ 1  Quiz 2  Midterm Exam  Project\n36      15.00       14.00      5.00      5.00\
  \       15.00      15.00\n```\n\n### 4.4.3 偏度与峰度\n\n*偏度*（Skewness）衡量数据的*非对称性*，描述其偏离正态分布的程度。偏度有多种数学定义。一种常用的是*皮尔逊偏度系数*，它可以通过数据集的大小、均值和标准差推导出来。*负偏度*值表示左侧有主导尾部，而*正偏度*则对应右侧的长尾部。如果偏度接近\
  \ 0（即在 -0.5 到 0.5 之间），则数据被认为是*对称*的（见图 8.1）。当偏度在 -1 到 -0.5 之间或 0.5 到 1 之间时，数据被认为是*中度偏斜*的。如果偏度小于\
  \ -1 或大于 1，则数据被认为是*高度偏斜*的。\n\n*峰度*（Kurtosis）显示了数据相对于正态分布是肥尾还是轻尾的。换句话说，峰度识别了数据是否包含极端值。高峰度表示数据具有肥尾且离群值较多，低峰度则显示轻尾且离群值较少。另一种展示峰度和偏度的有效方法是使用*直方图*，因为它直观地展示了分布的形状。\n\
  \n\n\n\n\n```python\nimport pandas as pd\n\n# Define the format of float numbers\n\
  pd.options.display.float_format = '${:,.2f}'.format\n\ndataset = pd.read_csv('newGrades.csv')\n\
  \nrows = len(dataset)\ncols = [\"Final Grade\", \"Final Exam\", \"Quiz 1\", \"Quiz\
  \ 2\",\n      \"Midterm Exam\", \"Project\"]\n\n# Find the skewness (Pearson's coefficient)\
  \ values for each column\nskew1 = dataset[\"Final Grade\"].skew()\nskew2 = dataset[\"\
  Final Exam\"].skew()\nskew3 = dataset[\"Quiz 1\"].skew()\nskew4 = dataset[\"Quiz\
  \ 2\"].skew()\nskew5 = dataset[\"Midterm Exam\"].skew()\nskew6 = dataset[\"Project\"\
  ].skew()\n\n# Find the kurtosis values for each column\nkurtosis1 = dataset[\"Final\
  \ Grade\"].kurtosis()\nkurtosis2 = dataset[\"Final Exam\"].kurtosis()\nkurtosis3\
  \ = dataset[\"Quiz 1\"].kurtosis()\nkurtosis4 = dataset[\"Quiz 2\"].kurtosis()\n\
  kurtosis5 = dataset[\"Midterm Exam\"].kurtosis()\nkurtosis6 = dataset[\"Project\"\
  ].kurtosis()\n\n# Find the sum of all values for each column\nsum1 = dataset[\"\
  Final Grade\"].sum()\nsum2 = dataset[\"Final Exam\"].sum()\nsum3 = dataset[\"Quiz\
  \ 1\"].sum()\nsum4 = dataset[\"Quiz 2\"].sum()\nsum5 = dataset[\"Midterm Exam\"\
  ].sum()\nsum6 = dataset[\"Project\"].sum()\n\n# Report the dataset\ndataset1 = dataset[[\"\
  Final Grade\", \"Final Exam\", \"Quiz 1\", \"Quiz 2\",\n      \"Midterm Exam\",\
  \ \"Project\"]]\nprint(dataset1.iloc[0:rows:1])\n\n# Append the dataset with the\
  \ max values\nskewness = {\"Final Grade\": skew1, \"Final Exam\": skew2, \"Quiz\
  \ 1\": skew3,\n          \"Quiz 2\": skew4, \"Midterm Exam\": skew5, \"Project\"\
  : skew6}\ndataset1 = dataset1.append(skewness, ignore_index = True)\n\nkurtosis\
  \ = {\"Final Grade\": kurtosis1, \"Final Exam\": kurtosis2,\n      \"Quiz 1\": kurtosis3,\
  \ \"Quiz 2\": kurtosis4,\n      \"Midterm Exam\": kurtosis5, \"Project\": kurtosis6}\n\
  dataset1 = dataset1.append(kurtosis, ignore_index = True)\n\nsums = {\"Final Grade\"\
  : sum1, \"Final Exam\": sum2, \"Quiz 1\": sum3,\n      \"Quiz 2\": sum4, \"Midterm\
  \ Exam\": sum5, \"Project\": sum6}\ndataset1 = dataset1.append(sums, ignore_index\
  \ = True)\n\n# Report the rows with the skewness, kurtosis, and sums\nprint(\"Skewness\"\
  ); print(dataset1.iloc[32:33])\nprint(\"Kurtosis\"); print(dataset1.iloc[33:34])\n\
  print(\"Sum values\"); print(dataset1.iloc[34:35])\n```\n\n**Output 8.4.3:**\n\n\
