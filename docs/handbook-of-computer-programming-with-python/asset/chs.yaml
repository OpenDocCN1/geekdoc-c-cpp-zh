  )\n\nphotos()\nfirstRow()\nsecondRow()\nthirdRow()\nfourthRow()\n\n# 创建主标签\nwinLabel5=tk.Label(winFrame,\
  \ text = \"...\", font= \"Arial 18\", width= 30)\nwinLabel5.grid(column = 2, row\
  \ = 2)\n\nwinFrame.mainloop()\n```\n\n正如前面提到的，`PIL` 模块提供了支持图像处理所需的类，在此例中为 `Image`\
  \ 和 `ImageTk`。\n\n`photos()` 方法包含了六组每组三行的步骤，负责图像的打开和读取，以及为了加载到相应标签而进行的准备。在第一步（即每组的第一行）中，使用\
  \ `Image` 类和 `open()` 方法读取图像并创建图像对象。接下来，脚本使用 `resize()` 方法，结合图像所需的尺寸和 `ANTIALIAS`\
  \ 选项，以确保在缩小图像以适应标签时保持质量。这适用于所有六种情况。在最后一步中，根据之前处理过的图像创建一个新的图像对象。这是通过使用 `ImageTk`\
  \ 类中的 `PhotoImage` 方法对六种情况实现的。值得注意的是，此过程适用于 *gif* 文件类型的图像。读者应该检查 Python 文档，以找到在处理其他类型图像时应该使用的具体类、方法和选项，以及必须遵循的准确流程。尽管如此，后者与上述流程相比应该并不不同。\n\
  \n\n\n\n\n脚本的下部分涉及使用四个方法（`firstRow()`、`secondRow()`、`thirdRow()` 和 `fourthRow()`）来创建应用程序的十二个标签（即每行三个标签）。对于每个标签，都使用了三条语句。第一条语句创建标签组件并设置其\
  \ `text` 属性以显示相关消息，并设置 `relief` 属性将组件外观增强为 `raised`（浮起）。第二条语句将标签放置在当前框架网格中所需的位置。第三条语句调用\
  \ `bind` 方法，以便将特定组件与某个 `event`（事件）关联。\n\n有许多事件可以与各种组件关联。此示例涉及三个基本事件，即：`<Button-1>`，当用户对父组件（在本例中为标签）进行**左点击**时触发；`<Button-3>`，当用户**右点击**时触发；以及`<Double-Button-1>`，当父组件被**双击左键**时触发。\n\
  \n每当事件被触发时，通常会调用一个方法来执行一组语句。如果该方法需要接受调用语句的参数，则必须同样调用 `lambda` 事件表达式，以便在参数传递给方法之前定义它们。\n\
  \n为了更改标签组件边界外观，提供了许多选项。这些包括 `raised`、`sunken`、`flat`、`ridge`、`solid` 和 `groove`\
  \ 等选项，并且必须通过 `relief` 属性进行设置。带有整数参数的 `borderwidth` 用于更改标签的默认边界宽度。\n\n最后，可以在标签组件中同时显示文本和图像。在这种情况下，有必要使用\
  \ `compound` 表达式将这两个元素结合。该表达式接受不同的对齐值，即当图像放在文本之前时使用 `left`，当图像放在文本之后时使用 `right`，当两个对象都放置在相同位置（相互叠）时使用\
  \ `center`。\n\n### 4.2.3 Button 组件\n\n如前所述，标签组件并非用于触发用户与 GUI 交互引发的事件。在这种情况下，可以使用\
  \ `button` 组件。该组件也属于 `tkinter` 模块，尽管在 `ttk` 模块中也可以找到，可以通过定义 `button` 类来创建按钮对象。以下脚本演示了通过简单的按钮组件实现五种不同用户交互的可能输出。脚本还通过标签组件显示相关消息，根据交互类型提供用户反馈：\n\
  \n```python\n 1   # Import the relevant library\n2   import tkinter as tk\n3\n4\
  \   # Define the method that controls the mouse click events \n5   def changeText(a):\n\
  6       winLabel.config(text = a)\n7\n8   # The basic frame with the tk.Tk() constructor\
  \ and provide a title\n9   winFrame = tk.Tk()\n10  winFrame.title(\"A simple button\
  \ and label application\")\n11\n12  # Create the label \n13  winLabel = tk.Label(winFrame,\
  \ text = \"...\")\n14  winLabel.grid(column = 1, row = 0)\n15\n16  # Create the\
  \ button widget and bind it with the associated events\n17  winButton=tk.Button(winFrame,\
  \ text=\"Left, right, or double left Click \"\\\n18      \"\\nto change the text\
  \ of the label\", font = \"Arial 16\", fg = \"red\")\n19  winButton.grid(column\
  \ = 0, row = 0)\n20  winButton.bind(\"<Button-1>\", lambda event, \\\n21      a\
  \ = \"You left clicked on the button\": changeText(a))\n22  winButton.bind(\"<Button-3>\"\
  , lambda event, \\\n23      a = \"You right clicked on the button\": changeText(a))\n\
  24  winButton.bind(\"<Double-Button-1>\", lambda event, \\\n25      a = \"You double\
  \ left clicked on the button\": changeText(a))\n26  winButton.bind(\"<Enter>\",\
  \ lambda event, \\\n27      a = \"You are hovering above the button\": changeText(a))\n\
  28  winButton.bind(\"<Leave>\", lambda event, \\\n29      a = \"You left the button\
  \ widget\": changeText(a))\n30\n31  winFrame.mainloop()\n```\n\n**输出 4.2.3：**\n\n\
  ![](img/un04_07.jpg)\n\n所示，创建按钮组件对象并为其基本选项或属性（例如 `text`、`font`、`fg`）赋值的过程与标签组件的情况并无区别。因此，将按钮组件绑定到事件并调用方法（无论是否带参数）遵循与标签组件案例相同的语法和逻辑。\n\
  \n### 4.2.4 Entry 组件\n\n`entry` 组件是 `ttk` 模块（`tkinter` 包）中的基本组件，允许从键盘进行单行输入。该组件提供了多种方法和选项，允许控制其外观和/或功能。组件必须通过\
  \ `.pack()` 或 `.grid()` 方法放置在 `parent` 组件（通常是当前框架）中。以下脚本介绍了 entry 组件的基本用法及其输出：\n\
  \n```python\n 1   # Import the necessary library\n2   import tkinter as tk\n3  \
  \ from tkinter import ttk\n4\n5   # Create the frame using the tk.Tk() constructor\n\
  6   winFrame = tk.Tk()\n7   winFrame.title(\"Python GUI with text\")\n8\n9   # Create\
  \ a StringVar object to accept input\n10  textVar = tk.StringVar()\n11\n12  # Set\
  \ the initial text for the StringVar\n13  textVar.set('Enter text here')\n14\n15\
  \  # Create an entry widget and associate it to the StringVar\n16  winText = ttk.Entry(winFrame,\
  \ textvariable = textVar, width = 40)\n17  winText.grid(column = 1, row = 0)\n18\n\
  19  winFrame.mainloop()\n```\n\n**输出 4.2.4：**\n\n![](img/un04_08.jpg)\n\n按照常见的 GUI\
