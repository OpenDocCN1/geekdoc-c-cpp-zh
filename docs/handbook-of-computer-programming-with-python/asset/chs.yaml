  \  4. `Logit(y, X)`\n    答案：D\n\n\n\n\n目前，机器学习（ML）在许多人类活动中发挥着至关重要的作用。它被应用于不同的领域，包括在线购物、医学、视频监控、垃圾邮件和恶意软件检测、在线客户支持以及搜索引擎结果优化。它是`计算机科学`的一个分支，也是`人工智能（AI）`的一个子集。机器学习的主要重点是开发能够从数据中学习并根据这种学习做出预测的算法。\n\
  \n如果一个机器学习程序在给定某些任务（`T`）和性能衡量标准（`P`）的情况下，通过从经验（`E`）中学习来提高，它就是一个机器学习程序（Mitchell,\
  \ 1997 ）。机器学习的行为与孩子的成长相似。随着孩子的成长，其执行任务 `T` 的经验 `E` 会增加，从而获得更高的性能衡量标准（`P`）。\n\n在机器学习中，使用给定的数据集对计算机进行`训练`，以预测新数据的属性。例如，人们可以通过向系统输入\
  \ 10,000 张狗的照片和另外 10,000 张不包含狗的图片，并在每种情况下指示照片是否为狗来训练系统。在完成此训练后，当系统输入一张新图片时，它应该能够预测该图片是否为狗的照片。\n\
  \nPython 拥有一系列支持机器学习算法实现的库。其中一些库在之前的章节中讨论过并使用过（例如，`Pandas`、`Matplotlib`）。其他对机器学习应用特别有用的库如下：\n\
  \n*   **NumPy：** 它是一个数组处理库。它提供了复杂的数学函数，用于处理多维数组和矩阵。它是处理`随机数`、`傅里叶变换`和`线性代数`的强大工具。\n\
  *   **SciPy：** 它是一个用于科学计算的开源 Python 库。它包含用于`图像优化`、`信号处理`、快速傅里叶变换、`线性代数`和常微分方程（ODE）的模块。它构建在\
  \ `NumPy` 之上，因为它的底层数据结构是多维数组。\n*   **Scikit-Learn：** 它于 2010 年构建在 `NumPy` 和 `SciPy`\
  \ 库之上。它包含了若干`监督`和`无监督`机器学习算法。该库在`数据挖掘`和`数据分析`中也很有用。它处理`聚类、回归、分类、模型选择`以及`预处理`。\n\
  *   **TensorFlow：** 该库由 Google 于 2015 年开发。它使用 `NumPy` 后端来操作张量。\n\n有大量的已机器学习算法，适用于各种领域。本章介绍了一些最重要的算法以及一些最流行的领域应用。本章以一个相关的案例研究结束，该研究探索了机器学习的一些主要方面。\n\
  \n## 10.2 机器学习算法的类型\n\n机器学习算法主要有类型：`监督`、`无监督`和`强化`。理解监督学习和无监督学习区别的一种简单方法是引入使用某种类型的帮助来教计算机如何将特定输入映射到相关输出的概念。\n\
  \n在监督学习的情况下，`监督者`使用所谓的`标记`数据来引导计算机理解如何将输入映射到输出。例如，假设有一个训练计算机区分笔记本电脑和台式 PC 的图像。计算机被提供`一组图片`，并为每张图片提供一个`标签`或`标记`，指定它是笔记本电脑。对于台式\
  \ PC 图片也重复相同的过程。虽然这是一个简化的例子，但它对监督学习提供了直观的描述。\n\n在与监督学习相关的输出方面，大两类：`分类`和`回归`。`分类`与类别有关，例如“生病”或“健康”的人、“狗”或“猫”宠物、“笔记本电脑”或“台式机”。`回归`与连续数值形式的输出有关，例如预测个人的身高或体重。监督学习的另一种类型是`集成`，它通过结合多个可能单独较弱的机器学习模型来产生更准确的预测。\n\
  \n总的来说，监督学习的一个广泛说法是它使用标记数据来训练计算机将输入 (`X`) 映射到输出 (`Y`)。\n\n在无监督学习的情况下，没有监督者来训练计算机将输入映射到输出，也没有标记训练数据，基本上由计算机根据一组输入自己预测可能的输出。无监督学习有三种主要类型：`关联`、`聚类`和`降维`。\n\
  \n*   `关联`用于发现集合中的共性。它被广泛用于市场分析。例如，关联模型可能预测购买面包有 80% 的概率与鸡蛋有关。`聚类`用于对样本进行分组，确保同一簇内的对象彼此之间的相似性高于与其他簇对象的相似性。`降维`用于减少数据集的变量数量，同时确保传递了重要信息。降维可以通过`特征提取`和`特征选择`函数实现。后者本质上是指原始变量子集的选择。特征特征提取`执行从高维空间到低维的数据转换（例如\
  \ PCA 算法）。\n\n最后，`强化学习`是一种机器学习，允许代理根据其当前状态通过学习最大化相关奖励来决定最佳行动。它通常通过`试错`学习优化策略。例如，可以考虑一种视频游戏，玩家需要在某些时间移动某些位置以得分。\n\
  \n## 10.3 监督学习算法：线性回归\n\n`线性回归`的基本思想是对一组输入与其相应输出之间的关系进行量化。它的形式为直线 `y = a + b.x`，其中\
  \ `b` 是回归线的斜率（系数），`a` 是 y 轴截距。目标是尽可能减少`离群值`（即偏离直线较大的数据）。这通过计算所有数据点到直线距离的平方和来衡量。线性回归中的另一个重要参数是\
  \ `R`^(*2)，它暗示输出 `y` 可能受到相关输入 `x` 变化的影响。显然，与所有其他统计分析测试一样，这种特定的测试产生一个 `p 值（统计显著性）`，以确定输入和输出数据集之间是否存在统计学意义的相关性。\n\
  \n\n\n\n在 Python 中，可以使用 `Stats` 库中的 `linregress(X, y)` 函数来实现线性回归。该函数使用一个输入数据集和一个输出数据集（分别为\
  \ `X` 和 `y`）。函数的输出包含五个值：线性回归的 `slope`（斜率）、`intercept`（截距）、`r` 值、`p` 值以及测试的`statistical\
  \ error`（误差）。基于此，整个过程可以总结为五个不同的步骤：\n\n*   **Step 1:** 导入/读取用于线性回归的数据。\n*   **Step\
  \ 2:** 定义用于创建模型的两个数据集 `X` 和 `y`。\n*   **Step 3:** 使用 `linregress()` 计算线性回归的 `slope`、`intercept`、`r`\
  \ 和 `p` 值。\n*   **Step 4 (Optional):** 使用 `slope` 和 `intercept` 对模型进行可视化。\n*   **Step\
  \ 5 (Optional):** 使用新数据对模型进行测试。\n\n线性回归机器学习算法在现实生活中有许多应用。一个显著的例子是它们在医学和制药研究中的应用，例如尝试确定特定药物针对特定疾病的最佳剂量。其他例子包括此类算法在销售和营销中的应用，即尝试为特定产品寻找正确的促销材料数量（以及相关成本）以实现收益最大化；以及教育背景下学生课程成绩与最终成绩之间的关联性。以下\
  \ Python 脚本量化了 `grades2.csv` 数据集中两列值（`Midterm Exam` 和 `Final Grade`）之间的关系。接下来，一旦计算出斜率和截距值并准备好回归模型供后续使用，训练数据集和测试数据集将与回归线一起进行可视化（绘图）：\n\
  \n```\n1   import pandas as pd\n2   import matplotlib.pyplot as plt\n3   # Request\
  \ to plot inline with the rest of the results\n4   # This is particularly relevant\
  \ in Jupyter Anaconda\n5   %matplotlib inline\n6   from scipy import stats\n7\n\
  8   # The function uses the calculated slope and intercept\n9   # to predict the\
  \ Final Grade, given the Midterm Exam grade input\n10  def predictFinalGrade(X):\n\
  11         return slope * X + intercept\n12\n13  # Read the dataset\n14  dataset\
  \ = pd.read_csv(\"grades2.csv\")\n15  dataset2 = dataset[[\"Final Grade\", \"Midterm\
  \ Exam\"]]\n16  print(\"The input dataset is as follows:\")\n17  print(dataset2)\n\
  18\n19  # Define the input and output datasets\n20  X = dataset2[\"Midterm Exam\"\
  ]; y = dataset2[\"Final Grade\"]\n21\n22  # Use the linregress function from the\
  \ stats library\n23  # to calculate slope, intercept, r, p, and std_err\n24  slope,\
  \ intercept, r, p, std_err = stats.linregress(X, y)\n25\n26  print(\"The slope and\
  \ intercept values are: {:.2f}, \\\n27  {:.2f}\".format(slope, intercept))\n28 \
  \ print(\"The value of R-square is: {:.2f}\".format(r**2))\n29  print(\"The value\
  \ of statistical significance, p is: {:.2f}\".format(p))\n30\n31  mymodel = list(map(predictFinalGrade,\
  \ X))\n32  # Plot the model of the resulting linear regression\n33  plt.scatter(X,\
  \ y); plt.plot(X, mymodel); plt.show()\n34\n35  grades = int(input(\"Enter the new\
  \ Midterm Exam grade:\"))\n36  grades = predictFinalGrade(grades)\n37  print(\"\
  The predicted Final Grade is: {:.2f}\".format(grades))\n```\n\n**Output 10.3:**\n\
