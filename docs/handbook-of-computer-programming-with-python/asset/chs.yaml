  * Amur Bensefia，诺曼底大学（University of Normandy）计算机工程系，巴黎东大学（Université Paris-Est）信息处理与系统实验室（LITIS）。\n\
  * Han-Abdallah，宾夕法尼亚大学（University of Pennsylvania）计算机科学系。\n\n\n\n\n毫无疑问，在本书写作时，Python\
  \ 是最流行的计算机编程语言之一。与 C# 和 Java 等其他常用语言一样，它属于更广泛的基于 C/C++ 的语言家族，并自然地从这些语言中借鉴了大量的包和模块。虽然\
  \ Python 是该家族中最年轻的成员，但它已成为全球范围内学术机构、企业机构和组织的首选平台。\n\n作为一种基于 C++ 的语言，Python 遵循`结构化编程`范式，以及相关的`顺序`、`选择`和`循环`编程原则，以及`函数`和`数组`（作为`列表`）的概念。对这些概念进行详尽的介绍不仅超出了本书的范围，而且可能没有必要，因为这些是\
  \ Knuth、Stroustrup 和 Aho 等计算机科学巨匠开创性著作的主题（Aho Alfred 等, 1983；Knuth, 1997;Stroustrup,\
  \ 2013）。鼓励希望从理论基础上深入理解这些概念的读者参考这些构成了现代编程骨干的著作。作为一个`面向对象编程`（OOP）平台，它提供了所有支持 OOP 范式的设施和工具。与其同类语言（即\
  \ C++、C# 和 Java）不同，Python 并不提供一个精简、集化的 IDE 来支持 GUI 编程，但它提供了大量的相关模块，涵盖了人们可能遇到的大多数（如果不是全部）的各种\
  \ GUI 要求。它包含了许多允许实现`数据库编程`、`Web 开发`和`移动开发`项目的模块，以及可用于`机器`和`深度学习`应用，甚至是`虚拟和增强现实`项目开发的平台、模块和方法。尽管如此，使\
  \ Python 成为计算机科学专业人士和学者中如此受欢迎的选择的主要原因之一，是它为`数据科学`任务提供了丰富的模块和包，包括许多专门为`数据分析`、`数据可视化`和`统计``分析`任务设计的各种库和工具。\n\
  \n可以说，有大量的在线资源、教程和印刷书籍详尽地讨论了上述大多数主题。在技术方面，对于目前正在学习该学科或在没有先验编程知识和经验的情况下接触该学科的人来说，这些资源可能太复杂了。在其他情况下，资源的结构可能更像`参考书`，可能关注特定主题，而没有涵盖某些读者可能发现有用的\
  \ Python 计算入门部分。本书旨在通过弥补这一空白，探索如何使用 Python 来解决入门到中级难度的各种计算任务，同时对底层概念提供基础的理论介绍。\n\
  \n## 1.2 读者群体\n\n本书关注`计算机科学`、`信息系统`和`信息技术`专业的学生，或者任何涉及`计算机编程`、`数据分析`、`HCI-GUI`及相关领域入门到中级水平的人员。本书旨在基于底层主题提供实践经验，并帮助学生和教师针对给定的计算问题开发他们的算法思维过程和程序。它也可以供具备必要的理论和计算思维背景、但目前正在转向\
  \ Python 的专业人士使用。\n\n考虑到上述，本书包含了丰富的示例以及相关的 Python 代码和输出，这些内容在一个讨论了底层概念及其应用的语文中呈现。它还以“快速访问观察”的形式提供了核心概念，以便读者可以快速浏览各种主题。观察结果可以作为参考和导航工具，或者在将本书作为教学资源使用时，作为讨论点和课堂演示的提醒。各章节还配有相关的练习和案例研究，可以在该背景中使用，其解决方案在书末附录中提供。\n\
  \n## 1.3 开始使用 Jupyter Notebook\n\n关于安装和运行 Python 编程环境，在线社区渠道以及官方文档和指南提供了丰富的信息和支持。尽管如此，本节提供了一个关于如何使用`Anaconda\
  \ Navigator`和`Jupyter Notebook`来解释和执行 Python 代码的简单指南，因为书中的大多数示例都是使用这种特定配置实现和测试的。\n\
  \n一旦启动`Anaconda Navigator`，首页就会出现许多不同的编辑器和环境（图 1.1）。\n\n![](img/Fig01_01.jpg)\n\n\
