  \ `L[1]`、`L[2]`、`…``L[i]` 序列的元素是有序的。简单来说，该算法对原始列表不断增大的子集进行排序，直到整个列表排序完成。\n\n假设插入排序应用于以下七元素列表：`3`,\
  \ `5`, `4`, `2`, `3`, `1`, `6`。由于插入排序在第 `ith` 次通过时会将第 � 个 个元素插入到 `L[1]`、`L[2]`、`…``L[i-1]`\
  \ 序列末尾的适当位置（即 `L[i]`），而这些元素之前已经按有序顺序排列好了。因此，在插入之后，占据 `L[1]`、`L[2]`、`…``L[i]` 序列的元素是有序的。简单来说，该算法对原始列表不断增大的子集进行排序，直到整个列表排序完成。在这种情况下，在第一次主外层迭代中，元素\
  \ `7` 被推到了列表末尾。最后一行是完成所有七次内层循环后第一次主外层迭代的结果。随后的迭代将重复相同的过程，确保下一个较大的元素移动到适当的位置，直到所有元素都已在列表中正确的位置。\n\
  \n表 6.4 展示了每次外层迭代/循环后的结果。\n\nTABLE 6.4 外层循环的结果\n\n| 第 1 次通过后 | 3 | 4 | 2 | 3 | 1\
  \ | 5 | 6 | 7 |\n| 第 2 次通过后 | 3 | 2 | 3 | 1 | 4 | 5 | 6 | 7 |\n| 第 3 次通过后 | 2 |\
  \ 3 | 1 | 3 | 4 | 5 | 6 | 7 |\n| 第 4 次通过后 | 2 | 1 | 3 | 3 | 4 | 5 | 6 | 7 |\n| 第\
  \ 5 次通过后 | 1 | 2 | 3 | 3 | 4 | 5 | 6 | 7 |\n| 第 6 次通过后 | 进行了比较但无交换 |\n| 第 7 次通过后\
  \ | 进行了比较但无交换 |\n\n下面提供了一个基础冒泡排序的 Python 实现及其输出：\n\n```python\n 1   # 导入随机模块以生成随机数\n\
