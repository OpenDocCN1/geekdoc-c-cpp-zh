  \ 200 像素，取值限制在 0 的下边界和 360 的上边界之间。读者还应该注意到 `config()` 方法的使用，该方法设置了组件的 `resolution`\
  \ 选项，允许用户定义数值的增量（包括小数）；`activebackground` 选项用于设置组件在激活状态下的颜色；以及方向（`orient`），它可以取两个值之一：`horizontal`（水平）或\
  \ `vertical`（垂直）。为了清晰起见，再次使用 `config()` 方法为组件设置了更多选项，例如背景色（`bg`）、前颜色（`fg`）以及设置槽颜色的\
  \ `troughcolor`。此外，框架中还放置了另一个标签用于显示滑块组件的当前值，作为可选的视觉辅助。\n\n第二个框架和相关的标签引入了数字输入框（spinbox\
  \ widget）（第 82–103 行）。这也被用于控制用户在输入数值时的行为。它与滑块组件非常相似，允许设置接受值的下限和上限，但有两个主要区别：(a) 它在视觉上不同；(b)\
  \ 用户可以直接向组件的文本部分输入值，并/或通过增加/减少箭头控制它。与上一个情况一样，框架中添加了另一个标签作为额外的视觉辅助。\n\n第三个框架引入了另一个滑块组件（第\
  \ 105–126 行）。它与第一个框架中使用的不同之处在于：(a) 它在视觉上不同且其视觉属性受到限制（即它没有提供若干 `tk` 组件选项），以及 (b)\
  \ 它属于 `ttk` 类/库，而不是 `tk`。读者应该注意到这两个滑块组件截然不同的视觉效果。\n\n第三部分定义了用于控制用户与应用程序交互的四个方法（第\
  \ 16–46 行）。读者应该注意，其中三个方法（即 `onScale(val)`、`getSpeedLimit()` 和 `getFinePerKm(val)`）分别与组件\
  \ `currentSpeedScale`、`speedLimitSpinbox` 和 `finePerKmScale` 直接关联。这是通过 `command`\
  \ 选项实现的。具体来说，当用户与特定组件交互时，会捕获结果值并调用相应的方法来计算罚金。在滑块组件的情况下，值会随着方法的调用而传递。这在 `tk` 和 `ttk`\
  \ 中都是如此。读者应该观察：(a) 应用于组件对象的 `set` 和 `get` 方法用于修改组件的值；(b) 使用类型转换运算符（例如 `float()`、`int(float())`）来控制计算中所用数值类型；以及\
  \ (c) 声明了在方法中必须被调用和使用的全局变量。在这些每个方法的最后，都会调用 `calculateFine()` 方法来执行相关的计算。\n\n###\
  \ 4.3.2 LabelFrame 内部 Listbox 和 Combobox 组件\n\n编程中最著名的两个组件是列表框（listbox）和组合框（combobox）。这些组件用于以列表形式向用户展示多行文本，目的是让他们进行选择。这种选择也可以用于同步多个不同组件实例之间的内容。程序员可以在组件的外观上发挥创意，因为尽管基本形式无法修改，但可以操作它们的视觉属性。这两个组件之间的主要区别是，前者提供一个开放列表，而后者是一个在用户点击时打开的折叠列表。另一个可以进一步增强应用程序外观的组件是\
  \ labelframe 组件。该组件与 frame 组件类似，但它允许在框架本身上指定标签，从而消除了在框架中创建额外标签组件的需要。该组件的一些视觉属性（包括与标签字体相关的属性）是可以被操作的。\n\
  \n在本节中引入了两个库：`random` 和 `time`。引入前者是为了使用生成随机数的 `randint()` 方法，引入后者是为了使用 `process_time()`\
  \ 方法来记录特定进程的开始和/或结束时间。\n\n以下 Python 脚本允许用户选择数量随机生成的整数以填充列表框。随后，它会将此列表排序到第二个列表框中，然后显示列表的大小、数字之和及其平均值以及完成排序过程的处理时间：\n\
  \n\n\n\n```python\n# 导入必要的模块\nimport tkinter as tk\nfrom tkinter import ttk\nfrom\
  \ tkinter import *\nimport random\nimport time\n\n# 初始化列表框、组合框和方法用到的各种列表\nunsortedL\
  \ = []; sortedL = []; statisticsData = [];\nsizes = [5, 20, 100, 1000, 10000, 20000]\n\
  global UnsortedList, SortedList\nglobal startTime, endTime, ListSizeSelection, size\n\
  global UnsortedListScrollBar, SortedListScrollBar\nglobal EntryFrame, UnsortedFrame,\
  \ SortedFrame\n\n# 用随机数填充未排序列表和\n# 未排序的列表框\ndef populateUnsortedList():\n    global\
  \ size\n    global UnsortedListScrollBar\n    global UnsortedList\n    global ListSizeSelection\n\
  \n    # 当从组合框中选择时，读取元素数量\n    size = int(ListSizeSelection.get())\n\n    # random\
  \ 类的 randint() 方法生成随机整数\n    for i in range (size):\n        n = random.randint(-100,\
  \ 100)\n\n        # 将生成的随机整数插入未排序\n        # 列表中的相应位置\n        unsortedL.insert(i,\
  \ n)\n\n        # 用未排序列表的元素填充列表框\n        for i in range (0, size):\n          \
  \  UnsortedList.insert(i, unsortedL[i])\n        UnsortedListScrollBar.config(command\
  \ = UnsortedList.yview)\n\n# 使用冒泡排序列表并记录统计数据供以后使用\ndef sortToSortedList():\n   \
  \ global size, startTime, endTime\n    global SortedListScrollBar\n    global SortedList\n\
  \n    # 将未排序列表和列表框加载到排序列表和列表框\n    for i in range (0, size):\n        sortedL.insert(i,\
  \ unsortedL[i])\n\n    # 开始计时\n    startTime = time.process_time()\n\n    # 冒泡排序算法\n\
  \    for i in range (0, size-1):\n        for j in range (0, size-1):\n        \
  \    if (sortedL[j] > sortedL[j+1]):\n                temp = sortedL[j]\n      \
  \          sortedL[j] = sortedL[j+1]\n                sortedL[j+1] = temp\n\n  \
  \  # 结束计时\n    endTime = time.process_time()\n\n    # 将排序列表加载到相关的列表框\n    for i\
  \ in range (0, size):\n        SortedList.insert(i, sortedL[i])\n        SortedListScrollBar.config(command\
  \ = SortedList.yview)\n\n# 清空所有列表、列表框、组合框以及全局大小变量\ndef clearLists():\n    global\
  \ size\n    sortedL.clear()\n    unsortedL.clear()\n    UnsortedList.delete('0',\
  \ 'end')\n    SortedList.delete('0', 'end')\n    statisticsData.clear()\n    StatisticsCombo.delete('0',\
  \ 'end')\n\n# 计算并报告排序过程的统计数据\ndef statistics():\n    global size, startTime, endTime\n\
  \    statisticsData.clear()\n    statisticsData.insert(1, '列表的大小为 ' + str(size))\n\
  \    statisticsData.insert(2,'列表之和为 '+str(sum(sortedL)))\n    statisticsData.insert(3,\
  \ '排序列表花费的时间为 ' \\\n        + str(round(endTime - startTime, 5)))\n    statisticsData.insert(4,\
  \ '排序列表的平均值为: ' \\\n        + str(round(sum(sortedL) / size, 2)))\n    StatisticsCombo['values']\
  \ = statisticsData\n\n# ===================================================================\n\
  # 定义将用于创建应用程序 GUI 的方法\ndef createGUI():\n    unsortedFrame()\n    entryFrame()\n\
  \    entryButton()\n    sortButton()\n    sortedFrame()\n    clearButton()\n   \
  \ statisticsButton()\n    statisticsSelection()\n\n# 创建标签框并将未排序数组列表框组件置其中\ndef unsortedFrame():\n\
  \    global unsortedList\n    global UnsortedListScrollBar\n    global UnsortedList\n\
  \    global winFrame\n    global UnsortedFrame\n\n    UnsortedFrame = tk.LabelFrame\
  \ (winFrame, text = 'Unsorted Array')\n    UnsortedFrame.config(bg='light grey',fg='blue',bd=2,\
  \ relief='sunken')\n    # 创建滚动条组件并附到 UnsortedList\n    UnsortedListScrollBar = Scrollbar\
  \ (UnsortedFrame, orient = VERTICAL)\n    UnsortedListScrollBar.pack(side = RIGHT,\
  \ fill = Y)\n    # 在 Unsorted Array frame 中创建列表框\n    UnsortedList = tk.Listbox(UnsortedFrame,\
  \ bg='cyan', width=13, bd=0,\n        height=12, yscrollcommand = UnsortedListScrollBar.set)\n\
  \    UnsortedList.pack(side = LEFT, fill = BOTH)\n    # 将滚动条命令与其父组件关联，\n    # 即\
  \ UnsortedList 的 yview\n    UnsortedListScrollBar.config(command = UnsortedList.yview)\n\
  \    # 将 Unsorted frame 及其部分放入界面\n    UnsortedFrame.pack(); UnsortedFrame.place(relx\
  \ = 0.02, rely = 0.05)\n\n# 创建包含 Entry 组件的标签框\ndef entryFrame():\n    global unsortedList\n\
  \    global UnsortedListScrollBar\n    global ListSizeSelection\n    global EntryFrame\n\
  \    global winFrame\n\n    EntryFrame = tk.LabelFrame (winFrame, text = 'Actions')\n\
  \    EntryFrame.config(bg='light grey',fg='red',bd=2, relief='sunken')\n    # 将\
  \ Unsorted frame 及其部分放入界面\n    EntryFrame.pack(); EntryFrame.place(relx = 0.25,\
  \ rely = 0.05)\n    # 在 Entry frame 中创建标签\n    EntryLabel = tk.Label(EntryFrame,\
  \ text='How many integers\\nin the list')\n    EntryLabel.config(bg='light grey',\
  \ font='Arial 14 bold')\n    EntryLabel.grid(column = 0, row = 0)\n    # 选择列表数量的组合框\n\
  \    ListSizeSelection = tk.IntVar()\n    StatisticsCombo = ttk.Combobox(EntryFrame,\
  \ textvariable=ListSizeSelection, width = 10)\n    StatisticsCombo['values'] = sizes\n\
  \    StatisticsCombo.current(0)\n\n# 在未排序数组和列表框中插入新项\ndef entryButton():\n    global\
  \ EntryFrame\n\n    EntryButton = tk.Button(EntryFrame, text = 'Populate\\nUnsorted\
  \ list',\n        relief = 'raised', width = 16)\n    EntryButton.bind('<Button-1>',\
  \ lambda event: populateUnsortedList())\n\n# 用冒泡排序列表并显示它们\ndef sortButton():\n \
  \   global EntryFrame\n\n    SortButton=tk.Button(EntryFrame,text='Sort numbers\\\
  nwith BubbleSort',\n        relief = 'raised', width = 16)\n    SortButton.bind('<Button-1>',\
  \ lambda event: sortToSortedList())\n\n# 创建包含排序数组列表框组件\ndef sortedFrame():\n   \
  \ global sortedList\n    global SortedListScrollBar\n    global SortedList\n   \
  \ global winFrame\n    global SortedFrame\n\n    SortedFrame = tk.LabelFrame (winFrame,\
  \ text = 'Sorted Array')\n    SortedFrame.config(bg='light grey',fg='blue',bd=2,\
  \ relief='sunken')\n    # 创建滚动条组件并附到 SortedList\n    SortedListScrollBar = Scrollbar\
  \ (SortedFrame)\n    SortedListScrollBar.pack(side = RIGHT, fill = Y)\n    # 在 Sorted\
  \ Array frame 中创建列表框\n    SortedList = tk.Listbox(SortedFrame, bg='cyan', width=13,\
  \ bd=0,\n        height=12, yscrollcommand = SortedListScrollBar.set)\n    SortedList.pack(side\
  \ = LEFT, fill = BOTH)\n    # 将滚动条命令与其父组件关联，\n    # 即 SortedList 的 yview\n    SortedListScrollBar.config(command\
  \ = SortedList.yview)\n    # 将 Unsorted frame 及其部分放入界面\n    SortedFrame.pack();\
  \ SortedFrame.place(relx = 0.75, rely = 0.05)\n\n# 清空两个列表框和两个列表\ndef clearButton():\n\
  \    global EntryFrame\n\n    ClearButton = tk.Button(EntryFrame, text = 'Clear\
  \ lists',\n        relief = 'raised', width = 16)\n\n# 将显示排序统计数据的按钮\ndef statisticsButton():\n\
  \    global EntryFrame\n\n    StatisticsButton=tk.Button(EntryFrame,text='Show statistics',\n\
  \        relief = 'raised', width = 16)\n```\n\n\n\n\n### 输出 4.3.2\n\n![](img/un04_11.jpg)\n\
  \n首先，导入了必要的库（即 `tkinter`、`time` 和 `random`，第 2–6 行）。接下来，初始化各种列表、变量和列表框（第 9–14 行）。注意，列表没有被定义为\
  \ `global`，因为默认情况下，脚本中的所有方法都是通过 `by reference` 访问它们的。必须注意的是，不同类型的对象和/变量必须在单独的行中声明为\
  \ `global`，因为将它们放在一起可能会引发错误。初始化之后，在第 227–229 行创建并配置了主框架。\n\n下一步是创建应用程序界面。在这种情况下，界面由两个不同的部分组成。第一部分包括在关联的\
  \ `labelframes` 内部创建并放置的列表框（第 103–124 行和 170–191 行）。使用 `labelframes` 使得创建额外的标签变得不再必要。列表框的视觉属性可以通过其选项进行配置，这些选项与\
  \ `entry widget` 的选项几乎相同。可以在运行时使用 `insert(index, value)` 方法填充列表框，并在运行时使用 `delete(index,\
  \ index)` 方法清空它们。同样，`labelframes` 的属性/选项与普通的 frames 和 labels 类似。\n\n第二部分是创建一个托管应用程序所需的\
  \ `comboboxes` 和按钮的 `labelframe`。第一个 `combobox` 的作用是显示未排序列表中随机整数的数量。第二个则显示与排序过程相关的基础统计数据、列表大小、整数之和和平均值，以及排序列表所需的时间。关于\
  \ `comboboxes` 的创建和使用，有三个值得注意的观察（第 143–149 行和 211–223 行）。首先，它们必须包含一个 `[\"values\"\
  ]` 列表，该列表将从关联的列表中获取值。后者最初可以是空的，也可以是有内容的。其次，它们的选择值（例如 `textvariable`）必须与 `IntVar()`\
  \ 类的对象（或任何类似的替代方案）关联，以便将其存储供后续使用，因为选中的 combobox 值是无法直接访问的。第三，当前选中的值必须通过 `current(index)`\
  \ 方法定义。\n\n最后一步是创建用户与应用程序之间的交互。为此，创建了四个按钮并将其与点击事件绑定，以触发相应的方法。这将填充、排序和清空相关列表，并显示基础统计数据。`populateUnsortedList()`\
  \ 方法使用 `randint()` 方法生成随机整数并使用 `insert()` 方法填充未排序列表（第 16–38 行）。值得注意的是全局变量 `size`\
  \ 的声明，以及使用 `get()` 方法从 `ListSizeSelection` 对象的 `private` 属性读取值（第 25 行）。`sortToSortedList()`\
  \ 方法（第 40–67 行）声明了全局变量 `size`、`startTime` 和 `endTime`，使用 `process_time()` 方法标记排序过程的开始和结束，并利用常用的\
  \ `Bubble Sort` 算法排序列表并填充 `sortedList`。`clearLists()` 方法使用 `clear()` 方法清除列表的值，并使用\
  \ `delete()` 删除列表框的值（第 69–77 行）。最后，`statistics()` 方法使用 `sum()` 和 `round()` 方法生成基础统计数据（第\
  \ 79–89 行）。\n\n读者应该注意此脚本中引入的 `scrollbar` 组件。该特定组件背后的思想和用法是非常直观且简单的。首先，创建滚动条运行所在的\
  \ `labelframe`。接下来，创建滚动条并连接（`packed`）到父组件（即在本例中关联的 `labelframe`），指定其方向和位置。最后，创建将使用滚动条的组件/对象，并通过\
  \ `yscrollcommand` 或 `xscrollcommand` 与滚动条关联（取决于滚动条的方向是 `vertical` 还是 `horizontal`），并配置为滚动所附组件的内容（第\
  \ 38、120–124 行以及第 67、187–191 行）。\n\n### 4.3.3 使用 CheckButtons、RadioButtons 和 SimpleMessages\
  \ 的 GUI\n\n除了 listboxes 和 comboboxes，Windows 应用程序的用户还熟悉另外两个组件，即 `checkbuttons` 和\
  \ `radiobuttons`。这些组件允许用户从一组不同的可用选项/操作中做出一个或多个选择。它们的主要区别在于，在 checkbuttons 的情况下，用户可以在任何时刻选择多个选项，而\
  \ radiobuttons 只允许从可用选项集中进行单项选择。最后，读者应该熟悉的 Python 提供的另一个实用组件是 `message` 组件。在本节中，将介绍并解释该组件的最基本形式。\n\
  \n以下脚本实现了一个界面，其中包含两个关联并附带垂直滚动条的 listboxes。列表框填充了各种国家名称及其首都。它还包含两个 entry boxes，用于接受列表框的新条目。插入操作通过关联的按钮点击事件触发。所有列表框的内容都会与用户的点击（`on\
  \ any listbox`）保持同步。界面还包含四个按钮用于处理应用程序与用户之间的交互，允许插入和删除特定条目、清空所有三个容器中的所有条目以及退出应用程序。最后，两个\
  \ checkbuttons 控制相关容器是否启用，两个 radiobuttons 控制它们是否可见：\n\n\n\n\n\n```python\nimport\
  \ tkinter as tk\nfrom tkinter import *\nfrom tkinter import ttk\nfrom tkinter import\
  \ messagebox\n\ncountries = ['E.U.', 'U.S.A.', 'Russia', 'China', 'India', 'Brazil']\n\
  Capital = ['Brussels', 'Washinghton', 'Moscow', 'Beijing', 'New Delhi', 'Brazilia']\n\
  \nglobal newCountry, newCapital\nglobal CountriesFrame, CapitalFrame\nglobal checkButton1,\
  \ checkButton2\nglobal radioButton\nglobal CountriesList, CapitalList\nglobal CountriesScrollBar,\
  \ CapitalScrollBar\n\n# Create the interface for the listboxes\ndef drawListBoxes():\n\
  \    global CountriesList, CapitalList\n    global CountriesFrame, CapitalFrame\n\
  \    global CountriesScrollBar, CapitalScrollBar\n\n    # Create CountriesFrame\
  \ 框; 将 CountriesList 放入其中 \n    CountriesFrame = tk.LabelFrame(winFrame, text =\
  \ 'Countries')\n    CountriesFrame.config(bg = 'light grey', fg = 'blue', bd = 2,\
  \ width = 15, relief = 'sunken')\n    # 创建一个滚动条控件并附加到 CountriesList\n    CountriesScrollBar\
  \ = Scrollbar(CountriesFrame, orient = VERTICAL)\n    CountriesScrollBar.pack(side\
