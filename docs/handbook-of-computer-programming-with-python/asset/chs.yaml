  \ \"\\n\")\n```\n\n\n\n\n```python\nimport pandas as pd\nimport statsmodels.formula.api\
  \ as smf\nimport statsmodels.api as sm\nimport numpy as np\ndataset = pd.read_csv('Diabetes.csv')\n\
  \n# Create a new dependent variable that contains only 0 and 1\ndataset['readmitted2']\
  \ = dataset.readmitted\ndataset.readmitted2 = dataset.readmitted2.replace('Other',\
  \ 0)\ndataset.readmitted2 = dataset.readmitted2.replace('NO', 0)\ndataset.readmitted2\
  \ = dataset.readmitted2.replace('>30', 0)\ndataset.readmitted2 = dataset.readmitted2.replace('<30',\
  \ 1)\n\n# Logistic regression\nformula = \"readmitted2~C(age, Treatment('60–70)'))\
  \ + \\\n             C(gender, Treatment('Male')) + \\\n             C(race) + C(medical_specialty)\
  \ + \\\n             C(number_diagnoses, Treatment(8)) + \\\n             C(HA1Cresult,\
  \ Treatment('None')) + time_in_hospital\"\nModel = smf.logit(formula, data = dataset).fit()\n\
  print(Model.summary())\n\n# Odds ratios\nOdds = pd.DataFrame({\n      'coef': Model.params.values,\n\
  \      'odds ratio': np.exp(Model.params.values),\n      'name': Model.params.index\
  \ })\nprint(Odds, \"\\n\")\n```\n\n4. 逻辑回归的输出部分显示所示。结果表明，`age`（年龄）、`race`（种族）、`primary\
  \ diagnosis`（主要诊断）、`HbA1c measurement`（HbA1c 测量）、`medical speciality`（医学科）和 `time\
  \ in hospital`（住院时间）在统计学上是显著的（p < 0.05）。与年龄小于 60 岁的人相比，60 岁以上的人再次住院的可能性高出 1.4 倍（系数 > 0,\
  \ p < 0.001, 优势比 = 1.4）。与非洲裔人相比，白人人的再次住院概率也高出 1.2 倍（系数 > 0, p = 0.001, 优势比 = 1.2）。发现，与主要诊断为糖尿病的人相比，主要诊断为消化系统、泌尿系统、肿瘤和呼吸系统疾病的人再次住院的可能性较低（系数 < 0,\
  \ p < 0.05）。住院时间较长的患者再次住院的概率也较低（系数 < 0, p < 0.001, 优势比 = 0.97）。\n\n#### 输出：案例研究第\
  \ 9 章 c 节\n\n![ ![](img/unApp01_49.jpg)\n\n5. 结果表明，HbA1c 水平较高、主要诊断为糖尿病且住院时间较短的年老年糖尿病患者更容易早期再次住院。因此，应该更加关注这类患者，以减少再次住院率，提高患者安全并降低住院治疗成本。\n\
  \n注意，该数据集最初源自 UCI 机器学习库（Frank & Asuncion, 2010; Strack et al., 2014）。为了本示例的目的，对数据进行了进一步修改。\n\
  \n## 第 10 章 – 使用 Python 进行机器学习\n\n#### 说明\n\n使用 `dataset.csv` 编写一个 Python 脚本，预测患者是否会在\
  \ 30 天内再次住院。该应用程序应实现以下功能：\n\n1. 读取数据集并创建一个包含以下类别的数据框：`gender, race, age, admission\
