  3   myNeuron.setTheWeights([15,15,−10])\n4   print (\"0 0 = {0:.10f}\".format(myNeuron.runThePerceptron([0,0])))\n\
  5   print (\"0 1 = {0:.10f}\".format(myNeuron.runThePerceptron([0,1])))\n6   print\
  \ (\"1 0 = {0:.10f}\".format(myNeuron.runThePerceptron([1,0])))\n7   print (\"1\
