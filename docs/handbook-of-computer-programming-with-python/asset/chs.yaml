  \    \" items which are the following: \", cars)\n\n# 向列表末尾添加一个项\ncars.append(\"\
  Nissan\")\n# 在列表的索引 1 插入一个项\ncars.insert(1,\"Suzuki\")\n# 打印更新后的列表\nprint(\"The\
  \ updated list after the append and insert is: \", cars)\n\n# 通过添加第二个列表的项目来扩展列表\n\
  cars2 = [\"Renault\", \"Audi\"]\ncars.extend(cars2)\nprint(\"The updated list after\
  \ extending it with items from \"\n      \"a second list is: \", cars)\n\n# 从列表中删除一个特定项\n\
  cars.remove(\"Toyota\")\nprint(cars)\n\n# 从列表中删除最后一个项\ncars.pop()\nprint(cars)\n\
