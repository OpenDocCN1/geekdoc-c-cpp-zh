  \ Python 组件。这是通过一系列浅的示例和应用程序实现的，这些示例从简单的实现逐渐过渡到具有挑战性的实现。尽管涵盖所有可用组件超出了本章的范围，但表 5.1\
  \ 提供了带有描述以及它们所属模块/库的组件列表，以供快速参考。这些信息也可以在从相应类中创建对象时作为构造函数的参考。关于所列出的组件（包括 `tkinter`）的更多细节，可以在\
