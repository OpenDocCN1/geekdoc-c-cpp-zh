  \n\n\n```python\n# 导入库\nimport tkinter as tk\nimport time\n\nglobal winSplash\n\n\
  # 创建启动界面\ndef splash():\n    global winSplash\n\n    winSplash = tk.Tk()\n    winSplash.title(\"\
  Splash screen\")\n    winSplash.resizable(False, False)\n    winSplash.geometry('250x100')\n\
  \    winSplash.configure (bg = 'dark grey')\n    winLabel1 = tk.Label(winSplash,\n\
  \        text = \"Display the Splash screen \\nfor 8 seconds\")\n    winLabel1.grid(row\
  \ = 0, column = 0)\n\n    # 使用 update 函数在主循环（主窗口）\n    # 接管控制之前显示启动界面\n    winSplash.update()\n\
  \n# 调用启动界面并持续 8 秒\nsplash()\ntime.sleep(8)\n\n# 在主循环之前销毁启动界面\nwinSplash.destroy()\n\
  \n# 创建主窗口\nwinFrame = tk.Tk()\nwinFrame.title(\"Main Window\")\nwinFrame.resizable(False,\
  \ False)\nwinFrame.geometry('250x100')\nwinFrame.configure(bg = 'grey')\n\nwinLabel2\
  \ = tk.Label(winFrame, text = \"Entered the main window\")\nwinLabel2.grid(row =\
  \ 0, column = 0)\n\nwinFrame.mainloop()\n```\n\n**输出 5.2.4：**\n\n![](img/un05_04.jpg)\n\
  \n用户应该注意在调用 `splash()` 方法后使用了 `time.sleep()` 方法。这会在主窗口（`winFrame`）加载之前延迟启动界面的显示。值得注意的是在\
  \ `winSplash` 对象上使用的 `update()` 方法。该方法确保了组件的显示，尽管它不是主窗口，因此无法对其使用 `mainloop()` 方法。\n\
  \n### 5.2.5 通用对话框\n\n程序员经常需要利用操作系统的 `API`（应用程序编程接口），以避免编写已经作为预包核心功能提供的代码。一些最重要的\
  \ GUI 相关的 API 元素可以在“对话框”这一更广泛的类别下找到。对话框有多个版本，例如颜色、打开文件、保存文件、目录、字体对话和打印。这些对话框通过提供对基础重复性任务的即时访问，让程序员能够回避复杂的\
  \ GUI 编程。这些是在各种常用 GUI 应用程序（例如 MS Office 或 Adobe Creative Suite）中常见的对话框对象。\n\n除了包含在\
  \ `colorchooser` 库中的颜色对话框（`askcolor`）外，上述对话框都包含在 `filedialog` 库的关联关键字下（例如 `filedialog.askopenfile()`、`filedialog.asksaveasfile()`、`filedialog.askdirectory()`）。调用这些\
  \ API 方法的语法简单且直观，它允许与用户进行双向通信以获取其选择。在 `askcolor()` 的情况下，用户应该注意其结果是一个包含两个值的元组：一个\
  \ rgb（红、绿、蓝）值和一个特定的颜色选择。选定的颜色值可以存储在变量中供后续使用。以下 Python 脚本说明了上述四个 API 方法的使用：\n\n```python\n\
  # 导入库\nimport tkinter as tk\nfrom tkinter import filedialog\nfrom tkinter import\
  \ colorchooser\n\n# 定义 openDialogs() 函数，点击按钮时调用\ndef openDialogs(a):\n    if (a\
  \ == 1):\n        # 将用户的颜色选择赋值一组变量\n        (rgbSelected, colorSelected) = colorchooser.askcolor()\n\
  \        # 使用变量集中的颜色元素来改变\n        # 表单的颜色\n        winFrame.config(background =\
  \ colorSelected)\n    elif (a == 2):\n        filedialog.askopenfile(title = \"\
  Open File Dialog\")\n    elif (a == 3):\n        filedialog.askdirectory(title =\
  \ \"Directory Dialog\")\n    elif (a == 4):\n        filedialog.asksaveasfilename(title\
  \ = \"Save As Dialog\")\n\n# 使用 tk 对象创建一个不可缩放的 Windows 框架\nwinFrame = tk.Tk()\n\
  winFrame.title(\"Common Dialogs\")\nwinFrame.resizable(False, False)\nwinFrame.geometry('280x220')\n\
  winFrame.configure(bg = 'grey')\n\n# 创建触发颜色对话框的按钮\nwinButton1 = tk.Button(winFrame,\n\
  \    text = \"Click to open \\nthe Color dialog\", width = 20)\nwinButton1.pack();\
  \ winButton1.place()\n# 创建触发文件对话框的按钮\nwinButton2 = tk.Button(winFrame,\n    text\
  \ = \"Click to open \\nthe File dialog\", width = 20)\nwinButton2.pack(); winButton2.place()\n\
  # 创建触发目录对话框的按钮\nwinButton3 = tk.Button(winFrame,\n    text = \"Click to open \\\
  nthe Directory dialog\", width = 20)\nwinButton3.pack(); winButton3.place()\n# 创建触发“另存为”对话框的按钮\n\
  winButton4 = tk.Button(winFrame,\n    text = \"Click to open \\nthe Save As dialog\"\
  , width = 20)\nwinButton4.pack(); winButton4.place()\n```\n\n\n\n\n\n除了创建基础菜单结构外，开发者经常选择通过\
  \ `menu shortcuts`（菜单快捷键）来扩展其功能。这可以通过使用 `underline` 选项的 `hot letters` 实现，也可以通过 `accelerator`\
  \ 选项使用特殊键（例如 `control` 键）和字母的组合来实现。在这两种情况下，务必记住，虽然这些选项可能出现在菜单上，但它们不会自动触发相关功能。为了实现这一目的，应该将主窗单\
  \ `bound`（绑定）到相关事件，以触发相应的功能。这是通过 `bind()` 方法实现的。以下应用程序使用了上一节的功能，但实现的是两级深度的基础菜单而不是按钮：\n\
  \n```python\n1   # 导入库\n2   import tkinter as tk\n3   from tkinter import filedialog\n\
  4   from tkinter import colorchooser\n5   from tkinter import messagebox\n6   from\
  \ tkinter import Menu\n7\n8   # 定义函数 colorDialog, openDialog, saveAsDialog, quit,\
  \ askyesno\n9   # 以及 askokcancel，调用相关的对话框或消息框\n10  def colorDialog():\n11      #\
  \ 将用户的颜色选择赋值一组变量\n12      (rgbSelected, colorSelected) = colorchooser.askcolor()\n\
  13      # 修改表单颜色；使用变量集中的颜色元素\n14      winFrame.config(background = colorSelected)\n\
  15\n16  def openDialog():\n17      filedialog.askopenfile(title = \"Open File Dialog\"\
  )\n18\n19  def saveAsDialog():\n20      filedialog.asksaveasfilename(title = \"\
  Save As Dialog\")\n21\n22  def quit():\n23      winFrame.destroy()\n24      exit()\n\
  25\n26  def askyesno():\n27      messagebox.askyesno(\"YesNo message\",\n28    \
