  \ 和 `get()` 方法使用输入。同样，`drawButtons()` 方法（第 82–110 行）创建了框架并放置了执行应用程序基本操作的按钮（即：插入新条目、删除所选条目、清空容器所有内容以及退出应用程序）。特别对于*退出*（Exit）按钮，应该注意使用了\
