  \n此脚本中展示了一些值得注意的想法，涉及到*隐藏*、*禁用*和*锁定*组件的文本，或者使其*显示为密码*。例如，有时需要隐藏并在随后重新显示组件。这通常被称为*调整其可见性*。在\
  \ Python 中，这通过使用 `grid()` 和 `grid_remove()` 方法来实现。应当说明，当组件不可见时，*它并没有被删除*，*仅仅是从网格中被移除了*。方法\
  \ `showHideLabelEntry()` 实现了这一功能。\n\n\n\n\n类似地，`showHideEntryContent()` 方法通过 `set()`\
  \ 和 `get()` 方法实现了隐藏和显示同一输入框部件（entry widget）内容的功能。读者应该注意，输入框部件的内容应该存储在变量中，因为操作 `set()`\
  \ 和 `get()` 方法可能会意外删除它。同样，方法 `enableLockDisableEntryWidget()` 使用 `state` 选项及其对应的\
  \ `normal` 和 `disabled` 值实现了锁定/禁用输入框部件的功能。\n\n最后，如果需要使用文本字体属性，例如**粗体**（bold）或*斜体*（italic），可以像\
  \ `boldContentsOfEntryWidget()` 方法所示那样使用 `font` 选项。还可以让输入框部件的内容显示为 `password`（密码）。`passwordEntryWidget()`\
  \ 方法使用 `show` 选项将每个字符替换为选定的占位符，在本例中为星号（*”）。\n\n其余方法在创建应用程序 GUI 时被分配。\n\n## 4.3 增强\
  \ GUI 体验\n\n前几节介绍的部件、方法、选项和事件应该为创建一个基础系统的 GUI 应用程序提供足够的基础，因为它们涵盖了基础交互的所有基本方面。然而，它们没有解决计算机编程中的两个主要需求：`validation`\
  \ 和 `efficiency`。在数字情况下，经常使用 `spinbox` 和 `scale` 等特定部件来实现验证和改进视觉外观观。在文本情况下，对于需要优化和同步组织的任务，可以使用\
  \ `listbox` 和 `combobox` 等部件。在需要改进选择选项的情况下，经常使用 `Checkbuttons` 和 `radiobuttons`。最后，为了改进\
  \ GUI 的组织结构并避免在运行时意外重新定位部件，可以将各种对象放置在应用程序主框架内的 `individual frames`（独立帧）中。\n\n###\
  \ 4.3.1 独立帧内的 Spinbox 和 Scale 部件\n\n编程的主要挑战之一是在用户与应用程序交互输入数字时，识别并突出显示用户的错误。通常情况下，输入的数值超出了允许范围，或者它们是由文本和数字组成的字母数字序列。为了验证输入的数字是否正确，遵循了两种不同的方法：(a)\
  \ 编写代码以确保输入数字符合正确且接受的形式；(b) 使用 `spinbox` 和 `scale` 等部件来限制用户在 `selecting` 数字时的选项。以下\
  \ Python 脚本利用了此类部件实现了一个小型应用程序，用户可以在其中输入 `speed limit`（限速）、`current speed`（当前速度）以及超过\
  \ `speed limit` 的每公里罚金 `fine per km/h`。一旦输入这些数字，将根据以下公式计算罚金：`fine = (current speed\
  \ - speed limit) * fine per km/h`。为了改进 GUI 的组织结构，脚本使用了一个帧部件，其他各种部件都放置在其之上：\n\n\n\
  \n\n```python\n 1   # 导入必要的模块 \n2   import tkinter as tk\n3   from tkinter import\
  \ ttk\n4\n5   # 声明并初始化全局变量和组件 \n6   # 并定义关联的方法\n7   currentSpeedValue, speedLimitValue,\
  \ finePerKmValue = 0, 0, 0\n8   global speedLimitSpinbox\n9   global finePerKmScale\n\
  10  global currentSpeedScale\n11  global fine\n12\n13  # ===========================================================\n\
  14  # 定义运行速度控制应用的方法\n15  # 定义控制当前速度 Scale 组件变化的方法\n16  def onScale(val):\n17   \
  \   global currentSpeedValue\n18      v = float(val)\n19      currentSpeedValue.set(v)\n\
  20      calculateFine()\n21\n22  # 定义控制限速 Spinbox 组件变化的方法\n23  def getSpeedLimit():\n\
  24      global speedLimitValue\n25      v = float(speedLimitSpinbox.get())\n26 \
  \     speedLimitValue.set(v)\n27      calculateFine()\n28\n29  # 定义控制每公里罚金 Spinbox\
  \ 组件变化的方法\n30  def getFinePerKm(val):\n31      global finePerKmValue\n32      v\
  \ = int(float(val))\n33      finePerKmValue.set(v)\n34      calculateFine()\n35\n\
  36  # 定义根据三个用户参数计算罚金的方法\n37  def calculateFine():\n38      global currentSpeedValue,\
  \ speedLimitValue, finePerKmValue\n39      global fine\n40      diff = float(currentSpeedValue.get())-float(speedLimitValue.get())\n\
  41      finePerKm = float(finePerKmValue.get())\n42      if (diff <= 0):\n43   \
  \       fine.config(text = 'No fine')\n44      else:\n45          fine.config(text\
  \ = 'Fine in USD: '+ str(diff * finePerKm))\n46\n47  # ===========================================================\n\
  48  # 定义创建应用界面的的方法\n49  def createGUI():\n50      currentSpeedFrame()\n51      speedLimitFrame()\n\
  52      finePerKmFrame()\n53      fineFrame()\n54\n55  # 创建包含当前速度组件的框架\n56  def\
  \ currentSpeedFrame():\n57      global currentSpeedValue\n58\n59      CurrentSpeedFrame\
  \ = tk.Frame (winFrame, bg = 'light grey', bd = 2,\n60           relief = 'sunken')\n\
  61      CurrentSpeedFrame.pack()\n62      CurrentSpeedFrame.place(relx = 0.05, rely\
  \ = 0.05)\n63      currentSpeed = tk.Label(CurrentSpeedFrame, text = 'Current speed:',\n\
  \                                                                width = 24)\n64\
  \      currentSpeed.config(bg = 'light blue', fg = 'red', bd = 2,\n65          font\
  \ = 'Arial 14 bold')\n66      currentSpeed.grid(column = 0, row = 0)\n67\n68   \
  \   # 创建 Scale 组件；定义连接到 scale 组件的变量\n69      currentSpeedValue = tk.DoubleVar()\n\
  70      currentSpeedScale = tk.Scale (CurrentSpeedFrame, length = 200,\n71     \
  \     from_ = 0, to = 360)\n72      currentSpeedScale.config(resolution = 0.5,\n\
  73          activebackground = 'dark blue', orient = 'horizontal')\n74      currentSpeedScale.config(bg\
  \ = 'light blue', fg = 'red',\n75          troughcolor = 'cyan', command = onScale)\n\
  76      currentSpeedScale.grid(column = 1, row = 0)\n77      currentSpeedSelected\
  \ = tk.Label(CurrentSpeedFrame, text = '...',\n78          textvariable = currentSpeedValue)\n\
  79      currentSpeedSelected.grid(column = 2, row = 0)\n80\n81  # 创建包含限速组件的框架\n\
  82  def speedLimitFrame():\n83      global speedLimitValue\n84      global speedLimitSpinbox\n\
  85\n86      SpeedLimitFrame = tk.Frame(winFrame, bg = 'light yellow', bd = 4,\n\
  87          relief = 'sunken')\n88      SpeedLimitFrame.pack()\n89      SpeedLimitFrame.place(relx\
  \ = 0.05, rely = 0.30)\n90     # 在限速框架上创建提示标签\n91     speedLimit=tk.Label(SpeedLimitFrame,\
  \ text='Speed limit:', width=24)\n92     speedLimit.config(bg = 'light blue', fg\
  \ = 'yellow', bd = 2,\n93         font = 'Arial 14 bold')\n94     speedLimit.grid(column\
  \ = 0, row = 0)\n95     # 创建 Spinbox 组件；定义连接到 Spinbox 的变量\n96     speedLimitValue\
  \ = tk.DoubleVar()\n97     speedLimitSpinbox = ttk.Spinbox(SpeedLimitFrame,\n98\
  \         from_ = 0, to = 360, command = getSpeedLimit)\n99     speedLimitSpinbox.grid(column\
  \ = 1, row = 0)\n100    speedLimitSelected = tk.Label(SpeedLimitFrame, text = '...',\n\
  101        textvariable = speedLimitValue)\n102    speedLimitSelected.grid(column\
  \ = 2, row = 0)\n103 # 创建包含每公里罚金的框架\n104 def finePerKmFrame():\n105     global finePerKmValue\n\
  106\n107     finePerKmFrame = tk.Frame(winFrame, bg = 'light green', bd = 2,\n108\
  \         relief = 'sunken')\n109     finePerKmFrame.pack()\n110     finePerKmFrame.place(relx\
  \ = 0.05, rely = 0.55)\n111     # 在每公里罚金框架上创建提示标签\n112     speedLimit=tk.Label(finePerKmFrame,\
  \ text='Fine/Km (USD):',\n113         width=24)\n114     speedLimit.config(bg =\
  \ 'light blue', fg = 'brown', bd = 2,\n115         font = 'Arial 14 bold')\n116\
  \     speedLimit.grid(column = 0, row = 0)\n117     # 创建 Spinbox 组件；定义连接到 Spinbox\
