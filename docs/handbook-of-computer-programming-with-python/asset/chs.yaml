  \       62.63           64\n9         58.75           52\n10        49.75      \
  \     62\n11        44.25           42\n12        62.52           68\n13       \
  \ 47.33           52\n14        68.97           70\nThe slope and intercept values\
  \ are: 0.62,      23.96\nThe value of R-square is: 0.57\nThe value of statistical\
