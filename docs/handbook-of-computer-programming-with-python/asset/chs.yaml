  \n## 6.2 列表、元组、集合、字典\n\n本节探讨了 Python 提供的四内置数据结构，即 `lists`、`tuples`、`sets` 和 `dictionaries`。这些结构在第\
  \ 2 章中也被简要讨论，在那里被称为 `non-primitive` 数据类型。它们的主要用途是存储值集合并提供对其操作的工具。\n\n### 6.2.1 列表\
  \ (List)\n\n`list` 是一种在指定的且通常是连续的内存位置中存储项集合的数据结构。列表中的每个项都有一个称为 `index` 的位置编号。索引从零开始并遵循\
  \ `sequential` 顺序。这并不是指存储的数据值按特定方式（例如字母顺序）排序，而是指 `index` 值。要访问特定位置的项，程序员只需使用该位置对应的索引数字。列表的概念类似于一个包含必须完成事项的待办列表。在功能方面，Python\
  \ 提供了各种操作，例如向列表中添加项和从列表中移除项。由于列表中的项是可以修改的，因此被认为是 `mutable`（可变的）。\n\n在实际层面，Python\
  \ 中的列表用方括号表示（即 `[]`）。可以通过在括号内添加用逗号分隔的项来填充列表。以下脚本创建一个列表，然后同时打印列表 `items` 和列表中的 `number\
  \ of items`。它还要求用户指定要打印的项的索引（从零开始）、从列表开始到用户指定索引的项范围，以及从用户指定索引到列表末尾的项打印范围：\n\n```\n\
  \ 1   # Create the list\n2   cars = [\"BMW\", \"Toyota\", \"Honda\", \"Mercedes\"\
  ]\n3\n4   # Print the list items\n5   print(\"The list of the cars is the following:\
  \ \", cars)\n6\n7   # Use the len() function to print the number of items in the\
  \ list\n8   print(\"The number of items in the list is: \", len(cars))\n9\n10  #\
  \ Ask the user for the index number of an item for printing\n11  singleIndex = int(input(\"\
  Enter the index \\\n12  of the item to print (indexes start from 0): \"))\n13  print(\"\
  Your selection for display is: \", cars[singleIndex])\n14\n15  # Ask the user for\
  \ the starting index of the print range \n16  startingIndex = int(input(\"Enter\
  \ the starting index of the range \\\n17  of items to print (index starts from 0):\
  \ \"))\n18  print(\"Your selected range of items to display is: \",\n19        cars[startingIndex:len(cars)-1])\n\
  20\n21  # Ask the user for the ending index of the print range\n22  endingIndex\
  \ = int(input(\"Enter the ending index of the range of items \\\n23  to print (index\
  \ starts from 0): \"))\n24  print(\"Your selected range of items to display is:\
  \ \",\n    cars[0:endingIndex])\n25\n26  # Use a negative index to start printing\
  \ the list from the end\n27  print(\"The last item in the list is: \", cars[–1])\n\
  ```\n\n**输出 6.2.1.a:**\n\n```\n The list of the cars is the following: ['BMW', 'Toyota',\
  \ 'Honda', 'Mercedes']\nThe number of items in the list is: 4\nEnter the index of\
  \ the item to print (indexes start from 0): 0\nYour selection for display is: BMW\n\
  Enter the starting index of the range of items to print (index starts from 0): 1\n\
  Your selected range of items to display is: ['Toyota', 'Honda']\nEnter the ending\
  \ index of the range of items to print (index starts from 0): 2\nYour selected range\
  \ of items to display is: ['BMW', 'Toyota']\nThe last item in the list is: Mercedes\n\
  ```\n\n在该脚本中，读者会注意到调用项范围项的语法是 `list[start:end]`。读者还应该注意，如果用户尝试使用不存在的索引访问列表，将抛出 `IndexError`\
  \ 异常，如例所示。\n\n\n\n\n```python\n# 创建列表\ncars = [\"BMW\", \"Toyota\", \"Honda\", \"\
