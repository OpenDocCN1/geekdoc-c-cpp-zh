  \n# 9 使用 Python 进行统计分析\n\nHan-I Wang\n约克大学\n\nChristos Manolas\n约克大学\n伦敦 Ravensbourne\
  \ 大学\n\nDimitrios Xanthidis\n伦敦大学学院\n高等技术学院\n\nDOI: [10.1201/9781003139010-9](https://doi.org/10.1201/9781003139010-9)\n\
  \n## 9.1 引言\n\n在处理数据时，人们寻求回答的主要问题之一是观察到的值波动和差异是否是随机的。如果不是偶然，那么导致这些变化的关键因素是什么，它们与数据之间有什么关系？统计分析，特别是推断统计，是回答这些问题的关键工具。\n\
  \n在本章中介绍了一些常用的统计函数以及不同类型测量与统计检验之间的关系，并演示了如何在 Python 中执行相关的统计分析任务。这些分析函数遵循线性且递进的顺序，并建立在之前介绍的概念之上，以帮助在该领域缺乏或没有先验经验的读者。对于熟悉所讨论的各种概念和函数的读者，本章可以作为复习，或者作为使用\
  \ Python 平台实现和执行常用统计函数的实用指南。\n\n读者应该注意，在开始任何涉及统计分析的重大任务之前，咨询统计学专家是关重要的，以确定合适的数据收集函数和测量单位、所需的统计检验类型以及解释和报告结果的最佳方法。\n\
  \n### 9.1.1 什么是统计学？\n\n统计学是应用数学的一个分支，涉及数据收集、处理、解释和预测任务。统计学领域可以分为两大类：描述性统计和推断统计。描述性统计（在第\
  \ 8 章 数据分析与数据可视化中部分涵盖）侧重于利用频率和均值计算等简单函数来识别和描述数据中的模式。在描述性统计中，没有不确定性或未知因素。目标是总结大量数据，使其更容易可视化和理解。另一方面，推断统计侧重于对从广泛总体中抽取的样本提出假设（或推论）。这些假设可以推广并应用于整个总体。因此，由于样本不包含整体，利用推断统计的分析任务必然包含不确定性。\n\
  \n读者必须注意，“统计”（statistics）一词通常指代推断统计，而当分析任务仅用于描述数据时，使用描述性统计。根据这一习惯，在本章中，“统计”一词通常指代推断统计，另有另说明。\n\
  \n### 9.1.2 为什么使用 Python 进行统计分析？\n\n有很多专用工具，如 `SAS`、`Stata`、`R` 和 `SPSS`，它们被广泛应用于学术和商业目的。然而，由于这些软件包由不同的开发者开发，它们使用了无法跨平台直接转换的自定义功能和语法。相反，Python\
  \ 是一种通用编程语言，具有强大的跨平台能力。这种特性使得 Python 在处理结合统计与其他数据科学领域（如图像分析、文本挖掘以及人工智能和机器学习）的复杂分析任务时具有优势。在这种情况下，Python\
  \ 通过模块调整功能的丰富性和灵活性使其成为其他统计包更好的选择。此外，Python 语言与那些专用工具相比相对容易学习。它的语法类似于英语，易于学习和使用，因此适用于不同背景和编程水平的用户。最后，Python\
  \ 是一个开源且免费的语言，与大多数通常需要高昂成本的软件包不同。\n\n### 9.1.3 可用库概述\n\n许多 Python 库如 `NumPy`、`SciPy`、`Scikit-learn`\
  \ 和 `Pandas` 提供了允许执行特定统计分析任务的函数和工具。正如名称所示，`NumPy` 和 `SciPy` 侧重于数值科学计算，因为它们支持对多维数组的基本操作。相应的，`Scikit-learn`\
  \ 主要用于机器学习和数据挖掘，因为它为常见的数据分析任务提供了简单高效的工具。Pandas 派自“面板数据”（panel data）一词，旨在数据处理和分析\
  \ (McKinney & Team, 2020）。对于纯统计分析目的，Pandas 库是是最合适的选项之一，因为它提供了高性能的数据分析工具（Anaconda\
  \ Inc., 2020）。\n\n\n\n\n读者会注意到，本章涵盖的大部分工作所选择的库是 `Pandas`。这主要基于三个原因。首先，该库非常适合本章涵盖的统计分析任务类型。其次，它支持不同的数据格式，如`逗号分隔值\
  \ (.csv)`、`纯文本`、`Microsoft Excel (.xls)` 和 `SQL`，允许用户轻松地导入、导出和操作数据库。第三，它构建在 `SciPy`\
  \ 库之上，因此结果可以方便地输入相关库（如用于绘图的 `Matplotlib` 和用于机器学习任务的 `Scikit-learn`}(Mclntire et\
  \ al., 2019)）。这突出了另一个本章结构和逻辑的核心概念：*针对不同的分析任务选择性地使用不同的库和函数*。例如，可以使用 `SciPy` 库中的函数执行特定的分析任务，同时使用\
  \ `Matplotlib` 库中的函数对输出数据进行绘图。这种方法旨在推广理念：只要各种不同分析任务的基本原理和逻辑保持不变*读者应该有信心去探索不同的工具包和解决方案*。\n\
  \n## 9.2 基础统计概念\n\n不熟悉统计分析复杂性的读者在遇到`显著性`、`p 值`或`置信区间`等概念时，可能会疑惑这些术语究竟是什么意思，以及为什么它们在统计学中如此重要。在本节中，将使用简单的示例对关键统计概念以及随之常见的、令人生畏的术语进行讨论和语境化。这有助于读者理解`描述性`统计与`推断性`统计之间的联系与区别，以及科学家经常以及为什么从前者转向后者。\n\
  \n### 9.2.1 总体与样本：从描述统计到推断统计\n\n`总体`（Population）可以定义为需要进行泛化观察或假设的个体或对象的整体，而`样本`（sample）则是从该总体中实际收集数据的实际。因此，样本必然是*整个总体的一小部分*。\n\
  \n在理想情况下，可以获取总体的个体信息。在这种情况下，可以使用描述性统计函数来描述数据中观察到的模式。然而，这种情况极其罕见。在大多数情况下，与数据收集和分析任务相关的预算和时间限制施加了巨大的限制。当研究总体规模很大时，情况尤其如此，而这确实是一个常见的情况。例如，如果对对英国所有糖尿病患者的生活质量进行全国性调查，研究人员必须访问大约\
  \ 470 万人的总体（Diabetes UK, 2019）。可以说，调查一组糖尿病患者比调查整个总体要高效得多。在这些情况下，由于研究人员可以获得样本的信息，因此需要允许根据样本对总体进行`推断`（inferences）的统计函数。测量全国`体质指数\
  \ (BMI)`分数可以作为一个示例来说明其内在逻辑。假设想要测量英国所有吸烟者的 BMI 分数。由于从整个英国吸烟者总体获取信息是不可能的，将抽取一个样本，并用其得出结论。最终，通过推断统计将结果推广到整个英国吸烟者总体。\n\
  \n为了确定所需的样本量，有多种`采样函数`。这些包括但不限于`随机采样`、`聚类采样`和`分层采样`。根据研究背后的科学问题以及研究总体的特征，特定的采样函数可能比其他函数更合适。对采样函数的详细分析以及如何选择采样函数超出了本章的范围。但是，对于对进一步了解该主题感兴趣的人，有很多相关的资源，如专业的统计书籍和在线材料。\n\
  \n在将样本的发现和观察推广到整个总体方面，人们可能会好奇这种推广如何是可能且可靠的。在最简单的形式中，这是通过`符合一组严格的最低要求`来实现的，总结如下：\n\
  \n1. 样本必须对结果将要推广的总体具有`代表性`。代表性意味着样本应该尽可能地反映总体的特定特征，例如年龄、性别或种族背景。\n2. 它必须适合`定量`地回答研究问题。\n\
  3. 它必须允许进行`假设检验`，正如研究问题所暗示的那样。\n4.`数据分析必须与所分析的数据类型相`。换句话说，需要对现有数据使用正确的统计函数。\n\n\
  这些概念将在接下来的章节中进一步讨论。\n\n### 9.2.2 假设与统计显著性\n\n一旦从研究总体中提取了代表性样本，就会根据基础的`研究问题`提出`假设`（hypotheses）。随后，这些假设将经过系统性的测试，以衡量证据的强度并对整个总体得出结论。这通常被称为`假设检验`。因此，假设检验是`对研究总体做出主张并使用样本数据检查该主张是否有效`的过程。科学界内一个常见且久远的惯例是，这一主张是基于假设`不会成立`的假设，换句话说，分析将显示所研究的干预或条件在总体背景下`没有差异`或`没有影响`。这是一种特定且标准化的假设类型，在统计测试中至关重要，通常被称为`零假设\
  \ (H*[0]*)`。对于不熟悉科学方法的人来说，预期分析将揭示`没有差异`而非`存在差异`的事实似乎是反直觉的。然而，读者应该注意，这种想法背后的逻辑是，分析者寻求的是`拒绝`零假设而不是`证实`它。换句话说，假设是，如果能够`反伪`零假设（即没有差异），那么差异或效应`在总体中必须存在`。\n\
  \n\n\n\n\n为了验证零假设的有效性，需要进行一种详细且严格定义的测试，通常被称为`统计显著性`检验。有许多统计显著性检验供选择，具体取决于研究问题和手头的数据（有关测试选择以及如何在\
  \ Python 中进行此类测试的更多细节，请参阅第 9.3 节）。所有这些测试的共同特征是，它们计算了样本中观察到的结果与整个总体中可能得到的结果一致的`概率`。这被称为`p\
  \ 值`（p-value），它描述了在零假设成立的情况下，数据通过纯随机偶然发生的概率有多大。因此，如果 `p-value` 较高，观察到的样本数据将`确认`零假设，因此`总体中一定不存在差异`。如果\
  \ `p-value` 较低，则表明观察到的样本数据与零假设（`H[0]`）不一致，因此被`拒绝`。在这种情况下，可以得出结论`总体中一定存在差异`，且这种差异在统计学上是`显著的`，或者说检测到了`显著差异`。\n\
  \n作为上述内容的实际示例，读者可以假设一项关于新型高血压药物有效性的研究，通过比较使用该药物的人与使用传统高血压药物的人的血压水平来完成。可以进行假设检验来检测新药干预是否对样本产生任何影响。零假设将基于以下主张：样本中两种两种不同药物的用户之间血压水平没有差异。将进行假设检验并生成一个\
  \ `p-value`。如果 `p-value` 较低且零假设被拒绝，则有证据表明在总体中，两种药物的药效之间确实存在差异。\n\n此时，读者可能开始好奇 `p-value`\
  \ 应该达到多低才会被被认为是低。答案是，这取决于为研究问题选择的`显著性水平`（significance level）。换句话说，对于每个研究问题，都需要确定概率（即\
  \ `p-value`）必须有多高或多低，才能结论样本数据是否与零假设一致。按照惯，如果 `p-value` 小于 0.05 (5%)，则认为差异是显著的。本质上，`p-value`\
  \ 可以被视为证据`强度`的指标。读者可以使用 p 值的分类作为确定特定分析任务是否满足统计显著性要求的粗略指南（表 9.1）。\n\n#### 表 9.1 p\
  \ 值与显著性\n\n| p-value | `显著性` |\n| :--- | :--- |\n| `>0.1` | 关于差异或关系的证据极少或没有。 |\n\
  | `0.05–0.1` | 关于差异或关系的微弱证据。 |\n| `0.01–0.05` | 存在差异或关系的证据。 |\n| `0.001–0.01` |\
  \ 关于差异或关系的强有力证据。 |\n| `<0.001` | 关于差异或关系的极强有力证据。 |\n\n使用相同的高血压药物示例，如果发现假设检验的 `p-value`\
  \ 为 0.03，这表明在随机采样的数据中出现相同治疗效果的概率为 3%。由于 3% 的概率低于 5% 的统计显著性阈值，可以拒绝零假设，从而得出结论：在总体治疗效果方面，两种药物之间存在显著差异。值得注意的是，这里的\
  \ `p-value` 仅表示`统计学关系而非因果关系`。要识别因果关系，需要更复杂的推断统计分析方法，例如回归（参见第 9.5.11 节、9.5.12）。\n\
  \n### 9.2.3 置信区间\n\n统计学中常用的另一个关键概念是`置信区间`（confidence intervals）。该术语用于描述`一个测试实际值可能落在范围`而不是单一的估计值。更具体地说，在推断统计中，主要目标之一是估计总体参数。然而，诸如`总体均值`和`标准差`等参数总是未知的，因为在整个总体中进行准确测量是非常困难甚至是不可能的。相反，估计是基于样本的。为了在选择样本时避免`选择偏差`并实现对总体准确且客观的表示，通常使用`随机采样`等方法。然而，即使使用了这些方法，由于`采样误差`的存在，对总体估计的不确定性在某种程度上仍然存在。必须指出，尽管使用了该术语，但采样误差并不是指实际的错误。它们的出现由于使用了随机样本而非整个总体所产生的不可避免的偶然变异。尽管如此，为了统计检验的目的，它们被视为误差，因为它们可能导致不准确的结论。\n\
  \n虽然采样误差不能完全消除，但`置信区间`通过考虑这些潜在误差并提供实际值可能落的范围来起到中介作用。作为一个示例，可以假设研究人员想知道英国所有学生的平均高度。由于无法测量每个学生的高度，可以使用\
  \ 1000 名学生的随机样本。如果样本测量分析得出的平均高度为 165 厘米，尽管使用了随机采样，总体均值也不可能完全相等。如果样本平均高度表示为 160 到\
  \ 170 之间的置信区间，研究人员可以相信整个总体的平均高度在这个范围内。\n\n### 9.3 进行统计分析前的关键考虑因素\n\n在 Python 中进行统计分析之前，必须考虑数据收集过程的关键方面，以及用于分析所收集数据的工具和方法。在基础水平上，这些考虑因素包括：\n\
  \n* 用于数据收集的测量标度`和`变量类型`，\n* 待测试的`假设`，以及\n* 用于数据分析的`统计检验`。\n\n`变量`是可以测量的特征、因素或数量，它可以在个体之间变化或随时间变化（或两者兼之）。例如，`年龄`是一个个体之间变化并随时间变化的变量，而`收入`也在个体之间变化，但可能不随时间变化。\n\
  \n\n\n\n\n变量通常根据其所用于的测量类型以及该测量的详细程度进行分类。接下来的章节将简要介绍不同类型的变量、相关的统计检验类型，以及如何根据手中的变量类型选择合适的统计检验方法。\n\
  \n### 9.3.1 测量水平：分类变量与数值变量\n\n`分类变量`（Categorical variables），也称为`定性变量`（qualitative\
  \ variables），用于描述对象、事件或个体的`类别`（categories）或`因素`（factors）。例如`性别`，包含有限的类别（例如，女性、男性）。分类变量也可以取数值（例如，\
  \ 1 代表女性，2 代表男性）。然而，这些值仅用于编码和索引目的，`不具有任何数学意义`。分类变量分为两种：`名义变量`（nominal）和`序数变量`（ordinal）。下方提供了每种类型的简要描述。\n\
  \n- `名义变量`（Nominal variables）可以有两个或多个离散状态，但这些状态之间没有隐含的顺序。例如，`性别`（即女性、男性）是一个名义变量。`婚姻状况`（即未婚、已婚、离婚）和`种族背景`（如：非洲人、亚洲人、白人）也是名义变量的示例。同样，在医学研究中，处于`治疗中`或`未治疗`状态的患者也可以用名义变量描述。\n\
  \n- `序数变量`（Ordinal variables）也可以有两个或多个离散状态，但与名义变量不同，它们是可以`有序的`或排名的。例如，允许受访者在 1（非常不同）到\
  \ 5（非常同意）之间选择一个值的`满意度量表`就是序数变量的示例。`年龄段`（例如 20–29，30–39 等）和`收入`可以表示为序数变量。\n\n- `连续变量`（Continuous\
  \ variables），也称为`定量变量`（quantitative variables），是指可以稳定增加或减少，或按可定的程度或数量变化的变量。连续变量分为两种，即`间距变量`（interval）和`比例变量`（ratio）。下方提供了每种类型的简要描述。\n\
  \n- `间距变量`（Interval variables）是`可测的`且`有序的`，并且不同值之间的间隔是相等的。例如，以度（如摄氏度）衡量的`温度`就是间距变量，因为\
  \ 40°C 与 30°C 之间以及 30°C 与 20°C 之间的差都是 10°C 的等距间隔。间距变量的其他示例包括`年龄`（以年、月或天为单位，而不是前一个示例中的序数`年龄段`）或`pH`。间距变量的另一个特征是它们没有`真正的零点`。例如，不存在所谓的`没有温度`，因为\
  \ 0°C 的温度仍然是一个可测的温度。因此，间距变量的值也可以`相加`或`相减`（但不能相乘或相除）。\n\n- `比例变量`（Ratio variables）与间距变量相似，有一个重要的区别：`它们确实有一个真正的零点`。当比例变量等于\
  \ 0 时，意味着该变量为`不存在`。比例变量的示例包括`身高`、`体重`和`长度`。此外，由于真正零点的存在，两个测量值之间的比例具有新的意义。例如，一个重\
  \ 10 kg 的物体重量是 5 kg 物体的两倍。然而，30°C 的温度（间距变量）不能被认为是 15°C 的两倍热。人们只能声称 30°C 的温度比 15°C\
  \ 高。\n\n### 9.3.2 变量类型：依赖变量与独立变量\n\n变量通常被分类为`独立`或`依赖`。`独立变量`（Independent variables），也称为`预测``、`解释`、`控制变量`、`输入变量`或`暴露变量`，对依赖变量有影响，但自身不受任何其他变量的影响，因此得名。相应地，`依赖变量`（Dependent\
  \ variables），也称为`观测`、`结果`、`输出`或`响应`变量，是指根据相关的独立变量的变化而变化的变量。最终，在科学实验中，人们试图通过改变或控制独立变量，以测试这些变化对依赖变量的影响。\n\
  \n例如，可以考虑以下研究问题：\n\n- `治疗时长是否会导致健康结果的改善？`\n\n在这种情况下，`治疗时长`是独立变量，而`健康结果`是依赖变量。同样，如果提出以下问题：\n\
  \n- `阿司匹林剂量如何影响第二次心脏发作的频率？`\n\n`阿司匹林剂量`将是独立变量，而`心脏发作频率`将是依赖变量。\n\n值得提到的是，根据上下文，任何类型的分类变量或连续变量都可以是独立或依赖的。下方的图\
  \ 9.1 提供了各种不同类型变量的总结。\n\n![](img/Fig09_01.jpg)\n\n**图 9.1**](#C_012_c9.xhtml_f9_1b)\
  \ 变量类型。\n\n### 9.3.3 统计分析类型与假设检验\n\n有多种统计分析类型和假设检验。通常，统计分析可以解决三类主要的调查性问题：`总结`、`比较`和`关系`。常见统计分析类型的更详细列表及其用于解决的问题类别，见下方的表\
  \ 9.2。\n\n#### 9.3.3.1 总结性问题的统计分析\n\n此类类型的统计分析主要用于总结和描述`给定时间`的单个变量。此类类型最常见的统计方法是计算连续变量的`平均值`和`中位数`，以及分类变量的`频率`。\n\
  \n#### 9.3.3.2 比较性问题的统计分析\n\n此类统计分析涉及两个或多个组之间单个变量的`均值`比较。例如，如果人们需要知道男女之间的`体重质量指数\
  \ (BMI)`数字是否存在显著差异，或者一种新药是否可以降低血压（即测量治疗前后的血压）。在此类分析中，使用`p 值`来确定差异是否具有`统计显著性`。\n\n\
  总来说，有六种常见的检验类型用于比较性假设。针对特定任务选择合适的检验取决于许多因素，例如样本量、数据特征和比较组。这类类型的检验可以进一步分为两大类：`参数`和`非参数`（表\
  \ 9.3）。\n\n**表 9.2**](#C_012_c9.xhtml_t9_2b) 常见统计检验类型\n\n| **统计** | **调查性问题** |\
  \ **常见统计检验** |\n| --- | --- | --- |\n| 描述性 | 总结 | 连续变量：平均值、中位数、众数 分类变量：频率 |\n| 推断性\
  \ | 比较 | 连续变量：非参数曼-惠特尼 U 检验威尔 coxon 符号秩检验 Kruskal-Wallis、莫德中位数检验 参数检验独立样本 t 检验 配对样本\
  \ t 检验 方差分析检验 (ANOVA) 分类变量：卡方检验 |\n| 推断性 | 关系 | 无因果关系的关联强度皮尔逊相关系数卡方检验 具有因果关系的关联强度线性回归\
  \ 逻辑回归 |\n\n\n\n\n参数分析与非参数分析的主要区别在于，前者测试的是组的`均值`（means），而后者测试的是组的`中位数`（medians）。当每组的样本量足够大且比较数据是`连续的`（continuous）并符合正态分布时，参数统计检验更为优。参数检验比相应的非参数检验具有更高的统计效能，因此能够更有效地检测出存在的潜在效应。然而，在样本量较小或比较数据呈现`偏态`（skewed）或`非连续`（例如，五点李克特量表）的情况下（De\
  \ Winter & Dodou, 2010），非参数统计方法更为合适。表 9.4 提供了选择是否使用参数检验和非参数检验的样本量阈值简单指示列表。读者可以在帮助用户选择统计检验的各种可用资源找到更多关于此主题的内容，例如\
  \ Minitab (2015)。\n\n### 表 9.3](#C_012_c9.xhtml_t9_3b) 常见比较统计检验类型\n\n| 参数检验（均值）\
  \ | 非参数检验（中位数） |\n| --- | --- |\n| 独立样本 t 检验 | Mann-Whitney U 检验 |\n| 依赖（配对）样本 t\
  \ 检验 | Wilcoxon 符号秩检验 |\n| 方差分析 (ANOVA) | Kruskal-Wallis 检验，Mood 中位数检验 |\n\n无论样本量大小如何，当比较两个不同的均值或中位数时，统计分析可以进一步分为两类，取决于均值或中位数是来自`独立`（independent）组还是来自同一组内的`重复测量`（repeated\
  \ measurements）。如果来自独立组，参数分析应使用`独立 t 检验`（independent t-tests），非参数分析应使用 `Mann-Whitney\
  \ U 检验`。此类情况的例如基于男女 BMI 测量的分析，或英国和美国人口的身高。如果均值或中位数来自同一组内的重复测量，则参数分析应使用`依赖 t 检验`（dependent\
  \ t-tests），非参数分析应使用 `Wilcoxon 符号秩检验`（Wilcoxon Signed-Rank tests）。这方面的例子是使用新药前后的血压测量。\n\
  \n### 表 9.4](#C_012_c9.xhtml_t9_4b) 选择参数检验与非参数检验的简单指南\n\n| 非参数检验 | 样本量 | 参数检验 |\n\
  | --- | --- | --- |\n| Mann-Whitney U 检验 | 每组 `N` = 15 | 独立样本 t 检验 |\n| Wilcoxon\
  \ 符号秩检验 | `N` = 30 | 依赖（配对）样本 t 检验 |\n| Kruskal-Wallis，Mood 中位数检验 | 比较 2–9 组，每组\
  \ `n` = 15；比较 10–12 组，每组 `n` = 20 | 方差分析 (ANOVA) |\n\n人们还可以比较三个或更多不同的均值或中位数。这方面的例子是比较不同族群的身高。在这种情况下，应使用`方差分析\
  \ (ANOVA)`检验。简单来说，ANOVA 可以被视为 `t` 检验的不同实现，允许人们比较两个以上组的均值或中位数。\n\n#### 9.3.3.3 关系探究性问题的统计分析\n\
  \n这种类型的统计分析用于研究两个或多个变量之间的`关系`（relationship）。根据变量的类型和分析的目的，它可以进一步分为四个子类，如表 9.5 所示。\n\
  \n### 表 9.5](#C_012_c9.xhtml_t9_5b) 常见关系统计检验类型\n\n| 变量类型 | 统计检验 | 关联强度 | 因果关系 |\n\
  | --- | --- | --- | --- |\n| 连续变量 | 相关性分析（线性回归） | 相关性 | 线性回归 |\n| 分类变量（分类变量） | 卡方检验（逻辑回归）\
  \ | – | 逻辑回归 |\n\n通常而言，关系统计分析适用于：\n\n*   `假设检验`（hypothesis testing），\n*   测量`关联强度`（association\
  \ strength），以及\n*   探究`因果关系`（causal relationships）。\n\n`假设检验`是尝试检查两个变量之间是否存在关联。例如，人们可能想知道每日钠摄入量的增加会导致血压变化图\
  \ 9.2。如果检验结果的 p 值为 0.05，则假设盐分摄入与血压之间存在显著关系。\n\n![](img/Fig09_02.jpg)\n\n### 图 9.2](#C_012_c9.xhtml_f9_2b)\
  \ 每日摄入量与血压之间的关系。\n\n`关联强度`（Association strength）是衡量两个变量相关紧密程度的指标（表 9.6）。这通常用 `R`\
  \ 或 `R(*2)` 值表示，范围从 −1.0 到 1.0。正数表示`正相关`（positive correlation）（例如，如果一个变量增加），负数表示`反相关`（inverse\
  \ correlation）（例如，一个变量减少）。经验法是，当 `R` 高于 0.7 或低于 −0.7 时，两个变量被认为高度相关。当 `R` 高于 0.7\
  \ 或低于 −0.7 时，两个变量被认为是`高度相关`。在图 9.2 所示的示例中，`R` 为 0.82。因此，摄入量之间存在正相关。\n\n### 表 9.6](#C_012_c9.xhtml_t9_6)\
  \ *R* 值与相关强度\n\n| *R* 值 | 相关性强度 |\n| --- | --- |\n| 1.0 | 完美正相关 |\n| 0.7 | 强正相关\
  \ |\n| 0.5 | 中等正相关 |\n| 0.3 | 弱正相关 |\n| 0 | 无相关 |\n| −0.3 | 弱负相关 |\n| −0.5 | 中等负相关\
  \ |\n| −0.7 | 强负相关 |\n| −1.0 | 完美负相关 |\n\n`因果关系`（causal relationships）的调查是尝试通过跨越点云的方程将两个变量联系起来。方程通常表示为\
  \ `Y = a + bX`，并可用于预测。在图 9.2 所示的示例中，因果关系结果显示血压等于`114.5 + 3.5 每日钠摄入量`。这表明如果已知个人的每日摄入量，就可以预测其大致血压。例如，当每日摄入量为\
  \ 3 g 时，血压为 125 mmHg。\n\n当两个变量都是`连续的`时，可以使用两种常用的统计分析来测试它们的关系：`相关性`和`线性回归`（McDonald,\
  \ 2014)）。简单来说，相关性为了检验假设而测量 p 值，并通过总结 `R` 值来量化两个连续变量之间关系的方向和强度。然而，相关性不能推导出`因果`关系。另一方面，线性回归类似于相关性提供假设检验的\
  \ p 值，但还可以通过描述变量关系的方程来总结因果关系。\n\n### 表 9.7](#C_012_c9.xhtml_t9_7b) 选择正确统计检验的快速查表\n\
  \n| 变量数量 | 问题类型 | 因变量类型 | 自变量类型 | 统计检验 |\n| --- | --- | --- | --- | --- |\n| 1 |\
  \ 总结 | 连续变量 | – | 平均值、众数 |\n| 1 | 总结 | 分类变量 | – | 频率 |\n\n\n\n\n| 1 | 比较 | 连续 |\
  \ 2 组 | t-检验 |\n| 1 | 比较 | 连续 | 3+ 组 | 方差分析 (ANOVA) |\n| 1 | 比较 | 类别 | 2+ 组 | 卡方检验\
  \ |\n| 2 | 关系 | 连续 | 1 个连续变量 | 相关性 |\n| 2 | 关系 | 类别 | 1 个分类变量 | 卡方检验 |\n| 2+ | 关系\
  \ | 连续 | 1+ 变量 | 线性回归 |\n| 2+ | 关系 | 类别 | 1+ 变量 | 逻辑回归 |\n\n当变量为`categorical`（分类变量，即名变量和序变量）时，可以使用另外两种统计分析方法来测试它们的关系：`chi-square\
  \ test`卡方检验和`logistic regression`逻辑回归。卡方检验通过提供 p 值来检验关联。例如，如果对`gender`和`吸烟状态`之间的关系感兴趣，可以使用卡方检验。如果结果\
  \ p 值为 0.015，则可以假设性别与吸烟状态之间存在强关联。与相关性一样，卡方检验不能推断因果关系。要做到这一点，则需要逻辑回归。后者在意义上类似于线性回归，因为它可以用方程总结因果关系，并使用该方程进行预测。两者唯一的区别是，逻辑回归用于分类数据，而线性回归用于连续数据。\n\
  \n读者可以在表 9.7 中找到本节讨论的若干常用统计分析测试的列表及简要描述。\n\n### 9.3.4 选择正确的统计分析类型\n\n在进行分析工作时，选择正确的统计分析类型是最重要的考虑因素之一。这一决定通常基于变量的类型和数量，对于在该研究领域经验少的人来说，这可能是一个具有挑战性的过程。表\
  \ 9.7 提供了一个`cheat sheet`（速查表），用于判断何时选择第 9.3.3 节和表 9.2 中提到的统计测试。第一列包含调查的`number of\
  \ variables`（变量数量），第二列是试图回答的`research question`（研究问题）类型。第三、四列包含`independent`变量和`dependent`变量的类型，第五列是推荐的`statistical\
  \ test`。图 9.3 还提供了一个决策树图，每个树分支的末端都是推荐的统计测试。通过使用这些资源作为指南，读者应该能够为当前的数据类型和研究问题找到合适的统计测试。必须注意的是，这只是对统计测试适用性和选择主题的简要介绍。除了根据此类指南做出决定外，在开始任何严肃的分析任务之前，咨询统计学家和分析专家总是很有且建议的。\n\
  \n![](img/Fig09_03.jpg)\n\n**图 9.3**](#C_012_c9.xhtml_f9_3b) 选择正确的统计分析。\n\n## 9.4\
