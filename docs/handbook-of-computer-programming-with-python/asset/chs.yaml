  \n## 10.9 其他学习算法\n\n许多其他机器学习（ML）算法也经常用于现实应用。其中最流行的是 `random forest`（[Andrade et\
  \ al., 2019; Kwon et al., 2015; Naveed & Alrammal, 2017; Naveed et al., 2020)),*\
  \ 一种监督式`机器学习算法。它可以同时用于分类和回归。`random forest` 的核心思想是创建多个机器学习决策树模型，并使用所谓的 `bootstrap\
  \ sampling` 方法创建数据集。根据该方法，每个子数据集都由原始数据集的随机子样本组成。每个定义的训练数据集都用于创建一个不同的模型，这些模型使用相同的机器学习算法并做出不同的预测。最终使用最佳预测作为该过程的结果。\n\
  \n`random forest` 算法可以使用以下四个步骤来描述：\n\n* **步骤 1：** 从给定数据集中选择随机样本。\n* **步骤 2：** 为每个样本创建一个决策树，并获取每个决策树的预测结果。\n\
  * **步骤 3：** 对每个预测结果进行投票。\n* **步骤 4：** 使用最佳预测作为过程的结果。\n\n\n\n\n\n-   **相似 Pin：**\
  \ 机器学习（ML）是`计算机视觉`的核心元素，这是一种从图像和视频中提取有用信息的技术。这种技术的应用可以在平台上看到，这些平台使用计算机视觉识别图像中的物体（或\
  \ Pin），并据此推荐其他相关的 Pin。\n\n`房屋价格预测`是机器学习算法运行的另一个示例。通过利用与大量房屋及其特征（例如：面积、房间数量、物业类型）相关的收集数据，该算法训练机器学习模型来预测其他房屋的售价。多个多个用于搜索房产或公寓（包括租租和购买）的热门在线门户网站都是此类应用的示例。\n\
  \n`产品推荐`是大多数人在没有察觉的情况下都会经历的体验。例如，人们可能会使用网络浏览器在特定网站查看某个产品。很可能在进行其他在线活动（如观看在线视频）时，相同或相似的产品会以广告的形式出现。在这种情况下，各种平台使用`智能代理`来跟踪用户的搜索历史，并据此推荐广告。\n\
  \n`推荐系统`是机器学习算法的另一个应用。此类系统使用`协同过滤`，一种基于收集和分析用户行为信息，并根据与其他用户的相似性来预测他们喜欢什么的方法。图 10.5\
  \ 提供了在电子商务 Web 应用中使用协同过滤的示例。在这种背景下，可以假设一名客户（客户 1）正在查看产品 A，其他客户正在查看产品 A、B、C 和 D。由于所有用户对产品\
  \ A 的兴趣相似，该网页应用程序将向客户 1 推荐产品 B、C 和 D。\n\n![](img/Fig10_05.jpg)\n\n**图 10.5** 产品推荐。（参见\
  \ Keshari, 2021）。)\n\n机器学习最重要的应用之一是`视频摄像头监控`。在利用大量交通监控视频摄像头的地区或国家，由人类人员进行监控可能是不实际且具有挑战性的。在这些情况下，训练计算机完成这项任务的想法就派上了用场。同样，由\
  \ AI/ML 驱动的视频监控使得检测可疑活动成为可能，有时在活动发生之前。这是通过跟踪不寻常的行为（例如，当人长时间站立不动、绊倒或躺在公共场所时）来实现的。系统可以生成警报并发送给人类工作人员，他们随后可以采取适当行动。随着活动被报告和验证，它们将有助于进一步改进监控服务。\n\
  \n在`信息安全`的背景下，应该注意`垃圾邮件过滤`的使用。该术语指的是监控用户电子邮件流量并执行适当预防措施的过程。对于此类系统而言，确保垃圾邮件过滤器持续更新至关重要；这是通过机器学习算法实现的。虽然每天都会检测到数十万个`恶意软件`和`安全威胁`，但人们通常认为相关代码与其前一个版本的相似性达到\
  \ 90% 或以上。基于机器学习的安全程序可以很容易地识别此类编码模式，并检测具有细微编码变化的新恶意软件。同样，机器学习在保护在线货币交易免受网络欺骗方面具有巨大潜力。例如，在线支付平台使用一组工具来帮助比较几乎同时发生的数百万交易，并识别买卖双方之间可疑的欺诈行为。\n\
  \n最后，机器学习模型的另一个常见应用可以在许多电子商务或电子平台的在线客户支持服务中找到。此类平台经常提供在浏览网站时与客户支持代表聊天的选项。虽然交易看起来像是一次普通的对话，但并不是与真实的代表，而是与`聊天机器人`对话。后者从网站中提取信息并以聊天的形式呈现给客户。每当开始新的对话时，答案都会根据之前记录的答案进行改进。\n\
  \n关于机器学习应用的讨论还可以继续，实际用例示例如`天气预测`、`动物/植物/对象的区分`或`客户细分`等。\n\n## 10.11 案例研究\n\n使用数据集\
