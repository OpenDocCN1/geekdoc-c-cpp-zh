  \n### 7.2.6 DESC 语句\n\n在之前的章节中，有需要显示表结构或*元数据*的情况。此类情况下使用的语句如下：\n\n```DESC <table\
  \ name>\n```\n\n该语句返回表属性及其相关信息，例如名称、大小为主键标记。读者可以参考之前提供的脚本作为其功能的示例。\n\n## 7.3 数据操作脚本\n\
  \n之前的章节介绍了用于创建、修改和删除数据库表元数据的各种 DDL 语句。这通常被称为*数据库模式*。如前所述，不期望也不希望此模式频繁更改。一旦确定了模式，就可以开始处理它的*状态*或*实例*。*数据库实例*包含了特定时刻存储在数据库中的所有数据。用于操作数据库实例的语句通常称为数据操作语言（DML）。接下来的章节将介绍这些语句最基础和常见的用法。\n\
  \n### 7.3.1 插入记录\n\n`INSERT` 语句用于向表插入单个*记录（行）*。语句的通用语法如下：\n\n```INSERT INTO <table\
  \ name>\nVALUES (<attribute1 value>... <attributeN\nvalue>)\n```\n\n如果允许用户以不同于相应表元数据指定的顺序向表插入数据，或者选择性地向表属性的子集输入数据，可以使用以下语法：\n\
  \n```INSERT INTO <table name>\n(<attributeX name>... <attributeZ name>)\nVALUES\
  \ (<attributeX value>... <attributeZ\nvalue>)\n```\n\n以下 Python 脚本演示了 `insert` 语句的使用，并采用允许用户首先选择该语句所作用的表的案例：\n\
  \n\n\n\n```python\nimport mysql.connector\n\n# 提供已建立的数据库配置\nGUIDB = 'GuiDB'\nconfig\
  \ = {'user': \"root\", 'password': \"root\",\n    'host': \"localhost\", 'database':\
  \ \"newDB\"}\n\n# 连接到 newDB 数据库\nconnect = mysql.connector.connect(**config)\ncursor\
  \ = connect.cursor()\n\ntry:\n    # 尝试显示 newDB 数据库中的表\n    cursor.execute(\"SHOW\
  \ TABLES\")\n    tables = cursor.fetchall()\n    print(\"DB tables are: \" + str(tables))\n\
  except:\n    print(\"There was a problem showing tables\")\n\ntableName = input(\"\
  Enter the table selected: \")\ntry:\n    # 显示表的元数据\n    cursor.execute(\"DESC \"\
  \ + tableName)\n    columns = cursor.fetchall()\n    print(\"Selected table is:\
  \ \", tableName)\n    print(\"Its attributes are: \")\n    for row in columns:\n\
  \       print(row)\n\n    # 显示表的当前实例\n    cursor.execute(\"SELECT * FROM \" + str(tableName))\n\
  \    records = cursor.fetchall()\n    print(\"The records in the table are: \")\n\
  \    for row in records:\n        print(row)\nexcept:\n    print(\"There was a problem\
  \ showing the table attributes\")\n\n# 准备插入语句\nnumColumns = len(columns)\nattributes\
  \ = [\"\"]*numColumns\nsqlString = \"INSERT INTO \" + tableName + \" VALUES (\"\n\
  \n# 引导用户输入每个属性的值\nfor i in range(numColumns):\n    attributes[i] = input(\"Enter\
  \ data for attribute \" + str(i) + \": \")\n    if (columns[i][1][0] == \"c\"):\n\
  \        sqlString += \"\\\"\" + attributes[i] + \"\\\"\"\n    elif (columns[i][1][0]\
  \ == \"i\"):\n        sqlString += attributes[i]\n    if (i < numColumns-1):\n \
  \       sqlString += \", \"\nsqlString += \")\"\n\n# 执行准备好的插入语句\nprint(\"SQL statement\
  \ to execute is: \")\nprint(sqlString)\ncursor.execute(sqlString)\n# 提交结果以确保永久存储\n\
  connect.commit()\n\n# 显示表的新实例\nprint(\"The records in the \" + str(tableName) +\
  \ \" table are: \")\nsqlString = \"SELECT * FROM \" + tableName\ncursor.execute(sqlString)\n\
  records = cursor.fetchall()\nfor row in records:\n    print(row)\n```\n\n**输出 7.3.1.a:\
