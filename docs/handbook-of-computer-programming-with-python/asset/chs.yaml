  \ `[]` 中并用逗号分隔。\n\n### 8.3.3 数据探索：条件/过滤\n\n预计，Pandas 还提供了一组方法可以通过条件对显示的数据进行过滤。例如，`unique()`\
  \ 方法仅显示指定列中重复出现的值：\n\n```\ndataset[\"<列名>\"].unique()\n```\n\n也可以定义一个特定条件来限制显示的结果，类似于\
  \ `if` 语句。条件可以是简单的（单个），也可以是复杂的。通用语法如下：\n\n```\ndataset[<条件>]\ndataset[[<条件>&|]]\n\
  ```\n\n以下脚本使用 `Grades.xlsx` 文件中的数据来识别项目的唯一成绩，并报告所有百分比高于 80% 以及在 1% 到 59% 之间的最终成绩：\n\
  \n```python\nimport pandas as pd\ndataset = pd.read_excel('Grades.xlsx')\nprint(\"\
  Unique grades for project:\", dataset[\"Project\"].unique())\nprint(\"Final grades\
  \ more than 80%:\\n\",\n      dataset[dataset[\"Final Grade\"] > 80])\nprint(\"\
  Final grades 1% to 60%:\\n\", dataset[(dataset[\"Final Grade\"] > 0)\n      & (dataset[\"\
  Final Grade\"] < 60)])\n```\n\n**输出 8.3.3:**\n\n```\nUnique grades for project:\
  \ [55 90 80 70 87 78 69 71 76 92 75 0]\nFinal grades more than 80%:\n     Final\
  \ Grade  Final Exam  Quiz 1  Quiz 2  Midterm Exam  Project\n13         82.6    \
  \     74.0    94.0    65.0         86.0       92\nFinal grades 1% to 60%:\n    \
  \ Final Grade  Final Exam  Quiz 1  Quiz 2  Midterm Exam  Project\n0          58.57\
  \        50.5    76.0    70.7          60.0       55\n5         61.32        45.5\
  \    94.0    42.7          66.0       70\n10       62.35        48.0    78.0   \
  \ 49.0          70.0       71\n15       62.62        45.5    78.0    56.7      \
  \    70\n```\n\n\n\n\n读者应该注意，如果同时使用了 `loc[]` 参数，可以限制显示的列数，尽管在当前的脚本及其输出中没有显示这一点。同样值得注意的是，在复合条件（如示例中的第二个条件）中，除了使用\
  \ `and` 或 `or` 关键字外，还可以分别使用 `&` 和 `|` 运算符。\n\n### 8.3.4 数据探索：创建新数据\n\n在数据探索过程中，有时需要创建新数据。这可以通过四种不同的形式实现：\n\
  \n*   将两个或多个数据集合并为一个。\n*   根据相同或其他数据集中的可用数据源创建一个包含 `derived`（衍生）数据的新列。\n*   根据相同或其他数据集中的可用数据源创建一个包含\
  \ `calculated`（计算））数据的新列。\n*   创建一个特定文件类型的文件（例如 Excel、CSV）。\n\n`append()` 方法用于合并两个或多个数据集。其基本语法如下：\n\
  \n```\n<name of new dataset> = <name of first\nold dataset>.append(<name of second\
  \ old\ndataset>)\n```\n\n要根据其他列的数据计算值并创建一个新列，可以使用以下命令：\n\n```\n<name of dataset>[\"\
  <name of new column>\"]\n= expression with other columns\n```\n\n如果新创建的列是基于应用于其他列数据的特定条件，则可以使用以下命令：\n\
  \n```\n<name of dataset>[\"<name of new column>\"]\n= np.where(condition, value\
  \ if True,\nvalue if False)\n```\n\n或者\n\n```\n<name of dataset>[\"<name of new\
  \ column>\"] =\nnp.select(<condition set>, <set of values>)\n```\n\n最后，要创建一个新数据集并存储在文件中，可以使用以下命令结构之一。这里提供的示例了\
  \ Excel 和 CSV 文件，但相同的逻辑也适用于其他数据文件格式。\n\n```\nExcel files:\n<name of new Excel file\
  \ object> =\npd.ExcelWriter(\"<name of new Excel file>\")\n<name of dataset>.to_excel(<name\
  \ of new\nExcel file object>, \"sheet name\")\n<name of new Excel file object>.save()\n\
  ```\n\n```\nCSV files:\n<name of dataset>.to_csv(\"<name of new\nCSV file>\")\n\
  ```\n\n以 `Grades.xlsx` 数据集为例，学生成绩存储在课程的特定部分和特定学期中。如果另一个文件中存在同一门课程但不同班的数据集（例如 `Grades2.csv`），则合并这两个数据集并在新创建的数据集中进行必要的处理可能是很有用的。以下脚本读取两个不同的文件（即\
  \ Excel 和 CSV），报告它们的数据，将第二个数据集追加到第一个数据集末尾，定义条件，并创建一个根据其他列数据计算出的值的新列。最后，它将新数据集同时保存为\
  \ Excel 和 CSV 格式：\n\n```\n1   import pandas as pd\n2   import numpy as np\n3\n4\
  \   dataset1 = pd.read_excel(\"Grades.xlsx\")\n5   print(\"The data in Grades file\
  \ are:\"); print(dataset1.head(3))\n6   dataset2 = pd.read_csv('Grades2.csv')\n\
  7   print(\"The data in Grades2 file are:\"); print(dataset2.tail(3))\n8   dataset\
  \ = dataset1.append(dataset2)\n9   print(\"The new merge dataset is:\"); print(dataset.head(3))\n\
  10  print(dataset.tail(3))\n11\n12  # The conditions for the Letter Grades\n13 \
  \ conditions = [(dataset[\"Final Grade\"] > 90.0),\n14      (dataset[\"Final Grade\"\
  ] > 80.0) & (dataset[\"Final Grade\"] <= 89.9),\n15      (dataset[\"Final Grade\"\
  ] > 70.0) & (dataset[\"Final Grade\"] <= 79.9),\n16      (dataset[\"Final Grade\"\
  ] > 60.0) & (dataset[\"Final Grade\"] <= 69.9),\n17      (dataset[\"Final Grade\"\
  ] < 59.9)\n18      ]\n19\n20  # The list of Grade Letters based on the conditions\n\
  21  gradeLetters = [\"A\", \"B\", \"C\", \"D\", \"F\"]\n22  # Create a new Letter\
  \ Grades column in the new dataset using numpy\n23  dataset[\"Letter Grade\"] =\
  \ np.select(conditions, gradeLetters)\n24  dataset[\"Course Work\"] = dataset[\"\
  Quiz 1\"]*0.1+dataset[\"Quiz 2\"]*0.1 + \\\n25      dataset[\"Midterm Exam\"]*0.25\
  \ + dataset[\"Project\"]*0.25\n26  print(\"A partial view of the new dataset:\"\
  )\n27\n28  # Find the number of records in the dataset\n29  rowNum = len(dataset)\n\
  30  # Select the columns to be displayed in the report\n31  cols = [7, 1, 0, 6]\n\
  32  print(dataset.iloc[:rowNum:5, cols])\n33\n34  # Save the new dataset as an Excel\
  \ file\n35  newExcel = pd.ExcelWriter(\"NewGrades.xlsx\")\n36  dataset.to_excel(newExcel,\
  \ \"New Data\")\n37  newExcel.save()\n39\n40  # Save the new dataset as a CSV file\n\
  40  dataset.to_csv(\"newGrades.csv\")\n```\n\n**Output 8.3.4:**\n\n```\nThe data\
  \ in Grades file are:\n   Final Grade  Final Exam  Quiz 1  Quiz 2  Midterm Exam\
  \  Project\n0        58.57        50.5    76.0    70.7            60.0     55\n\
  1        65.90        49.0    89.0    63.0            54.0     90\n2        69.32\
  \        63.0    83.0    73.0            54.7     \n...\nThe data in Grades2 file\
  \ are:\n   Final Grade  Final Exam  Quiz 1  Quiz 2  Midterm Exam  Project\n...\n\
  The new merge dataset is:\n...\n```\n\n\n\n必须注意的是，该方法需要对分组数据应用*聚合*（例如，平均值），该概念将在下一节中介绍。或者，如果目标仅仅是显示按特定列分组的报告，可以使用如下语法的\
  \ `apply()` 方法：\n\n```\n<name of dataset>.groupby([\"<name of column>\" [, \"<name\
  \ of column>\",\n…]]).apply(lambda x: x[<rows>, <cols>])\n```\n\n`apply()` 方法将聚合操作替换为\
  \ `lambda x: x[...]` 表达式，以便指定在报告中应展示的记录和列。\n\n读者还应该注意，如果使用多个列进行分组，数据将*根据第一个选择的列进行初步分组*。从此开始，数据将根据第二个列在每个单独组中进行分组。\n\
  \n为了进行数据排序，使用了 `sort_values()` 方法。其通用语法如下：\n\n```\n<name of dataset>.sort_values([\"\
  <name of\ncolumn>\" [, \"<name of column>\", …]] [,\nascending = False])\n```\n\n\
  与数据分组类似，读者应该注意到，如果指定了多个列，具有相同值的数据将根据第一列进行排序。\n\n最后，可以通过首先应用 `groupby()`并将结果赋值给 lambda\
  \ 表达式，然后对该 lambda 表达式应用 `sort_values()` 方法，从而结合这两者的功能。\n\n以下脚本读取一个 CSV 文件，并根据 *Letter\
  \ Grade* 列对其数据进行分组和报告，仅显示 *Letter Grade* 和 *Final Grade* 列。接下来，它创建了第二个数据集，并根据 *Final\
  \ Grade* 升序对值进行排序。最后，它利用 `apply()` 方法根据 *Letter Grade* 对数据进行分组并根据 *Final Grade*\
  \ 进行排序：\n\n```\n1   import pandas as pd\n2\n3   dataset = pd.read_csv('newGrades.csv')\n\
  4\n5   #报告数据集中的记录数\n6   rows = len(dataset)\n7\n8   # 按 Letter Grade 分组报告\n9   dataset1\
  \ = dataset[[\"Letter Grade\", \"Final Grade\"]]\n10  print(dataset1.groupby([\"\
  Letter Grade\"]).apply(lambda x: x[0:rows]))\n11\n12  # 按 Final Grade 排序报告\n13 \
  \ dataset2 = dataset[[\"Letter Grade\", \"Final Grade\"]]\n14  print(dataset2.sort_values([\"\
  Final Grade\"], ascending = False))\n15\n16  # 先按 Letter Grade 分组，\n17  # 然后按 Final\
  \ Grade 排序（组内排序）\n18  dataset3 = dataset[[\"Letter Grade\", \"Final Grade\"]]\n\
  19  print(dataset3.groupby([\"Letter Grade\"]).\n20         apply(lambda x: x.sort_values([\"\
  Final Grade\"], ascending=False)))\n```\n\n**输出 8.3.5.a–8.3.5.c:**\n\n```\n Letter\
