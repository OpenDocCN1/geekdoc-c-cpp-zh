  9. 打印存储在每个对象属性中的值。\n10. 删除对象 `std1` 和 `std2`。\n\n# 4 使用 Python 进行图形用户界面编程\n\n##\
  \ 4.1 引言\n\n在现代软件开发中，创建一个具有直观`图形用户界面` (`GUI`) 的应用程序是使其具有吸引力的必要条件。与此相关的有四个核心概念以及相关的编程工具：\n\
  \n- **小部件 (Widgets)**：用于创建应用程序的不同组件。这些是通过 Python 库提供的相对简单的预定义对象。在本章中，使用的库和模块包括 `tkinter`\
  \ 和 `PIL`，它们提供了视觉属性。相关的对象可以可以是简单的 `labels`、`texts` 和 `buttons`，可以是复杂的 `frames` 和\
  \ `grids`。\n- **选项 (Options)**：小部件的特征或属性，决定了其外观和行为。值的更改通常与用户与 GUI 之间的交互集成，控制应用程序的视觉外观或格式等方面。\n\
  - **方法 (Methods)**：预定义或新开发的 Python 代码段，旨在通过更改其属性的值来影响小部件。Python 提供的各种包（如 `tkinter`\
  \ 和 `PIL`）提供了丰富的方法。它们可以根据开发者的意图变得简单或复杂。\n- **事件 (Events)**：基于 GUI 的 Windows 风格应用程序的用户与应用程序各种小部件之间的交互通过各种可用的*事件*表示，这些事件触发特定命令或代码块的执行。Python\
  \ 提供了许多此类事件，其中一些适用于多个不同的小部件。例如鼠标的`点击`或双击、键盘的 `enter 键`按下、在小部件上`悬停`或更改文本小部件的内容。\n\
  \n*事件驱动*（或*视觉*）*编程*是一个过程中，一个或多个小部件/对象的属性改变其状态或值。这是通过使用特定的`方法`来实现，并通过用户与小部件/对象之间的交互以及相关的`事件`来触发的。\n\
  \n\n\n本章的重点是通过介绍一些最流行的小组件以及相关的方法、属性/特性/选项，以及创建 GUI 体验最常用的事件，来引入事件驱动（或视觉）编程的概念。\n\
  \n### 4.1.1 Python 的 GUI 模块\n\nPython 提供了一套相当完整的小组件（以类的形式呈现），用于创建用户友好型应用程序的对象；通过这些小组件提供了一套全面且对开发者友好的方法；这些小组件丰富的属性；以及足够数量的定义良好的、可以通过用户交互触发的可编程事件。有两个基础模块定义了这些小组件的组件和功能，即\
  \ `tkinter` 和 `PIL` 模块。\n\n`tkinter` 模块提供了许多类，包括基础的 `Tk` 类以及许多其他与 GUI 相关的类。它包含以下内容：\n\
  \n* `Tk/Tcl`: 一个包含 GUI 应用小组件的工具包。\n* `Tkinter.Tix`: `tkinter` 的扩展，包含了更高级的 GUI 小组件（例如：数值调节框、树形控件）。\n\
  * `tkinter.ttk`: 一组小组件，其中部分属于原始 `tkinter` 模块（例如：组合框、进度条）。\n\n虽然在本章中无法详细描述所有模块中可用的所有小组件、方法、属性和事件，但我们尝试介绍最常用的部分并提供它们的应用示例。本章将从简单的案例到日益复杂的案例，逐步增加复杂性。\n\
  \n### 4.1.2 Python IDE (Anaconda) 和章节范围\n\n与之前章节采用的方法一致，`Jupyter Notebook` (`Anaconda`)\
  \ 是本章所开发代码的首选平台。详细的下载和安装说明在介绍性的第 1 章中提供。\n\n值得注意的是，在用 Python（实际上用任何其他语言）编写程序时，遵循良好的编程实践是有用的。在编写用于完成特定且定义良好的任务的代码行或块之前，以注释的形式使用伪代码是一种良好的习惯，从长远来看是一种有帮助的策略。这允许读者或程序所有者理解底层的算法，使程序更具可读性且用户友好。\n\
  \n编写创建复杂精密的 GUI 应用的“高度智能”Python 程序超出了本章的范围，因为这会让本章的内容难以消化。相反，本章旨在介绍工具及其在创建常见任务和应用程序中的建议用途，而不是尝试为此类任务提供最高效或最优的解决方案。\n\
  \n## 4.2 Tkinter 中的基础小组件\n\n可以认为，在创建 GUI 时，直觉上会想到四个基础小组件。这些是实际的 `frame`帧）、`label`标签）、`button`按钮）和\
  \ `entry`输入框）组件（后者在其他编程语言中通常称为 `textbox`）。在本节中，将介绍并利用这些特定的组件来创建简单的 GUI 应用。\n\n###\
  \ 4.2.1 空帧\n\n基础 `frame` 是 Python GUI 应用为了支持 GUI 界面和功能所需的初始 `parent` 对象。以下 Python\
  \ 代码创建了一个名为“Python Basic Window Frame”的基础空帧：\n\n```\n 1   # 导入必要的库\n2   import tkinter\
  \ as tk\n3\n4   # 使用 tk 类创建帧\n5   winFrame = tk.Tk()\n6   winFrame.title(\"Python\
  \ Basic Window Frame\")\n7\n8   winFrame.mainloop()\n```\n\n**输出 4.2.1.a:**\n\n\
  ![](img/un04_01.jpg)\n\n在这个示例中，有几点值得注意：\n\n* 每个帧都是 `tk` 类的一个对象，由 `Tk()` 构造函数初始化。该对象必须有一个名称。\n\
  * 常见的做法是使用 `title()` 方法为每个帧设置标题。\n* `mainloop()` 方法运行帧并将 `tkinter` 置于等待状态，它在内部监控用户生成的事件，例如键盘和鼠标活动。\n\
  \n默认情况下，基础帧是可调整大小的，其尺寸自动确定。如果需要专门定义并控制它是否可调整大小，可以使用两个方法，即：`resizable()` 和 `geometry()`。如果于于不可调整大小的帧，可以向\
  \ `resizable()` 方法的两个参数传递布尔值 `False`。相应地，传递 `True` 将导致可调整大小的帧。`geometry()` 方法用于通过字符串传递帧的初始尺寸。还可以定义窗口帧的最大和最小尺寸以及其背景颜色。上述方法及其应用在下面的示例中得到了演示：\n\
  \n```\n1   # 导入必要的库\n2   import tkinter as tk\n3\n4   # 使用 tk 对象创建帧\n5   winFrame\
  \ = tk.Tk()\n6\n7   # 为帧提供标题\n8   winFrame.title(\"Python Controlled Frame\")\n\
  9\n10  # 如果方法参数设置为 True 或非零，则帧是可调整大小\n11  # 如果设置为 False，则不可调整大小\n12  winFrame.resizable(True,\
  \ True)\n13\n14  # 帧的初始维度为 500x200\n15  winFrame.geometry('500x200')\n16\n17  #\
  \ 帧可以调整尺寸至最大 1500x600\n18  winFrame.maxsize(1500, 600)\n19\n20  # 帧可以缩小至最小 250x100\n\
  21  winFrame.minsize(250, 100)\n22\n23  # 使用 configure 方法和 bg 选项\n24  # 修改帧的背景颜色\n\
  25  winFrame.configure(bg = 'dark grey')\n26  winFrame.mainloop()\n```\n\n**输出 4.2.1.b:**\n\
  \n![](img/un04_02.jpg)\n\n一旦设置了基础帧，就可以添加所需组件来创建实际的 GUI。\n\n### 4.2.2 Label 组件\n\n\
  `label` 组件是 `tkinter` 模块中的一个基础组件类。它用于在屏幕上显示消息或图像。由于它不接受键盘输入，其值在运行时无法更改，但可以通过代码间接实现。该组件带有多个方法和相关参数，用于更改其外观。下面的脚本是使用某些选项的示例：\n\
  \n```\n1   # 导入 tkinter 库\n2   import tkinter as tk\n3\n4   # 定义父帧\n5   winFrame\
  \ = tk.Tk()\n6   winFrame.title(\"Labels in Python\")\n7   winFrame.resizable(True,\
  \ True)\n8   winFrame.geometry('300x100')\n9\n10  # 根据 tk.Label 类创建标签对象\n11  winLabel\
  \ = tk.Label(winFrame, text = \"Hello Python programmer\")\n12\n13  # 将标签对象与父帧关联\n\
  14  winLabel.pack()\n15\n16  # 运行界面\n17  winFrame.mainloop()\n```\n\n**输出 4.2.2.a:**\n\
  \n![](img/un04_03.jpg)\n\n对这种 label 组件的基础扩展可能涉及使用 `grid()` 方法，以便更高效地控制其在父帧中的布局。\n\
  \n\n\n\n\n```python\n 1   # Import the tkinter library\n2   import tkinter as tk\n\
  3\n4   # Define the parent frame\n5   winFrame = tk.Tk()\n6   winFrame.title(\"\
  Python Label using the Grid\")\n7\n8   # Create a label and place it in the Grid\n\
  9   winLabel = tk.Label(winFrame, text = \\\n10      \"Use the Grid method to \\\
  nplace the label in a static position\")\n11  # Specify the row and column the label\n\
  12  # is to be placed, regardless of the size of the parent frame\n13  winLabel.grid(column\
  \ = 0, row = 0)\n14\n15  winFrame.mainloop()\n```\n\n### 输出 4.2.2.b\n\n![](img/un04_04.jpg)\n\
  \n此案例中有几点值得注意：\n\n- 为了清晰起见，如果语句很长，可以通过插入`反斜杠特殊字符`（\\`）来中断。该字符告诉 Python 语句在下一行继续。\n\
  - 使用 `grid()` 方法而不是 `pack()` 方法可以确保标签控件被放置在相应的网格单元中（在本例中为第一行（`row` = `0`）和第一列（`column`\
  \ = `0`），并且其位置不会根据框架或父组件的大小直接调整。\n\n通过更改标签的`foreground`（前景）和`background`（背景）颜色、`alignment`（对齐方式）以及`expandability`（扩展性），可以进一步增强标签的外观，如下脚本所示。此示例演示了在调整窗口大小前后标签对齐的行为：\n\
  \n```python\n 1   # Import 相关库\n2   import tkinter as tk\n3\n4   # 使用 tk.Tk() 构造创建基础框架并提供标题\n\
  5   winFrame = tk.Tk()\n6   winFrame.title('More options for label widgets')\n7\n\
  8   # 创建第一个标签并将其放在父窗口的中间\n9   winLabel1 = tk.Label(winFrame, fg = 'green', font\
  \ = \"Arial 24\",\n10      text = 'A green label of Arial 24, that does not expand')\n\
  11  winLabel1.pack(expand = 'N')\n12\n13  # 框架缩放时垂直扩展的第二个标签\n14  winLabel2 = tk.Label(winFrame,\
  \ bg = 'red', fg = 'white',\n15      text = 'A label in red background that expands\
  \ only vertically')\n16  winLabel2.pack(expand = 1, fill = tk.Y)\n17\n18  # 框架缩放时水平扩展的第三个标签\n\
  19  winLabel3 = tk.Label(winFrame, bg = 'blue', fg = 'yellow',\n20      text = 'A\
  \ label in blue background that expands only horizontally')\n21  winLabel3.pack(expand\
  \ = 1, fill = tk.X)\n22\n23  # “锚定”的第四个标签（即始终向右/东对齐）\n24  winLabel4 = tk.Label(winFrame,\
  \ anchor = 'e', bg = 'green',\n25      text = 'A right, i.e., east, aligned label')\n\
  26  winLabel4.pack(expand = 1, fill = tk.BOTH)\n27\n28  winFrame.mainloop()\n```\n\
  \n### 输出 4.2.2.c\n\n![](img/un04_05.jpg)\n\n根据此示例可以得出以下关键观察结果：\n\n1. `expand` 选项可用于控制标签控件是否与其父组件同步扩展。如果值为\
  \ 0 或 “N”，则标签将不会扩展。\n2. 如果 `expand` 选项设置为 'Y' 或非零值，则标签控件可以与其父组件同步扩展。还可以指定扩展是水平的、垂直的还是两者都有。在这种情况下，可以使用\
  \ `fill` 选项并配合以下参数：`X` 仅用于水平扩展；`Y` 仅用于垂直扩展；`BOTH` 用于两个方向同时扩展。\n3. `fg` 和 `bg` 选项可以分别用于定义标签控件的前景和背景颜色。\n\
  4. `font` 选项可以用于设置标签控件中文本的字体名称和大小。\n5. `anchor` 选项可以确保当父组件移动时，标签控件不会重新定位。\n\n最终，标签控件可以提供额外的功能，并在外观方面进行进一步增强。事实上，它们可以加载带有或不带相关文本的`image\
  \ objects`，并可以充当`buttons`（在本章稍后的部分介绍）。如果需要使用图像，必须导入 `PIL` 模块，因为它提供了支持此类过程的必要方法。以下\
