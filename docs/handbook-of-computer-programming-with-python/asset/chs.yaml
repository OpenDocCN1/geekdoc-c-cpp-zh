  \ data`时）。数据可视化也是进行`推断统计分析`（第 9 章）和`机器学习`（第 10 章）任务之前的必要步骤，因为它提供了这些领域使用的某些结构和技术的概述。总的来说，数据可视化适用于以下任务：\n\
  \n*   识别数据的结构和模式。\n*   检测错误或异常值。\n*   探索变量之间的关系。\n*   发现新趋势。\n*   建议适当的推断统计分析和机器学习方法。\n\
  *   识别数据修正的需求（例如将数据转换为对数尺度）。\n*   向更广泛的受众传播数据。\n\nPython 是数据科学家流行的数据可视化选择，因为它提供了各种适用于可视化任务的包和库。一些流行的绘图库如下：\n\
  \n*   **Matplotlib:** 如前面的章节所示，`Matplotlib` 是一个低级绘图库，适用于创建基础图表，并为程序员提供了许多与此任务相关的选项。\n\
  *   **Pandas:** `Pandas` 基于 `Matplotlib`，除了绘图外，它提供了额外的分析功能。\n*   **Seaborn:** `Seaborn`\
  \ 是一个高级绘图库，拥有一套实用的默认样式集合。它还允许用极少的代码进行图形绘制，并提供高级视觉效果，使其成为许多数据科学家的首选工具。\n\n上述库和包提供了丰富的可用方法来生成任何类型的视觉化。在本节中，仅使用了\
  \ `Pandas` 和 `Matplotlib`。这主要是为了简单和清晰。\n\n### 8.5.1 连续数据：直方图\n\n`直方图`（histogram）是一种图表，通过使用不同高度的条形显示数据频率来描绘`连续数值型数据的分布`。由于使用了条形，在绘制直方图之前，必须先对数据值的范围进行`分箱`（bin）。`bin`\
  \ 一词用于描述将整个数据值范围划分为`一系列区间`的过程。随后，对落入每个区间的数据进行计数，并将生成的频率以条形的形式绘制出来。分箱通常被指定为`连续且不重叠的区间`，并且通常具有相等或可比的大小，尽管这并不是严格性要求（Freedman\
  \ et al., 1998）。\n\n在研究和演示数据分布的形状（即其中心、离散度和偏度）以及各种模式和异常值的存在时，可以使用直方图。它们通过视觉上确定两个或多个数据分布是否不同来帮助分析，如上面的示例所示（图\
  \ 8.3）。\n\n![](img/Fig08_03.jpg)\n\n图 8.3 直方图的类型。\n\n起，直方图看起来像柱状图，但这两种图表格式显著不同。直方图用于`将连续数据总结并分组到范围内`，而柱状图用于显示`分类数据的频率`。另一个区别是，直方图中数据的比例被表示为图表的统一区域，而在柱状图中则通过单个条形的长度来表示。本文的稍后部分将更详细地讨论柱状图。\n\
  \n在 Python 中绘制直方图，可以使用 `Pandas` 库中的 `plot.hist()`。对于基础绘图，不需要额外的参数。然而，该方法接受额外的参数来可选地控制特定细节，例如分箱大小（默认值为\
  \ 10）。还可以在一个图表中生成多个直方图。`subplots` 参数允许程序员绘制数据集中的每个特征，而 `layout` 参数指定每行每列的图表数量。默认情况下，直方图显示在网格内部，但可以通过将\
  \ `grid` 参数设置为 `False` 来避免这种情况。可以通过分别设置 `xlabels` 或 `ylabel` 参数来控制 x 轴或 y 轴的大小。可以通过指定的度数在\
  \ x 轴或 y 轴上旋转直方图，设置 `xrot` 或 `yrot` 参数。可以使用 `figsize` 参数（以英寸为单位）指定图形的大小。\n\n以下脚本使用\
  \ `newGrades.csv` 数据集在一个图表中显示六个直方图（即两行三列）：\n\n```\nimport pandas as pd\ndataset\
  \ = pd.read_csv('newGrades.csv')\ndataset1 = dataset[[\"Final Grade\", \"Final Exam\"\
  , \"Quiz 1\", \"Quiz 2\",\n         \"Midterm Exam\", \"Project\"]]\n# 准备一个具有 2\
  \ 行子图、可见网格和图例的直方图\n# 2 行 3 列，图形大小为 10x10 英寸，且有 10 个箱\nplt = dataset1.plot.hist(subplots\
  \ = 2, legend = True,\n         layout = (2, 3), figsize = (10, 10), bins = 10)\n\
  ```\n\n**输出 8.5.1：**\n\n![](img/un08_20a) ![](img/un08_20b)\n\n5.2 连续数据：箱线图\n\n\
  `箱线图`（box and whisker plot）也称为`箱图`（box plot），是数据分布情况的图形化表示，基于五位数总结：`最小值`、`最大值`、`中位数`、`第一分位数`（Q1）和`第三分位数`（Q3）。正如名称所示，该图包含两个部分：箱和须。须的两端显示数据集的最小值和最大值，而箱中间的水平线表示中位数。位于须之外的数据点被定义为`异常值`，即`超过箱长度一点半倍的值`。值得注意的是，箱图适用于类别数量有限的数据（图\
  \ 8.4）。\n\n![](img/Fig08_04.jpg)\n\n图 8.4 箱线图。\n\n箱图可用于：\n\n*   处理数值数据。\n*   展示数据的离散程度和中心值。\n\
  *   比较不同类别的数据分布。\n*   识别异常值。\n\n可以使用 `Pandas` 库中的 `boxplot()` 方法创建箱图。x 轴和 y 轴值分别可以通过\
  \ `by` 和 `column` 参数进行修改（Pandas, 2021a）。为了获得更好的视觉效果，也可以使用 `Seaborn` 库中的 `sns.boxplot()`\
  \ 方法。\n\n以下脚本为 `newGrades.csv` 数据集绘制箱图：\n\n```\nimport pandas as pd\ndataset = pd.read_csv('NewGrades.csv')\n\
  \n# x 轴上的列名\ncols = [\"Final Grade\", \"Final Exam\", \"Quiz 1\", \"Quiz 2\",\n\
  \         \"Midterm Exam\", \"Project\"]\n\ndataset1 = dataset[[\"Final Grade\"\
  , \"Final Exam\", \\\n         Quiz 1\", \"Quiz 2\", \"Midterm Exam\", \"Project\"\
  ]]\n\n# 在单个图表中准备所有 6 列的箱线图\n# 大小为 10x10 英寸\ndataset1.boxplot(grid = True, figsize\
  \ = (10, 10), showcaps = True, \\\nshowbox = True, showfliers = True, labels = cols)\n\
  ```\n\n**输出 8.5.2：**\n\n![](img/un08_21.jpg)\n\n### 8.5.3 连续数据：折线图\n\n\n\n\n`折线图`\
  \ 是一种将`趋势`数据表示为连续线条的图表方法。它通过线段连接一系列历史数据点，以连续描绘数据随时间的变化。x 轴对应时间或连续进展，而 y 轴表示相应的数值。\n\
  \n折线图可用于以下场景：\n\n*   处理遵循连续进展（x 轴）的数值数据（y 轴）。\n*   强调数值随时间或连续进展的变化。\n*   不同趋势系列之间进行比较。\n\
  \n要创建折线图，可以调用 `Pandas` 库中的 `plot.line()` 方法。如果单张折线图上绘制了多条线，`Pandas` 会自动创建图例。这在比较数据趋势时是一个非常有用的功能。\n\
  \n以下脚本使用 `newGrades.csv` 数据集绘制折线图，并绘制了数据集中的所有六列：\n\n```\n1   import pandas as pd\n\
  2\n3   dataset = pd.read_csv('newGrades.csv')\n4\n5   # x 轴上的列名\n6   cols = [\"\
  Final Grade\", \"Final Exam\", \"Quiz 1\", \"Quiz 2\",\n7          \"Midterm Exam\"\
  , \"Project\"]\n8\n9   dataset1 = dataset[[\"Final Grade\", \"Final Exam\", \\\n\
  10        \"Quiz 1\", \"Quiz 2\", \"Midterm Exam\", \"Project\"]]\n11\n12  # 准备包含所有\
  \ 6 列的折线图\n13  # 在尺寸为 7x7 英寸的图中\n14  dataset1.plot.line(grid = True, figsize = (7,\
  \ 7),\n15         title = \"Grades Line Chart\")\n```\n\n**输出 8.5.3：**\n\n![](img/un08_22.jpg)\n\
  \n## 8.5.4 分类数据：柱状图\n\n`柱状图`是一种以垂直或水平矩形条显示`分类数据的计数`或`与分类数据相关的数据`的图形。x 轴（垂直柱状图）按类别表示数据，而\
  \ y 轴可以根据使用的数据集取任何值。柱状图适用于描述少于约 30 个类的分类数据，因为接近或超过此粗略阈值的类别往往会导致图表变得难以阅读。在这种情况下，应该考虑更高效的分组或重新分组的方法。\n\
  \n柱状图可用于以下场景：\n\n*   处理分类数据。\n*   调查数据的频率。\n\n要为分类数据绘制柱状图可以使用 `plot.bar()` 方法（`Pandas`\
  \ 库）。读者必须注意，在调用此方法之前，必须使用 `value_count()` 方法统计每个类别的频率。可以使用 `plt.xlabel()`、`plt.ylabel()`\
  \ 和 `plt.title()` 方法为柱状图添加适当的描述。\n\n以下脚本使用 `plot.bar()` 根据 `newGrades2.xlsx`（`New\
  \ Data` 表）中的 `Letter Grade` 列绘制并配置了一个垂直柱状图（默认）：\n\n```\n1   import pandas as pd\n\
  2\n3   dataset = pd.read_excel('newGrades2.xlsx', sheet_name = \"New Data\")\n4\n\
  5   barChart = dataset[\"Letter Grade\"].value_counts().plot.bar(grid =True,\n6\
  \          legend =True, figsize = (7, 7), rot = 0)\n7   barChart.set_title(\"Final\
  \ Letter Grades\")\n8   barChart.set_ylabel(\"Frequencies\")\n9   barChart.set_xlabel(\"\
  Letter Grades\")\n```\n\n**输出 8.5.4.a：**\n\n![](img/un08_23.jpg)\n\n读者应该注意使用 `grid`、`legend`、`figsize`\
  \ 和 `rot` 参数来配置图表的基本外观（分别显示网格和图例、定义以英寸为单位的图形大小以及确保 x 轴标签的正确方向）。还需要注意如何使用 `set_title()`、`set_ylabel()`\
  \ 和 `set_xlabel()` 方法设置图表标题并定义 x、y 轴的标题。\n\n当需要水平条而不是垂直条时，应该使用 `plot.barh()` 方法代替\
  \ `plot.bar()`。以下脚本演示了此选项，其输出说明了参数的细微变化如何有助于适应新的水平方向：\n\n```\n1   import pandas\
  \ as pd\n2\n3   dataset = pd.read_excel('newGrades2.xlsx', sheet_name = \"New Data\"\
  )\n4\n5   barChart = dataset[\"Final Exam Letter\"].value_counts().plot.barh(\n\
  6          grid = True, legend = True, figsize = (7, 7), rot = 0)\n7   barChart.set_title(\"\
  Final Exam Letter Grades\")\n8   barChart.set_ylabel(\"Letter Grades\")\n9   barChart.set_xlabel(\"\
  Frequencies\")\n```\n\n**输出 8.5.4.b：**\n\n![](img/un08_24.jpg)\n\n在同一张图中包含两个或多个不同的柱状图也是可能的。这有三种不同的形式。第一种如如下脚本所示，在一个绘图中包含两个独立的图表。该脚本使用了\
  \ `subplots()` 方法。\n\n```python\n1   import pandas as pd\n2\n3   dataset = pd.read_excel('newGrades2.xlsx',\
  \ sheet_name = \"New Data\")\n4\n5   # 第一个子图\n6   plt.subplot(1, 2, 1)\n7   dataset[\"\
  Final Grade\"].value_counts().plot.bar()\n8\n9   # 第二个子图\n10  plt.subplot(1, 2,\
  \ 2)\n... \n```\n*(注：根据提供的文本块逻辑，子图部分代码已在上方修正)*\n\n脚本使用了 `subplots()` 方法。\n\n\n\n\
  \n![](img/un08_27.jpg)\n\n### 8.5.5 分类数据：饼图\n\n`pie chart`（饼图）是一种圆形图，它通过`pie slices`的大小来展示`proportion`比例。它展示了分类数据部分与整体的关系。与柱状图一样，对于类别数量（即切片数量）很多的数据应避免使用饼图，因为这将影响可读性。理想情况下，五个或更少类别的数据更为理想。如果需要对超过五个类别的数据使用饼图，则应考虑对数据进行重新分类或聚合。当数据部分与整体的关系展示比每个类别的精确大小更重要，且需要视觉上相对于整体比较类别的大小时，可以使用饼图。然而，与柱状图不同，它们无法显式演示`每个类别的绝对数量或值`。要绘制饼图，可以使用\
  \ `Pandas` 库中的 `plot.pie()` 方法 (Pandas, 2021b)，同时可以使用来自 `matplotlib.pyplot` 包的 `plt`\
  \ 对象进一步配置其外观。\n\n以下脚本从 `newGrades2.xlsx` 读取 `New Data` 数据集并根据 `Letter Grade` 列创建饼图。接下来，它演示了如何使用\
  \ `labels`、`autopct`、`shadow` 和 `startangle` 参数来定义和格式标签（百分比）、显示阴影，并规定切片的方向和角度。最后，它使用\
  \ `axis`、`legend` 和 `title` 方法来调整切片的大小，并为图和图例添加标题：\n\n```\n1   import pandas as\
  \ pd\n2   import matplotlib.pyplot as plt\n3\n4   # Read the Excel dataset\n5  \
  \ dataset = pd.read_excel('newGrades2.xlsx', sheet_name = \"New Data\")\n6\n7  \
  \ labels1 = dataset[\"Letter Grade\"].unique()\n8\n9   # Count the frequencies of\
  \ Letter Grade\n10  dataset1 = dataset[\"Letter Grade\"].value_counts()\n11  plt.pie(dataset1,\
  \ labels = labels1, autopct = \"%1.1f%%\", shadow = True,\n12         startangle\
  \ = 90)\n13  plt.axis(\"equal\")\n14  plt.legend(title = \"Final Letter Grades\"\
  )\n15  plt.title(\"Final Letter Grades\")\n```\n\n**输出 8.5.5:**\n\n![](img/un08_28.jpg)\n\
  \n### 8.5.6 配对数据：散点图\n\n`scatter plot`（散点图）是使用`dots`或圆表示`两组数据之间关系`的视觉呈现。点/圆可以报告单个数据点的值，也可以报告数据的整体模式。变量之间的关系可以用以下方式描述：`positive`正或`negative`负、`strong`强或弱、`linear`线性或非线性\
  \ (图 8.5)。\n\n![](img/Fig08_05.jpg)\n\n图 8.5 散点图的类型。\n\n散点图可用于：\n\n*   处理配对数值数据。\n\
  *   识别数据是否具有相关性。\n*   研究数据模式（例如聚类、数据空白、离群值）(图 8.6)。\n\n![](img/Fig08_06.jpg)\n\n\
  图 8.6 研究数据模式。\n\n要创建散点图，可以调用 `Pandas` 库中的 `plot.scatter()` 方法，并使用 `x` 和 `y` 参数定义配对数据。以下脚本使用\
  \ `newGrades2.xlsx` 中的 `Final Exam Grades` 和 `Final Grades` 列绘制了散点图：\n\n```\n1 \
  \  import pandas as pd\n2\n3   # Read the Excel dataset\n4   dataset = pd.read_excel('newGrades2.xlsx',\
  \ sheet_name = \"New Data\")\n5\n6   dataFrame = pd.DataFrame(data = dataset, columns\
  \ = [\"Final Exam\",\n7          \"Final Grade\"])\n8   dataFrame.plot.scatter(x\
  \ = \"Final Exam\", y = \"Final Grade\",\n9          title = \"Scatter chart between\
  \ final exams and final grades \",\n10         figsize = (7, 7))\n```\n\n**输出 8.5.6:**\n\
  \n![](img/un08_29.jpg)\n\n## 8.6 结语\n\n本章涵盖了数据分析中一些基本概念和任务。考虑到为了提供彻底的数据分析结果而可能利用的大可能性和分析组合，本章并非对所有选项进行详尽分析，而是介绍了一些突出了通用方法和视角的主要选项。例如，`heatmaps,\
  \ word clouds, bubble charts, area charts, and `geospatials` 等主题未被包含在内，尽管它们是相当相当流行且常见的数据可视化工具。读者可以在相关出版物或网络资源中丰富的著作中找到关于此类主题的更详细信息。在所使用的细节和抽象水平上……\n\
  \n\n\n\n\n```\n<name of dataset>[start row: end row: step]\n<name of dataset>.loc[start\
  \ row: end row, \"<name of starting column>\": \"<name of ending column>\"]\n<name\
  \ of dataset>.iloc[start row: end row, start column (index): end column (index)\n\
  Example:\nprint(dataset[0:37:5])\nprint(dataset.loc[0:5,\" Final Grade\" : \"Final\
  \ Exam\"])\nprint(dataset.iloc[0:5,0:3])\n```\n\n| 仅报告数据集中指定列的唯一值。 |\n\n```\n<name\
  \ of dataset>[\"<name of column>\".unique()]\nExample:\ndataset[\"Project\"].unique())\n\
  ```\n\n| 根据简单或复合条件报告数据。 |\n\n```\n<name of dataset>[<condition>]\n<name of dataset>\
  \ [<condition>[&/&#124;] <condition>]]\nExamples:\ndataset[\"Final Grade\"] > 80\n\
  dataset[\"Final Grade\"] > 0) & (dataset[\"Final Grade\"] < 60)\n```\n\n| 将两个数据集合并为一个新数据集。\
  \ |\n\n```\n<name of new dataset> = <name of first old dataset>.append(<name of\
  \ second old dataset>)\nExample:\ndataset = dataset1.append(dataset2)\n```\n\n|\
  \ 根据其他列的数据使用表达式创建新列。 |\n\n```\n<name of dataset>[\"<name of new column>\"] = expression\
  \ with other columns\nExample:\ndataset[\"Course Work\"] = dataset [\"Quiz\"]*0.2\
  \ + dataset [\"Midterm Exam\"] *0.25 + dataset[\"Project\"]*0.25\n```\n\n| 根据条件创建新列。\
  \ |\n\n```\n<name of dataset>[\"<name of new column>\"] = np.where(condition, value\
  \ if True, value if False)\nExample:\ndataset[\"Letter Grade\"] = np.where (dataset[\"\
  Final Grade\"] > 89, \"A\")\n```\n\n| 根据一组条件和配对的值创建新列。 |\n\n```\n<name of dataset>[\"\
  <name of new column>\"] = np.select(conditions, paired values)\nExample:\ndataset[\"\
  Letter Grade\"] = np.select (conditions, gradeLetters)\n```\n\n| 根据一个或多个列对数据集进行分组，并应用任何必要的聚合方法（例如\
  \ `sum()`、`mean()`）。 |\n\n```\n<name of dataset>.groupby([\"<name of column>\" [,\
  \ \"<name of column>\",...]]).<aggregate function>\nExample:\ndataset1.groupby([\"\
  Letter Grade\"]).mean()\n```\n\n| 根据一个或多个列对数据集进行分组。使用 `apply()` 来组织数据集中的记录和列。 |\n\
  \n```\n<name of dataset>.groupby([\"<name of column>\" [, \"<name of column>\",...]]).apply(lambda\
  \ x: x[<rows>, <cols>])\nExample:\ndataset1.groupby([\"Letter Grade\"]).apply(lambda\
  \ x: x[0:rows])\n```\n\n| 对数据集中的数据进行排序。 |\n\n```\n<name of dataset>.sort_values([\"\
  <name of column>\" [, \"<name of column>\",...]] [, ascending = False])\nExample:\n\
  dataset3.groupby([\"Letter Grade\"]).apply (lambda x: x.sort_values ([\"Final Grade\"\
  ], ascending=False))\n```\n\n| 描述性统计 |\n\n| 使用 `mean()` 找到数据集的平均值。 |\n\n```\n<name\
  \ of dataset>[\"<name of column>\"].mean()\nExample:\ndataset[\"Final Grade\"].mean()\n\
  ```\n\n| 使用 `median()` 找到数据集中的中位数。 |\n\n```\n<name of dataset>[\"<name of column>\"\
  ].median()\nExample:\ndataset[\"Final Grade\"].median()\n```\n\n| 使用 `mode()` 找到数据集中的出现频率最高的值。\
  \ |\n\n```\n<name of dataset>[\"<name of column>\"].mode()\nExample:\ndataset[\"\
  Final Grade\"].mode(dropna = True).values\n```\n\n| 使用 `.values` 丢弃 `mode()` 报告中值以外的所有输出。\
  \ |\n\n```\n<name of dataset>[\"<name of column>\"].mode().values\nExample:\ndataset[\"\
  Final Grade\"].mode(dropna = True).values\n```\n\n| 使用 `max()` 找到数据集中的最大值。 |\n\n\
  ```\n<name of dataset>[\"<name of columna>\"].max()\nExample:\ndataset[\"Final Grade\"\
  ].max()\n```\n\n| 使用 `min()` 找到数据集中的最小值。 |\n\n```\n<name of dataset>[\"<name of\
  \ columna>\"].min()\nExample:\ndataset[\"Final Grade\"].min()\n```\n\n| 使用 `quantile(x)`\
  \ 找到数据集中的第 x 次分位数。 |\n\n```\n<name of dataset>[\"<name of columna>\"].quantile(0.0–1.0)\n\
  Example:\ndataset[\"Final Grade\"].quantile(0.25)\n```\n\n| 使用 `variance()` (**Statistics*\
  \ 包）计算数据方差。 |\n\n```\nstatistics.variance(<name of dataset>[\"<name of column>\"\
  ].dropna())\nExample:\nstatistics.variance(dataset[\"Final Grade\"].dropna())\n\
  ```\n\n| 使用 `std()` 或 `stdev()` (**Statistics* 包）计算标准差。 |\n\n```\n<name of dataset>[\"\
  <name of column>\"].dropna()\nExample:\nstatistics.stdev(dataset[\"Final Grade\"\
  ].dropna())\n```\n\n| 使用 `skew()` 计算偏度。 |\n\n```\n<name of dataset>[\"<name of column>\"\
  ].skew()\nExample:\ndataset[\"Final Grade\"].skew()\n```\n\n| 使用 `kurtosis()` 计算峰度。\
  \ |\n\n```\n<name of dataset>[\"<name of column>\"].kurtosis()\nExample:\ndataset[\"\
  Final Grade\"].kurtosis()\n```\n\n| 使用 `count()` 计算值的出现频率。 |\n\n```\n<name of dataset>[\"\
  <name of column>\"].count()\nExample:\ndataset[\"Final Grade\"].count()\n```\n\n\
  | 使用 `describe()` 自动报告一组描述性统计数据。 |\n\n```\n<name of dataset>.describe()\nExample:\n\
  dataset.describe()\n```\n\n---\n\n## 8.7 案例研究\n\n*再住院*被认为是医院绩效的质量指标和医疗成本的驱动因素。研究表明，与非患者相比，糖尿病患者更容易发生早期住院（院后\
  \ 30 天内住院）（American Diabetes Association, 2018；McEwen & Herman, 2018）。为了减少早期住院，一种解决方案是为高再住院风险患者提供额外帮助。为此，美国卫生部希望了解如何利用\
  \ 1999 年至 2008 年间美国 130 家医院收集的糖尿病患者临床记录来识别高再住院风险患者。\n\n\n\n\n\n为了尝试协助美国卫生部理解数据，你被要求探索、分析（描述性）并可视化再入院（`readmitted`）数据以及潜在的风险因素，例如住院时间（`time_in_hospital`）和血红蛋白\
  \ A1c 结果（`HA1Cresult`），并使用本章涵盖的技术。\n\n具体而言，你的工作应涵盖以下内容：\n\n1. **数据获取：** 导入相关数据文件（即\
  \ `Diabetes.csv`）。\n2. **数据探索：** 报告数据集中记录/样本的数量以及列/变量的数量。\n3. **描述性统计：** 使用适当的技术来总结或描述我们感兴趣的三个变量：`readmitted`、`time_in_hospital`\
  \ 和 `HA1Cresult`。\n4. **数据可视化：** 使用适当的技术将这三个变量可视化，以及 `readmitted` 与 `time_in_hospital`\
  \ 之间的关系，以及 `readmission` 与 `HA1Cresult` 之间的关系。\n\n## 参考文献\n\n1. 美国糖尿病协会 Diabetes\
