  \ 的分布在早期再入院和其他住院之间没有显著差异。\n\n## 第 9 章 – 使用 Python 进行统计分析\n\n### 描述\n\n*再入院*（Readmission）被认为是医院绩效的质量衡量标准和医疗成本的驱动因素。研究表明，与非糖尿病患者相比，糖尿病患者更容易发生早期再入院（出院后\
  \ 30 天内再入院）（美国糖尿病协会, 2018; McEwen & Herman, 2018）。为了减少早期再入院，解决方案之一是对高再入院风险患者提供额外帮助。为此，美国卫生部希望了解如何利用\
  \ 1999 年至 2008 年美国 130 家医院收集的糖尿病患者临床记录，识别高再入院风险患者。\n\n`Diabetes` 数据库包含有关再入院（`readmitted`）以及潜在相关风险因素的信息，包括人口统计学（`age,\
  \ gender, race`）、主要诊断（`diag`）、入院时糖化血红蛋白测量（`HA1C result`）、入院来源（`admission_source`）、出院处理（`discharge_disposition`）、入院医生的医学专业（`medical_specialty`）以及住院时间（`time_in_hospital`）。本案例的目的是考虑所有可用变量，以帮助美国卫生部识别高再入院的糖尿病患者。需要处理以下任务：\n\
  \n1. 根据第 9.3.1 节 和 9.3.2 节，识别因变量（结果变量）、自变量（预测变量）及其数据类型（连续型或分类型）。有关更多详细信息，读者也可以参考第\
  \ 8 章：数据分析与数据可视化。\n\n2. 根据因变量的数据类型和自变量的数量选择合适的回归方法。（参见第 9.3.3 节 和 9.3.4 节）。\n\n\
  3. 执行所选的回归分析（相关的 Python 代码可以在第 9.5 节中找到）。\n\n4. 使用 `p-values` 识别对再入院风险有显著影响的风险因素（参见第\
  \ 9.2.2 节）。\n\n5. 解释回归结果并向美国卫生部建议（参见第 9.5 节）。\n\n### 解决方案\n\n本研究的目标是利用临床记录识别高再入院风险的患者。因变量（`readmitted`）是一个分类变量，包含两个水平（<30”表示患者在出院后\
  \ 30 天内再入院，“Other”涵盖了 30 天后再入院和未入院的情况）。关于自变量，只有 `time_in_hospital` 是连续变量，而其他变量都是分类变量。\n\
  \n要识别每个变量的数据类型，首先可以使用 `read_csv()` 将数据从 CSV 文件导入数据框，并使用 `shape` 和 `columns` 函数检查记录数。其次，可以使用\
  \ `describe()` 获取所有变量的简要摘要。\n\n```\n1   import pandas as pd\n2   import matplotlib.pyplot\
