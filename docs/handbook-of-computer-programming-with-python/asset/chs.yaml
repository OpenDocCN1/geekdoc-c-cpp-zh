  \ length = 200, from_ = 0, to = 10000)\n    maxCondScale.config(resolution = 10,\
  \ activebackground = 'dark blue', orient = 'horizontal')\n    maxCondScale.config(bg\
  \ = 'light blue', fg = 'red', troughcolor = 'cyan', command = onScaleMax)\n    maxCondScale.grid(column\
  \ = 3, row = 4); maxCondScale.grid_remove()\n\n    # 创建文本参数的 GUI\n    textualLabel\
  \ = tk.Label(selectionsFrame, text = \"输入查找文本:\", bg = \"light grey\")\n    textualLabel.grid(column\
  \ = 0, row = 5); textualLabel.grid_remove()\n    textVar = tk.StringVar()\n    textualEntry\
  \ = ttk.Entry(selectionsFrame, textvariable = textVar, width = 20)\n    textualEntry.grid(column\
  \ = 1, row = 5); textualEntry.grid_remove()\n\n# 根据选择的表更新属性表\ndef updateAttributes():\n\
  \    global cursor, textVar, tables, columns\n    global tablesCombo, columnsCombo,\
