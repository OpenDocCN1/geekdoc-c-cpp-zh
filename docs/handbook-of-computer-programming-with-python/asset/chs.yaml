  \ 0,\n21  jane.getPosition()[2] - 11)\n22\n23  # 创建并定位多个鸽子对象\n24  pigeons_no = 30\n\
  25  pigeons = []\n26\n27  def create_pigeons(no_of_pigeons, pigeon_list):\n28  \
  \    for i in range(no_of_pigeons):\n29          pigeon = viz.add('pigeon.cfg')\n\
  30          pigeon.setPosition([random.uniform(-5, 5), 0,\n31          random.uniform(2,\
  \ 7)])\n32          pigeon_list.append(pigeon)\n33\n34  create_pigeons(pigeons_no,\
  \ pigeons)\n```\n\n## 12.12 使用预制动画\n\n本章目前创建的 3D 对象是完全静止的。虽然详细对象动画的复杂性最好交给 3D 动画师和游戏物理程序员处理，但\
  \ VR 开发者有许多方法可以为 3D 世界注入一些活力。可以说，做到这一点最简单的方法是使用在设计阶段通常附在 3D 对象上的预制动画。在最简单的情况下，VR\
  \ 开发者只需通过调用特定的方法和命令即可访问这些动画。对于像 Jane 这样的形象对象，此类动画可以以对象`states`的形式存在。`Vizard` 平台通过\
  \ `<object>.state()` 方法访问对象的各种状态。给定形象的不同状态由一个预先定义的、唯一的数值索引值定义，该值作为参数传递。例如，在在脚本中添加以下命令：\n\
  \n```python\njane.state(4)\n```\n\n将使 Jane 为你赋予她生命而向用户鼓掌。同样，将 Jane 的状态更改为如下：\n\n\
  ```python\njane.state(1)\n```\n\n将让她闲散地环顾四周，等待进一步的指令。\n\n如提到的，对于像 Jane 和鸽子这样的形象对象，动画可以在设计时被存储为预制对象的属性。VR\
  \ 开发者可以对对象动画进行编程，但这个主题超出了本章的范围。读者可以在详细的 `Vizard` API 参考文档（WorldViz, 2019）中找到关于此主题的更多信息。尽管如此，通过自动化对象的状态可以实现基础的真实感，使其行为表现出看似自然的方式。执行此类任务的一种方法是使用定时器按预定间隔触发特定状态。Vizard\
