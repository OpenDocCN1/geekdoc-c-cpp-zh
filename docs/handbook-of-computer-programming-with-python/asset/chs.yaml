  ```\n\n上述代码如何在线程中运行不同的对象。必须注意的是，线程是同时运行的。在此语境下应避免使用*并行*（in parallel）一词，因为不确定线程是否真的在并行运行。这也受到操作系统、硬件和软件设置以及相关行为的影响。然而，从用户的角度来看，这纯属学术兴趣。第\
  \ 121 到 133 行语句的顺序同样重要。首先，正常创建两个 GUI 框架。如果在创建第一个 GUI 框架后紧接着创建第一个线程对象，然后再创建第二个 GUI\
  \ 框架和线程对象，那么用户只能访问第一个窗口框架。只有在第一个窗口关闭并停止后，第二个窗口框架才会出现。读者应该注意到，在调用线程对象的启动方法（即 `speedControl1`\
  \ 和 `speedControl2`）之前，需要插入 `threading` 模块。\n\n\n\n\n\n必须注意的是，每个线程对象都被分配到一个独立的窗口框架中，并有一个专门的\
  \ `mainloop()` 方法来监控其 GUI 和关联事件（第 125–130 行和 126–133 行）。这种分配发生在第 125–126 行，其中每个线程对象的窗口框架作为参数被调用，并用于底层对象的特定且独立的\
  \ GUI。\n\n该脚本的另一个值得注意的方面是显式定义了 `__init__(self, winFrame): super(SpeedControl, self).__init__()`，它将\
  \ GUI 控件加载到每个线程对象的窗口框架上。这里应该提醒读者，`__init__()` 方法是由 Python 提供的，用于自动初始化基础且必要的组件和属性，为启动对象做准备。`self`\
  \ 参数是必需的，以便 Python 解释器能够区分正在运行的是哪个对象，以及哪些组件和属性属于它。这就是为什么每个组件、属性，甚至是简单的变量前面都跟了 `self`\
  \ 参数的原因。\n\n该特定脚本的另一个关键点是，由于所创建的对象是线程化的，它继承了 `threading` 模块中的 `Thread` 类（第 6 行），并在该类上实现（第\
  \ 10 行）。这两行本质上创建线程对象的代码在每次初始化一个新的线程对象时都会被调用。\n\n最后，读者应该注意，此版本的代码缺少了控制变量（例如 `IntVar()`）。这是刻意为之，因为包含它们可能会导致线程对象之间以及单个线程对象内部的跨方法操作之间产生不必要的冲突，而对应用程序没有任何特殊益处。通常，建议避免在控件上使用控制变量，特别是在实现面向对象和/或线程对象应用时。\n\
  \n### 5.4.3 在多线程系统中结合多个概念和应用\n\n本书的第 2 至第 5 章提供了从基础编程技能到更高级应用开发概念的渐进式学习。尽管在 Python\
  \ 编程方面无疑有许多更多概念和深度有待探索，但第 2 章–第 5 章应为志向程序员提供坚实的基础，因为它们涵盖了构建功能性且结构良好的应用程序所需的必要构建块。作为书中这一概念小节的总结，有必要对目前介绍的概念、机制和实践如何集成连贯、集中的解决方案提供概述。最终，这应该提供关于如何构建多线程多功能信息系统的思路，类似于在现实生活中可能面临的场景和挑战。下面提出的示例将之前开发的两个应用（`Speed\
  \ Control` 和 `Bubble Sort`）合并到一个多线程系统中，该系统可以作为一个单一的统一平台进行启动和运行。为了实现这一点，需要两处更改：\n\
  \n1. 必须根据面向对象的范式对两个应用程序（`Speed Control` 和 `Bubble Sort`）进行调整。这是通过分离并提取负责 GUI 创建及所有相关方法的主代码，并将剩余代码保存为\
