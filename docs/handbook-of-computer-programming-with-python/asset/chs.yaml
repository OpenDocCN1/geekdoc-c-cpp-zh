  \ score`，并提供 `classification report`（分类报告）。对于输出的还原，标签编码器的用法与模型中整数编码数组相同。接下来，打印混淆矩阵，然后是准确率（50%）。读者应该注意，在理想情况下，后者的值会接近\
  \ 100%。最后，显示包含所有相关细节的分类报告。这些任务在第 164–174 行中编码。输出显示了第 5 步的结果。\n\n从一个训练数据集，CART 算法可以构建多个决策树。性能标准决定了哪种树更适合当前任务。使用了不同的指标或性能测量参数，最常见的是准确率（accuracy）、混淆矩阵（confusion\
  \ matrix）、精确率（precision）、召回率（recall）和 F 分（f-score）。准确率代表树的整体准确性。它是通过正确分类的观测值除以总观测值计算得，并以百分比表示。例如，如果测试了\
  \ 100 个观测值并正确分类了 70 个，则该树的准确率将为 70.00。较高的准确率表明决策树的性能更好。\n\n\n\n\n混淆矩阵根据测试集或训练数据集代表了树的整体行为。它在树对每个类别标签的性能方面提供了更深入的洞察。因此，混淆矩阵的大小取决于类别标签，因为它始终是\
  \ `n × n`，其中 `n` 表示类别标签的数量。例如，如果数据集中有三个类别标签，混淆矩阵将是 `3 × 3`。在银行数据集中，混淆矩阵将是 `2 × 2`，因为它只有两个类别标签（`Yes`/`No`）。矩阵还提供了被树错误分类的标签数量的细分。此类信息是准确率无法提供的。\n\
  \n`Precision`（精确率）是每个标签的`基于相关性的准确率`（即正确预测的观测数与总观测数之比）的衡量。例如，假设一棵树将 100 个客户中的 60\
  \ 个分类为 `Yes`。然而，在这些 60 次分类中，只有 40 次是正确的。因此，精确率将是 `40/60` 或 `0.667`。\n\n`Recall`（召回率）是关于类别标签整体分类性能的相关性衡量。例如，假设一棵树在\
  \ 100 个观测的数据集中预测了 60 次 `Yes` 响应。如果这些预测中有 40 次是正确的，而数据集中 75 次观测到的 `Yes` 响应，则召回率将\
  \ `40/75` 或 `0.533`。\n\n`Fscore` 将召回率和精确率值合并为一个单一值。该值代表了每个标签在`相关性方面的性能`。高 `fscore`\
  \ 值表示分类器的性能更好，且比低值的分类器经过了精调。\n\n```\n161 #===================================================================\n\
