  \ `sequence`（序列）。例如，以下代码块：\n\n```\nfor i in [0, 1, 2, 3, 4]:\n    pigeon = viz.add('pigeon.cfg')\n\
  \    pigeon.setPosition([i, 0, 0])\n```\n\n其结果与之前利用 `range` 的语句完全相同。使用 `range` 关键字在很多情况下确实非常方便，但它对于其他常见的\
