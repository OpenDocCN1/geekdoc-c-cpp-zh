  \ 第 8 章 – 数据分析与数据可视化\n\n### 描述\n\n*再入院*（Readmission）被认为是医院绩效的质量衡量，也是医疗成本的驱动因素。研究表明，与非糖尿病患者相比，糖尿病患者更有发生早期再入院（出院后\
  \ 30 天内再次入院）的风险（美国糖尿病协会, 2018; McEwen & Herman, 2018）。为了减少早期再入院，解决方案之一是为高再入院风险患者提供额外帮助。为此，美国卫生部希望了解如何利用\
  \ 1999 年至 2008 年间美国 130 家医院收集的糖尿病患者临床记录，识别出高再入院风险的患者。\n\n为了协助美国卫生部理解这些数据，你将被使用本章涵盖的技术来探索、分析（描述性）并可视化再入院（`readmitted`）数据以及潜在风险因素，如住院时间（`time_in_hospital`）和糖化血红蛋白检测结果（`HA1Cresult`）。\n\
  \n具体而言，你的工作应涵盖以下内容：\n\n1.  数据获取：导入相关数据文件（即 `Diabetes.csv`）。\n2.  数据探索：报告数据集中记录/样本的数量以及列/变量的数量。\n\
  3.  描述性统计：使用适当的技术来总结或描述我们感兴趣的三个变量：`readmitted`、`time_in_hospital` 和 `HA1Cresult`。\n\
  4.  数据可视化：使用适当的技术将这三个变量可视化，以及 `readmitted` 与 `time_in_hospital` 之间、`readmission`\
  \ 与 `HA1Cresult` 之间的关系。\n\n### 解决方案\n\n1.  使用 `read_csv` 函数从 CSV 文件将数据导入（读取）数据框中。要查看数据集的前几行，使用\
