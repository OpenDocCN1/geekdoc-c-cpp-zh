  在第 4 步中，定义的训练和测试输入输出被用于训练和测试模型（即预测可能的输出）。这是通过 `DecisionTreeClassifier()` 函数（`Sklearn.tree`\
  \ 库）实现的，该函数创建了用于输出预测的 `decisionTree` 对象模型（第 144–146 行）。读者应该注意，分类器使用的数学算法是 `entropy`、`random_state=100`、`maximum_depth=100`\
  \ 以及 `min_samples_leaf=2`。\n\n在 `entropy` 机制方面，使用的数学公式是：`E = −Σ[(i:n)]p[i]log[2]p[i]`。其核心思想是计算训练集中列中遇到的混合值的熵。如果值混合严重且数量不均，则熵将接近\
  \ 1，否则将接近 0。理想情况下，首选值是 0，这意味着数据集具有高度的同质性值。在可视化决策树时，熵值暗示了相关树或子树中值的 `impurity`（不纯度）。熵的替代方案是\
  \ `Gini index` 机制，分类器也用它来组织决策树。其数学等式为：`Gini Index = 1−Σ(P(x=k))²`。这同样表明了数据集不同划分之间不纯度的不确定性概率。在本例中，两种机制都包含在内，应用了\
  \ `entropy` 并将 `gini index` 作为注释禁用。切换这两者的激活状态将证明结果是相当相似的。关于 `entropy` 或 `gini index`\
  \ 的更多详细信息，建议读者学习专注于机器学习的教材。在 `DecisionTreeClassifier()` 中还有两个影响树可视化的参数：`max_depth`\
  \ 和 `min_samples_leaf`。前者决定树的最大深度，如果省略，树将根据需要无限生长。后者决定作为叶子节点所需的最小样本数。增加 `min_samples_leaf`\
