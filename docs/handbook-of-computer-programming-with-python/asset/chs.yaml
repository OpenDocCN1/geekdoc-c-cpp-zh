  \ descent (SGD)`（随机梯度下降）是一类算法，旨在优化权重，以实现输入到输出的最优映射。所选算法由 `optimizer` 参数/方法定义，目前最常用的是\
  \ `adam`。\n\n`loss` 参数/方法用于处理神经网络（NN）预测完整性的衡量。简单来说，它衡量了 `predicted`（预测）值与 `desired`（期望）值之间的\
  \ `disparity`（差异）。有多种 `loss` 方法可选，包括均方误差 `(MSE)`、均方根 `(RMS)` 以及平均绝对误差 `(MAE)`。\n\
  \n`MSE` 是计算 `real observations`（真实观测值）与 `predictions`（预测值）之间差异平均值最著名的方法之一。该方法的数学方程如下：\n\
  \n$\\text{MSE} = \\operatorname{}\\sum\\limits_{k = 1}^{K}\\frac{\\left( {x_{i}\
  \ - {x'}_{i}} \\right)^{2}}{K}$\n\n`RMS` 是最流行且可能最准确的方法之一。它计算 `MSE` 的平方根。其数学方程如下：\n\
  \n$\\text{RMSE} = \\sqrt{\\sum\\limits_{k = 1}^{K}\\frac{\\left( {x_{i} - {x'}_{i}}\
  \ \\right)^{2}}{K}}$\n\n最后，`MAE` 计算为真实观测值与预测值之间绝对误差的平均值，公式如下（即 `x[k]`  = 真实值，`x*[k]`\
  \  = 预测值）：\n\n$\\text{MAE} = \\frac{1}{K}\\operatorname{}\\sum\\limits_{k = 1}^{K}\\\
  left| {x_{k} - \\operatorname{}{x'}_{k}} \\right|$\n\n以下脚本展示了上述三种损失衡量方法的使用：\n\n\
  ```\n1  import numpy as np\n2\n3  # 将实际值和预测值定义为 np 数组\n4  actual = np.array([1.8,\
  \ 2, 1.9])\n5  print(\"The actual observations are: \\n\", actual)\n6  predicted\
  \ = np.array([2, 1.7, 1.7])\n7  print(\"\\nThe predicted observations are: \\n\"\
  , predicted)\n8  # 根据两组值之间的差异计算数组\n9  difference = predicted - actual\n10 print(\"\
  \\nThe differences in the observations are: \\n\", difference)\n11\n12 # 根据差异的平方计算数组\n\
  13 squareOfDifferences = difference ** 2\n14 print(\"\\nThe squares of the differences\
  \ of the observations: \\n\",\n15       squareOfDifferences)\n16\n17 # 计算观测值的均方误差\n\
  18 MSE = squareOfDifferences.mean()\n19 print(\"\\nThe Mean Square Error is calculated\
  \ as: \", MSE)\n20\n21 # 计算观测值的均方根\n22 RMSE = np.sqrt(MSE)\n23 print(\"\\nThe root\
  \ error is: \", RMSE)\n24\n25 # 计算观测值的平均绝对误差\n26 absoluteDifferences = np.absolute(difference)\n\
  27 meanAbsoluteDifference = absoluteDifferences.mean()\n28 print(\"\\nThe mean absolute\
  \ error of the observations is: \\\n29       meanAbsoluteDifference)\n```\n\n**输出\
  \ 11.3.5：**\n\n```\nThe actual observations are:\n [1.8 2\\. 1.9]\n\nThe predicted\
  \ observations are:\n [2\\. 1.7 1.7]\n\nThe differences in the observations are:\n\
  \ [ 0.2 -0.3 -0.2]\n\nThe squares of the differences of the observations:\n [0.04\
  \ 0.09 0.04]\n\nThe Mean Square Error is calculated as: 0.056666666666666664\n\n\
  The root error is: 0.23804761428476165\n\nThe mean absolute error of the observations\
  \ is:\n0.2333333333333333\n```\n\n### 11.3.6 拟合与评估模型，绘制损失\n\n下一步涉及各种模型的 *fitting*（拟合）以及相关观测值的\
