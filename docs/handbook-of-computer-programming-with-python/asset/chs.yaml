  \ list after extending it with items from a second list is: ['BMW',\n'Suzuki', 'Toyota',\
  \ 'Honda', 'Mercedes', 'Nissan', 'Renault', 'Audi']\n['BMW', 'Suzuki', 'Honda',\
  \ 'Mercedes', 'Nissan', 'Renault', 'Audi']\n['BMW', 'Suzuki', 'Honda', 'Mercedes',\
  \ 'Nissan', 'Renault']\n```\n\n以下相同脚本的变体展示了 `reverse()`、`sort(reverse=True)` 和 `index()`\
  \ 的，用于反转项（第 9 行）、升序排序（第 13 行）、降序排序（第 17 行）以及查找特定项的索引（第 21 行）。注意，这些函数都没有对原始列表产生持久性影响：\n\
  \n```python\n# 创建列表\ncars = [\"BMW\", \"Toyota\", \"Honda\", \"Mercedes\"]\n# 打印列表的大小及其项\n\
  print(\"The list of the cars has \", len(cars),\n     \" items which are the following:\
  \ \", cars)\n# 按反序顺序打印项\ncars.reverse()\nprint(cars)\n# 对项排序\ncars.sort()\nprint(cars)\n\
  # 按反序对项排序\ncars.sort(reverse=True)\nprint(cars)\n# 查找并返回列表中某个特定项的索引\nprint(cars.index(\"\
