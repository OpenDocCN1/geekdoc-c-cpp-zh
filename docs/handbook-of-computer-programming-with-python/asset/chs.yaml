  \ 模块是 *tkinter* 库的一部分。同样值得注意的是，代码中使用 `delete()` 方法最初清空列表框的内容，随后重新填充更新后的列表。该特定方法接收要删除元素范围的第一个和最后一个索引作为参数。同样，第三项任务是完全清空列表框的内容。为了这个目的，通过另一个简单的对话框交互进行确认。\n\
  \n在上述所有案例中，`populate()` 方法（第 200–209 行）负责读取列表并使用它们的内容填充列表框。\n\n## 4.4 自动化与用户输入控制\n\
  \n视觉编程的一个共同特征是创建一种幻觉，即应用程序对象/部件会自动或根据用户输入改变形状、内容或状态。如果一个对象/部件要*自动*激活并运行，程序员需要将其与相应的*时间控制事件*关联。后者允许程序员通过激活和执行基于时间控制事件适当的代码块，在运行时更改对象/部件的属性。\n\
  \n在本节中，读者将有机会接触创建无需用户输入或交互类型不同于直接文本输入或按钮点击事件的应用程序。在整个章节中，一个基础的*红绿灯*应用程序将逐步开发为一种原始但具有启发性的*自动化*用户体验。\n\
  \n### 4.4.1 红绿灯版本 1 – 基础功能\n\n红绿灯示例项目可以从创建一个非常简单的应用程序开始，该程序使用三个图像（加载在标签中）分别显示绿色、黄色和红色灯。这三个图像可以编程为根据用户的选择显示或消失。以下\
  \ Python 脚本创建了此界面并实现了相关的交互：\n```\n\n\n\n\n\n```python\n# Import libraries\nimport\
  \ tkinter as tk\nfrom tkinter import *\n# Import the necessary image processing\
  \ classes\nfrom PIL import Image, ImageTk\n\nglobal radioButton\nglobal image1,\
  \ image2, image3\nglobal photo1, photo2, photo3\nglobal winLabel1, winLabel2, winLabel3\n\
  global winFrame\n\n# Create the main frame\nwinFrame = tk.Tk()\nwinFrame.title(\"\
  Traffic Lights v1\")\n\n# Create the interface with the images and labels\ndef photos():\n\
  \    global radioButton\n    global image1, image2, image3\n    global photo1, photo2,\
  \ photo3\n\n    image1 = Image.open(\"TrafficLightsGreen.gif\")\n    image1 = image1.resize((50,\
  \ 100), Image.ANTIALIAS)\n    photo1 = ImageTk.PhotoImage(image1)\n\n    winLabel1=tk.Label(winFrame,text='',\
  \ image=photo1, compound='left')\n    winLabel1.grid(row = 0, column = 0)\n\n  \
  \  image2 = Image.open(\"TrafficLightsYellow.gif\")\n    image2 = image2.resize((50,\
  \ 100), Image.ANTIALIAS)\n    photo2 = ImageTk.PhotoImage(image2)\n\n    winLabel2\
  \ = tk.Label(winFrame,text='',image=photo2,compound='left')\n    winLabel2.grid(row\
  \ = 0, column = 1)\n\n    image3 = Image.open(\"TrafficLightsRed.gif\")\n    image3\
  \ = image3.resize((50, 100), Image.ANTIALIAS)\n    photo3 = ImageTk.PhotoImage(image3)\n\
  \n    winLabel3 = tk.Label(winFrame,text='',image=photo3,compound='left')\n    winLabel3.grid(row\
  \ = 0, column = 2)\n\n    # Control active traffic lights based on the radio button\
  \ selection\n    if (radioButton.get() == 1):\n        winLabel2.destroy()\n   \
  \     winLabel3.destroy()\n\n    if (radioButton.get() == 2):\n        winLabel1.destroy()\n\
  \        winLabel3.destroy()\n\n    if (radioButton.get() == 3):\n        winLabel1.destroy()\n\
  \        winLabel2.destroy()\n\n# Create the radio button interface\ndef drawRadioButtons():\n\
  \    global radioButton\n\n    visibleGreenRadioButton = tk.Radiobutton (winFrame,\
  \ text = 'Green',\n        width=17, height=1, bg = 'light grey', variable = radioButton,\n\
  \        value = 1, command = photos).grid(row = 1, column = 0)\n\n    visibleYellowRadioButton\
  \ = tk.Radiobutton(winFrame, text='Yellow',\n        width= 17, height= 1, bg= 'light\
  \ grey', variable = radioButton,\n        value = 2, command = photos).grid(row\
  \ = 1, column = 1)\n\n    visibleRedRadioButton = tk.Radiobutton (winFrame, text\
  \ = 'Red',\n        width= 17, height = 1, bg= 'light grey', variable = radioButton,\n\
  \        value = 3, command = photos).grid(row = 1, column = 2)\n\nradioButton =\
  \ IntVar()\nphotos()\ndrawRadioButtons()\n\nwinFrame.mainloop()\n```\n\n**输出 4.4.1：**\n\
  \n![](img/un04_13.jpg)\n\n输出展示了程序的两个主要部分。在第一部分，`photos()` 方法加载了三张图片并控制它们在界面中的可见性（第\
  \ 17–55 行）。读者会注意到该方法的一部分是销毁其中两张图片，以便在屏幕上只保留一张（第 44–56 行）。对于此任务，读者可能还会考虑使用 `grid_remove()`\
  \ 方法（在之前的章节中介绍过），这将产生相同的结果。\n\n第二部分控制显示三张图片中的哪一张。一旦点击了所需的单选按钮，相应的图片将保持显示状态，而另外两张将被隐藏（第\
  \ 57–71 行）。值得注意的是，三个单选按钮都关联到同一个变量。这体现在当它们被选中时会相互抵消，因为该公共关联对象的值被更改了。\n\n### 4.4.2\
  \ 交通灯版本 2 – 创建基础幻象\n\n更进一步，程序进行了更改，使得只出现一张图片而不是三张。这种只有一张图片的印象显然是幻觉，因为从本质上说它是通过操纵关联组件的视觉属性和/或其在界面中的位置引起的。在这种情况下，交通灯图像使用相同的网格坐标堆叠在一起，随后，其中两个图像从界面中被移除。\n\
  \n此版本与原始版本几乎相同，区别在于组件的位置和略有修改的标题。建议的修改仅需要将第 15、35、42、62–67 行和 70–71 行替换替换为以下内容：\n\
  \n```\n15     winFrame.title (\"Traffic Lights v2\"); winFrame.geometry(\"200x180\"\
  )\n[...]\n35     winLabel2.grid(row = 0, column = 0)\n[...]\n42     winLabel3.grid(row\
  \ = 0, column = 0)\n[...]\n62     width = 20, height = 1, bg = 'light grey', variable\
  \ = radioButton,\n[...]\n66     width = 20, height = 1, bg= 'light grey', variable\
  \ = radioButton,\n67         value = 2, command = photos).grid(row = 2, column =\
  \ 0)\n[...]\n70     width = 20, height = 1, bg= 'light grey', variable = radioButton,\n\
  71         value = 3, command = photos).grid(row = 3, column = 0)\n```\n\n**输出 4.4.2**\n\
  \n![](img/un04_14.jpg)\n\n### 4.4.3 交通灯版本 3 – 创建原始自动化\n\n在这个版本的示例程序中，用户无需点击相应的单选按钮即可导致交通灯图像的出现/消失。变化会在其中一张图片开启\
