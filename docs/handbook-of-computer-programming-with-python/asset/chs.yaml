  \n```\n<name of new Frame> = <name of Data Frame>.dropna(how=\"any\")\n```\n\n以下\
  \ Python 脚本提供了该方法应用于相同数据集的示例：\n\n```python\nimport pandas as pd\ndataset = pd.read_excel('Grades.xlsx',\
