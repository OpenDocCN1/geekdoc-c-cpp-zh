  \ 使用 GUI 使用 SELECT 语句\n\n可以说，如果目标是开发一个面向用户的应用程序，那么有必要为应用程序封装一个友好的图形用户界面（GUI）。最重要的\
  \ GUI 小部件（例如标签、输入框、单选按钮、按钮）及其应用在本书之前的章节中已有详细介绍。在当前语文中，我们假设重点是创建一个基于网格的布局用于托管 SQL\
  \ 查询结果。在这种情况下，可以使用 `grid 布局管理器`。以下 Python 脚本展示了使用完全部署的 GUI 开发并执行基于条件的 MySQL `SELECT`\
  \ 查询。\n\n\n\n\n\n```python\nimport mysql.connector\nimport tkinter as tk\nfrom tkinter\
  \ import ttk\n\nglobal tableName, attributeName, radioButton, textVar\nglobal minLabel,\
