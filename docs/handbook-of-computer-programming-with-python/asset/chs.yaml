  ```\n\n建议在 `jane_state` 函数开头添加以下行，以停止之前的操作：\n\n```python\njane.clearActions()\n\
  ```\n\n*   2. 添加以下内容：\n\n```python\ndef jane_walk():\n    jane.clearActions()\n\
  \    walk_random = vizact.walkTo([random.uniform(-5, 5), 0,\n                  \
  \             random.uniform(5)])\n```\n\n以及一个触发它的定时器：\n\n```python\nrandom_walk_timer\
  \ = vizact.ontimer(5.0, jane_walk)\n```\n\n*   3. 使用以下内容替换 `jane_feed_pigeons` 中的\
  \ `for` 循环：\n\n```python\nfor i in range(no_of_pigeons):\n    x1 = jane.getPosition()[0]\
  \ - 2\n    x2 = jane.getPosition()[0] + 2\n    y1 = jane.getPosition()[2] - 2\n\
  \    y2 = jane.getPosition()[2] + 2\n    walk = vizact.walkTo([random.uniform(x1,\
  \ x2), 0,\n                          random.uniform(y1, y2)])\n    pigeons[i].addAction(walk)\n\
  ```\n\n这个 `for` 循环在喂食开始时在 Jane 所在的位置创建一个 4 单位的矩形区域。接下来，使用 `random.uniform()` 在区域内随机化鸽子的移动。4.\
  \ 在 `walkTo()` 方法结尾添加数字 0.4–0.5。此参数决定了每秒移动的速度：\n\n```python\nwalk = vizact.walkTo([random.uniform(x1,\
  \ x2), 0, random.uniform(y1, y2)], 0.5)\n```\n\n*   5. 在 `jane_state` 结尾添加以下行。确保该命令在\
  \ `for` 循环之外：\n\n```python\npigeon_state_timer.setEnabled(1)\n```\n\n*   6. 获取合适的环境背景音频文件（*.wav*），将其重命名为\
  \ *Ambience.wav* 并移动到当前脚本所在的文件夹。在脚本开头添加以下行，但在 3D 世界实例化之后。例如，代码可以在广场模型创建并开启视角碰撞后添加：\n\
  \n```python\nambience = viz.addAudio('Ambience.wav')\nambience.loop()\nambience.play()\n\
  ```\n\n*   7. 获取哨声音频文件（*.wav*）。如所述，文件需要是 `MONO`。将其重命名为 *Whistle.wav* 并移动到当前脚本所在的文件夹。在\
  \ `jane_feed_pigeons` 函数中，在 `for` 循环之前、`jane.state(15)` 命令之后添加以下行：\n\n```python\n\
  jane.playsound('Whistle.wav', viz.PLAY)\n```\n\n这是处理音频的另一种方法，用于 3D 声音（即可以放置在 3D\
  \ 世界特定点或附加到 3D 对象的声音）。该命令直接加载并附加到 Jane。可以传递标记来控制声音行为。\n\n*   8. 获取合适的鸽子鸣叫音频文件（*.wav*）。将文件重命名为\
  \ *Chirp_1.wav*、*Chirp_2.wav*、*Chirp_3.wav* 并将其移动到当前脚本所在的文件夹。创建以下函数：\n\n```python\n\
  def pigeon_chirp(pigeon):\n    sound = random.choice(['Chirp_1.wav', 'Chirp_2.wav',\
  \ 'Chirp_3.wav'])\n    pigeon.playsound(sound, viz.PLAY)\n    vizact.ontimer(random.randint(5,\
  \ 15), pigeon_chirp, pigeon)\n```\n\n\n\n\n\n```python\ndef random_pigeon_sound(rand_pigeon):\n\
  \   rand_pigeon.playsound('Chirp_1.wav', viz.PLAY)\n```\n\n和往常一样，该函数可以通过随机选择鸽子的定时器来触发：\n\
  \n```python\nrandom_pigeon_sound_timer = vizact.ontimer(5, random_pigeon_sound,\n\
  vizact.choice(pigeons))\n```\n\n* 9. 寻找另外两个*鸽子叫声*音频文件 (`*.wav`)）。将文件分别重命名为 `Chirp_2.wav`\
  \ 和 `Chirp_3.wav`，并将它们移动到当前脚本所在的文件夹中。将 `random_pigeon_sound` 函数修改为：\n\n```python\n\
  def random_pigeon_sound(rand_pigeon):\n   random_switch = random.choice([1, 2, 3])\n\
  \   if random_switch == 1:\n      rand_pigeon.playsound('Chirp_1.wav', viz.PLAY)\n\
  \   elif random_switch == 2:\n      rand_pigeon.playsound('Chirp_2.wav', viz.PLAY)\n\
  \   else:\n      rand_pigeon.playsound('Chirp_3.wav', viz.PLAY)\n\nrandom_pigeon_sound_timer\
  \ = vizact.ontimer(5,\nrandom_pigeon_sound, vizact.choic\n```\n\n* 10. 这可以通过多种方式实现，取决于想要深入的程度。一种提供伪随机触发的简单解决方案是使用多个不同的定时器，它们在随机选择的间隔内触发随机鸽子的叫声：\n\
  \n```python\nvizact.ontimer(random.randint(7, 11), random_pigeon_sound, vizact.\n\
  choice(pigeons))\nvizact.ontimer(random.randint(15, 20), random_pigeon_sound, vizact.\n\
  choice(pigeons))\nvizact.ontimer(random.randint(25, 30), random_pigeon_sound, vizact.\n\
  choice(pigeons))\n```\n\n这种选择使得每次运行应用程序时，定时器之间都会产生不同的随机触发模式。然而，它的缺点是在应用程序运行期间会重复相同的模式。增加更多的定时器会增加模式的复杂性，从而提高真实性，但同时也会增加计算能力的需求。如果读者对更详细地控制定时过程和流程感兴趣，一个很好的入门区域是查看\
