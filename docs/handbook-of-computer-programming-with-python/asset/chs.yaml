  \ Python `for` 循环的方法。与其使用预定义的范围，不如将条件参数结构化为 `list`，就像之前用于定位和朝向目的的列表一样。与之前的列表示例一样，`for`\
  \ 循环使用索引来访问列表中的各种值。在这种情况下，这并非基于选择，而是基于 `sequence`。\n\n（注：原文中存在大量段落重复，译文已根据逻辑去重并保留核心技术说明。）\n\
  \n\n\n将创建两个新鸽子，它们在 x 轴上间隔两个单位（`−1` 和 `1`），并位于 z 轴的中心点（`0`），），然后将它们添加到 `pigeons`\
  \ 列表中。然而，这一次，在实例化后的任何一点，都可以使用 `pigeons` 列表上的`corresponding index value` 显式地访问每只鸽子。例如，在上一个示例中添加以下命令：\n\
  \n```python\npigeons[0].setPosition([0, 0, 5])\n```\n\n将把两个新创建的鸽子中的第一个在 z 轴上更靠近\
