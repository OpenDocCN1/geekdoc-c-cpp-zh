  \ 7.2.1 在 MySQL 中创建新数据库\n\n数据库可以正式定义为`一组组织的相关数据的集合，对其进行处理可以提供特定的、明确的含义。`数据库包含许多`表\
  \ (tables)`，也称为`关系 (relations)`，因此有了`关系 (relational)`前缀。每个表/关系由`属性 (attributes)`组成，也称为“字段”或“列”。通常，属性中的一个或多个作为唯一记录标识符，称为`主键\
  \ (primary keys)`，并且通常使用`索引 (indices)`进行组织。数据库的这些结构元素统称为数据库`元数据`。如所述，元数据的创建可以使用\
  \ DDL 处理。\n\n不言而喻，在创建元数据之前需要创建数据库本身。在 MySQL 中，创建新数据库只需点击 `phpMyAdmin` 左侧面板上的 `New`（新建）选项（图\
  \ 7.2）。创建新数据库时，用户必须指定名称、数据库格式（通常为 `GuiDB`）和默认字符集（通常为 `utf8`）。在 Python 中，创建过程涉及若干步骤：\n\
  \n*   获取 `MySQL` 环境的登录凭据。这些凭据可以在 MySQL `Example` 区域 `Welcome` 页面找到。\n*   使用 `config`\
  \ 对象（列表）以字典形式设置凭据：\n```\nconfig = {'user’: ‘root’, ‘password’: ‘root’, ‘host’: ‘localhost'}\n\
  ```\n*   编写连接数据库的语句、设置 SQL 语句并执行命令。\n\n编写创建数据库的 Python 脚本可以简单地在命令行模式下编写基本语句，也可以提供一个完整的\
  \ GUI 环境。以下 Python 脚本是后者的示例。注意，执行时应用程序不会产生输出，这仅意味着在连接 MySQL 时没有遇到问题。程序不是产生输出，而是将新创建的数据库作为`可用`数据库显示。必须强调的是，SQL\
  \ 语句被视为字符串，且`不区分大小写`。因此，可以使用大写或小写字母或两者的组合编写。在本章中，决定对语句的关键词使用大写字母，以符合官方 MySQL 文档采用的风格（Oracle,\
  \ 2021a）。这一决定主要是为了区分 SQL 关键字与 SQL 表和属性名称以及 Python 代码，从而提高清晰度和可读性。\n\n\n\n\n\n```python\n\
  \ 1   import tkinter as tk\n2   from tkinter import ttk\n3   import mysql.connector\n\
  4\n5   config = {'user': 'root', 'password': 'root', 'host': 'localhost'}\n6\n7\
  \   def createDB(dbName):\n8       GUIDB = 'GuiDB'\n9\n10      connect = mysql.connector.connect(**config)\n\
  11      cursor = connect.cursor()\n12      sqlString = \"CREATE DATABASE \" + dbName.get()\
  \ + \\\n13         \"DEFAULT CHARACTER SET utf8\"\n14      cursor.execute(sqlString.format(GUIDB))\n\
  \n16  # Create the basic window frame and give it a title\n17  winFrame = tk.Tk()\n\
  18  winFrame.title(\"Create a new database\")\n19  # Create the interface\n20  winLabel\
  \ = tk.Label(winFrame,\n21         text = \"Enter the name of the new database\"\
  , bg = \"grey\")\n22  winLabel.grid(column = 0, row = 0)\n23  # Create the StringVar\
  \ object that will accept user input from the\n24  # keyboard, and initialize it\n\
  25  textVar = tk.StringVar()\n26  textVar.set(\"Enter the name here\")\n27  winText\
