  \ regression`、`k-NN`、`SVM`、`Kernel SVM`、`Naïve Bayes`、`CART Decision Tree`、`Random\
  \ Forest`。\n\n### 解决方案\n\n`dataset.csv` 包含了 1999–2008 年间美国 130 家医院的糖尿病相关数据。来源可见：[`archive.ics.uci.edu/ml/datasets/diabetes+130-us+hospitals+for+years+1999-2008#`](https://archive.ics.uci.edu/ml/datasets/diabetes+130-us+hospitals+for+years+1999-2008#)。它包含了超过\
  \ 50 个代表患者和医院结果的特征。提取出的信息满足以下标准：\n\n1. 是一次住院就诊（医院入院）。\n2. 是一次糖尿病就诊，在此期间系统录入了任何类型的糖尿病作为诊断。\n\
  3. 住院时间至少为 1 天，最多 14 天。\n4. 执行了实验室检查。\n\n就诊期间使用了药物。数据包含诸如 `race`、`gender`、`age`、`time\
  \ in hospital`、`medical specialty`、`admission type`、`discharge disposition`、`admission\
  \ source`、`max glu serum`、`Hb1c result`、`number of tests` 等属性。以下表格列出了分类变量：\n\n####\
