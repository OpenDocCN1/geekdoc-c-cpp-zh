  \        #\n51         wcss.append(kmeans.inertia_)\n52  # 绘制聚类和 WCSS\n53  plt.figure(figsize\
  \ = (10,5))\n54  sns.lineplot(range(1, 15), wcss, marker = 'o')\n```\n\n\n\nApriori\
