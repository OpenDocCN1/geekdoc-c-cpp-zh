  -   **标签页：** 标签页提供了一种优化运行界面“空间”利用的有效方法，允许在同一空间内包含多个应用程序。这个理念简单，但直观且有效。标签页通常用于将单个\
  \ `notebook` 分为多个部分并加载各种独立的应用程序。\n-   **线程：** 线程涉及同时执行与同一进程、类或应用程序多个实例相关的代码。不同的线程可以同时执行，无论是并行执行也可以在显式定义的时间片内执行。每个线程可以有自己的小部件（如果是基于\
  \ GUI 的）和属性。线程对象并不一定相互通信，尽管这种通信是可能的，并在必要时可以实现。\n\n本章的重点在于讨论和说明与这些工具和结构相关的关键底层概念和机制。\n\
  \n## 5.2 Python 中的消息、常用对话框和启动界面\n\n`messageboxes`（消息框）、`common dialogs`（常用对话框）和\
  \ `splash screens`（启动界面）是一些最低调但非常有用的对象，它们可以帮助在不为应用程序添加大量代码的情况下增强其功能。它们用户友好且多功能，并在应用程序执行期间为用户提供即时的、严格限制且管理的输入。这些组件有多种类型，具有各种且多样的功能，例如显示用户消息、创建选项/选择菜单、接受和验证用户输入、管理显示参数和选项（例如颜色），以及管理文件、文件结构和目录。上述每个条项都可以通过相对简单的\
  \ Python 代码命令进行调用和实现，如接下来的节所示。\n\n### 5.2.1 简单消息框\n\n简单的 `message box`（消息框）向用户显示消息并一直保持显示，直到点击相应的\
  \ (OK) 按钮，此时应用程序将恢复执行。由于不需要接收输入，用户对消息的反应是无关的，唯一的选择就是点击 OK 按钮。该对象有三种不同的形式，由方法 `showinfo()`、`showerror()`\
  \ 和 `showwarning()` 表示，这些方法嵌入在 `messagebox` 对象（来自 `tkinter` 库）中。这些方法不会改变消息框的任何基本方面，但会根据提供给用户的信息类型修改伴随它的图标。以下\
  \ Python 脚本展示了使用这三种方法每个的基本示例：\n\n```python\n1  # 导入库\n2  import tkinter as tk\n\
  3  from tkinter import messagebox\n4\n5  # 声明 simpleMessage() 函数，在点击按钮时调用\n6  def\
  \ simpleMessage(a):\n7      if (a == 1):\n8         messagebox.showinfo(\"Simple\
  \ Info Message\",\n9             \"You clicked for the info message\")\n10     elif\
  \ (a == 2):\n11         messagebox.showerror(\"Simple Error Message\",\n12     \
  \        \"You clicked for the error message\")\n13     elif (a == 3):\n14     \
  \    messagebox.showwarning(\"Simple Warning Message\",\n15             \"You clicked\
  \ for the warning message\")\n16\n17  # 使用 tk 对象创建一个不可缩放的 Windows 框架\n18  winFrame\
  \ = tk.Tk()\n19  winFrame.title(\"Simple Messageboxes\")\n20  winFrame.resizable(False,\
  \ False)\n21  winFrame.geometry('290x180')\n22  winFrame.configure(bg = 'dark grey')\n\
  23\n24  # 创建触发信息消息的按钮\n25  winButton1 = tk.Button(winFrame, width = 25,\n26    \
  \  text = \"Click to display \\na simple info messagebox\")\n27  winButton1.pack();\
  \ winButton1.place(x = 50, y = 20)\n28  winButton1.bind('<Button-1>', lambda event:\
  \ simpleMessage(1))\n29\n30  # 创建触发错误消息的按钮\n31  winButton2 = tk.Button(winFrame,\
  \ width = 25,\n32      text = \"Click to display \\na simple error messagebox\"\
  )\n33  winButton2.pack(); winButton2.place(x = 50, y = 70)\n34  winButton2.bind('<Button-1>',\
  \ lambda event: simpleMessage(2))\n35\n36  # 创建触发警告消息的按钮\n37  winButton3 = tk.Button(winFrame,\
  \ width = 25,\n38      text = \"Click to display \\na simple warning messagebox\"\
