  \ == 2):\n        startingText = str(textVar.get())\n        sqlStatement = \"SELECT\
  \ * FROM \" + str(tableName.get()) + \" LIKE '\" + startingText + \"%'\"\n\n   \
  \ # 用户查询的框架\n    resultsFrame = tk.LabelFrame(winFrame, text='查询结果')\n    resultsFrame.config(bg\
  \ = 'light grey', fg = 'red', bd = 2, relief = 'sunken')\n    resultsFrame.grid(column\
  \ = 0, row = 1)\n\n    # 执行查询\n    cursor.execute(sqlStatement)\n    columns = cursor.fetchall()\n\
  \n    # 结果的数量\n    numRows = len(columns)\n\n    for i in range(numRows):\n    \
  \    for j in range(numCols):\n            # 显示结果的标签\n            newLabel = tk.Label(resultsFrame,\
  \ width = 24)\n            if i%2 == 0:\n                newLabel.config(text =\
  \ columns[i][j], bg = \"light grey\", relief = \"sunken\")\n            else:\n\
  \                newLabel.config(text = columns[i][j], bg = \"cyan\", relief = \"\
  sunken\")\n            newLabel.grid(column = j, row = i)\n\n# 根据属性类型显示/隐藏相关的条件参数\n\
  def radioClicked():\n    global minLabel, maxLabel, minCondScale, maxCondScale\n\
  \    global textualLabel, textualEntry\n\n    if (radioButton.get() == 1):\n   \
  \     minLabel.grid(); minCondScale.grid(); maxLabel.grid()\n        maxCondScale.grid_remove();\
  \ textualLabel.grid_remove()\n        textualEntry.grid_remove()\n    if (radioButton.get()\
  \ == 2):\n        minLabel.grid_remove(); minCondScale.grid_remove()\n        maxLabel.grid_remove()\n\
  \        maxCondScale.grid(); textualLabel.grid()\n        textualEntry.grid()\n\
  \n# 控制最小值的方法\ndef onScaleMin(val):\n    global minValue\n    minValue = int(val)\n\
  \n# 控制最大值的方法\ndef onScaleMax(val):\n    global maxValue\n    maxValue = int(val)\n\
  ```\n\n\n\n\n\n## 输出 7.4.3.a：使用数值条件查询的网格布局管理器\n\n![](img/un07_26.jpg)\n\n## 输出 7.4.3.b：使用基于文本条件查询的网格布局管理器\n\
  \n![](img/un07_27.jpg)\n\n从概念上讲，该脚本分为四个部分。第一部分（第 12–92 行）使用 `selectionGUI()` 函数提供\
  \ GUI 元素。这涵盖了 GUI 的主体，但不包含用于报告查询数据的网格。运行应用程序时，用户必须执行以下操作：\n\n1. 通过相关的组合框从已连接的数据库中选择一个表。\n\
  2. 使用所选表格的属性更新组合框。\n3. 选择作为查询条件依据的属性。\n4. 识别该属性是数值型（`int`）还是文本（`char`）。\n\n第二部分（第\
  \ 165–180 行）提供了必要的功能，允许用户通过选择相关的单选按钮来决定属性类型。这提供了相应的部分界面，以便创建条件。读者应该注意选择如何导致部分界面的出现/消失，并根据选择被最合适的选项所替换。这可以进一步增强和自动化，以包含尽可能多的条件。\n\
  \n在第三部分，函数 `updateAttributes()`（第 93–116 行）用于根据所选表格更新属性组合框。`onScaleMin()` 和 `onScaleMax()`\
  \ 函数（第 182–190 行）也是此过程的一部分，因为它们允许用户在选择数值属性时确定条件的范围。\n\n可以认为，应用程序中最重要的部分是 `runQuery()`\
  \ 函数（第 118–163 行）。该函数首先根据用户的偏好准备查询，然后根据准备好的条件运行查询。在执行后，数据网格将按要求显示，其列数由查询结果决定。网格仅仅是系列列的排列（即网格布局管理器的每一行），这些列是即时创建并加载了之前执行的查询结果的。\n\
  \n在外观和外在美学方面，读者还应该注意每行新行背景颜色的变化如何为网格营造出特定的颜色主题。必须强调的是，在这个特定的应用程序中，网格由标签（labels）组成，因此无法直接对其进行操作。如果使用不同的控件（例如输入框），则内容将是可编辑的，并且可以通过网格对数据进行处理（例如更新所选表记录上特定属性的值）。\n\
  \n这里提供的简单应用程序只是 Python 提供的 SQL 和 GUI 功能的使用和功能的示例。正如前面提到的，SQL 提供了许多选项和可能性，这反映了在 Python\
  \ 或或其他编程语言设计和实现数据库应用程序时几乎无限制的潜力。\n\n## 7.5 案例研究\n\n创建一个提供以下功能的应用程序：\n\n1. 提示用户输入其凭据和要连接的\
  \ MySQL 数据库名称。在应用程序窗口底部的状态栏中显示已连接数据库中可用的表列表（提示：可以使用标签来实现此目的）。\n2. 允许用户定义一个新表并设置其属性数量。根据用户的选择，创建所需的新表属性规格的界面（即：属性名称、类型和大小、主键或外键标记）。该界面应该是即时创建的。\n\
  \n*该应用程序必须使用 GUI 界面和 MySQL 功能来实现数据库元素。*\n\n## 7.6 练习题\n\n基于 `Employee` 示例，编写 Python\
  \ 脚本使用 MySQL 执行以下任务：\n\n1. 创建表 `DEPT` 以存储公司的部门数据，具有以下属性：\n    - 代码 → `DeptNo`，数字\
  \ (2)，非空，主键。\n    - 部门名称 → `Dname`，20 个字符。\n2. 创建表 `EMP` 以存储员工数据，具有以下属性：\n    -\
  \ c. 代码 → `Empno`，数字 (4)，非空，主键。\n    - d. 姓名（姓和名） → `Ename`，40 个字符。\n    - e. 职位\
  \ → `Job`，10 个字符。\n    - f. 经理代码 → `Mgr`，数字 (4)，指向 Emp Empno 的内部外键。\n    - g. 入职日期\
  \ → `Hiredate`，日期。\n    - h. 月薪 → `Sal`，数字 (7, 2)，在 100 到 10,000 之间。\n    - i. 部门代码\
  \ → `DeptNo`，数字 (2)，指向 Dept 的 No 的外键。\n3. 修改表 `DEPT` 以包含以下属性：位置 → `DLocation`，20\
  \ 个字符。\n4. 修改表 `EMP` 以包含以下属性：销售佣金 → `Comm`，数字 (7, 2)，不超过超过 `Sal`。\n5. 在 `DEPT` 中插入五条记录。\n\
  6. 在 `EMP` 中插入十条记录，每个部门两个。\n7. 删除最后输入的部门的记录。\n\n## 参考文献\n\n1. APACHE. (2021). APACHE\
