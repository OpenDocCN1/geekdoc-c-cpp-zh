  \ 为*及格*和*不及格*的输出着色。\n\n\n\n\n`decision 树`由`根`、`节点`和`叶子节点`组成（图 10.1）。决策树的起点是`根`；每个`内部节点`都分支连接到其他输入，这些输入也以节点的形式存在。每个`叶子节点`都是树的一个可能输出。分支通过使用分裂函数来确定，该函数将输入数据划分为一个或多个分支。树的叶子节点就是结果。\n\
  \n![](img/Fig10_01.jpg)\n\n**图 10.1** 决策树。\n\n为了创建决策树的顺序（或高度）及其特征，`决策树算法`使用一个函数来确定`信息增`。有两个函数用于此目的，称为索引：`熵`或\
  \ `Gini` 索引。它们的功能是衡量树中节点的`纯度`，并根据其值保留或丢弃该节点。这些值还决定了节点在树中的位置。根据索引计算方式以及在`分裂连续值`方面所做的选择，决策树有不同类型。常用的决策树类型有`ID3`\
  \ (Quinlan, 1986)、`C4.5` (Salzberg, 1994) 和 `CART` (Mola, 1998)。\n\n`CART`（分类与回归树）是最重要且最流行的`监督学习算法`类型之一。输出可以是分类值（例如，是否会下雨），也可以是连续值（例如，汽车的最终价格）。决策树的可视化表示如图\
  \ 10.2 所示。树从`Age`（年龄）特征开始，它是银行数据集中的数值属性。`Age`的值被划分为三个分支：`18–23`、`24–34` 和 `>35`。算法可以使用一种技术分裂`Age`特征的连续数值，`该技术也决定了树内特征的顺序`。接下来，`Age`特征（树的根）与三个额外的特征（节点）相关：`Job`（职业）、`Marital\
  \ Status`（婚姻状况）和`Housing`（住房）。\n\n![](img/Fig10_02.jpg)\n\n**图 10.2** 决策树示例。\n\n\
  可以使用训练数据集构建决策树。在以下示例中，脚本使用包含 40 条银行账户客户记录的数据集，包含`age`（年龄）、`job`（职业）、`marital status`（婚姻状况）和`education`（教育）特征。系统旨在预测客户在银行存存款的可能性。为了训练`CART`决策树，使用这四个特征作为输入，`deposit`（存款）特征作为输出。可能的输出是`Yes`（是）和`No`（否，即是否存款）。脚本需要若干关联库。其中一些库已经包含在系统中（例如`Pandas`和`Numpy`），而其他如`Pydoplus`和`Graphviz`必须明确安装。鉴于任何库的安装取决于所使用的特定系统，建议读者检查特定系统设置的可用`pip`安装语句：\n\
