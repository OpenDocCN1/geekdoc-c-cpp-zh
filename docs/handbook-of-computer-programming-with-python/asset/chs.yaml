  \   updateAttributesButton.bind('<Button-1>', lambda event: updateAttributes())\n\
  \    updateAttributesButton.grid(column = 2, row = 0)\n\n    # 创建运行查询的按钮\n    runButton\
  \ = tk.Button(selectionsFrame, text = '运行查询', relief = 'raised', width = 15)\n \
  \   runButton.bind('<Button-1>', lambda event: runQuery())\n    runButton.grid(column\
  \ = 3, row = 0)\n\n    # 根据选择的表更新列选择框\n    columnsLabel = tk.Label(selectionsFrame,\
  \ text = \"选择属性:\", bg = \"light grey\")\n    columnsLabel.grid(column = 0, row\
  \ = 1)\n    columnsCombo = ttk.Combobox(selectionsFrame, textvariable = attributeName,\
  \ width = 15)\n    columnsCombo.grid(column = 1, row = 1)\n\n    # 选定的属性是数值还是文本\n\
  \    numericalAttribute = tk.Radiobutton(selectionsFrame, text = '数值型\\n 属性', width\
  \ = 10, height = 2, bg = 'light green', variable = radioButton, value = 1, command\
  \ = radioClicked).grid(column = 2, row = 1)\n    textAttribute = tk.Radiobutton(selectionsFrame,\
  \ text = '文本型\\n 属性', width = 10, height = 2, bg = 'light green', variable = radioButton,\
  \ value = 2, command = radioClicked).grid(column = 3, row = 1)\n    radioButton.set(1)\n\
  \n    # 创建数值条件参数的 GUI\n    minLabel=tk.Label(selectionsFrame, text=\"最小值:\",bg=\"\
  light grey\")\n    minLabel.grid(column = 0, row = 4); minLabel.grid_remove()\n\
  \    minCond = tk.IntVar()\n    minCondScale = tk.Scale(selectionsFrame, length\
