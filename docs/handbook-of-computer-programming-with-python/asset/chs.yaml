  \ following: ['BMW', 'Toyota', 'Honda',\n'Mercedes', 'Toyota']\nToyota is in the\
  \ list\nNissan is not in the list\nOccurences of the particular item in the list\
  \ is: 2\nThe contents of the new list are: ['BMW', 'Toyota', 'Honda',\n'Mercedes',\
  \ 'Toyota']\nThe newCars list of items is now empty: []\n```\n\n### 6.2.2 元组 (Tuple)\n\
  \n元组是列表的一种特殊类型，项按特定顺序组织，并通过引用索引值进行访问。普通列表和元组的区别在于后者是不可变的（immutable），这意味着它的项不能被修改。因此，元组不提供上一节描述的列表的一些扩展功能。在语法上，元组使用圆括号而不是方括号创建。以下脚本演示了元组创建和使用的基础知识：\n\
  \n```python\n# 创建元组\ncars = (\"BMW\", \"Toyota\", \"Honda\", \"Mercedes\")\n\n#\
  \ 显示元组中的所有项\nprint(\"The items in the tuple are: \", cars)\n# 显示元组中的第一个项\nprint(\"\
  The first item in the tuple is: \", cars)\n\n# 抛出 TypeError，因为元组项不可修改\ncars[0] =\
  \ \"Tesla\"\n```\n\n**输出 6.2.2:**\n\n```\n The items in the tuple are: ('BMW', 'Toyota',\
  \ 'Honda', 'Mercedes')\nThe first item in the tuple is: BMW\n-------------------------------------------------------\n\
  TypeError                                Traceback (most call last)\n<ipython-input-1-3ceee3a4c8>\
  \ in <module>\n      8\nTypeError: 'tuple' object does not support item assignment\n\
  ```\n\n### 6.2.3 集合 (Sets)\n\n集合是无序且唯一项的集合。它使用大括号 `{}` 创建。当使用 `print()` 函数显示集合内容时，重复会被移除，且内容不会以特定顺序呈现。事实上，每次执行代码时，元素的顺序都是不同的。\n\
  \n集合上可以使用四种特定的运算符/函数：\n\n1. `in` 运算符：检查项是否包含在集合中。\n2. `intersection()` 函数：识别两个集合之间的共同项。\n\
  3. `difference()` 函数：获取一个集合中不存在于另一个集合的项。\n4. `union()` 函数：合并两个集合的项并返回去重的新集合。\n\n\
  以下脚本演示了集合的基本用法及其主要操作：\n\n```python\n# 创建集合\ncars = {\"BMW\", \"Toyota\", \"Honda\"\
  , \"Mercedes\", \"Toyota\"}\n# 打印集合\nprint(\"The cars set includes the following\
  \ items: \", cars)\n\n# 检查特定项于集合中\nif (\"Honda\" in cars):\n    print(\"Honda is\
  \ in the cars set\")\nelse:\n    print(\"Honda is not in the cars set\")\n\n# 创建并打印另一个集合\n\
  german_cars = {\"BMW\", \"Mercedes\", \"Audi\", \"Porsche\"}\nprint(\"The german\
  \ cars set includes the following items: \", german_cars)\n\n# 查找并打印交集（即两个集合的共同项）\n\
  print(\"The intersection, i.e., the common items of the two sets, is: \",\n    \
  \  cars.intersection(german_cars))\n\n# 查找并打印两个集合之间的差集\nprint(\"The different items\
  \ between the two sets are: \",\n      cars.difference(german_cars))\n\n# 查找并打印两个集合的并集\n\
  print(\"The union of the two sets is: \", cars.union(german_cars))\n```\n\n\n\n\n\
  \n```\n The cars set includes the following items: {'Honda', 'Mercedes',\n'BMW',\
  \ 'Toyota'}\nHonda is in the cars set\nThe german cars set includes the following\
  \ items: {'Mercedes',\n'Porsche', 'BMW', 'Audi'}\nThe intersection, i.e. the common\
  \ items of the two sets, is:\n{'Mercedes', 'BMW'}\nThe different items between the\
  \ two sets are: {'Honda', Toyota'}\nThe union of the two sets is: {'Audi', 'Porsche',\
  \ 'Honda',\n'Mercedes', 'BMW', 'Toyota'}\n```\n\n### 6.2.4 字典 (Dictionary)\n\n`dictionary`\
  \ 是一个以 `key-value` 对形式存储值的集合。`key` 是唯一标识符，而 `value` 是与之关联的数据。字典类似于电话簿，存储了人的联系姓名和电话。联系姓名就是用于查找电话号码（即\
  \ `value`）的 `key`。在字典中，键必须是 `unique`（唯一的）且是 `immutable`（不可变的）数据类型，例如字符串或整数，而值可以是任何类型（例如字符串、整数、列表）。\n\
  \n创建字典的 Python 语法如下：\n\n```\n dictionary = {key1: value1, key2: value2}\n```\n\n\
  表 6.2 列出了可用的字典函数\n\n### 表 6.2 字典函数\n\n| 函数 | 描述 |\n| --- | --- |\n| `clear()` |\
  \ 从字典中删除所有元素 |\n| `copy()` | 返回字典的副本 |\n| `get(key)` | 通过键获取项 |\n| `has_key(key)`\
  \ | 根据键是否在字典中返回布尔值 |\n| `items()` | 返回包含 (key, value) 元组的列表 |\n| `keys()` | 返回键的列表\
  \ |\n| `values()` | 返回值的列表 |\n| `pop(key)` | 根据给定的键删除该项并返回其值 |\n| `popitem()` |\
  \ 移除下一个项并返回键/值 |\n| `update()` | 从另一个字典添加或覆盖项 |\n\n以下脚本展示了一个名为 `employee` 的字典示例，该字典存储员工的姓名、薪水和职位：\n\
  \n```python\n 1   # 创建字典 \n2   employee = {\"name\": \"Maria\", \"salary\": 15000,\
  \ \"job\": \"Sales Manager\"}\n3\n4   # 打印字典\n5   print(\"The employee dictionary\
  \ is: \", employee)\n6   # 访问特定的键并打印对应的值\n7   print(\"The pair value for the <name>\
  \ key is: \", employee[\"name\"])\n8\n9   # 使用 get() 方法根据给定的键打印值对\n10  print(\"\
  The value pair of the <name> key is: \", employee.get(\"name\"))\n11  # 如果键值不存在，get()\
  \ 方法将返回\n12  # None (空) \n13  print(\"The value pair of the <name> key is: \",\n\
  14        employee.get(\"department\"))\n15\n16  # 向字典中添加新的键值对\n17  employee[\"\
  department\"] = \"Sales\"\n18  print(\"The value pair of the new <department> key\
  \ is: \",\n19  employee.get(\"department\"))\n20\n21  # 修改给定键的值 \n22  employee[\"\
  salary\"] = \"20000\"\n23  print(\"The new employee dictionary includes the following\
  \ pairs: \",\n24        employee)\n25\n26  # 使用 update() 方法修改字典 \n27  employee.update({\"\
  name\":\"Alex\",\"department\":\"Sales\"})\n28  print(employee)\n29\n30  # 根据给定的键弹出/移除键值对，将其赋值给新\n\
  31  # 字典并打印\n32  emp_job = employee.pop(\"job\")\n33  print(\"The original employee\
  \ dictionary is: \", employee)\n34  print(\"The new emp_job dictionary is: \", emp_job)\n\
  ```\n\n**输出 6.2.4：**\n\n```\n The employee dictionary is: {'name': 'Maria', 'salary':\
  \ 15000, 'job':\n'Sales Manager'}\nThe pair value for the <name> key is: Maria\n\
  TThhee vvaalluuee ppaaiirr ooff tthhee <<nnaammee>> kkeeyy iiss:: MN aonrei a\n\
  The value pair of the new <department> key is: Sales\nThe new employee dictionary\
  \ includes the following pairs: {'name': 'Maria',\n'salary': '20000', 'job': 'Sales\
  \ Manager', 'department': 'Sales'}\n{'name': 'Alex', 'salary': '20000', 'job': 'Sales\
  \ Manager', 'department':\n'Sales'}\nThe original employee dictionary is: {'name':\
  \ 'Alex', 'salary': '20000',\n'department': 'Sales'}\nThe new empjob dictionary\
  \ is: Sales Manager\n```\n\n读者应该注意，既可以直接访问（第 7 行），也可以通过 `get()` 函数（第 10 行）访问字典键的值。如果访问的值不存在，`get()`\
  \ 方法将返回 `None`（空）（第 13 行）。\n\n## 6.3 排序 (Sorting)\n\n排序是计算机科学中的一项主要任务。在更广泛的语境下，排序是将数据排列成顺序的过程。效率通过排序列表所需的比较和交换次数来衡量。\n\
  \n### 6.3.1 冒泡排序 (Bubble Sort)\n\n冒泡排序是广为人知的算法之一。该算法的主要思想是在每次迭代中将最大（或最小）的元素移动到末尾（或开头）位置。程序重复此过程，移动下一个最大（或最小）数值。迭代的次数与元素的总数等同。因此，冒泡排序的时间复杂度为\
  \ `O(n²)`。\n\n由于这些计算是估计值，它们在很大程度上取决于当前的系统、数据的类型以及所使用的编程平台。然而，这些粗略的假设和数字可以让我们直观地感受到随着列表规模增加，效率是如何下降。\n\
  \n### 6.3.2 效率 (Efficiency)\n\n为了研究算法的低效率，读者可以假设每次比较需要 `1 nanosecond` 完成（`1 nanosecond\
  \ = 1.0e-9 seconds`）。产生以下粗略估算：\n\n*   `n = 9`: `n² = 81` 次比较 → 大约时间 `3e-4` 秒。\n\
  *   `n = 100`: `n² = 9.8e3` 次比较 → 大约时间 `5e-3` 秒。\n*   `n = 1000`: `n² = 9.98e5`\
  \ 次比较 → 大约时间 `0.4` 秒。\n*   `n = 10000`: `n² = 9.998e7` 次比较 → 大约时间 `46` 秒。\n*   `n\
  \ = 20000`: `n² = 4e7` 次比较 → 大约时间 `188` 秒\n\n确实，只要 `n` 不超过大约 10,000，冒泡排序运行良好。超过这个点后，它就会变得沉重，其低效率开始显现。\n\
  \n\n\n\n通过避免不必要的比较，可以稍微提高算法的效率。例如，可以使用以下八元素列表：`3`, `5`, `4`, `2`, `3`, `1`, `6`,\
  \ `7`。在每次 `main` 迭代中，算法将执行 `n−1` 次（即七次迭代）。随后，`inner` 迭代负责将每个元素相继移动到对应的位置（表 6.3）。\n\
  \nTABLE 6.3 第一次主迭代内部的内部循环\n\n| ![](img/6tab03.jpg) |\n\n读者应该注意，首先，内层循环的每次迭代并不一定会发生元素的交换（swap），其次，在主外层迭代结束时，最大的元素会被推到列表末尾。在这种情况下，在第一次主外层迭代中，元素\
  \ `7` 被推到了列表末尾。最后一行是完成所有七次内层循环后第一次主外层迭代的结果。随后的迭代将重复相同的过程，确保下一个较大的元素移动到适当的位置，直到所有元素都已在列表中正确的位置。\n\
  \n表 6.4 展示了每次外层迭代/循环后的结果。\n\nTABLE 6.4 外层循环的结果\n\n| 第 1 次通过后 | 3 | 4 | 2 | 3 | 1\
  \ | 5 | 6 | 7 |\n| 第 2 次通过后 | 3 | 2 | 3 | 1 | 4 | 5 | 6 | 7 |\n| 第 3 次通过后 | 2 |\
  \ 3 | 1 | 3 | 4 | 5 | 6 | 7 |\n| 第 4 次通过后 | 2 | 1 | 3 | 3 | 4 | 5 | 6 | 7 |\n| 第\
  \ 5 次通过后 | 1 | 2 | 3 | 3 | 4 | 5 | 6 | 7 |\n| 第 6 次通过后 | 进行了比较但无交换 |\n| 第 7 次通过后\
  \ | 进行了比较但无交换 |\n\n下面提供了一个基础冒泡排序的 Python 实现及其输出：\n\n```python\n 1   # 导入随机模块以生成随机数\n\
  2   import random\n3   import time\n4\n5   comparisons = 0\n6   list = []\n7\n8\
  \   # 输入列表元素数量\n9   size = int(input(\"Enter the number of list elements: \"))\n\
  10  # 使用 randint() 函数生成随机整数\n11  for i in range (size):\n12      newNum = random.randint(-100,\
  \ 100)\n13      list.append(newNum)\n14  print(\"The unsorted list is: \", list)\n\
  15\n16  # 冒泡排序列表并记录统计数据供以后使用\n17  # 开始计时\n18  startTime = time.process_time()\n\
  19\n20  # 冒泡排序算法\n21  for i in range (size-1):\n22      for j in range (size-1):\n\
  23          comparisons += 1\n24          if (list[j] > list[j+1]):\n25        \
  \      temp = list[j]\n26              list[j] = list[j+1]\n27              list[j+1]\
  \ = temp\n28\n29  # 结束计时\n30  endTime = time.process_time()\n31\n32  # 显示冒泡排序的基础信息\n\
  33  print(\"The sorted list is: \", list)\n34  print(\"The number of comparisons\
  \ is: \", comparisons)\n35  print(\"The elapsed time in seconds is: \", (endTime\
  \ - startTime))\n```\n\n**输出 6.3.1：**\n\n```\n Enter the number of elements in the\
  \ list:7\nThe unsorted list is: [33, -16, -57, -17, 95, 5, 15]\nThe sorted list\
  \ is: [-57, -17, -16, 5, 15, 33, 95]\nThe number of comparisons is = 36\nThe elapsed\
  \ time in seconds = 0.0\n```\n\n### 6.3.2 插入排序\n\n`Insertion sort` 是另一种基础排序算法，与冒泡排序类似但有所改进。其基本思想是在第\
  \ `ith` 次通过（pass）时，算法将第 � 个元素（ith element）插入到 `L[1]`、`L[2]`、`…``L[i-1]` 序列末尾的适当位置（即\
  \ `L[i]`），而这些元素之前已经按有序顺序排列好了。因此，在插入之后，占据 `L[1]`、`L[2]`、`…``L[i]` 序列的元素是有序的。简单来说，该算法对原始列表不断增大的子集进行排序，直到整个列表排序完成。\n\
