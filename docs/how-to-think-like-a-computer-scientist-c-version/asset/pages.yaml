- pgno: 34
  md: "# 3.7. PROGRAMS WITH MULTIPLE FUNCTIONS\n\nInside the definition of **main**,\
    \ there is a statement that uses or calls **threeLine**. Similarly, **threeLine**\
    \ calls **newLine** three times. Notice that the definition of each function appears\
    \ above the place where it is used.\n\nThis is necessary in C++; the definition\
    \ of a function must appear before (above) the first use of the function. You\
    \ should try compiling this program with the functions in a different order and\
    \ see what error messages you get.\n\n# 3.7 Programs with multiple functions\n\
    \nWhen you look at a class definition that contains several functions, it is tempting\
    \ to read it from top to bottom, but that is likely to be confusing, because that\
    \ is not the **order of execution of the program.\n\nExecution begins at the first\
    \ statement of **main**, regardless of where it is in the program (often it is\
    \ at the bottom). Statements are executed one at a time, in order, until you call\
    \ a function. Function calls are a detour in the flow of execution. Instead of\
    \ going to the next statement, you go to the first line of the called function,\
    \ execute all the statements, and then come back up pick where you left off.\n\
    \nThat sounds simple enough, except that you have to remember that one function\
    \ can call another. Thus, while we are in the middle of **main**, we might have\
    \ to go off and execute statements in **threeLine**. But while we are **threeLine**,\
    \ we get interrupted times to go off and execute **newLine**.\n\nFortunately,\
    \ C++ is not always keeping track of where it is, so each time **newLine** completes,\
    \ the program picks up where it left off in **threeLine**, and eventually gets\
    \ back to **main** so the program can terminate.\n\nWhat's the moral of this sordid\
    \ tale? When you read a program, don't read from top to bottom. Instead, follow\
    \ the flow of execution.\n\n# 3.8 Parameters and arguments\n\nSome of the built-in\
    \ functions we have used have **parameters**, which are values that you provide\
    \ to let the function do its job. For example, if you want to find the size of\
    \ a number, you have to indicate what number it is. Thus, **sin** takes a **double**\
    \ value as a parameter.\n\nSome functions take more than one parameter, like **pow**,\
    \ which takes two doubles: the base and the exponent.\n\nNotice that in each of\
    \ these cases we have to specify not only how many parameters there are, but also\
    \ what type they are. So it shouldn't surprise that when you write a class definition,\
    \ the parameter list indicates the type of each parameter. For example:\n\n```\n\
    void printTwice(char phil) {\n    cout << phil << endl;\n}\n```"
