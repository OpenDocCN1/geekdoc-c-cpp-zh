  md: '# 3.3 Math functions


    In mathematics, you have probably seen functions like sin and log, and you have
    learned to evaluate expressions like sin$(\pi/2)$ and log$(1/x)$. First, you evaluate
    the expression in parentheses, which is called the **argument** of the function.
    For example, $\pi/2$ is approximately 1.571, and $1/x$ is 0.1 (if $x$ happens
    to be 10).


    Then you can evaluate the function itself, either by looking it up in a table
    or by performing calculations. The log of 1.571 is 1, and the log of 1 is (assuming
    that log indicates the logarithm base 10).


    This process can be applied repeatedly to evaluate more complicated expressions
    like log$(1/\sin(\pi/2))$. First we evaluate the argument of the innermost function,
    then evaluate the function, and so on.


    C++ provides a set of built-in functions that includes most of the mathematical
    operations you can think of. The math functions are invoked using a syntax that
    is similar to mathematical notation:


    ```

    double log = log(17.0);

    double angle = 1.5;

    double height = sin(angle);

    ```


    The first example sets the log to the logarithm of base 17, base e. There is also
    a function log10 that takes logarithms base 10.


    The second example finds the sine value of the variable **angle**. C++ assumes
    that the values you use with sin and the other trigonometric functions (cos, tan)
    are in radians. To convert from radians to degrees, you can divide by 360 and
    multiply by $2\pi$.


    If you don''t know $\pi$ to 15 digits, you can calculate it using the acos function.
    The arccosine (or inverse cosine) of $-\pi$ is -1, because the cosine of $\pi$
    is -1.


    ```

    double pi = acos(-1.0);

    double degrees = 90;

    double angle = degrees * 2 * pi / 360.0;

    ```


    Before you use any of the math functions, you have to include the **header file**.
    Header files contain information the compiler needs about functions that are defined
    outside your program. For example, in the "Hello, world!" program we included
    a header file named iostream.h using an **include** statement:


    ```

    #include <iostream>

    ```


    iostream.h contains information about input and output (I/O) streams, including
    the object name count.


    Similarly, the header file contains information about the math functions. You
    can include it at the beginning of your program with iostream.h.


    ```

    #include <math.h>

    ```'
