- pgno: 62
  md: "# 6.3. THE WHILE STATEMENT\n\n2. If the condition is false, exit the while\
    \ statement and continue execution at the next statement.\n\n3. If the condition\
    \ is true, execute each of the statements between the squiggle-braces, and then\
    \ go back to step 1.\n\nThis type of flow is called a loop because the third step\
    \ loops back around to the top. Notice that if the condition is false the first\
    \ time through the loop, the statements inside are never executed. The statements\
    \ inside are called the body of the loop. The body of the loop should change the\
    \ value of one or more variables so that, eventually, the condition becomes false\
    \ and the loop terminates. Otherwise the loop will repeat forever, which is called\
    \ an infinite loop. An endless source of amusement for computer scientists is\
    \ the observation that the directions on shampoo, \"Lather, rinse, repeat,\" are\
    \ an infinite loop.\n\nIn the case of countdown, we can prove that the loop will\
    \ terminate because we know the value of n is finite, and we can see that the\
    \ value of n gets smaller each time through the loop (each iteration), so eventually\
    \ we have to get zero. In other cases it is not easy to tell:\n\n```\nvoid sequence\
    \ (int n) {\n    while (n != 1) {\n        cout << n << endl;\n        if(n%2\
    \ == 0) { // n is even\n            n = n / 2;\n        } else {\n           \
    \ n = n + 3;\n        }\n    }\n}\n```\n\nThe condition for this loop is n !=\
    \ 1, so the loop will continue until n is 1, which will make the condition false.\n\
    \nAt each iteration, the program outputs the value of n and checks whether it\
    \ is even or odd. If it is, the value of n is divided by two. If it is odd, the\
    \ value is 3n + 1. For example, if the starting value (the argument passed to\
    \ sequence) is 3, the sequence is 3, 10, 5, 16, 8, 4, 2.\n\nSince n increases\
    \ and decreases, there is no obvious proof that n will ever reach 1, or that the\
    \ program will terminate. For particular values of n, we can prove termination.\
    \ For example, if the starting value is a power of two, then the value of n will\
    \ be even every time through the loop, until we get to 1. The previous example\
    \ ends with such a sequence, starting with 16.\n\nParticular values aside, the\
    \ interesting question is whether we can prove that this program terminates for\
    \ all values of n. So far, no one has been able to prove it or disprove it!"
