  md: '# # Chapter 12


    # # Vectors of Objects


    # ## 12.1 Composition


    By now we have seen several examples of composition (the ability to combine language
    features in a variety of arrangements). One of the first examples we saw was a
    function invocation as part of an expression. Another example is the nested structure
    of statements: you can put an if statement within a while loop, or within another
    if statement, etc.


    Having seen this pattern, and having learned about vectors and objects, you should
    not be surprised to learn that you can have vectors of objects. In fact, you can
    have objects that contain vectors (as instance variables): you can have vectors
    that contain vectors, you can have objects that contain objects, and so on.


    In the next two chapters we will look at some examples of these combinations,
    using Card objects as a case study.


    # ## 12.2 Card objects


    If you are not familiar with common playing cards, now would be a good time to
    get a deck, or else this chapter might not make much sense. There are 52 cards
    in a deck, each of which belongs to one of four suits and 13 ranks. The suits
    are Spades, Hearts, Diamonds and Clubs (in order in Bridge). The ranks are Ace,
    2, 3, 4, 5, 6, 7, 8, 9, 10, Jack, Queen and King. Depending on what game you are
    playing, the rank of the Ace may be higher than King or lower than 2.


    If we want to define a new object to represent a playing card, it is pretty obvious
    that the instance variables should be: rank and suit. It is not obvious what type
    the instance variables should be. One possibility is apstrings, containing things
    like "Spade" for suits and "Queen" for ranks. One problem with this implementation
    is that it would not be easy to compare cards to see which had higher rank or
    suit.'
