  md: '# 8.8. RECTANGLES


    Notice that one structure can contain another. In fact, this sort of thing is
    quite common. Of course, this means that in order to create a Rectangle, we have
    to create a Point first:


    ```

    Point corner = { 0.0, 0.0, 0.0 };

    Rectangle box = { corner, 100.0, 200.0 };

    ```


    This code creates a new Rectangle structure and initializes the instance variables.
    The figure shows the effect of this assignment.


    | box corner |

    |---||

    | x: | 0 |

    | y: | 0 |

    | width: 100 |

    | height: 200 |


    We can access the width and height in the usual way:


    ```

    box.width += 50.0;

    cout << box.height << endl;

    ```


    In order to access the instance variables of corner, we can use a temporary variable:


    ```

    Point temp = box.corner;

    double x = temp.x;

    ```


    Alternatively, we can compose the two statements:


    ```

    double x = box.corner.x;

    ```


    It makes most sense to read this statement from right to left: “Extract x from
    the corner of box, and assign it to the local variable x."

    While we are on the subject of composition, I should point out that you can, in
    fact, create the Point and the Rectangle at the same time:


    ```

    Rectangle box = { 0.0, 0.0, 0.0 }, 100.0, 200.0 };

    ```


    The innermost squiggly braces are the coordinates of the corner point; together
    they make up the first of three values that go into the new Rectangle. This statement
    is an example of nested structure.'
