  md: '# # Chapter 3


    # # Function


    # ## 3.1 Floating-point


    In the last chapter we had some problems dealing with numbers that were not integers.
    We worked around the problem by measuring percentages instead of fractions, but
    a more general solution is to use floating-point numbers, which can represent
    fractions as well as integers. In C++, there are two floating-point types, called
    **float** and **double**. In this book we will use **doubles** exclusively.


    You can create floating-point variables and assign values to them using the same
    syntax used for the other types. For example:


    ```

    double pi;

    pi = 3.14159;

    ```


    It is also legal to declare a variable and assign a value to it at the same time:


    ```

    int x = ;

    String empty = "";

    double pi = 3.14159;

    ```


    In fact, this syntax is quite common. A combined declaration and assignment is
    sometimes called **initialization**.


    Although floating-point numbers are useful, they are often a source of confusion
    because there seems to be an overlap between integers and floating-point numbers.
    For example, if you have the value 1, is it an integer, a floating-point number,
    or both?


    Strictly speaking, C++ distinguishes the integer 1 from the floating-point value
    1.0, even though they seem to be the same number. They belong to different types,
    and strictly speaking, you are not allowed to make assignments between types.
    For example, the following is illegal


    ```

    int x = 1.1;

    ```'
