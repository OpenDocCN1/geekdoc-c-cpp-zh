    \ number);    // WRONG!!!\n```\n\n# 4.4 Chained conditionals\n\nSometimes you\
    \ want to check for a number of related conditions and choose one of several actions.\
    \ One way to do this is by chaining a series of ifs and elses:\n\n```\nif (x >\
    \ 0) {\n    cout << \"x is positive\" << endl;\n} else if (x < 0) {\n    cout\
    \ << \"x is negative\" << endl;\n} else {\n    cout << \"x is zero\" << endl;\n\
    }\n```\n\nThese chains can be as long as you want, although they be difficult\
    \ to read if they get out of hand. One way to make them easier to read is to use\
    \ standard indentation, as demonstrated in these examples. If you keep all the\
    \ statements and braces lined up, you are less likely to make syntax errors and\
    \ you can find them more quickly if you do.\n\n# 4.5 Nested conditionals\n\nIn\
    \ addition to chaining, you can also nest one conditional within another. You\
    \ could have written the previous example as:\n\n```\nif (x == 0) {\n    cout\
    \ << \"x is zero\" << endl;\n} else {\n    if (x > 0) {\n        cout << \"x is\
    \ positive\" << endl;\n    } else {\n        cout << \"x is negative\" << endl;\n\
    \    }\n}\n```"
