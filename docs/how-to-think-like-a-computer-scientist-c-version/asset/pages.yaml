    # CHAPTER 9. MORE STRUCTURES


    But if we have the insight to treat times as base 60 numbers, and make the investment
    of writing the conversion functions (convertToSeconds and makeTime), we get a
    program that is shorter, easier to read and debug, and is more reliable.


    It is also easier to add more features. For example, imagine subtracting Two Times
    in lieu. The naive approach would be to implement subtraction with borrowing.
    Using the conversion functions would be easier and more likely to be correct.


    Ironically, making a problem harder (more general) makes easier (few special cases,
    fewer opportunities for error).


    # 9.11 Algorithms


    When you write a general solution for a class of problems, opposed to a specific
    solution to a single problem, you have written an algorithm. I mentioned this
    word in Chapter 1, but did not define it carefully. It is not easy to define,
    so I will try a couple of approaches.


    First, consider something that is not an algorithm: a few tricks. When you learned
    to multiply single-digit numbers, you probably remembered the multiplication table.
    In effect, you memorized 100 specific solutions. That kind of knowledge is not
    really algorithmic.


    But if you were “lazy,” you probably learned learning a few tricks. For example,
    to find the product of $n$ and $9$, you can write $n-1$ as the first digit and
    $10-n$ as the second digit. This is a general solution for multiplying any single-digit
    by 9. That’s an algorithm!


    Similarly, the techniques you learned for carrying, subtraction with borrowing,
    and long division are all algorithms. One of the characteristics of algorithms
    is that they do not require intelligence to carry out. They are mechanical processes
    in which each step follows the last according to a simple set of rules.


    In my opinion, it is embarrassing that humans spend so much time in learning to
    execute algorithms, that quite literally, require no intelligence.


    On the other hand, the process of designing algorithms is interesting, intellectually
    challenging, and a central part of what we call programming.


    Some of the things people do naturally, without difficulty or conscious thought,
    are the difficult to express algorithmically. Understanding natural language is
    a good example. We all do it, but so far no one has been able to explain how we
    do, at least in the form of an algorithm.


    Later in this book, you will have the opportunity to design simple algorithms
    for a variety of problems. Data Structures, which you will see in the next class
    in the Computer Science sequence, will show some of the most interesting, clever,
    and useful algorithms computer science has produced.'
