- pgno: 109
  md: "# 10.6 Statistics\n\nThe numbers generated by random are supposed to be distributed\
    \ uniformly. That means that each value in the range should be equally likely.\
    \ If we count the number of times each value appears, it should be roughly the\
    \ same for all values, provided that we generate a large number of values.\n\n\
    In the next sections, we will write programs that generate a sequence of random\
    \ numbers and check whether this property holds true.\n\n# 10.7 Vector of random\
    \ numbers\n\nThe first step is to generate a large number of random values and\
    \ store them in a vector. By “large number”, of course, I mean 20. It's always\
    \ a good idea to start with a manageable number, to help with debugging and then\
    \ increase it later.\n\nThe following takes a single argument, the size of the\
    \ vector. It allocates a new vector of ints, and fills it with random values between\
    \ 0 and upperBound-1.\n\n```\napvector<int> randomVector(int n, int upperBound)\
    \ {\n  apvector<int> vec(n);\n  for (int i = 0; i<vec.length(); i++) {\n    vec[i]\
    \ = random () % upperBound;\n  }\n  return vec;\n}\n```\n\nThe return type is\
    \ apvector<int>, which means that this function returns a vector of integers.\
    \ To test this, it is convenient to have a function that outputs the contents\
    \ of a vector.\n\n```\nvoid printVector(const apvector<int>& vec) {\n  for (int\
    \ i = 0; i<vec.length(); i++) {\n    cout << vec[i] << \" \";\n  }\n}\n```\n\n\
    Notice that it is legal to pass vectors by reference. In fact it is quite common,\
    \ since it makes it unnecessary to copy the vector. Since printVector does not\
    \ modify the vector, we declare the parameter const.\n\nThe following code generates\
    \ a vector and outputs it:\n\n```\nint numValues = 20;\nint upperBound = 10;\n\
    apvector<int> vector = randomVector(numValues, upperBound);\nprintVector(vector);\n\
    ```"
