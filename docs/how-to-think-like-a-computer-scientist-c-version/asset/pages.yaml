  md: "# CHAPTER 15. FILE INPUT/OUTPUT AND APMATRIXES\n\n```\nif (isdigit(s[i])) {\n\
    \    digitString += s[i];\n}\n\nreturn atoi(digitString.c_str());\n\n```\n\nThe\
    \ variable digitString is an example of an accumulator. It is similar to\nt counter\
    \ we saw in Section 7.9, except instead of getting incremented,\nit gets accumulates\
    \ two new character at a time, using string concatenation.\nThe expression\n\n\
    ```\ndigitString += s[i];\n```\n\nis equivalent to\n\n```\ndigitString = digitString\
    \ + s[i];\n```\n\nBoth statements adds a single character onto the end of the\
    \ existing string.\nSince atoi takes a C string as a parameter, we have to convert\
    \ digitString\nto a C string before passing it as an argument.\n\n# 15.6 The set\
    \ data structure\n\nA data structure is a container for grouping a collection\
    \ of data into a single\nobject. We have seen some examples already, including\
    \ apstrings, which are\ncollections of characters, and apectors which are collections\
    \ on any type.\n ordered set is a collection of items with two properties:\n\n\
    **Ordering:** The elements of the set have indices associated with them. We can\n\
    use these indices to identify elements of the set.\n\n**Uniqueness:** No element\
    \ appears in the set more than once. If you try to add\nan element to a set, and\
    \ it already exists, there is no effect.\n\nIn addition, our implementation of\
    \ an ordered set will have the following\nproperty:\n\n**Arbitrary size:** As\
    \ we add elements to the set, it expands, to make room for\nnew elements.\n\n\
    Both apstrings and apectors have an ordering; every element has an index\nwe can\
    \ use to identify. Both of the data structures we have seen so far\nhave the properties\
    \ of uniqueness or arbitrary size.\n\nTo achieve uniqueness, we have to make an\
    \ add function that searches the\nset to see if it exists. To make the set expend\
    \ as elements are added,\ncan take advantage of the resize function on apectors.\n\
    \nHere is the beginning of a class definition for a Set."
