    \ things computers are often used for the automation of repetitive tasks. Repeating\
    \ identical or similar tasks without making errors is something that computers\
    \ do well and people poorly.\n\nWe have programs that use recursion to perform\
    \ repetition, such as nLines and countdown. This type of repetition is called\
    \ Iteration, and C++ provides several language features that make it easier to\
    \ write iterative programs.\n\nThe two features we are going to look at are the\
    \ while statement and the for.\n\n# 6.3 The while statement\n\nUsing a while statement,\
    \ we can rewrite countdown:\n\n```\nvoid countdown(int n) {\n    while (n > 0)\
    \ {\n        cout << n << endl;\n        n = n-1;\n    }\n    cout << \"Blastoff!\"\
    \ << endl;\n}\n```\n\nYou can almost read a while statement as if it were English.\
    \ What this means is, \"n is greater than zero, continue displaying the value\
    \ of n and then reducing the value of n by 1. When you get to zero, output the\
    \ word 'Blastoff!'\nMore formally, the flow of execution for a while statement\
    \ is as follows:\n\n+   1. Evaluate the condition in parentheses, yielding true\
    \ or false."
