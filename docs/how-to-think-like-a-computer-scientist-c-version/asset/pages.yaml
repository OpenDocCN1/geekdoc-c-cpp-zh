    # 11.10 Header files


    It might seem a nuisance to declare functions inside the structure definition
    and then define the functions later. Any time you change the interface to a function,
    you have to change it in two places, even if it is a small change like declaring
    one of the parameters const.


    There is a reason for the hassle, though, which that it is now possible to separate
    the structure definition and the functions into two files: the header file contains
    the structure definition, and the implementation file, which contains the functions.


    Header files usually have the same name as the implementation file, but with the
    suffix .h instead of .cpp. For the example we have been looking at, the header
    file is called Time.h and it contains the following:


    ```

    struct Time {

    // instance variables

    int hour, minute;

    double second;

    ```'
