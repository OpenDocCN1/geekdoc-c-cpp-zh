  md: 'which is the requirement that formal languages should have simple rules with
    few exceptions, and **convenience**, which is the requirement that programming
    languages are easy to use in practice.


    More than not, convenience wins, which is usually good for expert programmers,
    who are spared from rigorous but unwieldy formalism, but bad for beginning programmers,
    who are often baffled by the complexity of the rules and the number of exceptions.
    In this book I have tried to simplify things by emphasizing the rules and omitting
    many of the exceptions.


    # # 2.10 Composition


    So far we have looked the elements of a programming language—variables, expressions,
    and statements—in isolation, without talking about how to combine them.


    One of the most useful features of programming languages is their ability to make
    small blocks and **compose** them. For example, we know how to multiply integers
    and we know how to output values; it turns out we can do at the same time:


    ```

    cout << 17 * 3;

    ```


    Actually, I shouldn''t say “at the same time,” since in reality the multiplication
    has to happen before the output, but the point is that any expression, involving
    numbers, characters, and variables, can be used inside an output statement. We''ve
    already seen one example:


    ```

    cout << hour*60 + minute << endl;

    ```


    You can also put arbitrary expressions on the right-hand side of an assignment
    statement:


    ```

    int percentage;

    percentage = (minute * 100) / 60;

    ```


    This ability may not seem so impressive now, but we will see other examples where
    composition makes it possible to express complex computations neatly and concisely.


    WARNING: There are limits on where you can use certain expressions; most notably,
    the left hand side of an assignment statement has to be a *variable name*, not
    an expression. That''s because the left side indicates the storage location where
    the result will go. Expressions do not represent storage locations, only values.
    So the following is illegal: `minute+1 = hour;`


    # # 2.11 Glossary


    **variable**: A named storage location for values. All variables have a type,
    which determines values it can store.'
