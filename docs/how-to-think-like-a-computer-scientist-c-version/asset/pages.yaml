  md: "There is now an outer conditional that contains two branches. The first branch\
    \ contains a simple output statement, but the second branch contains another if\
    \ statement, which has two branches of its own. Fortunately, those two branches\
    \ are both output statements, although they could have been conditional statements\
    \ as well.\n\nNotice again that indentation makes the structure apparent, but\
    \ nevertheless, nested conditionals get difficult to read very quickly. In general,\
    \ it is a good idea to avoid them when you can.\n\nOn the other hand, this kind\
    \ of nested structure is common, and we will see it again, so you better get used\
