  md: '# 2.3 VARIABLES


    # 2.3 Variables


    One of the most powerful features of a programming language is the ability to
    manipulate **variables**. A variable is a named location that stores a value.


    Just as there are different types of values (integer, character, etc.), there
    are different types of variables. When you create a new variable, you have to
    declare what type it is. For example, the character type in C++ is called **char**.
    The following statement creates a new variable named **fred** that has type char.


    ```

    char fred;

    ```


    This kind of statement is called **declaration**.


    The type of a variable determines what kind of values it can store. A **char**
    variable can contain characters, and so no surprise that **int** variables can
    store integers.


    There are several types in C++ that can store string values, but we are going
    to skip that for now (Chapter 7).


    To create an integer variable


    ```

    int bob;

    ```


    where bob is the arbitrary name you made up for the variable. In general, you
    will want to make variable names that indicate what you plan to do with the variable.
    For example, if you saw these variable declarations:


    ```

    char firstName = ''a''; // give firstName the value ''a''

    hour = 11;         // assign the value 11 to hour

    minute = 59;      // set minute to 50

    ```


    # 2.4 Assignment


    Now that we have created some variables, we would like to store values in them.

    We do that with an **assignment statement**.


    This example shows three assignments, and the comments show three different ways
    sometimes talk about assignment statements. The vocabulary can be confusing, but
    the idea is straightforward:


    +   * When you declare a variable, you create a named storage location.'
