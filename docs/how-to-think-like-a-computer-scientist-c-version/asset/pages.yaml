  md: "# 10.8. COUNTING\n\nOn my machine the output is\n\n3 6 7 5 3 5 6 2 1 2 7 0\
    \ 9 3 0 6 2 6\n\nwhich is pretty random-looking. Your results may differ.\n\n\
    If these numbers are really random, we expect each digit to appear the same number\
    \ of times—twice each. In fact, the number 6 appears five times, and the numbers\
    \ 4 and 8 never appear at all.\n\nDo these results mean values are not really\
    \ uniform? It's hard to tell. With so few values, the chances are slim that we\
    \ would get exactly what we expect. But as the number of values increases, the\
    \ outcome should be more predictable.\n\nTo test this theory, we will write some\
    \ programs that count the number of times each value appears, and then see what\
    \ happens when we increase numValues.\n\n# 10.8 Counting\n\nA good approach to\
    \ problems like this is to think of simple functions that are easy to write, and\
    \ that turn out to be useful. Then you can combine them into a solution. This\
    \ approach is called bottom-up design. Of course, it is not easy to know which\
    \ functions are likely to be useful, but as you gain experience you will have\
    \ a better idea.\n\nAlso, it is not always obvious what sort of things are easy\
    \ to write, but a good approach is to look for subproblems that fit a pattern\
    \ you have seen before. Back in Section 7.9 we looked at a loop that traversed\
    \ a string and counted the number of times a given letter appeared. You can think\
    \ of this program as an example of a pattern called \"traverse and count\". The\
    \ elements of this pattern are:\n\n+   - A set or counter that can be traversed,\
    \ like a string or a vector.\n\n+   - A test that you can apply to each element\
    \ in the container.\n\n+   - A counter that keeps track of how many elements pass\
    \ the test.\n\nIn this case, I have a function in mind howMany counts the number\
    \ of elements in a vector that equal a given value. The parameters are the vector\
    \ and the integer value to compare. The return value is the number of times the\
    \ value appears.\n\n```\nint howMany(const vector<int>& vec, int value) {\n  int\
    \ count = 0;\n  for (int i=0; i<vec.length(); i++) {\n    if (vec[i] == value)\
    \ count++;\n  }\n  return count;\n}\n```"
  merge: -1
