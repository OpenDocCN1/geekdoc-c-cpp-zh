    \ is to hide implementation details from users or programmers who do not need\
    \ to know them.\n\nFor example, there are many possible representations for a\
    \ Card, including two integers, two strings and two enumerated types. The programmer\
    \ who writes the Card member functions needs to know which implementation to use,\
    \ but using the Card structure should not have to know anything about its internal\
