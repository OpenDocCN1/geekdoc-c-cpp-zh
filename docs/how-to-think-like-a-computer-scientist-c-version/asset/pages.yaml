- pgno: 8
  md: '# # Chapter 1


    # # The way of the program


    The goal of this book is to teach you to think like a computer scientist. I like
    the way computer scientists think because they combine some of the best features
    of Mathematics, Engineering, and Natural Science. Like mathematicians, computer
    scientists use formal languages to denote ideas (specifically computations). Like
    engineers, they design things, assembling components into systems and evaluating
    tradeoffs among alternatives. Like scientists, they observe the behavior of complex
    systems, form hypotheses, and test predictions.


    The single most important skill for a computer scientist is **problem-solving**.
    By that I mean the ability to formulate problems, think creatively about solutions,
    and express a solution clearly and accurately. As it turns out, the process of
    learning is an excellent opportunity to practice problem-solving skills. That''s
    why this chapter is called "The way of the program."


    Of course, the other goal of this book is to prepare you for the Computer Science
    AP Exam. We may not take the most direct approach to that goal, for there are
    not many exercises in this book that are similar to the AP questions. On the other
    hand, if you understand the concepts in this book, along with the details of programming
    in C++, you will have all the tools need to do on the exam.


    # ## 1.1 What is a programming language?


    The programming language you will learn is C++, because that is the language the
    AP is based on, as of 1998. Before that, the exam used Pascal. C++ and Pascal
    are **high-level languages**; other high-level languages you might have heard
    of Java, C and FORTRAN.


    As you might infer from the "high-level language," there are also **low-level
    languages**, sometimes referred to as machine language or assembly language. Loosely-speaking,
    computers can only execute programs written in low-level languages. Thus, programs
    written in a high-level language have to be translated before they can run. This
    translation takes some time, which is a'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# CHAPTER 1. THE WAY OF THE PROGRAM


    small disadvantage of high-level languages.


    But the advantages are enormous. First, it is much easier to program in a high-level
    language; by "easier" I mean that the program takes less time to write, it''s
    shorter and easy to read, and it''s more likely to be correct. Secondly, high-level
    languages are portable, meaning that they can run on different kinds of computers
    with few or no modifications. Low-level programs can only run on one kind of computer,
    and have to be rewritten to run on another.


    Due to these advantages, almost all programs are written in high-level languages.
    Low-level languages are only used for few special applications.


    There are two ways to translate a program; interpreting or compiling. An interpreter
    is a program that reads a high-level program and does what it says. In effect,
    it translates the program line-by-line, alternately reading lines and carrying
    out commands.


    ![](img/22d81c4ccdd9bed9ec5616934dce7c5a_9_0.png)


    A compiler is a program that reads a high-level program and translates it all
    at once, before executing any of the commands. Often you compile the program as
    a separate step, and then execute the compiled code later. In this case, the high-level
    program is called the source code, and the translated program is called the object
    code or the executable.


    As an example, you write a program in C++. You might use a text editor (a simple
    word processor). When the program is finished, you save it in a file named program.cpp
    where "program" is an arbitrary name you make up, and the suffix .cpp is a convention
    that indicates that the file contains C++ source code.


    Then, depending on what your programming environment is, you might leave the text
    editor and run the compiler. The compiler would read your source code, translate
    it, and create a new file program.o to contain the object code, or program.exe
    to contain the executable.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 1.2. WHAT IS A PROGRAM?


    ![](img/22d81c4ccdd9bed9ec5616934dce7c5a_10_0.png)


    The compiler reads the source code... ... and generates object code. You execute
    the program (one way or another)... ... and the result appears on the screen.


    The next step is to run the program, which requires some kind of executor. The
    role of the executor is to load the program (copy it from disk into memory) and
    make the computer start executing the program.


    Although this process may seem complicated, the good news is that in most programming
    environments (sometimes called development environments), you will only have to
    write a program and type a single command to compile and run it. On the other
    hand, it is useful to know what the steps are happening in the background, so
    if something goes wrong you can figure out what it is.


    # 1.2 What is a program?


    A program is a sequence of instructions that specifies how to perform a computation.
    The computation might be something mathematical, solving a system of equations
    or finding the roots of a polynomial, but it can also be a symbolic computation,
    searching and replacing text in a document or (strangely enough) compiling a program.


    The instructions (or commands, or statements) look different in different programming
    languages, but there are a few basic functions that appear in just every language:


    +   **input:** Get data from the keyboard, or a file, or some other device.


    +   **output:** Display data on the screen or save to a file or some other device.


    +   **math:** Perform basic mathematical operations like addition and multiplication.


    +   **testing:** Check for certain conditions and execute the appropriate sequence
    of statements.


    +   **repetition:** Perform action repeatedly, usually with some variation.


    Believe it or not, that''s pretty much all there is to it. Every program you''ve
    ever used, no matter how complicated, is made up of functions that look more or
    less like this. Thus one way to describe programming is the process of breaking
    a large, complex task into smaller and smaller subtasks until eventually the subtasks
    are simple enough to be performed with one of these simple functions.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 1.3 What is debugging?


    Programming is a complex process, and since it is done by human beings, it often
    leads to errors. For whimsical reasons, programming errors are called bugs and
    the process of tracking them down and correcting them is called debugging.


    There are a few different of errors that can occur in a program, and it is useful
    to distinguish them in order to track them down more quickly.


    # 1.3.1 Compile-time errors


    The compiler can only translate a program if the program is syntactically correct;
    otherwise, the compilation fails and you will not be able to run your program.
    Syntax refers to the structure of your program and the rules about that structure.


    For example, in English, a sentence must begin with a capital letter and end with
    a period. This sentence contains a syntax error So does this one


    For most readers, a few syntax errors are not a significant problem, which is
    why we can read the poetry of e cum without spelling error messages.


    Compilers are not unfor. If there is a single syntax error anywhere in your program,
    the compiler will print an error message and quit, and you will not be able to
    run your program.


    To make matters, there are more syntax rules in C++ than there are in English,
    and the error messages you get from the compiler are often not very helpful. During
    the first weeks of your programming career, you will probably spend a lot of time
    tracking syntax errors. As you gain experience, you will make fewer errors and
    find them faster.


    # 1.3.2 Run-time errors


    The second type of error is a run-time error, so-called because the error does
    not appear until you run the program.


    For the simple sorts of programs we will be writing for the few weeks, run-time
    errors are rare, so it is a little before you encounter one.


    # 1.3.3 Logic errors and semantics


    The third type of error is the logical or semantic error. If there is a logical
    error in your program, it will compile and run successfully, in the sense that
    the computer will not generate any error messages, but it will not do the right
    thing. It will do something else. Specifically, it will do what you tell it to
    do.


    The problem is that the program you wrote is not the program you wanted to write.
    The meaning of the program (its semantics) is wrong. Identifying logical errors
    can be tricky, since it requires you to work backwards by looking at the output
    of the program and trying to figure out what it is doing.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 1.4. FORMAL AND NATURAL LANGUAGES


    # 1.3.4 Experimental debugging


    One of the most important skills you should acquire from working with this book
    is debugging. Although it can be frustrating, debugging is one of the most intellectually
    rich, challenging, and interesting parts of programming.


    In some ways debugging is like detective work. You are confronted with clues and
    have to infer the processes and events that lead to the results you see.


    Debugging is also like an experimental science. If you have an idea you modify
    your program and try again. If your hypothesis was correct, you debug the modification,
    and take a step closer to a working program. If your hypothesis was wrong, you
    have to come up with a new one. As Sherlock Holmes pointed out, "When you eliminated
    the impossible, however, must be the truth." (from Conan Doyle''s The Sign of
    Four).


    For some people, programming and debugging are the same. That is, programming
    is the process of gradually debugging a program until it does what you want. The
    idea is that you should always start with a working program that does you something,
    and make small modifications, debugging it as you go, so that you have a working
    program.


    For example, Linux is an operating system that contains thousands of lines of
    code, but it started as a simple program Linus Torvalds used to explore the Intel
    8038 chip. According to Larry Greenfield, "One of Linux''s early projects was
    a program that would switch between AAAA and BBBB. This later evolved into Linux
    (from The Linux Users'' Guide Beta Version 1).


    In later chapters I will make more suggestions about debugging and other programming
    practices.


    # 1.4 Formal and natural languages


    Natural languages are the languages that people speak, like English, Spanish,
    and French. They were not designed by people (although people try to impose order
    on them); they evolved naturally.


    Formal languages are languages that are designed by people for specific applications.
    For example, the notation that mathematicians use is a formal language that is
    particularly good at denoting relationships among numbers and symbols. Chemists
    use a formal language to represent the chemical structure of molecules. And most
    importantly:


    Programming languages are formal languages that have been designed to express
    computations.


    As I mentioned before, formal languages tend to have strict rules about syntax.
    For example, $3+3=6$ is a syntactically correct mathematical statement, but $3=+6$
    is not. Also, $H_2O$ is a syntactically correct chemical name, but $H_2Oz$ is
    not.'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'Syntax rules come in two flavors, pertaining to tokens and structure. Tokens
    are the basic elements of the language, like words and numbers and chemical elements.
    One of the problems with $3+=6$ is that $ is not a legal token in mathematics
    (at least as I know). Similarly, $2Zz$ is not legal because there is no element
    with the abbreviation $Zz$.


    The second type of syntax error pertains to the structure of a statement; that
    is, the way the tokens are arranged. The $3+=6$ is structurally illegal, because
    you can''t have a plus sign immediately after an equals sign. Similarly, nodular
    formulas must have subscripts after the element name, not before.


    When you read a sentence in English or a statement in a formal language, you have
    to figure out what structure of the sentence is (although in a natural language
    you do this unconsciously). This process is called **parsing**.


    For example, when you hear the sentence, "The other shoe fell," you understand
    that "the other shoe" is the subject and "fell" is the verb. Once you have parsed
    a sentence, you can figure out what it means, that is, the semantics of the sentence.
    Assuming that you know what shoe and what it means to fell, you will understand
    the general implication of this sentence.


    Although formal and natural languages have many features in common—tokens, structure
    and semantics—there are many differences.


    **ambiguity:** Natural languages are full of ambiguity, which people deal with
    by using context and other information. Formal languages are designed to be nearly
    or completely unambiguous, which means that any statement has exactly one meaning,
    regardless of context.


    **redundancy:** In order to make up for ambiguity and avoid misunderstandings,
    natural languages employ lots of redundancy. As a result, they are often verbose.
    Formal languages are less redundant and more concise.


    **literalness:** Natural languages are full of idiom and metaphor. If I say, "The
    other shoe fell," there is probably no shoe and nothing falling. Formal languages
    mean exactly what they say.


    People who grow speaking a natural language (everyone) often have a hard time
    adjusting to formal languages. In some ways the difference between formal and
    natural language is the difference between poetry and prose, but so so:


    **Poetry:** Words are used for their sounds as well as for their meaning, and
    the whole poem creates an effect or emotional response. Ambiguity is not only
    common but often deliberate.


    **Prose:** The literal meaning of words is more important than the structure contributes
    more meaning. Prose is more amenable to analysis than poetry, but still often
    ambiguous.


    **Programs:** The meaning of a computer program is unambiguous and literal, and
    can be understood entirely by analysis of the tokens and structure.'
  merge: -1
