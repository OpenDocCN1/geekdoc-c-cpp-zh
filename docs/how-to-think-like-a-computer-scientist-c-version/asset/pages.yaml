  md: "```\nvoid newLine() {\n  cout << endl;\n}\n```\n\n```\nvoid threeLine() {\n\
    \  newLine(); newLine(); newLine();\n}\n```\n\nAlthough this work, they would\
    \ not be much help if I wanted to output 2 newlines, or 106. A better alternative\
    \ would be\n\n```\nvoid nLines(int n) {\n  if (n > 0) {\n    cout << endl;\n \
    \   nLines(n-1);\n  }\n```\n\nThis program is similar to countdown: as long as\
    \ n is greater than zero, it outputs one newline, and then calls itself to output\
    \ n-1 additional newlines. Thus, the total number of newlines is 1 + (n-1), which\
    \ usually comes out to roughly n.\n\nThe process of a function calling itself\
    \ is called recursion, and such functions are said to be recursive.\n\n# 4.8 Infinite\
    \ recursion\n\nIn the examples of the previous section, notice that each time\
    \ the functions get recursively, the argument gets smaller by one, so eventually\
    \ it gets to zero. When the argument is zero, the function returns immediately,\
    \ without making any recursive calls. This case—when the function completes without\
    \ making a recursive call—is called the base case.\n\nIf a recursion reaches a\
