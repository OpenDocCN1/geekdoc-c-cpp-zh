  md: "# 8.7. CALL BY REFERENCE\n\nIf pinMode happened to change one of the instance\
    \ variables of p, it would have no effect on blank. Of course, there is no reason\
    \ for pinMode to modify its parameter, so this isolation between the two functions\
    \ is appropriate.\nThis kind of parameter-passing is called “pass by value” because\
    \ it is the value of the structure (or other type) that gets passed to the function.\n\
    \n# 8.7 Call by reference\n\nAn alternative parameter-passing mechanism that is\
    \ available in C++ is called “pass by reference.” This mechanism makes it possible\
    \ to pass a structure to the procedure and modify it.\nFor example, you can reflect\
    \ a point around the 45-degree line by swapping the two coordinates. The most\
    \ obvious (but incorrect) to write a reflect function like this:\n\n```\nvoid\
    \ reflect (Point p)      // WRONG !!\n{\n    double temp = p.x;\n    p.x = p.y;\n\
    \    p.y = temp;\n}\n```\n\nBut this won't work, because the changes we make in\
    \ reflect will have no effect on the caller.\nInstead, we have to specify that\
    \ we want to pass the parameter by reference. We do that by adding an ampersand\
    \ (&) to the parameter declaration:\n\n```\nvoid reflect (Point &p)\n{\n    double\
    \ temp = p.x;\n    p.x = p.y;\n    p.y = temp;\n}\n```\n\nNow we can call the\
    \ function in the usual way:\n\n```\nprintPoint (blank);\nreflect (blank);\nprintPoint\
    \ (blank);\n```\n\nThe output of this program is as expected:\n\n(3, 4)\n(4, 3)"
