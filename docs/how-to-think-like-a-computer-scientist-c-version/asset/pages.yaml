    \ (mostly), but shortsighted. Soon thereafter computers and calculators were so\
    \ pervasive that the tables became obsolete.\n\nWell, almost. It turns out that\
    \ for some operations, computers use tables of values to get an approximate answer,\
    \ and then perform computations to improve the approximation. In some cases, there\
    \ have been errors in the underlying tables, most famously in the original Intel\
    \ Pentium to perform floating-point division.\n\nAlthough a “log table” is not\
    \ as useful as it was once, it still makes a good example of iteration. The following\
    \ program outputs a sequence of values in the left column and their logarithms\
    \ in the right column:\n\n```\ndouble x = 1.0;\nwhile (x < 10.0) {\n    cout <<\
    \ x << \" \\t\" << log(x) << \" \\n\";\n    x = x + 1.0;\n}\n```\n\nThe sequence\
    \ \\t represents a tab character. The sequence \\n represents a new line character.\
    \ These sequences can be anywhere in a string, although in these examples the\
    \ cursor will shift to the right until it reaches one of a minute, tabs which\
    \ are normally every eight characters. As we will see in a minute, tabs are useful\
    \ for making columns of text line up.\n\nA newline character has exactly the same\
    \ effect as endl; it causes the cursor to move to the next line. Usually if a\
    \ newline character appears by itself, I use \\n, but if it appears part of a\
