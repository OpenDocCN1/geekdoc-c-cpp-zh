  md: 'because the variable on the left is an int and the value on the right is a
    double. But it is easy to forget this rule, especially because there are places
    where C++ automatically converts from one type to another. for example,


    ```

    double y = 1;

    ```


    should not be legal, but C++ allows it by converting the int to a double automatically.
    This leni is convenient, but it can cause problems; for example:


    ```

    double y = 1 / 3;

    ```


    You might expect the variable y to be given the value 0.333333, which is a legal
    floating-point value, but in fact it will get the value 0.0. The reason is that
    the expression appears to be the ratio of two integers, so C++ does integer division,
    which yields the integer value 0. Con to floating-point, the result is 0.0.


    One way to solve this problem (once you figure out it) is to make the right-hand
    side a floating-point expression:


    ```

    double y = 1.0 / 3.0;

    ```


    This sets y to 0.333333, as expected.


    All the operations we have seen—addition, subtraction, multiplication, and division—on
    floating-point values, although you might be interested to knowing that the underlying
    mechanism is completely different. In fact, processors have special hardware just
    for performing floating-point operations.


    # 3.2 Converting from double to int


    As mentioned, C++ converts ints to doubles automatically if necessary, because
    no information is lost in the translation. On the other hand, going from a double
    to an int requires rounding off. C++ doesn''t perform this operation automatically,
    in order to make sure that you, the programmer, are aware of the loss of the fractional
    part of the number.


    The simplest way to convert a floating-point value to an integer is to use a typecast.
    Typecasting is so called because it allows you to take a value that belongs to
    one type and "cast" it into another (in the sense of molding or reforming).


    The syntax for typecasting is like the syntax for a function call. For example:


    ```

    double pi = 3.14159;

    int x = int(pi);

    ```


    The function returns an integer, so x gets the value 3. Converting to an integer
    always rounds down, even if the fraction part is 0.999999999.


    For every type, there is a corresponding function that typecasts its argument
    to the appropriate type.'
