  md: "60\n\nCHAPTER 6. ITERATION\n\n+   - Functions facilitate both recursion and\
    \ iteration.\n\n+   - Well-designed functions are often useful for many programs.\
    \ Once you write and debug it once, you can reuse it.\n\n# 6.8 More encapsulation\n\
    \nTo demonstrate encapsulation again, I'll take the code from the previous section\
    \ and wrap it up in a function:\n\n```\nvoid printMultTable () {\nint i = 1;\n\
    while (i <= 6) {\n  printMultiples (i);\n  i = i + 1;\n}\n}\n```\n\nThe process\
    \ I am demonstrating a common development plan. You develop code gradually by\
    \ adding lines to main or someplace else, and then when you get it working, you\
    \ extract it and wrap it up in a function.\n\nThe reason this is useful is that\
    \ sometimes you don't know when to start writing exactly how to develop the program\
    \ into functions. This approach lets you design as you go along.\n\n# 6.9 Local\
    \ variables\n\nAbout this, you might be wondering how we can use the same variable\
    \ i in printMultiples and printMultTable. Didn't I say that you can only declare\
    \ a variable once? And doesn't it cause problems when one of the functions changes\
    \ the value of the variable?\n\nThe answer to both is \"no\", because the i in\
    \ printMultiples and i in printMultTable are not the same variable. They have\
    \ the same name, but they do not refer to the same storage location, and changing\
    \ the value of one of them has no effect on the other.\n\nRemember that variables\
    \ that are declared inside a function definition are local. You cannot access\
    \ a local variable from outside its \"home\" function, and you are free to have\
    \ multiple variables with the same name, as long as they are not in the same function.\n\
    \nThe stack diagram for this program shows clearly that the two variables named\
    \ i are not in the same storage location. They can have different values, and\
    \ changing one does not affect the other."
