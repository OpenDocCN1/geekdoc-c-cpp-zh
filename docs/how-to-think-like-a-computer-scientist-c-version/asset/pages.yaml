  md: '# 13.2. SWITCH STATEMENT


    ```

    switch (symbol) {

    case ''+'';

    perform_addition();

    break;

    case ''*'';

    perform_multiplication();

    break;

    default:

    cout << "I only know how to perform addition and multiplication" << endl;

    break;

    ```


    This switch statement is equivalent to the following chained conditional:


    ```

    if (symbol == ''+'') {

    perform_addition();

    } else if (symbol == ''*'') {

    perform_multiplication();

    } else {

    cout << "I only know how to perform addition and multiplication" << endl;

    ```


    The break statements are necessary in each branch in a switch statement because
    otherwise the flow of execution "falls through" to the next case. Without the
    break statements, the symbol + would make the perform addition, and then perform
    multiplication, and then print the error message. Occasionally this feature is
    useful, but most of the time it is a source of errors when people forget the break
    statements.


    +   - switch statements work with integers, characters, and enumerated types.

    - For example, to convert a Suit to the corresponding string, we could use some
    like:


    ```

    switch (suit) {

    case CLUBS: return "Clubs";

    case DIAMONDS: return "Diamonds";

    case HEARTS: return "Hearts";

    case SPADES: return "Spades";

    default: return "Not a valid suit";

    }

    ```


    In this case we not need break statements because the return statements cause
    the flow of execution to return to the caller instead of falling through to the
    next case.


    In general it is good style to include a default case in every switch statement,
    to handle errors or unexpected values.'
