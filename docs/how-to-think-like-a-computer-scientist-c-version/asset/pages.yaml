    One advantage of this approach is that the caller has the option of reusing the
    same object repeated to perform a series of additions. This can be slightly more
    efficient, although it can be confusing enough to cause subtle errors. For the
    vast majority of programming, it is worth spending a long run time to avoid a
    lot of debugging time.


    Notice that the first two parameters can be declared const, but the third cannot.


    # 9.8 Which is best?


    Anything that can be done with modifiers and fill-ins can also be done with pure
    functions. In fact, there are programming languages, called functional programming
    languages, that only allow pure functions. faster to develop and less error-prone
    than programs that use modifiers. Nevertheless, there are times when modifiers
    are convenient, and cases where functional programs are less efficient.


    In general, I recommend that you write pure functions whenever it is reasonable
    to do so, and resort to modifiers only if there is a compelling advantage. This
    approach might be called a functional programming style.


    # 9.9 Incremental development versus planning


    In this chapter I have demonstrated an approach to program development I refer
    to as rapid prototyping with iterative improvement. In each case, I wrote a rough
    draft (or prototype) that performed the basic calculation, and tested it on a
    few cases, correcting flaws as I found them.


    Although this approach can lead to code that is unnecessarily complicated—since
    it deals with many special cases— and unreliable—since it is hard to know if you
    have found all the errors.'
