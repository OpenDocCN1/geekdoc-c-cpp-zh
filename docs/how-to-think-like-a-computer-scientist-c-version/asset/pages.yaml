    # 12.3 The printCard function


    When you create a new type, the first step is usually to declare the instance
    variables and write constructors. The second step is often to write a function
    that prints the object in human-readable format.


    In the case of Card objects, "human-readable" means that we have to map the internal
    representation of the rank and suit onto words. A natural way to do that is with
    a vector of apstrings. You can create a vector of apstrings the same way you create
    for another vector of types:


    ```

    apvector<apstrings> suits (4);

    ```


    Of course, in order to use vectors and apstrings, you will have to include the
    header files for both!


    To initialize the elements of the vector, we can use a series of assignment statements.


    ```

    suits[0] = "Clubs";nsuits[1] = "Diamonds";nsuits[2] = "Hearts";nsuits[3] = "Spades";

    ```


    A state diagram for this vector looks like:


    > ^apvectors are a little different from apstrings contains a template that allows
    the compiler to create vectors of various kinds. The first time you use a vector
    of integers, the compiler generates code to support that kind of vector. If you
    use a vector of apstrings, the compiler generates different code to handle that
    kind of vector. As a result, it is usually sufficient to include the header file
    apvector.h, you do not have to compile apvector.cpp at all! Unfortunately, if
    you do, you are likely to get a long stream of error messages. This footnote helps
    you avoid an unpleasant surprise, but the details in your development environment
    may vary.'
