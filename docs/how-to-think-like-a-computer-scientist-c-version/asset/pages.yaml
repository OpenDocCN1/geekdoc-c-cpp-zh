  md: "# 10.5. RANDOM NUMBERS\n\nwe expect the same calculation to yield the same\
    \ result. For some applications, though, we would like the computer to be unpredictable.\
    \ Games are an obvious example.\n\nMaking a program nondeterministic turns out\
    \ to be not so easy, though there are ways to make it at least nondeterministic.\
    \ One of them is to generate pseudorandom numbers and use them to determine the\
    \ outcome of the program. Pseudorandom numbers are not truly random in the mathematical\
    \ sense, but for our purposes, they will.\n\nC++ provides a functional library\
    \ for random that generates pseudorandom numbers. It is declared in the header\
    \ file stdlib.h, which contains a variety of \"standard library\" functions, hence\
    \ the name.\n\nThe return value of random is an integer between 0 and RAND_MAX,\
    \ where RAND_MAX is a large (about 2 billion on my computer) also defined in the\
    \ header file. Each time you call random you get a different randomly-generated\
    \ number. To sample a sample, run this:\n\n```\nfor (int i = 0; i < 4; i++) {\n\
    \    int x = random();\n    cout << x << endl;\n}\n```\n\nOn my machine I got\
    \ the following output:\n\n180428933\n846930886\n1681692777\n1714363915\n\nYou\
    \ will probably get something similar, but different, on yours. More often we\
    \ want to generate integers between 0 and some upper bound. A simple way to do\
    \ that is by using the modulus operator. For example:\n\n```\nint x = random();\n\
    int y = x % upperBound;\n```\n\nSince y is the remainder when x is divided by\
    \ upperBound, the only possible values for y are between 0 and upperBound - 1,\
    \ including both end points. Keep in mind, that y will never be equal to upperBound.\n\
    \nIt is also frequently useful to generate random floating-point values. A common\
    \ way to do that is by dividing by RAND_MAX. For example:\n\n```\nint x = random();\n\
    double y = double(x) / RAND_MAX;\n```\n\nThis code sets y to a random value between\
    \ 0.0 and 1.0, including both end points. As an exercise, you might want to think\
    \ about how to generate a random floating-point value in a given range, for example,\
    \ between 100.0 and 200.0."
