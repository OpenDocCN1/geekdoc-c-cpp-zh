  md: "# 10.9 Checking the other values\n\nhowMany only counts the occurrences of\
    \ a particular value, and we are interested in seeing how many times each value\
    \ appears. We can solve that problem with a loop:\n\n```\nint numValues = 20;\n\
    int upperBound = 10;\napvectorctor<int> vector = randomVector(numValues, upperBound);\n\
    \nout << \"value:\" << howMany;\\n\nfor (int i = 0; i < upperBound; i++) {\n \
    \   cout << i << '\\t' << howMany(vector, i) << endl;\n}\n```\n\nNotice that it\
    \ is hard to declare a variable inside a for statement. This syntax is sometimes\
