- pgno: 173
  md: "# CHAPTER 15. FILE INPUT/OUTPUT AND APMATRIXES\n\n```\n{\n  if (i < numElements)\
    \ {\n    return elements[i];\n  } else {\n    cout << \"Set index out of range.\"\
    \ << endl;\n    exit (1);\n  }\n}\n```\n\ngetElement gets an index that is out\
    \ of range, it prints an error message (not the most useful, I admit), and exits.\n\
    The functions are find and add. By now, the pattern for traversing and searching\
    \ should be old hat:\n\n```\nint Set::find (const apstring& s) const {\n  for\
    \ (int i=0; i<numElements; i++) {\n    if (elements[i] == s) return i;\n  }\n\
    \  return -1;\n}\n```\n\nSo that leaves us with add. Often the return type for\
    \ something like add would void, in this case it might be useful to return the\
    \ index of the element.\n\n```\nint Set::add (const apstring& s) {\n  // if the\
    \ element is already in the set, return its index\n  int index = find(s);\n  if\
    \ (index == -1) return index;\n\n  // if the avector is full, double its size\n\
    \  if (numElements == elements.length()) {\n    elements.resize(elements.length()\
    \ * 2);\n  }\n```\n\n```\n// add the new elements and return its index\nindex\
    \ = numElements;\nelements[index] = s;\nnumElements++;\nreturn index;\n```\n\n\
    The tricky thing here is that numElements is used in two ways. It is the number\
    \ of elements in the set, of course, but it is also the index of the next element\
    \ to be added."
