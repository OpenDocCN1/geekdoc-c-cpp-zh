  md: "# 15.6. THE SET DATA STRUCTURE\n\n```\nclass Set {\nprivate:\n apvector<apstring>\
    \ elements;\n int numElements;\n\npublic:\n Set(int n);\n\n int getNumElements()\
    \ const;\n apstring getElement(int i) const;\n int find(const apstring& s) const;\n\
    \ int add (const apstring& s);\n}\n```\n\n```\nSet::Set(int n)\n{\n apvector<apstring>\
    \ temp(n);\n elements = temp;\n numElements = 0;\n}\n```\n\nThe instance variables\
    \ are an apvector of strings and an integer that keeps track of how many elements\
    \ there are in the set. Keep in mind that the number of elements in the set, numElements,\
    \ is not the same as the size of the apvector. Usually it will be smaller.\n\n\
    The Set constructor takes a single parameter, which is the initial size of the\
    \ apvector. The initial number of elements is always zero.\numElements and getElement\
    \ are accessor functions for the instance variables, which are private. numElements\
    \ is a read-only variable, so we provide a get function but not set function.\n\
    \n```\nint Set::getNumElements() const\n{\n return numElements;\n}\n```\n\nWhy\
    \ do we prevent client programs from changing getNumElements? What are the invariants\
    \ for this type, and how could a client program break an invariant? We look at\
    \ the rest of the Set member function, see if you can convince yourself that they\
    \ maintain the invariants.\n\nWhen we use the operator to access the apvector,\
    \ it checks to make sure the index is greater or equal to zero and less than the\
    \ length of the apvector. To access the elements of a set, though, we need to\
    \ check a stronger condition. The index has to be less than the number of elements,\
    \ which might be smaller than the length of the apvector.\n\n```\napstring Set::getElement(int\
    \ i) const\n```"
