  md: "# 12.10 Decks and subdecks\n\nLooking at the interface to findBisect\n\n```\n\
    int findBisect(const Card& card, const vector<Card>& deck,\n    int low, int high)\
    \ {\n```\n\nit might make sense to treat three of the parameters, deck, low and\
    \ high, as a single parameter that specifies a subdeck.\n\nThis kind of thing\
    \ is quite common, and I sometimes think of it as an abstract parameter. What\
    \ I mean by \"abstract,\" is something that is not literally part of the program\
    \ text, but which describes the function of the program at a higher level.\n\n\
    For example, when you call a function and pass a vector and a bounds from low\
    \ and high, there is nothing that prevents the called function from accessing\
    \ parts of the vector that are out of bounds. So you are not literally sending\
    \ a subset of the deck; you are really sending the whole. But as long as the recipient\
    \ plays by the rules, it makes sense to think of it, absolutely, as a subdeck.\n\
    \nThere is one other example of this kind of abstraction that you might have noticed\
    \ in Section 9.3, when I referred to an \"empty\" data structure. The reason I\
    \ put \"empty\" in quotation marks was that it is not literally accurate. All\
    \ variables have values all the time. When you create them, they are given default\
    \ values. There is no such thing as an empty object.\n\nBut if the program guarantees\
    \ the current value of a variable is never read before it is written, then the\
    \ current value is irrelevant. Absolutely, it makes sense to think of a variable\
    \ as \"empty\".\n\nThis kind of thinking, which a program comes to at by meaning\
    \ what is literally encoded, is a very important part of thinking like a computer\
    \ scientist. Sometimes, the word \"abstract\" gets so used and in so many contexts\
    \ that it is hard to interpret. Nevertheless, abstraction is a central idea in\
    \ computer science (as well as other fields).\n\nA more general definition of\
    \ \"abstraction\" is \"The process of modeling a complex system with a simplified\
    \ description in order to suppress unnecessary details while capturing relevant\
