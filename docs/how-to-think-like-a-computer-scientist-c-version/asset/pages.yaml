  md: "An alternative is to use integers to encode the ranks and the suits. By \"\
    encode,\" I do not mean some people think, which is to encrypt, or translate a\
    \ secret code. What a computer scientist means by \"encode\" is something like\
    \ \"define a mapping between a sequence of numbers and the things I want to represent.\"\
    \ For example,\n\n+   - Spades \rightarrow 3\n- Hearts \rightarrow 2\n- Diamonds\
    \ \rightarrow 1\n- Clubs \rightarrow 0\n\nThe symbol is mathematical notation\
    \ for \"maps to.\" The obvious feature of this mapping is that the suits maps\
    \ to integers in order, so we can compare suits by comparing integers. The mapping\
    \ for ranks is fairly obvious; each of the numerical ranks maps to the corresponding\
    \ integer, and for face cards:\n\n+   - Jack \rightarrow 11\n- Queen \rightarrow\
    \ 12\n- King \rightarrow 13\n\nThe reason I use mathematical notation for these\
    \ mappings is that they are not part of the C++ program. They are part of the\
    \ program design, but they never appear explicitly in the code. The class definition\
    \ for the Card looks like this:\n\n```\nstruct Card {\n    int suit, rank;\n\n\
    \    Card ();\n    Card(int s, int r);\n}\n\nCard::Card() {\n    suit = 0; rank\
    \ = 0;\n}\n\nCard::Card(int s, int r) {\n    suit = s; rank = r;\n}\n```\n\nThere\
    \ are two constructors for Cards. You can tell that they are constructors because\
    \ they have no return type and their name is the same as the structure. The first\
    \ constructor takes no arguments and initializes the instance variables to a useless\
    \ value (the zero of clubs).\n\nThe second constructor is more useful. It takes\
    \ two parameters, the suit and rank of the card."
