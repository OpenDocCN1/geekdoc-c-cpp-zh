  md: "# 6.5 Two-dimensional tables\n\nA two-dimensional table is a table where you\
    \ choose a row and a column and read the value at the intersection. A multiplication\
    \ table is a good example.\nLet's say you wanted to print a multiplication table\
    \ for the values from 1 to 6.\nA good way to start is to write a simple loop that\
    \ prints the multiples of 2, all on one line.\n\n```\nint i = 1;\nwhile (i <=\
    \ 6) {\n    cout << 2*i << \" \";\n    i = i + 1;\n}\n```\n\nThe first line initializes\
    \ a variable i, which is going to act as a counter, or loop variable. As the loop\
    \ executes, the value of i increases from 1 to 6, and when i is 7, the loop terminates.\
    \ Each time through the loop, print the value 2*i followed by three spaces. By\
    \ omitting the endl from the first output statement, we get all the output on\
    \ a single line.\nThe output of this program is:\n\n2 4 6 8 10 12\n\nSo, far so\
    \ good. The next step is to encapsulate and generalize.\n\n# 6.6 Encapsulation\
    \ and generalization\n\nEncapsulation usually means taking a piece of code and\
    \ wrapping it up in a function, allowing you to take advantage of all the things\
    \ functions are good for. We have seen two examples of encapsulation, we wrote\
    \ printParity in Section 4.3 and isSingleDigit in Section 5.8.\n\nGeneralization\
    \ means taking something specific, like printing multiples of 2, and making it\
    \ more general, like printing the multiples of any integer.\n\nHere's a function\
    \ that encapsulates the loop from the previous section and generalizes it to print\
    \ multiples of n.\n\n```\nvoid printMultiples(int n) {\n    int i = 1;\n    while\
    \ (i <= 6) {\n        cout << n*i << \" \";\n        i = i + 1;\n    }\n}\n```"
