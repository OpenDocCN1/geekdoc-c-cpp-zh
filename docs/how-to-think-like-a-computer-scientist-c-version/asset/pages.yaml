    \ the execution of a function you reach the end. One way to use it is if you detect\
    \ an error condition:\n\n```\n#include <math.h>\n\nvoid printLogarithm(double\
    \ x) {\n    if (x <= 0.0) {\n        cout << \"Positive numbers only, please.\"\
    \ << endl;\n        return;\n    }\n\n    double result = log(x);\n    cout <<\
    \ \"The log of x is \" << result;\n}\n```\n\nThis defines a function named printLogarithm\
    \ that takes a double x as a parameter. The first thing it does is check whether\
    \ x is less than equal to zero, in which case it displays an error message and\
    \ uses return to exit the function. The flow of execution immediately returns\
    \ to the caller and the remaining lines of the function are not executed.\n\n\
    I used a floating-point variable on the right side of the condition because there\
    \ is a floating-point variable on the left.\n\nRemember that any time you want\
    \ to use one function from the math library, you have to include the header file\
    \ math.h.\n\n# 4.7 Recursion\n\nI mentioned in the last chapter that it is legal\
