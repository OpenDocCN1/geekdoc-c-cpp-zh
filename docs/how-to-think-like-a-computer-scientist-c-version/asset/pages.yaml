  md: "# Chapter 13\n\n# Objects of Vectors\n\n# 13.1 Enumerated types\n\nIn the previous\
    \ chapter I talked about mappings between real-world values like rank and suit,\
    \ and internal representations like integers and strings. Although we created\
    \ a mapping between ranks and integers, and between suits and integers, I pointed\
    \ out that the mapping itself does not appear as part of the program.\n\nActually,\
    \ C++ provides a feature called **enumerated type** that makes it possible to\
    \ (1) include a mapping as part of the program, and (2) define the set of values\
    \ that make up the mapping. For example, here is the definition of the enumerated\
    \ types Suit and **Rank**:\n\n```\nenum Suit { CLUBS, DIAMONDS, HEARTS, SPADES\
    \ };\n```\n\n```\nenum Rank { ACE=1, TWO, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT,\
    \ NINE, TEN, JACK, QUEEN, KING };\n```\n\nBy default, the first value in the enumerated\
    \ type maps to 0, the second to 1, and so on. In the Suit type, the value CLUBS\
    \ is represented by the integer 0, DIAMONDS is represented by 1, etc.\n\nThe definition\
    \ of **Rank** overrides the default mapping and specifies that ACE should be represented\
    \ by the integer 1. The other values follow in the usual way.\n\nOnce we have\
    \ defined these types, we can use them anywhere. For example, the instance **rank**\
    \ and **suit** can be declared with type **Rank**:\n\n```\nstruct\nCard {\n  \
    \  Rank rank;\n    Suit suit;\n};\n```"
