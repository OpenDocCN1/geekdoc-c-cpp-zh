  md: 'It takes a minute to convince yourself that that works, but consider this:

    when the number of elements is zero, the index of the next element is 0. When

    the number of elements is equal to the length of the apvector, it means that

    the vector is full, and we have to allocate more space (resize) before we

    add the new element.


    Here is a state diagram showing a Set that initially contains space

    for 2 elements.


    | numElements: 0 | numElements: 1 | numElements: 3 |

    | --- | --- | --- |

    | elements: | elements: | elements: |

    | 0 | "element1" | 0 "element1" |

    | | | 1 "element2" |

    | | | 2 "element3" |


    Now we can use the Set class to keep track of the cities we find in the file.

    Main we create the Set with an initial size of 2:


    Set cities (2);


    Then in processLine add both cities to the Set and store the index that

    gets returned.


    ```

    int index1 = cities.add(city1);

    int index2 = cities.add(city2);

    ```


    I modified processLine to take the cities object as a second parameter.


    # 15.7 apmatrix


    An apmatrix is similar to an apvector except it is two-dimensional. Instead of

    a length, it has two dimensions, called numrows and numcols, for "number of

    row" and "number of columns."


    Each element in the matrix is identified by two indices; one specifies the

    row number, the other the column number.


    To create a matrix, there are four constructors:


    ```

    apmatrix<char> m1;

    apmatrix<int> m2 (3, 4);

    apmatrix<double> m3 (rows, cols, 0.0);

    apmatrix<double> m4 (m3);

    ```'
