    This figure shows a stack diagram for countdown, called with n = 3:


    | | main |

    |---|---|

    | n: | 3 | countdown |

    | n: | 2 | countdown |

    | n: | 1 | countdown |

    | n: | 0 | countdown |


    There is one instance of main and four instances of countdown, each with a different
    value for the parameter n. The bottom of the stack, countdown with n=0 is the
    base case. It does not make a recursive call, so there are no more instances of
    countdown.

