  md: '# 13.9 SHUFFLING AND DEALING


    # 13.9 Shuffling and dealing


    In Section 13.6 I wrote pseudocode for a shuffling algorithm. Assuming that we
    have a function called shuffleDeck that takes a deck as an argument and shuffles
    it, we can create and shuffle a deck:


    ```

    Deck deck; // create a standard 52-card deck

    deck.shuffle(); // shuffle it

    ```


    Then, to deal with several hands, we can use subdeck:


    ```

    Deck hand1 = deck.subdeck(0, 4);

    Deck hand2 = deck.subdeck(5, 9);

    Deck pack = deck.subdeck(10, 51);

    ```


    This code puts 5 cards in one hand, the next 5 cards in the other, and the rest
    into the pack


    When you thought about dealing, did you think we should give out one card at a
    time to player in the round-robin style that is common in real card games? I thought
    about it is unnecessary for a computer program. The round-robin convention is
    intended to mitigate imperfect shuffling and to make it more difficult for the
    dealer to cheat. Neither of these is an issue for a computer


    This example is a useful reminder of the dangers of engineering metaphors: sometimes
    we impose restrictions on computers that are unnecessary, or capabilities that
    are lacking, because we unintentionally extend a metaphor past its breaking point.
    Beware of misleading analogies.


    # 13.10 Mergesort


    In Section 13.7, we saw a simple sorting algorithm that turns out to be very efficient.
    In order to sort n items it has to traverse the n times, and each traversal takes
    an amount of time that is proportional to n. The total time, is proportional to
    n^2.


    In this section I will show a more efficient algorithm called mergesort. To sort
    n items, mergesort takes proportional to n log n. That may not seem impressive,
    but as n gets big, the difference between n^2 and n log n can be enormous. Try
    out a few values of n and see.


    The basic idea behind mergesort is this: if you have two subdecks, of which has
    been sorted, it is easy (and fast) to merge them into a single, sorted deck. Try
    this with a deck of cards:


    +   1. Form two subdecks with about 10 cards each sort them so that when they
    face up the lowest cards are on top. Place both decks up in front of you.'
