  md: "# # Chapter 8\n\n# # Structures\n\n# ## 8.1 Compound values\n\nMost of the\
    \ data types we have been working with represent a single value —an integer, a\
    \ floating-point number, a boolean value. **apstrings** are different in the sense\
    \ that they are made up of smaller pieces, the characters. Thus, **apstrings**\
    \ are an example of a **compound** type.\n\nDepending on what we are doing, we\
    \ may want to treat a compound type as a single thing (or object), or we may want\
    \ to access its parts (or instance variables). This ambiguity is useful.\n\nIt\
    \ is also useful to create your own compound values. C++ provides two mechanisms\
    \ for doing that: **structures** and **classes**. We will start out with structures\
    \ and get to classes in Chapter 14 (there is not much difference between them).\n\
    \n# ## 8.2 Point objects\n\nAs a simple example of a compound structure, consider\
    \ the concept of a mathematical point. At one level, a point is two numbers (coordinates)\
    \ that we treat collectively as a single object. In mathematical notation, points\
    \ are often written in parentheses, with a comma separating the coordinates. For\
    \ example, (0,0) indicates the origin, and $(x, y)$ indicates the point $x$ units\
    \ to the right and $y$ units up from the origin.\n\nA natural way to represent\
    \ a point in C++ is with two **doubles**. The question, then, is how to group\
    \ these two values into a compound object, or structure. The answer is a **struct**\
    \ definition:\n\n```\n```cpp\nstruct Point {\n    double x, y;\n};\n```\n```"
