    # 5.1 Return values


    Some of the built-in functions we have used, like the math functions, have produced
    results. That is, the effect of calling the function is to generate a new value,
    which we usually assign to a variable or as part of an expression. For example:


    ```

    double e = exp (1.0);

    double height = radius * sin (angle);

    ```


    But so far all the functions we have written have been void functions; that is,
    functions that return no value. When you call a void function, it is typically
    on a line by itself, with no assignment:


