    # 2.6 Keywords


    A few seconds ago, I said that you can make up any name you want for your variables,
    but that''s not quite true. There are certain words that are reserved by the compiler
    to parse the structure of your program, and if you use them as variable names,
    it will get confused. These words, keywords, include int, char, var, endl and
    many more.


    The complete list of keywords is included in the C++ Standard, which is the official
    language definition adopted by the International Organization for Standardization
    (ISO) on September 1, 1998. You can download a copy electronically from


    http://www.ansi.org/


