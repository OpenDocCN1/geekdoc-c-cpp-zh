    \ ways to index a vector is with a loop variable. For example:\n\n```\nint i =\
    \ 0;\nwhile (i < 4) {\n  cout << count[i] << endl;\n  i++;\n}\n```\n\nThis loop\
    \ counts from 0 to 4; when the loop variable i is 4, the condition fails and the\
    \ loop terminates. Thus, the body of the loop is only executed when i is 0, 1,\
    \ 2 and 3.\n\nEach time through the loop we use i as an index into the vector,\
    \ outputting the ith element. This type of vector traversal is very common. Vectors\
    \ and loops go together like beans and a nice Chianti.\n\n# 10.2 Copying vectors\n\
    \nThere is one constructor for avector, which is called a copy constructor because\
    \ it takes one avector as an argument and creates a new vector that is the same\
    \ size, with the same elements.\n\n```\navector<int> copy(count);\n```\n\nAlthough\
    \ this syntax is legal, it is almost never used for avectors there is a better\
    \ alternative:\n\n```\navector<int> copy = count;\n```\n\nThe = operator works\
