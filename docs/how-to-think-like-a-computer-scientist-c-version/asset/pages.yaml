    # 12.9 Bisection search


    If the cards in the deck are not in order, there is no way to search that is faster
    than the linear search. We have to look at every card, since otherwise there is
    no way to be certain the card we want is not.


    But when you look for a word in a dictionary, you don''t search linearly through
    every word. The reason is that the words are in alphabetical order. As a result,
    you probably use an algorithm that is similar to similar to a bisection search:


    +   1. Start in the middle somewhere.

    2. Choose a word on the page and compare it to the word you are looking for.

    3. If you found the word you are looking for, stop.

    4. If the word you are looking for comes after the word on the page, flip to somewhere
    later in the dictionary and go to step 2.

    5. If the word you are looking for comes before the word on the page, flip to
    somewhere earlier in the dictionary and go to step 2.


    If you get to the point where there are two adjacent words on the page and your
    word between them, you can conclude that your word is not in the dictionary. The
    only alternative is that your word has been missed somewhere, but that contradicts
    our assumption that the words are in alphabetical order.


    In the case of a deck of cards, if we know that the cards are in order, we can
    write a version of find that is much faster. The best way to write a bisection
    search is with a recursive function. That''s bisection is naturally recursive.


    The trick is to write a function called findbisect that takes two indices as parameters,
    low and high, indicating the segment of the vector that should be searched (including
    both low and high).


    +   1. To search the vector, choose an index between low and high, and call it
    mid. Compare the card at mid to the card you are looking for.'
