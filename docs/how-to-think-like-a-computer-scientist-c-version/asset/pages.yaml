  md: "For example, I have a file called distances that contains information out\n\
    t distances between major cities in the United States. I got this information\n\
    from a randomly-chosen web page\n\n```\nhttp://www.jaring.my/usel/distance.html\n\
    ```\n\nso it may be wildly inaccurate, that doesn't matter. The format of the\
    \ file\nlooks like this:\n\n| \"Atlanta\" | \"Chicago\" | 700 |\n| \"Atlanta\"\
    \ | \"Boston\" | 1,100 |\n| \"Atlanta\" | \"Chicago\" | 700 |\n| \"Dallas\" |\
    \ 800 |\n| \"Atlanta\" | \"Denver\" | 1,450 |\n| \"Atlanta\" | \"Detroit\" | 750\
    \ |\n| \"Atlanta\" | \"Orlando\" | 400 |\n\nBy searching for the quotation marks\
    \ in a line of input, we can find\n beginning and end of each city name. Searching\
    \ for special characters like\npotation marks can be a bit awkward, though, because\
    \ the quotation mark\nis a special character in C++, to identify string values.\n\
    \nIf we want to find the first appearance of a quotation mark, we have to write\n\
    some like this:\n\n```\nint index = line.find(\\'\");\n```\n\nThe argument here\
    \ looks like a mess, but it represents a single character, a\ndouble quotation\
    \ mark. The outermost single-quotes indicates that this is a\nvalue, as usual.\
    \ The backslash (\\) indicates that we want to treat\nt character literally. The\
    \ sequence \\\\' represents a quotation mark; the\n\\' represents a single-quote.\
    \ Interestingly, the sequence \\ represents\na single backslash. The first backslash\
    \ indicates that we should take the second\nbackslash seriously.\n\nParsing input\
    \ consists of finding the beginning and end of each city\nname using the substr\
    \ function to extract the cities and distance. substr\nis an astrping function;\
    \ it takes two arguments, the starting index of\nthe substring and the length.\n\
    \n```\nvoid processLine(const astrping& line)\n{\n    // the character we are\
    \ looking for is a quotation mark\nchar quote = '\\\"';\"\n```"
