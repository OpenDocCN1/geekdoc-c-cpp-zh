  md: '# Chapter 6


    # Iteration


    # 6.1 Multiple assignment


    I haven''t said much about it, but it is legal in C++ to make more than one assignment
    to the same variable. The effect of the second assignment is to replace the old
    value of the variable with a new value.


    ```

    int fred = 5;

    cout << fred;

    fred = 7;

    cout << fred;

    ```


    The output of this program is 57, because the first time we print fred his value
    is 5, and the second time his value is 7.


    This kind of multiple assignment is the reason I described variables as a container
    for values. When you assign a value to a variable, you change the contents of
    the container, as shown in the figure:


    | int fred = 5; | fred = 7; |

    | fred | fred |

    | 5 | 7 |


    When there are multiple assignments to a variable, it is especially important
    to distinguish between an assignment statement and a statement of equality. Because
    C++ uses the symbol for assignment, it is tempting to interpret a statement like
    a = b as a statement of equality. It is not!


    First of all, equality is commutative, and assignment is not. For example, in
    mathematics if a = 7 then 7 = a. But in C++ the statement a = 7; is legal, and
    7 = a; is not.'
  merge: -1
  img_proc: true
