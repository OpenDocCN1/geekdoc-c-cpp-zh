  mdcn: "\n\n## 13.3 牌组 (Decks)\n\n在上一章中，我们处理了对象向量，但也提到过可以创建一个包含向量作为其实例变量的对象。在本章中，我将创建一个名为\
    \ `Deck` 的新对象，它包含一个 `Cards` 向量。\n\n结构体定义如下：\n\n```cpp\nstruct Deck {\n  avector<Card>\
    \ cards;\n\n  Deck(int n);\n};\n\nDeck::Deck(int size) {\n  avector<Card> temp(size);\n\
    \  cards = temp;\n}\n```\n\n实例变量的名字为 `cards`，是为了区分 `Deck` 对象与它包含的 `Cards` 向量。\n\
    \n目前只有一个构造函数。它创建了一个局部变量 `temp`，通过调用 `avector` 类的构造函数来初始化它，并将 `size` 作为参数传递。然后，它将向量从\
    \ `temp` 拷贝到实例变量 `cards` 中。\n\n我们可以这样创建一个牌组：\n\nDeck (52):\n\n下面的状态图展示了 `Deck`\
    \ 对象的内部样子：\n\n| | 1 | 2 | 51 |\n|---|---|---|---|\n| suit: 0 | suit: 0 | suit:\
    \ 0 |\n| rank: 0 | rank: 0 | rank: 0 |\n\n名为 `deck` 的对象有一个名为 `cards` 的单一实例变量，它是一个\
    \ `Card` 对象的向量。要访问牌组中的卡牌，我们必须组合访问实例变量的语法和从数组中选择元素的语法。例如，表达式 `deck.cards[i]` 是牌组中的第\
    \ $i$ 张卡牌，而 `deck.cards[i].suit` 是它的花色。接下来的循环\n\n```cpp\nfor (int i = 0; i<52;\
    \ i++) {\n    deck.cards[i].print();\n}\n```\n\n演示了如何遍历整个牌组并输出每张卡牌。\n\n## 13.4\
    \ 另一个构造函数\n\n现在我们已经有了一个 `Deck` 对象，初始化其中的卡牌将很有用。从上一章中，我们有一个名为 `buildDeck` 的函数可以使用（需要进行一些调整），但写写第二个构造函数可能更自然。\n\
    \n```cpp\nDeck::Deck() {\n    apvector<Card> temp (52);\n    cards = temp;\n\n\
    \    int i = 0;\n    for (Suit suit = CLUBS; suit <= SPADES; suit = Suit(suit+1))\
    \ {\n        cards[i].suit = suit;\n        cards[i].rank = rank;\n        i++;\n\
    \    }\n}\n```\n\n注意这个函数与 `buildDeck` 是多么相似，不同在于我们必须修改语法使其成为构造函数。现在我们可以通过简单的声明\
    \ `Deck deck;` 来创建一个标准的 52 张牌牌组；\n\n## 13.5 Deck 成员函数\n\n既然我们已经有了 `Deck` 对象，将所有与\
    \ `Deck` 相关的函数放在 `Deck` 的定义中是合理的。观察我们目前编写的函数，一个显而易见的候选是 `printDeck`（第12.7节节）。以下是它的工作原理，重写为\
    \ `Deck` 的成员函数：\n\n```cpp\nvoid Deck::print() const {\n    for (int i = 0; i <\
    \ cards.length(); i++) {\n        cards[i].print();\n    }\n}\n```\n\n和往常一样，我们可以引用当前对象的实例变量，而无需使用点符号符号。对于其他某些函数，并不清楚它们应该是\
    \ `Card` 的成员函数、`Deck` 的成员函数，还是以 `Cards` 和 `Deck` 为参数的非成员函数。例如，上一章中的 `find` 版本接受一个\
    \ `Card` 和一个 `Deck` 作为参数，但你可以合理地将其设为任何一种类型的成员函数。作为一个练习，请将 `find` 重写为以 `Card` 为参数的成员函数。\n\
    \n将 `find` 写成 `Card` 的成员函数有点棘手。这里是我的版本：\n\n```cpp\nint Card::find(const Deck&\
    \ deck) const {\n  for (int i = 0; i < deck.cards.length(); i++) {\n    if (equals(deck.cards[i],\
    \ *this)) return 1;\n  }\n  return -1;\n}\n```\n\n第一个技巧是，我们必须使用关键字 `this` 来引用被调用的那个\
    \ `Card` 函数。第二个技巧是，C++ 并不易于编写相互引用的结构体定义。问题在于当编译器读取第一个结构体定义时，它还不知道第二个。一种解决方案是在\
    \ `Card` 之前声明 `Deck`，然后在之后定义：\n\n```cpp\n// 声明 Deck 是一个结构体，但不定义它\nstruct Deck;\n\
