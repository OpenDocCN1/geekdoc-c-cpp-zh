    # # 5.11 Leap of faith


    Following the flow of execution is one way to read programs, but as you saw in
    the previous section, it can quickly become labyrinthine. An alternative is what
    I call the "leap of faith.\ When you come to a function call, instead of following
    the flow of execution, you assume that the function works correctly and returns
    the appropriate value.


    In fact, you are already practicing this leap of faith when you use built-in functions.
    When you call cos or exp, you do not examine the implementations of those functions.
    You just assume that they work, the people who wrote the libraries were programmers.

    Well, the same is true when you call one of your own functions. For example, in
    Section 5.3 we wrote a function isdigit that determines whether a number is between
    0 and 9. We have convinced ourselves that this function is correct—by testing
    and examination of the code—we can use the function without ever looking at the
    code.


    The same is true of recursive programs. When you get to the recursive call, instead
    of following the flow of execution, you should assume that the recursive calls
    (yield the correct result), and then ask yourself, "Assuming that I find the factorial
    of n-1, can I compute the factorial of n?" In this case, it is clear that you
    can, by multiplying by n.


    Of course, it is a bit strange to assume that the function works correctly'
