  - "[PAGE 94]\n\n# # Chapter 9\n\n# # More structures\n\n# ## 9.1 Time\n\nAs a second\
    \ example of a user-defined structure, we will define a type called **Time**,\
    \ which is used to record the time of day. The various pieces of information that\
    \ form a time are the hour, minute and second, so these will be the instance variables\
    \ of the structure.\n\nThe first step is to decide what type each instance variable\
    \ should be. It seems clear that **hour** and **minute** should be integers. Just\
    \ to keep things interesting, let's make **second** a double, so we can record\
    \ fractions of a second. Here's the structure definition looks like:\n\n```\n\
    struct Time {\n  int hour, minute;\n  double second;\n}\n```\n\nWe can create\
    \ a **Time** object in the usual way:\n\n```\nTime time = { 11, 59, 3.14159 };\n\
    ```\n\nThe diagram for this object looks like this:\n\n| hour: 11 |\n| minute:\
    \ 59 |\n| second: 3.14159 |"
  - "[PAGE 95]\n\nThe word \"instance\" is sometimes used when we talk about objects,\
    \ because every object is an instance (or example) of some type. The reason that\
    \ instance variables are so-named is that every instance of a type has a copy\
    \ of the instance variables for that type.\n\n# 9.2 printTime\n\nWhen we define\
    \ a new type it is a good idea to write function that displays the instance variables\
    \ in a human-readable form. For example:\n\n```\nvoid printTime(Time& t) {\n \
    \   cout << t.hour << \":\" << t.minute << \":\" << t.second << endl;\n}\n```\n\
    \nThe output of this function, if we pass time as an argument, it is 11:59:3.14159.\n\
    \n# 9.3 Functions for objects\n\nIn the next sections, I will demonstrate several\
    \ possible interfaces for functions that operate on objects. For some operations,\
    \ you will have a choice of several possible interfaces, so you should consider\
    \ the pros and cons of each of these:\n\n+   **pure function**: Takes objects\
    \ and/or basic types as arguments but not modify the objects. The return value\
    \ is either a basic type or a new object created inside the function.\n\n+   **modifier**:\
    \ Takes objects as parameters and modifies some or all of them. Often returns\
    \ void.\n\n+   **fill-in function**: One of the parameters is an \"empty\" object\
    \ that gets filled in the function. Technically, this is a type of modifier.\n\
    \n# 9.4 Pure functions\n\nA function is considered a pure function if the result\
    \ depends only on the arguments, and it has no side effects modifying or outputting\
    \ something. The only result of calling a pure function is the return value.\n\
    \nOne example is **after**, which compares two Times and returns a bool that indicates\
    \ whether the first operand comes after the second:\n\n```\nbool after(Time& time1,\
    \ Time& time2) {\n    if (time1.hour > time2.hour) return true;\n    if (time1.hour\
    \ < time2.hour) return false;\n}\n```"
