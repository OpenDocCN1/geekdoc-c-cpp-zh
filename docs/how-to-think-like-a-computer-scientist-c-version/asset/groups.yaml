    \ n)\n{\n    apvector<apstring> temp(n);\n    elements = temp;\n    numElements\
    \ = 0;\n}\n```\n\n实例变量是一个字符串的 `apvector` 和一个用于跟踪集合中元素数量的整数。请记住，集合中的元素数量 `numElements`\
    \ 不同于 `apvector` 的大小。通常它会更小。\n\n`Set` 构造函数接受一个参数，即 `apvector` 的初始大小。初始元素数量始终为\
    \ 0。\n`numElements` 和 `getElement` 是私有实例变量的访问器函数。`numElements` 是一个只读变量，因此我们提供了\
    \ `get` 函数而没有提供 `set` 函数。\n\n```cpp\nint Set::getNumElements() const\n{\n    return\
    \ numElements;\n}\n```\n\n为什么我们阻止客户端程序更改 `getNumElements` ？该类型的不变性（invariants）是什么？客户端程序如何可能破坏不变性？我们来看\
    \ `Set` 的其余成员函数，看看你能否说服自己它们维护了不变性。\n\n当我们使用运算符访问 `apvector` 时，它会检查索引是否大于等于 0 且小于\
    \ `apvector` 的长度。然而，要访问集合的元素，我们需要检查一个更强的条件。索引必须小于元素数量，而元素数量可能小于 `apvector` 的长度。\n\
    \n```cpp\napstring Set::getElement(int i) const\n{\n  if (i < numElements) {\n\
    \    return elements[i];\n  } else {\n    cout << \"Set index out of range.\"\
    \ << endl;\n    exit (1);\n  }\n}\n```\n\n`getElement` 获取到一个超出范围的索引，它打印一条错误信息（我承认这并不好用），并退出。\n\
    函数是 `find` 和 `add`。到目前，遍历和搜索的模式应该已经烂熟悉了：\n\n```cpp\nint Set::find (const apstring&\
    \ s) const {\n  for (int i=0; i<numElements; i++) {\n    if (elements[i] == s)\
    \ return i;\n  }\n  return -1;\n}\n```\n\n剩下的就是 `add`。通常像 `add` 这样的函数返回类型是 `void`，在这种情况下，返回元素的索引可能是有用的。\n\
    \n```cpp\nint Set::add (const apstring& s) {\n  // 如果元素已经在集合中，返回它的索引\n  int index\
    \ = find(s);\n  if (index == -1) return index;\n\n  // 如果 apvector 满了，将其大小翻倍\n\
    \  if (numElements == elements.length()) {\n    elements.resize(elements.length()\
    \ * 2);\n  }\n\n  // 添加新元素并返回它的索引\n  index = numElements;\n  elements[index] =\
    \ s;\n  numElements++;\n  return index;\n}\n```\n\n这里棘手的地方在于 `numElements` 有两种用法。它它当然是集合中的元素数量，但它也是下一个要添加元素的索引。\n\
    \n需要一点时间才能说服自己它是可以的，但请考虑这一点：当元素数量为 0 时，下一个元素的索引是 0。当元素数量等于 `apvector` 的长度时，意味着向量已满，我们必须在添加新元素之前分配更多空间（`resize`）。\n\
    \n这里是一个状态图，显示一个初始包含 2 个元素空间的 `Set`。\n\n| numElements: 0 | numElements: 1 | numElements:\
    \ 3 |\n| :--- | :--- | :--- |\n| elements: | elements: | elements: |\n| 0 | \"\
    element1\" | 0 \"element1\" |\n| | | 1 \"element2\" |\n| | | 2 \"element3\" |\n\
    \n现在我们可以使用 `Set` 类来跟踪在文件中找到城市。在 `main` 中创建一个初始大小为 2 的 `Set`：\n\n```cpp\nSet cities\
    \ (2);\n```\n\n然后在 `processLine` 中将两个城市添加到 `Set` 并存储返回的索引。\n\n```cpp\nint index1\
    \ = cities.add(city1);\nint index2 = cities.add(city2);\n```\n\n我修改了 `processLine`\
    \ 使城市对象作为第二个参数。\n\n## 15.7 apmatrix\n\n`apmatrix` 与 `apvector` 类似，但它是二维的。它没有长度，而是有两个维度，分别称为\
    \ `numrows` 和 `numcols`，表示“行数”和“列数”。\n\n矩阵中的每个元素由两个索引识别；一个指定行号，另一个指定列号。\n\n要创建一个矩阵，有四种构造函数：\n\
    \n```cpp\napmatrix<char> m1;\napmatrix<int> m2 (3, 4);\napmatrix<double> m3 (rows,\
    \ cols, 0.0);\napmatrix<double> m4 (m3);\n```\n\n第一个是无所作为的构造函数，创建一个两个维度均为 0 的矩阵。第二个接受两个整数，即初始行数和列数，顺序如此。第三个与第二个相同，但额外接受一个用于初始化矩阵元素的参数。第四个是拷贝构造函数，接受另一个\
    \ `apmatrix` 作为行和列：\n\n就像 `avectors` 一样，我们可以创建任何类型元素的 `apmatrix`（甚至是 `apmatrix`）。访问元素时，我们使用\
    \ `[]` 运算符指定行和列：\n\n```cpp\nm2[0][0] = 1;\nm3[1][2] = 10.0 * m2[0][0];\n```\n\n\
    如果我们尝试访问超出范围的元素，程序将打印错误信息并退出。\n`nrows` 和 `numcols` 函数获取行数和列数。\n记住，行索引从 0 到 `numrows-1`，列索引从\
    \ 0 到 `numcols-1`。\n\n遍历矩阵的通常方法是嵌套循环。此循环将矩阵的每个元素设置为两个索引之和：\n\n```cpp\nfor (int\
    \ row=0; row < m2.numrows(); row++) {\n    for (int col0=0; col < m2.numcols();\
    \ col++) {\n        m2[row][col] = row + col;\n    }\n}\n```\n\n此循环打印矩阵的每一行，元素之间使用制表符，行与行之间使用换行：\n\
    \n```cpp\nfor (int row=0; row < m2.numrows(); row++) {\n    for (int col0=0; col\
    \ < m2.numcols(); col++) {\n        cout << m2[row][col] << \"\\t\";\n    }\n\
