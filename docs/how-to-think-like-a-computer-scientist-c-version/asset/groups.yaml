    # Chapter 10


    # Vectors


    A **vector** is a set of values where each value is identified by a number (called
    an index). An string is similar to a vector, since it is made up of an indexed
    set of characters. The nice thing about vectors is that they can be made up of
    any type of element, including basic types like ints and doubles, and user-defined
    types like Point and Time.


    The vector type that appears on the AP exam is called **vector**. In order to
    use it, you have to include the header file `vector.h`; the details of how to
    do that depend on your programming environment.


    You can create a vector the same you create other variable types:


    ```

    vector<int> count;

    vector<double> doubleVector;

    ```


    The type that makes up the vectors appears in angle brackets (< >). The first
    line creates a vector of integers named count; the second creates a vector of
    doubles. Although these statements are legal, they are not very useful because
    they create vectors that no elements (their length is zero). It is more common
    to specify the length of the vector in parentheses:


    ```

    vector<int> count(4);

    ```


    The syntax is a little odd; it looks like a combination of a variable declaration
    and a function call. In fact, that''s exactly what it is. The function we are
    invoking is an **vector** constructor. A **constructor** is a special function
    that creates new objects and initializes their instance variables. In this case,
    the constructor takes a single argument, which is the size of the new vector.


    The following figure shows how vectors are represented in state diagrams:'
