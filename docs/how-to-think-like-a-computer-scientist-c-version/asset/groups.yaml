    # 9.8 Which is best?


    Anything that can be done with modifiers and fill-ins can also be done with pure
    functions. In fact, there are programming languages, called functional programming
    languages, that only allow pure functions. faster to develop and less error-prone
    than programs that use modifiers. Nevertheless, there are times when modifiers
    are convenient, and cases where functional programs are less efficient.


    In general, I recommend that you write pure functions whenever it is reasonable
    to do so, and resort to modifiers only if there is a compelling advantage. This
    approach might be called a functional programming style.


    # 9.9 Incremental development versus planning


    In this chapter I have demonstrated an approach to program development I refer
    to as rapid prototyping with iterative improvement. In each case, I wrote a rough
    draft (or prototype) that performed the basic calculation, and tested it on a
    few cases, correcting flaws as I found them.


    Although this approach can lead to code that is unnecessarily complicated—since
    it deals with many special cases— and unreliable—since it is hard to know if you
    have found all the errors.'
  - "[PAGE 100]\n\n# 9.10. GENERALIZATION\n\nAn alternative is high-level planning,\
    \ in which a little insight into the problem can make the programming much easier.\
    \ In this case the insight is that Time is really a three-digit number in base\
    \ 60! The second is the \"ones column,\" the minute is the \"60's column,\" and\
    \ the hour is the \"3600's column.\"\n\nWhen we wrote addTime and increment, we\
    \ were effectively doing addition in base 60, which is why we have to \"carry\"\
    \ from one column to the next.\n\nThus an alternate approach to the whole problem\
    \ is to convert Times into doubles and take advantage of the fact that the computer\
    \ already knows how to do arithmetic with doubles. Here is a function that converts\
    \ a Time into a double:\n\n```\ndouble convertSeconds(const Time t) {\n  int minutes\
    \ = t.hour * 60 + t.minute;\n  double seconds = minutes * 60 + t.second;\n  return\
    \ seconds;\n}\n```\n\nNow all we need a way to convert from a double to a Time\
    \ object:\n\n```\nTime makeTime(double secs) {\n  Time time;\n  time.hour = int\
    \ (secs / 3600.0);\n  secs -= time.hour * 3600.0;\n  time.minute = int (secs /\
    \ 60.0);\n  secs -= time.minute * 60;\n  time.second = secs;\n  return time;\n\
    }\n```\n\nYou might have to think a bit to convince yourself that the technique\
    \ I am using to convert from one base to another is correct. Assuming you are\
    \ convinced, we can use these functions to rewrite addTime:\n\n```\nTime addTime(const\
    \ Time& t1, const Time& t2) {\n  double seconds = convertSeconds(t1) + convertSeconds(t2);\n\
    \  return makeTime(seconds);\n}\n```\n\nThis is much shorter than the original\
    \ version, and it is much easier to demonstrate that it is correct (assuming,\
    \ as usual, that the functions it calls are correct). As an exercise, rewrite\
    \ increment the same way.\n\n# 9.10 Generalization\n\nIn some ways converting\
    \ from base 60 to base 10 and back is harder than just dealing with times. Base\
    \ conversion is more abstract; our intuition for dealing times is better."
