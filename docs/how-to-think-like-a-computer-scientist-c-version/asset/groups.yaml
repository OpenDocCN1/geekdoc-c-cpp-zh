    # 6.1 Multiple assignment


    I haven''t said much about it, but it is legal in C++ to make more than one assignment
    to the same variable. The effect of the second assignment is to replace the old
    value of the variable with a new value.


    ```

    int fred = 5;

    cout << fred;

    fred = 7;

    cout << fred;

    ```


    The output of this program is 57, because the first time we print fred his value
    is 5, and the second time his value is 7.


    This kind of multiple assignment is the reason I described variables as a container
    for values. When you assign a value to a variable, you change the contents of
    the container, as shown in the figure:


    | int fred = 5; | fred = 7; |

    | fred | fred |

    | 5 | 7 |


    When there are multiple assignments to a variable, it is especially important
    to distinguish between an assignment statement and a statement of equality. Because
    C++ uses the symbol for assignment, it is tempting to interpret a statement like
    a = b as a statement of equality. It is not!


    First of all, equality is commutative, and assignment is not. For example, in
    mathematics if a = 7 then 7 = a. But in C++ the statement a = 7; is legal, and
    7 = a; is not.'
  - "[PAGE 61]\n\nFurthermore, in mathematics, a statement of equality is true for\
    \ all time. $a = b$ now, then $a$ will always equal $b$. In C++, an assignment\
    \ statement can make two variables equal, but they don't have to stay that way!\n\
    \n```\nint a = 5;\nint b = a;      // a and b are now equal\na = 3;          \
    \ // a and b are no longer equal\n```\n\nThe third line changes the value of a\
    \ bit it does not change the value of b, and so they are no longer equal. In many\
    \ programming an alternate symbol is used for assignment, such as <- or :=, to\
    \ avoid confusion. Although assignment is frequently useful, you should use it\
    \ with caution. If variables are changing constantly in different parts of the\
    \ program, it can make the code difficult to read and debug.\n\n# 6.2 Iteration\n\
    \nOne of the things computers are often used for the automation of repetitive\
    \ tasks. Repeating identical or similar tasks without making errors is something\
    \ that computers do well and people poorly.\n\nWe have programs that use recursion\
    \ to perform repetition, such as nLines and countdown. This type of repetition\
    \ is called Iteration, and C++ provides several language features that make it\
    \ easier to write iterative programs.\n\nThe two features we are going to look\
    \ at are the while statement and the for.\n\n# 6.3 The while statement\n\nUsing\
    \ a while statement, we can rewrite countdown:\n\n```\nvoid countdown(int n) {\n\
    \    while (n > 0) {\n        cout << n << endl;\n        n = n-1;\n    }\n  \
    \  cout << \"Blastoff!\" << endl;\n}\n```\n\nYou can almost read a while statement\
    \ as if it were English. What this means is, \"n is greater than zero, continue\
    \ displaying the value of n and then reducing the value of n by 1. When you get\
    \ to zero, output the word 'Blastoff!'\nMore formally, the flow of execution for\
    \ a while statement is as follows:\n\n+   1. Evaluate the condition in parentheses,\
    \ yielding true or false."
  - "[PAGE 62]\n\n# 6.3. THE WHILE STATEMENT\n\n2. If the condition is false, exit\
    \ the while statement and continue execution at the next statement.\n\n3. If the\
    \ condition is true, execute each of the statements between the squiggle-braces,\
    \ and then go back to step 1.\n\nThis type of flow is called a loop because the\
    \ third step loops back around to the top. Notice that if the condition is false\
    \ the first time through the loop, the statements inside are never executed. The\
    \ statements inside are called the body of the loop. The body of the loop should\
    \ change the value of one or more variables so that, eventually, the condition\
    \ becomes false and the loop terminates. Otherwise the loop will repeat forever,\
    \ which is called an infinite loop. An endless source of amusement for computer\
    \ scientists is the observation that the directions on shampoo, \"Lather, rinse,\
    \ repeat,\" are an infinite loop.\n\nIn the case of countdown, we can prove that\
    \ the loop will terminate because we know the value of n is finite, and we can\
    \ see that the value of n gets smaller each time through the loop (each iteration),\
    \ so eventually we have to get zero. In other cases it is not easy to tell:\n\n\
    ```\nvoid sequence (int n) {\n    while (n != 1) {\n        cout << n << endl;\n\
    \        if(n%2 == 0) { // n is even\n            n = n / 2;\n        } else {\n\
    \            n = n + 3;\n        }\n    }\n}\n```\n\nThe condition for this loop\
    \ is n != 1, so the loop will continue until n is 1, which will make the condition\
    \ false.\n\nAt each iteration, the program outputs the value of n and checks whether\
    \ it is even or odd. If it is, the value of n is divided by two. If it is odd,\
    \ the value is 3n + 1. For example, if the starting value (the argument passed\
    \ to sequence) is 3, the sequence is 3, 10, 5, 16, 8, 4, 2.\n\nSince n increases\
    \ and decreases, there is no obvious proof that n will ever reach 1, or that the\
    \ program will terminate. For particular values of n, we can prove termination.\
    \ For example, if the starting value is a power of two, then the value of n will\
    \ be even every time through the loop, until we get to 1. The previous example\
    \ ends with such a sequence, starting with 16.\n\nParticular values aside, the\
    \ interesting question is whether we can prove that this program terminates for\
    \ all values of n. So far, no one has been able to prove it or disprove it!"
  - "[PAGE 63]\n\n# 6.4 Tables\n\nOne of the things loops are good for generating\
    \ tabular data. For example, before computers were readily available, people had\
    \ to calculate logarithms, sines and cosines, and other common mathematical functions\
    \ by hand. To make that easier, there were books containing long tables where\
    \ you could find the values of various functions. Creating these tables was slow\
    \ and boring, and the result tended to be full of errors.\n\nWhen computers appeared\
    \ on the scene, one of the initial reactions was, “This is great! We can use the\
    \ computers to generate the tables, so there will be no errors.” That turned out\
    \ to be true (mostly), but shortsighted. Soon thereafter computers and calculators\
    \ were so pervasive that the tables became obsolete.\n\nWell, almost. It turns\
    \ out that for some operations, computers use tables of values to get an approximate\
    \ answer, and then perform computations to improve the approximation. In some\
    \ cases, there have been errors in the underlying tables, most famously in the\
    \ original Intel Pentium to perform floating-point division.\n\nAlthough a “log\
    \ table” is not as useful as it was once, it still makes a good example of iteration.\
    \ The following program outputs a sequence of values in the left column and their\
    \ logarithms in the right column:\n\n```\ndouble x = 1.0;\nwhile (x < 10.0) {\n\
    \    cout << x << \" \\t\" << log(x) << \" \\n\";\n    x = x + 1.0;\n}\n```\n\n\
    The sequence \\t represents a tab character. The sequence \\n represents a new\
    \ line character. These sequences can be anywhere in a string, although in these\
    \ examples the cursor will shift to the right until it reaches one of a minute,\
    \ tabs which are normally every eight characters. As we will see in a minute,\
    \ tabs are useful for making columns of text line up.\n\nA newline character has\
    \ exactly the same effect as endl; it causes the cursor to move to the next line.\
    \ Usually if a newline character appears by itself, I use \\n, but if it appears\
    \ part of a string, I use \\n.\n\nThe output of this program is\n\n| 0 | 0.693147\
    \ |\n| 1 | 1.098641 |\n| 2 | 1.38629 |\n| 3 | 1.60944 |\n| 4 | 1.79176 |\n| 5\
    \ | 1.94591 |\n| 6 | 2.07944 |"
  - "[PAGE 64]\n\n# 6.4. TABLES\n\n9 2.19722\n\nIf these values seem odd, remember\
