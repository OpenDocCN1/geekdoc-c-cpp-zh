  - '[PAGE 37]


    In this case, the compiler can tell the type of hour and minute by looking at

    the declarations. It is unnecessary and illegal to include the type when you

    pass them as arguments. The correct syntax is printTime (hour, minute).


    # 3.11 Functions with results


    You might have noticed by now some of the functions we are using, like the

    math functions, yield results. Other functions, like newLine, perform an action

    but don''t return a result. That raises some questions:


    +   - What happens if you call a function and you don''t do anything with the

    result (i.c. you don''t assign it to a variable or use it as part of a larger

    expression)?

    - What happens if you use a function without a result as part of an expres-

    sion, like newLine() +?

    - Can we write functions that yield results, or are we stuck with things like

    newLine and printTwice?


    The answer to the third question is "yes, you can write functions that return

    values," and we will do it in a couple of chapters. I will leave it up to you
    to answer

    the other questions by trying them out. Any time you have a question about

    what is legal or illegal in C++, a good way to find out is to ask the compiler.


    # 3.12 Glossary


    **floating-point:** A type of variable (or value) that can contain fractions as
    well

    integers. There are a few floating-point types in C++; the one we use

    in this book is **double**.


    **initialization:** A statement that declares a new variable and assigns a value

    to it at the same time.


    **function:** A named sequence of statements that performs some useful function.

    Functions may or not take parameters, and may or may not produce

    result.


    **parameter:** A piece of information you provide in order to call a function.

    Parameters are like variables in the sense that they contain values and

    have types.


    **argument:** A value that you provide when you call a function. This value must

    have the same type as the corresponding parameter.


    **call:** Cause a function to be executed.'
  md: "\n## 3.7. PROGRAMS WITH MULTIPLE FUNCTIONS\n\nInside the definition of **main**,\
    \ there is a statement that uses or calls **threeLine**. Similarly, **threeLine**\
    \ calls **newLine** three times. Notice that the definition of each function appears\
    \ above the place where it is used.\n\nThis is necessary in C++; the definition\
    \ of a function must appear before (above) the first use of the function. You\
    \ should try compiling this program with the functions in a different order and\
    \ see what error messages you get.\n\n## 3.7 Programs with multiple functions\n\
    \nWhen you look at a class definition that contains several functions, it is tempting\
    \ to read it from top to bottom, but that is likely to be confusing, because that\
    \ is not the **order of execution of the program**.\n\nExecution begins at the\
    \ first statement of **main**, regardless of where it is in the program (often\
    \ it is at the bottom). Statements are executed one at a time, in order, until\
    \ you call a function. Function calls are a detour in the flow of execution. Instead\
    \ of going to the next statement, you go to the first line of the called function,\
    \ execute all the statements, and then come back up to pick where you left off.\n\
    \nThat sounds simple enough, except that you have to remember that one function\
    \ can call another. Thus, while we are in the middle of **main**, we might have\
    \ to go off and execute statements in **threeLine**. But while we are **threeLine**,\
    \ we get interrupted times to go off and execute **newLine**.\n\nFortunately,\
    \ C++ is not always keeping track of where it is, so each time **newLine** completes,\
    \ the program picks up where it left off in **threeLine**, and eventually gets\
    \ back to **main** so the program can terminate.\n\nWhat's the moral of this sordid\
    \ tale? When you read a program, don't read from top to bottom. Instead, follow\
    \ the flow of execution.\n\n## 3.8 Parameters and arguments\n\nSome of the built-in\
    \ functions we have used have **parameters**, which are values that you provide\
    \ to let the function do its job. For example, if you want to find the size of\
    \ a number, you have to indicate what number it is. Thus, **sin** takes a **double**\
    \ value as a parameter.\n\nSome functions take more than one parameter, like **pow**,\
