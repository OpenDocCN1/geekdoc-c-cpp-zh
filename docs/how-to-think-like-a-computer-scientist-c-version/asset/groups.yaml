    \ elements are called instance variables, for reasons I will explain a little\
    \ later.\nIt is a common error to leave off the semi-colon at the end of a structure\
    \ definition. It might seem odd to put a semi-colon after a squiggly-brace, but\
    \ you'll get used to it.\nOnce you have defined the new structure, you can create\
    \ variables with that type:\n\n```cpp\nPoint blank;\nblank.x = 3.0;\nblank.y =\
    \ 4.0;\n```\n\nThe first line is a conventional variable declaration: blank has\
    \ type Point. The next two lines initialize the variables of the structure. The\
    \ \"dot notation\" used here is similar to the syntax for invoking a function\
    \ on an object, as in fruit.length(). Of course, one difference is that function\
    \ names are always followed by an argument list, even if it is empty.\nThe result\
    \ of these assignments is shown in the following state diagram:\n\n| x: | 3 |\n\
    | y: | 4 |\n\nAs usual, the name of the variable blank appears outside the box\
    \ and its value appears inside the box. In this case, that value is a compound\
    \ object with two named instance variables.\n\n## 8.3 Accessing instance variables\n\
    \nYou can read the values of an instance variable using the same syntax we used\
    \ to write:\n\n```cpp\nint x = blank.x;\n```\n\nThe expression blank.x means \"\
    go to the object named blank and get the value of x.\" In this case we assign\
    \ value to a local variable named x. Notice that there is no conflict between\
    \ the local variable x and the instance variable named x. The purpose of dot notation\
    \ is to identify which variable you are referring to unambiguously.\n\n## 8.4\
    \ OPERATIONS ON STRUCTURES\n\nYou can use dot notation as part of any C++ expression,\
    \ so the following are legal.\n\n```cpp\ncout << blank.x << \" \" << blank.y <<\
    \ endl;\ndouble distance = blank.x * blank.x + blank.y * blank.y;\n```\n\nThe\
    \ first line outputs 3, 4; the second line calculates the 25.\n\n## 8.4 Operations\
    \ on structures\n\nMost of the operators we have been using on other types, like\
    \ mathematical operators (+, %, etc.) and comparison operators (==, etc.), do\
    \ not work on structures. Actually, it is possible to define the meaning of these\
    \ operators for the new type, but we don't do that in this book.\n\nOn the other\
    \ hand, the assignment operator *does* work for structures. It can be used in\
    \ two ways: to initialize the instance variables of a structure or to copy the\
    \ instance variables from one to another. An initialization looks like this:\n\
    \n```cpp\nPoint blank = { 3.0, 4.0 };\n```\n\nThe values in squiggly braces get\
    \ assigned to the instance variables of the structure one by one, in order. So\
    \ in this case, x gets the first value and y gets the second.\n\nUnfortunately,\
    \ this syntax can be used only in an initialization, not in an assignment statement.\
    \ So the following is illegal:\n\n```cpp\nPoint blank;\nblank = { 3.0, 4.0 };\
    \ // WRONG !!\n```\n\nYou might wonder why this perfectly reasonable statement\
    \ should be illegal; I'm not sure, but I think the problem is that the compiler\
    \ doesn't know what the right side should be. If you add a typecast:\n\n```cpp\n\
    Point blank;\nblank = (Point){ 3.0, 4.0 };\n```\n\nThat works.\nIt is legal to\
    \ assign one structure to another. For example:\n\n```cpp\nPoint p1 = { 3.0, 4.0\
    \ };\nPoint p2 = p1;\ncout << p2.x << \" \" << p2.y << endl;\n```\n\nThe output\
    \ of this program is 3, 4.\n\n## 8.5 Structures as parameters\n\nYou can pass\
    \ structures as parameters in the usual way. For example,\n\n```cpp\nvoid printPoint(Point\
    \ p) {\n    cout << \"(\" << p.x << \", \" << p.y << \")\" << endl;\n}\n```\n\n\
    printPoint takes a point as an argument and outputs it in the standard format.\n\
    If you call printPoint(blank), it will output (3, 4).\n\nAs a second example,\
    \ we can rewrite the distance function from Section 5.2\nso that it takes two\
    \ Points as parameters instead of four.\n\n```cpp\ndouble distance(Point p1, Point\
    \ p2) {\n    double dx = p2.x - p1.x;\n    double dy = p2.y - p1.y;\n    return\
    \ sqrt(dx*dx + dy*dy);\n}\n```\n\n## 8.6 Call by value\n\nWhen you pass a structure\
    \ as an argument, remember that the argument and\nthe parameter are not the same\
    \ variable. Instead, there are two variables (one\nin the caller and one in the\
    \ callee) that have the same value, at least initially.\nFor example, when we\
    \ call printPoint, the stack diagram looks like this:\n\n| blank | main |\n|---|---|\n\
    | x: | 3 |\n| y: | 4 |\n| p | printPoint |\n| x: | 3 |\n| y: | 4 |\n\n## 8.7 CALL\
    \ BY REFERENCE\n\nIf pinMode happened to change one of the instance variables\
    \ of p, it would have no effect on blank. Of course, there is no reason for pinMode\
    \ to modify its parameter, so this isolation between is appropriate.\n\n## 8.7\
    \ Call by reference\n\nAn alternative parameter-passing mechanism in C++ is \"\
    pass by reference.\" This sort of passing means that if the function modifies\
    \ an instance variable, the change is visible to the caller. To do this, we use\
    \ the ampersand (&):\n\n```cpp\nvoid pinMode(Point &p) {\n    p.x = 10.0;\n}\n\
    ```\n\nIf we call pinMode(blank), the value of blank will be changed. This is\
    \ because the function receives a reference to the original variable, not a copy.\n"
  mdcn: "\n\n结构体定义出现在任何函数定义之外，通常位于程序的开头（include 语句之后）。\n该定义表示此结构体中有两个元素，分别命名为 x 和\
    \ y。这些元素被称为实例变量，原因我稍后会稍作解释。\n在结构体定义的末尾漏掉分号是一个常见的错误。在花括号后面加一个分号可能看起来很奇怪，但你会习惯习惯的。\n\
    一旦你定义了新结构体，就可以创建该类型的变量：\n\n```cpp\nPoint blank;\nblank.x = 3.0;\nblank.y = 4.0;\n\
    ```\n\n第一行是一个惯例变量声明：`blank` 的类型为 `Point`。接下来的两行初始化了结构体的变量。这里使用的“点表示法”与在对象上调用函数的语法相似，例如\
    \ `fruit.length()`。当然，区别之一是，函数名后面总是跟着一个参数列表，即使该列表是空的。\n这些赋值的结果如后续状态图所示：\n\n| x:\
    \ | 3 |\n| y: | 4 |\n\n和往常一样，变量 `blank` 的名称出现在框外，其值出现在框内。在这种情况下，该值是一个包含两个具名实例变量的复合对象。\n\
    \n## 8.3 访问实例变量\n\n你可以使用写入时相同的语法来读取实例变量的值：\n\n```cpp\nint x = blank.x;\n```\n\n\
    表达式 `blank.x` 的意思是“转到命名为 blank 的对象并获取 x 的值”。在这种情况下，我们将值赋值给一个名为 `x` 的局部变量。注意，局部变量\
    \ `x` 和命名为 `x` 的实例变量之间没有冲突。点表示法的目的是无歧地识别你所指的是哪一个变量。\n\n## 8.4 结构体操作\n\n你可以将点表示法作为任何\
    \ C++ 表达式的一部分，因此以下内容是合法的。\n\n```cpp\ncout << blank.x << \" \" << blank.y << endl;\n\
    double distance = blank.x * blank.x + blank.y * blank.y;\n```\n\n第一行输出 3, 4；第二行计算出\
    \ 25。\n\n## 8.4 结构体操作\n\n我们在其他类型上使用的大多数运算符（如数学运算符 `+`、`%` 等）和比较运算符（`==` 等）不能用于结构体。实际上，可以为新类型定义这些运算符的含义，但我们在这书中没有这样做。\n\
    \n另一方面，赋值运算符*可以*用于结构体。它可以用两种方式使用：初始化结构体的实例变量，或将实例变量从一个拷贝到另一个。初始化看起来如下所示：\n\n```cpp\n\
    Point blank = { 3.0, 4.0 };\n```\n\n大括号中的值会按顺序一个地赋值给结构体的实例变量。因此在这种情况下，`x` 获取第一个值，`y`\
    \ 获取第二个值。\n\n遗憾的是，这种语法只能用于初始化，而不能用于赋值语句。因此，以下内容是非合法的：\n\n```cpp\nPoint blank;\n\
    blank = { 3.0, 4.0 }; // 错误 !!\n```\n\n你可能会奇怪为什么这个完全合理的陈述是非合法的；我不确定，但我想问题出在编译器不知道右侧应该是什么。如果你添加一个类型转换：\n\
    \n```cpp\nPoint blank;\nblank = (Point){ 3.0, 4.0 };\n```\n\n这样就可以运行。\n将一个结构体赋值给另一个结构体是合法的。例如：\n\
    \n```cpp\nPoint p1 = { 3.0, 4.0 };\nPoint p2 = p1;\ncout << p2.x << \" \" << p2.y\
    \ << endl;\n```\n\n该程序的输出是 3, 4。\n\n## 8.5 结构体作为参数\n\n你可以像通常一样将结构体作为参数传递。例如\n\n\
    ```cpp\nvoid printPoint(Point p) {\n    cout << \"(\" << p.x << \", \" << p.y\
    \ << \")\" << endl;\n}\n```\n\n`printPoint` 接收点作为参数并按标准格式输出。\n如果你调用 `printPoint(blank)`，它将输出\
    \ (3, 4)。\n\n作为第二个示例，我们可以重写 5.2 节中的 `distance` 函数，使其接收两个 `Point` 作为参数而不是四个。\n\n\
    ```cpp\ndouble distance(Point p1, Point p2) {\n    double dx = p2.x - p1.x;\n\
    \    double dy = p2.y - p1.y;\n    return sqrt(dx*dx + dy*dy);\n}\n```\n\n## 8.6\
    \ 值传递\n\n当你将结构体作为参数传递时，请记住参数和形参数不是同一个变量。相反，有两个变量（一个在调用者中，一个在被调用者中）具有相同的值，至少最初这样。例如，当我们调用\
    \ `printPoint` 时，栈图看起来所示：\n\n| blank | main |\n|---|---|\n| x: | 3 |\n| y: | 4\
    \ |\n| p | printPoint |\n| x: | 3 |\n| y: | 4 |\n\n## 8.7 引用传递\n\n如果 `pinMode`\
    \ 恰好改变了 `p` 的一个实例变量，它对 `blank` 没有影响。当然，没有理由让 `pinMode` 修改其参数，所以这种隔离是合适的。\n\n##\
    \ 8.7 引用传递\n\nC++ 中另一种参数传递机制是“引用传递”。这种传递意味着如果函数修改了实例变量，该更改对调用者是可见的。为了实现这一点，我们使用\
    \ 符号 `&`：\n\n```cpp\nvoid pinMode(Point &p) {\n    p.x = 10.0;\n}\n```\n\n如果我们调用\
    \ `pinMode(blank)`，`blank` 的值将发生改变。这是因为函数接收的是原始变量的引用，而不是副本。\n\n"
