    \ useful to have multiple return statements, one in each branch of a conditional:\n\
    \n```\ndouble absolute(double x) {\n    if (x < 0) {\n        return -x;\n   \
    \ } else {\n        return x;\n    }\n}\n```\n\nSince these returns statements\
