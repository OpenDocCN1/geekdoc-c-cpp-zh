    \ in C++ to make more than one assignment to the same variable. The effect of\
    \ the second assignment is to replace the old value of the variable with a new\
    \ value.\n\n```cpp\nint fred = 5;\ncout << fred;\nfred = 7;\ncout << fred;\n```\n\
    \nThe output of this program is 57, because the first time we print fred his value\
    \ is 5, and the second time his value is 7.\n\nThis kind of multiple assignment\
    \ is the reason I described variables as a container for values. When you assign\
    \ a value to a variable, you change the contents of the container, as shown in\
    \ the figure:\n\n| int fred = 5; | fred = 7; |\n| fred | fred |\n| 5 | 7 |\n\n\
    When there are multiple assignments to a variable, it is especially important\
    \ to distinguish between an assignment statement and a statement of equality.\
    \ Because C++ uses the symbol for assignment, it is tempting to interpret a statement\
    \ like a = b as a statement of equality. It is not!\n\nFirst of all, equality\
    \ is commutative, and assignment is not. For example, in mathematics if a = 7\
    \ then 7 = a. But in C++ the statement a = 7; is legal, and 7 = a; is not.\n\n\
    Furthermore, in mathematics, a statement of equality is true for all time. If\
    \ $a = b$ now, then $a$ will always equal $b$. In C++, an assignment statement\
    \ can make two variables equal, but they don't have to stay that way!\n\n```cpp\n\
    int a = 5;\nint b = a;      // a and b are now equal\na = 3;           // a and\
    \ b are no longer equal\n```\n\nThe third line changes the value of a bit it does\
    \ not change the value of b, and so they are no longer equal. In many programming\
    \ an alternate symbol is used for assignment, such as <- or :=, to avoid confusion.\
    \ Although assignment is frequently useful, you should use it with caution. If\
    \ variables are changing constantly in different parts of the program, it can\
    \ make the code difficult to read and debug.\n\n## 6.2 Iteration\n\nOne of the\
    \ things computers are often used for is the automation of repetitive tasks. Repeating\
    \ identical or similar tasks without making errors is something that computers\
    \ do well and people poorly.\n\nWe have programs that use recursion to perform\
    \ repetition, such as nLines and countdown. This type of repetition is called\
    \ Iteration, and C++ provides several language features that make it easier to\
    \ write iterative programs.\n\nThe two features we are going to look at are the\
    \ while statement and the for.\n\n## 6.3 The while statement\n\nUsing a while\
    \ statement, we can rewrite countdown:\n\n```cpp\nvoid countdown(int n) {\n  \
    \  while (n > 0) {\n        cout << n << endl;\n        n = n-1;\n    }\n    cout\
    \ << \"Blastoff!\" << endl;\n}\n```\n\nYou can almost read a while statement as\
    \ if it were English. What this means is, \"n is greater than zero, continue displaying\
    \ the value of n and then reducing the value of n by 1. When you get to zero,\
    \ output the word 'Blastoff!'\"\n\nMore formally, the flow of execution for a\
    \ while statement is as follows:\n\n- 1. Evaluate the condition in parentheses,\
    \ yielding true or false.\n- 2. If the condition is false, exit the while statement\
    \ and continue execution at the next statement.\n- 3. If the condition is true,\
    \ execute each of the statements between the squiggle-braces, and then go back\
    \ to step 1.\n\nThis type of flow is called a loop because the third step loops\
    \ back around to the top. Notice that if the condition is false the first time\
    \ through the loop, the statements inside are never executed. The statements inside\
    \ are called the body of the loop. The body of the loop should change the value\
    \ of one or more variables so that, eventually, the condition becomes false and\
    \ the loop terminates. Otherwise the loop will repeat forever, which is called\
    \ an infinite loop. An endless source of amusement for computer scientists is\
    \ the observation that the directions on shampoo, \"Lather, rinse, repeat,\" are\
    \ an infinite loop.\n\nIn the case of countdown, we can prove that the loop will\
    \ terminate because we know the value of n is finite, and we can see that the\
    \ value of n gets smaller each time through the loop (each iteration), so eventually\
    \ we have to get zero. In other cases it is not easy to tell:\n\n```cpp\nvoid\
    \ sequence (int n) {\n    while (n != 1) {\n        cout << n << endl;\n     \
    \   if(n%2 == 0) { // n is even\n            n = n / 2;\n        } else {\n  \
    \          n = n + 3;\n        }\n    }\n}\n```\n\nThe condition for this loop\
    \ is n != 1, so the loop will continue until n is 1, which will make the condition\
    \ false.\n\nAt each iteration, the program outputs the value of n and checks whether\
    \ it is even or odd. If it is, the value of n is divided by two. If it is odd,\
    \ the value is 3n + 1. For example, if the starting value (the argument passed\
    \ to sequence) is 3, the sequence is 3, 10, 5, 16, 8, 4, 2.\n\nSince n increases\
    \ and decreases, there is no obvious proof that n will ever reach 1, or that the\
    \ program will terminate. For particular values of n, we can prove termination.\
    \ For example, if the starting value is a power of two, then the value of n will\
    \ be even every time through the loop, until we get to 1. The previous example\
    \ ends with such a sequence, starting with 16.\n\nParticular values aside, the\
    \ interesting question is whether we can prove that this program terminates for\
    \ all values of n. So far, no one has been able to prove it or disprove it!\n\n\
    ## 6.4 Tables\n\nOne of the things loops are good for is generating tabular data.\
    \ For example, before computers were readily available, people had to calculate\
    \ logarithms, sines and cosines, and other common mathematical functions by hand.\
    \ To make that easier, there were books containing long tables where you could\
    \ find the values of various functions. Creating these tables was slow and boring,\
    \ and the result tended to be full of errors.\n\nWhen computers appeared on the\
    \ scene, one of the initial reactions was, “This is great! We can use the computers\
    \ to generate the tables, so there will be no errors.” That turned out to be true\
    \ (mostly), but shortsighted. Soon thereafter computers and calculators were so\
    \ pervasive that the tables became obsolete.\n\nWell, almost. It turns out that\
    \ for some operations, computers use tables of values to get an answer. If these\
    \ values seem odd, remember that the log function uses base $e$. Since powers\
    \ of two are so important in computer science, we often want to find logarithms\
    \ with respect to base 2. To do that, we can use the following formula:\n\n$\\\
    log_2 x = \\frac{\\log x}{\\log 2}$\n\nChanging the output statement to\n\n```cpp\n\
    cout << x << \"t\" << log(x) / log(2.0) << endl;\n```\n\nyields\n\n| 1 | 0 |\n\
    | 2 | 1 |\n| 3 | 1.58496 |\n| 4 | 2 |\n| 5 | 2.32193 |\n| 6 | 2.58496 |\n| 7 |\
    \ 2.80735 |\n| 8 | 3 |\n| 9 | 3.16993 |\n\nWe can see that 1, 2, 4 and 8 are powers\
    \ of two, because their logarithms base 2 are round numbers. If we want to find\
    \ the logarithms of other powers of two, we could modify the program like:\n\n\
    ```cpp\ndouble x = 1.0;\nwhile (x < 100.0) {\n  cout << x << \"t\" << log(x) /\
    \ log(2.0) << endl;\n  x = x * 2.0;\n}\n```\n\nNow instead of adding something\
    \ to x each time through the loop, which yields an arithmetic sequence, we multiply\
    \ x by something, yielding a geometric sequence. The result is:\n\n| 1 | 0 |\n\
    | 2 | 1 |\n| 4 | 2 |\n| 8 | 3 |\n| 16 | 4 |\n| 32 | 5 |\n| 64 | 6 |\n\nBecause\
    \ we are using tab characters between the columns, the position of the second\
    \ column does not depend on the number of digits in the first column.\nLog tables\
    \ may not be useful any more, but for computer scientists, knowing the powers\
    \ of two is! As an exercise, modify this program so it outputs the powers of two\
    \ up to 65536 (that's $2^{16}$). Print it out and memorize it.\n"
  mdcn: "\n## 第6 章\n\n## 迭代\n\n## 6.1 多次赋值\n\n我没有怎么介绍过它，但在 C++ 中，对同一个变量进行多次赋值是合法的。第二次赋值的效果是用新值替换该变量的旧值。\n\
    \n```cpp\nint fred = 5;\ncout << fred;\nfred = 7;\ncout << fred;\n```\n\n该程序的输出结果是\
    \ 57，因为我们第一次打印 fred 时它的值是 5，第二次打印时它的值是 7。\n\n这种多次赋值正是我将变量描述为值的“容器”的原因。当你给变量赋值一个值时，你改变了容器内部的内容，如图所示：\n\
    \n| int fred = 5; | fred = 7; |\n| fred | fred |\n| 5 | 7 |\n\n当对一个变量有多次赋值时，区分赋值语句和相等语句尤为重要。因为\
    \ C++ 使用 `=` 符号表示赋值，人们很容易将像 `a = b` 这样的语句解释为相等语句。它不是的！\n\n首先，相等具有交换律，而赋值不是。例如，在数学中，如果\
    \ $a = 7$ 那么 $7 = a$。但在 C++ 中，语句 `a = 7;` 是合法的，而 `7 = a;` 是不法的。\n\n此外，在数学中，相等语句是恒成立的。如果现在\
    \ $a = b$，那么 $a$ 将永远等于 $b$。在 C++ 中，一个赋值语句可以使两个变量相等，但它们不必一直保持相等！\n\n```cpp\nint\
    \ a = 5;\nint b = a;      // a 和 b 现在相等\na = 3;           // a 和 b 不再相等\n```\n\
    \n第三行改变了 a 的值，但没有改变 b 的值，因此它们不再相等。在许多编程语言中，会使用替代符号表示赋值，例如 `<-` 或 `:=`，以避免混淆。虽然赋值经常有用，但你应该谨慎使用它。如果变量在程序的不同部分不断变化，会使代码难以阅读和调试。\n\
    \n## 6.2 迭代\n\n计算机经常用途之一是重复性任务的自动化。在不出错的情况下重复相同或相似的任务是计算机擅长而人类不擅长的。\n\n我们有使用递归来执行重复的程序，例如\
    \ `nLines` 和 `countdown`。这种重复被称为“迭代”（Iteration），C++ 提供了几种语言特性，使得编写迭代程序变得更容易。\n\
    \n我们将查看的两个特性是 `while` 语句和 `for` 语句。\n\n## 6.3 while 语句\n\n使用 `while` 语句，我们可以重写\
    \ `countdown`：\n\n```cpp\nvoid countdown(int n) {\n    while (n > 0) {\n     \
    \   cout << n << endl;\n        n = n-1;\n    }\n    cout << \"Blastoff!\" <<\
    \ endl;\n}\n```\n\n你几乎可以像英语一样阅读 `while` 语句。它的意思是：“n大于零，继续显示 n 的值，然后将 n 的值减 1。当达到零时，输出单词\
    \ 'Blastoff!'”。\n\n更正式地说，`while` 语句的执行流如下：\n\n- 1. 求值括号中的条件，产生真或假。\n- 2. 如果条件为假，退出\
    \ `while` 语句并继续执行下一语句。\n- 3. 如果条件为真，执行大括号之间的每个语句，然后返回步骤 1。\n\n这种流被称为“循环”，因为第三步绕回了顶部。注意，如果条件在第一次循环时为假，则内部的语句永远不会被执行。内部的语句被称为循环的“循环体”。循环体应该改变一个或多个变量的值，以便最终条件变为假并终止循环。否则，循环将无限重复，这被称为“死循环”。计算机科学家们的一个无穷尽的乐趣来源是观察到洗发水瓶上的说明——“起泡沫、冲洗、重复”是一个无限循环。\n\
    \n在 `countdown` 的情况下，我们可以证明循环将会终止，因为我们知道 n 的值是有限的，而且我们可以看到 n 的值在每次循环（每次迭代）中变小，所以最终我们必须得到零。在其他情况下，这很难判断：\n\
    \n```cpp\nvoid sequence (int n) {\n    while (n != 1) {\n        cout << n <<\
    \ endl;\n        if(n%2 == 0) { // n 是偶数\n            n = n / 2;\n        } else\
    \ {\n            n = n + 3;\n        }\n    }\n}\n```\n\n这个循环的条件是 `n != 1`，所以循环将持续到\
    \ n 等于 1，这将使条件变为假。\n\n在每次迭代中，程序输出 n 的值并检查它是偶数还是奇数。如果是偶数，n 的值除以二；如果是奇数，值则变为 $3n\
    \ + 1$。例如，如果起始值（传递给 `sequence` 的参数）是 3，序列是 3, 10, 5, 16, 8, 4, 2。\n\n由于 n 会增大也会减小，没有明显的证明说明\
    \ n 是否会达到 1 或者程序是否会终止。对于 n 的特定值，我们可以证明终止。例如，如果起始值是 2 的幂，那么每次循环时 n 的值都是偶数，直到我们得到\
    \ 1。上一个例子以这样的序列结束，从 16 开始。\n\n除去特定值不谈，有趣的问题是我们是否能证明这个程序对于所有 n 值都会终止。到目前为止，还没有人能证明或反驳它！\n\
    \n## 6.4 表格\n\n循环擅长的领域之一是生成表格数据。例如，在计算机普及之前，人们必须手动计算对数、正弦、余弦和其他常见的数学函数。为了方便起见，会有包含长表格的书，你可以在其中找到各种函数的值。创建这些表格既缓慢又无聊，而且结果往往充满错误。\n\
    \n当计算机出现时，最初的反应之一是：“太棒了！我们可以使用计算机来生成表格，这样就不会有错误。”事实证明这是正确的（大部分情况下），但是短视的。不久之后，计算机和计算器无处不在，表格变得过时了。\n\
    \n嗯，几乎。事实证明对于某些操作，计算机使用值表来获取答案。虽然赋值经常有用，但你应该谨慎使用它。如果变量在程序的不同部分不断变化，会使代码难以阅读和调试。\n"
