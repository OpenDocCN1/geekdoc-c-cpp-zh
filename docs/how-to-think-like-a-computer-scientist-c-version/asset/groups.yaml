    \   。\n\n\n\n枚举类型，我们可以使用 `Suit` 和 **Rank**：\n\n```cpp\nswitch (suit) {\ncase ACE:\n\
    \    //;\n\n\nbreak\n\n\n``````\n\n使用 `break` 语句，例如：\n\n```cpp\nstruct Card {\n\
    \    Rank rank;\n    Suit suit;\n};\n```\n\n在枚举类型中使用 `switch` 语句，参数为 `DIAMONDS`：\n\
    \n按照约定，枚举类型的值是大写字母。这种 `switch` 语句比使用整数的替代方案要清晰得多：\n\n```cpp\nswitch (symbol) {\n\
    case '+':\n    perform_addition();\n    break;\ncase '*':\n    perform_multiplication();\n\
    \    break;\ndefault:\n    cout << \"I only know to perform addition and multiplication\"\
    \ << endl;\n    break;\n}\n```这个 `switch` 语句等同于以下链式条件：\n\n```cpp\nif (symbol ==\
    \ '+') {\n    perform_addition();\n} else if (symbol == '*') {\n    perform_multiplication();\n\
    } else {\n    cout << \"I only know to perform addition and multiplication\" <<\
    \ endl;\n}\n``` `break` 语句在 `switch` 语句的每个分支中都是必要的，否则执行流会“穿透”到下一个分支。如果没有 `break`\
    \ 语句，符号 `+` 会执行 `perform_addition`，然后执行 `perform_multiplication`，最后打印错误信息。这种特性偶尔很有用，但大多数时候它是人们忘记\
    \ `break` 语句时的错误来源。\n\n- `switch` 语句适用于整数、字符和枚举类型。\n- 例如，为了将 `Suit` 转换为字符串，我们可以使用如下代码：\n\
    \n```cpp\nswitch (suit) {\ncase CLUBS: return \"Clubs\";\ncase DIAMONDS: return\
    \ \"Diamonds\";\ncase HEARTS: return \"Hearts\";\ncase SPADES: return \"Spades\"\
    ;\ndefault: return \"Not a valid suit\";\n}\n```\n\n在这种情况下，我们不需要 `break` 语句，因为\
    \ `return` 语句会导致执行流返回调用者，而不是穿透到下一个分支。\n\n通常，在每个 `switch` 语句中包含一个 `default` 分支是良好的习惯，用于处理错误或意外值。\n\
    \n"
