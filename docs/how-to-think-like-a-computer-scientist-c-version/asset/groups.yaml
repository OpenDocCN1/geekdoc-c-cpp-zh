    \ have to include the header file ctype.h.\n\n```\nchar letter = 'a';\nif (isalpha(letter))\
    \ {\n    cout << \"The character \" << letter << \"\" << endl;\n}\n```\n\nYou\
    \ might expect the return value from isalpha to be a bool, but for reasons I don't\
