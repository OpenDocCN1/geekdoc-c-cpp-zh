  - "[PAGE 42]\n\n# 4.7. RECURSION\n\nFor example, look at the following function:\n\
    \n```\nvoid countdown (int n) {\n  if (n == 0) {\n    cout << \"Blastoff!\" <<\
    \ endl;\n  } else {\n    cout << n << endl;\n    countdown(n-1);\n  }\n}\n```\n\
    \nThe name of the function is countdown and it takes a single integer as a parameter.\
    \ If the parameter is zero, it outputs the word \"Blastoff!\" Otherwise, it outputs\
    \ the parameter and then calls a function named countdown—itself—passing n-1 as\
    \ an argument.\n\nWhat happens if we call this function like this:\n\n```\nvoid\
    \ main () {\n  countdown(3);\n}\n```\n\nThe execution of countdown begins with\
    \ n=3, and since n is not zero, it outputs the value 3, and then calls itself...\n\
    \nThe execution of countdown begins with n=2, and since n is not zero, it outputs\
    \ the value 2, and then calls itself...\n\nThe execution of countdown begins with\
    \ n=1, and since n is not zero, it outputs the value 1, and then calls itself...\n\
    \nThe execution of countdown begins with n=0, and since n is zero, it outputs\
    \ the word \"Blastoff!\" and returns.\n\nThe countdown that got n=1 returns.\n\
    \nThe countdown that got n=2 returns.\n\nThe countdown that got n=3 returns.\n\
    \nAnd you're back in main (what a trip). So the total output looks like:\n\n+\
    \   3\n2\n1\nBlastoff!\n\nAs a second example, let's look again at the functions\
    \ newLine and threeLine."
  - "[PAGE 43]\n\n```\nvoid newLine() {\n  cout << endl;\n}\n```\n\n```\nvoid threeLine()\
    \ {\n  newLine(); newLine(); newLine();\n}\n```\n\nAlthough this work, they would\
    \ not be much help if I wanted to output 2 newlines, or 106. A better alternative\
    \ would be\n\n```\nvoid nLines(int n) {\n  if (n > 0) {\n    cout << endl;\n \
    \   nLines(n-1);\n  }\n```\n\nThis program is similar to countdown: as long as\
    \ n is greater than zero, it outputs one newline, and then calls itself to output\
    \ n-1 additional newlines. Thus, the total number of newlines is 1 + (n-1), which\
    \ usually comes out to roughly n.\n\nThe process of a function calling itself\
    \ is called recursion, and such functions are said to be recursive.\n\n# 4.8 Infinite\
    \ recursion\n\nIn the examples of the previous section, notice that each time\
    \ the functions get recursively, the argument gets smaller by one, so eventually\
    \ it gets to zero. When the argument is zero, the function returns immediately,\
    \ without making any recursive calls. This case—when the function completes without\
    \ making a recursive call—is called the base case.\n\nIf a recursion reaches a\
    \ base, it will go on making recursion forever and the program will terminate.\
    \ This is known as infinite recursion, and it is generally not considered a good\
    \ idea.\n\nIn most programming environments, a program with an infinite recursion\
    \ will not run forever. Eventually, something will break and the program will\
    \ report an error. This is the first example we have of a run-time error (an error\
    \ that does not appear until you run the program).\n\nYou should write a small\
    \ program that recurses forever and run it to see what happens.\n\n# 4.9 Stack\
    \ diagrams for recursive functions\n\nIn the previous chapter we used a stack\
    \ diagram to represent the state of a program during a function call. The same\
    \ kind of diagram can make it easier"
