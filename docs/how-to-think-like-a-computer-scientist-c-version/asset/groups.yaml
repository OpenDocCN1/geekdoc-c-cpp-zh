    \ only a couple of functions you can invoke on an avector. One of them is very\
    \ useful though; surprisingly, it returns the length of the vector (the number\
    \ of elements).\n\nIt is a good idea to use this value as the upper bound of a\
    \ loop, rather than a constant. That way, if the size of the vector changes, you\
    \ will not have to go through the program changing all the loops; they will work\
    \ correctly for any size-vector.\n\n```\nfor (int i = 0; i < count.length(); i++)\
    \ {\n  cout << count[i] << endl;\n}\n```\n\nThe last time the body of the loop\
    \ gets executed, count.length() - 1, which is the index of the last element. When\
