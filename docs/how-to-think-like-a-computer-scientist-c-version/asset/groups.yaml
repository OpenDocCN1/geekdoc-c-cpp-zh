    \ is not a letter, and non-zero value if it is.\n\nThis oddity is not inconvenient\
    \ as it seems, because it is legal to use this kind of integer in a conditional,\
    \ as all non-zero values are treated as true. The value 0 is treated as false.\n\
    \nTechnically, this sort of thing should not be allowed—integers are not the same\
    \ thing as boolean. Nevertheless, the C++ habit of automatically converting types\
    \ can be useful\n\nOther character classification functions include isdigit, which\
    \ identifies the digits 0 through 9, and isspace, which identifies all kinds of\
    \ \"white\" space, including spaces, tabs, newlines, and a few others. There are\
