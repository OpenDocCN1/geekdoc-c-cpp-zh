  - "[PAGE 156]\n\n# 14.3. COMPLEX NUMBERS 149\n\nI replaced the word `struct` with\
    \ the word `class` and removed the `private:` label. This result of the two definitions\
    \ is exactly the same.\n\nIn fact, anything that can be written as a `struct`\
