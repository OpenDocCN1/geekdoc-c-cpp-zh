    # 7.12 apstrings are mutable


    You can change the letters in an apstring one at a time using the [] operator

    in the left side of an assignment. For example,


    ```

    apstring greeting = "Hello, world!";

    greeting[0] = ''J'';

    out << greeting << endl;

    ```


    produces the output Jello, world.


    # 7.13 apstrings are comparable


    All the comparison operators that work on ints and doubles also work on apstrings.
    For example, if you want to know if two strings are equal:


    ```

    if (word == "banana") {

    out cout << "Yes, we have no bananas!" << endl;

