    **return value:** The value provided as the result of a function call.


    **dead code:** Part of a program that can never be executed, often because it
    appears after a `return` statement.


    **scaffolding:** Code that is used during program development but is not part
    of the final version.


    **void:** A special return type that indicates a void function; that is, that
    one that does not return a value.


    **overloading:** Having more than one function with the same name but different
    parameters. When you call an overloaded function, C++ knows which version to use
    by looking at the arguments you provide.


    **boolean:** A value or variable that can take on one of two states, often called
    `true` and `false`. In C++, boolean values can be stored in a variable type `bool`.


    **flag:** A variable (usually type `bool`) that records a condition or status
    information.


    **comparison operator:** An operator that compares two values and produces a boolean
    that indicates the relationship between the operands.


    **logical operator:** An operator that combines boolean values in order to test
    compound conditions.'
