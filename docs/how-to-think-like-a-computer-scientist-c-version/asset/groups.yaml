    \ counts from 0 to 4; when the loop variable i is 4, the condition fails and the\
    \ loop terminates. Thus, the body of the loop is only executed when i is 0, 1,\
    \ 2 and 3.\n\nEach time through the loop we use i as an index into the vector,\
    \ outputting the ith element. This type of vector traversal is very common. Vectors\
    \ and loops go together like beans and a nice Chianti.\n\n# 10.2 Copying vectors\n\
    \nThere is one constructor for avector, which is called a copy constructor because\
    \ it takes one avector as an argument and creates a new vector that is the same\
    \ size, with the same elements.\n\n```\navector<int> copy(count);\n```\n\nAlthough\
    \ this syntax is legal, it is almost never used for avectors there is a better\
    \ alternative:\n\n```\navector<int> copy = count;\n```\n\nThe = operator works\
    \ on avectors pretty much the way you would expect.\n\n# 10.3 for loops\n\nThe\
    \ loops we have written so far have a number of elements in common. All of them\
    \ start by initializing a variable; they have a test, or condition, that depends\
    \ on that variable; and inside the loop they do something to that variable, like\
    \ increment it.\n\nThis type of loop is so common that there is an alternate loop\
    \ statement, called for, that expresses it more concisely. The general syntax\
    \ looks like this:\n\n```\nfor (INITIALIZER; CONDITION; INCREMENTOR) {\n  BODY\n\
    }\n```"
  md: "\n## CHAPTER 9. MORE STRUCTURES\n\nBut if we have the insight to treat times\
    \ as base 60 numbers, and make the investment of writing the conversion functions\
    \ (convertToSeconds and makeTime), we get a program that is shorter, easier to\
    \ read and debug, and is more reliable.\n\nIt is also easier to add more features.\
    \ For example, imagine subtracting Two Times in lieu. The naive approach would\
    \ be to implement subtraction with borrowing. Using the conversion functions would\
    \ be easier and more likely to be correct.\n\nIronically, making a problem harder\
    \ (more general) makes easier (few special cases, fewer opportunities for error).\n\
    \n## 9.11 Algorithms\n\nWhen you write a general solution for a class of problems,\
    \ opposed to a specific solution to a single problem, you have written an algorithm.\
    \ I mentioned this word in Chapter 1, but did not define it carefully. It is not\
    \ easy to define, so I will try a couple of approaches.\n\nFirst, consider something\
    \ that is not an algorithm: a few tricks. When you learned to multiply single-digit\
    \ numbers, you probably remembered the multiplication table. In effect, you memorized\
    \ 100 specific solutions. That kind of knowledge is not really algorithmic.\n\n\
    But if you were “lazy,” you probably learned learning a few tricks. For example,\
    \ to find the product of $n$ and $9$, you can write $n-1$ as the first digit and\
    \ $10-n$ as the second digit. This is a general solution for multiplying any single-digit\
    \ by 9. That’s an algorithm!\n\nSimilarly, the techniques you learned for carrying,\
    \ subtraction with borrowing, and long division are all algorithms. One of the\
    \ characteristics of algorithms is that they do not require intelligence to carry\
    \ out. They are mechanical processes in which each step follows the last according\
    \ to a simple set of rules.\n\nIn my opinion, it is embarrassing that humans spend\
    \ so much time in learning to execute algorithms, that quite literally, require\
    \ no intelligence.\n\nOn the other hand, the process of designing algorithms is\
    \ interesting, intellectually challenging, and a central part of what we call\
    \ programming.\n\nSome of the things people do naturally, without difficulty or\
    \ conscious thought, are the difficult to express algorithmically. Understanding\
    \ natural language is a good example. We all do it, but so far no one has been\
    \ able to explain how we do, at least in the form of an algorithm.\n\nLater in\
    \ this book, you will have the opportunity to design simple algorithms for a variety\
    \ of problems. Data Structures, which you will see in the next class in the Computer\
    \ Science sequence, will show some of the most interesting, clever, and useful\
    \ algorithms computer science has produced.\n\n## 9.12 Glossary\n\n- **instance:**\
    \ An example from a category. My cat is an instance of the category “feline things.”\
    \ Every object is an instance of some type.\n- **instance variable:** One of the\
    \ named data items that make up an structure. Each structure has its own copy\
    \ of the instance variables for its type that cannot be modified.\n- **constant\
    \ reference parameter:** A parameter that is passed by reference but that cannot\
    \ be modified.\n- **pure function:** A function whose result depends only on its\
    \ parameters, and that has so effects other than returning a value.\n- **functional\
    \ programming style:** A style of program design in which the majority of functions\
    \ are pure.\n- **modifier:** A function that changes one or more of the objects\
    \ it receives as parameters, and usually returns void.\n- **fill-in function:**\
    \ A function that takes an “empty” object as a parameter and fills it its instance\
    \ variables instead of generating a return value.\n- **algorithm:** A set of instructions\
    \ for solving a class of problems by a mechanical, unintelligent process.\n\n\
    ## Chapter 10\n\n## Vectors\n\nA **vector** is a set of values where each value\
    \ is identified by a number (called an index). An string is similar to a vector,\
    \ since it is made up of an indexed set of characters. The nice thing about vectors\
    \ is that they can be made up of any type of element, including basic types like\
    \ ints and doubles, and user-defined types like Point and Time.\n\nThe vector\
    \ type that appears on the AP exam is called **vector**. In order to use it, you\
    \ have to include the header file `vector.h`; the details of how to do that depend\
    \ on your programming environment.\n\nYou can create a vector the same you create\
    \ other variable types:\n\n```\nvector<int> count;\nvector<double> doubleVector;\n\
    ```\n\nThe type that makes up the vectors appears in angle brackets (< >). The\
    \ first line creates a vector of integers named count; the second creates a vector\
    \ of doubles. Although these statements are legal, they are not very useful because\
    \ they create vectors that no elements (their length is zero). It is more common\
    \ to specify the length of the vector in parentheses:\n\n```\nvector<int> count(4);\n\
    ```\n\nThe syntax is a little odd; it looks like a combination of a variable declaration\
    \ and a function call. In fact, that's exactly what it is. The function we are\
    \ invoking is an **vector** constructor. A **constructor** is a special function\
    \ that creates new objects and initializes their instance variables. In this case,\
    \ the constructor takes a single argument, which is the size of the new vector.\n\
    \nThe following figure shows how vectors are represented in state diagrams:\n\n\
    count\n\n| 0 | 1 | 2 | 3 |\n|---|---|---|---|\n| 0 | 0 | 0 | 0 |\n\nThe large\
    \ numbers inside the boxes are the **elements** of the vector. The small numbers\
    \ outside the boxes are the indices used to identify each box. When you allocate\
    \ a new vector, the elements are not initialized. They could contain any values.\n\
    \nThere is another constructor for **apvectors** that takes two parameters; the\
    \ second is a “fill value”, the value that will be assigned to each of the elements.\n\
    \n```\napvector<int> count (4, 0);\n```\n\nThis statement creates a vector of\
    \ four elements and initializes all of them to zero.\n\n## 10.1 Accessing elements\n\
    \nThe [] operator reads and writes the elements of a vector in much the same way\
    \ it accesses the characters in an apstring. As apstrings, the indices start at\
    \ zero, so `count[0]` refers to the “zeroth” element of the vector, and `count[1]`\
    \ refers to the “oneth” element. You can use the [] operator anywhere in an expression:\n\
    \n```\ncount[0] = 7;\ncount[1] = count[0] * 2;\ncount[2]++;\ncount[3] -= 60;\n\
    ```\n\nAll of these are legal assignment statements. Here is the effect of this\
    \ code fragment:\n\ncount\n\n| 0 | 1 | 2 | 3 |\n|---|---|---|---|\n| 7 | 14 |\
    \ 1 | -60 |\n\n## 10.2. COPYING VECTORS\n\nSince elements of this vector are numbered\
    \ from 0 to 3, there is no element with the index 4. It is a common error to go\
    \ beyond the bounds of a vector, which causes a run-time error. The program outputs\
    \ an error message like \"Illegal vector index\", and then quits.\n\nYou can use\
    \ any expression as an index, as long as it has type int. One of the most common\
    \ ways to index a vector is with a loop variable. For example:\n\n```\nint i =\
    \ 0;\nwhile (i < 4) {\n  cout << count[i] << endl;\n  i++;\n}\n```\n\nThis loop\
    \ counts from 0 to 4; when the loop variable i is 4, the condition fails and the\
    \ loop terminates. Thus, the body of the loop is only executed when i is 0, 1,\
    \ 2 and 3.\n\nEach time through the loop we use i as an index into the vector,\
    \ outputting the ith element. This type of vector traversal is very common. Vectors\
    \ and loops go together like beans and a nice Chianti.\n\n### 10.2 Copying vectors\n\
    \nThere is one constructor for avector, which is called a copy constructor because\
    \ it takes one avector as an argument and creates a new vector that is the same\
    \ size, with the same elements.\n\n```\navevector<int> copy(count);\n```\n\nAlthough\
    \ this syntax is legal, it is almost never used for avectors there is a better\
    \ alternative:\n\n```\navector<int> copy = count;\n```\n\nThe = operator works\
    \ on avectors pretty much the way you would expect.\n\n## 10.3 for loops\n\nThe\
    \ loops we have written so far have a number of elements in common. All of them\
    \ start by initializing a variable; they have a test, or condition, that depends\
    \ on that variable; and inside the loop they do something to that variable, like\
    \ increment it.\n\nThis type of loop is so common that there is an alternate loop\
    \ statement, called for, that expresses it more concisely. The general syntax\
    \ looks like this:\n\n```\nfor (INITIALIZER; CONDITION; INCREMENTOR) {\n  BODY\n\
    }\n```\n"
  mdcn: "\n\n## 第 9 章：更多结构\n\n但如果我们能洞察到将时间视为60 进制数字，并投入精力编写转换函数（convertToSeconds 和\
    \ makeTime），我们就能得到一个更短、更易读和调试，且更可靠的程序。\n\n添加更多功能也变得更容易了。例如，想象要减去两个时间。原始的方法是实现带借位的减法。使用转换函数会更容易，也更可能是正确的。\n\
    \n讽刺的是，让问题变得复杂（更通用）反而变得简单（特例更少，出错机会减少）。\n\n## 9.11 算法\n\n当你为一组问题编写通用解决方案，而不是单个问题的特定解决方案时，你就写了一个算法。我在第一章提到过这个词，但没有仔细定义它。它很难定义，所以我将尝试两种方法。\n\
    \n首先考虑一种不是算法的东西：技巧。当你学习单数字相乘时，你可能记得乘法表。实际上，你背下了10个特定的解决方案。那种知识并不是真正的算法。\n\n但如果你很“懒”，你可能学会了一些小技巧。例如，为了找到\
    \ $n$ 与 9 的乘积，你可以将 $n-1$ 写在第一位，$10-n$ 写在第二位。这是将任何单数字乘以 9 的通用解决方案。这是一个算法！\n\n同样，你学会的进位、带借位的减法和长除法都是算法。算法的特征之一是执行它们不需要智力。它们是机械过程，每一步都根据一组简单的规则遵循上一步的操作。\n\
    \n在我看来，人类花费这么多时间来学习执行算法是令人尴尬的，因为这些算法字面上来说不需要智力。\n\n另一方面，设计算法的过程是有有趣的、具有智力挑战性的，并且是我们所说的编程的核心部分。\n\
    \n人们自然做到、没有困难或无意识思考的事情，是很难用算法表达的。理解自然语言就是一个很好的例子。我们都能做到这一点，但到为止还没有人能解释我们是如何做到的，至少以算法的形式。\n\
    \n在本书的后面，你将有机会为各种问题设计简单的算法。在计算机科学序列的下一课中看到的数据结构，将展示计算机科学产生的一些有趣、聪明且实用的算法。\n\n\
    ## 9.12 术语表\n\n- **instance (实例):** 某一类别中的示例。我的猫是“猫科动物”这一类的实例。每个对象都是某种类型的实例。\n\
    - **instance variable (实例变量):** 构成结构的一个命名数据项。每个结构都有其对应类型的实例变量的副本，且这些变量不可修改。\n\
    - **constant reference parameter (常量引用参数):** 一个通过引用传递但不能修改的参数。\n- **pure function\
    \ (纯函数):** 结果仅取决于其参数，且除了返回值外没有副作用的函数。\n- **functional programming style (函数式编程风格):**\
    \ 一种程序设计风格，其中大部分函数都是纯函数。\n- **modifier (修改):** 改变其接收的参数的一个或多个对象的函数，通常返回 void。\n\
    - **fill-in function (填充函数):** 接受“空”对象作为参数并填充其实例变量的函数，而不是生成返回值。\n- **algorithm\
    \ (算法):** 一组通过机械的、非智力的过程解决一组问题的指令集。\n\n## 第 10 章\n\n## 向量 (Vectors)\n\n**向量 (vector)**\
    \ 是一个值的集合，其中每个值都由一个数字（称为索引）识别。字符串类似于向量，因为它由一组索引字符组成。向量的很棒之处在于，它可以由任何类型的元素组成，包括像\
    \ ints 和 doubles 这样的基本类型，以及像 Point 和 Time 这样的自定义类型。\n\n在考试中出现的向量类型被称为 **vector**。为了使用它，你必须包含头文件\
    \ `vector.h`；具体操作方法取决于你的编程环境。\n\n你可以像创建其他变量类型一样创建向量：\n\n```\nvector<int> count;\n\
    vector<double> doubleVector;\n```\n\n构成向量的类型出现在角括号 `< >` 中。第一行创建了一个名为 `count`\
    \ 的整数向量；第二行创建了一个双精度浮向量。虽然这些语句是合法的，但它们并不好用，因为它们创建了没有元素的向量（长度为零）。通常做法是在括号中指定向量的长度：\n\
    \n```\nvector<int> count(4);\n```\n\n这种语法有点奇怪；它看起来像变量声明和函数调用的组合。事实上，它确实如此。我们调用的函数是一个\
    \ **vector** 构造函数。**构造函数 (constructor)** 是一种用于创建新对象并初始化其实例变量的特殊函数。在这种情况下，构造函数接受一个参数，即新向量的大小。\n\
    \n下图显示了向量在状态图中是如何表示的：\n\ncount\n\n| 0 | 1 | 2 | 3 |\n|---|---|---|---|\n| 0 |\
    \ 0 | 0 | 0 |\n\n框内的大数字是向量的 **元素 (elements)**。框外的小数字是用于识别每个框的索引。当你分配一个新的向量时，元素不会被初始化。它们可能包含任何值。\n\
    \n**apvectors** 还有另一个构造函数，接受两个参数；第二个是“填充值”，即将赋值给每个元素的值。\n\n```\napvector<int>\
    \ count (4, 0);\n```\n\n此语句创建了一个四个元素的向量，并将它们都初始化为零。\n\n## 10.1 访问元素 (Accessing\
    \ elements)\n\n`[]` 运算符读取和写入向量的元素，就像访问 apstring 的一样。apstring 的索引从0开始，所以 `count[0]`\
    \ 指向第0个元素，`count[1]` 指向第1个元素。你可以在任何表达式中使用 `[]` 运算符：\n\n```\ncount[0] = 7;\ncount[1]\
    \ * 2;\ncount[2]++;\ncount[3] -= 60;\n```\n\n这些都是合法的赋值语句。这段代码的效果如下：\n\ncount\n\
    \n| 0 | 1 | 2 | 3 |\n|---|---|---|---|\n| 7 | 14 | 1 | -60 |\n\n由于向量的元素编号为0到3，不存在索引为4的元素。越向量边界是一个常见错误。程序会输出错误信息“Illegal\
    \ vector index”，然后退出。\n\n索引向量常用的方法之一是使用循环变量。例如：\n\n```\nint i = 0;\nwhile (i <\
    \ 4) {\n  cout << count[i] << endl;\n  i++;\n}\n```\n\n这个循环从0计数到4；当循环变量i为4时，条件失败，循环终止。因此，循环体在i为0、1、2、3时执行。\n\
    \n每次循环，我们使用i作为向量的索引，输出第i个元素。这种类型的向量遍历非常常见。向量和循环就像豆子配红酒一样。\n\n## 10.2 复制向量 (COPYING\
    \ VECTORS)\n\navector有一个构造函数，被称为拷贝构造函数，因为它接受一个avector作为参数，并创建一个大小相同、元素相同的新向量。\n\
    \n```\navector<int> copy(count);\n```\n\n虽然这种语法是合法的，但对于avectors几乎没人这样使用，有一个更好的替代方案：\n\
    \n```\navector<int> copy = count;\n```\n\n= 运算符处理avectors的方式几乎就像你预期的的一样。\n\n##\
    \ 10.3 for 循环 (for loops)\n\n我们目前为止编写的循环有很多共同点。它们都从初始化一个变量开始；有一个依赖于该变量的测试或条件；并且在循环内部它们对该变量进行某种操作，例如递增。\n\
    \n这种循环非常常见，因此有一种可选的循环语句，称为 for，可以更简洁地表达它。通用语法看起来如下：\n\n```\nfor (INITIALIZER;\
    \ CONDITION; INCREMENTOR) {\n  BODY\n}\n```\n\n"
