    \ `assert.h` 头文件后，可以使用断言函数。断言接收一个布尔值作为参数。如果参数为假，它会打印错误并退出。\n\n## 14.11 术表 (Glossary)\n\
    \n- **类 (Class)**：在通用用法中，类是带有成员函数的自定义类型。在 C++ 中，类是一个带有私有实例变量的结构。\n- **访问器函数 (Accessor\
    \ function)**：提供访问（读写）私有实例变量的函数。\n- **不变性 (Invariant)**：一种关于对象的条件，在客户端代码中应始终为真，并应由所有成员函数维护。\n\
    - **前置条件 (Precondition)**：在函数开始时假设为真的条件。如果前置条件不成立，函数可能无法正常工作。如果可能，函数检查其前置条件是一个好习惯。\n\
    - **后置条件 (Postcondition)**：在函数结束时为真的条件。\n\n"
