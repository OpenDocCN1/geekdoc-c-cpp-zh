    \ | |\n| **Denver** | 1450 | 1000 | 2000 | 800 | 0 | | | | |\n| **Detroit** |\
    \ 750 | 300 | 1150 | 1300 | 0 | | | | |\n| **Orlando** | 1400 | 1300 | 1100 |\
    \ 1900 | 1200 | 0 | | | |\n| **Phoenix** | 1850 | 1750 | 2650 | 800 | 2000 | 2100\
    \ | 0 | | |\n| **Seattle** | 2650 | 3000 | 2150 | 2300 | 3100 | 1450 | 0 | 0 |\n\
    \n对角线元素均为零，因为从一个城市到自身的距离为零。此外，由于从 A 到 B 的距离与从 B 到 A 的距离相同，因此没有打印矩阵的上半。\n\n###\
    \ 15.1 流 (Streams)\n\n要从文件获取输入或输出到文件，你必须创建一个 `ifstream` 对象（用于输入文件）或 `ofstream`\
    \ 对象（用于输出文件）。这些对象定义在头文件 `fstream.h` 中，你必须包含它。\n流是一个抽象对象，代表数据从源（如键盘或文件）到目的地（如屏幕或文件）的流动。\n\
    \n## 第 15 章：文件输入/输出与 apmatrix\n\n我们已经处理过两个流：`cin`，其类型为 `istream`；`cout`，其类型为 `ofstream`。`cin`\
    \ 代表从键盘到程序的数据流。每当程序使用 `>>` 运算符或 `getline` 函数时，它就会从输入流中移除一段数据。\n同样，当程序在 `ostream`\
    \ 上使用 `<<` 运算符时，它会向输出流添加一个数据。\n\n### 15.2 文件输入\n\n要从文件中获取数据，我们必须创建一个从文件流向程序的流。我们可以使用\
    \ `ifstream` 构造函数来实现这一点。\n\n```cpp\nifstream infile (\"file-name\");\n```\n\n\
    该构造函数的参数是一个包含你想要打开的文件名的字符串。结果是一个名为 `infile` 的对象，它支持与 `cin` 相同的所有操作，包括 `>>` 和 `getline`。\n\
    \n```cpp\nint x;\napstring line;\n\ninfile >> x;           // 获取单个整数并存储在 x 中\n\
    getline(infile, line); // 获取整行并存储在 line 中\n```\n\n如果我们知道文件中有多少数据，那么编写一个读取文件后停止的循环是简单的。很多情况下，我们想要读取整个文件，但不知道它有多大。\n\
    `ifstream` 有一些成员函数可以检查输入流的状态；它们分别是 `good`、`eof`、`fail` 和 `bad`。我们将使用 `good` 来确保文件已成功打开，并使用\
    \ `eof` 来检测“文件末尾”。每当你从输入流获取数据时，在检查之前你并不知道尝试是否成功。如果 `eof` 的返回值为 `true`，说明我们已经到达文件末尾，并且知道最后一次尝试失败了。这里是一个从文件中读取行并显示在屏幕上的程序：\n\
    \n```cpp\napstring filename = \"...\";\nifstream infile(filename.c_str());\n\n\
    if (infile.good() == false) {\n    cout << \"无法打开名为 \" << filename << \" 的文件\"\
