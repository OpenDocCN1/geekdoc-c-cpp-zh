  mdcn: "\n\n# 第 4 章\n\n# 条件判断与递归\n\n## 4.1 模运算运算符\n\n模运算运算符作用于整数（以及整数表达式），并产生第一个操作数被除以第二个操作数时的余数。在\
    \ C++ 中，模运算运算符是百分号 %。其语法与其他运算符完全相同：\n\n```cpp\nint quotient = 7 / 3;\nint remainder\
    \ = 7 % 3;\n```\n\n第一个运算符（整数除法）产生 2。第二个运算符产生 1。因此，7 除以 3 等 2 余 1。\n\n模运算运算符被证明是异常地有用。例如，你可以检查一个数字是否能被另一个数字整除：如果\
    \ x % y 等于 0，则 x 能够被 y 整除。\n\n此外，你还可以使用模运算从数字中提取最右侧位或数位。例如，x % 10 产生 x 的最右侧位（10\
    \ 进制）。类似地，x % 100 产生最后两位。\n\n## 4.2 条件执行\n\n为了编写有用的程序，你几乎总是需要检查某些条件并相应地改变程序的行为。条件语句赋予了这种能力。简单的形式是\
    \ if 语句：\n\n```cpp\nif (x > 0) {\n    cout << \"x is positive\" << endl;\n}\n\
    ```\n\n括号中的表达式称为条件。如果它为真，则括号中的语句将被执行。如果条件不为真，则什么都不会发生。\n\n条件可以包含任何比较运算符：\n\n```cpp\n\
    x == y // x 等于 y\nx != y // x 不等于 y\nx > y // x 大于 y\nx < y // x 小于 y\nx >= y\
    \ // x 大于或等于 y\nx <= y // x 小于等于 y\n```\n\n尽管这些操作对你来说可能熟悉，但像 =, != 和 <= 的语法是使用单个\
    \ `=` 而不是双 `==`。请记住，=` 是赋值运算符，而 `==` 是比较运算符。此外，不存在用于赋值的 `<` 或 `=`。\n\n条件运算符的两边必须是相同类型。你只能比较\
    \ int 和 double。遗憾的是，在此时你完全无法比较字符串（Strings）！有一种方法可以比较字符串，但我们将在几个过几个章节后才会介绍给你。\n\
    \n## 4.3 备选执行\n\n条件执行的第二形式是备选执行，其中有两种可能性，由条件决定哪一种被执行。语法如下：\n\n```cpp\nif (x==0)\
    \ {\n    cout << \"x is even\" << endl;\n} else {\n    cout << \"x is odd\" <<\
    \ endl;\n}\n```\n\n如果余数 x 除以 2 的结果为 0，那么我们就知道 x 是偶数，这段代码会显示相应的消息。如果条件为假，则执行第二组语句。由于条件必须为真或为假，备选方案中恰好有一个会被执行。\n\
    \n顺便提一下，如果你想检查许多数字的奇偶性（偶数或奇数），你可能想将这段代码“封装”在一个函数中，如下所示：\n\n```cpp\nvoid printParity\
    \ (int x) {\n    if (x==0) {\n        cout << \"x is even\" << endl;\n    } else\
    \ {\n        cout << \"x is odd\" << endl;\n    }\n}\n```\n\n## 4.4 链式条件\n\n现在你有一个名为\
    \ printParity 的函数，它会为你提供的任何整数显示恰当的消息。在 main 函数中，你会这样调用这个函数：\n\n```cpp\nprintParity(17);\n\
    ```\n\n始终记住，当你调用函数时，你不需要声明你提供的参数的类型。C++ 可以判断出它们是什么类型。你应该抵制编写类似 own代码：\n\n```cpp\n\
    int number = 17;\nprintParity (int number);    // 错误！！！\n```\n\n有时你想检查若干相关的条件并从几个动作中选择一个。做到此点的一种方法是链接一系列的\
    \ ifs 和 elses：\n\n```cpp\nif (x > 0) {\n    cout << \"x is positive\" << endl;\n\
    } else if (x < 0) {\n    cout << \"x is negative\" << endl;\n} else {\n    cout\
    \ << \"x is zero\" << endl;\n}\n```\n\n这些链可以根据你的需要任意长，尽管如果它们失控，将会变得难以阅读。让它们更易读的一种方法是使用标准缩进，如这些示例所示。如果你保持所有语句和花括号对齐，你就不太可能犯语法错误，而且如果真的错了，你也可以更快地找到它们。\n\
    \n## 4.5 嵌套条件\n\n除了链式，你还可以将一个条件嵌套在另一个条件之中。你可以将上一个示例写为：\n\n```cpp\nif (x == 0)\
    \ {\n    cout << \"x is zero\" << endl;\n} else {\n    if (x > 0) {\n        cout\
    \ << \"x is positive\" << endl;\n    } else {\n        cout << \"x is negative\"\
    \ << endl;\n    }\n}\n```\n\n现在有一个包含两个分支的外部条件语句。第一个分支包含一个简单的输出语句，但第二个分支包含另一个 if\
    \ 语句，该语句又有自己的两个分支。幸运的是，这两个分支都是输出语句，尽管它们也可以是条件语句。\n\n再次注意，缩进使得结构显而易见，尽管如此，嵌套条件会很快变得难以阅读。通常情况下，在可以的情况下避免它们是一个好主意。\n\
    \n另一方面，这种嵌套结构很常见，我们也将再次看到它，所以你最好习惯它。\n\n## 4.6 return语句\n\nreturn 语句允许你在到达末尾时终止函数的执行。使用它的一种方法是你检测到错误条件：\n\
    \n```cpp\n#include <math.h>\n\nvoid printLogarithm(double x) {\n    if (x <= 0.0)\
    \ {\n        cout << \"Positive numbers only, please.\" << endl;\n        return;\n\
    \    }\n\n    double result = log(x);\n    cout << \"The log of x is \" << result;\n\
    }\n```\n\n这定义了一个名为 printLogarithm 的函数，它接受一个 double x 作为参数。它做的第一件事是检查 x 是否小于等于零，如果是，它会显示错误消息并使用\
    \ return 退出函数。执行流立即返回调用者，函数的剩余行将不会执行。\n\n## 4.7 递归\n\n在上一节的示例中，注意每次函数递归调用时，参数都会减小，所以最终会变为零。当参数为零时，函数立即返回，而不进行任何递归调用。这种在不进行递归调用的情况被称为基准情况（base\
    \ case）。\n\n如果递归没有基准，它将无限进行递归，这被称为无限递归，通常不被认为是一个好主意。\n\n在大多数编程环境中，无限递归的程序不会永远运行。最终某些将会崩溃并报告错误。这是我们的第一个运行时错误（运行程序才会出现的错误）。\n\
    \n你应该编写一个无限递归的小程序并运行看看发生什么。\n\n作为第二个示例，让我们再次查看 newLine 和 threeLine。\n\n```cpp\n\
    void newLine() {\n  cout << endl;\n}\n```\n\n```cpp\nvoid threeLine() {\n  newLine();\
    \ newLine(); newLine();\n}\n```\n\n虽然这些方法有效，但如果我想输出 2 个换行，它们将没有太大帮助。一种更好的替代方案是：\n\
    \n```cpp\nvoid nLines(int n) {\n  if (n > 0) {\n    cout << endl;\n    nLines(n-1);\n\
    \  }\n}\n```\n\n这个程序类似于倒计时：只要 n 大于零，它就会输出一个换行，然后调用自己输出额外的 n-1 个换行。因此，换行的总数是 1\
    \ + (n-1)，通常结果为 n。\n\n函数调用自己的过程称为递归，这样的函数被称为递归函数。\n\n## 4.8 无限递归\n\n然后你回到了 main（真是一场大旅行！）。所以总输出看起来如下：\n\
    \n+   3\n2\n1\nBlastoff!\n\n## 4.9 递归函数的堆栈图\n\n在上一章中，我们使用堆栈图来表示函数调用期间的程序状态。类似的图表可以变得更容易\n\
    \n"
