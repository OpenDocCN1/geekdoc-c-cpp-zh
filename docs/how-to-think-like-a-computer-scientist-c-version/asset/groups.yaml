    \ \"The log of x is \" << result;\n}\n```\n\nThis defines a function named printLogarithm\
    \ that takes a double x as a parameter. The first thing it does is check whether\
    \ x is less than equal to zero, in which case it displays an error message and\
    \ uses return to exit the function. The flow of execution immediately returns\
    \ to the caller and the remaining lines of the function are not executed.\n\n\
    ## 4.7 Recursion\n\nIn the examples of the previous section, notice that each\
    \ time the functions get recursively, the argument gets smaller by one, so eventually\
    \ it gets to zero. When the argument is zero, the function returns immediately,\
    \ without making any recursive calls. This case—when the function completes without\
    \ making a recursive call—is called the base case.\n\nIf a recursion reaches a\
    \ base, it will go on making recursion forever and the program will terminate.\
    \ This is known as infinite recursion, and it is generally not considered a good\
    \ idea.\n\nIn most programming environments, a program with an infinite recursion\
    \ will not run forever. Eventually, something will break and the program will\
    \ report an error. This is the first example we have of a run-time error (an error\
    \ that does not appear until you run the program).\n\nYou should write a small\
    \ program that recurses forever and run it to see what happens.\n\nAs a second\
    \ example, let's look again at the functions newLine and threeLine.\n\n```cpp\n\
    void newLine() {\n  cout << endl;\n}\n```\n\n```cpp\nvoid threeLine() {\n  newLine();\
    \ newLine(); newLine();\n}\n```\n\nAlthough this work, they would not be much\
    \ help if I wanted to output 2 newlines, or 106. A better alternative would be\n\
    \n```cpp\nvoid nLines(int n) {\n  if (n > 0) {\n    cout << endl;\n    nLines(n-1);\n\
    \  }\n}\n```\n\nThis program is similar to countdown: as long as n is greater\
    \ than zero, it outputs one newline, and then calls itself to output n-1 additional\
    \ newlines. Thus, the total number of newlines is 1 + (n-1), which usually comes\
    \ out to n.\n\nThe process of a function calling itself is called recursion, and\
    \ such functions are said to be recursive.\n\n## 4.8 Infinite recursion\n\n(Wait,\
