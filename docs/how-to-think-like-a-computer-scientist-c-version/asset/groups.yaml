    \ than poetry, but still often ambiguous.\n- **Programs:** The meaning of a computer\
    \ program is unambiguous and literal, and can be understood entirely by analysis\
    \ of the tokens and structure.\n\n## 1.5 THE FIRST PROGRAM\n\nHere are some suggestions\
    \ for reading programs (and other formal languages). First, remember that formal\
    \ languages are much denser than natural languages, so it takes longer to read\
