    \n另一个漏洞是，只有当不变性在函数开始时为真时，我们才需要维护它。否则，一切作数。如果不变性在程序的其他地方被违反，通常我们能做的最好就是检测错误、输出错误消息并退出。\n\
    \n## 14.9 前置条件 (Preconditions)\n\n当你写一个函数时，你会对接收到的参数做出隐式假设。如果这些假设被证明是真的，那么一切正常；否则，你的程序可能会崩溃。\n\
    \n为了让你的程序更健壮，显式地考虑你的假设是一个好习惯，将它们作为程序的一部分记录下来，并编写代码来检查它们。\n\n例如，让我们再次观察 `calculateCartesian`。我们是否对当前对象做了某种假设？是的，我们假设极坐标是有效的。\n\
    \n```cpp\nvoid calculateCartesian ()\n// 前置条件：polar 标志被设置\n// 后置条件：real 和 imag\
