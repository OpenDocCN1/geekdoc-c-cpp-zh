    # 7.11. STRING CONCATENATION


    # 7.11 String concatenation


    Interestingly, the + operator can be used on strings; it performs concatenation.
    To concatenate means to join the operands end to end. For example:


    ```

    apstring fruit = "banana";napstring bakedGood = "put bread";

    apstring dessert = fruit + bakedGood;

    cout << endl;

    ```


    The output of this program is banana nut bread.

    unfortunately, the + operator does not work on native C strings, so you cannot
    write something like


    ```

    apstring dessert = "banana" + " nut bread";

    ```


    because both operands are C strings. As long as one of the operands is an apstring,
    C++ will automatically convert the other.

    It is also possible to concatenate a character onto the beginning or end of an
    apstring. In the following example, we will use concatenation and character arithmetic
    to output an abecedarian series.


    "Abecedarian" refers to a series or list in which the elements appear in alphabetical
    order. For example, in Robert McCloskey''s book Make Way for Ducklings, the names
    of the ducklings are Jack, Kack, Lack, Mack, Nack, Onack, Pack and Quack. Here
    is a list that outputs these names in order:


    ```

    apstring suffix = "ack";


    char letter = ''J'';

    while (letter <= ''Q'') {

    cout << letter + suffix << endl;

    letter++;

    }

    ```


    The output of this program is:


    +   - Jack

    - Kack

    - Lack

    - Mack

    - Nack

    - Oack

    - Pack

    - Quack'
