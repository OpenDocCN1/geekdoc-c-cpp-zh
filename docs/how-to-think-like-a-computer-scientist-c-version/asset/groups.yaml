    # ## 11.1 Objects and functions


    C++ is generally considered an object-oriented programming language, which means
    that it provides features that support object-oriented programming.

    It''s not easy to define object-oriented programming, but we have already seen
    some features of it:


    +   1. Programs are made up of a collection of structure definitions and function
    definitions, where most of the functions operate on specific kinds of structures
    (or objects).


    +   2. Each structure definition corresponds to some object or concept in the
    real world, and the functions that operate on that structure correspond to the
    ways real-world objects interact.


    For example, the Time structure defined in Chapter 9 obviously corresponds to
    the way people record the time of day, and the operations we defined correspond
    to the sorts of things people do with records. Similarly, the Point and Rectangle
    structures correspond to the mathematical concept of a point and a rectangle.


    So far, we have not taken advantage of the features C++ provides to support object-oriented
    programming. Strictly speaking, these features are not necessary. The most part
    they provide an alternate syntax for doing things we have already done, but in
    many cases the alternate syntax is more concise and accurately conveys the structure
    of the program.


    For example, in the Time program, there is no obvious connection between the structure
    definition and the function definitions that follow. With some examination, it
    is apparent that every function takes at least one Time structure as a parameter.


    This observation is the motivation for member functions. Member functions differ
    from the other functions we have written in two ways:'
