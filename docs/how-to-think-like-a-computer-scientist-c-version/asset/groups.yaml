  md: "\n## 1.3.4 Experimental debugging\n\nOne of the most important skills you should\
    \ acquire from working with this book is debugging. Although it can be frustrating,\
    \ debugging is one of the most intellectually rich, challenging, and interesting\
    \ parts of programming.\n\nIn some ways debugging is like detective work. You\
    \ are confronted with clues and have to infer the processes and events that lead\
    \ to the results you see.\n\nDebugging is also like an experimental science. If\
    \ you have an idea you modify your program and try again. If your hypothesis was\
    \ correct, you debug the modification, and take a step closer to a working program.\
    \ If your hypothesis was wrong, you have to come up with a new one. As Sherlock\
    \ Holmes pointed out, \"When you eliminated the impossible, however, must be the\
    \ truth.\" (from Conan Doyle's The Sign of Four).\n\nFor some people, programming\
    \ and debugging are the same. That is, programming is the process of gradually\
    \ debugging a program until it does what you want. The idea is that you should\
    \ always start with a working program that does you something, and make small\
    \ modifications, debugging it as you go, so that you have a working program.\n\
    \nFor example, Linux is an operating system that contains thousands of lines of\
    \ code, but it started as a simple program Linus Torvalds used to explore the\
    \ Intel 8038 chip. According to Larry Greenfield, \"One of Linux's early projects\
    \ was a program that would switch between AAAA and BBBB. This later evolved into\
    \ Linux (from The Linux Users' Guide Beta Version 1).\n\nIn later chapters I will\
    \ make more suggestions about debugging and other programming practices.\n\n##\
    \ 1.4 Formal and natural languages\n\nNatural languages are the languages that\
    \ people speak, like English, Spanish, and French. They were not designed by people\
    \ (although people try to impose order on them); they evolved naturally.\n\nFormal\
    \ languages are languages that are designed by people for specific applications.\
    \ For example, the notation that mathematicians use is a formal language that\
    \ is particularly good at denoting relationships among numbers and symbols. Chemists\
    \ use a formal language to represent the chemical structure of molecules. And\
    \ most importantly:\n\nProgramming languages are formal languages that have been\
    \ designed to express computations.\n\nAs I mentioned before, formal languages\
    \ tend to have strict rules about syntax. For example, $3+3=6$ is a syntactically\
    \ correct mathematical statement, but $3=+6$ is not. Also, $H_2O$ is a syntactically\
    \ correct chemical name, but $H_2Oz$ is not.\n\nSyntax rules come in two flavors,\
    \ pertaining to tokens and structure. Tokens are the basic elements of the language,\
    \ like words and numbers and chemical elements. One of the problems with $3+=6$\
    \ is that $=$ is not a legal token in mathematics (at least as I know). Similarly,\
    \ $2Zz$ is not legal because there is no element with the abbreviation $Zz$.\n\
    \nThe second type of syntax error pertains to the structure of a statement; that\
    \ is, the way the tokens are arranged. The $3+=6$ is structurally illegal, because\
    \ you can't have a plus sign immediately after an equals sign. Similarly, molecular\
    \ formulas must have subscripts after the element name, not before.\n\nWhen you\
    \ read a sentence in English or a statement in a formal language, you have to\
    \ figure out what structure of the sentence is (although in a natural language\
    \ you do this unconsciously). This process is called **parsing**.\n\nFor example,\
    \ when you hear the sentence, \"The other shoe fell,\" you understand that \"\
    the other shoe\" is the subject and \"fell\" is the verb. Once you have parsed\
    \ a sentence, you can figure out what it means, that is, the semantics of the\
    \ sentence. Assuming that you know what shoe and what it means to fell, you will\
    \ understand the general implication of this sentence.\n\nAlthough formal and\
    \ natural languages have many features in common—tokens, structure and semantics—there\
    \ are many differences.\n\n- **ambiguity:** Natural languages are full of ambiguity,\
    \ which people deal with by using context and other information. Formal languages\
    \ are designed to be nearly or completely unambiguous, which means that any statement\
    \ has exactly one meaning, regardless of context.\n- **redundancy:** In order\
    \ to make up for ambiguity and avoid misunderstandings, natural languages employ\
    \ lots of redundancy. As a result, they are often verbose. Formal languages are\
    \ less redundant and more concise.\n- **literalness:** Natural languages are full\
    \ of idiom and metaphor. If I say, \"The other shoe fell,\" there is probably\
    \ no shoe and nothing falling. Formal languages mean exactly what they say.\n\n\
    People who grow up speaking a natural language (everyone) often have a hard time\
    \ adjusting to formal languages. In some ways the difference between formal and\
    \ natural language is the difference between poetry and prose, but so:\n\n- **Poetry:**\
    \ Words are used for their sounds as well as for their meaning, and the whole\
    \ poem creates an effect or emotional response. Ambiguity is not only common but\
    \ often deliberate.\n- **Prose:** The literal meaning of words is more important\
