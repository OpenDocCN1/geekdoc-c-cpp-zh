    \ secs) ...\n\nvoid Time::print () const ...\n\nbool Time::after (const Time&\
    \ time2) const ...\n\nTime::add (const Time& t2) const ...\n\ndouble Time::convertToSeconds\
    \ () const ...\n```\n\nIn this case the definitions in Time.cpp appear in the\
    \ same order as the declarations in Time.h, although it is not necessary.\n\n\
    On the other hand, it is necessary to include the header file using an include\
    \ statement. That while the compiler is reading the function definitions, it knows\
    \ enough about the structure to check the code and catch errors.\n\nFinally, main.cpp\
    \ contains the function main along with any functions we are not members of the\
    \ Time structure (in this case there are none):\n\n```cpp\n#include <iostream.h>\n\
    #include \"Time.h\"\n\nvoid main () {\n    Time currentTime(9, 14, 30.0);\n  \
