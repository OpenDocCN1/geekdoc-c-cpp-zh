    # 3.3 Math functions


    In mathematics, you have probably seen functions like sin and log, and you have
    learned to evaluate expressions like sin$(\pi/2)$ and log$(1/x)$. First, you evaluate
    the expression in parentheses, which is called the **argument** of the function.
    For example, $\pi/2$ is approximately 1.571, and $1/x$ is 0.1 (if $x$ happens
    to be 10).


    Then you can evaluate the function itself, either by looking it up in a table
    or by performing calculations. The log of 1.571 is 1, and the log of 1 is (assuming
    that log indicates the logarithm base 10).


    This process can be applied repeatedly to evaluate more complicated expressions
    like log$(1/\sin(\pi/2))$. First we evaluate the argument of the innermost function,
    then evaluate the function, and so on.


    C++ provides a set of built-in functions that includes most of the mathematical
    operations you can think of. The math functions are invoked using a syntax that
    is similar to mathematical notation:


    ```

