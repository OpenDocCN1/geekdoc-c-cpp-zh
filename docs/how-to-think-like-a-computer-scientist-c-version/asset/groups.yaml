  - "[PAGE 89]\n\n# 8.9 Structures as return types\n\nYou can write functions that\
    \ return structures. For example, findCenter takes a Rectangle as an argument\
    \ and returns a Point that contains the coordinates of the center of the Rectangle:\n\
    \n```\nPoint findCenter (Rectangle& box)\n{\n    double x = box.corner.x + box.width/2;\n\
    \    double y = box.corner.y + box.height/2;\n    Point result = {x, y};\n   \
    \ return result;\n}\n```\n\nTo call this function, we have to pass a box as an\
    \ argument (notice that it is being passed by reference), and assign the value\
    \ to a Point variable:\n\n```\nRectangle box = {0.0, 0.0, 100, 200};\nPoint center\
    \ = findCenter(box);\nprintPoint(center);\n```\n\nThe output of this program is\
    \ (50, 100).\n\n# 8.10 Passing other types by reference\n\nIt is not just structures\
    \ that can be passed by reference. All the other types we've seen can, too. For\
    \ example, to swap integers, we could write something like:\n\n```\nvoid swap\
    \ (int& x, int& y)\n{\n    int temp = x;\n    x = y;\n    y = temp;\n}\n```\n\n\
    We would call this function in the usual way:\n\n```\nint i = 7;\nint j = 9;\n\
    swap(i, j);\ncout << i << j << endl;\n```\n\nThe output of this program is 97.\
    \ Draw a stack diagram for this program to convince yourself it is true. If the\
    \ parameters x and y were declared as reference (without the &), swap would not\
    \ work. It would modify x and y and have no effect on i and j.\n\nWhen people\
    \ start passing things like integers by reference, they often try to use an expression\
    \ as a reference argument. For example:"
  - "[PAGE 90]\n\n# 8.11. GETTING USER INPUT\n\n```\nint i = 7;\nint j = 9;\nswap\
    \ (i, j+1); // WRONG!!\n```\n\nThis is not legal because the expression j+1 is\
    \ not a variable—it does not occupy a location where the reference can refer to.\
    \ It is a little tricky to figure out exactly what kinds of expressions can be\
    \ passed by reference. For now a good rule of thumb is reference arguments have\
    \ to be variables.\n\n# 8.11 Getting user input\n\nThe programs we have written\
    \ so far are pretty predictable; they do the same every time they run. Most of\
    \ the time, though, we want programs that take input from the user and respond\
    \ accordingly.\n\nThere are many ways to get input, including keyboard input,\
    \ mouse movements and button clicks, as well as more exotic mechanisms like voice\
    \ control and retinal scanning. In this text we will consider only keyboard input.\n\
    \nIn the header file iostream.h, C++ defines an object named cin that handles\
    \ input in the same way as cout handles output. To get an integer value from the:\n\
    \n```\nint x;\ncin >> x;\n```\n\nThe >> causes the program to stop executing and\
    \ wait for the user to type something. If the user types a valid integer, the\
    \ program converts it into an integer value and stores it in x.\n\nIf the user\
    \ types something other than an integer, C++ does not report an error, or anything\
    \ sensible like that. Instead, it puts something meaningless in x and continues.\n\
    \nFortunately, there is a way to check if an input statement succeeds. We can\
    \ invoke the good function bool: on cin to check what is called the stream state.\
    \ good returns true: if true, the last input statement succeeded. If not, we know\
    \ that some previous operation failed, and also that the next operation will fail.\n\
    \nThus, getting input from the user might look like this:\n\n```\nint main ()\n\
    {\n  int x;\n// prompt the user for input\n  cout << \"Enter an integer: \";\n\
    \n// get input\n  cin >> x;\n```"
  - "[PAGE 91]\n\n```\n// check and see if the input statement succeeded\nif (cin.good()\
    \ == false) {\n    cout << \"That was not an integer.\" << endl;\n    return -1;\n\
    }\n\n// print the value we got from the user\ncout << x << endl;\n    return 0;\n\
    }\n```\n\ncin can also be used to input an apstring:\n\napstring name:\n\n```\n\
    cout << \"What is your name? \";\ncin >> name;\ncout << name << endl;\n```\n\n\
    Unfortunately, this statement only takes the first word of input, and leaves the\
    \ rest for the next input. So, if you run this program and type your full name,\
    \ it will only output your first name.\n\nBecause of these problems (inability\
    \ to handle errors and funny behavior), avoid using the >> operator altogether,\
    \ unless I am reading data from a source that is known to be error-free.\n\nInstead,\
    \ I use a function in the apstring called getline.\n\napstring name:\n\n```\n\
    cout << \"What is your name? \";\ngetline(cin, name);\ncout << name << endl;\n\
    ```\n\nThe first argument to getline is cin, which is where the input is coming\
    \ from. The second argument is the name of the apstring where you want the result\
    \ to be stored.\n\ngetline reads the entire line until the user hits Return or\
    \ Enter. This is useful for inputting strings that contain spaces.\n\nIn fact,\
    \ getline is generally useful for getting input of any kind. For example, if you\
    \ wanted to type an integer, you could input a string and then check if it is\
    \ a valid integer. If so, you can convert it to an integer value. If not, you\
    \ can print an error message and ask the user to try again.\n\nTo convert a string\
    \ to an integer you can use the atoi function defined in the header file stdlib.h.\
    \ We will get to that in Section 15.4."
