    \ statements and braces lined up, you are less likely to make syntax errors and\
    \ you can find them more quickly if you do.\n\n# 4.5 Nested conditionals\n\nIn\
    \ addition to chaining, you can also nest one conditional within another. You\
    \ could have written the previous example as:\n\n```\nif (x == 0) {\n    cout\
    \ << \"x is zero\" << endl;\n} else {\n    if (x > 0) {\n        cout << \"x is\
    \ positive\" << endl;\n    } else {\n        cout << \"x is negative\" << endl;\n\
    \    }\n}\n```"
  - "[PAGE 41]\n\nThere is now an outer conditional that contains two branches. The\
    \ first branch contains a simple output statement, but the second branch contains\
    \ another if statement, which has two branches of its own. Fortunately, those\
    \ two branches are both output statements, although they could have been conditional\
    \ statements as well.\n\nNotice again that indentation makes the structure apparent,\
    \ but nevertheless, nested conditionals get difficult to read very quickly. In\
    \ general, it is a good idea to avoid them when you can.\n\nOn the other hand,\
    \ this kind of nested structure is common, and we will see it again, so you better\
    \ get used to it.\n\n# 4.6 The return statement\n\nThe return statement allows\
    \ you to terminate the execution of a function you reach the end. One way to use\
    \ it is if you detect an error condition:\n\n```\n#include <math.h>\n\nvoid printLogarithm(double\
    \ x) {\n    if (x <= 0.0) {\n        cout << \"Positive numbers only, please.\"\
    \ << endl;\n        return;\n    }\n\n    double result = log(x);\n    cout <<\
    \ \"The log of x is \" << result;\n}\n```\n\nThis defines a function named printLogarithm\
    \ that takes a double x as a parameter. The first thing it does is check whether\
    \ x is less than equal to zero, in which case it displays an error message and\
    \ uses return to exit the function. The flow of execution immediately returns\
    \ to the caller and the remaining lines of the function are not executed.\n\n\
    I used a floating-point variable on the right side of the condition because there\
    \ is a floating-point variable on the left.\n\nRemember that any time you want\
    \ to use one function from the math library, you have to include the header file\
