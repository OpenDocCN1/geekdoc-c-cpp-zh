    ## 15.9 恰当的距离矩阵\n\n虽然这段代码可以运行，但它的组织并没有想象中那么好。既然我们已经写了一个原型，现在是评估并改进设计的的良好时机。\n\
    现有代码存在哪些问题呢？\n\n- 1. 我们没有预先知道如何创建距离矩阵，因此选择了一个任意数字（50）并将其设为固定大小。更好的做法允许距离矩阵像 `Set`\
    \ 一样扩展。`apmatrix` 类有一个名为 `resize` 的函数，可以实现这一点。\n- 2. 距离矩阵中的数据没有被良好封装。我们必须将一组城市名称和矩阵本身作为参数传递给\
    \ `processLine`，这很不方便。此外，距离矩阵的使用是容易出错的，因为我们没有提供执行错误检查的访问函数。将城市名称的 `Set` 和距离的 `apmatrix`\
