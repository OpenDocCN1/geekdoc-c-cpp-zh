    \ there is an error, you will know exactly where it is.\n- Use temporary variables\
    \ to hold intermediate values so you can output and check them.\n- Once the program\
    \ is working, you might want to remove some of the scaffolding or consolidate\
    \ multiple statements into compound expressions, but only if it does not make\
    \ the program difficult to read.\n\n## 5.3 Composition\n\nAs you should expect\
    \ by now, once you define a new function, you can use it as part of an expression,\
    \ and you can build new functions using existing functions. For example, if someone\
    \ gave you two points, the center of the circle and a point on the perimeter,\
    \ and asked for the area of the circle?\nLet's say the center point is stored\
    \ in the variables xc and yc, and the perimeter point is in xp and yp. The first\
    \ step is to find the radius of the circle, which is the distance between the\
    \ two points. Fortunately, we have a function, does that.\n\n```cpp\ndouble radius\
    \ = distance (xc, yc, xp, yp);\n```\n\nThe second step is to find the area of\
    \ a circle with that radius, and return it.\n\n```cpp\ndouble result = area (radius);\n\
    return result;\n```\n\nWrapping that up in a function, we get:\n\n```cpp\ndouble\
    \ fred (double xc, double yc, double xp, double yp) {\n    double radius = distance\
    \ (xc, yc, xp, yp);\n    double result = area (radius);\n    return result;\n\
    }\n```\n\nThe name of this function is fred, which may seem odd. I will explain\
    \ why in the next section.\n\nThe temporary variables radius and area are useful\
    \ for development and debugging, but once the program is working we can make it\
    \ more concise by composing the functions:\n\n## 5.4 Overloading\n\nIn the previous\
    \ section you might noticed that fred and area perform similar functions—finding\
    \ the area of a circle—but take different parameters. For area, we have to provide\
    \ the radius; for fred we provide two points.\n\nIf two functions do the same\
    \ thing, it is natural to give them the same name. In other words, it would make\
    \ more sense if fred were called area. \n\nHaving more than one function with\
    \ the same name, which is called overloading, in C++, as long as each version\
    \ takes different parameters. So we can go ahead and rename fred:\n\nThis looks\
    \ like a recursive function, but it is not. Actually, this version of area is\
    \ calling the other version. When you call an overloaded function, C++ knows which\
    \ version you want by looking at the arguments that you provide. If you write:\n\
    \n```cpp\ndouble x = area (1.0, 2.0, 4.0, 6.0);\n```\n\nC++ goes looking for a\
    \ function named area that takes a double as an argument, and it uses the first\
    \ version. If you write\n\nC++ uses the second version of area.\n\nMany of the\
    \ built-in C++ commands are overloaded, meaning that there are different versions\
    \ that accept different number or types of parameters.\n\nActually, that remains\
    \ one of the cardinal rules of debugging: make sure that the version of the program\
    \ you are looking at is the version of the program that is running! Some time\
    \ you may find yourself making one change after another in your program, and seeing\
    \ the same thing every time run it. This is a warning sign for one reason or another\
    \ you are not running the version of the program you think you are. To check,\
    \ stick in an output statement (it doesn't matter what it says) and make sure\
    \ the behavior of the program changes accordingly.\n\n## 5.5 Boolean values\n\n\
    The types we have seen so far are pretty big. There are a lot of integers in the\
    \ world, and even more floating-point numbers. By comparison, the set of characters\
    \ is even smaller. Well, there is another type in C++ that is even smaller. It\
    \ is called boolean, and the only values in it are true and false. Without thinking\
    \ about it, we have been using boolean values for the last couple of chapters.\
    \ The condition inside an if statement or a while statement is a boolean expression.\
    \ Also, the result of a comparison operator is a boolean value.\n\n```cpp\nif\
    \ (x == 5) {\n  // doing something\n}\n```\n\nThe operator == compares integers\
    \ and produces a boolean value.\nThe values true and false are keywords in C++,\
    \ and can be used anywhere a boolean expression is called for. For example,\n\n\
    ```cpp\nwhile (true) {\n  // loop forever\n}\n```\n\nis a standard idiom for a\
    \ loop that should run forever (or until it reaches a return or break statement).\n\
    \n## 5.6 Boolean variables\n\nAs usual, for every type of value, there is a corresponding\
    \ type of variable. In C++ the boolean type is called bool. Boolean variables\
    \ work just like the other types:\n\n```cpp\nbool fred;\nfred = true;\nbool testResult\
    \ = false;\n```\n\nThe first line is a simple variable declaration; the second\
    \ line is an assignment, and the third line is a combination of a declaration\
    \ and as assignment, called an initialization.\nAs I mentioned, the result of\
    \ a comparison operator is a boolean, so you can store it in a bool variable\n\
    \n```cpp\nbool evenFlag = (n%2 == 0); // true if n is even\nbool positiveFlag\
    \ = (x > 0); // true if x is positive\n```\n\nand use it as part of a conditional\
    \ statement later\n\n```cpp\nif (evenFlag) { cout << \"n was even when I checked\
    \ it\" << endl;\n}\n```\n\nA variable used in this is called a flag, since it\
    \ flags the presence or absence of some condition.\n\n## 5.7 Logical operators\n\
    \nThere are three logical operators in C++: AND, OR and NOT, which are denoted\
    \ by the symbols && || and !. The semantics (meaning) of these operators are similar\
    \ to their meaning in English. For example x > 0 && x < 10 is true only if x is\
    \ greater than zero AND less than 10.\n\nevenFlag || n3 == 0 is true if either\
    \ of the conditions is true, that is, if evenFlag is true OR the number is divisible\
    \ by 3.\n\nFinally, the NOT operator has the effect of negating or inverting a\
    \ bool expression, so !evenFlag is true if evenFlag is false; that is, if the\
    \ number is odd.\n\nLogical operators often provide a way to simplify nested conditional\
    \ statements. For example, how would you write the following code:\n\n```cpp\n\
    if (x > 0) {\n    if (x < 10) {\n        cout << \"x is positive single digit.\"\
    \ << endl;\n    }\n}\n```\n\n## 5.8 Bool functions\n\nFunctions can return bool\
    \ values just like other type, which is often convenient for hiding tests inside\
    \ functions. For example:\n\n```cpp\nbool isSingleDigit(int x) {\nif (x >= 0 &&\
    \ x < 10) {\n    return true;\n} else {\n    return false;\n}\n}\n```\n\n## 5.9\
    \ Returning from main\n\nNow that we have functions that return values, I can\
    \ let you in on a secret. main is not really supposed to be a void function. It's\
    \ supposed to return an integer:\n\n```cpp\nint main ()\n{\n    return 0;\n}\n\
    ```\n\nThe usual return value of main is 0, which indicates that the program succeeded\
    \ at whatever it was supposed to. If something goes wrong, it is common to return\
    \ -1, or some other value that indicates what kind of error occurred.\n"
