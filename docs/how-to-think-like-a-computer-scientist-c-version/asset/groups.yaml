  md: "\n## 10.10. A HISTOGRAM\n\n9891\n99958\n\nIn each case, the number of appearances\
    \ is within about 1% of the expected value (10,000), we conclude that the random\
    \ numbers are probably uniform.\n\n## 10.10 A histogram\n\nIt is often useful\
    \ to take the data from the previous tables and store them for later access, rather\
    \ than just print them. What we need is a way to store 10 integers. We could create\
    \ 10 integer variables with names like howManyOnes, howManyTwos, etc. But that\
    \ would require a lot of typing, and it would be a real pain we decided to change\
    \ the range of values.\n\nA better solution is to use a vector with length 10.\
    \ That way we can create all store locations at once and we can access them using\
    \ indices, rather than ten different numbers. Here's how:\n\n```cpp\nint numValues\
    \ = 100000;\nint upperBound = 10;\nvector<int> vector = randomVector(numValues,\
    \ upperBound);\nvector<int> histogram(upperBound);\n```\n\n```cpp\nfor (int i\
    \ = 0; i < upperBound; i++) {\n    int count = howMany(vector, i);\nhistogram[i]\
    \ = count;\n}\n```\n\nI called the vector histogram because that's a statistical\
    \ term for a vector of numbers that counts the number of appearances of a range\
    \ of values.\nThe tricky thing is that I am using the loop variable in two different\
    \ ways. First, it is an argument to howMany, specifying which value I am interested\
    \ in. Second, it is an index into the histogram, specifying which location I should\
    \ store the result in.\n\n## 10.11 A single-pass solution\n\nAlthough this code\
    \ works, it is not as efficient as it could be. Every time it calls howMany, it\
    \ traverses the entire vector. In this example we traverse the vector ten times!\n\
    \nIt would be better to make a single pass through the vector. For each value\
    \ in the vector we could find the corresponding counter and increment it. In other\
    \ words, we can use the value from the vector as an index into the histogram.\
    \ Here's what looks like:\n\n```cpp\nvector<int> histogram(upperBound, 0);\n```\n\
    \nThe first line initializes the elements of the histogram to zeroes. That way,\
    \ when we use the increment operator (++) inside the loop, we know we are starting\
    \ from zero. Forgetting to initialize counters is a common error.\n\nAs an exercise,\
    \ encapsulate this code in a function called histogram that takes a vector and\
    \ the range of values in the vector (in this case 0 through 10), and that returns\
    \ a histogram of the values in the vector.\n\n## 10.12 Random seeds\n\nIf you\
    \ run the code in this chapter a few times, you might have noticed that you are\
    \ getting the \"random\" values every time. That's not very random!\n\nOne of\
    \ the properties of pseudandom number generators is that if they start from the\
    \ same place they will generate the same sequence of values. The starting place\
    \ is called a seed; by default, C++ uses the same seed every time you run the\
    \ program.\n\nWhile you are debugging, it is often helpful to see the same sequence\
    \ over over over. That way, when you make a change to the program you can compare\
    \ the output before and after the change.\n\nIf you want to choose a different\
    \ seed for the random number generator, you can use the srand function. It takes\
    \ a single argument, which is an integer between 0 and RAND_MAX.\n\nFor applications,\
    \ like games, you want to see a different random sequence every time the program\
    \ runs. A common way to do that is to use a library function like getofday to\
    \ generate something reasonably unpredictable unpredictable, like the number of\
    \ milliseconds since the last tick, and use that number as a seed. The details\
    \ of how to do that depend on your development environment.\n\n## 10.13 Glossary\n\
    \n**vector:** A named collection of values, where all the values have the same\
    \ type, and each value is identified by an index.\n\n**element:** One of the values\
    \ in a vector. The [] operator selects elements of a vector.\n\n**index:** an\
    \ integer value or value to indicate an element of a vector.\n\n**constructor:**\
    \ a special function that creates a new object and initializes its instance variables.\n\
    \n**deterministic:** a program that does the same thing every time it is run.\n\
    \n**pseudorandom:** a sequence of numbers that appear to be random, but which\
    \ are actually the product of a deterministic computation.\n\n**seed:** a value\
    \ used to initialize a random number sequence. Using the same seed should yield\
    \ the same sequence of values.\n\n**bottom-up design:** a method of program development\
    \ that starts by writing small, useful functions and then assembling them into\
    \ larger solutions.\n\n**histogram:** a vector of integers where each integer\
    \ counts the number of values that fall into a certain range.\n\n## Chapter 11\n\
    \n## Member functions\n\n### 11.1 Objects and functions\n\nC++ is generally considered\
    \ an object-oriented programming language, which means that it provides features\
    \ that support object-oriented programming.\nIt's not easy to define object-oriented\
    \ programming, but we have already seen some features of it:\n\n- 1. Programs\
    \ are made up of a collection of structure definitions and function definitions,\
    \ where most of the functions operate on specific kinds of structures (or objects).\n\
    - 2. Each structure definition corresponds to some object or concept in the real\
    \ world, and the functions that operate on that structure correspond to the ways\
    \ real-world objects interact.\n\nFor example, the Time structure defined in Chapter\
    \ 9 obviously corresponds to the way people record the time of day, and the operations\
    \ we defined correspond to the sorts of things people do with records. Similarly,\
    \ the Point and Rectangle structures correspond to the mathematical concept of\
    \ a point and a rectangle.\n\nSo far, we have not taken advantage of the features\
    \ C++ provides to support object-oriented programming. Strictly speaking, these\
    \ features are not necessary. The most part they provide an alternate syntax for\
    \ doing things we have already done, but in many cases the alternate syntax is\
    \ more concise and accurately conveys the structure of the program.\n\nFor example,\
    \ in the Time program, there is no obvious connection between the structure definition\
    \ and the function definitions that follow. With some examination, it is apparent\
    \ that every function takes at least one Time structure as a parameter.\n\nThis\
    \ observation is the motivation for member functions. Member functions differ\
    \ from the other functions we have written in two ways:\n\n## CHAPTER 11. MEMBER\
    \ FUNCTIONS\n\n- 1. When we call the function, we invoke it on an object, rather\
    \ than just call it. People sometimes describe this process as “performing an\
    \ operation on an object,” or “sending a message to an object.”\n- 2. The function\
    \ is declared inside the struct, in order to make the relationship between the\
    \ structure and the function explicit.\n\nIn the next sections, we will take the\
    \ functions from Chapter 9 and transform them into member functions. One thing\
    \ you should realize is that this transformation is purely mechanical; in other\
    \ words, you can do it just by following a sequence of steps.\n\nAs said, anything\
    \ that can be done with a member function can also be done with a nonmember function\
    \ (sometimes called a free-standing function). But sometimes there is an advantage\
    \ to one over the other. If you are comfortable converting one form to another,\
    \ you will be able to choose the best form for whatever you are doing.\n\n###\
    \ 11.2 print\n\nIn Chapter 9 we defined a structure Time and wrote a function\
    \ named printTime\n\n```cpp\nstruct Time {\n    int hour, minute;\n    double\
    \ second;\n};\n```\n\n```cpp\nvoid printTime(const Time& time) {\n    cout <<\
    \ time.hour << \":\" << time.minute << \":\" << time.second << endl;\n}\n```\n\
    \nTo call this function, we had to pass a Time object as a parameter.\n\n```cpp\n\
    Time currentTime = { 9, 14, 30.0 };\nprintTime(currentTime);\n```\n\nTo make printTime\
    \ into a member function, the first step is to change the name of the function\
    \ from printTime to Time::print. The : operator separates the name of the structure\
    \ from the name of the function; they indicate that this is a member named print\
    \ that can be invoked on a Time structure.\n\nThe next step is to eliminate the\
    \ parameter. Instead of passing an object as an argument, we are going to invoke\
    \ the function on an object.\n\nAs a result, the function no longer have a parameter\
    \ named time. Instead, we have a current object, which is the object the function\
    \ is invoked on. We can refer to the current object using the C++ keyword this.\n\
    \nOne thing makes a little difficult is that this is actually a pointer to a structure,\
    \ rather than a structure itself. A pointer is similar to a reference,\n"
  mdcn: "\n\n## 10.10. 直方图\n\n9891\n99958\n\n在每情况下，出现次数都在预期值（10,000）的约1%范围内，我们得出随机数可能是均匀分布的结论。\n\
    \n## 10.10 直方图\n\n将之前表格中的数据提取并存储以便以后访问通常很有用，而不是仅仅打印它们。我们需要一种存储 10 个整数的方法。我们可以创建\
    \ 10 个名字如 `howManyOnes`、`howManyTwos` 等类的整数变量。但这需要大量的输入工作，而且非常痛苦，因此我们决定改变值的范围。\n\
    \n更好的解决方案是使用一个长度为 10 的 vector。这样我们就可以一次创建所有存储位置，并可以使用索引而不是十个不同的数字来访问它们。方法如下：\n\
    \n```cpp\nint numValues = 100000;\nint upperBound = 10;\nvector<int> vector =\
    \ randomVector(numValues, upperBound);\nvector<int> histogram(upperBound);\n```\n\
    \n```cpp\nfor (int i = 0; i < upperBound; i++) {\n    int count = howMany(vector,\
    \ i);\nhistogram[i] = count;\n}\n```\n\n我将这个 vector 称为 `histogram`（直方图），因为这是一个统计术语，指统计某个范围内值出现次数的数字向量。\n\
    棘手的地方在于，我以两种不同的方式使用了循环变量。首先，它是 `howMany` 的一个参数，指定了我感兴趣的数值。其次，它是 `histogram` 的索引，指定了我应该将结果存储在哪个位置。\n\
    \n## 10.11 单次通过解决方案\n\n虽然这段代码可以工作，但它的效率并不最优。每当调用 `howMany` 时，它都会遍历整个 vector。在这个示例中，我们遍历了十次\
    \ vector！\n\n更好的方法是对 vector 进行单次遍历。对于 vector 中的每个值，我们可以找到对应的计数器并将其递增。换句话说，我们可以将\
    \ vector 中的值作为 `histogram` 的索引。看起来如下：\n\n```cpp\nvector<int> histogram(upperBound,\
    \ 0);\n```\n\n第一行将 `histogram` 的元素初始化为零。这样，当我们在循环内部使用增加运算符（++）时，我们就知道是从零开始的。忘记初始化计数器是一个常见的错误。\n\
    \n作为一个练习，将这段代码封装在一个名为 `histogram` 的函数中，该函数接受一个 vector 和 vector 中的值范围（在本例中为 0 到\
    \ 10），并返回 vector 中值的直方图。\n\n## 10.12 随机种子\n\n如果你运行本章中的代码几次，你可能会注意到你每次得到的“随机”值都是相同的。这并不很随机！\n\
    \n伪随机数生成器的属性之一是，如果它们从相同的地方开始，它们将生成相同的数值序列。起始位置被称为种子（seed）；默认情况下，C++ 在你每次运行程序时都会使用相同的种子。\n\
    \n在调试时，反复看到相同的序列通常很有帮助。这样，当你对程序进行更改时，就可以比较更改前后的输出。\n\n如果你想为随机数生成器选择不同的种子，可以使用\
    \ `srand` 函数。它接受一个参数，即一个 0 到 `RAND_MAX` 之间的整数。\n\n对于应用程序（如游戏），你希望在程序每次运行时看到不同的随机序列。实现的一种常用方法是使用诸如\
    \ `getofday` 之类的库函数来生成合理的不可预测内容，例如自上次 tick 以来的毫秒数，并使用该数字作为种子。具体操作细节取决于你的开发环境。\n\
    \n## 10.13 术语表\n\n**vector:** 一个命名的值集合，其中所有值具有相同类型，每个值都由索引标识。\n\n**element（元素）:**\
    \ vector 中的一个值。`[]` 运算符选择 vector 的元素。\n\n**index（索引）:** 指示 vector 元素的整数值。\n\n\
    **constructor（构造函数）:** 创建新对象并初始化其实例变量的特殊函数。\n\n**deterministic（确定）:** 程序每次运行时都执行相同的操作。\n\
    \n**pseudorandom（伪随机）:** 一个看似随机的数字序列，但实际上是确定性计算的结果。\n\n**seed（种子）:** 用于初始化随机数序列的值。使用相同的种子应该产生相同的数值序列。\n\
    \n**bottom-up design（自底向上设计）** 一程序开发方法，从编写小型实用的函数开始，然后将它们组合成更大的解决方案。\n\n**histogram（直方图）:**\
    \ 整数向量，其中每个整数统计落在特定范围的值个数。\n\n## 第 11 章\n\n## 成员函数\n\n### 11.1 对象与函数\n\nC++ 通常被认为是一种面向对象的编程语言，这意味着它提供了支持面向对象编程的特性。\n\
    定义面向对象编程并不容易，但我们已经看到了它的某些特性：\n\n- 1. 程序由一系列结构定义和函数定义组成，其中大多数函数在特定类型的结构（或对象）上操作。\n\
    - 2. 每个结构定义对应于现实世界中的某些对象或概念，对该结构操作的函数对应于现实世界对象交互的方式。\n\n例如，第 9 章定义的 `Time` 结构显然对应于人们记录一天时间的方式，我们定义的操作对应于人们对记录所做的事情。同样，`Point`\
    \ 和 `Rectangle` 结构对应于点和矩形的数学概念。\n\n到目前为止，我们还没有利用利用 C++ 提供的支持面向对象编程的特性。严格来说，这些特性并不是必须的。它们的大部分只是为我们已经做过的事情提供了一种替代语法，但在许多情况下，这种替代语法更简洁，并更准确地传达了程序的结构。\n\
    \n例如，在 `Time` 程序中，结构定义与随后的函数定义之间没有明显的联系。通过仔细观察可以发现，每个函数至少接受一个 `Time` 结构作为参数。\n\
    \n这一观察是成员函数的动机。成员函数与我们写的其他函数有两点不同：\n\n## 第 11 章 成员函数\n\n- 1. 当我们调用函数时，我们在对象上调用它，而不是仅仅调用它。人们有时将此过程为“在对象上执行操作”或“向对象发送消息”。\n\
    - 2. 函数在结构内部声明，以使结构与函数之间的关系显式。\n\n在接下来的章节中，我们将第 9 章的函数转换为成员函数。你应该意识到，这种转换完全是机械的；也就是说，你只需要按照一系列步骤操作。\n\
    \n正如所说，任何可以用成员函数完成的任务都可以用非成员函数（有时称为自由函数）完成。但有时一种形式比另一种更有优势。如果你习惯在这些形式之间转换，你就能为你正在做的任何事情选择最佳形式。\n\
    \n### 11.2 print\n\n在第 9 章中，我们定义了一个结构 `Time` 并写了一个名为 `printTime` 的函数。\n\n```cpp\n\
    struct Time {\n    int hour, minute;\n    double second;\n};\n```\n\n```cpp\n\
    void printTime(const Time& time) {\n    cout << time.hour << \":\" << time.minute\
    \ << \":\" << time.second << endl;\n}\n```\n\n为了调用此函数，我们必须传递一个 `Time` 对象作为参数。\n\
    \n```cpp\nTime currentTime = { 9, 14, 30.0 };\nprintTime(currentTime);\n```\n\n\
    要将 `printTime` 变成成员函数，第一步是将函数名从 `printTime` 改为 `Time::print`。`:` 运算符将结构名与函数名隔开；它们表示这是一个名为\
    \ `print` 的成员，可以在 `Time` 结构上被调用。\n\n下一步是消除参数。我们不再传递对象作为参数，而是在对象上调用函数。\n\n结果是，函数不再有一个名为\
    \ `time` 的参数。相反，我们有了一个当前对象（current），即函数被调用的那个对象。我们可以使用 C++ 关键字 `this` 来引用当前对象。\n\
    \n让问题变得有点困难的是，这实际上是一个指向结构的指针，而不是结构本身。指针与引用相似，\n\n"
