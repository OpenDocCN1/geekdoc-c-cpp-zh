    \ it is known as the Turing thesis. If you take a course on\nthe Theory of Computation,\
    \ you will have chance to see the proof.\n\nTo give you an idea of what you can\
    \ do with the tools we have learned\nfar, we will evaluate a recursively-defined\
    \ mathematical functions. A recursive\ndefinition is similar to a circular definition,\
    \ in the sense that the definition\ncontains a reference to the thing being defined.\
    \ A truly circular definition is\ntypically not useful:\n\nfrabjous: an adjective\
    \ used to describe something that is franjous.\n\nIf you saw that definition in\
    \ the dictionary, it might be annoyed.\nof the other hand, if you looked up the\
    \ definition of the mathematical function\nfactorial, you might get something\
    \ like\n\n```\n0! = 1\nn! = n · (n - 1)!\n```\n\n(Factorial is denoted with the\
    \ symbol !, which is not to be confused\nwith the C++ logical operator ! which\
    \ means NOT.) This definition says that\nthe factorial of 0 is 1, and the factorial\
    \ of any other value, n is n multiplied\nby the factorial of n-1. So 3! is 3 times\
    \ 2!, which is 2 times 1!, which is 1 times\n0!. Putting it all together, we get\
    \ 3! equal to 3 times 2 times 1 times 1 times, which is\nis 6.\n\nIf you can write\
    \ a recursive definition of something, you can usually write a\nC++ program to\
    \ evaluate it. The first step is to decide what the parameters\nfor this function,\
    \ and what the return type is. With a little thought, you\nshould conclude that\
    \ factorial takes an integer as a parameter and returns an\ninteger:\n\n## 5.10.\
    \ MORE RECURSION\n\n```\nint factorial (int n)\n{\n}\n```\n\nIf the argument happens\
    \ to be zero, all we have to do is return 1:\n\n```\nint factorial (int n)\n{\n\
    \    if (n == 0) {\n        return 1;\n    }\n}\n```\n\nOtherwise, and this is\
    \ the interesting part, we have to make a recursive call to find the factorial\
    \ of $n-1$, and then multiply it by $n$.\n\n```cpp\nint factorial (int n)\n{\n\
    \    if (n == 0) {\n        return 1;\n    } else {\n        int recurse = factorial(n-1);\n\
    \        int result = n * recurse;\n        return result;\n    }\n}\n```\n\n\
    If we look at the flow of execution for this program, it is similar to nLines\
    \ from the previous chapter. If we call factorial with the value 3:\n\nSince 3\
    \ is not zero, we take the second branch and calculate the factorial of $n-1$...\n\
    \nSince 2 is not zero, we take the second branch and calculate the factorial of\
    \ $n-1$...\n\nSince 1 is not zero, we take the second branch and calculate the\
    \ factorial of $n-1$...\n\nSince 0 is zero, we take the first branch and return\
    \ the value 1 immediately without making any recursive calls.\n\nThe return value\
    \ (1) gets multiplied by $n$, which is 1, and the result is returned.\n\nThe return\
    \ value (1) gets multiplied by $n$, which is 2, and the result is returned.\n\n\
    The return value (2) gets multiplied by n, which is 3, and the result, 6, is returned\
    \ to main, or whoever called factorial (3).\nHere is what the stack diagram looks\
    \ like for this sequence of function calls:\n\n| | | | | |\n|---|---|---|---|---|\n\
    | 6 | | | main | |\n| | n: 3 | recurse: 2 | result: 6 | factorial |\n| | n: 2\
    \ | recurse: 1 | result: 2 | factorial |\n| | n: 1 | recurse: 1 | result: 1 |\
    \ factorial |\n| | n: 0 | | | factorial |\n\nThe return values are shown being\
    \ passed back up the stack.\nNotice that the last instance of factorial\n\n##\
    \ 5.11 Leap of faith\n\nFollowing the flow of execution is one way to read programs,\
    \ but as you saw in the previous section, it can quickly become labyrinthine.\
    \ An alternative is what I call the \"leap of faith.\" When you come to a function\
    \ call, instead of following the flow of execution, you assume that the function\
    \ works correctly and returns the appropriate value.\n\nIn fact, you are already\
    \ practicing this leap of faith when you use built-in functions. When you call\
    \ cos or exp, you do not examine the implementations of those functions. You just\
    \ assume that they work, the people who wrote the libraries were programmers.\n\
    Well, the same is true when you call one of your own functions. For example, in\
    \ Section 5.3 we wrote a function isdigit that determines whether a number is\
    \ between 0 and 9. We have convinced ourselves that this function is correct—by\
    \ testing and examination of the code—we can use the function without ever looking\
    \ at the code.\n\nThe same is true of recursive programs. When you get to the\
    \ recursive call, instead of following the flow of execution, you should assume\
    \ that the recursive calls (yield the correct result), and then ask yourself,\
    \ \"Assuming that I find the factorial of n-1, can I compute the factorial of\
    \ n?\" In this case, it is clear that you can, by multiplying by n.\n\nOf course,\
    \ it is a bit strange to assume that the function works correctly\n\nwhen you\
    \ have not even finished writing it, that's why it's called a leap of faith!\n\
    \n## 5.12 One more example\n\nIn the previous example I used temporary variables\
    \ to spell out the steps, and to make the code easier to debug, but I could have\
    \ saved a few lines:\n\n```cpp\nint factorial (int n) {\nif (n == 0) {\n  return\
    \ 1;\n} else {\n  return n * factorial (n-1);\n}\n```\n\nFrom now on I will use\
    \ the more concise version, but I recommend that you use the more explicit version\
    \ while you are developing code. When you have working, you can tighten it up,\
    \ if you are feeling inspired.\n\nAfter factorial, the classic example of a recursively-defined\
    \ mathematical function fibonacci, which has the following definition:\n\n```\n\
    fibonacci(0) = 1\nfibonacci(1) = 1\nfibonacci(n) = fibonacci(n-1) + fibonacci(n-2)\n\
    ```\n\nTranslated into C++, this is\n\n```cpp\nint fibonacci (int n) {\nif (n\
    \ == 0 || n == 1) {\n  return 1;\n} else {\n  return fibonacci (n-1) + fibonacci\
    \ (n-2);\n}\n```\n\nIf you try to follow the flow of execution here, even for\
    \ fairly small values of n, your head explodes. But according to the leap of faith,\
    \ if we assume that the two recursive calls (yes, you can make two recursive calls)\
    \ work correctly, it is clear that we get the result by adding them together.\n\
    \n## 5.13 Glossary\n\n**return type:** The type of value function returns.\n\n\
    **return value:** The value provided as the result of a function call.\n\n**dead\
    \ code:** Part of a program that can never be executed, often because it appears\
    \ after a `return` statement.\n\n**scaffolding:** Code that is used during program\
    \ development but is not part of the final version.\n\n**void:** A special return\
    \ type that indicates a void function; that is, that one does not return a value.\n\
    \n**overloading:** Having more than one function with the same name but different\
    \ parameters. When you call an overloaded function, C++ knows which version to\
    \ use by looking at the arguments you provide.\n\n**boolean:** A value or variable\
    \ that can take on one of two states, often called `true` and `false`. In C++,\
    \ boolean values can be stored in a variable type `bool`.\n\n**flag:** A variable\
    \ (usually type `bool`) that records a condition or status information.\n\n**comparison\
    \ operator:** An operator that compares two values and produces a boolean that\
    \ indicates the relationship between the operands.\n\n**logical operator:** An\
    \ operator that combines boolean values in order to test compound conditions.\n"
  mdcn: "\n\n# 第 5 章.有成效的函数\n\n当然，你可能会好奇这个值被返回给了谁，因为我们从未自己调用过 `main`。事实证明，当系统执行一个程序时，它开始调用\
    \ `main` 的方式与调用所有其他函数几乎完全相同。\n\n甚至还有一些参数是由系统传递给 `main` 的，但我们在一段时间内不会处理它们。\n\n\
    ## 5.10 更多递归\n\n到目前为止，我们学习了 C++ 的一小部分，但你可能感兴趣地知道，这个子集现在是一个完整的编程语言，我的意思是，任何可以计算的内容都可以用这种语言来表达。任何程序都可以只使用我们到目前为止使用的语言特征来编写（实际上，我们需要几条指令来控制键盘、鼠标、磁盘等设备），但仅此而已了。\n\
    \n证明这一点是一项非凡的练习，最早由艾兰·图灵（Alan Turing）完成，他是第一批计算机科学家之一（嗯，也有人认为他是一个数学家）。相应地，它被称为图灵论题（Turing\
    \ thesis）。如果你修过计算理论的课程，你将有机会看到这个证明。\n\n为了让你对我们目前学过的工具能做什么有一个直观的了解，我们将评估一个递归定义的数学函数。递归定义类似于循环定义，从某种意义上说，定义包含了对被定义对象的引用。真正的循环定义通常是没用的：\n\
    \nfrabjous：一个形容词，用来描述某物是 franjous 的。\n\n如果你在字典里看到那个定义，你可能会很困扰。另一方面，如果你查找数学函数 `factorial`（阶乘）的定义，你可能会得到类似的内容：\n\
    \n```\n0! = 1\nn! = n · (n - 1)!\n```\n\n（阶乘用符号 `!` 表示，不要将其与 C++ 的逻辑运算符 `!` 混淆，后者表示“非”）。这个定义说\
    \ 0 的阶乘是 1，任何其他值 $n$ 的阶乘是 $n$ 乘以 $n-1$ 的阶乘。所以 $3!$ 是 3 乘以 $2!$，是 2 乘以 $1!$，是 1\
    \ 乘以 $0!$。将它们结合在一起，我们得到 $3!$ 等于 $3 \\times 2 \\times 1 \\times 1$，即 6。\n\n如果你能写某个内容的递归定义，你通常就可以写一个\
    \ C++ 程序来计算它。第一步是决定这个函数的参数是什么，返回类型是什么。经过思考，你应该得出结论：`factorial` 接受一个整数作为参数并返回一个整数：\n\
    \n## 5.10 更多递归\n\n```\nint factorial (int n)\n{\n}\n```\n\n如果参数恰好是 0，我们做的就是返回\
    \ 1：\n\n```cpp\nint factorial (int n)\n{\n    if (n == 0) {\n        return 1;\n\
    \    }\n}\n```\n\n否则（这是有趣的部分），我们必须进行一次递归调用来找到 $n-1$ 的阶乘，然后将其乘以 $n$。\n\n```cpp\n\
    int factorial (int n)\n{\n    if (n == 0) {\n        return 1;\n    } else {\n\
    \        int recurse = factorial(n-1);\n        int result = n * recurse;\n  \
    \      return result;\n    }\n}\n```\n\n如果我们观察这个程序的执行流，它与上一章的 `nLines` 类似。如果我们用值\
    \ 3 调用 `factorial`：\n\n由于 3 不是 0，我们进入第二个分支并计算 $n-1$ 的阶乘……\n\n由于 2 不是 0，我们进入第二个分支并计算\
    \ $n-1$ 的阶乘……\n\n由于 1 不是 0，我们进入第二个分支并计算 $n-1$ 的阶乘……\n\n由于 0 是 0，我们进入第一个分支并返回 1。\n\
    \n我们将这些结果结合起来，得到 $3!$ 等于 $3 \\times 2 \\times 1 \\times 1$，即 6。\n\n如果你能写某个内容的递归定义，你通常就可以写一个\
    \ C++ 程序来计算它。第一步是决定这个函数的参数是什么，返回类型是什么。经过思考，你应该得出结论：`factorial` 接受一个整数作为参数并返回一个整数：\n\
    \n"
