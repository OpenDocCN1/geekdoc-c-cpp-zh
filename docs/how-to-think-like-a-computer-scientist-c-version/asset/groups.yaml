    # 2.6. KEYWORDS


    ```

    cout << hour;

    cout << colon;

    cout << minute;

    cout << endl;

    ```


    This program creates two integer variables hour and minute, and a character variable
    named colon. It assigns appropriate values to each of the variables and then uses
    a series of output statements to generate the following:


    The current time is 11:59


    When we talk about "putting a variable," we mean outputting the value of the variable.
    To output the name of a variable, you have to put it in quotes. Example: cout
    << "hour";


    As we have seen before, you can include more than one value in a single output
    statement, which can make the previous program more concise:


    ```

    int hour, minute;

    char colon;

    ```


    ```

    hour = 11;

    minute = 59;

    colon = '':'';

    ```


    ```

    cout << "The current time is " << hour << " hour " << colon << " minute" << endl;

    ```


    On one line, this program outputs a string, two integers, a character, and the
    special value endl. Very impressive!


    # 2.6 Keywords


    A few seconds ago, I said that you can make up any name you want for your variables,
    but that''s not quite true. There are certain words that are reserved by the compiler
    to parse the structure of your program, and if you use them as variable names,
    it will get confused. These words, keywords, include int, char, var, endl and
    many more.


    The complete list of keywords is included in the C++ Standard, which is the official
    language definition adopted by the International Organization for Standardization
    (ISO) on September 1, 1998. You can download a copy electronically from


    http://www.ansi.org/


    Rather memorize the list, I would suggest that you take advantage of a feature
    provided in many development environments: code highlighting. As you type, different
    parts of your program should appear in different colors. For example, keywords
    might be blue, strings red, and other color black. If you type a variable name
    and it turns blue, watch out! You might get some strange behavior from the compiler.'
