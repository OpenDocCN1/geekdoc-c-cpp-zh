    \ = mag;\n    imag =\n     sin(theta);\n    cartesian = true;\n}\n```\n\n```cpp\n\
    void calculateCartesian ()\n// 前置条件：当前对象包含有效的极坐标\n// 后置条件：polar 标志被设置，且 cartesian\
    \ 标志为真\n{\n    if (!polar) {\n        cout << \"polar flag must be set\" << endl;\n\
