    \ include the header file.\nIt may not be obvious why it is useful to break a\
    \ small program into three pieces. In fact, most of the advantages come when we\
    \ are working with larger programs.\n\nReuse: Once you have written a structure\
    \ like `Time` you might find it useful in more than one program. By separating\
    \ the definition of `Time` from `main.cpp` you make it easy to include the `Time`\
