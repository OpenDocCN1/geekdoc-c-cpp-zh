    # 7.2 apstring variables


    You can create a variable with type apstring in the usual ways:


    ```

    apstring first;

    first = "Hello", ";

    apstring second = "world";

    ```


    The first line creates an apstring without giving it a value. The second line
    assigns it the string value "Hello". The third line is a combined declaration
    and assignment, also called an initialization.


    Normally when string values like "Hello", or "world" appear, they are treated
    as C strings. In this case, when we assign them to an apstring variable, they
    are converted automatically to apstring values.


    We can output strings in the usual way:


    ```

    cout << first << second << endl;

    ```


    In order to compile this code, you will have to include the header file for the
    apstring class, and you will have to add the file apstring.cpp to the list of
    files you want to compile. The details of how to do this depend on your programming
    environment.


    Before proceeding, you should type the program above and make sure you can compile
    and run it.


    # 7.3 Extracting characters from a string


    Strings are called "strings" because they are made up of a sequence, or string,
    of characters. The first operation we are performing on a string is to extract
    one of the characters. C++ uses square brackets ([ and \]) for this operation:


    ```

    apstring fruit = "banana";

    char letter = fruit[1];

    out << letter << endl;

    ```


    The expression fruit[1] indicates that I character number 1 from the string named
    fruit. The result is stored in a char named letter. When you output the value
    of letter, I get a surprise:


    a


    a is not the first letter of "banana". Unless you are a computer scientist. For
    perverse reasons, computer scientists always start counting from zero. The 0th
    letter ("zeroth") of "banana" is b. The 1th letter ("oneth") is a and the 2nd
    ("twoeth") is n.


    If you want the zeroth letter of the string, you have to put zero in the square
    brackets:


    ```

    char letter = fruit[0];

    ```'
