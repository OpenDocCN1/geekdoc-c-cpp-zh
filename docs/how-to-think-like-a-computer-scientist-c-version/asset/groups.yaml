    \ 是合法的。\n\n## 12.8 搜索 (Searching)\n\n我想写的下一个函数是搜索 `Cards` 向量，以检查它是否包含某个特定的卡片。这个函数为什么有用可能并不显而易见，但它给了我演示两种搜索方法：线性搜索和二分搜索（bisection\
    \ search）。\n\n线性搜索是两者中显而易见的：它遍历牌组并将每张卡片与我们要找的卡片进行比较。如果我们找到了，就返回卡片出现的索引。如果不在牌组中，我们返回\
    \ -1。\n\n```\nint find(const Card& card, const apvector<Card>& deck) {\n  for\
    \ (int i = 0; i < deck.length(); i++) {\n    if (equals(deck[i], card)) return\
    \ i;\n  }\n  return -1;\n}\n```\n\n这个循环与 `printDeck` 中的循环完全相同。事实上，我写完程序后直接复制了它，这节省了我调试两次的麻烦。\n\
    \n在循环内部，我们将牌组的每个元素与 `card` 进行比较。函数一旦发现该卡片就会立即返回，这意味着如果我们找到了要找的卡片，就不需要遍历整个牌组。如果循环结束时没有找到该卡片，我们就知道卡片不在牌组中，并返回\
    \ -1。\n\n为了测试这个函数，我写了以下代码：\n\n```\napvector<Card> deck = buildDeck();\n\nint index\
    \ = card.find(deck[17]);\ncout << \"I found the card at index = \" << index <<\
    \ endl;\n```\n\n代码的输出是\n\nI found the card at index = 17\n\n## 12.9 二分搜索 (Bisection\
    \ search)\n\n如果牌组中的卡片不是无序的，那么没有比线性搜索更快的搜索方法。我们必须查看每张卡片，否则无法确定我们想要的卡片是否不在。\n\n\
    当你在字典中查找单词时，你并不会线性地搜索每一个单词。原因是单词是按字母顺序排列的。结果是，你可能会使用一种类似于二分搜索的算法：\n\n1. 从中间某个开始。\n\
    2. 选择页面上的一个单词并与你正在找的单词进行比较。\n3. 如果找到了你要找的单词，停止。\n4. 如果你要找的单词在页面单词之后，翻到字典中后面的某个部分并回到第\
    \ 2 步。\n5. 如果你要找的单词在页面单词之前，翻到字典中较的某个部分并回到第 2 步。\n\n当你发现页面上有两个相邻的单词，而你的单词在它们之间时，你可以得出你的单词不在字典中的结论。唯一的可能是你的单词在某个地方被漏掉了，但这违背了我们关于单词按字母顺序排列的假设。\n\
    \n在牌组的情况下，如果我们知道卡片是有序的，我们可以写一个快得多的 `find` 版本。编写二分搜索最好的方法是使用递归函数。技巧是写一个名为 `bisect`\
    \ 的函数，它接受两个参数 `low` 和 `high`，指示要搜索的向量段（包括 `low` 和 `high`）。\n\n1. 为了搜索向量，在 `low`\
    \ 和 `high` 之间选择一个索引，并称其为 `mid`。将 `mid` 处的卡片与你要找的卡片进行比较。\n2. 如果找到了，停止。\n3. 如果 `mid`\
    \ 处的卡片比你的卡片大，在范围 `low` 到 `mid-1` 搜索。\n4. 如果 `mid` 处的卡片比你的卡片小，在范围 `mid+1` 到 `high`\
