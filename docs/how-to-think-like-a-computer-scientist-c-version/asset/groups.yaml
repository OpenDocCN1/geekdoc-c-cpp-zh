    \ <= 6) {\n    cout << 2*i << \" \";\n    i = i + 1;\n}\n```\n\nThe first line\
    \ initializes a variable i, which is going to act as a counter, or loop variable.\
    \ As the loop executes, the value of i increases from 1 to 6, and when i is 7,\
    \ the loop terminates. Each time through the loop, print the value 2*i followed\
    \ by three spaces. By omitting the endl from the first output statement, we get\
    \ all the output on a single line.\nThe output of this program is:\n\n2 4 6 8\
    \ 10 12\n\nSo, far so good. The next step is to encapsulate and generalize.\n\n\
    ## 6.6 Encapsulation and generalization\n\nEncapsulation usually means taking\
    \ a piece of code and wrapping it up in a function, allowing you to take advantage\
    \ of all the things functions are good for. We have seen two examples of encapsulation,\
    \ we wrote printParity in Section 4.3 and isSingleDigit in Section 5.8.\n\nGeneralization\
    \ means taking something specific, like printing multiples of 2, and making it\
    \ more general, like printing the multiples of any integer.\n\nHere's a function\
    \ that encapsulates the loop from the previous section and generalizes it to print\
    \ multiples of n.\n\n```cpp\nvoid printMultiples(int n) {\n    int i = 1;\n  \
    \  while (i <= 6) {\n        cout << n*i << \" \";\n        i = i + 1;\n    }\n\
    }\n```\n\n## 6.7 Functions\n\nTo encapsulate, all I had to do was add the first\
    \ line, which declares the name, parameter, and return type. To generalize, all\
    \ I had to do was replace the value 2 with the parameter n.\n\nIf we call this\
    \ function with the argument 2, we get the same output as before. With argument\
    \ 3, the output is:\n\n3 6 9 12 15 18\n\nand with argument 4, the output is\n\n\
    4 8 12 16 20 24\n\nBy now you can probably guess how we are going to print a multiplication\
    \ table: we'll call `printMultiples` repeatedly with different arguments. In fact,\
    \ we are going to use another loop to iterate through the rows.\n\n```cpp\nint\
    \ i = 1;\nwhile (i <= 6) {\n    printMultiples(i);\n    i = i + 1;\n}\n```\n\n\
