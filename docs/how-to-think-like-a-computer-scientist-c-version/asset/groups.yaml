  - "[PAGE 134]\n\nWith that decided, we can write isGreater. Again, the arguments\
    \ (two Cards) and the return type (boolean) are obvious, and again we have to\
    \ choose between a member function and a nonmember function. This time, the arguments\
    \ are not symmetric. It matters whether we want to know \"Is A greater than B?\"\
    \ or \"Is B greater than A?\" Therefore I think it makes more sense to write isGreater\
    \ as a member function:\n\n```\nbool Card::isGreater(const Card& c2) const\n{\n\
    \    // first check the suits\n    if (suit > c2.suit) return true;\n    if (suit\
    \ < c2.suit) return false;\n\n    // if the suits are equal, check the ranks\n\
    \    if (rank > c2.rank) return true;\n    if (rank < c2.rank) return false;\n\
    \n    // if the ranks are also equal, return false\n    return false;\n}\n```\n\
    \nThen we invoke it, it is obvious from the syntax of the two possible questions\
    \ we are asking:\n\n+   - Card1 (2, 11)\n- Card2 (1, 11)\n\n```\nif (card1.isGreater(card2))\
    \ {\n    card1.print();\n    cout << \"is greater than\" << endl;\n    card2.print();\n\
    }\n```\n\nYou can almost read it like English: \"If card1isGreater card2 ...\"\
    \ The output of this program is\n\nJack of Heartsngris than\nJack of Diamonds\n\
    \nAccording to isGreater, aces are less than deuces (2s). As an exercise, fix\
    \ it so that aces are ranked higher than Kings, as they are in most card games.\n\
    \n# 12.6 Vectors of cards\n\nThe reason I chose Cards as the objects for this\
    \ chapter is that there is an obvious use for a vector of cards—a deck. Here is\
    \ some code that creates a new deck of 52 cards:"
  - "[PAGE 135]\n\napvector<Card> deck (52);\n\nHere is the state diagram for this\
    \ object:\n\ndeck\n\n| 0 | 1 | 2 | | 51 |\n|---|---|---|---||\n| suit: 0 | suit:\
    \ 0 | suit: 0 | ... | suit: 0 |\n| rank: 0 | rank: 0 | rank: 0 | | rank: 0 |\n\
    \nThe three dots represent the 48 cards I didn like drawing. Keep in mind that\
    \ we have initialized the instance variables of the cards yet. In some environments,\
    \ they will get initialized to zero, as shown in the figure, but in others they\
    \ could contain any possible value.\n\nOne way to initialize them is to pass a\
    \ Card as a second argument to constructor:\n\nCard aceOfSpades (3, 1);\napvector<Card>\
    \ deck (52, aceOfSpades);\n\nThis code builds a deck with 52 identical cards,\
    \ like a special deck for magic trick. Of course, it makes more sense to build\
    \ a deck with 52 different cards in it. To do that we use a nested loop.\n\nThe\
    \ outer loop enumerates the suits, from 0 to 3. For each suit, the inner loop\
    \ enumerates the ranks, from 1 to 13. Since the outer loop iterates 4 times, and\
    \ the inner loop iterates 13 times, the total number of times the body is executed\
    \ 52 (13 times 4).\n\n```\nint i = 0;\nfor (int suit = 0; suit <= 3; suit++) {\n\
    \  for (int rank = 1; rank <= 13; rank++) {\n    deck[i].suit = suit;\n    deck[i].rank\
    \ = rank;\n  }\n  i++;\n}\n```\n\nI used a variable to keep track of where in\
    \ the next card should go. Notice that we can compose the syntax for selecting\
    \ the element from an array (the [] operator) with the syntax for selecting an\
    \ instance variable from an object (the dot operator). The expression deck[i].suit\
