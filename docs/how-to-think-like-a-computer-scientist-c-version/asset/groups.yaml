    \ data and classes\n\nI have used the word \"encapsulation\" in this book to refer\
    \ to the process of wrapping up a sequence of instructions in a function, in order\
    \ to separate the function's interface (how to use it) from its implementation\
    \ (how it does what it does),\n\nThis kind of encapsulation might be called \"\
    functional encapsulation,\" to distinguish it from \"data encapsulation,\" which\
    \ is the topic of this chapter. Data encapsulation is based on the idea that each\
    \ structure definition should provide a set of functions that apply to the structure,\
    \ and prevent unrestricted access to the internal representation.\n\nOne of data\
    \ encapsulation is to hide implementation details from users or programmers who\
    \ do not need to know them.\n\nFor example, there are many possible representations\
    \ for a Card, including two integers, two strings and two enumerated types. The\
    \ programmer who writes the Card member functions needs to know which implementation\
    \ to use, but using the Card structure should not have to know anything about\
    \ its internal structure.\n\nAnother example, we have been using string and vector\
    \ objects without ever their implementations. There are many possibilities, but\
    \ as \"clients\" of these libraries, we don't need to know.\n\nIn C++, the most\
    \ common way to enforce data encapsulation is to prevent client programs from\
    \ accessing the instance variables of an object. The keyword private is used to\
    \ protect parts of a structure definition. For example, we could have written\
    \ the Card definition:\n\n```\nstruct Card {\nprivate:\n  int suit, rank;\n```"
