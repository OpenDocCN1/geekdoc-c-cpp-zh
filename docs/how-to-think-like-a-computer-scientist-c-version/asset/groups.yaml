    \  return sub;\n}\n```\n\n创建局部变量 `subdeck` 时，我们使用了接受牌组大小作为参数且不初始化卡牌的 `Deck` 构造函数。卡牌是在从原始牌组拷贝时初始化的。牌组的长度为\
