    \ `Cards` 向量。\n\n每当你处理向量时，拥有一个包含向量内容的函数是非常方便的。我们已经见过好几次遍历向量的模式了，所以下面的函数应该读起来很熟悉：\n\
    \n```\nvoid printDeck(const apvector<Card>& deck) {\n  for (int i = 0; i < deck.length();\
