    There are two sections of this definition, a private part and a public part. The
    functions are public, which means they can be invoked by client programs. The
    instance variables are private, which means that they can be read and written
    only by Card member functions.


    It is still possible for client programs to read and write the instance variables
    using the accessor functions (the ones beginning with get and set). On the other
    hand, it is easy to control which operations clients can perform on which instance
    variables. For example, it might be a good idea to make cards "read only" so after
    they are constructed, they cannot be changed. To do that, all we have to do is
    remove the set functions.


    Another advantage of using accessor functions is that we can change the internal
    representations of cards without having to change any client programs.


    # 14.2 What is a class?


    In most-oriented programming languages, a class is a user-defined type that includes
    a set of functions. As we have seen, structures in C++ meet the general definition
    of a class.


    But there is another feature in C++ that also meets this definition; confusingly,
    it is called a class. In C++, a class is just a structure whose instance variables
    are private by default. For example, I could have written the


