    \ (inability to handle errors and funny behavior), avoid using the >> operator\
    \ altogether, unless I am reading data from a source that is known to be error-free.\n\
    \nInstead, I use a function in the apstring called getline.\n\napstring name:\n\
    \n```\ncout << \"What is your name? \";\ngetline(cin, name);\ncout << name <<\
    \ endl;\n```\n\nThe first argument to getline is cin, which is where the input\
    \ is coming from. The second argument is the name of the apstring where you want\
    \ the result to be stored.\n\ngetline reads the entire line until the user hits\
    \ Return or Enter. This is useful for inputting strings that contain spaces.\n\
    \nIn fact, getline is generally useful for getting input of any kind. For example,\
    \ if you wanted to type an integer, you could input a string and then check if\
    \ it is a valid integer. If so, you can convert it to an integer value. If not,\
    \ you can print an error message and ask the user.\n\n## 9 More structures\n\n\
    ### 9.1 Time\n\nAs a second example of user-defined, we will define **Time**,\
    \ which is used to record time of day. The various pieces that form time are hour,\
    \ minute and second. The first step is to decide what type each variable should\
    \ be. It seems clear that **hour** and **minute** should be integers. Just to\
    \ keep things interesting, let's make **second** a double. Here's the structure\
    \ definition looks like:\n\n```\nstruct Time {\n  int hour, minute;\n  double\
    \ second;\n};\n```\n\nWe can create a **Time** object in the usual way:\n\n```\n\
    Time time = {11, 59, 3.14159};\n```\n\nThe diagram for this object looks like:\n\
    \nThe structure is a collection of data grouped together as a single.\n\nThe word\
    \ \"instance\" is sometimes used when we talk about objects, because every object\
    \ is an instance (example) of some type. The reason that instance variables are\
    \ so-named is that every instance of a type has them.\n\n### 9.2 printTime\n\n\
    When we define a new type it is a good idea to write function that displays the\
    \ instance variables in a human-readable form. For example:\n\n```\nvoid printTime(Time&\
    \ t) {\n    cout << t.hour << \":\" << t.minute << \":\" << t.second << endl;\n\
    }\n```\n\nThe output of this function, if we pass time as an argument, it is 11:59:3.14159.\n\
    \n### 8.12 Glossary\n\n- **structure**: A collection of data grouped together\
    \ as a single.\n- **instance variable**: One of the variables.\n- **reference**:\
    \ A name that refers to a variable.\n- **pass by value**: method of passing in\
    \ which the value is copied.\n- **pass by reference**: method of passing in which\
    \ the parameter refers to the argument.\n\n### 9.3 Functions for objects\n\nIn\
    \ the next sections, I will demonstrate several possible interfaces for functions\
    \ that operate on objects. For some operations, you will have a choice of several\
    \ possible interfaces, so you should consider the pros and cons of each of these:\n\
    \n- **pure function**: Takes objects and/or basic types as arguments but not modify\
    \ the objects. The return value is either a basic type or a new object created\
    \ inside the function.\n- **modifier**: Takes objects as parameters and modifies\
    \ some or all of them. Often returns void.\n- **fill-in function**: One of the\
    \ parameters is an \"empty\" object that gets filled in the function. Technically,\
    \ this is a type of modifier.\n\n### 9.4 Pure functions\n\nA function is considered\
    \ a pure function if the result depends only on the arguments, and it has no side\
    \ effects modifying or outputting something. The only result of calling a pure\
    \ function is the return value.\n\nOne example is **after**, which compares two\
    \ Times and returns a bool that indicates whether the first operand comes after\
    \ the second:\n\n```\nbool after(Time& time1, Time& time2) {\n    if (time1.hour\
    \ > time2.hour) return true;\n    if (time1.hour < time2.hour) return false;\n\
    }\n```\n"
  mdcn: "\n\n## 8.9 作为返回类型的结构\n\n你可以编写返回结构体的函数。例如，`findCenter` 接收一个 `Rectangle` 作为参数并返回一个包含\
    \ `Rectangle` 中心坐标的 `Point`：\n\n```\nPoint findCenter (Rectangle& box)\n{\n  \
    \  double x = box.corner.x + box.width/2;\n    double y = box.corner.y + box.height/2;\n\
    \    Point result = {x, y};\n    return result;\n}\n```\n\n要调用此函数，我们必须传递一个 `box`\
    \ 作为参数（注意它是通过引用传递的），并将该值赋值给 `Point` 变量：\n\n```\nRectangle box = {0.0, 0.0, 100,\
    \ 200};\nPoint center = findCenter(box);\nprintPoint(center);\n```\n\n该程序的输出为\
    \ (50, 100)。\n\n## 8.10 通过引用传递其他类型\n\n不仅仅是结构体可以按引用传递。我们过的过的其他类型也可以。例如，为了交换两个整数，我们可以写类似下面的代码：\n\
    \n```\nvoid swap (int& x, int& y)\n{\n    int temp = x;\n    x = y;\n    y = temp;\n\
    }\n```\n\n我们以通常的方式调用此函数：\n\n```\nint i = 7;\nint j = 9;\nswap(i, j);\ncout <<\
    \ i << j << endl;\n```\n\n该程序的输出为 97。为这个程序画一个栈图，让自己确信它是正确的。如果参数 `x` 和 `y` 被声明为引用（不带\
    \ `&`），`swap` 将无法工作。它会修改 `x` 和 `y`，而对 `i` 和 `j` 没有任何影响。\n\n当人们开始按引用传递整数等内容时，他们经常尝试使用表达式作为引用参数。例如：\n\
    \n## 8.11 获取用户输入\n\n```\nint i = 7;\nint j = 9;\nswap (i, j+1); // 错误！！\n```\n\
    \n这是非法的，因为表达式 `j+1` 不是一个变量——它没有占据引用可以引用的位置。要确切弄哪些类型的表达式可以按引用传递有点棘手。目前，一个经验法是引用参数必须是变量。\n\
    \n我们到为止编写的程序是非常容易预测的；它们每次运行的结果都相同。但大多数情况下，我们希望程序能够接收用户的输入并做出相应的响应。\n\n获取输入有很多方法，包括键盘输入、鼠标移动和按钮点击，以及更奇特的机制，如语音控制和视网膜扫描。在本文中我们将考虑键盘输入。\n\
    \n在头文件 `iostream.h` 中，C++ 定义了一个名为 `cin` 的对象，处理输入的方式与 `cout` 处理输出的方式。要获取一个整数值：\n\
    \n```\nint x;\ncin >> x;\n```\n\n`>>` 会导致程序停止执行并等待用户输入。如果用户输入了有效的整数，程序将其转换为整数值并存储在\
    \ `x` 中。\n\n如果用户输入了整数以外的内容，C++ 不报告错误或任何合理的内容。相反，它会在 `x` 中放入一个无意义的值并继续。\n\n幸运的是，有一种方法可以检查输入语句是否成功。我们可以调用\
    \ `cin` 的成员函数 `good()` 来检查所谓的流状态。`good` 返回 `true`：如果为 `true`，则上一次输入语句成功。如果不是，我们知道之前的某个操作失败了，而且下次操作也将失败。\n\
    \n因此，从用户处获取输入可能如下：\n\n```\nint main ()\n{\n  int x;\n// 提示用户输入\n  cout << \"Enter\
    \ an integer: \";\n\n// 获取输入\n  cin >> x;\n\n// 检查并查看输入语句是否成功\nif (cin.good()\
    \ == false) {\n    cout << \"That was not an integer.\" << endl;\n    return -1;\n\
    }\n\n// 打印我们从用户处得到的值\ncout << x << endl;\n    return 0;\n}\n```\n\n`cin` 也可以用于输入\
    \ `apstring`：\n\napstring name:\n\n```\ncout << \"What is your name? \";\ncin\
    \ >> name;\ncout << name << endl;\n```\n\n遗憾的是，这条语句只获取输入的第一个单词，并将其余留给下一次输入。所以，如果你运行这个程序并输入全名，它将只会输出你的名字。\n\
    \n由于这些问题（无法处理错误和奇怪的行为），请避免使用 `>>` 运算符，除非我正在从已知无错误的源读取数据。\n\n相反，我使用 `apstring`\
    \ 中的一个名为 `getline` 的函数。\n\napstring name:\n\n```\ncout << \"What is your name?\
    \ \";\ngetline(cin, name);\ncout << name << endl;\n```\n\n`getline` 的第一个参数是 `cin`，即输入来源。第二个参数是想要存储结果的\
    \ `apstring` 的名称。\n\n`getline` 读取整行内容，直到用户按下 Return 或 Enter 键。这对于输入包含空格的字符串非常有用。\n\
    \n事实上，`getline` 对于获取任何类型的输入通常有用。例如，如果你想输入整数，可以输入一个字符串然后检查它是否为有效整数。如果是，你可以将其转换为整数值。如果不是，你可以打印错误消息并询问用户。\n\
    \n## 9 更多结构\n\n### 9.1 时间\n\n作为用户定义的第二个例子，我们将定义 **Time**，它用于记录一天中的时间。组成时间的各个部分是小时、分钟和秒。第一步是决定每个变量应该是什么类型。看起来很明显，**小时**和**分钟**\
    \ 应该是整数。为了增加趣味性，让我们让**秒** 成为 `double`。结构体定义看起来如下：\n\n```\nstruct Time {\n  int\
    \ hour, minute;\n  double second;\n};\n```\n\n我们可以以通常的方式创建一个 **Time** 对象：\n\n\
    ```\nTime time = {11, 59, 3.14159};\n```\n\n该对象的图示如下：\n\n结构体是将数据组合成单一整体的集合。\n\n\
    当我们谈论对象时，有时会使用“实例（instance）”一词，因为每个对象都是某些类型的实例（示例）。实例变量（instance variables）之所以这样命名，是因为该类型的每个实例都拥有它们。\n\
    \n### 9.2 printTime\n\n当我们定义一个新类型时，编写一个以人类可读的形式显示实例变量的是一个好主意。例如：\n\n```\nvoid\
    \ printTime(Time& t) {\n    cout << t.hour << \":\" << t.minute << \":\" << t.second\
    \ << endl;\n}\n```\n\n如果我们传递时间作为参数，该函数的输出是 11:59:3.14159。\n\n### 8.12 术语表\n\n\
    - **结构体 (structure)**：组合成单一整体的数据集合。\n- **实例变量 (instance variable)**：变量之一。\n- **引用\
    \ (reference)**：引用变量的名称。\n- **按值传递 (pass by value)**：值被复制的方法。\n- **按引用传递 (pass\
    \ by reference)**：参数引用参数的方法。\n\n### 9.3 对象的函数\n\n在接下来的章节中，我将演示操作对象的几种可能的接口。对于某些操作，你会有几种可能的接口供选择，因此你应该考虑这些接口的优缺点：\n\
    \n- **纯函数 (pure function)**：接收对象和/或基本类型作为参数，但不修改对象。返回值是基本类型或函数内部创建的新对象。\n- **修饰符\
    \ (modifier)**：接收对象作为参数并修改它们的部分或全部。通常返回 `void`。\n- **填充函数 (fill-in function)**：参数之一是一个“空”对象，它在函数内部被填充。从技术上说，这是修饰符的一种。\n\
    \n### 9.4 纯函数\n\n如果一个函数的结果仅取决于参数，并且没有修改或输出某些内容的副作用，那么该函数被认为是纯函数。调用纯函数的唯一结果返回值。\n\
    \n一个例子是 **after**，它比较两个 `Time` 并返回一个 `bool`，指示第一个操作数是否在第二个之后：\n\n```\nbool after(Time&\
    \ time1, Time& time2) {\n    if (time1.hour > time2.hour) return true;\n    if\
    \ (time1.hour < time2.hour) return false;\n}\n```\n\n"
