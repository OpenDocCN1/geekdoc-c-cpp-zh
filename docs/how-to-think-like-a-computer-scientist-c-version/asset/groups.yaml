  mdcn: "\n\n# 14.3. 复数 149\n\n我将 `struct` 一词替换为 `class` 并删除了 `private:` 标签。这两个定义的结果是完全相同的。\n\
    \n事实上，任何可以写成 `struct` 的内容也可以也可以写成 `class`，只需通过添加或删除标签即可。没有真正的理由选择其中一个而不是另一个，除了作为一种风格选择，大多数\
    \ C++ 程序员都使用 `class`。\n\n此外，在 C++ 中，通常将所有用户定义类型统称为“类（classes）”，无论它们被定义为 `struct`\
    \ 还是 `class`。\n\n## 14.3 复数\n\n作为本章后续内容的运行示例，我们将考虑一个复数的类定义。复数在数学和工程的许多领域都有用，许多计算是使用复数算术完成的。复数是实部和虚部（$y$）之和，通常写为\
    \ $x + yi$ 的形式，其中 $x$ 是实部，$i$ 代表 -1 的平方根。\n\n以下是用户定义类型 `Complex` 的类定义：\n\n```\n\
    class Complex \n{\n    double r, imag;\n\npublic:\n    Complex() { }\n    Complex(double\
    \ r, double i) { real = r; imag = i; }\n};\n```\n\n由于这是一个 `class` 定义，实例变量 `real`\
    \ 和 `imag` 是私有的，我们必须包含 `public:` 标签以允许客户端代码调用构造函数。\n\n按照 usual，有两个构造函数：一个不接受参数且什么都不做；另一个接受参数并使用它们初始化实例变量。\n\
    \n到目前为止，将实例变量设为私有并没有优势。让我们变得稍微复杂一点；这一点可能会更清楚。\n\n复数的另一种常见表示法有时被称为“极坐标形式（polar\
    \ form）”，因为它基于极坐标。极坐标不是指定复平面上某个点的实部和虚部，而是指定点相对于原点的方向（或角度）以及该点的距离（幅值）。\n\n下图直观地展示了这两个坐标系。\n\
    \n### 直角坐标系\n\n### 极坐标系\n\n虚轴\n\n![](img/22d81c4ccdd9bed9ec5616934dce7c5a_157_0.png)\n\
    \n幅值\n\n角度\n\n实轴\n\n极坐标系下的复数写为 $re^{\\theta}$，其中 $r$ 是幅值（半径），$\\theta$ 是以弧度为的角度的角度。幸运的是，在两种形式之间转换很容易。从直角坐标到极坐标：\n\
    \n$r = \\sqrt{x^2 + y^2}$\n$\\theta = \\arctan(y/x)$\n\n从极坐标到直角坐标：\n\n$x = r\\\
    cos\\theta$\n$y = r\\sin\\theta$\n\n那么我们应该使用哪种表示法呢？嗯，存在多种表示法的完全是因为某些操作在直角坐标下更容易执行（如加法），而另一些操作在极坐标下更容易（如乘法）。一种方案是我们可以写一个包含两种表示法的类定义，并在需要时在它们之间转换。\n\
    \n```\nclass Complex\n{\n    double real, imag;\n    double mag, theta;\n    bool\
    \ cartesian, polar;\n\npublic:\n    Complex () { cartesian = false; polar = false;\
    \ }\n\nComplex(double r, double i)\n```\n\n## 14.4. 访问器函数\n\n```\n{\n  real =\
    \ r;  imag = i;\n  cartesian = true; polar = false;\n}\n;\n```\n\n现在有六个实例变量，这意味着这种表示法将比其他任何一种占用更多空间，但我们将看到它是多多功能的。\n\
    \n四个实例变量是自言自明的。它们包含了复数的实部、幅值、角度和幅值。另外两个变量 `cartesian` 和 `polar` 是标志，指示相应的值当前是否有效。\n\
    \n例如，默认构造函数将两个标志都设置为 `false`，表示该对象（目前）在任何表示法下都不包含一个有效的复数。\n\n第二个构造函数使用参数初始化实部和虚部，但它计算幅值或角度。将\
    \ `polar` 标志设为 `false` 会警告其他函数在它们设置之前不要访问 `mag` 或 `theta`。\n\n现在应该更清楚为什么我们部保持实例变量为私有了了。如果允许客户端程序无限制地访问，它们很容易通过读取未初始化的值产生错误。在接下来的章节中，我们将开发访问器函数，使这类错误不再可能。\n\
    \n## 14.4 访问器函数\n\n按照惯例，访问器函数的名称以 `get` 开头，并以它们获取的实例变量命名。自然地，返回类型是对应实例变量的类型。\n\
    \n在这种情况下，访问器函数提供了一个机会，在我们返回变量之前确保该值是有效的。这里是 `getReal` 的样子：\n\n```\nvoid Complex::getReal()\n\
    {\n  if (cartesian == false) calculateCartesian();\n  return real;\n}\n```\n\n\
    如果 `cartesian` 标志为 `true`，则 `real` 包含有效数据，我们可以直接返回它。否则，我们必须调用 `calculateCartesian`\
    \ 从极坐标转为直角坐标：\n\n```\nvoid Complex::calculateCartesian()\n{\nreal = mag * cos\
    \ (theta);\nimag = mag * sin (theta);\ncartesian = true;\n}\n```\n\n假设极坐标是有效的，我们可以使用上一节中的公式计算直角坐标。然后我们设置\
    \ `cartesian` 标志，指示 `real` 和 `imag` 现在包含了有效数据。\n\n那么我们应该使用哪种表示法呢？嗯，多种表示法是因为某些操作在直角坐标下更容易执行（如加法），而另一些操作在极坐标下更容易（如乘法）。一种方案是我们可以写一个包含两种表示法的类定义，并在需要时在它们之间转换。\n\
    \n假设极坐标是有效的，我们可以使用上一节中的公式计算直角坐标。然后我们设置 `cartesian` 标志，指示 `real` 和 `imag` 现在包含了有效数据。\n\
    \n作为一个练习，写一个名为 `getPolar` 的函数，然后写 `getTheta`。这些访问器函数的一个异常之处是它们不是 `const` 的，因为调用它们可能会修改实例变量。\n\
    \n## 14.5 输出\n\n按照 usual，当我们定义新类时，我们想要以人类可读的格式输出对象。对于复数对象，可以使用两个函数：\n\n```\nvoid\
    \ Complex::printCartesian ()\n{\n  cout << getReal() << \" \" << getImag() <<\
    \ \"i\" << endl;\n}\n```\n\n```\nvoid Complex::printPolar ()\n{\n  cout << getMag()\
    \ << \" \" << getTheta() << \"i\" << endl;\n}\n```\n\n这里的优点是我们可以任何任何格式输出复数对象，而无需担心表示法。由于函数使用了访问器函数，程序将计算任何需要的值。\n\
