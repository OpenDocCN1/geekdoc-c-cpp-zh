    # 7.6 A run-time error


    Way back in Section 1.3.2 I talked about run-time errors, which are errors that

    don''t appear until a program has started running.

    So far, you probably haven''t seen many run-time errors, because we haven''t

    doing many things that can cause one. Now, here we are. If you use the []

    operator and provide an index that is negative or greater than **length-1**,

    you will get a run-time error and a message something like this:


    ```

    index out of range: 6, string: banana

    ```


    Try it in your development environment and see how it looks.


    # 7.7 The find function


    The **apstring** class provides other functions that you can invoke on

    strings. The **find** function is the opposite of the [] operator. Instead of
    taking

    an index and extracting the character at that index, **find** takes a character
    and

    inds the index where that character appears.


    ```

    apstring fruit = "banana"

    int index = fruit.find(''a'');

    ```


    This example finds the index of the letter ''a'' in the string. In this case,

    tletter appears three times, so it is not obvious what **find** should do. According

    to the documentation, it returns the index of the *first appearance*, so the result

    is 1. If the given letter does not appear in the string, **find** returns -1.


    In addition, there is a version of **find** that takes another **apstring** as
    an

    argument and finds the index where the substring appears in the string.

    For example:


    ```

    apstring fruit = "banana"

    int index = fruit.find("nan");

    ```'
