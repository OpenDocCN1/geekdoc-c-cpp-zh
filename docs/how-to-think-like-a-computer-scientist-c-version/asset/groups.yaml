  mdcn: "\n\n## 13.9 洗牌与发牌\n\n在 13.6 节中，我写了一个洗牌算法的伪代码。假设我们有一个名为 `shuffleDeck` 的函数，它接受牌组作为参数并对其洗牌，我们可以创建并洗一副牌：\n\
    \n```\nDeck deck; // 创建一个标准的 52 张牌\ndeck.shuffle(); // 洗牌\n```\n\n然后，为了发几手牌，我们可以使用\
    \ `subdeck`：\n\n```\nDeck hand1 = deck.subdeck(0, 4);\nDeck hand2 = deck.subdeck(5,\
    \ 9);\nDeck pack = deck.subdeck(10, 51);\n```\n\n这段代码将 5 张牌放在第一手中，接下来的 5 张牌放在另一只手中，剩下的放入牌堆中。\n\
    \n当你考虑发牌时，你是否想过我们应该像真实纸牌游戏中那样，以轮流的方式每次给玩家发一张牌？我考虑过这个问题，但对于计算机程序来说是没有必要的。轮流制的约定是为了缓解洗牌不彻底的问题，并增加发牌者作弊的难度。这两点对于计算机来说都不是问题。\n\
    \n这个例子是一个关于工程隐喻危险性的很有用提醒：有时我们对计算机施加不必要的限制，或者认为缺乏某些能力，是因为我们无意中将一个比喻延伸超过了它的界限。要警惕误导性的类比。\n\
    \n## 13.10 合并排序\n\n在 13.7 节中，我们看到了一种非常高效的简单排序算法。为了排序 $n$ 个元素，它必须遍历 $n$ 次，每次遍历的时间与\
    \ $n$ 成正比。总时间与 $n^2$ 成正比。\n\n在本节中，我将展示一种更高效的算法，合并排序（mergesort）。排序 $n$ 个元素，合并排序所需的时间与\
    \ $n \\log n$ 成比例。这看起来可能并不深刻，但当 $n$ 变大时，$n^2$ 和 $n \\log n$ 之间的差异可能是巨大的。尝试几个 $n$\
    \ 的值看看吧。\n\n合并排序的基本思想是：如果你有两个已经排序好的子牌组，很容易（而且很快）将它们合并成一个单一的有序牌组。用一副牌来试试看：\n\n\
    - 1. 形成两个各 10 张牌的子牌组，对它们进行排序，使得它们朝上时最小的牌在最上方。将两副牌放在你面前。\n- 2. 比较每副牌中顶部的牌并选择较小的一张。将其翻面并加入合并后的牌组。\n\
    - 3. 重复步骤二，直到其中一个牌组为空。然后将剩下的牌加入合并后的牌组中。\n\n结果应该是一个单一的有序牌组。以下是它的伪代码形式：\n\n```\n\
    Deck merge (const Deck& d1, const Deck& d2) {\n  // 创建一个足够容纳所有牌的 d1\n  Deck result\
    \ (d1.cards.length() + d2.cards.length());\n\n  // 使用索引 i 跟踪我们在第一个牌组的位置，\n  //\
    \ 使用索引 j 跟踪第二个牌组的位置\n  int i = 0;\n  int j = 0;\n\n  // 索引 k 遍历结果牌组\n  for (int\
    \ k = 0; k <result.cards.length(); k++) {\n    // 如果 d1 为空，则 d2 胜；如果 d2 为空，则 d1\
    \ 胜；\n    // 否则，比较两张牌\n\n    // 将胜者加入新牌\n    return result;\n  }\n}\n```\n\n我选择合并非成员函数，是因为两个参数是对称的。\n\
    \n测试 `merge` 的最佳方法是构建并洗一副牌，分成两个（小）手牌，并使用上一章中的排序程序来排序这两部分。然后你可以将这两部分传递给 `merge`\
    \ 看看它是否有效。\n\n如果你能做到这一点，请尝试合并排序的简单实现：\n\n```\nDeck::mergesort() const {\n  //\
    \ 找到牌组的中点\n  // 将牌组分成两个子牌组\n  // 使用 sort 排序子牌组\n  // 合并部分并返回结果\n}\n```\n\n注意当前对象声明为\
    \ `const`，因为 `merge` 没有修改它。相反，它创建并返回一个新的 `Deck` 对象。\n\n如果你让它运行起来，真正的乐趣就开始了！合并排序神奇之处在于它是递归的。在对子牌组排序的地方，为什么要调用旧的、缓慢的\
    \ `sort` 版本呢？为什么不调用你正在编写的那个全新的 `mergeSort` 呢？\n\n这不仅是一个好主意，为了实现我承诺的性能也是必要的。然而，为了让它工作，你必须添加一个基础情况以防止无限递归。一个简单的基础情况是包含\
