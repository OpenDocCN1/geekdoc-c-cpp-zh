    \ from the OCR process that did not form logical sentences.)*\n"
  mdcn: "\n\n## 3.7. 包含多个函数的程序\n\n在 **main** 的定义内部，有一条语句使用了或调用了 **threeLine**。同样，**threeLine**\
    \ 调用了三次 **newLine**。注意，每个函数的定义都出现在其使用位置的上方。\n\n这在 C++ 中是必要的；函数的定义必须在函数的第一次使用之前（即上方）出现。你应该尝试以不同的函数顺序编译这个程序，并看看你会得到什么错误信息。\n\
    \n## 3.7 包含多个函数的程序\n\n当你查看一个包含多个函数的类定义时，人们往往想从上到下地阅读它，但这样做可能会导致困惑，因为那并不是**程序的执行顺序**。\n\
    \n执行从 **main** 的第一条语句开始，无论它位于程序的何种位置（通常在末尾）。语句会按顺序逐条执行，直到你调用一个函数。函数调用是执行流中的一次“绕路”。你不是跳转到下一条语句，而是跳转到被调用函数的第一行，执行所有语句，然后返回之前离开的地方继续。\n\
    \n这听起来足够简单，但你必须记住一个函数可以调用另一个函数。因此，当我们处于 **main** 中间时，我们可能需要去执行 **threeLine** 中的语句。而当我们处于\
    \ **threeLine** 时，又会被多次中断并去执行 **newLine**。\n\n幸运的是，C++ 并不总是一直跟踪自己所在的位置，因此每当 **newLine**\
    \ 完成时，程序都会从 **threeLine** 离开的地方继续执行，最终回到 **main**，以便程序结束。\n\n这个拙劣故事的启示是什么？当你阅读程序时，不要从上到下读。相反，要遵循执行流。\n\
    \n## 3.8 参数与参数\n\n我们使用的某些内置函数具有**参数**，这些是你提供的值，让函数执行其工作。例如，如果你想找到一个数字的大小，你必须指定是哪个数字。因此，**sin**\
    \ 接受一个 **double** 值作为参数。\n\n有些函数接受多个参数，比如 **pow**，它接受两个 double：底数和指数。\n\n注意，在这些每种情况下，我们不仅要指定有多少个参数，还要指定它们的类型。因此，当你编写类定义时，参数列表指示了每个参数的类型，这并不意外。例如：\n\
