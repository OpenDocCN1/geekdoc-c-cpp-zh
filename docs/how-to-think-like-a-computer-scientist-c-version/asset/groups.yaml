    struct definitions appear outside of any function definition, usually at the beginning
    of the program (after the include statements).

    This definition indicates that there are two elements in this structure, named
    x and y. These elements are called instance variables, for reasons I will explain
    a little later.

    It is a common error to leave off the semi-colon at the end of a structure definition.
    It might seem odd to put a semi-colon after a squiggly-brace, but you''ll get
    used to it.

    Once you have defined the new structure, you can create variables with that type:


    ```

    Point blank;

    blank.x = 3.0;

    blank.y = 4.0;

    ```


    The first line is a conventional variable declaration: blank has type Point. The
    next two lines initialize the variables of the structure. The "dot notation" used
    here is similar to the syntax for invoking a function on an object, as in fruit.length().
    Of course, one difference is that function names are always followed by an argument
    list, even if it is empty.

    The result of these assignments is shown in the following state diagram:


    | x: | 3 |

    | y: | 4 |


    As usual, the name of the variable blank appears outside the box and its value
    appears inside the box. In this case, that value is a compound object with two
    named instance variables.


    # 8.3 Accessing instance variables


    You can read the values of an instance variable using the same syntax we used
    to write:


    ```

    int x = blank.x;

    ```


    The expression blank.x means "go to the object named blank and get the value of
    x." In this case we assign value to a local variable named x. Notice that there
    is no conflict between the local variable x and the instance variable named x.
    The purpose of dot notation is to identify which variable you are referring to
    unambiguously.'
  - '[PAGE 84]


    # 8.4. OPERATIONS ON STRUCTURES


    You can use dot notation as part of any C++ expression, so the following are legal.


    ```

    cout blank.x << " " << blank.y << endl;

    double distance = blank.x * blank.x + blank.y * blank.y;

    ```


    The first line outputs 3, 4; the second line calculates the 25.


    # 8.4 Operations on structures


    Most of the operators we have been using on other types, like mathematical operators
    (+, %, etc.) and comparison operators (==, etc.), do not work on structures. Actually,
    it is possible to define the meaning of these operators for the new type, but
    we don''t do that in this book.


    On the other hand, the assignment operator *does* work for structures. It can
    be used in two ways: to initialize the instance variables of a structure or to
    copy the instance variables from one to another. An initialization looks like
    this:


    ```

    Point blank = { 3.0, 4.0 };

    ```


    The values in squiggly braces get assigned to the instance variables of the structure
    one by one, in order. So in this case, x gets the first value and y gets the second.


    Unfortunately, this syntax can be used only in an initialization, not in an assignment
    statement. So the following is illegal.


    ```

    Point blank;

    blank = { 3.0, 4.0 }; // WRONG !!

    ```


    You might wonder why this perfectly reasonable statement should be illegal; I''m
    not sure, but I think the problem is that the compiler doesn''t know what the
    right side should be. If you add a typecast:


    ```

    Point blank;

    blank = (Point){ 3.0, 4.0 };

    ```


    That works.

    it is legal to assign one structure to another. For example:


    ```

    Point p1 = { 3.0, 4.0 };

    Point p2 = p1;

    cout << p2.x << " " << p2.y << endl;

    ```


    The output of this program is 3, 4.'
