    pares and determine when one is greater or less than another. Another\noperators\
    \ (< and > the others) don't work for user-defined types. Just as\nwe did for\
    \ the operator, we will use a function that plays the role of of . Later, we will\
    \ use this function to sort a deck of cards.\n\nSome sets are totally ordered,\
    \ which means you can compare any two\\lements and tell which is bigger. For example,\
    \ the integers and the floating-\npoints are totally ordered. Some sets are unordered,\
    \ which means there\nis no meaningful way to say that one element is bigger than\
    \ another. For\nexample, the fruits are unordered, which is why we cannot compare\
    \ apples and\noranges. Another example, the bool type is unordered; we cannot\
    \ say that\ntrue is greater than false.\n\nThe set of playing cards is partially\
    \ ordered, which means that sometimes\n can compare and sometimes not. For example,\
    \ I know that the 3 of\nClubs is higher than the 2 of Clubs because it has higher\
    \ rank, and the 3 of\nDiamonds is higher than the 3 of Clubs because it has higher\
    \ suit. But which\nis better, the 3 of Clubs or the 2 of Diamonds? One has a higher\
    \ rank, but the\nother has a higher suit.\n\nIn order to make cards comparable,\
    \ we have to decide which is more impor-\ntant, rank or suit. To be honest, the\
    \ choice is completely arbitrary. For the\nsake of choosing, I will say that suit\
    \ is more important, because when you buy\na new deck of cards, it comes sorted\
    \ with all the Clubs together, followed by all\ntDiamonds, and so on."
  md: "\nAn alternative is to use integers to encode the ranks and the suits. By \"\
    encode,\" I do not mean some people think, which is to encrypt, or translate a\
    \ secret code. What a computer scientist means by \"encode\" is something like\
    \ \"define a mapping between a sequence of numbers and the things I want to represent.\"\
    \ For example,\n\n- Spades $\\rightarrow$ 3\n- Hearts $\\rightarrow$ 2\n- Diamonds\
    \ $\\rightarrow$ 1\n- Clubs $\\rightarrow$ 0\n\nThe symbol is mathematical notation\
    \ for \"maps to.\" The obvious feature of this mapping is that the suits maps\
    \ to integers in order, so we can compare suits by comparing integers. The mapping\
    \ for ranks is fairly obvious; each of the numerical ranks maps to the corresponding\
    \ integer, and for face cards:\n\n- Jack $\\rightarrow$ 11\n- Queen $\\rightarrow$\
    \ 12\n- King $\\rightarrow$ 13\n\nThe reason I use mathematical notation for these\
    \ mappings is that they are not part of the C++ program. They are part of the\
    \ program design, but they never appear explicitly in the code. The class definition\
    \ for the Card looks like this:\n\n```cpp\nstruct Card {\n    int suit, rank;\n\
    \n    Card ();\n    Card(int s, int r);\n}\n\nCard::Card() {\n    suit = 0; rank\
    \ = 0;\n}\n\nCard::Card(int s, int r) {\n    suit = s; rank = r;\n}\n```\n\nThere\
    \ are two constructors for Cards. You can tell that they are constructors because\
    \ they have no return type and their name is the same as the structure. The first\
    \ constructor takes no arguments and initializes the instance variables to a useless\
    \ value (the zero of clubs).\n\nThe second constructor is more useful. It takes\
    \ two parameters, the suit and rank of the card.\n\n## 12.3. THE PRINTCARD FUNCTION\n\
    \nThe following code creates an object named **threeOfClubs** that represents\
    \ the 3 of Clubs:\n\n```cpp\nCard threeOfClubs (0, 3);\n```\n\nThe first argument,\
    \ 0 represents the suit Clubs, the second, naturally, represents the rank 3.\n\
    \n## 12.3 The printCard function\n\nWhen you create a new type, the first step\
    \ is usually to declare the instance variables and write constructors. The second\
    \ step is often to write a function that prints the object in human-readable format.\n\
    \nIn the case of Card objects, \"human-readable\" means that we have to map the\
    \ internal representation of the rank and suit onto words. A natural way to do\
    \ that is with a vector of strings. You can create a vector of strings the same\
    \ way you create for another vector of types:\n\n```cpp\napvector<string> suits\
    \ (4);\n```\n\nOf course, in order to use vectors and strings, you will have to\
    \ include the header files for both!\n\nTo initialize the elements of the vector,\
    \ we can use a series of assignment statements.\n\n```cpp\nsuits[0] = \"Clubs\"\
    ;\nsuits[1] = \"Diamonds\";\nsuits[2] = \"Hearts\";\nsuits[3] = \"Spades\";\n\
    ```\n\nA state diagram for this vector looks like:\n\n> apvectors are a little\
    \ different from strings contains a template that allows the compiler to create\
    \ vectors of various kinds. The first time you use a vector of integers, the compiler\
    \ generates code to support that kind of vector. If you use a vector of strings,\
    \ the compiler generates different code to handle that kind of vector. As a result,\
    \ it is usually sufficient to include the header file apvector.h, you do not have\
    \ to compile apvector.cpp at all! Unfortunately, if you do, you are likely to\
    \ get a long stream of error messages. This footnote helps you avoid an unpleasant\
    \ surprise, but the details in your development environment may vary.\n\nsuits\
    \ |\n| :--- |\n| \"Clubs\" |\n| \"Diamonds\" |\n| \"Hearts\" |\n| \"Spades\" |\n\
    \nWe can build a similar vector to decode the ranks. Then we can select the appropriate\
    \ elements using the **suit** and **rank** as indices. Finally, we can write a\
    \ function called **print** that outputs the code on which it is invoked:\n\n\
    ```cpp\nvoid Card::print() const\n{\n    apvector<string> suits(4);\n    suits[0]\
    \ = \"Clubs\";\n    suits[1] = \"Diamonds\";\n    suits[2] = \"Hearts\";\n   \
    \ suits[3] = \"Spades\";\n\n    vector<string> ranks(14);\n    ranks[1] = \"Ace\"\
    ;\n    ranks[2] = \"2\";\n    ranks[3] = \"3\";\n    ranks[4] = \"4\";\n    ranks[5]\
    \ = \"5\";\n    ranks[6] = \"6\";\n    ranks[7] = \"7\";\n    ranks[8] = \"8\"\
    ;\n    ranks[9] = \"9\";\n    ranks[10] = \"10\";\n    ranks[11] = \"Jack\";\n\
    \    ranks[12] = \"Queen\";\n    ranks[13] = \"King\";\n\n    cout << ranks[rank]\
    \ << \" of \" << suits[suit] << endl;\n}\n```\n\nThe expression `suits[suit]`\
    \ means \"the instance variable suit from the current object as an index into\
    \ the vector named suits, and select the appropriate string.\"\n\n## 12.4. THE\
    \ EQUALS FUNCTION\n\nBecause print is a Card member function, it can refer to\
    \ the instance variables of the current object implicitly (without having to use\
    \ dot notation to specify the object). The output of this code\n\n```cpp\nCard\
    \ card (1, 11);\ncard.print ();\n```\n\nis Jack of Diamonds.\nYou might notice\
    \ that we are not using the zeroth element of the ranks vector. Because the only\
    \ valid ranks are 1-13. By leaving an element at the beginning of the vector,\
    \ we get an encoding where 2 maps to \"3\", etc. From the point of view of user,\
    \ it doesn't matter what the encoding is, since all input and output uses human-readable\
    \ formats. On the other hand, it is often helpful for the programmer if the mappings\
    \ are easy to remember.\n\n## 12.4 The equals function\n\nIn order for two cards\
    \ to be equal, they have to have the same rank and the same unit. Unfortunately,\
    \ the == operator does not work for user-defined types like Card, so we have to\
    \ write a function that compares two cards. We'll call it equals. It is also possible\
    \ to write a new definition for the == operator, but we will not cover that in\
    \ this book.\n\nIt is clear that the return value from equals should be a boolean\
    \ that indicates whether the cards are the same. It is also clear that there have\
    \ to be two Cards as parameters. But we have one more choice: should equals be\
    \ a member function or a free-standing function?\nAs a member function, it looks\
    \ like:\n\n```cpp\nbool equals(const Card& c2) const {\n    return rank == c2.rank\
    \ && suit == c2.suit;\n}\n```\n\nTo use this function, we have to invoke it on\
    \ one of the cards and pass the other as an argument:\n\n```cpp\nCard card1 (1,\
    \ 11);\nCard card2 (1, 11);\nif (card1.equals(card2)) {\n    cout << \"Yes, that's\
    \ the same card.\" << endl;\n}\n```\n\nWhat I mean by symmetric is that it does\
    \ not matter whether I ask “Is A equal to B?” or “Is B equal to A?” In this case,\
    \ I think it looks better to rewrite equals as a nonmember function\n\n```cpp\n\
    bool equals (const Card& c1, const Card& c2) {\n    return c1.rank == c2.rank\
    \ && c1.suit == c2.suit;\n}\n```\n\nWhen we call this version, the arguments appear\
    \ side-by-side in a way that makes logical sense, to me least.\n\n```cpp\nCard\
    \ card1 (1, 11);\nCard card2 (1, 11);\nif (equals(card1, card2)) {\n    cout <<\
    \ \"Yes, that's the same card.\" << endl;\n}\n```\n\nOf course, this is a matter\
    \ of taste. My point here is that you should be comfortable writing both member\
    \ and nonmember functions, so that you can choose the interface that works best\
    \ depending on circumstance.\n\n## 12.5 The Greater function\n\nFor basic types\
    \ like int and double, there are comparison operators that compare and determine\
    \ when one is greater or less than another. Other operators (< and >) do not work\
    \ for user-defined types. Just as we did for the operator, we will use a function\
    \ that plays the role of . Later, we will use this function to sort a deck of\
    \ cards.\n\nSome sets are totally ordered, which means you can compare any two\
    \ elements and tell which is bigger. For example, the integers and the floating\
    \ points are totally ordered. Some sets are unordered, which means there is no\
    \ meaningful way to say that one element is bigger than another. For example,\
    \ the fruits are unordered, which is why we cannot compare apples and oranges.\
    \ Another example, the bool type is unordered; we cannot say that true is greater\
    \ than false.\n\nThe set of playing cards is partially ordered, which means that\
    \ sometimes we can compare and sometimes not. For example, I know that the 3 of\
    \ Clubs is higher than the 2 of Clubs because it has higher rank, and the 3 of\
    \ Diamonds is higher than the 3 of Clubs because it has higher suit. But which\
    \ is better, the 3 of Clubs or the 2 of Diamonds? One has a higher rank, but the\
    \ other has a higher suit.\n\nIn order to make cards comparable, we have to decide\
    \ which is more important, rank or suit. To be honest, the choice is completely\
    \ arbitrary. For the sake of choosing, I will say that suit is more important,\
    \ because when you buy a new deck of cards, it comes sorted with all the Clubs\
    \ together, followed by all Diamonds, and so on.\n"
  mdcn: "\n另一种方法是使用整数来对点数和花色进行编码。我说的“编码”并不是像某些人认为的那样，即加密或翻译秘密代码。计算机科学家所说的“编码”是指“在数字序列与我想要表示的对象之间定义一种映射”。例如：\n\
    \n- 黑花 $\\rightarrow$ 3\n- 红心 $\\rightarrow$ 2\n- 方形 $\\rightarrow$ 1\n- 梅花 $\\\
    rightarrow$ 0\n\n符号 $\\rightarrow$ 是“映射到”的数学符号。这种映射显而易见的特征是花色按顺序映射到整数，因此我们可以通过比较整数来比较花色。点数的映射显而易见；每个数值点数都映射到对应的整数，对于花牌：\n\
    \n- Jack (Jack) $\\rightarrow$ 11\n- 女 (Queen) $\\rightarrow$ 12\n- 王 (King) $\\\
    rightarrow$ 13\n\n我对这些映射使用数学符号的原因是它们并不是 C++ 程序的一部分。它们是程序设计的一部分，但永远不会在代码中显式出现。`Card`\
    \ 类的定义如下：\n\n```cpp\nstruct Card {\n    int suit, rank;\n\n    Card ();\n    Card(int\
    \ s, int r);\n}\n\nCard::Card() {\n    suit = 0; rank = 0;\n}\n\nCard::Card(int\
    \ s, int r) {\n    suit = s; rank = r;\n}\n```\n\n`Card` 有两个构造函数。你可以看出它们是构造函数，因为它们没有返回类型，且名称与结构相同。第一个构造函数不接受参数，并将实例变量初始化为一个无用的值（梅花的零）。\n\
    \n第二个构造函数更有用。它接受两个参数：牌的花色和点数。\n\n## 12.3. PRINTCARD 函数\n\n以下代码创建了一个名为 **threeOfClubs**\
    \ 的对象，代表梅花 3：\n\n```cpp\nCard threeOfClubs (0, 3);\n```\n\n第一个参数 0 代表花色梅花（Clubs），第二个参数自然地代表点数\
    \ 3。\n\n## 12.3 printCard 函数\n\n当你创建一个新类型时，第一步通常是声明实例变量并编写构造函数。第二步通常是编写一个以以人类可读的格式打印对象的函数。\n\
    \n在 `Card` 对象的情况下，“人类可读”意味着我们必须将点数和花色的内部表示映射到单词。实现此点的自然方法是使用字符串向量（vector of strings）。你可以像创建其他类型的向量一样创建字符串向量：\n\
    \n```cpp\napvector<string> suits (4);\n```\n\n当然，为了使用向量和 `string`，你必须包含这两者的头文件！\n\
    \n为了初始化向量的元素，我们可以使用一系列赋值语句。\n\n```cpp\nsuits[0] = \"Clubs\";\nsuits[1] = \"Diamonds\"\
    ;\nsuits[2] = \"Hearts\";\nsuits[3] = \"Spades\";\n```\n\n该向量的状态图如下：\n\n> apvectors\
    \ 与字符串略有不同，它包含一个模板，允许编译器创建各种种类的向量。当你第一次使用整数向量时，编译器会生成相应的代码来支持该种类的向量。如果你使用字符串向量，编译器会生成不同的代码来处理该类型的向量。因此，通常包含\
    \ `apvector.h` 头文件就足够了，你不需要编译 `apvector.cpp`！遗憾的是，如果你这样做了，可能会收到一长串错误信息。这个脚注可以帮助你避免不快的意外，但你开发环境中的细节可能会有所不同。\n\
    \nsuits |\n| :--- |\n| \"Clubs\" |\n| \"Diamonds\" |\n| \"Hearts\" |\n| \"Spades\"\
    \ |\n\n我们可以构建一个类似的向量来解码点数。然后我们可以使用 **suit** 和 **rank** 作为索引来选择合适的元素。最后，我们可以写一个名为\
    \ **print** 的函数，输出调用它时所对应的代码：\n\n```cpp\nvoid Card::print() const\n{\n    apvector<string>\
    \ suits(4);\n    suits[0] = \"Clubs\";\n    suits[1] = \"Diamonds\";\n    suits[2]\
    \ = \"Hearts\";\n    suits[3] = \"Spades\";\n\n    vector<string> ranks(14);\n\
    \    ranks[1] = \"Ace\";\n    ranks[2] = \"2\";\n    ranks[3] = \"3\";\n    ranks[4]\
    \ = \"4\";\n    ranks[5] = \"5\";\n    ranks[6] = \"6\";\n    ranks[7] = \"7\"\
    ;\n    ranks[8] = \"8\";\n    ranks[9] = \"9\";\n    ranks[10] = \"10\";\n   \
    \ ranks[11] = \"Jack\";\n    ranks[12] = \"Queen\";\n    ranks[13] = \"King\"\
    ;\n\n    cout << ranks[rank] << \" of \" << suits[suit] << endl;\n}\n```\n\n表达式\
    \ `suits[suit]` 的意思是“将当前对象的实例变量 `suit` 作为名为 `suits` 的向量的索引，并选择相应的字符串”。\n\n## 12.4.\
    \ EQUALS 函数\n\n由于 `print` 是 `Card` 的成员函数，它可以隐式地引用当前对象的实例变量（而无需使用点符号来指定对象）。这段代码的输出：\n\
    \n```cpp\nCard card (1, 11);\ncard.print ();\n```\n\n输出是 Jack of Diamonds（方形 J）。\n\
    你可能会注意到我们没有使用 `ranks` 向量的零索引元素。因为唯一有效的点数是 1-13。通过在向量开头留出一个元素，我们得到了一种编码，其中 2 映射到\
    \ \"3\" 等等。从用户的角度来看，编码是什么并不重要，因为所有的输入和输出都使用人类可读的格式。另一方面，如果映射容易记忆，对程序员来说通常很有帮助。\n\
    \n## 12.4 equals 函数\n\n为了让两张牌相等，它们必须具有相同的点数和相同的花色。遗憾的是，`==` 运算符不支持像 `Card` 这样的用户定义类型，因此我们必须编写一个比较两张牌的函数。我们将其命名为\
    \ `equals`。也可以为 `==` 运算符编写新定义，但我们不会在书中介绍这一点。\n\n很显然，`equals` 的返回值应该是一个布尔值，指示两张牌是否相同。同样显然，必须有两个\
    \ `Card` 对象作为参数。但我们还有最后一个选择：`equals` 应该是成员函数还是全局函数？\n作为成员函数，它看起来像：\n\n```cpp\n\
    bool equals(const Card& c2) const {\n    return rank == c2.rank && suit == c2.suit;\n\
    }\n```\n\n要使用这个函数，我们必须在其中一张牌上调用它，并将另一张作为参数传递：\n\n```cpp\nCard card1 (1, 11);\n\
    Card card2 (1, 11);\nif (card1.equals(card2)) {\n    cout << \"Yes, that's the\
    \ same card.\" << endl;\n}\n```\n\n我所说的对称性是指，无论我问“A 等于 B 吗？”还是“B 等于 A 吗？”都可以。在这种情况下，我认为将\
    \ `equals` 重写为非成员函数看起来更好：\n\n```cpp\nbool equals (const Card& c1, const Card&\
    \ c2) {\n    return c1.rank == c2.rank && c1.suit == c2.suit;\n}\n```\n\n当我们调用这个版本时，参数并排出现的方式在逻辑上更合理（至少对我来说是如此）。\n\
    \n```cpp\nCard card1 (1, 11);\nCard card2 (1, 11);\nif (equals(card1, card2))\
    \ {\n    cout << \"Yes, that's the same card.\" << endl;\n}\n```\n\n当然，这取决于个人喜好。我的观点是，你应该熟练编写成员函数和非成员函数，以便你可以根据情况选择最合适的接口。\n\
    \n## 12.5 Greater 函数\n\n对于 `int` 和 `double` 等基本类型，有比较运算符可以比较并判断一个何时大于或小于另一个。其他运算符（`<`\
    \ 和 `>`）不适用于用户定义类型。就像对运算符做的那样，我们将使用一个起到 `.` 角色的函数。稍后，我们将使用这个函数对扑牌进行排序。\n\n某些集合是全序的，这意味着你可以比较任意两个元素并判断哪个更大。例如，整数和浮点数全序。某些集合是无序的，这意味着没有意义的方法来说一个元素比另一个大。例如，水果是无序的，这就是为什么我们无法比较苹果和橘子。另一个例子是\
    \ `bool` 类型是无序的；我们不能说 `true` 大于 `false`。\n\n扑牌是偏序的，这意味着有时我们可以比较，有时又不能。例如，我知道梅花\
    \ 3 比梅花 2 大，因为它的点数更高；而方形 3 比梅花 3 大，因为它的花色更高。但梅花 3 和方形 2 哪个更好？一个点数更高，但另一个花色更高。\n\
    \n为了让牌具有可比性，我们必须决定点数和花色哪个更重要。诚实地说，这个选择完全是随机的。为了方便选择，我将说花色更重要，因为当你买一幅新牌时，它是按花色排序的，所有的梅花在一起，然后是所有的方形，以此类推。\n"
