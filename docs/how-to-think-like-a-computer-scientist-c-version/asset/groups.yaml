    \n## 14.8 不变性 (Invariants)\n\n我们期望一个正确的 `Complex` 对象满足以下几个条件。例如，如果 `cartesian`\
    \ 标志被设置了，我们期望 `real` 和 `imag` 包含有效数据。同样，如果 `polar` 被设置了，我们期望 `mag` 和 `theta` 是有效的。最后，如果两个标志都被设置了，我们期望其他四个变量是一致的；也就是说，它们应该在以两种不同的格式指定同一个点。\n\
    \n这类条件被称为**不变性**（invariants），原因显而易见：它们不会改变——它们应该始终为真。编写包含 Bug 的良好代码的方法之一，就是确定哪些不变性对于你的类是合适的，并编写无法违反这些不变性的代码。\n\
    \n数据封装的主要目的之一就是帮助强制执行不变性。第一步是将实例变量设为私有（private），来防止对其进行无限制的访问。然后，修改对象的唯一方法就是访问器函数和修改器。如果我们检查所有的访问器和修改器，并能证明每一个都维护了不变性，那么我们就可以证明不变性是不可能被违反的。\n\
    \n观察 `Complex` 类，我们可以列出对一个或多个变量赋值的函数：\n\n```\n- 第二个构造函数\n- calculateCartesian\n\
