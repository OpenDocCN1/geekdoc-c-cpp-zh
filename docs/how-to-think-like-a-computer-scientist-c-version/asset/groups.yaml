    # 10.1 Accessing elements


    The [] operator reads and writes the elements of a vector in much the same way
    it accesses the characters in an apstring. As apstrings, the indices start at
    zero, so `count[0]` refers to the “zeroth” element of the vector, and `count[1]`
    refers to the “oneth” element. You can use the [] operator anywhere in an expression:


    ```

    count[0] = 7;

    count[1] = count[0] * 2;

    count[2]++;

    count[3] -= 60;

    ```


    All of these are legal assignment statements. Here is the effect of this code
    fragment:


