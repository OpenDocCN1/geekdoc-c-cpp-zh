  mdcn: "\n既然已经决定，我们就可以编写 `isGreater`。同样，参数（两张 `Card`）和返回类型（`boolean`）是显而易见的，而且我们需要在成员函数和非成员函数之间进行选择。这一次，参数是不对称的。我们是想知道“A\
