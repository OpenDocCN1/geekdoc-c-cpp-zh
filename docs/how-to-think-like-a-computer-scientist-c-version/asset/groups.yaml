  md: "\n## Chapter 7\n## Strings and things\n\n## 7.1 Containers for strings\n\n\
    We have seen five types of values—booleans, characters, integers, floating-point\
    \ numbers and strings—but only four types of variables—bool, char, int and double.\
    \ So far we have no way to store a string in a variable for or perform operations\
    \ on strings.\n\nIn fact, there are several kinds of variables in C++ that can\
    \ store strings. One is a basic type that is part of the C++ language, sometimes\
    \ called a “native string.” The syntax for C strings is a bit ugly, and using\
    \ them requires some concepts we have not covered yet, so for the most part we\
    \ are going to avoid them.\n\nThe string type we are going to use is an `apstring`,\
    \ which is a type created specifically for the Computer Science AP Exam.\n\nUnfortunately,\
    \ it is not possible to avoid C strings altogether. In this chapter I will warn\
    \ you about some problems you might run into using `apstring`s instead of C strings.\n\
    \n> In order for me to talk about AP classes in this book, I have to include the\
    \ following text: Inclusion of the C++ classes defined for use in the Advanced\
    \ Placement Science courses does not constitute endorsement of the other material\
    \ in this textbook by the College Board, Educational Testing service, or the Computer\
    \ Science Development Committee. The versions of the C++ classes defined in the\
    \ AP Computer Science courses included in this textbook were accurate as of 20\
    \ July 1999. Revisions to the classes may have been made since that.\n\nYou might\
    \ be wondering what they mean by class. It will be a few more chapters before\
    \ I can give a complete definition, but for now a class is a collection of functions\
    \ that defines the operations we can perform on some type. The `apstring` class\
    \ contains all the functions that apply to `apstrings`.\n\n## 7.2 apstring variables\n\
    \nYou can create a variable with type `apstring` in the usual ways:\n\n```\napstring\
    \ first;\nfirst = \"Hello\";\napstring second = \"world\";\n```\n\nThe first line\
    \ creates an `apstring` without giving it a value. The second line assigns it\
    \ the string value \"Hello\". The third line is a combined declaration and assignment,\
    \ also called an initialization.\n\nNormally when string values like \"Hello\"\
    , or \"world\" appear, they are treated as C strings. In this case, when we assign\
    \ them to an `apstring` variable, they are converted automatically to `apstring`\
    \ values.\n\nWe can output strings in the usual way:\n\n```\ncout << first <<\
    \ second << endl;\n```\n\nIn order to compile this code, you will have to include\
    \ the header file for the `apstring` class, and you will have to add the file\
    \ `apstring.cpp` to the list of files you want to compile. The details of how\
    \ to do this depend on your programming environment.\n\nBefore proceeding, you\
    \ should type the program above and make sure you can compile and run it.\n\n\
    ## 7.3 Extracting characters from a string\n\nStrings are called \"strings\" because\
    \ they are made up of a sequence, or string, of characters. The first operation\
    \ we are performing on a string is to extract one of the characters. C++ uses\
    \ square brackets ([ and ]) for this operation:\n\n```\napstring fruit = \"banana\"\
    ;\nchar letter = fruit[1];\ncout << letter << endl;\n```\n\nThe expression `fruit[1]`\
    \ indicates that I get the character number 1 from the string named fruit. The\
    \ result is stored in a char named letter. When you output the value of letter,\
    \ I get a surprise:\n\na\n\na is not the first letter of \"banana\". Unless you\
    \ are a computer scientist. For perverse reasons, computer scientists always start\
    \ counting from zero. The 0th letter (\"zeroth\") of \"banana\" is b. The 1st\
    \ letter (\"oneth\") is a and the 2nd (\"twoeth\") is n.\n\nIf you want the zeroth\
    \ letter of the string, you have to put zero in the square brackets:\n\n```\n\
    char letter = fruit[0];\n```\n\n## 7.4 Length\n\nTo find the length of a string\
    \ (number of characters), we can use the length function. The syntax for calling\
    \ this function is a little different from what we've seen before:\n\n```\nint\
    \ length;\nlength = fruit.length();\n```\n\nTo describe this function call, we\
    \ would say that we are invoking the length function on the string named fruit.\
    \ This vocabulary may seem strange, but we will see many more examples where we\
    \ invoke a function on an object. The syntax for function invocation is called\
    \ \"dot notation\", because the dot (period) separates the name of the object,\
    \ fruit, from the name of the function, length. `length()` takes no arguments,\
    \ as indicated by the empty parentheses (). The return value is an integer, in\
    \ this case 6. Notice that it is legal to have a variable with the same name as\
    \ a function.\n\nTo find the last letter of a string, you might be tempted to\
    \ try something like\n\n```\nint length = fruit.length();\nchar last = fruit[length];\
    \ // WRONG!\n```\n\nThat won't work. The reason is that there is no 6th letter\
    \ in \"banana\". Since we started counting at 0, the 6 letters are numbered from\
    \ 0 to 5. To get the last character, you must subtract 1 from length.\n\n```\n\
    int length = fruit.length();\nchar last = fruit[length-1];\n```\n\n## 7.5 Traversal\n\
    \nA common thing to do with a string is start at the beginning, select each character\
    \ in turn, do something to it, and continue until the end. This pattern of processing\
    \ is called traversal. A natural way to traverse is:\n\n```\nint index = 0;\n\
    while (index < fruit.length()) {\n  char letter = fruit[index];\n  cout << letter\
    \ << endl;\n  index = index + 1;\n}\n```\n\nThis loop traverses the string and\
    \ outputs each letter.\n\n## 7.6 A run-time error\n\nWay back in Section 1.3 I\
    \ talked about run-time errors, which are errors that cause the program to crash.\
    \ If you use an index that is negative or greater than length-1, you will get\
    \ a run-time error and a message like this:\n\n```\napstring fruit = \"banana\"\
    ;\ncout << fruit[6];\n```\n\n## 7.7 The find function\n\nThe `apstring` class\
    \ provides other functions that you can invoke on strings. Instead of taking an\
    \ index and extracting the character at that index, `find` takes a character and\
    \ returns the index where it appears. According to the documentation, it returns\
    \ the index of the first appearance. If the given letter does not appear in the\
    \ string, it returns -1.\n\n```\napstring fruit = \"banana\";\nint index = fruit.find('a');\n\
    ```\n\nIn addition, there is a version of `find` that takes another `apstring`\
    \ as an argument and finds the index where the substring appears in the string.\
    \ For example:\n\n```\napstring fruit = \"banana\";\nint index = fruit.find(\"\
    nan\");\n```\n\n## 7.8 Our own version of find\n\nIf we are looking for a letter\
    \ in an apstring, we may not want to start at the beginning of the string. One\
    \ way to generalize the find function is to write a version that takes an additional\
    \ parameter--the index where we should start. Here is an implementation:\n\n```\n\
    int find(apstring s, char c, int i)\n{\n  while (i<s.length()) {\n    if (s[i]\
    \ == c) return i;\n    i = i + 1;\n  }\n  return -1;\n}\n```\n\n## 7.9 Looping\
    \ and counting\n\nThe following program counts the number of times the letter\
    \ 'a' appears in a string:\n\n```\napstring fruit = \"banana\";\nint length =\
    \ fruit.length();\nint count = 0;\n\nint index = 0;\nwhile (index < length) {\n\
    \  if (fruit[index] == 'a') {\n    count = count + 1;\n  }\n  index = index +\
    \ 1;\n}\ncout << count << endl;\n```\n\nThis program demonstrates a common idiom,\
    \ called a counter. The variable count is initialized to zero then incremented\
    \ each time we find an 'a'.\n"
