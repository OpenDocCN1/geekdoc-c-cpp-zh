  - "[PAGE 38]\n\n# Chapter 4\n\n# Conditionals and recursion\n\n# 4.1 The modulus\
    \ operator\n\nThe modulus operator works on integers (and integer expressions)\
    \ and yields the remainder when the first operand is divided by the second. In\
    \ C++, the modulus operator is a percent sign, %. The syntax is exactly the same\
    \ as for other operators:\n\n```\nint quotient = 7 / 3;\nint remainder = 7 % 3;\n\
    ```\n\nThe first operator, integer division, yields 2. The second operator yields\
    \ 1. Thus, by 3 is 2 with 1 left over.\n\nThe modulus operator turns out to be\
    \ surprisingly useful. For example, you can check whether one number is divisible\
    \ by another: if x % y is zero, then x is divisible by y.\n\nAlso, you can use\
    \ the modulus to extract the rightmost digit or digits from a number. For example,\
    \ x % 10 yields the rightmost digit of x (in base 10). Similarly x % 100 yields\
    \ the last two digits.\n\n# 4.2 Conditional execution\n\nIn order to write useful\
    \ programs, almost always need the ability to check certain conditions and change\
    \ the behavior of the program accordingly. Conditional statements give us this\
    \ ability. The simplest form is the if statement:\n\n```\nif (x > 0) {\n    cout\
    \ << \"x is positive\" << endl;\n}\n```\n\nThe expression in parentheses is called\
    \ the condition. If it is true, then the statements in brackets get executed.\
    \ If the condition is not true, nothing happens."
  - '[PAGE 39]


    The condition can contain any of the comparison operators:


    ```

    x == y // x equals y

    x != y // x is not equal to y

    x > y // x is greater than y

    x < y // x is less than y

    x >= y // x is greater than or equal to y

    x <= y // x is less than or equal to y

    ```


    Although these operations are probably familiar to you, the syntax like =, !=
    and <=. is to use a single = instead of a double ==. Remember that = is the assignment
    operator, and == is a comparison operator. Also, there is no such thing as < or
    >.


    The two sides of a condition operator have to be the same type. You can only compare
    ints into and doubles. Unfortunately, at this point you cannot compare Strings
    at all! There is a way to compare Strings, but we won''t get it to you for a few
    chapters.


    # 4.3 Alternative execution


    A second form of conditional execution is alternative execution, in which there
    are two possibilities, and the condition determines which one gets executed. The
    syntax looks like:


    ```

    if (x==0) {

    cout << "x is even" << endl;

    } else {

    cout << "x is odd" << endl;

    }

    ```


    If the remainder x is divided by 2 is zero, then we know that x is even, and this
    code displays a message to that effect. If the condition is false, the second
    set of statements is executed. Since the condition must be true or false, exactly
    one of the alternatives will be executed.


    As an aside, if you might want to check the parity (evenness or oddness) of many
    numbers, you might want to “wrap” this code up in a function, as follows:


    ```

    void printParity (int x) {

    if (x==0) {

    cout << "x is even" << endl;

    } else {

    cout << "x is odd" << endl;

    }

    }

    ```'
