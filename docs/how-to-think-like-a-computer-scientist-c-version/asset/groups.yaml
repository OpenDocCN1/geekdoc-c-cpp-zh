    \ value of a double—correctly.\n\n## 5.2 Program development\n\nAt this point\
    \ you should be able to look at complete C++ functions and tell what they do.\
    \ But it may not be clear yet how to go about writing them. I am going to suggest\
    \ one technique that is incremental development.\n\nAs an example you might want\
    \ to find the distance between two points, given by the coordinates (x1, y1) and\
    \ (x2, y2). By the usual definition,\n\n```\n$distance = \\sqrt{(x_2 - x_1)^2\
    \ + (y_2 - y_1)^2}$\n```\n\nThe first step is to consider what a distance function\
