    ## 2.7 Operators


    **Operators** are special symbols that are used to represent simple computations
    like addition and multiplication. Most of the operators in C++ do exactly what
    you would expect them to do, because they are common mathematical symbols. For
    example, the operator for adding two integers is +.


    The following are all legal C++ expressions whose meaning is more or less obvious:


    + 1+1 hour-60 + minute minute/60


    Expressions can contain both variable names and integer values. In each case the
    name of the variable is replaced with its value before the computation is performed.


    Addition, subtraction and multiplication all do what you expect, but you might
    be surprised by division. For example, the following program:


    ```

    int hour, minute;

    hour = 19;

    cout << "Number of minutes since midnight: " << endl;

    cout << hour*60 + minute << endl;

    cout << "Fraction of the hour that has passed: " <<

    cout << minute/60.0 << endl;

    ```


    would generate the following output:


    ```

    Number of minutes since midnight: 719

    Fraction of the hour that has passed: 0

    ```


    The first line is what we expected, the second line is odd. The value of the variable
    minute is 59, and 59 divided by 60 is 0.9833, not 0. The reason for the discrepancy
    is that C++ is performing **integer division**.


    When both of the **operands** are integers (operands are the things operate on),
    the result must also be an integer, and by definition integer division always
    rounds down, even in cases like this where the next integer is so close.


    A possible alternative in this case is to calculate a percentage rather than a
    fraction:


    ```

    cout << "Percentage of the hour that has passed: ";

    cout << minute*100/60 << endl;

    ```


    The result is:


    ```

    Percentage of the hour that has passed: 98

    ```


    Again the result is rounded down, but at least now the answer is approximately
    correct. To get an even more accurate answer, we could use a different type of
    variable, called floating-point, that is capable of storing fractional values.
    We''ll get to that in the next chapter.


    ## 2.8 ORDER OF OPERATIONS


    When more than one operator appears in an expression the order of evaluation depends
    on the rules of precedence. A complete explanation of precedence can get complicated,
    but just to get you started:


    - * 2*3-1 yields 5, not 4, and 2/3-1 yields -1, not 1 (remember that integer division
    2/3 is 0).

    - * If the operators have the same precedence they are evaluated from left to
    right. So in the expression minus+100/60, the multiplication happens first, yielding
    5900/60, which turn yields 98. If the operations had gone from left to right,
    the result would be 59*1 which is 59, which is wrong.

    - * Any time you want to override the rules of precedence (or you are not sure
    what they are) you can use parentheses. Expressions in parentheses are evaluated
    first, so (3-1) is 4. 2 * (3-1) is 4. You can also use parentheses to make an
    expression easier to read, as in (minute * 100) / 60, even though it doesn''t
    change the result.


    ## 2.9 Operators for characters


    Interestingly, the same mathematical operations work on integers work on characters.
    For example,


    ```

