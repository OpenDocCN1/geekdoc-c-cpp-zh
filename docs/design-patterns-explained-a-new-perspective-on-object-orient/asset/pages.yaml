  md: 'abstractly and because they represent the collected experiences

    of many other analysts.


    +   - Patterns help people to learn principles of object orientation.

    The patterns help to explain why we do what with

    objects.


    I started my career in artificial intelligence (AI) creating rule-based

    expert systems. This involves listening to experts and creating mod-

    els of their decision-making processes and then coding these models

    into rules in a knowledge-based system. As I built these systems, I

    began to see repeating themes: in common types of problems,

    experts to work in similar ways. For example, experts who

    diagnose problems with equipment tend to look for simple, quick

    fixes first, then they get more systematic, breaking the problem into

    component parts; but in their systematic diagnosis, they tend to

    first inexpensive tests or tests that will eliminate broad classes of

    problems before other kinds of tests. This was true whether

    were diagnosing problems in a computer or a piece of oil field

    equipment.


    I would call these recurring patterns. Intuitively, I

    began to look for these recurring themes as I was designing new

    expert systems. My mind was open and friendly to the idea of pat-

    tern, even though I did not know what they were.


    Then, in 1994, I discovered that researchers in Europe had codified

    these patterns of expert behavior and put them into a package that

    they called Knowledge Analysis and Design Support, or KADS.

    Dr. Karen Gardner, a most gifted analyst, modeler, mentor, and

    human being, began to apply KADS to work in the United

    States. She extended the Europeans work to apply KADS to object-

    oriented systems. She opened my eyes to an entire world of pat-

    tern-based analysis and design that was forming in the software

    world, in large part due to Christopher Alexander s work. Her book,

    *Cognitive Patterns* (Cambridge University Press, 1998) describes this

    work.'
  merge: -1
