    # Pattern Oriented Design with Object-Oriented Design


    Pattern oriented design is a method for creating application designs that can
    accommodate requirements more robustly than standard methods. It is based on the
    principles proposed by Christopher Alexander, the ‘father of patterns’. It transcends
    older design techniques that are inflexible, difficult to maintain, inheritance
    hierarchies. Additionally, pattern design is taught in a way to illustrate the
    underlying principles of which they are – based


