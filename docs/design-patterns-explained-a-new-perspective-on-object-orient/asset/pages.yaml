  md: '# Chapter 8: An Introduction to Design Patterns


    # Overview


    In this chapter


    We introduce the concept of design patterns. I discuss the origins in architecture
    and how they apply in the discipline of software design. Finally, I discuss the
    motivations for studying design patterns.


    Design patterns and object-oriented design reinforce other


    Design patterns are part of the cutting edge of object-oriented technology. Object-oriented
    analysis tools, books, and seminars are incorporating design patterns. Study groups
    on design patterns abound. Object-oriented analysts are expected to learn design
    patterns to improve their abilities. I have found that the opposite is also true:
    learning design patterns greatly helped to improve my basic understanding of object-oriented
    analysis and design.


    Throughout the rest of the book, I will discuss not only design patterns, but
    how they reveal and reinforce good object-oriented principles. I hope to improve
    both your understanding of these principles and illustrate why the design patterns
    being discussed here represent good designs.


    Give this a chance


    Perhaps some of this material may seem abstract or philosophical. But give it
    a chance! This chapter lays the foundation for your understanding of design patterns.
    Understanding the material will speed up your ability to obtain new patterns.


    Some of this material is taken from Christopher Alexander''s Trilogy (Alexander
    1979, 1977, 1970)


    # Design Patterns arose from Architecture and Anthropology


    Is quality objective?


    Years ago, an architect named Christopher Alexander asked himself, "Is quality
    objective?" Beauty is true in the eye of the beholder or would people agree that
    some things are beautiful and some not? Now, the particular form of beauty that
    Alexander was interested in was one of architectural quality: what makes us know
    when an architectural design is good? For example, if a person was going to design
    an entrance-way for a house, would he or should she know that the design was good?


    Can know good design? Is there an objective basis for such a judgment?


    If there was not some sort of objective basis, we would not be able to make judgments.
    What is regarded as good for someone might be bad for someone else.


    Now, this book is not a treatise in cultural anthropology, but that of body suggests
    that within a culture, individuals will agree to a large extent on what is considered
    to be a good design, what is beautiful. Cultures make'
  merge: -1
  pgno: 322
- img_proc: true
  md: 'judgments on good design that transcend individual beliefs. I believe that
    there are transc patterns that serve as objective bases for judging design. A
    major branch of cultural anthropology looks for such patterns to describe the
    behaviors and values of a culture¹.


    # How do we get good quality repeated?


    If we accept that we can see even we have or do not a good quality design, how
    do we go about creating them? Alexander asked himself,


    > “What is present in a good quality design that is not present in a poor design?”


    and


    > “What is present in a poor quality design that is not present in a good quality
    design?”


    These questions spring from Alexander''s belief that if quality in design is objective,
    then we should be able to quantify what makes designs good and what makes designs
    bad.


    # Look for the commonalities


    Alexander studied this problem by making many observations of buildings, towns,
    streets and virtually every aspect of living spaces that human beings have built
    for themselves. He discovered that, for a particular architectural creation, good
    constructs had commonalities with each other.


    # ...especially commonality in the features of the problem to be solved


    Architectural structures differ from each other, even if they are of the same
    type. Even though they are different, they can still be high quality.


    For example, porches may appear different, but not have the same structure, and
    still be considered high quality. They might be solving different problems for
    different houses. One porch might be a transition from the walkway to the front
    door. Another porch might be a place for shade on a day. Or two porches might
    solve a common problem (transition) in different ways.


    Alexander understood this. He knew that structures couldn''t be separated from
    the problem they are trying to solve. Therefore, in his quest to identify and
    describe the consistency of quality in design, Alexander realized that he had
    to look at structures that were trying to solve the same problem.


    ¹ The anthropologist Ruth Benedict is a pioneer in pattern-based analysis of cultures.'
