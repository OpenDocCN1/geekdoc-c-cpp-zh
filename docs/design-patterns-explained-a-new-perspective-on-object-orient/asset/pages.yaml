  md: '# Chapter 3 · A Problem That Cries Out for Flexible Code 47


    The types of shapes—features—that may be found in a piece of sheet metal are described
    in Table 3-1. These are the shapes the system will have to address.


    # Table 3-1 Shapes Found in a Piece of Sheet Metal


    | Shape | Description |

    | --- | --- |

    | Slot | Straight cuts in the metal of constant width that terminate with either
    squared or rounded edges. Slots may be oriented to any angle. They are usually
    cut with a router bit. Figure 3-1 has three slots on the left side; one is oriented
    vertically while the others are oriented horizontally. |

    | Hole | Circles cut into the sheet metal. Typically they are cut with drill bits
    of varying width. Figure 3-1 has a hole toward the left surrounded by the three
    slots and has a larger hole toward the right of the sheet metal. |

    | Cutout | Squares with either squared or rounded edges. These are cut by a high-powered
    punch hitting the metal with great impact. Figure 3-1 has three cutouts; the lower
    right one is oriented at 45 degrees. |

    | Special | Preformed shapes that are not slots, holes, or cutouts. In these cases,
    a special punch has been made to create these quickly. Electrical outlets are
    a common "special" case. The star shape in Figure 3-1 is a special shape. |

    | Irregular | Anything else. They are formed by using a combination of tools.
    The irregularly shaped object toward the bottom right of Figure 3-1 is an irregular
    shape. |


    CAD/CAM experts also use additional terminology that is important to understand,
    as described in Table 3-2.'
