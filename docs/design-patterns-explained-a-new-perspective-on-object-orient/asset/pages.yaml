  md: '# 8 Part I • An Introduction to Object-Oriented Software Development


    Then, when I receive a requirement to be able to display a new type of shape—a
    triangle, for instance—I only need to change this module (hopefully!).


    Problems with modularity in a functional decomposition approach


    There are some problems with this approach, however. for example, I say that the
    inputs to the module were the type of shape and a description of the shape. Depending
    upon how I am storing shapes, it may or not be possible to have a consistent description
    of shapes that will work well for all shapes. What if the description of the shape
    is sometimes stored as an array of points? Would that work?


    Modularity definitely helps to make the code more understandable, and understandability
    makes the code easier to maintain. But modularity does not always help code deal
    with all the variation it might encounter.


    Low cohesion, tight coupling


    With the approach that I have used so far, I find that I have two significant
    problems, which go by the terms low cohesion and tight coupling. In his book Code
    Complete, Steve McConnell gives an excellent description of both cohesion and
