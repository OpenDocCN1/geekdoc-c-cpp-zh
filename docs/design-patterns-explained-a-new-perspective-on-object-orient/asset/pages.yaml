    # Review of Object-Oriented Terminology


    | Term | Description |

    |---|--|

    | Object | An entity that has responsibilities. I implement these by writing a
    class (in code) that defines data members (the variables associated with the objects)
    and methods (the functions associated with the objects). |

    | Class | The repository of methods. Defines the data members of objects. Code
    is organized around the class. |

    | Encapsulation | Typically defined as data-hiding, but better thought of as any
    kind of hiding. |

    | Inheritance | Having one class be a special kind of another class. These specialized
    classes are called derivations of the base class (the initial class). The base
    class is sometimes called the superclass while the derived classes are sometimes
    called the subclasses. |

    | Instance | A particular example of a class (it is always an object). The process
    of creating an instance of a class. |

    | Polymorphism | Being able to refer to different derivations of a class in the
    same way, but getting the behavior appropriate to the derived class referred to.
    |

    | Perspectives | There are three different perspectives for looking at objects:
    conceptual, specification, and implementation. These distinctions are helpful
    in understanding the relationship between abstract classes and their derivations.
    The abstract class defines how to solve things conceptually. It also gives the
    specification for communicating with any object derived from it. Each derivation
    provides the specific implementation needed.'
