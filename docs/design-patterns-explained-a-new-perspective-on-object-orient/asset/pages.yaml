  md: '# Chapter 11 · How Do Experts Design? 193


    # Alexander''s Steps Discussion


    Identify patterns


    Identify the patterns that are present in your problem. Think about your problem
    in terms of the patterns that are present. Remember, the purpose of the pattern
    is to define relationships among entities.


    Start with context patterns


    Identify the patterns that create the context for the other patterns. These should
    be your starting point.


    Then, work inward from the context


    Look at the remaining patterns and at any other patterns that you might have uncovered.
    From this set, pick the patterns that define the context for the patterns that
    would remain. Repeat.


    Refine the design


    As you refine, always consider the context implied by the patterns.


    Implement


    The implementation incorporates the details dictated by the patterns.


    # Using Alexander in software design: a personal observation.


    The first time I used Alexander''s approach, I took his words literally. His concepts—rooted
    in architecture—do not usually translate to software design. In some ways, I was
    lucky in my early experiences in using design patterns in that the problems I
    solved had the patterns follow pretty well-defined orders of context. However,
    this also worked against me in that I naively assumed that this method would work
    in general (it does not).'
  merge: -1
  pgno: 197
- img_proc: true
  md: 'This was compounded by the fact that many key designers in the software community
    were espousing the development of "pattern languages"—looking for formal ways
    to apply Alexander to software. I interpreted this to mean that we were close
    to being able to apply Alexander''s approach directly in software design (I no
    longer believe this to be true). Since Alexander said patterns in architecture
    had predetermined orders of context, I assumed patterns in software also had this
    predetermined order. That is, one type of pattern would always create the context
    for another type. I began to evangelize about Alexander''s approach—as I understood
    it—while teaching others. A few months and a few projects later, I began to see
    the problems. There were cases where a preset order of contexts did not work.


    Having been trained as a mathematician, I only needed one counterexample to disprove
    my theory. This started me questioning everything about my approach—something
    I usually did, but had forgotten in my excitement.


    Since that early stage, I now look at the principles upon which Alexander''s work
    is based. While they manifest themselves differently in architecture and software
    development, these principles do to apply to software design. I see it in more
    rapid and robust analysis. I experience it every time I have to maintain my software.


