    In this case, there are enough combinations that we can look at all of the possibilities.


    What exactly do we mean when we say one pattern creates the context for another?
    One definition of context is the interrelated conditions in which something exists
    or occurs—an environment, a setting.


    In the courtyard example in Chapter 11, "How Do Experts Design?" Alexander said
    that a porch exists in the context of the courtyard. The courtyard defines the
    environment or the settings in which the porch exists.


    A pattern in a system often relates to other patterns in the system by providing
    a context for these other patterns. In your analysis, it is always valuable to
    look for whether and how a pattern relates to the other patterns, to look for
    the contexts that the pattern creates or provides for the other patterns as well
    as those contexts in which the pattern itself exists. You may not be able to find
    these every time. But, by looking, you will create higher-quality solutions.


    Looking for context is an essential tool to add to your bag of analysis and design
    tools.'
