    # Describe the Problem


    I need to design a program that will allow the expert system to open and read
    a model containing the geometry of a part that I want to analyze and then generate
    the commands for the numerically controlled (NC) machine to build the piece of
    sheet metal.


    I am only concerned about sheet metal parts in this example. However, the CAD/CAM
    system can handle many other kinds of parts.


    At a high level, I want the system to perform the following steps:


    +   * Analyze pieces of sheet metal.

    * See how they should be made, based on the features they contain.

    * Generate a set of instructions that are readable by manufacturing equipment.
    This set of instructions is called an NC set or a numerical control set.'
