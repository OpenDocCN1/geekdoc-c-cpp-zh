  md: '# Chapter 5 • An Introduction to Design Patterns 85


    Most design patterns also make software more modifiable. The reason- for this
    is that they are time-tested solutions. Therefore, they have evolved into structures
    that can handle change more readily than what first comes to mind as a solution.


    Improved modifiability of code


    Design patterns, when they are taught properly, can be used to greatly increase
    the understanding of basic object-oriented principles. I have seen this countless
    times in the introductory object-oriented courses I teach. I start with a brief
    introduction to the object-oriented paradigm. I then proceed to teach design patterns,
    using them to illustrate the basic object-oriented concepts (encapsulation, inheritance,
    polymorphism). By the end of the three-day course, although we''ve been talking
    mostly about patterns, these concepts—which were just introduced to many of the
    participants—feel like old friends.


    Design patterns illustrate basic object-oriented principles


    The Gang of Four suggests a few strategies for creating good objectoriented designs.
    In particular, they suggest the following:


    Adoption of improvedstrategies—even when patterns aren''t present


    +   - Design to interfaces.


    +   - Favor composition over inheritance.


    +   - Find what varies and encapsulate it.


    These strategies were employed in most of the design patterns discussed in this
    book. Even if you do not learn all of design patterns, studying a few should enable
    you to learn why these strategies are useful. With that understanding the ability
    to apply them to your own design problems even if you do not use design patterns
    directly.


    Another advantage is that design patterns allow you or your team to create designs
    for complex problems that do not require large inheritance hierarchies. Again,
