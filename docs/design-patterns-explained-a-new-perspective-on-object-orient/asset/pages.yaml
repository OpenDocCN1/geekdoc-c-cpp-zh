  md: '# Design Pattern Matrix


    # DECOUPLING PATTERNS


    # Pattern


    # How it is implemented


    # Class Diagram


    Define an abstract class that represents possible handlers of a function. This
    class contains a reference to at most one other object derived from type. Define
    an abstract method that the client will call. by either performing the requested
    operation (in one particular way) or by handing off to the handler it refers to.
    Note: it may be the handler is never called. You can implement a default method
    in the abstract class that is called when you reach the end of the chain.


    # Chain of responsibility


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_341_0.png)


    Define abstract classes for both collections and iterators. Each derived collection
    includes a method which initializes the appropriate iterator. The iterator must
    be able to request the required information from the collection to traverse appropriately.


    # Iterator


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_341_1.png)


    Define a central class that acts as a message routing service to all other classes.


    # Mediator


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_341_2.png)


    Define a new class that can remember the internal state of another object. The
    Caretaker controls when to create these, but the Originator will actually use
    them when it restores its state.


    # Memento


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_341_3.png)


    Have objects (Observers) that want to know when an event happens, attach them
    to another object (Subject) that is actually looking for it. When the event occurs,
    the subject tells the observers it occurred. The Adapter pattern is sometimes
    needed to implement the Observer interface for all the Observer object types.


    # Observer


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_341_4.png)


    The proxy pattern has a new object (Proxy) to stand in place of, already existing
    (the Real Subject). The proxy encapsulates any rules required for access to the
    real subject. The proxy and the real object have the same interface so the Client
    does not need to know that proxy is being used. Requests are passed through the
    proxy to the Real Subject with any necessary processing to make the remote connection.


    # Proxy - accessibility


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_341_5.png)'
