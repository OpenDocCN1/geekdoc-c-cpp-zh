  md: '# The Decorator Pattern: Key Features


    Intent


    Attach additional responsibilities to an object dynamically.


    Problem


    The object that you want to use does the basic functions you require. However,
    you may need to add some additional functionality to the object, occurring before
    or after the object''s base functionality. Note that the Java foundation classes
    use the Decorator pattern extensively for IO handling.


    Solution


    Allows for extending the functionality of an object without resorting to subclassing.


    Participants and Collaborators


    The ConcreteComponent is the class having added to it by the Decorators. Sometimes
    classes derived from ConcreteComponent are used to provide the core functionality,
    in which case ConcreteComponent is no longer concrete, but rather abstract. The
    Decorator defines the interface for all of these classes to use.


    Consequences


    Functionality that is to be added in small objects. The advantage is to dynamically
    add this function before or after the functionality in the ConcreteComponent.
    Note: While a decorator may add its functionality before or after that it decorates,
    the chain of instantiation always ends with the ConcreteComponent.


    Implementation


    Create an abstract class that represents the original class and the new functions
    to be added to the class. In the decorators, place the new function calls or after
    the trailing calls to get the correct order.


    GoF Reference


    Pages 175-184.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_252_0.png)'
