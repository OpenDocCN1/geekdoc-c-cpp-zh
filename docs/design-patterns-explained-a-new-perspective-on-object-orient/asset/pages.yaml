  md: 'Already we see a qualitative difference. The carpenters are discussing differences
    in the quality of the solutions to a problem; their discussion is at a higher
    level, a more abstract level. They avoid getting boggedged down in the mere details
    of a particular solution.


    When the carpenter speaks of a miter joint, he or she has the following characteristics
    of the solution in mind.


    +   - It is a simpler solution. Miter joint is a simple joint to make. You cut
    the edges of the joining pieces at 45 degrees, abut them, and then nail or glue
    them (see Figure 8-2).

    - However, it is also a weaker joint.


    When the carpenter speaks of a dovetail joint (which we saw above), he or she
    has other characteristics of the solution in mind. These characteristics may not
    be obvious to a layman, but would clearly be understood by any carpenter.


    +   - It is a more evolved solution. It is more involved to a dovetail joint.

    - It is impervious to temperature and humidity. As this change, the wood expands
    or contracts. However, the dovetail joint will remain solid.

    - It does not depend on glue or other fastening systems. In fact dovetail joints
    do not depend even upon glue to work.

    - It is a more aesthetically pleasing joint. Beautiful to look at when made well.


    In other words, the dovetail joint is a strong, dependable, beautiful joint that
    is hard (expensive) to make.


