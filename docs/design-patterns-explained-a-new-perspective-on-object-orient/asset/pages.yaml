  md: '# The Open-Closed Principle


    Extend software capabilities without changing it


    Software clearly needs to be extensible. However, making changes to software runs
    the risk of introducing problems. This dilemma led Bertrand Meyer to propose the
    open-closed principle.1 To paraphrase this principle, the modules, methods, and
    classes should be open for extension, while closed for modification.2 In other
    words, we must design our software so that we can extend the capabilities of our
    software without changing it.


    As contradictory as this may sound at first, you have already seen examples of
    it. In the Bridge pattern, instance, is it possible to add new implementations
    (that is, to extend the software) without changing any of the existing classes.


    # The Principle of Designing from Context


    Patterns are microcosms of Alexander''s philosophy


    Alexander tells us to design from context, to create the big picture before designing
    the details in which our pieces appear. Most design patterns follow this approach,
    to a greater extent than others. Of the four patterns I have described so far,
    the Bridge pattern is the best of them.


    Refer to the Bridge pattern diagram in Chapter 9, "The Bridge pattern," (see Figure
    9-13). When deciding how to design the Implementation classes, think about their
    context: the way that the classes derived from the Abstraction class will use
    them.


    For example, if I were writing a system that needed to draw shapes on different
    types of hardware and that required different implementations, I would use a Bridge
    pattern. The Bridge tells me that the shapes will use my implementations (that
    is, the drawing


    +   1. Meyer, Object-Oriented Software Construction, Upper Saddle River, N.J.:
    Prentice Hall, 1997, p. 57.

    2. See this book''s Web Site for a link to "The Open-Closed Principle," an excellent
    article by Robert C. Martin. Go to http://www.netobjectives.com/dpexexplained.'
