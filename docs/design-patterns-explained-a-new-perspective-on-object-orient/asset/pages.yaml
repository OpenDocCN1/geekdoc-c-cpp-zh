  md: '# Field Notes: The Facade Pattern


    Facades can be used not only to create a simpler interface in terms of method
    calls, but also to reduce the number of objects that a client must deal with.
    For example, suppose I have a Client object must deal with Databases, Models,
    and Elements. The Client must first open the Database and get a Model. Then it
    queries the Model to get an Element. Finally, it asks the Element for information.
    It might be a lot easier to create a Database-Facade that could be queried by
    the Client (see Figure 6-4).


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_99_0.png)


    Figure 6-4 Facade reduces the number of objects for the client.


    Suppose that in addition to using functions that are in the system, I also need
    to provide some new functionality. In this case, I am going beyond a simple subset
    of the system.


    In this case, the methods I write for the Facade class may be supplemented by
    new routines for the new functionality. This is still the Facade pattern, but
    expanded with new functionality.'
