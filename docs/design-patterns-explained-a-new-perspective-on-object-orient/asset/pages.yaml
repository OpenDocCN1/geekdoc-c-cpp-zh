  md: '# Preface xvii


    I was convinced that design patterns were the greatest thing to happen to software
    design since the invention of object-oriented design.


    However, when I looked at my work at the time, I saw that I was not incorporating
    any design patterns into my code.


    I just figured I didn''t know enough design patterns yet and needed to learn more.
    At the time, I knew about six of them. Then I had had what could be called an
    epiphany. I was working on a project as a mentor in object-oriented design and
    was asked to create a high-level design for the project. The leader of the project
    was extremely sharp, but was fairly new to object-oriented design.


    The problem wasn''t that difficult, but it required a great deal of attention
    to make sure the code was going to be easy to maintain. Literally, after two minutes
    of looking at the problem, I had developed a design based on my normal approach
    of data abstraction. Unfortunately, it was very clear this was not going to be
    a good design. Data abstraction alone had failed me. I had to find something better.


    Two hours later, after applying every design technique I knew, I was no better
    off. My design was essentially the same. What was most frustrating was that I
    knew there was a better design. I couldn''t see it. Ironically, I also knew of
    four design patterns that “lived” in my problem but I couldn''t see how to use
    them. Here I was—a supposed expert in object-oriented design—baffled by a simple
    problem!


    Feeling very frustrated, I took a break and started walking down the hall to clear
    my head, telling myself I would not think of the problem for at least 10 minutes.
    Well, 30 seconds later, I was thinking about it again! But I had gotten an insight
    that changed my view of design patterns: rather than using patterns as individual
    items, I should use the design patterns together.'
  merge: -1
  pgno: 3
- img_proc: true
  md: 'Patterns are supposed to be sewn together to solve a problem.


    I had heard this before, but hadn’t really understood it. Because patterns in
    software have been introduced as design patterns, I had always labored under the
    assumption that they had mostly to do with design. My thoughts were that in the
    design world, the patterns came as pretty much well-formed relationships between
    classes. Then, I read Christopher Alexander’s amazing book, The Timeless Way of
    Building. I learned that patterns existed at all levels—analysis, design, and
    implementation. Alexander discusses patterns to help in the understanding of the
    problem domain (even in describing it), not in creating the design after the problem
    domain is understood.


    My mistake had been in trying to create the classes in my problem domain and then
    stitch them together to make a final system, a process which Alexander calls a
    particularly bad idea. I had never asked if I had the right classes because they
    just seemed so right, so obvious; they were the classes that immediately came
    to mind as I started my analysis, the “nouns” in the description of the system
    that we had been taught to look for. But I had struggled trying to pick them together.


    When I stepped back and used design patterns and Alexander’s approach to guide
    me in the creation of my classes, a superior solution unfolded in only a matter
    of minutes. It was a good design and we put it into production. I was excited—excited
    to have designed a good solution and excited about the power of design patterns.
    It was then that I started incorporating design patterns into my development work
    and my teaching.


    I began to discover that programmers who were new to object-oriented design could
    learn design patterns, and in doing so, develop a basic set of object-oriented
    design skills. It was true for me and it was true for the students that I was
    teaching.'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Imagine my surprise! The design pattern books I had been reading and the design
    pattern experts I had been talking to were saying that you really needed to have
    a good grounding in object-oriented design before embarking on a study of design
    patterns. Nevertheless, I saw, with my own eyes, that students who learned object-oriented
    design concurrently with design patterns learned object-oriented design faster
    than those studying object-oriented design. They even seemed to learn design patterns
    almost the same rate as experienced object-oriented practitioners.


    I began to use design patterns as a basis for my teaching. I began to call my
    classes *Pattern Oriented Design: Design Patterns from Analysis to Implementation.


    I wanted my students to understand these patterns and began to discover that by
    using an exploratory approach was the best way to foster this understanding. For
    instance, I found that it was better to present the Bridge pattern by presenting
    a problem and then have my students try to design a solution to the problem using
    a few guiding principles and strategies that I had found present in most of the
    patterns. In their exploration, the students discovered the solution—called the
    Bridge pattern—and remembered it.


    In any event, I found that these guiding principles and strategies could be used
    to "derive" several of the design patterns. By "derive a design pattern," I mean
    that if I looked at a problem that I know could be solved by a design pattern,
    I could use the guiding principles and strategies to come up with the solution
    that is expressed in the pattern. I made it clear to my students that we weren''t
    really coming up with design patterns this way. Instead, I was just illustrating
    one possible thought process that the people who came up with the original solutions,
    those that were eventually classified as design patterns, might have used.'
  merge: -1
