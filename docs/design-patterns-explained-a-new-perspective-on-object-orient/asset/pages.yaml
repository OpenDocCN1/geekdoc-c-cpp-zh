  md: '# From Object Orientation to Patterns to

    True Object Orientation


    In many ways, this book is a retelling of my personal experience learning design
    patterns. Prior to studying design patterns, I considered myself to be reasonably
    expert in object-oriented analysis and design. My track record had included several
    fairly impressive designs and implementations in many industries. I knew C++ and
    was beginning to learn Java. The objects in my code were well-formed and tightly
    encapsulated. I could design excellent abstractions for inheritance hierarchies.
    I thought new object-orientation.


    Now, looking back, I see that I really did not understand the full capabilities
    of object-oriented design, even though I was doing the ways the experts advised.
    It wasn''t until I began to learn design patterns that my object-oriented design
    abilities expanded and deepened. Knowing design patterns has made me a better
    designer, even when I don''t use these patterns directly.


    I began studying design patterns in 1996. I was a C++/object-oriented design mentor
    at a large aerospace company in the northwest. Several people asked me to lead
    a design pattern study group. That''s where I met my co-author, Jim Trott. In
    the study group, several interesting things happened. First, I grew fascinated
    with design patterns. I loved being able to compare my designs with the designs
    of others who had more experience than I had. I discovered that I was not taking
    full advantage of designing to interfaces and that I didn''t always concern myself
    with seeing if I could have an object use another without knowing the used object''s
    type. I noticed that beginners to object-oriented design—those who would normally
    be deemed as learning design patterns too early—were benefiting from as much from
    the study group as the experts were. The patterns presented examples of excellent
    object-oriented designs and illustrated basic object-oriented principles, which
    helped to mature their designs more quickly. By the end of the study session,'
  merge: -1
