    +   * In both the Facade and Adapter pattern I have preexisting classes.


    Sometimes people draw the conclusion that another difference between the Facade
    and the Adapter pattern is that the Facade hides multiple classes behind it while
    the Adapter only hides one. While this is true, it is not part of the pattern.
    It is possible that a Facade could be in front of a very complex object while
