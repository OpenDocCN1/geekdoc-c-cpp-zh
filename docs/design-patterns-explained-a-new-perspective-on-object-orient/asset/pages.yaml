    +   - In C++, I would use single inheritance or multiple inheritance, as required.


    Step 2: Have the observers register themselves  In most situations, I want the
    observers to be responsible for knowing what to watch for and I want the subject
    to be free from knowing which observers depend on it. To do this, I need to have
    a way for the observers to register themselves with the subject. Since all of
    the observers are of the same type, I must add two methods to the subject:


    +   - attach (Observer)—adds the given Observer to its list of observers

    - detach (Observer)—removes the given Observer from its list of observers


    Step 3: Notify the observers when the event occurs  Now that the Subject has its
    Observers registered, it is a simple matter for the Subject to notify the Observers
    when the event occurs. To do this, each Observer implements a method called update.
    The Subject implements a *notify* method that goes through its list of Observers
    and calls this update method for each of them. The update method should contains
    the code to handle the event.


    Step 4: Get the information from the subject  But notifying each observer is not
    enough. An observer may need more information about the event beyond the simple
    fact that it has occurred. Therefore, I must also add method(s) to the subject
    that allow the observers to get whatever information they need. Figure 17-2 shows
    this solution.


    How this works In Figure 17-2, the classes relate to each other as follows:


    +   1. The Observers attach themselves to the Customer class when they are instantiated.
    If the Observers need more information from the subject (Customer), the update
    method must be passed a reference to the calling object.'
