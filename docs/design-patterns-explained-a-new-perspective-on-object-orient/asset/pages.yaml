    Carpenters do not really talk at that level of detail Course, no self-respecting
    carpenter would talk like this. What would happen is something like:


    > Carpenter 1: Should we use a dovetail joint or a miter joint?


    Already we see a qualitative difference. The carpenters are discussing differences
    in the quality of solutions to a problem; their discussion is at a higher level,
    a more abstract level. They avoid getting bogged down in the details of a particular
    solution.


    When the carpenter speaks of a miter joint, he or she has the following characteristics
    of the solution in mind:


    +   - It is lightweight—A miter joint is weaker than a dovetail. It cannot not
    hold together under great stress.


    +   - It is inconspicuous—The miter joint''s single cut is much less noticeable
    than the dovetail joint''s multiple cuts.'
