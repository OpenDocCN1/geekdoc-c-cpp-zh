- img_proc: true
  md: 'These strategies occur in most of the design patterns described. Even if you
    do not learn a lot of design patterns, studying a few should enable you to learn
    why these strategies are useful. With that understanding comes the ability to
    apply them to your own design problems even if you do not use design patterns
    directly.


    # Learn alternatives to large inheritance hierarchies


    Another advantage is that design patterns allow you or your team to create designs
    for complex problems that do not require large inheritance hierarchies. Again,
    even if design patterns are not used directly, avoiding large inheritance hierarchies
    will result in improved designs.


    # Summary


    We have looked at what design patterns are. Christopher Alexander says ‘patterns
    are solutions to a problem in a context.” They are more than a kind of template
    to solve one’s problems. They are a way of describing our motivations by including
    both what we want to have happen with the problems that are plaguing us.


    We looked at why we should study design patterns. Studying design patterns helps
    to:


    +   - Reuse existing, high quality solutions to commonly recurring problems.

    - Establish common terminology to improve communications within teams.

    - Shift our level of thinking to a higher perspective.

    - Improve individual learning and team learning.

    - Improve the modifiability of code.

    - Facilitate adoption of improved design alternatives, even when patterns are
    not used explicitly.

    - Discover alternatives to large inheritance hierarchies.


    > i A Pattern Language, Christopher Alexander

