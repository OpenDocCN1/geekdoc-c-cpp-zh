  md: '# CHAPTER 10


    # The Abstract Factory Pattern


    # Overview


    In this chapter


    In this chapter,



    - I derive the pattern by working through an example.

    - I present the key features of the Abstract Factory pattern.

    - I relate the Abstract Factory pattern to the CAD/CAM problem.


    # Introducing the Abstract Factory Pattern


    According to the Gang of Four, the intent of the Abstract Factory pattern is to
    “provide an interface for creating families of related or dependent objects without
    specifying their concrete classes.”


    Sometimes, several objects need to be instantiated in a coordinated fashion. For
    example, when dealing with user interfaces, the system might need to use one set
    of objects to work on one operating system and another set of objects to work
    on a different operating system. The Abstract Factory pattern ensures that the
    system always gets the correct objects for the situation.


    > Gamma, E., Helm, R., Johnson, R., Vissides, J., Design Patterns: Elements of
    Reusable Object-Oriented Software., Reading, Mass.: Addison-Wesley, 1995, p. 87.'
