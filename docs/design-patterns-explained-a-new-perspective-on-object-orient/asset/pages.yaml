  md: '![](img/f880ca1c4f3aef846008aeb26c864ed7_324_0.png)


    # Figure 8-1. Structures may look different but still solve a common problem


    He defined a pattern as "a solution to a problem in a context.\”


    > "Each pattern describes a problem which occurs over and over again in our environment
    and then describes the core of the solution to that problem, in such a way that
    you can use this solution million times without ever doing it the same way twice."


    An example pattern: the Courtyard Let''s read some of Alexander''s work to illustrate
    this. I will present an excerpt from his Timeless Way of Building, an excellent
    book which presents the philosophy of patterns succinctly.


    # Alexander says... My comments...


    In the same way, a courtyard which is properly formed helps people come to life
    in it. A pattern always, has a name and has a purpose. Here, the pattern''s name
    is "Courtyard" and its purpose is to help people to come to life in it.


    Consider the forces at work in a courtyard. Most fundamental of all, people seek
    some kind of private space, where they can sit under the sky, the stars enjoy
    the sun, perhaps plant flowers. This is obvious. Although it may be obvious sometimes,
    it is important to state explicitly the problem being solved, which is the reason
    for having the pattern in the first place. This is what Alexander does here for
    Courtyard..


    But there are more subtle forces too. For instance, when a courtyard is tightly
    enclosed, has no view out, people feel uncomfortable, and tend to stay away ...
    they need to see out into some larger and more distant space. He points out a
    difficulty with the simplified solution which we may have thought ...and then
    gives us a way to solve the problem that he has just pointed out.'
