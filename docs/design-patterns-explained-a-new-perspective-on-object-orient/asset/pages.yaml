    like this, new design methods become available. This is where the real power of
    patterns lies.


    Patterns help us see the forest and the trees


    # Other Advantages to Studying Design Patterns


    Improve team communications and individual learning


    My experience with development groups working with design patterns is that design
    patterns helped both individual learning and team development. This occurred because
    the more junior team members who knew design patterns had something of value and
    these junior members wanted it. This provided motivation for them to learn some
    of these powerful concepts.'
