- img_proc: true
  md: '![](img/f880ca1c4f3aef846008aeb26c864ed7_62_0.png)


    Figure-3-5 High-level view of my solution.


    In other words, the application can initialize everything so that the expert system
    uses the appropriate CAD/CAM system. However, the expert system has to be able
    to use either version. Hence, I need to make V1 and V2 look like the expert system.


    Polymorphism isn ''t needed at all levels Although polymorphism is definitely
    needed at the geometry extractor level, it will not be needed at the feature level.
    This is because the expert system needs to know what type of features it is dealing
    with. However, we don''t want to make any changes to the expert system when Version
    3 of the CAD/CAM system comes out.


    High-level class diagram A basic understanding of object-oriented design implies
    that I will have a high-level class diagram similar to the one shown in Figure
    36.


    In other words, the expert system relates to the CAD/CAM systems through the Model
    class. The Main class takes care of instantiating the correct version of the Model
