  md: '# Learning the Facade Pattern


    A motivating example: learn how to use our complex system!


    Once, I worked as a contractor for a large engineering and manufacturing company.
    My first day on the job, the technical lead of the project was not in. Now, this
    client did not to pay me by the hour and had nothing for me to do. They wanted
    me to be doing something, even if it was not useful! Haven''t you had days like
    this?


    So, one of the project members found something for me to do. She said, "You are
    going to have to learn the CAD/CAM system we use some time, so you might as well
    start now. Start with these manuals over here." Then she took me to the set of
    documentation. I am not making this up: there were 8 feet of manuals for me to
    read . . each page 8/2 x 11 inches and in small print! This was one complex system!


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_96_0.png)


    **Figure 6-1** Eight feet of manuals = one complex system!


    I want to be insulated from this


    Now, if you and I and say four or five people on a project that use this system,
    not all of us would have to learn the entire thing. Rather than waste everyone''s
    time, we would probably draw straws, and the loser would have to write routines
    that the rest of us would use to interface with the system.'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'This person would determine how I and others on our team were going to use
    the system and what API would be best for our particular needs. She would then
    create a new class or classes that had the interface required. Then, I and the
    rest of the programming community could use this new interface without having
    to learn the entire complicated system (see Figure 6-2).


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_97_0.png)


    Figure 6-2 Insulating clients from the subsystem.


    Now, this approach only works when using a subset of the system''s capabilities
    or when interacting with it in a particular way. If everything in the system needs
    to be used, it is unlikely that I can come up with a simpler interface (unless
    the original designers did a poor job).


    Works with subsets


    This is the Facade pattern. It enables us to use a complex system more easily,
    either to just use a subset of the system or use the system in a particular way.
    We have a complicated system of which we need to use only a part. We end up with
    a simpler, easier-to-use system or one that is customized to our needs.


    This is the Facade pattern


    Most of the work still needs to be done by the underlying system. The Facade provides
    a collection of easier-to-understand methods. These methods use the underlying
    system to implement the newly defined functions.'
