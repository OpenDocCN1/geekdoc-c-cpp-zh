  md: '# # Section 3: Design Patterns


    # ## Section Overview


    **In this section**


    This section introduces design patterns: what they are and how to use them. Four
    patterns pertinent to the CAD/CAM problem (Chapter 6) are described. They are
    learned individually and then related to our earlier problem. In learning these
    patterns, we emphasize the object-oriented strategies espoused by the Gang of
    Four in their seminal work: Design Patterns: Elements of Reusable Object-oriented
    Software.


    Chapter 8 is an introduction to design pattern. I introduce the concept of design
    patterns, discuss their origins in architecture and how they apply in the discipline
    of software design. Then, I discuss the motivations for studying design patterns.


    Chapter 9 describes the Façade pattern. I explain what it is, where it is used
    and how it is implemented. Then I relate it to the CAD/CAM problem.


    Chapter 10 describes the Object Adapter pattern. I explain what it is, where it
    is used and how it is implemented. I compare the Object Adapter pattern and the
    Façade pattern. Then, I relate the Object Adapter pattern to the CAD/CAM problem.


    Chapter 11 describes the Bridge pattern. The Bridge pattern is quite bit more
    complex than the previous patterns; it is also much more useful. While I could
    discuss these other patterns more conceptually, I go into great detail with the
    Bridge pattern. Then, I relate the Bridge pattern to the CAD/CAM problem.


    Chapter 12 describes the Abstract Factory pattern The Abstract Factory pattern
    focuses on creating families of objects. I describe this pattern and how it is
    used and implemented. Then, I relate it to the CAD/CAM problem.


    **Objectives**


    At the end of this section, the reader will understand what design patterns are,
    why they are useful and will know four specific patterns. They will also see how
    these patterns relate to our earlier CAD/CAM problem. This information, however,
    may not be enough to create a better design than the over reliance on inheritance
    already seen. However, the stage is set for using patterns in a way different
    than most design pattern practitioners use them.'
