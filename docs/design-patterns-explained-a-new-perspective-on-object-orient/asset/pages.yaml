  md: '# The Bridge Pattern: Key Features


    Intent

    Decouple a set of implementations from the set of objects using them.


    Problem

    The derivations of an abstract class must use multiple implementations without
    causing an explosion in the number of classes.


    Solution

    Define an interface for all implementations to use and have the derivations of
    the abstract class use that.


    Participants and Collaborators

    The Abstraction defines the interface for the objects being implemented. The Implementor
    defines the interface for the specific implementation classes. Classes derived
    from the Abstraction classes derived from the Implementor without knowing which
    ConcreteImplementor is in use.


    Consequences

    The decoupling of the implementations from the objects that use increases extensibility.
    Client objects are not aware of implementation issues.


    +   Implementation

    • Encapsulate the implementations in an abstract class.

    • Contain a handle to it in the base class of the abstraction being implemented.

    Note: In Java, you can use interfaces instead of an abstract class for the implementation.


    GoF Reference

    Pages 151–162.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_156_0.png)'
