  md: 'What makes this analytical method so powerful is that it does not have to rely
    on my experience or my intuition or my creativity. Alexander’s thesis is that
    these patterns exist independent of any person. A space is alive because it follows
    a natural process, not simply because the designer was a genius. Since the quality
    of a design is dependent upon following this natural process, it should not be
    surprising that quality solutions for similar problems appear very much alike.


    Based on this, he gives us the rules a good designer would follow.


    +   * One at a time—Patterns should be applied one at a time in sequence.

    * Context free—Apply those patterns first that create the context for the other
    patterns.


    # Patterns define relationships.


    The patterns that Alexander describes define relationships between the entities
    in the problem domain. These patterns are not as important as the relationships
    but give us a way to talk about them.


