  md: '# Categories of Patterns


    | Category | Purpose | Examples in This Book | Use For |

    | --- | --- | --- | --- |

    | Structural | Bring together existing objects | Facade (Chapter 6) Adapter (Chapter
    7) | Handling interfaces |

    | Behavioral | Give a way to manifest flexible (varying) behavior | Bridge (Chapter
    9) Decorator (Chapter 15) Strategy (Chapter 14) | Relating implementations to
    abstractions Containing variation |

    | Creational | Create or instantiate objects | Abstract Factory (Chapter 10) Singleton
    (Chapter 16) Double-Checked Locking (Chapter 16) Factory Method (Chapter 19) |
    Instantiating objects |


    A note on the classification of the Bridge and the Decorator patterns


    When I first started designing design patterns, I was surprised to see the Bridge
    and Decorator patterns were structural patterns rather than behavioral patterns.
    After all, they seemed to implement different behaviors. At the time, I simply
    did not understand the GoF''s classification system. Structural patterns are for
    tying together existing function. In the Bridge pattern, we typically start with
    abstractions and implementations and then bind together with the bridge. In the
    Decorator pattern, we have an original functional class, and want to decorate
    it with additional functions.


    My "fourth" category: decoupling


    I have found it valuable to think of a fourth category of patterns, whose one
    purpose is to decouple objects from each other. One motivation for this is to
    allow for scalability or increased flexibility. I call this category of patterns
    *decoupling patterns*. Since most of the patterns in the decoupling category belong
    to the Gang of Four''s behavioral category, I could almost call them a subset
    of the behavioral category. I chose to make a fourth category simply because my
    intent in this book is to reflect how I look at patterns, focusing on their motivations—in
    this case, decoupling.'
