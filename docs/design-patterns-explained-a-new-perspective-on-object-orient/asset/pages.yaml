  md: '# Design Pattern Matrix


    # THINGS TO LOOK FOR


    # Guide to finding patterns in the problem domain


    Is there variation of a business rule or an implementation?

    Do we need to add some function?


    +   Strategy – do we have varying rules?

    Bridge – do we have multiple implementations?

    Proxy – do we need to add some new functionality to something that already exists?

    Decorator – do we have additional functionality we may need to apply, but what
    we add varies?

    Visitor – do we have new tasks that we will need to use for our existing classes?


    Are you concerned with interfaces, each changing, or handling type objects in
    the same way?


    +   Adapter – do we have the right stuff but the wrong interface? (used to fit
    classes into patterns as well)

    Composite – do we have units and groups and want to treat them the same way

    Façade – do we want to simplify our interfaces?

    Proxy – do we want to incorporate a rule to access something without affecting
    any other class?


    Are we trying to decouple things?


    +   Observer – do we need to know about events that have occurred

    Chain of Responsibility – do we have different objects that can do the job but
    we don''t want the client know who is going to do it?

    Iterator – do we want to separate the collection from the client that is using
    so we don''t have to worry about the right collection implementation?

    Mediator – do we have a lot of coupling in who must talk to whom?

    State – do we have a system of lets of states where keeping track of code for
    the different states is difficult?


    Are we trying to make things?


    +   Abstract Factory – do we need to create families (or sets) of objects?

    Builder – do we need to create our objects with several steps?

    Factory Method – do we need to have derived classes for what to instantiate?


    Remember the relationship between commonality/variability analysis, the conceptual,
    specification, implementation perspectives and how these are implemented in object-oriented
    languages.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_343_0.png)'
