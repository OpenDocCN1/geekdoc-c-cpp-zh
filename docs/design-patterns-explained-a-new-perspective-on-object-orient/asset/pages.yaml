  md: '# Introducing the Singleton Pattern


    The intent, according to the Gang of Four, According to the Gang of Four, the
    Singleton''s intent is to


    Ensure a class has only one instance, and provide a global point of access to
    it.²


    How the Singleton pattern works The Singleton pattern works by having a special
    method that is used to instantiate the desired object.


    When this method is called, it checks to see if the object has already instantiated.
    If it has, the method simply returns a reference to the object. If not, the method
    instantiates it and returns a reference to the new instance.


    To ensure that this is the only way to instantiate an object of this type, I define
    the constructor of this class to be protected or private.


    # Applying the Singleton Pattern to the Case Study


    A motivating example: instantiate tax calculation strategies only once when needed
    In Chapter 14, I encapsulated the rules about taxes within strategy objects. I
    have to derive a CalTax class for each tax calculation rule. This means that I
    need to use the same objects over and over again, just justating between their
    uses.


    For performance reasons, I might not want to keep instantiating them and throwing
    them away again and again. And, while I could instantiate all of the possible
    strategies at the start, this could


