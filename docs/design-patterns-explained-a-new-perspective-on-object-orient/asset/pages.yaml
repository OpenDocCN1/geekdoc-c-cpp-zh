  md: 'Or again, people are creatures of habit. If they pass in and out of the courtyard,
    every day, in the course of their normal lives, the courtyard becomes familiar,
    a natural place to go ... and it is used.


    Familiarity sometimes keeps us from seeing the obvious. The value of a pattern
    is that with less experience can take advantage of what others have learned before
    them:


    But a courtyard with only one way in, a place you only go when you “want” to go,
    there is an unfamiliar place, tends to stay unused— people go more often to places
    which are familiar.


    +   * both what must be included to have a good design.

    * and what must be avoided to keep from a poor design..


    Or again, there is a abruptness about suddenly stepping out, from the inside,
    directly to the outside ... it is subtle, but you.


    A solution to a possibly overlooked challenge to building a great courtyard


    If there is a transitional space—a porch or a veranda, under cover, post to the
    air—this is psychologically half way between indoors and outdoors, and makes it
    much easier, more simple, to take each of the smaller steps that brings you into
    the courtyard...


    When a courtyard has a view out to a larger space, has crossing paths from different
    rooms, and has a veranda or a porch, these forces can resolve themselves. The
    view out makes it comfortable, the crossing paths help generate a sense of habit
    there, the porch makes it easier to go out more often ... and gradually the courtyard
    becomes a pleasant customary place to be.


    Alexander is telling us how to build a great courtyard


    ...and tells us why it is great.


    To review, Alexander says that a description of a pattern involves four items:


    The four components required of every pattern description


    +   * The name of the pattern.

    * The purpose of the pattern, the problem solves.

    * How we could accomplish this.

    * The constraints and forces we have to consider in order to accomplish this.


    Alexander postulated that patterns exist which virtually every architectural problem
    will encounter. He further postulated that patterns could be used together to
    solve complex architectural problems.


    Patterns exist for almost any design problem and may be combined to solve complex
    problems


    How patterns work together will be discussed later in this book. For now, I want
    to focus on his claim that patterns are useful to solve specialized problems.'
