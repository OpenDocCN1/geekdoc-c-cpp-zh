    # # The Essential Challenges and Approaches


    The CAD/CAM system is constantly evolving, changing. My real problem was that
    to make it possible for the company to continue use its expensive expert system
    while the CAD/CAM system changed.


    Challenge: allow the expert system to work with a constantly changing CAD/CAM
    system


    In my situation, they were currently using one version of the CAD/CAM system,
    Version 1 (V1), and a new version, Version 2 (V2), was coming out shortly. Although
    one vendor made both versions, the two versions were not compatible.


    For a variety of technical and administrative reasons, it was not possible to
    translate the models from one version to the next. Thus, the expert system needed
    to be able to support both versions of the CAD/CAM system.


    In fact, the situation was even a little worse than just having to accommodate
    two different versions of the CAD/CAM system. I knew a third version was coming
    out long, but did not know when that would happen. In order to preserve the investment
    in the company''s expert system, I wanted a system architecture approximately
    the one diagrammed in Figure 3-5.'
