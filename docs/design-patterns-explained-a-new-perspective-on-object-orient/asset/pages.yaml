    # Understanding "The Complete Stream Zoo.\*


    Java is notorious for a confusing array of stream inputs and associated classes.
    It is much easier to understand these classes in the context of the Decorator
    pattern. The classes directly derived from java.io.InputStream (ByteArrayInputStream,
    FileInputStream, FilterInputStream, InputStream, ObjectInputStream, SequenceStream,
    and String-BufferInputStream) all play the role of the decorated object. All of
    the decorators derive from the FilterInputStream (either directly or indirectly).


    Keeping the Decorator pattern in mind explains why the Java language requires
    chaining these objects together when they are instantiated—this gives programmers
    the ability to pick any number of combinations from the different behaviors available.


