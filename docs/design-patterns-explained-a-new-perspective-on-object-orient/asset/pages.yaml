    - I present the intent of the Template Method pattern.

    - I describe the key features of the Template Method pattern.

    - I describe some of my experiences using the Template Method pattern in practice.


    # More Requirements for the Case Study


    In the process of writing the application, suppose I get a new New requirement:
    requirement to support both Oracle and SQL Server databases. Both access multiple
    SQL of these systems are based on SQL (Structured Query Language), the common
    standard that makes it easier to use databases. Yet, even though this is a common
    standard at the general level, there are still differences in the details. I know
    that in general, when executing these on databases, I will use the following steps:


    +   - Format the CONNECT command.

    - Send the database CONNECT command.

    - Format the SELECT command.'
