  md: '# Part III • Design Patterns


    # Concept


    # Discussion


    Objects are responsible for themselves


    I had different kinds of Shapes, but all drew themselves (via the draw method).
    The Drawing classes were responsible for drawing-elements of objects.


    Abstract class


    I used abstract classes to represent the concepts. I actually had rectangles and
    circles in the problem domain. "Shape" is something that lives strictly in our
    head, a device to bind the two concepts together; therefore, I represent it in
    the Shape class as an abstract class. Shape will never get instantiated because
    it never exists in the problem domain (only Rectangles and Circles do). The same
    thing is true with drawing programs.


    Encapsulation via an abstract class


    I have two examples of encapsulation through the use of an abstract class in this
    problem.


    +   A client dealing with the Bridge pattern will only have a derivation of Shape
    visible to it. However, the client will not know what type of Shape it has (it
    will be just a Shape to the client). Thus, I have encapsulated this information.
    The advantage of this is if a new type of Shape is needed in the future, it does
    not affect the client object.


    +   The Drawing class hides the different drawing derivations from the Shapes.
    In practice, the abstraction may know how implementation it uses because it might
    instantiate it. See page 155 of the MiGoF''s Gang of Four book for an explanation
    as to why this might be a good thing to do. However, even when that occurs, the
    knowledge-edge of implementations is limited to the abstraction''s constructor
    and is easily changed.


    One rule, one place


    The abstract class often has the methods that actually use the implementation
    objects. The derivations of the abstract class call these methods. This allows
    for easier modification if needed, and allows for a good starting point before
    implementing the entire pattern.'
