  md: '# Chapter 10 · The Abstract Factory Pattern 175


    In this pattern,


    The roles of the objects in the Abstract Factory


    +   - The client object just knows who to ask for the objects needs and how to
    use them.

    - The Abstract Factory class specifies which objects can be instantiated by defining
    a method for each of these different types of objects. Typically, an Abstract
    Factory will have a method for each type of object that must be instantiated.

    - The concrete factories specify which objects are to be instantiated.


    # Field Notes: The Abstract Factory Pattern


    How to get the right factory object


    Deciding which factory object is needed is really the same as determining which
    family of objects to use. For example, in the preceding driver problem, I had
    one family for low-resolution drivers and another family for high-resolution drivers.
    How do I know which set I want? In a case like this, it is most likely that a
    configuration file will tell me. I can then write a few lines of code that instantiate
    the proper factory object based on this configuration information.


    I can also use an Abstract Factory so I can use a subsystem for different applications.
    In this case, the factory object will be passed to the subsystem, telling the
    subsystem which objects it is to use. In this case, it is usually known by the
    main system which family of objects the subsystem will need. Before the subsystem
    is called, the correct factory object would be instantiated.'
