  md: '# 110 Part III - Design Patterns


    # Acknowledgment


    Perhaps this new perspective is not all original. I believe that this perspective
    is one that many developers of the design patterns held when they developed what
    ended up being called a pattern. Certainly, it is a perspective that is consistent
    with the writings of Christopher Alexander, Jim Coplien, and the Gang of Four.


    While it may not be original, it has also not been expressed in quite the way
    I do in this chapter and in this book. I have had to distill this way of looking
    at patterns from the way design patterns behave and how they have been described
    by others.


    When I call it a new perspective, what I mean is that it is most likely a new
    way for most developers to view object orientation. It was certainly new to me
    when I was learning design patterns for the first time.


    # Objects: the Traditional View and the New View


    The traditional view: data with methods


    The traditional view of objects is that they are data with methods. One of my
    teachers called them "smart data." It is just a step up from a database. This
    view comes from looking at objects from an implementation perspective.


    The new view: things with responsibilities


    While this definition is accurate, as explained in Chapter 1, "The Object-Oriented
    Paradigm," it is based on the implementation perspective. A more useful definition
    is one based on the conceptual perspective—an object is an entity that has responsibilities.
    These responsibilities give the object its behavior. Sometimes, I also think of
    an object as an entity that has specific behavior.


    This is a better definition because it helps to focus on what the objects are
    supposed to do, not simply on how to implement them. This enables me to build
    the software in two steps:'
  merge: -1
