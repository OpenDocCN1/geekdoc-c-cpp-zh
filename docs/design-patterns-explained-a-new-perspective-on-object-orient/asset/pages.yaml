  md: '# Summary


    In learning the Bridge pattern, I looked at a problem where there were two variations
    in the problem domain—shapes and drawing programs. In the problem domain, each
    of these varied. The challenge came in trying to implement a solution based on
    all of the special cases that existed. The initial solution, which naively used
    inheritance too much, resulted in a redundant design that had tight coupling and
    low cohesion, and was difficult to maintain.


    In this chapter


    You learned the Bridge pattern by following the basic strategies for dealing with
    variation:


    +   * Find what varies and encapsulate it.

    * Favor composition over inheritance.


    Finding what varies is always a good step in learning about the problem domain.
    In the drawing program example, I had one set of variations using another set
    of variations. This indicates that the Bridge pattern will probably be useful.


    In general, you should identify which patterns to use by matching them with the
    characteristics and behaviors in the problem domain. By understanding the which
    and whats of the patterns in your repertoire, you can be more effective in picking
    the ones that will help you. You can select patterns to use before deciding how
    the pattern''s implementation will be.


    By using the Bridge pattern, the design and implementation are more robust and
    better able to handle changes in the future.


    While I focused on the pattern during the chapter, it is worth pointing out several
    object-oriented principles that are used in the Bridge pattern.


    Summary of object-oriented principles used in the Bridge pattern'
