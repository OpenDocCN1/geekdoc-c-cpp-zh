  md: '# The Strategy Pattern: Key Features


    Intent

    Allows you to use business rules or algorithms depending upon the context in which
    they occur.


    ProblemnThe selection of an algorithm that needs to be applied depends upon the
    client making the request or the data being acted upon. If you simply have a rule
    that does not change, you do not need a Strategy pattern.


    Solution

    Separates the selection of algorithm from the implementation of the algorithm.
    Allows for the selection to be made based upon context.


    +   Participants and Collaborators

    * The strategy specifies how the different algorithms are used.

    * The concreteStrategies implement these different algorithms.

    * The Context uses the specific ConcreteStrategy with a reference of type Strategy.
    The strategy and Context interact to implement the chosen algorithm (sometimes
    the strategy must query the Context). The Context forwards requests from its Client
    to the Strategy.


    +   Consequences

    * The Strategy pattern defines a family of algorithms.

    * Switches and/or conditionals invoke all algorithms in the same way (they must
    have all the same interface). The interaction between the Context and the Context
    may require the addition of getstate type methods to the Context.


    Implementation

    Have the class that uses the algorithm (Context) contain an abstract class (the
    stragy) that has an abstract method specifying how to call the algorithm. Each
    derived class implements the algorithm as needed. Note that this method wouldn''t
    be abstract if you wanted to have some default behavior.

    Note: In the prototypical Strategy pattern, the responsibility for selecting the
    particular implementation to use is done by the Client object and given to the
    context of the Strategy pattern.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_239_0.png)'
