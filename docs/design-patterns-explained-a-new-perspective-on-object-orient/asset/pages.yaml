  md: 'starts executing until it calls the format Connect method. Since the OracleQT
    object was requested to perform doQuery, the OracleOT''s format Connect method
    is called. After this, control is returned to the Query-Template''s doQuery method.
    The code common to all queries is now executed until the next variation is needed—the
    formatSelect method. Again, this method is located in the object that Query-Control
    is referring to (OracleQT in this example).


    When a new database is encountered, the Template Method provides us with a boilerplate
    (or template) to fill out. We create a new derived class and implement the specific
    steps required for the new database in it.


    # Field Notes: Using the Template Method Pattern


    Sometimes a class will use several different Strategy patterns. When I first looked
    at the class diagram for the Template Method, I thought, "Oh, the Template Method
    is simply a collection of Strategies that work together. This is dangerous (and
    usually incorrect) thinking. While it is not uncommon for several Strategies to
    appear to be connected to each other, designing for this can lead to inflexibility.


    The Template Method is applicable when there are different, but conceptually similar
    processes. The variations for each process are coupled together because they are
    associated with a particular process. In the example I presented, when I need
    a format CONNECT command for an Oracle database, if I need a format a QUERY command,
    it''ll be for an Oracle database as well.'
