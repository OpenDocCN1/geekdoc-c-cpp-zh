  md: '# Learning the Bridge Pattern: An Example


    To learn the thinking behind the Bridge pattern and what it is- trying to do,
    I will work through an example from scratch. Starting with requirements, I will
    derive the pattern and then see how to apply it.


    Learn why it exists, then derive the pattern


    Perhaps this example will seem basic. But look at the concepts discussed in this
    case and then try to think of situations that you have encountered that are similar,
    having


    +   - Variations in abstractions of a concept, and

    - Variations in how these concepts are implemented.


    You will see that this example has many similarities to the CAD/ CAM problem discussed
    earlier. But rather giving you all the requirements up front, I am going to give
    them a little at a time, just as they were given to me. You can''t always see
    the variations at the beginning of the problem.


    **Bottom line:** During requirements definition, explore for variations early
    and often!


    Start with a simple problem: drawing shapes


    Suppose I have been given the task of writing a program that draw rectangles with
    either of two drawing programs. I have been told that when I instantiate a rectangle,
    I will know whether I should use drawing program 1 (DP1) or drawing program 2
    (DP2).


    The rectangles are defined as two pairs of points, as represented in Figure 9-1.
    The differences between the drawing programs are summarized in Table 9-1.'
