    | Chapter | Discusses Topics |

    | --- | --- |

    | 14 | The **Strategy** pattern: How to handle varying algorithms before business
    rules. |

    | 15 | The **Decorator** pattern: How to dynamically add behavior before or after
    an object''s current behavior. |

    | 16 | The **Singleton** pattern and the **Double-Checked Locking pattern**: How
    to ensure no more than one instance of a class is ever instantiated, even in a
    multithreaded environment. |

    | 17 | The **Observer** pattern: How to let one part of a system know when an
    event takes place in another. |

    | 18 | The **Template Method** pattern: What to do when you have different cases
    that essentially use the same procedure, but their steps must be implemented in
    slightly different ways. |

    | 19 | The **Factory Method pattern**: How to defer instantiation of particular
    objects to derived classes. |

    | 20 | The **Analysis Matrix**: How to track multiple variations that are present
    in your problem domain and map them into patterns. |'
