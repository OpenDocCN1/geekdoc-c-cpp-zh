  md: '# The Facade Pattern: Key Features


    Intent


    You want to simplify how to use an existing system. You need to define your own
    interface.


    Problem


    You need to use only a subset of a complex system. Or you need to interact with
    the system in a particular way.


    Solution


    The Facade presents a new interface for the client of the existing system easier
    to use.


    Participants and Collaborators


    It presents a specialized interface to the client that makes it easier to use.


    Consequences


    The Facade simplifies the use of the required subsystem. However, since the Facade
    is not complete, certain functionality may be unavailable to the client.


    Implementation


    +   - Define a new class (or classes) that has the required interface.

    - Have this new class use the existing system.


    GoF Reference


    Pages 185-193.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_98_0.png)


    Figure 6-3 Standard, simplified view of the Facade pattern.'
