  md: '# The Template Method Pattern: Key Features


    Intent

    Define the skeleton of an algorithm in an operation, deferring steps to subclasses.
    Redefine the steps in an algorithm without changing the algorithm''s structure.


    Problem

    There is a procedure or set of steps to follow that is consistent at one level
    of detail, but individual steps may have different implementations at a lower
    level of detail.


    Solution

    Allows for definition of substeps while maintaining a consistent base process.


    Participants and Collaborators

    The Template Method consists of an abstract class that defines the basic TemplateMethod
    (see figure below) classes that need to be overridden. Each concrete class derived
    from the abstract class implements a new method for the Template.


    Consequences

    Templates provide a good platform for code reuse. They are also helpful in ensuring
    the required steps are implemented. They bind the overridden steps for each Concrete
    class, and so should only be used when these variations allow and only together.


    Implementation

    Create an abstract class that implements a procedure using abstract methods. These
    abstract methods must be implemented in subclasses to perform each step of the
    procedure. If the steps vary independently, each step may be implemented with
    a Strategy pattern.


    GoF Reference

    Pages 325-330.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_283_0.png)'
  merge: -1
