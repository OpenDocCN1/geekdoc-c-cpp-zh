  md: '# Design Pattern Matrix


    | Pattern | Notes on the patterns |

    | --- | --- |

    | Chain of responsibility | **Indicators in analysis**: We have the several actions
    that may be done by different things.<br>**Indicators in design**: We have several
    potential candidates to do a function. We don''t want the client objects to actually
    do it.<br>**Field notes**: This pattern can be used to chain potential candidates
    to perform an action together. A variation of Chain of Responsibility is to not
    stop when one object performs its function but to allow each object to do its
    action. |

    | Iterator | **Indicators in analysis and design**: We have a collection of things
    but aren''t clear the right type of collection to use is. You want to hide the
    being of a collection. Alternatively, you need to have variations in the way a
    collection is traversed.<br>**Indicator is not used when it should be**: Changing
    the structure of a collection (say from a vector to a collection) will affect
    the way the collection is iterated.<br>**Variations encapsulated**: Type of collection
    used.<br>**Field notes**: The Iterator pattern enables us to decide on which type
    of collection structure to use. |

    | Mediator | **Indicators in analysis and design**: Many objects need to communicate
    with many objects yet this communication cannot be handled with the observer pattern.<br>**Indicator
    is not used when it should be**: The system is tightly coupled due to inter-object
    requirements.<br>**Field notes**: When several objects are highly coupled in the
    way they interact, this set of rules can be encapsulated in one place. |

    | Memento | **Indicators in analysis and design**: The state of an object needs
    to be remembered so we can go back to it (e.g., an action).<br>**Indicator is
    not used when it should be**: The internal state of an is exposed to another object.
    Or, copies of an object being made to remember the object''s state, this object
    contains much information that is not dependent. This means the object is larger
    than it needs to be or contains an open connection that doesn''t need to be remembered.<br>**Field
    notes**: This pattern is useful when making copies of objects whose state is being
    remembered would be inefficient. |

    | Observer | **Indicators in analysis and design**: Different things (objects)
    that need to know when an event occurs. This list of objects may vary from time
    to time or case to case.<br>**Indicator is not used when it should be**: When
    a new object needs to be notified of an event occurring the programmer has to
    change the object that detects the event.<br>**Variation encapsulated**: The list
    of objects to know about an event occurring.<br>**Field notes**: This pattern
    is used extensively in the JFC for event handling and is supported with the Observer
    class and Observer interface. |

    | Proxy access-accessibility | **Indicators in analysis and design**: Are there
    any of the things we work with (i.e., on other machines)? An existing object needs
    to use an object on another machine and doesn''t want to worry about making the
    connection (or even know the remote connection).<br>**Indicator is not used when
    it should be**: The use of an object and the set-up of the connection to the object
    are found together more than one place.<br>**Field notes**: The Proxy is a useful
    pattern to use when it is possible a remote connection will be needed in the future.
    In this case, the Proxy object need be changed - not the object actually being
    used. |'
