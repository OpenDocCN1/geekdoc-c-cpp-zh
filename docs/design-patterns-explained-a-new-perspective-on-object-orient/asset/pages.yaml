    Figure 18-1 Using the Template Method pattern to perform a query.


    I have created a method called do that handles the query I need to perform. I
    pass in the name of the database and the query specification. The doQuery method
    follows the five general steps above, providing virtual methods for the steps
    (such as format-Connect and formatSelect) that must be implemented differently.


    How this works: virtual methods for the steps that vary


    The doQuery method is implemented as follows. As shown in Figure 18-1, it first
    needs to format the CONNECT command required to connect to the database. Although
    the abstract class (QueryTemplate) knows this format needs to take place, it doesn''t
    know how to do this. The exact formatting code is supplied by the derived classes.
    This is true for formatting the SELECT command as well.


    The Template Method manages to do this because the method call is made via a reference
    pointing to one of the derived classes. That is, although Query-Control has a
    reference of type Query-Template, it is actually referring to an OracleQT or an
    SQLServerQT object. Thus, when the doQuery method is called on either of these
    objects, the methods resolved will first look for methods of the appropriate derived
    class. Let''s say our QueryControl is referring to an OracleQT object. Since OracleQT
    does not override Query-Template, the QueryTemplate''s doQuery method is invoked.
    This'
