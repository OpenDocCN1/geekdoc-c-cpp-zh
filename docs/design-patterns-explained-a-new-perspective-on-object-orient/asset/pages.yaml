  md: 'this book is not a about writing design patterns, I will not offer an opinion
    on the best structure for describing patterns; however, the following items need
    to be included in any description.


    | Item | Description |

    | Name | All patterns have a unique name we use to identify them with. |

    | Intent | The purpose of this pattern. |

    | Problem | The problem that the pattern is trying to solve. |

    | Content | The context in which this pattern shows up. |

    | Solution | How the pattern provides a solution to this problem in the context
    in which it shows up. |

    | Consequences/Forces | The consequences of using this pattern. Investigates the
    forces at play in the pattern. |

    | Implementation | How this pattern can be implemented. Note: Implementations
    are just concrete manifestations of the pattern and should not be construed as
    the pattern itself.


    **Consequences / Forces.** The term “consequences” is used in design patterns
    and is often misunderstood. In everyday usage, “consequences” usually carries
    a negative connotation.(you never hear someone say “I won the lottery! As a consequence,
    I do not have to go to work.”) Within the design community, on the other hand,
    “consequences” simply means “cause and effect.” That is, if you implement this
    pattern in such-and-a way, this is how it affects the forces present.


    # # Why Study Design Patterns


    **Design patterns help with reuse and communication** Now that you have an idea
    about what design patterns are, you may still be wondering “why study them?” There
    are several reasons that are obvious and some that are not so obvious.


    The most commonly stated reasons for studying designs are to:


    +   - **Reuse solutions.** By reusing already established designs, we get a head
    on our problems and avoid *gotchas*. I get the benefit of learning from the experience
    of others. I do not have to reinvent solutions for commonly recurring problems.

    - **Establish common terminology.** Communication and teamwork require a common
    base of vocabulary and a common viewpoint of the problem. Design patterns provide
    a common point of reference during the analysis and design phase of project.


    **Design patterns give a higher perspective on analysis and objects** Now, there
    is a third reason to study design patterns:


    Give you a higher level perspective on the problem and on the process of design
    and object-orientation. To free you from the tyranny of dealing with'
