    # Interaction Diagrams


    Sequence Diagram

    Class Diagrams show static relationships between classes. In other words, they
    do not show us any activity. Although very useful, sometimes I need to show how
    the objects instantiated from these classes actually work together.


    The UML diagrams show how objects interact with each other are called Interaction
    Diagrams. The most common type of Interaction Diagram is the Sequence Diagram,
    such as shown in Figure 2-8.


    How to read the Sequence Diagram

    Sequence Diagrams are read from top to bottom.


    +   - Each rectangle at the top represents a particular object. Although many
    of the rectangles have class names in them, notice there is a colon in front of
    the class name. Some of the rectangles have other names—for example, shapel: Square.


    +   - The boxes at the top give the class name (to the right of the colon) and
    optionally, a name of the object (before the colon).


    +   - The vertical lines represent the lifespan of the objects. Unfortunately,
    most UML drawing programs don''t support this and draw the lines from the top
    to the bottom, leaving it unclear when an object actually comes into existence.


    +   - I show objects sending messages to each other with horizontal lines between
    these vertical lines.


    +   - Sometimes returned values and/or objects are explicitly shown and sometimes
    it is just understood that they are returned.'
