  md: '# Learning the Bridge Pattern: Deriving It


    Deriving a solution


    Now that you have been through the problem, we are in a position to derive the
    Bridge pattern together. Doing the work to derive the pattern will help you to
    understand more deeply what this complex and powerful pattern does.


    Let''s apply some of the basic strategies for good object-oriented design and
    see how they help to develop a solution that is very much like the Bridge pattern.
    To do this, I will be using the work of Jim Coplien^4 on commonality and variability
    analysis.


    | Design patterns are solutions that occur again and again. |

    | Design patterns are solutions that have recurred in several problems and have
    therefore proven themselves over time to be good solutions. The approach I am
    taking in this book is to derive the pattern in order to teach it so that you
    can understand its characteristics. |

    | In this case, I know the pattern I want to derive—the Bridge pattern—because
    I was shown it by the Gang of Four and have seen how it works in my own problem
    domains. It is important to note that patterns are not really derived. By definition,
    they must be recurring—having been demonstrated in at least three independent
    cases—to be considered patterns. What I mean by “derive” is that we will go through
    a design process where we create the pattern as if you did not know it. This is
    to illustrate some key principles and useful strategies.|


    First, use commonality/variability analysis Coplien''s work on commonality/variability
    analysis tells us how to find variations in the problem domain and identify what
    is common across the domain. Identify where things vary (commonality analysis)
    and then identify how they vary (variability analysis).


    +   4. Coplien, J., *Multi-Paradigm Design for C++*. Reading, Mass.: Addison-Wesley,
    1998.'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'According to Coplien, “Commonality analysis is the search for common elements
    that helps us understand how family members are the same.”⁵ Thus, the process
    of finding out how things are common defines the family in which these elements
    belong (and hence, where things vary).


    Variability analysis reveals how family members vary. Variability only makes sense
    within a given commonality.


    Commonality analysis seeks structure that is unlikely to change over time, while
    variability analysis captures structure that is likely to change. Variability
    analysis makes sense only in terms of the context defined by the associated commonality
    analysis . . From an architectural perspective, commonality analysis gives the
    architecture its longevity; variability analysis drives its fitness for use.⁶


    In other words, if variations are the specific cases in the domain, commonality
    defines the concepts in the domain that tie them together. The common concepts
    will be represented by abstract classes. The variations found by variability analysis
    will be implemented by the concrete classes (that is, classes derived from the
    abstract class with specific implementations).


    It is almost axiomatic with object-oriented design methods that the designer is
    supposed to look in the problem domain, identify the nouns present, and create
    objects representing them. Then, the designer finds the verbs relating to those
    nouns (that is, their actions) and implement them by adding methods to the objects.
    This process of focusing on nouns and verbs typically leads to larger class hierarchies
    than we might want. I suggest that using commonality/variability analysis as a
    primary tool in creating objects is a better approach than looking at just nouns
    and verbs (actually, I believe this is a restatement of Jim Coplien’s work).


    +   5. ibid, p. 63.

    6. ibid, pp. 60, 64.'
