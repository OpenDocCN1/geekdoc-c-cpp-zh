  md: '# Chapter 13 · The Principles and Strategies of Design Patterns 221


    With all of these choices, how do you decide which one to use to implement the
    Abstract Factory? Decide from the context in which it appears. Each of the four
    cases just shown has advantages over the others, depending on factors such as


    How to decide?

    From the context


    +   * The likelihood of future variation

    * The importance of not modifying our current system

    * Who controls the sets to be created (us or another development group)

    * The language in use

    * The availability of a database or configuration file


    This list is not complete, nor even is the list of implementation possibilities.
    What should be evident to you, however, is that trying to decide how to implement
    an Abstract Factory without understanding how it will be used (that is, without
    understanding its context) is a fool’s errand.


    # How to make design decisions.


    When trying to decide between alternative implementations, many developers ask
    the question, “Which of these implementations is better?” This is not the question
    to ask. The problem is that often one implementation is not inherently better
    than another. A better question is to ask, for each alternative, “Under what circumstances
    would this alternative be better than the other alternative?” “Which of these
    circumstances is most like my problem domain?” It is a small matter of stopping
    and stepping back. Using this approach tends to keep me more aware of the variation
    and scalability issues in my problem domain.'
