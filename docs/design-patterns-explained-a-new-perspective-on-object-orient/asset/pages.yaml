    # Other Advantages to Studying Design Patterns


    Improve team communications and individual learning


    My experience with development groups working with design patterns is that design
    patterns helped individual learning and team development. This occurred because
    the more junior team members saw that the senior developers who know design patterns
    had something of value and they wanted it. This provided motivation for them to
    learn some of these powerful concepts.


    Improved modifiability of code


    Design patterns also provide for built in modifiability of software. The reason
    for this is that they are tested solutions. They therefore have evolved into structures
    that can change more readily than what often first comes to as a solution.


    Design patterns illustrate basic object-oriented principles


    Design patterns, when they are taught properly, can be used to greatly increase
    the understanding of basic object-oriented design principles. I have seen this
    countless times in the introductory object-oriented courses I teach where we start
    design patterns on the first day. By the end of the third day, although we’ve
    been mostly talking about, the concepts of encapsulation, polymorphism and inheritance
    – which were introduced to many of the participants – feel like they are old friends.


    Adoption of improved strategies – even when patterns aren''t present


    In Design Patterns: Elements of Reusable Object-Oriented Software, the Gang of
    Four suggest few strategies for creating good object-oriented designs. In particular,
    they suggest the following:


    +   * find what and encapsulate it

    * favor composition over inheritance'
