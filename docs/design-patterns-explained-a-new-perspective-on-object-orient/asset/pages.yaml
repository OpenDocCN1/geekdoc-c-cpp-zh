- img_proc: true
  md: '# Field Notes: The Adapter Pattern


    Often, I will be in a situation similar to the one above, but the object being
    adapted does not do all the things I need.


    In this case, I can still use the Adapter pattern, but it is not such a perfect
    fit. In this case,


    +   - Those functions that are implemented in the existing class can be adapted.

    - Those functions that are not present can be implemented in the wrapping object.


    This does not give me the same benefit, but at least I do not have to implement
    all of the required functionality.


    The Adapter pattern frees me from worrying about the interfaces of existing classes
    from existing interfaces when I am doing a design. If I have a class that does
    what I need, least conceptually, then I know that I can use the Adapter pattern
    to give it the correct interface.


    This will become more important as you learn a few patterns. Many patterns require
    certain classes to derive from the same class. If there are preexisting classes,
    the Adapter pattern can be used to adapt it to the appropriate abstract class
    (as Circle adapted XXCircle to Shape).


    There are actually two types of Adapter patterns:


    +   - Object Adapter—The pattern I have been using is called an Object Adapter
    because it relies on one object (the adapting object) containing another (the
    adapted object).

    - Class Adapter pattern—Another way to implement the Adapter pattern is with multiple
    inheritance. In this case, it is called a Class Adapter pattern.'
