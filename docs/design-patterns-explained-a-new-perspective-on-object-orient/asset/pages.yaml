    What I am trying to do—handle multiple CAD/CAM versions transparent—gives me several
    clues that this solution is not a good one:


    but contains many challenges


    > Redundancy amongst methods—I can easily imagine that the methods that are making
    calls to the V1 system will have many similarities between them. For example,
    the Vgetx for Slot and Vgetx for Hole will be very similar.


    > Messy—This is not always a good predictor, but it is another factor that reinforces
    my discomfort with the solution.


    > Tight coupling—This solution has tight coupling because the features are related
    to each other indirectly. These relationships manifest themselves as the likely
    need to modify all of the features if the following occurs:


    +   - A new CAD/CAM system is required.

    - An existing CAD/CAM system is modified.


