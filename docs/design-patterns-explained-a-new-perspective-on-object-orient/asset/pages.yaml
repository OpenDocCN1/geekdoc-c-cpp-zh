  md: '# CHAPTER 4

    A Standard Object-Oriented Solution


    # Overview


    This chapter gives an initial solution to the problem discussed in Chapter 3,
    "A Problem That Cries Out for Flexible Code." It is a reasonable first attempt
    at a solution and gets the job done quickly. However, it misses an important system
    requirement: flexibility as the CAD/CAM system continues to evolve.


    In this chapter, I describe a solution based on object orientation. It is not
    a great solution, but it is a solution that would work.


    > > *Note: I will only show Java code examples in the main body of this chapter.
    The equivalent C++ code examples can be found at the end of this chapter.


    # Solving with Special Cases


    Given the two different CAD/CAM systems described in Chapter 3, "A Problem That
    Cries Out for Flexible Code," how do I build an information-extraction system
    that will look the same to a client object regardless of which CAD/CAM system
    I have?


    In thinking how to solve this problem, I reasoned that if I can solve for slots,
    I use that solution for cutouts, holes, etc. In thinking about slots, I saw that
    I could easily specialize each case. That is, I''d have a Slot class and a derivation
    for Slots when I had the V1 system and another derivation when I had a V2 system.
    I show this in Figure 4-1.'
