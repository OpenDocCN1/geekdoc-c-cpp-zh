  md: '# Preface xxv


    Show breadth and give a taste


    We are trying give you a taste for design patterns, to expose you to the breadth
    of the pattern world but not go into depth in any of them (see the previous point).


    Our thought was this: If you brought someone to the USA for a two week visit,
    what would you show them? Maybe a few sites to help them get familiar with architectures,
    communities, the feel of cities and the vast spaces that separate them, freeways,
    and coffee shops. But you would not be able to show them everything. To fill in
    their knowledge, you might choose to show them slide shows of many other sites
    and cities to give a taste of the country. Then, they could make plans for future
    visits. We are showing you the major sites in design patterns and then giving
    you tastes of other areas so that you can plan your own journey into patterns.


