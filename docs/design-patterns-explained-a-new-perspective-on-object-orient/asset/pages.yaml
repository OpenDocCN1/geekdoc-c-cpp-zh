    Once you have identified the families and the members for each family, you must
    decide how you are going to implement each case (that is, each family). In my
    example, I did this by defining an abstract class that specified which member
    types could be instantiated. For each family, I then derived a class from this
    abstract class that would instantiate these family members.


    Sometimes you will have families of objects but do not want to control their instantiation
    with a different derived class for each family. Perhaps you want something more
    dynamic.


    A variation of the Abstract Factory pattern: configuration files


    Examples might be


    +   * You want to have a configuration file that specifies which objects to use.
    You can use a switch based on the information in the configuration file that instantiates
    the correct object.

    * Each family can have a record in a database that contains information about
    which objects it is to use. Each column (field) in the database indicates which
    specific class type to use for each make method in the Abstract Factory.


    If you are working in Java, you can take the configuration file one step further.
    Have the information in the field names represents the class name to use. It does
    not need to be the full class name as long as you have a set convention. For example,
    you could have a prefix or suffix to add to the name in the file. Using Java’s
    Class class you can instantiate the correct object based on these names.²


