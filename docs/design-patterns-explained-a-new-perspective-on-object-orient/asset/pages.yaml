  md: '# Chapter 16 • The Singleton Pattern and the Double-Checked Locking Pattern
    259


    A problem with the Singleton pattern may arise in multithreaded applications.


    In a multithreaded mode, Singleton does not work properly


    Suppose two calls to getInstance () are made at exactly the same time. This can
    be very bad. Consider what can happen in this case:


    +   * The first thread checks to see if the instance exists. It does not, so it
    goes into the part of the code that will create the first instance.


    +   * However, before it does, suppose a second thread also looks to see if the
    instance member is NULL. Since the first thread hasn''t created anything yet,
    the instance is still equal to NULL, so the second thread also goes into the code
    that will create an object.


    +   * Both threads now perform a new on the Singleton object, thereby creating
    two objects.


    Is this a problem? It may or not be.


    None, small, bad, or worse


    +   * If the Singleton is absolutely stateless, this may not be a problem.


    +   * In Java, the problem will simply be that we are taking up an extra bit of
    memory.


    +   * In C++, the program may create a memory leak, since it will only delete
    one of the objects when I have created two of them.


    +   * If the Singleton object has some state, subtle errors can creep in. For
    example,


    +   - If the object creates a connection, there will actually be two connections
    (one for each object).\n* If a counter is used, there will be two counters.


    It may be very difficult to find these problems. First of all, the dual creation
    is very intermittent—it usually won''t happen. Second, it may not be obvious why
    the counts are off, as only one client object'
