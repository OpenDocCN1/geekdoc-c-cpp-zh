  md: '# Why Study Design Patterns?


    Design patterns help with reuse and communication Now that you have an idea about
    what design patterns are, you may still be wondering, "Why study them?" There
    are several reasons that are obvious and some that are not obvious.


    The most commonly stated reasons for studying patterns are because patterns allow
    us to:


    +   * Reuse solutions—By reusing already established designs, I get a head start
    on my problems and avoid gotchas. I get the benefit of learning from the experience
    of others. I do not have to reinvent solutions for commonly recurring problems.

    * Establish common terminology—Communication and teamwork require a common base
    of vocabulary and a common viewpoint of the problem. Design patterns provide a
    common point of reference during the analysis and design phase of a project.


    Design patterns give a higher perspective on analysis and design However, there
    is a third reason to study design patterns:


    > Patterns give you a higher-level perspective on the problem and on the process
    of design and object orientation. This frees you from the tyranny of dealing with
    the details early.


    By the end of this book, I hope you will agree that this is one of the greatest
    reasons to study design patterns. It will shift your mindset and make you a more
    powerful analyst.


    To illustrate this advantage, I want to relate a conversation between two carpenters
    about how to build the drawers for some cabinets.7


    7. This section is inspired by a talk given by Ralph Johnson and is adapted by
    the authors.'
