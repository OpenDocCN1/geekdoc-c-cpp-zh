  md: '# Chapter 5 • An Introduction to Design Patterns 75


    Let''s review some Alexander''s work to illustrate this. In Table 5-1 I will present
    an excerpt from his The Timeless Way of Building.^4 an excellent book that presents
    the philosophy of patterns succinctly.


    Table 5-1 Excerpt from The Timeless Way of Building


    | Alexander Says ... | My Comments ... |

    | In the same way, a courtyard, which is properly formed, helps people to come
    in it. | A pattern always has a name and has a purpose. Here, the pattern''s name
    is Courtyard and its purpose is to help people to come in it. |

    | Consider the forces at work in a courtyard. Most fundamental of all, people
    see some kind of private outdoor space, where they can sit under the sky, see
    the stars, enjoy the sun, perhaps plant flowers. This is obvious. | Although it
    might be obvious sometimes, it is important to explicitly state the problem solved,
    which is the reason for having the pattern in the first place. This is what Alexander
    does for Courtyard. |

    | But there are more subtle forces too. For instance, a courtyard is too enclosed,
    has no view out, people feel uncomfortable, and tend to stay away ... they need
    to see into some larger and more distant space. | He points out a difficulty with
    the simplified solution and gives us a way to solve the problem that has just
    pointed out. |

    | Or again, people are creatures of habit. If they pass in and out of the courtyard,
    every day, in the course of their normal lives, the courtyard becomes familiar,
    a natural place to go ... and it is used. | Familiarity sometimes keeps us from
    seeing the obvious. The value of a pattern is that those less experience can take
    advantage of what others have learned before them: both what must be included
    to have a good design, and what must be avoided to keep from a poor design. |

