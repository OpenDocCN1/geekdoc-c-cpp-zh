- img_proc: true
  md: '# 74 Part III • Design Patterns


    Alexander understood this. He knew that structures couldn''t be separated from
    the problem they are trying to solve. Therefore, in his quest to identify and
    describe the consistency of quality in design, Alexander realized he had to look
    at different structures that were designed to solve the same problem. Figure 5-1
    illustrates two solutions to the problem of demarking entryway.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_82_0.png)


    This led to the concept of a pattern


    Alexander discovered that by narrowing his focus in this way—by looking at structures
    that solve similar problems—he could discern similarities between designs that
    were high quality. He called these similarities, patterns.


    He defined a pattern as “a solution to a problem in a context.”


    Each pattern describes a problem which occurs over and over again in our environment
    and describes the core of the solution to that problem, in such a way that you
    can use this solution million times over, without ever doing it the same way twice.³


    > 3. Alexander, C., Ishikawa, S., Silverstein, M., A Pattern Language, New York:
    Oxford University Press, 1977, p. x.'
