  md: 'This sounds like so code reviews you have heard? The one where the programmer
    describes the code in terms such as, details, details


    And then, I use a WHILE LOOP here to do . . . followed by a series of IF statements
    to do . . .and here I use a SWITCH to handle . .


    You have a description of the details of the code, but you have no idea what the
