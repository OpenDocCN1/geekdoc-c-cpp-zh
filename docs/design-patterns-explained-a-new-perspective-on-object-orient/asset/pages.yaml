  md: '# Design Pattern Matrix


    # BEHAVIORAL PATTERNS


    # How it implemented


    # Class Diagram


    # Pattern


    Set up an abstract class that represents both the original class and the new functions
    to be added. Each contain a handle to an object of this type (in reality, of a
    derived type). In our decorators, perform the additional function and then the
    contained object''s *operation* method. Optionally, call the contained object''s
    *operation* method first, then do your own special function.


    # Decorator


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_339_0.png)


    The Client refers to the proxy object instead of object from the original class.
    The proxy object creates the RealSubject when it is created. Requests to the Proxy,
    does its initial function (possibly), passes the RealSubject and then does (possibly)
    some post processing.


    # Proxy-adding function


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_339_1.png)


    Define an abstract class that represents the state of an application. Derive a
    class for each possible state. Each of these classes can now operate independently
    of each other. State transitions can be handled either in the contextual or or
    the states themselves. Information that persists across states should be stored
    in the context. States will likely need to access to this (through routines, of
    context).


    # State


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_339_2.png)


    Have the class that uses the algorithm can contain an abstract method specifying
    how to call the algorithm. Each derived class implements the algorithm as needed.


    # Strategy


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_339_3.png)


    Create an abstract class that implements a procedure using abstract methods. These
    methods must be implemented in derived classes to actually perform each step of
    the procedure. If the steps vary independently, each step may be implemented with
    a strategy pattern.


    # Template


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_339_4.png)


    Make an abstract class that represents the tasks to be performed. Add a method
    to this for each class you started with (your original entities). Add a method
    to the class you are working on to call the appropriate method in this task class,
    giving a reference to this method.


    # Visitor


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_339_5.png)'
