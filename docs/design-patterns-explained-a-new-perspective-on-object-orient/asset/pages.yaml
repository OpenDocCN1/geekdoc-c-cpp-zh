  md: '# A note about customers.


    My experience with customers has taught me several things:


    +   - They usually know their problem domain very well (most know it better than
    I ever will).

    - In general, they do not express things on the conceptual level, as developers
    often do. Instead, they talk in specific cases.

    - They often use the term *always* when they mean *usually*.

    - They often use the term *never* when they mean *seldom*.

    - They say they have told me about all of the cases when in fact they have only
    told me what usually happens.


    The bottom line is that I trust customers to tell me what happens when I ask specific
    questions but I do not trust their generalized answers. I try to interact with
    them at a very concrete level. Even those customers who sound like they think
    in a conceptual way often do not, but are trying to "help me out."


