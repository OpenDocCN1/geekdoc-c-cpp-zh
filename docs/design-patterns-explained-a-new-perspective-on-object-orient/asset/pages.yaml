  md: '# Chapter 14 \cdot The Strategy Pattern 231


    But this is not necessarily the case. Indeed, the opposite is often true: When
    you step back to consider how your system may change over time, a better design
    usually becomes apparent to you—in vir- the same amount of time that would be
    required to do a "standard" get-it-done-now design.


    The approach I use in this case studies Designing for change systems may change.
    However, it is important to note that I will be anticipating that changes will
    occur and look to see where they will occur. I will not be trying to anticipate
    the exact nature of the change. This approach is based on the principles described
    in the Gang of Four book:


    +   * Program to an interface, not an implementation.

    1


    +   * Favor object composition over class inheritance.

    2


    +   * Consider what would be variable in your design. This approach is the opposite
    of focusing on the case of redesign. Instead of considering what might force a
    change to a design, consider what you want to be able to change without redesign.
    The focus here is on encapsulating the concept that varies, a theme of many design
    patterns.

    3


    What I suggest is that when faced with modifying code to handle a new requirement,
    you should at least consider these strategies. If following these strategies will
    not cost significantly more to design and implement, use them. You can expect
    a long-term benefit from doing so, with only a modest short-term cost (if any).


    +   1. Gamma, E., Helm, R., Johnson, R., Vlissides, J., Design Patterns: Elements
