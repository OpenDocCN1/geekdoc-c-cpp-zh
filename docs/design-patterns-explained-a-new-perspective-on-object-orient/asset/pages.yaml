  md: '# # Preface


    Design patterns and object-oriented programming. They hold such promise to make
    your life as a software designer and developer easier. Their terminology is bandied
    about every day in the technical and even the popular press. But it can be hard
    to learn them, to become proficient with them, to understand what is really going
    on.


    Perhaps you have been using an object-oriented or object-based language for years.
    Have you learned that the true power of objects is not inheritance but it is in
    “encapsulating behaviors”? Perhaps you are curious about design patterns and found
    the literature a bit too esoteric and high-falutin. If so, this book is for you.


    It is based on years of teaching this material to software developers, both experienced
    and new to object orientation. It is based upon the belief—and our experience—that
    once you understand the basic principles and motions that underlie these concepts,
    why they are doing what they do, your learning curve will be incredibly shorter.
    And in our discussion of design patterns, you will understand the true mindset
    of object orientation, which is a necessity before you can become proficient.


    As you read this book, you will gain a solid understanding of the ten essential
    design patterns. You will learn that design patterns do not exist on their own,
    but are supposed to work in concert with other design patterns to help you create
    more robust applications. You will gain enough of a foundation that you will be
    able to read the design pattern literature, if you want to, and possibly discover
    patterns on your own.


    Most importantly, you will be better equipped to create flexible and complete
    software that is easier to maintain.'
  merge: -1
  pgno: 1
