  md: '# A slight digression.


    The guiding principles and strategies seem very clear to me now. Certainly, they
    are stated in the “Gang of Four’s” design patterns book. But it took me a long
    time to understand them because of limitations in my own understanding of the
    object-oriented paradigm. It was only after integrating in my own mind the work
    of the Gang of Four with Alexander''s work, Jim Coplien''s work with commonality
    and variability analysis, and Martin Fowler''s work in methodologies and analysis
    patterns that these principles became clear enough to me to that I was able to
    talk about them to others. It helped me that I was making my livelihood explaining
    things to others so I couldn''t get away with making assumptions as easily as
    I could when I was just doing things for myself.


    My abilities to explain these few, powerful, principles and strategies improved.
    As they did, I found that it became more useful to explain an increasing number
    of the Gang of Four patterns. In fact, I use these principles and strategies to
    explain 12 of the 14 patterns I discuss in my design patterns course.


    I found that I was using these principles in my own designs both with and without
    patterns. This didn''t surprise me. If I using these strategies resulted in a
    design equivalent to a design pattern when I knew the pattern was present, that
    meant they were giving me a way to derive excellent designs (since patterns are
    excellent designs by definition). Why would I get any poorer designs from these
    techniques just because I didn''t know the name of the pattern that might or might
    not be present anyway?


    These insights helped hone my training process (and now my writing process). I
    had already been teaching my courses on several levels. I was teaching the fundamentals
    of object-oriented analysis and design. I did that by teaching design patterns
    and using them to'
