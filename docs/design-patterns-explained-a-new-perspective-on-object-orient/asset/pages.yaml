  md: '# Design Pattern Matrix


    # STRUCTURAL PATTERNS


    # How it is implemented


    # Pattern


    Contain the existing class in another class. Having the containing class match
    the required interface and call the contained class''s methods


    # Class Diagram


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_337_0.png)


    # Adapter


    Encapsulate the implementations in an abstract class and contain a handle to it
    the base class of the abstraction being implemented. In Java can use interfaces
    instead of an abstract class for the implementation.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_337_1.png)


    # Bridge


    Set up an abstract class that represents all elements in the hierarchy. Define
    at least one derived class that represents the individual components. Also, define
    at least one other class that represents the composite elements (i.e., those elements
    that contain multiple components). In the abstract class, define abstract methods
    that the client objects will use. Finally, implement these for each of the derived
    classes.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_337_2.png)


    # Composite


    Define a new class (or classes) that has the required interface. Have this new
    class use the existing system.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_337_3.png)


    # Faade


    The client refers to the proxy object instead of an object from the original class.
    The proxy object remembers the information required to instantiate the original
    class but defers its instantiation. When the object from the original class is
    actually needed, the proxy object instantiates it and then makes the necessary
    request to it.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_337_4.png)


    # Proxy -

    virtual'
