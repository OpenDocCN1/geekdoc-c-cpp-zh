    # Encapsulation: the Traditional View and the New View


    My object-oriented umbrella


    In classes on pattern-oriented design, I often ask my students, "Who has heard
    encapsulation defined as ‘data hiding’?" Almost everyone raises his or her hand.


    Then I proceed to tell a story about my umbrella. Keep in mind that I live in
    Seattle, which has a reputation for being better than it is, but is still a pretty
    wet place in the fall, winter, and spring. Here, umbrellas and hooded coats are
    personal friends!


    Let me tell you about my great umbrella. It is large enough to get into! In fact,
    three or four other people can get in with me. While we are in it, staying out
    of the rain, I can move it from one place to another. It has a stereo system to
    keep me entertained while I stay dry. Amazingly enough, it can also condition
    the air to make it warmer or colder. It is one cool umbrella.


    My umbrella is convenient. It sits there waiting for me. It has wheels on it so
    that I do not have to carry it around. I don''t even have to push it because it
    can propel itself. Sometimes, I will open the top of my umbrella to let in the
    sun. (Why I am using my umbrella when it is sunny outside is beyond me!)'
