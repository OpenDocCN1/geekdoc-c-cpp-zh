  md: '# CHAPTER 20


    # The Analysis Matrix


    # Overview


    This chapter concludes the e-tailing case study discussed thus far In this chapter
    Chapters 14-19.


    Now that I have discussed an entire set of individual patterns, it is time to
    step back to look at one of the biggest problems in software development: handling
    variation within the problem domain Design patterns can help analysts identify
    and organize variations successfully.


    In this chapter,


    +   * I consider the problem of variation in the real world.

    * I look at a portion of the e-tailing case study that represents significant
    problems of variation. In the process of solving this problem, I develop the Analysis
    Matrix, a simple variant on decision tables that I have found helpful to understand
    and coordinate variation in concepts. There is a parallel between this and the
    concepts of Christopher Alexander and Jim Coplien.

    * I describe my use of the Analysis Matrix in the real world.


    # In the Real World: Variations


    In the real world, problems are not tidy or well behaved. Except in the most trivial
    problems, there always seem to be exceptions and variations that are not well
    organized. They are the "gotchas" that rise up to wreck our finely crafted models.'
  merge: -1
  pgno: 290
- img_proc: true
  md: 'For example, patients coming to a hospital typically go to the admitting office
    first. But when there is a life-threatening situation, the patient goes directly
    to the emergency room before having to go to admitting. These are the variations
    in the real world, the different special cases that our system has to deal with.


    And this is what creates headaches for us analysts. Can patterns help us deal
    variation more efficiently?


    I have used an approach to make explicit the variations in the system and then
    use the analysis to identify the patterns I ought to use in my design. The steps
    in my approach are as follows:


    +   1. The most important features in one case and organize them in a matrix.
    Label each feature with the concept that the feature represents.


    +   2. Proceed through the other cases, expanding the matrix as necessary. Handle
    each case independently of the others.


    +   3. Expand the Analysis Matrix with new concepts.


    +   4. Use the rows to identify rules.


    +   5. Use the columns to identify specific cases.


    +   6. Identify design patterns from this analysis.


    +   7. Develop a high-level design.


    # Case Study in Variation: An International E-Tail System


    E-tail: A case study in variation


    Suppose an e-tail system must process sales orders in several different nations.
    Initially I have to handle just the United States and Canada. I look at my requirements
    and see several things that vary. I note these in Table 20-1.'
