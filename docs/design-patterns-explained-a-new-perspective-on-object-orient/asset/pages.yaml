  md: '# Part II · The Limitations of Traditional Object-Oriented Design


    However, my greatest concern comes from looking into the future. Imagine what
    will happen when the third version of the CAD/CAM system arrives. The combinatorial
    explosion will kill us! Look at the third row of the class diagram in Figure 4-3.


    +   - There are five types of features.

    - Each type of feature has a pair of classes, for each CAD/CAM system.

    - When I get the third version, I will have groups of three, not groups of two.

    - Instead of ten classes, I will have fifteen.


    This is certainly not a system I will have fun maintaining!


    # A pitfall of analysis: too much attention to details too early.


    One common problem that analysts can have is that we dive into the details too
    early in the development process. It is natural because it is easy to work with
    these details. Solutions for the details are usually apparent, but are not necessarily
    the best thing to start with. Delay as long as you can before you commit to the
    details.


    In this case, I achieved one objective: a common API for feature information.
    Also, I defined my objects from a responsibility point of view. However, I did
    this at the price of creating special cases for everything. When I get new special
    classes, I will have to implement them as such. Hence, the high maintenance costs.


    > and intuition says there must be a better solution


    This was my first-blush solution and I immediately disliked it. My dislike grew
    more from my intuition than from the more logical reasons I gave above. I felt
    that there were problems.'
