  md: '# One rule, one place.


    A very important implementation strategy to follow is to have only one place where
    you implement a rule. In other words, if you have a rule how to do things, only
    implement that once. This typically results in code with a greater number of smaller
    methods. The extra cost is minimal, but it eliminates duplication and prevents
    many future problems. Duplication is bad not only because of the extra work in
    typing things multiple times, but because of the likelihood of something changing
    in the future and then forgetting to change it in all of the required places.


    While the draw method or Rectangle could directly call the drawLine method of
    whatever Drawing object the Shape has, if there is one place we can improve the
    code by continuing to follow the one rule, place strategy and have a drawLine
    method in Shape that calls the drawLine method of its Drawing object.


    I am not a purist (at not in most things), but if there is one place I think it
    is important to always follow a rule, it is here. In the example below, I have
    a drawLine method in Shape because describes my rule of drawing a line with Drawing.
    I do the same with drawCircle for circles. By following this strategy, I prepare
    myself for other derived objects that might need to draw lines and circles.


    Where did the rule, one place strategy come from? While many have documented it,
    it has been in the folklore of object-oriented designers for a long time. It represents
    a best practice of designers. Most recently, Kent Beck called this the "once and
    only rule."


    > * Beck, K., Extreme Programming Explained: Embrace Change, Reading, Mass.: Addison
    Wesley, 2000, pp. 108–109.'
