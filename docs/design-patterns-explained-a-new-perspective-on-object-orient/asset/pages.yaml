  md: 'Alexander''s thesis is that building from the pieces is not a good way to design.


    Even though Alexander is talking about architecture, many software-design practitioners
    whom I respect said that his insights were valid for us as well. I had to open
    my mind to this new way of thinking. And when I did so, I heard Alexander say
    that "good software design cannot be achieved simply by adding pre-formed parts"
    (i.e., parts defined before seeing how they would fit together).


    Building by pieces will not get us elegance


    When parts are modular and made before the whole, by definition then, they are
    identical, and it is impossible for every part to be unique, according to its
    position in the whole. Even more important, it simply not possible for any combination
    of modular parts to contain the number of patterns which must be present simultaneously
    in a place which is alive.


