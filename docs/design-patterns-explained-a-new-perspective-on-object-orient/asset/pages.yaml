  md: '# Moving from Architectural to Software Design Patterns


    The Hillside Group adapted Alexander software


    What does all of this architectural stuff have to do with us software developers?


    Well, in the early 90s some experienced developers happened upon Alexander’s work
    in patterns. They wondered if what was true for architectural patterns would also
    be true for software design. 2


    +   * Were there problems in software that occur over and again that could be
    solved in somewhat the same manner?


    +   * Was possible to design software in terms of patterns, creating specific
    solutions based on these patterns only after the patterns had been identified?


    The group felt the answer to both of these questions was “unequivocally yes”.
    The next step was to identify several patterns and develop standards for cataloging
    new ones.


    The Gang of Four did the early work on Design Patterns


    Although many people were working on design patterns in the early 90s, the book
    that had the greatest influence on this fledgling community was Design Patterns:
    Elements of Reusable Object-Oriented Software by Gamma, Helm, Johnson, Vlissides
    [Gamma 1995]. In recognition of their important work, these four authors are commonly
    and affectionately known as the “Gang of Four”.


    This book served several purposes.


    +   * It defined design patterns were within the area of software design.


    +   * It described a structure within which to catalog and describe design patterns.


    +   * It cataloged 23 patterns.


    +   * It postulated object-oriented strategies and approaches based on these design
    patterns.


    It is important to realize that the patterns described in the book were not created
    by the authors. Rather, the authors identified these as already existing within
    the software community, patterns that reflected what had been learned about high
    quality designs for specific problems (note the similarity to Alexander’s work).


    Today, there are several different forms for describing design patterns. In some
    circles, the Gang of Four’s structure is considered to be obsolete.


    > 2 The ESPR consortium in Europe was doing similar work in the 1980s. Project
    1998 and Project 5248 developed a pattern-based design methodology Knowledge Analysis
    and Design Support (KADS). See Cognitive Patterns: Problem-Solving Frameworks
    for Object Technology, Karen Gardner, et.al. Cambridge University Press, 1998.'
