  md: '# A rule to use when considering context.


    During one of my projects, I was reflecting on my design approaches. I noticed
    something that I did consistently, almost unconsciously: I never worried about
    how I was going to instantiate my objects until I knew what I wanted my objects
    to be. My chief concern was with relationships between objects as if they already
    existed. I assumed that I would be able to construct the objects that fit in these
    relationships when the time comes to do so.


    The reason I do this is that I need to minimize the number of things that I need
    to keep in my head during a design. Usually I can do so with a minimal amount
    of risk when I delay thinking about how to instantiate objects that meet my requirements.
    Worrying too early is counterproductive; it is better not to worry about instantiating
    objects until I know what it is that I need to instantiate. I will let tomorrow
    take care of itself—at least when it comes to instantiation!


    Perhaps this seems sensible to you. I had never heard it stated as a rule and
    I wanted to check it out before adopting it as universal. I trust my intuition
    as a designer, but I am certainly not foolproof. So, I have conferred with several
    other experienced developers on this subject; without exception, they also follow
    this rule. That gives me confidence to offer it to you:


    > Rule: Consider what you need to have in your system before you concern yourself
    with how to create it.


    This fits Alexander''s context rule: When you have a design pattern that involves
    creating objects, the objects set the context for the pattern.'
