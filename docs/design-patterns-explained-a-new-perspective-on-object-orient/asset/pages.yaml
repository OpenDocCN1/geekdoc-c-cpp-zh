    # Look for alternatives in initial design.


    Although my alternative design was not significantly better than my original design,
    it is worth pointing out that alternatives to an original design is a good practice.
    Too many developers take what they first come up with and go with that. I am not
    endorsing an in-depth study of all possible alternatives (another way of getting
    “paralysis by analysis”). However stepping back and looking at how we can overcome
    the design deficiencies in our original design is a great practice. In fact, it
    was just this stepping back, a refusal to move forward with a known, poor design,
    that led me to understanding the powerful methods of using design patterns that
    this entire book is about.


    # An Observation About Using Design Patterns


    When people begin to look at design patterns, they often focus on the solutions
    the patterns offer. This seems reasonable because they are advertised as providing
    good solutions to the problems at hand.


    However, this is starting at the wrong end. When you learn patterns by focusing
    on the solutions they present, it makes it hard to determine the situations in
    which a pattern applies. This only tells us what to do but not when to use it
    or why to do it.'
