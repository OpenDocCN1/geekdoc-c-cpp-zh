  md: '# CHAPTER 6


    # The Facade Pattern


    # Overview


    I will start the study of design patterns with a pattern that you have probably
    implemented in the past but may not had a name for: the Facade pattern.


    In this chapter


    In this chapter,


    +   * I explain what the Facade pattern is and where it is used.

    * I present the key features of the pattern.

    * I present some variations on the Facade pattern.

    * I relate the Facade pattern to the CAD/CAM problem.


    # Introducing the Facade Pattern


    According to Gang of Four, the intent of the Facade pattern is to:


    Intent: a unified, high-level interface


    > "Provide a unified interface to a set of interfaces in sub-system. Facade defines
    a higher-level interface that makes the subsystem easier to use."


    Basically, this is saying that we need a new way to interact with a system that
    is easier than the current way, or we need to use the system in a particular way
    (such as using a 3-D drawing program in a 2-D way). We can build such a method
    of interaction because we only need to use a subset of the system in question.


    1 Gamma, E., Helm, R., Johnson, R., Vissides, J., Design Patterns: Elements of
    Reusable Object-Oriented Software, Reading, Mass.: Addison-Wesley, 1995, p. 185.'
  merge: -1
