  md: '# Chapter 5 • An Introduction to Design Patterns 79


    Table 5-2 Key Features of Patterns

    | Item | Description |

    |---|---|n| Name | All patterns have a unique name that identifies them. |

    | Intent | The purpose of the pattern. |

    | Problem | The problem that the pattern is trying to solve. |

    | Solution | How the pattern provides a solution to the problem in the context
    in which it shows up. |

    | Participants and Collaborators | The entities involved in the pattern. |

    | Consequences | The consequences of using the pattern. Investigates the forces
    at play in the pattern. |

    | Implementation | How the pattern can be implemented. *Note:* Implementations
    are just concrete manifestations of the pattern and should not be construed as
    the pattern itself. |

    | GoF Reference | Where to look in the Gang of Four text to get more information.
    |


    Consequences/Forces

    The term consequences is used in design patterns and is often misunderstood. In
    everyday usage, consequences usually carries a negative connotation. (You never
    hear someone say, "I won the lottery! As a consequence, I now do not have to go
    to work!") Within the design pattern community, on the other hand, consequences
    simply refers to cause and effect. That is, if you implement this pattern in such-and-such
    a way, this is how it will affect and be affected by the forces present.'
