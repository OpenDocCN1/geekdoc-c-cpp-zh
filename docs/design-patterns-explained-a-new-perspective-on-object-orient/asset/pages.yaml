  md: '# Compound design

    patterns


    When two or more patterns are tightly integrated (like my Bridge

    and Adapter), the result is called a composite design pattern.⁷,⁸ It is

    now possible to talk about patterns of patterns!


    # Instantiating the

    objects of the Bridge

    pattern


    Another thing to notice is that the objects representing the abstrac-

    tion (the Shapes) were given their implementation while being\instantiated. This
    is not an inherent part of the pattern, but it is very

    common.


    Now that you understand the Bridge pattern, it is worth reviewing

    the Gang of Four''s Implementation section in their description of

    the pattern. They discuss different issues relating to how the

    abstraction creates and/uses the implementation.


    # An advantage of

    Java over C++ in the

    Bridge pattern


    Sometimes when using the Bridge pattern, I will share the imple-

    mentation objects across several abstraction objects.


    +   - In Java, this is no problem; when all the abstraction objects go

    away, the garbage collector will realize that the implementation

    objects are no longer needed and will clean them up.


    +   - In C++, I must somehow manage the implementation objects.

    There are many ways to do this; keeping a reference counter or

    even using the Singleton pattern as possibilities. It is nice,

    hover, not to have to consider this effort. This illustrates

    an advantage of automatic garbage collection.


    > 7. Compound design patterns used to be called composite design patterns, but
    are

    now called compound design patterns to avoid confusion with the composite

    pattern.


    > 8. For more information, refer to Riehle, D., “Composite Design Patterns,” In,

    Proceedings of the 1997 Conference on Object-Oriented Programming Systems, Languages

    and Applications (OOPSLA ''97), New York: ACM Press, 1997, pp. 218–228. Also

    refer to “Composite Design Patterns (They Aren''t What You Think),” C++ Report,

    June 1998.'
