  md: '+   1. Make a preliminary design without worrying about all of the details
    involved.


    +   2. Implement the design achieved.


    Ultimately, this perspective allows for better object selection and definition
    (in a sense, the main point of design anyway). Object definition is more flexible;
    by focusing on what an object does, inheritance allows us to use different, specific
    behaviors needed. A focus on implementation may achieve this, but flexibility
    typically comes at a higher price.


    It is easier to think in terms of responsibilities because that helps to define
    the object''s public interface. If an object has a responsibility, there must
    be some way to it to perform its responsibility. however, it does not imply anything
    about what is *inside* the object. The information for which the object is responsible
