  md: '# 104 Part III • Design Patterns


    The decision of which Adapter pattern to use is based on the different forces
    at work in the problem domain. At a conceptual level, I may ignore the distinction;
    however, when it comes time to implement it, I need to consider more of the forces
    involved.


    # Comparing the Adapter with the Facade


    In classes of design patterns, someone almost always states that it sounds as
    if both the Adapter pattern and the Facade pattern are the same. In both cases
    there is a preexisting class (or classes) that does have the interface that is
    needed. In both cases, I create a new object that has the desired interface (see
    Figure 7-7).


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_111_0.png)


    **Figure 7-7 A Client object using another, preexisting object with the wrong
    interface.**


    # Both are wrappers


    Wrappers and object wrappers are terms that you hear a lot about. It is popular
    to think about wrapping legacy systems with objects to make them easy to use.


    At this high view, the Facade and the Adapter patterns do seem similar. They are
    both wrappers. But they are different kinds of wrappers. You need to understand
    the differences, which can be subtle. Finding and understanding these more subtle
    differences gives insight into a pattern''s properties. Let''s look at some different
    forces involved with these patterns (see Table 7-1).


    +   1. For help deciding between Object Adapter and Class Adapter, see pages 142-144
    in the Gang of Four book.'
