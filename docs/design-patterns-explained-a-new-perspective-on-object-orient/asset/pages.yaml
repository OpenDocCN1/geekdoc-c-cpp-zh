  md: '# Preface xxiii


    Suddenly, I had a structure for modeling expert behaviors without getting trapped
    by the complexities and exceptions too early. I was able to complete my next three
    projects in less time, with less rework, and with greater satisfaction by end-users:


    +   - I could design models more quickly because the patterns predicted for what
    me ought to be there. They told me what the essential objects were and what to
    pay special attention to.

    - I was able to communicate much more effectively with experts because we had
    a more structured way to deal with the details and exceptions.

    - The patterns allowed me to develop better end-user training for my system because
    the patterns predicted the most important features of the system.


    This last point is significant. Patterns help end-users understand systems because
    they provide the context for the system, why we are doing things in a certain
    way. We can use patterns to describe the guiding principles and strategies of
    the system. And we can use patterns to develop the best examples to help end-users
    understand the system.


    I was hooked.


    So, when a design patterns study group started at my place of employment, I was
    eager to go. This is where I met Alan who had reached a similar point in his work
    as an object-oriented designer and mentor. The result is this book.


    I hope that the principles in this book help you in your journey to become a more
    effective and efficient analyst.


    James Trott

    December, 2000'
