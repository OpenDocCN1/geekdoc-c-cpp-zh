  md: '# The Adapter Pattern: Key Features


    Intent


    Match an existing object beyond your control to a particular interface.


    Problem


    A system has the right data and behavior but the wrong interface. Typically used
    when you have to make something of a derivative of an abstract class we are defining
    or already have.


    Solution


    The Adapter provides a wrapper with the desired interface.


    Participants and Collaborators


    The Adapter adapts the interface of an Adaptee to match that of the Adapter''s
    Target (the class it derives from). This allows the Client to use the Adapter
    as if it were a type of Target.


    Consequences


    The Adapter pattern allows for preexisting objects to fit into new class structures
    without being limited by their interfaces.


    Implementation


    Contain the existing class in another class. Have the containing class match the
    required interface and call the methods of the contained class.


    GoF Reference


    Pages 139-150.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_109_0.png)


    Figure 7-6 Standard, simplified view of the Adapter pattern.'
  merge: -1
