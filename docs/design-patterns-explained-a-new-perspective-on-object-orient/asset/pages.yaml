  md: '# 92 Part III · Design Patterns


    The Facade pattern sets the general approach; it got me started. The Facade part
    of the pattern is the fact that I am creating a new interface for the client to
    use instead of the existing system''s interface. I can do this because the Client
    object does not need to use all of the functions in my original system.


    # Patterns set a general approach.


    A pattern just sets the general approach. Whether or not to add new functions
    depends on the situation at hand. Patterns are blueprints to get you started;
    they are not carved in stone.


    Variations on Facade: an "encapsulating" layer


    The Facade can be used to hide, or encapsulate, the system. The Facade could contain
    the system as private members of the Facade class. In this case, the original
    system would be linked with the Facade class, but not presented to users of the
    Facade class.


    There are a number of reasons to encapsulate the system:


    +   * Track system usage—By forcing all accesses to the system to go through the
    Facade, I can easily monitor system usage.

    * Swap out systems—I may need to change out systems in the future. By making the
    original system a private member of the Facade class, I can switch out the system
    for a new one with minimal effort. There may still be a significant amount of
    effort required, but at least I will only have to change the code in one place
    (the Facade class).


    # Relating the Facade Pattern to the CAD/CAM Problem


    Encapsulate the V1 system


    Think of the example above. The Facade pattern could be useful to help V1Slots,
    VHoles, etc., use the V1System. I will do just that in the solution in Chapter
    12, "Solving the CAD/CAM Problem with Patterns."'
