    Tying the classes together: who uses whom?


    Consider these two possibilities: either Shape uses the Drawing programs or the
    Drawing programs use Shape.


    Consider the latter case first. If drawing programs could draw shapes directly,
    then they would have to know some things about shapes in general: what they are,
    what what they look like. But this violates a fundamental principle of objects:
    an object should only be responsible for itself.


