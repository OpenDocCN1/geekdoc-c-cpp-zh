  md: 'Unfortunately, many approaches to teaching object-oriented design focus on
    data abstraction—making designs overly based on the “is-ness” of the objects.
    As I became an experienced object-oriented designer, I was still stuck in the
    paradigm of designing based on inheritance—that is, looking at the characteristics
    of classes based on their “is-ness.” Characteristics of objects should be based
    on their responsibilities, not on what they might contain or be. Objects, of course,
    may be responsible for giving information about themselves; for example, a customer
    object may need to be able to tell you its name. Think about objects in terms
    of their responsibilities, not in terms of their structure.


    Experienced object-oriented analysts have learned to inherit selectively to realize
    its power. Using design patterns will help you move along this learning curve
    more quickly. It involves a transition from using a different specialization for
    each variation (inheritance) to moving these variations into used or owned objects
    (composition).


