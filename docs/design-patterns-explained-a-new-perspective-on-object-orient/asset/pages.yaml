    A constructor is a special method that is automatically called when the object
    is created. Its purpose is to handle starting up the object. This is part of an
    object''s mandate to be responsible for itself. The constructor is the natural
    place to do initializations, set default information, set up relationships with
    other objects, or do anything else that is needed to make a well-defined object.
    All object-oriented languages look for a constructor method and execute it when
    the object is created.


    Constructors initialize, or set up, an object


    By using constructors properly it is easier to eliminate (or at least minimize)
    uninitialized variables. This type of error usually occurs from carelessness on
    the part of the developer. By having a set, consistent place for all initializations
    throughout your code (that is, the constructors of your objects) it is easier
    to ensure that initializations take place. Errors by uninitialized variables are
    easy to fix but hard to find, so this convention (with the automatic calling of
    the constructor) can increase the efficiency of programmers.


    A destructor is a special method that helps clean up itself when the object goes
    out of existence; that is, when the object is destroyed. All object-oriented languages
    look for a destructor method and execute it when the object is being deleted.
    As the constructor, the use of the destructor is part of the object''s mandate
    to be responsible for itself.


    Destructors clean up an object when it is no longer needed (when it has been deleted)


