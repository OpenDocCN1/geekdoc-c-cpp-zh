  md: '# 260 Part V • Handling Variations with Design Patterns


    will contain one of the Singleton objects while all of the other client objects
    will refer to the other Singleton.


    At first, it appears that all I need to do is synchronize the test for whether
    the Singleton object has been created. The only problem is that this synchronization
    may end up being a severe bottleneck, because all of the threads will have to
    wait for the check on whether the object already exists.


    Synchronizing the creation of the Singleton object


    Perhaps instead, I could put some synchronization code in the if (instance== null)
    test. This will not work either. Since it would be possible that both calls call
    the NULL test and then attempt to synchronize, I could still end making up two
    Singleton objects, making them one at a time.


    The solution is to do a "sync" after the test for NULL and then check again to
    make sure the member instance has not yet been created. I show this in Example
    16-2. This is called double-checked locking. The intent is to optimize away unnecessary
    locking. This synchronization check happens at most one time, so it will not be
    a bottleneck.


    A simple solution: double-checked locking


    The features of double-checked locking are as follows:


    +   - Unnecessary locking is avoided by wrapping the call to another conditional
    test.

    - Support for multithreaded environments.


    > 3. Martin, R., Riehle, D., Buschmann, R, Pattern Language of Program Design,
    Reading. Mass.: Addison-Wesley, 1998, p. 363.'
