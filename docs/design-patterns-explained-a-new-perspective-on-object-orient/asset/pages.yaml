  md: '# Field Notes: Using the Observer Pattern


    Not for all dependencies

    The Observer pattern is not meant to be used every time there is a dependency
    between objects. For example, in a ticket processing system a tax object handles
    taxes, it is clear that when items are added to the ticket the tax object must
    be notified so the tax can be recalculated. This is not a good place for an Observer
    pattern since this notification is known up front and others are not likely to
    be added. When the dependencies are fixed (virtually), adding an Observer pattern
    just adds complexity.


    ... but for changing or dynamic dependencies

    If the list of objects that need to be notified, or is somehow conditional, then
    the Observer pattern has greater value. These changes can occur either because
    the requirements are changing or because the list of objects that need to be notified
    is changing. The Observer pattern can also be useful if the system is run under
    different conditions or by different customers, each having a different list of
    required observers.


    Whether to process an event

    An observer may only need to handle cases of an event. The Brick and mortar case
    was an example. In such situations, the observer must filter out extra notifications.


    Extraneous notifications can be eliminated by shifting the responsibility for
    filtering out these notifications to the Subject. The best way to do this is for
    the Subject to use a Strategy pattern to test if notification should occur. Each
    observer gives the Subject the correct strategy to use when it registers.


    How to process an event

    Sometimes, Subjects will call the observers'' update method, passing along information.
    This can save the need for callbacks from the observers to the Subject. However,
    it is often the case that different observers have different information requirements.
    In this case, a Strategy pattern can again be used. This time, the Strategy object
    is used for calling the observers'' update procedure. Again,'
