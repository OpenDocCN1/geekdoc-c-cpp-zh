  md: '# # Design Pattern Matrix


    | Pattern | Notes on the patterns |

    | --- | --- |

    | Decorator | **Indicators in design:** There is some action that is always done,
    there are other actions that may need to be done. **Indicators in design:** 1)
    There is a collection of actions; 2) These actions can be added in any combination
    to an existing function; You don''t want to change the class that is using decoration.
    **Indicator pattern is not used when it should be:** There are switches that determine
    if optional function should be called before some existing function. **Variation
    Encapsulated:** The functionality to be added before or after an existing function.
    **Field notes:** This pattern is used extensively in the GoF (Client-Context)
    for file handling. |

    | Proxy – adding function | **Indicators in design:** We need some particular
    action to occur before some object we already have called. **Indicator pattern
    is not used when it should be:** We provide a function with some code every time
    it is used. Or, we add a switch to it sometimes... **Field notes:** Proxies are
    useful to encapsulate a specific function that is useful prior to calling an existing
    object. |

    | State | **Indicators in analysis and design:** We have behaviors that change,
    depending on the state we are in. **Indicator pattern is not used when it should
    be:** The code keeps track of the system is in. Each time an event is handled,
    a switch decides which to execute (based on the mode the system is in). The rules
    for transitioning between patterns may also be complex. **Field notes:** Define
    our classes by looking at the following questions:

    1. What are our states?

    2. What are the events handled?

    3. How do we handle the transitions between states? |

    | Strategy | **Indicators in analysis:** There are different implementations of
    a business rule. **Indicators in design:** You have a place where a business rule
    (or algorithm) changes. **Indicator pattern is not used when it should be:** A
    switch is present which determines which-business-rule to use. A class hierarchy
    is present where the main difference between the derivations is an overridden
    method. **Relationships involved:** An object that uses another object (Client-Context
    relationship). A client that gets another object to use (Client-Context relationship).
    **Variation Encapsulated:** The different implementations of the business rules.
    **Field notes:** The essence is that the Context does not know which rule it is
    using. Either the Client gets the Algorithm or the Context as a factory (or configuration
    type) to get the correct object to use. |

    | Template | **Indicators in analysis:** There are different procedures that are
    essentially the same, except that each step differs differently. **Indicators
    in design:** You have a consistent set of steps to follow but individual steps
    may have different implementations. **Indicator pattern is not used when it should
    be:** Different classes implement essentially the same process flow. **Field notes:**
    The template pattern is most useful when it is used to abstract out common flow
    between two similar processes. |

    | Visitor | **Indicators in analysis and design:** We have a reasonably stable
    set of classes for which you need to add new functions. You can add tasks to be
    performed on this set without having to change it. **Variation Encapsulated:**
    A set of tasks to run against a set of derivations. **Field notes:** This is a
    useful pattern for writing sets of tests that you can run when needed |'
