    # Overview


    This chapter continues the e-tailing case study discussed in Chapters In this
    chapter 14-16.


    In this chapter,


    +   * I introduce the categorization scheme of patterns.

    * I introduce the Observer pattern by discussing additional requirements for the
    case study.

    * I apply the Observer pattern to the case study.

    * I describe the Observer pattern.

    * I describe the key features of the Observer pattern.

    * I describe some of my experiences using the Observer pattern in practice.


    # Categories of Patterns


    There are many patterns to keep track of. To help sort this out, the GoF has three
    Gang of Four has grouped patterns into three general categories, as categories
    shown in Table 17-1.¹


    > 1. Gamma, E., Helm, R., Johnson, R., Vlissides, J., Design Patterns: Elements
