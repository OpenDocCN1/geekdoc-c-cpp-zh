  md: '# CHAPTER 2


    # The UML—The Unified Modeling Language


    # Overview


    This chapter gives a brief overview of the Unified Modeling Language (UML), which
    is the modeling language of the object-oriented community. If you do not already
    know the UML, this chapter will give you the minimal understanding you will need
    to be able to read the diagrams contained in this book.


    In this chapter


    In this chapter,


    +   - I describe what the UML is and why to use it.

    - I discuss the UML diagrams that are essential to this book:

    - The Class Diagram

    - The Interaction Diagram


    # What is the UML?


    The UML is a visual language (meaning a drawing notation with semantics) used
    to create models of programs. By models of pro-grams, I mean a diagrammatic representation
    of the programs in which one can see the relationships between the objects in
    the code.


    UML offers many kinds of modeling diagrams


    The UML has several different diagrams — some for analysis, others for design,
    and still others for implementation (or more accurately,'
