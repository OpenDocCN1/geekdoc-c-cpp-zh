    * But what will be using the new interface I create? One of the implementations
    of the Bridge pattern.


    Therefore, the Bridge pattern creates the context for the Facade. The Bridge is
    the seniormost pattern.


    According to Alexander, I am supposed to start with the whole. Going back to the
