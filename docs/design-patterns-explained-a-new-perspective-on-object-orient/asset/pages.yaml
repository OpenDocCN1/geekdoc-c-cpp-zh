    # Relating the Abstract Factory Pattern to the CAD/CAM Problem


    In the CAD/CAM problem, the system will have to deal with many sets of features,
    depending upon which CAD/CAM version it is working with. In the V1 system, all
    of the features will be implemented for V1. Similarly, in the V2 system, all of
    the features will be implemented for V2.


    The families that I will use for the Abstract Factory pattern will be V1 Features
    and V2 Features.


    # Summary


    The Abstract Factory is used when you must coordinate the creation of families
    of objects. It gives a way to take the rules regarding how to perform the instantiation
    out of the client object that is using these created objects.


    +   - First, identify the rules for instantiation and define an abstract class
    with an interface that has a method for each object that needs to be instantiated.


    +   - Then, implement concrete classes from this class for each family.


    +   - The client object uses this factory object to create the server objects
    that it needs.'
