  md: "# Decorators in testing\n\nI have used the Decorator to wrap precondition and\
    \ postcondition tests on an object to be tested with nice results. During test,\
    \ the first object in the chain can be an extensive test of preconditions prior\
    \ to calling its trailing object. Immediately after the trailing object call,\
    \ the same object calls an extensive test of postconditions. If I have different\
    \ tests I want to run at different times, I can keep each test in a different\
    \ Decorator and then chain them according to the battery of tests I want to run.\n\
    \n# Summary\n\nThe Decorator pattern is a way to add additional function(s) to\
    \ an existing function dynamically. In practice, it requires building a chain\
    \ of objects that give the desired behaviors. The first object in this chain is\
    \ called by a Client that had nothing to do with the building of it. By keeping\
    \ the creation of the chain independent from its use, the Client object is not\
    \ affected by new requirements to add functionality.\n\nIn this chapter\n\n# Supplement:\
