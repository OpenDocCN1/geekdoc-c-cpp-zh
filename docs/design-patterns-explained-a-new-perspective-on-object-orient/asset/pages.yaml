  md: '# Multiple levels of encapsulation


    Figure 8-1 shows many kinds of encapsulation:


    +   - Encapsulation of data—The data in Point, Line, Square, and Circle are hidden
    from everything else.


    +   - Encapsulation of methods—For example, Circle''s setLocation.


    +   - Encapsulation of subclasses—Clients of Shape do not see Points, Lines, Squares,
    or Circles.


    +   - Encapsulation of other objects—Nothing but Circle is aware of xxCircle.


    One type of encapsulation is thus achieved when there is an abstract class that
    behaves polymorphically without the client of the abstract class knowing what
    kind of derived class is actually present. Furthermore, adapting interfaces hides
    what is the adapting object.


    # The advantage of this new definition


    The advantage of looking at encapsulation this way is that it gives me a better
    way to split up (decompose) my programs. The encapsulating layers become the interfaces
    I design to. By encapsulating different kinds of Shapes, I can add new ones without
    changing any of the client programs using them. encapsulating XXCircle behind
    Circle, I can change this implementation in the future if I choose to or need
    to.


    # Inheritance as a concept versus inheritance for reuse


    When the object-oriented paradigm was first presented, reuse of classes was touted
    as being one of its big benefits. This reuse was achieved by creating classes
    and then deriving new classes based on these base classes. Hence the term specialized
    classes for those subclasses that were derived from other classes (which were
    generalized classes).


    I am not arguing with the accuracy of this, rather I am proposing what I believe
    to be a more powerful way of using inheritance. In the example above, I can do
    my design based on different special'
