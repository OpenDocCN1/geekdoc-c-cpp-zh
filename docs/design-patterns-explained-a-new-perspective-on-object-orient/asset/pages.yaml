  md: 'I have taken many of my ideas from Christopher Alexander’s The Timeless Way
    of Building.¹1 I will discuss these ideas throughout the book.


    # Design Patterns Arose from Architecture and Anthropology


    Is quality objective? Years ago, an architect named Christopher Alexander asked
    himself, "Is quality objective?" beauty truly in the eye of the beholder or would
    people agree that some things are beautiful and some are not? Now, the particular
    form of beauty that Alexander was interested in was one of architectural quality:
    what makes us know when an architectural design is good? For example, if a person
    were going to design an entryway for a house, how would he know that the design
    was good? Can we know good design? Is there an objective basis for such a judgment?
    A basis for describing our common consensus?


    Alexander postulates that there is such an objective basis within architectural
    systems. The judgment that a building is beautiful is not simply a matter of taste.
    We can describe beauty through an objective basis that can be measured.


    The discipline of cultural anthropology discovered the same thing. That body of
    work suggests that within a culture, individuals will agree to a large extent
    on what is considered to be a good design, what is beautiful. Cultures make judgments
    on good design that transcend individual beliefs. I believe that there are transcending
    patterns that serve as objective bases for judging design. A major branch of cultural
    anthropology looks for such patterns to describe the behaviors and values of a
    culture²


    +   1. Alexander, C., Ishikawa, S., Silverstein, M., The Timeless Way of Building,
    New York: Oxford University Press, 1979.

    2. The anthropologist Ruth Benedict is a pioneer in pattern-based analysis of
    cultures. For examples, see Benedict, R., The Chrysanthemum and the Sword, Boston:
    Houghton Mifflin, 1946.'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'The proposition behind design patterns is that the quality of software systems
    can also be measured objectively.


    If you accept the idea that it is possible to recognize and describe a good quality
    design, then how do you go about creating one? I can imagine Alexander asking
    himself,


    > How do you get good quality repeatedly?


    > What is present in a good quality design that is not present in a poor quality
    design?


    and


    > What is present in a poor quality design that is not present in a good quality
    design?


    These questions spring from Alexander''s belief that if quality in design is objective,
    then we should be able to identify what makes designs good and what makes designs
    bad.


    Alexander studied this problem by making many observations of buildings, towns,
    streets, and virtually every other aspect of living spaces that human beings have
    built for themselves. He discovered that, for a particular architectural creation,
    good constructs had things in common with each other.


    > Look for the commonalities


    Architectural structures differ from each other, even if they are of the same
    type. Yet though they are different, they can still be of high quality.


    > ... especially ever in the features of the problem to be solved


    For example, two porches may appear structurally different and yet both may be
    considered high quality. They might be solving problems for different houses.
    One porch may be a transition from the walkway to the front door. Another porch
    might be a place for shade on a hot day. Or two porches might solve a common problem
    (transition) in different ways.'
  merge: -1
