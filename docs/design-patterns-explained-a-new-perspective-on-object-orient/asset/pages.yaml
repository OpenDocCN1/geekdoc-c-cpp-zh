  md: '24O Part V • Handling Variations with Design Patterns


    C++, I might have the abstract strategy header file contain all of of the header
    files for the concrete strategies. I also have the abstract strategy cpp file
    contain the code for the concrete strategies. If I am using Java, I use inner
    classes in the abstract strategy class to contain all of the concrete strategies.
    I do not do this if I do not control all of the strategies; that is, if other
    programmers need to implement their own algorithms.


    # Summary


    In this chapter


    The Strategy pattern is a way to define a family of algorithms. Conceptually,
    all of these algorithms do the same things. They just have different implementations.


    I showed an example that used a family of tax calculation algorithms. In an international
    e-tail system, there might be different tax algorithms to use for different countries.
    Strategy would allow me to encapsulate these rules in one abstract class and have
    a family of concrete derivations.


    By deriving all the different ways of performing the algorithm from an abstract
    class, the main module (SalesOrder in the example above) does not need to worry
    about which of many possibilities is actually in use. This allows for new variations
    but also creates the need to manage these variations—a challenge I will discuss
    in Chapter 20, "The Analysis Matrix."'
