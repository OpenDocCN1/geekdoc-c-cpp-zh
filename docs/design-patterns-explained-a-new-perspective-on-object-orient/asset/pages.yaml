    The hard-coding approach works fine—the first time. But requirements always change.
    I know that another requirement will require another change to Customer''s behavior.
    Example, I might have to support different companies'' welcome letters, which
    would require a different Customer object for each company. Surely, I can do better.


    # The Observer Pattern


    According to the Gang of Four, the intent of the Observer pattern is to "Define
    a one-to-many dependency between objects so that when one object changes state,
    all its dependents are notified and updated automatically."


    Often, I have a set of objects that need to be notified whenever an event occurs.
    I want this notification to occur automatically. However, I do not want to change
    the broadcasting object everytime there is a change to the set of objects listening
    to the broadcast. (That would be like changing a radio transmitter every time
    a new car radio comes to town.) I want to decouple the notify-ors and the notify-ees.


    +   2. Gamma, E., Helm, Johnson, R., Vlissides, J., Design Patterns: Elements
    of Reusable Object-Oriented Software, Reading, Mass.: Addison-Wesley, 1995, p.
    293.'
