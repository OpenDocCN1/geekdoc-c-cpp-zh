  md: '# The Factory Method Pattern


    The Factory Method is a pattern intended to assign responsibility for creation.
    According to the Gang of Four, the intent of the Factory Method is to


    Define an interface for creating an object, but let subclasses decide which class
    to instantiate. Factory Method lets a class defer instantiation to subclasses.¹


    # Field Notes: Using the Factory Method Pattern


    In the classic implementation of the Abstract Factory, I had an abstract class
    define the methods to create a family of objects. I derived a class for each different
    family I could have. Each of the methods defined in the abstract class and then
    overridden in the derived classes were following the Factory Method pattern.


    Sometimes it is useful to create a hierarchical class structure that is parallel
    to an existing class, with the new hierarchy containing some delegated responsibilities.
    In this case, it is important for each object in the original hierarchy to be
    able to instantiate the proper object in the parallel hierarchy. A Factory Method
    can be used for this purpose.


    The Factory Method pattern is commonly used when defining frameworks. This is
    because frameworks exist at an abstract level. Usually, they do not know and should
    not be concerned about instantiating specific objects. They need to defer the
    decisions about specific objects to the users of the framework.


    > 1 Gamma, E., Helm, R., Johnson, R., Vlissides, J., Design Patterns: Elements
    of Reusable Object-Oriented Software, Reading, Mass.: Addison-Wesley, 1995, p.
    325.'
