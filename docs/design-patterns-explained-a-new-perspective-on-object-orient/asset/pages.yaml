  md: '# Summary


    In this chapter


    Sometimes, I have a set of procedures that I must follow. The procedures are common
    at a high level, but implementing some of the steps can vary. For example, querying
    a SQL database is fairly routine at a high level, but some of the details—say,
    how to connect to the database—can vary based on details such as the platform.


    The Template Method allows me to define the sequence of steps and then override
    those steps that need to change.'
