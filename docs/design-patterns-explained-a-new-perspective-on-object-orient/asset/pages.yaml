  md: '# Part III - Design Patterns


    # The Abstract Factory Pattern: Key Features


    Intent

    You want to have families or sets of objects for particular clients (or cases).


    Problem

    Families of related objects need to be instantiated.


    Solution

    Coordinates the creation of families of objects. Gives a way to take the rules
    of how to perform the instantiation out of the client object that is using these
    created objects.


    Participants and Collaborators

    TheAbstractFactory defines the interface for how to create member of the family
    of objects required. Typically, each family is created by having its own unique
    ConcreteFactory.


    Consequences

    The pattern isolates the rules of which objects to use from the logic of how to
    use these.


    Implementation

    Define an abstract class that specifies which objects are to be made. Then implement
    one concrete class for each family. Tables or files can also be used to accomplish
    the same thing.


    GoF Reference

    Pages 27-96.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_180_0.png)


    Figure 10-8 Standard, simplified view of the Abstract Factory pattern.'
