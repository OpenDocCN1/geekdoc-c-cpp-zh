  md: '# # Design Pattern Matrix


    | Pattern | Notes on the patterns |

    | --- | --- |

    | Abstract factory | **Indicators in analysis:** Different cases exist that require
    different implementations of common rules.<br><br>**Indicators in design:** Many
    polymorphic structures exist that are used in pre-defined combinations. These
    combinations are defined by there particular cases to implement or different needs
    of client objects.<br><br>**Indicators pattern not being used when it should be:**
    A variable is used in several places to determine which object to instantiate.<br><br>**Relationships
    involved:** The Abstract Factory object is responsible for coordinating the family
    of objects that the client needs. The client object has the responsibility for
    using the objects. |

    | Builder | **Indicators in analysis:** Several different kinds of complex objects
    can be built with the same overall build process, where there is variation in
    the individual construction steps.<br><br>**Indicators in design:** You want to
    hide the implementation of instantiating complex object, or you want to bring
    together all of the rules for instantiating complex objects. |

    | Factory Method | **Indicators in analysis:** There are different commonalities
    whose implementations are coordinated with each other.<br><br>**Indicators in
    design:** A class needs to instantiate a derivation of another class, but doesn''t
    know which one. Factory method allows a derived class to make this decision.<br><br>**Field
    notes:** The Factory method is often used with frameworks. It is also used when
    the different implementations of one class hierarchy requires a specific implementation
    of another class hierarchy. |

    | Prototype | **Indicators in analysis:** There are prototypical instances of
    things.<br><br>**Indicators in design:** When objects being instantiated need
    to look like a copy of a particular object. Allows for dynamically specifying
    what our instantiated objects look like. |

    | Singleton | **Indicators in analysis:** There exists only one entity of something
    in the problem domain that is used by several different things.<br><br>**Indicators
    in design:** Several different client objects need to refer to the same thing
    and we want to make sure we don''t have more than one of them. You only want to
    have one of an object but there is no higher object controlling the instantiation
    of the object in questions.<br><br>**Field notes:** You can get the same function
    as Singletons with static methods. Therefore, the Singleton should be used when
    only statistics don''t work. This occurs when you need to control when the class
    is instantiated (that, static members are allocated). Another case is if you want
    to use polymorphism on the Singleton. |'
