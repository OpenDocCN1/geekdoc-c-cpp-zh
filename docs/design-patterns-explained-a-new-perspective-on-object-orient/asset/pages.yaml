  md: '# Part III • Design Patterns


    The Gang of Four did the early work on Design Patterns


    Although many people were working on design patterns in the early 1990s, the book
    that had the greatest influence on this fledgling community was Design Patterns:
    Elements of Reusable Object-Oriented Software⁶ by Gamma, Helm, Johnson, and Vlissides.
    In recognition of their important work, these four authors are commonly affectionately
    known as the Gang of Four.


    This book served several purposes:


    +   - It applied the idea of design patterns to software design.


    +   - It described a structure within which to catalog and describe design patterns.


    +   - It cataloged 23 such patterns.


    +   - It postulated object-oriented strategies and approaches based on these design
    patterns.


    It is important to realize that the authors did not create the patterns described
    in the book. Rather, the authors identified these patterns as already existing
    within the software community, patterns that reflected what had been learned about
    high-quality designs for specific problems (note the similarity to Alexander’s
    work).


    There, there are several different forms for describing design patterns. Since
    this is not a book about writing design patterns, I will not offer an opinion
    on the best structure for describing patterns; however, the following items listed
    in Table 5-2 need to be included in any description.


    For each pattern that I present in this book, I present a one-page summary of
    the key features that describes that pattern.


    > ⁶ Gamma, E., Helm, R., Johnson, R., Vlissides, J., Design Patterns: Elements
    of Reusable Object-Oriented Software. Reading. Mass.: Addison-Wesley, 1995.'
  merge: -1
