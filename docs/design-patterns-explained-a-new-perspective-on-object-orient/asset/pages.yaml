    # **The Observable Class: A Note to Java developers.**


    The Observer pattern is so useful that Java contains an implementation of it in
    its packages. The Observable class and the Observer interface make up the pattern.
    The Observable class plays the role of the Subject in the Gang of Four''s description
    of the pattern. Instead of the methods attach, detach, and notify, Java uses `addObserver`,
    `deleteObserver`, and `notifyObservers`, respectively (Java also uses `update`).
    Java also gives you a few more methods to make life easier.*


