    | Pattern | Notes on the patterns |

    | --- | --- |

    | Adapter | **Indicators in analysis:** Normally don''t worry about interfaces
    here, don''t usually think about it. However, if you know some design code is
    to be incorporated into your system, then an adapter will be needed since it is
    unlikely it will have the correct interface.

    **Indicator in design:** Something has the right stuff but the wrong interface.
    Typically used when you have to make something''s a derivative of an abstract
    class we are defining or already have.

    **Field notes:** The adapter pattern allows you to defer concern what the interfaces
    of your pre-existing objects look like since you can easily change them. | Bridge
    | **Indicators in analysis:** There are a set of related objects using another
    set of objects. This second set represents an implementation of the first set.

    **Indicators in design:** There is a set of derivations that use a common set
    of objects to get implemented.

    **Indication pattern is not used when it should be:** There is a class hierarchy
    that has redundancy in it, in particular, when we use objects another set of object.
    Also, if a new case is added to this hierarchy or the classes being used, which
    will result in multiple classes being added.

    **Relationships involved:** Using the classes (the GoF "Abstraction") used the
    classes (the GoF "Implementation") in different ways but don''t know which implementer
    is present.

    **Field notes:** Although the implementer to use from instance to instance, typically
    only one implementer is used for the life of the using. We usually select the
    implementer at construction time, passing it into the constructor or having the
    constructor decide which implementer should be used. | Composite | **Indicators
    in analysis:** There are single things and groups of things that you want to treat
    the same way. The groups are made up of other groups and groups (i.e., they are
    hierarchically related).

    **Indicators in design:** Some objects are composed of collections of other objects,
    yet we want to handle all of these objects in the same way.

    **Indication pattern is not used when it should be:** The code is distinguishing
    between whether a single object is present or a collection of objects is present.
    | Faç | **Indicators in analysis:** A complex system which will likely not be
    utilized to its full extent.

    **Indicators in design:** Reference to an existing system is made in similar ways.
    That is, you see combinations of calls to a system repeated over and again.

    **Indication pattern is not used when it should be:** Many people on a team have
    to learn a new system although each person is only using a small aspect of it.

    **Field notes:** Not used for encapsulating variation, but different facets derived
    from the same abstract class can encapsulate different sub-systems. This is called
    an encapsulation. | Proxy | **Indicators in analysis and design:** Performance
    issues (speed or memory) can be foreseen because the cost of having objects around
    before they are actually used.

    **Indication pattern is not used when it should be:** Objects are being instantiated
    before they are actually used and the extent of this is causing performance problems.

    **Field notes:** This pattern often comes up to solve scalability issues or performance
    issues that arise after a system is working. |'
