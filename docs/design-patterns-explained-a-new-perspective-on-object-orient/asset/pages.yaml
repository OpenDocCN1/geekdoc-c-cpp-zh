  md: '# 54 Part II · The Limitations of Traditional Object-Oriented Design


    CAD/CAM V1 is dearly not object-oriented

    This system is painful to deal with and clearly not not object-oriented. Whosever
    is using the system must maintain the context for every query manually. Each call
    about a feature must know what kind of feature it has.


    CAD/CAM V2 is object-oriented

    The CAD/CAM vendor realizes the inherent limitations of this system. The primary
    motivation for building V2 was to make it object-oriented. The geometry in V2
    is therefore stored in objects. When a system requests a model, it gets back an
    object which represents the model. This model contains a set of objects, each
    representing a feature. Since the problem domain is based on features, it is not
    surprising that the classes V2 uses to represent these features correspond exactly
    to the ones I mentioned already: slots, holes, cutouts, specials, and irregulars.


    Therefore, in V2, I can get a set of objects that correspond to the features that
    exist in the sheet metal. The UML diagram in Figure 3-7 shows the classes for
    the features.


    ![](img/f880ca1c4f3aef846008aeb26c864ed7_64_0.png)


    Figure 3-7 Feature classes of V2.


    The OOG stands for object-oriented geometry, just as a reminder that V2 is an
    object-oriented system.'
