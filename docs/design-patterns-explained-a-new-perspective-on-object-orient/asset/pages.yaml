  md: 'Alexander postulated that patterns can solve virtually every architectural
    problem that one will encounter. He further postulated that patterns could be
    used together to solve complex architectural problems.


    How patterns work together will be discussed in this book. For now, I want to
    focus on his claim that patterns are useful to solve specialized problems.


    # Moving from Architectural to Software Design Patterns


    What does all of this architectural stuff have to do with software developers?


    Well, in the early 1990s some smart developers happened upon Alexander''s work
    in patterns. They wondered if what was true for architectural patterns would also
    be true for software design.


    +   * There were patterns in software that occur over and again that could be
    solved in somewhat the same manner?

    * It was possible to design software in terms of patterns, creating specific solutions
    based on these patterns only after the patterns had been identified?


    The group felt the answer to both of these questions was “unequocally.” The next
    step was to identify several patterns and develop standards for cataloging new
    ones.


    > 5. The ESPR consortium in Europe was doing similar work in the 1980s. ESPR''s
    Project 1098 and Project 5248 developed a pattern-based design methodology called
    Knowledge Analysis and Design Support (KADS) that was focused on creating expert
    systems. Karen Gardner extended the KADS analysis patterns to object orientation.
    See Gardner, K., Cognitive Patterns: Problem-Solving Frameworks for Object Technology,
    New York: Cambridge University Press, 1998.'
