    \ to fit their needs.\n\n*   Compatibility: The program should work seamlessly\
    \ with other software and hardware components without compatibility issues.\n\n\
    *   Support: The program should have adequate documentation, training, and technical\
    \ support to help users resolve any issues.\n\nBy having these features, a good\
    \ computer program will provide a positive user experience, increase productivity,\
    \ and provide long-term value to its users.\n\nReasons for using a structured,\
    \ systematic approach to problem-solving:\n\n*   To ensure consistency\n\n*  \
    \ To make everyone aware of how others are approaching the project.\n\n*   To\
    \ keep the procedure objective and resistant to personal prejudices and impressions.\n\
    \n*   To facilitate group decision-making\n\n*   To help a group follow the model\
    \ rather than using different ways all at once by focusing on the six phases in\
    \ the problem-solving model, which also helps define the agenda. A group can more\
    \ easily agree by employing a process and facts to guide their judgments.\n\n\
    *   To successfully resolve issues.\n\n[Computer as a problem-solving tool](#contents.xhtml_sc3_7a)\n\
    \nComputers are information processing devices that transform information/data\
    \ according to prescribed rules, organized in an algorithm  implemented as a program.\n\
    \nAlgorithm: A precise, step-by-step method of doing a task in a finite amount\
    \ of time.\n\nHow to use the computer as a problem-solving tool?\n\nWe need to:\n\
    \n*   Analyze and describe the initial state and target stage of events with respect\
    \ to input data.\n\n*   Design an algorithm for transforming input into output\
    \ based on a chosen set of applicable operations.\n\n*   Implement the algorithm\
    \ as a program using a particular programming language.\n\n[Computers and computing\
    \ systems](#contents.xhtml_sc2_8a)\n\nComputers are devices capable of executing\
    \ programs that operate on data fed (input) to produce the desired output.\n\n\
    Computing systems are the hardware and software components that provide computing\
    \ services and functionality. These systems can range from simple devices, such\
    \ as a calculator, to complex systems, such as a supercomputer or cloud computing\
    \ infrastructure.\n\nHere are some common types of computing systems:\n\n*   Personal\
    \ computers: These are the most common computing systems used by individuals and\
    \ businesses. They typically consist of a desktop or laptop computer and a range\
    \ of peripheral devices, such as a keyboard, mouse, and monitor.\n\n*   Mobile\
    \ devices: These include smartphones and tablets, which have become increasingly\
    \ popular for personal and business use. Mobile devices typically have limited\
    \ processing power and storage capacity but are highly portable and offer a range\
    \ of features and capabilities.\n\n*   Servers: Servers are specialized computing\
    \ systems that provide services to users and other computers on a network. They\
    \ are used for web hosting, email hosting, database management, and file sharing.\n\
    \n*   Supercomputers: Supercomputers are high-performance computing systems for\
    \ complex scientific and engineering tasks, such as weather modeling, computational\
    \ fluid dynamics, and molecular modeling. They typically consist of many processors\
    \ and a significant amount of memory and storage.\n\n*   Embedded systems: Embedded\
    \ systems are specialized computing systems built into other devices, such as\
    \ cars, medical devices, and industrial equipment. They are designed to perform\
    \ specific tasks and are often used in real-time systems where speed and reliability\
    \ are essential.\n\n*   Cloud computing infrastructure: Cloud computing infrastructure\
    \ is a computing system that provides access to a range of computing resources,\
    \ such as storage, processing power, and applications, over the internet. Businesses\
    \ and individuals often use cloud computing to store and access data, run applications,\
    \ and perform other computing tasks without needing on-site hardware and software.\n\
    \nIn a computer (computing device), the input devices, such as the keyboard and\
    \ mouse, provide data to the computer. The output devices, such as the monitor\
    \ and speakers, display or produce output from the computer. The system bus connects\
    \ all the computer components, allowing them to communicate.\n\nThe Central Processing\
    \ Unit (CPU) is the brain of the computer, responsible for executing instructions\
    \ and performing calculations. The memory, which includes RAM, ROM, and cache,\
    \ provides temporary and permanent storage for data and instructions that the\
    \ CPU uses.\n\nFinally, the storage component, which includes hard disk drives\
    \ and other types of storage, provides permanent storage for data and programs\
    \ even when the computer is turned off. [Figure 1.1](#ch01.xhtml_fig1-1) depicts\
    \ the entire computer system housing all the above-mentioned components and functionality:\n\
    \n![](images/1.1.png)\n\nFigure 1.1: Computer system functionality\n\nA list of\
    \ steps that describe how a computer processes data and completes tasks can be\
    \ used to condense the fundamental scheme of operation of a computer. An overview\
    \ of a computer’s basic operations is as follows:"
