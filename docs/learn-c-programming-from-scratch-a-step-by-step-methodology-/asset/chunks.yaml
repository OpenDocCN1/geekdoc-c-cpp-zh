    \n![](images/fm1.png)\n\n# [CHAPTER 10C Graphics](#contents.xhtml_ch10a)\n\n[Introduction](#contents.xhtml_sc2_375a)\n\
    \nWelcome to the world of C graphics programming, where you will discover the\
    \ art of visualizing your code. In this chapter, we will delve into the exciting\
    \ realm of C graphics and explore how to bring life to your programs through colors,\
    \ animations, and shapes. From understanding the fundamentals of graphics to mastering\
    \ the techniques of input handling and shape creation, this chapter will equip\
    \ you with the skills to craft captivating visual experiences using the power\
    \ of C.\n\n[Structure](#contents.xhtml_sc2_376a)\n\nThe chapter covers the following\
    \ topics:\n\n*   C graphics\n*   Colors in C graphics programming\n*   Animations\
    \ and delay\n*   Input handling\n*   Text mode graphics function\n*   Program\
    \ to draw various shapes\n\n[Objectives](#contents.xhtml_sc2_377a)\n\nBy exploring\
    \ the fundamentals of graphics programming, you will grasp how it seamlessly integrates\
    \ with the broader scope of C programming. Delving into color manipulation, you\
    \ will learn how to breathe life into your visuals through a rich spectrum of\
    \ hues, adding depth and engagement to your graphical creations.\n\nAs you dive\
    \ into animations and delays, you will gain the ability to inject movement and\
    \ dynamic behavior into your graphical elements, creating visually compelling\
    \ and interactive programs. Mastering input handling techniques will equip you\
    \ to build user-friendly applications that seamlessly respond to user actions,\
    \ enhancing the overall user experience.\n\nFurthermore, you will harness the\
    \ power of text mode graphics functions, enabling you to design graphical interfaces\
    \ using text characters. This skill adds a layer of accessibility and creativity\
    \ to your programming toolkit. By developing a program to draw various shapes,\
    \ you will refine your understanding of shape creation and positioning, enhancing\
    \ your capacity to produce aesthetically pleasing graphics.\n\n[C Graphics](#contents.xhtml_sc2_378a)\n\
    \nCreating 2D and 3D graphics, visual effects, and animations in C requires the\
    \ use of graphics libraries and APIs. These libraries offer the tools and features\
    \ required to carry out operations, including establishing windows, illustrating\
    \ shapes and pictures, and managing user input. It is important to have a fundamental\
    \ grasp of computer graphics topics like geometry, transformations, and color\
    \ models to utilize these libraries.\n\nIn C, developing a visual model by adding\
    \ colors and other shapes is referred to as graphics. You may execute it in the\
    \ C terminal by importing the graphics.h library into the GCC compiler. It is\
    \ also possible to trace the circle, line, eclipse, and other geometric shapes.\
    \ The use of object-oriented programming is one of the key strategies in this\
    \ circumstance. There are no built-in debuggers in C since it relies on low-level\
    \ programs.\n\nWe need to utilize C programming and a few functions to implement\
    \ the visuals. Therefore, a window or canvas serves as the main component for\
    \ displaying the outcome. In the chapter, the DevC++ IDE is used for that since\
    \ we need a strong foundation to construct a useful drawing functionality.\n\n\
    We also require a particular package to work with graphics, which we can obtain\
    \ and install using WinBGIm.rawing techniques; alternatively, we might use the\
    \ API to produce visuals.\n\nGames, projects, animation, and other things may\
    \ all be created using graphics programming. It differs from standard C programming\
    \ as there are not as many errors or warnings in the program since complicated\
    \ reasoning is not used. In C, graphics programming enables us to draw curves,\
    \ paint an object with various hues and patterns by using mathematical functions,\
    \ and produce straightforward animations like balls that jump and cars that drive.\n\
    \nTo complete a task in graphics programming, you must use common library functions.\
    \ A function will carry out a certain task for us if you provide a specific set\
    \ of parameters. The function initgraph, employed to initialize the graphics mode;\
    \ since we are by default in the text-mode in C compilers, is the primary function\
    \ we need to know to kick-start graphics programming in C. We utilize the initgraph\
    \ function in our C application to set the graphics mode. Every graphics application\
    \ should include graphics.h header file since it contains the definition of the\
    \ initgraph () function.\n\n[C libraries for graphics](#contents.xhtml_sc3_379a)\n\
    \nAlthough C is a powerful programming language, it does not come with built-in\
    \ graphics capability. The essential methods and procedures to carry out activities\
    \ linked to graphics are provided by a number of third-party graphics libraries,\
    \ though. Several well-liked C graphics libraries are as follows:\n\n*   OpenGL:\
    \ High-performance rendering of 2D and 3D graphics is made possible by the robust\
    \ cross-platform OpenGL 3D graphics library. It offers a low-level, hardware-accelerated\
    \ interface and is frequently employed in simulations and game development.\n\
    *   Simple DirectMedia Layer: A multi-platform programming library called SDL\
    \ is intended to give users low-level access to hardware for the keyboard, mouse,\
    \ joystick, and graphics. Multimedia applications and the development of 2D games\
    \ use this library frequently.\n*   Allegretto: A game development toolkit called\
    \ Allegro offers routines for handling input, graphics, and sound across various\
    \ platforms.\n*   Simple and Fast Multimedia Library: A contemporary multimedia\
    \ library called SFML enables networking, 2D graphics, audio, and more. Both novice\
    \ and seasoned developers may use it because it is designed to be simple.\n\n\
    [Choosing the right graphics library](#contents.xhtml_sc3_380a)\n\nThe graphics\
    \ library you choose will rely on the needs and objectives of your project. OpenGL\
    \ may be the ideal choice if you are aiming for 3D visuals and quick rendering.\
    \ SDL or SFML may be appropriate for 2D games and multimedia applications because\
    \ to their simplicity and adaptability.\n\nYou must have a working grasp of C\
    \ programming as well as a fundamental understanding of data structures and algorithms\
    \ before beginning to program visuals.\n\n[Configuring the graphics environment](#contents.xhtml_sc3_381a)\n\
    \nLet us now talk about the graphics environment.\n\n[Initialization of the graphics\
    \ mode](#contents.xhtml_sc4_382a)\n\nWe must set up the appropriate parameters\
    \ and establish the graphics mode before we can draw on the screen. Depending\
    \ on the graphics library we use, the initialization procedure may change.\n\n\
    [Setting up Borland Graphics Interface for Windows](#contents.xhtml_sc4_383a)\n\
    \nThere are a few steps we must take to initialize the WinBGIm library (Borland\
    \ Graphics Interface for Windows) in C. For 2D graphics programming in C on Windows\
    \ systems, the WinBGIm library is a straightforward graphics library that is used.\
    \ Please keep in mind that this library may not function with more recent C compilers\
    \ because it is only compatible with compilers like Turbo C++ and Dev-C++.\n\n\
    [Get and set up WinBGIm](#contents.xhtml_sc4_384a)\n\nThe WinBGIm library must\
    \ first be downloaded and installed. The library may be found online by searching\
    \ for WinBGIm or BGI Graphics for Windows. Download the version that works with\
    \ your compiler.\n\n[Setting up your compiler](#contents.xhtml_sc4_385a)\n\nTypically,\
    \ WinBGIm comes pre-configured for Dev-C++ and Turbo C++. If you experience any\
    \ problems, be sure to set up your compiler to include the required directories\
    \ and correctly link the library.\n\n[Add the necessary header file](#contents.xhtml_sc4_386a)\n\
    \nInclude the graphics.h header file from the WinBGIm library in your C code.\
    \ All of the functions and declarations required for graphics programming are\
    \ present in this header file.\n\n#include <graphics.h>\n\n[Initialize the graphics\
    \ mode](#contents.xhtml_sc4_387a)\n\nBefore we can draw anything on the screen,\
    \ we need to initialize the graphics mode. The initgraph function from the graphics.h\
    \ header is used for this purpose.\n\nThe following code may be used to initialize\
    \ the graphics drivers on a machine using the graphics.h library’s initgraph ()\
    \ method:\n\nvoid initgraph (int *graphicsMode, char *driverDirectoryPath, int\
    \ *graphicsDriver);\n\nThis switches the system into graphics mode after initializing\
    \ the graphics system by loading the graphics driver that we pass as input to\
    \ the initgraph function. Additionally, it resets all of the visual settings to\
    \ the default values, including current location, color, palette, and more. The\
    \ notion of the initgraph function’s input parameters is provided by the following:\n\
    \n*   graphicsDriver: This (pointer) variable identifies the chosen graphics driver.\
    \ This command tells the compiler which graphics driver to use or allows the driver\
    \ to be automatically detected. All of our applications will make use of the graphics.h\
    \ library’s DETECT macro, which tells the compiler to detect the graphic’s driver\
    \ automatically.\n*   graphicsMode: This (pointer) variable identifies the desired\
    \ graphics mode. Initgraph will set *graphmode to the highest resolution offered\
    \ by the identified driver if *graphicsdriver is set to DETECT.driverDirectoryPath:\
    \ This parameter defines the location of the BGI files used to store graphics\
    \ driver files. But if the path is left blank, it will look for driver files in\
    \ the current working directory.\n\nIn order to use the Turbo C compiler, we must\
    \ modify the path of the BGI directory in graphics programs.\n\nIt is good practice\
    \ to use the closegraph () method at the conclusion of our graphics application\
    \ to unload the graphics drivers and return the screen to text mode.\n\n[Drawing\
    \ on the screen](#contents.xhtml_sc4_388a)\n\nOnce the initialization of graphics\
    \ mode is done, we can use various functions provided by the WinBGIm library to\
    \ draw various shapes like lines, shapes, points, and even text on the screen.\n\
    \nExample:\n\n#include <graphics.h>\n\nint main () {\n\nint gdr, gmode;\n\ngd\
    \ = DETECT;\n\ninitgraph (&gdr, &gmode, \"C:\\\\BGI\");\n\n// Draw a line\n\n\
    line (100, 100, 300, 200);\n\n// Draw a rectangle\n\nrectangle (150, 250, 250,\
    \ 350);\n\ngetch (); // Wait for a key press before closing the window\n\nclosegraph\
    \ ();\n\nreturn (0);\n\n}\n\n[Closing the graphics mode](#contents.xhtml_sc4_389a)\n\
    \nWhen your graphics activities are finished, do not forget to free system resources\
    \ by closing the graphics mode using the closegraph function.\n\nAfter completing\
    \ these steps, you ought to have successfully initialized WinBGIm in C and begun\
    \ utilizing the library to create straightforward graphics programs for the Windows\
    \ platform. Please remember that WinBGIm is out of date and might not be supported\
    \ by contemporary compilers. You might want to think about utilizing alternative\
    \ libraries like SDL or OpenGL, which are cross-platform and actively updated,\
    \ for more up-to-date graphics development in C.\n\nOptionally, we can set up\
    \ other Graphics library modes like SDL.\n\n[Setting up graphics mode using SDL](#contents.xhtml_sc4_390a)\n\
    \n#include <SDL2/SDL.h>\n\nint main () {\n\n// Initialize SDL\n\nif (SDL_Init(SDL_INIT_VIDEO)\
    \ != 0) {\n\nprintf (\"SDL initialization Error: %s\\n\", SDL_GetError());\n\n\
    return 1;\n\n}\n\n// do the required operations…\n\nSDL_Quit();\n\nreturn (0);\n\
    \n}\n\n[Understanding coordinates and resolution](#contents.xhtml_sc3_391a)\n\n\
    Coordinates and resolution are two important concepts when dealing with graphics\
    \ programming. The positive x-axis and the positive y-axis both normally extend\
    \ to the right and downward, respectively, from the origin (0,0) at the top-left\
    \ corner of the screen. The amount of horizontally and vertically accessible pixels\
    \ depends on the screen’s resolution. A resolution of 800x600, for instance, indicates\
    \ that there are 800 pixels in width and 600 pixels in height.\n\n[Basics of color](#contents.xhtml_sc4_392a)\n\
    \nColors on a screen are typically made up of combinations of red, green, and\
    \ blue elements. To assign a specific color, the setcolor (number) function can\
    \ be used, where the number corresponds to a color code. For instance, the color\
    \ yellow is represented by the number 14. Applying shading and coloring can enhance\
    \ the visual appeal of an image.\n\nThe Red, Green, and Blue (RGB) model is widely\
    \ used in graphics programming to represent colors. The intensity of each color\
    \ in the output can range from 0 to 255 for each color component. Pure red, green,\
    \ and blue, for instance, are represented by (255, 0, 0), (0, 255, 0), and (0,\
    \ 0, 255), respectively. You may produce a huge variety of colors by combining\
    \ various RGB values.\n\nIn C graphics programming, we can use various functions\
    \ to draw shapes on the screen, besides adding text wherever needed.\n\n[Operations\
    \ for simple drawings](#contents.xhtml_sc3_393a)\n\nAfter setting up our graphics\
    \ environment, let us examine some fundamental drawing procedures.\n\nThe majority\
    \ of graphics libraries provide routines for drawing dots, lines, and other forms\
    \ on the screen.\n\nWinBGIm provides various functions to draw basic graphics\
    \ primitives. Here are some essential drawing functions:\n\n*   line (): line\
    \ function is used to draw a line from a coordinate point (x1,y1) to another coordinate\
    \ point (x2,y2) that is:\n\n    void line (int x1, int y1, int x2, int y2);\n\n\
    \    where:\n\n    (x1, y1) and (x2, y2) are the starting and end points of the\
    \ line.\n\n*   lineto (): This function draws a line from current position (CP)\
    \ to a specified point.\n\n    void lineto (int x, int y);\n\n    where:\n\n \
    \   (x, y) is the point up to which the line would be drawn.\n\n*   circle ():\
    \ circle function is used to draw a circle.\n\n    void circle (int x, int y,\
    \ int radius);\n\n    where:\n\n    x and y represent the coordinates of the central\
    \ point; radius specifies the radius of the circle. The code given draws a circle.\n\
    \n*   ellipse (): ellipse is used to draw an ellipse.\n\n    void ellipse (int\
    \ x, int y, int a, int b, int c, int d);\n\n    We must specify the ellipse’s\
    \ center coordinates (x, y) and semi-axis lengths (a, b) to draw it. Here is an\
    \ example program that uses the graphics.h library’s ellipse function to create\
    \ an ellipse:\n\n    ellipse (100, 100, 0, 360, 50, 80);\n\n    This code calls\
    \ the ellipse function to draw an ellipse with center at (100, 100) and semi-axis\
    \ lengths 50, 80.\n\n*   rectangle: Draws a rectangle with the specified top-left\
    \ and bottom-right corners.\n\n    void rectangle (int left, int top, int right,\
    \ int bottom);\n\n    where:\n\n    (left, top) represents coordinates of the\
    \ top-left corner point while (right, bottom) represents coordinates of the bottom-right\
    \ corner point.\n\n*   bar: Draws a filled rectangle (bar) with the specified\
    \ top-left and bottom-right corners.\n\n    void bar (int left, int top, int right,\
    \ int bottom);\n\n    where:\n\n    (left, top) represents coordinates of the\
    \ top-left corner point while (right, bottom) represents coordinates of the bottom-right\
    \ corner point.\n\n*   arc: Draws a circular arc with the specified center, start\
    \ angle, and end angle.\n\n    void arc (int x, int y, int s_angle, int e_angle,\
    \ int r);\n\n    where:\n\n    (x, y) represent the coordinates of the center\
    \ point of the circle, s_angle and e_angle are the start and end angles, respectively,\
    \ and r represents radius.\n\n*   graphresult (): It is a graphical function that\
    \ returns the value 0 if the graphics are detected correctly, and the driver is\
    \ correctly initialized to the correct graphics mode otherwise, it returns some\
    \ error code than 0.\n\n    int graphresult (void);\n\nIt returns the error code\
    \ for the last graphics operation that reported any of the following errors, as\
    \ shown in [Table 10.1](#ch10.xhtml_tab10-1):\n\n| Error code | String constant\
    \ | Error message |\n| --- | --- | --- |\n| 0 | grOk | - |\n| -1 | grNoInitGraph\
    \ | Graphics not installed (use initgraph) |\n| -2 | grNotDetected | Graphics\
    \ hardware missing |\n| -3 | grFileNotFound | Device driver file missing |\n|\
    \ -4 | grInvalidDriver | Invalid device driver file |\n| -5 | grNoLoadMem | Insufficient\
    \ memory to load driver |\n| -6 | grNoScanMem | Insufficient in scan fill |\n\
    | -7 | grNoFloodMem | Insufficient in flood fill |\n| -8 | grFontNotFound | Font\
    \ file missing |\n| -9 | grNoFontMem | Insufficient memory to load font |\n| -10\
    \ | grInvalidMode | graphics mode Invalid for selected driver |\n| -11 | grError\
    \ | Graphics error |\n| -12 | grIOerror | Graphics I/O error |\n| -13 | grInvalidFont\
    \ | font file invalid |\n| -14 | grInvalidFontNum | font number invalid |\n| -15\
    \ | grInvalidDeviceNum | device number invalid |\n| -18 | grInvalidVersion | version\
    \ number invalid |\n\nTable 10.1: graphresult error codes\n\nNote: We should store\
    \ the value of graphresult into a variable and then test it as the variable maintained\
    \ by graphresult is reset to 0 after graphresult has been invoked.\n\n*   grapherrormsg:\
    \ This function returns the message string corresponding to the errorcode returned\
    \ by the graphresult () function.\n\n    char * grapherrormsg (int errcode);\n\
    \n    Where:\n\n    errcode is the Error-code\n\n    The function returns a pointer\
    \ to the error message string associated with errorcode, the value returned by\
    \ graphresult.\n\n*   cleardevice (): This function is used to clear the screen\
    \ in the graphical mode as clrscr () in text mode.\n\n    void cleardevice ();\n\
    \n    We can use various graphical functions available in the C library to draw\
    \ geometrical objects.\n\n*   moveto (): It is used to move cursor in display\
    \ screen to the specified co-ordinates by the value x and y.\n\n    void moveto\
    \ (int x, int y);\n\n    Where:\n\n    (x, y) represent new coordinates.\n\n*\
    \   outtext (): Prints the text string in the current position of screen.\n\n\
    \    void outtext (char *);\n\n    Where:\n\n    (char * represents the string\
    \ to be displayed on screen.\n\n    Example:\n\n    outtext (\"Sample text\")\n\
    \n    would print Sample text to the output.\n\n*   Outtextxy (): Function display\
    \ text or string at a specified point (x,y) on the screen.\n\n    void outtextxy\
    \ (int x, int y, char *string);\n\n    Where:\n\n    x, y are coordinates of the\
    \ point and third argument contains the string to be displayed.\n\n*   drawpoly\
    \ (): Function is used to draw polygons like triangle, rectangle, pentagon and\
    \ more.\n\n    void drawpoly (int n, int *polypoints);\n\n    where:\n\n    num\
    \ indicates (n + 1) number of points, n is the number of vertices in a polygon.\
    \ polypoints refers to a sequence of (n*2) integers.\n\nSome functions add beauty\
    \ to presentation of our graphics programs:\n\n*   blink (): Helps to make a character\
    \ blink on the screen window.\n*   delay (): It pauses the execution of the program\
    \ for some period of time.\n\n    void delay (unsigned int)\n\n    For example:\n\
    \n    void delay (2000);\n\nThis would halt execution of the program for 2 seconds\
    \ (2000 milliseconds).\n\nNote: delay () is not defined in graphics.h header file\
    \ (defined in dos.h). We can use it in text mode as well as graphics mode\n\n\
    *   getmaxx (): Returns the maximum X coordinate for the current graphics mode\
    \ and driver.\n\n    int getmaxx ();\n\n*   getmaxy (): Returns the maximum Y\
    \ coordinate for the current graphics mode and driver.\n\n    int getmaxy ();\n\
    \n*   getx (): function returns the X coordinate of current position.\n\n    int\
    \ getx ();\n\n*   gety (): function returns the X coordinate of current position.\n\
    \n    int gety ();\n\nNote: graphics.h is a header file in C that provides access\
    \ to a graphics library. We need to install the graphics library on your system\
    \ before using it.\n\n[Colors in C graphics programming](#contents.xhtml_sc2_394a)\n\
    \nIn C graphics programming, colors can be specified using RGB values or color\
    \ constants. To set a color in C graphics, you can use the setcolor function from\
    \ the graphics library. Some functions, along with their uses are discussed as\
    \ follows:\n\n*   putpixel (): This function plots a pixel of specified color\
    \ at coordinate (x, y).\n\n    putpixel (int x, int y, int color);\n\n    For\
    \ example: to draw a RED color pixel at (5, 40) we will write putpixel (5, 50,\
    \ RED);\n\nIn C programs, putpixel function can be used to draw circles, lines,\
    \ and ellipses using various algorithms.\n\n*   setcolor (): This function sets\
    \ the current drawing color.\n\n    void setcolor (int color);\n\nFor example:\
    \ void setcolor (RED) sets the current drawing color to RED, where RED is a color\
    \ constant defined in the graphics library.\n\n*   setgbcolor (): This function\
    \ is used to set the current background color.\n\n    void setbgcolor (int color);\n\
    \nFor example, setbgcolor (0) would set the current background color to black.\n\
    \nsetbgcolor (255, 0, 0);\n\nAs RGB values of (255, 0, 0) denote the strongest\
    \ red and no green or blue, this changes the current background color to pure\
    \ red.\n\nThe 16 colors that C Graphics defines can be used to modify the background,\
    \ text, and closed form colors as well as the current drawing color. Either color\
    \ constants like setcolor (RED) or their equivalent integer codes like setcolor\
    \ (4) can be used to specify a color. The color code is listed below in ascending\
    \ order, as shown in [Table 10.2](#ch10.xhtml_tab10-2):\n\n| Color | Code | Can\
    \ it be used as background? | Can it be used as a foreground? |\n| BLACK | 0 |\
    \ Yes | Yes |\n| BLUE | 1 | Yes | Yes |\n| GREEN | 2 | Yes | Yes |\n| CYAN | 3\
    \ | Yes | Yes |\n| RED | 4 | Yes | Yes |\n| LIGHTBLUE | 9 | No | Yes |\n| LIGHTGREEN\
    \ | 10 | No | Yes |\n| LIGHTCYAN | 11 | No | Yes |\n| LIGHTRED | 12 | No | Yes\
    \ |\n| MAGENTA | 5 | Yes | Yes |\n| BROWN | 6 | Yes | Yes |\n| LIGHTGRAY | 7 |\
    \ Yes | Yes |\n| DARKGRAY | 8 | No | Yes |\n| WHITE | 15 | No | Yes |\n| BLINK\
    \ | 128 | No | * |\n| LIGHTMAGENTA | 13 | No | Yes |\n| YELLOW | 14 | No | Yes\
    \ |\n\nTable 10.2: Color codes\n\nFor displaying blinking characters in text mode,\
    \ we add BLINK (Defined in conio.h) to the foreground color.\n\n*   floodfill\
    \ (): To fill a shape, use this function. The area is filled using the current\
    \ fill pattern and fill color. (X, Y) is any point on the screen; if (X, Y) is\
    \ inside a form’s boundary, that shape will be filled; otherwise, it will be filled\
    \ outside. Use setfillstyle to alter the fill color and pattern. The following\
    \ code first creates a circle before filling it.\n\nvoid floodfill (int x, int\
    \ y, int border);\n\n[C Program on graphics colors](#contents.xhtml_sc3_395a)\n\
    \nThe following code is a C program on graphics colors:\n\n#include<graphics.h>\n\
    \n#include<stdio.h>\n\n#include<conio.h>\n\nint main () {\n\nint gd = DETECT,\
    \ gm;\n\ninitgraph (&gd, &gm, \"C:\\\\TURBOC3\\\\BGI\");\n\nsetrgbcolor (255,\
    \ 0, 0); // set background color\n\nsetcolor (BLUE); //Set forecolor and draw\
    \ what you want to draw in BLUE color\n\nclosegraph ();\n\nreturn (0);\n\n}\n\n\
    Note: Numerous Borland compilers for the DOS operating system have incorporated\
    \ the Borland Graphics Interface (BGI) graphics library since 1987\\. The library\
    \ loads vector fonts (*.CHR) and graphic drivers (*.BGI) from disc to provide\
    \ programmers with device-independent graphics capability. Using graphics.lib/graphics.h\
    \ and BGI in C/C++.\n\n[Input handling](#contents.xhtml_sc2_396a)\n\nWinBGIm also\
    \ provides functions to manage mouse and keyboard input. The functions used are\
    \ discussed as follows:\n\n*   ismouseclick (): This function checks if a mouse\
    \ click has occurred.\n\n    int ismouseclick (int kind);\n\n*   getmouseclick\
    \ (): This function gets the coordinates and button status of the last mouse click.\n\
    \n    void getmouseclick (int kind, int *x, int *y);\n\n*   kbhit (): This function\
    \ checks if a keyboard key has been pressed.\n\n    int kbhit ();\n\n*   getch\
    \ (): This function waits for a keyboard key to be pressed and returns the key’s\
    \ ASCII value.\n\n    char getch ();\n\n[Animations and delay](#contents.xhtml_sc2_397a)\n\
    \nWe can use the delay function to introduce a pause between successive frames,\
    \ to create effects of animations in C Graphics.\n\n*   delay (): It pauses the\
    \ execution of the program for some period of time.\n\n    void delay (unsigned\
    \ int)\n\n[Double buffering](#contents.xhtml_sc3_398a)\n\nDouble buffering helps\
    \ to decrease animation flicker. It is necessary to build two graphics buffers:\
    \ One for off-screen rendering and the other for on-screen display. The getbuffer\
    \ and putbuffer methods may be used for this.\n\nExample:\n\nFor simple animation:\n\
    \n#include <stdio.h>\n\n#include <graphics.h>\n\nint main () {\n\nint gd = DETECT,\
    \ gm;\n\ninitgraph (&gd, &gm, \"\");\n\nint x = 50, y = 50;\n\nint radius = 30;\n\
    \nint dx = 5, dy = 3;\n\nwhile (!kbhit()) {\n\ncleardevice();\n\nsetcolor(YELLOW);\n\
    \ncircle(x, y, radius);\n\nfloodfill(x, y, YELLOW);\n\nx += dx; // Update the\
    \ circle’s position\n\ny += dy;\n\nif (x <= radius || x >= getmaxx() - radius)\
    \ // Bounce off the walls\n\ndx = -dx;\n\nif (y <= radius || y >= getmaxy() -\
    \ radius)\n\ndy = -dy;\n\ndelay (50);\n\n}\n\n}\n\n[Text mode graphics functions](#contents.xhtml_sc2_399a)\n\
    \nThese graphics functions help place text in output/ area of the screen. These\
    \ functions are defined in the header file <conio.h>. Some of those text mode\
    \ graphics functions are:\n\n*   window (): It sets particular area on the output\
    \ screen and displays the output text on that area.\n\n    void window (a, b,\
    \ c, d);\n\nThe co-ordinates (a, b) represents the upper left corner of window\
    \ and (c, d) is the lower right corner of the display window.\n\n*   clrscr ():\
    \ It is used to clear the screen and locates the curser at the beginning of the\
    \ screen.\n\n    void clrscr ();\n\n*   gotoxy (): It moves the curser at specified\
    \ co-ordinate position.\n\n    void gotoxy (x, y);\n\n    It places cursor at\
    \ coordinate (x, y).\n\n*   putch (): It writes a character given to function\
    \ to the user defined area of window.\n\n    void putch ('i');\n\n    It writes\
    \ character 'i' on the current cursor position.\n\n*   cputs (): It writes a string\
    \ to the user defined window screen.\n\n    void cputs (\"Zain\");\n\nIt prints\
    \ Zain on the current cursor position.\n\n*   Settextstyle ():\n\nTo control the\
    \ text output size, direction, and font for graphics mode, utilize ‘settextstyle’\
    \ function. The text in graphics window may be made to look anyway we like. Here\
    \ is how to use the ‘settextstyle’ function in syntax:\n\nvoid settextstyle (int\
    \ font, int direction, int charsize);\n\nWhere:\n\nfont: Specifies the font for\
    \ the text. which can take any of the following constants:\n\n#define DEFAULT_FONT\
    \ 0 // Default font (8x8)\n\n#define TRIPLEX_FONT 1 // Triplex font\n\n#define\
    \ SMALL_FONT 2 // Small font (6x8)\n\n#define SANS_SERIF_FONT 3 // Sans-serif\
    \ font\n\n#define GOTHIC_FONT 4 // Gothic font\n\nWe can through use user-defined\
    \ fonts with values greater than 4.\n\ndirection: Specifies the direction of the\
    \ text. It can take one of the following constants:\n\n#define HORIZ_DIR 0 //\
    \ Horizontal text (left-to-right)\n\n#define VERT_DIR 1 // Vertical text (bottom-to-top)\n\
    \n#define USER_CHAR_SIZE 2 // Text direction based on charsize\n\nWhen using USER_CHAR_SIZE,\
    \ the text will be displayed based on the character size (charsize) we provide.\n\
    \n*   charsize: Specifies the size of the characters in the text. It represents\
    \ the height of the characters in pixels.\n\nFor example:\n\nsettextstyle (TRIPLEX_FONT,\
    \ HORIZ_DIR, 3);\n\n// Set text style to Triplex font, horizontal direction, and\
    \ character size of 3\n\nRemember that the font styles you may use may change\
    \ depending on your compiler and the WinBGIm library version you are using. Additionally,\
    \ the operating system and graphics resolution may have an impact on the text’s\
    \ size and style.\n\n[C graphics program to draw shapes](#contents.xhtml_sc2_400a)\n\
    \nThe following is a C graphics program to draw different shapes:\n\n#include<graphics.h>\n\
    \n#include<conio.h>\n\nint main () {\n\nint gd = DETECT, gm;\n\n int arr [] =\
    \ {320, 150, 400, 250, 250, 350, 320, 150};\n\n// for drawpoly ()\n\n/* initialization\
    \ of graphic mode */\n\ninitgraph (&gd, &gm, \"C:\\\\TC\\\\BGI\");\n\nsetcolor\
    \ (BLUE); //Set the color BLUE and draw a line\n\narc(100, 100, 0, 135, 50); //arc\n\
    \nline (100,100,200, 200); //Line\n\nrectangle (100,100,200,200); //Rectangle\n\
    \ncircle (50,50,50); // Circle\n\ndrawpoly (4, arr); // polygon (Triangle) 4 points/\
    \ 3 vertices in this example\n\nreturn (0);\n\nclosegraph ();\n\n}\n\n*   Drawing\
    \ multiple concentric circles\n\n    #include <graphics.h>\n\n    int main ()\
    \ {\n\n    int gd = DETECT, gm;\n\n    int x = 300, y = 200, rad;\n\n    initgraph\
    \ (&gd, &gm, \"\");\n\n    for (rad = 20; rad <= 120; rad = rad + 20)\n\n    circle\
    \ (x, y, rad);\n\n    getche ();\n\n    closegraph ();\n\n    return (0);\n\n\
    \    }\n\n#include <graphics.h>\n\nint main () {\n\nint gd = DETECT, gm;\n\ninitgraph\
    \ (&gd, &gm, \"C:\\\\TC\\\\BGI\");\n\nouttextxy (100, 100, \"Hello World\");\n\
    \nreturn (0);\n\nclosegraph ();\n\n}\n\n*   Setcolor (): In Turbo Graphics a number\
    \ is assigned to each color. There are 16 colors which we can use. To put it in\
    \ a more precise way, the number of available colors depends on current graphics\
    \ mode and driver. For Example: - BLACK is assigned 0, RED is assigned 4 and so\
    \ on. setcolor function is used to change the current drawing color, for example:\
    \ setcolor (BLACK) or setcolor (0) changes the current drawing color to BLACK.\n\
    \nNote: The default drawing color is WHITE.\n\n[Table 10.3](#ch10.xhtml_tab10-3)\
    \ depicts different color macros.\n\n| COLOR MACRO | INTEGER Assigned |\n| ---\
    \ | --- |\n| WHITE | 15 |\n| YELLOW | 14 |\n| LIGHTMAGENTA | 13 |\n| LIGHTRED\
    \ | 12 |\n| LIGHTCYAN | 11 |\n| LIGHTGREEN | 10 |\n| LIGHTBLUE | 9 |\n| DARKGRAY\
    \ | 8 |\n| LIGHTGRAY | 7 |\n| BROWN | 6 |\n| MAGENTA | 5 |\n| RED | 4 |\n| CYAN\
    \ | 3 |\n| GREEN | 2 |\n| BLUE | 1 |\n| BLACK | 0 |\n\nTable 10.3: Color Macros\n\
    \n*   Setbkcolor (): Function sets the background color,\n\n    setbkcolor (int\
    \ color_code);\n\nWhere:\n\ncolor_code: Specifies the color code of the background\
    \ color\n\nFor example, setbkcolor (BLUE) changes the current background color\
