    Figure 1.21: Flowchart to find the greatest of 3 numbers


    *   Finite and infinite loop: In looping statements, a finite loop is one in which
    a series of statements is run n times (a predetermined number of times). The term
    infinite loop refers to a situation in which a collection of assertions is repeated
    indefinitely without reaching a conclusion. For instance, if we do not increase
    the value of the index, we will have an unending (infinite) loop.


    ![](images/1.22.png)


    Figure 1.22: Flowchart to describe an infinite loop


    An infinite loop is a series of assertions that are repeated endlessly.


    In the above flowchart, the value of I is not incremented, so it will create an
    endless loop. This is also called an infinite loop.


