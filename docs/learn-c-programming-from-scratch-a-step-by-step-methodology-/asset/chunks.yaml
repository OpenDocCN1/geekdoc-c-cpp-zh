    C.


    [GCC](#contents.xhtml_sc4_45a)


    The free software foundation created the GCC compiler, often used using a command
    line interface and based on Linux. If we use a UNIX or Linux variation, it is
    probably already installed on our machine because it is frequently packed and
    installed with Linux installations. We can invoke GCC on a source code file by
    typing gcc filename.


    The default executable output of GCC is a.out, which can be executed by typing
    ./a.out. It is also permissible to specify a name for the executable file on the
    command line by writing -o outputfile, as shown below:


    gcc filename -o outputfile


    Again,./outputfile may be used to execute your program. (The ./ ensures the program
    is executed for the current working directory). You must specifically ask it to
    connect with that library if we need to utilize functions from the math library
    (often, math.h functions like sin or sqrt).


