    \n![](images/fm1.png)\n\n# [CHAPTER 8File Handling](#contents.xhtml_ch08a)\n\n\
    [Introduction](#contents.xhtml_sc2_261a)\n\nIn this chapter on file handling in\
    \ C, we will delve into the essential concepts and techniques for managing data\
    \ in files. We will begin by exploring the data hierarchy, and understanding the\
    \ building blocks of data organization from bits to data marts and data warehouses.\n\
    \nIn the subsequent sections, we will focus on files, understanding their significance,\
    \ and exploring different types. Then, we will dive into binary file handling\
    \ and uncover the intricacies of working with text files in C. You will also gain\
    \ insights into file modes, file operations, and various file access methods,\
    \ including sequential, random, direct, and stream file access.\n\nError handling\
    \ is a critical aspect of file handling, and we will discuss how to manage errors\
    \ efficiently, utilizing the global variable errno. You will also find a practical\
    \ example of errno usage.\n\nLet us embark on this journey to master the art of\
    \ file handling in C!\n\n[Structure](#contents.xhtml_sc2_262a)\n\nThe chapter\
    \ will discuss the following content:\n\n*   Introducing file handling\n*   Data\
    \ hierarchy\n*   Types of files\n*   Binary and text file in handling in C\n*\
    \   File modes\n*   File operations\n*   Random access files\n*   Direct file\
    \ access\n*   Stream file access\n*   Error handling in files\n*   File descriptors\n\
    \n[Objectives](#contents.xhtml_sc2_263a)\n\nIn this chapter, we will explore file\
    \ handling in C, an essential skill for working with data storage and retrieval.\
    \ You will learn about the data hierarchy, file types, and their significance\
    \ in programming. We will cover binary and text file handling, including file\
    \ modes, operations, and access methods. Additionally, we will focus on error-handling\
    \ techniques using the errno global variable. By the end of this chapter, you\
    \ will be proficient in managing data through files and equipped to build robust\
    \ file-based applications in C.\n\n[Introducing file handling](#contents.xhtml_sc2_264a)\n\
    \nProgramming tasks that include reading data from or writing data to files fall\
    \ under the category of file handling ([Figure 8.1](#ch08.xhtml_fig8-1)). It enables\
    \ better orderly and permanent information storage and retrieval for applications.\
    \ For many operations, including data storage, data processing, configuration\
    \ management, and others, file handling is a must. Here are a few typical programming\
    \ file-handling operations, as shown in [Figure 8.1](#ch08.xhtml_fig8-1):\n\n\
    ![](images/8.1.png)\n\nFigure 8.1: File read and write operations\n\nProgramming\
    \ languages like Python, C/C++, Java, Ruby, and so on provide the service of file\
    \ management. Language differences may affect the mechanics of file processing,\
    \ but the fundamental ideas are the same. You prevent data loss and security risks\
    \ and make sure you handle files appropriately and responsibly at all times.\n\
    \n[Data hierarchy - layers of data](#contents.xhtml_sc3_265a)\n\nA conceptual\
    \ framework called data hierarchy divides data into many levels/ layers based\
    \ on how complicated they are and how they relate. It offers an organized method\
    \ for managing and analyzing data, enabling companies and organizations to manage\
    \ and use their data resources efficiently. The data level hierarchy is explored\
    \ below, from the lowest to the highest, while stressing their unique qualities\
    \ and importance. The data structure is explained in [Figure 8.2](#ch08.xhtml_fig8-2):\n\
    \n![](images/8.2.png)\n\nFigure 8.2: Bit, Nibble, and Byte representation\n\n\
    [Bit](#contents.xhtml_sc4_266a)\n\nThe bit, which stands for the fundamental computing\
    \ unit of information, is located at the lowest level of the data structure. Binary\
    \ data, represented by the values 0 or 1, may be stored in a bit. It forms the\
    \ framework for data representation and processing and acts as the foundation\
    \ for all other data kinds.\n\n[Byte](#contents.xhtml_sc4_267a)\n\nThe smallest\
    \ addressable storage unit in most computer systems, a byte, is made up of 8 bits.\
    \ Bytes are frequently employed when representing characters like letters, numbers,\
    \ and symbols using different character encoding methods like ASCII or Unicode.\n\
    \n[Field](#contents.xhtml_sc4_268a)\n\nIn a database or dataset, field is a group\
    \ of bytes that denotes a particular property or feature of an item. Data items\
    \ of a same sort, such as names, addresses, or dates, are fields and records stored\
    \ and organized using fields. They are the fundamental parts of records and lay\
    \ the groundwork for storing, organizing, and retrieving data, as shown in [Figure\
    \ 8.3](#ch08.xhtml_fig8-3):\n\n![](images/8.3.png)\n\nFigure 8.3: Data fields\
    \ in (Employee) table\n\n[Record](#contents.xhtml_sc4_269a)\n\nA record is a group\
    \ of connected fields that together describe all of the information about a certain\
    \ item or object. For instance, a record in a client database can include fields\
    \ like name, address, phone number, and email. Structured data may be stored and\
    \ retrieved from records, allowing for effective data processing and analysis.\n\
    \n[File](#contents.xhtml_sc4_270a)\n\nA file is a logical container for a group\
    \ of associated records. It reflects a broader collection of data and is frequently\
    \ linked to a particular data object or application. Within a computer system,\
    \ files are used to organize and manage data, enabling effective data storage,\
    \ retrieval, and modification of data in an efficient way, as shown in [Figure\
    \ 8.4](#ch08.xhtml_fig8-4):\n\n![](images/8.4.png)\n\nFigure 8.4: Files and records\n\
    \n[Database](#contents.xhtml_sc4_271a)\n\nA database is a structured group of\
    \ linked and arranged files that enables effective data management. Large amounts\
    \ of data may be stored, retrieved, and managed using this single repository.\
    \ Data integrity, security, and concurrency control are built into databases to\
    \ support them, assuring the correctness and dependability of the information\
    \ stored.\n\n[Data warehouses](#contents.xhtml_sc4_272a)\n\nData warehouses are\
    \ specialized databases that combine data from multiple sources located throughout\
    \ a business. This system offers a consolidated picture of the organization’s\
    \ data and is geared for analytical processing. Businesses may obtain insights\
    \ and make wise strategic decisions using data warehouses for reporting, mining,\
    \ and decision support.\n\n[Data mart](#contents.xhtml_sc4_273a)\n\nA data mart\
    \ is a data warehouse division specializing in one particular field, such as sales,\
    \ marketing, or finance. It contains a subset of information pertinent to a certain\
    \ division or user group, enabling more specialized analysis and reporting. Comparatively\
    \ speaking, data marts offer a more user-friendly and effective means of accessing\
    \ and analyzing data than the larger data warehouse.\n\nFrom the smallest unit\
    \ of data, the bit, to the most complete data warehouses and data marts, the data\
    \ hierarchy offers a systematic framework for organizing and managing data. Organizations\
    \ may get useful insights and make wise decisions thanks to the effective storage,\
    \ retrieval, and analysis of data made possible by each level of the hierarchy.\
    \ Anyone involved in data management must understand the data hierarchy because\
    \ it lays the groundwork for effective data handling and usage in today’s data-driven\
    \ world.\n\n[Files](#contents.xhtml_sc4_274a)\n\nA key component of C programming\
    \ is file access, which enables the manipulation of data contained in files. Reading\
    \ from and writing to files, modifying file data, and controlling file operations\
    \ are all part of C file programming. An understanding of file programming is\
    \ necessary for activities like reading configuration files, analyzing sizable\
    \ datasets, and persistently storing program data. This chapter on file programming\
    \ in C covers in-depth information on file handling, opening and closing files,\
    \ reading and writing data, and error handling.\n\n[Importance of files](#contents.xhtml_sc2_275a)\n\
    \nFile Input and Output (I/O) is needed in C programming because it allows a program\
    \ to store and retrieve data on a permanent storage device, such as a hard drive\
    \ or a USB drive. This allows the data to persist even after the program has terminated\
    \ and can be used to save the state of the program or to load data that the program\
    \ needs to operate on.\n\nFile I/O also allows a program to read and write data\
    \ from/to external sources such as text files, images, and other multimedia files.\
    \ This makes it possible to work with a wide range of data types and to share\
    \ data with other programs or systems.\n\nAdditionally, file I/O is also useful\
    \ for logging and debugging, as it allows a program to write information about\
    \ its execution to a file for later analysis.\n\nIn C programming, the entire\
    \ data is lost when a program is ended. It takes a lot of time to enter all the\
    \ data if we want to keep a lot of it. However, if a file is generated, a few\
    \ commands can be used to retrieve this data. In C programming, file I/O is performed\
    \ using a set of functions from the standard library.\n\nThe file access mechanism,\
    \ which controls how files are saved, arranged, and accessed by applications and\
    \ users, is a crucial part of an operating system.\n\nThe following examples illustrate\
    \ the significance of the file access mechanism in operating systems:\n\n*   Efficiency:\
    \ A computer system’s efficiency may be greatly impacted by the file access technique\
    \ since it affects how quickly files can be accessed and how rapidly data can\
    \ be written to or retrieved from storage.\n*   Data integrity: By ensuring that\
    \ data is appropriately saved and retrieved, the file access technique protects\
    \ the integrity of the data kept in files.\n*   Security: By restricting who may\
    \ read, change, or delete files, the file access technique can help protect the\
    \ security of files.\n*   Resource management: The file access mechanism is crucial\
    \ to resource management since it aids the operating system in allocating resources\
    \ and managing disc space.\n\n[File modes](#contents.xhtml_sc2_276a)\n\nIn C programming,\
    \ file modes determine the intended operation on a file when opening it. The file\
    \ mode is specified as a string parameter in the fopen() function, indicating\
    \ whether the file will be opened for reading, writing, or appending, among other\
    \ options. Here are the commonly used file modes in C:\n\n*   Read mode (r): Read-only\
    \ mode opens the file. The fopen() function must be used; otherwise, it will fail\
    \ and return NULL. You can read data from the file in this mode but not change\
    \ its contents.\n*   Write mode (w): Opens the file for writing in the write mode.\
    \ The file’s contents are truncated (cleared) if it already exists. If the file\
    \ does not already exist, one is created. This mode is used to write data to a\
    \ file, overwriting any previously stored information.\n*   Append mode (a): Starts\
    \ the document in writing mode with the cursor at the end of the document. New\
    \ information is added to the existing file’s content if it already exists. If\
    \ the file does not already exist, one is created. Use this mode to add data to\
    \ a file’s end without replacing any already present information.\n*   Read-only\
    \ and read-write (r+): Opens the file in read-only and read-write modes. The fopen()\
    \ method will not work if the file does not already exist. You can read and edit\
    \ the file’s contents using this mode. The very first file location is at the\
    \ start.\n*   Read and write mode (w+ or truncate file mode): Allows both reading\
    \ and writing to be done on the same file. The file’s contents are truncated (cleared)\
    \ if it already exists. If the file does not already exist, one is created. Start\
    \ with an empty file and use this mode to read from and write to it.\n*   Append\
    \ mode (a+) read and append mode: It opens the file for both reading and writing\
    \ with the cursor at the end of the file. New information is added to the existing\
    \ file’s content if it already exists. If the file does not already exist, one\
    \ is created. Use this mode to add data at the end without replacing the current\
    \ data while reading from the file.\n\nIt should be noted that each mode behaves\
    \ differently while opening a file, and the choice of mode relies on the program’s\
    \ needs and intended use. Additionally, you may specify binary mode, which is\
    \ used to handle binary files, by adding the letter b to any mode (for example,\
    \ rb or wb+).\n\n[File operations](#contents.xhtml_sc2_277a)\n\nFile operations\
    \ in C programming include a variety of operations on files, including opening,\
    \ closing, reading, writing, and placement inside the file. The functions offered\
    \ by the common C library are used to perform these actions. The typical file\
    \ operations in C are listed below:\n\n[Opening a file](#contents.xhtml_sc3_278a)\n\
    \nThe fopen() function, which accepts the file path and the file mode as arguments,\
    \ is used to open a file. The file stream is represented by the FILE* pointer\
    \ that the function returns. The letters r, w, and a represent mode, in which\
    \ the file is supposed to be opened and stand for reading, writing, and adding,\
    \ respectively. Needless to say, that before performing any operations on a file,\
    \ it must be opened first; hence, the primary step in file handling is opening\
    \ a file.\n\nfopen (char * filename, char * mode)\n\nwhere:\n\n*   filename is\
    \ the name of our file\n*   mode can have one of the above-mentioned modes.\n\n\
    Note: If you are going to handle binary files, then you will use the following\
    \ access modes instead of the above-mentioned ones − rb, wb, ab, rb+, r+b, wb+,\
    \ w+b, ab+, a+b.\n\n#include <stdio.h>\n\nint main ()\n\n{\n\nFILE* fp = fopen\
    \ (\"data.txt\", \"w\");\n\nif (fp == NULL)\n\n{\n\nprintf (\"File cannot be opened\\\
    n\");\n\nreturn (1);\n\n}\n\n// Do file operations and close the file\n\nreturn\
    \ (0);\n\n}\n\n[Closing a file](#contents.xhtml_sc3_279a)\n\nIt is important to\
    \ close a file using the fclose() function when you are done working with it.\
    \ A file is closed to guarantee that any outstanding data is written to it and\
    \ to free up system resources related to the file stream. Data loss or resource\
    \ leakage may occur if a file is not properly closed.\n\nTo close a file, use\
    \ the fclose() function. The prototype of this function is:\n\nint fclose (FILE\
    \ *fp)\n\nwhere:\n\nfp: is pointer to the FILE structure representing the file\
    \ (file pointer).\n\nFor example:\n\nfclose (fp)\n\nWhen a file is successfully\
    \ closed, the fclose(-) function returns zero, or End-of-File (EOF) if there is\
    \ a problem. This function shuts the file, releases any memory needed for the\
    \ file, and flushes any data that is still pending in the buffer to the file.\
    \ The header file stdio.h contains a definition for the constant EOF.\n\n[Writing\
    \ to a file](#contents.xhtml_sc3_280a)\n\nFunctions like fputc(), fputs(), fwrite(),\
    \ or fprintf() are used to write data to files. You can write characters, strings,\
    \ or data blocks to the file using these functions. The format and nature of the\
    \ data to be written determine the function to be used.\n\n*   fputc(): The function\
    \ fputc()  writes one character to the output stream referenced by the file pointer.\
    \ It returns the written character written on success; otherwise, EOF if there\
    \ is an error.\n\nSyntax:\n\nint fputc(char , FILE *);\n\nExample:\n\nint fputc(int\
    \ c, FILE *fp);\n\nwhere:\n\n*   c: This is the character we want to write to\
    \ the file stream. It should be of type int to accommodate all possible character\
    \ values, including EOF.\n*   fp: This pointer to the FILE structure representing\
    \ the file (file pointer).\n\nfputs() returns the character written as an unsigned\
    \ char cast to an int.\n\n*   fputw(): The fputw() function is used to print numbers\
    \ onto a file. The fputw() function is not among standard C library functions.\
    \ It does not exist in the standard C library functions provided by ANSI C. We\
    \ may instead use the fprintf() function to format and write the value to the\
    \ file stream.\n\nSyntax:\n\nint putw(int , FILE *);\n\nExample:\n\nint putw(int\
    \ w, FILE *fp);\n\nwhere:\n\n*   w: This is the integer we want to write to the\
    \ file stream.\n*   fp: This is a pointer to a FILE, which represents the file\
    \ stream we want to write to.\n\n*   fputs(): We can use the fputs() function\
    \ to write a null-terminated string to a stream.\n\nSyntax:\n\nint fputs (char\
    \ *, FILE *);\n\nExample:\n\nint fputs (char *s, FILE *fp);\n\nwhere:\n\n*   s:\
    \ This is a pointer to the null-terminated string that you want to write to the\
    \ file.\n*   fp: This is a pointer to a FILE object, which represents the file\
    \ we want to write to. It could be a file opened in write mode, such as “w”, “a”,\
    \ or “w+”.\n\n*   fprintf(): fprintf() function is used to output formatted data\
    \ to a file. It allows you to apply formatting and write several types of data\
    \ (such as text and numbers) to a designated file.\n\nSyntax:\n\nint fprintf(FILE\
    \ *, char *, argument list);\n\nExample:\n\nint fprintf(FILE *fp, char *format,\
    \ argument list);\n\nwhere:\n\n*   fp: A pointer to the FILE object that represents\
    \ the file you want to write to. It can be a file pointer returned by functions\
    \ like fopen() or standard streams like stdout (for console output) or stderr\
    \ (for error messages).\n*   format: A format string that specifies how the data\
    \ should be formatted and written to the file. It can contain format specifiers\
    \ like (%d, %f, %s, and so on) and are replaced by the corresponding values provided\
    \ in the argument list.\n*   argument list: This represents the list of arguments\
    \ we want to write to the file. They should correspond to the format specifiers\
    \ in the format string.\n\n*   fwrite(): The fwrite() function in C is used to\
    \ write binary data to a file. It allows you to write a specified number of elements,\
    \ each with a specific size, to the file in a single operation.\n\nSyntax:\n\n\
    size_t fwrite(void *, size_t, size_t count, FILE *fp);\n\nExample:\n\nsize_t fwrite(void\
    \ *ptr, size_t size, size_t count, FILE *fp);\n\nWhere:\n\n*   ptr: Pointer to\
    \ the data to be written.\n*   size: Size (in bytes) of each element to be written.\n\
    *   count: Number of elements to be written.\n*   fp: Pointer to the file stream\
    \ to write the data to return value.\n\nThe fwrite() function returns the number\
    \ of elements successfully written to the file. If the return value is less than\
    \ count, an error occurs during the write operation.\n\n[Reading from a file](#contents.xhtml_sc3_281a)\n\
    \nFunctions like fgetc(), fgets(), fread(), or fscanf() can be used to read data\
    \ from a file. You can read characters, lines, or blocks of data from the file\
    \ using these methods. The required format and kind of data to be read determine\
    \ the function used.\n\n*   fgetc(): This function reads a single character from\
    \ the file.\n\nSyntax:\n\nint fgetc(FILE *);\n\nExample:\n\nint fgetc(FILE *fp);\n\
    \nWhere, Fp is  pointer to a FILE object representing the file from which you\
    \ want to read a character.\n\nThe function returns an integer value, the character\
    \ read from the file as an unsigned char cast to an int or EOF.\n\n*   fgets():\
    \ In C, a line of text can be read either a file or standard input (often the\
    \ keyboard) and stored in a string, using the fgets() function.\n\nSyntax:\n\n\
    char *fgets(char *, int , FILE *);\n\nExample:\n\nchar *fgets(char *s, int n,\
    \ FILE *fp);\n\nWhere:\n\n*   s: A reference to the string wherein the read line\
    \ will be placed.\n*   n: The maximum character count to read, including the null-terminator.\
    \ It defines the str buffer’s size.\n*   fp: A reference to the FILE, the input\
    \ stream to be read. This might be a file opened with fopen() or a file pointer,\
    \ like stdin, for standard input.\n\n*   fscanf(): The function in C is used for\
    \ reading formatted input from a specified file stream and store it in variables\
    \ based on the specified format.\n\nSyntax:\n\nint fscanf(FILE *, char *, argument\
    \ list);\n\nExample:\n\nint fscanf(FILE *fp, const char *format, argument list);\n\
    \nWhere:\n\n*   fp: A pointer to the FILE structure representing the file you\
    \ want to read from.\n*   format: A format string specifies how the data should\
    \ be interpreted and extracted from the file. It consists of format specifiers\
    \ that define the expected data types and how they are formatted in the file.\n\
    *   argument list: This represents a list of arguments we want to write to the\
    \ file. They should correspond to the format specifiers in the format string.\n\
    \nThe function returns the number of successfully read items (matching format\
    \ specifiers) or `EOF` if an error occurs or the end of the file is reached.\n\
    \n*   fread(): The function in C is used for reading binary data from a file.\
    \ It is part of the C Standard Library’s file input/output functions and is typically\
    \ used with binary files to read a specified number of binary objects (usually\
    \ bytes) from a file into a memory buffer. Here is the syntax of the fread() function:\n\
    \nSyntax:\n\nsize_t fread(void *, size_t, size_t count, FILE *);\n\nExample:\n\
    \nsize_t fread(void *ptr, size_t size, size_t count, FILE *fp);\n\nWhere:\n\n\
    *   ptr: A pointer to the memory buffer where the data will be stored after reading.\n\
    *   size: The size (in bytes) of each object to be read from the file.\n*   count:\
    \ The number of objects to be read from the file.\n*   fp: A pointer to the FILE\
    \ structure representing the file to be read.\n\nThe fread() function reads size\
    \ * count bytes of data into the memory buffer referred to by ptr from the supplied\
    \ file. If the end of the file is reached before reading count items, it gives\
    \ the total number of successfully read objects, which might be fewer.\n\n[File\
    \ positioning](#contents.xhtml_sc3_282a)\n\nThe file pointer can be moved within\
    \ a file to a precise location using file positioning functions. Each byte in\
    \ a file is given a location or offset, and files are viewed as collections of\
    \ bytes. To maintain track of the current location within a file, C uses a file\
    \ pointer. The byte that will be read or updated next is indicated by the file\
    \ pointer.\n\nIn C, file positioning functions are used to traverse to certain\
    \ locations of a file. The basic file positioning functions in C are:\n\n*   fseek():\
    \ The fseek() function enables direct access to various file sections by allowing\
    \ programmers to relocate the file pointer to a specific location inside the file.\n\
    \nSyntax:\n\nint fseek (FILE *, long, int)\n\nExample:\n\nint fseek (FILE *fp,\
    \ long offset, int origin)\n\nWhere:\n\n*   fp is the file pointer.\n*   offset\
    \ is the number of bytes to move,\n*   origin governs the reference position.\n\
    \nThe reference position can be the beginning of the file (SEEK_SET), the current\
    \ position (SEEK_CUR), or the end of the file (SEEK_END).\n\n*   ftell(): The\
    \ present file position indicator’s location inside the file is returned by the\
    \ ftell() function. It takes one argument that is the file pointer associated\
    \ with the file concerned and returns a {long} integer, which is the current file\
    \ pointer’s byte offset from the beginning of the file.\n\nSyntax:\n\nlong ftell(FILE\
    \ * );\n\nExample:\n\nlong pos = ftell(FILE *fp );\n\nWhere:\n\n*   fp is the\
    \ file pointer.\n*   Pos is (long integer value) - the current position in the\
    \ file.\n\n*   rewind(): The rewind() function is used to reset the file position\
    \ indicator to the beginning of the file. It takes one argument that is the file\
    \ pointer associated with the file concerned and effectively moves the file position\
    \ indicator to the start of the file.\n\nExample:\n\nrewind(fp);\n\nHere, fp is\
    \ the file pointer\n\n*   fgetpos and fsetpos()\n\nThe functions are used to Get\
    \ and Set File Position using fpos_t object.\n\n*   The fgetpos function retrieves\
    \ the present file position to stores it in an fpos_t object.\n*   The fsetpos\
    \ function sets the file position from an fpos_t object.\n\nThese functions are\
    \ used for more advanced file positioning tasks.\n\nSyntax:\n\nfgetpos(FILE *,\
    \ fpos_t);\n\nfsetpos(FILE *, fpos_t);\n\nExample:\n\nfgetpos(fp, &p);\n\nfsetpos(fp,\
    \ &p);\n\nWhere:\n\n*   fp is the file pointer\n*   p is an `fpos_t` object.\n\
    \nFor example:\n\nfpos_t p;\n\nfgetpos(fp, &p); // Get the current file position.\n\
    \n// ... Perform some operations ...\n\nfsetpos(fp, &p); // Set the file position\
    \ back to the saved position.\n\n[Error handling](#contents.xhtml_sc3_283a)\n\n\
    It is crucial to appropriately manage errors while working with files. I/O functions,\
    \ positioning functions, and functions that return error indicators include fopen()\
    \ and errno. These functions also set the global errno variable to indicate problems.\
    \ Use perror() or fprintf() to show error messages and deal with special situations.\n\
    \n[File truncation](#contents.xhtml_sc3_284a)\n\nWe can use the ftruncate() or\
    \ truncate() methods to truncate or resize a file. You can change the file size\
    \ using these routines to a desired length. When you need to eliminate previous\
    \ data or condense the file size, truncating a file might be helpful.\n\n[File\
    \ deletion](#contents.xhtml_sc3_285a)\n\nThe remove() method can be used to remove\
    \ a file from the file system. This function permanently deletes the file that\
    \ was given. When utilizing this feature, caution should be used because file\
    \ deletion is irrevocable. It is crucial to handle file operations with care,\
    \ checking for mistakes and making sure each action is successful. When interacting\
    \ with files, your program’s stability and dependability are enhanced by proper\
    \ error handling.\n\nPlease be aware of the following factors:\n\n*   Verify that\
    \ the file you wish to remove is present at the place you have chosen.\n*   We\
    \ must make sure that our program has the permissions it needs to remove the file.\
    \ To remove certain files on some systems, you might need elevated rights (such\
    \ as being logged in as the administrator).\n*   Use caution when using the remove\
    \ function because it permanently deletes files. This function should only be\
    \ used with the intention of deleting the file.\n*   When employing file-related\
    \ methods, error handling is crucial since they might fail for a variety of reasons\
    \ (for example, file not found, inadequate permissions). We can identify and manage\
    \ issues with the use of the perror function.\n\n[File locking](#contents.xhtml_sc3_286a)\n\
    \nA file locking mechanism is used to stop several processes or threads from accessing\
    \ or changing a shared file simultaneously. As a result, problems like race conditions\
    \ and data corruption are avoided since it ensures that only one process may have\
    \ exclusive access to the file at once.\n\nThe fcntl system call, in conjunction\
    \ with the F_SETLK command, can be used to provide file locking in C. This enables\
    \ software to lock or unlock a specific section of a file.\n\n[Type of files](#contents.xhtml_sc2_287a)\n\
    \nThere are numerous different file types that may be used in C programming for\
    \ a variety of reasons. The following file formats are used the most frequently\
    \ in C file programming:\n\n*   Text files: Each character in a text file is represented\
    \ by its corresponding ASCII value, allowing for the storage of data in a human-readable\
    \ manner. Standard text editors make it simple to generate, modify, and read these\
    \ files. Text files are frequently used in C programming to store and read textual\
    \ data, including plain text data sets, log files, configuration files, and log\
    \ files.\n*   Binary files: Binary files hold information in a binary format,\
    \ which exhibits the information’s unprocessed state. These files cannot be read\
    \ by humans and must be properly interpreted using specialized software or tools.\
    \ Complex data structures like photos, audio files, video files, or serialized\
    \ objects are frequently stored in binary files. Low-level file operations are\
    \ used to manage binary files in C programming.\n*   Input/Output files: The standard\
    \ input (stdin), standard output (stdout), and standard error (stderr) streams\
    \ are connected to I/O files. These files offer a way to communicate with the\
    \ system and the user. The standard output file (stdout) is used to show program\
    \ output, whereas the standard input file (stdin) is used to take human input.\
    \ The standard error file (stderr) is employed to show error messages and diagnostic\
    \ data.\n*   Temporary files: In order to hold intermediate or temporary data,\
    \ temporary files are generated during program execution. These files are usually\
    \ employed when processing vast volumes of data or for caching purposes. Temporary\
    \ files are frequently automatically created and then removed after use. The tmpfile()\
    \ and tmpnam() methods are often used in C programming to create and maintain\
    \ temporary files.\n*   Random access files: Random access files enable reading\
    \ and writing data at any desired place by allowing direct access to any portion\
    \ of the file. When you regularly need to alter or access data from particular\
    \ points inside the file, this sort of file is appropriate. For databases or applications\
    \ that demand effective data retrieval and change, random access files are frequently\
    \ utilized. Random access files may be managed in C code by utilizing methods\
    \ like fseek() and fwrite().\n\nThese file types are appropriate for various applications\
    \ since they have varied functions and unique properties. For effective file management\
    \ and data manipulation in C programming, it is crucial to comprehend the various\
    \ file formats and how to use them properly.\n\n[Working with text files in C](#contents.xhtml_sc3_288a)\n\
    \nText files are commonly used for storing and manipulating human-readable data.\
    \ In the C programming language, working with text files involves various operations\
    \ such as creating, reading, writing, and manipulating text data. This note provides\
    \ a comprehensive overview of working with text files in C, covering the essential\
    \ file operations, techniques, and considerations.\n\n[Opening a text file](#contents.xhtml_sc4_289a)\n\
    \nThe fopen() function is used to open a text file. The function returns a file\
    \ pointer. We specify the file mode as r when reading a file and w for writing\
    \ data onto a file. If the file we specify for writing does not exist, it creates\
    \ a new file with the specified name/path. We may also use a for appending data\
    \ to an existing file.\n\nSyntax:\n\nFILE *fopen (char *filename, char *mode)\n\
    \n[Reading text from a file](#contents.xhtml_sc4_290a)\n\nThe fgets() function\
    \ is used to read a line of text from a file.\n\nSyntax:\n\nchar *fgets (char\
    \ *, int, FILE *)\n\nExample:\n\nchar *fgets (char *str, int num, FILE *fp)\n\n\
    Where:\n\n*   str is the character array to store the read line,\n*   num is the\
    \ number of characters to read\n*   fp is the file pointer.\n\nThe function returns\
    \ NULL when the end of the file is reached.\n\n[Writing text to a file](#contents.xhtml_sc4_291a)\n\
    \nWe use the fprintf() function to write formatted text to a file.\n\nSyntax:\n\
    \nint fprintf (FILE *, char *format, ...)\n\nExample:\n\nint fprintf (FILE *fp,\
    \ char *format, ...)\n\nWhere:\n\n*   fp is the file pointer,\n*   format specifies\
    \ the format of the text to be written.\n*   ... represents the data to be formatted\
    \ and written.\n\nThe function returns the number of characters written or a negative\
    \ value on failure.\n\n[Appending text to an existing file](#contents.xhtml_sc4_292a)\n\
    \nWe use this mode to open a file for appending text. This mode guarantees that\
    \ new text is added at the end of the file, preserving existing content, if any.\n\
    \n[Closing a text file](#contents.xhtml_sc4_293a)\n\nThe fclose () function is\
    \ used to close a text file.\n\nSyntax:\n\nint fclose (FILE *)\n\nExample:\n\n\
    int fclose (FILE *fp)\n\nWhere, fp is the file pointer.\n\nWe must close a file\
    \ that guarantees the release system resources and ensures data integrity.\n\n\
    [Error handling](#contents.xhtml_sc4_294a)\n\nThe process of error handling checks\
    \ for any errors after performing file operations to handle exceptional situations.\
    \ Functions like fopen(), fgets(), and fprintf() return NULL or a negative value\
    \ on failure, which signifies an error. We may also use feof() and ferror() to\
    \ check for end-of-file and error conditions, respectively.\n\n[Reading and writing\
    \ line-by-line](#contents.xhtml_sc4_295a)\n\nWe may use a loop in association\
    \ with fgets() to read a file line-by-line until the end of the file is reached.\
    \ In the meantime, process each line as needed.\n\nWe use fprintf() to write lines\
    \ of text to a file, ensuring appropriate formatting.\n\n[Text file manipulation](#contents.xhtml_sc4_296a)\n\
    \nWe use string manipulation functions (strcpy(), strcat(), and more) to modify\
    \ and manipulate text data read from a file. We also apply data processing techniques\
    \ like tokenization and regular expressions to extract meaningful information\
    \ from the text.\n\n[Working with CSV files](#contents.xhtml_sc3_297a)\n\nComma\
    \ Separated Values (CSV) files are commonly used for tabular data storage. We\
    \ can read CSV files using fgets() and then parse the read lines using string\
    \ manipulation or specialized CSV parsing libraries. We can also use fprintf()\
    \ to write data in CSV format, ensuring proper comma separation.\n\nText and binary\
    \ files are the two primary file kinds that may be handled in C programming. How\
    \ data is expressed and stored inside these different file formats varies. The\
    \ description of each file type is as follows:\n\n*   Text files: Text files are\
    \ readable by humans and used to store plain text data. There is a distinct character\
    \ or symbol for each character in the file. Data is saved in text files as a series\
    \ of characters, including alphabetic characters, numeric characters, symbols,\
    \ and control characters. A text editor may generate, edit, and display text files.\n\
    \nText-oriented C programming routines like fscanf() and fprintf() are commonly\
    \ used to read and write text files. By treating the data as text, these methods\
    \ let you read and write formatted data. Data intended to be understood as characters\
    \ or strings can be stored and exchanged using text files.\n\n*   Binary files:\
    \ Binary files are files that hold data in a binary format, which translates information\
    \ into individual bytes. Binary files can include non-textual data like numbers,\
    \ structures, or graphics but are not meant to be understandable by humans. To\
    \ maintain the precise representation of data, including the underlying structure\
    \ and data types, binary files are utilized.\n\nBinary-oriented methods like fread()\
    \ and fwrite() are usually used in C programming to read and write binary files.\
    \ By treating the file content as a series of bytes, these functions enable direct\
    \ reading and writing of binary data.\n\nWhen correct data representation is crucial\
    \ for storing complicated data structures, serialization, and data durability,\
    \ binary files might be helpful.\n\nIt is crucial to keep in mind that whereas\
    \ text files may be opened and examined in a text editor, binary files call for\
    \ certain procedures to accurately comprehend their contents. The kind of data\
    \ and required functionality determine whether text or binary files should be\
    \ used.\n\n[Binary file handling in C](#contents.xhtml_sc3_298a)\n\nBinary file\
    \ handling in the C programming language allows programmers to read from and write\
    \ to binary files, which contain non-textual data. Unlike text files, binary files\
    \ store data in a raw and compact format, making them suitable for complex data\
    \ structures and high-performance applications. The following section provides\
    \ a comprehensive overview of binary file handling in C, covering file operations,\
    \ reading and writing binary data, and considerations for working with binary\
    \ files.\n\n[Opening and closing binary files](#contents.xhtml_sc4_299a)\n\nThe\
    \ fopen() function opens a binary file for reading or writing. We use the file\
    \ mode as rb when reading a file or wb for writing in binary mode. If the file\
    \ does not exist, it can be created using wb mode. The fclose() function closes\
    \ a binary file after reading or writing operations are complete.\n\n[Reading\
    \ binary data](#contents.xhtml_sc4_300a)\n\nThe function is used to read a specified\
    \ number of bytes from a binary file.\n\nSyntax:\n\nsize_t fread(void *, size_t,\
    \ size_t, FILE *)\n\nExample:\n\nsize_t fread(void *ptr, size_t size, size_t count,\
    \ FILE *fp)\n\nWhere:\n\n*   ptr signifies the buffer to store the read data.\n\
    *   size represents the size of each element to be read.\n*   count represents\
    \ the number of elements to read.\n*   fp is the file pointer.\n\nAfter reading,\
    \ the file pointer advances automatically to the subsequent position.\n\n[Writing\
    \ binary data](#contents.xhtml_sc4_301a)\n\nThe fwrite() function is used to write\
    \ a specified number of bytes to a binary file.\n\nSyntax:\n\nsize_t fwrite(void\
    \ *, size_t, size_t, FILE *)\n\nExample:\n\nsize_t fwrite(const void *ptr, size_t\
    \ size, size_t count, FILE *fp)\n\nWhere:\n\n*   ptr represents the data to be\
    \ written.\n*   size represents the size of each element to be written.\n*   count\
    \ represents the number of elements to write, and\n*   fp is the file pointer.\n\
    \nThe file pointer automatically propagates to the subsequent position after writing.\n\
    \n[Moving the file pointer](#contents.xhtml_sc4_302a)\n\nThe fseek() function\
    \ is used to move file pointer to a stated position within the binary file.\n\n\
    Syntax:\n\nint fseek (FILE *, long, int)\n\nExample:\n\nint fseek (FILE *fp, long\
    \ offset, int origin)\n\nWhere:\n\n*   fp is the file pointer\n*   offset is the\
    \ number of bytes to move,\n*   origin governs the reference position.\n\nThe\
    \ reference position can be the beginning of the file (SEEK_SET), the current\
    \ position (SEEK_CUR), or the end of the file (SEEK_END).\n\n[Binary file size](#contents.xhtml_sc4_303a)\n\
    \nThe ftell() function is used when we have to return the current position of\
    \ the file pointer within the binary file.\n\nSyntax:\n\nlong int ftell (FILE\
    \ *fp)\n\nExample:\n\nlong int ftell (FILE *fp)\n\nWhere:\n\n*   fp is the file\
    \ pointer.\n\nBy finding the difference between the starting position (usually\
    \ 0) and the current position, we can determine the size of the binary file.\n\
    \n[Binary file error handling](#contents.xhtml_sc4_304a)\n\nWe can check binary\
    \ file error handling for errors during file operations by examining the return\
    \ values of functions fread() and fwrite().\n\nThe feof() function also checks\
    \ if the end-of-file indicator is set after a read operation.\n\nThe ferror()\
    \ function is used to check if an error occurred during a file operation.\n\n\
    We may also use error handling techniques like conditional statements or error\
    \ codes to handle errors, which may occur during file related operations, effectively.\n\
    \n[Working with complex data structures](#contents.xhtml_sc4_305a)\n\nBinary file\
    \ handling is particularly useful for working with complex data structures like\
    \ structs or arrays. Serialize the data structures by writing their contents directly\
    \ to a binary file using fwrite(). Deserialize the data structures by reading\
    \ binary data from a file using fread().\n\n[Considerations for binary file handling](#contents.xhtml_sc4_306a)\n\
    \nBinary files are not human-readable, so proper data organization and documentation\
    \ are crucial for handling binary files. We must ensure platform compatibility\
    \ by considering issues like endianness (byte order) when working with binary\
    \ data. We should also avoid directly manipulating the binary file without proper\
    \ precautions to prevent data corruption.\n\nBinary file handling provides a strong\
    \ mechanism in C for reading and writing non-textual data in a raw format. Binary\
    \ file handling allows programmers to work with complex data structures by understanding\
    \ the operations and functions associated with these files, which in turn help\
    \ in achieving high-performance data processing. By following the considerations\
    \ associated with handling binary files, developers can harness the capabilities\
    \ of binary file handling and build robust applications that manipulate binary\
    \ data effectively.\n\n[File access](#contents.xhtml_sc2_307a)\n\nFile access,\
    \ as used in computer programming, describes the procedures and tricks used to\
    \ read from or write to files. There are several file access techniques that may\
    \ be used, each with unique benefits and specialized functions. The sequential,\
    \ direct, and stream kinds of file access are covered in general detail in this\
    \ note.\n\nThe three main file access methods offered by C are:\n\n*   Sequential\
    \ access\n*   Random or direct access\n*   Stream access\n\nEach kind offers special\
    \ features that are suited to a particular scenario. We will be going over their\
    \ features, principles, and actual implementations. It also explores important\
    \ modes, functionalities, and factors to consider while using each sort of file\
    \ access; the purpose is to provide readers with a full grasp of file handling\
    \ in C and give them the skills necessary to effectively interact with various\
    \ file formats.\n\nProgramming cannot function without files because they allow\
    \ us to persistently store and retrieve data. Using file streams - represented\
    \ by the FILE data type—in C programming simplifies file processing. Here, we\
    \ will discuss various file-related topics, such as file modes, opening and closing\
    \ files, reading from and writing to files, and error handling when it comes to\
    \ working with files in C programming.\n\n[Sequential file access](#contents.xhtml_sc3_308a)\n\
    \nThe process of reading or writing data from or to a file in a consecutive way,\
    \ progressing through the file from start to finish, is referred to as sequential\
    \ file access in computer programming. In the context of the C programming language,\
    \ this note gives a quick explanation of sequential file access, covering file\
    \ opening, reading, writing, and closing operations.\n\nWhen using a sequential\
    \ file access method, data is read or written throughout a file, beginning at\
    \ the start and terminating at the end. According to a linear progression, data\
    \ is processed in the order that it occurs in the file. Important aspects of sequential\
    \ file access are as follows:\n\n*   Reading: Reading in the case of a sequential\
    \ file begins at the file’s beginning and moves through it step by step until\
    \ it reaches its finish.\n*   Writing: Sequential file writing enlarges the file’s\
    \ size when new data is written by appending it at the end of the file.\n\nBenefits:\
    \ Massive volumes of data can be read or written quickly and easily with sequential\
    \ access. For processing massive datasets, log files, and file backups, it is\
    \ commonly utilized.\n\n[Opening a file for sequential access](#contents.xhtml_sc4_309a)\n\
    \nThe fopen() function is used to open a file and returns a file pointer for subsequent\
    \ file operations.\n\nExample:\n\nFILE *fopen (const char *filename, char *mode)\n\
    \nWhere:\n\n*   Filename is the name of the file to be opened.\n*   mode specifies\
    \ the access mode (‘r’ for reading, ‘w’ for writing, ‘a’ for appending, and combinations\
    \ like ‘r+’, ‘w+’, ‘a+’).\n\nIn case the file does not exist when opening in write\
    \ mode, a new file of the same name will be created.\n\n[Reading from a file](#contents.xhtml_sc4_310a)\n\
    \nThe function fgets() reads a line of text from the specified file. The function\
    \ returns s  if successful, otherwise NULL. We may also use the function feof()\
    \ to check the end of the input stream. The end-of-file flag for the specified\
    \ stream is shown by the feof() function.\n\n[Writing to a file](#contents.xhtml_sc4_311a)\n\
    \nTo write data to a sequential file, we use functions like fprintf() for formatted\
    \ output, fputs() for writing strings and fwrite() for writing binary data.\n\n\
    // fprintf to write formatted data\n\nfprintf(file, \"The value is: %d\\n\", number);\n\
    \n// fputs to write a string\n\nfputs(\"This is a line of text.\\n\", file);\n\
    \n// fwrite to write binary data\n\nfwrite(data, sizeof(double), 5, file);\n\n\
    [Moving the file pointer](#contents.xhtml_sc4_312a)\n\nBy default, the file pointer\
    \ advances automatically after each read or write operation, allowing sequential\
    \ access.\n\nIf required, the file pointer can be moved explicitly using the fseek()\
    \ function. Refer to the direct access section for more details.\n\n[Closing a\
    \ file](#contents.xhtml_sc4_313a)\n\nThe  fclose()  function closes the file and\
    \ releases associated resources. Closing the file is important to ensure data\
    \ integrity and free system resources.\n\n[Advantages](#contents.xhtml_sc4_314a)\n\
    \nThe advantages of sequential file access are discussed below:\n\n*   Simplicity:\
    \ Sequential file access is straightforward to implement and understand.\n*  \
    \ Efficient for large files: Sequential access can be efficient for reading or\
    \ writing large files without the need to store the entire file in memory.\n*\
    \   Suitable for certain data structures: Sequential access is well-suited for\
    \ line-based text files, where data is processed line by line.\n\n[Limitations](#contents.xhtml_sc4_315a)\n\
    \nThe limitations of sequential file access are discussed below:\n\n*   Random\
    \ access limitations: Sequential access does not allow direct access to specific\
    \ portions of a file without reading or skipping preceding data.\n*   Inefficiency\
    \ for specific operations: If frequent random access or modifications to different\
    \ parts of a file are required, sequential access may not be the most efficient\
    \ approach.\n\nSequential file access in C provides a simple and efficient way\
    \ to read and write data from and to files in a sequential manner. It is particularly\
    \ useful for handling large files or working with line-based text data. However,\
    \ it has limitations in terms of random access and may not be suitable for certain\
    \ scenarios that require frequent modifications or direct access to specific file\
    \ positions. Understanding the characteristics and appropriate use cases of sequential\
    \ file access can help developers effectively utilize file operations in their\
    \ C programs.\n\n[Program examples](#contents.xhtml_sc4_316a)\n\nBelow discussed\
    \ are some examples of the basic programs for sequential files:\n\n*   Creating\
    \ a sequential file and writing data to it:\n\n    #include<stdio.h>\n\n    int\
    \ main()\n\n    {\n\n    FILE *fp;\n\n    char chr;\n\n    fp = fopen (\"s.txt\"\
    ,\"w\");\n\n    fputc ('H', fp);\n\n    fputc ('E', fp);\n\n    fputc ('L', fp);\
    \ // will print HELLO onto the file s.txt\n\n    fputc ('L', fp);\n\n    fputc\
    \ ('O', fp);\n\n    fclose (fp);\n\n    fp = fopen (\"s.txt\",\"r\");\n\n    while\
    \ (!feof(fp))\n\n    {\n\n    chr = fgetc(fp);\n\n    printf (\"%c\", chr);\n\n\
    \    }\n\n    return (0);\n\n    fclose (fp);\n\n    }\n\n*   Write a paragraph\
    \ onto a file:\n\n    #include<stdio.h>\n\n    int main ()\n\n    {\n\n    FILE\
    \ *fp;\n\n    char chr;\n\n    fp = fopen (\"s.txt\", \"w\");\n\n    while ((chr=getche\
    \ ())!= \"~\") {\n\n    // write to file the characters till user presses '~'\
    \ character\n\n    fputc (chr, fp);\n\n    }\n\n    fclose (fp);\n\n    fp = fopen\
    \ (\"s.txt\",\"r\");\n\n    while (!feof(fp)) {\n\n    chr = fgetc(fp);\n\n  \
    \  printf (\"%c\", chr);\n\n    }\n\n    fclose (fp);\n\n    return (0);\n\n \
    \   }\n\n*   Write numbers to a file:\n\n    #include<stdio.h>\n\n    int main\
    \ ()\n\n    {\n\n    FILE *fpe, *fpo;\n\n    int nm;\n\n    fpe = fopen (\"even.txt\"\
    ,\"w\"); //open even. txt and odd.txt files for writing\n\n    fpo = fopen (\"\
    odd.txt\", \"w\");\n\n    for (nm=1; nm<=20; nm++) {\n\n    if (nm%2 ==0)\n\n\
    \    putw ((char)nm, fpe);\n\n    //if even number, write to even file else write\
    \ to odd file\n\n    else\n\n    putw ((char)nm, fpo);\n\n    }\n\n    fclose\
    \ (fpe);\n\n    fclose (fpo);\n\n    printf(\"\\nOdd Numbers:\\n\");\n\n    fpo\
    \ = fopen (\"odd.txt\", \"r\");\n\n    while ( (nm = getw(fpo)) != EOF )\n\n \
    \   {\n\n    printf (\"%d\\t\", nm);\n\n    }\n\n    fclose (fpo);\n\n    fpe\
    \ = fopen (\"even.txt\",\"r\");\n\n    printf(\"\\nEven Numbers:\\n\");\n\n  \
    \  while ( (nm = getw(fpe)) != EOF)\n\n    {\n\n    printf (\"%d\\t\", nm);\n\n\
    \    }\n\n    fclose (fpe);\n\n    return (0);\n\n    }\n\n*   Write a string\
    \ onto a file using fputs():\n\n    #include <stdio.h>\n\n    int main ()\n\n\
