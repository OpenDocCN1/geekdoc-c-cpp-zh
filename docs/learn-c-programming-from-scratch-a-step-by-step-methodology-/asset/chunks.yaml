    ## Programming Best Practices


    - **Consistency in naming**: We should maintain consistency by using the same
    naming patterns across our source code.

    - **Steer clear of acronyms**: They might make your code more difficult to read
    and comprehend. If an acronym is not well-known and frequently used in your programming
    community, do not use it.

    - **Name classes and objects with nouns**: Classes and objects should be named
    with nouns since they reflect actual objects. For instance, `Student` should be
    the class name for a class representing a student.

    - **Name functions and methods using verbs**: Verbs describe activities that may
    be taken; hence, they should be used to name functions and methods. For instance,
    the function `Sum` should compute the sum of two values.

    - **Clarity of expression**: Expression represents a specified operation. Hence,
    they need to be clearly understood and depicted with no concession on clarity
    of expression.

    - **Comments and indentations**: Comments are used for documentation purposes
    in a program. Comments (denoted by `//` for a single line comment) tend to guide
    a programmer through debugging; indentation is the ideal technique for writing
    a program in such a way that helps to understand the flow of a program.

    - **Use of blank lines or blank spaces**: Blank lines are used to separate blocks
    of code that are long. The standard for the use of spaces in programming languages
    matches what we follow in normal English rules, meaning that symbols in C, like
    `=`, `+`, and more, should precede and follow with at least one space.

    - **Depiction of statements**: Statements represent meaningful commands through
    which we perform operations in C. They should be put on separate lines. In case
    of a block of statements (explained later), which is denoted by `{` and `}`, the
    opening brace, `{` should appear on the line after the block-level statement,
    and the closing brace `}`, should appear after the last statement of the block-level
    statement. A block of statements is indented with relation to the braces.


    ## Features of a good program


    A good computer program should have the following features:


    - **Usability**: The program should be easy to use and understand, with a clear
    and intuitive user interface.

    - **Reliability**: The program should function as expected and not cause unintended
    consequences or errors.

    - **Performance**: The program should be fast and responsive without significant
    lag or delay.

    - **Scalability**: The program should be able to handle increasing demands and
    data processing requirements as the user base grows.

    - **Security**: The program should have robust security measures to protect against
    hacking, data breaches, and other security threats.

    - **Flexibility**: The program should allow users to customize and modify their
    settings and preferences to fit their needs.

    - **Compatibility**: The program should work seamlessly with other software and
    hardware components without compatibility issues.

    - **Support**: The program should have adequate documentation, training, and technical
    support to help users resolve any issues.


    By having these features, a good computer program will provide a positive user
    experience, increase productivity, and provide long-term value to its users.


    ### Reasons for using a structured, systematic approach to problem-solving


    - To ensure consistency.

    - To make everyone aware of how others are approaching the project.

    - To keep the procedure objective and resistant to personal prejudices and impressions.

    - To facilitate group decision-making.

    - To help a group follow the model rather than using different ways all at once
    by focusing on the six phases in the problem-solving model, which also helps define
    the agenda. A group can more easily agree by employing a process and facts to
    guide their judgments.

    - To successfully resolve issues.


    ## Computer as a problem-solving tool


    Computers are information processing devices that transform information/data according
    to prescribed rules, organized in an algorithm implemented as a program.


    **Algorithm**: A precise, step-by-step method of doing a task in a finite amount
    of time.


    ### How to use the computer as a problem-solving tool?


    We need to:


    - Analyze and describe the initial state and target stage of events with respect
    to input data.

    - Design an algorithm for transforming input into output based on a chosen set
    of applicable operations.

    - Implement the algorithm as a program using a particular programming language.


    ## Computers and computing systems


    Computers are devices capable of executing programs that operate on data fed (input)
    to produce the desired output.


    Computing systems are the hardware and software components that provide computing
    services and functionality. These systems can range from simple devices, such
    as a calculator, to complex systems, such as a supercomputer or cloud computing
    infrastructure.


    Here are some common types of computing systems:


    - **Personal computers**: These are the most common computing systems used by
    individuals and businesses. They typically consist of a desktop or laptop computer
    and a range of peripheral devices, such as a keyboard, mouse, and monitor.

    - **Mobile devices**: These include smartphones and tablets, which have become
    increasingly popular for personal and business use. Mobile devices typically have
    limited processing power and storage capacity but are highly portable and offer
    a range of features and capabilities.

    - **Servers**: Servers are specialized computing systems that provide services
    to users and other computers on a network. They are used for web hosting, email
    hosting, database management, and file sharing.

    - **Supercomputers**: Supercomputers are high-performance computing systems for
    complex scientific and engineering tasks, such as weather modeling, computational
    fluid dynamics, and molecular modeling. They typically consist of many processors
    and a significant amount of memory and storage.

    - **Embedded systems**: Embedded systems are specialized computing systems built
    into other devices, such as cars, medical devices, and industrial equipment. They
    are designed to perform specific tasks and are often used in real-time systems
    where speed and reliability are essential.

    - **Cloud computing infrastructure**: Cloud computing infrastructure is a computing
    system that provides access to a range of computing resources, such as storage,
    processing power, and applications, over the internet. Businesses and individuals
    often use cloud computing to store and access data, run applications, and perform
    other computing tasks without needing on-site hardware and software.


    In a computer (computing device), the input devices, such as the keyboard and
    mouse, provide data to the computer. The output devices, such as the monitor and
    speakers, display or produce output from the computer. The system bus connects
    all the computer components, allowing them to communicate.


    The Central Processing Unit (`CPU`) is the brain of the computer, responsible
    for executing instructions and performing calculations. The memory, which includes
    `RAM`, `ROM`, and `cache`, provides temporary and permanent storage for data and
    instructions that the `CPU` uses.


    Finally, the storage component, which includes hard disk drives and other types
    of storage, provides permanent storage for data and programs even when the computer
    is turned off. [Figure 1.1](#ch01_fig1-1) depicts the entire computer system housing
    all the above-mentioned components and functionality:


    ![](images/1.1.png)


    Figure 1.1: Computer system functionality


    A list of steps that describe how a computer processes data and completes tasks
    can be used to condense the fundamental scheme of operation of a computer. An
    overview of a computer’s basic operations is as follows:

