    [Bottom-up modular programming](#contents.xhtml_sc4_21a)


    Bottom-up design is a system design approach that can be thought to be the opposite
    of what is done in top-down design. It is a style of programming where an application
    is constructed beginning with primitives of the programming language and gradually
    constructing more and more complicated features until all the application has
    been formulated. Starting the design with specific modules. Once these modules
    are designed or developed, these modules are connected to make a bigger module
    (more complex structures), ending at the top. The procedure is repeated till the
    whole system is constructed. Bottom-up model enables us to have the luxury of
    decision-making at low levels and to decide upon the re-usability of components.
    The bottom-up method is widely used for testing because each of the lowest-level
    functions is written and tested first. Since the lowest-level modules have already
    been tested, any detected errors are probably due to the higher-level modules.
    This process continues, moving up the levels until the main function is finally
    tested. Refer [Figure 1.5](#ch01.xhtml_fig1-5):


    ![](images/1.5.png)


    Figure 1.5: Bottom-up programming


    Some key differences between the Bottom-Up and Top-Down programming models are
    discussed in [Table 1.1](#ch01.xhtml_tab1-1):


    | Feature | Comparison |


    | Approach | Bottom-up is a code-first approach, where developers start by writing
    small code modules or functions and building up from there. Top-down is a requirements-first
    approach, where developers start with defining the high-level goals and requirements
    of the system and breaking them down into smaller modules. |


    | Focus | Bottom-up focuses on the details of individual components and how they
    fit together. Top-down focuses on the high-level goals and requirements of the
    system and how they can be achieved through the individual components. |


    | Complexity | Bottom-up is often used for complex systems, where it is easier
    to manage complexity by building up from small components. Top-down is often used
    for simpler systems or systems with well-defined requirements. |


    | Testing | Bottom-up is easier to test at the module level since each module
    can be tested separately. Top-down testing requires integration testing to ensure
    all the modules work together correctly. |


    Table 1.1: Bottom-up versus Top-down programming


    Bottom-up and Top-down programming models are two different approaches to developing
    software applications, each with advantages and disadvantages. The choice of approach
    depends on the specific requirements of the system, the complexity of the application,
    and the preferences of the development team.


    [Structured programming](#contents.xhtml_sc3_22a)


    This programming style is known by various names: Procedural decomposition, Structured
    programming, modular programming, and so on. Structured programming is a programming
    model that enables the creation of programs with reusable components.


    Structured programming aims to enhance the accuracy and efficiency of program
    development by employing organized control flow constructs such as conditional
    statements, loop structures, block formations, and subroutines. This stands in
    contrast to the use of tests and jumps (such as the go-to statement), which are
    less structured and can lead to less precise and more time-consuming programming.


    In structured programming, the level of abstraction among the modules is low as
    the implementation particulars of various data structures must be shared amongst
    the modules and are thereby exposed. This entices other modules to use these implementation
    details, thereby creating undesirable dependencies between different program parts.
    The key disadvantage is that all decisions made from the beginning of a project
    rest on the high-level specification of the application.


    Advantages of structured programming:


    *   It is easier to comprehend.


    *   This approach is user-friendly.


    *   It is easier to maintain.


    *   It is problem-specific rather than machine-specific.


    *   It requires less effort and time, which makes development easier.


    *   Relatively easy to debug.


    *   Generally, it is machine-independent


    Disadvantages of structured programming:'
