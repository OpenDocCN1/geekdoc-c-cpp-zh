    ### Algorithm to check whether the given number is positive or negative:


    1. Start

    2. input `n`

    3. `if n >= 0` then go to step 5

    4. output "Given number is negative" and go to step 6

    5. output "Given number is positive"

    6. Stop


    This algorithm takes a number (`n`) as input and checks whether it is less than
