  trans: "\n\n`&a;` 返回变量 `a` 的实际地址。\n\n- `?` 条件运算符：条件运算符（三元运算符）是 C 语言中编写 `if-else`\
    \ 语句的另一种方式。\n\n语法：\n`condition? expression1: expression2`\n\n例如：\n```\nint max\
    \ = a > b ? a : b;\n```\n\n如果表达式 `a > b` 为真，则返回 `a` 作为表达式的值，否则返回 `b` 作为表达式的值。\n\
    \n## C 语言中的运算符优先级\n\n运算符优先级控制表达式中项的分组方式以及表达式的求值。某些运算符比其他运算符更；例如，乘法运算符的优先级高于加法运算符。\n\
    \n例如，在表达式 `x = 7 + 3 * 2;` 中，`x` 被赋值为 13 而不是 20，因为运算符 `*` 的优先级高于 `+`。\n\n因此，先执行乘法操作，然后执行加法操作。优先级较高的运算符出现在表格顶部，而优先级较低的运算符出现在底部。在表达式中，高优先级运算符将先求值，然后是优先级较低的运算符。\n\
    \n在计算机编程中，当单个表达式中使用多个相同优先级的运算符时，运算符的结合性决定了操作执行的顺序。结合性有。运算符的结合性通常在编程语言规范中指定，理解运算符的结合性对于正确求值复杂表达式非常重要。\n\
    \n- 从左到右\n- 从右到左\n- 非结合性\n\n### 左结合性\n左结合性意味着操作是从左到右执行的。左结合运算符的一个例子是减法运算符 `-`。\n\
    \n。考虑以下表达式：\n```\nx - y - z\n```\n减法运算符是左结合的，因此操作从左到右执行。该表达式的求值为：\n```\n(x - y)\
    \ - z\n```\n先执行 `x` 和 `y` 之间的减法，然后从 `z` 中减去该操作的结果。\n\n### 右结合性\n右结合性意味着操作是从右到左执行的。赋值运算符（=`）是一个右结合运算符。考虑以下表达式：\n\
    ```\nx = y = z;\n```\n由于赋值运算符是右结合的，表达式从右到左求值。\n在这里，`z` 的值被赋值给 `y`，然后 `y` 的值（现在等于\
    \ `z`）被赋值给 `x`。如果赋值运算符是左结合的，表达式将从左到右求值，结果将会有不同。\n\n> 注意：左结合性仅在运算符优先级相同时起作用。如果运算符优先级不同，无论结合性如何，优先级较高的运算符都将先求值。\n\
    \n在 C 语言中，非结合性运算符是指在不使用括号指定操作顺序的情况下不能连续使用的运算符。这些运算符包括：\n\n- 条件运算符 `?:`：该运算符是非结合性的，意味着在没有括号的情况下连续使用。例如，表达式\
    \ `a ? b : c ? d : e` 是无效的，必须写成 `a ? b : (c ? d : e)` 来指定顺序。\n- 赋值运算符 `=`, `+=`,\
    \ `-=`, `*=`, `/=`, `%=`：这些运算符是右结合的。\n- 逗号运算符 `,`：该运算符优先级最低，且是左结合的。\n- 逻辑运算符 `&&`\
    \ 和 `||`：这些是左结合的。\n- 关系运算符 `==`, `!=`, `<`, `<=`, `>`, `>=`：这些是左结合的。\n- 算术运算符\
    \ `+`, `-`：这些是左结合的。\n- 乘法运算符 `*`, `/`, `%`：这些是左结合的。\n- 一元运算符 `++`, `--`, `+`,\
    \ `-`, `!`, `~`：这些通常是右结合的。\n\n在 C 语言中，数据类型定义了存储在变量中或用函数参数的数据类型和大小。在 C 语言中，数据类型主要大类：\n\
    \n### 基本数据类型\n基本数据类型是数据的构建块。这些是 C 中的基础数据类型，用于表示简单值。C 中的基本类型包括：\n    - `char`：用于表示单字符。\n\
    \    - `int`：用于表示整数。\n    - `float`：用于表示浮点数。\n    - `double`：用于表示双精度浮点数。\n   \
    \ - `void`：用于类型不存在。\n\n### 衍生数据类型\nC 中的衍生数据类型由基本数据类型构建\n    - `array`：用于表示同质元素（相同类型的数据）的集合。\n\
    \    - `pointer`：用于存储其他变量的内存地址。\n    - `struct`：用于将相关数据类型分组为单一实体。\n    - `union`：类似于结构体，所有成员共享相同的内存位置。\n\
    \    - `enum`：用于定义一组命名的整数常量。\n    - `typedef`：用于为现有数据类型创建别名。\n    - `user-defined\
    \ data types`：程序员使用基本和衍生数据类型定义这些。\n\nC 语言还支持**类型修饰符**，它可以调整基本数据类型的大小或范围。例如，`signed`\
    \ 和 `unsigned` 修饰符可以调整整数类型的范围。`short` 和 `long` 修饰符可以用于调整整数类型的大小。`long` 修饰符还可以修改\
    \ `float` 和 `double` 数据类型以增加精度。\n\nC 语言中的数据类型非常重要，因为它们有助于确保数据被正确存储和处理，防止程序中的错误和缺陷。此外，适当使用数据类型可以通过减少内存占用和提高代码效率来提高程序性能。\n\
    \n"
- fmt: "\nThe choice of data type in a C program depends on the type of data being\
    \ used and the operations being performed on that data. For example, if a program\
    \ needs to represent whole numbers, an `int` data type can be used, while if the\
    \ program needs to represent decimal numbers, a `float` or `double` data type\
    \ can be used. Choosing the appropriate data type ensures the program operates\
    \ correctly and efficiently.\n\nThe types in C can be classified in [Table 2.4](#ch02.xhtml_tab2-4):\n\
    \n| Basic types | Integer | Floating point | Char |\n| :--- | :--- | :--- | :---\
    \ |\n| Enumerated types | | | Used to declare variables that can allocate only\
    \ certain discrete integer values |\n| The type `void` | `void` indicates that\
    \ no value is available | | |\n| Derived types | Pointer Array Structure Union\
    \ Function | | |\n\nTable 2.4: Data types in C\n\nThe array and structure are\
    \ referred to as aggregate types. The return-type of a function specifies the\
    \ type of the function’s return value.\n\n[Table 2.5](#ch02.xhtml_tab2-5) gives\
    \ an account of standard types with their storage capacities and the range of\
    \ values they can store:\n\n| Serial Number | Type | Size (in bytes) | Range |\n\
    | :--- | :--- | :--- | :--- |\n| | `unsigned char` | 1 | 0 to 255 |\n| | `signed\
    \ char` or `char` | 1 | -128 to +127 |\n| | `unsigned int` | 2 | 0 to 65535 |\n\
    | | `signed int` or `int` | 2 | -32,768 to +32,767 |\n| | `unsigned short int`\
    \ | 2 | 0 to 65535 |\n| | `signed short int` or `short int` | 2 | -32,768 to +32,767\
    \ |\n| | `unsigned long int` | 4 | 0 to +4,294,967,295 |\n| | `signed long int`\
    \ or `long int` | 4 | -2,147,483,648 to +2,147,483,647 |\n| | `long double` |\
    \ 10 | 3.4E-4932 to 1.1E+4932 |\n| | `double` | 8 | 1.7E-308 to 1.7E+308 |\n|\
    \ | `float` | 4 | 3.4E-38 to 3.4E+38 |\n\nTable 2.5: C data types with storage\
    \ capacity\n\nWe may use the `sizeof` function to get the size of a type or a\
    \ variable. Syntax of the `sizeof` function is:\n\n```\nsizeof (type)\n```\n\n\
    It shows the storage size of the type in bytes. For example:\n\n```c\nprintf (\"\
    Size for int: %d\", sizeof (int));\n```\n\nOutput:\nsize for int: 2 Bytes\n\n\
    ## Variables (#contents.xhtml_sc3_68a)\n\nVariable is a designated area of memory\
    \ used by a program where data may be stored and changed. We may store and modify\
    \ values of various data types, such as floating-point numbers, integers, characters,\
    \ and so on, using variables. Throughout the course of a program’s execution,\
    \ variables can be utilized for storing and handling data. The value stored in\
    \ a variable can be changed during the execution of a program.\n\n## Variable\
    \ declaration (#contents.xhtml_sc4_69a)\n\nVariable declaration in C programming\
    \ is the process of defining a variable’s name and data type before it is used\
    \ to store values. It provides the compiler with information on the kind of data\
    \ the variable will store, enabling the compiler to allot the proper amount of\
    \ memory. To ensure correct memory allocation and type handling during program\
    \ execution, this step is essential.\n\nThe basic syntax for a declaration in\
    \ C is:\n\n```\ntype name;\n```\n\nwhere `type` specifies the data type of the\
    \ object being declared, and `name` is the identifier used to refer to the object.\n\
    \nFor example, to declare an integer variable named `num`, we would use the following\
    \ declaration statement:\n\n```c\nint num;\n```\n\nThis statement declares a variable\
    \ named `num` of type `int`.\n\n### Guidelines for declaring variables (#contents.xhtml_sc4_70a)\n\
    \nWhen defining variables in C, there are certain standards and guidelines to\
    \ follow. By following these guidelines, we can make our code more organized,\
    \ legible, and error-free. The main guidelines for declaring variables in C are\
    \ as follows:\n\n*   **Valid variable names**: Variable names must begin with\
    \ an uppercase or lowercase letter or with an underscore (`_`). Variable names\
    \ may include letters, numbers, and underscores after the first character. Variable\
    \ names are case-sensitive, so `Var` and `var` are considered as two separate\
    \ variables.\n*   **Avoid key keywords**: The reserved words defined for C, known\
    \ as keywords, cannot be used as variable names. We cannot declare a variable\
    \ with the names like `if`, `for`, `break`, and more.\n*   **Use descriptive and\
    \ meaningful names**: We should use such names for variables that are evocative\
    \ of their function. This improves the readability and comprehension of our code.\n\
    *   **Do not use special characters**: Special characters like `@`, `#`, `$`,\
    \ `%`, and so on, are not permitted in variable names.\n*   **Do not use spaces**:\
    \ Spaces are not permitted in variable names.\n*   **Use of underscores**: We\
    \ should select a naming pattern for variable names with multiple words like the\
    \ roll number of a student can be stored in a variable named `Roll_No`.\n*   **Avoid\
    \ underscore and uppercase at the beginning**: In C, names that begin with an\
    \ underscore and an uppercase letter are frequently reserved for system and library\
    \ usage.\n*   **Data type declaration**: Before being utilized, variables must\
    \ be defined with their data types. Examples are `int` and `double`.\n*   **Initialization**:\
    \ When a variable is declared, it can be initialized. `int count = 0;` is an example.\n\
    *   **Declare before use**: For variables to be used in C, they must first be\
    \ declared. We cannot declare variables with the same name more than once within\
    \ the same scope shown below:\n\n```c\nint main () {\n    int x = 15;\n    int\
    \ x = 20;\n    printf (\"x = %d\", x);\n}\n```\nOutput: ERROR!\n\n**Using typedef**:\
    \ Using `typedef` to create user-defined types is also possible in C. The basic\
    \ syntax for `typedef` is:\n\n```\ntypedef type new_type;\n```\n\nWhere `type`\
    \ is an existing data type, and `new_type` is the new name. For example, to create\
    \ a new type called `myint` that is equivalent to `int`, we would use:\n\n```c\n\
    typedef int myint;\n```\n\nAfter this declaration, we can use `myint` as a synonym\
    \ for `int`.\n\n## Initialization (#contents.xhtml_sc4_71a)\n\nInitialization\
    \ in C refers to assigning an initial value to a variable or array when declared.\
    \ Initialization can be done using an equal sign (`=`) or braces (`{}`) followed\
    \ by a list of values called an initializer. The syntax for initialization depends\
    \ on the data type of the variable or array.\n\nSome examples of initialization\
    \ in basic types:\n\n```c\nint x = 10;\nfloat y = 3.14;\nchar c = 'A';\n```\n\n\
    Similarly, as discussed in the upcoming chapters, we can initialize other derived\
    \ data types, like array structures and pointers. Initialization ensures that\
    \ variables and arrays have an appropriate value when used in a program. Uninitialized\
    \ variables can contain unpredictable values, which can cause bugs and unexpected\
    \ behavior in the program.\n\n## Identifiers (#contents.xhtml_sc3_72a)\n\nAn identifier\
    \ is a name assigned to an entity in a program. The entities include a variable,\
    \ function, class, or other programming constructs. Identifiers are used to uniquely\
    \ identify these entities inside the code. They are composed of letters (uppercase\
    \ and lowercase), numbers, and underscores (`_`) and must follow certain rules.\
    \ Identifiers are used to enhance the program code readability and to identify\
    \ program elements by meaningful names.\n\nSome of the rules for naming identifiers\
    \ in C are:\n\n*   They must begin with a letter or an underscore and can consist\
    \ of uppercase or lowercase letters, digits, and underscores.\n*   In C, the identifiers\
    \ are case-sensitive.\n*   Identifiers should be named as descriptive and meaningful\
    \ in the context in which they are used. For example, `salary` is an appropriate\
    \ name for an identifier rather than `s`.\n*   Identifiers should not have special\
    \ characters or spaces (@ or #).\n*   The name of an identifier cannot be a global\
    \ identifier, for example, (`__TIME__`, `__LINE__`, `__TINY__`, `__SMALL__`, `__FILE__`,\
    \ `__DATE__`, and so on.)\n"
  raw: "The choice of data type in a C program depends on the type of data being used\
    \ and the operations being performed on that data. For example, if a program needs\
    \ to represent whole numbers, an int data type can be used, while if the program\
    \ needs to represent decimal numbers, a float or double data type can be used.\
    \ Choosing the appropriate data type ensures the program operates correctly and\
    \ efficiently.\n\nThe types in C can be classified in [Table 2.4](#ch02.xhtml_tab2-4):\n\
    \n| Basic types | IntegerFloating pointChar |\n\n| Enumerated types | Used to\
