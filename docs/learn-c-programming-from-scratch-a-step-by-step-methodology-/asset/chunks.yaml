    To execute C programs on the Windows operating system (This book portrays examples
    executed on the Windows platform), we need to install software/ IDE like `Turbo
    C`, `Dev C++`, `NetBeans`, `Code::Blocks`, and more.


    ## Integrated Development Environment


    We use an IDE to write program code. It aids a programmer in easily designing
    programs by lending a comprehensive set of services required for program designing.
    IDE improves the productivity of a programmer with the help of various tools.
    Using an IDE, we can run, debug, document, execute, and translate a program.


    Mainly, an IDE includes three parts:


    *   Source code editor: For writing source code/ instructions.

    *   Automation tool: To compile the source code.

    *   Debugger: To eradicate errors/ bugs from the code.


    IDEs come with features like object and data modeling, testing, and source code
    libraries. Currently, there are IDEs available for several programming languages,
    including C. Many IDEs even have intelligent code autocompletion options to enrich
    the programmer’s experience. Let us discuss some IDEs you may use for coding in
    C.


    ## GCC


    The free software foundation created the `GCC` compiler, often used using a command
    line interface and based on Linux. If we use a UNIX or Linux variation, it is
    probably already installed on our machine because it is frequently packed and
    installed with Linux installations. We can invoke `GCC` on a source code file
    by typing `gcc filename`.


    The default executable output of `GCC` is `a.out`, which can be executed by typing
    `./a.out`. It is also permissible to specify a name for the executable file on
    the command line by writing `-o outputfile`, as shown below:


    ```

    gcc filename -o outputfile

    ```


    Again,`./outputfile` may be used to execute your program. (The `./` ensures the
    program is executed for the current working directory). You must specifically
    ask it to connect with that library if we need to utilize functions from the math
    library (often, `math.h` functions like `sin` or `sqrt`).


    Note: If we need to use functions from the math library (generally functions from
    `math.h` such as `sin` or `sqrt`), then you need to explicitly ask it to link
    with that library with the `-l` flag and the library `m`: `gcc filename -o outputfile
    -lm`.


    ## Visual Studio Code


    Visual Studio Code (`VS Code`) is a good IDE for C programming overall because
    of its robust features, sizable extension library, and cross-platform compatibility.
    A sophisticated C programming environment may be created with the appropriate
    plugins and configurations in `VS Code`. Refer to the following [Figure 2.2] for
    VSE Code IDE:


    ![](images/Figure_2.2.png)


    Figure 2.2: VSE Code IDE


    `VS Code` is a popular code editor for various programming languages, including
    C. The following characteristics of `VS Code` make it a fantastic option for C
    programming:


    *   IntelliSense: When writing C code, `VS Code`’s intelligent code completion
    system (`IntelliSense`) saves our time by suggesting code snippets and function
    definitions.

    *   Debugging: The robust debugging mechanism in `VS Code` can assist you in locating
    and resolving errors in your C programs.

    *   Extensions: `VS Code` has many add-ons that provide additional C programming
    features, such as syntax highlighting, code formatting, and tool interaction.

    *   Integration of the terminal: `VS Code` has a built-in terminal that enables
    us to execute C programs right from the editor, which is particularly useful for
    debugging.

    *   Git support: `VS Code` comes with Git support included, simplifying maintaining
    C projects.

    *   Cross-platform compatibility: You can use `VS Code` on practically any platform
    because it is available for Windows, macOS, and Linux.


    ## Turbo C++ for Windows 10+


    `Turbo C/ C++` is an IDE for writing code in the C programming language. `Turbo
    C++` is the advanced form of `Turbo C`, which could also be used for C language
    programming.


    Note: C++ compiler supports the C language syntax as C++ language is built on
    top of the C programming language.


    To download `Turbo C++` for Windows, simply google `Turbo C++` and download it
    from some authentic website.


    ![](images/Figure_2.3.png)


    Figure 2.3: Turbo C/ C++ setup


    [Figure 2.3] appears when we start the Turbo C/ C++ setup. Just click Next and
    follow the instructions on the subsequent screens while installing the software.


    Now to complete the setup, click Finish. Refer to the following [Figure 2.4]:


    ![](images/Figure_2.4.png)


    Figure 2.4: Completing setup


    Next, open the program by clicking the Start menu | All Programs. Refer to the
    [Figure 2.5]:


    ![](images/Figure_2.5.png)


