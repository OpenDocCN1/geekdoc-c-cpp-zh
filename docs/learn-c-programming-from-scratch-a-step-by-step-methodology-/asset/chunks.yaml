    **Dedicated to** the pillars of my life – my beloved parents and family members.
    In recognition of your unwavering support, boundless encouragement, and enduring
    belief in my dreams, this book on C programming is dedicated to you. Your love
    and guidance have been the foundation upon which I built my journey in the world
    of programming.


    # About Author


    Mohammad Saleem Mir is currently working as Senior Assistant Professor at Higher
    Education Department, J&K, India. He has more than 15 years of teaching experience.
    During the course of his journey as a Teacher, he has taught general all the subjects
    associated to computer but took lead when guiding students through Programming
    subjects with the aim of building strong analytical skills and inculcate logical
    reasoning into the students. The author holds bachelor’s degree and Master’s Degree
    in Computer Applications from Kashmir University and is currently pursuing PhD
    in the fields of Machine Learning/Artificial Intelligence. He has published a
    number of research papers in national as well as international Journals besides
    presenting his research in various conferences. The author has delivered inspirational
    talks and Refresher courses conducted by Universities and colleges and remains
    actively involved in technical seminars and workshops.


    # About Reviewer


    Srividya Richard, is a passionate and dedicated educator with Masters of Engineering
    in Computer Science from Anna University. She considers herself as a self-confident
    and enthusiastic person with a flair to logically conclude any given task with
    complete precision and accuracy. She has a decade long experience in teaching
    graduates at a reputed institution. Her research interests lie in the area of
    Machine learning, Data Analytics, Artificial Intelligence. She has published many
    research articles in refereed journals that ranges from research thesis to books.
    During her academic career, Sri had the opportunity to mentor and execute several
    real time projects. She has also conducted various trainings and served as a committee
    member in organizing conferences and seminars. The exposure to interdisciplinary
    projects and industry interactions has had a significant impact on honing her
    skills. As an AI enthusiast, Sri is delighted to embark on the path of equipping
    professionals with AI skills. She looks forward to leveraging the expertise gained
    over the years to empower individuals for both personal and professional development.


    # Acknowledgement


    This book is my first experience to pen down something for my esteemed readers.
    I sincerely hope they would appreciate it and let me an honest review of the book.
    I would like to acknowledge with gratitude the support and love of my family.
    They all kept me going, and conceiving this book would not have been possible
    without their support and encouragement.


    I am also grateful to BPB Publications for their guidance and expertise in bringing
    this book to fruition. It was a long journey of revising this book with valuable
    participation and collaboration of reviewers, technical experts, and editors.


    Finally, I would like to thank all the readers who have taken an interest in my
    book and for their support in making it a reality. Your encouragement has been
    invaluable.


    # Preface


    I feel grateful to share my knowledge, analyses, and conclusions to raise the
    level of curiosity with regards to programming among the students of computer
    sciences; at the end of the day, we all will be beneficiaries. When one chooses
    computer sciences as a career, it may be noted that programming is an indispensable
    part of computer sciences and one cannot be a good computer scientist unless he/she
    is a good programmer. Well begun is half done, as they famously say; beginning
    on a good note knowing fundamentals of programming clearly and building a solid
    base far taking up more advanced form of programming later in your career is important.
    For this reason, this book focuses on giving an insight into the fundamentals
    of programming beforehand and a sincere effort has been made to cover major concepts
    in detail so that the readers are kept interested.


    `C` is a foundational programming language and ought to be learned systematically.
    Getting measure of the features of `C` programming is very important. This book
    covers all the fundamental concepts, rest assured the readers would have a great
    time going through the book contents and would benefit from this book. The book
    is written in unpretentious manner. The target audience being programming beginners
    would be able to understand the concepts explained in the book quite easily. Each
    concept in the book is synchronously supplemented by coding examples to enhance
    clarity. The book has the following 10 chapters:


    - [Chapter 1: Programming Methodology](#ch01.xhtml) – In this introduces you to
    the world of Programming Methodology, Problem Solving, Program Design etc.

    - [Chapter 2: C Programming Fundamentals](#ch02.xhtml) – This chapter would acquaint
    you to the basic structure of the `C` Programming language, coding environment,
    and the syntax and references to write `C` Programs.

    - [Chapter 3: Control Statements](#ch03.xhtml) – This chapter throws light on
    various control statements used in `C` programming.

    - [Chapter 4: Functions](#ch04.xhtml) – This chapter gives an account of perhaps
    the most important topic in programming languages that is, functions.

    - [Chapter 5: Arrays](#ch05.xhtml) – In this chapter, we will introduce arrays,
    multi-dimensional arrays, strings and more how we can work with them.

    - [Chapter 6: Pointers](#ch06.xhtml) – In this chapter, we will learn about pointers,
    a concept that is found difficult by the programming novices, but not anymore.

    - [Chapter 7: Structures and Unions](#ch07.xhtml) – In this chapter, we will learn
    to work with user defined data types like Structures and Unions.

    - [Chapter 8: File Handling](#ch08.xhtml) – In this chapter, we will learn about
    how to work with hard disk files and different associated operations with programming
    examples.

