    \ 114\n\n[Random access files](#contents.xhtml_sc3_317a)\n\nIn C, random access\
    \ files offer a potent method for non-sequential data storage and retrieval. Random\
    \ access files (also known as seekable files) enable direct access to certain\
    \ areas within the file, in contrast to sequential access files, which call for\
    \ reading or writing data in a linear manner ([Figure 8.5](#ch08.xhtml_fig8-5)).\
    \ Every record in a random-access file possesses a distinct identifier (like a\
    \ key or record number) that may be used to find and access that particular record.\
    \ Using this identifier, we may go to any record. In C, Random access files are\
    \ generally implemented using file position indicators which allows us to traverse\
    \ to a specific location within a file. Random data access enables flexibility\
    \ and effectiveness in managing massive volumes of data. We will examine the idea,\
    \ application, benefits, and examples of random-access files in C programming\
    \ in this thorough investigation. Please refer to the following figure:\n\n![](images/Figure_8.6.png)\n\
    \nFigure 8.6: Random access files\n\nDirectly onto a disk or other secondary storage\
    \ devices, structured data is stored using random access files, commonly known\
    \ as binary files. Random access files offer direct read and write operations\
    \ at any place inside the file, in contrast to sequential access files.\n\n[File\
    \ position indicator](#contents.xhtml_sc4_318a)\n\nC offers a file position indicator,\
    \ which is effectively a pointer that tracks the current place inside the file\
    \ to enable random access. It shows the offset in bytes between the file’s start\
    \ and the current location.\n\n[Opening random access files](#contents.xhtml_sc4_319a)\n\
    \nWe must open the file in the correct mode in order to work with random access\
    \ files. A file can be opened in C using the fopen() function, which also returns\
    \ a file reference. You can use the rb+ mode for reading and writing operations\
    \ to open a file for random access. In this mode, binary data can be read from\
    \ and written to the file.\n\n[Writing data](#contents.xhtml_sc4_320a)\n\nTo write\
    \ data to a specified location in a random access file, use the fseek() method\
    \ first to set the file position indication. The file pointer, the offset (in\
    \ bytes) from the origin, and the origin are the only inputs for the fseek() function.\
    \ We may use the fwrite() method to write data thereafter specifying the position.\n\
    \n[Reading data](#contents.xhtml_sc4_321a)\n\nWhen reading data from a random\
    \ access file, you must first set the file position indication using the fseek()\
    \ function to the appropriate location, just like when writing data. The fread()\
    \ method can be used to read data from the designated place after the position\
    \ has been defined.\n\n[Advantages of random-access files](#contents.xhtml_sc4_322a)\n\
    \nThe advantages of the random-access files have been discussed below:\n\n*  \
    \ Flexibility: Without executing the full file sequentially, random access files\
    \ allow for immediate access to and modification of selected data. As a result,\
    \ data may be stored and retrieved effectively.\n*   Effective updates: Random\
    \ access files make it simple to update or edit a single record or piece of data\
    \ without having to rewrite the entire file. As a result, programs that require\
    \ frequent updates or adjustments benefit from using random access files.\n\n\
    Effective search: Efficient search operations are made possible by random access\
    \ files. You may instantly get the necessary data without browsing the full file\
    \ by setting the file position indication to the correct point.\n\n*   Support\
    \ for complicated data structures: Random access files may quickly store and retrieve\
    \ complicated data structures, including arrays, structures, and linked lists.\n\
    \n[Examples of random-access files in C](#contents.xhtml_sc4_323a)\n\nFollowing\
    \ are two day-to-day examples that demonstrate the usage of random-access files\
    \ in C:\n\n*   Management of student records: The application keeps track of and\
    \ manages student records in a random-access file. The user may search for student\
    \ records as well as add, amend, and remove student records. Based on the student\
    \ ID, the file position indication is utilized to obtain the necessary record.\n\
    *   Inventory management: The application uses a random-access file to manage\
    \ a product inventory. It enables the user to browse, search, and add, amend,\
    \ and remove product information. Based on the product code, the file location\
    \ indicator is utilized to retrieve the particular product record.\n\nIn C, random\
    \ access files offer a flexible and effective mechanism to store and retrieve\
    \ data in an asynchronous fashion. They provide you the freedom to directly access\
    \ and alter a file’s contents, making it possible to update data quickly, conduct\
    \ searches, and support intricate data structures. Programmers may use this potent\
    \ capability to manage and modify vast volumes of data by mastering the ideas\
    \ and procedures involved in dealing with random access files.\n\n[Programs on\
    \ random access files in C](#contents.xhtml_sc4_324a)\n\nSome examples of programs\
