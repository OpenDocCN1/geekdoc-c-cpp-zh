- fmt: "\n# Flowchart\n\nFlowchart is a means to visually present the flow of data\
    \ through an information processing system, the operations performed within the\
    \ system, and the sequence in which they are performed. We shall concern ourselves\
    \ with the program flowchart, which describes what operations (and in what sequence)\
    \ are required to solve a given problem.\n\nThe program flowchart can be likened\
    \ to the blueprint of a building. As we know, a designer draws a blueprint before\
    \ starting construction on a building. Similarly, a programmer prefers to draw\
    \ a flowchart prior to writing a program. As in the case of drawing a blueprint,\
    \ the flowchart is drawn according to defined rules and using standard symbols\
    \ prescribed by the American National Standard (ANSI).\n\n## History of flowcharts\n\
    \nFlowcharts were introduced by Frank Gilbert in 1921, and they were called Process\
    \ Flowcharts at the beginning. Allan H. Mogensen is credited with training businesspeople\
    \ on the use of.\n\n## Flowchart symbols\n\nBefore drawing flowcharts, we need\
    \ to understand the different symbols used in flowcharts. Most people are aware\
    \ of basic symbols like processes and decision blocks. But there are many more\
    \ symbols to make your flowchart meaningful. \n\nCheck the flowchart symbols (`http://creately.com/diagram-type/objects/flowcharts`)\
    \ for a detailed explanation. Although these are the standard symbols available,\
    \ some people use different shapes for different meanings like sequential access\
    \ storage, direct data, manual input. The most common example of this is using\
    \ circles to denote the start and end. Figure 1.7 shows all the standard symbols:\n\
    \n![](images/1.7.png\nFigure 1.7: Flowchart symbols\n\nFlowcharts can be categorized\
    \ into four main types:\n*   Document flowchart\n*   System flowchart\n*   Data\
    \ flowchart\n*   Program flowchart\n\n## Meaning of a flowchart\n\nFlowchart is\
    \ a diagrammatic depiction that shows the series of steps that must be taken to\
    \ solve an issue. Typically, flowcharts are created in the initial stages of developing\
    \ solutions. Flowcharts make it easier for businesspeople to communicate. These\
    \ flowcharts are essential for programming and are very useful for deciphering\
    \ the reasoning behind challenging issues. As a result, it is required for improved\
    \ program documentation.\n\n### Flowchart design guidelines\n\n*   In drawing\
    \ a proper flowchart, all necessary requirements should be listed in logical order.\n\
    *   The flowchart should be unambiguous, clear, neat, and easy to comprehend.\n\
    *   The direction of the flow of a procedure is from top to bottom (or left to\
    \ right).\n*   Only one flow line must come out of a process symbol.\n*   A single\
    \ flow line must enter a decision symbol. However, more than one flow line may\
    \ emanate the decision symbol.\n*   A single flow line is used in concurrence\
    \ with a terminal symbol.\n*   Briefly express yourself via common symbols.\n\
    *   In case the flowchart becomes complex, we may use connector symbols to decrease\
    \ the number of flow lines. We must also avoid the intersection of flow lines\
    \ for the sake of clarity.\n*   We must ensure that a flowchart has a logical\
    \ start and finish.\n*   It is useful to validate the flowchart by passing through\
    \ various test runs.\n\n## Flowchart examples\n\n### Sequential flow-based flowcharts\n\
    \nThe following are some examples for the sequential-based flowcharts:\n\n![](images/1.8.png\n\
    Figure 1.8: Flowchart to display a message\n\n![](images/1.9.png\nFigure 1.9:\
    \ Flowchart to add two numbers\n\n![](images/1.10.png\nFigure 1.10: Flowchart\
    \ to find the percentage of students in 3 subjects\n\n![](images/1.11.png\nFigure\
    \ 1.11: Flowchart to find the simple interest\n\n![](images/1.12.png\nFigure 1.12:\
    \ Flowchart to find the average of two numbers\n\n![](images/1.13.png\nFigure\
    \ 1.13: Flowchart to find the area of a circle\n\n![](images/1.14.png\nFigure\
    \ 1.14: Flowchart to find the area of a rectangle\n\n### Condition-based flowchart\n\
    \nA condition-based flowchart, sometimes known as a decision-making flowchart\
    \ or conditional flowchart, is a graphic representation that shows the order in\
    \ which steps or actions should be executed in a process depending on particular\
    \ circumstances or criteria. It is a tool used to show how a process works and\
    \ how it reacts to different inputs and circumstances.\n\nThe following are some\
    \ instances of condition-based flowcharts:\n\n![](images/1.15.png\nFigure 1.15:\
    \ Flowchart to find whether a given number is positive or negative\n\n![](images/1.16.png\n\
    Figure 1.16: Flowchart to find the larger number among two numbers\n\n### Loop-based\
    \ flowcharts\n\nA loop-based flowchart is a visual representation used to show\
    \ the order of operations in a process, algorithm, or software application that\
    \ contains repetition. Loops are used to carry out a certain set of instructions\
    \ continuously until a particular condition is fulfilled in programming and process\
    \ design. This repetition pattern is graphically represented by a loop-based flowchart.\n\
    \n![](images/1.17.png\nFigure 1.17: Print a test message five times\n\n![](images/1.18.png\n\
    Figure 1.18: Print first ten natural numbers (1 to 10)\n\n![](images/1.19.png\n\
    Figure 1.19: Flowchart to print the sum of the first ten natural numbers\n\n###\
    \ Nested conditions\n\nWhen decision symbols are nested within other decision\
    \ symbols in a flowchart, a hierarchical structure is formed that can accommodate\
    \ more complicated logic. This is frequently used to illustrate situations where\
    \ several conditions must be assessed in a particular sequence.\n\n![](images/1.20.png\n\
    Figure 1.20: Flowchart to print 1-digit even numbers\n\n### Finite and infinite\
    \ loop\n\nIn looping statements, a finite loop is one in which a series of statements\
    \ is run `n` times (a predetermined number of times). The term infinite loop refers\
    \ to a situation in which a collection of assertions is repeated indefinitely\
    \ without reaching a conclusion. For instance, if we do not increase the value\
    \ of the index `I`, we will have an unending (infinite) loop.\n\n![](images/1.22.png\n\
    Figure 1.22: Flowchart to describe an infinite loop\n\n## Conclusion\n\nAs we\
    \ come to the end of this initial chapter, we have established the fundamental\
    \ groundwork for your journey into the realm of C programming. From comprehending\
    \ the intricacies of computer systems to gaining a firm grasp of programming methodologies,\
    \ we have provided you with essential building blocks to start your exploration.\n\
    \nBy acknowledging the role of computers as effective problem solvers, we have\
    \ broadened your understanding of their capabilities. We have delved into the\
    \ systematic approaches employed in programming and harnessed the power of algorithms\
    \ to streamline tasks for optimal efficiency.\n"
