    \n![](images/fm1.png)\n\n# [CHAPTER 9C Preprocessors](#contents.xhtml_ch09a)\n\
    \n[Introduction](#contents.xhtml_sc2_341a)\n\nWelcome to the fascinating world\
    \ of C programming preprocessors! In this chapter, we dive into the powerful features\
    \ and functionalities offered by C preprocessors. Preprocessors play a crucial\
    \ role in code manipulation and optimization, providing ways to customize and\
    \ control the compilation process. Understanding preprocessors and their directives\
    \ is essential for any C programmer looking to enhance their code’s efficiency\
    \ and maintainability. So, let us embark on this journey to explore the ins and\
    \ outs of C preprocessors!\n\n[Structure](#contents.xhtml_sc2_342a)\n\nThe following\
    \ topics are discussed in the chapter:\n\n*   Preprocessors\n*   Conditional compilation\n\
    *   Control structure macros\n*   Types of preprocessor directives\n*   Macro\
    \ versus functions\n*   Conditional compilation\n*   Preprocessor directives\n\
    *   ANSI C predefined macros\n*   Preprocessor operators\n*   C-header files\n\
    *   Once-only headers\n*   Using #ifdef for different computer types\n\n[Objectives](#contents.xhtml_sc2_343a)\n\
    \nIn this chapter, readers will delve into the realm of C preprocessors, exploring\
    \ essential directives and operators that play a pivotal role in code optimization\
    \ and organization. They will gain mastery over #define, #ifdef, #ifndef, #include,\
    \ #undef, and conditional compilation using #if, #else, #elif, and #endif macros.\
    \ Additionally, readers will learn the intricacies of preprocessor operators such\
    \ as (\\) for macro continuation, (#) for stringizing, (##) for token pasting,\
    \ and defined() for conditional checks. The chapter will also cover C-header files,\
    \ once-only headers, and the usage of #ifdef to adapt code for various computer\
    \ types, enhancing code portability. By the end of this chapter, readers will\
    \ emerge with advanced C programming skills, empowered to employ preprocessors\
    \ adeptly and optimize code for flexibility and efficiency.\n\n[Introduction to\
    \ preprocessors](#contents.xhtml_sc2_344a)\n\nPreprocessors allow the text processing\
    \ in C programs to be completed before compilation. A preprocessor is used to\
    \ modify a C program before compilation. The preprocessor searches the program\
    \ for the preprocessor directives or instructions that it can understand. The\
    \ # (hash) sign denotes a preprocessor directive. A preprocessor directive must\
    \ start in the first column for readability and be the first non-blank character.\
    \ Compilers for C++ employ the same C preprocessor. Refer to [Figure 9.1](#ch09.xhtml_fig9-1):\n\
    \n![](images/Figure_9.1.png)\n\nFigure 9.1: Life cycle of C program\n\nBefore\
    \ the compiler begins producing our code, the preprocessor does preparatory actions\
    \ (conditional compiling and more.). The preprocessor’s output is likewise text,\
    \ so these changes are lexical.\n\nIn simple terms, a C preprocessor is a text\
    \ replacement tool that gives the compiler the necessary (pre) processing instructions\
    \ before the compilation process takes over. The main preprocessor directives\
    \ supported in C include:\n\n*   #define\n*   #include\n*   #ifdef\n*   #ifndef\n\
    *   #undef\n*   #if\n*   #else\n*   #elif\n*   #endif\n*   #pragma\n*   #error\n\
    \n[#define directive](#contents.xhtml_sc3_345a)\n\nThe #define directive is a\
    \ preprocessor directive used in C programming to define macros. Before the code\
    \ is compiled, symbolic names or constants are replaced with their corresponding\
    \ values.\n\nSyntax:\n\n#define macro_name replacement_text\n\nwhere:\n\n*   macro_name\
    \ is the name of the macro,\n*   replacement_text is the text/value that the macro\
    \ will be replaced with,\n*   replacement_text can be any valid C expression,\
    \ literal value, or macro.\n\nFor the macro to be accessible throughout the program,\
    \ the #define directive is normally included at the beginning of the code before\
    \ any function definitions. Here are some examples to illustrate the usage of\
    \ the #define directive:\n\n[Defining a constant macro](#contents.xhtml_sc4_346a)\n\
    \nConsider #define PIE 3.14\n\nIn this example, PIE is defined as a macro with\
    \ the value 3.14, which means PIE will be replaced with 3.14 wherever it appears\
    \ in the source code/ program.\n\n[Defining a function-like macro](#contents.xhtml_sc4_347a)\n\
    \nConsider #define SQR (n) ((n) * (n))\n\nIn this example, SQR is defined as a\
    \ macro that takes one argument n (a number) and returns the square of that number.\
    \ The macro can be used like a function, and the argument will be substituted\
    \ by the replacement_text.\n\n[Defining a conditional macro](#contents.xhtml_sc4_348a)\n\
    \nConsider:\n\n#define DEBUG_ENABLED\n\n#ifdef DEBUG_ENABLED\n\n// code here\n\
    \n#endif\n\nThe DEBUG_ENABLED macro is defined in this example without a value.\
    \ The conditional block’s code will only be compiled if the DEBUG_ENABLED macro\
    \ is specified, thanks to the #ifdef directive. This is frequently used to activate\
    \ or disable debug code blocks selectively.\n\n[Redefining a macro](#contents.xhtml_sc4_349a)\n\
    \nIn the example shown below, the MARKS macro is redefined in this example. The\
    \ most recent definition will supersede earlier versions. As a result, throughout\
    \ the code, the variable MARKS will have the value 160.\n\n#define MARKS 125\n\
    \n#define MARKS 160\n\nThe C preprocessor’s strong #define directive enables you\
    \ to write macros for reusing code, constants, conditional compilation, and other\
    \ purposes. To ensure readability and maintainability of the code, macros should\
    \ be used carefully, and any side effects of their replacements should be considered.\n\
    \n[#ifdef preprocessor](#contents.xhtml_sc3_350a)\n\n#ifdef preprocessor is a\
    \ directive used for conditional compilation in C programming. Depending on whether\
    \ a certain macro is specified or not, it enables you to include or omit particular\
    \ code blocks from compilation. This might be helpful when you wish to have various\
    \ code paths or configurations for various build settings or circumstances.\n\n\
    Syntax:\n\n#ifdef macro\n\n// control goes here if the macro is defined\n\n#else\n\
    \n// else control goes here\n\n#endif\n\nIf macro is defined using #define, the\
    \ code between #ifdef and #else will be included during compilation.\n\nIf macro\
    \ is not defined, the code between #else and #endif will be included during compilation.\n\
    \nExample:\n\n#include <stdio.h>\n\n#define DEBUG // Uncomment this line to enable\
    \ debugging\n\nint main ()\n\n{\n\n#ifdef DEBUG\n\nprintf (\"Debugging is enabled!\\\
    n\");\n\n#else\n\nprintf (\"Debugging is disabled!\\n\");\n\n#endif\n\nreturn(0);\n\
    \n}\n\nHere, if you have #define DEBUG uncommented at the beginning of the program,\
    \ the output will be:\n\nDebugging is enabled!\n\nIf the #define DEBUG line is\
    \ commented out or removed, the output will be:\n\nDebugging is disabled!\n\n\
    By using #ifdef and related preprocessor directives, you can control which parts\
    \ of your code are compiled based on the defined macros, allowing for more flexible\
    \ and customizable code behavior.\n\n[#ifndef preprocessor](#contents.xhtml_sc3_351a)\n\
    \n#ifndef preprocessor is a directive used in C programming to determine whether\
    \ a specific macro has been defined or not. The word ifndef stands for if not\
    \ defined. In order to manage conditional compilation, the #ifndef directive is\
    \ often used in conjunction with the #ifdef directive (which stands for if defined).\n\
    \nSyntax:\n\n#ifndef MACRO\n\n// Code to compile when MACRO is NOT defined\n\n\
    #endif\n\nIn the above code:\n\n*   The code between #ifndef and #endif will be\
    \ included for compilation if the macro given by MACRO has not been declared using\
    \ #define.\n*   If the macro MACRO_NAME has already been created using the #define\
    \ directive, the code between #ifndef and #endif will be skipped, and the preprocessor\
    \ will advance to the code after the #endif directive.\n\nIn order to prevent\
    \ repeated inclusions, header guards are frequently created in header files using\
    \ this approach. Consider the header file example.h as an illustration:\n\n#ifndef\
    \ EXAMPLE_H\n\n// Header guard to prevent multiple inclusions\n\n#define EXAMPLE_H\
    \ // Header file content\n\n#endif\n\nThe header guard ensures that this header\
    \ file’s contents are only included once when it is included in multiple source\
    \ files, regardless of where it is included in the program.\n\nC programmers may\
    \ make their code more structured and effective by utilizing the #ifndef and #ifdef\
    \ directives to control which sections of code are included during compilation\
    \ based on the presence or absence of particular macros.\n\n[#include preprocessor](#contents.xhtml_sc3_352a)\n\
    \nTo include external files in your C program, use the #include preprocessor directive.\
    \ It enables you to include code from other files, such as header files, and make\
    \ it available in the source file you are now working with.\n\nA C source file\
    \ will normally begin with the #include directive before any function definitions\
    \ or executable code.\n\nSyntax:\n\n#include <filename>\n\n#include \"filename\"\
    \n\nThe #include directive has two versions depending on whether angle brackets\
    \ (‘>’) or double quotes (‘\"\"’) are used:\n\n*   Using angle brackets (‘>’)\n\
    \nThe preprocessor looks for a file in the default system directories when you\
    \ include a file using angle brackets. System-level header files are often found\
    \ in these folders.\n\nExample:\n\n#include <stdio.h>\n\n*   Using double quotes\
    \ (`\"\"`):\n\nWhen you use double quotes to include a file, the preprocessor\
    \ initially looks in the current directory for the file. The standard system directories\
    \ are then searched if not found in the current directory.\n\nExample:\n\n#include\
    \ \"myhdrfile.h\"\n\nPlease take note that the actual name of the file you wish\
    \ to add should be substituted for the <filename> or \"filename\".\n\nInclude\
    \ header files, which often include function prototypes, type definitions, and\
    \ macros used in numerous source files, by using the #include directive. You may\
    \ utilize the specified functions and symbols in your code without having to redefine\
    \ them by adding the required header files.\n\nExample:\n\nmain.c:\n\n#include\
    \ <stdio.h> // standard library header file\n\n#include \"myhdrfile.h\" // user-defined\
    \ header file\n\nint main ()\n\n{\n\n// Code here...\n\nreturn(0);\n\n}\n\nmyhdrfile.h:\n\
    \n// Function declaration\n\nvoid myFunction();\n\n#endif\n\nWe may modularize\
    \ our code, separate declarations from definitions, and make our code more reusable\
    \ and manageable by utilizing the #include directive.\n\nNote: Before utilizing\
    \ needed declarations in our code, it is crucial to confirm that the appropriate\
    \ header files are present.\n\n[#undef preprocessor](#contents.xhtml_sc3_353a)\n\
    \nA previously declared macro can be removed or undefined in C by using the preprocessor\
    \ command #undef. You may use this to make a macro declaration unusable in code\
    \ by removing it from the preprocessor symbol table.\n\nSyntax:\n\n#undef MACRO\n\
    \nWhere, MACRO is the name of the macro that we want to undefine.\n\nImportant\
    \ points to keep in mind concerning the #undef directive are discussed below:\n\
    \n*   Undefining a macro:\n\n    The MACRO_NAME defined macro is deleted from\
    \ the symbol table when the #undef command is encountered. The code will interpret\
    \ further references to that macro as ordinary identifiers rather than macro invocations.\n\
    \n*   Removing macro definitions:\n\n    The #undef directive just eliminates\
    \ the macro definition; it leaves all related code and statements in place. The\
    \ program will still contain any code that is dependent on the macro.\n\n*   Errors\
    \ and warnings:\n\n    The preprocessor will alert you but still execute the code\
    \ if you attempt to #undef a macro that has not already been declared. Before\
    \ attempting to undefine a macro, it is typically wise to check to see if it is\
    \ defined.\n\n    Example to illustrate the usage of #undef:\n\n    #include <stdio.h>\n\
    \n    #define PI 3.14\n\n    int main ()\n\n    {\n\n    printf (\"Value of PI:\
    \ %f\\n\", PI);\n\n    #undef PI\n\n    printf (\"After undefining PI\\n\");\n\
    \n    // Uncommenting the line below will result in a compilation error\n\n  \
    \  // printf (\"Value of PI: %f\\n\", PI);\n\n    return (0);\n\n    }\n\nIn the\
    \ above code, the macro PI is defined with a value of 3.14. However, after the\
    \ #undef PI directive, the macro is no longer defined. An attempt to use PI in\
    \ the code after the #undef directive shall result in a compilation error.\n\n\
    When you need to redefine a macro with a different value or behavior, temporarily\
    \ delete or deactivate a macro definition, or both, the #undef directive might\
    \ be helpful. It gives you freedom in how you manage macros in your codebase.\n\
    \nIf a certain macro is defined, a code block can be conditionally compiled using\
    \ the C preprocessor command #ifdef. On the basis of the presence of a certain\
    \ macro definition, it enables you to include or exclude particular code blocks.\n\
    \nSyntax:\n\n#ifdef MACRO\n\n// Code to be compiled if the macro is defined\n\n\
    #else\n\n// Code to be compiled if the macro is not defined\n\n#endif\n\nHow #ifdef\
    \ works:\n\n*   If the macro MACRO is created earlier in the code using a #define\
    \ directive or by giving the compiler a command-line option, the code block between\
    \ #ifdef and #else (if present) will be compiled.\n*   If the macro MACRO is not\
    \ specified, the code block between #else (if present) and #endif will be compiled,\
    \ or if there is no #else, that code block will be completely skipped.\n\nExample:\n\
    \n#include <stdio.h>\n\n#define DEBUG\n\nint main()\n\n{\n\n#ifdef DEBUG\n\nPrintf\
    \ (\"Debugging is enabled.\\n\");\n\n#else\n\nprintf (\"Debugging is not enabled.\\\
    n\");\n\n#endif\n\nreturn (0);\n\n}\n\nIn this example, we used the #define command\
    \ to define the macro DEBUG. The result, when compiling and running the code as\
    \ is, will read Debug mode is enabled. However, if you leave the #define DEBUG\
    \ line uncommented or delete it, the result will read Debug mode is disabled.\n\
    \nWe can conditionally compile particular lines of code depending on whether a\
    \ specified macro is present or not by using the #ifdef statement. This can be\
    \ helpful for turning on or off debug statements, including platform-specific\
    \ code, or for managing various behaviors based on configuration settings.\n\n\
    [#if #else #elif #endif macros in C](#contents.xhtml_sc3_354a)\n\nThe preprocessor\
    \ directives #if, #else, #elif, and #endif in C programming allow conditional\
    \ compilation. They are used to include or exclude particular code blocks depending\
    \ on a set of criteria that is frequently created using preprocessor macros or\
    \ constant expressions.\n\nThe syntax for if, endif and #else are as discussed\
    \ below:\n\n#if  and #endif:\n\n#if condition\n\n// Code to be compiled if the\
    \ condition/ expression evaluates to true\n\n#endif\n\nThe directive #if determines\
    \ if the condition is true. The code between #if and #endif will be compiled if\
    \ the expression evaluates to a non-zero value.\n\n#else:\n\nWhen the condition\
    \ stated in the previous directive evaluates to false, the #else directive in\
    \ C programming is used in conjunction with the #ifdef, #ifndef, or #if directives\
    \ to offer an alternative code block.\n\n#if condition\n\n// Code to compile if\
    \ the condition/ expression evaluates to TRUE\n\n#else\n\n// Code to compile if\
    \ the condition/ expression evaluates to FALSE\n\n#endif\n\nThe #else directive\
    \ is used in conjunction with the #if directive. If the condition in the #if directive\
    \ evaluates to false (zero), the code between #else and #endif will be compiled.\n\
    \n#elif:\n\n#elif is a preprocessor command that stands for else if. It is used\
    \ with the #if and #else directives during the preprocessing stage to provide\
    \ several conditional branching options. The #elif directive allows you to provide\
    \ additional conditions that will only be considered if the previous #if or #elif\
    \ condition is false.\n\n#if expression1\n\n// Code to compile if expression1\
    \ evaluates to true (non-zero)\n\n#elif expression2\n\n// Code to compile if expression1\
    \ is false and expression2 evaluates to true (non-zero)\n\n#else\n\n// Code to\
    \ compile if both expression1 and expression2 are false (zero)\n\n#endif\n\nUse\
    \ the #elif (short for else if) directive to add further criteria to the conditional\
    \ compilation. #if and #else are used with it. The preprocessor will assess the\
    \ constant_expression2 in the #elif directive  if the constant_expression1 in\
    \ the #if directive returns false. The code between #elif and #endif will be included\
    \ for compilation if constant_expression2 is true.\n\nRemember that the preprocessor\
    \ evaluates these directives’ constant expressions at compilation time and has\
    \ no bearing on the values at runtime.\n\nHere is an example of using these directives:\n\
    \n#include <stdio.h>\n\n#define DEBUGMODE 1\n\nint main()\n\n{\n\n#if DEBUGMODE\n\
    \nprintf (\"Debugging is enabled.\\n\");\n\n#else\n\nprintf (\"Debugging is disabled.\\\
    n\");\n\n#endif\n\nreturn (0);\n\n}\n\nIn this case, the compilation process will\
    \ display the message Debugging is enabled. If the variable DEBUGMODE is declared\
    \ and set to a non-zero value (for example, #define DEBUG_MODE 1). The message\
    \ Debug mode is disabled. will appear if DEBUG_MODE is not specified or set to\
    \ zero.\n\n[Control structure macros](#contents.xhtml_sc4_355a)\n\nControl structure\
    \ macros are preprocessor macros used in the C programming language to construct\
    \ conditional statements and loops. By abstracting away the complexity of control\
    \ structures, these macros give programmers a method to write code that is more\
    \ understandable and expressive. When dealing with intricate or hierarchical control\
    \ structures, they make the code easier to maintain and comprehend. Typical C\
    \ control structure macros include the following:\n\n*   #define IF (condition)\
    \ if (condition)\n\n    The macro allows us to write an if statement in a natural\
    \ language method.\n\n    For example:\n\n    IF (n > 1)\n\n    {\n\n    // Code\
    \ to execute when n is greater than 1\n\n    }\n\n*   #define ELSE else\n\n  \
    \  It defines the identifier ELSE as a replacement for the keyword else.\n\n \
    \   IF (n > 1)\n\n    {\n\n    // Code to execute when n is greater than 1\n\n\
    \    }\n\n    ELSE\n\n    {\n\n    // Code to execute when n is not greater than\
    \ 1\n\n    }\n\n*   #define ELSE_IF(condition) else if (condition)\n\n    The\
    \ macro offers a brief way to write an else if statement:\n\n    IF (n > 1)\n\n\
    \    {\n\n    // Code to execute when n is greater than 1\n\n    }\n\n    ELSE_IF\
    \ (x < 0)\n\n    {\n\n    // Code to execute when n is less than 0\n\n    }\n\n\
    \    ELSE\n\n    {\n\n    // Code to execute when neither condition is met\n\n\
    \    }\n\n*   #define WHILE (condition) while (condition)\n\n    The macro allows\
    \ us to write a while loop in a more readable manner.\n\n    int n = 0;\n\n  \
    \  WHILE (n < 3)\n\n    {\n\n    // Code to execute as long as n is less than\
    \ 3\n\n    n++;\n\n    }\n\n*   `#define DO while`\n\n    The macro lets us use\
    \ a do-while loop more concisely.\n\n    int n = 0;\n\n    DO (n < 3)\n\n    {\n\
    \n    // Code to execute as long as i is less than 3\n\n    n++;\n\n    }\n\n\
    *   #define FOR (init, condition, update) for (init; condition; update)\n\n  \
    \  The macro streamlines the syntax of a for loop.\n\n    FOR (int n = 0; n <\
    \ 10; n++)\n\n    {\n\n    // Code to execute as long as n is less than 10\n\n\
    \    }\n\nAlthough these control structure macros might make your code easier\
    \ to comprehend, you should only use them sparingly. Overusing macros can result\
    \ in more difficult-to-maintain and --debug code. In C programming, it is crucial\
    \ to achieve a balance between code readability and the proper application of\
    \ macros.\n\n[Types of pre-processor directives](#contents.xhtml_sc3_356a)\n\n\
    The following are the major types of pre-processor directives:\n\n*   File inclusion\n\
    *   Macro definition\n*   Conditional compilation\n*   Other types\n\n[File inclusion\
    \ directives](#contents.xhtml_sc4_357a)\n\nThis directive, as its name implies,\
    \ instructs the preprocessor to link a file to our program file. The two files\
    \ would then be built together, and execution would only occur if the links between\
    \ the two files were successful. The most frequent instruction we encounter in\
    \ most applications is as follows:\n\n#include <stdio.h> //tells preprocessor\
    \ to include Header file stdio.h\n\n#include <string.h>\n\n#include <math.h>\n\
    \nNote: The header files contain (definitions of) functions which we (may) use\
    \ in our programs.\n\n[Macro definition directives](#contents.xhtml_sc4_358a)\n\
    \nUsing this directive, we can replace some expressions in program with their\
    \ pre-defined values.\n\nFor example:\n\n#define PI 3.14 // replaces all instances\
    \ of PI with 3.14 in our C Program\n\n*   Program to show use of macro preprocessor\
    \ directive:\n\n    #define PI 3.14\n\n    #include <stdio.h>\n\n    #include\
    \ <stdlib.h>\n\n    Int main ()\n\n    {\n\n    float a, r;\n\n    printf (\"\
    Input Radius of a circle\\n\");\n\n    scanf (\"%f\", &r);\n\n    a = PI * r *\
    \ r; // πr2\n\n    printf (\"Area of the circle= %f\\n\", a);\n\n    printf (\"\
    Circumference of the circle= %f\\n\", 2*PI*r);\n\n    return (0);\n\n    }\n\n\
    So, PI will be replaced by value 3.14. This type of directive is also called a\
    \ pre-processor macro.\n\nAnother way of using this directive is by having formula\
    \ style macro definition as follows:\n\n#define avg (a, b) (a + b)/2\n\nHere,\
    \ we are using a parametrized function-like macro where the macro takes 3 inputs\
    \ and binds them into an expression to get a return value of the input parameters.\
    \ We can later use the return value of the macro in our program.\n\nSome program\
    \ examples are as below:\n\n*   Program to show use of macro preprocessor directive:\n\
    \n    #include <stdio.h>\n\n    #include <stdlib.h>\n\n    #define AVG(n1, n2)\
    \ (n1+n2)/2\n\n    int main()\n\n    {\n\n    float a, b, av;\n\n    printf (\"\
    Input 2 Numbers\\n\");\n\n    scanf (\"%f%f\", &a, &b);\n\n    av=AVG (a, b);\
    \ // calling Macro AVG\n\n    printf (\"Average of the numbers = %f\\n\", av);\n\
    \n    return (0);\n\n    }\n\n*   Macros with arguments:\n\n    #define AREA(r)\
    \ (3.14 * r * r)\n\n    int main ()\n\n    {\n\n    float r, x;\n\n    printf\
    \ (\"Input Radius of a circle\\n\");\n\n    scanf (\"%f\", &r);\n\n    x = AREA\
    \ (r);\n\n    printf (\"\\n Area of circle = %f\", x);\n\n    }\n\n![](images/Figure_9.2.png)\n\
    \nFigure 9.2 Output of the above program\n\n*   Macros with arguments:\n\n   \
    \ #define MAX(n1, n2) ((n1)>(n2)?(n1):(n2))\n\n    // No space between MAX and\
    \ Brackets\n\n    int main () { //Max between 20 and 10 is 20\n\n    printf (\"\
    Max between 20 and 10 is %d\\n\", MAX (10, 20));\n\n    return (0);\n\n    }\n\
    \n![](images/Figure_9.3.png)\n\nFigure 9.3 Output of the above program\n\n[Applications\
    \ of macros](#contents.xhtml_sc4_359a)\n\nIn comparison to other structures like\
    \ functions, macros in the C language have certain distinct benefits. The following\
    \ are some justifications for using C macros:\n\nConstant definitions: In C, constant\
    \ definitions are frequently done via macros. You may make the code easier to\
    \ understand and maintain by using macros to give constant value names that make\
    \ sense.\n\nFor example:\n\n#define PIE 3.14\n\n#define MAX 100\n\n*   Code reusability:\
    \ By using macros, it is possible to produce code fragments that may be applied\
    \ in many places across the application. This can lessen code duplication and\
    \ increase the maintainability of the code. However, if you use macros frequently\
    \ or in large quantities, it might result in code bloat.\n*   Conditional compilation:\
    \ Using macros, particular sections of code can be included or removed from the\
    \ finished executable depending on specific criteria. This is helpful for producing\
    \ various builds for various platforms or turning on debug capabilities exclusively\
    \ when developing.\n\n    #define DEBUG_ON\n\n    #ifdef DEBUG_ON\n\n    // Debug-oriented\
    \ code\n\n    #endif\n\n*   Inline code expansion: During preprocessing, macros\
    \ are extended as inline code. Due to the lack of function call and return cost,\
    \ performance may be improved. Code duplication and larger binary sizes, however,\
    \ can balance out this advantage.\n*   Variadic macros: You may define macros\
    \ with various parameters, giving you additional freedom and versatility while\
    \ writing code. Variadic macros are frequently employed for logging and debugging\
    \ operations.\n\n    #define LOG(form, ...) printf(form, ARGS__)\n\n*   Shorter\
    \ code: By substituting understandable macro names for verbose expressions, macros\
    \ make it easier to construct code that is succinct. This can improve code readability\
    \ and lower the likelihood of mistakes brought on by repetitive code.\n*   String\
    \ concatenation: String concatenation, which is not directly feasible in C, may\
    \ be done via macros. When working concisely with strings, this is advantageous.\n\
    \n    #define STRCAT (s1, s2) s1 ## s2\n\n    printf (\"%s\\n\", STRCAT (\"ZAIN\"\
    , \" IMAD\")); // Outputs \"ZAIN IMAD\"\n\nDespite these benefits, macros must\
    \ be utilized carefully. When macros are used incorrectly, unexpected behavior,\
    \ debugging challenges, and significant code maintenance problems might result.\
    \ Use functions instead of macros whenever you can since they offer type safety,\
    \ better code structure, and a lower chance of mistakes. Use macros only when\
    \ they are absolutely essential, such as for managing conditional compilation\
    \ or declaring constants.\n\nMacros versus functions\n\nIn C programming, macros,\
    \ and functions are two essential building blocks that have various uses. Let\
    \ us examine how macros and functions vary from one another ([Table 9.1](#ch09.xhtml_tab9-1)):\n\
    \n| Parameter | Macros | Functions |\n| --- | --- | --- |\n| Definition | Macros\
    \ are preprocessor directives that are specified using the #define syntax and\
    \ are frequently used to carry out quick text substitutions prior to the start\
    \ of compilation. Throughout the program, macros can be utilized since they are\
    \ globally specified. | A function is a designated section of code that carries\
    \ out a certain action. Functions can be invoked from many places in the program\
    \ and are defined using the function_name() syntax. They are called while the\
    \ application is running and are compiled as distinct code units. |\n| Invocation\
    \ | During the preprocessing stage, macros are called by their names and their\
    \ defined text is substituted. Before the code is compiled, the preprocessor does\
    \ the substitution. | To call a function, you must first specify its name, followed\
    \ by parentheses, and then include any necessary parameters. The resolution of\
    \ function calls happens while the program is running. |\n| Argument evaluation\
    \ | Macro arguments are not examined before substitution for macro arguments.\
    \ If an argument has unintended consequences or is used more than once in the\
    \ macro, this may result in unexpected behavior. | Function parameters are assessed\
    \ before the function is invoked. There are no problems with side effects, and\
    \ each argument is examined just once. |\n| Code expansion | The complete macro\
    \ code is placed into the calling code when a macro is expanded as inline code.\
    \ If the macro is big or used a lot, this could result in code bloat. | Functions\
    \ are independent chunks of code that cause the control to move to its position\
    \ when called. Since the function is just declared once and may be called from\
    \ several locations throughout the program, there is less code duplication. |\n\
    | Return values | Macros are substituted with their defined content right away;\
    \ they do not have a return value. | The return type in the function declaration\
    \ is used to specify if a function has a return value. They can also carry out\
    \ difficult tasks and deliver outcomes to the calling code. |\n| Type safety |\
    \ Because they execute direct text replacement, macros lack type safety. If types\
    \ are not handled appropriately, this might result in unexpected outcomes. | Because\
    \ the parameter types and return types are explicitly defined, functions offer\
    \ type safety. Error risk can be decreased by the compiler enforcing type checks.\
    \ |\n\nTable 9.1: Macro versus functions\n\nPreprocessors employ macros, which\
    \ are straightforward text substitutions, to accomplish conditional compilation\
    \ and reuse code. Contrarily, functions are distinct units of code that offer\
    \ superior type safety, reuse, and structure of the code. Due to the extra advantages\
    \ they provide, employing functions instead of macros is typically chosen whenever\
    \ it is practical. In other circumstances, however, direct text replacement is\
    \ required, such as when establishing constants or short, repetitive code sequences,\
    \ macros can still be helpful.\n\n[Conditional compilation](#contents.xhtml_sc4_360a)\n\
    \nConditional compilation is a feature provided by the C preprocessor. This enables\
    \ the publication of several program executable code versions based on predetermined\
    \ criteria. Some sections of the code are compiled, while others are disregarded\
    \ because of the process of defining compiler directives. The approach allows\
    \ us to identify sections of code that may be built especially for a certain platform,\
    \ which is useful when executing code in cross-platform development. The processing\
    \ of the conditional compilation differs from that of the conditional statement\
    \ (if-else statements). The conditional directives are in the program before compilation,\
    \ but the if-else statement is tested when it is being executed. Conditional compilation\
    \ can be implemented using the following directives in C:\n\n*   #ifdef\n*   #if\n\
    *   #defined\n*   #else\n*   #elseif\n\nThese directives have already been discussed\
    \ earlier in the chapter.\n\n*   Conditions compilation with #if, #elif and more\n\
    \n    #define N 0\n\n    #include <stdio.h>\n\n    int main()\n\n    {\n\n   \
    \ #if N > 0\n\n    // Positive number.\n\n    printf (\"+ve No.\");\n\n    #elif\
    \ N < 0\n\n    // Negative number\n\n    printf (\"-ve No.\");\n\n    #else\n\n\
    \    // 0\n\n    printf (\"Zero\");\n\n    #endif\n\n    return(0);\n\n    }\n\
    \nAs already mentioned, one of the applications of the #ifdef directive is to\
    \ enable platform-specific source code into a program.\n\n#include <stdio.h>\n\
    \n#define UNIX 1\n\nint main () {\n\n#ifdef UNIX\n\nprintf (\"UNIX is ON\\n\"\
    );\n\n#endif\n\nreturn (0);\n\n}\n\nOutput:\n\nUNIX is ON\n\nIn the above program,\
    \ UNIX source code is enabled. To disable the UNIX source code, we may change\
    \ the code:\n\n#define UNIX 1 to #undef UNIX\n\n#include <stdio.h>\n\n#define\
    \ DEBUG 1\n\nint main()\n\n{\n\n#ifdef DEBUG\n\nprintf (\"Debug is ON\\n\");\n\
    \n#else\n\nprintf (\"Debug is OFF\\n\");\n\n#endif\n\nreturn(0);\n\n}\n\n[Preprocessor\
    \ directive #Pragma](#contents.xhtml_sc4_361a)\n\nThis preprocessor directive\
    \ enables us to offer additional information to the compiler in the C programming\
    \ language.\n\n#pragma token\n\nHere are some of #pragma directives offered by\
    \ C programming:\n\n#pragma startup: The preprocessor directive #pragma startup\
    \ is an implementation-specific, non-standard preprocessor directive in the C\
    \ programming language. Prior to calling the main() function, it is used to identify\
    \ functions that should run automatically at the start of a program’s execution.\
    \ #pragma startup has inconsistent behavior between platforms and compilers, and\
    \ its use is not portable between C implementations.\n\nSyntax:\n\n#pragma startup\
    \ function\n\nIn the above code, function - refers to the function that we want\
    \ to execute at the program’s startup.\n\nThe use of non-standard, implementation-specific\
    \ features like #pragma startup should be avoided since different systems and\
    \ compilers may interpret the directive differently or not at all, which might\
    \ result in non-portable code.\n\nThe main() function is where a C program begins\
    \ to run in standard C. The runtime environment or startup code given by the compiler\
    \ and the underlying operating system typically handles everything run before\
    \ the main() call. Therefore, it is often preferable to utilize standard approaches\
    \ and procedures, such as constructor attributes in GCC or constructors and initializers\
    \ in C++, if you need to run specialized code before main(). These techniques\
    \ offer more portability and have better platform and compiler support.\n\n* \
    \  For example, in GCC, we can use a constructor feature like this:\n\n    #include\
    \ <stdio.h>\n\n    void startup_func (void) __attribute__((constructor));\n\n\
    \    void startup_func(void)\n\n    {\n\n    printf (\"Function will get executed\
    \ before main().\\n\");\n\n    }\n\n    int main()\n\n    {\n\n    printf (\"\
    This is our main function.\\n\");\n\n    return (0);\n\n    }\n\nIt is important\
    \ to keep in mind that non-standard features like #pragma startup may restrict\
    \ the portability of your code; as a result, it is typically a good idea to avoid\
    \ them and use standard, well-supported alternatives instead.\n\n#pragma exit\
    \ directive: The #pragma exit directive, a compiler-specific pragma, enables you\
    \ to define functions to be run after the program terminates. It is generally\
    \ supported by particular compilers and is not a built-in feature of the C or\
    \ C++ languages.\n\nBecause it is not standardized, the syntax for #pragma exit\
    \ differs depending on the compiler. In general, you employ it as follows:\n\n\
    #pragma exit function: In the above code, function is the name of the function\
    \ that we want to invoke when the program exits. The function should have neither\
    \ arguments nor any return value (that is, void return type).\n\nThe #pragma exit\
    \ directive is used to create a mechanism for resource deallocation or cleaning\
    \ chores to be performed after the program stops. Before the application closes,\
    \ you might wish to free up allocated memory, remove any open files, or take other\
    \ cleanup measures.\n\nThe #pragma exit command, as was already indicated, is\
    \ unique to some compilers and is not a part of the standard C or C++ language.\
    \ It is crucial to examine the compiler’s documentation for precise information\
    \ on how to use #pragma exit with that specific compiler, as different compilers\
    \ may have their own syntax or restrictions.\n\nUsing #pragma exit may make your\
    \ code less portable and more reliant on the particular compiler being used because\
    \ it is not portable across multiple compilers. If portability is an issue, you\
    \ can think about utilizing alternative methods, such the atexit function in C\
    \ or smart pointers and Resource Acquisition Is Initialization (RAII)  strategies\
    \ in C++, to handle cleaning duties in a more standardized and portable manner.\n\
    \n#pragma warn: #pragma is a preprocessor directive used in C and C++ programming\
    \ to provide the compiler with particular instructions or control. However, the\
    \ C/C++ language does not include a standard #pragma warn command.\n\nThe #pragma\
    \ directive and its consequences are compiler-specific, which means that various\
    \ compilers may interpret #pragma directives differently or may support various\
    \ sets of #pragma instructions.\n\nIn C/C++, #pragma directives are frequently\
    \ used for:\n\n*   Regulating warning messages: Some compilers include explicit\
    \ #pragma directives to activate or suppress particular warning messages. Particular\
    \ compilers, for instance, let you deliberately conceal particular warnings that\
    \ might not apply to your code.\n*   Optimizations: To manage compiler optimizations\
    \ for certain code portions, compilers frequently include #pragma directives.\
    \ These directives can be used to optimize the performance of crucial code segments.\n\
    *   Pack and alignment directives: #pragma directives can be used to manage the\
    \ packing and alignment of structures or variables in memory, which is important\
    \ for some hardware- or platform-specific needs.\n\nSince the functionality of\
    \ #pragma directives depends on the compiler you are using, it is crucial to read\
    \ the documentation of that compiler to understand the #pragma choices that are\
    \ available and their consequences.\n\nFor instance, you may manage warning messages\
    \ using the #pragma warning command in Visual C++, the C++ compiler from Microsoft.\n\
    \nKeep in mind that utilizing compiler-specific directives may reduce the portability\
    \ of your code. Use #pragma directives sparingly and only when necessary for compiler-specific\
    \ optimizations or setups or, if feasible, attempt to use standard C/C++ capabilities.\n\
    \n#pragma GCC dependency: A compiler-specific directive used in the GNU Compiler\
    \ Collection (GCC) is #pragma GCC dependency. In a multi-file C or C++ project,\
    \ it enables you to express dependencies between translation units (source files).\
    \ The compiler is informed by this pragma of the files that must be compiled prior\
    \ to the current translation unit.\n\nSyntax:\n\n#pragma GCC dependency \"file\"\
    \n\nWhere:\n\n*   file denotes the name of the file that the current translation\
    \ unit is dependent on.\n\nThe compiler examines if the supplied file (filename)\
    \ has changed since the last compilation when it comes across this pragma. The\
    \ current translation unit (source file with the pragma) will be recompiled if\
    \ the file has been changed in order to keep it current with the dependencies.\n\
    \nWhen a project has numerous source files and modifications to one file might\
    \ have an impact on the accuracy of other files, this pragma can be helpful. You\
    \ may make sure that the appropriate files are automatically recompiled when their\
    \ dependencies change by using #pragma GCC dependency, avoiding potential problems\
    \ brought on by out-of-date object code.\n\n#pragma GCC dependence is unique to\
    \ the GCC compiler and might not be supported by other C/C++ compilers. It is\
    \ advisable to stay away from utilizing compiler-specific pragmas if at all feasible\
    \ to retain portability. Use alternative accepted techniques for managing dependencies\
    \ instead, including build systems or Makefiles, which are supported by a wider\
    \ range of platforms and compilers.\n\n#pragma GCC system header: #pragma GCC\
    \ system_header is a preprocessor directive used in C and C++ programming to tell\
    \ the GCC compiler to consider the provided header file as a system header. It\
    \ may not be recognized by other compilers since it is exclusive to GCC.\n\nWhen\
    \ a header file is designated as a system header, the compiler is informed that\
    \ any constructions or declarations within that header file are a part of the\
    \ system’s standard library or platform-specific implementation and should not\
    \ trigger any warnings.\n\nWhen compiling system headers with certain compiler\
    \ settings, the #pragma GCC system_header directive is frequently used to conceal\
    \ warnings.\n\nFor example:\n\n#pragma GCC system_header\n\nWhen some_system_header.h\
    \ is included, and #pragma GCC system_header is used, the compiler will regard\
    \ the header as a trusted system header and ignore any warnings that might normally\
    \ be produced by its contents.\n\nWe must be cautious while using these instructions.\
    \ If you use the #pragma GCC system_header command incorrectly or use it on non-standard\
    \ headers, your code may have bugs or defects that are being concealed. Therefore,\
    \ it is typically advised against using this pragma for your project’s customized\
    \ headers and only to add it to a trustworthy system or standard library headers.\n\
    \n#pragma GCC poison: The preprocessor command #pragma GCC poison is peculiar\
    \ to GCC and is used to designate certain identifiers (variables, functions, or\
    \ macros) as poisoned. Any attempt to utilize a poisoned identifier in the code\
    \ will result in a compilation error, essentially prohibiting its usage in the\
    \ source code.\n\nSyntax:\n\n#pragma GCC poison identifier\n\nThe name of the\
    \ variable, function, or macro that you want to label as poisoned is referred\
    \ to here as the identifier.\n\nBy employing #pragma GCC poison, developers can\
    \ prevent using particular names that might have been out-of-date, dangerous,\
    \ or problematic in the source. The compiler makes sure that developers are informed\
    \ of their limited usage and are urged to utilize substitute, safer solutions\
    \ instead of poisoning these identifiers.\n\nFor example:\n\n#include <stdio.h>\n\
    \n#pragma GCC poison poison_function\n\nint main()\n\n{\n\npoison _function ();\
    \ // This will trigger a compilation error\n\nprintf (\"Learning Preprocessors\\\
    n\");\n\nreturn (0);\n\n}\n\nThe poison _function in this example has been tagged\
    \ as poisoned using the #pragma GCC poison, which indicates that using it will\
    \ cause a compilation problem. The compiler will output a notice such as error:\
    \ attempt to use poisoned poison _function.\n\nWe must be aware that the GCC feature\
    \ known as #pragma GCC poison may not be supported by other compilers. In order\
    \ to let other developers know the reasoning behind this limitation, it is also\
    \ advisable to include the cause of a poisoned identifier in your code or project\
    \ documentation.\n\n#pragma directive example:\n\n#include <stdio.h>\n\nVoid init\
    \ ();\n\nvoid end ();\n\n#pragma startup init\n\n#pragma exit end\n\nInt main\
    \ ()\n\n{\n\nprintf (\"main method\\n\");\n\nreturn 0;\n\n}\n\nVoid init ()\n\n\
    {\n\nprintf (\"init method\\n\");\n\n}\n\nvoid end ()\n\n{\n\nprintf (\"end method\\\
    n\");\n\n}\n\nNote: #pragma startup and #pragma exit are keywords.\n\n#pragma\
    \ startup followed by a ‘function-name’, makes the ‘function- name’ be executed\
    \ before the main method. #pragma exit followed by a ‘function-name’, makes the\
    \ ‘function-name’ be executed just before program termination.\n\nSo, in the above\
    \ example, the first init method would be executed, followed by the main method,\
    \ and the end method would be executed just before the termination of the program.\n\
    \nIn the above example, c style string msg will be set to Zone information in\
    \ use as Zone macro has been defined above it. Based on this setting, a program\
    \ may take a different path of compilation.\n\n[ANSI C predefined macros](#contents.xhtml_sc3_362a)\n\
    \nSeveral standard macros specified by ANSI C (C89/C90) offer details about the\
    \ environment and the compiler being used. You may use these macros in your C\
    \ code to help you create code that is cross-platform and portable. The following\
    \ list of frequently used ANSI C predefined macros:\n\n*   The macro __FILE__\
    \ expands to the name of the current source file as a string literal.\n*   The\
    \ macro __LINE__ expands to the line number that is now in the source code as\
    \ an integer constant.\n*   __DATE__ expands to a string literal reflecting the\
    \ date when the source file was built in the format ‘Mmm dd yyyy’.\n*   __TIME__\
    \ expands to a string literal reflecting the time when the source file was compiled\
    \ in the format ‘hh:mm:ss’.\n*   __STDC__ is defined when the compiler complies\
    \ with ANSI C requirements in its entirety.\n*   __STDC_VERSION__ expands to an\
    \ integer constant that denotes the version of the C standard that the compiler\
    \ can support.\n\nBy using these predefined macros, you can write more portable\
    \ and flexible code that adapts to different environments and compilers.\n\n*\
    \   __STDC_HOSTED__ is defined when the compiler is functioning in a hosted environment\
    \ (such as one that has an operating system and standard library support).\n*\
    \   __STDC_NO_ATOMICS__, __STDC_NO_THREADS__, __STDC_NO_COMPLEX__, __STDC_NO_VLA__\
    \ and __STDC_NO_VLA__ are defined if specific language features are not supported\
    \ by the implementation.\n\nIt is crucial to remember that some of these macros\
    \ are optional and cannot be included in all C environments or compilers. Furthermore,\
    \ more recent iterations of the C standard (C99 and C11) added new predefined\
    \ macros and improved the functionality of several already existing ones.\n\n\
    To check the accessibility of macros, we can use conditional compilation with\
    \ #ifdef or #ifndef.\n\nFor example:\n\n#ifdef __STDC__\n\nprintf (\"Your compiler\
    \ is ANSI C compatible\");\n\n#else\n\nprintf (\"Your compiler is not ANSI C compatible\"\
    );\n\n#endif\n\nBy using these predefined macros, we can write more portable and\
    \ flexible code that adapts to different environments and compilers. We may create\
    \ more adaptable, portable code that works with multiple settings and compilers\
    \ by utilizing these preset macros.\n\nAn example of inbuilt macros is as follows:\n\
    \n#include <stdio.h>\n\nint main ()\n\n{\n\nprintf (\"File :%s\\n\", __FILE__\
    \ );\n\nprintf (\"Date :%s\\n\", __DATE__ );\n\nprintf (\"Time :%s\\n\", __TIME__\
    \ );\n\nprintf (\"Line :%d\\n\", __LINE__ );\n\nprintf (\"ANSI :%d\\n\", __STDC__\
    \ );\n\n}\n\nOutput for the above code is shown in [Figure 9.4](#ch09.xhtml_fig9-4):\n\
    \n![](images/Figure_9.4.png)\n\nFigure 9.4: ANSI inbuilt macros\n\n[Preprocessor\
    \ operators](#contents.xhtml_sc3_363a)\n\nThe C preprocessor offers the following\
    \ operators to help create macros:\n\n[Macro continuation (\\) operator](#contents.xhtml_sc4_364a)\n\
    \nA macro often only occupies one line. A macro that is too big to fit on a single\
    \ line can be continued using the macro continuation operator (\\).\n\nFor example:\n\
    \n#define avg (a, b) \\\n\n((a + b) \\ 2))\n\n[Stringize (#) operator](#contents.xhtml_sc4_365a)\n\
    \nA macro parameter is converted into a string constant using the stringize command.\
    \ It is also known as the operator, denoted by the numeral #. This operator may\
    \ only be used by macros with a specified argument or parameter list.\n\n*   Stringize\
    \ (#) operator example\n\n    #include <stdio.h>\n\n    #define Msg(x, y, z) \\\
    \n\n    printf (#x \",\" #y \" and \" #z \": You are cute\\n\")\n\n    int main()\
    \ {\n\n    Msg (Usman, Zain, Imad);\n\n    return 0;\n\n    }\n\n[Token pasting\
    \ (##) operator](#contents.xhtml_sc4_366a)\n\nThe token-pasting operator (##),\
    \ used within macros, combines two arguments. As a result, it permits the creation\
    \ of a single token in the macro specification from two separate tokens.\n\nFor\
    \ example:\n\n#include <stdio.h>\n\n#define concat (a, b) a##b\n\nint main ()\n\
    \n{\n\nprintf (\"%d\", concat (10,20));\n\nreturn(0);\n\n}\n\nBy using these predefined\
    \ macros, we can write more portable and flexible code that acclimatizes to diverse\
    \ environments and compilers.\n\n[Defined () operator](#contents.xhtml_sc4_367a)\n\
    \nAn identifier may be checked to see if #define has been used by using the preprocessor-defined\
    \ operator. The value is true (non-zero) if the given identifier is defined; otherwise,\
    \ it is false (zero). An example for the same is given below:\n\n#include <stdio.h>\n\
    \n#if !defined (msg)\n\n#define msg \"How are You\"\n\n#endif\n\nint main ()\n\
    \n{\n\nprintf (\"Dear %s\\n\", msg);\n\nreturn (0);\n\n}\n\n[C-header files](#contents.xhtml_sc3_368a)\n\
    \nA header file is a file with extension .h which contains C function declarations\
    \ and macro definitions to be shared between several source files. There are two\
    \ types of header files: the files that the programmer writes and the files that\
    \ come with the compiler.\n\nYou request to use a header file in your program\
    \ by including it with the C preprocessing directive #include, like you have seen\
    \ the inclusion of stdio.h header file, which comes along with your compiler.\n\
    \nIncluding a header file is equivalent to copying the content of the header file.\
    \ Still, we avoid doing so because it would be error-prone and not a good practice,\
    \ especially when dealing with multiple source files in a program. A simple practice\
    \ in C or C++ programs is that we keep all the constants, macros, system-wide\
    \ global variables, and function prototypes in the header files and include that\
    \ header file wherever it is required.\n\n[Include syntax](#contents.xhtml_sc4_369a)\n\
    \nThe user and the system header files are included using the preprocessing directive\
    \ #include. It has the following two forms:\n\n*   #include <file>\n\nSystem header\
    \ files are formatted in this manner. In a normal list of system folders, it looks\
    \ for a file with the name file. When producing your source code, you can prepend\
    \ folders to this list with the -I option.\n\n*   #include \"file\"\n\nFor header\
    \ files in your own programs, use this form. It looks in the directory where the\
    \ current file is located for a file with the name file. When producing your source\
    \ code, you can prepend folders to this list with the -I option.\n\n[Include operation](#contents.xhtml_sc4_370a)\n\
    \nThe C preprocessor is instructed to scan the given file as input before moving\
    \ on to the rest of the current source file using the #include directive. The\
    \ output from the preprocessor is composed of the output that has previously been\
    \ produced, the output from the included file, the output from the text after\
    \ the #include directive, and finally, the output.\n\nIf we have a file named\
    \ hdr.h that contains a function definition, we can include it in our main program\
    \ like this:\n\n#include \"hdr.h\"\n\nThe contents of hdr.h will be inserted at\
    \ the location of the #include directive during the preprocessing phase.\n\nFor\
    \ example:\n\n// File 1 hdr.h\n\n#include <stdio.h>\n\nvoid msg()\n\n{\n\nprintf(\"\
    Hello, Preprocessors\\n\");\n\n}\n\n//File 2 - hdr.c, file containing main()\n\
    \n#include <stdio.h>\n\n#include \"hdr.h\"\n\nvoid main()\n\n{\n\nmsg();\n\n}\n\
    \nIn this example:\n\nhdr.h contains the definition for the function msg(). The\
    \ header file is included in hdr.c file. From hdr.c file (which contains main()\
    \ function), we call msg() function, defined in hdr.h file. The output of the\
    \ program will be:\n\nHello, Preprocessors\n\n[Once-only headers](#contents.xhtml_sc3_371a)\n\
    \nIf a header file happens to be included twice, the compiler will process its\
    \ contents twice, and it will result in an error. The standard way to prevent\
    \ this is to enclose the entire real contents of the file in a conditional, as\
    \ shown below:\n\n#ifndef HEADER_FILE\n\n#define HEADER_FILE\n\n…………. // the entire\
    \ header file\n\n#endif\n\nThis construct is commonly referred to as a wrapper\
    \ #ifndef. If the header is included once more and HEADER_FILE is specified, the\
    \ condition will be false. As a result, the full contents of the file will be\
    \ skipped over by the preprocessor, and the compiler will not see it again.\n\n\
    [Using #ifdef for different computer types (Computed includes)](#contents.xhtml_sc4_372a)\n\
    \nSometimes, you have to decide which of the several header files to include in\
    \ your software. For instance, they may include configuration options to be applied\
    \ to various operating systems. To do this, we may use the following chain of\
    \ conditionals:\n\n#if SYSTEM_1\n\n# include \"system_1.h\"\n\n#elif SYSTEM_2\n\
    \n# include \"system_2.h\"\n\n#elif SYSTEM_3\n\n...\n\n#endif\n\nHowever, when\
    \ it expands, it gets laborious, thus the preprocessor instead provides the option\
    \ to use a macro for the header name. It is known as a calculated include. We\
    \ just enter a macro name there in place of a header name as the direct parameter\
    \ of #include.\n\n#define SYSTEM_H \"system_1.h\"\n\n...\n\n#include SYSTEM_H\n\
    \nSYSTEM_H will be expanded, and the preprocessor will look for system_1.h as\
    \ if the #include had been written that way originally. SYSTEM_H could be defined\
    \ by your Makefile with a -D option.\n\n[Conclusion](#contents.xhtml_sc2_373a)\n\
    \nIn this chapter, we explored various aspects of preprocessors in C programming.\
    \ We discussed the #define directive, #ifdef and #ifndef preprocessor directives,\
    \ and the #include preprocessor. Additionally, we delved into macro definition,\
    \ conditional compilation, and ANSI C predefined macros. We also covered preprocessor\
    \ operators like the macro continuation () operator, stringize (#) operator, token\
    \ pasting (##) operator, and defined () operator. Furthermore, we examined the\
    \ usage of C-header files, char*test();, and once-only headers, and how to use\
    \ #ifdef for different computer types. Understanding preprocessors is essential\
    \ for C programmers to enhance code modularity and manage cross-platform compatibility\
    \ effectively.\n\n[Exercise](#contents.xhtml_sc2_374a)\n\n1.  What is a preprocessor\
    \ in C programming? What is the purpose of a preprocessor?\n\n2.  What are some\
