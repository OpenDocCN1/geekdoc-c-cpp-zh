    # Execute/ Run code


    To run your code, select `Execute | Run`, as seen in [Figure 2.12](#ch02.xhtml_fig2-12).
    This will start execution of the program and should bring up a new window. Besides
    the program output, the window would show the time the program took to execute
    and tells us to hit any key to exit from the output screen. Please refer to the
    following figure:


    ![](images/Figure_2.12.png)


    Figure 2.12: Executed file with the output


    Even if we try to skip the compilation process, the program is still compiled
    for errors.


    ## C program components


    A C program consists of several components that work together to perform a specific
    task. A C program consists of the following components:


    *   **Preprocessor directives**: Preprocessor directives are commands that begin
    with the `#` symbol and modify the source code before compilation. Examples of
    preprocessor directives include `#include` (which includes header files), `#define`,
    and `#ifdef`.

    *   **Functions**: Functions are blocks of code that perform a specific task.
    In C, functions must be defined before they can be invoked for execution. C programs
    typically have a `main` function, which is the entry point of a program.

    *   **Variables**: Variables are used to store data that the program can manipulate.
    In C, variables must be declared before they can be used, and they can have different
    types, such as integers, floats, and characters.

    *   **Statements**: Statements are the basic building blocks of a C program. They
    are used to perform actions, such as assigning values to variables, calling functions,
    and making decisions based on conditions.

    *   **Comments**: Comments, denoted by `//`, are used to add explanatory text
    to the program. They are ignored by the compiler and are intended to help other
    programmers understand the code.

    *   **Header files and libraries**: Header files contain declarations for functions,
    variables, and other data types used in the program. They are typically included
    using the `#include` directive.


    Let us look at a simple program that displays a simple message on the output screen:


    ```c

    #include <stdio.h> // header file


    // first program


    int main () {


    printf ("This is my first C program");


    return (0);

    }

    ```


    In the above program:


    *   A preprocessor line (`#include <stdio.h>`) tells the compiler to include or
    link `stdio.h` file (because it contains the definition or code of functions invoked
    in the C program) to the current C project or program file before executing the
    program. The header file would be compiled with the C source file(s).

    *   The next line starts with the symbol `//`, which symbolizes a comment that
    a user writes for documentation purposes and is ignored (neither compiled nor
    executed) by the compiler. We represent multiline comments by `/*...*/`. The purpose
    of comments is to add readability, explanation, or annotation to the program.

    *   The next line starts the definition of function `main()`: It is the entry
    point of a C program that kick starts the program execution. A C program may consist
    of one or more functions, but the execution of a C program always starts with
    the `main()` function. The word `int` preceding `main` means the function shall
    return an integer at the conclusion of the execution (will be discussed in detail
    later).

    *   On the next line, `printf(...)`, a function available in C, displays the message:
    This is my first C program on the output screen.

    *   The next line `return 0;` returns control back to handle where the execution
    had started, and returns a value `0` (to signify that the program executed successfully).

    *   The last line `}` marks the end of the `main` function, and hence the program
    stops.


    Assignment: Write, compile, and execute the above C program.


    You have seen the basic structure of a C program, so it will be easy to understand
    other basic building blocks of the C programming language.


    ## Tokens in C


    In C programming, the token is the smallest unit of a program that is meaningful
    and can be parsed by the compiler. A C program consists of several tokens, collectively
    forming a large chuck of a program. The compiler can analyze and understand the
    program structure and syntax by breaking a C program into its constituent tokens,
    allowing it to generate executable code. The C language has six types of tokens:


    *   **Keywords**: These are reserved words with a specific meaning in the C language.
    Examples of keywords in C include `if`, `else`, `while`, `return`, and more.

    *   **Identifiers**: Identifiers are names given to variables, functions, and
    other program entities. Identifiers in C must begin with a letter or underscore
    and can contain letters, digits, and underscores.

    *   **Constants**: Constants are fixed values that do not change during program
    execution. Constants in C can be of several types, including integer constants,
    floating-point constants, character constants, and string literals.

    *   **Strings**: Strings are sequences of characters enclosed in double quotes.
    In C, strings are treated as arrays of characters and can be manipulated using
    a variety of string functions.

    *   **Operators**: Operators are symbols that perform operations on one or more
    operands. Examples of operators in C include arithmetic operators (`+`, `-`, `*`,
    `/`), relational operators (`==`, `!=`, `<`, `>`), and logical operators (`&&`,
    `||`, `!`).

    *   **Special symbols**: These include punctuation marks and other special characters
    used to separate program elements or provide additional information to the compiler.
    Examples of special symbols in C include semicolons (`;`), commas (`,`), parentheses
    (`()`), and braces (`{}`).


    Example: Consider the statement:


    ```c

    printf ("My first C Program ");

    ```


    The individual tokens are:


    `printf`


    `(`


    `"My first C Program"`


    `)`


    `;`


    ## Semicolons


    In a C program, the semicolon is a statement terminator. That is, each statement
    must end with a semicolon. Given below are two statements:


    ```c

    printf ("Hello, World! \n");

    return 0;

    ```


    ## Comments


    Comments are like helping text in your program; the compiler ignores them. They
    start with `/*` and terminate with the characters `*/` as shown below:


    ```c

    /* my first program in C */

    ```


    Comments within comments are not allowed, and they do not occur within a string
    or character literals.


    ## Keywords


    The following list shows the reserved words in C. These reserved words may not
    be used as constants, variables, or other identifier names. Refer to the [Figure
    2.13](#ch02.xhtml_fig2-13):


    ![](images/Figure_2.13.png)


    Figure 2.13: Keywords in C


    ## Whitespace in C


    Whitespace in C refers to any sequence of one or more spaces, tabs, and newline
    characters that are used to separate tokens in a C program. The C compiler ignores
    whitespace except when it separates adjacent identifiers, keywords, or constants
    that would otherwise be interpreted as a single token.


    Whitespace is used in C programs to improve readability and organization. It can
    be used to visually separate blocks of code, align variables or function calls,
    and add comments to the program. Here are some examples of how whitespace is commonly
    used in C programs:


    *   **Indentation**: Indentation uses whitespace to align code blocks, making
    it easier to see the program’ structure.

    *   **Spacing**: Spacing uses whitespace to separate tokens and improve readability.

    *   **Line breaks**: It is used to separate statements and improve program readability.


    ## Operators


    An operator is a symbol that tells the compiler to perform specific mathematical
    or logical functions. C language is rich in built-in operators and provides the
    following types of operators:


    *   Arithmetic operators

    *   Relational operators

    *   Logical operators

    *   Bitwise operators

    *   Assignment operators

    *   Miscellaneous operators

    '
