    *   Structured programming is designed to be an inflexible set of rules for organizing
    code. This can make code more predictable and easier to maintain, but it makes
    it less flexible and adaptable to changing requirements.

    *   The structure can become more complicated as programs become more complex,
    leading to difficulty in debugging, testing, and maintenance.

    *   Structured programming is not designed to handle non-linear control flow.
    For example, if you want to jump from one part of the program to another, it can
    be difficult in a structured programming paradigm.

    *   Structured programming requires that code be organized into functions and
    modules, which can lead to code duplication. This can be especially problematic
    when working with large programs with many modules and functions.

    *   Structured programming can lead to tightly coupled code and is difficult to
    reuse in other projects, leading to duplication of effort and a lack of consistency
    across projects.


    ## Object Oriented Programming


    The motivation for switching over to a fresh paradigm like the Object-Oriented
    Programming (OOP) approach was to eradicate some of the flaws that were inherently
    there in the procedural/ modular approach. OOP considers data a critical component
    in program development and does not allow it to flow arbitrarily around the system.
    It ensures that data is closely tied to the function that operates on it and protects
    it from accidental modification from external functions. In object-oriented programming,
    an object is an instance of a class that contains data and behavior and may interact
    with other objects through methods. `Figure 1.6` illustrates how data and methods
    (functions) are organized in object-oriented programs. Only the function related
    to that object can access that object’s data. However, one object’s function can
    access another object’s function.


    ![](images/1.6.png)


    Figure 1.6: Object-Oriented Programming


    ### Features of Object-Oriented Programming:

    *   The data structure contains all the functions that work on an object’s data.

    *   Data is concealed and inaccessible to external functions.

    *   Objects communicate with one another using functions.

    *   Anytime new information or features are required, they may be quickly added.

    *   OOP uses a bottom-up approach to design programs.


    ## Algorithms


    An algorithm is a series of instructions that, when correctly followed, solves
    a specific computer problem. An algorithm is a process expressed as a series of
    stages and specifies a set of instructions that must be followed in order to get
    the intended result. An algorithm is called programming language agnostic since
    it can be implemented in any computer language. An algorithm does not follow a
    strict syntax, as is the case with writing a computer program since it is not
    to be executed on a computer. The practice of devising algorithms is primarily
    done for designing or understanding purposes. Once the design is anticipated with
    the aid of an algorithm, the algorithm may be implemented using any programming
    language.


    ### Features of an algorithm

    An algorithm should have the below-mentioned features:

    *   An algorithm must have zero or more inputs, also known as the information
    or data, to process to function.

    *   An algorithm must have at least one output, the information or results generated
    after input processing.

    *   An algorithm must contain a set of exact instructions that are easy to understand
    and execute to produce the intended outcome. The algorithm must be well-defined
    at every stage, with no opportunity for interpretation.

    *   An algorithm must be finite, meaning it must finish after a set number of
    steps and not continue endlessly or loop infinitely.

    *   An algorithm must solve the issue it was created to address in a fair length
    of time and with an acceptable expenditure of resources.

    *   An algorithm has to be broad enough to handle a variety of input data rather
    than simply a small subset.

    *   An algorithm must be implementable given the resources and technology at hand
    in order to be considered practical.


    ### Writing an algorithm

    There are no well-defined standards (as already discussed above) for writing algorithms.
    One of the reasons is that since we do not have to run algorithms on a computer,
    which would have necessitated a proper way of writing it (syntax), a user can
    choose how to write it, and it is problem-specific.


    Basic coding features like repetition statements, conditional statements, and
    so on are shared by all programming languages. We can design an algorithm in general,
    which may be later implemented using any programming language. Algorithms are
    often written in stepwise format; however, this may not always be the case. After
    the problem area is well defined, the process of formulating an algorithm for
    the problem is carried out. To conclude, we may say that we need to be conscious
    of the problem at hand going forward and building the solution.


    Further, the way of execution of the program shall be categorized into three ways:

    *   Sequence statements

    *   Selection statements

    *   Iteration or looping statements


    #### Sequence statements

    The algorithm steps are executed one after another sequentially.


    Here are some examples of the same:


    **Algorithm to print a welcome message:**

    1. Start

    2. `output "Hello world"`

    3. Stop


    **Algorithm to add two numbers:**

    1. Start

    2. Input `num1` and `num2`

    3. `sum = num1 + num2`

    4. `output sum`

    5. End

    This algorithm takes two numbers (`num1` and `num2`) as input, adds them, and
    outputs their sum.


    **Algorithm to find an average of 2 numbers:**

    1. Start

    2. Input `num1` and `num2`

    3. `sum = num1 + num2`

    4. `avg = sum/2`

    5. `output avg`

    6. End

    This algorithm takes two numbers (`num1` and `num2`) as input, adds them, divides
    their sum by 2 (number of input values), and outputs the average.


    **Algorithm to subtract two numbers:**

    1. Start

    2. Input `num1` and `num2`

    3. `diff = num1 - num2`

    4. `output diff`

    5. End

    This algorithm takes two numbers (`num1` and `num2`) as input, subtracts the second
    number from the first, and outputs their difference.


    **Algorithm to multiply two numbers:**

    1. Start

    2. Input `num1` and `num2`

    3. `product = num1 * num2`

    4. `output product`

    5. End

    This algorithm takes two numbers (`num1` and `num2`) as input, computes their
    product and outputs their product.


    **Algorithm for division:**

    1. Start

    2. Input `num1` and `num2`

    3. `quotient = num1 / num2`

    4. `output quotient`

    5. End

    This algorithm takes two numbers (`num1` and `num2`) as input, divides the first
    number by the second, and outputs the quotient.


    **Algorithm to find the area of a circle:**

    1. Start

    2. input `r`

    3. `area = 3.14 x r * r`

    4. `output area`

    5. Stop

    This algorithm takes the radius (`r`) of a circle as input and calculates the
    area of the circle as per the formula. Please remember that we need not take the
    value of Pi (`3.14`) as input, as it is a constant.


    **Algorithm to find the area of a rectangle:**

    1. Start

    2. input `L` and `B`

    3. `area = L * B`

    4. `output area`

    5. Stop

    This algorithm takes the length (`L`) and breadth (`B`) of a rectangle as input
    and calculates the area of the rectangle as per the formula.


    In the above-mentioned examples, all the instructions/ steps are executed one
    after the other. These examples follow a sequential pattern of execution.


    #### Selection statements

    A selective statement algorithm is a computer program that allows a computer to
    make decisions based on certain conditions or criteria. Here are some examples
    of selective statement algorithms:

    *   If-else statement: The if-else statement is a conditional statement that executes
    a certain block of code if a certain condition is met and another block of code
    if the condition is not met. For example:


    ```

    if age >= 18

    output "You are an adult."

    else:

    output "You are not an adult yet."

    ```

