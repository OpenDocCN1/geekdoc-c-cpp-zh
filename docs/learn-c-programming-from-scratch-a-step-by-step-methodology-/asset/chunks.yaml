    \n![](images/fm1.png)\n\n# [CHAPTER 6Pointers](#contents.xhtml_ch06a)\n\n[Introduction](#contents.xhtml_sc2_199a)\n\
    \nIn this chapter, we will explore various topics related to arrays, string manipulation,\
    \ and matrices in the context of programming. Arrays are one-dimensional structures\
    \ that allow us to store and manipulate a collection of elements. We will learn\
    \ how to perform operations on arrays, such as accessing elements and modifying\
    \ their values. Additionally, we will delve into string manipulation, understanding\
    \ how to work with strings effectively. Furthermore, we will talk about matrices\
    \ and explore how to pass a two-dimensional matrix to a function.\n\n[Structure](#contents.xhtml_sc2_200a)\n\
    \nIn this chapter, we will cover the following topics:\n\n*   Pointers\n*   String\
    \ manipulation\n*   Pointer arithmetic\n*   Null pointers\n*   Dangling pointers\n\
    *   Void pointers\n*   Wild pointers\n*   Array of pointers\n\n[Objectives](#contents.xhtml_sc2_201a)\n\
    \nThe objective of this chapter is to provide a comprehensive understanding of\
    \ arrays, string manipulation, and matrices. By the end of this chapter, you will\
    \ be equipped with the knowledge and skills necessary to manipulate arrays effectively,\
    \ perform string operations efficiently, and work with matrices in programming.\
    \ Through practical examples and explanations, we aim to enable you to apply these\
    \ concepts in your coding projects.\n\n[Pointers](#contents.xhtml_sc2_202a)\n\n\
    The concept of pointers in C programming language is one of the important concepts\
    \ since it enables us to directly change data and interact with memory locations.\
    \ For effective memory management, dynamic memory allocation, and sophisticated\
    \ data structures in C, understanding pointers is essential.\n\nA pointer is a\
    \ type of variable that essentially points to the place in memory where the real\
    \ data is kept. The ‘*’ sign, followed by the variable name, is used to declare\
    \ pointers in the language C.\n\nPointers allow a program to manipulate the memory\
    \ directly rather than working with the data stored at that memory address. Pointers\
    \ can be used to create dynamic data structures, such as linked lists and trees,\
    \ and to pass large amounts of data to and from functions more efficiently. To\
    \ declare a pointer, we must mention the data type of the variable along with\
    \ a special symbol - asterisk (*) to distinguish it from other ordinary variables.\n\
    \n[Using pointers](#contents.xhtml_sc3_203a)\n\nPointers can be used following\
    \ the below-mentioned steps:\n\n1.  Declare a pointer variable.\n2.  Assign the\
    \ address of a variable to a pointer.\n3.  Access value at the address stored\
    \ in the pointer.\n\n[Declaring a pointer](#contents.xhtml_sc3_204a)\n\nA pointer\
    \ is a variable that stores the address of another variable; that is, it stores\
    \ the address of the memory location. Like other variables, we must declare a\
    \ pointer before we start using it to store any variable address. In [Figure 6.1](#ch06.xhtml_fig6-1),\
    \ the address of a variable, a (which stores 10), is stored by another variable,\
    \ ptr, which must be declared as a pointer:\n\n![](images/Figure_6.1.png)\n\n\
    Figure 6.1: ptr storing address of a\n\nThe general form of a pointer variable\
    \ declaration is:\n\ntype *var;\n\nWhere:\n\n*   type is the pointer’s data type;\
    \ it must be a valid C data type.\n*   var is the name of the pointer variable.\n\
    \nAsterisk  (*) is used to declare a pointer. In other words, the * would tell\
    \ the compiler that the variable is a special variable that would store a memory\
    \ address rather than ordinary values.\n\nSome examples of the pointer declaration\
    \ are:\n\nint *ip; // pointer to an integer\n\ndouble *dp; // pointer to a double\n\
    \nfloat *fp; // pointer to a float\n\nchar *ch; // pointer to a character\n\n\
    The data type of a pointer variable is established by the kind of data it points\
    \ to. The value stored by pointers is essentially the same, whether declared as\
    \ int, float, char, or others, that is, a long hexadecimal number that represents\
    \ a memory address. The only difference between pointers of different data types\
    \ is the data type of the variable or constant that the pointer points to. The\
    \ data type of a pointer variable, however, determines how it is dereferenced\
    \ and the amount of memory is allocated. As dereferencing a pointer with the incorrect\
    \ data type might result in undescribed behavior and type-related difficulties,\
    \ it is crucial to ensure that the pointer’s data type matches the data type of\
    \ the object it references.\n\n[Accessing the value of a pointer](#contents.xhtml_sc3_205a)\n\
    \nPointers are variables that hold memory addresses. Working with pointers requires\
    \ performing the fundamental actions of referencing and dereferencing. Here is\
    \ a description of both:\n\n*   Referencing pointers: Referencing a pointer involves\
    \ discovering the memory address that it refers to. A pointer is referenced using\
    \ the pointer variable alone, without any extra operators.\n\nFor instance, to\
    \ get the memory location held by a pointer variable named p that points to an\
    \ integer, we may use the following reference:\n\n![](images/Figure_6.2.png)\n\
    \nFigure 6.2: Memory map of a dummy pointer\n\nint *p; // Declare a pointer to\
    \ an integer\n\nint x = 100;\n\np = &x; // Assign the address of x to p - Referencing\n\
    \nThe code above uses &x to assign p, the address of x. Hence p will now point\
    \ to variable x. This is referred to as Referencing.\n\n*   Dereferencing pointers:\
    \ Accessing value at a memory address that a pointer points to is known as dereferencing\
    \ that pointer. We must use the dereference operator ‘*’ and the pointer variable\
    \ in order to dereference a pointer.\n\nFor example:\n\nnt *p; // Declare a pointer\
    \ to an integer\n\nint x = 100;\n\np = &x; // Assign the address of x to p\n\n\
    *p = 200; // Set value at the memory address, pointed to by p as 200\n\nIn the\
    \ code example, the value of x is assigned to the variable y as *p (read as value\
    \ at address p) is used to dereference the pointer p.\n\n| Note: In the above\
    \ example p represents an address, while *p represents the value stored at the\
    \ address pointed to by p. |\n\nWe can also modify the value stored at an address\
    \ pointed to by a pointer by dereferencing and assigning a new value.\n\nFor example:\n\
    \nint *p; // Declare a pointer to an integer\n\nint x = 100;\n\np = &x; // Assign\
    \ the address of x to p\n\n*p = 200; // Set value at the memory address, pointed\
    \ to by p as 200\n\nIn the above code, after dereferencing p, new value i-e: 200\
    \ is assigned to x; hence, the value of x will change to 200.\n\nTo access the\
    \ address of a variable, we use the ‘&’ (ampersand) operator. &x (read as address\
    \ of x) gives us the address of the variable x.\n\nFor example, with reference\
    \ to [Figure 6.2](#ch06.xhtml_fig6-2):\n\nprintf(\"Address of x = %p\", &x); //\
    \ will print AEFF\n\nprintf(\"Address of p = %p\", &p); // will print E0FA\n\n\
    // if we have used a referencing statement like p = &x; We can print address of\
    \ x using p as:\n\nprintf(\"Address of x = %p\", p); // will print AEFF as p =\
    \ &x\n\nThe following program makes use of these operations:\n\n#include<stdio.h>\n\
    \nint main ()\n\n{\n\nint x = 10;\n\nint *p; // pointer variable declaration */\n\
    \np = &x; // store address of x in pointer variable*/\n\nprintf(\"Address of a\
    \ = %p\\n\", &x); //address stored in pointer variable\n\nprintf(\"Address stored\
    \ at p = %p\\n\", p);\n\nprintf(\"Value of x = %d\\n\", *p); // access the value\
    \ using pointer\n\nreturn (0);\n\n}\n\nThe test output of the above code is as\
    \ follows:\n\nAddress of x = bffd8b3c\n\nAddress stored in p = bffd8b3c\n\nValue\
    \ of x = 10\n\n[Application of pointers](#contents.xhtml_sc3_206a)\n\nApplication\
    \ of pointers in C spreads across the spectrum of processing operations, as discussed\
    \ in the upcoming sections:\n\n[Direct memory manipulation](#contents.xhtml_sc4_207a)\n\
    \nPointers enable direct memory manipulation, which is advantageous for dealing\
    \ with hardware or optimizing memory utilization in low-level programming activities.\
    \ We can read and alter data at certain memory locations by fiddling with pointers.\n\
    \n[Dynamic memory allocation](#contents.xhtml_sc4_208a)\n\nPointers play an essential\
    \ role in using functions like malloc, calloc, and realloc. These operations return\
    \ a reference to the RAM that was allocated and do so at runtime. This makes it\
    \ possible to create adaptable data structures like dynamic arrays, linked lists,\
    \ and trees.\n\nIn C programming, dynamic memory allocation is achieved using\
    \ three functions:\n\n*   malloc()\n\nThis function is used to allocate a block\
    \ of memory of a specified size. The syntax for this function is:\n\nptr = (cast-type*)\
    \ malloc(byte-size);\n\nHere, ptr is a pointer to the allocated memory, and byte-size\
    \ is the number of bytes to be allocated.\n\nExample 1:\n\n#include <stdio.h>\n\
    \n#include <stdlib.h>\n\nint main ()\n\n{\n\nint n, *ptr;\n\nprintf(\"Input number\
    \ of elements:\");\n\nscanf(\"%d\", &n);\n\nptr = (int*) malloc (n * sizeof(int));\n\
    \nif (ptr == NULL) {\n\nprintf(\"Error! memory not allocated\");\n\nexit (0);\n\
    \n}\n\nprintf(\"Memory successfully allocated using malloc.\\n\");\n\nfree(ptr);\n\
    \nreturn 0;\n\n}\n\nExample 2:\n\nint main () {\n\nint *p;\n\np = malloc (2);\
    \ //would allocate 2 bytes since p is an int pointer\n\n*p = 10;\n\nPrintf(\"\
    value stored = %d\", *p);\n\nreturn (0);\n\n}\n\nEven though we can use malloc()\
    \ this way, it is a standard practice to allocate memory in standard sizes (sizes\
    \ defined for various data types) using the sizeof () function:\n\nmalloc (sizeof\
    \ (int));\n\n//sizeof function returns the number of bytes (memory requirement)\
    \ of a data type\n\n*   calloc()\n\nThis function is used to allocate a block\
    \ of memory of a specified size and initialize the memory to zero. The syntax\
    \ for this function is:\n\nptr = (cast-type*) calloc (n, element-size);\n\nWhere\
    \ ptr is a pointer to the allocated memory, n is the number of elements, and element-size\
    \ is the size of each element in bytes.\n\nExample:\n\n#include <stdio.h>\n\n\
    #include <stdlib.h>\n\nint main () {\n\nint n, i, *ptr;\n\nprintf(\"Input number\
    \ of elements:\");\n\nscanf(\"%d\", &n);\n\nptr = (int*) calloc (n, sizeof(int));\n\
    \nif (ptr == NULL) {\n\nprintf(\"Memory not allocated\");\n\nexit (0);\n\n}\n\n\
    printf(\"Memory successfully allocated using calloc.\\n\");\n\nfree(ptr);\n\n\
    return 0;\n\n}\n\n*   realloc()\n\nThis function is used to resize the previously\
    \ allocated memory block. The syntax for this function is:\n\nptr = realloc (ptr,\
    \ new-size);\n\nWhere, ptr is a pointer to the previously allocated memory, and\
    \ the new size is the new size of the memory block in bytes.\n\nExample:\n\n#include\
    \ <stdio.h>\n\n#include <stdlib.h>\n\nint main ()\n\n{\n\nint *ptr, n;\n\nptr\
    \ = (int*) malloc (10 * sizeof(int));\n\nif (ptr == NULL) {\n\nprintf(\"Error!\
    \ memory not allocated\");\n\nexit (1);\n\n}\n\nprintf(\"Memory successfully allocated\
    \ using malloc.\\n\");\n\nprintf(\"Enter new size of memory:\\n\");\n\nscanf(\"\
    %\", &n);\n\nptr = (int*) realloc(ptr, n * sizeof(int));\n\nif (ptr == NULL) {\n\
    \nprintf(\"Error! memory not reallocated\");\n\nexit (0);\n\n}\n\nprintf(\"Memory\
    \ successfully reallocated using realloc\");\n\nreturn (0);\n\n}\n\nKnowing the\
    \ size of an array makes it simple to define it appropriately while programming.\
    \ If you want to save the name of any individual, for instance, you may store\
    \ up to 100 characters. Therefore, you might create something like this: char\
    \ name [100];.\n\nLet us now look at a scenario when you are unsure of the text’s\
    \ length and need to save it, such as when you need to store a thorough explanation\
    \ of a subject. Here, we must define a character reference without specifying\
    \ how much memory is needed; afterward, we can allocate memory based on the need,\
    \ as shown in the following example:\n\n#include <stdlib.h>\n\n#include <string.h>\n\
    \nint main ()\n\n{\n\nchar n [100];\n\nchar *d;\n\nstrcpy (n,\"Umar zain\");\n\
    \n// will allocate 200 bytes, remember size of char is 1 byte\n\nd = malloc (200\
    \ * sizeof (char));\n\nif (d!= NULL)\n\n{\n\nstrcpy (d,\"Umar zain is a DPS student\
    \ in class 6th\");\n\n}\n\nelse\n\n{\n\nprintf(\"Errorâ€\"- unable to allocate\
    \ required memory\\n\");\n\n}\n\nprintf(\"Name = %s\\n\", n);\n\nprintf(\"Details:\
    \ %s\\n\", d);\n\nreturn (0);\n\n}\n\n[Resizing and releasing memory](#contents.xhtml_sc4_209a)\n\
    \nOperating systems automatically release all the memory your program has allocated\
    \ when it has finished running, but it is best practice to call the function free\
    \ (when memory is no longer needed). By executing the function realloc (instead),\
    \ you can modify the size of a memory block that has been allocated. Use the realloc()\
    \ and free() methods to recheck the program:\n\n*   realloc() example using char\
    \ array (string):\n\n    #include <stdio.h>\n\n    #include <stdlib.h>\n\n   \
    \ #include <string.h>\n\n    int main()\n\n    {\n\n    // Declare a character\
    \ array/pointer and allocate memory\n\n    char *p = (char *)malloc(20 * sizeof(char));\n\
    \n    if (p == NULL)\n\n    {\n\n    printf(\"Memory allocation unsuccessful.\\\
    n\");\n\n    return(1);\n\n    }\n\n    // assign the character array some text\n\
    \n    strcpy(p, \"Hello, zain!\");\n\n    printf(\"before using realloc message\
    \ = \\n%s\\n\", p);\n\n    // Resize the character array using realloc\n\n   \
    \ p = (char *)realloc(p, 30 * sizeof(char));\n\n    if (p == NULL)\n\n    {\n\n\
    \    printf(\"Memory reallocation unsuccessful.\\n\");\n\n    return(1);\n\n \
    \   }\n\n    // append text to the end of string\n\n    strcat(p, \" How are you?\"\
    );\n\n    printf(\"after using realloc Message =\\n %s\\n\", p);\n\n    free(p);\n\
    \n    return(0);\n\n    }\n\nOutput:\n\nbefore using realloc message =\n\nHello,\
    \ zain!\n\nafter using realloc Message =\n\nHello, zain! How are you?\n\n*   realloc()\
    \  example using int array:\n\n    //realloc() example using int array\n\n   \
    \ #include <stdio.h>\n\n    #include <stdlib.h>\n\n    int main()\n\n    {\n\n\
    \    int *a;\n\n    // memory for an array of 5 integers\n\n    a = (int *)malloc(5\
    \ * sizeof(int));\n\n    if (a == NULL)\n\n    {\n\n    printf(\"Memory allocation\
    \ failed\\n\");\n\n    return(1); // Exit the program with an error code\n\n \
    \   }\n\n    // Initialize the array with some values\n\n    for (int i = 0; i\
    \ < 5; i++)\n\n    {\n\n    a[i] = 2*i;\n\n    }\n\n    // Print the initial array\n\
    \n    printf(\"Initial array: \");\n\n    for (int i = 0; i < 5; i++)\n\n    {\n\
    \n    printf(\"%d \", a[i]);\n\n    }\n\n    printf(\"\\n\");\n\n    // Resize\
    \ array to store 10 integers using realloc\n\n    a = (int *)realloc(a, 10 * sizeof(int));\n\
    \n    if (a == NULL)\n\n    {\n\n    printf(\"Memory re-allocation failed\\n\"\
    );\n\n    return(1);\n\n    }\n\n    // Initialize the additional elements\n\n\
    \    for (int i = 5; i < 10; i++)\n\n    {\n\n    a[i] = 2*i;\n\n    }\n\n   \
    \ printf(\"Resized array: \");\n\n    for (int i = 0; i < 10; i++)\n\n    {\n\n\
    \    printf(\"%d \", a[i]);\n\n    }\n\n    printf(\"\\n\");\n\n    // Free the\
    \ memory\n\n    free(a);\n\n    return 0; // Exit the program successfully\n\n\
    \    }\n\n[String pointers](#contents.xhtml_sc4_210a)\n\nString pointers are an\
    \ essential idea for handling strings in C. Character strings are used to express\
    \ and modify sequences of characters that are ended by the null character (‘0’).\
    \ An overview of string pointers in C is provided below:\n\nA string pointer stores\
    \ the address of the first character of a character array. Subsequent characters\
    \ may be accessed by successively incrementing the address. For example, if the\
    \ first character of a char array is stored at address 100, the next character\
    \ of the array may be found at the address which is 1 byte apart (1 byte= sizeof\
    \ (char))\n\nWe can initialize a string pointer in several ways, including:\n\n\
    char *s1 = \"Hello all!\"; // Initialize with a string literal\n\nchar s2[] =\
    \ \"to Programming\"; // Initialize an array of characters\n\nchar *s3 = str2;\
    \ // Initialize with the address of an existing array\n\nWe can access individual\
    \ characters of a string using array subscript notation or pointer arithmetic.\n\
    \nFor example:\n\nchar *s = \"Usman\";\n\nchar fc = s[0]; // Access the first\
    \ character ('U')\n\nchar sc = *(str + 1); // Access the second character ('s')\n\
    \nWe must exercise caution when modifying strings which are referenced string\
    \ pointers. Strings declared as string literals (For example, \"Imad\") are generally\
    \ stored in read-only memory; hence, altering them directly may lead to indeterminate\
    \ behavior. To change a string, we should use an array of characters instead.\n\
    \nIf we dynamically allocate memory for strings using malloc or realloc, we must\
    \ manage memory appropriately and free it (using free) when finished, using the\
    \ string, to prevent memory leaks.\n\nIn C, strings can be represented using two\
    \ main approaches: fixed-length strings and variable-length strings, which are\
    \ discussed as follows:\n\n*   Fixed-length strings\n\nCharacter arrays: A fixed-length\
    \ string in C is typically implemented using a character array.\n\nFor example:\n\
    \nchar fs[30]; // array of characters with a fixed size of 30\n\nNull-terminated:\
    \ In this method, a string is terminated with a null character to indicate the\
    \ end of a string. This is essential for string manipulation functions to work\
    \ properly.\n\nLimited flexibility: We define fixed-length strings with predetermined\
    \ maximum size, which ensures they only hold a certain number of characters, and\
    \ if we try to exceed this limit, it can generate buffer overflow issues.\n\n\
    Fixed-length strings can be more memory-efficient if the maximum size is known\
    \ and constant.\n\nchar n[10] = \"Zain\"; // Fixed-length 10 characters string\n\
    \n*   Variable-length strings\n\nDynamic memory allocation: Variable-length strings\
    \ are implemented using pointers to characters (char*) and dynamic memory allocation\
    \ functions like malloc, realloc, and free. Variable-length strings can dynamically\
    \ grow or shrink during runtime, allowing them to accommodate strings of different\
    \ lengths. Due to dynamic memory allocation, variable-length strings typically\
    \ have more memory overhead compared to fixed-length strings.\n\nchar* vs = (char*)malloc(20\
    \ * sizeof(char)); // memory for 20 char's\n\nfree(vs); // free the allocated\
    \ memory when done\n\n| Criteria | Fixed-length strings | Variable-length strings\
    \ |\n| --- | --- | --- |\n| Use case | Use fixed-length strings when the maximum\
    \ size is known and constant. | Use variable-length strings when the size of the\
    \ string is not known in advance or may change during runtime. |\n| Memory management\
    \ | Fixed-length strings do not require explicit memory management (no need to\
    \ use malloc or free). | Variable-length strings require explicit memory allocation\
    \ and deallocation. |\n| Flexibility | Fixed-length strings have a fixed size\
    \ and cannot change. | Variable-length strings can grow or shrink as needed. |\n\
    | Error-prone | Using fixed-length strings can be safer in terms of buffer overflows\
    \ as long as you ensure you do not exceed the allocated size. | Variable-length\
    \ strings can be more error-prone if not managed properly, as they can potentially\
    \ lead to memory leaks or dangling pointers. |\n\nTable 6.1: Comparison between\
    \ variable and fixed-length strings\n\nThe approaches come with strengths and\
    \ weaknesses, and the choice amongst them is dependent on the requirements of\
    \ the program we are writing.\n\n[Passing parameters to functions](#contents.xhtml_sc4_211a)\n\
    \nPointers are used to pass parameters to functions by reference. This enables\
    \ the function to change the initial variables passed to it as arguments. This\
    \ is especially helpful if we wish to change variables inside of a function and\
    \ have those changes take effect in the code that calls the function or in other\
    \ parts of the program.\n\nGenerally, values of parameters are passed to a function.\
    \ This is referred to as call-by value (or pass-by-value) and is one of the methods\
    \ we can employ for passing parameters to a function in C. When passing arguments\
    \ to a function, the call-by-value method copies the parameter’s actual value\
    \ into the formal parameter. Changes made to the parameter inside the called function\
    \ have no impact on the actual parameter. Call by value is the default method\
    \ for passing arguments in C programming.\n\nCall by reference method, on the\
    \ other hand, copies the address of a parameter into the formal parameter. Inside\
    \ the function, the address is used to access the actual value pointed to by the\
    \ address (the content of the formal parameter). It means the changes made to\
    \ the parameter affect the actual argument.\n\nTo pass a value by reference, addresses\
    \ are passed to the called function, just like other parameters. So accordingly,\
    \ to be in sync with the parameter protocols, we must declare the formal parameters\
    \ as pointer type as demonstrated in the following programming examples:\n\n*\
    \   Modifying a variable called function:\n\n    #include <stdio.h>\n\n    #include\
    \ <stdlib.h>\n\n    void inc (int *x)\n\n    {\n\n    (*x) ++; // value at x being\
    \ incremented\n\n    }\n\n    int main () {\n\n    int a = 10;\n\n    printf(\"\
    Before calling inc function, a = %d\\n\", a);\n\n    inc (&a); //passing address\
    \ of a and b variables\n\n    printf(\"After calling inc function, a = %d\\n\"\
    , a);\n\n    return (0);\n\n    }\n\n    Output:\n\nBefore calling inc function,\
    \ a = 10\n\nAfter calling inc function, a = 11\n\n*   Swap two variables using\
    \ pointers:\n\n    #include <stdio.h>\n\n    #include <stdlib.h>\n\n    void swap\
    \ (int * x, int * y)\n\n    {\n\n    // Declare x & y as pointer cells (we are\
    \ receiving addresses of a and b)\n\n    int temp;\n\n    temp = *x; // save the\
    \ value at address x to temp\n\n    *x = *y; // put value at y into x\n\n    *y\
    \ = temp; // put temp into y\n\n    }\n\n    int main ()\n\n    {\n\n    int a\
    \ = 100, b = 200;\n\n    printf(\"Before swapping, value of a: %d\\n\", a);\n\n\
    \    printf(\"Before swap, value of b: %d\\n\", b);\n\n    swap(&a, &b); //passing\
    \ address of a and b variables\n\n    printf(\"After swap, value of a: %d\\n\"\
    , a );\n\n    printf(\"After swap, value of b: %d\\n\", b );\n\n    return (0);\n\
    \n    }\n\n    Output:\n\nBefore swapping, value of a: 100\n\nBefore swap, value\
    \ of b: 200\n\nAfter swap, value of a: 200\n\nAfter swap, value of b: 100\n\n\
    It shows that the change has reflected outside the function as well, unlike call\
    \ by value, where the changes do not reflect outside the function.\n\n| Note:\
    \ Arrays are always passed by reference, that is, why any changes performed on\
    \ an array in one function reflect in other functions (or throughout the program).\
    \ |\n\n[Effective array manipulation](#contents.xhtml_sc4_212a)\n\nPointers may\
    \ be effectively utilized to modify arrays. We can go through an array, get at\
    \ its components, and carry out actions on them by incrementing or decrementing\
    \ a pointer.\n\nArray manipulation using pointers in C allows us to efficiently\
    \ access and modify array elements by using pointer arithmetic. By utilizing pointers,\
    \ you can perform operations such as traversing the array, modifying values, and\
    \ swapping elements. Let us explore some common array manipulation techniques\
    \ using pointers in C:\n\n*   Accessing array elements: Pointers can be used to\
    \ access array elements directly, eliminating the need for indexing. We can assign\
    \ a pointer to the first element of the array and then use pointer arithmetic\
    \ to access subsequent elements:\n\n    *   Simple integer access:\n\n       \
    \ int main ()\n\n        {\n\n        int a = 10;\n\n        int *p;\n\n     \
    \   p = &a;\n\n        //store address of a in pointer variable*/\n\n        printf(\"\
    Value of a = %d\\n\", *p);\n\n        // access the value using pointer\n\n  \
    \      return (0);\n\n        }\n\n*   Array access (any particular element):\n\
    \n    //Array access:\n\n    #include <stdio.h>\n\n    int main ()\n\n    {\n\n\
    \    int a [5] = {10, 20, 30, 40, 50};\n\n    int *p;\n\n    p = a;\n\n    //\
    \ Points to the first element of array\n\n    printf(\"First element of Array\
    \ = %d\\n\", *p);\n\n    // Prints 10\n\n    return (0);\n\n    }\n\n    Array\
    \ access (all elements):\n\n    #include <stdio.h>\n\n    int main ()\n\n    {\n\
    \n    int i=0,a[5] = {10, 20, 30, 40, 50};\n\n    int *p;\n\n    p = a;\n\n  \
    \  printf(\"Displaying array elemets using pointer\\n\");\n\n    while (i<5)\n\
    \n    {\n\n    printf(\"%d\\n\", *p);\n\n    p++;\n\n    i++;\n\n    }\n\n   \
    \ return (0);\n\n    }\n\n*   Changing array elements directly: Pointers can be\
    \ used to change array elements. Dereferencing the pointer allows you to give\
    \ array items new values:\n\n    #include <stdio.h>\n\n    #include <stdlib.h>\n\
    \n    int main ()\n\n    {\n\n    int a [5] = {10, 20, 30, 40, 50};\n\n    int\
    \ i=0, *p;\n\n    p = a;\n\n    // Points to the first element of array\n\n  \
    \  while (i<5) {\n\n    *p = *p + 10;\n\n    // changing every array value by\
    \ +10\n\n    printf(\"%d\\n\", *p);\n\n    p++;\n\n    // Moves the pointer to\
    \ the next elementâ€™s address\n\n    i++;\n\n    }\n\n    return (0);\n\n   \
    \ }\n\n    Output:\n\n    20\n\n    30\n\n    40\n\n    50\n\n    60\n\n*   Swapping\
    \ array elements: Pointers can be used to swap the values of two array elements\
    \ efficiently. Here is an example of swapping the first and last elements of an\
    \ array:\n\n    #include <stdio.h>\n\n    int main ()\n\n    {\n\n    int a[]\
    \ = {10, 20, 30, 40, 50};\n\n    int *p1 = a;\n\n    int tmp;\n\n    int *p2;\n\
    \n    p2 = &a[4];\n\n    // Points to the last element of arr\n\n    tmp = *p1;\n\
    \n    // Store the value of the first element in a temporary variable\n\n    *p1\
    \ = *p2;\n\n    // Swap the values of the first and last elements\n\n    *p2 =\
    \ tmp;\n\n    for (int i = 0; i < 5; i++) {\n\n    printf(\"%d \", a[i]);\n\n\
    \    }\n\n    return (0);\n\n    }\n\nOutput:\n\n50\n\n20\n\n30\n\n40\n\n10\n\n\
    [String manipulation](#contents.xhtml_sc4_213a)\n\nIn the C programming language,\
    \ strings are represented as character arrays. To retrieve individual characters,\
    \ concatenate strings, compare strings, and carry out other string operations,\
    \ pointers are frequently utilized.\n\nBy using pointer arithmetic and string-related\
    \ functions, C’s string manipulation with pointers lets you quickly modify and\
    \ process strings. Without the need for extra memory allocation, pointers offer\
    \ a straightforward method to navigate, alter, and execute operations on strings.\n\
    \nSome common string manipulation techniques using pointers in C:\n\n*   Accessing\
    \ characters in a string\n\n    A string’s individual characters can be accessed\
    \ via pointers. You may use pointer arithmetic to traverse a string and access\
    \ characters by allocating a pointer to the string’s beginning. Here is an example:\n\
    \n    #include <stdio.h>\n\n    int main ()\n\n    {\n\n    char *s = \"Think\
    \ Green\";\n\n    char *p = s;\n\n    while (*p!= '\\0')\n\n    {\n\n    printf(\"\
    %c\", *p);\n\n    p++;\n\n    }\n\n    return (0);\n\n    }\n\n    Output:\n\n\
    Think Green\n\n*   Modifying characters in a string\n\n    A string’s individual\
    \ characters can be changed using pointers. Characters in the string can have\
    \ new values assigned to them by dereferencing the reference. It is crucial to\
    \ remember, nevertheless, because altering string literals constitutes undefined\
    \ behavior:\n\n    #include <stdio.h>\n\n    #include <stdlib.h>\n\n    int main\
    \ ()\n\n    {\n\n    char s[6] = \"Gello\";\n\n    char *p;\n\n    p=s;\n\n  \
    \  *p= 'H'; // change 1st character to G\n\n    printf(\"%s\", s);\n\n    return\
    \ (0);\n\n    }\n\n    Output:\n\n    Good\n\n*   String concatenation:\n\n  \
    \  Pointer arithmetic and string-related operations can concatenate two strings\
    \ using pointers. Strings can be copied and concatenated with the strcpy and strcat\
    \ functions, respectively. For example, refer to [Chapter 5, Strings](#ch05.xhtml).\n\
    \n    Pointers may be used to manipulate strings in a flexible and effective manner\
    \ in C. You may quickly read, edit, and concatenate strings without additional\
    \ memory allocation by using pointer arithmetic and string-related methods. It\
    \ is important to make sure that references are handled correctly and that the\
    \ destination string has enough memory to hold the concatenated result, though.\n\
    \n    Just keep in mind that changing string literals might lead to unexpected\
    \ behavior. For changeable strings, character arrays (char[]) are advised over\
    \ string literals (char*).\n\n    We may swiftly and successfully execute a variety\
    \ of string manipulation operations in C by utilizing the power of pointers and\
    \ functions that relate to strings.\n\n[Pointer arithmetic](#contents.xhtml_sc4_214a)\n\
    \nThe C programming language has a feature called pointer arithmetic that enables\
    \ you to perform mathematical operations on pointers. It offers an easy method\
    \ to move around and work with objects in dynamically allocated memory or an array.\
    \ You can effectively access, navigate, and work with memory-based data structures\
    \ if you comprehend pointer arithmetic.\n\nThe size of the datatype the pointer\
    \ points to determines how pointer arithmetic works in C. The size of the data\
    \ type is considered when performing arithmetic operations on a pointer.\n\nThe\
    \ following arithmetic operations can be performed on pointers:\n\n*   Increment\
    \ and decrement\n\n    We can increment or decrement a pointer by several elements\
    \ as follows:\n\n    #include <stdio.h>\n\n    int main ()\n\n    {\n\n    int\
    \ a [5] = {10, 20, 30, 40, 50};\n\n    int i=0, *p;\n\n    p = a;\n\n    // Points\
    \ to the first element of array\n\n    while (i<5)\n\n    {\n\n    printf(\"%d\\\
    n\", *p);\n\n    p++;\n\n    // Moves the pointer to the next element\n\n    i++;\n\
    \n    }\n\n    return (0);\n\n    }\n\nDecrement example:\n\n#include <stdio.h>\n\
    \nint main ()\n\n{\n\nint a [5] = {10, 20, 30, 40, 50};\n\nint i=4, *p;\n\np =\
    \ &a[4];\n\n// Points to the last element of array\n\nwhile (i>=0)\n\n{\n\nprintf(\"\
    %d\\n\", *p);\n\np--; // Moves the pointer to the next element\n\ni--;\n\n}\n\n\
    return (0);\n\n}\n\n*   Addition and subtraction:\n\n    Pointers can be added\
    \ or subtracted by an integer value. The result is calculated based on the size\
    \ of the data type.\n\n    For example:\n\n    #include <stdio.h>\n\n    #include\
    \ <stdlib.h>\n\n    int main ()\n\n    {\n\n    int a [5] = {10, 20, 30, 40, 50};\n\
    \n    int i=0, *p;\n\n    p = &a;\n\n    printf(\"%d\\n\", *p); // First Element\n\
    \n    p=p+3;\n\n    // Moves the pointer to the 4Th element\n\n    printf(\"%d\\\
    n\", *p);\n\n    return (0);\n\n    }\n\n*   Pointer difference:\n\n    You can\
    \ subtract two pointers of the same type to determine the number of elements between\
    \ them. The result is the difference in memory addresses divided by the size of\
    \ the data type.\n\n    For example:\n\n    #include <stdio.h>\n\n    #include\
    \ <stdlib.h>\n\n    int main ()\n\n    {\n\n    int a[5] = {10, 20, 30, 40, 50};\n\
    \n    int *p1 = &a[0];\n\n    int *p2 = &a[3];\n\n    int pdiff = p2-p1;\n\n \
    \   printf(\"Address are %d Size-Units apart\", pdiff);\n\n    return (0);\n\n\
    \    }\n\n    Output:\n\nAddress are 3 Size-Units apart\n\n[Pointer comparisons](#contents.xhtml_sc3_215a)\n\
    \nThe addresses stored by two pointers are compared in C via pointer comparisons.\
    \ Comparing pointers can be helpful in a variety of situations, such as detecting\
    \ if two pointers lead to the same location in memory or the relative order of\
    \ two memory locations. Comparing pointers is possible using relational operators\
    \ like ==, < and >.\n\nThe following are some key ideas in C’s pointer comparisons:\n\
    \n*   Equality comparison\n\n    The equality operator can be used to determine\
    \ if two pointers are referring to the same address in memory.\n\n    For example:\n\
    \n    #include <stdio.h>\n\n    int main()\n\n    {\n\n    int a=10,b=20;\n\n\
    \    int* p1;\n\n    int* p2;\n\n    // make p1 and p2 to some addresses\n\n \
    \   // p1=&a;\n\n    //p2=&b;\n\n    // Compare the 2 pointers\n\n    if (p1 ==\
    \ p2)\n\n    {\n\n    printf(\"p1 and p2 point to the same memory address\");\n\
    \n    }\n\n    else\n\n    {\n\n    printf(\"p1 and p2 point to the different\
    \ memory address\");\n\n    }\n\n    return (0);\n\n    }\n\n*   Inequality comparison\n\
    \n    To determine if two pointers are referring to separate memory locations,\
    \ use the inequality operator (‘!=’).\n\n    For example:\n\n    //Inequality\
    \ comparison\n\n    #include <stdio.h>\n\n    int main()\n\n    {\n\n    int a=10,b=20;\n\
    \n    int* p1;\n\n    int* p2;\n\n    // make p1 and p2 to some addresses like\n\
    \n    p1=&a;\n\n    p2=&b;\n\n    if (p1 != p2) { // Compare the 2 pointers\n\n\
    \    printf(\"p1 and p2 point to the different memory addresses\");\n\n    }\n\
    \n    else {\n\n    printf(\"p1 and p2 point to the same memory address\");\n\n\
    \    }\n\n    return (0);\n\n    }\n\n*   Relational comparison\n\n    The relative\
    \ order of memory addresses can also be determined via pointer comparisons. When\
    \ two pointers are compared, their respective locations in memory are verified\
    \ using the relational operators '', ‘>’, ‘=’, and ‘>=’. It is crucial to remember\
    \ that comparing pointers that do not point to components of the same array or\
    \ associated memory results in undefinable behavior.\n\n    For example, comparing\
    \ two pointers from the same array can help determine their order:\n\n    #include\
    \ <stdio.h>\n\n    #include <stdlib.h>\n\n    int main () {\n\n    int a [5] =\
    \ {10, 20, 30, 40, 50};\n\n    int* p1 = &a [1];\n\n    int* p2 = &a [3];\n\n\
    \    if (p1 < p2) {\n\n    printf(\"p1 points to a lower memory location than\
    \ p2\");\n\n    }\n\n    else {\n\n    printf(\"p2 points to a lower memory location\
    \ than p1\");\n\n    }\n\n    return (0);\n\n    }\n\n    Output:\n\np1 points\
    \ to a lower memory location than p2\n\nThe memory locations that the pointers\
    \ hold are used as the basis for pointer comparisons in C. To prevent undefined\
    \ behavior, it is crucial to exercise caution and ensure that the pointers being\
    \ compared are properly initialized, valid, and associated with the same memory\
    \ area.\n\nWhen working with arrays, iterating over their elements, and modifying\
    \ data structures that demand sequential access, pointer arithmetic is helpful.\
    \ Without the requirement for explicit indexing, it offers an effective technique\
    \ to navigate through memory regions.\n\nTo prevent accessing erroneous memory\
    \ addresses or resulting in undefinable behavior, it is crucial to use pointer\
    \ arithmetic with prudence. Make sure that the arithmetic operations are carried\
    \ out within the restrictions of the RAM that has been allotted. By executing\
    \ arithmetic operations on pointers, the arithmetic pointer in C enables you to\
    \ browse and modify data structures. It makes efficient data access, dynamic memory\
    \ management, and array traversal easier. We may build more effective and expressive\
    \ C code by comprehending and applying pointer arithmetic.\n\nPointers can be\
    \ incremented or decremented and can be subjected to arithmetic operations. Pointer\
    \ arithmetic is made possible by this feature, which is helpful when working with\
    \ arrays and quickly iterating across memory locations.\n\n[Return pointer from\
    \ functions](#contents.xhtml_sc3_216a)\n\nA pointer can be returned from a function\
    \ in C. You can give the calling function a memory location that can be used to\
    \ read or modify data beyond the function’s domain by returning a pointer.\n\n\
    Let us look at some examples now.\n\n*   Declare a function with a pointer as\
    \ the return type:\n\n    int* func (int n) {\n\n    // Function implementation\n\
    \n    }\n\nThe function func() returns a pointer to an integer (int*).\n\n*  \
    \ Perform operations on the allocated memory:\n\n    int* func (int n) {\n\n \
    \   int* a = (int*)malloc(size * sizeof(int));\n\n    // Memory allocation and\
    \ other operations\n\n    for (int i = 0; i < n; i++)\n\n    {\n\n    a[i] = i\
    \ + 1;\n\n    }\n\n    return a;\n\n    }\n\n    In the above example, the allocated\
    \ memory is filled with values (in this case, the array is initialized with consecutive\
    \ integers).\n\n*   Return the pointer from the function:\n\n    int* func (int\
    \ n) {\n\n    int* a = (int*)malloc(size * sizeof(int));\n\n    // Memory allocation\
    \ and other operations\n\n    for (int i = 0; i < n; i++)\n\n    {\n\n    a[i]\
    \ = i + 1;\n\n    }\n\n    return a;\n\n    }\n\n    Subsequently, the pointer\
    \ a is returned from the function after performing the requisite actions.\n\n\
    *   Use the returned pointer in the calling function:\n\n    #include <stdio.h>\n\
    \n    #include <stdlib.h>\n\n    int main ()\n\n    {\n\n    int* a = func (5);\n\
    \n    for (int i = 0; i < 5; i++)\n\n    {\n\n    printf(\"%d \", a[i]);\n\n \
    \   }\n\n    return (0);\n\n    }\n\nIn the code above, the pointer a is assigned\
    \ the returned pointer from func (). The main function then accesses and prints\
    \ elements of the array.\n\nThe facility of returning a pointer from a function\
    \ allows us to allocate memory dynamically and return a reference to the allocated\
    \ memory to the calling function.\n\n[Pointer to pointer](#contents.xhtml_sc3_217a)\n\
    \nA double pointer in C is a variable that stores the address of another pointer\
    \ variable. It is sometimes referred to as a pointer to a pointer. It gives you\
    \ two layers of indirection to use when accessing and changing a pointer’s value.\
    \ When you need to allocate memory dynamically or change pointers themselves,\
    \ you frequently utilize pointers. Here is how you can declare and use a pointer\
    \ to a pointer in C:\n\n*   Declaration: When declaring pointer to pointer, we\
    \ use two asterisks (**).\n\n    Data type** ptr2ptr;\n\n    For example:\n\n\
    \    int ** pv;\n\n*   Initialization: After declaring a pointer to a pointer,\
    \ you can initialize it by assigning the address of a pointer variable to it.\
    \ Here is an example:\n\n    #include <stdio.h>\n\n    #include <stdlib.h>\n\n\
    \    int main()\n\n    {\n\n    int* p; // Pointer variable\n\n    int** p2p;\
    \ // Pointer to a pointer\n\n    p = (int*)malloc(sizeof(int));\n\n    *p = 10;\n\
    \n    p2p = &p; // pointer to pointer\n\n    printf(\"value = %d\", **p2p); //\
    \ use double pointer ** to access stored value\n\n    return (0);\n\n    }\n\n\
    \    Output:\n\n    value stored = 10\n\n    In this example, p is a pointer variable\
    \ that has been allocated memory using malloc. The address of ptr is then assigned\
    \ to p2p using the address-of operator (`&`).\n\n*   Indirection and access: We\
    \ must employ two layers of indirection to access the value of the pointer using\
    \ the double pointer. You can obtain the value at the second level of indirection\
    \ after obtaining the pointer at the first level.\n\n    For example:\n\n    #include\
    \ <stdio.h>\n\n    #include <stdlib.h>\n\n    int main ()\n\n    {\n\n    int\
    \ a [5] = {13, 21, 43, 20, 34};\n\n    int* p=a;\n\n    int** p2p;\n\n    p2p\
    \ = &p;\n\n    printf(\"First Element of the array is %d\", **p2p);\n\n    return\
    \ (0);\n\n    }\n\n    Output:\n\n    First Element of the array is 13\n\n*  \
    \ Dynamic memory allocation: Double pointers are often used in scenarios where\
    \ you need to dynamically allocate memory for a pointer variable. Here is an example:\n\
    \n    // Dynamic memory allocation\n\n    #include <stdio.h>\n\n    int main ()\n\
    \n    {\n\n    int** mat, r=3, c=1, i;\n\n    mat = (int**)malloc(r * sizeof(int*));\n\
    \n    for (i = 0; i < r; i++)\n\n    {\n\n    mat[i] = (int*) malloc (c * sizeof(int));\n\
    \n    *mat[i] = i+1;\n\n    printf(\"%d\\t\", *mat[i]);\n\n    }\n\n    }\n\n\
    \    Output:\n\n    1 2 3\n\nIn the code snippet above, mat is declared as a double\
    \ pointer representing a dynamically allocated 2D array. The first malloc() allocates\
    \ memory for rows of the matrix, and the second malloc() allocates memory for\
    \ each column inside the loop.\n\nIn C, double pointers are an effective tool\
    \ that lets you read and alter pointers without directly accessing them. In situations\
    \ requiring dynamic memory allocation, multi-dimensional arrays, and changing\
    \ pointer values, they are frequently employed. To prevent memory leaks, it is\
    \ essential to correctly manage memory, which includes deallocating memory using\
    \ free when it is no longer required.\n\n[Types of pointers](#contents.xhtml_sc2_218a)\n\
    \nThe different types of pointers are discussed below:\n\n[NULL pointers](#contents.xhtml_sc4_219a)\n\
    \nIf we do not know an exact address to assign to the pointer, it is advised to\
    \ assign a NULL value to the pointer variable when declaring it. A NULL pointer\
    \ is a pointer that has been assigned a value of NULL. According to several standard\
    \ libraries, a NULL pointer is given a value of zero.\n\nFor example:\n\n#include\
    \ <stdio.h>\n\nint main ()\n\n{\n\nint *ptr = NULL; // NULL Pointer\n\nprintf(\"\
    The value of ptr is: %p\\n\", ptr);\n\n}\n\nOutput:\n\nThe value of ptr is 00000000\n\
    \nBecause the operating system has reserved memory at address 0, most operating\
    \ systems do not allow programs to access that memory. The memory address 0 has\
    \ a specific meaning, however, since it indicates that the pointer is not meant\
    \ to point to a memory region that is accessible. But by convention, it is presumed\
    \ that a pointer points to nothing if it has the null (zero) value. To check for\
    \ a null pointer, use the following commands:\n\nif (ptr) //True if p is not null\n\
    \nif (! ptr) // True if p is null\n\n[Dangling pointers](#contents.xhtml_sc4_220a)\n\
    \nDangling (which means to dangle freely) pointers point to a deallocated or freed\
    \ memory location. Dangling Pointer Problem (DPP) refers to the mistake caused\
    \ by dangling pointers. Dangling pointers can also occur when a pointer that was\
    \ pointing to a variable has lost its scope or when the memory that the pointer\
    \ was pointing to is deallocated. When creating programs, attempt to minimize\
    \ the likelihood of dangling pointers because they might cause unanticipated errors\
    \ during program execution.\n\nTo avoid dangling pointer problems, we may:\n\n\
    *   Assign NULL to the pointer when the memory gets deallocated.\n*   Use static\
    \ variables:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int *ptr;\n\
    \n    int a=560;\n\n    ptr=&a;\n\n    printf(\"%p\\n\", ptr); // ptr prints address\
    \ of â€˜aâ€™\n\n    free(ptr); // you deallocated/ freed the memory\n\n    printf(\"\
    %p\", *ptr);\n\n    //will show a dangling (misleading/ false) address\n\n   \
    \ return 0;\n\n    }\n\n[Void pointers](#contents.xhtml_sc4_221a)\n\nThe term\
    \ void pointer refers to a type-less pointer, which means it has no attached data\
    \ type. Any type of address may be stored in a void pointer, which can also be\
    \ type-casted to any data type.\n\nFor example:\n\n//Void Pointer\n\n#include\
    \ <stdio.h>\n\nint main () {\n\nint a = 10;\n\nfloat b = 3.5;\n\nvoid* p = &a;\n\
    \nprintf(\"Address of a = %p\\n\", p); // holds address of int 'a'\n\np = &b;\
    \ // can also store address of float 'b'\n\nprintf(\"Address of b =%p\\n\", p);\n\
    \n}\n\nDynamic memory allocation functions like malloc () and calloc () return\
    \ void * type, which lets these functions allocate memory of any data type. Void\
    \ pointers are used to implement generic functions in C.\n\n| Note: The above\
    \ code compiles in C but shows error in C++; this is because, in C++, we have\
    \ to explicitly typecast the return value of malloc. |\n\n[Wild pointers](#contents.xhtml_sc4_222a)\n\
    \nWild pointers are the un-initialized pointers. These pointers can generate errors;\
    \ such programs in which they are declared are executed.\n\nWild pointer example:\n\
    \n//Wild pointer\n\n#include <stdio.h>\n\nint main () {\n\n// wild pointer\n\n\
    int* ptr; // un-initialized pointer\n\nprintf(\"%d\", *ptr); // No Value because\
    \ |ptr= &a;| like statement missing\n\nreturn 0;\n\n}\n\nIt is important to mention\
    \ that using pointers comes with some drawbacks, like dangling pointers, memory\
    \ leaks, and accessing erroneous memory locations. To ensure proper utilization\
    \ and prevent any problems, diligent management is necessary. In the C programming\
    \ language, pointers are a potent tool. Direct memory manipulation, dynamic memory\
    \ allocation, effective array manipulation, and other sophisticated programming\
    \ methods are made possible by them. For C programming to be mastered and programs\
    \ to be developed that are effective, reliable, and memory-optimized, pointers\
    \ must be understood. To maintain safe and dependable code, however, adequate\
    \ management and comprehension of pointers are required since with tremendous\
    \ power comes great responsibility.\n\n[Array of pointers](#contents.xhtml_sc4_223a)\n\
    \nWe can declare an array of pointers just like we do in the case of an integer\
    \ array or a float array like:\n\nint * ptr [5];\n\nExample:\n\n//Array of pointers\n\
    \n#include <stdio.h>\n\nint main ()\n\n{\n\nint a =10, b = 20, c = 30;\n\nint\
    \ * ptr [3];\n\nptr [0] = &a; //ptr [0] stores address of a â€¦ and so on\n\n\
    ptr [1] = &b;\n\nptr [2] = &c;\n\nprintf(\"Values of a, b and c are %d\\t%d\\\
    t%d\", *ptr [0], *ptr[1], *ptr[2]);\n\nreturn (0);\n\n}\n\nProgram example:\n\n\
    #include <stdio.h>\n\n#include <stdlib.h>\n\nint main () {\n\nint a [5], i, *p[5];\n\
    \nprintf(\"Input 5 elements\\n\");\n\nfor (i =0; i<5; i++) {\n\nscanf(\"%d\",\
    \ &a[i]);\n\np[i] = & a[i];\n\n}\n\nprintf(\"5 elements entered are\\n\");\n\n\
    for (i =0; i<5; i++) //print array elements using pointer array\n\nprintf(\"%d\"\
    , *p[i]);\n\nreturn (0);\n\n}\n\nWe can also use an array of pointers to characters\
    \ to store a list of strings as:\n\n//Array of pointers - example 3\n\n#include\
    \ <stdio.h>\n\nint main () {\n\nchar *n [] = {\n\n\"Zain\",\n\n\"Zaid\",\n\n\"\
    Usman\",\n\n\"Imad\",\n\n};\n\nint i = 0;\n\nfor (i = 0; i < 4; i++)\n\n{\n\n\
    printf(\"Good Boy [%d] = %s\\n\", i+1, n[i]);\n\n}\n\nreturn (0);\n\n}\n\nOutput:\n\
    \nGood Boy [1] = Zain\n\nGood Boy [2] = Zaid\n\nGood Boy [3] = Usman\n\nGood Boy\
    \ [4] = Imad\n\n[Conclusion](#contents.xhtml_sc2_224a)\n\nIn conclusion, this\
    \ chapter has covered crucial concepts related to arrays, string manipulation,\
    \ and matrices in programming. We have explored the fundamentals of one-dimensional\
    \ arrays, including accessing and modifying array elements. Additionally, we have\
    \ delved into string manipulation techniques, equipping you with the skills to\
    \ handle strings effectively. Furthermore, we have examined matrices and learned\
    \ how to pass a two-dimensional matrix to a function. By mastering these topics,\
    \ you have gained valuable knowledge to enhance your ability to work with data\
    \ structures in various programming scenarios.\n\n[Exercise](#contents.xhtml_sc2_225a)\n\
    \n1.  What is a pointer in C programming?\n\n2.  How do you declare a pointer\
    \ in C?\n\n3.  What is the size of a pointer in C?\n\n4.  What will be the output\
    \ of the following code?\n\n    #include <stdio.h>\n\n    int main()\n\n    {\n\
    \n    int x = 5;\n\n    int *ptr = &x;\n\n    printf(\"%d\\n\", *ptr);\n\n   \
    \ return(0);\n\n    }\n\n5.  What is the purpose of a pointer?\n\n6.  What is\
    \ the difference between a pointer and a variable in C?\n\n7.  How do you assign\
    \ a value to a pointer in C?\n\n8.  What will be the output of the following code?\n\
    \n    #include <stdio.h>\n\n    int main()\n\n    {\n\n    int arr[5] = {1, 2,\
    \ 3, 4, 5};\n\n    int *ptr = arr;\n\n    printf(\"%d\\n\", *ptr);\n\n    return(0);\n\
    \n    }\n\n9.  What is a null pointer in C? How do you check if a pointer is null\
    \ in C?\n\n10.  What will be the output of the following code?\n\n    #include\
    \ <stdio.h>\n\n    int main() {\n\n    char ch = 'A';\n\n    char *ptr = &ch;\n\
    \n    printf(\"%c\\n\", *ptr);\n\n    return(0);\n\n    }\n\n11.  What is a void\
    \ pointer in C?\n\n12.  How do you typecast a pointer in C?\n\n13.  What is pointer\
    \ arithmetic in C?\n\n14.  What is a function pointer in C?\n\n15.  What will\
    \ be the output of the following code?\n\n    #include <stdio.h>\n\n    int main()\n\
    \n    {\n\n    int x = 5;\n\n    int *ptr = &x;\n\n    *ptr = 10;\n\n    printf(\"\
    %d\\n\", x);\n\n    return(0);\n\n    }\n\n16.  Write a program in C to declare\
    \ a function pointer in C?\n\n17.  How do you call a function using a function\
    \ pointer in C?\n\n18.  What is a pointer to a pointer in C?\n\n19.  What will\
    \ be the output of the following code?\n\n    #include <stdio.h>\n\n    int main()\n\
    \n    {\n\n    int arr[3] = {1, 2, 3};\n\n    int *ptr = arr;\n\n    printf(\"\
    %d\\n\", *(ptr + 2));\n\n    return(0);\n\n    }\n\n20.  What is dynamic memory\
    \ allocation in C?\n\n21.  Write a program in C to allocate memory dynamically\
    \ using malloc() in C?\n\n22.  How do you free the memory allocated using malloc()\
    \ in C?\n\n23.  What is a memory leak in C?\n\n24.  How do you avoid memory leaks\
    \ in C?\n\nJoin our book’s Discord space\n\nJoin the book’s Discord Workspace\
    \ for Latest updates, Offers, Tech happenings around the world, New Release and\
    \ Sessions with the Authors:\n\n**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\
    \n![](images/fm1.png)\n\n# [CHAPTER 7Structures and Unions](#contents.xhtml_ch07a)\n\
    \n[Introduction](#contents.xhtml_sc2_226a)\n\nIn this chapter, we will explore\
    \ structures and unions in the C programming language. Structures allow us to\
    \ define custom data types that can hold multiple variables of different types.\
    \ Unions, on the other hand, enable us to allocate memory that can be interpreted\
    \ in multiple ways. We will learn how to create and access members of structures\
    \ and unions effectively.\n\n[Structure](#contents.xhtml_sc2_227a)\n\nIn this\
    \ chapter, we will cover the following topics:\n\n*   Structures\n*   Unions\n\
    *   User-defined data types\n*   Enumerations\n*   Members of structure/unions\n\
    *   Accessing structure/union members\n\n[Objectives](#contents.xhtml_sc2_228a)\n\
    \nThe objective of this chapter is to provide a comprehensive understanding of\
    \ structures and unions in C. By the end of this chapter, we aim to equip you\
    \ with the knowledge and skills necessary to create and manipulate structures\
    \ and unions. You will learn how to define structures to hold related data and\
    \ access their members. Additionally, you will understand the concept of unions\
    \ and how to access their different interpretations of memory.\n\n[Structures\
    \ and unions](#contents.xhtml_sc2_229a)\n\nIn C programming, structures, and unions\
    \ are used to group multiple variables of different data types.\n\nA structure,\
    \ usually referred to as a struct, is a grouping of variables of various data\
    \ kinds that are given a single name. A struct’s members are all its variables,\
    \ and they may all be accessed using the dot notation, as in structName, memberName.\n\
    \nComplex data types, such as a date or a point in three dimensions, can be represented\
    \ via structures.\n\nFor instance, the code below creates a structure called student\
    \ with three members named Roll_No, nm, and marks:\n\nstruct student {\n\nint\
    \ Roll_No;\n\nchar nm[20];\n\nfloat marks;\n\n};\n\nA union is similar to a struct,\
    \ except for the fact that all members of a union share the common memory location.\
    \ This means that the value of one member will overwrite the value of another\
    \ member if the union is not set to the correct member. Unions are typically used\
    \ when you want to conserve the memory space by using a single block of memory\
    \ to store multiple variables of different types, but only one of them is used\
    \ at a time.\n\nFor example, the following code defines a union called number\
    \ that can hold an int, a float, or a double:\n\nunion number\n\n{\n\nint i;\n\
    \nfloat f;\n\ndouble d;\n\n};\n\nBoth structures and unions can be used in a variety\
    \ of ways in C programming, such as passing them as function arguments or using\
    \ them as members of other structures or unions, and it is important to use them\
    \ correctly to make the most of their capabilities.\n\n[User defined data types](#contents.xhtml_sc3_230a)\n\
    \nWith user-defined data types in C, programmers may combine different data types\
    \ or build new custom data types on pre-existing data types. These user-defined\
    \ data types offer a mechanism to group similar information and actions into a\
    \ single unit, improving the organization, reuse, and upkeep of the code. Structures\
    \ and enumerations are the two main approaches used in C to build user-defined\
    \ data types.\n\n[Structures](#contents.xhtml_sc3_231a)\n\nYou may develop a composite\
    \ data type in C that unifies linked variables under a single name using structures\
    \ (struct). With the struct keyword and the member variables enclosed in curly\
    \ brackets, a structure may be defined. Here is an example:\n\n//Define a structure\
    \ representing a point in 2D space\n\nstruct student\n\n{\n\nint Roll_No;\n\n\
    char nm[20];\n\nfloat marks;\n\n};\n\n// Create variables of the structure type\n\
    \nstruct student s;\n\n// Access and assign values to structure members\n\ns.Roll_No\
    \ = 25;\n\ns.nm = \"Zain\"; //or strcpy (nm,\"Zain\");\n\ns.marks=39;\n\n[Enumerations](#contents.xhtml_sc3_232a)\n\
    \nEnumerations (enum) can be used to define a collection of named constants. Enumerations\
    \ provide a way to express a collection of related variables. You may define an\
    \ enumeration by using the enum keyword together with the constant names surrounded\
    \ in curly braces. Here is an example:\n\n#include <stdio.h>\n\nint main ()\n\n\
    { // Define an enumeration\n\nenum Fruits\n\n{\n\nApple,\n\nBanana,\n\nCherry,\n\
    \nDates\n\n};\n\nenum Fruits fav; // Declare enumeration type\n\nfav = Dates;\
    \ // Assign a value from the enumeration\n\nswitch (fav)\n\n{ // Use the enumeration\
    \ constants in switch statements\n\ncase Apple:\n\nprintf (\"Not my Favorite\"\
    );\n\nbreak;\n\ncase Banana:\n\nprintf (\"Not my Favorite\");\n\nbreak;\n\ncase\
    \ Cherry:\n\nprintf (\"Not my Favorite\");\n\nbreak;\n\ncase Dates:\n\nprintf\
    \ (\"My Favorite\");\n\nbreak;\n\n}\n\nreturn(0);\n\n}\n\nOutput:\n\nMy Favorite\n\
    \nWe may design unique data structures and named constants that meet the precise\
    \ requirements of your program using user-defined data types in C, such as structures\
    \ and enumerations. With the higher degree of organization and abstraction that\
    \ these data types offer, we can create more modular and enduring programs. User-defined\
    \ data types improve the readability and effectiveness of the C program by enclosing\
    \ relevant data and activities.\n\nIn C programming, user-defined data types can\
    \ be created using typedef and struct.\n\nThe typedef keyword assigns an alternate\
    \ label for an existent data type. This can be useful for making code more readable\
    \ or creating a new data type with a more meaningful name.\n\nFor example, the\
    \ following code creates a new data type called myint that is equivalent to int:\n\
    \ntypedef int myint;\n\nThe struct keyword is used to create a new user-defined\
    \ data type called a structure that can contain multiple variables of different\
    \ data types. Each variable in a struct is called a member and is accessed using\
    \ the dot notation.\n\nFor example, the following code defines a struct called\
    \ person that contains three members, name, age, and address:\n\nstruct person\n\
    \n{\n\nchar name [20];\n\nint age;\n\nchar address [50];\n\n};\n\nWe can also\
    \ create a new type of name for struct using typedef.\n\nFor example:\n\ntypedef\
    \ struct person Person;\n\nIn this way, we can create an instance of the struct\
    \ person using the new type name Person:\n\nPerson p1;\n\nUser-defined data types\
    \ can be used in a variety of ways in C programming, such as passing them as function\
    \ arguments or using them as members of other structures or unions, and it is\
    \ important to use them correctly to make the most of their capabilities.\n\n\
    Let us examine Structure and Union data types in detail.\n\n[Structures](#contents.xhtml_sc3_233a)\n\
    \nArrays allow the defining of different types of variables that can hold several\
    \ data items of the same data types (homogenous). Similarly, structure is another\
    \ user-defined data type we can use in C to combine data of different kinds.\n\
    \nStructures are used to represent a record. Say if we want to keep track of employees\
    \ in a company. We might want to keep up with the following attributes about each\
    \ employee:\n\nEmp_ID\n\nName\n\nParentage\n\nAddress\n\nPhone_No\n\nSalary\n\n\
    It is convenient to organize related data by defining a new data type with various\
    \ members by declaring a structure in C. In a program, things or items like a\
    \ person, a student, or an employee are frequently represented by structures.\
    \ They give you a means to collect related data and work with it as a single entity.\n\
    \n[Declaring a structure](#contents.xhtml_sc4_234a)\n\nA structure can be declared\
    \ in C using the struct keyword, followed by the structure’s name and members.\
    \ The following is how to declare a structure in C:\n\nstruct Employee\n\n{\n\n\
    char name[20];\n\nint age;\n\nfloat salary;\n\n};\n\nIn this code, we declare\
    \ a structure called Employee with three members: name (character array), age\
    \ (integer), and salary (float).\n\nOnce the structure is declared, you can create\
    \ variables of that structure type:\n\nstruct Employee e1;\n\nstruct Employee\
    \ e2;\n\nIn the code above, the variables e1 and e2 are of the Employee structure\
    \ type. To hold the values of the structure members, each variable will have its\
    \ own memory area.\n\nEach member definition is a characteristic variable declaration,\
    \ such as int xyz, float mno, or any other satisfactory variable declaration,\
    \ and the structure tag is optional. We can optionally specify one or more structure\
    \ variables before the last semicolon at the conclusion of the structure declaration,\
    \ as shown below:\n\nstruct Emp\n\n{\n\nchar nm [20];\n\nint age;\n\nfloat sal;\n\
    \n} e1;\n\nHere, we have created a variable e1 just before terminating the definition\
    \ of the structure.\n\n[Accessing structure members](#contents.xhtml_sc4_235a)\n\
    \nWe make use of the member access (dot) operator to gain access to any member\
    \ of a structure. The structure variable name and the structure member that we\
    \ want to access are separated by a dot, which is the member access operator.\
    \ For example, in the above declared structure, Employee, we may access the members\
    \ as:\n\n=================== e1 =================\n\ne1.age = 25;\n\ne1\\. sal\
    \ = 1.75;\n\nstrcpy (e1.nm, \"Omar Zain\");\n\n=================== e2 =================\n\
    \ne2.age = 30;\n\ne2\\. sal = 1.80;\n\nstrcpy (e2.nm, \"Ali Imad\");\n\nIn the\
    \ above code, we access the members of e1 and e2 using the dot operator (`.`).\
    \ We assign values to the nm, age, and sal members of each structure variable\
    \ using the assignment operator (`=`) and the strcpy function for the name member\
    \ (because we have to initialize a string):\n\n#include <stdio.h>\n\nstruct Emp\n\
    \n{\n\nchar nm [20];\n\nint age;\n\nfloat sal;\n\n} ;\n\nint main ()\n\n{\n\n\
    struct Emp e1, e2; // Declare e1 and e2 of type Emp\n\nprintf (\"Input Name, Age\
    \ and Salary of First Employee\\n\");\n\nscanf (\"%s%d%f\", e1.nm, &e1.age, &e1.sal);\n\
    \nprintf (\"Input Name, Age and Salary of 2nd Employee\\n\");\n\nscanf (\"%s%d%f\"\
    , e2.nm, &e2.age, &e2.sal);\n\nprintf (\"Name\\t\\tAge\\t\\tSalary\\n\"); // Heading\n\
    \nprintf (\"%s\\t\\t%d\\t\\t%f\\n\", e1.nm, e1.age, e1.sal);\n\nprintf (\"%s\\\
    t\\t%d\\t\\t%f\\n\", e2.nm, e2.age, e2.sal);\n\nreturn (0);\n\n}\n\nOutput:\n\n\
    Input Name, Age and Salary of First Employee\n\nZain\n\n30\n\n90000\n\nInput Name,\
    \ Age and Salary of 2nd Employee\n\nImad\n\n28\n\n85000\n\nName Age Salary\n\n\
    Zain 30 90000.000000\n\nImad 28 85000.000000\n\n[Access structure members through\
    \ a pointer](#contents.xhtml_sc4_236a)\n\nUsing the arrow operator (‘->’) in C,\
    \ we can access structure members through a pointer. You may dereference a pointer\
    \ to a structure and access its members with the arrow operator. The following\
    \ describes how to use a pointer to access structural members:\n\n*   Define a\
    \ structure:\n\n    struct Emp\n\n    {\n\n    char nm [20];\n\n    int age;\n\
    \n    };\n\n*   Declare a pointer to the structure and allocate memory:\n\n  \
    \  struct Emp *p;\n\n    p = (struct Emp *) malloc (sizeof (struct Emp));\n\n\
    *   Access structure members through the pointer:\n\n    strcpy(p->nm, \"Zain\"\
    );\n\n    p->age = 25;\n\nUsing the arrow operator (->), we can access the members\
    \ of the emp structure through the p pointer.\n\n*   Retrieve and use the structure\
    \ members:\n\n    printf (\"Name: %s\\n\", p->nm);\n\n    printf (\"Age: %d\\\
    n\", p->age);\n\nWe may extract the values of the structure members and utilize\
    \ them as needed by dereferencing the pointer and using the arrow operator. Here,\
    \ we use printf to print the members of nm and age.\n\nAfter you use the structure\
    \ and its members, remember to free the allocated memory using free to release\
    \ the memory resources.\n\nAccessing structure members through a pointer using\
    \ the arrow (->) operator is a common practice in C, especially when working with\
    \ dynamically allocated structures or passing structures to functions. It allows\
    \ you to conveniently access and modify the members of a structure without needing\
    \ to dereference the pointer explicitly:\n\n#include <stdio.h>\n\nstruct Employee\n\
    \n{\n\nchar name [20];\n\nint age;\n\nfloat salary;\n\n};\n\nint main ()\n\n{\n\
    \nstruct Employee *p;\n\np = (struct Employee *)malloc(sizeof(struct Employee));\n\
    \nprintf (\"Input Name, Age and Salary of First Employee\\n\");\n\nscanf (\"%s%d%f\"\
    , p->name, &p->age, &p->salary);\n\nprintf (\"Name\\t\\tAge\\t\\tSalary\\n\");\
    \ // Heading\n\nprintf (\"%s\\t\\t%d\\t\\t%f\\n\", p->name, p->age, p->salary);\n\
    \nreturn (0);\n\n}\n\nOutput:\n\nInput Name, Age and Salary of First Employee\n\
    \nUsmaan\n\n30\n\n95000\n\nName Age Salary\n\nUsman 30 95000.000000\n\n[Using\
    \ arrow (->) operator to access structure members](#contents.xhtml_sc4_237a)\n\
    \nTo access the members of a structure using a pointer to that structure, you\
    \ must use the operator as follows:\n\n#include <stdio.h>\n\nstruct std\n\n{\n\
    \nint rn[50];\n\nchar nm[50];\n\nchar std[100];\n\n};\n\nvoid print (struct std\
    \ *); // function prototype\n\nint main ()\n\n{\n\nstruct std s, *p;\n\np =&s;\n\
    \nprintf(\"Input Roll No., Name, Class of student\\n\");\n\nscanf(\"%d%s%s\",\
    \ &p->rn, &p->nm, & p->std);\n\nprint(p);\n\n}\n\nvoid print (struct student *p)\n\
    \n{\n\nprintf (\"%d\\t%s\\t%s\\n\", p->rn, p->nm, p->std);\n\n}\n\n[Array of structures](#contents.xhtml_sc3_238a)\n\
    \nIn C programming, an array of structures is a collection of structures that\
    \ are grouped together under a single name. Each element in the array is a structure\
    \ and can be accessed using an index, just like an array of basic data types.\n\
    \nTo define an array of structures, we first need to define the structure and\
    \ then create an array of that structure type.\n\nFor example, the following code\
    \ defines a struct called person that contains three members, name, age, and address:\n\
    \nstruct person\n\n{\n\nchar name[20];\n\nint age;\n\nchar address[50];\n\n};\n\
    \nThen, we can define an array of the struct person:\n\nstruct person people[10];\n\
    \nThis will create an array called people that can hold up to 10 elements, each\
    \ of which is a person structure.\n\nYou can also define and initialize an array\
    \ of structures in one step by using an initializer list. For example:\n\nstruct\
    \ person people [] =\n\n{\n\n{\"Zain\", 25, \"New York\"},\n\n{\"Imad\", 30, \"\
    Los Angeles\"},\n\n{\"Usman\", 35, \"Chicago\"}\n\n};\n\nIndividual elements of\
    \ the array can be accessed using the array subscript operator ([]). For example,\
    \ the following code will print the name of the first person in the array:\n\n\
    printf (\"Name: %s\\n\", people[0].name);\n\nAn array of structures can be useful\
    \ when you need to work with multiple instances of a complex data type and perform\
    \ operations on them as a group, such as sorting or searching:\n\n#include <stdio.h>\n\
    \nstruct emp\n\n{\n\nchar id [50];\n\nchar nm [50];\n\nchar par [50];\n\nchar\
    \ adr [100];\n\n};\n\nint main ()\n\n{\n\nstruct emp e[10];\n\nint i, n;\n\nprintf\
    \ (\"Input No. of employees to be recorded\\n\");\n\nscanf (\"%d\", &n);\n\nfor\
    \ (i=0; i<n; i++)\n\n{\n\nprintf (\"Input Id, Name, Parentage and address of Employee\\\
    n\");\n\nscanf (\"%s%s%s%s\", e[i].id, e[i].nm, e[i].par, e[i].adr);\n\n}\n\n\
    for (i=0; i<n; i++)\n\n{ // print records\n\nprintf (\"%s\\t%s\\t%s\\t%d\\n\"\
    , e[i].id, e[i].nm, e[i].par, e[i].adr);\n\n}\n\nreturn (0);\n\n}\n\n[Sort array\
    \ of structures](#contents.xhtml_sc4_239a)\n\nWe may utilize the traditional sorting\
    \ methods discussed in the chapter on Arrays to sort the array of objects/ structures\
    \ in C. The program below uses the Selection Sort method to sort a set of records/\
    \ structures:\n\n#include <stdio.h>\n\n#include <stdlib.h>\n\nstruct emp\n\n{\n\
    \nint id;\n\nchar nm [50];\n\nfloat mks;\n\n};\n\nint main ()\n\n{\n\nstruct emp\
    \ tmp, e[]=\n\n{\n\n{1,\"Zain\", 22},\n\n{2,\"Usman\", 21},\n\n{3,\"Imad\", 28},\n\
    \n{4,\"Saad\", 24},\n\n{5,\"saleem\", 27}\n\n};\n\nint i,j, n=5;\n\nprintf(\"\
    Unsorted records\\n\");\n\nfor (i=0; i<n; i++)\n\n{ // print records\n\nprintf\
    \ (\"%d\\t%s\\t%f\\n\", e[i].id, e[i].nm, e[i].mks);\n\n}\n\n// selection sort\n\
    \nfor (i=0;i<n-1;i++)\n\n{\n\nfor(j=i+1;j<n;j++)\n\n{\n\nif (e[i].mks<e[j].mks)\
    \ // descending Order - Merit\n\n{\n\ntmp=e[i];\n\ne[i]=e[j];\n\ne[j]=tmp;\n\n\
    }\n\n}\n\n}\n\nprintf(\"Sorted records\\n\");\n\nfor (i=0; i<n; i++)\n\n{ // print\
    \ records\n\nprintf (\"%d\\t%s\\t%f\\n\", e[i].id, e[i].nm, e[i].mks);\n\n}\n\n\
    return (0);\n\n}\n\nOutput:\n\nUnsorted records\n\n1 Zain 22.000000\n\n2 Usman\
    \ 21.000000\n\n3 Imad 28.000000\n\n4 Saad 24.000000\n\n5 saleem 27.000000\n\n\
    Sorted records\n\n3 Imad 28.000000\n\n5 saleem 27.000000\n\n4 Saad 24.000000\n\
    \n1 Zain 22.000000\n\n2 Usman 21.000000\n\n[Structures as function arguments](#contents.xhtml_sc4_240a)\n\
    \nStructures can be provided as function arguments in C, enabling you to access\
    \ and modify the data they contain. You may either pass a structure by value or\
    \ by reference when giving it as a parameter to a function, as follows:\n\n* \
    \  Passing a structure by value: When you pass a structure by value, the function\
    \ receives a copy of the full structure. The structure in the calling code will\
    \ not be impacted by any changes made to the structure within the function, according\
    \ to this.\n\nHere is an illustration:\n\n#include <stdio.h>\n\nstruct room\n\n\
    {\n\nint len;\n\nint bred;\n\n};\n\nvoid printarea (struct area r)\n\n{\n\nprintf\
    \ (\"Length= %d and Breadth = %d\\n\", r.len, r.bred);\n\nprintf (\"Area= %d\"\
    , r.len*r.bred)\n\n}\n\nint main()\n\n{\n\nstruct room r = {30, 12};\n\nprintarea\
    \ (r);\n\nreturn 0;\n\n}\n\nstruct student {\n\nint rollno [50];\n\nchar name\
    \ [50];\n\nchar class [100];\n\n};\n\nvoid print (struct student); //function\
    \ prototype\n\nint main () {\n\nstruct student s;\n\nprintf (\"Input Roll No.,\
    \ Name, Class and Section of student\\n\");\n\nscanf (\"%d%s%s\", &s.rollno, &s.name,\
    \ & s.class);\n\nprint (s);\n\n}\n\nvoid print (struct student s) {\n\nprintf\
    \ (\"%d\\t%s\\t%s\\n\", s.rollno, s.name, s.class);\n\n}\n\nPassing a structure\
    \ by reference: You can transmit a structure by reference using pointers to change\
    \ the original structure or avoid duplicating a sizable structure. As a result,\
    \ the function has direct access to the original structure and may alter it.\n\
    \nHere is an illustration:\n\n#include <stdio.h>\n\nstruct room\n\n{\n\nint len;\n\
    \nint bred;\n\n};\n\nvoid printarea (struct room *r)\n\n{ // pointer variable\
    \ receives address\n\nprintf(\"Length= %d and Breadth = %d\\n\", r->len, r->bred);\n\
    \nprintf (\"Area= %d\", r->len*r->bred);\n\n}\n\nint main ()\n\n{\n\nstruct room\
    \ r = {30, 12};\n\nprintarea (&r); // passing address of r\n\nreturn(0);\n\n}\n\
    \nIt is possible to deal with intricate data structures and change their values\
    \ within functions by passing structures as function parameters. You can choose\
    \ to send structures by value or by reference (using pointers), according to your\
    \ needs, to improve efficiency and effectively manage memory.\n\n[Nested structures](#contents.xhtml_sc4_241a)\n\
    \nIn C, we can use a structure as a member of another structure – a structure\
    \ within a structure is referred to as a nested structure. Nesting structures\
    \ in C relate to the idea of enabling the construction of intricate data structures\
    \ with hierarchical connections. A structure member or field is another name for\
    \ the nested structure. Nested structures offer a mechanism to arrange and aggregate\
    \ similar data into a bigger data structure, improving the administration and\
    \ organization of complicated data.\n\nWe may design complicated data types by\
    \ layering one structure inside another utilizing the functionality that C provides.\
    \ For instance, we could need to keep an employee’s entity’s address in a structure.\
    \ Street, state, city, and pin code are additional possible subparts of the attribute\
    \ address. Therefore, to save the employee’s address, we must place it in a different\
    \ structure and nest the structure address within the structure employee.\n\n\
    Consider the following example:\n\nstruct Adr\n\n{\n\nchar str [50];\n\nchar city\
    \ [50];\n\nchar state [50];\n\n};\n\nstruct Emp {\n\nchar nm [50];\n\nint age;\n\
    \nstruct Adr ad;\n\n};\n\n[Accessing nested structure](#contents.xhtml_sc4_242a)\n\
    \nWe can access members of the nested structure by using the dot operator, like\
    \ in the case of the non-nested members.\n\n//Outer_Structure.Nested_Structure.member\
    \ as given below:\n\n//emp.adr.street\n\n#include <stdio.h>\n\nint main ()\n\n\
    {\n\nstruct Emp emp = {\"Omar Zain\", 30, {\"Smartstreet\", \"Srinagar\", \"JK\"\
    }};\n\nprintf (\"Name: %s\\n\", emp.nm);\n\nprintf (\"Age: %d\\n\", emp.age);\n\
    \nprintf (\"Address: %s, %s, %s\\n\", emp.ad.str, emp.adr.city, emp.adr.state);\n\
    \n}\n\nHere, instead of having street, city, and state as members of the employee\
    \ structure, we made a composite structure called adr and placed it inside the\
    \ Employee structure as a member of the structure:\n\n#include <stdio.h>\n\nstruct\
    \ dt\n\n{\n\nint dd;\n\nint mm;\n\nint yy;\n\n};\n\nstruct Emp {\n\nint id;\n\n\
    char nm [50];\n\nstruct dt dob;\n\n};\n\nint main()\n\n{\n\nstruct Emp emp = {\"\
    Omar Zain\", 30, {\"Smartstreet\", \"Srinagar\", \"JK\"}};\n\nprintf (\"ID: %d\\\
    n\", emp.id);\n\nprintf (\"Name: %s\\n\", emp.name);\n\nprintf (\"Birth date:\
    \ %d/%d/%d\\n\", emp.dob.dd, emp.dob.mm, emp.dob.yy);\n\nreturn (0);\n\n}\n\n\
    In the above example, we have defined two structures: dt and employee. The dt\
    \ structure represents a date, with dd, mm, and yy (representing Day, Month, and\
    \ Year respectively) as its members. The Emp structure represents an employee,\
    \ with id, nm, and dob as its members. The dob member variable is itself a structure\
    \ of type dt.\n\nIn the main function, we create an employee structure variable\
    \ and initialize its members. We then print the values of the member variables\
    \ using the printf function.\n\n[Embedded structure](#contents.xhtml_sc4_243a)\n\
    \nAnother way to use a nested structure is to use an embedded structure, which\
    \ allows us to declare a structure inside another structure, requiring fewer lines\
    \ of code. The restriction with the embedded version of nested structures is that\
    \ they cannot be used in multiple data structures.\n\nConsider the following example\
    \ in which we have declared the date structure within the body of the Employee\
    \ structure, and it therefore becomes a member of the Employee structure, which\
    \ would not be accessible to the structures other than the Employee structure:\n\
    \nStruct Emp\n\n{\n\nint id;\n\nchar nm [20];\n\nstruct Dt\n\n{\n\nint dd;\n\n\
    int mm;\n\nint yy;\n\n} dob;\n\n} emp;\n\nNote: The method of accessing members\
    \ of an embedded structure would be same as the method discussed above, that is,\
    \ we can use the ‘.’ Operator to access the nested structure members.\n\n[Unions\
    \ in C](#contents.xhtml_sc3_244a)\n\nA union is an aggregate/ composite data type\
    \ in the C language that enables us to combine variables of various data types\
    \ under a single name. A union may only keep a single of its member variables\
    \ in memory at any given moment, in contrast to structures, which simultaneously\
    \ store all of its member variables in memory. A union is given a memory equal\
    \ to the size of its biggest member. All of a union’s members share the same memory\
    \ location; therefore, modifying one member can affect the value of other members.\
    \ Unions are frequently used when you need to save memory or when you need to\
    \ share a memory location across two different data kinds. When gaining access\
    \ to a union’s members, you must exercise caution since gaining access to the\
    \ incorrect member may have unanticipated consequences. Unions are often employed\
    \ in low-level computer programming for operations like dealing with hardware\
    \ registers and serializing data.\n\n[Syntax of unions](#contents.xhtml_sc4_245a)\n\
    \nSimilar to how a structure is defined in C, a union is also defined using the\
    \ union keyword rather than struct. The general syntax for declaring a union is\
    \ as follows:\n\nunion UnionName {\n\nmember1;\n\nmember2;\n\n...\n\n};\n\nIn\
    \ this syntax, UnionName is the name of the union, and member1, member2, and so\
    \ on represent the members or fields of the union. Each member can have a different\
    \ data type.\n\n[Usage of unions](#contents.xhtml_sc4_246a)\n\nUnions are a data\
    \ structure in programming that allows different data types to be stored in the\
    \ same memory space. They are useful when you must represent a single value that\
    \ can be interpreted in multiple ways, providing memory efficiency and flexibility\
    \ in handling different data types. The following are the uses of unions:\n\n\
    *   Memory optimization\n\n    When several members of a structure are not required\
    \ at once, unions are frequently employed to conserve memory. When opposed to\
    \ utilizing distinct variables for each member, a union can save memory since\
    \ the memory allocated for it is equal to the size of its largest member. When\
    \ working with constrained memory resources or embedded devices, this can be quite\
    \ helpful.\n\n*   Type conversion and interpretation\n\n    Unions offer a means\
    \ of interpreting a single memory region as several kinds. When working with data\
    \ of various sorts that are housed in the same memory region, this is extremely\
    \ helpful. You may see or alter the underlying data in several different ways\
    \ by gaining access to various union members. However, to prevent unexpected effects\
    \ or type-related problems, it is crucial to treat unions carefully.\n\n*   Tagged\
    \ union - discriminated union\n\n    A union that has an additional member known\
    \ as a tag or discriminator is referred to as a tagged union, also known as a\
    \ discriminated union. This tag makes it easier to determine whether a union member\
    \ is legitimate or active at the moment. The representation of data structures\
    \ having various options, such as variant types or data that may take on different\
    \ representations, is frequently done using tagged unions.\n\n[Considerations\
    \ and limitations](#contents.xhtml_sc4_247a)\n\nThe following are the limitations\
    \ of Unions in C:\n\n*   Overwriting data\n\n    Due to the fact that they all\
    \ occupy the same memory region, changing one member of a union might change the\
    \ value of the other members. To avoid unexpected behavior or data damage, it\
    \ is essential to make sure that data is handled and synchronized properly.\n\n\
    *   Limited simultaneous access\n\n    Only one union member can ever be accessed\
    \ or utilized at once because of the shared memory space. The values of other\
    \ members become ambiguous when the value of one member is altered. It is critical\
    \ to keep track of which member is active at any one time to prevent unauthorized\
    \ access to or modification of other members.\n\n*   Padding and alignment\n\n\
    \    Based on the architecture and compiler settings, unions may be subject to\
    \ padding and alignment concerns, much like structures. The union’s size and memory\
    \ configuration may change if padding is introduced to align the union’s members.\n\
    \n*   Type safety\n\n    Unions provide flexibility in data access, but they also\
    \ raise the possibility of type-related mistakes. To prevent unexpected effects\
    \ or violations of type safety, it is essential to guarantee correct type handling\
    \ and casting.\n\n[Examples of union usage](#contents.xhtml_sc4_248a)\n\nFollowing\
    \ are the examples of Unions usages:\n\n*   Type conversion\n\n    Unions can\
    \ be used to reinterpret data or change its type. For instance, you may interpret\
    \ a series of bytes as various kinds, such as characters, floating-point values,\
    \ or integers, using a union.\n\n*   Memory sharing\n\n    Unions can be used\
    \ to exchange memory amongst several sorts of variables.\n\n[Defining a union](#contents.xhtml_sc4_249a)\n\
    \nA union is a unique data type that may be used in C programming to hold several\
    \ variables in the same memory region. A union allocates enough memory to contain\
    \ the biggest member variable instead of allocating memory for each member variable\
    \ separately, as in a structure.\n\nunion [tag]\n\n{\n\nmembers of union\n\n}\
    \ [Union variables];\n\nEach member definition is a typical variable definition,\
    \ such as int i, float f, or any other acceptable variable definition, and the\
    \ union tag is optional. You can optionally specify one or more union variables\
    \ before the last semicolon after the union specification. Here is the way you\
    \ would define a union type named UData, having 3 members int type x, float type\
    \ y, and string type z:\n\nunion UData\n\n{\n\nint x;\n\nfloat y;\n\nchar z [20];\n\
    \n} d;\n\nNow, a variable of UData type can store an integer, a floating-point\
    \ number, or a string of characters. It indicates that several types of data may\
    \ be stored in a single variable, that is, the same memory address. Depending\
    \ on your needs, you may utilize any built-in or user-defined data types inside\
    \ a union.\n\nA union will have enough space in its memory to accommodate its\
    \ largest member. For instance, since 20 bytes is the maximum amount of memory\
    \ a character string may occupy, the data type will take up 20 bytes in the example\
    \ above. The following illustration shows how much memory the union used overall:\n\
    \n#include <stdio.h>\n\nunion UData\n\n{\n\nint x;\n\nfloat y;\n\nchar z [20];\n\
    \n};\n\nint main()\n\n{\n\nunion UData d;\n\nprintf (\"Memory size occupied by\
    \ data: %d\\n\", sizeof (d));\n\nreturn (0);\n\n}\n\nOutput:\n\nMemory size occupied\
    \ by data: 20\n\nThe [Table 7.1](#ch07.xhtml_tab7-1) marks differences between\
    \ Structure and Union in C, taking various criteria like memory, accessing members,\
    \ and initialization of membersand more into consideration:\n\n| Structure | Union\
    \ |\n| --- | --- |\n| The keyword union is used to define a union. | A keyword\
    \ struct is defined as a structure. |\n| The size of the union is equal to the\
    \ size of the largest member. | Size equates to greater than or equal to the sum\
    \ of the sizes of its members. |\n| Memory allocated to the union is shared by\
    \ members of the union. | Every member is assigned a unique storage area of location.\
    \ |\n| Altering the value of any of the members will alter other members’ values.\
    \ Only one member can be accessed at a time. | Altering the value of a member\
    \ will not affect other members of the structure. |\n| Only the first member of\
    \ the union can be initialized. | Several members of a structure can be initialized\
    \ at once. |\n\nTable 7.1: Structure versus Union\n\n[Accessing union members](#contents.xhtml_sc4_250a)\n\
    \nUsing the member access operator (dot), we are able to access any union member.\
    \ The union variable name and the union member that we want to access are separated\
    \ by a period (.), which is the member access operator. When defining variables\
    \ of the union type, the term union is used. The example below demonstrates how\
    \ to include unions in a program:\n\n#include <stdio.h>\n\nunion std {\n\nint\
    \ rn;\n\nfloat mks;\n\nchar nm [20];\n\n};\n\nint main () {\n\nunion std s;\n\n\
    s.rn = 10;\n\ns.mks = 220.5;\n\nstrcpy (s.nm, \"Saleem\");\n\nprintf (\"Id: %d\\\
    n\", s.rn);\n\nprintf (\"Marks: %f\\n\", s.mks);\n\nprintf (\"Name: %s\\n\", s.nm);\n\
    \nreturn (0);\n\n}\n\nOutput:\n\nId: 1701601619\n\nMarks: 69767112807043203000000.000000\n\
    \nName: Saleem\n\nThe final value allocated to the variable has taken up the memory\
    \ address, as can be seen, the values of the i and f members of the union have\
    \ been changed. This is why the value of the nm member is being printed so clearly.\
    \ Let us take a second look at the same example, this time using one variable\
    \ at a time, which is the major benefit of unions:\n\n#include <stdio.h>\n\nunion\
    \ std {\n\nint rn;\n\nfloat mks;\n\nchar nm [20];\n\n};\n\nint main () {\n\nunion\
    \ std s;\n\ns.rn = 10;\n\nprintf (\"Id: %d\\n\", s.rn);\n\ns.mks = 220.5;\n\n\
    printf (\"Marks: %f\\n\", s.mks);\n\nstrcpy (s.nm, \"Saleem\");\n\nprintf (\"\
    Name: %s\\n\", s.nm);\n\nreturn (0);\n\n}\n\nOutput:\n\nId: 10\n\nMarks: 220.500000\n\
    \nName: Saleem\n\nNow, all the members are getting printed the way they were initialized\
    \ because one member is being used at a time.\n\n[Error handling and validation\
    \ in structures/unions](#contents.xhtml_sc3_251a)\n\nThe accurate and safe operation\
    \ of your code depends heavily on error handling and validation when utilizing\
    \ structures and unions in C. In the context of structures and unions, the following\
    \ factors should be considered for error handling and validation:\n\n[Handling\
    \ memory allocation errors](#contents.xhtml_sc4_252a)\n\nWhen dynamically allocating\
    \ memory for unions or structures (using ‘malloc’, 'calloc’, and so on), always\
    \ verify that the allocation was successful:\n\nstruct str* ptr = malloc(sizeof(struct\
    \ str));\n\nif (ptr == NULL)\n\n{\n\nprintf(\"Memory allocation failed\\n\");\n\
    \nexit(1);\n\n}\n\n[Member initialization](#contents.xhtml_sc4_253a)\n\nMake sure\
    \ that a structure’s or union’s members are all correctly initialized, especially\
    \ if you are utilizing dynamic memory allocation:\n\n#include <stdio.h>\n\nstruct\
    \ Person\n\n{\n\nchar nm[30];\n\nint age;\n\n};\n\nint main()\n\n{\n\nstruct Person*\
    \ p = malloc(sizeof(struct Person));\n\nif (p == NULL) {\n\nprintf(, \"Memory\
    \ allocation failed\\n\");\n\nexit(1);\n\n}\n\nstrcpy(p->name, \"Zain\");\n\n\
    p->age = 30;\n\nprintf (\"Name: %s\\t Age = %d\\n\", p->name, p->age);\n\nreturn\
    \ (0);\n\n}\n\n[Input validation](#contents.xhtml_sc4_254a)\n\nIf our program\
    \ relies on user input to provide data to structures /unions, we must validate\
    \ the input to avoid errors or unexpected conduct:\n\nstruct Date\n\n{\n\nint\
    \ day;\n\nint month;\n\nint year;\n\n};\n\nstruct Date d;\n\nprintf(\"Enter day\
    \ (1-31): \");\n\nscanf(\"%d\", &d.day);\n\nif (d.day < 1 || d.day > 31) {\n\n\
    printf(\"Invalid day.\\n\");\n\nexit(1);\n\n}\n\n[Union discriminant handling](#contents.xhtml_sc4_255a)\n\
    \nPrior to gaining access to members, confirm that any discriminant members that\
    \ a union may have, are properly established and identify what kind of data the\
    \ union holds:\n\nunion Data\n\n{\n\nint intVal;\n\ndouble doubleVal;\n\nchar\
    \ stringVal[20];\n\nchar type; // Discriminant\n\n};\n\nunion Data d;\n\nd.type\
    \ = 'i'; // Indicates that intVal is valid\n\nif (d.type == 'i')\n\n{\n\nd.intVal\
    \ = 42;\n\nprintf(\"Value: %d\\n\", d.intVal);\n\n}\n\nelse\n\n{\n\nprintf( \"\
    Invalid type.\\n\");\n\nexit(1);\n\n}\n\n[Error reporting and exiting](#contents.xhtml_sc4_256a)\n\
    \nWhen a mistake occurs, it is crucial to acknowledge it and respond accordingly.\
    \ This might entail ending the application, issuing an error notice, and releasing\
    \ memory that has been allotted.\n\nif (errorCondition)\n\n{\n\nprintf(\"Error\
    \ occurred.\\n\");\n\nexit(1);\n\n}\n\n[Graceful decline](#contents.xhtml_sc4_257a)\n\
    \nWe could be interested in developing handling of errors or graceful degradation\
    \ techniques as a means of managing exceptions or mistakes in a C program in a\
    \ gentle manner:\n\n*   Error codes: Use codes for errors to show if a function\
    \ succeeded or failed. An error code is returned by a function that meets a problem;\
    \ the calling function can examine this code and take the necessary action.\n\
    *   Descriptive error messages: These messages should be incorporated into your\
    \ code. To assist in locating and resolving the problem, print or record an informative\
    \ error message whenever one occurs.\n\n[Graceful recovery](#contents.xhtml_sc4_258a)\n\
    \nOur software/ application should be able to bounce back from mistakes as gently\
    \ as possible. For instance, in the event that a file action is unsuccessful,\
    \ the software may try utilizing a different approach or default values.\n\nResource\
    \ management: Make sure that resources, such as file handles or RAM, are released\
    \ and handled appropriately. When managing files, use mechanisms like fclose()\
    \ and free() for dynamic memory.\n\nImplementing appropriate debugging and logging\
    \ procedures will aid in the diagnosis of problems as they arise.\n\nFor example:\n\
    \n#include <stdio.h>\n\nstruct Student {\n\nchar nm[50];\n\nint age;\n\n};\n\n\
    int main() {\n\nstruct Student s;\n\n// Error-checking\n\nif (s.age > 0) {\n\n\
    printf(\"Student's age: %d\\n\", s.age);\n\n} else {\n\nprintf(\"Age is invalid.\\\
    n\");\n\n}\n\nreturn 0;\n\n}\n\n[Conclusion](#contents.xhtml_sc2_259a)\n\nIn conclusion,\
    \ this chapter has covered important concepts related to structures and unions\
    \ in C programming. We have explored how structures allow us to define custom\
    \ data types that can hold multiple variables of different types, facilitating\
    \ organized data storage. Moreover, we have learned about unions, which provide\
    \ the ability to allocate memory that can be interpreted in various ways. By understanding\
    \ how to create and access structure and union members, you now possess the skills\
    \ necessary to effectively utilize these data structures in your C programs.\n\
    \n[Exercises](#contents.xhtml_sc2_260a)\n\n1.  What are structures in C programming?\n\
    \n2.  What is the purpose of using structures in C programming?\n\n3.  How do\
    \ you access members of a structure in C programming?\n\n4.  Write a program to\
    \ declare and initialize a structure in C programming.\n\n5.  Can you have a structure\
    \ inside another structure in C programming?\n\n6.  What is the size of a structure\
    \ in C programming?\n\n7.  What is the difference between a structure and a union\
    \ in C programming?\n\n8.  What is the size of a union in C programming?\n\n9.\
    \  Write a program to access members of a union in C programming.\n\n10.  What\
    \ is the purpose of using unions in C programming?\n\n11.  What will be the output\
    \ of the following code?\n\n    #include <stdio.h>\n\n    struct Point {\n\n \
    \   int x;\n\n    int y;\n\n    };\n\n    int main()\n\n    {\n\n    struct Point\
    \ p1 = {2, 3};\n\n    printf(\"%d %d\\n\", p1.x, p1.y);\n\n    return 0;\n\n \
    \   }\n\n12.  Can a structure have a member that is a union in C programming?\n\
    \n13.  What will be the output of the following code?\n\n    #include <stdio.h>\n\
    \n    struct Time {\n\n    int hours;\n\n    int minutes;\n\n    };\n\n    int\
    \ main() {\n\n    struct Time t1 = {4, 30};\n\n    printf(\"%d:%d\\n\", t1.hours,\
    \ t1.minutes);\n\n    return 0;\n\n    }\n\n14.  What is the difference between\
    \ a structure and a typedef structure in C programming?\n\n15.  Write a program\
    \ to pass a structure to a function in C programming.\n\n16.  Can you return a\
    \ structure from a function in C programming?\n\n17.  Write a program to compare\
    \ two structures in C programming.\n\n18.  How do you copy one structure to another\
    \ in C programming?\n\n19.  How do you compare two unions in C programming?\n\n\
