  trans: "\n\nC 语言程序中数据类型的选择取决于所使用的数据类型以及对该数据执行的操作类型。例如，如果程序需要表示整数，可以使用 `int` 数据类型；而如果程序需要表示小数，可以使用\
    \ `float` 或 `double` 数据类型。选择合适的数据类型可以确保程序运行正确且高效。\n\nC 语言中的类型可以分类见 表 2.4：\n\n\
    | 基础类型 | 整数 | 浮点数 | 字符型 |\n| :--- | :--- | :--- | :--- |\n| 枚举类型 | | | 用于声明只能分配特定离散整数值的变量\
    \ |\n| `void` 类型 | `void` 表示没有可用值 | | |\n| 派生类型 | 指针 数组 结构 联合体 函数 | | |\n\n表 2.4：C\
    \ 语言中的数据类型\n\n数组和结构被称为聚合类型。函数的返回类型指定了函数返回值的类型。\n\n表 2.5 说明了标准类型的存储容量以及它们可以存储的值范围：\n\
    \n| 序号 | 类型 | 大小（字节） | 范围 |\n| :--- | :--- | :--- | :--- |\n| | `unsigned char`\
    \ | 1 | 0 到 255 |\n| | `signed char` 或 `char` | 1 | -128 到 +127 |\n| | `unsigned\
    \ int` | 2 | 0 到 65535 |\n| | `signed int` 或 `int` | 2 | -32,768 到 +32,767 |\n\
    | | `unsigned short int` | 2 | 0 到 65535 |\n| | `signed short int` 或 `short int`\
    \ | 2 | -32,768 到 +32,767 |\n| | `unsigned long int` | 4 | 0 到 +4,294,967,295\
    \ |\n| | `signed long int` 或 `long int` | 4 | -2,147,483,648 到 +2,147,483,647\
    \ |\n| | `long double` | 10 | 3.4E-4932 到 1.1E+4932 |\n| | `double` | 8 | 1.7E-308\
    \ 到 1.7E+308 |\n| | `float` | 4 | 3.4E-38 到 3.4E+38 |\n\n表 2.5：带有存储容量的 C 数据类型\n\
    \n我们可以使用 `sizeof` 函数来获取类型或变量的大小。`sizeof` 函数的语法如下：\n\n```\nsizeof (type)\n```\n\
    \n它显示类型以字节为单位的存储大小。例如：\n\n```c\nprintf (\"Size for int: %d\", sizeof (int));\n\
    ```\n\n输出：\nsize for int: 2 Bytes\n\n## 变量 (#contents.xhtml_sc3_68a)\n\n变量是程序使用的指定内存区域，用于存储和更改数据。我们可以使用变量存储和修改各种数据类型的值，例如浮点数、整数、字符等。在程序的执行过程中，变量可以用于存储和处理数据。变量中存储的值可以在程序执行期间发生变化。\n\
    \n## 变量声明 (#contents.xhtml_sc4_69a)\n\nC 编程中的变量声明是在在使用变量存储值之前，定义变量名称和数据类型的过程。它为编译器提供了关于变量将存储什么类型数据的信息，使编译器能够分配适当内存。为了确保程序执行期间正确的内存分配和类型处理，这一步是至关重要的。\n\
    \nC 语言中声明的基本语法为：\n\n```\ntype name;\n```\n\n其中 `type` 指定被声明对象的数据类型，`name` 是用于引用该对象的标识符。\n\
    \n例如，要声明一个名为 `num` 的整数变量，我们将使用以下声明语句：\n\n```c\nint num;\n```\n\n该语句声明了一个类型为 `int`\
    \ 的名为 `num` 的变量。\n\n### 变量声明指南 (#contents.xhtml_sc4_70a)\n\n在 C 中定义变量时，需要遵循某些标准和指南。通过遵循这些指南，我们可以使代码更有组织性、更易读且没有错误。C\
    \ 语言中声明变量的主要指南如下：\n\n*   **有效的变量名**：变量名必须以大写或小写字母或下划线（`_`）开头。变量名在第一个字符之后可以包含字母、数字和下划线。变量名区分大小写，因此\
    \ `Var` 和 `var` 被视为两个不同的变量。\n*   **避免关键字**：为 C 语言定义的保留字（关键字）不能用变量名。我们不能使用如 `if`、`for`、`break`\
    \ 等名称声明变量。\n*   **使用具有描述性且意义的名称**：我们应该为变量使用能够唤起其功能的名称。这提高了我们代码的可读性和理解性。\n*   **不要使用特殊字符**：变量名中不允许使用\
    \ `@`、`#`、`$`、`%` 等特殊字符。\n*   **不要使用空格**：变量名中允许空格。\n*   **下划线的使用**：对于多个单词的变量名，我们应该选择一种命名模式，例如学生的学号可以存储在名为\
    \ `Roll_No` 的变量中。\n*   **避免开头使用下划线和大写字母**：在 C 中，以下划线和大写字母开头的名称通常留给系统和库使用。\n* \
    \  **数据类型声明**：在使用之前，必须用其数据类型定义变量。例如 `int` 和 `double`。\n*   **初始化**：在声明变量时可以对其进行初始化。例如\
    \ `int count = 0;`。\n*   **先声明后使用**：要在 C 中使用变量，必须先对其进行声明。在下面所示的作用域内，我们不能多次声明同名称的变量：\n\
    \n```c\nint main () {\n    int x = 15;\n    int x = 20;\n    printf (\"x = %d\"\
    , x);\n}\n```\n输出：ERROR!\n\n**使用 typedef**：在 C 中使用 `typedef` 创建用户定义类型也是可能的。`typedef`\
    \ 的基本语法为：\n\n```\ntypedef type new_type;\n```\n\n其中 `type` 是已存在的数据类型，`new_type`\
    \ 是新名称。例如，为了创建一个等于 `int` 的新类型 `myint`，我们将使用：\n\n```c\ntypedef int myint;\n```\n\
    \n声明之后，我们可以使用 `myint` 作为 `int` 的同义词。\n\n## 初始化 (#contents.xhtml_sc4_71a)\n\nC\
    \ 语言中的初始化是指在声明时给变量或数组分配一个初始值。初始化可以使用等号（`=`）或大括号（`{}`）后跟一个称为初始化器的列表来完成。初始化语法取决于变量或数组的数据类型。\n\
    \n基础类型初始化的一些示例：\n\n```c\nint x = 10;\nfloat y = 3.14;\nchar c = 'A';\n```\n\n\
    同样，正如接下来的章节所示，我们可以初始化其他派生数据类型，如数组结构和指针。初始化确保了变量和数组在程序中使用具有适当的值。未初始化的变量可能包含不可预测的值，这会导致程序出现错误和意外行为。\n\
    \n## 标识符 (#contents.xhtml_sc3_72a)\n\n标识符是分配给程序实体的名称。实体包括变量、函数、类或其他编程结构。标识符用于在代码内部唯一标识这些实体。它们由字母（大写和小写）、数字和下划线组成，并遵循某些规则。标识符用于增强程序代码的可读性，并通过意义的名称标识程序元素。\n\
    \nC 语言命名标识符的一些规则如下：\n\n*   它们必须以字母或下划线开头，并由大写或小写字母、数字和下划线组成。\n*   在 C 中，标识符区分大小写。\n\
    *   标识符的命名应根据其使用的上下文具有描述性和意义。例如，`salary` 是标识符的合适名称，而不是 `s`。\n*   标识符不应特殊字符或空格。\n\
    *   标识符名称不能是全局标识符，例如（`__TIME__`、`__LINE__`、`__TINY__`、`__SMALL__`、`__FILE__`、`__DATE__`\
    \ 等）。\n\n"
