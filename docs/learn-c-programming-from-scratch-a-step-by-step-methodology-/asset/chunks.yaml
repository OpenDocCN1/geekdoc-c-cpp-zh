    a decision-making flowchart or conditional flowchart, is a graphic representation
    that shows the order in which steps or actions should be executed in a process
    depending on particular circumstances or criteria. It is a tool used to show how
    a process works and how it reacts to different inputs and circumstances.


    The following are some instances of condition-based flowcharts:


    ![](images/1.15.png)


    Figure 1.15: Flowchart to find whether a given number is +ive or -ive


    ![](images/1.16.png)


    Figure 1.16: Flowchart to find the larger number among two numbers


    *   Loop-based flowcharts: A loop-based flowchart is a visual representation used
    to show the order of operations in a process, algorithm, or software application
    that contains repetition. Loops are used to carry out a certain set of instructions
    continuously until a particular condition is fulfilled in programming and process
    design. This repetition pattern is graphically represented by a loop-based flowchart.


