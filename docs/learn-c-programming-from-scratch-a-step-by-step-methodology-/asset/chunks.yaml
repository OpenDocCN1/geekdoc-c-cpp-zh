    ### Algorithm to check whether a person can vote:


    1. Start

    2. input `age`

    3. `if age < 18`, go to step 5

    4. output "Can vote" and go to step 6

    5. output "Cannot vote"

    6. Stop


    This algorithm takes `age` as input and checks whether the age is greater than
