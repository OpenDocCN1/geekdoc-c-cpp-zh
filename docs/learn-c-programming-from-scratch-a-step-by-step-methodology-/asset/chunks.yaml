    # 执行/运行代码


    要运行你的代码，选择 `Execute | Run`，如图图 2.12 所示。这将启动程序的执行并弹出一个新窗口。除了程序输出外，窗口还会显示程序执行所需的时间，并提示我们按任意键退出输出屏幕。请参考下图：


    ![](img/Figure_2.12.png)


    图 2.12：带有输出的执行文件


    即使我们尝试跳过编译过程，程序仍然会进行错误编译检查。


    ## C 程序组件


    一个 C 程序由多个共同工作以执行特定任务的组件组成。一个 C 程序包含以下组件：


    *   **预处理器指令 (Preprocessor directives)**：预处理器指令是以 `#` 符号开头的命令，在编译之前修改源代码。预处理器指令的示例包括
    `#include`（包含头文件）、`#define` 和 `#ifdef`。

    *   **函数 (Functions)**：函数是执行特定任务的代码块。在 C 中，函数必须在调用执行之前进行定义。C 程序通常有一个 `main` 函数，它是程序的入口。

    *   **变量 (Variables)**：变量用于存储程序可以操作的数据。在 C 中，变量必须在声明后才能使用，它们可以有不同的类型，如整数、浮点数和字符。

    *   **语句 (Statements)**：语句是 C 程序的构建构建单元。它们用于执行操作，例如为变量赋值、调用函数以及根据条件做出决策。

    *   **注释 (Comments)**：用 `//` 表示的注释用于向程序中添加说明性文本。编译器会忽略它们，其目的是帮助其他程序员理解代码。

    *   **头文件和库 (Header files and libraries)**：头文件包含程序中所使用的函数、变量和其他数据类型的声明。它们通常使用
    `#include` 指令包含。


    让我们来看一个简单的程序，它在输出屏幕上显示一条信息：


    ```c

    #include <stdio.h> // header file


    // first program


    int main () {


    printf ("This is my first C program");


    return (0);

    }

    ```


    在上面的程序中：


    *   一行预处理行（`#include <stdio.h>`）告诉编译器在执行程序之前，包含或链接 `stdio.h` 文件（因为包含了 C 程序中调用的函数的定义或代码）到当前
    C 项目或程序文件中。头文件将与 C 源文件一起编译。

    *   下一行以 `//` 符号开头，它代表用户为了记录目的编写的注释，编译器会忽略它（既不编译也不执行）。我们用 `/*...*/` 表示多行注释。注释的目的是为程序增加可读性、解释或标注。

    *   下一行开始定义函数 `main()`：它是 C 程序的入口点，启动了程序的执行。一个 C 程序可能由一个或多个函数组成，但一个 C 程序的执行始终始从
    `main()` 函数开始。`main` 前的单词 `int` 意味着函数在执行结束时返回一个整数（稍后将详细讨论）。

    *   在下一行，`printf(...)` 是 C 中的一个可用函数，它在输出屏幕上显示消息：This is my first C program。

    *   下一行 `return 0;` 将控制权交回给执行开始的地方，并返回值 `0`（表示程序执行成功）。

    *   最后一行 `}` 标记 `main` 函数的结束，因此程序停止。


    作业：编写、编译并执行上述 C 程序。


    你已经看到了 C 程序的基本结构，因此理解 C 语言的其他基本构建单元将非常容易。


    ## C 中的标记 (Tokens)


    在 C 编程中，标记（token）是程序中有意义且可以被编译器解析的最小单元。一个 C 程序由几个标记组成，共同构成程序的大部分。编译器可以通过将 C 程序分解为它的组成标记来分析和理解程序的结构和语法，从而生成可执行代码。C
    语言有六种标记：


    *   **关键字 (Keywords)**：这些是 C 语言中具有特定含义的保留字。C 关键字的示例包括 `if`、`else`、`while`、`return`
    等。

    *   **标识符 (Identifiers)**：标识符是赋予变量、函数和其他程序实体的名称。C 中的标识符必须以字母或下划线开头，并包含字母、数字和下划线。

    *   **常量 (Constants)**：常量是在程序执行期间不变的固定值。C 中的常量可以是多种类型，包括整数常量、浮点常量、字符常量和字符串字面量。

    *   **字符串 (Strings)**：字符串是用双引号括的字符序列。在 C 中，字符串被视为字符数组，并可以使用各种字符串函数进行操作。

    *   **运算符 (Operators)**：运算符是对一个或多个操作数执行操作的符号。C 运算符的示例包括算术运算符（`+`、`-`、`*`、`/`）、关系运算符（`==`、`!=`、`<`、`>`）和逻辑运算符（`&&`、`||`、`!`）。

    *   **特殊符号 (Special symbols)**：包括分隔程序元素或向编译器提供额外信息的标点符号和其他特殊字符。C 特殊符号的示例包括分号（`;`）、逗号（`,`）、括号（()`）和大括号（`{}`).


    示例：考虑语句：


    ```c

    printf ("My first C Program ");

    ```


    各个标记为：


    `printf`


    `(`


    `"My first C Program"`


    `)`


    `;`


