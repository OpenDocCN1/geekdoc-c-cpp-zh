    \nFigure 8.7: Output for the above program\n\nThese programs illustrate various\
    \ operations on random access files in C, including creating, reading, updating,\
    \ deleting, and appending records. They showcase the flexibility and efficiency\
    \ of random-access files in managing and manipulating data.\n\n[Direct file access](#contents.xhtml_sc3_325a)\n\
    \nDirect file access, a type of random-access file, also known as indexed files\
    \ or relative files. Direct file access allows us to read and write data at a\
    \ specific record or position within a file. They are organized with an index\
    \ or relative record number that maps to specific records in the file. [Table\
    \ 8.1](#ch08.xhtml_tab8-1) lists some key differences between direct access files\
    \ and random access files.\n\n| Feature | Direct access files | Random access\
    \ files |\n| --- | --- | --- |\n| Organization | Organized with an index or relative\
    \ record number | No specific organization; allows direct access to any position.\
    \ |\n| Record Access | Access records based on a defined index or relative record\
    \ number | Access records based on byte positions. |\n| File Positioning | Typically\
    \ use file positioning functions to move to specific records | Also use file positioning\
    \ functions, but can access any position |\n\nTable 8.1: Difference between Direct\
    \ Access and Random-Access Files\n\n[Programs on direct access files in C](#contents.xhtml_sc4_326a)\n\
    \nSome examples of programs in the direct-access files in C are discussed below:\n\
    \n*   Create a direct access file and add some records:\n\n    #include <stdio.h>\n\
    \n    struct std {\n\n    int rn;\n\n    char nm[50];\n\n    };\n\n    int main()\
    \ {\n\n    FILE *fp = fopen(\"std.dat\", \"wb\");\n\n    if (fp == NULL) {\n\n\
    \    perror(\"Could not open the file\");\n\n    return(1);\n\n    }\n\n    struct\
    \ std s;\n\n    int n;\n\n    printf(\"Enter number of records\\n\");\n\n    scanf(\"\
    %d\", &n);\n\n    for (int i = 0; i < n; i++) {\n\n    printf(\"Enter Roll No.\\\
    n\");\n\n    scanf(\"%d\", &s.rn);\n\n    printf(\"Enter Name\\n\");\n\n    scanf(\"\
    \ %d\", s.nm);\n\n    fwrite(&s, sizeof(struct std), 1, fp);\n\n    }\n\n    fclose(fp);\n\
    \n    return(0);\n\n    }\n\n*   Read a specific record from a file:\n\n    #include\
    \ <stdio.h>\n\n    struct std {\n\n    int rn;\n\n    char nm[50];\n\n    };\n\
    \n    int main() {\n\n    FILE *fp = fopen(\"std.dat\", \"wb\");\n\n    if (fp\
    \ == NULL) {\n\n    perror(\"Could not open the file\");\n\n    return(1);\n\n\
    \    }\n\n    struct std s;\n\n    int n;\n\n    printf(\"Enter record number\
    \ \\n\");\n\n    scanf(\"%d\", &n);\n\n    fseek(fp, (n - 1) * sizeof(struct std),\
    \ SEEK_SET);\n\n    if (fread(&s, sizeof(struct std), 1, fp) == 1) {\n\n    printf(\"\
    Student Roll No. %d\\n\", s.rn);\n\n    printf(\"Student Name: %s\\n\", s.nm);\n\
    \n    } else {\n\n    printf(\"Record not found.\\n\");\n\n    }\n\n    fclose(fp);\n\
    \n    return(0);\n\n    }\n\n*   Update a specific record in the file:\n\n   \
    \ #include <stdio.h>\n\n    struct std {\n\n    int rn;\n\n    char nm[50];\n\n\
    \    };\n\n    int main() {\n\n    FILE *fp = fopen(\"std.dat\", \"wb\");\n\n\
    \    if (fp == NULL) {\n\n    perror(\"Could not open the file\");\n\n    return(1);\n\
    \n    }\n\n    struct std s;\n\n    int n;\n\n    printf(\"Enter record number\
    \ to update \\n\");\n\n    scanf(\"%d\", &n);\n\n    fseek(fp, (n - 1) * sizeof(struct\
    \ std), SEEK_SET);\n\n    if (fread(&s, sizeof(struct std), 1, fp) == 1) {\n\n\
    \    printf(\"Enter new Student Name: \");\n\n    scanf(\" %d\", s.nm);\n\n  \
    \  fseek(fp, -sizeof(struct std), SEEK_CUR);\n\n    fwrite(&s, sizeof(struct std),\
    \ 1, fp);\n\n    } else {\n\n    printf(\"Record not found.\\n\");\n\n    }\n\n\
    \    fclose(fp);\n\n    return(0);\n\n    }\n\n*   List all records in the file:\n\
    \n    #include <stdio.h>\n\n    struct std {\n\n    int rn;\n\n    char nm[50];\n\
    \n    };\n\n    int main() {\n\n    FILE *fp = fopen(\"std.dat\", \"wb\");\n\n\
    \    if (fp == NULL) {\n\n    perror(\"Could not open the file\");\n\n    return(1);\n\
    \n    }\n\n    struct std s;\n\n    int n;\n\n    while (fread(&s, sizeof(struct\
    \ std), 1, fp) == 1) {\n\n    printf(\"Student Roll No: %d\\n\", s.rn);\n\n  \
    \  printf(\"Student Name: %s\\n\\n\", s.nm);\n\n    }\n\n    fclose(fp);\n\n \
    \   return(0);\n\n    }\n\n*   Delete a specific record from the file:\n\n   \
    \ #include <stdio.h>\n\n    struct std {\n\n    int rn;\n\n    char nm[50];\n\n\
    \    };\n\n    int main() {\n\n    FILE *fp = fopen(\"std.dat\", \"wb\");\n\n\
    \    if (fp == NULL) {\n\n    perror(\"Could not open the file\");\n\n    return(1);\n\
    \n    }\n\n    struct std s;\n\n    int n;\n\n    printf(\"Enter record number\
    \ to delete \\n\");\n\n    scanf(\"%d\", &n);\n\n    fseek(fp, (n - 1) * sizeof(struct\
    \ std), SEEK_SET);\n\n    if (fread(&s, sizeof(struct std), 1, fp) == 1) {\n\n\
    \    fseek(fp, -sizeof(struct std), SEEK_CUR);\n\n    fwrite(\"\\0\", sizeof(struct\
    \ std), 1, fp);\n\n    } else {\n\n    printf(\"Record not found.\\n\");\n\n \
    \   }\n\n    fclose(fp);\n\n    return(0);\n\n    }\n\nThe above programs illustrate\
    \ how to create, write, read, update, view, and delete specific records in a binary\
    \ file, offering direct access to file contents.\n\n[File descriptors](#contents.xhtml_sc4_327a)\n\
    \nIn C, a file descriptor is associated with every open file; it is an integer\
    \ value that characterizes the file in the underlying operating system. They are\
    \ used to recognize and access files during low-level I/O operations.\n\nA file\
    \ descriptor value of:\n\n*   0 is reserved for standard input (stdin)\n*   1\
    \ for standard output (stdout),\n*   for standard error (stderr).\n\n[Opening\
    \ files for direct access](#contents.xhtml_sc3_328a)\n\nThe open() function opens\
    \ a file and returns a file descriptor.\n\nSyntax:\n\nint open (const char *path,\
    \ int flags, mode_t mode)\n\npath specifies the file path, flags control the file\
    \ access mode (for example, read-only, write-only, read-write), and mode sets\
    \ the file permissions if the file is being created.\n\nThe function returns -1\
    \ if an error occurs while opening the file.\n\n[Reading from files](#contents.xhtml_sc3_329a)\n\
    \nThe read() function reads a specified number of bytes from a file into a buffer.\n\
    \nSyntax:\n\nssize_t read(int fd, void *buf, size_t count)\n\nExample:\n\nssize_t\
    \ read(int fd, void *buf, size_t count)\n\nWhere:\n\n*   fd is the file descriptor\n\
    *   buf is the buffer to store the read data\n*   count is the number of bytes\
    \ to read.\n\nThe function returns the number of bytes read, or -1, when a read\
    \ error occurs.\n\n[Writing to files](#contents.xhtml_sc3_330a)\n\nThe write()\
    \ function writes a specified number of bytes from a buffer to a file.\n\nSyntax:\n\
    \nssize_t write(int, void *, size_t)\n\nExample:\n\nssize_t write(int fd, const\
    \ void *buf, size_t count)\n\nwhere:\n\n*   fd is the file descriptor.\n*   buf\
    \ is the buffer containing the data to write.\n*   count is the number of bytes\
    \ to write.\n\nThe function returns the number of bytes written, or -1, when a\
    \ write-error occurs.\n\n[File positioning](#contents.xhtml_sc3_331a)\n\nThe fseek()\
    \ function moves the file position indicator associated with a file descriptor\
    \ to a specified location.\n\nSyntax:\n\noff_t fseek(int, off_t, int)\n\nExample:\n\
    \noff_t fseek(int fd, off_t offset, int ref)\n\nwhere:\n\n*   fd is the file descriptor.\n\
    *   offset determines the position to move (positive or negative).\n*   ref specifies\
    \ the reference point which can be any of the following:\n    *   SEEK_SET\n \
    \   *   SEEK_CUR\n    *   SEEK_END\n\nThese set the position relative to the beginning\
    \ of the file, relative to the current position, and relative to the end of the\
    \ file, respectively.\n\nThe function returns the resulting file offset, or -1\
    \ on error.\n\n[Closing files](#contents.xhtml_sc3_332a)\n\nThe close() function\
    \ closes a file descriptor, releasing associated resources.\n\nSyntax:\n\nint\
    \ close (int)\n\nExample:\n\nint close (int fd)\n\nHere, fd is the file descriptor\
    \ to close.\n\nThe function returns 0 on success or -1 when an error occurs.\n\
    \n[Some program examples on file descriptors](#contents.xhtml_sc3_333a)\n\n* \
    \  Open and read a file using file descriptors\n\n    #include <stdio.h>\n\n \
    \   #include <fcntl.h>\n\n    #include <unistd.h>\n\n    int main() {\n\n    int\
    \ fd = open(\"data.txt\", O_RDONLY);\n\n    if (fd == -1) {\n\n    perror(\"Could\
    \ not open file\");\n\n    return(1);\n\n    }\n\n    char buffer[100];\n\n  \
    \  ssize_t byts;\n\n    while ((byts = read(fd, buffer, sizeof(buffer))) > 0)\
    \ {\n\n    write(STDOUT_FILENO, buffer, byts);\n\n    // Write to standard output\
    \ (usually the console).\n\n    }\n\n    close(fd);\n\n    return(0);\n\n    }\n\
    \n*   Open and write to a file using file descriptors\n\n    #include <stdio.h>\n\
    \n    #include <fcntl.h>\n\n    #include <unistd.h>\n\n    int main() {\n\n  \
    \  int fd = open(\"data.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0666);\n\n    if\
    \ (fd == -1) {\n\n    perror(\"Could not open file\");\n\n    return (1);\n\n\
    \    }\n\n    char d[] = \"Hello C Programming\\n\";\n\n    ssize_t byts = write(fd,\
    \ d, sizeof(d));\n\n    if (byts == -1) {\n\n    perror(\"Cannot write to file\"\
    );\n\n    }\n\n    else {\n\n    printf(\"%d bytes written to the file.\\n\",\
    \ (int)byts);\n\n    }\n\n    close(fd);\n\n    return(0);\n\n    }\n\n*   Redirect\
    \ standard output using file descriptors:\n\n    #include <stdio.h>\n\n    #include\
    \ <fcntl.h>\n\n    #include <unistd.h>\n\n    int main() {\n\n    int fd = open(\"\
    data.txt\", O_WRONLY | O_CREAT | O_TRUNC, 0666);\n\n    if (fd == -1) {\n\n  \
    \  perror(\"Could not open file\");\n\n    return (1);\n\n    }\n\n    int std_out\
    \ = dup(STDOUT_FILENO);\n\n    dup2(fd, STDOUT_FILENO);\n\n    printf(\"writing\
    \ text to the file.\\n\");\n\n    dup2(std_out, STDOUT_FILENO);\n\n    close(fd);\n\
    \n    return (0);\n\n    }\n\nNote: In these programs, the assumption is made\
    \ that the direct access file (for example, data.txt) is present in the same directory\
    \ as the programs. Modify the file name or path as per your requirement.\n\n[Stream\
    \ file access](#contents.xhtml_sc2_334a)\n\nA high-level abstraction that makes\
    \ it simple to read from or write to files is stream file access. To make file\
    \ I/O operations simpler, streams handle buffering, conversion, and other activities.\
    \ Important details regarding stream file access include:\n\n*   Reading: Stream\
    \ file reading requires opening a file using a function like fopen() and then\
    \ reading data from the file using a function like fscanf() or fgets().\n*   Writing:\
    \ To write data to a stream file, use the fopen() function to open the file and\
    \ then fprintf() or fputs() to write the data to the file.\n\n[Benefits](#contents.xhtml_sc3_335a)\n\
    \nAccessing files using streams offers a greater degree of abstraction and streamlines\
    \ I/O processes, making it simpler to manage text or structured data. It is frequently\
    \ used for input/output redirection, configuration files, and text processing.\n\
    \nThere are several ways to read from and write to files, including sequential,\
    \ direct, and stream access. Direct access allows for random access to specific\
    \ locations inside a file, sequential access is effective for processing data\
    \ in a linear way, and stream access offers a high-level abstraction for managing\
    \ file I/O activities. The application-specific requirements, such as the kind\
    \ of data, access patterns, and performance concerns, will determine which file\
    \ access technique is best.\n\nIn C, stream file access provides a higher-level\
    \ abstraction for reading from and writing to files compared to direct access.\
    \ It uses stream-oriented functions that operate on file streams, which are buffered\
    \ I/O streams associated with files. This note provides a comprehensive overview\
    \ of stream file access in C, covering file stream operations, techniques, and\
    \ considerations.\n\n[Error handling in files](#contents.xhtml_sc2_336a)\n\nAlthough\
    \ error management, commonly known as exception handling, is not directly supported\
    \ by C programming, it may be accomplished in other ways.\n\nOf course, the programmer\
    \ must avoid mistakes while working, and they must constantly check the results\
    \ of functions they call. Many C function calls return a -1 or NULL in the event\
    \ of an error, making it simple to do rapid tests on these return values using,\
    \ for example, an if statement.\n\nFor instance, a program’s return value is zero\
    \ if it successfully exits. A number greater than zero is often returned if the\
    \ application crashes due to an error (for instance, 1).\n\nThe only thing you\
    \ should keep in mind is that managing errors is your responsibility as a programmer.\
    \ You are the one who needs to ensure that software will end gracefully rather\
    \ than crash abruptly. Depending on the return values from function calls, you\
    \ must take the proper action.\n\n[Global variable errno](#contents.xhtml_sc3_337a)\n\
    \nC functions use the global variable errno, and this integer is set if there\
    \ is a problem with the function call. You must include errno.h and call extern\
    \ int errno; in order to utilize errno.\n\n[Errno example](#contents.xhtml_sc4_338a)\n\
    \n#include <stdio.h>\n\n#include <errno.h>\n\nextern int errno;\n\nint main ()\n\
    \n{\n\nFILE * fp;\n\nfp = fopen(\"filedoesnotexist.txt\", \"rb\");\n\nif(fp ==\
    \ NULL)\n\n{\n\nfprintf (stderr, \"Value of errno: %d\\n\", errno);\n\n}\n\nelse\n\
    \n{\n\nfclose (fp);\n\n}\n\nreturn (0);\n\n}\n\nThe output of the program will\
    \ be something like:\n\nValue of errno is: 2\n\nAs can be seen, we also include\
    \ the header files for stdio.h and errno.h. After that, extern int errno is invoked,\
    \ giving us access to the integer errno. We attempt to create an error by opening\
    \ a nonexistent file. We output the value of errno (which in this case will be\
    \ 2) if the file pointer (fp) is equal to NULL. If we receive a file pointer,\
    \ we close the file if it already exists using the perror() and strerror() functions.\n\
    \nThe errno in the preceding instance had a value of 2. But what does the value\
    \ of 2 mean? How can the user identify this error? Creating documentation that\
    \ details each error code and what the user should do is, of course, a good practice.\
    \ When a software problem occurs, it is also best practice to provide a nice descriptive\
    \ error message. There are two functions in the C programming language that may\
    \ be used to show a text message linked to an errno. Both strerror() and perror()\
    \ are the functions.\n\nA reference to the textual message of the current errno\
    \ value is returned by the function strerror(). The text message of the current\
    \ errno value is shown after a colon and the string that you supply to the method\
    \ perror().\n\n[Conclusion](#contents.xhtml_sc2_339a)\n\nIn conclusion, this chapter\
    \ delved into the concept of file handling in C, providing a comprehensive understanding\
    \ of data hierarchy from bits to databases, data warehouses, and data marts. We\
    \ explored the significance of files, their types, and the importance of handling\
    \ both binary and text files effectively in C.\n\nThe chapter further covered\
    \ file modes and various file operations, including sequential, random, direct,\
    \ and stream file access methods. We also examined error handling in files, with\
    \ a focus on the global variable errno, illustrated through an example.\n\nBy\
    \ grasping these concepts and techniques, you are now equipped with the knowledge\
    \ and tools to efficiently manage files in C programming. Understanding file handling\
    \ is crucial for any developer working with data and information, allowing you\
    \ to create robust and efficient file-handling systems for a wide range of applications.\n\
