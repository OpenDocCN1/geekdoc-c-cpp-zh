    # 第 2 章 C 语言基础


    ### 引言


    Dennis M. Ritchie 在贝尔实验室构思了高级通用语言 C，用于创建 UNIX 操作系统。在 DEC PDP-11 计算机上，C 首次于 1972
    年引入。


    K 和 R 标准被认为是 C 语言第一个公开定义，由 Brian Kernighan 和 Dennis Ritchie 于 1978 年创建。C 编程语言被用于构建
    UNIX 操作系统、C 编译器以及几乎所有的 UNIX 应用程序。C 语言仍然是一门流行的编程语言，原因如下：


    * 它易于学习。

    * 它是一门结构化语言。

    * 我们可以使用 C 设计高效的程序。

    * 它能处理底层活动。

    * 用 C 编写的程序可以在各种计算机平台上进行编译。


    ### 结构


    本章涵盖了以下主题：


    * 关于 C 语言的知识

    * C 程序组件

    * C 中的标记 (Tokens)

    * 数据类型

    * 变量

    * 整数数据类型

    * 字面量

    * 存储类

    * 操作符

    * C 语言输入输出

    * 使用 C 编写基础程序


    ### 目标


    本章旨在对 C 编程语言及其组件和实际应用提供全面的理解。我们将从探索关于 C 语言的重要事实及其在现代编程中的相关性开始。本章将重点关注 Turbo C++，这是一个适用于
    Windows 10 及更高版本的流行开发环境，指导如何设置和使用该平台。我们将深入研究 C 程序的根本组件，包括标记、数据类型、变量和字面量。此外，我们还将考察存储类的概念以及
    C 语言中提供的各种操作符。在建立坚实的基础后，我们将学习 C 语言中的输入输出操作，并通过编写基础程序获得实践经验。到本章结束，读者将对 C 编程有稳固的理解，使能够使用该语言开发功能齐全且高效的程序。


    ### 关于 C 语言的知识


    广泛使用的编程语言 C 具有悠久的历史和广泛的能力。以下是关于 C 语言的一些事实：


    * Dennis Ritchie 在贝尔实验室于 20 世纪 70 年代初开发了 C 语言作为 Unix 操作系统的编程语言。

    * 由于 C 是一种编译型语言，源代码会被转换为计算机可以使用来运行的机器码。

    * 得益于其底层能力，程序员可以通过编写高级 C 代码直接修改硬件和内存。

    * 由于其语法简单且关键字较少，C 语言易于学习和阅读。

    * 设备驱动程序、操作系统、嵌入式系统和其他类型的底层软件经常使用 C 语言。

    * C 语言拥有强大的标准库，包括用于输入/输出、内存管理、字符串处理等的函数。

    * C 同时支持面向对象和结构化编程范式。

    * 由于其底层特征和标准库，C 程序在多个系统之间具有非常的可移植性。

    * C++、Java 和 Python 只是受 C 语言影响的一些编程语言。

    * 尽管历史悠久，C 现在仍然被广泛使用，许多软件工程师认为它是一项技能。


    ### C 编程语言的用途


    C 最初用于系统开发，包括创建操作系统。由于 C 生成的代码执行速度几乎与汇编语言一样，它被采用作为系统开发语言。C 的几种用途包括：


    * 操作系统的设计。

    * 汇编器和编译器的设计。

    * 文本编辑器开发。

    * 网络驱动程序的设计。

    * 数据库的制定。

    * 语言解释器的设计。

    * 工具的设计。


    ### C 程序的生命周期


    C 程序的生命周期可以分为许多阶段，每个阶段在程序的创建、使用和维护中都有其特定作用，如图 2.1 所示：


    ![](img/Figure_2.1.png)


    图 2.1：程序的阶段


    #### 编写源代码

    计算机程序使用类英语的高级语言编写，如 C/C++。但计算机无法理解用高级语言编写的程序。相反，它只能理解机器语言等底层语言。我们使用文本编辑器或集成开发环境
    (IDE) 编写 C。


    #### 预处理

    预处理器处理指令。在此阶段，执行文件包含 `#include`、宏展开 `#define` 等操作。预处理后的源代码是该阶段的结果。


    #### 编译

    编译器将预处理后的源代码转换为汇编语言或其他过渡表示。编译器在检查语法和语义时创建对象代码。编译器会提示任何语法错误。


    #### 链接

    链接器通过将对象代码与其他所需的外部函数或库结合创建一个可执行文件。


    #### 加载

    操作系统将可执行文件加载到内存中，并分配所需的资源。现在程序已就绪，可以运行了。


    #### 执行

    在这个阶段，处理器逐个通过程序中的每条指令，并与操作系统协作执行这些指令指定的操作。


