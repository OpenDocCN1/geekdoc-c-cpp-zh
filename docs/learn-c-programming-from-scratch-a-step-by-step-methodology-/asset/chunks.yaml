    由 BPB Online 出版

    19 Marylebone Road, London NW1 UK | UAE | INDIA | SINGAPORE

    ISBN 978-3-55516-0 [www.bpbonline.com](https://www.bpbonline.com)


    **献给**我生命的支柱——我亲爱的父母和家人。为了感谢你们坚定不移的支持、无尽的鼓励以及对我梦想的持久信念，这本关于 C 语言编程的书献给你们。你们的爱和指导是我在编程世界开启之旅的基石。


    # 关于作者


    Mohammad Saleem Mir 目前担任印度查米尔和勒什米（J&K）高等教育部的高级助理教授。他拥有超过 15 年的教学经验。在教学生涯中，他教授过与计算机相关的通用学科，但在引导学生学习编程科目方面发挥了领导作用，旨在培养学生强大的分析能力并将逻辑推理灌输给学生。作者拥有在克什米尔大学的计算机应用学士学位和硕士学位，目前正在攻机器学习/人工智能领域的博士学位。他在国家及国际期刊上发表了多篇研究论文，并在各种会议上展示过他的研究成果。作者还在大学和学院举办过启发性演讲和进修培训课程，并积极参与技术研讨会和工作坊。


    # 关于评审员


    Srividya Richard 是一位充满激情且投入的教育工作者，拥有安纳大学计算机科学工程硕士学位。她认为自己是一个自信且热情的人，擅长以完全的精确和准确性逻辑性地完成任何给定任务。她在知名机构拥有十年的教学经验。她的研究兴趣领域在于机器学习、数据分析和人工智能。她在同行期刊上发表了许多研究文章，涵盖了从研究论文到书籍的内容。在学术职业期间，Sri
    有机会指导并执行了多个实时项目。她还开展过各种培训，并担任过组织会议和研讨会的委员会成员。跨学科项目的经历与行业界互动的接触对她磨练技能产生了重大影响。作为一名
    AI 爱好者，Sri 乐于开启为专业人士提供 AI 技能的道路。她期待利用多年积累的专业知识，助力个人在个人和职业发展方面的能力。


    # 致谢


    这本书是我为尊贵的读者们执笔创作的首次尝试。我真诚地希望他们能喜欢它，并对本书给出诚恳的评价。我非常感谢家人提供的支持和爱。他们一直支持着我，如果没有他们的支持和鼓励，这本书的编写将是不可能的。


    同样感谢 BPB Publications 在将这本书变为现实过程中提供的指导和专业知识。这是一段漫长的修订之旅，在评审员、技术专家和编辑的宝贵参与和协作下得以完成。


    最后，我要感谢所有对我的书产生兴趣并支持其成为现实的读者。你们的鼓励是无价的。


    # 前言


    我很荣幸分享我的知识、分析和结论，以提高计算机科学学生对编程的好奇心；归根结底，我们都将是受益。当一个人选择计算机科学作为职业时，可以注意到编程是计算机科学不可或缺的一部分，除非他是优秀的程序员，否则无法成为优秀的计算机科学家。正如俗言所说，“开头成功了一半”，从明确编程基础开始并在职业生涯后期学习更高级的编程形式至关重要。因此，本书侧重于提供编程基础的见解，并尽力详细涵盖主要概念，以保持读者的兴趣。


    `C` 是一门基础编程语言，应当系统地学习。掌握 `C` 编程的特征非常重要。本书涵盖了所有基础概念，请放心读者在阅读本书内容时会过得很愉快并从中受益。本书以通俗的方式编写，目标受众——编程初学者能够轻松地理解书中解释的概念。书中的每个概念都同步辅以代码示例以增强清晰度。本书共有以下
    10 章：


    - 第 1 章：编程方法论 – 本章向你介绍编程方法论、问题解决、程序设计等世界。

    - 第 2 章：C 编程基础 – 本章将让你熟悉 `C` 编程语言的基本结构、编码环境以及编写 `C` 程序的语法和引用。

    - 第 3 章：控制语句 – 本章阐述了 `C` 编程中各种控制语句。

    - 第 4 章：函数 – 本章介绍了编程语言中可能最重要的主题之一——函数。

    - 第 5 章：数组 – 在这一章我们将介绍数组、多维数组、字符串以及我们如何处理它们。

    - 第 6 章：指针 – 在这一章中我们将学习指针，这是一个编程初学者认为困难的概念，但现在不再了。

    - 第 7 章：结构体和联合体 – 在这一章我们将学习使用结构体和联合体等用户定义数据类型。

    - 第 8 章：文件处理 – 在这一章我们将学习如何处理硬盘文件以及带有编程示例的各种相关操作。


