    \ related concepts in C, they differ. An identifier is a name given to a programming\
    \ entity, while a variable is a named memory location used to store a value of\
    \ a specific data type.\n\n[Constants](#contents.xhtml_sc3_74a)\n\nIn C programming,\
    \ a constant is a value that cannot be changed during program execution. Constants\
    \ represent fixed values that remain the same throughout the program’s execution.\
    \ Constants in C can be of several types, including:\n\n*   Integer constants:\
    \ Integer constants are whole numbers that can be positive, negative, or zero.\
    \ We can represent them in decimal, hexadecimal, or octal notation.\n\n    For\
    \ example:\n\n    int x = 134; // decimal constant\n\n    int y = 02; // octal\
    \ constant\n\n    int z = 0xB; // hexadecimal constant\n\n*   Floating-point constants:\
    \ Floating-point constants are numbers that include a fractional part. We can\
    \ represent them in exponential or decimal notation.\n\n    For example:\n\n \
    \   float d = 3.1423; // decimal constant\n\n    float e = 6.02e23; // exponential\
    \ constant\n\n*   Character constants: Character constants are single characters\
    \ enclosed in single quotes.\n\n    For example:\n\n    char f = 's'; // character\
    \ constant\n\n    char g = '\\n'; // character constant (newline character)\n\n\
    *   String literals: String literals are sequences of characters enclosed in double\
    \ quotes.\n\n    For example:\n\n    char* h = \"Program\"; // string literal\n\
    \n*   Enumeration constants: User-defined constants represent a set of named integer\
    \ values.\n\n    enum syntax\n\n    enum {comma separated enumeration constant\
    \ list}\n\n    For example:\n\n    enum {Apple, Banana, Cherry}; // enumeration\
    \ constant\n\nWe can use constants in C in expressions or assignments like variables.\
    \ they offer a suitable way to store fixed value since their values do not change\
    \ throughout program execution.\n\n[Integer data type](#contents.xhtml_sc3_75a)\n\
    \nInteger-type variables in C may store zero, positive, or negative values without\
    \ the decimal point. The integer data type, signed or unsigned, is indicated by\
    \ the keyword int. Unsigned integer variables are assumed to have positive values\
    \ by default. The integer data type is divided into short, int, and long.\n\n\
    Long data types need 8 bytes in 64-bit operating systems and 4 bytes in 32-bit\
    \ operating systems, compared to 2 bytes of storage space for short data types\
    \ and 2 or 4 bytes of storage space for int data types. If we try to assign a\
    \ decimal value to an integer variable, the value after the decimal point will\
    \ be truncated/discarded; only the whole number will be saved in the variable.\n\
    \n[Integer expressions](#contents.xhtml_sc4_76a)\n\nAn integer constant is often\
    \ expressed as a combination of digits occasionally accompanied by a sign and\
    \ commas to separate combinations of digits such as tens, thousands, hundreds,\
    \ and more used in day-to-day life mathematics, for example, 504, 239, -6, 30,705\
    \ and -4812\\. When representing integers in C programming, only sign symbols\
    \ and numbers from 0 to 9 are acceptable. For instance, 82,702 is an incorrect\
    \ integer constant and must be represented as 82732 since commas cannot separate\
    \ digits. Integer expressions can be made using arithmetic operations like addition,\
    \ subtraction, multiplication, division (which produces quotient when dividing\
    \ numbers), and modulo division (which produces remainder when dividing numbers).\n\
    \nFor the declaration:\n\nint x, y, z;\n\nExamples of legal expressions:\n\nx\
    \ + 1\n\nx + z - y * 2\n\nx % 5\n\nz + (x * 3 + y * 8) / 4\n\nThe plus (+), minus\
    \ (-), and multiply (*) operators produce the anticipated results. However, the\
    \ division (/) operator carries out integer division; if there is any remainder\
    \ value, it is castoff, we say integer division truncates. Thus, 10/6 gives the\
    \ value 1; the remainder 4 is discarded. What about -19/5 where the answer is\
    \ –3\\. In the case of C programming, integer division trims toward 0. Though\
    \ the actual value of -19 ÷ 5 is equal to -3.8, truncating toward 0 gives -3.\n\
    \nThe modulo (%)  operator  produces the remainder when dividing one integer by\
    \ another. Hence, 12 % 5 evaluates to 2.\n\n[Precedence of operators](#contents.xhtml_sc4_77a)\n\
    \nMultiplication and division occur before addition and subtraction when evaluating\
    \ expressions in C. In other words, division and multiplication take precedence\
    \ over addition and subtraction.\n\nHence, in the case of the expression:\n\n\
    2 + 3 * 4\n\n3 * 4 is evaluated first (=12), and then 2 is added to 12, producing\
    \ 14 as the value of the expression.\n\nHowever, to override the default precedence,\
    \ we may use brackets to force the evaluation of bracketed expressions.\n\nIn\
    \ the case of the expression:\n\n(2 + 3) * 4\n\nBracketed expression (2 + 3) would\
    \ be evaluated first, followed by the multiplication 5 and 4, producing 20 as\
    \ the expression value.\n\nNote: Unless explicitly stated otherwise by brackets,\
    \ when two operators with the same precedence exist in an expression, they are\
    \ evaluated from left to right.\n\nAdditionally, division (/) and the remainder\
    \ operator (%) have the same precedence in C. For example, in the expression:\n\
    \n44 / 4 * 2,\n\n44 / 4 is evaluated first, followed by 11 * 2, giving 22 as a\
    \ result of the expression.\n\nSimilarly, in the case of the expression:\n\n12\
    \ - 7 + 3\n\n12 – 7 is evaluated first, followed by 5 + 3, giving 8.\n\nHowever,\
    \ 24 / (4 * 2) is evaluated as:\n\n24/8\n\nand 12 - (7 + 3) is evaluated as:\n\
    \n12-10\n\n[Input-output in C](#contents.xhtml_sc3_78a)\n\nInput refers to the\
    \ task of providing data to a program. A file or the command line can be used\
    \ to provide input. The built-in functions in C programming make it possible to\
    \ read input and pass it along to the program as required.\n\nThe term output\
    \ refers to the presentation of data in a file, on an output device like a monitor\
    \ screen, or on a printer. A collection of built-in functions is available in\
    \ C programming, which we can employ to output data as well as save it to text\
    \ or binary files.\n\n[Output formatting](#contents.xhtml_sc4_79a)\n\nControlling\
    \ how data appears when printed to the console or other output streams is known\
    \ as output formatting. In C, output formatting is frequently done with the printf\
    \ function. It enables us to format and present many forms of data, such as strings,\
    \ integers, and more, in a predetermined way. Utilizing format specifiers—special\
    \ codes that specify how the data should be displayed—formatting is accomplished.\n\
    \n[printf ()](#contents.xhtml_sc4_80a)\n\nFor formatted output in C, we use the\
    \ printf () function. It is a component of the standard C library (stdio.h), which\
    \ stands for print format. It is a powerful function for generating well-formatted\
    \ and attractively designed output since it enables us to output text and values\
    \ with particular formatting.\n\nThe printf() function’s general syntax is as\
    \ follows:\n\nprintf (\"format_string\", argument_list);\n\nformat_string is a\
    \ string containing the format specifiers and any desired text.\n\nargument_list\
    \ includes the values that will replace the corresponding format specifiers in\
    \ the format string.\n\nHere are some common format specifiers and their usage:\n\
    \n*   `%d` or `%i`: Format as signed decimal integer.\n*   `%f`: Format as floating\
    \ point number.\n*   `%c`: Format as character.\n*   `%s`: Format as string.\n\
    *   `%x` or `%X`: Format as hexadecimal (lowercase/uppercase).\n\nInput:\n\nprintf\
    \ (\"%d%d\\n\", a, b);\n\nOutput:\n\n2083\n\nThe numbers are written together\
    \ in such a way we cannot differentiate between the values of a and b. This is\
    \ so because the specification %d%d tells the compiler to print the numbers next\
    \ to each other, without any spaces or lines and so on. If we want them separated\
    \ by one space, say, we must put a space between %d and %d, like this:\n\nprintf\
    \ (\"%d %d\\n\", a, b);\n\n20 83\n\nWe can print the two numbers on different\
    \ lines or have them on the same line but separated by a set of white spaces (Tab).\n\
    \n[Control characters](#contents.xhtml_sc4_81a)\n\nControl characters in C are\
    \ unique characters that, when written or shown, carry out certain functions.\
    \ In the context of a program’s output, these characters have unique meanings\
    \ and functions, but no apparent representation like conventional characters do.\
    \ Escape sequences are frequently used to represent control characters. These\
    \ sequences begin with a backslash (‘’), then a particular character or code.\n\
    \nSome commonly used control characters in C:\n\n1.  `\\n` (Newline character):\
    \ It moves the cursor to the beginning of the next line.\n\n    Example:\n\n \
    \   printf (\"Hello\\nworld!\");\n\n    Output:\n\n    Hello\n\n    world!\n\n\
    2.  `\\t` (Tab character): It moves the cursor to the next tab (set of white spaces)\
    \ and stops on the same line.\n\n    Example:\n\n    printf (\"Hello\\tworld!\"\
    );\n\n    Output:\n\n    Hello world!\n\n3.  `\\b`(Backspace character): It moves\
    \ the cursor back by one position.\n\n    Example:\n\n    printf (\"Hello\\bworld!\"\
    );\n\n    Output:\n\n    Hellworld!\n\n4.  `\\r` (Carriage return character):\
    \ It moves the cursor to the beginning of the current line.\n\n    Example:\n\n\
    \    printf (\"Programming\\rworld!\");\n\n    Output:\n\n    world!mming\n\n\
    5.  `\\a` (Alert/Bell character): It produces an audible or visible alert, such\
    \ as a beep or flashing screen.\n\n    Example:\n\n    printf (\"Listen to the\
    \ beep\\a\");\n\n    Output:\n\n    Listen to the beep (followed by a beep sound)\n\
    \n6.  `\\\\` (Backslash): Since one backslash is associated with Control characters\
    \ in C, we have to use a double backslash ‘\\\\’ to represent a literal backslash\
    \ character.\n\n    Example:\n\n    printf (\"New line character is represented\
    \ by \\\\n\");\n\n    Output:\n\n    New line character is represented by \\n\n\
    \n7.  `\\’` (Single quote, apostrophe): It represents a literal single quote character.\n\
    \n    Example:\n\n    printf (\"God\\'s Children\");\n\n    Output:\n\n    God's\
    \ Children\n\n8.  `\\”` (Double quote): It represents a literal double quote character.\n\
    \n    Example:\n\n    printf (\"\\\"GodsChildren\\\"\");\n\n    Output:\n\n  \
    \  \"GodsChildren\"\n\n9.  `\\0` (Null character): Represents the Null Termination\
    \ character in strings.\n\n    Example:\n\n    printf (\"Null character: \\0\\\
    n\");\n\n    Output:\n\n    Null character:\n\n[Read data supplied by a user](#contents.xhtml_sc4_82a)\n\
    \nC programming allows us to declare a variable and initialize it with a value,\
    \ like:\n\nint main () {\n\nint a = 14;\n\n}\n\nIt would be convenient if we could\
    \ write programs in a way that allows a user to input data/ value at run-time,\
    \ the program which number to initialize a with when we execute the program (at\
    \ runtime). In this way, the number would not be tied to the variable from the\
    \ compile time, and the program would be more flexible. This can be done by getting\
    \ the program to prompt us for a number. This is where the scanf () function can\
    \ be used.\n\nThe basic input and output functions used in C are:\n\n*   scanf()\n\
    *   printf()\n\nscanf () function\n\nScanf ([format specifiers], [variable names\
    \ preceded with & operator])\n\nScanf () takes two arguments; the first string\
    \ is called the format specifier.\n\nHere are some common format specifiers and\
    \ their usage:\n\n'%d' or '%i': Format as signed decimal integer.\n\n'%f': Format\
    \ as a floating point number.\n\n'%c': Format as a character.\n\n'%s': Format\
    \ as a string.\n\nIn the above example, the string consists of the format specification\
    \ %d only. It specifies the type of data to be read. Here, %d is used to indicate\
    \ that an integer value is to be read.\n\nThe & (ampersand) operator specifies\
    \ the address of the variable to which it is used as a prefix.\n\nLike &a, means\
    \ address of a, where a is supposedly a variable.\n\nscanf (\"%d\", &a),\n\nThe\
    \ above statement would scan a value from the input device (like a keyboard) and\
    \ store it at the address of a.\n\nIt is customary to use a printf (which prints\
    \ a message or value on an output device) before scanf () statement for the sake\
    \ of presentation. However, it is not mandatory.\n\n#include <stdio.h>\n\nint\
    \ main () {\n\nint a, b;\n\nprintf (\"Input 1st number\\n\");\n\nscanf (\"%d\"\
    , &a);\n\nprintf (\"Input 2nd number\\n\");\n\nscanf (\"%d\", &b);\n\nprintf (\"\
    %d + %d = %d\\n\", a, b, a + b);\n\n}\n\nThe program shall print the exact output\
    \ even without the first two printf () statements, but it will not look elegant\
    \ as the associated prompts for the two numbers would be missing.\n\n| Note: When\
    \ a user presses the “Enter” or “Return key” on keyboard, scanf() reads number\
    \ and stores it in a variable. The next printf statement then prompts ‘Enter second\
    \ number’ and the process is repeated. |\n\nSince a is an integer variable, scanf\
    \ expects the input data to be an integer or a value that can be converted into\
    \ an integer, like a float value 3.14 would be reduced to a non-fractional number,\
    \ that is, 3\\. If it is a character, the program will give an error message.\
    \ If the data is valid, the number will be stored in the variable a. The statement\
    \ scanf (\"%d\", &b); works in a similar manner.\n\nWe can use scanf to read more\
    \ than one value simultaneously. For example, let us say we want to read two integer\
    \ values for variables a and b. To do so, we would need to write %d two times\
    \ in the format specification thus:\n\nscanf (\"%d %d\", &a, &b);\n\nWhen this\
    \ statement is executed, it looks for two integers. The first one is stored in\
    \ a; the second one is stored in b.\n\nWhen entering the data, the numbers must\
    \ be separated by at least one white space, like:\n\n10 20\n\nWe can also use\
    \ the enter key to separate the input numbers like:\n\n10\n\n20\n\n[Read data\
    \ into a float or double variable](#contents.xhtml_sc4_83a)\n\nTo read a floating-point\
    \ number into a float variable, we can use:\n\nscanf (\"%f\", &x);\n\n%f is used\
    \ when we must read a value into a float variable. When executed, scanf expects\
    \ to find a valid floating-point constant in the data. To read a floating-point\
    \ number into a double variable, y, we can use:\n\nScanf (\"%lf\", &y);\n\nThe\
    \ specification %lf is used to read a value into a double variable. Data is entered\
    \ the same way for float and double variables.\n\nNote: We cannot use %f for reading\
    \ data into a double variable. (However, we can use %f for printing the value\
    \ of a double variable). Since the value read will be stored in 32 bits rather\
    \ than 64 bits (used for double). Furthermore, an integer is acceptable when entering\
    \ data for a float/double variable.\n\nWe can read values for int, double, or\
    \ float variables in the same scanf statement as shown in the following statement:\n\
    \nscanf (\"%d %lf %f\", &a, &b, &c);\n\n//used to input an integer, a double and\
    \ a float value\n\ngetchar (): This C library function helps input a single character\
    \ from a user.\n\n#include <stdio.h>\n\nint main () {\n\nchar ch;\n\nprintf (\"\
    Input a character: \");\n\nch = getchar ();\n\nprintf (\"You entered: \");\n\n\
    putchar (ch);\n\nreturn 0;\n\n}\n\nIn the above program, the getchar () function\
    \ is used to input one character from the console. The character is then stored\
    \ in the variable ch. The putchar () function is used to print the character to\
    \ the console.\n\nWhen we execute this program, it will prompt us to input a character.\
    \ Once we input a character and press the enter key, the program will print the\
    \ character you entered to the console.\n\n| Note: getchar () reads only one character\
    \ at a time, so if you enter more than one character, the program will only read\
    \ the first character and ignore the rest of the characters. |\n\ngetch () and\
    \ getche () are two input functions in the C programming language that are used\
    \ to read a character from the console without requiring the user to press the\
    \ enter key.\n\ngetch () function is used to read a character from the console\
    \ without displaying it on the screen. It does not require the user to press the\
    \ Enter key. The function does not take any arguments and returns the ASCII value\
    \ of the read character:\n\ninclude <stdio.h>\n\n#include <conio.h>\n\nint main\
    \ () {\n\nchar ch;\n\nprintf (\"Press any key to continue\\n\");\n\nch = getch\
    \ ();\n\nprintf (\"You pressed the key '%c'\", ch);\n\nreturn 0;\n\n}\n\nIn the\
    \ above example, getch () is used to read a character from the console without\
    \ displaying it on the screen. The function printf () is then used to display\
    \ the read character.\n\ngetche () function is similar to getch () function, except\
    \ that it displays the read character on the screen. The function does not take\
    \ any arguments and returns the ASCII value of the read character.\n\n#include\
    \ <stdio.h>\n\n#include <conio.h>\n\nint main () {\n\nchar ch;\n\nprintf (\"Press\
    \ any key\");\n\nch = getche ();\n\nprintf (\"\\nYou pressed the key '%c'\", ch);\n\
    \nreturn 0;\n\n}\n\nHere, using getche (), we read a character from the console,\
    \ and it was echoed (that is why we added e to getch function) on the screen.\n\
    \nNote that the conio.h header file is required to use both getch () and getche\
    \ () functions in C programming language.\n\n[putchar ()](#contents.xhtml_sc4_84a)\n\
    \nThis function prints a single character on the screen:\n\n#include <stdio.h>\n\
    \nint main () {\n\nchar ch = 'A';\n\nputchar (ch);\n\nreturn 0;\n\n}\n\nUsing\
    \ the putchar () function, character ch is printed to the console.\n\n[fgtes ()\
    \ and fputs ()](#contents.xhtml_sc4_85a)\n\nThe C programming language has two\
    \ input or output functions called fgets() and fputs() that are used to read and\
    \ write strings to and from files, respectively.\n\nA line of text can be read\
    \ from a file using the fgets() method. It requires three arguments: the character\
    \ array containing the read string as the first argument, the maximum number of\
    \ characters to be read as the second argument, and the file pointer pointing\
    \ to the file to be read as the third argument. A pointer to the first character\
    \ of the read string is returned by the function.\n\nfputs () function is used\
    \ to write a line of text to a file. It takes two arguments: the first argument\
    \ is the string to be written, and the second argument is the file pointer that\
    \ points to the file to be written. The function returns a non-negative integer\
    \ if the operation is successful and EOF if there is an error.\n\n*   fscanf ():\
    \ This function is used to read data from a file.\n*   fprintf (): This function\
    \ is used to write data to a file.\n\n[Print an integer using a field width](#contents.xhtml_sc4_86a)\n\
    \nWe print an integer value by including it in a printf command, and C prints\
    \ the value using as many columns as necessary. For instance, 123 is printed using\
    \ three print columns because it has three digits. The number -12345 is displayed\
    \ using six print columns, 5 for the five digits and one for the minus symbol.\
    \ While most applications can be satisfied with this, there are times when telling\
    \ C how many print columns to use can be helpful. To display the value of n in\
    \ 3 print columns, for example, we would specify a field width of 3 as follows:\n\
    \nprintf (\"%3d\", n);\n\nInstead of the specification %d, we now use %3d. The\
    \ value of n is printed in a field width of 3.\n\nThe field’s width is placed\
    \ between % and d. Suppose n is 12; there are 2 digits to print, so 2 print columns\
    \ are needed. Since the field width is 3, the number 12 is printed with 1 space\
    \ before it as ~12 (~ = white space).\n\nHere, 12 was printed right justified\
    \ (placed towards the right in the field and spaces added in front of it to make\
    \ up the field width) with 1 leading space or padded on the left with 1 space.\n\
    \nFor a number positioned towards the left and spaces added after it to compensate\
    \ for the field width, the number said to be left justified. Hence, 271~~ is left\
    \ justified in a field width of 5.\n\nThe minus (-) sign is used to specify left\
    \ justification; %-xd will print a value left justified in a field width of x.\
    \ For example:\n\nn = 25;\n\nprintf (\"n = %-5d\", n);\n\nwould print:\n\n25~~~\n\
    \nFor a negative value, say n = -7, and the field width is 5\\. We require two\
    \ print columns (one for ‘–‘ sign and 1 for 7); the field width is 5, so it would\
    \ be printed with 3 leading spaces;\n\n~~~-7.\n\n| Note: C ignores the field width\
    \ if it is too small and just writes the value in as many columns as necessary.\
    \ For example, if the field width is 2 and the value to be printed is 345, C just\
    \ displays the value as it is, ignoring the (deficient) field width. |\n\nWhen\
    \ we want our output (numeric) data lined up, we may take services of field width\
    \ with text justification. For a declaration:\n\nint a, b, c;\n\nn1 =1276;\n\n\
    n2 = -30;\n\nn3 = 231;\n\nprintf (\"%d\\n\", n1);\n\nprintf (\"%d\\n\", n2);\n\
    \nprintf (\"%d\\n\", n3);\n\nIt will print:\n\n1276\n\n-30\n\n231\n\nEach number\
    \ is printed using just the number of columns required. Since this varies from\
    \ one number to the next, they do not line up. If we want to, we could get the\
    \ numbers lined up using a field width of 6, for example, the statements:\n\n\
    printf (\"%6d\\n\", n1);\n\nprintf (\"%6d\\n\", n2);\n\nprintf (\"%6d\\n\", n3);\n\
    \nIt will print (◊ denotes a space):\n\n~~1276\n\n~~~-30\n\n~~~231\n\n[Floating\
    \ point types](#contents.xhtml_sc3_87a)\n\nA floating point number is a number\
    \ with a fractional part. A floating point constant can be written in the following\
    \ ways:\n\n*   The standard way, with an optional sign and including a decimal\
    \ point; for example, -23.75, 0.51, 41.0.\n*   Using scientific notation, with\
    \ an optional sign, including a decimal point and an exponent part, 0.215 can\
    \ be written as 2.15e-1, that is, 2.15 x 10-1. The exponent can be specified using\
    \ either e or E.\n\n| Note: There are several ways to write the same number. For\
    \ example, the following represent the same number 27.96: 27.96E00 2.796E1 2.796E+1\
    \ 2.796E+01 0.2796E+02 279.6E-1. |\n\nWe can declare a floating-point variable\
    \ in C programming using either float or double. A float value is normally stored\
    \ as a 32-bit floating-point number with up to 7 significant digits. The double\
    \ value, on the other hand, is stored as a 64-bit floating-point number with about\
    \ 15 significant digits.\n\nA floating-point constant is of type double unless\
    \ followed by f or F, in which case it is of type float. Thus, 23.5 is type double,\
    \ but 3.7f or 3.7F is type float. Most calculations are done by means of double\
    \ precision. The float type is convenient if you need to store many floating-point\
    \ numbers and wish to use less storage.\n\nTo summarize details of standard floating-point\
    \ types with storage sizes and value ranges and their precision:\n\n*   Storage\
    \ capacity of float is 4 bytes, which can store a value ranging from  1.2E-38\
    \ to 3.4E+38 with 6 decimal places.\n*   Storage capacity of double is 8 bytes,\
    \ which can store a value ranging from  2.3E-308 to 1.7E+308 with 15 decimal places\
    \ and\n*   Storage capacity of long double is 10 bytes, which can store a value\
    \ ranging from  3.4E-4932 to 1.1E+493238 with 19 decimal places.\n\nTo use details\
    \ about the binary representation of real numbers in our programs, we must include\
    \ the header file float.h, which defines macros that allow us to traverse various\
    \ facets of float datatype.\n\nIf checking storage capacity, minimum and maximum\
    \ positive values, and precision of float data type, we may use the following\
    \ functions or macros:\n\n*   sizeof (float);\n*   FLT_MIN\n*   FLT_MAX\n*   FLT_DIG\n\
    \n[Print double and float variables](#contents.xhtml_sc4_88a)\n\nIf we wish to\
    \ print the value of a float or double variable, we can use %f. For example, consider\
    \ the following:\n\ndouble x = 23.431657;\n\nprintf (\"%f \\n\", x);\n\nThe value\
    \ of x will be printed to a predefined number of decimal places, usually six;\
    \ it varies from one compiler to the other. In this case, the value printed will\
    \ be 23.431567. However, if x were assigned 23.6543215, the value printed would\
    \ be rounded to six decimal places, 23.654322.\n\nIf we wish to tell the compiler\
    \ how many decimal places to print or how many columns to use. For, if we want\
    \ to print x in the above example to 2 decimal places in a field width of 5, we\
    \ can use:\n\nprintf (\"%5.2f \\n\", x);\n\nIn-between % and f, we write 5.2,\
    \ the field width, followed by a point (.), the number of decimal places. The\
    \ value is rounded to the stated number of decimal places and then printed. Here,\
    \ the value printed will be 23.43, which occupies exactly 5 print columns. If\
    \ the field width provided is bigger, the number will be padded on the left with\
    \ the requisite number of spaces. If the field width provided, however, is smaller,\
    \ the number is printed using as many columns as necessary. For example, consider:\n\
    \nb = 245.75;\n\nprintf (\"%6.1f \\n\", b);\n\nHere, 1 alludes to rounding the\
    \ number to 1 decimal place, so the new value will be 245.8, which requires 5\
    \ columns for printing.\n\n6 suggests printing 245.8 in 6 columns; since only\
    \ 5 columns are needed for printing the number, one space is added at the beginning\
    \ to make up 6 columns, so the number is printed as ~245.8 (~ = space).\n\n[Floating-point\
    \ expressions](#contents.xhtml_sc4_89a)\n\nFloating-point expressions can participate\
    \ in addition, subtraction, multiplication, and division operations like integer\
    \ data.\n\nFor operands a and b, [Table 2.6](#ch02.xhtml_tab2-6) shows the type\
    \ of calculation performed:\n\n| a | b | Type of calculation |\n| float | float\
    \ | float |\n| float | double | double |\n| double | float | double |\n| double\
    \ | double | double |\n\nTable 2.6: Floating point expression calculation\n\n\
    Thus, float is performed only if both operands are float; otherwise, double is\
    \ performed.\n\n[Assigning double/float to int](#contents.xhtml_sc4_90a)\n\nConsider\
    \ the value 987 is printed. When we assign a floating-point value to an int, the\
    \ fractional part, if any, is dropped (not rounded), and the resulting integer\
    \ value is assigned.\n\ndouble x = 87.321;\n\nint a = x;\n\nprintf (\"%d \\n\"\
    , a);\n\nOutput:\n\n87\n\n[Char data type](#contents.xhtml_sc3_91a)\n\nIn C, the\
    \ char data type represents a single character, such as a letter, digit, or symbol.\
    \ It is an integer type with a size of 1 byte (8 bits) on most systems and can\
    \ hold integer values in the range of -128 to 127 or unsigned values in the range\
    \ of 0 to 255, depending on whether it is signed or unsigned.\n\nTo declare a\
    \ variable of type char, you can use the following syntax:\n\nchar variable_name;\n\
    \nFor example, to declare a variable named z of type char, we would use this code:\n\
    \nchar z;\n\nWe can also initialize a char variable at the time of declaration,\
    \ just like any other variable in C:\n\nchar ch = 'A';\n\nThis code declares a\
    \ variable named ch of type char and initializes it with the character 'A'.\n\n\
    In addition to single characters, char variables can also be used to represent\
    \ strings (array) of characters, For example:\n\nchar nm[] = \"Zain\"; //discussed\
    \ in detail in chapter 6\n\nThis code declares an array named nm of type char\
    \ and initializes it with the string \"Zain\". String values are terminated by\
    \ the null terminator character `\\0’. The array has a size of 5 (including the\
    \ terminal character), and each element holds a single character.\n\nThe char\
    \ data type is often used in C for text processing and input or output operations,\
    \ such as reading and writing characters from the console or a file. However,\
    \ we can also use characters in arithmetic operations, where the integer value\
    \ of the character is needed instead of the character itself. To print the ASCII\
    \ value of a character, we simply print the char with the format specifier of\
    \ integer (%d), instead of the %c format specifier of char.\n\nFor example:\n\n\
    #include <stdio.h>\n\nint main () {\n\nchar x = 'A';\n\nprintf (\"The ASCII value\
    \ of '%c' is %d\\n\", x, x);\n\n}\n\nIt would produce an output of:\n\nThe ASCII\
    \ value of 'A' is 65\n\nThe preceding code declares a char variable named x and\
    \ initializes it with the character 'A'. It then prints the character and its\
    \ ASCII value to  the x variable to the console using the printf function.\n\n\
    [void type](#contents.xhtml_sc3_92a)\n\nIn C, the void type is a special type\
    \ representing a value’s absence. It is used in several contexts, such as function\
    \ return types, function arguments, and pointer declarations.\n\nSome common uses\
    \ of the void type in C are:\n\n*   Function return type: If a function does not\
    \ return a value, its return type can be specified as void. For example:\n\n \
    \   void msg() {\n\n    printf (\"Hello, world!\");\n\n    }\n\n    The function\
    \ msg() does not return a value (it has a void return type). The function simply\
    \ prints the string \"Hello, world!\" to the output.\n\n*   Function arguments:\
    \ If a function does not take any arguments, its parameter list can be specified\
    \ as void. For example:\n\n    void msg (void) {\n\n    printf (\"Hello, world!\"\
    );\n\n    }\n\n    This function takes no arguments (its parameter list is specified\
    \ as void).\n\n*   Pointer declarations: A pointer to void (a void pointer) is\
    \ a special pointer that can point to any data type. This is useful when a function\
    \ or data structure needs to accept or return data of different types. For example:\n\
    \n    void *ptr;\n\n    int x = 42;\n\n    ptr = &x; // ptr now points to x\n\n\
    We declare a void pointer named ptr and initialize it to NULL. It then declares\
    \ an int variable named x and assigns it 42. Finally, it sets ptr to point to\
    \ x using the operator’s address.\n\n| Note: ptr is a void pointer, it can be\
    \ used to point to any data type, not just int. |\n\nThe void type often indicates\
    \ that a function or pointer can accept or return data of any type. However, the\
    \ void does not represent a specific data type, so it cannot be used to declare\
    \ variables or define data structures.\n\n[Lvalues and Rvalues in C](#contents.xhtml_sc3_93a)\n\
    \nIn C, an expression can be classified as either an Lvalue or an Rvalue. Understanding\
    \ the difference between L-values and R-values is important when working with\
    \ C’s assignment and operator expressions.\n\nAn Lvalue refers to an expression\
    \ that refers to a memory location, such as a variable or an array element. An\
    \ Lvalue can appear on the left-hand side of an assignment expression because\
    \ it can be assigned as a value. For example:\n\nint x;\n\nx = 42; // x is a Lvalue\
    \ because it refers to a memory location\n\nIn the preceding code, x is an Lvalue\
    \ because it refers to a memory location that can be assigned a value.\n\nAn Rvalue\
    \ refers to an expression that represents a value but does not necessarily refer\
    \ to a memory location. An Rvalue can appear on the right-hand side of an assignment\
    \ expression because its value can be assigned to an Lvalue. For example:\n\n\
    int y;\n\ny = 10 + 20; // 10 + 20\n\n10 + 20 is an Rvalue because it represents\
    \ the value 30 but does not refer to a specific memory location.\n\nNot all expressions\
    \ can be classified as either an Lvalue or an Rvalue. For example, the ternary\
    \ operator `?:` can return either an Lvalue or an Rvalue, depending on the context\
    \ in which it is used. Similarly, function calls can also return either an Lvalue\
    \ or an Rvalue, depending on the function’s return type.\n\nHere are some other\
    \ examples of Lvalues and Rvalues in C:\n\n*   int x = 12; // x is an Lvalue,\
    \ because it refers to a memory location\n*   int y = x; // x is an Rvalue because\
    \ its value is assigned to y\n*   int z = x + y; // x + y is an Rvalue, because\
    \ it represents a value\n*   int *p = &x; // & a is an Rvalue because it represents\
    \ the address. Hence, it is a value to be assigned to p.\n\nIn general, understanding\
    \ the difference between Lvalues and Rvalues for writing correct and efficient\
    \ C code is important, as it affects how expressions and variables are manipulated\
    \ or stored in memory.\n\n[Literals](#contents.xhtml_sc3_94a)\n\nLiterals are\
    \ constants used to represent static things that cannot be specified as variables.\
    \ These constants take up memory without having a specific reference, like variables.\
    \ The main purpose of C literals is to supplement the code and deal with situations\
    \ when a variable may not be specified. During its operation, a program cannot\
    \ change these constants. The fundamental data types, including integer, floating-point,\
    \ character, and string literals, can be used as constants. Additionally, there\
    \ are enumeration constants. Except for the fact that their values cannot be changed\
    \ after their definition, the constants are handled just like the normal variables.\n\
    \n[Integer literals](#contents.xhtml_sc4_95a)\n\nIn C, an integer literal is a\
    \ sequence of digits representing an integer value. Integer literals can be written\
    \ in decimal, octal, or hexadecimal notation, and they can have different types\
    \ depending on their format and size:\n\n*   Decimal notation: `12`, `132`, `0`,\
    \ `-10`\n*   Octal notation: `056`, `072`, `0100`\n*   Hexadecimal notation: `0x2a`,\
    \ `0x7b`, `0xff`\n\nIn C, the default type of an integer literal is int, which\
    \ is typically a 32-bit signed integer on most platforms. However, you can specify\
    \ a different type for an integer literal by appending a suffix to the literal,\
    \ as shown in [Figure 2.14](#ch02.xhtml_fig2-14):\n\n![](images/Figure_2.14.png)\n\
    \nFigure 2.14: Suffixes used with literals\n\nFor example, 32u is an unsigned\
    \ integer literal with a value of 32, and 0xffUL is an unsigned long integer literal\
    \ with a value of 255.\n\nNote that integer literals can overflow if their value\
    \ exceeds the range of their type. For example, on a platform where int is a 32-bit\
    \ signed integer, the literal 2147483648 will overflow and have an undefined value.\
    \ To avoid overflow, use a larger type (such as long or long long) or check for\
    \ overflow in your code.\n\nIn addition, you can use the underscore (_) character\
    \ as a separator to make large integer literals more readable. For example, 1_000_000\
    \ is equivalent to the integer literal 1000000.\n\n[Floating-point literals](#contents.xhtml_sc4_96a)\n\
    \nIn C, a floating-point literal is a numeric value representing a floating-point\
    \ number. It is a number with a decimal point or an exponent that indicates the\
    \ number’s magnitude.\n\nC provides two types of floating-point literals: Float\
    \ and Double. The float type represents a single-precision floating-point number,\
    \ and the double type represents a double-precision floating-point number.\n\n\
    For example:\n\n*   float f = 3.14f; // a float literal with the value 3.14\n\
    *   double d = 6.022e23; // double literal with the value 6.022 x 10^23\n*   float\
    \ g = 1.0 / 3.0; // float literal pewith value 0.33333334 (approx).\n\nIn the\
    \ first example, the literal 3.14f is a float literal because it is suffixed with\
    \ the letter f. If the suffix is omitted, the literal is default interpreted as\
    \ a double literal.\n\nIn the second example, the literal 6.022e23 represents\
    \ the value 6.022 x 10^23 in scientific notation. The letter e is used to indicate\
    \ the exponent.\n\nIn the third example, the literal 1.0 / 3.0 is a floating-point\
    \ expression evaluated at runtime. Since floating-point numbers cannot always\
    \ be represented exactly in binary, the result of this expression is an approximate\
    \ value.\n\nIt is important to be aware of the limitations and quirks of floating-point\
    \ arithmetic when working with floating-point literals in C. For example, the\
    \ precision and range of floating-point numbers are limited by the hardware and\
    \ implementation of the C compiler. In addition, floating-point arithmetic can\
    \ be affected by rounding errors and other issues that can lead to unexpected\
    \ results.\n\n[Character constants](#contents.xhtml_sc4_97a)\n\nIn C, a char literal\
    \ is a sequence of characters enclosed in single quotes, such as 'A' or '0'. Char\
    \ literals represent individual characters and are often used to initialize variables\
    \ of type char or to compare characters in conditional statements.\n\nFor example:\n\
    \nchar ch = 'A'; // initialize a char variable with the character 'A'\n\nchar\
    \ chr = '0'; // initialize a char variable with the character '0'\n\nChar literals\
    \ can also represent special characters, such as newline (`’\\n’`) or tab (`’\\\
    t’`), which are used to format output or to manipulate text. Here are some examples\
    \ of char literals that represent the special characters:\n\nchar c = '\\n'; //\
    \ initialize a char variable with a newline character\n\nchar c = '\\t' // initialize\
    \ a char variable with a tab character\n\nIn C, char literals are represented\
    \ as integer values in memory, with each character corresponding to a specific\
    \ ASCII code or Unicode code point. For example, the character A corresponds to\
    \ the integer value 65 in ASCII code, and the character 0 corresponds to the integer\
    \ value 48.\n\nIt is worth noting that C also supports string literals, which\
    \ are sequences of characters enclosed in double quotes, such as \"Hello, world!\"\
    . String literals are treated as arrays of characters in C and are often used\
    \ to initialize arrays of type char.\n\n[String literals](#contents.xhtml_sc4_98a)\n\
    \nIn C, a string literal is a sequence of characters enclosed in double quotes,\
    \ such as “Hello, world!”. String literals are used to represent string values\
    \ in C programs.\n\nString literals are considered constant expressions, which\
    \ means that they are stored in read-only memory and cannot be modified at runtime.\
    \ For example, the following code will result in a compile-time error:\n\nchar\
    \ *s = \"Zaimi\";\n\ns [0] = 'h'; // error: assignment to read-only location\n\
    \nIn this code, s is a pointer to the string literal \"Zaimi\". When we attempt\
    \ to modify the first character of s, we get a compile-time error because the\
    \ string literal is stored in read-only memory.\n\nIn addition to alphanumeric\
    \ characters, string literals can also contain escape sequences, which are special\
    \ characters that are represented by a backslash followed by another character.\n\
    \nFor example, the following escape sequences are commonly used in C string literals:\n\
    \n*   \\n:  newline\n*   \\t:  tab\n*   \\\":  double quote\n*   \\:  single quote\n\
    *   \\\\:  backslash\n\nString literals can be used in several ways in C programs.\
    \ For example, they can be assigned to char arrays, used as function arguments,\
    \ or printed to the console using the printf function. Here are some examples:\n\
    \n*   char str1[] = \"Hello Zaimi!\"; // assigns string literal to char array\n\
    *   char *s= \"Hello, Zaimi!\"; // assigns string literal to char pointer\n* \
    \  printf (\"%s\\n\", \"Hello, Zaimi!\"); // prints string literal using printf\n\
    \nIn general, string literals are a convenient way to represent string values\
    \ in C programs. However, it is important to remember that they are stored in\
    \ read-only memory and cannot be modified at runtime. If you need to modify a\
    \ string at runtime, use a char array or dynamically allocated memory instead.\n\
    \n[Defining constants](#contents.xhtml_sc3_99a)\n\nIn C, a constant is a value\
    \ that cannot be modified by the program once it has been defined. Defining constants\
    \ can make programs more readable and maintainable by making the intent of the\
    \ code clear and by preventing inadvertent changes to values that should not be\
    \ modified.\n\nWe can define constants in C in various ways:\n\n*   Using the\
    \ #define preprocessor directive: This method defines a macro that replaces any\
    \ occurrence of a given identifier with a specified value. For example, the following\
    \ code defines a constant named PI with a value of 3.14159:\n\n    #define PI\
    \ 3.14159\n\n    After this definition, any occurrence of the identifier PI in\
    \ the program will be replaced with the value 3.14159 by the preprocessor.\n\n\
    *   Using the const keyword: This method defines a variable with a fixed value\
    \ that cannot be changed after initialization. For example, the following code\
    \ defines a constant named MAX with a value of 100:\n\n    const int MAX = 100;\n\
    \n    After this definition, the variable MAX cannot be modified by the program.\n\
    \n*   Using an enumeration: This method defines a set of named constants that\
    \ are assigned to the integer values. For example, the following code defines\
    \ an enumeration named Color with three constant values:\n\n    enum Color {A\
    \ = 1, B = 2, C = 3};\n\nAfter this definition, the names A, B, and C can be used\
    \ as constants in the program.\n\n| Note: Defining constants using the `#define`\
    \ directive can lead to some potential problems, such as unexpected substitution\
    \ of identifiers and a lack of type checking. Therefore, using `const` variables\
    \ or enumerations is generally considered to be a safer and more reliable way\
    \ to define constants in C. It is a good programming practice to define constants\
    \ in capitals. |\n\n[Differences between constants and literals](#contents.xhtml_sc3_100a)\n\
    \nA value that cannot be changed while a program is running is referred to as\
    \ a constant. Different sorts of constants are possible, including integer, floating-point,\
    \ character, and string constants. In C, constants are often used to express known\
    \ fixed values at compile time.\n\nAs an illustration, the following code defines\
    \ a few integer and floating-point constants:\n\nConst float PI = 3.14159, const\
    \ int MAX = 100\n\nMAX and PI are constants in this code that cannot be modified\
    \ while the program is running.\n\nIn source code, a value is represented using\
    \ a literal notation. Different forms of literals are possible, including string\
    \ literals, character literals, floating-point literals, and integer literals.\
    \ For the purpose of representing fixed values in source code, C uses literals.\n\
    \nThe following code, for instance, makes use of some integer and floating-point\
    \ literals:\n\nint x = 42;\n\nfloat y = 3.14;\n\nThe literals 42 and 3.14 in this\
    \ code represent integer and floating-point values, respectively.\n\nThough literals\
    \ can initialize constants, not all literals are constants. For instance, the\
    \ following code is invalid:\n\nint *p = &42 // Cannot accept the address of an\
    \ integer literal\n\n&42 is not an acceptable constant expression in this code\
    \ since it is not a Lvalue.\n\n[Storage class](#contents.xhtml_sc3_101a)\n\nIn\
    \ C programming, storage classes are used to specify the scope, visibility, and\
    \ lifetime of variables or functions. Four different storage classes are available\
    \ in C, which are:\n\n*   Auto\n*   Register\n*   Static\n*   Extern\n\n[Auto](#contents.xhtml_sc4_102a)\n\
    \nAuto keyword specifies that the variable has a local scope and automatic storage\
    \ duration. Auto is the default storage class for all local variables. A variable\
    \ is created when the control enters the block, which is defined and destroyed\
    \ when the control exits from the block.\n\nvoid func () { // Both declarations\
    \ below define variable as Auto\n\nauto int x = 10;\n\nint x=10;\n\n}\n\n[Register](#contents.xhtml_sc4_103a)\n\
    \nTo define local variables that should be stored in a CPU register rather than\
    \ in memory, they should be declared with a register storage class. The register\
    \ keyword is only a hint to the compiler and may or may not be followed. For example:\n\
    \nvoid func () {\n\nregister int x = 10;\n\n}\n\n[Extern](#contents.xhtml_sc4_104a)\n\
    \nExtern storage class is used to declare variables or functions that may be defined\
    \ in another file. The extern declaration enables a variable or function to be\
    \ used in multiple files without redefining it in each file. For example:\n\n\
    // file1.c\n\nextern int x;\n\n// file2.c\n\nint x = 10;\n\n[Static](#contents.xhtml_sc4_105a)\n\
    \nThroughout the course of the program’s execution, persistent variables with\
    \ lifetimes are defined using this storage class. When a variable is declared\
    \ static, its value is kept between function calls and must be initialized once.\
    \ A static variable also has a file scope, meaning that it can only be seen in\
    \ the file in which it is defined. For example:\n\nvoid func () {\n\nstatic int\
    \ x = 10;\n\n}\n\nTo sum things up, storage classes in C provide a way to control\
    \ the scope, visibility, and lifetime of variables and functions in a program.\
    \ Understanding the different storage classes is important for writing efficient\
    \ and modular C code.\n\nIn C programming, when static is used on a class data\
    \ member, it causes only one copy of that member to be shared by all the objects:\n\
    \n#include <stdio.h>\n\nvoid func (void);\n\nstatic int count = 5; /* global variable\
    \ */\n\nint main () {\n\nprintf (\"values of I, 5 times using ordinary declaration\\\
    \"\");\n\nwhile (count--) {\n\nfunc ();\n\n}\n\ncount=5;\n\nprintf \"\"values\
    \ of i, 5 times using static declaration\\\"\");\n\nwhile (count--) {\n\nfunc_static\
    \ ();\n\n}\n\n}\n\n/* function definition */\n\nvoid func (void) {\n\nint i =\
    \ 0; /* local static variable */\n\ni++;\n\nprintf \"\"i = %d\\\"\", i);\n\n}\n\
    \nvoid func_static (void) {\n\nstatic int i = 0; // local static variable\n\n\
    i++;\n\nprintf \"\"i = %d\\\"\", i);\n\n}\n\nThe output for the preceding code\
    \ is:\n\nValues of I, 5 times using ordinary declaration:\n\ni = 1\n\ni = 1\n\n\
    i = 1\n\ni = 1\n\ni = 1\n\nValues of I, 5 times using static declaration:\n\n\
    i = 1\n\ni = 2\n\ni = 3\n\ni = 4\n\ni = 5\n\n[Extern storage class](#contents.xhtml_sc4_106a)\n\
    \nA reference to the global variable that is accessible from all program files\
    \ is provided using the extern storage class. The variable cannot be initialized\
    \ when using the extern keyword, but it does direct the variable name to a previously\
    \ established storage location.\n\nExtern is used in another file to provide the\
    \ reference of a declared variable or function when you have many files and specify\
    \ a global variable or function that will also be utilized in other files. Just\
    \ to be clear: When declaring a global variable or function in another file, extern\
    \ is utilized.\n\nWhen two or more files share the same global variables or functions,\
    \ as detailed below, the extern modifier is most frequently used.\n\nFirst File:\
    \ var.c\n\nint x=65;\n\nSecond File: main.c\n\n#include <stdio.h>\n\n#include\
    \ \"var.c\"\n\n// To include/ link file with external variable declaration.\n\n\
    extern int x; // extern variable\n\nint main () {\n\n// print the variable from\
    \ another file\n\nprintf (\"Extern value = %d\", x);\n\nreturn 0;\n\n}\n\nHere,\
    \ the variable has been declared in the first file var.c. To use the variable\
    \ x in the second file, the keyword extern is being used in the second file. In\
    \ the second file, we must give reference to the file where x has been declared,\
    \ which is done by the statement:\n\n#include \"var.c\"\n\nNow compile and execute\
    \ the second file, which should produce the output:\n\nExtern value = 32\n\n[Writing\
    \ basic programs in C](#contents.xhtml_sc3_107a)\n\nWriting basic programs in\
    \ C involves writing code that performs a specific task or solves a particular\
    \ problem. Basic programs typically involve defining variables, using operators\
    \ and control statements to manipulate those variables, and using functions to\
    \ perform specific operations.\n\n[Sequential logic](#contents.xhtml_sc4_108a)\n\
    \nSequential logic refers to the behavior of a program in which instructions are\
    \ executed one after the other in a sequential order. In C, sequential logic is\
    \ the default mode of execution of statements, in which statements are executed\
    \ in the order in which they appear in the program.\n\nUnless control statements\
    \ like if, while, for, or switch are used to modify the regular flow of control,\
    \ statements in C are executed sequentially, one after the other. The order in\
    \ which the statements are written in the source code determines the sequence\
    \ of execution.\n\nHere we present some basic C programs based on sequential logic:\n\
    \n*   Printing a greetings message to the console:\n\n    #include <stdio.h>\n\
    \n    int main () {\n\n    printf (\"Hello, world\");\n\n    return (0);\n\n \
    \   }\n\n*   Program to compute the sum of two integers:\n\n    #include <stdio.h>\n\
    \n    int main () {\n\n    int n1, n2, sum;\n\n    printf (\"Enter 2 integers\\\
    n\");\n\n    scanf (\"%d %d\", &n1, &n2);\n\n    sum = a + b;\n\n    printf (\"\
    sum of the given numbers is %d\\n\", sum);\n\n    return (0);\n\n    }\n\n*  \
    \ Program to compute the average of three floating-point numbers:\n\n    #include\
    \ <stdio.h>\n\n    int main () {\n\n    float n1, n2, n3, avg;\n\n    printf (\"\
    Input 3 numbers\\n\");\n\n    scanf (\"%f%f%f\", &n1, &n2, &n3);\n\n    avg =\
    \ (n1 + n2 + n3) / 3;\n\n    printf (\"Average of the given numbers is %f\", avg);\n\
    \n    return (0);\n\n    }\n\n*   Program to convert temperature from Fahrenheit\
    \ to Celsius:\n\n    #include <stdio.h>\n\n    int main () {\n\n    float fah\
    \ = 68;\n\n    float cel = (fah - 32) * 5 / 9;\n\n    printf (\"%.2f Fahrenheit\
    \ is %.2f Celsius\\n\", fah, cel);\n\n    return (0);\n\n    }\n\n*   Program\
    \ to find the area of a rectangle:\n\n    #include <stdio.h>\n\n    int main ()\
    \ {\n\n    float l = 5.2;\n\n    float w = 3.7;\n\n    float area = l * w;\n\n\
    \    printf (\"Area of a rectangle is %.2f\\n\", area);\n\n    return (0);\n\n\
    \    }\n\n*   Program to find the average of three integers:\n\n    #include <stdio.h>\n\
    \n    int main () {\n\n    int n1, n2, n3, avg;\n\n    printf (\"Input 3 integers\\\
    n\");\n\n    scanf (\"%d%d%d\", &n1, &n2, &n3);\n\n    printf (\"Average = %d\"\
    , (n1+n2+n3)/3);\n\n    // assuming result to be Integer\n\n    return (0);\n\n\
    \    }\n\n*   Program to swap two integers:\n\n    #include<stdio.h>\n\n    int\
    \ main () {\n\n    int a, b, temp;\n\n    printf (\"Input 2 numbers\\n\");\n\n\
    \    scanf (\"%d%d\", &a, &b);\n\n    // value of a is assigned to temp\n\n  \
    \  temp=a;\n\n    // value of b is assigned to a\n\n    a = b;\n\n    // value\
    \ of temp (initial value of first) is assigned to b\n\n    b = temp;\n\n    printf\
    \ (\"\\nAfter swapping, first number = %.2lf\\n\", a);\n\n    printf (\"After\
    \ swapping, second number = %.2lf\", b);\n\n    return (0);\n\n    }\n\n*   Program\
    \ to add two floating point numbers:\n\n    #include <stdio.h>\n\n    int main\
    \ () {\n\n    float n1, n2;\n\n    printf (\"Input 2 float numbers\\n\");\n\n\
    \    scanf (\"%f %f\", &n1, &n2);\n\n    printf (\"Sum = %f\", n1 + n2);\n\n \
    \   return (0);\n\n    }\n\n*   Program to find the product of two floating point\
    \ numbers:\n\n    #include <stdio.h>\n\n    int main () {\n\n    double a, b,\
    \ product;\n\n    printf (\"Input 2 two numbers\\n\");\n\n    scanf (\"%lf %lf\"\
    , &a, &b);\n\n    product = a * b;\n\n    printf (\"Product = %.3lf\", product);\n\
    \n    // %.2lf displays number up to 3 decimal points\n\n    return (0);\n\n \
    \   }\n\n*   Program to find the area of a circle:\n\n    #include <stdio.h>\n\
    \n    #include<conio.h>\n\n    int main () {\n\n    float radius, ar;\n\n    printf\
    \ (\"Input Radius of Circle\\n\");\n\n    scanf (\"%f\", &radius);\n\n    ar =\
    \ 3.14 * radius * radius;\n\n    printf (\"The area of the given circle is %f\"\
    , ar);\n\n    return (0);\n\n    }\n\nIn each of these programs, the code is executed\
    \ sequentially, line by line. The output of each program is displayed in the console.\
    \ These programs demonstrate the basic syntax and structure of C programs, as\
    \ well as the use of variables, operators, and control structures such as printf()\
    \ and return.\n\n[Conclusion](#contents.xhtml_sc2_109a)\n\nIn summary, this chapter\
    \ has comprehensively covered the fundamental components of C programming. We\
    \ began by introducing key facts about C, emphasizing its significance in the\
    \ world of programming. Moving on, we explored the components of a C program,\
    \ delving into tokens, data types, variables, and integral data types. We also\
