  raw: 'One of the main advantages of custom-built software is the ability to handle
    special business goals and requirements that off-the-shelf software may not satisfy.
    This might involve integration with current systems, particular industry laws,
    and distinctive business processes.


    Because it may be created to expand and change in accordance with the needs of
    the business, custom software can also offer better flexibility and scalability
    than off-the-shelf software. It may also end up being more affordable in the long
    term.


    Packaged software


    It is commonly referred to as off-the-shelf software, is ready-made software that
    has been developed for a particular market or sector and is offered for purchase
    by anybody who requires it. This kind of software may be offered to many consumers
    and is frequently created by software companies.


    Packaged software is meant to offer a variety of capabilities, and it frequently
    focuses on user-friendliness with a clear feature set and simple navigation. QuickBooks,
    Adobe Creative Suite, and Microsoft Office are some examples of bundled software.
    Custom-built software is specifically designed and developed to meet the unique
    demands and requirements of a particular company or individual. Comparing custom-built
    software to off-the-shelf or pre-designed commercial software, there are clear
    differences in capability, performance, and usability.


    Since the development expenses are split among many clients, one of the main advantages
    of packaged software is that it is often less expensive than custom-built software.


    [Compiler](#contents.xhtml_sc4_12a)


    A compiler is software that converts source code written in a high-level programming
    language into machine code that a computer can execute. Lexical analysis, syntactic
    analysis, semantic analysis, code creation, and code optimization are some of
    the phases in the compilation process. The initial step in the lexical analysis
    process is breaking down the source code into individual tokens or words, such
    as keywords, identifiers, operators, and literals. The following step, syntax
    analysis, verifies that the code adheres to the grammar requirements of the computer
    language.


    The compiler does semantic analysis to ensure the code is understandable and well-formed
    once it has been parsed and verified. This process includes checks for type compatibility,
    variable scope, and other language-specific norms.


    Code creation and optimization are included in the compilation process’s last
    phases. While code optimization focuses on enhancing the effectiveness and performance
    of the produced code, code generation translates source code into machine code.


    After the compilation process is finished, the computer may run the generated
    machine code without the aid of an interpreter or virtual machine. Because of
    this, compiled programs run quicker and more effectively than interpreted ones.


    [Assembler](#contents.xhtml_sc4_13a)


    A low-level programming language called Assembler is used to create applications
    that may be run directly by a computer’s CPU. Mnemonic codes associated with certain
    machine instructions are used to write assembler code.


    The fundamental steps in assembler programming are writing source code, using
    an assembler to turn it into machine language, and running the resulting executable
    program on the target computer. Assembly language programs are generally more
    difficult to create compared to high-level programming languages due to the requirement
    for a deep comprehension of the underlying hardware architecture. Nevertheless,
    they offer greater hardware control and enable the development of faster and more
    efficient programs than those built using high-level languages. Assemblers typically
    include macro processing, conditional assembly, and symbolic addressing to make
    writing and maintaining large and complex programs easier. Common assemblers include
    Netwide Assembler (NASM), Microsoft Assembler (MASM), and GNU Assembler (GAS).


    [Debugger](#contents.xhtml_sc4_14a)


    A debugger is software that programmers use to find and correct flaws or problems
    in their code. Programmers can use debuggers to step through their code line by
    line, halt the running of the program at certain intervals, investigate variables,
    and check the status of the program at various points. This enables programmers
    to locate and isolate issues in their code before modifying and testing it to
    fix them.


    Debugging tools come in various forms, from straightforward command-line tools
    to sophisticated Integrated Development Environments (IDEs), GDB, Visual Studio
    Debugger, and Xcode Debugger are some examples of well-liked debuggers.


    [Interpreter](#contents.xhtml_sc4_15a)


    A computer program called an interpreter interprets and runs code written in a
    high-level programming language. Contrary to compilers, which convert source code
    into machine code before execution, interpreters read each line of source code
    and immediately execute it.


    Interpreters are frequently utilized in scripting languages like Python, Ruby,
    and JavaScript, where quick development times and usability are more essential
    than pure efficiency. Interpreters can also be employed for languages like Lisp
    and Prologue that need dynamic behavior or instantiate code.


    Because they can recognize and report problems as soon as they are encountered.
    Interpreters have the benefit of being able to provide better error messages than
    compilers. They can be more flexible than compilers because they can execute code
    at runtime, making it possible to create dynamic and interactive programs. However,
    interpreters can be slower than compilers because they must read and interpret
    code for each line of execution.


    [Language translators](#contents.xhtml_sc4_16a)


    Language translators are computer programs that automatically translate text from
    one language into another, facilitating communication between speakers of various
    languages. They are used in various settings, including business, education, healthcare,
    and government, to translate spoken or written communication.


    Rule-based, statistical, and neural machine translators are a few examples of
    the numerous types of language translators. Statistical machine translators utilize
    statistical models to identify the most likely translation, unlike rule-based
    machine translators, which employ rules to translate text from one language to
    another. The most sophisticated machine translation tools employ artificial intelligence
    to learn from massive quantities of data and produce more accurate translations.


    Google Translate, Microsoft Translator, and DeepL are some examples of popular
    language translation software. These tools are continually improving to provide
    better translations. However, it is important to note that language translation
    is not perfect. There are often errors or nuances lost in translation, particularly
    when dealing with idiomatic expressions, cultural references, or complex technical
    language.


    [Programming styles](#contents.xhtml_sc2_17a)


    A set of rules or guidelines governing how we can write the source code for a
    computer program in a particular programming language is known as programming
    style (followed by programming language). A programming language may follow any
    of the following programming styles and let a user code in concurrence with that
    particular programming.


    Let us discuss different programming styles to design a program:


    *   Procedural


    *   Modular


    *   Structured


    *   Object-oriented


    [Procedural programming](#contents.xhtml_sc3_18a)


    Procedural programming is based on the model of using procedures. A procedure
    called a subprogram, subroutine, or method is a set of instructions to solve a
    (sub) problem. Control can be assigned to any procedure within a program, including
    other procedures or itself. Refer to the following [Figure 1.2](#ch01.xhtml_fig1-2):


    ![](images/1.2.png)


    Figure 1.2: Procedural programming


    Features of procedural programming:'
