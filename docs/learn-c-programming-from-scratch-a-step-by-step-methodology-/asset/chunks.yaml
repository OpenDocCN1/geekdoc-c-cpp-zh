    \n![](images/fm1.png)\n\n# [CHAPTER 3Control Statements](#contents.xhtml_ch03a)\n\
    \n[Introduction](#contents.xhtml_sc2_111a)\n\nIn this chapter, we will dive into\
    \ the fundamental constructs that allow programmers to control the flow of their\
    \ programs and make decisions based on specific conditions. We will begin by exploring\
    \ control statements, which provide mechanisms for altering the sequential execution\
    \ of code. Next, we will delve into decision-making statements, such as if-else\
    \ and switch statements, which enable us to choose different paths of execution\
    \ based on the evaluation of conditions. Additionally, we will learn techniques\
    \ for handling multiple cases efficiently. Furthermore, we will explore the various\
    \ looping structures available in C, including the while, do-while, and for loops,\
    \ which enable repetitive execution of code. By the end of this chapter, we will\
    \ have a solid understanding of these important programming constructs, equipping\
    \ us with the skills to control program flow and make informed decisions in our\
    \ C programs. Let us begin this exciting journey into the world of control and\
    \ decision-making in C programming.\n\n[Structure](#contents.xhtml_sc2_112a)\n\
    \nThe chapter covers the following topics:\n\n*   Control statements\n*   Decision-making\
    \ statements\n*   Different loops used in C\n*   Loop control statements\n\n[Objectives](#contents.xhtml_sc2_113a)\n\
    \nThe objective of this chapter is to provide a comprehensive understanding of\
    \ control statements and decision-making statements in C programming. We will\
    \ explore the concept of control flow and learn how to make decisions based on\
    \ conditions using if-else and switch statements. Additionally, we will explore\
    \ handling multiple switch-case statements and implementing looping structures\
    \ such as the while, do-while, and for loops. By the end of this chapter, readers\
    \ will have a solid understanding of these fundamental programming constructs,\
    \ enabling them to effectively control the flow of their C programs and make decisions\
    \ based on various conditions.\n\n[Control statements](#contents.xhtml_sc2_114a)\n\
    \nControl statements govern a program’s flow, that is, the order in which instructions\
    \ in a program may get executed. The presence of control statements in our program\
    \ enables us to make decisions, to do tasks recurrently, or to jump from one section\
    \ of code to another. The flow of a program is generally sequential, where instructions\
    \ are executed one after the other, in sequence, like starting from the first\
    \ instruction and then executing the second, third, fourth and so on.\n\nThere\
    \ are instances when a programmer needs to execute a set of instructions based\
    \ on certain conditions. For example, executing instructions only if a specific\
    \ condition is met, such as determining if an input number is even. Similarly,\
    \ there are cases where a programmer wants to execute a set of instructions continuously\
    \ until a certain state is reached or a condition is fulfilled. Additionally,\
    \ there may be situations where it is necessary to skip a set of statements and\
    \ proceed to a different set of instructions. In such scenarios, the flow of execution\
    \ may not follow a strict sequential order. For instance, instruction 5 might\
    \ be followed by instruction 9, or instructions 10, 11, and 12 could be executed\
    \ multiple times. Furthermore, it may be necessary to skip instructions 21, 22,\
    \ and 23 and proceed directly to the subsequent instructions.\n\nThese scenarios\
    \ are enabled by the presence of control statements in our program. Let us try\
    \ to have an idea of them, then try our hand at some associated examples. Refer\
    \ to the [Figure 3.1](#ch03.xhtml_fig3-1):\n\n![](images/3.1.png)\n\nFigure 3.1:\
    \ Condition based logic\n\nThere are four basic control statements in C:\n\n*\
    \   Conditional (decision-making) statements\n*   Switch statements\n*   Loop\
    \ statements\n*   Jump statements (Go To)\n\n[Decision making statements](#contents.xhtml_sc3_115a)\n\
    \nFor decision-making, programmers must define constructs that will be assessed\
    \ or tested by the program, along with statements to be performed if the condition\
    \ is true and, optionally, some statements that will be run if the condition is\
    \ false.\n\nThe following is the general form of a typical decision-making structure\
    \ found in most of the programming languages:\n\nC programming language assumes\
    \ any non-zero and non-null values as true; if it is either zero or null, it is\
    \ assumed as false.\n\nIt also provides the following types of decision-making\
    \ statements:\n\n[if statement](#contents.xhtml_sc4_116a)\n\nThe if statement\
    \ executes a block of code if a condition is true. The if construct consists of\
    \ a Boolean expression followed by a block of statements to be executed if the\
    \ condition evaluates to TRUE.\n\nSyntax:\n\nif (condition) {\n\nSet of instructions\
    \ to be executed\n\n}\n\nFor example:\n\na=10; b=20;\n\nif (a>b) {\n\nprintf(\"\
    a is greater\");\n\n}\n\nAn if statement controls the execution of instructions\
    \ based on the results of a Boolean expression. if statement starts with an if\
    \ clause, followed by a condition and a BLOCK of instructions. An if clause may\
    \ also be followed by (an optional) else clause (or one or more else-if's).\n\n\
    [if...else statement](#contents.xhtml_sc4_117a)\n\nAs stated above, an  if statement\
    \ may be followed by an optional else  statement, which executes when the Boolean\
    \ expression is evaluated as FALSE:\n\nSyntax:\n\nif (condition) {\n\nSet of instructions\
    \ to be executed if the condition is true\n\n}\n\nelse {\n\nSet of instructions\
    \ to be executed if the condition is false\n\n}\n\nFor example:\n\n//Greatest\
    \ of two numbers\n\na=10; b=20;\n\nif (a>b)\n\nprintf(\"a is greater\");\n\nelse\n\
    \nprintf(\"b is greater\");\n\n| Note: Instructions associated with if or else\
    \ are enclosed within { and }, any statement outside { and } does not belong to\
    \ the corresponding if or else. |\n\nFor example:\n\nif (n<0) {\n\nprintf(\"Given\
    \ number is negative\");\n\n}\n\nprintf(\"hi\"); // ???????? see afterwards\n\n\
    else {\n\nprintf(\"a is positive\");\n\n}\n\nprintf(\"bye\");\n\nHere the statements\
    \ printf(\"hi\"); do not fall under the domain of if and printf(\"bye\"); does\
    \ not fall under the domain of else, as they lie outside the block { } of if and\
    \ body of else respectively. However, mentioning the block of if (or else) is\
    \ not always necessary.\n\nIn situations where only one instruction is within\
    \ the scope of an if or else statement, the use of curly braces { } is not required\
    \ for that single statement. This is because, by default, C recognizes the subsequent\
    \ single statement as belonging to the if/else block. However, when dealing with\
    \ multiple statements, it is necessary to enclose them within a { } block to define\
    \ the scope of the if or else statement:\n\nprintf(\"hi\"); //????????\n\nThe\
    \ above example is invalid as it lies in between if and else; in other words,\
    \ it belongs to neither if nor else.\n\n| Note: The else-clause of an if-clause\
    \ should start as soon as the block of the latter ends. Hence, the else-clause\
    \ belongs to the if-clause, which is immediately above it. |\n\nMisplaced else\n\
    \nA misplaced else is a usual error in programming, in programming languages that\
    \ use if-else constructs, like C, the error is generated when the else statement\
    \ is not paired with the correct if statement (Hence misplaced), resulting in\
    \ unexpected behavior in program results. To correct a misplaced else, we need\
    \ to review our code cautiously and make sure the else corresponds to the right\
    \ if.\n\nIn the example:\n\nif (n<0) {\n\nprintf(\"Given number is negative\"\
    );\n\n}\n\nprintf(\"hi\"); // ???????? see afterwards\n\nelse {\n\nprintf(\"a\
    \ is positive\");\n\n}\n\nprintf(\"bye\");\n\nThe highlighted statement is not\
    \ a part of the block and by syntax rules, ‘}’ of if should have been followed\
    \ by the else block, hence the else block here is a misplaced one, as it is not\
    \ present where it ought to be.\n\n*   Program to check whether a number is perfectly\
    \ divisible by another number (say 3):\n\n    int main () {\n\n    int num;\n\n\
    \    clrscr ();\n\n    printf(\"Input a No.\\n\");\n\n    scanf (\"%d\", &num);\n\
    \n    if (num%3 ==0) {\n\n    printf(\"The given number is perfectly divisible\
    \ by 3\");\n\n    }\n\n    else {\n\n    printf(\"The given number is not perfectly\
    \ divisible by 3\");\n\n    }\n\n    return (0);\n\n    }\n\n[The if-else-if ladder](#contents.xhtml_sc4_118a)\n\
    \nIn C programming, the if-else-if ladder is a means to test several conditions\
    \ in a series of if and else-if statements. It is a valuable construct when we\
    \ have several conditions to check and want to execute diverse blocks of code\
    \ based on the result of those tests.\n\nSyntax:\n\nif (condition1) {\n\n// statements\
    \ to execute if condition1 is true\n\n} else if (condition2) {\n\n// statements\
    \ to execute if condition1 is false and condition2 is true\n\n} else if (condition3)\
    \ {\n\n// statements to execute if condition1 and condition2 are false and condition3\
    \ is true\n\n} else {\n\n// statements to execute if none of the conditions are\
    \ true\n\n}\n\nThe first/outermost if statement tests condition1. If condition1\
    \ is true, the code inside that if statement will be executed, and the rest of\
    \ the else-if ladder will be skipped. If condition1 is false, the next else-if\
    \ statement will be tested. If condition2 is true, the code inside that else-if\
    \ statement will be executed, and the rest of the else-if ladder will be skipped.\
    \ This procedure lasts till either one of the conditions is true or till the final\
    \ else statement is reached.\n\nNote that the final else statement is optional,\
    \ and we can have as many else-if statements as needed.\n\nExample:\n\nint s =\
    \ 81;\n\nif (s >= 80) {\n\nprintf(\"Grade A\");\n\n} else if (s >= 60) {\n\nprintf(\"\
    Grade B\");\n\n} else if (s >= 40) {\n\nprintf(\"Grade C\");\n\n} else {\n\nprintf(\"\
    Grade D\");\n\n}\n\nIn this example, the program will output Grade A because the\
    \ score s is greater than or equal to 80 but less than 90\\. If the score was\
    \ greater than or equal to 90, the program would output Grade A, and so on.\n\n\
    The if-else-if ladder is a useful construct for testing multiple conditions and\
    \ executing different blocks of code based on the outcome of the tests. When using\
    \ the if-else-if construct, we must use it cautiously, as it can also make our\
    \ code harder to read and maintain:\n\n*   Program to check sign of a number:\n\
    \n    #include <stdio.h>\n\n    int main () {\n\n    int n;\n\n    printf(\"Input\
    \ a number\\n\");\n\n    scanf (\"%d\", &n);\n\n    if (n > 0)\n\n    {\n\n  \
    \  printf(\"%d is positive\\n\", n);\n\n    }\n\n    else if (n < 0)\n\n    {\n\
    \n    printf(\"%d is negative\\n\", n);\n\n    }\n\n    else\n\n    {\n\n    printf(\"\
    %d is zero\\n\", n);\n\n    }\n\n    return (0);\n\n    }\n\n*   Program to check\
    \ largest of three numbers:\n\n    #include <stdio.h>\n\n    int main () {\n\n\
    \    int n1, n2, n3;\n\n    printf(\"Input 3 numbers\\n\");\n\n    scanf (\"%d\
    \ %d %d\", &n1, &n2, &n3);\n\n    if (n1 > n2 && n1 > n3)\n\n    {\n\n    printf(\"\
    %d is the largest number\\n\", n1);\n\n    }\n\n    else if (n2 > n1 && n2 > n3)\n\
    \n    {\n\n    printf(\"%d is the largest number\\n\", n2);\n\n    }\n\n    else\n\
    \n    {\n\n    printf(\"%d is the largest number\\n\", n3);\n\n    }\n\n    return\
    \ 0;\n\n    }\n\n*   Program to check gender of a user:\n\n    int main () {\n\
    \n    char c;\n\n    printf(\"Input gender m for male or f for female\\n\");\n\
    \n    scanf (\"%c\", &c);\n\n    if (c == 'm')\n\n    {\n\n    printf(\"You are\
    \ a male\");\n\n    }\n\n    else if (c == 'f')\n\n    {\n\n    printf(\"You are\
    \ a female\");\n\n    }\n\n    else\n\n    {\n\n    printf(\"Other Gender\");\n\
    \n    }\n\n    return (0);\n\n    }\n\n[Nested if statements](#contents.xhtml_sc4_119a)\n\
    \nWe can use one if or else-if statement inside another if or else-if statement(s).\
    \ Placing a conditional statement inside another conditional statement is called\
    \ nesting of conditional statements. This is done where we need to check a condition\
    \ inside another condition. The control reaches the inner (nested) condition only\
    \ if the outer conditional statement(s) are considered true:\n\nif (condition1)\
    \ // outer-if\n\n{\n\ninstructions to be executed if the condition1 is true\n\n\
    if (condition2) // inner if\n\n{\n\ninstructions to be executed if the condition2\
    \ (and condition1) is true\n\n} closing Bracket of inner-if\n\nelse //else of\
    \ inner-if\n\n{\n\ninstructions to execute if Condition1 is true & condition2\
    \ is false\n\n} closing Bracket of outer-if\n\n}\n\nelse // else of first/ outer\
    \ if\n\n{\n\ninstructions to execute if Condition1 is false. Here we can test\
    \ more ifs & elses\n\n}\n\nFor example:\n\nSuppose we wish to check if a given\
    \ number n is divisible by 3 and 7:\n\nif (n%3 ==0)\n\n{\n\n// if true (Divisible\
    \ by 3) control would reach inner-if\n\nif (n%7 ==0\n\n{\n\n// if true (Divisible\
    \ by 7) control reaches inner-if\n\nprintf(\"n is divisible by 3 & 7\\n\");\n\n\
    }\n\nelse\n\n{ // This is ELSE of the above IF i-e: (not divisible by 7)\n\nprintf(\"\
    n is divisible by 3 only\\n\");\n\n}\n\n}\n\nelse\n\n{\n\n// This is ELSE of the\
    \ first IF (Not divisible by 3)\n\nif (n%7 ==0\n\n{ // Check divisibility of 7\n\
    \nprintf(\"n is divisible by 7 only\\n\");\n\n}\n\nelse\n\n{ // This is ELSE of\
    \ the above IF (not divisible by 7 and 3)\n\nprintf(\"n is divisible by none\\\
    n\");\n\n}\n\n}\n\n| Note: In the first if block ‘n’ is divisible by 3 and in\
    \ the corresponding else block , ‘n’ is not divisible by 3\\. Subsequently, we\
    \ check for the divisibility of 7. |\n\nSome programming examples related to conditional\
    \ statements:\n\n*   Program to check if given number is a multiple of 5:\n\n\
    \    #include<stdio.h>\n\n    int main () {\n\n    int n;\n\n    clrscr ();\n\n\
    \    printf(\"Input a Number\\n\");\n\n    scanf (\"%d\", &n);\n\n    if (n%5\
    \ == 0) // % operator returns remainder\n\n    {\n\n    printf(\"Given number\
    \ is a multiple of 5\");\n\n    }\n\n    else\n\n    {\n\n    printf(\"Given number\
    \ is not a multiple of 5\");\n\n    }\n\n    return (0);\n\n    }\n\n*   Program\
    \ to check for even/odd:\n\n    #include<stdio.h>\n\n    int main () {\n\n   \
    \ int n;\n\n    clrscr ();\n\n    printf(\"Input a Number\\n\");\n\n    scanf\
    \ (\"%d\", &n);\n\n    if (n%2 == 0)\n\n    {\n\n    printf(\"The given number\
    \ is Even\");\n\n    }\n\n    else\n\n    {\n\n    printf(\"The given number is\
    \ Odd\");\n\n    }\n\n    return (0);\n\n    }\n\n*   Program to compare two numbers\
    \ using simple if/else:\n\n    #include<stdio.h>\n\n    int main () {\n\n    int\
    \ n1, n2;\n\n    printf(\"Input numbers to compare\\n\");\n\n    scanf(\"%d%d\"\
    , &n1,&n2);\n\n    if (n1 > n2)\n\n    {\n\n    printf(\"First number is greater\
    \ than second number\");\n\n    }\n\n    else\n\n    {\n\n    printf(\"Second\
    \ number is greater than the first number\");\n\n    }\n\n    return (0);\n\n\
    \    }\n\nThe above examples are ideal for scenarios where only two execution\
    \ paths (handled by if and else) are possible. What if, in the above example,\
    \ user inputs same value for n1 as well as n2, the output would be Second number\
    \ is greater than the first number, which is not the expected output (which should\
    \ be – The numbers are equal). This is so because we have not defined the execution\
    \ path for a scenario where the user inputs the same values for both the variables\
    \ n1 and n2. To handle such cases, where merely an if & else combination is not\
    \ sufficient, we use elseif construct.\n\nThe syntax of elseif is:\n\nif (condition1)\
    \ {\n\n// statements to be executed if condition1 is true\n\nelse if (condition2)\
    \ {\n\n// statements to be executed if condition2 is true\n\n// After having a\
    \ desired number of else-ifs, we may use an else clause.\n\nElse {\n\n// statements\
    \ to be executed if all the conditions are false\n\n}\n\n*   Program to compare\
    \ two numbers using elseif:\n\n    #include<stdio.h>\n\n    int main () {\n\n\
    \    int n1, n2;\n\n    printf(\"Input numbers to compare\\n\");\n\n    scanf(\"\
    %d%d\",&n1,&n2);\n\n    if (n1 > n2)\n\n    {\n\n    printf(\"First number is\
    \ greater than second number\");\n\n    }\n\n    else if (n2 > n1)\n\n    {\n\n\
    \    printf(\"Second number is greater than the first number\");\n\n    }\n\n\
    \    else\n\n    {\n\n    printf(\"\\n The given numbers are equal\");\n\n   \
    \ }\n\n    return (0);\n\n    }\n\n*   Program to check grade obtained by a user\
    \ based upon percentage (For simplicity take %age as int)\n\n    #include<stdio.h>\n\
    \n    int main () {\n\n    int p;\n\n    printf(\"Enter Percentage\\n\");\n\n\
    \    scanf (\"%d\", &p);\n\n    if (p>=75)\n\n    {\n\n    printf(\"Distinction\"\
    );\n\n    }\n\n    else if (p>=60)\n\n    {\n\n    printf(\"First Division\");\n\
    \n    }\n\n    else if (p>=50) {\n\n    printf(\"2^(nd) Division\");\n\n    }\n\
    \n    else if (p>=40)\n\n    {\n\n    printf(\"3^(rd) Division\");\n\n    }\n\n\
    \    else\n\n    {\n\n    printf(\"Ohhh … You have failed!\");\n\n    }\n\n  \
    \  return (0);\n\n    }\n\n| Note: If represents the first, while else represents\
    \ the last path/possibility in the programs using elseif ladder. elseif’s represent\
    \ the intermediate possibilities/ paths. |\n\n[Nested conditions](#contents.xhtml_sc4_120a)\n\
    \nConditional statements defined within the domain of other conditional statements\
    \ are known as nested statements. It is fine to nest if-else statements in C programming,\
    \ which enables us to use one if/else or if statement inside another if/else/if\
    \ statement. The syntax for a nested condition statement is as follows:\n\nif\
    \ (condition1) {\n\n// executes when the condition1 is true\n\nif (condition2)\
    \ {\n\n// executes when the condition2 is true\n\n}\n\n}\n\nWe can nest else-if...else\
    \ statements as we have nested if statements:\n\n*   Greatest of three numbers:\n\
    \n    #include <stdio.h>\n\n    int main () {\n\n    int n1, n2, n3;\n\n    printf(\"\
    Input 3 Numbers\\n\");\n\n    scanf (\"%d%d%d\", &n1,&n2,&n3);\n\n    if (n1>n2)\
    \ //if n1 is greater than n2 control will go to nested-if\n\n    {\n\n    if (n1>n3)\n\
    \n    { //if n1 is greater than n3, then n1 is greatest\n\n    printf(\"n1 is\
    \ greatest\\n\");\n\n    }\n\n    else\n\n    { // n1<n3\n\n    printf(\"n3 is\
    \ greatest\\n\");\n\n    }\n\n    }\n\n    else // n2>n1\n\n    {\n\n    if (n2>n3)\n\
    \n    {\n\n    printf(\"n2 is greatest\\n\");\n\n    }\n\n    else\n\n    { //\
    \ n2<n3\n\n    printf(\"n3 is greatest\\n\");\n\n    }\n\n    }\n\n    return\
    \ (0);\n\n    }\n\n*   Bonus system of a company:\n\n    #include <stdio.h>\n\n\
    \    int main () {\n\n    int age;\n\n    char g;\n\n    printf(\"Input gender\
    \ - m or f\\n\");\n\n    scanf (\"%c\", &g);\n\n    printf(\"Input age\\n\");\n\
    \n    scanf (\"%d\", &age);\n\n    if (g == 'm')\n\n    { //if male\n\n    if\
    \ (age>=50)\n\n    { //if age>=50\n\n    printf(\"2000 is your bonus\\n\");\n\n\
    \    }\n\n    else\n\n    { //male but age<50\n\n    printf(\"1500 is your bonus\
    \ \\n\");\n\n    }\n\n    }\n\n    elseif (g == 'f') //if female\n\n    {\n\n\
    \    if (age>=50)\n\n    { //female and age>50\n\n    printf(\"3000 is your bonus\\\
    n\");\n\n    }\n\n    else\n\n    { // female and age<50\n\n    printf(\"2500\
    \ is your bonus \\n\");\n\n    }\n\n    }\n\n    else\n\n    {\n\n    printf(\"\
    Other gender\");\n\n    }\n\n    return (0);\n\n    }\n\n*   Evaluating year as\
    \ a leap year or not:\n\n    #include<stdio.h>\n\n    int main () {\n\n    int\
    \ y;\n\n    printf(\"Input year\\n\");\n\n    scanf (\"%d\", &y);\n\n    if (y\
    \ % 4 == 0)\n\n    {\n\n    if (y % 100 == 0)\n\n    {\n\n    if (y % 400 == 0)\n\
    \n    {\n\n    printf(\"%d is a leap year\\n\", y);\n\n    }\n\n    else\n\n \
    \   {\n\n    printf(\"%d is not a leap year\\n\", y);\n\n    }\n\n    }\n\n  \
    \  else\n\n    {\n\n    printf(\"%d is a leap year\\n\", y);\n\n    }\n\n    }\n\
    \n    else\n\n    {\n\n    printf(\"%d is not a leap year\\n\", y);\n\n    }\n\
    \n    return (0);\n\n    }\n\n    }\n\n    | Note: When writing conditional statements\
    \ in C, the ternary operator ‘?:’ offers a convenient alternative to the ‘if-else-elsif’\
    \ logic. It enables us to pick between two values depending on a criterion and\
    \ make decisions. |\n\n*   The ternary operator has the following syntax:\n\n\
    \    Condition? expression1: expression2\n\nValue of expression1 will be returned\
    \ if the condition is true, while value of expression2 will be returned if the\
    \ condition is false.\n\n*   Program to compare two numbers using if/else combination:\n\
    \n    #include<stdio.h>\n\n    int main () {\n\n    int a=9, b=80;\n\n    char\
    \ g;\n\n    if (a>b)\n\n    {\n\n    g='a';\n\n    }\n\n    else\n\n    {\n\n\
    \    g='b';\n\n    }\n\n    printf(\"Greatest value = %c\", g);\n\n    return\
    \ (0);\n\n    }\n\n*   Program to compare two numbers using ternary operator:\n\
    \n    int main () {\n\n    int a=9, b=80;\n\n    char g;\n\n    g=(a>b)? 'a':'b';\n\
    \n    printf(\"Greatest value = %c\", g);\n\n    return (0);\n\n    }\n\nHere\
    \ g would be assigned 'a' if the condition (a>b) evaluates to True, else 'b' would\
    \ be assigned to it.\n\n[Switch statements](#contents.xhtml_sc4_121a)\n\nThe switch\
    \ statement in C is a control flow statement that enables us to assess an expression’s\
    \ value and execute various blocks of code in accordance with that evaluation.\
    \ When we have several conditions to consider, it offers an alternative to a long\
    \ list of if-else expressions.\n\nThe values are the forms that the expression\
    \ could take, forming the case of a switch construct. The relevant block of code\
    \ will be run if the expression matches any cases. The default block’s statements\
    \ will be executed if none of the case values matches the expression.\n\nThe evaluation\
    \ of the phrase and subsequent comparison with the case values are how the switch\
    \ construct operates. When a match is found, the case’s code is run after which\
    \ the switch statement should be terminated using the break statement. Please\
    \ refer to the following figure:\n\n![](images/3.2.png)\n\nFigure 3.2: Selection/\
    \ switch logic\n\nThe control will pass to the next case if no break statement\
    \ is found, and the following code  blocks  will likewise be run until a break\
    \ statement is found.\n\nThe switch statement is frequently employed for evaluating\
    \ a discrete set of values. It can be used, for instance, to manage menu selections,\
    \ process several options, or carry out computations based on various inputs.\n\
    \nSyntax: The syntax for a switch statement in C programming language is as follows:\n\
    \nswitch(expression) {\n\ncase constant-expression:\n\nstatement(s);\n\nbreak;\n\
    \ncase constant-expression:\n\nstatement(s);\n\nbreak;\n\n// We can have any number\
    \ of case statements */\n\ndefault:\n\nstatement(s);\n\n}\n\nThe following rules\
    \ apply to a switch statement:\n\n*   The switch statement’s phrase must be of\
    \ an integral type. Enumerated types and integer types like int, char, short,\
    \ and long are included.\n*   The switch statement’s case labels must all be constant\
    \ expressions and cannot be a run-time-evaluable variable or expression.\n*  \
    \ Within the switch statement, each case label must be different. The use of duplicate\
    \ case labels is prohibited.\n*   The default case serves as a general-purpose\
    \ case and is optional. It is executed when none of the case labels match the\
    \ expression’s value. Although it can occur anywhere in the switch statement,\
    \ the default case is usually put at the conclusion.\n*   The relevant code block\
    \ and a colon (:) must come after the case labels. Each case label’s corresponding\
    \ code block may include numerous statements.\n*   A break statement ends the\
    \ switch statement once a case is matched and processed. The control flow will\
    \ move on to the next case without the break statement, maybe executing more than\
    \ one case.\n*   Since there are no more instances to run, a break statement is\
    \ not required in the final case of a switch statement.\n*   There is a chance\
    \ that different case labels will share the same code block. If the expression\
    \ fits any of the shared case labels, the code block will be run in these situations.\n\
    *   Switch statements like other control structures like if-else clauses and loops\
    \ can be nested inside of one other.\n\nThe following examples demonstrate use\
    \ of the switch:\n\n*   Use of switch: output a number (1-5) that the user has\
    \ inputted:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int n;\n\n \
    \   printf(\"Enter a digit from 1 -5\\n\");\n\n    scanf (\"%d\", &n);\n\n   \
    \ switch (n) {\n\n    case 1:\n\n    printf(\"You have entered 1\\n\");\n\n  \
    \  break;\n\n    case 2:\n\n    printf(\"You have entered 2\\n\");\n\n    break;\n\
    \n    case 3:\n\n    printf(\"You have entered 2\\n\");\n\n    break;\n\n    case\
    \ 4:\n\n    printf(\"You have entered 4\\n\");\n\n    break;\n\n    case 5:\n\n\
    \    printf(\"You have entered 5\\n\");\n\n    break;\n\n    default:\n\n    printf(\"\
    Invalid No.\\n\");\n\n    }\n\n    return (0);\n\n    }\n\nSwitch characters\n\
    \nIn C, we may use a char variable in a switch statement. The switch statement\
    \ enables us to evaluate the value of a char variable against various cases and\
    \ run various code blocks depending on which case matches.\n\nWhenever comparing\
    \ character constants, we use single quotes ('') to convey to the compiler that\
    \ it is a constant and not a variable:\n\n#include <stdio.h>\n\nint main () {\n\
    \nchar s;\n\nint a, b;\n\nprintf(\"Press a for addition s for subtraction m for\
    \ multiplication d for division x for modulo division \\n\");\n\nscanf (\"%c\"\
    , &s);\n\nprintf(\"Input 2 Numbers\\n\");\n\nscanf (\"%d%d\", &a, &b);\n\nswitch\
    \ (s) {\n\ncase \"a\":\n\nprintf(\"Sum = %d\", a+b);\n\nbreak;\n\ncase \"s\":\n\
    \nprintf(\"Difference = %d\", a-b);\n\nbreak;\n\ncase \"m\":\n\nprintf(\"Product\
    \ = %d\", a*b);\n\nbreak;\n\ncase \"d\":\n\nprintf(\"Quotient = %d\", a/b);\n\n\
    break;\n\ncase \"x\":\n\nprintf(\"Remainder = %d\", a%b);\n\nbreak;\n\ndefault:\n\
    \nprintf(\"Invalid character\\n\");\n\n}\n\nreturn (0);\n\n}\n\n| Note: Role of\
    \ break: Suppose in the above example user enters ‘a’ which would satisfy case\
    \ ‘a’ and show the sum of a and b. Now, the control should not go to the subsequent\
    \ cases because no other case would be satisfied, this is where BREAK comes in\
    \ handy. It prohibits control to go to the other cases and pushes control outside\
    \ the switch. If no case (was satisfied) was able to break then the default case\
    \ gets executed, hence the default case can be used for performing a ‘task’ which\
    \ should be carried out when none of the cases is true. No break is needed in\
    \ the default case as the control would leave the switch after the default case.\
    \ |\n\nHandling multiple cases\n\nSuppose in the above example’s user enters M\
    \ for male instead of m. Our program would show invalid gender as C is a case\
    \ sensitive language, M and m would be two different entities. Similarly, what\
    \ if user inputs A instead of a for addition, again the case a would not get satisfied.\
    \ To handle such cases, we use multiple cases as shown in the following examples:\n\
    \n*   Handling multiple cases:\n\n    #include <stdio.h>\n\n    int main () {\n\
    \n    char s;\n\n    int a,b;\n\n    printf(\"press a or + for addition s or -\
    \ for subtraction m or * for multiplication d or / for division x or % for modulo\
    \ division \\n\");\n\n    scanf (\"%c\", &s);\n\n    printf(\"Enter 2 Numbers\\\
    n\");\n\n    scanf (\"%d%d\", &a, &b);\n\n    switch (s) {\n\n    case \"a\":\n\
    \n    case \"A\":\n\n    case \"+\":\n\n    printf(\"Sum = %d\", a+b);\n\n   \
    \ break;\n\n    case \"s\":\n\n    case \"S\":\n\n    case \"-\":\n\n    printf(\"\
    Difference = %d\", a-b);\n\n    break;\n\n    case \"m\":\n\n    case \"M\":\n\
    \n    case \"*\":\n\n    printf(\"Product = %d\", a*b);\n\n    break;\n\n    case\
    \ \"d\":\n\n    case \"D\":\n\n    case \"/\":\n\n    printf(\"Quotient = %d\"\
    , a/b);\n\n    break;\n\n    case \"x\":\n\n    case \"X\":\n\n    case \"%\"\
    :\n\n    printf(\"Remainder = %d\", a%b);\n\n    break;\n\n    default:\n\n  \
    \  printf(\"Invalid character\\n\");\n\n    }\n\n    return (0);\n\n    }\n\n\
    Nested switch statements\n\nOne switch statement can be nested within another\
    \ switch statement in C. An example of this is a layered switch, enabling systematic\
    \ management of several levels of decision-making. A layered switch statement\
    \ has the same syntax as a standard switch statement.\n\nNested switch example:\n\
    \n#include <stdio.h>\n\nint main () {\n\nint category, item;\n\nprintf(\"Enter\
    \ category(1-3)\\n\");\n\nscanf (\"%d\", &category);\n\nprintf(\"Enter item (1-3)\\\
    n\");\n\nscanf (\"%d\", &item);\n\nswitch (category) {\n\ncase 1:\n\nswitch (item)\
    \ {\n\ncase 1:\n\nprintf(\"Category 1, Item 1 selected\\n\");\n\nbreak;\n\ncase\
    \ 2:\n\nprintf(\"Category 1, Item 2 selected\\n\");\n\nbreak;\n\ncase 3:\n\nprintf(\"\
    Category 1, Item 3 selected\\n\");\n\nbreak;\n\ndefault:\n\nprintf(\"Invalid item\\\
    n\");\n\n}\n\nbreak;\n\ncase 2:\n\nswitch (item) {\n\ncase 1:\n\nprintf(\"Category\
    \ 2, Item 1 selected\\n\");\n\nbreak;\n\ncase 2:\n\nprintf(\"Category 2, Item\
    \ 2 selected\\n\");\n\nbreak;\n\ncase 3:\n\nprintf(\"Category 2, Item 3 selected\\\
    n\");\n\nbreak;\n\ndefault:\n\nprintf(\"Invalid item\\n\");\n\n}\n\nbreak;\n\n\
    case 3:\n\nswitch (item) {\n\ncase 1:\n\nprintf(\"Category 3, Item 1 selected\\\
    n\");\n\nbreak;\n\ncase 2:\n\nprintf(\"Category 3, Item 2 selected\\n\");\n\n\
    break;\n\ncase 3:\n\nprintf(\"Category 3, Item 3 selected\\n\");\n\nbreak;\n\n\
    default:\n\nprintf(\"Invalid item\\n\");\n\n}\n\nbreak;\n\ndefault:\n\nprintf(\"\
    Invalid category\\n\");\n\n}\n\nreturn (0);\n\n}\n\nIn this example, the user\
    \ enters a category number (1-3) and an item number (1-3). Nested switch statements\
    \ are employed to identify the category and item combination chosen and produce\
    \ the appropriate message. An appropriate error message is given if the entered\
    \ category or item is incorrect.\n\nWe can handle complicated decision-making\
    \ scenarios with several selection layers with nested switch statements. Use switch\
    \ statements sparingly and think about restructuring the code if it gets excessively\
    \ nested because doing so can make the code more difficult to comprehend and maintain.\n\
    \n[Loop statements](#contents.xhtml_sc4_122a)\n\nLooping logic is a fundamental\
    \ idea in programming that permits repeating execution of (a block of) code. Statements\
    \ are typically executed sequentially, and first statement in a function is executed\
    \ followed by the second, and so on. This is known as sequential execution. However,\
    \ programming languages offer various control statements, allowing us options\
    \ for more complex execution paths.\n\nWe may run a statement or set of statements\
    \ repeatedly using a loop statement. In the C programming language, several looping\
    \ constructs are available, including for, while, and do-while loops. These structures\
    \ allow programmers to repeat a sequence of instructions until a predetermined\
    \ condition is satisfied.\n\n[Constituents of a loop](#contents.xhtml_sc4_123a)\n\
    \nIn C, a loop is a programming construct that allows us to repeatedly execute\
    \ a code block if a certain condition is met. The three primary constituents of\
    \ a loop in C are:\n\n*   Initialization: It involves initializing the loop control\
    \ variable(s) before entering the loop. This step is executed only once at the\
    \ beginning of the loop.\n\n    For example:\n\n    int count = 0; // Initialization\n\
    \n*   Condition: The expression that governs whether a loop should continue execution\
    \ or not. A loop will execute a code block if the condition evaluates to true.\
    \ The loop terminates as soon as the condition evaluates to false, and control\
    \ moves to the next set of statements following the loop block.\n\n    For example:\n\
    \n    if (count < 10) // Condition\n\n    {\n\n    // execute a set of C statements\n\
    \n    }\n\n*   Update: Update involves updating the loop control variable(s) after\
    \ each iteration. The update should ideally be performed at the end of each iteration,\
    \ just before re-evaluating the condition. This paves the way for a loop’s termination\
    \ and ensures the loop executes a finite number of times, by updating the loop\
    \ control variable. We can update loop control variable either by incrementing\
    \ it or decrementing it:\n\n    count=count +1\n\n    (also written as count++\
    \ or count+=1, in C)\n\n    // when incrementing by 1\n\n    or count=count +\
    \ 3;\n\n    // when incrementing by 3\n\nIt is imperative to ensure that the condition\
    \ eventually evaluates to false (in collaboration with loop control variable,\
    \ otherwise, the loop may become an infinite loop, which will ultimately cause\
    \ the program to hang.\n\nThe for loop is frequently employed when the number\
    \ of iterations is known ahead of time. Initialization, a condition, and an increment\
    \ or decrement comprise this component. When the condition is met, the loop runs\
    \ the specified block of code; additionally, the increment/decrement operation\
    \ is carried out after each iteration.\n\nWe may encounter situations when a code\
    \ block needs to be executed several times.\n\nC programming language provides\
    \ the following types of loops to handle looping requirements.\n\n[Different loops\
    \ used in C](#contents.xhtml_sc3_124a)\n\nC programming language provides several\
    \ types of loops to control the repetition of a certain block of code. These loops\
    \ include the while loop, do-while loop, and for loop. C programming language\
    \ provides several types of loops to control the repetition of a certain block\
    \ of code.\n\n[While loop](#contents.xhtml_sc4_125a)\n\nIn the C programming language,\
    \ a while loop is a fundamental control structure that enables us to execute a\
    \ block of code if certain condition is true. It offers a versatile method for\
    \ carrying out iterative execution of code and is frequently utilized when the\
    \ precise number of iterations is not known in advance.\n\nWhile loop starts with\
    \ the keyword while followed by a Boolean expression enclosed in parenthesis (),\
    \ a block of one or more statements is then preferably written on the following\
    \ line. The expression in the condition defines whether the loop should keep running\
    \ or come to an end. Before each iteration, it is evaluated, and if it returns\
    \ true, the code block inside the loop is run. When the condition changes to false,\
    \ the loop is ended, and control is transferred to the statement that follows\
    \ the loop. The while loop is frequently used to iterate through arrays or lists,\
    \ validate input, process data, and process data. It offers a lot of versatility\
    \ since We may change the loop control variable(s) inside the loop’s body, enabling\
    \ intricate iteration patterns.\n\nBecause it employs a condition to decide how\
    \ many times the block of code will execute, the while loop is sometimes referred\
    \ to as a condition-controlled loop as, it tests a condition before starting the\
    \ execution of the loop statements.\n\nWhile loop components in C:\n\n*   Condition:\
    \ This Boolean expression decides whether the loop should keep running. If the\
    \ condition evaluates to true, the loop will continue to run. The loop ends and\
    \ control shifts to the statement after it if the condition evaluates to false.\
    \ Each time the loop iterates, the condition is verified. It is possible that\
    \ the loop will not ever run if the condition is originally false.\n*   Loop body:\
    \ The body of the loop is the section of the code that is run repeatedly while\
    \ the predicate is true. The words or actions we want to repeat are in the loop\
    \ body. A single statement or a group of statements might make up the loop’s body\
    \ enclosed in curly braces `{}`.\n*   Update: It entails changing the variables\
    \ or conditions inside the loop’s body to guarantee that it ends eventually. The\
    \ loop control variable or variables are frequently changed during the update\
    \ stage. Typically, the update is included in the loop body and is carried out\
    \ after each iteration, right before the condition is reevaluated:\n\n    while\
    \ (condition)\n\n    {\n\n    // instructions to be executed while the condition\
    \ evaluates to true\n\n    }\n\nSome programming examples:\n\n*   Print numbers\
    \ from 1 to 10:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int i=1;\n\
    \n    while (i<=10)\n\n    { //True, since i=1 which is <10\n\n    printf(\"%d\\\
    t\", i);\n\n    i++; //take next value of i and check while condition again\n\n\
    \    }\n\n    return (0);\n\n    }\n\n*   Find the sum of series:\n\n    #include\
    \ <stdio.h>\n\n    int main () {\n\n    int i=1, s=0;\n\n    while (i<=10)\n\n\
    \    {\n\n    printf(\"%d\\t\", i);\n\n    s=s+i;\n\n    i++;\n\n    }\n\n   \
    \ printf(\"\\nsum of series = %d\", s);\n\n    //sum is to be printed once that's\
    \ why its outside loop\n\n    return (0);\n\n    }\n\n*   Print even numbers from\
    \ 1 to 10:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int i=1;\n\n\
    \    while (i<=10)\n\n    {\n\n    if (i%2 ==0) // if (i%2! =0) to print odd numbers\
    \ from 1 to 10\n\n    printf(\"%d\\t\", i);\n\n    i++;\n\n    }\n\n    return\
    \ (0);\n\n    }\n\n*   Factorial of a given number:\n\n    #include <stdio.h>\n\
    \n    int main () {\n\n    int n, fct =1;\n\n    printf(\"Input a number\\n\"\
    );\n\n    scanf (\"%d\", &n);\n\n    while (n>1)\n\n    {\n\n    fct = fct * n;\n\
    \n    n--;\n\n    }\n\n    printf(\"factorial = %d\\t\", fct);\n\n    return (0);\n\
    \n    }\n\n*   Fibonacci series 0 1 1 2 3 5 8\n\n    #include <stdio.h>\n\n  \
    \  int main () {\n\n    int n1, n2, n3, lmt;\n\n    printf(\"Input Starting Term-1\
    \ and Term-2\\n\");\n\n    scanf (\"%d%d\", &n1, &n2);\n\n    printf(\"Input Limit\
    \ of the series\\n\");\n\n    scanf (\"%d\", & lmt);\n\n    while (n1<=lmt)\n\n\
    \    {\n\n    printf(\"%d\\t\", n1);\n\n    n3 = n1 + n2;\n\n    n1=n2;\n\n  \
    \  n2=n3;\n\n    }\n\n    return (0);\n\n    }\n\n*   Program to find the reverse\
    \ of a number and sum of digits of a number:\n\n    For example:\n\n    n = 1234.\
    \ Reversed n is 4321 and sum of digits =10\n\nHint: When we divide a number by\
    \ 10, remainder gives us the rightmost digit while quotient returns the remaining\
    \ digits of the number 1234% 10 would give us 4, while 1234/10 gives us 123:\n\
    \n#include <stdio.h>\n\nint main () {\n\nint num, rem, s=0;\n\nprintf(\"Input\
    \ a number\\n\");\n\nscanf (\"%d\", &num);\n\nwhile (num>0)\n\n{\n\nrem = num\
    \ % 10;\n\nprintf(\"%d\", rem);\n\n// for num = 123, 3 will be printed, then 2\
    \ and finally 1\n\nnum = num / 10; // the number should be reduced to 12\n\ns\
    \ = s + rem; //if you want to print sum of digits\n\n}\n\nprintf(\"\\nSum of digits\
    \ = %d\", s);\n\nreturn (0);\n\n}\n\n[do...while loop](#contents.xhtml_sc4_126a)\n\
    \nA do-while loop is another control flow construct in the C programming language.\
    \ It enables us to keep executing a code block until certain conditions are met.\
    \ Do-while loop is a variant of a while loop. The do-while loop executes the code\
    \ block at least once before checking the condition. If the condition is true,\
    \ the control keeps executing the block of statement(s), part of the loop. This\
    \ process repeats until the given condition evaluates to false, in contrast to\
    \ the while loop where condition is checked at the start of the loop.\n\nDo-while\
    \ loop’s essential elements:\n\n*   Code block: The loop’s body is the code between\
    \ the curly brackets “{}” It includes the statements that must be executed in\
    \ a loop.\n*   Condition: A Boolean expression known as the loop-condition defines\
    \ whether the loop should continue. Each iteration ends with an evaluation of\
    \ the condition. The loop continues if the condition evaluates to true; otherwise,\
    \ it ends.\n\nThe do-while loop comes in handy when we need to run the loop’s\
    \ body at least once, regardless of the circumstance. The initial iteration is\
    \ the only time the loop condition is examined:\n\ndo {\n\n//set of statements\
    \ to be executed while the condition is true.\n\n} while (condition);\n\nSome\
    \ programming examples:\n\n*   Print numbers from 1 to 10 and find the sum of\
    \ the generated series:\n\n    #include <stdio.h>\n\n    int main () {\n\n   \
    \ int i=1, s=0;\n\n    do\n\n    {\n\n    printf(\"%d\\t\", i);\n\n    s=s +i;\n\
    \n    i++;\n\n    }\n\n    while (i<=10); // in case of do..while, condition is\
    \ terminated by ;\n\n    printf(\"\\nsum of series = %d\",s);\n\n    //Note: sum\
    \ is to be printed only once that's why its outside loop\n\n    return (0);\n\n\
    \    }\n\nAssignment: Do all the above while programs using do while.\n\n| Note:\
    \ You can do all the above (and other programs) using do..while loop by simply\
    \ using a do while loop instead of while loop. Now the question is when should\
    \ you use the do…while loop. Since the do while loop checks the condition at the\
    \ end of the body loop, this means that whether the condition is false the loop\
    \ body would execute at least once, Therefore, use do..while loop when you want\
    \ loop to get executed once, for sure! |\n\nLet us see the following example:\n\
    \n*   To add two numbers (repeatedly, till user wishes to quit):\n\n    #include\
    \ <stdio.h>\n\n    int main () {\n\n    int a, b;\n\n    char c;\n\n    // 2 No's\
    \ are to be added FOR THE FIRST TIME but for subsequent additions, you can ask\
    \ user if he wants\n\n    do\n\n    {\n\n    printf(\"Enter 2 Nos to add \\n\"\
    );\n\n    scanf (\"%d%d\", &a, &b);\n\n    printf(\"sum = %d\", a+b);\n\n    printf(\"\
    \\nPress y to add 2 more numbers\\n\");\n\n    } while (getch() == 'y'); // getch\
    \ is used to input a character\n\n    return(0);\n\n    }\n\n[Table 3.1](#ch03.xhtml_tab3-1)\
    \ shows the difference between while and do-while statements:\n\n| while | do-while\
    \ |\n| Condition tested at the beginning before statements get executed. | Condition\
    \ tested at the exit of the loop after statements are executed (executed at least\
    \ once). |\n| Block of statements may not be executed even once if the condition\
    \ is false. | Block of statements gets executed once even if the condition is\
    \ false. |\n| No semicolon at the end of while. while(condition) | Semicolon at\
    \ the end of while. while(condition) |\n| If there is a single statement, brackets\
    \ are not required. | Brackets are always required. |\n| Variable in the condition\
    \ is initialized before the execution of loop. | Variable may be initialized before\
    \ or within the loop. |\n\nTable 3.1: while vs do-while loop\n\n[For loop](#contents.xhtml_sc4_127a)\n\
    \nA for loop is a fundamental control flow structure in the C programming language\
    \ enabling a programmer to execute block of code a predefined number of times\
    \ or iterate over a sequence of values. The for loop consists of three main components:\
    \ initialization, condition, and update.\n\nThe for loop in C in C require the\
    \ following components to function properly:\n\n*   Initialization: It entails\
    \ setting the loop control variable(s) to their initial values before starting\
    \ the loop. The first time the loop is started, this step is only performed once.\n\
    *   Condition: This expression decides whether the loop should keep running. The\
    \ for-loop will continue to execute if the given condition evaluates to true.\
    \ The loop ends and control shifts to the statement after it if the condition\
    \ evaluates to false.\n*   Update: It entails changing the loop control variable(s)\
    \ following each loop iteration. After each cycle, the update step is carried\
    \ out immediately before re-evaluating the condition. It alters the loop control\
    \ variable, which impacts how the loop functions.\n\nWhen we have a clear setup,\
    \ condition, and update stages, the for loop offers a more condensed syntax for\
    \ looping than the while loop. It is frequently utilized when we know the precise\
    \ number of iterations needed.\n\nfor (initialization; condition; step)\n\n{\n\
    \n//set of statements to be executed while the condition is true\n\n}\n\nFor example:\n\
    \nfor (i=1; i<=10; i++) {\n\nprintf(\"%d\\t\", i); //incrementing loop, because\
    \ step is +ive\n\ni++;\n\n}\n\nHere i is the counter initialized to 1 and counts\
    \ from 1 to 10. Every time condition (i<=10) evaluates to TRUE the loop body is\
    \ executed (and value of i is incremented by 1), so in this example value of i\
    \ would be printed if value of i is less than or equal to 10. Similarly:\n\nfor\
    \ (i=10; i>=1; i--) {\n\nprintf(\"%d\\t\", i);\n\n}\n\nIt would print numbers\
    \ from 10 to 1 and is an example of decrementing loop (step is negative … i--).\n\
    \nIterations of a loop refer to how many times body of a loop got executed (10\
    \ in the above example).\n\nSome programming examples:\n\n*   Print numbers from\
    \ 1 to 10 and find the sum of the generated series:\n\n    #include <stdio.h>\n\
    \n    int main () {\n\n    int i, s=0;\n\n    for (i=1; i<=10; i++)\n\n    {\n\
    \n    printf(\"%d\\t\", i);\n\n    s = s + i;\n\n    }\n\n    printf(\"sum of\
    \ series = %d\", s);\n\n    return (0);\n\n    }\n\n    *   Check if a given number\
    \ is prime:\n\n    Hint: A number (n) is prime if it is perfectly divisible (Remainder=0)\
    \ by 1 and itself. Programmatically, we would divide it by 2, 3, 4………….and n/2.\
    \ If remainder comes out to be 0 every time, then it is a prime number, otherwise\
    \ it is a composite number:\n\n    #include <stdio.h>\n\n    int main () {\n\n\
    \    int i, n;\n\n    printf(\"Input No.\\n\");\n\n    scanf (\"%d\", &n);\n\n\
    \    for (i=2; i<=n/2; i++)\n\n    {\n\n    //n is prime if it is not perfectly\
    \ divisible by any no. between 2 and n/2.\n\n    if (n%i ==0)\n\n    {\n\n   \
    \ printf(\"The given number is composite\");\n\n    exit (0);\n\n    }\n\n   \
    \ }\n\n    printf(\"The given number is Prime\");\n\n    //control reaches this\
    \ point only when the number is prime\n\n    return (0);\n\n    }\n\n*   Factorial\
    \ of a given number:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int\
    \ n, i, f =1;\n\n    printf(\"Input a No.\\n\");\n\n    scanf (\"%d\", &n);\n\n\
    \    for (i=n; i>1; i--)\n\n    {\n\n    f = f* i;\n\n    i--;\n\n    }\n\n  \
    \  printf(\"factorial = %d\\t\", f);\n\n    return (0);\n\n    }\n\n[Loop control\
    \ statements](#contents.xhtml_sc3_128a)\n\nIn C, loop control statements change\
    \ how a loop typically executes. Loop control statements enable us to alter execution\
    \ of a program from its routine sequential execution. They provide us more flexibility\
    \ and control over loops by letting us stop or skip iterations depending on circumstances.\
    \ Break, continue, and goto are C’s three primary loop control statements.\n\n\
    [Break](#contents.xhtml_sc4_129a)\n\nThe break statement is used to control the\
    \ flow of control structures like loops, conditional statements, and branching\
    \ statements. When the break statement is encountered, the program instantly halts\
    \ the control structure’s execution, in which the break has been used, and execution\
    \ moves on to the code that follows the control structure. break statement is\
    \ generally used to terminate loops or switch statements.\n\n*   Break example\
    \ 1:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int i;\n\n    for (i=1;\
    \ i<=10; i++)\n\n    {\n\n    if (i == 2)\n\n    {\n\n    break;\n\n    }\n\n\
    \    printf(\"%d\\t\", i);\n\n    }\n\n    printf(\"\\nbye\");\n\n    return (0);\n\
    \n    }\n\n    Output:\n\n    1\n\n    Bye\n\nIn this program, as soon as condition\
    \ if(i==2) evaluates to true, control will come out of the for loop and the printf()\
    \ instruction will get executed, before ending execution of the main() function.\n\
    \n*   Break example 2:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int\
    \ n1, n2;\n\n    do\n\n    {\n\n    printf(\"Input 2 numbers\\n\");\n\n    scanf\
    \ (\"%d%d\", &n1,&n2);\n\n    if (n2 == 0) {\n\n    printf(\"Cannot Divide by\
    \ Zero\\n\");\n\n    break;\n\n    }\n\n    printf(\"Quotient = %d\\n\", n1/ n2);\n\
    \n    printf(\"Press y to continue\\n\");\n\n    } while (getche()=='y');\n\n\
    \    return (0);\n\n    }\n\nIn this program, if user inputs 0 as the second number,\
    \ the corresponding if statement evaluates to true, break will force control to\
    \ come out of the do-while loop.\n\n[Continue](#contents.xhtml_sc4_130a)\n\nThe\
    \ continue statement is used to go to the next iteration of a loop without running\
    \ the remaining code in the current iteration. The control variable for the loop\
    \ is updated and the loop condition is re-evaluated when the continue statement\
    \ is met. This enables us to skip some iterations depending on criteria.\n\n[Example:](#contents.xhtml_sc4_131a)\n\
    \n#include <stdio.h>\n\nint main () {\n\nint i;\n\nfor (i=1; i<=10; i++)\n\n{\n\
    \n// if i=2, control skips the following instructions and goes to next loop-iteration\
    \ instead\n\nif (i ==2)\n\n{\n\ncontinue;\n\nprintf(\"%d\\t\", i);\n\n}\n\nreturn\
    \ (0);\n\n}\n\nOutput:\n\n1 3 4 5 6 7 8 9 10\n\n[Goto](#contents.xhtml_sc4_132a)\n\
    \nThe goto statement provides an option of an unconditional hop to a labelled\
    \ statement declared inside the same function. It enables us to shift control\
    \ from one location in our code to another location, overriding the usual order\
    \ of execution. However, it is generally better not to use goto instructions often,\
    \ because they might make the code difficult to comprehend and maintain.\n\nLoop\
    \ control statements must be employed judiciously to make sure the code is comprehendible\
    \ and at the same time it remains maintainable. Overuse of loop control statements\
    \ may render the code complex and incomprehensible. If used suitably, these statements\
    \ can provide amicable control and flexibility in the execution of loop controls\
    \ in C.\n\nGoto example\n\n#include <stdio.h>\n\nint main () {\n\nint a, b;\n\n\
    char c;\n\nRepeat: //Label Repeat\n\nprintf(\"Enter 2 Nos to add \\n\");\n\nscanf\
    \ (\"%d%d\", &a, &b);\n\nprintf(\"sum = %d\", a + b);\n\nprintf(\"Press y to add\
    \ 2 more numbers\\n\");\n\nscanf (\"%c\", &c);\n\n}\n\nif (c == 'y')\n\ngoto Repeat;\n\
    \nreturn(0);\n\n}\n\n[Infinite loop](#contents.xhtml_sc4_133a)\n\nIf a condition\
    \ never becomes false in a loop, it executes infinitely. The for loop is typically\
    \ employed for this. The for loop may be made into an unending loop by leaving\
    \ the conditional expression empty since none of the three expressions that make\
    \ up the loop are necessary:\n\n*   Using for loop:\n\n    #include<stdio.h>\n\
    \n    int main (){\n\n    for (; ; )\n\n    {\n\n    printf(\"Example of infinite\
    \ loop\\n\");\n\n    }\n\n    return (0);\n\n    }\n\n*   Infinite loop using\
    \ while ()\n\n    #include <stdio.h>\n\n    int main () {\n\n    while (1)\n\n\
    \    { // 1 here means we made the condition 'explicitly' True\n\n    printf(\"\
    A never ending loop\\n\");\n\n    }\n\n    return (0);\n\n    }\n\n| Note: When\
    \ the conditional expression is absent or we make it explicitly true (1) in case\
    \ of while, it is assumed to be true. We may have an initialization and increment\
    \ expression, but C programmers more commonly use the for (;;) construct to signify\
    \ an infinite loop. |\n\n*   Infinite loop using goto:\n\n    #include <stdio.h>\n\
    \n    int main () {\n\n    rep:\n\n    printf(\"printing a message in infinite\
    \ number of times\\n\");\n\n    goto rep:\n\n    return (0);\n\n    }\n\nIn the\
    \ above example, goto statement sends control to the rep label, which causes the\
    \ loop to repeat indefinitely.\n\n| Note: We can terminate an infinite loop by\
    \ pressing Ctrl + C keys. |\n\n[Nested loop](#contents.xhtml_sc4_134a)\n\nSometimes\
    \ we may have to use a loop inside another loop’s body which is known as the nested\
    \ loop.\n\nThe degree of nestedness in programming refers to how deeply one construct\
    \ (loop in this case) is nested inside another construct. In C, the level of nesting\
    \ of loops is typically referred to as the degree of nestedness. For instance,\
    \ a loop inside another loop has a nestedness level of 2, whereas a loop inside\
    \ another loop inside another loop has a nestedness level of 3:\n\nSyntax:\n\n\
    Outer loop {\n\nInner loop()\n\n{ //we can have a number of them\n\n//Set of statements\
    \ of inner loop\n\nInnermost loop()\n\n{\n\n// Set of statements of innermost\
    \ loop\n\n}\n\n}\n\n}\n\nFor example:\n\nfor (i=1; i<=10; i++)\n\n{\n\nfor (j=1;\
    \ j<=10; j++)\n\n{\n\n//set of statements to be executed…here executed 100 times\n\
    \nprintf(\"Hello world\\t\");\n\n}\n\n}\n\n| Note: For every outer loop iteration,\
    \ the inner loop takes all iterations. In the above example: |\n\nWhen i is 1\
    \ j takes the values 1,2,3…..10\n\nThen i becomes 2 and j again takes the values\
    \ 1,2,3…..10\n\nSome programming examples:\n\n*   Print the tables of 1 to 10\
    \ using nested loop:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int\
    \ i, j;\n\n    for (i=1; i<=10; i++)\n\n    {\n\n    for (j=1; j<=10; j++)\n\n\
    \    {\n\n    //when i is 1, table of 1 would be printed i*1, i*2, i*3\n\n   \
    \ printf(\"%d\\t\", i*j);\n\n    }\n\n    printf(\"\\n\"); //change line to print\
    \ next table on new line\n\n    }\n\n    return (0);\n\n    }\n\n| Note: In the\
    \ programs where we need to print tabular patterns, outer loop manages the rows\
    \ and the inner one manages the columns. In the above example, there are 10 rows\
    \ and 10 columns, which is why the outer loop’s limit is 10 and so is the limit\
    \ for the inner loop. |\n\n*   Print the following pattern:\n\n    *\n\n    *\n\
    \n    * *\n\n    * * *\n\n    * * * * *\n\n    #include <stdio.h>\n\n    int main\
    \ () {\n\n    int i, j;\n\n    for (i=1; i<=5; i++) // 5 rows\n\n    {\n\n   \
    \ for (j=1; j<=I; j++)\n\n    { //No. of columns in each row= i\n\n    printf(\"\
    \ * \");\n\n    }\n\n    printf(\"\\n\");\n\n    } //line is changed to print\
    \ stars on different lines\n\n    return (0);\n\n    }\n\n*   Print prime series:\n\
    \n    #include<stdio.h>\n\n    int main () {\n\n    int n, i, f;\n\n    for (n=10;\
    \ n<=100; n++)\n\n    { //Generates numbers from 10 – 100\n\n    f=0; // for every\
    \ number f=0\n\n    for (i=2; i<=n/2; i++)\n\n    {\n\n    if (n%i ==0)\n\n  \
    \  {\n\n    f=1;\n\n    //Make f=1 when n is divisible by any value of i\n\n \
    \   break;\n\n    }\n\n    }\n\n    if (f==0)\n\n    //n was never perfectly divisible\
    \ i. Hence n is prime, print it.\n\n    printf(\"%d\\t\", n);\n\n    }\n\n   \
    \ return (0);\n\n    }\n\n*   Print 1¹ + 2² + 3³ + 4⁴ + ……….+ n^n :\n\n    Before\
    \ doing this program you can try the program to find base to power  of a number.\n\
    \n    #include <stdio.h>\n\n    int main () {\n\n    int n, i, j, c, s=0;\n\n\
    \    printf(\"Input limit\\n\");\n\n    scanf (\"%d\", &n);\n\n    for (i=1; i<=n;\
    \ i++)\n\n    { //Generates numbers from 1 to n\n\n    c=1;\n\n    for (j=1; j<=i;\
    \ j++)\n\n    {\n\n    c = c * i;\n\n    }\n\n    s = s + c;\n\n    }\n\n    printf(\"\
    Sum of series = %d\", s);\n\n    return (0);\n\n    }\n\n*   Print 1! + 2! + 3!\
    \ + 4! + ………. + n!:\n\n    #include <stdio.h>\n\n    int main () {\n\n    int\
    \ n, i, f, j, s=0;\n\n    printf(\"Input limit\\n\");\n\n    scanf (\"%d\", &n);\n\
    \n    for (i=1; i<=n; i++)\n\n    { //Generates numbers from 1 to n\n\n    f=1;\
    \ // initialize f to 1\n\n    for (j=i; j>1; j--)\n\n    {\n\n    f = f * j;\n\
    \n    }\n\n    // use printf function if you wish to print factorial 'f' of every\
    \ number\n\n    s = s + f;\n\n    }\n\n    printf(\"Sum of series = %d\", s);\n\
    \n    return (0);\n\n    }\n\n*   Check for Armstrong number, the sum of cubes\
    \ of digits of the number = the number itself for example: 153 is an Armstrong\
    \ number, because 13 +53 + 33 = 153:\n\n    #include <stdio.h>\n\n    int main\
    \ () {\n\n    int n, i, f, s=0, b;\n\n    clrscr ();\n\n    printf(\"Enter n\\\
    n);\n\n    scanf (\"%d\", &n);\n\n    i=n;\n\n    while (i>0)\n\n    {\n\n   \
    \ b=i % 10; //get right most digit\n\n    f=1; // for every number f=0\n\n   \
    \ for (j=1; j<=3; j++)\n\n    { // find cube of the digit b\n\n    f = f * b;\n\
    \n    }\n\n    s = s + f;\n\n    i= i /10;\n\n    }\n\n    printf(\"sum of series\
    \ = %d\", s);\n\n    return (0);\n\n    }\n\n[Conclusion](#contents.xhtml_sc2_135a)\n\
    \nIn summary, this chapter has provided a comprehensive exploration of foundational\
    \ programming constructs that enable precise control over program flow and informed\
    \ decision-making within the realm of C programming. Beginning with an examination\
    \ of control statements, we moved on to discuss decision-making statements, including\
    \ the adaptable if-else and switch constructs. We also delved into strategies\
    \ for managing diverse scenarios and introduced essential looping structures like\
    \ while, do-while, and for loops.\n\nEquipped with this knowledge, readers are\
    \ now well-prepared to orchestrate program execution and navigate intricate decision\
    \ points in their C programs. As we conclude this chapter, it serves as both a\
    \ culmination of our study and a launchpad for further mastery in shaping program\
    \ flow and logical choices within the C programming paradigm.\n\n[Exercise](#contents.xhtml_sc2_136a)\n\
