    \ numbers, integers, characters, and so on, using variables. Throughout the course\
    \ of a program’s execution, variables can be utilized for storing and handling\
    \ data. The value stored in a variable can be changed during the execution of\
    \ a program.\n\n[Variable declaration](#contents.xhtml_sc4_69a)\n\nVariable declaration\
    \ in C programming is the process of defining a variable’s name and data type\
    \ before it is used to store values. It provides the compiler with information\
