    *   结构化编程被设计为一组组织代码的僵化规则。这使得代码更具可预测性且更容易维护，但它使其灵活性降低，且难以适应不断变化的需求。

    *   随着程序复杂性的增加，结构可能会变得更加复杂，导致调试、测试和维护的困难。

    *   结构化编程并非为处理非线性控制流而设计。例如，如果你想从程序的一个部分跳转到另一个部分，在结构化编程范式中可能是困难的。

    *   结构化编程要求将代码组织成函数和模块，这可能导致代码重复。在处理具有许多模块和函数的大型程序时，这个问题可能尤为严重。

    *   结构化编程可能导致代码紧耦合，难以在其他项目中复用，从而导致重复工作以及项目之间缺乏一致性。


    ## 面向对象编程


    切换到面向对象编程（OOP）这样一种新范式的动机，是为了消除过程化/模块化方法中固有的某些缺陷。OOP 将数据视为程序开发中的一个关键组件，并不允许其在系统中任意流转。它确保数据与其操作它的函数紧密结合，并保护其免受外部函数的意外修改。在面向对象编程中，对象是类的实例，包含数据和行为，并可以通过方法与其他对象进行交互。`Figure
    1.6` 展示了面向对象程序中数据和方法（函数）是如何组织的。只有与该对象相关的函数才能访问该对象的数据。然而，一个对象的函数可以访问另一个对象的函数。


    ![](img/1.6.png)


    图 1.6: 面向对象编程


    ### 面向对象编程的特征：

    *   数据结构包含了所有处理对象数据的函数。

    *   数据是隐藏的，外部函数无法访问。

    *   对象之间通过函数进行通信。

    *   任何时候需要新信息或新功能，都可以快速添加。

    *   OOP 使用自底向的方法来设计程序。


    ## 算法


    算法是一系列在正确遵循时可以解决特定计算机问题的指令。算法是一个过程，被表述为一系列阶段，并规定了一组必须遵循的指令以获得预期的结果。算法被称为与语言无关，因为它们可以在任何计算机语言中实现。算法不遵循严格的语法（与编写计算机程序不同），因为它不是在计算机上执行的。设计算法的实践主要用于设计或理解的目的。一旦借助算法预见到设计，就可以使用任何编程语言来实现该算法。


    ### 算法的特征

    算法应该具有以下特征：

    *   算法必须有零或多个输入（也称为信息或数据）进行处理以实现功能。

    *   算法必须至少有一个输出，即输入处理后生成的信息或结果。

    *   算法必须包含一组精确的、易于理解和执行的指令，以产生预期的结果。算法在每个阶段都必须明确定义，没有解释解释的空间。

    *   算法必须是有限的，这意味着它必须在设定的步数后结束，而不是无限持续或无限循环。

    *   算法必须在合理的时间内以可接受的资源消耗解决其创建时要解决的问题。

    *   算法必须足够宽泛，能够处理各种输入数据，而不仅仅是某一小子集。

    *   算法必须在现有资源和技术支持下是可实现的，才能被认为是实用的。


    ### 编写算法

    编写算法没有定义良好的标准（如上所述）。原因之一是，由于我们不需要在计算机上运行算法（这需要适当的编写方式，即语法），用户可以选择如何编写它，而且它是针对特定问题的。


    基础编码特征如重复语句、条件语句等是所有编程语言所共有的。我们可以设计一个通用的算法，稍后可以使用任何编程语言实现。算法通常以逐步格式编写；但情况并非总是如此。在问题领域定义清楚后，就可以为该问题制定算法的过程。总之，我们可以说我们在以后需要关注当前的问题并构建解决方案。


    此外，程序的执行方式应分为三种：

    *   顺序语句

    *   选择语句

    *   迭代或循环语句


    #### 顺序语句

    算法步骤一个接一个地顺序执行。


    以下是相同要求的的一些示例：


    **打印欢迎消息的算法：**

    1. 开始

    2. `output "Hello world"`

    3. 停止


    **两个数相加的算法：**

    1. 开始

    2. 输入 `num1` 和 `num2`

    3. `sum = num1 + num2`

    4. `output sum`

    5. true

    该算法以两个数字（`num1` 和 `num2`）作为输入，将它们相加并输出它们的和。


    **求两个数平均值的算法：**

    1. 开始

    2. 输入 `num1` 和 `num2`

    3. `sum = num1 + num2`

    4. `avg = sum/2`

    5. `output avg`

    6. 结束

    该算法以两个数字（`num1` 和 `num2`）作为输入，将它们相加，将和除以 2（输入值的个数），并输出平均值。


    **两个数相减的算法：**

    1. 开始

    2. 输入 `num1` 和 `num2`

    3. `diff = num1 - num2`

    4. `output diff`

    5. 结束

    该算法以两个数字（`num1` 和 `num2`）作为输入，从第一个数中减去第二个数，并输出差。


    **两个数相乘的算法：**

    1. 开始

    2. 输入 `num1` 和 `num2`

    3. `product = num1 * num2`

    4. `output product`

    5. 结束

    该算法以两个数字（`num1` 和 `num2`）作为输入，计算它们的积并输出乘积。


    **除法算法：**

    1. 开始

    2. 输入 `num1` 和 `num2`

    3. `quotient = num1 / num2`

    4. `output quotient`

    5. 结束

    该算法以两个数字（`num1` 和 `num2`）作为输入，将第一个数除以第二个数，并输出商。


    **求圆面积的算法：**

    1. 开始

    2. 输入 `r`

    3. `area = 3.14 * r * r`

    4. `output area`

    5. 停止

    该算法以圆的半径（`r`）作为输入，并根据公式计算圆的面积。请记住，我们不需要输入周率的值（`3.14`），因为因为它是一个常量。


    **求矩形面积的算法：**

    1. 开始

    2. 输入 `L` 和 `B`

    3. `area = L * B`

    4. `output area`

    5. 停止

    该算法以矩形的长度（`L`）和宽度（`B`）作为输入，并根据公式计算矩形的面积。


    在上述示例中，所有的指令/步骤都是一个接一个执行的。这些示例遵循顺序执行模式。


    #### 选择语句

    选择语句算法是一种允许计算机根据某些条件或标准做出决策的计算机程序。以下是选择语句算法的一些示例：

    *   if-else 语句：if-else 语句是一种条件语句，当满足特定条件时执行某块代码，当条件不满足时执行另一块代码。例如：


    ```

    if age >= 18

    output "You are an adult."

    else:

    output "You are not an adult yet."

    ```


