    ### Iterative statements


    Iterative algorithms are a class of algorithms that solve problems by repeatedly
    refining an initial estimate or solution until a desired level of accuracy or
    convergence is achieved. These algorithms are particularly useful when it is difficult
    or impossible to obtain an exact solution to a problem using analytical methods.


    Iterative algorithms can be very efficient for solving certain types of problems,
    but they can also be computationally expensive if the number of iterations required
    to converge is very large. Choosing an appropriate stopping criterion and optimizing
    the algorithm’s parameters can help to minimize the computational cost of iterative
    algorithms.


    In iterative statements, we start from an initial value (initialization) and add
    (increment) or subtract (decrement) a value to the initial value with each iteration
    and try to reach a final value (limit).


    ### Algorithm to print natural numbers up to n:


    1. Start

    2. input `L`

    3. `i = 1`

    4. `if i > L`, then go step 8

    5. output `i`

    6. Increment value of `i` by 1

    7. Go to step 4

    8. Stop


    In this algorithm, we try to generate a series from 1 to a given limit (`L`).
    step 4 checks whether the value of `i` (which acts as a counter in this example)
    is within the bounds (< L). If so, the value of `i` is printed and incremented
    by `i` before the condition at step 4 is again checked. Once the condition at
    Step 4 fails, control goes to Step 8, which marks the end of the algorithm.


    Please note that for values of `L` greater than 1, Steps 4, 5, 6, and 7 are executed
    more than once.


    ## Algorithm efficiency


    Algorithm efficiency refers to the measure of the computational resources required
    by an algorithm to solve a given problem. The efficiency of an algorithm is typically
    measured in terms of its time complexity and space complexity.


    Time complexity is a measure of the number of operations performed by an algorithm
    as a function of the size of its input. The time complexity of an algorithm is
    usually denoted by the big-O notation, which gives an upper bound on the growth
    rate of the number of operations as the input size increases.


    Space complexity, on the other hand, is a measure of the amount of memory required
    by an algorithm as a function of the size of its input. Space complexity is also
    typically expressed using big-O notation.


    Efficient algorithms are those that have low time and space complexity, meaning
    they can solve problems quickly and with minimal use of memory. In practice, the
    efficiency of an algorithm can have a significant impact on the performance of
    a software system, particularly for large-scale or real-time applications. Developers
    use various techniques to optimize algorithms, including analyzing the problem’s
    structure to identify the most time - and memory-consuming operations, implementing
    data structures that minimize search and update time, and parallelizing the computation
    across multiple processors or nodes. It is important to choose an algorithm that
    is appropriate for the size and nature of the problem at hand and to optimize
    the implementation of the algorithm to achieve the desired level of efficiency.


    ## Importance of algorithmic efficiency


    The number of resources a computer uses to process an algorithm may be used to
    determine algorithm efficiency. An effective algorithm uses the least number of
    resources possible to carry out its tasks. An algorithm’s effectiveness is evaluated
    to make sure it operates without hitches or mistakes. It is doubtful that inefficient
    algorithms will result in satisfactory outcomes.


    ## Algorithm time complexity cases


    The complexity of an algorithm is influenced by several variables, including the
    comparisons and data processing. For instance, throughout the execution of an
    algorithm, we may count the number of times data is transported and a key (value)
    is compared. There are three different time complexities that may be considered
    when assessing an algorithm’s complexity:


    * Best case complexity

    * Average case complexity

    * Worst-case complexity


    The best case means when the algorithm performs the best, the worst case scenario
    is when the algorithm performs the worst, and the average case lies between the
    two extremes. For example, an algorithm that searches a given value in a list
    (array). The best case may be when the value to be searched is found at the beginning
    of the list, and we do not have to go far to find it. The worst case would be
    if we found the value at the end of the list or could not find the value (in that
    case, we also have to traverse the whole list). The average case is when the given
    value is found somewhere in between the list of values.


    ### Algorithm efficiency (Summary)


    The efficiency of an algorithm is a cumulative end-product of two stages:


    * Theoretical analysis

    * Benchmarking


    ### Theoretical analysis


    The method of asymptotically (arbitrarily) approaching a value while performing
    theoretical analysis is to approximate the complexity of an algorithm. Big-O notation,
    created by Donald Knuth, is the most popular method of expressing how many resources
    an algorithm needs.


    ### Benchmarking


    Standards are used to assess an algorithm’s performance while evaluating its efficiency.
    This helps to compare an algorithm’s efficiency to that of its competitors. For
    instance, we may assess a sorting algorithm’s effectiveness against standards
    established by a different sorting algorithm. Analysts can compare algorithm speed
    using benchmarking to see whether there is room for improvement.


    ## Implementation challenges


    Performance can be impacted when assessing space and time complexity by variables
    such as the processor (parallel processing), instruction set utilized by a processor,
    cache locality, multi-threading, and multitasking, regardless of the programming
    language or the way the algorithm is designed. It is possible for implementation
    issues to arise due to the processor, instruction set, programming language, and
    other elements, giving programmers a headache.


