    \ code?\n\n    #include <stdio.h>\n\n    #define CUBE(x) x * x * x\n\n    int\
    \ main()\n\n    {\n\n    int result = CUBE(3);\n\n    printf(\"Result: %d\\n\"\
    , result);\n\n    return(0);\n\n    }\n\n12.  How do you use the #error directive?\n\
