- fmt: "\n# Input: A computer receives information and commands from input devices\
    \ such as keyboards, mice, touchscreens, or storage units. User inputs are transformed\
    \ via input devices into a language that a computer can understand.\n\nProcessing:\
    \ The `CPU`, sometimes referred to as the brain of the computer, is responsible\
    \ for calculations and data handling. The `CPU` retrieves instructions from memory,\
    \ decodes, processes, and finally saves the finished products back in memory.\n\
    \nMemory: The memory of the computer houses the information and instructions that\
    \ the `CPU` needs to process data. Memory comes in various forms, including `RAM`,\
    \ which is used for short-term storage, and storage technologies like hard drives\
    \ or `SSDs`, which are used for long-term storage.\n\nALU: `ALU` is a part of\
    \ the `CPU` that conducts arithmetic operations on data, such as addition and\
    \ subtraction, as well as logical operations, such as `AND`, `OR`, and `NOT`.\n\
    \nControl unit: The control unit oversees how orders are carried out. It obtains\
    \ instructions, decodes them, and controls how the other components behave.\n\n\
    Output: Processed data is transferred to output devices, including displays, printers,\
    \ speakers, and storage devices, so that people may see or utilize it.\n\nStorage:\
    \ Long-term storage gadgets like hard drives or `SSDs` keep data even when the\
    \ computer is off. For later usage, data may be saved and retrieved.\n\nExecution\
    \ cycle: The computer functions in a succession of fetch-decode-execute cycles\
    \ that are referred to as execution cycles. A memory command is retrieved and\
    \ decoded to reveal the operation carried out, and the outcome is subsequently\
    \ stored.\n\nOperating system: The operating system controls hardware resources,\
    \ presents user interfaces, and enables seamless operation of programs. It makes\
    \ hardware and software communication easier.\n\nSoftware and apps: Software programs,\
    \ such as operating systems and apps, give instructions to the computer on how\
    \ to carry out certain activities.\n\nApplication software enables users to carry\
    \ out a variety of functions, including word processing, gaming, and internet\
    \ surfing.\n\nCommunication: Using communication interfaces, such as network adapters\
    \ or wireless connections, computers may communicate with other hardware and networks.\n\
    \nFeedback loop: The computer program repeatedly repeats these stages, reacting\
    \ to human input and carrying out the requested actions.\n\nThis is only a high-level\
    \ overview, and the actual functioning of a contemporary computer entails numerous\
    \ minute details and sophisticated interactions between hardware and software\
    \ components. To understand how computers absorb information and carry out tasks,\
    \ one must first understand this fundamental framework.\n\n## Computer system\n\
    \nHardware and software are the two main parts of a computer system. The physical\
    \ component is the computer hardware, and the software is a group of programs\
    \ (instructions) that enable the hardware to function.\n\nThe components of the\
    \ computer system are:\n\n* Hardware\n* Software\n\n`Computer system = Hardware\
    \ + Software + User`\n\n* All physical parts of the computer (or everything that\
    \ we can touch) are known as `Hardware`.\n* `Software = Programs that give intelligence\
    \ to a computer.`\n* `User = Person who operates a computer.`\n\n## Hardware\n\
    \nComputer hardware refers to the physical components of a computer, which include\
    \ the following:\n\n* `CPU`: The `CPU` is the brain of the computer and performs\
    \ all the calculations and processing required to run applications and programs.\n\
    * `Memory`: Memory, also known as Random Access Memory (`RAM`), stores data and\
    \ instructions that the `CPU` needs to access quickly.\n* `ROM`: A form of computer\
    \ memory called Read-Only Memory (`ROM`) is used to store permanent or semi-permanent\
    \ data and instructions that are necessary for a computer system to operate properly.\
    \ Unlike volatile and transient `RAM`, `ROM` keeps its data even when the power\
    \ is turned off. `ROM` is essential for starting the computer up and initializing\
    \ its hardware.\n* `Hard drive`: The hard drive stores all the data and programs\
    \ on a computer. It is where the operating system, applications, and user files\
    \ are stored.\n* `Motherboard`: The motherboard is the main circuit board of a\
    \ computer, and it connects and controls all the other components of the computer.\n\
    * `Power Supply Unit`: The `PSU` converts AC power from the wall outlet into DC\
    \ power that can be used by the computer’s components.\n* `Graphics Processing\
    \ Unit`: The `GPU` is responsible for rendering images and videos on the computer’s\
    \ monitor.\n* `Sound card`: The sound card is responsible for providing audio\
    \ output from the computer.\n* `Optical drive`: The optical drive is used to read\
    \ and write CDs, DVDs, and Blu-ray discs.\n* `Keyboard and mouse`: The keyboard\
    \ and mouse input data and commands into the computer.\n* `Monitor`: The monitor\
    \ displays the output from the computer’s `GPU`.\n\nThese components work together\
    \ to enable a computer to perform various tasks, from basic word processing to\
    \ complex video editing and gaming. Understanding the different components of\
    \ a computer’s hardware is essential for building and upgrading a computer and\
    \ troubleshooting possible issues.\n\n## Software\n\nComputer software refers\
    \ to instructions or programs that tell a computer what to do. It is a collection\
    \ of programs, data, and other instructions that enable a computer to perform\
    \ various tasks and operations.\n\nThere are two main types of software: system\
    \ software and application software.\n\n* `System software`: This is the software\
    \ that enables the computer to operate and manage its hardware components. Types\
    \ of system software include:\n    * `Operating systems`: Such as Windows, `macOS`,\
    \ `Linux`, and Android.\n    * `Device drivers`: These programs enable the computer\
    \ to communicate with peripheral devices such as printers, scanners, and cameras.\n\
    \    * `Utilities`: These programs help users maintain and optimize their computers,\
    \ such as antivirus software, disk cleaners, and backup software.\n* `Application\
    \ software`: This software is designed to perform specific tasks or applications\
    \ for users. Types of application software include:\n    * `Productivity software`:\
    \ Software like word processing, spreadsheet, and presentation software used for\
    \ business, education, and personal purposes.\n    * `Multimedia software`: Software\
    \ like video editing, audio editing, and image editing software used for creative\
    \ purposes.\n    * `Gaming software`: Software such as video games and gaming\
    \ platforms used for entertainment purposes.\n    * `Web browsers`: Browsers like\
    \ Google Chrome, Mozilla Firefox, and Microsoft Edge are used to access the internet\
    \ and browse websites.\n\nComputer software is a critical component of modern\
    \ computing, enabling computers to perform various tasks and operations. Advances\
    \ in software technology have enabled computers to become increasingly powerful,\
    \ versatile, and capable of handling complex tasks, making them an essential tool\
    \ in many areas of our lives.\n\nApplication software can be of two main categories:\n\
    \n* `Custom-built software`\n* `Packaged software`\n\n### Custom-built software\n\
    \nSoftware specially created and developed to satisfy the distinct demands and\
    \ requirements of a single business or person is called custom-built. It offers\
    \ substantial functionality, performance, and usability advantages compared to\
    \ off-the-shelf software, which is pre-designed and available for purchase. A\
    \ group of software engineers and developers usually creates custom software after\
    \ closely communicating with the customer to comprehend their needs and goals.\
    \ The development process often includes the requirements collecting, design,\
    \ programming, testing, and deployment phases.\n"
