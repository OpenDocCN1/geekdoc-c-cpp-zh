    \ gives an account of standard types with their storage capacities and the range\
    \ of values they can store:\n\n| Serial Number | Type | Size (in bytes) | Range\
    \ |\n\n|  | Unsigned char | 1 | 0 to 255 |\n\n|  | signed char or char | 1 | -128\
    \ to +127 |\n\n|  | unsigned int | 2 | 0 to 65535 |\n\n|  | signed int or int\
    \ | 2 | -32,768 to +32767 |\n\n|  | unsigned short int | 2 | 0 to 65535 |\n\n\
    |  | signed short int or short int | 2 | -32,768 to +32767 |\n\n|  | unsigned\
