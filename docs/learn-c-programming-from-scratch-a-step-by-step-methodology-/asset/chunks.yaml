    # CHAPTER 2 C Programming Fundamentals


    ### Introduction


    Dennis M. Ritchie conceived the high-level, general-purpose language C to create
    the UNIX operating system at Bell Labs. On the DEC PDP-11 computer, C was first
    introduced in 1972.


    The K and R standard, recognized as the first publicly accessible definition of
    C, was created in 1978 by Brian Kernighan and Dennis Ritchie. The C programming
    language was used to build the UNIX operating system, the C compiler, and practically
    all UNIX application programs. The C is still a popular programming language because
    of the following reasons:


    * It is easy to learn.

    * It is a structured language.

    * We can design efficient programs using C.

    * It handles low-level activities.

    * Programs written in C can be compiled on various computer platforms.


    ### Structure


    The chapter covers the following topics:


    * Facts about C

    * C program components

    * Tokens in C

    * Data types

    * Variables

    * Integers data types

    * Literals

    * Storage class

    * Operators

    * Input-output in C

    * Write basic programs in C


    ### Objectives


    This chapter aims to provide a comprehensive understanding of the C programming
    language, its components, and its practical applications. We will begin by exploring
    important facts about C and its relevance in modern programming. The chapter will
    then focus on Turbo C++, a popular development environment for Windows 10 and
    beyond, guiding setting up and utilizing this platform. We will dive into the
    fundamental components of C programs, including tokens, data types, variables,
    and literals. Additionally, we will examine the concept of storage classes and
    the wide range of operators available in C. With a strong foundation established,
    we will learn about input-output operations in C and provide hands-on experience
    by writing basic programs. By the end of this chapter, readers will have a solid
    understanding of C programming, enabling them to develop functional and efficient
    programs using the language.


    ### Facts about C


    The widely used programming language C has a long history and a wide range of
    capabilities. The following are some facts about C programming:


    * Dennis Ritchie at Bell Labs developed C in the early 1970s as a programming
    language for the Unix operating system.

    * Since C is a compiled language, the source code is converted into machine code
    that a computer can use to run it.

    * Thanks to its low-level capabilities, programmers may modify hardware and memory
    directly by writing code in high-level C.

    * C is easy to learn and read because of its syntax and sparse use of keywords.

    * Device drivers, operating systems, embedded systems, and other types of low-level
    software frequently employ C.

    * A robust standard library for C, including functions for input/output, memory
    management, string manipulation, and other things.

    * The object-oriented and structured programming paradigms are both supported
    in C.

    * Due to its low-level features and standardized libraries, C programs may be
    very portable across several systems.

    * C++, Java, and Python are just a few programming languages impacted by C.

    * Despite its antiquity, C is still widely used today, and many software engineers
    believe it to be a ability.


    ### Uses of C programming language


    C was first employed for system development, including creating the operating
    system. Since C produces code that executes almost as quickly as assembly language,
    it was adopted as system development language. Several uses for C could include:


    * Design of operating systems.

    * Design of assemblers and compilers.

    * Development of text editors.

    * Designing network drivers.

    * Formulation of databases.

    * Design of language interpreters.

    * Design of utilities.


    ### Life cycle of a C program


    A C program’s life cycle may be broken down into many phases, each of which has
    a specific role in the creation, use, and maintenance of the program, as depicted
    in Figure 2.1:


    ![](images/Figure_2.1.png)


    Figure 2.1: Phases of a program


    #### Writing the source code

    Computer programs are written using English-like high-level programming languages,
    like C/C++. But computers cannot understand these programs written in high-level
    languages. Instead, it can understand only low-level language like machine language.
    We write our C using a text editor or an Integrated Development Environment (IDE).


    #### Preprocessing

    The preprocessor handles and processes directives. In this stage, operations like
    file inclusion `#include`, macro expansion `#define`, and more are performed.
    The preprocessed source code is the result of this stage.


    #### Compilation

    The compiler converts the preprocessed source code into assembly language or another
    transitional representation. The compiler creates object code while examining
    the code’s grammar and semantics. The compiler will alert us of any syntactic
    mistakes.


    #### Linking

    The linker creates an executable file by combining the object code, the compiler
    produced with any required external functions or libraries we may access from
    other files.


    #### Loading

    The operating system loads the executable file into memory, which also allots
    the required resources. Now that the program is ready, it can be run.


    #### Execution

    At this stage, the processor goes through each instruction in the program one
    at a time and performs actions as specified by these instructions in collaboration
    with the operating system.

