    \ takes the length (L) and breadth (B) of a rectangle as input and calculates\
    \ the area of the rectangle as per the formula.\n\nIn the above-mentioned examples,\
    \ all the instructions/ steps are executed one after the other. These examples\
    \ follow a sequential pattern of execution.\n\nSelection statements: A selective\
    \ statement algorithm is a computer program that allows a computer to make decisions\
