    在 Windows 操作系统上执行 C 程序（本书介绍的示例是在 Windows 平台上执行的），我们需要安装如 `Turbo C`、`Dev C++`、`NetBeans`、`Code::Blocks`
    等软件/IDE。


    ## 集成开发环境


    我们使用 IDE 来编写程序代码。它通过提供程序设计所需的全面服务，帮助程序员轻松设计程序。在各种工具的帮助下，IDE 提高了程序员的效率。使用 IDE，我们可以对程序进行运行、调试、文档化、执行和翻译。


    主要，一个 IDE 包含三个部分：


    *   源代码编辑器：用于编写源代码/指令。

    *   自动化工具：用于编译源代码。

    *   调试器：用于消除代码中的错误/缺陷。


    IDE 具有对象和数据建模、测试和源代码库等功能。目前，多种编程语言都有 IDE，包括 C 语言。许多 IDE 甚至具有智能代码补全选项，可以丰富程序员的体验。让我们讨论一些你可能用于
    C 语言编码的 IDE。


    ## GCC


    自由软件基金会了 `GCC` 编译器，它通常通过命令行界面使用并基于 Linux。如果我们使用 UNIX 或 Linux 变体，它可能已经安装在我们的机器上了，因为它经常与
    Linux 安装包一起安装。我们可以通过输入 `gcc filename` 对源代码文件调用 `GCC`。


    `GCC` 的默认可执行输出是 `a.out`，可以通过输入 `./a.out` 执行。也可以在命令行通过编写 `-o outputfile` 为可执行文件指定名称，如下：


    ```

    gcc filename -o outputfile

    ```


    再次，可以使用 `./outputfile` 来执行你的程序。（`./` 确保程序在当前工作目录执行）。如果我们需要使用数学库中的函数（通常是 `math.h`
    函数，如 `sin` 或 `sqrt`），则必须专门要求它连接该库。


    注意：如果我们需要使用数学库中的函数（通常是来自 `math.h` 的函数，如 `sin` 或 `sqrt`），则你需要通过 `-l` 标记和库 `m` 显式要求它链接该库：`gcc
    filename -o outputfile -lm`。


    ## Visual Studio Code


    Visual Studio Code (`VS Code`) 是一个很好的 C 语言 IDE，因为它具有强大的功能、庞大的扩展库和跨平台兼容性。在 `VS
    Code` 中通过适当的插件和配置，可以创建一个复杂的 C 语言编程环境。参考下面的 [图 2.2] 查看 VS Code IDE：


    ![](img/Figure_2.2.png)


    图 2.2：VS Code IDE


    `VS Code` 是一个适用于多种编程语言（包括 C）的流行代码编辑器。`VS Code` 的以下特征使其成为 C 编程的理想选择：


    *   IntelliSense：在编写 C 代码时，`VS Code` 的智能代码补全系统 (`IntelliSense`) 通过建议代码片段和函数定义节省了我们的时间。

    *   调试：`VS Code` 强大的调试机制可以帮助你定位并解决 C 程序中的错误。

    *   扩展：`VS Code` 有许多插件可以提供额外的 C 语言编程功能，如语法高亮、代码格式化和工具交互。

    *   终端集成：`VS Code` 拥有内置终端，允许我们直接从编辑器执行 C 程序，这对于调试 特别有用。

    *   Git 支持：`VS Code` 内带 Git 支持，简化了 C 项目的维护。

    *   跨平台兼容性：你 可以在几乎任何平台上使用 `VS Code`，因为 Windows、macOS 和 Linux 都有。


    ## Windows Windows 10+ Turbo C++


    `Turbo C/ C++` 是一个用于 C 编程语言编写代码的 IDE。`Turbo C++` 是 `Turbo C` 的高级形式，也可以用于 C 语言编程。


    注意：C++ 编译器支持 C 语言语法，因为 C++ 语言构建在 C 编程语言之上。


    要下载 Windows 版本的 `Turbo C++`，只需搜索 `Turbo C++` 并从官方网站下载。


    ![](img/Figure_2.3.png)


    图 2.3：Turbo C/ C++ 安装


    [图 2.3] 在我们启动 Turbo C/ C++ 安装时出现。安装软件时，只需点击 Next 并按照后续屏幕上的指令操作即可。


    现在完成安装，点击 Finish。参考下面的 [图 2.4]：


    ![](img/Figure_2.4.png)


    图 2.4：完成安装


    接下来，点击开始菜单 | 所有程序 打开程序。参考 [图 2.5]：


    ![](img/Figure_2.5.png)


    图 2.5：Turbo C 首页


    现在，我们可以使用编辑器编写 C 程序了。只需使用 File 菜单创建一个新文件。Compile 和 Run 菜单分别帮助编译和执行程序，如 [图 2.6]
    所示：


    ![](img/Figure_2.6.png)


    图 2.6：新文件


    ## Eclipse


    最受欢迎且实用的 C/C++ 开发 IDE 之一是 `Eclipse`。它是一个最初用于 Java 编程的开源软件，现在用于 C。（*注：原文文本包含大量关于
    Eclipse 的重复句子；我已根据指令处理了核心内容。*）


    `Eclipse` 是最初用于 Java 编程的开源软件，现在用于 C。许多插件让创建应用程序变得更简单。参考下面的 [图 2.7]：


    ![](img/Figure_2.7.png)


    图 2.7：Eclipse IDE


    ## Dev-C++


    对于 Windows 系统，`Dev-C++` 是一个功能完备的 C 和 C++ 开发环境。它具有基础 C/C++ IDE 缺乏的功能。自从 1998 年发布
    `Dev-C++` 版本以来，已被数百万程序员、研究人员和学生使用，他们仍在继续使用它。`Dev-C++` 是可以在互联网上下载和安装的免费包。参考 [图
    2.8]：


    ![](img/Figure_2.8.png)


    图 2.8：Dev-C++ IDE


    ## 创建源代码


    源代码文件是包含 C 编程指令的文件。要创建新源代码，选择 `File | New | Source File`。这将打开代码编辑器区域，我们可以在其中输入代码。参考
    [图 2.9]：


    ![](img/Figure_2.9.png)


    图 2.9：打开新源代码


    ## 保存文件


    通过 `File | Save` 或 `File | Save As` 保存文件。选择保存位置并命名。由于大多数现代 C/C++ IDE（包括 `Dev-C++`）旨在用于
    C++ 执行，默认文件扩展名为 `.cpp`。因此，我们必须显式地将文件类型更改为 C 源文件 (`*.c`)。参考 [图 2.10]


    ![](img/Figure_2.10.png)


    图 2.10：编写第一个 C 程序


    ## 编译代码


    通过 `Execute | Compile` 编译你的代码。这将通过检查源代码文件并确保其具有有效的 C 语法来编译该文件。编译完成后，我们可以关闭编译窗口。我们也可以在那里看到其他选项，如下所述所示并在
    [图 2.11] 中：


    ![](img/Figure_2.11.png)


    图 2.11：编译代码


    *   `Execute | Run`（意味着我们在执行文件时不进行编译）。

    *   `Execute | Compile and Run`（在无错误的情况下编译并执行文件）。

