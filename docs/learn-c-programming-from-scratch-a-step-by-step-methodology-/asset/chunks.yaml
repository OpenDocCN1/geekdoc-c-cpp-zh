    # 流程图


    流程图是一种视觉化展示数据在信息处理系统中流向、系统内执行的操作以及这些操作执行顺序的手段。我们将关注程序流程图，它描述了解决给定问题需要哪些操作（以及按什么顺序）。


    程序流程图可以比作建筑的蓝图。正如我们所知，设计师在开始建造建筑之前会绘制蓝图。同样，程序员倾向于在编写程序之前绘制流程图。与绘制蓝图一样，流程图是根据定义的规则和美国国家标准（ANSI）规定的标准符号绘制的。


    ## 流程图的历史


    流程图由 Frank Gilbert 于 1921 年引入，最初被称为过程流图（Process Flowcharts）。Allan H. Mogensen
    被认为培训了业务人员使用这种工具。


    ## 流程图符号


    在绘制流程图之前，我们需要了解流程图中使用的不同符号。大多数人都熟悉过程框和决策框等基本符号。但还有许多符号可以使你的流程图更有意义。


    查看[流程图符号](http://creately.com/diagram-type/objects/flowcharts）获取详细解释。尽管这些是可用的标准符号，但有些人会使用不同的形状来表示不同的含义，例如顺序访问存储、直接数据、手动输入。最常见的例子是使用圆形来表示开始和结束。图
    1.7 显示了所有标准符号：


    ![](images/1.7.png

    图 1.7：流程图符号


    流程图可以分为四大类：

    *   文档流程图

    *   系统流程图

    *   数据流程图

    *   程序流程图


    ## 流程图的意义


    流程图是一种图示描述，显示了解决问题必须采取的一系列步骤。通常，流程图是在解决方案开发的初期创建的。流程图让业务人员更容易沟通。这些流程图对于编程至关重要，对于理解挑战性问题后的逻辑非常有有用。因此，对于改进程序文档是必要的。


    ### 流程图设计指南


    *   在绘制正确的流程图时，所有必要的要求应按逻辑顺序列出。

    *   流程图应该是无歧、清晰、整洁且于理解的。

    *   程序的流向是从上到下（或从左到右）。

    *   过程符号必须有一条流线引出。

    *   一条流线必须进入决策符号。然而，可以有多条流线从决策符号发出。

    *   一条流线与终端符号配合使用。

    *   通过常用符号简要表达你的观点。

    *   如果流程图变得复杂，我们可以使用连接符号来减少流线的数量。为了清晰起见，我们必须避免流线交叉。

    *   我们必须确保流程图有一个逻辑上的开始和结束。

    *   通过各种测试运行来验证流程图是有帮助的。


    ## 流程图示例


    ### 基于顺序的流程图


    以下是一些基于顺序的流程图示例：


    ![](images/1.8.png

    图 1.8：显示消息的流程图


    ![](images/1.9.png

    图 1.9：两个数字相和的流程图


    ![](images/1.10.png

    图 1.10：计算三个科目中学生百分比的流程图


    ![](images/1.11.png

    图 1.11：计算简单利字的流程图


    ![](images/1.12.png

    图 1.12：计算两个数字平均值的流程图


    ![](images/1.13.png

    图 1.13：计算圆面积的流程图


    ![](images/1.14.png

    图 1.14：计算矩形面积的流程图


    ### 基于条件的流程图


    基于条件的流程图（有时称为决策流程图或条件流程图）是一种图形化表示，显示了根据特定情况或标准在过程中应执行步骤或动作的顺序。它是一种用于显示过程如何工作以及如何对不同输入和情况做出反应的工具。


    以下是基于条件的流程图的一些实例：


    ![](images/1.15.png

    图 1.15：判断给定数字是正数还是负数的流程图


    ![](images/1.16.png

    图 1.16：找出两个数字中较大值的流程图


    ### 基于循环的流程图


    基于循环的流程图是一种视觉化表示，用于显示包含重复的过程、算法或软件应用程序中的操作顺序。在编程和过程设计中，循环被用于连续执行一组指令，直到满足特定条件。这种重复模式通过基于循环的流程图进行图形表示。


    ![](images/1.17.png

    图 1.17：打印五次测试消息


    ![](images/1.18.png

    图 1.18：打印前十个自然数（1 到 10）


    ![](images/1.19.png

    图 1.19：打印前十个自然数和的流程图


    ### 嵌套条件


    当决策符号嵌套在流程图中其他决策符号内部时，形成一个可以容纳更复杂逻辑层次结构。这经常用于说明必须按特定顺序评估多个条件的情况。


    ![](images/1.20.png

    图 1.20：打印一位数偶数的流程图


    ### 有限循环和无限循环


    在循环语句中，有限循环是指一系列语句运行 `n` 次（预定次数）的循环。无限循环是指一组断言不断重复而不达到结论的情况。例如，如果我们不增加索引 `I` 的值，我们将有一个无尽的（无限）循环。


    ![](images/1.22.png

    图 1.22：描述无限循环的流程图


    ## 结语


    当我们完成这一章时，我们已经为你的 C 语言编程之旅奠定了基础。从理解计算机系统的复杂性到牢固掌握编程方法，我们为你的探索提供了必要的构建模块。


    '
- fmt: '

    With these foundational concepts now in your possession, you are well-prepared
    to dive into the world of C programming. Armed with this knowledge, you will confidently
    navigate the challenges and opportunities that await you in your coding endeavors.
    The synthesis of these basic elements will serve to amplify your skills and innovative
    potential within the realm of C programming.


    ## Exercise


    1. In what language can computers execute instructions?

    2. Explain the block diagram of the computer and Its components.

    3. Describe the steps required to solve a problem on a computer.

    4. Differentiate between assembly language and machine language.

    5. Write down two advantages of a high-level language over an assembly language.

    6. What tasks are performed by a compiler?

    7. Differentiate between compiler, linker, and interpreter.

    8. What are various software types?

    9. What are the categories of application software?

    10. Distinguish between an algorithm and a flowchart.

    11. What are the three main categories programming instructions fall into?

    12. Differentiate between OOP and functional & modular programming.

