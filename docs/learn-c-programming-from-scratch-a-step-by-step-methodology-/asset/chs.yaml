- "# 从零开始学习 C 编程：循序渐进的方法与问题解决方案\n\n\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\
  \n\n**献给**我生命的支柱——我亲爱的父母和家人。为了感谢你们坚定不移的支持、无尽的鼓励以及对我梦想的持久信念，这本关于 C 语言编程的书献给你们。你们的爱和指导是我在编程世界开启之旅的基石。\n\
  \n# 关于作者\n\nMohammad Saleem Mir 目前担任印度查米尔和勒什米（J&K）高等教育部的高级助理教授。他拥有超过 15 年的教学经验。在教学生涯中，他教授过与计算机相关的通用学科，但在引导学生学习编程科目方面发挥了领导作用，旨在培养学生强大的分析能力并将逻辑推理灌输给学生。作者拥有在克什米尔大学的计算机应用学士学位和硕士学位，目前正在攻机器学习/人工智能领域的博士学位。他在国家及国际期刊上发表了多篇研究论文，并在各种会议上展示过他的研究成果。作者还在大学和学院举办过启发性演讲和进修培训课程，并积极参与技术研讨会和工作坊。\n\
  \n# 关于评审员\n\nSrividya Richard 是一位充满激情且投入的教育工作者，拥有安纳大学计算机科学工程硕士学位。她认为自己是一个自信且热情的人，擅长以完全的精确和准确性逻辑性地完成任何给定任务。她在知名机构拥有十年的教学经验。她的研究兴趣领域在于机器学习、数据分析和人工智能。她在同行期刊上发表了许多研究文章，涵盖了从研究论文到书籍的内容。在学术职业期间，Sri\
  \ 有机会指导并执行了多个实时项目。她还开展过各种培训，并担任过组织会议和研讨会的委员会成员。跨学科项目的经历与行业界互动的接触对她磨练技能产生了重大影响。作为一名\
  \ AI 爱好者，Sri 乐于开启为专业人士提供 AI 技能的道路。她期待利用多年积累的专业知识，助力个人在个人和职业发展方面的能力。\n\n# 致谢\n\n\
  这本书是我为尊贵的读者们执笔创作的首次尝试。我真诚地希望他们能喜欢它，并对本书给出诚恳的评价。我非常感谢家人提供的支持和爱。他们一直支持着我，如果没有他们的支持和鼓励，这本书的编写将是不可能的。\n\
  \n同样感谢 BPB Publications 在将这本书变为现实过程中提供的指导和专业知识。这是一段漫长的修订之旅，在评审员、技术专家和编辑的宝贵参与和协作下得以完成。\n\
  \n最后，我要感谢所有对我的书产生兴趣并支持其成为现实的读者。你们的鼓励是无价的。\n\n# 前言\n\n我很荣幸分享我的知识、分析和结论，以提高计算机科学学生对编程的好奇心；归根结底，我们都将是受益。当一个人选择计算机科学作为职业时，可以注意到编程是计算机科学不可或缺的一部分，除非他是优秀的程序员，否则无法成为优秀的计算机科学家。正如俗言所说，“开头成功了一半”，从明确编程基础开始并在职业生涯后期学习更高级的编程形式至关重要。因此，本书侧重于提供编程基础的见解，并尽力详细涵盖主要概念，以保持读者的兴趣。\n\
  \n`C` 是一门基础编程语言，应当系统地学习。掌握 `C` 编程的特征非常重要。本书涵盖了所有基础概念，请放心读者在阅读本书内容时会过得很愉快并从中受益。本书以通俗的方式编写，目标受众——编程初学者能够轻松地理解书中解释的概念。书中的每个概念都同步辅以代码示例以增强清晰度。本书共有以下\
  \ 10 章：\n\n\n\n\n\n\n\n\n\n\n![](img/fm1.png)\n\n# 第 1 章：编程方法论\n\n## 介绍\n\n在本章中，我们将探索计算机和计算的迷世界，全面理解它们的原理和能力。我们的主要重点将放在编程上，我们将深入探讨各种编程风格和方法论。我们还将探索计算机系统的内部机制，理解其组件以及它们如何协同工作。在此过程中，我们将建立强大的算法基础，学习如何有效地设计和实现算法。为了辅助理解，我们将利用流程图作为视觉化工具来表示和分析算法。在本章结束时，你将掌握关于编程原理、解决问题技巧的，以及计算机在解决现实世界挑战中发挥的强大作用的深度知识。让我们开启这段令人兴奋的探索与发现之旅吧。\n\
  \n## 结构\n\n本章讨论了以下主题：\n\n*   编程方法论\n*   作为问题工具的计算机\n*   计算机与计算\n*   计算机系统\n*   编程风格\n\
  *   算法\n*   流程图\n\n## 目标\n\n本章的目标是提供对编程方法论的全面理解，强调将计算机作为解决问题的工具的使用。它探索了计算机和计算的概念，深入了计算机系统的组件和功能，并探索了各种编程风格。本章旨在为算法及其设计和实现建立坚实的基础。此外，它还涵盖了将流程图作为算法表示和分析的视觉工具的使用。在本章结束时，读者将获得编程原理、解决问题技巧以及在解决现实世界挑战中有效使用计算机的深度知识。\n\
  \n## 编程方法论\n\n编程方法论是指软件开发中使用的系统方法技术。它为软件工程师在设计、编码、测试和维护软件应用程序时提供了一个框架。\n\n计算机程序是一组解决给定计算机问题的相关命令或指令。编程是概念化并随后编写计算机程序的过程，通过执行该程序来产生所需的结果。编程涉及对程序进行概念化和编写、编译程序、执行程序以及调试程序。计算机程序旨在解决从简单到复杂的现实生活问题。编程方法论是分析现实复杂问题、提供软件解决方案并控制软件开发过程中相关活动的方法。一些流行的编程方法论包括：\n\
  \n*   **瀑布方法论 (Waterfall methodology)**：这是一种顺序软件开发模型，按照线性方式遵循一系列步骤，每一步都建立在上一步的基础上。\n\
  *   **敏捷方法论 (Agile methodology)**：这种软件迭代的迭代式方法强调开发人员与利益相关者之间的协作、灵活的计划和自适应的交付。\n\
  *   **Scrum 方法论 (Scrum methodology)**：这种敏捷方法论专门为软件开发项目设计。它专注于工作软件的迭代、增量交付，强调团队合作、灵性和持续改进。\n\
  *   **DevOps 方法论 (DevOps methodology)**：这种软件开发方法强调开发团队与运维团队之间的协作，以确保应用程序快速、可靠且安全地交付。\n\
  \n每种方法论都有其自身的优缺点，方法论的选择取决于软件开发项目的特定需求和限制。选择最合适的方法论有助于软件开发团队交付满足用户需求的高质量产品。\n\n##\
  \ 解决问题的方法与技巧\n\n计算机问题解决方法论是一种识别、分析和解决计算机相关问题的系统方法。\n\n该方法论涉及的步骤有：\n\n1.  **定义问题**：识别问题并收集有关问题的信息，包括错误信息、症状以及问题发生的背景。\n\
  2.  **分析问题**：使用批判性思维和排排除技术来理解问题的根源。\n3.  **形成假设**：根据上一步收集的信息制定潜在的解决方案。\n4.  **测试假设**：实施建议的解决方案并检查其是否解决了问题。\n\
  5.  **评估结果**：如果解决方案有效，则记录下来并处理下一个问题。如果没有效果，则返回步骤 3 并形成新的假设。\n6.  **实施永久解决方案**：如果找到了解决方案，对其进行永久实施以防止问题再次发生。\n\
  7.  **记录解决方案**：记录解决方案，包括所采取步骤、结果以及任何学到的经验，以帮助未来的排排除。\n\n通过遵循这种方法论，可以高效地解决计算机问题。\n\
  \n编写良好的程序是一门专业技能；因此，它需要遵循某些实践：\n\n*   **标识符的有意义命名**：在编程中编写易懂、易读且易维护的代码需要给标识符（如变量、函数、类等）赋予有意义的名字。以下是选择有意义标识符的一些建议：\n\
  \n    *   **分配有意义的标识符**：我们应该分配能够反映其功能和预期用途的有意义的标识符。使用描述性名称如 `num_students` 或 `current_date`，而不是模糊或通用的名称如\
  \ `x` 或 `temp`。\n\n\n\n\n\n## 编程最佳实践\n\n- **命名的一致性**：我们应该通过在源代码中使用相同的命名模式来保持一致性。\n\
  - **避免使用缩写**：缩写可能会让你的代码更难阅读和理解。如果一个缩写在你的编程社区中不为人知且不常用，请不要使用它。\n- **使用名词命名类和对象**：类和对象应该用名词命名，因为它们反映了实际对象。例如，`Student`\
  \ 应该是代表学生的类的类名。\n- **使用动词命名函数和方法**：动词描述了可能执行的活动；因此它们应该用于命名函数和方法。例如，函数 `Sum`应该计算两个值的和。\n\
  - **表达式的清晰度**：表达式代表一个特定的操作。因此，它们需要被清晰地理解和描述，且在表达式的清晰度上不妥协。\n- **注释与缩进**：注释在程序中用于文档说明。注释（用\
  \ `//` 表示单行注释）倾向于引导程序员进行调试；缩进是编写程序的理想技术，有助于理解程序的流程。\n- **空行或空格的使用**：空行用于分隔较长的代码块。编程语言中空格的使用标准符合我们遵循的普通英语规则，这意味着\
  \ C 语言中的符号（如 `=`、`+` 等）前后应至少有一个空格。\n- **语句的描绘**：语句代表了我们在 C 中执行操作的有意义的命令。它们应该单独放在一行上。对于语句块（后文将解释），由\
  \ `{` 和 `}` 标记，起始的左大括号 `{` 应该出现在块级语句的下一行，右大括号 `}` 应该出现在块级语句的最后一个语句之后。语句块相对于大括号进行缩进。\n\
  \n## 优秀程序的特征\n\n一个良好的计算机程序应该具有以下特征：\n\n- **易用性**：程序应该易于使用和理解，具有清晰直观的用户界面。\n- **可靠性**：程序应该按照预期运行，且不会引起非预期的后果或错误。\n\
  - **性能**：程序应该运行快速且响应迅速，没有明显的卡顿或延迟。\n- **可扩展性**：随着用户群增长，程序能够处理日益增长的需求和数据处理需求。\n-\
  \ **安全性**：程序应该具有健壮的安全措施，以防止黑客攻击、数据泄露和其他安全威胁。\n- **灵活性**：程序允许用户自定义和修改其设置及偏好以适应其需求。\n\
  - **兼容性**：程序应该能够与其他软件和硬件组件无缝工作，没有兼容性问题。\n- **支持**：程序应该具有充分的文档、培训和技术支持，帮助用户解决任何问题。\n\
  \n通过这些特征，良好的计算机程序将提供积极的用户体验，提高生产力，并为用户提供长期价值。\n\n使用 使用结构化、系统化方法解决问题的原因\n\n- 确保一致性。\n\
  - 让每个人意识到他人是如何处理项目的。\n- 保持过程的客观性，不受个人偏见和印象的影响。\n- 促进小组决策。\n- 帮助小组专注于问题解决模型中的六个阶段来遵循模型，而不是一次性使用不同的方法，这有助于定义议程。小组通过采用过程和事实来引导判断可以更容易达成共识。\n\
  - 成功解决问题。\n\n## 计算机作为解决问题的工具\n\n计算机是信息处理设备，根据规定的规则转换信息/数据，这些规则被组织在程序实现的算法中。\n\n\
  **算法**：一种在有限时间内完成任务的精确、逐步的方法。\n\n### 如何使用计算机作为解决问题的工具？\n\n我们需要：\n\n- 根据输入数据分析并描述事件的初始状态和目标阶段。\n\
  - 根据选定的可用操作集设计一种将输入转换为输出的算法。\n- 使用特定的编程语言将算法实现为程序。\n\n## 计算机与计算系统\n\n计算机是能够执行程序的设备，这些程序对馈入的数据进行操作以产生所需的输出。\n\
  \n计算系统是提供计算服务和功能的硬件和软件组件。这些系统可以从简单的设备（如计算器）到复杂的系统（如超级计算机或云计算基础设施）不等。\n\n以下是一些常见的计算系统类型：\n\
  \n- **个人计算机**：这是个人和企业最常用的计算系统。它们通常由一台台式机或笔记本电脑以及一系列外设备组成，如键盘、鼠标和显示器。\n- **移动设备**：包括智能手机和平板电脑，它们在个人和商业领域变得日益流行。移动设备通常处理能力和存储容量有限，但具有高度便性，并提供一系列功能和能力。\n\
  - **服务器**：服务器是特殊的计算系统，为网络上的用户和其他计算机提供服务。它们被用于 Web 托管、电子邮件托管、数据库管理和文件共享。\n- **超级计算机**：超级计算机是用于复杂科学和工程任务的高性能计算系统，例如天气建模、计算流体力学和分子建模。它们通常由许多处理器以及大量的内存和存储组成。\n\
  - **嵌入式系统**：嵌入式系统是构建在其他设备中的特殊计算系统，如汽车、医疗设备和工业设备。它们被用于执行特定任务，通常用于对速度和可靠性至关重要的实时系统。\n\
  - **云计算基础设施**：云计算基础设施是一种计算系统，通过互联网提供一系列计算资源，如存储、处理能力和应用程序。企业和个人经常使用云计算来存储和访问数据、运行应用程序以及执行其他计算任务，而无需本地硬件和软件。\n\
  \n\n\n\n\n## 输入：计算机接收来自键盘、鼠标、触摸屏或存储单元等输入设备的信息和命令。用户输入通过输入设备转换为计算机可以理解的语言。\n\n处理：`CPU`（有时被称为计算机的大脑）负责计算和数据处理。`CPU`\
  \ 从内存中提取指令，进行解码、处理，并将完成的产物保存回内存。\n\n内存：计算机内存存储了 `CPU` 处理数据所需的信息和指令。内存有多种形式，包括用于短期存储的\
  \ `RAM`（随机存存储器），以及用于长期存储的硬盘或 `SSDs`（固态硬盘）等存储技术。\n\n算术单元：`ALU` 是 `CPU` 的一部分，负责对数据进行算术运算（如加法和减法）以及逻辑运算（如\
  \ `AND`、`OR` 和 `NOT`）。\n\n控制单元：控制单元监督指令的执行。它获取指令、对其解码，并控制其他组件的行为。\n\n输出：处理后的数据被传输到输出设备，包括显示器、打印机、扬声器和存储设备，以便人们查看或利用。\n\
  \n存储：如硬盘或 `SSDs` 等长期存储设备在计算机关闭时也能保留数据。为了以后使用，数据可以被保存和检索。\n\n执行周期：计算机在连续的取取-解码-执行循环中运行，这些循环被称为执行周期。内存指令被检索并解码以显示所执行的操作，结果随后被存储。\n\
  \n操作系统：操作系统控制硬件资源，提供用户界面，并实现程序的无缝运行。它让硬件和软件之间的通信变得更加容易。\n\n软件与应用：软件程序（如操作系统和应用）指示计算机如何执行某些活动。\n\
  \n应用程序允许用户执行各种功能，包括文字处理、游戏游戏和上网冲浪。\n\n通信：通过使用网络适配器或无线连接等通信接口，计算机可以与其他硬件和网络进行通信。\n\
  \n反馈循环：计算机程序反复重复这些阶段，对人类输入做出反应并执行请求的操作。\n\n这只是一个高层概述，现代计算机的实际运行涉及许多细节以及硬件与软件组件之间复杂的交互。要理解计算机如何吸收信息并执行任务，必须首先理解这个基础框架。\n\
  \n## 计算机系统\n\n硬件和软件是计算机系统的两个主要部分。物理部分是计算机硬件，而软件是一组使硬件运行的程序（指令）。\n\n计算机系统的组件包括：\n\
  \n* 硬件\n* 软件\n\n`Computer system = Hardware + Software + User`\n\n* 计算机的所有物理部分（或我们能接触到的所有东西）被称为\
  \ `Hardware`（硬件）。\n* `Software = 为计算机提供智能的程序。`\n* `User = 操作计算机的人。`\n\n## 硬件\n\n\
  计算机硬件是指计算机的物理组件，包括以下内容：\n\n* `CPU`：`CPU` 是计算机的大脑，执行运行应用程序和程序所需的所有计算和处理。\n* `Memory`：内存，也称为随机存存储器（`RAM`），存储\
  \ `CPU` 需要快速访问的数据和指令。\n* `ROM`：一种称为只读存储器（`ROM`）的计算机内存，用于存储计算机系统正常运行所需的永久或半永久数据和指令。与易失性、瞬态的\
  \ `RAM` 不同，`ROM` 在电源关闭时也能保留其数据。`ROM` 对于启动计算机和初始化硬件至关重要。\n* `Hard drive`：硬盘存储计算机上的所有数据和程序。它是操作系统、应用程序和用户文件存储的地方。\n\
  * `Motherboard`：主板是计算机的主电路板，连接并控制计算机的所有其他组件。\n* `Power Supply Unit`：`PSU`（电源）将插座的交流电转换为计算机组件可以使用直流电。\n\
  * `Graphics Processing Unit`：`GPU` 负责在计算机显示器上渲染图像和视频。\n* `Sound card`：声卡负责为计算机提供音频输出。\n\
  * `Optical drive`：光驱用于读写 CD、DVD 和蓝光光盘。\n* `Keyboard and mouse`：键盘和鼠标将数据和命令输入到中。\n\
  * `Monitor`：显示器显示来自 `GPU` 的输出内容。\n\n这些组件共同工作，使计算机能够执行各种任务，从基础的文字处理到复杂的视频编辑和游戏。了解计算机硬件的不同组件对于构建、升级计算机以及解决可能的问题至关重要。\n\
  \n## 软件 \n\n计算机软件是指告诉计算机该做什么的指令或程序。它是程序、数据和其他指令的集合，使计算机能够执行各种任务和操作。\n\n软件主要分为两种类型：系统软件和应用软件。\n\
  \n* `System software`：这是使计算机能够运行和管理其硬件组件的软件。系统软件的类型包括：\n    * `Operating systems`：如\
  \ Windows、`macOS`、Linux 和 Android。\n    * `Device drivers`：这些程序使计算机与打印机、扫描仪和相机等外围设备通信。\n\
  \    * `Utilities`：这些程序帮助用户维护和优化计算机，例如防病毒软件、磁盘清理程序和备份软件。\n* `Application software`：这种软件旨在为用户执行特定的任务或应用程序。应用软件的类型包括：\n\
  \    * `Productivity software`：如文字处理、电子表格和演示文等，用于商业、教育和个人目的。\n    * `Multimedia\
  \ software`：如视频编辑、音频编辑和图像编辑软件，用于创作目的。\n    * `Gaming software`：如视频游戏和游戏平台，用于娱乐目的。\n\
  \    * `Web browsers`：如 Google Chrome、Mozilla Firefox 和 Microsoft Edge，用于访问互联网和浏览网页。\n\
  \n计算机软件是现代计算的关键组件，使计算机能够执行各种任务和操作。软件技术的进步使计算机变得越来越强大、多功能并能够处理复杂任务，使其成为我们生活中许多领域不可或缺的工具。\n\
  \n应用程序可以分为两大类：\n\n* `Custom-built software`（定制软件）\n* `Packaged software`（套装软件）\n\
  \n### 定制软件\n\n专门为满足单个企业或个人的独特需求和要求而创建开发的软件被称为定制软件。与预先设计并供购买的成品软件相比，它在功能、性能和可用性方面具有显著优势。软件工程师和开发者通常在与客户密切沟通以理解其需求和目标后，创建定制软件。开发过程通常包括需求收集、设计、编程、测试和部署阶段。\n\
  \n\n\n\n\n## 标题示例\n\n## 二级标题示例\n\n进入 `/path/to/xxx` 目录，找到 `xxx.json`。\n\n在表达式 `cvar\
  \ = avar + bvar` 中，加法运算符（`+`）将 `avar` 与 `bvar` 相加，得到它们的和 `cvar`。\n\n在 `List.of(arg0,\
  \ arg1, arg2)` 中，`List` 接口的工厂方法 `of()` 接受一系列元素，返回包含它们的只读列表。\n\n之后我们这样调用 `cmd` 命令：`cmd\
  \ arg0 arg1 arg2`。\n\n### 代码块示例\n\n```\nif (condVar > someVal) {\n    console.log(\"\
  xxx\")\n}\n```\n\n\n\n\n*   源代码与机器之间的抽象层级较少。\n*   可以从代码的任何地方调用过程或子程序。\n*   过程可以接受参数并向调用过程返回值。\n\
  *   过程化编程语言遵循使用基于块控制流的结构化编程技术。\n*   代码的可重用性（过程内部）。\n*   易于遵循程序的逻辑。\n\n过程化编程是命令式编程的一个子范式，因为每个计算步骤都是显式描述的，即使是通过定义过程来实现。\n\
  \n## 模块化编程\n\n在模块化编程中，程序被分为独立的、可替换的模块。程序可以以模块化的形式轻松编写。模块化的核心在于创建可测试的且可以堆叠在一起构成一个整个应用程序的代码块。这种编程风格涉及将问题划分为子程序。此外，多个模块可以组合成一个更优的模块。理想情况下，我们需要的重用代码应该成为一个我们可以导入的模块，而不是复制粘贴。使用模块化编程风格使我们的程序更具可读性、更易扩展且更优美。在模块化编程中，重点完全放在编写代码上。引用另一个模块以启动其执行的模块被称为调用模块，而被引用的模块被称为被调用模块。被调用模块可以是子程序，例如\
  \ `function` 或 `procedure`。请参考图 1.3：\n\n![](img/1.3.png)\n\n图 1.3: 模块化编程\n\n模块化编程的步骤是：\n\
  \n1. 定义问题。\n2. 制定解决问题所需的步骤。\n3. 将问题拆分为子任务。\n4. 为每个子任务建模子程序。\n5. 在主程序中调用子程序。\n\n\
  在实现模块化编程时，我们可以使用自顶向下或自底向上的变体之一。无论使用哪种方法，与将程序写成一个函数相比，以模块化形式编写程序更容易检测错误源并进行隔离测试。如果在测试程序后检测到错误，可以对单个模块进行重新测试。\n\
  \n## 自顶向下模块化编程\n\n自顶向下设计的基本属性规定，程序可以被分为一个主模块和一组关联模块。每个模块可以根据编程风格进一步细分为子模块。这种编程风格也被称为逐步细化化，因为它对程序设计施加了分层结构。它从在功能的最顶层定义解决方案，并将其进一步分解为可以简单记录和编码的微小例程。模块划分过程一直持续，直到模块仅由本质上易理解且无法进一步细分的简单过程组成。\n\
  \n自顶向下算法设计是一种编程方法，涉及将需求分解为在模块分层结构中组织的更小、更简单的片段。每个片段都有单一的入口和出口点，允许控制流通过结构向下流动，而没有指向更高层的任何无条件分支。自顶向下编程根据功能生成模块，通常是\
  \ `functions`、`procedures` 或 `methods`。请参考图 1.4：\n\n![](img/1.4.png)\n\n图 1.4: 自顶向下编程\n\
  \n## 自底向上模块化编程\n\n自底向上设计是一种系统设计方法，可以被认为是与自顶向下设计操作相反的方法。这是一种编程风格，从编程语言的原始语开始构建应用程序，并逐渐构建越来越复杂的特性，直到完成整个应用程序。。从特定模块开始设计。一旦这些模块被设计或开发，这些模块就会连接起来形成一个更大的模块（更复杂的结构），并在顶层结束。重复此过程，直到构建完整个系统。自底向上模型使我们能够在低层进行决策，并决定组件的可重用性。自底向上方法广泛用于测试，因为每个最底层函数都是首先编写和测试的。由于最底层模块已经过测试，任何检测到的错误可能都是由于较高层的模块。此过程持续向上移动层级，直到最后测试主函数。请参考图\
  \ 1.5：\n\n![](img/1.5.png)\n\n图 1.5: 自底向上编程\n\n表 1.1 讨论了自底向上和自顶向下编程模型之间的一些关键区别：\n\
  \n| 特性 | 比较 |\n| :--- | :--- |\n| 方法 | 自底向上是一种代码优先的方法，开发者从编写较小的代码模块或函数开始并从那里向上构建。自顶向下是一种需求优先的方法，开发者从定义系统的高层目标和需求开始，并将它们拆分为更小的模块。\
  \ |\n| 重点 | 自底向上关注单个组件的细节以及它们如何组合在一起。自顶向下关注系统的高层目标和需求，以及如何通过各个组件实现这些目标。 |\n| 复杂度\
  \ | 自底向上通常用于复杂系统，通过从小组件构建来更容易管理复杂度。自顶向下通常用于简单系统或需求定义良好的系统。 |\n| 测试 | 自底向上在模块级上更容易测试，因为每个模块都可以单独测试。自顶向下测试需要集成测试以确保所有模块都能正常工作。\
  \ |\n\n表 1.1: 自底向上与自顶向下编程\n\n自底向上和自顶向下编程模型是开发软件应用程序的两种不同方法，每种方法都有优缺点。方法的选择取决于系统的特定需求、应用程序复杂度以及开发团队的偏好。\n\
  \n## 结构化编程\n\n这种编程风格有多种名称：过程分解、结构化编程、模块化编程等。结构化编程是一种允许创建具有重用组件程序的编程模型。\n\n结构化编程旨在通过使用组织的控制流结构（如条件语句、循环结构、块构造和子程序）来提高程序开发的准确性和效率。这与使用测试和跳转（如\
  \ `goto` 语句）形成对比，后者结构化程度较低且更耗时。\n\n在结构化编程中，模块之间的抽象级别较低，因为各种数据结构的实现细节必须在模块间共享并从而暴露。这引导其他模块使用这些实现细节，从而在程序的不同部分之间创建不希望的依赖。主要的缺点是，从项目开始所出的决策都建立在应用程序的高层规范之上。\n\
  \n### 结构化编程的优点：\n\n* 易于理解。\n* 这种方法用户友好。\n* 易于维护。\n* 针对问题而非针对机器。\n* 需要的精力和时间较少，开发更容易。\n\
  * 相对容易调试。\n* 通常与机器无关。\n\n### 结构化编程的缺点：\n\n\n\n\n\n*   结构化编程被设计为一组组织代码的僵化规则。这使得代码更具可预测性且更容易维护，但它使其灵活性降低，且难以适应不断变化的需求。\n\
  *   随着程序复杂性的增加，结构可能会变得更加复杂，导致调试、测试和维护的困难。\n*   结构化编程并非为处理非线性控制流而设计。例如，如果你想从程序的一个部分跳转到另一个部分，在结构化编程范式中可能是困难的。\n\
  *   结构化编程要求将代码组织成函数和模块，这可能导致代码重复。在处理具有许多模块和函数的大型程序时，这个问题可能尤为严重。\n*   结构化编程可能导致代码紧耦合，难以在其他项目中复用，从而导致重复工作以及项目之间缺乏一致性。\n\
  \n## 面向对象编程\n\n切换到面向对象编程（OOP）这样一种新范式的动机，是为了消除过程化/模块化方法中固有的某些缺陷。OOP 将数据视为程序开发中的一个关键组件，并不允许其在系统中任意流转。它确保数据与其操作它的函数紧密结合，并保护其免受外部函数的意外修改。在面向对象编程中，对象是类的实例，包含数据和行为，并可以通过方法与其他对象进行交互。`Figure\
  \ 1.6` 展示了面向对象程序中数据和方法（函数）是如何组织的。只有与该对象相关的函数才能访问该对象的数据。然而，一个对象的函数可以访问另一个对象的函数。\n\
  \n![](img/1.6.png)\n\n图 1.6: 面向对象编程\n\n### 面向对象编程的特征：\n*   数据结构包含了所有处理对象数据的函数。\n\
  *   数据是隐藏的，外部函数无法访问。\n*   对象之间通过函数进行通信。\n*   任何时候需要新信息或新功能，都可以快速添加。\n*   OOP 使用自底向的方法来设计程序。\n\
  \n## 算法\n\n算法是一系列在正确遵循时可以解决特定计算机问题的指令。算法是一个过程，被表述为一系列阶段，并规定了一组必须遵循的指令以获得预期的结果。算法被称为与语言无关，因为它们可以在任何计算机语言中实现。算法不遵循严格的语法（与编写计算机程序不同），因为它不是在计算机上执行的。设计算法的实践主要用于设计或理解的目的。一旦借助算法预见到设计，就可以使用任何编程语言来实现该算法。\n\
  \n### 算法的特征\n算法应该具有以下特征：\n*   算法必须有零或多个输入（也称为信息或数据）进行处理以实现功能。\n*   算法必须至少有一个输出，即输入处理后生成的信息或结果。\n\
  *   算法必须包含一组精确的、易于理解和执行的指令，以产生预期的结果。算法在每个阶段都必须明确定义，没有解释解释的空间。\n*   算法必须是有限的，这意味着它必须在设定的步数后结束，而不是无限持续或无限循环。\n\
  *   算法必须在合理的时间内以可接受的资源消耗解决其创建时要解决的问题。\n*   算法必须足够宽泛，能够处理各种输入数据，而不仅仅是某一小子集。\n*  \
  \ 算法必须在现有资源和技术支持下是可实现的，才能被认为是实用的。\n\n### 编写算法\n编写算法没有定义良好的标准（如上所述）。原因之一是，由于我们不需要在计算机上运行算法（这需要适当的编写方式，即语法），用户可以选择如何编写它，而且它是针对特定问题的。\n\
  \n基础编码特征如重复语句、条件语句等是所有编程语言所共有的。我们可以设计一个通用的算法，稍后可以使用任何编程语言实现。算法通常以逐步格式编写；但情况并非总是如此。在问题领域定义清楚后，就可以为该问题制定算法的过程。总之，我们可以说我们在以后需要关注当前的问题并构建解决方案。\n\
  \n此外，程序的执行方式应分为三种：\n*   顺序语句\n*   选择语句\n*   迭代或循环语句\n\n#### 顺序语句\n算法步骤一个接一个地顺序执行。\n\
  \n以下是相同要求的的一些示例：\n\n**打印欢迎消息的算法：**\n1. 开始\n2. `output \"Hello world\"`\n3. 停止\n\n\
  **两个数相加的算法：**\n1. 开始\n2. 输入 `num1` 和 `num2`\n3. `sum = num1 + num2`\n4. `output\
  \ sum`\n5. true\n该算法以两个数字（`num1` 和 `num2`）作为输入，将它们相加并输出它们的和。\n\n**求两个数平均值的算法：**\n\
  1. 开始\n2. 输入 `num1` 和 `num2`\n3. `sum = num1 + num2`\n4. `avg = sum/2`\n5. `output\
  \ avg`\n6. 结束\n该算法以两个数字（`num1` 和 `num2`）作为输入，将它们相加，将和除以 2（输入值的个数），并输出平均值。\n\n**两个数相减的算法：**\n\
  1. 开始\n2. 输入 `num1` 和 `num2`\n3. `diff = num1 - num2`\n4. `output diff`\n5. 结束\n\
  该算法以两个数字（`num1` 和 `num2`）作为输入，从第一个数中减去第二个数，并输出差。\n\n**两个数相乘的算法：**\n1. 开始\n2. 输入\
  \ `num1` 和 `num2`\n3. `product = num1 * num2`\n4. `output product`\n5. 结束\n该算法以两个数字（`num1`\
  \ 和 `num2`）作为输入，计算它们的积并输出乘积。\n\n**除法算法：**\n1. 开始\n2. 输入 `num1` 和 `num2`\n3. `quotient\
  \ = num1 / num2`\n4. `output quotient`\n5. 结束\n该算法以两个数字（`num1` 和 `num2`）作为输入，将第一个数除以第二个数，并输出商。\n\
  \n**求圆面积的算法：**\n1. 开始\n2. 输入 `r`\n3. `area = 3.14 * r * r`\n4. `output area`\n5.\
  \ 停止\n该算法以圆的半径（`r`）作为输入，并根据公式计算圆的面积。请记住，我们不需要输入周率的值（`3.14`），因为因为它是一个常量。\n\n**求矩形面积的算法：**\n\
  1. 开始\n2. 输入 `L` 和 `B`\n3. `area = L * B`\n4. `output area`\n5. 停止\n该算法以矩形的长度（`L`）和宽度（`B`）作为输入，并根据公式计算矩形的面积。\n\
  \n在上述示例中，所有的指令/步骤都是一个接一个执行的。这些示例遵循顺序执行模式。\n\n#### 选择语句\n选择语句算法是一种允许计算机根据某些条件或标准做出决策的计算机程序。以下是选择语句算法的一些示例：\n\
  *   if-else 语句：if-else 语句是一种条件语句，当满足特定条件时执行某块代码，当条件不满足时执行另一块代码。例如：\n\n```\nif age\
  \ >= 18\noutput \"You are an adult.\"\nelse:\noutput \"You are not an adult yet.\"\
  \n```\n\n\n\n\n\n在这里，算法检查年龄是否大于或等于 18。如果是，程序将打印“你是一个成年人”。如果不是，程序将打印“你未成年”。\n\n###\
  \ 检查人员是否可以投票的算法：\n\n1. 开始\n2. 输入 `age`\n3. `if age < 18`，跳转到第 5 步\n4. 输出“可以投票”并跳转到第\
  \ 6 步\n5. 输出“不能投票”\n6. 停止\n\n该算法以 `age` 作为输入并检查年龄是否大于或等于 18。如果是，将显示“你成年人”，否则显示“你未成年”。\n\
  \n### 检查给定数字是正数还是负数的算法：\n\n1. 开始\n2. 输入 `n`\n3. `if n >= 0` 则跳转到第 5 步\n4. 输出“给定数字为负数”并跳转到第\
  \ 6 步\n5. 输出“给定数字为正数”\n6. 停止\n\n该算法以一个数字 (`n`) 作为输入并检查其是否小于 0。如果是，将显示“给定数字为负数”。否则，将显示“给定数字为正数”。\n\
  \n### 迭代语句\n\n迭代算法是一类通过不断改进初始估计值或解来解决问题的算法，直到达到预期的准确性或收敛水平。当使用分析方法难以或无法获得问题的精确解时，这些算法\
  \ 特别有用。\n\n迭代算法在解决某些类型的问题时可能非常高效，但如果收敛所需的迭代次数很多，计算开销可能会很大。选择合适的停止标准并优化算法参数有助于降低迭代算法的计算成本。\n\
  \n在迭代语句中，我们从一个初始值（初始化）开始，每次迭代向初始值加上或减去一个值，并尝试达到一个最终值（极限）。\n\n### 打印到 n 的自然数的算法：\n\
  \n1. 开始\n2. 输入 `L`\n3. `i = 1`\n4. `if i > L`，则跳转到第 8 步\n5. 输出 `i`\n6. `i` 的值加 1\n\
  7. 跳转到第 4 步\n8. 停止\n\n在这个算法中，我们尝试生成一个从 1 到给定限制 (`L`) 的序列。第 4 步检查 `i` 的值（在此示例中充当计数器）是否在边界内\
  \ (< L)。如果是，则打印 `i` 并在 `i` 加 1 后再次检查第 4 步的条件。一旦第 4 步的条件失败，控制将跳转到第 8 步，标记算法的结束。\n\
  \n请注意，对于 `L` 大于 1 的值，第 4、5、6 和 7 步将执行多次。\n\n## 算法效率\n\n算法效率是指算法解决给定问题所需的计算资源的衡量标准。算法的效率通常以时间复杂度和空间复杂度来衡量。\n\
  \n时间复杂度衡量算法随输入规模变化而执行的操作次数。算法的时间复杂度通常用大 O 表示法（big-O notation）表示，它给出了操作数随输入增大而增长率的上界。\n\
  \n另一方面，空间复杂度衡量算法随输入规模变化而所需的内存量。空间复杂度通常也使用大 O 表示法。\n\n高效算法是指那些时间和空间复杂度都很低的算法，这意味着它们可以快速解决问题并尽可能少使用内存。在实践中，算法的效率对软件系统的性能有显著影响，特别是对于大规模或实时应用。开发者使用各种技术来优化算法，包括分析问题的结构以识别最耗时最耗内存的操作、实现能够最小化搜索和更新时间的数据结构，以及在多个处理器或节点上进行并行计算。选择适用于当前问题规模和性质的算法，并优化算法的实现以达到预期的效率至关重要。\n\
  \n## 算法效率的重要性\n\n计算机处理算法时使用的资源数量可以决定算法效率。一个有效的算法使用尽可能少的资源来完成任务。评估算法的有效性是为了确保其运行无阻且无错误。低效的算法不太可能产生满意的结果。\n\
  \n## 算法时间复杂度情况\n\n算法的复杂度受多个变量的影响，包括比较和数据处理。例如，在算法的执行过程中，我们可能会计算数据传输和键（值）比较的次数。在评估算法复杂度时，可能会考虑三种不同的时间复杂度：\n\
  \n* 最佳情况复杂度\n* 平均情况复杂度\n* 最坏情况复杂度\n\n最佳情况意味着算法执行得最好的情况，最坏情况是算法执行最差的情况，而平均情况介于这两个极端之间。例如，在列表（数组）中搜索给定值的算法。最佳情况可能是要搜索的值位于列表开头，我们不需要找太远就能找到它。最坏情况如果在列表末尾找到该值，或者找不到该值（在这种情况下，我们也必须遍历整个列表）。平均情况是在列表中间地方找到了给定值。\n\
  \n### 算法效率（总结）\n\n算法的效率是两个阶段的累积产物：\n\n* 理论分析\n* 基准测试\n\n### 理论分析\n\n在进行理论分析时，渐近（任意）接近某个值的方法是近似算法的复杂度。由唐纳德·克努斯创建的大\
  \ O 表示法是表达算法需要多少资源的最流行方法。\n\n### 基准测试\n\n使用标准在评估效率的同时评估算法的性能。这有助于将算法的效率与竞争对手进行比较。例如，我们可以根据另一种排序算法建立的标准来评估某种排序算法的有效性。分析师可以使用基准测试比较算法速度，以查看是否有改进空间。\n\
  \n## 实现挑战\n\n在评估空间时间和复杂度时，性能可能会受到处理器（并行处理）、处理器使用的指令集、缓存局部性、多线程和多任务等变量的影响，无论编程语言如何或算法设计方式如何。由于处理器、指令集、编程语言和其他元素，可能会产生实现问题，让程序员感到头疼。\n\
  \n# 流程图\n\n\n\n\n\n# 流程图\n\n流程图是一种视觉化展示数据在信息处理系统中流向、系统内执行的操作以及这些操作执行顺序的手段。我们将关注程序流程图，它描述了解决给定问题需要哪些操作（以及按什么顺序）。\n\
  \n程序流程图可以比作建筑的蓝图。正如我们所知，设计师在开始建造建筑之前会绘制蓝图。同样，程序员倾向于在编写程序之前绘制流程图。与绘制蓝图一样，流程图是根据定义的规则和美国国家标准（ANSI）规定的标准符号绘制的。\n\
  \n## 流程图的历史\n\n流程图由 Frank Gilbert 于 1921 年引入，最初被称为过程流图（Process Flowcharts）。Allan\
  \ H. Mogensen 被认为培训了业务人员使用这种工具。\n\n## 流程图符号\n\n在绘制流程图之前，我们需要了解流程图中使用的不同符号。大多数人都熟悉过程框和决策框等基本符号。但还有许多符号可以使你的流程图更有意义。\n\
  \n查看[流程图符号](http://creately.com/diagram-type/objects/flowcharts）获取详细解释。尽管这些是可用的标准符号，但有些人会使用不同的形状来表示不同的含义，例如顺序访问存储、直接数据、手动输入。最常见的例子是使用圆形来表示开始和结束。图\
  \ 1.7 显示了所有标准符号：\n\n![](images/1.7.png\n图 1.7：流程图符号\n\n流程图可以分为四大类：\n*   文档流程图\n\
  *   系统流程图\n*   数据流程图\n*   程序流程图\n\n## 流程图的意义\n\n流程图是一种图示描述，显示了解决问题必须采取的一系列步骤。通常，流程图是在解决方案开发的初期创建的。流程图让业务人员更容易沟通。这些流程图对于编程至关重要，对于理解挑战性问题后的逻辑非常有有用。因此，对于改进程序文档是必要的。\n\
  \n### 流程图设计指南\n\n*   在绘制正确的流程图时，所有必要的要求应按逻辑顺序列出。\n*   流程图应该是无歧、清晰、整洁且于理解的。\n*  \
  \ 程序的流向是从上到下（或从左到右）。\n*   过程符号必须有一条流线引出。\n*   一条流线必须进入决策符号。然而，可以有多条流线从决策符号发出。\n\
  *   一条流线与终端符号配合使用。\n*   通过常用符号简要表达你的观点。\n*   如果流程图变得复杂，我们可以使用连接符号来减少流线的数量。为了清晰起见，我们必须避免流线交叉。\n\
  *   我们必须确保流程图有一个逻辑上的开始和结束。\n*   通过各种测试运行来验证流程图是有帮助的。\n\n## 流程图示例\n\n### 基于顺序的流程图\n\
  \n以下是一些基于顺序的流程图示例：\n\n![](images/1.8.png\n图 1.8：显示消息的流程图\n\n![](images/1.9.png\n\
  图 1.9：两个数字相和的流程图\n\n![](images/1.10.png\n图 1.10：计算三个科目中学生百分比的流程图\n\n![](images/1.11.png\n\
  图 1.11：计算简单利字的流程图\n\n![](images/1.12.png\n图 1.12：计算两个数字平均值的流程图\n\n![](images/1.13.png\n\
  图 1.13：计算圆面积的流程图\n\n![](images/1.14.png\n图 1.14：计算矩形面积的流程图\n\n### 基于条件的流程图\n\n基于条件的流程图（有时称为决策流程图或条件流程图）是一种图形化表示，显示了根据特定情况或标准在过程中应执行步骤或动作的顺序。它是一种用于显示过程如何工作以及如何对不同输入和情况做出反应的工具。\n\
  \n以下是基于条件的流程图的一些实例：\n\n![](images/1.15.png\n图 1.15：判断给定数字是正数还是负数的流程图\n\n![](images/1.16.png\n\
  图 1.16：找出两个数字中较大值的流程图\n\n### 基于循环的流程图\n\n基于循环的流程图是一种视觉化表示，用于显示包含重复的过程、算法或软件应用程序中的操作顺序。在编程和过程设计中，循环被用于连续执行一组指令，直到满足特定条件。这种重复模式通过基于循环的流程图进行图形表示。\n\
  \n![](images/1.17.png\n图 1.17：打印五次测试消息\n\n![](images/1.18.png\n图 1.18：打印前十个自然数（1\
  \ 到 10）\n\n![](images/1.19.png\n图 1.19：打印前十个自然数和的流程图\n\n### 嵌套条件\n\n当决策符号嵌套在流程图中其他决策符号内部时，形成一个可以容纳更复杂逻辑层次结构。这经常用于说明必须按特定顺序评估多个条件的情况。\n\
  \n![](images/1.20.png\n图 1.20：打印一位数偶数的流程图\n\n### 有限循环和无限循环\n\n在循环语句中，有限循环是指一系列语句运行\
  \ `n` 次（预定次数）的循环。无限循环是指一组断言不断重复而不达到结论的情况。例如，如果我们不增加索引 `I` 的值，我们将有一个无尽的（无限）循环。\n\n\
  ![](images/1.22.png\n图 1.22：描述无限循环的流程图\n\n## 结语\n\n当我们完成这一章时，我们已经为你的 C 语言编程之旅奠定了基础。从理解计算机系统的复杂性到牢固掌握编程方法，我们为你的探索提供了必要的构建模块。\n\
