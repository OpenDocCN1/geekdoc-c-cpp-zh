  - 设计题
- - '###'
  - 20.A 设计一个无符号除法器，将 7 位除数以 4 位除数。假设起始信号 (St) 持续一个时钟。当 St = 1，除法器寄存器从总线加载。在下一个时钟，除法器寄存器再次从总线加载。如果商超过
    3 位，会发生溢出，此时置位且控制器返回复位状态，否则控制器产生适当的移位和减法信号并开启完成。使用 8 位除法器并将存储在位。
- - '###'
  - 20.B 与 20.A 相同，使用 3 位除数和 4 位商。如果商超过 4 位，会发生溢出。
- - '###'
  - 20.C 与 20.A 相同，使用 8 位除数、3 位除数、5 位商。如果商超过 5 位，会发生溢出。
- - '###'
  - 20.D 与 20.A 相同，使用 8 位除数、5 位除数、3 位商。如果商超过 3 位，会发生溢出。
- - '###'
  - 20.E 设计一个无符号二进制乘法器，将 3 位除数乘以 4 位除数产生 7 位积。假设起始信号 (St) 持续一个时钟。当 St = 1，乘法器寄存器从总线加载。在下一个时钟，乘法器寄存器再次从总线加载。如果超过
    7 位，会发生溢出。
- - '###'
  - 20.F 与 20.E 相同，使用 4 位除数、3 位除数、7 位积。
- - '###'
  - 20.G 与 20.E 相同，使用 5 位除数、3 位除数、8 位积。
- - '###'
  - 20.H 与 20.E 相同，使用 3 位除数、5 位除数、8 位积。
- - '###'
  - 20.I 与 20.E 相同，使用 8 位除数、4 位除数、9 位积。
- - '###'
  - 20.J 与 20.E 相同，根据 2 位代码（00, 01 或 10）的值，将 3 位二进制数乘以 2、3 或 5产生 4 位结果 XYZW。如果结果大于等于15，XYZW
    为111 指示溢出。
- - '###'
  - 20.K 设计一个电路将 5 位二进制数除以 3，产生 4 位二进制商。假设输入在 0 到 27 范围内，28 到 31 范围内的数字永远出现。
- - '###'
  - 20.L 设计一个余数3转换器来驱动七段显示器。转换器的四个输入（A, B, C, D）代表一个余数3数字。代表 0 到 9 的组合应显示为十进制数字。输入组合
    0000、0001 和0010 应被解释为错误并显示“E”。假设输入组合 1101、1110 和1111 永远出现。
- - '##'
  - 20.M 设计一个在七段显示器上显示字母 A 到 J 的电路。电路有四个输入 W, X, Y, Z，代表要显示字母的 ASCII 码最后 4 位。如果 WXYZ
    =0001，显示“A”。
