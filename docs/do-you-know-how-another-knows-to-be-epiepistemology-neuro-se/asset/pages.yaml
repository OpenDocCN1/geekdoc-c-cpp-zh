  md: '# Origins


    Everything begins somewhere. So, what and where are the origins of Neuro-Semantic
    Programming?


    For us in Western Civilization, it began some 2600 years ago, when ancient Greek
    philosophers became interested in the physical phenomena about how a person knows-to-be
    a nail biter, hair puller, Bi-polar etc. They were therefore, exploring the nature
    of being. Their exploration would have sought the answers to these questions:


    +   (a). what constitutes the fabric/structure of subjective reality/experience?

    +   (b). how does one know-to unfold it in life?


    They named their field of research:

    ONTOLOGY.


    The ancient Greek philosophers were to see that with just this ontological faculty,
    a human being would sit and luxuriate his life away in his ontological fantasies.
    They concluded that a person had to have this added faculty:

    to-know-to know to be.


    With this faculty, he would go out into life and express his ontology to get his
    needs, wants and desires. This opened a new field of study for them. They named
    it:

    EPISTEMOLOGY.


    Anyone would think that Ontology and Epistemology would be significant fields
    of study. Sadly, the evidence is that both have fallen from the high towers of
    contemporary academia. As a medical student of the 1960s, I was never taught the
    subject of Ontology. From our sources, we know it is not a subject that is taught
    in Medicine and Psychology as recent as 2016.


    In our respective professional areas of focus, Psychotherapy and Hypnotherapy,
    it is clear to us that both are critical subjects. But, there are no critical
    papers or'
  merge: -1
  img_proc: true
