- pgno: 299
  md: 'The Worth, Value and Benefits that come from the NSP Core Seminars are listed
    in the Manual of the respective seminars. At the beginning of each seminar, the
    presenter reads out the list of the BENEFITS that each person will get. At the
    end of the seminar, a person is invited to represent the entire class. It is then
    put to him if he can confirm that he has the BENEFITS in his cognitive and analogical
    experience.


