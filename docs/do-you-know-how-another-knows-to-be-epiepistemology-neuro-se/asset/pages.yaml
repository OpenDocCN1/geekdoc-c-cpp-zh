  img_proc: true
- pgno: 20
  md: 'What became very clear to us is that the Holarchy of Paradigms, HOPS, as a
    unit, is the basis that determines:

    (a). the form of our way of thinking

    (b). the form of our being

    (c). the cogency of our personhood


    From it would unfold our ontology-to-context. This unfolding would be automatic,
    unconscious and felicitous. The evidence is that you never have to work out how
    you are to be whenever you go to, a cocktail party or a family function. The only
    exception as we pointed out above, is when you are invited to a private English
    tea with the Queen and the Duke at Buckingham Palace.


    ![](img/848af36214b1c1f629e75b4d1eef1404_20_0.png)


    What we have cited above, is the critical missing piece in the study, research
    and exploration of Ontology and Epistemology that has resulted in the lapse of
    the continuing study and research of these domains. These two field studies find
    their definitive anchor in this teaching by Richard Bandler to us:


    > Every human being is an unchartered universe of wonder, mystery and complexity.


    If the above Bandlerian aphorism is true-to-life, then in a very real sense, we
    have not even begun to explore the'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'wonder that is man or the horror that he can become. For Philosophy, Psychiatry,
    Psychology, Psychotherapy, Hypnotherapy, NLP, the Law, Business, Religion etc.,
    it is an incredibly vast vista of enquiry, research, exploration and discovery
    that calls for each of us to do. If this is not done from now2017 on, the public
    and politicians will certainly want to know, WHY?


    As to the specifics re personal cogency and coherency, it hinges on:


    +   (a). how well organized the General Holarchies, GHs are in a person? Ideally,
    we conclude that structurally they best be in the form of a hierarchy.

    +   (b). how semantically well-formed each GH is in a person? A child brought
    up in a crime family will have a GH of Law that will be warped and twisted.

    +   (c). how well-formed the GHs operate depends on whether the MH is A or Ã.

    +   (d). how well-formed a person''s SHs are.


    By our self witness we know that when we wake up we have our unique waking-up
    ontology. It changes when we have our morning wash. By the time we come down,
    we have our breakfast-ontology. In the car going to work we have our driving-ontology.
    Our ontologies are ever changing. They are all in constant flux.

    What is the condition when our ontology does not change? What happens, when it
    does not?

    If it does not, then we are stuck. Stuck states are problem states. The most famed
    of these are:


    +   (a). Nail biting

    +   (b). Smoking

    +   (c). Depression

    +   (d). Alcoholism

    +   (e). Panic Attacks'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'to list but a few. You will find the full complement of problem states as per
    2016, in the work:


    Diagnostic and Statistical Manual of Mental Disorders, DSM-5


    This work is the opus magnum of North American Psychiatry. It is abbreviated with
    the numeral because the numeral speaks to it being its fifth edition. The Diagnostics
    in it are problem states.


    If problem states are functions of their mental disorders, what NSP has found
    is that mental disorders can be of two types. A mental disorder may be in the
