    +   - NSP and Religion

    +   - NSP and Greed

    +   - NSP and Relationships

    +   - NSP and the Corporate Hierarchy

    +   - NSP and Religious Hierarchy

    +   - Reading, Adumbrating and Calibrating

    +   - An NSP Approach to Hypnosis and Hypnotherapy, Vol. I

    +   - An NSP Approach to Hypnosis and Hypnotherapy, Vol. II

    +   - Once Upon a Life

    +   - How to Reverse a Cancer

    +   - War and Hiroshima, OUR INEVITABLE EXTINCTION OR A WAY TO OUR SALVATION

    +   - Cancer, NSP and Law

    +   - NSP and Banking

    +   - Civilization and Culture

    +   - NSP and Financial Advising

    +   - NSP and Recidivism

    +   - NSP and Business

    +   - NSP and Crime

    +   - NSP and Education

    +   - NSP and Communication

    +   - Hypnosis

    +   - Language of Hypnosis

    +   - Language, Mother of Life, Mother of Death

    +   - IROSSFMIsTEMPS, An NSP Approach to Rapport

    +   - Chunking

    +   - The Art of Asking Questions


    We were stunned and horrified by this.


    Dennis is now 80 +. Neither of us are interested in name, fame, or glory as in
    the community of our peers we have unpremeditatedly and unintendedly earned our
    distinctions by some of the above awards we have cited to you. We can assure you
    that we have no need to be greedy'
