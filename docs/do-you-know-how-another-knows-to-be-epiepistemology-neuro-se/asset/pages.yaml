    failed to calm him down, he was, in fact in the end, put into a strait jacket
    and put into a padded cell. It was in this condition that his father found him,
    when he came to the hospital, in response to the Hospital''s calls that he do
    so. This is a classic example of an epistemological theorem that unfolds a series
    of Diagnostics: (i). Depression, (ii). Tension and Agitation, (iii). Schizoid,
    (iv). Anxiety, (v). Anger and (v). Violence.'
