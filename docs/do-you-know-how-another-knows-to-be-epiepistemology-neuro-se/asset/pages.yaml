- pgno: 286
  md: '# # Glossary of Terms


    **4-Tuple** is the term for Vision, Kinaesthetic, Audition, Olfaction.


    **An^9** stands for a person’s ancillary life metrics. They include 1. default
    assumptions, 2. presuppositions, 3. beliefs, 4. assumptions, 5. Standards, 6.
    values, 7. criteria, 8. morality and 9. ethics.


    **Aristotelian system of Cause and Effect** is a powerful language system that
    operates by a logical structure derived from its philosophy called Causality.
    It is also an all-encompassing life blueprint that determines the operations of
    all your General Paradigms and Specific Paradigms.


    **Automatism** is said to be an entity that exists-in-actuality. It is never specified
    where its domicile is. It can take over a person, and make him do bad things.
    From an NSP point of view, this is utter rubbish. Yet in one case in England and
    a second in Canada, it was proposed as the cause for the plaintiff to do his crime.
    The jury accepted the argument in both cases. Each was discharged, as logically
    the defendant could not be held accountable or responsible for his wicked deed.

    This was a reprise of the olde time argument: _The Devil made me do it_.


    **Autopoiesis** is the attribute of a sentient entity that is autonomous and self-governing.
    It is focused upon the task to ensure its continuing power and influence in its
    environment. It is also alert and aware of any variable that may diminish its
    power and influence.


    **Bodhisattva** is a person who has the insight to illume the life of another.
    Once, slavery was universal. Then one day a man offered to the world: _Love thy
    neighbour as thyself_. This idea was like a seed. As it spread and grew, it illumed
    humankind to see that slavery had to end. In our work, we can only help people
    to stop their smoking, alcoholism and addiction because we can illume them to
    end it.


    **Bodhisattvastic** is the adjective derived from its noun.'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'Deep Linguistic Structure, DLS, is the entity that holds all surface structure
    items in the brain. In the brain, all surface structure items are in binary code.


    Deep Linguistic Structure Items, DSLI are the surface structure items that now
    are in binary code forms. As such they are known as mental chips, mental chips.


    Deep Structure, DS is an ambiguous term. One ambiguity, DS in linguistics, is
    the device that takes all the surface structure sensory items into DLS, Deep Linguistic
    Structure.

    Its other ambiguity, is the device which unfolds to each of us everything that
    is in our shared reality, whether we understand it or not. Put a BAOxon, English
    on a seat with an astronomical telescope pointing to the Andromeda Galaxy. By
    Deep Structure, he will see it. If you put a wild child, who has been brought
    up by wild baboons, and put him on the same seat, by his Deep Structure, he will
    also see the Andromeda.

    However, whilst a BAOxon, English sees the item before him is a Colt 45 revolver
    and knows it, a wild child will not know what it is.


    Ego is the Latin for I. For Sigmund Freud, it is “the inner image of oneself as
    one wants to become.” From our living experience, we have never generated an inner
    image of ourselves that we wanted to become. We have lived by:


    +   (a). Horace’s conclusion: You can take a pitchfork to human nature, but it
    always returns.


    +   (b). our realization that our HOPs + Anʎ9 will determine our human nature
    with all its shortcomings, failings, flaws, defects, deficiencies.


    It is a truly humbling thing to embrace one’s humanity.


    Electro-encephalic studies, EEG, is the study of the brain’s activity. Electrodes
    put on the skull can pick up the brain waves. In a person, they vary in their
    frequency and their wave length, in relationship to the time of the day.


    Euphemisticalization is our neologism. It speaks to a language art form. Instead
    of using language with coarse, harsh, rude, crude, vulgar words, one uses refined
    and cultured linguistics'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'instead. Here is an example. Instead of lashing out with: Bastard, you really
    f - - ked me, you might consider this alternative: Your illegitimacy is not an
    issue with me. But I must tell you, you really can task me so unfairly.


    Function: Mathematically this word is written this way f(x). It can mean, the
    relationship, the role, use, value, action or its work. So, the function of money,
    lever, soup spoon, chopsticks is about the role of the item between one person
    and another, a thing or a situation.


    Geometric or Place Tag, GT or PT: All mental chips that have a GT or PT will be
    located in the part of the brain, whose functions are lateralized to deal with
    the operations'' gestaltens. A poem, a musical score, a mathematical theorem are
    examples of gestaltens.


    g_zero stands for gravity at zero value/strength.


    HOPs stand for Holarchy of Paradigms.


    HBP stands for the Human Brain Project.


    IL stands for Informal Logic.


    ISSCs stands for Internal Symbolic Semantic Codes. It is another way of describing
    mcs.


    Language Structure, LS is a file/cabinet/designation/label for a topic of consideration
    which has/contains/holds all the semantic material and the entire vocabulary from
    which the owner of the LS, sources all his ideas, writing and speaking about the
    given topic.


    LSs stands for Language Structures.


    LtB stands for Left Brain.


    LoG stands for Light of God,


    mc stands for mental chip. It is an item of information acquired via a specific
    sensory system. It is stored in the brain in binary code. In this form the acquired
    item is known as a mental chip.


    mcs_TT/GT stands for mental chips that are either with their TT or GT.


    muons, µ⁻s, is our neologism to stand for a unit of emotion. Such a unit does
    not exist-in-actuality. It is a theoretical concept, created to facilitate communication
    and understanding.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '**multiorginal term** is a term of the English language which has a semantic
    place and value in a vast scan of contexts. We offer five examples:


    +   (a) like: you can like a vast slew of items

    +   (b) yes: you can say yes to a near infinity of items

    +   (c) love: you can love a whole host of vegetables, animals, minerals, ideas
    and situations

    +   (d) no: you can say no to any number of items

    +   (e) present: you can use as a verb or as a noun and each can be used in an
    indefinite number of situations and to any number of people.


    **Nude Psychotherapy** is a form of psychotherapy used in sex therapy.


    **OnTEqN** stands for Ontological equation. It is the equation that determines
    the unique way of thinking and being in a person at any given time and context.
    It is the sequence of thinking/metamentation.


    **Paradigm** is a blueprint, a map, plan, or design.


    **Reductionism** refers to the act of stripping a semantic item down to its structural
    core. The problem is that it may not be done in a well-formed and accurate way.
    The result is that the end product is an anomalous and inaccurate distortion of
    the original.


    **Semantic Paradigm** is a blueprint to get an understanding of a large semantic
    domain of consideration.


    **Surface Structure** is what you actually see, hear, feel, taste and smell, NOT
    your word for the item in front of you. What is the surface structure of the item
    that is directly in front of you in a classroom? You will say: Blackboard. That
    is not what you see. What you see is a shape. It is a rectangle. Its margins have
    a different colour from that of what is within the margins. Within the margins
    are certain white lines. Some parts are darker than others. So, what is the surface
    structure of the sound when you are in front of Niagara Falls? What is the surface
    structure when you touch the skin of the palm of my hand?


    **Superiority** is the recursive apportioning to oneself that one is better, greater
    and more exalted than another. It is an act by'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'personal fiat. The person has no formal authority to do such thing.


    **Post-Traumatic Stress Disorder, PTSD:** This is a mental disorder in which the
    party has survived a blow and is thereafter unable to continue with his average
    life in the way that hundreds of millions of other average people do. What is
    the average life that millions of other average people have to do? Earn their
    living, pay their taxes, solve their life’s daily problems, face their daily challenges
    and overcome their daily obstacles, raise their children and obey their wives.


    **Richard Bandler, RB, and John Grinder, JG** are the co-founders of the study
    of Neuro-Linguistic Programming, NLP.


    **Right Brain, RtB:** We all have two cerebral hemispheres. The one on the right
    is known as the Right Brain. In this work, we abbreviate it to RtB.


    **Second order Change, IIOC:** IOC or First Order Change is the experience of
    a sleep in which is goes through the changes of one nightmare after another. IIOC
    is to wake up. IOC is the remodelling of a home this way and that. IIOC is to
    pull it down and put a new architecturally designed home with four floors and
    an internal elevator and roof solar panels.


    **SDB** stands for Sensory Data Base, meaning the site in the brain where we locate
    our visual, auditory, kinaesthetic, olfactory and gustatory information. These
    letters of the alphabet stand for the different senses of the SDB - V, A, K, O,
    G.


    **Temporal function, Tf** stands for our mental operation in accord with time.
    Language is by Tf. In a sentence, the first word of it, is to be at the first
    moment. The grammar decides the moment for the next word and so on to the completion
    of the sentence. Grammar decides the time for the verb in the sentence and the
    time for the accusative of the verb.


    **Temporal or Time Tag, TT** is a tag for a sensory item that is to be located
    in the brain whose functions are lateralized for sequential operations. Thus,
    dancing is a very complex activity, requiring one step after another provided
    you have the TTs for the dance. To this day, we regret that we do not have the
    TTs for the Argentine Tango.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Neuro-Semantic Programming


    TG stands for Transformational Grammar. A sentence is logically derived from the
    previous one. It is, therefore, a transformation of the previous. For this, all
    sentences in linguistics are known as linguistic transforms. The only way you
    can understand a sentence is if you have the Transformational Grammar for it.
    It was a study discovered by Noam Chomsky of MIT.


    ULR stands for Universal Logical Records. In the ULR is the entirety of all the
    information and data that you have stored in a logical order.


    UPR stands for Universal Physical Records. The UPR stands for all the information
    and data that a person has acquired and are stored as they are seen, heard, felt,
    smelt and tasted.


    Zero Tolerance stands for absolute intolerance. In Western Philosophy and Theology,
    “absolutes” are matters for Gods, not for entities who must wipe themselves at
    least once a day. This is buttressed by the teaching:


    > Let him, who is without sin, cast the first stone.'
