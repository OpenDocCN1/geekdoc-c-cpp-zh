- pgno: 1
  md: 'If you want to know about yourself or others, this work is for you. It is for
    everyone.


    As you read this work it will speak to you about a new way of thinking and being.
    It will open your eyes to a new approach to life situations.


    You may not know that when you are:


    +   1. at a cocktail party

    +   2. attending a family gathering

    +   3. meeting friends in a bar

    +   4. on a flight to London in the first-class section

    +   5. playing with one''s grandchildren


    that unconsciously you automatically know to know-to-be and so, you do not have
    to worry about how to be.


    In other words, you do not have to work out how to be in any context of life,
    whether they are normal social situations or stressful professional ones. The
    fabric of our subjective reality and the structure of our subjective experience
    is somehow worked out for us.


    At a deeper level, it is as if there is a psychological machine that works for
    us to produce our necessary way of being in any context.


    This work is about the exploration of how each of us know to be, known as ontology-to-context.
    It is also about how another knows how you know-to-be, known as Epiepistemology.
    It is about how a therapist may use this knowledge to help others.


    In this work, we invite you to learn about yourself and others by exploring your
    ontolog'
