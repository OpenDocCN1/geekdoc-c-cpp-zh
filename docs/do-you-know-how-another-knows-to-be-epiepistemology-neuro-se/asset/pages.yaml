- pgno: 23
  md: 'A cure in the field of Mental Illness is a Second Order Change, IIOC. What
    is a First Order Change, IOC? To have one nightmare after another nightmare is
    IOC. To wake up is IIOC. To try desensitizing a patient out of his flying phobia
