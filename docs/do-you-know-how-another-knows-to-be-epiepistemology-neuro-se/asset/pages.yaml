    +   (a). configuration/formula/equation for one diagnostic.

    +   (b). theorem that unfolds a cephalopodia of diagnostics⁴.


    All problems states from a NSP clinical point of view have:


    +   (a). their degree of severity as gauged by the degree of suffering and pain
    heaped on the family.

    +   (b). the degree of complexity as tasked upon the NSP-therapist to unravel
    it, a.k.a. to cure the patient of his problem condition.


    The question that needs to be answered is:


    # What is a cure?


    ⁴ cephalopodia of diagnostics: Is exampled by this case. An 18 year old male was
    admitted into a psychiatric unit for Depression. Within the first hour he became
    more tense and agitated at the staff that a psychiatrist had to be called to see
    him. He was now diagnosed as Schizoid and in Anxiety. He was medicated. This drug
