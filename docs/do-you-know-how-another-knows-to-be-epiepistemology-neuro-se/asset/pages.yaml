- pgno: 300
  md: '# The Authors


    Jennifer and Dennis Chong have co-shared a practice in Psychotherapy and Hypnotherapy
    from 1979 to the present. Over this time they inadvertently converted the practice
    into a research laboratory into the marvels and singularities of Ontology and
    subsequently Epistemology.


    This led them into the fields of Applied Linguistics, Applied Philosophy, Formal
    Logic, Informal Logic, Non-Verbal Language, Science, Syntax, Grammar, Semantics,
    Religion, Systems, Structure, Human Relationships, AI, Human Communication, Fractals
    and Chaos Theory etc. This extended their knowledge base into the fields of, Law,
    Morality, Ethics, Games Theory, Plans, and Induction, etc.


    Both were contributing presenters of the Ontario Society of Clinical Hypnosis,
    National Guild of Hypnotists and contributing authors of its journal, Hypnotism.


    They are contributing workshop presenters to the International Association of
    Counsellors and Therapists and are contributing authors to their journal. They
    are workshop presenters to the International Medical and Dental Hypnotherapy Association
    and are contributing authors to their journal. They are contributing presenters
    of the American Board of Psychotherapy and to their journal.


    They have lectured at various colleges and universities and in professional forums
    in Canada, US, England, Spain, Italy, Germany, Australia, Hong Kong and Malaysia.


    Both are Fellows of the Society of Neuro-Semantics and Fellows of the American
    Board of Psychotherapy. Jennifer is a Fellow of the International Medical and
    Dental Hypnotherapy Association; and Dennis is a Diplomat of the International
    Medical and Dental Hypnotherapy Association. In May 2017 Dennis was inducted into
    the Hypnosis Hall of Fame.


    They have been honoured by their peers by a scan of awards. They cite a few of
    them here:'
