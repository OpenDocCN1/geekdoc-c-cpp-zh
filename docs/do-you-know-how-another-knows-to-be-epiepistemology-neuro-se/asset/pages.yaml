- pgno: 304
  md: '> This work is staggering in its scope and import.

    > Gary Phillips, MA, CRSP, CHRP

    > NLP Licensed Trainer


    > The authors embrace so much information from wide corners of studies and situations.
    This book brings forth the human aspects which encompass the knowledge necessary
    for readers to appreciate where we are (and can be if pursued further).

    > Difficult as the subject is, the book gets to the bottom and sides of humanity
    and thus brings value to all.

    > This is a specific treatment for our not-so-perfect understanding of what seems
    to be churning in the World.

    > Dato'' Syed Ahmad Idid

    > Former Judge of the High Courts of Malaysia


    > This book enfolds several critical-scientific approaches to understanding the
    mind-body-environment nexus that characterizes the human condition. With great
    eloquence and based on extensive research and knowledge of various disciplines,
    it presents us with a philosophy and investigative tool at once: neuro-semantic
    programming (NSP).

    > It breaks radically from the Aristotelian hierarchical view of the human mind,
    bringing out its associative and connective structure. Unlike its counterpart,
    neurolinguistic programming, NSP offers a truly humanistic and humane approach
    to understanding everything from language to pain. This book is a "must read"
    by anyone interested in who we are.

    > Marcel Danesi, Ph.D., FRSC

    > Professor of Anthropology, University of Toronto


    > With all respect, this tome is a very valuable contribution to the current literature
    in this area. It clearly illustrates the depth of thinking and research that the
    two authors have so brilliantly carried out to publish this manuscript. I find
    their area of expertise fascinating, thought provoking and very original. They
    have laid the paths for other workers to carry on to develop this field even more
    for the benefit of mankind and their painstaking effort should be congratulated
    and applauded.

    > Saroja Krishnaswamy, MB, BS, FRANZCP, FRCPych(UK)

