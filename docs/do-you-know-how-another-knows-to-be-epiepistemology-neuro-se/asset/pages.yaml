  md: '# Introduction


    This work:

    Neuro-Semantic Programming, NSP,

    is about a great story. The story is a part of Western Civilization. We note the
    work of the ancient Egyptians1 in the study of human ontology that was reflected
    in this quote in the text of the ancient Israelites who were ex-slaves of Pharaoh
    in their sacred text, the Torah:


    > As a man thinketh in his heart so is he.


    We acknowledge the critical pioneering work of the ancient Greek philosophers
    in their enquiries into human Ontology and above all, Epistemology.


    We salute the heroic efforts of Robert Dilts, John Grinder, Richard Bandler, Leslie
    C. Bandler, and Judith DeLozier to revive the study of Ontology.


    This is the genealogical track of the development of NSP:


    +   - Ontology ... 515 BC. Parmenides et alia

    +   - Epistemology ... other ancient Greek philosophers

    +   - General Semantics ... 1933 Alfred Korzybski

    +   - Neuro-Linguistic Programming .. 1975 Dilts, Grinder, Bandler, Bandler, DeLozier

    +   - Neuro-Semantics ... 1980 Hall

    +   - Neuro-Semantic Programming ... 2017 Chong and Chong


    Above all it acknowledges the mystery of the lapse in the study of Ontology and
    Epistemology.


    1 the ancient Egyptians: They were a great famed Mediterranean power with links
    to ancient Greece. Herodotus went to Egypt and in his Histories, records the wonders
    of it.'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'In exploring the nature-of-BEING, the Greek philosophers had no choice but
    to wonder what the processes were by which the nature-of-BEING unfolded itself
    to context. We now know that they were seriously handicapped in their enquiry
    as they did not have:


    +   (a). 2017 information regarding Neuro-anatomy

    +   (b). 2017 information regarding Neurology

    +   (c). certain conceptual tools from NLP regarding thinking

    +   (d). 2017 tools with respect to the governance of thinking from NSP


    For these considerations, the explorations for the ancient Greeks in these domains,
    stalled. The great thinkers in the Golden Age of Islam never really took up the
    research in Ontology and Epistemology. For the above considerations the great
    thinkers of the European Renaissance never took it up either. Then, more recently,
    the great philosophers of our times from Immanuel Kant, Bertrand Russell, Martin
    Heidegger, Ludwig Wittgenstein, and Karl Marx also never took up the research.
    Interestingly, after Neuro-Linguistic Programming Vol. I, there was a stall in
    ontological explorations!


    Every unique nature-of-BEING unfolds in a manner that is fitting to context; and
    it does so with unconscious facility and celerity. We never have to think of how
    we are to be in any upcoming situation. There is one exception. It is when you
    are invited to Buckingham Palace to tea with Her Majesty Queen Elizabeth II and
    the Duke. Immediately, on one hand, is your headache how you best not bungle at
    this high occasion of your life and on the other hand is the humungous task how
    to be, to IMPRESS Her Majesty and the Duke?!


    In our exploration and research into Ontology and Epistemology we did a very critical
    breakthrough. It was our discovery that a person uses the blueprints of life to'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'understand himself, others and the world he lives. These blueprints are acquired
    from the time of childhood. Initially we named these blueprints, Semantic Paradigms.
    It was clear to us that they were autopoietic² wholes. For this we changed their
    name, in accord with Arthur Koestler’s recommendation, to Semantic Holarchies,
    SHs. We were to recognize that all the Semantic Holarchies, in a person, would
    logically form a coherent operating unit. We named this unit, the Holarchy of
    (Semantic) Paradigms, HOPs. With time, we were to flush out what these blueprints
    were. They are in a hierarchical sequence, left to right and top down, with their
    Histories:


    +   Race Family Clan

    +   Civilization Culture Society

    +   Education Religion Law

    +   Politics Economics Money

    +   Trades Business Commerce

    +   Science Customs Military

    +   Traditions Legends


    Children of a national group are reared to acquire their respective semantic holarchies.
    They are the basis for their personal cogency. They share their holarchies with
    each other. For this they are known as General Holarchies, GHs. Their shared GHs
    are, in turn, the basis for their national identity, coherency, cogency and lucidity;
    and from which unfolds the deep knowing that they do not and cannot set out to
    indiscriminately slaughter their own kind³. This is


    ² Autopoietic wholes are ones that are autonomous and self-governing. ³ indiscriminately
    slaughter their own kind is an exceptional phenomenon. It happens in a civil war
    when the people of a nation who share the same GHs set out to kill each other.
    The basis is because there emerges one critical sub-Holarchy that one part of
    a nation upholds and the other does not. Thus, one part of the British nation
    believed in the Divine Right of Kings but another did not. One part of the US
    believed in slavery but another part did not.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'not the same as an act of killing another for personal reasons.


    In time, we realized that there was a class of holarchies that were personal and
    unique to an individual. We named them the Specific Holarchies, SHs. They include
    Beliefs, Values and Criteria. Here are five examples:


    +   (a). I must be sure no one makes a fool of me.

    +   (b). Politicians are liars.

    +   (c). Women are against me.

    +   (d). Men are worthless.

    +   (e). I am worthless


    We concluded that all the General Holarchies and Specific Holarchies were under
    the governance of a Meta Holarchy, MH. This MH was the Aristotelian system of
    Cause and Effect, A, C→E.


    There is an alternative MH. It is the Non-Aristotelian system of Relativity and
    Relatedness, Ã.


    The GHs and SHs with the MH, A or Ã form a unity known as the Holarchy of Paradigms,
    HOPs. We represent it thus, with A as the MH:


    ![](img/848af36214b1c1f629e75b4d1eef1404_19_0.png)'
