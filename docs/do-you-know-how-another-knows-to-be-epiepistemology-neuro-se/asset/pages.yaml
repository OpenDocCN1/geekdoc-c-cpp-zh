  md: '# A Note of Clarification


    When Einstein’s paper on his Theory of Special Relativity, TSR, was published
    in 1905, he did not hold an august professional chair in a famed German University.
    He was just a factor in the Swiss Patent Office as an examiner of patents.


    The scientific establishment of his time was very guarded towards his paper; and
    this was especially more so when his paper had a stunning conclusion that light
    did not travel in straight lines. This was a violation of Euclid’s finding that
    light travels in straight lines!


    It is the blessed stance of Science that, you can come up with any theory of your
    choice with whatever conclusion it takes you to. However, what is required of
    you is that you must devise a legitimate test that carries the results that prove
    the conclusion you hold; after that, a second centre must do the same test and
    it must have the same results that prove your conclusion¹.


    It was only after WW I that Astrophysicist Arthur Eddington could do the test,
    which proved the accuracy of Einstein’s conclusion, that light does NOT travel
    in straight lines. As it turned out, it was not just a second centre, but a slew
    of them, that did the same test and got the same test results — namely, light
    does not travel in straight lines.


    We now know that we cannot totally rely on our common sense. We cannot, because
    it was common sense that told us, once upon a time that:


    +   (a). the world is flat

    +   (b).the sun rises in the east and sets in the west


    ¹ a second centre must do the same test and it must have the same results that
    prove your conclusion: So, as far as our therapeutic algorithm to reverse a cancer
    is concerned, the second centre that has secured the same results of inverting
    cancers is in Brisbane, Australia under its director, Alan Patching.'
  merge: -1
  img_proc: true
