    # Fourth Logical Holon of Ã and its linguistic holons of: How, Who, What, Where,
    When, Which, Whose and Whom?


    Each of the above interrogatives have unique linguistic functions. They are to
    get INFORMATION appropriate to their category:


    +   - How is for the method of doing things

    +   - Who is for a person & his status, profession, or designation

    +   - What is for a thing, device, intention, purpose, goal, etc.

    +   - When is for time, past, present or future

    +   - Where is for place, location, site in space, geography

    +   - Which is about choices or options

    +   - Whose is a general query about identity re ownership of an item

    +   - Whom is about specific identity of the person.


    Let us compare these questions with WHY. Using the example of a person who is
    building his own home. Here, in logical sequence are the possible WHY questions:


    +   - WHY is he building his home?

