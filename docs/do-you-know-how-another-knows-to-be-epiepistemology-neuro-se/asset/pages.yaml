  md: '# Forthcoming Publications


    We could not have premeditatively and cognitively thought about what we now share
    with you.


    It is a direct result of writing this work on Epistemology, that it suddenly came
    to us that we are to write these books:


    +   - Don''t Ask WHY?! (Revised 3rd Edition)

    +   - Parenting, The Art & The Science

    +   - NSP and Politics

    +   - Human Sphexishness, AN NSP APPROACHTO PSYCHOTHERAPY

