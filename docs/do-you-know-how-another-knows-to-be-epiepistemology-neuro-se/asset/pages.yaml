- pgno: 303
  md: 'for money. To be free of this is **FREEDOM**. In this, we note with sadness
    that there are those with hundreds of millions and yet others with 10s of billions
    and they are still in the coils of their wanting for more!


    So, what are we writing these works for? We do so because, in us, is a knowing
    that implicate to each work may be critical material that may have bodhisattvatic
    consequences for its reader. It is for this unknown reader that we write these
    30 books.'
