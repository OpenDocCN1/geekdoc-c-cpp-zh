    When one gets into the sub-sub-sub-sub-topics of say, recipes for pasta you can
    now see the importance of knowing which sub-sub-sub language structure the recipe
    comes from. In other words, are we talking about the different kinds of recipes
    for pasta a la Milanese, or Sicilian or Veneto. For this information, one needs
    to know how to ask good questions. From an NSP point of view, it is a necessity
    of life to be able to ask good questions. A good question is one that:'
  merge: -1
  img_proc: true
- pgno: 279
  md: '+   (a). culls for you the highest quality of information

    +   (b). peals open the true nature of a problem.


    At a teaching seminar we were presenting, a man shared with us a problem of not
    being able to finish his morning appointments on time. The participating audiences’
    questions were not able to resolve the problem state. Using NSP, we asked the
    fitting question of “who schedules your appointments?” The man was able to have
    a solution.


    In any situation, such as marital, parental, political, business or social, it
    is an advantage to be able to communicate excellently. To be able to do so, one
    needs to know which language structure the other is coming from. With this information,
    one stands on solid ground as to how to interface with the person. Without it,
    we are in fact, lost in the ether of our idiosyncratic ideas and fanciful opinions
    as to where we think he is at.


    The horrendous extension inherent to any sentence of the English language is the
    attribute of its ambiguity. When a sentence is ambiguous it is open to interpretation.
    Your understanding of it may be different from the person sharing the information.
    You may remember the example of the picnic held in Stratford and what time of
    day it was.


    Now, because of what we have said above, you have to wonder how is it possible
    for charismatic speakers, to WOW and RAH-RAH an entire audience? The immediate
    grandfather who had such incredible speaking skills was of course, Adolf Hitler.
    You remember how in Nuremberg he WOWED and RAH-RAHED everyone. We ask you:


    Do you think that it is a healthy thing for normal rational people to allow themselves
    to be wafted away to their NEVERLAND in this way?'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Conclusion


    It is not the place of this work to share with you how to be a top WOW or RAH-RAH
    speaker. There is a structure that by acquiring it, you can be one.


    We have our unique ideas about a topic. These unique ideas are carried in our
    unique language structures. From our unique language structure comes our unique
    sentences, words and unique style of speaking on the topic. It is for this, that
    on the same topic, no two people will have the same sight and slant. Have you
    ever entered a conversation with another and after an exchange of three or four
    sentences, you suddenly realized that you and the other person were talking on
    totally different subjects? I remember once I was talking about ballroom dancing
    and I suddenly realized that the other person was talking about fishing!


    It is because of this intrinsic ambiguity in English sentences that legal documents
    are as lengthy as they are. Any good NSP lawyer knows, that no matter how lengthy
    it may be, in its attempt to elucidate itself clearly and beyond any possibility
    of refutation, he can always find a flaw in it.


    What are the linguistic tools that are available to deal with ambiguities? The
    tools are the Modified Meta Model, 3M and the No-Y-ian Model of Language, ~YML.
    Where do you get the information about them? The former is from PAEIC and the
    latter is from the Manual of the Power Seminar.


    No one can be a competent pilot just by reading a manual about flying. One needs
    a teacher a.k.a. a flying instructor. So, we hope that one day, you will attend
    the Power Seminar, Part I and II. When you do so, you will take a very worthwhile
    step in acquiring the skill for excellence in communication. We hope that from
    your read of what we have written here, is your amazed realization'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'that to communicate well, is a learned skill. And no one has ever taught you
    how to do it well.


    You can now begin to see that all human problem states as listed in DSM-5 are
    functions of some dysfunction or anomaly in the operation of the semantics within
    a person''s HOPs. In turn, you can see that potentially the number of possible
    dysfunctions or anomalies would run into the hundreds of thousands. The current
    plethora of modalities in Psychotherapy is evidence of what we are asserting here.
    You have to wonder if it is ever going to be possible for any drug company to
    invent drugs for all current Diagnostics and all necessary future drugs for the
    unfolding vast new numbers of Diagnostics.


    So now where do you stand? Is it the world of:


    +   - [ ] The Aristotelian System of cause and Effect A - The Blame Frame

    +   - [ ] The Non-Aristotelian System of Relativity Ã- The Freedom Frame?


    If you know where you stand in your above choice and it is A, then there is nothing
    for us to do for you. You are already in it and we pray you may find the life
    by which you will be free from:


    +   - fear and anger

    +   - anguish and frustration

    +   - pain and suffering

    +   - woe and tears


    But if your wish is to move from the Aristotelian system of Cause and Effect,
