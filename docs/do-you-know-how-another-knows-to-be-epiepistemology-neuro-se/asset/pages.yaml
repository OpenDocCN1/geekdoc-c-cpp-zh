- pgno: 282
  md: '# # The Journey of Discovery


    We were always taught that to read a book we were to do so by the Principle of
    Charity. For us, the book *Science and Sanity, AN INTRODUCTION TO NON-ARISTOTELIAN
    SYSTEMS AND GENERAL SEMANTICS, S&S* is an incredibly wonderful and seminal work.
    When S&S was first published, it was reviewed by the Journal of Philosophy. Most
    uncharitably, its reviewer described S&S as unreadable. Amazingly, when we bought
    our copy, it was in its 4th Edition and 6th Reprinting in 1980. When we published
    our work, *Don''t Ask WHY?!* it had a critique which slammed it and in 3 years
    it was in its second reprint. The film Star Wars was severely critiqued when it
    was first relised and yet it soared to the stars.


    There was already a profound shift in thinking in Dennis, by reading the work,
    *Structure of Magic, SOM*, by Richard Bandler and John Grinder. With S&S was the
    rocket that catapulted him into a wondrous new universe of ideas and concepts
    which he introduced to Jennifer. Then together, they worked on these concepts
    to take the form of this work. Thus, at a very significant level, we owe to S&S
    our discovery of Neuro-Semantic Programming, NSP. It is for this that we formulated
    the dedication of this work the way we have.


    > > Truly, we thank AK for this.

    > > It is one of a set of eternal debts that we can never repay.


    If, as it seems the time has come to give acknowledgement to those who guided
    us and helped us to be here, we certainly must acknowledge the ancient Greek Philosophers.
    It was in a very real sense, they who found the road to Ontology and Epistemology.
    It was they who signposted these studies for us to trek, search, explore, find,
    unravel and discover. It is for this that we now recognize them and give to NSP
    its Greek name:'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# Epistemology.


    To them also, we owe a debt that we can never repay.


    As stated earlier Neuro-Semantic Programming, NSP, Epistemology is, in brief,
    the study of how you may: know how another knows-to-know-to-be a nail biter, stutterer,
    depressed, anxious, malicious, and so forth. It is in this way that one gets the
    knowledge of: the ontological equation, OnTEqN of being.


    It logically follows that if one knew another’s OnTEqN, then one would be able
    to break it or unravel it. By doing this, the person would be free of his problem
    forever. This is exactly what we as the creators of NSP are doing, of course,
    in asserting this, we recognize that we are putting before the fields of Psychiatry,
    Psychology, Psychotherapy, Hypnotherapy, Philosophy, Law, Science and Business
    something that seems unbelievable. Our hope is that, by this book they may see
    the vast vistas of new possibilities in research; and that they will take on the
    research into their fields. In this way, they themselves can solve the human ontological
    problems that is their inevitable lot.


    At first, we were not sure if it was doable to break anyone’s OnTEqN. It was a
    wonderful relief for us when our first tentative exploratory steps confirmed that
    it was possible. With this information, we found that when a person came to us
    with a problem state, all we needed to do was to:


    +   (a). read and evaluate his Intake Sheet very carefully

    +   (b).read him carefully

    +   (c). fine read him, to wit, adumbrate him


    With this information, we could determine his process diagnosis, pDx for his problem
    ontology. This is also his OnTEqN. In this respect, we need to note the distinction
    between pDx and Dx:'
