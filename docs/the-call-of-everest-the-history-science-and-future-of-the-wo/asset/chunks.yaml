    highest point arose in the form of a stout wooden pillar, marking the border between
    Nepal and Tibet. This was the legendary Nangpa La, the 19,050-foot (5,800-meter)
    pass located in the shadow of Cho Oyu, a peak that rises to the west of Mount
    Everest. I tied a *kata* prayer scarf to a tangle of others on the post and recited
    Buddhist mantras common to Tibetans of the Tibetan Plateau and to the Sherpas
    of Nepal to the south. Retracing my steps, I caught a fragrance that blew in gently
    from the south: pine and juniper forests warmed by the sun, melded with dust and
    incense and wood smoke from the lowlands of Nepal and the Gangetic Plain of India.


    Descending on the Nepal side of the border, I followed a maze of granite rubble
    that had been churned up and deposited on the glacier’s surface. Yaks can follow
    the scent left by previous caravans, but lone travelers must decode their way
    through the monochromatic scree. I found no sign of yak dung—every scrap had been
    thrown onto the loads of the yak trains for use as cooking fuel. And the cairns
    meant to mark the trail were just as the Tibetan traders had described them: imaginary
    piles of stones that moved and disappeared like phantoms.


