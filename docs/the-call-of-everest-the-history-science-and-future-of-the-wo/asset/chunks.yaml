    The two groups may have achieved this acclimatization by different means, however.
    For example, the Tibetans appear to breathe more than the Andeans and have more
    blood flow through the lungs, despite lower average hemoglobin levels and oxygen
    saturation values. The Tibetans appear less susceptible than Andeans to two conditions
    associated with living at high altitudes: chronic mountain sickness (CMS), in
    which the number of red blood cells increases to the point where the blood gets
    sludgy and difficult for the heart to pump it throughout the body, and high blood
    pressure in the lungs, a risk factor for CMS. Lack of oxygen may contribute over
    time to the selection of genes that help the acclimation process. Scientists do
    not know whether the Tibetans’ apparently more complete adaptation is due to the
    number of generations they have lived at high altitude. Discovering the genetic
    basis for these adaptations may help find better ways to help the body tolerate
    low oxygen levels—important for many patients—or may help identify those who will
    either do well or face high risk at high altitudes.


    ![](OEBPS/images/Anke_9781426212413_epub_056_r1.jpg)


    **1963 CLIMBER BARRY** Bishop permanently lost toes during the historic climb.
    Rates of frostbite have been reduced over the years thanks to improvements in
    equipment.


    ## SUPPLEMENTAL OXYGEN


    The use of oxygen on Mount Everest remains controversial. For years many thought
    that climbers could not survive without supplemental oxygen, but eventually Reinhold
    Messner and Peter Habeler proved otherwise in 1978. Of the more than 3,500 people
    to reach the summit of Everest, roughly 5 percent have done so without oxygen.
    Still, a climber is almost two times more likely to die while summiting Everest
    without using oxygen.


    Dr. Thomas Hornbein, a member of the original U.S. expedition to summit Everest
    in 1963, estimated the influence of supplemental oxygen. Mayo Clinic researchers
    recently modeled these results using data from the 2012 expedition and a simulated
    ascent of Everest that took place in 1985\. In that study, a team of 27 investigators
    “climbed” for 40 days as if to the summit in an altitude chamber. Results show
    that a climber using supplemental oxygen will have a hypoxic stress level at the
    summit that is lower than the one experienced at Base Camp at rest without oxygen.
    With oxygen, a climber at Camp IV trying to sleep actually maintained oxygen saturation
    levels in the mid to upper 90s, close to sea-level values. Thus supplemental oxygen
    makes a big difference, although some might say that six weeks of acclimating
    to extreme hypoxia results in muscles less able to use the oxygen being delivered.


    ![](OEBPS/images/Anke_9781426212413_epub_057_r1.jpg)


    **MARK JENKINS LEARNS** to use an oxygen mask system. At Base Camp there is only
    half the oxygen available that there is at sea level; on the summit, 33 percent.
    Five percent of people who have summited Everest have done so without supplemental
    oxygen.


    ## THE ULTIMATE LABORATORY


    Attempting to mimic extreme conditions in the laboratory is difficult, if not
    impossible. The field is the ultimate laboratory where human physiology and environment
    come together. Few atmospheric chambers can mimic true high-altitude conditions,
    complete with unpredictable temperature fluctuations and humidity levels as well
    as human factors such as dehydration, physical activity, and psychological stress.
    Field work on Everest complements the highly controlled laboratory conditions.
    The less predictable conditions in the field can lead to observations and findings
    that had not been considered or explored.


    ### 2012 STUDIES AND BEYOND


    Fifty years after the first American ascent of Everest, the names and faces have
    changed but the challenge of the climb and the passion for unlocking the scientific
    secrets of high-altitude physiology remain alive and well. Fifty years ago, the
    climbing “team” consisted of 19 members, including five with master’s degrees,
    five with Ph.D.’s, three medical doctors, and a group of experienced climbers
    and their support staff. For the studies of the medical aspects of high-altitude
    exposure, primarily cognitive and psychological measures, the study subjects were
    essentially members of the team. Support then as now was an ongoing challenge,
    but the National Geographic Society, National Science Foundation, U.S. Air Force,
    Office of Naval Research, the State Department’s Bureau of Educational Exchange
    and Cultural Affairs, the U.S. Army Quartermaster Corps, and NASA all provided
    significant funding for the 1963 climb.


    This year’s team consisted of a similar number of individuals, along with multiple
    funding sources, including substantial support from the National Geographic Society
    and The North Face company. Team members included Ph.D. physiologists and geologists,
    physicians with expertise in critical care and flight medicine (USAF), a research
    associate, carefully selected North Face and National Geographic athletes, athlete-photographers,
    videographers, bloggers, product-innovation experts with The North Face company,
    and a National Outdoor Leadership School senior field instructor.


    ### THE HIGH-REACHING GOALS


    The North Face company develops products based on feedback from the top athletes
    around the world, people who push the envelope on human performance in extreme
    and unlikely environments. This focus on human performance in extreme environments
    like Everest became the impetus for the North Face-Mayo Clinic relationship, since
    the Mayo Clinic also has an extensive history of such studies. Mayo researchers
    played a critical role in the early understanding of flight physiology and health
    countermeasures for pilots. While researchers can learn a lot from studying chronic
    disease (one end of the health spectrum), our belief is that there is also much
    to be learned from studying the exceedingly fit athletes who push the other end
    of the health spectrum.


    ![](OEBPS/images/Anke_9781426212413_epub_058_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_059_r1.jpg)


    **ELITE CLIMBER EMILY** Harrington, a member of the 2012 North Face/National Geographic
    expedition team, takes a lung-capacity test. Part of the team’s mission was to
    study the limits of performance at high elevation.


    The Mayo Clinic researchers had several goals for the 2012 Everest expedition.
    One was to better understand the limits of human performance at extreme altitudes.
    They also wanted to determine the relationship between altered sleep physiology
    (amount of REM sleep and/or the decrease in blood-oxygen levels at night) and
    altitude illness. They studied lung-fluid regulation and muscle loss, and they
    collaborated to evaluate the impact of equipment and clothing on sleep physiology
    and performance in athletes. The studies on oxygen deprivation complemented ongoing
    clinical studies at the Mayo Clinic with patients. Climbers wore devices that
    were light and unobtrusive even during difficult ascents, which allowed the continuous
    monitoring of participants 24 hours a day and gave us a more dynamic and comprehensive
    view of the body under extreme conditions. Researchers collected an estimated
    27 billion data points over the course of the expedition.


    ### WHAT WE LEARNED


    It is fascinating to realize how much what we learned about adaptive physiology
    in extreme altitudes applies to the treatment of several chronic diseases. In
    particular, our laboratory has been interested in patients who suffer from chronic
    heart failure, a condition in which the pumping action of the heart is less than
    ideal.

