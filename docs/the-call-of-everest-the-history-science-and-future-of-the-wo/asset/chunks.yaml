    It’s hard to describe the strong emotions I felt seeing Mount Everest for the
    first time. As the clouds briefly parted in the Khumbu Valley, Everest held her
    head high above the massive peaks in the foreground. Her summit pyramid was dark
    and rocky against the impossibly blue sky and, as from no other peak around, a
    massive plume of snow streamed easterly from her summit, a banner proclaiming
    to the world, “I’m the tallest, I’m the goddess mother of all that lies below.”
    Then the clouds closed in again. My Sherpa guide (a kind and spiritual gentleman
    who has stood on the summit of Everest many times) smiled generously at me with
    empathy, or amusement, or perhaps both.


    For me, the magic Mount Everest holds is the story written in her rocks. A geologist
    has to piece this story together from the fragmented manuscript that forms the
    landscape. The chapter that most interests me is recorded in the layers of gray
    marine limestone that make up the summit pyramid. That’s why I am drawn to the
    top.


    ## LIFE ON THE TETHYS SEAFLOOR


    Standing at 21,300 feet (6,500 meters) and gazing up at Everest’s southwest face
    in the brilliant afternoon sun, I watched the gray limestone of the summit pyramid
    turn a silvery gold. The Yellow Band, right below, also turned toward orange.
    The jet stream howled, sounding like the roar of a giant waterfall, but the only
    flow of water was beneath my boots—the slowly moving, frozen tongue of ice called
    the Khumbu Glacier.


    Stumbling among the rocks near Camp II, out of breath and cold, I looked for lithic
    treasure. Sometimes one can find a small piece of gray limestone that has tumbled
    down some 7,700 feet from the summit to the glacier. These rocks tell a magnificent
    story of mountain building, from seafloor to summit, that spans nearly 500 million
    years of Earth’s history—the story of how an ancient seafloor became the crown
    of the highest mountain on Earth.


    Our journey begins some 480 to 470 million years ago, on the seafloor along the
    northern coast of the great supercontinent Gondwana, to which present-day India
    was attached. Major rivers, as big as today’s Amazon, empty into the sea in broad
    deltas. Cumulus clouds build on a hazy afternoon horizon. No birds exist yet,
    but beneath the ocean’s surface there are primitive, jawless fish that browse
    for food alongside clusters of tiny, slithering, wormlike creatures. The seafloor
    is rather flat, with a few shallow banks and canyons that funnel shifting sediment
    into a deep abyss far to the north. Elsewhere, fine-grained sediment drifts in
    among the fragmented remains of invertebrate animals, resulting in carbonate sediments
    that will form the limestone and dolomite of today.


    ### ORDOVICIAN INVERTEBRATES


    This seafloor is part of the Tethys Ocean, an ancient body of water named for
    a Greek sea goddess. The patch of it in question we will call the Chomolungma
    shelf (or simply CS), after the centuries-old Tibetan name for Mount Everest.
    The seafloor at CS hosted a marine ecosystem teeming with life. If we followed
    a shaft of sunlight as it penetrated the upper marine layer, the sea shelf would
    have been revealed in dim, ever diminishing light. The water was somewhat cooler
    at these depths, but certainly not cold. Based on microscopic studies of rocks
    brought back from the summit of Mount Everest, we can infer that the seafloor
    at CS consisted not of clay mud but rather small pellets of carbonate mud excreted
    by a wide array of marine invertebrate animals. When these creatures eventually
    died, their exoskeletons contributed to the accumulation of carbonate sediment.


    A large variety of trilobites scurried across this seafloor. Some spiny trilobites
    preferred to move about on the surface to scavenge food, whereas more robust varieties
    burrowed into the soft sediment to find their food. Ostracoda is a class of the
    Crustacea, sometimes known as “seed shrimp.” Their tiny bivalve shells resembled
    a small clam, and most ostracods lived on the seafloor or within the first layer
    of sediment. Brachiopods, with their distinctive symmetrical shells, diversified
    markedly during this geologic period to form an important part of the bottom-dwelling
    community. Crinoids were also extremely abundant on the seafloor, forming vast
    communities of “sea lilies” attached to the seafloor by a flexible stem or stalk.
    Crinoids were filter feeders that used delicate, featherlike “arms” to capture
    their food from the warm oceanic currents that flowed along the bottom. Crinoids
    became so common that their skeletal parts formed incredible thicknesses of limestone.
    In addition, corals were found on the seafloor, since the period saw the ascendancy
    of massive coral reef communities in tropical oceans around the world. Stromatoporoids,
    a group of extinct sponges, also flourished in these reef communities. With all
    these species, it was a healthy, thriving, unpolluted marine ecosystem—a prolific
    biogenic factory of marine carbonate rocks that, someday in the far distant geologic
    future, would be uplifted to the highest realms on Earth.


    ### THE GREAT BIODIVERSITY EVENT


    These rocks were deposited during the Ordovician period, 488 to 444 million years
    ago, when life-forms diversified and became more complex—the most dramatic increase
    in marine biodiversity in Earth’s history. Known as the Great Ordovician Biodiversity
    Event (GOBE for short), marine biodiversity tripled at the order, family, genus,
    and species level. The few seafloor-dwelling invertebrates that dominated were
    replaced by a diverse array of more complex marine animals during the GOBE.


    Several geologic factors may have contributed. Four major continents existed during
    the Ordovician: Gondwana (to which India was attached), Laurentia, Baltica, and
    Siberia. The broad dispersal of these continental plates resulted in more surface
    area for tropical shelves around their margins. In addition, rising sea level
    across the globe contributed to flooding of inland seas, which resulted in more
    shallow marine habitats and increased carbonate deposits. Added to this, Earth
    climates warmed during the early to mid-Ordovician, encouraging an increase in
    micro-phytoplankton, which may have provided a major nutrient source at the base
    of the food chain for marine invertebrate animals.


    During the GOBE, a vast diversity of suspension-feeding and other organisms came
    to dominate the oceans and continued to do so throughout the remainder of the
    Paleozoic era. We see evidence of this atop Mount Everest, and it is somehow fitting
    that such a great evolutionary event is recorded by the highest outcrop on the
    highest mountain on Earth today.


    ## THE DISCOVERY OF EVEREST


    One of the most ambitious scientific undertakings of all time occurred during
    the first half of the 19th century on the hot and humid plains of India. British
    explorers began the Great Trigonometrical Survey of India in 1808 with the ambitious
    task of determining the precise shape of the Earth, in addition to surveying the
    vast Indian subcontinent. Although the shape of the Earth had been determined
    in the mid-1700s by two French surveying expeditions, the precise degree of equatorial
    bulging and polar flattening remained a question. The British India Survey consumed
    the greater part of the century and employed some of the best mathematicians in
    the empire. The surveyor and mathematician in charge of this enterprise was William
    Lambton, a British Army officer who gained much of his early surveying experience
    in North America. Surveying equipment of the time was heavy and enormous, consisting
    of calibrated chains, measuring rods, and massive theodolites. Malaria, torrential
    monsoon rains, and tiger attacks tormented the British surveyors and their Indian
    staff, but they diligently carried on.

