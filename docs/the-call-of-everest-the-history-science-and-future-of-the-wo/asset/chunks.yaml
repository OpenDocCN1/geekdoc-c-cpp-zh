    **A SCOUTING PARTY** during the 1963 American Mount Everest Expedition appears
    as small figures in the foreground of Everest’s forbidding West Ridge. The group
    inspects part of a new route that will be used by Willi Unsoeld and Tom Hornbein
    to reach the summit.


    # ![](OEBPS/images/Anke_9781426212413_epub_003_r1.jpg)


    In the spring of 2012 the National Geographic Society and The North Face sponsored
    the Legacy Expedition to Everest. Its goal and that of a companion expedition
    sponsored by Eddie Bauer was to revisit the 1963 American Mount Everest Expedition’s
    journey nearly half a century before, with teams ascending from both the South
    Col route and the West Ridge. The plan, like ours in 1963, was to meet on the
    summit, with the West Ridge climbers descending, as did Willi Unsoeld and I, by
    the South Col route. Though the South Col part of this plan succeeded during one
    of the two brief windows of tolerable weather, excessive rockfall and poor snow
    conditions on the West Ridge made it too hazardous. This year’s was not an uncommon
    experience; the success rate on this route over the past half century has been
    around 10 percent of about 60 attempts, and the chances of dying have proved to
    be about the same as those of reaching the summit.


    This book, *The Call of Everest*, also celebrates that same 50th anniversary of
    the first American expedition to climb Everest (and also the 60th anniversary
    of the first ascent of Everest by Sir Edmund Hillary and Tenzing Norgay). This
    volume is a natural for the National Geographic Society, which was a major supporter
    of the 1963 American Mount Everest Expedition (AMEE), not least because of the
    participation of one of their own, Barry Bishop, who was on the team both as climber
    and photographer. His photo of two tiny figures, Willi Unsoeld and me, on the
    crest of the West Shoulder, dwarfed by the mountain soaring seductively above
    captures for me the essence of what our West Ridge adventure was about—savoring
    uncertainty.


    The AMEE was successful almost beyond our wildest dreams. On May 1 Jim Whittaker,
    along with Sherpa Nawang Gombu, became the first American to summit Everest. Three
    weeks later four more followed. Lute Jerstad and Barry Bishop topped out by the
    South Col route midafternoon on May 22\. A tad tardy, at 6:15 p.m. Willi and I
    completed the first ascent of the West Ridge (via what Willi liked to refer to
    as Hornbein’s avalanche trap, now known as the Hornbein Couloir). We headed down
    the South Col route, catching up with Lute and Barry, and we four finished it
    all off sitting out the night together above 28,000 feet in an unintended bivouac.
    We were very lucky to have survived the night and lucky that Willi and I had been
    able to pull off the first traverse of a major Himalayan peak.


    Our ascent of a new route on Everest was a predictable stage in the evolution
    of humankind’s relationship with mountains. The underlying theme of this quest
    is to perpetuate uncertainty: First we identify a goal worthy of our dreams, then
    figure out how to get to its base, and finally seek a way to its top. Once the
    mountain has been “conquered” (an abominable term), the next challenge is to find
    new paths to follow. This stage also begins to encompass style and, on Everest
    in particular, climbing without the aid of supplemental oxygen. Later in this
    evolution new uncertainties are added, like skiing or parachuting from the summit
    to be down in time for tea. Inevitably, as the human-mountain relationship reaches
    maturity, the advent of guided climbing brings less experienced aspirants to enjoy
    a taste of ultimate adventure.


    Though none of this evolution is unique to Everest, what is unique is the explosion
    in numbers seeking to be guided to the top of the highest point on Earth. Everest
    is being loved to death. But it’s not the mountain that’s dying.'
