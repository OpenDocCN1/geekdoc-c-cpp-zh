    `CONRAD ANKER ORGANIZES` 在大营整理物资，登山者在这里花时间适应海拔，然后为冲顶做准备。作为团队领袖，他不仅要面对物流问题，还要做出艰难的决定，例如何时尝试冲顶以及何时等待。


    大吉·惠特克（Big Jim Whittaker）虽已 83 岁，但依然精神矍，他依然相信珠穆玛峰的魔力。


    “在我站在顶的第二天，我们收到了肯尼迪总统的电报，”惠特克说道，随后背诵道：“感谢你们将人类的耐力和经验推向最远的边界……我知道所有美国人都会和我一起，向我们勇敢的同胞致敬。”


    1963 年 5 月 1 日，大吉在尼泊尔夏尔人纳旺·贡布（Nawang Gombu）的陪伴下，成为第一个登上珠穆玛峰的美国人。他们走的是南柱路线，这条路线是十年前新西兰人埃德蒙·希拉里和夏尔人丹增·诺尔盖在首次登顶珠峰时开辟的。三周后，以一次前所未有的大胆尝试，惠特克的队友汤姆·霍恩贝（Tom
    Hornbein）和威利·昂索尔德（Willi Unsoeld）爬上了一条完全未知的路线——西脊。就在同一天，巴里·毕肖普（Barry Bishop）和鲁特·杰拉斯塔德（Lute
    Jerstad）完成了美国人的第二次登顶南柱路线。两支队伍成功会合了，但那时已经是深夜，他们被迫在海拔 28,000 英尺处露营。在没有帐篷、睡袋、炉子、氧气、水或食物的情况下，没有人相信他们能活下来。


    “上帝，他们太幸运了，”惠特克说，“如果当时有任何风，他们都会死掉。那将太可怕了！”


    所有四个人都幸存了——尽管昂索尔德和毕肖普丧失了 19 个脚趾和两个手指——1963 年的探险队成了一个美国式的英雄成功传奇故事。


    ## 珠峰 50 年后


    五年后，如山般高大的吉姆·惠特克正走向这座世界最高峰，纪念那次远征的成就。我们在风中的路径上相遇，随后在费里村（Pheriche）坐下，那里是通往大营途中一个尘土飞扬的游客村庄。


    “尽管希拉里已经爬过南柱，但那里什么也没有，”惠特克回忆道，“我们必须睁大眼睛爬。我们知道必须穿过冰川瀑。我很讨厌那里。那是杰克去世的地方。但我们必须在那里开辟一条路线，我们确实做到了。在更高的地方，我在洛子峰壁工作了三周来开路。我们领领路线，然后固定了自己的绳索。”当我回答说现在的珠峰已与当年不同，现在是夏尔人从大营到顶峰固定线路，且
    95%的登山者都是客户时，他点了点头，乐观的神情未减。


    “我依然敬佩那些登上珠穆玛峰的人。那是艰苦的工作，而且仍然存在危险，”惠特克说，“在某种程度上，我认为他们得到的和我们当年得到的一样。他们正在了解身体的极限。大自然在教他们。他们正在学习我们星球的美丽，也许这会让那些混蛋去保护它。”


    ### 奖杯之争


    珠峰的商业导览始于 20 世纪 90 年代初，与一百多年前阿尔卑斯山的登山协助并没有太大区别。马特洪峰 99%的登顶都是向导登山。（今天，大多数著名山峰——白布朗峰、雷尼山、丹纳峰、乞力马乔罗——的登顶都是向导。）南池巴扎已成为喜马拉雅山的采尔马特，而夏尔人像之前的瑞士人一样，从游客、徒步者和登山者的涌入中获利丰厚。尼泊尔政府也是如此，他们向每位珠峰登山者收取
    1 万美元的峰顶费。惊讶的是，珠峰客户登山者的急剧增加，导致攀登这座山的统计风险也随之急剧下降。回到 1986 年，当我第一次带领一支优秀的登山者团队尝试珠峰时（我们在北坡到达
    8,000 米处被雪崩击退折回），如果你是登顶者，你有大约 10%的死亡率——比打仗的概率还糟糕。现在不到 2%。


    惠特克本人曾是一名向导，他以对珠峰商业化的积极观点结束了我们的交谈：“人们付 10,000 美元爬珠峰完全没问题。支持他们吧。他们可能会在非洲杀死灭危物种，只为了某些恶心的布恩和克克莱特奖杯。”


    奖杯。这个词会像刺根一样扎在我心里，直到那次远征结束。


    ## 声音


    ### 传承使命


    在我出生之前，珠穆玛峰就是我的一部分。我的父亲巴里·毕肖普于 1961 年首次前往尼泊尔，参加了埃德蒙·希拉里爵领导的阿玛达布拉姆（Ama Dablam）银小屋探险活动。那在我出生五年前。团队在明波冰川海拔
    18,000 英尺处过冬，收集了将成为高海拔生理学开创性研究的数据。我的母亲莉拉（Lila）带领了她从加德满到珠峰大营的首次徒步支持 1963 年的美国珠峰远征，从那以后一直带领高海拔徒步。珠穆玛峰在许多方面都成为我们家无意识的基石：这坐山通过父亲
    1963 年的登顶定义了他的登山生涯，终身的友谊围绕着这坐山建立，无数由珠峰聚在一起的人们开启了冒险。我小时候时，我们家人在尼泊尔的山区里帐篷里住了两年，而现在我们已经在喜马拉雅地区工作、徒步和登山了
    50 年。我根本不记得没有喜马拉雅山曾织入我们生活的时光。


    我的父亲是美国珠峰远征队（AMEE）的成员，我很幸运能追随他的足迹，分别在 1994 年和 2002 年登顶珠穆玛峰，并在 2012 年春季尝试从西脊登顶。今年
    5 月是美国人首次登顶珠穆玛峰 50 周年。


    ### 在珠峰中成长


    与其说我选择了珠峰，不如说是珠峰选中了我。我的父亲是国家地理学会的摄影师兼科学家，也是一位著名的登山者——他是我的英雄。在他样的家庭长大对我留下了不可磨的影响。我记得小时候看《美国人登珠峰》，那是国家地理制作的第一部电视节目。它记录了美国人首次登顶那座山，由奥森·威尔斯旁白。我被征服世界最高峰的宏伟冒险所迷住。


