  trans: '

    在 20 世纪 80 年代初，我亲身体验了与当地人交流的危险。我没有考虑到请求许可，就开始安装我的土壤侵蚀研究样地，并对库姆琼（Khumjung）和昆德（Kunde）村庄上方的山坡剖面进行测量。很快，我的绳索栅、雨量计、沉积物收集槽和其他仪器在晚上被毁了。当地人看到我在工作，并断得出结论，认为我是一个测绘员，企图夺走他们的土地。一次村会议解决了这个问题，我的样地此后再也没有触碰过。（尽管如此，我偶尔会发现年轻的雅牛牧民在我的雨量计里撒尿，我将其视为一种常见的顽顽作剧。）


    根据我来自昆德村的同事安格·里塔·谢尔帕（Ang Rita Sherpa）所说，今天许多过去的态度已经改变，这很大程度上是因为公园的运营变得更具包容性。（他的父亲明马·哲青宁·谢尔帕（Mingma
    Tsering Sherpa）是埃德蒙·希拉里的主要施工主管，很大程度上负责在该地区建造学校、跑道和医院。）当地居民现在对南姆切巴扎（Namche Bazar）上方坡地上重新建立的蓝松和杉树森林感到自豪。姆贾谷上高山带的大多数山屋主是昆布布高山保护委员会（Khumbu
    Alpine Conservation Committee）的活跃成员，该委员会帮助禁止了采集灌木杜和其他植物作为木柴。社区现在报告说对公园有了更强的自豪感和主人翁感。


    ## **声音**


    ### 滑雪珠峰


    每个人都知道，珠峰的登山季节是在春天。


    通常情况下如此。我已经有点不同，因为我总是想在我爬上的任何一座山上滑雪*下去*，所以在我在开始规划时并没有去遵循常理。


    我的理论是，夏季季风季节会带来大量降水，我希望这能转化为季风后季节山上更多的雪，这样我就可以滑雪了。我也知道，在过去的六年里，尼泊尔侧只有两次在季风后季节尝试过登顶。一个几乎没有其他人的珠峰形象对我来说是一个巨大的吸引。


    事实证明，我们是**山上唯一的人类**。


    考虑到安全和自然规律，我和我的丈夫罗伯（Rob）以及我们的亲密朋友吉米·钦（Jimmy Chin）组成的小型滑雪队在离开大营之前商定了优先事项：1. 爬上去。2.
    滑下去。3. 记录下来。


    2006 年 10 月 18 日，我们三个人确实从顶顶滑下，尽管包括罗伯在内的几名成员在希拉里台阶（Hillary Step）耗尽了氧气，因此为了不出现在晚间新闻中，我们将滑雪板背在背包上，从希拉里台阶到四号营的大部分路程都是下走的。在南脊（South
    Col）度过一个计划之外的夜晚后，吉米、罗伯和我在帐篷外穿上滑雪板，开始从四号营到西冰斗（Western Cwm）的直线路线下降。


    通常，我们这些还着的滑雪登山者会养成“爬什么滑什么”的习惯，但洛子峰壁（Lhotse Face）的这段坡面是个例外。在登山过程中攀爬它将带来不必要的风险，可能会危及我们第一个目标的成功——仅仅是爬上去。


    ### **下行的进展**


    当我们 10 月 19 日上午 9 点离开四号营时，洛子峰壁（Lhotse Face）的这段坡面变得陡峭。在登山过程中攀爬它将带来不必要的风险，可能会危及我们第一个目标的成功——仅仅是爬上去。（注：此处正文“在南脊度过一个计划之外的夜晚后，吉米、罗伯和我在帐篷外穿上滑雪板，开始从四号营到西冰斗的直线路线下降。”之后，注：由于原文文本似乎存在部分逻辑重复或罗乱，翻译已根据逻辑处理）……通常，我们这些还着的滑雪登山者会养成“爬什么滑什么”的习惯，但洛子峰壁的这段坡面是个例外。

    [/content]


