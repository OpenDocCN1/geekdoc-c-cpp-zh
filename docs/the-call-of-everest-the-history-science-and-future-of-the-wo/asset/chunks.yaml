    -30° and -40° centigrade. Chances of survival? Well, actually, not too bad. The
    afternoon blizzard had subsided and the air was still …


    Although I never planned, or wanted, to bivouac on Everest, the grim possibility
    had always been lurking there, unspoken. I had thought very carefully about all
    my layers of clothing. And I now I took care to pad hips and head with spare mittens—token
    wads of extra insulation between my bones and the insidious creeping cold. I also
    plunged my long ice axe into the snow as a fence post to stop me rolling over
    during the night.


    There is a myth that if you fall asleep in these situations you never wake up … I
    think at one point I did actually slumber for a while, and I didn’t die. Mostly
    though I was in semi-conscious limbo, drifting through a fog of half-rational
    associations … Occasionally my rational consciousness would jolt me awake and
    banish the phantoms. I forced myself to chew some almond Hershey bar—must be some
    calories there. I sucked the last semi-frozen trickle from my water bottle. I
