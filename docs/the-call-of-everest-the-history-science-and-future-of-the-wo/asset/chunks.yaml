    # ANG RITA SHERPA


    The senior program manager of The Mountain Institute’s Asia (Nepal) Program, Ang
    Rita Sherpa works on ecotourism and sustainable development.


    ## PAST WAYS


    In 1963, Sherpas led lives vastly different from today. “Most Sherpas bathed only
    once a year—at the start of the monsoon, during a two-week period known as `Maal-chu`,”
    recalls Sange Dorjee, who now lives in Wyoming. “Before the summer festivals we
    washed virtually everything—clothes, personal items, and our bodies. It had a
    wonderful purifying effect.” `Maal-chu` is followed by the festival of Phang-ngi,
    in June—when the `naks` (female yaks) and cow-yak crossbreeds produce the richest,
    most delicious milk, which is churned into `phangmar`, an exceptionally rich butter.


    Kancha, of Namche—a veteran of the 1953 and ’63 Everest expeditions—rec making
    countless trading trips with yak trains to Tibet. Since then the flow of people
    and goods has reversed direction. “Sherpas used to endure hardship to make a small
    amount of money from the Tibetans. Now poor Tibetan traders climb over the Nangpa
    La to earn a small amount of money from us.” But trade between Khumbu and the
    Tibetan Plateau may have entered a long slide. Sherpas can get all the (iodized)
    salt they need from India. And the Tibetans are connected by a paved road to the
    rest of Tibet, and China.


    There are barely enough yaks in Khumbu to form a trading caravan, anyway. The
    word for “yak” used to be synonymous with the term for “wealth,” and the families
    who owned the most yaks were the richest and most respected people in Khumbu.
    In an about-face, they are now the poorest. The youth needed to herd yaks have
    realized that foreign visitors are easier to care for than livestock, and tourists
    don’t need attention year-round.


    “Sherpas fear that the day will come when we no longer raise yaks,” says Ang Rita.
    “When I was young, 16 families from my village—Khumjung—raised yaks. Now only
    three do.” It’s no longer profitable to keep yaks for seasonal load carrying,
    or for milk. Most milk now comes from outside Khumbu; powdered varieties from
    Holland and Denmark are preferred.


    Many young Sherpas have forgotten—or aren’t keen to speak—their tribal languages.
    In Sherpa homes in the cities, Nepali, English, and Hindi are becoming more frequently
    spoken than the native Sherpa tongue. The culture, and attachment to it, remain
    strong, but so are opportunities and distractions. Partly through cinema and satellite
    television, Sherpa youth have seen extraordinary, beguiling new worlds. The existence
    of these bountiful lands has been confirmed by newly rich relatives’ tales of
    odysseys to the West.


    Education and wealth mean that many Sherpas can hire lowlanders to till their
    fields and harvest their barley and potatoes. They no longer need to carry loads,
    guide trips, or even run their trekking lodges. Increasingly, they lease their
    wayside inns to lowlanders of ethnic groups with names such as Rai, Tamang, and
    Gurung—many of whom are perfectly happy to quietly adopt the higher“Sherpa” name
    as their own.


    ## PRESENT CHALLENGES


    In a development that is slowly tugging at the fabric of their culture, Sherpas
    have come under pressure to sell their family tracts to outsiders. Nepal forbids
    discrimination in the sale of land, so the Sherpas are obliged to honor reasonable
    offers. Preserving Sherpa cultural heritage in this context is difficult, however,
    because the lowlanders have no historic link to the deity-animated landscape,
    to the valley’s sacred sites, or the forests and pastures that have been stewarded
    for generations.


    Modern life has introduced modern challenges. Ngawang Karsang, a former doctor
    at Kunde, links some of the current diseases and afflictions to changing socioeconomic
    conditions.


    “In the 1960s and ’70s, alcoholism was common,” he says. “Expedition Sherpas would
    drink before the expedition to get their courage up, then drink after the expedition
    to celebrate.” Recently, however, he has noticed higher incidences of obesity,
    diabetes, heart attacks, hypertension, and strokes. Packaged, processed foods
    have found their way into Khumbu—indeed, into many high Himalayan valleys.


    ## PRESERVING SHERPA WAYS


    Some Sherpas, concerned by these losses of tradition, have made laudable efforts
    to preserve them. Former park warden Lhakpa Norbu has written a book documenting
    Sherpa ceremonies and material culture, and he is co-authoring a Sherpa language
    dictionary with the Tengboche Lama. Likewise, a young man named Lhakpa Sonam has
    turned a traditional house, furnished with original brass and wooden utensils,
    into a museum—even though many similar houses remain in active use. Other Sherpas
    have established funds and foundations that channel support for preserving monuments.


    Meanwhile, in a village in Japan, an exact replica of the Takshindu monastery
    has been constructed by five Sherpa carpenters; the Tengboche Lama and a group
    of his monks traveled there to consecrate the structure and perform the traditional
    Mani Rimdu dance-drama ritual.


    Khumbu has enjoyed a fragile cultural and environmental balance for decades. But
    the late Trulshig Rinpoche, abbot of Rongphu monastery in the 1940s and ’50s,
    long ago predicted that much attention would be focused on Everest, and that people
    would “suffer hardship as a result of negative deeds generated in her vicinity.”
    The Tengboche Lama, too, has suggested that the noise and the fumes of helicopters
    can disturb the deities of the hidden valley, which can result in calamities.
    Helicopter and plane crashes occur with greater frequency—though this could be
    attributed to the greatly increased air traffic.


    Yet the land and people are remarkably resilient. Some of those who deeply respect
    the Buddhist traditions also regard the conservatism of the high lamas as antiquated
    in the modern age. At the same time, the monasteries benefit from the wealth that
    tourism and new enterprises have generated in their communities. Remarkably, the
    enrollment of monks and nuns has not declined over the past few decades.


    ## SHERPAS IN AMERICA


    The first Sherpas to visit the United States came on a State Department-sponsored
    goodwill tour that was tacked on to the 1963 American Mount Everest Expedition.
    The five wide-eyed high-altitude Sherpas began their trip at the White House,
    where President Kennedy awarded them (and the American team members) National
    Geographic’s Hubbard Medal.


    A generation later, descendants of several of the 1963 Sherpas have settled in
    America, where they are thriving. Typically, Sherpas land first in Queens, New
    York. They drive taxis, wash dishes, or pump gas—entry-level jobs on a socioeconomic
    ladder formed of ambition and hard work. A number now work as commercial airline
    pilots, doctors, and businesspeople.


    Everest gave the Sherpas a towering head start. But few have returned to Nepal,
    which still suffers an unstable political and business climate. Over time, this
    one-way emigration trend may reverse as new opportunities arise in the natural-
    and tourism-resource-rich Himalaya.


    Already a handful of Sherpas have questioned whether relocating to the U.S. is
    the right choice. “I think some of us are becoming too much like Americans,” says
    Daya Yangji Sherpa, a resident of Jackson Heights. “Now divorce has happened among
    Sherpas here—and it can be bitter and expensive, with lawyers getting involved
    endlessly. It’s crazy.”

