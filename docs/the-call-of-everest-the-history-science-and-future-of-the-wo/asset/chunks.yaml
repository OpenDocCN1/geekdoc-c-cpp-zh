    该保护区的一个重要文化特征是绒布寺（藏语：Dza Rongpu），这是一座位于珠穆朗玛峰山脚下主要扎卡珠河谷的藏传佛教寺庙。该寺庙被认为是世界上最高的寺庙，海拔
    5,060 米，位于绒布冰川附近。它通过第一批英国珠穆朗玛探险队的报道而为人知，这些探险队在前往海拔 5,364 米大本营的途中经过了这条河谷。


    几年前，中国官员曾考虑过关闭该地区的登山和旅游业，以便让景观有机会从几十年来不受监管的探险旅游中恢复。。尽管这里地处偏远且游客较少，但垃圾堆积以及为了燃料不可避免地焚烧脆弱的灌木柏松已达到无法接受的水平。然而，这些限制并未实施，无论好坏，大本营地区一直对外国游客开放。


    ![](img/Anke_9781426212413_epub_032_r1.jpg)


    一名登山者在珠穆朗玛北侧的东绒布冰川上巨大的冰塔前行走。


    ## 几十年的变化


    在 20 世纪 70 年代和 80 年代，昆布地区经常被用作土地管理不善的案例。当时的科学和科普文章宣称，该地区正遭受着严重的森林砍伐，这归因于人口增长、20
    世纪 50 年代初藏族难民的涌入、增加且不受监管的旅游业，以及传统谢尔人自然资源管理实践的崩溃。一位被广泛引用的人类学家在 1975 表示：“村庄附近的森林已经遭到严重枯竭，特别是在南切巴扎附近，1957
    年还郁郁葱葱的整个山坡现在已寸草不生，村民们不得不去往越来越远的地方收集干柴。” 另一句经常被引用的话是：“在过去的二十年里，（昆布地区）发生的森林砍伐比之前的
    200 年还要多。”


    与此同时，一个规模小得多但声音同样响亮的群体持有完全相反的观点。“现在昆布的树比 1950 年时多，我有照片可以证明这一点，”美国医生、高海拔专家、1953
    年 K2 探险队成员以及 1950 年珠穆朗玛地区首批外国游客之一的查尔斯·休斯顿说道。


    ### 施奈德的记录


    谁是对的？为了寻找答案，我转向经历过的最好的导师之一，顺便说一下，我从未见过他：奥地利登山家兼地图绘制埃尔温·施奈德（Erwin Schneider），他在
    20 世纪 80 年代后期去世。在 1955 年至 1963 年间，施奈德完成了对昆布地区的野外调查，其中包括使用了地面摄影测量技术——通过从高海拔视角拍摄的照片确定物体的几何属性并制作地图。他的相机巨大且沉重，现在收藏于因斯布鲁克斯的奥地利阿尔卑斯俱乐部。他在
    50 多岁时亲自背着这台相机和同样沉重的三脚架，经常攀爬 5,500 米以上的半技术性山峰和岩脊以拍摄一张特定的风景照片，当我得知施奈德在 20 世纪 30
    年代曾是奥地利顶级登山家之一时，这并不令人意外。


    1984 年，当住在昆布时，瑞士地质学家丹尼尔·武伊沙尔（Daniel Vuichard）给了我包施奈德在 20 世纪 50 年代拍摄的照片。我立刻意识到这些照片提供了一个通往过去的宝贵窗口，可能有助于解决关于自那时以来景观变化的争议。当时我并不知道在在后的
    30 年里，我将追随施奈德的足迹，复制他拍摄的村庄、山景和冰川照片。


    在 1984 年的空闲时间，以及在 1995 年、1999 年、2001 年和 2007 年启动的研究考察期间，我复制了数十张施奈德的照片。通过这种方式，我能够将自己的研究结果加入到景观退化的讨论中。这样，我能够为景观退化讨论增添自己的研究成果。早在
    1984 年，我很清楚查尔斯·休斯顿是对的：南切巴扎上方的山坡在世纪 50 年代是郁郁葱葱的，30 年后基本没有变化。在 90 年代，周围谢尔人村庄和昆布河谷的森林覆盖率事实上正在增加。


    ![](img/Anke_9781426212413_epub_033_r1.jpg)


    南切巴扎，在 1973 年（上）和 2008 年（下）的照片中显示，自谢尔人建造石屋以来已经发生了增长。现在是多层建筑，屋顶布满了卫星天线，这里是珠穆朗玛和昆布山谷的门户。


    ### 重摄影


    复制施奈德、休斯顿等人在 50 年代拍摄的照片，使我能够追踪珠穆朗玛大本营步道谢尔人村庄的巨大增长，包括建筑材料的完全改变。重拍照片还提供了一个独特的机会，来展示该地区景观的动态。通过对比新旧照片，很容易看到期间发生的破坏性冰湖溃决洪水（GLOFs`）、滑坡和洪流。


    ## 变化的冰川


    过去与现在的照片还有其他用途。2007 年秋季，我正在攀登昆布科拉上水区海拔 5,500 米处陡峭且危险的石石阵。组成洛峰（珠穆朗玛的邻近峰）南面的陡峭且广阔的山脊在我面前向上延伸了数千米。由于我的海拔相对较低，珠穆朗玛峰被遮住了。前一天晚上的一场小雪将通常的攀爬变成了半技术性且相当危险的攀登。最后，我意识到在这种情况下继续前进是愚蠢的。我向我的研究助手、两次登顶珠穆朗玛的帕玛·泰玛谢尔人示意停止。我们的海拔位于埃尔温·施奈德为标记照片位置而建造的石堆下方
    100 米，对于目标来说已经足够了。对比旧照片和我眼前的景色显示了短短 60 年间的剧变。我曾希望重拍的昆布冰川消失了，被一个长近半英里的湖泊取代。像房子一样大的冰从从冰川崩落，现在在水中无目的地漂浮。冰川融化了，留下了一个巨大且潜在危险的湖泊。


    ![](img/Anke_9781426212413_epub_034_r1.jpg)


    冰川学家弗里茨·米勒（Fritz Müller）在 1956 年调查并拍摄了珠穆朗玛周围的冰川，为今天研究冰和气候变化提供了关键数据点。在这里，米勒和助手们在
    18,000 英尺（5,500 米）以上的海拔观察珠穆朗玛峰（左侧黑色斜坡）。


    ### 米勒的记录


    '
- fmt: '

    The previous year my mentor, Jack Ives, had given me a box of old photographs
    collected by his friend and colleague Fritz Müller. Müller, a Swiss-Canadian glaciologist,
    was the scientific team leader of the 1956 Swiss Everest expedition. When the
    climbers went home, he stayed on for nine more months, living above 5,000 meters
    (a high-altitude record at the time) and studying the glaciers with his Sherpa
    assistants. Although exceptionally strong, Müller had died of a heart attack in
    1980. In the confusion following his early death, most of his photographs were
    lost, but one box was saved, full of 35mm contact sheets only. Over time I was
    to discover that in addition to notes, rock rubbings, pressed plants, letters,
    and telegrams, the box also contained photographs of two other noted climber-scientists,
    Sir Charles Evans and my personal hero, Erwin Schneider. Evans was the deputy
    director of the 1953 British expedition that successfully put the first humans
    on the summit of Everest, Edmund Hillary and Tenzing Norgay, and were it not for
    a failed oxygen system, he might have arrived there first.


    Since then, a number of glacier inventories have been conducted, largely accomplished
    by using satellite images as the primary data source. In 2007, very few on-the-ground
    field studies had been conducted. This struck me as odd, given all the media statements
    about climate change in the Everest region. None of these studies, as it turned
    out, was based on actual fieldwork or in collaboration with local people. It thus
    became even more important to retrace the footsteps of Evans, Müller, and Schneider,
    climbing up and over the glaciers to their photo points and documenting what had
    changed.


    ## Retracing Footsteps


    Finding the places where the original photos were taken was the first challenge.
    The global positioning system (`GPS`) did not exist when Müller, Schneider, and
    Evans took their photographs, and no records of their geographical coordinates
    remained. But we were usually able to find most of the photo points through a
    combination of our own familiarity with the landscapes, the suggestions of climbing
    guides and yak herders, and luck (although where some were taken mystifies me
    to this day). I also decided that the golden rule for finding the exact locations,
    especially for Erwin Schneider, was to always go higher than I expected. Nothing
    was “good enough” for these early scientists, and they always went for the best
    views regardless of the difficulties involved in getting there. Several proved
    impossible to reach because of climate-related changes that had occurred in the
    interim. In some cases massive ice avalanches blocked the original trail. Certain
    glaciers that had been solid and healthy in Müller’s day were now melting rapidly,
    making them hazardous to climb upon. One or two other opportunities had to be
    abandoned because, if truth be known, Erwin Schneider was simply a stronger climber
    than I am.


    Receding glaciers and new glacial lakes were not the only changes I studied. The
    Imja Glacier, we determined, had melted so rapidly because it had been covered
    by a thin layer—half a meter or so—of soil and rocks (a geologist would call it
    a “debris-covered glacier”). The debris would heat up during the day and transfer
    the heat directly to the ice below. Glaciers become debris-covered when their
    forward movement stagnates, occurring in the Everest region since the end of the
    Little Ice Age in the late 1800s. Over time, boulders, rocks, soil, and other
    debris from the valley and glacial moraines cascade down and cover the ice. A
    very thick cover of debris, with boulders up to the size of small houses, tends
    to insulate them from the sun’s heat. But the glaciers we observed had ablated,
    or lost mass. An abundance of new, small, meltwater ponds now appear on their
    surfaces, and any exposed glacier ice has melted away.


    Dozens of smaller glaciers below 5,200 meters were gone altogether. Their low
    altitude and lack of protective debris cover apparently made them more susceptible
    to the region’s warming trends. Ice above 7,000 meters, however, appeared to be
    remaining relatively stable, since temperatures there remain below freezing for
    most of the year. Such high-elevation ice and glaciers with north-facing aspects
    appear to have changed little during the past 60 years. Warmer, south-facing regions
    tended to show more signs of melting and loss of ice, and yet glaciers on the
    north side of Everest are melting faster, in part because the north side receives
    far less annual precipitation.


    In summary, I discovered firsthand that climate change is happening, even in the
    world’s highest mountains. Glaciers are melting, new lakes are forming, snow lines
    are receding to higher altitudes, and weather patterns are becoming unpredictable.


    ## Glacial-Lake-Outburst Floods (GLOFs)


    Concerns have been raised about the impact of these changes on future water supplies
    in the Hindu Kush-Himalaya region, as well as the increased likelihood of glacial-lake-outburst
    floods. As with Imja, dozens of new glacier lakes holding hundreds of millions
    of gallons of water have been created in the Khumbu region since the early 1960s.
    Usually contained by dams of loose boulders and soil, these lakes present a risk
    of glacial-lake-outburst floods, triggered by swift lake-area expansion, seepage,
    changes in the lake’s water level, and surge waves caused by rockfalls, rock slides,
    or ice calving. GLOFs unleash stored lake water, often causing enormous devastation
    downstream that can include high death tolls as well as the destruction of valuable
    farmland and costly infrastructure such as hydroelectric facilities, roads, and
    bridges. The 1985 Langmoche outburst in Sagarmatha National Park, for example,
    destroyed the two-million-dollar Thami hydroelectric facility that had just been
    completed, hundreds of acres of cropland, and dozens of bridges downstream. The
    1998 outburst of the Tama Pokhari in the Hinku Valley of Makalu-Barun National
    Park in Nepal destroyed trails and seasonal settlements for more than 50 miles
    downstream, and the damage is still visible in satellite images taken a decade
    later.


    ## A Changing Cultural Landscape


    As the Greek philosopher Heraclitus stated, “Nothing endures but change,” and
    the Khumbu region of Nepal is no exception. Largely fueled by the phenomenal growth
    of tourism, the solitude of the Khumbu region has been altered in ways unimaginable
    to most Sherpa people 30 years ago. Perhaps most striking are the changes in both
    the number and design of houses, lodges, and shops. Between 1950 and 1973, Namche
    Bazar was a sleepy little village of traditional Sherpa stone houses with split
    fir shingles for roofs. Now it is wall-to-wall, two- to three-story candy-colored
    lodges built specifically for tourists. Each year they ascend higher up the slopes
    of the bowl-shaped locality, and one awakens and goes to sleep at night to the
    chink-chink-chink sound of stonecutters squaring off building stone for yet another
    lodge. The same is true for nearly every village located on the main trekking
    trail to the Everest Base Camp, including Kunde, Khumjung, Tengboche, Deboche,
    Pangboche, Pheriche, and beyond.

