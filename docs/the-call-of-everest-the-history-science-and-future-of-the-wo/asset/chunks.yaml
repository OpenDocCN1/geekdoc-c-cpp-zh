    When the British reporter assigned to the team, James Morris, realized that the
    coronation of Queen Elizabeth II would take place three days later, he scrambled
    to get the news back to London in time. What a gift for the young queen! Written
    in code, the telegram transmitted the amazing news: “Summit of Everest reached
    on 29 May by Hillary and Tenzing.” As the crowds gathered in the streets of London
    during the night of June 1, in eager anticipation of the royal parades the next
    day, the newspaper headlines screamed, EVEREST CLIMBED.


    Morris called it the “last innocent adventure,” but the international wrangling
    that occurred afterward almost destroyed the special relationship between Hillary
    and Tenzing. The Nepali government tried to convince Tenzing to claim he was the
    first to reach the summit. They even tricked him into signing a document stating
    that fact, though it was untrue. (The pair maintained their “reaching the summit
    together” message up until 1993, when Hillary announced that he had stepped up
    first.)


    ![](OEBPS/images/Anke_9781426212413_epub_041_r1.jpg)


    `HILLARY AND NORGAY` were all smiles after their successful summit. The lives
    of both men would be forever changed because of their newfound fame. Hillary would
    comment, “I didn’t have any concept of the reaction from the media and from the
    general public.”


    Three countries then claimed Tenzing as their own. He recalled that for the first
    38 years of his life, nobody cared what nationality he was: Tibetan, Indian, or
    Nepali. Suddenly everyone wanted him. “But now everything was pushing and pulling.
    I was no longer a man, but some sort of doll to be hung from a string. It must
    be I who reached the top first—a yard, a foot, an inch, ahead of Hillary. For
    some I must be Indian, for others Nepali. The truth did not matter.”


    Everest had an enormous impact on the lives of its first summiteers. Of all that
    reached the top, Hillary gave back the most to the country that made him famous.
    His creation of, and commitment to, the Himalayan Trust was ongoing, generous,
    and meaningful. Schools, monasteries, and hospitals were constructed throughout
    the Khumbu region.


    Still, no accolades could approach those given to Tenzing Norgay. For millions,
    he became almost the manifestation of a god. His name became mythical, resonating
    as a talisman for future hope. When Hillary attended the unveiling of a statue
    honoring Tenzing’s life in Darjiling in 1997, he said, “I have never regarded
    myself as much of a hero but Tenzing, I believe, undoubtedly was. From humble
    beginnings he had achieved the summit of the world.”


    ## `VOICES`


    ### THE CONQUEST OF THE SUMMIT


    I check the oxygen sets again. The flow rates seem all right. Turning to Tenzing,
    I say: “How do you feel?”


    He just grins and waves his hand upward toward the ridge. I lead off once more,
    cutting steps. My ax work is still pretty rhythmical and relaxed; I’ve been chipping
    away for well over an hour, but, so far, I’ve avoided the kind of tension that
    can turn up a sore arm.


    One flight of steps, then another, and another. We follow the ridge as it curves
    around to the right, wondering where the top can possibly be, or if it exists
    at all. I cut around the back of one crag, only to have a higher one stare me
    in the face. It seems endless.


    Tiring, I try to save time on one stretch by skipping the step cutting and relying
    on my crampons. After a few yards I go back to my ax; the angle is still too steep,
    too dangerous. The zest we have known at the top of the rock step is draining
    away. Dully, grimly, I hack a route around still another knob.


    ### `STANDING ON TOP OF THE WORLD`


    Suddenly I realize that the ridge ahead doesn’t slope up, but down. I look quickly
    to my right. There, just above me, is a softly rounded, snow-covered little bump
    about as big as a haystack.


    The summit.


    One last question concerns me: is the top itself just a large, delicately poised
    cornice? If it is, someone else can have the honor of stepping on it.


    I cut my way cautiously up the next few feet, probing ahead with my pick. The
    snow is solid, firmly packed. We stagger up the final stretch. We are there. Nothing
    above us, a world below.


    I feel no great elation at first, just relief and a sense of wonder. Then I turn
    to Tenzing and shake his hand. Even through the snow glasses, the ice-encrusted
    mask, the knitted helmet, I can see that happy, flashing smile. He throws his
    arms around my shoulders, and we thump each other, and there is very little we
    can say or need to say.


    My watch shows `11:30`. Two hours and a half it has taken us from the South Peak;
    five hours from our tent. It seems a bit longer.


    ### `PHOTOS PROVE SUMMIT WAS REACHED`


    I turn off my oxygen and remove my mask. In the thin air of 29,000 feet my breathing
    becomes slightly more rapid, but not too uncomfortable. I fish out the camera
    I have kept warm inside my shirt; it will be necessary to take shots down every
    ridge if we’re to prove conclusively that we’ve been up here …


    Scooping a small hole in the snow, Tenzing buries a few offerings to the gods
    that many Buddhists believe inhabit these heights: a small blue pencil given him
    by his daughter, a bar of chocolate, some biscuits, a cluster of lollypops. I
    place near these gifts a little crucifix that John Hunt has received from a friend.


    It’s time to go down. I replace my oxygen, suck the air, and move off. We crampon
    along the steps, I cut. We know the route, we move fast.


    `SIR EDMUND HILLARY` a beekeeper from New Zealand, Hillary was knighted in 1953
    and dedicated his life to philanthropy.


    ## `NEW ROUTES`


    The next big breakthrough occurred 1960, when the Chinese/Tibetans embarked on
    a massive expedition whose leader was none other than Mao Zedong. They chose the
    North Ridge, featuring the notoriously difficult steps where Mallory and Irvine
    were last sighted. The Chinese apparently solved the problem with a human ladder
    arrangement that, when they dispensed with boots and crampons, actually worked.
    But they were still a long ways from the summit. Not until 4:25 a.m. on May 25
    did Wang Fuzhou and Qu Yinhua (Chinese) claim the summit. Their ascent wasn’t
    acknowledged for years, a fact that historian Audrey Salkeld chastised Western
    climbers for doubting. Skepticism was so entrenched that the Chinese felt compelled
    to do it again—in `1975`. This time they brought a ladder for the steps, a feature
    that remains on the mountain to this day.


    ### `AMEE ’63`


    By the time the Americans arrived in 1963, Everest had been explored on two of
    its three main ridges: Only the West Ridge remained. But what the Americans needed
    most of all was to make the ascent. No American had done that, and it was high
    time. They were led by Norman Dyhrenfurth, a Swiss filmmaker with the looks of
    a film star and a personality to match, who had been the official photographer
    on the 1952 Swiss attempt. Sponsored by the National Geographic Society, the American
    Mount Everest Expedition (AMEE) team included Jim Whittaker, Barry Bishop, Lute
    Jerstad, Willi Unsoeld, and Thomas Hornbein. Logistics were handled by Nepal veteran
    Jimmy Roberts. This was an expedition destined for success. Victory was expected,
    not only from fellow Americans but also from the expedition’s sponsors. The expedition’s
    initial plan was to do the grand slam: Everest, Lhotse, and Nuptse. But early
    on, Hornbein, an anesthesiologist from Seattle, and Unsoeld, deputy director of
    the Peace Corps in Nepal, began to imagine a grander plan—a new route on Everest.

