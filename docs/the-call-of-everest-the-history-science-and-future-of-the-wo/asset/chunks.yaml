    of moist forests in Nepal and Tibet, that stood frozen beneath a lone rhododendron
    tree just below me. I carefully stepped over the large pile of his tiny, bullet-shaped
    scat that clearly announced that I was an invader of his marked territory. These
    creatures once were rare because poachers hunted them for pods in their bellies
    that are used for making perfume. Yet musk deer had become quite common in this
    part of the park, thanks to the enforcement of wildlife protection laws since
    the mid-1970s.


    A small group of shaggy, goatlike Himalayan tahr browsed on the drier, shrubby
    south-facing slopes directly across the river. Ten years ago they posed a serious
    threat to many communities when local crops became their preferred food source.
    Now they are becoming increasingly scarce because the snow leopard, with its preference
    for tahr, has returned to these slopes. Scalps purported to come from the yeti,
    the legendary apelike creature that everyone’s uncle claims to have seen, are
    probably made of the reddish hide of a Himalayan tahr, or so some scientists think.


    An orange-barred leaf warbler and red-breasted rose finch sang in the distance,
    the first of many songbirds that would return to the region within the next several
    weeks. Gliding silently above was a lone Lammergeier (“lamb vulture”), or Bearded
    Vulture, with a wingspan of ten feet.


    The trail emerges from the cool forest into a high-altitude shrub land of dwarf
    rhododendron. The most conspicuous, the *sunpati (Rhododendron anthopogon)*, has
    an aromatic scent that is among the most pleasing that I have ever encountered—in
    small quantities, that is. Porters often complain of “sunpati headaches” if their
    routes take them through too many miles of the pungent shrub, where the scent
    becomes overpowering.


    ### **THE MOUNTAIN ABOVE**


    When I look up from my habitual concerns, I behold one of the grandest sights
    in the entire world—the black, pyramid-shaped, ice-clad, and wind-blasted summit
    of Mount Everest. Nepalis regard it as Sagarmatha (“mother of the universe”) and
    Tibetans revere it as Chomolungma (“holy mother”). The mountain successfully resisted
    all Western attempts to climb it for 32 years, beginning with the first British
    reconnaissance in 1921 through numerous attempts until Edmund Hillary and Tenzing
    Norgay’s successful climb in 1953\. Fifty-nine years later, in the spring of 2012,
    more than 200 climbers will summit on a single day. Even so, the mountain continues
    to be shrouded in magic and mystery, and its ascent is considered the ultimate
    lifetime achievement by thousands of climbers and nonclimbers alike. The world’s
    highest pinnacle casts its spell on all who dare approach it.


    ## **THE HIGHEST**


    Why have so many been so fascinated by Mount Everest? A good part of the reason
    lies in one word: *highest*. At 29,035 feet (8,850 meters), Everest is the highest
    mountain with its origins on land. (Hawaii’s 4,205-meter Mauna Kea rises over
    9,000 meters if measured from its base on the ocean floor.) As the Sherpa people—the
    famous Tigers of the Snow, renowned for their climbing ability and loyalty to
    their Western climber clients—are fond of saying, “There’s only one Everest.”
    The mountain continues to draw adventure tourists, since no other mountain is
    its equal. As mountaineers know, many other mountains, some less than 250 meters
    lower than Everest, are far more difficult to climb technically, but they are
    relatively ignored in the media.


    That makes me wonder: What would the landscapes and villages in the remote region
    surrounding K2 (8,611 meters) in Pakistan, or the equally remote Kangchenjunga
    (8,586 meters) on the India-Nepal border, look like today if they were higher
    than Everest?


    ## **EVEREST’S GEOGRAPHY**


    The 1,500-mile-long Himalaya mountain range separates the Asian mainland from
    the Indian subcontinent. On a map it inscribes an arc striking WNW-ESE between
    Nanga Parbat and the Indus gorge in the west, to Namcha Barwa and the Brahmaputra
    gorge in the east. South of the range lies most of India, and from west to east
    the Himalaya form the northern borderlands of Pakistan, India, Nepal, and Bhutan,
    as well as the southern border of the People’s Republic of China.


    ![](OEBPS/images/Anke_9781426212413_epub_027_r1.jpg)


    **MOUNT EVEREST AND** the Khumbu Glacier create an imposing landscape at the top
    of the world. Climbers reach Everest Base Camp by following the Khumbu Glacier—the
    highest in the world—and tackle its icefall, where millions of tons of slowly
    moving ice tumble down a steep slope.


    The mountains bear the marks of a geologically young and active range. Gazing
    at the Everest and Lhotse massifs from my vantage point that morning, I could
    make out curious horizontal bands of yellowish rock stretching across their exposed
    faces. Most people are surprised to learn that the famous Yellow Band of Everest
    actually began as sediments on the bottom of what was once the Tethys Ocean. Unimaginable
    heat and pressure over the eons caused these sediments to metamorphose into marble,
    shale, and gneiss and thrust them upward toward the skies.


    The Himalaya are still growing, as evidenced by the frequency of earthquakes in
    the region. While leading the Andean-Asian Glacial Lake Expedition in Khumbu in
    September 2011, we experienced a magnitude 6.9 earthquake that was powerful enough
    to make the walls of our lodge flex like rubber. Within seconds, it triggered
    massive, thundering avalanches that resulted in the tragic loss of life in Nepal
    and especially Sikkim, where the earthquake’s epicenter was located. It also caused
    considerable geomorphic instability throughout the region. I witnessed massive
    rockfalls and avalanches throughout much of the next morning’s hazardous trek
    to lower terrain, and we had to change our planned route on several occasions
    to a safer alternative.


    ### **ICE AS CREATOR**


    Mountains in the region have been largely shaped by the sculpting action of ice.
    Valleys are U-shaped after thousands of years of glaciers gouging their relentless
    paths. Debris-covered glaciers, an indication of glacial stagnation that began
    with the end of the Little Ice Age in the 1850s, dominate the valleys of the high
    country. Lateral moraines—the deposits of boulders, rocks, and soil that form
    on each side of a glacier—are a common sight in the upper Imja and other valleys
    of the park. A series of parallel lines indicates the different periods of glacier
    growth and retreat. The famous Tengboche monastery is located on an ancient glacier
    terminal moraine, or deposit of material that indicates the farthest extent that
    the glacier reached. The villages of Khumjung and Kunde are located in a valley
    that is all that remains of a glacier that has long since disappeared. The spectacular
    face of the 6,812-meter Ama Dablam (“mother’s necklace”) was formed when several
    glaciers struck off in different directions from the summit region during the
    last ice age 12,000 years ago, eventually carving a “horn” similar to that of
    the Matterhorn.


    More recent evidence of this dynamic environment can be seen in the devastating
    scouring, riverbank undercutting, and rocky depositions in the vicinity of Ama
    Dablam. In 1977, a glacial lake burst out in a flood that dammed the Imja River
    for several weeks. Torrents, or large gullies that are flooded periodically from
    excessive snow melt or rainfall, have sliced their way down many a mountain slope.
    No one who has experienced the sounds and sights of a massive avalanche will ever
    forget it. Smaller earthquakes or tremors are common. Less dramatic are the landscapes
    marked by saturated soils moving slowly downward on steep mountain slopes, high
    above the trekking trails. Known as solifluction (moving soil) lobes, these strange,
    globular landforms must be viewed either from a helicopter or high up on a neighboring
    mountain.


    ### **THE THREE SIDES OF EVEREST**'
