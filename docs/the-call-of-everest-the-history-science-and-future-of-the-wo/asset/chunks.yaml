- fmt: '

    Eight Sherpas from Camp II, including Panuru and Danuru, volunteer to drag Cory
    down to Camp I. The Sherpas, Cory’s photo assistant Andy Bardon, and I run down
    the Western Cwm, pulling Cory like a child in a toboggan. Black, low-slung clouds
    at Camp I eliminate the opportunity for a chopper evacuation, and carrying Cory
    through the icefall will take hours. Instead, cranking his oxygen up to four liters
    per minute, Cory, with the help of Panuru, stumbles down through the icefall and
    is immediately flown out of Base Camp for medical attention.


    ## THE TEAM PRESSES ON


    This leaves Conrad without a partner for the West Ridge attempt. Flamboyant Italian
    climber Simone Moro, veteran of some 40 Himalayan expeditions, briefly considers
    teaming up with him. However, after analyzing aerial photographs of the West Ridge’s
    notorious Hornbein Couloir, which is no longer snow but blue ice and exposed rock,
    he declares any attempt suicidal. “I didn’t come here to die. On this route, this
    year, you will die.” Both Conrad and Simone reluctantly decide to climb the South
    Col.


    ![](OEBPS/images/Anke_9781426212413_epub_068_r1.jpg)


    TEAM MEMBER AND photographer Cory Richards started to feel short of breath at
    23,000 feet (7,000 meters) while fixing ropes with Conrad Anker. He descended
    to Camp II, where doctors gave him supplemental oxygen and then suggested a descent.
    Richards then made his way to Base Camp, sometimes on a Sked rescue stretcher
    (far right), but also under his own power through the treacherous icefall (opposite,
    at left). Doctors performed additional tests at Base Camp, from which he was evacuated
    to a medical facility near Lukla, Nepal.


    In the past half century, the physiognomy of Everest has changed dramatically.
    Back in the days before global warming, it was a snowy peak. Today the snowfields
    and glaciers have receded substantially, uncovering loose, friable rock. Due to
    an extremely dry, windy spring, during April both the Khumbu Icefall and the Lhotse
    Face have been more dangerous than usual. Several Sherpas have been seriously
    injured by falling rock on the Lhotse Face. One was hit by a collapsing serac,
    and the car-size chunk of ice broke an arm and leg. Two teams, including Himex,
    the largest on the mountain, have abandoned their attempts due to the excessive
    risks.


    Snowstorms in early May finally, if temporarily, glue the mountain back together,
    and the Sherpas manage to fix lines up to the 25,900-foot South Col camp. On May
    18, lines are strung up to the top by the Sherpas, led by none other than our
    own Kagi. The next day more than 200 people swarm to the summit. Four clients
    will die in the effort.


    ![](OEBPS/images/Anke_9781426212413_epub_069_r1.jpg)


    MARK JENKINS PASSES by debris left on Everest after being beaten by winds above
    Camp III on the Lhotse Face.


    ![](OEBPS/images/Anke_9781426212413_epub_070_r1.jpg)


    EMILY HARRINGTON, Sam Elias, and Hilaree O’Neill (left to right) savor a rare
    windless evening at Camp III. Clouds hang over the Western Cwm, and Everest’s
    West Ridge rises to the right.


    We hold our fire, watching, waiting, and recuperating at Base Camp. The next window
    of opportunity, according to satellite-assisted weather predictions, appears to
    be May 25. We rest and sleep and eat as much as possible. We are now reduced to
    a team of six, for Phil Henderson has developed a respiratory infection and magnanimously
    taken on the role of Base Camp manager.


    Our summit push begins at the crack of night, 2 a.m., on May 21. We reach Camp
    II before noon and spend two days there—again eating and sleeping—before five
    of us ascend to Camp III. Conrad intends to come up the following day with the
    Sherpas.


    ## VOICES


    ### REFLECTIONS AFTER EVEREST


    Being on Mount Everest made me realize what a great life I have. It made me think
    of my own mortality and what is important. For me, family and mountains are very
    important. It helped to be able to call home and talk with my four-year-old daughter
    to wish her a happy birthday and to hear the voices of her and my wife.


    It made me realize what a small creature I am in the bigger picture of the planet.
    I would often notice the small differences of life at Base Camp, such as the glacial
    movement underfoot and the sound of serac fall in the night. To have the opportunity
    to see this small part of our planet close up was remarkable.


    ### FULFILLING GOALS


    I quite often found myself hiking in the icefall alone and being completely comfortable.
    Being alone in the mountains is something I have always been comfortable with.
    However, being alone on the highest mountain in the world, where the risks are
    high, and still feeling content—that will always be a memorable part of the expedition.
    It told me that all the years of being in the mountains had in fact prepared me
    for this expedition.


    I really tried to not worry about what happened. If I reached the summit, great:
    That would be the icing on the cake. My main focus was to make a positive impact
    and contribution to the expedition, the team, and the others around me. I feel
    I was able to accomplish all of my personal goals—with the exception of reaching
    the summit. There were so many other important things besides just reaching the
    summit.


    ### ALWAYS WITH ME


    There is not a day that goes by that I don’t think about this expedition. For
    reason reason, unlike my thoughts about any other expedition, I don’t see it changing
    anytime soon. This was another life-changing experience for me. It will help me
    keep life in perspective. It is the best example I can think of to show why it
    is important for me to have expeditions as part of my life.


    —PHIL HENDERSON a veteran mountaineer and senior field instructor for the National
    Outdoor Leadership School (NOLS), Phil Henderson was a member of 50th Anniversary
    Legacy team.


    ### ASKING WHY


    We spend hours cutting out an icy ledge in the sky. Camp I and Camp III are the
    only camps the Sherpas don’t build for us. From our perch 23,000 feet above sea
    level, we peer down into the blinding whiteness of the Western Cwm. We spy the
    miniature tents of Camp II in the moraine, then out farther the crevasses around
    Camp I, and still farther to Base Camp, obscured by roiling clouds. The horizon,
    fading with great distance as in a watercolor painting, is a series of jagged
    ridelines. We can see so far we can almost see into ourselves. A view you only
    get by getting up here.


    After two months on Everest, we are friends. We know each other’s battles and
    betrayals—some of them anyway—and we’ve got each other’s backs: When Hilaree sprained
    her ankle, Sam lost heart, when I was too sick to sit up. This is what happens
    when you sleep beside each other in tiny tents on a long expedition. It’s what
    is supposed to happen. You start out as individuals and transform each other into
    a team.


    Camp III, halfway up the Lhotse Face, is like a skyscraper with no walls. No one
    else is on our floor, we have our own slice of solitude, although there are tents
    and climbers below us and above us.

    '
