    Their dream presented daunting challenges for the team. Their discussions went
    on endlessly about where, and how, and when, and with what support. Democracy
    is a wonderful concept, but not necessarily when climbing a big mountain. Reaching
    the summit was imperative, so the South Col route, they decided, was the first
    priority. The West Ridge team would have to be content with what was left over.
    Once the summit was reached by the South Col route, the West Ridgers would get
    their moment.


    Which they did. What made `Hornbein` and `Unsoeld’s such an iconic climb was that
    they reached a point of no return. They had only each other. Even after they had
    summited via what became known as the `Hornbein Couloir`, they then had to assist
    their teammates on the south side of the mountain in a frighteningly cold 28,000-foot
    (8,535-meter) open bivouac.


    They weren’t the first Americans to reach the summit. That honor was achieved
    by the South Col team, led by `Jim Whittaker` and `Nawang Gombu`. The two were
    followed by `Lute Jerstad` and `Barry Bishop`, who ended up sharing that desperate
    bivouac with the West Ridge boys near the top. They all survived, but the cost
    in digits was high: `Unsoeld` lost nine toes and `Bishop` lost all ten.


    Everest changed the destiny of those 1963 climbers—certainly for `Whittaker`,
    whose social circle revolved around the Kennedy clan following his Everest triumph.
    Tragedy followed `Unsoeld`, who would lose not only his own life in the mountains,
    but also that of his daughter, `Nanda Devi Unsoeld`. Perhaps more reflective,
    `Hornbein` continued to search for the meaning of his Everest success: “Why was
    I here? I seemed to be hunting for answers to questions I couldn’t even ask. What
    difference could Everest make even if I got to the top? What was up there to make
    me any wiser?” It would take him years to begin to discover the answers.


    ## THE LAST GREAT PROBLEM


    Not until 1975 was another major route claimed on Everest, when `Chris Bonington’s
    Southwest Face expedition` placed Dougal Haston, `Doug Scott`, `Peter Boardman`,
    and `Pertemba Sherpa` on the summit. But that landmark ascent was not accomplished
    on the first try. An earlier attempt to tackle this “last great problem” took
    place in 1971 under the leadership of `Norman Dyhrenfurth`, a two-time Everest
    veteran. It ended in defeat and interpersonal warfare. The second assault took
    place in 1972, this time led by `Dr. Karl Herrligkoffer`, who invited along British
    climbers `Don Whillans`, `Hamish MacInnes`, and `Doug Scott`. The three Brits
    managed to function under `Herrligkoffer’s` famously authoritative style, but
    none of them was able to find a way to the top.


    `Chris Bonington` led an unsuccessful attempt later that fall and returned in
    1975 with a carefully chosen team. `Dougal Haston`, a Scotsman living in Switzerland,
    was a driven, ambitious alpinist. `Martin Boysen` was an old climbing friend of
    `Bonnington’s`, and `Doug Scott` had already made an attempt. `Nick Estcourt`,
    `Tut Braithwaite`, and `Mick Burke` filled out the roster of this well-financed
    and superbly organized team. `Peter Boardman` described the effort best: “For
    a mountaineer, surely a `Bonnington Everest Expedition` is one of the last great
    Imperial experiences that life can offer!” The key to their success occurred high
    up on the face. Previous teams had been defeated by the rock band when they had
    chosen a right-slanting ramp that dead-ended. This time they went left.


    ![](OEBPS/images/Anke_9781426212413_epub_042_r1.jpg)


    **JIM WHITTAKER POSES** with the American and National Geographic flags at the
    summit in this image taken by his climbing partner, `Nawang Gombu`.


    `Dougal Haston` and `Doug Scott` reached the summit at 6 p.m. on September 24,
    almost 16 hours after leaving their `Camp VI`. The photographs show a lovely—and
    ominous—sunset. `Doug Scott` enthused: “The view was so staggering, the disappearing
    sun so full of colour that the setting held us in awe.” “Disappearing” is the
    pertinent adjective: It was much too late to return to their camp, so they ended
    up spending the night on the South Summit at 28,700 feet (8,750 meters), a new
    record for the highest bivouac.


    Two days later `Martin Boysen`, `Mick Burke`, `Peter Boardman`, and `Pertemba
    Sherpa` headed up. `Boardman` and `Pertemba` reached the top. While `Boysen` turned
    back, teammate `Burke` continued on alone. He was last seen by `Boardman` and
    `Pertemba` resting just a few hundred yards from the summit. He seemed confident,
    but then the weather closed in, and `Mick Burke` disappeared forever.


    Over on the Southeast Ridge, a diminutive piano teacher, only five feet tall and
    weighing well under 100 pounds, Japanese climber `Junko Tabei` became the first
    woman to climb the mountain. Just 11 days later, `Phantog`, a Tibetan mother of
    three, reached the summit with a Chinese expedition. Two women in two weeks! Another
    woman would not grace the summit of Everest for another five years.


    ![](OEBPS/images/Anke_9781426212413_epub_043_r1.jpg)


    **THE CLIMBERS BATTLE** strong winds.


    ## VOICES

    AND MILES TO GO


    As we descended, the falling snow gave way to a fine drizzle. There was nothing
    to see; just one foot, then another. But slowly a change came, something that
    no matter how many times experienced, is always new, like life. It *was* life.
    From ice and snow and rock, we descended to a world of living things, of green—grass
    and trees and bushes. There was no taking it for granted. Spring had come, and
    even the grey drizzle imparted a wet sheen to all that grew. At `Pheriche` flowers
    bloomed in the meadows.


    Lying in bed, `Willi [Unsoeld]` and I listened to a sound that wasn’t identifiable,
    so foreign was it to the place—the chopping whirr as a helicopter circled, searching
    for a place to land. In a flurry of activity `Willi` and `Barrel [Barry Bishop]`
    were loaded aboard. The helicopter rose from the hilltop above the village and
    dipped into the distance. The `chop-chop-chop` of the blades faded, until finally
    the craft itself was lost in the massive backdrop. The departure was too unreal,
    too much a part of another world, to be really comprehended. Less than five days
    after they had stood on the summit of Everest, `Barrel` and `Willi` were back
    in `Kathmandu`. For them the `Expedition` was ended. Now all that remained was
    weeks in bed, sitting, rocking in pain, waiting for toes to mummify to the time
    for amputation…


    ## MISSION ACCOMPLISHED


    We were finished. Everest was climbed; nothing to push for now. Existence knew
    only the instant, counting steps, falling asleep each time we stopped beside the
    trail. `Lester`, `Emerson`, and I talked about motivation; for me it was all gone.
    It was a time of relaxation, a time when senses were tuned to perceive, but nothing
    was left to give…


    We’d climbed Everest. What good was it to `Jake [Breitenbach`, who had died earlier
    on the climb]? To `Willi`, to `Barrel`? To `Norman [Dyhrenfurth, AMEE team leader]`,
    with Everest all done now? And the rest of us? What waits? What price less tangible
    than toes?


    Yes, it satisfied in a way. Not just climbing the mountain, but the entire effort—the
    creating something, the few of us moulding it from the beginning. With a lot of
    luck we’d succeeded. But what had we proved?


    Perhaps there was something of the nobility-that-is-man in it somewhere, but it
    was hard to be sure.


    ## THE SIMPLE LIFE

