    尽管直接处在一个随时可能坍塌并将我们压埋的冰塔下方，这个高空巢依然如魔幻般美丽。这里没有一丝风，不知为何，每当我们来到这里时情况都是如此。傍晚的阳光将冰川变成了一条宽阔而灿烂的通道，将珠穆玛峰的山腰变成了城堡闪烁的墙壁。这景色美得令人窒息，许多人为此付出了生命。


    “你知道的，在家里，我会问自己为什么，”希拉里（Hilaree）蹲在虚无的边缘，喝着咖啡，冰爪尖端没入雪中，“为什么要爬山？为什么要离开我的孩子和丈夫？承担所有的风险……”
    作为一名参加过数十次探征的运动员，希拉里停顿了一下，向前方挥了挥手臂，“这就是，这就是。”


    克里斯（Kris）像往常一样把相机紧贴眼旁，在我们滑的岩平台上来回爬行。


    “现在，就在这里，”他惊呼道，“这就是最好的了。”他那双像奥林匹滑雪运动员般的腿，已经挺过了六次 8000 米的考验。


    瘦子萨姆（Skinny Sam）走得离边缘太近，坐在帐篷里盘腿坐着的艾米莉（Emily）将金发塞进毛帽，冲他大喊：“萨姆！”这两个是年轻将，在这次探征之前，他们都没有爬到过
    13000 英尺。


    景色闪烁着光芒。我们都被这崇高的景致所震撼。雪、石与虚无之间存在着一种残酷的、黑白分明的美。它象征着登山这种运动关乎性的简单。做出正确的决定，你就活；做出错误的决定，你就死。大多数其他运动仅仅是游戏，而登山是关乎死的。这里有运气，但几乎没有宽恕。一切都被提炼成了基础元素：热饮、冰冷的手指、灼灼的光、汗味、雪崩的轰鸣声。在这个海拔，没有任何生命存在——绿色甚至不存在——除了我们登上顶峰的决心，别无其他生命。


    ## 营地生活


    太阳落下的那一刻，温度骤降，但我们已经躲进帐篷，钻进了一脚深的睡袋里。在世界的边缘，有两个女人和三个男人。萨姆、艾米莉和我并排躺着。萨姆在营地炉上融雪，艾米莉戴着耳机听着何塞·冈萨斯（José
    González）的歌声晃着头，我在写作。隔壁，克里斯和希拉里一边切奶酪和意大利火腿，一边跟着火柴盒大小音响器里出来的 Raconteurs 乐队合唱。所有的活动都是可以替换的，就像我们在三号营或一号营时一样。很快，我会融冰，艾米莉会打开我们的食物包，萨姆会听着
    Glitch Mob 的音乐，克里斯会给大本营打电话询问天气，而希拉里会收集冰块放入锅中，自自哼着约翰尼·卡什歌。


    当黑暗像冰冷的拳头一样紧住我们时，我们都清醒地意识到，24 小时后——在登山 55 天之后——我们将冲击顶。


    我们在山上上下行了四次以让身体进入状态，但任何事情都可能发生。我们中的某人可能会生病、滑倒，或者仅仅是因为太疲惫而无法继续。绳子可能会松动，冰塔可能会倒塌。可能会下一脚雪，或者狂风会让我们折返。毕竟，这是珠穆玛峰。


    我们唯一能控制的是我们的大脑。攀登珠穆玛峰需要很长时间，只要保持专注就赢得了一半战斗。我们关掉头灯，钻进睡袋。明天，终于是表演时刻了。


    ## 声音


    ### 母亲身份：作为登山训练


    等计划快结束时，我才告诉朋友和家人，我将在春季花费十周时间攀登珠穆玛峰。我遇到的是许多空白的目光和不理解的眨眼。这种反应与我想爬珠穆玛峰的事无关——任何认识我的人都明白，尝试登上地球最高点对我来说是不可避免的。我看到的表情更多是关于“如何做”而非“为什么”。


    对我来说，探征直到 2012 年 1 月中旬才最终定下来。面对 3 月底即将临近的出发日期，我该如何组织我的生活，更不用说为如此重大的任务进行训练，并让自己离开家十周呢？


    ### 离开孩子们


    这次探征对我来说，发生了一个相当不方便的时间。我是两个小男孩的母亲：在 2011-12 年的冬天，他们两岁，一个四岁。虽然我一直挂念着昆布冰川和珠珠峰，但我设想那是几年后的事，等我的孩子们上了学。我没那种好运。甚至我丈夫也同意，这次爬珠穆玛峰的机会太好了，不能错过。团队非常出色，赞助非常稳固，而合作伙伴——北面之（The
    North Face）、国家地理（National Geographic）和梅奥医学中心（Mayo Clinic）——都非常有吸引力。


    我和丈夫共同决定我应该去。接下来的两个月是绝对且彻底的混乱。除了安排孩子照顾和在我不在期间为丈夫提供支持系统外，我还需要训练。作为一名职业滑雪登山员，我并不是零开始，但作为一名全职妈妈，我的训练窗口充其量非常有限。


    ### 三重挑战


    珠穆玛峰并不是我的第一座 8000 米高峰。我已经攀登并滑过长鱼峰（Cho Oyu），并在巴基斯坦尝试过加喜布鲁姆二峰（Gasherbrum II）。从这些经历中，我知道对我来说训练是一项三兼顾的任务：体能、意志韧性和体重管理。


    回想起来，2011-12 冬季糟糕的雪况实际上对我有利。作为一名滑雪员，如果有好的雪，那是我唯一的活动。但作为一名滑雪员，我知道除了滑雪之外，它并不能让我进入状态。糟糕的雪况让我在为珠穆玛峰做准备时能够跳出固有思维。首先，我需要在照顾孩子的同时进行训练。每周至少三天，我会独自带着两个儿子去滑雪。虽然我四岁的儿子大部分时候可以自己应对，但我儿子经常在我的腿之间，或者系在安全带上由我控制他的速度。这两种方法都需要我不断“犁雪”，这比单纯滑雪要困难得多！其余时间，我会背着他。


    对我来说，训练不仅关乎体能，还关乎心理。背着一个经常尖叫和踢人的两岁小孩子在山上走几个小时，虽然是折磨，但在身体和尤其是心理上是极好的训练。


    随着冬天情况好转了一些，我恢复了常规的训练标准：滑雪登山。这对我来说是攀峰的一个重要工具，因为我的计划是尝试从顶顶滑下。带着这一点，我知道我需要进入那种能提供暴露感并作为心理训练的地形，而且是大量的。


    ### 身体的代价


    极端海拔的一个显著生理反应是持续的体重的减轻和整体肌肉的退化。在高海拔处度过很长时间后，我非常清楚适应与身体退化之间微妙的平衡。许多高海拔登山者（包括在内）都会尝试在挑战
    8000 米高峰之前通过增加体重来给身体提供一点缓冲。我称之为“探征饮食”。努力吃任何东西、任何食物，以期推迟身体消耗自身脂肪储备和肌肉的时间。在我身上，这并不容易。生孩子的副作用之一是它改变了我的体质，变得更加纤瘦。对我来说增加非常困难，我的平均体重比产前轻了
    5 磅。因此，饮食是我准备珠穆玛峰的另一个重要方面。


    '
- fmt: '

    The most challenging thing I find with balancing being a mom and trying to stay
    fit for big expeditions is that I am not in the dangerous, exposed terrain often
    enough to be as comfortable as I would like. With that said, I spent a fair amount
    of the time I had without my kids trying to ski very steep lines in the backcountry.
    I also found friends to take me ice climbing just to reacquaint myself with exposure
    and hanging from ropes and crampons and ice axes. I find these types of training
    to be much more valuable to me than pure fitness.


    In the end I felt relatively ready for the expedition. The final challenge was
    switching mental gears from mom to mountain climber—perhaps the hardest task of
    all.


    —`HILAREE O’NEILL` Named by `Outside` magazine as one of the most adventurous
    women in sports, Hilaree O’Neill skis and climbs around the world as a `North
    Face` athlete.


    # DODGING THE CROWD


    The next morning we awake to enthusiastic shouts. Our Sherpas have arrived from
    `Camp II`, ready to climb with us up to `Camp IV`. Donning our down suits and
    crawling out of the tent, we are stunned to see an endless line of climbers passing
    near our camp. What the hell? Where did all these people come from? We pull on
    our harnesses and step in line, clipping our `ascenders` onto the string of ropes
    that rise up the `Lhotse Face`.


    Below us I spot over a hundred climbers, trudging nose-to-butt like cattle. Above
    us struggle another hundred climbers, also in single file, dragging themselves
    up the ropes. We went to sleep on a mountain and woke up in a traffic jam!


    I am wedged between an unknown climber above me and an unknown climber below me.
    Bumper to bumper, we all must move at exactly the same speed, regardless of strength
    or ability. I am appalled. This is a parody of mountaineering.


    ![](OEBPS/images/Anke_9781426212413_epub_071_r1.jpg)


    `DANGEROUSLY LONG LINES` of climbers make their way through the `Yellow Band`,
    above the `Lhotse Face`, in 2012.


    Of course, we knew that too many people were crowding the `Everest` route. That’s
    why we waited for the second window of good weather—hoping most climbers would
    go for the top the first chance they got. Alas, hundreds of other climbers had
    the same idea.


    Some problem has halted climbers on the line above me. The human highway stops.
    After ten minutes of standing still, I can take it no longer. I remove my `ice
    ax`, unclip from the lines, and swerve off on to open ice, roaring past one climber
    after the next. I overtake 10 climbers, 20 climbers. I am unroped, soloing, but
    the terrain is moderate. When I get to the end of the jam, I discover a Sherpa
    trying to help a fumbling climber who doesn’t know how to unclip his `ascender`
    or reattach it to the next rope. I move past them and clip back onto the lines.


    I soon reach the tail end of another clot of climbers. Once again I unclip and
    go around them. En route, I note that at least 30 people are hanging on a single
    ratty rope that is anchored by a single badly bent `picket` pounded into the ice.
    This is lunacy. If the `picket` popped, the rope or `carabiner` would instantly
    snap from the weight of three dozen falling climbers, and they would all cartwheel
    down the `Lhotse Face` to their deaths.


    Separated from my own team, I continue to hopscotch up the ropes, crossing the
    steep, bare rock of the `Yellow Band` and traversing behind the `Geneva Spur`.
    I reach `Camp IV`, at 25,900 feet, before lunch. At least a hundred tents are
    spread out across the desolate `South Col` like some wind-blasted refugee camp.
    Debris is everywhere: garbage, tattered nylon flapping on the skeletons of abandoned
    tents, piles of frozen human excrement.


    Our team’s Sherpas have erected a pair of tents, and I collapse inside one of
    them. I take off my `oxygen mask`, lie back, and close my eyes. Kagi brings me
    a bowl of hot noodles. Panuru ducks his head into the tent and tells me to put
    my `oxygen mask` back on. One by one my teammates arrive, first Hilaree with Kris,
    both of whom crash inside the other tent. Emily shows up, then Conrad, lastly
    Sam. Conrad, the old lion, ascended all the way from `Camp II` to `Camp IV` without
    oxygen. He looks shattered, his face drawn and grizzled.


    “I’m cooked,” he croaks. “I can’t go for the summit.”


    In a few hours we will set out, along with at least 200 others, and we know already
    it will be a mess. Above 26,000 feet, in the death zone, the safety margin is
    as thin as skin and rescue almost impossible. Our biggest fear is not for ourselves,
    but for all the climbers around us, too many of whom don’t have the mountaineering
    experience or technical skills to be so high.


    ## THE PATH LESS TRAVELED


    In 1963, Whittaker and Gombu had been utterly alone up high on the mountain; today
    this would be unimaginable. Relying heavily on Sherpa support and bottles upon
    bottles of supplemental oxygen, more than 300 people a year summit Everest, a
    total of almost 4,000 since 1963. (When all the numbers are compiled, more than
    400 people will summit in the spring of 2012.) Sans oxygen—the blood doping of
    mountaineering—and Sherpas, Everest would still be the exclusive domain of the
    world’s best high-altitude mountaineers.


    # SUMMITING


    At Camp IV, we rest in our tents until 9 p.m.: Then it’s time. A frigid wind is
    roaring as we strap on our `oxygen masks`, and every patch of exposed flesh will
    be frostbitten. In our bulky down suits, goggles, respirators, and huge gloves,
    we resemble astronauts more than mountaineers.


    As we set off in the swirling darkness, I look up at a Christmas tree of twinkling
    lights, climbers’ headlamps rising straight up into the black sky. Reaching the
    fixed lines, we again find ourselves behind dozens of dangerously slow-moving
    clients.

    '
