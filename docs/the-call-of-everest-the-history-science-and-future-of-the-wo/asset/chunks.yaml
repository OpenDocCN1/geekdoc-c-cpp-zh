    当派往小组的英国记者詹姆斯·莫里斯（James Morris）意识到伊丽莎白二世女王的加冕将在三天后举行时，他急于及时将消息传回伦敦。对于年轻的女王来说，这是多么完美的礼物啊！电报以加密形式传输了这一令人震惊的消息：“希拉里和丹增于
    5 月 29 日登顶珠穆玛峰。”当 6 月 1 日夜，人群聚集在伦敦街头，热切期待次日的皇家巡游时，报纸标题大吼着：珠穆玛峰被登顶。


    莫里斯将其称为“最后一次纯真的冒险”，但随后发生的国际争端几乎摧毁了希拉里与丹增之间的特殊关系。尼泊尔政府试图说服丹增声称自己是第一个登顶峰的人。他们甚至骗他签署了一份陈述这一事实的文件，尽管这并非事实。（这对组合一直到
    1993 年都坚持他们“共同登顶”的说法，直到那时希拉里宣布是他先迈了一步。）


    ![](img/Anke_9781426212413_epub_041_r1.jpg)


    `希拉里和诺尔盖`在成功登顶后满面带笑。这两个人的生活因为他们新获得的名声而永远改变了。希拉里评论道：“我完全没有对媒体和普通大众反应的预期。”


    随后，有三个国家都声称丹增是他们的人。他回忆道在他生命的前 38 年里，没有人在意他是什么国籍：西藏人、印度人还是尼泊尔人。突然所有人都想要他。“但现在一切都在推推拉拉。我不再是一个人，而是一个某种挂在绳子上的娃娃。一定是我先到达顶部的——比希拉里领先出一个一码、一英尺、一英寸。对某些人来说我应该是印度人，对另一些则是尼泊尔人。真相并不重要。”


    珠穆玛峰对其首批登顶者们的生活产生了巨大影响。在所有登顶的人中，希拉里对让他闻名的国家回馈最多。他创立并致力于喜马拉雅信托（Himalayan Trust）的工作是持续、慷慨且富有意义的。在整个昆布地区，学校、寺院和医院相继落成。


    然而，没有任何荣誉能比得上给予丹增·诺尔盖（Tenzing Norgay）的。对于数百万人来说，他几乎成为了神的化身。他的名字变成了神话，作为未来希望的护符引起共鸣。当希拉里在
    1997 年参加达卓岭纪念丹增生像的揭幕仪式时，他说：“我从未认为自己像丹增那样是一个英雄，我相信丹增无疑是。从卑微的开始，他实现了世界之的高度。”


    ## `声音`


    ### 征服顶峰


    我再次检查了氧气瓶组。流量看起来正常。转向丹增，我说：“你感觉怎么样？”


    他只是笑着，手朝山脊向上挥了挥手。我再次领头，切开步子。我的冰镐工作仍然很有节奏且放松；我已经开凿了一多一个小时了，但到为止，我避免了那种会让酸痛手臂加剧的紧张感。


    是一阶，又是一阶，又是一阶。我们沿着向右弯曲的山脊前进，好奇顶峰可能在哪里，或者是否是否存在。我绕过一个岩石的后面，却发现一个更高的岩石正对着我的脸。它似乎无止尽。


    我很疲惫，我试图在其中一段路通过跳过切冰步骤并依靠我的冰爪来节省时间。几码后我又换回了冰镐；角度还是太陡、太危险了。我们在岩阶顶端所感受的热情正在消退。我无力而冷酷地在另一个凸起处开凿出一条路线。


    ### `站在世界之巅`


    突然，我意识到前面的山脊并不是向上倾斜，而是向下的。我迅速看向右侧。那里，就在我正上方，有一个圆润的、覆盖着雪的小包，大约有一个草堆一样大。


    顶峰。


    最后一个问题困扰着我：顶峰本身只是一个巨大的、微妙平衡的雪脊吗？如果是那样，那么别人就可以获得踏在上面的荣誉。


    我小心翼翼地向上爬了几英尺，用冰镐探测前方。雪很结实，压实得很紧密。我们踉跄着走完最后一段路。我们到了。上方空无一物，下方是世界。


    起初我并没有感到巨大的欣悦，只有如释重负和一种惊奇感。然后我转向丹增并握了他的手。即使隔着雪镜、结满冰霜的面具和针织头盔，我也能看到那个快乐、闪烁的微笑。他双臂环住我的肩膀，我们互相拍击胸部，我们没什么可以说的，也不需要说的。


    我的表显示为 `11:30`。从南峰出发花了我们两个半小时；从我们的帐篷出发花了五个小时。时间似乎长了一点点。


    ### `照片证明已登顶`


    我关掉氧气摘掉面具。在 29,000 英尺的稀薄空气中，我的呼吸变得稍快了一些，但并不太难受。我从衣服里取出一直保温的相机；如果我们想要凿地证明我们确实来过这里，就有必要对每一条山脊进行拍摄……


    在雪中挖一个小洞后，丹增埋下了几个许多佛教信徒相信居住在高处的神灵的供品：女儿送的一支小蓝色铅笔、一块巧克力、一些饼干、一串糖葫。我在这些礼物旁边放了一个约翰·亨特（John
    Hunt）从朋友那里得到的小十字架。


    是时候下山了。我更换氧气，吸入空气，出发。我们踩着冰爪移动，我切路。我们熟悉路线，我们快速前进。


    `埃德蒙·希拉里爵`来自新西兰的养蜂人，他在 1953 年被封爵，并将一生献给慈善。


    ## `新路线`


    下一次突破发生在 1960 年，当时中国和西藏人进行了一场规模巨大的远征，其领导正是毛泽东。他们选择了北脊，那里是马洛里和尔文最后出现的地方。中国人似乎通过一种梯子方法解决了这个问题，在他们弃用靴子和冰爪后，这种方法奏效了。但他们距离顶峰还有很远。直到
    5 月 25 日凌晨 4:25，王富之和丘英华（中文）才登顶。他们的登顶在多年内都没有得到认可，历史学家奥德丽·萨尔凯德（Audrey Salkeld）曾指责西方登山者。怀疑情绪根深蒂固，以至于中国人感到必须再次尝试——1975
    年。这次他们带了梯子来对付那些台阶，这一特征直到今天仍在山上。


    ### `63 年 AMEE`


    当美国人在 1963 年到达时，珠穆玛峰的三条主脊中的两条已经被探索过了：只有西脊尚待之。但美国人最需要的是登顶。没有美国人做过那件事，现在是时候了。他们由诺曼·迪伦富特（Norman
    Dyhrenfurth）领导，他是一位拥有影星外表和性格的瑞士电影制作者，曾是 1952 年瑞士队的官方摄影师。美国地理学会赞助的美国珠穆玛峰远征队（AMEE）包括吉姆·惠特克（Jim
    Whittaker）、巴里·毕晓（Barry Bishop）、鲁特·杰斯塔德（Lute Jerstad）、威利·温塞尔（Willi Unsoeld）和托马斯·霍恩因（Thomas
    Hornbein）。后勤由尼泊尔老兵吉米·罗伯茨（Jimmy Roberts）负责。这是一次注定成功的远征。不仅是美国人，连远征赞助者也期待胜利。远征最初的计划是完成大贯：珠峰、洛子峰和努峰峰。但很早，霍恩因（一位来自西雅图的麻醉医生）和温塞尔（尼泊尔和平队副主任）就开始想象一个更宏大的计划。


