    During that expedition I reached the summit of Mount Everest for the first time
    on May 7, 1983. I had been assigned to the team by the ABC TV series *American
    Sportsman*, which sent me to the mountain to transmit the first live images from
    Earth’s highest point. We set out from our high camp in the dawn’s early hours.
    For some reason we chose to pioneer a shortcut directly up to the Southeast Ridge
    from the South Col, but we unexpectedly encountered thigh-deep snow and were slowed
    by the wearying efforts of wading through it. There were no fixed ropes above
    the South Col—we didn’t need any. We only found 30 feet of wind-battered rope
    hanging down the Hillary Step.


    My teammates—Ang Rita Sherpa, Peter Jamieson, and Gerry Roach—and I traded the
    exhausting duty of plowing a trail up through the soft, deep snow. Yet we all
    managed to remain close together and gained firmer snow at the South Summit at
    3:30 p.m., where we readied for the final push. Larry Nielson had chosen to climb
    without bottled oxygen and was lagging behind. The traverse from the South Summit
    to the famed Hillary Step is long and exposed. Not until I put that intimidating
    final 40 feet of steep climbing behind me did I know we would succeed.


    I well remember my last few steps. The peak was pristine, devoid of footprints,
    survey tripods, promotional banners, prayer flags, and mementos that would later
    clutter its summit. It appeared that no one had come before us. The wind was light,
    but an occasional gust reminded us of its potential power. We shared the piercing
    spectacle of Everest’s harsh, implacable grandeur and a great solitude. Since
    arriving at Base Camp, we had taken more than 40 days to reach this moment; days
    of hardship, teamwork, self-reliance, and growing camaraderie. The five of us
    were but tiny dark dots barely visible from afar against the shimmering white
    peak. I gazed north out into the vast expanse of the Tibetan Plateau and thought
    of the early 1920s British expeditions. Their magnificent pioneering efforts to
    climb the mountain from Tibet had all ended in failure. Many lives were lost.
    Standing there, I knew my life had changed. I had attained a childhood aspiration.
    A long journey had ended. The world was at my feet. I was filled with a quiet
    awe and wonder, and a deep satisfaction, too.


    ## LONELY HEROES


    After assembling the transmission equipment, I pointed the video camera at my
    companions as we stood astride the great peak. Then I captured Larry Nielson’s
    labored final steps as he became the first American to reach the summit without
    supplementary oxygen. His was a noble effort, but it had taken a toll.


    By now late afternoon, low-angle light slithered around the peaks below, casting
    long shadows over the valleys. The closest members of our support team were nearly
    8,000 feet below in the advance base camp. Isolated? Yes. But also exhilarated
    with what we had just accomplished. Nor did we mind the enveloping darkness and
    heavy snow as we staggered down to tents on the South Col, exhausted but triumphant.


    I lay awake in my sleeping bag that night, recalling images of tired faces, exultant
    grins, and glinting peaks. Only hours earlier, I had become the 130th person to
    reach the top of Mount Everest in the 30 years since Edmund Hillary and Tenzing
    Norgay’s 1953 ascent. I was proud to belong to that select club, but I thought
    it was already 100 members too big.


    ## THE END OF INNOCENCE


    Since then I have returned to the mountain often and reached the summit four more
    times. I couldn’t have imagined how much the Everest experience would change,
    and in so little time. Today nearly 129 people may reach the top of Everest in
    a single day; the total number of ascents recorded as of spring 2012 is more than
    6,200.


    Since 1856, when its supreme height of 29,002 feet (a number later revised to
    29,035) was announced to the world, Mount Everest has exerted an enduring tug
    on the human imagination. I felt it too, when I was 11 years old, transfixed by
    a book’s color photograph of Tenzing Norgay wearing the alien garb, and oxygen
    mask, of an explorer on the planet’s outermost edge. In that single triumphant
    image I found an example that represented my own yearning for independence, discovery,
    and freedom. I sensed that the man behind the oxygen mask and thick down suit
    had taken risks and striven mightily to reach that spot, and that he was standing
    right where he wanted to be. Someday I wanted to stand there, too.


    I was in excellent company. Countless people before and after me have projected
    their own values, dreams, and ambitions on the mountain. British explorers George
    Mallory and Andrew Irvine were pioneering a route up Everest’s North Face when
    they died in 1924, just shy of the summit, leaving a mystery for the ages. When
    Tenzing and Hillary made the first ascent in 1953, the world was riveted. Willi
    Unsoeld and Tom Hornbein, in 1963, completed the first traverse of the Himalayan
    giant, one of the greatest achievements in mountaineering history. Reinhold Messner
    and Peter Habeler were the first to reach the summit without supplemental oxygen
    in 1978; Messner did so again, solo, unsupported, two years later. A Polish team
    made the first winter ascent in February 1980.


    Everest has equally been a magnet for unusual characters with unlikely aims. The
    “mad Yorkshireman” Maurice Wilson, an eccentric World War I veteran with no climbing
    experience, flew illegally to India in 1934, intending to crash-land his `DH Gyy
    Moth` into the glacier at the base of Everest and then climb to the top. But British
    authorities impounded his plane and denied him permission. Undeterred, he trekked
    through Tibet with only a small support team. His body and tent were found in
    1935 at 21,400 feet, just below the North Col.


    Philosophy professor Woodrow Sayre, grandson of the President, recruited a geology
    student, schoolteacher, and lawyer to make a wildly amateur and ambitious attempt
    to climb Everest from the north in 1962. They entered Tibet illegally from Nepal,
    unsupported, ferrying all their gear and food to the mountain’s north side. Their
    audacious and littleknown attempt reached nearly 25,500 feet before turning back.
    The exhausted team retraced their steps to Nepal, ending the first American expedition
    to Everest.


    On September 26, 1988, French mountaineer Jean-Marco Boivin completed the first
    descent from the summit by paraglider. Slovenian climber and extreme skier Davo
    Karnicar climbed to the summit October 7, 2000, then descended on skis during
    the snowy post-monsoon climbing season. And the first marriage vows were pledged
    on summit by Pem Dorje Sherpa and Moni Mulepati on May 30, 2005.


    Whatever one’s motivation, reaching the top of the world has always been an ironman
    achievement. One must overcome the mountain’s barriers, the challenges of ferocious
    winds, thin air, and one’s own physical limits and trepidations, to win the honor
    the public assigns to success on Earth’s most exalted peak.


    But in the 1980s those barriers began to fall. Two years after my first ascent,
    I returned to the mountain with Dick Bass, a strong high-altitude performer who
    after three attempts finally stood atop Everest, fulfilling his quest to reach
    the tallest summit on each of the seven continents. To the uninformed public,
    however, he was a Texas oilman who paid his way to the top. If Dick Bass can reach
    the summit, many began to reason, then so can I. In their eyes, the bar had been
    lowered. The numbers of climbers heading to the mountain each spring began to
    rise.


    ![](OEBPS/images/Anke_9781426212413_epub_077_r1.jpg)

