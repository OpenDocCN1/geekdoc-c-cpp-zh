    ### **AUGUSTO GANSSER**


    Augusto Gansser (1910-2012), a Swiss explorer and geologist, participated in the
    famous 1936 Swiss Himalayan expedition, crossing into the forbidden territory
    of Tibet dressed as a Buddhist pilgrim. He was one of the first Westerners to
    see the sacred Mount Kailash, headwaters of four major Himalayan rivers (the Indus,
    Sutlej, Brahmaputra, and Ghaghara, which flows into the Ganges). He was impressed
    by the fact that the strata comprising Mount Kailash had been uplifted more than
    20,000 feet (6,100 meters) and yet remained essentially horizontal, whereas surrounding
    rocks were highly tilted and deformed. Gansser also discovered the remains of
    ancient oceanic crust south of Kailash, which led to the naming of the plate tectonic
    boundary, or suture zone, between India and Asia. In this regard Gansser and his
    mentor, Arnold Heim, were decades ahead of their time in their interpretation
    of Himalayan geology.


    Gansser’s research took him back to the Himalaya for five field seasons in Bhutan,
    where he conducted more pioneering geologic work along the Tibetan border in uncharted
    mountains rising higher than 24,000 feet (7,300 meters). He published profusely,
    including the tome *Geology of the Bhutan Himalaya* (1983) and, most significantly,
    the definitive volume *Geology of the Himalaya* (1964), for which he produced
    a geologic map that spanned the entire length of the Himalayan-Tibetan region
    (from longitude 70° E to 95° E) at 1:2,000,000 scale—a masterpiece of geological
    synthesis and unimaginable hard work. Gansser was honored with the title of Baba
    Himalaya—Father of the Himalaya—by the University of Peshawar for his extensive
    pioneering work on the geology of the region.


