    on Everest, either the South Col in Nepal or the North Col in Tibet. These two
    routes, from an experiential point of view, are ugly and abused—littered, shit
    ridden, crowded. They are superhighways. Fixed ropes, put in by the Sherpas, run
    up both routes all the way to the summit, which is precisely why they are guided.
    Clients would not be able to climb Everest without them.


    But don’t get the wrong idea. Everest is hardly crawling with climbers. There
    are a dozen other routes on the mountain! Most of them were put up in the 1980s,
    and all of them are difficult and seldom climbed. Everest is a massive, majestic,
    wondrous peak with two tiny ant lines on it. You can still climb Everest and not
    see a soul—you must merely have the courage, capability, and experience to tackle
    a tough route.


    ## **SUMMITING**


    At Camp IV, we rest in our tents until 9 p.m.: Then it’s time. A frigid wind is
    roaring as we strap on our oxygen masks, and every patch of exposed flesh will
    be frostbitten. In our bulky down suits, goggles, respirators, and huge gloves,
    we resemble astronauts more than mountaineers.


    As we set off in the swirling darkness, I look up at a Christmas tree of twinkling
    lights, climbers’ headlamps rising straight up into the black sky. Reaching the
    fixed lines, we again find ourselves behind dozens of dangerously slow-moving
    clients.'
