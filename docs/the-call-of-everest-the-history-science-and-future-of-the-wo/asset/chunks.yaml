    The results show that these regions were cleared at a much earlier time than first
    supposed. According to analyses conducted by the University of Colorado’s Institute
    of Arctic and Alpine Research, humans began cutting and burning the south-facing
    Himalayan forests between 3,000 and 5,000 years ago. The fir-birch-rhododendron
    forest still common on most north-facing slopes today was opened up year after
    year, most likely by Rai or Gurung ethnic groups from the south transforming the
    land for cattle grazing. Pollen analyses show that ferns became much more common
    starting 2,000 years ago, indicative of the drier, open woodland conditions that
    were being created. Birch, alder, fir, pine, and other trees and shrubs decreased
    starting about 1,500 years ago. Grass has dominated the landscape for 800 years
    now.


    So what did the early Sherpa settlers see when they first laid eyes on the Khumbu
    region in the 1500s? The landscapes may have been similar to those found today—shrub
    grasslands on the drier south-facing slopes, and cloud forests on the cooler and
    moister north-facing slopes. All in all, not a bad place to make a home.


    ## THE SHERPA ECONOMY


    Khumbu specialist Margaret Jeffries writes that the Sherpa economy was vitalized
    in the 1800s by the introduction of the potato, most likely from British colonial
    gardens in Darjiling. In addition, the accidental crossbreeding of the yak and
    cow produced an animal—the dzo—that lived longer, produced more milk, tolerated
    lower altitudes, and became a new trade item with Tibet. Namche Bazar became a
    lucrative trading crossroads where Tibetan traders brought salt to exchange for
    manufactured goods from Nepal and India. By the 1900s populations were increasing,
    new temples and monasteries were built, and young men began a seasonal migration
    to Darjiling in search of employment. The Scottish explorer and climber Alexander
    Kellas was the first person to recognize the talents of the Sherpas as high-altitude
    porters, after being impressed by their strength, commitment, and good humor when
    he took a group on a climbing expedition to Sikkim in 1920.


    ![](OEBPS/images/Anke_9781426212413_epub_031_r1.jpg)


    ### A BRILLIANT SUNRISE


    illuminates sacred Gokyo Lake in Nepal. Bright blue Himalayan lakes offer a spectacular
    backdrop for the high peaks of the Himalaya, but warming temperatures have meant
    that meltwater from the glaciers forms these lakes. Some are dangerously close
    to breaking through their moraines, or walls of glacial debris.


    The 1949 Chinese invasion of Tibet closed the border and ended trade between the
    two countries. Trade with Tibet would be replaced by tourism beginning in 1950
    as Nepal opened to outsiders. Sherpa resourcefulness, good luck, timing, and location
    all have allowed them to adapt to what could have been catastrophic changes in
    their traditional way of life. The role they came to play in climbing expeditions,
    beginning with the first attempt on Everest by the Swiss in 1952 and broadening
    to the trekking groups in the early 1960s, would have a revolutionary impact on
    Sherpa culture.


    ## VOICES: THE NAME OF THE MOUNTAIN


    Many know the origin of the Western name for Mount Everest: When the mountain
    was determined by triangulation to be the highest peak in the world, the British
    surveyor general of India named it for his predecessor, Sir George Everest.


    Far fewer Westerners, however, know the true meaning of its Tibetan name.


    Almost every book on Everest mistranslates the Tibetan name as “goddess mother
    of the universe,” based on an assumption that the Tibetan and Sherpa people who
    live near its base must revere the highest peak in the world as the sacred abode
    of a supremely important deity. But the persistent use of this translation reflects
    the great importance that outsiders, rather than the local Tibetans and Sherpas,
    place on Everest.


    Everest is, in fact, a sacred peak, but a relatively minor one. Its Tibetan name—Chomolungma
    or, more properly, Jomolangma—comes from the name of the goddess believed to dwell
    there: Miyolangsangma or Jomo Miyolangsangma. The meaning of the full name of
    the goddess is obscure. A possible translation is “the immovable goddess mother
    of good bulls,” which may explain why every year at the festival of Mani Rimdu
    at Tengboche the monks release a yak to wander freely in the mountains as an offering
    to the goddess.


    Jomo Miyolangsangma is a relatively minor goddess. As far as I know, there is
    no specifically designated Goddess Mother of the World or Universe in Tibetan
    Buddhism, and the idea of such a goddess doesn’t fit in a religion that doesn’t
    believe in a monotheistic supreme creator. If Everest were the abode of so major
    a deity, Sherpas such as Tenzing Norgay would not have climbed the mountain: As
    devout Tibetan Buddhists, they would have regarded its summit as too sacred to
    desecrate.


    So why isn’t Everest revered as the abode of a supremely important deity? Before
    the British measured the height of the peak, the Tibetans and Sherpas who named
    it had no idea that it was the highest mountain in the world. Even if they had
    known, their cosmology speaks of another mountain that dwarfs Everest: Mount Meru
    or Sumeru, a mythic peak at the center of the universe that rises more than 80,000
    miles to the heights of heaven.


    Perhaps with this mountain in mind, the Tengboche Rinpoche once asked me, “How
    do you know Everest is the highest mountain in the world until you yourself have
    seen them all?”


    —EDWIN BERNBAUM Climber, speaker, and author Edwin Bernbaum directs the Sacred
    Mountains program of The Mountain Institute, promoting the spiritual and cultural
    significance of mountains.


    ## PRESERVATION CHALLENGES


    In 1975, the government of Nepal gazetted Sagarmatha National Park, 430 square
    miles. New Zealanders expert in forestry and environmental protection worked with
    the staff of Nepal’s Department of National Parks and Wildlife Conservation to
    design a management plan. This strategic and beneficial partnership drew on the
    New Zealanders’ extensive experience in managing their own mountain parks as well
    as their long familiarity with the Khumbu region in general, first embodied in
    none other than Sir Edmund Hillary.


    At first the Sherpa people did not greet the park and its staff with enthusiasm.
    Some muttered, “Hillary first gave us sugar, but now he’s rubbing salt in our
    eyes.” The “sugar” referred to the schools and clinics he established, but the
    “salt” was the national park. Many feared the park would infringe upon their way
    of life and restrict their use of natural resources. Reforestation exclosures
    built above Namche Bazar in the 1980s by park wardens Mingma Sherpa, Lhakpa N.
    Sherpa, and Nima Wangchu were criticized as taking away valuable grazing land.
    Because their browsing habits heavily damage vegetation, goats were banned and
    removed from the park, which angered the goat owners. The sudden presence of the
    military, assigned to patrol against poaching in national parklands, created new
    tensions. Regulations prohibiting the harvesting of shrub juniper in the alpine
    zone continued to be ignored by dozens of trekking lodges. Cord upon cord of the
    slow-growing shrub fed the growing woodpiles, while the hillsides became increasingly
    denuded and eroded.

