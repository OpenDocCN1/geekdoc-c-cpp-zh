    ## SCOUTING PARTY


    ![](OEBPS/images/Anke_9781426212413_epub_002_r1.jpg)

    The National Geographic Society is one of the world’s largest nonprofit scientific
    and educational organizations. Founded in 1888 to “increase and diffuse geographic
    knowledge,” the Society’s mission is to inspire people to care about the planet.


    ## The National Geographic Society and the AME


    The National Geographic Society


    It reaches more than 400 million people worldwide each month through its official
    journal, *National Geographic*, and other magazines; National Geographic Channel;
    television documentaries; music; radio; films; books; DVDs; maps; exhibitions;
    live events; school publishing programs; interactive media; and merchandise. National
    Geographic has funded more than 10,000 scientific research, conservation and exploration
    projects and supports an education program promoting geographic literacy.


    ## The Ascent of Everest


    ![](OEBPS/images/Anke_9781426212413_epub_003_r1.jpg)

    **SUCCESS! TENZING NORGAY** holds out his ice ax into the thin air on the summit
    of Mount Everest on May 29, 1953, as he and Edmund Hillary became the first people
    to stand at the summit.


    ## The Journey


    Our ascent of a new route on Everest was a predictable stage in the evolution
    of humankind’s relationship with mountains. The underlying theme of this quest
    is to perpetuate uncertainty: First we identify a goal worthy of our dreams, then
    figure out how to get to its base, and finally seek a way to its top.


    ## The Legacy of Everest


    This book, *The Call of Everest*, also celebrates 50th anniversary of the first
    ascent to Everest by Sir Hillary and Tenzing Norgay. The AME was successful almost
    beyond our dreams. On May 1, Jim Whittaker, along with Sherpa Nawang Gombu, became
    the first American to summit. Three weeks later four followed. Lute Jerstad and
    Barry Bishop topped out by the South Col route midanoon on May 22. A tad tardy,
    at 6:15 p.m., Willi and I completed the first ascent of the West Ridge (via what
    Willi liked to refer to as Hornbein’s avalanche trap, now known as the Hornbein
    Couloir). We headed down the South Col route, catching up with Lute and Barry,
    and we four finished it all sitting out the night above 28,000 feet in an unintended
    bivouac. We were very lucky to have survived the night and lucky that Willi and
    I had been able to pull off the first traverse of a major Himalayan peak.

