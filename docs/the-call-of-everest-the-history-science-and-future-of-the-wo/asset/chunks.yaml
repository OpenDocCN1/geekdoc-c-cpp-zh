    `CONRAD ANKER ORGANIZES` bags at Base Camp, where climbers spend time getting
    acclimated before making a push for the summit. As the group’s leader, he was
    faced not only with the logistics but also with making tough calls, such as when
    to try for the summit and when to wait.


    Big Jim Whittaker, 83 but unstooped, still believes in the magic of Mount Everest.


    “The day after I stood on the summit, we got a telegram from President Kennedy,”
    says Whittaker, then recites it by heart: “For pushing human endurance and experience
    to their farthest frontiers … I know all Americans will join me in saluting our
    gallant countrymen.”


    On May 1, 1963, Big Jim, accompanied by Nepali Sherpa Nawang Gombu, became the
    first American to summit Everest. They climbed the South Col route, pioneered
    by New Zealander Edmund Hillary and Sherpa Tenzing Norgay on the first ascent
    of Everest ten years earlier. Three weeks later, in an unprecedented act of boldness,
    Whittaker’s fellow teammates Tom Hornbein and Willi Unsoeld clawed their way up
    a completely unknown route, the West Ridge. On that same day Barry Bishop and
    Lute Jerstad made the second American ascent of the South Col. The two teams managed
    to meet up, but it was late in the day and they were forced to bivouac at 28,000
    feet. Without tents, sleeping bags, stoves, oxygen, water, or food, no one believed
    they would survive.


    “God, they were lucky,” says Whittaker. “If there had been any wind, they would
    have all perished. It would have been horrible!”


    All four men survived—although Unsoeld and Bishop would lose 19 toes and two fingers
    between them—and the ’63 expedition became a tale of heroic American success.


    ## EVEREST 50 YEARS BACK


    Fifty years later, Jim Whittaker, a mountain of a man, is walking to the world’s
    highest mountain to commemorate the expedition’s accomplishments. We meet on the
    trail in the wind and later sit down together in Pheriche, a dusty tourist village
    along the trek to Base Camp.


    “Even though Hillary had climbed the South Col, there was nothing there,” reminisces
    Whittaker. “We had to climb with our eyes wide open. We knew we had to get through
    the icefall. I hated it. That’s where Jake was killed. But we had to put a route
    through it and we did. Up higher, I worked on the Lhotse Face for three weeks
    to get the route in. We led the route and then fixed our own ropes.” When I respond
    that Everest is not what it was then, that today Sherpas fix lines from Base Camp
    to the summit and that 95 percent of climbers are clients, he nods, his good cheer
    undiminished.


    “I still admire the people who reach the summit of Everest. It’s hard work and
    there are still hazards,” says Whittaker. “In a way, I think they’re getting out
    of it what we got out of it back then. They’re learning about the limits of their
    bodies. Nature is teaching them. They’re learning about the beauty of our planet,
    and maybe this will get the bastards to protect it.”


    ### TROPHY CLIMB


    Commercial guiding on Everest, which began in earnest in the early 1990s, is little
    different from climbing assistance in the Alps over a hundred years ago. Ninety-nine
    percent of all ascents of the Matterhorn have been guided climbs. (Today most
    ascents of well-known mountains—Mont Blanc, Rainier, Denali, Kilimanjaro—are guided.)
    Namche Bazar has become the Zermatt of the Himalaya, and the Sherpas, like the
    Swiss before them, have profited handsomely from the influx of tourists, trekkers,
    and climbers. So too has the Nepali government, which charges every Everest climber
    a $10,000 peak fee. Surprisingly, the precipitous increase in client climbers
    on Everest has caused an equally precipitous decline in the statistical dangers
    of ascending the mountain. Back in 1986, when I first attempted Everest with a
    team of accomplished alpinists (we reached 8,000 meters on the North Face before
    being turned back by avalanches), if you were a summiter, you had about a 10 percent
    chance of dying—worse odds than going to war. Now it’s under 2 percent.


    Whittaker, a former guide himself, concludes our conversation with a positive
    perspective toward the commercialization of Everest: “It’s just fine if people
    are paying $10,000 to climb Everest. More power to them. They could be killing
    endangered species in Africa, going for some disgusting Boone and Crockett trophy.”


    Trophy. The word will be lodged in me like a sliver for the rest of the expedition.


    ## VOICES


    ### LIVING UP TO THE LEGACY


    Everest was a part of me before I was born. My father, Barry Bishop, first went
    to Nepal in 1961 to join the Silver Hut expedition on Ama Dablam, led by Sir Edmund
    Hillary. This was five years before my birth. The team wintered at 18,000 feet
    on the Mingbo Glacier collecting what would be seminal research on high-altitude
    physiology. My mother, Lila, led her first trek from Kathmandu to Everest Base
    Camp in support of the 1963 American Everest expedition and has been leading treks
    to the high mountains ever since. Mount Everest became an unknowing cornerstone
    in so many ways for our family: The mountain would define Barry’s climbing career
    with his ascent in 1963, lifelong friendships were formed around the mountain,
    and countless adventures were launched with people Everest brought together. Our
    family would live in the mountains of Nepal in a tent for two years when I was
    a boy, and we have now worked, trekked, and climbed in the Himalaya for 50 years.
    I simply can’t remember a time when the Himalaya were not woven into the fabric
    of our life.


    My father was a member of the American Everest Expedition (AMEE) team, and I have
    been lucky enough to follow in his footsteps, reaching the summit of Everest in
    both 1994 and 2002 and attempting to summit the mountain via the West Ridge in
    the spring of 2012. This May marks the 50th anniversary of the first American
    ascent of Mount Everest, which was achieved by AMEE.


    ### GROWING UP EVEREST


    As much as I picked Everest, the mountain picked me. My father was a photographer
    and scientist for the National Geographic Society and a renowned climber—and he
    was my hero. Growing up in his household left an indelible imprint on me. I remember
    watching `Americans on Everest` as a child, the first National Geographic television
    show ever produced. It documented that first American ascent of the mountain and
    was narrated by Orson Welles. I was captivated by the grand adventure of scaling
    the world’s highest peak.

