    Most people identify Mount Everest with Khumbu, or the southern side of the mountain,
    a region inhabited by the charismatic Sherpa people and, more recently, Rai laborers
    and lodge managers from farther south. The bulk of the annual climbs, treks, research,
    cleanup expeditions, TV specials, IMAX and Hollywood films, and special events—such
    as the May 2011 summit climb and paraglide down to Syangboche airstrip by Sano
    Babu Sunuwar and Lhakpa Tsering Sherpa—take place on this side.


    But Everest contains two other inhabited, or seasonally inhabited, sides as well.
    All of the early 20th-century British climbs scaled the north side, in the Tibet
    Autonomous Republic of China, prior to the closing of Tibet and opening of Nepal
    in the late 1940s and early ’50s. On the north side, commonly associated with
    the famous Rongbuk monastery, a road used by motor vehicles leads to Base Camp,
    a tent village that hosts several dozen foreign climbing expeditions per year
    and, more recently, thousands of Chinese tourists.


    The remote Kama Valley in eastern Tibet is the gateway to the technically challenging
    Kangshung, or East Face, of Everest, which has been successfully climbed by only
    a handful of people. Since its access is so difficult, this seasonally inhabited
    valley is a much more remote and pristine region than either of the other two
    sides. The British soldier, explorer, and botanist Charles Howard-Bury called
    it “one of the most beautiful valleys in the world” while leading a reconnaissance
    of the region in 1921. British soldier and explorer Sir Francis Younghusband called
    it “the most beautiful valley in the whole Himalaya,” a view echoed by American
    author/conservationist Daniel Taylor, who is largely responsible for establishing
    the Qomolangma Nature Preserve that protects the valley.


    ![](OEBPS/images/Anke_9781426212413_epub_028_r1.jpg)


    `A VIEW TAKEN` from GeoEye’s Ikonos satellite shows Everest’s sharp relief in
    shadow and light. At this scale it seems impossible that humans climb the peak,
    but at least 15 different routes have been carved to the top.


    A low-pressure system caused by prevailing winds sucks much of the moisture during
    the monsoon season up the Arun River and into the Kama Valley, creating conditions
    much wetter than those in Khumbu or the Rongbuk region of Tibet. Old-growth forests
    of spruce, fir, hemlock, and rhododendron ascend to altitudes of 4,572 meters.
    Many of the trees reach heights of 30 feet and diameters of 10 feet or more. Clouded
    leopard, Himalayan tahr, musk deer, Himalayan black bear, barking deer, and other
    large mammals are found in these forests in relative abundance. As opposed to
    the dry, eroded, human- and cattle-impacted alpine shrub/grasslands of Khumbu,
    the alpine slopes in the Kama Valley are lush and verdant grasslands, a seasonal
    breeding ground for yaks since the 1920s. The shrub juniper and dwarf rhododendron
    have been removed by yak herders to increase grazing land, but this conversion
    to grassland has also facilitated the dramatic growth of once rare blue sheep
    populations, which in turn has encouraged the return of the equally rare snow
    leopard during the past several decades.


    Access to the valley is limited to only several months per year because snow blocks
    most of the passes during the others. Only 200 foreigners—their luggage carried
    by yaks, since portering is unknown in Tibet—visit the region per year. This daunting
    trek takes two weeks to complete, and any expedition must be entirely self-sufficient
    in terms of emergencies and evacuation plans, or otherwise face a very long trek
    out on the back of a yak. Located downwind of the Everest snow plume, the valley’s
    passes can also be blocked by more than three feet of snow falling over the course
    of one day, making escape by foot virtually impossible. Changing weather patterns
    in the entire Everest region, especially in the form of more and more catastrophic
    rain and snowstorms, add a further element of risk to the logistics of visiting
    this sublime hidden valley.


    ## EVEREST’S CLIMATE


    Geographically, the Khumbu region lies within the subtropical Asian monsoon zone,
    where more than 80 percent of the annual precipitation falls between June and
    September, although the full force of the monsoon is often mitigated by mountain
    ranges including the Numbur, Kongde Ri, Thamserku, and Kang Taiga Himal. For example,
    the average annual precipitation in Namche Bazar is 45 inches per year, but it
    decreases with altitude: Less than half falls on the alpine village of Dingboche,
    3,500 feet higher. On the north side of Everest, the Himalaya represent a much
    higher topographic barrier to the monsoon, and the region is dry year-round. Partly
    as a result, glaciers on the north side of Everest are retreating at a faster
    rate than those on the south, since little moisture replenishes the snow that
    would ensure the continued growth of glaciers. The Kama Valley to the east is
    greener and moister than either the Khumbu or Rongbuk regions of Everest, since
    it enjoys the full force of the annual monsoon.


    Winters are normally dry, although heavy snowfalls, sometimes catastrophic, are
    experienced from time to time. In November 1995, I had camped one evening on the
    north-facing slopes of Ama Dablam when I felt a curiously warm wind moving up
    the valley. The unusual red color on the summit of Everest clearly signaled to
    me one thing—the weather was changing, and fast. It was snowing lightly when we
    broke camp the next morning, but I decided to take the porters down to Tengboche,
    just to be safe, instead of advancing to the next work site. By the time we reached
    Tengboche, the snow had piled up to our knees. It soon turned heavier and continued
    throughout the day and night.


    The next morning rumors swirled through the village, telling of hundreds of tourists,
    climbers, and porters, huddled in huts or lodges. Ten feet of snow had fallen.
    More than 700 people were stranded, and tragically 26—13 Japanese and 13 Sherpas—died
    when an avalanche destroyed the yak herder’s hut to which they had retreated in
    Gokyo Valley. Thankfully, over the next few days the Nepali government managed
    to evacuate all of those who were stranded, a feat that I still believe is one
    of the most remarkable rescues in the history of mountaineering.


    ![](OEBPS/images/Anke_9781426212413_epub_029_r1.jpg)


    `THE RED SPLASH` of wildflowers alongside the Kangshung Glacier adds contrast
    to the white snow and ice of Chomo Lonzo. Its northwest and central summit were
    first climbed in 2005 by a French team. Its main summit was first climbed in 1954.


    ### A CHANGING CLIMATE


    Ten years ago, the topic of climate change in the Everest region was practically
    unheard of. Today the topic is widely discussed among visitors and Sherpas alike.
    Dramatic indicators of climate change can be seen in phenomena such as the recession
    of glaciers and the formation of new glacial lakes. During the past three decades
    in the Khumbu region alone, 33 new lakes have formed and 22 existing ones have
    expanded. Much of the local discussion of climate change centers on the growing
    unpredictability of weather patterns and the impact on crops. Traditional planting
    dates are often delayed because of the late arrival of spring rains, and young
    crops are vulnerable to the often devastating downpours once the rain does arrive.
    People claim that more snow and more rain are falling than at any time in living
    memory. The monsoon used to end by the end of August but now extends well into,
    if not to the end of, September. Thousands of tourists can be stranded for weeks
    at a time at Lukla airport, a common gateway to Everest.


    ## THE VEGETATION OF EVEREST

