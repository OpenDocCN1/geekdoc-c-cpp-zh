- fmt: '

    The American Heart Association estimates that in 2010, some six million patients
    in the United States experienced heart failure, at a cost of nearly $40 billion.
    Roughly 700,000 new cases are diagnosed annually. Heart failure is the most common
    diagnosis in Medicare beneficiaries, and these types of patients have very high
    admission and readmission rates. The causes of this complex condition are cumulative
    and broad in origin (e.g., high blood pressure, heart attack, sleep apnea, alcohol,
    viruses). Many of the current treatments and medications target the body’s response
    to heart failure rather than having a direct therapeutic influence on the heart.


    The parallels of heart failure and high-altitude extremes are therefore interesting.
    A quote from *National Geographic* field staff writer Mark Jenkins describes what
    it feels like to climb at extreme altitudes: “Duct-tape two bricks to the bottom
    of each foot, put a straw in your mouth, and then charge up several flights of
    stairs—breathing only through the straw, of course. If you find you’re sucking
    wind like a race horse, nostrils flaring, mouth drooling, and your heart is jackhammering
    in your chest, and your legs are as heavy as bags of concrete—welcome to high
    altitude.” The most common symptoms at high altitudes include shortness of breath
    with exertion, extreme fatigue, trouble sleeping and difficulty breathing, weakness
    and malaise, peripheral edema, lung congestion, headache, nausea, and dizziness
    or light-headedness—many of the same symptoms that bring heart-failure patients
    to their local physician.


    As a climber reaches high altitude, a small, complex organ called the carotid
    body—located near the neck area—senses the change in oxygen in the blood and tells
    the brain to immediately increase breathing. The carotid body also stimulates
    the nervous system, like a stress response. That sets off a number of processes
    within the body, such as an increase in nervous system activity and release of
    mediators such as adrenaline. Recent tests have shown that the reduction in blood
    flow after heart failure—caused by a drop in the heart’s pumping action—stimulates
    a response in the carotid body that is similar to what occurs at high altitude,
    when it senses low blood flow as hypoxia. The similarities also extend to the
    carotid body’s stimulating overbreathing in heart-failure patients and stimulating
    the nervous system as a stress response.


    There are more parallels between high-altitude exposure and heart failure. The
    overbreathing, or hyperventilation, that is key to adaptation at high altitudes
    negatively affects the brain’s blood flow, which causes constriction of the blood
    vessels to the brain and a decrease in carbon dioxide in the blood. Thus a battle
    emerges between the carotid body telling the brain to breathe and the brain trying
    to reduce breathing to improve its own blood flow. This tug-of-war occurs especially
    at night during periods of cluster breathing, causing episodes that resemble sleep
    apnea—that is, when a person stops breathing for more than ten seconds. Often
    the climber at high altitude awakens gasping for air, a condition called periodic
    breathing at high altitude. Heart-failure patients frequently develop a similar
    form of breathing called Cheyne-Stokes respiration, which is a period of panting
    followed by deep breaths. Associated with this condition is central sleep apnea
    (CSA)—common in heart failure. The periods of apnea at high altitudes not only
    cause more frequent awakenings and poorer sleep quality but also deeper dips in
    blood-oxygen levels at night. This likely increases the hypoxia stress response.
    One of the hypotheses of the Everest project was that these dips contribute to
    a greater stress response and higher risk for altitude-related illnesses. Both
    Cheyne-Stokes breathing and `CSA` in heart failure are also associated with higher
    risk of death.


    ## HIGH ALTITUDES AND HEART FAILURE


    High-altitude climbers can also face a problem if the blood vessels in their lungs
    constrict. This causes a high blood pressure condition in the lungs, known as
    pulmonary hypertension, that in turn causes increased shortness of breath at high
    altitude and can lead to water accumulating in the lungs, known as high altitude
    pulmonary edema (`HAPE`). `HAPE` can be a life-threatening condition, and climbers
    suffering from it may be evacuated from the mountain. `HAPE` occurs at reported
    rates that range from about 2 percent to as high as 70 percent, depending on how
    fast the ascent is made, the final altitude, the altitude at which the climber
    sleeps, and the method of lung-fluid detection. With relative rapid ascents to
    4,500 meters, the rate at which `HAPE` occurs most likely approaches 12 to 15
    percent.


    Similarly, heart-failure patients often have lung congestion, including fluid
    in the lungs. This usually occurs because of a backup of blood and pressure in
    the lungs from decreased function in the left ventricle.


    The way the body regulates fluids in the lungs is a complex subject, but recent
    studies in climbers may shed some light. Some studies have suggested that high-altitude
    exposure may cause a small rise in lung fluid in most climbers. However, in only
    a few does this actually degrade to the life-threatening condition of `HAPE`.
    Release of stress mediators, such as adrenaline and deeper breathing, may enhance
    fluid removal. Other, recent studies have suggested that a common inhaled medication
    for patients with chronic lung diseases such as asthma—called a beta agonist—may
    stimulate the clearance of fluid at high altitudes and reduce the incidence of
    lung edema. Use of this medication, long thought to have a negative impact on
    heart-failure patients, may actually stimulate the clearance of fluid for them
    as well.


    While the arterial blood in patients with chronic heart failure has relatively
    normal oxygen saturation values, the heart’s reduced pumping power causes a high
    loss of oxygen from the supply; and only a low amount feeds the tissues while
    the blood circulates. In addition, central sleep apnea may cause additional dips
    in oxygen at night. This can create a condition that resembles hypoxia (oxygen
    depravation) in sicker heart-failure patients.


    Both heart failure and high altitudes cause marked reductions in how much oxygen
    is delivered to the body’s organs and tissues. On the summit of Mount Everest,
    oxygen delivery to a healthy athlete’s tissues seems to be similar to that of
    a relatively heart-failure patient at sea level.


    ## UNSOLVED MYSTERIES


    During the recent expedition, as in the 1963 expedition, climbers suffered through
    the many days and nights of climbing Everest. Most had to overcome illness, sleepless
    nights, weather delays, emotions, and poor conditions to reach the summit of the
    highest mountain in the world. As in 1963, the physiology and mental functions
    of the climbers were recorded, cataloged, and analyzed in light of these challenges.
    How and why do some make it to the top while others do not? Why do some adapt
    to lower air pressure while others do not? The answers remain unclear.


    But we can take the lessons from Everest and apply them to the larger arena of
    human adaptation and health. Extreme altitudes provide an important model for
    studying the acute and chronic effects of oxygen deprivation on the human body.
    Scientists gain small but important increments in knowledge with each expedition,
    and these contributions get integrated into the body of medical knowledge and
    improve patient care. The 2012 Everest expedition involved a new generation of
    researchers who will carry forward this exciting endeavor to expand the realms
    of medical care.

