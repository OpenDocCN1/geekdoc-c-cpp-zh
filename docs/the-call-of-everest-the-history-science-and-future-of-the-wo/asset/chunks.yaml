    去年，我的导师 Jack Ives 给了我一盒由他的朋友兼同事 Fritz Müller 收集的老照片。Müller 是一位瑞士裔加拿大的冰川学家，也是 1956
    年瑞士珠穆玛峰远征队的科学团队领袖。当登山者们回家后，他又多留了九个月，生活在海拔 5000 米以上的地方（这是当时的高海拔记录），并与他的夏尔巴助手一起研究冰川。尽管
    Müller 身体极其强健，但他仍于 1980 年因心脏病发作去世了。在他早逝后的混乱中，他的大部分照片都失踪了，但有一盒被保存了下来，里面全是 35 毫米的接触片。随着时间的推移，我发现那盒箱子里除了笔记、岩拓、标本植物、信件和电报外，还包含了另外两个著名登山登山科学家的照片：查尔斯·埃万斯爵士（Sir
    Charles Evans）和我我的个人英雄埃文·施耐德（Erwin Schneider）。埃万斯是 1953 年英国探险队的副队长，那次探险成功让首批人类登顶了珠穆玛峰——埃德蒙·希拉拉里和丹增·诺尔盖；如果不是氧气系统故障，他可能已经先到达那里了。


    从那以后，人们进行了多次冰川调查，很大程度上是通过卫星图像作为主要数据源完成的。在 2007 年，开展的实地研究极少。考虑到媒体关于珠穆玛峰地区气候变化的种种声明，这让我觉得很奇怪。事实证明，这些研究没有一个是基于实际野外工作，也没有与当地人合作。因此，追溯埃万斯、Müller
    和施耐德的足迹，爬上并跨越冰川到达他们的拍摄点，记录变化的情况，变得更加重要。


    ## 追溯足迹


    找到拍摄照片的地点是第一个挑战。在 Müller、施耐德和埃万斯拍摄照片时，全球定位系统（`GPS`）还不存在，也没有关于他们地理坐标的记录。但我们通常能够通过对景观的熟悉程度、登山向导和牦牛牧人的建议以及运气，找到大多数拍摄点（尽管某些照片的拍摄地点至今仍让我感到困惑）。我还决定，寻找准确位置的黄金法则（特别是对于埃文·施耐德）是永远比我预期的走得更高。对于这些早期的科学家来说，没有什么是“足够好”的，无论到达那里的困难程度，他们总是追求最好的视野。有几个地方由于期间发生的气候相关变化而被证明无法到达。在某些情况下，巨大的冰崩封堵了原有的路径。某些在
    Müller 时代还坚实且健康的冰川，现在正在快速融化，使其攀登变得非常危险。另一两次机会不得不放弃了，因为坦诚地说，埃文·施耐德的登山能力简直比我强得多。


    退缩的冰川和新形成的冰川湖并不是我所研究的唯一变化。我们确定，因姆贾冰川（Imja Glacier）之所以融化得如此迅速，是因为它覆盖着薄薄层——约半米——土壤和岩石（地质学家称之为“碎屑覆盖冰川”）。碎屑在白天升温，并将热量直接传递给下方的冰层。当冰川的前进停止时，就会被碎屑覆盖，这种情况自
    19 世纪末小冰期结束以来在珠穆玛峰地区就开始发生。随着时间的推移，来自山谷和冰川侧石的巨石、岩石、土壤和其他碎屑倾泻而覆盖冰层。非常厚的碎屑覆盖层（带有如小房子般的巨石）倾向于保护它们免受阳光热量的影响。但我们观察到的冰川已经消融，或流失了质量。现在，它们的表面出现了许多新的小型融水池，任何裸露的冰川都融化了。


    海拔 5200 米以下的几十条较小冰川完全消失了。它们的海拔较低且缺乏保护性的碎屑覆盖，显然使其更容易受到该地区变暖趋势的影响。然而，海拔 7000 米以上的冰似乎保持相对稳定，因为那里的温度在大部分时间里保持在冰点以下。这些高海拔且朝北的冰层和冰川在过去的
    60 年里似乎变化不大。较温暖的南向地区往往显示出更多的融化和冰流失迹象，然而珠穆玛峰北侧的冰川融化得更快，部分原因是北侧接收的年降水量少得多。


    总之，我亲眼发现了气候变化正在发生，即使在世界上最高的山脉也是如此。冰川正在融化，新的湖泊正在形成，雪线正在向更高海拔移动，天气模式正变得不可预测。


    ## 冰川湖溃决（GLOFs）


    人们对这些变化对印度库什-喜马拉雅地区未来水供应的影响，以及冰川湖溃决可能增加表示担忧。与因姆贾一样，自 20 世纪 60 年代初以来昆布地区形成了几十个含有数亿加仑水的新冰川湖。这些湖通常由松散的岩石和土壤组成的坝体拦截，面临冰川湖溃决的风险，这种风险由湖面积迅速扩张、渗透、水位变化以及岩崩、岩滑坡或冰崩引起的涌波引发。冰川湖溃决释放储存的湖水，通常会对下游造成巨大破坏，包括高额死亡人数，以及对珍贵农田和水电设施、道路及桥梁等昂基础设施的破坏。例如，萨加玛塔国家公园
    1985 年的朗姆切溃决，摧毁了刚刚完成的价值两百万美元的塔米水电站、下游数百英亩的农田和数十座桥。1998 年尼泊尔马卡卢-巴伦国家公园辛库谷的塔玛波卡哈里（Tama
    Pokhari）溃决，破坏了下游 50 多英里的路径和季节性定居点，这种破坏在十年后的卫星图像上清晰可见。


    ## 变化的文化景观


    正如希腊哲学家赫拉克利特所说，“唯一永恒不变只有变化”，尼泊尔的昆布地区也不例外。在旅游业现象增长的推动下，昆布地区的孤独已发生了 30 年前大多数夏尔巴人无法想象的变化。最引人注目的是房屋、旅馆和商店数量及设计的变化。在
    1950 年至 1973 年间，南姆巴扎（Namche Bazar）是一个由传统的夏尔巴石屋和铺着劈裂杉木屋顶组成的宁静小村庄。现在它布满了专为游客建造的二到三层糖果色的旅馆。每年他们都向这个盆地地形更高的坡处延伸，人们醒来和入睡时听到的都是石工为另一栋旅馆切割建筑石的叮叮当声。对于前往珠穆玛峰大营的主要徒步径上的几乎每个村庄也是如此，包括昆德（Kunde）、昆琼（Khumjung）、腾波切（Tengboche）、德博切（Deboche）、旁波切（Pangboche）、费里切（Pheriche）以及更远的地方。

