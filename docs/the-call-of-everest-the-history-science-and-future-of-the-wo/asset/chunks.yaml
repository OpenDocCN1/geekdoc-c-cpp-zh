    to preserve them. Former park warden Lhakpa Norbu has written a book documenting
    Sherpa ceremonies and material culture, and he is co-authoring a Sherpa language
    dictionary with the Tengboche Lama. Likewise, a young man named Lhakpa Sonam has
    turned a traditional house, furnished with original brass and wooden utensils,
    into a museum—even though many similar houses remain in active use. Other Sherpas
    have established funds and foundations that channel support for preserving monuments.


    Meanwhile, in a village in Japan, an exact replica of the Takshindu monastery
    has been constructed by five Sherpa carpenters; the Tengboche Lama and a group
    of his monks traveled there to consecrate the structure and perform the traditional
    Mani Rimdu dance-drama ritual.


    Khumbu has enjoyed a fragile cultural and environmental balance for decades. But
    the late Trulshig Rinpoche, abbot of Rongphu monastery in the 1940s and ’50s,
    long ago predicted that much attention would be focused on Everest, and that people
    would “suffer hardship as a result of negative deeds generated in her vicinity.”
    The Tengboche Lama, too, has suggested that the noise and the fumes of helicopters
    can disturb the deities of the hidden valley, which can result in calamities.
    Helicopter and plane crashes occur with greater frequency—though this could be
    attributed to the greatly increased air traffic.


    Yet the land and people are remarkably resilient. Some of those who deeply respect
    the Buddhist traditions also regard the conservatism of the high lamas as antiquated
    in the modern age. At the same time, the monasteries benefit from the wealth that
    tourism and new enterprises have generated in their communities. Remarkably, the
    enrollment of monks and nuns has not declined over the past few decades.


    ### **SHERPAS IN AMERICA**


    The first Sherpas to visit the United States came on a State Department-sponsored
    goodwill tour that was tacked on to the 1963 American Mount Everest Expedition.
    The five wide-eyed high-altitude Sherpas began their trip at the White House,
    where President Kennedy awarded them (and the American team members) National
    Geographic’s Hubbard Medal.


    A generation later, descendants of several of the 1963 Sherpas have settled in
    America, where they are thriving. Typically, Sherpas land first in Queens, New
    York. They drive taxis, wash dishes, or pump gas—entry-level jobs on a socioeconomic
    ladder formed of ambition and hard work. A number now work as commercial airline
    pilots, doctors, and businesspeople.


    Everest gave the Sherpas a towering head start. But few have returned to Nepal,
    which still suffers an unstable political and business climate. Over time, this
    one-way emigration trend may reverse as new opportunities arise in the natural-
    and tourism-resource-rich Himalaya.


    Already a handful of Sherpas have questioned whether relocating to the U.S. is
    the right choice. “I think some of us are becoming too much like Americans,” says
    Daya Yangji Sherpa, a resident of Jackson Heights. “Now divorce has happened among
    Sherpas here—and it can be bitter and expensive, with lawyers getting involved
    endlessly. It’s crazy.”'
