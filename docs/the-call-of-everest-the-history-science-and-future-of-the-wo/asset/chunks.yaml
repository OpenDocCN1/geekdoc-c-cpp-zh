- fmt: '

    Other responses to low oxygen levels include a constriction of blood vessels within
    the lungs, which raises the pressure levels in the lungs and on the right side
    of the heart. This effect can be almost immediate, but the level may continue
    to rise over time and with higher altitudes. Although high blood pressure in the
    lungs can have negative consequences over a long period of time, in the short
    term it may redistribute blood to more regions of the lungs, increasing the total
    surface area for the transfer of gases and moving oxygen into the bloodstream
    and carbon dioxide out to the lungs.


    ### LONGER-TERM ADAPTATION


    As the “stress” of high altitude continues, the body’s many low-oxygen-sensing
    genes, proteins, and cells regulate how the body adapts. The stimulation of one
    of these proteins (called `hypoxia inducible factor 1 alpha`, or `HIF-1 a`) sets
    off a cascade of changes throughout the body, including the stimulation of a hormone
    (`erythropoietin`) that controls red blood cell production. This then increases
    the blood’s carrying capacity of oxygen.


    ![](OEBPS/images/Anke_9781426212413_epub_055_r1.jpg)


    STONE MONUMENTS, OR chortens, at the mountain pass of Thukla on the way to Base
    Camp honor climbers and Sherpas who have died on Everest. Covered in prayer flags,
    the memorials stand as a sobering reminder that not everyone makes it back from
    the mountain.


    Other longer-term changes include the increased ability of the kidneys to excrete
    bicarbonate, which buffers against swings of pH levels in the blood. This critical
    adaptation lowers the pH level of the blood and allows the gradual ramping up
    of breathing to higher and higher levels over several weeks at altitude. In addition,
    there is an increase in oxygen-carrying proteins in muscle called `myoglobin`—a
    relative of `hemoglobin`. The ratio of capillaries (branching blood vessels) to
    muscle fibers may increase and improve ability to supply oxygen to muscle. (Muscles
    are made up of many smaller fibers.) Many climbers experience a rapid loss of
    weight and muscle at extreme altitude. (The melting away of muscle without a change
    in the number of capillaries may explain the increased capillary-to-fiber ratios.)


    ### VOICES


    #### OVERNIGHT ON EVEREST


    I suppose I had it coming to me. I was the victim of my own ambition, my own weakness,
    the cold, the altitude … I paid the price for pushing on late in the day. There
    were moments that afternoon when I thought I had realized my worst terror—driving
    myself to the top of the world then finding I had no reserves left to get back
    down. After one frantic, blind glissade down the steep flank of the South Summit,
    I collapsed in a wild, gasping, fish-out-of-water panic, dug a hole in the snow,
    and just sat shivering violently, feeling very sorry for myself.


    But it was a precarious perch, and I knew I had to get a grip and stop being a
    victim. At dusk I climbed down to an easier section of the ridge. As darkness
    enclosed the mountain I switched on my headlamp and struggled to make sense of
    half-remembered rocks I had passed on the way up, ten hours earlier. (Not knowing
    the correct normal route we had climbed a steeper, more direct line, gaining the
    Southeast Ridge some way above “The Balcony.”) In the end I decided it would be
    safer to wait for the dawn. So I settled down for the long shiver.


    At first I sat on a rock. Rocks are warmer—I knew that. But this one sloped and
    I longed, no we longed—my imaginary older companion and I—to lie down flat. And
    I knew anyway that it’s better for your circulation if you stretch your legs horizontally.
    So we got up and started digging; but we were so tired, so feeble, so desperate
    to lie down, that we only managed a five-foot-long ledge in the snow before settling
    down with knees bent out over the Kangshung Face.


    By now it must have been dark for at least an hour and I still had seven hours
    incarceration before the release of daylight. I later calculated the altitude
    at about 8,550 metres above sea level. Night temperature in May: somewhere between
    -30° and -40° centigrade. Chances of survival? Well, actually, not too bad. The
    afternoon blizzard had subsided and the air was still …


    Although I never planned, or wanted, to bivouac on Everest, the grim possibility
    had always been lurking there, unspoken. I had thought very carefully about all
    my layers of clothing. And I now I took care to pad hips and head with spare mittens—token
    wads of extra insulation between my bones and the insidious creeping cold. I also
    plunged my long ice axe into the snow as a fence post to stop me rolling over
    during the night.


    There is a myth that if you fall asleep in these situations you never wake up
    … I think at one point I did actually slumber for a while, and I didn’t die. Mostly
    though I was in semi-conscious limbo, drifting through a fog of half-rational
    associations … Occasionally my rational consciousness would jolt me awake and
    banish the phantoms. I forced myself to chew some almond Hershey bar—must be some
    calories there. I sucked the last semi-frozen trickle from my water bottle. I
    thought about removing crampons and boots to massage wooden toes, but decided
    it was too risky—better to concentrate on looking after my hands. And I shivered.
    But it didn’t really feel any worse than my worst alpine winter bivouacs 14,000
    feet lower: I was anaesthetised by altitude. And in any case, I was no longer
    a victim: I was just waiting patiently for the dawn.


    —STEPHEN VENABLES In 1988 mountaineer, writer, and inspirational speaker Stephen
    Venables became the first Briton to summit Everest without supplementary oxygen.


    ### HOW HIGH FOR HOW LONG?


    What are the true limits to high-altitude exposure? While many call the process
    preparing for Everest summit “acclimation,” others would say the body gets better
    at “tolerating” the extremes. That’s why over the course of history, few long-standing
    communities have survived at extreme altitudes. In fact, no permanent communities
    on the globe exist above 17,000 feet. (For comparison, Everest Base Camp is at
    17,500 feet.) Most the communities even close to that altitude grew around industry
    (mining towns, railway communities, or observatories) and struggle with ongoing
    problems related to the altitude. The highest permanent mining community is La
    Rinada in southern Peru, which extends from altitudes of 4,900 to 5,200 meters.
    In Tibet several villages are located at similar elevations, but most settlements
    are near or below 15,000 feet, which seems to be a threshold for maintaining health
    and reproduction. Even the highest Sherpa villages are lower than 15,000 feet,
    or 4,600 meters, high. (Dingboche is at 4,400 meters and Pheriche 4,240 meters.)


    The Tibetan and Andean people who live in the highest plateau regions of the world
    provide an interesting comparison of how humans can adapt to extreme elevations.
    Although we do not know how long each of these groups has lived at high altitude,
    the consensus is that the Tibetans settled their plateau communities first and
    thus have had a greater chance for natural selection and adaptation to high altitudes.
    Both populations have adapted to their environment and appear to have relatively
    normal energy expenditures at rest and relatively adequate exercise capacities,
    even at altitudes up to 4,000 meters. This contrasts greatly with most healthy
    adults living at sea level, exercise capacity falls by 20 to 30 percent at these
    altitudes.

