  trans: '


    2012 年春天，我与许多正准备首次登顶的登山者交谈。我遇到一位带着三个孩子的单妈妈，她解释说，对珠穆玛峰冒险的梦想支撑她过了最艰难的时刻。她的孩子们已经长大，而她正站在大营，兴奋得颤抖，内心充满恐惧。我还遇到了一位商人，他老实地承认自己讨厌攀登的一切，但决心要获得那份“成功登顶”的吹嘘资本。


    我想到了这些缺乏经验的登山者们所付出的巨大牺牲，那些开支以及远离家人的人的时间。然而，这项高风险挑战需要准备、团队合作和训练，这些都能提升攀登的回报和价值。我们变得对彼此的行为和意见更加敏锐，但同时也变得独立和自我自觉。然而，最终，每一位登山者，无论是否得到多大的支持，都必须面对同样的寒冷和狂风，在山山上进行同样危险的往返。。珠穆玛峰绝不是一次简易或舒适的经历。它需要毅力去完成一项充满固有风险的未知挑战：数千英尺的悬空、落石、冰崩、雪崩以及飞驰的风暴。


    ![](img/Anke_9781426212413_epub_078_r1.jpg)


    自从最早的攀登活动以来，电影制作一直是珠峰的传统。英国的 J. B. 诺尔上尉在 20 世纪 20 年代摄影并拍摄了两次探险，其中包括乔治·马洛里（George
    Mallory）和桑迪·欧文（Sandy Irvine）在 1924 年致命的尝试。他在北美放映了自己的电影，引发了人们对前往珠峰号召的早期兴趣。


    每年都有人在这座山上死去。2012 年春季的登顶尝试导致了十人死亡——有些人是因为缺乏经验或简单的失误，有些人是因为他们想要登顶的欲望盖过了身体内部提醒他们停止并返回的警报。我们从远处评判并指责受害者认为他们决策失当且准备不足。但没有人去那里送死。登山者被一种想要登顶的、全能的欲望所吞噬，执意忽略了那些说是时候返回的信号。在缺氧、睡眠不足和脱水的状态下，很难做出自律的决策。


    我们在那稀薄的空气中寻找什么？那是我们通过技艺、训练和毅力获得的体验吗？是逃避我们下方枯燥的生活仪式吗？是一次极端的冒险吗？是一场蜕变的个人旅程？还是仅仅是荣誉章上的一根羽毛？无论人们寻求什么，终极目标毕竟是安全回到家。但在在那座山上，在那几个光辉的几周里，登山者体验了生活的简单节奏：生存并保持生命，太阳的升起日落，寻找食物和避难所。我们对天气变化以及身体的需求和局限性变得更加了。我们的生命取决于此。一天的成功往往通过一个简单的重复动作实现：你能把脚迈在另一只前面吗？在几次剧烈地喘气之后，你还能再次这样做吗？你从这场步步为营的斗争中走来，收获了惊喜、沿途中建立的友谊，最重要的是对你自己以及对我们内在的韧性与毅力的新认知。


    # 珠峰的呼唤


    基于如今的担忧，人们确实可以对这座山投下负面形象。但我永远不会那样看待它。也许这座山会被过度占据和过度使用。也许它会过时，不再是一项奖赏，被其他更具声望、更罕见的冒险挑战所掩盖。最后，我认为这并不重要。珠穆玛峰无法被削减。它无法被占据。它不是我们控制的。我们没有能力改变山的形状，但只能改变山本身的概念。我们在那里的经历叙述紧密地交织在我们集体想象的织物中。在第
    2 万次登顶之后，它还会保持这样吗？


    我们称之为珠峰的、被冰雪覆盖的巨大岩石是一块高大的屏幕，我们在上面投影了自己的希望、梦想和抱负。但在屏幕背后是一个寒冷、遥远、漠不关心的山峰，它不在乎我们是否爬上它。它不会因为我们的存在或主观而弯曲或断裂。


    当我回起 1983 年在午后余光中的第一次登顶时，那段经历是如此纯真而私。然而，我可以理解，甚至预见到第 10,000 个登顶者的深层满足感，无论是什么动机驱动着他们到达那里。意图是一件私事。


    我们人类永远渴望超越的体验，这种体验转瞬之间将我们从日常生活的复杂和混乱中释放出来。我的希望是，那些前往这座大山的旅者们，能带给它它赢得且值得的经验、技能和尊重。


    # 声音


    ## 珠穆峰的黎明


    我希望有一件事永远不会改变，那就是晴朗日子，从珠穆玛峰顶望向太阳开始升起时的景色。变化是不可避免的，但世界之巅的日出是特别的。我记得那种冰冷的空气，那种让你屏息的空气——而我那时已经在艰难地呼吸了。有一阵持续的风风咬着我脸上裸露的一小块肉，清晨的蓝光似乎永无止境。在远处，我可以看到地平线上开始形成色彩的光芒，然后一个三角形阴影的尖端从西方视野中缓慢显现。太阳辐射的能量在越过地平线时温暖了我的微笑，我看着西方的广阔之地在晨光中舞动。慢慢地，世界上最高山峰的影子遮蔽了它路径下方的一切。三角形覆盖了下方的山脉，这种其存在是最高的指示，将永远是珠穆玛峰独一无二的。


    登山者接近 KRISTOFF ERICKSON 团队成员，他是摄影师。在 2012 年 5 月 25 日登顶珠峰后，他和队友希拉里·奥尼尔（Hilaree
    O''Neill）位于第三台，距离山顶 500 英尺。


