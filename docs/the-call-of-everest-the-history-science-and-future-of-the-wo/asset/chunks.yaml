    我发现，在平衡妈妈身份与保持大远征所需的体能之间，最具挑战性的事情是，我没有足够的机会进入危险、暴露的地形，无法达到我满意的舒适程度。尽管如此，在离开孩子的时间里，我花了很多时间在野外滑非常陡峭的线路。我还找了一些朋友一起去攀冰，仅仅是为了重新熟悉暴露感，以及悬在绳索上使用冰爪和冰镐的感觉。我觉得这类训练对我来说比纯粹的体能训练价值得多。


    最后，我觉得自己对这次远征已经准备就绪。最后的挑战是将心态从“妈妈”切换到“登山者”——这可能是这一切中最困难的任务。


    —`HILAREE O’NEILL` 被 `Outside` 杂志评为运动界最具冒险精神的女性之一，作为 `North Face`运动员，她在全球范围内滑雪和攀岩。


    # 避开人群


    第二天早晨，我们在热情的呼喊声中醒来。我们的夏尔巴人已从 `Camp II` 到达，准备同我们向上直到 `Camp IV`。穿上羽绒服爬出帐篷，我们惊讶地看到一排望不到头的登山者正经过我们的营地。这搞什么鬼？这些人都是从哪里来的？我们系上安全带并排队，将
    `ascenders` 挂在向 `Lhotse Face` 延伸的绳索上。


    在我们的下方，我看到一百多名登山者，像牛群一样头挨着臀地移动。在我们上方，另外的一百名登山者也在挣扎，同样是单列队，拖着身体沿着绳向上爬。我们在山上睡着了，醒来时却发现了一个交通拥堵！


    我被挤在上方一个陌生登山者和下方一个陌生登山者之间。我们彼此紧密相接，无论力量或能力如何，必须以完全相同的速度移动。我感到非常愤怒。这简直是登山运动的滑剧。


    ![](img/Anke_9781426212413_epub_071_r1.jpg)


    2012 年，`危险的长龙`的登山者正在通过 `Lhotse Face` 之上的 `Yellow Band`。


    当然，我们知道有太多的人挤满了 `Everest` 路线。这就是为什么我们等到第二个天气良好的窗口——希望大多数登山者会在获得第一个机会时就去冲顶。遗憾的是，成百上千的其他登山者也有同样的想法。


    问题阻碍了我上方线路上的登山者。人类高速公路停止了。在原地站了十分钟后，我再也无法忍受。我取下 `ice ax`，解开绳索扣，冲向开阔的冰面，咆哮着穿过一个又一个登山者。我超过了
    10 名、20 名登山者。我没有系绳，正在单独攀爬，但地形中等。当我到达拥堵的尽头时，我发现一个夏尔巴人正试图帮助笨手笨脚的登山者，那人不知道如何解开他的
    `ascender` 或将其重新连接到下一根绳索上。我越过他们，重新挂回绳索。


    我很快到达了另一股登山者人群的末端。我再次解开并绕过他们。在途中，我注意到至少有 30 个人挂在一根破旧的绳子上，这根绳子由一根钉在冰里的、严重弯曲的单个
    `picket` 固定。这简直是疯狂。如果 `picket` 弹出，绳索或 `carabiner` 会因为三六名掉落登山者的重量而瞬间断裂，他们都会在 `Lhotse
    Face` 上翻滚而下死亡。


    与自己的队伍分离后，我继续在绳索上跳跃前进，穿越 `Yellow Band` 陡峭且裸露的岩石，横穿 `Geneva Spur` 后方。我在午饭前到达了海拔
    25,900 英尺的 `Camp IV`。至少有一百顶帐篷散落在荒凉的 `South Col` 上，像一个被狂风吹乱的难民营。随处可见碎片：垃圾、在废弃帐篷骨架上飘动的破旧尼龙布、冻结的人类粪便。


    我们团队的夏尔巴人搭了两顶帐篷，我倒在其中一顶里。我摘下 `oxygen mask`，向后躺，闭上眼睛。Kagi 给我来了一碗热面。Panuru 把头探进帐篷，叫我重新戴上
    `oxygen mask`。我的队友一个接一个到达，先是 Hilaree 和 Kris，他们俩倒在另一顶帐篷里。Emily 出现了，然后是 Conrad，最后是
    Sam。Conrad，这位老狮子，在没有氧气的情况下从 `Camp II` 一直到了 `Camp IV`。他看起来精疲力竭，脸色憔悴，满脸胡渣。


    “我废了，”他沙哑着说，“我没法冲顶了。”


    几小时后，我们将与至少 200 人一起出发，我们已经知道这将是一团乱麻。在海拔 26,000 英尺以上的死亡带，安全余地薄如蝉，救援几乎是不可能的。我们最大的恐惧不是我们自己，而是我们周围所有的登山者，其中有太多的人没有登山经验或技术技能来支撑他们爬得那么高。


    # 人迹少之路


    1963 年，Whittaker 和 Gombu 在山的高处完全孤身一人；而在今天，这是不可想象的。由于严重依赖夏尔巴的支持和一瓶又一瓶的辅助氧气，每年有
    300 多人登顶珠穆玛峰，自 1963 以来总计接近 4000 人。（当汇总所有数字时，2012 年春季将有 400 多人登顶。）如果没有氧气——登山运动中的“血液兴奋”——以及夏尔巴人，珠穆玛峰仍将是顶级高海拔登山者的专属领域。


    # 冲顶


    在 `Camp IV`，我们在帐篷里休息到晚上 9 点：然后该出发了。寒冷的风在咆哮，当我们戴上 `oxygen mask` 时，每一处暴露的皮肤都会被冻伤。穿着厚重的羽绒服，戴着护目镜、呼吸器和大手套，我们看起来更像宇航员而不是登山者。


    当我们在黑暗中出发时，我抬头望向圣诞树般的闪烁灯光，登山者的头灯直直升入黑天空。到达固定绳时，我们再次发现自己处于几十个移动极其缓慢的客户后面。

