- fmt: '

    As on all mountains, vegetation patterns on Mount Everest depend largely on altitude,
    slope, aspect, precipitation, geology, and human use. On the south-facing side,
    warm and dry shrub grasslands were created by herders hundreds to thousands of
    years ago, and they now cover the highly modified, but stable, slopes. On the
    moist and cool north-facing slopes, fir, birch, and rhododendron forests grow.
    Above 4,000 meters in altitude, shrub juniper and dwarf rhododendron also serve
    as the geomorphic glue that holds the thin, young, and fragile alpine soils in
    place. Above 5,100 meters, only sparsely distributed cushion plants can survive.


    At the entrance of Sagarmatha National Park in Monjo, altitude 2,800 meters, Himalayan
    blue pine dominates the landscape, sprinkled with Himalayan hemlock, prickly oak,
    rhododendron, and Wallich’s yew—trees that benefit from the heavier rainfall at
    these lower altitudes. Fir-birch-rhododendron forests occur between 2,500 and
    3,900 meters, mostly on north-facing aspects. The uninhabited north-facing slopes
    of Thamserku and Kongde Ri are covered in particularly thick forests of this sort.
    Maple, whitebeam, and tree juniper occur occasionally, as do a great variety of
    dwarf and tree-form rhododendrons, particularly colorful in the early to late
    spring, blossoming and fading in sequence until the beginning of the monsoon rains.
    Huge ancient juniper trees cluster around monasteries where they have been protected
    for hundreds of years, showing how large these and other trees can grow if left
    undisturbed.


    ### PLANTS AND ALTITUDE


    Looking at the north face of Thamserku, another peak in Khumbu, you can see the
    gradual upward transition from forest to tree line, and then from bands of tree
    rhododendron, shrub rhododendron, and dwarf rhododendron up to the alpine grassland
    that continues up the zone of snow, ice, and discontinuous plant cover beginning
    above 5,000 meters above sea level and continuing to the permanent snow line at
    6,000.


    Plants in the alpine zone (4,000 to 5,000 meters up) are highly specialized, containing
    most of their mass underground as roots with protective aboveground features such
    as dense rosettes or thick insulating hairs that can survive in extreme environments.
    In 1938, the famous mountaineer Eric Shipton found a saw-wort (*Saussurea gnaphalodes*)
    on a slope of scree (or loose rock debris) at an altitude of 6,400 meters on the
    north flank of Mount Everest—the world record for the highest known vascular plant
    growth.


    ### DISTURBING THE LANDSCAPE


    Alpine ecosystems throughout the Khumbu region have been heavily affected by human
    activities, especially during the past 20 to 30 years with the exponential growth
    of mountaineering, trekking, and adventure tourism. The most common damage includes
    the removal of slow-growing alpine shrubs and cushion plants by lodge owners,
    porters, and climbing parties for use as fuel. Such clearing accelerates soil
    erosion and decreases slope stability, as I was able to quantify in the 1980s.
    Other disturbances in the alpine zone are caused by increased numbers of pack
    animals, primarily yak and dzo (a mix of yak and cow), brought in to accommodate
    growing numbers of tourists. Waterborne health hazards have accelerated as a result
    of improper human waste disposal. Camping sites, base camps, and high camp regions
    are marred by accumulations of solid waste, and landfills and human waste pits
    are growing in number around the villages along the main trekking routes.


    In 2004, the Mountain Institute and American Alpine Club joined with local people
    in the upper Imja Valley, gateway to the Everest Base Camp, to form the first
    Khumbu Alpine Conservation Committee. This community organization began active
    efforts to protect and restore its alpine ecosystems by promoting the use of imported
    kerosene as a fuel alternative to wood from juniper and alpine cushion plants.
    Juniper cover has regained a strong foothold in the last decade, but much more
    work remains to be done to remedy the growing problems of human and solid waste
    management.


    Most of the thousands of people who visit Khumbu each year do so in the fall or
    spring seasons, avoiding the June-to-August monsoon rain and attendant leeches
    found at lower elevations. Having spent a summer there in the 1980s, however,
    I have always felt that the beauty of the Khumbu monsoon period is one of the
    world’s best kept secrets. The days are normally sunny and partly cloudy until
    the early afternoon, when the clouds finally make their way up the valleys and
    to the villages. The rains, usually mild, arrive in the late afternoon or evening,
    encouraging the subalpine and alpine wildflower bloom throughout the period, beyond
    compare for variety, color, and density. One especially rewarding project, our
    pressed-plant collection, is now housed in the University of Colorado Herbarium,
    and it appears in the *Khumbu Plant Catalog*, compiled by the famous German botanist
    Dr. George Meihe for the British Museum.


    ![](OEBPS/images/Anke_9781426212413_epub_030_r1.jpg)


    THE VIEW OUT- of a restaurant tent at Base Camp shows a rock-strewn field and
    the Khumbu Glacier. Some 800 people called it a temporary home during the 2012
    climbing season. Base Camp is wired for the Internet and has phone service, giving
    climbers a connection to the wider world as they get ready to attempt the summit.


    ### PEOPLING THE LANDSCAPE


    The northern side of Mount Everest is sparsely populated. The only year-round
    residents are the Buddhist monks at the Rongbuk monastery, and the Kama Valley
    is uninhabited except for seasonal Tibetan yak herders. The 3,500 Sherpa people
    who live on the Nepal side are believed to be descendants of the original Sherpa
    pioneers who crossed the Nangpa La from Tibet 500 years ago. Their name tells
    the story: Sherpa means “from the east” in Sherpa language.


    #### THE SHERPA PEOPLE ARRIVE


    Lhakpa Norbu Sherpa, the second warden of Sagarmatha National Park and the first
    Sherpa to earn a Ph.D. degree, believes that the migration was linked to political
    instability as well as economic conditions associated with the Little Ice Age
    cooling. The anthropologist Michael Oppitz, citing late 18th-century Sherpa texts,
    says that these migrants found uninhabited Khumbu “completely, from the highest
    height to the deepest valley, overgrown with thick forests” and populated by an
    abundance of wild animals. “The rivers had no bridges, the cliffs no steps; there
    were no footpaths, no dwellings, no fields of grain, no woven cloth…”


    Tibetan Buddhists consider Khumbu a *beyul*, a sacred hidden valley whose secrets
    will be revealed to the faithful when the world approaches its end. Oppitz and
    sacred mountain specialist Ed Bernbaum report that Pangboche and Dingboche villages
    were already well known as meditation sites by the time of the migration. Sherpa
    legends state that shepherds grazed their herds here well before the arrival of
    their ancestors, and geographer Stan Stevens writes of “certain ruins in high
    places in the Dudh Kosi valley” believed to have been early shepherd huts.


    ### THE STORY THE SOIL TELLS


    While digging soil pits in the shrub grasslands above the village of Khumjung
    in the 1980s, I noticed that the soil profile was more typical of a wet forest
    environment than a dry, treeless hillside. I also found fairly frequent deposits
    of charcoal from burned trees at different depths, so I decided to collect charcoal
    and soil samples at five-centimeter intervals that could be later analyzed for
    pollen content, tree species, and dates of deposition. Over the years I continued
    to collect these samples, from the far western reaches of the park to the high
    alpine regions near the Everest Base Camp.

