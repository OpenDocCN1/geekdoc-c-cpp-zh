- fmt: '

    The Tengboche Lama suggested that one expedition looking for yetis in the 1950s
    leave behind a camera so that he could take a picture. “They don’t seem to come
    out when foreigners are around,” he explained. Sherpa trek leaders make sure that
    the legend of the yeti remains alive among clients—by dramatically rattling their
    tents on occasion, once the trekkers settle into their sleeping bags.


    ## VOICES


    ### THE CHANGING KHUMBU


    The snow falls white now, but soon that brightness will fade.” These words echoed
    in my mind after my audience with the Rinpoche, head lama of the Tengboche monastery.
    The old man’s eyes looked weary with time and his efforts of selflessness. He
    sits in his simple quarters, studying the scrolls containing the written history
    of his people, the Sherpa. After almost 70 years as the community and religious
    leader of Khumbu, he says he is becoming weak of body and mind.


    “All of the lamas believe in true Sherpa culture and with them, the ways of our
    ancestors are preserved. If the lamas ever lose the belief and trust of the Sherpa
    people, though, our culture will be lost.” —Rinpoche


    The Tengboche monastery perches on a remote and wind-blown hill, high in the Himalaya,
    shadowed by the vast immensity of Ama Dablam. To most Westerners, this place and
    the monks residing within embody the ancient and now revered Buddhist culture
    of the high Himalaya. Hand-hewn stone walls, elaborately painted, tell colorful
    stories of the daily rituals of lamas, praying and playing ancient instruments
    that resonate through the mountain valley.


    “Tourists come here for our culture as it once was, so that they may feel that
    they have ventured into the unknown, but the truth is that the face of our younger
    generations holds only the surface of what our culture once was.” —Rinpoche


    One cannot fault the young people of the Khumbu region for moving away from the
    old ways of life. Taking the path of modern education and technological advances
    over a simple life of physical labor has become a trend no matter where you look.
    But what has been lost in this process, in the modernization of one of the most
    remote places in the world? It is a question I ask in my wanderings through the
    Khumbu region, this once mysterious and isolated realm of mountain gods.


    ### DRAWN TO KHUMBU


    In 1990, when I was two, my father, Alex Lowe, traveled to Khumbu for the third
    time and became the 40th American to summit Mount Everest. Ascending Everest was
    still a far-fetched and seldom accomplished feat at that time. I learned of the
    titanic mysticism of these settings via postcards and the stories he told me as
    I lay in the crook of his arm. From early on I felt the draw of the Himalaya—so
    much so that in a childish temper tantrum, I declared to my mother, “I am running
    away to Kathmandu to find Dad.”


    My father died in 1999, consumed by an avalanche in the Tibetan Himalaya. The
    region gained even more grave and mystic proportions for me. In 2001 I was finally
    able to see Nepal through my own eyes when I accompanied my mom and my new dad,
    Conrad Anker, to the Sherpa climbing school that they had launched in Phortse,
    Khumbu, Nepal. And now again, in the spring of 2012, I return to work on my research
    and photography project, looking at this remarkable culture and geography through
    the eyes of its long-standing inhabitants, people I now consider friends and family.


    To many people, Nepal and the Himalaya are still remote and mysterious places,
    to be visited only by the most bold of travelers. In the last 50 years, though,
    trekking through the Khumbu and Annapurna regions of the Himalaya has become a
    huge tourist industry, one of the largest sources of income for the economy of
    Nepal. The first power plant was established in the region in 1995, and with it
    came running water, telephones, the Internet. From the top of Mount Everest, the
    highest peak on Earth and one of the harshest environments in the world, you are
    now able to make a cell phone call.


    In recent years, a dental clinic and several medical clinics have opened, run
    by Sherpa practitioners who left for an education and returned to work among their
    people. Modern clothing and comfortable homes provide a better standard of living,
    while money and easy access via air and road to the lowlands has diversified the
    once elementary diet of potatoes, rice, and the few vegetables that grow in such
    a harsh climate. Life has become far easier and more comfortable for the Sherpa
    people of Khumbu, and they are grateful for this.


    ### FOR BETTER, FOR WORSE


    If you ask people living in Namche and nearby to name any negative effects of
    Western culture, seldom do you get an answer. Here, as everywhere, people seem
    to prefer a lavish, easier life with Western-style amenities. “The snow falls
    white now, but soon that brightness will fade,” says the lama.


    Several days later I was able to speak with Lama Geshi at the monastery in Pangboche,
    just a day’s hike up the valley from Tengboche. We spoke of what the Rinpoche
    had told me, and Lama Geshi closed his eyes, bowed his head in understanding,
    and began to speak.


    “Hundreds of years ago, the religious kings of Tibet enforced the practice of
    self-giving and selflessness, and this is where the happy disposition of the Sherpa
    people comes from. People lived simple lives here in the mountains without the
    knowledge of the swirling storm around us. Westerners came, bringing with them
    money and the idea of power. Now the people no longer focus on self-giving and
    the idea of a simple life.…


    “I am 80 years old now, and I have experienced the impermanence of human life.
    All the people in the world will die, just like else, tomorrow, next week, or
    in 50 years. Live for the day and live for a settled mind. Don’t waste days planning
    ahead when the days spent planning could be wasted of doing.” —Lama Geshi


    The clarity of what Lama Geshi said rang in my mind. With the access to endless
    monetary gain, people might better their own existence, but to what end? Western
    culture and influence has most certainly had a positive effect on the quality
    of life for individuals, but the collateral loss may not be worth the cost.


    “Stopping a flood is impossible, and these days it rains heavy from the east and
    west.” —Lama Geshi


    ### THE MOUNTAIN GODESS


    One of these deities resides on Mount Everest: Miyolangsangma, the Goddess of
    Inexhaustible Giving. The mountain is her palace and playground, and Sherpas view
    themselves and the climbers as guests at Base Camp, arriving without invitation.
    Only when the Sherpas have made offerings to Miyolangsangma and other deities
    at the `lhap-so`, a makeshift shrine that is normally built soon after arrival
    at Base Camp, do they feel comfortable entering the treacherous Khumbu Icefall.
    Miyolangsangma is regarded as one of the five “Long Life Sisters” who reside on
    nearby peaks of the region, protecting the area from harm while providing spiritual
    nourishment to the residents who dwell on her flanks.


    In paintings, Miyolangsangma is depicted riding on a tigress that levitates her
    through a celestial realm. She exudes an air of stern benevolence, as if requiring
    that her beauty and generosity be reciprocated with respect and offerings. A cornucopia
    of fruit in her right hand represents good fortune, wealth, and abundance, and
    her left hand is positioned in a gesture of giving. It is her power, one monk
    said, that has delivered to the Sherpas great bounty—in the form of climbing expeditions
    and foreign travelers, to begin with.

