    An important cultural feature of the preserve is the Rongbuk (Dza Rongpu) monastery,
    a Tibetan Buddhist monastery in the main Dzaka Chhu River Valley draining the
    base of Qomolangma. The monastery, believed to be the highest in the world at
    5,060 meters, is located near the Rongbuk Glacier. It became known to the outside
    world through reports from the first British mountaineering expeditions to Everest,
    passing through the river valley en route to Base Camp at 5,364 meters above sea
    level.


    Several years ago, Chinese officials entertained the idea of closing the region
    to mountaineering and tourism in order to give the landscapes a chance to recover
    from decades of unregulated adventure tourism. In spite of its remoteness and
    comparative lack of visitors, garbage accumulations and the inevitable burning
    of fragile shrub juniper for fuel were reaching unacceptable levels. The restrictions
    were not enacted, however, and, for better or worse, the Base Camp region has
    remained open to foreign visitors.


    ![](OEBPS/images/Anke_9781426212413_epub_032_r1.jpg)


    A MOUNTAINEER WALKS in front of large ice pinnacles on the East Rongbuk Glacier
    on Everest’s northern side.


    ## DECADES OF CHANGE


    During the 1970s and 1980s, Khumbu was frequently cited as a case study of poor
    land management. Scientific and popular articles at that time proclaimed that
    the region was suffering from extensive deforestation as the result of a growing
    population, the influx of Tibetan refugees in the early 1950s, increased and unregulated
    tourism, and the breakdown of traditional Sherpa practices of natural resource
    management. One widely quoted anthropologist stated in 1975 that “forests in the
    vicinity of the villages have already been seriously depleted, and particularly
    near Namche Bazar whole hillsides which were densely forested in 1957 are now
    bare of tree growth, and villagers have to go further and further to collect dry
    firewood.” Another often quoted remark was that “more deforestation [has occurred
    in Khumbu] during the past two decades than in the preceding 200 years.”


    At the same time, a much smaller, but equally vocal, contingent of people held
    the exact opposite view point view. “There are more trees in Khumbu now than there
    were in 1950, and I have the photographs to prove it,” said Charles Houston, an
    American physician, high-altitude expert, member of the 1953 K2 expedition, and
    one of the first foreign visitors to the Everest region in 1950.


    ### SCHNEIDER’S RECORD


    Who was right? For answers, I turned to one of the best mentors that I’ve ever
    had, and whom, incidentally, I never met: the Austrian climber-cartographer Erwin
    Schneider, who passed away in the late 1980s. Between 1955 and 1963, Schneider
    completed a field survey of the Khumbu region that included the use of terrestrial
    photogrammetry—determining geometric properties of objects and making maps from
    photographs taken at high-altitude vantage points. His camera was huge and heavy,
    and it is now housed at the Austrian Alpine Club in Innsbruck. That he was personally
    carrying this camera and its equally heavy tripod in his late 50s, often scaling
    semi-technical mountains and outcrops above 5,500 meters to get a particular landscape
    photograph, came as no surprise once I learned that Schneider had had one of Austria’s
    top alpinists in the 1930s.


    In 1984, while living in Khumbu, the Swiss geologist Daniel Vuichard gave me a
    packet of Schneider’s photographs taken in the 1950s. I instantly realized that
    they provided a valuable window into the past and might help to resolve some of
    the controversy concerning the changes in the landscape since that time. Little
    did I know then that I would be retracing Schneider’s footsteps, replicating his
    photographs of villages, mountain landscapes, and glaciers, for the next 30 years.


    In my spare time in 1984, and then again in the course of research expeditions
    launched in 1995, 1999, 2001, and 2007, I replicated dozens of Schneider’s photographs.
    In that way I was able to add my own research results to the landscape-degradation
    discussion. As early as 1984, it became clear that Charles Houston was right,
    after all: The hillsides above Namche Bazar had not been densely forested earlier
    in the century. The landscapes of the 1950s were essentially unchanged 30 years
    later. During the 1990s, the repeat photographs started to reveal a very encouraging
    phenomenon. The tree cover surrounding the main Sherpa villages, and along the
    Imja River Valley, was in fact increasing.


    ![](OEBPS/images/Anke_9781426212413_epub_033_r1.jpg)


    NAMCHE BAZAR, SHOWN in photos taken in 1973 (top) and 2008 (bottom), has grown
    since the days when Sherpas built stone houses. Now lodgings are multistoried
    and satellite dishes dot the rooflines, making Namche the gateway to Everest and
    Khumbu Valley’s largest town.


    ### REPEAT PHOTOGRAPHY


    Replicating the photographs taken by Schneider, Houston, and others in the 1950s
    allowed me to track the tremendous growth and development of the Sherpa villages
    located along the main Everest Base Camp trail, including an almost complete change
    in building materials and styles. Retaking the photos also provided a unique opportunity
    to demonstrate just how dynamic a landscape the Everest region was. The scars
    and impacts of destructive glacial-lake-outburst floods (`GLOFs`), landslides,
    and torrents that had occurred in the interim could be easily seen when comparing
    the old with the new.


    ## CHANGING GLACIERS


    The then-and-now photos had other valuable uses. In the fall of 2007, I was climbing
    at 5,500 meters up a steep, precarious boulder field in the upper Imja Khola watershed.
    The steep and extensive ridge that makes up the south faces of Lhotse, a neighbor
    peak to Everest, rose for thousands of meters above me across the valley. The
    summit of Everest was hidden because of my relatively low altitude. A light snow
    that had fallen the night before was turning what would have normally been a scramble
    into a semi-technical and quite dangerous climb. Finally, I realized that it would
    be foolhardy to proceed under these conditions. I called out to Pema Tema Sherpa,
    my research assistant and two-time Everest summiter, to stop. Our altitude, 100
    meters below the cairn that Erwin Schneider had constructed to mark the location
    of his photo, was good enough for the objectives at hand.


    Comparing the old photograph and the view in front of me now revealed a dramatic
    change in just 60 years. The Imja Glacier that I had hoped to reograph was gone,
    replaced by a lake almost half a mile long. Icebergs as big as a house had broken
    off the former glacier and now floated aimlessly in the water. The glacier had
    melted, leaving behind a large and potentially dangerous lake in its wake.


    ![](OEBPS/images/Anke_9781426212413_epub_034_r1.jpg)


    GLACIOLOGIST FRITZ MÜLLER surveyed and photographed the glaciers around Everest
    in 1956, providing key data points for the study of changes in the ice and climate
    today. Here Müller and assistants view Everest (the black slope to the left) from
    an altitude above 18,000 feet (5,500 meters).


    ### MÜLLER’S RECORD

