    than George Mallory. In 1933 an ice ax was found on a rock slab 250 yards below
    and east of a rock step now called the First Step. This was somewhat lower than
    Odell’s sighting, but it almost certainly belonged to one of the two climbers.
    Then, in 1975, Chinese climber Wang Hongbao reported that he had spotted the body
    of a climber he referred to as “an old English dead.” His grim discovery took
    place near Camp VI at about 27,000 feet. Unfortunately, he could not be questioned
    further because he died a day later on the mountain.


    ![](OEBPS/images/Anke_9781426212413_epub_040_r1.jpg)


    **DURING THE 1922** British expedition, George Mallory and Edward Norton climb
    toward their high point of 26,985 feet (8,225 meters) on the mountain. A couloir
    on the North Face would be named for Norton, now also known as the Great Couloir.
    Reinhold Messner would use it for his 1980 summit—the first solo ascent without
    supplemental oxygen.


    In 1986, American Tom Holzel engaged British Everest historian Audrey Salkeld
    for the first expedition specifically mounted to search for the pair. Their effort
    was unsuccessful. In 1999, a young German, Jochen Hemmleb, teamed up with Salkeld
    and an American team led by Eric Simonson to mount a second effort. Their discovery
    would shock the mountaineering world.


    ## **EARLY AUDACITY**


    Nine years after the 1924 attempt, another team headed off. Among them was Eric
    Shipton. Born in 1907 in what was then Ceylon—today’s Sri Lanka—Shipton was brought
    to London at the age of eight in order to “settle down.” Yet school proved to
    be a disaster, for Shipton showed the classic signs of dyslexia. He eventually
    moved to East Africa to farm. Already a keen climber, he attracted the attention
    of another Briton farming in Africa—H. W. Tilman. Although he was older by ten
    years than Shipton, the two soon became climbing companions. The gregarious Shipton
    and reclusive Tilman seemed unlikely partners, but they are probably the most
    legendary pair in the history of mountaineering.


    Shipton’s exploits earned him an invitation to climb in the Garhwal Himalaya,
    which in turn brought him to Everest. Although three climbers of the 1933 team
    equaled the height record set by Norton in 1924, they did not reach the top. Shipton
    was sure that a smaller, lightly equipped team, moving quickly, would have a much
    better chance.


    The next year Maurice Wilson, a British aviator with no mountaineering experience,
    became convinced that he could climb the mountain. Armed only with his inflated
    self-confidence, he made his way through Sikkim and Tibet, traveling in disguise
    because he did not have a permit. An extreme ascetic, he planned to live on rice
    water, ascend the Rongbuk Glacier, and climb the peak in three or four days. Luckily,
    he came across the 1933 team’s food dump at Camp III, which he seems to have sampled.
    But what he ate wasn’t enough to get him to the summit, and he died not far from
    the dump. Even Eric Shipton, the master of minimalism, had to concede that Wilson
    had taken this approach too far. Still, he admired his conviction. “It was not
    mountaineering, yet it was magnificent,” he later wrote.


    By contrast, the 1935 expedition was a cautious endeavor. The team was charged
    solely with finding a way onto the Western Cwm from the north side. Many felt
    disappointment that this group, led by none other than Shipton, wasn’t going all
    the way. Shipton had a horror of large-scale affairs and delighted in keeping
    expeditions lean and mean, a “lightweight” approach that endeared him to future
    generations of climbers. His team managed to scale 26 peaks over 20,000 feet (6,000
    meters), which he described as “a veritable orgy of mountain climbing.” On the
    team was a 19-year-old Tibetan Sherpa named Tenzing Norgay, hired by Shipton in
    Darjiling. The 11th of 13 children, he was already smitten with Everest, and Shipton
    gave him his first chance.


    The 1935 expedition collected a great deal of information that would contribute
    to future success on the mountain. It explored much of the surrounding area, gained
    a better understanding of the time window in which the mountain could be safely
    climbed, and proved the value of a small, nimble team. This expedition showcased
    Shipton as a model explorer.


    A large expedition was defeated by storms in 1936, and in 1938 Tilman took charge.
    Like Shipton, he favored the lightweight approach. Tilman was not a tolerant man,
    particularly of teammate Noel Odell, who was attempting to conduct scientific
    experiments with a humidity machine. “The results were so unexpectedly various
    that one concluded the thing was only guessing,” Tilman concluded. He further
    criticized Odell for his lengthy field notes, which he characterized as a full-length
    tome. Even Shipton got on his nerves, carrying with him the “longest novel that
    had been published in recent years.”


    Tilman was famously fussy about food supplies. He scoffed at jam, pointing out
    that the only valuable component was the sugar. Why not just take sugar, eliminating
    all that extra weight? Tinned food, commonly used at the time, was another waste
    of time in his opinion, since most of the weight was in the tin! He preferred
    real food: bacon, ham, cheese, butter, and eggs. In 1938 he managed to serve up
    a “full English breakfast”—bacon and eggs—all the way to the North Col. Despite
    the good food, the expedition was another failed attempt, one that Shipton referred
    to as a “vile waste of time.” Then World War II intervened and priorities shifted.


    ## **NEPAL OPENS ITS DOORS**


    In 1949, the Kingdom of Nepal opened its doors to foreigners. The following year,
    American climber Charles Houston and his father, Oscar, gained permission to travel
    into the Solukhumbu region to survey the south side of Mount Everest. They invited
    Tilman, and despite his misogynous attitude, he accepted, even though a woman
    was coming along. “Hitherto I had not regarded a woman as an indispensable part
    of the equipage of a Himalaya journey but one lives and learns. Anyhow, with a
    doctor to heal us, a woman to feed us, and a priest to pray for us, I felt we
    could face the future with some confidence.” Their assessment of the south approach
    to Everest was gloomy. Houston thought the icefall might be “forced” but admitted
    it didn’t look promising. Tilman was more succinct: “Impossible. No route.”


    The Everest reconnaissance was Tilman’s last foray into the world’s highest peaks.
    A practical man, he assessed his years in the Himalaya, his current physical condition,
    and his level of motivation and determined that it was time to move on. Long and
    dangerous voyages to Patagonia and Greenland brought him many more years of adventure,
    and, perhaps fittingly, on November 1, 1977, he sailed with a crew in the direction
    of the Falkland Islands. He was never heard from again.'
