    Alexander Kellas, an early explorer of the Himalaya, used this vest-pocket camera
    on his unfulfilled Everest expedition of 1921; he died en route to the mountains
    of dysentery and heart failure. The `Canon 5D Mark II` camera with numerous digital
    features, including video, was one of several cameras used on the 2012 National
    Geographic expedition.


    In 1996 I led the Everest IMAX film expedition and directed the filming on the
    mountain. I witnessed for the first time the early stages of overcrowding, along
    with widespread inexperience among the climbers and a strength-in-numbers approach.
    In this golden age of guided expeditions, 12 of them ventured up the mountain
    that season. In early May a violent, fast-moving storm left eight climbers dead,
    captivating the world’s attention. The more the media and press dramatized what
    happened on Everest—a husband’s last words to his wife, a doctor’s loss of both
    hands to frostbite, a perilous high-altitude helicopter rescue—the more compelling
    the mountain became, and its value rose in the eyes of the public, and climbers
    too.


    Afterward, at every public lecture I gave, an audience member would ask, “Did
    that tragedy change the way people climb?” The answer is, `Not really`.


    ### What lies ahead for Everest? Every year the support system for climbers, clients,
    and guides will improve, along with better cooperation and communication among
    team leaders. Some guiding services will enhance their success rates, sharpen
    operational efficiencies, and increase their familiarity with their clients’ strengths
    and weaknesses. But many will not.


    Traditional and social media will continue to spread images and personal accounts
    of the Everest experience across the globe. In addition to the usual cadres of
    clients and guides, its slopes will be crowded with fund-raising, cleanup, and
    corporate-challenge expeditions but thinning prospects of achieving significant
    firsts.


    ### Could a breaking point be reached? A photo taken on the `Lhotse Face` in May
    2012 shows 156 people departing `Camp III` at 23,000 feet on their way to the
    `South Col` at 25,900 feet, streaming upward in a cheek-to-jowl procession. Can
    the mountain and its popular routes sustain these numbers? Will climbers and clients
    begin to turn away from an experience that puts them in a conga-line formation?
    I know climbers who have reached the summit in the predawn darkness even though
    they had only a dim view from the summit. Why? They left the high camp at 8 p.m.
    to avoid the crowds.


    I often think about my own role in the growing numbers of summit seekers. Some
    of us who treasure this mountain have spread our knowledge in the interest of
    income and education and inadvertently have become its prime publicists. Capt.
    `John Noel`, a member of the 1922 and 1924 Everest expeditions, made films of
    both journeys and crisscrossed the North American continent eight times to screen
    them for packed audiences. More than 70 years later, 30 million people in 38 countries
    would watch `Everest`, the IMAX film based on footage my team shot before and
    after the catastrophic storm of 1996.


    Everest has always drawn the purist, the dreamer, and the trophy hunter. Most
    are a mix of all three, and each climber brings a wide range of abilities and
    capacity to the mountain. Dangers will increase if their ambition isn’t matched
    by experience, and many individuals feel they don’t need to take the necessary
    steps to prepare themselves for the mountain and its unforgiving moments. The
    public rarely inquires how you made it to the top, focusing only on the achievement.
    Too often climbers likewise focus on the prize and the accolades, not the huge
    support system and the Sherpas’ hard work and expertise required to get them there.
    When climbers don’t take part in the decision making, they are no longer agents
    in their own fate and forsake an intimate connection to the mountain, its weather,
    and its dangers.


    ## VOICES


    ### **SUSTAINING LIFE ON EVEREST**


    While the future of mountaineering on Everest remains unclear with global climate
    change transforming the high Himalaya, one can rest assured that Everest will,
    as it has done in the past, continue to captivate a world audience.


    Fleshing out the richness of the Everest experience requires a look at the social
    environment of the mountain and recognizing that, as they have in the past, Sherpas
    will be decisive factors in any future effort. Most notably, Sherpas, the formerly
    agrarian inhabitants of Everest’s southern foothills, are no longer simply load
    bearers on Everest’s majestic features. In the last decade of increased commercial
    guiding on Everest, we have seen Sherpa mountaineers take on a decisively important
    and urgent role in the safe management of foreign mountaineers on expeditions.


    Through on-the-job training and such organizations as the `Nepal Mountaineering
    Association` and the `Khumbu Climbing Center`, we are witnessing a transformation
    of knowledge and endowing of professional guiding skills to enthusiastic and capable
    climbers of Sherpa and other Nepali ethnicities. Sherpas have from the turn of
    the 20th century exhibited their remarkably adaptable physiology for climbing
    in the high Himalaya. Now, they will dominate the arena with superior climbing,
    guiding and organizational skills. This transformation will not take place overnight,
    but improvements have been noted most recently on expeditions where Sherpa guides
    do all the technical engineering of the climbing route, a task once relegated
    to the superiorly trained Western climbers leading the expeditions.


    There is also the urgent objective of sustainability and the promotion of the
    mountain as an international symbol of environmental sensitivity and best practices
    in a wilderness setting. The Sherpa people will be driving the changes here as
    well, with great support from the visitors from the developed world—but the local
    population need to assume the role of champion stewards. Managing `Base Camp`
    habitation, organizing removal of waste materials, and ensuring the acceptable
    condition of the physical environment are critical objectives. Yet more expansively,
    conditions leading to `Everest Base Camp` in the villages of the Sherpa heartland
    need also to be addressed. Deforestation, overdependence on slowly renewable fuel
    sources, overconstruction of certain municipalities to increase tourism, management
    of potable water, and a vast array of similar issues face any future that Everest
    anticipates.


    Though unmentioned, the political and social challenges that the Everest region,
    its people, and visiting mountaineers must confront are complex. With a central
    government far away in `Kathmandu` that is characteristically unaware of the issues
    faced by Everest locals, new authority and resources need to be both delegated
    to and managed by the Sherpas themselves or committees of Nepali people intimate
    with the environmental and social challenges that threaten the communities, their
    livelihood, and the fabric of their fascinating society. Though the problems are
    large and solutions obscure, the Sherpa people have demonstrated, from one generation
    to the next, a tenuous adaptability and an enthusiastic and entrepreneurial spirit,
    tempered with deep compassion and strength. They are amongst the world’s great
    survivors.


    There’s no telling what future awaits; suffice it to say that Everest has the
    potential once again to be not only the sine qua non of the mountaineering endeavor
    but also an example of enlightened development of rural communities and stewardship
    of one of the grandest mountains on Earth. Expect to be surprised, inspired, frustrated,
    perhaps incredulous—just not bored!


    **—PETER ATHANS** Nicknamed “Mr. Everest,” Pete Athans is a mountaineering athlete
    with The North Face who has summited Everest seven times. He and his wife, `Liesl
    Clark`, and their two children live part of every year in `Khumbu`.

