    and books. Communication in 2012, for better or worse, was immediate. A nearby
    cell tower now allows Sherpas and climbers to keep in touch with their families
    on a daily basis. Satellite phones, about the size of a stick of butter, provide
    instant communication from the upper reaches of the mountain. We shared the Base
    Camp experience with thousands of people via a real-time Google chat. And on May
    26, 2012, I met up with my friend Dave Hahn on the summit. It was his 14th ascent
    of the mountain and my 3rd. Under blue skies, we were able to spend a bit more
    summit time together than we had 13 years earlier.


    After this, I realized that my connection with Everest had come to a turning point.
    I was as old as the 1963 Everest expedition. I had reached the summit without
    supplemental oxygen, an accomplishment that required more effort and personal
    sacrifice than my first two climbs. In my mind, I had treated the mountain with
    greater respect, climbing the peak by fair means.


    My connection to the Khumbu region of Nepal, my bonds to the Sherpas who inhabit
    it, and the friendships stemming from two decades of climbing there have left
    me with meaningful and lasting impressions. While I have traveled to the Himalaya
    to climb ice, rock, and mountains, it is the interactions with indigenous populations
    that I have valued most. In 2012 I joined the advanced Sherpa team to ascend the
    Lhotse Face. We climbed together, fixing rope for all of the subsequent climbers.
    I experienced firsthand the work these climbers do to prepare the route each season.
    From Tenzing Norgay Sherpa in 1953 to Panuru Sherpa, our sirdar (or expedition
    leader) in 2012, Sherpa climbers have been integral to Everest history. Their
    hard work and dedication provide the foundation for all successful ascents. Every
    climber owes a debt to these unsung heroes of Everest.


    ## **FOREVER EVEREST**


    Despite the naysayers, Everest still offers challenges for the aspiring alpinist.
    Fantasy Ridge, originating from the Kangshung Glacier in Tibet and connecting
    to the Northeast Ridge, is perhaps the largest unclimbed challenge in the Himalaya.
    Repeating routes in better style—without the use of fixed ropes, high-altitude
    support, and supplemental oxygen—still offers climbers unlimited opportunities
    to test their mettle.


    Everest remains a symbol of exploration and discovery. Its increase in popularity
    has reflected the growth of humanity on our planet. The challenges of resource
    use and overcrowding on Everest mirror what civilization below is facing. The
    Himalaya, a low-latitude, high-altitude mountain range, is at the forefront of
    anthropogenic climate change. The glaciers are subject to global warming and a
    changing atmosphere. These challenges are the next “Everest” for human discovery
    and exploration. The same drive that brought humans to the summit will motivate
    future generations on to further unknowns. If our expedition to Everest has helped
    to keep the flame of inquisitiveness and motivation alive, we will have contributed
    to the collective human drive for a better life here on Earth.


    Please join us as we explore Everest in the coming pages.


    # ![](OEBPS/images/Anke_9781426212413_epub_011_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_012_r1.jpg)


    Ancient Persian geographers called the mountains of central Asia Bam-i Dunya—the
    roof of the world. Extending for nearly 1,800 miles, the Karakoram-Himalayan-Tibetan
    belt is a dynamic geological laboratory, formed by the closure of two ancient
    ocean basins and the collision of numerous blocks of Earth’s crust. It holds an
    irresistible attraction for a structural geologist like me. I wanted to see the
    peak and walk the trails myself, and so I joined the Legacy Expedition led by
    Conrad Anker.'
