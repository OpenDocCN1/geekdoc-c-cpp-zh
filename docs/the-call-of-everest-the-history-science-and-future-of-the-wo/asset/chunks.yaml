    in the spring of 2012\. This May marks the 50th anniversary of the first American
    ascent of Mount Everest, which was achieved by the AMEE. My own three expeditions
    to the mountain over the course of nearly two decades have given me a unique vantage
    point from which to reflect on the significance of the 1963 American team.


