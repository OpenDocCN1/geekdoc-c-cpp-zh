    But there are also applications in more everyday settings, such as the hospitals
    and clinics that treat patients with congestive heart failure, sleep disorders,
    lung disease, and other conditions similar to the hypoxia, or lack of oxygen,
    experienced by climbers and others at high altitudes.


    ## HIGH-ALTITUDE CHALLENGES


    What is it about higher altitudes that challenges the body?


    In the 1600s, on the heels of work by Galileo, an Italian physicist, Evangelista
    Torricelli (1608–1647), determined that the air above us has weight. Around this
    same time physicist Robert Boyle (1627–1691) and others discovered that the weight
    of air (or air pressure) determines the level of oxygen in our lungs and subsequently
    in our bloodstream. This explains the challenge of surviving at high altitudes:
    Air pressure drives oxygen into our blood, and the agony felt by climbers comes
    from a severe lack of air pressure.


    Before we can explore how altitude affects the body, we must first understand
    how the body processes and uses oxygen on the Earth’s surface. We breathe oxygen
    into our lungs, and from there the oxygen enters the bloodstream, traveling to
    body organs that require oxygen to operate. Hemoglobin is the metalloprotein in
    red blood cells responsible for transporting oxygen throughout the body. Blood
    that has run through the body returns to the lungs for a fresh infusion of oxygenated
    air, which means that on average the amount of oxygen in the lungs is greater
    than the amount of oxygen in the arteries.


    Oxygen saturation values (one measure of the amount of oxygen in the bloodstream)
    normally range between 95 and 100 percent. At sea level it is difficult to hold
    one’s breath long enough to cause a significant drop in these values. When values
    fall below 85 to 88 percent, as can happen among patients with chronic lung disease,
    it often becomes necessary to use portable or home oxygen in order to maintain
    a normal quality of life.


    Almost everywhere on the surface of the Earth, the amount of oxygen in the atmosphere
    remains stable at 21 percent. In fact, from sea level up to the limits of the
    Earth’s atmosphere (62 miles, or 100 kilometers, above the surface), oxygen levels
    in the air remain nearly constant. What changes is air pressure, which drops proportionally
    as altitude increases. The atmospheric pressure at Everest Base Camp is about
    half that at sea level; at the summit, it’s one-third that at sea level. In other
    words, each breath of air taken in at high altitude contains less oxygen than
    at sea level. As a result, oxygen levels in the lungs and in the blood drop in
    parallel with the atmospheric drop in pressure. Normal oxygen saturation levels
    at 10,000 feet (3,000 meters, just above the starting point for most Everest expeditions)
    are between 88 and 90 percent. During sleep, when breathing slows, these levels
    may fall below 84 percent—lower than the point at which many lung-disease patients
    use supplemental oxygen.


    The balance between oxygen levels in the lungs and arteries is especially important
    when climbing at high altitudes. Physical exertion increases the speed at which
    red blood cells travel through the lungs and thus reduces the time blood spends
    getting replenished with oxygen in the lungs. The combination of exercise and
    high altitude doubly stresses the body, more and more the higher a person climbs.
    (I should point out here that any given individual’s ability to adapt to high
    altitudes can vary dramatically and depend on a variety of factors including genetics,
    overall health, and altitude of residence, as well as a number of situational
    factors such as hydration levels.)


    ## MOUNTAIN DANCES


    The body is equipped to handle modest changes in altitude. For example, changes
    in air pressure at altitudes up to 8,000 to 10,000 feet (2,500 to 3,000 meters)
    only mildly reduce the oxygen saturation in the body, thanks to the unique properties
    of hemoglobin. But at greater heights, the lack of oxygen can have serious—and
    even fatal—consequences. Without the benefits of the acclimation process—in other
    words, if a person moves rapidly from sea level to an extreme altitude—most, if
    not all, individuals would become sick above 15,000 feet. They would likely be
    conscious for only 20 to 30 minutes at 18,000 feet and only for 1 to 2 minutes
    at the summit of Mount Everest.


    ![](OEBPS/images/Anke_9781426212413_epub_054_r1.jpg)


    **BRITISH CLIMBER STEPHEN** Venables returned 20 pounds lighter after his ascent
    of the Kangshung Face, the east side of Everest, without oxygen in 1988\. Extended
    time at altitude can lead to rapid weight loss, which includes the loss of muscle.


    In order to avoid the worst effects of altitude sickness, most climbers who plan
    to summit Everest spend six to eight weeks in a laborious dance with the mountain
    and their health. This dance of acclimation includes a gradual ascent to Base
    Camp followed by several rotations to higher and higher altitudes, the climbers
    slowly pushing the “hypoxic stress” in hopes of stimulating the body to adapt
    to higher altitudes. While the body becomes more able to accommodate the extreme
    altitudes, sustained time spent at altitudes as high as Everest Base Camp and
    above can cause muscle deconditioning and muscle loss. Thus a balance must be
    negotiated between acclimating to heights and losing muscle condition. Some climbers
    even go down to lower altitudes for brief periods of time to gain back some muscle
    strength. The protocol for acclimation has primarily been developed by trial and
    error, taking advantage of the impressive adaptive abilities of the human body,
    particularly for short windows of time.


    ### IMMEDIATE DEFENSE


    How does the body respond to reduced oxygen levels in the blood and a reduced
    amount of oxygen delivered to tissues? The amount of oxygen delivered to tissues
    is a product of several factors: the number of red blood cells (`hemoglobin levels`);
    how saturated the hemoglobin molecules are with oxygen (`arterial oxygen saturation`);
    and the output of the heart (`heart rate` and `volume pumped per beat of the heart`).


    The first response to lowered oxygen levels occurs almost immediately. Breathing
    speeds up so that the amount of air inhaled increases. This boosts the oxygen
    levels in the lungs and subsequently in the blood. Heart rate also rises, which
    pushes more blood into the body and boosts the delivery of oxygen to the tissues.
    In addition, soon after a person reaches high altitude, urine production increases,
    and some fluid may shift from within blood vessels to outside. This reduces the
    water in the bloodstream and makes the red blood cells more concentrated. That
    in turn increases the amount of oxygen transported for a given volume of blood.
    The reduction of liquid in the bloodstream, however, results in a drop in the
    volume pumped per beat of the heart. (A side effect of this process is dehydration,
    which can increase the likelihood of acute mountain sickness, or AMS, characterized
    by headache, nausea, and fatigue. Thus drinking large amounts of water is essential
    at high altitudes.)


    The hemoglobin molecule in red blood cells works differently depending on many
    factors: `pH level`, `carbon dioxide level`, `temperature of the blood`, for example.
    These properties of hemoglobin play an important part in how the body adapts to
    high altitudes. For example, as breathing increases at high altitude, the amount
    of carbon dioxide in the blood falls, reaching as low as one quarter of normal
    values by the time the climber reaches the summit of Everest. This causes blood
    to become more alkaline (making the `pH level` higher) and changes hemoglobin’s
    ability to bind oxygen molecules. This enables red blood cells at a high altitude
    to attract and bind oxygen better, despite the lower oxygen pressure in the lungs.
    The same factors can also influence the release of oxygen to tissues.

