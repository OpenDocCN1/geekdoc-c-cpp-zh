- fmt: '

    Growing up with a father with a larger-than-life persona whose curriculum vitae
    fills page after page can be a tricky business. Pride and admiration for my dad
    were balanced by trepidation that his boots were so large it seemed a daunting
    task to fill them. I remember early climbing trips to the `Tetons` with my father
    when fear gripped me while on an exposed precipice or ridgeline. As I grew older,
    the fear of exposure gave way to a thirst for adventure and the unknown. Looking
    back, the greatest gift bestowed on me by my father was not technical instruction
    but an attitude that any adventure was possible and within your grasp as long
    as you took the first step and had commitment to the process. My first expedition
    to the `Himalaya` had lofty goals: to climb `Mount Everest`. And when asked about
    what I learned most from my father about climbing, the answer is not technique
    or skill but the unwavering belief in myself that I would be successful. Failure
    and triumph have marked subsequent expeditions, but it was the attitude my father
    bestowed on me from an early age that has been his greatest gift in the mountains.


    And while these climbers were already heroes to me as a boy, it was not until
    I embarked on my own `Everest` climb at age 27 that I came to fully understand
    the significance of these men, and in particular their `1963 Everest Everest expedition`.
    Climbing through terrain that I knew from pictures embedded in my memory from
    my youth, I was flooded with admiration and emotion. These early climbers hadn’t
    only accumulated knowledge of the mountain after hundreds of ascents over decades
    of climbing. They earned their knowledge of the route one foot at a time. I remember
    struggling with the weight of my own oxygen equipment as I labored up the `Geneva
    Spur` to `Camp IV` at 26,000 feet. There on the `South Col` I picked up a discarded
    bottle from the `AMEE`’s era of rudimentary equipment. It weighed three times
    as much as my modern apparatus. Even with the psychological barriers of the unknown
    removed and the benefit of more than 30 years of technological advancement, the
    climb pushed me beyond what I thought was possible both psychologically and physically.


    ## CONNECTING


    The first time I approached `Everest`’s summit in ’94, tears ran down my face
    as a deep sense of connection to my father welled up inside of me—a connection
    as a climber I had finally earned a right to call my own. I now had a true glimpse
    of how strong and bold those climbers were in 1963, a time when there was no simple
    formula for success and every step on the mountain was gained through sheer will
    and fortitude. Their lives hung on every decision they made, with no preordained
    template to guide them to the summit. Tragically, my father was killed in a car
    accident only four months later, robbing me of the opportunity to share and reflect
    with him as the first American legacy to reach the summit.


    Nearly a decade later, I returned to the mountain with the opportunity to partake
    in a film for the `National Geographic Society`, `Everest: 50 Years on the Mountain`.
    The film celebrates the 50th anniversary of `Sir Edmund Hillary` and `Tenzing
    Norgay`’s first ascent and is told through the eyes of the sons of these pioneer
    climbers. When asked to join the project, I jumped at the invitation to partake
    in a film that would continue the legacy of my father and his peers. And just
    as the original film influenced me as a young boy, partaking in a film that might
    influence my own two sons made me proud to be part of the American `Everest` legacy.


    Our climbing goal was to repeat `Willi Unsoeld` and `Tom Hornbein`’s epic first
    ascent of the `West Ridge`, but poor weather and high winds hastened our retreat
    from the `West Shoulder`. We were able to redirect our efforts and summit via
    the `South Col` route, and once again, I literally and figuratively followed in
    my father’s footsteps to the summit of the mountain, carrying both the American
    and `National Geographic` flags that my father had taken with him nearly 40 years
    earlier. The memory of that summit day is bittersweet for me; I remember `Peter
    Hillary` making an emotional call to his father from the summit, and while elated
    from standing on the top of the world, `Peter`’s connection with his father made
    me acutely aware of my own father’s absence at such a significant moment for me.


    The allure of `Everest` is quite strong, and after failing on the `West Ridge`
    in ’02 I felt I still had unfinished business on the route. The aesthetics, commitment,
    and climbing style embodied by the line appeal to me on every level as a climber,
    so I was glad for the opportunity, in 2012, to join a 50th anniversary commemorative
    climb of the `West Ridge`. This team was quite experienced, with 11 summits of
    the mountain between the four principal climbers. But once again the conditions
    on the route were unfavorable and forced our retreat after relatively little progress
    above `Camp II`. Each day that our veteran team labored to gain ground on the
    route and found itself bogged down, I kept wondering with amazement how the original
    American climbers were able to push the route successfully into the unknown so
    effectively. Nearly 50 years after first ascent of the `West Ridge`, the route’s
    significance has withstood the test of time. The technical nature of the climb
    and the commitment it demanded were unparalleled in 1963, and it still remains
    a coveted achievement in the `Himalaya`, as evidenced by the mere handful of successful
    ascents in the 50 years since.


    ## THE MEANING OF AMEE


    Not only has the first American ascent withstood the test of time, but within
    the context of the era, the `AMEE` is even more significant: 1963 was the age
    of `Camelot`, when `Kennedy` championed the merits of the “vigorous life.” At
    this point, America had lost the first step in the space race to the Soviet Union’s
    successful launch of the first man into space. A wave of patriotism swept through
    America, and it was clear that no one—not mountaineers, politicians, nor the general
    public—wanted to see America lose another race to the Soviets. The `AMEE` team
    was assembled, and the national support it received was not only unparalleled
    at the time but has not been witnessed since.


    The budget for the `AMEE` expedition was $405,000. This was a huge sum of money
    for its time and would be equivalent to three million dollars today. To add perspective,
    our expedition budget in ’94 was $80,000, and this included a mandatory $50,000
    peak fee for the ministry of tourism. But even more impressive than the monies
    raised were the breadth and volume of support that came from myriad benefactors.
    It is hard to comprehend in this day age—when expeditions receive little public
    attention or support—the wellspring of backing the `AMEE` received. Private individuals
    donated personal funds, companies and stores donated tons of equipment, and a
    host of government organizations backed the endeavor. `NASA`, the `Department
    of Atomic Research`, the `Navy`, and the `Air Force` all donated substantial funds
    to the expedition in return for scientific research. `National Geographic` was
    also a major supporter in return for the photographic and film rights to the expedition.
    So captivated was the nation with the expedition that `President Kennedy` received
    the team at the White House and `Life` magazine ran a cover story featuring the
    climb.

