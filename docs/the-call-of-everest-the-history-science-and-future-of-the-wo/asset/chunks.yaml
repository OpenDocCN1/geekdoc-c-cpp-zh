    explorers began the Great Trigonometrical Survey of India in 1808 with the ambitious
    task of determining the precise shape of the Earth, in addition to surveying the
    vast Indian subcontinent. Although the shape of the Earth had been determined
    in the mid-1700s by two French surveying expeditions, the precise degree of equatorial
    bulging and polar flattening remained a question. The British India Survey consumed
    the greater part of the century and employed some of the best mathematicians in
    the empire. The surveyor and mathematician in charge of this enterprise was William
    Lambton, a British Army officer who gained much of his early surveying experience
    in North America. Surveying equipment of the time was heavy and enormous, consisting
    of calibrated chains, measuring rods, and massive theodolites. Malaria, torrential
    monsoon rains, and tiger attacks tormented the British surveyors and their Indian
    staff, but they diligently carried on.'
