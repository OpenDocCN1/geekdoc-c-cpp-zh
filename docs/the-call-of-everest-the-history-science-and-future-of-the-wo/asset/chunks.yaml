    Wegener’s work on continental drift was based entirely on the geology of continents,
    since the technology needed to explore ocean basins simply did not exist in his
    day. All of that changed in the years following World War II with the rapid increase
    in technology and our ability to explore space and deep oceans. What was found
    amounts to nothing less than one of the greatest scientific revolutions in the
    history of scientific inquiry—the birth of plate tectonics in the late 1960s.
    We now understand that the uppermost layer of the Earth is composed of a mosaic
    of semirigid plates that slide over a weak layer in the upper mantle and interact
    along plate boundaries. The north flank of the Himalayan mountains marks the boundary
    between the Indian-Australian plate and the Eurasian plate. `GPS` (global positioning
    system) satellite measurements confirm that even today, India is moving northeast
    at approximately 1.5 inches per year relative to Siberia.


    ![](OEBPS/images/Anke_9781426212413_epub_016_r1.jpg)


    `SNOW CAN HARDLY` cling to the dark North and South Faces of Everest (at left).
    Although the summit of the mountain is composed of marine limestone, the rocks
    also carry the subtle signature of tectonic deformation and heat associated with
    the uplift of the Greater Himalaya.


    The Himalaya took shape during a multistage collision involving several smaller
    terranes (or mini-plates). It is a story that takes us back to the floor of the
    Tethys Ocean, 480 to 470 million years ago, and the shelly carbonate sediment
    deposits on the Chomolungma shelf. Layers of sediment accumulated on the `CS`
    seafloor and became compacted by pressure, cemented with calcium carbonate, and
    recrystallized into hard limestone, entombing the invertebrate marine organisms
    as fossils in solid rock. As the loose collection of terranes inched northward,
    one ocean basin closed ahead through subduction—the Paleo-Tethys—while another
    opened behind through seafloor spreading—the Neo-Tethys. Southern Asia, including
    the present-day Tibetan Plateau, was assembled through three collisional events
    that added new crustal blocks from north to south, a process known as tectonic
    accretion—the dominant process by which continents have grown outward throughout
    Earth’s history. When India eventually collided with Eurasia, a fourth major suture
    zone was created. This enormous collision weakened the lithosphere of southern
    Eurasia and, as a result, India was able to punch northward ever deeper. It has
    been estimated that India moved north into Eurasia more than 1,250 miles over
    the past 50 million years. This combination of partial subduction, thrust faulting,
    and folding of upper crustal rocks created the Himalayan mountains.


    ## BEDROCK ANATOMY OF MOUNT EVEREST


    Topographically, Mount Everest is a massive pyramid with three great faces and
    three ridges leading to the summit. The Northeast Ridge extends three miles from
    the summit to a col, or gap, that separates the East Rongbuk and Kangshung Glaciers.
    A mile down from the summit on the Northeast Ridge, a shoulder marks the top of
    the North Ridge, which subdivides the North Face and separates Everest from Changtse,
    or North Peak. The West Ridge, first climbed by Tom Hornbein and Willi Unsoeld
    on the 1963 American expedition, extends about three miles in a west-northwest
    direction from the summit to `Lho La`, a col between Khumbutse and Everest. The
    short Southeast Ridge, about one mile long, curves downward to the South Col,
    which separates Everest and Lhotse.


    Between these ridges stand the three great faces of Everest: the North Face, the
    exceedingly steep Southwest Face, and the icy Kangshung Face. Each face has its
    own personality, created by the direction it faces, the hardness of its rock layers,
    the structural features that cut through, and the dip direction, or incline, of
    transecting rock units. The long Northeast Ridge is a succession of overlapping
    sedimentary rock layers dipping down the length of the ridge to the northeast.
    The First, Second, and Third Steps on the Northeast Ridge are formed by the down-dip
    ends of rock layers, resting on layers below like overlapping roofing shingles.
    On the shorter but steeper Southeast Ridge, the dip of rock layers is “into the
    mountain,” thus creating blunt, steep steps like the South Summit and Hillary
    Step.


    The bedrock geology of Mount Everest is decidedly more complex than its topography.
    Everest is not a layer cake of rock units; it is not an eroded remnant of horizontal
    strata like those exposed in the walls of the Grand Canyon. On the contrary, Everest
    is dissected by major faults that juxtapose different types of rock. Any color
    photograph of Mount Everest shows four distinctive intervals of rock differing
    in color and layer characteristics. From top to bottom:


    * Gray limestone makes up the summit pyramid;

    * The Yellow Band, the most distinctive band of rock on Everest, encircles the
    peak like a gold wedding ring;

    * Dark gray, thinly bedded, fine-grained, weakly metamorphosed, sedimentary rock
    of the Everest Series is broadly exposed below the Yellow Band; and

    * White granite and high-grade metamorphic rocks (gneiss and schist) form the
    lower portions of the mountain.


    ### SUMMIT ROCKS


    Forming the highest outcrop on Earth are sedimentary rocks consisting of gray,
    finely laminated, silty limestone and dolomite, first identified as ancient marine
    sedimentary rocks by Noel Odell and described by Augusto Gansser as fine-grained,
    thin-bedded, gray “platy limestone” or “calc-schist,” distinguished by the presence
    of crinoidal fossil fragments. Gansser used these fragments to support his contention
    that the summit limestone was late Paleozoic in age, around 300 million years
    old, although he recognized that fossil preservation was not good enough to determine
    an accurate age. More recent geologists have noted other invertebrate fossils
    from summit limestone samples, and a distinctive white-weathering, 200-foot-thick
    thrombolite bed—common microbial deposits found in ancient marine carbonate rocks—has
    been described at the base of the Third Step on the Northeast Ridge. These fossils,
    in addition to stratigraphic studies in southern China, establish an Ordovician
    age for the summit limestone on Mount Everest: roughly 470 million years old.


    ### YELLOW BAND


    The distinctive Yellow Band is arguably the most recognizable feature of Mount
    Everest, forming a high ring of yellow-tan marble around the peak right below
    the summit. I like to think of it as a gold wedding ring. The Yellow Band lies
    immediately below the Chomolungma detachment fault and crops out below the South
    Summit on the Southeast Ridge and below the First Step on the Northeast Ridge.
    About 650 feet thick, it is a succession of interbedded dolomitic marble and phyllite,
    a fine-grained metamorphic rock with a silky sheen, suggesting that these rocks
    were subjected to higher temperature and pressure than the overlying formation.
    The Yellow Band is believed to be Middle Cambrian in age, about 30 to 40 million
    years older than the Ordovician rocks of the summit pyramid.


    ### EVEREST SERIES


    Across most of the three faces of Everest, below the Yellow Band, lies the Everest
    Series, primarily low-grade metamorphic rocks derived from mudstone or shale,
    including metamorphosed sandstone and minor thin beds of marble. Common minerals
    found in these rocks include albite, chlorite, epidote, biotite, and quartz. These
    rocks likely represent deep-water sediments, mostly mudstone and clayey sandstone,
    deposited on the continental shelf somewhere north of Gondwana. A major river
    system may have been the source for the sand, silt, and clay in the original rocks,
    much like the modern Mississippi River, which dumps its load of muddy, silty sediment
    into the waters of the Gulf of Mexico.


    ### GREATER HIMALAYAN SEQUENCE

