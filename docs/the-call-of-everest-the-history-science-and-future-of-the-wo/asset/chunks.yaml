- fmt: '

    Only an hour above Camp IV, we pass our first body. The dead person is lying on
    his side as if napping in the snow, his head covered by the hood of his parka.
    Ten minutes later we pass another body, her torso and head wrapped in a Canadian
    flag. Twenty minutes later, another corpse, a Korean. Still attached to the rope,
    he is sitting in the snow, frozen solid as stone, his face black, his eyes wide
    open.


    Four people died on the first summit push a week ago. How? Why? In interviews
    with Sherpas, I will discover that in every case, the cause of death was arrogance.
    All four were told by their Sherpas that they were moving too slowly, that even
    if they reached the summit they would not have the strength to get back down—and
    all four refused to turn around.


    The woman wrapped in the Canadian flag was said to have required nine bottles
    of oxygen (two or three is typical) before she collapsed. Tragically, pride goeth
    before the fall. Danuru told me that he has had clients in the past who, when
    told to turn around, said that they’d paid a lot of money for the trip and expected
    to reach the summit. When they finally collapsed, Danuru simply lassoed them and
    dragged them down through the snow. With the mountain so dry and rocky, this kind
    of rescue is now impossible. If you stop and sit, you freeze to death.


    The Korean, when his Sherpa pleaded for him to turn around before he died, had
    actually punched the guide in the face. Now, stepping over his icy corpse, his
    face frozen in a rigid grimace, I overcome the gruesomeness of the scene by reminding
    myself that the mountain did not kill these climbers—they killed themselves. They
    died of hubris.


    Panuru and I submit ourselves to the stop-and-go traffic for as long as we can
    stand it. Then Panuru taps me on the shoulder and motions for me to go around.
    Despite the fact that it is pitch-dark and we are on a knife-edge ridge of snow
    with 5,000-foot drops on either side, I gladly unclip and climb around a knot
    of ten climbers. Panuru follows, then passes me wordlessly, giving me the thumbs-up.
    From that point on, Panuru and I form a team. We use the ropes only when no one
    else is climbing directly above us. Otherwise, we solo around every bottleneck.


    It is still dark, but the sky has turned purple when Panuru and I reach the South
    Summit. Now most of the headlamps are below us rather than above us. We traverse
    the col to the base of the Hillary Step, a 25-foot vertical wall of rock, scratched
    and scarred by thousands of crampon points. Several climbers are working their
    way up the lines. Panuru and I swiftly climb the rock and go around them.


    We can see the summit now. It is just along the ridge crest. Pink velvety light
    is saturating the sky. I feel as if I’m in the center of a fish-eye lens, watching
    the world dropping away in all directions. Everything on Earth is below me. Everything.
    The rows and rows of mountains, even the clouds. The only thing above me is outer
    space.


    Poking around a rock, we meet up with Kris, Hilaree, and Danuru. Jangbu has already
    gone up to take GPS measurements. The five of us walk slowly toward the summit
    together. The wind is tearing at the Tibetan prayer flags planted at the apex,
    but we can’t get near them: At least 40 people have packed onto the summit hump.
    Instead we stop just a few feet below the top, throw our arms in the air, and
    tightly hug one another.


    Emily, then Sam, as well as our other Sherpas—Dawa, Tendi, Mingma, Sonam Dorje,
    and Lakpa—will all stand on the summit in several hours. The next day, as if rising
    from the dead, Conrad will rally and summit without oxygen, a feat fewer than
    200 climbers have accomplished. In a supreme test of endurance, Kris and Hilaree
    will push on to summit neighboring Lhotse after only a half day’s rest at Camp
    IV. Our entire team, climbers and Sherpas, will rendezvous safely at Base Camp
    three days later.


    At this moment, though, standing on the top of the world, I know I should feel
    elated, joyful. I know this is how the summiters of the ’63 American expedition
    felt. “We hugged each other as tears welled up, ran down our oxygen masks, and
    turned to ice,” wrote Hornbein. But climbing Everest was a bigger, richer challenge
    50 years ago. There were more unknowns, the margins slimmer, the personal effort
    greater. The truth is, Everest has become domesticated, declawed. The majesty
    of the mountain and the meaning of climbing it have diminished. A half century
    ago, climbing Everest was a triumph of mountaineering prowess. Today, from the
    perspective of modern alpine ethics, it is almost an unsporting accomplishment.


    So what do I feel standing on the summit of Everest? I admit to some pride for
    simply persevering, for sucking wind day after day and still putting one foot
    in front of the other. And I feel relief. The damn thing is done. But I also have
    an uneasy sense of ambiguity. I don’t think I really deserve the grandeur of the
    world’s highest peak. It wasn’t a fair fight, and I know it.


    ![](OEBPS/images/Anke_9781426212413_epub_072_r1.jpg)


    `SAM ELIAS LOWERS` (at right) from the South Summit to continue on toward the
    top of the peak. At 28,707 feet (8,750 meters), the South Summit is the first
    place where Everest’s true summit is visible. The scene at the summit was a different
    one from today: There were no visible mementos left behind by previous climbers,
    no jostling for space with larger climbing groups. “It appeared as if no one had
    been there before us,” Breashears said. ![](OEBPS/images/Anke_9781426212413_epub_073_r1.jpg)


    `AMERICANS PETER JAMIESON` and Gerry Roach (at right) celebrate their 1983 ascent
    of Everest. They were part of filmmaker David Breashears’s team when he transmitted
    the first live images from the peak. The scene at the summit was a different one
    from today. ![](OEBPS/images/Anke_9781426212413_epub_074_r1.jpg)


    `ICY PRAYER FLAGS` wave at Base Camp ![](OEBPS/images/Anke_9781426212413_epub_075_r1.jpg)


    ## **THE EVOLVING BASE CAMP**


    In the spring of 2012 I spent a month at Everest Base Camp for a GlacierWorks
    project. I arrived in early April, just as the expeditions were establishing the
    camps. I wandered slowly up the rock-strewn glacier, pausing frequently to stare
    at the hundreds of brightly colored tents clustered along the meandering trail.
    Most were small personal tents, but many were large dining, cooking, and communication
    tents. Generators purred in the distance, yak bells tinkled from the transport
    caravans, and a multitude of languages buzzed from the expedition camps. Thousands
    of prayer flags fluttered in the breeze. National flags from myriad nations rippled
    in the wind, too. It was an international village at the foot of the Khumbu Icefall.
    Hundreds of climbers would shortly be residing here, all with the same goal and
    each for different reason. Yet Base Camp bore no resemblance to the one I visited
    29 years earlier in the spring 1983.

