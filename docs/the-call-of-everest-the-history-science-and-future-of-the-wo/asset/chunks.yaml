    西方攀登队主要由“北壁”（The North Face）的职业运动员组成。除了 49 岁的康拉德（Conrad），还有 39 岁的滑雪登山员希拉里·奥尼尔（Hilaree
    O’Neill）、38 岁的摄影师兼滑雪登山员克里斯·埃里克（Kris Erickson）、30 岁的登山者兼摄影师科里·理查兹（Cory Richards）、29
    岁的精英混合冰岩爬者萨姆·埃利亚斯（Sam Elias），以及 25 岁的竞技运动员艾米莉·哈灵顿（Emily Harrington）。团队成员还包括 48
    岁的国家户外领导学校（NOLS）现场经理菲尔·亨德森（Phil Henderson）、61 岁的蒙大拿州立大学地质学家戴夫·莱森（Dave Lageson）以及我。结合我们的经验，我们共有超过
    200 次探险，但只有康拉德曾登顶珠穆玛峰。


    康拉德和科里将尝试西脊，我们其他人则走南坳。不出所料的是，仅仅爬上这座山对康拉德来说是不够的。因此，与 1963 年美国探险队一样，我们还在进行地质和生理研究，并编写一套小学科学课程。


    整个团队人数接近 30 人，首次在大营汇合。珠穆玛峰大营散布在岩石遍布、变幻莫测昆布冰川上，海拔 17,600 英尺，就规模而言，它可能是世界上同规模中最著名、尽管转瞬即逝的城镇。季风前的人口大约有
    900 名临时居民：约 300 名客户和向导、同样数量的夏尔人，另外 300 名大营工作人员和背夫员，更不用说源源不断的牦牛队，它们的铃铛在寒冷的空气中不断叮叮作响。


    ![](img/Anke_9781426212413_epub_063_r1.jpg)


    2012 年传承：探险开始初的攀登队


    ## 大营城市


    就像每个小镇一样，珠穆玛峰大营也有社区。我们的营地位于南部郊区，靠近巨大的“喜马拉雅体验”（Himalayan Experience）商业营地。通常人们称其为
    Himex，它拥有地球上最高、最俗气的夜总俱乐部——老虎大顶（Tiger Dome）——这是一个巨大的硬骨架测圆气泡结构，灵活的舞池上铺着一张 30 英尺长的虎皮毯，配有大音箱、挂着人造虎毛的休息椅，以及一个无限供应的酒吧。我们会在老虎大顶里掉几个脑细胞——康拉德和艾米莉像猴子一样在天花板上荡秋，希拉里和朋友们从吧台同步跳下冲入人群——然后在凌晨时爬回自己的帐篷。


    在进入城镇的主街上，左侧是国际山地向导（International Mountain Guides）区，右侧是喜马拉雅体验（Mountain Experience）。远处是繁忙的直升机停机坪（一片圆形的岩石地带）以及珠峰急救中心（Everest
    ER）的大白色帐篷，那里由露安·弗里博士（Dr. Luann Freer）于十年前创立。市中心可以看到山地向导、韩国大学、Happy Feet、印度军队以及另外二十支来源不明的探险队。每个街区看起来都非常相似，有一个长方形的集体帐篷，周围环绕着
    10 到 20 个橙色或黄色的圆帐篷，以及几个垂直的蓝色或绿色厕所。经幡像社区旗帜一样在每个街区的石堆佛塔上飘扬。


    尽管多年来一直有负面报道，但珠穆玛峰大营是一个相当整洁的地方。SPCC——萨迦玛玛莎污染控制委员会——是大营的市议会，由他们制定规则。帐篷厕所配有塑料桶，所有的人类排弃物都会被运到戈拉克谢普普（Gorak
    Shep）村。与更高海拔的营地不同，在大营，每个团队都被要求将带入的物品全部带走。


    大营城市的日常生活惊奇地文明且悠闲。你可以上网、接收 iPhone 信号，偶尔还有厨师会制作生日蛋糕。就像在夏令营一样，工作人员提供餐食，让攀登者休息、恢复、听音乐、拍照、发邮件、写博客、在电话里闲聊，或者只是张着嘴，看着从普莫里峰和努冰峰周围侧坡轰啸而下的雪崩。我们甚至还有下午茶，一种经典的英国老爷（sahib）传统。


    这里的大多数居民并不是硬核攀登者。他们是拥有登顶珠穆玛峰梦想的客户。他们许多人在其他领域——商业、医学、技术——已经取得了成功，而且深知获得自己的技能花费了多久，因此很乐意为向导的专业知识付费。嘲笑这些追求者很容易，但世界上总会有有钱攀登珠穆玛峰的人，正如惠特克（Whittaker）所指出的，他们本可以把钱花在更不靠谱的追求上。相反，这些新手愿意冒着生命之危险穿过昆布冰瀑的巨口，忍受剧烈的头痛、喷吐和数周的高强度疲劳，只为了站在世界之巅。这并没有让他们成为登山者，但确实说明了他们的信念。


    在大营的前几天用来适应海拔的，许多西方人要么患上“昆布病”（Khumbu crud），要么花费大量精力尽一切避免它。在前往大营的一周徒步途中，那些有时显得简陋的茶室可能是细菌的培养皿，很少有人能逃脱某种形式的胃炎。如果你没有患上那种病，几乎肯定会患上“昆布咳嗽”——这是由极干燥空气引起的支气管炎症。剧咳是无处不在的症状，很快每个人都像银行劫匪一样脸上戴着头巾（buffs）。


    ## 面临冰川


    珠穆玛峰南侧第一个障碍是臭名昭著的冰瀑。昆布冰川像一台巨大的推土机，在珠穆玛峰和努冰峰之间的洛子峰壁向下冲下，推开着前方的蓝色冰墙。从大营正上悬崖上坠落，这条宽一英里的冰川裂开来，破碎成建筑大小的冰块和像教堂尖塔一样高的冰塔。


    每年穿过冰瀑的路线都由“冰医生”们设定，这是一支由夏尔人组成的小型突击队，他们冒着致命的风险规划出最安全的通道，在陡峭路段布置绳索，并将梯子横跨在如深渊般的裂缝上。昆布冰瀑无非是一条巨大的流动的冰河，它不断移动、呻鸣和崩塌，如果你恰在错误的时间出现在那里，就会被裂缝吞没或被掉落的冰塔压碎。几年前，三名夏尔人在昆布冰川的一次事故中去世。今年春天，一排经幡标记了最危险区域的起点和终点。


    根据精算研究，在珠穆玛峰下顶返回时的死亡人数比穿过冰瀑的更多。尽管如此，穿过昆布的巨口是一场病态的俄罗斯轮盘游戏，所以我们尝试在黑暗中通过，在太阳晒热冰层并使其开始崩塌之前。我们在凌晨
    2 点离开大营，像矿工一样顺着头盔上头灯的光束前进。在我的第一次旅行中，我与丹杜鲁（Danuru）搭档。当我们到达第一排经幡——进入死亡区的起点门时，他允许我喘口气，然后说：“我们出发了！”并开始向上冲跑，在
    18,000 英尺的高度， literally 背着 60 磅的背包跑步，冰爪在蓝色冰的岩石上嘎吱作响。


    '
- fmt: '

    Mount Everest isn’t supposed to be a difficult mountain to climb. “Climbing” is
    often not even used to describe the act of reaching the summit of the world’s
    tallest peak. “It’s just walking. It’s not hard”—that was something I’d often
    heard through the years. Growing up in the climbing community gave me an opinionated
    perspective toward a place I’d never even visited or bothered to learn about.
    When non-climbers asked me if I ever dreamed of climbing Everest, I would snidely
    reply “Um, no. That’s not the kind of climbing I do.”


    Well, I’m now eating my own arrogant words. I went to Everest this year on a trip
    with `The North Face`. `Conrad Anker` asked me to be a part of the team, handed
    me the opportunity of a lifetime, and I took it. I had little knowledge of the
    alpine climbing world and zero experience in high-altitude mountaineering. I had
    a very skewed view of the uniqueness of Everest itself and the intense polarizing
    effect it has on the community I was a part of.


    ## **THE STRUGGLE**


    Everest is a controversial place, full of both real-life danger and ego-crushing
    criticism. Climbing Everest was the most personal struggle I’ve ever had to undergo
    during a consecutive period of time. I’ve never been as sick as I was with a respiratory
    infection when I first arrived at `Base Camp`. I’ve never fought so much physically
    to keep pushing, taking steps, and enduring the exhaustion, extreme heat, and
    bitter cold. I walked by dead bodies, human souls who’d lived just four days prior,
    and left this world in pursuit of the same goal I was trying to achieve. I was
    afraid a lot of the time. Never before have I faced a truer reality: that my own
    life could be taken away from me by circumstances out of my control, together
    with the unsettling knowledge that it was my choice to be there, but for what?
    I fought intensely with my own mind on a daily basis to justify this mission to
    myself despite the danger, death, and even the harsh criticism I was receiving
    for even setting foot on the mountain in the first place with no previous high-altitude
    mountain experience.


    There are some very glaring negative environmental and social impacts of climbing
    Everest, especially considering the commercialization of it all. People who have
    never even set eyes on the `Khumbu Valley` know these things. But there are other
    aspects that are often overlooked or ignored, overshadowed by the negative ones.
    My own personal journey on Everest was full of negativity and struggle, but also
    triumph and success; and I arrived home a different person than when I left. I
    saw another side to the place that so many criticize and condemn, and what I remember
    most is the beauty and passion that exists there in so many forms.


    ## **THE NOISES**


    I remember listening to avalanches all day and night from my tent at `Base Camp`,
    watching their uncontrollable power and violent strength and feeling simultaneously
    afraid of and fascinated by the beauty of the noise and energy they emit. Then
    there was my first trip through the `icefall` at 3 a.m., and the acute fear that
    made my stomach plummet and brought tears to my eyes at the very real danger of
    it all. I remember the intense heat of the `Western Cwm`, watching the snow melt
    and evaporate into steam in a matter of seconds after I put it down my shirt in
    an effort to cool my boiling blood. I remember listening to the wind barrel down
    off of the summit of Everest from `Camp II`, like a freight train with no brakes.
    It would reach my tent moments later and suddenly I’m in the middle of a hurricane,
    the nylon ripping and floor trying to lift my helpless body off the ground. I
    remember the first night we slept at `Camp III`, the unusually calm evening that
    welcomed us after so many torturously windy ones. The glorious sunset I watched
    that night made me feel like the luckiest person on Earth. I remember summiting
    early in the morning on May 25 in the nuking wind and -50° temperatures and trying
    to consciously be aware and appreciative of where I was and what I had done—but
    also realizing that reaching the summit had the smallest fraction of significance
    to me in the grand scheme of what I had seen and felt and how I had changed as
    a person on this journey.


    ## **THE PEOPLE**


    I remember the mind-blowing strength and kindness of the `Sherpa` people, and
    how they always managed to be in good humor despite the massive amount of effort
    their jobs required. I remember the relentless respect and love I felt for both
    our `Sherpa` team and for my Western teammates. They all became my family, individuals
    whom I will never forget and with whom I will always be bonded.


    I also remember the bizarre community at `Base Camp`, like a small town with all
    the same drama and gossip, but also full of real people, with jobs and families
    and purpose. Passionate people with positive intentions who were there simply
    to fulfill a dream and to experience the enormity of the mountains. Like them,
    I too felt the allure of being in a place so much more vast and powerful than
    we can comprehend. It is overwhelmingly humbling and puts us in our respective
    places as human beings. Maybe that’s why people go there in droves. In addition
    to the tangible goal of reaching the top of the world, they’re searching to experience
    a place that’s so much greater than themselves, to struggle and suffer and fight
    and discover who they are, much like I did.


    I remember all of those things, I am immensely grateful for them, and I will never
    forget them.


    **—EMILY HARRINGTON** A `North Face` athlete on the `Legacy Climb` team, `Emily
    Harrington` is currently the only American, male or female, consistently placing
    in the top five in the `Climbing World Cup` competition circuit.


    ![](OEBPS/images/Anke_9781426212413_epub_064_r1.jpg)


    **EXPEDITION LEADER CONRAD** Anker drew this map of the treacherous trail through
    the `Khumbu Icefall`. He’s marked the `Ballroom of Death`, where hanging seracs
    threaten to crush climbers at any moment.


    ## **ACCLATING**


    Through the month of April, `Camp I`, at 19,700 feet, and `Camp II`, at 21,200
    feet, are established. `Camp I`, a windy, gorgeous place, lies on a bone-white
    rib of glacier between deep, wide crevasses. The `Sherpas` do not stay at `Camp
    I`, so it’s more like a climbers’ camp in Alaska or Peru—you do your own cooking
    and look after yourself. `Camp II`, as ugly as a city dump, squats on the left
    lateral moraine, tents pitched among the hundreds of shit piles left over from
    previous expeditions. We tramp up to `Camp I` for several days, then back down
    to `Base Camp` for a few days, then back up to `Camp II`, then back down to `Base
    Camp`. This monotonous yo-yoing is essential for acclimation.


    The boredom of days at `Base Camp` is relieved by the arrival of `Dr. Bruce Johnson`
    and four researchers from the `Mayo Clinic’s Human Integrative and Environmental
    Physiology Lab`. They’ve come to study the connection between high-altitude acclimation
    and one of the most common diseases in America, heart failure.


    “We have data that show many heart-failure patients get constrictions in the lungs,”
    explains `Johnson`, “which could be similar to what happens to climbers at altitude.”


    Heart-failure patients often have pulmonary congestion: Their lungs easily fill
    with fluid. Well-acclimated climbers have lungs that successfully balance pulmonary
    fluids. `Johnson` and team want to understand the specific mechanisms that facilitate
    this process.


    “Another similarity between high-altitude climbers and heart-failure patients,”
    says `Johnson`, 54, “is that they both chronically hyperventilate. This may cause
    the brain to inhibit breathing, and in some cases trigger sleep apnea.” Why and
    how this happens is another subject of scrutiny.


    ### **GLACIAL GUINEA PIGS**

