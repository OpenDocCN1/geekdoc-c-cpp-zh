    We’d climbed Everest. What good was it to Jake [Breitenbach, who had died earlier
    on the climb]? To Willi, to Barrel? To Norman [Dyhrenfurth, AMEE team leader],
    with Everest all done now? And to the rest of us? What waits? What price less
    tangible than toes? There must be something more to it than toiling over the top
    of another, albeit expensive, mountain. Perhaps there was something of the nobility-that-is-man
    in it somewhere, but it was hard to be sure.


    Yes, it satisfied in a way. Not just climbing the mountain, but the entire effort—the
    creating something, the few of us moulding it from the beginning. With a lot of
    luck we’d succeeded. But what had we proved?


    **THE SIMPLE LIFE**'
