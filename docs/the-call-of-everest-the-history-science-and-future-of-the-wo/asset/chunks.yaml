  trans: '

    在那次探险中，我于 1983 年 5 月 7 日首次登上了珠穆玛玛峰。我被 ABC 电视节目《美国运动人》（*American Sportsman*）选入团队，前往这座山从地球最高点传输首批现场画面。我们在黎明时分从高营出发。出于某种原因，我们选择从南山口直接向东南脊开辟一条捷径，但我们意想不到地遭遇了膝盖深的积雪，在艰难跋涉雪地的努力中被拖慢了速度。南山口上方没有固定绳——我们并不需要。我们只在希拉里台阶处发现了挂着的
    30 英尺被风侵蚀的绳。


    我的队友们——安格·里塔·谢尔帕、彼得·杰米森和杰里·罗奇——和我轮流承担着在松软深雪中开辟道路的疲力工作。尽管如此，我们仍设法保持聚在一起，并在下午 3:30
    在南峰获得了更坚实的雪地，在那里我们为最后的冲刺做好了准备。拉里·尼尔森（Larry Nielson）选择不携带氧气瓶登山，正落在最后。从南峰到著名的希拉里台阶的横移路程漫长且暴露。当我度过那段令人生畏的最后
    40 英尺陡坡攀登后，才知道我们将成功。


    我清楚地记得最后几步。山顶是纯净的，没有任何脚印、测绘三脚架、宣传横幅、经幡以及后来会弄乱山顶的纪念品。似乎没有人在我们之前来过。风很轻，但偶尔刮过的阵风提醒着我们它潜在的力量。我们分享了珠穆玛玛那严酷、无情的宏伟壮丽震撼人心魄，以及一种巨大的孤独。自从到达大营以来，我们花了
    40 多天才到达这一刻；经历了艰辛、团队合作、自力更生以及日益深厚的友谊。我们五个人在闪烁的白峰映衬下，仅仅是远处隐约可见的微小黑点。我向北望向广阔的西藏高原，想起了上世纪
    20 年代初的英国探险队。他们试图从西藏登山的壮丽先驱努力均以失败告终。他们失去了许多生命。站在那里，我知道我的生活改变了。我实现了儿时的愿望。长长的旅程结束了。世界在我的脚下。我充满了宁静的敬畏和惊奇，还有深深的满足。


    ## 孤独的英雄


    组装好传输设备后，当我们站在巨大的山峰旁，我将摄像机对准同伴们。然后，我捕捉到了拉里·尼尔森艰难的最后一步，他成为第一个在不使用辅助氧气的情况下顶顶美国人。他的努力是高尚的，但付出了代价。


    此时已是傍晚，低角度的光在下方的峰间穿梭，在山谷中投下长长的影子。我们支持小组最近的成员在近 8000 英尺外的先大营。孤立吗？是的。但也对刚刚取得的成就感到无比振奋。当我们精疲力竭却胜利地蹒跚回到南山口的帐篷时，我们并不介意笼罩的黑暗和大雪。


    那天晚上，我躺在睡袋里睡不着，回想着疲惫的面孔、欢喜的笑容和闪烁的山峰。就在几小时前，我成为了自埃蒙德·希拉里和丹增·诺尔盖于 1953 年登顶以来，第 130
    个登上珠穆玛玛峰顶的人。我为属于这个精英俱乐部感到自豪，但我认为这个俱乐部已经大了 100 人了。


    ## 纯真的终结


    从以后，我经常回到那座山，并又登了四次顶。我无法想象珠穆玛玛的经历会发生多大的变化，而且是在如此短的时间内。今天，每天可能有近 129 人登上珠穆玛玛峰顶；截至
    2012 年春天，记录的登顶次数已超过 6200 次。


    自从 1856 年向世界宣布其 29,002 英尺的最高高度（后修正为 29,035 英尺）以来，珠穆玛玛峰对人类的想象产生了持久的吸引力。我 11 岁时也感受到了，被书中一张彩色照片吸引了，那是丹增·诺尔盖穿着异样的服装、带着氧气面罩，像一个地球边缘的探险家的模样。在那张单一的成功影像中，我发现了一个代表我自身对独立、发现和自由渴望的范例。我感觉到氧气面罩和厚羽绒服后的那个男人冒了险，并竭力到达那个位置，他正站在他想去的地方。有一天，我也想站在那里。


    我的同伴非常出色。在我之前之后，无数的人都将自己的价值观、梦想和野心投射在这一座山上。英国探险家乔治·马洛里和安德鲁·艾尔文在 1924 年开辟珠穆玛玛北壁路线时去世了，当时距离顶峰仅一步之遥，留下了万世的谜团。当丹增和希拉里在
    1953 年首次登顶时，世界为之震撼。1963 年，威利·温索尔德和汤姆·霍恩贝因完成了对这座喜马拉雅巨峰的首次横移，这是登山史上最伟大的成就之一。雷因霍尔德·梅斯纳和彼得·哈贝勒在
    1978 年成为第一个在不使用辅助氧气的情况下登顶的人；梅斯纳在两年后独自、在无支持的情况下再次做到了这一点。一个波兰小组在 1980 年 2 月完成了首次冬季登顶。


    珠穆玛玛峰同样是那些拥有不寻常奇特人物的磁石。“疯狂的约克郡人”莫里斯·威尔逊（Maurice Wilson）是一个古怪的一战大战退伍士兵，没有任何登山经验，他在
    1934 年非法飞往印度，打算让他的飞机坠落在珠穆玛玛脚下的冰川上，然后登顶。但英国当局没收了他的飞机并拒绝了他的许可。他没有气馁，带着一个小支持小组徒步穿越西藏。他的身体和帐篷在
    1935 年发现于 21,400 英尺处。


    哲学教授伍德罗·赛（Woodrow Sayre），总统的孙，招募了一名地质学生、一名老师和一名律师，在 1962 年尝试从北侧登山，雄心勃勃。他们从尼泊尔非法进入西藏，没有任何支持，将所有装备和食物运到北坡。他们这次大胆且鲜为人知的尝试在
    25,500 英尺处折返了。精疲力竭的团队原路返回尼泊尔，结束了美国人的首次珠穆玛玛探险。


    1988 年 9 月 26 日，法国登山者让-马科·博维文（Jean-Marco Boivin）完成了首次滑翔伞从山顶下降。斯洛文尼亚登山者兼极限滑雪运动员达沃·卡尼卡尔（Davo
    Karnicar）于 2000 年 10 月 7 日登顶，然后在雨季后的雪雪季节滑雪下降。2005 年 5 月 30 日，白山多杰·谢尔帕和莫尼·穆帕蒂在山顶许下了第一个婚誓。


    无论动机如何，登上世界之一直是一项铁人的成就。人们必须克服大自然的障碍、狂风、稀薄空气的挑战，以及自身的身体极限和恐惧，才能赢得公众授予地球最高峰的的荣誉。

