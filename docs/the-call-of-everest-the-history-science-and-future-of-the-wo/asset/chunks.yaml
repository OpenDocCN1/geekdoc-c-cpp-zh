  trans: '

    珠穆朗玛峰本不是一座难以攀登的山。“攀登”一词往往甚至不被用来描述登上世界最高峰顶的行为。“这只是在走路。这并不难”——这是多年来我经常听到的话。在攀登圈中长大，让我对一个我从未去过、甚至懒得去了解的地方产生了一种极具主观的观点。当非攀登者问我是否曾梦想过登顶珠穆朗玛峰时，我会冷冷地回答：“嗯，没有。那不是我从事的那种攀登。”


    好了，现在我正在为自己的傲慢话买脸。今年，我随`北脸（The North Face）`去经历了一次珠峰之旅。`Conrad Anker` 邀请我加入团队，给了我这一生难得的机会，而我接受了。我对高山攀登世界知之甚少，在高海拔登山方面毫无经验。对于珠穆朗玛峰本身的独特性，以及它对我所属社区产生的剧烈极化影响，我曾有着非常偏颇的看法。


    ## **挣扎**


    珠穆朗玛峰是一个充满争议的地方，充满了现实中的危险和摧毁自尊的批评。攀登珠峰是我在连续期间内经历过的最个人化的挣扎。当我第一次到达`大营（Base Camp）`时，由于呼吸道感染，我从未像那时那样生过。我从未在身体上如此努力斗争，以继续前进、迈步并忍受疲劳、酷热和刺骨的寒冷。我走过尸体，那些在四天前还活着的灵魂，为了追求我正努力实现的目标而离开了这个世界。在很多时候，我感到非常恐惧。我从未面对过如此真实的现实：我的生命可能被我无法控制的境遇夺走，并伴随着一种不安的认知——来到那里是我的选择，但为了什么呢？我每天都与自己的内心激烈斗争，向自己证明这次任务的意义，尽管面临着危险、死亡，甚至由于我在此前没有任何高海拔登山经验的情况下仅仅踏上这座山而备受的严厉批评。


    攀登珠峰对环境和社会产生了一些非常显眼的负面影响，尤其是考虑到这一切的商业化。那些甚至从未眼见过`昆布冰谷（Khumbu Valley）`的人都知道这些事。但还有其他方面经常被忽视或忽略，被负面影响所掩盖。我在珠峰上的个人旅程充满了负面情绪和挣扎，但也充满了胜利与成功；当我回到家时，已经变成了一个离开时不同的人。我看到了这个被许多人批评和谴责的地方的另一面，我最记忆的是那里以许多形式存在的美丽与激情。


    ## **噪音**


    我记得在`大营（Base Camp）`的帐篷里整日整夜听着雪崩声，看着它们无法控制的力量和暴力的强度，并同时对它们发出的噪音和能量之美感到既恐惧又着迷。然后是我在凌晨三点第一次穿过`冰川瀑（icefall）`，那种剧烈的恐惧让我的胃部剧烈收缩，并因为真实的危险而流下了泪水。我记得`西西冰谷（Western
    Cwm）`的酷热，看着我为了冷却沸腾的血液将雪水滴进衣服后，它在几秒钟内融化并蒸成水汽。我记得在`二营（Camp II）`听着风从珠峰呼啸而下的声音，像没有刹车的货火车。几分钟后风就会到达我的帐篷，我突然置于飓风中心，尼龙布被撕裂，地板试图将我这无助的身体抬离地面。我记得我们在`三营（Camp
    III）`睡觉的第一个晚上，在经历了许多痛苦的、风大大的夜晚后，那个异常平静的傍晚迎接了我们。那天晚上我看到的壮丽日落让我觉得自己是地球上最幸运的人。我记得
    5 月 25 日清晨，在狂虐的风和零下 50 摄度的温度中登顶，并试图有意识地感知和感激我所处的位置以及我所做的——但也意识到，与这段旅程中所看到的、感受到的以及我作为一个人的变化相比，登顶在宏大图景中的意义是微不足道的。


    ## **人**


    我记得`谢尔巴（Sherpa）`人们令人惊叹的力量和善良，尽管他们的工作需要巨大的付出，但他们总能保持幽默的心情。我记得我对我们的`谢尔巴`团队以及我的西方队友们感受到的不懈的尊重和爱。他们都成了我的家人，我永远不会忘记他们，并将与他们永远纽带在一起。


    我还记得`大营（Base Camp）`那奇特的社区，就像一个小镇，有着同样的戏码和八卦，但也充满了真实的人，他们有工作、家庭和目标。这些充满积极意图的热情的人来到那里仅仅是为了实现一个梦想，并体验山脉的巨大。像他们一样，我也感受到了处于一个比我们能想象的要广阔、强大的地方的魔力。这让人感到无比谦卑，并让我们作为人类找到了自己的位置。也许这就是为什么人们成群结队去那里。除了登上世界之巅的具体目标，他们还在寻找体验一个比自己伟大得多的地方，去挣扎、受苦、战斗并发现自己是谁，就像我所做一样。


    我记得这一切，我对它们非常感激，我永远不会忘记它们。


    **—EMILY HARRINGTON** `传承攀登（Legacy Climb）`团队的一名`北脸`运动员，`Emily Harrington`是目前唯一一位在`攀登世界杯（Climbing
    World Cup）`竞赛赛场中稳定进入前五名的美国人（不男女）。


    ![](img/Anke_9781426212413_epub_064_r1.jpg)


    **探险队队长 CONRAD** Anker 绘制了这张穿过`昆布冰川（Icefall）`的危险路线地图。他标记了`死亡大厅（Ballroom of Death）`，那里的冰塔随时可能压碎登山者。


    ## **适应**


    在四月期间，海拔 19700 英尺的`一营（Camp I）`和 21200 英尺的`二营（Camp II）`建立了。`一营`是一个风大但美丽的地方，位于巨大的裂缝之间的骨白色冰川脊上。`谢尔巴`人不在`一营`，所以那里更像阿拉斯加或秘鲁的登山营——你需要自己做饭并照顾自己。`二营`像个垃圾场，位于左侧冰碛上，帐篷在数百堆留下的粪堆中。我们爬`一营`几天，回到`大营`几天，再爬`二营`，回到`大营`。这种单调的往复对于适应至关重要。

