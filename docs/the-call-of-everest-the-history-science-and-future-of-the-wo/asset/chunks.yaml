- fmt: '

    The objectives of the AMEE were lofty, to say the least. The primary climbing
    goal of the expedition was to place a man on the summit via the Southeast Ridge.
    This was accomplished on May 1, 1963, when Jim Whittaker and Sherpa Nawang Gombu
    stood on the top of the world. This feat alone marked success for the team, but
    further goals were in store. The idea of climbing the never-before-attempted West
    Ridge, traversing the mountain, and descending the Southeast Ridge became the
    secondary objective. The West Ridge is a route that truly embodies the spirit
    of mountaineering—it is visionary, technically difficult, and requires a tremendous
    amount of commitment. In 1963, the mere idea of ascending via the West Ridge was
    at least 30 years ahead of its time. Willi Unsoeld and Tom Hornbein’s success
    on the route was to mark America’s greatest Himalayan achievement to date.


    Not only did Hornbein and Unsoeld climb the West Ridge on May 22: They met my
    father and Lute Jerstad near the summit of the mountain and then began to descend
    through the night. Nightfall caught them out in the open and they were forced
    to bivy at over 28,000 feet without stove, tent, or oxygen. The team huddled together
    exposed on the Southeast Ridge with no other option except to wait for the light
    of morning. Nobody had spent the night out at this altitude before, and it was
    uncertain whether survival was even possible. Twice I climbed past the site where
    the foursome spent the night unprotected below the summit and on both occasions
    I remember being overwhelmed with the notion that this was the location where
    my father struggled to stay alive through the night. I often wonder what occupied
    my father’s thoughts as he waited for the cold and blackness to give way to the
    morning light.


    ## LIVING SCIENCE


    The other objective of the AMEE was to perform scientific research while on the
    mountain. In essence, the AMEE was its own scientific lab. Significant research
    and experiments were performed in the disciplines of glaciology, solar radiation,
    physiology, psychology, and sociology. Every member of the team contributed in
    some form to the research component of the expedition. In 1963 there was not a
    great deal of data on high-altitude physiology. The AMEE not only provided the
    perfect lab but all of the specimens to study as well. The results from the AMEE
    provided concrete documentation of the effects of altitude, particularly above
    8,000 meters, and this body of knowledge has served as the foundation for all
    subsequent altitude research done in the United States.


    The Navy and Air Force were quite interested in the social and psychological aspects
    of a team subjected to prolonged high stress and extremely cold weather. Their
    interest was prompted by the U.S. Defense Department’s belief that the country
    would most likely be involved in a conflict where soldiers would be stationed
    in very cold, stressful, and remote conditions. Interesting as they were, the
    results of the research were most likely biased, given the exceptional bravery
    and strength of character of the expedition members.


    Assembled by expedition leader Norman Dyhrenfurth, the members themselves were
    the best and most experienced mountaineers in North America in their time. The
    list of members reads like a who’s who of the ’60s era. Just thumb through any
    guidebook from almost any climbing destination in the United States and the names
    Corbet, Pownall, Emerson, Unsoeld, Jerstad, et al. can be found in connection
    with significant ascents all over North America. Not only were the AMEE members
    exceptional climbers, they were highly educated and professional. The team had
    three M.D.’s, five Ph.D.’s, and five M.A./M.S.’s. (Three of the members were working
    on their Ph.D.’s on the expedition.) These men were from the renaissance mold
    of climbers; their avocation of climbing was separate from their vocations, which
    only makes their feats on Everest even more impressive.


    Fifty years ago, this expedition was undertaken with a mixture of excitement,
    adventure, and optimism. When we look backward we have the benefit of seeing the
    risk of exploration and the light of its results. The tangible results of the
    AMEE are quite clear—six members on the summit, a new route on the mountain, and
    a massive body of scientific research produced. Less tangible is the tremendous
    influence these climbers and their expedition had on subsequent generations to
    follow. Virtually every climber who ventured forth into the mountains in the generations
    following the 1963 climb read either Hornbein’s *Everest: The West Ridge* or Ullman’s
    official account of the climb, *Americans on Everest*, if not both. These books
    influenced countless climbers on many levels.


    ## SETTING THE BAR HIGH


    Most important, this team set the benchmark of what was possible for American
    climbers in the Himalaya. After reading these accounts, one comes away with the
    belief that anything can be accomplished; and one comes away inspired to accept
    the mantle of these mountaineers’ legacy and follow in their footsteps. The world
    of the known expands only when we place our faith and support in those brave enough
    to take giant steps. We would be nowhere, essentially, without the bravery of
    our explorers, and that’s why we are celebrating this anniversary. In essence,
    any American climbing in the Himalaya is climbing in the footsteps of giants.
    And among these giants are all the members of the 1963 American Mount Everest
    Expedition.


    A lifetime of climbing and 46 years of age brings greater perspective in the mountains—at
    least it has for me. No longer armed with the invincibility and strength of youth,
    my last climb opened my eyes even more to the AMEE’s achievement. A chorten to
    commemorate my father sits behind Tengboche monastery alongside memorials for
    his friends and fellow climbers Gil Roberts, Lute Jerstad, and Jake Breitenbach.
    It’s a powerful sight with a beautiful view up the valley and Everest looming
    above else. I visit these chortens whenever I’m in the Khumbu to string up Tibetan
    flags and to have a drink with “the boys.” Tears are shed, and once again I feel
    like the kid in his kitchen surrounded by his heroes, listening with amazement
    and wonder to tales of Everest.


    **—BRENT BOP** Brent Bishop is a climber and environmentalist and son of Barry
    Bishop, member of the 1963 American Everest expedition. In 1994 Brent Bishop founded
    the Sagarmatha Environmental Expedition, which has since helped to remove thousands
    of pounds of trash from Everest.


    ## THE LEGACY CLIMB TEAM


    Wiry Hilaree O’Neill, redoubtable Dawa Yangzum, and I, aging but unrelenting,
    arrive at Everest Base Camp on April 10, joining the rest of our team. Like Jim,
    we’ve all come to the Khumbu to celebrate the 50th anniversary of the first American
    ascent of Everest. Led by Conrad Anker, renowned alpinist and Everest veteran,
    the 2012 Everest Educational Expedition is composed of nine climbers, eight high-altitude
    Sherpas, one high-altitude Sherpani, three communications technicians, and seven
    Base Camp staff. Our Sherpas—Ankagi, Danuru, Jangbu, Lakpa Bhote, Mingma, Panuru,
    Sonam Dorje, Tendi, and young Sherpani Dawa Yangzum—are some of the most experienced
    in the business. Our sirdar (Sherpa leader), Panuru, has summited Everest 9 times;
    Danuru, by far the strongest member of our team, has summited 13 times.

