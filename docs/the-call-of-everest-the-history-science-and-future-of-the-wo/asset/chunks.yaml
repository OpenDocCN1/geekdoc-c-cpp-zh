    it was too risky—better to concentrate on looking after my hands. And I shivered.
    But it didn’t really feel any worse than my worst alpine winter bivouacs 14,000
    feet lower: I was anaesthetised by altitude. And in any case, I was no longer
    a victim: I was just waiting patiently for the dawn.


    **—STEPHEN VENABLES** In 1988 mountaineer, writer, and inspirational speaker Stephen
    Venables became the first Briton to summit Mount Everest without supplementary
    oxygen.


    ## **HOW HIGH FOR HOW LONG?**


    What are the true limits to high-altitude exposure? While many call the process
    preparing for an Everest summit “acclimation,” others would say the body gets
    better at “tolerating” the extremes of hypoxia (low oxygen). That tolerance continually
    remains at a delicate threshold, particularly at the elevations above Everest
    Base Camp. That’s why over the course of history, few long-standing communities
    have survived at extreme altitudes. In fact, no permanent communities on the globe
    exist above 17,000 feet. (For comparison, Everest Base Camp is at about 17,500
    feet.) Most of the communities even close to that altitude grew up around industry
    (mining towns, railway communities, or observatories) and struggle with ongoing
    problems related to the extreme altitude. The highest permanent mining community
    is La Rinconada in southern Peru, which extends from altitudes of 4,900 to 5,200
    meters (16,000 to 17,000 feet). In Tibet several villages are located at similar
    elevations, but most settlements are near or below 15,000 feet, which seems to
    be a threshold for maintaining health and reproduction. Even the highest Sherpa
    villages are lower than 15,000 feet, or 4,600 meters, high. (Dingboche is at 4,400
    meters and Pheriche 4,240 meters.)


    The Tibetan and Andean people who live in the highest plateau regions of the world
    provide an interesting comparison of how humans can adapt to extreme elevations.
    Although we do not know how long each of these groups has lived at high altitude,
    the consensus is that the Tibetans settled their plateau communities first and
    thus have had a greater chance for natural selection and adaptation to high altitudes.
    Both populations have adapted to their environment and appear to have relatively
    normal energy expenditures at rest and relatively adequate exercise capacities,
    even at altitudes up to about 4,000 meters. This contrasts greatly with most healthy
    adults living at sea level, whose exercise capacity falls by 20 to 30 percent
    at these altitudes. Although exercise tolerance can increase over time at high
    altitude, the Tibetan and Andean inhabitants show relatively comprehensive adaptation
    to high altitudes.'
