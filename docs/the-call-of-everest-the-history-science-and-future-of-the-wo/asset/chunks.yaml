    1979 年 5 月 8 日，雷因霍德·梅斯纳（Reinhold Messner）承认，当他与彼得·哈伯勒（Peter Habeler）站在珠穆峰顶，成为首位未使用辅助氧气登顶的人时，他并没有感到特别——只有一种平静。只有当哈伯勒在他汇合时，情感才涌上两人的头头。


    一年后的 1980 年 2 月 17 日，面对咆啸的冬风，波兰登山者克什斯托夫·维尔卢斯基（Krzysztof Wielicki）和莱谢克·齐希（Leszek
    Cichy）到达顶峰，成为首位冬季登顶珠穆峰（或任何 8000 米级高峰）的人。所有因素对其不利，但他们知道必须表现。正如维尔卢斯基解释道：“波兰就是波兰，珠穆峰就是珠穆峰。”


    英国登山家艾莉森·哈格雷夫（Alison Hargreaves）在 1995 年从珠穆峰顶通过无线电报告时哭笑着：“告诉我的孩子们，我正在世界之巅，我深爱他们。”在成为第二位未使用辅助氧气登顶的女性以及首位单人独攀的女性后，艾莉森的第一念头是她的孩子们。


    ![](img/Anke_97881426212413_epub_039_r1.jpg)


    英国传奇登山家乔治·李·马洛里（George Leigh Mallory，左）和安德鲁·欧文（Andrew Irvine）的肖像将这些人定格在时间中。他们开辟了从西藏东北脊路线，但在
    1924 年尝试登顶时消失在云雾中。这是马洛里四年内的第三次登上珠穆峰。


    卓越的时刻。惊人的成就。历史的诞生。但是什么导致了这些非凡的壮举？它们并非偶然。多年的努力、数十年的探索、数十个未实现的梦想和志向成就了这些登顶时刻。而这一切都始于一次意外的测量。


    ## 探索岁月


    “先生，我发现了世界上最高的山，”拉达纳斯·西克达（Radhanath Sikdar）冲入印度总测量师安德鲁·沃爵士（Sir Andrew Waugh）的办公室时惊呼道。他的宣告塑造了喜马拉雅登山的历史。在此之前，洛子岗群峰一直占据领先地位。但在乔治·埃弗莱斯特爵士（Sir
    George Everest）领导的印度大三角测量完成完成后，这座被称为`Peak XV` 的山显得更高，大约 29,000 英尺（8,839 米）。随后的测量将总高度略微增加到
    29,028 英尺（8,848 米）。


    乔治爵的继任者认为，用这位发起测量的人命名这座山是合适的。珠穆峰的名字永远不会被忘记，尽管根据丹增·诺盖（Tenzing Norgay）的话，Chomolungma（意思是“鸟不可飞越的山”）是一个更具描述性的称号。


    于 1857 年成立于伦敦的阿尔卑斯俱乐部（Alpine Club）很快成为进入更大山脉的孵化器。其早期探险家之一查尔斯·布鲁斯（Charles Bruce）是第一个提出攀珠穆峰的人。世界大战停止了所有努力，但战争结束后，兴趣重新燃起。


    1919 年，在瑞士到印度等异域长大并几乎从世界大战中中逃生的摄影师兼电影师 J.B.L. 诺尔上（Capt. J. B. L. Noel）向皇家地理学会演讲，声称他在
    1913 年曾伪装旅行，位于珠穆峰 40 英里的范围内。一年后，对海拔对人体影响感兴趣的化学教授亚历山大·凯拉斯斯（Alexander Kellas）展示了他在珠穆峰冰川
    10 英里内拍摄的照片。凯拉斯斯和诺尔很快策划了秘密的攀登计划。


    在获得达赖喇嘛前往珠穆峰远征的许可后，阿尔卑斯俱乐部与皇家地理学会联手合作。他们的策略是：1921 年进行侦察，次年进行正式尝试。四人侦察队包括一位年轻的登山者乔治·李·马洛里。马洛里是一位牧师之子，他是英国最出色的登山者之一，而且帅得不可思议。


    马洛里并没有立即接受提议。他有自己的职业，还是个有子的丈夫。但他明白攀登珠穆峰可能对他的事业有利，于是他接受了。这个决定将让他闻名，但也将让他付出生命。


    1921 年 5 月，由于尼泊尔对外国人关闭，小组离开大卓岭（Darjiling），向北穿越西姆进入西藏，由背着重物的谢尔巴陪伴。不到一个月，珠穆峰夺走了它的第一位受害者。凯拉斯斯在接近但仍可见山上去世，显然死于心衰竭。这是一个沉重的打击，因为凯拉斯斯是一位经验亚洲探险家，已经登过九座超过
    20,000 英尺的山峰。他还预测珠穆峰可以在没有辅助氧气的情况下登顶。他是的。但在 50 年后才有人做到了。


    当探险者出现在鲁布布冰谷时，雄伟的山峰在他们面前拔地而起。马洛里描述它是“一种宏伟的姿态，主宰一切，在无可挑战且孤立的霸权中显得广阔。”更具体地说，他看到的是
    10,000 英尺的北壁，左侧是东北脊，右侧是长长的西脊。另一座山脊向北延伸，完成了这一几何结构。


    他们探索了数天地形，穿越鲁布布冰川，攀登小山峰以获得更好的视野，试图拼凑地形，始终寻找平坦的土地。但他们错过了一条不起眼的小溪，它从东部狭窄的山谷流出进入鲁布布冰川，这条溪最终为攀登那座山提供了关键。从一个他们称为`Lho
    La` 的高山口，他们可以看到昆布冰川和上部盆地，他们将其命名为`Western Cwm`。经过两个月的寻找，他们找到了一条通过`Lhakpa La`到达东鲁布布冰川的路。直到
    9 月 24 日他们才到达大营，出发已经四个月了！马洛里精疲力竭，在信中写道：“明年我不去了。”


    1922 年季风前尝试的顶点是杰弗里·布鲁斯（Geoffrey Bruce）与英国最好的雪冰专家乔治·芬奇（George Finch）一起到达 8,321
    米，两人都使用了辅助氧气。令人惊讶，这是布鲁斯的首次攀登。但当一次巨大的雪崩在大本营发生时，远征陷入了悲剧，七位谢尔巴遇。


    1924 年，一位新人加入了小组——安德鲁·康明·欧文（Andrew Comyn Irvine），大家都叫他桑迪（Sandy）。这位肩膀宽阔的顶级运动员曾在牛津大学划船，拥有顶级的实用技能和良好的态度。他的大孙女朱莉·萨默斯（Julie
    Summers）记得：“桑迪·欧文天生勇敢。”早早，马洛里就选中桑迪作为他的首选攀登伙伴，部分是因为他的能力，更重要的是他对氧气设备的熟练运用。


    马洛里对 1924 年的珠穆峰之有一个策略：两次同步进攻，一次使用氧气，一次不使用。他打算使用`gas`并与欧文一起登顶。在第三次登上珠穆峰时，马洛里是所有人中最有动力，近乎冷酷。在给妻子的信中写道：“按照这个计划，我几乎认为不可能登顶；我无法想象自己失败地回来。”对于一位剑桥的朋友，说得更为直白：“这将更像战争而不是登山。我不认为自己能回来。”


    在山上待了几周后，远征领队 E.F. 诺顿（E. F. Norton）付出了巨大的努力。在没有辅助氧气且视线模糊的情况下，他在 8,570 米处返回，距离顶峰仅
    900 英尺。他的无氧记录持续了 54 年。四天后，马洛里和欧文携带气瓶，从海拔 26,800 英尺（8,169 米）的六号营出发。几小时后，诺尔·奥德尔正在扫描坡面，此时云层散开，显示一个小物体快速向上移动，接近一个岩阶。另一个物体随其后。它们看起来在移动。


