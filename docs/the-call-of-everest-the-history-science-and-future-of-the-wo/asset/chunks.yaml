  trans: '


    AMEE（美国珠穆玛峰远征队）的目标至少是高远的。这次远征的首要攀登目标是通过东南脊登顶。这一目标在 1963 年 5 月 1 日实现，当时吉姆·惠特克（Jim
    Whittaker）和夏尔巴纳旺·贡布（Sherpa Nawang Gombu）站在了世界之巅。单这一成就就标志着团队的成功，但更多的目标在等待着。攀登从未尝试过的西脊、穿越山体并从东南脊下山的想法变成了次要目标。西脊是一条真正体现登山精神的路线——它具有远见性、技术难度大，并且需要巨大的投入。在
    1963 年，仅仅是从西脊登顶的想法至少领先了时代 30 年。威利·温索尔德（Willi Unsoeld）和汤姆·霍贝因（Tom Hornbein）在该路线上的成功，标志着美国迄为止在喜马拉雅最大的成就。


    霍贝因和温索尔德不仅在 5 月 22 日攀登了西脊：他们山顶附近遇到了我父亲和鲁特·杰拉斯塔德（Lute Jerstad），然后开始在夜间下山。夜幕将他们困在旷野中，他们被迫在
    28,000 英尺以上的高度没有炉子、帐篷或氧气的情况下露营。团队挤在一起，暴露在东南脊的风风中，除了等待晨光外没有其他选择。此前没有人在这种海拔高度度过夜，生存是否可能还尚不确切。我曾两次爬过这四个人在山顶下方无遮挡过夜的地点，两次我都记得自己被一种念头所淹没：那是我父亲挣扎求生度过夜晚的地方。我经常在想，当我父亲等待寒冷和黑暗让位于晨光时，脑子里在想些什么。


    ## 活的科学


    AMEE 的另一个目标是在山上进行科学研究。从本质上说，AMEE 就是一个科学实验室。在冰川学、太阳辐射、生理学、心理学和社会学领域进行了大量的研究和实验。团队的每位成员都以某种形式为远征的研究部分做出了贡献。在
    1963 年，关于高海拔生理学的数据并不多。AMEE 不仅提供了完美的实验室，还提供了研究所需的所有标本。AMEE 的结果为海拔影响（特别是在 8,000
    米以上）提供了具体的记录，这部分知识已成为美国进行的所有后续海拔研究的基础。


    海军和空军对遭受长期高压力和极寒天气影响的团队在和社会心理方面非常感兴趣。他们的兴趣源于美国国防部的信念，即该国极有可能参与一场冲突，士兵们将驻扎在非常寒冷、压力巨大且偏远的环境中。尽管结果很有趣，但考虑到远征成员非凡的勇气和性格强度，研究结果很可能存在偏见。


    成员们由远征领队诺曼·迪赫伦富斯（Norman Dyhrenfurth）召集，他们自己本身是当时北美最优秀、最有经验的登山者。成员名单读起来就像是 60 年代的名人录。只需翻一下美国几乎任何一个攀登地的登山指南，就能发现科贝特（Corbet）、波纳纳尔（Pownall）、埃默森（Emerson）、温索尔德（Unsoeld）、杰拉斯塔德（Jerstad）等名字与全美各地的重大攀登联系在一起。AMEE
    的成员不仅是卓越的登山者，而且受过高水平教育的专业人士。团队有三位医学博士、五位哲学博士和五位硕士（其中三名成员在远征期间正在攻读博士学位）。这些人人属于文艺复兴模式的登山者；他们的登山爱好与其职业是分离开的，这使得他们在珠穆玛峰上的成就更加令人印象深刻。


    五十年前，这次远征是在兴奋、冒险和乐观的复杂心情下开展的。当我们回首时，拥有了洞察探索风险和成果之光的益处。AMEE 的实质性成果非常清晰——六名成员登顶，山上开辟了一条新路线，并产生了海量的科学研究。不那么实质性的是这些登山者及其远征对后世后代产生的巨大影响。在
    1963 年攀登之后的几代中，几乎每一位进军大山的登山者都读过霍贝因的《珠穆玛峰：西脊》（*Everest: The West Ridge*）或乌尔曼（Ullman）对这次攀登的官方记录《珠穆玛峰上的美国》（*Americans
    on Everest*），如果两者都读过。这些书在许多方面影响了无数登山者。


    ## 立下高标准


    最重要的是，这个团队为美国登山者在喜马拉雅的可能性树立了基准。读完这些记录后，人们会产生一种任何事情都能完成的信念；并受到启发去接受这些登山者的遗产并追随他们的脚步。只有当我们把信仰和支持给予那些勇于迈出大步的人时，已知的世界才会扩张。从根本上说，如果没有这些探索者的勇气，我们将无立之地，这就是我们庆祝这个周年的原因。从本质上说，任何在喜马拉雅攀登的美国人都在巨人的脚下攀登。而在这些巨人中，包含了
    1963 年美国珠穆玛峰远征队的所有成员。


    一生的攀登和 46 岁的年龄在山上带来了更开阔的视野——至少对我来说是如此。不再拥有年轻的无敌和力量，我的最后一次攀登让我更深刻地认识到了 AMEE 的成就。一座纪念我父亲的佛塔（chorten）坐在腾波切（Tengboche）寺院后面，旁边还有他的朋友和登山伙伴吉尔·罗伯茨（Gil
    Roberts）、鲁特·杰拉斯塔德（Lute Jerstad）和杰克·布里滕巴赫（Jake Breitenbach）的纪念碑。这是一个有力的画面，山谷景色优美，珠穆玛峰高耸在上方。每当我在昆布地区时，我都会去这些佛塔挂上西藏旗，并和“哥们”喝一杯。泪水流面，我再次感到自己像那个厨房里的孩子，被英雄们环绕，惊讶好奇地听着珠穆玛峰的故事。


    **—BRENT BOP** 布伦特·毕申（Brent Bishop）是一位登山者和环保主义者，也是 1963 年美国珠峰远征成员巴里·毕申（Barry Bishop）之子。1994
    年，布伦特·毕申创立了萨加玛塔环保远征（Sagingmatha Environmental Expedition），从此以后帮助从珠峰清理了数吨垃圾。


    ## 遗产登山队


    希拉里·奥尼尔（Hilaree O’Neill）、强大的达瓦·扬姆（Dawa Yangzum）和我——虽老但顽强——于 4 月 10 日到达珠穆玛峰大营，加入了我们团队的其他成员。像吉姆一样，我们都来到昆布地区庆祝美国首次登顶珠穆玛峰
    50 周年。由著名登山者兼珠峰老将康拉德·安克（Conrad Anker）领导的 2012 年珠峰教育远征由九名登山者、八名高海拔夏尔巴、一名高海拔夏尔巴、三名通信技术员和七名大营工作人员组成。我们的夏尔巴——安卡吉、丹鲁、江布、拉帕·博特、明玛、帕努鲁、索姆·多杰、腾迪以及年轻的夏尔巴达瓦·扬姆——是业内最有经验的人之一。我们的夏尔巴领（sirdar）帕努鲁已登顶珠峰
    9 次；我们团队中实力最强的丹鲁已登顶过 13 次。


