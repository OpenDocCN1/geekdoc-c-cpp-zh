    Along with these changes have also come positive impacts. With increased incomes
    comes improved health. Goiters, caused by a lack of iodine, were a common sight
    through the early 1970s, but they have now been virtually eliminated. Sherpa children
    receive a better education, and there are now many Sherpa Ph.D’s, doctors, dentists,
    conservationists, and government workers. Most villages have electric power from
    mini-hydro stations, complemented with alternative technologies such as solar
    energy-driven water heaters, lights, and battery chargers. These devices have
    become particularly popular in lodges in the more remote alpine villages that
    do not have electric power, such as Pheriche, Dingboche, and Chukung. Dingboche
    even has solar-powered Internet access. Lodges in the alpine zone switched to
    kerosene for cooking fuel in 2004, which has resulted in the rapid restoration
    of fragile alpine ecosystems (a project cofinanced by the National Geographic
    Society in 2005 and 2007). Thanks to Sir Edmund Hillary and the Himalayan Trust,
    the region has schools, clinics, and airstrips—Hillary’s way of thanking the Sherpa
    people for their help in achieving “the most meaningful of my accomplishments,”
    as he put it.


    But with the positive also come the negative impacts. With no zoning system, the
    number of lodges increases each season. Each year lodge owners bring in canned
    and bottled goods by the ton. These containers end up in landfills outside every
    village, since there is no recycling system or incentives for them to do otherwise.
    Five tons of solid waste is generated each year in the Everest Base Camp alone.
    Human waste and raw sewage is channeled directly into nearby freshwater steams,
    polluting water supplies for thousands of people living downstream. Trekkers increasingly
    complain about intestinal disorders contracted along the Base Camp trail in the
    upper Khumbu Valley, likely caused by improper sewage disposal. Porters use large
    blue plastic barrels to carry human waste by the ton to a place about two hours’
    walk south from Base Camp. There it is dumped into large pits, some of them located
    in seasonal riverbeds.


    # VOICES: WATCHING CHANGE IN KHUMBU


    My name is Sherap Jangbu. I was born in Namche Bazar, gateway to the Chomolungma,
    in 1954, exactly one year after the first ascent of Chomolungma—Mount Everest—by
    Tenzing Norgay Sherpa, from Nepal, and Sir Edmund Hillary, from New Zealand.


    I am 58 years old and married, with a lovely wife, Lhakpa Doma. We have one grown-up
    son and one daughter, and we also are lucky to have one grandson, Tsering Wongchu,
    from our son, Mingma, and another, Tsering Paljor, from our daughter, Rita.


    Namche Bazar is the main trading point in Khumbu region. All those who go on expeditions
    to Everest, trekking in the area, or to Tibet for trade will go through Namche
    Bazar, because it is suggested that you first spend two nights here to acclimate.
    In Namche Bazar we have everything from luxury hotels to lodges, to accommodate
    all varieties of tourist.


    As far as I remember, the first time I ever saw the Mik Karu (White Eye, which
    is our nickname for white people or foreigners) was 1963, the date of the first
    successful American Everest expedition. My uncle, Yula Tsering, was on that team.


    At that time, only a few expeditions came to Chomolungma, and it used to take
    at least four to five months to finish an expedition or at least two months to
    finish the trekking, because they had to walk from Kathmandu to Everest and back.
    In 1964 Sir Edmund Hillary built a small airstrip in Lukla. That shortened the
    trekking and expedition time, so from the 1970s on, the tourist flow increased.


    **SHERAP JANGBU SHERPA** A lifelong resident of Khumbu, Sherap Jangbu Sherpa organizes
    and leads treks throughout the Everest region.


    ![](OEBPS/images/Anke_9781426212413_epub_035_r1.jpg)


    PRAYER FLAGS CREATE a rainbow of color at the top of Cho La, Nepal. On the route
    to Everest, the pass, located at 17,780 feet (5,420 meters), offers stunning views
    of the Himalaya.


    # THE FUTURE EVEREST LANDSCAPE


    What does the future hold for the world’s highest mountain, with its mélange of
    positive and negative changes? Tourism to the Kama Valley will probably increase
    as a new generation of wealthy adventure tourists seeks new and more pristine
    paths to the mountain, steering clear of ever more trekking tourists, yaks, dzos,
    and porters on the Khumbu Everest Base Camp trail. The north side of the mountain
    could indeed be closed, as Chinese officials have threatened, giving the fragile
    landscape a chance to heal and technicians the time to clean up decades of accumulated
    garbage, tents, oxygen bottles, and, sad to say, corpses.


    The fate of the Khumbu Valley is more complex. It will be largely determined by
    future global economies, the political stability of Nepal, and decisions made
    by the Sherpa communities regarding the current processes of change. Oil embargoes,
    the price of fuel and travel, and recessions and depressions will clearly result
    in ebbs and flows of tourist numbers. Some outdoor magazines advise readers to
    get to Nepal sooner rather than later, since political instability could once
    again result in the long-term closing of the country’s borders to foreigners.


    But world economies and national politics aside, how long will Khumbu remain a
    desired place to visit, given the increasingly overcrowded and unsafe health conditions?
    Will solid and human waste deposits in villages and along the trail reach a level
    that makes it an undesirable place to visit?


    The short answer? Not likely. “There’s only one Everest,” as many have said, and
    that fact will probably draw future generations of climbers, trekkers, scientists,
    filmmakers, journalists, mystics, academics, teachers, development specialists,
    and thrill seekers for years to come. The Sherpa people themselves face questions
    that are unprecedented in their nearly 400-year history. The loss of their traditional
    culture is matched by their decrease in numbers as more and more move to Kathmandu
    or New York City. They have to settle-term management issues concerning the tourism
    from which majority profit. But if the Sherpa people have demonstrated any one
    attribute century after century, it’s their ability to adapt, to recognize new
    opportunities as they arise, and to find solutions to what might appear to be
    insurmountable.


    And the mountain itself? It, too, shows a remarkable ability to adapt. Everest
    has survived the spread of humankind over the Earth, the sweep of ice ages and
    interglacial periods, the slow migration of flora and fauna up and down its slopes,
    and the recent discovery of its lower slopes by farmers, yak herders, and in the
    past 60 years, adventure tourists. Mount Everest will continue to tower among
    the clouds long, long beyond human memory.


    # ![](OEBPS/images/Anke_9781426212413_epub_036_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_037_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_038_r1.jpg)


    **BARRY BISHOP HAS** nothing but air around him as he rests on the summit in 1963,
    the year he and three other Americans became the first from their country to reach
    the top.


    When Tenzing Norgay heaved himself onto the top of the Hillary Step, “like a giant
    fish,” according to Edmund Hillary, they both knew they were about reach the summit
    of the highest mountain on Earth. As they embraced on top on that historic day—May
    29, 1953—their names became forever linked with Everest.


    Ten years later, as Willi Unsoeld and Thomas Hornbein stood on top of Everest
    after having climbed up a couloir that would bear his name, Hornbein pondered
    the meaning of it all: “It is strange how, when a dream is fulfilled, there is
    little left but doubt.”

