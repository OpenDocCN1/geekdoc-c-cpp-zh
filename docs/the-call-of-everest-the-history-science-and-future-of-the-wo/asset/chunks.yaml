    为了收集心肺功能数据，我们每个人的胸前都贴着一个比最小手机还小的微型电脑，在余下的整个远征过程中它将一直固定在位。这台价值数千美元的设备连接到两个贴在我们乳头下方的电极上。一个高分辨率加速度计和一个微型心电图仪（测量心率和心间期的的机器）每秒会采集
    400 次数据。心率变异性是衡量系统压力的指标之一。


    ![](img/Anke_9781426212413_epub_065_r1.jpg)


    # 希拉里·奥尼尔攀登洛子峰

    洛子峰底部。2012 赛季珠穆玛的干燥气候意味着攀登过程中某些路段是在光滑坚硬的冰面上进行的，而不是典型的积雪覆盖。奥尼尔正在一次适应性训练中前往三营。


    在一周的时间里，梅奥团队对我们和他们进行了一系列测试。采集血液，用皮脂钳夹取脂肪，并将涂有凝胶的超声波探头在我们胸部来回滑动。机器测量我们的肺容量和气道功能。我们的认知能力（或其退化情况）通过类似于曾提供给宇航员的电脑游戏来衡量。在其中一种游戏中，每当屏幕出现正方形，我们就用塑料笔戳向屏幕——这是为了测量手眼协调能力。在另一种游戏中，我们需要将单词的颜色——例如印成绿色的单词
    `red`——与下方的颜色名称（而不是单词本身）相匹配。最后，我们进行了握力测试和阶梯测试，像珍娜·芳达一样在小凳子上跳上跳下。


    在让我们既受折磨又觉得很有趣之后，约翰逊和他的梅奥小团队收拾行李，回到明尼苏达州进行数据分析。（他们带走了我们的地质学家戴夫·拉格森。他不仅生病了，还要处理家事。我们的夏尔俄人在山顶上采集的岩石将送给他进行分析。）


    ![](img/Anke_9781426212413_epub_066_r1.jpg)


    哪种帐篷场景符合你的风格？是 1953 年为了取暖而挤在一起的肉堆，还是今天像 NASA 监控样的高强度？1953 年的团队实际上在收听伊丽莎白女王女王的加冕仪式——当时有收音——而
    2012 年远征队的通讯帐篷则包含了全套设施的 Wi-Fi。


    约翰逊离开时总结道：“我们的目标是尽可能多地了解极端压力下心肺系统的生理状况，然后将这些发现应用于治疗心衰竭患者。”


    # 声音


    ## 为什么要攀登珠穆玛峰？

    海拔一万三千英尺。那是我在参加这次珠穆玛峰远征之前去过的最高海拔。虽然我是一个攀登者并热爱大山，但登山从未进入过我心中的登山运动领域。我梦想的是陡峭的岩石和冰壁，而且大多是单段攀登。当我获得作为国家地理/北面遗产（Legacy）远征队成员尝试挑战世界最高峰的机会时，我被迫扩大自己对大山攀登以及正式远征的理解。尽管如此，对于深知在整个春季中将经历的所有不确定性，我曾感到非常困扰。现在回首，距离站在世界之巅仅过去几个月，我确定这段经历改变了我的生活。


    ## 内在意义

    这是一段漫长的旅程，在我存在的每个层面都极具挑战性——心理、情感、精神，当然还有生理。由于这是我第一次大型高山远征，我没有技巧来理解自己内心应该感受什么或如何感受。日子很漫长，在如此基础、原始且极端的环境中，无处可逃。没有任何干扰项能让大脑离开所在地：简单来说，那是一个人类不该存在的地方。我们的死亡和真正的脆弱在那里显而易见，以至于我们的身体实际上在杀死自己。由于无法获得足够的热量，它们开始消耗自我。免疫系统耗尽，仅强维持，因此疾病是不可避免的。


    我经历了两次严重的病痛。一次是一场肠胃噩梦，另一次是地狱般的喉炎和上呼吸道感染。两者都需要抗生素。然而，生活总有一线希望。


    这次经历通过迫使专注于当下、缓慢生活并面对现实，让我梳理了我的生活。它在几周时间里暴露了我的真实自我，像剥洋葱一样层层剥开。它迫使我面对那些棘手的问题：我应该成为谁？这种生活是为了什么？我想要什么？


    也许不让我的思想陷得那么深更好，特别是考虑到我们这次重要远征所承担的所有责任——但正如我所说，我并没有关于应该感受或思考的参考。我实际上相信，我出现在那里的原因之一是为了提供一个新颖、无偏见的视角。幸运的是，我们履行了职责，并幸运地登顶了山，但回想起来，这些仅仅是锦上添花。


    最重要的是，珠穆玛峰让我能以不同的角度看待我的生活并对其重新考虑。对于此，我将永远感激那些足够信任我并让我去的人……以及大山本身。


    **萨姆·埃利亚斯** 一位专注的高山滑雪运动员、运动岩岩者和冬季攀登者，萨姆·埃利亚斯在世界各地追求挑战。他是北面运动员，也是遗产攀登远征队的成员。


    # 季节的征兆

    到 4 月底，珠穆玛峰南侧发生了三起死亡，全都是夏尔俄。一个死于中风，另一个死于酒精中毒，还有一个由于没有系好安全绳掉入冰裂缝。


    4 月 26 日，当我们团队的一部分人在二营、另一人在三营时，洛子峰西脊的一处冰脊崩塌，引发巨大的雪崩冲入西冰川。深百英尺的雪崩伴随着篮球大小的冰块，横扫了从一营到二营的路线。在某些时段，有
    50 到 100 人正经过这条路。幸运的是，只有一个人被这场雪崩卷入。尼马夏尔俄被卷入坟般的冰裂缝，断了三根肋骨和两个椎骨，咬断了舌头。在经常救援登山者的阿根廷向导兄弟人的救下，尼马被直升机送往加德满。


    ## 科里的崩溃

    第二天早上，科里和康拉德出发侦察前往西肩（西脊起点）的路线。他们到达了两万三千英尺的高点，躲避着像导弹一样飞过的落石，最后决定这条路线太危险，无法攀登。在返回时，科里开始胸痛和呼吸困难。当他们回到二营时，科里已经喘着粗气、干呕且極度虚弱。在接下来的一小时里，我们让科里休息、放松并喝水。科里显得精疲力不堪，眼神焦虑，不断重复着：“我喘不上气了。我觉得快窒息了。”


