    # **CONTRIBUTORS**


    CONRAD ANKER is one of America’s best known alpinists. Born in San Francisco in
    1962, he first climbed the granite domes and sheer faces of Yosemite Valley near
    Big Oak Flat, where his great-grandfather pioneered. His parents, outdoors enthusiasts,
    encouraged his passion for climbing. Anker graduated from the University of Utah
    while pursuing expedition climbing around the globe. In 1999, climbing Everest,
    Anker found the body of early British explorer George Mallory, who was last seen
    nearing the summit in 1924\. He is co-author of *The Lost Explorer* and is a key
    character in the National Geographic film *The Wildest Dream: Conquest of Everest*.
    Conrad Anker is a professional athlete for The North Face and lives in Bozeman,
    Montana, with his wife, Jennifer Lowe-Anker, and their sons, Max, Sam, and Isaac.


    THOMAS HORNBEIN, M.D., is an emeritus professor of medicine at the University
    of Washington. An anesthesiologist specializing in the physiology of breathing,
    he has always pursued mountaineering along with his professional career. In May
    1963, he and Willi Unsoeld, members of the first American expedition to Everest,
    became the first climbers to ascend Mount Everest via the West Ridge. A span on
    that mountainside has since been named for him: the Hornbein Couloir. Hornbein
    wrote of his climbing experience in *Everest: The West Ridge*, issued in a third
    edition for the 50th anniversary of the expedition, in 2013\. As he enters his
    eighth decade, Hornbein remains active in exploring, climbing, and caring for
    mountain environments.


    DAVID BREASHEARS is a filmmaker, mountaineer, and executive director of GlacierWorks,
    a nonprofit concerned about climate change in the Himalaya. In 1983, he transmitted
    the first live television pictures from the summit of Everest; in 1985 he became
    the first American to summit Everest twice. He also co-directed and co-produced
    the first IMAX film shot on Mount Everest, which premiered in March 1998 and recounted
    the tragic 1996 climbing season. He is the author of *High Exposure: An Enduring
    Passion for Everest*, co-author of National Geographic’s *Last Climb*, and contributor
    to National Geographic’s *Everest: Mountain Without Mercy*.


    ALTON C. BYERS, PH.D., a National Geographic explorer, is a mountain geographer,
    photographer, writer, and climber with more than 30 years of experience working
    in major mountain regions throughout the world. His areas of expertise include
    applied research, community-based alpine conservation and restoration methods,
    and climate-change impacts in high mountain environments.


    BROUGHTON COBURN has worked in development, environmental conservation and protected
    area management in Nepal, Tibet, and India for 20 years and overseen several charitable
    projects in Sagarmatha National Park. He has written or edited seven books, including
    National Geographic’s *Everest: Mountain Without Mercy* and *Triumph on Everest*,
    a biography of Edmund Hillary. He collaborated with Jamling Tenzing on the book
    *Touching My Father’s Soul: A Sherpa’s Journey to the Top*.


    MARK JENKINS is a contributing writer for *National Geographic* magazine specializing
    in difficult or dangerous assignments. The author of four acclaimed books—*A Man’s
    Life, The Hard Way, To Timbuktu*, and *Off the Map*—Jenkins has won numerous literary
    awards including the National Magazine Award, the Banff Literary Award, and the
    American Club Award. He has covered the guerrilla war in the Congo, land mines
    in Cambodia, AIDS in Botswana, and koalas in Australia, and undertaken more than
    50 mountaineering expeditions around the world, from Tibet to Bolivia, Afghanistan
    to Uganda.


    BRUCE JOHNSON, PH.D., is a professor of medicine and physiology at the Mayo Clinic
    and a consultant in the clinic’s Division of Cardiovascular Diseases. He runs
    the Human Integrative and Environmental Physiology Laboratory and has a long history
    of studying limiting factors in human performance. He has set up mobile laboratories
    throughout the world, including in Antarctica, South America, and Nepal. He has
    published and lectured widely on human physiology related to health and disease.


    DAVID R. LAGESON, PH.D., is a professor of geology at Montana State University.
    He received his doctorate from the University of Wyoming in 1980 and has taught
    and conducted research at Montana State for 32 years. His specialty is structural
    geology and tectonics. He is a fellow of the Geological Society of America and
    the Geological Society of London.


    BERNADETTE MCDONALD, former vice president for mountain culture at the Banff Centre
    in Banff, Alberta, has authored eight books on mountaineering and mountain culture.
    Her numerous awards include the Boardman Tasker Prize and the Banff Mountain Book
    Festival Grand Prize, awarded for *Freedom Climbers* in 2011; Italy’s ITAS Prize
    in 2010; and India’s Kekoo Naoroji Award in 2008, 2009, and 2012\. The American
    Alpine Club awarded its highest literary honor for excellence in mountain literature.
    McDonald spends her discretionary time in the mountains, climbing, ski touring,
    and hiking.


