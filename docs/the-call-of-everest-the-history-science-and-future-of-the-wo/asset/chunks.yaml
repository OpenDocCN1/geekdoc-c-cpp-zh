    AS THE NUMBER of people attempting to summit Everest continues to increase, so
    does the number of rescues. After dropping off injured climbers at Base Camp,
    a helicopter turns around to retrieve more climbers farther up the mountain. The
    year 1996 was the deadliest on the mountain to date: Eight people died in a two-day
    period when a storm struck, causing whiteout conditions and plummeting temperatures.


    In 2007, I returned to the north side of Everest to film a biographical documentary
    on Mallory and his life. I had a second go at the Second Step. We removed the
    ladder, returning the cliff to the state that Mallory and Irvine would have encountered
    in 1924. With great effort, I was able to free-climb the overhanging crack without
    using the ladder, in conditions similar to Mallory’s attempt. It was difficult
    and challenging in the rarefied air, yet aided by the benefit of modern equipment
    and technique, the feat was still far easier than what Mallory would have faced.
    Our team reached the summit on June 14, giving me a second chance to stand at
    the apex of our planet.


    ## CHANGING MEANING


    When I was born in 1962, the world population was 3.1 billion people. The population
    of Nepal was 10 million and a grand total of 9 people had stood on the summit
    of Everest. By the time I reached the summit in 2012 on my third expedition, the
    world population had crested 7 billion and the population of Nepal had swelled
    to more than 26 million. A total of 106 people summited on that same day—May 26,
    2012—bringing the total number of summits to more than 6,000 in 50 years’ time.
    Popular sentiment, prodded by the press and inevitable deaths that still occur
    on the mountain, held that with so many climbers, Everest was no longer relevant.
    It had gone from an epic, daring adventure to an easily attainable trophy.


    Everest will always be a focal point of human attention because it is the highest
    point on our planet, and as such it retains tremendous drawing power. While the
    cognoscenti in climbing circles no longer respect its ascent, it still has an
    amazing allure for the nonclimber. Knowing the intrigue and allure that Everest
    still has with citizens of our planet, I set out to create a Legacy Expedition
    to honor the first American Mount Everest expedition of 1963.


    ## THE LEGACY CLIMB


    Our 2012 team brought together several educational components. The earth sciences
    of Everest, the composition of the rocks and the forces that drove them to the
    apex of the planet, became the focus of Dave Lageson and the team from Montana
    State University. By collecting a rock profile that ranged from the summit to
    the base, he sought a fuller understanding of the rock and how it got to its position.
    Sharing this information with the National Science Foundation and creating a curriculum
    for fourth- and fifth-grade students provided an exciting way to engage in science.


    ![](OEBPS/images/Anke_9781426212413_epub_010_r1.jpg)


    TRAILS OF HEADLAMPS coursing through tents at night show how bustling Base Camp
    can be. While seen by many as the jump-off point for their long ascent to the
    peak, many people take the trek to 17,598 feet to see the Khumbu Icefall, in between
    Everest’s West Shoulder and Mount Nuptse.


    Bruce Johnson and the Mayo Clinic team studied the effects of high altitude on
    human physiology, especially how the cardiopulmonary system reacts to such duress.
    Studying how the healthy body reacts to altitude allows researchers to better
    predict and monitor disease. Our team included rock climbers with no previous
    altitude experience. Would they be able to withstand the stark demands? The tests
    done on the climbers tracked the same adaptations and reactions that people with
    heart disease face. Testing medical devices in the demanding environment of Everest
    would make them about as durable as it gets.


    Combining high-altitude physiology, earth sciences, and the adventure of climbing
    in the real-time world of the Internet provided the team with the chance to reach
    millions of people. Fifty years ago the story was told via newspapers, magazines,
    and books. Communication in 2012, for better or worse, was immediate. A nearby
    cell tower now allows Sherpas and climbers to keep in touch with their families
    on a daily basis. Satellite phones, about the size of a stick of butter, provide
    instant communication from the upper reaches of the mountain. We shared the Base
    Camp experience with thousands of people via a real-time Google chat. And on May
    26, 2012, I met up with my friend Dave Hahn on the summit. It was his 14th ascent
    of the mountain and my 3rd. Under blue skies, we were able to spend a bit more
    summit time together than we had 13 years earlier.


    After this, I realized that my connection with Everest had come to a turning point.
    I was as old as the 1963 Everest expedition. I had reached the summit without
    supplemental oxygen, an accomplishment that required more effort and personal
    sacrifice than my first two climbs. In my mind, I had treated the mountain with
    greater respect, climbing the peak by fair means.


    My connection to the Khumbu region of Nepal, my bonds to the Sherpas who inhabit
    it, and the friendships stemming from two decades of climbing there have left
    me with meaningful and lasting impressions. While I have traveled to the Himalaya
    to climb ice, rock, and mountains, it is the interactions with indigenous populations
    that I have valued most. In 2012 I joined the advanced Sherpa team to ascend the
    Lhotse Face. We climbed together, fixing rope for all of the subsequent climbers.
    I experienced firsthand the work these climbers do to prepare the route each season.
    From Tenzing Norgay Sherpa in 1953 to Panuru Sherpa, our sirdar (or expedition
    leader) in 2012, Sherpa climbers have been integral to Everest history. Their
    hard work and dedication provide the foundation for all successful ascents. Every
    climber owes a debt to these unsung heroes of Everest.


    ## FOREVER EVEREST


    Despite the naysayers, Everest still offers challenges for the aspiring alpinist.
    Fantasy Ridge, originating from the Kangshung Glacier in Tibet and connecting
    to the Northeast Ridge, is perhaps the largest unclimbed challenge in the Himalaya.
    Repeating routes in better style—without the use of fixed ropes, high-altitude
    support, and supplemental oxygen—still offers climbers unlimited opportunities
    to test their mettle.


    Everest remains a symbol of exploration and discovery. Its increase in popularity
    has reflected the growth of humanity on our planet. The challenges of resource
    use and overcrowding on Everest mirror what civilization below is facing. The
    Himalaya, a low-latitude, high-altitude mountain range, is at the forefront of
    anthropogenic climate change. The glaciers are subject to global warming and a
    changing atmosphere. These challenges are the next “Everest” for human discovery
    and exploration. The same drive that brought humans to the summit will motivate
    future generations on to further unknowns. If our expedition to Everest has helped
    to keep the flame of inquisitiveness and motivation alive, we will have contributed
    to the collective human drive for a better life here on Earth.


    Please join us as we explore Everest in the coming pages.


    # ![](OEBPS/images/Anke_9781426212413_epub_011_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_012_r1.jpg)


    Ancient Persian geographers called the mountains of central Asia Bam-i Dunya—the
    roof of the world. Extending for nearly 1,800 miles, the Karakoram-Himalayan-Tibetan
    belt is a dynamic geological laboratory, formed by the closure of two ancient
    ocean basins and the collision of numerous blocks of Earth’s crust. It holds an
    irresistible attraction for a structural geologist like me. I wanted to see the
    peak and walk the trails myself, and so I joined the Legacy Expedition led by
    Conrad Anker.

