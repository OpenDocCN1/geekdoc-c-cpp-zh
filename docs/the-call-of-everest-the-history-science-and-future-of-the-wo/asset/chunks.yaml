    In the early 1980s I experienced the hazards of not communicating with local people
    firsthand. Without thinking to ask permission, I started installing my soil-erosion
    study plots and surveying the hillside profiles above the villages of Khumjung
    and Kunde. Soon my string fences, rain gauges, sediment-collection troughs, and
    other instruments were being destroyed during the night. Local people had seen
    me working and had jumped to the conclusion that I was a surveyor, intent on taking
    away their land. A village meeting resolved the issue, and my plots were never
    again touched. (I did did, however, occasionally find that young yak herders had
    peed in my rain gauges, which I chalked up as an everyday boyish prank.)


    Today many of these former attitudes have changed, largely because the park’s
    operations have become much more inclusive, according to my colleague Ang Rita
    Sherpa of Kunde village. (His father, Mingma Tsering Sherpa, was Edmund Hillary’s
    main construction supervisor, largely responsible for building the schools, airstrips,
    and hospitals in the region.) Local residents now view the blue pine and fir forests
    reestablished on the slopes above Namche Bazar with pride. Most lodge owners in
    the upper Imja Valley alpine zone are active members of the Khumbu Alpine Conservation
    Committee, which has helped ban the harvesting of shrub juniper and other plants
    for firewood. Communities now report feeling a greater sense of pride and ownership
    in the park.


    ## **VOICES**


    ### SKIING EVEREST


    Everyone knows that the climbing season on Everest is in the spring.


    Usually. I am already a bit different, since I always want to ski *down* any mountain
    that I climb up, so I didn’t bother with the norm when starting my planning.


    My theory was that the summer monsoon season would bring lots of precipitation,
    and I hoped that would translate to more snow on the mountain during the post-monsoon
    season, so I could ski. I also knew that the mountain had been attempted from
    the Nepal side only twice during the post-monsoon season in the previous six years.
    The image of an Everest with few other people on it was a big draw for me.


    As it turned out, we were the *only people on the mountain*.


    With safety and the natural order of things in mind, our small ski team of my
    husband, Rob, and our close friend, Jimmy Chin, agreed on priorities before we
    left Base Camp: 1. Climb up. 2. Ski down. 3. Document it.


    On October 18, 2006, the three of us did ski from the summit, although several
    members of the team, including Rob, ran out of oxygen at the Hillary Step, and
    so in an effort to stay out of the evening news we put our skis on our packs and
    down-climbed most of the way from the Hillary Step to Camp IV. After an unplanned
    second night at the South Col, Jimmy and Rob and I stepped into our skis outside
    our tents and began our descent via a direct line from Camp IV to the Western
    Cwm.


    Usually we ski mountaineers who are still alive make a habit of climbing what
    we ski, but this pitch of the Lhotse Face was an exception. Climbing it would
    have been an undue risk on the way up the mountain that might have jeopardized
    the success of our first goal, which was simply to climb.


    ### **DOWNHILL PROGRESS**


    As we left Camp IV at 9 a.m. on Oct. 19, I went first. After we skied for a minute
    on a relatively gentle 45-degree slope, the Lhotse Face became significantly steeper
    ahead—so steep that I couldn’t see below, and the patches of snow among the blue
    ice that I had easily been linking together now became fewer and farther in between.
    I stopped, looked uphill, and when Rob and Jimmy came into sight made the X sign
    with my ski poles to signify that this was a very dangerous route and maybe they
    shouldn’t follow me. But knowing we were all still going to ski it, I next made
    an enormous shrug of my shoulders with my ski poles as extensions of my arms to
    show as if to say, “I don’t have any idea how to make it any better, so you choose.”


    The face was over 5,000 vertical feet of an uninterrupted 55 degrees and the type
    of terrain with zero opportunities to stop and rest safely. Although we didn’t
    speak about it, I was aware that if one person made one mistake, they would have
    been unrecognizable at the bottom. There were mandatory moments of having to leave
    the relative safety of a patch of firm snow and ski across frozen bare blue ice
    dotted with small rocks and ball-bearing-size pieces of white ice in order to
    reach another patch of firm snow on which to make a ski turn. Each of us remembers
    feeling as if we were free-soloing down a 5.13X slope (climbing grade for a route
    with consequences where death is a real possibility).


    At times I wouldn’t see Jimmy or Rob for 10, 20, or 30 minutes at a time. Each
    of us had a simple light glacier ax but no rope beyond small pieces of cord and
    no rescue gear beyond the standard personal crevasse rescue kit. At only one point
    during the almost two-hour descent did I come close enough to Rob to have a conversation.
    He asked, “How are you doing?” I replied, “I am scared and I don’t want to die.”
    He said, “Good. Make a plan and keep going.” And we continued down.


    ### **TEAMWORK ALL ALONE**


    We had studied the face, and we had watched the film *The Man Who Skied Down Everest*,
    so we knew that after arriving at the house-size boulder where Yuichiro Miura
    had fallen, we would have to move a bit to the right to cross the bergschrund
    at its narrowest point. The easiest crossing still required what I will call a
    lift of our ski tips. Not quite fully catching air, but yes, it was a small gap
    jump. I had to psych myself up for it in order to hit it safely with speed.


    Now that I have lived it, I am not convinced of the theory that Everest is seeing
    more snow during the post-monsoon season, especially as our climate continues
    to change. While we were acclimating in September, there was such a storm that
    all the snow avalanced our planned route off the Lhotse Face and we had to start
    from scratch again. And it is Everest, and so then the wind blew.


    I do know that the days are shorter and colder with a summit date in fall instead
    of spring, yet I wouldn’t do anything differently next time—if there was a next
    time, which there won’t be. Being part of a team is inherently about self-reliance
    and working together, so if our bond is stronger because of the season and our
    experience alone on the mountain, then that’s the way I like it.


    **—KIT DESLAURIERS** The first woman to ski from the summit of Mount Everest,
    Kit DesLauriers has also accomplished several other first ascents and is an accomplished
    rock climber as well.


    ### **QOMOLANGMA NATURE PRESERVE**


    Established in 1989, the Qomolangma Nature Preserve covers an area of 13,500 square
    miles in the Shigatze Prefecture of southern Tibet Autonomous Republic of China.
    Contiguous to the preserve are the existing Langtang National Park, Sagarmatha
    National Park, and Makalu-Barun National Park of northern Nepal. Compared to the
    Nepal side, the Tibetan terrain is generally much higher in elevation but considerably
    less rugged, consisting of rounded hills and flat, broad river valleys. Approximately
    12,000 families live in the preserve with a total population estimated to be 68,000,
    engaged in agriculture, animal husbandry, or both.


    Unlike the high-altitude plateau that most people associate with Tibet, the Qomolangma
    Nature Preserve contains a diversity of landscapes that range from subtropical,
    densely forested river valleys below 2,000 meters to ice-clad peaks of the High
    Himalaya at 8,000 meters and above. It also includes the beautiful Kama Valley,
    gateway to the Kangshung (eastern) face of Everest. The preserve provides habitat
    for the rare snow leopard, kiang (wild ass), and black-necked crane as well as
    Tibet’s only populations of the Assamese macaque. Langur monkeys, Himalayan palm
    civets, jungle cats, musk deer, and tahrs are also found in abundance.

