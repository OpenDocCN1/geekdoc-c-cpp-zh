    在距離四营上方仅一小时的地方，我们遇到了第一具尸体。那死者侧卧在地上，仿佛在雪地里打盹，头被冲锋服的兜帽盖着。十分钟后，我们遇到了另一个尸体，她的躯干和头部包裹在一面加拿大国旗里。二分钟后，另一个尸体，一个韩国人。他仍系在绳索上，坐在雪子里，冻得像石头一样僵硬，脸发黑，双眼圆睁。


    在上周前的第一次冲顶中，有四个人去世了。怎么？为什么？在与夏尔巴人的采访中，我发现每一个案例中，死亡的原因都是傲慢。这四个人都曾被他们的夏尔巴人告诉移动得太慢了，即使到达山顶，也没有足够的体力下山——而这四个人都拒绝了回头。


    据说，那个裹在加拿大国旗里的女子在崩溃前已经使用了九瓶氧气（通常是两到三瓶）。悲剧的是，骄慢在跌落之前。丹努鲁（Danuru）告诉我，他过去遇到过一些客户，当被要求回头时，他们说自己花了很多钱来这趟旅行，并期待到达山顶。当他们最终崩溃时，丹努鲁只是用套索套住他们，把他们从雪地拖下来。由于山体如此干燥且多岩石，这种救援现在是不可能的。如果你停下来坐下，就会冻死。


    那个韩国人在去世前，当他的夏尔巴求他回头时，他实际上向向导打了一拳。现在，当我跨过他冰冷的尸体，他的脸冻结在僵硬的扭曲中，我通过提醒自己克服了这一场景的恐怖：大山并没有杀死这些登山者——是他们自杀了自己。他们死于自大。


    潘努鲁（Panuru）和我尽可能地忍受着这种走走停停的人流。然后，潘努鲁拍了拍我的肩膀，示意我绕过去。尽管周围一片漆黑，我们正站在如刀刃般的雪脊上，两侧是
    5000 英尺的深渊，但我乐意解开锁扣，绕过了一个由十个登山者的结。潘努鲁跟在后面，然后默默地越过我，向我竖起大拇指。从那那时起，潘努鲁和我组成了一个团队。只有在没有其他人在我们正上方爬时，我们才使用绳索。否则，我们在每个瓶颈处都会单独绕行。


    天还是黑，但当我们潘努鲁到达南峰时，天空已变成紫色。现在，大多数头灯都在我们下方而不是上方。我们穿越山口到达希拉里里台阶的底部，那是一面 25 英尺高的垂直岩壁，被数千万个冰爪点留满了痕迹。几名登山者正沿着绳索向上。潘努鲁和我迅速攀爬上岩石并绕过了他们。


    我们现在能看到山顶了。它就在脊线边缘。粉色的天绒般光芒洒满了天空。我觉得自己仿佛在一个鱼眼镜的中心，看着世界向各个方向坠落。地球上的一切都在脚下。一切。一排排的山脉，甚至是云朵。我上方只有外层空间。


    在岩石旁探索时，我们遇到了克里斯（Kris）、希拉里（Hilaree）和丹努鲁。江布（Jangbu）已经上去进行 GPS 测量。我们五个人一起慢慢向山顶走去。风撕扯着插在顶部的西藏经幡，但我们无法靠近它们：至少有
    40 人挤在山顶的小丘上。相反，我们在顶下方几英尺处停下，举起手臂，紧紧拥抱在一起。


    艾米莉（Emily）、然后萨姆（Sam），以及我们的其他夏尔巴——达瓦（Dawa）、丹迪（Tendi）、明玛（Mingma）、索南·多杰（Sonam Dorje）和拉克帕（Lakpa）都将在几小时后站在山顶。第二天，仿佛死而复生般，康德（Conrad）将振作并无氧登顶，这是少于
    200 名登山者完成的成就。在耐力的极限考验中，克里斯和希拉里在四营仅休息半天后就继续冲顶了相邻的洛子峰。我们的整个团队，包括登山者和夏尔巴，将在三天后安全回到大营。


    但此时，站在世界之巅，我知道我本应该感到狂喜、喜悦。我知道这就是 1963 年美国远征队登顶者的感受。霍恩博因（Hornbein）写道：“我们泪流满面地拥抱在一起，泪水流过氧气罩冻成了冰。”但在
    50 年前，攀登珠玛峰是一个更大、更丰富的挑战。有更多的未知数，余地也更小，个人努力也更大。事实是，珠玛峰已经被驯化，被拔了爪。山的雄伟和攀登它的意义已经减弱。半世纪前，攀登珠玛峰是登山技艺的胜利。今天，从现代登山伦理的角度来看，这几乎是一项缺乏运动精神的成就。


    那么站在珠玛峰顶，我有何感受？我承认对仅仅是坚持感到些许自豪，对日复一日地喘着粗气依然一步向前感到。我也感到如释重负。这该死的事终于结束了。但也感到一种不安的模糊感。我不认为自己真的配得上世界最高峰的宏伟。这并不是一场公平的战斗，我很清楚。


    ![](img/Anke_9781426212413_epub_072_r1.jpg)


    `萨姆·埃利亚斯（SAM ELIAS）下降`（右侧）从南峰继续前往山顶。在海拔 28707 英尺（8750 米），南峰是第一个能看到珠玛峰真顶的地方。山顶的景象与今天不同：那里没有以前登山者留下的视觉纪念品，没有大型登山团的拥挤。“看起来在我们之前没有人来过，”布雷哈斯说。![](img/Anke_9781426212413_epub_073_r1.jpg)


    `美国人彼得·杰米森（PETER JAMIESON）`和盖瑞·罗奇（Gerry Roach）（右侧）庆祝他们 1983 年登顶珠玛峰。他们是大卫·布雷哈斯（David
    Breashears）团队的一员，当时他从山顶传输了直播图像。山顶的景象与今天不同。(OEBPS/images/Anke_9781426212413_epub_074_r1.jpg)


    `冰冷的经幡`在大营飘扬![](img/Anke_9781426212413_epub_075_r1.jpg)


    ## **不断变化的大营**


    2012 年春春天，我为了冰川工作项目在珠玛峰大营待了一个月。我在 4 月初到达，当时远征队正在建立营地。我沿着布满岩石的冰川缓慢向上，经常停下来注视沿着蜿蜒路径聚集的数百色彩斑纷的帐篷。大部分是小型个人帐篷，但有很多大型的、烹饪和通讯帐篷。远处发电机嗡嗡声，运输队的牛铃叮当作响，各种语言在远征营中回响。数千面经幡在风中飘动。各国家的国旗也随风起扬。这是一个位于昆布冰川脚下的国际村。数百登山者很快就会在这里居住，他们都有共同的目标但原因各异。然而，大营与我
    29 年前春春天访问的那个完全不同。


