    **SWISS GEOLOGIST AND** explorer Augusto Gansser was a member of the Swiss Himalayan
    expedition, the first to study the geology of the range through Nepal to Tibet.
    Disguising himself as a Buddhist pilgrim and concealing his hammer, camera, and
    sketchbook, he crossed into the forbidden territory of Tibet. He was one of the
    first Westerners to see the holy mountain of Kangrinboqe Feng.


    **VOICES**


    **ODELL’S LAST GLIMPSE**


    Noel Odell awoke early on the morning of June 8, 1924, and set off, up toward
    Camp VI, full of optimism for his friends George Mallory and Sandy Irvine, who
    were heading for the summit of Mount Everest. At about 26,000 feet, he looked
    up toward the highest reaches of the mountain. As he did so, the cloud that had
    been building since the late morning parted, affording him a view of the Northeast
    Ridge and the summit. In his diary he recorded: “At 12.50 saw M & I on ridge nearing
    base of final pyramid.” He was the last to see them alive.


    **STILL A MYSTERY**


    This last sighting has been minutely scrutinized and debated ever since, but no
    one has ever been able to prove that he did not see Mallory and Irvine so close
    to the summit. Odell’s contribution to the 1924 Mount Everest expedition is often
    confined to this one observation, but actually his role on the trek and on the
    mountain was of far greater importance than history would suggest. For one thing,
    he turned out to be the man who best acclimatized to the altitude and was the
    only person who climbed above Camp IV to look for the climbers when they disappeared.
    For another, perhaps less obvious, he was a mentor for Sandy Irvine. He and Sandy
    had first been on expedition together in 1923 when they crossed the Norwegian
    island of Spitsbergen with a four-man sledge party. Sandy’s performance gave Odell
    the confidence to recommend him to the Mount Everest Committee, who were seeking
    a “superman” for the 1924 expedition.


    In fact, he and Sandy had met even earlier than that, in 1919, when Odell was
    on honeymoon in North Wales. He and his wife had been walking in the Carneddau,
    the northernmost range of hills in Wales, when they encountered an intrepid young
    motorcyclist on the top of Foel Vras, some 3,000 feet above the village of Llanfairfechan.
    The motorcyclist approached the Odells and asked them for directions to the village.
    They pointed out the track and watched as he motored off across the rough ground
    and down the steep track. It was only when Odell retold that story in a tent on
    Spitsbergen that Sandy recognized himself and revealed that it was he who had
    been the motorcyclist. From that moment, a bond deeper than superficial friendship
    was established, and during his training for the expedition, Sandy wrote regularly
    to Odell, sharing his delight in everything he was doing.


    **BACK TO THE TENT**


    After Odell had seen Mallory and Sandy going strong for the top, he went on to
    Camp VI and was amused by the tent, which was strewn with bits of oxygen apparatus.
    Sandy turned all his tents into workshops, and this was no different. Odell left
    some food and descended to Camp V.


    Sandy Irvine and George Mallory never returned to their tent. They had died on
    the mountain, but of course Odell was unaware of this. He went back up to Camp
    VI the next day and again the following day in the hope that he would see some
    sign of his friends. We know he saw nothing, but few stop to imagine how sad he
    must have been when he realized he would have to break the news, first to climbing
    leader Edward Norton and then to the rest of the world, that the great George
    Mallory and his young climbing partner, Sandy Irvine, had perished so close to
    the summit.


    Odell is far more than an historical cipher. He is central to the 1924 Everest
    mystery.


    **—JULIE SUMMERS** A British author and historian, Julie Summers has published
    ten books, including ***Fearless on Everest: The Quest for Sandy Irvine***.


    ## **CONTINENTS COLLIDING**


    We now understand that the Himalayan mountain belt is the result of a massive
    collision between two landmasses, India and Asia, building on the theory of continental
    drift formulated in the early 20th century by the German scientist Alfred Wegener.
    Drawing from rock formations and the fossil record on either side of the modern
    Atlantic Ocean, Wegener hypothesized that a giant supercontinent existed around
    250 million years ago, a supercontinent we now call Pangaea. As this supercontinent
    slowly broke apart and the continents “drifted” to their present positions, India
    slowly made its way north toward Asia as the Tethys Ocean basin closed ahead of
    it. As the last scraps of the oceanic crust were subducted into the mantle, India
    collided with Asia to uplift the Himalaya.'
