  raw: 'On May 8, 1979, Reinhold Messner admitted that when he and Peter Habeler stood
    atop Everest, having become the first to climb it without supplemental oxygen,
    he felt nothing special—just a sense of calm. Only when Habeler joined him on
    the summit did emotion overcome them both.


    Less than a year later, on February 17, 1980, in the face of screaming winter
    winds, Polish climbers Krzysztof Wielicki and Leszek Cichy reached the top, becoming
    the first to climb Everest—or any 8,000-meter peak—in winter. All the elements
    had been stacked against them, but they knew they had to perform. As Wielicki
    explained: “Poland was Poland, and Everest was Everest.”


    British climber Alison Hargreaves wept and laughed simultaneously as she radioed
    from the summit of Everest in 1995: “Tell my children I’m on the summit of the
    world and I love them dearly.” After becoming the second woman to climb the mountain
    without supplemental oxygen and the first to solo the peak, Alison’s first thoughts
    were for her children.


    ![](OEBPS/images/Anke_9781426212413_epub_039_r1.jpg)


    **PORTRAITS OF LEGENDARY** British climbers George Leigh Mallory (at left) and
    Andrew Irvine fix these men in time. They pioneered a route on the Northeast Ridge
    from Tibet but disappeared into the clouds during their 1924 summit attempt. It
    was Mallory’s third time on Everest in four years.


    Outstanding moments. Amazing achievements. History being made. But what led to
    these remarkable exploits? They weren’t accidental. Years of effort, decades of
    exploration, dozens of unfulfilled dreams and aspirations led to these summit
    moments. And it all began with a surprise measurement.


    ## **EXPLORATORY YEARS**


    “Sir, I have discovered the highest mountain in the world,” exclaimed Radhanath
    Sikdar as he rushed into the office of Sir Andrew Waugh, the surveyor general
    of India. His announcement shaped the history of Himalayan climbing. Until then,
    Kangchenjunga had held the top spot. But once the Great Trigonometrical Survey
    of India, under the leadership of Sir George Everest, was completed, the mountain
    known as Peak XV appeared higher, at around 29,000 feet (8,839 meters). Later
    measurements edged the total up a bit to 29,028 feet (8,848 meters).


    Sir George’s successor thought it appropriate to name the mountain after this
    man who had initiated the survey in the first place. Everest’s name would never
    be forgotten, even though Chomolungma, which, according to Tenzing Norgay, means
    “the mountain so high no bird can fly over it”—is a much more descriptive title.


    The Alpine Club, started in London in 1857, soon became the incubator for forays
    into the greater ranges. One of its early explorers, Charles Bruce, was the first
    to propose climbing Everest. World War I put a stop to any efforts, but once the
    war ended, interest began anew.


    In 1919 Capt. J. B. L. Noel, a photographer and filmmaker who had grown up in
    exotic locales from Switzerland to India and had barely escaped World War I alive,
    spoke to the Royal Geographical Society, claiming to have been within 40 miles
    of Everest in 1913, traveling in disguise. A year later Alexander Kellas, a chemistry
    professor interested in the effects of altitude on the human body, displayed photos
    he had taken from within ten miles of the glaciers on Everest. Kellas and Noel
    were soon hatching secret climbing plans.


    After obtaining permission from the Dalai Lama to mount an expedition to Everest,
    the Alpine Club joined forces with the Royal Geographical Society. Their strategy:
    a reconnaissance in 1921 and a serious attempt the following year. The reconnaissance
    team of four included a young climber, George Leigh Mallory. A vicar’s son, Mallory
    was one of Britain’s finest mountaineers and almost impossibly handsome.


    Mallory didn’t accept the offer immediately. He had a profession, and he was a
    married man with children. But he understood that climbing Everest could be advantageous
    for his career, so he accepted. The decision would make him famous, but it would
    also cost him his life.


    In May 1921, because Nepal was closed to foreigners, the team left Darjiling and
    headed north through Sikkim into Tibet, accompanied by Sherpas who carried their
    heavy loads. Less than a month later, Everest claimed its first victim. Still
    approaching but within view of the mountain, Kellas died, apparently from heart
    failure. This was a tragic blow, for Kellas was an experienced Asian explorer
    and had already climbed nine peaks over 20,000 feet. He had also predicted that
    Everest could be climbed without the assistance of supplementary oxygen. He was
    right. But more than 50 years would pass before anyone did it.


    As the explorers emerged into the Rongbuk Valley, the stupendous mountain reared
    up in front of them. Mallory described it as “a single gesture of magnificence
    to be lord of all, vast in unchallenged and isolated supremacy.” More practically,
    what he saw was the 10,000-foot North Face, flanked on the left by the Northeast
    Ridge and on the right by the long West Ridge. An additional buttress descended
    in a northerly direction, completing the geometry.


    For days they explored the terrain, navigating the Rongbuk Glacier, climbing small
    peaks in order to get better views, trying to piece together the topography, always
    in search of easy ground. But they missed a nondescript little stream that emerged
    from a narrow valley in the east onto the Rongbuk, a stream that would eventually
    provide the key to climbing the mountain. From a high col they called the Lho
    La, they could see the Khumbu Glacier and the upper basin, which they named the
    Western Cwm. After two months of searching, they found a way over the Lhakpa La
    and down onto the East Rongbuk Glacier. Not until September 24 did they finally
    reach the North Col, four months after starting out! Mallory was weary of the
    effort, vowing in a letter to his wife, “I wouldn’t go again next year, as the
    saying is, for all the gold in Arabia.” But three months later, he was on his
    way back.


    The high point of the 1922 pre-monsoon attempt came when Geoffrey Bruce, together
    with George Finch, Britain’s best snow and ice specialist, reached 8,321 meters,
    both using supplemental oxygen. Amazingly, this was Bruce’s first mountain ascent.
    But the expedition ended in tragedy when a massive avalanche caught the team on
    the slopes of the North Col and killed seven Sherpas.


    A newcomer joined the team in 1924—Andrew Comyn Irvine, known by all as Sandy.
    A superb athlete with powerful shoulders, he rowed for Oxford and had first-rate
    practical skills and a great attitude. As his great-niece, Julie Summers, remembered,
    “Sandy Irvine was born to be brave.” Early on, Mallory singled out Sandy as his
    preferred climbing partner, in part because of his physical abilities but more
    importantly because of his handiness with the oxygen apparatus.


    Mallory had a strategy for Everest in 1924: two simultaneous attacks, one with
    oxygen and one without. He intended to use “gas” and make the ascent with Irvine.
    On this, his third trip to Everest, Mallory was the most motivated of the bunch,
    almost grim. In a letter to his wife he wrote, “It is almost unthinkable with
    this plan that I shan’t get to the top; I can’t see myself coming down defeated.”
    To a Cambridge friend, he was even more blunt: “This is going to be more like
    war than mountaineering. I don’t expect to come back.”


    After weeks on the mountain, expedition leader E. F. Norton put in a remarkable
    effort. Without supplemental oxygen and seeing double, he turned back at 8,570
    meters, just 900 feet below the summit. His oxygen-free record would last for
    54 years. Four days later, Mallory and Irvine, using gas, set off from Camp VI
    at 26,800 feet (8,169 meters). Hours later, Noel Odell was scanning the slopes
    when the clouds parted to reveal a small object advancing upward quickly, approaching
    a rock step. A second object followed. They appeared to be moving. Then the clouds
    moved in.'
