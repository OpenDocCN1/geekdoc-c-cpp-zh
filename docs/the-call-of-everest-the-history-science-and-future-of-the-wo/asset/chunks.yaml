    The year 1988 was a conflicted one on Everest. Several amazing ascents were made,
    but in very different styles. A massive undertaking called the Japanese-Chinese-Nepalese
    Friendship expedition, 254 members strong and costing seven million dollars, sent
    climbers up the Southeast and Northeast Ridges simultaneously, broadcasting live
    from the summit.


    In contrast, a small four-man international team was attempting a fierce new route
    on the East (Kangshung) Face via the Southeast Rib. Britain’s `Stephen Venables`,
    Americans `Ed Webster` and `Robert Anderson`, and Canadian `Paul Teare` hardly
    knew each other, yet they hoped to make the ascent without fixed ropes, without
    supplemental oxygen, and without Sherpa support. When `Charlie Houston` first
    heard of the plan, he bellowed: “Four against the Kangshung Face? You’re mad!”
    Judging by the features on their route, which they eventually called the “Neverest
    Buttress,” Houston was probably right. Filled with horrific overhanging snow and
    ice mushrooms, vertical ice walls, and gaping bergschrunds (where a glacier splits
    off from its base), the route was dangerous, steep, and sustained.


    They worked their way up through the desperate terrain all the way to the South
    Col. Then fatigue began to take its toll and `Venables` pulled ahead, alone. As
    he climbed through the night on `May 11`, he first assumed the others would soon
    catch up to him. Eventually it became clear that he was on his own: Either break
    trail to the summit—all the way—or admit defeat. He made the summit but failed
    to reach the shelter of the tent on the South Col on his return. Instead he bivouacked,
    hallucinating wildly, with visions of `Eric Shipton` warming his feet and Tibetan
    yak herders beckoning him to their fire. At dawn he staggered down to the tent,
    where two of his three mates huddled.


    But the story didn’t end there. After a frightening night, crammed together at
    the South Col and `Venables` half frozen, the climbers had to decide which route
    to descend: back down the Kangshung Face, or the easier South Col route. Despite
    its ferocious difficulty, they chose the face because they knew the way. After
    a series of wild free-falling glissades and miraculous recoveries, all but one
    had lost their ice axes. The story of their three-day descent, so completely out
    of control, is not a model to be repeated. Nevertheless they survived, garnering
    acclaim. `Reinhold Messner` called it the “best ascent of Everest in terms and
    style of pure adventure.” `Chris Bonington` was more specific: “Amongst the most
    remarkable examples of survival in the history of Himalayan mountaineering.” Survival
    it was, but not without cost. `Webster` lost the tips of seven fingers and a thumb,
    and `Venables` lost three and a half toes.


    That autumn, on the south side of the mountain, a small team of Slovakia’s best
    climbers tried to make the first alpine-style ascent of the Southwest Face, initially
    climbed in `1975` by `Chris Bonington`’s team. They used no fixed ropes, supplemental
    oxygen, or Sherpa support. The Slovaks succeeded on the face, but all four died
    on the descent. Because of the devastating loss, many began to question just what
    defined “success.”


    At the same time, `Lydia Bradey`, a flamboyant young New Zealand climber, was
    climbing with a New Zealand team that shared the Southwest Face permit with the
    tragic Slovak group. The New Zealand team, led by `Rob Hall`, did not reach the
    summit and returned to Kathmandu. All except Lydia. She climbed to the summit
    illegally via the Southeast Ridge without supplemental oxygen—making her the first
    woman to do so. The problem was that she had no watch to record the time, and
    her frozen camera had malfunctioned. She had no proof. `Rob Hall` dismissed her
    claim, stating that it was simply not possible. Yet he had an ulterior motive:
    Her illegal ascent might jeopardize his ability to guide in Nepal in the future.
    The summit claim was listed as “disputed,” thereby depriving Lydia the accolades
    for what should have been a monumental achievement. Only years later, after confirmation
    by a Spanish climber on the mountain, was `Lydia Bradey` finally credited with
    the first female ascent of Everest without supplemental oxygen. Lydia was one
    of the few “firsts” on Everest for whom the accomplishment did little to change
    her life. She was a mountain guide when she climbed the mountain, and a guide
    she remained.


    ## Shooting from Above


    Shooting a beautiful image on Everest isn’t hard. Being on Everest is hard. As
    a photographer shooting an expedition, the true challenge is to create a diverse
    montage of the experience peppered with emotional, storm-swept, descriptive, eye-catching,
    eye-keeping, storytelling images. I often have a hard time with those challenges
    at sea level. Bring those challenges up over 25,000 feet and it can be a bit overwhelming.


    Expedition shooting poses an interesting dilemma. There is the constant dialectic
    about whether one should focus on the climbing or the creative. One’s comfort
    level with the terrain and climbing often dictates one’s ability to shoot and
    be creative. I have a love-hate relationship with this challenge. I have built
    a career out of it. I have dreaded it. I have found some of my greatest moments
    of satisfaction in it. And it has almost killed me.


    ## Be Prepared


    In general, I know that at any given moment there is always an amazing image to
    be created, but you can’t shoot all the time. You need to pick your moments, anticipate
    them, work them.


    When the light is happening and there is a flurry of action, you’d better be prepared.
    Your food for the day and camera gear need to be prepped; you need to be dressed
    before everyone and out the door so you can shoot everyone coming out. You need
    to have your bag packed so you can shoot everyone else packing but still not fall
    behind when they leave. Shooting people from below with a big sky above is rarely
    interesting. Shooting from above to show the massive exposure of a sweeping face
    below them and the entire Himalayan range spread across the horizon is the shot
    you want.


    Jimmy Chin An unparalleled expedition filmmaker and photographer, Jimmy Chin is
    also a climber, mountaineer, and explorer in his own right. He is a National Geographic
    emerging explorer and a member of The Face athlete team.


    ## The Recent Past


    Almost every decade has offered up unique and creative advances on Everest: The
    1920s and ’30s were devoted to exploration; the first summit successes came in
    the ’50s; new ridge routes began in the ’60s; the ’80s saw new routes and oxygen-free
    ascents. But what about the ’90s? According to American climber `Ed Webster`,
    “In the early 1990s the years of wonder on Everest seemingly ended.”


    Part of the reason is the vast increase in the number of climbers. The Nepal Ministry
    of Tourism sells more and more permits for the Southeast Ridge each year—a veritable
    gold mine. China has followed suit for the North Ridge. These are granted to climbers
    chasing the Seven Summits. Climbers chasing the 14 8,000-ers. Climbers chasing
    Everest. Many, including `Messner`, feel that Everest is no longer a true mountaineering
    experience. British author `Ed Douglas` called it “Himalaya Horribilis.” Thousands
    now throng the mountain via its most popular routes, and the vast majority of
    them are guided. Hundreds reach the summit each year feeling triumphant, for Everest
    has been their dream, their ambition, their obsession. Yet many others continue
    to die trying, some from falls, others from hypoxia, and most from sheer exhaustion.

