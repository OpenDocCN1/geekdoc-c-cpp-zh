    what’s ahead and what isn’t; the certainty gives us confidence and a lift to our
    stride … An ice-ax belay won’t hold in the soft snow. If one of us begins to slide,
    both of us will enjoy a 10,000-foot jump without benefit of parachute.


    **—SIR EDMUND HILLARY** a beekeeper from New Zealand, Hillary was knighted in
    1953 and dedicated his life to philanthropy on behalf of the Himalaya.


    ## **NEW ROUTES**


    The next big breakthrough occurred in 1960, when the Chinese/Tibetans embarked
    on a massive 214-member expedition whose leader was none other than Mao Zedong.
    They chose the North Ridge, featuring the notoriously difficult rock steps where
    Mallory and Irvine were last sighted. The Chinese apparently solved the problem
    with a human ladder arrangement that, when they dispensed with boots and crampons,
    actually worked. But they were still a long ways from the summit. Not until 4:25
    a.m. on May 25 did Wang Fuzhou and Qu Yinhua (Chinese) claim the summit with Gongbu
    (Tibetan). Their ascent wasn’t acknowledged for years, a fact that Everest historian
    Audrey Salkeld chastised Western climbers for doubting. Skepticism was so entrenched
    that the Chinese felt compelled to do it again—in 1975\. This time they brought
    a ladder for the steps, a feature that remains on the mountain to this day.


    ### **AMEE ’63**


    By the time the Americans arrived in 1963, Everest had been explored on two of
    its three main ridges: Only the West Ridge remained. But what the Americans needed
    most of all was to make the ascent. No American had done that, and it was high
    time. They were led by Norman Dyhrenfurth, a Swiss filmmaker with the looks of
    a film star and a personality to match, who had been the official photographer
    on the 1952 Swiss attempt. Sponsored by the National Geographic Society, the American
    Mount Everest Expedition (AMEE) team included Jim Whittaker, Barry Bishop, Lute
    Jerstad, Willi Unsoeld, and Thomas Hornbein. Logistics were handled by Nepal veteran
    Jimmy Roberts. This was an expedition destined for success. Victory was expected,
    not only from fellow Americans but also from the expedition’s sponsors. Dyhrenfurth’s
    initial plan was to do the grand slam: Everest, Lhotse, and Nuptse. But early
    on, Hornbein, an anesthesiologist from Seattle, and Unsoeld, deputy director of
    the Peace Corps in Nepal, began to imagine a grander plan—a new route on Everest.'
