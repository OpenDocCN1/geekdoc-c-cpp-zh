  trans: '

    亚历山大·凯拉斯是喜马拉雅山的早期探险家，他在 1921 年一次未完成的珠玛峰远征中使用了这种口袋相机；他在前往山区的途中因痢疾和心衰竭去世。`Canon
    5D Mark II`相机具有视频在内的众多数字功能，是 2012 年国家地理探险队使用的几种相机之一。


    1996 年，我带领了珠玛峰 IMAX 电影探险队，并在山上指导了拍摄工作。我第一次目睹了拥挤现象的早期阶段，以及登山者普遍缺乏经验和采取人多势众策略的问题。在向导探险的黄金时代，那个季节有
    12 支登山队挑战了那座山。5 月初，一场猛烈且快速移动的风暴导致 8 名登山者遇，引起了世界的关注。媒体和新闻对珠玛峰发生的事情描述得越有戏剧性——丈夫对妻子的最后遗言、一位医生因冻伤失去了双双手、一次危险的高海拔直升机救援——这座山就变得越吸引人，它在公众和登山者心中的价值也随之上升。


    此后，在我做的每一次公开讲座中，总会有观众问：“那场悲剧改变人们登山的方式了吗？”答案是：`并不真的`。


    ### 珠玛峰的未来如何？每年，登山者、客户和向导的支持系统都会不断改进，团队领袖之间的合作与沟通也将加强。一些向导服务将提高成功率，提高运营效率，并增加对客户优缺点的熟悉程度。但许多并不会。


    传统媒体和社交媒体将继续在全球范围内传播珠玛峰的图像和个人经历。除了通常的客户和向导群体外，山坡上还将挤满募捐、清理和企业挑战探险队，但实现重大“首创”的前景愈发渺小。


    ### 会达到突破点吗？2012 年 5 月在`洛子峰壁`拍摄的一张照片显示，156 人从海拔 23,000 英特的`三营`出发，前往海拔 25,900 英特的`南柱`，他们并肩排成一排向上涌动。这座山及其热门路线能承受这些人数吗？登山者和客户会开始远离这种让他们陷入“康加舞队列”的体验吗？我认识一些登山者在黎明前的黑暗中登顶了，尽管他们在山顶看到的视野非常模糊。为什么？他们晚上晚上
    8 点就离开了高海拔营地以避开人群。


    我经常思考自己在日益增加的登顶追求者中所扮演的角色。我们一些珍视这坐山的人为了收入和教育利益传播了知识，无意中已成为它最主要的推销员。`John Noel`上尉是
    1922 年和 1924 年珠玛峰远征队的成员，他拍摄了两次旅程的电影，并八次横跨北美大陆为座无虚席的观众放映电影。70 多年后，38 个国家的 3000
    万人看了《珠峰》，这是一部根据我团队在 1996 年灾难性风暴前后拍摄的制作的 IMAX 电影。


    珠玛峰一直吸引着纯粹者、梦想家和奖杯猎人。大多数人是这三者的混合体，每位登山者都为这坐山带来了广泛的能力和素质。如果他们的野心没有经验相匹配，危险将会增加，许多人认为自己不需要采取必要的步骤来准备这座山及其无情的时刻。公众很少询问你是如何到达顶峰的，只关注成就。登山者也往往只关注奖项和荣誉，而忽视了到达那里所需的巨大支持系统，以及夏尔巴人的辛勤工作和专业知识。当登山者不参与决策制定时，他们就不再是自己命运的主人，也放弃了与这座山、其天气和危险的亲密联系。


    ## 声音


    ### **在珠玛峰维持生命**


    尽管全球气候变化改变着高喜马拉雅山，珠玛峰登山的未来仍不明朗，但可以放心，珠玛峰将像过去一样，继续吸引全世界的观众。


    丰富珠玛峰的体验需要观察这座山的社会环境，并意识到，像过去一样，夏尔巴人将是未来任何努力的决定性因素。最值得注意的是，作为珠玛峰南麓曾经的农业居民，夏尔巴人不再仅仅是珠玛峰宏伟景观中的搬运工。在珠玛峰商业导游增加的十年里，我们看到夏尔巴登山者在探险队外国登山者的安全管理中承担了至关重要且紧迫的角色。


    通过在职培训以及`尼泊尔登山协会`和`昆布攀登中心`等机构，我们正在见证知识向热情且有能力的夏尔巴及其他尼泊尔族裔登山者的转化和专业引导技能的赋予。夏尔巴人从
    20 世纪初起就表现出在高喜马拉雅山登山极具适应性的生理构造。现在，他们将凭借卓越的登山、引导和组织能力主导这一领域。这种转变不会一夜发生，但最近在某些探险中已经注意到，夏尔巴向导负责登山路线的所有技术工程工作，这项任务曾被交给带领探险队的受过良好培训的西方登山者。


    还有可持续性以及将这座山推为环境敏感性和野外环境最佳实践的国际象征的紧迫目标。夏尔巴人也将推动这些变化，并获得发达国家访问者的巨大支持——但当地人口需要承担起冠军管理人的角色。管理`大营`的居住、组织废弃材料清理以及确保物理环境处于接受状况是关键目标。然而，更广泛地说，通往珠峰大营的夏尔巴核心地区村庄的情况也需要得到解决。森林砍伐、对缓慢再生燃料的过度依赖、为了增加旅游而对某些市进行的过度建设、饮用水管理以及一系列类似问题，面临着珠玛峰预期的任何未来。


    尽管未提及，但珠峰地区、当地人民和访客登山者必须面对的政治和社会挑战是复杂的。由于远在`加德满`的中央政府由于其特有的地不了解珠峰当地人面临的问题，新的权力和资源需要委托并由夏尔巴人自己或对这些威胁其社区、生计和其迷人社会结构的环境和社会挑战非常熟悉的尼泊尔人委员会来管理。尽管问题很大、解决方案模糊，但夏尔巴人代代相传，展示了顽强的适应能力和热情且具有企业家精神，并辅以深厚的同情心和力量。他们是世界上伟大的生存者之一。


    无法预知未来等待着什么只需说，珠玛峰有潜力再次不仅是登山事业不可或缺的一部分，而且是农村社区光明发展和地球上最伟大山峰之一管理的典范。准备好惊喜、受启发、挫折、甚至怀疑——只要不感到无聊就好！


    **—PETER ATHANS** 被称为“珠峰先生”，皮特·阿丹斯是北面的一名登山运动员，曾七次登顶珠峰。他与他的妻子`Liesl Clark`以及两个孩子每年部分时间住在`昆布`。


