    对低氧水平的其他反应还包括肺部血管收缩，这会升高肺部和心脏右侧的压力。这种效应几乎是时发生的，但可能会随着时间的推移和海拔的增加而继续上升。虽然肺部高血压在长期可能会产生负面影响，但在短期内，它可以将血液重新分配到肺部的更多区域，增加气体交换的总表面积，使氧气进入血液并将二氧化碳排出到肺部。


    ### 长期适应


    随着高海拔“压力”的持续，人体许多对氧敏感的基因、蛋白质和细胞会调节身体的适应方式。其中一种蛋白质（称为`hypoxia inducible factor
    1 alpha`，或 `HIF-1 a`）的刺激会引发全身的一系列连锁反应，包括刺激一种控制红细胞产生的激素（促红细胞生成素，`erythropoietin`）。这增加了血液的载氧能力。


    ![](img/Anke_9781426212413_epub_055_r1.jpg)


    在通往大营的途中，图克拉（Thukla）山口处立着石碑或佛塔（chortens），纪念在珠穆玛峰去世的登山者和夏尔巴人。这些纪念碑满了经幡，像是一个清醒的提醒：并不是每个人都能从大山上回来。


    其他长期变化还包括肾脏排泄碳酸氢盐的能力增强，它可以缓冲血液 pH 值的波动。这种关键的适应降低了血液的 pH 值，允许呼吸在海拔地区的几周内逐渐增加到越来越高的水平。此外，肌肉中载氧蛋白肌红蛋白（`myoglobin`，血红蛋白的亲戚）也有所增加。毛细血管（分支血管）与肌肉纤维的比例可能会增加，并提高向肌肉供氧的能力。（肌肉由许多较小的纤维组成。）许多登山者在极端海拔会经历快速体重和肌肉流失。（在毛细血管数量不变的情况下肌肉萎缩，可能解释了毛细血管纤维比例的增加。）


    ### 声音


    #### 珠峰之过夜


    我想我是自作自受。我是我自己的野心、弱点、寒冷、海拔……的受害者。我为在傍晚时继续前行付出了代价。下午的某些时刻，我以为我正面临着最恐惧的 ing——冲向世界之顶却发现自己已经没有余力下山了。在南峰陡峭的山坡上进行了一次疯狂、盲目的滑行后，我在一种狂野、喘息、像离开水的鱼般的恐慌中瘫倒了，在雪里挖了一个洞，只是坐在那里剧烈地颤抖，感到非常可怜自己。


    但那是一个危险的足点，我知道我必须控制局面，不再做一个受害者。黄昏时分，我向下爬到了山脊上较平缓的部分。随着黑暗笼罩大山，我打开了头灯，努力回忆 10 小前上山时路过的那些半记忆半忘的岩石。（由于不知道正确的正常路线，我们爬的是一条更陡峭、更直接的线路，在“阳台”（The
    Balcony）上方某处进入了东南凸脊。）最后，我决定等黎明比较安全。于是，我开始了漫长的颤抖。


    起初，我坐在一块石头上。石头暖一些——我知道这一点。但这块石头是倾斜的，我渴望——不，是我们渴望——我那想象中的年长同伴和我——平躺下来。而且我也知道，双腿水平伸直对循环有利。于是我们站起来开始挖；但我们太累了、太虚弱了、太渴望躺下了，在雪里只挖出一个五英尺长的平台，就弯着膝盖面对康卓宗峰（Kangshung
    Face）坐了下来。


    到那时，天至少已经黑了一个小时，在曙光到来前我还有七小时的“囚禁”。我后来算出海拔大约在海平面以上 8,550 米。五月份的夜间温度：零下 30 到 40
    度摄氏度之间。生存机会有多大？嗯，其实并不糟。下午的暴雪已经平息，空气很宁静……


    尽管我从未计划或想过在珠峰上露营，但这种严酷的可能性一直潜伏在那里，未曾说出口。我仔细考虑了我的每一层衣服。现在我小心地用备用手套垫臀部和头部——在我的骨头和阴冷渗透的寒意之间增加额外的隔热。我把把长冰镐插进雪里，像栅栏桩一样防止我在夜里翻滚。


    有一种说法，如果你在这些情况下睡着了就永远醒不来……我想在某一个时刻我确实睡了一会儿，但我并没有死。尽管大多数时间里我处于一种半意识的 limbo 状态，漂浮在半理性的联想迷雾中……偶尔，我的理性意识会把我惊醒并驱散幻影。我强迫自己吃了几块心心杏仁巧克力棒——里面一定有热量。我吸了水瓶里最后一点半冻结的液体。我想过摘掉冰爪和靴子按摩一下木化的脚趾，但决定风险太大了——最好专注于照顾我的手。我一直颤抖着。但这感觉并不比我在
    14,000 英尺下方最糟糕的高山冬夜露营更糟：我被海拔麻醉了。无论如何，我不再是一个受害者：我只是在耐心地等待黎明。


    —史芬·维纳布斯。1988 年，登山者、作家和励志演讲家史芬·维纳布斯成为未使用辅助氧气登顶珠穆玛峰的英国人。


    ### 多高持续多久？


    高海拔暴露的真正极限是什么？许多人将冲顶珠峰的过程称为“适应”，而另一些人则认为身体变得更擅长“忍受”极端环境。这就是为什么在历史上，很少有长期社区能在极端海拔生存。事实上，全球范围内没有海拔高于
    17,000 英尺的永久定居点。（作为对比，珠峰大营位于 17,500 英尺。）大多数即使接近该高度的社区都是围绕工业建立的（矿业镇、铁路社区或天文台），并与海拔相关的持续问题作斗争。最高的永久矿区社区是秘鲁南部的里纳达（La
    Rinada），海拔在 4,900 至 5,200 米之间。西藏的一些村庄位于类似的海拔，但大多数定居点在 15,000 英尺以下，这似乎是维持健康和繁殖的阈值。即使是夏尔巴村庄也低于
    15,000 英尺（即 4,600 米）（丁波切海拔 4,400 米，菲里奇海拔 4,240 米。）


    住在世界上最高高原地区的西藏人和安第斯人为人类如何适应极端海拔提供了一个有趣的对比。尽管我们不知道这两个群体在高海拔生活了多久，但共识是西藏人先定居高原社区，因此在自然选择和适应高海拔方面他们有更大的机会。这两个族群都适应了它们的环境，并且在静息时的能量消耗看起来相对正常，即使在
    4,000 米的高度，运动能力也相当充足。这与大多数住在海平的健康成人形成了鲜明对比，在这些海拔下，运动能力会下降 20% 到 30%。'
