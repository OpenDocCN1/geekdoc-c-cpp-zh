  trans: '


    20 世纪 90 年代末——1999 年 5 月 1 日——美国登山者康拉德·安克（Conrad Anker）在山上高处发现了一具尸体，身上穿着旧式的衣服。他大震惊了，意识到自己发现的是桑迪·欧尔文（Sandy
    Irvine）。当其他团队成员到达时，他们在其中一件衬衫的领子上发现了一个名字标签：`G. MALLORY`。他们深信这就是欧尔文，队友杰克·诺顿（Jake
    Norton）评论道：“这太奇怪了。为什么欧尔文会穿着马洛里的衬衫？”安克发现的是乔治·马洛里（George Mallory）的遗体。


    次年，斯洛文尼亚滑雪员达沃·卡尼卡尔（Davo Karnicar）完成了该山的首次滑雪下降，从山顶到大营花费不到五小时。


    夏尔巴人巴布·奇里（Babu Chiri）在仅用 16 小时内冲上常规路线，开启了新千禧。作为一名十次登顶珠穆玛峰的老兵，他曾于 1999 年在山顶露营一晚（计划内，且未使用辅助氧气），一年后，他在外出拍照时不慎掉入西冰川二营（`Camp
    II`）的一处冰裂缝去世。


    法国单雪板运动员马可·西弗雷迪（Marco Siffredi）于次年在该山西侧完成了首次成功的单雪板下降。一年后，他在尝试滑雪`霍恩斯坦因冰槽`（`Hornbein
    Couloir`）时牺牲。


    ![](img/Anke_9781426212413_epub_048_r1.jpg)


    珠穆玛峰正吸引着各种冒险运动，包括从山顶出发的双人滑翔伞。飞行员巴布·苏努瓦（Babu Sunuwar）和拉帕·切尔辛格·夏尔巴（Lakpa Tshering
    Sherpa）仅用 42 分钟就下了山，降落在南池姆扎（`Namche Bazar`）。


    同年，埃里克·魏森迈尔（Erik Weihenmayer）成为第一位登上这座山的盲人，回击了那些质疑者。尽管有些人可能认为这是一种“杂技”，但他为全世界数以万计的残障人士带来了希望。


    三年后，一支俄罗斯登山队在北坡`日本冰槽`（`Japanese Couloir`）左侧开辟了一条线路，在此过程中铺设了 3000 多米的绳子，在他们登顶离开后，大部分绳子仍留在山上。


    # 珠穆玛峰的影响


    对大多数人来说，攀登珠穆玛峰仍然是一个改变人生的经历。无论是向导客户还是开拓探险者，许多登山者都看到自己的人生故事受到了珠穆玛峰的巨大影响。埃德·希拉里（Ed
    Hillary）坚信没有人的生活像丹增·诺尔盖（Tenzing Norgay）登顶后那样发生如此剧的变化。事实上，名声、政治手段和姿态羞辱了他：“珠穆玛峰并不重要。只有政治重要。我感到羞耻。”他在珠穆玛峰的胜利对丹增来说变成了一个沉重的负担，丹增晚年生活如一个悲剧性的孤独形象。


    ![](img/Anke_9781426212413_epub_049_r1.jpg)


    老旧、沉重的铝架背包僵硬地固定在背部，使攀登变得更加费力。今天的登山者知道“北面之”（`The North Face`）轻便且不可摧的背包的舒适性，其内置框架设计允许更大的活动自由和更大的存储空间。


    ![](img/Anke_9781426212413_epub_050_r1.jpg)


    胜利的埃德蒙·希拉里（EDMUND HILLARY，右侧）、丹增·诺尔盖（Tenzing Norgay，居中）以及英国军官、1953 年珠穆玛峰成功探险领队约翰·亨特（John
    Hunt）抵达伦敦希思罗机场。


    登顶五年后，汤姆·霍恩贝因（Tom Hornbein）在山顶时的怀疑开始变得有些意义：“梦想是开始，怀疑仅仅是创造力的催化剂，”他说，“我的生活依然充满了冒险和随之而来的不确定性。与其分享这些经历的人是珍贵的。”许多这些珍贵的关系是因为珠穆玛峰而来到霍恩贝因身边的。


    莱因霍·梅纳（Reinhold Messner）珍视他的两次珠穆玛峰之行：与彼得·哈贝勒（Peter Habeler）一起首次无氧登顶，以及在`北壁`的孤独单攀。但他对珠穆玛峰后续发展的愤怒最终盖过了这些感受。他愤怒地嘲笑道，到
    2012 年，珠穆玛峰已变成“迪士尼”。转而转向更小的山峰。“当我还是孩子时候，从小山开始，”他说，“现在随着我年龄增长，小山变得越来越大。如果我幸运，有一天我会在一个小山上结束。”


    冬季的珠穆玛峰是克尔日斯托夫·维尔洛基（Krzysztof Wielicki）的首次喜马拉雅之旅。这不是他的最后一次。和梅纳一样，他攀登了所有 14 座 8000
    米高峰。但对维尔洛基来说，珠穆玛峰仍然是他最好的记忆，不是因为它最高，而是因为那种氛围、团队努力以及安德烈杰·扎瓦达（Andrzej Zawada）的强力领导。对于维尔洛基来说，珠穆玛峰与那个帮助塑造他最高海拔冬季攀登梦想的人建立了深厚且有意义的友谊。


    珠穆玛峰是艾莉森·哈格里夫（Alison Hargreaves）返回前的最后一座喜马拉雅山峰。仅仅三个月后，她在登顶后从`K2`山坡被风吹落。对她死亡的反应同样剧烈，许多人指责她——作为一个母亲——冒了如此大的风险。这个在珠穆玛峰顶第一句话是给儿女的女人，因为没有像爱自己的野心那样爱他们而遭受诋蔑。


    友谊、羞耻、愤怒、名声、喜。尽管登顶珠穆玛峰后的后果迥异，但对于这些登山者中的每一个人，这座山都赋予了一种独特的、崇高的到达世界之巅的感觉。


    传奇俄罗斯登山者安纳托利·布克里夫（Anatoli Boukreev）表达了这种狂喜：“山不是我实现野心的竞技场，它们是我修行宗教的教堂……我像人们去朝拜一样去那里。在山上，我的视野变得清晰。在每一次旅程中，我获得新生。”


    # ![](img/Anke_9781426212413_epub_051_r1.jpg)


    ![](img/Anke_9781426212413_epub_052_r1.jpg)


    为什么科学家要将数百公斤的设备背在牦牛和挑夫背上，在珠穆玛峰建立实验室？珠穆玛峰的极端环境会对人体产生极端反应。更好地了解人体在这些条件下如何调节，可以带来更好的治疗——以及更好的装备。当登山者在测试身体极限时，科学家对人体的适应极限感兴趣——简而言之，他们这样做。为了应对海拔挑战，学习身体如何适应极端缺氧（hypoxia），并发现当身体不适应时会发生什么，我们梅奥医学中心有机会与《国家地理》和“北面”合作，以前所未有的观察人们在攀登珠穆玛峰时身体发生了什么变化。


