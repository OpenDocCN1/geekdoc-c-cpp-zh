    In 1953, Edmund Hillary and Tenzing Norgay became the first climbers known to
    reach Everest’s summit. Soon after, Hillary founded the `Himalayan Trust` to build
    schools and hospitals. In 1956, schoolchildren learned their letters using crude
    wooden pencils and red sand. Today, the foundation’s Western influences—from paper
    and pens to dress—can be seen.


    The Sherpas who immigrated to Darjiling effectively left their barely subsistent,
    pastoralist Khumbu relatives behind. They were on a fast track to a mercantile
    and monetized realm that the foreign climbers—the `sahibs`—commanded. For decades
    in the middle of the last century—1920` to `1980`—the upwardly mobile Darjiling
    Sherpas moved comfortably between the old and new worlds. Their Khumbu relatives
    treated them politely but chafed at what appeared to be favoritism toward the
    Darjiling Sherpas. (Since then the Khumbu Sherpas have more than caught up, socioeconomically,
    though a mild rift continues to this day.)


    Changes in Sherpa culture accelerated in the early 1960s. During the `1963 American
    Mount Everest Expedition` in particular, Sherpas and Americans alike experienced
    a mutual loss of innocence. The Americans were nonplussed by the generosity and
    good humor of the Sherpas, and by how their lifestyle flowed in harmony with their
    environment. The Sherpas were equally amazed by the exotic Westerners with their
    profligate spending habits and command of technology. East meets West in the shadow
    of Everest.


    In a milestone that went unnoticed at the time, Jimmy Roberts and a Sherpa named
    `Nima Tenzing` inherited the lightweight expedition gear from the `1963` expedition.
    The next year, Roberts registered a company called `Mountain Travel`—inventing
    a whole new industry for Nepal and the Sherpas called “trekking.” The concept
    wasn’t well understood at first, but within a decade more than `10,000` people
    had come to “trek” in the Himalaya. Many more have followed, and Sherpas have
    adapted to a new livelihood based on guiding, feeding, and lodging them. The Sherpas
    have gone on to open hundreds of such trekking companies, and many more hundreds
    of lodges. Now at least `25,000` foreigners trek through Khumbu each year, and
    the approach route to Everest offers reliable satellite TV, cell phone coverage,
    and eight-page restaurant menus.


    ## ROMANTICIZING THE SHERPAS


    Academic studies of the Sherpas abound. When `''63 American Everester `Jim Lester`
    returned to Nepal in `1998`, his guide told him, “When you were here `35` years
    ago, every climber had his own Sherpa. Now every Sherpa has his own anthropologist.”
    Some have studied the relationship between Sherpas and Westerners, which is charged
    with fascination, envy, and romantic notions. Visitors to Khumbu often describe
    their trek or climb as life-changing, and their local hosts form a key element
    of that experience. Sherpas have gamely followed the natural progression from
    noble savage to renaissance men and women, traversing a staggering cultural arc
    in less than two generations.


    In the broader ethnic and social hierarchy of Nepal, Sherpas were regarded (until
    recently) as second-class citizens. Contact with Westerners and income from trekking
    presented them with refreshing opportunities to move upward and outward, and many
    have effectively leapfrogged over the socioeconomic structure that defines the
    rest of Nepal. Remarkably, this tiny ethnic minority has become famous amid a
    score of much larger ethnic groups.


    ## RISKY BUSINESS


    Historian Audrey Salkeld stresses that Sherpas have paid a disproportionately
    high price in lives lost on Everest. In `1922`, seven Sherpa porters were buried
    under an avalanche on Everest’s North Col, and in `1974` six were swept away by
    an avalanche in the `Western Cwm`. In the first `70` years of Everest climbing,
    `53` Nepali and Indian Sherpas were killed—more than a third of the total climbing
    deaths in that period. Because of their contribution to route fixing and ferrying
    supplies, especially in the `Khumbu Icefall`, Sherpas are exposed to riskier parts
    of the mountain than their employers. Now expeditions are required to carry a
    `$4,000` life insurance policy for every Sherpa who enters the icefall.


    If a Sherpa dies on Everest, the body is brought to a low ridge near `15,000`
    feet called `Chukpo Lare` (“rich man’s yak corral”) for cremation. Most expedition
    Sherpas have relatives who were cremated or memorialized here, and they always
    stop to recite a prayer for their benefit.


    “Climbing is exciting but dangerous,” a young Sherpa named `Lhakpa` says. “It’s
    best left to young, single men. We don’t gain much spiritual merit when climbing,
    unless we act selflessly in some way, or save someone’s life.” Like many, `Lhakpa`
    plans to build a lodge and invest in the “bigness”—business—end of trekking.


    ## VOICES


    ### PRESERVING CULTURE BY MANAGING PARKS


    I have seen a lot of changes in Nepal since when I was young. We had a traditional
    way of living that was simple. The forest was intact. There was no disturbance
    from outsiders. But when Hillary climbed Everest in `1953`, everything changed.
    The flood of tourists has put pressure on the local population, which is only
    about `3,500` Sherpa. And the pressure is not only environmental, but also cultural.
    That’s why I chose to study park management.


    Linking culture and environment together is a strong message. To preserve culture
    and environment it is important to create systems that benefit both. I think the
    best way to do that is to make sure that local people feel and have ownership
    for their resources.


    ### MANY MORE VISITORS


    Between `1966` and `1970`, the number of tourists quadrupled to `46,000`, and
    by `1976` it had passed `100,000`. Since `1997`, annual tourist arrivals have
    averaged well above `400,000`. Over 50 percent of these visitors go to protected
    areas.


    Tourism in Khumbu, the Everest region, has had a wide variety of impacts. With
    the closure of the northern border, the Sherpas’ centuries-old trade with Tibet
    has been replaced by tourism and international climbing expeditions as a source
    of cash income. Tourism has created new jobs and opportunities; it has boosted
    the living standard of local communities with better health care, education, and
    infrastructure.


    On the negative side, tourism has shared much blame for accelerating environmental
    problems in the mountains. Garbage produced by trekking and mountaineering in
    the Everest region poses a significant environmental problem, and has become highly
    publicized. This is more than an aesthetic issue, as environmental pollution is
    also involved—not least with the indiscriminate dumping of old batteries, and
    nonbiodable wastes.


    ### PARKS PROTECT THE CULTURE


    We have nine national parks, and eight of them are managed by the army. In `Makalu-Barun
    National Park` we did the opposite—we only hired staff from the community. Since
    they are from there, they have so much knowledge about the area. And we found
    that we could put a stop to poaching if we recruited poachers’ sons and daughters
    into the Scout program. Suddenly, everyone has a stake in the park that they want
    to protect.


    With `The Mountain Institute (TMI)` our goal with local communities is to provide
    the example of what can be done. We ask communities to list their needs in a community
    consultation: school support, infrastructure, et cetera. Then we help them see
    that to gain something you have to work and explore your options. All we need
    to do is guide them. Then they will feel empowered to act in the future.


    I developed a concept in `2003` called the `Sacred Sites Trail`. Instead of having
    all the tourists simply travel in a straight line from `Namche` to `Tengboche`
    and back again as it said in their 15-year-old `Lonely Planet` guide, I wanted
    all the communities to have a chance to benefit from tourism. We need to think
    through every aspect of the project in order to make it successful.

