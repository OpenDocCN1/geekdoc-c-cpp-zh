    To weather the special challenges—many of them financial—that go with life in
    America, a group of expatriate Sherpas bought and renovated a church in Queens.
    It houses a social welfare organization called the Sherpa Kyidug and provides
    a gathering place (online and in Queens) and cultural tent pole for American Sherpas.
    (Kyidug is said to be a combination of `kyi`, happiness, and `dug`, suffering—referring
    to weddings and funerals, the milestone events that mark the principal times the
    American Sherpas are drawn together.) Still, some of the elders and middle-aged
    talk of returning to Khumbu to retire—rather than die in a foreign land.


    ## TRADING PLACES


    Ching Drolma is a Namche Bazar innkeeper with an animated smile. Like many middle-aged
    Sherpa women, she was a part-time farmer and yak herder and now works day and
    night tending to trekkers’ needs. As she pounds away on a slab of male water buffalo
    meat with a wooden mallet—tenderizing it into shape to become a “yak” steak—she
    pauses. A gleeful smile creeps onto her face.


    “I have an idea,” she announces buoyantly. “All of you Americans seem to like
    our mountains and our houses and culture. Why don’t you all come here and live
    in our houses—and we’ll all move to America and live in your houses?”


    ![](OEBPS/images/Anke_9781426212413_epub_023_r1.jpg)


    SHERPAS AT BASE Camp are all smiles as they watch a movie after a day spent working
    to support the climbers. Sherpas summit the mountain in higher numbers than other
    climbers, and they are also more likely to have multiple summits.


    This has been suggested before, but the line is always good for a laugh. This
    time, though, she is serious. She is sharing a recognition that we are all part
    of a global community, with few insurmountable boundaries. She is also underscoring
    how we all tend to idealize the world in which the other lives.


    ## VOICES: GIFTS FROM A GODDESS


    Standing at the `lhap-so`, our makeshift Buddhist shrine at Everest Base Camp,
    I thanked Miyolangsangma, the goddess who lives here, for welcoming me into her
    home. Then I headed upward through the icefall to meet the members of our expedition
    at Camp II. Bounding across ladders over deep crevasses, I noticed ice screws
    loosening in the late May sun. On Everest, sunshine is a blessing and a curse.
    The sun’s warmth is welcome, but it causes the ice to melt. Large seracs crumble,
    overhangs avalanche, and pinnacles topple.


    We had spent almost eight weeks waiting for the summit window, the longest delay
    I had ever experienced. Climbers had lost weight and muscle strength, and they
    spoke increasingly of changing weather patterns and global warming. Perhaps Miyolangsangma,
    weary of playing the perennial hostess, needed a rest.


    For Sherpas, Miyolangsangma is the traditional supplier of food and wealth. But
    by allowing us to climb Everest, she has provided us with more than this. She
    has given our people education, medicine, and opportunities to work, and she has
    opened our eyes to a world beyond our valley. Without her blessings and without
    mountaineering expeditions, we would have remained isolated in our Khumbu villages
    with little means of improving our future.


    ## A FICKLE GODDESS


    At Camp II, I heard the summit weather forecast for the coming days: 50 mph winds,
    snow, and a windchill factor of 20 degrees below zero. It would require another
    two days of climbing for our expedition members to be in place for a summit attempt
    and, given the weather predictions, it did not look favorable. Miyolangsangma,
    however, often changes her mind.


    Two days later we climbed to the South Col, Camp IV, the last stop before the
    summit. The team members rested fitfully in tents blown nearly flat by a freezing
    wind, while I peered out at clouds that broke like ocean waves across the peaks
    below us. It would be a cruel and unforgiving night—the worst I had seen high
    on the mountain. A few hours after sunset, the wind calmed—slightly—and my team,
    along with other expeditions’ climbers, departed Camp IV for the summit.


    I prayed to Miyolangsangma for guidance and could hear the oxygen mask-muffled
    chants of Dawa, a former monk, also requesting permission to continue. In 1990,
    when I first climbed Everest with veteran climbers Rob Hall, Gary Ball, and Peter
    Hillary, Miyolangsangma welcomed me into her lap. Her invitation, however, is
    temporary.


    Sitting on the Balcony, the responsibility of making the decision to continue
    up, or to turn around, weighed heavily on me. Yangji had urged me to come on this
    expedition with our friend John, to “keep him safe.” Now I was caught by indecision—by
    a feeling that Miyolangsangma might be withdrawing her invitation.


    As if sensing my dilemma, John gently reached a hand over to me and said, “Apa,
    are you okay? Are you warm enough?” The wind carried his words away, but I could
    see in his eyes that he was feeling strong, ready to push on. We would continue
    to the South Summit and, if conditions didn’t improve, we would turn around.


    Two hours above the Balcony, an amber dawn revealed the triangular shadow of Everest
    stretching to the western horizon—Miyolangsangma’s welcome mat. It was now clear
    that we were invited guests and not interlopers.


    John, Dawa, and I ascended the exposed slope to the South Summit, where we again
    switched oxygen bottles. We scrambled up the Hillary Step, traversed the final
    snowy humps, and, at 6:35 a.m. on May 31, John, Dawa, and I stood on the summit.
    I thanked Miyolangma for her hospitality once. Then the three of us began the
    journey to our families: safe return.


    —APA SHERPA Assisting Western expeditions since 1985, Apa Sherpa made his first
    of 21 summits of Everest in 1990.


    ![](OEBPS/images/Anke_9781426212413_epub_024_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_025_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_026_r1.jpg)


    AN ENDANGERED SNOW leopard triggers a camera trap. With only a few left in the
    wild, these nocturnal cats are a rare sight in the Everest region, but their numbers
    are increasing thanks to intelligent park management.


    On a beautiful, clear morning in 2012, I headed through a forest high above the
    Imja `khola` (river) in Sagarmatha National Park. Rarely used by trekking groups
    or visitors, it was a trail I discovered years ago while living in this region.
    I was spending a year conducting the fieldwork for my Ph.D. in geography. Once
    a week for ten months I would trek the 30-mile round-trip from our home in Khumjung
    village (at an altitude of 13,025 feet/3,970 meters) to the seasonal alpine village
    of Dingboche (at 14,500 feet/4,420 meters). As I monitored my soil-erosion plots,
    I had the unparalleled opportunity to study the landscapes, landforms, plants,
    and animals along the way.


    ## LANDSCAPE TODAY


    The trail contours along steep, north-facing slopes that are blanketed by a thick
    cloud forest of Himalayan fir, silver birch, and numerous tree and dwarf rhododendrons.
    `Lali guras`, the lavish bloodred flower of `Rhododendron arboreum` and national
    flower of Nepal, was in full bloom. Old-man’s beard lichens draped the limbs,
    catching moisture from the early morning mists that were beginning to lift. On
    either side of the trail bloomed purple and yellow primroses and blue star-shaped
    gentians. These pioneers of spring foretold the arrival of the many hundreds of
    flowers to come.

