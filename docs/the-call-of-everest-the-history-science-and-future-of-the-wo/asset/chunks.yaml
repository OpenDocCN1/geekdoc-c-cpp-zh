    Existence on a mountain is simple. Seldom in life does it come any simpler: survival,
    plus the striving toward a summit. The goal is solidly, three-dimensionally there—you
    can see it, touch it, stand upon it—the way to reach it well defined, the energy
    of all directed toward its achievement. It is this simplicity that strips the
    veneer off civilization and makes that which is meaningful easier to come by—the
    pleasure of deep companionship, moments of uninhibited humour, the tasting of
    hardship, sorrow, beauty, joy. But it is this very simplicity that may prevent
    finding answers to the questions I had asked as we approached the mountain …


    It had been a wonderful dream, but now all that lingered was the memory. The dream
    was ended.


    Everest must join the realities of my existence, commonplace and otherwise. The
    goal, unattainable, had been attained. Or had it? The questions, many of them,
    remained. And the answers? It is strange how when a dream is fulfilled there is
    little left but doubt.


    **—THOMAS HORNBEIN** Tom Hornbein, a member of the 1963 American team, scaled
    the difficult West Ridge with Willi Unsoeld. This passage comes from his book
    *Everest: The West Ridge*, published in 1965 and reissued in a 50th-anniversary
    edition in 2013 by The Mountaineers Books.


    ## WITHOUT OXYGEN


    Rumor has it that when Italian alpinist Reinhold Messner and an Austrian, Peter
    Habeler, were flying home in 1975 after climbing Pakistan’s Gasherbrum I (26,469
    feet/8,068 meters) without supplemental oxygen, they toasted their success with
    a gin and tonic and declared, “To Everest—without oxygen!” Three years later,
    they trained hard in order to climb quickly and efficiently on Everest, spending
    as little time as possible above 8,000 meters. Although Habeler expressed misgivings
    about dispensing with the `O[2]` while on the actual climb, Messner remained adamant.
    To save their breath, they scratched messages to each other in the snow rather
    than talk. At one point, Habeler’s etched arrow pointed down. Messner’s pointed
    up. Messner recalled the Herculean effort later in his *Expedition to the Ultimate:*
    “I am nothing more than a single, narrow, gasping lung, floating over the mists
    and the summits.” Habeler was terrifyingly near the end of his limit when they
    reached the top: “It was a very personal, lonely victory in a struggle which each
    of us fought alone … In spite of my euphoria, I was physically completely finished.”


    Many believed their brains would be fried by the lack of oxygen, but they appeared
    quite lucid upon their descent. The Sherpas at Base Camp were astonished that
    they had done it. In fact, a strange situation arose in Kathmandu following the
    climb when a group of Sherpas called a press conference to denounce Messner as
    a liar. They didn’t believe his claim to have climbed without oxygen, asserting
    that he had hidden tiny bottles of oxygen under his down jacket. If they couldn’t
    do it, nobody could.


    That same year, Wanda Rutkiewicz, Poland’s first lady of climbing—and role model
    for the entire community of female Himalayan climbers—became the first European
    woman and the first Polish mountaineer to climb Everest. This beautiful, charismatic,
    and eagerly ambitious alpinist hated almost every moment of the climb due to some
    nasty interactions with her fellow climbers, something she attributed to male
    chauvinism. But her triumphant summit moment made up for the hardship, and her
    historic ascent coincided with Pope John Paul II’s ordination day, Poland’s greatest
    moment in the history of the Catholic Church.


    A year later another Eastern bloc victory occurred: A strong Yugoslavian team
    led by Tone Skarja, the Chris Bonington of Yugoslavia, made a breakthrough on
    Everest when it climbed the entire West Ridge Direct. Never varying from the actual
    ridge, the team climbed overhanging rock above 8,000 meters—the hardest technical
    climbing on Everest to this point. Andrej Štremfelj and Nejc Zaplotnik finished
    the historic route and descended by the Hornbein Couloir. Their climb signaled
    the emergence of Yugoslavia (and later Slovenia) as a Himalayan powerhouse.


    ## EVEREST IN WINTER


    From time to time, a visionary turns his attention to Everest. In the winter of
    1979–80, that visionary was Andrzej Zawada, Poland’s most charismatic expedition
    leader. Zawada had already established himself as a high-altitude winter specialist
    in the Hindu Kush as well as nearly ascending Lhotse in winter. Yet no 8,000-meter
    peak had yet been climbed in winter, and Zawada set his sights on Everest. With
    welding goggles to protect their eyes and homemade equipment to protect against
    the crippling cold and the screaming winds, his team had still not placed a climber
    on the summit when its permit was scheduled to run out in mid-February. Then Zawada
    managed to negotiate two more days, and two of the youngest, Krzysztof Wielicki
    and Leszek Cichy, reached the top on February 17\. All of Poland rejoiced.


    ![](OEBPS/images/Anke_9781426212413_epub_044_r1.jpg)


    **ITALIAN REINHOLD MESSNER,** one of the world’s greatest mountaineers, solo climbed
    to Everest’s summit in August 1980 without using supplemental oxygen or a radio.
    He collapsed in his tent after the feat, utterly spent. Messner is the first person
    to climb all 14 of the world’s 8,000-meter peaks.


    One of Poland’s finest climbers, Jerzy Kukuczka, had missed the expedition because
    he had stayed home for the birth of his first son. Luckily, the insatiable Zawada
    had negotiated not one but two permits for Everest, and the second took place
    in the spring of 1980\. Not content to repeat an earlier route, he plotted a new
    line on the South Face. High on the mountain, above 8,000 meters, a formidable
    rock band tested the very best: Jerzy Kukuczka and Andrzej Czok. Kukuczka recalled:
    “To climb this at that altitude took so much out of me that at one stage the effort
    made me simply wet my pants.”


    ### VOICES REASON FOR DANGER


    The most important thing to know is that mountaineering involves risk. If we go
    to the mountains and forget that there is risk, we make mistakes. Mountains are
    dangerous! But they are only dangerous if people are there. A mountain is a mountain.
    It only exists. It is a piece of rock and ice, a beautiful piece maybe, but it
    only becomes dangerous and beautiful if we are there …


    Danger is a filter that stops people from going where, perhaps, they should not
    go. Danger has to do with managing fear, gaining experience, and learning hard-won
    lessons. Without making our own decisions, without accepting personal responsibility
    for our own actions, we cannot learn to achieve big things.


    **—REINHOLD MESSNER** The first person, with Peter Habeler, to summit Everest
    without supplementary oxygen, Reinhold Messner was also the first to climb all
    of the planet’s 14 8,000-meter peaks.


    ## ACHIEVING THE IMPOSSIBLE


    Reinhold Messner chose a spell of calm weather following the monsoon of 1980 to
    launch himself onto the North Face—alone. But the weather wasn’t the only reason
    he opted for this particular time. In a casual conversation with Himalayan chronicler
    Elizabeth Hawley back in Kathmandu, he had learned that Japanese climber Uemura
    had plans for a solo climb of Everest. Messner advanced his schedule to ensure
    he would be there first.

