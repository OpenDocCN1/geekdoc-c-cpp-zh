    within the lungs, which raises the pressure levels in the lungs and on the right
    side of the heart. This effect can be almost immediate, but the level may continue
    to rise over time and with higher altitudes. Although high blood pressure in the
    lungs can have negative consequences over a long period of time, in the short
    term it may redistribute blood to more regions of the lungs, increasing the total
    surface area for the transfer of gases and moving oxygen into the bloodstream
    and carbon dioxide out to the lungs.


    ### **LONGER-TERM ADAPTATION**


    As the “stress” of high altitude continues, the body’s many low-oxygen-sensing
    genes, proteins, and cells regulate how the body adapts. The stimulation of one
    of these proteins (called hypoxia inducible factor 1 alpha, or HIF-1 a) sets off
    a cascade of changes throughout the body, including the stimulation of a hormone
    (erythropoietin) that controls red blood cell production. This then increases
    the blood’s carrying capacity of oxygen.


    ![](OEBPS/images/Anke_9781426212413_epub_055_r1.jpg)


    **STONE MONUMENTS, OR** chortens, at the mountain pass of Thukla on the way to
    Base Camp honor climbers and Sherpas who have died on Everest. Covered in prayer
    flags, the memorials stand as a sobering reminder that not everyone makes it back
    from the mountain.


    Other longer-term changes include the increased ability of the kidneys to excrete
    bicarbonate, which buffers against swings of pH levels in the blood. This critical
    adaptation lowers the pH level of the blood and allows the gradual ramping up
    of breathing to higher and higher levels over several weeks at altitude. In addition,
    there is an increase in oxygen-carrying proteins in muscle called myoglobin—a
    relative of hemoglobin. The ratio of capillaries (branching blood vessels) to
    muscle fibers may increase and improve ability to supply oxygen to muscle. (Muscles
    are made up of many smaller fibers.) Many climbers experience a rapid loss of
    weight and muscle at extreme altitude. (The melting away of muscle without a change
    in the number of capillaries may explain the increased capillary-to-fiber ratios.)


