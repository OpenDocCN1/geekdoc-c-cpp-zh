    随着这些变化而来的还有积极的影响。收入的增加也带来了了健康状况的改善。缺碘导致的肿大在 20 世纪 70 年代初随处可见，但现在已几乎完全消失。夏尔帕人儿童接受了更好的教育，现在有了许多夏尔帕博士、医生、牙医、自然保护主义者和政府工作人员。大多数村庄都通过小型水电站获得了用电，并辅以太阳能驱动的热水器、灯和电池充电器等替代技术。这些设备在没有电的更偏远的高山村庄中特别受欢迎，例如菲里切（Pheriche）、丁波切（Dingboche）和楚贡（Chukung）。丁波切甚至有了太阳能网络接入。高山地区的客栈在
    2004 年改用煤油作为燃料燃料，这导致了脆弱的高山生态系统的迅速恢复（该项目由国家地理学会于 2005 年和 2007 年共同资助）。得益于埃德蒙德·希拉里爵士和喜马拉雅信会，该地区有了学校、诊所和跑道——这是希拉里感谢夏尔帕人帮助他实现了“我所认为最有意义的成就”的方式。


    但积极影响也伴随着消面影响。由于没有分区制度，客栈的数量每个季节都在增加。每年，客栈主以吨为单位进口罐装和瓶装货物。这些容器最终出现在每个村庄外的填埋场，因为那里没有回收系统，也没有采取其他做法的动力。仅珠穆玛大营每年就产生五吨固体废物。人类粪便和污水直接排入附近的淡水溪流，污染了下游数千名居民的用水。徒步者越来越多地抱怨，在昆布河谷上部的大营徒步径途中感染了肠道疾病，这可能是由于污水处理不当造成的。挑夫们使用大型蓝色塑料桶将数吨的人类粪便运到距离大营南面约两小时路程的地方。在那里，粪便被倾入大坑中，其中一些坑位于季节性河床内。


    # 声音：观察昆布地区的变化


    我叫夏尔帕·江布布（Sherap Jangbu）。我于 1954 年出生在南姆次巴（Namche Bazar），那是通往珠穆玛峰（Chomolungma）的大门。那是在尼泊尔的丹青·诺尔盖·夏尔帕（Tenzing
    Norgay Sherpa）和新西兰的埃德蒙德·希拉里爵士首次登顶珠穆玛峰整整一年后。


    我 58 岁了，已婚，妻子美丽的拉帕·多玛（Lhakpa Doma）。我们有一个大儿子和一个女儿，而且很幸运有两个孙子：一个是来自儿子明玛（Mingma）的塞尔青·旺秋楚（Tsering
    Wongchu），另一个是来自女儿丽塔（Rita）的塞尔青·帕尔乔尔（Tsering Paljor）。


    南姆次巴是昆布地区主要的贸易点。所有去珠穆玛峰远征、在该地区徒步或前往西藏进行贸易的人都会经过南姆次巴，因为建议你先在这里留宿两个晚上以适应海拔。在南姆次巴，我们有从豪华酒店到客栈的一切设施，以满足各种游客的需求。


    据我记忆，我第一次看到“米克卡鲁”（Mik Karu，我们对白人或外国人的昵称）是 1963 年，那是美国首次成功攀登珠穆玛峰的日期。我的叔叔尤拉·塞尔青（Yula
    Tsering）就在那个队伍中。


    那时，只有少数探险队来到珠穆玛峰，完成一次探险至少需要四到五个月，或者徒步至少需要两个月，因为他们必须从加德满步行到珠穆玛峰再回来。1964 年，埃德蒙德·希拉里爵士在卢克拉（Lukla）建立了一个小型机场。这缩短了徒步和探险的时间，因此从
    70 年代开始，游客流量增加了。


    **夏尔帕·江布布·夏尔帕（SHERAP JANGBU SHERPA）** 昆布地区的终身居民，他负责组织并带领贯穿于整个珠穆玛峰地区的徒步活动。


    ![](img/Anke_9781426212413_epub_035_r1.jpg)


    尼泊尔乔拉山口（Cho La）的山顶，经幡营造了一道彩虹色。在前往珠穆玛峰的路上，这座海拔 17,780 英尺（5,420 米）的山口提供了喜马拉雅山的壮丽景色。


    # 珠穆玛峰景观的未来


    这座世界最高峰在积极和负面变化的交织下，未来将何如何？随着新一代富有的探险游客寻求通往山上的新且更原始路径，卡玛谷的旅游可能会增加，他们会避开昆布珠穆玛峰大营途中日益拥挤的徒步游客、牦牛、牦和挑夫。山的北侧确实可能像中国官员威胁的那样关闭，给脆弱的景观一个愈合的机会，并给技术人员时间清理几十年来积累的垃圾、帐篷、氧气瓶，以及遗憾的尸体。


    昆布河谷的命运更为复杂。它在很大程度上取决于未来的全球经济、尼泊尔的政治稳定，以及夏尔帕社区对当前变化过程所做的决策。石油禁运、燃料和旅行价格，以及衰退和萧条显然会导致游客人数的起伏。一些户外杂志建议读者尽早去尼泊尔，因为政治动荡可能再次导致该国长期对外国人关闭边界。


    但抛开世界经济和国家政治不谈，考虑到日益拥挤和不安全的健康状况，昆布还能作为一个令人向往的地方存在多久？村庄和沿途的固体和人类废物沉积是否会达到一个让人变得不愿光光的程度？


    简单的答案是？不太可能。正如许多人所说，“世界上只有一个珠穆玛峰”，这一事实可能会吸引后代的登山者、徒步者、科学家、电影制作人、神秘主义者、学者、教师、发展专家以及寻求刺激者。夏尔帕人自己面临着前所未有的问题。随着越来越多的人搬往加德满或纽约，他们传统的流失也伴随着人数的减少。但如果夏尔帕人一个世纪展示了一个什么特质，那就是他们的适应能力，在机会出现时识别它们，并解决看似不可逾越的问题。


    那么这山本身呢？它也展现了非凡的适应能力。珠穆玛峰经历了人类扩张、冰期和间冰期的席卷、动植物在山坡上的缓慢迁移，以及过去 60 年来农民、牧民以及探险游客对它的发现。珠穆玛峰将继续在云雾中屹立，时间远超人类的记忆。


    # ![](img/Anke_9781426212413_epub_036_r1.jpg)


    ![](img/Anke_9781426212413_epub_037_r1.jpg)


    ![](img/Anke_9781426212413_epub_038_r1.jpg)


    **巴里·毕肖普（BARRY BISHOP）** 在 1963 年登顶休息时，周围只有空气，那是他和另外三位美国人成为该国首批登顶者的年份。


    当丹青·诺尔盖（Tenzing Norgay）爬上希拉里台阶时，埃德蒙德·希拉里描述他“像一条大鱼”，他们都知道自己即将登上地球最高峰。当他们在那个历史性的一天（1953
    年 5 月 29 日）在顶拥抱时，他们的名字与珠穆玛峰永远联系了一起。


    十年后，当威尔·温索德（Willi Unsoeld）和托马斯·霍恩贝因（Thomas Hornbein）爬过一条以他命名的冰槽到达珠穆玛峰顶时，霍恩贝因思考了这一切的意义：“真是很奇怪，当一个梦想实现时，只剩下怀疑。”


