    但这些技术也应用于更日常的场景，例如治疗充血性心衰竭、睡眠障碍、肺部疾病或其他疾病的医院和诊所，这些疾病与登山者在高海拔地区经历的缺氧（即缺乏氧）相似。


    ## 高海拔挑战


    高海拔究竟是什么对身体构成了挑战？


    17 世纪，在意大利物理学家伽利略的工作之后，物理学家埃万杰利斯塔·托里里切利（Evangelista Torricelli，1608–1647）确定我们上方的空气是有重量的。大约同一时期，物理学家罗伯特·波义（Robert
    Boyle，1627–1691）等人发现，空气重量（或气压）决定了我们肺部及随后血液中的氧气含量。这解释了在高海拔生存的挑战：气压驱动氧气进入血液，而登山者感受到的痛苦源于气压的严重缺乏。


    在探索海拔如何影响身体之前，我们必须首先了解身体在地球表面如何处理和利用氧气。我们将氧气吸入肺部，从那里氧气进入血液，运输到需要氧气运行的身体器官。血红蛋白是红细胞中的一种金属蛋白，负责在全身运输氧气。流经身体的血液返回肺部以吸入新鲜的含氧空气，这意味着平均而言，肺部的氧气量大于动脉中的氧气量。


    氧饱和度值（衡量血液中氧气含量的指标）通常在 95%到 100%之间。在海平面上，很难憋气足够长的时间以导致这些数值大幅下降。当数值下降到 85%到 88%以下时（这在慢性肺病患者中经常发生），通常需要使用便携式或家庭氧气来维持正常的生活质量。


    在地球表面几乎任何地方，大气中的氧含量保持稳定在 21%。事实上，从海平面到地球大气层边缘（地面上方 62 英里，或 100 公里），空气中的氧气水平几乎保持不变。改变的是气压，它随着海拔的增加而按比例下降。珠穆朗山大本营的气压约为海平面的一半；在山顶，则仅为海平的三分之一。换句话说，在高海拔吸入每口空气所含的氧气都比海平面少。因此，肺部和血液中的氧气水平随着大气压的下降而平行下降。10,000
    英尺（3,000 米，大多数珠穆朗山登山队的起点上方）的正常氧饱和水平在 88%到 90%之间。在睡眠期间，由于呼吸变慢，这些水平可能会下降到 84%以下——低于许多肺病患者使用辅助氧的节点。


    在高海拔登山时，肺部和动脉之间氧水平的平衡尤为重要。体力活动增加了红细胞通过肺部的速度，从而缩短了血液在肺部补充氧气的时间。运动和高海拔的结合对身体产生了双重压力，爬得越高，压力就越大。（我应该在此指出，任何个体适应高海拔的能力会有巨大差异，取决于多种因素，包括遗传、整体健康和居住海拔，以及水分水平等许多情境因素。）


    ## 高山之舞


    身体能够应对中度的海拔变化。例如，得益于血红蛋白的独特特性，在 8,000 到 10,000 英尺（2,500 到 3,000 米）的高度范围内，气压的变化只会轻微降低体内的氧饱和度。但在更高的高度，缺氧可能会导致严重的——甚至是致命的后果。如果没有适应过程带来的益处——换句话说，如果一个人从海平面快速移动到极端海拔，大多数（如果不是所有）人在
    15,000 英尺以上就会生病。他们在 18,000 英尺处可能只能保持 20 到 30 分钟意识，在珠穆朗山顶只能维持 1 到 2 分钟。


    ![](img/Anke_9781426212413_epub_054_r1.jpg)


    **英国登山者斯特芬**韦纳布斯（STEPHEN Venables）在 1988 年无氧攀登珠穆朗山东坡（沟面后，体重减轻了 20 磅。长时间在高海拔会导致体重迅速减轻，其中包括肌肉流失。


    为了避免高山症最严重的影响，大多数计划登顶珠穆朗山的登山者会在山脉和健康之间进行为期六至八周的艰苦“舞蹈”。这种适应舞蹈包括逐渐上升到大本营，随后多次转到越来越高的高度，登山者缓慢地推高“缺氧压力”，希望刺激身体适应更高海拔。虽然身体变得越来越能适应极端海拔，但在珠穆朗山大本营及以上的高度停留过久，会导致肌肉功能退化和肌肉流失。因此，必须在适应高度和维持肌肉状态之间寻求平衡。一些登山者甚至会短时间回到较低的海拔，以恢复一些肌肉力量。适应方案主要是通过试错法开发的，利用了人体惊人的适应能力，特别是在较短的时间窗口内。


    ### 立即防御


    身体如何应对血液中氧水平降低和输送到组织的氧气量减少？输送到组织的氧气量是几个因素共同的结果：红细胞的数量（`血红蛋白水平`）、血红蛋白与氧气的结合程度（`动脉氧饱和度`）以及心脏输出（`心率`和`每次心搏输出量`）。


    氧水平下降的首要反应几乎立即发生。呼吸加快，增加了吸入空气的量。这提高了肺部及随后血液中的氧水平。心率也会上升，使更多血液进入身体，并增加向组织的氧输输。此外，人在到达高海拔后不久，尿量增加，部分液体可能会从血管内转移到血管外。这减少了血液中的水分，并使红细胞浓度增加。这反过来增加了单位体积血液运输的氧气量。然而，血液中液体减少会导致每次心搏输出量的下降。（这一过程的副作用是脱水，这会增加急性高山症（AMS）的可能性，其症状为头痛、恶心和疲劳。因此，在高海拔地区大量饮水至关重要。）


    红细胞中的血红蛋白分子根据许多因素产生不同的作用：例如`pH 值`、`二氧化碳水平`、`血液温度`。这些血红蛋白的特性对于身体适应高海拔的方式起着重要作用。例如，随着高海拔呼吸的增加，血液中的二氧化碳含量下降，到登山者到达珠穆朗山顶时，其含量可能仅为正常值的分之一。这导致血液变得偏碱性（使`pH
    值`升高），并改变了血红蛋白结合氧分子的能力。这使得高海拔的红细胞尽管肺部氧压较低，也能更好地吸引并结合氧气。同样的因素也会影响氧气向组织的释放。

