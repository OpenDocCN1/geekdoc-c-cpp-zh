    **THE 1963 AMERICAN** team, sponsored by the National Geographic Society, ascends
    Everest to Base Camp. The expedition was spearheaded by Swiss climber Norman Dyhrenfurth
    and included 19 Americans, 32 Sherpas, and 909 porters carrying 27 tons (25 metric
    tons) of gear. The team’s purpose was not only to reach the summit but to carry
    out scientific research in physiology, psychology, glaciology, and meteorology.


    ### **WHAT’S BEYOND?**


    A scant 16 years after Tenzing and Ed’s 1953 ascent, humans reached the moon.
    In July 1969 our family huddled around a flickering black-and-white television
    to watch it happen. Neil Armstrong and Buzz Aldrin walked on the moon. Yes, exploration
    was alive and well. In a span shorter than a generation, humans had gone from
    the top of our planet to the one celestial body that Earth casts its shadow upon,
    providing proof that we exist within a greater scope. The next morning, as my
    mother recalls, I rode my bicycle around with added vigor as I pretended to be
    an astronaut. Lunar exploration had supplanted terrestrial exploration.


    Still, Everest continued to offer a test of human limitations. In 1978, when Reinhold
    Messner and Peter Habeler climbed to the summit without the use of supplemental
    oxygen, unaided by life’s most essential element, humanity was again inspired
    by their accomplishment. In 1980, when Messner returned to climb it alone, again
    without added oxygen, he pushed the standard a notch higher. A decade later Everest
    transitioned from the cutting edge of alpine climbing to a mountain that, given
    the right amount of training and resources, became a goal attainable by the average
    person. The early expeditions were an extension of imperial power, starting with
    the three pioneering expeditions of 1921, 1922, and 1924\. As large national expeditions
    gave way to commercial guided climbs in the early 1990s, Everest became a mountain
    for the individual rather than the nation-state.


    ## **THE MALLORY MYSTERY**


    In 1999, I was invited to take part in the Mallory and Irvine research expedition
    to the north side of Everest. Seventy-five years earlier, on the last of the initial
    three English Everest expeditions, George Mallory and his young partner, Sandy
    Irvine, climbed within striking distance of the summit when they disappeared into
    the clouds. They failed to return. Could they have made it, on June 8, 1924, 29
    years before Hillary and Norgay? The question became one of the most debated in
    mountaineering history. We will never know whether they made the summit. The mystery
    remains, symbolic of Mallory’s pithy answer offered when asked why humans choose
    to climb Everest. His four words—“Because it is there”—probe into the fundamental
    question of what human existence means.


    My team set out to solve the mystery by finding a missing camera that may have
    documented a summit. Instead, on May 1, 1999, I discovered the frozen and preserved
    body of George Leigh Mallory at an elevation of 26,700 feet (8,140 meters) on
    the north side of Everest. In the half hour that I spent alone with his body,
    I felt connected to the expedition that long ago had set the stage for where I
    was that day. The drive to reach a summit and the planning that goes into one
    goal—a goal that offers only intrinsic rewards in the face of great risk—were
    the same motivations that drew me to the mountains. Though separated by 75 years,
    Mallory and I were partners in our life’s ambition.


    ### **MEETING MALLORY**


    Frozen to the slope, arms outstretched and legs crossed, Mallory died doing what
    he loved. His family paid the price for his ambition and obsession. The proximity
    to death, the slow dance one has with mortality at high altitudes, is painfully
    familiar to mountaineers. I was humbled by the moment and felt deep respect for
    the man on whose shoulders the current generation of climbers stood. But we still
    did not know if Mallory had summited Everest, for we did not find the camera.


    ![](OEBPS/images/Anke_9781426212413_epub_008_r1.jpg)


    In the 1963 American expedition led by Norman Dyhrenfurth, precarious logs served
    for the mountain’s death-defying chasm crossings; in 2012, National Geographic’s
    climbing team employed lightweight aluminum ladders, allowing for easy transport
    and safer passage. The ladders also served during tricky vertical ascents.


    Continuing the quest, on May 17, 1999, I set out to climb the Second Step without
    the aid of an aluminum ladder that had been installed by the 1975 Chinese expedition.
    The Second Step, a formidable 90-foot cliff at 28,230 feet on the Northeast Ridge,
    was the most challenging barrier to the summit. As far as we knew, no one had
    climbed it without using the ladder. Had Mallory and Irvine been able to reach
    the top in 1924, they would have had to overcome this challenge. If we could climb
    it under the same conditions that Mallory and Irvine had encountered, we hoped
    to unlock the mystery. I led the pitch and gave it a fair shot, but at the last
    moment I stepped on the ladder despite my effort not to.


    ### **HIGHS AND LOWS**


    I reached the summit in the late afternoon with my partner, Dave Hahn. A patch
    of snow forms the top of the world, and barely a thousand people had ever been
    there. Our celebration was brief. The weather was worsening, Dave was ill, and
    there were no other climbers on the route. We began our descent, feeling alone
    and desperately close to getting cut by the edge I had set out to find.


    In October of the same year, I survived an avalanche on another peak in the Himalaya,
    the Tibetan giant Shisha Pangma. But it took the lives of my two climbing partners,
    Alex Lowe and David Bridges. Alex had been my closest friend, and once again I
    saw the edge of existence. This time I felt the suffering that death brought to
    family and friends, and my own life changed dramatically. In the spring of 2001,
    I married Alex’s widow, Jennifer, and adopted his three young children, Max, Sam,
    and Isaac. I continued to climb but with a renewed sense of caution, and the welfare
    of others took a greater role in my own sense of purpose. With Jenni and the Alex
    Lowe Charitable Foundation that she created, I was able to give back to the mountain
    culture to which I felt indebted. In 2003, we launched the Khumbu Climbing Center
    to teach technical climbing skills and mountain safety to the Sherpas and indigenous
    people of the Himalaya. As I traveled to Nepal, winter after winter, to share
    my skills and love for climbing, the people of the Himalaya began to feel like
    my family.


