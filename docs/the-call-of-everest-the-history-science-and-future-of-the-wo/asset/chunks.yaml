    在山上的生存是简单的。生活中很少有比这更简单的时刻了：生存，加上对顶峰的追求。目标实实地、以三维的方式存在于那里——你可以看到它，触碰它，站在它上面——到达它的路径清晰明确，所有的能量都汇聚于它的实现。正是这种简单剥离了文明的虚装，让那些有意义的事物变得更容易获得——深层陪伴的快乐、无拘无忌的幽默时刻、对苦难、忧伤、美丽和喜悦的品味。但也正是这种简单，可能让我们在接近山顶时，无法为自己提出的问题找到答案……


    这是一场美妙的梦，但现在留下的只有记忆。梦已经结束了。


    珠穆峰必须成为我生存现实的一部分，无论平凡与否。那个不可触及的目标已经实现了。或者实现了吗？许多问题依然存在。而答案呢？很奇怪的是，当一个梦想实现时，剩下的几乎只剩下怀疑。


    **—托马斯·霍恩贝因** 托马斯·霍恩贝因（Tom Hornbein）是 1963 年美国登山队的成员，曾与威尔里·昂索尔德（Willi Unsoeld）一起攀登了艰难的西脊。这段文字出自他的《珠穆峰：西脊》（*Everest:
    The West Ridge*），由 Mountaineers Books 于 1965 年出版，2013 年重版周年版。


    ## 无氧


    传闻意大利登山者雷因霍德·梅斯纳（Reinhold Messner）和奥地利人彼特·哈贝尔尔（Peter Habeler）在 1975 年未使用辅助氧气的情况下登顶巴基斯坦的乔戈峰峰（26,469
    英尺/8,068 米）回家的途中，他们用杜士忌汽庆祝了自己的成功，并宣布：“为了珠穆峰——无氧！”三年后，他们刻苦训练，为了快速高效地攀登珠穆峰，尽可能缩短在海拔
    8000 米以上停留的时间。尽管哈贝尔尔对在攀登过程中放弃 `O[2]` 感到顾虑，但梅斯纳仍然坚定不移。为了节省呼吸，他们在雪地上互相刻字传递信息，而不是说话。有一次，哈贝尔尔刻的箭头指向下方，梅斯纳刻的指向向上。梅斯纳在后来的《终极远征》（*Expedition
    to the Ultimate*）中回忆起那艰巨的：“我只不过是一个狭窄的、喘息的肺，漂浮在云雾和山峰之上。”当他们到达顶部时，哈贝尔尔已经接近了他的极限，简直令人恐惧：“这是一次非常个人化、孤独的胜利，我们每个人都在独自战斗……尽管我内心欣喜若狂，但身体已经完全精疲力竭。”


    许多人认为他们大脑会因为缺氧而坏掉，但他们在下降时看起来非常清醒。大营的夏尔巴人对他们做到了这一点感到震惊。事实上，攀登结束后，加德满发生了一段奇怪的情况：一群夏尔巴人召开了发布会，指责梅斯纳是骗子。他们不相信他无氧登顶的说法，声称他在羽绒服下藏了小瓶氧气。如果他们做不到，就没人能做不到。


    同年，波兰登山之母——旺达·鲁特基维茨卡（Wanda Rutkiewicz）——也是整个喜马拉雅女性登山者的榜样，成为首位登顶珠穆峰的欧洲女性和首位波兰登山者。这位美丽、自信且野心勃勃的登山者由于与队友之间的某些不愉快，讨厌攀登过程中的每一个时刻，她此归咎于男性沙权主义。但她胜利的顶点时刻弥补了艰辛，她历史性的攀登恰逢教皇保禄二世的晋铎日，那是波兰在天主教历史上最伟大的时刻。


    一年后，另一个东欧阵营取得了胜利：由“南斯洛维亚的克里斯·邦宁顿”通·斯卡雅（Tone Skarja）领导的一支强大的南斯洛维亚团队在攀登整个西脊直线路时取得了突破。团队从未偏离实际山脊，在海拔
    8000 米以上的悬崖上攀爬——这是到目前为止珠穆峰上最难的技术攀登。安德烈·什特雷费尔日（Andrej Štremfelj）和内耶茨·扎普特尼克（Nejc
    Zaplotnik）完成了这条历史性路线，并从霍恩贝因冰槽下降。他们的攀登标志着南斯洛维亚（后来的斯洛文尼亚）作为喜马拉雅登山强国的崛起。


    ## 冬季的珠穆峰


    偶尔，一位远见者会将目光转向珠穆峰。在 1979-80 年冬季，那位远见者是安德烈杰·扎瓦达（Andrzej Zawada），波兰最有魅力的远征队队长。扎瓦达已经在昆仑库什山成为高海拔冬季专家，并几乎在冬季登顶过洛峰。然而，尚未没有任何
    8000 米级高峰在冬季被登顶，扎瓦达瞄准了珠穆峰。尽管有焊接护目镜保护眼睛，有自制设备抵御严寒和狂风，当许可证在 2 月中旬到期时，他的团队还没有将登山者送上顶。随后，扎瓦达成功争取到了额外的两天，最年轻的两人——克热什托夫·维尔利茨基（Krzysztof
    Wielicki）和莱谢克·齐希（Leszek Cichy）在 2 月 17 日到达了顶点。全波兰为之欢呼。


    ![](img/Anke_9781426212413_epub_044_r1.jpg)


    **意大利人雷因霍德·梅斯纳，** 世界最伟大的登山者之一，于 1980 年 8 月单人登顶珠穆峰，未使用辅助氧气或无线电。壮举之后，他在帐篷里倒下，精疲力竭。梅斯纳是第一个登顶世界上所有
    14 座 8000 米级高峰的人。


    波兰最优秀的登山者之一杰热齐·库库丘卡（Jerzy Kukuczka）因为留在家照顾长子的出生错过了这次远征。幸运的是，永不满足足的扎瓦达争取到了不是一张而是两张珠穆峰许可证，第二次登山发生在
    1980 年春天。他不满足于重复之前的路线，而是在南壁规划了一条新线。在山上海拔 8000 米以上，一处险峻的岩带考验着最顶尖的成员：杰热齐·库库丘卡和安德烈·乔克（Andrzej
    Czok）。库库丘卡回忆道：“在那个高度攀爬这里消耗了我太多的精力，以至于在某个阶段，这种努力让我直接尿了裤。”


    ### 危险的原因


    要知道的最重要的一点是，登山涉及风险。如果我们去山却忘记风险的存在，我们就会犯错。山是危险的！但只有当人在那里时，它才是危险的。山就是山。它只是存在。它是一块岩石和冰，也许是一块美丽的，但只有当我们在那里时，它才会变得危险而美丽……


    危险是一个过滤器，阻止人们去可能不该去的地方。危险与管理恐惧、获得经验和学习来贵的教训有关。如果不自己做决定，不对自己的行为承担责任，我们就无法学会成就大业。


    **—雷因霍德·梅斯纳** 与彼特·哈贝尔尔一起第一个无氧登顶珠穆峰的人，雷因霍德·梅斯纳也是第一个登顶地球所有 14 座 8000 米级高峰的人。


    ## 实现不可能


    雷因霍德·梅斯纳选择了 1980 年季风后的一段平静天气，独自进攻北壁。但天气并不是他选择这一特定时间的唯一原因。此前在加德满满与喜马拉雅事务记录者伊丽莎白·霍利（Elizabeth
    Hawley）的一次随性聊天中，他得知日本登山者上村有独自登顶珠穆峰的计划。梅斯纳提前了计划以确保抢先到达。


