    “I am 80 years old now, and I have experienced the impermanence of human life.
    All the most powerful and rich people in the world will die, just like everyone
    else, so live each day to better others. Through this, you will better yourself
    and find true fulfillment. All the people in the world should remember that they
    will be dead one day, tomorrow, next week, or in 50 years. Live for the day and
    live for a settled mind. Don’t waste days planning ahead when the days spent planning
    could be wasted days of doing.” —Lama Geshi


    The clarity of what Lama Geshi said rang lucid in my mind. With the access to
