    In 1951, Shipton was invited to lead another reconnaissance trip to the south
    side of Mount Everest. Accompanying a stellar group of Britons were several Kiwis,
    including Edmund Hillary. Almost immediately they were confronted with the dangerously
    unstable tangled mass of snow and ice known as the Khumbu Icefall. Shipton felt
    the way was too dangerous, but Hillary disagreed, saying, “I knew the only way
    to attempt this mountain was to modify the old standards of safety and justifiable
    risk and to meet the dangers as they came; to drive through regardless. Care and
    caution would never make a route through the Icefall.” They managed to cross the
    icefall to the Western Cwm, but a huge crevasse spanning the entire valley turned
    them back.


    Returning to Kathmandu, Shipton learned that the Swiss had secured a permit for
    the following year, meaning he would have to wait his turn. While the Swiss attempted
    Everest in 1952, Shipton had to be content with nearby Cho Oyu, which he and his
    team did not summit. The Swiss, meanwhile, very nearly reached the top of Everest.
    Raymond Lambert and Tenzing Norgay ascended the Southeast Ridge to within 800
    feet of the summit. Shipton set off for an exploratory visit of the Barun and
    Arun Valleys, rather than returning home to take charge for the attempt the next
    year, and that decision would prove to be his undoing.


    The Brits were determined more than ever to put someone on top in 1953. At headquarters,
    the committee fussed and fumed. They just *had* to get up this thing. What was
    wrong? After all these attempts, some key ingredient must be missing. Aha! It
    must be leadership. Perhaps a military man could organize the effort properly.
    They offered joint leadership to Shipton and Col. John Hunt, a man with limited
    high-altitude experience. Shipton resigned on the spot. It was clearly a slight—even
    an insult. But maybe the committee had a point. Charles Warren wrote that, despite
    his undying respect for Shipton, the decision was probably the right one. “I for
    one can understand why he was not eventually chosen to do so—the truth of the
    matter is that, by that time, his heart was not truly in it. Having discovered
    the route to the top by way of the South Col, he had really played his part, as
    the great explorer he was. For him it was the discovery that counted, not the
    conquest.”


    ## VOICES


    ### WHERE WAS MALLORY GOING?


    After George Mallory was killed on Everest, his sisters secretly questioned whether
    their parents had any idea “what George was,” whether they understood him and
    his wife Ruth at all. Now—when we have turned over every known word Mallory ever
    wrote, have retold his life story and reviewed his last climb endlessly, when
    we have probed even his sexuality—do we yet know what he was about? We remember
    him almost exclusively in mountaineering terms, but—compared to today’s career
    mountaineers—the time he actually spent climbing was episodic. That’s not to say
    he wasn’t brilliant on rock, nor that he didn’t derive intense spiritual sustenance
    from the hills and from the friendships he made among them. But you couldn’t say
    Mallory “lived for mountains” when there was so much else in his life. It might
    repay us to take one further look at his story, putting aside the conventional
    acceptance that his premature death on that emblematic peak was the culmination
    of a personal quest…


    ### A CHARMING MAN


    From the obituaries of Mallory, written by friends and others, you get a picture
    of a man with strong moral conscience, honesty, courage and a careless charm.
    Words most frequently employed by those who loved him were: sensitive, intelligent,
    chivalrous, impish and, as we would expect, fearless. Cottie Sanders rejoiced
    in his “appetite for beauty,” saying no one ever had a greater genius for appreciation.
    Another word that recurs is “introspective.” Geoffrey Young praised “his educational
    energy, his tenacious introspectiveness, that hunted to its source every interest
    but self-interest…” George was known affectionately as Sir Galahad; but was his
    Grail the highest mountain in the world, as it often seems, or was it a higher
    level of culture and understanding? We know that Ruth, who was a firm believer
    in an Afterlife, found it easier to reconcile her loss by believing that there
    was something better that he was ready for.


    In many ways, Mallory was a slow developer. Though the gifts were there almost
    from the start, it took time for him to harness them. And that’s what makes his
    death the more tragic: there is so much more we might have seen, had he lived.
    Frustratingly, it is still a hazy picture we have of what he planned through his
    work with the League of Nations Union or the Extra Mural Studies Board, and whether
    or not these two were interconnected. He passionately believed in the liberating
    effect of education, yet he may have gravitated towards politics—who knows? With
    his obvious charisma, even before the television era, we can imagine him reaching
    widening audiences via lecture halls and the radio. He could have been a candidate
    for popular programmes like *The Brains Trust*. It is impossible to envisage what
    impact he may have made throughout the thirties and the forties when he would
    have been at his career peak.


    ## HISTORY REMEMBER


    He himself, were he to look back at his abbreviated life, might fancy he had failed.
    Even his desire to be a writer had borne limited fruits in his lifetime, though
    now we have read almost every word he so prolifically got down in letters to family
    and friends—and we know he had the gift of communication that can leap generations.


    More mementoes continue to turn up… As I write this, another letter, written a
    few days before he left that last time, is up for sale on eBay. An Everest ice-axe
    emerged recently, with the provenance of assistance given by Mallory to the `Pinnacle
    Club` (a dedicated women’s club founded in 1921). Rumour hints at other intimate
    correspondences. Optimistically, I think we can expect to learn more.


    —Audrey Seld British author Audrey Salkeld has written numerous books and television
    scripts on mountaineering and exploration.


    ## TENZING AND HILLARY


    When the British team requested the services of Tenzing Norgay the following year,
    he was initially reluctant to go, so loyal was he to Lambert. But the Swiss climber
    urged him: “Take the chance. It doesn’t matter who it is with.” Charles Evans
    and Tom Bourdillon came close to succeeding in 1953, reaching the South Summit
    at 8750 meters, but their oxygen tanks were unreliable. The prize was left to
    the oddly matched couple: Edmund Hillary at six foot three and Sherpa Tenzing
    Norgay at five foot eight. They reached the top of Everest for the first time
    on May 29, 1953. What a team effort it was. The day before, George Lowe, Alf Gregory,
    and Ang Nyima carried more than 40 pounds each, cutting steps all the way to the
    last camp at around 8500 meters in support of Hillary and Tenzing. After dumping
    their loads, they left the two for their last night of preparation. At 6:30 the
    next morning, Hillary and Tenzing crawled out of their tent, hoisted their 30
    pounds of oxygen gear, connected their masks, and started up. Things went smoothly
    until they reached a formidable-looking obstacle—the `Hillary Step`, as it would
    later be called. Hillary led the way and Tenzing followed. From there they just
    had to continue up the ridge until there was no place left to climb.

