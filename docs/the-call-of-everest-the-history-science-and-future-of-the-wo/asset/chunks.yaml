    The Western climbing team is composed primarily of The North Face professional
    athletes. Besides Conrad, 49, there is Hilaree O’Neill, 39, ski mountaineer; Kris
    Erickson, 38, photographer and ski mountaineer; Cory Richards, 30, mountaineer
    and photographer; Sam Elias, 29, elite mixed ice climber; and Emily Harrington,
    25, a competition sport climber. Rounding out the team are National Outdoor Leadership
    School (NOLS) field manager Phil Henderson, 48; Montana State University geologist
    Dave Lageson, 61; and myself. Combining our experience, we’ve totaled over 200
    expeditions, but only Conrad has previously summited Everest.


    Conrad and Cory will attempt the West Ridge, the rest of us the South Col. Not
    surprisingly, merely climbing the mountain is insufficient for Conrad. Hence,
    as in the ’63 American expedition, we are also conducting geological and physiological
    research, as well as creating an elementary school science curriculum.


    The team, almost 30 members in all, comes together for the first time at Base
    Camp. Spread across the rock-strewn, ever shifting Khumbu Glacier, the 17,600-foot
    Everest Base Camp is probably the most famous, albeit ephemeral, town of its size
    in the world. The pre-monsoon population is perhaps 900 temporary inhabitants:
    some 300 clients and guides, a matching number of Sherpas, and another 300 Base
    Camp staff and porters, not to mention the constant flow of yak trains, their
    bells ever tinkling in the frigid air.


    ![](OEBPS/images/Anke_9781426212413_epub_063_r1.jpg)


    THE 2012 LEGACY Climb team at the beginning of the expedition


    ## BASE CAMP CITY


    Just like every town, Everest Base Camp has neighborhoods. Our camp lies in the
    southern burbs, near the huge Himalayan Experience outfitters camp. Himex, as
    it is commonly called, boasts the highest, tackiest nightclub on Earth—the Tiger
    Dome—a massive, hard-skeleton geodesic bubble with a 30-foot tiger rug spread
    over a flexible dance floor, big speakers, fake tiger fur draping lounge chairs,
    and a free-flowing bar. We will burn a few brain cells in the Tiger Dome—Conrad
    and Emily swinging like monkeys from the ceiling, Hilaree and friends diving in
    tandem off the bar into the crowd—before crawling back to our tents in the wee
    hours.


    On the main street going into town is the International Mountain Guides borough
    to the left, and Mountain Experience to the right. Farther along is the ever busy
    helipad, a circular patch of rocks, and the large white tent of Everest ER, the
    medical center, founded ten years ago by Dr. Luann Freer. Downtown can be found
    Mountain Guides, the Korean University, Happy Feet, the Indian Military and two
    dozen other expeditions of unknown provenance. Each hood looks fairly similar,
    with a long, rectangular mess tent surrounded by 10 or 20 orange or yellow dome
    tents and a couple vertical blue or green outhouses. Prayer flags flap like community
    banners from the stone chortens of each neighborhood.


    Despite the bad press over the years, Everest Base Camp is a fairly tidy place.
    The SPCC—Sagarmatha Pollution Control Committee—is the Base Camp’s city council,
    and they make the rules. Tent outhouses are fitted with plastic barrels and all
    human waste is transported down to the village of Gorak Shep. Unlike at higher
    camps, here at Base Camp every team is required to pack out what they pack in.


    Daily life in BC City is surprisingly civil and leisurely. You can get the Internet,
    iPhone reception, and the occasional cook whips up a birthday cake. As at summer
    camp, the staff provides meals so the climbers can rest, recover, listen to music,
    take pictures, send e-mails, write blogs, prattle on the phone, or just stare,
    mouths agape, at the avalanches roaring off the surrounding flanks of Pumori and
    Nuptse. We even have afternoon tea, a classic sahib tradition.


    The majority of the inhabitants here are not hard-core climbers. They’re clients
    with the dream of climbing Everest. Many of them have been successful in another
    walk of life—business, medicine, technology—and, knowing full well how long it
    took them to gain their own skills, are happily paying for the expertise of a
    guide. It’s easy to mock these aspirants, but there will always be people with
    the cash to climb Everest, and as Whittaker noted, they could be blowing their
    bucks on more dubious pursuits. Instead, these neophytes are willing to risk their
    lives passing through the jaws of Khumbu Icefall, suffer the smashing headaches
    and projectile vomiting and weeks of intense fatigue, just to stand on top of
    the world. That doesn’t make them mountaineers, but it does speak to their conviction.


    The first few days at Base Camp are spent acclimating, and many Westerners either
    get the “Khumbu crud” or spend a lot of energy doing all they can to avoid it.
    The sometimes squalid teahouses along the week-long hike to Base Camp can be petri
    dishes for disease, and few escape some form of gastritis. If you don’t get the
    crud, you’re almost certain to get the “Khumbu cough,” an irritation of the bronchial
    tubes caused by the extremely dry air. A hacking cough is the ubiquitous symptom,
    and soon everyone is wearing buffs over their faces like bank robbers.


    ## FACING THE GLACIER


    The first obstacle on the south side of Everest is the infamous icefall. The Khumbu
    Glacier, like a gargantuan bulldozer, plows down off the Lhotse Face between Everest
    and Nuptse, pushing walls of blue ice before it. Dropping over a cliff just above
    Base Camp, this mile-wide glacier splits apart, shattering into building-size
    blocks and seracs as tall as church spires.


    Every year the route through the icefall is set by the “ice doctors,” a small
    hit squad of Sherpas who take mortal risks to navigate the safest passage, putting
    up ropes in the steep sections and stretching ladders across the abyss-like crevasses.
    Nothing more than a massive, moving river of ice, the Khumbu Icefall is constantly
    shifting, groaning, and collapsing, and if you happen to be there at the wrong
    time, you will be swallowed in a crevasse or crushed by a falling serac. Three
    Sherpas died in a single accident in the Khumbu several years ago. This spring
    a line of prayer flags demarcates the beginning and end of the most perilous section.


    According to actuarial research, more deaths on Everest occur coming off the summit
    than wending through the icefall. Nonetheless, passing through the maw of the
    Khumbu is a morbid game of Russian roulette, so we try to do it in the dark, before
    the sun warms the ice and it begins calving. We leave Base Camp at 2 a.m., following
    the beams of our headlamps on our helmets like miners. On my first trip I’m paired
    with Danuru. When we reach the first line of prayer flags, the starting gate to
    the death zone, he allows me to catch my breath, then says, “Now we go!” and takes
    off running uphill, literally, carrying a 60-pound pack at 18,000 feet, his crampons
    scraping on the boulders of blue ice.

