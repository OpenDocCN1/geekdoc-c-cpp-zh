    Near the end of the 1990s—on May 1, 1999—American climber Conrad Anker discovered
    a body high on the mountain, clad in old-fashioned clothing. Stunned, he realized
    he had found Sandy Irvine. When the other team members arrived, they discovered
    a name tag sewn to the collar of one of the shirts: `G. MALLORY`. So convinced
    were they that this was Irvine that teammate Jake Norton commented, “That’s weird.
    Why would Irvine be wearing Mallory’s shirt?” Anker had found the body of George
    Mallory.


    The following year, Slovenian skier Davo Karnicar made the first ski descent of
    the mountain, taking less than five hours from the summit to Base Camp.


    Sherpa Babu Chiri rang in the new millennium when he raced up the normal route
    in just 16 hours. A ten-time veteran of Everest’s summit, including one night’s
    bivouac (planned, and without supplemental oxygen) on the summit in 1999, Babu
    Chiri died a year later when he fell into a crevasse at `Camp II` in the Western
    Cwm while out on an innocent jaunt to take photographs.


    French snowboarder Marco Siffredi made the first successful snowboard descent,
    on the Tibetan side of the mountain the following year. He was killed one year
    later while trying to snowboard the `Hornbein Couloir`.


    ![](OEBPS/images/Anke_9781426212413_epub_048_r1.jpg)


    EVEREST BECKONS FOR all kinds of adventure sports, including tandem paragliding
    from the summit. Babu Sunuwar, pilot, and Lakpa Tshering Sherpa descended in just
    42 minutes, landing in `Namche Bazar`.


    The same year, Erik Weihenmayer defied his naysayers when he became the first
    blind man to climb the mountain. Despite what some might classify a “stunt,” he
    brought hope to disabled people numbering in the tens of thousands around the
    world.


    Three years later, a Russian team sieged a line to the left of the `Japanese Couloir`
    on the North Side, fixing more than 3,000 meters of rope in the process, most
    of which remained on the mountain after they summited and left.


    # THE IMPACT OF EVEREST


    Climbing Everest remains for most a life-changing experience. Whether they are
    guided clients or trailblazing explorers, many climbers have seen their life stories
    dramatically affected by Everest. Ed Hillary was convinced that nobody’s life
    had changed as dramatically as that of Tenzing Norgay’s after his ascent of the
    mountain. In truth, the fame and politicking and posturing humiliated him: “Everest
    did not matter. Only politics mattered. And I was ashamed.” His Everest triumph
    became an albatross for Tenzing, who spent his later years as a tragically lonely
    figure.


    ![](OEBPS/images/Anke_9781426212413_epub_049_r1.jpg)


    Older, heavier, aluminum-frame packs fastened rigidly to the back, making climbs
    more effort-intensive. Today’s mountain climbers know the comfort of `The North
    Face`’s lightweight, indestructible backpacks, built with an internal frame that
    allows more freedom of movement and more storage space.


    ![](OEBPS/images/Anke_9781426212413_epub_050_r1.jpg)


    TRIUMPHANT EDMUND HILLARY (at right), Tenzing Norgay (center), and John Hunt,
    a British army officer and the leader of the successful 1953 Mount Everest expedition,
    arrive at London’s Heathrow Airport.


    Fifty years after his climb, the doubts that Tom Hornbein felt on the summit began
    to make some sense: “Dreams are the beginning, and doubt simply a catalyst to
    creativity,” he said. “My life is still rich with adventure and its attendant
    uncertainties. Precious are those people with whom I share it.” Many of those
    precious relationships came to Hornbein because of Everest.


    Reinhold Messner treasured his two Everest climbs: the first supplemental-oxygen-free
    ascent with Peter Habeler and the lonely solo of the `North Face`. But his anger
    over the subsequent developments on Everest eventually overshadowed these feelings.
    He scoffed with anger that Everest, by 2012, had become a “Disneyland.” Instead
    he turned to smaller peaks. “When I was a small child, I began on small mountains,”
    he said. “Now, as I am getting older, the small peaks are getting bigger. If I
    am lucky, some day I will end on a small peak.”


    Everest in winter was Krzysztof Wielicki’s first Himalayan climb. It wasn’t his
    last. Like Messner, he climbed all 14 of the 8,000-meter peaks. But for Wielicki,
    Everest remained his best memory, not because it was highest, but because of the
    atmosphere, the team effort, and the strong leadership from Andrzej Zawada. For
    Wielicki, Everest cemented a deep and meaningful friendship with the man who helped
    shape his dreams of winter climbing on the highest mountains.


    Everest was Alison Hargreaves’s last Himalayan peak from which she would return.
    Just three months later, she was blown off the slopes of `K2` after summiting.
    Almost as violent as her death was the reaction to it, as many vilified her—a
    mother—for risking so much. The woman whose first words on the top of Everest
    were for her son and daughter was maligned for not loving them as much as her
    own ambition.


    Friendship, shame, anger, fame, joy. Despite the disparity in the aftermath of
    their Everest ascents, for each of these climbers the mountain gave a unique,
    exalted feeling of reaching the top of the world.


    Legendary Russian climber Anatoli Boukreev expresses that rapture well: “Mountains
    are not Stadiums where I satisfy my ambition to achieve, they are the cathedrals
    where I practice my religion … I go to them as humans go to worship. From their
    lofty summits I view my past, dream of the future and, with an unusual acuity,
    am allowed to experience the present moment … my vision cleared, my strength renewed.
    In the mountains I celebrate creation. On each journey I am reborn.”


    # ![](OEBPS/images/Anke_9781426212413_epub_051_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_052_r1.jpg)


    Why does a scientist transport hundreds of pounds of equipment on the backs of
    yaks and porters to set up a research laboratory on Mount Everest? While climbers
    may seek to test the limits of their bodies, scientists are intrigued by the adaptive
    limits of the human body—in short, by how the climber does it. Humans are capable
    of a remarkable degree of plasticity, and Everest may be the greatest physiological
    challenge that exists on our planet, with the severe reduction in available oxygen,
    the cold, dry conditions, sleepless nights, prolonged time needed for acclimation,
    and the extreme exertion such a climb requires. To address the challenges of high
    altitude, to learn how the body adapts to extreme hypoxia (lack of oxygen), and
    to find out what happens when the body doesn’t adapt, we at Mayo Clinic took the
    opportunity to partner with National Geographic and `The North Face` to observe
    and measure as never before what happens in people’s bodies when they climb Everest.


    ![](OEBPS/images/Anke_9781426212413_epub_053_r1.jpg)


    EVEREST’S EXTREME ENVIRONMENT can cause extreme responses in the human body. Better
    understanding of how our bodies adjust under these conditions leads to better
    treatment—and better equipment.


    ## MEDICAL RESEARCH ON EVEREST


    Mount Everest has an ongoing rich tradition of medical research. In any given
    season, several groups may perform field studies to explore how the body responds
    to the extreme conditions. The The adventuresome scientist finds this type of
    work intriguing, but it also has practical applications in other areas of medicine.
    For example, knowledge gained on Everest can be used to assist medical personnel
    during the deployment of troops or workers to cold, high, and dry environments
    or equally extreme conditions. At the U.S. South Pole Station, for example, up
    to 700 workers are rapidly exposed to high-altitude conditions each year. Others
    serve in oil-industry postings in extreme northern latitudes or work in the numerous
    observatories located at high altitudes. And of course there’s the general outdoor
    sports/tourist industry.

