    # ![](OEBPS/images/Anke_9781426212413_epub_073_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_074_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_075_r1.jpg)


    **ICY PRAYER FLAGS** wave in the breeze at Base Camp. As climbers and trekkers
    from all over the globe come and go, this international village is ever changing—and
    becoming increasingly populated.


    In the spring of 2012 I spent a month at Mount Everest Base Camp for a GlacierWorks
    photographic project. I arrived in early April, just as the expeditions were establishing
    the camps for the climbers, clients, and guides who would soon follow. I wandered
    slowly up the rock-strewn glacier ice, pausing frequently to stare at the hundreds
    of brightly colored tents clustered tightly along the meandering trail. Most were
    small personal tents, but many were large dining, cooking, and communication tents.
    Generators purred in the distance, yak bells tinkled from the transport caravans,
    and a multitude of languages buzzed from the expedition camps. Thousands of prayer
    flags fluttered in the breeze. National flags from myriad nations rippled in the
    wind, too. It was an international village at the foot of the Khumbu Icefall.
    Hundreds of climbers would shortly be residing here, all with the same goal and
    each for a different reason. Yet Base Camp bore no resemblance to the one I visited
    29 years earlier in the spring of 1983.


    ![](OEBPS/images/Anke_9781426212413_epub_076_r1.jpg)


    **AMERICANS PETER JAMIESON** and Gerry Roach (at right) celebrate their 1983 ascent
    of Everest. They were part of filmmaker David Breashears’s team when he transmitted
    the first live images from the peak. The scene at the summit was a different one
    from today: There were no visible mementos left behind by previous climbers, no
    jostling for space with larger climbing groups. “It appeared as if no one had
    been there before us,” Breashears said.


    ## **THE AGE OF INNOCENCE**


    That year we were a small American climbing team with an essential Sherpa support
    team. Our small encampment, nestled up under the icefall, was hard to find. We
    had no contact with the outside world other than the sporadic delivery of mail
    by runner from Lukla, 40 miles down the trail. We were the only team on the Nepali
    side of the peak. The mountain was ours and it was wonderful. We shared its slopes
    with only our teammates. The mountain and its challenges felt intimate and authentic,
    and at the same time so immense and grand.'
