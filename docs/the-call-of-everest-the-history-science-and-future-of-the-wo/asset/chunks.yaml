  raw: 'To gather heart- and lung-function data, we all have a tiny computer, smaller
    than the smallest cell phone, taped to our chests, which will remain in place
    the rest of the expedition. This multi-thousand-dollar device is wired to two
    electrodes attached just below our nipples. A high-resolution accelerometer and
    miniature electrocardiogram, the machine that measures heart rate and the interbeat
    interval, takes 400 readings per second. Heart rate variability is one measure
    of stress on the system.


    ![](OEBPS/images/Anke_9781426212413_epub_065_r1.jpg)


    **HILAREE O’NEILL CLIMBS** the base of Lhotse Face. Everest’s dry conditions during
    the 2012 season meant that stretches of the climb were on slick, hard ice instead
    of the more typical snow cover. O’Neill is heading to Camp III during an acclimation
    trip.


    Over the course of a week, the Mayo team performs a series of tests on us and
    themselves. Blood is taken, fat pinched with calipers, and a jelly-smeared ultrasound
    wand slid back and forth across our chests. Machines measure our lung size and
    airway function. Our cognitive skills (or degeneration thereof) are measured with
    computer games similar to those once given to astronauts. In one, we stab a plastic
    pen on the screen whenever a square appears—this is to measure hand-eye coordination.
    In another we match the color of a word—for instance, the word *red* printed in
    the color green—with the name of the color—not the word—below. Finally we do a
    grip-strength test and a step test, jumping up and down on a small stool like
    Jane Fonda.


    After both torturing and entertaining us, Johnson and his Mayo cabal pack up and
    head home to Minnesota to crunch the numbers. (They take our geologist, Dave Lageson,
    with him. He is not only sick but has to attend to family issues. Rocks collected
    on the summit by our Sherpas will be sent to him for analysis.)


    ![](OEBPS/images/Anke_9781426212413_epub_066_r1.jpg)


    Which tent scene suits your style? The 1953 pig pile for human warmth, or the
    NASA-monitoring intensity of today? The 1953 team is actually listening to the
    coronation of Queen Elizabeth—radio was available—while the communications tent
    in the 2012 expedition includes Wi-Fi with its full array of amenities.


    “Our goal is to learn as much as we can about the physiology of the cardiopulmonary
    system under extreme stress,” summarizes Johnson as he departs, “and then apply
    these findings to treating heart-failure patients.”


    **VOICES**


    WHY CLIMB EVEREST?


    Thirteen thousand feet above sea level. That is about the highest elevation that
    I had ever been to before going on this Everest expedition. Though I am a climber
    and a lover of the mountains, mountaineering has never been a realm of the sport
    of climbing that has entered my mind. I dream of steep rock and ice, and mostly
    as single pitches. Having been offered an opportunity to attempt the world’s highest
    peak as a part of the National Geographic/The North Face Legacy expedition team,
    I was compelled to expand my understanding of climbing in the big mountains and
    of being on a proper expedition. Still, I was vexed by all of the uncertainty
    that I knew I would experience in the commitment of an entire spring season. As
    I reflect back now, just a few months from standing on the summit of the world,
    I am certain that the experience did change my life.


    **INNER PURPOSE**


    It was a long trip, and very challenging at every level of my existence—mentally,
    emotionally, spiritually, and of course physically. As it was my first major mountain
    expedition, I had no skills to understand what or how I should feel internally.
    The days were long, and in such a basic and raw and extreme environment, there
    is nowhere to escape. There are no distractions to remove the mind from where
    it is: quite simply, a place where people weren’t meant to be. Our mortality and
    true fragility are so apparent there, so much so that our bodies are literally
    killing themselves. Unable to obtain enough calories, they start consuming themselves.
    The immune system is depleted, running on fumes, so sickness is inevitable.


    I had two crippling bouts. One was a gastrointestinal nightmare, and the other
    was a throat and upper respiratory infection from hell. Both of which required
    antibiotics. However, there is always a silver lining.


    This experience allowed me to sift through my life by forcing me to be present,
    live slowly, and confront reality. It exposed my true self over the weeks, pulling
    back layers like those of an onion. And it forced me right up against the tough
    questions: Who should I be? What is this life for? What do I want?


    Perhaps it would have been better not to allow my mind to go so deep, especially
    given all of the responsibilities of our important expedition—but, as I said,
    I had no reference for what I should feel or think. I actually believe that part
    of the reason for my being there was to provide a fresh, unbiased perspective.
    I have no doubt that what happened to me there was because I needed it. Thankfully,
    we delivered on our obligations and were fortunate to summit as well, but in retrospect
    those things were like the cherries on top.


    Most important, Everest allowed me to look at my life differently and to reconsider
    it. For this I will be eternally grateful both to those who believed in me enough
    to allow me to go … and to the mountain itself.


    **—SAM ELIAS** A dedicated alpine skier, sport climber, and winter climber, Sam
    Elias pursues challenges all over the world. He is a North Face athlete and was
    a member of the Legacy Climb expedition team.


