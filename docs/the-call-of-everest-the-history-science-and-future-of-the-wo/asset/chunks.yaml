    The year 1996 was when too many died. The highly publicized disaster that killed
    a total of 11 people has sadly defined Everest in the 1990s. Many have analyzed
    the sequence of events that led to the tragic night. Fingers have been pointed.
    But as with most mountain tragedies, many factors contributed. Certainly, there
    were too many people crowding the route on summit day, creating gridlock and terrible
    delays. Communication problems created confusion about who was supposed to do
    what, and at what time. Some guided clients weren’t as experienced as they should
    have been, for they would have relied less on fixed lines and hand-holding on
    the epic descent. The rivalry between the leaders of the two commercial expeditions—Rob
    Hall, a New Zealand guide and owner of Adventure Consultants, and American Scott
    Fischer, head of Mountain Madness—probably also played a role. Fischer was the
    new guy on the hill, and Hall, the well-established Everest guide, had succeeded
    in getting his clients to the summit every year, except for the previous year.
    The pressure must have been fierce. Hall disobeyed his own rules of survival when
    he and his clients stayed too long above 8,000 meters. The year before he had
    followed those rules and, although nobody reached the summit, everyone had returned
    from the climb. In 1996 four of his team, including Hall himself, perished on
    their descent.


    Fischer was ill on the day his group summited, compromising his ability to look
    after his clients and bringing into question the strategy that he had developed
    with his Russian guide, Anatoli Boukreev. Boukreev was to guide from the front,
    and Fischer from behind. That strategy couldn’t succeed with an ailing Fisher.
    The clients needed more support.


    Other climbers on the mountain observed that all the guides were clad in relatively
    lightweight clothing, indicating perhaps overconfidence in their ability to get
    up and down the mountain quickly.


    The costs associated with guided climbs of Everest probably influenced some clients
    to climb beyond the point of exhaustion. They couldn’t afford to return.


    The most significant factor was, of course, the storm. According to some, it was
    the storm of the century. Others rated it just another storm on Everest. No matter
    how fierce, it combined with all of the individual elements leading up to summit
    day—illness, broken rules, miscommunication, lack of skills, exhaustion—to become
    the perfect storm. Nine people lost their lives that night. Even more would have
    perished had Boukreev not gone out into the night, again and again, to rescue
    climbers huddled in the blizzard on the South Col. Rob Hall was not so fortunate.
    After he helped a climber reach the summit, his oxygen tank froze, and he died
    in the blizzard.


    ```

    ![](OEBPS/images/Anke_9781426212413_epub_046_r1.jpg)

    ```


    **STRONG EVEREST WINDS** give flight to a rope being held by guide Anatoli Boukreev
    on the approach to the Hillary Step during his 1996 climb. He would die a year
    later in an avalanche on Annapurna Peak, located in north-central Nepal.


    # VOICES BESIDE MALLORY


    Sitting beside Mallory on May 1, 1999, I looked east toward the descent route
    he and Irvine would have taken had they summited that June 8, 1924. I imagined
    Mallory’s awareness even in extremis: no radio to communicate with others, no
    chain of fixed ropes to guide him down the mountain, no teams of rested climbers
    ready to enact a rescue, no way of telling the world what really happened.


    I can only guess what Mallory’s and Irvine’s last moments were like but what I
    do know is how their achievement has affected our climbing legacy. The boldness
    of their last climb formed a stepping-stone to the future. The debate over oxygen
    and its ultimate acceptance made it possible for their successors—including Hillary
    and Tenzing—to visit high places with a reasonable safety margin.


    Sometimes late at night I wonder whether by discovering Mallory I’ve aided in
    the destruction of a mystery. The possibility haunts me. Has my find somehow taken
    some of the enigmatic glory away from the 1924 expedition?


    Others may think so, yet for me, the discovery only increases my admiration for
    these pioneer climbers, whose story—which will never be told in its entirety—has
    always lain wrapped in the secrets of Chomolungma, “mother goddess of the snows.”
    I feel privileged to have participated in casting new light onto this mystery.
    Ultimately, Mallory and Irvine’s greatest achievement was an inspirational one,
    for even in failure, their magnificent attempt showed us what the human spirit
    is capable of.


    **—CONRAD ANKER** Conrad Anker is recognized the world around as a premier alpinist.
    With funding from the National Geographic Society and The North Face, he led the
    2012 Legacy Climb up Everest to commemorate the first American team’s summit 50
    years before.


    # PIONEERS FOREVER


    Despite the tragedy that sadly dominates this decade, many others took on the
    challenge of Everest and succeeded, sometimes in very original ways. At the beginning
    of the decade, Australian Tim Macartney-Snape began his journey at the Bay of
    Bengal and continued, walking (and sometimes swimming) the entire distance to
    the mountain’s base, and then to the summit. In 1990 Jim Whittaker led the Peace
    Climb, a joint venture between the Chinese, Americans, and Soviets that placed
    20 climbers on the summit. Also that year, the first married couple climbed to
    the summit when Maria and Andrej Stremfelj, two veteran Slovenian climbers, barely
    beat a rival team, American Cathy Gibson and her Russian husband, Aleksei Krasnokutsky.


    In 1991, British filmmaker Leo Dickinson ballooned over Everest, taking some of
    the most superb photographs ever seen. On April 22 of the following year Pasang
    Lhamu became the first Nepali woman to climb Everest—on her fourth attempt. But
    her story did not turn out happily. While she became a national hero, she died
    on her descent and took a Sherpa with her—Sonam Tshering, father of three children
    and an unborn fourth. Somewhat similar fate greeted British climber Alison Hargreaves,
    who in 1995 climbed the mountain alone without supplemental oxygen. Sadly, she
    would lose her life in August of that year as she descended from the summit of
    K2.


    ```

    ![](OEBPS/images/Anke_9781426212413_epub_047_r1.jpg)

    ```


    **FRENCH SNOWBOARDER MARCO** Siffredi gets set to descend Everest on a snowboard
    on September 9, 2002. He had successfully snowboarded down the Norton, or Great
    Couloir the year before. He returned to attempt the more challenging Hornbein
    Couloir but would never be seen again.


    The same year as the 1996 *Into Thin Air* disaster, veteran Everest climber and
    award-winning filmmaker David Breashears made the first IMAX film on Everest.
    That same year, a South African team, including Bruce Herrod, Cathy O’Dowd, and
    Ian Woodall, placed the South African flag on the summit for the first time. But
    Bruce Herrod lost his life in the process. Everyone on the mountain stopped to
    listen when President Nelson Mandela called their base camp to offer congratulations
    to the summit climbers. When he learned they were still high on the mountain,
    he asked that they call him back, and even began to give his telephone number,
    over national radio! Luckily, their base camp manager cut that particular transmission
    short, to the amusement of the entire mountain.


    Also in 1996, a strong Russian team from Siberia led by Sergei Antipine climbed
    a bold new line straight up between the North and Northeast Ridges of the mountain,
    succeeding on their very first attempt. The slopes varied from 65 to 90 degrees
    of steepness.


    In the same year Swedish climber Göran Kropp rode a specially designed bicycle,
    groaning with its 240 pounds of equipment, 7,000 miles from Stockholm to Kathmandu,
    then carried on to the summit of Everest. He survived the deadliest Everest season
    only to die rock climbing near his Seattle home.

