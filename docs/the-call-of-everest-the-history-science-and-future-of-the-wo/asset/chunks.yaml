    keeping your head in the game is half the battle. We switch off our headlamps
    and burrow down into our bags. Tomorrow it’s finally showtime.


    **VOICES**


    MOTHERHOOD AS MOUNTAIN TRAINING


    It was pretty late in the game when I began telling friends and family that I
    was going to spend ten weeks of my spring climbing Mount Everest. I was met with
    many a blank stare and uncomprehending blinks. This reaction was not related to
    the fact that I wanted to climb Everest—anyone who knows me understood that attempting
    to climb to the highest point on Earth was inevitable for me. The expressions
    I was seeing had more to do with “how” versus “why.”


    The expedition only finalized for me in mid-January 2012\. With an impending departure
    date of late March, how was I going to organize my life, let alone train for such
    a massive undertaking, in such a way that I could be away from home for ten weeks?


    **LEAVING THE CHILDREN**


    This expedition came together at a rather inconvenient time for me. I am the mother
    of two small boys: In the winter of 2011–12, they were two and four years old.
    While I had always had the Khumbu and Everest on my mind, I’d envisioned it to
    be a few more years down the road, when my children were in school. No such luck.
    Even my husband agreed that this opportunity to climb Everest was too good to
    pass up. The team was outstanding, the sponsorship very solid, and the partners—The
    North Face, National Geographic, and the Mayo Clinic—were all too intriguing.


    Together, my husband and I decided I should go. The next two months were absolute
    and utter chaos. Apart from the logistics of arranging child care and a support
    system for my husband while I was away, I needed to train. As a professional ski
    mountaineer I was not starting from scratch, but as a full-time mom I had a limited
    training window at best.


    **TRIPLE CHALLENGE**


    Everest was not my first 8,000-meter peak. I had already climbed and skied Cho
    Oyu and attempted Gasherbrum II in Pakistan. From these experiences, I knew training
    for me was a threefold endeavor: physical fitness, mental toughness, and weight
    management.


    In hindsight, the abominable snow conditions of the 2011–12 winter season actually
    worked in my favor. As a skier, if there is good skiing, that is the only activity
    I will do. But as a skier, I know that it gets me in shape for nothing other than
    skiing. The poor snow conditions allowed me to think outside the box when it came
    to getting in shape for Mount Everest. First and foremost, I needed a way to train
    while being with my two kids. At least three days a week I would take both boys
    skiing by myself. While my four-year-old could mostly manage on his own, my youngest
    was often between my legs or on a harness with me controlling his speed from behind.
    Both of these methods require serious snowplowing on my part, which is way more
    challenging than just skiing! The rest of the time, I would carry him.


    For me, training is not only about physical fitness but also mental fitness. Carrying
    an often screaming and kicking 30-pound two-year-old around the mountain for hours
    at a time was torturous but amazing training physically and, especially, mentally.


    As the winter shaped up a bit, I did go back to my normal standard of training:
    ski touring. This was pretty important to me as a tool for Everest because it
    was my intention to try to ski from the summit. With that in the back of my mind,
    I knew I needed to get on terrain that provided mental training in the form of
    exposure, and lots of it.


    **THE TOLL ON THE BODY**


    One of the noted physiological responses to extreme altitude is a relentless loss
    of weight and overall deterioration of muscle. Having spent a lot of time at high
    altitude, I am very aware of the delicate balance between proper acclimation and
    the deterioration of the physical body. Many high-altitude climbers, including
    myself, try to give their bodies a bit of a cushion by putting on extra pounds
    before attempting an 8,000-meter peak. I call it the expedition diet. Eat anything
    and everything in hopes of prolonging your body from eating its own fat reserves
    and muscle. In my case, this is not so easy. One side effect of having children
    is that it changed my body type to be much leaner. It is very difficult for me
    to put on weight, and my average weight is about five pounds less than it was
    pre-children. Therefore, eating was another important aspect of my preparation
    for Mount Everest.'
