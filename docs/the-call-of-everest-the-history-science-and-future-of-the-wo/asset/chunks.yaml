    ## 探察队


    ![](img/Anke_9781426212413_epub_002_r1.jpg)

    国家地理学会是世界上最大的非营利科学教育机构之一。该学会成立于 1888 年，旨在“增加和传播地理知识”，其使命是激励人们关注地球。


    ## 国家地理学会与 AME


    国家地理学会


    通过其官方杂志《国家地理》（*National Geographic*）及其他杂志、国家地理频道、电视纪录片、音乐、电台、电影、书籍、DVD、地图、展览、现场活动、学校出版计划、互动媒体和周边商品，该学会每月在全球范围内超过
    4 亿读者读者。国家地理学会已资助超过 10,000 个科学研究、保护和探索项目，并支持一项促进地理素养的教育计划。


    ## 攀登珠穆朗玛峰


    ![](img/Anke_9781426212413_epub_003_r1.jpg)

    **成功了！丹增·诺尔盖**于 1953 年 5 月 29 日在珠穆朗玛峰顶的稀薄空气中举出他的冰镐，此时他与埃蒙德·希拉里成为首批站在山顶的人。


    ## 历程


    我们在珠穆朗玛峰上新路线的攀登是人类与山脉关系进化中的一个预测性阶段。这次探险的核心主题是延续不确定性：首先我们确定一个符合梦想的目标，然后研究如何到达大营，最后寻找通往顶点的方法。


    ## 珠穆朗玛的遗产


    这本书《珠穆朗玛的呼唤》还庆祝了希拉里爵和丹增·诺尔盖首次登顶珠穆朗玛峰 50 周年。AME 的成功远超我们的想象。5 月 1 日，吉姆斯·惠特克与夏尔巴那旺·贡布成为首批登顶的美国人。三周后又有四位登顶。鲁特·杰斯塔和巴里·毕松于
    5 月 22 日中午通过南脊路线登顶。晚了一点，在下午 6:15，威利和我完成了首次登顶西脊（通过威利习惯称之为“霍恩拜因崩石陷阱”，现在被称为霍恩拜因冲槽）。我们沿着南脊下山，与鲁特和巴里会合，我们四个人在
    28,000 英尺以上的意外露营地度过了夜晚。我们非常幸运能活过那个夜晚，也很幸运威利和我能够完成对一座主要喜马拉雅山峰的首次穿越。


