    The Great Trigonometrical Survey finally reached the southernmost foothills of
    the Himalaya in 1847. Unable to gain access to the Kingdom of Nepal, surveyors
    were forced to work in the Tarai, a strip of land to the south, in order to survey
    the great peaks of the Himalaya more than 100 miles away. Andrew Waugh, surveyor
    general, measured distant “snowy peaks” from Sonakhoda, below the Darjiling hills
    near the eastern end of the Himalaya, in the autumn of 1847, after the monsoon
    season. One peak stood out among the others, now known as Kangchenjunga, the third
    highest mountain in the world at 28,169 feet (8,586 meters). Waugh did not announce
    his measurements for several more years, in part because of another peak observed
    on the Nepal-Tibet border—a distant giant given the name Gamma (γ), from the Greek
    alphabet.


    ![](OEBPS/images/Anke_9781426212413_epub_013_r1.jpg)


    `LAMBTON’S GREAT THEODOLITE`, used throughout the Great Trigonometrical Survey
    of India, could measure both horizontal and vertical axes but was less than portable.
    Weighing in at half a ton, it took 12 men to carry it.


    At the same time, in November 1847, a surveying assistant named John Armstrong
    also focused his surveying instrument on “γ” from a position farther west. He
    named the peak “b” and assigned to it a preliminary elevation of 28,799 feet (8,778
    meters). Waugh distrusted the elevation calculations of “γ-b` and decided to wait
    for further measurements and recalculations before making an announcement. Over
    the next two years, Waugh sent two surveyors to the Tarai for additional sightings
    and measurements, but clouds and distance repeatedly thwarted their attempts to
    gain more data.


    After several attempts, in 1849 James Nicolson finally obtained several vertical
    and horizontal angles from multiple stations closer to this mysterious peak than
    any surveyor had ever been; his preliminary calculations yielded an elevation
    of approximately 30,200 feet (9,205 meters). But Nicolson’s initial calculations
    did not take light refraction into account, which can introduce significant error
    into height calculations.


    Several more years passed until Waugh’s “chief computer” at the time, a brilliant
    Bengali mathematician named Radhanath Sikdar, most likely became the first to
    determine the first accurate elevation of the peak in question. In March 1856,
    Andrew Waugh finally made the formal announcement. In a 14-paragraph document,
    paragraph 5 reads: “We have for some years known that this mountain is higher
    than any hitherto measured in India and most probably it is the highest in the
    whole world.” He named the peak Mount Everest, or Himalayan Peak XV, locating
    it at 27° 59′ 16.7″ N, 86° 58’ 5.9″ E and reporting its elevation as 29,002 feet
    (8,840 meters) above sea level.


    British surveyors preferred to name Himalayan peaks with their indigenous names,
    if such names could be found, yet Waugh was unable to learn any local names, Nepal
    being closed to foreigners. He named the mountain after his predecessor, Sir George
    Everest (pronounced EEV-er-est by the family), who did not endorse the use of
    his name in this manner. Nevertheless, the name Mount Everest was subsequently
    approved in London by the Royal Geographic Society, and knowledge of Earth’s highest
    peak rapidly spread around the world.


    ## Roots BENEATH MOUNTAINS


    Scientific research on the geology and geophysics of great mountain ranges such
    as the Andes and Himalaya has a long history, with investigators not only trying
    to determine their origin but also attempting to answer basic questions such as:
    *What holds these mountains up? Is there a maximum height they can never exceed?
    How is rock mass distributed within them?*


    The answers to these questions address the basic nature of how mountains are geologically
    assembled. Trekking from Lukla to Everest Base Camp over the course of many days,
    I was often struck by the tremendous significance of these great mountains to
    the historical development of the geosciences worldwide. Essential scientific
    ideas have originated over the past 150 years in the study of these lofty peaks.


    One of the most impressive scientific outcomes of the Great Trigonometrical Survey
    of India was the discovery that mountain ranges have deep crustal roots that extend
    down into the Earth’s uppermost mantle, analogous to the “roots” of an iceberg
    that extend well below sea level. Although 19th-century British surveyors in India
    knew that the mass of the Himalaya could influence the vertical angle of their
    survey plumb lines, a phenomenon known as astrogeodetic deflection, the geophysical
    details of why this happened were largely unknown.


    George Airy, the Astronomer Royal, came up with one analysis of the plumb line
    deflection. He postulated that deep roots of low-density crustal rock—granite,
    for example—lie beneath great mountain ranges, and thus a high mountain range
    is “density-compensated” by its deep crustal roots. Today we know that the Himalaya
    does have a massive, low-density crustal root, produced by the continental collision
    of India with Asia. The continental crust beneath the Greater Himalaya shoots
    down 44 miles—double the average thickness of continental crust in the nearby
    lowlands.


    ## TWO EARLY GEOLOGISTS


    At its best, science is an incremental process whereby new theories and ideas
    are built upon those of the past. Our understanding of how great mountain belts
    are created has evolved tremendously since the early development of plate tectonics
    in the 1960s. Many geoscientists deserve special mention; indeed, many historic
    climbing expeditions to the Himalaya have included one or more research geologists,
    including the 1963 American Mount Everest Expedition with Maynard Miller. I have
    selected two geologists to highlight out of many distinguished researchers. These
    two individuals are role models for younger geologists not only for their professional
    accomplishments but also for their strong character and spirit, which still echo
    among the great peaks and river gorges of the Himalaya.


    ### Noel Odell


    Noel Odell (1890-1987) had a long and distinguished career as a geologist and
    mountaineer. He served with the Royal Engineers, worked in the mining and petroleum
    industries, and taught geology at Harvard and Cambridge universities, among others.
    Odell is perhaps most famous for being the last person to see George Mallory and
    Andrew “Sandy” Irvine alive as they attempted to ascend the Northeast Ridge of
    Mount Everest on June 8, 1924. When Mallory and Irvine failed to return to camp,
    Odell twice climbed without oxygen to around 27,000 feet (about 8,200 meters)
    in hopes of finding them. His ability to climb so high was taken as proof for
    many years that the additional weight of supplemental equipment (called “English
    air” at the time) was detrimental to high-altitude mountaineering. In 1936, he
    was the first (with Bill Tilman) to successfully ascend Nanda Devi, which, at
    the time, was the highest mountain ever climbed. Odell returned to Everest in
    1938 as a member of the Tilman expedition.


    `NOEL ODELL WAS` both a geologist and a mountaineer. He was a member of the British
    Everest expedition in 1924, where he was the last person to see George Mallory
    and Sandy Irvine alive. Odell was one of the first to study the geology of the
    Himalaya, collecting samples on that 1924 trip of what he first thought were fossils.

