    My thoughts turn also to those who have born witness to our obsession with the
    mountain. I once met a Buddhist living in a nunnery at the base of Everest who
    had spent 45 years in isolated retreat, dedicating her entire life to the recitation
    of a single prayer. To those prepared to sacrifice everything in a quest to reach
    the summit of the world, such spiritual devotion may seem like a waste of a human
    life. Most Tibetans find it equally incomprehensible that one would choose to
    walk to heights where the air is so thin that consciousness is obliterated. To
    enter a death zone deliberately, to risk losing the opportunity of personal transformation
    and escape from the realm of samsara merely to climb a mountain, is for them folly,
    the actual waste of a precious incarnation. As the abbot of Rongbuk Monastery
    wrote of the British expedition of 1922: “They camped at the bottom of the mountain,
    then, I heard they camped for seven times for each level they reach, with great
    effort they use magical skills with iron nails, iron chains and iron claws, with
    great agony, hands and feet frozen …�[Some] left early to have limbs cut off,
    the others stubbornly continue to climb …�I felt great compassion for them to
    suffer so much for such meaningless work.”


    **WADE DAVIS** Wade Davis, an explorer-in-residence at the National Geographic
    Society, is an author, photographer, and cultural anthropologist. His most recent
    book, *Into the Silence*, is a cultural history of the British Everest efforts
    of the 1920s.


    ![](OEBPS/images/Anke_9781426212413_epub_045_r1.jpg)


    **AMERICAN ED WEBSTER** crosses through the free space over a huge crevasse using
    a Tyrolean traverse. In 1988 he and three teammates would attempt the summit via
    the Kangshung—or East—Face, without Sherpa support, supplemental oxygen, or fixed
    ropes.


    ### THE ESSENTIAL SHERPAS


    By now everyone realized that Sherpas were integral to most people’s success on
    Everest. They were incredibly strong at altitude and seemed capable of withstanding
    intense cold, large loads, and long days. Jim Whittaker, the first American to
    the top, joked about their capacity at altitude: “You don’t notice them until
    they take a deep breath. Then their lungs fill up, and they block the view.”


    Sherpas are inextricably interwoven into Everest history, and the record of their
    accomplishments on the mountain is legendary, although not often celebrated. Everyone
    knows of Tenzing Norgay, but hundreds of others could justifiably be called Tigers
    of the Snows. Dawa Tenzing was still carrying loads to the South Col at age 56
    for the Americans in 1963\. Nawang Gombu, who reached the top with Jim Whittaker
    in 1963, later replaced Tenzing Norgay as the director of field training at the
    Himalayan Mountaineering Institute in Darjiling. Pertemba Sherpa climbed the Southwest
    Face with Pete Boardman on Chris Bonington’s landmark 1975 expedition. Apa Sherpa,
    nicknamed “Super Sherpa,” has reached the top 21 times. Babu Chiri Sherpa, who
    climbed the mountain by several routes and summited ten times—twice within a 14-day
    period—once spent the night on top just because he wanted to, and climbed it once
    in 16 hours and 56 minutes. The list goes on and on.


    But not every team climbed with Sherpas. The Poles couldn’t afford them. Nor did
    a small British team of eight led by Alan Rouse that tried Everest in the winter
    of 1980–81, this time by the West Ridge, with no supplemental oxygen. It was an
    incredibly ambitious undertaking, and they were turned back by the cruel winter.
    Though nobody died on this expedition, three of the eight would make the ultimate
    sacrifice in the Himalaya in the coming years: Joe Tasker on Everest in 1982,
    Pete Thexton on Broad Peak in 1983, and Al Rouse on K2 in 1986.


    Bonington returned in 1982 with an all-star team of six, intending to climb the
    Northeast Ridge. Pete Boardman and Joe Tasker, well known in Britain not just
    for their climbing prowess but also their writing and filmmaking talents, were
    among them. The pair headed up the Northeast Ridge to an area called the Pinnacles
    at about 27,000 feet (8,200 meters). They were last sighted around 9 p.m. on the
    night of May 17, silhouetted just below the Second Pinnacle. The British casualty
    rate in the Himalaya was mounting. As historian Elizabeth Hawley observed, “A
    whole generation of British climbing has been decimated …�Bonington is alive,
    but most of his friends are gone.” Only in 1995 would the entire Northeast Ridge
    be climbed, by a Japanese team from Nihon University, using full siege tactics,
    including 13 climbers and 31 Sherpas.


    At the same time that Bonington’s team ascended the Northeast Ridge, a Soviet
    team of 17 forced a bold, new, and difficult line on the buttress to the east
    of the British Southwest Face route. Eleven climbers reached the summit, heralding
    the Russian style of big-wall, Himalayan climbing.


    Finally, in 1983, the last of Everest’s faces was climbed—perhaps the most intimidating
    and dangerous one—the East (Kangshung) Face. It was so hazardous that the American
    team chose not to use Sherpas, reasoning that it wasn’t right to expose them to
    so much danger. Using supplemental oxygen, six climbers summited: It was the second
    new route on Everest pioneered by Americans. With this ascent, all three of Everest’s
    great faces—North, Southwest, and East—had been climbed.


    Two years later, another Everest first took place, and it presaged the future
    of climbing on the mountain. When Snowbird Ski Resort owner Dick Bass summited
    Mount Everest on April 30, 1985, he could fairly be classified as the first fully
    guided Everest client. It was his fourth try at the mountain, and he had David
    Breashears to thank for his success. “You got me up—and I know you’ll get me down,”
    he gasped to Breashears on the summit. Breashears did just that, for he fully
    understood the relationship. “He’s my responsibility: I have to get him down.”


    With the explosion of guided climbs that followed, many have criticized the business
    of guiding clients on the highest mountain on Earth. Guiding is an honorable profession
    with a long and illustrious history, particularly in the Alps. But it’s a different
    story above 8,000 meters. There are so many additional factors: the massive scale,
    the crippling altitude, the fierce storms, and the huge costs. Perhaps most important,
    the guide has higher stakes as well. Each is granted only one summit per season,
    not like the Alps. It’s important to make each season count.


    ### CLIMBING NIGHT NAKED


    In the summer of 1986, possibly the most impressive ascent of Everest was made
    by Swiss climbers Erhard Loretan and Jean Troillet. After acclimating for five
    weeks, they left their advance base camp together with French climber Béghin.
    They began at 11 p.m. on August 28 and struck out for the Japanese couloir on
    the north side. Climbing through the night, they stopped at 11 a.m. at 7848 meters
    to relax and rehydrate in the warmth of the day. As the evening cooled, they started
    up the Hornbein Couloir. After four hours of climbing, they stopped to wait for
    dawn’s light. Béghin turned around at this point, but the other two resumed their
    climb, reaching the summit at 2 p.m. After 90 minutes they started down, and since
    the snow conditions were superb, they chose to descend the entire face in a sitting
    glissade that took a mere four and a half hours, for a total of 39 hours round-trip.
    They took no tents, ropes, harnesses, or bottled oxygen. Polish climber Voytek
    Kurtyka (and frequent climbing partner of Loretan) called it “night naked” climbing.
    When the author asked Loretan, years later in 2010, what his most memorable climb
    was, he cocked his head, flashed a lopsided grin, and answered, “The Everest climb
    was very good … it was such a straight line.”

