  raw: 'Like many of the Sherpas’ deities, she simultaneously occupies a position
    of endearment, fear, and devotion. In 1953, Tenzing Norgay credited the goddess
    with granting him safe passage on the slopes of Everest, and for escorting him
    and Edmund Hillary to the summit.


    **VOICES**


    **THE PUSH AND PULL OF PROGRESS**


    Many Sherpa youth regard the older generation as backward because they are skeptical
    of new technology, underestimate the value of education, and reject any new understanding
    of the position of women. Young women are critical of the fact that they are brought
    up more conservatively than the boys and tied to the home, while the boys are
    allowed more free time and are given the chance to go abroad. In the Sherpa culture,
    it is the Sherpanis [female Sherpas] who are the preserving force and who guarantee
    continuity and stability while the men are away. The girls’ upbringing stems from
    the perception of the women’s role as caretakers and perpetrators of their culture …


    Language and religion are undisputed core values for the Sherpas. Myths and religious
    rituals structure the pattern of their year—a feature that not even the most modern
    young people would like to change. Buddhism and its values are unquestioningly
    upheld.


    This cannot be said for the Sherpa language, however. Many Sherpas speak better
    Nepali than Sherpa.… The educated young people are aware of the danger that Sherpa
    culture could disappear altogether if core values such as language are not upheld,
    and they demand protective measures to save such traditional features. At the
    same time they are an integral part of a process of change.


    **—KURT LUGER** Kurt Luger is chairman of Eco Himal, an international NGO dedicated
    to sustainable development in the Himalaya.


    ## **MODERN LIFE**


    The 1950s and early ’60s marked a socioeconomic watershed for the Khumbu Sherpas.
    Traditional trade with Tibet, over the Nangpa La, was curtailed by the new Chinese
    regime, and Khumbu’s villages were languishing in a less than vibrant barter economy.
    Sherpa women, mostly, cultivated potatoes and weaved blankets, then carried them
    down valley to trade for rice and corn.


    “My sister and brothers lost hair on the tops of their heads from the constant
    chafing of their tumplines,” says Ang Rita, an educated Khumjung villager. “No
    one wore shoes, even in winter, though the better-off families sometimes tanned
    and shaped crude boots from buffalo hides.”


    In 1959, Khumbu had virtually no schools, drinking water systems, year-round bridges,
    or improved medical care. Mainly from experience as traders—which requires some
    math skills and the ability to draft business agreements—elder Sherpas had begun
    to recognize the value of education.


    When Sir Edmund Hillary visited the region that year, six years after his summit
    triumph, he was approached by a quorum of villagers who presented him with a scroll-like
    petition. “Our children have eyes, but they are blind,” an elder declared in one
    of several speeches delivered by the gathered Sherpas. They requested that he
    build a school. Hillary established an organization called the Himalayan Trust,
    and in 1961 the Khumjung school was constructed. Its first headmaster, from Darjiling,
    went door to door, persuading parents to send their children to the new school.
    The 46 students in the first class spanned a range of ages; most had no foundation
    of schooling at all.


    “After two years of school,” Ang Rita recalls, “my parents were surprised that
    I wanted to continue studying. ‘Haven’t you learned everything there is to learn
    yet?’ they said. I was determined to keep going, so in the early mornings and
    late evenings I did all my chores—mostly climbing trees to chop firewood and carry
    it back to the village. Then I studied.”


    ![](OEBPS/images/Anke_9781426212413_epub_020_r1.jpg)


    **STUDENTS LINE UP** at Mount Kailash, a boarding school in Kathmandu, Nepal.
    These students’ parents pay for their education, a luxury in a country where rural
    students can walk for miles over rugged mountain trails to reach a schoolhouse.
    Nepal’s literacy rate is only 60 percent for citizens older than the age of 15.


    Over the following decade, Hillary’s organization supported the construction of
    22 more schools. As for Ang Rita, he went on to earn the highest score in Nepal
    in the School Leaving Certificate examination; he is now the director of the Himalayan
    Trust.


    ### **HEALTH CHALLENGES**


    Khumbu needed a hospital, too. Cretinism, caused by iodine deficiency, was almost
    epidemic, and some villagers had goiters the size of small footballs hanging from
    their necks. Alcoholism was common as well. Ulcers, complications from childbirth,
    TB—all were present, though not readily apparent to casual visitors. Then, in
    1963, smallpox found its way into Khumbu from India. If not for the quick response
    of the Himalayan Trust—and the doctors of the 1963 American Mount Everest Expedition—the
    Sherpa community would have been harder hit. Porters carrying loads to Everest
    were found to be vectors of the disease, as they were more mobile and contagious
    than most villagers. In the spring of that year, vaccine was flown in and the
    trust was able to immunize almost everyone in the region, including the people
    in Solu, to the south.


    ![](OEBPS/images/Anke_9781426212413_epub_021_r1.jpg)


    **SHERPA PORTERS WORKING** during the 2012 climbing season pose at Base Camp with
    various loads. By assisting in early climbs, Sherpas gained a reputation for their
    deep understanding of the mountain and their physical abilities to operate in
    an oxygen-starved environment.


    In 1966, a hospital was opened in the village of Kunde. An iodization campaign
    was promptly launched, and virtually all new cases of goiter and cretinism were
    eliminated. Still, illnesses continued to be blamed on the influence of ghosts
    and malevolent spirits, and even today many Sherpas consult shamans before going
    to the hospital—a place where wounds can be treated, but where people have also
    been known to die.


    For four decades the hospital was staffed by husband-and-wife medical teams from
    New Zealand and Canada. It is now operated by Western-trained Sherpa doctors and
    staff. The Himalayan Trust, American Himalayan Foundation, and other organizations
    provide ongoing support.


    ### **FURTHER EDUCATION**


    Hillary wanted to see Sherpas trained in all fields. In the 1970s, the government
    of New Zealand sent six Sherpas to New Zealand for graduate training in parks
    and natural resource management. All of them returned, and in succession three
    of the six were appointed as chief wardens of Sagarmatha National Park—which was
    gazetted in 1977 and encompasses all of Khumbu. Their legacy of enlightened park
    management carries through to the present day.


    The generosity of foreign travelers, Hillary had realized, was leading to a culture
    of dependency. “lf people want to assist the Sherpas and show their affection
    for them,” he counseled, “I’ve always recommended that they contribute to the
    community as a whole, rather than to individuals.” He found that the most sustainable
    projects were those in which the Sherpas invested their own time and labor, effectively
    making the enterprise their own.


    Fortunately, schools and education arrived in Khumbu just as the Sherpas began
    to need tools for harnessing the socioeconomic transformation that was about to
    sweep over them.


    The modern era for Khumbu began, effectively, outside of Nepal in the 1920s and
    ’30s. Tenzing Norgay and his nephew Nawang Gombu were members of the first and
    second waves of Sherpas to seek their fortunes in Darjiling, India. Until 1950,
    when Nepal opened to outsiders for the first time, all Everest expeditions passed
    through India and Sikkim, then into Tibet, to approach the mountain from the north
    side.


