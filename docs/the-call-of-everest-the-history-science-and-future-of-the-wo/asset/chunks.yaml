    八名来自二营的夏尔帕人包括 Panuru 和 Danuru，自愿将科里带回一营。这些夏尔帕人、科里的摄影助理安迪·巴登和我一起冲下西冰谷，像拉着坐在雪橇上的孩子一样拉拖着科里。一营上空低矮的黑云消灭了直升机撤离的可能性，而背着科里通过冰川瀑需要几个小时。相反，在将氧气流量调高至每分钟四升后，科里在
    Panuru 的帮助下跌跌撞撞地走下冰川，并立即被飞机送往大营接受治疗。


    ## 团队继续前进


    这让康拉德在尝试攀登西脊时失去了伙伴。格调华丽的意大利登山者、拥有约 40 次喜马拉雅登山远征经验的老兵西蒙·莫罗曾短暂地考虑过与他组队。然而，在分析了西脊著名的霍恩贝因冰斗槽（Hornbein
    Couloir）的航拍后——那里不再是积雪，而是蓝冰和裸露的岩石——他宣布任何尝试都是自杀行为。“我来这里不是为了死的。在这条线上，今年，你会死的。”康拉德和西蒙都不情愿地决定攀登南脊。


    ![](img/Anke_9781426212413_epub_068_r1.jpg)


    团队成员兼摄影师科里·查兹在海拔 23,000 英尺（7,000 米）处与康拉德·安克固定绳索时开始呼吸困难。他下到二营，医生在那里给他补充了氧气并建议他下山。随后，查兹回到了大营，有时乘坐
    Sked 救援担架（最右侧），有时也靠自己的力量通过了危险的冰川瀑布（对面，左侧）。医生在大营对他进行了额外的测试，随后他从那里被转送往尼泊尔卢克拉附近的一个医疗机构。


    在过去的半世纪里，珠穆朗玛峰的地貌发生了巨大的变化。在地球变暖之前的时代，它是一座雪峰。今天，雪原和冰川已大幅退缩，露出了松散、易碎的岩石。由于春季极端干燥且风大，四月份期间的昆布冰川瀑和洛子峰面都比平时更加危险。几名夏尔帕人在洛子峰面被落石严重伤。其中一人被崩塌的冰塔击中，那块汽车大小的冰块断了他的手臂和腿。两支登山队（包括山上最大的
    Himex 队）由于风险过高而放弃了尝试。


    5 月初的暴风雪最终（尽管是暂时的）将大山重新粘合在一起，夏尔帕人成功地在海拔 25,900 英尺的南脊营建立了绳索。5 月 18 日，在我们卡吉的带领下，夏尔帕将绳索系到了山顶。第二天，超过
    200 人涌向顶峰。在此过程中，有四位客户丧生了生命。


    ![](img/Anke_9781426212413_epub_069_r1.jpg)


    马克·詹金斯在被洛子峰面三营上方被强风击落后，经过珠穆朗玛留下的碎片。


    ![](img/Anke_9781426212413_epub_070_r1.jpg)


    艾米莉·哈灵顿、萨姆·埃利亚斯和希拉·奥尼尔（从左到右）在三营享受着难得无风夜晚。云层悬挂在西冰谷，珠穆朗玛峰的西脊在右侧升起。


    我们在大营按兵待发，观察、等待并恢复。根据卫星辅助天气预报，下一个机会窗口似乎是 5 月 25 日。我们休息、睡觉并尽可能多吃。我们现在缩减为六人团队，因为菲尔·亨德森患了呼吸道感染，并慷慨地承担了大营经理的角色。


    我们的冲顶行动开始于 5 月 21 日凌晨 2 点。我们在正午前到达二营，并在那里待了两天——同样是进食和睡觉——然后我们中的五个人上到了三营。康拉德打算第二天和夏尔帕人一起上来。


    ## 声音


    ### 登珠穆朗玛峰后的反思


    在珠穆朗玛峰上的经历让我意识到我拥有多么美好的生活。它让我开始思考自己的生命期限以及什么是重要的。对我来说，家庭和山脉非常重要。能够拨打家里电话和我四岁的女儿通话祝她生日快乐，听到她和我妻子的声音，对我很有帮助。


    它让我意识到，在地球更宏大的蓝图中，我是一个多么微小的生物。我经常会注意到大营生活中生活的细微差别，例如脚下冰川的移动以及深夜里冰塔崩落的声音。有机会近距离观察我们星球的这一小部分，是意义非凡的经历。


    ### 实现目标


    我经常发现自己独自在冰川瀑布中行走，并感到完全自在。在山中独处是我一直很习惯的事情。然而，在世界最高山上独处，风险极高却依然感到满足——这永远是远征中令人难忘的一部分。它告诉我，多年来山里的经历其实为这次远征做好了准备。


    我真的努力不去担心会发生什么。如果我登顶了，那太好了：那将锦上添花。我的主要焦点是为远征、团队以及我周围的人产生积极的影响和贡献。我觉得我能够完成所有的个人目标——除了登顶之外。除了登顶，还有许多其他重要的事情。


    ### 始终伴随我


    每天没有哪一天我不想起这次远征。由于某种原因，不像对其他任何远征的想法，我不认为它很快会改变。这对我来说是另一个改变生活的经历。它帮助我保持生活的视角。这是我能想出的最好的例子，说明为什么将远征作为生活的一部分对我。


    ——菲尔·亨德森，资深登山者，国家户外领导力学校（NOLS）高级野外导师，菲尔·亨德森是周年纪念团队的成员。


    ### 追问为何


    我们花费了几个小时在空中开辟出一个冰雪平台。一营和三营是夏尔帕人没有为我们建造的唯一营地。从我们海拔 23,000 英尺的立足点，我们俯视着西冰谷片眼的洁白。我们发现了冰石堆中二营的微型帐篷，再往远处是一营周围的裂缝，再更远则是被翻腾云层遮住的大营。地平线如水彩画般向远方消失，是一系列锯状的山脊线。我们看得如此遥远，几乎能看透内心。这种视野只有来到这里才能获得。


    在珠穆朗玛峰度过两个月后，我们成了朋友。我们了解彼此的战斗和背叛——至少是其中一部分——我们互相支持：当希拉扭伤脚踝时，当萨姆失去信心时，当我病得无法坐起时。这就是在长期远征中并在狭小帐篷旁睡眠会发生的事情。这是本应该发生的事。你们以个体开始，并相互转化为一个团队。


    位于洛子峰中腰的三营就像没有没有墙的摩天大楼。我们这一层没有其他人，我们拥有自己的寂静空间，尽管在我们上方和下方都有帐篷和登山者。


