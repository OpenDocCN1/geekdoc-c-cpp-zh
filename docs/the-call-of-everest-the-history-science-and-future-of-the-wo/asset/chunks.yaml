    experience or technical skills to be so high.


    ### **THE PATH LESS TRAVELED**


    In 1963, Whittaker and Gombu had been utterly alone up high on the mountain; today
    this would be unimaginable. Relying heavily on Sherpa support and bottles upon
    bottles of supplemental oxygen, more than 300 people a year summit Everest, a
    total of almost 4,000 since 1963\. (When all the numbers are compiled, more than
    400 people will summit in the spring of 2012.) Sans oxygen—the blood doping of
    mountaineering—and Sherpas, Everest would still be the exclusive domain of the
    world’s best high-altitude mountaineers. Like colorful Simone Moro, who, after
    forsaking the West Ridge and switching to the South Col, couldn’t take the crowds
    and turned around. “If I want to stand in line, I can go to the grocery store,”
    he would tell me later.


    In contrast to the annual trail of bodies up Everest, the most respected ascents
    in modern alpinism are undertaken by a small, undeterrable, unsupported team that
    pushes the limits of skill and stamina. They lead all the pitches themselves,
    make all the decisions, take all the risks, and carry all their own accoutrements.
    “Everesting” is in many ways the antithesis of the best 21st-century mountaineering:
    Sherpas put up all the ropes, Sherpas put in all the camps, Sherpas carry all
    the loads, Sherpas do all the cooking, and Sherpas escort the climbers to the
    top. The Sherpas want the work and are well paid for it, but outsourcing so many
    of the hazards and so much of the heavy lifting has turned climbing Everest into
    a form of trophy hunting. It’s like shooting an elephant. The elephant isn’t going
    anywhere. It will just stand there. And with enough bush beaters and a big enough
    gun, you can kill it.


