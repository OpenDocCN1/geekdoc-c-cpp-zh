    # **贡献者**


    CONRAD ANKER 是美国最著名的登山家之一。他于 1962 年出生于旧金山，首次攀爬的是 Big Oak Flat 附近的优胜山地花岗岩圆顶和陡峭岩面，他的曾祖父曾在那里担任先驱。他的父母是户外爱好者，鼓励他对攀登的热爱。Anker
    在追求全球范围内探险登山的同时，毕业于犹他大学。1999 年，攀登珠玛峰时，Anker 发现了早期英国探险家乔治·马洛利的遗体，马洛利最后出现在 1924
    年顶峰附近。他是《迷失的探险家》的合著者，也是国家地理电影《疯狂的梦想：征服珠玛峰》的关键人物。Conrad Anker 是 The North Face
    的专业运动员，住在蒙特拿州的博兹曼，与他的妻子 Jennifer Lowe-Anker 以及他们的儿子 Max、Sam 和 Isaac 生活在一起。


    THOMAS HORNBEIN 医学博士是华盛顿大学的医学荣誉教授。作为一名专注于呼吸生理学的麻醉学家，他一直在职业生涯中一直坚持登山。1963 年 5 月，他与美国首支珠玛峰探险队的成员
    Willi Unsoeld 成为首次经西脊登顶珠玛峰的登山者。此后，该山体的一处地形以他的名字命名：霍恩贝因谷（Hornbein Couloir）。Hornbein
    在《珠玛峰：西脊》中描写了他的攀登经历，该书于 2013 年为纪念探征 50 周年出版了第三版。在他进入第八个十年的人生之际，Hornbein 依然活跃于探索、攀登和山地环境保护。


    DAVID BREASHEARS 是一位电影制作人、登山家以及 GlacierWorks 的执行董事，该是一个关注喜马拉雅气候变化的非营利组织。1983 年，他从珠玛峰顶传输了第一批现场电视画面；1985
    年，他成为第一个两次登顶珠玛峰的美国人。他还共同执导并制作了第一部在珠玛峰拍摄的 IMAX 电影，该片于 1998 年 3 月首映，讲述了 1996 年悲剧性的登山季。他是《高海拔：对珠玛峰的持久激情》的作者，国家地理《最后一次攀登》的合著者，以及国家地理《珠玛峰：无情之山峰》的贡献者。


    ALTON C. BYERS 博士是一位国家地理探险家、山地地理学家、摄影师、作家和登山家，在世界主要山区拥有超过 30 年的工作经验。他的专业领域包括应用研究、基于社区的高山保护与修复方法，以及高山环境受气候变化的影响。


    BROUGHTON COBURN 在过去的 20 里于尼泊尔、西藏和印度从事开发、环境保护和保护区管理，并在萨加玛雅公园监督了多个慈善项目。他编写或编辑了七本书，包括国家地理的《珠玛峰：无情之山》以及关于埃德蒙·希拉利的传记《征服珠峰》。他与
    Jamling Tenzing 合作出版了《触摸父亲灵魂：一个夏尔人的之旅》。


    MARK JENKINS 是《国家地理》杂志的特约撰稿人，负责艰难或危险的任务。他写了四本广受好评的书——《的人生》、《艰难之路：前往廷布图》以及《地图之外》——Jenkins
    获得过许多文学奖项，包括国家杂志奖、班夫文学奖和美国登山俱乐部奖。他曾报道刚果的游击战、柬埔寨的地雷、博茨瓦纳的艾滋病以及澳大利亚的考拉，并从西藏到玻利维亚、从富汗到乌干达进行了
    50 多次登山探险。


    BRUCE JOHNSON 博士是妙佑诊所的医学和生理学教授，也是该诊所心脏疾病部的顾问。他经营人体环境生理学实验室，长期研究人类表现的限制因素。他在世界各地建立了移动实验室，包括南极、南美洲和尼泊尔。他在与健康和疾病相关的人生理学方面有很多著作和演讲。


    DAVID R. LAGESON 博士是蒙他拿州大学的地质学教授。他于 1980 年在怀俄明大学获得博士学位并在蒙他拿州大学教学和研究了 32 年。他的专业是构造地质学和构造。他是美国地质学会和伦敦地质学会的院士。


    BERNADETTE MCDONALD 曾任阿尔伯塔省班夫班夫中心（Banff Centre）的山文化副总裁，她创作了八本关于登山和山文化的书籍。她的奖项包括因《自由攀登者》获得的
    2011 年 Boardman Tasker 奖和班夫山地书展大奖；2010 年意大利 ITAS 奖，以及 2008 年、2009 年和 2012 年的印度
    Kekoo Naoroji 奖。美国登山俱乐部曾授予她山地文学领域的最高荣誉。在闲暇时间，McDonald 喜欢在山中攀登、滑雪登山和徒步。


