    I must admit that until the events of the 2012 season, and in spite of the tragedy
    of 1996 and some subsequent years, I was able to rationalize the growing numbers
    and pragmatically accept that guided climbing was as inevitable on Everest as
    on every other attractive mountain in the world. I reckoned that less experienced
    but fit people could be guided up Everest with a reasonable margin of safety.
    I was impressed that the mortality rate did not go up despite the increased numbers
    of novices. I attributed this relative success to the strategies adopted by thoughtful
    guide services working together, for example fixing ropes over any terrain where
    a fall could carry you off.


    I also imagined that the motivation of these current-day guided clients may not
    be all that different from my own. I had observed long ago that the intensity
    of this drive to succeed seemed to bear no relationship to the reasons driving
    us, whether to seek fame and fortune, to enjoy the intimidating beauty of one
    of Earth’s wild places, or simply to engage in some inner spiritual quest where
    one seeks an answer to the question “Can I?”\.


    One of the starkest contrasts between 1963 and now was captured by Mark Jenkins’s
    description of events in 2012 ([`Chapter 7](#Anke_9781426212413_epub_c07_r1.htm_c07)`
    and by photos, one of a thin, dark line: hundreds of climbers clipped to a fixed
    rope, snaking their way up the Lhotse Face and another showing climbers packed
    like sardines awaiting their turn to ascend the Hillary Step. Perhaps the biggest
    risk to climbing Everest these days is overcrowding and the risk of waiting in
    a queue, sometimes for hours. What fills me with even more dread is imagining
    that moment when these numbers high on the mountain intersect with the quirky
    forces of nature—a rogue storm, a massive avalanche—that are part of the roulette
    of climbing on big mountains. As with other natural disasters, perhaps the question
    is not whether but when.


    As a flatlander growing up in the Midwest, I met mountains when I was 13 and fell
    in love. That love has defined my life, not just as an amateur climber of mountains
    but also in many other ways—in my profession as physician, researcher, and educator
    and with my family and many others who have added seasoning and helped me to grow
    old with, I hope, a modicum of grace. When I was a teenager, Everest was part
    of my fantasy world, not a place I figured I’d ever see, much less climb upon.
    Looking back from this 50th anniversary, I feel blessed to have been born at the
    right time and given the opportunity to share in such an adventure at a time when
    the mountain belonged just to us.


    That Everest is past. Everest now, with its multitude, the social atmosphere at
    Base Camp and the ambience up high, is the antithesis of what mountains mean to
    me. My affair with this vertical world has been mostly a quiet one, wandering
    in wild places with like-minded companions. Even so, I think I understand the
    attraction this tallest of peaks has for those willing to brave its challenges;
    we share a similar fire to pursue dreams. This volume is aptly named—Everest “calls.”
    So turn the page, and let Conrad Anker get you started.


    # ![](OEBPS/images/Anke_9781426212413_epub_004_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_005_r1.jpg)


    ![](OEBPS/images/Anke_9781426212413_epub_006_r1.jpg)


    `USING A FIXED` rope for safety, mountaineer Conrad Anker descends an ice step
    in the Khumbu Icefall. Considered one of the most dangerous parts of the route
    to and from Everest’s summit, the icefall is located about a third of the way
    down the Khumbu Glacier on the Nepali slope of Everest.


    On May 26, 2012, I look down from the summit of Mount Everest to three glaciers
    that have sculpted the mountain. For the past nine and half hours I have been
    climbing the Southeast Ridge in near-perfect weather. At an elevation of 8,850
    meters, there is no higher place on our planet. The world literally drops away
    below. To the east, the robust Kangshung Glacier pushes moraine into Tibet and
    in the process creates small glacial lakes. To the north, the Rongbuk Glacier
    is solid in appearance, yet I know that it is moving, ever so slowly. To the south
    and west, the Khumbu Glacier, cascading down the southern flank of the Himalaya,
    provides sustenance to the people of Nepal and India. The frozen snow on which
    I stand may eventually join the Ganges, slowly making its way to the Bay of Bengal
    and the Indian Ocean. Perhaps this water will be recycled and deposited once again
    in the Himalaya to begin the timeless cycle of regeneration.


    Standing on the apex of our planet is humbling. I’m starved of oxygen, depleted
    of reserves, unable to eat, and bound by anxiety. This is a dangerous place. Yet
    the symbolism of standing on top of the world gives me a chance to experience
    time on a cosmic scale. During the half hour I spend on the summit, I reflect
    on the mountain—how it came to be, its significance to humanity, and my personal
    connection to Everest. For the third time I have the opportunity to stand at this
    unique spot on the planet.


    Humans frame time within the span of our own existence and, to a lesser extent,
    the history of humanity. We anthropomorphize time, as if what happens to humans
    is the only relevant measure. We are exhorted to live in the here and now. Yet
    on the upper reaches of the highest mountain, we live on borrowed time. Dillydally
    too long and we will die. When we face adverse situations, time is immediate.
    This immediacy provides a prism through which we can view our planet. How do we
    fit into the grand scheme of life? Everest, with its timeless immensity, highlights
    how insignificant human existence is. Standing on the summit, looking up through
    the troposphere to the blue, purple infinity of space, on a mountain of rock millions
    of years old, thrust up into the sky by a thin crust of earth floating on a moving
    mantle and carved away by gravity, I contemplate my place in the universe. I feel
    insignificant. The mountains seem to have conquered us long before we set foot
    on them, and they will remain long after our brief existence. This indomitable
    force of the mountains gives us humans a blank canvas on which to paint the drive
    of discovery and, in the process, test the limits of human performance.


    ## THE IRRESISTIBLE CALL


    Chomolungma, as the denizens who live within the shadow of Everest have referred
    to it for millennia, has always been revered as a spiritual abode. The mountain
    gained recognition within the Western mind only in 1849, when its measurements
    were announced by the Great Trigonometrical Survey of India. More than a century
    after it was quantified as the tallest point on Earth, Tenzing Norgay and Ed Hillary
    climbed Everest on May 29, 1953. After eight expeditions that cost 13 human lives,
    the goal had been reached at last—Earth’s third pole. This landmark of exploration
    signified the culmination of terrestrial exploration. We had crossed the seven
    seas centuries earlier, mapped the ranges and rivers in due time, and reached
    the axes of our planet at the turn of the 20th century. Now the last and ultimate
    landmark had been reached.


    The first ascent of Everest came at a time when humanity needed relief from two
    world wars. It was a unifying and inspiring event, signifying the drive to reach
    our greatest potential. Tenzing Norgay, a Sherpa born in the shadow of the great
    mountain, reached the summit with Edmund Hillary, an enthusiastic beekeeper and
    mountaineer from New Zealand. That an Easterner and Westerner teamed up for this
    historic ascent signified a new era of cooperation and a transition away from
    colonial rule. Times were changing, and Everest was symbolic of this change.


    ### AN AMERICAN DREAM

