    The base of Mount Everest is composed of igneous and metamorphic rocks that form
    the metamorphic core of the Himalaya, a giant slab of rock called the Greater
    Himalayan Sequence, easily observed along the trekking route from Lukla to Everest
    Base Camp. Dark metamorphic gneiss, a banded rock similar to granite, stripes
    the walls of deep gorges cut by the Dudh Kosi River. On the steep switchback trail
    leading up to Namche Bazar you notice swirled migmatites, a metamorphic rock that
    was once partially molten. The stone steps cut into the near-vertical hillsides
    between Namche Bazar, Phortse, and Tengboche provide fresh exposures of the metamorphic
    minerals and fabrics. As you approach Ama Dablam and beyond to the lower Khumbu
    Glacier, the proportion of white granite in boulders along the trail increases
    significantly. At Base Camp the landscape becomes monochromatic, a black-and-white
    vertical world of white granite and ice. This is the exhumed core, the innards,
    of the mountain belt—the upper crust of India that was detached, metamorphosed,
    and thrown back on itself to the south to form the Greater Himalaya.


    ## SOUTH TIBETAN DETACHMENT SYSTEM


    Two great faults, the Chomolungma and Lhotse detachments, are exposed across the
    Southwest Face of Mount Everest. Together they are called the South Tibetan Detachment
    System. In geologic terms, a fault is a fracture in the Earth’s crust that results
    in a demonstrable offset between the types of rock to either side of it. The narrow,
    brittle Chomolungma detachment lies at the top of the Yellow Band and carries
    the summit pyramid in its hanging wall. The wider fault zone of the Lhotse detachment
    lies between the granites and gneisses of the Greater Himalayan Sequence and the
    overlying Everest Series. North of Everest, these two faults merge and extend
    east-west for at least 400 miles.


    Geologists have determined that the Greater Himalayan slab was uplifted and tectonically
    unroofed through simultaneous motion on a major thrust fault at the base of the
    slab (exposed over 30 miles south of Everest) and the South Tibetan Detachment
    System at the top of the slab (in the Everest region). Called channel flow tectonics,
    the process is something like squeezing toothpaste from a tube, and the Greater
    Himalaya were literally extruded southward between these two great fault systems.
    What a story to ponder as one trudges in the rarefied air above the Western Cwm
    to higher regions on Everest! One is not merely climbing a mountain but climbing
    through the uppermost crust and across a major fault system that has literally
    detached the roof of the world from its deeper roots below.


    The relatively new model of channel flow tectonics has revolutionized our thinking
    about the structural geology and tectonic evolution of mountain systems. We now
    understand that great mountains not only wear away through the slow but relentless
    surface processes of glacier and stream erosion; they can also become tectonically
    eroded through large-scale detachment faults that literally decapitate the highest
    terrain.


    Three factors contribute to the modern-day uplift of the Himalaya:


    1. Continued collisions between the Indian and Eurasian plates at a rate of about
    1.5 inches per year;

    2. Tectonic unroofing and erosion of the Himalaya; and

    3. Relentless erosion of the southern aspect of the Himalaya caused by the annual
    summer monsoon from the Indian Ocean.


    The fact that climate, through long-term precipitation and erosion, can influence
    tectonic process operating miles down in the crust is a revolutionary concept.
    In this way, mountains are master teachers of geologic knowledge, and the Karakoram-Himalayan-Tibetan
    belt is truly one of the greatest geologic laboratories on Earth.


    I can think of no more fitting tribute to the poetry of Earth’s tectonic engine
    than the fact that this region, now called the top of the world, was once a tranquil
    seafloor, a subtropical habitat for the invertebrates that thrived in the warm,
    clear waters of the Tethys Ocean. Today modern rivers carry sediment, dissolvedions,
    and nutrients from the roof of the Himalaya back to the Indian Ocean, just as
    rivers did on Gondwana more than 400 million years ago. Perhaps some calcium ions,
    dissolved from the limestone on Everest, will make their way down the great river
    systems to the Indian Ocean and be used in the construction of a new calcium-carbonate
    shell of another seafloor creature. Perhaps this little creature will find its
    way to the top of a new mountain range formed by the eventual closure of the Indian
    Ocean as another continent crashes into India in a couple of hundred million years
    or so. This is how it works and how it has always worked with the Earth: a grand
    circle of recycling and evolution that includes both the organic and inorganic
    world, interwoven through deep geologic time.


    ## A MOUNTAIN IS BORN


    Of the Karakoram-Himalayan-Tibetan belt, we can cite a number of geologic superlatives:
    It contains the highest mountains on Earth (14 are higher than 8,000 meters, just
    over 26,000 feet), the greatest relief of any continent, the highest uplift rates,
    the largest concentration of glaciers outside the polar regions, the world’s highest
    and biggest plateau, and the source of many of the world’s greatest river systems.
    Little wonder that this region has attracted geologists since the early days of
    exploration and surveying. We can see the evidence of past collisions on continents
    around the world, but the enormous elevation of the Himalaya, coupled with deep
    erosion, provides unparalleled opportunities to study the inner workings of an
    active, evolving collisional mountain belt, a veritable tectonic work in progress.


    Mount Everest is a magnificent testimony to the power of nature. It boggles the
    mind to think that, through the complete rearrangement of Earth’s continental
    and oceanic plates, ancient ocean-floor sediments could be lifted up into the
    summit of the highest mountain on Earth over the course of 400 million years.
    As I stood at the foot of Mount Everest in the Western Cwm, the mountain seemed
    everlasting and solid, built on a base of granite and capped by a crown of limestone.
    Chomolungma, the goddess mother mountain, will surely endure all that nature throws
    at her, just as her summit parts the jet stream with a flowing banner of snow.


    But Chomolungma is only a temporary mark on the landscape, like everything in
    geology. Chomolungma is an unfinished geologic symphony. She will continue to
    morph and change through time, perhaps growing higher before eventually succumbing
    to erosion, gravity, and glaciers. It’s impossible to predict when, but another
    Himalayan peak will eventually assume the title of roof of the world, and then
    after that, and another after that. Such change is inevitable on a dynamic, living
    planet. Change is why we exist in the first place, and why we have the privilege
    to ponder it all.

