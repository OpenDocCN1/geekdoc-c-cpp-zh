  trans: '


    1996 年是一个太多人丧生的年份。那场引起广泛关注、导致 11 人遇难的灾难，遗憾地定义了 20 世纪 90 年代的珠穆玛。许多人分析了导致那个悲剧之夜晚的事件顺序。人们指责声不断。但与大多数山地悲剧一样，多种因素共同导致了结果。无疑，在登顶当天，线上的人太多，导致了交通拥堵和严重的延误。通信问题引发了对谁该做什么、何时做什么的困惑。有些向导客户的经验没有达到应有的水平，因为在史诗般的下撤过程中，他们较少依赖固定绳索和手拉。两支商业探险队领队之间的竞争——新西兰向导兼“冒险顾问公司”老板罗布·哈尔（Rob
    Hall）和美国人“疯狂山脉”领队斯科特·菲舍尔（Scott Fischer）——可能也发挥了作用。菲舍尔是山上的新面孔，而资深珠穆玛向导哈尔每年都能成功让他的客户登顶，除了前一年。这种压力一定非常巨大。当哈尔和他的客户在
    8000 米以上停留得过久时，他违背了自己的生存规则。在前一年，他遵循了这些规则，尽管没有人登顶，但每个人都安全返回。而在 1996 年，他的团队中有四人（包括哈尔本人）在下撤遇难。


    菲舍尔在他小组登顶当天生病了，削弱了他照顾客户的能力，并让他与俄罗斯向导安纳托利··布克里夫（Anatoli Boukreev）共同制定的策略受到质疑。布克里夫负责从前面引导，菲舍尔从后面跟随。这种策略对于病中的菲舍尔来说无法成功。客户需要更多的支持。


    山上的其他登山者观察到，所有向导都穿着相对轻便的衣服，这表明他们可能对自己快速上下山的能力过度自信。


    珠穆玛向导攀登的费用可能影响了一些客户爬到了精疲力竭的地步。他们负担不起返回。


    最重要的因素无疑是风暴。根据一些人的说法，那是世纪风暴。另一些人则认为这只是珠穆玛上常见的另一场风暴。无论风暴多么猛烈，它与登顶日之前发生的所有个人因素——疾病、违反规则、误解、缺乏技巧、疲劳——结合在一起，了一场完美的风暴。那天晚上有九个人失去了生命。如果不是布克里夫一次又一次冲入夜色，去救援在暴雪中南脊蜷缩的登山者，会有更多人丧生。罗布·哈尔并没有那么幸运。在帮助一名登山者登顶后，他的氧气瓶冻结了，他死在了暴雪中。


    ```

    ![](img/Anke_9781426212413_epub_046_r1.jpg)

    ```


    ****强劲的珠穆玛之风**，让向导安纳托利··布克里夫在 1996 年攀登期间接近希拉里台时，手中握着的绳索飞了出去。他一年后在尼泊尔中北部的安纳普尔纳峰的一场雪崩中去世。


    # 马洛里旁的声音


    1999 年 5 月 1 日，我坐在马洛里身边，向东方向望去，如果他和欧文在 1924 年 6 月 8 日登顶，他们本会采取的下撤路线。我想象着马洛里即使在极端情况下也有意识：没有无线电与他人交流，没有固定绳索链引导他下山，没有休息好并准备好进行救援的登山者团队，没有办法告诉世界究竟发生了什么。


    我只能猜马洛里和欧文的最后时刻是什么样子的，但我知道的是他们的成就如何影响了我们的登山传奇。他们最后一次攀登的胆识为未来铺了垫脚石。关于氧气的争议及其最终被接受，使得他们的后继者——包括希拉里和丹增额玛——能够以合理的安全余量访问高海拔地区。


    有时在深夜，我想通过发现马洛里，我是否助成了一个谜团的终结。这种可能性困扰着我。我的发现是否在某种程度上夺夺了 1924 年探险队的一些神圣的光辉？


    其他人可能会这么想，但对我来说，这一发现只是增加了对这些先驱登山者的钦仰。他们的故事——永远无法被完整讲述——一直包裹在珠穆玛峰（“雪山之母”）的秘密之中。我感到很荣幸能为这个谜团投射新的光。最终，马洛里和欧文最大的成就是激励性的，因为即使在失败，他们壮丽的尝试也向我们展示了人类精神的极限。


    **—康拉德·安克** 康拉德·安克被誉为顶尖登山家。在国家地理学会和北面公司的资助下，他带领了 2012 年的“遗产攀登”珠穆玛，以纪念 50 年前第一支美国小组登顶。


    # 永恒的先驱


    尽管这十年被不幸的悲剧占据，但还有许多人接受了珠穆玛的挑战并成功了，有时是以非常独特的方式。在本世纪初，澳大利亚人蒂姆·麦卡特尼-斯内普（Tim Macartney-Snape）从孟加湾开始了他的旅程，并步行（有时是游泳）走完全程到达山脚，然后登顶。1990
    年，吉姆·惠特克（Jim Whittaker）领导了“和平攀登”，这是一项中、美、苏的联合行动，让 20 名登山者登上了顶峰。同年，第一对夫妇登顶了山，斯洛文尼亚资深登山者玛丽亚和安德烈·斯特雷费尔日（Maria
    and Andrej Stremfelj）险些胜了竞争对手——美国人凯西·吉布森（Cathy Gibson）和她的俄罗斯丈夫列克谢·克拉斯诺库茨基（Aleksei
    Krasnokutsky）。


    1991 年，英国电影制作人李·迪金森（Leo Dickinson）乘坐热气球飞越珠穆玛，拍摄了一些史上最美的照片。次年 4 月 22 日，帕桑·拉姆（Pasang
    Lhamu）成为第一位登顶珠穆玛的尼泊尔女性——在她的第四次尝试。但她的故事并没有好的结局。她成为了国家英雄，但在下撤时去世，带走了谢巴夏姆·庆（Sonam
    Tshering），他是三个孩子的父亲。类似的命运也降临在英国登山者艾莉森·哈格里夫（Alison Hargreaves 身上，她在 1995 年无氧登上了那座山。遗憾的是，她在同年
    8 月从 K2 峰下撤时丧生。


    ```

    ![](img/Anke_9781426212413_epub_047_r1.jpg)

    ```


    **法国滑雪板运动员马可·西弗雷迪（Marco Siffredi）**在 2002 年 9 月 9 日乘坐滑雪板滑下珠穆玛。前一年，他曾成功滑雪板滑下诺顿冲廊（Great
    Couloir）。他回来尝试更具挑战性的霍恩因冲廊（Hornbein Couloir），但再也没有出现。


    在 1996 年《稀薄空气》灾难发生的同年，资深珠穆玛登山家兼获奖电影人大卫·布雷希斯（David Brehears）在珠穆玛拍摄了第一部 IMAX 电影。同年，由布鲁斯·赫尔德（Bruce
    Herrod）、凯西·奥道德（Cathy O’Dowd）和伊恩·伍德尔（Ian Woodall）组成的南非队首次将南非旗插在山顶。但布鲁斯·赫尔德在此过程中失去了生命。当纳尔森·曼德拉总统致电大大营祝贺登顶登山者时，整座山的人都停下来倾听。当他得知他们还在山上时，他要求他们回电，甚至在国家广播中开始给出电话号码！幸运的是，他们的大营经理切断了那段传输，让整座山的人付之一笑。


    同样在 1996 年，由谢尔盖·安蒂平（Sergei Antipine）领导的来自西伯利亚的强大俄罗斯小组在山北脊和东北脊之间攀登出了一条大胆的新线路，并在第一次尝试就成功了。坡度在
    65 度到 90 度之间。


    同年，瑞典登山家格尔兰·克罗普（Göran Kropp）骑着一辆特制的、载着 240 公斤装备的自行车，从斯德哥尔姆骑到加德满了 7000 公里，然后登上了珠穆玛峰。他度过了最惨痛的珠穆玛季节，却在西雅图附近的岩石攀爬中去世。


