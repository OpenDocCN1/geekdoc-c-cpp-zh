    1951 年，肖普顿受邀带领另一次前往珠穆玛峰南侧的探险活动。同行的有一支英国精英团队，以及几位新西兰人，其中包括埃德蒙·希拉里。他们几乎立刻遭遇了被称为“昆布冰川”的、极度不稳定且错综复杂的雪与冰川混合体。肖普顿认为这条路太危险了，但希拉里不同意，他说：“我知道尝试攀登这座山的唯一方法就是改变旧的安全标准和合理的风险标准，迎接突如其来的危险；义往向前。小心和谨慎永远无法在冰川中开辟出路线。”他们成功穿越了冰川到达西冰谷（Western
    Cwm），但一个横跨整个山谷的巨大裂缝让他们被迫折返。


    回到加德满都后，肖普顿得知瑞士人已经获得了来年的许可证，这意味着他必须等轮。当瑞士人在 1952 年尝试登珠穆玛峰时，肖普顿只好满足于附近的乔秀如峰，他和他的团队并未登顶。与此同时，瑞士人几乎触及了珠穆玛峰顶顶。雷蒙德·兰伯特和丹增·诺尔盖登上了东南脊，距离顶峰仅
    800 英尺。肖普顿出发前往巴伦山谷和阿鲁山谷进行探险访问，而不是回到家负责第二年的登顶尝试，而这一决定被证明了他的致命错误。


    英国人比以往任何时候都决心在 1953 年让某人登顶。在总部，委员会对此焦急如焚。他们*必须*征服这座大山。到底出了什么问题？在经历了这么多尝试后，一定缺少了某些关键要素。啊！一定是领导力的问题。也许一个军人可以很好地组织这项工作。他们向肖普顿和约翰·亨特上校提议共同领导，而亨特是一个高海拔经验有限的人士。肖普顿当场辞职了。这显然是一种轻视——甚至是一种侮辱。但也许委员会是对的。查尔斯·沃伦写道，尽管他对肖普顿怀有无尽的尊重，但这个决定可能是正确的。“我个人可以理解为什么他最终没有被选来这样做——事实是，到那时，他的心已经不在那里了。他已经发现了通过南柱到达顶峰的路线，作为一位伟大的探险家，他已经完成了自己的使命。对他来说，重要的是发现，而不是征服。”


    ## 声音


    ### 马洛里要去哪里？


    乔治·马洛里在珠穆玛峰去世后，他的姐姐们秘密询问父母是否知道“乔治是什么样的人”，是否完全理解他以及妻子露丝。现在——当我们翻遍马洛里写过的每一个已知文字，重述了他的生平，并对他最后一次攀登进行了无尽的审查，甚至探究了他的性取向——我们是否仍然知道他是一个怎样的人？我们几乎只从登山的术语中记得他，但——与今天的职业登山者相比——他实际花在攀登上的时间是片段性的。这并不是说他在岩石攀登上不，也不是说他没有从山峦以及在山上建立的友谊获得强烈的精神支持。但当生活中还有这么多事情时，不能说马洛里“为山而活”。我们或许应该再次审视他的故事，抛开那种传统的观念，即他在这座标志性山峰上的早逝是他个人追求的终结……


    ### 一个迷人的男人


    从朋友及其他人撰写的马洛里讣文中，你可以看到一个拥有强烈道德良知、诚实、勇气和一种不经意魅力的男人。爱他的人最频繁使用的词汇是：敏感、聪明、侠义、顽皮，以及正如我们预期的那样，无畏。科蒂蒂·桑德斯对他“对美之渴求”感到欣喜，说没有人比他更有鉴赏的才华。另一个反复出现的词是“内省的”。杰弗里·杨赞扬“他的教育能量，他坚韧的内省精神，这种精神能追溯每一项兴趣的源头，除了自我利益……”乔治被亲切地称为“加拉哈爵”；但他的圣杯是像看起来那样的世界最高峰，还是更高层次的文化与理解？我们知道露丝是来世的坚定信者，通过相信他正准备迎接更好的东西，她发现更容易接受自己的失去。


    在许多方面，马洛里是一个发育缓慢的人。尽管天赋从一开始就几乎存在，但他花了时间来驾驭这些天赋。这让他的死更具悲剧性：如果他活着，我们本可以看到更多。令人遗憾的是，对于他在国际联盟联合或校外研究委员会工作期间的计划，以及这两个机构是否相互关联，我们仍然只是一个模糊的画面。他热烈地相信教育的解放作用，但他可能倾向于政治——谁知道呢？凭借他显而易见的魅力，即使在电视时代之前，我们可以想象他通过讲堂和广播接触更广泛的观众。他本可以是像《智力信任》（The
    Brains Trust）这类热门节目的候选人。无法想象他在 30 年代和 40 年代处于职业巅峰时期可能产生怎样的影响。


    ## 历史铭记


    如果他自己回顾自己短暂的人生，可能会认为自己失败了。即使他想成为作家的愿望在世时也成果有限，尽管现在我们已经读了他在给家人和朋友的信中高产记录的每一个字——而且知道他拥有跨越世代的交流天赋。


    更多的纪念品不断出现……当我写下这些时，另一封在他最后一次离开前几天写下的信正在 eBay 上出售。最近出现了一把珠穆玛峰冰斧，其来源是马洛里为`巅峰俱乐部`（Pinnacle
    Club，一个 1921 年成立的专门女性俱乐部）提供的帮助。传言暗示还有其他的亲密信件。乐观地想，我想我们可以了解到更多。


    —奥德丽·塞尔德，英国作家奥德丽·塞尔德写过许多关于登山和探险的书。


    ## 丹增与希拉里


    当英国团队在明年请求丹增·诺盖的服务时，他最初并不愿意去，他对兰伯特太忠诚了。但这位瑞士登山者鼓励他：“抓住机会吧。和谁并不重要。”查尔斯·埃文斯和汤姆·布多隆在
    1953 年接近成功，到达海拔 875 米的南峰，但他们的氧气瓶不可靠。奖项留给了这对奇特的组合：身高 6 英尺的埃德蒙·希拉里和身高 5 英尺的夏尔巴丹增·诺盖。他们在
    1953 年 5 月 29 日首次登顶珠穆玛峰。这是一个团队协作的结果。前一天，乔治·洛伊、阿尔夫·格雷高里和昂·尼玛每人携带超过 40 磅物资，一直切到海拔
    8500 米的最后营地，为希拉里和丹增提供支持。在卸下货物后，他们留给两人最后晚的准备。第二天早晨 6:30，希拉里和丹增走出帐篷，背起 30 磅的氧气装备，连接上面具，开始向上爬。一切顺利，直到他们遇到了一个看起来险严的障碍——后来被称为`希拉里台阶`”。希拉里在前，丹增随其后。从那里开始，他们只需要沿着山脊向上爬，直到没有可以爬的地方。

