    In the spring of 2012 I talked with many climbers awaiting their first try for
    the summit. I met a single mother of three who explained that dreaming of the
    Everest adventure had got her through her toughest moments. Her children were
    grown and she was at Base Camp, trembling with excitement and full of apprehension.
    I also met a businessman who admitted matter-of-factly that he disliked everything
    about climbing, but was determined to get his made-it-to-the-top bragging rights.


    I think about the enormous sacrifices these inexperienced climbers make, the expenses
    and time away from home and family. Yet this high-risk challenge demands preparation,
    teamwork, and training that enhances the rewards and value of the ascent. We become
    more acutely attuned to one another’s actions and opinions, yet also independent
    and self-aware. In the end, however, every climber, whether heavily supported
    or not, must face the same cold and wind and make the same treacherous trips up
    and down the mountain. Everest is never an easy or comfortable experience. It
    requires fortitude to complete an unfamiliar challenge with all the inherent risks:
    thousands of feet of exposure, rockfall, ice collapse, avalanches, fast-moving
    storms.


    ![](OEBPS/images/Anke_9781426212413_epub_078_r1.jpg)


    FILMMAKING HAS BEEN a tradition on Everest since the earliest climbs. British
    Capt. J. B. Noel` photographed and filmed two expeditions in the 1920s, including
    George Mallory and Sandy Irvine’s fateful attempt in 1924\. He screened his films
    in North America, spawning early interest in the call to Everest.


    Every year people die on the mountain. The summit attempts of spring 2012 left
    ten dead—some from inexperience or simple mistakes, some because their desire
    to reach the summit overrode internal circuits warning them to stop and turn around.
    From afar we judge and blame the victims for bad decisions and unpreparedness.
    But nobody goes there to die. Climbers get swept up in an all-consuming desire
    to reach the summit, willfully ignoring signals that say it’s time to turn around.
    It’s hard to make disciplined decisions in a hypoxic, sleep-deprived, and dehydrated
    state.


    What are we seeking in that thin air? Is it an experience that we earn through
    craft, training, and perseverance? An escape from the dulling rituals of our lives
    down below? An extreme adventure? A transformative personal journey? Or just a
    feather in one’s cap? Whatever one seeks, the ultimate goal, after all, is to
    return home safely. But while on that mountain, for those few glorious weeks,
    the climber experiences the simple rhythms of life, being and staying alive, the
    rising and setting of the sun, seeking food and shelter. We become more aware
    of changes of the weather and our bodies’ needs and limitations. Our lives depend
    on it. A day’s success is often attained by a simple repetitive act: Can you put
    one foot in front of the other? And after a few heaving gasps for air, can you
    do it again? You come away from this step-by-step struggle enriched by the surprises,
    the friendships forged along the way, and above all new knowledge of yourself
    and of our inherent resilience and fortitude.


    # THE CALL OF EVEREST


    Someone can certainly cast a negative image on the mountain based on today’s concerns.
    But I will never see it like that. Perhaps the mountain will be overrun and overused.
    Or perhaps it will fall out of vogue, no longer a prize, eclipsed by other more
    prestigious and less common adventure challenges. In the end, I don’t think it
    matters. Mount Everest can’t be diminished. It can’t be overrun. It isn’t ours
    to control. We don’t have the ability to change the shape of the mountain, but
    only to transform the idea of the mountain itself. The narrative of our experiences
    there is tightly woven into the fabric of our collective imagination. Will it
    remain so after the 20,000th ascent?


    The monolithic ice-draped rock we call Everest is a towering screen onto which
    we project our hopes, dreams, and aspirations. But behind the screen is a cold,
    remote, disinterested peak that doesn’t care if we scale it or not. It won’t bend
    or break because of our presence or willfulness.


    When I recall my first ascent in the fading afternoon light in 1983, the experience
    seems so innocent and private. Yet I can understand, and even anticipate, the
    deep satisfaction of the 10,000th person who reaches the summit, no matter what
    motivation takes him or her there. Intent is a private affair.


    We human beings will forever yearn for transcendent experiences that fleetingly
    set us free from the complexity and confusion of everyday life. My hope is that
    the individuals who make the journey to this great mountain bring to it the experience,
    skills, and respect that it commands and deserves.


    # VOICES


    ## DAWN ON MOUNT EVEREST


    One thing I hope will never change is the view on a clear day from the summit
    of Mount Everest just as the sun begins to rise. Change is inevitable, but there
    is something special about a sunrise on top of the world. I can remember the frigid
    air, the type that takes your breath away—and I was already struggling to breathe.
    There was a persistent wind biting at the small bits of exposed flesh on my face,
    and the blue light of morning seemed to drag on forever. In the distance I could
    see a glow of color beginning to form on the horizon and then the tip of a triangular
    shadow slowly emerging across the view west. The sun’s radiating strength warmed
    my smile as it crested the horizon, and I watched as the western expanse danced
    in the morning light. Slowly the shadow of the highest mountain in the world concealed
    everything in its path below. The triangle blanketing the mountains below, an
    indication that its presence is the highest, will always be unique to Mount Everest.


    CLIMBERS APPROACH THE


    KRISTOFF ERICKSON a team member of the Legacy, Kris Erickson is a photographer.
    After summiting Everest on May 25, 2012, he and teammate Hilaree O’Neill went
    on Third Step, which lies at the base of the final pyramid, 500 feet from the
    summit.


    ![](OEBPS/images/Anke_9781426212413_epub_079_r1.jpg)


    ## FILMMAKING HAS BEEN


    # FURTHER READING


    Anker, Conrad, and David Roberts. *The Lost Explorer: Finding Mallory on Everest*.
    Simon & Schuster, 1999.


    Astill, Tony. *Mount Everest: The Reconnaissance 1935, the Forgotten Adventure*.
    Tony Astill, 2005.


    Bass, George. *Everest: 50 Years on Top of the World*. HarperCollins, 2003.


    Bonington, Chris. *Everest Expeditions*. London, Weidenfel and Nicolson, 2002.


    Breashears, David. *High Exposure: An Enduring Passion for Everest and Unforgiving
    Places*. Simon & Schuster, 1999.


    Breashears, David, and Audrey Salkeld. *Last Climb: The Legendary Everest Expeditions
    of George Mallory*. National Geographic, 1999.


    Byers, A. C. “Contemporary Human Impacts on Alpine Ecosystems in the Sagarmatha
    (Mt. Everest) National Park, Khumbu, Nepal.” *Annals of the Association of American
    Geographers* 95(1), pp. 112–140, 2005.


    Coburn, Broughton. *Everest: Mountain Without Mercy*. National Geographic, 1997.


    Coburn, Broughton. *The Vast Unknown: The First American Ascent of Everest*. Random
    House, 2013.


    Coburn, Broughton. *Touching My Father’s Soul: A Sherpa’s Journey to the Top of
    Everest*. HarperSanFrancisco, 2000.


    Davis, Wade. *Into the Silence: The Great War, Mallory, and the Conquest of Everest*.
    Knopf, 2011.


    Fisher, James F. *Sherpas: Reflections on Change in Himalayan Nepal*. University
    of California Press, 1990.


    Fürer-Haimendorf, C. von. *The Sherpas of Nepal: Buddhist Highlanders*. John Murray,
    1964.


    Gansser, A. *Geology of the Himalayas*. Interscience Publishers/John Wiley and
    Sons, 1964.


    Gillman, Peter, ed. *Everest: The Best Writing and Pictures from Seventy Years
    of Human Endeavour*. Little, Brown and Company, 1993.

