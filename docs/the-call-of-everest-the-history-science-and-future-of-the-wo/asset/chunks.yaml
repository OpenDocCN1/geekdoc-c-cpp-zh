    He spent a month on the Tibetan Plateau, training his body to be content with
    little oxygen. But within several hours of setting off from his advance base camp
    at 6,500 meters, he almost lost his life when he fell into a crevasse. After extricating
    himself, he continued up the North Ridge and the next day traversed the massive,
    avalanche-prone North Face to gain the Great Couloir, where he bivouacked one
    more time. At 1 p.m. the following day he collapsed in the snow beside the Chinese
    tripod on the summit. He made the entire ascent without bottled oxygen, and this
    time alone. Dreadfully, frighteningly, alone. On his way down to his Canadian
    girlfriend, Nena Holguin, who was waiting at advance base, Messner realized that
    he had reached an apex in his career that none of the remaining 8,000-meter peaks
    that he would climb would ever match.


    ## VOICES


    ### SPRING MADNESS

    On May 19, 2012, Canadian Shriya Shah-Klorfine added her body to the 200 or more
    corpses that litter the flanks and ice fields of Mount Everest. Three others died
    that day, old and young, men and women, a German, a South Korean, and a Chinese.
    Urged by her Sherpa guides to turn back, Shah-Klorfine insisted on reaching the
    summit, which she did, though it meant her death on the descent. Still, undeterred
    by the tragedy, that season another 200 climbers from a dozen nations strapped
    on their boots and eagerly walked to heights where the air is so thin that humans
    cannot long survive. Each season, the pattern remains the same. Most will return.
    Some may not. For every 30 climbers who have reached the summit of Everest, 1
    has perished in the quest.


    ### THE RISKS ON EVEREST

    What are the ingredients of this perfect storm that brings death to the mountain
    every spring? First, there is the pressure of time. The climbing season on Everest
    is short, a mere two months squeezed between the end of winter in late March and
    the onset of the monsoon in early June, with the optimal window for summit attempts
    being but three weeks in May. Second, there is the structure and geography of
    the mountain. The highly technical routes on Everest—the North Face, West Ridge,
    the legendary Kangshung Face—defy all but the most accomplished of Himalayan climbers.
    For commercial expeditions, and for the vast majority of climbers, there are only
    two viable options. Those who climb from the south follow the tracks of Edmund
    Hillary and Tenzing Norgay, who in 1953 trekked through Nepal, made their way
    through the notorious Khumbu Icefall, and climbed the ice face of the Western
    Cwm to reach the South Col before enduring a brutal final ascent that famously
    took them to the summit of the mountain. From Tibet, climbers follow the footsteps
    of George Mallory and Oliver Wheeler, the first Canadian on Everest. It was Wheeler
    who in 1921 discovered the doorway to the mountain from the north, up the East
    Rongbuk Glacier to the North Col, and from its crest a long slog up the shoulder
    of the North Ridge to the Northeast Ridge and ultimately the base of the summit
    pyramid.


    Neither conventional approach is easy, and each has unique perils. In 1922 seven
    Sherpas, swept to their deaths in an avalanche, became the first of many to perish
    on the face of the North Col. On the Nepal side the Khumbu Icefall is a maze of
    giant seracs that collapse randomly in the heat, crushing climbers with disturbing
    regularity. These hazards aside, the challenges of both popular routes are for
    the most part less technical than physical. Few of those strung out along the
    length of the Western Cwm, plodding their way to the South Col, would consider
    attempting K2, Nanda Devi, Kangchenjunga, Chomolhari—all far more difficult Himalayan
    peaks. On Everest, raw endurance counts for more than skill with a belay. Long
    before any client sets out for the summit, the guides in support establish a continuous
    ribbon of fixed lines stretching the entire length of the route; the client need
    only clip in and trudge up a well-trodden track. Easier said than done, of course.


    The danger is the very wrath of the mountain, the extremes of elevation and weather.
    Frigid nights give way to blistering days, and with the scorching sun, there is
    a constant danger of dehydration. As Charles Howard-Bury, leader of the 1921 expedition,
    famously quipped, on Everest “your feet can be suffering from frost-bite while
    you are getting sunstroke at the same time.” Then there is the matter of oxygen.
    At 8,850 meters, atmospheric pressure at the summit of Everest is a third that
    of sea level. For the early British explorers, this distinguished the challenge
    of Everest from the quest for the Poles. It was one thing to face conditions of
    extreme cold and bitter exposure. It was quite another to do so while moving not
    laterally across landscape but vertically to heights where the very air itself
    could not sustain life. Climbers call it the death zone. Every minute one spends
    there weakens the body and increases the likelihood of injury or death.


    ### OVERCROWDING

    Hence the tragic events of that weekend in May that led to the death of four climbers.
    Each of the approaches taken by commercial parties has one serious impediment.
    The Northeast Ridge is blocked by the Second Step, a formidable pitch of vertical
    rock that must be scaled even as the climber peers down to a knife-edge of ice
    and rock—exposed on one side to the Kangshung Face, a drop of 10,000 feet, and
    on the other to the North Face, a mere 9,000 feet. On the southern route is the
    Hillary Step, equally daunting with similar exposures. Today, fixed ropes on the
    Hillary Step and a ladder on the most difficult section of the Second Step make
    things easier, but neither obstacle can be turned, and on each there is room for
    only one person at a time. With as many as 300 climbers making their summit attempts
    in a single day, both routes take on the feel of traffic jams. The Hillary Step
    and the Second Step become bottlenecks, literal choke points where climbers can
    end up spending hours in the death zone, exposed at high altitude, waiting their
    turn. According to reports from the mountain, on the day that Shriya Shah-Klorfine
    died, delays stretched to over three hours even as the weather turned, leaving
    exhausted climbers exposed to severe cold and winds gusting to 80 miles an hour.
    It is remarkable that only four were lost.


    I often wonder what the early Brits would have thought of today’s rather sordid
    commercial scene. In 1921, Mallory and Wheeler had to walk 500 kilometers off
    the map across the Tibetan Plateau just to reach the base of a mountain that no
    European had embraced at close quarters. When Wheeler first crested the North
    Col, he encountered a wind unlike anything he had known. Scarcely able to stand,
    fearful of suffocating in the swirling eddies of snow, he focused on his breathing,
    drew his hands around his face, and with a discipline long ago honed in the terror
    of shellfire on the Western Front slowed down the world until a new rhythm could
    be found and air inhaled during the lulls between the blasts of the gale.


    They soon came to know what the conquest of Everest would demand. To the horror
    of the old guard at the Royal Geographical Society, codgers who for the most part
    had never climbed higher than their desks, George Finch in 1922 argued that the
    “margin of safety must be narrowed down, if necessary to the vanishing point.”
    A climber on Everest must drive himself beyond exhaustion, “even to destruction
    if need be.”


    “We must remember,” George Mallory wrote on the eve of his return to Everest in
    1922, “that the highest of mountains is capable of severity, a severity so awful
    and so fatal that the wiser sort of men do well to think and tremble even on the
    threshold of their high endeavor.”

