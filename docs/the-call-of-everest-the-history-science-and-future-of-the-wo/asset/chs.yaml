  ## 实现不可能


  雷因霍德·梅斯纳选择了 1980 年季风后的一段平静天气，独自进攻北壁。但天气并不是他选择这一特定时间的唯一原因。此前在加德满满与喜马拉雅事务记录者伊丽莎白·霍利（Elizabeth
  Hawley）的一次随性聊天中，他得知日本登山者上村有独自登顶珠穆峰的计划。梅斯纳提前了计划以确保抢先到达。





  他在青藏高原度过了一个月，训练身体以适应低氧环境。然而，在从海拔 6500 米的前大营出发后后的几个小时内，他因掉入冰缝而险些丧命。脱离险后，他继续向北脊攀登，第二天横穿了巨大的、极易发生雪崩的北壁，到达了大冲谷（Great
  Couloir），并在那里又露了一次营。第二天下午 1 点，他倒在山顶中国三脚架旁的雪地里。他在没有携带任何瓶装氧气的情况下完成了整个攀登过程，而且完全是独自一人。那是极其可怕的、令人胆寒的、独自一人。在下山去在前大营等待他的加拿大女友内娜·霍尔奎因（Nena
  Holguin）的途中，梅斯纳意识到他已经达到了职业生涯的巅峰，他此后攀登的任何其他 8000 米级高峰都将无法企及。


  # 声音


  ### 春季狂热

  2012 年 5 月 19 日，加拿人什里亚·沙赫-克洛夫因（Shriya Shah-Klorfine）将自己的身体加入了珠穆玛峰山坡和冰川上的 200 多具遗体。那一天还有三人去世，有老有少、男女都有：一名德国人、一名韩国人和一名中国人。在夏尔巴向导的劝说返回时，沙赫-克洛夫因坚持要登顶，她确实做到了，尽管这意味着她在下山途中失去了生命。尽管如此，人们并未被悲剧所阻，那个季节，又有来自十几个国家的
  200 名登山者系上靴子，热切地走向那些空气稀薄到人类无法长时间生存的高度。每个季节，模式都如出一辙。大多数人会回来。有些人可能不会。每有 30 名登顶珠穆玛峰的登山者中，就有
  1 名人在追求过程中丧生。


  ### 珠峰的风险

  每当春天给这座大山带来死亡的“完美风暴”，其构成要素是什么？首先是时间压力。珠穆玛峰的登山季节很短，仅挤在 3 月下旬冬季结束到 6 月初季风开始之间的两个月内，而冲刺登顶的最佳窗口仅为
  5 月的三周。其次是山体的结构和地理特征。珠峰上的高技术性路线——北壁、西脊、传奇的康东壁——令除了最顶级的喜马拉雅登山者以外的所有人都望而生畏。对于商业探险和绝大多数登山者来说，只有两条可行路线。从南侧攀登者遵循埃德蒙德·希拉里和丹增仁·诺尔盖的足迹，他们在
  1953 年徒经尼泊尔，穿过臭名昭著的昆布冰川，攀登西库姆谷的冰面到达南山口（South Col），随后在经历了那段闻名世界的最后艰难冲登后，登了山顶。从西藏出发，登山者则遵循乔治·马洛里（George
  Mallory）和首位登上珠峰的加拿大人利弗·惠勒（Oliver Wheeler）的足迹。是惠勒在 1921 年发现了从北侧进入山的大门：沿着东荣布曲冰川向上到达北坳（North
  Col），然后从山脊沿着北脊肩部长距离跋涉到达东北脊，最终到达山顶金字塔形的基座。


  哪种常规路线都不容易，且各自都有独特的危险。1922 年，七名夏尔巴在雪崩中被冲落死亡，成为在北坳面遇生的许多人首批。在尼泊尔侧，昆布冰川是由巨大的冰塔组成的迷宫，它们在热量中随机崩塌，以一种令人不安的规律压碎登山者。除了这些危险之外，两条热门路线的挑战大部分是体能上的而非技术上的。在遍布整个西库姆谷长度、艰难向南山口行进的登山者中，很少有人会考虑尝试
  K2 峰、南达德维峰、洛子群峰或乔莫哈里峰——这些都是困难得多的喜马拉雅高峰。在珠峰上，纯粹的耐力比保护绳技巧更重要。在客户出发登顶很久以前，后勤向导就会建立好一条贯穿整条路线的固定绳索；客户只需扣上绳扣，在踩实的小径上艰难向上即可。当然，这说起来容易做起来难。


  危险来自于山本身的怒火，即海拔和天气的极端。寒冷的夜晚之后是酷热的白天，由于灼热的阳光，面临着持续的脱水危险。正如 1921 年探险队队长查尔斯·霍华-伯里（Charles
  Howard-Bury）著名的调侃道，在珠峰上，“当你遭受中暑的同时，脚可能正在遭受冻伤。”然后是氧气的问题。在 8850 米处，珠峰顶的气压只有海平的三分之一。对于早期的英国探险家来说，这使得珠峰的挑战与极地探索区分开来。面对极寒和严酷的暴露是一回事，而在并非横向跨越景观，而是垂直移动到空气本身无法维持生命的高度完全是另一回事。登山者称之为“死亡区”。在那里停留的每一分钟都会削弱身体，增加受伤或死亡的概率。


  ### 过度拥挤

  这就是为什么 5 月那个周末发生了悲剧性事件，导致四名登山者遇。商业登山采取的每条路线都有一个严重的障碍。东北脊被“二台阶”（Second Step）阻挡，那是一个令人生畏的垂直岩段，登山者在攀爬它时必须俯瞰下方如刀刃般的冰岩边缘——一侧暴露在深达
  10,000 米的康东壁，另一侧则是仅有 9,000 米的北壁。在南线路上有“希拉里台阶”（Hillary Step），同样令人生畏且具有类似的暴露风险。今天，希拉里台阶上的固定绳和二台阶最困难段的梯子让情况变得简单了一些，但这两处障碍都无法绕行，且每个地方一次只能容纳一个人。当多达
  300 名登山者在同一天尝试登顶时，两条路线都出现了交通拥堵的感觉。希拉里台阶和二台阶变成了瓶颈，字面意义上的阻塞点，登山者可能在死亡区停留数小时，在高海拔暴露等待。根据山上的报告，在沙赫-克洛夫因去世的那天，由于天气恶化，延迟持续到了三个小时，让精疲力竭的登山者暴露在严寒和时速
  80 英里的狂风中。只有四人遇难，实属奇迹。




  我的思考也转向了那些见证了我们对这座山痴迷的人。我曾遇到过一位住在珠穆玛峰下修道院的尼尼，她在隐居修行中度过了 45 年，将整个生命奉献于诵读一句祷文。对于那些为了登顶世界之巅而准备牺牲一切的人来说，这种精神上的奉献似乎是对人生命的浪费。大多数西藏人同样无法理解，为什么有人会选择步行到那些空气稀薄到让意识被抹灭的高度。刻意进入“死亡区”，冒着失去自我转化机会和逃离轮回境界的风险仅仅是为了爬一座山，这对他们来说是愚蠢的，是对宝贵转世的真正浪费。正如绒布寺的方丈在描述
  1922 年英国探险队时写道：“他们在山脚下扎营，然后，我听他们每升高一级就要扎营七次，他们费尽巨大的努力，利用铁钉、铁链和铁爪等魔法技巧，在巨大的痛苦中，手脚冻僵……[一些]人早早离开切断肢体，其他人则顽强地继续攀登……看到他们为了如此毫无意义的工作遭受如此痛苦，我深感大大的慈悲。”


