  为什么科学家要将数百公斤的设备背在牦牛和挑夫背上，在珠穆玛峰建立实验室？珠穆玛峰的极端环境会对人体产生极端反应。更好地了解人体在这些条件下如何调节，可以带来更好的治疗——以及更好的装备。当登山者在测试身体极限时，科学家对人体的适应极限感兴趣——简而言之，他们这样做。为了应对海拔挑战，学习身体如何适应极端缺氧（hypoxia），并发现当身体不适应时会发生什么，我们梅奥医学中心有机会与《国家地理》和“北面”合作，以前所未有的观察人们在攀登珠穆玛峰时身体发生了什么变化。





  但这些技术也应用于更日常的场景，例如治疗充血性心衰竭、睡眠障碍、肺部疾病或其他疾病的医院和诊所，这些疾病与登山者在高海拔地区经历的缺氧（即缺乏氧）相似。


  ## 高海拔挑战


  高海拔究竟是什么对身体构成了挑战？


  17 世纪，在意大利物理学家伽利略的工作之后，物理学家埃万杰利斯塔·托里里切利（Evangelista Torricelli，1608–1647）确定我们上方的空气是有重量的。大约同一时期，物理学家罗伯特·波义（Robert
  Boyle，1627–1691）等人发现，空气重量（或气压）决定了我们肺部及随后血液中的氧气含量。这解释了在高海拔生存的挑战：气压驱动氧气进入血液，而登山者感受到的痛苦源于气压的严重缺乏。


  在探索海拔如何影响身体之前，我们必须首先了解身体在地球表面如何处理和利用氧气。我们将氧气吸入肺部，从那里氧气进入血液，运输到需要氧气运行的身体器官。血红蛋白是红细胞中的一种金属蛋白，负责在全身运输氧气。流经身体的血液返回肺部以吸入新鲜的含氧空气，这意味着平均而言，肺部的氧气量大于动脉中的氧气量。


  氧饱和度值（衡量血液中氧气含量的指标）通常在 95%到 100%之间。在海平面上，很难憋气足够长的时间以导致这些数值大幅下降。当数值下降到 85%到 88%以下时（这在慢性肺病患者中经常发生），通常需要使用便携式或家庭氧气来维持正常的生活质量。


  在地球表面几乎任何地方，大气中的氧含量保持稳定在 21%。事实上，从海平面到地球大气层边缘（地面上方 62 英里，或 100 公里），空气中的氧气水平几乎保持不变。改变的是气压，它随着海拔的增加而按比例下降。珠穆朗山大本营的气压约为海平面的一半；在山顶，则仅为海平的三分之一。换句话说，在高海拔吸入每口空气所含的氧气都比海平面少。因此，肺部和血液中的氧气水平随着大气压的下降而平行下降。10,000
  英尺（3,000 米，大多数珠穆朗山登山队的起点上方）的正常氧饱和水平在 88%到 90%之间。在睡眠期间，由于呼吸变慢，这些水平可能会下降到 84%以下——低于许多肺病患者使用辅助氧的节点。


  在高海拔登山时，肺部和动脉之间氧水平的平衡尤为重要。体力活动增加了红细胞通过肺部的速度，从而缩短了血液在肺部补充氧气的时间。运动和高海拔的结合对身体产生了双重压力，爬得越高，压力就越大。（我应该在此指出，任何个体适应高海拔的能力会有巨大差异，取决于多种因素，包括遗传、整体健康和居住海拔，以及水分水平等许多情境因素。）


  ## 高山之舞


  身体能够应对中度的海拔变化。例如，得益于血红蛋白的独特特性，在 8,000 到 10,000 英尺（2,500 到 3,000 米）的高度范围内，气压的变化只会轻微降低体内的氧饱和度。但在更高的高度，缺氧可能会导致严重的——甚至是致命的后果。如果没有适应过程带来的益处——换句话说，如果一个人从海平面快速移动到极端海拔，大多数（如果不是所有）人在
  15,000 英尺以上就会生病。他们在 18,000 英尺处可能只能保持 20 到 30 分钟意识，在珠穆朗山顶只能维持 1 到 2 分钟。


  ![](img/Anke_9781426212413_epub_054_r1.jpg)


  **英国登山者斯特芬**韦纳布斯（STEPHEN Venables）在 1988 年无氧攀登珠穆朗山东坡（沟面后，体重减轻了 20 磅。长时间在高海拔会导致体重迅速减轻，其中包括肌肉流失。


  为了避免高山症最严重的影响，大多数计划登顶珠穆朗山的登山者会在山脉和健康之间进行为期六至八周的艰苦“舞蹈”。这种适应舞蹈包括逐渐上升到大本营，随后多次转到越来越高的高度，登山者缓慢地推高“缺氧压力”，希望刺激身体适应更高海拔。虽然身体变得越来越能适应极端海拔，但在珠穆朗山大本营及以上的高度停留过久，会导致肌肉功能退化和肌肉流失。因此，必须在适应高度和维持肌肉状态之间寻求平衡。一些登山者甚至会短时间回到较低的海拔，以恢复一些肌肉力量。适应方案主要是通过试错法开发的，利用了人体惊人的适应能力，特别是在较短的时间窗口内。


  ### 立即防御


  身体如何应对血液中氧水平降低和输送到组织的氧气量减少？输送到组织的氧气量是几个因素共同的结果：红细胞的数量（`血红蛋白水平`）、血红蛋白与氧气的结合程度（`动脉氧饱和度`）以及心脏输出（`心率`和`每次心搏输出量`）。


  氧水平下降的首要反应几乎立即发生。呼吸加快，增加了吸入空气的量。这提高了肺部及随后血液中的氧水平。心率也会上升，使更多血液进入身体，并增加向组织的氧输输。此外，人在到达高海拔后不久，尿量增加，部分液体可能会从血管内转移到血管外。这减少了血液中的水分，并使红细胞浓度增加。这反过来增加了单位体积血液运输的氧气量。然而，血液中液体减少会导致每次心搏输出量的下降。（这一过程的副作用是脱水，这会增加急性高山症（AMS）的可能性，其症状为头痛、恶心和疲劳。因此，在高海拔地区大量饮水至关重要。）


  红细胞中的血红蛋白分子根据许多因素产生不同的作用：例如`pH 值`、`二氧化碳水平`、`血液温度`。这些血红蛋白的特性对于身体适应高海拔的方式起着重要作用。例如，随着高海拔呼吸的增加，血液中的二氧化碳含量下降，到登山者到达珠穆朗山顶时，其含量可能仅为正常值的分之一。这导致血液变得偏碱性（使`pH
  值`升高），并改变了血红蛋白结合氧分子的能力。这使得高海拔的红细胞尽管肺部氧压较低，也能更好地吸引并结合氧气。同样的因素也会影响氧气向组织的释放。




  对低氧水平的其他反应还包括肺部血管收缩，这会升高肺部和心脏右侧的压力。这种效应几乎是时发生的，但可能会随着时间的推移和海拔的增加而继续上升。虽然肺部高血压在长期可能会产生负面影响，但在短期内，它可以将血液重新分配到肺部的更多区域，增加气体交换的总表面积，使氧气进入血液并将二氧化碳排出到肺部。


  ### 长期适应


  随着高海拔“压力”的持续，人体许多对氧敏感的基因、蛋白质和细胞会调节身体的适应方式。其中一种蛋白质（称为`hypoxia inducible factor 1
  alpha`，或 `HIF-1 a`）的刺激会引发全身的一系列连锁反应，包括刺激一种控制红细胞产生的激素（促红细胞生成素，`erythropoietin`）。这增加了血液的载氧能力。


  ![](img/Anke_9781426212413_epub_055_r1.jpg)


  在通往大营的途中，图克拉（Thukla）山口处立着石碑或佛塔（chortens），纪念在珠穆玛峰去世的登山者和夏尔巴人。这些纪念碑满了经幡，像是一个清醒的提醒：并不是每个人都能从大山上回来。


  其他长期变化还包括肾脏排泄碳酸氢盐的能力增强，它可以缓冲血液 pH 值的波动。这种关键的适应降低了血液的 pH 值，允许呼吸在海拔地区的几周内逐渐增加到越来越高的水平。此外，肌肉中载氧蛋白肌红蛋白（`myoglobin`，血红蛋白的亲戚）也有所增加。毛细血管（分支血管）与肌肉纤维的比例可能会增加，并提高向肌肉供氧的能力。（肌肉由许多较小的纤维组成。）许多登山者在极端海拔会经历快速体重和肌肉流失。（在毛细血管数量不变的情况下肌肉萎缩，可能解释了毛细血管纤维比例的增加。）


  # 声音


  #### 珠峰之过夜


  我想我是自作自受。我是我自己的野心、弱点、寒冷、海拔……的受害者。我为在傍晚时继续前行付出了代价。下午的某些时刻，我以为我正面临着最恐惧的 ing——冲向世界之顶却发现自己已经没有余力下山了。在南峰陡峭的山坡上进行了一次疯狂、盲目的滑行后，我在一种狂野、喘息、像离开水的鱼般的恐慌中瘫倒了，在雪里挖了一个洞，只是坐在那里剧烈地颤抖，感到非常可怜自己。


  但那是一个危险的足点，我知道我必须控制局面，不再做一个受害者。黄昏时分，我向下爬到了山脊上较平缓的部分。随着黑暗笼罩大山，我打开了头灯，努力回忆 10 小前上山时路过的那些半记忆半忘的岩石。（由于不知道正确的正常路线，我们爬的是一条更陡峭、更直接的线路，在“阳台”（The
  Balcony）上方某处进入了东南凸脊。）最后，我决定等黎明比较安全。于是，我开始了漫长的颤抖。


  起初，我坐在一块石头上。石头暖一些——我知道这一点。但这块石头是倾斜的，我渴望——不，是我们渴望——我那想象中的年长同伴和我——平躺下来。而且我也知道，双腿水平伸直对循环有利。于是我们站起来开始挖；但我们太累了、太虚弱了、太渴望躺下了，在雪里只挖出一个五英尺长的平台，就弯着膝盖面对康卓宗峰（Kangshung
  Face）坐了下来。


  到那时，天至少已经黑了一个小时，在曙光到来前我还有七小时的“囚禁”。我后来算出海拔大约在海平面以上 8,550 米。五月份的夜间温度：零下 30 到 40 度摄氏度之间。生存机会有多大？嗯，其实并不糟。下午的暴雪已经平息，空气很宁静……


  尽管我从未计划或想过在珠峰上露营，但这种严酷的可能性一直潜伏在那里，未曾说出口。我仔细考虑了我的每一层衣服。现在我小心地用备用手套垫臀部和头部——在我的骨头和阴冷渗透的寒意之间增加额外的隔热。我把把长冰镐插进雪里，像栅栏桩一样防止我在夜里翻滚。


  有一种说法，如果你在这些情况下睡着了就永远醒不来……我想在某一个时刻我确实睡了一会儿，但我并没有死。尽管大多数时间里我处于一种半意识的 limbo 状态，漂浮在半理性的联想迷雾中……偶尔，我的理性意识会把我惊醒并驱散幻影。我强迫自己吃了几块心心杏仁巧克力棒——里面一定有热量。我吸了水瓶里最后一点半冻结的液体。我想过摘掉冰爪和靴子按摩一下木化的脚趾，但决定风险太大了——最好专注于照顾我的手。我一直颤抖着。但这感觉并不比我在
  14,000 英尺下方最糟糕的高山冬夜露营更糟：我被海拔麻醉了。无论如何，我不再是一个受害者：我只是在耐心地等待黎明。


  —史芬·维纳布斯。1988 年，登山者、作家和励志演讲家史芬·维纳布斯成为未使用辅助氧气登顶珠穆玛峰的英国人。


  ### 多高持续多久？


  高海拔暴露的真正极限是什么？许多人将冲顶珠峰的过程称为“适应”，而另一些人则认为身体变得更擅长“忍受”极端环境。这就是为什么在历史上，很少有长期社区能在极端海拔生存。事实上，全球范围内没有海拔高于
  17,000 英尺的永久定居点。（作为对比，珠峰大营位于 17,500 英尺。）大多数即使接近该高度的社区都是围绕工业建立的（矿业镇、铁路社区或天文台），并与海拔相关的持续问题作斗争。最高的永久矿区社区是秘鲁南部的里纳达（La
  Rinada），海拔在 4,900 至 5,200 米之间。西藏的一些村庄位于类似的海拔，但大多数定居点在 15,000 英尺以下，这似乎是维持健康和繁殖的阈值。即使是夏尔巴村庄也低于
  15,000 英尺（即 4,600 米）（丁波切海拔 4,400 米，菲里奇海拔 4,240 米。）


  住在世界上最高高原地区的西藏人和安第斯人为人类如何适应极端海拔提供了一个有趣的对比。尽管我们不知道这两个群体在高海拔生活了多久，但共识是西藏人先定居高原社区，因此在自然选择和适应高海拔方面他们有更大的机会。这两个族群都适应了它们的环境，并且在静息时的能量消耗看起来相对正常，即使在
  4,000 米的高度，运动能力也相当充足。这与大多数住在海平的健康成人形成了鲜明对比，在这些海拔下，运动能力会下降 20% 到 30%。



  然而，这两组可能通过不同的手段实现了这种适应。例如，西藏人的呼吸频率似乎比安第斯山人更频繁，且肺部血流量也更大，尽管他们的平均血红蛋白水平和氧饱和值较低。与安第斯人相比，西藏人似乎不易患与高原生活相关的两种疾病：慢性高高原病（CMS），在这种疾病中，红细胞数量增加到血液变得粘稠，心脏难以将其泵遍全身；以及肺动脉高血压，这是
  CMS 的风险因素。缺氧可能随着时间的推移，促进有助于适应过程的基因选择选。科学家们尚不知道，西藏人显然更完全的适应是否是因为他们在高海拔地区生活的代数较多。发现这些适应的遗传基础可能有助于找到帮助身体耐受低氧水平的新方法（这对许多患者至关重要），或者可能帮助识别出那些在高海拔地区表现良好或将面临高风险的人。


  ![](img/Anke_9781426212413_epub_056_r1.jpg)


  **1963 年攀登者巴里**（BISHOP）在那次历史性的攀登中永久地失去了脚趾。得益于设备的改进，多年来的冻伤率已经降低。


  ## 补充氧气


  在珠穆玛山上使用氧气仍然存在争议。多年来，许多人认为攀登者没有补充氧气无法生存，但莱因德·梅斯纳（Reinhold Messner）和彼得·哈贝勒（Peter
  Habeler）在 1978 年证明了事实并非如此。在登顶珠峰的 3500 多人中，约有 5%的人是在没有氧气的情况下完成的。尽管如此，登山者在不使用氧气的情况下登顶死亡风险几乎是别人的两倍。


  托马斯·霍恩因（Thomas Hornbein）博士是 1963 年美国征珠峰远征队的成员，他估算了补充氧气的影响。梅奥医学中心的研究人员最近利用 2012 年远征的数据和如
  985 年模拟攀登珠峰的结果，对这些发现进行了建模。在这项研究中，一个由 27 名调查员组成的团队在压力舱内“攀登”了 40 天，仿佛到达了顶峰。结果显示，使用补充氧气的登山者在山顶时的缺氧压力水平低于他们在大营静息且无氧气状态下的水平。在氧气支持下，在四营尝试睡眠的登山者其氧饱和度水平实际上保持在
  90%的中期到高位之间，接近海平值。因此，补充氧气产生了巨大影响，尽管有些人可能会说，六周的极端缺氧适应会导致肌肉利用所输送氧气的能力下降。


  ![](img/Anke_9781426212413_epub_057_r1.jpg)


  **马克·詹金基斯**（MARK JENKINS）正在学习使用氧气面罩系统。在大营，可用氧气量只有海平的一半；在山顶，仅为 33%。在登顶珠峰的人中，有 5%是在没有补充氧气的情况下完成。


  ## 终极实验室


  在实验室模拟极端条件是非常困难的，甚至是不可能的。野外是人类生理学与环境结合的终极实验室。很少有压力舱可以模拟真实的高海拔条件，包括不可预测的温度波动、湿度变化，以及脱水、体力活动和心理压力等人类因素。在珠峰的野外工作与高度控的实验室条件形成了补充。野外环境中较不可预测的条件可能会导致以前未被考虑或探索的观察和发现。


  ### 2012 年的研究及以后


  在美国人首次登顶珠峰五年后，名字和面孔已经变了，但攀登的挑战以及破解高原生理学科学秘密的热情依然活跃如初。五十年前，该攀登“团队”由 19 名成员组成，其中包括
  5 位拥有硕士学位、5 位拥有博士学位、3 位医生以及一群经验攀登者及其支持人员。对于高海拔暴露的医学方面的研究（主要是认知和心理测量），研究对象基本上就是团队成员。支持工作在当时和现在都是一项持续的挑战，但国家地理学会、国家科学基金会、美国空军、海军研究办公室、美国国务院教育与文化事务局、美国陆军后勤兵团以及美国航空航天局（NASA）都为
  1963 年的攀登提供了大量的资金支持。


  今年的团队的人数相似，并拥有多个资金来源，包括来自国家地理学会和北脸（The North Face）公司的大力支持。团队成员包括生理学家和地质学家、精通重症监护和飞行医学（美国空军）的医生、一名研究助理、经过仔细挑选的北脸和国家地理运动员、运动员摄影师、摄像师、博主、北脸公司的产品创新专家以及一位国家户外领导力学校（NOLS）的高级野外教员。


  ### 远大目标


  北脸公司根据全球顶尖运动员的反馈开发产品，这些人在极端和不利的环境中挑战人类表现的极限。这种对珠峰等极端环境下人类表现的关注，成为了北脸与梅奥医学中心建立关系的契机，因为梅奥医学中心在此类研究方面也有深远的历史。梅奥的研究人员在早期理解飞行生理学和飞行员健康防护措施方面发挥了关键作用。虽然研究人员可以从慢性疾病（健康谱系的一端）中学习很多，但我们相信，从研究那些处于健康谱系另一端的极佳运动员身上，也能获益良浅。


  ![](img/Anke_9781426212413_epub_058.jpg)


  ![](img/Anke_9781426212413_epub_059_r1.jpg)


  **精英登山者艾米莉·哈林顿**（EMILY Harrington），2012 年北脸/国家地理远征队成员，正在进行肺功能测试。团队的任务之一是研究高海拔的表现极限。


  梅奥医学中心的研究人员对 2012 年珠峰远征设定了几个目标。其中之一是更好地理解人类在极端海拔的表现极限。他们还想确定睡眠生理变化（快速眼动睡眠量或夜血氧水平下降）与高原反应的关系。他们研究了肺液调节和肌肉流失，并合作评估了设备和服装对运动员睡眠生理和表现的影响。对缺氧的研究补充了梅奥医学中心针对患者进行的临床研究。登山者佩戴的设备即使在艰难攀登时也轻便不干扰，这使得能够
  24 小时持续监测参与者，并为我们提供了极端条件下更动态、全面的视角。研究人员在远征期间收集了约 270 亿个数据点。


  ### 我们学到了什么


  令人惊讶的是，我们从极端海拔适应性生理学中学到的知识，可以应用于多种慢性疾病的治疗。特别是，我们的实验室一直关注慢性心力衰竭患者，这种疾病的特征是泵血功能不理想。





  美国心脏协会估计，2010 年，美国有约 600 万患者遭受了心力衰竭，费用接近 4000 亿美元。每年约诊断出 70 万例新病例。心力衰竭是联邦医疗保险（Medicare）受益者中最常见的诊断结果，这类患者的入院率和再入院率非常高。这种复杂疾病的成因是累积且广泛的（例如：高血压、心脏发作、睡眠呼吸暂停、酒精、病毒）。目前的许多治疗方法和药物针对身体对心力衰竭的反应，而不是对心脏产生直接的治疗影响。


  因此，心力衰竭与高海拔极端环境之间的相似性非常引人注目。《国家地理》驻记者马克·詹金斯（Mark Jenkins）的一句引用描述了在极端海拔攀爬的感觉：“在每只脚底部用胶带粘两块砖，嘴里含一根吸管，然后冲上几层楼梯——当然，只能通过吸管呼吸。如果你发现自己像赛马一样大口喘气，鼻翼张开，口水直流，心脏在胸腔里像电锤一样敲击，双腿像水泥袋一样沉重——欢迎来到高海拔。”高海拔最常见的症状包括运动后呼吸困难、极度疲劳、睡眠困难和呼吸困难、虚弱和不适、外周水肿、肺充血、头痛、恶心以及头晕或头轻——许多症状与心力衰竭患者看当地医生的症状相同。


  当攀登者到达高海拔时，一个位于颈部附近的微小而复杂的器官——动脉体，会感知血液中氧气的变化，并告诉大脑立即增加呼吸。动脉体还会刺激神经系统，类似于应激反应。这会引发体内的一系列过程，例如神经系统活动增强以及肾上腺素等介质的释放。最近的显示，心力衰竭后由于心脏泵血功能下降导致的血流减少，会刺激动脉体的反应，这种反应与在高海拔地区将低血流感知为缺氧的情况相似。这种相似性还延伸到心力衰竭患者中动脉体受刺激引起的过度呼吸，以及作为应激反应刺激神经系统。


  高海拔暴露与心力衰竭之间还有更多相似之处。高海拔适应的关键——过度呼吸（或通气过度）会负面影响大脑血流，导致脑血管收缩和血液中二氧化碳浓度降低。因此，动脉体告诉大脑呼吸与大脑试图减少呼吸以改善自身血流之间出现了一场斗争。这种拉锯战在夜间群聚呼吸（cluster
  breathing）期间发生发生，导致类似于睡眠呼吸暂停的发作——即一个人停止呼吸超过十秒钟。通常，高海拔的攀登者会喘着气醒来，这种状态被称为高海拔周期性呼吸。心力衰竭患者经常出现类似的呼吸形式，称为陈因-斯托克斯呼吸（Cheyne-Stokes
  respiration），表现为一阵喘气后是深呼吸。与这种疾病相关的还有中枢性睡眠呼吸暂停（CSA），在心力衰竭中很常见。高海拔的呼吸暂停不仅会导致更频繁的醒来和更差睡眠，还会导致夜间血氧水平更深的波动。这可能会增加缺氧应激反应。珠穆峰项目的一个假设是，这些波动导致了更大的应激反应和更高的海拔相关疾病风险。心力衰竭中的陈因-斯托克斯呼吸和
  `CSA` 均与较高的死亡风险相关。


  ## 高海拔与心力衰竭


  如果高海拔攀登者的肺血管收缩，他们也会面临问题。这会导致肺部高血压状态，即肺动脉高压，反过来又会导致高海拔呼吸困难增加，并导致肺部积水，即高海拔肺水肿（`HAPE`）。`HAPE`
  是一种危及生命的状况，遭受此症的攀登者可能被撤离山脉。`HAPE` 的报道发生率从约 2%到 70%不等，取决于上升的速度、最终海拔、攀登者睡眠的高度以及肺液检测的方法。在快速上升到
  4,500 米的情况下，`HAPE` 的发生率最可能接近 12%到 15%。


  同样，心力衰竭患者经常有肺充血，包括肺部积液。这通常是因为左心室功能下降导致血液和压力在肺部回流。


  身体调节肺部液体的方式是一个复杂的话题，但最近对攀登者的研究可能提供一些启发。一些研究表明，高海拔暴露可能导致大多数攀登者的肺液轻微增加。然而，只有在少数情况下，这种情况实际上会恶化为危及生命的
  `HAPE`。应激介质（如肾上腺素）的释放和更深呼吸可能会增强液体的清除。其他近期研究表明，一种用于哮喘等慢性肺疾病患者常用的吸入药物——β受体激动剂（beta
  agonist）——可能会刺激高海拔下的液体清除并降低肺水肿的发生率。这种药物长期以来被认为对心力衰竭患者有负面影响，但实际上可能也能帮助他们清除液体。


  虽然慢性心力衰竭患者的动脉血氧饱和度值相对正常，但心脏泵血能力降低导致供应的氧气流失严重；只有少量氧气通过血液循环进入组织。此外，中枢性睡眠呼吸暂停可能会导致夜间氧水平额外波动。这可能在病情严重的心力衰竭患者中产生一种类似于缺氧（氧气缺乏）的状态。


  心力衰竭和高海拔都会导致输向人体器官和组织的氧气量显著减少。在珠穆朗峰顶顶，健康运动员组织的氧气输送似乎与海平面上相对健康的心力衰竭患者相似。


  ## 未解之谜


  在最近的探险中，与 1963 年的探险一样，攀登者在攀登珠穆峰期间的许多日夜中遭受了苦难。大多数人必须克服疾病、失眠、天气延、情绪和恶劣条件才能到达世界最高峰的顶。与
  1963 年一样，攀登者的生理功能和心理功能根据这些挑战进行了记录、分类和分析。如何以及为什么有些人能成功登顶，而另一些人不能？为什么有些人能适应低气压，而另一些人不能？答案还不清楚。


  但我们可以从珠穆峰中汲取经验，并将其应用于人类适应和健康的更广泛领域。极端海拔为研究缺氧对人体的急性和慢性影响提供了一个重要的模型。科学家通过每次探险都能获得微小但重要的知识增长，这些贡献被整合到医学知识中并改善患者护理。2012
  年的珠穆峰探险涉及了新一代研究人员，他们将继续这项拓展医疗领域的激动事业。






  `CONRAD ANKER ORGANIZES` 在大营整理物资，登山者在这里花时间适应海拔，然后为冲顶做准备。作为团队领袖，他不仅要面对物流问题，还要做出艰难的决定，例如何时尝试冲顶以及何时等待。


  大吉·惠特克（Big Jim Whittaker）虽已 83 岁，但依然精神矍，他依然相信珠穆玛峰的魔力。


  “在我站在顶的第二天，我们收到了肯尼迪总统的电报，”惠特克说道，随后背诵道：“感谢你们将人类的耐力和经验推向最远的边界……我知道所有美国人都会和我一起，向我们勇敢的同胞致敬。”


  1963 年 5 月 1 日，大吉在尼泊尔夏尔人纳旺·贡布（Nawang Gombu）的陪伴下，成为第一个登上珠穆玛峰的美国人。他们走的是南柱路线，这条路线是十年前新西兰人埃德蒙·希拉里和夏尔人丹增·诺尔盖在首次登顶珠峰时开辟的。三周后，以一次前所未有的大胆尝试，惠特克的队友汤姆·霍恩贝（Tom
  Hornbein）和威利·昂索尔德（Willi Unsoeld）爬上了一条完全未知的路线——西脊。就在同一天，巴里·毕肖普（Barry Bishop）和鲁特·杰拉斯塔德（Lute
  Jerstad）完成了美国人的第二次登顶南柱路线。两支队伍成功会合了，但那时已经是深夜，他们被迫在海拔 28,000 英尺处露营。在没有帐篷、睡袋、炉子、氧气、水或食物的情况下，没有人相信他们能活下来。


  “上帝，他们太幸运了，”惠特克说，“如果当时有任何风，他们都会死掉。那将太可怕了！”


  所有四个人都幸存了——尽管昂索尔德和毕肖普丧失了 19 个脚趾和两个手指——1963 年的探险队成了一个美国式的英雄成功传奇故事。


  ## 珠峰 50 年后


  五年后，如山般高大的吉姆·惠特克正走向这座世界最高峰，纪念那次远征的成就。我们在风中的路径上相遇，随后在费里村（Pheriche）坐下，那里是通往大营途中一个尘土飞扬的游客村庄。


  “尽管希拉里已经爬过南柱，但那里什么也没有，”惠特克回忆道，“我们必须睁大眼睛爬。我们知道必须穿过冰川瀑。我很讨厌那里。那是杰克去世的地方。但我们必须在那里开辟一条路线，我们确实做到了。在更高的地方，我在洛子峰壁工作了三周来开路。我们领领路线，然后固定了自己的绳索。”当我回答说现在的珠峰已与当年不同，现在是夏尔人从大营到顶峰固定线路，且
  95%的登山者都是客户时，他点了点头，乐观的神情未减。


  “我依然敬佩那些登上珠穆玛峰的人。那是艰苦的工作，而且仍然存在危险，”惠特克说，“在某种程度上，我认为他们得到的和我们当年得到的一样。他们正在了解身体的极限。大自然在教他们。他们正在学习我们星球的美丽，也许这会让那些混蛋去保护它。”


  ### 奖杯之争


  珠峰的商业导览始于 20 世纪 90 年代初，与一百多年前阿尔卑斯山的登山协助并没有太大区别。马特洪峰 99%的登顶都是向导登山。（今天，大多数著名山峰——白布朗峰、雷尼山、丹纳峰、乞力马乔罗——的登顶都是向导。）南池巴扎已成为喜马拉雅山的采尔马特，而夏尔人像之前的瑞士人一样，从游客、徒步者和登山者的涌入中获利丰厚。尼泊尔政府也是如此，他们向每位珠峰登山者收取
  1 万美元的峰顶费。惊讶的是，珠峰客户登山者的急剧增加，导致攀登这座山的统计风险也随之急剧下降。回到 1986 年，当我第一次带领一支优秀的登山者团队尝试珠峰时（我们在北坡到达
  8,000 米处被雪崩击退折回），如果你是登顶者，你有大约 10%的死亡率——比打仗的概率还糟糕。现在不到 2%。


  惠特克本人曾是一名向导，他以对珠峰商业化的积极观点结束了我们的交谈：“人们付 10,000 美元爬珠峰完全没问题。支持他们吧。他们可能会在非洲杀死灭危物种，只为了某些恶心的布恩和克克莱特奖杯。”


  奖杯。这个词会像刺根一样扎在我心里，直到那次远征结束。


  # 声音


  ### 传承使命


  在我出生之前，珠穆玛峰就是我的一部分。我的父亲巴里·毕肖普于 1961 年首次前往尼泊尔，参加了埃德蒙·希拉里爵领导的阿玛达布拉姆（Ama Dablam）银小屋探险活动。那在我出生五年前。团队在明波冰川海拔
  18,000 英尺处过冬，收集了将成为高海拔生理学开创性研究的数据。我的母亲莉拉（Lila）带领了她从加德满到珠峰大营的首次徒步支持 1963 年的美国珠峰远征，从那以后一直带领高海拔徒步。珠穆玛峰在许多方面都成为我们家无意识的基石：这坐山通过父亲
  1963 年的登顶定义了他的登山生涯，终身的友谊围绕着这坐山建立，无数由珠峰聚在一起的人们开启了冒险。我小时候时，我们家人在尼泊尔的山区里帐篷里住了两年，而现在我们已经在喜马拉雅地区工作、徒步和登山了
  50 年。我根本不记得没有喜马拉雅山曾织入我们生活的时光。


  我的父亲是美国珠峰远征队（AMEE）的成员，我很幸运能追随他的足迹，分别在 1994 年和 2002 年登顶珠穆玛峰，并在 2012 年春季尝试从西脊登顶。今年
  5 月是美国人首次登顶珠穆玛峰 50 周年。


  ### 在珠峰中成长


  与其说我选择了珠峰，不如说是珠峰选中了我。我的父亲是国家地理学会的摄影师兼科学家，也是一位著名的登山者——他是我的英雄。在他样的家庭长大对我留下了不可磨的影响。我记得小时候看《美国人登珠峰》，那是国家地理制作的第一部电视节目。它记录了美国人首次登顶那座山，由奥森·威尔斯旁白。我被征服世界最高峰的宏伟冒险所迷住。





  在一个形象非凡、简历写满一页又一页的父亲下长大是一件微妙的事情。对我父亲的自豪与钦佩，伴随着一种恐惧——因为他的靴子如此大，以至于想要填满它们似乎是一项艰巨的任务。我记得早年和父亲一起去
  `Tetons` 攀登时，每当我处在暴露的悬崖或山脊上时，恐惧就会笼罩着我。随着年龄的增长，对暴露环境的恐惧逐渐让位于对冒险和未知的渴望。回首过去，父亲带给我最大的礼物不是技术指导，而是一种态度：只要你迈出第一步并对过程投入精力，任何冒险都是可能的，触手可及的。我的第一次`Himalaya`远征有着宏大的目标：攀登`珠穆峰`。当被问及从父亲身上学到最多的是什么时，答案不是技巧或技能，而是对自己定能成功的坚定信念。失败与胜利标记了随后的探征，但父亲从小赋予给我的这种态度，才是他在山山上留给我最大的礼物。


  尽管在我还是个孩子时，这些登山者已经是我的英雄了，但直到我 27 岁时开始自己的`Everest`攀登，我才完全理解了这些男人的意义，特别是他们的`1963 年珠穆峰远征`。当我穿过那些在记忆中由于早年照片就已熟悉的地形时，内心涌满了钦佩与情感。这些早期的登山者不仅在几十年的攀登和数百次登顶后积累了关于这座山的知识，他们还是一脚脚印地赢得了对路线的认知。我记得
  26 岁时，在 26,000 英尺的高空从`Geneva Spur` 往`Camp IV` 时，我顶着沉重的氧气设备艰难地爬行。在`South Col`上，我捡到了来自`AMEE`时代简陋装备的废弃瓶。它的重量是我现代设备的三倍。尽管消除了对未知的心理障碍，并享受了
  30 多年技术进步的红利，这次攀登仍将我推向了身心超出想象的极限。


  ## 连接


  1994 年当我第一次接近`Everest`顶峰时，泪水顺着脸流下，一种对父亲深层的连接感涌上心头——作为一名登山者，我终于赢得了可以称之为我自己的连接。我现在真正领略了
  1963 年的那些登山者是多么强大和勇敢，那个时代没有简单的成功公式，山上的每一步都是通过纯粹的意志和毅力获得的。他们的生命悬在每一个做出的决定上，没有任何预设的模板引导他们登顶。悲剧的是，我的父亲在短短四个月后死于一场车祸，这剥夺了我作为首位登顶的美国传奇与他共同分享和反思的机会。


  近十年后，我回到了那座山，参与了`国家地理学会`的电影拍摄——《珠穆峰：山上的 50 年》。这部电影庆祝了`埃德蒙·希拉里爵士`和`丹增诺某`首次登顶 50 周年，并通过这些先驱登山者儿子的视角来讲述。被邀请加入该项目时，我毫不犹豫地接受了参与这部将延续我父亲及其同辈遗产电影的邀请。正如当年那部电影影响了小时候的我，参与一部可能影响我两个儿子的电影，让我为自己成为美国`Everest`传奇的一员感到自豪。


  我们的攀登目标是重复`Willi Unsoeld`和`Tom Hornbein`对`西脊`史诗般的首次攀登，但恶劣的天气和强风迫使我们从`West Shoulder`撤离。我们重新调整努力，通过`South
  Col`路线登顶，我再次在字面和意义上都追随着父亲的足迹到达山顶，带着我父亲近 40 年前带上的美国国旗和`国家地理`旗。那个登顶之日的记忆对我来说是苦乐参半的；我记得`Peter
  Hillary`在山顶给他父亲打了一个感性的电话，虽然站在世界之巅让我无比欣喜，但`Peter`与他父亲的联系让我敏锐地意识到，在我这样一个如此重要的时刻，我的父亲缺席了。


  `Everest`的魔力非常强大，在 2002 年于`西脊`失败后，我觉得自己在那条路线上还有未完成的事业。这条线路所蕴含的美学、投入和攀登风格，从登山者的每一个层面都吸引着我，因此我很高兴能在
  2012 年有机会参加`西脊`50 周年纪念攀登。这个团队非常有经验，四位主要登山者之间共有 11 次登顶经历。但再次，路线上的条件并不理想，导致我们在`Camp
  II`以上取得进展不多后被迫撤退。每当我们这支老兵团队艰难地在路线上推进却陷入困境时，我都会惊讶地想，最初的那些美国登山者是如何能够如此有效地将路线推向未知的。在`西脊`首次登顶近
  50 年后，这条路线的意义经受住了时间的考验。攀登的技术性和它要求的投入在 1963 年是无与伦比的，它现在仍然是`喜马拉雅`地区令人向往的成就，过去 50 年来寥寥几次成功的登顶就证明了这一点。


  ## AMEE 的意义


  美国人的首次登顶不仅经受住了时间的考验，在那个时代背景下`AMEE`意义更加重大：1963 年是“肯尼迪时代”，`肯尼迪`倡导“充满活力的生活”的价值。这一时期，美国在太空竞赛中输给了苏联发射第一个人类进入太空的第一步。一股爱国主义潮席卷美国，显然，无论是登山者、政治家还是普通民众，都不希望看到美国再次输给苏联。`AMEE`团队组建，它获得的国家支持在当时是前所未有的，此后从未见过。


  `AMEE`远征的预算为 40 万万美元。这在当时是一笔巨款，相当于现在的 300 万美元。作为对比，我们 1994 年的远征预算是 8 万美元，而这还包含了旅游部收取的
  5 万美元强制性登顶费。但比集到的资金更令人印象深刻的是来自众多捐助者的支持广度和体量。在当今——探险活动很少获得关注或支持——很难想象`AMEE`所获得的支持来源。私人个人捐赠了资金，公司和商店捐赠了大量设备，许多政府机构也支持了这项事业`NASA`、`原子研究部`、`海军`和`空军`都为远征捐赠了大量资金。`国家地理`也是一个主要支持者，换取远征的摄影和电影版权。





  AMEE（美国珠穆玛峰远征队）的目标至少是高远的。这次远征的首要攀登目标是通过东南脊登顶。这一目标在 1963 年 5 月 1 日实现，当时吉姆·惠特克（Jim
  Whittaker）和夏尔巴纳旺·贡布（Sherpa Nawang Gombu）站在了世界之巅。单这一成就就标志着团队的成功，但更多的目标在等待着。攀登从未尝试过的西脊、穿越山体并从东南脊下山的想法变成了次要目标。西脊是一条真正体现登山精神的路线——它具有远见性、技术难度大，并且需要巨大的投入。在
  1963 年，仅仅是从西脊登顶的想法至少领先了时代 30 年。威利·温索尔德（Willi Unsoeld）和汤姆·霍贝因（Tom Hornbein）在该路线上的成功，标志着美国迄为止在喜马拉雅最大的成就。


  霍贝因和温索尔德不仅在 5 月 22 日攀登了西脊：他们山顶附近遇到了我父亲和鲁特·杰拉斯塔德（Lute Jerstad），然后开始在夜间下山。夜幕将他们困在旷野中，他们被迫在
  28,000 英尺以上的高度没有炉子、帐篷或氧气的情况下露营。团队挤在一起，暴露在东南脊的风风中，除了等待晨光外没有其他选择。此前没有人在这种海拔高度度过夜，生存是否可能还尚不确切。我曾两次爬过这四个人在山顶下方无遮挡过夜的地点，两次我都记得自己被一种念头所淹没：那是我父亲挣扎求生度过夜晚的地方。我经常在想，当我父亲等待寒冷和黑暗让位于晨光时，脑子里在想些什么。


  ## 活的科学


  AMEE 的另一个目标是在山上进行科学研究。从本质上说，AMEE 就是一个科学实验室。在冰川学、太阳辐射、生理学、心理学和社会学领域进行了大量的研究和实验。团队的每位成员都以某种形式为远征的研究部分做出了贡献。在
  1963 年，关于高海拔生理学的数据并不多。AMEE 不仅提供了完美的实验室，还提供了研究所需的所有标本。AMEE 的结果为海拔影响（特别是在 8,000 米以上）提供了具体的记录，这部分知识已成为美国进行的所有后续海拔研究的基础。


  海军和空军对遭受长期高压力和极寒天气影响的团队在和社会心理方面非常感兴趣。他们的兴趣源于美国国防部的信念，即该国极有可能参与一场冲突，士兵们将驻扎在非常寒冷、压力巨大且偏远的环境中。尽管结果很有趣，但考虑到远征成员非凡的勇气和性格强度，研究结果很可能存在偏见。


  成员们由远征领队诺曼·迪赫伦富斯（Norman Dyhrenfurth）召集，他们自己本身是当时北美最优秀、最有经验的登山者。成员名单读起来就像是 60 年代的名人录。只需翻一下美国几乎任何一个攀登地的登山指南，就能发现科贝特（Corbet）、波纳纳尔（Pownall）、埃默森（Emerson）、温索尔德（Unsoeld）、杰拉斯塔德（Jerstad）等名字与全美各地的重大攀登联系在一起。AMEE
  的成员不仅是卓越的登山者，而且受过高水平教育的专业人士。团队有三位医学博士、五位哲学博士和五位硕士（其中三名成员在远征期间正在攻读博士学位）。这些人人属于文艺复兴模式的登山者；他们的登山爱好与其职业是分离开的，这使得他们在珠穆玛峰上的成就更加令人印象深刻。


  五十年前，这次远征是在兴奋、冒险和乐观的复杂心情下开展的。当我们回首时，拥有了洞察探索风险和成果之光的益处。AMEE 的实质性成果非常清晰——六名成员登顶，山上开辟了一条新路线，并产生了海量的科学研究。不那么实质性的是这些登山者及其远征对后世后代产生的巨大影响。在
  1963 年攀登之后的几代中，几乎每一位进军大山的登山者都读过霍贝因的《珠穆玛峰：西脊》（*Everest: The West Ridge*）或乌尔曼（Ullman）对这次攀登的官方记录《珠穆玛峰上的美国》（*Americans
  on Everest*），如果两者都读过。这些书在许多方面影响了无数登山者。


  ## 立下高标准


  最重要的是，这个团队为美国登山者在喜马拉雅的可能性树立了基准。读完这些记录后，人们会产生一种任何事情都能完成的信念；并受到启发去接受这些登山者的遗产并追随他们的脚步。只有当我们把信仰和支持给予那些勇于迈出大步的人时，已知的世界才会扩张。从根本上说，如果没有这些探索者的勇气，我们将无立之地，这就是我们庆祝这个周年的原因。从本质上说，任何在喜马拉雅攀登的美国人都在巨人的脚下攀登。而在这些巨人中，包含了
  1963 年美国珠穆玛峰远征队的所有成员。


  一生的攀登和 46 岁的年龄在山上带来了更开阔的视野——至少对我来说是如此。不再拥有年轻的无敌和力量，我的最后一次攀登让我更深刻地认识到了 AMEE 的成就。一座纪念我父亲的佛塔（chorten）坐在腾波切（Tengboche）寺院后面，旁边还有他的朋友和登山伙伴吉尔·罗伯茨（Gil
  Roberts）、鲁特·杰拉斯塔德（Lute Jerstad）和杰克·布里滕巴赫（Jake Breitenbach）的纪念碑。这是一个有力的画面，山谷景色优美，珠穆玛峰高耸在上方。每当我在昆布地区时，我都会去这些佛塔挂上西藏旗，并和“哥们”喝一杯。泪水流面，我再次感到自己像那个厨房里的孩子，被英雄们环绕，惊讶好奇地听着珠穆玛峰的故事。


  **—BRENT BOP** 布伦特·毕申（Brent Bishop）是一位登山者和环保主义者，也是 1963 年美国珠峰远征成员巴里·毕申（Barry Bishop）之子。1994
  年，布伦特·毕申创立了萨加玛塔环保远征（Sagingmatha Environmental Expedition），从此以后帮助从珠峰清理了数吨垃圾。


  ## 遗产登山队


  希拉里·奥尼尔（Hilaree O’Neill）、强大的达瓦·扬姆（Dawa Yangzum）和我——虽老但顽强——于 4 月 10 日到达珠穆玛峰大营，加入了我们团队的其他成员。像吉姆一样，我们都来到昆布地区庆祝美国首次登顶珠穆玛峰
  50 周年。由著名登山者兼珠峰老将康拉德·安克（Conrad Anker）领导的 2012 年珠峰教育远征由九名登山者、八名高海拔夏尔巴、一名高海拔夏尔巴、三名通信技术员和七名大营工作人员组成。我们的夏尔巴——安卡吉、丹鲁、江布、拉帕·博特、明玛、帕努鲁、索姆·多杰、腾迪以及年轻的夏尔巴达瓦·扬姆——是业内最有经验的人之一。我们的夏尔巴领（sirdar）帕努鲁已登顶珠峰
  9 次；我们团队中实力最强的丹鲁已登顶过 13 次。






  西方攀登队主要由“北壁”（The North Face）的职业运动员组成。除了 49 岁的康拉德（Conrad），还有 39 岁的滑雪登山员希拉里·奥尼尔（Hilaree
  O’Neill）、38 岁的摄影师兼滑雪登山员克里斯·埃里克（Kris Erickson）、30 岁的登山者兼摄影师科里·理查兹（Cory Richards）、29
  岁的精英混合冰岩爬者萨姆·埃利亚斯（Sam Elias），以及 25 岁的竞技运动员艾米莉·哈灵顿（Emily Harrington）。团队成员还包括 48 岁的国家户外领导学校（NOLS）现场经理菲尔·亨德森（Phil
  Henderson）、61 岁的蒙大拿州立大学地质学家戴夫·莱森（Dave Lageson）以及我。结合我们的经验，我们共有超过 200 次探险，但只有康拉德曾登顶珠穆玛峰。


  康拉德和科里将尝试西脊，我们其他人则走南坳。不出所料的是，仅仅爬上这座山对康拉德来说是不够的。因此，与 1963 年美国探险队一样，我们还在进行地质和生理研究，并编写一套小学科学课程。


  整个团队人数接近 30 人，首次在大营汇合。珠穆玛峰大营散布在岩石遍布、变幻莫测昆布冰川上，海拔 17,600 英尺，就规模而言，它可能是世界上同规模中最著名、尽管转瞬即逝的城镇。季风前的人口大约有
  900 名临时居民：约 300 名客户和向导、同样数量的夏尔人，另外 300 名大营工作人员和背夫员，更不用说源源不断的牦牛队，它们的铃铛在寒冷的空气中不断叮叮作响。


  ![](img/Anke_9781426212413_epub_063_r1.jpg)


  2012 年传承：探险开始初的攀登队


  ## 大营城市


  就像每个小镇一样，珠穆玛峰大营也有社区。我们的营地位于南部郊区，靠近巨大的“喜马拉雅体验”（Himalayan Experience）商业营地。通常人们称其为
  Himex，它拥有地球上最高、最俗气的夜总俱乐部——老虎大顶（Tiger Dome）——这是一个巨大的硬骨架测圆气泡结构，灵活的舞池上铺着一张 30 英尺长的虎皮毯，配有大音箱、挂着人造虎毛的休息椅，以及一个无限供应的酒吧。我们会在老虎大顶里掉几个脑细胞——康拉德和艾米莉像猴子一样在天花板上荡秋，希拉里和朋友们从吧台同步跳下冲入人群——然后在凌晨时爬回自己的帐篷。


  在进入城镇的主街上，左侧是国际山地向导（International Mountain Guides）区，右侧是喜马拉雅体验（Mountain Experience）。远处是繁忙的直升机停机坪（一片圆形的岩石地带）以及珠峰急救中心（Everest
  ER）的大白色帐篷，那里由露安·弗里博士（Dr. Luann Freer）于十年前创立。市中心可以看到山地向导、韩国大学、Happy Feet、印度军队以及另外二十支来源不明的探险队。每个街区看起来都非常相似，有一个长方形的集体帐篷，周围环绕着
  10 到 20 个橙色或黄色的圆帐篷，以及几个垂直的蓝色或绿色厕所。经幡像社区旗帜一样在每个街区的石堆佛塔上飘扬。


  尽管多年来一直有负面报道，但珠穆玛峰大营是一个相当整洁的地方。SPCC——萨迦玛玛莎污染控制委员会——是大营的市议会，由他们制定规则。帐篷厕所配有塑料桶，所有的人类排弃物都会被运到戈拉克谢普普（Gorak
  Shep）村。与更高海拔的营地不同，在大营，每个团队都被要求将带入的物品全部带走。


  大营城市的日常生活惊奇地文明且悠闲。你可以上网、接收 iPhone 信号，偶尔还有厨师会制作生日蛋糕。就像在夏令营一样，工作人员提供餐食，让攀登者休息、恢复、听音乐、拍照、发邮件、写博客、在电话里闲聊，或者只是张着嘴，看着从普莫里峰和努冰峰周围侧坡轰啸而下的雪崩。我们甚至还有下午茶，一种经典的英国老爷（sahib）传统。


  这里的大多数居民并不是硬核攀登者。他们是拥有登顶珠穆玛峰梦想的客户。他们许多人在其他领域——商业、医学、技术——已经取得了成功，而且深知获得自己的技能花费了多久，因此很乐意为向导的专业知识付费。嘲笑这些追求者很容易，但世界上总会有有钱攀登珠穆玛峰的人，正如惠特克（Whittaker）所指出的，他们本可以把钱花在更不靠谱的追求上。相反，这些新手愿意冒着生命之危险穿过昆布冰瀑的巨口，忍受剧烈的头痛、喷吐和数周的高强度疲劳，只为了站在世界之巅。这并没有让他们成为登山者，但确实说明了他们的信念。


  在大营的前几天用来适应海拔的，许多西方人要么患上“昆布病”（Khumbu crud），要么花费大量精力尽一切避免它。在前往大营的一周徒步途中，那些有时显得简陋的茶室可能是细菌的培养皿，很少有人能逃脱某种形式的胃炎。如果你没有患上那种病，几乎肯定会患上“昆布咳嗽”——这是由极干燥空气引起的支气管炎症。剧咳是无处不在的症状，很快每个人都像银行劫匪一样脸上戴着头巾（buffs）。


  ## 面临冰川


  珠穆玛峰南侧第一个障碍是臭名昭著的冰瀑。昆布冰川像一台巨大的推土机，在珠穆玛峰和努冰峰之间的洛子峰壁向下冲下，推开着前方的蓝色冰墙。从大营正上悬崖上坠落，这条宽一英里的冰川裂开来，破碎成建筑大小的冰块和像教堂尖塔一样高的冰塔。


  每年穿过冰瀑的路线都由“冰医生”们设定，这是一支由夏尔人组成的小型突击队，他们冒着致命的风险规划出最安全的通道，在陡峭路段布置绳索，并将梯子横跨在如深渊般的裂缝上。昆布冰瀑无非是一条巨大的流动的冰河，它不断移动、呻鸣和崩塌，如果你恰在错误的时间出现在那里，就会被裂缝吞没或被掉落的冰塔压碎。几年前，三名夏尔人在昆布冰川的一次事故中去世。今年春天，一排经幡标记了最危险区域的起点和终点。


  根据精算研究，在珠穆玛峰下顶返回时的死亡人数比穿过冰瀑的更多。尽管如此，穿过昆布的巨口是一场病态的俄罗斯轮盘游戏，所以我们尝试在黑暗中通过，在太阳晒热冰层并使其开始崩塌之前。我们在凌晨
  2 点离开大营，像矿工一样顺着头盔上头灯的光束前进。在我的第一次旅行中，我与丹杜鲁（Danuru）搭档。当我们到达第一排经幡——进入死亡区的起点门时，他允许我喘口气，然后说：“我们出发了！”并开始向上冲跑，在
  18,000 英尺的高度， literally 背着 60 磅的背包跑步，冰爪在蓝色冰的岩石上嘎吱作响。





  珠穆朗玛峰本不是一座难以攀登的山。“攀登”一词往往甚至不被用来描述登上世界最高峰顶的行为。“这只是在走路。这并不难”——这是多年来我经常听到的话。在攀登圈中长大，让我对一个我从未去过、甚至懒得去了解的地方产生了一种极具主观的观点。当非攀登者问我是否曾梦想过登顶珠穆朗玛峰时，我会冷冷地回答：“嗯，没有。那不是我从事的那种攀登。”


  好了，现在我正在为自己的傲慢话买脸。今年，我随`北脸（The North Face）`去经历了一次珠峰之旅。`Conrad Anker` 邀请我加入团队，给了我这一生难得的机会，而我接受了。我对高山攀登世界知之甚少，在高海拔登山方面毫无经验。对于珠穆朗玛峰本身的独特性，以及它对我所属社区产生的剧烈极化影响，我曾有着非常偏颇的看法。


  ## **挣扎**


  珠穆朗玛峰是一个充满争议的地方，充满了现实中的危险和摧毁自尊的批评。攀登珠峰是我在连续期间内经历过的最个人化的挣扎。当我第一次到达`大营（Base Camp）`时，由于呼吸道感染，我从未像那时那样生过。我从未在身体上如此努力斗争，以继续前进、迈步并忍受疲劳、酷热和刺骨的寒冷。我走过尸体，那些在四天前还活着的灵魂，为了追求我正努力实现的目标而离开了这个世界。在很多时候，我感到非常恐惧。我从未面对过如此真实的现实：我的生命可能被我无法控制的境遇夺走，并伴随着一种不安的认知——来到那里是我的选择，但为了什么呢？我每天都与自己的内心激烈斗争，向自己证明这次任务的意义，尽管面临着危险、死亡，甚至由于我在此前没有任何高海拔登山经验的情况下仅仅踏上这座山而备受的严厉批评。


  攀登珠峰对环境和社会产生了一些非常显眼的负面影响，尤其是考虑到这一切的商业化。那些甚至从未眼见过`昆布冰谷（Khumbu Valley）`的人都知道这些事。但还有其他方面经常被忽视或忽略，被负面影响所掩盖。我在珠峰上的个人旅程充满了负面情绪和挣扎，但也充满了胜利与成功；当我回到家时，已经变成了一个离开时不同的人。我看到了这个被许多人批评和谴责的地方的另一面，我最记忆的是那里以许多形式存在的美丽与激情。


  ## **噪音**


  我记得在`大营（Base Camp）`的帐篷里整日整夜听着雪崩声，看着它们无法控制的力量和暴力的强度，并同时对它们发出的噪音和能量之美感到既恐惧又着迷。然后是我在凌晨三点第一次穿过`冰川瀑（icefall）`，那种剧烈的恐惧让我的胃部剧烈收缩，并因为真实的危险而流下了泪水。我记得`西西冰谷（Western
  Cwm）`的酷热，看着我为了冷却沸腾的血液将雪水滴进衣服后，它在几秒钟内融化并蒸成水汽。我记得在`二营（Camp II）`听着风从珠峰呼啸而下的声音，像没有刹车的货火车。几分钟后风就会到达我的帐篷，我突然置于飓风中心，尼龙布被撕裂，地板试图将我这无助的身体抬离地面。我记得我们在`三营（Camp
  III）`睡觉的第一个晚上，在经历了许多痛苦的、风大大的夜晚后，那个异常平静的傍晚迎接了我们。那天晚上我看到的壮丽日落让我觉得自己是地球上最幸运的人。我记得 5
  月 25 日清晨，在狂虐的风和零下 50 摄度的温度中登顶，并试图有意识地感知和感激我所处的位置以及我所做的——但也意识到，与这段旅程中所看到的、感受到的以及我作为一个人的变化相比，登顶在宏大图景中的意义是微不足道的。


  ## **人**


  我记得`谢尔巴（Sherpa）`人们令人惊叹的力量和善良，尽管他们的工作需要巨大的付出，但他们总能保持幽默的心情。我记得我对我们的`谢尔巴`团队以及我的西方队友们感受到的不懈的尊重和爱。他们都成了我的家人，我永远不会忘记他们，并将与他们永远纽带在一起。


  我还记得`大营（Base Camp）`那奇特的社区，就像一个小镇，有着同样的戏码和八卦，但也充满了真实的人，他们有工作、家庭和目标。这些充满积极意图的热情的人来到那里仅仅是为了实现一个梦想，并体验山脉的巨大。像他们一样，我也感受到了处于一个比我们能想象的要广阔、强大的地方的魔力。这让人感到无比谦卑，并让我们作为人类找到了自己的位置。也许这就是为什么人们成群结队去那里。除了登上世界之巅的具体目标，他们还在寻找体验一个比自己伟大得多的地方，去挣扎、受苦、战斗并发现自己是谁，就像我所做一样。


  我记得这一切，我对它们非常感激，我永远不会忘记它们。


  **—EMILY HARRINGTON** `传承攀登（Legacy Climb）`团队的一名`北脸`运动员，`Emily Harrington`是目前唯一一位在`攀登世界杯（Climbing
  World Cup）`竞赛赛场中稳定进入前五名的美国人（不男女）。


  ![](img/Anke_9781426212413_epub_064_r1.jpg)


  **探险队队长 CONRAD** Anker 绘制了这张穿过`昆布冰川（Icefall）`的危险路线地图。他标记了`死亡大厅（Ballroom of Death）`，那里的冰塔随时可能压碎登山者。


  ## **适应**


  在四月期间，海拔 19700 英尺的`一营（Camp I）`和 21200 英尺的`二营（Camp II）`建立了。`一营`是一个风大但美丽的地方，位于巨大的裂缝之间的骨白色冰川脊上。`谢尔巴`人不在`一营`，所以那里更像阿拉斯加或秘鲁的登山营——你需要自己做饭并照顾自己。`二营`像个垃圾场，位于左侧冰碛上，帐篷在数百堆留下的粪堆中。我们爬`一营`几天，回到`大营`几天，再爬`二营`，回到`大营`。这种单调的往复对于适应至关重要。





  为了收集心肺功能数据，我们每个人的胸前都贴着一个比最小手机还小的微型电脑，在余下的整个远征过程中它将一直固定在位。这台价值数千美元的设备连接到两个贴在我们乳头下方的电极上。一个高分辨率加速度计和一个微型心电图仪（测量心率和心间期的的机器）每秒会采集
  400 次数据。心率变异性是衡量系统压力的指标之一。


  ![](img/Anke_9781426212413_epub_065_r1.jpg)


  # 希拉里·奥尼尔攀登洛子峰

  洛子峰底部。2012 赛季珠穆玛的干燥气候意味着攀登过程中某些路段是在光滑坚硬的冰面上进行的，而不是典型的积雪覆盖。奥尼尔正在一次适应性训练中前往三营。


  在一周的时间里，梅奥团队对我们和他们进行了一系列测试。采集血液，用皮脂钳夹取脂肪，并将涂有凝胶的超声波探头在我们胸部来回滑动。机器测量我们的肺容量和气道功能。我们的认知能力（或其退化情况）通过类似于曾提供给宇航员的电脑游戏来衡量。在其中一种游戏中，每当屏幕出现正方形，我们就用塑料笔戳向屏幕——这是为了测量手眼协调能力。在另一种游戏中，我们需要将单词的颜色——例如印成绿色的单词
  `red`——与下方的颜色名称（而不是单词本身）相匹配。最后，我们进行了握力测试和阶梯测试，像珍娜·芳达一样在小凳子上跳上跳下。


  在让我们既受折磨又觉得很有趣之后，约翰逊和他的梅奥小团队收拾行李，回到明尼苏达州进行数据分析。（他们带走了我们的地质学家戴夫·拉格森。他不仅生病了，还要处理家事。我们的夏尔俄人在山顶上采集的岩石将送给他进行分析。）


  ![](img/Anke_9781426212413_epub_066_r1.jpg)


  哪种帐篷场景符合你的风格？是 1953 年为了取暖而挤在一起的肉堆，还是今天像 NASA 监控样的高强度？1953 年的团队实际上在收听伊丽莎白女王女王的加冕仪式——当时有收音——而
  2012 年远征队的通讯帐篷则包含了全套设施的 Wi-Fi。


  约翰逊离开时总结道：“我们的目标是尽可能多地了解极端压力下心肺系统的生理状况，然后将这些发现应用于治疗心衰竭患者。”


  # 声音


  ## 为什么要攀登珠穆玛峰？

  海拔一万三千英尺。那是我在参加这次珠穆玛峰远征之前去过的最高海拔。虽然我是一个攀登者并热爱大山，但登山从未进入过我心中的登山运动领域。我梦想的是陡峭的岩石和冰壁，而且大多是单段攀登。当我获得作为国家地理/北面遗产（Legacy）远征队成员尝试挑战世界最高峰的机会时，我被迫扩大自己对大山攀登以及正式远征的理解。尽管如此，对于深知在整个春季中将经历的所有不确定性，我曾感到非常困扰。现在回首，距离站在世界之巅仅过去几个月，我确定这段经历改变了我的生活。


  ## 内在意义

  这是一段漫长的旅程，在我存在的每个层面都极具挑战性——心理、情感、精神，当然还有生理。由于这是我第一次大型高山远征，我没有技巧来理解自己内心应该感受什么或如何感受。日子很漫长，在如此基础、原始且极端的环境中，无处可逃。没有任何干扰项能让大脑离开所在地：简单来说，那是一个人类不该存在的地方。我们的死亡和真正的脆弱在那里显而易见，以至于我们的身体实际上在杀死自己。由于无法获得足够的热量，它们开始消耗自我。免疫系统耗尽，仅强维持，因此疾病是不可避免的。


  我经历了两次严重的病痛。一次是一场肠胃噩梦，另一次是地狱般的喉炎和上呼吸道感染。两者都需要抗生素。然而，生活总有一线希望。


  这次经历通过迫使专注于当下、缓慢生活并面对现实，让我梳理了我的生活。它在几周时间里暴露了我的真实自我，像剥洋葱一样层层剥开。它迫使我面对那些棘手的问题：我应该成为谁？这种生活是为了什么？我想要什么？


  也许不让我的思想陷得那么深更好，特别是考虑到我们这次重要远征所承担的所有责任——但正如我所说，我并没有关于应该感受或思考的参考。我实际上相信，我出现在那里的原因之一是为了提供一个新颖、无偏见的视角。幸运的是，我们履行了职责，并幸运地登顶了山，但回想起来，这些仅仅是锦上添花。


  最重要的是，珠穆玛峰让我能以不同的角度看待我的生活并对其重新考虑。对于此，我将永远感激那些足够信任我并让我去的人……以及大山本身。


  **萨姆·埃利亚斯** 一位专注的高山滑雪运动员、运动岩岩者和冬季攀登者，萨姆·埃利亚斯在世界各地追求挑战。他是北面运动员，也是遗产攀登远征队的成员。


  # 季节的征兆

  到 4 月底，珠穆玛峰南侧发生了三起死亡，全都是夏尔俄。一个死于中风，另一个死于酒精中毒，还有一个由于没有系好安全绳掉入冰裂缝。


  4 月 26 日，当我们团队的一部分人在二营、另一人在三营时，洛子峰西脊的一处冰脊崩塌，引发巨大的雪崩冲入西冰川。深百英尺的雪崩伴随着篮球大小的冰块，横扫了从一营到二营的路线。在某些时段，有
  50 到 100 人正经过这条路。幸运的是，只有一个人被这场雪崩卷入。尼马夏尔俄被卷入坟般的冰裂缝，断了三根肋骨和两个椎骨，咬断了舌头。在经常救援登山者的阿根廷向导兄弟人的救下，尼马被直升机送往加德满。


  ## 科里的崩溃

  第二天早上，科里和康拉德出发侦察前往西肩（西脊起点）的路线。他们到达了两万三千英尺的高点，躲避着像导弹一样飞过的落石，最后决定这条路线太危险，无法攀登。在返回时，科里开始胸痛和呼吸困难。当他们回到二营时，科里已经喘着粗气、干呕且極度虚弱。在接下来的一小时里，我们让科里休息、放松并喝水。科里显得精疲力不堪，眼神焦虑，不断重复着：“我喘不上气了。我觉得快窒息了。”






  八名来自二营的夏尔帕人包括 Panuru 和 Danuru，自愿将科里带回一营。这些夏尔帕人、科里的摄影助理安迪·巴登和我一起冲下西冰谷，像拉着坐在雪橇上的孩子一样拉拖着科里。一营上空低矮的黑云消灭了直升机撤离的可能性，而背着科里通过冰川瀑需要几个小时。相反，在将氧气流量调高至每分钟四升后，科里在
  Panuru 的帮助下跌跌撞撞地走下冰川，并立即被飞机送往大营接受治疗。


  ## 团队继续前进


  这让康拉德在尝试攀登西脊时失去了伙伴。格调华丽的意大利登山者、拥有约 40 次喜马拉雅登山远征经验的老兵西蒙·莫罗曾短暂地考虑过与他组队。然而，在分析了西脊著名的霍恩贝因冰斗槽（Hornbein
  Couloir）的航拍后——那里不再是积雪，而是蓝冰和裸露的岩石——他宣布任何尝试都是自杀行为。“我来这里不是为了死的。在这条线上，今年，你会死的。”康拉德和西蒙都不情愿地决定攀登南脊。


  ![](img/Anke_9781426212413_epub_068_r1.jpg)


  团队成员兼摄影师科里·查兹在海拔 23,000 英尺（7,000 米）处与康拉德·安克固定绳索时开始呼吸困难。他下到二营，医生在那里给他补充了氧气并建议他下山。随后，查兹回到了大营，有时乘坐
  Sked 救援担架（最右侧），有时也靠自己的力量通过了危险的冰川瀑布（对面，左侧）。医生在大营对他进行了额外的测试，随后他从那里被转送往尼泊尔卢克拉附近的一个医疗机构。


  在过去的半世纪里，珠穆朗玛峰的地貌发生了巨大的变化。在地球变暖之前的时代，它是一座雪峰。今天，雪原和冰川已大幅退缩，露出了松散、易碎的岩石。由于春季极端干燥且风大，四月份期间的昆布冰川瀑和洛子峰面都比平时更加危险。几名夏尔帕人在洛子峰面被落石严重伤。其中一人被崩塌的冰塔击中，那块汽车大小的冰块断了他的手臂和腿。两支登山队（包括山上最大的
  Himex 队）由于风险过高而放弃了尝试。


  5 月初的暴风雪最终（尽管是暂时的）将大山重新粘合在一起，夏尔帕人成功地在海拔 25,900 英尺的南脊营建立了绳索。5 月 18 日，在我们卡吉的带领下，夏尔帕将绳索系到了山顶。第二天，超过
  200 人涌向顶峰。在此过程中，有四位客户丧生了生命。


  ![](img/Anke_9781426212413_epub_069_r1.jpg)


  马克·詹金斯在被洛子峰面三营上方被强风击落后，经过珠穆朗玛留下的碎片。


  ![](img/Anke_9781426212413_epub_070_r1.jpg)


  艾米莉·哈灵顿、萨姆·埃利亚斯和希拉·奥尼尔（从左到右）在三营享受着难得无风夜晚。云层悬挂在西冰谷，珠穆朗玛峰的西脊在右侧升起。


  我们在大营按兵待发，观察、等待并恢复。根据卫星辅助天气预报，下一个机会窗口似乎是 5 月 25 日。我们休息、睡觉并尽可能多吃。我们现在缩减为六人团队，因为菲尔·亨德森患了呼吸道感染，并慷慨地承担了大营经理的角色。


  我们的冲顶行动开始于 5 月 21 日凌晨 2 点。我们在正午前到达二营，并在那里待了两天——同样是进食和睡觉——然后我们中的五个人上到了三营。康拉德打算第二天和夏尔帕人一起上来。


  # 声音


  ### 登珠穆朗玛峰后的反思


  在珠穆朗玛峰上的经历让我意识到我拥有多么美好的生活。它让我开始思考自己的生命期限以及什么是重要的。对我来说，家庭和山脉非常重要。能够拨打家里电话和我四岁的女儿通话祝她生日快乐，听到她和我妻子的声音，对我很有帮助。


  它让我意识到，在地球更宏大的蓝图中，我是一个多么微小的生物。我经常会注意到大营生活中生活的细微差别，例如脚下冰川的移动以及深夜里冰塔崩落的声音。有机会近距离观察我们星球的这一小部分，是意义非凡的经历。


  ### 实现目标


  我经常发现自己独自在冰川瀑布中行走，并感到完全自在。在山中独处是我一直很习惯的事情。然而，在世界最高山上独处，风险极高却依然感到满足——这永远是远征中令人难忘的一部分。它告诉我，多年来山里的经历其实为这次远征做好了准备。


  我真的努力不去担心会发生什么。如果我登顶了，那太好了：那将锦上添花。我的主要焦点是为远征、团队以及我周围的人产生积极的影响和贡献。我觉得我能够完成所有的个人目标——除了登顶之外。除了登顶，还有许多其他重要的事情。


  ### 始终伴随我


  每天没有哪一天我不想起这次远征。由于某种原因，不像对其他任何远征的想法，我不认为它很快会改变。这对我来说是另一个改变生活的经历。它帮助我保持生活的视角。这是我能想出的最好的例子，说明为什么将远征作为生活的一部分对我。


  ——菲尔·亨德森，资深登山者，国家户外领导力学校（NOLS）高级野外导师，菲尔·亨德森是周年纪念团队的成员。


  ### 追问为何


  我们花费了几个小时在空中开辟出一个冰雪平台。一营和三营是夏尔帕人没有为我们建造的唯一营地。从我们海拔 23,000 英尺的立足点，我们俯视着西冰谷片眼的洁白。我们发现了冰石堆中二营的微型帐篷，再往远处是一营周围的裂缝，再更远则是被翻腾云层遮住的大营。地平线如水彩画般向远方消失，是一系列锯状的山脊线。我们看得如此遥远，几乎能看透内心。这种视野只有来到这里才能获得。


  在珠穆朗玛峰度过两个月后，我们成了朋友。我们了解彼此的战斗和背叛——至少是其中一部分——我们互相支持：当希拉扭伤脚踝时，当萨姆失去信心时，当我病得无法坐起时。这就是在长期远征中并在狭小帐篷旁睡眠会发生的事情。这是本应该发生的事。你们以个体开始，并相互转化为一个团队。


  位于洛子峰中腰的三营就像没有没有墙的摩天大楼。我们这一层没有其他人，我们拥有自己的寂静空间，尽管在我们上方和下方都有帐篷和登山者。





  尽管直接处在一个随时可能坍塌并将我们压埋的冰塔下方，这个高空巢依然如魔幻般美丽。这里没有一丝风，不知为何，每当我们来到这里时情况都是如此。傍晚的阳光将冰川变成了一条宽阔而灿烂的通道，将珠穆玛峰的山腰变成了城堡闪烁的墙壁。这景色美得令人窒息，许多人为此付出了生命。


  “你知道的，在家里，我会问自己为什么，”希拉里（Hilaree）蹲在虚无的边缘，喝着咖啡，冰爪尖端没入雪中，“为什么要爬山？为什么要离开我的孩子和丈夫？承担所有的风险……”
  作为一名参加过数十次探征的运动员，希拉里停顿了一下，向前方挥了挥手臂，“这就是，这就是。”


  克里斯（Kris）像往常一样把相机紧贴眼旁，在我们滑的岩平台上来回爬行。


  “现在，就在这里，”他惊呼道，“这就是最好的了。”他那双像奥林匹滑雪运动员般的腿，已经挺过了六次 8000 米的考验。


  瘦子萨姆（Skinny Sam）走得离边缘太近，坐在帐篷里盘腿坐着的艾米莉（Emily）将金发塞进毛帽，冲他大喊：“萨姆！”这两个是年轻将，在这次探征之前，他们都没有爬到过
  13000 英尺。


  景色闪烁着光芒。我们都被这崇高的景致所震撼。雪、石与虚无之间存在着一种残酷的、黑白分明的美。它象征着登山这种运动关乎性的简单。做出正确的决定，你就活；做出错误的决定，你就死。大多数其他运动仅仅是游戏，而登山是关乎死的。这里有运气，但几乎没有宽恕。一切都被提炼成了基础元素：热饮、冰冷的手指、灼灼的光、汗味、雪崩的轰鸣声。在这个海拔，没有任何生命存在——绿色甚至不存在——除了我们登上顶峰的决心，别无其他生命。


  ## 营地生活


  太阳落下的那一刻，温度骤降，但我们已经躲进帐篷，钻进了一脚深的睡袋里。在世界的边缘，有两个女人和三个男人。萨姆、艾米莉和我并排躺着。萨姆在营地炉上融雪，艾米莉戴着耳机听着何塞·冈萨斯（José
  González）的歌声晃着头，我在写作。隔壁，克里斯和希拉里一边切奶酪和意大利火腿，一边跟着火柴盒大小音响器里出来的 Raconteurs 乐队合唱。所有的活动都是可以替换的，就像我们在三号营或一号营时一样。很快，我会融冰，艾米莉会打开我们的食物包，萨姆会听着
  Glitch Mob 的音乐，克里斯会给大本营打电话询问天气，而希拉里会收集冰块放入锅中，自自哼着约翰尼·卡什歌。


  当黑暗像冰冷的拳头一样紧住我们时，我们都清醒地意识到，24 小时后——在登山 55 天之后——我们将冲击顶。


  我们在山上上下行了四次以让身体进入状态，但任何事情都可能发生。我们中的某人可能会生病、滑倒，或者仅仅是因为太疲惫而无法继续。绳子可能会松动，冰塔可能会倒塌。可能会下一脚雪，或者狂风会让我们折返。毕竟，这是珠穆玛峰。


  我们唯一能控制的是我们的大脑。攀登珠穆玛峰需要很长时间，只要保持专注就赢得了一半战斗。我们关掉头灯，钻进睡袋。明天，终于是表演时刻了。


  # 声音


  ### 母亲身份：作为登山训练


  等计划快结束时，我才告诉朋友和家人，我将在春季花费十周时间攀登珠穆玛峰。我遇到的是许多空白的目光和不理解的眨眼。这种反应与我想爬珠穆玛峰的事无关——任何认识我的人都明白，尝试登上地球最高点对我来说是不可避免的。我看到的表情更多是关于“如何做”而非“为什么”。


  对我来说，探征直到 2012 年 1 月中旬才最终定下来。面对 3 月底即将临近的出发日期，我该如何组织我的生活，更不用说为如此重大的任务进行训练，并让自己离开家十周呢？


  ### 离开孩子们


  这次探征对我来说，发生了一个相当不方便的时间。我是两个小男孩的母亲：在 2011-12 年的冬天，他们两岁，一个四岁。虽然我一直挂念着昆布冰川和珠珠峰，但我设想那是几年后的事，等我的孩子们上了学。我没那种好运。甚至我丈夫也同意，这次爬珠穆玛峰的机会太好了，不能错过。团队非常出色，赞助非常稳固，而合作伙伴——北面之（The
  North Face）、国家地理（National Geographic）和梅奥医学中心（Mayo Clinic）——都非常有吸引力。


  我和丈夫共同决定我应该去。接下来的两个月是绝对且彻底的混乱。除了安排孩子照顾和在我不在期间为丈夫提供支持系统外，我还需要训练。作为一名职业滑雪登山员，我并不是零开始，但作为一名全职妈妈，我的训练窗口充其量非常有限。


  ### 三重挑战


  珠穆玛峰并不是我的第一座 8000 米高峰。我已经攀登并滑过长鱼峰（Cho Oyu），并在巴基斯坦尝试过加喜布鲁姆二峰（Gasherbrum II）。从这些经历中，我知道对我来说训练是一项三兼顾的任务：体能、意志韧性和体重管理。


  回想起来，2011-12 冬季糟糕的雪况实际上对我有利。作为一名滑雪员，如果有好的雪，那是我唯一的活动。但作为一名滑雪员，我知道除了滑雪之外，它并不能让我进入状态。糟糕的雪况让我在为珠穆玛峰做准备时能够跳出固有思维。首先，我需要在照顾孩子的同时进行训练。每周至少三天，我会独自带着两个儿子去滑雪。虽然我四岁的儿子大部分时候可以自己应对，但我儿子经常在我的腿之间，或者系在安全带上由我控制他的速度。这两种方法都需要我不断“犁雪”，这比单纯滑雪要困难得多！其余时间，我会背着他。


  对我来说，训练不仅关乎体能，还关乎心理。背着一个经常尖叫和踢人的两岁小孩子在山上走几个小时，虽然是折磨，但在身体和尤其是心理上是极好的训练。


  随着冬天情况好转了一些，我恢复了常规的训练标准：滑雪登山。这对我来说是攀峰的一个重要工具，因为我的计划是尝试从顶顶滑下。带着这一点，我知道我需要进入那种能提供暴露感并作为心理训练的地形，而且是大量的。


  ### 身体的代价


  极端海拔的一个显著生理反应是持续的体重的减轻和整体肌肉的退化。在高海拔处度过很长时间后，我非常清楚适应与身体退化之间微妙的平衡。许多高海拔登山者（包括在内）都会尝试在挑战
  8000 米高峰之前通过增加体重来给身体提供一点缓冲。我称之为“探征饮食”。努力吃任何东西、任何食物，以期推迟身体消耗自身脂肪储备和肌肉的时间。在我身上，这并不容易。生孩子的副作用之一是它改变了我的体质，变得更加纤瘦。对我来说增加非常困难，我的平均体重比产前轻了
  5 磅。因此，饮食是我准备珠穆玛峰的另一个重要方面。





  我发现，在平衡妈妈身份与保持大远征所需的体能之间，最具挑战性的事情是，我没有足够的机会进入危险、暴露的地形，无法达到我满意的舒适程度。尽管如此，在离开孩子的时间里，我花了很多时间在野外滑非常陡峭的线路。我还找了一些朋友一起去攀冰，仅仅是为了重新熟悉暴露感，以及悬在绳索上使用冰爪和冰镐的感觉。我觉得这类训练对我来说比纯粹的体能训练价值得多。


  最后，我觉得自己对这次远征已经准备就绪。最后的挑战是将心态从“妈妈”切换到“登山者”——这可能是这一切中最困难的任务。


  —`HILAREE O’NEILL` 被 `Outside` 杂志评为运动界最具冒险精神的女性之一，作为 `North Face`运动员，她在全球范围内滑雪和攀岩。


  # 避开人群


  第二天早晨，我们在热情的呼喊声中醒来。我们的夏尔巴人已从 `Camp II` 到达，准备同我们向上直到 `Camp IV`。穿上羽绒服爬出帐篷，我们惊讶地看到一排望不到头的登山者正经过我们的营地。这搞什么鬼？这些人都是从哪里来的？我们系上安全带并排队，将
  `ascenders` 挂在向 `Lhotse Face` 延伸的绳索上。


  在我们的下方，我看到一百多名登山者，像牛群一样头挨着臀地移动。在我们上方，另外的一百名登山者也在挣扎，同样是单列队，拖着身体沿着绳向上爬。我们在山上睡着了，醒来时却发现了一个交通拥堵！


  我被挤在上方一个陌生登山者和下方一个陌生登山者之间。我们彼此紧密相接，无论力量或能力如何，必须以完全相同的速度移动。我感到非常愤怒。这简直是登山运动的滑剧。


  ![](img/Anke_9781426212413_epub_071_r1.jpg)


  2012 年，`危险的长龙`的登山者正在通过 `Lhotse Face` 之上的 `Yellow Band`。


  当然，我们知道有太多的人挤满了 `Everest` 路线。这就是为什么我们等到第二个天气良好的窗口——希望大多数登山者会在获得第一个机会时就去冲顶。遗憾的是，成百上千的其他登山者也有同样的想法。


  问题阻碍了我上方线路上的登山者。人类高速公路停止了。在原地站了十分钟后，我再也无法忍受。我取下 `ice ax`，解开绳索扣，冲向开阔的冰面，咆哮着穿过一个又一个登山者。我超过了
  10 名、20 名登山者。我没有系绳，正在单独攀爬，但地形中等。当我到达拥堵的尽头时，我发现一个夏尔巴人正试图帮助笨手笨脚的登山者，那人不知道如何解开他的 `ascender`
  或将其重新连接到下一根绳索上。我越过他们，重新挂回绳索。


  我很快到达了另一股登山者人群的末端。我再次解开并绕过他们。在途中，我注意到至少有 30 个人挂在一根破旧的绳子上，这根绳子由一根钉在冰里的、严重弯曲的单个 `picket`
  固定。这简直是疯狂。如果 `picket` 弹出，绳索或 `carabiner` 会因为三六名掉落登山者的重量而瞬间断裂，他们都会在 `Lhotse Face`
  上翻滚而下死亡。


  与自己的队伍分离后，我继续在绳索上跳跃前进，穿越 `Yellow Band` 陡峭且裸露的岩石，横穿 `Geneva Spur` 后方。我在午饭前到达了海拔 25,900
  英尺的 `Camp IV`。至少有一百顶帐篷散落在荒凉的 `South Col` 上，像一个被狂风吹乱的难民营。随处可见碎片：垃圾、在废弃帐篷骨架上飘动的破旧尼龙布、冻结的人类粪便。


  我们团队的夏尔巴人搭了两顶帐篷，我倒在其中一顶里。我摘下 `oxygen mask`，向后躺，闭上眼睛。Kagi 给我来了一碗热面。Panuru 把头探进帐篷，叫我重新戴上
  `oxygen mask`。我的队友一个接一个到达，先是 Hilaree 和 Kris，他们俩倒在另一顶帐篷里。Emily 出现了，然后是 Conrad，最后是
  Sam。Conrad，这位老狮子，在没有氧气的情况下从 `Camp II` 一直到了 `Camp IV`。他看起来精疲力竭，脸色憔悴，满脸胡渣。


  “我废了，”他沙哑着说，“我没法冲顶了。”


  几小时后，我们将与至少 200 人一起出发，我们已经知道这将是一团乱麻。在海拔 26,000 英尺以上的死亡带，安全余地薄如蝉，救援几乎是不可能的。我们最大的恐惧不是我们自己，而是我们周围所有的登山者，其中有太多的人没有登山经验或技术技能来支撑他们爬得那么高。


  # 人迹少之路


  1963 年，Whittaker 和 Gombu 在山的高处完全孤身一人；而在今天，这是不可想象的。由于严重依赖夏尔巴的支持和一瓶又一瓶的辅助氧气，每年有 300
  多人登顶珠穆玛峰，自 1963 以来总计接近 4000 人。（当汇总所有数字时，2012 年春季将有 400 多人登顶。）如果没有氧气——登山运动中的“血液兴奋”——以及夏尔巴人，珠穆玛峰仍将是顶级高海拔登山者的专属领域。


  # 冲顶


  在 `Camp IV`，我们在帐篷里休息到晚上 9 点：然后该出发了。寒冷的风在咆哮，当我们戴上 `oxygen mask` 时，每一处暴露的皮肤都会被冻伤。穿着厚重的羽绒服，戴着护目镜、呼吸器和大手套，我们看起来更像宇航员而不是登山者。


  当我们在黑暗中出发时，我抬头望向圣诞树般的闪烁灯光，登山者的头灯直直升入黑天空。到达固定绳时，我们再次发现自己处于几十个移动极其缓慢的客户后面。




  在距離四营上方仅一小时的地方，我们遇到了第一具尸体。那死者侧卧在地上，仿佛在雪地里打盹，头被冲锋服的兜帽盖着。十分钟后，我们遇到了另一个尸体，她的躯干和头部包裹在一面加拿大国旗里。二分钟后，另一个尸体，一个韩国人。他仍系在绳索上，坐在雪子里，冻得像石头一样僵硬，脸发黑，双眼圆睁。


  在上周前的第一次冲顶中，有四个人去世了。怎么？为什么？在与夏尔巴人的采访中，我发现每一个案例中，死亡的原因都是傲慢。这四个人都曾被他们的夏尔巴人告诉移动得太慢了，即使到达山顶，也没有足够的体力下山——而这四个人都拒绝了回头。


  据说，那个裹在加拿大国旗里的女子在崩溃前已经使用了九瓶氧气（通常是两到三瓶）。悲剧的是，骄慢在跌落之前。丹努鲁（Danuru）告诉我，他过去遇到过一些客户，当被要求回头时，他们说自己花了很多钱来这趟旅行，并期待到达山顶。当他们最终崩溃时，丹努鲁只是用套索套住他们，把他们从雪地拖下来。由于山体如此干燥且多岩石，这种救援现在是不可能的。如果你停下来坐下，就会冻死。


  那个韩国人在去世前，当他的夏尔巴求他回头时，他实际上向向导打了一拳。现在，当我跨过他冰冷的尸体，他的脸冻结在僵硬的扭曲中，我通过提醒自己克服了这一场景的恐怖：大山并没有杀死这些登山者——是他们自杀了自己。他们死于自大。


  潘努鲁（Panuru）和我尽可能地忍受着这种走走停停的人流。然后，潘努鲁拍了拍我的肩膀，示意我绕过去。尽管周围一片漆黑，我们正站在如刀刃般的雪脊上，两侧是 5000
  英尺的深渊，但我乐意解开锁扣，绕过了一个由十个登山者的结。潘努鲁跟在后面，然后默默地越过我，向我竖起大拇指。从那那时起，潘努鲁和我组成了一个团队。只有在没有其他人在我们正上方爬时，我们才使用绳索。否则，我们在每个瓶颈处都会单独绕行。


  天还是黑，但当我们潘努鲁到达南峰时，天空已变成紫色。现在，大多数头灯都在我们下方而不是上方。我们穿越山口到达希拉里里台阶的底部，那是一面 25 英尺高的垂直岩壁，被数千万个冰爪点留满了痕迹。几名登山者正沿着绳索向上。潘努鲁和我迅速攀爬上岩石并绕过了他们。


  我们现在能看到山顶了。它就在脊线边缘。粉色的天绒般光芒洒满了天空。我觉得自己仿佛在一个鱼眼镜的中心，看着世界向各个方向坠落。地球上的一切都在脚下。一切。一排排的山脉，甚至是云朵。我上方只有外层空间。


  在岩石旁探索时，我们遇到了克里斯（Kris）、希拉里（Hilaree）和丹努鲁。江布（Jangbu）已经上去进行 GPS 测量。我们五个人一起慢慢向山顶走去。风撕扯着插在顶部的西藏经幡，但我们无法靠近它们：至少有
  40 人挤在山顶的小丘上。相反，我们在顶下方几英尺处停下，举起手臂，紧紧拥抱在一起。


  艾米莉（Emily）、然后萨姆（Sam），以及我们的其他夏尔巴——达瓦（Dawa）、丹迪（Tendi）、明玛（Mingma）、索南·多杰（Sonam Dorje）和拉克帕（Lakpa）都将在几小时后站在山顶。第二天，仿佛死而复生般，康德（Conrad）将振作并无氧登顶，这是少于
  200 名登山者完成的成就。在耐力的极限考验中，克里斯和希拉里在四营仅休息半天后就继续冲顶了相邻的洛子峰。我们的整个团队，包括登山者和夏尔巴，将在三天后安全回到大营。


  但此时，站在世界之巅，我知道我本应该感到狂喜、喜悦。我知道这就是 1963 年美国远征队登顶者的感受。霍恩博因（Hornbein）写道：“我们泪流满面地拥抱在一起，泪水流过氧气罩冻成了冰。”但在
  50 年前，攀登珠玛峰是一个更大、更丰富的挑战。有更多的未知数，余地也更小，个人努力也更大。事实是，珠玛峰已经被驯化，被拔了爪。山的雄伟和攀登它的意义已经减弱。半世纪前，攀登珠玛峰是登山技艺的胜利。今天，从现代登山伦理的角度来看，这几乎是一项缺乏运动精神的成就。


  那么站在珠玛峰顶，我有何感受？我承认对仅仅是坚持感到些许自豪，对日复一日地喘着粗气依然一步向前感到。我也感到如释重负。这该死的事终于结束了。但也感到一种不安的模糊感。我不认为自己真的配得上世界最高峰的宏伟。这并不是一场公平的战斗，我很清楚。


  ![](img/Anke_9781426212413_epub_072_r1.jpg)


  `萨姆·埃利亚斯（SAM ELIAS）下降`（右侧）从南峰继续前往山顶。在海拔 28707 英尺（8750 米），南峰是第一个能看到珠玛峰真顶的地方。山顶的景象与今天不同：那里没有以前登山者留下的视觉纪念品，没有大型登山团的拥挤。“看起来在我们之前没有人来过，”布雷哈斯说。![](img/Anke_9781426212413_epub_073_r1.jpg)


