  ![](img/Anke_9781426212413_epub_037_r1.jpg)


  ![](img/Anke_9781426212413_epub_038_r1.jpg)


  **巴里·毕肖普（BARRY BISHOP）** 在 1963 年登顶休息时，周围只有空气，那是他和另外三位美国人成为该国首批登顶者的年份。


  当丹青·诺尔盖（Tenzing Norgay）爬上希拉里台阶时，埃德蒙德·希拉里描述他“像一条大鱼”，他们都知道自己即将登上地球最高峰。当他们在那个历史性的一天（1953
  年 5 月 29 日）在顶拥抱时，他们的名字与珠穆玛峰永远联系了一起。


  十年后，当威尔·温索德（Willi Unsoeld）和托马斯·霍恩贝因（Thomas Hornbein）爬过一条以他命名的冰槽到达珠穆玛峰顶时，霍恩贝因思考了这一切的意义：“真是很奇怪，当一个梦想实现时，只剩下怀疑。”






  1979 年 5 月 8 日，雷因霍德·梅斯纳（Reinhold Messner）承认，当他与彼得·哈伯勒（Peter Habeler）站在珠穆峰顶，成为首位未使用辅助氧气登顶的人时，他并没有感到特别——只有一种平静。只有当哈伯勒在他汇合时，情感才涌上两人的头头。


  一年后的 1980 年 2 月 17 日，面对咆啸的冬风，波兰登山者克什斯托夫·维尔卢斯基（Krzysztof Wielicki）和莱谢克·齐希（Leszek
  Cichy）到达顶峰，成为首位冬季登顶珠穆峰（或任何 8000 米级高峰）的人。所有因素对其不利，但他们知道必须表现。正如维尔卢斯基解释道：“波兰就是波兰，珠穆峰就是珠穆峰。”


  英国登山家艾莉森·哈格雷夫（Alison Hargreaves）在 1995 年从珠穆峰顶通过无线电报告时哭笑着：“告诉我的孩子们，我正在世界之巅，我深爱他们。”在成为第二位未使用辅助氧气登顶的女性以及首位单人独攀的女性后，艾莉森的第一念头是她的孩子们。


  ![](img/Anke_97881426212413_epub_039_r1.jpg)


  英国传奇登山家乔治·李·马洛里（George Leigh Mallory，左）和安德鲁·欧文（Andrew Irvine）的肖像将这些人定格在时间中。他们开辟了从西藏东北脊路线，但在
  1924 年尝试登顶时消失在云雾中。这是马洛里四年内的第三次登上珠穆峰。


  卓越的时刻。惊人的成就。历史的诞生。但是什么导致了这些非凡的壮举？它们并非偶然。多年的努力、数十年的探索、数十个未实现的梦想和志向成就了这些登顶时刻。而这一切都始于一次意外的测量。


  ## 探索岁月


  “先生，我发现了世界上最高的山，”拉达纳斯·西克达（Radhanath Sikdar）冲入印度总测量师安德鲁·沃爵士（Sir Andrew Waugh）的办公室时惊呼道。他的宣告塑造了喜马拉雅登山的历史。在此之前，洛子岗群峰一直占据领先地位。但在乔治·埃弗莱斯特爵士（Sir
  George Everest）领导的印度大三角测量完成完成后，这座被称为`Peak XV` 的山显得更高，大约 29,000 英尺（8,839 米）。随后的测量将总高度略微增加到
  29,028 英尺（8,848 米）。


  乔治爵的继任者认为，用这位发起测量的人命名这座山是合适的。珠穆峰的名字永远不会被忘记，尽管根据丹增·诺盖（Tenzing Norgay）的话，Chomolungma（意思是“鸟不可飞越的山”）是一个更具描述性的称号。


  于 1857 年成立于伦敦的阿尔卑斯俱乐部（Alpine Club）很快成为进入更大山脉的孵化器。其早期探险家之一查尔斯·布鲁斯（Charles Bruce）是第一个提出攀珠穆峰的人。世界大战停止了所有努力，但战争结束后，兴趣重新燃起。


  1919 年，在瑞士到印度等异域长大并几乎从世界大战中中逃生的摄影师兼电影师 J.B.L. 诺尔上（Capt. J. B. L. Noel）向皇家地理学会演讲，声称他在
  1913 年曾伪装旅行，位于珠穆峰 40 英里的范围内。一年后，对海拔对人体影响感兴趣的化学教授亚历山大·凯拉斯斯（Alexander Kellas）展示了他在珠穆峰冰川
  10 英里内拍摄的照片。凯拉斯斯和诺尔很快策划了秘密的攀登计划。


  在获得达赖喇嘛前往珠穆峰远征的许可后，阿尔卑斯俱乐部与皇家地理学会联手合作。他们的策略是：1921 年进行侦察，次年进行正式尝试。四人侦察队包括一位年轻的登山者乔治·李·马洛里。马洛里是一位牧师之子，他是英国最出色的登山者之一，而且帅得不可思议。


  马洛里并没有立即接受提议。他有自己的职业，还是个有子的丈夫。但他明白攀登珠穆峰可能对他的事业有利，于是他接受了。这个决定将让他闻名，但也将让他付出生命。


  1921 年 5 月，由于尼泊尔对外国人关闭，小组离开大卓岭（Darjiling），向北穿越西姆进入西藏，由背着重物的谢尔巴陪伴。不到一个月，珠穆峰夺走了它的第一位受害者。凯拉斯斯在接近但仍可见山上去世，显然死于心衰竭。这是一个沉重的打击，因为凯拉斯斯是一位经验亚洲探险家，已经登过九座超过
  20,000 英尺的山峰。他还预测珠穆峰可以在没有辅助氧气的情况下登顶。他是的。但在 50 年后才有人做到了。


  当探险者出现在鲁布布冰谷时，雄伟的山峰在他们面前拔地而起。马洛里描述它是“一种宏伟的姿态，主宰一切，在无可挑战且孤立的霸权中显得广阔。”更具体地说，他看到的是
  10,000 英尺的北壁，左侧是东北脊，右侧是长长的西脊。另一座山脊向北延伸，完成了这一几何结构。


  他们探索了数天地形，穿越鲁布布冰川，攀登小山峰以获得更好的视野，试图拼凑地形，始终寻找平坦的土地。但他们错过了一条不起眼的小溪，它从东部狭窄的山谷流出进入鲁布布冰川，这条溪最终为攀登那座山提供了关键。从一个他们称为`Lho
  La` 的高山口，他们可以看到昆布冰川和上部盆地，他们将其命名为`Western Cwm`。经过两个月的寻找，他们找到了一条通过`Lhakpa La`到达东鲁布布冰川的路。直到
  9 月 24 日他们才到达大营，出发已经四个月了！马洛里精疲力竭，在信中写道：“明年我不去了。”


  1922 年季风前尝试的顶点是杰弗里·布鲁斯（Geoffrey Bruce）与英国最好的雪冰专家乔治·芬奇（George Finch）一起到达 8,321 米，两人都使用了辅助氧气。令人惊讶，这是布鲁斯的首次攀登。但当一次巨大的雪崩在大本营发生时，远征陷入了悲剧，七位谢尔巴遇。


  1924 年，一位新人加入了小组——安德鲁·康明·欧文（Andrew Comyn Irvine），大家都叫他桑迪（Sandy）。这位肩膀宽阔的顶级运动员曾在牛津大学划船，拥有顶级的实用技能和良好的态度。他的大孙女朱莉·萨默斯（Julie
  Summers）记得：“桑迪·欧文天生勇敢。”早早，马洛里就选中桑迪作为他的首选攀登伙伴，部分是因为他的能力，更重要的是他对氧气设备的熟练运用。


  马洛里对 1924 年的珠穆峰之有一个策略：两次同步进攻，一次使用氧气，一次不使用。他打算使用`gas`并与欧文一起登顶。在第三次登上珠穆峰时，马洛里是所有人中最有动力，近乎冷酷。在给妻子的信中写道：“按照这个计划，我几乎认为不可能登顶；我无法想象自己失败地回来。”对于一位剑桥的朋友，说得更为直白：“这将更像战争而不是登山。我不认为自己能回来。”


  在山上待了几周后，远征领队 E.F. 诺顿（E. F. Norton）付出了巨大的努力。在没有辅助氧气且视线模糊的情况下，他在 8,570 米处返回，距离顶峰仅
  900 英尺。他的无氧记录持续了 54 年。四天后，马洛里和欧文携带气瓶，从海拔 26,800 英尺（8,169 米）的六号营出发。几小时后，诺尔·奥德尔正在扫描坡面，此时云层散开，显示一个小物体快速向上移动，接近一个岩阶。另一个物体随其后。它们看起来在移动。





  奥德尔非常困惑。那对人已经到达了第二台阶——山脊上一段陡峭的岩石区域——但他们的进度严重落后于计划。出于担心，他爬得比六营还要高，一边呼喊一边长啸，试图诱导那两个登山者下山。他下到北坳，第二天他又爬到了比六营更远的地方，但没有任何回应。最后，他从帐篷里拖出两个睡袋，并将它们摆成“T”字形，这是一个向下方队友的信号，表示一切大去。根据最后一次目击以及对他们登顶的强烈渴望，奥德尔坚信两人已经登顶了。对于鲁丝·马洛里（Ruth
  Mallory）来说，这并不重要。珠穆玛玛夺走了她的丈夫和孩子的父亲。


  在登山史上，没有哪哪位失踪的探险家比乔治·马洛里（George Mallory）引发更多的猜测。1933 年，人们在现在被称为“第一台阶”的岩石阶下方 250
  码、东方的岩板上发现了一把冰斧。这比奥德尔看到的位置稍低，但几乎肯定属于那两名登山者之一。接着，在 1975 年，中国登山者王洪宝报告说他发现了一名登山者的遗体，他称之为“一个老英国人”。这一阴森的发现发生在海拔约
  27,000 英尺的六营附近。遗憾的是，无法进一步询问，因为他在一天后在山上离世了。


  ![](img/Anke_9781426212413_epub_040_r1.jpg)


  在 1922 年的英国探险期间，乔治·马洛里和爱德华·诺顿（Edward Norton）向他们该山上 26,985 英尺（8,225 米）的高点攀登。北坡的一条冰槽将以诺顿命名，现在也称为“大冰槽”。雷因霍德·梅斯纳（Reinhold
  Messner）在 1980 年登顶时利用了那里——那是首次不携带辅助氧气的单人登顶。


  1986 年，美国人汤姆·霍尔泽（Tom Holzel）聘请了英国珠穆玛历史学家奥德丽·萨尔凯德（Audrey Salkeld），开展了首次专门为了寻找那两人的探险。他们的努力没有成功。1999
  年，一位德国年轻人约亨·赫姆布（Jochen Hemmleb）与萨尔凯德以及由埃里克·西蒙森（Eric Simonson）领导的美国小组合作，发起了第二次尝试。他们的发现震惊了登山界。


  ## 早期的胆识


  在 1924 年尝试九年后，另一支队伍出发了。其中就包括埃里克·希普顿（Eric Shipton）。希普顿于 1907 年出生在当时的锡隆（现今斯里兰卡），八岁时被带到伦敦以“安顿下来”。然而，学校生活被证明是一场灾难，因为希普顿表现出典型的阅读障碍迹象。他最终搬到东非洲务农。他本身已经是一位敏锐的登山者，吸引了另一位在非洲务农的英国人——H.W·蒂尔曼（H.
  W. Tilman）的注意。尽管他比希普顿大十岁，两人很快就成为了登山伴侣。性格开朗的希普顿和孤僻的蒂尔曼似乎是不太匹配的搭档，但他们可能是登山史上最传奇的一对。


  希普顿的功勋使他受邀在加尔瓦喜马拉雅山攀登，这反过来把他带到了珠穆玛玛。尽管 1933 年团队中的三名登山者追平诺顿在 1924 年创造的高度记录，但他们并没有登顶。希普顿相信，一支规模更小、装备精简、行动迅速的队伍会有更大的机会。


  明年，没有登山经验的英国飞行员莫里斯·威尔逊（Maurice Wilson）坚信自己能爬上那座山。他仅凭着膨胀的自尊心，穿过了锡金姆和西藏，因为没有许可证，他还是伪装行走的。作为一名极端的苦行者，他计划靠米水生活，攀登荣鲁布冰冰川，并在三四天内登顶顶峰。幸运的是，他在三营发现了
  1933 年队的食物补给点，他似乎还尝过。但他吃的东西不足以让他登顶，死在离补给点不远的地方。即使是极简主义大师埃里克·希普顿也承认威尔逊的做法走得太远。尽管如此，他钦佩他的信念。他后来写道：“虽然这不是登山，但它是壮丽的。”


  相比之下，1935 年的探险是一次谨慎的尝试。团队被赋予的任务仅是从北侧找到进入西冰斗形（Western Cwm）的方法。许多人对这支由希普顿亲自领导的小组没有走到底而感到失望。希普顿厌恶大规模活动，并乐于保持探险队的的精简和高效，这种“轻量化”的方法赢得了后世登山者的青睐。他的团队成功攀登了
  26 座海拔超过 20,000 英尺（6,000 米）的山峰，他将其描述为“一场真正的登山盛宴”。团队成员中有一位 19 岁的西藏谢尔巴人丹增仁·诺尔盖（Tenzing
  Norgay），他被希普顿在达勒岭雇佣的。作为 13 个孩子中的第 11 个，他早已痴迷于珠穆玛玛，而希普顿给了他第一个机会。


  1935 年的探险收集了大量信息，对未来在该山上的成功有所贡献。他们探索了大部分周边地区，更好地了解了该山安全攀登的时间窗口，并证明了小而敏捷队伍的价值。这次探险展示了希普顿作为一名模范探险家的形象。


  1936 年，一次大型探险被风暴击败，1938 年由蒂尔曼主管。和希普顿一样，他青睐轻量化方法。蒂尔曼并不是一个宽容的人，特别是对于队友诺尔·奥德尔（Noel
  Odell），后者正试图用一台湿度计进行科学实验。“结果出奇地多样，以至于结论这只是在猜，”蒂尔曼总结道。他进一步批评奥德尔冗长的野外笔记，将其描述为“近年来发表的最长小说”。


  蒂尔曼对食物供应的挑剔而闻名。他嘲笑果酱，认为唯一价值成分是糖。为什么不只带糖，省掉那些重量呢？在他看来，当时常用的罐头食品是浪费时间。他更偏爱真正的食物：培根、奶酪、黄油和鸡蛋。1938
  年，他成功地将“英式早餐”培根和鸡蛋带到了北坳。尽管食物很好，这次探险又是一次失败尝试，希普顿称之为“极其糟糕的时间浪费”。随后第二次世界大战介入了，重点也发生了转移。


  ## 尼泊尔开启大门


  1949 年，尼泊尔王国向外国人开放了大门。来，美国登山者查尔斯·休斯顿（Charles Houston）和他的父亲奥斯卡（Oscar）获得了进入索洛昆布地区调查珠穆玛玛南侧的许可。他们邀请了蒂尔曼，尽管他持有歧视女性的态度，但他接受了，尽管有一位女性同行。“迄为止，我并不认为女性是喜马拉雅之旅装备中不可或缺的一部分，但人总是在生活中学习。反正，有医生治我们，有女性喂我们，还有牧师为我们祈祷，我觉得我们可以充满心地面对未来。”他们对珠穆玛玛南坡路线的评估是暗淡的。休斯顿认为冰瀑可能“强行”通过，但承认看起来并不乐观。蒂尔曼的说法更简洁：“不可能。没有路线。”


  珠穆玛玛侦察是蒂尔曼最后一次进入世界最高峰的尝试。作为一个务实的人，他评估了自己在喜马拉雅山的岁月、目前的身体状况和动力水平，决定是时候前进了。前往巴塔哥尼亚和格陵兰岛的漫长而危险的旅行带来了他更多的冒险，也许也应的是，1977
  年 11 月 1 日，他带着一群船员向福尔克兰群岛方向出发。从此再也没有音讯。




  1951 年，肖普顿受邀带领另一次前往珠穆玛峰南侧的探险活动。同行的有一支英国精英团队，以及几位新西兰人，其中包括埃德蒙·希拉里。他们几乎立刻遭遇了被称为“昆布冰川”的、极度不稳定且错综复杂的雪与冰川混合体。肖普顿认为这条路太危险了，但希拉里不同意，他说：“我知道尝试攀登这座山的唯一方法就是改变旧的安全标准和合理的风险标准，迎接突如其来的危险；义往向前。小心和谨慎永远无法在冰川中开辟出路线。”他们成功穿越了冰川到达西冰谷（Western
  Cwm），但一个横跨整个山谷的巨大裂缝让他们被迫折返。


  回到加德满都后，肖普顿得知瑞士人已经获得了来年的许可证，这意味着他必须等轮。当瑞士人在 1952 年尝试登珠穆玛峰时，肖普顿只好满足于附近的乔秀如峰，他和他的团队并未登顶。与此同时，瑞士人几乎触及了珠穆玛峰顶顶。雷蒙德·兰伯特和丹增·诺尔盖登上了东南脊，距离顶峰仅
  800 英尺。肖普顿出发前往巴伦山谷和阿鲁山谷进行探险访问，而不是回到家负责第二年的登顶尝试，而这一决定被证明了他的致命错误。


  英国人比以往任何时候都决心在 1953 年让某人登顶。在总部，委员会对此焦急如焚。他们*必须*征服这座大山。到底出了什么问题？在经历了这么多尝试后，一定缺少了某些关键要素。啊！一定是领导力的问题。也许一个军人可以很好地组织这项工作。他们向肖普顿和约翰·亨特上校提议共同领导，而亨特是一个高海拔经验有限的人士。肖普顿当场辞职了。这显然是一种轻视——甚至是一种侮辱。但也许委员会是对的。查尔斯·沃伦写道，尽管他对肖普顿怀有无尽的尊重，但这个决定可能是正确的。“我个人可以理解为什么他最终没有被选来这样做——事实是，到那时，他的心已经不在那里了。他已经发现了通过南柱到达顶峰的路线，作为一位伟大的探险家，他已经完成了自己的使命。对他来说，重要的是发现，而不是征服。”


  # 声音


  ### 马洛里要去哪里？


  乔治·马洛里在珠穆玛峰去世后，他的姐姐们秘密询问父母是否知道“乔治是什么样的人”，是否完全理解他以及妻子露丝。现在——当我们翻遍马洛里写过的每一个已知文字，重述了他的生平，并对他最后一次攀登进行了无尽的审查，甚至探究了他的性取向——我们是否仍然知道他是一个怎样的人？我们几乎只从登山的术语中记得他，但——与今天的职业登山者相比——他实际花在攀登上的时间是片段性的。这并不是说他在岩石攀登上不，也不是说他没有从山峦以及在山上建立的友谊获得强烈的精神支持。但当生活中还有这么多事情时，不能说马洛里“为山而活”。我们或许应该再次审视他的故事，抛开那种传统的观念，即他在这座标志性山峰上的早逝是他个人追求的终结……


  ### 一个迷人的男人


  从朋友及其他人撰写的马洛里讣文中，你可以看到一个拥有强烈道德良知、诚实、勇气和一种不经意魅力的男人。爱他的人最频繁使用的词汇是：敏感、聪明、侠义、顽皮，以及正如我们预期的那样，无畏。科蒂蒂·桑德斯对他“对美之渴求”感到欣喜，说没有人比他更有鉴赏的才华。另一个反复出现的词是“内省的”。杰弗里·杨赞扬“他的教育能量，他坚韧的内省精神，这种精神能追溯每一项兴趣的源头，除了自我利益……”乔治被亲切地称为“加拉哈爵”；但他的圣杯是像看起来那样的世界最高峰，还是更高层次的文化与理解？我们知道露丝是来世的坚定信者，通过相信他正准备迎接更好的东西，她发现更容易接受自己的失去。


  在许多方面，马洛里是一个发育缓慢的人。尽管天赋从一开始就几乎存在，但他花了时间来驾驭这些天赋。这让他的死更具悲剧性：如果他活着，我们本可以看到更多。令人遗憾的是，对于他在国际联盟联合或校外研究委员会工作期间的计划，以及这两个机构是否相互关联，我们仍然只是一个模糊的画面。他热烈地相信教育的解放作用，但他可能倾向于政治——谁知道呢？凭借他显而易见的魅力，即使在电视时代之前，我们可以想象他通过讲堂和广播接触更广泛的观众。他本可以是像《智力信任》（The
  Brains Trust）这类热门节目的候选人。无法想象他在 30 年代和 40 年代处于职业巅峰时期可能产生怎样的影响。


  ## 历史铭记


  如果他自己回顾自己短暂的人生，可能会认为自己失败了。即使他想成为作家的愿望在世时也成果有限，尽管现在我们已经读了他在给家人和朋友的信中高产记录的每一个字——而且知道他拥有跨越世代的交流天赋。


  更多的纪念品不断出现……当我写下这些时，另一封在他最后一次离开前几天写下的信正在 eBay 上出售。最近出现了一把珠穆玛峰冰斧，其来源是马洛里为`巅峰俱乐部`（Pinnacle
  Club，一个 1921 年成立的专门女性俱乐部）提供的帮助。传言暗示还有其他的亲密信件。乐观地想，我想我们可以了解到更多。


  —奥德丽·塞尔德，英国作家奥德丽·塞尔德写过许多关于登山和探险的书。


  ## 丹增与希拉里


  当英国团队在明年请求丹增·诺盖的服务时，他最初并不愿意去，他对兰伯特太忠诚了。但这位瑞士登山者鼓励他：“抓住机会吧。和谁并不重要。”查尔斯·埃文斯和汤姆·布多隆在
  1953 年接近成功，到达海拔 875 米的南峰，但他们的氧气瓶不可靠。奖项留给了这对奇特的组合：身高 6 英尺的埃德蒙·希拉里和身高 5 英尺的夏尔巴丹增·诺盖。他们在
  1953 年 5 月 29 日首次登顶珠穆玛峰。这是一个团队协作的结果。前一天，乔治·洛伊、阿尔夫·格雷高里和昂·尼玛每人携带超过 40 磅物资，一直切到海拔
  8500 米的最后营地，为希拉里和丹增提供支持。在卸下货物后，他们留给两人最后晚的准备。第二天早晨 6:30，希拉里和丹增走出帐篷，背起 30 磅的氧气装备，连接上面具，开始向上爬。一切顺利，直到他们遇到了一个看起来险严的障碍——后来被称为`希拉里台阶`”。希拉里在前，丹增随其后。从那里开始，他们只需要沿着山脊向上爬，直到没有可以爬的地方。





  当派往小组的英国记者詹姆斯·莫里斯（James Morris）意识到伊丽莎白二世女王的加冕将在三天后举行时，他急于及时将消息传回伦敦。对于年轻的女王来说，这是多么完美的礼物啊！电报以加密形式传输了这一令人震惊的消息：“希拉里和丹增于
  5 月 29 日登顶珠穆玛峰。”当 6 月 1 日夜，人群聚集在伦敦街头，热切期待次日的皇家巡游时，报纸标题大吼着：珠穆玛峰被登顶。


  莫里斯将其称为“最后一次纯真的冒险”，但随后发生的国际争端几乎摧毁了希拉里与丹增之间的特殊关系。尼泊尔政府试图说服丹增声称自己是第一个登顶峰的人。他们甚至骗他签署了一份陈述这一事实的文件，尽管这并非事实。（这对组合一直到
  1993 年都坚持他们“共同登顶”的说法，直到那时希拉里宣布是他先迈了一步。）


  ![](img/Anke_9781426212413_epub_041_r1.jpg)


  `希拉里和诺尔盖`在成功登顶后满面带笑。这两个人的生活因为他们新获得的名声而永远改变了。希拉里评论道：“我完全没有对媒体和普通大众反应的预期。”


  随后，有三个国家都声称丹增是他们的人。他回忆道在他生命的前 38 年里，没有人在意他是什么国籍：西藏人、印度人还是尼泊尔人。突然所有人都想要他。“但现在一切都在推推拉拉。我不再是一个人，而是一个某种挂在绳子上的娃娃。一定是我先到达顶部的——比希拉里领先出一个一码、一英尺、一英寸。对某些人来说我应该是印度人，对另一些则是尼泊尔人。真相并不重要。”


  珠穆玛峰对其首批登顶者们的生活产生了巨大影响。在所有登顶的人中，希拉里对让他闻名的国家回馈最多。他创立并致力于喜马拉雅信托（Himalayan Trust）的工作是持续、慷慨且富有意义的。在整个昆布地区，学校、寺院和医院相继落成。


  然而，没有任何荣誉能比得上给予丹增·诺尔盖（Tenzing Norgay）的。对于数百万人来说，他几乎成为了神的化身。他的名字变成了神话，作为未来希望的护符引起共鸣。当希拉里在
  1997 年参加达卓岭纪念丹增生像的揭幕仪式时，他说：“我从未认为自己像丹增那样是一个英雄，我相信丹增无疑是。从卑微的开始，他实现了世界之的高度。”


  ## `声音`


  ### 征服顶峰


  我再次检查了氧气瓶组。流量看起来正常。转向丹增，我说：“你感觉怎么样？”


  他只是笑着，手朝山脊向上挥了挥手。我再次领头，切开步子。我的冰镐工作仍然很有节奏且放松；我已经开凿了一多一个小时了，但到为止，我避免了那种会让酸痛手臂加剧的紧张感。


  是一阶，又是一阶，又是一阶。我们沿着向右弯曲的山脊前进，好奇顶峰可能在哪里，或者是否是否存在。我绕过一个岩石的后面，却发现一个更高的岩石正对着我的脸。它似乎无止尽。


  我很疲惫，我试图在其中一段路通过跳过切冰步骤并依靠我的冰爪来节省时间。几码后我又换回了冰镐；角度还是太陡、太危险了。我们在岩阶顶端所感受的热情正在消退。我无力而冷酷地在另一个凸起处开凿出一条路线。


  ### `站在世界之巅`


  突然，我意识到前面的山脊并不是向上倾斜，而是向下的。我迅速看向右侧。那里，就在我正上方，有一个圆润的、覆盖着雪的小包，大约有一个草堆一样大。


  顶峰。


  最后一个问题困扰着我：顶峰本身只是一个巨大的、微妙平衡的雪脊吗？如果是那样，那么别人就可以获得踏在上面的荣誉。


  我小心翼翼地向上爬了几英尺，用冰镐探测前方。雪很结实，压实得很紧密。我们踉跄着走完最后一段路。我们到了。上方空无一物，下方是世界。


  起初我并没有感到巨大的欣悦，只有如释重负和一种惊奇感。然后我转向丹增并握了他的手。即使隔着雪镜、结满冰霜的面具和针织头盔，我也能看到那个快乐、闪烁的微笑。他双臂环住我的肩膀，我们互相拍击胸部，我们没什么可以说的，也不需要说的。


  我的表显示为 `11:30`。从南峰出发花了我们两个半小时；从我们的帐篷出发花了五个小时。时间似乎长了一点点。


  ### `照片证明已登顶`


  我关掉氧气摘掉面具。在 29,000 英尺的稀薄空气中，我的呼吸变得稍快了一些，但并不太难受。我从衣服里取出一直保温的相机；如果我们想要凿地证明我们确实来过这里，就有必要对每一条山脊进行拍摄……


  在雪中挖一个小洞后，丹增埋下了几个许多佛教信徒相信居住在高处的神灵的供品：女儿送的一支小蓝色铅笔、一块巧克力、一些饼干、一串糖葫。我在这些礼物旁边放了一个约翰·亨特（John
  Hunt）从朋友那里得到的小十字架。


  是时候下山了。我更换氧气，吸入空气，出发。我们踩着冰爪移动，我切路。我们熟悉路线，我们快速前进。


  `埃德蒙·希拉里爵`来自新西兰的养蜂人，他在 1953 年被封爵，并将一生献给慈善。


  ## `新路线`


  下一次突破发生在 1960 年，当时中国和西藏人进行了一场规模巨大的远征，其领导正是毛泽东。他们选择了北脊，那里是马洛里和尔文最后出现的地方。中国人似乎通过一种梯子方法解决了这个问题，在他们弃用靴子和冰爪后，这种方法奏效了。但他们距离顶峰还有很远。直到
  5 月 25 日凌晨 4:25，王富之和丘英华（中文）才登顶。他们的登顶在多年内都没有得到认可，历史学家奥德丽·萨尔凯德（Audrey Salkeld）曾指责西方登山者。怀疑情绪根深蒂固，以至于中国人感到必须再次尝试——1975
  年。这次他们带了梯子来对付那些台阶，这一特征直到今天仍在山上。


  ### `63 年 AMEE`


  当美国人在 1963 年到达时，珠穆玛峰的三条主脊中的两条已经被探索过了：只有西脊尚待之。但美国人最需要的是登顶。没有美国人做过那件事，现在是时候了。他们由诺曼·迪伦富特（Norman
  Dyhrenfurth）领导，他是一位拥有影星外表和性格的瑞士电影制作者，曾是 1952 年瑞士队的官方摄影师。美国地理学会赞助的美国珠穆玛峰远征队（AMEE）包括吉姆·惠特克（Jim
  Whittaker）、巴里·毕晓（Barry Bishop）、鲁特·杰斯塔德（Lute Jerstad）、威利·温塞尔（Willi Unsoeld）和托马斯·霍恩因（Thomas
  Hornbein）。后勤由尼泊尔老兵吉米·罗伯茨（Jimmy Roberts）负责。这是一次注定成功的远征。不仅是美国人，连远征赞助者也期待胜利。远征最初的计划是完成大贯：珠峰、洛子峰和努峰峰。但很早，霍恩因（一位来自西雅图的麻醉医生）和温塞尔（尼泊尔和平队副主任）就开始想象一个更宏大的计划。






  他们的梦想为团队带来了严峻的挑战。他们的讨论永无止境，关于在何处、如何、何时，以及在什么样的支持下。民主是一个奇妙的概念，但在攀登大山时未必如此。到达顶峰是当务之急，因此他们决定，南山口（South
  Col）路线是首要任务。西脊队将不得不满足于剩下的份额。一旦南山口路线到达顶峰，西脊队的成员将获得属于他们的时刻。


  他们确实做到了。`Hornbein` 和 `Unsoeld` 的这次攀登之所以如此具有标志意义，是因为他们到达了一个无法回头的点点。他们只有彼此。即使在他们通过后来被称为
  `Hornbein Couloir`（霍恩因冲槽）登顶后，他们还必须在极其严寒的 28,000 英尺（8,535 米）露天营地中，协助在山南侧的队友。


  他们并不是第一批到达顶峰的美国人。那项荣誉是由 `Jim Whittaker` 和 `Nawang Gombu` 领导的南山口小组获得的。随其后的是 `Lute
  Jerstad` 和 `Barry Bishop`，他们最终在顶部附近与西脊的小子们共度那次绝望的露营。他们都幸存了，但代价是巨大的：`Unsoeld` 失去了九个脚趾，而
  `Bishop` 失去了全部十个。


  珠玛峰改变了那 1963 年名攀登者的命运——对于 `Whittaker` 尤其是如此，在征服珠玛峰后，他的社交圈围绕着肯尼迪家族运转。悲剧追随了 `Unsoeld`，他不仅在山中失去了自己的生命，还失去了女儿
  `Nanda Devi Unsoeld` 的生命。或许更具反思性的是，`Hornbein` 继续寻找珠玛峰成功的意义：“我为什么在这里？我似乎在搜寻一些我甚至无法提出的问题的答案。即使我登上了顶，珠玛峰又能带来什么不同？那里有什么能让我变得更聪明？”他花了多年时间才开始发现答案。


  ## 最后的伟大难题


  直到 1975 年，珠玛峰上又有一条主线被开发，当时 `Chris Bonington’s Southwest Face expedition` 让 `Dougal
  Haston`、`Doug Scott`、`Peter Boardman` 和 `Pertemba Sherpa` 登顶。但那次里程碑式的攀登并非一次尝试完成的。早在此之前挑战这个“最后的伟大难题”发生在
  1971 年，由过两次珠玛峰老兵 `Norman Dyhrenfurth` 领导。它以失败和人与之间的战争告终。第二次进攻发生在 1972 年，这次由 `Dr.
  Karl Herrligkoffer` 领导，他邀请了英国攀登者 `Don Whillans`、`Hamish MacInnes` 和 `Doug Scott`。这三位英国人在
  `Herrligkoffer` 著名的权威性风格下勉强维持，但他们没有人能找到通往顶的路。


  `Chris Bonington` 在那年秋些时候领导了一次失败的尝试，并于 1975 年带着一支精心挑选的团队回来。住在瑞士的苏格兰人 `Dougal Haston`
  是一位动力十足、野心勃勃的登山者。`Martin Boysen` 是 `Bonnington` 的老老友，而 `Doug Scott` 已经尝试过一次。`Nick
  Estcourt`、`Tut Braithwaite` 和 `Mick Burke` 填补了支资金充足且组织卓越的团队名单。`Peter Boardman` 对这次努力描述得最好：“对于一个登山者来说，一次
  `Bonnington Everest Expedition` 无疑是生命能提供的最后伟大的帝国体验之一！”他们成功的关键发生在山壁的高处。之前的团队曾败在岩带下，因为他们选择了一个死胡同的右斜坡。这次他们向了左边走。


  ![](img/Anke_9781426212413_epub_042_r1.jpg)


  在这张由他的登山伙伴 `Nawang Gombu` 拍摄的照片中，**JIM WHITTAKER 在顶峰拿着美国旗和国家地理**。


  `Dougal Haston` 和 `Doug Scott` 在 9 月 24 日下午 6 点到达顶峰，距离他们离开 `Camp VI` 已过去近 16 小时。照片显示了美丽而阴森的日落。`Doug
  Scott` 兴奋地说道：“景色是如此令人震撼，消失的太阳如此充满色彩，那场日落令我们肃畏。”“消失”是一个恰当的形容词：返回营地已经太晚了，他们最终在海拔 28,700
  英尺（8,750 米）的南峰过了一夜，这是一个最高露营的新记录。


  两天后，`Martin Boysen`、`Mick Burke`、`Peter Boardman` 和 `Pertemba Sherpa` 向上。`Boardman`
  和 `Pertemba` 到了顶。当 `Boysen` 返回时，队友 `Burke` 独自继续前进。`Boardman` 和 `Pertemba` 最后看到他正在距离顶仅几百码的地方休息。他看起来看起来很有信心，但随后天气恶化了，`Mick
  Burke` 永远消失了。


  在东南脊上，一位身高仅 5 英尺、体重远低于 100 磅的矮小钢琴老师、日本攀登者 `Junko Tabei` 成为第一个登上那座山的女性。仅仅 11 天后，拥有三个孩子的西藏母亲
  `Phantog` 随一支中国探险队登顶。两周内有两位女性！之后又过了五年，才会有另一位女性出现在珠玛峰顶顶。


  ![](img/Anke_9781426212413_epub_043_r1.jpg)


  **登山者的风采**在强风中。






  在山上的生存是简单的。生活中很少有比这更简单的时刻了：生存，加上对顶峰的追求。目标实实地、以三维的方式存在于那里——你可以看到它，触碰它，站在它上面——到达它的路径清晰明确，所有的能量都汇聚于它的实现。正是这种简单剥离了文明的虚装，让那些有意义的事物变得更容易获得——深层陪伴的快乐、无拘无忌的幽默时刻、对苦难、忧伤、美丽和喜悦的品味。但也正是这种简单，可能让我们在接近山顶时，无法为自己提出的问题找到答案……


  这是一场美妙的梦，但现在留下的只有记忆。梦已经结束了。


  珠穆峰必须成为我生存现实的一部分，无论平凡与否。那个不可触及的目标已经实现了。或者实现了吗？许多问题依然存在。而答案呢？很奇怪的是，当一个梦想实现时，剩下的几乎只剩下怀疑。


