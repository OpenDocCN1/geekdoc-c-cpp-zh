  # 珠穆玛峰的影响


  对大多数人来说，攀登珠穆玛峰仍然是一个改变人生的经历。无论是向导客户还是开拓探险者，许多登山者都看到自己的人生故事受到了珠穆玛峰的巨大影响。埃德·希拉里（Ed
  Hillary）坚信没有人的生活像丹增·诺尔盖（Tenzing Norgay）登顶后那样发生如此剧的变化。事实上，名声、政治手段和姿态羞辱了他：“珠穆玛峰并不重要。只有政治重要。我感到羞耻。”他在珠穆玛峰的胜利对丹增来说变成了一个沉重的负担，丹增晚年生活如一个悲剧性的孤独形象。


  ![](img/Anke_9781426212413_epub_049_r1.jpg)


  老旧、沉重的铝架背包僵硬地固定在背部，使攀登变得更加费力。今天的登山者知道“北面之”（`The North Face`）轻便且不可摧的背包的舒适性，其内置框架设计允许更大的活动自由和更大的存储空间。


  ![](img/Anke_9781426212413_epub_050_r1.jpg)


  胜利的埃德蒙·希拉里（EDMUND HILLARY，右侧）、丹增·诺尔盖（Tenzing Norgay，居中）以及英国军官、1953 年珠穆玛峰成功探险领队约翰·亨特（John
  Hunt）抵达伦敦希思罗机场。


  登顶五年后，汤姆·霍恩贝因（Tom Hornbein）在山顶时的怀疑开始变得有些意义：“梦想是开始，怀疑仅仅是创造力的催化剂，”他说，“我的生活依然充满了冒险和随之而来的不确定性。与其分享这些经历的人是珍贵的。”许多这些珍贵的关系是因为珠穆玛峰而来到霍恩贝因身边的。


  莱因霍·梅纳（Reinhold Messner）珍视他的两次珠穆玛峰之行：与彼得·哈贝勒（Peter Habeler）一起首次无氧登顶，以及在`北壁`的孤独单攀。但他对珠穆玛峰后续发展的愤怒最终盖过了这些感受。他愤怒地嘲笑道，到
  2012 年，珠穆玛峰已变成“迪士尼”。转而转向更小的山峰。“当我还是孩子时候，从小山开始，”他说，“现在随着我年龄增长，小山变得越来越大。如果我幸运，有一天我会在一个小山上结束。”


  冬季的珠穆玛峰是克尔日斯托夫·维尔洛基（Krzysztof Wielicki）的首次喜马拉雅之旅。这不是他的最后一次。和梅纳一样，他攀登了所有 14 座 8000
  米高峰。但对维尔洛基来说，珠穆玛峰仍然是他最好的记忆，不是因为它最高，而是因为那种氛围、团队努力以及安德烈杰·扎瓦达（Andrzej Zawada）的强力领导。对于维尔洛基来说，珠穆玛峰与那个帮助塑造他最高海拔冬季攀登梦想的人建立了深厚且有意义的友谊。


  珠穆玛峰是艾莉森·哈格里夫（Alison Hargreaves）返回前的最后一座喜马拉雅山峰。仅仅三个月后，她在登顶后从`K2`山坡被风吹落。对她死亡的反应同样剧烈，许多人指责她——作为一个母亲——冒了如此大的风险。这个在珠穆玛峰顶第一句话是给儿女的女人，因为没有像爱自己的野心那样爱他们而遭受诋蔑。


  友谊、羞耻、愤怒、名声、喜。尽管登顶珠穆玛峰后的后果迥异，但对于这些登山者中的每一个人，这座山都赋予了一种独特的、崇高的到达世界之巅的感觉。


