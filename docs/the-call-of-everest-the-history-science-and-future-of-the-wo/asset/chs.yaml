  ### 至关重要的夏尔巴人


  此时，每个人都意识到夏尔巴人对于大多数人在珠穆玛峰的成功至关重要。他们在高海拔地区体力惊人，似乎能够忍受极度严寒、重负和长日的工作。第一位登顶的美国人吉姆·惠特克（Jim
  Whittaker）对他们的高海拔适应能力开玩笑说：“在他们深吸气之前，你注意不到他们。然后他们的肺部充满了空气，挡住了视线。”


  夏尔巴人与珠穆玛峰的历史密不可交织在一起，他们在山上的成就堪称传奇，尽管并不经常被庆祝。大家都知道丹增·诺尔盖（Tenzing Norgay），但数百其他人也可以名正其实地被称为“雪山之虎”。达瓦·丹青（Dawa
  Tenzing）在 1963 年 56 岁时仍在为美国人向南脊运送物资。1963 年与吉姆·惠特克一同登顶的纳旺·贡布（Nawang Gombu），后来取代丹增·诺尔盖担任达卓岭喜马拉雅登山学院的野外训练主任。波腾巴·夏尔巴（Pertemba
  Sherpa）曾在克里斯·波宁顿（Chris Bonington）1975 年具有里程碑意义的探险中与皮特·博德曼（Pete Boardman）一起攀登了西南壁。绰号为“超级夏尔巴”的阿帕·夏尔巴（Apa
  Sherpa）已登顶 21 次。巴布·奇里·夏尔巴（Babu Chiri Sherpa）曾通过多条路线攀登并登顶十次——其中两次在 14 天内——他曾仅仅因为想待在山顶过一晚，并曾用
  16 小时 56 分钟登顶一次。名单还将列下去。


  但并不是每支队伍都带着夏尔巴人攀登的。波兰人负担不起他们。由艾兰·劳斯（Alan Rouse）带领的八人英国小队也是如此，他们在 1980-81 年冬季尝试挑战珠穆玛峰，但这次走的是西脊，且没有使用辅助氧气。这是一项极具野心的工程，但他们被严酷的冬季折返了。尽管这次探险中没有人牺牲，但八个人中的三个人在未来的几年里在喜马拉雅山付出了最终代价：1982
  年在珠穆玛峰去世的乔·塔斯克（Joe Tasker），1983 年在布洛峰去世的皮特·西克斯顿（Pete Thexton），以及 1986 年在 K2 峰去世的阿尔·劳斯（Al
  Rouse）。


  波宁顿于 1982 年带着一支六人的全星队回归，意图攀登东北脊。皮特·博德曼和乔·塔斯克在英国不仅因攀登技巧闻名，还因其写作和电影才华闻名，他们就在其中。两人沿着东北脊到达海拔
  27,000 英尺（8,200 米）处被称为“尖峰”（Pinnacles）的区域。他们最后被发现是在 5 月 17 日晚上 9 点左右，身影出现在第二尖峰下方。英国人在喜马拉雅山的伤亡率正在不断上升。正如历史学家伊丽莎白·豪利（Elizabeth
  Hawley）所观察到的：“整整一代英国登山者被毁灭了……波宁顿还活着，但他大多数朋友都已离去。”直到 1995 年，一支来自日本大学的日本小组使用全面的攻坚策略（包括
  13 名登山者和 31 名夏尔巴人）才完成了整个东北脊。


  在波宁顿小组攀登东北脊的同时，一支 17 人的苏联小组在英国西南壁路线东侧的凸壁上开辟了一条大胆、新颖困难的线路。11 名登山者到达山顶，宣告了俄式大墙喜马拉雅登山风格的到来。


  最后，在 1983 年，珠穆玛峰最后一面被登顶——也许是最令人生畏且危险的一面——东壁（冲堆壁）。那里极其危险，美国队选择不使用夏尔巴人，认为让他们暴露在如此危险中是不合适的。在使用辅助氧气的情况下，六名登山者登顶：这是美国人在珠穆玛峰开发的第二条新路线。随着这次攀登，珠穆玛峰的三大面——北壁、西南壁和东壁全部登顶。


  两年后，另一个珠穆玛峰首登诞生，预示了登山的未来。雪鸟度假村老板迪克·巴斯（Dick Bass）于 1985 年 4 月 30 日登顶珠穆玛峰，他被认为是第一个向导登山客户。这是他第四次尝试登顶，他感谢大卫·布雷希尔斯（David
  Brehears）。在山顶，他喘着粗气对布雷希尔斯说：“你带我上来了——你也一定能带我下去。”布雷希尔斯确实做到了，因为他完全理解这种关系。“他是我的责任：我要带他下去。”


  随着向导登山的爆发式增长，许多人对在最高峰引导客户的业务表示批评。向导是一项拥有悠久光荣荣誉职业，尤其在阿尔卑斯山。但在 8000 米以上情况完全不同。有许多额外的因素：巨大的规模、致命的高海拔、剧烈的风暴以及高昂的成本。最重要的是，向导风险更大。每个季节只能登顶一次，不像阿尔卑斯山。让每个季节都变得意义。


  ### 裸身攀登


  1986 年夏天，珠穆玛峰最令人印象深刻的攀登由瑞士登山者埃哈德·洛雷丹（Erhard Loretan）和让·罗瓦莱（Jean Troillet）完成。在适应了五周后，他们与法国登山者贝金（Béghin）一起离开大营。他们于
  8 月 28 晚 11 点出发，冲向北侧的日本槽。他们彻夜攀登，第二天上午 11 点在海拔 7848 米处停下，在白天的温暖中休息补充水分。随着傍晚变冷，他们开始攀登霍恩槽（Hornbein
  Couloir）。攀登四小时后，贝金在此回头，但另外两人继续向上，下午 2 点登顶。90 分钟后他们开始下山，由于雪况极佳，他们选择坐姿滑下整个山面，仅用了四半小时，往返总计仅
  39 小时。他们没有带帐篷、绳索、安全带或瓶装氧气。波兰登山者沃特谢·库尔蒂卡（Voytek Kurtyka，也是洛雷丹的长期攀登伙伴）将其称为“裸身”攀登。多年后在
  2010 年，作者询问洛雷丹最难忘的攀登是什么时，他歪着头，露出一抹斜笑，回答道：“珠穆玛峰的攀登非常好……那是一条如此笔直的线。”




  1988 年对于珠穆玛来说是充满冲突的一年。那里出现了几次惊人的攀登，但风格却迥异。一项名为“中日尼友好远征”的宏大工程共有 254 名成员，耗资 700 万美元，派遣登山者同时攀登东南脊和东北脊，并在山顶进行了直播。


  相比之下，一个由四人组成的国际小队正试图通过东南肋开辟东壁（康日峰壁）的一条险峻的新路线。英国的 `Stephen Venables`、美国的 `Ed Webster`
  和 `Robert Anderson` 以及加拿大的 `Paul Teare` 几乎互不相识，但他们希望在不使用固定绳、不使用额外氧气且没有夏尔巴支持的情况下完成攀登。当
  `Charlie Houston` 第一次听到这个计划时，他大吼道：“四个人对抗康日峰壁？你们疯了！”从他们最终命名为“永恒珠穆玛背岩”（Neverest Buttress）的路线特征来看，休斯顿可能是正确的。这条路线布满了恐怖的悬冰雪檐、冰蘑菇、垂直的冰墙以及巨大的冰裂缝（冰川从底部分离处），极其危险、陡峭且持续性极强。


  他们穿过绝望的地形，一路爬到南营。随后，疲劳开始显现作用，`Venables` 独自走在了了前面。当他在 `5 月 11 日` 彻夜攀登时，他起初以为其他人很快就会追上他。最终他很清楚自己孤立无援了：要么开路直达山顶——全程——要么承认失败。他虽然登上了山顶，但在返回时未能到达南营帐篷的庇护。相反，他在那里露了营，并产生了剧烈的幻觉，看到
  `Eric Shipton` 正在为他的脚保暖，看到西藏牛牧民向他的火堆招招手。黎明时分，他蹒跚地走到帐篷，他的三个同伴中有两个正蜷缩在那里。


  但故事并未此结束。在经历了一个可怕的夜晚后，他们在南营挤在一起，`Venables` 几乎被冻僵，登山者们必须决定走哪条路线下山：是折下康日峰壁，还是走简单的南营路线。尽管难度极大，他们还是选择了山壁，因为他们熟悉路。在经历了一系列疯狂的自由落体滑动和奇迹般的恢复后，除一人外，所有人都丢了冰斧。他们这三天下山完全失控的故事并不是值得重复的榜样。尽管如此，他们生存了下来，并获得了赞誉。`Reinhold
  Messner` 称其“从纯冒险的角度和风格来说，珠峰最好的攀登”。`Chris Bonington` 的评价更具体：“喜马拉雅登山史上最卓越的生存案例之一。”这确实是生存，但并非没有代价。`Webster`
  失去了七个指尖和一个拇指，而 `Venables` 失去了三个半脚趾。


  那个秋天，在山南，一支由斯洛伐克最顶尖登山者组成的小队尝试首次阿尔卑斯风格登顶西南壁（此前最初于 `1975` 年由 `Chris Bonington` 的团队登顶）。他们没有使用固定绳、额外氧气或夏尔巴支持。斯洛伐克人在山壁上成功了，但四人在下山途中全部遇难。由于这次惨重的损失，许多人开始质疑究竟什么是“成功”。


  与此同时，一位华华的新西兰年轻登山者 `Lydia Bradey` 正与一支新西兰团队攀登，该团队与那个悲性的斯洛伐克小组共用西南壁的许可证。由 `Rob Hall`
  领导的新西兰团队未登顶并返回了加满都。除了 Lydia 之外的所有人都回来了。她在没有使用额外氧气的情况下，通过东南脊非法登顶——使她成为首位做到此事的女性。问题是，她没有手表来记录时间，她冻坏的相机也失效了。她没有证据。`Rob
  Hall` 反驳了她的主张，声称这根本不可能。但他有其他动机：她的非法登顶可能会危及他未来在尼泊尔担任导师的能力。登顶声明被列为“有争议”，从而剥夺了 Lydia
  这一本应具有里程碑意义成就的荣誉。直到年后，在一位在山上的西班牙登山者确认后，`Lydia Bradey` 才被记录为首位不使用额外氧气登顶珠穆玛峰的女性。Lydia
  是珠峰少数几个“第一”之一，这项成就对她的生活几乎没有改变。她攀登那座山时是一名登山向导，后来她一直是一名向导。


  ## 从上方拍摄


  在珠穆玛峰上拍摄一张美丽的照片并不难。在珠穆玛峰上很难。作为一名拍摄远征队的摄影师，真正的挑战在于创造出一个多元化的体验剪辑，其中点缀着感性的、风暴的、描述性的、引人注、吸引目光和故事性的图像。我在海平面上应对这些挑战都很困难。把这些挑战带到
  25,000 英尺以上，可能会让人不知所措。


  远征拍摄面临着一个有趣的困境：人们应该专注于攀登还是专注于创作？一个人对地形和攀登的适应程度往往决定了其拍摄和创作的能力。我对这个挑战有着爱恨交织的关系。我以此建立了事业。我恐惧它。我也从中发现了最大的满足感。它差点要我的命。


  ## 做好准备


  通常情况下，我知道在任何时刻总会有惊人的画面等待创造，但你不能一直拍摄。你需要捕捉时机，预判它们，并经营它们。


  当光线极佳且动作云涌时，你最好做好准备。当天的食物和相机设备需要提前准备；你需要在大家之前穿好衣服出门，这样你就能拍到每个人出门的瞬间。你需要收拾好包，这样在他们离开时你才不会掉队。从下方拍摄人们而上方是大片天空通常是没有趣的。从上方拍摄，展示他们下方巨大的落差以及横跨整个喜马拉雅山脉，这才是你想要的镜头。


  Jimmy Chin 一位无与伦比的远征电影导演和摄影师，Jimmy Chin 本身也是一名登山者、登山家和探险家。他是国家地理的的探险家，也是 The Face
  运动员团队成员。


  ## 近期历史


  几乎每一个十年都为珠穆玛峰提供了独特且具有进展：20 世纪 20 年代和 30 年致力于探索；50 年代实现了首次登顶成功；60 年代开启了新的脊线；80 年代见证了新路线和无氧攀登。但
  90 年代呢？根据美国登山者 `Ed Webster` 的说法，“20 世纪 90 年代，珠峰的奇迹似乎结束了。”


  部分原因是登山者人数的大幅增加。尼泊尔旅游部每年出售越来越多的东南脊许可证——这是一口真正的金矿。中国也对北脊效仿。这些许可证被授予追求七大峰的登山者。追求 14
  座八千米级峰的登山者。追求珠穆玛峰的登山者。包括 `Messner` 在内的许多人认为珠穆玛峰不再是一次真正的登山体验。英国作家 `Ed Douglas` 将其称为“恐怖的喜马拉雅”。现在成千上万的人涌入最热门的路线，其中绝大多数都有向导。每年有数百人登顶并感到自豪，因为珠穆玛峰一直是他们的梦想、野心和执念。然而，仍有许多人在尝试中死去，有些是因为坠落，有些是因为缺氧，而大多数是因为极度疲劳。





  1996 年是一个太多人丧生的年份。那场引起广泛关注、导致 11 人遇难的灾难，遗憾地定义了 20 世纪 90 年代的珠穆玛。许多人分析了导致那个悲剧之夜晚的事件顺序。人们指责声不断。但与大多数山地悲剧一样，多种因素共同导致了结果。无疑，在登顶当天，线上的人太多，导致了交通拥堵和严重的延误。通信问题引发了对谁该做什么、何时做什么的困惑。有些向导客户的经验没有达到应有的水平，因为在史诗般的下撤过程中，他们较少依赖固定绳索和手拉。两支商业探险队领队之间的竞争——新西兰向导兼“冒险顾问公司”老板罗布·哈尔（Rob
  Hall）和美国人“疯狂山脉”领队斯科特·菲舍尔（Scott Fischer）——可能也发挥了作用。菲舍尔是山上的新面孔，而资深珠穆玛向导哈尔每年都能成功让他的客户登顶，除了前一年。这种压力一定非常巨大。当哈尔和他的客户在
  8000 米以上停留得过久时，他违背了自己的生存规则。在前一年，他遵循了这些规则，尽管没有人登顶，但每个人都安全返回。而在 1996 年，他的团队中有四人（包括哈尔本人）在下撤遇难。


  菲舍尔在他小组登顶当天生病了，削弱了他照顾客户的能力，并让他与俄罗斯向导安纳托利··布克里夫（Anatoli Boukreev）共同制定的策略受到质疑。布克里夫负责从前面引导，菲舍尔从后面跟随。这种策略对于病中的菲舍尔来说无法成功。客户需要更多的支持。


  山上的其他登山者观察到，所有向导都穿着相对轻便的衣服，这表明他们可能对自己快速上下山的能力过度自信。


  珠穆玛向导攀登的费用可能影响了一些客户爬到了精疲力竭的地步。他们负担不起返回。


  最重要的因素无疑是风暴。根据一些人的说法，那是世纪风暴。另一些人则认为这只是珠穆玛上常见的另一场风暴。无论风暴多么猛烈，它与登顶日之前发生的所有个人因素——疾病、违反规则、误解、缺乏技巧、疲劳——结合在一起，了一场完美的风暴。那天晚上有九个人失去了生命。如果不是布克里夫一次又一次冲入夜色，去救援在暴雪中南脊蜷缩的登山者，会有更多人丧生。罗布·哈尔并没有那么幸运。在帮助一名登山者登顶后，他的氧气瓶冻结了，他死在了暴雪中。


  ```

