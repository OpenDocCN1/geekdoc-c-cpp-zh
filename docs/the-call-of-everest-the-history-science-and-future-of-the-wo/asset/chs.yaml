  `冰冷的经幡`在大营飘扬![](img/Anke_9781426212413_epub_075_r1.jpg)


  ## **不断变化的大营**


  2012 年春春天，我为了冰川工作项目在珠玛峰大营待了一个月。我在 4 月初到达，当时远征队正在建立营地。我沿着布满岩石的冰川缓慢向上，经常停下来注视沿着蜿蜒路径聚集的数百色彩斑纷的帐篷。大部分是小型个人帐篷，但有很多大型的、烹饪和通讯帐篷。远处发电机嗡嗡声，运输队的牛铃叮当作响，各种语言在远征营中回响。数千面经幡在风中飘动。各国家的国旗也随风起扬。这是一个位于昆布冰川脚下的国际村。数百登山者很快就会在这里居住，他们都有共同的目标但原因各异。然而，大营与我
  29 年前春春天访问的那个完全不同。





  在那次探险中，我于 1983 年 5 月 7 日首次登上了珠穆玛玛峰。我被 ABC 电视节目《美国运动人》（*American Sportsman*）选入团队，前往这座山从地球最高点传输首批现场画面。我们在黎明时分从高营出发。出于某种原因，我们选择从南山口直接向东南脊开辟一条捷径，但我们意想不到地遭遇了膝盖深的积雪，在艰难跋涉雪地的努力中被拖慢了速度。南山口上方没有固定绳——我们并不需要。我们只在希拉里台阶处发现了挂着的
  30 英尺被风侵蚀的绳。


  我的队友们——安格·里塔·谢尔帕、彼得·杰米森和杰里·罗奇——和我轮流承担着在松软深雪中开辟道路的疲力工作。尽管如此，我们仍设法保持聚在一起，并在下午 3:30
  在南峰获得了更坚实的雪地，在那里我们为最后的冲刺做好了准备。拉里·尼尔森（Larry Nielson）选择不携带氧气瓶登山，正落在最后。从南峰到著名的希拉里台阶的横移路程漫长且暴露。当我度过那段令人生畏的最后
  40 英尺陡坡攀登后，才知道我们将成功。


  我清楚地记得最后几步。山顶是纯净的，没有任何脚印、测绘三脚架、宣传横幅、经幡以及后来会弄乱山顶的纪念品。似乎没有人在我们之前来过。风很轻，但偶尔刮过的阵风提醒着我们它潜在的力量。我们分享了珠穆玛玛那严酷、无情的宏伟壮丽震撼人心魄，以及一种巨大的孤独。自从到达大营以来，我们花了
  40 多天才到达这一刻；经历了艰辛、团队合作、自力更生以及日益深厚的友谊。我们五个人在闪烁的白峰映衬下，仅仅是远处隐约可见的微小黑点。我向北望向广阔的西藏高原，想起了上世纪
  20 年代初的英国探险队。他们试图从西藏登山的壮丽先驱努力均以失败告终。他们失去了许多生命。站在那里，我知道我的生活改变了。我实现了儿时的愿望。长长的旅程结束了。世界在我的脚下。我充满了宁静的敬畏和惊奇，还有深深的满足。


  ## 孤独的英雄


  组装好传输设备后，当我们站在巨大的山峰旁，我将摄像机对准同伴们。然后，我捕捉到了拉里·尼尔森艰难的最后一步，他成为第一个在不使用辅助氧气的情况下顶顶美国人。他的努力是高尚的，但付出了代价。


  此时已是傍晚，低角度的光在下方的峰间穿梭，在山谷中投下长长的影子。我们支持小组最近的成员在近 8000 英尺外的先大营。孤立吗？是的。但也对刚刚取得的成就感到无比振奋。当我们精疲力竭却胜利地蹒跚回到南山口的帐篷时，我们并不介意笼罩的黑暗和大雪。


  那天晚上，我躺在睡袋里睡不着，回想着疲惫的面孔、欢喜的笑容和闪烁的山峰。就在几小时前，我成为了自埃蒙德·希拉里和丹增·诺尔盖于 1953 年登顶以来，第 130
  个登上珠穆玛玛峰顶的人。我为属于这个精英俱乐部感到自豪，但我认为这个俱乐部已经大了 100 人了。


  ## 纯真的终结


  从以后，我经常回到那座山，并又登了四次顶。我无法想象珠穆玛玛的经历会发生多大的变化，而且是在如此短的时间内。今天，每天可能有近 129 人登上珠穆玛玛峰顶；截至
  2012 年春天，记录的登顶次数已超过 6200 次。


  自从 1856 年向世界宣布其 29,002 英尺的最高高度（后修正为 29,035 英尺）以来，珠穆玛玛峰对人类的想象产生了持久的吸引力。我 11 岁时也感受到了，被书中一张彩色照片吸引了，那是丹增·诺尔盖穿着异样的服装、带着氧气面罩，像一个地球边缘的探险家的模样。在那张单一的成功影像中，我发现了一个代表我自身对独立、发现和自由渴望的范例。我感觉到氧气面罩和厚羽绒服后的那个男人冒了险，并竭力到达那个位置，他正站在他想去的地方。有一天，我也想站在那里。


  我的同伴非常出色。在我之前之后，无数的人都将自己的价值观、梦想和野心投射在这一座山上。英国探险家乔治·马洛里和安德鲁·艾尔文在 1924 年开辟珠穆玛玛北壁路线时去世了，当时距离顶峰仅一步之遥，留下了万世的谜团。当丹增和希拉里在
  1953 年首次登顶时，世界为之震撼。1963 年，威利·温索尔德和汤姆·霍恩贝因完成了对这座喜马拉雅巨峰的首次横移，这是登山史上最伟大的成就之一。雷因霍尔德·梅斯纳和彼得·哈贝勒在
  1978 年成为第一个在不使用辅助氧气的情况下登顶的人；梅斯纳在两年后独自、在无支持的情况下再次做到了这一点。一个波兰小组在 1980 年 2 月完成了首次冬季登顶。


  珠穆玛玛峰同样是那些拥有不寻常奇特人物的磁石。“疯狂的约克郡人”莫里斯·威尔逊（Maurice Wilson）是一个古怪的一战大战退伍士兵，没有任何登山经验，他在
  1934 年非法飞往印度，打算让他的飞机坠落在珠穆玛玛脚下的冰川上，然后登顶。但英国当局没收了他的飞机并拒绝了他的许可。他没有气馁，带着一个小支持小组徒步穿越西藏。他的身体和帐篷在
  1935 年发现于 21,400 英尺处。


  哲学教授伍德罗·赛（Woodrow Sayre），总统的孙，招募了一名地质学生、一名老师和一名律师，在 1962 年尝试从北侧登山，雄心勃勃。他们从尼泊尔非法进入西藏，没有任何支持，将所有装备和食物运到北坡。他们这次大胆且鲜为人知的尝试在
  25,500 英尺处折返了。精疲力竭的团队原路返回尼泊尔，结束了美国人的首次珠穆玛玛探险。


  1988 年 9 月 26 日，法国登山者让-马科·博维文（Jean-Marco Boivin）完成了首次滑翔伞从山顶下降。斯洛文尼亚登山者兼极限滑雪运动员达沃·卡尼卡尔（Davo
  Karnicar）于 2000 年 10 月 7 日登顶，然后在雨季后的雪雪季节滑雪下降。2005 年 5 月 30 日，白山多杰·谢尔帕和莫尼·穆帕蒂在山顶许下了第一个婚誓。


  无论动机如何，登上世界之一直是一项铁人的成就。人们必须克服大自然的障碍、狂风、稀薄空气的挑战，以及自身的身体极限和恐惧，才能赢得公众授予地球最高峰的的荣誉。




  亚历山大·凯拉斯是喜马拉雅山的早期探险家，他在 1921 年一次未完成的珠玛峰远征中使用了这种口袋相机；他在前往山区的途中因痢疾和心衰竭去世。`Canon 5D
  Mark II`相机具有视频在内的众多数字功能，是 2012 年国家地理探险队使用的几种相机之一。


  1996 年，我带领了珠玛峰 IMAX 电影探险队，并在山上指导了拍摄工作。我第一次目睹了拥挤现象的早期阶段，以及登山者普遍缺乏经验和采取人多势众策略的问题。在向导探险的黄金时代，那个季节有
  12 支登山队挑战了那座山。5 月初，一场猛烈且快速移动的风暴导致 8 名登山者遇，引起了世界的关注。媒体和新闻对珠玛峰发生的事情描述得越有戏剧性——丈夫对妻子的最后遗言、一位医生因冻伤失去了双双手、一次危险的高海拔直升机救援——这座山就变得越吸引人，它在公众和登山者心中的价值也随之上升。


  此后，在我做的每一次公开讲座中，总会有观众问：“那场悲剧改变人们登山的方式了吗？”答案是：`并不真的`。


  ### 珠玛峰的未来如何？每年，登山者、客户和向导的支持系统都会不断改进，团队领袖之间的合作与沟通也将加强。一些向导服务将提高成功率，提高运营效率，并增加对客户优缺点的熟悉程度。但许多并不会。


  传统媒体和社交媒体将继续在全球范围内传播珠玛峰的图像和个人经历。除了通常的客户和向导群体外，山坡上还将挤满募捐、清理和企业挑战探险队，但实现重大“首创”的前景愈发渺小。


  ### 会达到突破点吗？2012 年 5 月在`洛子峰壁`拍摄的一张照片显示，156 人从海拔 23,000 英特的`三营`出发，前往海拔 25,900 英特的`南柱`，他们并肩排成一排向上涌动。这座山及其热门路线能承受这些人数吗？登山者和客户会开始远离这种让他们陷入“康加舞队列”的体验吗？我认识一些登山者在黎明前的黑暗中登顶了，尽管他们在山顶看到的视野非常模糊。为什么？他们晚上晚上
  8 点就离开了高海拔营地以避开人群。


  我经常思考自己在日益增加的登顶追求者中所扮演的角色。我们一些珍视这坐山的人为了收入和教育利益传播了知识，无意中已成为它最主要的推销员。`John Noel`上尉是
  1922 年和 1924 年珠玛峰远征队的成员，他拍摄了两次旅程的电影，并八次横跨北美大陆为座无虚席的观众放映电影。70 多年后，38 个国家的 3000 万人看了《珠峰》，这是一部根据我团队在
  1996 年灾难性风暴前后拍摄的制作的 IMAX 电影。


  珠玛峰一直吸引着纯粹者、梦想家和奖杯猎人。大多数人是这三者的混合体，每位登山者都为这坐山带来了广泛的能力和素质。如果他们的野心没有经验相匹配，危险将会增加，许多人认为自己不需要采取必要的步骤来准备这座山及其无情的时刻。公众很少询问你是如何到达顶峰的，只关注成就。登山者也往往只关注奖项和荣誉，而忽视了到达那里所需的巨大支持系统，以及夏尔巴人的辛勤工作和专业知识。当登山者不参与决策制定时，他们就不再是自己命运的主人，也放弃了与这座山、其天气和危险的亲密联系。


  # 声音


  ### **在珠玛峰维持生命**


  尽管全球气候变化改变着高喜马拉雅山，珠玛峰登山的未来仍不明朗，但可以放心，珠玛峰将像过去一样，继续吸引全世界的观众。


  丰富珠玛峰的体验需要观察这座山的社会环境，并意识到，像过去一样，夏尔巴人将是未来任何努力的决定性因素。最值得注意的是，作为珠玛峰南麓曾经的农业居民，夏尔巴人不再仅仅是珠玛峰宏伟景观中的搬运工。在珠玛峰商业导游增加的十年里，我们看到夏尔巴登山者在探险队外国登山者的安全管理中承担了至关重要且紧迫的角色。


  通过在职培训以及`尼泊尔登山协会`和`昆布攀登中心`等机构，我们正在见证知识向热情且有能力的夏尔巴及其他尼泊尔族裔登山者的转化和专业引导技能的赋予。夏尔巴人从
  20 世纪初起就表现出在高喜马拉雅山登山极具适应性的生理构造。现在，他们将凭借卓越的登山、引导和组织能力主导这一领域。这种转变不会一夜发生，但最近在某些探险中已经注意到，夏尔巴向导负责登山路线的所有技术工程工作，这项任务曾被交给带领探险队的受过良好培训的西方登山者。


  还有可持续性以及将这座山推为环境敏感性和野外环境最佳实践的国际象征的紧迫目标。夏尔巴人也将推动这些变化，并获得发达国家访问者的巨大支持——但当地人口需要承担起冠军管理人的角色。管理`大营`的居住、组织废弃材料清理以及确保物理环境处于接受状况是关键目标。然而，更广泛地说，通往珠峰大营的夏尔巴核心地区村庄的情况也需要得到解决。森林砍伐、对缓慢再生燃料的过度依赖、为了增加旅游而对某些市进行的过度建设、饮用水管理以及一系列类似问题，面临着珠玛峰预期的任何未来。


  尽管未提及，但珠峰地区、当地人民和访客登山者必须面对的政治和社会挑战是复杂的。由于远在`加德满`的中央政府由于其特有的地不了解珠峰当地人面临的问题，新的权力和资源需要委托并由夏尔巴人自己或对这些威胁其社区、生计和其迷人社会结构的环境和社会挑战非常熟悉的尼泊尔人委员会来管理。尽管问题很大、解决方案模糊，但夏尔巴人代代相传，展示了顽强的适应能力和热情且具有企业家精神，并辅以深厚的同情心和力量。他们是世界上伟大的生存者之一。


  无法预知未来等待着什么只需说，珠玛峰有潜力再次不仅是登山事业不可或缺的一部分，而且是农村社区光明发展和地球上最伟大山峰之一管理的典范。准备好惊喜、受启发、挫折、甚至怀疑——只要不感到无聊就好！


  **—PETER ATHANS** 被称为“珠峰先生”，皮特·阿丹斯是北面的一名登山运动员，曾七次登顶珠峰。他与他的妻子`Liesl Clark`以及两个孩子每年部分时间住在`昆布`。






  2012 年春天，我与许多正准备首次登顶的登山者交谈。我遇到一位带着三个孩子的单妈妈，她解释说，对珠穆玛峰冒险的梦想支撑她过了最艰难的时刻。她的孩子们已经长大，而她正站在大营，兴奋得颤抖，内心充满恐惧。我还遇到了一位商人，他老实地承认自己讨厌攀登的一切，但决心要获得那份“成功登顶”的吹嘘资本。


  我想到了这些缺乏经验的登山者们所付出的巨大牺牲，那些开支以及远离家人的人的时间。然而，这项高风险挑战需要准备、团队合作和训练，这些都能提升攀登的回报和价值。我们变得对彼此的行为和意见更加敏锐，但同时也变得独立和自我自觉。然而，最终，每一位登山者，无论是否得到多大的支持，都必须面对同样的寒冷和狂风，在山山上进行同样危险的往返。。珠穆玛峰绝不是一次简易或舒适的经历。它需要毅力去完成一项充满固有风险的未知挑战：数千英尺的悬空、落石、冰崩、雪崩以及飞驰的风暴。


  ![](img/Anke_9781426212413_epub_078_r1.jpg)


  自从最早的攀登活动以来，电影制作一直是珠峰的传统。英国的 J. B. 诺尔上尉在 20 世纪 20 年代摄影并拍摄了两次探险，其中包括乔治·马洛里（George
  Mallory）和桑迪·欧文（Sandy Irvine）在 1924 年致命的尝试。他在北美放映了自己的电影，引发了人们对前往珠峰号召的早期兴趣。


  每年都有人在这座山上死去。2012 年春季的登顶尝试导致了十人死亡——有些人是因为缺乏经验或简单的失误，有些人是因为他们想要登顶的欲望盖过了身体内部提醒他们停止并返回的警报。我们从远处评判并指责受害者认为他们决策失当且准备不足。但没有人去那里送死。登山者被一种想要登顶的、全能的欲望所吞噬，执意忽略了那些说是时候返回的信号。在缺氧、睡眠不足和脱水的状态下，很难做出自律的决策。


  我们在那稀薄的空气中寻找什么？那是我们通过技艺、训练和毅力获得的体验吗？是逃避我们下方枯燥的生活仪式吗？是一次极端的冒险吗？是一场蜕变的个人旅程？还是仅仅是荣誉章上的一根羽毛？无论人们寻求什么，终极目标毕竟是安全回到家。但在在那座山上，在那几个光辉的几周里，登山者体验了生活的简单节奏：生存并保持生命，太阳的升起日落，寻找食物和避难所。我们对天气变化以及身体的需求和局限性变得更加了。我们的生命取决于此。一天的成功往往通过一个简单的重复动作实现：你能把脚迈在另一只前面吗？在几次剧烈地喘气之后，你还能再次这样做吗？你从这场步步为营的斗争中走来，收获了惊喜、沿途中建立的友谊，最重要的是对你自己以及对我们内在的韧性与毅力的新认知。


  # 珠峰的呼唤


  基于如今的担忧，人们确实可以对这座山投下负面形象。但我永远不会那样看待它。也许这座山会被过度占据和过度使用。也许它会过时，不再是一项奖赏，被其他更具声望、更罕见的冒险挑战所掩盖。最后，我认为这并不重要。珠穆玛峰无法被削减。它无法被占据。它不是我们控制的。我们没有能力改变山的形状，但只能改变山本身的概念。我们在那里的经历叙述紧密地交织在我们集体想象的织物中。在第
  2 万次登顶之后，它还会保持这样吗？


  我们称之为珠峰的、被冰雪覆盖的巨大岩石是一块高大的屏幕，我们在上面投影了自己的希望、梦想和抱负。但在屏幕背后是一个寒冷、遥远、漠不关心的山峰，它不在乎我们是否爬上它。它不会因为我们的存在或主观而弯曲或断裂。


  当我回起 1983 年在午后余光中的第一次登顶时，那段经历是如此纯真而私。然而，我可以理解，甚至预见到第 10,000 个登顶者的深层满足感，无论是什么动机驱动着他们到达那里。意图是一件私事。


  我们人类永远渴望超越的体验，这种体验转瞬之间将我们从日常生活的复杂和混乱中释放出来。我的希望是，那些前往这座大山的旅者们，能带给它它赢得且值得的经验、技能和尊重。


  # 声音


  ## 珠穆峰的黎明


  我希望有一件事永远不会改变，那就是晴朗日子，从珠穆玛峰顶望向太阳开始升起时的景色。变化是不可避免的，但世界之巅的日出是特别的。我记得那种冰冷的空气，那种让你屏息的空气——而我那时已经在艰难地呼吸了。有一阵持续的风风咬着我脸上裸露的一小块肉，清晨的蓝光似乎永无止境。在远处，我可以看到地平线上开始形成色彩的光芒，然后一个三角形阴影的尖端从西方视野中缓慢显现。太阳辐射的能量在越过地平线时温暖了我的微笑，我看着西方的广阔之地在晨光中舞动。慢慢地，世界上最高山峰的影子遮蔽了它路径下方的一切。三角形覆盖了下方的山脉，这种其存在是最高的指示，将永远是珠穆玛峰独一无二的。


  登山者接近 KRISTOFF ERICKSON 团队成员，他是摄影师。在 2012 年 5 月 25 日登顶珠峰后，他和队友希拉里·奥尼尔（Hilaree O''Neill）位于第三台，距离山顶
  500 英尺。


