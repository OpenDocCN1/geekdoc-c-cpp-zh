  ![](img/Anke_9781426212413_epub_025_r1.jpg)


  ![](img/Anke_9781426212413_epub_026_r1.jpg)


  一只濒危雪豹触发了红外相机。这种野猫在珠穆玛峰地区罕见，但得益于科学公园的管理，它们的数量正在增加。


  2012 年一个美丽晴朗的早晨，我穿过位于萨迦玛玛国家公园因贾`khola`（河）的高处森林。这里很少有徒步团或游客，这是我多年前居住在该地区时发现的小径。当时我正在为我的地理学博士学位进行实地考察。在十个月里，我每周一次从我们位于昆姆江村（海拔
  13025 英尺/3970 米）的季节性高山村庄丁波切（海拔 14500 英尺/4420 米）往返 30 英里。监测土壤侵蚀小区时，我有无与伦比的机会研究沿途的景观、地形、植物和动物。


  ## 今日景观


  路径沿着北向陡坡延伸，那里覆盖着由喜马拉雅杉、白桦以及许多树木和矮生杜鹃组成的茂密云林。尼泊杜鹃（Lali guras，高山杜鹃 *Rhododendron arboreum*
  的华丽红色花，尼泊国花）正盛开。地衣挂在枝头，捕捉着开始升起的晨雾的水分。路径两旁盛开着紫色和黄色的金梅花和蓝色星形龙胆。这些春天的先驱者预示着未来成百上千花朵的到来。





  我假装没有看到一只孤独的麝鹿，这种生活在尼泊尔和西藏湿润森林中、长着獠齿且于攀爬的生物正静静地站在我正下方的一棵孤松杜鹃树下。我小心地跨过它那堆细小的、子弹状的粪便，这清楚地宣告了我是它标记领地的入侵者。这些生物曾一度非常稀有，因为猎人者为了它们肚子里的用于制作香水的麝囊而猎杀。然而，得益于
  20 世纪 70 年代中期以来野生动物保护法的执行，麝鹿在公园的这一地区已变得相当常见。


  一群毛茸茸、像羊一样的喜马拉雅塔尔在河对岸较干燥、灌木丛生的南坡上觅食。十年前，当当地作物成为它们的首选食物时，它们对许多社区构成了严重威胁。现在，它们正变得越来越稀缺，因为偏爱吃塔尔的雪豹已经回到了这些山坡。那些据称来自雪人人（那种每个人的叔叔都声称见过的传奇类人生物）的头皮，据一些科学家认为可能是喜马拉雅塔尔红色的皮毛制成的。


  一只橙纹叶柳莺和一只红胸红雀在远处鸣唱，它们是未来几周内将返回该地区的许多鸣鸟中的首批。一只孤独的胡夫（又称“胡须羊鹫”）静静地在上方滑翔，翼展达十英尺。


  小径离开了凉爽的森林，进入了一片长着矮杜鹃的高海拔灌木丛地。最引人注目的是`sunpati (Rhododendron anthopogon)`，它拥有一种我遇到过的最令人愉悦的香气——前提是少量的话。如果挑夫们的路线经过长达几里的刺鼻灌木丛，那气味会变得令人窒息，他们经常会抱怨患“sunpati
  头痛”。


  ### 之上的山


  当我从习惯性的忧虑中抬头时，我看到了全世界上最壮丽的景观之一——珠穆玛峰那黑色、金字塔形、冰雪覆盖且饱经风霜的山顶。尼泊尔人称之为 Sagarmatha（“宇宙之母”），西藏人尊尊其为
  Chomolungma（“圣母”）。这座山成功抵御了西方 32 年来所有的攀登尝试，从 1921 年英国首次侦察开始，经过无数尝试，直到埃德蒙·希拉里和丹增·诺尔盖在
  1953 年成功登顶。五十九年后，在 2012 年春天，有 200 多登山者在一天内成功登顶。尽管如此，这座山依然笼罩在魔法和神秘之中，攀登它被成千上万登山者和非登山者视为一生的终极成就。这座世界最高峰对所有胆于接近它的人施了魔咒。


  ### 最高之


  为什么这么多人对珠穆玛峰如此痴迷？很大原因在于一个词：`highest`（最高）。海拔 29,035 英尺（8850 米），珠穆玛峰是起源于陆地的最高山。（夏威夷
  4,205 米的梅纳纳亚山如果从其海底基底起算，高度超过了 9,000 米。）正如夏尔巴人——著名的“雪山之虎”，以攀登能力和对西方登山客户的忠诚而闻名——所说的那样，“珠玛峰只有一个”。这座山继续吸引着冒险游客，因为没有其他山峰能与之并肩。正如登山者所知，许多其他山虽然比珠穆玛峰矮
  250 米，但在技术上要困难得多，却在媒体中相对被忽视。


  这让我不禁思考：如果巴基斯坦 K2 峰（8611 米）周围偏远地区，或者印尼边境上同样偏远的干城珠穆峰（8586 米）比珠穆玛峰还要高，那里的景观和村庄会是什么样子？


  ### 珠穆玛峰的地理


  长 1500 英里的喜马拉雅山脉将亚洲大陆与印度次大陆隔离开。在地图上，它勾勒出一道引人注目的弧线，连接了西部的南加帕尔巴特峰和印度河峡谷，以及东部的南恰巴尔沃和布拉马普特河峡谷。山脉以南是印度大部分地区，从西向东，喜马拉雅山脉形成了巴基斯坦、印度、尼泊尔和不丹的北方边界，以及中华人民共和国的南部边界。


  ![](img/Anke_9781426212413_epub_027_r1.jpg)


  珠穆玛峰和昆布冰川在世界之顶创造了气势磅礴的壮丽。登山者沿着世界上最高的冰川——昆布冰川到达珠穆玛峰大营，并挑战它的冰瀑，那里数百万吨的冰缓慢地在陡坡上滚落。


  这些山脉留下了地质上年轻且活跃的山脉痕迹。那天早上，从我的观测点望向珠穆玛峰和洛子峰群，我能认出它们裸露岩面上延伸出的奇异黄色水平岩带。大多数人惊讶地发现，珠穆玛峰著名的“黄带”实际上起源于曾经的特提斯海底的沉积物。亿万年来，不可想象的热和压力导致这些沉积物变形成大理石、页岩和片麻岩，并将它们推向了天空。


  喜马拉雅山仍在增长，该地区地震的频率就证明了这一点。2011 年 9 月，我们在昆布地区领导安第斯-亚洲冰湖考察时，经历了一次震级 6.9 级的地震，其威力足以让我们旅馆的墙壁像橡胶一样弯曲。几秒钟内，它引发了大规模、雷鸣般的雪崩，导致了尼泊尔（尤其是震中所在的锡金姆地区）惨重的生命损失。它还导致了整个地区的地貌不稳定性。在第二天前往低海拔地区的危险徒步过程中，我目睹了大量的岩崩和雪崩，我们不得不多次将计划路线改为更安全的替代方案。


  ### 冰的创造者


  该地区的山脉很大程度上是由冰川的塑造作用形成的。在数千年的冰川冲刷后，山谷呈现出 U 型。覆盖碎屑的冰川（19 世纪 50 年代小冰期结束开始的冰川停滞指示）主导了高海拔的山谷。侧碛——在冰川两侧形成的巨石、岩石和土壤沉积物——在下部姆贾等山谷是常见的景象。一系列平行线指示了冰川不同的增长和退缩时期。著名的腾波切寺庙坐落在一个古老的冰川终碛上，即指示冰川曾到达的最远范围的沉积物。昆绒和昆德村庄坐落在一个早已消失的冰川遗留的山谷中。海拔
  6812 米的阿达拉姆峰（“母亲的项链”）壮丽的山面是在 12000 年前末冰期期间，几条冰川从山顶向不同方向发散，最终刻出了类似于马特洪峰的“角峰”。


  这种动态环境更更近的证据可以从阿达拉姆峰附近的破坏性冲刷、河岸侵蚀和岩石沉积中看到。1977 年，一个冰湖爆发洪水，导致姆贾河堵塞了数周。洪流（即因过量融雪或降雨而周期性淹没的大沟）已在许多山坡上切割出深痕。





  大多数人将珠穆玛峰等同于昆布地区（Khumbu）或该山的南坡，那里居住着富有魅力的夏尔帕人，最近还有来自更南方的雷族（Rai）工人和旅馆经理。每年大部分登山、徒步、研究、清理远征、电视特辑、IMAX
  及其好莱坞电影以及特殊活动——例如 2011 年 5 月 Sano Babu Sunuwar 和 Lhakpa Tsering Sherpa 登顶并滑翔伞降至扬波切（Syangboche）机场的活动——都发生在这一侧。


  但珠穆玛峰还有两个居住（或季节性居住）的侧面。在 20 世纪 40 年代后期 50 年代初西藏关闭、尼泊尔开放之前，所有的英国登山活动都攀登了中国西藏自治区的北侧。在北侧（通常与著名的入鲁寺联系在一起），有一条汽车行驶的道路通往大营，这是一个帐篷村庄，每年接待几十支外籍登山队，最近还接待了数以万计中国游客。


  西藏东部偏远的卡玛河谷（Kama Valley）是通往技术挑战性极强的冲峰（Kangshung，即东壁）的门户，那里只有少数人成功登顶。由于进入极其困难，这个季节性居住的山谷比另外两个侧面都要偏远和原始。英国士兵、探险家兼植物学家查尔斯·霍华·伯里（Charles
  Howard-Bury）在 1921 年领导该地区侦察时称其为“世界上最美丽的山谷之一”。英国士兵兼探险家弗朗西斯·杨佑爵士（Sir Francis Younghusband）称其为“整个喜马拉雅山最美的山谷”，美国作家/环保主义者丹尔·泰勒（Daniel
  Taylor）也对此表示赞同，他建立了保护该谷的珠峰自然保护区。


  ![](img/Anke_9781426212413_epub_028_r1.jpg)


  来自 GeoEye 的 Ikonos 卫星拍摄的`视角图`显示了珠穆玛峰在光影交错中的尖锐地貌。在这个尺度下，人类攀登顶峰似乎是不可能的，但已有至少 15 条不同的路线开辟到了山顶。


  由盛行风引起的低压系统在季风季节将大量水分吸入阿鲁河并带入卡玛河谷，造成了比昆布或西藏入鲁地区潮湿得多的条件。云杉、冷杉、铁杉和杜鹃的原始森林延伸至 4,572
  米的海拔。许多树的高度达到 30 英尺，直径达到 10 英尺或更多。这些森林中发现了大量的云豹、喜马拉雅山羊、岩羚、喜马拉雅黑熊、亚洲吠鹿和其他大型哺乳动物。与昆布地区干旱、受侵蚀、受人类和牲畜影响的高山灌木/草地不同，卡玛河谷的山坡覆盖着茂盛翠绿的草地，自
  20 世纪 20 年代以来一直是牦的季节性繁殖场。灌木杜鹃和矮杜鹃被牧民人移除以增加牧场，但这种向草地的转变也促进了曾经稀有的蓝羊群数量的急剧增长，反过来又促使过去几十年中同样稀有的雪豹回归。


  进入该山谷的时间仅限于每年几个月，因为在其他时间，大雪封锁了大部分山口。每年只有 200 名外国人访问该地区——由于西藏不流行背负挑夫，他们的行李由牦驼背运。这项令人生畏的徒步需要两周时间才能完成，任何远征队在应急和撤离计划方面必须完全自给自足，否则将面临在牦驼背上极其漫长的撤离之路。由于位于珠峰雪柱的下风口，山谷的山口还可能一天内降下的超过三英尺积雪阻塞，使得步行逃生几乎不可能。整个珠峰地区天气模式的改变，特别是日益增加的灾难性雨雪，为访问这片神圣隐世的山谷的后勤工作增加了进一步的风险。


  ## 珠穆玛峰的气候


  从地理上看，昆布地区位于亚热带亚洲季风区，每年 80% 以上的降水量落在每年 6 月到 9 月之间，尽管季风的全部威力往往会被南布尔峰、贡德峰、塔姆塞尔库峰和康塔加喜马拉雅山脉等山脉所削弱。例如，南坎巴扎（Namche
  Bazar）的年平均降水量为 45 英寸，但随海拔增加而减少：高出 3,500 英尺的山山村庄丁波切（Dingboche）降不到一半。在珠峰北侧，喜马拉雅山对季风构成了更高的地形障碍，该地区全年干燥。由于部分原因，珠峰北侧的冰川的退缩速度比南侧快，因为没有足够的水分补充确保冰川持续生长的雪。东部的卡玛河谷比昆布或入鲁地区更绿、更湿，因为它享受了年度季风的全部威力。


  冬季通常很干燥，尽管偶尔会经历有时甚至是灾难性的大雪。1995 年 11 月，我在阿玛达布玛峰（Ama Dablam）的北坡扎营一个晚上，感到一股奇怪的暖风沿着山谷吹来。珠峰顶上不寻常的红色向我传递了一个信号——天气正在变化，而且变化很快。第二天早晨我们撤营时下着小雪，但我决定带挑夫下山到腾波切（Tengboche），以防起见，而不是前往下一个工作点。当我们到达腾波切时，雪已经积到了膝盖。不久后雪就变大了，并持续了一整整夜。


  第二天早晨，村子里流传着传言，说数百名游客、登山者和挑夫蜷缩在小屋或旅馆里。雪下了 10 英尺高。有 700 多人被困，不幸的是，26 人（其中 13 名日本人和
  13 名夏尔帕人）在雪崩摧毁他们退回黄高曲谷（Gokyo Valley）的牧民小屋时遇。幸运的是，在接下来的几天里，尼泊尔政府成功疏散了所有被困人员，我仍然认为这是登山史上最惊人的救援行动之一。


  ![](img/Anke_9781426212413_epub_029_r1.jpg)


  冲峰冰川旁野花的`一抹红`与卓木隆措（Chomo Lonzo）的白雪冰形成了对比。它的西北峰和中心峰由法国登山队于 2005 年首次登顶。主峰于 1954 年首次登顶。


  ### 变化的气候


  十年前，珠峰地区关于气候变化的话题几乎闻未闻。今天，这个话题在游客和夏尔帕人之间被广泛讨论。气候变化的剧烈指标可以从冰川退缩和新冰湖形成等现象中看到。在过去的三十里，仅昆布地区就形成了
  33 个新湖，22 个老湖泊扩大了规模。当地关于气候变化的大部分讨论集中在天气模式日益不可预测以及对农作物的影响上。传统的播种日期往往因为春雨迟到而推迟，而一旦雨水到来，幼苗就容易受到往往具有毁灭性的暴雨的侵害。人们声称，雪和雨量比记忆中的任何时候都要多。季风过去在
  8 月底结束，但现在一直持续到 9 月，甚至月底。成千上万的游客会在卢克拉（Lukla）机场（进入珠峰的门户）被困数周。


  ## 珠穆玛峰的植被






  与所有山脉一样，珠穆朗山的植被模式在很大程度上取决于海拔、坡度、朝向、降水量、地质和人类活动。在南坡，牧民们在数百甚至数千年前创造了温暖干燥的灌木草甸，它们现在覆盖了这些虽受人类活动剧烈影响但依然稳定的坡地。在潮湿凉爽的北坡，生长着冷杉、桦树和杜鹃森林。在海拔
  4000 米以上的地方，灌木杜松和矮生杜鹃也充当着地貌胶水，将薄、、幼且脆弱的高山土壤固定在原地。在海拔 5100 米以上，只有稀疏分布的垫状植物能够生存。


  在萨嘎玛塔国家公园（Sagarmatha National Park）的入口孟乔（Monjo），海拔 2800 米，喜马拉雅蓝松主导着景观，间点缀着喜马拉雅冷杉、刺果、杜鹃和瓦利红杉——这些树木受益于低海拔更丰沛的降水。冷杉-桦树-杜鹃森林出现在
  2500 至 3900 米之间，主要位于北向坡地。塔姆塞尔库（Thamserku）和孔德里（Kongde Ri）无人居住的北坡覆盖着这类特别茂密的森林。枫树、白桦杨和乔生杜松偶尔出现，还有各种矮生和树生杜鹃，它们在春季早早到晚期尤为绚丽，花序竞放并凋谢，直到季风降雨开始。巨大的古杜松树聚集在寺庙周围，它们在那里被保护了数百年，展示了在不受打扰的情况下，这些以及其他树木可以长到多大程度。


  ### 植物与海拔


  看着昆布（Khumbu）地区的另一座山峰塔姆塞尔库的北，你可以看到从森林到树际线的逐渐过渡，然后从树生杜鹃带、灌木杜鹃带和矮生杜鹃带过渡到高山草甸，这种草甸一直延伸到海拔
  5000 米以上开始的雪、冰和不连续植被带，一直到达 6000 米的永久雪线。


  高山带（海拔 4000 至 5000 米）的植物具有高度特化性，其大部分质量储存在地下的根部，并具有保护性的地上部特征，如密集的莲座状结构或厚绝缘毛，能够在极端环境中生存。1938
  年，著名的登山家埃里克·谢普顿（Eric Shipton）在珠穆朗山北坡海拔 6400 米的碎石坡（或松散岩石碎片）上发现了一株雪火草（雪宝菊，*Saussurea
  gnaphalodes*）——这是已知维管植物生长高度的世界纪录。


  ### 破坏景观


  整个昆布地区的高山生态系统受到了人类活动的严重影响，特别是在过去的 20 到 30 年，随着登山、徒步和冒险旅游的指数级增长。最常见的破坏包括客栈主、挑夫和登山队为了作燃料而移走生长缓慢的高山灌木和垫状植物。这种清理行为加速了土壤侵蚀并降低了坡体稳定性，正如我在
  20 世纪 80 年代能够量化的那样。高山带的其他干扰源于为了适应日益增加的游客而引入的牲畜，主要是牦和牦牛（牛杂交）。由于人类废物处理不当，水源性健康危害加剧。营地、大营和高营地区被固体垃圾堆积所破坏，沿着主要徒步路线村庄周围垃圾场和人类粪坑的数量日益增加。


  2004 年，山地学院（Mountain Institute）和美国阿尔卑斯俱乐部（American Alpine Club）与通往珠峰大营的上姆贾山谷当地人合作，成立了第一个昆布高山保护委员会。这个社区组织开始积极努力，通过推广进口煤油作为杜松和高山垫状植物木头的替代燃料，来保护和恢复其高山生态系统。杜松覆盖率在过去十年内重新站稳了脚跟，但在解决日益严重的人力和固体废物管理问题方面，仍有大量工作要做。


  每年访问昆布的数千人中大多数在秋季或春季访问，以避开 6 月至 8 月的季风雨以及低海拔地区随处可见的水蛭。然而，在 0 世纪 80 年代在那里度过夏天后，我一直觉得昆布季风期间的美景是世界上最完完的秘密之一。白天通常是晴朗或多云，直到下午早些时候，云才会进入山谷和村庄。降雨通常温和，在傍晚或晚上降临，促进了整个期间亚高山和高山野花的盛开，其多样性、色彩和密度是无与伦比的。一个特别值得回报的项目是我们的植物标本集，现在收藏于科罗拉多大学标本馆，并出现在由著名的德国植物学家乔治·梅黑博士（Dr.
  George Meihe）为英国博物馆编写的《昆布植物目录》*Khumbu Plant Catalog*中。


  ![](img/Anke_9781426212413_epub_030_r1.jpg)


  从大营的一个餐厅帐篷向望出去，是一片布满石头的田野和昆布冰川。在 2012 年登山季，约有 800 人将其称为“临时家园”。大营接通了互联网并有电话服务，让登山者在准备冲顶顶时能与更广阔的世界保持联系。


  ### 景观中的人迹


  珠穆朗山的北侧居住的人口稀少。唯一的常住居民是隆布寺庙的佛教僧侣，卡玛山谷（Kama Valley）除了季节性的藏族牦牛牧民外无人居住。居住在尼泊尔侧的 3500
  夏尔帕人被认为是 500 年前从西藏跨越南帕拉山口（Nangpa La）的原始夏尔帕先驱的后裔。他们的名字说明了故事：夏尔帕语意为“来自东方”。


  #### 夏尔帕人的抵达


  拉克帕·诺布（Lhakpa Norbu Sherpa）是萨嘎玛塔国家公园的第二任护林员，也是第一个获得博士学位的夏尔帕人，他认为这种迁移与政治不稳定以及与小冰期冷却相关的经济状况有关。人类学家迈克尔·奥普皮茨（Michael
  Oppitz）引用 18 世纪晚期的夏尔帕文献说，这些移民发现无人居住的昆布“完全地，从最高点到最深的山谷，完全长满了茂密的森林”，并到处是野生动物。“河流没有桥，悬崖没有阶；没有小路，没有住所，没有农田，没有织物……”


  藏传佛教将昆布视为*beyul*（圣地），一种神圣的隐藏山谷，其秘密将在世界末日时向信徒揭示。奥普皮茨和圣山专家埃德·伯恩姆（Ed Bernbaum）报告，在迁移发生时，旁波切和丁波切村庄已是著名的冥想场所。夏尔帕传说说，在祖先到达之前，牧民就在这里放过羊，地理学家斯坦·史蒂文斯（Stan
  Stevens）提到杜德科西河谷（Dudh Kosi valley）高处的某些遗迹被认为是早期的牧人小屋。


  ### 土壤的故事


  20 世纪 80 年代，我在库姆江（Khumjung）村上的灌木草甸上挖掘土坑时，注意到土壤剖面比干燥的无树山坡更典型于湿润森林环境。我还在不同深度发现了相当频繁的焚烧树木炭层，因此我决定每隔
  5 厘米采集木炭和土壤样本，以便日后分析其花粉含量、树种种类和沉积年代。多年来，我一直在收集这些样本，范围从公园的最西端一直到靠近珠峰大营的高海拔地区。





  结果显示，这些区域被清理的时间比最初想象的要早得多。根据科罗拉多大学极地与高山研究所的分析，人类在 3000 年至 5000 年前就开始开始砍伐和焚烧喜马拉雅山的南坡森林。如今在大多数北向坡上常见的冷杉-桦树-杜鹃森林在过去多年里被开辟，很可能是来自南方的雷族（Rai）或古隆族（Gurung）为了牲畜牧而改变了土地。花粉分析显示，从
  2000 年前开始蕨类变得越来越普遍，这表明当时正在形成干燥、开阔的林地环境。桦树、��木、冷杉、松和其他树木从约 1500 年前开始减少。过去 800 年来，草地一直主导着这里的景观。


  那么，早期的夏尔帕定居者在 16 世纪第一眼看到昆布布（Khumbu）地区时，他们看到了什么？景观可能与今天看到的相似——干燥的南向坡上是灌木草地，而在凉爽潮湿的北向坡上是云林。总而言之，这是一个不错定家的地方。


  ## 夏尔帕经济


  昆布专家玛格丽特·杰弗里斯（Margaret Jeffries）写道，夏尔帕经济在 19 世纪因马豆的引入而充满活力，马豆可能来自达季岭的英国殖民花园。此外，牦牛意外杂交产生了一种动物——牦牛（dzo），它们寿命更长、产奶更多、更能适应低海拔，并成为与西藏贸易的新商品。南姆巴扎（Namche
  Bazar）成为一个利润丰厚的贸易十字路，西藏商人带来盐交换尼泊尔和印度的制成品。到 20 世纪，人口开始增加，新的寺庙和僧院相继建成，年轻人开始季节性前往达季岭寻找工作。英国探险家兼登山家亚历山大·凯拉斯（Alexander
  Kellas）在 1920 年带领一群人前往锡姆进行登山探险时，被他们的力量、奉献精神和幽默感打动，成为第一个意识到夏尔帕作为高海拔挑夫的天赋的人。


  ![](img/Anke_9781426212413_epub_031_r1.jpg)


  ### 辉煌的日出


  光芒照亮了尼泊尔圣洁的高湖（Gokyo Lake）。亮蓝色的喜马拉雅湖泊为喜马拉雅的高峰提供了壮丽的背景，但温度的升高意味着冰川融水形成了这些湖泊。有些湖泊正危险地接近突破冰碛（即冰川碎片形成的墙）。


  1949 年中国进入西藏关闭了边境，结束了两国之间的贸易。随着尼泊尔在 1950 年开始对外开放，与西藏的贸易被旅游业取代。夏尔帕人的机智、好运、时机和地理位置使他们能够适应这些对其传统生活方式本可能是灾难性的变化。他们在登山探险中开始扮演的角色——从
  1952 年瑞士人首次尝试攀登珠穆玛峰开始，到 60 年代初扩大到徒足小组——对夏尔帕文化产生了革命性的影响。


  ## 声音：山的名字


  许多人知道珠穆玛峰（Mount Everest）英文名称的起源：当这座山通过三角测量法被确定为世界最高峰时，印度总测量员以他的前任乔治·埃弗莱斯特爵士（Sir
  George Everest）的名字命名。


  然而，很少有西方人知道其藏名的真正含义。


  几乎每一本关于珠穆玛峰的书都将其藏名误译为“宇宙之母”，这是基于一种假设，即住在山脚下的藏族和夏尔帕人必然将世界最高峰视为至高无上神灵的住所。但对这种翻译的持续使用反映了局外人而非当地西藏人和夏尔帕人对珠穆玛峰的重视。


  事实上，珠穆玛峰确实是一座圣峰，但地位相对次要。它的藏名——Chomolungma（珠穆玛峰）或更准确的说法 Jomolangma（卓姆隆玛）——源自一位被认为居住在那里的女神的名字：Miyolangsangma
  或 Jomo Miyolangsangma。这位女神全名的含义很模糊。一种可能的翻译是“不可摇动的良牛之母神灵”，这可能解释了为什么每年在腾波切寺（Tengboche）的玛尼林姆杜节期间上，僧侣们会放出一头牦牛在山中自由活动，作为对女神的供品。


  Jomo Miyolangsangma 是一个相对次要的女神。据我所知，藏教中并没有特定的“世界之母”或“宇宙之母”，这种女神的思想并不符合一个不一神至高造物主的宗教。如果珠穆玛峰是如此伟大神性的住所，像丹增·诺尔盖（Tenzing
  Norgay）这样的夏尔帕人就不会攀登这座山：作为虔诚的藏教徒，他们会认为山顶神圣不可侵犯。


  那么，为什么珠穆玛峰没有被视为至高神灵的住所呢？在英国人测量高度之前，命名它的西藏人和夏尔帕人并不知道它是最高山。即使他们知道，他们的宇宙观也提到了另一座让珠穆玛峰相形见��的山：须弥（Mount
  Meru or Sumeru），它是宇宙中心的一座神话山峰，直插云霄八万英之上。


  也许正因为考虑到这座山，腾波切仁波（Tengboche Rinpoche）曾问我：“在你亲眼见到它们之前，你怎么知道珠穆玛峰是世界最高山？”


  —埃德温·伯恩姆（EDWIN BERNBAUM），登山家、演讲者和作家。埃德温·伯恩姆指导山地学院的“圣山计划”，促进山脉的精神和文化意义。


  ## 保护的挑战


  1975 年，尼泊尔政府设立了萨加玛玛国家公园（Sagarmatha National Park），面积为 430 平方里。森林和环境保护方面的新西兰专家与尼泊尔国家公园野生动物保护局的工作人员合作制定了一份管理计划。这种战略性且互惠的伙伴关系利用了新西兰管理自身山公园的丰富经验，以及他们对整个昆布地区的长期熟悉，而这种熟悉首先在埃德蒙·希拉里爵士（Sir
  Edmund Hillary）身上体现。


  起初，夏尔帕人对公园及其工作人员并不热烈。有些人私下议道：“希拉里先给了我们糖，现在却往我们眼睛里揉盐。”“糖”指的是他建立的学校和诊所，而“盐”则是国家公园。许多人担心公园会侵犯他们的生活方式并限制他们对自然资源的使用。20
  世纪 80 年代，由护林员明玛·夏尔帕（Mingma Sherpa）、拉巴·N·夏尔帕（Lhakpa N. Sherpa）和尼玛·旺（Nima Wangchu）在南姆巴扎上方建造的造林围圈被批评为夺走了贵的草场。由于采食习惯会严重破坏植物，羊被禁止并移出公园区域，这引起了羊主的愤怒。负责在国家公园范围内巡逻防止偷猎的军事突然出现制造了新的紧张局势。禁止在高海拔地区采集灌木杜柏的规定继续被几十家徒步旅馆无视。一接一根根生长缓慢的灌木供应了日益增加的柴堆，而山坡变得日益荒芜和受侵蚀。




  在 20 世纪 80 年代初，我亲身体验了与当地人交流的危险。我没有考虑到请求许可，就开始安装我的土壤侵蚀研究样地，并对库姆琼（Khumjung）和昆德（Kunde）村庄上方的山坡剖面进行测量。很快，我的绳索栅、雨量计、沉积物收集槽和其他仪器在晚上被毁了。当地人看到我在工作，并断得出结论，认为我是一个测绘员，企图夺走他们的土地。一次村会议解决了这个问题，我的样地此后再也没有触碰过。（尽管如此，我偶尔会发现年轻的雅牛牧民在我的雨量计里撒尿，我将其视为一种常见的顽顽作剧。）


  根据我来自昆德村的同事安格·里塔·谢尔帕（Ang Rita Sherpa）所说，今天许多过去的态度已经改变，这很大程度上是因为公园的运营变得更具包容性。（他的父亲明马·哲青宁·谢尔帕（Mingma
  Tsering Sherpa）是埃德蒙·希拉里的主要施工主管，很大程度上负责在该地区建造学校、跑道和医院。）当地居民现在对南姆切巴扎（Namche Bazar）上方坡地上重新建立的蓝松和杉树森林感到自豪。姆贾谷上高山带的大多数山屋主是昆布布高山保护委员会（Khumbu
  Alpine Conservation Committee）的活跃成员，该委员会帮助禁止了采集灌木杜和其他植物作为木柴。社区现在报告说对公园有了更强的自豪感和主人翁感。


  ## **声音**


  ### 滑雪珠峰


  每个人都知道，珠峰的登山季节是在春天。


  通常情况下如此。我已经有点不同，因为我总是想在我爬上的任何一座山上滑雪*下去*，所以在我在开始规划时并没有去遵循常理。


  我的理论是，夏季季风季节会带来大量降水，我希望这能转化为季风后季节山上更多的雪，这样我就可以滑雪了。我也知道，在过去的六年里，尼泊尔侧只有两次在季风后季节尝试过登顶。一个几乎没有其他人的珠峰形象对我来说是一个巨大的吸引。


  事实证明，我们是**山上唯一的人类**。


  考虑到安全和自然规律，我和我的丈夫罗伯（Rob）以及我们的亲密朋友吉米·钦（Jimmy Chin）组成的小型滑雪队在离开大营之前商定了优先事项：1. 爬上去。2.
  滑下去。3. 记录下来。


  2006 年 10 月 18 日，我们三个人确实从顶顶滑下，尽管包括罗伯在内的几名成员在希拉里台阶（Hillary Step）耗尽了氧气，因此为了不出现在晚间新闻中，我们将滑雪板背在背包上，从希拉里台阶到四号营的大部分路程都是下走的。在南脊（South
  Col）度过一个计划之外的夜晚后，吉米、罗伯和我在帐篷外穿上滑雪板，开始从四号营到西冰斗（Western Cwm）的直线路线下降。


  通常，我们这些还着的滑雪登山者会养成“爬什么滑什么”的习惯，但洛子峰壁（Lhotse Face）的这段坡面是个例外。在登山过程中攀爬它将带来不必要的风险，可能会危及我们第一个目标的成功——仅仅是爬上去。


  ### **下行的进展**


  当我们 10 月 19 日上午 9 点离开四号营时，洛子峰壁（Lhotse Face）的这段坡面变得陡峭。在登山过程中攀爬它将带来不必要的风险，可能会危及我们第一个目标的成功——仅仅是爬上去。（注：此处正文“在南脊度过一个计划之外的夜晚后，吉米、罗伯和我在帐篷外穿上滑雪板，开始从四号营到西冰斗的直线路线下降。”之后，注：由于原文文本似乎存在部分逻辑重复或罗乱，翻译已根据逻辑处理）……通常，我们这些还着的滑雪登山者会养成“爬什么滑什么”的习惯，但洛子峰壁的这段坡面是个例外。

