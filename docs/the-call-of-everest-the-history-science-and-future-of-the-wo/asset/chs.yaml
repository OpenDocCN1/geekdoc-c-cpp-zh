  ****强劲的珠穆玛之风**，让向导安纳托利··布克里夫在 1996 年攀登期间接近希拉里台时，手中握着的绳索飞了出去。他一年后在尼泊尔中北部的安纳普尔纳峰的一场雪崩中去世。


  # 马洛里旁的声音


  1999 年 5 月 1 日，我坐在马洛里身边，向东方向望去，如果他和欧文在 1924 年 6 月 8 日登顶，他们本会采取的下撤路线。我想象着马洛里即使在极端情况下也有意识：没有无线电与他人交流，没有固定绳索链引导他下山，没有休息好并准备好进行救援的登山者团队，没有办法告诉世界究竟发生了什么。


  我只能猜马洛里和欧文的最后时刻是什么样子的，但我知道的是他们的成就如何影响了我们的登山传奇。他们最后一次攀登的胆识为未来铺了垫脚石。关于氧气的争议及其最终被接受，使得他们的后继者——包括希拉里和丹增额玛——能够以合理的安全余量访问高海拔地区。


  有时在深夜，我想通过发现马洛里，我是否助成了一个谜团的终结。这种可能性困扰着我。我的发现是否在某种程度上夺夺了 1924 年探险队的一些神圣的光辉？


  其他人可能会这么想，但对我来说，这一发现只是增加了对这些先驱登山者的钦仰。他们的故事——永远无法被完整讲述——一直包裹在珠穆玛峰（“雪山之母”）的秘密之中。我感到很荣幸能为这个谜团投射新的光。最终，马洛里和欧文最大的成就是激励性的，因为即使在失败，他们壮丽的尝试也向我们展示了人类精神的极限。


  **—康拉德·安克** 康拉德·安克被誉为顶尖登山家。在国家地理学会和北面公司的资助下，他带领了 2012 年的“遗产攀登”珠穆玛，以纪念 50 年前第一支美国小组登顶。


  # 永恒的先驱


  尽管这十年被不幸的悲剧占据，但还有许多人接受了珠穆玛的挑战并成功了，有时是以非常独特的方式。在本世纪初，澳大利亚人蒂姆·麦卡特尼-斯内普（Tim Macartney-Snape）从孟加湾开始了他的旅程，并步行（有时是游泳）走完全程到达山脚，然后登顶。1990
  年，吉姆·惠特克（Jim Whittaker）领导了“和平攀登”，这是一项中、美、苏的联合行动，让 20 名登山者登上了顶峰。同年，第一对夫妇登顶了山，斯洛文尼亚资深登山者玛丽亚和安德烈·斯特雷费尔日（Maria
  and Andrej Stremfelj）险些胜了竞争对手——美国人凯西·吉布森（Cathy Gibson）和她的俄罗斯丈夫列克谢·克拉斯诺库茨基（Aleksei
  Krasnokutsky）。


  1991 年，英国电影制作人李·迪金森（Leo Dickinson）乘坐热气球飞越珠穆玛，拍摄了一些史上最美的照片。次年 4 月 22 日，帕桑·拉姆（Pasang
