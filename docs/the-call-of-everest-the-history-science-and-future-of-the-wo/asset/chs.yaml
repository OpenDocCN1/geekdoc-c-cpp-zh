  ## 攀登珠穆朗玛峰


  ![](img/Anke_9781426212413_epub_003_r1.jpg)

  **成功了！丹增·诺尔盖**于 1953 年 5 月 29 日在珠穆朗玛峰顶的稀薄空气中举出他的冰镐，此时他与埃蒙德·希拉里成为首批站在山顶的人。


  ## 历程


  我们在珠穆朗玛峰上新路线的攀登是人类与山脉关系进化中的一个预测性阶段。这次探险的核心主题是延续不确定性：首先我们确定一个符合梦想的目标，然后研究如何到达大营，最后寻找通往顶点的方法。


  ## 珠穆朗玛的遗产


  这本书《珠穆朗玛的呼唤》还庆祝了希拉里爵和丹增·诺尔盖首次登顶珠穆朗玛峰 50 周年。AME 的成功远超我们的想象。5 月 1 日，吉姆斯·惠特克与夏尔巴那旺·贡布成为首批登顶的美国人。三周后又有四位登顶。鲁特·杰斯塔和巴里·毕松于
  5 月 22 日中午通过南脊路线登顶。晚了一点，在下午 6:15，威利和我完成了首次登顶西脊（通过威利习惯称之为“霍恩拜因崩石陷阱”，现在被称为霍恩拜因冲槽）。我们沿着南脊下山，与鲁特和巴里会合，我们四个人在
  28,000 英尺以上的意外露营地度过了夜晚。我们非常幸运能活过那个夜晚，也很幸运威利和我能够完成对一座主要喜马拉雅山峰的首次穿越。






  我必须承认，在 2012 赛季的事件发生之前，尽管 1996 年及随后的若干发生了悲剧，我能够为不断增长的人数找到合理的解释，并务实地接受向导登山在珠穆玛峰和世界上其他任何吸引人的山上一样是不可避免的。我认为，经验较少但身体结实的人可以在合理的安全范围内由向导带领登上珠穆玛峰。尽管新手人数增加，但死亡率并没有上升，这令我印象深刻。我将这种相对成功归功于深思熟虑的向导机构合作所采取的策略，例如，在任何可能导致坠落的地形上固定绳索。


  我同样想象，现代向导客户的动力可能与我当年并没有太大区别。很久以前，我就观察到，这种成功的驱动强度似乎与驱动我们的理由没有关系，无论是为了追求名利，还是为了享受地球荒野之地之一那令人敬畏的美丽，或者仅仅是为了投身某种内在的精神追求，寻找对“我行吗？”这个问题的答案。


  1963 年与现在最鲜明的对比之一，被马克·詹金斯（Mark Jenkins）对 2012 年事件的描述所捕捉（`第 7 章`）以及照片中：一条纤细的深色线条：数百名登山者挂在固定绳上，像蛇一样蜿蜒向上爬过洛子峰；另一张照片显示登山者像沙丁鱼一样挤在一起，等待轮到登上希拉里台。或许如今攀登珠穆玛峰最大的风险是拥挤以及在队列中等待的风险，有时要等好几个小时。令我更加恐惧的是，想象当这些在山上高处的人群与大自然怪异的力量相遇的那一刻——突如其来的风暴、巨型雪崩——这些都是大山登山轮盘的一部分。与其他自然灾害一样，问题也许不是“是否”会发生，而是“何时”发生。


  作为一个在中西部部长大的平原人，我在 13 岁时结识了山脉并爱上了它们。这种爱定义了我的生活，不仅作为一名业余登山者，还体现在许多其他方面——作为一名医生、研究人员和教育者的职业中，以及我的家人和许多其他人，他们为我的生活增添了色彩，并帮助我以（我希望的）优雅地老去。当我还是青少年时，珠穆玛峰是我幻想世界的一部分，并不是一个我认为自己能看到的地方，更不用说登顶了。从这个
  50 周年年的回望，我感到庆幸出生在正确的时代，并在座山还只属于我们的时代，有机会分享这样一次冒险。


  那样的珠穆玛峰已经过去了。现在的珠穆玛峰，凭借其众多的人、大营的社交氛围以及高处的环境，与山对我而言的意义是对立的。我与这个垂直世界的相处大多是宁静的，与志同道合的伴侣在荒野之地漫游。尽管如此，我认为我理解这座最高峰对那些愿意勇于挑战它的人的吸引力；我们拥有追求梦想的相似火花。这本书的名字起得恰当——珠穆玛峰在“召唤”。所以，翻页吧，让康拉德·安克（Conrad
  Anker）带你开始。


  # ![](img/Anke_9781426212413_epub_004_r1.jpg)


  ![](img/Anke_9781426212413_epub_005_r1.jpg)


  ![](img/Anke_9781426212413_epub_006_r1.jpg)


  登山者康拉德·安克使用`FIXED`绳索确保安全，在昆布冰川中下降一个冰阶。冰川瀑被认为是往返珠穆玛峰顶路中最危险的部分之一，位于珠穆玛峰尼泊尔坡昆布冰川三分之一处。


  2012 年 5 月 26 日，我从珠穆玛峰的山顶俯瞰塑造了这座大山的三条冰川。在过去的九半小时里，我一直在近乎完美的天气下攀登东南脊。在海拔 8850 米的高度，地球星球上没有更高的地方了。世界从字面上在下方崩塌。向东看，强劲的东宗冰川将冰碛推入西藏，并在过程中创造了小冰川湖。向北看，定布冰川看起来坚实，但我知道它正在移动，极其缓慢。向南向西看，昆布冰川倾落在喜马拉雅山的南坡，为尼泊尔和印度的人民提供营养。我脚下的冰雪最终可能会汇入恒河，慢慢流向孟加湾和印度洋。也许这些水将再次循环并沉积在喜马拉雅山，开始那永恒的再生循环。


  站在星球的顶点令人感到谦卑。我氧气匮乏，储备耗尽，无法进食，并被焦虑所困。这是一个危险的地方。然而，站在世界之巅的象征给了我一个从宇宙尺度上体验时间的机会。在我在山顶度过的半小时里，我思考着这座山——它是如何形成的，它对人类的意义，以及我与珠穆玛峰的个人联系。这是我第三次有机会站在地球上这个独特的地点。


  人类在自己的生命跨度内，以及在较小程度上在人类历史中来界定时间。我们将时间拟人化，仿佛发生在人类身上的事情是唯一相关的衡量标准。我们被告诫要活在当下。然而，在最高山脉的高处，我们生活在借来的时间里。拖延太久就会死。当我们面对困境时，时间是即刻的。这种即时性提供了一个让我们观察星球的棱镜。我们如何融入生命的宏大蓝图？珠穆玛峰以其永恒的巨大，凸显了人类存在的渺小。站在山顶，穿过对流层望向蓝色的无限空间，坐在一个拥有数百万历史的岩石上，这块岩石被移动的地壳推向天空，并受重力侵蚀，我思考自己在宇宙中的位置。我感到微不足道。山脉在我们踏上它们之前就已经征服了我们，并且在我们短暂的生命之后它们将依然存在。山脉这种不可摧的力量为我们人类提供了一块空白画布，用来绘制发现的动力，并在过程中测试人类的极限。


  ## 不可抗拒的召唤


  一个美国梦






  当美国在 1963 年发起远征时，已经有九人登顶过那里。1963 年 5 月 1 日，当第一个美国人吉姆·惠特克尔（Jim Whittaker）登上珠穆朗玛峰顶时，我才
  156 天大。我还没有意识到自己的存在，在婴儿床里爬行就是我攀登经验的全部。但大山早已是我家族传承的一部分。


  我们家族非常看重祖先居住的加利福尼亚州大橡平地（Big Oak Flat）山山的宁静、美丽和体力挑战，我们每年夏天都会背负装备，在高内华达山脉（High Sierra）露营。我们一起攀登，我记得当我俯瞰风景时问父亲：“我们下一次去哪里？”我在想，在那些温和的、花岗岩环绕的草地上，夏季假期还能延伸到哪里。父亲提到了喜马拉雅山，那是地球上最壮丽的山脉，并指给我他书房里的一。在可能性的种子播种下，我开始翻阅汤姆·霍恩贝因（Tom
  Hornbein）的插图书《西脊》（`The West Ridge`），梦见那些巨大的冰川峰和生活在它们下方的遥远的人。我的眼界被开启了北美之外的世界。我梦想着站在边缘，而成为一名登山者就是到达那里的路。


  ![](img/Anke_9781426212413_epub_007_r1.jpg)


  由国家地理学会赞助的“1963 年美国”队正在登上珠穆朗玛峰前往大营。这次远征由瑞士登山者诺曼·迪赫伦富尔特（Norman Dyhrenfurth）领队，包括
  19 名美国人、32 名夏尔巴人和 909 名背负 27 吨（25 公吨）装备的挑夫。团队的目的不仅是登顶，还要在生理学、心理学、冰川学和气象学领域进行科学研究。


  ## 彼岸之后是什么？


  在丹增和埃德（Ed）1953 年登顶后短短 16 年，人类就登上了月球。1969 年 7 月，我们全家围坐在一台闪烁的黑白电视前见证了这一刻。尼尔·阿姆斯特朗（Neil
  Armstrong）和巴兹·奥尔德（Buzz Aldrin）在月球上行走。是的，探索精神依然充满活力。在不到一个世代的时间里，人类从地球的顶端来到了地球投射影子的唯一天体，证明了我们存在于更大的范围内。第二天早上，正如母亲回忆的，我活力十足地骑着自行车假装自己是一个宇航员。月球探索取代了地球探索。


  尽管如此，珠穆朗玛峰继续提供对人类极限的考验。1978 年，当莱因霍德·梅斯纳（Reinhold Messner）和彼得·哈贝勒（Peter Habeler）在不使用辅助氧气、没有生命最基本元素的情况下登顶时，人类再次被他们的成就所激励。1980
  年，当梅斯纳独自回来攀登且同样没有额外氧气时，他将标准又推高了一个。十年后，珠穆朗玛峰从登山攀登的尖端转变为一个只要有适当的训练和资源，普通人就能实现的目标。早期的远征是帝国权力的延伸，始于
  1921、1922 和 1924 年的三次先驱远征。随着大型国家级远征在 20 世纪 90 年代让位于商业向导攀登，珠穆朗玛峰变成了一座属于个人而非国家的山。


  ## 马洛里的谜团


  1999 年，我受邀参加马洛里与艾尔文珠穆朗玛峰北坡的研究远征。七十五年前，在最初三次英国珠峰远征的最后一次任务中，乔治·马洛里（George Mallory）和他年轻的伙伴桑迪·艾尔文（Sandy
  Irvine）在距离顶峰触手可及的地方消失在云雾中。他们没有回来。他们可能在 1924 年 6 月 8 日——即在希拉里和诺盖登顶前 29 年——成功登顶了吗？这个问题成了登山史上争论最大的问题之一。我们永远无法知道他们是否登过顶。这个谜团依然存在，象征着马洛里在被问及人类选择攀登珠穆朗玛峰时给出的简洁回答。他的那四个字——“因为在那里”——探究了人类存在意义的根本问题。


  我的团队出发是为了寻找可能记录了登顶的丢失相机以破解谜团。然而，在 1999 年 5 月 1 日，我在珠穆朗玛峰北侧海拔 26,700 英尺（8,140 米）发现了乔治·李·马洛里冻结并保存的遗体。与他的遗体独处的半小时里，我感到自己与很久以前就为我今天的出现铺平道路的远征产生了联系。登顶的驱动力和为了一个目标所付出的计划——一个在巨大风险面前仅提供内在回报的目标——是吸引我走向大山的相同动力。尽管相隔了
  75 年，马洛里和我是我人生抱负中的伙伴。


  ### 会见马洛里


  马洛里冻结在坡上，双臂伸展，双腿交叠，在从事自己热爱的事时去世。他的家人为他的野心和执着付出了代价。死亡的接近，在高海拔地区与死亡进行的缓慢共舞，对登山者来说是痛苦而熟悉的。那一刻我感到谦卑，并对这位当一代登山者站在其肩膀上的男人感到深切的敬意。但我们仍然不知道马洛里是否登过珠穆朗玛峰，因为我们没有找到相机。


  ![](img/Anke_9781426212413_epub_008_r1.jpg)


  在诺曼·迪赫伦富尔特领导的 1963 年美国远征中，不稳定的木头被用作危险的通过；而在 2012 年，国家地理的登山队使用了轻便梯子，实现了更安全的通过。延续任务，1999
  年 5 月 17 日，我出发攀登“二台”。二台是海拔 28,230 英尺处令人畏的 90 英尺悬崖，是登顶最大的障碍。据我们所知，没有人没使用梯子爬过那里。如果马洛里和艾尔文在
  1924 年能够登顶，他们必须克服这一挑战。如果我们能在马洛里和艾尔文遭遇的条件下爬过它，就能揭开谜团。我带领了路段并尝试了一次，但在最后时刻违本意地迈出了那一步。


  ### 高峰与低谷


  我在傍晚与我的伙伴戴夫·哈恩（Dave Hahn）一起登顶。一片雪构成了世界之巅，只有一千人去过那里。我们的庆祝很短暂。天气在恶化，戴夫生病了，路上没有其他登山者。我们开始下降，感到孤独，且险些被我一直想要挑战的边缘所割伤。


  同年 10 月，我在喜马拉雅山的另一座高峰——希沙峰（Shisha Pangma）中从了雪崩。但带走了我的两个登山伙伴亚历克斯·洛（Alex Lowe）和大卫·布里奇（David
  Bridges）。亚历克斯是我最亲的朋友，我再次看到了生命的边缘。这一次我感受到了死亡给家人朋友带来的痛苦，我的人生也发生了巨大的变化。2001 年春天，我与亚历克斯的遗孀珍妮结婚，并收养了他的三个孩子：Max、SamIsaac。我继续攀登，但变得更加谨慎，他人的福祉在我的目标感中占据了更大的位置。通过珍妮和她创立的亚历克斯·洛慈善基金会，我能够报答我感到负债的山地文化。2003
  年，我们成立了昆布攀登中心，向夏尔巴人和喜马拉雅当地人教授技术攀登技能和山地安全知识。一年复一年前往尼泊尔，分享我的技能和对攀登的热爱，喜马拉雅的人们开始像我的家人。





  随着尝试登顶珠朗玛峰的人不断增加，救援行动也随之增加。在营营送送受伤的登山者后，直升机会折返，前往山上更高处接更多的登山者。1996 年是迄今这这山上最致命的一年：在为期两天的时间里，风暴袭击导致了白能见度的天气和温度骤降，造成
  8 人丧生。


  2007 年，我回到珠朗玛峰北侧，拍摄了一部关于马洛里及其生活的传记纪录片。我第二次尝试了“第二台阶”（Second Step）。我们拆掉了梯子，让悬崖恢复到马洛里和欧尔文在
  1924 年所遭遇的状态。经过巨大的努力，我成功在没有使用梯子的情况下徒爬了那个悬空裂缝，环境与马洛里当年的尝试相似。在稀薄的空气中，这既困难又充满挑战，但得益于现代装备和技术的优势，这项成就仍然比马洛里所面临的要容易得多。我们的团队在
  6 月 14 日到达顶峰，这让我获得了第二次站在地球之巅的机会。


  ## 意义的改变


  当我 1962 年出生时，世界人口为 31 亿。尼泊尔的人口为 1000 万，总共有 9 人站过珠朗玛峰顶顶。当我 2012 年通过第三次探险到达顶峰时，世界人口已突破
  70 亿，尼泊尔的人口已膨胀到 2600 万以上。同一天——即 2012 年 5 月 26 日——共有 106 人登顶，使 50 年来的登顶总数超过了 6000
  次。在媒体的推动和山上依然发生的必然死亡的影响下，公众情绪认为，由于有这么多登山者，珠朗玛峰已不再具有意义。它已从一场史诗般的、大胆的冒险变成了一个容易获得的奖杯。


  珠朗玛峰将永远是人类关注的焦点，因为它是地球上的最高点，因此它保留着巨大的吸引力。虽然登山圈的业内人士不再尊重它的攀登，但它对非登山者来说仍具有迷人的魅力。深知珠朗玛峰对地球公民依然具有的诱惑和魅力，我决定发起一次“遗产探险活动”（Legacy
  Expedition），以纪念 1963 年的首次美国珠朗玛峰探险。


  ## 遗产攀登


  我们 2012 年的团队结合了多个教育要素。珠朗玛峰的地球科学、岩石的组成以及驱动它们走向地球顶端的力量，成为了戴夫·拉格森和来自蒙大拿州立大学团队的焦点。通过收集从顶峰到大营的岩石剖面，他试图更全面地了解岩石及其是如何到达所在位置的。将这些信息与国家科学基金会分享，并为四年级和五年级学生课程，为参与科学提供了一种令人兴奋的方式。


  ![](img/Anke_9781426212413_epub_010_r1.jpg)


  夜晚穿梭在帐篷间的头灯光束显示了大营地有多么繁忙。尽管许多人将其视为通往高峰的长途攀登的起点，但许多人徒步至 17,598 英尺处，去看位于珠朗玛峰西肩与努普初峰（Mount
  Nuptse）之间的昆布冰川瀑（Khumbu Icefall）。


  布鲁斯·约翰和梅奥医学中心的团队研究了高海拔对人体生理的影响，特别是心肺系统如何应对这种压力。研究健康身体如何对海拔做出反应，使研究人员能够更好地预测和监测疾病。我们的团队包括此前没有海拔经验的岩岩者。他们能够承受这种严酷的要求吗？对登山者进行的测试追踪了与心脏病患者面临的相同的适应和反应。在珠朗玛峰严苛的环境中测试医疗设备将使它们变得极致的耐用。


  将高海拔生理学、地球科学与互联网实时世界中的攀登探险相结合，为团队提供了触及数百万人的机会。五十年前，故事是通过报纸、杂志和书籍讲述的。2012 年的交流，无论好坏，都是即时的。现在附近的一个手机基站让夏尔巴人和登山者能够每天与家人保持联系。大约一油块大小的卫星电话在山体高处提供了即时通信。我们通过实时
  Google 聊天与数千名人分享了大营的经历。2012 年 5 月 26 日，我在顶峰与我的朋友戴夫·哈恩会合。这是他第 14 次登上那座山，也是我的第 3 次。在蓝天下，我们在一起在顶峰的时间比
  13 年前要长一点。


  此后，我意识到我与珠朗玛峰的关系到了一个转折点。我的年龄和 1963 年的珠朗玛峰探险一样大。我在没有使用辅助氧气的情况下登顶，这项成就比我前两次登山需要更多的努力和个人牺牲。在脑海中，我对这座山付了更大的尊重，通过公平的登上了巅峰。


  我与尼泊尔昆布地区的联系、与居住在那里的夏尔巴人的纽带，以及二十年来在那里攀登产生的友谊，给我留下了深刻而持久的印象。尽管我曾前往喜马拉雅攀登冰、岩石和山峰，但我最看重与当地居民的互动。2012
  年，我加入了高级夏尔巴队攀登洛子半峰面。我们一起攀登，为所有后续的登山者固定绳索。我亲身体验了这些登山者每个季节为准备路线所做的工作。从 1953 年的丹增·诺尔盖·夏尔巴（Tenzing
  Norgay Sherpa）到 2012 年的我们的潘鲁·夏尔巴（Panuru Sherpa），夏尔巴登山者一直是珠朗玛峰历史不可或缺的一部分。他们的辛勤和奉献为所有成功的登顶奠定了基础。


  ## 永恒的珠朗玛


  尽管有质疑者，珠朗玛峰依然为有抱负的登山者提供挑战。“幻想脊”（Fantasy Ridge）源自西藏的东坡冰川并连接到东北脊，也许是喜马拉雅山最大的未被攀登的挑战。以更好的风格——即不使用固定绳、高海拔支持和辅助氧气——重复路线，仍然为登山者提供了无限的机会。


  珠朗玛峰仍然是探索和发现的象征。它的流行程度反映了人类在地球上的增长。珠朗玛峰的资源利用和拥挤问题反映了下方文明面临的问题。喜马拉雅山作为一个低纬度高山脉，正处于人为气候变化的前沿。冰川受到全球变暖和大气变化的影响。这些挑战是人类发现和探索的下一个“珠朗玛峰”。这种人类登顶的驱动力将激励后代继续探索未知。如果我们的珠朗玛峰探险有助于保持好奇心和动力的火焰，我们就为在地球上美好生活的集体动力做出了贡献。


  请加入我们，在接下来的页面中探索珠朗玛峰。


  # ![](img/Anke_9781426212413_epub_011_r1.jpg)


  ![](img/Anke_9781426212413_epub_012_r1.jpg)


  古代波斯地理学家将亚洲中部的山脉称为 Bam-i Dunya——世界之脊。延伸近 1800 英里的喀喇昆仑-喜马拉雅-西藏带是一个动态的地质实验室，由两个古代洋盆的关闭和无数地壳块的碰撞形成。对于像我这样的一个结构地质学家来说，它具有不可阻挡的吸引力。我想亲眼看到顶峰并走走那些路线，因此我加入了由康拉德·安克领导的遗产探险活动。






  很难描述我第一次看到珠穆玛峰时内心涌出的强烈情感。当云雾在昆布冰谷短暂散开时，珠穆玛峰高首挺胸地屹立在前景巨大的山峰之上。它的金字塔形山顶在不可思议的蓝天映衬下显得深沉而岩石；与周围任何其他山峰不同，一股巨大的雪柱从它的山顶向东飘散出来，宛如一面旗帜向世界宣告：“我是最高的，我是下方一切万物的母神。”随后，云雾再次聚拢。我的夏尔巴向导（一位友蔼且富有精神世界的绅士，他多次登顶珠穆玛峰）慷慨地对我微笑，眼神中透着同情、幽默，或许两者兼有。


  对我而言，珠穆玛峰蕴含的魔法在于写在岩石中的故事。地质学家必须从构成景观的碎片手稿中拼凑出这个故事。我感兴趣的章节记录在构成山顶金字塔的灰色海洋石灰岩层中。这就是为什么我被顶峰所吸引。


  ## 提提斯海底的生命


  站在 21,300 英尺（6,500 米）的高度，在午媚的阳光下仰望珠穆玛峰的西南面，我看着金字塔形山顶的灰色石灰岩变成了银金色。下方的“黄色带”也变成了橙色。急流在咆哮，听起来像是巨大瀑布的轰鸣，但唯一流动的水就在我的脚下——那条缓慢移动的冰结冰舌，被称为昆布冰川。


  我在二营附近的岩石间蹒跚，气喘吁吁，寒冷刺骨，寻找着石质宝藏。有时可以发现一小块灰色石灰岩，它们从山顶坠落了约 7,700 英尺到达冰川上。这些岩石讲述了一个壮丽的造山故事，从海底到山顶，跨越了地球近
  5 亿年的历史——讲述了一个古老的海底如何变成地球最高山峰之冠的故事。


  我们的旅程始于大约 4.8 亿到 4.7 亿年前，在大超级大陆冈瓦纳北岸沿的海底，当时的印度正与此相连。像今天亚马逊河一样巨大的河流通过宽阔的三角洲入海。积云在雾蒙蒙的午后地平线上汇聚。还没有鸟类，但在海面之下有原始的无颌鱼，它们与成群细小、蠕动的、蠕虫状生物栖在一起觅食。海底相当平坦，有几处浅滩和峡谷，将流动的沉积物汇向远在北方的深渊。在其他地方，细粒沉积物与无脊椎动物的碎片残骸混合在一起，形成了碳酸盐沉积物，这将成为如今的石灰岩和白镁岩。


  ### 奥陶纪无脊椎动物


  这段海底是提提斯海的一部分，这是一个以希腊海女神命名的古老水域。我们关注的这一片区域被称为珠穆玛海架（简称 CS），其名字源于珠穆玛峰传承数世纪的藏语称呼。CS
  的海底栖息着一个生机勃勃的海洋生态系统。如果我们跟随阳光穿透上层海洋的光束，海架将在昏暗且不断减弱的光线中显现。这些深度的水稍凉，但绝不寒。根据对从珠穆玛峰顶带回岩石的微观研究，我们可以推断，CS
  的海底并非由粘泥，而是由各种海洋无脊椎动物排泄的小碳酸盐泥颗粒组成。当这些生物最终死亡时，它们的外壳贡献了碳酸盐沉积物的堆积。


  各种三叶虫在这一片海底穿梭。某些带刺的三叶虫喜欢在表面移动以觅食食物，而更强壮的变种则钻入柔软的沉积物中寻找食物。角壳类是甲壳动物的一一目，有时被称为“种子虾”。它们微小的双壳外壳看起来像小蛤蜊，大多数角壳类动物生活在海底或沉积物的第一层中。具有独特对称外壳的足形动物在这一地质时期发生了显著多样化，成为底栖生物群的重要组成部分。海百虫在海底也极其丰富，通过柔性的茎或柄附着在海底，形成了庞大的“海百合”群落。海百虫是滤食动物，利用纤细的如羽毛般的“手臂”从沿底部流动的温暖洋流中捕获食物。海百虫变得如此常见，以至于它们的骨骼部分形成了惊人的石灰岩厚。此外，在海底还发现了珊瑚，因为这一时期见证了全球热带海洋巨大珊瑚礁群落的崛起。石珊瑚藻（一种灭绝的海绵）也在这些礁石群落中繁盛。有了所有这些物种，这是一个健康、繁荣、未污染的海洋生态系统——一个产出丰富的海洋碳酸盐岩生物工厂，在某个遥远的地质未来，它们将被抬升至地球的最高境界。


  ### 大生物多样性事件


  这些岩石沉积于奥陶纪时期，即 4.88 亿到 4.44 亿年前，当时生命形式变得多样化并变得更加复杂——这是地球历史上海洋生物多样性最剧烈的增长。这被称为大奥陶纪生物多样性事件（简称
  GOBE），海洋生物多样性在目、科、属、物种水平上增加了三倍。在 GOBE 期间，占据主导地位的少数海底无脊椎动物被一系列多样化的、更复杂的海洋动物所取代。





  印度大三角测量最终于 1847 年到达了喜马拉雅山南端的山脚。由于无法进入尼泊尔王国，测量员被迫在南部的塔拉伊（Tarai）地区工作，以测量 100 多英里之外喜马拉雅山的高峰。1847
  年秋季，季风季节结束后，测量长安德鲁·沃（Andrew Waugh）在喜马拉雅山东端达绪岭山下的索纳科达（Sonakhoda）测量了远处的“雪峰”。在众多山峰中有一座脱颖而出，即现在的康青杜章峰，其海拔
  28,169 英尺（8,586 米），是世界第三高峰。沃在随后的几年里一直没有公布他的测量结果，部分是因为在尼泊尔西藏边界观测到了另一座山峰——一个根据希腊字母命名为伽（γ）的远远巨峰。


  ![](img/Anke_9781426212413_epub_013_r1.jpg)


  `LAMBTON’S GREAT THEODOLITE` 在整个印度大三角测量中被使用，它可以测量水平和垂直轴，但便携性较差。它重达半吨，需要 12 个人来抬运。


  与此同时，1847 年 11 月，一位名叫约翰·阿姆斯特朗（John Armstrong）的测量助理也从更靠西的位置将测量仪器对准了“γ”。他将该山峰命名为“b”，并赋予了
  28,799 英尺（8,778 米）的初步高度。沃不信任“γ-b”的高度计算结果，决定在做出公布之前等待进一步的测量和重新计算。在接下来的两年里，沃特派了两了两名测量员前往塔拉伊进行额外的观测和测量，但云层和远距离反复阻碍了他们获取更多数据的尝试。


  在经过多次尝试后，1849 年，詹姆斯·尼尔森（James Nicolson）终于在比以往任何测量员都更接近这座神秘山峰的多个观测站获取了几个垂直和水平角；他的初步计算得出的高度约为
  30,200 英尺（9,205 米）。但尼尔森的初始计算没有考虑到光折射，而光折射会给高度计算引入巨大的误差。


  又过了几年，直到当时沃的“首席计算员”、一位才华的孟加拉数学家拉达纳斯·西克达尔（Radhanath Sikdar）极可能是第一个确定该山峰首次准确高度的人。1856
  年 3 月，安德鲁·沃终于正式宣布。在一份 14 段的文件中，第 5 段写道：“我们多年来一直知道这座山比印度以前测过的任何山都高，而且很可能是世界上最高的山。”他将该山峰命名为珠穆朗玛峰（或喜马拉雅第
  15 峰），位于北纬 27° 59′ 16.7″东经 86° 58′ 5.9″，报告其海拔为海平面 29,002 英尺（8,840 米）。


  英国测量员倾向于使用当地名称来命名喜马拉雅山峰，如果能找到这些名称的话，但由于尼泊尔对外关闭，沃无法得知任何当地地名。他以自己的前任乔治·埃弗莱斯特爵士（Sir
  George Everest，其家族发音为 EEV-er-est）命名了这座山，而这位爵士并未支持这样使用他的名字。尽管如此，埃弗莱斯特峰的名字随后在伦敦得到了皇家地理学会批准，关于地球最高峰的知识迅速传遍世界。


  ## 山山下的根


  对安第斯山和喜马拉雅山等大山脉的地质和地球物理学研究有着悠久的历史，研究人员不仅试图确定它们的起源，还试图回答基本问题：*是什么支撑着这些山？它们是否存在永远无法超越的最大高度？岩石体在它们内部是如何分布的？*


  这些问题的答案涉及了山脉地质组装的基本性质。从卢克拉（Lukla）徒步到珠穆朗玛大营，历时数日，我经常被这些伟大山脉对全球地球科学历史发展的巨大意义所震撼。在过去的
  150 年里，基本的科学思想源于对这些高耸山峰的研究。


  印度大三角测量最令人印象深刻的科学成果之一是发现山脉具有深层的地壳根，一直延伸到地球的最上地幔，类似于冰山延伸到海面以下很多的“根”。尽管 19 世纪在印度的英国测量员知道喜马拉山的质量会影响他们测量垂线的垂直角（这种现象被称为天文地学偏移），但产生这种现象的地球物理细节在很大程度上是未知的。


  皇家天文学家乔治·艾里（George Airy）对垂线偏移提出了一种分析。他假设低密度地壳岩石（例如花岗岩）的深层根位于大山脉之下，因此高山脉通过其深层地壳根实现了“密度补偿”。今天，我们知道喜马拉雅山确实拥有一个巨大的、低密度的地壳根，这是由印度大陆与亚洲大陆的碰撞产生的。大喜马拉雅山下方的地壳向下延伸了
  44 英里——是附近低地地壳平均厚度的两倍。


  ## 两位早期的地质学家


  在理想情况下，科学是一个渐进的过程，新的理论和思想是建立在过去的理论基础之上的。自从 20 世纪 60 年代由于板块构造学早期发展以来，我们对伟大山带如何形成的理解已经发生了巨大的变化。许多地球科学家值得被提及；事实上，许多历史性的喜马拉雅登山活动都包含一名或多名研究性地质学家，包括
  1963 年带有梅纳德·米勒（Maynard Miller）的美国珠穆朗玛峰远征。在许多优秀的研究者中，我选择了两个地质学家进行重点介绍。这两个人之所以成为年轻地质学家的榜样，不仅是因为他们的专业成就，还是因为他们坚韧的人格和精神，这种精神依然回响在喜马拉雅的山峰和峡谷之间。


  ### Noel 奥德尔


  奥德尔（Noel Odell，1890-1987）作为地质学家和登山家拥有长长而卓越的职业。他曾服务于皇家工程师兵，并在矿业和石油行业工作，哈佛和剑桥等大学教授地质学。奥德尔最著名的可能是因为他是
  1924 年 6 月 8 日乔治·马里和安德鲁·桑迪·欧文尝试登上珠穆朗玛峰东北脊时最后看到他们活着的人。当马里和欧文没有返回营地时，奥德尔两次在没有氧气的情况下爬到
  27,000 英尺（约 8,200 米），试图寻找他们。他能够爬到那么高，在多年来被认为是辅助氧气设备（当时被称为“英国空气”）的重量对高海拔登山是有利的。1936
  年，他与比尔·蒂尔曼（Bill Tilman）首次成功登顶南迦提峰（Nanda Devi），当时是世界上最高峰。奥德尔在 1938 年作为蒂尔曼远征队的成员回到珠峰。


  `NOEL ODELL WAS` 既是地质学家也是登山家。他是 1924 年英国珠穆朗玛峰远征队的成员，在那儿他是最后看到乔治·马里和桑迪·欧文活着的人。奥德尔是首批研究喜马拉雅地质学的人之一，在
  1924 那次旅行中采集了他最初认为是化石的样本。




  在 1924 年的探险期间，奥德尔（Odell）兴奋地认为自己在珠穆峰海拔约 25,500 英尺（7,772 米）处四英尺厚的变质钙砂岩层中发现了化石。他最初将其鉴定为叶瓣目化石（双壳软体动物）的铸，但后来撤回了这一说法，表明所谓的化石实际上是“锥中锥”结构，这是一种在含粘土岩中相当常见的无机结构。奥德尔还展示了无可争议的石笔虫化石微照片——这是在珠穆峰顶部的石灰岩中发现的海动物残骸，证实了奥古斯托·甘瑟（Augusto
  Gansser）的观察，甘瑟曾于 1956 年从瑞士登山者处以及 1963 年的美国团队处获得了顶部样本。尽管奥德尔最初的发现被证明是无机的，但他对珠穆峰地质的开拓性工作赢得了极大的尊重。


  ### 奥古斯托·甘瑟


  奥古斯托·甘瑟（1910-1012）是一位瑞士探险家和地质学家，参加了著名的 1936 年瑞士喜马拉雅探险，乔装成佛教朝圣者进入了西藏禁区。他是首批看到神圣的凯拉斯山的西方人之一，那里是四条喜马拉雅大河（印度河、萨莱特河、布拉马普特拉河和汇入恒河的甘达吉河）的源头。组成凯拉斯山的岩层抬升了超过
  20,000 英尺（6,100 米），但基本上保持水平状态，而周围的岩石则高度倾斜和变形。甘瑟还在凯拉斯山以南发现了古代海洋地壳遗迹，这导致了印度与亚洲之间板块构造边界（或缝合带的命名。在这方面，甘瑟和他的导师阿诺德·海姆（Arnold
  Heim）对喜马拉雅地质的解释领先了时代几十年。


  甘瑟的研究使他回到不不丹进行了为期五个季节的野外考察，在那里他沿着西藏边界在海拔高于 24,000 英尺（7,300 米）的未知山脉开展了更多开拓性的地质工作。他发表了大量著作，包括巨著《不丹喜马拉雅地质》（1983
  年）以及最重要的决定性著作《喜马拉雅地质》（1964 年）。在这部书中，他制作了一幅横跨整个喜马拉雅-西藏地区（从东经 70°到东经 95°）、比例为 1:2,000,000
  的地质图——这是地质合成和难以想象的艰辛工作的杰作。甘瑟因对该地区地质的大量开拓性工作被白斯答尔大学授予了“喜马拉雅之父”（Baba Himalaya）的称号。


  ![](img/Anke_9781426212413_epub_015_r1.jpg)


  瑞士地质学家兼探险家奥古斯托·甘瑟是瑞士喜马拉雅探险队的成员，他是首批通过尼泊尔进入西藏研究该山脉地质的人。他伪装成佛教朝圣者，藏起锤子、相机和写生本，进入了西藏禁区。他是首批看到神圣的岗仁波齐峰西方人之一。


  # 声音


  #### 奥德尔的最后一眼


  诺尔·奥德尔（Noel Odell）在 1924 年 6 月 8 日的早晨醒来，出发前往六号营，对他正前往珠穆峰顶顶的朋友乔治·马洛里（George Mallory）和桑迪·欧尔文（Sandy
  Irvine）充满乐观。在约 26,000 英尺处，他仰望山峰最高处。正当他这样做时，从午晚开始积聚的云层散开了，让他看到了东北脊和顶峰。他在日记中写道：“12:50
  看到 M 和 I 在靠近终点金字塔底部的山脊上。”他是最后一个看到他们还活着的人。


  #### 依然是一个谜团


  从那以后，最后一眼一直受到细致的审查和争论，但从未有人能证明他没有在如此接近顶点的地方看到马洛里和欧尔文。奥德尔对 1924 年珠穆峰探险的贡献往往局限于这一项观察，但实际上他在远征和山上的作用比历史所暗示的要重要得多。其一，他被证明是对海拔适应得最好的人，是唯一一个爬到四号营以上去寻找失踪登山者的人。另一方面，也许没那么明显，他是桑迪·欧尔文的导师。他和桑迪第一次在
  1923 年一起参加探险，当时他们带着四人雪橇队穿越了挪威的斯匹茨伯根岛（Spitsbergen）。桑迪的表现让奥德尔有信心向珠穆峰委员会推荐他，而该委员会当时正在为
  1924 年的探远征寻找一位“超人”。


  事实上，他和桑迪比那还要早认识，在 1919 年，当时奥德尔在北威尔士度蜜月。他和他的妻子在卡内德道山区（Carneddau，威尔士最北的山脉）散步时，在距离利兰费尔费费坎（Llanfairfechan）村约
  3,000 英尺的 Vras 山上遇到了一位勇敢的年轻摩托车手。摩托车手走向奥德尔夫妇，询问他们前往村庄的路。他们指了小路，看着他骑摩托车穿过崎岖的地形并沿着陡峭的路离开。只有当奥德尔在斯匹茨伯根的一个帐篷里重述那个故事时，桑迪才认出了自己，并透露那个摩托车手就是他。从那时起，一种比表面友谊更深层的纽带建立了，在探险训练期间，桑迪经常给奥德尔写信，分享他对所做一切事的喜悦。


  #### 回帐篷


  在奥德尔看到马洛里和桑迪正全力冲顶后，他前往六号营，并对散落着氧气设备的帐篷感到好奇。桑迪把帐篷都变成了工作间，这个也不例外。奥德尔留了一些食物，下到了五号营。


  桑迪·欧尔文和乔治·马洛里没有回到他们的帐篷。他们死在山上了，但奥德尔当时并不知道。第二天他又回到了六号营，之后也是如此，希望能看到朋友的踪迹。我们知道他什么也没看到，但很少有人停下来想象，当他意识到必须报告这个消息——首先告诉登山领队爱德华·诺顿（Edward
  Norton），然后告诉全世界——伟大的乔治·马洛里和他年轻的登山伙伴桑迪·欧尔文在如此接近顶点的地方去世时，他该有多难过。


  奥德尔不仅仅是一个历史符号。他是 1924 年珠穆峰之谜的核心。


  朱莉·萨默斯（JULIE SUMMERS）英国作家和历史学家，朱莉·萨默斯出版了十本书，其中包括《无畏珠穆峰：寻找桑迪·欧尔文》（Fearless on Everest:
  The Quest for Sandy Irvine）。


  ### 大陆碰撞


  我们现在理解，喜马拉雅山带是印度和亚洲两个大陆大规模碰撞的结果，这是基于 20 世纪初德国科学家阿尔弗雷德·韦格纳（Alfred Wegener）提出的大陆漂移理论。根据现代大西洋两岸的岩石构造和化石记录，韦格纳假设在
  2.5 亿年前存在一个巨大的超级大陆，我们现在称之为泛古大陆（Pangaea）。随着这个超级大陆的缓慢分裂以及大陆“漂移”到目前的位置，由于特提斯洋盆地在其前方关闭，印度缓慢向北方的亚洲移动。当最后的洋壳地壳碎片俯入地幔时，印度与亚洲碰撞，抬起了喜马拉雅山。





  魏格纳对大陆漂移的研究完全基于大陆的地质学，因为在他那个时代，还没有探索洋盆所需的技术。这一切在二战后的几年里随着技术的飞速发展以及我们对太空和深海探索能力的增强而发生了改变。这些发现无异于科学探索史上最伟大的科学革命之一——20
  世纪 60 年代末板块构造学的诞生。我们现在理解，地球的最外层由半刚性板块组成的马赛克结构，这些板块在地圈幔上部的薄弱层上滑动，并在板块边界处相互作用。`GPS`（全球定位系统）卫星测量证实，即使在今天，印度相对于西伯利亚每年以约
  1.5 英寸的速度向东北方向移动。


  ![](img/Anke_9781426212413_epub_016_r1.jpg)


  `SNOW CAN HARDLY` 很难附着在珠穆玛峰黑暗的北坡和南坡（左侧）。尽管这座山峰由海洋石灰岩组成，但这些岩石也带有由于与大喜马拉雅山抬升相关的构造变形和热量的细微特征。


  喜马拉雅山是在涉及若干个较小地体（或微板块）的多阶段碰撞中形成的。这个故事将我们回到 4.8 亿到 4.7 亿年前特提斯洋海底，以及珠穆玛峰架上的壳质碳酸盐沉积物。沉积层积累在`CS`海底，并在压力下压实，通过碳酸钙胶结并重结晶成硬的石灰岩，将无脊椎海洋生物作为化石埋在固体岩石中。随着这些松散的地体向北移动，一个洋盆在前方通过俯冲作用关闭——古特提斯洋；而另一个在后方通过海底扩张开启——新特提斯洋。南亚洲（包括现在的西藏高原）通过三次碰撞事件汇聚，这些事件从北向南增加了新的地壳块，这一过程被称为构造增生——这是地球历史上大陆向外增长的主要过程。当印度最终与欧亚大陆碰撞时，形成了第四个主要的缝合带。这次巨大的碰撞削弱了欧亚南岩石圈，结果印度能够向北钻得更深。据估计，在过去的
  5000 万年里，印度向北进入欧亚大陆的距离超过了 1250 英里。部分俯冲、推覆断层和上地壳岩石褶皱相结合形成了喜马拉雅山。


  ## 珠穆玛峰的基岩解剖


  从地形上看，珠穆玛峰是一座巨大的金字塔，有三个巨大的面和三条通往山顶的山脊。东北脊从山顶延伸三英里到达一个山口（或缺口），将东隆布冰冰川和宗冰川隔开。在东北脊山顶向下一里处，一个肩部标志着北脊的顶部，它将北坡分为若干并将珠穆玛峰与长岭（北峰）隔开。西脊由汤姆·霍恩因和威利·温索尔德在
  1963 年美国探险队首次登顶，从山顶向西北方向延伸约三英里到达`Lho La`，昆布冰峰和珠穆玛峰之间的一个山口。短的东南脊长约一英里，向下弯至南山口，将珠穆玛峰和洛子峰隔开。


  在这些山脊之间矗立着珠穆玛峰的三个大面：北坡、极陡峭的西南坡和冰冷的宗角坡。每个山面都有自己的个性，这由其朝向、岩层的硬度、贯穿其间的构造特征以及横截岩单元的倾斜方向（或坡度）决定。长长的东北脊是一系列重叠的沉积岩层，沿着山脊长度向东北方向倾斜。东北脊上的第一阶、第二阶和第三阶是由岩层的下倾斜端形成的，像重叠的屋顶瓦一样落在下方的岩层上。在较短但更陡峭的东南脊上，岩层的倾斜方向“指向山体”，从而创造了如钝而陡的阶梯，如南峰和希拉里台。


  珠穆玛峰的基岩地质比其地形复杂得多。珠穆玛峰不是岩石单元的层饼；它不是大峡谷岩壁上那种水平地层的侵蚀遗迹。相反，珠穆玛峰被主要的断层切割，这些断层将不同类型的岩石并置。珠穆玛峰的任何彩色照片都显示出四个颜色和层理特征不同的岩石层。从上到下：


  *   灰色石灰岩构成了山顶金字塔；

  *   黄带是珠穆玛峰最显著的岩带，它像金戒指一样环绕在山顶正下方；

  *   珠穆玛系列（Everest Series）的深灰色、薄层、细粒、弱变质沉积岩广泛暴露在黄带下方；以及

  *   白色花岗岩和高级变质岩（片麻岩和片岩）构成了山的下部。


  ### 山顶岩石


  构成地球最高出露点的是沉积岩，由灰色、细纹理的粉砂质石灰岩和白云岩组成。这些岩石最早被诺埃尔·奥德尔（Noel Odell）鉴定为古代海洋沉积岩，并被奥古斯托·甘瑟（Augusto
  Gansser）描述为细粒的、薄层的、灰色的“板状石灰岩”或“钙质片岩岩”，其特征是存在卷笔虫化石碎片。甘瑟利用这些碎片来支持他的观点，即山顶石灰岩属于晚古生代，距今约
  3 亿年历史，尽管他意识到化石的保存状况不足以确定准确的年龄。更晚的地质学家从山顶石灰岩样本中发现了其他无脊椎化石，并在东北脊第三阶底部描述了一种独特的白色风化、厚达
  200 英特的球体岩层（thrombolite）——这是古代海洋碳酸盐岩中常见的微生物沉积物。这些化石除了中国南方的地层学研究外，还确定了珠穆玛峰山顶石灰岩的奥陶纪时代：大约
  4.7 亿年前。


  ### 黄带


  独特的黄带无疑是珠穆玛峰最易识别的特征，它在山顶正下方形成了一个黄褐色的色大理石高环。我喜欢把它想象成一个金戒指。黄带紧邻珠穆玛峰剥离断层下方，在东南脊的南峰下方以及东北脊的第一阶下方露头。它厚度约
  650 英尺，是由间断的白云岩质大理石和片岩组成的，片岩是一种具有丝绢光泽的细粒变质岩，表明这些岩石承受了比覆盖地层更高的温度和压力。黄带被认为属于中寒武纪，比山顶金字塔的奥陶纪岩石老约
  300 万到 4000 万年。


  ### 珠穆玛系列


  在珠穆玛峰三个面的大部分黄带下方是珠穆玛系列，主要源自泥岩或页岩的低级变质岩，包括变质砂岩和少量的薄层大理石。


  ### 大喜马拉雅序列





  珠穆玛山的底部由火成岩和变质岩组成，它们形成了喜马拉雅山脉的变质核心——这是一个被称为“大喜马拉雅序列”（Greater Himalayan Sequence）的巨大岩石板块，从洛拉到珠穆玛大营的徒步路线上很容易观察到。深色的变质片岩是一种类似于花岗岩的条纹岩，点缀着杜德科西河（Dudh
  Kosi River）切割出的深谷岩壁。在通往南姆切扎（Namche Bazar）的陡峭之折路径上，你会注意到旋状的麻绿岩，这是一种曾经部分熔化的变质岩。刻在南姆切扎、波尔（Phortse）和腾波（Tengboche）之间近垂直坡上的石阶提供了变质矿物和构造的新露面。当你接近攀达布拉峰（Ama
  Dablam）并继续向下方的昆布冰川前进时，沿途岩石中白色花岗岩的比例显著增加。在大营处，景观变得单调，变成了一个由白色花岗岩和冰雪构成的黑白垂直世界。这是山带出露的核心，即其内部——印度地壳的上部脱离、变质并向南自身折叠，形成了大喜马拉雅山。


  ## 西藏剥离层系统


  两处巨大的断层——珠穆玛剥离层（Chomolungma detachment）和洛切剥离层（Lhotse detachment）横跨在珠穆玛峰的西南面。它们合称为“西藏剥离层系统”。在地质学术语中，断层是地壳中的一种裂隙，导致断层两侧岩石类型之间出现明显的位移。狭窄且脆弱的珠穆玛剥离层位于“黄色地带”（Yellow
  Band）顶部，并将顶峰金字塔带在其悬地壁中。较宽的洛切断层带带位于大喜马拉雅序列的花岗岩、片岩与上覆的珠穆玛系列（Everest Series）之间。在珠穆玛以北，这两个断层汇合并向东西方向延伸了至少
  400 英里。


  地质学家已经确定，大喜马拉雅板块的抬升是通过底部主要推冲断层（在珠穆玛以南 30 英里处外露）和板块顶部西藏剥离层系统（在珠穆玛地区）的同步运动实现的抬升和构造剥露。这一过程被称为“通道流构造作用”（channel
  flow tectonics），就像从管子里挤出牙膏一样，大喜马拉雅山从字面上被这两个巨大的断层系统挤向了南方。当人们在西谷（Western Cwm）上方稀薄的空气中向珠穆玛更高海拔地区跋涉时，这是一个值得深思的故事！人们不仅是在攀登一座山，而是在穿过最上层地壳并穿越一个主要的断层系统，这个系统实际上将世界之顶从深处的根部分离了。


  通道流构造作用这一新模型彻底改变了我们对山系构造地质学和构造演化的思考。我们现在理解，巨大的山脉不仅通过冰川和河流侵蚀这种缓慢但持续的表面过程而磨损；它们还可以通过大规模剥离断层发生构造侵蚀，从字面上削掉最高的地形。


  三个因素促成了喜马拉雅山的现代抬升：


  1. 印度板块与欧亚板块之间每年约 1.5 英里的速度持续碰撞；

  2. 喜马拉雅山的构造剥露和侵蚀；

  3. 印度洋每年夏季季风引起的对喜马拉雅山南坡的持续侵蚀。


  气候通过长期的降水和侵蚀能够影响地壳深处数英里处的构造过程，这是一个革命性的概念。通过这种方式，山脉是地质知识的大师，而喀喇库拉姆-喜马拉雅-西藏山带确实是地球上最伟大的地质实验室之一。


  我找不到比这更贴切地球构造引擎诗意的致敬了：这个如今如今被称为“世界之顶”的地区，曾是一片平静的海床，是生长在特提斯洋（Tethys Ocean）温暖清水的无脊椎动物的亚带栖息地。今天，现代河流将喜马拉雅山的沉积物、溶解盐和养分带回印度洋，正如
  4 亿多年前冈德瓦纳大陆（Gondwana）上的河流一样。也许一些从珠穆玛石灰岩中溶解的钙离子将沿着巨大的河流系统流向印度洋，成为另一个海底生物的碳酸钙壳的一部分。或许由于另一个大陆在几亿年后撞击印度，导致印度洋最终闭合，从而形成了了新的山脉。这就是地球运作的方式，也是一直如此的方式：一个包含有机和无机世界的宏大循环，在深远的地质时间内交织在一起。


  ## 山脉的诞生


  对于喀喇库拉姆-喜马拉雅-西藏山带，我们可以列举许多地质之极：它拥有地球最高的山峰（14 座海拔超过 8000 米，即 26000 英尺以上）、任何大陆中最大的地势差、最高的抬升率、极地以外最大的冰川集中地、世界上最高且最广的高原，以及世界上许多伟大河流的源头。自从探险和测绘早期以来，该地区吸引了地质学家这并不稀奇。我们可以在世界各大陆看到过去碰撞的证据，但喜马拉雅山巨大的抬升加上深度的侵蚀，为研究一个活跃、演化中的碰撞山带提供了无与伦比的机会，这是一场实实在在进行中的构造工程。


  珠穆玛峰是自然力量的宏伟见证。想到通过地球大陆和海洋板块的完全重组，古老的海床沉积物在 4 亿年的时间内被抬升到地球最高山峰的顶点，这令人不可思议。当我站在西谷的珠穆玛峰脚下时，这座山看起来永恒而坚实，建立在花岗岩基础之上，以石灰岩为冠。珠穆玛，这座女神般的母山，定将承受自然赋予给它的一切，就像它的山顶用流动的雪旗劈开平流层一样。


  但珠穆玛峰只是景观中一个暂时的标记，正如地质界的所有事物都是如此。珠穆玛峰是一部未完成的地质交响乐。她将随着时间继续变形和变化，可能在最终屈服于侵蚀、重力和冰川之前变得更高。无法预测何时，但另一座喜马拉雅峰最终将接过“世界之顶”的称号，然后是另一座，再之后。在一个充满活力的行星上，这种变化是不可避免的。变化正是我们最初存在的意义，也是我们有幸思考这一切的原因。





  1984 年秋秋，我艰难地向北穿越一片宽阔平坦的雪原。它的最高点以根粗壮木柱的形式凸起，标志着尼泊尔与西藏的边界。这就是传说中的`Nangpa La`，一个海拔
  19,050 英尺（5,800 米）的山口，位于珠穆玛峰西侧的卓峰阴影之下。我将一条`kata`哈达巾系在柱子上纠缠在一起的哈巾中，并诵着西藏高原藏族人和南方尼泊尔夏尔人通用的佛教咒语。沿着原路返回，我闻到一股从南方轻轻吹来的香气：那是阳光照射的松树和杜柏森林，混合了尼泊尔低地和印度恒河平原的尘土、香火和木烟。


  沿着边界的尼泊尔侧向下，我走过一条由冰川表面翻动并沉积的花岗岩碎石迷宫。牦牛可以顺着之前商队留下的气味行进，但独行的旅行者必须在单调的碎石坡中破解出路。我没有发现牦牛粪的迹象——每一块都被扔在牦牛队的货物上作为烹饪燃料。而那些用来标记路线的石堆正如西藏商人描述的那样：是虚幻的石堆，像幽灵一样移动并消失。


  跨越`Nangpa La`的路线长期以来一直是藏族人与其夏尔人同胞（珠穆玛峰的人民）之间历史、贸易和文化的纽带。我正进入`Khumbu`，那是夏尔人的家园——一个被流向`Nangpa
  La`和珠穆玛峰南侧的山头河谷环绕的地区。`Khumbu`的水最终汇入`Dudh Kosi`河并流向印度。一位僧侣描述`Khumbu`的轮廓及其河流脉络“像一朵即将绽放的花蕾”。


  根据夏尔人的传说，大约 500 年前，一个名为`Kira Gombu Dorje`的男人的猎狗在`Nang La`上追逐一只野羊。而这些狗又反过来被猎人追赶——他是第一个定居在`Khumbu`肥沃温带山谷的藏人。南侧更绿的牧场很快吸引了一群先驱性的`shar-pa`（即“东方的人”）社区，他们成为了尼泊尔的公民。


  在冬季，当西藏的农业和牧业相对闲静时，珠穆玛峰北侧的人仍然会越过`Nangpa La`。他们要么是在佛教朝圣，要么是来自中国的难民，在印度或西方寻找机会。他们通过攀越喜马拉雅山脊来到达外界的愿望，凸显了藏人对体验南方夏尔人所享有的自由那不可抑制的渴望。


  # KHUMBU 之精神


  `Khumbu`的夏尔人人数仅略多 3,500 人，而在南方步行三天路程的`Solu`地区有 17,000 人的平行人口。至少在一个世纪以来，这两个因方言和服饰细微差别而区别的聚集地通过婚姻紧密地联系在一起。从
  19 世纪中期到 20 世纪中期，尼泊尔拉纳贵族统治的奥秘法律将与西藏的贸易限制在居住边界地区的男性手中。这使得`Khumbu`的丈夫对来自`Solu`的新娘特别有青睐，因为这允许他们的家庭通过婚姻获得宝贵的贸易联系。


  但夏尔人与西藏的联系与其说是为了贸易，不如如说是为了宗教。从 20 世纪初开始，许多`Khumbu`的夏尔人将男孩送往北方，跨过`Nangpa La`，在珠穆玛峰西藏侧大营附近的`Rongbuk`佛教寺院接受僧侣训练。从这座寺院，夏尔人汲取了大量的正式宗教传统。


  1953 年与`Ed Hillary`一同登顶珠穆玛峰的`Tenzing Norgay`（丹增仁杰），在位于珠正东北方的藏族乡村`Kharta`长大。在`Rongbuk`短暂停学习后，他在
  20 世纪 20 年代跨过`Nangpa La`，与父母一起定居在`Khumbu`的村庄`Thame`。18 岁时，他离开`Khumbu`去`Darjiling`寻找工作——那里是前往珠穆玛峰的外国登山探队的招募和整备点。


  `Tenzing`的侄子`Nawang Gombu`——他在 1963 年与`Jim Whittaker`一同登顶珠穆玛峰——也在`Rongbuk`学习了两年，直到他无法忍受严格的寺院规律。一天晚上，他收拾好衣服，从厕所的孔溜出去，走过`Nangpa
  La`来到`Khumbu`。


  文化革命始于 1966 年——拉萨反华起义七年后。在那段混乱时期，`Rongbuk`寺院被摧毁了。幸运的是，`Rongbuk`大部分奥秘且丰富的佛教传统已经以独特的风格重新萌芽，并在`Solu`和`Khumbu`的夏尔人寺院中繁荣发展。


  # 圣地


  `Nangpa La`下方并非普通的山谷。我现在正进入一个`beyul:`（秘地）：这是`Padmasambhava`指定的几个“隐藏山谷”之一。`Padmasambhava`是九世纪的印度“莲生”圣人，被夏尔人尊尊为`Guru
  Rinpoche`（仁波波），他征服了山中经常愤怒的地区守护神，并将他们转化为佛教信仰的守护者。


  为了在逆境时期保护佛教信仰和教义，`Guru Rinpoche`的信徒相信他的女性伴侣在山谷和山间隐藏了“宝藏”。这些`beyul`被赋予了灵性能，夏尔人说经过这些景观时应保持敬畏。


  在`Khumbu`各地散布着灵性场所：古老的冥想洞、岩石上的“自显”手印和足迹，以及代表夏尔人`lu`蛇灵的奇异入侵。在泉水、井水和河流汇合处设有挂有经幡的小龛——这些是受到滋养水流眷顾的地方。村民说，如果这些地方被亵污——例如地民在附近宰杀羊并将肉放在水源——水就会枯竭。这会了`lu`。


  `Khumbu`严酷的环境似乎只增强了夏尔人的信仰。正如喜马拉雅山是由地质的交汇和沉积形成的，夏尔人的宗教也是融合性的——萨满教、前佛教以及苯教与藏传的混合——族神和地区守护神在山坡上潜伏和嬉戏。


  ## 雪雪人


  1974 年，一位名为 Lhakpa Drolma`的女性在`Khumjung`上方的一个山谷放牦牛时发现了一只`yeti`。根据她的描述，它迅速向她冲来并袭击，将她击晕。她醒来时半身浸在水里，发现三只牦牛死了——头不见了。当周围的人谈论雪人时，`Lhakpa
  Drolma`仍然会变得紧张和恐惧。


  “Yeti”源于`yate`，即冰川上的可怕动物。然而，比它更令人恐惧的是`mhi-te`，这是一种长毛的、矮型的人类，食人人类。夏尔人说，`mhi-te`的一眼——尤其是从下方向上看——可能会导致疾病甚至可能是死亡，因此应该避免提到这些可畏生物的名字。另一种矮人种被称为`min-jung-tale`。据说它有一张像猴一样的脸和短粗脚。它胸前挂着一串由人类耳朵（或骨头）组成的项链，用腿骨作为拐杖。


  一些夏尔人说，`yeti`与被称为法护神的灵类有关，并可能是愤怒的墓地女神`Du- to Lhamo`的化身，以及可能的其他神灵。然而，`yeti`并不总是危险的，有时被说是顽皮的恶作剧者，倾向于小偷小。





  腾波切喇嘛（Tengboche Lama）曾建议 20 世纪 50 年代一次寻找雪人的探险队留下一台相机，以便他可以拍照。“当外国人在周围时，他们似乎就不会出来，”他解释道。谢尔帕领队队长会确保雪人传说在客户中依然流传——他们会在徒步者躺进睡袋后，偶尔剧烈地摇晃他们的帐篷。


  # 声音


  ### 变化的昆布


  “现在的雪下得白茫茫的，但很快那种光芒就会消逝。”在面见腾波切寺主喇嘛仁波（Rinpoche）后，这些话在我的脑海中回荡。老人的眼中充满了岁月的沧桑和无私付出的辛劳。他坐在简陋的居室里，研究着记载着他所属谢尔帕人历史的卷轴。在担任昆布地区社区和宗教领袖近
  70 年后，他说他感到身心正变得虚弱。


  “所有的喇嘛都信仰真正的谢尔帕文化，随着他们，我们祖先的方式得以保留。然而，如果喇嘛失去了对谢尔帕人的信仰和信任，我们的文化将会遗失。”——仁波切


  腾波切寺坐落在喜马拉雅山上一个偏远且多风的山丘上，背靠着阿达布玛峰（Ama Dablam）宏伟的身影。对于大多数西方人来说，这个地方以及居住在此的僧侣体现了喜马拉雅山区古老而如今受尊崇的佛教文化。手工凿刻的石墙画得精美，讲述着喇嘛日常仪式的丰富故事：他们祈祷，演奏着在山谷中回响的古乐器。


  “游客来这里是为了我们曾经的文化，这样他们就能感觉自己闯入了未知领域，但事实是，我们年轻一代的面孔只留下了我们曾经文化的表象。”——仁波切


  人们不能责怪昆布地区的年轻人放弃了老的生活方式。无论在何处，选择现代教育和技术进步而非简单的体力劳动生活已成为一种趋势。但在这一过程中，在这一世界上最遥远的地方之一的现代化中，我们失去了什么？这是我在漫步于昆布地区——这个曾经神秘而隔绝的山神之域时经常问自己的问题。


  ### 被昆布所吸引


  1990 年，当我只有两岁时，我的父亲亚历·洛威尔（Alex Lowe）第三次前往昆布，成为第 40 位登顶珠穆峰的美国人。在当时，攀登珠峰仍然是一个遥不可及且难以实现的成就。我通过明信片以及躺在父亲怀里时他讲述的故事，了解了这些环境背后的宏大神秘色彩。从早开始，我就感受到了喜马拉雅山的吸引力——以至于在一次孩子气的发脾中，我向妈妈宣布道：“我要逃到加德满去寻找爸爸。”


  我的父亲于 1999 年去世，死于西藏喜马拉雅的一场雪崩。这个地区对我来说增添了更加严峻和神秘的色彩。2001 年，当我跟随母亲和继父康拉德·安克尔（Conrad
  Anker）去他们在尼泊尔昆布波尔策（Phortse）创立的谢尔帕登山学校时，我终于亲眼看到了尼泊尔。现在，在 2012 年春天，我再次回来从事我的研究和摄影项目，通过这些长期居民的眼睛来观察这种非凡的文化和地理，他们现在被我视为朋友和家人。


  对许多人来说，尼泊尔和喜马拉雅仍然是遥远而神秘的地方，只有最勇敢的旅行者才会造访。但在过去的 50 年里，穿越喜马拉雅的昆布和安纳普尔纳地区已成为一项巨大的旅游业，是尼泊尔经济最大的收入来源之一。第一座发电厂于
  1995 年在该地区建立，随之而来的是自来水、电话和互联网。从地球最高峰——世界上最严酷的环境之一珠穆峰的山顶望去，由于西方文化的进入，带来了许多诊所，让谢尔帕人的生活变得更加便利。


  ### 变得更好，还是更坏


  如果你问南崎（Namche）当地的人西方文化带来了什么负面影响，你很难得到答案。这里，人们似乎更倾向于西式的设施和生活。“现在的雪下得白茫茫的，但很快那种光芒就会消逝，”喇嘛说。


  几天后，我在胖波切（Pangboche）的寺庙与喇嘛会面，我们谈论了仁波切告诉我的事情，喇嘛闭上眼睛，点头示意，开始说道。


  “几百年前，西藏的宗教君主推行施予和无私，这就是谢尔帕人快乐性格的来源。人们在山里过着简单的生活，没有周围的风暴。西方人的到来带来了金钱和权力。现在人们不再关注施予和简单生活的理念……”


  “我 80 岁了，我见证了生命的无常。这世上的所有人都会死去，也许在明天、下周，或五年后。过好今天，保持一颗平常心。不要在计划未来上浪费时间，因为那些用来计划的时间可以用来付诸行动。”——喇吉谢


  喇吉谢说的话清晰地在我的脑海中回响。随着对无限财富的获取，人们可能会改善自己的生存，但为了什么呢？西方文化的影响无疑对个人的生活质量产生了积极影响，但付出的代价可能并不值得。


  “阻止洪水是不可能的，而且现在从东西方都在下雨。”——喇吉谢


  ### 山中女神


  这些神灵之一居住在珠穆峰：米雅波朗玛（Miyolangsangma），无尽施予的女神。那座山是她的宫殿和乐场，谢尔帕人将自己和登山者视为大本营不请自来的访客。只有当谢尔帕人在抵达大本营后通常建造的临时龛（lhap-so）向米雅波朗玛和其他神灵供奉后，他们才敢于进入危险的昆布冰川。在绘画中，米雅波朗玛被描绘骑在一只老虎身上，带着她穿梭于天界。她散发出严厉而慈祥的气，仿佛要求她的美丽和慷慨得到尊重和供品作为回报。




  正如许多夏尔帕人的神灵一样，她同时也占据着受喜爱、恐惧和崇拜的位置。1953 年，丹增·诺尔盖归功于这位女神让他在珠朗玛峰的山坡上安全通过，并护同他与埃德蒙·希拉里登顶了巅峰。


  # 声音


  ## 进步的推拉


  许多夏尔帕青年认为老一辈是落后的，因为他们对新技术持怀疑态度，低估了教育的价值，并拒绝对女性地位的新理解。年轻女性批评说，她们受到的教育比男孩更保守，被束缚于家庭，而男孩则被允许拥有更多自由时间和出国的机会。在夏尔帕文化中，是夏尔帕妇女（Sherpanis，女性夏尔帕人）作为保护力量，在男性外出时保障了族群延续与稳定性。女孩的培养源于将女性角色视为照料者和文化执行者的认知……


  语言和宗教是夏尔帕人心中不可争议的核心价值观。神话和宗教仪式构成了他们一年的生活节律——这种特征即使是最现代的年轻人也不愿改变。佛教及其价值观被毫无疑问地坚持着。


  然而，夏尔帕语并非如此。许多夏尔帕人的尼泊尔语比夏尔帕语还好……受过教育的年轻人意识到，如果语言等价值观得不到维护，夏尔帕文化可能会完全消失，他们要求采取保护措施来拯救这些传统特征。同时，他们也是变革过程中不可或缺的一部分。


  ——库特·鲁格（KURT LUGER），Eco Himal 主席，这是一个致力于喜马拉雅地区可持续发展的国际非政府。


  # 现代生活


  20 世纪 50 年代和 60 年代初标志着昆布夏尔帕人社会经济的分水岭。跨越南岗帕拉山口与西藏的传统贸易被新政权切断，昆布的村庄在一种缺乏活力的物物易物交换经济中挣扎。夏尔帕妇女大多种植土豆、编织毯子，然后将它们带下山谷去换大米和玉米。


  “我的兄弟姐妹因为头顶被背字带不断磨损而掉了头发，”受过教育的昆绒村村民安格·里塔（Ang Rita）说道，“没有人穿鞋，即使在冬天也是如此，尽管富裕的家庭有时会用牛皮鞣制并制作粗糙靴靴。”


  1959 年，昆布几乎没有学校、饮水系统、常年桥梁或完善的医疗。主要根据贸易人的经验（这需要一些数学技巧和起草商业协议的能力），年长的夏尔帕人开始意识到教育的价值。


  当埃德蒙·希拉里爵士在登顶成功六年后访问该地区时，一群村民围住他，向他递交了一卷状的愿书。“我们的孩子有眼睛，但他们是盲目的，”一位老人在聚聚的夏尔帕人的几次演讲中的其中一次说道。他们请求他办一所学校。希拉里成立了一个名为“喜马拉雅信托”（Himalayan
  Trust）的组织，并于 1961 年建成了昆绒学校。第一任校长来自卓吉，他走家挨户说服父母送孩子上新学校。第一班的 46 名学生跨越不同的年龄段；大多数人完全没有受教育的基础。


  “在上了两年书后，”安格·里塔回忆道，“我的父母对我想要继续学习感到惊讶。他们说：‘难道你还没学完该学的东西吗？’我决心继续读下去，所以每天清晨和深夜，我完成所有的家务——主要是爬树砍劈柴并带回村子。然后我就学习。”


  ![](img/Anke_9781426212413_epub_020_r1.jpg)


  学生们在尼泊尔加德满的冈仁齐峰山（Mount Kailash）一所寄宿学校排队。这些学生的父母为他们的教育买单，在一个农村学生需要步行几英里、翻越崎岖的山径才能到达学校的国家来说，这是一种奢侈。尼泊尔
  15 岁以上公民的识字率仅为 60%。


  在随后的十年里，希拉里组织的组织支持了另外 22 所学校的建设。对于安格·里塔来说，他在尼泊尔的中业毕业考试（School Leaving Certificate）中获得了全国最高分；他现在是喜马拉雅信托的董事。


  ### 健康挑战


  昆布也需要一家医院。由缺碘导致的呆呆症几乎是流行病，一些村民的脖子上挂着像小足球一样大的甲状腺。酒精症也很常见。溃疡、分娩并发症、肺结核——这一切都存在，尽管对偶然造访者来说并不显而易见。随后
  1963 年，天花从印度进入了昆布。如果不是喜马拉雅信托的快速反应——以及 1963 年美国珠峰远征队医生的努力——夏尔帕社区将遭受更沉重的打击。背负货物前往珠峰的挑夫被发现是疾病的载体，因为他们比大多数村民更有活力且更容易传染。那年春天，疫苗被运进来，信托基金能够为该地区的几乎每个人接种，包括南部索鲁地区的人。


  ![](img/Anke_9781426212413_epub_021_r1.jpg)


  夏尔帕挑夫在 2012 年攀登季期间在大营地合影，他们身上背负着各种货物。通过协助早期攀登，夏尔帕人以对山山的深刻理解以及在缺氧环境中作业的身体能力而闻名。


  1966 年，昆德村（Kunde）开了一家医院。碘化运动立即启动，几乎所有新的甲状腺和呆呆病例都被消除了。尽管如此，疾病仍然被归咎于鬼魂和恶灵的影响，直到今天，许多夏尔帕人在去医院之前仍会咨询巫医——医院是一个可以治疗伤口的地方，也有人在那里去世。


  四十年来，这家医院由来自新西兰和加拿大的夫妇医生组成。现在由受过西方培训的夏尔帕医生和员工运营。喜马拉雅信托、喜马拉雅基金会和其他组织提供持续支持。


  ### 高等教育


  希拉里希望夏尔帕人在所有领域接受培训。20 世纪 70 年代，新西兰政府派遣六名夏尔帕去新西兰接受公园和自然资源管理的研究生培训。他们都回了，其中三人相继被任命为萨加玛国家公园（Sagarmatha
  National Park）的主管——该公园于 1977 年设立，涵盖整个昆布。他们开明的公园管理遗产延续至今。


  希拉里意识到，外国游客的慷慨导致了依赖文化。“如果人们想帮助夏尔帕人并表达对他们的爱，”他建议道，“我总是建议他们为整个社区贡献，而不是针对个人。”他发现，最可持续的项目是那些夏尔帕人投入自己时间和精力的项目，使事业实际上成为他们自己的。


  幸运的是，学校和教育到达昆布时，正值夏尔帕人需要工具来应对即将席卷而来的社会经济转型。


  昆布的现代时代从实际上说是在尼泊尔以外的 20 世纪 20 年代和 30 年代开始的。丹增·诺尔盖和他的侄子那旺·甘布是第一批和第二批前往印度卓吉寻找机遇的夏尔帕人成员。在
  1950 年尼泊尔首次对外国人开放之前，所有的珠峰远征队都经过印度和西西姆，然后进入西藏，从北侧接近山峰。






  1953 年，埃德蒙·希拉里和丹增·诺尔盖成为首批登顶珠穆玛峰的登山者。不久后，希拉里创立了“喜马拉雅信托基金”（Himalayan Trust），用于建造学校和医院。1956
  年，小学生们用粗糙的木笔和红沙学习字母。今天，该基金受到的西方影响——从纸笔到服装——随处可见。


  迁移到达卓季隆的夏尔巴人实际上留下了他们勉强维持生生的牧民——昆布同亲。他们正通往一个商业化和货币化领域的快速通道，而这个领域是由外国登山者——“老爷们”（sahibs）掌控的。在上世纪中叶的几十年里——即
  1920 年到 1980 年——社会地位向上流动的达卓季隆夏尔巴人在新旧世界之间舒适地穿梭。他们的昆布同亲对他们很礼貌，但对这种似乎对达卓季隆夏尔巴人的偏袒感到不平。（从那以后，昆布夏尔巴人在社会经济地位上已经超过了他们，尽管这种微的裂痕持续至今。）


  夏尔巴文化的转变在 20 世纪 60 年代初加速。特别是在`1963 年美国珠穆玛峰远征`期间，夏尔巴人和美国人都共同经历了了某种天真的丧失。美国人对夏尔巴人的慷慨和幽默感到困惑，对他们的生活方式如何与环境和谐相处感到惊讶。夏尔巴人同样对那些挥霍无度且精通技术的异国西方人感到震惊。在珠穆玛峰的阴影下，东西方交汇。


  在一个当时未被注意到的里程碑事件中，吉米·罗伯茨和一位名为`尼玛·丹增`的夏尔巴人继承了`1963`年远征的轻型装备。次年，罗伯茨注册了一家名为“登山旅行”（Mountain
  Travel）的公司——为尼泊尔和夏尔巴人创造了一个全新的、被称为“徒步”的行业。这个概念最初并没有被很好理解，但在十年内，已有超过`10,000`人来到喜马拉雅“徒步”。有更多的人随其后，夏尔巴人也适应了基于导游、提供食物和住宿的新生计。夏尔巴人随后开设了数百家这样的徒步公司，以及更多上百家旅馆。现在，每年有至少`25,000`外国人徒步昆布地区，而通往珠穆玛峰的路线提供了可靠的卫星电视、手机信号和八页版的餐厅菜单。


  ## 夏尔巴人的浪漫化


  关于夏尔巴人的学术研究比比胶。当`63 年美国登峰者``吉米·莱斯特`在`1998`年回到尼泊尔时，他的向导告诉他：“当你`35`年前来这里时，每位登山者都有自己的夏尔巴人。现在，每个夏尔巴人都有自己的人类学家。”有些人研究了夏尔巴人与西方人之间的关系，这种关系充满了迷恋、羡慕和浪漫想象。昆布的游客通常将他们的徒步或登山描述为改变生活的经历，而他们的当地东主是这种体验的关键要素。夏尔巴人勇敢地遵循了从“高贵的野蛮人”到“文艺复兴人”的自然演变，在不到两代人的时间内跨越了惊人的文化跨度。


  在尼泊尔更广泛的民族和社会阶级中，夏尔巴人（直到最近）一直被视为二等公民。与西方人的接触以及徒步收入为他们提供了向上和向外发展的新颖机会，许多人实际上已经跨越了定义尼泊尔其他地区的社会经济结构。神奇的是，这个微小的少数民族在众多规模更大的族群中声名在外。


  ## 风险行业


  历史学家奥德丽·萨尔凯尔德强调，夏尔巴人在珠穆玛峰失去的生命付出了不成比例的高昂。`1922`年，七位夏尔巴挑运员被埋在珠穆玛峰北脊的雪崩中；`1974`年，有六人被`西谷`（Western
  Cwm）的雪崩冲走。在珠穆玛峰登山的前`70`年里，`53`名尼泊尔和印度夏尔巴人遇难——超过该时期登山死亡总人数的三分之一。由于他们在固定路线和运送物资方面的贡献，特别是在`昆布冰川`处，夏尔巴人暴露在比雇主更危险的山区域。现在，远征队被为进入冰川的每个夏尔巴人携带一份`$4,000`的人寿保险单。


  如果夏尔巴人在珠穆玛峰去世，尸体会被带往海拔`15,000`英尺处名为`Chukpo Lare`（“富人的牛圈”）的低矮脊进行火化。大多数远征队的夏尔巴人都有在这里火化或纪念过的亲属，他们总是会停下来为他们的灵魂祈祷。


  “登山很刺激但很危险，”一位名叫`拉帕`的年轻夏尔巴人说。“最好留给年轻单身。除非我们以某种方式无私地行动或拯救他人，否则登山并不能增加多少精神功德。”像许多人一样，`拉帕`计划建造一家旅馆，并投资徒步业的“规模化”——业务端。


  # 声音


  ### 通过管理公园保护文化


  自从我小时候以来，我在尼泊尔看到了很多变化。我们过去有一种简单的传统生活方式。森林完好无损。没有外人的打扰。但当希拉里在`1953`年登顶珠穆玛峰时，一切都改变了。游客的涌入给当地人口带来了压力，那里只有`3,500`夏尔巴人。这种压力不仅是环境的也是文化的。这就是为什么我选择学习公园管理。


  将文化与环境联系在一起是一个强有信息。为了保护文化和环境，建立对双方都有利的系统至关重要。我认为做到点的最好方法是确保当地人对自己的资源拥有感和所有权。


  ## 更多的游客


  在`1966`年到`1970`年之间，游客人数增加了四倍达到`46,000`人，到`1976`年超过了`100,000`。自从`1997`年以来，每年入境游客平均远高于`400,000`。这些游客中超过一半前往保护区。


  昆布地区的旅游产生了广泛的影响。随着北部边界的关闭，夏尔巴人与西藏的世纪贸易被旅游和国际登山远征取代，成为现金收入来源。旅游创造了新的工作和机会；通过更好的医疗、教育和基础设施提高了当地社区的生活水平。


  在不利方面，旅游业在加速山区环境问题方面负有很大责任。珠穆玛峰地区徒步和登山产生的垃圾构成了严重的环境问题，并引起了广泛关注。这不仅仅是一个审美问题，还涉及环境污染——尤其是无节地丢弃旧电池和不可生物降解废物。


  ### 公园保护文化


  我们有九座国家公园，其中八座由军队管理。在`马卡鲁-巴伦国家公园`，我们反其道而行之——我们只雇佣社区人员。由于他们来自那里，他们对该地区有丰富的知识。我们发现，如果将盗猎者的子女招入童军计划，就可以停止盗猎。突然之间，每个人对他们想要保护的公园都有了利益。


  通过`山地学院`（TMI），我们对当地社区的目标是提供可行的范例。我们要求社区在社区咨询中列出需求：学校支持、基础设施等等。然后我们帮助他们看到，要获得什么就必须努力并探索选择。我们唯一做的就是引导他们。这样他们未来就有动力采取行动了。


  我在`2003`年开发了一个名为`圣地小径`的概念。与其让所有游客像他们 15 年前的《孤独星球旅行指南》中写的那样，简单地在`南切`和`腾波切`之间往返，我希望所有社区都有机会从旅游中获益。为了取得成功，我们需要考虑项目的每一个方面。






  # 安·丽塔·谢尔帕


  大山学院（The Mountain Institute）尼泊尔项目高级项目经理安·丽塔·谢尔帕（Ang Rita Sherpa）致力于生态旅游和可持续发展。


  ## 过去的生活


  1963 年，谢尔人的生活与现在完全不同。“大多数谢尔人一年只洗一次澡——在季风开始时，在被称为 `Maal-chu` 的两周期间，”现住在怀俄俄明的桑格·多杰（Sange
  Dorjee）回忆道，“在夏季节庆之前，我们会洗掉所有的东西——衣服、个人用品以及我们的身体。这有一种极佳的净化作用。” `Maal-chu` 之后是 6 月的
  Phang-ngi 节——那时，`naks`（雌牦）和牛牦杂交后产生最丰富、最美味的牛奶，这些牛奶被搅拌制成 `phangmar`，一种极其丰富的黄油。


  来自南姆切的坎恰（Kancha）是 1953 年和 1963 年珠穆朗玛探征的老兵，他曾带领牛队前往西藏进行过无数次贸易之旅。从那以后，人和物的流向发生了反转。“谢尔人过去忍受痛苦从西藏人那里赚一点小钱。现在，贫穷的西藏商人翻越南帕拉山口，从我们这里赚一点小钱。”但昆布地区与西藏高原之间的贸易可能进入了长期的衰落。谢尔人可以从印度获得所需的所有（碘盐）。而西藏人也通过铺筑好的道路与西藏其他地区以及中国相连。


  无论如何，昆布的牦牛数量已无法组成一支贸易队。“牦牛”一词曾是“财富”的同义词，拥有最多牦牛的家庭是昆布最富有、最受尊敬的人。情况发生了根本性转变，他们现在成了最穷的人。那些需要牧牦牛的年轻人意识到，外国游客比牲畜更好照顾，而且游客不需要全年都受到关注。


  “谢尔人担心有一天会到来，我们不再养牦牛了，”安·丽塔说，“在我年轻的时候，我所在的村庄——库姆江——有 16 户人家养牦牛。现在只有三户了。” 现在为了季节性负重或牛奶而养牦牛已不再有利。大多数牛奶现在来自昆布境外；人们更倾向于来自荷兰和丹麦的奶粉。


  许多年轻谢尔帕已经忘记了——或不愿谈论他们的部落语言。在城市的谢尔人家庭中，尼泊尔语、英语和印地语的使用频率正变得比母语谢尔语频繁。文化以及对文化的依恋依然强大，但机会和分心也同样如此。部分程度上通过电影和卫星电视，谢尔帕青年见证了非凡且迷人的新世界。这些富饶土地的存在，已通过新富亲戚们讲述的向西方远征的故事得到了证实。


  教育和财富意味着，许多谢尔人可以雇佣低地人耕种农田并收割大麦和土豆。他们不再需要背负货物、导游，甚至不需要经营自己的登山客栈。他们越来越多地将路边的客栈租给莱族（Rai）、塔芒族（Tamang）和古隆族（Gurung）等族群低地人——其中许多人非常乐意安静地采纳高贵的“谢尔帕”姓氏作为自己的姓。


  ## 面临的挑战


  在一种缓慢撕裂他们文化结构的发展中，谢尔人面临着向外部人士出售家族土地的压力。尼泊尔禁止在土地出售中歧视，因此谢尔人被迫接受合理的报价。然而，在这种背景下，保护谢尔人的文化遗产是困难的，因为低地人与神灵灵化的景观、山谷的圣地，或是世代世代守护的森林和牧场没有历史联系。


  现代生活引入了现代挑战。库隆德的前医生纳加旺·卡尔桑（Ngawang Karsang）将当前的一些疾病和苦恼与变化的社会经济状况联系起来。


  “在 20 世纪 60 和 70 年代，酒精中毒很常见，”他说，“探险谢尔人会在出发前喝酒以壮胆，然后在探险结束后喝酒以庆祝。”然而，最近他注意到肥胖、糖尿病、心脏病、高血压和中风的发病率有所上升。包装加工食品已进入了昆布——事实上，进入了许多喜马拉雅的山谷。


  ## 保护谢尔人的传统


  一些谢尔帕对这些传统的流失感到担忧，并付出了值得赞的努力来保护它们。前公园护林员拉帕·诺布（hakpa Norbu）写了一本书记录谢尔帕的仪式和物质文化，他正与腾波切喇嘛（Tengboche
  Lama）合编一本谢尔帕语字典。同样，一位名叫拉帕·索南（Lhakpa Sonam）的年轻人将一座配备有原始铜器和木具的传统房屋变成了博物馆——尽管许多类似的房屋仍在使用中。其他谢尔帕还建立了基金和基金会，为保护纪念碑提供支持。


  与此同时，在日本的一个村庄里，五位谢尔帕木匠建造了一个塔辛杜寺庙（Takshindu monastery）的复制品；腾波切喇嘛和他的僧侣前往那里主持建筑仪式，并表演传统的
  Mani Rimdu 舞蹈剧仪式。


  几十年来，昆布一直保持着脆弱的文化和环境平衡。但 20 世纪 40 和 50 年代荣普寺的主持者故楚尔吉仁波切（Trulshig Rinpoche）很久以前预言，许多注意力将集中在珠穆朗玛峰上，人们将“因为在她周围产生的负业而遭受痛苦”。腾波切喇嘛也暗示，直升机的噪音和废气会干扰隐谷的神灵，从而导致灾难。直升机和飞机坠事故发生的频率更高——尽管这可以归于航空流量的大幅增加。


  然而，土地和人民具有惊人的韧性。一些深切尊重佛教传统的人也认为，喇嘛们的保守在现代社会已经过时。与此同时，寺庙从旅游业和新企业产生的财富中获益。令人惊讶的是，过去几十年，出僧和出尼的数量并没有减少。


  ## 美国的谢尔帕


  第一批访问美国的谢尔帕是参加了由国务院赞助的友好访问，该活动附带在 1963 年美国珠穆朗玛探征之后。这五位充满好奇的高海拔谢尔人在白宫开始了他们的旅行，肯尼迪总统在那里授予了他们（以及美国团队成员）《国家地理》杂志哈巴德奖。


  一代人之后，1963 年一些谢尔帕的后代已定居美国，并在那里生活良好。通常，谢尔帕首先降落在纽约的皇后。他们开出租车、洗碗或加油——这是在由雄心和努力构成的社会经济阶梯上的入门工作。现在有越来越多的人担任商业飞行员、医生和商人。


  珠穆朗玛峰为谢尔帕提供了一个极高的起点。但很少有人回到尼泊尔，因为那里仍饱受不稳定的政治和商业环境的影响。随着自然资源和旅游资源丰富的喜马拉雅出现新机会，这种单向移民的趋势可能会反转。


  已经有少数谢尔帕质疑搬到美国是否是正确的选择。“我认为我们中有些人正变得太像美国人了，”杰克逊高地的居民达雅·扬吉·谢尔帕（Daya Yangji Sherpa）说，“现在谢尔人之间也发生离婚了——这可能变得非常痛苦且昂贵，律师不断介入。这太疯狂了。”






  为了应对在美国生活面临的特殊挑战——其中许多是财务方面的——一群海外的夏尔帕人购买并翻新了皇后的一座教堂。这里设立着一个名为“夏尔帕基杜格”（Sherpa Kyidug）的社会福利组织，为美国夏尔帕人提供了一个聚集地（在线和在皇后）以及文化支柱。（据说“基杜格”是
  `kyi` 快乐和 `dug` 痛苦的结合——指的是婚礼和葬礼，这些是美国夏尔帕人聚集在一起的主要里程碑事件。）尽管如此，一些长者和中年人仍谈论回到昆丹布地区退休——而不是在异国他乡去世。


  ## 交易之地


  青·德罗玛（Ching Drolma）是一家南姆切巴扎（Namche Bazar）的客板，笑容热情。像许多中年夏尔帕女性一样，她曾是一名兼职农民和牦牛牧民，现在每天日夜地忙于徒足者的需求。当她用木槌用力敲击一块公水牛肉——将其拍松成形状以做成“牦牛肉”牛排时——她停了下来。脸上露出了喜悦的微笑。


  “我有一个主意，”她欢快地宣布，“你们这些美国人似乎喜欢我们的山、我们的房子和文化。为什么你们不都来这里住在我们的房子里——而我们都去美国住在你们的房子呢？”


  ![](img/Anke_9781426212413_epub_023_r1.jpg)


  大营的夏尔帕人在工作了一整天支持登山者后看电影时，脸上充满了笑容。夏尔帕人登顶人数比其他登山者多，而且他们更有可能多次登顶。这种想法以前被提过，但每次总是能引起大家大笑。然而，这一次，她是认真的。她正在分享一种认知：我们所有人都是全球社区的一部分，几乎没有不可逾越的边界。她还强调了我们是如何如何倾向于理想化对方生活的世界的。


  ## 声音：女神的礼物


  站在珠穆玛玛的 `lhap-so`——我们在大峰大营搭建的临时佛教神龛前，我感谢居住这里的女神米约朗朗桑玛（Miyolangsangma）欢迎我进入她的家。然后，我向上穿过冰瀑，在二营与探险队的成员会合。在越过深邃冰缝的梯子上跳跃时，我注意到五月下旬的阳光下，冰钉正在松动。在珠穆玛峰上，阳光既是祝福也是诅咒。阳光的温暖备受欢迎，但它会导致冰雪融化。巨大的冰塔崩塌，悬冰岩发生雪崩，尖峰倒塌。


  我们花了几乎八周时间等待登顶窗口，这是我经历过最长的延迟。登山者失去了体重和肌肉力量，他们越来越多地谈论天气模式的变化和全球变暖。也许米约朗桑玛厌倦了扮演常年东道主，需要休息一下。


  对于夏尔帕人来说，米约朗桑玛是食物和财富的传统供应者。但通过允许我们攀登珠穆玛峰，她带给我们的不仅于此。她给了我们人民教育、医疗和工作机会，并让我们开阔眼界，看到山谷之外的世界。没有她的祝福，没有登山探险，我们将一直孤立在昆丹布的村庄里，几乎没有改善未来的手段。


  ## 多变的女神


  在二营，我听到了未来几天的登顶天气预报：50 英里的风、雪，以及零下 20 度的风寒。我们的探险队成员还需要两天的攀爬才能到达冲顶位置，考虑到天气预报，看起来并不乐观。然而，米约朗桑玛经常改变主意。


  两天后，我们爬到了南脊，即四营，这是登顶前的最后一个驿站。团队成员在被寒冷风吹得几乎扁平的帐篷里辗睡不安，而我望向窗外，看着云层像海浪一样在我们下方的山峰间破碎。这是一个冷酷而无情的夜晚——是我在山上见过最糟糕的夜晚。日落后几小时，风平息了——稍微地——我的团队以及其他探险队的登山者离开四营前往顶峰。


  我向米约朗桑玛祈求指引，能听到前僧侣达瓦（Dawa）透过氧气罩传出的闷闷的吟唱声，他也请求许可继续。1990 年，当我第一次和老牌登山者罗布·霍尔（Rob Hall）、加里·鲍尔（Gary
  Ball）和彼得·希拉里（Peter Hillary）一起攀登珠穆玛峰时，米约朗桑玛欢迎我进入她的怀抱。然而，她的邀请是暂时的。


  坐在“阳台”（The Balcony）上，决定继续向上还是返回的责任沉重地压在我身上。扬吉（Yangji）曾敦促我和朋友约翰一起参加这次探险，为了“确保他的安全”。现在我陷入了犹豫不决——因为觉得米约朗桑玛可能会撤回她的邀请。


  仿佛感觉到了我的困境，约翰轻轻地向我伸出手说道：“阿帕（Apa），你好吗？你觉得暖吗？”风带走了他的话，但我从他的眼睛里看到他感觉很强，准备好继续前进。我们将继续前往南峰，如果情况没有好，我们就返回。


  在阳台上方两小时，琥珀色的黎明揭示了珠穆玛峰三角形的影子延伸到西平线——那是米约朗桑玛的欢迎垫。现在很清楚，我们是受邀的，而不是入侵者。


  约翰、达瓦和我登上了裸露的坡面到达南峰，在那里我们再次更换了氧气瓶。我们爬过希拉里台阶，穿越了最后的雪地丘，在 5 月 31 日早晨 6:35，约翰、达瓦和我站在了顶点。我再次感谢米约朗桑玛。然后我们三人开始了回家的旅程：平安。


  ——夏尔帕自 1985 年以来协助西方探险，阿帕·夏尔帕在 1990 年完成了他的 21 次珠峰首顶。


