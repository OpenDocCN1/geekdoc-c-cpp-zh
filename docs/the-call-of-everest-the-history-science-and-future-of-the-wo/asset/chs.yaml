  ### 危险的原因


  要知道的最重要的一点是，登山涉及风险。如果我们去山却忘记风险的存在，我们就会犯错。山是危险的！但只有当人在那里时，它才是危险的。山就是山。它只是存在。它是一块岩石和冰，也许是一块美丽的，但只有当我们在那里时，它才会变得危险而美丽……


  危险是一个过滤器，阻止人们去可能不该去的地方。危险与管理恐惧、获得经验和学习来贵的教训有关。如果不自己做决定，不对自己的行为承担责任，我们就无法学会成就大业。


