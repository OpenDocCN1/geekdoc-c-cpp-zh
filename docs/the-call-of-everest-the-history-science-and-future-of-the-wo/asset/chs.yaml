  一名登山者在珠穆朗玛北侧的东绒布冰川上巨大的冰塔前行走。


  ## 几十年的变化


  在 20 世纪 70 年代和 80 年代，昆布地区经常被用作土地管理不善的案例。当时的科学和科普文章宣称，该地区正遭受着严重的森林砍伐，这归因于人口增长、20
  世纪 50 年代初藏族难民的涌入、增加且不受监管的旅游业，以及传统谢尔人自然资源管理实践的崩溃。一位被广泛引用的人类学家在 1975 表示：“村庄附近的森林已经遭到严重枯竭，特别是在南切巴扎附近，1957
  年还郁郁葱葱的整个山坡现在已寸草不生，村民们不得不去往越来越远的地方收集干柴。” 另一句经常被引用的话是：“在过去的二十年里，（昆布地区）发生的森林砍伐比之前的
  200 年还要多。”


  与此同时，一个规模小得多但声音同样响亮的群体持有完全相反的观点。“现在昆布的树比 1950 年时多，我有照片可以证明这一点，”美国医生、高海拔专家、1953 年
  K2 探险队成员以及 1950 年珠穆朗玛地区首批外国游客之一的查尔斯·休斯顿说道。


  ### 施奈德的记录


  谁是对的？为了寻找答案，我转向经历过的最好的导师之一，顺便说一下，我从未见过他：奥地利登山家兼地图绘制埃尔温·施奈德（Erwin Schneider），他在 20
  世纪 80 年代后期去世。在 1955 年至 1963 年间，施奈德完成了对昆布地区的野外调查，其中包括使用了地面摄影测量技术——通过从高海拔视角拍摄的照片确定物体的几何属性并制作地图。他的相机巨大且沉重，现在收藏于因斯布鲁克斯的奥地利阿尔卑斯俱乐部。他在
  50 多岁时亲自背着这台相机和同样沉重的三脚架，经常攀爬 5,500 米以上的半技术性山峰和岩脊以拍摄一张特定的风景照片，当我得知施奈德在 20 世纪 30 年代曾是奥地利顶级登山家之一时，这并不令人意外。


  1984 年，当住在昆布时，瑞士地质学家丹尼尔·武伊沙尔（Daniel Vuichard）给了我包施奈德在 20 世纪 50 年代拍摄的照片。我立刻意识到这些照片提供了一个通往过去的宝贵窗口，可能有助于解决关于自那时以来景观变化的争议。当时我并不知道在在后的
  30 年里，我将追随施奈德的足迹，复制他拍摄的村庄、山景和冰川照片。


  在 1984 年的空闲时间，以及在 1995 年、1999 年、2001 年和 2007 年启动的研究考察期间，我复制了数十张施奈德的照片。通过这种方式，我能够将自己的研究结果加入到景观退化的讨论中。这样，我能够为景观退化讨论增添自己的研究成果。早在
  1984 年，我很清楚查尔斯·休斯顿是对的：南切巴扎上方的山坡在世纪 50 年代是郁郁葱葱的，30 年后基本没有变化。在 90 年代，周围谢尔人村庄和昆布河谷的森林覆盖率事实上正在增加。


  ![](img/Anke_9781426212413_epub_033_r1.jpg)


  南切巴扎，在 1973 年（上）和 2008 年（下）的照片中显示，自谢尔人建造石屋以来已经发生了增长。现在是多层建筑，屋顶布满了卫星天线，这里是珠穆朗玛和昆布山谷的门户。


  ### 重摄影


  复制施奈德、休斯顿等人在 50 年代拍摄的照片，使我能够追踪珠穆朗玛大本营步道谢尔人村庄的巨大增长，包括建筑材料的完全改变。重拍照片还提供了一个独特的机会，来展示该地区景观的动态。通过对比新旧照片，很容易看到期间发生的破坏性冰湖溃决洪水（GLOFs`）、滑坡和洪流。


  ## 变化的冰川


  过去与现在的照片还有其他用途。2007 年秋季，我正在攀登昆布科拉上水区海拔 5,500 米处陡峭且危险的石石阵。组成洛峰（珠穆朗玛的邻近峰）南面的陡峭且广阔的山脊在我面前向上延伸了数千米。由于我的海拔相对较低，珠穆朗玛峰被遮住了。前一天晚上的一场小雪将通常的攀爬变成了半技术性且相当危险的攀登。最后，我意识到在这种情况下继续前进是愚蠢的。我向我的研究助手、两次登顶珠穆朗玛的帕玛·泰玛谢尔人示意停止。我们的海拔位于埃尔温·施奈德为标记照片位置而建造的石堆下方
  100 米，对于目标来说已经足够了。对比旧照片和我眼前的景色显示了短短 60 年间的剧变。我曾希望重拍的昆布冰川消失了，被一个长近半英里的湖泊取代。像房子一样大的冰从从冰川崩落，现在在水中无目的地漂浮。冰川融化了，留下了一个巨大且潜在危险的湖泊。


  ![](img/Anke_9781426212413_epub_034_r1.jpg)


  冰川学家弗里茨·米勒（Fritz Müller）在 1956 年调查并拍摄了珠穆朗玛周围的冰川，为今天研究冰和气候变化提供了关键数据点。在这里，米勒和助手们在
  18,000 英尺（5,500 米）以上的海拔观察珠穆朗玛峰（左侧黑色斜坡）。


  ### 米勒的记录





  去年，我的导师 Jack Ives 给了我一盒由他的朋友兼同事 Fritz Müller 收集的老照片。Müller 是一位瑞士裔加拿大的冰川学家，也是 1956
  年瑞士珠穆玛峰远征队的科学团队领袖。当登山者们回家后，他又多留了九个月，生活在海拔 5000 米以上的地方（这是当时的高海拔记录），并与他的夏尔巴助手一起研究冰川。尽管
  Müller 身体极其强健，但他仍于 1980 年因心脏病发作去世了。在他早逝后的混乱中，他的大部分照片都失踪了，但有一盒被保存了下来，里面全是 35 毫米的接触片。随着时间的推移，我发现那盒箱子里除了笔记、岩拓、标本植物、信件和电报外，还包含了另外两个著名登山登山科学家的照片：查尔斯·埃万斯爵士（Sir
  Charles Evans）和我我的个人英雄埃文·施耐德（Erwin Schneider）。埃万斯是 1953 年英国探险队的副队长，那次探险成功让首批人类登顶了珠穆玛峰——埃德蒙·希拉拉里和丹增·诺尔盖；如果不是氧气系统故障，他可能已经先到达那里了。


  从那以后，人们进行了多次冰川调查，很大程度上是通过卫星图像作为主要数据源完成的。在 2007 年，开展的实地研究极少。考虑到媒体关于珠穆玛峰地区气候变化的种种声明，这让我觉得很奇怪。事实证明，这些研究没有一个是基于实际野外工作，也没有与当地人合作。因此，追溯埃万斯、Müller
  和施耐德的足迹，爬上并跨越冰川到达他们的拍摄点，记录变化的情况，变得更加重要。


  ## 追溯足迹


  找到拍摄照片的地点是第一个挑战。在 Müller、施耐德和埃万斯拍摄照片时，全球定位系统（`GPS`）还不存在，也没有关于他们地理坐标的记录。但我们通常能够通过对景观的熟悉程度、登山向导和牦牛牧人的建议以及运气，找到大多数拍摄点（尽管某些照片的拍摄地点至今仍让我感到困惑）。我还决定，寻找准确位置的黄金法则（特别是对于埃文·施耐德）是永远比我预期的走得更高。对于这些早期的科学家来说，没有什么是“足够好”的，无论到达那里的困难程度，他们总是追求最好的视野。有几个地方由于期间发生的气候相关变化而被证明无法到达。在某些情况下，巨大的冰崩封堵了原有的路径。某些在
  Müller 时代还坚实且健康的冰川，现在正在快速融化，使其攀登变得非常危险。另一两次机会不得不放弃了，因为坦诚地说，埃文·施耐德的登山能力简直比我强得多。


  退缩的冰川和新形成的冰川湖并不是我所研究的唯一变化。我们确定，因姆贾冰川（Imja Glacier）之所以融化得如此迅速，是因为它覆盖着薄薄层——约半米——土壤和岩石（地质学家称之为“碎屑覆盖冰川”）。碎屑在白天升温，并将热量直接传递给下方的冰层。当冰川的前进停止时，就会被碎屑覆盖，这种情况自
  19 世纪末小冰期结束以来在珠穆玛峰地区就开始发生。随着时间的推移，来自山谷和冰川侧石的巨石、岩石、土壤和其他碎屑倾泻而覆盖冰层。非常厚的碎屑覆盖层（带有如小房子般的巨石）倾向于保护它们免受阳光热量的影响。但我们观察到的冰川已经消融，或流失了质量。现在，它们的表面出现了许多新的小型融水池，任何裸露的冰川都融化了。


  海拔 5200 米以下的几十条较小冰川完全消失了。它们的海拔较低且缺乏保护性的碎屑覆盖，显然使其更容易受到该地区变暖趋势的影响。然而，海拔 7000 米以上的冰似乎保持相对稳定，因为那里的温度在大部分时间里保持在冰点以下。这些高海拔且朝北的冰层和冰川在过去的
  60 年里似乎变化不大。较温暖的南向地区往往显示出更多的融化和冰流失迹象，然而珠穆玛峰北侧的冰川融化得更快，部分原因是北侧接收的年降水量少得多。


  总之，我亲眼发现了气候变化正在发生，即使在世界上最高的山脉也是如此。冰川正在融化，新的湖泊正在形成，雪线正在向更高海拔移动，天气模式正变得不可预测。


  ## 冰川湖溃决（GLOFs）


  人们对这些变化对印度库什-喜马拉雅地区未来水供应的影响，以及冰川湖溃决可能增加表示担忧。与因姆贾一样，自 20 世纪 60 年代初以来昆布地区形成了几十个含有数亿加仑水的新冰川湖。这些湖通常由松散的岩石和土壤组成的坝体拦截，面临冰川湖溃决的风险，这种风险由湖面积迅速扩张、渗透、水位变化以及岩崩、岩滑坡或冰崩引起的涌波引发。冰川湖溃决释放储存的湖水，通常会对下游造成巨大破坏，包括高额死亡人数，以及对珍贵农田和水电设施、道路及桥梁等昂基础设施的破坏。例如，萨加玛塔国家公园
  1985 年的朗姆切溃决，摧毁了刚刚完成的价值两百万美元的塔米水电站、下游数百英亩的农田和数十座桥。1998 年尼泊尔马卡卢-巴伦国家公园辛库谷的塔玛波卡哈里（Tama
  Pokhari）溃决，破坏了下游 50 多英里的路径和季节性定居点，这种破坏在十年后的卫星图像上清晰可见。


  ## 变化的文化景观


  正如希腊哲学家赫拉克利特所说，“唯一永恒不变只有变化”，尼泊尔的昆布地区也不例外。在旅游业现象增长的推动下，昆布地区的孤独已发生了 30 年前大多数夏尔巴人无法想象的变化。最引人注目的是房屋、旅馆和商店数量及设计的变化。在
  1950 年至 1973 年间，南姆巴扎（Namche Bazar）是一个由传统的夏尔巴石屋和铺着劈裂杉木屋顶组成的宁静小村庄。现在它布满了专为游客建造的二到三层糖果色的旅馆。每年他们都向这个盆地地形更高的坡处延伸，人们醒来和入睡时听到的都是石工为另一栋旅馆切割建筑石的叮叮当声。对于前往珠穆玛峰大营的主要徒步径上的几乎每个村庄也是如此，包括昆德（Kunde）、昆琼（Khumjung）、腾波切（Tengboche）、德博切（Deboche）、旁波切（Pangboche）、费里切（Pheriche）以及更远的地方。





  随着这些变化而来的还有积极的影响。收入的增加也带来了了健康状况的改善。缺碘导致的肿大在 20 世纪 70 年代初随处可见，但现在已几乎完全消失。夏尔帕人儿童接受了更好的教育，现在有了许多夏尔帕博士、医生、牙医、自然保护主义者和政府工作人员。大多数村庄都通过小型水电站获得了用电，并辅以太阳能驱动的热水器、灯和电池充电器等替代技术。这些设备在没有电的更偏远的高山村庄中特别受欢迎，例如菲里切（Pheriche）、丁波切（Dingboche）和楚贡（Chukung）。丁波切甚至有了太阳能网络接入。高山地区的客栈在
  2004 年改用煤油作为燃料燃料，这导致了脆弱的高山生态系统的迅速恢复（该项目由国家地理学会于 2005 年和 2007 年共同资助）。得益于埃德蒙德·希拉里爵士和喜马拉雅信会，该地区有了学校、诊所和跑道——这是希拉里感谢夏尔帕人帮助他实现了“我所认为最有意义的成就”的方式。


  但积极影响也伴随着消面影响。由于没有分区制度，客栈的数量每个季节都在增加。每年，客栈主以吨为单位进口罐装和瓶装货物。这些容器最终出现在每个村庄外的填埋场，因为那里没有回收系统，也没有采取其他做法的动力。仅珠穆玛大营每年就产生五吨固体废物。人类粪便和污水直接排入附近的淡水溪流，污染了下游数千名居民的用水。徒步者越来越多地抱怨，在昆布河谷上部的大营徒步径途中感染了肠道疾病，这可能是由于污水处理不当造成的。挑夫们使用大型蓝色塑料桶将数吨的人类粪便运到距离大营南面约两小时路程的地方。在那里，粪便被倾入大坑中，其中一些坑位于季节性河床内。


  # 声音：观察昆布地区的变化


  我叫夏尔帕·江布布（Sherap Jangbu）。我于 1954 年出生在南姆次巴（Namche Bazar），那是通往珠穆玛峰（Chomolungma）的大门。那是在尼泊尔的丹青·诺尔盖·夏尔帕（Tenzing
  Norgay Sherpa）和新西兰的埃德蒙德·希拉里爵士首次登顶珠穆玛峰整整一年后。


  我 58 岁了，已婚，妻子美丽的拉帕·多玛（Lhakpa Doma）。我们有一个大儿子和一个女儿，而且很幸运有两个孙子：一个是来自儿子明玛（Mingma）的塞尔青·旺秋楚（Tsering
  Wongchu），另一个是来自女儿丽塔（Rita）的塞尔青·帕尔乔尔（Tsering Paljor）。


  南姆次巴是昆布地区主要的贸易点。所有去珠穆玛峰远征、在该地区徒步或前往西藏进行贸易的人都会经过南姆次巴，因为建议你先在这里留宿两个晚上以适应海拔。在南姆次巴，我们有从豪华酒店到客栈的一切设施，以满足各种游客的需求。


  据我记忆，我第一次看到“米克卡鲁”（Mik Karu，我们对白人或外国人的昵称）是 1963 年，那是美国首次成功攀登珠穆玛峰的日期。我的叔叔尤拉·塞尔青（Yula
  Tsering）就在那个队伍中。


  那时，只有少数探险队来到珠穆玛峰，完成一次探险至少需要四到五个月，或者徒步至少需要两个月，因为他们必须从加德满步行到珠穆玛峰再回来。1964 年，埃德蒙德·希拉里爵士在卢克拉（Lukla）建立了一个小型机场。这缩短了徒步和探险的时间，因此从
  70 年代开始，游客流量增加了。


  **夏尔帕·江布布·夏尔帕（SHERAP JANGBU SHERPA）** 昆布地区的终身居民，他负责组织并带领贯穿于整个珠穆玛峰地区的徒步活动。


  ![](img/Anke_9781426212413_epub_035_r1.jpg)


  尼泊尔乔拉山口（Cho La）的山顶，经幡营造了一道彩虹色。在前往珠穆玛峰的路上，这座海拔 17,780 英尺（5,420 米）的山口提供了喜马拉雅山的壮丽景色。


  # 珠穆玛峰景观的未来


  这座世界最高峰在积极和负面变化的交织下，未来将何如何？随着新一代富有的探险游客寻求通往山上的新且更原始路径，卡玛谷的旅游可能会增加，他们会避开昆布珠穆玛峰大营途中日益拥挤的徒步游客、牦牛、牦和挑夫。山的北侧确实可能像中国官员威胁的那样关闭，给脆弱的景观一个愈合的机会，并给技术人员时间清理几十年来积累的垃圾、帐篷、氧气瓶，以及遗憾的尸体。


  昆布河谷的命运更为复杂。它在很大程度上取决于未来的全球经济、尼泊尔的政治稳定，以及夏尔帕社区对当前变化过程所做的决策。石油禁运、燃料和旅行价格，以及衰退和萧条显然会导致游客人数的起伏。一些户外杂志建议读者尽早去尼泊尔，因为政治动荡可能再次导致该国长期对外国人关闭边界。


  但抛开世界经济和国家政治不谈，考虑到日益拥挤和不安全的健康状况，昆布还能作为一个令人向往的地方存在多久？村庄和沿途的固体和人类废物沉积是否会达到一个让人变得不愿光光的程度？


  简单的答案是？不太可能。正如许多人所说，“世界上只有一个珠穆玛峰”，这一事实可能会吸引后代的登山者、徒步者、科学家、电影制作人、神秘主义者、学者、教师、发展专家以及寻求刺激者。夏尔帕人自己面临着前所未有的问题。随着越来越多的人搬往加德满或纽约，他们传统的流失也伴随着人数的减少。但如果夏尔帕人一个世纪展示了一个什么特质，那就是他们的适应能力，在机会出现时识别它们，并解决看似不可逾越的问题。


  那么这山本身呢？它也展现了非凡的适应能力。珠穆玛峰经历了人类扩张、冰期和间冰期的席卷、动植物在山坡上的缓慢迁移，以及过去 60 年来农民、牧民以及探险游客对它的发现。珠穆玛峰将继续在云雾中屹立，时间远超人类的记忆。


