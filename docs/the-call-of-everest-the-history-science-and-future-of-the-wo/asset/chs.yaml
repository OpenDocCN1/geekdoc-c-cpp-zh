  ## 无氧


  传闻意大利登山者雷因霍德·梅斯纳（Reinhold Messner）和奥地利人彼特·哈贝尔尔（Peter Habeler）在 1975 年未使用辅助氧气的情况下登顶巴基斯坦的乔戈峰峰（26,469
  英尺/8,068 米）回家的途中，他们用杜士忌汽庆祝了自己的成功，并宣布：“为了珠穆峰——无氧！”三年后，他们刻苦训练，为了快速高效地攀登珠穆峰，尽可能缩短在海拔
  8000 米以上停留的时间。尽管哈贝尔尔对在攀登过程中放弃 `O[2]` 感到顾虑，但梅斯纳仍然坚定不移。为了节省呼吸，他们在雪地上互相刻字传递信息，而不是说话。有一次，哈贝尔尔刻的箭头指向下方，梅斯纳刻的指向向上。梅斯纳在后来的《终极远征》（*Expedition
  to the Ultimate*）中回忆起那艰巨的：“我只不过是一个狭窄的、喘息的肺，漂浮在云雾和山峰之上。”当他们到达顶部时，哈贝尔尔已经接近了他的极限，简直令人恐惧：“这是一次非常个人化、孤独的胜利，我们每个人都在独自战斗……尽管我内心欣喜若狂，但身体已经完全精疲力竭。”


  许多人认为他们大脑会因为缺氧而坏掉，但他们在下降时看起来非常清醒。大营的夏尔巴人对他们做到了这一点感到震惊。事实上，攀登结束后，加德满发生了一段奇怪的情况：一群夏尔巴人召开了发布会，指责梅斯纳是骗子。他们不相信他无氧登顶的说法，声称他在羽绒服下藏了小瓶氧气。如果他们做不到，就没人能做不到。


  同年，波兰登山之母——旺达·鲁特基维茨卡（Wanda Rutkiewicz）——也是整个喜马拉雅女性登山者的榜样，成为首位登顶珠穆峰的欧洲女性和首位波兰登山者。这位美丽、自信且野心勃勃的登山者由于与队友之间的某些不愉快，讨厌攀登过程中的每一个时刻，她此归咎于男性沙权主义。但她胜利的顶点时刻弥补了艰辛，她历史性的攀登恰逢教皇保禄二世的晋铎日，那是波兰在天主教历史上最伟大的时刻。


  一年后，另一个东欧阵营取得了胜利：由“南斯洛维亚的克里斯·邦宁顿”通·斯卡雅（Tone Skarja）领导的一支强大的南斯洛维亚团队在攀登整个西脊直线路时取得了突破。团队从未偏离实际山脊，在海拔
  8000 米以上的悬崖上攀爬——这是到目前为止珠穆峰上最难的技术攀登。安德烈·什特雷费尔日（Andrej Štremfelj）和内耶茨·扎普特尼克（Nejc Zaplotnik）完成了这条历史性路线，并从霍恩贝因冰槽下降。他们的攀登标志着南斯洛维亚（后来的斯洛文尼亚）作为喜马拉雅登山强国的崛起。


  ## 冬季的珠穆峰


  偶尔，一位远见者会将目光转向珠穆峰。在 1979-80 年冬季，那位远见者是安德烈杰·扎瓦达（Andrzej Zawada），波兰最有魅力的远征队队长。扎瓦达已经在昆仑库什山成为高海拔冬季专家，并几乎在冬季登顶过洛峰。然而，尚未没有任何
  8000 米级高峰在冬季被登顶，扎瓦达瞄准了珠穆峰。尽管有焊接护目镜保护眼睛，有自制设备抵御严寒和狂风，当许可证在 2 月中旬到期时，他的团队还没有将登山者送上顶。随后，扎瓦达成功争取到了额外的两天，最年轻的两人——克热什托夫·维尔利茨基（Krzysztof
  Wielicki）和莱谢克·齐希（Leszek Cichy）在 2 月 17 日到达了顶点。全波兰为之欢呼。


