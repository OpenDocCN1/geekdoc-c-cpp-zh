- - '###'
  - 珠玛峰的未来如何？每年，登山者、客户和向导的支持都会不断改进，团队领袖之间的合作与沟通也将加强。一些向导服务将提高成功率，提高运营效率，并增加对客户优缺点的熟悉。但许多不会。
- - '###'
  - 会达到突破点吗？2012 年 5 月在洛子峰壁拍摄的一张照片显示，156 人从海拔 23,000 英特的三营出发，前往海拔 25,900 英特的南柱，他们并肩排成一排向上涌动。这座山及其热门路线能承受这些人数吗？登山者和客户会开始远离这种让他们陷入“康加舞队列”的体验吗？我认识一些登山者在黎前的黑暗中登顶了，尽管他们在山顶看到的视野非常模糊。为什么？他们晚上
    8 点就离开了高海拔营地以避开人群。
