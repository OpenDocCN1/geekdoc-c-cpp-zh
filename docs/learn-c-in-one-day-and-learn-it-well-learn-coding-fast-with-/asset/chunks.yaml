    \ variable as second:![](image_rsrcYP.jpg)\n\n## 1.19 Conditions and If Statements\n\
    From mathematics, the usual logical conditions are supported by C++:![](image_rsrcYR.jpg)\
    \ To perform different actions for different decisions, these conditions can be\
    \ used. The following conditional statements are supported by C++:![](image_rsrcYS.jpg)\n\
    \n### 1.20 The if Statement\nTo specify a block of C++ code to be executed if\
    \ a condition is `true`, the `if statement` is used.![](image_rsrcYT.jpg)![](image_rsrcYU.jpg)\n\
    The example below tests two values to find out if 20 is greater than 18. If the\
    \ condition is `true`, print some text:![](image_rsrcYV.jpg)\n\n**Example explained**\n\
    The example above uses two variables, `y` and `x`, to test whether `y` is greater\
    \ than `x` (using the `>` operator). As `y` is 18, and `x` is 20, and its known\
    \ that 20 is greater than 18, The screen prints \"x is greater than y\".\n\n###\
    \ 1.21 The else Statement\nTo specify a block of code to be executed, the `else\
    \ statement` is used, if the condition is `false`.![](image_rsrcYW.jpg)\n**Example\
    \ explained**\nThe example above, `(time > 18)` time is greater than 18, so the\
    \ condition is `false`. Because of this, the `else condition` in introduced, this\
    \ print to the screen \"Good evening\". If the time was less than 18 `(time <\
    \ 18)`, the program would print \"Good day\".\n\n### 1.22 Switch Statements\n\
    To select one of many code blocks to be executed, use the `switch statement`.![](image_rsrcYX.jpg)\
    \ To calculate the weekday name, the weekday number is used in the example:![](image_rsrcYY.jpg)\n\
    \n### 1.23 The break Keyword\nThe C++ breaks out of the switch block, when it\
    \ reaches a `break` keyword. This stops the code execution and case testing inside\
    \ the block. The job is completed if a match is found, it's time for a break.\
    \ More testing is not needed.![](image_rsrcYZ.jpg)\n\n### 1.24 The default Keyword\n\
    Some codes are specified by the `default` keyword to run, if there is no case\
    \ match:![](image_rsrcZ0.jpg)\n\n### 1.25 For Loop\nUse the `for loop` instead\
    \ of a `while loop`, in case you exactly know how many times you want to loop\
    \ through a block of code:![](image_rsrcZ1.jpg)\n**Example explained**\nStatement\
    \ 1 before the loop starts `(int i = 0)`, sets a variable.\nStatement 2 the condition\
    \ for the loop to run `(i must be less than 5)` are defined. The loop will start\
    \ over again. If the condition is true, if it is false, the loop terminates. \n\
    Statement 3 increases a value `(i++)` each time the code block in the loop has\
    \ been executed.\n\n**Another Example**\nThis example prints only even values\
    \ between 0 and 10:![](image_rsrcZ2.jpg)\n\n### 1.26 Break\nThe `break statement`\
    \ has already been used in an earlier chapter of this step-by-step tutorial book.\
    \ It jumps out of a `switch statement`. The `break statement` jumps out of a loop\
    \ . When `i` is equal to 4, this example jumps out of the loop:![](image_rsrcZ3.jpg)\n\
    \n### 1.27 Continue\nThe `continue statement` breaks one iteration inside the\
    \ loop, provided that specified condition occurs, and continues with the next\
    \ iteration in the loop. The value of 4 is skipped in this example:![](image_rsrcZ4.jpg)\n\
    \n### 1.28 Arrays\nTo store multiple values in a single variable, arrays are used,\
    \ instead for each value, declaring separate variables. Define the variable type,\
    \ by declaring an array, specify the name of the array followed by `square brackets`\
    \ and assign the number of elements to be stored:\n```cpp\nstring cars[4 ];\n\
    ```\n"
