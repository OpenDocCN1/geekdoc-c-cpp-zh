    , such as weight and color, and methods , such as drive and brake.Methods and
    attributes basically  are functions  and  variables that associated with the class.
    These are named often as "class members".A class is a user-defined data type to
    be used in our program, and it worked as an object constructor, or a "blueprint"
    to create objects.3.3 Create a ClassUse the  clas s  keyword, to create a class:![](image_rsrcZW.jpg)Example
