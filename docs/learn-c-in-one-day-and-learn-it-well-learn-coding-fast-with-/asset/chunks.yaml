- fmt: "\nTo hold an array of four strings, a variable is declared. To insert values\
    \ to it, an array literal is used - place the values in a comma-separated list,\
    \ inside curly braces:![](image_rsrcZ5.jpg)\n\n### 1.29 Access the Elements of\
    \ an Array\nBy referring to the index number, you access an array element. The\
    \ value of the first element in `cars` is accessed in this statement:![](image_rsrcZ6.jpg)\n\
    \n### 1.30 Change an Array Element\nBy referring to the index number can change\
    \ the value of a specific element:![](image_rsrcZ7.jpg)\n\n### 1.31 Creating References\n\
    A reference variable is a \"reference\" to an existing variable, and it is created\
    \ with the `&` operator:![](image_rsrcZ8.jpg) \n\n### 1.32 Creating Pointers\n\
    From the previous chapter, you learned that we get the “memory address” of a variable\
    \ by using the `&` operator:![](image_rsrcZ9.jpg) To stores the memory address\
    \ as its value, a pointer is used. A pointer variable is created with the `*`\
    \ operator and points a data type (“like `int` or `string”) of the same type.\
    \ The variable address you're working with is assigned to the pointer:![](image_rsrcZA.jpg)\n\
    \n#### Example explained\nBy using the asterisk sign `*` (`string* ptr`), create\
    \ a pointer variable with the name ”ptr”, that points to a “string” variable.\
    \ Note that the type of the pointer must match the type of the variable you are\
    \ working with. To store the memory address of the variable called `food`, use\
    \ the `&` operator, and assign it to the pointer. Now, `ptr` holds the value of\
    \ `food`'s memory address![](image_rsrcZB.jpg)\n\n# Chapter 2. Functions\nA block\
    \ of code which only runs when it is called is defined as a function. In a function\
    \ you can pass data, known as parameters. Functions are performing certain tasks,\
    \ and they are necessarily for reusing code: Define the code once, and use it\
    \ many times.\n\n### Create a Function\nSome pre-defined functions are provided\
    \ in C++, such as `main()`, which executes code. But its possible to create your\
    \ own functions in order to perform certain actions. To create (often referred\
    \ to as declare) a function, specify the name of the function, followed by parentheses\
    \ `()`:(image_rsrcZC.jpg) ![](image_rsrcZD.jpg)\n\n### 2.1 Call a Function\nDeclared\
    \ functions are \"saved for later use\", and will be later executed, when they\
    \ are called. Declared functions are not executed immediately. Calling a function\
    \ can be done by writing the function's name followed by two parentheses `()`\
    \ and a semicolon; In the following example, `myFunction()` is used to print a\
    \ text (the action), when it is called:(image_rsrcZE.jpg)\n\n### 2.2 Function\
    \ Declaration and Definition\nA C++ function consists of two parts:![](image_rsrcZF.jpg)\
    \ ![](image_rsrcZG.jpg) However, the declaration and the definition of the function\
    \ - for code optimization can be separate. You see often C++ programs that have\
    \ function definition below `main()`, and function declaration above `main()`.\
    \ This will make the code easier to read, and better organized:(image_rsrcZH.jpg)\n\
    \n### 2.3 Arguments and Parameters\nInformation is entered into functions as a\
    \ parameter. Inside the function, parameters act as variables. After the function\
    \ name, parameters can be specified, inside the parentheses. If you want to add\
    \ as many parameters as you want, just separate them with a comma:(image_rsrcZJ.jpg)\
    \ In the following example a function takes a `string` called `fname` as parameter.\
    \ When the function is called a first name is passed along, which is defined inside\
    \ the function to “print the full name”:(image_rsrcZK.jpg)\n\n### 2.4 Return Values\n\
    The `void` keyword that used in the previous examples specifies that the function\
    \ cannot return a value. If you want the function to return a value, try to use\
    \ a data type (such as `int`, `string`, etc.) instead of `void`, and use the `return`\
    \ keyword inside the function:(image_rsrcZM.jpg) The result is also stored in\
    \ a variable:(image_rsrcZN.jpg)\n\n### 2.4 Function Overloading\nThe function\
    \ overloading allows multiple functions to have the same name with different parameters:(image_rsrcZP.jpg)\
    \ The following example is having two functions that add numbers of different\
    \ type:(image_rsrcZR.jpg) It is better to overload one, instead of defining two\
    \ functions that should do the same thing. The example below overloads the `plusFunc`\
    \ function to work for both `double` and `int`:(image_rsrcZS.jpg)\n\n# Chapter\
    \ 3. Functions\nWhat is OOP?\n“OOP stands for Object-Oriented Programming”. Procedural\
    \ programming is the functions that perform operations on the data or writing\
    \ procedures, while object-oriented programming is creating objects that contain\
    \ both functions and data. “Object-oriented programming” possesses many advantages\
    \ “over procedural programming”:(image_rsrcZT.jpg)\n\n### 3.1 What are Classes\
    \ and Objects?\nObjects and classes are the two main aspects of object-oriented\
    \ programming. The following illustration illustrates the difference between objects\
    \ and class:(image_rsrcZU.jpg) Another example:(image_rsrcZV.jpg) So, “a class\
    \ is a template for objects, and an object is an instance of a class”. After creating\
    \ the individual objects, individual objects inherit all functions and the variables\
    \ from the class. The next section teaches more about objects and classes.\n\n\
    ### 3.2 Classes/Objects\nC++ is an “object-oriented programming language”. Everything\
    \ in C++ is connected with objects and classes, along with its methods and attributes.\
    \ For example: in real life, a bicycle is an “object”. The bicycle comes with\
    \ attributes such as weight and color, and methods such as drive and brake. Methods\
    \ and attributes basically are functions and variables associated with the class.\
    \ These are named often \"class members\". A class is a user-defined data type\
    \ to be used in our program, and it worked as an object constructor, or \"blueprint\"\
    \ to create objects.\n\n### 3.3 Create a Class\nUse the `class` keyword, to create\
    \ a class:(image_rsrcZW.jpg) Example explained:(image_rsrcZX.jpg)\n\n### 3.4 Create\
    \ an Object\nAn object is created in C++, from a class. the class named `MyClass`\
    \ is already created, so now by using this we can create objects Creating an object\
    \ of `MyClass` is done by specifying the class name, followed by the object name.\
    \ Use the dot syntax `.` on the object, to access the class attributes (`myString`\
    \ and `myNum`):(image_rsrcZY.jpg)image_rsrcZZ.jpg) The following example defines\
    \ a function inside the class, and names it \"myMethod\".(image_rsrc100.jpg) Defining\
    \ a function outside the class can be done by declaring the function inside the\
    \ class and then defining it outside of the class. This is achieved by defining\
    \ the name of the class, followed the scope resolution `::`, followed by the function’s\
    \ name:(image_rsrc101.jpg)(image_rsrc102.jpg)\n\n### 3.8 Encapsulation\nThe idea\
    \ of “Encapsulation”, is to ensure that \"sensitive\" data is kept hidden from\
    \ the users. Achieving this by declaring class variables/attributes as `private`\
    \ (cannot be accessed from outside the class). Providing the public `get` and\
    \ `set` methods helps modifying or reading the value of a private member\n\n###\
    \ 3.9 Access Private Members\nUse public \"get\" and \"set\" methods, to access\
    \ a private attribute:(image_rsrc103.jpg) Example explained the `salary` attribute\
    \ is set to `private` and have restricted access. The public `setSalary()` method\
    \ takes a parameter `s` and assigns it to the `salary` attribute (`salary = s`).\
    \ The value of the private `salary` attribute is returned by the public `getSalary()`\
    \ method. Inside `main()`, we have created an object of `Employee` class. Now\
    \ the `setSalary()` method is used to set the value of the private attribute to\
    \ `50000`. Then we call the `getSalary()` method on the object to return the value.(image_rsrc104.jpg)\n\
    \n### 3.10 Inheritance\nIt is possible in C++ to inherit methods and attributes\
    \ from one class to another. The \"inheritance concept\" is grouped into two categories:(image_rsrc105.jpg),\
    \ Use the `:` symbol, to inherit from a class. The example below shows from `Vehicle`\
    \ class (parent), the `Car` class (child) inherits the methods and attributes(image_rsrc106.jpg)\n\
    \n# Chapter 4. Files\nTo work with files, we use the `fstream` library. To use\
    \ the “fstream library”, include both the `<fstream>` header file AND the standard\
    \ `<iostream>`:(image_rsrc107.jpg)\n\n### 4.1 Create and Write To a File\nUse\
    \ either the `fstream` or `ofstream` object, to create a file, and specify the\
    \ name file. Use the insertion operator `<<`, to write to the file:(image_rsrc108.jpg)\n\
    \n### 4.2 Read a File\nTo read from a file, use either the `ifstream` or `fstream`\
    \ object, and the name of the file.(image_rsrc109.jpg)\n\n### 4.3 Exceptions\n\
    Executing C++ code may experience different errors: coding errors made by the\
    \ programmer, errors due to wrong input, or other unforeseeable things. If an\
    \ error appears, C++ stops normally and generates an error message. The technical\
    \ term for this is: “C++ will throw an exception (throw an error)”.\ntry and catch\n\
    In C++, three keywords are exception handling: `try`, `throw` and `catch`:(image_rsrc10A.jpg)(image_rsrc10B.jpg)\
    \ Example explained(image_rsrc10C.jpg)\n\n# Chapter 5. Conclusion\n(image_rsrc10D.jpg)\n\
    \n### ABOUT THE AUTHOR\n[Description: pic](image_rsrc10E.jpg)\nDR. MOUBACHIR MADANI\
    \ FADOUL is a tech-entrepreneur with 5 years in the electric and electronics engineering\
