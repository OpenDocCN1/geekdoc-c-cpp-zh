    # 第二章 函数

    只有在调用时才运行的代码块定义为函数。在函数中，你可以传递数据，称为参数。函数执行某些任务，并且必然是为了代码复用：定义一次代码，使用多次。


    ### 创建函数

    C++ 中提供了一些预定义的函数，例如执行代码的 `main()`。但也可以创建自己的函数来执行某些操作。要创建（通常称为声明）函数，请指定函数名，后面跟上括号
    `()`：(image_rsrcZC.jpg) ![](img/image_rsrcZD.jpg)


    ### 2.1 调用函数

    声明的函数被“保存以备后用”，并在被调用时以后执行。声明的函数不会立即执行。调用函数可以通过编写函数名后跟两个括号 `()` 和一个分号来实现；在接下来的示例中，调用时
    `myFunction()` 用于打印文本（该动作）：(image_rsrcZE.jpg)


    ### 2.2 函数的声明与定义

    一个 C++ 函数由两部分组成：![](img/image_rsrcZF.jpg) ![](img/image_rsrcZG.jpg) 然而，为了代码优化，函数的声明和定义是可以分开的。你经常会看到
    C++ 程序将函数定义在 `main()` 之下，将函数声明在 `main()` 之上。这使得代码更易读、组织更好：(image_rsrcZH.jpg)


    ### 2.3 参数

    信息以参数的形式输入到函数中。在函数内部，参数充当变量。在函数名后的括号内可以指定参数。如果你想添加尽可能多的参数，只需用逗号分隔它们：(image_rsrcZJ.jpg)
    在接下来的示例中，函数接受一个名为 `fname` 的 `string` 作为参数。当调用函数时，会传递一个名字，它在函数内部被定义为“打印全名”：(image_rsrcZK.jpg)


    ### 2.4 返回值

    在示例示例使用的 `void` 关键字指定函数不能返回值。如果你想让函数返回值，尝试使用数据类型（如 `int`、`string` 等）代替 `void`，并在函数内部使用
    `return` 关键字：(image_rsrcZM.jpg) 结果也存储在变量中：(image_rsrcZN.jpg)


