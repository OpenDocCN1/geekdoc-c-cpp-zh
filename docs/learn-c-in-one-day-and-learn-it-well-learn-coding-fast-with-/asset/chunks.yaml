    \ CAPACITY](https://www.amazon.com/dp/B08CDYV8W2/ref=sr_1_1?dchild=1&qid=1594051547&refinements=p_27%3AD.+MOUBACHIR+MADANI+FADOUL&s=books&sr=1-1&text=DR.+MOUBACHIR+MADANI+FADOUL)[HOW\
    \ TO BUILD A SUCCESSFUL APP THAT WORTH A MILLION DOLLAR](https://www.amazon.co.uk/dp/B08CFSGJ78)[ROBOT\
