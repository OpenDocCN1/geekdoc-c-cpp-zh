    ![](image_rsrc102.jpg)3.8 EncapsulationThe idea of “Encapsulation”, is to ensure
    that "sensitive" data is kept hidden from the users. Achieving this by declaring
    class variables/attributes as private (cannot be accessed from outside the class).
    Providing the public get  and set  methods helps modifying or reading the value
    of a private member.3.9 Access Private MembersUse public "get" and "set" methods,
    to access a private attribute:![](image_rsrc103.jpg)Example explainedThe salary attribute
    is set to private and have restricted access.The public “setSalary() method” takes
    a parameter (s) and assigns it to the salary attribute (salary = s).The value
    of the private salary attribute is returned by the “public getSalary() method”.Inside main(),
    we have created an object of the Employee class. Now the “setSalary() method”
    is used to set the value of the private attribute to 50000\. Then we call the “getSalary() method”
    on the object to return the value.Why Encapsulation?![](image_rsrc104.jpg) 3.10
    InheritanceIt is possible in C++ to inherit methods and attributes from one class
