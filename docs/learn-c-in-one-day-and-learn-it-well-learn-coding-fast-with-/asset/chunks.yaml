    ## 第 1 章 C++ 简介


    #### 为什么使用 C++

    `C++` 是世界上广泛流行的编程语言之一。`C++` 可于当今操作系统、嵌入式系统和图形用户界面。`C++` 是一种面向对象的编程语言，允许代码复用，为程序提供清晰的结构并降低开发成本。`C++`
    具有移植性，可用于开发适应多个平台的应用程序。`C++` 方便且易学！由于 `C++` 类似于 `Java` 和 `C#`，程序员很容易切换到 `C++`
    或反之。


    ### 1.2 C++ 入门

    本分步教程将教你 `C++` 的基础知识。不需要任何编程经验。在开始使用 `C++` 之前需要两件事：有很多编译器和文本编辑器供选择。在本分步教程书中，将使用
    IDE。


    #### C++ 安装 IDE

    “IDE（集成开发环境）”用于编译和编辑代码。流行的 IDE 包括：`Eclipse`、`Visual Studio` 和 `Blocks`。它们都是免费的，可以用于调试和编辑
    `C++` 代码。


