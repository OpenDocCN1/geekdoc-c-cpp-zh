    # 第三章 函数

    什么是 OOP？

    “OOP 代表面向对象编程”。过程化编程是对数据执行操作的或编写过程，而面向对象编程是创建同时包含函数和数据的对象。“面向对象编程”相比“过程化编程”具有许多优势：(image_rsrcZT.jpg)


    ### 3.1 什么是类和对象？

    对象和类是面向对象编程的两个主要方面。下面的图说明了对象和类的区别：(image_rsrcZU.jpg) 另一个示例：(image_rsrcZV.jpg)
    因此，“类是对象的模板，而对象是类的实例”。在创建了各个对象后，各个对象继承类中所有的函数和变量。下一节将介绍更多关于对象和类的知识。


    ### 3.2 类/对象

    C++ 是一种“面向对象的编程语言”。C++ 中的一切都与对象、类以及其方法和属性相关。例如：在生活中，自行车是一个“对象”。自行车具有重量和颜色等属性，以及行驶和刹车等方法。方法和属性基本上是类相关的函数和变量。这些通常被称为“类成员”。类是程序中定义的数据类型，作为对象的构造函数或“蓝图”。


    ### 3.3 创建类

    使用 `class` 关键字创建类：(image_rsrcZW.jpg) 示例解释：(image_rsrcZX.jpg)


    ### 3.4 创建对象

    对象是从类创建的。名为 `MyClass` 的类已经创建，所以现在通过这种方式创建对象。通过指定类名后跟对象名。在对象上使用点语法 `.` 访问类（`myString`
    和 `myNum`）：(image_rsrcZY.jpg)image_rsrcZZ.jpg) 以下示例在类内部定义了一个函数并命名为 "myMethod"：(image_rsrc100.jpg)
    在类外部定义函数可以通过指定类名后跟作用域运算符 `::` 以及函数名来实现：(image_rsrc101.jpg)(image_rsrc102.jpg)


    ### 3.8 封装

    “封装”的思想是确保敏感数据对用户隐藏。通过将类变量/属性声明为 `private`（无法从类外部访问）。提供公开的 `get` 和 `set` 方法有助于修改私有成员


    ### 3.9 访问私有成员

    使用公开的 "get" 和 "set" 方法访问私有属性：(image_rsrc103.jpg) 示例 `salary` 属性设置为 `private` 并限制访问。公开的
    `setSalary()` 方法接收参数 `s` 并将其分配给 `salary` 属性（`salary = s`）。私有 `salary` 属性的值由公开的
    `getSalary()` 方法返回。在 `main()` 中我们创建了 `Employee` 类的对象。现在使用 `setSalary()` 方法将私有属性设置为
    `50000`。然后我们在对象上调用 `getSalary()` 方法返回值：(image_rsrc104.jpg)


    ### 3.10 继承

    在 C++ 中可以从一个类继承方法和属性。“继承概念”分为两类：(image_rsrc105.jpg 使用 `:` 符号继承类。下面的示例显示 `Vehicle`
