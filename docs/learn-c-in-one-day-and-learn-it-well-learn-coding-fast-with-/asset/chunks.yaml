    使用 `getline()` 函数来读取多行文本，当满足指定条件时，例如：


    ## 19 条件与 if 语句

    在 C++ 中，使用 `if` 语句来执行不同的操作。如果条件为真，则执行相应的代码块：


    ## 20 if 语句

    当条件为真时执行代码块，使用 `if` 语句。当满足特定条件时，它会执行：


    **示例说明**

    语句 1 在循环开始前 `(int i = 0)` 设置了一个变量。

    语句 2 定义了循环运行的条件 `(i 必须小于 5)`。循环将重新开始。如果条件为真，则继续；如果为假，循环终止。

    语句 3 在每次循环代码块执行后增加一个值 `(i++)`。


    ## 21 else 语句

    当条件为假时执行代码块，使用 `else` 语句。


    **示例说明**

    上面的示例在 `time > 18` 时，屏幕会打印“晚上好”。如果时间小于 18 `(time < 18)`，程序会打印“白天好”。


    ## 22 switch 语句

    为了在多个代码块中选择一个执行，使用 `switch` 语句。在示例中使用星期几数字来计算星期几：


    ## 23 break 关键字

    当遇到 `break` 关键字时，C++ 会跳出 `switch` 块。这会停止块的代码执行。如果找到了匹配项，工作完成，不再需要继续测试。


    ## 24 default 关键字

    如果没有匹配项，则通过 `default` 关键字指定运行某些代码：


    ## 25 for 循环

    当你确切知道要循环代码块的次数时，使用 `for` 循环代替 `while` 循环：


    ## 26 break

    `break` 语句在本逐步教程书的早期章节中已经使用过。它可以跳出 `switch` 语句。`break` 语句也可以跳出循环。当 `i` 等于 4 时，此示例跳出循环：


    ## 27 continue

    当指定的条件发生时，`continue` 语句会中断循环中的当前迭代，并继续循环的下一次迭代。此示例跳过了值 4：


    ## 28 数组

    为了在一个变量中存储多个值，可以使用数组，而不是为每个值声明单独的变量。通过声明数组来定义变量类型，指定数组名称后跟`方括号` 并分配要存储元素的数量：

