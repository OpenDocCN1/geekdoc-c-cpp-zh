  \ = true; var falsely = false` `var whichIsIt = truly || falsely`\n\nA. whichIsIt\
  \ 是 true\nB. whichIsIt 是 false\n\n**七**\n\n## 数组 (Arrays)\n\n因为我有 C 和 C++ 的背景，当我想到数组时，我首先想到的是一个字符串。\n\
  \n在 Swift 中创建一个新的 playground，但这次选择 IOS 而不是 OS X。此时唯一的区别将是你看到看到 `import UIKIT` 而不是\
  \ `import Cocoa`\n\n```swift\nimport UIKit\nvar str = \"Hello, playground\"\nchar\
  \ dave = \"Dave\"; // `dave[4]` 为 '\\0'\n```\n\n尝试在你的 playground 中输入 `var dave =\
  \ '\\0'`。\n\n![Image](img/00019.jpeg)\n\n（图 7.1 `'\\0'` 是一个无效字符。）\n\n抱歉，Swift 中没有\
  \ `'\\0'`。注意：我没有忘记上面 `'\\0'` 中的第一个 `'`。Swift 有一个箭头指向它的位置，并建议在该处进行更改。\n\n有一个 `String`\
  \ 类型的 \"\\0\"，如果将其转换为数字，它们将等于 nil。还有一个 `Character` 类型的 \"\\0\"，它必须先转换为 `String`\
  \ 才能转换为数字 nil。但它们与 C 和 C++ 中的 `'\\0'` 并不完全相同。\n\n你不能像在 C 和 C++ 中那样在 Swift 中创建字符串。\n\
  \n```swift\nvar dave = \"Dave\" \n```\n\n隐式地创建一个名为 `dave` 的 `String`。\n\n但你**不能**像在\
  \ C 或 C++ 中那样访问字符：\n\n```swift\nvar firstLetter = dave[0] // 产生错误信息\nvar dave =\
  \ ['D','a','v','e'] // 产生下面的错误\n```\n\n![Image](img/00020.jpeg)\n\n（图 7.2 单引号在 Swift\
  \ 中不起作用。）\n\n`'` 并没有缺失。Xcode 当它指向它所占据的空间时会将其移除，建议用 `\"` 替换。**不允许使用单引号，也不允许使用大括号引号！**\n\
  \n所有的 `'` 都必须替换为 `\"` 才能获得有效的数组声明。\n\n```swift\nvar dave = [\"D\",\"a\",\"v\",\"\
  e\"] \n```\n\n此时 `dave` 将不是一个 `String`。它将是一个字符字符串的数组。这在我们学习字符串时会变得更清晰。目前，我们只讨论数组，它们与\
  \ C 和 C++ 不同之处在于它们不能是字符串。\n\n如果我们在 C 或 C++ 中创建一个整数数组，可以这样声明：\n\n```cpp\nint anArrayOfInts[10];\n\
  ```\n\n我将有十个槽位存放整数。无论我何时或何地做这都不重要。我可以设置：\n\n```cpp\nanArrayOfInts[2] = 7;\n```\n\
  \n而不会得到任何投诉。但如果我尝试向 `anArrayOfInts[11]` 放入一个额外的整数，区别就重要了：\n\n```cpp\nanArrayOfInts[11]\
  \ = 2;\n```\n\n因为没有 `anArrayOfInts[11]`，这可能会导致我的程序崩溃。在 Swift 中，数组的工作方式完全不是这样的！而且我们最好从头开始思考。把\
  \ Swift 中的数组（注意大写的 A）想象成火车车厢，可以装满你想要的任何东西。至于字符串，它们的思考方式与数组完全不同，我们稍后会介绍字符串。\n\n首先，数组中只允许一种类型的元素。\n\
  \n```swift\nvar biElementArray = [\"Mom\", 7]\n```\n\n这是一个错误！但它不会被识别为错误！\n\n\n\n\
  \n```swift\nvar aNewStringArray = Array<String>()\n\nvar anotherNewStringArray =\
  \ [Array]()\n```\n\n![Image](img/00024.jpeg)\n\n(图 7.6 在添加 `aNewStringArray[0] =\
  \ \"me\"` 后，`aNewStringArray` 看起来是什么样？）\n\n在你的 playground 中尝试一下。点击 `Array<Int>()`\
  \ 中的 `Array` 单词，查看使用新数组的可能方法。下面是一些示例：\n\n```swift\nvar kot = Array<String>()\nkot\
  \ = [\"What\",\"is\"]\n```\n\n按住苹果 键并将光标停在 `Array` 上，你会看到可用的扩展\n\n![Image](img/00025.jpeg)\n\
  \n(图 7.7 从数组中添加和删除项目的方法。）\n\n`kot.count` 告诉我们数组中有多少项目。我们将在循环部分使用它。\n\n当我们谈到循环时，将讨论如何遍历和打印数组。\n\
