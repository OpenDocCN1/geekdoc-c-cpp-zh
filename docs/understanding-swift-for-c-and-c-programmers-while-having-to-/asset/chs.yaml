  ### Switches（切换）\n\nC 或 C++ 中的 switch 语句与 Swift 中的非常相似，某些约定略有不同。\n\n```c\nint dog\
  \ = 5;\n\nswitch(dog)\n{\ncase 0:\n  printf(\"Boxer\");\n  break; // 除非你想让它们一起运行，否则每个\
  \ case 都需要 break\n\ncase 2:\n  printf(\"Irish Setter\");\n  break;\n\ncase 3:\n\
  \  printf(\"Doberman\");\n  break;\n\ncase 4:\n  printf(\"Springer Spaniel\");\n\
  \  break;\n\ncase 5:\n  printf(\"Unknown \"); // 没有 break，这些会合并执行\ndefault:\n  printf(\"\
  Mutt\");\n}\n\nprintf(\"\\n\\n\");\n```\n\n将输出 \"Unknown Mutt\"。\n\n在 Swift 中，switch\
  \ 语句必须是穷尽的（exhaustive）。你并不总是需要 `default:`，但你确实需要在 switch 语句中有一个穷尽的列表。\n\n考虑：\n\n\
  ```swift\nvar trueOrFalse = true\n\nswitch(trueOrFalse){\ncase true:\n  print(\"\
  true\")\ncase false:\n  print(\"false\")\n}\n```\n\n这是穷尽的。true 和 false 是唯一可能的 Bool\
  \ 返回值，且都被涵盖了，所以它确实有效。\n\n![Image](img/00042.jpeg)\n\n（图 12.1 一个穷尽的 switch，没有其他可能的回复，因此它是穷尽的。）\n\
  \n那么以下呢？\n\n```swift\nvar trueOrFalse = \"blue\"\n\nswitch(trueOrFalse){\ncase \"\
  true\":\n  print(\"true\")\ncase \"false\":\n  print(\"false\")\n}\n```\n\n在这个例子中，回复是不穷尽的。\n\
  \n![Image](img/00043.jpeg)\n\n（图 12.2 我们不知道 blue 是 true 还是 false，所以搜索不是穷尽的。）\n\n\
  我们实际上收到一个警告，说明我们的 switch 不是穷尽的。\n\n```swift\nvar trueOrFalse = \"blue\"\n\nswitch(trueOrFalse){\n\
  case \"true\":\n  print(\"true\")\ncase \"false\":\n  print(\"false\")\ndefault:\n\
  \  print(\"false\")\n}\n```\n\n通过添加 `default`，我们使上面的代码变为穷尽的。\n\n![Image](img/00044.jpeg)\n\
  \n（图 12.3 我们有默认，所以搜索是穷尽的。）\n\n所以使用 Swift 中的 switch 时，如果你的回复列表已经是穷尽的，就不需要 `default`。\n\
  \n正如在 C 和 C++ 中，switch 语句比长长的 if else 组合更容易编写和阅读。\n\n如果你的用户输入是 `String`，switch 语句可以让可能的答案更容易处理。\n\
  \n创建一个新的 Swift 控制台项目而不是 playground（播放场）\n\n![Image](img/00045.jpeg)\n\n（图 12.4 保存控制台项目（命令行工具）。）\n\
  \n我将我的项目命名为 `switchByEnteredString`。\n\n![Image](img/00046.jpeg)\n\n（图 12.5 命名你的项目并点击\
  \ next。然后在在下一个屏幕上点击 Create。）\n\n点击 Next，确保它位于你想要所在的文件中并点击 create。\n\n然后打开 `main.swift`\
  \ 文件\n\n![Image](img/00047.jpeg)\n\n（图 12.6 打开 main.swift.）\n\n输入下面的代码。在名称和版权信息注释掉之后。我将\
  \ `var reply` 设为一个强制解包的条件 `String`。然后使用了空值合并运算符（coalescing operator），以防没有输入任何内容。我们还没有讨论过函数，所以那部分稍后会讨论。现在只需使用这里的代码。\n\
  \n——————————————————————————\n\n```swift\n//\n// main.swift\n// switchByEnteredString\n\
  //\n// Created by David Curran on 12/8/15.\n// Copyright © 2015 David Francis Curran.\
  \ All rights reserved.\n//\n\nimport Foundation\n\nfunc userEnteredData() -> String{\
  \ \n  let userTypedIn = NSFileHandle.fileHandleWithStandardInput()\n  let myEnteredString\
  \ = userTypedIn.availableData\n  return NSString(data: myEnteredString, encoding:NSUTF8StringEncoding)\
  \ as! String\n}\n\nprint( \"Please enter your gender\")\nvar reply = String!()\n\
  reply = userEnteredData()\nvar replyForSwitch = reply ?? \"Error \"\n\nswitch(replyForSwitch){\n\
  case \"true\":\n  print(\"true\")\ncase \"false\":\n  print(\"false\")\ndefault:\n\
  \  print(\"false\")\n}\n```\n\n\n\n\n\n## 引言\n\n然而，Apple 为其新的 `enum` 制定规则确实有其合理的理由。新的\
  \ `enum` 比旧的 C `enum` 具有多得的功能。由于旧的 C `enum` 的值只能是 `ints`，因此类型安全性并不是问题。但 Apple 新的\
  \ `enum` 在 `Swift` 中不必仅仅是 `Int`。\n\n## Swift 中的基础枚举\n\n由于你可能在问自己，这个 `enum` 与旧的有什么不同。让我们看看需要做什么才能让我们的\
  \ Swift `enum` 尽可能地像旧的那个。\n\n为枚举创建一个新的 playground。并输入：\n\n```swift\nenum Numbers\
  \ { //注意每个值之前的单词大小写。这可以通过不同的方式实现，但如果没有 case，你就无法拥有 rawValue —— 即某种某种一致类型的值。\n\n\
  \  case ZERO\n\n  case ONE\n  case TWO\n  case THREE\n  case FOUR\n  case FIVE\n\
  \  case SIX\n  case SEVEN\n  case EIGHT\n  case NINE\n  case TEN\n} //不需要分号 ;\n\
  ```\n\n这建立了一个名为 `Numbers` 的 `enum`，但它没有值。Apple 喜欢称它们为 `rawValues`。简单来说，`rawValues`\
  \ 是赋予 `enum` 的值。\n\n在 `Swift` 中，\"Numbers\" 现在是一个类型，尝试像在 `C` 或 `C++` 中那样写写 `enum\
  \ Numbers` 将导致错误。显式转换可以运行，但它的写法不像在 `C` 或 `C++` 中那样。\n\n```swift\nvar count: enum\
  \ Numbers = .EIGHT //会给你返回一个错误 ERROR\nvar count1: Numbers = .EIGHT //可以正常工作。\n```\n\
  \n隐式转换也有效。\n\n```swift\nvar count = Numbers.EIGHT\n```\n\n注意，要将变量或常量设置为我们 `Numbers`\
  \ 中的其中一个值，你需要在值之前使用点符号。如上面的 `.EIGHT` 所示。但我们的 `enum` `Numbers` 不会在你的 playground 中显示任何值。\n\
  \n![Image](img/00053.jpeg) (图 13.3 在 Swift 中，枚举的值在你像像上面的 `count` 和 `count1` 那样使用它们之前，不会显示在\
  \ playground 中。)\n\n如你所见，侧边栏中只显示了 `EIGHT`。如果你喜欢，可以添加 `print(count1)`！\n\n上面的 `enum`\
  \ 没有任何基础值或原始值（raw values）。`Swift` 中的 `enum` 实际上并不需要基础值即可发挥作用。以这个 `enum` 为例：\n\n\
  ```swift\nenum PlantsNameHint {\n\n  case my, very, eager\n  case mother, just,\
  \ served, up\n  case nine, pies\n}\n\nvar aPlanet = PlantsNameHint.served\n\nswitch(aPlanet){\n\
  case .my:\n  print( \"Mercury\" )\ncase .very:\n  print( \"Venus\" )\ncase .eager:\n\
  \  print( \"Earth\" )\ncase .mother:\n  print( \"Mars\" )\ncase .just:\n  print(\
  \ \"Jupiter\" )\ncase .served:\n  print( \"Saturn\" )\ncase .up:\n  print( \"Uranus\"\
  \ )\ncase .nine:\n  print( \"Neptune\" )\ncase .pies:\n  print( \"Poor Pluto\" )\n\
  }\n//打印 \"Saturn\"\n```\n\n## 原始值（Raw Values）与 Int 类型\n\n但让我们假设你目前的目标是让它像 `C` 或\
  \ `C++` 的 `enum`。实际上这并不困难。让我们重做我们的 `Numbers` `enum`。\n\n```swift\nenum Numbers:Int\
  \ {\n```\n\n这实际上会将 `enum` 从未指定的类型更改为 `Int` 类型。它还会为每个 case 提供一个从零开始的 `Int` 值。如果你将\
  \ `enum` `Numbers` 包含 `:Int`，它看起来和上面的图形没有区别，除了包含了 `:Int`。\n\n### Playground 中有“幽灵”\n\
  \n当你在 `Xcode` 中创建 `C`、`C++`、`Object-C` 或 `Swift` 项目时，项目菜单除了 `RUN`、`BUILD` 等之外还有一个\
  \ `CLEAN` 选项。这是因为有时我们的项目会记住一些不该记得的东西，我们需要从头开始构建。`CLEAN` 会删除当前构建并从头开始。Playgrounds\
  \ 有时会记住一些不再存在的东西，我称之为“幽灵”。我提到这一点是因为你可能会在学习这一节时遇到这种情况。\n\n现在我们将 `enum Numbers` 更改为\
  \ `enum Numbers:Int` 并进行几处更改。我们将通过添加 `:Int` 赋予我们的 `enum` 所谓的 `rawValue`。这以前被称为 `toRaw()`，但在当前版本的\
  \ `Swift` 中已不再适用。如果你在不指定 `enum` 类型的情况下访问 `rawValue`，将得到错误。\n\n注意，我们可以从任何想要的 `int`\
  \ 值开始此 `enum` 的编号。默认值是 0。如果你对下面的代码有任何问题，请将 `case ZERO` 改为 `case ZERO = 0`。\n\n将此内容输入你的\
  \ playground：\n\n```swift\nenum Numbers:Int { //注意每个值之前的单词大小写。 \n\n  case ZERO\n\
  \  case ONE\n  case TWO\n  case THREE\n  case FOUR\n  case FIVE\n  case SIX\n  case\
  \ SEVEN\n  case EIGHT\n  case NINE\n  case TEN\n} //不需要分号 ;\n\nvar time:Numbers\
