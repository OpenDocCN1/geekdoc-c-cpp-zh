  \n5. 从你的 `kot` 数组中删除所有内容的简单方法是？\n   a. `kot.removeAll()`\n   b. `kot.capacity =\
  \ 0`\n   c. `kot = nil`\n\n6. 数组可以包含不同类型的元素吗？\n   a. 是\n   b. 不\n   c. 取决于情况\n\n\
  7. `var someElementTypeArray:[这里填写什么使其成为有效的 Array] = [\"My\", \"Mom\"]`\n\n**答案：**\n\
  1. d\n2. b. false\n3. c. 10\n4. `var list = Array<Int>(count: 4, repeatedValue:\
  \ 6)`\n   `var list2 = Int`\n5. a. `kot.removeAll()`\n6. b. 数组元素必须全部相同。\n\n### 八\n\
  \n### If else\n\n在 `if` 语句中真的不需要提到 `then`。因此 Swift 并没有 `then`，甚至不需要 `()`。由于 `if`\
  \ 语句的工作方式与 `C` 和 `C++` 类似，仅有细微差异，我们将快速过一遍这些差异。\n\n`if` 语句包含一个条件语句，如果该语句解析为 `true`，它将执行返回“真”的指令。\n\
  \n（* 注意：我没有说 \"is\" true，因为那意味着你的数据等等是正确的。）\n\nSwift 中的 `if` 语句后面总是跟着括号：\n\n```swift\n\
  if (true)\n{ \n  // 魔法发生的地方\n}\n```\n\n在下面我们可以买糖果。如果有其他可能，我们可以添加一个 `else` 语句。**不同于**\
  \ `C` 和 `C++`，你必须使用括号。\n\n```swift\nvar pennies = 5\nlet enoughToBuyCandy = 5\n\n\
  if pennies >= enoughToBuyCandy{\n  print(\"We may buy candy!\")\n}\n\nvar numberOfPenniesString\
  \ = \"pennies\"\npennies = 4\n\nif enoughToBuyCandy - pennies == 1{\n  numberOfPenniesString\
  \ = \"penny\"\n}\n\nif pennies >= enoughToBuyCandy{\n  print(\"We can may candy!\"\
  )\n} else {\n  print(\"We go home candy less \\(enoughToBuyCandy - pennies) \\(numberOfPenniesString)\
  \ short.\")\n}\n```\n\n我们得到：We go home candy less 1 penny short\n\n正如在 `C` 和 `C++`\
  \ 中一样，我们可以有一个 `else if`。\n\n```swift\npennies = 7\n\nif enoughToBuyCandy - pennies\
  \ == 1{\n  numberOfPenniesString = \"penny\"\n}\n\nif pennies == enoughToBuyCandy{\n\
  \  print(\"We may buy candy!\")\n} else if pennies > enoughToBuyCandy {\n  print(\"\
  We may get \\(  pennies - enoughToBuyCandy) pennies worth more of candy.\")\n}else{\n\
  \  print(\"We go home candy less \\(enoughToBuyCandy - pennies) \\(numberOfPenniesString)\
  \ short.\")\n}\n```\n\n我们得到：We may get 2 pennies worth more of candy.\n\n![Image](img/00026.jpeg)\n\
  \n（图 8.1 使用 if else 操作的硬币。）\n\n### 九\n\n### 可选类型 (Optionals)\n\n什么是可选类型？在你的 playground\
  \ 中输入：\n\n```swift\nvar lemons = Int?()\nvar limes = Int!()\nvar peaches = 5\n\n\
  lemons = 5\nlimes = 5\nlemons = nil\nlimes = nil\npeaches = nil\n```\n\n最后一个项目 `peaches\
  \ = nil` 将产生一个 `ERROR`。只有条件可以有 `nil` 值。也就是说 `nil` 根本没有值。\n\n与其他语言不同，Swift 中的 `nil`\
  \ 并不是指向一个不存在对象的指针。也就是说，我们可以把 `C` 和 `C++` 中的指针想象成索引卡片。想象一个图书馆，你有一组卡片——就像旧时代按字母顺序排列的抽屉列出了书的位置。而书在按杜伊分类法组织的书架上。一个指针就像一张索引卡片，它指向书的位置。书就是该位置的值。\n\
  \n在真实的图书馆中，卡片还在，书可能已经没了。在 `C` 和 `C++` 中，一张填写好的卡片**必须**指向书架上的某个位置，且书必须在那里，否则就会导致灾难。\n\
  \n为了复习 `C++` 中的编程示例，请查看下一节。如果你觉得不需要复习，请跳到后续章节。\n\n![Image](img/00027.jpeg)\n\n（图\
  \ 9.1 一旦设置了值，peaches 就不能为 nil）\n\n如果你熟悉 `C` 或 `C++` 并且清楚指针如何导致崩溃，你可以跳到下一章。否则，请享受这个复习。\n\
  \n创建一个新的控制台项目。\n\n![Image](img/00028.jpeg)\n\n（图 9.2 设置指针。）\n\n`var lemons = Int?()`...你可以随心所命名。\n\
  \n![Image](img/00029.jpeg)\n\n（图 9.3 你的项目。）\n\n![Image](img/00030.jpeg)\n\n```cpp\n\
  #include <iostream>\nusing namespace std;\n```\n\n然后删除高亮部分：\n\n```cpp\n  int book\
  \ = 999334;\n  int *libraryCardPtr = &book;\n```\n\n\n\n\n\n```cpp\ncout << \"Now\
  \ we free( intBlockPt\\n\\n\"; //我们已经删除了架子和地板\n\nfree(intBlockPtr);\n\ncout << \"\
  \ intBlockPtr = \"<< intBlockPtr << \"\\n\\n\"; //指针仍然指向该位置\n\n//但编译器认为该块已经释放了。这里有一个小程序，下面的一行可能仍然有效。然而，编译器可能会在该处写入其他内容，导致灾难性的结果。\n\
  \ncout << \" *intBlockPtr = \"<< *intBlockPtr << \"\\n\\n\";\n\n///////////////////////////////////////////////////\n\
  \nreturn 0;\n\n///////////////////////////////////////////////////\n```\n\n在已经被擦除的位置请求书籍会导致错误。\n\
  \n指向一个在内存中已被释放的地方就像是让某人去图书馆的索引卡位置，但那里的架子已经消失了，他们会掉进地板。\n\n在 C 和 C++ 中，每本书书都需要一张索引卡和空间架子空间。在我们的类比中，两者都占用内存。\n\
  \n但在 Swift 中，一个设置为 `nil` 的 `var` 变量意味着它目前还没有**任何类型**的数值。Swift 没有指针。它就像完全没有图书馆索引卡一样。`Nil`\
  \ 告诉你书籍不存在，仅此为止。\n\n那常量值呢？尝试设置 `let` dogs = `Int()` 看看会发生什么。当你尝试将 `dogs` 设置为某个真实值时，会出现一个带有解决方案的小红色错误圈，并且\
  \ `let` 会自动为你更改为 `var`。常量不能是可选的（optionals）。\n\n让我们玩玩可选类型。引用一个 `nil` 值会导致问题。我们能如何使用可选类型来防止这种情况？这里有很多内容需要理解，所以如果你在结束之前有疑问，请耐心听听。\n\
  \n让我们想象一下在你开始时不知道某个值是什么。你有 1 美元，但不知道用这 1 美元可以买多少个苹果。\n\n```swift\nvar apples = Int?()\
  \ //注意，这末尾以前没有 ()，但现在已经更改了。\n\nif  apples >= 1{\n  print(\"我们有 \\(apples)\")\n}\
  \ else {\n  print(\"我们今天没有苹果！\")\n}\n```\n\n![Image](img/00031.jpeg)(图 9.4 避免等于\
  \ nil 的值。)\n\n注意在侧边栏中的 `var apples` 被赋予了 `nil` 值。并且 `if else` 知道 `nil` 不大于或等于 1。\n\
  \n但如果从那里继续添加：\n\n```swift\nlet applesPerCrate = 20\n\nvar appleCratesNeeded = apples/applesPerCrate\n\
  ```\n\n![Image](img/00032.jpeg)(图 9.5 Swift 对未解包的值表示不满。)\n\n我们得到了一个错误。中间带有圆点的圆圈（错误标记）表示如果我们点击它，它将向我们显示错误的可能的修复方法。这与圆圈中间的感叹号不同，后者不提供可能的更改建议。\n\
  \n![Image](img/00033.jpeg)(图 9.6 点击红圈以获取更多信息。)\n\n如果我们点击下方带有白色点的圆圈，上方会呈现一个解决方案。\n\
  \n![Image](img/00034.jpeg) (图 9.7 进一步探索错误。)\n\n点击蓝色的 Fix-it Solution（修复解决方案）将导致该行变为：\n\
  \n```swift\nvar appleCratesNeeded = apples!/applesPerCrate\n```\n\n注意在 `apples`\
  \ 之后、除斜符号 `/` 之前插入了一个 `!`。这被称为强制解包（forced unwrapping）。然而，像这样写（因为 `apples` 是 `nil`）同样会导致致命的崩溃。\n\
  \n当程序说说“可选类型 'Int?' 的值未解包”时意味着什么？非常简单：\n\n```swift\nvar potatoes = 1\n```\n\n隐式地将\
  \ `potatoes` 转换为 `Int`。也就是说程序假设 `potatoes` 是一个 `Int`。\n\n```swift\nvar motatoes\
  \ = Double(1)\n```\n\n显式地将 `potatoes` 转换为 `Double`。\n\n```swift\nvar apples = Int?()\n\
  ```\n\n显式地将 `apples` 转换为 `Int`，但 `apples` 的值尚未被解包。\n\n```swift\nvar appleCratesNeeded\
  \ = apples/applesPerCrate\n```\n\n在上面，`apples` 没有被解包。但它需要被解包，所以 Swift 在上方询问你是否要解包\
  \ `apples`。\n\n![Image](img/00035.jpeg) (图 9.8 你被询问是否要解包 apples。)\n\n要这样做，你可以这样写：\n\
  \n```swift\nvar appleCratesNeeded = apples!/applesPerCrate\n```\n\n```swift\nvar\
  \ pears = Int!() \n```\n\n显式地声明 `pears` 是一个“已解包”的 `Int`。因为它是显式解包，你可以写：\n\n```swift\n\
  var pearCratesNeeded = pears/applesPerCrate\n```\n\n不需要在 `pears` 之后加感叹号。\n\n我们很快就会向你展示如何让强制解包工作。首先，我想展示一下\
  \ Swift 在各种情况下会做什么。\n\n![Image](img/00036.jpeg) (图 9.9 apples 已解包，但它的解包值在哪里？）\n\n\
  所以让我们重新开始。使用橙子 `var oranges = Int!()`。在这里我们使用了 `!` 而不是 `?`。\n\n这意味着 `oranges` 被显式声明为\
  \ `Int` 并且显式声明为已解包的可选类型。假设我们声明 `pennies` 为：\n\n```swift\nvar pennies = 21\n```\n\
  \n![Image](img/00037.jpeg) (图 9.10 如果 oranges 是 nil，程序会崩溃。)\n\n这意味着 `oranges` 被显式声明为\
