  \ atIndex: 0)\n   ```\n   现在如果你尝试\n   ```swift\n   aNewIntArray.popLast()\n   ```\n\
  \   将返回什么\n   a. -1\n   b. 4\n   c. 10\n   d. 1\n\n4. 你会在你的 playground 中中使用这个 `Array`\
