- "# Swift 入门指南：针对 C 和 C++ 程序员，尽可能少学习 Object-C，Swift 2\n\n\n\n![](img/00084.jpeg)\n\
  \n\n由 David Francis Curran 编写，旨在让 C 和 C++ 程序员在尽可能少学习 Object-C 的情况下理解 Swift。\n\n\
  本书的初初衷是为具有某些 C 和 C++ 背景的人士设计的。它并不是真正为编程完全初学者设计的。如果你想理解 Swift，我强烈建议你在学习 Swift 之前先学习\
  \ C 和/或 C++ 或其他语言。\n\n为了将我的程序从 C 和 C++ 迁移到 Mac 和 iPad 上运行，我不得不学习 Object-C。Swift\
  \ 让你了一个机会在很大程度上跳过 Object-C。这一系列书籍的目的是帮助你弥补这一鸿沟，而无需花费大量时间学习 Object-C。在随后的章节中，我们将讨论如何将\
  \ C 或 C++ 包含到 Swift 项目中。这种包含将涉及一些 Object-C。但我希望让你能够编写 Swift 代码，从而让你决定使用 Swift 而不是\
  \ C 或 C++。\n\n多年前，我曾认为我在数学理解上有问题。显然，许多富有想象力的人都有这个问题。我曾让数学的想法压倒了我。后来，我在夏天参加的一门微积分课上，一位非常好的老师在课开始时解释，他将告诉我们已知宇宙中关于数学的所有知识。他说：\n\
  \n一加一等于二：这是加法。\n二减一等于一：这是减法。\n二乘二等于四：这是乘法。\n四除以二等于二：这是除法。\n\n这就是全部了。我们在小学学到的数学的复杂部分。每个数学公式都可以拆解为这四个简单部分的组合。\n\
  \n我不知道你对编程 C 或 C++ 了解或记得多少，也不知道你已经对 Swift 了解了多少。正因为我不知道你了解什么，我将解释这些基础部分。\n\n本书旨在作为一种程序化教学。我将尝试为你的大脑编程以掌握\
  \ Swift 语言这一主题。希望你回答每个章节末尾的所有测验题。我在那里隐藏了一些小贴士，通过解决这些问题可以增加你的知识。例如，“常量与变量”章节中的第 7\
  \ 题包含一个我们在文中未涵盖的转换方法。仅仅因为主题没有被涵盖，并不意味着它不起作用。书中也解释了如何在 `xCode` 参考中找到此类内容。在你的 playground（练习）中评估内容时不要担心错误。（尽管在继续之前，你需要删除它们或将它们注释掉。错误将停止\
  \ playground 你输入内容的能力。）记住，最好的程序员是那些犯过最多错误并从中学习的人。\n\n注意：作品《Understanding Swift for\
  \ C and C++ programmers》分章节出版，其原因有两个：\n1) 尝试跟上 Swift 的变化。\n2) 允许尽可能多的图像，而无需由于文件大小限制（在\
  \ Kindle 上的上传限制）而限制它们。\n\n我希望你喜欢这这本书，就像我编写它时一样喜欢。\n\n书中的项目代码可以在线获取：[`geniusat.work/swift.php`](http://geniusat.work/swift.php)。对于\
  \ playground 代码，只需从页面上复制代码并将其粘贴到你的 playground 中即可。单个 playground 代码没有在线上的原因是我们会频繁地更改代码，例如，为了强调错误而更改\
  \  中的单行代码，因此包含所有可能的 playground 代码将变得臃肿且混乱。\n\n## 第一\n### 下载程序\n要在你的 Mac 上运行 Swift，你需要下载最新版本。操作系统要求——（即，你运行最新版本的\
  \ `Xcode` 需要什么种版本的 Mac OS X）将在那里进行说明。`Xcode` 是免费的。你只需要付费成为一名 Mac 开发者。但如果你只是在学习编程，或者只是从\
  \ C 或 C++ 转型到 Swift，你暂时不需要担心这个。\n\n注意，可能有新的测试版本可用。例如（图 1.1），有一个 6.4 beta 2，它为 Apple\
  \ Watch 提供了编程支持。目前，我建议坚持使用当前版本。所以请下载，并在运行起 `Xcode` 后回来。\n\n![图像](img/00001.jpeg)\n\
  图 1.1 Apple 的 Xcode 下载页面\n\n## 第二\n### 让我们开始编程\n如果你对下面的任何术语感到陌生，不要担心。随着我们的学习，你将了解更多关于它们的内容。\n\
  \n通过 Swift，你可以设置一个“可执行程序”，也可以设置一个“playground”。你可以设置一个“Cocoa 应用程序”或“命令行应用程序”。你甚至可以在“终端（terminal）”中运行\
  \ Swift。\n\n* 一个 Cocoa 应用程序是运行在带有按钮和文本字段的窗口中的应用程序，你的代码根据你输入的输入进行操作。你的结果显示在图形用户界面中。（图\
  \ 2.1）\n\n![图像](img/00002.jpeg)\n图 2.1 iPad IOS 应用程序的图形界面。\n\n* 命令行应用程序（我们将很快就会演示的）是一个你输入文本并看到输出而不是图形的应用程序。\n\
