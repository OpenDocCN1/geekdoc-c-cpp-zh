  \ 如果你对其进行调试（即，你的代码中没有错误），它将执行。（图 2.1）你的结果将显示在 Debug Area 窗口中。\n\n![图像](img/00003.jpeg)\n\
  图 2.2 运行执行文件。\n\n![图像](img/00004.jpeg)\n图 2.3 结果显示在 Debug Area 窗口中。\n\n`println`\
  \ 在 `Xcode` 7.1 中被 `print` 替换。\n\n* 通过 Swift playground，你编写代码并在 gutter 中看到代码的即时反馈。它是测试代码的极佳方法。（图\
  \ 2.6）这里 gutter 重复了你的字符串。\n\n![图像](img/00005.jpeg)\n图 2.4 通过 File -> New -> Playground\
  \ 打开。\n\n![图像](img/00006.jpeg)\n图 2.5 MySwiftPlayground. 使用 OS\n\n![图像](img/00007.jpeg)\n\
  图 2.6 你的 playground。\n\n你已经准备好学习代码了。\n\n章节问题\n1) Cocoa 应用程序具有\nA. 文本界面。\nB. 图形界面。\n\
  C. 有趣界面。\nB. 同时具有文本和图形界面。\n\n2) 可执行程序\nA. 与 playground 没有区别。\nB. 比 playground 优越。\n\
  C. 当你运行时它执行。\nD. 自动运行。\n\n3) 可执行程序打印其结果\nA. 在互联网上。\nB. 在 playground 中。\nC. 在 Debug\
  \ Area 窗口中。\nD. 在电视上。\n\n4) playground 输入的反馈出现在\nA. 在 Debug Area 窗口中。\nB. gutter\
  \ 中。\nC. 在互联网上。\nD. 图形界面中。\n\n## 三\n### \n一些介绍说明。\n\n你可以通过以下地址下载 playground 和项目：\n\
  [`geniusat.work/SwiftForC_CplusplusCode.sitx`](http://geniusat.work/SwiftForC_CplusplusCode.sitx)\n\
  或\n[`geniusat.work/SwiftForC_CplusplusCode.zip`](http://geniusat.work/SwiftForC_CplusplusCode.zip)\n\
  \nplayground 或项目章节包含了你可以粘贴到 Swift 中的文本。只需删除你选择的阅读器可能附加的任何作者注释即可。\n\n\n\n\n\n###\
  \ 注释包含\n\n`Comment inclusion`（注释包含）与 C 和 C++ 基本一致。我首先提到这一点，是因为在我们学习的过程中，你可能需要注释掉自己犯的错误。\n\
  \n正如我在前言中所说的：最好的程序员是那些犯过最多错误并从中学习的人。\n\n```swift\n// 将一行变为注释\n\n/* 创建一个跨越多行的长注释\
  \ */\n```\n\n它们都不会作为代码包含在程序或游乐场（playground）中。\n\n下面由 `var` 引入的两个声明类似于：\n\n`int bananas\
  \ = 5;`\n\n以及\n\n`int grapes = 6;`\n\n在 C 和 C++ 中是这样，尽管在 Swift 中它们不仅仅是整数。我们将在“常量与变量”中详细讨论这一点。但目前这只是一个打印的示例。\n\
  \n```swift\nvar bananas = 5  // 注意这里以前末尾没有 `()`，但现在已经更改了。\n\nvar grapes = 6 \n\n\
  /* 注意这里以前末尾没有 `()` \n现在已经更改了。 */\n```\n\n### print 取代了 println\n\n当 Swift 出现时，`println()`\
  \ 是向某些地方打印内容的方法。苹果将其更改为了 `print()`。但你仍可以将其视为 `println`，因为它会打印一行并在结尾包含一个换行符 `\\n`。你很快就会看到它的用法。要在\
  \ `print()` 语句中打印变量或常量，可以使用类似 `print(\"We have \\(grapes) grapes and \\(bananas)\
  \ bananas\")` 的语句。\n\n```swift\nprint(\"We have \\(grapes) grapes and \\(bananas)\
  \ bananas\")\n```\n\n注意引号必须不能是智能引号（全角引号）。\n\nSwift `print()` 的默认结尾是 `\\n`，但如果我们愿意，可以通过\
  \ `terminator:` 来更改它。在游乐场中输入以下内容：\n\n```swift\nprint(\"We have \\(apples) apples\
  \ and \\(oranges) oranges\", terminator: \"\")\n\nprint(\" and \\(pears) pears\"\
  )\n```\n\n![Image](img/00008.jpeg)\n\n( 图 3.1 使用带不带 terminator 的 `print()` )\n\n\
  当行尾设置为空字符串 `\"\"` 时，两个 `print` 命令在打印时会合并在同一行。这在我们以后想要让不同类型的连续循环在同一行上合并数据时将非常有帮助。\n\
  \n**不要忘记 terminator 后的 `:`！**\n\n这个 `print-function(something to print, terminator:\
  \ \"\")` 是 Objective-C 的遗留物。\n\n### 最后：\n\n在示例游乐场或项目中，我可能会有这样一行代码：\n\n```swift\n\
  let diamonds = 5\n\n//diamonds = 7 // 取消注释以查看错误\n```\n\n这意味着移除该行前两个 `//`\n\n```swift\n\
  diamonds = 7  // 取消注释以查看错误\n```\n\n我一直使用所谓的 `camelCaseLettering`（驼峰命名法），即我在编写常量和变量时，第一个单词小写，与其他所有单词通过首字母大写连接。我偶尔会改变这种写法，但大多数情况下你可以假设我的变量和常量是这样命名的。\n\
  \n```swift\nvar howManyBananas = 3\n```\n\n## 运算符\n\n在 Swift 中，运算符大部分与 C 和 C++ 中的非常相似。我们很快就会使用它们，所以让我们先来看看它们。\n\
  \n### 数学运算符\n\n- `=` 将一个值赋给另一个\n- `+` 将一个值加另一个值上\n- `-` 从另一个值减去一个值\n- `*` 将一个值乘以另一个值。然而，它并不表示指针。Swift\
  \ 中没有指针。\n- `/` 将一个值除以另一个值\n\n```swift\nvar addition = xInt + yInt\n\nvar multiplication\
  \ = addition * addition\n\nvar subtraction = multiplication - yInt\n\nvar division\
  \ = (subtraction * multiplication)/addition\n```\n\n`%` 模运算符在一个值被除以另一个值时给出余数。然而在\
  \ Swift 中，你可以获取一个 `Double` 除以 `Double` 的余数作为 `Double`。而在 C 和 C++ 中，余数始终是整数。这意味着你需要小心，比如当你正使用模运算符来判断结果是偶数还是奇数。\n\
  \n![Image](img/00009.jpeg)\n\n( 图 4.1 在 double 上使用模运算。 )\n\n- `+=` 将左项加到右项。\n- `-=`\
  \ 从右项减去左项。\n- `++` 在变量末尾使其增加 1。它等同于 `var negtiveItem += positiveItem`（仅限整数。尝试对 `Double`\
  \ 这样做。）\n- `--` 在变量末尾使其减少 1。它等同于 `var negtiveItem -=negtiveItem`（仅限整数。尝试对 `Double`\
  \ 这样做。）\n\n```swift\nvar xInt = 1\n\nvar yInt = 1\n\nprint(--xInt) // 在打印前减 1\n\n\
  print(yInt--) // 在打印后减 1\n\nprint(yInt)  // 显示减去 后的值\n```\n\n输出\n0\n1\n0\n\n你自己检查一下，如果在上述操作之后添加：\n\
  \n```swift\nprint(++xInt)\n\nprint(yInt++)\n\nprint(yInt)\n```\n\n输出\n1\n0\n1\n\n\
  \ 应用于布尔结果的逻辑运算符\n\n- `||` OR（或）运算符，两者中必须有一个符合预期\n- `&&` AND（与）运算符，两者都必须符合预期\n\n\
  ### 返回布尔值的比较运算符\n\n- `==` 一个值等于另一个值\n- `>=` 左侧对象小于或等于右侧\n- `<=` 左侧对象大于或等于右侧\n- `!=`\
  \ 它们之间不相等\n\n### 新运算符（位置非常特殊，将在稍后讨论）\n\n- `?` 表示项尚未赋值。这被称为可选值（optional value）。\n\
  - `!` 与 `?` 类似，但表示该可选值在赋值后永远不会为 nil。\n\nSwift 还有范围运算符。\n- `...` 是闭区间运算符，包含右侧。\n\
  - `..<` 是半区间运算符，不包含右侧。\n\n## 常量与变量\n\n在 C 和 C++ 中你标记数据的类型。在 Swift 中，`let` 和 `var`\
  \ 引入类型。注意与 C 和 C++ 不同，你不需要分号。行尾是假设的。如果你愿意，可以加上分号。\n\n`let` 创建一个常量。不像 C/C++ 需要显式声明你正在创建的类型，Swift\
  \ 可以根据你输入的内容推断。\n\n`let` 创建一个常量，即一个不能改变的值。例如 `let myConstX = 5` 类似于 `const int ConstX\
  \ = 5`。\n\n`var` 创建一个值可以改变的变量。类似于 `int x = 5`。例如 `var x = 5`  own `int x = 5;`。\n\
  \n```swift\nimport Cocoa\n\nvar str = \"Hello, playground\"\n\nvar x = 5\n\nlet\
  \ myConstX = 5\n\nvar z = 5.00\n\nvar y = 5.01\n\nvar myDoubleX = 5.0000001\n\n\
  var mySmallDouble = .69\n```\n\n\n\n\nSwift 将 `x` 和 `myConstX` 识别为 `Int`。（使用大写 `I`\
  \ 而不是 `C` 或 `C++` 中的小写 `i`。正如你将看到的，`Int` 与 `int` 并不完全相同。）\n\n顺便说一下，如果你输入两次相同的变量名将会得到错误。Swift\
  \ 像 `C` 和 `C++` 一样，只允许变量的一个实例。（作用域异常除外。）\n\n我们将在本书的后部分讨论 `switch` 语句。它们的工作方式存在一些差异，例如不需要\
  \ `break`；目前，我只想展示作用域的差异，这种差异允许我们声明一个新的 `var x`。（并不建议这样做。）使用上面的 `x` 和 `y`，将以下内容输入你的播放（（playground）。\n\
  \n```swift\nswitch(y){\ncase  0:\n  var x = 3  //这个 x 与上面的 x 在不同的作用域内\ncase  1:\n\
  \  print(x)\ndefault:\n  print(y)\n  print(x) \n}\n```\n\n![Image](img/00012.jpeg)\n\
  \n（图 5.3 具有同名变量的作用域异常示例。尝试将 `switch` 语句中的值 `y` 改为其他值会发生什么。）\n\n如果这看起来和 `C` 和 `C++`\
  \ 一样，那它其实并不是。`Int` 不是 `int`。`Double` 也 `double`。事实上，`Int` 和 `Double` 都是类。它们各有一个多个属性。（顺便说一下，Swift\
  \ 在这里将 `x` 和 `y` 都指定为 `Double` 而不是 `Float`。因为它无法判断你的意图，所以采取了谨慎的做法，将 `x` 和 `y` 分别设为\
  \ `Double`。关于 `Double` 和 `Float` 的更多内容稍后可见。）\n\n`Bool(s)` 基本上如你预期的那样。（并不是 `bool`，因为它也是一个类。）我们稍后会使用它们。\n\
  \n```swift\nlet j:Bool = true\nvar B = false\n```\n\n但并没有所谓的 `Char` 或 `char`。不过，确实有一个\
  \ `Character`。`Character` 是你能找到的最接近 `C/C++` 中 `\"char\"` 的类型。我们将回到 `Character` 和\
  \ `String`，因为在 `String` 中寻找 `Character` 并不像 `C/C++` 中那样容易。事实上，在我们涵盖许多其他内容（如 `for`\
  \ 循环、`while` 循环、`if` 语句和数组）之后我会回到这里。现在让我们先玩玩数字。\n\n### 算术\n\n让我们尝试一些数学。算术运算符 `+`\
  \ 和 `-` 基本上相同。\n\n```swift\nvar zPlusY = z + y\n```\n在侧栏中给了我们 `10.1`。\n\n```swift\n\
  var xTimesMyConstX = x*myConstX\n```\n你应该在侧栏看到 `25`。\n\n但如果你尝试写入（即更改 `myConstX`\
  \ 的值）\n\n```swift\nmyConstX = 7\n```\n\n你将得到一个错误（仅如果是第一个错误时。有时只显示第一个错误。见图 5.4）。有错误时，侧栏是空的。\n\
  \n![Image](img/00013.jpeg)\n\n（图 5.4 错误。你不能更改用 `let` 创建的值。）\n\n点击带有感叹号的红点将弹出消息。（见图\
  \ 5.5）\n\n![Image](img/00014.jpeg)\n\n（图 5.5 尝试更改常量的值会导致错误。）\n\n使用双斜杠 `//` 注释掉错误。\n\
  \n你也可以像在 `C/C++` 中一样使用 `/* */`。\n\n现在尝试乘以这些：\n\n```swift\nvar yTimesZ = z*y\nvar\
  \ MyConstXTimesZ = myConstX*z \n```\n\n前者可以。一个 `Double` 乘以一个 `Double` 得到一个 `Double`。但后者（图\
  \ 5.6）失败了，因为 `Int` 无法直接乘以 `Double`。\n\n![Image](img/00015.jpeg)\n\n（图 5.6 `Int`\
  \ 乘以 `Double` 在 Swift 中会失败，但两个 `Double` 可以相乘。）\n\n注释掉错误。不这样做会导致播放器卡住。\n\n```swift\n\
  //var MyConstXTimesZ = myConstX*z\n```\n\n你否以某种方式将 `Int` 转换为 `Double` 然后再相乘？可以。尝试：\n\
  \n```swift\n//let myConstX = 5\n//var z = 5.00\nvar myConstXTimesZInt = myConstX*\
  \ Int(z)\n```\n\n侧栏中应该出现 `25`。而在使用\n\n```swift\nvar zTimesMyConstXDouble = Double(myConstX)*\
  \ z\n```\n\n我承认，当我第一次看 Swift 时，我以为它们简单地反转了 `C/C++` 的转换格式 `(int)someFloat` 或 `(float)someInt`。但！`Double()`\
  \ 或 `Int()` 实际上是函数，而不仅仅是简单的转换。你现在不需要知道它们是如何工作的。就像你从未真正需要知道 `C/C++` 中的 `strlen(word)`\
  \ 是如何工作一样。（在 Swift 中是 `o = strlen(\"Me\")`。并且注意直引号。）\n\n`25.05` 将出现。添加以下内容，我们将查看结果（图\
  \ 5.7）\n\n```swift\nvar myConstXTimesYInt = myConstX * Int(y)\nvar yTimesMyConstXDouble\
  \ = Double(myConstX)*y\nvar zTimesMyConstXDouble = Double(myConstX) * z\nvar zTimesMyConstXDouble2\
  \ = Double(myConstX) * y\nvar zTimesMyConstXDouble3 = Double(myConstX) * myDoubleX\n\
  ```\n\n![Image](img/00016.jpeg)\n\n图 5.7 在 `myConstXTimesZInt` 中，结果被转换为 `Int`。但在所有其他情况下，值都是\
  \ `Double`。即使对于 `var zTimesMyConstXDouble = Double(myConstX) * z` 也是如此。答案显示为 `25`，没有小数点或零。但那个\
  \ `25` 是一个 `double`。只是没有显著小数，所以没有显示。\n\n### 显式与隐式转换\n\n你可以显式地转换变量或常量。只需引入你的变量或常量，后面跟着一个冒号，然后是你希望它变成的类型。尝试\n\
  \n```swift\nlet f:Float = 9.99\nlet d:Double = 9.99\nlet e = 9.99\nvar fl = f*1.0002\n\
  var dl = d*1.0002\nvar el = e*1.0002\n```\n\n结果出来了（见图 5.8）。注意精度的差异。`dl` 在侧栏中有更多的小数位。`el`\
  \ 具有相同的结果，说明 Swift 确实将 `e` 解析为 `Double`。\n\n![Image](img/00017.jpeg)\n\n（图 5.8 `Double`\
  \ 的精度就是为什么 Swift 除非另有说明，否则会转换为 `Double` 的原因。）\n\n\n\n\n## 8) 如果图 5.3 中 `y` 的值在进入\
  \ switch 语句之前被改为 1.0，导致执行了默认语句。那么 `print(x)` 会打印什么值。\n\na. 5.0\nb. 3\nc. 3.0\nd.\
  \ 5.01\n\n**六**\n\n## 布尔值游戏 (Bool Play)\n\n在你的 playground（练习）中输入：\n\n```swift\n\
  let blue:Bool = true\nlet red: Int = Int(blue)\nprint(blue)\nprint(red)\n```\n\n\
  ![Image](img/00018.jpeg)\n\n（图 6.1 注意，如果你点击屏幕右侧的按钮，值也会出现在赋值语句下方。同时请注意，当 `print()`\
  \ 用于常量或变量时，它会带引号打印。）再次强调，命令 `println` 已更改为 `print.`。\n\n现在在上面，我们将一个 `Bool` 类型 `blue`\
  \ 转换成了 `Int`。并发现它的值为 1。让我们反过来试一次。\n\n```swift\nlet one = 1\nlet boolOne = Bool(one)\n\
  ```\n\n在上面 `boolOne` 等于 `true`。但如果是 \n\n```swift\nlet boolSeven = Bool(7)\n```\n\
  \n这同样等于 `true`。\n\n```swift\nvar boolSeven = true\nlet notBoolSeven = !boolSeven\n\
  ```\n\n在这里 `notBoolSeven` 将是 `false`。\n\n按住你的 Apple 键并点击上面的 `Bool` 单词。会出现 `Bool`\
  \ 类的实例和方法。我们调用了一个函数 `Bool(7)` 来返回 `boolSeven` 的值 \"true\"。你可以以同样的方法检查 `Int`、`Float`、`Double`\
  \ 等。\n\n尝试输入：\n\n```swift\nvar petite = Bool(-1)\nvar zero = Bool(0)\n```\n\n（我们将在下面的问题中使用上述内容。）\n\
  \n怎样才能让 `Bool` 变量和常量得到 `false` 的值？插入 `Bool()` 的负值是 true 还是 false？\n\n布尔值在比较中非常有用。就像在\
  \ C 和 C++ 中一样。\n\n```swift\nvar big = 100\nvar bigCopy = big\nvar little = 4\nvar\
  \ resultOfComparison = big > little  //true\nresultOfComparison = big == little\
  \  //false\nresultOfComparison = little <= big  //true\nresultOfComparison = big\
  \ <= bigCopy  //true\nresultOfComparison = big >= bigCopy  //true\nresultOfComparison\
  \ = big <= little  //false\n```\n\n## Questions\n\n1) 如果我们在 playground 中输入，将得到什么结果：\n\
  \n`zero.description`\n\nA. 一个错误\nB. \"false\"\nC. 与 `petite.description` 相同\nD.\
