  b. 致命错误 (FATAL ERROR)\nc. 3.0\nd. 5.0\n\n**十四**\n\n## 字典 (Dictionaries)\n\n当我用 C\
  \ 或 C++ 工作时，我有时会创建数组数组：\n\n```cpp\nint myArrayOfArrays[10][10];\n```\n\n或者\n\n```cpp\n\
  int myArrayOfArraysOfArrays[10][10][10]; // 依此类推\n```\n\n在 Swift 中你并没有看到很多这种操作。你可以设置一个包含\
  \ 1000 个 `Int` 值的 `Array`：\n\n```swift\nvar aThousandIntArray = Int\n```\n\n然后对其中的值进行操作。但点始终是以我们我们需要的方式收集数据。Swift\
  \ 确实给了我们在所谓的字典（dictionary）中收集数据的机会。它并不像 `int myArrayOfArrays[10][10];`；但你可以创建一个相似的东西。\n\
  \n假设我们创建了一个包含 100 个值的 `myArrayOfArrays`，并说 `myArrayOfArrays[0][0] = 5;` `myArrayOfArrays[0][1]\
  \ = 7;` `myArrayOfArrays[0][2] = 9;` 直到 `myArrayOfArrays[10][10] = 122;`\n\n```swift\n\
  var A_DICTIONARY_NAME:[Int : Int] = [ 0 : 5, 1: 7, 2 : 9]\n```\n\n相反 Swift 使用的是字典。每个字典条目由两个项目组成，第一个是键（key），第二个是值（value）。这里有一个键值都是字符串的字典：\n\
  \n```swift\nvar myExampleDictionary: [ String : String] = [\"Key\" : \"Value\"]\n\
  ```\n\n`Dictionary` 中的项目在哈希表中按其键排序，用户永远看不到这个哈表。Swift 在后台处理了排序。简单来说，Swift 接收你的 `Key`，将其拆分为可排序的代码并在你需要时找到你的\
  \ `Key`。键可以是任何类型，`Int`、`Double`、`String`，只要可以转换为哈希值进行存储即可。值可以是任何类型。\n\n可以显式创建一个字典：\n\
  \n`var or let dictionaryName(colon:) [ type name for key (colon:) type name for\
  \ value] = [key of specified type (colon:) value of specified type (如果需要，用逗号分隔)\
  \ …. key of specified type (colon:) value of specified type ]`\n\n你可以使用字典来收集姓和名，名字按姓氏排序：\n\
  \n```swift\nvar myDictionary:[ String : String] = [\"LastNameOne\":\"David\", \"\
  LastNameTwo\": \"Two\"]\n```\n\n（注：原文提供的文本包含大量重复和混乱的内容，此处翻译已进行清理并保留核心逻辑。）\n\n\n\n\
  \n`myDictionaryTenTen.count` // 仍然等于 101\n\n同样地\n\n`myDictionaryTenTen[3*33] = (3*33\
  \ + (3*33 % 10) * 2) + 5`\n\n也给了我们 101 的计数。键是根据它们的声明类型进行评估的，在本例中为 `Int`。\n\n## 移除值\n\
  \nApple 提供了 `removeValueForKey(_:)` 作为移除内容的方法。\n\n我们同样需要将其附加到字典的名称上，并只放入键。\n\n```\n\
  myDictionaryTenTen.count\nmyDictionaryTenTen[100]\nmyDictionaryTenTen[199]\nmyDictionaryTenTen.count\n\
  myDictionaryTenTen.removeValueForKey(199)\nmyDictionaryTenTen[199]\nmyDictionaryTenTen.count\n\
  ```\n\n![Image](img/00065.jpeg)\n\n(图 14.3 显示使用 `.count` 和 `.removeValueForKey()`\
  \ 的结果)\n\n注意，尽管我们的字典中有 101 个项目，但键 100 显示为 `nil`。移除键 199 的值后，它也被显示为 `nil`。\n\n另外请注意，`myDictionaryTenTen.removeValueForKey(199)`\
  \ 给了我们被移除的值：\n\n222 \n\n正如我们在 For-In-循环中学学习的，我们可以使用 For-In-循环来遍历字典。为了好玩，让我们把键 199\
  \ 的值放回去。\n\n```\nmyDictionaryTenTen[199] = 1000\n\nfor(whoCaresWhatICallTheKey,\
  \ whoCaresWhatICallTheValue) in myDictionaryTenTen {\n  print( \"\\(whoCaresWhatICallTheKey):\\\
  (whoCaresWhatICallTheValue)\")\n}\n```\n\n在你的 playground 中试试！\n\n让我们尝试一些新东西，在你的\
  \ playground 中输入：\n\n```\nprint(myDictionaryTenTen.keys)\nprint(myDictionaryTenTen.values)\n\
  ```\n\n觉得还不太印象深刻？嗯，你不会那样使用 `.keys` 或 `.values`。你可能会做类似这样的操作。\n\n```swift\nfor SomeSillyValue\
  \ in myDictionaryTenTen.values {\n  if SomeSillyValue % 11 == 0 {\n    print(\"\
  SomeSillyValue) \"\n  }\n}\n```\n\n我们得到：\n\n55\n99\n33 \n66\n110\n88\n33\n77\n44\n\
  \n`.keys` 和 `.values` 告诉 Swift 单独提取键或值。\n\nfifteen\n\n## 处理字符串\n\n字符串在 Swift 中略有不同。在\
  \ C 和 C++ 中，字符串是填充了字符的字符数组。\n\n而不是 \n\n`char aLetter = 'a';`\n\n我们使用的是 \n\n```swift\n\
  var aLetter = \"o\";\nvar anotherletter: Character = \"k\"\n```\n\n注意，我们对 Characters\
  \ 使用双引号 [永远不要使用智能引号]。现在，只需记住有 Characters 即可。\n\n我们如何知道这些确实是 Characters 而不是 Strings？\n\
  \n在 Swift 中我们可以相加 Strings，但相加 Characters 稍微复杂一些。\n\n```\nvar word = aLetter + anotherLetter\n\
  ```\n\n![Image](img/00066.jpeg)(图 15.1 Swift 中的 Characters 不能简单地相加来形成 Strings。)\n\
  \n因此上面的代码会给我们一个错误信息。我们不能直接相加 Characters。稍后我们会看到可以将一个 Character 追加到单词中，但那需要小心。\n\n\
  存在隐式 Character 吗？\n\n```swift\nvar myWord1 = \"n\"\nvar myWord2 = \"o\"\nvar myFinalWord\
  \ = myWord1 + myWord2\n```\n\n![Image](img/00067.jpeg)\n\n(图 15.2 如果你可以将两个单字符变量或常量相加，它们是\
  \ Strings 而不是 Characters。)\n\n你可以看到 Swift 将 `myWord1` 和 `myWord2` 解释为 Strings 而不是\
  \ Characters。\n\nCharacters 必须 必须显式声明。\n\n所以当我查看 Swift 中的 Strings 时，我的第一个问题是如何访问单个\
  \ Characters？让我们尝试访问我们的 \"Hello, playground\" `str` 中的一个字符。\n\n```swift\nvar aThirdLetter:\
  \ Character = str[0] // 崩溃\n```\n\n![Image](img/00068.jpeg)\n\n(图 15.3 你不能通过使用 Int\
  \ 指向字符串中的位置来为 Character 赋值。)\n\n我们如何获取 Swift 在我们打开 playground 时提供的如 `str` 字符串中的单个字符，即\
  \ `var str = \"Hello, playground\"`？\n\n这以前可行，但现在不再行了：\n\n![Image](img/00069.jpeg)\n\
  \n(图 15.4 这种方法不再起作用。)\n\n现在实现此的一种方法是在字符串末尾追加 `.characters`。\n\n```swift\nfor myCharacter\
  \ in str.characters{\n  print (myCharacter)\n}\n```\n\n//结果为\nH\ne\nl\nl\no\n，\n\
  p\nl\na\ny\ng\nr\no\nu\nn\nd\n\n另一种稍有不同的方法是：\n\n```swift\nfor index in str.characters.indices\
  \ {\n  print(\"\\(str[index])\")\n}\n```\n\n尝试上面的操作看看是否给你相同的结果。在第一种情况下，我们直接访问字符。在第二种情况下，我们获取每个字符的索引，然后使用\
  \ `str[index]` 在字符串中找到它。要记住的重要点是索引不等同于 `Int`。\n\n```swift\nvar myOtherCharacter\
  \ = str[index]\n```\n\n\n\n\n\n`myString[myString.endIndex.predecessor().predecessor().predecessor().predecessor().predecessor()]`\
  \ 将带我们一直回到 \"D\"\n\n但那是一种相当笨拙的移动方式。如果我们多加了一个 `.predecessor()`，就会导致致命性错误。因此 Swift\
  \ 也也给了我们 `.successor()`。\n\n```swift\nmyString.startIndex.successor() //工作方式与 .predecessor()\
  \ 类似，只是 successor() 会向前移动。\n```\n\n![Image](img/00073.jpeg) \n(图 15.8 使用 `.startIndex`\
  \ 移动。使用 `.successor()` 并添加额外的 `.successor()`。)\n\n不要访问不存在的索引的 `Character`。\n\n```swift\n\
  myString.endIndex.predecessor().successor() // 结果为 5，正如你所看到的，它并不存在，尝试访问这里的 `Character`\
  \ 将导致错误。\n```\n\n不要访问不存在的索引。\n\n```swift\nmyString.startIndex.predecessor() \n```\n\
  \n![Image](img/00074.jpeg) \n(图 15.9 然而，就像在 C 和 C++ 中一样，你无法到达不存在的位置。`.startIndex`.`.predecessor()`\
  \ 失败。)\n\n`.advanceBy()` 实际上接受一个 `int` 作为参数。它需要像 `startIndex` 的起始位置。\n\n```swift\n\
  myString.startIndex.advancedBy(2) // 得到 2\nmyString[myString.startIndex.advancedBy(2)]\
  \ // 得到 \"V\"\n```\n\n在 `advancedBy()` 中达到 `myString.characters.count` 或其等价 `myString.endIndex`\
  \ 会导致错误。`advancedBy()` 为我们提供了另一种打印 `String` 中字符的方法。在你的 playground 中尝试一下。\n\n```swift\n\
  var counter = 0  //counter 必须设置为 int 而不是索引\nwhile counter < str.characters.count\
  \ { // str.characters.count 确实返回一个 Int。\n  print(str[str.startIndex.advancedBy(counter)])\
  \ //advancedBy 接收 Int 参数。\n  counter++\n}\n```\n\n`.advancedBy(Int)` 可以接受负值。在你的\
  \ playground 中用我们的 Swift 启动字符串 `str` 尝试这个。\n\n```swift\nvar countOfCharacters =\
  \ str.characters.count  // str.characters.count 返回一个 int\nstr.endIndex  //记得我们不能使用它，它是一个索引而不是\
  \ int。\nvar counterNeg = countOfCharacters\nstr.endIndex.advancedBy( -counterNeg)\n\
  while counterNeg > 0 {\n  print( str[str.endIndex.advancedBy( -counterNeg)] )\n\
  \  counterNeg--\n}\n```\n\n考虑一下，`.endIndex` 不包含字符，但它是一个有效的后续索引，可以在那里插入字符。\n\n```swift\n\
  myString.insert(\"!\", atIndex: myString.endIndex) // 不会覆盖，而是插入到字符串的末尾处。\n```\n\n\
  但 `.endIndex` 不是一个删除字符的有效位置，因为那里没有字符。我们刚刚插入的字符 \"!\" 并不是从末尾移除的，所以位于 `myString.endIndex.predecessor()`。\n\
  \n为了删除它前面的字符（即原始的 \"?\"），我们这样做：\n\n```swift\nmyString.removeAtIndex(myString.endIndex.predecessor().predecessor())\
  \ // 删除了我们向前移动的 \"?\"\nprint(myString)\n```\n\n```\n![Image](img/00075.jpeg) \n\
  (图 15.10 使用 `.insert` 和 `.removeAtIndex` 更改 String。注意 String 索引不是 Int。)\n\n对于我们的\
  \ `String` 甚至有一个 `.removeRange(_:)` 方法。注意，当 Apple 用 `_` 表示某项内容时：该值将直接插入，无需任何其他指令。\n\
  \n```swift\nvar aRange = str.startIndex.advancedBy(7)...str.startIndex.advancedBy(10)\n\
  //让我们添加一些必要的标点符号。\nstr.insert(\".\", atIndex: str.endIndex)\n//那个伞没打开的跳伞兵说了什么？\n\
  str.removeRange(aRange)\n```\n\nsixteen\n\n### String 额外扩展\n\nUnicode 标量（Unicode\
  \ scalars）被视为单词，可以简单地添加，例如，技能和交叉骨的代码是 `\"\\u{2620}\"`。输入：\n\n```swift\nvar myFavoriteFlag\
  \ = \"My favorite flag is \"\nmyFavoriteFlag += \"\\u{2620}\"\nprint(myFavoriteFlag)\n\
  ```\n\n![Image](img/00076.jpeg) \n(图 16.1 尽管海盗旗是一个字符，但在这里添加时它是一个单词。)\n\n我们可以在我们的字符串中找到一个\
  \ `String`。让我们用 `myString` 试试（DAVE!）\n\n```swift\nmyString.containsString(\"AV\"\
  ) // 得到 true\n```\n\n`hasPrefix` 和 `hasSuffix` 类似的。\n\n```swift\nmyString.hasPrefix(\"\
  DA\") // 得到 true，这是前缀\nmyString.hasSuffix(\"VE\") // 得到 false，这不是后缀\nmyString.hasSuffix(\"\
  E!\") // 得到 true，这是后缀。\nprint( \"myString has \\(myString.characters.count) characters.\"\
  )\n// 得到 \"myString has 5 characters.\\n\"\n```\n\n`myString.isEmpty` // 将得到 false，因为那里有字符。\n\
  \n```swift\nvar aBlankString = \"\"  //将其为空字符串\nvar anotherBlankSting = String()\
  \ //将其为空字符串\naBlankString.isEmpty  // 得到 true\nanotherBlankSting.isEmpty  // 得到\
  \ true\naBlankString = myString\nif( aBlankString == myString){\n  print(\"These\
  \ two Strings are equal\")\n} else {\n  print(\"\\u{2620}\")\n}\n```\n\n![Image](img/00077.jpeg)\
  \ \n(图 16.2 hasPrefix, hasSuffix)\n\nseventeen\n\n### 使用结构体 (Structs)\n\n结构体非常像\
  \ C 和 C++，区别在于它们没有方法。等等，不对。结构体可以有方法。但现在，让我们看看如何使用它们。我们可以使用结构体向 Swift 添加数据。结构体可以有方法。\n\
  \n```swift\nstruct businessCard {\n  var firstName: String?\n  var middleName: String?\n\
  \  var surName: String?\n  var age: Int\n  var isFemale: Bool\n}\n```\n\n我们可以通过填充它的属性向结构体添加数据。\n\
  \n```swift\nvar myCard = businessCard()\nmyCard.firstName = \"Bob\"\nmyCard.middleName\
  \ = \"David\"\nmyCard.surName = \"Cats\"\nmyCard.age = 33\nmyCard.isFemale = false\n\
  ```\n\n我们可以向字典向结构体添加数据。\n\n```swift\nvar businessCardDictionary: [Int: businessCard]\
  \ = [:]\nbusinessCardDictionary[0] = myCard\n```\n\n我们可以向字典向结构体添加数据。\n\n```swift\n\
  if let card = businessCardDictionary[0] {\n  print(card.firstName)\n}\n```\n\n我们可以向字典向结构体添加数据。\n\
  \n```swift\nif let card = businessCardDictionary[0] {\n  print(card.middleName)\n\
  }\n```\n\n结构体也可以有自己的方法。\n\n```swift\nstruct businessCard {\n  var firstName: String?\n\
  \  var middleName: String?\n  var surName: String?\n  var age: Int\n  var isFemale:\
  \ Bool\n\n  func printName() {\n    print(\"\\(firstName ?? \"\") \\(middleName\
  \ ?? \"\")\")\n  }\n}\n```\n\neighteen\n\n### 函数 (Functions)\n\n我喜欢 C 或 C++ 函数。\n\
  \n```cpp\n#include <iostream>\n\nusing  namespace  std;\n\nint giveMeTheAverageMileage(\
  \ int myMileArray[], int entriesTotal){\n\n  int result = 0;\n\n  for( int x = 0;\
  \ x < entriesTotal; x++ ){\n\n result += myMileArray[x];\n\n }\n\n  return result;\n\
  \n}\n\nint main(int argc, const  char * argv[]) {\n\n  int distance[6] = {11,14,56,61,4,2};\n\
  \n  cout << \"Average milage == \" << giveMeTheAverageMileage(distance, 6) << \"\
  \\n\\n\";\n\n}\n```\n\n但尽管我总是给函数和变量命名，以便它们能被理解和记住，但别人不喜欢人们像这样写函数。 \n\n```swift\n\
  int doIt( int forbar[], int foo){\n\n  int w = 0;\n\n  for( int x = 0; x < foo;\
  \ x++ ){\n```\n\n\n\n\n\n```swift\nw += forbar[x];\n}\n\nreturn w;\n}\n```\n\n因此，Object-C\
  \ 有许多指令写在函数中，就在它们本该出现的地方，这样函数可以更容易被理解。\n\n我们不需要使用它们来将上述 C++ 程序翻译为 Swift：\n\n创建一个新的游乐场（playground）并将其命名为你的函数\
  \ playground。输入：\n\n```swift\nvar listOfNumbers = [11,14,56,61,4,2]\n\nfunc giveMeTheAverageMileage(listOfNumbers:\
  \ Array<Int>) -> Int{\n  var total = 0\n  for var i = 0; i < listOfNumbers.count;\
  \ i++ { //我们不需要知道我们的数组有多少个元素 //Swift 会帮我们处理这些。\n    total += listOfNumbers[i]\n\
  \  }\n  return total\n}\n\nprint(giveMeTheAverageMileage(listOfNumbers))\n```\n\n\
  ![Image](img/00080.jpeg)\n\n（图 18.1 一个简单的函数，为我们提供一组数字的平均值。）\n\n函数的模型应该是：\n\n`func\
  \ nameOfFunction( NameOfEntity: type, nameOfNextItemToEnter: type, etc.) -> return\
  \ type{}`\n\n让我们通过我将向你展示的下一个函数示例来看这些内容。它包含：\n\n- 单词：`func`\n- 函数名：`returnPrefix`\n\
  - 参数：`type` `wordToPrefix:String`\n- `.`\n- `.` // 根据需要可以使用任意数量，用逗号分隔\n- `.`\n-\
  \ 参数：`type` `lengthOfPrefixToReturn: Int`\n- 箭头：`->`\n- 返回类型：`String`\n\n### 作业\
  \ 1\n\n尝试根据你目前所学的内容写一个函数，接收一个 String 和一个长度，并返回该字符串中前长度的字符。完成后，将你的代码与下方的对比。我将使用 Swift\
  \ 的 `var str = \"Hello, playground\"` 作为我的字符串。\n\n```swift\nvar str = \"Hello, playground\"\
  \n\nfunc returnPrefix(wordToPrefix:String, lengthOfPrefixToReturn: Int) ->String\
  \ {\n  if lengthOfPrefixToReturn == 0 {\n    return \"\"\n  }\n  var nextIndexMarker\
  \ = 1\n  //设置一个字符数组\n  var aPrefix:[Character] = [wordToPrefix[wordToPrefix.startIndex]]\n\
  \n  lengthOfPrefixToReturn\n  nextIndexMarker\n  wordToPrefix.characters.count\n\
  \  while nextIndexMarker < wordToPrefix.characters.count && lengthOfPrefixToReturn\
  \ > nextIndexMarker {\n    aPrefix.append(wordToPrefix[wordToPrefix.startIndex.advancedBy(nextIndexMarker)])\n\
  \    nextIndexMarker++\n  }\n  let result:String = String(aPrefix)\n  return(result)\n\
  }\n\nvar myPrefixString = returnPrefix(str,lengthOfPrefixToReturn: 3)\nprint(myPrefixString)\n\
  ```\n\n![Image](img/00081.jpeg)\n\n（图 18.2 `returnPrefix()` 接收一个字符串和一个长度，并返回该长度的前缀。）\n\
