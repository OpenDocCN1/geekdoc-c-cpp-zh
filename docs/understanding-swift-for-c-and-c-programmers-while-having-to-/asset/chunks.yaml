  trans: "\n\n# 8) 如果图 5.3 中 `y` 的值在进入 switch 语句之前被改为 1.0，导致执行了默认语句。那么 `print(x)`\
    \ 会打印什么值。\n\na. 5.0\nb. 3\nc. 3.0\nd. 5.01\n\n**六**\n\n## 布尔值游戏 (Bool Play)\n\n\
    在你的 playground（练习）中输入：\n\n```swift\nlet blue:Bool = true\nlet red: Int = Int(blue)\n\
    print(blue)\nprint(red)\n```\n\n![Image](img/00018.jpeg)\n\n（图 6.1 注意，如果你点击屏幕右侧的按钮，值也会出现在赋值语句下方。同时请注意，当\
    \ `print()` 用于常量或变量时，它会带引号打印。）再次强调，命令 `println` 已更改为 `print.`。\n\n现在在上面，我们将一个\
    \ `Bool` 类型 `blue` 转换成了 `Int`。并发现它的值为 1。让我们反过来试一次。\n\n```swift\nlet one = 1\n\
    let boolOne = Bool(one)\n```\n\n在上面 `boolOne` 等于 `true`。但如果是 \n\n```swift\nlet\
    \ boolSeven = Bool(7)\n```\n\n这同样等于 `true`。\n\n```swift\nvar boolSeven = true\n\
    let notBoolSeven = !boolSeven\n```\n\n在这里 `notBoolSeven` 将是 `false`。\n\n按住你的 Apple\
    \ 键并点击上面的 `Bool` 单词。会出现 `Bool` 类的实例和方法。我们调用了一个函数 `Bool(7)` 来返回 `boolSeven` 的值\
    \ \"true\"。你可以以同样的方法检查 `Int`、`Float`、`Double` 等。\n\n尝试输入：\n\n```swift\nvar petite\
    \ = Bool(-1)\nvar zero = Bool(0)\n```\n\n（我们将在下面的问题中使用上述内容。）\n\n怎样才能让 `Bool` 变量和常量得到\
    \ `false` 的值？插入 `Bool()` 的负值是 true 还是 false？\n\n布尔值在比较中非常有用。就像在 C 和 C++ 中一样。\n\
    \n```swift\nvar big = 100\nvar bigCopy = big\nvar little = 4\nvar resultOfComparison\
    \ = big > little  //true\nresultOfComparison = big == little  //false\nresultOfComparison\
    \ = little <= big  //true\nresultOfComparison = big <= bigCopy  //true\nresultOfComparison\
    \ = big >= bigCopy  //true\nresultOfComparison = big <= little  //false\n```\n\
    \n## Questions\n\n1) 如果我们在 playground 中输入，将得到什么结果：\n\n`zero.description`\n\nA.\
    \ 一个错误\nB. \"false\"\nC. 与 `petite.description` 相同\nD. 0\n\n2) 这里的 `var turtles`\
    \ 结果是什么：\n\n```swift\nvar turtles = Bool(-1)\n```\n\nA. 我们没有乌龟。\nB. false\nC.\
    \ true\nD. 我们少于一只乌龟\n\n3) `var liar = false` 以下哪项是等价。\n\nA. `var liar = Bool(28)`\n\
    B. `var liar = Book(-21)`\nC. `var liar = Bool(2.444)`\nD. `var liar = Bool(0)`\n\
    \n4) `var truly = true; var falsely = false` `var whichIsIt = truly && falsely`\n\
    \nA. whichIsIt 是 true\nB. whichIsIt 是 false\n\n5) `var truly = true; var falsely\
    \ = false` `var whichIsIt = truly || falsely`\n\nA. whichIsIt 是 true\nB. whichIsIt\
    \ 是 false\n\n**七**\n\n## 数组 (Arrays)\n\n因为我有 C 和 C++ 的背景，当我想到数组时，我首先想到的是一个字符串。\n\
    \n在 Swift 中创建一个新的 playground，但这次选择 IOS 而不是 OS X。此时唯一的区别将是你看到看到 `import UIKIT`\
    \ 而不是 `import Cocoa`\n\n```swift\nimport UIKit\nvar str = \"Hello, playground\"\
    \nchar dave = \"Dave\"; // `dave[4]` 为 '\\0'\n```\n\n尝试在你的 playground 中输入 `var\
    \ dave = '\\0'`。\n\n![Image](img/00019.jpeg)\n\n（图 7.1 `'\\0'` 是一个无效字符。）\n\n抱歉，Swift\
    \ 中没有 `'\\0'`。注意：我没有忘记上面 `'\\0'` 中的第一个 `'`。Swift 有一个箭头指向它的位置，并建议在该处进行更改。\n\n有一个\
    \ `String` 类型的 \"\\0\"，如果将其转换为数字，它们将等于 nil。还有一个 `Character` 类型的 \"\\0\"，它必须先转换为\
    \ `String` 才能转换为数字 nil。但它们与 C 和 C++ 中的 `'\\0'` 并不完全相同。\n\n你不能像在 C 和 C++ 中那样在 Swift\
    \ 中创建字符串。\n\n```swift\nvar dave = \"Dave\" \n```\n\n隐式地创建一个名为 `dave` 的 `String`。\n\
    \n但你**不能**像在 C 或 C++ 中那样访问字符：\n\n```swift\nvar firstLetter = dave[0] // 产生错误信息\n\
    var dave = ['D','a','v','e'] // 产生下面的错误\n```\n\n![Image](img/00020.jpeg)\n\n（图\
    \ 7.2 单引号在 Swift 中不起作用。）\n\n`'` 并没有缺失。Xcode 当它指向它所占据的空间时会将其移除，建议用 `\"` 替换。**不允许使用单引号，也不允许使用大括号引号！**\n\
    \n所有的 `'` 都必须替换为 `\"` 才能获得有效的数组声明。\n\n```swift\nvar dave = [\"D\",\"a\",\"v\"\
    ,\"e\"] \n```\n\n此时 `dave` 将不是一个 `String`。它将是一个字符字符串的数组。这在我们学习字符串时会变得更清晰。目前，我们只讨论数组，它们与\
    \ C 和 C++ 不同之处在于它们不能是字符串。\n\n如果我们在 C 或 C++ 中创建一个整数数组，可以这样声明：\n\n```cpp\nint anArrayOfInts[10];\n\
    ```\n\n我将有十个槽位存放整数。无论我何时或何地做这都不重要。我可以设置：\n\n```cpp\nanArrayOfInts[2] = 7;\n```\n\
    \n而不会得到任何投诉。但如果我尝试向 `anArrayOfInts[11]` 放入一个额外的整数，区别就重要了：\n\n```cpp\nanArrayOfInts[11]\
    \ = 2;\n```\n\n因为没有 `anArrayOfInts[11]`，这可能会导致我的程序崩溃。在 Swift 中，数组的工作方式完全不是这样的！而且我们最好从头开始思考。把\
    \ Swift 中的数组（注意大写的 A）想象成火车车厢，可以装满你想要的任何东西。至于字符串，它们的思考方式与数组完全不同，我们稍后会介绍字符串。\n\n\
    首先，数组中只允许一种类型的元素。\n\n```swift\nvar biElementArray = [\"Mom\", 7]\n```\n\n这是一个错误！但它不会被识别为错误！\n\
    \n"
- fmt: "\n```swift\nvar aNewStringArray = Array<String>()\n\nvar anotherNewStringArray\
    \ = [Array]()\n```\n\n![Image](images/00024.jpeg)\n\n(Figure 7.6 What does `aNewStringArray`\
