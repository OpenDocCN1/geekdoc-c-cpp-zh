    (Figure 7.7 Ways to add and subtract items from an array.)\n\n`kot.count` gives\
    \ us how many items are in our array. We will be using this in our loops section.\n\
    \nWhen we talk about loops we'll discuss moving through, and printing out our\
    \ arrays.\n\n**Questions:** Hold down the command key while holding the cursor\
    \ on `Array` and find the answers to these questions in the extensions.\n\n1.\
    \ What is result here?\n   ```swift\n   var result = kot + aStringArray\n   ```\n\
    \   a. \"Fee Fi Fo Fum\"\n   b. [\"ma\",\"my\",\"mo\",\"What\", \"is\", \"your\"\
    , \"name\"]\n   c. ERROR\n   d. [\"What\", \"is\", \"your\", \"name\", \"me\"\
    , \"my\", \"mo\",\"mum\"]\n\n2. For `aNewIntArray` above what would `aNewIntArray.isEmpty`\
    \ return. \n   a. true\n   b. false\n   c. nil\n\n3. For `aNewIntArray` type in:\n\
    \   ```swift\n   aNewIntArray.insert(-1, atIndex: 0)\n   ```\n   now if you try\n\
    \   ```swift\n   aNewIntArray.popLast()\n   ```\n   what will be returned\n  \
    \ a. -1\n   b. 4\n   c. 10\n   d. 1\n\n4. How would you use this `Array` extension\
    \ in your playground?\n   ```swift\n   public init(count: Int, repeatedValue:\
    \ Element)\n   ```\n\n5. What is an easy way to remove everything from your `kot`\
    \ array?\n   a. `kot.removeAll()`\n   b. `kot.capacity = 0`\n   c. `kot = nil`\n\
    \n6. Can Arrays contain different types of elements?\n   a. Yes\n   b. No\n  \
    \ c. Depends\n\n7. `var someElementTypeArray:[What goes here to make this a valid\
    \ Array] = [\"My\", \"Mom\"]`\n\n**Answers:**\n1. d\n2. b. false\n3. c. 10\n4.\
    \ `var list = Array<Int>(count: 4, repeatedValue: 6)`\n   `var list2 = [Int](count:\
    \ 5, repeatedValue: 7)`\n5. a. `kot.removeAll()`\n6. b. Arrays elements must all\
