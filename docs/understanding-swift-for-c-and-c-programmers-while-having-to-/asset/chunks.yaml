    \ you notice as you began to type Float or Double Xcode offered a number of items\
    \ that you can fill in. Let Xcode fill in Float64 for you:\n\nlet g:Float64 =\
    \ 9.99\n\nvar gl = g*1.0002\n\nFloat64 is the same as a double!\n\nTry \n\nlet\
