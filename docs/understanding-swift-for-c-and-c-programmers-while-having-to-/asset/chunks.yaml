    \ by a Double fails in Swift but two Doubles can be multiplied.)\n\nComment out\
    \ the error. Not doing so will stall the playground.\n\n//var MyConstXTimesZ =\
    \ myConstX*z\n\nCan you somehow cast the Int to a Double and then multiply? Yes\
    \ you can. Try:\n\n//let myConstX = 5\n\n//var z = 5.00\n\nvar myConstXTimesZInt\
    \ = myConstX* Int(z)\n\n25 should appear in the gutter. Whereas with \n\nvar zTimesMyConstXDouble\
    \ = Double(myConstX)* z\n\nI confess that when I first looked at Swift I thought\
    \ they simply reversed the C/C++ casting format of (int)someFloat or (float)someInt.\
    \ But no! Double() or Int() are actually functions not just simple casts. You\
