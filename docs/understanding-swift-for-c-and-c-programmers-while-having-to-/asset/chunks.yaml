  trans: "\n\n```c\nprintf(\"We are on the verge of breakthrough%d!\\n\",x); // 执行我们需要的操作。\n\
    \nx++; // 为我们提供了退出循环的方法。\n\n}\n```\n\n// 或者用于 do-while 循环\n\n```c\nx = 100;\n\n\
    do{\n  printf(\"We are on the verge of breakthrough%d!\\n\",x); // 执行我们需要的操作。\n\
    \n  x++; // 为我们提供了退出循环的方法。\n\n}while( x < 6);\n```\n\n而在 Swift 中应该是这样的：\n\n```swift\n\
    var x = 0\n\nwhile x < 6 {\n  print(\"We are on the verge of a breakthrough\\\
    (x)\")\n  x++\n}\n```\n\n// 以及\n\n```swift\nx = 100\n\nrepeat { // 在 Swift 中现在用\
    \ repeat 代替了 do\n  print(\"We are on the verge of a breakthrough\\(x)\")\n  x\
    \ += 100\n\n}while x < 8 // 我们需要确保 while 循环在某个时候结束。\n```\n\n在两种情况下，我们得到的结果类似于：\n\
    \n![Image](img/00041.jpeg)\n\n（图 11.1 使用 while 循环。）\n\n注意这里的 `repeat{…..}while`\
    \ 循环只运行了一次。无论设置了什么条件，`repeat` 循环至少都会运行一次。取决于设置的条件，`while` 可能一次都不运行。\n\n### 十二\n\
    \n### Switches（切换）\n\nC 或 C++ 中的 switch 语句与 Swift 中的非常相似，某些约定略有不同。\n\n```c\nint\
    \ dog = 5;\n\nswitch(dog)\n{\ncase 0:\n  printf(\"Boxer\");\n  break; // 除非你想让它们一起运行，否则每个\
    \ case 都需要 break\n\ncase 2:\n  printf(\"Irish Setter\");\n  break;\n\ncase 3:\n\
    \  printf(\"Doberman\");\n  break;\n\ncase 4:\n  printf(\"Springer Spaniel\");\n\
    \  break;\n\ncase 5:\n  printf(\"Unknown \"); // 没有 break，这些会合并执行\ndefault:\n\
    \  printf(\"Mutt\");\n}\n\nprintf(\"\\n\\n\");\n```\n\n将输出 \"Unknown Mutt\"。\n\
    \n在 Swift 中，switch 语句必须是穷尽的（exhaustive）。你并不总是需要 `default:`，但你确实需要在 switch 语句中有一个穷尽的列表。\n\
    \n考虑：\n\n```swift\nvar trueOrFalse = true\n\nswitch(trueOrFalse){\ncase true:\n\
    \  print(\"true\")\ncase false:\n  print(\"false\")\n}\n```\n\n这是穷尽的。true 和 false\
    \ 是唯一可能的 Bool 返回值，且都被涵盖了，所以它确实有效。\n\n![Image](img/00042.jpeg)\n\n（图 12.1 一个穷尽的\
    \ switch，没有其他可能的回复，因此它是穷尽的。）\n\n那么以下呢？\n\n```swift\nvar trueOrFalse = \"blue\"\
    \n\nswitch(trueOrFalse){\ncase \"true\":\n  print(\"true\")\ncase \"false\":\n\
    \  print(\"false\")\n}\n```\n\n在这个例子中，回复是不穷尽的。\n\n![Image](img/00043.jpeg)\n\n\
    （图 12.2 我们不知道 blue 是 true 还是 false，所以搜索不是穷尽的。）\n\n我们实际上收到一个警告，说明我们的 switch 不是穷尽的。\n\
    \n```swift\nvar trueOrFalse = \"blue\"\n\nswitch(trueOrFalse){\ncase \"true\"\
    :\n  print(\"true\")\ncase \"false\":\n  print(\"false\")\ndefault:\n  print(\"\
    false\")\n}\n```\n\n通过添加 `default`，我们使上面的代码变为穷尽的。\n\n![Image](img/00044.jpeg)\n\
    \n（图 12.3 我们有默认，所以搜索是穷尽的。）\n\n所以使用 Swift 中的 switch 时，如果你的回复列表已经是穷尽的，就不需要 `default`。\n\
    \n正如在 C 和 C++ 中，switch 语句比长长的 if else 组合更容易编写和阅读。\n\n如果你的用户输入是 `String`，switch\
    \ 语句可以让可能的答案更容易处理。\n\n创建一个新的 Swift 控制台项目而不是 playground（播放场）\n\n![Image](img/00045.jpeg)\n\
    \n（图 12.4 保存控制台项目（命令行工具）。）\n\n我将我的项目命名为 `switchByEnteredString`。\n\n![Image](img/00046.jpeg)\n\
    \n（图 12.5 命名你的项目并点击 next。然后在在下一个屏幕上点击 Create。）\n\n点击 Next，确保它位于你想要所在的文件中并点击 create。\n\
    \n然后打开 `main.swift` 文件\n\n![Image](img/00047.jpeg)\n\n（图 12.6 打开 main.swift.）\n\
    \n输入下面的代码。在名称和版权信息注释掉之后。我将 `var reply` 设为一个强制解包的条件 `String`。然后使用了空值合并运算符（coalescing\
    \ operator），以防没有输入任何内容。我们还没有讨论过函数，所以那部分稍后会讨论。现在只需使用这里的代码。\n\n——————————————————————————\n\
    \n```swift\n//\n// main.swift\n// switchByEnteredString\n//\n// Created by David\
    \ Curran on 12/8/15.\n// Copyright © 2015 David Francis Curran. All rights reserved.\n\
    //\n\nimport Foundation\n\nfunc userEnteredData() -> String{ \n  let userTypedIn\
    \ = NSFileHandle.fileHandleWithStandardInput()\n  let myEnteredString = userTypedIn.availableData\n\
    \  return NSString(data: myEnteredString, encoding:NSUTF8StringEncoding) as! String\n\
    }\n\nprint( \"Please enter your gender\")\nvar reply = String!()\nreply = userEnteredData()\n\
    var replyForSwitch = reply ?? \"Error \"\n\nswitch(replyForSwitch){\ncase \"true\"\
    :\n  print(\"true\")\ncase \"false\":\n  print(\"false\")\ndefault:\n  print(\"\
    false\")\n}\n```\n\n"
- fmt: "\n## Introduction\n\nApple did have some good reasons for making the rules\
    \ concerning their new `enum`, however. The new `enum` has many more capabilities\
    \ than the old C `enum`. And since the old C `enum` had values that could only\
    \ be `ints`, type safety was not an issue. But Apple's new `enum` does not have\
    \ to be only an `Int` in `Swift`.\n\n## Basic Enums in Swift\n\nSince you are\
    \ likely asking yourself how is this `enum` different than the old. Let's see\
    \ what we have to do to make our Swift `enum` as much like the old as possible.\n\
    \nCreate a new playground for enums. And enter:\n\n```swift\nenum Numbers { //Note\
    \ word case before each value. This can be done differently but without case you\
    \ cannot have a rawValue—a value of some consistent type.\n\n  case ZERO\n\n \
    \ case ONE\n  case TWO\n  case THREE\n  case FOUR\n  case FIVE\n  case SIX\n \
    \ case SEVEN\n  case EIGHT\n  case NINE\n  case TEN\n} //no need for a ;\n```\n\
    \nThis sets up an `enum` named `Numbers` but it has no values. Apple likes to\
    \ call them `rawValues`. Very simply `rawValues` are values given to a `enum`.\n\
    \nIn `Swift` `\"Numbers\"` is now a type and trying to write `enum Numbers` as\
    \ you do in `C` or `C++` will lead to an error. An explicit cast will work but\
    \ it is not written as it would be in `C` or `C++`.\n\n```swift\nvar count: enum\
    \ Numbers = .EIGHT //will give you a ERROR\nvar count1: Numbers = .EIGHT //will\
    \ work.\n```\n\nan implicit cast will also work.\n\n```swift\nvar count = Numbers.EIGHT\n\
    ```\n\nNote that to set a variable or constant to one of the values in our `Numbers`,\
    \ you use a period before the value. As in `.EIGHT` above. But our `enum` `Numbers`\
    \ will not have any values showing in your playground.\n\n![Image](images/00053.jpeg)\
    \ (Figure 13.3 In Swift values for the enum do not show in the playground until\
    \ you use them as in `count` and `count1` above.)\n\nAs you can see only `EIGHT`\
    \ shows in the gutter. Add a `print(count1)` if you like!\n\nThe `enum` above\
    \ does not have any base or raw values. An `enum` in `Swift` doesn't actually\
    \ need base values to be effective. Take this `enum` for instance:\n\n```swift\n\
    enum PlantsNameHint {\n\n  case my, very, eager\n  case mother, just, served,\
    \ up\n  case nine, pies\n}\n\nvar aPlanet = PlantsNameHint.served\n\nswitch(aPlanet){\n\
    case .my:\n  print( \"Mercury\" )\ncase .very:\n  print( \"Venus\" )\ncase .eager:\n\
    \  print( \"Earth\" )\ncase .mother:\n  print( \"Mars\" )\ncase .just:\n  print(\
    \ \"Jupiter\" )\ncase .served:\n  print( \"Saturn\" )\ncase .up:\n  print( \"\
    Uranus\" )\ncase .nine:\n  print( \"Neptune\" )\ncase .pies:\n  print( \"Poor\
    \ Pluto\" )\n}\n//Prints \"Saturn\"\n```\n\n## Raw Values and Int Types\n\nBut\
    \ lets say your goal for the moment is the make this like the `C` or `C++` `enum`.\
    \ Actually this is not that hard. Let us redo our `Numbers` `enum`.\n\n```swift\n\
    enum Numbers:Int {\n```\n\nWill actually change the `enum` from an unspecified\
    \ type to type `Int`. It will also give each case item an `Int` value starting\
    \ with zero. If you change your `enum` `Numbers` to include `:Int` it will not\
    \ look any different than the figure above, except for the inclusion of `:Int`.\n\
    \n### Playgrounds have Ghosts\n\nWhen you create a project in `Xcode` in `C` or\
    \ `C++` or `Object-C` or `Swift` the project menu has in addition to `RUN`, `BUILD`,\
    \ etc. a `CLEAN` choice. This is because sometime our projects remember things\
    \ they should not, and we need to rebuild from scratch. `CLEAN` deletes the current\
    \ build and starts from scratch. Playgrounds sometimes remember things, I'll call\
    \ them ghosts, that are no longer there. I mention this because you might find\
    \ one working on this section.\n\nNow we will change `enum Numbers` to `enum Numbers:Int`\
    \ and make a few changes. We will by adding the `:Int` giving our `enum` what\
    \ is referred to as a `rawValue`. This used to be referred to as `toRaw()` but\
    \ that no longer works in the current version of `Swift`. If you try to access\
    \ a `rawValue` without specifying what type your `enum` is you will get an error.\n\
    \nNote that we can begin the number of this `enum` with any `int` value we want.\
    \ The default is 0. If you have any problems with the code below change `case\
    \ ZERO` to `case ZERO = 0`.\n\nEnter this into your playground:\n\n```swift\n\
    enum Numbers:Int { //Note word case before each value. \n\n  case ZERO\n  case\
    \ ONE\n  case TWO\n  case THREE\n  case FOUR\n  case FIVE\n  case SIX\n  case\
    \ SEVEN\n  case EIGHT\n  case NINE\n  case TEN\n} //no need for a ;\n\nvar time:Numbers\
    \ = .FIVE\n\nif  time == .FIVE {\n  print(time.rawValue)\n  let theTime = time.rawValue\n\
    \  print(theTime)\n  print(theTime)\n}\n```\n\n![Image](images/00054.jpeg) (Figure\
    \ 13.4 In Swift the default for numbering is 0 for, in this case, `ZERO`.)\n\n\
    Note that the above case `\"theTime\"` is a constant `Int` which equals 5. It\
    \ is not an instance of the `enum` `Numbers`.\n\nIn the above example `case` is\
    \ on every line, but you do not have to use the word `case` for each new value\
    \ in your `enum`. The code below:\n\n```swift\nenum MyInt: Int {\n  case a\n \
    \ case b\n  case c\n}\n```\n\n(Note: The provided text ends abruptly at the end;\
    \ I have formatted the logic based on the available segments.)\n"
