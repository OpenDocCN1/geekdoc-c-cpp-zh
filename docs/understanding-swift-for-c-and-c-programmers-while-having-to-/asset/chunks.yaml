    \ Let's see what we have to do to make our Swift enum as much like the old as\
    \ possible.   \n\nCreate a new playground for enums. And enter:\n\nenum Numbers\
    \ { //Note word case before each value. This can be done differently but without\
    \ case you cannot have a rawValue—a value of some consistent type.\n\n  case ZERO\n\
    \n  case ONE\n\n  case TWO\n\n  case THREE\n\n  case FOUR\n\n  case FIVE\n\n \
    \ case SIX\n\n  case SEVEN\n\n  case EIGHT\n\n  case NINE\n\n  case TEN\n\n} //no\
    \ need for a ;\n\nThis sets up an enum named Numbers but it has no values. Apple\
    \ likes to call them rawValues.   \n\nVery simply rawValues are values given to\
    \ a enum.\n\nIn Swift \"Numbers\" is now a type and trying to write \n\nenum Numbers\
    \ as you do in C or C++ will lead to an error.  \n\nAn explicit cast will work\
    \ but it is not written as it would be in C or C++.\n\nvar count: enum Numbers\
    \ = .EIGHT //will give you a ERROR\n\nvar count1: Numbers = .EIGHT //will work.\n\
    \nan implicit cast will also work.\n\nvar count = Numbers.EIGHT\n\nNote that to\
    \ set a variable or constant to one of the values in our Numbers, you use a period\
    \ before the value. As in .EIGHT above.\n\nBut our enum Numbers will not have\
    \ any values showing in your playground.\n\n![Image](images/00053.jpeg)(Figure\
    \ 13.3 In Swift values for the enum do not show in the playground until you use\
    \ them as in count and count1 above.)\n\nAs you can see only EIGHT shows in the\
    \ gutter. Add a print(count1) if you like!\n\nThe enum above does not have any\
    \ base or raw values. An enum in swift doesn't actually need base values to be\
    \ effective. Take this enum for instance.\n\nenum PlantsNameHint {\n\n  case my,\
    \ very, eager\n\n  case mother, just, served, up\n\n  case nine, pies\n\n}\n\n\
    var aPlanet = PlantsNameHint.served\n\nswitch(aPlanet){\n\ncase .my:\n\n  print(\
    \ \"Mercury\" )\n\ncase .very:\n\n  print( \"Venus\" )\n\ncase .eager:\n\n  print(\
    \ \"Earth\" )\n\ncase .mother:\n\n  print( \"Mars\" )\n\ncase .just:\n\n  print(\
    \ \"Jupiter\" )\n\ncase .served:\n\n  print( \"Saturn\" )\n\ncase .up:\n\n  print(\
    \ \"Uranus\" )\n\ncase .nine:\n\n  print( \"Neptune\" )\n\ncase .pies:\n\n  print(\
    \ \"Poor Pluto\" )\n\n}\n\n//Prints \"Saturn\"\n\nBut lets say your goal for the\
    \ moment is the make this like the C or C++ enum. Actually this is not that hard.\
    \ Let us redo our Numbers enum.\n\nenum Numbers:Int { \n\nWill actually change\
    \ the enum from an unspecified type to type Int. It will also give each case item\
    \ an Int value starting with zero.  \n\nIf you change your enum Numbers to include\
    \ :Int it will not look any different than the figure above, except for the inclusion\
    \ of :Int.\n\nPlaygrounds have Ghosts\n\nWhen you create a project in Xcode in\
    \ C or C++ or Object-C or Swift the project menu has in addition to RUN, BUILD,\
    \ etc. a CLEAN choice. This is because sometime our projects remember things they\
    \ should not, and we need to rebuild from scratch. CLEAN deletes the current build\
    \ and starts from scratch. Playgrounds sometimes remember things, I'll call them\
    \ ghosts, that are no longer there. I mention this because you might find one\
    \ working on this section.\n\nNow we will change enum Numbers to enum Numbers:Int\
    \ and make a few changes. We will by adding the :Int giving our enum what is referred\
    \ to as a rawValue. This used to be referred to as toRaw() but that no longer\
    \ works in the current version of Swift. If you try to access a rawValue without\
    \ specifying what type your enum is you will get an error.\n\nNote that we can\
    \ begin the number of this enum with any int value we want. The default is 0.\
    \ If you have any problems with the code below change \n\ncase ZERO\n\nto \n\n\
    case ZERO = 0\n\nEnter this into your playground:\n\nenum Numbers:Int { //Note\
    \ word case before each value.  \n\n  case ZERO\n\n  case ONE\n\n  case TWO\n\n\
    \  case THREE\n\n  case FOUR\n\n  case FIVE\n\n  case SIX\n\n  case SEVEN\n\n\
    \  case EIGHT\n\n  case NINE\n\n  case TEN\n\n} //no need for a ;\n\nvar time:Numbers\
    \ = .FIVE\n\nif  time == .FIVE {\n\n  print(time.rawValue)\n\n  let theTime =\
    \ time.rawValue\n\n  print(theTime)\n\n  print(theTime)\n\n}\n\n![Image](images/00054.jpeg)(Figure\
    \ 13.4 In Swift the default for numbering is 0 for, in this case, ZERO.)\n\nNote\
    \ that is the above case \"theTime\" is a constant Int which equals 5. It is not\
    \ an instance of the enum Numbers.  \n\nIn the above example case is on every\
    \ line, but you do not have to use the word case for each new value in your enum.\
    \ The code below:\n\nenum YourInt: Int {\n\n  case a,b,c\n\n}\n\nworks the same\
    \ as with only the name of the enum different.\n\nenum MyInt: Int {\n\ncase a\n\
    \ncase b\n\ncase c\n\n}\n\nYou do need to use the word case at least once to get\
    \ rawValue.\n\nenum errorNum {\n\na, b, c\n\n}\n\n![Image](images/00055.jpeg)(Figure\
    \ 13.5 The word case is missing.)\n\nvar myBubble = MyInt.c\n\nvar yourBubble\
    \ = YourInt.c\n\nprint( myBubble.rawValue)\n\nprint( yourBubble.rawValue)\n\n\
    ![Image](images/00056.jpeg)(Figure 13.6 No difference in using case a, b, c or\
    \ case a<newline> case b<newline> case 3.)\n\nNote there is no difference based\
    \ on having all our enum members being declared on the same line as case or on\
    \ individual lines with case. UNLIKE SWITCHES where all values on the same line\
    \ after case are treated as if they are the same value.\n\n There was a fromRaw()\
    \ in Swift but that had been replaced (As Apple puts it) by:\n\n“Use the init?(rawValue:)\
    \ initializer to make an instance of an enumeration from a raw value.”\n\nExcerpt\
    \ From: Apple Inc. “The Swift Programming Language (Swift 2.1).” iBooks. \n\n\
    There are shades of Apple's Obj-C in that statement. What it means is if you want\
    \ to stick a raw value from our MyInt enum into myBubble using a raw value you\
    \ have to do it like this.\n\nmyBubble = MyInt( rawValue: 0)!    \n\nprint(myBubble)\n\
    \nprint(myBubble.rawValue)\n\n![Image](images/00057.jpeg)(Figure 13.7 Use the\
    \ init?(rawValue:) initializer to make an instance of an enumeration from a raw\
    \ value. )  \n\nEven if we change to a new variable the rawValue: MUST be a member\
    \ of our MyInt enum.\n\nThat is \n\nvar myNewBubble = MyInt( rawValue: 3) WARNING!\
    \ Tries to access a value of MyInt 3 that does not exist in MyInt. So the value\
    \ transferred to myNewBubble will be nil. \n\n![Image](images/00058.jpeg)(Figure\
    \ 13.8 myNewBubble == nil IT DOES NOT EXIST.)\n\nEntering \n\nmyNewBubble!.rawValue\
    \ //here will cause an error!\n\nEntering \n\nmyNewBubble = .b  // you will see\
    \ b in your gutter.\n\nis valid. myNewBubble was set up as an instance of MyInt\
    \ and can now be assigned to valid MyInt values. But myNewBubble, because it was\
    \ originally set to nil is an optional. And it MUST be unwrapped to access its\
    \ rawValue.  \n\n![Image](images/00059.jpeg)\n\n(Figure 13.9 myNewBubble must\
    \ be unwrapped: myNewBubble! )\n\nWhat will happen if you type in:\n\nvar myEvenNewerBubble\
    \ = MyInt.c\n\nmyEvenNewerBubble = MyInt(rawValue:0)\n\nprint (myEvenNewerBubble)\n\
    \n![Image](images/00060.jpeg)\n\n(Figure 13.10 Swift and Xcode will tell you if\
    \ you need to unwrap.)\n\nYou will get an error asking you to unwrap MyInt(rawValue:0)\n\
    \nFixing it will add a ! \n\nLets go back and look at:\n\nvar myNewBubble = MyInt(\
    \ rawValue: 3)\n\nagain. This does NOT need a ! to unwrap it. As its value is\
    \ nil and unwrapping it would create an error. \n\n![Image](images/00061.jpeg)\n\
    \n(Figure 13.11 There is no 3 so unwrapping it causes an error.)\n\nNext we will\
    \ try \n\nvar myNextNewBubble = MyInt(rawValue: nil)  //Fails saying the expected\
    \ value after rawValue has to be an Int.\n\nSo keep in mind with an enum like\n\
    \nenum MyInt2: Int {\n\n  case a, b, c\n\n}\n\nthat if you use Use the init?(rawValue:)\n\
    \nvar someVariable = Name_Of_Enum(rawValue: Some_Int_Not_Included_In_\"Name_Of_Enum\"\
    )(! not needed or Wanted )\n\nsomeVariable = .SOME_VALID_MEMBER_OF_ENUM\n\nsomeVariable(!\
    \ needed).rawValue\n\nvar myNextNewBubble = MyInt2(rawValue:33) //33 is way off\n\
    \nmyNextNewBubble = .a\n\nmyNextNewBubble!.rawValue\n\nAnd if you use"
