    \ = Int.min\n\nlet b = Int64.max\n\nlet c = Int32.max\n\nlet q = Int32.min\n\n\
    let r = UInt32.max  \n\nlet s = UInt.max\n\nUInt being more or less the equivalent\
    \ of an unsigned int in C/C++.\n\nYou can play with the min and max values of\
    \ anything you want from UInt8.max to whatever but in the end you have to admit\
    \ that the good old Int that Swift chooses allows the most bits for the buck and\
    \ the largest possible numbers. \n\nI had a old program that was written mostly\
    \ in C++ that I hooked up to Object-C and made into an App. When putting it together\
    \ the program started acting irregularly.  What happened was that long ago I decided\
    \ to use short instead of int to save space. It was that long ago that it made\
    \ a difference. There was a conflict when I tried to use a short in a function\
    \ that called for an int. Needless to say I changed all the shorts to ints ( I\
    \ could have used #define short int, but whatever ) Unless you have a reason for\
    \ using something like Int32 (matching a value in another program) just use Int.\n\
    \nUse your playground to answer these questions. It is intended for you to try\
    \ this. I've hidden some things here that will expand your knowledge of Swift.\n\
    \nQuestions\n\n1) What is wrong with \n\nlet X = 5\n\nlet z = 5.0001\n\nlet zX\
    \ = z*X\n\nA. The X is big and z is small\n\nB. One is a Float and the other an\
    \ Int\n\nC. One is an Int and the other a Double\n\nD. It should be Z and x.\n\
    \n2) Which is a bigger number: Int.max or Int32.max or UInt16.max or UInt64.max?\n\
    \nA. Int.max\n\nB. Int32.max\n\nC. UInt16.max\n\nD. UInt64.max\n\n3) Which is\
    \ bigger\n\nA. UInt.max\n\nB. UInt64.max\n\nC. UInt8.max\n\nD. Both A and B are\
    \ the same.\n\n4) var a = 5.0001\n\n var b = 2\n\nWhat is the correct way to multiply\
    \ these two so the answer is a Double?\n\nA. let myDouble = a*b\n\nB. var myDouble\
    \ = Int(a) * b\n\nC. let myDouble = Double(b) * a\n\nD. var myDouble = Int(a)\
    \ * Double(b)\n\n5) Will this work?\n\nlet germs = 0.09876\n\nlet cats = 2.00\n\
    \nvar germyCats = germs*cats\n\nA. Yes\n\nB. fleas should be Fleas\n\nC. The Double\
    \ 0.09876 needs to be written as .09876 \n\nD. My cats do not have fleas.\n\n\
    6) How would you assign myDoubleNeg a value of -.69\n\na. let myDoubleNeg = -.69\n\
    \nb. var myDoubleNeg = .69*-1.00\n\nc. let myDoubleNeg = -0.69\n\nd. let myDoubleNeg\
    \ = 0.69*-1\n\n7) Which of these is the correct way to explicitly cast the variable\
    \ \"pounds\" as a double. Choose all that apply.\n\nlet food = 2\n\na. var pounds\
    \ = 2.0\n\nb. var pounds:double_t = 2\n\nc. var pounds:Double = 2\n\nd. var pounds\
    \ = Double(food)"
