  trans: "\n\n```swift\nw += forbar[x];\n}\n\nreturn w;\n}\n```\n\n因此，Object-C 有许多指令写在函数中，就在它们本该出现的地方，这样函数可以更容易被理解。\n\
    \n我们不需要使用它们来将上述 C++ 程序翻译为 Swift：\n\n创建一个新的游乐场（playground）并将其命名为你的函数 playground。输入：\n\
    \n```swift\nvar listOfNumbers = [11,14,56,61,4,2]\n\nfunc giveMeTheAverageMileage(listOfNumbers:\
    \ Array<Int>) -> Int{\n  var total = 0\n  for var i = 0; i < listOfNumbers.count;\
    \ i++ { //我们不需要知道我们的数组有多少个元素 //Swift 会帮我们处理这些。\n    total += listOfNumbers[i]\n\
    \  }\n  return total\n}\n\nprint(giveMeTheAverageMileage(listOfNumbers))\n```\n\
    \n![Image](img/00080.jpeg)\n\n（图 18.1 一个简单的函数，为我们提供一组数字的平均值。）\n\n函数的模型应该是：\n\n\
    `func nameOfFunction( NameOfEntity: type, nameOfNextItemToEnter: type, etc.) ->\
    \ return type{}`\n\n让我们通过我将向你展示的下一个函数示例来看这些内容。它包含：\n\n- 单词：`func`\n- 函数名：`returnPrefix`\n\
    - 参数：`type` `wordToPrefix:String`\n- `.`\n- `.` // 根据需要可以使用任意数量，用逗号分隔\n- `.`\n\
    - 参数：`type` `lengthOfPrefixToReturn: Int`\n- 箭头：`->`\n- 返回类型：`String`\n\n### 作业\
    \ 1\n\n尝试根据你目前所学的内容写一个函数，接收一个 String 和一个长度，并返回该字符串中前长度的字符。完成后，将你的代码与下方的对比。我将使用\
    \ Swift 的 `var str = \"Hello, playground\"` 作为我的字符串。\n\n```swift\nvar str = \"\
    Hello, playground\"\n\nfunc returnPrefix(wordToPrefix:String, lengthOfPrefixToReturn:\
    \ Int) ->String {\n  if lengthOfPrefixToReturn == 0 {\n    return \"\"\n  }\n\
    \  var nextIndexMarker = 1\n  //设置一个字符数组\n  var aPrefix:[Character] = [wordToPrefix[wordToPrefix.startIndex]]\n\
    \n  lengthOfPrefixToReturn\n  nextIndexMarker\n  wordToPrefix.characters.count\n\
    \  while nextIndexMarker < wordToPrefix.characters.count && lengthOfPrefixToReturn\
    \ > nextIndexMarker {\n    aPrefix.append(wordToPrefix[wordToPrefix.startIndex.advancedBy(nextIndexMarker)])\n\
    \    nextIndexMarker++\n  }\n  let result:String = String(aPrefix)\n  return(result)\n\
    }\n\nvar myPrefixString = returnPrefix(str,lengthOfPrefixToReturn: 3)\nprint(myPrefixString)\n\
    ```\n\n![Image](img/00081.jpeg)\n\n（图 18.2 `returnPrefix()` 接收一个字符串和一个长度，并返回该长度的前缀。）\n\
    \n### 作业 2\n\n在结构体（Structs）章节中，我们展示了如何使用\n\n`myBusinessCardDictionary.updateValue(myCard,\
    \ forKey: 5555551212)`\n\n这里的 `updateValue` 要求提供整个 `myCard`。如果你只想更新 `myCard.age`\
    \ 呢？假设 Jan 不想被列为 30 岁。\n\n你能写一个函数来处理这个吗？尝试一下并与下方的解决方案对比。\n\n```swift\nfunc upDateMyCardAge(\
    \ myCard: businessCard, NewValueForAge: Int)->businessCard{\n  var newAgeCard\
    \ = myCard\n  newAgeCard.age = NewValueForAge\n  return newAgeCard\n}\n\nmyBusinessCardDictionary.updateValue(upDateMyCardAge(\
    \ myCard, NewValueForAge: 27), forKey: 5555551212)\n```\n\n![Image](img/00082.jpeg)\n\
    \n（图 18.3 写一个函数来更新我们简单的 businessCard 上的一个值。）\n\n感谢阅读：我们将在即将出版的系列丛书中介绍更多针对 C 和\
    \ C++ 程序员的 Swift。\n\n### 作业 3\n\n在关于 switch 的章节中，我们说如果可能的 switch 是穷尽的（如 true 或\
    \ false 示例），那么就不需要默认（default）：\n\nSwift 在理解给定的 switch 是否穷尽方面表现如何？让我们测试一下。写一个函数，其返回值使得该\
    \ switch 是穷尽的。\n\n```swift\nfunc SOMEFUNC(anIntValue:Int)->Int{\n  //在这里写下你的代码\n\
    }\n\nvar valueToSwitchOn = 5\n\nswitch(valueToSwitchOn){\n  case 1:\n    print(\"\
    Opps\")\n  case 2:\n    print(\"Whoops\")\n  case SOMEFUNC(valueToSwitchOn):\n\
    \    print(\"如果 Swift 不要求默认值则成功。\")\n}\n```\n\n你可以吗？在查看我下方的解决方案（如果我找到了）之前尝试解决。\n\
    \n![Image](img/00083.jpeg)\n\n（图 18.4 我返回输入的值的想法（这总是提供解决方案）不起作用。但如果你是一个 C 或 C++\
    \ 程序员，你应该知道，编译器和程序员都不是完美的。）\n\n**nineteen**\n\n**Playgrounds**\n\n```swift\n//:\
    \ 第 3 章节游乐场 - 名: 人可以玩的地方\n\nimport Cocoa\n\nvar str = \"Hello, playground\"\n\n\
    var bananas = 5\nvar grapes = 6\n\nprint(\"We have \\(grapes) grapes and \")\n\
    ```\n\n"
