    lemons = 5\n\nlimes = 5\n\nlemons = nil\n\nlimes = nil\n\npeaches = nil\n\nThe\
    \ last item peaches = nil will generate an ERROR. Only conditionals can have a\
    \ nil value. That is *nil* is no value at all. \n\nUnlike other languages in Swift\
    \ a nil is not a pointer to a nonexistent object. That is we can think of pointers\
    \ in C and C++ as being like a library reference card. Imagine a library where\
    \ you have a card file—like the old days where paper cards in an alphabetically\
    \ organized drawer listed the book's location. And the book was on a shelf organized\
    \ by the Dewey Decimal System. A pointer is like the library reference card and\
    \ it points to the books location. The book is like a value at that location.\n\
    \nIn a real library the book can be gone with the card in the file. In C and C++\
    \ a filled out card **MUST** always point to a spot on the shelf and the book\
    \ must be there or we invite disaster.   \n\nFor programming example in C++ that\
    \ may refresh this in your mind check out the next section. If you don't feel\
    \ you need a refresher skip to the following section.\n\n![Image](images/00027.jpeg)\n\
    \n(Figure 9.1 Once set with a value peaches can't be nil)\n\nIf you are up on\
    \ your C or C++ and are clear on how a pointer can cause a crash you can skip\
    \ ahead to the next chapter. Otherwise enjoy this refresher.\n\nCreate a new console\
    \ project.\n\n![Image](images/00028.jpeg)\n\n(Figure 9.2 Set up a Command Line\
    \ tool Project.)\n\nI've named mine libraryCardAndFileTest. You can name yours\
    \ whatever you wish.\n\n![Image](images/00029.jpeg)\n\n(Figure 9.3 Name Your Project.)\n\
    \nClick Next, confirm the location and you should see this:\n\n![Image](images/00030.jpeg)\n\
    \nafter \n\n#include <iostream>\n\nadd\n\nusing  namespace  std;\n\nThen delete\
    \ the highlighted section and replace with the code below within the /////… breaks\
    \ below.\n\n(be sure, after pasting to delete the credits at the bottom.)\n\n\
    /////////////////////////////////////////////////////////////////////\n\n  int\
    \ book = 1999334; //we have put a book # 1999334 on the shelf.\n\n  int *libraryCardPtr\
    \ = &book; //This is our library reference card pointing to our book. &book is\
    \ the shelf location of book\n\n  cout << \"*libraryCardPtr is: \" << *libraryCardPtr\
    \ << \" the book itself.\\nlibraryCardPtr == \" << libraryCardPtr << \" is the\
    \ books location in memory. \\nand book == \" << book << \" the book itself same\
    \ as *libraryCardPtr\\n\\n\"; // value pointed to by pointer\n\n libraryCardPtr\
    \ = 0; //we set the library card to blank\n\n  cout << \"Now we will set libraryCardPtr\
    \ to zero. libraryCardPtr = \" << libraryCardPtr << \"\\n\\n\";\n\n  cout << \"\
    Because libraryCardPtr is Null referencing *libraryCardPtr would cause a crash\
    \ and so cannot be referenced. \\n libraryCardPtr == \" << libraryCardPtr << \"\
    \\nand book == \" << book << \" it is still on the shelf but is no longer pointed\
    \ to by the card. The card is blank. \\n\\n\"; // value pointed to by pointer\n\
    \n  cout << \"We would get an ERROR if we try to locate the book via the card\
    \ as the card libraryCardPtr = \" <<libraryCardPtr << \" \\n\\n\";\n\nreturn 0;\n\
    \n//////////////////////////////////////////////////////////////////////////\n\
    \nPutting a blank card in the file (yet to be filed out) is like a null pointer.\
    \  \n\nIf there is no book, the card is blank, the pointer points to a location\
    \ where nothing is there. And in C and C++ referencing a null pointer can crash\
    \ a program.\n\n  int *cardForBookYetToBeEntered = 0;\n\n  cout << \"cardForBookYetToBeEntered\
    \ = \" << cardForBookYetToBeEntered << \" a blank card. \\n\\n\";\n\nTrying to\
    \ do the line below:\n\ncout << *cardForBookYetToBeEntered; //will cause an error\n\
    \nThe above example is similar to a library where the book has not been removed\
    \ but the library reference card no long points to it. Try adding the code below\
    \ to your libraryCardAndFileTest C++ project \n\nbefore the:\n\nreturn 0.\n\n\
    ////////////////////////////////////////\n\n  int size = 1;\n\n  int *intBlockPtr\
    \ = (int*)malloc(size*sizeof( int ));\n\n  cout << *intBlockPtr << \" = intBlockPtr\\\
    n\\n\";\n\n *intBlockPtr += 10000789; //we have created shelf space and added\
    \ book 10000789\n\n  cout << \"*intBlockPtr == \" << *intBlockPtr << \"\\n\\n\"\
    ;\n\n  cout << \"intBlockPtr == \" << intBlockPtr << \"\\n\\n\";"
