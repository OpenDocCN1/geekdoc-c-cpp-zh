- fmt: "\n# Comment inclusion\n\n`Comment inclusion` is pretty much as it is in C\
    \ and C++. I am mentioning it first as you may need to comment out errors you'll\
    \ make as we go along.\n\nAs I said in the foreword: The best programmer is the\
    \ one whose made the most mistakes and learned by them.\n\n```swift\n// makes\
    \ a line a comment\n\n/* makes a longer comment over many lines */\n```\n\nThey\
    \ are both not included in a program or a playground as code.\n\nThe two declarations\
    \ below introduced by `var` are like\n\n`int bananas = 5;`\n\nand\n\n`int grapes\
    \ = 6;`\n\nin C and C++ though they are more than ints. We will talk more about\
    \ this in Constants and Variables. But for now this is simply an example for printing.\n\
    \n```swift\nvar bananas = 5  // note this used to not have the `()` at the end\
    \ but that has been changed.\n\nvar grapes = 6 \n\n/* note this used to not have\
    \ the `()` \nat the end but that has been changed. */\n```\n\n# Print has replaced\
    \ println\n\nWhen Swift came out `println()` was the way to print to the something.\
    \ Apple has changed this to `print()`. But think of it still as `println` because\
    \ it prints a line including a return `\\n` at the end. You will see this in action\
    \ soon. To print a variable or constant within a `print()` statement you would\
    \ use something like `print(\"We have \\(grapes) grapes and \\(bananas) bananas\"\
    )`.\n\n```swift\nprint(\"We have \\(grapes) grapes and \\(bananas) bananas\")\n\
    ```\n\nNote QUOTES MUST NOT BE SMART QUOTES.\n\nSwift's default for the end of\
    \ a `print()` is `\\n`, however we can by change that if we wish with the `terminator:`.\
    \ Type this into a playground:\n\n```swift\nprint(\"We have \\(apples) apples\
    \ and \\(oranges) oranges\", terminator: \"\")\n\nprint(\" and \\(pears) pears\"\
    )\n```\n\n![Image](images/00008.jpeg)\n\n( Figure 3.1 using `print()` with and\
    \ without terminator )\n\nwith the line ending set to an empty String `\"\"` the\
    \ two `print` commands combine on one line when we print the lines. This will\
    \ be helpful later when we want successive loops of one kind or another to combine\
    \ data on one line.\n\n**Do not forget the `:` after terminator!**\n\nThis `print-function(something\
    \ to print, terminator: \"\")` is a vestige of Object-C.\n\n# Finally:\n\nin the\
    \ example playgrounds or projects I may have a line such as\n\n```swift\nlet diamonds\
    \ = 5\n\n//diamonds = 7 //uncomment to see error\n```\n\nThis means remove the\
    \ first two `//` on the line\n\n```swift\ndiamonds = 7  // uncomment to see error\n\
    ```\n\nI have always used what is called `camelCaseLettering` that is I write\
    \ constants and variables with the first word in lowercase connected to all the\
    \ rest of the words with an upper case first letter. I occasionally vary this\
    \ but for the most part you can assume my variables and constants will be so named.\n\
    \n```swift\nvar howManyBananas = 3\n```\n\n# Operators\n\nIn Swift operators are\
    \ for the most part pretty much like the ones in C and C++. We will be using them\
    \ shortly so lets look at them first.\n\n### MATH OPERATORS\n\n- `=` Sets one\
    \ thing equal to another\n- `+` Adds one thing to another\n- `-` Subtracts one\
    \ thing to another\n- `*` Multiplies one thing by another. IT HOWEVER DOES NOT\
    \ INDICATE A POINTER. No pointers in Swift.\n- `/` Divides one thing by another\n\
    \n```swift\nvar addition = xInt + yInt\n\nvar multiplication = addition * addition\n\
    \nvar subtraction = multiplication - yInt\n\nvar division = (subtraction * multiplication)/addition\n\
    ```\n\n`%` Modulus Operator gives the remainder when one thing is divided by another.\
    \ HOWEVER in Swift you can \\get the reminder of a `Double` divided by a `Double`\
    \ as a `Double`. Whereas in C and C++ remainders were always ints. This means\
    \ you need to be careful, if say you are using a Modulus Operator to determine\
    \ if a result is even or odd.\n\n![Image](images/00009.jpeg)\n\n( Figure 4.1 using\
    \ modulus on a double. )\n\n- `+=` Adds left item to right.\n- `-=` Subtracts\
    \ left item from right.\n- `++` at the end of a variable increase it by one. It\
    \ is the equivalent of `var negtiveItem += positiveItem` (Ints only. Try it with\
    \ a `Double`.)\n- `—` At the end of a variable decreases it by one. It is the\
    \ equivalent of `var negtiveItem -=negtiveItem` (Ints only. Try it with a `Double`.)\n\
    \n```swift\nvar xInt = 1\n\nvar yInt = 1\n\nprint(--xInt) //subtracts one before\
    \ printing\n\nprint(yInt--) //subtracts after before print\n\nprint(yInt)  //shows\
    \ the subtracted one\n```\n\nPrints\n0\n1\n0\n\nCheck for yourself that if we\
    \ add after the above\n\n```swift\nprint(++xInt)\n\nprint(yInt++)\n\nprint(yInt)\n\
    ```\n\nPrints\n1\n0\n1\n\n### CONTINGENCY OPERATORS applying to Boolean Answers\n\
    \n- `||` OR operator one or the other must be as expected\n- `&&` AND operator\
    \ both must be as expected\n\n### COMPARISON OPERATORS returning Boolean Values\n\
    \n- `==` One thing is equal to another\n- `>=` Left side object is less than or\
    \ Equal To right side.\n- `<=` Left side object is greater than or Equal To right\
    \ side.\n- `!=` Things are not equal to each other\n\n### New Operators (Very\
    \ specifically located. Discussed later)\n\n- `?` Indicates an item has no set\
    \ value yet. This is called an optional value.\n- `!` A conditional somewhat similar\
    \ to the `?` but this says the optional value will never be nil after being given\
    \ a value.\n\nSwift also has range operators.\n- `...` is a closed range operator\
    \ that includes the right.\n- `..<` is a half-open range operator that does not\
    \ include the right.\n\n# Constants and Variables\n\nIn C and C++ you label the\
    \ kinds of data. In Swift, `let` and `var` introduce the kinds. Note that unlike\
    \ C and C++ you do not need a semicolon. The end of the line is assumed. You can\
    \ put in semicolons if you wish.\n\n`let` creates a constant. And unlike C/C++\
    \ where you explicitly declare what type you are creating, Swift can infer it\
    \ by what you enter.\n\n`let` creates a constant, a value that CANNOT have a different\
    \ value. For example `let myConstX = 5` is much like `const int ConstX = 5`.\n\
    \n`var` creates a variable whose value can change. Is much like `int x = 5`. For\
    \ example `var x = 5` is like `int x = 5;`.\n\n```swift\nimport Cocoa\n\nvar str\
    \ = \"Hello, playground\"\n\nvar x = 5\n\nlet myConstX = 5\n\nvar z = 5.00\n\n\
    var y = 5.01\n\nvar myDoubleX = 5.0000001\n\nvar mySmallDouble = .69\n```\n"
