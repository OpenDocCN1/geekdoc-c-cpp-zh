  trans: "\n```swift\nvar someOtherVariable = Name_Of_Enum(rawValue: Some_Int_Included_In_Name_Of_Enum)(!\
    \ needed)\n\nsomeOtherVariable = .SOME_VALID_MEMBER_OF_ENUM\n\nsomeOtherVariable(!\
    \ not needed or Wanted ).rawValue\n\nvar myEvenNewerBubble = MyInt2.c\n\nmyEvenNewerBubble\
    \ = MyInt2(rawValue:0)!\n\nmyEvenNewerBubble.rawValue\n\nprint (myEvenNewerBubble)\n\
    ```\n\n如果你回答了下面的问题，你将会发现枚举 `enum SomeFloatEnum: Float {}` 与 `enum SomeIntEnum:\
    \ Int{}` 没有太大区别。\n\n但字符串又是呢？输入：\n\n```swift\nenum MyStringEnum: String {\n  case\
    \ sweet = \"Sweet\", young, thing\n}\n```\n\n```swift\nvar string1 = MyStringEnum.sweet\n\
    \nstring1.rawValue\n\nstring1 = .young\n\nstring1.rawValue\n```\n\n![Image](img/00062.jpeg)\n\
    \n（图 13.12 使用 `rawValue` 查找枚举的值。）\n\n由于为 `young` 没有提供 `String`，系统为我们提供了字符串 `\"\
    young\"`。\n\n```swift\nenum myCountingString: String {\n  case one, two, three\n\
    }\n```\n\n```swift\nvar countTwo = myCountingString.two.rawValue\n\ncountTwo ==\
    \ \"Two\"\n```\n\n本节的最后一个注意事项。请记住以下者之间的区别：\n\n```swift\nenum MyIntToo: Int{\n\
    \  case a, b, c, d\n}\n```\n\n```swift\nlet ace = MyIntToo.a\n\nlet doc = MyIntToo.a.rawValue\n\
    ```\n\n在这里 `ace == a`，它是 `MyIntToo` 的一个实例，但 `doc == 0` 仅仅是一个 `Int`。没有 `doc.a`、`doc.b`\
    \ 或 `doc.c` 或 `doc.d`。\n\n枚举的第一节就此结束。在涵盖另外几个主题后，我们将在第二书中回到它们。关于枚举我们还可以做更多事情。\n\
    \n### 问题\n\n1) 给定：\n\n```swift\nenum An_ENUM: Int {\n  case a, b, c\n}\n```\n\n\
    var Y = Int!()\nvar X = An_ENUM(rawValue: Y)\n\na. `var z = An_ENUM.a`\n`z` 将等于\
    \ `2` (`z == 2`)\nb. `var Y = Int!()` 会导致致命错误\nc. `var X An_ENUM(rawValue: Y)`\
    \ 会导致致命错误\nd. `var X` 将为 `nil`\n\n2) 给定：\n\n```swift\nenum aLittleEnum: Int {\n\
    \  case a = 15 ,b,c,d,e,f,g\n}\n```\n\nvar w = aLittleEnum.c\n\n`w.rawValue` 将是什么？\n\
    a. 2\nb. 3\nc. 17\nd. 18\n\n3) 给定：\n\n```swift\nenum MyFloatEnum: Float {\n  case\
    \ a, b, c, d, q, e, m\n}\n```\n\nvar f = MyFloatEnum.e\n\n`f.rawValue` 将是什么？\n\
    a. nil\nb. 致命错误 (FATAL ERROR)\nc. 3.0\nd. 5.0\n\n**十四**\n\n### 字典 (Dictionaries)\n\
    \n当我用 C 或 C++ 工作时，我有时会创建数组数组：\n\n```cpp\nint myArrayOfArrays[10][10];\n```\n\n\
    或者\n\n```cpp\nint myArrayOfArraysOfArrays[10][10][10]; // 依此类推\n```\n\n在 Swift\
    \ 中你并没有看到很多这种操作。你可以设置一个包含 1000 个 `Int` 值的 `Array`：\n\n```swift\nvar aThousandIntArray\
    \ = Int\n```\n\n然后对其中的值进行操作。但点始终是以我们我们需要的方式收集数据。Swift 确实给了我们在所谓的字典（dictionary）中收集数据的机会。它并不像\
    \ `int myArrayOfArrays[10][10];`；但你可以创建一个相似的东西。\n\n假设我们创建了一个包含 100 个值的 `myArrayOfArrays`，并说\
    \ `myArrayOfArrays[0][0] = 5;` `myArrayOfArrays[0][1] = 7;` `myArrayOfArrays[0][2]\
    \ = 9;` 直到 `myArrayOfArrays[10][10] = 122;`\n\n```swift\nvar A_DICTIONARY_NAME:[Int\
    \ : Int] = [ 0 : 5, 1: 7, 2 : 9]\n```\n\n相反 Swift 使用的是字典。每个字典条目由两个项目组成，第一个是键（key），第二个是值（value）。这里有一个键值都是字符串的字典：\n\
    \n```swift\nvar myExampleDictionary: [ String : String] = [\"Key\" : \"Value\"\
    ]\n```\n\n`Dictionary` 中的项目在哈希表中按其键排序，用户永远看不到这个哈表。Swift 在后台处理了排序。简单来说，Swift 接收你的\
    \ `Key`，将其拆分为可排序的代码并在你需要时找到你的 `Key`。键可以是任何类型，`Int`、`Double`、`String`，只要可以转换为哈希值进行存储即可。值可以是任何类型。\n\
    \n可以显式创建一个字典：\n\n`var or let dictionaryName(colon:) [ type name for key (colon:)\
    \ type name for value] = [key of specified type (colon:) value of specified type\
    \ (如果需要，用逗号分隔) …. key of specified type (colon:) value of specified type ]`\n\n\
    你可以使用字典来收集姓和名，名字按姓氏排序：\n\n```swift\nvar myDictionary:[ String : String] = [\"\
    LastNameOne\":\"David\", \"LastNameTwo\": \"Two\"]\n```\n\n（注：原文提供的文本包含大量重复和混乱的内容，此处翻译已进行清理并保留核心逻辑。）\n"
- fmt: "\n`myDictionaryTenTen.count` //still equals 101\n\nas does \n\n`myDictionaryTenTen[3*33]\
    \ = (3*33 + (3*33 % 10) * 2) + 5`\n\nalso gives us a count of 101. The keys are\
    \ evaluated as per their declaration, in this case and `Int`. \n\n## Removing\
    \ A Value\n\nApple gives us `removeValueForKey(_:)` as the way to remove something.\n\
    \nAgain we have to attach this to our dictionary's name and put in only the key.\n\
    \n```\nmyDictionaryTenTen.count\nmyDictionaryTenTen[100]\nmyDictionaryTenTen[199]\n\
    myDictionaryTenTen.count\nmyDictionaryTenTen.removeValueForKey(199)\nmyDictionaryTenTen[199]\n\
    myDictionaryTenTen.count\n```\n\n![Image](images/00065.jpeg)\n\n(Figure 14.3 Showing\
    \ results for using `.count` and `.removeValueForKey()`)\n\nNote that although\
    \ there are 101 items in our dictionary the key 100 is shown as `nil`. After the\
    \ value for key 199 is removed that too is shown as `nil`.\n\nAlso note that `myDictionaryTenTen.removeValueForKey(199)`\
    \ gives us the value removed:\n\n222 \n\nAs we learned in our For-In-Loop we can\
    \ use the For-In-Loop to go through our dictionary. For fun lets put our value\
    \ for key 199 back\n\n```\nmyDictionaryTenTen[199] = 1000\n\nfor(whoCaresWhatICallTheKey,\
    \ whoCaresWhatICallTheValue) in myDictionaryTenTen {\n  print( \"\\(whoCaresWhatICallTheKey):\\\
    (whoCaresWhatICallTheValue)\")\n}\n```\n\nTry it in your playground!\n\nLets try\
    \ something new type into your playground.\n\n```\nprint(myDictionaryTenTen.keys)\n\
    print(myDictionaryTenTen.values)\n```\n\nNot to impressive yet? Well you wouldn't\
    \ use `.keys` or `.values` in that way. What you might do is something like this.\n\
    \n```swift\nfor SomeSillyValue in myDictionaryTenTen.values {\n  if SomeSillyValue\
    \ % 11 == 0 {\n    print(\"SomeSillyValue) \"\n  }\n}\n```\n\nAnd We Get:\n\n\
    55\n99\n33 \n66\n110\n88\n33\n77\n44\n\nWhat `.keys` and `.values` tells Swift\
    \ is to single out either keys or values. \n\nfifteen\n\n## Working With Strings\n\
    \nStrings are a little different in Swift. In C and C++ strings were char arrays\
    \ filed with characters. \n\ninstead of \n\n`char aLetter = 'a';`\n\nWe have \n\
    \n```swift\nvar aLetter = \"o\";\nvar anotherletter: Character = \"k\"\n```\n\n\
    note we use double quotes [NEVER SMART QUOTES] for Characters. For now, just keep\
    \ Characters in mind.\n\nHow do we know that these are indeed Characters and not\
    \ Strings?\n\nWe can add Strings together in Swift but we adding Characters is\
    \ a bit more complex.\n\n```\nvar word = aLetter + anotherLetter\n```\n\n![Image](images/00066.jpeg)(Figure\
    \ 15.1 Characters in Swift cannot be SIMPLY added together to form Strings.)\n\
    \nSo the above gives us an error message. We cannot just add Characters. We will\
    \ see later we can append a Character to a word but that takes a little care.\
    \ \n\nIs there such a thing as an implicit Character?\n\n```swift\nvar myWord1\
    \ = \"n\"\nvar myWord2 = \"o\"\nvar myFinalWord = myWord1 + myWord2\n```\n\n![Image](images/00067.jpeg)\n\
    \n(Figure 15.2 If you can add two single character variables or constants together\
    \ they are Strings not Characters.)\n\nAs you can see Swift interpreted `myWord1`\
    \ and `myWord2` as Strings and not Characters.\n\nCharacters like Floats have\
    \ to be explicitly declared.  \n\nSo my first question when I looked at Strings\
    \ in Swift was how do I access the individual Characters? Let's try to access\
    \ a character in our \"Hello, playground\" `str`. \n\n```swift\nvar aThirdLetter:\
    \ Character = str[0] //crashes\n```\n\n![Image](images/00068.jpeg)\n\n(Figure\
    \ 15.3 You cannot set a value for a Character by pointing to a location in a String\
    \ using Ints.)\n\nHow do we get ahold of the individual characters in a Sting\
    \ like `str` that Swift gave us when we opened the playground. i.e. `var str =\
    \ \"Hello, playground\"`\n\nThis used to work but no longer:\n\n![Image](images/00069.jpeg)\n\
    \n(Figure 15.4 This no longer works as is.)\n\nNow one way to do this is to append\
    \ `.characters` at the end of our String. \n\n```swift\nfor myCharacter in str.characters{\n\
    \  print (myCharacter)\n}\n```\n\n//results in\nH\ne\nl\nl\no\n,\np\nl\na\ny\n\
    g\nr\no\nu\nn\nd\n\nAnother slightly different way to do the same thing is:\n\n\
    ```swift\nfor index in str.characters.indices {\n  print(\"\\(str[index])\")\n\
    }\n```\n\nTry the above and see if it give you the same results. In the first\
    \ we access the characters directly. In the second we get the index of each character\
    \ and then find it in the string using `str[index]`. The important thing to remember\
    \ is the index is not equivalent to an `Int`. \n\n```swift\nvar myOtherCharacter\
    \ = str[index]\n```\n"
