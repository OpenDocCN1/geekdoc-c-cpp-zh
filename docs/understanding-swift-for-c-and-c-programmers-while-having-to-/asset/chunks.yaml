  trans: "\n```swift\nvar aNewStringArray = Array<String>()\n\nvar anotherNewStringArray\
    \ = [Array]()\n```\n\n![Image](img/00024.jpeg)\n\n(图 7.6 在添加 `aNewStringArray[0]\
    \ = \"me\"` 后，`aNewStringArray` 看起来是什么样？）\n\n在你的 playground 中尝试一下。点击 `Array<Int>()`\
    \ 中的 `Array` 单词，查看使用新数组的可能方法。下面是一些示例：\n\n```swift\nvar kot = Array<String>()\n\
    kot = [\"What\",\"is\"]\n```\n\n按住苹果 键并将光标停在 `Array` 上，你会看到可用的扩展\n\n![Image](img/00025.jpeg)\n\
    \n(图 7.7 从数组中添加和删除项目的方法。）\n\n`kot.count` 告诉我们数组中有多少项目。我们将在循环部分使用它。\n\n当我们谈到循环时，将讨论如何遍历和打印数组。\n\
    \n**问题：** 按住 command 键并将光标停在 `Array` 上，并在扩展中找到这些问题的答案。\n\n1. 这里的 result 是什么？\n\
    \   ```swift\n   var result = kot + aStringArray\n   ```\n   a. \"Fee Fi Fo Fum\"\
    \n   b. [\"ma\",\"my\",\"mo\",\"What\", \"is\", \"your\", \"name\"]\n   c. ERROR\n\
    \   d. [\"What\", \"is\", \"your\", \"name\", \"me\", \"my\", \"mo\",\"mum\"]\n\
    \n2. 对于上面的 `aNewIntArray`，`aNewIntArray.isEmpty` 会返回什么。\n   a. true\n   b. false\n\
    \   c. nil\n\n3. 对于 `aNewIntArray` 类型：\n   ```swift\n   aNewIntArray.insert(-1,\
    \ atIndex: 0)\n   ```\n   现在如果你尝试\n   ```swift\n   aNewIntArray.popLast()\n  \
    \ ```\n   将返回什么\n   a. -1\n   b. 4\n   c. 10\n   d. 1\n\n4. 你会在你的 playground 中中使用这个\
    \ `Array` 扩展？\n   ```swift\n   public init(count: Int, repeatedValue: Element)\n\
    \   ```\n\n5. 从你的 `kot` 数组中删除所有内容的简单方法是？\n   a. `kot.removeAll()`\n   b. `kot.capacity\
    \ = 0`\n   c. `kot = nil`\n\n6. 数组可以包含不同类型的元素吗？\n   a. 是\n   b. 不\n   c. 取决于情况\n\
    \n7. `var someElementTypeArray:[这里填写什么使其成为有效的 Array] = [\"My\", \"Mom\"]`\n\n\
    **答案：**\n1. d\n2. b. false\n3. c. 10\n4. `var list = Array<Int>(count: 4, repeatedValue:\
    \ 6)`\n   `var list2 = Int`\n5. a. `kot.removeAll()`\n6. b. 数组元素必须全部相同。\n\n###\
    \ 八\n\n### If else\n\n在 `if` 语句中真的不需要提到 `then`。因此 Swift 并没有 `then`，甚至不需要 `()`。由于\
    \ `if` 语句的工作方式与 `C` 和 `C++` 类似，仅有细微差异，我们将快速过一遍这些差异。\n\n`if` 语句包含一个条件语句，如果该语句解析为\
    \ `true`，它将执行返回“真”的指令。\n\n（* 注意：我没有说 \"is\" true，因为那意味着你的数据等等是正确的。）\n\nSwift 中的\
    \ `if` 语句后面总是跟着括号：\n\n```swift\nif (true)\n{ \n  // 魔法发生的地方\n}\n```\n\n在下面我们可以买糖果。如果有其他可能，我们可以添加一个\
    \ `else` 语句。**不同于** `C` 和 `C++`，你必须使用括号。\n\n```swift\nvar pennies = 5\nlet enoughToBuyCandy\
    \ = 5\n\nif pennies >= enoughToBuyCandy{\n  print(\"We may buy candy!\")\n}\n\n\
    var numberOfPenniesString = \"pennies\"\npennies = 4\n\nif enoughToBuyCandy -\
    \ pennies == 1{\n  numberOfPenniesString = \"penny\"\n}\n\nif pennies >= enoughToBuyCandy{\n\
    \  print(\"We can may candy!\")\n} else {\n  print(\"We go home candy less \\\
    (enoughToBuyCandy - pennies) \\(numberOfPenniesString) short.\")\n}\n```\n\n我们得到：We\
    \ go home candy less 1 penny short\n\n正如在 `C` 和 `C++` 中一样，我们可以有一个 `else if`。\n\
    \n```swift\npennies = 7\n\nif enoughToBuyCandy - pennies == 1{\n  numberOfPenniesString\
    \ = \"penny\"\n}\n\nif pennies == enoughToBuyCandy{\n  print(\"We may buy candy!\"\
    )\n} else if pennies > enoughToBuyCandy {\n  print(\"We may get \\(  pennies -\
    \ enoughToBuyCandy) pennies worth more of candy.\")\n}else{\n  print(\"We go home\
    \ candy less \\(enoughToBuyCandy - pennies) \\(numberOfPenniesString) short.\"\
    )\n}\n```\n\n我们得到：We may get 2 pennies worth more of candy.\n\n![Image](img/00026.jpeg)\n\
    \n（图 8.1 使用 if else 操作的硬币。）\n\n### 九\n\n### 可选类型 (Optionals)\n\n什么是可选类型？在你的 playground\
    \ 中输入：\n\n```swift\nvar lemons = Int?()\nvar limes = Int!()\nvar peaches = 5\n\
    \nlemons = 5\nlimes = 5\nlemons = nil\nlimes = nil\npeaches = nil\n```\n\n最后一个项目\
    \ `peaches = nil` 将产生一个 `ERROR`。只有条件可以有 `nil` 值。也就是说 `nil` 根本没有值。\n\n与其他语言不同，Swift\
    \ 中的 `nil` 并不是指向一个不存在对象的指针。也就是说，我们可以把 `C` 和 `C++` 中的指针想象成索引卡片。想象一个图书馆，你有一组卡片——就像旧时代按字母顺序排列的抽屉列出了书的位置。而书在按杜伊分类法组织的书架上。一个指针就像一张索引卡片，它指向书的位置。书就是该位置的值。\n\
    \n在真实的图书馆中，卡片还在，书可能已经没了。在 `C` 和 `C++` 中，一张填写好的卡片**必须**指向书架上的某个位置，且书必须在那里，否则就会导致灾难。\n\
    \n为了复习 `C++` 中的编程示例，请查看下一节。如果你觉得不需要复习，请跳到后续章节。\n\n![Image](img/00027.jpeg)\n\n\
    （图 9.1 一旦设置了值，peaches 就不能为 nil）\n\n如果你熟悉 `C` 或 `C++` 并且清楚指针如何导致崩溃，你可以跳到下一章。否则，请享受这个复习。\n\
    \n创建一个新的控制台项目。\n\n![Image](img/00028.jpeg)\n\n（图 9.2 设置指针。）\n\n`var lemons = Int?()`...你可以随心所命名。\n\
    \n![Image](img/00029.jpeg)\n\n（图 9.3 你的项目。）\n\n![Image](img/00030.jpeg)\n\n```cpp\n\
    #include <iostream>\nusing namespace std;\n```\n\n然后删除高亮部分：\n\n```cpp\n  int book\
    \ = 999334;\n  int *libraryCardPtr = &book;\n```\n\n"
- fmt: "\n```cpp\ncout << \"Now we free( intBlockPt\\n\\n\"; //we have deleted the\
    \ shelves and floor\n\nfree(intBlockPtr);\n\ncout << \" intBlockPtr = \"<< intBlockPtr\
    \ << \"\\n\\n\"; // the pointer still points at the location\n\n//but the complier\
    \ thinks the block is free. Here is this small program the line below might still\
    \ work. However. the complier could write something else there with disastrous\
    \ results.\n\ncout << \" *intBlockPtr = \"<< *intBlockPtr << \"\\n\\n\";\n\n///////////////////////////////////////////////////\n\
    \nreturn 0;\n\n///////////////////////////////////////////////////\n```\n\nAsking\
    \ for the book at a location that has been erased can cause an error.\n\nPointing\
    \ to a spot that has been deallocated in memory is like sending someone to a library\
    \ reference card location where the shelf is gone and where they will fall through\
    \ the floor.\n\nIn C and C++ each book requires a reference card and a shelf space.\
    \ In our analogy both take up memory.\n\nIn Swift, however, a `var`iable set to\
    \ nil means it has NO VALUE of any kind yet. Swift does not have pointers. It\
    \ is like not having library reference cards at all. Nil tells you that the book\
    \ does not exist, period.\n\nWhat about constant values? Try setting `let` dogs\
    \ = `Int()` and see what happens. One of those little red error circles with a\
    \ solution will come up when you try to set `dogs` to some real value and `let`\
    \ will be changed for you to `var`. Constants cannot be optionals.\n\nLets play\
    \ a bit with optionals. Referencing a nil value will cause problems. How can we\
    \ use optionals to prevent that? There is a lot to understand here, so bear with\
    \ me if you have questions until the end.\n\nLets imagine you don't know what\
    \ a value is when you start out. You have 1 dollar but don't know how many apples\
    \ you can buy for that $1.\n\n```swift\nvar apples = Int?() //note this used to\
    \ not have the () at the end but that has been changed.\n\nif  apples >= 1{\n\
    \  print(\"We have \\(apples)\")\n} else {\n  print(\"We ain't got no apples today!\"\
    )\n}\n```\n\n![Image](images/00031.jpeg)(Figure 9.4 Avoiding a value equal to\
    \ nil.)\n\nNote that the in the gutter `var apples` is given a value of `nil`.\
    \ And that the `if else` knows that `nil` is not greater than or equal to 1\\\
    . \n\nBut what if continuing from that you add.\n\n```swift\nlet applesPerCrate\
    \ = 20\n\nvar appleCratesNeeded = apples/applesPerCrate\n```\n\n![Image](images/00032.jpeg)(Figure\
    \ 9.5 Swift complains bout an unwrapped value.)\n\nWe get an error. The circle\
    \ with the dot in the center error indicates that if we click on it, it will show\
    \ us possible fixes for the error. This is as opposed to the exclamation point\
    \ in a circle which does not offer possible changes.\n\n![Image](images/00033.jpeg)(Figure\
    \ 9.6 Clicking on the red circle for further info.)\n\nAbove a solution is presented\
    \ if we click on the lower circle with a white dot. \n\n![Image](images/00034.jpeg)\
    \ (Figure 9.7 Exploring the error even further.)\n\nClicking on the blue Fix-it\
    \ Solution will result in the line changing to:\n\n```swift\nvar appleCratesNeeded\
    \ = apples!/applesPerCrate\n```\n\nNote the insertion of a `!` after `apples`\
    \ and before the division slash `/`. This is called a forced unwrapping. However\
    \ this, as written (because `apples` are `nil`) also fatally crashes.\n\nWhat\
    \ does it mean when the program says that \"Value of optional type 'Int?' is not\
    \ unwrapped? Well very simply: \n\n```swift\nvar potatoes = 1\n```\n\nImplicitly\
    \ casts `potatoes` as an `Int`. That is the program assumes `potatoes` is an `Int`.\n\
    \n```swift\nvar motatoes = Double(1)\n```\n\nExplicitly casts `potatoes` as an\
    \ `Double`. \n\n```swift\nvar apples = Int?()\n```\n\nExplicitly casts `apples`\
    \ as an `Int` but the value of `apples` has not been unwrapped.\n\nvar appleCratesNeeded\
    \ = apples/applesPerCrate\n```\n\nIn the above `apples` has not been unwrapped.\
    \ But it needs to be so Swift asks above do you want to unwrap `apples`. \n\n\
    ![Image](images/00035.jpeg) (Figure 9.8 You are asked if you want to unwrap apples.)\n\
    \nTo do so you write it this way.\n\n```swift\nvar appleCratesNeeded = apples!/applesPerCrate\n\
    ```\n\n```swift\nvar pears = Int!() \n```\n\nExplicitly states that `pears` is\
    \ an \"unwrapped\" `Int`. because it is explicitly unwrapped you could write:\n\
    \n```swift\nvar pearCratesNeeded = pears/applesPerCrate\n```\n\nwithout an exclamation\
    \ mark needed after `pears`.\n\nWe'll show you how to make a forced unwrapping\
    \ work soon. First I want to show what Swift will do in various circumstances.\
    \ \n\n![Image](images/00036.jpeg) (Figure 9.9 apples is unwrapped but where is\
    \ its unwrapped value?)\n\nSo lets start over. Using oranges `var oranges = Int!()`\
    \ Here we've used `!` instead of `?`.\n\nThis mean that `oranges` is declared\
    \ explicitly as an `Int` and explicitly as an unwrapped optional. Lets say we\
    \ declared `pennies` to be \n\n```swift\nvar pennies = 21\n```\n\n![Image](images/00037.jpeg)\
    \ (Figure 9.10 oranges only gets a value if pennies >= 100\\. It needs a value\
    \ for all cases the program crashes.)\n\nWe see our fatal error shows before it\
    \ can execute at all. Having a nil value show up where a real value is needed\
    \ can cause our programs to crash. \n\nLets see how we can use it correctly. If\
    \ we type in the below will it work?\n\n```swift\nvar today = \"Tuesday\"\n\n\
    var plums = Int?()\n\nif  today == \"Tuesday\" {\n  plums = 8\n}\n\nvar plumsPerDay\
    \ = plums * 1 \n```\n\nNo. We will get a self correcting error message:\n\n![Image](images/00038.jpeg)\
    \ (Figure 9.11 What is wrong here? plums need to be unwrapped!) \n\nIf we click\
    \ on the red circle we get:\n\n![Image](images/00039.jpeg) (Figure 9.12 Clicking\
    \ on the red circle tells us what is needed.)\n\nIt tell us to insert a `!` after\
    \ `plums` in the last line.\n\n![Image](images/00040.jpeg) (Figure 9.13 We've\
    \ unwrapped plums and out code works.)\n\nInserting a `!` fixes the problem. It\
    \ tell us to unwrap our inexplicit \n\n```swift\nvar plums = Int?()\n```\n\nbefore\
    \ using it.\n\nOne thing we can do about about optionals in our programs is prevent\
    \ errors with the nil coalescing operator: `??`. The `??` chooses between an object\
    \ that may be nil and an alternate. Below we'll choose between oranges and 0\\\
    . \n\n```swift\nvar oranges = Int!() //note this used to not have the () at the\
    \ end but that has been changed.\n\nvar numberOfOranges = oranges ?? 0 //Here\
    \ we set numberOfOranges to oranges if oranges is not nil and 0 if oranges is\
    \ equal to nil. \n\nprint(numberOfOranges)\n\nif  numberOfOranges >= 1{\n  print(\"\
    We have \\(oranges)\")\n} else {\n  print(\"We ain't got no oranges today!\")\n\
    }\n```\n\nWe can also do it this way with an if else. \n\n```swift\nif oranges\
    \ != nil {\n  print(\"We have \\(oranges)\")\n} else {\n  print(\"We ain't got\
    \ no oranges today!\")\n}\n```\n\nA random number is just one of a multitude of\
    \ items that can be used to validate our conditionals.\n\n```swift\nvar bananas\
    \ = Int?() //Explicitly an Int but this will not force unwrapped.\n\nbananas =\
    \ Int(arc4random_uniform(12)+ 1) //sets bananas to a random number. between one\
    \ and twelve\n\n/*\narc4random_uniform(12) sets bananas to a UInt32 value between\
    \ 0 and 11. By adding +1 to it (inside the Int() function) we get a random number\
    \ between 1 and 12.\nbananas needs to be cast to an Int so we use the function\
    \ Int() and throw our random number generator into it. \nAnd we need to unwrap\
    \ bananas with a !\n*/\n\nprint(\"We have \\(bananas!) bananas that is((Double(bananas!)/12.0*100.0))\
    \ % of a dozen\")\n```\n\n### Questions\n\n1)As written the code below will result\
    \ in a fatal error. What would need to be added to the first `else{ }` below to\
    \ avoid a fatal error.\n\n```swift\nvar numberOfBananas = Int!() //note this used\
    \ to not have the () at the end but that has been changed.\n\nvar nickles = 5\n\
    \nif  nickles == 6 {\n  numberOfBananas = 3\n} else{\n  //add something here to\
    \ keep this code from crashing \n}\n\nprint(numberOfBananas)\n\nif  numberOfBananas\
    \ >= 1{\n  print(\"We have \\(numberOfBananas) bananas\")\n} else {\n  print(\"\
    We ain't got no numberOfBananas today!\")\n}\n```\n\n### Answer\n\n```swift\n\
    } else{\n  numberOfBananas = nickles/2\n\n //or any other result that will always\
    \ gives numberOfBananas a value.\n\n}\n```\n\n### Ten: For and In Loops\n\n*(Note:\
    \ Content for this section was missing in the source text, but the header is kept\
    \ for structure.)*\n\n### Eleven: While Loops\n\nLike C and C++ Swift has both\
    \ while loops and do-while repeat-while loops. \n\nIn C we might write for a while\
    \ loop\n\n```cpp\n  int x = 0;\n\n  while( x < 6){ //Asserts a condition to be\
    \ met\n```\n"
