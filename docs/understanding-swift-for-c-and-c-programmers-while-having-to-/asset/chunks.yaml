    );\n\n  break;\n\ncase  3:\n\n printf(\"Doberman\");\n\n  break;\n\ncase  4:\n\
    \n printf(\"Springer Spaniel\");\n\n  break;\n\ncase  5:\n\nprintf(\"Unknown \"\
    ); //no break and these combine\n\ndefault:\n\n printf(\"Mutt\");\n\n}\n\nprintf(\"\
    \\n\\n\");\n\nwill print out \"Unknown Mutt\".\n\nIn Swift we would have In Swift\
    \ switch statements must be exhausted. You do not always need a\n\ndefault:\n\n\
    but you do need to have an exhaustive list in you switch statement.\n\nConsider\n\
    \nvar trueOrFalse = true\n\nswitch(trueOrFalse){\n\ncase  true:\n\n  print(\"\
    true\")\n\ncase  false:\n\n  print(\"false\")\n\n}\n\nThis is exhaustive. True\
    \ and false are the only possible Bool replies and both are covered so it does\
    \ indeed work.\n\n![Image](images/00042.jpeg)\n\n(Figure 12.1 An exhaustive switch,\
    \ No other replies are possible so this is exhaustive.)\n\nWhat about the following?\n\
    \nvar trueOrFalse = \"blue\"\n\nswitch(trueOrFalse){\n\ncase  \"true\":\n\n  print(\"\
    true\")\n\ncase  \"false\":\n\n  print(\"false\")\n\n}\n\nIn this example the\
    \ replies are not exhaustive. \n\n![Image](images/00043.jpeg)\n\n(Figure 12.2\
    \ We don't know if blue is true or false so the search is not exhaustive.)\n\n\
    We actually get a warning that our switch is not exhaustive.\n\nvar trueOrFalse\
    \ = \"blue\"\n\nswitch(trueOrFalse){\n\ncase  \"true\":\n\n  print(\"true\")\n\
    \ncase  \"false\":\n\n  print(\"false\")\n\ndefault:\n\n  print(\"false\")\n\n\
    }\n\nBy Adding a default we make the above exhaustive.  \n\n![Image](images/00044.jpeg)\n\
    \n(Figure 12.3 We have a default so the search is exhaustive.)\n\nSo with switch\
    \ in Swift you do not need a default if your list of replies is otherwise exhaustive.\
    \  \n\nAs in C and C++ switch statements can be easier to write and read than\
    \ long if else combinations.\n\nIf your user input is a String a switch statement\
    \ can make possible answers easier.\n\nCreate a new Swift console project rather\
    \ than a playground  \n\n![Image](images/00045.jpeg)\n\n(Figure 12.4 Save a console\
    \ project (Command Line Tool).)\n\nI have saved mine as switchByEnteredString.\n\
    \n![Image](images/00046.jpeg)\n\n(Figure 12.5 Name your project and hit next.\
    \ Then Create on the next screen.)\n\nClick Next, make sure it is in the file\
    \ you want it to be in and click create.\n\nThen open the main.swift file\n\n\
    ![Image](images/00047.jpeg)\n\n(Figure 12.6 Open main.swift.)\n\nAnd enter the\
    \ code below. After where the name and copyright info is commented out. I have\
    \ made var reply a conditional String that is forced unwrapped. Then used the\
    \ coalescing operator just in case noting gets entered. We have not discussed\
    \ functions yet so that part of this will be discussed later. For now just use\
    \ the code here.\n\n——————————————————————————————————————\n\n//\n\n// main.swift\n\
    \n// switchByEnteredString\n\n//\n\n// Created by David Curran on 12/8/15.\n\n\
    // Copyright © 2015 David Francis Curran. All rights reserved.\n\n//\n\nimport\
    \ Foundation\n\nfunc userEnteredData() -> String{  \n\n  let userTypedIn = NSFileHandle.fileHandleWithStandardInput()\n\
    \n  let myEnteredString = userTypedIn.availableData\n\n  return  NSString(data:\
    \ myEnteredString, encoding:NSUTF8StringEncoding) as! String\n\n}\n\nprint( \"\
    Please enter your gender\")\n\nvar reply = String!()\n\nreply = userEnteredData()\n\
    \nvar replyForSwitch = reply ?? \"Error \"  //nil coalescing operator to prevent\
    \ an error.\n\nswitch(replyForSwitch){\n\ncase  \"Error\":\n\n  print(\"There\
    \ has been a ERROR please try again!\")\n\ncase  \"Male\",\"M\",\"MALE\",\"m\"\
    : //spelling counts so try for all possibilities\n\n  print( \"Thank you sir!\"\
    )\n\ndefault: //if you are not male…\n\n  print( \"Thank you ma'am'!\")\n\n}\n\
    \n——————————————————————————————————————\n\nHere is the output. As you can see\
    \ below I've entered male but was thanked as a ma'am. Why did this error occur?\n\
    \n![Image](images/00048.jpeg)\n\n(Figure 12.7 We get an error if we indicate male.\
    \ Why?)\n\nDouble check yourself. Enter male in any of the ways offered and your\
    \ reply will be \"Thank you ma'am'!\" Why?\n\nLets set some break points and solve\
    \ again.  \n\n![Image](images/00049.jpeg)\n\n(Figure 12.8 The error is caused\
    \ by a \"\\n\" at the end of our reply.)\n\nThis reminds me of input problems\
    \ when I was starting out learning C. Here Swift collected what the user entered\
    \ including the \\n at the end\n\nAnd easy correction change\n\ncase Male\",\"\
    M\",\"MALE\",\"m\":\n\nto\n\ncase  \"Male\\n\",\"M\\n\",\"MALE\\n\",\"m\\n\": \n\
    \nAnd there was another error that might have been found by having people try\
    \ entering their gender. A sin of omission. \n\nadding \"male\\n\" should be added\
    \ as a possibility\n\ngives us\n\ncase  \"Male\\n\",\"M\\n\",\"MALE\\n\",\"m\\\
    n\",\"male\\n\":\n\nAnd the program will identify me as male if I enter any of\
    \ the male replies.\n\n![Image](images/00050.jpeg)\n\n(Figure 12.9 Taking care\
    \ of the \"\\n\" fixes the error.)\n\nThe nil coalescing operator will never have\
    \ to give the error substitute. as \"\\n\" would not be considered to be nil.\
    \ But as you create projects with text fields having an empty box failsafe may\
    \ save you from crashes. \n\n**thirteen**\n\n**Enumerations an Intro**\n\nEnumerations\
    \ are not quite what they were in C an C++. In some ways I liked C and C++ enumerations\
    \ as they were. \n\nI could use a C enum Numbers to declare all-cap words for\
    \ the numbers from ZERO to TEN. It would be the same as using a #define Zero 0,\
    \ or const int TEN = 10;\n\n// Created by David Curran on 12/8/15.\n\n// Copyright\
    \ © 2015 David Francis Curran. All rights reserved.\n\n//\n\n#include <stdio.h>\n\
    \nint main(int argc, const  char * argv[]) {\n\n  enum Numbers {\n\n ZERO, ONE,\
    \ TWO, THREE, FOUR, FIVE, SIX, SEVEN, EIGHT, NINE, TEN\n\n };\n\n  enum  Numbers\
    \ nowTime = THREE;\n\n  printf(\"\\nnowTime is == %d and THREE is == %d\\n\",\
    \ nowTime,THREE);\n\n nowTime = TEN;\n\n  printf(\"\\nnowTime is == %d and TEN\
    \ is == %d\\n\", nowTime,TEN);\n\n nowTime = 15;\n\n  printf(\"\\nnowTime is ==\
    \ %d and 15 is == %d\\n\", nowTime,15);\n\n return 0;\n\n}\n\nNote the line \"\
    enum  Numbers nowTime = THREE;\" The word \"enum\" is essential. You cannot use\
    \ simply write \"Numbers nowTime = THREE;\" You will get \n\n![Image](images/00051.jpeg)\n\
    \n(Figure 13.1 An enum set up in C.)\n\nI wish Apple had kept the old and called\
    \ the new kind of enumerations something else. But…\n\nApple recommends that you\
    \ start an new Enumeration type with a capital letter and do not make them plural.\
    \  \n\nThat is: enum \"Number\" rather than enum \"numbers\". (You don't always\
    \ have to agree with Apple's suggestions. I call my old enum Numbers because that\
    \ is what they are.)\n\nIn C and C++ Numbers is not a type. You have to write\n\
    \n \"enum  Numbers\" nowTime = THREE; You cannot use \"Numbers\" By itself. \n\
    \n![Image](images/00052.jpeg)\n\n(Figure 13.2 In C something declared as an enum\
    \ is not a type. So in C and C++ the word \"enum\" needs to be included.)"
