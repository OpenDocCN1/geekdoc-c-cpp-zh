  trans: "\n\n## 引言\n\n然而，Apple 为其新的 `enum` 制定规则确实有其合理的理由。新的 `enum` 比旧的 C `enum` 具有多得的功能。由于旧的\
    \ C `enum` 的值只能是 `ints`，因此类型安全性并不是问题。但 Apple 新的 `enum` 在 `Swift` 中不必仅仅是 `Int`。\n\
    \n## Swift 中的基础枚举\n\n由于你可能在问自己，这个 `enum` 与旧的有什么不同。让我们看看需要做什么才能让我们的 Swift `enum`\
    \ 尽可能地像旧的那个。\n\n为枚举创建一个新的 playground。并输入：\n\n```swift\nenum Numbers { //注意每个值之前的单词大小写。这可以通过不同的方式实现，但如果没有\
    \ case，你就无法拥有 rawValue —— 即某种某种一致类型的值。\n\n  case ZERO\n\n  case ONE\n  case TWO\n\
    \  case THREE\n  case FOUR\n  case FIVE\n  case SIX\n  case SEVEN\n  case EIGHT\n\
    \  case NINE\n  case TEN\n} //不需要分号 ;\n```\n\n这建立了一个名为 `Numbers` 的 `enum`，但它没有值。Apple\
    \ 喜欢称它们为 `rawValues`。简单来说，`rawValues` 是赋予 `enum` 的值。\n\n在 `Swift` 中，\"Numbers\"\
    \ 现在是一个类型，尝试像在 `C` 或 `C++` 中那样写写 `enum Numbers` 将导致错误。显式转换可以运行，但它的写法不像在 `C` 或\
    \ `C++` 中那样。\n\n```swift\nvar count: enum Numbers = .EIGHT //会给你返回一个错误 ERROR\n\
    var count1: Numbers = .EIGHT //可以正常工作。\n```\n\n隐式转换也有效。\n\n```swift\nvar count\
    \ = Numbers.EIGHT\n```\n\n注意，要将变量或常量设置为我们 `Numbers` 中的其中一个值，你需要在值之前使用点符号。如上面的\
    \ `.EIGHT` 所示。但我们的 `enum` `Numbers` 不会在你的 playground 中显示任何值。\n\n![Image](img/00053.jpeg)\
    \ (图 13.3 在 Swift 中，枚举的值在你像像上面的 `count` 和 `count1` 那样使用它们之前，不会显示在 playground 中。)\n\
    \n如你所见，侧边栏中只显示了 `EIGHT`。如果你喜欢，可以添加 `print(count1)`！\n\n上面的 `enum` 没有任何基础值或原始值（raw\
    \ values）。`Swift` 中的 `enum` 实际上并不需要基础值即可发挥作用。以这个 `enum` 为例：\n\n```swift\nenum\
    \ PlantsNameHint {\n\n  case my, very, eager\n  case mother, just, served, up\n\
    \  case nine, pies\n}\n\nvar aPlanet = PlantsNameHint.served\n\nswitch(aPlanet){\n\
    case .my:\n  print( \"Mercury\" )\ncase .very:\n  print( \"Venus\" )\ncase .eager:\n\
    \  print( \"Earth\" )\ncase .mother:\n  print( \"Mars\" )\ncase .just:\n  print(\
    \ \"Jupiter\" )\ncase .served:\n  print( \"Saturn\" )\ncase .up:\n  print( \"\
    Uranus\" )\ncase .nine:\n  print( \"Neptune\" )\ncase .pies:\n  print( \"Poor\
    \ Pluto\" )\n}\n//打印 \"Saturn\"\n```\n\n## 原始值（Raw Values）与 Int 类型\n\n但让我们假设你目前的目标是让它像\
    \ `C` 或 `C++` 的 `enum`。实际上这并不困难。让我们重做我们的 `Numbers` `enum`。\n\n```swift\nenum Numbers:Int\
    \ {\n```\n\n这实际上会将 `enum` 从未指定的类型更改为 `Int` 类型。它还会为每个 case 提供一个从零开始的 `Int` 值。如果你将\
    \ `enum` `Numbers` 包含 `:Int`，它看起来和上面的图形没有区别，除了包含了 `:Int`。\n\n### Playground 中有“幽灵”\n\
    \n当你在 `Xcode` 中创建 `C`、`C++`、`Object-C` 或 `Swift` 项目时，项目菜单除了 `RUN`、`BUILD` 等之外还有一个\
    \ `CLEAN` 选项。这是因为有时我们的项目会记住一些不该记得的东西，我们需要从头开始构建。`CLEAN` 会删除当前构建并从头开始。Playgrounds\
    \ 有时会记住一些不再存在的东西，我称之为“幽灵”。我提到这一点是因为你可能会在学习这一节时遇到这种情况。\n\n现在我们将 `enum Numbers`\
    \ 更改为 `enum Numbers:Int` 并进行几处更改。我们将通过添加 `:Int` 赋予我们的 `enum` 所谓的 `rawValue`。这以前被称为\
    \ `toRaw()`，但在当前版本的 `Swift` 中已不再适用。如果你在不指定 `enum` 类型的情况下访问 `rawValue`，将得到错误。\n\
    \n注意，我们可以从任何想要的 `int` 值开始此 `enum` 的编号。默认值是 0。如果你对下面的代码有任何问题，请将 `case ZERO` 改为\
    \ `case ZERO = 0`。\n\n将此内容输入你的 playground：\n\n```swift\nenum Numbers:Int { //注意每个值之前的单词大小写。\
    \ \n\n  case ZERO\n  case ONE\n  case TWO\n  case THREE\n  case FOUR\n  case FIVE\n\
    \  case SIX\n  case SEVEN\n  case EIGHT\n  case NINE\n  case TEN\n} //不需要分号 ;\n\
    \nvar time:Numbers = .FIVE\n\nif  time == .FIVE {\n  print(time.rawValue)\n  let\
    \ theTime = time.rawValue\n  print(theTime)\n  print(theTime)\n}\n```\n\n![Image](img/00054.jpeg)\
    \ (图 13.4 在 Swift 中，编号的默认值为 0，在本例中为 `ZERO`。)\n\n注意上面的 case `\"theTime\"` 是一个等于\
    \ 5 的常量 `Int`。它不是 `enum` `Numbers` 的实例。\n\n在上面的示例中，每行都有一个 `case`，但你不需要为 `enum`\
    \ 中的每个新值都使用 `case` 单词。下面的代码如下：\n\n```swift\nenum MyInt: Int {\n  case a\n  case\
    \ b\n  case c\n}\n```\n\n（注：提供的文本在结尾处中断；我已根据可用片段格式化了逻辑。）\n\n"
- fmt: "\n```swift\nvar someOtherVariable = Name_Of_Enum(rawValue: Some_Int_Included_In_Name_Of_Enum)(!\
    \ needed)\n\nsomeOtherVariable = .SOME_VALID_MEMBER_OF_ENUM\n\nsomeOtherVariable(!\
    \ not needed or Wanted ).rawValue\n\nvar myEvenNewerBubble = MyInt2.c\n\nmyEvenNewerBubble\
    \ = MyInt2(rawValue:0)!\n\nmyEvenNewerBubble.rawValue\n\nprint (myEvenNewerBubble)\n\
    ```\n\nYou will find if you answer the section questions below that enum `enum\
    \ SomeFloatEnum: Float {}` is not much different than `enum SomeIntEnum: Int{}`.\n\
    \nBut what about Strings? Type in:\n\n```swift\nenum MyStringEnum: String {\n\
    \  case sweet = \"Sweet\", young, thing\n}\n```\n\n```swift\nvar string1 = MyStringEnum.sweet\n\
    \nstring1.rawValue\n\nstring1 = .young\n\nstring1.rawValue\n```\n\n![Image](images/00062.jpeg)\n\
    \n(Figure 13.12 Using `rawValue` to find the value of an enum.)\n\nSince a `String`\
    \ was not provided for `young` the string `\"young\"` was provided for us.\n\n\
    ```swift\nenum myCountingString: String {\n  case one, two, three\n}\n```\n\n\
    ```swift\nvar countTwo = myCountingString.two.rawValue\n\ncountTwo == \"Two\"\n\
    ```\n\nOne final note for this section. Keep in mind there is a difference between:\n\
    \n```swift\nenum MyIntToo: Int{\n  case a, b, c, d\n}\n```\n\n```swift\nlet ace\
    \ = MyIntToo.a\n\nlet doc = MyIntToo.a.rawValue\n```\n\nhere `ace == a` which\
    \ is an instance of `MyIntToo` but `doc == 0` and is only an `Int`. There is no\
    \ `doc.a`, or `doc.b` or `doc.c` or `doc.d`.\n\nThat is it for the first section\
    \ on Enumerations. We will get back to them in book II after covering a few more\
    \ subjects. There is a lot more we can do with enumerations.\n\n### Questions\n\
    \n1) given\n\n```swift\nenum An_ENUM: Int {\n  case a, b, c\n}\n```\n\nvar Y =\
    \ Int!()\nvar X = An_ENUM(rawValue: Y)\n\na. `var z = An_ENUM.a`\n`z` will equal\
    \ `2` (`z == 2`)\nb. `var Y = Int!()` will cause a fatal error\nc. `var X An_ENUM(rawValue:\
    \ Y)` will cause a fatal error\nd. `var X` will be `nil`\n\n2) given\n\n```swift\n\
    enum aLittleEnum: Int {\n  case a = 15 ,b,c,d,e,f,g\n}\n```\n\nvar w = aLittleEnum.c\n\
    \nWhat will `w.rawValue` be?\na. 2\nb. 3\nc. 17\nd. 18\n\n3) given\n\n```swift\n\
    enum MyFloatEnum: Float {\n  case a, b, c, d, q, e, m\n}\n```\n\nvar f = MyFloatEnum.e\n\
    \nWhat will `f.rawValue` be?\na. nil\nb. FATAL ERROR\nc. 3.0\nd. 5.0\n\n**fourteen**\n\
    \n### Dictionaries\n\nWhen I was working in C or C++ I would sometimes make arrays\
    \ of arrays:\n\n```cpp\nint myArrayOfArrays[10][10];\n```\n\nor\n\n```cpp\nint\
    \ myArrayOfArraysOfArrays[10][10][10]; //and on and on and on\n```\n\nYou don't\
    \ exactly see much of that in Swift. You could set up an `Array` of 1000 `Int`\
    \ values:\n\n```swift\nvar aThousandIntArray = [Int](count: 1000, repeatedValue:\
    \ 0)\n```\n\nAnd then play with the values in it. But the point is always to collect\
    \ data in a way that we need to use that. And Swift does give us the opportunity\
    \ to collect data in what is know as a dictionary. It is not quite like an `int\
    \ myArrayOfArrays[10][10];`; But you could make something close.\n\nLets say we\
    \ make a `myArrayOfArrays` with 100 values and say `myArrayOfArrays[0][0] = 5;`\
    \ `myArrayOfArrays[0][1] = 7;` `myArrayOfArrays[0][2] = 9;` all the way to `myArrayOfArrays[10][10]\
    \ = 122;`\n\n```swift\nvar A_DICTIONARY_NAME:[Int : Int] = [ 0 : 5, 1: 7, 2 :\
    \ 9]\n```\n\nInstead Swift has the dictionary. Each dictionary entry is composed\
    \ of two items, the first being the key and the second the value. Here is a dictionary\
    \ with strings for both the key and the value:\n\n```swift\nvar myExampleDictionary:\
    \ [ String : String] = [\"Key\" : \"Value\"]\n```\n\nItems in a `Dictionary` are\
    \ sorted by their key in a hash table which the user never sees. Swift takes care\
    \ of the sorting behind the scenes. Very simply Swift takes your `Key`, breaks\
    \ it down into a sortable code and finds your `Key` when you need it. Keys can\
    \ be any type, `Int`, `Double`, `String`, that can be converted to a hash number\
    \ for storage. And values can be of any type.\n\nA `Dictionary` can be created\
    \ explicitly:\n\n`var or let dictionaryName(colon:) [ type name for key (colon:)\
    \ type name for value] = [key of specified type (colon:) value of specified type\
    \ (comma separator if needed) …. key of specified type (colon:) value of specified\
    \ type ]`\n\nYou could use a dictionary for a collection of last and first names,\
    \ with the names sorted by surname:\n\n```swift\nvar myDictionary:[ String : String]\
    \ = [\"LastNameOne\":\"David\", \"LastNameTwo\": \"Two\"]\n```\n\nWait, let me\
    \ re-examine the text provided for the specific middle part:\n\n```swift\nenum\
    \ myCountingString: String {\n  case one, two, three\n}\n```\n\n```swift\nvar\
    \ countTwo = myCountingString.two.rawValue\n\ncountTwo == \"Two\"\n```\n\nOne\
    \ final note for this section. Keep in mind there is a difference between:\n\n\
    ```swift\nenum MyIntToo: Int{\n  case a, b, c, d\n}\n```\n\n```swift\nlet ace\
    \ = MyIntToo.a\n\nlet doc = MyIntToo.a.rawValue\n```\n\nhere `ace == a` which\
    \ is an instance of `MyIntToo` but `doc == 0` and is only an `Int`. There is no\
    \ `doc.a`, or `doc.b` or `doc.c` or `doc.d`.\n\nThat is it for the first section\
    \ on Enumerations. We will get back to them in book II after covering a few more\
    \ subjects. There is a lot more we can do with enumerations.\n\n*(Self-correction:\
    \ The provided text in the prompt contains many repetitions and jumbled sections\
    \ of examples. I will follow the flow of the provided \"need to排版的文本\" while applying\
    \ the formatting rules.)*\n\nWait, the user input text is actually a messy dump\
    \ of multiple examples. I will clean it up according to the rules while keeping\
    \ all content.\n\n---\n\nA `Dictionary` can be created explicitly.\n\n`var or\
    \ let dictionaryName(colon:) [ type name for key (colon:) type name for value]\
    \ = [key of specified type (colon:) value of specified type (comma separator if\
    \ needed) …. key of specified type (colon:) value of specified type ]`\n\nYou\
    \ could use a dictionary for a collection of last and first names, with the names\
