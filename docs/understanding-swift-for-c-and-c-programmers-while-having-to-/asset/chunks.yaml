    ![Image](images/00001.jpeg)


    Figure 1.1 Apple’s Xcode download page


    **two**


    **Lets Start Programming  **


     Don’t worry if you dare unfamiliar with any of the terms below. You’ll learn
    more about what they are as we go on.  


