    \n## 移除值\n\nApple 提供了 `removeValueForKey(_:)` 作为移除内容的方法。\n\n我们同样需要将其附加到字典的名称上，并只放入键。\n\
    \n```\nmyDictionaryTenTen.count\nmyDictionaryTenTen[100]\nmyDictionaryTenTen[199]\n\
    myDictionaryTenTen.count\nmyDictionaryTenTen.removeValueForKey(199)\nmyDictionaryTenTen[199]\n\
    myDictionaryTenTen.count\n```\n\n![Image](img/00065.jpeg)\n\n(图 14.3 显示使用 `.count`\
    \ 和 `.removeValueForKey()` 的结果)\n\n注意，尽管我们的字典中有 101 个项目，但键 100 显示为 `nil`。移除键 199\
    \ 的值后，它也被显示为 `nil`。\n\n另外请注意，`myDictionaryTenTen.removeValueForKey(199)` 给了我们被移除的值：\n\
    \n222 \n\n正如我们在 For-In-循环中学学习的，我们可以使用 For-In-循环来遍历字典。为了好玩，让我们把键 199 的值放回去。\n\n\
    ```\nmyDictionaryTenTen[199] = 1000\n\nfor(whoCaresWhatICallTheKey, whoCaresWhatICallTheValue)\
    \ in myDictionaryTenTen {\n  print( \"\\(whoCaresWhatICallTheKey):\\(whoCaresWhatICallTheValue)\"\
    )\n}\n```\n\n在你的 playground 中试试！\n\n让我们尝试一些新东西，在你的 playground 中输入：\n\n```\nprint(myDictionaryTenTen.keys)\n\
    print(myDictionaryTenTen.values)\n```\n\n觉得还不太印象深刻？嗯，你不会那样使用 `.keys` 或 `.values`。你可能会做类似这样的操作。\n\
    \n```swift\nfor SomeSillyValue in myDictionaryTenTen.values {\n  if SomeSillyValue\
    \ % 11 == 0 {\n    print(\"SomeSillyValue) \"\n  }\n}\n```\n\n我们得到：\n\n55\n99\n\
    33 \n66\n110\n88\n33\n77\n44\n\n`.keys` 和 `.values` 告诉 Swift 单独提取键或值。\n\nfifteen\n\
    \n## 处理字符串\n\n字符串在 Swift 中略有不同。在 C 和 C++ 中，字符串是填充了字符的字符数组。\n\n而不是 \n\n`char aLetter\
    \ = 'a';`\n\n我们使用的是 \n\n```swift\nvar aLetter = \"o\";\nvar anotherletter: Character\
    \ = \"k\"\n```\n\n注意，我们对 Characters 使用双引号 [永远不要使用智能引号]。现在，只需记住有 Characters 即可。\n\
    \n我们如何知道这些确实是 Characters 而不是 Strings？\n\n在 Swift 中我们可以相加 Strings，但相加 Characters\
    \ 稍微复杂一些。\n\n```\nvar word = aLetter + anotherLetter\n```\n\n![Image](img/00066.jpeg)(图\
    \ 15.1 Swift 中的 Characters 不能简单地相加来形成 Strings。)\n\n因此上面的代码会给我们一个错误信息。我们不能直接相加\
    \ Characters。稍后我们会看到可以将一个 Character 追加到单词中，但那需要小心。\n\n存在隐式 Character 吗？\n\n```swift\n\
    var myWord1 = \"n\"\nvar myWord2 = \"o\"\nvar myFinalWord = myWord1 + myWord2\n\
    ```\n\n![Image](img/00067.jpeg)\n\n(图 15.2 如果你可以将两个单字符变量或常量相加，它们是 Strings 而不是\
    \ Characters。)\n\n你可以看到 Swift 将 `myWord1` 和 `myWord2` 解释为 Strings 而不是 Characters。\n\
    \nCharacters 必须 必须显式声明。\n\n所以当我查看 Swift 中的 Strings 时，我的第一个问题是如何访问单个 Characters？让我们尝试访问我们的\
    \ \"Hello, playground\" `str` 中的一个字符。\n\n```swift\nvar aThirdLetter: Character\
    \ = str[0] // 崩溃\n```\n\n![Image](img/00068.jpeg)\n\n(图 15.3 你不能通过使用 Int 指向字符串中的位置来为\
    \ Character 赋值。)\n\n我们如何获取 Swift 在我们打开 playground 时提供的如 `str` 字符串中的单个字符，即 `var\
    \ str = \"Hello, playground\"`？\n\n这以前可行，但现在不再行了：\n\n![Image](img/00069.jpeg)\n\
    \n(图 15.4 这种方法不再起作用。)\n\n现在实现此的一种方法是在字符串末尾追加 `.characters`。\n\n```swift\nfor myCharacter\
    \ in str.characters{\n  print (myCharacter)\n}\n```\n\n//结果为\nH\ne\nl\nl\no\n\
    ，\np\nl\na\ny\ng\nr\no\nu\nn\nd\n\n另一种稍有不同的方法是：\n\n```swift\nfor index in str.characters.indices\
    \ {\n  print(\"\\(str[index])\")\n}\n```\n\n尝试上面的操作看看是否给你相同的结果。在第一种情况下，我们直接访问字符。在第二种情况下，我们获取每个字符的索引，然后使用\
    \ `str[index]` 在字符串中找到它。要记住的重要点是索引不等同于 `Int`。\n\n```swift\nvar myOtherCharacter\
    \ = str[index]\n```\n\n"
