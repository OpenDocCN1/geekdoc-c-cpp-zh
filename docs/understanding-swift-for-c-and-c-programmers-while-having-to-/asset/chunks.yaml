  trans: "\n\n# 注释包含\n\n`Comment inclusion`（注释包含）与 C 和 C++ 基本一致。我首先提到这一点，是因为在我们学习的过程中，你可能需要注释掉自己犯的错误。\n\
    \n正如我在前言中所说的：最好的程序员是那些犯过最多错误并从中学习的人。\n\n```swift\n// 将一行变为注释\n\n/* 创建一个跨越多行的长注释\
    \ */\n```\n\n它们都不会作为代码包含在程序或游乐场（playground）中。\n\n下面由 `var` 引入的两个声明类似于：\n\n`int\
    \ bananas = 5;`\n\n以及\n\n`int grapes = 6;`\n\n在 C 和 C++ 中是这样，尽管在 Swift 中它们不仅仅是整数。我们将在“常量与变量”中详细讨论这一点。但目前这只是一个打印的示例。\n\
    \n```swift\nvar bananas = 5  // 注意这里以前末尾没有 `()`，但现在已经更改了。\n\nvar grapes = 6 \n\
    \n/* 注意这里以前末尾没有 `()` \n现在已经更改了。 */\n```\n\n# print 取代了 println\n\n当 Swift 出现时，`println()`\
    \ 是向某些地方打印内容的方法。苹果将其更改为了 `print()`。但你仍可以将其视为 `println`，因为它会打印一行并在结尾包含一个换行符 `\\\
    n`。你很快就会看到它的用法。要在 `print()` 语句中打印变量或常量，可以使用类似 `print(\"We have \\(grapes) grapes\
    \ and \\(bananas) bananas\")` 的语句。\n\n```swift\nprint(\"We have \\(grapes) grapes\
    \ and \\(bananas) bananas\")\n```\n\n注意引号必须不能是智能引号（全角引号）。\n\nSwift `print()` 的默认结尾是\
    \ `\\n`，但如果我们愿意，可以通过 `terminator:` 来更改它。在游乐场中输入以下内容：\n\n```swift\nprint(\"We have\
    \ \\(apples) apples and \\(oranges) oranges\", terminator: \"\")\n\nprint(\" and\
    \ \\(pears) pears\")\n```\n\n![Image](img/00008.jpeg)\n\n( 图 3.1 使用带不带 terminator\
    \ 的 `print()` )\n\n当行尾设置为空字符串 `\"\"` 时，两个 `print` 命令在打印时会合并在同一行。这在我们以后想要让不同类型的连续循环在同一行上合并数据时将非常有帮助。\n\
    \n**不要忘记 terminator 后的 `:`！**\n\n这个 `print-function(something to print, terminator:\
    \ \"\")` 是 Objective-C 的遗留物。\n\n# 最后：\n\n在示例游乐场或项目中，我可能会有这样一行代码：\n\n```swift\n\
    let diamonds = 5\n\n//diamonds = 7 // 取消注释以查看错误\n```\n\n这意味着移除该行前两个 `//`\n\n```swift\n\
    diamonds = 7  // 取消注释以查看错误\n```\n\n我一直使用所谓的 `camelCaseLettering`（驼峰命名法），即我在编写常量和变量时，第一个单词小写，与其他所有单词通过首字母大写连接。我偶尔会改变这种写法，但大多数情况下你可以假设我的变量和常量是这样命名的。\n\
    \n```swift\nvar howManyBananas = 3\n```\n\n# 运算符\n\n在 Swift 中，运算符大部分与 C 和 C++\
    \ 中的非常相似。我们很快就会使用它们，所以让我们先来看看它们。\n\n### 数学运算符\n\n- `=` 将一个值赋给另一个\n- `+` 将一个值加另一个值上\n\
    - `-` 从另一个值减去一个值\n- `*` 将一个值乘以另一个值。然而，它并不表示指针。Swift 中没有指针。\n- `/` 将一个值除以另一个值\n\
    \n```swift\nvar addition = xInt + yInt\n\nvar multiplication = addition * addition\n\
    \nvar subtraction = multiplication - yInt\n\nvar division = (subtraction * multiplication)/addition\n\
    ```\n\n`%` 模运算符在一个值被除以另一个值时给出余数。然而在 Swift 中，你可以获取一个 `Double` 除以 `Double` 的余数作为\
    \ `Double`。而在 C 和 C++ 中，余数始终是整数。这意味着你需要小心，比如当你正使用模运算符来判断结果是偶数还是奇数。\n\n![Image](img/00009.jpeg)\n\
    \n( 图 4.1 在 double 上使用模运算。 )\n\n- `+=` 将左项加到右项。\n- `-=` 从右项减去左项。\n- `++` 在变量末尾使其增加\
    \ 1。它等同于 `var negtiveItem += positiveItem`（仅限整数。尝试对 `Double` 这样做。）\n- `--` 在变量末尾使其减少\
    \ 1。它等同于 `var negtiveItem -=negtiveItem`（仅限整数。尝试对 `Double` 这样做。）\n\n```swift\n\
    var xInt = 1\n\nvar yInt = 1\n\nprint(--xInt) // 在打印前减 1\n\nprint(yInt--) // 在打印后减\
    \ 1\n\nprint(yInt)  // 显示减去 后的值\n```\n\n输出\n0\n1\n0\n\n你自己检查一下，如果在上述操作之后添加：\n\n\
    ```swift\nprint(++xInt)\n\nprint(yInt++)\n\nprint(yInt)\n```\n\n输出\n1\n0\n1\n\n\
    \ 应用于布尔结果的逻辑运算符\n\n- `||` OR（或）运算符，两者中必须有一个符合预期\n- `&&` AND（与）运算符，两者都必须符合预期\n\n\
    ### 返回布尔值的比较运算符\n\n- `==` 一个值等于另一个值\n- `>=` 左侧对象小于或等于右侧\n- `<=` 左侧对象大于或等于右侧\n\
    - `!=` 它们之间不相等\n\n### 新运算符（位置非常特殊，将在稍后讨论）\n\n- `?` 表示项尚未赋值。这被称为可选值（optional value）。\n\
    - `!` 与 `?` 类似，但表示该可选值在赋值后永远不会为 nil。\n\nSwift 还有范围运算符。\n- `...` 是闭区间运算符，包含右侧。\n\
    - `..<` 是半区间运算符，不包含右侧。\n\n# 常量与变量\n\n在 C 和 C++ 中你标记数据的类型。在 Swift 中，`let` 和 `var`\
    \ 引入类型。注意与 C 和 C++ 不同，你不需要分号。行尾是假设的。如果你愿意，可以加上分号。\n\n`let` 创建一个常量。不像 C/C++ 需要显式声明你正在创建的类型，Swift\
    \ 可以根据你输入的内容推断。\n\n`let` 创建一个常量，即一个不能改变的值。例如 `let myConstX = 5` 类似于 `const int\
    \ ConstX = 5`。\n\n`var` 创建一个值可以改变的变量。类似于 `int x = 5`。例如 `var x = 5`  own `int\
    \ x = 5;`。\n\n```swift\nimport Cocoa\n\nvar str = \"Hello, playground\"\n\nvar\
    \ x = 5\n\nlet myConstX = 5\n\nvar z = 5.00\n\nvar y = 5.01\n\nvar myDoubleX =\
    \ 5.0000001\n\nvar mySmallDouble = .69\n```\n\n"
- fmt: "\nSwift recognizes `x` and `myConstX` as `Int`. (Capital `I` instead of small\
    \ `i` as in the `C` or `C++` `int`. `Int` is not quite the same as `int` as you\
    \ will see.)\n\nBy the way if you enter the same variable name twice you will\
    \ get an error. Swift like `C` and `C++` allows only one instance of a variable.\
    \ (Scope exceptions excluded.)\n\nWe will talk about `switch` statements later\
    \ in this book. There are differences in how they work such as no need for a `break`;\
    \ For now, I just want to show the scope differences that allow us to declare\
    \ a new `var x`. (Not really recommended.) Using `x` and `y` from above enter\
    \ this into your playground.\n\n```swift\nswitch(y){\ncase  0:\n  var x = 3  //this\
    \ x is in a different scope than the x above\ncase  1:\n  print(x)\ndefault:\n\
    \  print(y)\n  print(x) \n}\n```\n\n![Image](images/00012.jpeg)\n\n(Figure 5.3\
    \ An example of a scope exception for having a variable named twice. Try changing\
    \ the value `y` in the `switch` statement to something else and see what happens.)\n\
    \nIf this seems just like `C` and `C++` it IS NOT. An `Int` is not an `int`. A\
    \ `Double` is not a `double`. `Int` and `Double` are in fact classes. They each\
    \ have multiple properties. (Swift here, by the way, has designated both `x` and\
    \ `y` as `Doubles`, not `Floats`. Since it cannot tell what you intended it errs\
    \ on the path of caution and sets `x` and `y` each as a `Double`. MORE on `Doubles`\
    \ and `Floats` to come.)\n\n`Bool(s)` are pretty much what you’d expect. (Not\
    \ quite a `bool` as it is also a class.) And we will be using those later on.\n\
    \n```swift\nlet j:Bool = true\nvar B = false\n```\n\nBut there ain’t no such thing\
    \ as a `Char` or `char`. There is, however, a `Character`. `Character` is as close\
    \ to a `C/C++` `\"char\"` as you are going to come. We will get back to `Character`\
    \ and `String`, as finding a `Character` in a `String` is not easy as it was in\
    \ `C/C++`. In fact I will get back to it after, we’ve covered quite a few other\
    \ things such as `for` loops, `while` loops, `if` statement and `arrays`. For\
    \ now lets just play with numbers.\n\n### Arithmetic\n\nLets try some math. Arithmetic\
    \ operators `+` and `-` are pretty much the same.\n\n```swift\nvar zPlusY = z\
    \ + y\n```\nGives us `10.1` in the gutter.\n\n```swift\nvar xTimesMyConstX = x*myConstX\n\
    ```\nYou should see `25` in the gutter.\n\nBut if you try to write (i.e. change\
    \ the value of `myConstX`)\n\n```swift\nmyConstX = 7\n```\n\nYou will get an error\
    \ (Only if it is the first error. Sometimes only the first error shows. Figure\
    \ 5.4). With errors the gutter is empty.\n\n![Image](images/00013.jpeg)\n\n(Figure\
    \ 5.4 ERROR. You cannot change a value created with `let`.)\n\nClicking on the\
    \ red dot with the exclamation point will bring up the message.(Figure 5.5)\n\n\
    ![Image](images/00014.jpeg)\n\n(Figure 5.5 Trying to change the value of a constant\
    \ will result in an error.)\n\nComment the error out using two slashes `//`.\n\
    \nYou can also use `/* */` just like in `C/C++`.\n\nNow try multiplying these\n\
    \n```swift\nvar yTimesZ = z*y\nvar MyConstXTimesZ = myConstX*z \n```\n\nThe former\
    \ works. A `Double` multiplied by a `Double` gives us a `Double`. But the latter\
    \ (Figure 5.6) fails as a `Int` cannot be directly multiplied by a `Double`.\n\
    \n![Image](images/00015.jpeg)\n\n(Figure 5.6 An `Int` multiplied by a `Double`\
    \ fails in Swift but two `Doubles` can be multiplied.)\n\nComment out the error.\
    \ Not doing so will stall the playground.\n\n```swift\n//var MyConstXTimesZ =\
    \ myConstX*z\n```\n\nCan you somehow cast the `Int` to a `Double` and then multiply?\
    \ Yes you can. Try:\n\n```swift\n//let myConstX = 5\n//var z = 5.00\nvar myConstXTimesZInt\
    \ = myConstX* Int(z)\n```\n\n`25` should appear in the gutter. Whereas with\n\n\
    ```swift\nvar zTimesMyConstXDouble = Double(myConstX)* z\n```\n\nI confess that\
    \ when I first looked at Swift I thought they simply reversed the `C/C++` casting\
    \ format of `(int)someFloat` or `(float)someInt`. But no! `Double()` or `Int()`\
    \ are actually functions not just simple casts. You don’t need to know how they\
    \ work right now. Much like you never really needed to know how `strlen(word)`\
    \ worked in `C/C++`. (`o = strlen(\"Me\")` in Swift. AND BEWARE CURLEY QUOTES.)\n\
    \n`25.05` will appear. Add the following and we’ll look at the results (Figure\
    \ 5.7)\n\n```swift\nvar myConstXTimesYInt = myConstX * Int(y)\nvar yTimesMyConstXDouble\
    \ = Double(myConstX)*y\nvar zTimesMyConstXDouble = Double(myConstX) * z\nvar zTimesMyConstXDouble2\
    \ = Double(myConstX) * y\nvar zTimesMyConstXDouble3 = Double(myConstX) * myDoubleX\n\
    ```\n\n![Image](images/00016.jpeg)\n\nFigure 5.7 in `myConstXTimesZInt` the result\
    \ is cast to `Int`. But in all the rest the values are `Doubles`. Even for `var\
    \ zTimesMyConstXDouble = Double(myConstX) * z`. The answer reads `25` without\
    \ a period or zeros. But that `25` is a `double`. There are simply no significant\
    \ decimals so none are shown.\n\n### Explicit vs. Implicit casting\n\nYou can\
    \ explicitly cast a variable or constant. Just introduce your variable or constant,\
    \ follow it by a colon and then the type you want it to be. Try\n\n```swift\n\
    let f:Float = 9.99\nlet d:Double = 9.99\nlet e = 9.99\nvar fl = f*1.0002\nvar\
    \ dl = d*1.0002\nvar el = e*1.0002\n```\n\nThe results are in (Figure 5.8) Note\
    \ the difference in precision. `dl` has far more decimal places in the gutter.\
    \ And `el` has the same result showing that Swift did interpret `e` as a `Double`.\n\
    \n![Image](images/00017.jpeg)\n\n(Figure 5.8 The precision of the `Doubles` is\
    \ why Swift casts as a `Double` unless told otherwise.)\n\nDid you notice as you\
    \ began to type `Float` or `Double` Xcode offered a number... (rest of text follows\
    \ similar logic)\n"
  raw: "Swift recognizes x and myConstX as Int. ( Capitol I instead of small I as\
    \ in the C or C++ int. Int is not quite the same as int as you will see.) \n\n\
    By the way if you enter the same variable name twice you will get an error. Swift\
