  trans: "\nSwift 将 `x` 和 `myConstX` 识别为 `Int`。（使用大写 `I` 而不是 `C` 或 `C++` 中的小写 `i`。正如你将看到的，`Int`\
    \ 与 `int` 并不完全相同。）\n\n顺便说一下，如果你输入两次相同的变量名将会得到错误。Swift 像 `C` 和 `C++` 一样，只允许变量的一个实例。（作用域异常除外。）\n\
    \n我们将在本书的后部分讨论 `switch` 语句。它们的工作方式存在一些差异，例如不需要 `break`；目前，我只想展示作用域的差异，这种差异允许我们声明一个新的\
    \ `var x`。（并不建议这样做。）使用上面的 `x` 和 `y`，将以下内容输入你的播放（（playground）。\n\n```swift\nswitch(y){\n\
    case  0:\n  var x = 3  //这个 x 与上面的 x 在不同的作用域内\ncase  1:\n  print(x)\ndefault:\n\
    \  print(y)\n  print(x) \n}\n```\n\n![Image](img/00012.jpeg)\n\n（图 5.3 具有同名变量的作用域异常示例。尝试将\
    \ `switch` 语句中的值 `y` 改为其他值会发生什么。）\n\n如果这看起来和 `C` 和 `C++` 一样，那它其实并不是。`Int` 不是 `int`。`Double`\
    \ 也 `double`。事实上，`Int` 和 `Double` 都是类。它们各有一个多个属性。（顺便说一下，Swift 在这里将 `x` 和 `y` 都指定为\
    \ `Double` 而不是 `Float`。因为它无法判断你的意图，所以采取了谨慎的做法，将 `x` 和 `y` 分别设为 `Double`。关于 `Double`\
    \ 和 `Float` 的更多内容稍后可见。）\n\n`Bool(s)` 基本上如你预期的那样。（并不是 `bool`，因为它也是一个类。）我们稍后会使用它们。\n\
    \n```swift\nlet j:Bool = true\nvar B = false\n```\n\n但并没有所谓的 `Char` 或 `char`。不过，确实有一个\
    \ `Character`。`Character` 是你能找到的最接近 `C/C++` 中 `\"char\"` 的类型。我们将回到 `Character`\
    \ 和 `String`，因为在 `String` 中寻找 `Character` 并不像 `C/C++` 中那样容易。事实上，在我们涵盖许多其他内容（如\
    \ `for` 循环、`while` 循环、`if` 语句和数组）之后我会回到这里。现在让我们先玩玩数字。\n\n### 算术\n\n让我们尝试一些数学。算术运算符\
    \ `+` 和 `-` 基本上相同。\n\n```swift\nvar zPlusY = z + y\n```\n在侧栏中给了我们 `10.1`。\n\n\
    ```swift\nvar xTimesMyConstX = x*myConstX\n```\n你应该在侧栏看到 `25`。\n\n但如果你尝试写入（即更改\
    \ `myConstX` 的值）\n\n```swift\nmyConstX = 7\n```\n\n你将得到一个错误（仅如果是第一个错误时。有时只显示第一个错误。见图\
    \ 5.4）。有错误时，侧栏是空的。\n\n![Image](img/00013.jpeg)\n\n（图 5.4 错误。你不能更改用 `let` 创建的值。）\n\
    \n点击带有感叹号的红点将弹出消息。（见图 5.5）\n\n![Image](img/00014.jpeg)\n\n（图 5.5 尝试更改常量的值会导致错误。）\n\
    \n使用双斜杠 `//` 注释掉错误。\n\n你也可以像在 `C/C++` 中一样使用 `/* */`。\n\n现在尝试乘以这些：\n\n```swift\n\
    var yTimesZ = z*y\nvar MyConstXTimesZ = myConstX*z \n```\n\n前者可以。一个 `Double` 乘以一个\
    \ `Double` 得到一个 `Double`。但后者（图 5.6）失败了，因为 `Int` 无法直接乘以 `Double`。\n\n![Image](img/00015.jpeg)\n\
    \n（图 5.6 `Int` 乘以 `Double` 在 Swift 中会失败，但两个 `Double` 可以相乘。）\n\n注释掉错误。不这样做会导致播放器卡住。\n\
    \n```swift\n//var MyConstXTimesZ = myConstX*z\n```\n\n你否以某种方式将 `Int` 转换为 `Double`\
    \ 然后再相乘？可以。尝试：\n\n```swift\n//let myConstX = 5\n//var z = 5.00\nvar myConstXTimesZInt\
    \ = myConstX* Int(z)\n```\n\n侧栏中应该出现 `25`。而在使用\n\n```swift\nvar zTimesMyConstXDouble\
    \ = Double(myConstX)* z\n```\n\n我承认，当我第一次看 Swift 时，我以为它们简单地反转了 `C/C++` 的转换格式 `(int)someFloat`\
    \ 或 `(float)someInt`。但！`Double()` 或 `Int()` 实际上是函数，而不仅仅是简单的转换。你现在不需要知道它们是如何工作的。就像你从未真正需要知道\
    \ `C/C++` 中的 `strlen(word)` 是如何工作一样。（在 Swift 中是 `o = strlen(\"Me\")`。并且注意直引号。）\n\
    \n`25.05` 将出现。添加以下内容，我们将查看结果（图 5.7）\n\n```swift\nvar myConstXTimesYInt = myConstX\
    \ * Int(y)\nvar yTimesMyConstXDouble = Double(myConstX)*y\nvar zTimesMyConstXDouble\
    \ = Double(myConstX) * z\nvar zTimesMyConstXDouble2 = Double(myConstX) * y\nvar\
    \ zTimesMyConstXDouble3 = Double(myConstX) * myDoubleX\n```\n\n![Image](img/00016.jpeg)\n\
    \n图 5.7 在 `myConstXTimesZInt` 中，结果被转换为 `Int`。但在所有其他情况下，值都是 `Double`。即使对于 `var\
    \ zTimesMyConstXDouble = Double(myConstX) * z` 也是如此。答案显示为 `25`，没有小数点或零。但那个 `25`\
    \ 是一个 `double`。只是没有显著小数，所以没有显示。\n\n### 显式与隐式转换\n\n你可以显式地转换变量或常量。只需引入你的变量或常量，后面跟着一个冒号，然后是你希望它变成的类型。尝试\n\
    \n```swift\nlet f:Float = 9.99\nlet d:Double = 9.99\nlet e = 9.99\nvar fl = f*1.0002\n\
    var dl = d*1.0002\nvar el = e*1.0002\n```\n\n结果出来了（见图 5.8）。注意精度的差异。`dl` 在侧栏中有更多的小数位。`el`\
    \ 具有相同的结果，说明 Swift 确实将 `e` 解析为 `Double`。\n\n![Image](img/00017.jpeg)\n\n（图 5.8\
    \ `Double` 的精度就是为什么 Swift 除非另有说明，否则会转换为 `Double` 的原因。）\n"
- fmt: "\n# 8) If in figure 5.3 `y`s value is changed to say 1.0 before it is used\
    \ in the switch so that the default prints. What value will `print(x)` print.\n\
    \na. 5.0\nb. 3\nc. 3.0\nd. 5.01\n\n**six**\n\n## Bool Play\n\nIn your playground\
    \ type:\n\n```swift\nlet blue:Bool = true\nlet red: Int = Int(blue)\nprint(blue)\n\
    print(red)\n```\n\n![Image](images/00018.jpeg)\n\n(Figure 6.1 Not that if you\
    \ push the button on the far right of the screen the values will also appear below\
    \ the assignments. Also note that when `print()` is used for a constant or variable\
    \ it is printed in quotes.) AGAIN the command `println` has been changed to `print.`.\n\
    \nNow in the above we converted a `Bool` `blue` to an `Int`. And found the value\
    \ of it to be 1. Let’s try it the other way.\n\n```swift\nlet one = 1\nlet boolOne\
    \ = Bool(one)\n```\n\nin the above `boolOne` equals `true`. But what about \n\n\
    ```swift\nlet boolSeven = Bool(7)\n```\n\nthis also equals `true`.\n\n```swift\n\
    var boolSeven = true\nlet notBoolSeven = !boolSeven\n```\n\nhere `notBoolSeven`\
    \ will be `false`.\n\nHolding your Apple key down click on the word `Bool` in\
    \ the above. The instances and methods of the `Bool` class appear. We called a\
    \ function `Bool(7)` to return the value \"true\" of `boolSeven`. You can examine\
    \ `Int`, `Float`, `Double` etc. the same way.\n\ntry typing in:\n\n```swift\n\
    var petite = Bool(-1)\nvar zero = Bool(0)\n```\n\n(We will be using the above\
    \ in Questions below.)\n\nWhat does it take to get a value of `false` for our\
    \ `Bool` variables and constants? Are negative values inserted into `Bool()` true\
    \ or false?\n\nBools are very handy for comparisons. Just as they are in C and\
    \ C++.\n\n```swift\nvar big = 100\nvar bigCopy = big\nvar little = 4\nvar resultOfComparison\
    \ = big > little  //true\nresultOfComparison = big == little  //false\nresultOfComparison\
    \ = little <= big  //true\nresultOfComparison = big <= bigCopy  //true\nresultOfComparison\
    \ = big >= bigCopy  //true\nresultOfComparison = big <= little  //false\n```\n\
    \n## Questions\n\n1) What result will we get if we type into our playground:\n\
    \n`zero.description`\n\nA. an Error\nB. \"false\"\nC. same as `petite.description`\n\
    D. 0\n\n2) What will be the result for `var turtles` here:\n\n```swift\nvar turtles\
    \ = Bool(-1)\n```\n\nA. We have no turtles.\nB. false\nC. true\nD. We have less\
    \ than one turtle\n\n3) `var liar = false` Which of the following is equivalent.\n\
