    ![](images/00084.jpeg)


    # Understanding Swift: for C and C++ Programmers

    ## while having to learn as little Object-C as possible

    by David Francis Curran

    ©2016 David Francis Curran

    Bullray cover photograph © 2016 Ian Scott/Adobe Stock


    Understanding Swift for C and C++ programmers while having to learn as little
    Object-C as possible by David Francis Curran.


    This book is intended for people who have some background in C and C++. It is
    not really intended for complete beginners to programming. If you’d like to understand
    Swift I strongly urge you to learn about C and/or C++ or another before tackling
    Swift.


    I had to learn Object-C to port my programs from C and C++ to work on Macs and
    iPads. Swift gives you a chance to skip Object-C in a large part. This series
    of books was written to help you bridge the gap without having to spend a great
    deal of time learning Object-C. In later parts we will discuss how to include
    C or C++ into a Swift project. That inclusion will involve some Object-C. But
    I hope to enable you to write code in Swift such that you may decide to use Swift
    rather than C or C++.


    Many years ago I believed I had a problem understanding math. Apparently many
    imaginative people do. I had let the idea of math overwhelm me. Then one very
    good teacher teaching a calculus class I took over the summer started the class
    by explaining that he was going to tell us everything there was to know about
    math in the known universe. He said:


    One plus one is two: that''s addition.

    Two minus one is one: that''s subtraction.

    Two times two is four: that''s multiplication.

    Four divided by two is two: that''s division.


    And that is all there is. The complicated part of math we learned in grade school.
    Every math formula can be broken down to combinations of these four simple parts.


    I do not know how much you know or remember about programming C or C++, or what
    you know about Swift already. Because I don''t know what you know I will be explaining
    the simple parts.


    This book is intended as programmed instruction. I am going to try and program
    your brain to master the subject of the Swift Language. It is intended that you
    answer all the quiz questions at the end of each section. I have hidden some tidbits
    there that by solving will increase your knowledge. For example, Question 7 in
    the Constants and Variables section has a casting method we did not cover in the
    text. Just because a subject isn''t covered doesn''t mean it won''t work. How
    to find such things in the `xCode` references is explained too. Don''t worry about
    mistakes when evaluating things in your playground. (Although you do need to remove
    them or comment them out before continuing. An error will halt the playground''s
    ability evaluate what you''ve entered.) Keep in mind the best programmers are
    the one who have made the most mistakes and learned by them.


    Note: This work Understanding Swift for C and C++ programers is being published
    in sections for two reasons:

    1) To try and keep up with changes in Swift.

    2) To allow as many images as possible without having to limit them due to size
    of file size limitations (on uploads) on Kindle.


    I hope you enjoy this book as much as I did putting it together.


    The code for projects in this book is available online at [http://geniusat.work/swift.php](http://geniusat.work/swift.php).
    For the code for playgrounds simply copy the code off the page and paste it into
    your playground. The reason individual playground code is not online is we will
    be changing the code so often, i.e. changing single lines in playgrounds to emphasis
    errors, that including all possible playground code would be unwieldy and confusing.


    ## one

    ### Download The Program

    To run swift on your Mac you’ll need to download the latest version. Operating
    system requirements — (i.e. What version of the Mac OS X you’ll need to run the
    latest version of `Xcode`) will be explained there. `Xcode` is FREE. You only
    need to pay to become a Mac developer. But if you are just learning to program
    or just coming from C or C++ to Swift you won’t need to worry about that just
    yet.


    Note that there may be new beta versions available. Here for example ( Figure
    1.1 ) there is a 6.4 beta 2 which offers programming for the Apple Watch. For
    now, I’d stick with the current version. So download and come back when you’ve
    got `Xcode` running.


    ![Image](images/00001.jpeg)

    Figure 1.1 Apple’s Xcode download page


    ## two

    ### Lets Start Programming

    Don’t worry if you dare unfamiliar with any of the terms below. You’ll learn more
    about what they are as we go on.


    With Swift you can set up a “executable program" or you can set up a “playground."
    You can set up a “Cocoa application" or a “command line application.” And you
    can even run Swift in your “terminal.”


    * A Cocoa application is an application that runs in a window with buttons and
    text fields and your code operates depending on what input you enter. And your
    results show up in a graphical interface. ( Figure 2.1 )


    ![Image](images/00002.jpeg)

    Figure 2.1 A graphical interface for an iPad IOS application.


    * A command line application, which is what we will be demonstrating soon, is
    an application where you enter text and see your output rather than graphics.


    * A command line application, which is what we will be demonstrating soon, is
    an application where you enter text and see your output rather than graphics.
    With a command line application, which is what we will be demonstrating soon,
    is an application where you enter text and see your output rather than graphics.
    With a command line application, which is what we will be demonstrating soon,
    is an application where you enter text and see your output rather than graphics.
    With a command line application, which is what we will be demonstrating soon,
    is an application where you enter text and see your output rather than graphics.
    With a command line application, which is what we will be demonstrating soon,
    is an application where you enter text and see your output rather than graphics.
    With a command line application, which is what we will be demonstrating soon,
    is an application where you enter text and see your output rather than graphics.
    With a command line application, which is what we will be demonstrating soon,
    is an application where you enter text and see your output rather than graphics.
    If you debug it ( i.e. There are no errors in your code.) it will execute. ( Figure
    2.1 ) And your results will appear in the Debug Area’s window.


    ![Image](images/00003.jpeg)

    Figure 2.2 Run an executable file.


    ![Image](images/00004.jpeg)

    Figure 2.3 Results appear in the Debug Area’s window.


    `println` has been replaced by `print` in `Xcode` 7.1.


    * With a Swift playground you write code and see immediate feedback on your code
    in an area called the gutter. It is a great way to test your code. ( Figure 2.6
    ) Here the gutter simply repeats your string.


    ![Image](images/00005.jpeg)

    Figure 2.4 Open a playground with File -> New -> Playground.


    ![Image](images/00006.jpeg)

    Figure 2.5 MyUnderstandingSwiftPlayground. USING OS X


    ![Image](images/00007.jpeg)

    Figure 2.6 Your new playground.


    You are all set to start learning code.


    Chapter Questions

    1) A Cocoa application has a

    A. Text based interface.

    B. Graphical interface.

    C. funny interface.

    B. both a text and graphical interface.


    2) An executable program

    A. Is no different than a playground.

    B. Is Superior to a playground.

    C. Executes when you RUN it.

    D. Runs itself.


    3) An executable program prints it’s results

    A. On the internet.

    B. In the playground.

    C. In the Debug Area’s window.

    D. On television.


    4) Feedback on entries to a playground appear in

    A. In the Debug Area’s window.

    B. The gutter.

    C. The internet.

    D. A graphical Interface.


    ## three

    ### Basics

    A few introductory notes.


    You may download playgrounds and projects with either:

    [http://geniusat.work/SwiftForC_CplusplusCode.sitx](http://geniusat.work/SwiftForC_CplusplusCode.sitx)

    or

    [http://geniusat.work/SwiftForC_CplusplusCode.zip](http://geniusat.work/SwiftForC_CplusplusCode.zip)


    The playgrounds or projects chapters contain the text you may paste into Swift.
    Just delete any author notes that may be attached by your chosen reader.

