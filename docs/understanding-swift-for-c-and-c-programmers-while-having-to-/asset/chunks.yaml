    \ char. There is, however, a Character. Character is as close to a C/C++ \"char\"\
    \ as you are going to come. We will get back to Character and String, as finding\
    \ a Character in a String is not easy as it was in C/C+. In fact I will get back\
    \ to it after, we’ve covered quite a few other things such as for loops, while\
    \ loops, if statement and arrays. For now lets just play with numbers.\n\nLets\
    \ try some math. Arithmetic operators + and - are pretty much the same.  \n\n\
