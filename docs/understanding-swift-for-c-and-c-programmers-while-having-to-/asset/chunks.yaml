    \ ace = MyIntToo.a\n\nlet doc = MyIntToo.a.rawValue\n\nhere ace == a  which is\
    \ an instance of MyIntToo\n\nbut doc == 0 and is only an Int. There is no doc.a,\
    \ or doc.b or doc.c or doc.d\n\nThat is it for the first section on Enumerations.\
    \ We will get back to them in book II after covering a few more subjects.  There\
    \ is a lot more we can do with enumerations.  \n\nQuestions\n\n1) given  \n\n\
    enum An_ENUM: Int {\n\n  case a, b, c\n\n}\n\nvar Y = Int!()\n\nvar X = An_ENUM(rawValue:\
    \ Y)\n\na. var z = An_ENUM.a\n\nz will equal 2 (z == 2)\n\nb. var Y = Int!() will\
    \ cause a fatal error\n\nc. var X An_ENUM(rawValue: Y) will cause a fatal error\n\
    \nd. var X will be nil\n\n2) given\n\nenum aLittleEnum: Int {\n\n  case a = 15\
    \ ,b,c,d,e,f,g\n\n}\n\nvar w = aLittleEnum.c\n\nWhat will \n\nw.rawValue\n\nbe?\n\
    \na. 2\n\nb. 3\n\nc. 17\n\nd. 18\n\n3) given\n\nenum MyFloatEnum: Float {\n\n\
    \  case a, b, c, d, q, e, m\n\n}\n\nvar f = MyFloatEnum.e\n\n What will \n\n \
    \ f.rawValue\n\nbe?\n\na. nil\n\nb. FATAL ERROR\n\nc. 3.0\n\nd. 5.0\n\n**fourteen**\n\
    \n**Dictionaries**\n\nWhen I was working in C or C++ I would sometimes make arrays\
    \ of arrays  \n\n  int myArrayOfArrays[10][10];  \n\nor\n\nint myArrayOfArraysOfArrays[10][10][10];\
    \ //and on and on and on\n\nYou don't exactly see much of that in Swift.  \n\n\
    You could set up an Array of 1000 Int values.\n\nvar aThousandIntArray = [Int](count:\
    \ 1000, repeatedValue: 0)\n\nAnd then play with the values in it.\n\nBut the point\
    \ is always to collect data in a way that we need to use that. And Swift does\
    \ give us the opportunity to collect data in what is know as a dictionary. It\
    \ is not quite like an int myArrayOfArrays[10][10]; But you could make something\
    \ close.\n\nLets say we make a myArrayOfArrays with 100 values and say myArrayOfArrays[0][0]\
    \ = 5; myArrayOfArrays[0][1] = 7; myArrayOfArrays[0][2] = 9;\n\nall the way to\
    \ myArrayOfArrays[10][10] = 122;\n\nvar A_DICTIONARY_NAME:[Int : Int] = [ 0 :\
    \ 5, 1: 7, 2 : 9]\n\nInstead Swift has the dictionary. \n\nEach dictionary entry\
    \ is composed of two items, the first being the key and the second the value.\
    \ Here is a dictionary with strings for both the key and the value. \n\nvar myExampleDictionary:\
    \ [ String : String] = [\"Key\" : \"Value\"]\n\nItems in a Dictionary are sorted\
    \ by their key in a hash table which the user never sees. Swift takes care of\
    \ the sorting behind the scenes. Very simply Swift takes your Key, breaks it down\
    \ into a sortable code and finds your Key when you need it. Keys can be any type,\
    \ Int, Double, String, that can be converted to a hash number for storage. And\
    \ values can be of any type.  \n\nA Dictionary can be created explicitly.\n\n\
    var or let dictionaryName(colon:) [ type name for key  (colon:)  type name for\
    \ value] = [key of specified type (colon:) value of specified type (comma separator\
    \ if needed) …. key of specified type (colon:) value of specified type ]\n\nYou\
    \ could use a dictionary for a collection of last and first names, with the names\
    \ sorted by surname.\n\nvar myDictionary:[ String : String] = [\"LastNameOne\"\
    :\"David\", \"LastNameTwo\": \"Paul\", \"LastNameThree\":\"Pat\", \"LastNameFour\"\
    :\"Sean\"]\n\n//This could also be written as:\n\nvar myDictionary2: Dictionary<String\
    \ , String> = [\"LastNameOne\":\"David\", \"LastNameTwo\": \"Lee\", \"LastNameThree\"\
    :\"Pat\", \"LastNameFour\":\"Sean\"]\n\nor you can declare you dictionary inexplicitly\
    \ if you make sure there is no confusion as to what it is you are inexplicitly\
    \ declaring.\n\nvar myDictionary3 = [\"LastNameOne\":\"David\", \"LastNameTwo\"\
    : \"Lee\", \"LastNameThree\":\"Pat\", \"LastNameFour\":\"Sean\"]\n\nThere can\
    \ be no doubt in the above that both dictionary types are Strings. But if I type\
    \ in some items with values that may be Ints and end up Doubles look at how the\
    \ order changes in the gutter. \n\nvar myFunFile = [\"Dave\": 11,\"Pat\" :12,\
    \ \"Sean\" : 14.01]\n\n![Image](images/00063.jpeg)\n\n(Figure 14.1 You may be\
    \ surprised at how Swift orders items you entered. ) \n\nSwift is recognizing\
    \ these as doubles because of the one double value. Sean is first because of Swift\
    \ hash table sort which is behind the scenes.   \n\nYou can check that swift has\
    \ designated the values as Doubles with a for-in loop\n\nvar myFunFile = [\"Dave\"\
    : 11,\"Pat\" :12, \"Sean\" : 14.01]\n\nfor (key, value) in  myFunFile{\n\n  print(\"\
    \\(value * 0.202)\")\n\n}\n\nprints out:\n\n2.83002\n\n2.222\n\n2.424\n\nIf you\
    \ were to change the 14.01 value for Sean to 14 (an Int) the code above will cause\
    \ an error when you try to multiple that Int by the double 0.202\\.  \n\nTo retrieve\
    \ one value one value from a dictionary we can use\n\nlet myNameNumber = myFunFile[\"\
    Pat\"]\n\n//Will give us the value associated with [\"Pat\"] which is 12.\n\n\
    print( myNameNumber! * 0.202) //We need the ! as myNameNumber is an optional\n\
    \nWe get:\n\n12\n\n\"2.424\\n\"\n\nLets go back to trying to build something like\
    \ my myArrayOfArrays[10][10] in C or C++. We will call the dictionary myDictionaryTenTen.\n\
    \nWe could do this to fill the entire myDictionaryTenTen with numbers.\n\nFirst\
    \ we'll declare the dictionary giving it some initial values. \n\nvar  myDictionaryTenTen:[Int\
    \ : Int] = [ 0 : 5, 1 : 7, 2 : 9]\n\nThen fill the rest of our hundred slots with\
    \ the help of a for loop. \n\nfor  var i = 3; i < 100; i++ {\n\n  myDictionaryTenTen[i]\
    \ = (i + (i % 10) * 2) + 5\n\n}\n\nTo get the entire dictionary\n\nprint( myDictionaryTenTen)\n\
    \nWe can assess values with something like this. For item 99.\n\nvar myresulting\
    \ = myDictionaryTenTen[99]\n\nprint 122 in the gutter.\n\nOr for just getting\
    \ item 9 in the gutter\n\nmyDictionaryTenTen[9]\n\nprints 32 in the gutter.\n\n\
    ![Image](images/00064.jpeg)\n\n(Figure 14.2 Printing out specific key values.\
    \ Note how the 100 are ordered in a print(). ) \n\nWe can change the value of\
    \ our values in our dictionary if we know the key.  \n\nIf you look at Apples\
    \ own book on Swift you'll see this\n\nupdateValue(_: forKey:) \n\nas the function\
    \ to use for updating a value you know the key for.  There is a bit of their old\
    \ object-C here. This actually translates to:\n\nmyDictionaryTenTen.updateValue(33,\
    \ forKey: 9)\n\nupdateValue( has to be attached to your dictionary's name)\n\n\
    _: actually means put in the value followed by a comma, followed by the instruction\
    \ word with colon forKey: followed by the key and then a closing ) \n\nmyDictionaryTenTen[9]\
    \    \n\nand the result in the gutter will be \n\n33\n\nI think I'll leave our\
    \ comparison to myArrayOfArrays[10][10] here. Because though our myDictionaryTenTen\
    \ has similar values so far, it can easily be changed. Suppose I want to add another\
    \ value.   \n\nLets pick a key we haven't used: 199.  \n\nIn an array there would\
    \ be 99 missing values. But a dictionary is not an array. \n\nso \n\nmyDictionaryTenTen[199]\
    \ = (199 + (199 % 10) * 2) + 5\n\nJust adds to value 222 to a dictionary with\
    \ one hundred and one items. \n\nWe have been adding values to this myDictionaryTenTen\
    \ dictionary and using what appear to be ints as the keys. \n\nmyDictionaryTenTen.count\
    \ //gives us 101`\n\nWe have used 99 as a key in this dictionary so what will\
    \ 099 give us.\n\nmyDictionaryTenTen[099] = (099 + (099 % 10) * 2) + 5\n\ngives\
    \ us the same value 122 as myDictionaryTenTen[99] and "
