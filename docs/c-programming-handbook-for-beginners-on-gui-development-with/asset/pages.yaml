  md: '# Dynamic Memory Allocation:


    In C++, dynamic memory allocation is done using the new operator, which allocates
    memory on the heap, and the delete operator to free that memory when it is no
    longer needed. Here’s an example:


    cpp


    Copy code


    ```

    int* ptr = new int; // Allocating memory for an integer

    *ptr = 10;      // Assigning a value to the allocated memory

    delete ptr;     // Freeing the allocated memory

    ```


    In this example, memory for an integer is allocated dynamically, assigned a value,
    and later deallocated to avoid memory leaks.


    # Smart Pointers:


    C++11 introduced smart pointers, which help manage memory more safely and automatically.
    The most common smart pointers are std::unique_ptr and std::shared_ptr. These
    help prevent memory leaks and dangling pointers by automatically deallocating
    memory when it is no longer in use.


    Here’s an example of using a std::unique_ptr:


    cpp


    Copy code


    ```

    std::unique_ptr<int> ptr(new int(20)); // Automatically deallocated when going
    out of scope

    ```


    Using smart pointers can greatly simplify memory management in your Qt applications,
    especially when dealing with dynamically allocated objects.


