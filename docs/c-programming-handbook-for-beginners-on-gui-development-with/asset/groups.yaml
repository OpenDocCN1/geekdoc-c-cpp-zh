    \ Qt 应用程序中处理不同类型的事件。\n\n## 理解 Qt 中的事件\nQt 中的事件是对发生某事的通知，例如用户操作（如鼠标点击或按键）或系统触发的发生（如计时器超时）。Qt\
    \ 提供了一个全面的事件处理机制，允许开发人员对其应用程序中的各种事件做出响应。\n\n### 事件循环\n事件循环是 Qt 事件处理系统的核心。它会持续检查事件并将其分派给适当的对象进行处理。每个\
    \ Qt 应用程序都有一个事件循环，按顺序处理事件。\n要启动事件循环，会调用 QApplication::exec() 方法。此方法会阻塞程序流程，直到应用程序退出。\n\
