    ```\n\n**发出信号：**\n\n要发出信号，只需像调用普通函数一样调用信号。当信号发出时，任何已连接的槽都将被调用。\n\n```cpp\nemit\
    \ mySignal();\n```\n\n### 创建自定义信号和槽\n\n除了内置的信号和槽之外，你还可以在类中定义自己的自定义信号和槽。此功能允许更大的灵活性和封装。\n\
    \n**定义自定义信号：**\n\n要创建自定义信号，你需要在类的 signals 部分声明它。\n\n```cpp\nclass MyClass : public\
    \ QObject {\n    Q_OBJECT\n\nsignals:\n    void myCustomSignal();\n};\n```\n\n\
    **定义自定义槽：**\n\n自定义槽在 public slots 或 protected slots 部分声明。\n\n```cpp\npublic slots:\n\
