    Qt 提供了一个全面的 SQL 模块，使开发人员能够通过统一的 API 与各种数据库系统交互。QtSql 模块支持多种数据库引擎，包括 SQLite、MySQL、PostgreSQL\
    \ 和 Oracle。这允许开发人员编写与数据库无关的代码，更轻松地在不同的数据库系统之间切换，而无需对应用程序进行重大更改。\n\n## 包含 Qt SQL\
    \ 模块：\n\n要在应用程序中使用 Qt SQL 模块，你需要包含相关的头文件并链接 Qt SQL 库。确保你的项目文件 (.pro) 包含以下行：\n\n\
    ```\nQT += sql\n```\n\n## 支持的数据库驱动：\n\nQt 支持多个数据库驱动，你可以通过调用 QSqlDatabase::drivers()\
    \ 函数来检查系统上可用的驱动。该函数返回可用驱动的列表，让你可以选择最适合应用程序需求的驱动。\n\n```cpp\nQStringList drivers\
    \ = QSqlDatabase::drivers();\nqDebug() << \"Available drivers:\" << drivers;\n\
