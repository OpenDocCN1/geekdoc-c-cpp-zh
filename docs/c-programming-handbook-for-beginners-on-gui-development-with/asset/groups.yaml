    ```\n\n### 信号槽机制\n\n信号槽机制是 Qt 的一个独特功能，提供了一种灵活的方式来连接应用程序的不同组件。信号和槽用于在对象之间通信并促进事件驱动编程。\n\
    \n**信号：**\n\n当特定事件发生时发出信号。它是对象通知其他对象某些事情已发生的方式。例如，按钮在被按下时会发出 `clicked()` 信号。\n\
    \n```cpp\nQPushButton *button = new QPushButton(\"Click Me\");\nconnect(button,\
