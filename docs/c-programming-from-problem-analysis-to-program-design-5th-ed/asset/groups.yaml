    462 | Chapter 8: User-Defined Simple Data Types, Namespaces, and the string Type


    TABLE 8-1 Some string functions


    | Expression | Effect |

    | strVar.at(index) | Returns the element at the position specified by index. |

    | strVar[index] | Returns the element at the position specified by index. |

    | strVar.append(n, ch) | Appends n copies of ch to strVar, in which ch is a char
    variable or char constant. |

    | strVar.append(str) | Appends str to strVar. |

    | strVar.clear() | Deletes all the characters in strVar. |

    | strVar.compare(str) | Compares strVar and str. (This operation is discussed
    in Chapter 4.) |

    | strVar.empty() | Returns true if strVar is empty, otherwise, it returns false.
    |

    | strVar.erase() | Deletes all the characters in strVar. |

    | strVar.erase(pos, n) | Deletes n characters from strVar starting at position
    pos. |

    | strVar.find(str) | Returns the index of the first occurrence of str in strVar.
    If str is not found, the special value string:npos is returned. |

    | strVar.find(str, pos) | Returns the index of the first occurrence or after pos
    where str is found in strVar. |

    | strVar.find_first_of(str, pos) | Returns the index of the first occurrence of
    any character of strVar. The search starts at pos. |

    | strVar.find_first_not_of(str, pos) | Returns the index of the first occurrence
    of any character of str not in strVar. The search starts at pos. |

    | strVar.insert(pos, n, ch) | Inserts occurrences of the ch into strVar; pos and
    n are of type string:size_type; ch is a character. |

    | strVar.insert(pos, str) | Inserts all the characters of str at index pos into
    strVar. |

    | strVar.length() | Returns a value of type string::size_type giving the number
    of characters strVar. |'
