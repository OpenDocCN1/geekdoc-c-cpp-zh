- md: "\nThese are illegal enumeration types because none of the values is an identifier.\n\
    Following, however, are legal enumeration types:\n\nIf a value has already been\
    \ used in one enumeration type, it cannot be used by any other\nenumeration type\
    \ in the same block. The same rules apply to enumeration types declared\noutside\
    \ of any blocks. Example 8–4 illustrates this concept.\n\n# EXAMPLE 8-4\n\nConsider\
    \ the following statements:\n\n```\nenum mathStudent {JOHN, BILL, CINDY, LISA,\
    \ RON};\nenum compStudent {SUSAN, CATHY, JOHN, WILLIAM}; //illegal\n```\n\nSuppose\
    \ that these statements are in the same program in the same block. The second\n\
    enumeration type, compStudent, is not allowed because the value JOHN was used\
    \ in the\nprevious enumeration type mathStudent.\n\n# Declaring Variables\n\n\
    Once a type is defined, you can declare variables of that type. The syntax for\n\
    declaring variables of an enum type is the same as before:\n\n```\ndataType identifier,\
    \ identifier,...,;\n```\n\nThe statement:\n\n```\nenum sports {BASKETBALL, FOOTBALL,\
    \ HOCKEY, BASEBALL, SOCCER,\nVOLLEYBALL};\n```\n\ndefines an enumeration type\
    \ called sports. The statement:\n\nsportsPopularSport, mySport;\n\ndeclares popularSport\
    \ and mySport to be variables of type sports.\n\n# Assignment\n\nOnce a variable\
    \ is declared, you can store values in it. Assuming the previous declaration,\n\
    the statement:\n\n```\npopularSport = FOOTBALL;\n```\n\nstores FOOTBALL in popularSport.\
    \ The statement:\n\nmySport = popularSport;\n\ncopies the value of popularSport\
    \ into mySport.\n\n# Operations on Enumeration Types\n\nNo arithmetic operations\
    \ are allowed on the enumeration type. So the following statements are illegal:\n\
    \n```\nmySport = popularSport + 2;               //illegal\npopularSport = FOOTBALL\
    \ + SOCCER;     //illegal\npopularSport = popularSport * 2;       //illegal\n\
    ```\n\nAlso, the increment and decrement operations are not allowed on enumeration\
    \ types. So the following statements are illegal:\n\n```\npopularSport++;    \
    \           //illegal\npopularSport--;               //illegal\n```\n\nSuppose\
    \ you want to increment the value of popularSport by 1. You can use the cast operator\
    \ as:\n\n```\npopularSport = static_cast<sports>(popularSport + 1);\n```\n\nWhen\
    \ the name is used, the compiler assumes that the user understands what he or\
    \ she is doing. Thus, the preceding statement is compiled, and during execution,\
    \ it advances the value of popularSport to the next value in the list. Consider\
    \ the following statements:\n\n```\npopularSport = FOOTBALL;\npopularSport = static_cast<sports>(popularSport\
    \ + 1);\n```\n\nAfter the second statement, the value of popularSport is HOCKEY.\
    \ Similarly, the result in storing BASKETBALL in popularSport.\n\n```\npopularSport\
    \ = FOOTBALL;\npopularSport = static_cast<sports>(popularSport - 1);\n```\n\n\
    result in storing BASKETBALL in popularSport.\n\n# Relational Operators\n\nBecause\
    \ an enumeration is an ordered set of values, the relational operators can be\
    \ used with the enumeration type. Again, suppose you have the enumeration type\
    \ sports and the variables popularSport and mySport as defined earlier. Then:\n\
    \n```\nFOOTBALL <= SOCCER true\nHOCKEY > BASKETBALL true\nBASEBALL < FOOTBALL\
    \ false\n```\n\nSuppose that:\n\n```\npopularSport = SOCCER;\nmySport = VOLLEYBALL;\n\
    ```\n\nThen:\n\n```\npopularSport < mySport is true\n```\n\n# ENUMERATION TYPES\
    \ AND LOOPS\n\nRecall that the enumeration type is an integral type and, using\
    \ the cast operator (operator that is, name), you can increment, decrement, and\
    \ compare the values of the enumeration type. Therefore, you can use these enumeration\
    \ types in loops. Suppose mySport is a variable declared earlier. Consider the\
    \ following for loop:\n\n```\nfor (mySport = BASKETBALL; mySport < SOCCER;\nmySport\
    \ = static_cast<sports>(mySport + 1))\n```\n\n..\n\nThis for loop has five iterations.\n\
    \nUsing enumerations in loops increases the readability of the program.\n\n# Input/Output\
    \ of Enumeration Types\n\nBecause input and output are defined only for built-in\
    \ data types such as int, char, double, and so on, the enumeration type can be\
    \ neither input nor output (directly). However, you can input and output indirectly.\
    \ Example 8-5 illustrates this.\n\nSuppose you have the following statements:\n\
    \n```\nenum courses {ALGEBRA, ANALYSIS, BASIC, CHEMISTRY, CPP, HISTORY, PASCAL,\
    \ PHILOSOPHY};\n```\n\nThe variable of type `courses` is declared. To input the\
    \ value, say, use the following structure:\n\n```\nchar ch1, ch2;\ncout << \"\
    Enter the two letters of the course: \" << endl;\ncin >> ch1 >> ch2;\n\nswitch\
    \ (ch1)\n{\ncase 'a':\ncase 'A':\n    if (ch2 == 'l' || ch2 == 'L')\n        registered\
    \ = ALGEBRA;\n    else\n        registered = ANALYSIS;\n    break;\ncase 'b':\n\
    case 'B':\n    registered = BASIC;\n    break;\ncase 'c':\ncase 'C':\n    if (ch2\
    \ == 'h' || ch2 == 'H')\n        registered = CHEMISTRY;\n    else\n        registered\
    \ = CPP;\n    break;\ncase 'h':\ncase 'H':\n    registered = HISTORY;\n    break;\n\
    case 'p':\ncase 'P':\n    if (ch2 == 'a' || ch2 == 'A')\n        registered =\
    \ PASCAL;\n    else\n        registered = PHILOSOPHY;\n    break;\ndefault:\n\
    \    cout << \"Illegal input.\" << endl;\n}\n```\n\nSimilarly, you can output\
    \ the enumeration type directly:\n\n```\nswitch (registered)\n{\n    case ALGEBRA:\n\
    \        cout << \"Algebra\";\n        break;\n    case ANALYSIS:\n        cout\
    \ << \"Analysis\";\n        break;\n    case BASIC:\n        cout << \"Basic\"\
    ;\n        break;\n    case CHEMISTRY:\n        cout << \"Chemistry\";\n     \
    \   break;\n    case CPP:\n        cout << \"CPP\";\n        break;\n    case\
    \ HISTORY:\n        cout << \"History\";\n        break;\n    case PASCAL:\n \
    \       cout << \"Pascal\";\n        break;\n    case PHILOSOPHY:\n        cout\
    \ << \"Philosophy\";\n        break;\n}\n```\n\n# Functions and Enumeration Types\n\
    \nYou can pass the enumeration type as a parameter to functions like any other\
    \ simple type—that is, by value or reference. Also, just like any simple type,\
    \ a function can return a value of the enumeration type. Using this facility,\
    \ you can use functions to input and output enumeration types. The following function\
    \ inputs data from the keyboard and returns a value of the enumeration type. Assume\
    \ that the enumeration type courses is defined as before:\n\n```cpp\ncourses readCourse()\n\
    {\n    courses registered;\n    char ch1, ch2;\n\n    cout << \"Enter the two\
    \ letters of the course: \" << endl;\n    cin >> ch1 >> ch2;\n\n    switch (ch1)\n\
    \    {\n        case 'a':\n        case 'A':\n            if (ch2 == 'l' || ch2\
    \ == 'L')\n                registered = ALGEBRA;\n            else\n         \
    \       registered = ANALYSIS;\n            break;\n        case 'b':\n      \
    \  case 'B':\n            registered = BASIC;\n            break;\n        case\
    \ 'c':\n        case 'C':\n            if (ch2 == 'h' || ch2 == 'H')\n       \
    \         registered = CHEMISTRY;\n            else\n                registered\
    \ = CPP;\n            break;\n        case 'h':\n        case 'H':\n         \
    \   registered = HISTORY;\n            break;\n        case 'p':\n        case\
    \ 'P':\n            if (ch2 == 'a' || ch2 == 'A')\n                registered\
    \ = PASCAL;\n            else\n                registered = PHILOSOPHY;\n    \
    \        break;\n        default:\n            cout << \"Illegal input.\" << endl;\n\
    \    }\n    return registered;\n}\n//end readCourse\n```\n\nThe following function\
    \ outputs an enumeration type value:\n\n```cpp\nvoid printEnum(courses registered)\n\
    {\n    switch (registered)\n    {\n        case ALGEBRA:\n            cout <<\
    \ \"Algebra\";\n            break;\n        case ANALYSIS:\n            cout <<\
    \ \"Analysis\";\n            break;\n        case BASIC:\n            cout <<\
    \ \"Basic\";\n            break;\n        case CHEMISTRY:\n            cout <<\
    \ \"Chemistry\";\n            break;\n        case CPP:\n            cout << \"\
    CPP\";\n            break;\n        case HISTORY:\n            cout << \"History\"\
    ;\n            break;\n        case PASCAL:\n            cout << \"Pascal\";\n\
    \            break;\n        case PHILOSOPHY:\n            cout << \"Philosophy\"\
    ;\n            break;\n    }\n}\n```\n"
  mdcn: "\n\n这些是非合法的枚举类型，因为没有任何一个值是标识符。\n然而，以下是合法的枚举类型：\n\n如果一个值已经在某个枚举类型中使用，则它不能在同一个块的任何其他枚举类型中使用。同样的规则也适用于在任何块之外定义的枚举类型。示例\
    \ 8–4 阐了这一概念。\n\n# 示例 8-4\n\n考虑以下语句：\n\n```\nenum mathStudent {JOHN, BILL, CINDY,\
    \ LISA, RON};\nenum compStudent {SUSAN, CATHY, JOHN, WILLIAM}; //非法\n```\n\n假设这些语句位于同一个程序的同一个块中。第二个枚举类型\
    \ `compStudent` 是不允许的，因为值 `JOHN` 已经在之前的枚举类型 `mathStudent` 中被使用了。\n\n# 声明变量\n\n\
    一旦定义了类型，你就可以声明该类型的变量。声明枚举类型变量的语法与之前相同：\n\n```\ndataType identifier, identifier,...,;\n\
    ```\n\n语句：\n\n```\nenum sports {BASKETBALL, FOOTBALL, HOCKEY, BASEBALL, SOCCER,\n\
    VOLLEYBALL};\n```\n\n定义了一个名为 `sports` 的枚举类型。语句：\n\npopularSport, mySport;\n\n\
    将 `popularSport` 和 `mySport` 声明为类型 `sports` 的变量。\n\n# 赋值\n\n一旦声明了变量，你就可以在其中存储值。假设前面的声明，语句：\n\
    \n```\npopularSport = FOOTBALL;\n```\n\n将 `FOOTBALL` 存储在 `popularSport` 中。语句：\n\
    \nmySport = popularSport;\n\n将 `popularSport` 的值 copies 复制到 `mySport` 中。\n\n#\
    \ 枚举类型的操作\n\n枚举类型不允许进行算术运算。因此，以下语句是非法的：\n\n```\nmySport = popularSport + 2;  \
    \             //非法\npopularSport = FOOTBALL + SOCCER;     //非法\npopularSport =\
    \ popularSport * 2;       //非法\n```\n\n此外，枚举类型不允许进行自增和自减操作。因此，以下语句是非法的：\n\n```\n\
    popularSport++;               //非法\npopularSport--;               //非法\n```\n\n\
    假设你想将 `popularSport` 的值加 1。你可以使用类型转换运算符：\n\n```\npopularSport = static_cast<sports>(popularSport\
    \ + 1);\n```\n\n当使用该名称时，编译器假设用户理解其正在做什么。因此，前面的语句会被编译，并且在执行期间，它会将 `popularSport`\
    \ 的值推进到列表中的下一个值。考虑以下语句：\n\n```\npopularSport = FOOTBALL;\npopularSport = static_cast<sports>(popularSport\
    \ + 1);\n```\n\n在第二个语句之后，`popularSport` 的值为 `HOCKEY`。同样，将 `BASKETBALL` 存储在 `popularSport`\
    \ 中的结果如下：\n\n```\npopularSport = FOOTBALL;\npopularSport = static_cast<sports>(popularSport\
    \ - 1);\n```\n\n结果是将 `BASKETBALL` 存储在 `popularSport` 中。\n\n# 关系运算符\n\n由于枚举是一个有序的值集合，关系运算符可以与枚举类型一起使用。同样假设你拥有之前定义的\
    \ `sports` 枚举类型以及变量 `popularSport` 和 `mySport`。那么：\n\n```\nFOOTBALL <= SOCCER\
    \ true\nHOCKEY > BASKETBALL true\nBASEBALL < FOOTBALL false\n```\n\n假设：\n\n```\n\
    popularSport = SOCCER;\nmySport = VOLLEYBALL;\n```\n\n那么：\n\n```\npopularSport\
    \ < mySport is true\n```\n\n# 枚举类型与循环\n\n回想枚举类型是一种整类型，使用类型转换运算符（即 `operator (type,\
    \ name)`），你可以递增、递减和比较枚举类型的值。因此，你可以在循环中使用这些枚举类型。假设 `mySport` 是之前声明的变量。考虑以下 `for`\
    \ 循环：\n\n```\nfor (mySport = BASKETBALL; mySport < SOCCER;\nmySport = static_cast<sports>(mySport\
    \ + 1))\n```\n\n这个 `for` 循环有五次迭代。在循环中使用枚举增加了程序的可读性。\n\n# 枚举类型的输入/输出\n\n由于输入和输出只定义了\
    \ `int`、`char` 等内置类型，枚举类型既不能直接输入也不能直接输出。然而，你可以间接地进行。假设你拥有以下语句：\n\n```\nenum courses\
    \ {ALGEBRA, ANALYSIS, BASIC, CHEMISTRY, HISTORY, PASCAL, PHILOSOPHY};\n```\n\n\
    为了输入，例如使用以下结构：\n\n```cpp\nchar ch1, ch2;\n\ncout << \"Enter the two letters of\
    \ the course: \" << endl;\ncin >> ch1 >> ch2;\n\nswitch (ch1)\n{\n    case 'a':\n\
    \    case 'A':\n        if (ch2 == 'l' || ch2 == 'L')\n            registered\
    \ = ALGEBRA;\n        else\n            registered = ANALYSIS;\n        break;\n\
    \    case 'b':\n    case 'B':\n        registered = BASIC;\n        break;\n \
    \   case 'c':\n    case 'C':\n        if (ch2 == 'h' || ch2 == 'H')\n        \
    \    registered = CHEMISTRY;\n        else\n            registered = CPP;\n  \
    \      break;\n    case 'h':\n    case 'H':\n        registered = HISTORY;\n \
    \       break;\n    case 'p':\n    case 'P':\n        if (ch2 == 'a' || ch2 ==\
    \ 'A')\n            registered = PASCAL;\n        else\n            registered\
    \ = PHILOSOPHY;\n        break;\n    default:\n        cout << \"Illegal input.\"\
    \ << endl;\n}\n```\n\n同样，你可以直接输出枚举类型：\n\n```cpp\nswitch (registered)\n{\n    case\
    \ ALGEBRA:\n        cout << \"Algebra\";\n        break;\n    case ANALYSIS:\n\
    \        cout << \"Analysis\";\n        break;\n    case BASIC:\n        cout\
    \ << \"Basic\";\n        break;\n    case CHEMISTRY:\n        cout << \"Chemistry\"\
    ;\n        break;\n    case CPP:\n        cout << \"CPP\";\n        break;\n \
    \   case HISTORY:\n        cout << \"History\";\n        break;\n    case PASCAL:\n\
    \        cout << \"Pascal\";\n        break;\n    case PHILOSOPHY:\n        cout\
    \ << \"Philosophy\";\n        break;\n}\n```\n\n# 函数与枚举类型\n\n你可以像其他简单类型一样将枚举类型传递给函数——即通过值或引用。此外，就像简单类型一样，函数也可以返回枚举类型的值。通过这种机制，你可以使用函数来输入枚举类型。假设枚举类型定义之前：\n\
    \n```cpp\ncourses readCourse()\n{\n    courses registered;\n    char ch1, ch2;\n\
    \n    cout << \"Enter the two letters of the course: \" << endl;\n    cin >> ch1\
    \ >> ch2;\n\n    switch (ch1)\n    {\n        case 'a':\n        case 'A':\n \
    \           if (ch2 == 'l' || ch2 == 'L')\n                registered = ALGEBRA;\n\
    \            else\n                registered = ANALYSIS;\n            break;\n\
    \        case 'b':\n        case 'B':\n            registered = BASIC;\n     \
    \       break;\n        case 'c':\n        case 'C':\n            if (ch2 == 'h'\
    \ || ch2 == 'H')\n                registered = CHEMISTRY;\n            else\n\
    \                registered = CPP;\n            break;\n        case 'h':\n  \
    \      case 'H':\n            registered = HISTORY;\n            break;\n    \
    \    case 'p':\n        case 'P':\n            if (ch2 == 'a' || ch2 == 'A')\n\
    \                registered = PASCAL;\n            else\n                registered\
    \ = PHILOSOPHY;\n            break;\n        default:\n            cout << \"\
    Illegal input.\" << endl;\n    }\n    return registered;\n}\n//end readCourse\n\
    ```\n\n以下函数输出一个枚举类型值：\n\n```cpp\nvoid printEnum(courses registered)\n{\n    switch\
    \ (registered)\n    {\n        case ALGEBRA:\n            cout << \"Algebra\"\
    ;\n            break;\n        case ANALYSIS:\n            cout << \"Analysis\"\
    ;\n            break;\n        case BASIC:\n            cout << \"Basic\";\n \
    \           break;\n        case CHEMISTRY:\n            cout << \"Chemistry\"\
    ;\n            break;\n        case CPP:\n            cout << \"CPP\";\n     \
    \       break;\n        case HISTORY:\n            cout << \"History\";\n    \
    \        break;\n        case PASCAL:\n            cout << \"Pascal\";\n     \
    \       break;\n        case PHILOSOPHY:\n            cout << \"Philosophy\";\n\
    \            break;\n    }\n}\n```\n\n"
