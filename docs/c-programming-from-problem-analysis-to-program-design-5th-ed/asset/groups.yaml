    Children often play the game of rock, paper, and scissors. This game has two players,
    each of whom chooses one of the three objects: rock, paper, or scissors. If player
    1 chooses rock and player 2 chooses paper, player 2 wins the game because paper
    covers rock. The game is played according to the following rules:


