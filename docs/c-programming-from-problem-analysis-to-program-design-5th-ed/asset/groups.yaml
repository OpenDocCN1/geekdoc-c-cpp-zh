- md: "\nIn subsequent chapters, unless specified otherwise, the C++ syntax applies\
    \ to standards. First, we discuss the namespace mechanism of the ANSI/ISO Standard\
    \ C++, which was introduced in Chapter 2.\n\nWhen a header file, such as iostream,\
    \ is included in a program, the global identifiers in the header file also become\
    \ the global identifiers in the program. Therefore, if a global identifier in\
    \ a program has the same name as one of the global identifiers in the header file,\
    \ the compiler generates a syntax error (such as \"identifier redefined\"). The\
    \ same problem can occur if a program uses third-party libraries. To overcome\
    \ this problem, third-party vendors begin their identifiers with a special symbol.\
    \ In Chapter 2, you learned that compiler vendors begin their global identifier\
    \ names with an underscore (_), to avoid linking identifiers.\n\nANSI/ISO Standard\
    \ C++ tries to solve this problem of overlapping global identifiers with the namespace\
    \ mechanism.\n\nThe general statement of the namespace is:\n\n```cpp\nnamespace\
    \ namespace_name\n{\n    members\n}\n```\n\nwhere members is usually named constants,\
    \ variable declarations, functions, or other namespaces. Note that namespace_name\
    \ is a C++ identifier.\n\nIn C++, namespace is a reserved word.\n\n## EXAMPLE\
    \ 8-8\n\nThe statement:\n\n```cpp\nnamespace globalType\n{\n    const int N =\
    \ 10;\n    const double RATE = 7.50;\n    int count = 0;\n    void printResult();\n\
    }\n```\n\ndefines globalType to be a namespace with four members: named constants\
    \ N and RATE, the variable count, and the function printResult.\n\nThe scope of\
    \ a namespace member is local to the namespace. You can usually access a namespace\
    \ member outside the namespace in one of two ways, as described below.\n\nThe\
    \ general syntax for accessing a namespace member is:\n\n```cpp\nnamespace_name::identifier\n\
    ```\n\nRecall that in C++, :: is called the scope resolution operator.\nTo access\
    \ the member RATE of the globalType, the following statement is required:\n\n\
    `globalType::RATE`\n\nTo access the member printResult (which is a function),\
    \ the following statement is required:\n\n`globalType::printResult();`\n\nThus,\
    \ to access a namespace, you use the namespace_name, followed by the scope resolution\
    \ operator, by the member name.\n\nTo simplify the accessing of a namespace, ANSI/ISO\
    \ Standard C++ provides the use of the statement using. The syntax to use the\
    \ statement using is as follows:\n\n- a. To simplify the accessing of all namespace\
    \ members:\n  `using namespace namespace_name;`\n- b. To simplify the accessing\
    \ of a specific namespace member:\n  `using namespace_name::identifier;`\n\nFor\
    \ example, the using statement:\n`using namespace globalType;`\nsimplifies the\
    \ accessing of all members of the namespace globalType. The statement:\n`using\
    \ globalType::RATE;`\nsimplifies the accessing of the member RATE of the namespace\
    \ globalType.\n\nIn C++, using is a reserved word. You typically put the using\
    \ statement after the namespace declaration. For the namespace globalType, for\
    \ example, you usually write the code as follows:\n\n```cpp\nnamespace globalType\n\
    {\n  const int N = 10;\n  const double RATE = 7.50;\n  int count = 0;\n  void\
    \ printResult();\n}\nusing namespace globalType;\n```\n\nAfter the using statement,\
    \ to access a namespace member, you do not have to put the namespace_name and\
    \ the scope resolution operator before the namespace member. However, if a namespace\
    \ member and a global identifier in a program have the same name, to access this\
    \ namespace member in the program, the namespace_name and the scope resolution\
    \ operator must precede the namespace member. Similarly, if a namespace member\
    \ in the block, and an identifier in a block have the same name, to access this\
    \ namespace member in the block, the namespace_name and the scope resolution operator\
    \ must precede the namespace member.\n\nExamples 8-9 through 8-12 clarify the\
    \ use of the namespace mechanism.\n\n## EXAMPLE 8-9\n\nConsider the following\
    \ C++ code:\n\n```cpp\n#include <iostream>\nusing namespace std;\n\nint main()\n\
    {\n}\n```\n\nIn this example, you can refer to the global identifiers of the header\
    \ file iostream, such as cin, cout, and endl, without using the prefix std:: before\
    \ the identifier name. The obvious restriction is that the block (or function)\
    \ that refers to the global identifier (of the header file iostream) must not\
    \ contain any identifier with the same name as this global identifier.\n\n## EXAMPLE\
    \ 8-10\n\nConsider the following C++ code:\n\n```cpp\n#include <cmath>\nint main()\n\
    {\n    double x = 15.3;\n    double y;\n    y = std::pow(x, 2);\n    ...\n}\n\
    ```\n\nThis example accesses the function pow of the header file cmath.\n\n##\
    \ EXAMPLE 8-11\n\nConsider the following C++ code:\n\n```cpp\n#include <iostream>\n\
    int main() {\n    using namespace std;\n}\n```\n\nIn this example, the function\
    \ main can refer to the global identifiers of the header file iostream without\
    \ using the prefix std:: before the identifier name. The using statement appears\
    \ inside the function main. Therefore, other functions (if any) should use the\
    \ prefix std:: before the name of the global identifier of the header file iostream\
    \ unless the function has a similar using statement.\n\n## EXAMPLE 8-12\n\nConsider\
    \ the following C++ code:\n\n```cpp\n#include <iostream>                     \
    \          //Line 1\nusing namespace std;                             //Line 2\n\
    int t;                                           //Line 3\nnamespace expN {  \
    \                               //Line 4\n    string t;                      \
    \              //Line 5\n    void printResult();                          //Line\
    \ 6\ndouble u;                                     //Line 7\n}\nint main() { \
    \                                   //Line 8\n    int one;                   \
    \               //Line 9\n    int two;                                  //Line\
    \ 10\n    int three;                                //Line 11\n    double u; \
    \                                //Line 12\n}\n```\n\nNamespaces\n\n> The identifiers\
    \ in system-provided header files, such as iostream, cmath, and iomanip, are defined\
    \ in the namespace std. For this reason, to simplify the accessing of identifiers\
    \ from these header files, we have been using the following statement:\n\n`using\
    \ namespace std;`\n\n## string Type\n\nIn Chapter 2, you were introduced to the\
    \ data type string. Recall that prior to the ANSI/ISO C++ language, the Standard\
    \ C++ library did not provide a string type. Compiler vendors often supplied their\
    \ programmer-defined string type, and the syntax and semantics of string operations\
    \ often varied from vendor to language; the data type string is a programmer-defined\
    \ type and is part of the C++ language; the C++ standard library supplies it.\
    \ Before using the data type string, the program must include the header file\
    \ string, as follows:\n\n```cpp\n#include <string>\n```\n\nRecall that in C++,\
    \ a string is a sequence of zero or more characters, and strings are enclosed\
    \ in double quotation marks.\n\nThe statement:\n\n```cpp\nstring name = \"William\
    \ Jacob\";\n```\n\ndeclares name to be a string variable and initializes name\
    \ to \"William Jacob\". The position of the first character, W, in name is 0;\
    \ the position of the second character, i, is 1; and so on. That, the position\
    \ of the first character in a string variable starts with 0, not 1.\n\nThe variable\
    \ name can store any size string. \n\nChapter 3 discussed I/O operations on the\
    \ string type; Chapter 4 explained relational operations on the string type. We\
    \ recommend you revisit Chapters 3 and 4 and review the I/O and relational operations\
    \ on the string type.\n\nOther operators, as the binary operator + (to allow the\
    \ string concatenation operation) and the array index (script) operator [], have\
    \ also been defined for the data type string. Let's see how these operators work\
    \ on the string data type.\n\nSuppose you have the following declarations:\n\n\
    ```cpp\nstring str1, str2, str3;\n```\n"
  mdcn: "\n在后续章节中，除非另有说明，C++ 语法适用于所有标准。首先，我们将讨论 ANSI/ISO 标准 C++ 的命名空间机制，该机制在第 2 章中介绍。\n\
    \n当程序包含一个头文件（如 `iostream`）时，头文件中的全局标识符也会成为程序中的全局标识符。因此，如果程序中的一个全局标识符与头文件中的某个全局标识符同名，编译器将产生语法错误（例如“标识符重定义”）。当程序使用第三方库时，也会发生相同的问题。为了解决这个问题，第三方供应商开始使用特殊符号作为标识符的开头。在第\
    \ 2 章中，你学过编译器供应商的全局标识符名称以下划线（`_`）开头以避免标识符冲突。\n\nANSI/ISO 标准 C++ 试图通过命名空间机制来解决全局标识符冲突的问题。\n\
    \n命名空间的通用语句为：\n\n```cpp\nnamespace namespace_name\n{\n    members\n}\n```\n\n\
    其中 `members` 通常是命名常量、变量声明、函数或其他命名空间。注意 `namespace_name` 是一个 C++ 标识符。\n\n在 C++\
    \ 中，`namespace` 是保留字。\n\n## 示例 8-8\n\n该语句：\n\n```cpp\nnamespace globalType\n{\n\
    \    const int N = 10;\n    const double RATE = 7.50;\n    int count = 0;\n  \
    \  void printResult();\n}\n```\n\n将 `globalType` 定义为一个包含四个成员的命名空间：命名常量 `N` 和 `RATE`、变量\
    \ `count` 以及函数 `printResult`。\n\n命名空间成员的作用域是局限于命名空间的。你通常可以通过以下两种方式在命名空间外访问命名空间成员，如下所示。\n\
    \n访问命名空间成员的通用语法为：\n\n```cpp\nnamespace_name::identifier\n```\n\n回在 C++ 中，`::`\
    \ 被称为作用域解析运算符。\n要访问 `globalType` 的成员 `RATE`，需要以下语句：\n\n`globalType::RATE`\n\n\
    要访问成员 `printResult`（这是一个函数），需要以下语句：\n\n`globalType::printResult();`\n\n因此，要访问命名空间，你使用\
    \ `namespace_name`，后跟作用域解析运算符，最后是成员名。\n\n为了简化对命名空间的访问，ANSI/ISO 标准 C++ 提供了 `using`语句。`using`\
    \ 语句的语法如下：\n\n- a. 简化所有命名空间成员的访问：\n  `using namespace namespace_name;`\n- b. 简化特定命名空间成员的访问：\n\
    \  `using namespace_name::identifier;`\n\n例如，`using`语句：\n`using namespace globalType;`\n\
    简化了对 `globalType` 命名空间所有成员的访问。语句：\n`using globalType::RATE;`\n简化了对 `globalType`\
    \ 命名空间成员 `RATE` 的访问。\n\n在 C++ 中，`using` 是保留字。你通常将 `using`语句放在命名空间声明之后。例如，对于命名空间\
    \ `globalType`，你通常如下编写：\n\n```cpp\nnamespace globalType\n{\n  const int N = 10;\n\
    \  const double RATE = 7.50;\n  int count = 0;\n  void printResult();\n}\nusing\
    \ namespace globalType;\n```\n\n在使用 `using` 语句之后，访问命名空间成员时不需要在命名空间成员之前加上 `namespace_name`\
