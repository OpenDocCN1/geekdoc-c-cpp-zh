    # Operations on Enumeration Types


    No arithmetic operations are allowed on the enumeration type. So the following
    statements are illegal:


    ```

    mySport = popularSport + 2;               //illegal

    popularSport = FOOTBALL + SOCCER;     //illegal

    popularSport = popularSport * 2;       //illegal

    ```


    Also, the increment and decrement operations are not allowed on enumeration types.
    So the following statements are illegal:


    ```

    popularSport++;               //illegal

    popularSport--;               //illegal

    ```


    Suppose you want to increment the value of popularSport by 1. You can use the
    cast operator as:


    ```

    popularSport = static_cast<sports>(popularSport + 1);

    ```


    When the name is used, the compiler assumes that the user understands what he
    or she is doing. Thus, the preceding statement is compiled, and during execution,
    it advances the value of popularSport to the next value in the list. Consider
    the following statements:


    ```

    popularSport = FOOTBALL;

    popularSport = static_cast<sports>(popularSport + 1);

    ```


    After the second statement, the value of popularSport is HOCKEY. Similarly, the
    result in storing BASKETBALL in popularSport.


    ```

    popularSport = FOOTBALL;

    popularSport = static_cast<sports>(popularSport - 1);

    ```


    result in storing BASKETBALL in popularSport.


    # Relational Operators


    Because an enumeration is an ordered set of values, the relational operators can
    be used with the enumeration type. Again, suppose you have the enumeration type
    sports and the variables popularSport and mySport as defined earlier. Then:


    ```

    FOOTBALL <= SOCCER true

    HOCKEY > BASKETBALL true

    BASEBALL < FOOTBALL false

    ```'
