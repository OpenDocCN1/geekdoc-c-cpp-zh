    # string Type


    In Chapter 2, you were introduced to the data type string. Recall that prior to
    the ANSI/ISO C++ language standard, the Standard C++ library did not provide a
    string data type. Compiler vendors often supplied their programmer-defined string
    type, and the syntax and semantics of string operations often varied from vendor
    to language;


    The data type string is a programmer-defined type and is not part of the C++ language;
    the C++ standard library supplies it. Before using the data type string, the program
    must include the header file string, as follows:


    ```

    #include <string>

    ```


    Recall that in C++, a string is a sequence of zero or more characters, and strings
    are enclosed in double quotation marks.


    The statement:


    ```

    string name = "William Jacob";

    ```


    declares name to be a string variable and initializes name to "William Jacob".
    The position of the first character, W, in name is 0; the position of the second
    character, i, is 1; and so on. That, the position of the first character in a
    string variable starts with 0, not 1.


    The variable name can store (just) any size string.


    Chapter 3 discussed I/O operations on the string type; Chapter 4 explained relational
    operations on the string type. We recommend you revisit Chapters 3 and 4 and review
    the I/O and relational operations on the string type.


    Other operators, as the binary operator + (to allow the string concatenation operation)
    and the array index (script) operator [], have also been defined for the data
    type string. Let''s see how these operators work on the string data type.


    Suppose you have the following declarations:


    ```

    string str1, str2, str3;

    ```'
