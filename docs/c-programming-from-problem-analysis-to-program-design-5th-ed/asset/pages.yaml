    # typedef Statement


    In C++, you can create synonyms or aliases to a previously defined data type by
    using the typedef statement. The general syntax of the typedef statement is:


    ```

    typedef existingTypeName newTypeName;

    ```


    In C++, typedef is a reserved word. Note that the typedef statement does not create
    any data type; it creates only an alias to an existing data type.


    > EXAMPLE 8-6


    The statement:

    typef int integer;


    creates an alias, integer, for the data type int. Similarly, the statement:


    typedef real;

    creates an alias, real, for the data type double. The statement:


    typedef decimal;

    creates an alias, decimal, for the data type double.


