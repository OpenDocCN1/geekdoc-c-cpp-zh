  md: 'The statement:


    ```

    str1 = "Hello There";

    ```


    stores the string "Hello There" in str1. The statement:


    ```

    str2 = str1;

    ```


    copies the value of str1 into str2.


    If str1 = "Sunny", the statement:


    ```

    str2 = str1 + " Day";

    ```


    stores the string "Sunny Day" into str2.


    Suppose str1 = "Hello " + str2 = "There". The statement:


    ```

    str3 = str1 + " " + str2;

    ```


    stores "Hello" into str3. This statement is equivalent to the statement:


    ```

    str3 = str1 + '' '' + str2;

    ```


    Also, the statement:


    ```

    str1 = str1 + " Mickey";

    ```


    updates the value of str1 by appending the string "Mickey" to its old value. Therefore,
    the new value of str1 is "Hello Mickey".


    > For the operator + to work with the string data type, one of the operands of
    + must be a string variable. For example, the following statements will not work:


    ```

    str1 = "Hello " + "there!"; //illegal

    str2 = "Sunny Day " + '' ''!''; //illegal

    ```


    If str1 = "Hello there", the statement:


    ```

    str1[6] = ''T'';

    ```


    replaces the t with the character T. Recall that the position of the first character
    in a string variable is 0. Therefore, because t is the seventh character in str1,
    its position is 6.


    In C++,[] is called the array subscript operator.


    As illustrated previously, using the array subscript operator together with the
    position of the character, you can access an individual character within a string.'
