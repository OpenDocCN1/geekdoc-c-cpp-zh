    # Declaring Variables When Defining the Enumeration Type


    In previous sections, you first defined an enumeration and then declared variables
    of that type. C++ allows you to combine these steps into one. That is, you can
    declare variables of an enumeration type when you define an enumeration type.
    For example, the statement:


    ```

    enum {A, B, C, D, F} courseGrade;

    ```


    defines an enumeration type, grades, and declares a variable courseGrade of type
    grades.


    Similarly, the statement:


    ```

    enum {PENNY, NICKEL, DIME, HALFDOLLAR, DOLLAR} change, usCoins;

    ```


    defines an enumeration type, coins, and declares two variables, change and usCoins,

    ofype coins.


    # Anonymous Data Types


    A data type therein you directly specify values in the variable declaration with
    no name is called an anonymous type. The following statement creates an anonymous
    type:


    ```

    enum {BASKETBALL, FOOTBALL, BASEBALL, HOCKEY} mySport;

    ```


    This statement specifies the values and declares a variable mySport, but no name
    is given to the data type.


    Creating an anonymous type, however, has drawbacks. First, because there is no
    name for the type, you cannot pass an anonymous type as a parameter to a function,
    and a function cannot return an anonymous type value. Second, values used in one
    anonymous type can be used in another anonymous type, but variables of those types
    are treated differently. Consider the following statements:


    ```

    enum {ENGLISH, FRENCH, SPANISH, GERMAN, RUSSIAN} languages;

    enum {ENGLISH, FRENCH, SPANISH, GERMAN, RUSSIAN} foreignLanguages;

    ```'
