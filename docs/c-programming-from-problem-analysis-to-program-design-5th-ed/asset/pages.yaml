    # PROGRAMMING EXAMPLE: The Game of Rock, Paper, and Scissors


    Children often play the game of rock, paper, and scissors. This game has two players,
    each of whom chooses one of the three objects: rock, paper, or scissors. If player
    1 chooses rock and player 2 chooses paper, player 2 wins the game because paper
    covers rock. The game is played according to the following rules:


    +   * If both players choose the same object, this is a tie.

    * If one player chooses rock and the other chooses scissors, the player choosing
    rock wins this because the rock breaks the scissors.

    * If one player chooses rock and the other chooses paper, the player choosing
    paper wins this because the paper covers the rock.

    * If one player chooses scissors and the other chooses paper, the player choosing
    scissors wins this because the scissors cut the paper.


    Write an interactive program that allows two players to play this game.


    +   * The users'' responses when asked to play the game.

    * The players'' choices.


    Input This program has two types of input:


    Output The players'' choices and the winner of each play. After the game is over,
    the total number of plays and the number of times that player won should be output
    as.


    Two players play this game. Each enters their choices via the keyboard. Each player
    enters r or R for Rock, p or P for Paper, or s or S for Scissors. While the first
    player enters a choice, the second player looks elsewhere. Once both entries are
    in, if the entries are valid, the program outputs the players'' choices and declares
    the winner of the play. The game continues until one of the players decides to
    quit'
