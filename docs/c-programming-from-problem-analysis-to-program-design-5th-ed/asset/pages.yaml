    # Input/Output of Enumeration Types


    Because input and output are defined only for built-in data types such as int,
    char, double, and so on, the enumeration type can be neither input nor output
    (directly). However, you can input and output enumeration indirectly. Example
    8-5 illustrates this concept.


    > EXAMPLE 8-5


    Suppose you have the following statements:


    ```

    enum courses {ALGEBRA, BASIC, PASCAL, CPP, PHILOSOPHY, ANALYSIS,

    CHEMISTRY, HISTORY};

    ```


    courses registered;


    The first statement defines an enumeration type, courses; the second declares
    a variable registered of type courses. You can read (that is, input) the enumeration
    type with the help of the char data type. You can distinguish between some of
    the values of the enumeration type just by reading the first character and others
    by reading the first two characters. For example, you can distinguish between
    ALGEBRA and BASIC just by reading the first character; you can distinguish between
    ALGEBRA and ANALYSIS by reading the first two characters. To read these values,
    say, the keyboard, and then use a selection structure to assign the value to the
    variable registered. Thus, you need to declare two variables of type char.'
