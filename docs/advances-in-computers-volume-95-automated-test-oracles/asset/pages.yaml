- img_proc: true
  md: 'The same source of information can be translated into different changeable
    forms, and there can be multiple ways of translating between the same pair of
    sources of information andcheckable forms. Nevertheless, the source of information
    is usually the decisive factor to determine the behavior to be checked and limits
    the translation into changeable forms. In Section 5, we give some technical details
    of representative translation techniques along with the most related sources of
    information.


    One more steps of the common test oracle process may be skipped in a specific
    technique, for example, when using the JUnit test framework, testers use JUnit
    assertions as test oracles. These human-written assertions combine both expected
    and actual behaviors, which are directly checkable and no translation is needed.
    In this, the testers translate the test documents (usually in natural languages)
    or their domain knowledge into concrete assertions. Such mental process is beyond
    the scope of our discussion, which focuses on automation translation.


    Different approaches offer various levels of automation in generating test oracles.
    Eclat [16] generates test oracles in the form of JUnit assertions, but because
    of the intrinsic incompleteness of dynamic analysis, the inferred properties may
    be inaccurate, and the generated oracles shall be checked by testers who choose
    the appropriate assertions. ReAssert [17] collects assertions dynamically and
    presents them to the testers who shall repair the broken assertions by selecting
    the alternative values of the variables. EvoSuite [18] and $\muTest$ [19] generate
    the generated oracles to be analyzed by testers to determine whether they actually
    reveal bugs in the current version. Similar to EvoSuite and $\muTest$, the technique
    proposed by Staats et al. [20] leverages mutation analysis to support test oracle
    generation. Specifically, it focuses on oracle data selection (i.e., selecting
    the variables to be checked). As for other techniques, it requires testers''s
    inspection to choose the proper variable and the expected values.


    Recent studies have investigated the effectiveness of human testers in identifying
    the correctness of generated test oracles reaching contradictory results [21,22].
    The results are not conclusive yet. The study of Staats et al. [22] indicates
    that human testers are not good at identifying correct test oracles, while the
    study of Pastore et al. [21] indicates that human testers can reliably identify
    correct test oracles and fix incorrect ones.'
