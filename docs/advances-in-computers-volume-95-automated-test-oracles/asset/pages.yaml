    # 5.6. Results of Program Analysis


    Program analysis techniques infer information either from the source code (static
    analysis) or from the program executions (dynamic analysis). The information comes
    from the program itself, and test oracle techniques use program analysis are usually
    based on some assumptions of program correctness or program faults.


    A popular kind of program analysis used to generate mutation analysis. The program
    under test is injected with mutations (i.e., small code changes) to create faulty
    program versions (called “mutants”), and the mutants are tested using the test
    cases for the original program to see whether they can be killed in the test.
    A mutant is killed if the test cases reveal a deviation of the mutant from the
    original program. Mutation analysis can be viewed as a kind of dynamic analysis
    and is commonly used to evaluate the quality of test suites in terms of their
    effectiveness in killing mutants. Recently, some researchers have exploited mutation
    analysis to create test oracles [19,20,61]. By using mutation analysis, these
    techniques do not require historical versions or correct versions and detect errors
    in the current version without requiring early versions as in regression testing.
    However, the key assumption of mutation analysis is that the mutants are good
    representatives of real program faults.'
