    to a real proof. This inspired Aaronson to post a blog on


    Eight Signs a Claimed P ≠ NP Proof is Wrong


    which can be found here: www.scottaaronson.com/blog/?p=458

    Below are eight signs, followed by some comments from me on the signs. Note that
    they are in Scott’s proof. So if I read every attempt

    ’ve seen ... it means every attempt has ever seen.


    +   1. The author can’t explain why the proof fails for 2SAT, XOR-SAT, or other
    light variants of NP-complete problems that are known to be in P. Historically,
    this probably been the single most important “sanity check” for claimed proofs
    P ≠ NP; in fact, I’m pretty sure that every attempt I’ve ever seen has been refuted
    by.


