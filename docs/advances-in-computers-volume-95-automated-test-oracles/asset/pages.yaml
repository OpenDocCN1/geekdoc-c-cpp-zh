    # 3.3.1 Temporal Specifications


    Some software systems must be in agreement with requirements that express temporal
    properties. This is common for embedded systems, as in Avionics and Telco. A requirement
    example of a Mars probe [109] is expressed as follows:


    > ... When the TimerInt reaches the Control System and the reading of acceleration
    is not completed, the status should change to Emergency within 60 milliseconds
    ...


    One can observe that a behavior (status changing) must be true within 60 ms, that
    is, necessarily at the same instant as the other triggering behaviors. The oracle
    must have the ability to check such requirements in the SUT. There are many specification
    languages from diverse paradigms which can be used to write temporal properties.
    TRIO [110,111], MITL [109], EAGLE, GIL, time Petri nets [112], and timed automata
    [109] are other instances.


    Higher expressive temporal languages express time quantitatively, qualitatively
    and provide some representation of existential (∃) and universal (∀) quantifiers.
    Quantitative operators allow the representation of intervals of time in relation
    to other events. For example, “event X must hold until event Y happens.” Qualitative
    operators work to measure distances, as “X must hold k units of time from the
    current instant.” For instance, Felder and Morzenti [113] provide such operators.


