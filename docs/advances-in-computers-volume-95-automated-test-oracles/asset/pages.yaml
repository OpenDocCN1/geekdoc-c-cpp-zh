    \ exists a program $M$ such that\n\n+   1. If $x \\in A$, $M(x)$ accepts.\n2.\
    \ If $x \notin A$, $M(x)$ rejects.\n3. For all $x$, any computation path of $M(x)$\
    \ takes time $\\le O(T(|x|))$.\n\nDefinition 5.13 Let $S$ be a monotone function\
