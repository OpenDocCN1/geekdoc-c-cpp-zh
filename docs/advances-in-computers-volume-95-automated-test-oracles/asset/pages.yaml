  md: '# 4. A QUANTITATIVE ANALYSIS AND A MAPPING OF STUDIES


    Most test engineers agree that test oracles are a recent issue in software testing.
    Two decades ago, considering the huge number of conferences and journals on SE,
    the studies that dealt directly with test oracles were limited. They were confined
    to a portion of the literature addressing automated test strategies. Nowadays,
    this context is different and there are several researchers from academia and
    industry dedicating their efforts specifically to studies on test oracles. In
    this section, using a pool of more than 300 studies on test oracles, we map the
    state of the art in several ways:


    +   - Counting the number of publications directly related to test oracles from
    1978 to 2013;


    +   - Mapping authors’ affiliations in order to measure the industry interest
    in test oracles and technology transfers from academia to industry;


    +   - Presenting a list of academic efforts to test oracles (Ph.D. and Masters);


    +   - Ranking counts of authors’ affiliations in order to discover the most active
    groups of researchers and universities;


    +   - Presenting supporting tools;


    +   - Analyzing the SUTs explored in empirical evaluation;


    +   - Establishing a coauthorship network to understand the most prolific groups
    and highlight their interests; and


    +   - Understanding the evolutions in terms quantitatively using line graphs of
    SUTs and approaches.


    # 4.1. A Literature Review on Test Oracles


    In the following section, we present the methodology we have used to acquire a
    pool of 304 test oracle studies.³ including all of these studies and important
    information such as title, authors, year and medium of publication, abstract,
    and others. After constructing the repository, we defined a series of data points
    to be collected from these studies in order to provide a bird’s-eye view of the
    issue. In this section, we explain our methods and protocols for research and
    present the numbers we derived from our analyses.


    > ³ Repository available in: http://www.labes.icmc.usp.br/~rpaes/repo/repo.html.'
