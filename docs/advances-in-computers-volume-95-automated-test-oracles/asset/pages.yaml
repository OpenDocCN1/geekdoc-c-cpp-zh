    # 4.4. Surveys and Position Studies


    In our study, we identified some works about complete or partial surveys on test
    oracles. In addition, we identify some opinion studies, also known as position
    studies, where the authors'' point of view is expressed. Therefore, in this subsection,
    we present the main points raised by these works.


    Chronologically, one can consider the study presented by Weyuker [6] (already
    mentioned in Section 3), which was the first significant opinion about test oracles.
    In the study, the authors present their considerations of the practical use of
    test oracles regarding when an oracle does not exist or the tester must spend
    extraordinary amount of time to determine whether or not the current output is
    correct. This kind of software system is called a “nontestable” program. In that
    study, the authors highlight options of test strategies to be used instead of
    test oracles and their consequences.


    In 1998, Hoffman [12] (already mentioned in Section 3) presented a study categorizing
    test oracles in classes regarding their various types of automated verification
    and validation regarding real industrial approaches. In this analysis, the authors
    identified five classes of oracles: True, Stochastic, Sampling, and Consistent
    oracles. In addition, in this classification, the authors present comparisons
    among the advantages and disadvantages for each class covered. Later, the study
    Hoffman [13] was written by the same author with a different classification in
    four types of oracle strategies (and not using any oracle) are identified and
    outlined: True, Consistency, Self-Referential, and Heuristic.


    In 2001, Baresi and Young [1] surveyed the proposed approaches related to test
    oracles that required nonresident test cases nor previous versions of the SUT.
    Here, the authors analyze test strategies and approaches dealing with Transducers,
    Embedded Assertion Languages, Extrinsic Interface Contracts, Pure Specification
    Languages, Trace Checking, and Log File Analysis. However, generally, this analysis
    is not comprehensive and it considers only part of the research on test oracles.


    In 2009, Shamiri et al. [3] presented a comparative analysis among six categories
    of test oracles: N-Version Diverse Systems and M-Model'
