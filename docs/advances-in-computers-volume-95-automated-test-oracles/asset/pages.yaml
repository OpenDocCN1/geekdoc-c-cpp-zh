    (The graph G is directed. This is important.)nThis problem may look similar to
    CONN; however, it is not. Thought experiment: $A \in NSPACE(\log n)$. Let $x \in
    \Sigma^*$. View the space that the program uses while computing on $x$ is on a
    tape of length $O(\log n)$, which we call the worktape. Since the worktape is
    length $O(\log n)$ there are only a polynomial number of possibilities for it.
    One can form a directed graph by taking the vertices to be the possible tasks,
    and put an edge from $u$ to $v$ if it is possible to go (recall that the machine
    is nondeterministic), in one step of $M$, from $u$ to $v$ This directed graph
    has a path from the start to an accept state if $M(x)$ accepts. Hence, we can
    reduce any problem in NSPACE(log n) to the problem DCONN. Formally $DCONN$ is
    NL-complete.


