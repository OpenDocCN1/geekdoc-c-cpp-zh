  md: 'How expressive is $WS1S$ (and $S1S, WS2S, S2S$)? Is having them decidable useful?
    There are two answers to this.


    +   - $WS1S$ and $WS2S$ have been coded and used [70]. Even though these theories
    are not in EL the coding is very clear and the problems they input to are not
    that large. The proof that these theories are difficult instances that are hard.
    These instances are somewhat contrived and do not come up. The application has
    been to search patterns, temporal properties or reactive systems, tree constraints.
    It has not been applied to solving open mathematical conjecture. This is unlikely
    as $WS1S$ seems unable to express anything of interest mathematically.

    - The decidability of $S1S$ and $S2S$ has been used to prove other theories decidable.
    We do not know of an implementation of it. It is possible to state interesting
    theorems in $S2S$ (See [67]). Great! So perhaps we can input to an $S2S$ decoder
    an open question in Mathematics and get the answer! There are two problems with
    (1) Coding up $S2S$ would be extremely difficult, and getting to run quickly might
    be impossible. (2) *Be careful what you wish for—you might get it*: Lets say we
    really did have such a decider and its facts. Lets say we input statements of
    The Goldbach Conjecture, the Riemann Hypothesis, and P versus NP. Lets it outputs
    YES, YES, YES. Then we would know that these are all true. Oh. We already sort
    of know. It is not the purpose of math to just establish true, but *why* its true.
    The hope is that the proof of (say) $P \neq NP$ will give great insight into computation.
    Just the one YES would.


    +   - The last item challenges we care about a theory being decidable.

    (1) Hilbert wanted to (in today''s terminology) show that mathematics is decidable
    to give it a rigorous foundation. Even though mathematics is undecidable it is
    intellectual interest to see how big a fragment of math is decidable. (2) As the
    work on $WS1S$ has shown there may be fragments of those fragments that are decidable
    in good time and can be used elsewhere (though unlikely used for mathematics itself).


