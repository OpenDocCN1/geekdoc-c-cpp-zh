    # 4.1. Static Reverse Engineering


    Static source code analysis is well suited for extracting information about the
    internal structure of the system and dependencies among elements [12] and already
    available in many software engineering tools [21]. Usually, static analysis does
    not require executing the program to analyze it, saving the effort for building,
    deploying, and setting up an appropriate environment to execute the program being
    analyzed, but it requires access to the source code of the system. Sometimes static
    analysis setting up execution environment for the analyzer to access to fully
    passable source code and linked design artifacts. With static analysis it is possible
    to address all flows of the program whereas dynamic analysis covers only the observed
    and triggered paths [83].


    Unfortunately the dynamic nature of object-oriented programs, such as object creation,
    garbage collection, and dynamic binding, make it very difficult to understand
    the behavior by just analyzing the source code [20]. Also, it is challenging to
    build a fully working static analysis environment for modern software systems
    with new programming language features, several abstractions, and programming
    languages layered and connected [83].


    There are various static approaches for reverse engineering or mining interface
    specifications [83–85], states and relationships between objects [86], correctness
    rules [87], function precedence protocols [88], or function call sequences [89].
    Some of the approaches are restricted to a certain programming languages, such
    as Java [84], or execution environments, but otherwise claim to be general purpose,
    working for any type of software.'
