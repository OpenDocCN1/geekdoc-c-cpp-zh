    for human understanding [18], and practical means to elaborate the models should
    be provided in tool support. Elaborating the initial reverse engineered models
    can provide support and a reasonable starting point for adopting MBT.


    Another challenge, especially related to state-based models, is state space explosion.
    A nontrivial problem has a large number of possible states, depending on the definition
    of the state and how to distinguish them. Over the years, optimizations to the
    original learning algorithms have yielded significant improvements in terms of
    the speed of model inference and the size of extracted models, making it possible
    to enter state space of 100,000 states or more, which is sufficient to test many
    kinds of industrial applications [121]. The challenge is to find the balance between
    increasing expressiveness to extract more accurate models and keeping the computational
    complexity on feasible level for model inference and model checking [121]. Abstracting
    too much information from the SUT increases the risk of losing opportunities to
    discover faults [121].


