  md: '# 2. BACKGROUND


    In this section, we provide background information on testing and modeling of
    GUIs, and software test automation in general. Automated GUI testing is introduced
    in Section 3.


    # 2.1. Testing and Modeling of GUIs


    # 2.1.1 Graphical User Interface


    The UI of a computer program is the part that handles the output to the display
    and the input from the person using the program. The rest of the program is called
    the application or the application semantics [5]. A GUI is a hierarchical, graphical
    front-end to a software system that accepts as user- and system-generated events
    from a fixed set of events and produces deterministic graphical output. A GUI
    contains graphical objects; each object has a fixed set of properties. At any
    time during the execution of the GUI, these have discrete values, the set of which
    constitutes the state of the GUI [25]. A GUI takes events (mouse clicks, selections,
    in text fields) as input from users and then changes the state of its widgets
    accordingly [26].


    A GUI is the most widely used method for information systems to interact with
    end users [5]. From the user''s point of view, the GUI is intended to make software
    easier by providing the user with visual controls to represent the information
    and actions available to the user [7]. In a typical GUI, the end can simply choose
    commands by activating or manipulating the graphical objects [1]. By allowing
    the end to perform multiple tasks simultaneously, GUIs can also lead to higher
    productivity [1].


    GUIs constitute a large part of the software being developed [3]. From the engineering''s
    point of view, GUI software is often large, possibly more than half of all code
    of the program [4], and complex, requiring developers to deal with elaborate graphics,
    multiple ways of giving commands, multiple asynchronous input devices and rapid
    semantic feedback [5]. Complexity is further increased when the goal is to create
    simple but flexible GUIs, providing default settings for quick and simple usage
    but allowing more skillful users to modify the settings. Most of the GUI applications
    are built by iterative process of redesigning the UI after user testing [5]. Most
    designers think that the behavior is more difficult to prototype than the'
  merge: -1
  pgno: 58
- img_proc: true
  md: 'appearance and communicating the behavior to the developers is more difficult
    than the appearance [11].


    Most modern GUI software is developed using event-handler architecture allowing
    developers to build complex systems using loosely coupled code and the end user
    perform tasks by inputting GUI events in various ways and execution order [27].
    The end user interacts with the objects by performing actions that manipulate
    the GUI widgets, generating events to the state of the software [7]. The execution
    outcome of an event handler depends on its input, the state of other objects (event
    handlers), and the external environment. Its execution may lead to a change in
    its own state or that of entities. Moreover, the outcome of an event may vary
    based on the sequence of preceding events or interactions seen so far [27].


    Interaction with computers has evolved from the command line interfaces (CLI)
    to the direct manipulation or WIMP (Windows, Icon, Mouse, and Pointer) interfaces
    and is currently evolving to post-WIMP interfaces [28] containing at least one
    interaction technique not dependent on classical 2D widgets, such as menus and
    icons [29]. In spite of the innovative development of interaction technology,
    the most usual type of UI is extremely similar to the WIMP (Windows, Icon, Mouse,
    and Pointer) interface, the pointer being one finger on a touch screen instead
    of a mouse or other pointing device. The most common difference between post-WIMP
    and WIMP interfaces is probably the replacement of zoom/out functionality of the
    mouse wheel with two fingers swipe on touchscreen mobile devices.


    # 2.1.2 GUI Testing


    By the definition of the IEEE Software Engineering Body of Knowledge [30], testing
    is an activity performed for evaluating product quality, and for improving it,
    by identifying defects and problems. The purpose of software testing is to reveal
    software faults in order to correct errors during the implementation of the application
    under test (AUT) and to ensure the quality of the AUT [31]. An error is a mistake
    made by a programmer during the implementation of a software system [31]. A fault
    is a collection of program source code statements that cause a failure. A failure
    of an application is an external, incorrect behavior of a program [31]. A program''s
    execution is correct when its behavior matches the functional and nonfunctional
    requirements in its specifications [32].'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'GUI testing means an application with a GUI is tested solely by performing
    sequences of events or interactions on GUI widgets and the correctness of its
    behavior is determined by examining only the state of the GUI widgets [33]. A
    typical GUI gives many degrees of freedom to an end user, leading to an enormous
    event interaction space that needs to be tested [34]. Large number of permutations
    of events and complex interactions of GUIs present a challenge for quality assurance
    and testing [34].


    The GUI is one of the components in software projects that is usually subjected
    to less systematic testing. Its event-driven behavior and visual essence deem
    unsuitable traditional methods and tools commonly used for testing other kind
    of components [35]. Yet, GUI testing is crucial, as the correctness of GUI’s code
    is essential to the correct execution of the overall software [7]. Many times
    the functionality of the application can be invoked through the GUI and therefore
    GUI tests cover the entire application [15]. A large proportion of faults detected
    by GUI testing are in the underlying business logic of the application, rather
    than in the GUI code [36].


    Testing of interactive systems is a difficult task. It requires that we test the
    system’s functionality, the interactive behavior of the system and the UI to ensure
    it is usable and aesthetically acceptable for users [37]. As UIs become more complex
    and software applications become ubiquitous, often relying on new, and sometimes
    novel, modes of interaction, this difficulty increases [37]. A GUI’s response
    to an event may vary depending on the current state (context) of the software,
    established by preceding events and their execution order. Therefore, it is not
    sufficient to test each event in isolation or in one state. Instead, an event
    to be executed together with other events [34]. GUI testing is also extremely
    expensive. For example, 10,000 unit test cases can be automatically tested within
    a minute, whereas 10,000 simple GUI test cases may need more than 10 h to complete
    [1].


    # 2.1.3 GUI Modeling


    Modeling is an activity to present a system in a different, usually at higher
    level of abstraction, capturing the relevant parts of system’s structure and behavior.
    GUI modeling aims to present GUIs and the relevant parts of GUI’s behavior and
    structure at a higher level of abstraction. GUI models are used for various purposes,
    such as communicating the designed structure and behavior to the developers of
    the GUI software, understanding the program,'
  merge: -1
  pgno: 60
- img_proc: true
  md: 'generating GUI code based on the models, reengineering, maintenance, testing,
    etc.


    Various types of models have been used to describe GUI applications, depending
    on the intent used or the preferences of the person creating the models. UI models
    can describe the domain over which the UI acts, the tasks that the UI supports,
    and others aspects of the graphical view presented to the user [38]. The of interface
    models give an abstract description of the UI, potentially allowing to:


    +   - Express the UI at different levels of abstraction, thus enabling choice
    of the most appropriate abstraction level.

    - Perform incremental refinement of the models, thus increasing the guarantee
    of the final product.

    - Reuse UI specifications between projects, thus decreasing the cost of development.


    +   - Reason about the properties of the models, thus allowing validation of the
    UI within its design, implementation, and maintenance processes. In order to build
    any kind of model of a system, the boundaries of such system must be identified
    [38]. Therefore, the following kinds of models may be considered of interest for
    UI modeling:


    +   - Domain models are useful for defining the domain of discourse of a given
    interactive system. Domain models are able to describe object relationships in
    a specific domain but do not express the semantic functions associated with the
    domain''s objects.


    +   - User models, in their simplest form, can represent the different characteristics
    of users and the roles they are playing. In their more ambiguous form, user models
    attempt to mimic user cognitive capabilities to predict how the interaction between
    the user and the device will progress.


    +   - Task models express the tasks that a user performs in order to achieve goals.
    Task models describe the activities users should complete to accomplish their
    objectives. The goal of a task model is not to express how the UI behaves, rather
    how a user will use it.


    +   - Dialog models describe the behavior of the UI. Dialog model focus on the
    device, defining which actions are made available to users via the UI, and how
    it responds to them. These models capture all possible dialogues between users
    and the UI.


    +   - Presentation models (PMs) define the visual appearance of the application.
    They describe the graphical objects in the UI and the materialization of widgets
    in the various dialog states.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '+   Navigation models define how the objects can be navigated through the UI
    from a user''s perspective.


    +   Platform models define the physical devices that are intended to host the
    application and how they interact with each other.


    # 2.2. Software Test Automation


    The software industry is facing the challenge of developing complex software products
    for a great variety of execution platforms and devices, and at the same time having
    the pressure to increase the quality while decreasing time and costs of development
    [39]. In order to evaluate and improve the quality of a product, testing activities
    are performed to identify defects and problems. Software testing consists of the
    dynamic verification of the behavior of a program by executing a finite set of
    suitably selected tests and comparing the observed behavior against the expected
    behavior [30].


    The manual design and execution of the tests is time consuming and does not ensure
    systematic coverage of the SUT. With iterative development process, the manual
    execution of the tests is even more time consuming and very boring [17]. To reduce
    the amount of work required to properly test the products, the software industry
    is increasing the use of test automation.


    Usually, the first step toward automated test process is a CR testing process,
    which basically means recording the manual execution of the tests once and replaying
    the recorded tests for every release of the SUT. Unfortunately, the requirements
    of a software system and therefore also the test requirements change during the
    development, and at least the test cases have to be recorded again.


    The second step would be a script-based testing process, using test scripts to
    automate execution of tests. Test scripts can be written in some programming language,
    scripting language, or a special testing language as TTCN-3 [17]. A script-based
    testing process reduces the amount of execution of tests but increases the amount
    of maintenance work when some requirements change.


    A keyword-driven automated test process uses a higher level of abstraction to
    reduce the maintenance costs of test scripts. Using abstract keywords and data
    values, which are then translated into executable test, it is easier to adapt
    to the changes in the requirements. Even though all of the previously mentioned
    approaches reduce manual testing, the test data and test oracles still have to
    be designed manually.'
  merge: -1
  pgno: 62
- img_proc: true
  md: '60 Pekka Aho et al.


    MBT aims to automate the design of the test cases and expected results [17].


    # 2.2.1 Model-Based Testing


    MBT is a technique of generating test cases from behavioral models of the SUT
    [17]. The idea is to provide more cost-effective means for extensive testing of
    complex systems by decreasing the development cost and improving the test quality
    [39]. Instead of manually writing a large set of test cases, the SUT is represented
    by a smaller set of models describing its expected behavior and how it should
    be tested at a higher abstraction level, and a test generator tool and a set of
    chosen algorithms are used to automatically generate test cases from these models
    [18]. There are several benefits, including easing test maintenance due to fewer
    affairs to update, higher coverage over the test cases, avoiding manual error
    activities [39], and documenting the SUT in higher level models which helps in
    sharing the information and understanding the SUT.


