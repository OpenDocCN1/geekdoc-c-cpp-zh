  md: 'Along the same lines, partial oracles aim to identify test results are incorrect,
    even without knowledge of the correct output [6]. In other words, a partial oracle
    should support the tester''s decision about the correctness of a test execution
    without expected outputs. Testers might resort to partial oracles when it is impossible
    or too difficult to define the expected result. That is, they must account for
    what is certainly wrong and analyze whether the SUT''s output is plausible. For
    instance, one can affirm that a result of a sin function cannot be outside the
    “-1” and “1” boundary. If it is outside such range, the result is clearly wrong.
    Examples of partial oracles are found in many ways [21,83,84]. Pre- and postconditions
    often define contracts which must be respected in the code. Although it is true
    that if SUT passes a test and no error is found, it may still be incorrect because
    the partial oracle only indicates that the program produces within a plausible
    result, but it does not mean the result is correct.


    Partial oracles may seem impractical or inefficient in the present day, as they
    were presented in 1981 and it is natural to think that nowadays larger and more
    complex programs make it impractical to implement parallel and costly versions
    of the SUT. However, a literature review shows that pseudoracles can still be
    viable and used in [85]. For instance, 24 years after Davis and Weyker''s [4]
    proposal, Hummel and Atkinson [86] exploit technologies to find components for
    reuse as a means of discovering pseudoracles on the Internet. In this case, the
    components found have the same function of an SUT and can be used to support statistical
    testing of a self-built component implementation. This idea is explored further
    in the present day by research, with the use of Web services.


    # 3.1.2 Passive and Active Oracles


    Along the same lines of the classification presented before, the literature presents
    a generic classification among test oracles: passive and active oracles. It is
    said that active oracles directly drive their testing activities producing the
    SUT behavior and generating expected outputs [87–90]. Contrary to this premise,
    passive oracles act as simple comparators between current and expected test results.
    According to Pasala et al. [91], an active oracle mimics the behavior of the SUT
    and a passive oracle verifies the SUT behavior, but it does not reproduce it.


