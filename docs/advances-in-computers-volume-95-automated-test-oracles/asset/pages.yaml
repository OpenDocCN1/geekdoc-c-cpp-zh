  md: "Definition 5.22 A language $A$ is regular (henceforth REG) if it satisfies\
    \ any of the equivalent conditions below.\n\n+   1. $A \\in \\text{DSPACE}(1)$.\n\
    2. $A \\in \\text{NSPACE}(1)$.\n3. $A \\in \\text{DSPACE}(1)$ by a program that,\
    \ on every computation path, only scans the input once. (This is equivalent to\
    \ being recognized by a deterministic finite automata, abbreviated DFA).\n4. $A$\
    \ is in $\text{NSPACE}(1)$ by a program that, on every computation path, only\
    \ scans the input once. (This is equivalent to being recognized by a nondeterministic\
    \ finite automata, abbreviated NDFA. When you convert an NDFA to a DFA you may\
    \ get an exponential blowup in the number of states).\n5. $A$ is generated by\
    \ a regular expression (we define this later).\n\nThe equivalence of $\text{DSPACE}(1)$\
    \ and $\text{NSPACE}(1)$ is easy. The equivalence of deterministic and nondeterministic\
    \ is by Rabin and Scott [5]. It is in all textbooks on formal language theory.\
    \ The equivalence of $\text{DSPACE}(1)$ and $\text{DSPACE}(1)$-scan is folklore\
    \ as in the Rabin-Scott paper.\n\nWe define regular expressions $\\alpha$ and\
    \ the language they generate $L(\\alpha)$.\n\nDefinition 5.23 $\\Sigma$ be a finite\
    \ alphabet.\nL(\\emptyset) = \\emptyset$.\n\n+   1. $e$ (the empty set) is a regular\
    \ expression. $L(e) = \\{e\\}$.\n2. For all $\\sigma \\in \\Sigma$, $\\sigma$\
    \ is a regular expression. $L(\\sigma) = \\{\\sigmasigma\\}$.\n3. If $\\alpha\
    \ \\cup \\beta$ is a regular expression. $L(\\alpha \\cup \\beta) = L(\\alpha)\
    \ \\cup L(\\beta)$.\n4. $\\alpha\\beta$ is a regular expression. $L(\\alpha\\\
    beta) = L(\\alpha)L(\\beta)$. (Recall that if $A$ is a set and $B$ is a set then\
    \ $AB = \\{xy \\|\\ x \\in A \\text{ and } y \\in B\\).\n5. $\\alpha^*$ is a regular\
    \ expression. $L(\\alpha^*) = L(\\alpha)^*$. (Recall that if $A$ is a set then\
    \ $A^* = A^0 \\cup A \\cup AA \\cup AAA \\dots$).\n\nWe give examples or regular\
    \ sets after the next bit of notation.\n\nDefinition 5.24 $\\Sigma$ be a finite\
    \ set. Let $w \\in \\Sigma^*$. Let $\\sigma \\in \\Sigma$. Then $\\#_{\\sigma}(w)$\
    \ is the number of $\\sigma$ in $w$.\n\nDefinition 5.25 $x, y, z \\in \\mathbb{N}$.\
    \ Let $x \\equiv y \\pmod{z}$ means that $z$ divides $x - y$.\n\nExample 5.26\
    \ The following sets are regular.\n\n```\n{w \\{a, b\\}^* \\| \\#_{a}(w) = \\\
    #_{b}(w) + 10 \\quad (mod 21)\\}\n```"
