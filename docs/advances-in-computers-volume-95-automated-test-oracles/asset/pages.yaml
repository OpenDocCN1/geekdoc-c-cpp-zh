  md: '# 5.2. Complexity of SUT’s Outputs


    Another delicate issue to be faced by researchers and practitioners on test oracles
    is the complex format of the SUT’s outputs. Complex formats are those for which
    the decision on their correctness requires sensory and perceptual aspects of a
    human being, such as vision and human feeling. For example, systems with sophisticated
    GUIs, some Web applications, and virtual reality environments have typical instances
    of these complex outputs. Moreover, our analysis has revealed few practical studies
    directed to these systems (Fig 3.18) and Table 3.4).


    Systems with complex outputs are becoming common nowadays. The competitiveness
    makes the software industry ever more attractive and exquisite outputs. Then,
    naturally, the complexity of outputs is inherent in this generation of contemporary
    software. In addition, the contemporary software has a vast array of technologies
    including the hardware platforms, operating systems, and programming languages
    to support complex scenarios.


    Testing technologies can be updated in the same proportion as new generation of
    systems bringing benefits to users. In particular, test oracles are supposed to
    support a productive evaluation of complex outputs. To illustrate this situation,
    when an SUT has a value or string as an output, the oracle rule is alleviated.
    Then, testers are able to define automated approaches in a friendly way. On the
    other hand, when the system output is given in a complex format, the oracle problem
    involves an extra problem—defining adequate methods for productive automation.


    Following, we present several output formats that could make the oracle problem
    work:


    +   Web applications: they should work visually in several browsers. For users
    it is common to see, text fields, checkboxes, and comboboxes not working properly
    under different browsers. Visual undetected errors could be denying the failure
    to a company;


    +   Virtual Reality (VR) or Augmented Reality (AR) systems: these systems could
    carry visual errors, regarding positioning and dimensioning of virtual objects
    in the three-dimensional environments. Automated testing strategies for these
    applications are highly manual and ad hoc;


    +   Text-to-Speech (TTS) systems: a system whose outputs are provided by means
    of an audio signal (such as representing speech) are commonly evaluated by human
    audition and scoring. Then, the automation of test oracles for this context can
    be considered an abstract and hard task. Despite the complexity related to the
    test, TTS systems have several'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'applications, as support for computer–human interaction for blind people, automatic
    reading of e-mails in embedded and mobile applications, reading of social network
    updates, and call center automation;


    +   GUIs: software systems whose output is promoted by means of a GUI (including
    mobile applications) must work properly independently of platform, screen resolutions,
    screen orientation, touch sensitivities, color settings, monitor settings, and
    Look and Feels (L&Fs). In addition, event-driven systems are a well-known problem
    when the issue is quality assurance. In this view, the complexity associated with
    SUT is transferred for automated test strategies. For instance, generally, rippers
    and record/playback toolbars are necessary.


    +   Images or graphical outputs: systems whose outputs are given by a processed
    image, such as CAD (computer-aided diagnosis) systems are naturally hard to be
    tested automatically. This kind of system, generally, is designed to support decisions
    in diagnosis. Visual analysis is necessary for CAD system testing;


    +   Videos: systems whose outputs are in video formats require synchronization
    between sounds and frames of image. Quality aspects have to be verified independently
    of platforms. Additionally, these systems may need to be associated with subtitles
    for videos and delays can occur. As a result, these complex characteristics limit
    the alternatives for test automation and, consequently, test oracles. Implementing
    automated test oracles for SUT with complex outputs requires the application of
    specific techniques. These techniques might be directed at evaluating specific
    characteristics of the SUT’s outputs. Further, these characteristics should represent
    the main essence of the output as well, working as information sources for testing
    activities. For example, regarding complex GUIs or images, these characteristics
    may be represented by color, contrast, forms, textures, or components’ positioning.
    On the other hand, considering TTS systems, these characteristics may be represented
    by naturalness, volume, energy, duration, pauses, etc.


    In this context, an expressive contribution can be held by means of the composition
    and update of repositories including open source tools, frameworks, and APIs on
    the test oracle. Regarding our pool of more than 300 studies, few researchers
    provided their resources and technologies to access the Internet. Further, when
    the researchers provided their products for public access, generally, there were
    not enough support materials for other researchers using/extending these tools
    and frameworks. However, we believe tool repositories would help to advance the
    state-of-the-art faster.'
  merge: -1
  pgno: 182
- img_proc: true
  md: 'Since open source tools could be improved and extended, this would help avoiding
    groups starting new research from scratch.


    # 5.3. Generalization of Test Oracle Strategies and Properties


    It is necessary to make a generalization of test oracle research. This necessity
    was introduced by Harman et al. [11]. We believe this generalization should be
    held under two fundamental aspects: (1) theoretical, by means of oracle properties
    and (2) practical, by means of generic oracle strategies. Below, we present aspects
    associated with these two generalization perspectives:


    +   Theoretical generalizations: future studies on test oracles may consider the
    standardization of theoretical definitions and properties. Section 3 presented
    plenty of definitions and categories of test oracles. Future research may be focused
    on establishing more general theoretical definitions and properties on test oracles.
    We see several benefits associated with this standardization:


    +   More definitions and taxonomies for test oracles: generally, each test oracle
    researcher presents particular definitions closer to their own interests. This
    makes the research on test oracles a fragmented issue, instead of continuous;


    +   Possible of Systematic Literature Reviews (SLRs): SLRs are a means of aggregating
    knowledge about an SE topic or research question. In other words, SLR is a means
    of identifying, evaluating, and interpreting all available research relevant to
    a particular research question or topic area. It is useful for researchers and
    practitioners to find out techniques and strategies in their particular interest
    area. In SE, generally, the study selection for SLRs is performed by means of
    a research string with a set of key words in an indexed basis of scientific articles
    [113]. Then, for specific domains and contexts, theoretical generalizations of
    test oracles may facilitate the access of the state of art; and;


    +   Maturity: well-explored areas of software testing have standards and patterns
    for their basic properties and definitions, as mutation testing, model testing,
    and regression testing. Standardized definitions of properties are propitious
    to research collaboration and group integrations.


    +   Practical generalizations: as we presented in Section 2, test oracles are
    particular processes useful in a specific testing scenario. Due to these processes,
    new research on test oracles may include strategies that offer'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'support to more than one field output test. We present two consequences associated
    with the generalization of test oracle strategies:


    +   - Flexibility: due to the variety of domains, researchers should consider
    the development of more adaptable tools and flexible frameworks. A possible way
    to realize the tools and frameworks is the implementation of plug-in-oriented
    resources and technologies. In this context, a plug-in represents a software component
    that adds a specific testing feature to an existing tool/framework;

    - Integration of tools and frameworks: considering the large number of tools and
    frameworks presented in Table 3.9, research to generalize approaches to oracles
    would be favorable for the possibility of integration in frameworks and tools.


    Using our survey as background, in the following section, we present particular
    towards future research on test oracles.


    # 5.4. Trends on Test Oracle


    The investigation of trends presented in this section is based on the quantitative
    analysis obtained through the evaluation of the evolution of oracle approaches
    (Fig. 3.15) and the type of SUT exploited in experiments (Fig. 3.18). Below, we
    present some trends in a high-level description regardless of technical aspects
    associated with each trend.


    The first trend to be considered by researchers on test oracles is the construction
    of multidisciplinary approaches. Current SE projects associate different forms
    and concepts from distinct areas of computing. For instance, the association of
    ANN and software testing can result in significant evolutions, violating human
    oracle and automating test oracles. These evolutions are results of a well-connected
    multidisciplinary project associating concepts of AI and SE. Regarding test oracles,
    one can mention future research associating concepts of Processing Image (PI)
    for checking results of SUTs that include GUIs, Web application, and images in
    their outputs. In the same context, techniques of Signal Processing can be included
    in testing strategies of systems of voice synthesis or TTS systems.


    A visible trend on test oracles is the improvement and development of new strategies
    associated to metamorphic testing. Besides a connected group of researchers (Fig.
    3.25A), our analysis demonstrated a considerable evolution of research on metamorphic
    testing over the last 5 years (Fig. 3.15). Research efforts in metamorphic testing
    has branched out into two main directions:


    +   (1) applying metamorphic testing to programs in different domains as a'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'solution to overcome the oracle problem and (2) improving/extending the metamorphic
    testing technique itself, such as automatic detection of MRs and utilizing MRs
    in fault localization. In this sense, through proper associations with traditional
    concepts of the test, metamorphic testing must fit itself as a consolidated solution
    to alleviate the oracle problem.


    Another trend is the integration of the test oracle in rippers and testing tools
    developed for ubiquitous and pervasive systems. Ubiquitous and pervasive systems
    compose an expressive avenue in computing that involves the development of applications
    to be everywhere and anywhere. In practical terms, to support these advances,
    one can consider the different embedded systems and mobile devices available nowadays.
    Appropriate automated test environments (including a test oracle) for ubiquitous
    and pervasive systems have to ensure testers that the application is to run properly
    under different conditions, such as operational system versions, screen resolutions,
    orientations, and hardware configurations. Technically, this trend might consider
    the development of integrated environments with SUT and testing technologies.
    These environments allow several dynamic changes and adaptations in both SUT and
    testing technologies.


    Finally, using the analysis presented in Section 4, our study has revealed a trend
    of test oracle research towards the exploration of secondary studies, such as
    surveys and judicious literature reviews. Secondary studies are useful to support
    decisions by researchers and practitioners after the correct technologies to be
    applied in their projects. Over more than 30 years of research on test oracles,
    before defining their testing strategies, professionals may use secondary studies
    to support their decision about which test oracle they might use. According to
    Fig. 3.15, this can already be visualized as a result of the last 3 years of research.


    # 6. FINAL AND CONCLUDING REMARKS


    Test oracles perform an elementary function on testing activities—to ascertain
    whether a test execution is correct or not. In automated testing scenarios, test
    oracles may be implemented to ensure the productivity to check the correctness
    of SUT’s outputs. Otherwise, the process of verifying test outputs should be conducted
    by testers, requiring several human efforts. Once a test designer has a well-implemented
    test oracle, it is possible to design huge test sequences including more test
    cases in a systematic approach. Hence, these increase the reliability of the SUT
    is close to its'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'specifications. However, it is not always a simple task to estimate and evaluate
    test outputs. In some cases, due to the complexity of the SUT requirements or
    output, even a human oracle spends a lot of time defining whether test results
    are acceptable. Given the relevance of this issue, several groups are trying to
    develop practical approaches for incorporating oracle mechanisms in their testing
    processes. Due to this, over more than 30 years of research on test oracles, one
    can identify clear shifts in the research literature. We have surveyed more than
    300 studies on test oracles to measure and report these shifts and predict some
    trends for future evaluation.



    In this chapter, besides some trends and discussions, we have presented a quantitative
    analysis of a huge pool of studies on test oracles. We have categorized the approaches
    reported and their experiments. In addition, we present an amount of data sufficient
    to measure the state of the art on test oracles. To support our study, we have
    graphically presented approach evolution, SUT classification, identification of
    research groups, coauthorship of networks, collaboration maps, a broad taxonomy
    commonly found in the literature, a critical view about issues to be regarded
    by contemporary oracle approaches, and other analyses. Further, we shared particular
    thoughts about trends to be faced by researchers and practitioners test oracles
    in the next years regarding contemporary software systems. In this sense, under
    a general and high-level description, our goal was to offer the knowledge gathered
    by the authors through the years of research on that field and point to what may
    be the next challenge: defining solutions which will shape the coming-of-the-art
    practice.


    \Our final analysis, giving us an upset of all this, states that test oracles
    are obtaining more and more space in industry projects. Daily, researchers have
    been dedicating their efforts to set a space for test oracles among standardized
    testing concepts. Future software testing activities will need a verdict about
    the output of the SUT—requiring a test oracle mechanism. This provision is clear
    and primary and then test oracles are welcome in contemporary test projects. Due
    to this, we strongly encourage everyone who is starting studies on test oracles
    to read this chapter. Then, we believe that quantitative analysis and taxonomy
    specifications are a good reference to be extended for students and practitioners.
    In addition, through the reading of this chapter, researchers and practitioners
    can notice that there is a wide field of research yet to be explored. As for the
    integration of already known and wellestablished approaches aiming at the industry
    acceptance, this fact enriches the monograph presented by means of this chapter.'
