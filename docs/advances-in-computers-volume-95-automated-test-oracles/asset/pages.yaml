    # ABOUT THE AUTHORS


    Rafael A. Oliveira is a Ph.D. candidate at University of São Paulo (USP/ICMC).
    He has received a M.S. in 2012 from the University of São Paulo. He is a visiting
    scholar at the University of Maryland (UMD, College Park, MD, USA), where much
    of this book was conducted. His research focuses on elevating human testing efforts,
    automated and systematic testing strategies, automated test oracles, and GUI and
    TTS testing. In addition, his main interests are software testing, quality, and
    reliability. His main publications can be found in his personal site (http://www.labes.icmc.usp.br/~rpaes/)
    and on Lattes Platform (http://lattes.cnpq.br/09735394111748).'
