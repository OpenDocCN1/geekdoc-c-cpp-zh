    # 3.3.1 Specification-Based Oracles[1]


    Baresi and Young [1] present a specific survey highlighting the main characteristics
    of automated test oracle that require neither precomputed input/output pairs nor
    a previous version of the SUT. Consequently, regardless of precomputed outputs,
    software applications are the most important source of information to drive test
    inputs and test outputs. This category of test oracle can be named specification.
    Due to the popularity of this test oracle approach, this section brings several
    examples of differences forms to implement test oracles using SUT’s specifications.


    Technically, a specification can be defined as a definitive formulation, in document
    form, which provides a definitive description of a system for the purpose of developing
    or validating the system [17]. When this formulation is used for validation, it
    is regarded as the oracle information. The language used to describe such a formulation
    is called a specification language, which is capable of being interpreted by a
    compiler or interpreter and allows the creation of an automated oracle procedure.


    The interest in using specification languages as oracle information is also supported
    by a variety of studies found in the literature (Section 4). Specification-based
    oracles can be classified according to the paradigm, automation features, levels
    of abstraction, and other characteristics. Here, we present specification-based
    oracles regarding three general aspects: (1) their location in relation to the
    SUT, (2) their paradigm, and (3) their temporal representation.


    # 3.3.1 Specification Location


    Baresi and Young [1] present groups of oracles according to certain similarities,
    among them: oracles of pure specification language, embedded assertion languages,
    and extrinsic interface contracts. These three oracle contracts differ from each
    other in the way they are written with respect to the code.


