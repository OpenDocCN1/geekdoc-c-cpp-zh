    the external environment, events generated by the device hardware platform, events
    typical of mobile phones, and events from other connected applications. The proposed
    testing techniques involve the manual definition of reusable event patterns. Event
    patterns may be used to manually generate test cases, to mutate test cases, and
    to support the systematic exploration of the behavior of an application using
    the GUI Ripping technique.


    # 5.2. Miao and Yang: Dynamic Reverse Engineering of GUI Test Automation Models


    Miao and Yang from Victoria University (Melbourne, Australia) have proposed to
    address the limitations of event-based GUI models with the FSM-based GUI Test
    Automation Model (GuiTam) and a reverse engineering approach to automatically
    construct the models and use them for GUI testing [223]. Run-time GUI information
    is programmatically readable, which provides an opportunity to automatically generate
    a GuiTam for an application by traversing its GUI states [1].'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'In GuiTam [223], a state of a GUI is modeled as a state of opened windows,
    GUI objects (widgets) of each window, properties of each object, and values of
    the properties. Events or interaction performed on the GUI may lead to state transitions,
    and a transition in GuiTam captures the starting state, the event or interaction
    performed, and the resulting state.


    To address the state space explosion problem and reduce the total number of states
    and transitions, only selected object property values are considered for distinguishing
    different states, and only events that lead to the state transition will be captured
    by GuiTam [224]. The selection in the proposed GuiTam is at a similar level to
    the event flow graph (EFG) [58] model, which is also practical in storage and
    computational complexity [223]. The algorithms and tools used for reading the
    widgets (objects), performing events or interactions, checking and comparing the
    GUI states, and generating GuiTam based on the behavior of the GUI are shortly
    described [223].


    Test cases can be automatically generated by traversing the states of the GuiTam
    [223]. The oracle information will be captured by performing the same test cases
    on an earlier version of the GUI application. After the oracle is captured, the
    test cases can be executed on the modified version of the AUT. By comparing the
    observed state behavior with the corresponding oracle information, differences
    and possible defects can be discovered [223]. Test cases can be generated by randomly
    selecting a given number of paths from the GuiTam, or by traversing the states
    and transitions of GuiTam according to given criteria, e.g., an algorithm can
    select the paths from the GUITAM until all states are covered to meet the state
    coverage criterion [1]. The paths can be as long as possible that the minimum
    number of test cases can be generated which satisfy the criterion [1].


    Yang et al. [224] proposed parameterized GUI state model (PGUISM) which is basically
    a parameterized version of GuiTam, using the parameters to describe the context
    of the states. PGUISM is implemented in C# and uses UI Automation library [13]
    in Visual Studio.2008 to read widgets information from application [224]. The
    approach is also used for model-driven GUI automation to automate the data exchange
    through GUI between two medical GUI applications [224].


    Yang wrote his PhD thesis [1] on GuiTam, extending the approach with an envelope
    model to encapsulate all possible branches of states and events related to a task
    or use case. To efficiently test tasks or use cases, long test cases are inevitably
    needed. By using a use case captured in the envelope'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'model, task-oriented test cases can be generated automatically for effective
    and efficient testing within a practical time frame [1].


    Yang [1] proposed also a GUI defect classification, dividing GUI defects into
    three groups: directly detectable defects, undetectable defects, andably detectable
    defects. Directly detectable defects can be detected with access to any specifications
    or information observed from an earlier version of the system, e.g., crashes that
    usually allow the AUT to respond to inputs, and recognizable error messages usually
    in the form of system error dialogs or customized message dialogs during the execution.
    Undetectable defects do not reflect with GUI test automation. Comparably detectable
    defects can be detected by comparing the actual state affected by the defects
    with the expected state. When a test is executed, the actual states will be compared
    with the expected results and the differences will be reported. The defect classifications
    can be used for directing test case generation [1].


    # 5.2.6 Aho et al.: Dynamic Reverse Engineering of State-Based GUI Models for
    Testing


    Aho et al. from VTT Technical Research Centre of Finland (Oulu, Finland) have
    presented an approach and GUI Driver for dynamically reverse engineering models
    of Java-based GUI applications for MBT purposes [118].


    Aho et al. [118] use a state-based GUI model to capture the behavior of the GUI
    application into state machine, and hierarchical tree models to capture the structure
    and context of the GUI in each state. The structural models, as well as screenshots
    of the GUI, are automatically mapped to the corresponding states in the behavioral
    GUI state model. Events or GUI actions are modeled as transitions between the
    states, and part of the context information is captured into transitions of the
    behavioral GUI state model.


    To avoid the state explosion, Aho et al. [118] disregard data values, such as
    texts in text fields or selected values of lists or drop-down boxes, when distinguishing
    new states from the visited states. Instead, the data values of the GUI are captured
    into properties of GUI actions or events. Therefore, the generated GUI state models
    may have usually an infinite number of transitions, but a reasonable number of
    GUI states. During the automated model extraction, the GUI is dynamically traversed
    or crawled through interacting with all the detected widgets of the GUI [118].
    As the number of possible event or interaction sequences is enormous,'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'GUI Driver attempts to drive the software into as many different states as
    possible, aiming for state coverage, instead of transition coverage [118].


    Testing of the application begins already during the modeling, as crashes, unexpected
    exceptions and some usability issues are detected and reported [118]. Third party
    MBT tools are used for generating tests from the models. GUI Driver uses model
    transformation to save the GUI state model in GraphML, to allow the use of external
    graph traversal algorithms for generating test sequences with given coverage criteria
    [118]. The generated test sequences can be executed with GUI Driver and test oracles
    are based on an earlier, presumably correct version of the GUI application, allowing
    the regression testing [118].


    The fully automated reverse engineering approach [118] was extended to semiautomated
    iterative process [24] of automated reverse engineering and manually providing
    valid input, such as username and password, when the reverse engineering algorithm
    does not find any new states from the GUI application. The user provides inputs
    into the GUI that is being modeled and then allows the GUI Driver to continue
    automated reverse engineering [24].


    Ao et al. [16] have highlighted the importance of diverse GUI automation and interacting
    with all enabled widgets of the GUI during the dynamic reverse engineering in
    order to produce more comprehensive models of the dynamic behavior of GUI applications.
    Therefore, they proposed a widget classification to support GUI automation strategies
    for effective model extraction [16] and presented some easy-to-implement strategies
    to demonstrate the feasibility of the classification. The goal of the GUI automation
    strategies is to reach as many states as possible with few events or interactions
    as possible [16], in similar way as in test prioritization.


    Together with Suarez from F-Secure Ltd (Helsinki, Finland) they developed Murphy,
    a dynamic GUI reverse engineering and testing tool as internal tool at F-Secure
    [225]. The idea of Murphy tool is similar to GUI Driver: traversing and crawling
    through all the possible states of the GUI application and automatically constructing
    a state-based GUI model of the behavior observed during the execution. Most of
    the model approaches has limitations and restrictions on the GUI applications
    that can be modeled, but Murphy is more platform independent, supporting most
    GUI platforms regardless of the implementation language [225]. Murphy also provides
    a variety of tools to use the extracted GUI models for automated testing and supporting
    manual testing activities,'
  merge: -1
  pgno: 96
- img_proc: true
  md: 'supports virtualized test execution environment, and integrates to other tools
    in automated test environment, e.g., Jenkins [226] open-source continuous integration
    tool.


    Murphy tool [225] uses state-based directed graph for capturing the behavior of
    the GUI application and events or interactions as transitions between states.
    During the UI crawling, screenshots of the GUI are automatically captured after
    each interaction and used for visualization of the resulting graph models [225].
    In addition to using the traditional means of dynamically observing the GUI, such
    as UI Automation library [13], Murphy provides its own window wrapping libraries.
    One of the libraries innovatively uses image recognition and comparison to provide
    platform-independent ways to detect widgets for interaction and changes in the
    GUI for observing the state changes and potential defects [225].


    As the extracted models are based on the observed implementation, visual inspection,
    and manual approval of the models is required to make sure that the modeled application
    behaves as expected [227]. Using screenshots of the modeled GUI application to
    visualize each state of the model helps in reading the models and understanding
    the behavior of the modeled application [227]. In addition to detecting crashes
    and unhandled exceptions during model extraction and testing, test oracles are
    based on approved behavior of an earlier version of the GUI application [225].
    The extracted models of a new version are compared with the models of the previous
    version using model comparison functionality, and Murphy reports, showing screenshots
    of both versions and highlighting the changes in the images. Then the user has
    to decide which changes were desired features and which are deviations from the
    expected behavior [227].


    One of the main contributions of Aho and Suarez [225,227] was presenting experiences
    from using the Murphy tool to automatically extract models from commercial GUI
    software products and the models to automate and support GUI testing activities
    in highly automated industrial development and testing environment.


