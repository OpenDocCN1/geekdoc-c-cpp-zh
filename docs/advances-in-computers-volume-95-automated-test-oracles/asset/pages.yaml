  md: '# Classifying Problems into Complexity Classes


    In contrast to PH, these containments are known to be proper.


    The following are examples of problems that are in these classes. Throughout the
    examples poly means polynomial with integer coefficients. The quantifiers are
    over the natural numbers.


    **Example 5.108** This will just be a rewriting of the H10 problem. QP stands
    for Quantified Poly. $\phi(\tilde{x})$ will be a poly.


    ```

    $Q_1=[\phi(\tilde{x}) \mid (\exists b)(\phi(b)=0)]$.

    ```


    $Q_1$ is $\Sigma_1$-complete and hence not in $\Pi_1$.


    **Example 5.109** $\phi(\tilde{x}, \tilde{y})$ are mean there two sets of variables
    that are distinguished.


    ```

    $Q_2=[\phi(\tilde{x}, \tilde{y}) \mid (\exists b)(\forall c)(\phi(\tilde{b}, \tilde{c})=0)]$.

    ```


    $Q_2$ is $\Sigma_1$-complete and hence not in $\Pi_1$.


    **Example 5.110** One can define $QP_i$. $QP_i$ is $\Sigma_i$-complete and hence
    not in $\Pi_i$.


    For the next few examples, $M_1, M_2, M_3, \dots$ be the list of all programs
    in some reasonable programming language. From the index $i$, we should be able
    to recover the code for the program.


    **Example 5.111** As noted earlier, $HALT=\{(M, x) \mid (\exists s)\}$ If you
    run $M(x)$ for $s$ steps then it will halt $]$ is $\Sigma_1$-complete and hence
    not in $\Pi_1$.


    **Example 5.112** Let $COF$ be the set of program that halt on every input. Formally


    ```

    $TOT=\{M \mid (\forall x)(\exists s)\}$ If you run $M(x)$ for $s$ steps then it
    will halt $]$

    ```


    $TOT$ is $\Pi_2$-complete and hence not in $\Sigma_2$. Note that we have not proven
    this, but it is true.


    **Example 5.113** Let $COF$ be the set of program that halt on all but a finite
    set of inputs.


    ```

    $COF=\{M \mid (\exists y)(\forall x \ge y)(\exists s)\}$ If you run $M(x)$ for
    $s$ steps then it will halt $]$.

    ```


    $COF$ is $\Sigma_3$-complete and hence not in $\Pi_3$. Note that we have not proven
    this, but it is true.


    Are there any natural problems that are not in AH? We give one.'
