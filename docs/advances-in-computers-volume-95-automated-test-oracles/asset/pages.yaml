- img_proc: true
  md: 'behavior to be checked. A common strategy of many approaches is to maximize
    the behavior to be checked, that is to check all the behaviors corresponding to
    users'' expectations that can be inferred from the source of information. However,
    in some cases, expectations are only partially checked, depending on factors like
    redundancy of program behaviors and performance overhead of the oracle execution.


    There are many discrepancies between the representations of the source of test
    oracles and the actual behavior to be checked, causing difficulties in checking
    them against each other directly. For example, to check the validity of a property
    on some program state, we need to map the abstract names used in the specifications
    to the concrete names of the variables used in the program code. In general, translating
    the source of information and the program behavior into a representation that
    we call changeable form requires several steps. Checkable forms are executable,
    for example, in the program of statements or assertions, or can have different
    degrees of complexity. The simplest form is for equality between two concrete
    values, like in many JUnit test cases. More complex checks may abstract conditions
    on variables. Generating complex checking procedures generally requires nontrivial
    translations that are extensively discussed for instance in the early work on
    assertion mechanisms [14,15]. A checkable form may also be “executable” at a higher
    level of abstraction. A typical example is the use of finite state machines (FSMs).
    The oracle can check either the final state or some conditions on the transitions.
    Section 6 proposes a taxonomy of test oracle techniques according to their checkable
    form as shown in Fig. 1.5.


