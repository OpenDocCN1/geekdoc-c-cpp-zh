    and test control. Keyword tier is the lowest tier in the architecture, defining
    how to navigate in the GUI and interact with the widgets, i.e., how the concrete
    actions are executed and tested on the GUI. Keywords are used to describe test
    cases. Action tier is the intermediate layer consisting of action words describing
    the behavior that can be tested. The action words correspond to high-level concepts
    that describe the problem domain rather than the solution domain. Action words
    are used for describing abstract test cases. Test Control tier is the highest-level
    tier, describing what type of tests (e.g., smoke or a long period test) to be
    run, which test models are used in the runs, which guidance heuristics should
    be used, and what are the coverage objectives for each run.


