    **Example 5.62 Grid Coloring** Imagine coloring every point in the $5\times5$
    grid (formally all points $(i,j)$ where $1 \le i,j \le 5$). A monochromatic rectangle
    (hereafter mono-rect) are four points that form a rectangle (e.g., (2,2), (2,5),
    (4,2), (4,5)) that are all the same color. The following is known [42]: For all
    $c$, there $n$ such that for all $c$-colorings of the $n\times n$ grid exists
    a mono-rect. How big $n$ have to be? We call a grid $c$-colorable if you can color
    it with $c$ colors and not get any mono-rects.


    $GRID=\{(n,c) \|$ $ n\times n$ grid is $c$-colorable\}$.


    This seems to be in NP. But it is. The input $(n,c)$ is of size $\log n + \log
    c$ since they are written in binary. The witness is a $c$-coloring of $n\times
    n$ which is of size roughly $cn^2$. This witness of is exponential in the input
    size.


    We get this problem by writing $n$, the $n\times n$ grid in unary.


    $GRIDUNARY=\{(1^n, 1^c) \|$ $ n$ grid is $c$-colorable\}$.


    This is in NP. Is it NP-complete? This is unlikely since the set is sparse (see
    definition below).


    **Definition 5.63** A set $S \subseteq \Sigma^*$ is sparse if there exists a polynomial
    $p$ such that $(\forall n)|S \cap \Sigma^n \le p(n)$. Note that this is a good
    notion of a skinny set since $S \cap \Sigma^n$ could be as large as $2^n$.


    Mahaney in 1982 [43] proved that if a sparse set was NP-complete then $P=NP$.
    Hence, it is unlikely that $GRIDUNARY$ is NP-complete. Even so, $GRIDUNARY$ is
    believed to be hard.'
