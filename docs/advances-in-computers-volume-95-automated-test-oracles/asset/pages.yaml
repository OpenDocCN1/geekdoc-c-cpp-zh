  md: '# 11. #P


    Leslie Valiant #P and proved most of the results in this section [60,61].


    **Definition 5.71** A function $f$ is in #P if there is a nondeterministic program
    $M$ that runs in polynomial time such that $f(x)$ is the number of accepting paths
    in the $M(x)$ computation. A set $A$ is in $P^{\#P}$ if membership of $x \in A$
    can be determined by a program in poly time that can ask questions to a #P function.


    When #P was first defined it was not clear if it was powerful. Clearly $NP \subseteq
    P^{\#P}$ but it was $\Sigma_2^P \subseteq P^{\#P}$. However, Toda [62] proved
    the somewhat surprising that $PH \subseteq P^{\#P}$. It is not know if this contains
    is proper. If $PH = P^{\#P}$ then PH collapses, hence most theorists think $PH
    \subseteq P^{\#P}$.


    We give examples of natural problems in #P.


    **Example 5.72** $f(\phi)$ be the number of satisfying assignments of $\phi$.
    This problem is clearly in #P. More of importance is that its #P-complete and
    hence unlikely to be computable in PH.


    **Example 5.73** For most NP-complete problems, the function that returns the
    number of solutions (e.g., the number of Hamiltonian cycles) is #P-complete.


    **Example 5.74** There are some problems in Polynomial time where finding the
    number of solutions is #P-complete. In particular, (1) finding the number of matchings
    in a graph and (2) finding the number of Eulerian cycles in a directed graph are
    #P-complete. Strangely enough, finding the number of Eulerian cycles in an undirected
    graph can be done in polynomial time.


    **Example 5.75** The *Permanent* of a matrix is just like the determinant without
    the negative signs. Valiant''s motivation was as follows: computing the determinant
    is easy (polynomial time), but computing the permanent seemed hard. Valiant showed
    that computing the permanent is #P-complete and hence likely quite hard.'
