    NDPTIME(TOW_2(n)) ⊆ DTIME(TOW_3(n)) ⋉ ... ⊆ EL


    (∀i)[DTIME(TOW_i(n)) ⋉ DSPACE(TOW_{i+1}(n))


    C DTIME(TOW_{i+2}(n))


    EL ⊆ PRIMREC ⊆ ACK ⊆ GOOD ⊆ DEC


    DEC ⊆ Σ_1 ⊆ Σ_2 ⊆ Σ_3 ⋉ P#P ⊆ AH


    (∀i)[Σ_i ≠ Π_i]


    What Most Thorough Think


    L ⊆ NL ⊆ P = R ⊆ BPP ⊆ NP ⊆ Σ_1^P ⊆ Σ_2^P ⊆ Σ_3^P ⋉ ... ⊆ PSPACE


    NP ⊆ Π_2^P ⊆ Π_3^P ⋉ ... ⊆ PSPACE


    # 23. OTHER COMPLEXITY MEASURES


    This chapter has focused on worst case analysis where we are interested in time
    or space. There are other ways to measure complexity which may be more realistic.


    +   1. Average case analysis: There has been some work on formalizing average
    case analysis. Rather than see how an algorithm works in the worst case, one looks
    at how it relates to a distribution. What distribution is realistic? This is very
    hard to determine.


    +   2. Approximation Algorithms: For many NP-complete problems there are approximation
    algorithms that are fast and give an answer that is close to the optimal (e.g.,
    within twice). There are also lower bounds as well. Some of these algorithms are
    usable in the real world.


    +   3. Heuristic algorithms: There are some rules-of thumb that seem to work on
    particular problems. Such approaches tend to work well in the real world but are
    very hard to analyze.


    ![](img/61c4fbfb0d3a6be9143c763e4cf4ffde_287_0.png)'
