    # 4.2. Dynamic Reverse Engineering


    The dynamic nature of object-oriented programs is easier to reverse engineer i.e.,
    by executing the system [20]. In dynamic reverse engineering approaches, the system
    is executed and the run-time behavior of the system is analyzed [91]. Various
    algorithms are then applied to extract behavioral models based on the collected
    observations. Dynamic reverse engineering does not necessarily require the source
    code of the system, but usually some kind of instrumentation is required to programmatically
    observe and analyze the system, and the instrumentation is often made on the source
    code level. Besides decompilation techniques, dynamic approaches are the only
    option when the source code is not available [12].


    Compared to static analysis, dynamic monitoring has less noise and better decidability:
    an executed path is possible by definition and all values are determined at runtime
    [87]. Every detected failure can be shown to be caused by a real sequence of input
    events [92]. However, the dynamic monitoring can only see executed paths, requiring
    that the code monitors adequately exercised, e.g., by set of cases with good coverage.
    Also, dynamic approaches can only observe how the software works in the environment
    that was monitored, and an error can be found only when its path is executed [87].


    Usually, dynamic specification mining techniques employ data mining or machine
    learning techniques on execution traces, captured during the execution of the
    system, to generate models that are useful in program verification [93]. In cases,
    where the system behavior executes in parallel, special considerations are needed.
    In cases, where the parallel execution is further distributed, yet additional
    considerations are required [94]. In order'
