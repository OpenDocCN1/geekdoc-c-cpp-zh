  md: 'outputs, known as MRs. MR specifies how the output of the program should change
    according to a specific change made to the input and represent some necessary
    properties of the [114]. MRs are used as test oracles in metamorphic testing to
    identify faults in the SUT [115]. Following are the basic steps in applying metamorphic
    testing:


    +   1. Identify set MRs that should be satisfied by the SUT;


    +   2. Create set of test cases using a traditional selection approach such as
    random testing or fault-based testing. These test cases are referred to as initial
    test cases or source test cases;


    +   4. Execute the initial and follow-up test case pairs to check whether the
    output change at runtime complies with the output change specified by the MR.


    As an illustration, the sin function must always obey the property: sin(x) = sin(180
    − x). Such necessary properties of the sin function may not be a part of its specification.
    However this property specifies a relationship between a pair of input data, x
    and 180-x, and their respective outputs sin(x) and sin(180 − x). In the given
    example, the follow-up test case can be created by subtracting 180 from the initial
    input. Testing of an implementation of sin can be performed by executing the initial
    and follow-up test case pairs and checking whether the produced output pairs are:


    > (3, 177), (15, 165), (45, 135), (125, 55), (277, –97)


    Although this is a trivial example, MR–based oracles are applied for applications
    in different domains, including bioinformatics [116], ML programs [117,118], embedded
    software [119], healthcare systems [120], Monte Carlo modeling [121], and programs
    with partial differential equations [122]. In addition, Xie et al. [123] integrated
    MRs with program slicing and used for fault localization in programs that have
    the oracle problem.


    The set of MRs used in testing has a big impact on the effectiveness of metamorphic
    testing. Liu et al. [124] found that using diverse MRs can improve the effectiveness
    of testing [124]. Usually, MRs used for testing are identified manually by the
    tester, based on her knowledge of the program specification. Recently, there have
    been developments of automated methods that use ML techniques to detect MRs [125].'
