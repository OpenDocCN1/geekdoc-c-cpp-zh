  md: 'The problem the solutions present several trade-offs depending on the considered
    test programs, and the level of automation. Some approaches automate the execution
    of single test cases to validate specific properties. This is the case, for example,
    of common JUnit test cases whose assertions are predicated on specific inputs.
    Other approaches automate the execution of many test cases, as assertions in the
    code correspond to program properties. Yet other approaches deal with general
    program properties, like oracles that reveal the occurrence of system crashes
    and unexpected exceptions, and work across systems. Some approaches make use of
    extra information, like the results of executing previous versions of the same
    system.


    Program and application-specific oracles are usually more precise and can reveal
    many types of failures, but are also difficult and expensive to design and maintain.
    Oracles that refer to general properties are reusable across systems, but cannot
    reveal application-specific failures. Finally, oracles that compare different
    versions of the same system are bound to the old test suites and require strong
    similarities between versions.


    In this chapter, we analyze different types of oracles and propose a new taxonomy
    based on the main component of the process that characterize automated oracles.
    We argue that oracles follow a general process composed of the following activities:
    identify the information that represents the expected behavior, choose the behaviors
    to be checked, translate the source information and the behaviors to be checked
    into an executable form, and execute the test with the generated oracle.


    In this chapter, we argue that the most distinctive element of different approaches
    to automated oracles consists of the source information of test oracles and the
    way it is translated into an executable form, and propose a taxonomy of automated
    oracles that is based on the information sources and their associate process,
    and uses the other aspects of the generation process, for instance the checkable
    forms, to specialize the taxonomy. We show how the different approaches proposed
    in the last 50 years fit this taxonomy.


    # 2. TEST ORACLES


    The early definitions of test oracles focused on the decision process: in 1982
    Weyuk defined an oracle as follows: “the tester or an external mechanism can accurately
    decide whether or not the output produced by a program is correct” [1], where
    the key element of the definition is the decision


    ![](img/61c4fbfb0d3a6be9143c763e4cf4ffde_7_0.png)'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'about the correctness of the output that can depend on human judgment as well
    as on some other mechanisms.


    With the growing emphasis on automated oracles and the progress in the automated
    generation of test oracles, the focus has moved toward the automatic aspects of
    the process. In their well-cited survey, Baresi and Young defined test oracles
    as "some method for checking whether the system under behaved correctly on a particular
    execution" [2], where the human judgment becomes implicit. More recently in their
    book Pezzè and Young defined a test oracle as "software that applies a pass/fail
    criterion to proper execution" [3], this moving away completely from human judgment
    and assuming some procedure. They also relax the strict concept of correctness
    for a more general concept of pass/fail criterion that includes many approaches
    to test oracles that check only partial properties and not the complete correctness
    of the outputs.


    We define a test oracle referring to the definition of Pezzè and Young as a mechanism
    that determines whether or not the execution of the system under passes or fails.
    We refer to a mechanism that we assume to be automated and not relying on human
    judgment, and expect a pass/fail response that may not imply a decision on the
    correctness of the execution.


    From an abstract viewpoint, a test oracle consists of two parts: the expected
    behavior that is used to check the actual behavior of the system under test, and
    the behavior that is checked. The expected behavior can be expressed explicitly,
    for example, as a simple JUnit test case that indicates the expected output for
    the given input, or implicitly, for example, as a property to be satisfied or
    the result of another program with the same functional behavior. The behavior
    may be checked at the end of the execution, for example, by comparing the expected
    and actual outputs, or during the execution, for example, by evaluating assertions
    inserted in the code or by revealing unexpected execution conditions.


    Test oracles differ in several aspects. Here, we distinguish between inputspecific
    versus general, partial versus complete, and application-specific versus general
    oracles.


    When the expected behavior is given for a single input or a finite set of inputs,
    in the case of the simple test case of Fig. 1.2, the oracle can check only a subset
    of behaviors, and we refer to these as input-specific oracles. When the expected
    behavior is given for an infinite set of inputs, as in the case of the simple
    test case in Fig. 1.3, the oracle can be reused for different test inputs, and
    we refer to these as general oracles. The readers should notice that the test
    oracle in Fig. 1.2 expresses the expected output explicitly, while the oracle
    in Fig. 1.3 expresses it implicitly as a required property.'
