- img_proc: true
  md: '# 4.1.1.3 Inheritance Relationships


    Inheritance dependencies among classes is another source of structural information
    to capture relationships between classes, and thus useful to identify anti-patterns
    involved in a hierarchy. Generally, the measurement of inheritance relationships
    between two classes is performed through a simple boolean value: true if two classes
    have inheritance relationships or false otherwise. In the context of anti-pattern
    detection, inheritance relationships have been exploited to support the detection
    of Parallel Inheritance [15] and Refused Bequest [24].


    # 4.1.2 Extraction of Lexical Properties Through Natural Language Processing


    A source code component contains text, e.g., identifiers, methods'' names, and
    comments. Thus, it can be considered as a textual document. Such a likeness has
    induced researchers to apply Natural Language Processing (NLP) techniques on source
    code to extract lexical properties. For example, Information Retrieval (IR) [43]
    techniques have been used to analyze the conceptual cohesion or coupling of classes.
    For instance, two methods are conceptually related if their (domain) semantics
    are, i.e., they perform conceptually similar actions. In order to compute conceptual
    cohesion (or coupling), Marcus et al. [44,45] proposed the use of Latent Semantic
    Indexing (LSI) [46], an advanced IR method that can be used to compute the textual
    similarity between methods. The higher the similarity between the methods of a
    class, the higher the conceptual similarity and the conceptual cohesion of the
    class. On the other hand, the higher similarity between two classes, the higher
    the conceptual coupling between them. Empirical studies have indicated that conceptual
    methods are orthogonal to structural ones. In other words, it is possible to identify
    specific properties of source code that are missed by looking only at structural
    information.


    In the context of anti-pattern detection, lexical properties play a crucial role
    in the identification of LAs. For part of speech analysis is required to (i) identify
    whether a term is a noun, an adjective, adverb, or other parts-of-speech; (ii)
    distinguish singular from plural nouns; and (iii) identify dependencies between
    words, e.g., between subjects and predicates, also negative format. In addition,
    thesauses (e.g., [47]) are required to identify synonymous and antonymous relations.


    Lexical properties are not only useful for the identification of LA. The analysis
    of the textual similarity between methods or classes has been used'
