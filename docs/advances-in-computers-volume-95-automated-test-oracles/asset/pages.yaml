    # 1. INTRODUCTION


    Testing is the most common activity to validate software systems and plays a key
    role in the software development process. Testing requires identifying test inputs
    by sampling the input space, executing the identified inputs on the system under
    test, and checking the validity of the obtained results. Each of these activities
    can be very expensive and has attracted the attention of researchers and practitioners
    who can now benefit from many techniques and tools.


    In this chapter, we focus on the validation of the results of executing test cases,
    also known as the oracle problem. In particular, we focus on automated oracles
    for functional testing. Oracles for functional testing check the results produced
    with test cases that sample the functional behavior of the system, differently
    from the ones that deal with nonfunctional properties like performance, security,
    and safety. Automated oracles are executed and sometimes generated automatically.
    They are extremely important in reducing the costs of testing and improving the
    quality of software validation. The recent quick advances on automatic generation
    of test cases and the new tools that produce large amounts of test inputs provide
    new motivations for deriving efficient test oracles.


    The oracle problem has been studied since the early 1970s and researchers have
    produced many approaches and solutions to both design automated oracles and generate
    them automatically. Figure 1.1 shows the main milestones in the evolution of the
    research on test oracles. In the 1970s, oracles evolved from simple input-output
    pairs that indicate the expected outputs for the given inputs inserted into code.
    In the 1980s and 1990s, the main focus of research has been on deriving test oracles
    from formal specifications. The study of using previous versions or different
    programs as oracles also started in the early 1980s. Recently research on test
    oracles has opened new directions in both terms of application domains (like oracles
    for GUIs, Web applications, embedded systems, and agent systems) and new techniques,
    like log file analysis, test augmentation, test repair, metamorphic testing, and
    oracles from dynamically inferred properties and models.'
