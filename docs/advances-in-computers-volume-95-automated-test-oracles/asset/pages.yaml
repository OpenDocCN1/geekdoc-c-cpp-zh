    to identify instances of anti-patterns, which are missed by using only structural
    properties [17].


    # 4.1.3 Extraction of the History Properties Through Software Repositories


    In order to find interesting and/or complementary properties with respect to the
    structural ones, it would be important to take into account the history of a system.
    In particular, it is possible to consider the code elements changes over time.
    This is really important when the goal is to detect anti-patterns generally characterized
    by how code elements evolve during the evolution of the system. For example, in
    the case of Divergent Change, we have a candidate anti-pattern when a class is
    commonly changed in time for different reasons [2]. In the following, we discuss
    which kinds of historical information could be extracted for the identification
    of anti-patterns.


    # 4.1.3.1 Co-Changes at File Level


    Configuration Management Tools (CMTs) allow to manage different versions of a
    system. In particular, developers can manage the changes of the artifacts (configuration
    items) and keep track of changes occurring in configuration items. In addition,
    by analyzing the log file developers can get information about what was changed,
    who did the change, when the change was made, and the message left by the developer
    who made the change. Thus, the log file contains a lot of information that can
    be mined at finding interesting properties related to the development of a software
    system. Mining of software repositories is a new approach in the sphere of anti-pattern
    detection, while it has been widely used to support other software engineering
    tasks, such as [48–56]. In the context of anti-pattern detection, mining log files
    is worthwhile to detect instances of Parallel Inheritance by simply looking at
    the subclasses added during the evolution of the system.


    # 4.1.3.2 Co-Changes at Method Level


    Using the standard APIs of CMTs, it is only possible to mine co-changes at file
    level. Such a granularity level could not be sufficient to detect some of the
    anti-patterns defined in the literature. In fact, many of them describe method-level
    behavior (see, for instance, Feature Envy). This requires'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# Anti-Pattern Detection: Methods, Challenges, and Open Issues


    use of an ad hoc tool that is able to identify co-changes at method level. A tool
    supporting such a task has been recently developed in the context of a European
    project, namely the Markos project.^7 Specifically, the tool is able to identify
    (i) classes added, removed, moved, or renamed; (ii) class attributes added, removed,
    moved, or renamed; (iii) methods added, moved, or renamed; (iv) changes applied
    to all the method signatures (i.e., visibility change, return type change, parameter
    removed, parameter type change, method rename); and (v) changes applied to all
    the method bodies. This information is particularly useful in the detection of
    anti-patterns involves methods changing together during the history of the system,
    such as Divergent Change.


    # 4.2. Defining the Detection Algorithm


    The second step for the definition of an approach for the detection of anti-patterns
    is related to the choice of the algorithm to use in order to identify candidate
    instances of the specific anti-pattern. Such a choice depends on two factors:


    +   - The kind of anti-patterns we are interested in detecting.

    - The kind of information we want to exploit to characterize the anti-pattern.

    Looking at the literature, we can observe that the algorithms proposed so far
    fall in two categories: (i) heuristic based and (ii) machine learning based.


    A lot of anti-patterns can be identified using heuristic-based algorithms. A simple
    analysis of the dependencies between code components can be sufficient to correctly
    identify anti-patterns in source code. For example, in order to detect the Feature
    Envy anti-pattern, two kinds of heuristics can be


    +   - A structural heuristic, counting the dependencies (e.g., calls) existing
    between a method $m_i$ and a class $C_j$;n- A historical heuristic, counting the
    number of commits in which a method changes together with methods of the same
    class (*internal changes*) with respect to the number of commits in which the
    method change with methods of another class of the system (*external changes*).


    The problem with these kinds of algorithms is related to the definition of a set
    of thresholds to identify an anti-pattern. For example, to detect the Feature
    Envy using a historical heuristic, a threshold is needed to determine the minimum
    difference between *internal* and *external changes*. In order to


    > ^7 http://markosproject.berlios.de.'
