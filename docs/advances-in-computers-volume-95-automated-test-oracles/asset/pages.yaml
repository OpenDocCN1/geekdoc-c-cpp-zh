    application-specific oracles but miss a lot of important functional failures.


    # 3. SCOPE OF THE SURVEY AND REVIEW PROTOCOL


    When surveying the status of a complex research field like the one for test oracles,
    the first challenge is framing the field and identifying the investigation approach.
    In this section, we define the scope of the survey by clarifying the approaches
    and techniques that we considered and the ones we did not, and then discuss the
    review protocol that we followed in the survey.


    We already mentioned in the former sections that we focus on oracles for functional
    testing and we pay special attention to automated oracles. Oracles for testing
    nonfunctional properties are also important, but rely on different approaches
    and techniques. While oracles for functional testing take into account the semantics
    of the programs under test, oracles for testing non-functional properties are
    usually independent from the functional semantic'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# 8


    of the program and deserve a different treatment. Thus, we do not survey oracles
    for properties like performance, security, safety, and usability. A notable set
    of oracles that we consider only marginally in our survey are oracles that target
    reliability properties that may or not be considered special cases of functional
    properties. In particular, we do not deal in detail with application general oracles
    (which are also called implicit oracles).


    Although oracles can be completely human driven, in the case of inspection oracles
    that are based on humans inspecting the results of program executions and deciding
    the pass or fail of the test cases, automation is of paramount importance in modern
    development processes that require many test cases to be executed repeatedly during
    development and maintenance. Automation can refer to both the oracle generation
    and execution. Automatically generated oracles can be executed without human intervention,
    and automatically generated oracles are mechanically derived from some information
    about the behavior. Strictly speaking, any test oracle needs some kind of human
    effort, since oracles rely on information about the expected system behavior expressed
    by software designers and users. This is obviously true for oracles based on requirement
    documents, behavioral models, and formal specifications. Some techniques generate
    test oracles using properties automatically inferred from either dynamic execution
    information or source code semantics of previous or current program versions.
    In these cases, the human contribution is embedded in the programs and then extracted
    and used for generating oracles. In this survey, we consider the effort added
    to the normal software development process and we focus on approaches and techniques
    that generate test oracles with little or no extra effort.


    As an indispensable component of software testing, oracles have been studied for
    decades and exist a wide variety of techniques. This survey does not include all
    the techniques but selects the representative ones. The readers should be able
    to fit other techniques in the proposed taxonomy.


    We surveyed the literature with a “snowballing” strategy. We started from a few
    may surveys [2,11–13], searched for relevant publications by checking their references,
    the references of their references, and so on. Beyond the conventional snowballing,
    we also searched all the publications that cite the main surveys and papers, to
    discover more recent techniques. For each publication, we checked if it addressed
    the test oracle problem either as a main or as a minor contribution and included
    the publications where oracles are the main contribution.'
