  md: '# Definition 5.45 Let A be a set.


    +   1. $A \in NP$ if $A \in NTIME(n^{O(1)}).$


    +   2. $A \in NP$ if there exists a polynomial $p$ and a set $B \in P$ such that


    ```

    $A = \{x \mid (exists y)|x|=p(|x|) \text{ AND } (x, y) \in B\$

    ```


    The intuition is that $y$ is a short easily verifiable proof that $x \in A$. We
    often call $y$ the $witness$.


    Note that if $A \in NP$ then it is possible that $\bar{A} \notin NP$. We know
    so little about NP that we have no examples; however, most theorists think NP
    is not closed under complementation. Here, we need a name for the complement of
    NP.


    # Definition 5.46 A $A$ is in co-NP if $\bar{A}$ is in NP.


    Most theorists think $NP \neq$ co-NP$.


