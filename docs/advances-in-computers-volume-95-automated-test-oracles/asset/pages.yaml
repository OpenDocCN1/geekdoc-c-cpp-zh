    algorithms, including dynamic programming, linear and semidefinite programming,
    and holographic algorithms. This is related to sign 1, but is much more stringent.
    Mulmhey’s GCT (Geometric Complexity Theory) program is the only approach to P
    versus NP I’ve ever seen that has serious aspirations to “know bout” least of
    nontrivial techniques for solving problems in P (at the least, matching and linear
    programming). For me, it’s probably the single strongest argument in GCT’s favor.


    +   3. The paper doesn’t prove any weaker results along the way: for example P
    ≠ PSPACE, NEXP ∉ poly, NP ≠ TC, permanent not equivalent to determinant by linear
    projection, SAT requires linear time...

    P versus is a staggeringly hard problem, which one should think of being dozens
    of steps beyond anything we know how to prove today.

