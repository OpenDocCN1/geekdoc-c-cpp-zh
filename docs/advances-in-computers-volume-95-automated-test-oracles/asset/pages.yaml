  md: 'Example 5.2 Given a string $x \in \{0,1\}^*$ we want to know if the number
    of 0''s equals the number of 1''s. An algorithm for this is to scan the string
    and keep track of just two things: the number of 0''s and the number of 1''s.
    At the end of the scan, see if they are the same. If so, then output YES else
    takes O(n) steps. How much space does it take? We have to store 2 numbers that
    are between 0 and $n$ so this takes $O(\log n)$ space. Languages like this are
    called DSPACE$(O(\log n))$ (we will define this later). This particular language
    is also called context free; however, we will not be discussing this in chapters.


    Most of the sections of this chapter define a complexity class and give natural
    problems in it. In all cases, we are talking about worst case. For example, if
    we say that a problem requires $n^2$ steps we takes $n^2$ steps. As such, some
    of the problems might not be as complex in real life if the inputs are not the
    bad ones. We won''t discuss this further except to say that a problem might not
    be as good as it appears.


    We have added additional sections: (1) a look at other complexity measures, (2)
    a summary of what we''ve done, (3) a literal discussion is a natural problem,


    The natural problems we consider are mainly from graph theory, games, formal language
    theory, and logic. A good reference for some of the problems in logic (with proofs)
    is a book by Ferrate and Rackoff [1]. There are many natural problems in other
    areas (e.g., model checking, artificial intelligence, Economics, Physics); however,
    even to define these problems would be difficult in a chapter of this nature.


    There are many complexity classes that we do not discuss in this chapter. How
    many complexity classes are there? Literally hundreds. The website Complexity
    Zoo [2] currently lists around 500.


    # 2. TIME AND SPACE CLASSES


    The material in this chapter is due to Hartman and Stearns [3]. We want to classify
    problems by how much time or space they take to solve as a function of the length
    of the input. The input is of size $n$. If the algorithm takes $n$ steps or $n/2$
    steps or $10n$ steps, we do not want to care about those differences. While the
    difference between $n$ and 100 matters in the real world, as a first cut at the
    complexity does not. We need a way to say we don''t care about constants.'
