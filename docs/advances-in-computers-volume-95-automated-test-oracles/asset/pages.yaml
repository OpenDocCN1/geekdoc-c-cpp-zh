    # 1. INTRODUCTION


    A fundamental element in the automated testing processes is the test

    oracle, which represents a method (program, function, set of data, or table

    of values) to verify whether the SUT (Software Under Test) behaves cor-

    rect on a particular execution [1–3]. This element plays a decisive role

    in software testing processes establishing a decision about the correctness

    of an SUT result [4–6]. According to Ivory and Hearst [7], test oracles must

    support testers'' decision about the SUT behavior against an input, establishing/behaviors
    are acceptable. In this sense, test oracles

    are reliable sources of information that testers can trust to decide the correct

    t results [8–10]. In technical terms, a test oracle can be carried out in dif-

    fer ways: functions, asertions, processes, data, parallel programs, and

    others [11]. On the other hand, even a human can play the role of test

    oracle deciding about the correctness of test results. Regardless of the differ-

    ent of implementation, oracles bear a fundamental responsibility for the

    whole testing process: they judge and report to testers whether the result of

    an execution is correct [1,12,13].


    Developing an adequate test oracle for particular test domains offers a

    number of challenges. First, oracles are generally separated from the SUT

    and, then, one needs pre-/conditions to automate them in

