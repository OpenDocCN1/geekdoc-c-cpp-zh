- img_proc: true
  md: 'mitigate this problem, an empirical calibration of the threshold can be performed.
    However, the value identified empirically could be not sufficient to correctly
    detect anti-patterns in all the software systems due to the heterogeneity of software
    systems. Thus, specific tuning should be required on each system to improve the
    detection accuracy.


    Machine learning techniques have also been widely used to detect different kinds
    of anti-patterns. For instance, rule cards defined by DECOR have been successfully
    translated into a Bayesian Network using a discretization of the metric values
    to Blobs. In addition, association rule discovery, an unsupervised learning technique,
    has been used to detect three different anti-patterns (i.e., Divergent Change,
    Shotgun Surgery, and Parallel Inheritance). Such a technique is used to identify
    local patterns showing attribute values that occur together in a given dataset
    [57]. In the context of anti-pattern detection, the dataset is composed of a sequence
    of change sets, e.g., methods that have been committed (changed) together in a
    version control repository [58]. An association rule, $M_{left} \rightarrow M_{right}$
    between two disjoint method implies that if a change occurs in each $m_i \in M_{left}$,
    then another change should happen in each $m_j \in M_{right}$ within the same
    change set. The strength of an association rule is determined by its support and
    confidence [57], defined as:


    > $Support = \frac{|M_{left} \cap M_{right}|}{T}$

    Confidence = \frac{|M_{left} \cap M_{right}|}{|M_{left}|}$


    where $T$ is the total number of change sets extracted from the repository. In
    the context of anti-pattern identification, association rule mining has been performed
    using a well-known algorithm, name Apriori [57]. Note that, minimum Support and
    Confidence to consider an association rule as valid can be set in the Apriori
    algorithm. Once again such values can be determined empirically and could be necessary
    to retune such values when applying the approach to other systems.


    # 4.3. Evaluating the Accuracy of a Detection Tool


    The evaluation of an anti-pattern detection tool can consist of different steps
    and can be done following different strategies. In most of cases, a first evaluation
    has been done analyzing the accuracy of metrics to evaluate the goodness of an
    approach (i.e., precision and recall [43]). In other cases,'
  merge: -1
  pgno: 232
- img_proc: true
  md: 'the accuracy of the tool can be evaluated directly involving developers who
    express their opinion regarding the suggestions provided by the tool. In the following,
    we report a set of evaluation strategies that can be used to evaluate an anti-pattern
    detection tool.


    # 4.3.1 Evaluation Based on an Automatic Oracle


    To evaluate the accuracy of a detection tool, an oracle is required that reports
    the anti-pattern instances contained in a system. Unfortunately, very few software
    systems with annotated anti-patterns are available. This means that to have a
    larger data set for experimenting anti-pattern detection tools a a manual identification
    of anti-pattern instances in the object systems is required to build the oracle.
    In particular, starting from the definition of the anti-patterns reported in literature,
    the analysis of each class of a software system should be performed in order to
    identify instances of anti-patterns. Once the oracle is found, the detection tool
    is executed to extract the set of candidate anti-patterns. Finally, the two sets
    of anti-patterns (i.e., the manually identified and the candidate sets) can be
    compared and two widely adopted IR metrics, namely recall and precision [43] can
    be used to estimate the accuracy of the tool:


    ```

    recall = \frac{|Correct \cap Detected|}{|Correct|}\n\precision = \frac{|Correct
    \cap Detected|}{|Detected|}$

    ```


    Where Correct and Detected represent the set of true positive anti-patterns (those
    manually identified) and the set of anti-patterns detected by the approach, respectively.
    As an aggregate indicator of precision and recall, $F$-measure, i.e., the harmonic
    mean of precision and recall can be used:


    ```

    $F-measure = 2\frac{precision \times recall}{precision + recall}$

    ```


    # 4.3.2 Evaluation Based on Developer''s Judgment


    When an oracle reporting the list of anti-pattern instances present in the system
    is not available, it is possible to involve developers in order to evaluate the
    performance of a detection tool. It is worth noting that this is not an optimal
    solution, because the developers can judge the goodness of a suggestion provided
    by the tool, while they cannot evaluate the performance'
  merge: -1
  pgno: 233
- img_proc: true
  md: 'of the tool (i.e., with respect the totality of the anti-pattern instances
    present in the system (i.e., they can judge the precision of the tool, but they
    cannot avoid in the evaluation of the recall). However, this kind of evaluation
    is still useful in two cases:


    +   - As complement of the analysis based on the metrics, in order to understand
    what the tool supports the developer.

    - When we compare to the support provided by two (or more) tools. In this case,
    a partial oracle can be built as the union of the suggestions provided by the
    tools. Thus, both the precision and recall can be evaluated.

    - (i) with the original developers and (ii) with external developers. The evaluations
    performed with original developers are preferred since external developers do
    not have a deep knowledge of the design of the system under analysis and thus
    not be aware of some of the design choices that could appear as suboptimal, but
    that are the results of a rational choice. However, studies with external developers
    can complement performed with original developers. In fact, even if the original
    developers have deep knowledge of the system''s design, they could be the authors
    of some bad design choices and consequently could not recognize good suggestions
    by the tool. This means that the two studies complement each other mitigating
    the specific threats they face.


    # 5. CONCLUSION AND OPEN ISSUES


    Anti-patterns represent symptoms of poor design and implementation choices [2].
    Having classes affected by anti-patterns cause timeconsuming maintenance operations
    due to their lower comprehensibility and maintainability. Thus, detecting anti-patterns
    in the source code is an important activity in order to improve the quality of
    a software system during its evolution. Some anti-patterns can be detected by
    using simple heuristics, while others are really complex to identify. This is
    the reason why in the last decade a lot of effort has been devoted to the definition
    of approaches able to recommend developers problematic components that need to
    be refactored in order to improve their comprehensibility and maintainability.


    In this chapter, we have described the state-of-the-art regarding the detection
    of “design” and “linguistic” anti-pattern. We have also identified and described
    the challenges that need to be addressed for building a'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Anti-Pattern Detection: Methods, Challenges, and Open Issues


    detection tool. Thus, this chapter provides a support to both researchers, who
    are interested in comprehending the results achieved so far in the identification
    of anti-patterns, and practitioner, who are interested in adopting a tool to identify
    anti-patterns in their software systems.


    Even if the analysis of the literature reveals that the anti-pattern identification
    is a quite mature field, there are still some open issues that need to be addressed:


    +   Are anti-patterns harmful? Despite the existing evidence about the negative
    effects of anti-patterns (e.g., [4,6,7]) and the effort devoted to the definition
    of approaches for detecting and removing them, it is still unclear whether developers
    would actually consider anti-patterns as actual symptoms of wrong design/implementation
    choices, or whether some of them are a manifestation of the intrinsic complexity
    of the designed solution. In other words, there seem to be a gap between the theory
    and the practice. For example, a recent study found that some source code files
    of the Linux kernel intrinsically have high cyclomatic complexity. However, this
    is not considered design or implementation problem by developers [59]. Also, empirical
    studies indicate that (i) developers perceived different instances of Blob as
    not particularly dangerous for the system maintainability, especially because
    these classes classify [60] and (ii) some developers, in particular programmers,
    work better on a version of a system having classes that centralize the code,
    i.e., Blob [61]. These results suggest that the presence of anti-patterns in source
    code is sometimes tolerable, and part of developers'' design choices.


    +   Providing a complete support for the identification of anti-patterns. Fowler
    [2] and Brown et al. [3] defined more than 30 anti-patterns. In the last years,
    researchers concentrate their attention only on a small subset of antippatterns
    defined in the literature. The world of anti-patterns is still full of interesting
    points to pick in order to construct more useful and usable tools in a real context.
    To succeed in this goal, the research community should focus the attention not
    only on other kinds of anti-patterns but also on novel strategies for improving
    the accuracy of approaches defined in the literature.


    +   On the use of historical and lexical analysis to detect anti-pattern. A recent
    study indicates that historical properties of code components are able to complete
    structural properties in the process of anti-pattern detection [15]. This finding
    suggests that a better identification of anti-patterns can be achieved with a
    combined technique using a mix of historical and structural'
  merge: -1
  pgno: 235
- img_proc: true
  md: 'Moreover, together with the structural and historical information, lexical
    properties could be exploited to better capture the “semantics” of design decisions,
    in order to have recommendations that we are focused on how developers design
    the system under analysis.


    +   * Analyzing the usability of detection tools. An important threat to the success
    of detection tools is related to their usability. Detection tools might require
    the definition of several parameters. Thus, they might be hard to understand and
    to work with, making developers more reluctant to use such tools. In addition,
    it is necessary to define a good strategy for the visualization and analysis of
    the candidate anti-patterns. This issue is particular important since the anti-patterns
    identified by any detection tool need to be validated by the user. Thus, a good
    graphic metaphor is required to highlight problems to the developer’s eye, allowing
    her to decide which of the code components suggested by the tool really represent
    design problems.


