    # 5.5. Values From Other Versions


    There are several approaches to generate oracles from code. For large software
    projects, there usually exist several program versions and associated test cases.
    The behavior of a different version of the program can be a good source of information
    to generate test oracles. A “gold” (i.e., correct) version of the program would
    be the perfect oracle. In their approach to testing event-driven systems, Memon
    and Xie [57] assume the existence of such gold versions, and extract oracles automatically
    from the executions of the correct versions. However, in practice, a gold version
    may never exist and is often substituted with historical program versions that
    are used as a source of test oracle information.


    Sometimes a previous version is considered as a correct version, when a large
    portion of the output (or values to be checked) are unlikely to change in a new
    version. Spreinkle et al. [58] proposed oracle comparators for Web applications,
    where the HTML output generated with a previous version is used as the expected
    output. Using values from previous versions is particularly suitable for regression
    testing that aims to check the functionalities unchanged in the new version. For
    example, Ostra [59] augments existing test cases with oracles for detecting regression
    errors.'
