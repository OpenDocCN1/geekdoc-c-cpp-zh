    \Sigma_i = \bigcup_{i=1}^infty \Pi_i$.


    Clearly


    $\Sigma_1 \subseteq \Sigma_2 \subseteq \Sigma_3 \subseteq \dots$.


    and


    $\Pi_1 \subseteq \Pi_2 \subseteq \Pi_3 \subseteq \dots$.


    and


    $(\forall i)[\Pi_i \subseteq \Sigma_{i+1} \text{ and } \Sigma_i \subseteq \Pi_{i+1}].$'
