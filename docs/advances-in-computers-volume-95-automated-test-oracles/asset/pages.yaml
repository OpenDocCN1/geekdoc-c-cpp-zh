  md: 'manifests itself especially when a developer uses conditional statements to
    dynamically dispatch the behavior of the system instead of polymorphism. Such
    a problem is known as Type Checking anti-pattern, and as for all the anti-patterns,
    in the maintenance phase this problem can grow up, creating problems to the developers.


    # 2.11.2 Detection Strategies


    For the identification of symptoms of such anti-pattern, a simple heuristic can
    be used: when you see long and intricate conditional statements, then you have
    found a Type Checking candidate. Tsantalis et al. [27] proposed a technique to
    identify and refactor instances of this anti-pattern implemented in the Jdeodorant
    Eclipse plugin. In particular, their detection strategy takes into account two
    cases: in the first case, an attribute of a class represents a state, depending
    on its value, different branches of the conditional statements are executed. Thus,
    if in the analyzed class there is more than one condition involving the attribute,
    a candidate of Type Checking is found. In the second case, a conditional involves
    Runtime Type Identification (RTTI) in order to cast the type of a class in another
    to invoke methods on the last one. For example, this is the case of two classes
    in a hierarchy where the relationship is not exploited by polymorphism. In such
    case, RTTI often arises in the form of an if/else statement in which there is
    one conditional expression for each control on the type of a class. However, if
    the RTTI involves more than one conditional expression, a candidate of Checking
    is found.


    # 2.11.3 Analysis of the Detection Accuracy


    The Checking detection technique proposed by Tsantalis et al. [27] has been evaluated
    on three teaching examples in the textbooks by Demeyer et al. [31] and Fowler
    [2], and it is able to correctly detect the instances reported by the authors
    of these books.


