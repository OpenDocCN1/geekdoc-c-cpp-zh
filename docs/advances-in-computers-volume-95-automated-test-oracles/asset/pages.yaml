  pgno: 41
- img_proc: true
  md: '# Automated Test Oracles: A Survey


    from test executions and check each sequence using the DFA to see whether it satisfies
    the GIL specification. They use the states in the sequence to activate the possible
    transition in the DFA. A transition is executed if the current state in the state
    sequence satisfies the formulae associated with the transition. Since the automata
    is deterministic, for every node of the DFA, one and only one of the labels holds
    for any. For testing a GIL specification $p$ the DFA used as the oracle represents
    $f=

    eg p$. In this way, when $D$ accepts a sequence $s$, it detects a violation of
    $p$ and computes a sequence of formulae that correspond to the violation by finding
    a path through the requirement sets that annotate the relevant temporal logic
    specifications, Dillon and Ramakrishna used flow graphs as the checkable form
    of test automation [45]. In their work, a flow graph represents a finite state
    automation, and its definition is quite similar to that of the DFA used in [42].
    A location $L$ of a flow graph corresponds to a DFA and is annotated with a set
    of temporal logic formulae that must be satisfied by the remaining state sequence.
    A flow graph is a bipartite graph where each arc connects a pair of location $(T,
    L)$ and $(L'', T)$. A pair of arcs $(T, L, L'')$ corresponds to a transition $(N,
    N'')$ in the corresponding DFA, which nodes $N$ and $N''$ correspond to locations
    $L$ and $L''$, respectively, and $T$ is equivalent to the label of the arc. Similar
    to the work presented in [42], state sequences are generated from test executions
    and operate the flow graphs and reject the sequences that do not lead to final
    states.


    Every log analyzer in the log analysis by Andrews [40] includes a set of parallel
    state machines with possibly infinite states. Each state machine is used to analyze
    a thread of execution; however, a log analyzer can analyze the log file containing
    log lines reported by multiple nodes. The nodes of the FSMs represent specific
    events and transitions correspond to log lines that represent the occurrence of
    specific events. In log-testing, the programs under test are instrumented and
    executed to generate log files. Then, each log analyzer processes its log using
    each line of input to run the underlying state machine. The analysis reports an
    error if there exists no transition in the log file that exists from the current
    state or if the events in the log file do not lead to a final state of the state
    machine.


    Model checking is another form of changeable specifications. The technique proposed
    by Callahan et al. starts from model checking to produce an oracle FSM, OFSM,
    for each partition of the test input space and use the oracles both as test drivers
    and as oracles [48].'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'annotates the FSM identifying the paths that correspond to counter-examples,
    generates events for all the marked paths that are sent to the units under test,
    and checks the conditions corresponding to the reactions of the unit under test.
    The OFSM enables such concrete executions referring to an action table that associates
    each transition in the model to its corresponding action (to drive a test) and
    checks.


    FSMs are also widely used in protocol conformance testing [43]. FSMs are used
    to model both the specification and the implementation, and the correctness of
    the implementation is checked by comparing the two models. When dealing with protocol
    specifications, classic FSMs are usually augmented with outputs associated with
    states and transitions.


    The testing process focuses on the coverage of states, transitions, and others.
    As discussed in [2], the oracle execution in protocol conformance testing is closely
    coupled with the test selection. The W method proposed by Fujiwara et al. [43]
    refers to both the specification and the implementation FSMs (denoted as S and
    I, respectively): given an input sequence $(a_1, a_2, \dots, a_n)$, each element
    $a_i$ is fed to S and I and the two outputs are checked to detect faults.


    Wang et al. proposed a technique for testing real-time systems [90]. They translate
    real-time temporal logic specifications into timed automata that are used as the
    throwable form of test oracles.


    # 6.4. Machine Learning Models


    With machine learning models built from previous executions of the same program
    or executions of previous versions of the program, no further translations are
    necessary in most cases to generate throwable oracles, since they can generate
    either expected outputs or the testing results. In this sense, machine learning
    models can be viewed as a kind of throwable form of test oracle. In this section,
    we overview the three most frequently used machine models, association rules,
    decision trees, and ANNs, are used as throwable forms in test oracle techniques.


    When association rules are learnt from data, the expected outputs or verdicts
    are determined by applying the rules on the actual outputs. In a typical application
    of an association rule, $premise \rightarrow consequence$, the actual outputs
    that satisfy the $premise$ must satisfy the $consequence$. Zheng et al. mine association
    rules from existing (training) search results and compute their results and consequences
    as properties of search queries and results [66].'
  merge: -1
  pgno: 43
- img_proc: true
  md: 'Decision trees that are used, for example, by Frouchi et al. to test the consistency
    of image segmentations work similarly to sequences of rules [67]. Typically, a
    decision tree is used as a classifier to classify each data instance and the classification
    is interpreted as the test result of the data instance.


    ANNs are also a popular machine learning model used to generate test oracles.
    Both Jin et al. and Vannami et al. use a single ANN as the test oracle [63,65].
    An ANN is used as an oracle by feeding it the test inputs and using the output
    of the ANN as the estimated output. Since ANNs usually require inputs in the form
    of feature vectors and produces values between 0 and 1, some preprocessing and
    postprocessing may be necessary to transform the original test inputs into a form
    acceptable to the ANN and interpret the ANN output.


    When a single ANN is not sufficient, multiple ANNs are trained and connected to
    larger networks, whose final output is the combination of the outputs of the constituent
    ANNs. For example, Shahamiri et al. deal programs with complex functionalities
    by training one ANN for each different output [64].


    Test oracles based on machine learning models may have several limitations. Since
    they require sufficient data to train the models, they often use an early program
    version to generate training data, and then the models are used to test other
    program versions. Therefore, machine learning models are often used for regression
    testing. Since machine learning models are approximations of the expected (correct)
    program implementation, when used test oracles, they may generate both false positives
    and false negatives.


    # 7. SUMMARY AND FUTURE DIRECTIONS


    In this paper, we presented a classification of test oracles based on the source
    of information required to generate the oracles and we surveyed the main approaches,
    with particular attention to the many results produced in the last decade.


    While in the 1980s and 1990s the research on automatic generation of testing oracles
    focused mostly on the use of different types of specifications, recent research
    has opened new research frontiers that span from the use of machine learning techniques
    to search-based techniques and techniques that exploit the intrinsic redundancy
    of software systems. The early results are extremely encouraging and such approaches
    are widely studied.'
  merge: -1
  pgno: 44
- img_proc: true
  md: '42 Mauro Pezzè and Cheng Zhang


    The growing availability of automated generated oracles opens new interesting
    research questions related to the precision of the generated oracles and the role
    of humans. The precision of automatically generated oracles depends on the information
    used for the generation. Complete and consistent formal specifications may lead
    to complete and precise oracles, while little information may lead to reveal only
    few classes of failures, like the case of implicit oracles that can reveal system
    crashes and unexpected exceptions. Recent trends trend to increase the completeness
    and precision of oracles while keeping a small amount of required information.
    The increasing availability of techniques to generate automatic or semi-automatic
    oracles may change the role of humans who may be required to provide different
    forms of information to increase the effectiveness of automatic generation techniques
    and the precision of automated oracles.


    Yet other research trends are clearly indicated by some recent results concerning
    domain-specific applications. Recently, research has focused successfully on GUIs,
    Web application, and interactive applications, just to cite few interesting application
    domains. We will probably see a growing set of relevant application domains that
    may enable new approaches to generate automated oracles.


