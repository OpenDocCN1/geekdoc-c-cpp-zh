  md: '# Abstract


    Anti-patterns are poor solutions to recurring design problems. They occur in objectoriented
    systems when developers unintentionally introduce them while designing and implementing
    the classes of their systems. Several empirical studies have highlighted that
    anti-patterns have a negative impact on the comprehension and maintainability
    of a software systems. Consequently, their identification has received recently
    attention from both researchers and practitioners who have proposed various approaches
    to detect them. This chapter discusses the approaches proposed in the literature.
    In addition, from the analysis of the state-of-the-art, we will (i) derive a set
    of guidelines for building and evaluating systems supporting the detection of
    anti-patterns; and (ii) discuss some problems that are still open, to trace future
    research directions in the field. For this reason, the chapter provides a support
    to both researchers, who are interested in comprehending the results achieved
    so far the identification of anti-patterns, and practitioner, who are interested
    in adopting a tool to identify anti-patterns in their software systems.


    # 1. ANTI-PATTERN: DEFINITIONS AND MOTIVATIONS


    During lifecycle, a software system undergoes continuous changes at maintaining
    his business level [1]. Unfortunately, these changes are made by developers in
    a rush due to market/customers constraints. As a consequence, source code quality
    is often neglected with the risk ofintroducing bad smell (or simple code smells
    or smells) [2], i.e., symptoms of possible design problems in source code. For
    example, developers might add several responsibilities to a class feeling that
    it is not required to include them in separate classes. As a result, the class
    grows rapidly and the code becomes complex and when the added responsibilities
    grow and breed, the quality deteriorates. Such classes are known as Large Class
    [2] and could be the cause of a design prob in source code, i.e., anti-pattern.
    Fowler and Brown et al. [3] defined a catalogue of more than 30 anti-patterns.
    For each anti-pattern, they reported the definition of the anti-pattern as well
    as specific refactoring operations aimed at removing it in order to improve the
    quality of source code.


    Even if there often code smells and anti-patterns are used as synonym. However,
    the scenario we report allows to understand the difference between code smells
    and anti-patterns. Specifically, code smell represents something "probably wrong"
    in the code, while an anti-pattern is certainly a design problem in source code.
    In other words, a code smell might indicate an anti-pattern.


    > 1 Very often code smells and anti-patterns are used as synonym. However, the
