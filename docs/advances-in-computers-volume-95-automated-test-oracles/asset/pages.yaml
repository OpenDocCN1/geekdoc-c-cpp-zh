  md: '# 25. WHAT IS NATURAL?


    Darling: Bill, since we still don''t know P ≠ NP, are there any problems that
    are provably not in P?


    Bill: Yes there are such problems! (Thinking of using a diagonalization proof
    to create one that exists for the sole purpose of not being in P.)


    Darling: Great! Unless it''s one of those dumb-ass sets that you construct for
    the sole purpose of not being in P.


    Bill: Oh. You nailed it. Okay, so you want a natural problem that''s not in P.
    How about HALT?


    Darling: Nice try Bill. I want a decidable natural problem that is known to not
    be in P.


    Bill: Do you consider fragments of arithmetic, like Presburger Arithmetic or WS1S,
    to be natural?


    Darling: If it requires a page of definitions then not.


    Bill: Oh, OH, I have it! I know a problem that is natural, decidable, easy to
    describe, and known to not be in P.


    Darling: Do tell!


    Bill: Add to regular expressions the ability to use exponents like $a^{100}$ instead
    of writing $a \cdot a \cdots a$ (100 times). We''ll call these t-reg exp do they
    generate the same set? This problem is EXPSPACE-complete hence not in PSPACE,
    hence not in P.


    Darling: Why is that natural?


    Bill: Good question. On the one hand, I didn''t construct the problem for the
    sole purpose of not being in P. So it''s not a dumb ass problem. Does this raise
    to the level of natural?


    Darling: Perhaps it''s intermediary between dumb ass and natural. An intermediary
    problem. Like graph isomorphism is likely not in P nor-complete.'
