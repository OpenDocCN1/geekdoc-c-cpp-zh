    # 4.4.4 Challenges in Using Reverse Engineered Models for Testing


    Test designers widely believe that the overall effectiveness and cost of software-testing
    depends largely on the type and number of test cases executed on the software.
    Test oracle, a mechanism that determines whether a system is executed correctly
    for a test case, also significantly impacts the fault detection effectiveness
    and the cost of executing a test case [116].


    When extracting models automatically by observing an existing system, the generated
    models are based on the observed implementation. As such, the generated models
    also include the undesirable behavior of the system, instead of capturing the
    requirements or expectations of the system. Without the knowledge of correct or
    incorrect behavior, the implementation-based models without elaboration are not
    well suited for generating test cases and test oracles, as in traditional MBT.


    Test oracles can be defined as generic checks for all systems or as application
    specific checks. Generic checks, such as unhandled exceptions [117,118] or crashes
    of the SUT [119], can be used in several different systems, including tests generated
    from extracted models. Generic test oracles can also be defined for classes of
    applications, such as checking for HTTP error codes in all visited pages for a
    Web application [120]. Application-specific test oracles have to be created or
    generated specifically for each case or system. In specification mining-based
    test generation, invariants captured from a set of execution scenarios can be
    used for modeling the SUT [117].'
