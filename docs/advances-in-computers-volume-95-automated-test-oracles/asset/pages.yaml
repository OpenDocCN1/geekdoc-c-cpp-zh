    # 3.1. Generic Classifications


    In this section, we introduce general classifications in which test oracles can
    or cannot fit. Although these classifications are well known by many researchers
    and practitioners, they are not often mentioned in studies of the test oracle.
    These classifications are associated with the general purpose of the test oracles
    and are not associated with technical aspects applied in order to implement the
    oracle function as source of information or automation level. Below we present
    some characteristics that oracles can or cannot meet.


    # 3.1.1 Pseudo-Oracles and Partial Oracles [81,82]


    David and Weyuker [4] were two of the first authors to formalize and discuss the
    oracle problem. They sought solutions that alleviate the fact that it is impossible
    in practice to define a complete and totally reliable oracle for all SUTs. Given
    the impossibility of defining an ideal oracle, the authors discern two possible
    options: pseudo-oracles and partial oracles.


    According to David and Weyuker [4], pseudo-programs are written by a second team,
    in parallel to the SUT, and following the same identifications. Both oracle and
    SUT run with the same input and outputs are compared. This concept can be considered
    in two aspects. First, one could consider any code or executable model as a pseudo-oracle.
    Second, the margin of accuracy between the pseudo-oracle and SUT could be applied
    to allow acceptable discrepancies between results.


    There is no guarantee that an oracle is free of faults pseudo. Accordingly, when
    the SUT''s output is not equal to the oracle output, one must go through the debug
    process to check which actually has the fault. As we mentioned before, if the
    oracle is incorrect, the oracle indicates a failure when there is no failure,
    this is a false negative. On the other hand, if both programs present the same
    wrong result, the verdict will be that the SUT passed the test when it actually
    did not—false positive.'
