    If $\\alpha$ is a t-reg exp, then $L(\\alpha)$ is the set of strings that $\\\
    alpha$ generates.\n\nHere is the question we call t-reg expression equivalence\n\
    $TRE = \\{(\\alpha, \\beta) \\| \\alpha, \\beta \\text{ are t-reg expressions\
    \ and } L(\\alpha) = L(\\beta)\\}$.\n\nNote 5.86 In the original paper, this is\
