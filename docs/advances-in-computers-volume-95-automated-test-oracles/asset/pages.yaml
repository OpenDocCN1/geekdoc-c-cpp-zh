    \ space $\\le O(S(|x|))$.\n\nNote 5.14 There is really useful to define a nondeterministic\
    \ device computing a function.\n\nNotation 5.15 The class $\text{DTIME}^{O(1)}$\
    \ is $\bigcup_{i=1}^{\\infty} \\text{DTIME}(n^i)$. We may use $O(1)$ inside other\
    \ time or space classes. The meaning will be clear from context.\n\nWe will be\
    \ interested in seeing which time or space class a problem is in. Within a class\
