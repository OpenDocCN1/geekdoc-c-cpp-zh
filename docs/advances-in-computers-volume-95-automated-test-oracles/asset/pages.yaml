    # 4. REVERSE ENGINEERING AND SPECIFICATION MINING


    When an existing system is being modeled, there are various model extraction techniques
    to automate the process of producing the models based on the implementation. In
    the literature, the process of automatically creating models or other specifications
    based on existing design and implementation artifacts is commonly referred to
    as reverse engineering, specification mining, or specification inference. In this
    chapter, these terms are used interchangeable unless specified.


    Chickofsky [81] defines reverse engineering as the process of analyzing a subject
    system to identify the systems'' components, their relationships, and to create
    representations of the system in another form or at a higher level of abstraction.
    The specification mining can be roughly divided into static, dynamic, and hybrid
    approaches that use a combination of both static and dynamic analysis. In the
    static approach, the source code or other static representation of the system
    is analyzed without executing the system. In the dynamic approach, the system
    is executed and its external behavior is'
