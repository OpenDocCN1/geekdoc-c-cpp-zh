    # 2.3.1 The Oracle Problem


    The decision about the correctness of an execution and, consequently, relations
    of failures is the most essential aspect related to any testing activity, even
    the manual ones [3,45]. In a software testing environment, test oracles play this
    essential aspect, which is a hard task because it is not trivial to find out a
    set of expected outputs for SUTs [43]. For instance, we can wonder about a situation
    in which the SUT must figure out the value of π on a determined precision of decimal
    numbers. Unless there is another program Q, which is working properly to solve
    the same problem, it is impossible to determine if P''s outputs are right or not
    [6]. Another case is when P represents a nondeterministic program and P(vk) matches
    different outputs, all of them correct [43,45]. That means the process of deciding
    about correctness of SUT''s is much harder than it is and involves finding solutions
    for different kind of problems [4,6,67]. Problems like these have been frequent
    in the software industry during the last three decades. Due to this, testers consider
    the task to determine reliable sources to judge all SUT''s outputs a complex and
    nontrivial.


