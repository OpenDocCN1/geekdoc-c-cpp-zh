    # Abstract


    A fundamental problem in computer science is stated formally as: Given a problem,
    how is it? We measure hardness by looking at the following question: Given a set
    A what is the fastest algorithm to determine “x ∈ A?” We measure the speed of
    an algorithm how long it takes to run on inputs of length n, as a function of
    n. For example, sorting a list of n can be done in n log n steps.


    Obtaining a fast algorithm is only half the problem. Can you prove that there
    is no better algorithm? This is notoriously difficult; however, we classify problems
    into complexity classes where those in the same class are roughly equal.


    In this chapter, we define many complexity classes and describing natural problems
    that are in them. Our classes go all the way from regular languages to various
    shades of undecidable. We summarize all that is known about these classes.


    ![](img/61c4fbfb0d3a6be9143c763e4cf4ffde_242_0.png)


    #  1. INTRODUCTION


    A fundamental problem in computer science is stated formally as: Given a problem,
    how is it?


    For a concrete problem, the answer might be it will take 2 h of computing time
    on a supercomputer or this will take a team of 10 programmers 2 years to write
    the program. For a class of problems of the same type (e.g., sort a list), the
    complexity usually depends on the input size. These are the kinds of problems
    we will consider. Our concern will be how much time or space the problem takes
    to finish as a function of the input size. Given a string x in set A or not


    Example 5.1 Given a string x ∈ {0,1}n we want to know if it is in 0* (a string
    of all 0s). An algorithm for this problem is to scan the string and keep track
    of just one thing: have you seen a 1 or not? As soon as you do, stop and output
    NO. If you scan the scan and have not seen a 1 then output YES. Note that this
    take O(n) steps and O(1) space, and scanned the input once. Languages like this
    are called regular or DSPACE(O(1)) (we will define this later).'
