    # 8. RANDOMIZED POLYNOMIAL TIME: R


    **Definition 5.40** A problem A is in *Randomized Polynomial Time* (hereafter
    R) if there is a program that flips coins such that the following happens:


    +   1. On all inputs of length $n$, the program halts in time polynomial in $n$.

    2. If $x \in A$, then the program will ACCEPT with probability $\ge 2/3$.

    3. If $x \notin A$, then the program will REJECT.


    **Note 5.41** The 2/3 can be replaced by any $\epsilon > 0$ and even by $\frac{1}{2^n}$
    where $n$ is the length of the input.


    Clearly $P \subseteq R$. Before 1988, the theory community did not have a strong
    opinion on if $P = R$, however, the opinion would have been a tendency towards
    $P \neq R$. Michael Sipser [20] was an exception in that he believed $P = R$.
    In 1998, Nisan and Wigderson [21] showed that, given certain quite unproven hypothesis
    from complexity theory, $P = R$. Since the consensus has been that $P = R$. This
    remains unproven.


    At one time the quintessential natural problem in R was not known to be in P primality.
    Solovay and Strassen [22] and Rabin [23] showed primality was in R. Their algorithms
    are randomized. Rabin pointed out that if the error is (say) $1/2^{100}$ then
    the probability that a cosmic will hit a computer and flip a bit to make it incorrect.
    The algorithm by Rabin is sometimes called the Miller–Rabin primality test since
    Miller had a deterministic algorithm that depended on unproven conjectures in
    Number Theory.


    In 2002, Agrawal-Kayal-Saxena [24] proven that primality is in P. Their algorithm
    is slow and not in use. However, it was very interesting to see that primality
