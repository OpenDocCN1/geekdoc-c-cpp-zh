  md: "Definition 5.10 A Nondeterministic Program is a program where, in any state,\
    \ there is a choice of actions to take. For example, a line might read\n\n```\n\
    $x := x + 1 \\text{ OR } y := y + 4$\n```\n\nIf $M$ is a nondeterministic program,\
    \ what does it mean to run $M(x)$? We do not define this. However, we say what\
    \ it means for $M(x)$ to accept.\n\nDefinition 5.11 Let $M$ be a nondeterministic\
