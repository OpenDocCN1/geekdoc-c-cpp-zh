    For this section, we let L = DSPACE(log n). It is known that REG L. We give examples
    of sets in L – REG.


    **Example 5.31** Intuitively, any set you need to keep track of the number of
    a''s or any unbounded quantity is not regular. Formally you would prove the following
    nonregular using the pumping lemma (perhaps together with closure properties).
