    key problem that must be carefully considered; it should first be evaluated, which
    requires the use of other oracles.


    # ### 3.3.4 Version-Based Oracles


    Version-based oracles are mechanisms that explore different versions of the SUT
    to support decisions about the correctness of a test execution. The use of other
    versions of the SUT to test oracles was previously discussed in the introduction
    of pseudo-code oracles. This classification is very similar to the Derived Oracles,
    presented by Harman et al. [11]. Here, we briefly discuss different approaches
    to SUT versions as oracle information and how new versions can be used, namely:


    +   - N-version: an N-version approach requires that N independently versions
    of SUT are also implemented [133]. If different outputs are produced by any version,
    a majority vote decides which output is likely correct. If the same test implements
    all versions of the SUT in the same language, it is possible that the same defect
    in the program will be present in other versions (correlated defects). To avoid
    such a drawback, Manolache and Kourie [134] suggest that teams and language paradigms
    should be used. However, Knight and Leveson [135] found that even independently
    developed programs may contain correlated faults; In this case, only different
    versions of SUT are implemented, instead of a complete system, with the objective
    of reducing the cost.

    - M-mp (m-model Program testing): an M-mp approach is a variation of the N-version.
    In this case, only different versions of SUT are implemented, instead of a complete
    system, with the objective of reducing the cost.


    Other similar approaches of version-based oracles may include three variation
    of strategies. First, regression testing when previously tested stable versions
    are used as oracle information to test programs developed by iterative processes
    [95]. Second, third-party components can use tools such as extreme harvesting
    [86] to search for artifacts (metadata) produced during normal development processes
    as the basis for component retrieval and matching on Web searches. The retrieved
    components are then used as an oracle and information. Third, one can mention
    oracles based on mutation test use outputs from programs generated from the original
    code with modified source code (mutant programs). Then, the oracle compares these
    outputs with outputs from the original code.


    Section 4 presents a mapping with a quantitative analysis of studies on test oracles.'
