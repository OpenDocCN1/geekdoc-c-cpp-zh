  md: '# Abstract


    A significant challenge in applying model-based testing on software systems is
    that manually designing the test models requires considerable amount of effort
    and deep expertise in formal modeling. When an existing system is being modeled
    and tested, there are various techniques to automate the process of producing
    the models based on the implementation. Some approaches aim to fully automated
    creation of the models, while others aim to automate the first steps to create
    an initial model to serve as a base. Especially graphical user interface (GUI)
    applications, including mobile and Web applications, have been a good domain for
    model extraction, reverse engineering, and specification mining approaches. In
    this chapter, we survey various automated modeling techniques, with a special
    focus on GUI models and their usefulness in analyzing and testing of the GUI applications.


    # 1. INTRODUCTION


    Increasing, more ubiquitous use of software systems makes our daily lives more
    dependent on the software functioning without errors. In the worst case, a slight
    error in an airline coordinating system could cause a fatal accident, a minor
    leak in Internet banking system could lead to loss of customers’ money and major
    financial problems. Software systems are simplified models of their real-world
    counterparts, no one can claim that they are perfect and free of defects [1].
    Especially, errors or weaknesses in critical infrastructure are risks that must
    be minimized, and that require software testing. Software testing is a dynamic
    technique for increasing confidence in the correctness of the software, i.e.,
    that the software behaves reliably as expected [2].


    Graphical user interfaces (GUIs) constitute a large part of the software being
    developed today [3]. Most software today is interactive, and the code related
    to the user interface (UI) can be more than half of all code [4]. The UI of a
    computer program is the part that handles the output to the display and the input
    from the person using the program [5]. GUI is a graphical frontend that accepts
    user- and system-generated events as input and produces deterministic graphical
    output [6]. GUI is intended to make software easy by providing the user with visual
    controls [7]. GUI software is often large and requires developers to deal with
    elaborate graphics, multiple ways of giving commands, multiple asynchronous input
    devices, and rapid semantic feedback [5]. Complexity is further increased when
    the goal is to create simple but flexible GUIs,'
  merge: -1
  pgno: 53
- img_proc: true
  md: 'e.g., providing default settings for quick and simple usage but allowing more
    users to modify the settings. The correctness of GUI''s behavior is essential
    to the correct execution of the overall software [7].


    For the most part, the challenges in automating GUI testing remained the same
    for a decade [8]. It is still challenging to define and implement coverage criteria
    for not only code coverage of the test suite, but also coverage of all the possible
    interactions between the GUI and the underlying application. As the amount of
    possible interactions tends to be practically for nontrivial GUI applications,
    the challenge is to select a test suite having a smaller amount of test cases.
    While manually crafting the models for model-based GUI testing (MBGT) has solved
    some, it remains challenging to verify whether the GUI executes correctly as specified
    or expected. A GUI test case requires interleaving the oracle invocation with
    the test execution, because an incorrect GUI state can lead to an unexpected screen
    making further the test execution useless [8]. Also, pinpointing an error''s actual
    cause may otherwise be difficult, especially when the final output is correct
    but the intermediate outputs are incorrect [8]. Automated creation of test oracles
    is easier for regression testing, because the behavior of an existing, possibly
    correct version of the GUI software can be used for extracting the expected behavior,
    that is stored as oracle information [9].


    Most GUI applications are built using UI software tools [10] and iterative process
    of redesigning the UI after user testing [5]. Most designers think that the behavior
    is more difficult to prototype than the appearance and communicating the behavior
    to the developers is more difficult than the appearance [11]. Due to the iterative
    “rapid prototyping” development processes, the requirements, design and implementation
    of GUI software change often, making GUI testing a challenging field for test
    automation. The maintenance effort required for updating the test suites because
    of the constant changes in the GUI decreases the benefits gained from test automation.
    Another challenge in GUI test automation is that automated testing through a GUI
    is more difficult than testing its API (Application Programming Interface) because
    it requires additional programming effort to simulate user actions, to observe
    the outputs produced and check its correctness, even when using auxiliary libraries
    [12], as Microsoft UI Automation [13] or Jenny [14]. Furthermore, it is even more
    difficult to automate the evaluation of the user experience, as it depends also
    on the needs of the targeted users, and usually, end users evaluate concepts and
    prototypes already during development [4].'
  merge: -1
  pgno: 54
