    checked in a hierarchical. To test Web applications, Sprekle et al. [58] proposed
    a suite of 22 oracle comparators that compare the expected and the actual HTML
    outputs. The technique uses the output from a previous program version as the
    expected output. At a high level, the oracle comparators can be classified as
    document-, content- and structurebased. Each of these three categories can be
    further decomposed according to the treatments on lower-level entities, such as
    white spaces, tags, tag links, attributes, and forms. Sprekle deconstructed the
    entire suite into a partial order that gives a clear overview of the relations
    between comparators and can be used to guide effective combinations of the comparators
    for specific testing tasks [58]. Kim-Park et al. proposed an'
  merge: -1
  pgno: 40
- img_proc: true
  md: 'automated oracle for XML processors that mix several kinds of information,
    including a relaxed golden implementation, user-defined expected nodes, and node
    ordering [86]. The checking process amounts to executing the XQuery code translated
    from the six oracle constraints.


    Some programs produce random outputs, either because they take random inputs or
    because of randomness in their code implementations. For such programs, the exact
    expected outputs are difficult if not impossible to obtain. Mayer and Guder proposed
    a technique for testing such programs using statistical methods, based on formulae
    for computing statistical measures of the actual outputs available, for instance
    mean and variance [87]. The expected output required by the technique is computed
    as the expected values of the statistical measures. The technique automatically
    extracts the relevant outputs from the test case executions and computes the actual
    values of the statistical measures using the given formulae.


    # 6.3. Executable Specifications


    Executable specifications provide a way to synthesize expected expectations. They
    differ from program implementations in that they are executed at a higher abstraction
    level. Test oracles can be easily derived from executable specifications by mapping
    the abstract states of the specifications to the concrete states of the program
    execution. Many techniques use executable specifications, including logic programming
    [88], abstract state machines [89], and FSMs. In our survey, we found that FSMs
    are the executable specifications most frequently used as test oracles.


    Most techniques use FSM as the source of test information do not translate the
    FSM specifications into other checkable forms, but use directly the FSMs as a
    checkable form and check each program executions against the FSM execution.


    Pradel and Gross propose a technique for checking API protocols that checks only
    the execution traces derived from failing test executions [41]. They split each
    execution trace into subtraces and then check each subtrace all API protocols
    with protocol parameters with the same types of the subtrace. They map each receiver
    object in the subtrace to a type-matching protocol parameter in API being checked.


    In testing temporal properties expressed in GIL, Dillon and Yu [42] proposed an
    algorithm to translate GIL specifications into DFA (as described in Section 5.3).
    They extract finite sequences of system states'
