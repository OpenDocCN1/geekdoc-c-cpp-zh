  md: '# Definition 5.100 Ackermann''s function is defined as follows


    $A(m, n) = \begin{cases} n+1 & \text{if } m=0 \ A(m-1, 1) & \text{if } m \ge 1
    \text{ and } n=0 \ A(m-1, A(m, n-1)) & \text{if } m \ge 1 \text{ and } n \ge 1
    \end{cases} \quad (5.1)$


    Ackermann''s function is an example of a function that is computable but not primitive
    recursive. We have not been able to find a more natural example. This raises the
    question: how natural is Ackermann''s function.

    Ackermann''s function was originally defined for the sole purpose of obtaining
    a computable function that was not primitive recursive. Hence, it can be considered
    unnatural. However, over time they have shown up in natural places. We give one
    example.


    # Example 5.101 Data Structures for Union Find


    A Union-Find Data Structure is a data structure which supports a set of sets.
    The Find-Find operations are (1) FIND which, given an item **x** determine if
    it is in the data structure, and if so it replaces, and (2) UNION given two sets
    replace them with the union of the two. One could ask how many steps a FIND costs
    and how many steps a UNION costs. This is not the right question. One anticipates
    many FINDS and UNIONs. So here is the right question: how much time does it take
    to do $n$ operations? Note that it could be that one of them takes a long time
    but then take very little time.


    Tarjan and Van Leeuwen [74] showed that this problem (1) can be done in time $\Omega(na(n))$,
    and (2) requires time $\Omega(na(n))$, where $\alpha(n)$ is the inverse of the
    Ackermann function. This means the problem cannot be done in $O(n)$ time but it
    can be done in just barely more than that. Of interest to us is that Ackermann''s
    function appears in the analysis of this natural problem!


