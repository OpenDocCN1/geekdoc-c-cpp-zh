    projects and test benches, SE methods teach us that it is sometimes difficult
    to change patterns when they have been applied for a long time. Tools regulating
    test oracle approaches seem to be complex. A tool should be attractive to its
    user, that is, easy to use and extensible to allow new technologies to be added
    in the future. Due to this, it is possible to note that the acceptance of research
    on the oracle problem by the industry is a challenge. This problem of technology
    transfer became clear from the numbers provided by the comparative analysis among
    studies from industry, academia, or collaborations (Fig. 3.19).


    We believe that a possible solution to the problem of technology transfer is the
    development of effective methodologies to transfer results of test oracle'
  merge: -1
  pgno: 179
- img_proc: true
  md: 'research to industry. It seems that a considerable amount of researchers on
    test oracles does not produce products from their findings or thesis. Many times,
    impressive and impactful studies on the oracle problem are published but their
    practical exploration are not well presented and documented. Disregarding some
    exceptions, this lack of products is due to the fragmentation of the research
    groups. We feel that, despite some collaboration among research groups (Fig. 3,23),
    there is a lack of cooperation to create a product with several resources.


    Another point to be considered in dealing with problems related to transfer is
    the supply of training materials and tutorials about practical approaches. Available
    frameworks, tools, and APIs seem difficult to handle for testers who are not involved
    in their original design. Tutorials and practical examples are not usually mentioned
    by the authors of studies. Likewise, internet repositories including code samples
    and templates are not common. Due to this, practitioners and researchers interested
    in following new strategies have to spend a lot of time to learn new concepts
    and paradigms.


    In addition, in our analysis, we observed many studies on parts of an oracle,
    but they do not treat the problem as a whole. For example, there are many studies
    on specification languages that discourse how expressive are with regard to other
    languages, their applications in different domains or how it is possible to translate
    to automate and how to turn expressions more efficiently. But there is no study
    on the tracing from a document to a specification language that is used as oracle
    information and how expressive a specification language actually should be to
    fit as oracle information. In addition, there is a lack of studies on how to facilitate
    the specification writing for complex requirements in the oracle context. A similar
    situation occurs for MR when describing metamorphic testing a manually intensive
    technique for complex cases [142].


    All the timely challenges, namely, the difficulty in generalizing automated solutions
    and in learning a specification language and writing requirements, usability and
    support mechanisms, initial configurations, and input and output parameters, hamper
    the oracle automation and make their acceptance difference in the industry. Such
    points must be considered in a context where an oracle procedure must analyze
    its information to allow automation. For instance, on the ML research, there are
    many studies that demonstrate their role as oracles, but there is not much effort
    on presenting how to prepare the data of an SUT to feed the network.'
  merge: -1
  pgno: 180
