  md: 'One can show that addition is in PR₁, multiplication is in PR₂nExponentiation
    is in PR₃, $TOW_0(2)$ is in PR₄. More to the point, virtually

    any function encountered in normal mathematics is primitive recursive.


    Clearly EL $\subseteq$ PRIMREC. In fact EL $\subseteq$ PRIMREC. We give a

    example of a natural problem that is in PRIMREC but not EL.


    **Example 5.96** The problem will be given sentences in a certain restricted

    mathematical language, determine if it''s true. We need to define the

    language.


    Recall in Section 4 we defined WS1S formulas.


    A sentence is a formula where all of the variables are quantified over. As

    noted in the discussion of Presburger arithmetic, formulas do not have a

    truth value but sentences do. We can now define our problem: Given a

    sentence $\phi$ in WS1S is it true?


    +   - Buchi [64] showed that this problem is decidable using finite automata.

    This involves using the fact that formulas give rise to regular sets (see

    Section 4). Using this method, every time there is an alternation of

    quantifiers you need to do an NDFA transformation. Hence,

    this procedure takes $TOW_n(2)$ steps where $n$ is the number

    alternations of quantifiers. Therefore the algorithm is primitive

    recursive; because the subset depends on the input, the

    function $TOW_n(2)$ is not in EL.


    +   - Meyer [65] showed that the algorithm sketched above is optimal. Hence,

    t problem is not in EL.


    +   - One can define S1S that allows quantification of infinite sets.

    Buchi [66] showed that this theory is decidable. The proof uses $\omega$-

    ata run on infinite strings. In the algorithm for deciding

    WS1S, DFA''s are manipulated and never never ran. So the

    fact that an $\omega$-automata takes an infinite string as input is not a problem.

    The proof that S1S is decidable rather difficult.


    +   - WS1 and S1S both involving one successor function. What

    it it mean to have two successors? Our basic objects are numbers.

    We could view numbers as strings in unary. In that case S(x) = x1.

    If our basic objects were strings in $[0,1)^*$, we could have two

    succors $S_0(x) = x0$ and $S_1(x) = x1$. This yields two theories:

    WS2S and S2S. Rabin [67] proved that both are decidable. The proofs

    of S2S used transfinite induction and is likely the hardest proof of

    theory being decidable. Earlier proofs were later found by Gurevich and

    Harrington [68,69]. Their complexities are primitive recursive but not

    in EL.'
