    # Abstract


    Software testing is an essential activity of software development, and oracles
    are a key pillar of testing. The increasing size of test suites, the growing availability
    of test case generators that produce enormous amount of test cases, and the repeated
    execution of large amounts of test cases require automated oracles. Although studied
    since the late 1970s, in the last decade, test oracles and techniques to automatically
    generate test oracles have attracted a lot of attention and have witnessed an
    impressive growth.


    In this chapter, we survey test oracles with particular attention to their automation.
    We overview the main evolution of the technology, and propose some criteria to
