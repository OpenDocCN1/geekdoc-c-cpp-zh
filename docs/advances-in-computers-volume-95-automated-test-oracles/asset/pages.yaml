    \nWe will only use the following symbols.\n\n+   1. The logical symbols $\\wedge,\
    \ \neg, (\\exists)$.\n2. Variables $x, y, z, \\dots$ that range over $\\mathbb{N}$.\n\
    3. Symbols: $+, \times$.\n4. Constants: $\\dots, -3, -2, -1, 0, 1, 2, 3, \\dots$\n\
    We call this Arithmetic.\n\n# Definition 5.115 A term is:\n\n+   1. If $t$ is\
    \ a variable or a constant, then $t$ is a term.\n\n+   2. If $t_1$ and $t_2$ are\
    \ terms, then $t_1 + t_2$ is a term and $t_1 \times t_2$ is a term.\n\n# Definition\
    \ 5.116 An Atomic Formula is: If $t_1, t_2$ are terms, then $t_1 = t_2$ is an\
    \ Atomic Formula.\n\n# Definition 5.117 A Formula is defined the same way as Presburger\
    \ arithmetic except that the atomic formulas are different.\n\nA $sentence$ is\
    \ a formula where all of the variables are quantified. We can now define our problem:\
