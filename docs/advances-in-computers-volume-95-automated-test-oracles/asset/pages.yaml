    # 17. ELEMENTARY


    **Definition 5.92** The complexity class EL (for Elementary) is defined by


    $$EL = \bigcup_{i=0}^{\infty} DTIME(TOW_i(n))$$


    It is known that, for all $i$, $DSPACE(TOW_i(n)) \subset EL$.

    Virtually no one would ever compute primitive as Elementary. In the next section,
    we give an example of a problem which is computable in fact, primitive recursive
    but not elementary.


    # 18. PRIMITIVE RECURSIVE


    We will define the primitive recursive functions in stages.


    +   **Definition 5.93** $PR_0$ be the following functions:

    1. $n, c \in \mathbb{N}$. Then the function $f(x_1, \dots, x_n) = c$ is in $PR_0$.

    2. $n \in \mathbb{N}$ and $1 \leq i \leq n$. Then the function $f(x_1, \dots,
    x_n) = x_i$ is in $PR_0$.

    3. $n \in \mathbb{N}$ and $1 \leq i \leq n$. Then the function $f(x_1, \dots,
    x_n) = x_i + 1$ is in $PR_0$.


    **Definition 5.94** For $i \geq 1$, the following functions are in $PR_{i-1}$.


    +   1. All $h \in PR_{i-1}$.

    2. $k, n \in \mathbb{N}$. Let $f \in PR_{i-1}$ where $f : \mathbb{N}^n \to \mathbb{N}$.
    Let $g_1, \dots, g_n \in PR_{i-1}$ where $g_i : \mathbb{N}^k \to \mathbb{N}$.
    Then $h(x_1, \dots, x_k) = f(g_1(x_1, \dots, x_k), \dots, g_n(x_1, \dots, x_k))$
    is in $PR_i$. (This is just composition.)

    3. $n \in \mathbb{N}$. Let $f \in PR_{i-1}$ where $f : \mathbb{N}^n \to \mathbb{N}$
    and $g : \mathbb{N}^{n+2} \to \mathbb{N}$. Let $h : \mathbb{N}^{n+1} \to \mathbb{N}$
    be defined by

    a. $h(x_1, \dots, x_n, 0) = f(x_1, \dots, x_n)

    b. $h(x_1, \dots, x_n, x+1) = g(x_1, \dots, x_n, x, h(x_1, \dots, x_n, x))$ (This
    is recursion.)


    **Definition 5.95** A function is Primitive Recursive if it is in $\bigcup_{i=0}^{\infty}
    PR_i$. We define the set of functions where $f$ is primitive recursive in $DTIME(f)$
    as PRIMREC.'
