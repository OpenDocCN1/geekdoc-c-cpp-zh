    # 2.5 Divergent Change


    # 2.5.1 Definition


    Fowler describes a Divergent Change as a class that is “commonly changed in different
    ways for different reasons” [2]. Classes affected by this anti-pattern generally
    have low cohesion.


    # 2.5.2 Detection Strategies


    The definition of Divergent Change provided by Fowler suggests that structural
    techniques are not completely suitable to detect instances of such anti-pattern.
    The reason is that in order to identify Divergent Change anti-patterns it is necessary
    to analyze how the system evolves over time (i.e., coupling) to identify this
    anti-pattern [25]. In particular, using coupling information it is an attempt
    to exploit structural information (i.e., it is possible to build a Design Change
    Propagation Matrix (DCPP) pattern). The DCPP is an n × n matrix where the generic
    $A_{ij}$ is the probability that a design change on the artifact $i$ requires
    a change to the artifact $j$. Such probability is given by the degree [26], i.e.,
    an indicator of the number of dependencies between two artifacts. Once the matrix
    is built, a Divergent Change is detected if a column in the matrix contains high
    values for a particular artifact. In other words, high values on the columns correspond
    to a high number of artifacts related to the one analysis and so the probability
    to have a Divergent Change increase.


    However, by looking the definition, it is reasonable to think to detect this kind
    of anti-pattern using the historical information that a system can have (i.e.,
    change log). The conjecture is that classes affected by this anti-pattern present
