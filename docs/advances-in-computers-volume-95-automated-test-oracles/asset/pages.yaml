  md: 'Anti-Pattern Detection: Methods, Challenges, and Open Issues


    # 4. KEY INGREDIENTS FOR BUILDING AN ANTI-PATTERN DETECTION TOOL


    This section describes some of the challenges that need to be addressed when building
    a tool to detect anti-pattern in software systems. Specifically, there are two
    critical issues to deal with:


    +   Extracting information from source code components in order to identify symptoms
    of poor design choices. This is a critical issue because there are different sources
    of information that can be exploited (e.g., structural or semantic relationship)
    and in several cases the choice of the type of information to be exploited depends
    on the kind of anti-pattern to be detected.


    +   Define the algorithm to identify candidate anti-patterns. Each algorithm has
    strengths and weaknesses. On the basis of the anti-pattern under analysis, an
    algorithm ensuring a fair compromise of strengths and weaknesses must be chosen.


    In the following sections, we present some guidelines on how to deal with these
    two issues.


    # 4.1. Identifying and Extracting the Characteristics of Anti-Patterns


    The first step in the identification of a specific anti-pattern regards the definition
    of its characteristics. Such characteristics should help in discriminating between
    components that are affected by the anti-pattern and "clean" components. As said
    before, there are different sources of information that can be used to extract
    source code properties that characterize a specific anti-pattern. Most of the
    techniques used in the literature exploit structural information extracted by
    statically analyzing the source code to capture characteristics that could help
    in the identification of an anti-pattern, such as, the number of calls between
    two source entities, variable accesses, or inheritance relations. A second option
    is dynamic information, which takes into account call relationships between entities
    occurring during program execution. Finally, historical data (e.g., co-changes)
    may be exploited to identify anti-patterns that are intrinsically characterized
    by how source code changes over time. Thus, in the following, we discuss all these
    sources of information.


    # 4.1.1 Extraction of Structural Properties Using Code Analysis Techniques


    In this section, we discuss the sources of information capturing structural properties
    (e.g., structural coupling) between code components.'
  merge: -1
  pgno: 227
- img_proc: true
  md: '# 4.1.1.1 Method Calls


    The most obvious source of information that can be exploited to capture structural
    relationships between code components is the calls interaction. A measuring calling
    method interactions is the Call-based Dependence between Methods (CDM) [39]. CDM
    has values in [0, 1]; the higher the number of calls between two methods, the
    higher the CDM value and thus, the coupling between methods. This source of information
    can be useful for identifying anti-patterns at both method (e.g., Feature Envy)
    and class (e.g., Swiss Army Knife). Method calls have been exploited for the detection
    of many anti-patterns. In particular, different researchers have used not only
    to investigate the presence of Blob instances [11,14,29] but also to find instances
    of Feature Envy [17,18], Refused Bequest [24], Type Checking [27], Divergent Change
    [25], and Shot Surgery [25].


    The calls between different classes also represent a particularly useful property
    for the detection of anti-patterns. Indeed, classes having many interactions operate
    to implement the same (strongly related) responsibilities and thus, are highly
    coupled. This information is particularly important for detecting anti-patterns
    at causing harms to the modularization of Object-Oriented systems, e.g., Inappropriate
    Intimacy [2]. There are many metrics available in literature to measure the coupling
    between classes based on their calls. Examples are the Information-Flow-based
    Coupling (ICP) [40], the Message Passing Coupling (MPC) [41], and the Coupling
    Between Object Classes (CBO) [41].


    # 4.1.1.2 Shared Instance Variables


    The instance variables shared by two methods are an important source of information
    for detecting anti-pattern (e.g., Blob) inherent to the cohesion of a class. This
    source of information has been successfully used for the detection of Blob [13,39],
    Spaghetti Code [13], and Type Checking [27] instances. In fact, they also represent
    a form of communications between methods (performed through shared data). Thus,
    sharing instance variables are more coupled than methods sharing any data. A measure
    to capture this coupling between methods is the Structural Similarity between
    Methods (SSM) [42], used to compute the metric ClassCoh [42]. SSM has values in
    [0, 1]; the higher the number of instance variables the two methods share, the
    higher the SSM value and thus the coupling between methods. Another example of
    metric measuring the extent to which the methods of a class share instance is
    the LCOM [28].'
