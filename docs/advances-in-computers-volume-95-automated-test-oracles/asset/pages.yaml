    \ EXPTIME $\neq$ EXPSPACE. By Theorem 21 PSPACE $\\subseteq$ EXPSPACE.\n\nWe present\
    \ a natural problem that is NEXPSPACE-complete and not in PSPACE. The statement\
    \ is due to Meyer and Stockmeyer [63].\n\nIn textbooks, one sees expressions like\
    \ $a^{b^2}$. These are not formally regular expressions; however, meaning is clear\
    \ and they can be rewritten as such: $aaaaabb$. In the representation of matters.\
