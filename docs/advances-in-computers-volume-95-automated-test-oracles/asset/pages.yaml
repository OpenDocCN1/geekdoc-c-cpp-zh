    # Abstract


    Oracle methods have changed significantly over time, which has resulted in clear
    shifts in the research literature. Over the years, the testing techniques, strategies,
    and criteria utilized by researchers went through technical developments due to
    the improvement of technologies and programming languages. Software testing designers,'
