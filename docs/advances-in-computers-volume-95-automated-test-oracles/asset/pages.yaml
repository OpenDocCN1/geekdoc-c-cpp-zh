  md: '# 5. INFORMATION SOURCES AND TRANSLATIONS OF TEST ORACLES


    The primary factor that impacts the level of automation of test oracles is the
    information used to specify the expected behavior, and we refer to this as the
    primary source of classification.


    At first glance, the source of information for test oracles can be classified
