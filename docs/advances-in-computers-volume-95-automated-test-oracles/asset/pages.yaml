    # 5.2.4 Amalitano et al.: Dynamic Reverse Engineering of RIA and Mobile Applications


    Amalitano et al. in University of Naples Federico II (Naples, Italy) have been
    recently extremely active in publishing their research on dynamic reverse engineering
    of rich internet applications (RIAs) and mobile applications. Their approach for
    reverse engineering client-side behavior of RIAs [208] is based on dynamic analysis
    of the RIA execution traces and employing clustering techniques for solving the
    problem of state explosion of the generated FSM models. Developed RE-RIA tool
    creates instantiation of a Mozilla Firefox Browser inside its Java GUI and the
    approach is used to model AJAX-based Web applications [209].


    The approach is extended to use the generated models for testing RIAs [210] and
    use reduction techniques to ensure scalability. Execution traces used for the
    test generation can be obtained either from user sessions, automated crawling
    of the application or by combining approaches. Combining both manually and automatically
    execution traces increased the effectiveness of testing. [210] introduces tools
    developed for the process: an AJAX crawling tool CrawlRIA, a dynamic RIA analysis
    tool CreRIA, Test Case Generator and Test Reducer TestRIA, and DynaRIA [211–213],
    a tool for dynamic analysis and testing of RIAs. The approach can be used in agile
    processes [214], and CreRIA has been extended to support automatic generation
    of user documentation for Web 2.0 applications [215].


    Amalitano et al. [216] have presented a Web page classification technique and
    WPC-CA (Web Page Classifier) tool based on the deduction of classification rules
    that allow the reliable classification of the pages of a Web application. A reliable
    classification of Web pages can be useful for supporting various engineering activities,
    such as reengineering, analysis, and testing. They have proposed a classification
    framework that characterizes existing RIA testing techniques [217].


