  md: '# Anti-Pattern Detection: Methods, Challenges, and Open Issues


    the last decade, anti-patterns have been the subject of empirical studies aiming
    at empirically analyzing their impact on software maintainability. We now have
    empirical evidence that code-containing code smells or participating in anti-patterns
    is significantly more prone than "clean" code [4]. Also, code participating in
    anti-patterns has a higher fault-proneness than the rest of the system code [4,5].


    Other studies aimed at understanding the impact of anti-patterns on program comprehension
    [6] showed that the presence of an anti-pattern in the source code does not decrease
    the developers'' performance, while a combination of anti-patterns results in
    a significant decrease of their performance [6,7]. While the results of this study
    indicate that single anti-patterns are not harmful, they also reveal that anti-patterns
    are diffuse in software systems and very often code components are affected by
    more than one anti-pattern. In addition, we have empirical evidence that the number
    of anti-patterns in software increases over time and only in few cases they are
    removed through refactoring operations [8,9].


    All these findings suggest that code smells and anti-patterns need to be fully
    detected and monitored and, whenever, refactoring operations should be planned
    and performed to deal with them. Unfortunately, the identification and correction
    of design flaws in large and nontrivial software systems can be very challenging.
    These observations call for recommendation systems supporting the software engineer
    (i) identifying anti-patterns and (ii) designing and applying a refactoring solution
    to remove them.


    In this chapter, we will focus on the analysis of different techniques aimed at
    detecting anti-patterns in source code.² By analyzing these approaches, we will
    derive a set of guidelines for building and evaluating recommendation systems
    supporting the detection of anti-patterns. In addition, we will discuss some problems
    that are still open, to trace future research directions in the field.


    # 2. METHODS FOR THE DETECTION OF ANTI-PATTERNS


