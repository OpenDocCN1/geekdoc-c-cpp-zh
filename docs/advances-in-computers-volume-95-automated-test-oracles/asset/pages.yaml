    # 3.3.3 ML-Based Oracles


    ML is a set of computational methods that use collected data and is capable of
    making predictions. There are a variety of ML techniques applied as oracles, such
    as Supervised Learning Machines (SLA): (1) artificial neural networks (ANNs) [26–129],
    (2) support vector machines [130,131], and (3) info-fuzzy networks (IFNs) [79,132].


    These SLEAs share a characteristic: they use collected and labeled data to train
    a machine to predict new, unlabeled data. ANN, for example, can be trained with
    pairs of inputs and already known outputs (training set). The resulting machine
    may be seen as an approximated function of the SUT. If a new input is used in
    the trained ANN, it this input-output pair capable of predicting an approximated
    output, even if it is not part of the training set? Therefore, the ANN can be
    used as an oracle. If the same input is used in the ANN and the SUT, a procedure
    can both compare and identify if there are irregular discrepancies.


    A similar application of ML as oracles is the use of them as classifiers. In the
    same way, pairs of elements and the class or category in which they belong are
    used to train an ANN. At the end of the training step, the ANN may be capable
    of identifying in which category new elements belong. For instance, Aggarwal et
    al. [126] and Jin et al. [128] present a case study with oracles for triangle
    classification isosceles, scalene, equilateral, or not a triangle. The ANN receives
    two inputs: a triplet which represents three sides of a triangle and the category
    in which it fits. After the ANN is trained, it is capable of predicting in which
    category new triplets belong.


    Such oracle approach is appealing because of the ability to approximate functions.
    However, it has limitations to overcome. Input data may not be easily represented
    as characters and strings for ML. Also, deciding the structure of the network,
    such the number of layers and neurons,'
