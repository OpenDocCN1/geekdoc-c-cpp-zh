  md: '4. Fixed Parameter Tractable: In Section 9, we looked at the Vertex Cover problem.
    For general k is NP-complete. For fixed k it is not O(n^k) but instead just O(1.2738^k
    + kn). Many NP-complete problems are Fixed Parameter Tractable meaning that if
    you fix a parameter they can be solved fast.


    5. Streaming Algorithms: The input is a sequence of n numbers where n is large
    so you cannot store n in main memory. We model this by saying we can only pass
    over the sequence p times and use f(n) space where f(n) is less than n. If we
    want the most common element, we can do that with 2 passes and O(log n) space.
    Algorithms for these kinds of problems are randomized and approximate. They are
    called Streaming Algorithms


    # 24. SUMMARY


    In this chapter, we defined many complexity classes. The classes spanned a rather
    swath of complexities from O(1) space to various shades of undecidability. For
    each, we give examples of natural problems that are in them but likely (or surely)
    not in lower classes. Hence, we have been able to determine how many natural problems
    are.


    This classification is a good cut at getting to the real issue of how hard these
    problems are. But they are not the entire story since once a problem is discovered
    to be hard it still needs to be solved. What do you do? W.C. Fields said


    > If first you don''t succeed, give up.

    No use making a damn fool of yourself.


    We respectfully disagree. If a problem is hard all that means is finding a solution
    that gives the exact answer quickly in all cases is hard. It could be well that
    the problem you really want to solve, perhaps a subcase, perhaps an approximation,
    may still be doable. This is not a pipe dream—many NP-complete problems can be
    approximated quite well. Section 23 discusses this and other possible ways around
    hardness results.


    We speculate that theory and practice will come closer together as theorists define
    more realistic classes, and practitioners discover that the size of problems they
    are working is large enough so that asymptotic results really are useful.'
