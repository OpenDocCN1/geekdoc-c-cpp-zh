    # 2.4. Refused Bequest


    # 2.4.1 Definition


    In Object-Oriented development, one of the key features aiming at reducing the
    effort and cost in software maintenance is inheritance [2]. For example, if there
    is something wrong in the definition of an attribute inherited by some children
    classes, that attribute needs to be changed only in the parent of such classes.
    However, it is not uncommon that developers make improper use of the concept of
    inheritance, especially in the cases where other kind of relationships would be
    more correct. The Refused Bequest anti-pattern arises when a subclass does not
    support the interface of the superclass [2]. On one hand, this happens when a
    subclass overrides a lot of methods inherited by it, on the other hand, the relationship
    of inheritance can be wrong also if the subclass does not override the methods
    inherited from the parent, but never uses them or methods are never called by
    the clients of the subclass. In some cases, this anti-pattern simply means that
    the relationship of inheritance is wrong, namely the subclass is not a specialization
    of the parent.


    # 2.4.2 Detection Strategies


    A simple naive method to estimate the presence of Refused Bequest antipattern
    in a software system is by looking for classes having the following characteristics:
    (i) the class is in a hierarchy and (ii) the class overrides more than γ% of the
    methods defined by the parent. However, such a method does not take into account
    the semantics established by an “is-a” relationship between two classes of the
    system. For this reason, Ligu et al. [24] introduced the identification of Refused
    Bequest using a combination of static source code analysis and dynamic unit test
    execution. In particular, the approach identifies classes affected by this anti-pattern
    by looking at the classes that really “wants to support the interface of the superclass”
    [2]. If a class does not support the behavior of its parent, Refused Bequest is
    detected. In order to understand if a method of a superclass is actually called
    on subclass instances by other classes of the system, Ligu et al. [24] intentionally
    override these methods introducing an error in the new implementation (e.g., division
    by zero). If there are classes in the system invoking the method, then a failure'
