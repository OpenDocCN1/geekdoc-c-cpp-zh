  md: '# 52


    # Pekka Aho et al.


    Manual testing and the use of capture/replay (CR) tools have been the most popular
    GUI testing approaches in industry [15]. While CR tools are an easy and straightforward
    first step toward more effective use of testing resources, a large number of test
    cases have to be manually updated after changes in the GUI [16]. The next step,
    used by the latest CR tools, is to use GUI automation at a higher level of abstraction,
    describing test cases with action or key words using auxiliary libraries to test
    and execute the user actions and observe the produced outputs. Usually, this protects
    the test cases from breaking due to the smallest changes in the GUI, and sometimes
    the same test cases can be used for testing the software on different platforms
    and test environments by changing the auxiliary library.


    A number of research results have shown that model-based testing (MBT) reduces
    the maintenance costs compared to the CR tools [17]. Traditionally in MBT, an
    abstract test model is created manually based on the requirements of the system
    under test (SUT), and then an MBT tool is used to generate tests based on the
    model and execute the tests to verify if the SUT implements the requirements correctly
    [18]. A significant challenge in applying MBT on software systems is that designing
    the test models requires considerable amount of effort and expertise in formal
    modeling, even over iterative development processes or when the documentation
    of the system is not accurate or updated [12]. Modeling has been one of the most
    significant obstacles to MBT has not been taken into use by industry on a large
    scale [19]. It also requires consolidating the differences between the specification
    that is modeled and the implementation that is tested and providing mapping between
    the model and the implementation to be able to execute the derived test cases
    on a concrete system [12]. The manual effort in designing and maintaining the
    models negates a significant part of the increased efficiency gained from automated
    testing [16].


    When an existing system is being modeled, there are various model extraction techniques
    to automate the process of producing the models based on the implementation. The
    process of automatically creating models or other specifications based on existing
    design and implementation artifacts is also referred to as model extraction, reverse
    engineering, specification mining, or specification inference. In this chapter,
    these terms are used interchangeably unless otherwise specified. Especially GUI
    applications, including mobile and Web applications, have been a good domain for
    reverse engineering and specification mining approaches. Usually, the goal of
    reverse engineering is to analyze the software and represent it in another'
  merge: -1
  pgno: 55
- img_proc: true
  md: 'level of abstraction, and using the abstract form for software maintenance,
    migrating, testing, reengineering, reusing, deconstructing, purposes, or just
    to understand how the software works [20]. Our focus is on reverse engineering-models
    of GUI applications and using the models for analysis and testing purposes.


    Specification mining can be roughly divided into static, dynamic, and hybrid approaches
    that use a combination of static and dynamic analysis. In the static approach,
    the source code or other static representation of the system is analyzed without
    executing the system. In the dynamic approach, the system is executed and its
    external behavior is analyzed [12]. Static source code analysis is well suited
    for extracting information about the internal structure of the system and dependencies
    on structural elements [12] and already available in many software engineering
    tools [21]. Unfortunately the dynamic behavior of the GUI is difficult to extract
    with static reverse engineering, because the nature of object-oriented programs,
    such as object creation, deletion, garbage collection, and dynamic binding, make
    it very difficult to understand the behavior by just analyzing the source code
    [20]. Most of the modern GUI is developed using event-handler architecture allowing
    developers to build complex systems using loosely coupled pieces of code and the
    end users to perform tasks by inputting GUI events in various ways and execution
    order [22], and the GUI components of modern applications reachable only from
    a particular state or with some environment constraints [23], which makes it difficult
    to deduce the behavior from the source code without executing it.


    As the dynamic behavior of a GUI is difficult to extract with static source code
    analysis, dynamic reverse engineering techniques are more popular for automatically
    extracting GUI models, [12]. In dynamic approaches, the system is automatically
    executed and user actions are simulated with automated interactions, and the run-time
    behavior of the system is analyzed. Various algorithms are then applied to extract
    behavioral models of the GUI based on the collected observations. Dynamic reverse
    engineering does not require the source code of the system but it requires a way
    to programmatically observe, analyze, and interact with the GUI shown to the user.
    The reverse engineering tool has to be able to control and interact with the GUI
    application to monitor and model the behavior of dynamically changing GUIs, e.g.,
    when the visibility of a GUI component depends on the state of another component
    [16].


    Some reverse engineering approaches aim to fully automated creation of the models,
    while others aim to automate the first steps to create an initial'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'model to serve as a basis to start the manual modeling process. There are also
    semiautomated modeling techniques, performed mostly automatically but are either
    assisted manually during the reverse engineering process, or reviewed, corrected,
    and extended manually after generating the initial model [19]. Most techniques
    require human intervention and the efficiency of the technique depends on the
    degree of required manual effort [19]. Usually, some input from the user, e.g.,
    a test engineer, is required during the dynamic reverse engineering process to
    generate models covering all the states of the GUI application, fully automated
    generation of meaningful input for all elements of the SUT is extremely challenging
    [16]. For example, it is very improbable to find matching username and password
    with random generation algorithms if the user has no predefined set of test data
    [16]. In dynamic reverse engineering, the input generator tool would view the
    GUI application as a black box without knowledge of the constraints of inputs
    and links. Therefore, to reach each state of the GUI, valid value combinations
    into the input fields of the GUI have to be provided by the user, and an easy
    and practical way for the user to provide the values is required [24]. Another
    solution for the challenge of generating meaningful input could be combining static
    source code analysis with dynamic reverse engineering, i.e., using a hybrid reverse
    engineering approach.


    As the extracted models are based on the observed behavior of the implemented
    system, instead of the requirement specifications or expected behavior, it is
    challenging to use them for conformance testing or automatically generating meaningful
    test orders. Conformance testing requires a link to the requirements before using
    the extracted models for test case or test generation. In most of the GUI reverse
    engineering approaches for testing, the test oracle is based on the observed behavior
    of an earlier version of the GUI application. Using this kind of test oracles,
    changes, and inconsistent behavior of the GUI can be detected and the models can
    be used for automated regression testing, but conformance testing, i.e., validation
    and verification against the specifications is problematic [19]. Nevertheless,
    the extracted models can be utilized for automatically testing the application
    with a good coverage [19].


    In this chapter, we survey automated modeling and testing techniques, and present
    the current state-of-the-art on reverse engineering models of GUI applications
    and using the extracted models for automated testing and analysis. We conclude
    by presenting the trends we observed during this study and discussing the future
    directions of the research.'
  merge: -1
