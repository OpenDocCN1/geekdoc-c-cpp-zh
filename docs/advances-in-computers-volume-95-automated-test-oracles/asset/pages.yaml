  md: '# 5.1. Challenges in Using Extracted Models to Automate GUI Testing


    The challenges in MBGT in general have been presented in Section 3.4.2 and challenges
    in using reverse engineered models for testing in Section 4.4.4. However, using
    reverse engineered GUI models in testing brings a few additional challenges, the
    most important being automated creation of test cases.


    Also, using the extracted GUI models for testing increases the challenge with
    state space explosion, because ignoring too many properties to reduce the amount
    of states may lead to ambiguous results, i.e., a state of some action or event
    is not well defined or unique. However, if we differentiate many different property
    values as different states, the number of states is too large to be computationally
    feasible in test case [1].


    # 5.1.1 Automated Test Oracles for GUI Testing


    In MBGT, the oracle information used to determine whether a test case passes or
    fails, consists of a set of observed properties of all the windows and widgets
    of the GUI [70]. Test oracles be divided into two parts: oracle information that
    represents expected output, and an oracle procedure that compares the oracle information
    with the actual output [140]. By varying the level of detail of oracle information
    and changing the oracle procedure, a test designer can create different types
    of test oracles, depending on the goals of the testing process used [141]. The
    different types of test oracles have a significant effect on test effectiveness
    and cost of testing [141].


    Xie and Menon [116] have presented a comparison between different types of automated
    test oracles for GUI testing.


    The oracle procedure compares the actual output from the SUT to a reasonably correct
    expected output [116]. Oracle procedure''s frequency of comparison significantly
    affects test effectiveness and cost of testing [141]. In GUI testing, the oracle
    procedure should compare the observed properties to their expected values after
    each step (event or interaction) of the test sequence during the execution of
    GUI cases [70]. Otherwise it may become difficult to identify the actual cause
    of the error [142]. An incorrect GUI state may lead to an unexpected screen, making
    further execution of the test case useless as the next steps (events) of the test
    sequence'
