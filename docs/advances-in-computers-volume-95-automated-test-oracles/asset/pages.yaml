    # 9.5 So You Think You''ve Settled P versus NP


    The following is Lance Fortune''s blog post from January 14, 2009, see blog.computationalcomplexity.org/2009/01/so-you-think-you-settled-p-vs-np.html


    which is titled


    So You Think You''ve Settled P versus NP


    +   1. You are wrong. Figure it out. Sometimes you can still salvage somethinginteresting
    out of your flawed proof.


    +   2. You believe your proof is correct. Your belief is incorrect. Go back to
    step 1.


    +   3. Are you making any assumptions or shortcuts, even seemingly small and obvious
    ones? Are you using words “clearly,” “obviously,” “easy to see,” “should,” “must,”
    or “probably?” You are claiming to settle the more important question in all of
    mathematics. You don''t get to make assumptions. Go back to step 1.


    +   4. Do you really understand the P versus NP problem? You need to find a language
    L in NP such that for every k and every machine M in time nᵏ (n = input length),
    M fails to properly compute L. L is a set of strings. Nothing else. L cannot depend
    on M or k. M can be any process that processes strings of bits. M may act differently
    than one would expect the way you defined. Go back to step 1.


    +   5. You submit your paper to an on-line archive. Maybe people tell you what
    is missing or wrong in your paper. This should cause you to step 1. But instead
    you make a few meaningless changes to your paper and repost.


    +   6. Eventually you ignore your paper. You wonder why you aren’t getting fame
    and fortune.


    +   7. You submit your paper to a journal.


    +   8. The paper is rejected. If you are smart you would go back to step 1. But
    if you were smart you would never have gotten to step 7.


    +   9. You complain to the editor that the editor doesn''t understand the proof
    of that it is easily fixed. You are shocked a respectable editor would treat your
    paper this way.'
