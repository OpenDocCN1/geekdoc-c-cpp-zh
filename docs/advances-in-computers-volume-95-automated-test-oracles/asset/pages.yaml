    # 6. CONCLUSION AND DISCUSSION


    During the past 5 years, automated extraction of GUI models has become a popular
    research topic. Software industry is obviously interested in effective ways to
    automate GUI testing, but another important reason for increasing popularity are
    the GUI frameworks that provide an easy access to observe and interact with the
    GUI, e.g., Jemmy [14], Microsoft Automation [13] and Robotium [138]. These GUI
    frameworks have solved many technical issues in model extraction, but many challenges
    remain and new ones emerge as the research goes on. Also, there are practical
    issues hindering the large scale industrial adoption of the tools and approaches,
    such as usability and scalability of the tools.'
  merge: -1
  pgno: 99
- img_proc: true
  md: '# 6.1. Trends


    Based on this state-of-the-art study on automated extraction of GUI models for
    testing, we observed the following trends: (1) the use of hybrid methods for model
    extraction is increasing, (2) the first long industrial experiences have been
    published with promising results, (3) new ways of using extracted GUI models for
    testing, and (4) the use of virtual machines for model extraction will increase.


    In their latest work, many researchers of this research area combine static and
    dynamic analysis to extract better and more detailed models [136] or to generate
    better tests from the extracted models [92]. Dynamic analysis has been the prominent
    method for GUI model extraction, but static methods have been revisited and combined
    to dynamic methods as the extraction techniques have evolved and more detailed
    analysis is required.


    Although the industrial adoption of extracted models for automated GUI testing
    is still lacking, the first long industrial evaluations with large commercial
    applications have been published and the results were promising [227]. As the
    approaches and tools evolve and the usability and scalability improvements, the
    large scale industrial adoption will follow. Many of the tools mentioned in this
    study have been published as opensource software, and hopefully the increasing
    use will speed up the development.


    Most approaches use the extracted GUI models for generating test cases with test
    oracles based on the behavior of an earlier version of the GUI application. This
    way it is possible to detect changes in the behavior. A recent study [227] uses
    model comparison instead of test case for regression testing. The basic idea is
    to extract a model of each new version and another new way of utilizing the extracted
    GUI models is providing automated tool support to speed up manual GUI testing
    activities [227].


    Virtual machines can be used to minimize the nondeterministic behavior during
    model extraction and GUI testing, e.g., external changes and events in the test
    environment, as operating system notifying the user about new software updates
    available [227]. Restoring a clean snapshot of a virtual machine time the GUI
    is restarted during model extraction, as in [227], removes also unintentional
    context information, such as event history or long event sequences that affect
    the state of the GUI is not captured into the model. We expect that the use of
    virtual machines for model extraction and GUI testing will increase.'
  merge: -1
  pgno: 100
- img_proc: true
  md: '# 6.2. Future


    As the computers get faster and better, keeping the model extraction fast and
    extracted models small will be less problematic. Until then, we have to keep finding
    the balance between not covering all possible interactions of the GUI to keep
    the extraction fast but still extracting models with good enough coverage of the
    GUI, and abstracting the unnecessary details to keep the size of the extracted
    models small enough to be computationally feasible but still capture enough to
    unambiguously determine the state of the GUI and maintain the usefulness of the
    extracted models.


    Although some approaches aim for a fully automated GUI testing process, in practice
    manual effort is always required. The question is if the optimal place for manual
    effort is providing meaningful input, validating the correctness of the extracted
    models, guiding the test generation to get better tests or less false positives,
    linking the extracted models to the requirements of the modeled system, or elsewhere.
    Most of these steps can be updated by manual effort either before or after the
    automated step.


