  md: '# ABOUT THE AUTHORS


    Pekka Aho works as a Research Scientist at the VTT Technical Research Centre of
    Finland, Oulu. He received his master’s degree in computer engineering from University
    ofOulu, Finland in 2009 and is currently finishing his Ph.D. degree under the
    supervision of Dr.Juha Rönen. His research interests include software test automation
    and model-based testing with current focus on automatically extracting models
    of graphical user interfaces for testing. Before his academic career, he has worked
    as Software Designer and Project Manager in the industry.


    Teemu Kanstrén is a Senior Researcher at the VTT Technical Research Centre of
    Finland, Oulu, and at the time of writing this chapter, he was a Visiting Post-Doctoral
    Fellow at University of Toronto. His work involves research and development in
    software engineering with the aim to improve the state of the art, to produce
    practically useful solutions, and help industry partners adopt them. His specific
    topics of interest include advanced test automation solutions such as model-based
    testing, and he is the main author of the open source model-based testing tool
    OSMO Tester. He got his Ph.D. degree on test automation and model-based testing
    at the University of Oulu, Finland.


    Dr. Tomi Räty received his Ph.D. degree in information processing science from
    the University of Oulu, Finland. He is currently a Principal Research Scientist
    at the VTT Technical Research Centre of Finland, Oulu. His current research interests
    include data analysis, machine-learning technologies, model-based testing, and
    software platforms. He is the author or co-author of more than 30 papers published
    in various conferences and he has served as a Reviewer for multiple journals and
    at numerous conferences.


    Dr. Juha Rönen is Professor of Embedded Systems in the Department of Computer
    Science and Engineering at the University of Oulu, Finland. He is a principal
    investigator of the Biometrics and Intelligent Systems Group (BISG). In 1985,
    he received Asa/Fullbright scholarship. From 1985 to 1986, he was a visiting research
    scientist in the Center for Robotic Research at the University of Cincinnati.From1986
    to 1989, he held a Young Researcher Position in the Finnish Academy. In 2000,
    he was nominated as Fellow of SPIE. He has two patents and has published more
    than 300 papers in the areas of computer vision, robotics, intelligent signal
    analysis, and software security.'
