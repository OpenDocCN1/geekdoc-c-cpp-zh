    # 3.6. Test Suite Reduction and Prioritization for GUI Testing


    The increasing use and effectiveness of test automation tools has introduced new
    challenges for software testing. It is fairly easy to generate so many test cases
    that it takes practically long time to execute them, even with fully automated
    test environment. The modern agile development processes have often short iterations,
    increasing the pressure for short test cycles. Therefore, it is not enough to
    create an effective test suite anymore. It has to be also efficient, not taking
    much time or other resources for test execution. The main approaches for making
    the test suites more effective are test suite reduction (test suite minimization)
    and test suite prioritization.


    The goal of test suite reduction is to reduce the time and other resources required
    for test execution and maintenance, usually by reducing the size or number of
    test cases, while trying to maintain the effectiveness of the test suite [72].
    Most approaches are based on eliminating test cases that are redundant relative
    to some coverage criterion [73]. The general approach is to instrument a set of
    program entities to record information about their coverage, execute a test suite
    and reduce it based on the collected information. As different techniques monitor
    different program entities or behaviors, usually selecting different subsets of
    the test suite, they have different costs, application environments, and tradeoffs
    between reduced size and fault detection effectiveness [72].


    In GUI testing, test case reduction does not mean only reducing the number of
    test cases, but also the length of individual test cases [34]. Xie and Memon [34]
    defined minimal-effective event-context (MEEC) of an event that has detected a
    fault in a test case as the shortest sequence of preceding events or interactions
    required to detect the fault.'
