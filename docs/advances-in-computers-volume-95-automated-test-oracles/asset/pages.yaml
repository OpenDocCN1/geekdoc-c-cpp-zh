  md: '# Automated Test Oracles: A Survey


    A recent approach called $\mu$Test uses mutation analysis to generate JUnit tests
    containing assertions [19,61]. $\mu$Test runs each case on the original program
    and records the execution traces. The traces are analyzed to identify differences
    between executions of the original program and its mutants, and the technique
    generates an assertion for each identified difference [19].


    Staats et al. performed a similar technique to generate oracles using mutation
    analysis [20]. The technique executes the original program and its mutants generates
    trace data that contain the value of variable after every step of the execution.
    If the value of a variable in the execution of the original program differs from
    that in the execution of a mutant, the mutant is said to be killed by that variable.
    The variables are ranked according to the number of killed mutants. The variables
    that kill are more likely to be useful for creating assertions. In both [19] and
    [20], some assertions (or variables) have equal capability of killing mutants,
    and both techniques use an approximate algorithm to resolve the set covering problem,
    in order to reduce the final sets of assertions (or variables).


    Daniel et al. focused on repairing test cases and assertions using both static
    and dynamic analysis [17]. To repair a broken test case, ReAssert instruments
    the test classes and re-executes the test case, recording the arguments of the
    failing assertions and the stack traces of the failure. By traversing the recorded
    stack traces, it finds the code to repair and repairs the code by analyzing the
    code structure and the recorded argument values.


