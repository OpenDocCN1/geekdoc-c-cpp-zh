    # 2.10.2 Detection Strategies


    A class affected by the Swiss Army Knife is a class that provides an answer to
    a large range of needs. Generally, this anti-pattern arises when a class has many
    methods with high complexity and the class has a high number of interfaces. For
    example, a utility class exposing high complexity and addressing many services
    is a good candidate to be a Swiss Army Knife. The definition of this anti-pattern
    could seem very similar to the one for the Blob. However, there is a slight difference
    between the two anti-patterns: the Blob is a class that monopolizes processing
    and data of the system, having a “selfish behavior” because it works for itself,
    a Swiss Army Knife is a class that provides services to other classes.


    The characteristics of this anti-pattern suggest structural information can be
    useful for its detection. In particular, a mix of software complexity metrics
    and semantic checks in order to identify the different services provided by the
    class could be used for the detection. Once again, DECOR is able to detect this
    anti-pattern through a rule card [13]. In the case of Swiss Army Knife, the rule
    card characterizes the anti-pattern on the Number of Inter metric metric, which
    is able to identify the number of services provided by a class. If the metric
    exceeds a given threshold, a Swiss Army Knife is detected.


