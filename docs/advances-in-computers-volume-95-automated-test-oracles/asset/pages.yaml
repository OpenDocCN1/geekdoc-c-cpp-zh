  md: '# 4. THE TEST ORACLE PROCESS


    Despite the great variety of test oracles, we can identify a common process that
    consists of few main steps that we can use to characterize and classify the different
    kinds of oracles: (1) identifying the source of information for deriving the oracle,
    (2) recognizing the program behavior to be checked, (3) translating the source
    of information and the program behavior into forms that can be checked against
    each other, and (4) executing the oracle.


    Identifying the source of information amounts to identifying the expected program
    behavior, which can be expressed in many forms. Ultimately, oracles should check
    that the behavior of the program corresponds to the expectations of the end users.
    The source of information can be either a human being who knows about the needs
    addressed by the program or some artifact, typically some form of specifications.
    Although the ultimate source of information is always the user, referring directly
    to human beings to derive oracles can be expensive and difficult. Many oracles
    refer to other sources of information like requirement specifications, design
    models, API contracts, and program code. Figure 1.4 the main sources of information
    used by test oracle.


    Programs present different elements that can be checked and that span from their
    results to intermediate states, some properties, their traces, etc. Having identified
    the source of information, the oracles should recognize the program behavior to
    be checked. This choice is mainly dependent on the source of information, which
    determines the aspects of the program


    | State-based specifications |

    | Transition-based specifications |

    | Specification based | History-based specifications |

    | Algebraic specifications |

    | Values from other versions |

    | Code based | Results of program analysis |

    | Machine learning models |

    | Metamorphic relations |


    **Figure 1.4** A summary of the information sources for test oracles.'
