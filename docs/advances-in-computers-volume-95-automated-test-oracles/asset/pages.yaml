  md: '# 3. RELATIONS BETWEEN CLASSES


    Throughout this section think of $T(n)$ and $S(n)$ as increasing. The following
    theorem is trivial.


    +   **Theorem 5.17** Let $T(n)$ and $S(n)$ be computable functions.

    1. DTIME($T(n)$) $\subseteq$ NTIME($T(n)$).

    2. DSPACE($S(n)$) $\subseteq$ NSPACE($S(n)$).

    3. DTIME($T(n)$) $\subseteq$ DSPACE($T(n)$).

    4. NTIME($T(n)$) $\subseteq$ NSPACE($T(n)$).


    The following theorem is easy but not trivial.


    +   **Theorem 5.18** Let $T(n)$ and $S(n)$ be computable functions.

    1. NTIME($T(n)$) $\subseteq$ DTIME($2^{O(T(n))}$). (Just simulate all possible
    paths.)

    2. NTIME($T(n)$) $\subseteq$ DSPACE($O(T(n))$). (Just simulate all possible paths—keep
    a counter for which you are simulating.)


    The following theorems have somewhat clever proofs.


    +   **Theorem 5.19** Let $S(n)$ be a computable functions.

    1. NSPACE($S(n)$) $\subseteq$ DTIME($O(2^{S(n)})$). This was proven by Savitch
    [4] and is in textbooks on complexity theory.

    2. NSPACE($S(n)$) $\subseteq$ DTIME($2^{S(n)}$). This seems to be folklore.


    They are by diagonalization. Hence, the sets produced are not natural. Even so,
    the existence of such sets will allow us to show natural sets that are in one
    complexity class and not in a lower one.


    **Theorem 5.20** For all $T(n)$, there is a set $A \in$ DTIME($T(n) \log T(n)$)
    — DTIME($T(n)$). The $T(n)$ comes from somewhere in simulating a $k$-tape Turing
    Machine with a 2-tape Turing Machine. This is The Time Hierarchy Theorem and is
    due to Hartmanis and Stearns [3].


    **Theorem 5.21** Let $S_1$ and $S_2$ be computable functions. Assume $\lim_{n\to\infty}
    \frac{S_1(n)}{S_2(n)} = \infty$. Then there exists a set $A \in$ DSPACE($S_1(n)$)
    — DSPACE($S_2(n)$). Hence DSPACE($S_2(n)$) $\subseteq$ DSPACE($S_1(n)$). This
    is The Space Hierarchy Theorem and seems to be folklore.


    # 4. DSPACE(1)=REGULAR LANGUAGES


    There are many different definitions of regular languages that are all equivalent
    to each other. We present them in the next definition.'
