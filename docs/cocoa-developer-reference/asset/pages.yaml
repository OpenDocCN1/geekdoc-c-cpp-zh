- pgno: 326
  md: "```\nDataClass *anInstance = [[DataClass alloc] init];\n//Prepare it for archiving\
    \ by copying the form data to it\nanInstance.firstName = [[theForm cellAtIndex:0]\
    \ stringValue];\nanInstance.secondName = [[theForm cellAtIndex:1] stringValue];\n\
    anInstance.theAge = [[theForm cellAtIndex:2] intValue];\nanInstance.theNotes =\
    \ theText.string;\n//Run the archiver\nNSMutableData *saveData = [[NSMutableData\
    \ alloc] init];\nNSKeyedArchiver *archiver =\n[[NSKeyedArchiver alloc]\ninitForWritingWithMutableData:saveData];\n\
    [archiver encodeObject: anInstance forKey:@\"SaveState\"];\n[archiver finishEncoding];\n\
    if (![saveData writeToFile:savePath atomically:YES])\n NSLog(@\"Save error\");\n\
    }\n- (IBAction) loadRecord: (id) sender {\n//Load a blob of data from the saved\
    \ file\nNSData *restoreData =\n[[NSData alloc] initWithContentsOfFile:savePath];\n\
    //Initialize an unarchiver with the loaded data\nNSKeyedUnarchiver *unarchiver\
    \ =\n[[NSKeyedUnarchiver alloc]\ninitForReadingWithData:restoreData];\n//Create\
    \ a new data object instance\nDataClass *anInstance = [[DataClass alloc] init];\n\
    //Initialize the properties with saved data\nanInstance = [unarchiver decodeObjectForKey:@\"\
    SaveState\"];\n//Copy the values back to the form\n[[theForm cellAtIndex:0]\n\
    \ setStringValue:anInstance.firstName];\n[[theForm cellAtIndex:1]\n setStringValue:anInstance.secondName];\n\
    [[theForm cellAtIndex:2]\n setStringValue: anInstance.theAge];\n[NSString stringWithFormat:\
    \ @\"%@\",anInstance.theAge]];\ntheText.string = anInstance.theNotes;\n}\n@end\n\
    ```\n\nKey features of the code include:\n\n+   - **The file path is a static\
    \ path to a single file in the Documents directory.**\n+   - **The saveRecord:\
    \ method copies information from the form to the data record before saving it.**\
    \ In another application, data might be loaded into a record in some other way,\
    \ or generated automatically. The details aren’t important, as long as the data\
    \ object holds valid values before it’s archived.\n+   - **The NSForm object is\
    \ an array of text fields.** The contents of each cell in the list are accessed\
    \ by index."
