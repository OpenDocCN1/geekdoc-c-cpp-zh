  md: '# Using Key-Value Coding


    Like selectors, Key-Value Coding (KVC) introduces direction into Objective-C.
    But KVC is a very different and unrelated technology, with very different applications.


    KVC makes it possible to access properties indirectly, using their name strings.


    ```

    aReturn = anObject.aProperty;                 //Direct access

    aReturn = [anObject valueForKey: @"aProperty"]; //KVC access

    ```


    KVC looks simple in theory, but it can be tricky in practice. Some of the issues
    include:


    +   - **Values must be “objectified.”** The technology could more accurately be
    called Key-Object Coding, because, with a few exceptions, values must be wrapped
    inside objects.

    +   - **KVC isn’t usually used for standard property access.** It’s easier to
    use standard setters, getters, and `@synthesize`.

    +   - **KVC is widely used to initialize and return groups of values and to access
    the values in data collection objects.** You must master it to use Cocoa effectively.

    +   - **Cocoa’s keypath management can seem erratic.** You can use `object.prop-erty.subproperty`
    syntax to define a keypath. But not all classes support keypath access, and classes
    that do support it don’t always implement it consistently. This particularly applies
    to mutable data collections.

    +   - **KVC makes it harder to trap errors.** If you use string literals as keys,
    the compiler can’t check them. You can solve this problem by defining the key
    strings as constants in a header file and using them throughout your code.


    # “Objectifying” values


    Consider this simple example of KVC, which reads and sets some of the values of
    `NSWindow`. This code looks like a reasonable attempt to set the `hasShadow` property.


    ```

    [window setValue: NO forKey: @"hasShadow"];

    ```


    But it doesn’t work, because `setValue:` expects an object, not a BOOL. The correct
    code is:


    ```

    [window setValue: [NSNumber numberWithBool: NO]

    forKey: @"hasShadow"];

    ```


    This demonstrates how values must be objectified, adding an extra layer of complexity
    to KVC. Figure 9.10 illustrates this.'
  merge: -1
  img_proc: true
- pgno: 244
  md: "# Figure 9.10\n\nConverting numerical types into NSNumber objects, and back\
    \ again. You can’t use KVC on numerical types without “objectifying” them.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_244_0.png)\n\n**CAUTION**\n\nIf there’s\
    \ a `set...` method, convert the first character after `set` to lowercase. For\
    \ example, `NSWindow` has a `setHasShadow` method. The corresponding key is `hasShadow`.\n\
    \n# Using NSNumber\n\nStrings are already objectified with the `@` character.\
    \ To objectify numerical values, wrap them in an instance of `NSNumber`. All numerical\
    \ types, including `int`, `float`, `BOOL`, and others, must be wrapped in a similar\
    \ way. For the full list of supported types, see the NSNumber class reference.\n\
    \nFor example, use this code to set a float:\n\n```\n[window setValue:\n    [NSNumber\
    \ numberWithFloat: 0.75]\n    forKey: @\"alphaValue\"];\n```\n\nNSNumber supports\
    \ named <type>Value methods that translate an NSNumber back into its equivalent\
    \ simple type. Equivalent code to read a value looks like this:\n\n```\nBOOL returnFlag\
    \ =\n    [[window valueForKey: @\"hasShadow\"] boolValue];\nfloat aFloat =\n \
    \   [[window valueForKey: @\"alphaValue\"] floatValue];\netc...\n```\n\n**TIP**\n\
    \nWhen creating new keys, it’s useful to include a type definition in the key\
    \ name as a reminder or “code tool tip.”\n\n```\n@\"something\"     //Bad\n@\"\
    somethingBOOL\" //Good\n```"
