- pgno: 321
  md: 'A typical application may use tens or hundreds of data collection objects in
    its model. It would be inefficient to create a separate file for each one. Fortunately,
    Cocoa includes a “collection of collections” class that can create a single data
    buffer from a group of collections, save it to disk as a single file, and retrieve
    the original collection data when it’s reloaded. The class is called `NSCoder`.


    # ## Using NSCoder and NSData


    `NSData` is Cocoa’s simplest data collection object. It’s a wrapper for an arbitrary
    blob of binary data. `NSData` doesn’t care what the data means, or how it’s organized.
    It doesn’t support keys, indexing, sets, dictionaries, or other access methods.
    It simply treats the data as a contiguous byte buffer.


    `NSMutableData` adds byte-level editing. You can change the length of the buffer,
    append more bytes or data from another `NSData` object, and replace a range of
    bytes in the buffer.


    `NSData` is sometimes used for generic storage in an application. More typically,
    it’s used as a file or data transfer buffer. Chapter 10 has an example of an asynchronous
    Web download that appends incoming data to a buffer as it’s downloaded. In the
    following section, `NSData` is paired with `NSCoder` to create a file buffer for
    application data.


    # ## Introducing archiving and coding


    Most applications save documents and data into a single file. Cocoa’s `NSCoder`
    class merges an object’s property values into a single `NSData` object. The data
    can then be saved to disk as a single file. `NSCoder` supports a decoding method
    that reverses the process, unpacking the merged data and copying it back to an
    object’s properties.


    There are two components to an `NSCoder` implementation. First, every class that
    supports archiving must implement two methods:


    +   - `encodeWithCoder:` defines how the class converts its properties into blocks
    of binary that can be added to a file buffer.

    +   - `initWithCoder:` defines how binary is converted back into property values.


    The conversion is managed by two methods called `encode:` and `decode:`. These
    methods are run on each property in turn within `encodeWithCoder:` and `decodeWithCoder:`:


    +   - `encode:` generates a block of binary for a single property and links it
    to a key string.

    +   - `decode:` searches for a key string and converts the associated binary back
    into an object or value.


    Second, the class responsible for saving and loading data uses an instance of
    `NSKeyedArchiver` to manage the conversion of object properties to an `NSData`
    block, and back again.


    `NSKeyedArchiver` runs the `encodeWithCoder:` and `initWithCoder:` methods for
    you. You never need to call them directly. You can simply tell `NSKeyedArchiver`
    that you want to convert an object into binary, or convert a file of binary back
    into an object, passing an `NSData` object as a parameter. The conversion is automatic.'
