  md: "# ## Binding incompatible objects\n\nThe nib for a slightly modified version\
    \ of the same project is shown in Figure 13.7. A text field has been added and\
    \ bound to the `sliderCount` property, as before.\n\n**Figure 13.7**\n\nAn extended\
