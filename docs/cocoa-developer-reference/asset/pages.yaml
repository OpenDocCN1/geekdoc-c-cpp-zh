    # ### Combining Quartz, Core Graphics, and Cocoa graphics


    The Cocoa graphics system is a wrapper for an underlying C-based framework called
    Quartz 2D. The functions and data structures used in Cocoa have Quartz equivalents,
    prefixed with CG instead of NS. Operationally, the frameworks are recognizably
    similar. Quartz uses paths, colors, points, gradients, and rects in almost identical
    ways, with the difference being that Quartz features are accessed via function
    calls rather than methods. Quartz provides lower-level support for graphics, and
    also makes it possible to draw images off-screen and to repeat them as textures.
    It may also be significantly faster than Cocoa drawing code, although this can
    be very application dependent.'
  merge: -1
