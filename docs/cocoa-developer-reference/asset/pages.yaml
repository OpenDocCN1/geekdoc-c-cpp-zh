- pgno: 515
  md: '# Introducing the iPhone,

    iPod touch, and iPad


    Apple’s mobile devices have created a popular, huge, and lucrative market for
    content and application developers. The three different iOS devices offer a core
    set of frameworks and classes for all mobile devices. All devices offer a different
    mix of hardware features, and there are further minor differences between different
    models.


    The iPod touch is primarily a music and video content platform, but it can also
    run applications and is a popular choice for games. It is lighter and cheaper
    than an iPhone and can be bought and used without a contract. It remains popular
    with buyers and developers. Approximately 90 percent of all apps run on both the
    iPod touch and the iPhone.


    The iPhone adds location sensing, a camera, and cellular voice and data. Unless
    an app uses these extra hardware features, iPod touch and iPhone apps are literally
    identical. Code can be compiled for a single target and runs on both platforms
    without changes.


    There are minor but significant differences between the different models in the
    iPod touch and iPhone ranges. At the time of writing, the entry-level 8GB iPod
    touch is equivalent in power and performance to an iPhone 3G. The 16GB and 32GB
    models are equivalent to the iPhone 3GS and include a faster processor and slightly
    more advanced graphics acceleration. The performance differences are obvious in
    games and processor-intensive music and media apps. They are almost invisible
    in similar apps. There is as yet no direct iPod equivalent of the iPhone 4.


    The iPad, shown in Figure 19.2, was added to the range at the beginning of 2010.
    It has been criticized as a giant iPod touch, but the faster processor, larger
    screen, and extended operating system make it a distinct new product. On the iPhone
    and iPod touch, you develop user interfaces using the *UIKit framework* — a collection
    of fixed prewritten classes that can be added to views. On the iPad, UIKit has
    been extended with new UI classes that can improve the user experience on the
    larger screen. Some of the iPad UI features can be customized and extended to
    create more complex user experiences; for example, you can extend the standard
    pop-up keyboard with custom symbols and options.


    For backward compatibility, the iPad includes an emulation window that runs existing
    iPhone apps without changes. It includes a 1.5X zoom option that can expand an
    app to fill the iPad’s screen. This is a cosmetic effect. It does not change the
    original native resolution or make it possible for the app to use any of the OS
    extensions available on the iPad.


    Apps can be *universal*, running the same code on both platforms with dual nib
    files. However, because of the physical differences between the iPhone and iPad,
    the different UI options, and the different markets and design goals, users often
    prefer distinct apps that capitalize on the strengths of each platform. It’s possible
    to convert an iPhone project to an iPad project in Xcode with a couple of mouse
    clicks, using the original code as the foundation for a more complex app with
    an expanded UI and extra features.'
  merge: -1
  img_proc: true
- pgno: 516
  md: "Figure 19.2\n\nThe iPad introducing itself in the Safari browser\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_516_0.png)\n\
    \n**TIP**  \niOS applications on all platforms typically have little in common\
    \ with OS X applications and are unlikely to share code. The most successful iPhone\
    \ and iPad apps are developed from scratch to satisfy new user needs, creating\
    \ experiences that highlight the strengths and unique features of these smaller\
    \ platforms, while downplaying their weaknesses. If you are moving to iOS from\
    \ OS X, think small, clever, and beautiful.\n\n# Comparing iOS and OS X applications\n\
    \niPhone apps are written in Objective-C and use the familiar Cocoa framework\
    \ model. However, there are significant differences between apps for each platform.\n\
    \n+   - **iOS apps are smaller and simpler than OS X applications.** They are\
    \ more self-contained, with limited access to external data.\n+   - **User interaction\
    \ is managed through simpler, leaner views built from the UIKit framework.** User\
    \ interfaces are smaller and less complex."
  merge: -1
  img_proc: true
- pgno: 517
  md: '+   - **Many frameworks, features, and data controllers in OS X are not available
    in iOS.**

    +     For example, there is no way to create bindings in Interface Builder (IB).
    Core Data remains available, but the iOS environment is not ideal for huge volumes
    of data or complex databases. Custom graphics are created with the Quartz 2D framework.
    Cocoa’s graphics classes are not available.


    +   - **Support for extra hardware features — including the multi-touch interface
    and sensing of tilt, shake, and rotation — has been added to create a more tactile
    and intuitive experience.**


    Because of the differences, iOS can feel constrained. However, the limitations
    make it easier to concentrate on creating a strong and tightly focused user experience.
    A typical app is not overloaded with features but does one or two simple things
    with style. Apps should be as intuitive as possible. Help and instructions should
    be unnecessary or minimized. Apps that use clever or innovative software technologies
    are often popular and are more likely to be successful.


    In spite of the limitations, iOS is not a crippled version of OS X. It is more
    useful to think of it as a spin-off, designed to create a different experience
    for users in a different computing context. For example, apps with location features,
    illustrated in Figure 19.3, can give users information related to their surroundings.
    This can include information about shops and local transport, routes to other
    locations, or new kinds of games.


    iOS includes some new features that are not — yet — standard on desktop and laptop
    computers, including:


    +   - **Location sensing.** All devices include a framework called Core Location
    that returns position updates. The iPhone 3G, 3GS, and 4 and the iPad include
    a GPS (Global Positioning System) receiver that can provide very accurate position
    information. Other devices use a combination of cellular triangulation and WiFi
    transmitter tagging to report much less accurate position fixes. Location data
    can be used to offer users information about their surroundings, with optional
    enhanced reality features. The iPhone 4 and 3GS and the iPad also include a magnetic
    compass.


    +   - **Multi-touch screen control.** All devices support a multi-touch screen
    that can track at least five fingers simultaneously. This allows gestural control,
    as described next, but also makes it possible for apps to link features to other
    kinds of touch tracking; for example, three simultaneous touches can trigger a
    unique response, or two touches followed by a third can implement a unique drag
    option. Applications can use the multi-touch screen to create unique and novel
    touch interfaces.


    +   - **Gestural control.** iOS 3.2 includes a new UIGestureRecognizer class,
    with predefined subclasses that can recognize taps, pinches, stretches, pans and
    drags, swipes, rotations, and a touch-and-hold gesture, known as a long press.
    Action methods are triggered as each gesture is recognized. Although custom gestures
    such as circle, check mark, or spiral movements can be recognized with extra code,
    users expect at least some of the standard UIGestureRecognizer events to be implemented.
    Unlike custom multi-touch support, gestural control is standardized.


    +   - **Orientation sensing.** iOS includes hardware and messages that can monitor
    device orientation. As the user rotates the device, apps can switch automatically
    between portrait and landscape views. Orientation messages can also be used to
    trigger other types of responses, such as sounds, page updates, view swaps, or
    game events.'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# Figure 19.3


    Built-in mapping and location sensing make it possible to create iPhone apps that
    tell users where they are, where they''ve been, or where they''re going.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_518_0.png)


    **Tilt and motion sensing.** An accelerometer is built into all iOS devices. It
    controls orientation sensing, and data from it can also be read directly to monitor
    tilt and motion events. Tilt information reports the angle each device axis makes
    with the pull of gravity. Tilt control is popular in games, but it can be used
    in more creative ways; for example, to create a source of random noise source
    from the least significant bits of the sensor stream. Motion sensing can also
    be used to report separate shake events. When combined with the compass, where
    available, applications can use these measurements to calculate absolute device
    orientation with respect to magnetic North. iPhone 4 models include a gyroscope,
    which makes it possible for applications to monitor six axes of orientation and
    rotation.'
  merge: -1
  img_proc: true
- pgno: 519
  md: '+   - **Mobile camera input.** Camera support is patchy on iOS devices. The
    iPhone 3G has a 2MP low resolution still camera. The 3GS camera features improved
    3MP resolution and supports video. The iPhone 4 camera is improved further with
    5MP resolution and a built-in LED flash. The iPad has no camera at all, but supports
    external camera hardware. Where available, developers have used the camera in
    inventive ways, taking full advantage of its portability. Sample applications
    include barcode scanning, text recognition, font recognition, and even the scanning
    and re-creation of Sudoku puzzles and crosswords.


    +   - **Built-in applications.** Some or all of the data and features included
    in the Maps, iPod, Contacts, and Settings applications can be accessed via APIs
    built into Cocoa Touch. You can build customized versions of the applications
    into your apps, adding new features as needed or accessing their data sources.
    Currently there are no APIs for the Weather, Stocks, or Calculator apps.


    +   - **App switching.** Your application can terminate itself and launch Web-based
    or online applications including Safari, YouTube, the App Store, SMS, and Email
    by calling on a URL-based interface feature that allows selected and limited data
    transfer; for example, your app can launch Safari with a specific URL or reload
    the Mail app with a specific address and e-mail text. Apps can also launch other
    apps, with limited data sharing.


    +   - **Multitasking.** iOS 4 supports multitasking on the iPhone 4 and 3GS, the
    iPod touch 16/32GB, and — from November 2010 — the iPad. Multitasking is largely
    automatic. When the user launches a new app, the existing app is placed in a low-priority
    background queue. This supports fast start-up, but queued apps must save their
    state before disappearing, because they can be removed from the queue without
    notice. Other requirements may apply — for example, an app can specify that it
    is playing audio in the background, and that it requires the resources needed
    to do this without stuttering or quitting suddenly.


    # Understanding the mobile app business model


    Many apps are developed for profit and sold through the App Store. Because the
    app market is large and the development cycle can be very short, it is much easier
    to become a full-time independent iPhone developer than it is to create a career
    as a solo Mac developer. However, the commercial benefits of iPhone development
    are sometimes exaggerated. Some developers do exceptionally well, and many do
    fairly well, but a large number of developers get little or no income from their
    apps.


    There is no simple formula for a top-selling app, although games remain consistently
    popular. For other apps, impressive graphic design, a sense of humor and lateral
    thinking, and strong promotion and marketing are as important as coding skills.'
  merge: -1
  img_proc: true
