- pgno: 368
  md: "Value transformers are a customizable extension to the transformation code\
    \ built into bindings. You can use them to convert a value from any object into\
    \ any other object, or to process values in more complex ways, such as performing\
    \ math, changing data formats, or even sending values over the Internet to a remote\
    \ server.\n\nA value transformer is a subclass of the `NSValueTransformer` class.\
    \ To create and use a transformer, follow these steps:\n\n+   1. **Create a new\
    \ object in Xcode.** Replace the header and the start of the implementation with\
    \ the value transformer boilerplate code provided below.\n+   2. **Add more boilerplate\
    \ code to the App Delegate’s initialize method to register the transformer.**\n\
    +   3. **Type the transformer’s name into the Value Transformer box under the\
    \ Model Key Path.**\n\nWhen you save the nib file and build and run the application,\
    \ the transformer processes the value pulled from the data source and replaces\
    \ it with a transformed value.\n\nIn this example, you’ll create a transformer\
    \ called `IndexToNameTransformer` that takes a radio button index and returns\
    \ a corresponding string. The boilerplate to register the transformer is shown\
    \ below. Add equivalent code to the App Delegate, replacing the name field with\
    \ the name of your own transformer object. You can allocate multiple transformers.\
    \ Each must have a unique name string.\n\n```\n```objc\n+ (void) initialize {\n\
    \    NSValueTransformer *transformer =\n    [[IndexToNameTransformer alloc] init];\n\
    \    [NSValueTransformer setValueTransformer:transformer\n        forName:@\"\
    IndexToNameTransformer\"];\n}\n```\n```\n\nThe transformer object header declares\
    \ your custom subclass of `NSValueTransformer`, which defines the transformer’s\
    \ name.\n\n```\n```objc\n#import <Cocoa/Cocoa.h>\n#import <Foundation/Foundation.h>\n\
    @interface IndexToNameTransformer : NSValueTransformer\n{}\n@end\n```\n```"
  merge: -1
  img_proc: true
- pgno: 369
  md: "Properties and other variables are declared in the implementation, listed here.\
    \ A switch statement converts the incoming `int` into a text string, which it\
    \ returns.\n\n```\n```objective-c\n#import \"IndexToNameTransformer.h\"\n\n@implementation\
    \ IndexToNameTransformer\n\n// These two methods are boilerplate\n+ (Class)transformedValueClass\n\
    {\n    return [NSString class];\n}\n\n+ (BOOL)allowsReverseTransformation\n{\n\
    \    return NO;\n}\n\n// The transformer method signature is fixed, the code is\n\
    // customizable\n- (id)transformedValue:(id)value\n{\n    int thisIndex = [value\
    \ intValue];\n    switch (thisIndex) {\n    case 1:\n        return @\"Radio\"\
    ;\n        break;\n    case 2:\n        return @\"TV\";\n        break;\n    case\
    \ 3:\n        return @\"Internet\";\n        break;\n    case 4:\n        return\
    \ @\"Pigeon (RFC 1149)\";\n        break;\n\n    default:\n        return @\"\
    Paper\";\n        break;\n    }\n}\n@end\n```\n```"
  merge: -1
  img_proc: true
