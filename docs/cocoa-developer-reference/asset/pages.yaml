  md: "```\n```objective-c\n- (void) applicationDidFinishLaunching: (NSNotification\
    \ *)\n    aNotification {\n    // Insert code here to initialize your application\n\
    }\n@end\n```\n```\n\n**Table 6.3  Sample Class Interface Features**\n\n| Feature\
    \ | Explanation |\n|---|---|\n| `#import \"FirstAppDelegate.h\"` | This line imports\
    \ the class interface file. (If you don't include this line in or forget to rename\
    \ the header if you rename a class, the compiler can't find the variable and method\
    \ definitions it needs to build the implementation.) |\n| `@implementation FirstAppDelegate`\
    \ | The code that follows is the implementation for the `FirstAppDelegate` class.\
    \ |\n| `@synthesize window;` | This line generates setter and getter methods for\
    \ window. |\n| `- (void) applicationDidFinishLaunching:...` | This is an implementation\
    \ for the application—`didFinishLaunching:` method, which is a method defined\
    \ in the `UIApplicationDelegate` protocol. The default implementation included\
    \ in the template is an empty stub. You can expand it with your own application\
    \ initialization code. |\n\nFunctionally, you can add custom start-up code to\
    \ the applicationDidFinishLaunching: method, but none of the other messages that\
    \ the delegate can handle are implemented—yet. These other methods are introduced\
    \ later in this chapter. The delegate is a subclass of NSObject. In theory this\
    \ means you can run any NSObject method on the delegate. This is often useful\
    \ for other subclasses for NSObject, but not for the application delegate — it's\
    \ unlikely that you'll want to copy the delegate or release it from memory. In\
    \ this context, NSObject is subclassed because it's the simplest and easiest way\
    \ to create a generic Cocoa object that can be customized with further features.\
    \ Its inherited features are redundant. This isn't usually true when subclassing\
    \ NSObject; generally, you do want to be able to copy objects and manage them\
    \ in memory, but the application delegate is a special case.\n\nNote that although\
    \ the application includes other objects such as a menu, they're not referenced\
    \ in the code or loaded explicitly by the delegate. When the application loads,\
    \ the menu loads with it, without a lot of events or messages. This is an example\
    \ of dynamic loading, which was introduced in Chapter 5. The menu is defined in\
    \ the MainMenu.xib nib file and loaded automatically. This file is described in\
    \ the next chapter."
