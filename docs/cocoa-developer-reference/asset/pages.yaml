- pgno: 460
  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_460_0.png)


    # # Creating Animations

    # and 3D Graphics


    Animations are often associated with games, but Cocoa makes it easy to animate
    almost any element in a user interface. Objects can move smoothly, pulse with
    color or brightness, jiggle, or change their size with one click or mouse over.
    Aqua includes standard animated effects, such as slide-out panes and pulsing buttons.
    In part, these are automatic. When you create a file open/save pane, the animation
    is embedded in the class and runs without further code.


    You can add further animations to improve the look and feel of your application,
    make it more professional, and add value by subtly highlighting important features.


    It’s also possible to create animated transitions when replacing one object with
    another. View swapping of this type is a key skill in iPhone app design, where
    swapped views replace the windows, panels, and panes of a desktop application.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_460_1.png)


    # CROSS-REF


    For a practical example of view swapping, see Chapter 19.


    To use animations effectively, you must become familiar with Cocoa’s different
    animation classes and features. Many applications underutilize animations or add
    them in an unimaginative way. A key design goal is to use animations to create
    a genuine user benefit. A successful animation should do more than look impressive;
    it should also offer visual hints to the user to help him or her understand the
    application and use it in a more intuitive way.


    For example, on the iPhone, views are swapped by finger movements accompanied
    by matching animations. The animation suggests a metaphor, such as a page curl,
    pop-up, swipe, or twirl, that implies something about the organization of the
    app. An app that swipes into a view but returns with a page curl feels inconsistent.


    Cocoa includes a selection of classes and techniques that support animation. In
    outline, there are three options: direct property access; Core Animation, which
    is Cocoa’s main animation framework; and OpenGL, which is a complex low-level
    language that supports 3D scene rendering.


    # 17  In This Chapter


    +   - Creating direct property animations

    +   - Using animators

    +   - Creating custom animation objects

    +   - Creating a simple OpenGL animation in Cocoa'
