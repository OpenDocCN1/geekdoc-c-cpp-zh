  md: '# ## Using drawRect:


    You can use a similar technique to create customized animated 2D graphics, using
    the paths and drawing objects described in the previous chapter. Use the timer
    method to initialize relevant path and object values for each update, and end
    the timer method with


    ```

    ```

    [theView setNeedsDisplay];

    ```

    ```


    ![](img/2b293e29fc15b0797f113b85dd429b6e_464_0.png)


    > > **NOTE**

    > > If the view is refreshing itself, replace `theView` with `self`.


    This generates an indirect call to the view''s drawRect: method and refreshes
    the view. The drawRect: code can read the updated values to create a refreshed
    view for each timer update. You can use this technique to create complex effects.
    It''s fast enough for simple games, but can stutter when the drawing code is dense
    and is updated at typical game refresh rates.


    For more complex effects, you can get smoother results using one of Cocoa''s other
    animation options.


    # ## Using Animators


    You can create very simple animation effects by adding a proxy — a simple drop-in
    animation controller that automatically adds an animation object. Initializes
    it with useful default values, and runs the animation. Core Animation''s proxy
    option gives you a lot of animation power for very little code. You can customize
    the animations with extra code, but a minimal implementation adds almost no code
    at all.


    For example, to animate the position update for a button, replace


    ```

    ```

    [theButton setFrameOrigin: newPosition];

    ```

    ```


    with


    ```

    ```

    [[theButton animator] setFrameOrigin: newPosition];

    ```

    ```


    The animator creates a smooth change from the current position to the new position,
    with a default duration of 0.25 seconds.


    # ## Creating a simple proxy animation


    Figure 17.2 shows the nib from a very simple application that demonstrates proxy
    animation, using a button as a convenient animatable object.'
