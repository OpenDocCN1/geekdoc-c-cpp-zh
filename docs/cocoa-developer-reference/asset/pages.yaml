    # Using Web APIs


    One of the key applications of NSURL is Web API access. Google, Amazon, Yahoo,
    Twitter, Facebook, and other popular Web services offer APIs that developers can
    use to implement advanced features. For example, you can use Google''s new Location
    API to return a list of businesses around a given location.


    NSURL includes features that make it possible to connect to any Web API. Typically
    your application follows four steps:


    +   1. It creates a URL in the very specific format required by the API.

    +   2. It uses an NSURL method to send the URL to the server.

    +   3. It downloads the response.

    +   4. It extracts data from the response.'
  merge: -1
  img_proc: true
