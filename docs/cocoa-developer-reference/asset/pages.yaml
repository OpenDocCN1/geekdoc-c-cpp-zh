- pgno: 324
  md: "The code that follows lists the header and implementation for the custom data\
    \ class. Only properties with encode: and decode: methods are archived. This is\
    \ a minimal example; in a practical class, you can add other methods to implement\
    \ other features, as needed.\n\n> > **TIP**\n> >\n> > In this example, you’ll\
    \ implement full archiving of every property. It’s sometimes useful to archive\
    \ selectively. You can do this easily — just leave some of the properties out\
    \ of the coding methods.\n\nThe keys associated with each property are arbitrary.\
    \ The key strings are for encoding and decoding only. Each key must be unique.\n\
    \n```\n```objective-c\n@interface DataClass : NSObject {\n    NSString *firstName;\n\
    \    NSString *secondName;\n    int       theAge;\n    NSString *theNotes;\n}\n\
    @property (retain) NSString *firstName;\n@property (retain) NSString *secondName;\n\
    @property (retain) NSString *theNotes;\n@property int theAge;\n- (void)encodeWithCoder:\
    \ (NSCoder *)encoder;\n- (id) initWithCoder: (NSCoder *)decoder;\n@end\n@implementation\
    \ DataClass\n@synthesize firstName, secondName, theNotes, theAge;\n- (void)encodeWithCoder:\
    \ (NSCoder *)encoder\n{\n    [encoder encodeObject: firstName forKey: @\"firstName\"\
    ];\n    [encoder encodeObject: secondName forKey: @\"secondName\"];\n    [encoder\
    \ encodeObject: theNotes forKey: @\"theNotes\"];\n    [encoder encodeInt: theAge\
    \ forKey:@\"theAge\"];\n}\n- (id) initWithCoder: (NSCoder *)decoder\n{\n    if\
    \ (self = [super init])\n    {\n        firstName = [decoder decodeObjectForKey:@\"\
    firstName\"];\n        secondName = [decoder decodeObjectForKey:@\"secondName\"\
    ];\n        theNotes = [decoder decodeObjectForKey:@\"theNotes\"];\n        theAge\
    \ = [decoder decodeIntForKey:@\"theAge\"];\n    }\n    return self;\n}\n@end\n\
    ```\n```"
