- pgno: 248
  md: "As an example, assume you have an object called `myObject`, an instance of\
    \ `MyClass`, which has a property called `thisInt`. The following code will trigger\
    \ a KVO update **as long as you run it inside another object**:\n\n```\nmyObject.thisInt\
    \ = 15;\n```\n\nThe accessor method is triggered by an external property write.\
    \ But if you include internal update code within myObject, the assignment doesn’t\
    \ use an accessor, and so the assignment is invisible to KVO.\n\n```\n@implementation\
    \ MyClass\n...\nthisInt += 10;\n```\n\nOne solution is to force updates with explicit\
    \ code:\n\n```\n[self willChangeValueForKey: @\"thisInt\"];\nthisInt = thisInt\
    \ + 10;\n[self didChangeValueForKey: @\"thisInt\"];\n```\n\nThis is ugly and is\
    \ a lot of extra trouble when you want to add one number to another. Other solutions\
    \ are possible, but the most elegant is to use `self` and dot syntax for critical\
    \ assignments:\n\n```\nself.thisInt = thisInt+10;\n```\n\nSpecifying `self` forces\
    \ the assignment to use an accessor, which solves the problem in a simple and\
    \ readable way. Use it for *critical* assignments only. To improve performance,\
    \ don’t use it for intermediate steps in a calculation.\n\nYou must also check\
    \ that accessors are used when working with bindings (described in Chapter 13).\
    \ Bindings use KVO, and if you don’t set values with accessors, they don’t track\
    \ updates correctly.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_248_0.png)\n\n\
    **CAUTION**  \nThis solution works with dot syntax. If you don’t approve of dot\
    \ syntax, you’ll have to use ugly, old-fashioned constructions like `[self setThisInt:\
    \ [self thisInt] + 10];`.\n\n# Using KVO\n\nKVO can be immensely powerful. Your\
    \ application can monitor events anywhere in your code and respond automatically\
    \ to given values or application states. Setting a value in one place in the code\
    \ can trigger a chain of dependent events automatically. Many Cocoa objects are\
    \ KVO compliant; your application can watch for changes in Cocoa object properties\
    \ and respond as needed. Some applications include the following:"
  merge: -1
  img_proc: true
- pgno: 249
  md: '+   - **Responding when a background process writes a value to a property after
    completing a calculation.** Instead of using a delegate method or explicit method
    call, your application can monitor the property and capture the update automatically.

    +   - **Monitoring changes to application preferences.** The application can track
    updates as a user makes them on a separate preferences pane, without linking (see
    Chapter 13 for an example).

    +   - **Copying values from one location to another.** KVO makes it much easier
    to implement spreadsheet-like mutual dependencies.


    # ### Understanding KVO limitations


    KVO isn’t supported by every object, and sometimes it’s only partially supported.
    This is particularly true of mutable data collection objects. For example, KVO
    is triggered when you create, assign, or copy an array, but not when the contents
    of the array are modified. This means KVO is blind to array edit operations. You
    can fix this with a dummy assignment after you modify the array:


    ```

    ```objc

    self.theArray = theArray;

    ```

    ```


    This is an ugly workaround, but you can use it to notify a KVO observer that the
    array has changed or to trigger a KVO observer method on demand.


    # ### KVO and nil/null values


    In the same way that KVC can return nil, KVO can return null values. For robustness,
    it’s useful to test for this by testing for [NSNull null], which is Cocoa’s way
    of specifying a null value.


    ```

    ```objc

    if((newValue[change valueForKey: @"new"]) != [NSNull null]) {…

    ```

    ```


    When using Cocoa objects, the key names are given. It’s not always easy to remember
    the data type reference by a key, so it’s good practice to note the type in a
    comment.


    # # Using Notifications


    Cocoa’s notifications are an application-wide messaging service. Many classes
    generate notifications as they work. You can set up objects to receive all notifications
    posted by another object or to respond only to named notifications. Figure 9.12
    is a block diagram of the notification system.'
