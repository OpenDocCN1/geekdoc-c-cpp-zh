- pgno: 78
  md: '# # Introducing the Cocoa and OS X Documentation


    After the brief tour of frameworks and layers earlier in the previous chapter,
    the OS X and Cocoa documentation should be easier to understand than if you’d
    dived into it cold. Apple makes the Cocoa documentation, shown in Figure 3.1,
    available in two places. Developers can download and install the free Xcode SDK,
    as described in Chapter 4. In addition to a suite of design tools, the SDK includes
    a full set of documentation visible in a simple Safari-based viewer. Nondevelopers
    and prospective developers can view the Cocoa documentation online. Currently
    the URL is http://developer.apple.com/mac/library/navigation.


    # ### CAUTION


    Apple occasionally rearranges its developer Web site, so the documentation URL
    isn’t guaranteed to remain accurate. If the URL changes, expect a redirect to
    the new location. If no redirect is available, you can find the location by searching
    for “Mac OS X Reference Library.” The library has always been freely available
    online and this is unlikely to change in the future. But Apple is moving away
    from disk-based documentation to online access, so it may not be bundled in full
    with future versions of Xcode.


    Using the Apple documentation efficiently is a key skill, which isn’t easy to
    master. The documentation itself is a slightly chaotic mix of history and new
    features, with varying degrees of detail. The browser can also be difficult to
    use.


    # ### TIP


    You can solve the browser problem by using a free third-party helper application
    called AppKiDo, available from http://homepage.mac.com/aglee/downloads/appkido.html
    and shown in Figure 3.2. AppKiDo is highly recommended. It transforms and simplifies
    the browsing experience, and can literally save you hours of browsing time. It
    also groups and sorts related Cocoa classes in useful ways, making it easier to
    follow how Cocoa is organized.


    # ### In This Chapter


    +   - Understanding resource types

    +   - Using the documentation'
