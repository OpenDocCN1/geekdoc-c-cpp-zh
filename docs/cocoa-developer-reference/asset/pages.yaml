  md: '# ### Release Notes


    The Release Notes are another grab bag of short articles. Figure 3.8 shows a typical
    example. The notes list updated properties, constants, and new classes added in
    each release of OS X. This information is included for completeness rather than
    for reference. Very occasionally you may find that code isn''t working because
    information listed here hasn''t been included in the main documentation. More
    typically, the main class references are updated as soon as changes are made,
    and the release notes provide a sporadically valuable change log.


    # ### Figure 3.8


    It''s possible some developers may still need to see the original Java 1.3.1 release
    notes from 2003, but it''s not likely.


