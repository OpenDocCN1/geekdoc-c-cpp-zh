  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_475_0.png)\n\n# TIP\n\nYou can use\
    \ the Color Monochrome and Color Controls filters to change, and optionally to\
    \ animate, the background color of a button. This breaks any number of Aqua design\
    \ guidelines, but sometimes a pulsing or color-cycling button is exactly what\
    \ an application needs.\n\nThis sample code creates a filter in a view’s awakeFromNib\
    \ method and updates its input Center key when the user clicks with the mouse:\n\
    \n```\n```objective-c\n- (void) awakeFromNib {\n    //Load the demo image from\
    \ the bundle\n    myBundle = [NSBundle mainBundle];\n    sourceImagePath =\n \
    \   [myBundle pathForResource:@\"b1\" ofType:@\"jpg\"];\n    sourceImageURL =\n\
    \    [NSURL fileURLWithPath: sourceImagePath];\n    sourceImage = [[NSImage alloc]\
    \ initWithContentsOfURL:\n    sourceImageURL];\n    self.image = sourceImage;\n\
    \    self.imageScaling = NSScaleToFit;\n    //Set a default filter center in the\
    \ middle of the view\n    boundsRect = [self bounds];\n    filterCenter = NSMakePoint(boundsRect.size.width*.5,\n\
    \    boundsRect.size.height*.5);\n    //Create and initialize the filter\n   \
    \ thisFilter =\n    [CIFilter filterWithName:@\"CITorusLensDistortion\"];\n  \
    \  [thisFilter setDefaults];\n    thisCenter = [CIVector vectorWithX: filterCenter.x\
    \ Y:\n    filterCenter.y];\n    [thisFilter setValue: thisCenter forKey: @\"inputCenter\"\
    ];\n    [thisFilter setValue: [NSNumber numberWithFloat:0]\n    forKey:@\"inputRadius\"\
    ];\n    [thisFilter setValue: [NSNumber numberWithFloat:200]\n    forKey:@\"inputWidth\"\
    ];\n    [thisFilter setValue: [NSNumber numberWithFloat:1.5]\n    forKey:@\"inputRefraction\"\
    ];\n    thisFilter.name = @\"torus\";\n    [self setContentFilters:\n    [NSArray\
    \ arrayWithObjects:thisFilter, nil]];\n}\n- (void) mouseDown: (NSEvent *) theEvent\
    \ {\n    //Get the click location, using superview coordinates\n    clickedPoint\
