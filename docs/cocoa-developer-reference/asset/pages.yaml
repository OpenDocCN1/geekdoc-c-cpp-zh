- pgno: 238
  md: 'This is only available in limited circumstances. If you need to pass parameters
    to your selector method, pass them externally through some associated properties
    or other data objects.


    The other limitation is that a selector *isn’t* a pointer. It doesn’t point to
    a specific entry point in memory. Instead, it triggers a runtime lookup of a method
    name, which returns a pointer. This can be an ambiguous process, because more
    than one object may implement the same method name.


    Generally, selectors are local. If there’s no explicit `target` object, the lookup
    assumes that you’re trying to find a matching method in `self`. This is intuitive
    behavior, and rarely a problem. But keep in mind that selectors don’t usually
    range over the whole of your application, except when there’s a supporting target
    property.


    This short summary is almost all you need to know about target-action. It’s an
    unusual feature that isn’t available in most other languages, but in practice
    it’s very un mysterious.


    # Defining selectors in Interface Builder


    When you create an `IBAction` link in Interface Builder (IB), you’re really setting
    an object’s target and the action properties. This is why setting an action is
    a two-step process. Assume you have a nib file with a button and you’re going
    to link the button to an action. The first step selects the target object graphically,
    as shown in Figure 9.6.


    **Figure 9.6**


    When creating a link, the first step sets the target object for the link.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_238_0.png)'
