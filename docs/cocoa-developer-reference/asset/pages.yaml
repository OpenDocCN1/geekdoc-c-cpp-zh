- pgno: 111
  md: "# # Exploring Xcode’s Windows\n\nNow that you have created a first application,\
    \ you’ll want to take a closer look at Xcode. Xcode is a deceptively simple development\
    \ environment with some unexpectedly rich and powerful features. Newcomers can\
    \ literally build both Mac and iPhone applications with a single click, ignoring\
    \ most of Xcode’s features. More experienced developers can customize Xcode almost\
    \ indefinitely, creating custom build phases, using both online and offline version\
    \ control, and building projects of various kinds.\n\n# ## Understanding Groups\
    \ & Files\n\nIt’s important to understand how projects and files are organized,\
    \ because copying or moving an Xcode project folder in Finder without setting\
    \ it up correctly can destroy it. The Groups & Files pane in Xcode appears on\
    \ the left side of the screen. It includes features that look like folders and\
    \ other items. The folders are called *groups*. They appear to work like Finder\
    \ folders. You can use reveal triangles to open and close them, drag files into\
    \ and out of them, and create new folders. But the group structure is superficial\
    \ and is for your convenience only — there are no equivalent folders in the project\
    \ directory in Finder.\n\nWhen you create a new project, a named project icon\
    \ appears at the top left, and code and resource groups appear \"inside\" it.\
    \ Figure 4.13 shows the folders in a new empty project, and Table 4.1 summarizes\
    \ how they’re used.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_111_0.png)\n\n\
    > **NOTE**\n> \n> Under the folders is a list of additional features, including\
    \ Targets, Build Products, Find Results, and others. You don’t need to use these\
    \ features to build and run a project.\n\n**Table 4.1** Groups in Xcode’s Groups\
    \ & Files Pane\n\n| Application | Notes |\n|---|---|\n| Classes | Objective-C\
    \ class files |\n| Other sources | Miscellaneous C files, including `main.c` |\n\
    |  | A `.pch` prefix header file for the project |\n| Resources | Nib files used\
    \ by Interface Builder |\n|  | Optional graphics and other media files |\n| Frameworks\
    \ | Frameworks used in the project |\n| Products | A list of build products |\n\
    |  | (Usually there’s just one — the finished app) |"
  merge: -1
  img_proc: true
- pgno: 112
  md: '# **Figure 4.13**


    The Groups & Files area at the top left is a key feature in Xcode. You''ll spend
    a lot of time here selecting files for editing and then working on them in the
    editor window in the lower-right area of the Xcode window.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_112_0.png)


    It''s critically important to understand that even though the Groups & Files pane
    looks like a Finder window, the items in this window are symbolic links to files
    on disk. Think of them as named placeholder links that point to a file path.


    By default, the link name matches the filename — so file.h points to a real file.h
    on disk. But in Xcode this isn''t always true, and you can rename, delete, and
    rearrange the links in the Groups & Files pane without affecting the files they
    point to. A link named file.h can actually point to somethingcompletelydifferent.h
    on disk.


    Initially this indirect system appears almost completely counterintuitive, but
    it offers significant benefits. For example, you can include files from any disk
    location in an Xcode project without having to copy them to the project folder
    on disk.'
  merge: -1
  img_proc: true
