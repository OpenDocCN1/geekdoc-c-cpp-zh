- pgno: 313
  md: "You can usually ignore the initWith...methods and use their class equivalents.\
    \ Use\n\n```\n```objc\nNSArray *aNewArray = [NSArray arrayWith<data source>];\n\
    ```\n```\n\ninstead of\n\n```\n```objc\nNSArray *aNewArray = [[NSArray alloc]\
    \ initWith<data source>];\n```\n```\n\nTo create an array with a single object,\
    \ use\n\n```\n```objc\nNSArray *theArray = [NSArray arrayWithObject: theObject];\n\
    ```\n```\n\nThis is required throughout Cocoa when passing an object to another\
    \ object that takes an array parameter. The array parameter can have many objects,\
    \ but sometimes only one is needed.\n\nWhen defining a list of objects with the\
    \ plural variant of this method, terminate it with nil.\n\n```\n```objc\nNSArray\
    \ *theArray = [NSArray arrayWithObjects: object1, object2,\n    nil];\n```\n```\n\
    \nAs mentioned in earlier chapters, you can copy arrays by creating a new array\
    \ with the contents of an existing array. NSArray includes methods that can modify\
    \ the array as it's copied. They can extract a range of objects from the array,\
    \ add a new object, or combine two arrays. For example:\n\n```\n```objc\nNSArray\
    \ *newArray =\n    [oldArray arrayByAddingObject: newObjectToAdd];\n```\n```\n\
    \nThis copies the objects from oldArray to newArray and then appends newObjectToAdd.\n\
    \nAlthough NSArray isn't mutable, these modification methods make it possible\
    \ to mutate the data in the array, at the cost of some extra code and another\
    \ array object.\n\nYou can also copy an array directly using the copyWithZone:\
    \ method. This is implemented by all data collection objects.\n\n```\n```objc\n\
    NSArray *copiedArray = [oldArray copyWithZone: NULL];\n```\n```\n\nUse NULL to\
    \ specify the default memory pool.\n\n# ### Using NSMutableArray\n\nNSMutableArray\
    \ supports editing but enforces a contiguous list.\n\n```\n```objc\n[aMutableArray\
    \ insertObject: anObject AtIndex: n];\n```\n```\n\nThe indexes of existing objects\
    \ above n are automatically increased by one, as shown in Figure 12.3. The removeObjectAtIndex:\
    \ method recalculates existing indexes in an analogous way."
