    # # Using CoreImage Filters


    CoreImage filters are a collection of prewritten image filtering plug-ins that
    you can apply to the content or background of any view. The filters are listed
    by name in the Core Image Filter Reference in the Documentation, which also includes
    preview images. If you have Adobe Photoshop experience, many of the effects will
    be familiar, but the full list of filters includes novel effects that haven''t
    — yet — been made available in industry-standard image editors.


    There are three ways to use filters:


    +   - You can add them to any view by clicking the view''s Effects tab in the
    Inspector window in Interface Builder.

    +   - You can trigger them from code in a subclassed implementation of `drawRect:`.

    +   - You can write Objective-C code that combines existing filters or defines
    completely new effects.'
  merge: -1
  img_proc: true
