- pgno: 550
  md: "If you save the new nib and build and run the app, it will load and display\
    \ the AView nib design, as shown in Figure 19.26.\n\n# Figure 19.26\n\nRunning\
    \ the app loads the new nib and displays it.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_550_0.png)\n\
    \nThe new button remains unlinked. It flashes when tapped, but does nothing. To\
    \ fix that, add a `showBView:` method to `FirstAppViewController.m` with code\
    \ to load and display the B view.\n\n```\n```objective-c\n- (IBAction) showBView:\
    \ (id) sender\n{\n    self.bViewController = [[BViewController alloc] initWithNibName:\n\
    \        @\"BViewController\" bundle:nil];\n    [aViewController.view removeFromSuperview];\n\
    \    [self.view insertSubview:bViewController.view atIndex:0];\n}\n```\n```\n\n\
    This is almost identical to the code in `viewDidLoad`. It loads the BViewController\
    \ nib file, then calls `removeFromSuperview` to unlink the previously visible\
    \ view from the view array and release it. The last line inserts the B view into\
    \ the hierarchy to display it."
  merge: -1
  img_proc: true
