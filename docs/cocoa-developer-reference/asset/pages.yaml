- pgno: 42
  md: '+   - **The spacing of elements within windows is also standardized.** Standards
    for margins, positioning, grouping, and justification are listed in the Apple
    Human Interface Guidelines. For example, preferences panes, such as Safari’s preferences
    shown in Figure 2.1, are weighted so that they appear centered in the window,
    but aren’t simply center-justified in a mechanical way.

    +   - **Fonts are partly standardized.** Most applications use the system font,
    but you can allow users to select other fonts in certain circumstances.

    +   - **Applications should include help files,** with topic browsing and open
    searches.


    **Figure 2.1**


    Safari’s preferences are center-weighted rather than center-justified. The layout
    as a whole appears balanced, even though none of the individual items is placed
    on the exact vertical center line. Items are also grouped vertically for clarity.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_42_0.png)


    # Using Aqua with Cocoa


    Many applications fail to follow all these design guidelines. Because OS X applications
    can be created and sold by any developer without Apple’s permission, developers
    can create their own interface standards.'
