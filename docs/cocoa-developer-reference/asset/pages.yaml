- pgno: 495
  md: '# Enabling debugging


    The debugger environment runs in a special debug mode, which enables breakpoints.
    Note that selecting a Debug configuration or creating a debug flag does not enable
    the debugger — it creates a binary that the debugger can work with, but it doesn’t
    run the debugging environment.


    To run it, click the Breakpoints button on the main Xcode toolbar. The button
    changes state, and the Build and Run button is replaced with Build and Debug,
    illustrated with a stylized tray can, as shown in Figure 18.6. Alternatively,
    you can add a breakpoint to the code, as described below — this automatically
    enables debugging.


    **Figure 18.6**


    Xcode in debug mode. The Breakpoints button is selected, and the Build and Run
    button is replaced by the Build and Debug button. Note that the separate Debugger
    window doesn’t appear automatically when Debug mode is selected.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_495_0.png)'
