- pgno: 67
  md: 'around views. A view is an active area in a window that draws graphics and
    responds to user actions. Cocoa includes an NSView object that manages views.
    In practice, you create an application interface by customizing an instance of
    NSView with your own code. Associated classes can display tables, forms, text
    fields, groups of cells, and other standard interface features, including smaller
    objects such as sliders, number boxes, and buttons.


    In theory, any item that the user can see and interact with is called a view.
    This is most obvious on the iPhone, which includes various complex predefined
    view types, including a Web view that displays Web pages, a table view that displays
    a list of items in a table, and so on.


    One source of confusion is the relationship between individual items in a view
    and the appearance of the window as a whole. When designing an interface, the
    entire interface is the window’s view. But smaller objects are also views. To
    avoid confusion, think of the interface as the view, and the smaller objects as
    subviews or as view objects. Very small single-feature views such as buttons and
    sliders are usually known as controls, although occasionally they’re also called
    views, just to confuse you.


    # Views and objects in Interface Builder


    Interface Builder (IB) is the Xcode view design tool. Designing a view might seem
    to be a simple visual process, but there’s a hidden subtlety. It’s not immediately
    obvious to new developers that resource files — called nib files — can be loaded
    automatically. By default, an application loads at least one nib file when it
    runs. You can override the loading process and control it manually, if you choose
    to. If you don’t, it just happens — no code is needed.


    It’s possible to set up nib files so that they load other nib files. In fact,
    you can use Interface Builder to define a collection of objects, views, and data
    structures across multiple files, and the entire collection will be loaded automatically.
    If you think of IB as an interface editor, you’ll miss this essential feature.
    You’ll also find it difficult to understand how applications are organized. For
    more information, see Chapter 8.


    # Model, View, Controller


    Apple’s developer documentation emphasizes the Model, View, Controller (MVC) design
    pattern, shown in Figure 2.11. MVC means that data is kept isolated from views,
    and that controller objects translate messages in both directions. Views never
    communicate with data objects directly.


    This might seem like an unnecessary extra complication, but it increases efficiency.
    In the same way that a Web browser doesn’t need to download the entire Internet
    to display a single page, MVC means that an application’s interface only ever
    displays a subset of its data. Cocoa applications are designed to use MVC and
    include predefined controller objects for various data types.


    Figure 2.12 shows one possible example. The model is a table with thousands of
    entries. A good way to make an application impossibly slow would be to copy every
    cell’s data to an editable cell in a list on the screen, keeping all of the visible
    cells in memory at the same time.'
