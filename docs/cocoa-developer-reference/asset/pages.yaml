- pgno: 553
  md: '# Figure 19.29


    Testing that the button in the A view displays the B view


    ![](img/2b293e29fc15b0797f113b85dd429b6e_553_0.png)


    # Handling events with protocol messaging


    Next, add code to the B view to swap back the views; until you do this, the button
    in the B view remains inactive. You could repeat the previous steps to add a showAView
    method in the root controller, modifying the code slightly so it loads the A view
    nib and linking it to the button in the B view via First Responder. This is the
    simplest solution and it would work perfectly.


    This example demonstrates how to solve the problem by creating a delegate protocol.
    Unlike the simpler option, the protocol can pass parameters between the view controllers.
    Begin by adding a new delegate protocol to the interface of the root view controller.
    Change the declaration in FirstAppViewController.h to:


    ```

    ```objc

    @interface FirstAppViewController : UIViewController <ViewControllerDelegate>{

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 554
  md: "Now you can define the details of this protocol in `BViewController.h`, adding\
    \ other class features to create a delegate property and an action method.\n\n\
    ```\n```objc\n@protocol BViewControllerDelegate;\n@interface BViewController :\
    \ UIViewController {\nid <BViewControllerDelegate> delegate;\n}\n@property (nonatomic,\
    \ assign) id <BViewControllerDelegate>\n    delegate;\n- (IBAction) showAController;\n\
    @end\n@protocol BViewControllerDelegate\n- (void)BViewControllerDidFinish:(NSString\
    \ *)aString;\n@end\n```\n```\n\nThe header includes a separate `showAController`\
    \ method to handle button taps from the button in the view. Implement this method\
    \ in `BViewController.m` so that it calls the `BViewControllerDidFinish:` method\
    \ on the delegate object.\n\n```\n```objc\n@implementation BViewController\n@synthesize\
    \ delegate;\n- (IBAction) showAController {\n    [self.delegate BViewControllerDidFinish:@\"\
    Back to View A...\"];\n}\n```\n```\n\nIn IB, reload all class files and link this\
    \ method to the button in the B view.\n\nTo finish the app, add an implementation\
    \ of `BViewControllerDidFinish:` in `FirstAppViewController.m`. If this implementation\
    \ is missing, the app will crash with a selector error when the return button\
    \ is tapped in the B view. Here is a simple version:\n\n```\n```objc\n- (void)BViewControllerDidFinish:(NSString\
    \ *)aString {\n    NSLog(aString);\n    self.aViewController = [[AViewController\
    \ alloc] initWithNibName:\n        @\"AViewController\" bundle:nil];\n    [BViewController.view\
    \ removeFromSuperview];\n    [self.view insertSubview:AViewController.view atIndex:0];\n\
    }\n```\n```\n\nIt is almost identical to the previous view swapping code fragments:\
    \ it allocates and initializes the A view controller, removes the B view, and\
    \ replaces it with the A view."
  merge: -1
  img_proc: true
- pgno: 555
  md: "One final step is missing: there is no delegate defined for the B view controller.\
    \ To set one, add a line to the `showBView:` method on `FirstAppController.m`,\
    \ nominating the root controller as the delegate.\n\n```\n```objective-c\n- (IBAction)\
    \ showBView: (id) sender\n{\n    self.bViewController = [[BViewController alloc]\
    \ initWithNibName:\n        @\"BViewController\" bundle:nil];\n    self.bViewController.delegate\
    \ = self;\n    [aViewController.view removeFromSuperview];\n    [self.view insertSubview:bViewController.view\
    \ atIndex:0];\n}\n```\n```\n\nBuild and run the app, and test it by tapping the\
    \ buttons to swap the views. An NSLog call lists the string to the console, so\
    \ that you can confirm that data is being passed to the root view controller from\
    \ the B view, as shown in Figure 19.30.\n\n# Creating an animated view swap\n\n\
    The instant view swap effect works, but is unimpressive. You can improve your\
    \ app’s production values by animating it. iOS animation code is similar to OS\
    \ X animation code, which was introduced in Chapter 17. Adding animation code\
    \ around the view swap creates longer versions.\n\n```\n```objective-c\n- (void)BViewControllerDidFinish:(NSString\
    \ *)aString {\n    NSLog(aString);\n    self.aViewController = [[AViewController\
    \ alloc] initWithNibName:\n        @\"AViewController\" bundle:nil];\n    //Start\
    \ of the animation\n    [UIView beginAnimations:@\"An Arbitrary Transition Name\"\
    \n        context:nil];\n    [UIView setAnimationCurve:UIViewAnimationCurveEaseOut];\n\
    \    [UIView setAnimationDuration:1.1];\n    UIViewAnimationTransition transition;\n\
    \    //Create and load a transition type\n    transition = UIViewAnimationTransitionFlipFromRight;\n\
    \    [UIView setAnimationTransition: transition forView:self.view\n        cache:YES];\n\
    \    [bViewController.view removeFromSuperview];\n    [self.view insertSubview:aViewController.view\
    \ atIndex:0];\n    [UIView commitAnimations];\n}\n```\n```"
  merge: -1
  img_proc: true
