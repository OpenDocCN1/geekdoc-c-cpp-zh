- pgno: 456
  md: 'The dictionary lists:


    +   - The categories the filter belongs to. Categories are functional groups of
    filters; for example, distortion, video, still image, and so on. Category names
    are defined in the Reference Guide.

    +   - The filter name.

    +   - A list of key names.

    +   - A list of attributes for each key, including the maximum and minimum acceptable
    values and the value type.


    # Creating filter controller interfaces


    In theory, you can use this information to create a completely general filter
    wrapper. In practice, the dictionary format is complex, and creating a general
    automated UI is a challenging project.


    A simpler solution is available. Running the `viewForUIConfiguration:` method
    on any filter generates a complete controller view automatically, with the appropriate
    sliders, color pickers, and other UI features. You can specify various sizes of
    controller view, and you can also exclude specific parameters; for example, you
    may choose to implement an image source picker separately. Slot the controller
    view into a container view with `addSubview:` or `replaceSubview:`.


    Figure 16.20 shows a simple prototype example. The UI controls appear at the bottom
    right. The UI design is more functional than stylish, and you must use bindings
    to link the UI elements to filter parameters. But you can use this method to auto-generate
    filter controls with relatively little coding effort.


