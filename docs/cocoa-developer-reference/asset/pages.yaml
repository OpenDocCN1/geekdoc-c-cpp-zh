- pgno: 470
  md: '# Creating custom timing functions


    The Bezier curve used by `CAMediaTimingFunction` `functionWithControlPoints:`
    might seem unintuitive and difficult to work with, but there is an easy way to
    use its features.


    To control timing, set the two cx values so they total 1.0. They then approximate
    proportions/percentages that define the timing of the initial and final phases
    of the curve.


    The two cy values are the “active” values that approximate the animated value.
    For example, 0.1 is equivalent to 10 percent of the interpolated value, while
    0.9 is equivalent to 90 percent, and so on. For example:


    ```

    0.9 : 0.0 : 0.1 : 1.0

    ```


    creates a timing function that pauses for 90 percent of its duration and snaps
    to its final value in the remaining 10 percent of the time. Because the curve
    is a Bezier, the control points are interpolated smoothly, which is why this technique
    is approximate. But you can use it to gain an insight into a function that’s difficult
    to visualize otherwise.


    In OS X, the cy values are clamped to 0.0 and 1.0. In iOS, they’re left unclamped,
    and you can specify values outside these limits to define overshoots. You can
    use this trick to create bounce effects. If cy2 is greater than 1.0, the animated
    overshoots and then settles back to 1.0 when the animation ends.


    # Creating and using animation paths


    When you need more sophisticated control over the time development of an animation,
    use `CAKeyframeAnimation`. You can define keyframes in two ways.


    # Creating a values/keytimes animation


    To create an abstract set of keyframes that can be applied to any animation sequence,
    create an array that holds a sequence of `NSNumber` objects and pass it to the
    values property. The animation steps through the array and uses the number values
    to control the target object, with optional interpolation.


    Timing is controlled with either the keyTimes array or the timingFunctions array.
    keyTimes uses NSNumber objects to define the duration of each step. The calculationMode
    property defines the interpolation between each step, which can be linear, discrete
    — that is, stepped — or paced, producing smooth changes throughout the animation.


    timingFunctions takes a series of CAMediaTimingFunction objects, providing very
    fine control over the interpolation between points. This can be useful in complex
    media applications such as video editors, audio sequencers, and games, but it’s
    excessively detailed for simple UI animations.'
  merge: -1
  img_proc: true
