- pgno: 547
  md: "# ## Adding view controller subclasses\n\nThe empty gray view isn't very exciting,\
    \ but you're about to change that. Your new app will have two views, with buttons\
    \ that switch between them. Start by making two new subclasses of UIViewController\
    \ to hold the extra views. Many apps use a subclass of UIViewController, so it\
    \ is included in the list of file templates in Xcode, with an option to create\
    \ a new nib file with the new class files.\n\nRight-click the Classes folder and\
    \ choose Add > New File. Choose Cocoa Touch Class at the top left, and click the\
    \ UIViewController subclass file template. Make sure the With Xib for user interface\
    \ option is selected.\n\nClick Next, and save the new class as AViewController.\
    \ Xcode adds it to the project, with a nib file. Repeat this sequence to add another\
    \ new class called BViewController, with its own separate nib.\n\nThe app now\
    \ has three view controllers and three nib files — the original controller with\
    \ a blank view generated by the template, and two new view controllers, as shown\
    \ in Figure 19.24. Three controllers may seem overkill for a two-view app, but\
    \ it simplifies the project. Advantages include:\n\n+   - **Simplified memory\
    \ management.** View controller classes cannot hold pointers to themselves or\
    \ their properties after they have been released. A root controller acts as a\
    \ convenient pointer store while managing other views, making it possible to release\
    \ them safely.\n+   - **Simplified event handling.** You can include code to manage\
    \ user events in their view controller, or you can let the responder chain pass\
    \ them up to the root controller. This can simplify event handling; it is easier\
    \ to code than an explicit delegate, and it “just works.”\n+   - **Simplified\
    \ data storage.** Although it is not quite official Model-View-Controller (MVC),\
    \ you can add a data store, or an interface to a data store, to the root controller\
    \ to manage all of the app's data needs.\n\n# ## Implementing the view controllers\n\
    \nWith this design pattern in mind, you can start coding the app. Begin by defining\
    \ the extra view controllers as properties in the root by adding them to the header\
    \ file. Include an action method called showBView: that triggers the initial view\
    \ swap.\n\n```\n    @class AViewController;\n    @class BViewController;\n   \
    \ @interface FirstAppViewController : UIViewController {\n        AViewController\
    \ *aViewController;\n        BViewController *bViewController;\n    }\n    @property\
    \ (nonatomic, retain) AViewController *aViewController;\n    @property (nonatomic,\
    \ retain) BViewController *bViewController;\n    - (IBAction) showBView: (id)\
    \ sender;\n    @end\n```"
  merge: -1
  img_proc: true
- pgno: 548
  md: "# Figure 19.24\n\nThe complete class and resource list for the app includes\
    \ an app delegate, three view controller classes, and four nib files. Many apps\
    \ use a similar design, so you may want to save this project for re-use.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_548_0.png)\n\
    \nIn the implementation file, add start-up code that releases the original empty\
    \ gray view and replaces it with the contents of AViewController.xib. This code\
    \ goes into the viewDidLoad method in the root controller, which is broadly equivalent\
    \ to awakeFromNib in a Cocoa project.\n\n```\n#import \"FirstAppViewController.h\"\
    \n#import \"AViewController.h\"\n#import \"BViewController.h\"\n@implementation\
    \ FirstAppViewController\n@synthesize aViewController, bViewController;\n- (void)viewDidLoad\
    \ {\n    //Load the first view to replace the default view in the root\n    //controller\
    \ nib\n    self.aViewController = [[AViewController alloc]\n        initWithNibName:\
    \ @\"AViewController\" bundle: nil];\n    [self.view release];\n    [self.view\
    \ insertSubview:aViewController.view atIndex:0];\n}\n```"
  merge: -1
  img_proc: true
