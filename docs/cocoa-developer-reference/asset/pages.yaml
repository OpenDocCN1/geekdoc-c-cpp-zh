- pgno: 589
  md: '| Error type | Description |

    |---|---|

    | Forgotten links or bindings in Interface Builder | When you add new features
    to a view, don’t forget to link their outlets and actions in Interface Builder
    to add bindings—and don’t forget to save the nib file after editing. |

    | Missing delegate features | If a class feature isn’t working, check for and
    implement any compulsory delegate methods. |

    | Missing focus or First Responder status | Some AppKit classes may not work without
    window focus or First Responder status. Check that you’re handling these features
    correctly. |

    | Broken or misaligned Xcode links | If you import files to a project or add assets
    to it, remember to set the Path Type to `Relative to Enclosing Group`. If you
    leave it set to `Default`, you may find yourself editing files across a mix of
    project folders. Xcode doesn’t warn you when you do this. |


    ![](img/2b293e29fc15b0797f113b85dd429b6e_589_0.png)


    # TIP


    Simple mistakes can waste time, but don’t let them sap your confidence or raise
    your stress levels. Even experienced developers regularly make basic errors.


    # Managing classes and files


    Xcode doesn’t include automated support to help you manage classes, properties,
    and files. Managing them manually makes them error prone. Use these checklists
    to avoid the most common errors. The steps may seem obvious, but it’s easy to
    miss them when you’re concentrating on some other aspect of a project.


    # Including other classes in a class header


    +   - Add `#import` directives for other classes that are referenced.

    +   - Add `@class` directives for each class.

    +   - Add `#import` directives for framework headers, as needed.


    # Creating a new subclass


    +   - After you create the file, change the subclass name in the interface.

    +   - Add any delegate protocols, as needed.'
  merge: -1
  img_proc: true
- pgno: 590
  md: "# Adding new properties or methods\n\n+   - In the header file, add the property\
    \ or method between the prototype angle brackets.\n+   - Add a property declaration\
    \ in the area below the angle brackets.\n+   - In the implementation file, synthesize\
    \ the new property or add a method stub.\n+   - In Interface Builder, add new\
    \ links and bindings.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_590_0.png)\n\
    \n> **TIP**\n> \n> If you rename a method or property, use Xcode’s global Replace\
    \ All feature to rename every instance in the code. Don’t try to rename features\
    \ manually — you’re unlikely to spot every instance. To use the Replace All feature,\
    \ choose Edit > Find > Replace All.\n\n# Working in Interface Builder\n\n+   -\
    \ Reload classes whenever you add or edit a class.\n+   - Create links and add\
    \ bindings as soon as they’re needed — you may forget later.\n+   - Check that\
    \ links are connected to the correct object; for example, to First Responder rather\
    \ than File’s Owner, as needed.\n+   - Save the nib file before building.\n\n\
    # Adding frameworks\n\n+   - Remember to add frameworks to the project when you\
    \ use framework-specific features.\n+   - Remember to `#import` the framework\
    \ headers.\n\n# Getting Help\n\nWith an almost endless proliferation of blogs,\
    \ message boards, discussion groups, tutorials, and worked solutions, the Internet\
    \ is the most useful developer resource. Comments from other developers can help\
    \ shift a stuck project, and complete worked solutions may be available online.\
    \ Helpfulness varies; a minority of developers may be more interested in telling\
    \ you to RTM, and most message boards have a selection of posted problems with\
    \ no comments or replies. While the Internet is sometimes noisy and never infallible,\
    \ it remains the go-to source for help, feedback, and solutions for developers\
    \ at every level of experience."
  merge: -1
  img_proc: true
- pgno: 591
  md: '# TIP


    Searching for “OS X” or even “Cocoa” brings up many, many pages of user-level
    information, which is unlikely to be useful. To target searches more effectively,
    add “dev” or “developer” to the start of your search strings.


    Resources include:


    +   - **Blogs.** Many developers keep blogs, posting solved problems and sample
    code snippets. The iPhone developer community is particularly active, but you
    can also find Cocoa and general OS X blog content.

    +   - **Official developer forums.** Apple’s developer forums, illustrated in
    Figure B.2, are a useful resource, but they are only accessible to developers
    who are enrolled in an official developer program. The official developer community
    is still growing. For the moment, the forums are best considered a useful extra
    rather than a definitive source for solutions.


    # Figure B.2


    Apple’s forums remain slightly experimental, but they are likely to become more
    popular and useful as the iPhone and Mac developer programs continue to grow.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_591_0.png)'
  merge: -1
  img_proc: true
- pgno: 592
  md: '+   - **Unofficial developer forums.** There are tens or even hundreds of unofficial
    forums, and new forums appear regularly. CocoaDev (www.cocoadev.com), shown in
    Figure B.3, is a popular center, with an excellent collection of open-source projects.
    Don’t limit yourself to a single forum — you’ll typically get better results from
    a general Internet-wide topic search than by following postings in a single location.


    +   - **Mailing lists.** Although eclipsed by forums and blogs, lists continue
    to offer useful help and content. The Apple cocoa-dev list, shown in Figure B.4,
    has been running for ten years now; see http://lists.apple.com/mailman/listinfo/cocoa-dev
    for details.


    +   - **Usenet/Google groups.** Usenet/Google groups no longer have the prominence
    they once did and can be prone to spam, but they continue to be helpful. iPhone
    groups are more prominent than Cocoa groups, but cocoa-dev, shown in Figure B.5,
    is a useful resource for Cocoa help.


    # Figure B.3


    CocoaDev is a popular and useful online forum among the many other popular and
    useful forums available online.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_592_0.png)'
