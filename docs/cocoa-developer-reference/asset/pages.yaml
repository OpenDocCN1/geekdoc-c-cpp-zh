- pgno: 70
  md: "The Cocoa approach has advantages: it is flexible and open-ended; is able to\
    \ handle output to various devices, from printers to screens to files, automatically;\
    \ and can create advanced effects with very little code. Looked at positively,\
    \ setup code can often be reused as boilerplate. Once you have your equivalent\
    \ to a Flash stage, you can recycle the setup code in other applications with\
    \ only minor changes. Even so, allow for extra setup and teardown before you start;\
    \ there may be more than you’re expecting.\n\n# Abstraction and object orientation\n\
    \nCocoa is highly abstracted and object oriented. Relationships between causes\
    \ and outcomes are loose and can be customized. For example, an unsophisticated\
    \ operating system might include a loop that catches keyboard events into a buffer\
    \ and a minimal framework that can read and process events. Your application might\
    \ read the events and process them from the buffer.\n\nCocoa takes a much less\
    \ direct approach. Keyboard events are abstracted into messages, and your application\
    \ must include handlers for some or all of the possible messages. For example,\
    \ Cocoa’s user interface manager object NSResponder sends various messages as\
    \ a user types on the Mac keyboard, such as:\n\n```\ncancelOperation:\ncapitalizeWord:\n\
    deleteBackward:\nwillPresentError:\nyank:\n```\n\nThis list of edit control messages\
    \ includes more than 170 items. The full list of messages that NSResponder can\
    \ send runs into the hundreds and implements mouse control, touchpad control,\
    \ gesture sensing, graphics tablet control, and other standard features.\n\nThrough\
    \ abstraction, Cocoa implements much of the event processing and some of the application\
    \ design for you. Although these message names imply text editing, you could also\
    \ use them in a different application, such as a mathematical equation editor.\
    \ You can choose which messages your application responds to. If you don’t include\
    \ a handler method for a message, the message and the user action are ignored;\
    \ if you do include a handler, you can choose what it does and how it works. Cocoa\
    \ doesn’t force you to implement features that match the method names, although\
    \ it’s less confusing for the user if you do.\n\nAbstraction adds flexibility,\
    \ often in a useful way. It also adds complexity. Whereas a simple OS sets colors\
    \ with three numerical RGB components, Cocoa encapsulates color in an NSColor\
    \ object. There’s no option to set colors directly. You must create and initialize\
    \ an NSColor object, set its properties to the required components, and then use\
    \ messaging to allow other objects to read the properties — perhaps to draw a\
    \ line or to set a point. Sample code might look this:\n\n```\nNSColor *myTranslucentBlack\
    \ = [NSColor initWithCalibratedRed: 0\n    green: 0 blue: 0 alpha: 0.5];\n[receiverObject\
    \ drawSomethingWithColor: myTranslucentBlack];\n```"
  merge: -1
  img_proc: true
- pgno: 71
  md: 'This code calls the `NSColor` class to return a new `NSColor` object with translucent
    black color values. While it isn''t impossibly complex, it''s more complex than
    a hypothetical


    ```

    ```

    line (x1, y1) to (x2, y2) with 0,0,0,0.5;

    ```

    ```


    in a simpler language. If you''re managing memory manually, you must remember
    to release the color object when you no longer need it. If you''re managing memory
    with garbage collection, you still need to be careful about creating objects unnecessarily
    or inefficiently. Be especially careful around loops — creating objects within
    loops is always inefficient, and you should avoid it where possible.


    Abstraction is one of the features of OS X that contributes to the initial challenge
    of setup and teardown. It would be useful if Cocoa offered simplified classes
    and objects for common requirements. Cocoa sometimes does, but often it doesn''t.


    Generally, Cocoa tries to pack as much generality into objects as possible. The
    `NSColor` object allocated previously includes built-in support for color calibration.
    This feature is free — it''s built into `NSColor`, and calling the `initWithCalibrated:`
    method invokes it automatically. Before it returns a color object, `NSColor` refers
    to the current calibration table and adjusts the color constants accordingly.
    Other Cocoa objects are similarly rich and detailed, and they implement sophisticated
    features automatically. This is often a good and useful thing. But sometimes your
    application''s needs don''t coincide with Cocoa''s features, and you''ll either
    need to work around them or re-implement them manually.


    # ## Moving to Cocoa and OS X from Windows


    Windows development has always been pitched at two levels. Visual Basic and the
    related Visual Basic for Applications provide entry-level access. For more advanced
    developers, Microsoft has shifted emphasis toward the C# language and the .NET
    collection of frameworks.


    Visual Basic can seem very different than Objective-C, but there are familiar
    points of reference. Visual Basic applications are event driven, making them similar
    in outline to the Cocoa environment. But Objective-C and Cocoa are more precise,
    more demanding, and more complex, with many more features and objects. A good
    strategy when moving from Visual Basic is to start small and keep it simple. Instead
    of immediately trying to build an entire application, begin by creating very simple
    application skeletons. Flesh them out gradually with features — menu support methods
    controls, more complex views — working back from the interface toward media and
    animation support, data management, and finally networking and hardware. You''ll
    find this strategy used in the rest of this book.


    For more experienced developers, C# is recognizably similar to Objective-C. But
    there are obvious differences in syntax and concept. For example:


    ```

    ```objc

    aClass.aMethodWithAParameter(20);    //C#

    [aClass aMethodWithAParameter: 20];   //Objective-C

    ```

    ```


    In Objective-C, class prototypes and implementations are split into separate header
    and implementation files. This is an Objective-C tradition rather than a language
    feature, but most developers follow it. Elsewhere, Objective-C lacks C#''s generics;
    classes can accept untyped'
  merge: -1
