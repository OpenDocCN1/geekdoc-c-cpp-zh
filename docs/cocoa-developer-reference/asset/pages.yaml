- pgno: 62
  md: '# ### Key-value pairs in data objects


    Although it’s possible to use objects as keys in certain contexts — for details
    see Chapter 12 — a key is usually an NSString used as an identifier. Keys must
    be unique because there is no way to distinguish between identical strings. A
    value is any Objective-C object. C data types must be “objectified” before they
    can be used as a value, wrapped in an instance of NSValue or NSNumber. Chapter
    12 includes sample code for this.


    A key-value pair links keys to values, making it possible to read or write the
    values using the key as a reference. Key-value pairs are used throughout Cocoa.
    They’re one of Cocoa’s fundamental data idioms and are accessed through forKey:
    statements:


    ```

    ```

    //Set aKeyName to aValue

    [myObject setValue: aValue forKey: @"aKeyName"];


    //Read the value of aKeyName and copy it to aReturn

    aReturn = [myObject valueForKey: @"aKeyName"];

    ```

    ```


    > > **NOTE**

    > > You can see in this example how the text strings are “objectified” with the
    @ character.


    All Objective-C objects implement a related but different form of key-value access,
    which supports named property access. Most object-oriented languages support direct
    property access, as shown in Figure 2.8.


    **Figure 2.8**


    Simple direct property access is implemented in Objective-C. But key-value pairs
    also allow more complex kinds of access.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_62_0.png)


    This is also available in Objective-C. But Objective-C also supports indirect
    property access through the key-value system. If myObject has a property called
    thisProperty, you can set it with


    ```

    ```

    [myObject setValue:aValue forKey:@"thisProperty"];

    ```

    ```


    Figure 2.9 illustrates visually how key-value access works. The key string must
    match the property name. As long as there’s a matching name, you can use this
    feature to access any property in any object. This feature is called *key-value
    coding*. It’s built into Objective-C, and all objects support it.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Figure 2.9


    Indirect property access with a key uses a text string. The text string doesn’t
    have to be a string literal; it can also be a mutable string.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_63_0.png)


    Cocoa’s data objects support a third kind of key-value storage, in a separate
    data area. Many Cocoa class definitions include lists of predefined keys. For
    these objects, dictionaries stand in for a separate list of pseudo-properties.
    Instead of triggering a response from an object by modifying its properties directly,
    you create a dictionary, fill it with key-value pairs using the list of defined
    key constants in the class documentation, and pass the dictionary to the object
    in a message. When the object receives the dictionary, it unpacks it, reads the
    values for each key, and responds accordingly. Figure 2.10 illustrates this.


    # Figure 2.10


    Many Cocoa objects use key-value pair dictionaries to implement “pseudo-properties.”
    Some objects also return data in a dictionary, and you’ll need to search the dictionary
    for specific keys to read them as “properties.”


    ![](img/2b293e29fc15b0797f113b85dd429b6e_63_1.png)


    In code, this approach looks like this:


    ```

    ```

    [myDictionary setValue:value1 forKey:@"property1"];

    [myDictionary setValue:value2 forKey:@"property2"];

    ...

    [anObject doSomethingWithTheValuesIn: myDictionary];

    ```

    ```


    “Pseudo-property” dictionaries are used throughout Cocoa, most obviously in the
    media layer, where they’re used to control animation, video, and sound features,
    but also in the network management frameworks and in some user interface objects.'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'Cocoa uses this indirect approach to save memory. It’s an efficient solution
    when objects have hundreds of possible properties but only use a few at a time.
    For example, a multiformat video player object might need to support a number
    of different video file formats, each with a different set of properties. It would
    be possible to define the player object with a complete set of properties for
    every possible format, but this would be wasteful. It would also be difficult
    to maintain and might break backward compatibility.


    It''s more efficient to define a player object with a single property dictionary.
    As new formats are supported, the possible key-value pairs for each format in
    the dictionary can be updated without changing the object''s interface. The key-value
    and dictionary system provides a flexible alternative to a list of fixed object
    properties, at the cost of some extra setup and teardown.


    # Objective-C memory management


    Garbage collection — automated memory cleanup of unused objects — arrived relatively
    recently in Objective-C, and largely code continues to use an older reference
    counting model to manage memory. If you’re developing for the Mac, you can now
    use garbage collection to clean up memory for you. If you’re developing for the
    iPhone, you don’t get a choice — garbage collection isn’t available, and reference
    counting is the only option.


    The theory of reference counting is simple. Every time you reference an object,
    it increments a hidden counter. When you no longer need the object, you release
    it with


    ```

    [anObject release];

    ```


    When the reference counter reaches zero, the object is removed from memory. It’s
    an obvious and easy mistake to assume that using release releases the object immediately,
    but in fact it doesn’t — it tells Cocoa that your code is no longer referencing
    the object, and that it may be released.


    In theory, you should always be able to balance references and release calls.
    In practice, sometimes you can’t without obsessively tracing all possible execution
    paths. In some applications, you may not be able to balance them at all because
    Cocoa’s referencing mechanism may not work as you expect it to. Occasionally it
    doesn’t work as it’s supposed to, making memory errors inevitable.


    It’s often easier to create objects when your application starts up, and release
    them when it terminates. Officially, this is considered bad practice — resources
    should ideally be created or loaded when needed and released when not used — but
    sometimes it can be a practical way to make memory management tractable.


    For similar reasons, it’s good practice to avoid creating objects inside loops.
    This applies whether memory is managed manually or automatically. It’s more efficient
    to update or re-use an object inside a loop than to create it and release it repeatedly.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_64_0.png)


    # CAUTION


    Creating objects repeatedly inside a loop and never releasing them is a good way
    to waste memory, slow your application to a crawl, and generate random crashes.'
  merge: -1
  img_proc: true
- pgno: 65
  md: "Whether you choose to use reference counting or are forced to use it, expect\
    \ to spend many hours debugging memory leaks and fixing random crashes. Windows,\
    \ Java, Flash, and Unix all include garbage collection. It can be challenging\
    \ to have to get used to managing memory without automation. On the iPhone, this\
    \ is one of Objective-C’s weakest and least appealing features. Fortunately the\
    \ Xcode development tools include a set of applications that simplify testing\
    \ and make it easier to monitor and track memory leaks.\n\n# Objects and conditionals\n\
    \nYou can’t create objects within a conditional block and refer to them outside\
    \ it. For example, in\n\n```\nif (condition) {\n    createAnObject;\n    doOtherStuff...\n\
    }\ndoStuffWithTheNewObject;\n```\n\nthe compiler can’t be sure if the object will\
    \ exist outside of the conditional. It assumes that it doesn’t, and reports an\
    \ error.\n\n# Cocoa file management\n\nCocoa includes a file selector object that\
    \ loads and displays a standard OS X file list. Under the hood, file management\
    \ is less conventional. Files aren’t saved but archived. Archiving automatically\
    \ includes a conversion stage that transforms an object or collection in memory\
    \ into bytes on disk. Loading a file invokes a de-archiver that reverses the process.\n\
    \nThis may appear indirect, but it’s an example of Cocoa’s emphasis on abstraction.\
    \ When you’re saving an image to disk, you always need to convert it to a standard\
    \ graphic file format before writing it out. Cocoa makes it easy to do this; for\
    \ example, it includes a JPEG archiver. You can also create your own archiving\
    \ and de-archiving code for custom file formats.\n\n# Cocoa archiving\n\nCocoa’s\
    \ data objects include built-in archiving. For example, you can write a dictionary\
    \ to disk with\n\n```\n[aDictionary writeToFile: aFilePathString atomically: YES];\n\
    ```\n\nThis automatically archives the dictionary and writes it to a file in a\
    \ format that can be read back with a corresponding\n\n```\nthatOldDictionary\
    \ =\n[NSDictionary dictionaryWithContentsOfFile: aFilePathString];\n```\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_65_0.png)\n\
    \n# NOTE\n\nThe atomically parameter selects a two-stage write that attempts to\
    \ write a complete file, and then renames it to the specified file name if the\
    \ write succeeds. If the write fails, the file fragment is deleted. This guarantees\
    \ that files on disk are always complete."
