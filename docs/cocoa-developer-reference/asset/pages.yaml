- pgno: 230
  md: "# # Using Cocoa Design Patterns and Advanced Messaging\n\n> > It’s traditional\
    \ in a Cocoa book to mention design patterns and\n> > features such as Model-View-Controller\
    \ (MVC), target-action,\n> > Key-Value Coding (KVC), and Key-Value Observing (KVO).\n\
    \nApple’s documentation mystifies these design patterns and makes them seem more\
    \ difficult and complex than they really are. They’re an essential part of Cocoa,\
    \ and you can use them to implement impressively efficient code. But the practice\
    \ can be much simpler than the theory.\n\n# ## Understanding Model-View-Controller\n\
    \nModel-View-Controller, often shortened to MVC, was introduced in Chapter 2.\
    \ The outline of MVC is shown in Figure 9.1. An application is split into three\
    \ elements — a store of data called a model, an interface called a view, and a\
    \ controller object that passes data between them.\n\nMVC implies, but doesn’t\
    \ enforce, the suggestion that model data should be kept in separate objects and\
    \ perhaps in separate custom classes.\n\nIn a simple application, this seems unnecessarily\
    \ complex, because it is. If your data is in a single array or dictionary, there’s\
    \ nothing to be gained by taking a data object out of the App Delegate and putting\
    \ it into a separate wrapper object. It can be useful in a larger application\
    \ to keep data in a separate data-handling class. But generally, the key feature\
    \ of MVC isn’t how the data is stored but how it’s processed and prepared for\
    \ display by the controller.\n\n+   **In This Chapter**\n+   \n+   - Understanding\
    \ Model-View-Controller in Cocoa\n+   - Understanding and using target-action\n\
    +   - Using Key-Value Coding\n+   - Using Key-Value Observing\n+   - Working with\
    \ notifications and errors"
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Figure 9.1


    MVC in outline form. The model and the view don''t communicate directly. The key
    to MVC is implementing an efficient and, optionally, creative controller design.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_231_0.png)


    A controller can do more than link the view and the model. When MVC is done properly,
    the controller layer adds useful benefits, typically some of the following:


    +   - **Increased efficiency.** The controller can select some of the data for
    display, as needed, rather than attempting to access all of it at every refresh.
    Typically a table displays a small selection of values from a data source. A well-designed
    controller accesses only the values it needs to create a useful display or implement
    an editing feature.

    +   - **Abstraction and reuse.** The same controller code and view objects can
    be reused and can work with different data sources.

    +   - **Format translation.** A simple controller can support multiple types,
    interconverting between strings, number values, and Booleans. A more complex controller
    can take a list of numbers and convert them into a table, a scatter plot, a graph,
    and so on, suitable for display by an appropriate view object.

    +   - **User control.** A controller can manage selection events, handle multiple
    selections, and implement editing operations. It can also sort values for display,
    and it can optionally produce other summary displays, such as averages.'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'To use MVC effectively, concentrate on the controller code and consider how
    it can add value to your application. Figures 9.2 to 9.4 outline some practical
    examples.


    # **Figure 9.2**


    Using MVC in a game. The controller translates the game data into a format that
    can be processed by the game’s rendering engine, and it maintains the viewport
    properties that define the view of the game world seen by the user.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_232_0.png)


    # **Figure 9.3**


    Using MVC to manage a database. MVC is a natural design pattern for databases.
    The controller manages edit events and can reinterpret the data to display it
    in various ways, for example, as graphics, tables, sorted summaries, and so on.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_232_1.png)'
  merge: -1
