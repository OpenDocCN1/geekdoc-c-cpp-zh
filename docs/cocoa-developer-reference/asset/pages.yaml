- pgno: 24
  md: '# # Introducing Cocoa


    Apple''s Cocoa technology is one of computing''s success stories. When OS X 10.0
    was released in 2001, it immediately revolutionized the look and feel of desktop
    applications. Since then, other operating systems have borrowed freely from Cocoa''s
    innovations. Apple has continued to innovate with the iPhone and iPad, introducing
    Cocoa Touch for mobile devices. Cocoa Touch offers a simplified and more tactile
    user experience, and is the first popular and successful attempt to move beyond
    a traditional window, mouse, and menu interface. Future versions of Cocoa on the
    Mac are likely to blend the iPhone''s tactile technology with the sophisticated
    data handling, 64-bit memory management, and rich user interface options that
    are already available to Cocoa developers. Cocoa is widely used in Apple''s own
    projects, and it determines the look and feel of an application such as Aperture,
    shown in Figure 1.1.


    # ## Introducing Cocoa


    Cocoa is the collection of libraries and design principles used to build skeleton
    Mac applications, create and display a user interface, and manage data. Cocoa
    is also a design philosophy based on unique ideas about application design and
    development that you can find throughout the rest of this book. You don’t need
    to understand Cocoa’s history to use the Cocoa libraries, but their features may
    be easier to work with if you do.


    # ### In This Chapter


    +   - Introducing Cocoa

    +   - Understanding Cocoa’s history

    +   - Profiting from Cocoa

    +   - Introducing Xcode and the Apple developer programs


    # ## Understanding Cocoa’s history


    Cocoa’s origins can be traced to the mid-1970s and are closely tied to the history
    of the Objective-C programming language. Cocoa and Objective-C are used at different
    levels. Cocoa is a code library and a set of interface and development guidelines.
    Objective-C is the language that implements them.


    Cocoa is now available for other languages, including JavaScript, Python, and
    Ruby on Rails, but most Cocoa developers continue to work in Objective-C because
    its syntax and features are a natural fit for Cocoa projects.'
