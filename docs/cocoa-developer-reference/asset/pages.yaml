- pgno: 97
  md: '# Alternatives to Xcode


    If you don''t own a Mac, you can use GNUstep to experiment with Objective-C and
    to develop very simple Cocoa applications. This is a valid option for Windows
    and Linux users, but unfortunately GNUstep is a poor substitute for Xcode. It
    lacks the function libraries that support Cocoa on the Mac, it doesn''t include
    any of Cocoa''s more recent classes and features, and it doesn''t implement the
    Aqua interface or most of the OS X layers and frameworks. Without Aqua, GNUstep
    applications have the look and feel of NeXTStep applications from the early 1990s,
    and there''s no support for some of the recent core Cocoa features.


    Xcode includes a sophisticated integrated editor, while GNUstep uses the free
    jEdit editor. Both environments rely on a version of the GCC (GNU Compiler Collection)
    compiler, but there are subtle differences between the two versions. Code is approximately
    compatible, but not all of Objective-C''s features are implemented in an identical
    way.


    Compared to Xcode, GNUstep is a very limited environment. Some of the examples
    in this chapter are compatible with GNUstep, but most of the code in later chapters
    isn''t. If you have no other option or if you want to try out some very simple
    examples, you can use GNUstep to get started with Cocoa. But if you want to develop
    applications for other users, either for fun or for profit, you''ll need a Mac
    and a copy of Xcode.


    OS X developers can create working applications in alternative environments such
    as Mono. Mono is an alternative set of libraries that have been partly reimplemented
    with Cocoa elements. But code written in Mono doesn''t call on Cocoa''s features
    directly. Mono is a valid alternative for simplified cross-platform development,
    but it doesn''t support many standard Cocoa and OS X features and is an inefficient
    choice for high-performance applications, or for applications that rely heavily
    on the Cocoa and OS X media and animation features.


    iPhone OS developers have always had more limited choices. Because Objective-C
    and Cocoa Touch are relatively complex and programmed at a low level, various
    simplified alternative SDKs and frameworks have appeared, such as Cocos2D, Flash
    for iPhone, and Ansca Corona. Projects built with these SDKs have been accepted
    in the App Store.


    At the start of 2010, Apple announced a new Xcode-only policy for iPhone apps.
    Only Objective-C, C, C++, and native Apple Java apps are allowed. Alternative
    SDKs and frameworks are banned from the App Store. It''s not clear how rigidly
    this policy will be enforced, or whether previously accepted non-Xcode apps will
    also be banned. But developers should keep in mind that Apple is emphasizing that
    Xcode and Objective-C are the definitive development environment, and attempting
    to use an alternative for commercial projects is now very risky.


    > **TIP**

    > If you bought a Mac before 02 2010, it''s likely that you''ll have the OS X-only
    version of Xcode on the OS X support DVD bundled with your system. It may not
    be up to date, and some features may not be an exact match for the descriptions
    in the rest of this book, but if you''re experimenting rather than creating code
    for release, you can use this version to bypass developer signup and a subsequent
    download. Look for the Xcode .mpkg file in the Optional Installs folder. You can
    update this version later, if you choose to.


    Although Xcode runs on any Intel Mac from a Mac mini upward, compilation is a
    processor- and disk-intensive process. OS X development is demanding, and the
    faster your Mac runs, the less time you''ll spend waiting for each build. This
    is less true of iPhone apps, because they''re simpler and more compact. After
    an initial compilation run, recompiling an iPhone OS app after a minor edit can
    be almost instant, even on slow hardware.'
  merge: -1
  img_proc: true
