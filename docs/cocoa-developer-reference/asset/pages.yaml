- pgno: 502
  md: "# Using Instruments\n\nXcode includes a suite of performance tools that can\
    \ report on almost every aspect of application performance. The tools are listed\
    \ separately, but they run as a single tool with multiple snap-in options. To\
    \ run a tool, choose Run > Performance Tool in Xcode. Xcode launches your application\
    \ and launches the tool at the same time, linking the two so that the tool automatically\
    \ starts collecting information. Figure 18.13 shows the instruments available\
    \ in OS X. Figure 18.14 shows the smaller list available to iPhone developers.\n\
    \n> **TIP**\n> \n> You can combine options to create a customized tool that displays\
    \ any combination of performance metrics. Choose Instrument > Build New Instrument.\
    \ Each probe is a separate metric. Choose the metrics from the “of type” menu.\
    \ Advanced developers can add customized scripting for each probe.\n\n# Figure\
    \ 18.13\n\nThe instruments available to OS X developers. OS X developers can monitor\
    \ threads, crashes, and multicore performance.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_502_0.png)"
