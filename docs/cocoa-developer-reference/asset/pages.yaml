    # Selling in the App Store


    Anyone who has qualified for the $99 Standard Developer Program annual fee can
    submit an app to the App Store. Not all apps are accepted. According to Apple,
    approximately 95 percent of submitted apps pass certification, with an average
    approval time of two weeks. Apps may be refused because of one or more of the
    following reasons:'
  merge: -1
  img_proc: true
- pgno: 558
  md: '+   - **Bugs and limited functionality.** If the app crashes during testing
    or its features do not match its description, it is refused.

    +   - **Unacceptable content.** Apple rates apps and uses an approval grid to
    check for adult features, representations of real or simulated violence, and other
    criteria. Access for minors is controlled. Apps that cannot be rated are not accepted.

    +   - **Unacceptable commercial features.** Apps that use excessive cellular bandwidth
    or conflict with the current or future plans of Apple and its mobile partners
    are not accepted.

    +   - **Unacceptable software features.** Apps that use undocumented API (Application
    Programming Interface) calls or non-Apple frameworks are not allowed.


    There is no way to buy, sell, or load apps independently without *jailbreaking*
    — downloading a tool to hack the security of — — an iPhone. Jailbreaking is inherently
    risky and may *brick* (lock) a phone permanently. An alternative developer network
    exists for jailbroken phones, with its own alternative app market, but it is much
    smaller than Apple’s App Store and is not officially supported.


    Figure 19.32 shows the Developer Program Web site.


    # Figure 19.32


    The Developer Program Web site includes links to iTunes Connect for App Store
    uploads and the Developer Program Portal for security and provisioning at the
    top right of the page.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_558_0.png)'
  merge: -1
  img_proc: true
- pgno: 559
  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_559_0.png)


    # CAUTION


    Jailbroken phones are relocked by each new official iOS update, wiping existing
    unofficial apps. There are advantages to jailbreaking, including open app development
    and simple Unix shell access to the iPhone’s file system, but jailbreaking remains
    more of a hobbyist and enthusiast interest and has had a minimal impact on the
    main app market.


    # Understanding certificates, provisioning\nprofiles, and permissions


    Before you can submit an app to the App Store, you should test it on hardware
    and then create a special App Store distribution build. Testing and distribution
    are controlled with code signing technology. Apps run on the Simulator without
    code signing, but can only be tested on hardware devices after a complex certification
    process. This gives Apple more control over the app market — permission to test
    and sell apps can be revoked without notice — but it also complicates development.


    You can manage code signing permissions and files in the *iPhone Developer Program
    Portal*, which is listed as a link on the main iPhone Dev Center Web page. Creating
    a full set of permissions isn’t simple, but most of the steps are a one-time requirement.


    The full set of permissions includes:


    +   - **A Developer Certificate.** Needed to test apps on hardware.\n- **A Distribution
    Certificate.** Used to create a distribution build of an app, ready for uploading
    to the App Store.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_559_1.png)


    # NOTE


    Developer and Distribution Certificates are mutually exclusive — an app can only
    be signed with one or the other. When you create a distribution build for the
    app Store and sign it with a Distribution Certificate, you cannot run that build
    on a device. The only way to run a distribution build is to buy it from the App
    Store. Fortunately, promotional certificates are available in iTunes Connect,
    and you can use them to “purchase” your own apps for free. Unfortunately, they
    are only valid in the U.S. iTunes Store.


    +   - **An App ID.** A short identification string. A single wildcard App ID can
    be used as a placeholder for an app’s Bundle Identifier in Xcode, and you can
    use the same ID in all of your apps.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_559_2.png)


    # NOTE


    If you use Apple’s Push Notification or In-App Purchase services, which allow
    users to buy content from an online store in their apps or receive event notifications
    from a Web server, you must create a unique ID for each app.


    +   - **A Device List.** Keeps a list of your test devices. You can add up to
    100 devices per year. Figure 19.33 illustrates how to find and copy a device ID
    in Xcode.\n- **A Provisioning Profile.** A temporary key imported into Xcode and
    installed on your hardware devices. It includes a copy of the ID in your Developer
    Certificate and a list of your devices. When the two match, Xcode allows you to
    install your app on a hardware device, and the device allows you to run it. A
    Provisioning Profile expires after three months. Apps built with it stop working.'
  merge: -1
  img_proc: true
- pgno: 560
  md: '**Figure 19.33**


    Highlighting a device ID to copy it when you create a device list. When the online
    wizard creates a provisioning profile, download it and drop it onto the Provisioning
    Profiles item in the left-hand pane.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_560_0.png)


    # ## Generating and using certificates and permissions


    Apple has now automated this process and created an online Assistant that takes
    you through it step by step, as shown in Figure 19.34. When the Assistant completes,
    you can download a profile to your desktop.


    Xcode projects include a Code Signing selection feature in the Project Properties
    dialog. Choose your Developer Certificate here, while you are creating a project,
    and your Distribution Certificate before the final App Store build. Xcode reads
    the certificates from your keychain and builds your user keys into each app.


    To install a Provisioning Profile in Xcode, choose Window→Organizer. Drag and
    drop the provisioning profile file from the desktop onto the Provisioning Profiles
    item under IPHONE DEVELOPMENT. When an app builds for a device target, Xcode automatically
    tags it with the profile.'
  merge: -1
  img_proc: true
