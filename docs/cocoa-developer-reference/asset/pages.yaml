- pgno: 205
  md: "# Understanding links, outlets, and actions\n\nWhen you link nib objects to\
    \ code, every active object in the nib must have a counterpart in code. In this\
    \ example nib, there are two buttons and a text field, so you must declare two\
    \ button objects and a text field object in the code. As mentioned earlier, “dumb”\
    \ non-interactive objects don’t require code, but active objects must have a code\
    \ counterpart, and you must link the counterpart to its associated object in IB.\n\
    \nLinks have two ends and two types. Outlets are used to read and set object properties.\
    \ Actions are used to respond to messages. At the code end, outlets are defined\
    \ using the `IBOutlet` directive. Actions are defined with `IBAction`, but this\
    \ isn’t always obligatory. At the nib file end, links are defined using a visual\
    \ linking tool.\n\nFigure 8.11 illustrates how outlets and actions are used. Outlets\
    \ define a unique link between an object referenced in code and an object in the\
    \ nib file. Outlets have exactly one object at each end of the link. Actions have\
    \ a single destination — an event handling method — but can be triggered from\
    \ multiple sources.\n\nFigure 8.11\n\nTypical design patterns for outlets and\
    \ actions. This figure shows the simplest and most common design pattern. More\
    \ complex patterns are also supported; for example, received actions are processed\
    \ inside an object, rather than being sent to another object.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_205_0.png)\n\
    \n> **TIP**  \n> Technically, `IBOutlet` tells the compiler to leave a pointer\
    \ undefined at compile time. Cocoa’s nib loader returns the value at runtime when\
    \ the nib loads. `IBAction` is a method placeholder. Objective-C calculates all\
    \ method addresses at runtime, so the directive is largely for clarity.\n\n# Using\
    \ IBOutlet and IBAction\n\nTo create an outlet, insert the `IBOutlet` directive\
    \ into an object’s property declaration. Replace\n\n```\n```objc\n@property (assign)\
    \ AClass *anInstance;\n```\n```\n\nwith\n\n```\n```objc\n@property (assign) IBOutlet\
    \ AClass *anInstance;\n```\n```"
  merge: -1
  img_proc: true
- pgno: 206
  md: "That’s all that’s required. The rest of the process is completed in IB.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_206_0.png)\n\n# TIP\n\nAlthough it’s\
    \ trivially easy to create an outlet, it can be harder to remember that you need\
    \ to do it. If you follow the checklist in Figure 8.2, you won’t forget.\n\n`IBAction`\
    \ is more complex. In certain circumstances, the `IBAction` directive is optional,\
    \ and a conventional `void` method is an acceptable substitute. This feature is\
    \ implemented differently on the iPhone and on OS X. On the Mac, Interface Builder\
    \ recognizes a method as an `IBAction` as long as it has the following signature:\n\
    \n```\n```objc\n-(void) methodName: (id) sender;\n```\n```\n\nYou don’t need to\
    \ replace `void` with `IBAction`, but actions must have this signature to be recognized.\
    \ No variation is allowed. The sender parameter holds a pointer to the object\
    \ that triggered the message. Applications are described next.\n\nThis auto-recognition\
    \ feature is implemented on the iPhone. You must include the `IBAction` directive.\
    \ However, you can specify actions that don’t take a parameter. For example:\n\
    \n```\n```objc\n- (IBAction) methodName;\n```\n```\n\nis valid on the iPhone only.\
    \ The `sender` parameter is discarded.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_206_1.png)\n\
    \n# NOTE\n\nMore information about `sender` appears later in this chapter.\n\n\
    # Defining outlets and actions in the interface\n\nTo keep the application as\
    \ simple as possible, you’ll implement the counter within the application delegate.\
    \ In a typical application, the delegate would be reserved for system messages,\
    \ and the counter features would be implemented in a subclassed window or a custom\
    \ view. In practice, this means subclassing at least one extra object, and doesn’t\
    \ add anything to the functionality or efficiency of the application. For this\
    \ example only, you’ll keep the supporting code in the delegate.\n\nClick CounterAppDelegate.h.\
    \ An outlet to the window object is already defined, so you can see an example\
    \ of the correct syntax. Add declarations for an `NSTextField`, and two `NSButtonCell`\
    \ objects, as follows:\n\n```\n```objc\n#import <Cocoa/Cocoa.h>\n@interface TimerAppDelegate\
    \ : NSObject <NSApplicationDelegate> {\n    NSWindow *window;\n    NSButtonCell\
    \ *startButton;\n    NSButtonCell *stopButton;\n    NSTextField *countText;\n\
    }\n```\n```"
  merge: -1
  img_proc: true
- pgno: 207
  md: "```\n```objc\n@property (assign) IBOutlet NSWindow *window;\n@property (assign)\
    \ IBOutlet NSButtonCell *startButton;\n@property (assign) IBOutlet NSButtonCell\
    \ *stopButton;\n@property (assign) IBOutlet NSTextField *countText;\n@end\n```\n\
    ```\n\n> **NOTE**\n> \n> You’re creating outlets to button cell objects and not\
    \ to button objects because the cell objects are the active and editable element\
    \ in many IB objects, including button groups. You can only set the text of a\
    \ button by modifying the cell object inside it. However, this rule of thumb isn’t\
    \ completely consistent. The text field includes a cell, but it’s easier to ignore\
    \ it and set the text with a direct outlet to the field itself.\n\nHow do you\
    \ know the names of the objects in the nib? The names are listed in the right-hand\
    \ column in the Doc window, as shown in Figure 8.12. Click the reveal triangle\
    \ for Window (Counter) and for all of its subobjects. The Type column lists the\
    \ object names. When you add objects to a nib, you can use this feature to read\
    \ their names, if you don’t know them already.\n\n> **NOTE**\n> \n> While you\
    \ must use standard Cocoa object names, you have a free choice of pointer names.\
    \ This example uses self-explanatory names for clarity, but these names are arbitrary.\n\
    \n# Figure 8.12\n\nTo find object names, look in the Type column.\nYou must use\
    \ the same object names when you\ncreate outlets in your code.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_207_0.png)"
  merge: -1
  img_proc: true
- pgno: 208
  md: "You’ll also define three action methods — one that will be triggered from a\
    \ button to start the count, one to stop the count, and one to reset the count.\
    \ Add these three signatures after the property declarations, but before the @end\
    \ directive:\n\n```\n```\n- (void) startCount: (id) sender;\n- (void) stopCount:\
    \ (id) sender;\n- (void) resetCount: (id) sender;\n```\n```\n\nThis completes\
    \ the interface, which is shown in Figure 8.13. Choose File ⇨ Save to save the\
    \ file.\n\n# Figure 8.13\n\nThe completed interface for the timer project. Outlets\
    \ and actions are defined, but not yet implemented.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_208_0.png)\n\
    \n> **NOTE**\n> \n> Although there are three methods, there are only two buttons.\
    \ In this example, I’ll demonstrate how to switch methods dynamically, reprogramming\
    \ a button to trigger two different methods depending on the state of the timer.\
    \ It’s just as practical to create a separate reset button, but the dynamic option\
    \ is more powerful."
  merge: -1
  img_proc: true
- pgno: 209
  md: "# ### Defining outlets and actions in the implementation\n\nTo complete the\
    \ first stage of the code, you'll add the new objects to the implementation and\
    \ create method stubs for the new methods. At this stage in the development workflow\
    \ you have two choices: You can create a stub-filled prototype implementation,\
    \ add links to it in Interface Builder, and then return to the code to complete\
    \ the implementation; or you can write a first draft of the code, add links in\
    \ Interface Builder, and run a test build.\n\nBoth approaches are valid, but the\
    \ first is simpler and easier to manage because you can add code features in stages,\
    \ implementing and testing each method and each event separately. The second approach\
    \ is better suited to implementing handler methods with working code copied from\
    \ an existing application. You'll use the first approach here.\n\nSelect CounterAppDelegate.m\
    \ in Xcode. Start by adding the new pointers to the @synthesize directive in the\
    \ file. Next, add a stub for each method. The final implementation should look\
    \ like this:\n\n```\n```objectivec\n#import \"CounterAppDelegate.h\"\n@implementation\
    \ CounterAppDelegate\n@synthesize window, startButton, stopButton, countText;\n\
    - (void)applicationDidFinishLaunching:(NSNotification *)aNotification {\n    //\
    \ Insert code here to initialize your application\n}\n- (void) startCount: (id)\
    \ sender{\n}\n- (void) stopCount: (id) sender{\n}\n- (void) resetCount: (id) sender{\n\
    }\n@end\n```\n```\n\nSave the file. Now you're ready to link the code to the objects\
    \ in Interface Builder. Following is a recap of what you've done so far:\n\n+\
    \   1. Added an object for each \"live\" object in the nib\n+   2. Created pointers\
    \ for those objects\n+   3. Added an IBOutlet directive for each object\n+   4.\
    \ Defined some action methods in the interface\n+   5. Created a stub implementation\
    \ for each method\n\nThis checklist is the bare minimum needed to create code-side\
    \ objects ready for linking. As you can see, this isn't an elegant or simple process\
    \ — and there are more stages to come when you finish the nib-side links. Unfortunately,\
    \ there is no other way to work with nib files. You must work through these steps\
    \ carefully whenever you design a nib and create supporting code for it. With\
    \ practice, the process becomes easier."
  merge: -1
  img_proc: true
- pgno: 210
  md: '# # Creating links in Interface Builder


    The nib-side linking process begins when IB loads the current class headers. Behind
    the scenes, it scans them and creates a list of possible link destinations. The
    destinations are listed in various pop-up menus in IB. To create a link, you drag
    a line from a link destination to a target object. When linking actions, you select
    the action from a separate floating pop-up menu that appears over the target object.


    Take a look at how this works in practice. Begin by choosing File ↻ Reload All
    Class Files in IB. This runs the scan and creates the link list. This process
    is invisible — IB provides no feedback while it’s happening, although for larger
    projects, the spinning beach ball icon may appear while you wait for the process
    to complete. The scan is also run automatically whenever IB loads, and when you
    double-click a nib file in Xcode to open it for editing.


    In the Doc window, select the Counter App Delegate object. In the Inspector window,
    select the Connections tab (the one with the right-pointing arrow, second from
    the right). Figure 8.14 shows the result. The link destinations in the Application
    Delegate are listed in the window.


    **Figure 8.14**


    A list of link destinations. The outlets and actions are listed in separate sections.
    Some links already exist; they’re built into the template to save you time, so
    you don’t need to add them by hand.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_210_0.png)'
  merge: -1
  img_proc: true
