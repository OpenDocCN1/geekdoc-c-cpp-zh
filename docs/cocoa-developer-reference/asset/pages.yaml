    # Using Advanced UI Techniques


    To create a basic UI in OS X and on iPhone OS, you need to know how to use the
    following:


    +   - Selectors

    +   - Cell objects

    +   - Delegate objects, delegate messages, and `self`

    +   - Outlets

    +   - Actions

    +   - Visual nib layout

    +   - Attribute settings

    +   - Linking


    With these core skills, you can add almost any interface object to a Cocoa UI
    and create supporting code for it, using the documentation as a reference. For
    example, you can now create customized menus by changing the menu labels, adding
    and removing menu items, and defining selectors for active menu items.


    But other Cocoa object interfaces aren’t implemented consistently, and some objects
    require special tricks or knowledge. With these core skills, you can understand
    what needs to be done in outline, even when it’s not obvious how it needs to be
    done in practice.'
