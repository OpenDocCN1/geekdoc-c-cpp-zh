  md: '```

    ```objc

    - (void) connectionDidFinishLoading:(NSURLConnection *)connection

    {

    //Process the data here

    }

    ```

    ```


    Key features of the code include:


    +   - The connection requires two objects: a URL request and a URL connection.

    +   - The NSURLRequest object defines the properties of the connection, including
    the URL and the timeout interval. If the request doesn''t complete before the
    end of the timeout interval, the request fails.

    +   - The request object also defines the caching policy. Here, the cache is set
    to reload at every attempt because caching API returns can be risky, especially
    if the remote data is transient.

    +   - The request is passed to an NSURLConnection object, which initiates the
    connection. It specifies a delegate object for the connection, which monitors
    the connection status and receives data as it arrives.

    +   - Four delegate methods manage the connection.

    +   - `connection:didReceiveResponse:` is triggered by an active new connection,
    and it resets the data receiver object.

    +   - `connection:didReceiveData:` appends data to the data object as it arrives.

    +   - `connection:didFailWithError:` reports an error code.

    +   - `connectionDidFinishLoading:` is triggered after the data has been received
    successfully.


    Although this is byte-level Web access — you can use NSData in a general way to
    receive data of any format — you can use this code to manage almost any asynchronous
    Web request.


    # Using Cocoa’s XML classes


    Cocoa’s XML implementation is complex, partly because XML can be complex. The
    core class is NSXMLDocument, which can be loaded using the initWithData: method.
    While it’s possible to extract data into supporting data types such as NSXMLElement
    and NSXMLNode, this isn’t necessary for a simple task, such as retrieving the
    text between two tags. It’s possible to scan the XML document directly using a
    query framework called XPath, which is built into NSXMLDocument.


    XPath is a standard Web technology. A JavaScript version is built into all standard
    Web browsers. An XPath search assumes that the data in an XML file is formatted
    in a path-like structure. Queries pass a path to the document, and the search
    returns the data at that path.'
  merge: -1
  img_proc: true
- pgno: 282
  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_282_0.png)\n\n# CAUTION\n\nNeither\
    \ NSXMLDocument nor nodeForXPath: are available on the iPhone. Use NSXMLParser—a\
    \ dynamic parser class that takes an XML string and triggers various delegate\
    \ methods as it scans it—instead. NSXMLParser is more lightweight than NSXMLDocument,\
    \ but less convenient. To extract specific elements, you must add explicit switches\
    \ or conditional tests to the delegate methods.\n\nSample code to extract a text\
    \ string from the url tag follows:\n\n```\n```objc\n theDocument = [[NSXMLDocument\
    \ alloc] initWithData:theData\n     options:NSXMLDocumentTidyXML error:&theError];\n\
    \n if (theDocument) {\n     //We have a valid document\n     NSLog(@\"The XML\
    \ doc: \\r%@\", theDocument);\n     //Get the text string within the url tags\n\
    \     NSArray *someNodes = [theDocument\n     nodesForXPath:@\"/response/data/url/text()\"\
    \n     error:&theError];\n     //This is the string we're looking for\n     bitlyURL.stringValue\
    \ = [someNodes objectAtIndex:0];\n } else {\n     bitlyURL.stringValue = @\"Doc\
    \ error\";\n     return;\n }\n```\n```\n\nKey features of the code include:\n\n\
    +   - The document is created with the NSXMLDocumentTidyXML option, which tidies\
    \ the document format and can eliminate minor errors.\n+   - The nodesForXPath\
    \ array returns the elements at the search path.\n+   - Accessing a text() element\
    \ returns a text object that can be read from the array. No further processing\
    \ or extraction is required.\n+   - The project code includes a spinner activity\
    \ indicator, a very simple but effective addition that illustrates the download\
    \ state.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_282_1.png)\n\n# TIP\n\nTo\
    \ find the path you need, review the order of the indented tags in the raw XML.\
    \ XPath can perform many tricks, including reading multiple returns with the same\
    \ tag. For more information, see the XPath tutorial at www.w3schools.com/xpath/xpath_examples.asp.\n\
    \n# Using WebView\n\nNo discussion of URLs would be complete without an introduction\
