- pgno: 239
  md: 'In this example, this step defines the button’s target object as the App Delegate.
    The second step sets the action method, as shown in Figure 9.7.


    # Figure 9.7


    Setting the action method by selecting from a pop-up list


    ![](img/2b293e29fc15b0797f113b85dd429b6e_239_0.png)


    In code, you can select any public method as a valid action. In IB, only methods
    that are defined as an IBAction appear in the pop-up menu. It would be convenient
    if IB listed every compatible method in the target object — but it doesn’t. You
    can work around this by defining the actions in code when the application loads.
    Use this to choose any valid selector in any object, including objects that your
    code creates dynamically.


    # CROSS-REF


    For an example of dynamically created buttons with an assigned action, see the
    random button example in Chapter 16.'
