- pgno: 290
  md: "# ## Implementing a pause method\n\nYou can use performSelector: to simulate\
    \ a pause feature. Assume you have a method called aLongMethod. To create a pause,\
    \ split aLongMethod into two and use performSelector: to trigger the second part\
    \ after a delay.\n\n```\n```objectivec\n- (id) aLongMethod {\n    // Do things\n\
    \    // Pause here...\n    [self performSelector: @selector(restOfMethod:)\n \
    \          withObject: anObject\n           afterDelay: 1.0];\n}\n\n- (id) restOfMethod:\
    \ optionalObject {\n    // Finish the rest after the pause\n}\n```\n```\n\nYou\
    \ can also use pause execution in the current thread with\n\n```\n```objectivec\n\
    [NSThread sleepForTimeInterval: 2.0];\n```\n```\n\n# ## Running the selector in\
    \ a separate thread\n\nThe performSelectorInBackground: method is a simple way\
    \ to run a method in a separate thread. The method specified by the selector detaches\
    \ itself from the main thread and runs in the background. You have no control\
    \ over thread priority. If you need to pass parameters, use performSelectorInBackground:withObject:\
    \ and pack the parameters into an array or dictionary.\n\nIf you are not using\
    \ garbage collection, the background method must implement its own autorelease\
    \ pool, as described in the Managing thread memory section below.\n\n# ## Messaging\
    \ across threads\n\nperformSelector: can trigger a method in a specific thread\
    \ and wait until the method completes:\n\n```\n```objectivec\n[targetObject performSelector:\
    \ @selector(aMethod:)\n            onThread: aThread withObject: aParameterObject\
    \ waitUntilDone: YES];\n```\n```\n\nOptionally, you can add a modes parameter\
    \ to the end of this signature to specify the thread mode. The parameter takes\
    \ an NSArray of strings that defines the list of supported modes. There is no\
    \ option to delay the message, but it's possible to use the performSelector:withDelay:\
    \ method to delay a second performSelector: that triggers the message.\n\naThread\
    \ is an instance of NSThread. A performSelectorOnMainThread: option selects target\
    \ objects in the main thread, but it's possible to create separate custom instances\
    \ of NSThread to spin off threads from the main application."
  merge: -1
  img_proc: true
- pgno: 291
  md: "# # Working with NSThread\n\nNSThread is becoming a legacy object in OS X,\
    \ but it can still be useful in iOS, which has a simpler threading model. A thread\
    \ is a method that runs independently of the object that triggered it. To create\
    \ a thread, use\n\n```\n```objc\n[NSThread detachNewThreadSelector: @selector(theThreadMethod:)\n\
    \                         toTarget: self\n                       withObject:anOptionalObject];\n\
    ```\n```\n\nThe method is implemented with\n\n```\n```objc\n- (void) theThreadMethod:\
    \ (id)theOptionalObject {\n    //Do things\n    [NSThread exit];\n}\n```\n```\n\
    \nYou can pack theOptionalObject with as much data as you need. It can be a single\
    \ NSNumber or a complete dictionary of key-value pairs.\n\nThe exit call terminates\
    \ the thread. Alternatively you can create an independent thread object:\n\n```\n\
    ```objc\nNSThread *theThread = [[NSThread alloc]\n    initWithTarget: selfOrOtherSelector:\
    \ @selector(theThreadMethod)\n        withObject:anOptionalObject];\n```\n```\n\
    \n# ## Pausing a thread\n\nWith a separate object, you can set its properties,\
    \ including name, stackSize, and threadPriority — the latter on a range from 0.0\
    \ to 1.0. To run the thread, use the start method. To end a thread externally,\
    \ send it a cancel message. Depending on the thread code, this may have no effect.\n\
    \nThreads, including the main thread, can be paused with\n\n```\n```objc\n[NSThread\
    \ sleepForTimeInterval: aFloat];\n```\n```\n\nCall this from inside the thread\
    \ you want to pause. It's a class method, but NSThread implicitly identifies the\
    \ thread it's called from and pauses it accordingly. A corresponding sleepUntilDate:\
    \ method sets an absolute wake-up time/date instead of an interval.\n\n> > **CAUTION**\n\
    > > If you pause the main thread for more than a couple of seconds, the beach\
    \ ball icon appears and the application is marked as \"not responding.\""
  merge: -1
  img_proc: true
- pgno: 292
  md: "# Managing thread memory\n\nOn OS X you can use garbage collection to simplify\
    \ thread memory management. On the iPhone, you must create a local autorelease\
    \ pool for the thread when it launches, and release it just before the thread\
    \ exits.\n\n```\nNSAutoreleasePool *aPool = [[NSAutoreleasePool alloc] init];\n\
    //Thread code goes here\n[aPool release];\n[NSThread exit];\n```\n\nThis is standard\
    \ boilerplate code, and is all that’s required to implement an autorelease pool.\n\
    \n# Handling UI and thread interactions\n\nOnly some of AppKit and UIKit are thread-safe,\
    \ so accessing UI objects directly from a thread can be risky. Typically you use\
    \ a thread to perform a background operation such as a download, search, or archiving\
    \ operation that would otherwise slow down execution.\n\nIf you need to trigger\
    \ UI updates, use\n\n```\n[mainThreadObject performSelectorOnMainThread: SEL(aMethod:)\n\
    \                                      withObject: anObject\n                \
    \                      waitUntilDone: BOOL];\n```\n\nPlace update code in a special\
    \ selector/method that performs the update but runs in the main thread and can\
    \ be triggered remotely. You can choose to pause the thread, while it waits for\
    \ the main thread to complete the selector, or continue.\n\nTo receive messages\
    \ from the UI, use the equivalent performSelectorOnThread: method, nominating\
    \ the thread and a target object and method inside it.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_292_0.png)\n\
    \n> **TIP**\n> \n> It’s sometimes useful to run `performSelectorOnMainThread:`\
    \ just before a thread exits to let the main thread know that the other thread\
    \ has completed its run. Use `waitUntilDone: YES` to make sure that the main thread\
    \ has copied or read any results of the run, if it needs to.\n\n# Using NSOperation\n\
    \nNSOperation is more recent than NSThread and has the following advantages:\n\
    \n+   - Threads are objects, not methods.\n+   - Parameters can be passed through\
    \ a customized init method with any number of items."
  merge: -1
  img_proc: true
- pgno: 293
  md: "+   - **Results can be read from the thread object’s properties as it runs,\
    \ or before it terminates.**\n+   - **Queuing and concurrency can be managed.**\
    \ Operations can run in the background *concurrently* — simultaneously — or sequentially.\
    \ Concurrent processing can define a maximum number of running threads.\n\nNSOperation\
    \ requires more setup than NSThread and is less flexible. Use it for more complex\
    \ threaded applications when you need more control over threading and when you\
    \ need to pass a wider selection of objects and values to a background task.\n\
    \nNext you’ll create a simple example that uses NSOperation to list primes.\n\n\
    # Creating an NSOperation object\n\nAn NSOperation object must have the following:\n\
    \n+   - **A custom init or initWith: method that initializes its local values.**\n\
    +   - **A main method with the main thread code.** Other local methods can be\
    \ defined as needed.\n\nThe init method is called when the object is created,\
    \ and the main method is triggered when the run queue runs the object. A header\
    \ for a simple object that defines a BackgroundTask class follows:\n\n```\n```objc\n\
    #import <Foundation/Foundation.h>\n@interface BackgroundTask : NSOperation {\n\
    \    int limitInt;\n}\n@property int limitInt;\n- (id) initWithInt: (int) anInt;\n\
    @end\n```\n```\n\nTo create an NSOperation object in Xcode, add an NSObject to\
    \ your project in the usual way: right-click the Classes Folder, select Add New\
    \ File, select OS X Cocoa Class and Objective-C class, and select Subclass of\
    \ NSObject in the class pop-up menu. Name and save it.\n\nAfter saving, change\
    \ the class from NSObject to NSOperation, as shown previously.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_293_0.png)\n\
    \n> **CAUTION**\n> \n> Don’t forget to use `GetInfo` to change the Path Type of\
    \ the new files to Relative To Enclosing Group.\n\nThe code for a sample background\
    \ task follows:\n\n```\n```objc\n#import \"BackgroundTask.h\"\n#import \"NSOperationAppDelegate.h\"\
    \n@implementation BackgroundTask\n```\n```"
  merge: -1
  img_proc: true
- pgno: 294
  md: "```\n```objective-c\n@synthesize limitInt;\n- (id) initWithInt: (int) anInt\n\
    {\n    if (![super init]) return nil;\n    limitInt = anInt;\n    return self;\n\
    }\n- (void) main {\n    for (int i=0; i< limitInt; i++) {\n        if ([self isPrime:\
    \ i])\n        NSLog (@\"%i is prime\", i);\n    }\n    [[NSOperationQueue shared]\
    \ performSelectorOnMainThread:\n    @selector(taskDidFinish:)\n    withObject:\
    \ self\n    waitUntilDone: YES];\n    return;\n}\n- (BOOL) isPrime: (int) testNumber\
    \ {\n    if (testNumber < 1) return NO;\n    if ((testNumber ==2) || (testNumber\
    \ == 3)\n                    || (testNumber%2 == 0) || (testNumber%3 ==0)) return\
    \ NO;\n    int divisor = 5;\n    int limit = 1+sqrt(testNumber);\n    while (divisor\
    \ < limit) {\n        if ( ((testNumber%divisor) ==0) ||\n                   \
    \ (testNumber%(divisor+2)) ==0) return NO;\n        divisor +=6;\n    }\n    return\
    \ YES;\n}\n@end\n```\n```\n\nKey features of the code include:\n\n+   - The **initWithInt:\
    \ method copies the initialization into a local property.** `main` doesn’t support\
    \ parameter passing, so you must pass parameters via `init`.\n+   - The **main\
    \ loop cycles through a list of integers, tests them, and logs them if they’re\
    \ prime.** The prime test is in a separate local method. Because it’s part of\
    \ the NSOperation object, this method becomes part of the background task.\n+\
    \   - **performSelectorOnMainThread: is used to notify the main thread when the\
    \ thread completes.** This is an optional but useful feature.\n+   - **The thread\
    \ exits automatically.**\n+   - **[NSOperationAppDelegate shared] returns a pointer\
    \ to the app delegate that creates and runs this object.** It’s described in more\
    \ detail next."
  merge: -1
  img_proc: true
- pgno: 295
  md: "# ## Using NSOperationQueue\n\nTo run an NSOperation object, create an instance\
    \ of NSOperationQueue, a queue manager object. Create as many instances of NSOperation\
    \ as you need. Queue them with\n\n```\n`[aQueue addOperation: anInstance];`\n\
    ```\n\nThis adds the operation to the queue. The queue runs the operation when\
    \ it has a free execution slot, and manages objects before they’re executed. Sample\
    \ code that runs up to four instances simultaneously follows:\n\n```\n```objective-c\n\
    #import \"NSOperationAppDelegate.h\"\n#import \"BackgroundTask.h\"\n@implementation\
    \ NSOperationAppDelegate\n@synthesize window;\nstatic NSOperationAppDelegate *sharedInstance;\n\
    + (id) shared {\n    //Other objects can use shared to get a pointer to this object\n\
    \    return sharedInstance;\n}\n- (void)applicationDidFinishLaunching:(NSNotification\
    \ *) aNotification {\n    sharedInstance = self;\n    NSOperationQueue *theQueue\
    \ = [[NSOperationQueue alloc] init];\n    //[theQueue setMaxConcurrentOperationCount:1];\n\
    \    // When set to 1, dispatches tasks sequentially\n    [theQueue setMaxConcurrentOperationCount:4];\n\
    \    // When set to 4, dispatches up to 4 tasks concurrently\n    BackgroundTask\
    \ *task1 =\n    [[BackgroundTask alloc] initWithInt:1000];\n    [theQueue addOperation:task1];\n\
    \    BackgroundTask *task2 =\n    [[BackgroundTask alloc] initWithInt:2000];\n\
    \    [theQueue addOperation:task2];\n    BackgroundTask *task3 =\n    [[BackgroundTask\
    \ alloc] initWithInt:500];\n    [theQueue addOperation:task3];\n}\n- (void) taskDidFinish:\
    \ (id) sender {\n    NSLog(@\"Task %@ finished\", sender);\n}\n@end\n```\n```\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_295_0.png)\n\n# ### CAUTION\n\nYou\
    \ can use a suspend method to control the queue. It doesn't suspend execution,\
    \ as you might expect; it suspends dispatch. When the queue is suspended, no more\
    \ tasks are queued until the suspension is cancelled.\n\nThe +(id) shared method\
    \ is a convenient way to give other objects a pointer to the App Delegate when\
    \ they need to message it. It’s not obligatory, but is a simple way to allow tasks\
    \ to “call home” if they need to."
  merge: -1
  img_proc: true
- pgno: 296
  md: 'The `sharedInstance` property is set to `self`, and when other objects call
    `shared`, they receive the App Delegate’s `self` value. They can then use


    ```

    ```objective-c

    [[NSOperationAppDelegate shared] sendAMessage];

    ```

    ```


    You can implement a `shared` property in this way in any custom class, as long
    as there is exactly one instance.


    ```

    ```objective-c

    //in yourClass

    static yourClass *sharedInstance;

    sharedInstance = self;

    //In another object

    [[yourClass shared] sendAMessage];

    ```

    ```


    Don’t use this idiom when you create a class that requires multiple instances.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_296_0.png)


    # TIP


    Don’t be confused by the fact that the class name is `NSOperationAppDelegate`.
    This is a custom class used to demonstrate the features of `NSOperation`. It’s
    not a prebuilt Cocoa class, and you can’t use it in your own application. But
    you can use the `shared` idiom, as long as you slot in your class name, as shown
    previously.


    Other key features of the code include:


    +   - An instance of `NSOperationQueue` manages the task list.

    +   - Tasks are created with different initialization values.

    +   - Tasks are added to the run queue with `addOperation`.

    +   - The `taskDidFinish:` method is an optional custom method used to report
    the completion of a task. It’s triggered in each task by calling `performSelectorOnMainThread:`,
    as shown in the previous listing.


    To summarize, follow these steps to use NSOperation:


    +   1. Subclass `NSOperation` to create a class for your task.

    +   2. Add an `initWith:` method to implement parameter passing. Copy passed parameters
    to local properties or values.

    +   3. Add a `main` method as an entry point to the task code. Add extra local
    methods as needed.

    +   4. Optionally, add a `performSelectorOnMainThread` method to report when the
    task exits or when it needs attention.

    +   5. In your main thread, create an instance of `NSOperationQueue`.

    +   6. Create and initialize instances of your task class, as needed.

    +   7. Run them by adding them to the task queue with `addOperation:`.'
  merge: -1
