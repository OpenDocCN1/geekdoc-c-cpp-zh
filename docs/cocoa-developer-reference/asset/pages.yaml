- pgno: 68
  md: '# Figure 2.11


    Model-View-Controller — MVC — is one of the fundamental OS X and Cocoa design
    patterns and is built into Cocoa’s object hierarchy.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_68_0.png)


    # Figure 2.12


    Applying MVC to a table display makes it possible to pass data selectively to
    and from the interface, as required. This is a more complex but much more efficient
    solution than a direct link between table data and a list of scrollable visible
    cells.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_68_1.png)'
