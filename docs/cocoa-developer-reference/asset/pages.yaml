  md: "> > **TIP**\n> > Save the nib file. Did I mention that you should remember\
    \ to save the nib file? Save the nib file.\n\n# ## Using NSTimer to create a simple\
    \ seconds counter\n\nThere are many ways to implement a timed counter in Cocoa.\
    \ The simplest is to use NSTimer — a lightweight but powerful timer object. NSTimer\
    \ can be run as a one-shot counter or as a repeating counter. To create a repeating\
    \ counter, add the following boilerplate code to applicationDidFinishLaunching:\n\
    \n```\n```\nNSTimer *myTimer =\n    [NSTimer scheduledTimerWithTimeInterval: 1\n\
    \        target: self\n        selector: @selector (timerMethod)\n        userInfo:\
    \ nil\n        repeats: YES];\n```\n```\n\n> > **NOTE**\n> > NSTimer uses a very\
    \ long nested signature. For convenience and clarity, it's useful to split the\
    \ parameters across multiple lines. This is purely cosmetic. It doesn't affect\
    \ the code, but it does make it easier to read and modify.\n\nThis creates a timer\
    \ that calls timerMethod once a second. Setting repeats to NO would call timerMethod\
    \ once. Note how timerMethod is defined in code with a selector. The principle\
    \ is almost exactly the same as for a button — the method in the selector slot\
    \ is triggered automatically by a timer event instead of a user action. The name\
    \ of timerMethod is arbitrary. It must be unique and it must exist, but there\
    \ are no other restrictions on the method name.\n\nThere's an extra detail to\
    \ note. The target property specifies the object in which the selector method\
    \ exists. You can use this feature to trigger a method in a different object;\
    \ or, as is done here, you can specify self to trigger a method in the same object.\n\
    \nFinally, to stop a timer, use the invalidate method.\n\n```\n```\n[myTimer invalidate];\n\
    ```\n```\n\nThis stops the timer and releases the timer object from memory. Optionally,\
    \ you can set the timer pointer to nil after invalidating it. You can then test\
    \ for nil to avoid invalidating the timer again, which is likely to cause a crash.\n\
    \n# ## Implementing a timer method\n\nA simple outline of the timer method looks\
    \ like this:\n\n```\n```\n- (void) timerMethod {\n    doThingsHere...\n}\n```\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 217
  md: "Add this code beneath `applicationDidFinishLaunching:`. It’s possible to pass\
    \ the timer object to a method. This feature isn’t used in this application, but\
    \ it’s often useful when working with timers. Replace the selector with\n\n```\n\
    ```objc\nselector: @selector (timerMethod:)\n```\n```\n\nThe extra colon is enough\
    \ to tell Cocoa to pass a pointer to the timer object as a parameter, which you\
    \ can then copy from the signature.\n\n```\n```objc\n- (void) timerMethod: (NSTimer\
    \ *) timer {\n    doThingsHere...\n    [timer invalidate]; //Stop the timer\n\
    }\n```\n```\n\nIn this example, the timer method needs to increment a counter.\
    \ It also needs to report the timer value to the view; specifically, it needs\
    \ to update the text in the text field. It’s easy to implement a counter with\
    \ an int, and increment it at every timer tick.\n\n```\n```objc\n- (void) updateTimer\
    \ {\n    timerCount += 1;\n}\n```\n```\n\nReporting the timer value is slightly\
    \ more difficult. Many Cocoa objects include a text or `title` property that holds\
    \ a text label. Uniquely, `NSTextField` uses a property called `stringValue` instead.\
    \ So set the text of the label called `countText`, use\n\n```\n```objc\ncountText.stringValue\
    \ = <any string>;\n```\n```\n\nTo convert a number into a string, use the `NSString\
    \ stringWithFormat:` method. This implements standard C text formatting identical\
    \ to that used in `printf` and `sprintf`; for example, `%i` interprets a number\
    \ as an int and converts it to a text string. The method is implemented as an\
    \ `NSString` class method. The format string must be “objectified” with `@` in\
    \ the usual way. The final code for the timer method is\n\n```\n```objc\n- (void)\
    \ updateTimer {\n    timerCount += 1;\n    countText.stringValue =\n    [NSString\
    \ stringWithFormat: @\"%i\", timerCount];\n}\n```\n```\n\nThis increments the\
    \ count at each tick, and then writes the value to the label in the nib. Because\
    \ you’ve linked the `countText` object to the text field in the view, updating\
    \ the `stringValue` parameter automatically updates the count that appears in\
    \ the view. In short, it just works. No more code is needed to display the value."
  merge: -1
  img_proc: true
- pgno: 218
  md: "# Implementing start and stop button methods\n\nThe button methods need to\
    \ start and stop the timer and reset the counter variable. In this example they\
    \ also reprogam the buttons dynamically. Initially the buttons are labeled Start\
    \ and Stop. Only the Start button is enabled. Clicking Start renames the buttons\
    \ to Reset and Continue. It modifies their selectors and disables the Start button\
    \ so that the user can't create a second timer if one is already running. The\
    \ complete code is as follows:\n\n```\n```objective-c\n#import \"CounterAppDelegate.h\"\
    \n@implementation CounterAppDelegate\n@synthesize window, startButton, stopButton,\
    \ countText;\nNSTimer *thisTimer;  // Generic timer object pointer\nint timerCount;\n\
    - (void)applicationDidFinishLaunching:\n (NSNotification *)aNotification {\n \
    \   timerCount = 0; // Initialize the count on start-up\n}\n- (void) startCount:\
    \ (id) sender {\n    stopButton.action = (SEL)selector(stopCount:);\n    //Stop\
    \ button does stop\n    stopButton.title = @\"Stop\";\n    [stopButton setEnabled:\
    \ YES];\n    [startButton setEnabled: NO]; //Prevent double timing\n    thisTimer\
    \ = [NSTimer scheduledTimerWithTimeInterval: 1\n    target:self\n    selector:selector(updateTimer)\n\
    \    userInfo:nil\n    repeats:YES]; //Boilerplate timer initialization\n}\n-\
    \ (void) stopCount: (id) sender {\n    if (thisTimer != nil) {\n        [thisTimer\
    \ invalidate];\n        thisTimer = nil; //Kill the timer\n    }\n    [startButton\
    \ setEnabled: YES];\n    stopButton.action = (SEL)selector(resetCount:);\n   \
    \ //Stop button does reset\n    stopButton.title = @\"Reset\";\n    startButton.title\
    \ = @\"Continue\";\n    //Identical to Start, but without clearing the timer\n\
    \    //Variable timer\n}\n- (void) resetCount: (id) sender {\n    //Reinitialize\
    \ everything on reset\n    timerCount = 0;\n    countText.stringValue = @\"0\"\
    ;\n    stopButton.action = nil; //Stop button does nothing\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 219
  md: "```\n```objc\nstopButton.title = @\"Stop\";\nstartButton.title = @\"Start\"\
    ;\n[stopButton setEnabled: NO];\n[startButton setEnabled: YES];\n}\n- (void) updateTimer\
    \ {\n    timerCount +=1;\n    countText.stringValue =\n        [NSString stringWithFormat:@\"\
    %i\", timerCount];\n}\n@end\n```\n```\n\nThe methods cycle through different possible\
    \ timer states, changing the labels on the buttons and the selectors they trigger.\
    \ For example, in startCount:\n\n```\n```objc\nstopButton.action = (SEL)@selector(stopCount:);\n\
    ```\n```\n\nThis line fills stopButton's selector slot with the stopCount: method.\
    \ When the user clicks the button, stopCount: is triggered.\n\nA key feature of\
    \ selectors is that they can be modified at any time. The stopCount: method updates\
    \ the selector to trigger the resetCount: method, which in turn modifies the selector\
    \ so that it does nothing. Selector switching is a simple but very powerful technique.\
    \ You can use it to reconfigure a UI dynamically, so that the user triggers different\
    \ events depending on the application state. You can also modify selectors internally,\
    \ changing the events that are triggered as the application runs, for example,\
    \ you might change the timer's selector so that it triggers a different method\
    \ on every tenth count.\n\nThe remaining code updates the title property of both\
    \ buttons to reflect their new functions. The setEnabled: property is used to\
    \ enable and disable buttons dynamically, making it impossible for the user to\
    \ click the Start button again when the timer is already running. When this property\
    \ is set to NO, the button appears grayed out and the user can't click it.\n\n\
    You can now add the code, or view the sample on the Web site. The finished application\
    \ is shown in Figure 8.20.\n\n> **NOTE**\n> The sample code is available at www.wiley.com/go/cocoadevref."
