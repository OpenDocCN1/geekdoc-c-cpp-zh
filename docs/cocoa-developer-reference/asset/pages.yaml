- pgno: 575
  md: '# ### Figure A.5


    Dashcode''s window areas are similar to Xcode''s panes, with parts rather than
    classes at the top left, resources under the parts window, and a separate source
    code view.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_575_0.png)


    You can find Dashcode in /Developer/Applications. If you are familiar with Xcode
    and Interface Builder, you should find it easy to work in Dashcode. The arrangement
    of features and windows is similar to Xcode''s, and many of the idioms and concepts
    used in Dashcode are recognizable. However, there are important differences. You
    can make development feel simpler and go smoother by familiarizing yourself with
    them before beginning your first widget.


    # ## Exploring the Dashcode interface


    Parts of the Dashcode interface, illustrated in Figure A.6, are relatively self-explanatory,
    such as the graphic preview window used to design and lay out widget graphics
    and the source code window. Unfortunately, two other key elements described below
    are presented in a much less intuitive way. Dashcode can be difficult to work
    with until you identify and master these features.'
  merge: -1
  img_proc: true
- pgno: 576
  md: '# Figure A.6


    The View drop-down menu holds some of Dashcode''s useful secret features and has
    no equivalent in Xcode.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_576_0.png)


    The View drop-down menu at the top left of the Dashcode window is Dashcode’s master
    view selector. Use it to select the contents that appear in each of Dashcode’s
    main panes; for example, you can display a Run Log in the pane usually used for
    graphic editing. You can also replace the source code pane with a Code Evaluator
    for instant calculations or for direct interaction with a widget’s part properties.


    The row of icons at the bottom left of the Dashboard window, shown in Figure A.7,
    is an alternative key view selector. The icons are labeled with minimal tool tips
    and are easy to miss, but they are a critical part of the Dashboard interface.'
  merge: -1
  img_proc: true
- pgno: 577
  md: "# Figure A.7\n\nThe bottom left icon series selects the elements that appear\
    \ in the lower-left pane. The Files view is usually the most useful.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_577_0.png)\n\
    \nFrom left to right, the icons are as follows:\n\n+   - **File Controller.**\
    \ Use this icon to add new files to the project.\n+   - **Files.** Use this icon\
    \ to show and hide a Files pane, with a list of the files in a project. This is\
    \ one of the key icons in Dashcode, and you should familiarize yourself with it\
    \ before you begin editing.\n+   - **Data Sources.** Use this icon to add a data\
    \ source — a URL that points to a JSON (JavaScript Object Notation) or XML (extensible\
    \ markup language) feed — to the project. A full discussion of JSON and XML is\
    \ beyond the scope of this book. You can find an introduction at www.json.org.\n\
    +   - **Workflow.** Use this icon to display the Workflow Steps pane. (This is\
    \ one of the less useful features of Dashcode.)\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_577_1.png)\n\
    \n> **TIP**\n> \n> When it first loads, Dashcode displays the Workflow Steps pane.\
    \ It's likely you'll want to switch this view so it shows the project file list.\
    \ It can be helpful to get into the habit of clicking the Files icon to replace\
    \ the Workflow Steps list as soon as Dashcode loads.\n\n# Working with parts and\
    \ the Library\n\nChoose Window↵ Show Library to reveal the Parts list, shown in\
    \ Figure A.8. You can also click the Library icon near the top right of the Dashcode\
    \ window. Parts are similar to Interface Builder’s objects, but can’t be subclassed.\
    \ They are designed to be dropped into a widget design as is, and then linked\
    \ to event handlers in the code. To add a part to a widget, drag and drop it onto\
    \ the widget’s front or back image.\n\nThe Library is complex and rich, and it\
    \ includes special-effect parts such as a Quartz Composer frame, a navigation\
    \ stack, and a customizable list. Although widgets should be simple, they do not\
    \ have to be crude. You can use parts in an adventurous way to create unique and\
    \ original widgets that offer unusual user experiences.\n\nClick the Code tab\
    \ in the Library window to see a list of code snippets. You can copy this code,\
    \ paste it into your widget’s source code window, and modify it as needed. Code\
    \ and parts are independent — the code snippets can be used anywhere in your script.\
    \ They are not designed to work with any particular part."
  merge: -1
  img_proc: true
- pgno: 578
  md: '# Figure A.8


    Dashcode’s parts list includes 41 widget objects that you can add to a background
    frame. You can also view code snippets and click Photos in the top tab to include
    a custom photo or video in a widget.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_578_0.png)


    # Using the Inspector


    Choose Window ▸ Show Inspector to reveal the Inspector. You can also click the
    Inspector icon near the top right of the Dashcode window, as shown in Figure A.9.
    The Inspector window displays and edits the properties of parts and objects. Properties
    include settings that control the visible appearance of a part and also define
    data links and event triggers to widget code and external sources of information.
    The six panes are:


    +   - **Attributes.** Holds information about the ID and class of each part and
    the settings for localization.

    +   - **Fill & Stroke.** Sets fill and stroke effects for a part, and includes
    graphic effects such as rounded corners, gradient fills, glass stylings, and recessed
    bevels.

    +   - **Metrics.** Controls the position and size of the part, its resizing options,
    and its size constraints.

    +   - **Text.** Sets the font, color, shadow, font size, and alignment for parts
    that use text strings.

    +   - **Bindings.** Binds part properties to a data source, with optional transformations.

    +   - **Behaviors.** Displays a list of part events, with optional links to handler
    functions in the code.'
  merge: -1
  img_proc: true
- pgno: 579
  md: "# Figure A.9\n\nAlthough the Attributes window in the Inspector appears simple,\
    \ the ID field is one of the key properties for each part included in a widget.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_579_0.png)\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_579_1.png)\n\
    \n> **TIP**  \n> As in Interface Builder, the Library and the Inspector windows\
    \ often disappear behind other objects. You can reveal them by choosing Window\
    \ → Bring All To Front.\n\n# Building a Widget in Dashcode\n\nTo create a new\
    \ widget, choose File → New to display Dashcode’s standard list of templates,\
    \ shown in Figure A.10. You can see a description of each template by clicking\
    \ it. Many of the templates are unlikely to serve your needs, but the RSS (Really\
    \ Simple Syndication) and Custom templates are reliably useful. For a minimal\
    \ template with a rounded box with a gradient fill and a single line of text,\
    \ select Custom.\n\n# Creating widget graphics\n\nTo modify the look of the background\
    \ graphics, select the `frontImg` part in the Parts pane at the top left of the\
    \ Dashcode window. You may need to click the triangle next to the `front` part\
    \ to reveal its contents.\n\nDashcode includes glass-effect and gradient tools\
    \ in the Fill & Stroke pane in Inspector. Experiment with the Gradient fill effect\
    \ in the Style pane, adding optional corner roundness, reflection, and opacity.\
    \ In the Effects pane, you can add Glass and Recess — inset — effects."
  merge: -1
