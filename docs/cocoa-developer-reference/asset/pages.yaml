- pgno: 348
  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_348_0.png)\n\n# NOTE\n\nBehind the\
    \ scenes, KVO works by using a trick called isa swizzling — a fancy way of saying\
    \ that classes are copied and modified on the fly and updated versions impersonate\
    \ the originals. This isn't a speedy process.\n\nSo in this example, you explicitly\
    \ enable and disable KVO for all properties with a method called `isObserving:`\
    \ in the App Delegate. The method is listed below:\n\n```\n```objective-c\n#import\
    \ \"TempVerterAppDelegate.h\"\n@implementation TempVerterAppDelegate\n@synthesize\
    \ window, celsFloat, fahrFloat;\n- (void)applicationDidFinishLaunching:(NSNotification\
    \ *)\n    aNotification {\n    self.celsFloat = 100.0;\n    self.fahrFloat = 212.0;\n\
    \    [self isObserving: YES];\n}\n- (void) isObserving: (BOOL) observing {\n \
    \   if (observing) {\n        [self addObserver:self forKeyPath:@\"celsFloat\"\
    \n        options:NSKeyValueObservingOptionNew context:NULL];\n        [self addObserver:self\
    \ forKeyPath:@\"fahrFloat\"\n        options:NSKeyValueObservingOptionNew context:NULL];\n\
    \    } else {\n        [self removeObserver: self  forKeyPath:@\"celsFloat\"];\n\
    \        [self removeObserver: self  forKeyPath:@\"fahrFloat\"];\n    }\n}\n-\
    \ (void) observeValueForKeyPath: (NSString *)keyPath ofObject:(id)\n    object\
    \ change:(NSDictionary *) change\n    context: (void *) context {\n    NSLog(@\"\
    %@KeyPath:%@ Context: %@\", keyPath,\n    [self valueForKeyPath:keyPath]);\n \
    \   [self isObserving: NO];\n    if ([keyPath isEqual: @\"celsFloat\"])\n    \
    \    self.fahrFloat = 32+self.celsFloat*1.8;\n\n    if ([keyPath isEqual: @\"\
    fahrFloat\"])\n        self.celsFloat = (self.fahrFloat-32)/1.8;\n\n    [self\
    \ isObserving: YES];\n}\n@end\n```\n```"
  merge: -1
  img_proc: true
- pgno: 349
  md: 'Key features of the code include:


    +   - `applicationDidFinishLaunching:` sets initial defaults for both temperatures
    and then turns on KVO.

    +   - The `isObserving:` method takes a `BOOL` and adds and removes observers
    for the two temperatures dynamically.

    +   - The standard KVO `observeValueForKeyPath:` method is triggered when either
    float changes — but only if KVO is enabled. It logs the trigger event, turns off
    KVO to prevent a loop, updates one of the floats, running code chosen by testing
    the `keyPath`, and turns KVO on again after the update.


    It''s important to understand that bindings and KVO act independently. You can
    turn off KVO without affecting bindings, because the bindings manager is a separate
    object. Behind the scenes, out of sight of your code, it''s running its own KVO
    monitoring. It doesn''t care how you use KVO elsewhere.


    > > **NOTE**

    > >

    > > Don''t forget to prefix properties with `self` to make them visible to KVO
    and bindings.


    # Using formatters


    The disadvantage of the automatic conversion in the bindings manager is that it
    doesn''t support format control. If you type values into the Fahrenheit box, you''ll
    see that the equivalent Celsius value is often a recurring decimal. The text field
    truncates this visually. A wider text field would show them.


    `NSNumberFormatter` is a simple drop-in formatting object that can solve this
    problem. It''s not directly related to bindings, but it''s often used to fine-tune
    the format of the strings produced by the bindings manager. Figure 13.13 illustrates
    how to add an `NSNumberFormatter` to a text field.


    > > **CAUTION**

    > >

    > > The formatter works on a text cell, so you must drop it on the `NSTextFieldCell`
    in the nib, not on the text field itself.'
  merge: -1
  img_proc: true
