- pgno: 253
  md: "# Handling Errors and Exceptions\n\nMany Cocoa objects support an error parameter,\
    \ which is an instance of NSError. NSError stores a pointer to an error object,\
    \ so the syntax is unusual: the error pointer is prefixed with &. For example,\
    \ to write a string to disk with error checking, use the following:\n\n```\n```\n\
    NSError *error;\n[aString writeToFile: aFilePath\n              atomically: YES\n\
    \                encoding: anEncoding\n                   error: &error];\n```\n\
    ```\n\nIgnore the other parameters for now; they're discussed in Chapter 10 and\
    \ Chapter 12. In this section, you'll look at &error.\n\nThe previous code tells\
    \ the writeToFile: method to fill the &error pointer with error information if\
    \ the method fails. You can ignore this error trapping and leave error set to\
    \ nil. This is occasionally valid. For example, when you read an item from disk,\
    \ you can check if it's nil instead of trapping an explicit error, but including\
    \ an error check creates more robust code.\n\n# Using NSError\n\nThe error object\
    \ itself isn't very informative. You can use\n\n```\n```\n[error localizedDescription];\
    \    //Returns a description string\n[error localizedFailureReason];  //An alternative\
    \ description\n```\n```\n\nto return text descriptions of the error suitable for\
    \ logging. Sometimes these include a cryptic error code, which can only be converted\
    \ to a useful description of the error by reading through various header files.\
    \ For egregious errors, the description may be straightforward and useful.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_253_0.png)\n\n> > **NOTE**\n> > Errors\
    \ are grouped by domain — one of Mach, POSIX, or OSStatus — which defines the\
    \ OS layer responsible for defining the error.\n\nYou can convert an error into\
    \ an NSAlert with the following:\n\n```\n```\nNSAlert *alert = [NSAlert alertWithError:\
    \ error];\n[alert runModal];\n```\n```\n\nThis displays the error with the description\
    \ strings built into a pop-up alert panel, as shown in the example in Figure 9.14,\
    \ which tries to load a string from a file with a null file path."
  merge: -1
  img_proc: true
- pgno: 254
  md: "**Figure 9.14**\n\nConverting an error object into an error alert panel.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_254_0.png)\n\n# Handling errors with\
    \ NSException\n\nIf a block of code is error-prone, you can use `@try`, `@catch`,\
    \ and `@finally` compiler directives to handle errors. Use `@throw` to create\
    \ an NSException that diverts the code to an error handler. For example:\n\n```\n\
    ```objective-c\n@try {\n    //Do useful things\n    if (thereWasAnError) {\n \
    \       NSException *thisException = [NSException\n            exceptionWithName:\
    \ @\"Something bad happened\"\n                       reason: @\"For a reason\"\
    \n                     userInfo: nil];\n        @throw thisException;\n    }\n\
    }\n@catch (NSException *exception) {\n    if ([exception name] isEqual: @\"Something\
    \ bad happened\") {\n        //Something bad handler\n```\n```"
  merge: -1
