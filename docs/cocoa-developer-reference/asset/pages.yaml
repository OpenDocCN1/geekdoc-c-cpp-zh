  md: "This creates a URL to a named file from a path that accesses the application\
    \ bundle. The `initWithContentsOfURL:` method loads the image data into an instance\
    \ of NSImage.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_447_0.png)\n\n# NOTE\n\
    \nYou can access image files elsewhere on disk via a conventional file system\
    \ filepath. Files in the application bundle must be accessed via a URL. This isn’t\
    \ very consistent, but it’s the law.\n\n# Drawing images\n\nYou can draw an image\
    \ object at any point in a view. Technically the image isn’t drawn; it’s *composited*,\
    \ combining the image data with the existing pixel values in the view.\n\nIf you’ve\
    \ used an image-editing package, you’ll already be familiar with compositing.\
    \ It’s sometimes known as *layer blending*. Cocoa supports various compositing\
    \ options. You can composite the image as is, you can attract maximum and minimum\
    \ pixel values after composition, or you can XOR the image to create excessively\
    \ garish psychedelic effects. Opacity — transparency — is controllable with a\
    \ separate parameter, also known as alpha.\n\nTo draw an image, call the `drawInRect:`\
    \ method on it. The full method signature specifies a destination rect, a source\
    \ rect, an *operation* parameter that takes one of Cocoa’s predefined compositing\
    \ modes, and a *fraction* parameter between 0 and 1 that defines opacity/alpha.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_447_1.png)\n\n# TIP\n\nSpecifying `NSZeroRect`\
    \ for the source rect is a quick way to specify the entire image. For example:\n\
    \n```\n```objc\n[sourceImage drawInRect:newRect fromRect:NSZeroRect\n    operation:NSCompositeSourceOver\
    \ fraction:0.5];\n```\n```\n\nThe compositing mode constants are defined in the\
    \ NSImage Class Reference.\n\nFigure 16.13 shows the result of combining an image\
    \ with an underlying gradient and drawing it with an opacity of 50 percent.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_447_2.png)\n\n# TIP\n\nWhen an image\
    \ is resized, it’s automatically interpolated — that is, the original pixel information\
    \ is expanded or made smaller to fit the new image size. You can set the interpolation\
    \ quality by including\n\n```\n```objc\n[[NSGraphicsContext currentContext]\n\
    \ setImageInterpolation:NSImageInterpolationHigh];\n```\n```\n\nat the start of\
    \ `drawRect:`."
