- pgno: 545
  md: 'The *Window-based Application* template shown in Figure 19.22 includes a single
    app delegate with an associated nib file that includes an instance of `UIWindow`.
    This template is the most skeletal and lacks a view controller. You can use it
    to build a micro-app that uses as little memory as possible, adding extra features,
    outlets, and action methods directly to the app delegate.


    You can also use this template as a starting point for apps that use a navigation
    controller or a tab bar. Generally, it is easier to start from the other prebuilt
    templates for these app types, but if your app has unique navigation requirements,
    it can be simpler to build them from scratch.


    # Figure 19.22


    The Window-based Application template is similar to the View-based Application
    template without the extra controller — and without it, there is no way to swap
    views.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_545_0.png)


    # Building a Simple Application


    Now that you have been introduced to the key features of iOS, you can create your
    first app. This app is more complex than a hello world app; it demonstrates how
    to build views with simple features and how to implement view swapping.'
