  md: "# Figure 15.9\n\nAssigning a standard system file type to the document\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_411_0.png)\n\nAdding a custom UTI is\
    \ a labor-intensive process. You must define it in your application’s info.plist\
    \ file, which is an XML document with a variety of application settings. Xcode\
    \ includes a plist editor, but it’s easier to navigate to your project’s folder\
    \ in Finder, open the plist file in a text editor, copy the UTI boilerplate XML\
    \ from Apple’s documentation, paste it into the plist file, and make minor edits\
    \ by hand. Sample XML to create a custom UTI that implements an abcd file extension\
    \ follows:\n\n```\n    <key>UTExportedTypeDeclarations</key>\n        <array>\n\
    \            <dict>\n                <key>UTTypeIdentifier</key>\n           \
    \     <string>com.myURL.applicationname</string>\n                <key>UTTypeDescription</key>\n\
    \                <string>My custom document format</string>\n                <key>UTTypeConformsTo</key>\n\
    \                <array>\n                    <string>public.data</string>\n \
    \               </array>\n                <key>UTTypeTagSpecification</key>\n\
    \                <dict>\n                    <key>com.apple.ostype</key>\n   \
    \                 <string>abcd</string>\n```"
