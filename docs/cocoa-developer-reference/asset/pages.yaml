- pgno: 435
  md: "+   - Running the `makeObjectsPerformSelector:` method on the buttons in the\
    \ array removes them all with a single line of code. No enumeration is needed.\n\
    +   - The geometry structures `NSRect` and `CGPoint` represent a rectangle and\
    \ a point, respectively. These structures are explained in more detail next.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_435_0.png)\n\n**TIP**  \nThis application\
    \ doesn’t try to avoid button collisions; sometimes buttons overlap. Try to modify\
    \ the project so that buttons can never appear on top of each other. Various solutions\
    \ are possible. Some enumeration may be needed.\n\n# Handling mouse events in\
    \ views\n\nIt's often useful to find the mouse position, either during a click\
    \ or a drag event, or by following the cursor within a view. NSView supports a\
    \ variety of mouse-tracking methods. Most are defined in NSResponder. To add them\
    \ to a project, implement them with custom handlers as shown here. You can also\
    \ download the mouse handler project from the Web site (www.wiley.com/go/cocoadeveloper)\
    \ to see worked examples.\n\nmouseDown: events are captured automatically. You\
    \ can retrieve the coordinates within the window with\n\n```\n```objective-c\n\
    - (void) mouseDown: (NSEvent *) theEvent {\n    NSPoint mouseLocation = [theEvent\
    \ locationInWindow];\n    NSLog (@\"Mouse position: %.0f, %.0f\", mouseLocation.x,\n\
    \        mouseLocation.y);\n}\n```\n```\n\nIt’s often useful to translate the\
    \ coordinates to those of a subview and to limit clicks so that the application\
    \ ignores them when they’re outside the subview. To translate coordinates, use\n\
    \n```\n```objective-c\nNSPoint mousePositionInPanel =\n    [self convertPoint:\
    \ mouseLocation toView: aTargetSubview];\n```\n```\n\nAfter the translation, clicking\
    \ at the bottom left of aTargetSubview returns 0,0.\n\nTo hit test the subview,\
    \ use the mouse: inRect: method:\n\n```\n```objective-c\nNSRect targetBounds =\
    \ [aTargetSubview bounds];\nif ( [self mouse: mousePositionInPanel inRect: targetBounds])\
    \ {…\n```\n```\n\nThe code in the conditional runs if the mouse is clicked inside\
    \ the subview. Clicks outside the subview are ignored.\n\nUse mouseDragged: to\
    \ receive left-button drag events. You can read the mouse position using the same\
    \ code as shown previously."
