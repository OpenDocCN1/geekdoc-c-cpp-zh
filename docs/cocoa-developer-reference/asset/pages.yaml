- pgno: 317
  md: '# ## Using NSDictionary


    NSDictionary collects key/value pairs. It’s more flexible than NSArray, allowing
    arbitrary indexing and object pairing. The keys can represent almost any data
    in any format, so it’s possible to emulate a noncontiguous array with numerical
    keys.


    You can create a dictionary by merging two arrays to create key-value pairs:


    ```

    aDictionary =

    [NSDictionary dictionaryWithObjects:

    objectArray forKeys: keyArray];

    ```


    Use allKeys to reverse this process and return an array of keys, and use allValues
    to return an array of objects/values.


    You can also specify a list of alternating keys and values:


    ```

    bDictionary =

    [NSDictionary dictionaryWithObjectsAndKeys:

    value1, @"key1", value2, @"key2", nil];

    ```


    The sorting and enumeration features are similar to those in NSArray.


    # ## Accessing File Attributes


    NSDictionary includes convenience methods for accessing a file handler’s attributes
    dictionary. Instead of specifying an explicit key, you can call these methods
    directly to return various attributes; for example:


    ```

    NSDate *creationDate = [anAttributesDictionary fileCreationDate];

    ```


    You can use the attributes dictionary to access low-level file information. This
    information isn’t usually required for simple read/write archiving operations.


    # ## Using NSMutableDictionary


    Use setObject:forKey: and setValue:forKey: to add items to the dictionary or to
    replace existing items.


    You can copy an entire existing dictionary with the setDictionary: method. Use
    this to make a mutable copy of dictionary data before editing it.


    removeAllObjects, removeObjectForKey:, and removeObjectsForKeys: manage deletion.
    The latter takes an array of keys.


    NSMutableDictionary supports capacity hinting. The key system doesn’t implement
    bounds checking.'
  merge: -1
  img_proc: true
