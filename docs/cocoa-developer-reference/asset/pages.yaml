  md: '# Figure 7.3


    Interface Builder’s windows, which are described next. The Main Menu window is
    independent of the others and simulates the application menu.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_177_0.png)


    The Library window displays a library of Cocoa and other OS X items that can be
    added to the file. The Inspector window displays information about whichever item
    is currently selected in the Doc window. The Inspector and Library windows include
    tabs that can display subwindows.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_177_1.png)


    **TIP**


    For reasons that remain mysterious, windows in Interface Builder like to hide
    behind other windows. It’s helpful to get into the habit of selecting the Bring
    All To Front menu option to bring them to the front of the program. You can open
    multiple projects in Interface Builder. When you select Bring All To Front, they
    all appear, so it’s a good idea to work on a single project at a time.


    # Introducing the Document window


    Selecting the Doc window shown in Figure 7.4 reveals the full list of objects
    included in the blank template. Objects are arranged in a finder-like tree, with
    reveal triangles. Select the Window (First) object and click its reveal triangle.
    You’ll see another object, called Content View, which appears indented under Window.
    Indentation indicates that an object is “inside” another object, within a tree
    structure with the top-most object as the root.'
