  md: 'You could put this method inside a loop and poll it continuously to monitor
    the mouse position. But this would be inefficient, and it wouldn''t handle mouse
    clicks. Given Objective-C''s event-based programming model, it''s realistic to
    assume that there''s an event-based solution.


