  md: "There are a few subtleties in this code. If an object is a subclass of NSObject,\
    \ as here, initialize it with\n\n```\nif (self = [super init])\n{\n    ...\n```\n\
    \nIf it’s a subclass of some other class, initialize it with\n\n```\nif (self\
    \ = [super initWithCoder: coder])\n{\n    ...\n```\n\nThis implements the recursion,\
    \ which stops automatically when the superclass is NSObject.\n\nObject coding\
    \ should happen automatically, irrespective of the complexity or internal structure\
    \ of an object. For simple types, use type-specific encode and decode statements.\n\
    \n```\nencodeBool: forKey:\nencodeInt: forKey:\nencodeFloat: forKey:\nencodeDouble:\
    \ forKey:\n\ndecodeBoolForKey:\ndecodeIntForKey:\ndecodeFloatForKey:\ndecodeDoubleForKey:\n\
    ```\n\nOther numeric types can be wrapped inside an NSNumber or NSValue.\n\n#\
    \ Archiving and de-archiving an object\n\nThe code for saving and loading a record\
    \ follows. In this example, the code is in the App Delegate, but you can implement\
