- pgno: 69
  md: 'MVC allows a more efficient implementation. Cells still appear on the screen
    in a scrollable list, but they have no direct connection to the data source. As
    the user scrolls up and down the list, the controller removes cells from the top
    or bottom, refills them with data, and reinserts them at the bottom or top. Instead
    of displaying thousands of cells, the application can create the same scrollable
    effect with a handful. The controller object automates cell updates, and the process
    is transparent and invisible, at the cost of some extra setup and teardown.


    Controllers are glue code, but they’re intelligent glue code. They simplify access
    in both directions. Cocoa and Cocoa Touch both include prewritten controller classes
    to simplify interface design and eliminate unneeded code. You can also create
    custom controllers for your own applications.


    # Bundles and plists


    A bundle is the list of files included with an application. A bundle typically
    includes the .app executable, at least two icon files, and optional data, graphics,
    and support files. Applications also include at least one plist — a property list
    stored as XML files that points OS X at key application resources and includes
    essential application preferences. Cocoa includes object classes that can load
    data from a bundle and both read and write plists.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_69_0.png)


    # TIP


    In OS X, an application’s .app file is really a folder that contains the application’s
    bundle. To view the contents of a bundle, right-click an .app file in Finder and
    select Show Package Contents. You’ll see a Contents folder that you can open to
    reveal the bundle’s files and folders.


    # Comparing Cocoa to other platforms


    Every platform and environment has its own unique qualities. Objective-C and Cocoa
    are no different. Cocoa’s biggest strength is its sophistication. The object library
    is rich and powerful and it’s often possible to implement features with a few
    lines of code. The learning curve isn’t negligible, but the initial frustration
    is a temporary phase. With experience, Cocoa starts to feel productive and enjoyable.


    # Setup and teardown


    If you’re used to a simpler language like Flash, expect to spend some time dealing
    with new coding overheads. If you’re drawing graphics in Flash, a Flash stage
    is created for you automatically and you can immediately draw on it with ActionScript’s
    drawing functions. This makes Flash creatively rewarding because you can concentrate
    on results, not on overhead code.


    In Cocoa, you must create the equivalent of a stage yourself. Depending on the
    application, this can take many extra steps using code from a significant number
    of classes and frameworks. Initially, this can make Cocoa feel difficult and unsurprising.
    It’s not unusual for newcomers to feel that they’re disappearing into a rabbit
