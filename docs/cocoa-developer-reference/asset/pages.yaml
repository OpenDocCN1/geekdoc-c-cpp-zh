- pgno: 505
  md: '# Figure 18.16


    Most instruments include filtering features. For the Time Profiler, the Call Tree
    options at the left can cut down a very long and cluttered list of OS X internals
    and force the instrument to show only the methods in your code.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_505_0.png)


    On the iPhone, memory management is one of the core problems, and the most useful
    instruments report object allocations and memory leaks. Object Allocations, shown
    in Figure 18.17, is perhaps the single most useful instrument for iPhone development.
    It displays a list of all allocated objects and the application’s total memory
    footprint.


    To check for leaks, view the Live Bytes total for All Allocations. If it increases
    steadily as the application runs, or if it increases and doesn’t return to its
    original value after a user action, your application is leaking memory and will
    eventually crash. To find a leak, view the list of items under the # Living column.
    If this number is increasing, the object or function is leaking memory. Some leaks
    are built into iPhone OS and can’t be resolved. But this instrument can give you
    instant feedback about leaks in your code, saving you hours of development time.'
  merge: -1
  img_proc: true
- pgno: 506
  md: '**Figure 18.17**


    On the iPhone, Object Allocations is often the most useful instrument of all.
    It displays the total memory used and breaks it down by object and function.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_506_0.png)


    # ## Using Shark


    Shark, shown in Figure 18.18, is an alternative profiling tool available for both
    OS X and iPhone OS development. To use Shark effectively, close all open applications,
    including Xcode. Run your application independently by double-clicking its app
    file in its build folder. You can find Shark in the Applications Directory in
    the Developer Folder. Launch it by double-clicking Shark.app.


    Then, you wait. Shark takes a while to load and appears to do nothing for 30 seconds.
    During this time, it samples the selected application. Then it analyzes the samples.
    This can take a few seconds for a simple application, or a few minutes for a complex
    application with many threads and features. A progress indicator at the bottom
    right indicates the status of the analysis. When the analysis completes, Shark
    tallies the relative time the application spends in each of the listed methods
    and functions.'
  merge: -1
  img_proc: true
- pgno: 507
  md: 'Figure 18.18 shows Shark profiling the performance of the Firefox Web browser.
    Shark doesn’t include filters that distinguish between custom code and processes
