    \ in each folder. In this chapter, you'll concentrate on the contents of the top\
    \ three groups. All elements are essential — a project won't build without them\
    \ — but some can be used as is, without changes.\n\n# NOTE\n\nThe files in a real\
    \ project include the project name as a prefix. This prefix isn't included in\
    \ the table.\n\n# Table 6.1 Elements of a Cocoa Application\n\n| Element | Explanation\
    \ | Group |\n|---|---|---|\n| Class files | Source code for the application's\
    \ class templates. | Classes |\n| main.m | Standard application start-up code.\
    \ (This file can be edited, but isn't usually modified.) | Other Sources |\n|\
