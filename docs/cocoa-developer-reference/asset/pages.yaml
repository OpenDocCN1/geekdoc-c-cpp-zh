- pgno: 537
  md: "> **CAUTION**\n> \n> Toolbars and tab bars do not work well with split views\
    \ and popovers, especially when they are placed at the bottom of the screen. Apple's\
    \ guidelines suggest that apps should not use them. However, you can add two separate\
    \ navigation bars to the views in a split view layout. This improves the appearance\
    \ of an app, even if the navigation bar is cosmetic and does nothing.\n\n# # Developing\
    \ for iOS in Xcode\n\nThe iPhone Simulator and its target devices support a subset\
    \ of the standard Xcode debugging tools. Interface Builder is also simplified.\
    \ The Library lacks many of the standardized objects available in OS X, including\
    \ menu trees and the various data controller types. UIKit objects replace the\
    \ view design objects available in OS X. To support the different frameworks in\
    \ iOS, the SDK includes alternative documentation, new code samples, and a different\
    \ set of iOS project templates to match various possible app types. Template details\
    \ are listed a little later in this chapter.\n\n# ## Using the Xcode Simulator\n\
    \nThe Xcode Simulator is adequate for basic testing, and it can emulate display\
    \ rotation and shake events. However, the Simulator is not a perfect model of\
    \ the target devices. Code runs much more quickly in the Simulator, so it cannot\
    \ be used for performance testing. There may also be minor differences between\
    \ the simulated SDK and the iOS running on a real device. Code that works in the\
    \ Simulator may occasionally crash on hardware and vice versa.\n\n> **CROSS-REF**\n\
    > \n> For information about downloading and installing Xcode and the iPhone Simulator,\
    \ see Chapter 4.\n\nThe Simulator can emulate an iPhone and an iPad. To test iPhone\
    \ apps on the iPad, choose the iPad Simulator as the Active Executable in the\
    \ Build selector drop-down menu in Xcode. This runs the app inside the iPad’s\
    \ emulation window.\n\nTo convert an iPhone project to an iPad project, make a\
    \ safety copy outside Xcode. Load the copy into Xcode, right-click a compiled\
    \ target, and choose Upgrade Current Target for the iPad. This modifies the nib\
    \ file and makes it possible to run the app as a full-screen native iPad app.\
    \ There is no way to downgrade an iPad project back to the iPhone.\n\n> **TIP**\n\
    > \n> In spite of its limitations, you should use the Simulator for most of your\
    \ development cycle. Compiling and loading an app into a hardware device take\
    \ an extra minute or two, which slows down development. It can also clutter devices\
    \ with unwanted, half-finished apps."
  merge: -1
  img_proc: true
- pgno: 538
  md: "The accelerometer and compass are absent in the Simulator. Core Location returns\
    \ a single position fix for the location of Apple’s headquarters in Cupertino.\
    \ Camera features are not available on Macs with a camera, and the photo, video,\
    \ and iPod libraries are not fully implemented. To fully test code that accesses\
    \ these features, you must run your app on a real device.\n\n> **NOTE**  \n> You\
    \ must use the USB connector to load apps into a device. Bluetooth and wireless\
    \ downloading are not supported. To use the live debugging tools, you must run\
    \ apps with the cable connected. Once an app has been installed, you can disconnect\
    \ the cable and test it away from your Mac, but you cannot debug it without the\
    \ cable link. Installed apps can be docked, deleted, and rearranged on Springboard\
    \ like other apps.\n\n# Introducing the Xcode templates\n\nAs with OS X, Xcode\
    \ includes a set of application templates for iPhone and iPad projects, shown\
    \ in Figure 19.15. They include barebones app skeletons that you can flesh out\
    \ with your own code. A selection of relevant useful methods is included in each\
    \ file, but most are commented out. The included methods are not comprehensive\
    \ (many more are listed in the class reference documentation) but are a convenient\
    \ reminder of the most widely used features in each class.\n\n**Figure 19.15**\n\
    \nA first view of the templates included in the 3.2 iOS SDK. Use the Product drop-down\
    \ list to choose either an iPad or iPhone project.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_538_0.png)"
