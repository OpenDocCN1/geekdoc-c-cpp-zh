- pgno: 345
  md: "# Figure 13.10\n\nTempverter: a very simple temperature conversion application,\
    \ implemented with KVO and bindings\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_345_0.png)\n\
    \nIt’s possible to solve this problem with outlets and the text field’s delegate\
    \ methods, using `(IBAction)` sender to discover which text field was changed,\
    \ and adding code to update the other. Bindings not only make it easy to manage\
    \ multiple dependencies, but they also simplify the code. The two temperature\
    \ values can be floats. Bindings convert floats into text for display, and they\
    \ convert text into floats for user input. There’s no need to add formatting code\
    \ or supporting intermediate values.\n\nIn a more complex application, this can\
    \ be extended to create multiple propagating dependencies with very little code.\
    \ But to create a complex UI, you need to understand the key features of a simple\
    \ one.\n\nThe nib file for the project is shown in Figure 13.11. The nib is a\
    \ standard content view with four text fields. Two are static labels; the other\
    \ two are used for temperature input and display.\n\n> **NOTE**\n> \n> Figure\
    \ 13.11 includes a view of the Window Attributes. The window size is fixed by\
    \ selecting the Resize control. Close and Minimize have also been disabled. Texture\
    \ and Shadow effects are applied. These features don’t affect the application’s\
    \ operation, but they do improve its appearance.\n\nThe header file for the App\
    \ Delegate is shown below:\n\n```\n```objc\n#import <Cocoa/Cocoa.h>\n@interface\
    \ TextFieldAppDelegate : NSObject\n    <NSApplicationDelegate>\n{\n    NSWindow\
    \ *window;\n    float celsFloat;\n    float fahrFloat;\n}\n@property (assign)\
    \ IBOutlet NSWindow *window;\n@property float celsFloat;\n@property float fahrFloat;\n\
    @end\n```\n```"
  merge: -1
