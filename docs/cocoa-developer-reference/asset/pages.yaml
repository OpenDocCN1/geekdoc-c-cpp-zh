  md: "Optionally you can add `inDirectory:subPath` to specify a subpath. To find\
    \ an array of paths to multiple files with the same extension, use:\n\n```\n```objc\n\
    NSArray *theArrayOfPaths =\n[[NSBundle mainBundle] pathForResourcesOfType:@\"\
    ext\"\n    inDirectory:subPath];\n```\n```\n\n# Finding other standard directories\n\
    \nTo find a standard system directory such as `/Documents` use:\n\n```\n```objc\n\
    NSString *standardDirectory;\nNSArray *paths = NSSearchPathForDirectoriesInDomains\n\
    \                 (NSDocumentDirectory, NSUserDomainMask, YES);\nif ([paths count]\
    \ > 0) {\n    standardDirectory = [paths objectAtIndex:0];\n}\n```\n```\n\nIn\
    \ OS X, you can replace NSDocumentDirectory with one of the other NSSearchPathDirectory\
    \ constants. You can find the full set of definitions in the Foundation Data Types\
    \ Reference. For example:\n\n+   - `NSApplicationDirectory` — the application’s\
    \ root directory\n+   - `NSDesktopDirectory` — the desktop\n+   - `NSDownloadsDirectory`\
    \ — the default download location\n\nThis technique is more reliable than starting\
    \ with the root system path and appending `/Documents` to it. Standard directories\
    \ may not be where you expect them to be, and this approach is more likely to\
    \ return a valid path to them.\n\n# Using autocompletion\n\nCocoa includes an\
    \ autocompletion feature that scans a target directory for a list of filenames\
    \ that match a template. This is independent of the file search implemented in\
    \ Spotlight.\n\n```\n```objc\nNSString *testPath = @\"usr/somepath/a\";\nNSString\
    \ *longestCompletion;\nNSArray *outputArray;\n\nunsigned allMatches =\n    [testPath\
    \ completePathIntoString:&longestCompletion\n        caseSensitive:NO\n      \
    \  matchesIntoArray:&outputArray\n        filterTypes:NULL];\n```\n```\n\nallMatches\
    \ returns a count of matching files that start with “a,” and outputArray returns\
    \ an array of full paths to each matching file. For a practical example, set testPath\
    \ to a valid directory path and append the search string to find matching files."
