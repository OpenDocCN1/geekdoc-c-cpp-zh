  md: "Table 5.1 lists some possible practical applications. *Properties* are data\
    \ fields, and *methods* are code blocks that can be triggered inside an object\
    \ to elicit a response.\n\n| Object | Possible Properties | Possible Methods |\n\
    |---|---|---|\n| GUI window object | Position<br>Size<br>Opacity<br>Front/key\
    \ window status | Respond to a mouse click<br>Maximize/Minimize/Close<br>Move\
    \ to position<br>Report position<br>Bring to front |\n| Game object or token |\
    \ State<br>Position<br>Velocity<br>Texture | Move to position<br>Change state<br>Change\
    \ texture<br>Redraw |\n| Game playing field | Game state<br>Game score<br>Player\
    \ number<br>Array of tokens | Update score<br>Start with new player<br>Report\
    \ high score |\n| Address book | Individual entry (can be a subobject)<br>Entry\
    \ subproperties | Add entry<br>Delete entry<br>Update subproperty<br>Count entries<br>Save/restore\
    \ entries<br>Search entries |\n| Music synthesizer or sample event | Synthesizer/sampler\
    \ settings<br>Note start/end times | Play note<br>Stop note<br>Create note with\
    \ settings |\n| Generic object | Pointer reference<br>Memory state | Create<br>Destroy\
    \ and release memory<br>Copy<br>Save/restore from disk |\n\nPart of the challenge\
    \ of object-oriented programming is object design. The ideal design encapsulates\
    \ powerful features within a clean and intuitive interface that is responsive\
    \ and easy to work with.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_117_0.png)\n\
    \n> **NOTE**\n> \n> Cocoa also includes hybrid data structures that aren’t true\
    \ objects but are partially interchangeable with them. Formally these are plain\
    \ C-language structs, but they can be cast or copied to a related Cocoa object\
    \ class. In a typical application you use a combination of Cocoa objects, hybrid\
    \ structs, and standard C data types."
