  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_40_0.png)


    # # Think Cocoa!


    ![](img/2b293e29fc15b0797f113b85dd429b6e_40_1.png)


    Although it’s possible to learn Cocoa by rote, laboriously listing its objects
    and trying to memorize their key properties and code interfaces, Cocoa comes alive
    when you understand its design principles in a more open way. Some of these principles
    derive from Objective-C. Others are related to Aqua — the OS X look and feel built
    on top of Cocoa — and are described in more detail later in this chapter. It’s
    much easier to master Cocoa by understanding its design philosophy and filling
    in coding details, as needed, than by working backward from Cocoa code examples.


    # ## Designing for Cocoa


    Apple products emphasize creative design; a successful design includes the following
    three elements:


    +   - **Outstanding aesthetics.** Applications should look inspiring and attractive,
    and users should feel curious and fascinated as soon as they see the interface.
    But design should enhance features without overpowering them.


    +   - **A sense of fun and creative possibility.** This element isn’t always appropriate
    — for example, it’s not usually emphasized in office applications — but even the
    simplest or most straightforward applications can include elements that inspire
    users.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_40_2.png)


    # TIP


    Applications sometimes try to fake fun and creativity by including templates and
    canned content. This can be popular with users, but it’s more rewarding — and
    more difficult — to create an application that empowers users to be completely
    original.


    +   - **A clean and intuitive mental model.** Users should be able to understand
    the application’s features with as little conscious effort as possible. The application
    should be invisible; users should never have to think about how to perform an
    operation.


    | In This Chapter |

    |---|

    | Designing with Cocoa |

    | Creating Cocoa applications |

    | Moving to Cocoa and Objective-C from other platforms |


    ![](img/2b293e29fc15b0797f113b85dd429b6e_40_3.png)


    # CAUTION


    Users may have many ideas about how features should work. A clean and intuitive
    mental model can still fail if it doesn’t match those expectations. For example,
    users sometimes find iTunes difficult because they assume that an iPod can work
    as an external USB drive. As a model, an external drive is simpler than the way
    iTunes really works, leaving them frustrated.'
  merge: -1
  img_proc: true
