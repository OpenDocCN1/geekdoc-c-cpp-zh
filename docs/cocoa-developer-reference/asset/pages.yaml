  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_165_0.png)


    # CAUTION


    NSResponder is an abstract class. You can’t create an instance of NSResponder,
    but you can create instances of its subclasses. Fortunately, NSResponder is a
    bundle of methods that implement event handling for window, view, and application
    objects. You can subclass it to create your own event-driven objects. Developers
    occasionally debate whether NSResponder would be better implemented as a protocol.
    The answer may well be “yes,” but it’s implemented as an abstract class, so that’s
    how it has to be used.


    Like protocol methods, the NSResponder methods are designed to be overridden.
    You use them by copying their signature, adding them to a receiver, and then implementing
    them with custom code. In this example, you want to make window respond to mouse
    events, so window is the receiver. The code


    ```

    ```objc

    [window mouseDown: theEvent];

    ```

    ```


    doesn’t work because it sends a message to the window. You’re looking for a message
    handler in the window.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_165_1.png)


    # TIP


    You can use this code to send simulated mouse clicks to a window. In fact, you
    can trigger any NSResponder method artificially by running the method from your
    code. Most applications don’t need this, but you can use this feature to create
    mouse and key event automation.


    But where does the code go? There are no class files for NSWindow. How can you
    modify it?


    # Subclassing NSWindow


    An obvious solution is to subclass NSWindow and extend it with a mouse-handling
    method. If you subclass NSWindow, you can add one or more custom methods to it,
    including some of the NSResponder methods.


    Xcode includes features that make it easy to add a subclass to a project. Right-click
    the Classes group at the top of the Groups & Files pane in Xcode and choose Add
    ➔ New File, as shown in Figure 6.19. You can also choose File ➔ New File from
    the main menu.


    Select Cocoa Class in the Mac OS X pane at the left, and select Objective-C class
    in the list of file types at the top, as shown in Figure 6.20. Locate the Subclass
    Of drop-down list halfway down the window, and click NSObject if it’s not already
    selected.'
