    \nNSBlockOperation supports both named and inline blocks, but does not allow parameters\
    \ to be passed or returned. The equivalent block-based implementation of your\
    \ prime generator follows:\n\n```\n```objective-c\n#import \"NSBlockOperationAppDelegate.h\"\
