  md: "Some names are predefined. For example, `NSWindow` posts `NSWindowDidBecomeKeyNotification`\
    \ and `NSWindowWillCloseNotification`, among others. If they exist, you can find\
    \ the notification names listed at the bottom of a Class Reference.\n\nIf a message\
    \ triggers a notification automatically, you’ll also find the notification listed\
    \ in the method description; for example, sending update to a window updates it\
    \ and posts an `NSWindowDidUpdateNotification` object. This “just happens” — it’s\
    \ built into the method.\n\n# Posting notifications\n\nYou can create custom notifications\
    \ with custom names. To post an identification, use\n\n```\n    [[NSNotificationCenter\
    \ defaultCenter]\n        postNotification: @\"AName\"\n                    object:\
    \ anOptionalObject];\n```\n\nOften an `OptionalObject` is `self`, giving the notification\
    \ an explicit return address. You can also use the object field to pass useful\
    \ information in a dictionary, array, or string, or in a pointer to another object.\
    \ It’s up to the sender and receiver to agree on the contents of the notification\
    \ and how they’ll be used — or more accurately, it’s up to you to define the format\
    \ for both.\n\nAn optional extended method supports both an optional object and\
    \ a dictionary you can pack with other objects.\n\n```\n    [[NSNotificationCenter\
    \ defaultCenter]\n        postNotification: @\"AName\"\n                    object:\
    \ anOptionalObject\n                   userInfo: aDictionary];\n```\n\nTo define\
    \ a method that receives and processes notifications, use\n\n```\n- (void) handlerMethod:\
    \ (NSNotification *) theNotification {\n    NSString *theName = theNotification.name;\n\
    \    id *theObject = theNotification.object;\n    NSDictionary *theDictionary\
    \ = theNotification.userInfo;\n}\n```\n\nPlug this method into the handler selector\
    \ slot when you register a notification. All data fields are optional. You may\
    \ not need them, because sometimes it’s enough to know that a certain event happened.\n\
    \n# Using notifications and delegates\n\nNotifications include a useful shortcut.\
    \ If an object has a delegate, the delegate automatically observes notifications\
    \ and can trigger a corresponding delegate method. There’s no need to define an\
    \ observer."
