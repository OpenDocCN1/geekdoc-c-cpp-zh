    \ object.\n\nSaving is straightforward. Your code is responsible for conversion,\
    \ but the rest of the process is automatic.\n\nOpening is less straightforward.\
    \ When `readFromData:` runs, the new document hasn’t yet been created, so you\
    \ can’t initialize its contents, because there’s nothing to initialize. The solution\
    \ is to save the document data to a temporary store in `readFromData:`. Then in\
    \ the `windowControllerDidLoadNib:` method, add code to copy data from the store\
    \ to the new document. This guarantees that the document is initialized correctly\
    \ after it’s created, as illustrated in Figure 15.10.\n\n# Figure 15.10\n\nUnderstanding\
    \ how the default save and open operations work, and how to add supporting code\n\
