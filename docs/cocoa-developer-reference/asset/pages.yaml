- pgno: 440
  md: 'The oval path returns an oval or circle that touches the edges of the surrounding
    rectangle. If the height and width are equal, the path is circular.


    For more complex shapes, you can define the path in sections. The number and order
    of sections are arbitrary, and they do not have to be contiguous. Useful methods
    include


    +   - `moveToPoint`: Moves the drawing position to an arbitrary point without
    creating a mark.

    +   - `lineToPoint`: Moves the drawing position to a point, creating a line.

    +   - `closePath`: Moves the drawing position to the start of the path, creating
    a closed shape.


    `relativeMoveToPoint` and `relativeLineToPoint`: convenience methods are available.
    They take relative rather than absolute coordinates to simplify certain path calculations.


    # Creating Bezier paths with control points


    `curveToPoint:controlPoint1:controlPoint2:` draws a curve from the current position
    to a point using two control points to define a Bezier curve, as shown in Figure
    16.8. The control points are invisible, but they define the shape of the curve.
    Bezier curves are used to define glyph shapes in fonts, but you can use them in
    any application that requires arbitrary line shapes.


    # Figure 16.8


    A Bezier curve defined by two control points. The points are invisible “handles”
    that define the curvature of the path. They can be placed anywhere to create an
    almost infinite range of curves.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_440_0.png)


    # Creating composite Bezier paths


    You can join paths to create complex composite paths. Use `appendBezierPath:`
    to join one path to another. Variations include


    +   - `appendBezierPathWithPoints:` Takes an array and interprets the elements
    as points joined by line segments.

    +   - `appendBezierPathWithArcFromPoint:toPoint:` Creates an arc between two points.

    +   - `appendBezierPathWithGlyph:InFont:` Adds a font glyph from a selected font.'
  merge: -1
  img_proc: true
- pgno: 441
  md: "**NOTE**\n\nYou must use the appendBezierPath: methods to create arcs. You\
    \ can only append arcs to a path; you can't initialize or create a path with an\
    \ arc.\n\n# Stroking and filling paths\n\nOnce you have a path object, you can\
    \ draw it by calling the stroke and fill methods on it. Optionally, you can set\
    \ a color, line type, and line width for these methods. The default color is black,\
    \ the default line type is unbroken, and the default width is 1 pixel.\n\nAdditionally,\
    \ you can define line end caps to create arrow heads or lines with curved terminations.\
    \ You can also specify line mitres to create butt-end or sharpened line joins.\
    \ See the NSBezierPath Class Reference for details. Color is global, but line\
    \ features are properties of a path object.\n\nAs a very simple example, you'll\
    \ create a rectangle offset from the edges of a container view. Rect calculations\
    \ can become complex because the bottom-left origin complicates size and position\
    \ calculation. It's often useful to center objects, but this is only possible\
    \ by calculating the size and position manually.\n\nStart by creating a new blank\
    \ project. Create a new NSView subclass called RectsView. Open IB and assign the\
    \ subclass to the container view. Add the following code to the drawRect: method\
    \ in the new view:\n\n```\n    - (void)drawRect:(NSRect)dirtyRect {\n        float\
    \ rectOffset = 30;\n        NSRect boundsRect = self.bounds;\n        NSRect newRect\
    \ = NSMakeRect(boundsRect.origin.x+rectOffset,\n                             \
    \       boundsRect.origin.y+rectOffset,\n                                    boundsRect.size.width-2*rectOffset,\n\
    \                                    boundsRect.size.height-2*rectOffset);\n \
    \       NSBezierPath *newPath =\n            [NSBezierPath bezierPathWithRect:newRect];\n\
    \        [newPath stroke];  //Draw the path\n    }\n```\n\nSave the file and nib.\
    \ Build and Run the project. Figure 16.9 shows the result.\n\nChange [newPath\
    \ stroke] to [newPath fill]. Build and Run the project. You'll see that the rectangle\
    \ is now filled with solid black, as shown in Figure 16.10.\n\n# Using colors\n\
    \nIn Cocoa, NSColor defines a color object. Call the set method on the color object\
    \ to set fill and stroke colors. Convenience methods are available for various\
    \ predefined colors. See the NSColor Class Reference for a list."
