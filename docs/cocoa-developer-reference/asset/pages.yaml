  img_proc: true
- pgno: 565
  md: 'Next, you learned about the differences between the OS X and iOS development
    models and were introduced to the limitations and design opportunities of the
    mobile platform. You explored some of the key features of the iOS programming
    model and discovered the importance of views and view controllers in app design.
    You also explored the properties of the iOS templates in Xcode, and you examined
    in detail the code and view designs of a simple view-switching app with two different
    approaches to view control and event handling.


    Finally, you were introduced to the iOS security model and discovered how to acquire
    the certificates and provisioning profiles needed to test apps on physical devices,
    how to install them in Xcode, and how to build apps for testing and distribution.
    You were also introduced to the iPhone Developer Program Portal and iTunes Connect,
    and you learned how to prepare, package, and upload an app to the App Store and
    how to set up contracts, tax information, and bank details to receive income from
    your app.'
