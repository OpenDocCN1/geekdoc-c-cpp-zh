- pgno: 366
  md: 'Key features of the application include:


    +   - **The Preferences item in the application menu triggers** a `showPreferences:`
    method in the App Delegate.

    +   - **The method allocates an instance of a custom Preferences Controller object.**

    +   - **When the Preferences Controller is created, it uses a custom init method
    to load and display the contents of a separate Preferences Panel nib file.** The
    nib, shown in Figure 13.23, includes some UI elements and an instance of `NSUserDefaultsController`.
    The UI elements are bound to the controller. The code initializes the preferences.
    UI updates, saving, and loading are handled automatically by the controller. No
    other code is needed.

    +   - **The main application window includes a couple of UI elements that are
    bound to another copy of `NSUserDefaultsController`.** (Because this is a shared
    object, every copy accesses the same data.)

    +   - **Color data can’t be bound, so color updates are monitored with KVO.**
    Observers are initialized for every preferences key. The common observer method
    checks the key and runs update code to change the background color of the main
    text view when the color preference is updated.

    +   - **In a more complex application, code here could add further auto-refresh
    features.**

    +   - **One of the bound fields uses a value transformer, described below.**


    ![](img/2b293e29fc15b0797f113b85dd429b6e_366_0.png)


    # NOTE


    > > You can add an empty nib file to any project by right-clicking the Resources
    group in Xcode, choosing **Add > New File**, selecting the **User Interface**
    tab and **Empty XIB**, and then saving and naming the file in the usual way.


    Figure 13.24 shows the preferences panel nib. Instead of an NSWindow, the panel
    uses an instance of NSPanel to create a customized window suitable for preferences
    and other lightweight display tasks. Otherwise, it’s a standard nib with a content
    view, some controls, and the Shared Defaults controller.


    To bind to values in `NSUserDefaultsController`, use the values Controller Key.
    In the same way that `NSArrayController` offers arrangedObjects, selection, selectionIndex,
    and other defined keys, `NSUserDefaultsController` offers the simpler values controller.
    As the name suggests, this is a simple list of its values. To access a value,
    type in its key name in the Model Key Path.'
  merge: -1
