    can appear overwhelming. You don’t need to memorize these lists, and it’s a given
    that unless you have developer superpowers, you won’t immediately know how to
    use all the features that appear. Cocoa is a library of connected objects and
    features. Some are self-explanatory, but others won’t make sense until you’ve
    learned more about how Cocoa objects work together.


    For a first project, you’ll attempt a very simple task — changing the window’s
    title string. Scroll down through the list of tasks to find the Managing Titles
    subheading. As you might expect, this subheading includes a list of features devoted
    to managing the title bar. Each blue item is a clickable link. `setTitle:` looks
    like a possible solution, so click the `setTitle:` link to read a description
    of this method.


    **CAUTION**


    Methods and properties often match their names in an intuitive way, but sometimes
    they don’t. For example, you might expect the `center` method to center the window
    in the screen. In fact it centers it horizontally, but places it above center
    vertically for prominence and visual impact. To avoid surprises, check the full
    description of a feature before you use it.'
