- pgno: 462
  md: "# Creating a timer for animation\n\nAn animation timer is simply a timer that\
    \ runs a dedicated animation method. There are no special animation timers in\
    \ Cocoa. To create a timer, use the standard `NSTimer` object. The target is often\
    \ `self`, but can be a different object.\n\n```\n```objective-c\nNSTimer *theTimer\
    \ = [NSTimer scheduledTimerWithTimeInterval:\n                     float\n   \
    \                  target: anObject\n                     selector: @selector(theAnimationMethod:)\n\
    \                     userInfo: anOptionalObject\n                     repeats:\
    \ YES];\n```\n```\n\nImplement the animation timer method in the target object:\n\
    \n```\n```objective-c\n- (void) theAnimationMethod: (NSTimer *) theTimer {\n \
    \   //Do something to a property here\n}\n```\n```\n\nFigure 17.1 illustrates\
    \ a simple example. The view includes a single button. The code moves the button\
    \ in a tight cycle around the center of the view and modifies its size dynamically.\
    \ The button is always active: if you can catch it, you can click it. It could\
    \ be connected to a selector action in the usual way.\n\n# Figure 17.1\n\nThe\
    \ flying button, an unusual UI design you’re unlikely to see in a finished application\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_462_0.png)"
  merge: -1
  img_proc: true
- pgno: 463
  md: "# Creating property animation code\n\nWith direct property animation, you have\
    \ complete freedom over how you implement the animation features. The key section\
    \ of code for this example follows:\n\n```\n```objc\n@synthesize window, theButton;\n\
    float bOffX, bOffY, currX, currY, centerX, centerY, timeCount,\n      radius,\
    \ theta;\nCGPoint currPoint;\n- (void)applicationDidFinishLaunching:\n(NSNotification\
    \ *)aNotification {\n    NSTimer *aTimer =\n    [NSTimer scheduledTimerWithTimeInterval:0.017\n\
    \        target: self selector: @selector(timerMethod)\n        userInfo: nil\
    \ repeats: YES];\n}\n- (void)timerMethod\n{\n    timeCount += 0.0;\n    theta\
    \ = timeCount/6.283;\n    bOffX = NSMidX(theButton.bounds);\n    bOffY = NSMidY(theButton.bounds);\n\
    \    centerX = window.frame.size.width/2;\n    centerY = window.frame.size.height/2;\n\
    \    radius = centerY*0.6;\n    currX = centerX+radius*cos(theta)-bOffX;\n   \
    \ currY = centerY+radius*sin(theta)-bOffY;\n    currPoint = NSMakePoint(currX,\
    \ currY);\n    [theButton setFrameOrigin:currPoint];\n    [theButton setFrameSize:\n\
    \    NSMakeSize(50+25*cos(2*theta), 50+25*cos(3*theta))];\n}\n```\n```\n\nThe\
    \ timer method updates the position counter, calculates the center of the view,\
    \ and then uses simple trigonometry to create a circular path for the button.\
    \ The position is repositioned by updating its frame origin with `setFrameOrigin:`;\
    \ and it is resized by updating the frame size with `setFrameSize:`. An offset\
    \ term corrects for the lower-left origin of the button’s frame and moves the\
    \ draw point to the center of the button.\n\nThis is moderately complex code for\
    \ a simple effect. It’s also heavily load dependent. If your Mac is busy, the\
    \ button will stutter. This approach also makes it difficult to manage multiple\
    \ simultaneous animations. It’s a good solution when you need to animate a small\
    \ number of related properties, but it’s difficult to work with if you have more\
    \ than one independent animation happening at once. You can create a separate\
    \ timer for each animation, but this approach soon starts to become unwieldy.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_463_0.png)\n\n# TIP\n\nWhen animating\
    \ position and size, set an object’s frame property, not its bounds. This also\
    \ applies to rotation. A full rotation solution requires a backing layer, which\
    \ is described later in this chapter."
  merge: -1
  img_proc: true
