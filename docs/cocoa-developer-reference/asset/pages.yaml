- pgno: 594
  md: '# Solving Impossible Problems


    If you spend more than a couple of days on a problem without making any progress,
    and you’ve exhausted the official documentation and all possible Internet resources,
    you may be dealing with an Impossible Problem. Not all Impossible Problems are
    truly impossible — sometimes sustained effort can lead to a simple solution. But
    they can divert a project into an unproductive dead end, and waste time that might
    be spent more usefully.


    When trying to solve an Impossible Problem, it can be useful to step back and
    consider project strategy rather than coding tactics. Strategy defines goals,
    and tactics define how they’re implemented. Many Impossible Problems are tactical:
    thinking strategically can sometimes help you sidestep them and keep the project
    moving. Consider these questions:


    +   - **Does the problem need to be solved?** Impossible Problems often develop
    a momentum of their own, monopolizing your attention. You can minimize this by
    considering the problem from a user’s point of view. How essential is the feature
    that’s being implemented? If a user won’t miss it if it’s not included, leave
    it out or move it to the feature wish list for later versions.

    +   - **Does the problem need to be solved now?** Leaving a problem unsolved can
    feel very unsatisfying, but it may be the only way to move a project forward.
    Putting a problem to one side may move a project in a new direction, making the
    problem irrelevant or solving it in an unexpected way.

    +   - **Is there another way to achieve the same result?** When the final aim
    is a specific user benefit, there may be a simpler way to offer it.

    +   - **Can the problem be solved?** Some problems are truly impossible for either
    formal or informal reasons; for example, they may be mathematically intractable,
    or they may require too many processor cycles.

    +   - **Has the problem already been solved?** Many problems are easy to solve
    in theory, but too difficult or time-consuming to code in practice. A satisfying
    solution is to use code or a framework created by another developer. Because so
    much code is either formally open sourced or available online, common problems
    are likely to have at least one ready-made solution, such as the iPhone Exif handling
    framework, shown in Figure B.6, which is a solution for a complex problem that
    would otherwise require days or weeks of independent effort.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_594_0.png)


    # TIP


    Open source code may include licensing restrictions; for example, you may be expected
    to open source your own project if you include code released under the General
    Public License (GPL). There is a distinction between using code as is and reverse
    engineering it. Taking concepts from an existing solution without copying and
    pasting code is one possible way to avoid licensing restrictions.'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# Figure B.6


    Code repositories such as Source Forge (http://sourceforge.net), GitHub (http://github.com),
    and Google Code (http://code.google.com) have hundreds of prewritten frameworks
    you can drop into a project, such as the EXIF framework shown here.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_595_0.png)


    # Summary


    In this appendix you were introduced to some simple but effective project management
    techniques, you explored checklists of common errors with likely solutions, and
    you looked at resources for online help. Finally, you were given hints for keeping
    a project moving when faced with problems that appear impossible — but often aren’t.'
  merge: -1
