    \ on the counter application from the previous example. Two buttons create a counter\
    \ that counts up and down. The timer is replaced by the continuous property. When\
    \ this is enabled, trigger events are generated while the mouse button is held\
    \ down.\n\nFigure 9.8\nA simple target-action application. Selecting the Flip\
    \ button swaps the selectors in the Up and Down buttons.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_240_0.png)\n\
    \nThe buttons are linked to `addOne:` and `subtractOne:` methods that change the\
    \ value of a timer variable. The value is displayed in a text field. Figure 9.9\
    \ shows the elements and links in the nib file.\n\n`upButton`, `downButton`, and\
    \ the `theText` outlets link to the properties of the two main buttons and the\
    \ text field. The `addOne:` and `subtractOne:` methods control a counter. The\
    \ `flipButton` action triggers the button flip method.\n\nThe header file for\
    \ the project defines the objects, outlets, and actions that are used.\n\n```\n\
    ```objc\n#import <Cocoa/Cocoa.h>\n@interface TargetAction_AppDelegate : NSObject\n\
    {\n    NSWindow *window;\n    NSTextField *theText;\n    NSButton *upButton;\n\
    \    NSButton *downButton;\n}\n@property (nonatomic, retain) IBOutlet NSWindow\
    \ *window;\n@property (nonatomic, retain) IBOutlet NSTextField *theText;\n@property\
    \ (nonatomic, retain) IBOutlet NSButton *upButton;\n@property (nonatomic, retain)\
    \ IBOutlet NSButton *downButton;\n- (IBAction) addOne: (id) sender;\n- (IBAction)\
    \ subtractOne: (id) sender;\n- (IBAction) flipButtons: (id) sender;\n@end\n```\n\
    ```"
