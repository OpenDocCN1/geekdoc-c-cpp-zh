    \  openPanel.URL];\n```\n```\n\nYou’ll see that the application is now maintaining\
    \ the Open Recent list, but it isn’t yet responding when the user clicks a recent\
    \ file to reload it.\n\nThere are various ways to implement reloading, but the\
    \ simplest is to add the following method to the App Delegate:\n\n```\n```objc\n\
    - (BOOL)application:(NSApplication *)theApplication\n    openFile:(NSString *)filepath\
    \ {\n// Open code here\n}\n```\n```\n\nThis method runs when a user selects an\
    \ item in the Open Recent menu, passing the filepath as a string. You can duplicate\
    \ the detailed open code here, or — more efficiently — extract the detailed open\
    \ code from the open pane block and place it in a separate method. The active\
    \ open code can then be called by the block, or from this method in the App Delegate.\
