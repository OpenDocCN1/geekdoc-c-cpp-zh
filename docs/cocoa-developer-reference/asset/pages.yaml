- pgno: 521
  md: '# Figure 19.4


    A typical iPhone app is closer to a dashboard widget than a full OS X app and
    has a simple function controlled by a minimal streamlined interface. Once a developer
    has mastered the essentials of app design, the development cycle can become very
    fast.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_521_0.png)


