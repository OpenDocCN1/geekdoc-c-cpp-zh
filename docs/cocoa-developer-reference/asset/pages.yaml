- pgno: 139
  md: '# Exploring standard application elements


    In an empty template, there are exactly three source code files. Two are usually
    used as is, and another is only modified occasionally. The main.m file, shown
    in Figure 6.1, is a standard C main() function. All Cocoa applications include
    this file. It runs a loader function called NSApplicationMain(), which initializes
    a memory manager, and then loads and runs the body of the application. It''s possible
    to modify this file to create a different start-up environment, but you can ignore
    it in most projects.


    Similarly, you can usually ignore the _Prefix.pch file. It contains an import
    directive for the Cocoa library header collections and is used to speed up compilation
    by making sure that these headers are only compiled once. Occasionally you may
    choose to add extra header collections here. More typically, you''ll leave it
    unchanged.


    By default, your application ignores the Info.plist option for string localization.
    There are two ways to support non-English languages in a Cocoa application: localization
    strings and localized nib files. If you''re developing for an English-speaking
    audience, you can ignore these options. If not, you can find out more about localization
    in Chapter 9.


    # Introducing the application delegate


    Active application code is collected in the files in the Classes folder. If your
    project is named First you''ll see two files called FirstAppDelegate.h and FirstAppDelegate.m.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_139_0.png)


    **TIP**

    For clarity, the Classes folder only includes code for subclasses. You can — and
    often do — use Cocoa classes and objects as is, without subclassing them.


    The architecture of a Cocoa application is unexpectedly indirect. An NSApplication
    object exists, but you rarely access it directly. Instead, whenever OS X sends
    an application-level message, the message is passed to an application delegate
    object. The delegate handles messages that are sent by OS X when the application
    is about to quit, when the user hides it or unhides it, when OS X runs out of
    memory, and so on.


    Unlike the application object, the delegate is designed to be subclassed. When
    you create a new project, a delegate subclass with the AppDelegate suffix is created
    for you automatically. To a good approximation, this delegate is the application.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_139_1.png)


    **NOTE**

    Using a delegate may seem redundant and unnecessarily complex, but it offers practical
    advantages. You''ll look at them later in this chapter.


    This delegate can be extended with handlers for every application control message
    generated by OS X, but the default template-generated delegate is lightweight
    and does very little. The code defines a link to a window object and includes
    a single stub method that is triggered when the application loads.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "Click `FirstAppDelegate.h` to reveal it in the Editor Window. The interface\
    \ looks like this:\n\n```\n```objc\n#import <Cocoa/Cocoa.h>\n@interface FirstAppDelegate\
    \ : NSObject <NSApplicationDelegate> {\n    NSWindow *window;\n}\n@property (assign)\
    \ IBOutlet NSWindow *window;\n@end\n```\n```\n\nTable 6.2 breaks down the features\
    \ in detail.\n\n| Feature | Explanation |\n|---|---|\n| `#import <Cocoa/Cocoa.h>`\
    \ | This line imports the Cocoa framework headers. The default template adds this\
    \ line—and the others—for “free.” When you reference a framework in a class, you\
    \ must add a corresponding line here by hand to import its headers. |\n| `@interface\
    \ FirstAppDelegate` | The code that follows is the interface for the `FirstAppDelegate`\
    \ class. |\n| `:NSObject` | This class is a subclass of `NSObject` and inherits\
    \ its methods and properties. |\n| `<NSApplicationDelegate>` | The class imports\
    \ and uses a bundle of predefined optional methods called the `NSApplicationDelegate`\
    \ protocol. This particular protocol is part of Cocoa. It defines a set of optional\
    \ application management methods that may be implemented in the delegate. |\n\
    | `NSWindow *window;` | The class includes an instance of Cocoa’s `NSWindow` class,\
    \ accessed via a pointer named window. |\n| `@property` | window can be a public\
    \ property. |\n| `(assign)` | window uses an assign operation for memory management.\
    \ (Memory management is introduced in Chapter 12.) |\n| `IBOutlet` | window is\
    \ a pointer to an object defined in an associated nib file. window isn’t allocated\
    \ in code; it’s loaded automatically from the nib file when the application loads.\
    \ The nib loading process also initializes its pointer. |\n\n`FirstAppDelegate.m`\
    \ is shown next. Table 6.3 breaks down its features.\n\n```\n```objc\n#import\
    \ \"FirstAppDelegate.h\"\n@implementation FirstAppDelegate\n@synthesize window;\n\
    ```\n```"
