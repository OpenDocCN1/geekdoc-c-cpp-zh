  md: "# ## Using NSSet and NSMutableSet\n\nUse NSSet to create an unordered collection\
    \ of objects — specifically when ordering and indexing aren't important, but your\
    \ application needs to check whether an object is included in a set or in some\
    \ combination of two sets. Table 12.2 lists the most useful methods.\n\n**Table\
    \ 12.2 Useful NSSet and NSMutableSet Methods**\n\n| Method | Description |\n|---|---|\n\
    | **NSSet methods** | |\n| intersectsSet: | Returns TRUE if two sets share at\
    \ least one common object. |\n| isEqualToSet: | Returns TRUE if two sets are identical.\
    \ |\n| isSubsetOfSet: | Returns TRUE if every object in the original set is also\
    \ in another set. |\n| **NSMutableSet methods** | |\n| unionSet: | Merges two\
    \ sets. |\n| setSet: | Replaces one set with another. |\n| minusSet: | Removes\
    \ items from the source set if they also appear in the target set. |\n| intersectSet:\
    \ | Removes items from the source set if they don't also appear in the target\
    \ set. |\n\nNSSet also implements the enumeration, count, and search methods implemented\
    \ by other collection objects. You can convert an array into a set with the `setWithArray:`\
    \ initializer. However, you can't easily convert a set back into an array. Potentially,\
    \ you can enumerate each item in a set and add it to an array, but, naturally,\
    \ the ordering will be undefined.\n\n# ## Enumerating Items\n\nThere are three\
    \ ways to enumerate the items in a data collection.\n\n# ### Using NSEnumerator\n\
    \nYou can ask the class to create an `NSEnumerator` object using one of the available\
    \ class methods, and then use the `nextObject` method to step through each item\
    \ in turn. For example, you would enumerate an array as follows:\n\n```\n~~~\n\
    NSEnumerator *enumerator = [anArray objectEnumerator];\nid object;\nwhile (object\
    \ = [enumerator nextObject]) {\n    // do something with the object\n}\n~~~\n\
    ```\n\nEach class can return different enumerators. Table 12.3 lists the most\
    \ useful options. Only `NSArray` implies a defined order. For other classes, the\
    \ order generated by `objectEnumerator` isn't explicitly defined."
