- pgno: 315
  md: "The basic query method is `objectAtIndex:`\n\n```\n```objc\n(id) theObject\
    \ = [anArray objectAtIndex: anInteger];\n```\n```\n\nThis returns the object at\
    \ the integer index. The object can be of any type. Your code must support `id`\
    \ for the object, implement type checking, or enforce typing in some other way.\n\
    \nYou can also search the array for a specific object, returning an index if it\
    \ exists.\n\n```\n```objc\ntheIndex = [anArray indexOfObject: aSearchObject];\n\
    ```\n```\n\nThis method returns the first match, ignoring other matches. If no\
    \ match is found, theIndex is set to the constant `NSNotFound`, which is defined\
    \ as a very large number.\n\nOptionally, you can limit the search to a range of\
    \ indexes with an extra `inRange:` parameter that takes an instance of `NSRange`.\n\
    \nFrom OS X 10.6 onward, `NSArray` supports searches with arbitrary inline search\
    \ code. This feature uses the new block technology described in Chapter 11. The\
    \ inline code is completely customizable. You can implement any search condition\
    \ or test. `NSArray` enumerates its contents, applies the test code, and returns\
    \ an index if there’s a match; for example:\n\n```\n```objc\ntheIndex = [anArray\
    \ indexOfObjectPassingTest:\n(BOOL (^)(id obj, NSUInteger idx, BOOL *stop)){\n\
    \    if ([obj isEqual: searchObject]) {\n        *stop = YES;\n        return\
    \ idx;\n    }\n}];\n```\n```\n\nThe conditional defines the test. Here the test\
    \ is a simple comparison, but the test can be arbitrarily complex, optionally\
    \ referencing some of the internal properties of each entry in the array. The\
    \ stop Boolean terminates the search.\n\n# Sorting NSArray and NSMutableArray\n\
    \nThere is no way to sort an `NSArray` in place, and you can only sort an `NSMutableArray`\
    \ in-place with custom code.\n\nHowever, you can use the `sortedWith...` methods\
    \ to create another array with the same contents sorted using any arbitrary function,\
    \ selector, or sort descriptor.\n\nSorting is implicitly type-dependent, and it’s\
    \ impossible to define a general sorting solution for an array of arbitrary objects.\n\
    \nTypically you assume the array contains data of a single type, and then create\
    \ a sort algorithm accordingly. For example a sorting function takes two items\
    \ of a given type and returns three `NSInteger` comparison constants — `NSOrderedAscending`,\
    \ `NSOrderedDescending`, and `NSOrderedSame`."
  merge: -1
  img_proc: true
- pgno: 316
  md: "```\n```objective-c\nNSInteger aSort (id thingOne, id thingTwo, void *aContext)\
    \ {\n    v1 = [thingOne <type>Value];\n    v2 = [thingTwo <type>Value];\n    if\
    \ (v1 < v2) return NSOrderedAscending;\n    if (v1 == v2) return NSOrderedSame;\n\
    \    if (v1 > v2) return NSOrderedDescending;\n}\n```\n```\n\nThis assumes that\
    \ values are available and direct comparisons are possible. Complex objects require\
    \ a more complex solution.\n\nYou can then use the sorting function to create\
    \ a sorted array.\n\n```\n```objective-c\nNSArray *sortedArray =\n    [sourceArray\
    \ sortedArrayUsingFunction: aSort context: NULL];\n```\n```\n\nSorting with a\
    \ selector is similar, with the difference that the selector runs on each object\
    \ in the array, passing another object as a parameter. The return codes are the\
    \ same.\n\n# ## Arrays without using NSArray\n\nIf you don't need the features\
    \ of NSArray, you can create a C array of object pointers with\n\n```\n```objective-c\n\
    ClassName *arrayName[numberOfEntriesConstant];\n```\n```\n\nEach entry is a pointer\
    \ to an instance of ClassName. This is equivalent to creating a list of related\
    \ pointers, but it also supports indexed access.\n\n```\n```objective-c\nClassName\
    \ *arrayName1;\nClassName *arrayName2;\netc...\n```\n```\n\nYou can set items\
    \ individually:\n\n```\n```objective-c\nNSString *someStrings [3];\nsomeStrings[0]\
    \ = @\"aString\";\nsomeStrings[1] = anObject.name;\nsomeStrings[2] = someStrings[0];\n\
    ```\n```\n\nNote that someStrings is an array of pointer variables, not an array\
    \ of string objects.\n\n```\n```objective-c\nNSString *aString;\naString = @\"\
    One fish\";\nsomeStrings[0] = aString;\naString = @\"Two fish\";\n//someStrings\
    \ [0] is still @\"One fish\"\n```\n```\n\nBe careful when using manual memory\
    \ management. You can leak objects if you don't release them."
