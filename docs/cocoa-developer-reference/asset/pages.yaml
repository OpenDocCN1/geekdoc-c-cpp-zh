  md: "# Saving and loading rich text\n\nIf you save the text with this version of\
    \ the editor, you’ll see that the styling information disappears. When you reload\
    \ the text, the application applies the last selected styling to the entire file.\n\
    \nThe original Picopad save/open code writes standard unattributed strings. To\
    \ support attributes, save and load the file as rich text as shown below.\n\n\
    The open and save methods use the block structure introduced in Picopad, but the\
    \ `RTFFromRange:` method is used to generate an RTF stream in an NSData object,\
    \ which is saved to a file. The Open code is simpler. It uses the `readRTFFromFile:`\
    \ method to read the RTF data back into the text view.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_404_0.png)\n\
    \n> > **CAUTION**\n> >\n> > Note that both methods run on the text view, not on\
    \ a separate attributed string property of the text view. They’re the same as\
    \ methods used with `NSAttributedString`, but they’re part of the `NSText` class,\
    \ which is Cocoa’s default text container object. `NSTextView` is a subclass of\
    \ `NSText` and inherits its methods.\n\n```\n```objective-c\n@implementation TheWindow\n\
    @synthesize theTextView;\n- (void) awakeFromNib {\n    //Nothing happens here.\n\
    \    //You could add auto-load of the last saved file...\n}\n- (void) saveTheDocument:\
    \ (id) sender {\n    NSSavePanel *savePanel = [NSSavePanel savePanel];\n    savePanel.allowedFileTypes\
    \ = [NSArray arrayWithObject:@\"rtf\"];\n    [savePanel beginSheetModalForWindow:self\n\
    \                     completionHandler:^(NSInteger result) {\n        if (result\
    \ == NSFileHandlingPanelOKButton) {\n            NSData *theData = [theTextView\
    \ RTFFromRange:\n                NSMakeRange(0, [theTextView.string length])];\n\
    \            [theData writeToURL: savePanel.URL atomically: YES];\n        }\n\
    \    }];\n}\n- (void) openADocument: (id) sender {\n    NSOpenPanel *openPanel\
    \ = [NSOpenPanel openPanel];\n    openPanel.allowedFileTypes = [NSArray arrayWithObject:@\"\
    rtf\"];\n    [openPanel beginSheetModalForWindow:self\n                     completionHandler:^(NSInteger\
    \ result) {\n        if (result == NSFileHandlingPanelOKButton) {\n          \
    \  [theTextView readRTFFromFile: openPanel.URL.path];\n        }\n    }];\n}\n\
