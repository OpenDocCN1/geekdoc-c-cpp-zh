- pgno: 529
  md: "*continued*\n\nThe simplest way to manage view swaps is through a subclassed\
    \ instance of UIViewController. Instead of passing a UIView directly to the window,\
    \ pass it indirectly through the controller. Boilerplate code is included in the\
    \ Xcode templates:\n\n```\n    [window addSubview:\n        aViewController.view];\n\
    \    [window makeKeyAndVisible];\n```\n\nTo display a different view, update a\
    \ UIViewController.view with a pointer to a UIView.\n\nViews can be swapped semiautomatically.\
    \ Navigation controllers and tab bar controllers implement standardized navigation\
    \ solutions, swapping view controllers and their associated views as needed. Views\
    \ can also be swapped manually with custom code managed by a view controller.\
    \ Swaps can be triggered by almost any OS event. In many applications, views are\
    \ swapped after a button tap. More complex effects are possible; for example,\
    \ a location-aware app can display a new view when the user gets close to a geographical\
    \ location. Subviews in a view are stored in an NSArray. UIView includes methods\
    \ for inserting and removing views from the array and rearranging their order.\n\
    \nBecause view swapping and controller subclassing is a key iOS design pattern,\
    \ Xcode includes a convenient UIViewController subclass file template, with an\
    \ associated nib file. To create new views in your app, create as many different\
    \ subclasses of UIViewController as you need, and swap their views in as required.\
    \ You can populate the nib files with user options — buttons, labels, graphics\
    \ and contexts, text editable text fields, among others — and then add code to\
    \ the view controller subclass to manage each item, linking outlets and actions\
    \ as needed. For more on outlets, actions, and links, see Chapter 7.\n\nindex:0\
    \ of the UIView array is the root view. To implement a manual view swap, allocate\
    \ an instance of the incoming view controller and load its nib using the initWithNibName:\
    \ method. Alternatively, you can alloc and init instances of UIView dynamically\
    \ in your code, adding features and setting options as needed. You can then swap\
    \ in the new view by calling the insertSubview:atIndex:0 method on the currently\
    \ visible\n\nview. To remove and release a view, call the removeFromSuperview:\
    \ method on the visible view.\n\nOptionally, you can preload the new controller\
    \ with data or link it to a data source so that it automatically loads and displays\
    \ the data when it appears. Data is often processed for display in the viewDidLoad\
    \ method in the new controller, which is triggered as soon as the view loads.\
    \ You can also use the loadView method to populate the view dynamically from your\
    \ code, or by loading a nib at runtime.\n\nModal views pop up or slide in temporarily\
    \ — for example, to display app credits or contact information — and disappear\
    \ when dismissed, revealing the original view. You cannot use modal views for\
    \ navigation. To display a modal view, allocate an instance of the new view controller\
    \ and call presentModalViewController: in the main view, passing the new controller\
    \ as a parameter. To dismiss the modal view, call dismissModalViewController:\
    \ in the main view.\n\nAll view swaps can be animated. Modal view swaps offer\
    \ a small selection of preset animation, controlled by a constant loaded into\
    \ the modalTransitionStyle property of the main view controller. Non-modal view\
    \ swaps can be animated with a custom animation block that selects a preset animation\
    \ effect, such as a page curl or cross fade, and sets an animation duration.\n\
    \nBecause views can be swapped, they must be able to exchange messages and data\
    \ with each other. Your app can use the protocol/delegate design pattern to implement\
    \ message passing, or it can make direct connections between objects in the interface\
    \ and a root controller using the responder chain.\n\nThe view system can seem\
    \ complex, but it does not have to be difficult to work with. To avoid confusion,\
    \ remember that the instance of UIViewController included in the app delegate\
    \ sets which view is visible. Other instances of UIViewController can be loaded\
    \ and released from memory. They can handle events, but their views remain invisible\
    \ unless they are linked into the master controller's view property.\n\nApps typically\
    \ use boilerplate code to implement view swapping. An example of this appears\
    \ later in this chapter in the section on building a simple application."
  merge: -1
  img_proc: true
- pgno: 530
  md: "# Managing orientation\n\nAll mobile devices include orientation sensing. As\
    \ the user rotates a device, an app can rotate the view so that the content remains\
    \ vertical. Figure 19.10 shows how Safari autorotates its contents when the iPhone\
    \ is horizontal.\n\n# Figure 19.10\n\nAutorotation in Safari. Rotating the iPhone\
    \ automatically rotates the browser and its contents.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_530_0.png)\n\
    \nOn the iPhone and iPod touch, orientation support is optional. Apple suggests\
    \ that the portrait upside-down orientation is not supported because users may\
    \ find it confusing, particularly if the phone is upside down when a call arrives.\
    \ On the iPad, apps must support every orientation.\n\nOrientation support is\
    \ managed by each view controller. Simple apps can implement autorotation by including\
    \ the shouldAutorotateToInterfaceOrientation: method, returning YES for each supported\
    \ orientation. To allow rotation to every orientation, use:\n\n```\n```objective-c\n\
    - (BOOL) shouldAutorotateToInterfaceOrientation:\n    (UIInterfaceOrientation)\
    \ interfaceOrientation {\n    return YES;\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 531
  md: 'If you include this code in a view controller, iOS automatically rotates the
    view. Items in the view should have autoresizing disabled in Interface Builder,
    as shown in Figure 19.11, to keep them positioned and sized correctly in the view
    as it rotates.


    # Figure 19.11


    To disable autosizing, click the lines in the Autosizing box. All lines should
    be dashed, not solid. Use the rotation preview feature in IB to test the view
    before saving it.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_531_0.png)


    # TIP


    You can preview rotations in Interface Builder. To rotate a view, click the curved
    arrow icon at the top right of the View window. You can use this feature to check
    that subviews are anchored correctly.


    It is not always possible to create views that autorotate correctly; for example,
    items in busy views may overlap after rotation. To customize rotation effects,
    you can also create two or more views to support different orientations and swap
    them in as needed.'
  merge: -1
  img_proc: true
- pgno: 532
  md: 'A `willRotateToInterfaceOrientation:` message is sent to a view controller
    just before rotation. For more complex effects, the rotation process can be split
    into two stages. A `didAnimateFirstHalfOfRotationToInterfaceOrientation:` method
    is triggered just before the second stage. You can place window switching code,
    described later in this chapter, in either method to swap views to match the new
    orientation.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_532_0.png)


    # CAUTION


    > Orientation handling is not completely reliable. To work around this, you can
    add code to monitor the accelerometer independently, creating rotation events
    as needed. This is not a simple project, but it can be more reliable and smoother
    than the standard OS approach. You can also use it to bypass the default rotation
    animations and replace them with alternative more complex effects, such as cross
    fades or spin-out/spin-in movements.


    # Adding navigation and control features


    UIKit includes a selection of standard classes to manage in-app navigation. Apps
    typically include one or two of these classes. Navigation options should be clearly
    visible and kept as simple as possible.


    *Tab bars*, shown in Figure 19.12, implement modal view switching. When the user
    taps one of the items on the bar, it automatically selects a preassigned view
    controller, loads its view from a nib file, and displays it. Users can customize
    the tab bar, adding items from a preset list, reordering them, and removing them.


    You can use tab bars in a very simple way by adding a list of tab bar items to
    the tab bar in Interface Builder and presenting a view controller class within
    Interface Builder. Tapping a bar item selects and loads a view controller class,
    automatically loading and displaying its view from the associated nib. The view
    switching and class selection are built into the tab bar and do not need extra
    code.


    Tab bars can also create more complex effects, loading other classes such as *table
    views*, which display lists of selectable and editable items, or *image pickers*,
    which are prebuilt photo selection classes that access images in a device''s photo
    library. Optionally, tab bar items can be *badged* to display a number or very
    short string in a red oval to indicate items that need attention or to offer users
    extra information.


    *Toolbars*, illustrated in Figure 19.13, offer a selection of items that can be
    tapped to trigger application features, such as play/pause features in a media
    player or general done/cancel selections. Toolbar items are independent and do
    not interact. They highlight momentarily when tapped, and they use target/action
    selection to trigger selected methods in an app.'
  merge: -1
  img_proc: true
- pgno: 533
  md: '# Figure 19.12


    A tab bar template is included in Xcode and demonstrates how to swap between two
    views without extra code.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_533_0.png)


    # Figure 19.13


    Xcode does not include a toolbar template, but toolbars are used for navigation
    in many of the iPhone’s built-in apps, such as the iPod app shown here.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_533_1.png)


    Although toolbars can implement view switching and navigation, they are more usually
    used for features that create a visible response within a view without swapping
    it. The list of compatible bar button items includes fixed and flexible spacers
    that control the horizontal layout of buttons on the bar. Adding spacers automatically
    positions buttons on the bar so they fill the space in the most elegant way.


    Both toolbars and tab bars include a small list of graphic identifiers — preset
    text and icons included to support common app features. For example, selecting
    the Favorites identifier adds a “Favorites” label to a tab bar item and displays
    a star icon.'
  merge: -1
  img_proc: true
- pgno: 534
  md: 'The navigation controller class implements hierarchical view switching and
    is often used to simulate drop-down list navigation. The controller implements
    a navigation stack — a linked list of view controllers. As users drill down into
    the hierarchy, controllers are pushed onto the stack and a back button automatically
    appears on the controller bar. As users move back up through the hierarchy, controllers
    are popped and released. The back button is created and named automatically. It
    pops the previous controller from the stack and triggers an associated view switch
    when tapped. The iPad example shown in Figure 19.14 illustrates a split view with
    two navigation controllers: Settings and Keyboard. The Settings bar is decorative
    and is used as a large title bar for the combined view. The iPhone equivalent,
    illustrated later in Figure 19.16, displays a single controller at the top of
    the view.


    > **NOTE**

    > You must add a navigation bar to a view to implement navigation and add a Navigation
    Item subview to display a title on the bar. The Navigation Item contains four
    empty placeholders: the title, view, and separate back, left, and right buttons.
    The back button is allocated and released automatically. You can allocate and
    link a right button to add extra features. The title view is a generic view and
    by default displays a label. You can set the label text from within your code
    using its title property, or give it a fixed title within Interface Builder.


    **Figure 19.14**

    The iPad''s split view feature works well with two navigation bars and a table
    view, illustrating how navigation flows naturally from left to right and how table
    view cells can be customized with images, active subviews, and display groups.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_534_0.png)'
  merge: -1
  img_proc: true
- pgno: 535
  md: 'To simulate a drop-down list, navigation controllers are often used with table
    views, which display a scrollable vertical list of options. Table views are sophisticated
    and have many features. When used for navigation, they are typically shown with
    extra chevron views to indicate that tapping on a table cell will view switches
    and take a user to the next level in the hierarchy. They also have other applications;
    cells can be displayed with thumbnail photos or icons, switches, sliders, labels,
    and other standard features. They can also be completely customized and loaded
    from a nib file. Navigation, control, and display features can be mixed in a single
    table.


    > > **CAUTION**

    > >

    > > The navigation controller stack manages a list of view controllers. Do not
    confuse it with the view array. The view array is part of the nib system and is
    included in every app. The navigation stack is a separate list of controllers,
    used to implement forward/back navigation. It is only implemented when the app
    includes a navigation controller.


    *Custom switching options include view switching through rotation events, tilt
    and shake events, touch events, or even sound, speech, or music recognition. In
    iOS, view switching features are not tied to specific classes or selection events;
    they can be triggered by any of the features in Cocoa Touch. In theory, such flexibility
    is possible in Cocoa, but the touch screen and other hardware features built into
    mobile devices encourage experimentation and can create experiences that would
    be difficult or impossible to include in a Cocoa application.*


    A key feature of app design is that views and their controller classes are very
    closely linked and are often designed anew for each application. Each view implements
    a small number of clearly defined features. The associated code in the controller
    class preloads a view with content from the application''s model and data source
    and manages the user interactions that trigger each feature.


    This makes it possible to develop complex applications with a small number of
    controller classes; for example, a mini-encyclopedia might use only two or three
    different view controller classes to display and navigate through hundreds of
    pages of content.


    > > **TIP**

    > >

    > > Custom view controller classes can proliferate uncontrollably in iPhone apps.
    Do not reinvent the wheel by creating a new class for every view.


    # ## Handling touch events


    Instead of a mouse, iOS apps generate touch events, which are processed by an
    application''s responder chain. From OS 3.2 onward, you can use the `UIGestureRecognizer`
    class to trigger actions automatically whenever the OS recognizes one of the standard
    gestures. This dramatically simplifies touch processing and makes it easier to
    include a range of touch features.


    Some apps still require custom touch handling. Manual touch processing is moderately
    complex. Touch events trigger four methods: `touchesBegan:` when a new touch is
    registered; `touchesMoved:` when movement is registered; `touchesEnded:` when
    a touch ends; and `touchesCancelled:` when the OS deletes existing touches so
    that it can respond to an external event, such as an incoming phone call.'
  merge: -1
  img_proc: true
