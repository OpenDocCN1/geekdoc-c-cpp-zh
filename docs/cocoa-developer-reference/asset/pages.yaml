- pgno: 431
  md: '# Figure 16.6


    Exploring the tree structure of a view hierarchy. You can create a structure like
    this in IB and save it in a nib, or you can generate it dynamically to populate
    an empty view. Any item can be subclassed as needed. An item above another on
    a given branch is called a superview. An item below another on a branch is called
    a subview.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_431_0.png)


    Most applications take the first approach, and the UI is loaded as from a nib.
    The second approach is more powerful and can create some unique effects, such
    as dynamic, floating, animated menu items, reconfigurable button panels, and grids
    with a variable cell count.


    Manipulating the hierarchy is simple. To create a new subview, use `alloc/init`
    to create a new view object. Add code to set a selection of default properties.


    Alternatively, you can create a separate nib file for each object, saving it with
    default settings. Using a nib makes it possible to load an existing hierarchy
    as a composite object and insert it into the root view in a single operation.'
