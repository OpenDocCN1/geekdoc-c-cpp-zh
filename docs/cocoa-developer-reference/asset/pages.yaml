  md: '**Figure 10.16**

    The WebView running in its window. You can click active links to navigate.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_285_0.png)


    The code is slightly less straightforward than it looks. The key feature is that
    the `mainFrame` property is the active browser window; a `WebView` is a wrapper
    for one or more web frames. `mainFrame` is the most important active frame. In
    most applications you can ignore the others.


    `WebView` is a very sophisticated class. You can add browser essentials such as
    forward, back, and refresh buttons, but you can also implement controlled downloading
    with various delegate methods. There’s even an `estimatedProgress` method that
    can drive a progress bar.


    As a trivial exercise, you may want to try adding a URL bar and downloading a
    new page when the user enters a new URL. More sophisticated applications are also
    possible.


    > > **TIP**

    > > Most applications use `WebView` to access Web pages. Because URLs can be local,
    you can use `WebView` to access local HTML, CSS, or image content.


    # Summary


    In this chapter, you learned about file paths, URLs, and their similarities and
    differences. You explored Cocoa’s File Manager class, and you discovered how to
    compare files and build working open/save panes into your application. You also
    learned how to load and save data from the local file system, how to create and
    find valid paths, and how to get started with the file features of Cocoa’s data
    objects.'
