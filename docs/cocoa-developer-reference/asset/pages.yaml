- pgno: 457
  md: "# ## Applying filters to an image\n\nThe drawRect: method in the Twirl Filter\
    \ example demonstrates how to set the filter’s input and output values and how\
    \ to apply the filter. The input image is set with the inputImage key.\n\nThe\
    \ image object must be a CIImage — a special image type unique to CoreImage. In\
    \ this example, the image data is loaded from a file via a URL path.\n\nFor a\
    \ more general solution, convert the source image into a bitmap or NSData object\
    \ and load the CIImage object with the imageWithBitmap: or imageWithData: method.\n\
    \nThe simplest way to process data from a view — without adding the filter to\
    \ the view in IB — is to read it from a CGLayer object.\n\nThese conversion options\
    \ can be messy in practice. In some applications, you will need to convert images\
    \ through various intermediate data types. But they make it possible to filter\
    \ images generated by the other graphics frameworks.\n\nThe drawRect: method that\
    \ runs the filter follows:\n\n```\n```objc\n- (void)drawRect:(NSRect)viewRect\
    \ {\n    thisContext = [[NSGraphicsContext currentContext] CIContext];\n    preFilterImage\
    \ =\n        [CIImage imageWithContentsOfURL:sourceImageURL];\n    [thisFilter\
    \ setValue: preFilterImage forKey: @\"inputImage\"];\n    thisCenter =\n     \
    \   [CIVector vectorWithX: filterCenter.x Y: filterCenter.y];\n    [thisFilter\
    \ setValue:thisCenter forKey:@\"inputCenter\"];\n    [thisFilter setValue:\n \
    \       [NSNumber numberWithFloat: filterSize]\n    forKey:@\"inputRadius\"];\n\
    \    [thisFilter setValue:\n        [NSNumber numberWithFloat: filterAngle]\n\
    \    forKey:@\"inputAngle\"];\n    postFilterImage = [thisFilter valueForKey:@\"\
    outputImage\"];\n    CGRect preRect = [preFilterImage extent];\n    CGPoint anImageOrigin\
    \ =\n        CGPointMake(viewRect.size.width*.5 - preRect.size.width*.5,\n   \
    \                 viewRect.size.height*.5 - preRect.size.height*.5);\n    [thisContext\
    \ drawImage: postFilterImage\n                   atPoint:anImageOrigin\n     \
    \              fromRect:preRect];\n}\n```\n```"
  merge: -1
  img_proc: true
- pgno: 458
  md: "Key points of the code include:\n\n+   - The `filterAngle`, `filterCenter`,\
    \ and `filterSize` values are supplied from the controller view.\n+   - Filter\
    \ output is managed by a special `CIContext` object. This works like `CGContext`\
    \ or `NSContext`, but includes a special `drawImage:` method that draws the output\
    \ into the context and, from there, into the surrounding view.\n+   - A `CIVector`\
    \ data type is used to define a point. Filters cannot use `NSPoint` or `CGPoint`.\n\
    +   - The input and output image data is stored in two `CIImage` objects, called\
    \ `preFilterImage` and `postFilterImage`.\n+   - The filter is run by triggering\
    \ the `drawImage:` method in the last line. No filtering is done until this method\
    \ is called. This method runs the filter and then writes the data into the context\
    \ at the specified point, which, with almost complete inconsistency, is specified\
    \ as a `CGPoint` and not as a `CIVector`.\n\nThe application is shown in Figure\
    \ 16.21. Clicking in the filter view sets the filter center, and the sliders control\
    \ the filter parameters. You can use similar code to implement any other CoreImage\
    \ filter, setting different keys and values and adding or removing parameter sliders\
    \ from the controller as needed.\n\n**Figure 16.21**\n\nThe finished Twirl Filter.\
    \ Creating this simple filter effect isn’t an entirely trivial challenge.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_458_0.png)\n\n> **CAUTION**\n> \n> CoreImage\
    \ isn’t robust. If a filter crashes because you supply it with invalid values\
    \ or keys, the entire framework stops working and all filter effects stop with\
    \ it. The only way to restart it is to reboot your application. You must debug\
    \ code carefully to avoid crashing CoreImage."
