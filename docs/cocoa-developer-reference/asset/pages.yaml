- pgno: 581
  md: 'You can then access the front object’s properties using standard dot syntax.
    To set a custom ID for a part, type the ID name into the ID field in the Attributes
    pane in the Inspector. Each part includes a fixed list of accessible properties
    via DOM. Some, but unfortunately not quite all, properties are listed and described
    in the Dashcode User Guide. To view the User Guide, choose Help ➜ Dashcode User
    Guide.


    DOM is an essential part of widget management. Use it to change basic properties,
    such as text strings, or to swap objects in and out of visibility. Some parts,
    such as the Canvas, have more sophisticated interfaces; for example, you can draw
    into a Canvas using JavaScript versions of standard canvas functions.


    # Working with Events and Handlers


    As in an Objective-C application, visible parts in a widget can be connected to
    handler functions that are triggered when the user clicks with a mouse, drags
    an object, and so on. For example, a part’s onclick event is triggered when the
    user clicks the object. The list of events for each object or part is visible
    in the Behaviors pane in the Inspector.


    To assign a Handler, select an event and double-click in the area under the Handler
    header to its right. An empty box appears. To finish the assignment, type the
    name of the handler routine into the box, as shown in Figure A.11. There is no
    hinting, and no menu or list of possible handlers — you must type the name in
    manually. You can check that your assignment is correct by clicking the arrow
    to the right of the handler name; the corresponding code routine is highlighted
    in light blue.


    Figure A.11


    Because the Handler field is dumb, you must type in the function name manually.
    If you get it wrong, the Event won’t trigger correctly.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_581_0.png)'
  merge: -1
  img_proc: true
- pgno: 582
  md: "# ### Working with widget events\n\nWidget templates typically include code\
    \ to create a spin effect triggered by clicking the Info part, typically in the\
    \ showFront(event) and showRear(event) routines. You won't usually need to change\
    \ this code, but you can add parts to the reverse of the widget with custom handlers\
    \ of your own design — for example, to ask for a donation with a link to your\
    \ Web site.\n\nAt the bottom of every template is a boilerplate conditional:\n\
    \n```\n```javascript\nif (window.widget) {\n    widget.onremove = remove;\n  \
    \  widget.onhide = hide;\n    widget.onshow = show;\n    widget.onsync = sync;\n\
    }\n```\n```\n\nThis assigns custom handler functions — hide, remove, show, sync\
    \ — to standard widget events that are triggered when Dashcode changes state.\
    \ Stubs for each custom handler are included at the top of the template scripts.\
    \ You can add extra code to these stubs to enable or disable widget features as\
    \ needed for each state.\n\n# ### Working with time\n\nMany widgets use timers,\
    \ but JavaScript lacks a simple drop-in equivalent for NSTimer. To create a timer,\
    \ use:\n\n```\n```javascript\naTimer = setInterval(aFunctionCalledWhenTheTimerExpires,\n\
    \                     aTimeInMilliseconds);\n```\n```\n\nThis calls aFunctionCalledWhenTheTimerExpires\
    \ after aTimeInMilliseconds. Timer functions can call themselves for repeated\
    \ timing events. To stop a timer and delete it, use\n\n```\n```javascript\nclearInterval(aTimer);\n\
    aTimer = null;\n```\n```\n\nTo get the current time, use the Date() function:\n\
    \n```\n```javascript\nvar currentTime = new Date();\nvar currentHours = currentTime.getMinutes();\n\
    var currentSeconds = currentTime.getSeconds();\n```\n```\n\n# ### Loading images\n\
    \nImages can be preloaded for speed with\n\n```\n```javascript\n(new Image()).src\
    \ = \"/Images/anImage.png\";\nvar anImage = new Image(width, height);\nanImage.src\
    \ = \"/Images/anImage.png\";\n```\n```\n\nYou can then write or link an image\
    \ into any part in the widget or draw it to a canvas."
  merge: -1
  img_proc: true
