- pgno: 391
  md: 'Key features of the code include:


    +   - A fetch request returns the full list of albums.

    +   - The `enumerateObjectsUsingBlock:` method processes each object in turn.

    +   - The processing block extracts an album name and an artist name for each
    album.

    +   - The artist name is retrieved with `valueForKey:` to return a reference to
    an artist object, and then extracts the name from the object with the `Name` key
    using nested code.

    +   - The name is compared with a string read from a text field in the UI. (Assume
    an outlet and link to the UI have been created.)

    +   - Matching results are packed into an array of dictionary objects, each containing
    a name linked to a key — `FilterName`. This makes it possible for an array controller
    to create a list of items with that key and bind it to a column in a table view.

    +   - The search array is assigned with `self` to make it visible to a binding.


    # ## Displaying search results


    There are various ways to display the results of the search. Figure 14.16 shows
    one solution. The default UI has been rearranged, and an extra table view and
    associated array controller have been added. The controller is bound to the `searchReturnArray`
    as its data source, which has been added to the App Delegate header.


    The single column in the new table view is bound to the `FilterName` key in the
    Array Controller, via `arrangedObjects`, as shown in Figure 14.17.


    A few extra niceties are needed to finish the code. It would be possible to add
    a separate search button to create a filtered search, but it''s more intuitive
    for the user to see an updated list whenever he or she selects a new artist. Key-Value
    Observing (KVO) could be used for this, but the table view''s selector has been
    linked to the `refreshLink:` method, as shown in the list of links to the App
    Delegate in Figure 14.18. An outlet to the text field that displays the artist
    name has also been created.


    When the user selects a new artist name in the list in the Artist panel, the following
    happens:


    +   1. The table view updates the name box under the list, via a binding that
    was built into the original UI.

    +   2. The table view''s selector action triggers the `refreshList:` method.

    +   3. The method reads a list of all albums from the Core Data store and copies
    them to a temporary array.'
