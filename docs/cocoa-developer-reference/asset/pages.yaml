- pgno: 436
  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_436_0.png)\n\n# CAUTION\n\n**mouseDragged:**\
    \ events continue to arrive even if the mouse is dragged out of the window frame.\
    \ Hit testing becomes more critical for drag events; otherwise, you can drag values\
    \ and objects all over the screen, even when you don't want to.\n\nUse **mouseMoved:**\
    \ events to capture the mouse cursor position when the left button isn’t pressed.\
    \ **mouseMoved:** tracking is not enabled by default. To enable it, add the following\
    \ code to the view’s `awakeFromNib:` method:\n\n```\n```objc\n- (void) awakeFromNib\
    \ {\n    [[self window] setInitialFirstResponder: self];\n    [[self window] makeFirstResponder:\
    \ self];\n    [[self window] setAcceptsMouseEvents: YES];\n}\n```\n```\n\nThis\
    \ tells the root window object to pass mouse moved messages to the view for processing.\
    \ **mouseMoved:** tracking is active across the entire screen, and you should\
    \ hit test the window bounds to limit the mouse action.\n\nThis is a small selection\
    \ of the available mouse methods. The full list is defined in the NSResponder\
    \ and NSView Class References. Other useful methods include:\n\n+   - `mouseUp:`\
    \ Sent when the left button is released.\n+   - `mouseEntered:` Sent when the\
    \ cursor enters a tracking area.\n+   - `mouseExited:` Sent when the cursor exits\
    \ a tracking area.\n\nUse the `NSTrackingArea` class to define tracking area objects.\n\
    \n# Understanding the Cocoa Graphics System\n\nTo create Cocoa graphics, you must\
    \ understand:\n\n+   - How points, rectangles, and other basic data are packed\
    \ into data structures, and how to set and read data from them\n+   - How points\
    \ and other elements are combined to create shape objects\n+   - How shape objects\
    \ are drawn into a view\n+   - How colors and gradients are created and managed\n\
    +   - How images are loaded and drawn into a view\n\nThe rest of this section\
    \ introduces these basic techniques and concepts."
