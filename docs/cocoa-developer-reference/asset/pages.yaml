  md: "# # Working with Files, URLs,\nand Web Data\n\nCocoa’s file handling is unusual.\
    \ In most operating systems, files are managed by calling a file manager object.\
    \ In Cocoa, data objects can read and write data directly. A separate file manager\
    \ is only required when you need to delete, copy, rename, or move files under\
    \ program control.\n\n> **NOTE**\n> \n> Cocoa’s NSFileManager class can be used\
    \ to access `stdio` — the default system I/O channel. It also supports nonlinear\
    \ file reads, making it possible to extract bytes from a file without loading\
    \ it into memory.\n\nFor example, `NSString` has methods for reading and writing\
    \ string data to files; `NSDictionary` can read and write dictionaries; and so\
    \ on. Typically an `initWithContentsOfFile:` method initializes a data object\
    \ with the contents of a file specified by a path string that points to a unique\
    \ location in the file system. A corresponding `writeToFile:` method writes data.\n\
    \nFor completely general file access, the `NSCoder` class described in the Chapter\
    \ 12 read and write complex arbitrary data collections. You can use `NSCoder`\
    \ to create application-specific files that mirror your application’s internal\
    \ object or document structure, combining large numbers of multiple objects of\
    \ different classes.\n\n> **CROSS-REF**\n> \n> For more information about Cocoa’s\
    \ data objects, see Chapter 12.\n\nPerhaps the most unique feature of Cocoa file\
    \ handling is the close relationship between local and remote data. In most operating\
    \ systems, local and remote data is handled by different classes.\n\nIn Cocoa,\
    \ URL objects and local file paths are almost synonymous. All data objects have\
    \ an `initWithContentsOfURL:` method that loads data from a specified URL. The\
    \ URL can represent a local file path or an online data source. The same class\
    \ handles both, and it doesn’t distinguish between them.\n\nIn fact, string file\
    \ paths are becoming a legacy feature of both OS X and iPhone OS. Strings are\
    \ not yet deprecated, but there is a trend toward using URL objects as the default\
    \ path specifier for all file operations.\n\n+   ### 10 In This Chapter\n+   \n\
    +   - Creating and using file paths\n+   - Creating and using URLs\n+   - Using\
    \ Web APIs\n+   - Using WebView"
  merge: -1
