- pgno: 437
  md: "# Understanding and defining basic geometry\n\nIn Cocoa, geometric data is\
    \ formal and structured. There’s no equivalent of `plot (x,y)`, `line (x1, y1,\
    \ x2, y2)` or other simple graphics primitives found in simpler languages. Point\
    \ and rectangle — `rect` — values are wrapped in data structures, and the structures\
    \ are used in methods and functions. All components are floats. Cocoa coordinates\
    \ use a bottom-left origin. Table 16.2 introduces Cocoa’s key graphics data structures.\
    \ Note that these are not classes or objects — they are standard C structs or\
    \ object properties.\n\n| Data structure | Description |\n|---|---|\n| `NSPoint`\
    \ | Any x,y coordinate pair. Use `point.x` and `point.y` to access the individual\
    \ coordinates. |\n| `NSSize` | Defines a rectangle’s size. Use `size.width` and\
    \ `size.height` to access the components. |\n| `NSRect` | A rectangle with an\
    \ `NSPoint` origin and an `NSSize`. Use `rect.origin.x/y` to access the origin,\
    \ and use `rect.size.width/height` to access the size components. |\n| `Frame`\
    \ | An `NSRect` with the origin defined with respect to the object’s superview.\
    \ Changing `origin` moves the object’s bottom-left anchor in the superview. |\n\
    | `Bounds` | An `NSRect` with the origin set to 0,0. Use `bounds` to access a\
    \ subview’s internal coordinates. `frame` and `bounds` usually have the same size.\
    \ Changing the frame stretches the content. |\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_437_0.png)\n\
    \n> **NOTE**\n> \n> There is no `NSLine` structure, because there is no direct\
    \ way to draw lines in Cocoa. Lines are defined using the more complex `NSBezierPath`\
    \ object, which can build arbitrary shapes from line segments, arcs, and complex\
    \ curves.\n\n# Using geometric data structures\n\nA standard problem is getting\
    \ the `NSRect` of a view. To return the size, use\n\n```\nNSRect boundsRect =\
    \ view.bounds;\n```\n\nYou can then access the components of `boundsRect` to find\
    \ the width and height.\n\nYou can also access components directly.\n\n```\nfloat\
    \ thisWidth = view.bounds.size.width;\n```\n\nTo return the position in the superview\
    \ with respect to a rect’s lower-left point, use\n\n```\nNSPoint thisOrigin =\
    \ view.frame.origin;\n```"
  merge: -1
  img_proc: true
- pgno: 438
  md: 'Note that because NSPoint, NSSize, and NSRect are data structures and not objects,
    no pointer star is required.


    # Using Foundation Constants


    A number of constants are predefined:


    +   - NSZeroPoint Equal to 0,0

    +   - NSZeroSize Width and height are both zero

    +   - NSZeroRect A rect of zero size at 0, 0


    You can use these wherever you need the equivalent NSPoint, NSSize, or NSRect.


    # Using Foundation Functions


    A collection of helper functions is included in Cocoa’s Foundation Functions.
    For a complete list, see the Foundation Functions Reference. You must review this
    reference before you start working with Cocoa graphics. These functions are essential
    timesavers. It can be helpful to print them out and pin them somewhere close and
    visible.


    Table 16.3 lists a selection of the more commonly used functions. Equivalent functions
    for NSSize are listed in the Foundation Functions Reference.


    **Table 16.3 Selected Foundation Functions**


    | Function | Description |

    |---|---|

    | NSMakePoint | Pads two floats into an NSPoint |

    | NSMakeRect | Pads four floats into an NSRect |

    | NSEqualPoints | Returns YES if two points are identical |

    | NSEqualRect | Returns YES if two rects are identical |

    | NSIntersectionRect | Returns the rect where two input rects overlap |

    | NSUnionRect | Returns the smallest rect that encloses two input rects |

    | NSMidX and NSMidY | Returns the X or Y center of a rect |

    | NSPointInRect | Returns YES if a point is inside a rect |


    ![](img/2b293e29fc15b0797f113b85dd429b6e_438_0.png)


    # CAUTION


    Because the basic data element is a float, be careful when comparing points, rects,
    and sizes. Rounding errors may mean that similar values aren’t identical, and
    comparisons may fail because of a difference in the nth decimal place. This can
    become a problem when you multiply points and rects to scale them. You can use
    NSIntegralRect to round float values up to integers in a rect.'
  merge: -1
