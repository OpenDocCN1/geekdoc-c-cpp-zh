  md: '# Figure 14.6


    Your model is starting to take shape, with two entities.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_378_0.png)


    A relationship from one object to multiple objects is called a *to-many relationship*
    — one entity is connected to many others. Unlike a full relational database, Core
    Data’s support for to-many relationships is limited.


    To illustrate this, you''ll create the Album ⇔ Artist relationship as a to-one,
    and the Artist ⇔ Album relationship as a to-many.


    Select the Album entity, and click the + icon at the bottom left of the Property
    pane. Select Add Relationship from the pop-up menu, as shown in Figure 14.7. Name
    the relationship **Artist**. Deselect Optional. In the Destination pop-up, select
    Artist. The editor automatically adds an arrow linking the two entities.'
