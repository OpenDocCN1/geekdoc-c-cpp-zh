  md: '# Packaging an app for the App Store


    Although Xcode includes a Release build target, this simply removes debugging
    information from the build. It is not suitable for App Store submissions. Packaging
    an app for distribution requires an extra step that installs a Distribution Certificate,
    as shown in Figure 19.35. If you do not have a Distribution Certificate, follow
    the steps in the previous section to create one before you start.


    +   1. **In Xcode, right-click the project and choose Get Info from the pop-up
    list.** Click the Configurations tab. Click the Release configuration and then
    click Duplicate. When the copy appears, give it a new name, such as **Distribution**.

    +   2. **Click the Build tab to reveal the build settings.** Find the Code Signing
    Identity section. Click the Code Signing Identity triangle, right-click iPhone
    Developer, and choose iPhone Distribution from the pop-up list. Close the window.


    **Figure 19.35**


    Selecting the Distribution Certificate before building for distribution. The Automatic
    Profile Selector feature makes a best guess about the most appropriate certificate
    — and usually gets it right.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_562_0.png)'
  merge: -1
  img_proc: true
- pgno: 563
  md: "+   3. **Right-click the build target under the Targets header.** Choose Get\
    \ Info from the pop-up list. Click the Properties tab and replace the generic\
    \ identifier with a unique app name. Fill in the app’s icon file and version number.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_563_0.png)\n\nThe icon file is a 57\
    \ × 57 pixel PNG and identifies the app in Springboard. Springboard automatically\
    \ adds glassy highlights; do not try to add your own.\n\n+   4. **Select the new\
    \ Distribution configuration and choose Build ▸ Build to build it.**\n+   \n+\
    \   5. **Click the build product in the Products folder.** Choose Reveal in Finder\
    \ from the drop-down tools list. In Finder, right-click the `.app` file and choose\
    \ Compress <file name> from the pop-up list. This creates the distribution file,\
    \ ready for upload.\n\n# Uploading an app to the App Store\n\nApp uploads, financials,\
    \ sales reports, and tax and banking information are managed using iTunes Connect,\
    \ accessible from a link at the top right of the iPhone Developer Program page.\
    \ Before you upload an app, choose Contracts, Tax and Banking to enter your bank\
    \ details and accept the standard iTunes Connect contract. You must also define\
    \ your tax status for the territories in which your app will be sold.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_563_1.png)\n\
    \n# CAUTION\n\nInternational taxation details are complex and outside the scope\
    \ of this book. iTunes Connect includes digital paperwork to minimize international\
    \ tax issues, but you may still need to supply proof of status and correspond\
    \ with national taxation agencies; otherwise a proportion of your income may be\
    \ withheld in certain territories. For information and advice, consult a professional\
    \ accountant.\n\nBefore uploading an app, collect the following:\n\n+   - The\
    \ compressed distribution build file.\n+   - At least one but no more than five\
    \ PNG screenshots to illustrate your app in the App Store.\n+   - A 512 × 512\
    \ PNG version of the app’s icon file\n+   - A SKU number (an arbitrary product\
    \ ID code of your choice). The code must be different for every app.\n+   - A\
    \ sales description. The maximum is 4,000 characters.\n+   - A list of keywords.\
    \ The maximum is 100 characters."
