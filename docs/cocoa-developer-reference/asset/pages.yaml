- pgno: 245
  md: "# Using nil\n\nBecause NSNumber is an object type, it’s possible for its value\
    \ to be nil. If there’s a danger that your code may access a value that hasn’t\
    \ been set, it’s important to test for this:\n\n```\n```objective-c\nif ([window\
    \ valueForKey : @\"hasShadow\"] != nil)\n    BOOL returnFlag = [[window valueForKey\
    \ : @\"hasShadow\"]\n        boolValue];\n```\n```\n\nCocoa keys are likely to\
    \ be initialized. Custom objects may or may not include initialization code, so\
    \ it’s good practice to make sure that all possible values are initialized correctly\
    \ or that returned values are tested for nil before being used.\n\n# Using NSNull\n\
    \nConfusingly, collection objects — NSDictionary, NSArray, NSSet, and so on —\
    \ use a different but equivalent value called null.\n\nnil is an empty pointer,\
    \ while null is an object used as a placeholder for a missing and undefined value.\
    \ null is defined as the output of the NSNull class, and it is an instance of\
    \ NSNull.\n\n```\n```objective-c\nNSNull *nullValue = [NSNull null];\n```\n```\n\
    \nThis bizarre construct is the only way to access the null value.\n\n# Avoiding\
    \ errors\n\nIf the KVC system can’t find a key, an error is raised. You can control\
    \ KVC errors by implementing the valueForUndefinedKey: method in the object you’re\
    \ accessing. Add this boilerplate method signature, implementing the method to\
    \ create a useful return, such as an error value that you code can trap:\n\n```\n\
    ```objective-c\n- (id) valueForUndefinedKey: (NSString * ) key\n{\n    //return\
    \ a default value to avoid generating an exception\n}\n```\n```\n\nAn equivalent\
    \ setValue: forUndefinedKey: method is triggered when you try to set the value\
    \ of an unrecognized key. Overriding this method with an empty implementation\
    \ is the easiest way to avoid generating an on-write exception.\n\n# Using Key-Value\
    \ Observing\n\nKey-Value Observing (KVO) is a related technology that links keys\
    \ to an observer method. Whenever the value is updated, the observer method is\
    \ triggered. You can use this to monitor any property in any object that is KVO\
    \ compliant."
  merge: -1
  img_proc: true
- pgno: 246
  md: "KVO literally means that when a value is modified, the observer method is triggered\
    \ — a form of remote viewing. KVO works even if there's no other connection between\
    \ the object that's being watched and the object that is doing the watching.\n\
    \nThe observer method receives a dictionary containing details of the changes.\
    \ The dictionary can be configured to report any combination of the old, new,\
    \ original, and prior values. The observer method can be in a different object.\
    \ Figure 9.11 illustrates how this works.\n\n**Figure 9.11**\nUnderstanding KVO.\
    \ The `registerAsObserver:` method is run once to enable KVO. The `observeValueForKey:`\
    \ method is run each time the value of the keypath is modified.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_246_0.png)\n\
    \n```\n```objective-c\n- (void)registerAsObserver\n{\n    [objectToWatch addObserver:\
    \ watchingObject\n                    forKeyPath:@\"observedProperty\"\n     \
    \                  options:(NSKeyValueObservingOptionNew |\n                 \
    \               NSKeyValueObservingOptionOld)\n                       context:NULL];\n\
    }\n```\n```\n\nThis initializes `watchingObject` as an observer for the `observedProperty`\
    \ key in `objectToWatch`. Objects can observe themselves, so both objects can\
    \ be `self`.\n\nThe `options` field ORs together two selection flags and sets\
    \ up the dictionary to return both the old and new values. `context` is a free\
    \ field that can be used to pass any pointer to the observer.\n\nTo process updates,\
    \ add the following method to the observer. The method definition is a boilerplate\
    \ list of passed parameters. The same method body can handle updates for multiple\
    \ properties, so it's useful to include a list of conditionals that runs separate\
    \ code for each."
  merge: -1
  img_proc: true
