- pgno: 66
  md: 'Including file write methods inside data objects is unconventional. It’s more
    common to include separate file writing code that takes objects and their contents
    as a parameter. Cocoa also supports this more traditional option, and it’s discussed
    in more detail in Chapter 5. But keep in mind that Cocoa data objects can read
    and write their own contents directly to and from disk.


    # Using NSCoder


    A special object called NSCoder handles more complex archiving and de-archiving.
    In many applications, saving a file means saving a list of objects. You can’t
    use direct archiving for this because you’d have to write each object to a separate
    file.


    With an NSCoder, you can create your own archiving method in a custom object and
    fill it with a list of encoding methods. This joins your list of objects together,
    creating a single packed archive. Optionally, but usefully, you can label each
    field with a key, making it easy to access it later. The archived object in each
    field is treated as a value. To reverse the process, implement a corresponding
    decoder method. For practical examples of NSCoder, see Chapter 12.


    # File paths and URLs


    Cocoa makes as little distinction as possible between local and remote data. You
    can download a file from a Web site as easily as you can load it from disk. In
    Cocoa, text file paths and URLs are closely related. Paths can be converted into
    URL objects — and sometimes paths must be converted into URLs because some objects
    can only access local data via a URL.


    Although the OS X file system is based on a standard UNIX hierarchy, in practice,
    system and user directories often require specialized access code. This is even
    more relevant on the iPhone, where apps have access to a very limited and stylized
    version of the UNIX hierarchy and data is sandboxed for security reasons.


    # Exploring other Cocoa features


    Cocoa includes a selection of other unique features that developers must be familiar
    with. Some are introduced in the developer documentation, but the documentation
    doesn’t always explain how these features are designed to be used.


    # Cocoa network support


    Apple’s networking system is called Bonjour, and Cocoa includes objects that can
    find data on a Bonjour network. Specifically, Cocoa can find a list of network
    services. Unfortunately, most data transfers have to be handled at a lower level
    of the OS. Web support is more comprehensive. Cocoa includes simple and direct
    access to online files and can also support online security. For less Web-centric
    online data access, it’s fairly easy — but not trivially simple — to assemble
    an application that accesses an online API. Chapter 10 has more details.


    # Windows and views


    OS X supports a windowed interface, with support for various interface objects,
    including buttons, sliders, text fields, file lists, preferences panes, and others.
    In Cocoa, windows are wrapped'
