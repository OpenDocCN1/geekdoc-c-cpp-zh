  md: '# # About the Author


    With more than ten years of experience as a developer and more than fifteen years
    in publishing, Richard Wentk is one of Great Britain''s most reliable technology
    writers. He covers Apple products and developments for *Macworld* and *MacFormat*
    magazines and also writes about technology, creativity, and business strategy
    for magazines such as *Computer Arts* and *Future Music*. As a trainer and a former
    professional Apple developer returning to development on the iPhone and OS X,
    he is uniquely able to clarify the key points of the development process, explain
    how to avoid pitfalls and bear traps, and emphasize key benefits and creative
    possibilities. He lives online but also has a home in Wiltshire, England. For
    details of apps and other book projects, visit www.zettaboom.com.'
