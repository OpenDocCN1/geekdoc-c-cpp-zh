    # Introducing the Inspector window


    The Inspector window is the most critical window in IB. It has multiple functions,
    and is used for the following:


    +   - Presetting object properties and behaviors

    +   - Defining object special effects, including animations

    +   - Setting object position and size and defining object behaviors when a window
    is resized

    +   - Creating bindings, implicit links to code that are triggered when the object
    is modified

    +   - Creating explicit links to object and outlets in code

    +   - Assigning an object to a subclass

    +   - Setting an object tooltip


    When you select an object in the Doc window, its corresponding properties appear
    in the Inspector window, selected by the icons in the tab bar at the top of the
    window. The icons are slightly cryptic. Here’s a list of their formal names, from
    left to right.'
