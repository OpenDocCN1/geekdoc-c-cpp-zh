- pgno: 390
  md: "```\n```objective-c\nNSEntityDescription *albumEntity\n= [NSEntityDescription\
    \ entityForName:@\"Album\"\ninManagedObjectContext:managedObjectContext];\nNSFetchRequest\
    \ *theRequest = [[NSFetchRequest alloc] init];\n[theRequest setEntity:albumEntity];\n\
    NSPredicate *thePredicate =\n[NSPredicate predicateWithFormat:@\"Artist == %@\"\
    , aString];\n\n[theRequest setPredicate:thePredicate];\n```\n```\n\nBut this doesn’t\
    \ work. The Artist key is a relationship, and the regex search code can’t follow\
    \ to-many relationship links.\n\nA workaround is to create a list of album keys\
    \ and values in a separate array, and search the array for the Artist key. Instead\
    \ of specifying a predicate, you request a list of all albums, and then search\
    \ the returned array.\n\nCounterintuitively, this solves the problem, with only\
    \ minor extra complications. The code for a full solution follows. The search\
    \ is packed into a refreshList: method that can be called when the application\
    \ should refresh the list of filtered albums.\n\n```\n```objective-c\n- (void)\
    \ refreshList: (id) sender {\n    NSEntityDescription *albumEntity =\n    [NSEntityDescription\
    \ entityForName:@\"Album\"\n    inManagedObjectContext:managedObjectContext];\n\
    \    NSFetchRequest *theRequest = [[NSFetchRequest alloc] init];\n    [theRequest\
    \ setEntity:albumEntity];\n    searchReturnArray = [NSMutableArray arrayWithCapacity:50];\n\
    \    tempArray =\n    [managedObjectContext executeFetchRequest:theRequest\n \
    \   error:nil];\n    [tempArray enumerateObjectsUsingBlock:^(id obj,\n    NSUInteger\
    \ idx, BOOL *stop) {\n        NSString *albumName = [obj valueForKey:@\"Name\"\
    ];\n        NSString *artistName =\n        [[obj valueForKey:@\"Artist\"] valueForKey:@\"\
    Name\"];\n        if ([artistName isEqual:selectedName.stringValue])\n       \
    \     [self.searchReturnArray insertObject:\n            [NSDictionary dictionaryWithObject:\
    \ albumName\n            forKey:@\"FileName\"] atIndex: 0];\n    }];\n    self.searchReturnArray\
    \ = searchReturnArray;\n    NSLog(@\" %@\", searchReturnArray);\n}\n```\n```"
