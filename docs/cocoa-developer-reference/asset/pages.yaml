    \    if ((testNumber%2 == 0) || (testNumber%3 ==0)) return NO;\n    int divisor\
    \ = 5;\n    int limit = 1+sqrt(testNumber);\n    while (divisor < limit) {\n \
    \       if ( ((testNumber%divisor) ==0) ||\n                 (testNumber%(divisor+2))\
    \ ==0) return NO;\n        divisor +=6;\n    }\n    return YES;\n}\n@end\n```\n\
    ```"
