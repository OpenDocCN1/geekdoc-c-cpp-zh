- pgno: 185
  md: 'The Attributes tab, shown in Figure 7.11, is a context-dependent property editor.
    It’s equivalent to setting object properties in code, but is easier to work with
    because it displays many properties simultaneously. When the selected object is
    visible in an Edit window, changing its properties in the Inspector immediately
    updates its appearance. Each object has a different selection of editable properties:
    some objects have no editable properties at all; others display tens of options.
    Properties define how the object appears and how it behaves. For example, a slider
    object can appear with or without check marks, and the slider’s movement can be
    free or constrained to the check marks; a text field can be center-, left-, or
    right-justified, with various possible line break options; and so on.


    # Figure 7.11


    The Attributes tab is one of the most critical elements of IB. Use this tab to
    preset object properties. Every object displays a different selection of properties;
    for example, you can set the title and define the controls that are visible for
    the application’s window.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_185_0.png)


    The Effects tab, shown in Figure 7.12, selects special effects, including drop
    shadow and transparency effects, and various animation effects implemented with
    both predefined and editable filters. For example, you can specify Photoshop-like
    compositing modes to combine the object with objects that are drawn beneath it.
    You can also set animated transitions — such as page curls and dissolves — that
    are triggered in response to user actions.'
  merge: -1
