- pgno: 361
  md: 'You can repeat this for other properties in the other two columns. In this
    example, the middle column displays the NSApplicationProcessIdentifier key, and
    the rightmost column displays the NSApplicationPath key.


    Here''s a review of the steps that created the finished application:


    +   1. You added code to initialize a data source with data.

    +   2. You added a controller object to the nib.

    +   3. You bound the controller object to the data source, copying data to its
    Controller Content property.

    +   4. You added view objects to the nib.

    +   5. You bound the view objects to view content generated by the controller,
    selecting different possible view content with the Controller Keys.

    +   6. Finally, you selected the values that appear by typing a property name
    into the Model Key Path.


    **TIP**


    You can find two versions of this project on the Web site for this book at www.wiley.com/go/cocoadevref.
    A slightly extended version adds an extra text field that you can experiment with.
    Try binding selection, selectionIndex, and some of the Boolean values to the text
    box to see how they change as you select items in the table.


    # # Implementing Preferences with Bindings


    Among the controller objects used with bindings is NSUserDefaultsController. This
    is a special object that takes its data from the application''s preferences. The
    controller is shared. You can create multiple instances of it in multiple nibs,
    and every instance accesses the same data. You don''t need to bind it to a data
    source, because it''s already bound to the preferences system.


    Bindings can simplify preferences in two ways:


    +   - You can bind objects and views in a preferences pane directly to the NSUserDefaultsController.
    The controller will save and load the application preferences automatically, so
    this pane will always be correct.

    +   - You can bind objects in the main application nib to NSUserDefaultsController
    to display them, or a modified version of them, in a different location. For example,
    you may want to include a hint or reminder item in a toolbar that shows the current
    value of a preference.'
