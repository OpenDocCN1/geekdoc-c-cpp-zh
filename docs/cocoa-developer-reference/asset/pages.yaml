- pgno: 467
  md: '# Setting the animation duration


    To change the default animator duration, wrap it in `NSAnimationContext` calls.


    ```

    ```objc

    [NSAnimationContext beginGrouping];

    [[NSAnimationContext currentContext] setDuration: 2.0];

    [[theButton animator] setFrameOrigin: mousePosition];

    [NSAnimationContext endGrouping];

    ```

    ```


    Technically, this creates a wrapper object with a modified duration value that
    is fed through to the underlying animation object. In practice, you can use this
    code as boilerplate. You can also use it to group multiple animator effects together,
    giving them a common duration and triggering them at the same moment.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_467_0.png)


    # C R O S S - R E F


    The second FollowButton project on the Web site for this book (www.wiley.com/go/cocoadevref)
    demonstrates a simple modification that animates both button size and target position.


    # Customizing the animation object


    By default, animator works in an opaque way. It contains an animation object,
    but you can’t modify its properties. However, you can create a new custom animation
    object, set its properties as needed, and plug it into an animator, replacing
    the default animation. To do this, create an instance of one of Core Animation’s
    animation manager classes.


    Core Animation is a powerful but somewhat disorganized framework. Instead of one
    animation object, there are many subclasses of a class called `CAAnimation`. Table
    17.2 summarizes the most useful subclasses and their typical applications.


    | Class | Description |

    |---|---|

    | `CAAnimation` | Root class, rarely used directly. Creates animation objects,
    supports `animationDidStart:` and `animationDidEnd:` delegate methods. Also implements
    `removedOnCompletion:` to auto-delete animations after they run, and the `timingFunction:`
    property to control the development of the animation over time. |

    | `CAPropertyAnimation` | `keyPath` property defines the keypath of the animated
    property, and `cumulative` defines whether the animation adds to or replaces the
    current value of that property. Rarely used. |

    | `CABasicAnimation` | The most useful object. Implements all the previous properties,
    and adds `fromValue:` and `toValue:` properties that define the animated value
    numerically. Includes an optional `byValue:` property that the animation sequence
    will pass through, if it’s defined. |'
  merge: -1
  img_proc: true
- pgno: 468
  md: "| Class | Description |\n|---|---|\n| `CAKeyframeAnimation` | An alternative\
    \ to `CABasicAnimation` that animates the target value with a sequence of discrete\
    \ steps called keyframes, defined by an array of points or a path. Includes an\
    \ option to pace animations and force a fixed duration on the sequence of steps.\
    \ |\n| `CAGroupAnimation` | A wrapper for an array of animation objects that can\
    \ be used together. |\n| `CAMediaTiming` | A protocol implemented by all Core\
    \ Animation objects that makes it possible to repeat animations, delay them, and\
    \ apply autoreverse so that they run forward and then backward. Also defines how\
    \ the final property value is defined after the animation. |\n| `CAMediaTimingFunction`\
    \ | Not a subclass of `CAMediaTiming`. This is a separate class that defines the\
    \ animation timing curve with either one of four presets or a custom timing Bezier\
    \ curve. The curve is an object that plugs into the `timingFunction` property.\
    \ |\n\nYou can simplify this nest of classes with the following hints:\n\n+  \
    \ - You’ll rarely, if ever, use `CAAnimation` and `CAPropertyAnimation` directly.\n\
    +   - For a simple from-to animation, create a `CABasicAnimation`.\n+   - For\
    \ a complex path animation that follows a list of defined points, create a `CAKeyframeAnimation`.\n\
    +   - Optionally, define an instance of `CAMediaTimingFunction` to control time\
    \ development. For most animations, the preset timing functions create a good\
    \ result. Use a custom function for special effects.\n+   - Optionally, set up\
    \ repeat and autoreverse effects with an instance of `CAMediaTiming`.\n+   - Plug\
    \ your chosen timing function and timing settings back into your animation object.\n\
    +   - Optionally define a delegate and implement the `animationDidStart:` and\
    \ `animationDidEnd:` methods. For example, you can use `animationDidEnd:` to run\
    \ another animation object, creating complex chained animation sequences; or it\
    \ can just log a message for debugging.\n+   - To replace the default animator,\
    \ bundle the new animation object into a dictionary and assign the dictionary\
    \ to the target object’s `animations` property.\n\nThis looks like a lot of work,\
    \ but most of it is optional. Some sample code that adds a timing function to\
    \ the follow-bottom example follows:\n\n```\n```objective-c\n- (void) awakeFromNib\
    \ {\n    oldPosition = theButton.frame.origin;\n    //Create a basic animation\
    \ object\n    moveAnimation = [CABasicAnimation animation];\n    moveAnimation.duration\
    \ = 2.0;\n    //Preset ease-in/out curve\n```\n```"
  merge: -1
