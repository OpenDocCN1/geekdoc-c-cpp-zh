    # Summary


    In this chapter, you were introduced to the iOS device range and the key differences
    between Apple’s mobile products. You learned how to understand the App Store business
    model, and you discovered the commercial differences between iPhone and iPad development.
    You were introduced to design hints to help you create apps that have the greatest
    chance of success in the App Store, concentrating on popular app types, and avoiding
    specialized, niche-oriented, and time-consuming projects.'
