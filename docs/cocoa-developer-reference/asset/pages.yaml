- pgno: 118
  md: "Some Cocoa objects are used as drop-in solutions that implement specific features;\
    \ for example, the NSDate object holds information about the system date and time.\
    \ Others are designed to be modified and extended. All Cocoa objects are extensions\
    \ of an object called NSObject, which implements essential object creation, memory\
    \ management, and copying methods. You can extend NSObject to create a minimal\
    \ blank object. You can also modify most of Cocoa’s other objects to create sophisticated\
    \ customized features.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_118_0.png)\n\
    \n> **NOTE**\n> \n> It’s possible to create customized objects in Objective-C\
    \ that aren’t related to NSObject, but this is usually a wasted effort. NSObject\
    \ implements core object management features “for free.” A customized alternative\
    \ has to implement similar features from scratch — which isn’t a small project.\n\
    \n# Understanding classes\n\nA class is a blank template that defines an object’s\
    \ features. For example, Cocoa’s NSWindow class defines the features of an OS\
    \ X window. Class definitions list an object’s property fields and the methods\
    \ it supports, including the code blocks that implement them. In theory, class\
    \ definitions are blank and static: they hold no data and do nothing. To work\
    \ with data, the templates are used to create instances — working copies of an\
    \ object. In practice, Objective-C treats the class itself as a single separate\
    \ instance with unique methods and properties. Class methods are often used to\
    \ create and return information about class instances.\n\nTable 5.2 summarizes\
    \ the different elements that define objects and make them usable.\n\n| Feature\
    \ | Summary |\n|---|---|\n| Class definition | A template that defines the methods\
    \ and properties in each object. Every object has a single unique class template.\
    \ |\n| Instance | A working version of an object that can store data. Copies are\
    \ created and released from memory as needed. Each copy organizes its data using\
    \ the same template. |\n| Pointer | A named variable that stores the base memory\
    \ address of an instance. The string is used as a handle for the address. Pointer\
    \ must be unique within a given scope. |\n| Property | A data field. Class templates\
    \ define the data type of each field and specify a useful name. Instances can\
    \ store data in each field. Properties cannot be accessed directly. Accessor methods\
    \ must be included to make them accessible from other objects. |\n| Methods |\
    \ Code blocks that define how an object responds to messages. Optionally, methods\
    \ can take parameters and generate return values. |\n| Messages | Events that\
    \ are sent to an instance to run a named code block. In Objective-C, messages\
    \ can also be sent to the class template. |\n| Accessors | Methods that read or\
    \ write properties — explicit setter (write) and getter (read) code. Accessors\
    \ can be generated automatically in Objective-C’s `@synthesize` directive. Optionally,\
    \ accessors can force an update of an object’s internal data or state while implementing\
    \ a read/write. |\n| C features | C isn’t used in object-to-object messaging,\
    \ but can appear in object method code, and C data types can be used as properties\
    \ or wrapped into objects. C function calls are often included within objects\
    \ as helper code that implements low-level features. Parts of Cocoa use C structs\
    \ as proto-objects that are partly interchangeable with full objects. |"
  merge: -1
  img_proc: true
