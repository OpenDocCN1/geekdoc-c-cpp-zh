- pgno: 172
  md: "# # Introducing\n# Interface Builder\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_172_0.png)\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_172_1.png)\n\nAs emphasized in previous\
    \ chapters, Interface Builder — also known as IB — could be called Application\
    \ Builder. Many developers use IB exclusively as an interface design tool. But\
    \ you can use it in a completely general way, creating arbitrary collections of\
    \ objects for your applications and defining arbitrary links between them.\n\n\
    ![](img/2b293e29fc15b0797f113b85dd429b6e_172_2.png)\n\n> **TIP**\n> \n> Even when\
    \ used exclusively for UI design, you can use IB to create loadable elements within\
    \ a UI, such as individual entries in a table or scrolling subwindows. You don’t\
    \ have to use IB to design complete views. Potentially you can combine IB elements\
    \ with code to create customized animated interfaces that have more in common\
    \ with Flash design than with the standard Aqua/OS X look and feel.\n\n# ## Introducing\
    \ Nib Files\n\nA nib file is a collection of objects. The contents of a nib file\
    \ are read-only: you can’t use a nib file as a persistent store for mutable data.\
    \ But IB includes initialization options for certain objects, so you can preset\
    \ some of their properties to useful values; for example, you can set the initial\
    \ position and size of an application window. Table 7.1 lists some of the key\
    \ features of the nib system.\n\nNib file loading is semiautomated. When an application’s\
    \ initial nib file is defined in its `info.plist` file, as shown in Figure 7.1.\
    \ This nib is always loaded automatically.\n\n**In This Chapter**\n\n- Introducing\
    \ nib files\n- Getting started with Interface Builder\n- Setting classes and subclasses"
  merge: -1
  img_proc: true
- pgno: 173
  md: '| Feature | Explanation |

    | --- | --- |

    | General object support | Nib files can include any Cocoa object or customized
    subclass. |

    | Implicit object instantiation | Object instances loaded from a nib file are
    allocated and initialized in memory without alloc/init code. |

    | Visual UI design | Objects with visible elements can be positioned with IB''s
    graphic view editor. |

    | UI object defaults | Visible objects can have a subset of their properties initialized
    to default values. |

    | Object graphs | Objects can be grouped together in trees or hierarchies, which
    are accessed via a common root object. |

    | Semiautomated loading | Nib files can be loaded automatically or loaded manually
    using code. |

    | Lazy loading | Object groups can be loaded and released as needed to maximize
    memory. |

    | Nib swapping | Nib swapping is a practical application of lazy loading. Nib
    files can be swapped as needed — for example, to load different views into a single
    window. |

    | Outlets and actions | Objects in the nib file can be linked to objects in code
    via IBOutlets. Methods in code can be triggered by events generated by nib objects
    via IBActions. |

    | Bindings | Objects can trigger code events automatically without explicit outlets
    or actions. |


    # ## Figure 7.1


