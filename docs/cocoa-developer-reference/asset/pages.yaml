    ![](img/2b293e29fc15b0797f113b85dd429b6e_34_0.png)


    A key difference between Mac and iPhone applications is that Apple has a monopoly
    on iPhone app sales. Anyone can develop a Mac application and sell it from a Web
    site without Apple’s permission. Apple can only block sales of OS X applications
    if they break the law in an obvious way.


