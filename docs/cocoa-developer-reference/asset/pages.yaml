- pgno: 28
  md: '# NeXTStep and the Web


    NeXTStep may have been directly responsible for the World Wide Web. The original
    hypertext browser and server system were developed by Tim Berners-Lee on a NeXT
    system at the European CERN particle accelerator. The Web isn’t truly object-oriented
    or message-based, and HTML remains a simple mark-up language and not a programming
    language. But hints of Objective-C and NeXTStep are visible in the way the tag
    links and HTML fields are specified as objects with specific subproperties.


    NeXTStep and Cocoa have certainly been influenced by the Web. Many Cocoa data
    objects make no distinction between local and remote data. Where most operating
    systems assume that all data is on a local disk or on a network, Cocoa enables
    data to be specified and downloaded with a URL. Some Cocoa objects use URLs for
    all data. Local file paths must be converted into a URL before the data can be
    loaded.


    # Moving from NeXTStep to Cocoa


    In 1996 Steve Jobs returned to Apple, bringing NeXTStep with him. In the preceding
    years, Apple had tried and failed to create a successor to Mac OS 9. Buying NeXTStep
    and re-hiring its creator was an obvious solution. After numerous false starts,
    Apple eventually released OS X 10.0 in 2001. Codenamed Cheetah, OS X 10.0 was
    built from a blend of OpenStep features and existing OS 9 code. Apple’s new interpretation
    of NeXTStep was named Cocoa. Internally, Cocoa objects still use the letters NS
    as a prefix — for example, Cocoa’s window object is called NSWindow.


    Although OS X 10.0 was famously unstable — Apple released a free update to OS
    X 10.1 almost immediately — the NeXTStep-inspired look and feel of OS X was an
    immediate success with users and developers. Apple aggressively promoted OS X
    development by offering a free SDK. Since then Cocoa has developed further. In
    2005 Apple dropped support for G3 series processors and moved OS X to Intel Mac
    technology. Currently Cocoa and OS X are moving toward full 64-bit support with
    touch-based user interface extensions. But the SDK continues to be free. A version
    is bundled with all Macs, while the most recent update can be downloaded from
    Apple’s Web site.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_28_0.png)


    # CROSS-REF


    For more information about the Xcode SDK, see Chapters 3 and 4.


    Recent versions of Cocoa remain compatible with NeXTStep code, which often compiles
    and runs on OS X with minimal changes. But Cocoa is no longer identical to OpenStep
    or NeXTStep. With each OS X update, new features are added and old features are
    changed or removed. Figure 1.3 shows Snow Leopard, the most recent version of
    OS X and Cocoa. Internally the NeXTStep legacy remains, both in the code and in
    the Cocoa design philosophy that influenced'
