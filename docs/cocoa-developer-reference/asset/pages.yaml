- pgno: 18
  md: '# # Introduction


    This book is about developing Cocoa projects for OS X using the Xcode SDK. The
    theoretical elements of Cocoa are similar to those in Cocoa Touch and apply equally
    to both OS X and iOS. The more practical elements were written to describe OS
    X but with significant overlap with the equivalent features in iOS.


    You''ll find this book useful if you''re a newcomer to Cocoa at the beginner or
    intermediate level and have experience with C/C++/C#, Java, Flash, Python, or
    a Web language such as PHP. If you''re ambitious and feel up to a challenge, you
    can start with no experience at all. If you do, you''ll find it helpful to use
    Objective-C (Wiley, 2010) as a companion title.


    Cocoa isn''t a synonym for OS X, and for practical reasons this book says little
    about the low-level Mach/POSIX features that underpin OS X. It mentions some of
    the C-level frameworks that Cocoa is built on but doesn''t detail them, although
    it does give you enough information to explore them for yourself if you choose
    to.


    Chapter 1 is an introduction to the history of Cocoa and OS X and explains how
    Cocoa evolved from Smalltalk and from the Objective-C development environment
    introduced by NeXT in the late 1980s. It also includes some strategic hints about
    the OS X and iOS application markets and how to research the current state of
    both so that you can target your applications for maximum return.


    Chapter 2 is an informal introduction to the features that make Cocoa unique.
    Whether you''re starting programming from scratch, or have a background in some
    other environment, this is one of the most critical chapters in the book. Reading
    it will save you time later.


    Chapter 3 is a guide to the Apple documentation. It may not be obvious why this
    needs a guide, but Apple has structured the documentation in specific ways, and
    you''ll progress more quickly and with less effort if you understand what this
    means in practice. Understanding and using the documentation is a key skill. Don''t
    skip this chapter, even if you already have experience in other environments.


    Chapter 4 explains how to join Apple''s Developer Programs, and how to download
    and install Xcode. It also introduces the key features of Xcode 3.2.3, including
    the windows, menu items, and customizable toolbar. This chapter explains how to
    create a new sample project — an essential skill that''s used repeatedly later
    in the book.


    Chapter 5 introduces objects and classes and describes how they''re implemented
    in Objective-C. If you have experience in other object-oriented environments,
    you''ll need this chapter to reorient yourself to Objective-C. If you haven''t,
    you''ll find an explanation of object-oriented development that''s a fundamental
    requirement for understanding Cocoa.


    Chapter 6 explores objects in Cocoa in a more hands-on way, with very simple projects
    that illustrate how to use objects and their features in real Cocoa applications.


    Chapter 7 introduces the key features of Interface Builder and explains how you
    can use IB to build complete applications, because IB isn''t just for interfaces.'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Chapter 8 demonstrates how to use IB to build a working application with a
    custom interface assembled using Cocoa library objects and how to connect a UI
    created in IB to code written in Xcode. This is another essential chapter. You''ll
    need this information to build Cocoa successful applications.


    Chapter 9 introduces some of the standard Cocoa design patterns and their supporting
    features, including target-action, Model-View-Controller, and selectors. It also
    looks more closely at Cocoa key-value technologies such as Key-Value Coding and
    Key-Value Observing and explains how to work with them effectively.


    Chapter 10 introduces the Cocoa file interface and explains how it’s built into
    many Cocoa objects, making a file manager unnecessary. For completeness, this
    chapter also introduces the file manager and explains how to add open and save
    panes to an application.


    Chapter 11 explains how to manage timing, threads, and tasks in Cocoa. It also
    introduces the new block syntax, which is slated to replace delegation and other
    design patterns in future versions of OS X.


    Chapter 12 introduces Cocoa’s data collection classes, including `NSArray`, `NSDictionary`,
    and `NSSet`, and explores some of their features. It explains how to use `NSCoder`
    to serialize data when saving it or reloading it and introduces the essentials
    of both manual memory management and automated garbage collection.


    Chapter 13 explores bindings, which are often seen as one of Cocoa’s more challenging
    features but which are explained here in an unusually straightforward and practical
    way.


    Chapter 14 follows from the previous chapter with an introduction to Core Data.
    It explains how to build a working card index application with no code at all
    and also how to customize it to make it more useful and flexible.


    Chapter 15 introduces Cocoa’s attributed — styled — text features and explains
    how to create applications with multiple document windows. You’ll also find information
    about printing, undoing, and localizing text for foreign markets.


    Chapter 16 explains how to create 2D graphics, using Cocoa’s path, fill, and stroke
    features and also gives a low-level example of creating effects with Cocoa’s Core
    Image filters.


    Chapter 17 expands on the techniques of the previous chapter and demonstrates
    various animation techniques, including a simplified but animated Core Image filter.
    You can also find an introduction to OpenGL in Cocoa, with a sample animated teapot
    application.


    Chapter 18 introduces various tools and strategies for debugging and profiling
    code and optimizing performance.


    Chapter 19 is about developing for iOS. It introduces the key differences between
    Cocoa and Cocoa Touch, explains how to use the iOS simulator and how to get started
    with development on real hardware, and also explores some of the commercial opportunities
    offered by the iPhone and iPad.'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'Appendix A is about building dashboard widgets, which use JavaScript instead
    of Objective-C and are a quick and easy way to get started with Mac development.


    Appendix B lists some of the common errors that appear in Cocoa code and introduces
    some possible bug-busting strategies.


    Code appears in a `monospaced font`. Items you type appear in **bold**.


    Projects were developed with Xcode 3.2.3 on OS X 10.6.3. Supporting code is available
    on the book''s Web site at `www.wiley.com/go/cocoadevref`. See the readme there
    for the most recent system and software requirements. Code is supplied as is with
    no warranty and can be used in both commercial and private Cocoa projects but
    may not be sold or repackaged as tutorial material.'
  merge: -1
