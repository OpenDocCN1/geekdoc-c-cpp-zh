    # CAUTION


    The list of user events is a standard feature in UIKit. Objects display the full
    list in IB, but most generate only some of the events; for example, round rect
    buttons do not support editing, so they never send the Editing Changed event.
    Text fields do not generate Touch Down events. If your view is not generating
    events as it should, double-check the events you have linked here.'
