  md: "# Using self\n\nIn a class, self is used to access internal methods. For example:\n\
    \n```\n```\n[self doSomethingInternal];\n```\n```\n\ntriggers the doSomethingInternal\
    \ method, which is assumed to be present in the class. Internal methods can be\
    \ private or public. You can also use self to make property access operations\
    \ explicit.\n\n```\n```\n//If aProperty uses a custom getter, this is necessary\n\
    aValue = [self aProperty];\n\n//...because this is interpreted as a pointer copy\n\
    aValue = aProperty;\n```\n```\n\n# Defining a class implementation\n\nThe contents\
    \ of an implementation file are organized like this:\n\n```\n```\n#import MyNewClass.h\n\
    #import (any other classes that are referenced)\n@implementation MyNewClass\n\
    \    (an optional list of @synthesize directives for properties)\n    (an optional\
    \ list of private variables)\n    (a list of methods with full implementation\
    \ code)\n@end\n```\n```\n\nThe #import directive loads the interface header file.\
    \ For historical reasons, Objective-C uses #import for Objective-C headers and\
    \ #include for C headers. The rest of the file is a list of implemented methods.\
    \ Any method listed in the interface must be implemented in the implementation.\
    \ The implementation doesn't have to be complete and finished — a stub will do\
    \ — but the compiler will throw an error if it's absent.\n\n> > **NOTE**\n> >\n\
    > > It's possible to combine the header and implementation within a single file.\
    \ This is bad practice because classes often need to import the interface declarations\
    \ of other classes. This becomes very inefficient when headers aren't separated\
    \ from code.\n\nIf a class references a class or a framework, it must include\
    \ a #import directive for its headers. For clarity and memorability, it's good\
    \ practice to include the #import directives in the implementation.\n\nTo use\
    \ @synthesize, follow it with a list of property names and end the list with a\
    \ semicolon:\n\n```\n```\n@synthesize aProperty, anotherProperty, somethingElse,\
    \ aView;\n```\n```"
  merge: -1
