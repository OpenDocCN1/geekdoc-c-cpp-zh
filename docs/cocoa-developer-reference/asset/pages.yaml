- pgno: 336
  md: "# Using accessors\n\nAs outlined in Chapter 9, you *must* use accessor methods\
    \ when setting the values accessed by bindings.\n\n```\n```objectivec\nvalue =\
    \ value*10;      //This doesn't work\nself.value = value*10; //This does - it's\
    \ obligatory\n```\n```\n\nThis is a prime source of confusion. If you don't update\
    \ values correctly, bindings don't work.\n\n**TIP**\nYou can bind to system objects\
    \ as well as to objects in your own code. If their properties are KVO-compliant,\
    \ bindings will track them as their values change. If they're not KVO-compliant,\
    \ nothing happens. Class References occasionally mention that properties are KVO-friendly.\
    \ If they don't, you can test them by trying to set up a KVO observer.\n\n# Creating\
    \ a simple binding\n\nThe SimpleBindings1 project on the Web site for this book\
    \ demonstrates how to bind a counter value to a slider object. You can find the\
    \ project at www.wiley.com/go/cocoadevref. Load the project before continuing.\
    \ All the code is in the app delegate. The header defines a counter as a property:\n\
    \n```\n```objectivec\n#import <Cocoa/Cocoa.h>\n@interface SimpleBindingsAppDelegate\
    \ : NSObject\n    <NSApplicationDelegate> {\n    NSWindow *window;\n    int sliderCount;\n\
    }\n@property (assign) IBOutlet NSWindow *window;\n@property int sliderCount;\n\
    @end\n```\n```\n\nThe implementation creates a timer, which fires a timerMethod.\
    \ sliderCount counts to a maximum value, reverses direction, counts down, and\
    \ reverses direction again at 0.\n\n```\n```objectivec\n#import \"SimpleBindingsAppDelegate.h\"\
    \n@implementation SimpleBindingsAppDelegate\n@synthesize window, sliderCount;\n\
    int delta = 1;\n- (void)applicationDidFinishLaunching:(NSNotification *)\n   \
    \ aNotification {\n    NSTimer *thisTimer = [NSTimer\n    scheduledTimerWithTimeInterval:0.05\
    \ target: self selector:\n    @selector(timerMethod) userInfo: nil repeats: YES];\n\
    \    }\n```\n```"
  merge: -1
