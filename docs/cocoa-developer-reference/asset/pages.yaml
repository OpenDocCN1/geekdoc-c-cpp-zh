- pgno: 146
  md: 'Figure 6.5 shows the `setTitle:` entry. It has a title followed by a brief
    description, followed by a code signature. Making sense of the signature is a
    fundamental skill. Even if you have experience in other object-oriented languages
    and already understand what each element does, some of the Objective-C syntax
    may be unfamiliar.


    # Figure 6.5


    The `setTitle:` method description includes a terse list of the method''s features.
    Very few of the class reference pages include sample code or examples.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_146_0.png)


    # Understanding signatures


    In this example, you want to send the `setTitle:` message to an instance of `NSWindow`.
    The signature tells you four things:


    +   - The initial “-” character indicates that this is an instance method, not
    a class method. It must be run on an instance of `NSWindow`, not on the class
    as a whole. This is good news — it means you can use this method on `window`.
    For a class method, the initial character would be a “+,” and it would have to
    be run on `NSWindow` itself, not on an instance.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '+   - `(void)` indicates there’s no return value. If the method supplied a
    return value, this field would indicate its type in the usual C-like way.

    +   - The third field is the name of the method and also defines the string used
    to trigger it — `setTitle:`.

    +   - The colon indicates that a parameter follows the method name. In this example,
    the parameter is an instance of `NSString`, which is Cocoa’s strong object data
    type. When a parameter is a Cocoa object, it appears as a link. If you need more
    information about `NSString`, click on the link to view its class reference.


    Putting this information together, you can guess that the message you need to
    send to window looks like this:


    ```

    ```objc

    [window setTitle: aString];

    ```

    ```


