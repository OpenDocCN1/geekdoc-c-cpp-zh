- pgno: 357
  md: '# Figure 13.19


    Understanding the format of the data in the `runningApps` array. Every item is
    a dictionary.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_357_0.png)


    When using bindings, this point is crucial. You *must* be able to specify a keypath
    for each displayed property, and it must return a useful value. If you want to
    use bindings with custom objects, you must design them in a way that supports
    keypath value access. Dictionaries are ideal for this because they explicitly
    implement key-value access.


    You can’t, however, access a simple linear array of strings, because the strings
    won’t have an associated key. An array index isn’t enough to support bindings,
    and bindings don’t support index access. You can’t use `someArray.0` as a keypath.


    This complicates the design of applications, because typically you need to pack
    array data into a dictionary before it can be accessed. Other workarounds are
    possible, but wrapping content into a dictionary is often the simplest solution.


    In this example, dictionaries are already available. So you can move on to the
    second part of the problem: selecting the formatted data. Figure 13.20 shows the
    Controller Key combo box. This is another element that seems mysterious, but it
    is quite simple in practice.'
  merge: -1
  img_proc: true
- pgno: 358
  md: '**Figure 13.20**


    Listing the possible Controller Key options to select how you want to view the
    data in the source array


    ![](img/2b293e29fc15b0797f113b85dd429b6e_358_0.png)


    # Understanding controller keys


    In the same way that the controller abstracts data from the data source, it also
    abstracts its display. Each item in this combo box is one possible interpretation
    or view of the data copied to the controller. Again, these items aren’t related
    to specific named properties in the original data, and the controller takes no
    interest in what the data represents or how it’s named.


    Instead, these Controller Keys select one particular summary or element of the
    data. Table 13.2 describes the more useful items in this list.


    A key feature of all controller keys is that the data selected by these keys is
    determined by the user’s actions. The datasource array doesn’t change, but the
    view of the data is modified as the user interacts with the table view or other
    display object. Figure 13.21 illustrates the process graphically.'
