- pgno: 372
  md: '# # 14 Using Core Data


    Core Data is a collection of classes designed to simplify the editing and archiving
    of linked data that can be used as the model in any application.


    You use Core Data when your application needs to manage data collections in which
    objects take some of their properties from other objects. This can include user-oriented
    data collections such as music playlists, EXIF (Exchangeable Image File Format)
    data managers from photo collections, and contact databases. It can also include
    application-specific data that is never accessed directly by users. For example,
    you can use Core Data to store the complete project state for a music sequencer
    or video editor, with all of its subsections.


    You can implement simple linking with Cocoa’s data collection objects, but Core
    Data offers the following features “free of charge”:


    +   - Undo

    +   - Data persistence without explicit archiving and de-archiving

    +   - Built-in support for bindings

    +   - An automated UI generator in Interface Builder (IB)

    +   - An abstracted interface that can report the edit/undo state of objects

    +   - Visual editing of object relationships


    ![](img/2b293e29fc15b0797f113b85dd429b6e_372_0.png)


    > > **CAUTION**

    > > Core Data isn’t a full relational database, and it doesn’t support some of
    the relationships and features that are standard in SQL and other database environments.
    For certain features, work-arounds may be required.


    For newcomers to Cocoa, Core Data can seem abstract and difficult to understand.
    The programming model uses many unique classes and introduces some new concepts.
    But if you can understand Key-Value Coding (KVC), with some effort, you can use
    Core Data.


    There are two approaches to Core Data development:


    +   - **Create an application visually, with Xcode’s Core Data editor, and then
    add extra code.** This is a good approach for any record-based application that
    supports user editing, and it is the one demonstrated in this chapter.


    # ### 14 In This Chapter


    +   - Creating a Core Data application visually

    +   - Understanding Core Data’s objects and programming model

    +   - Displaying search results'
