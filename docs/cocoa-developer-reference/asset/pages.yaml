- pgno: 322
  md: 'Even more usefully, the NSCoder process is recursive. Data collection objects
    automatically run NSCoder on their elements. If they need to, the elements run
    NSCoder on their subelements, and so on, until one more recursion is needed. As
    long as every class in the tree implements NSCoder correctly, this happens effortlessly
    with no extra code. Figure 12.4 summarizes the process.


