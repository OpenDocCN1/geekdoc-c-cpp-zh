- pgno: 311
  md: "If your code doesn’t need to know when items have been changed, removed, or\
    \ inserted, you can trigger KVO with a dummy assignment after an edit.\n\n```\n\
    self.dataCollectionObject = dataCollectionObject;\n```\n\nThis tells KVO that\
    \ the object has been accessed, but not if or how the collection was changed.\
    \ It’s a small solution, but it may be enough in some applications.\n\n# Using\
    \ NSNumber and NSNumber\n\nYou can add any object to any data collection. You\
    \ can also mix objects in the same collection, which is one reason why the data\
    \ collection objects are so powerful. By default, you can fill any data slot in\
    \ any data object with any class.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_311_0.png)\n\
    \n> **NOTE**\n> \n> Cocoa has no concept of a typed array or set. If you need\
    \ to enforce typing, you can implement it manually.\n\nBecause data collections\
    \ store objects and not naked values, you often have to use NSNumber and NSNumber\
    \ to “objectify” an existing value.\n\nNSNumber is relatively easy to work with.\
    \ To create an NSNumber object, use\n\n```\nNSNumber *aNumber = [NSNumber numberWith<Type>:\
    \ rawValue];\n```\n\nThe NSNumber Class Reference lists the supported types. Long\
    \ and unsigned variants are available.\n\nTo convert an NSNumber back into a numeric\
    \ C type, use\n\n```\n<a type> rawValue = [aNumber <type>Value];\n```\n\nFor example,\
    \ to convert to and from a float, use\n\n```\nNSNumber *aNumber = [NSNumber numberWithFloat:\
    \ 2.71828];\nfloat theNumber = [aNumber floatValue];\n```\n\nYou can use a stringValue\
    \ method to convert a number into a string. The formatting is arbitrary, so it’s\
    \ better to use the NSString stringWithFormat: method for conversions, because\
    \ you can apply standard C format specifiers. For details, see Chapter 15.\n\n\
    NSValue is more open-ended, and it supports the handful of Cocoa data types that\
    \ aren’t objects, such as NSRange, NSRect, NSPoint, and others. You can also use\
    \ it to “objectify” custom C data structures. The most useful built-in types include:\n\
    \n+   - Pointer\n+   - Geometrical point (NSPoint)"
