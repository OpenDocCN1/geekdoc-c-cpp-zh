- pgno: 445
  md: "# Transforming paths\n\nUnless you're a math expert, the matrix calculations\
    \ used in affine transforms aren't trivial. Fortunately it's easy to use affine\
    \ transforms without understanding how they do what they do. To transform a path,\
    \ create a transform object:\n\n```\nNSAffineTransform *aTransform = [NSAffineTransform\
    \ transform];\n```\n\nThis slightly unusual syntax creates a default null transform\
    \ that does nothing when it's applied to an object. You can then use scale methods\
    \ to create a transform that resizes a path, rotate methods to rotate a path,\
    \ and translate methods to move a path.\n\nFor example\n\n```\n[aTransform rotateByDegrees:\
    \ 45];\n```\n\ncreates a transform that rotates an object by 45 degrees. Similarly,\n\
    \n```\n[aTransform translateXBy: xFloat yBy: yFloat];\n```\n\ncreates a transform\
    \ that moves an object; and\n\n```\n[aTransform scaleXBy: xFloat yBy: yFloat];\n\
    ```\n\ncreates a transform that scales an object.\n\nTransforms are cumulative,\
    \ so you can scale, rotate, and then translate. The order is important: scaling\
    \ and rotation happen around the bottom-left origin. Keeping track of the relative\
    \ origin can be challenging. Typically you translate objects to the origin to\
    \ scale and rotate them, and then translate them back to their original position,\
    \ or to some other point in the view. A complex path may not have a well-defined\
    \ center.\n\nTo apply the transform to a path, use\n\n```\nNSBezierPath *newPath\
    \ = \n    [aTransform transformBezierPath: anOldPath];\n```\n\nWhen you stroke\
    \ or fill newPath, it appears in its translated location, scaled and rotated.\n\
    \n# Loading images\n\nTo load an image, create an NSImage object and initialize\
    \ it with image data from a file. You can specify an arbitrary filepath, or you\
    \ can include the image in the application bundle and load it directly from the\
    \ bundle. Use the former approach for image editing, and the latter for defining\
    \ images that are loaded and displayed automatically. For example, to include\
    \ an image in the bundle, right-click the Resources group and choose Add > Existing\
    \ Files. Navigate to the file, select it, and copy it into the project, selecting\
    \ the Relative to Enclosing Group reference type, as shown in Figure 16.12."
  merge: -1
  img_proc: true
- pgno: 446
  md: "# Figure 16.12\n\nBundling a file with a project. Don't forget to select the\
    \ Relative to Enclosing Group Reference Type; otherwise, your bundled file won't\
    \ be bundled correctly.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_446_0.png)\n\
    \nYou can load an image each time it's drawn, but this is usually very inefficient.\
    \ It's more efficient to load it once in awakeFromNib and reference it as needed.\
    \ For example:\n\n```\n```objective-c\nNSImage *sourceImage;\n- (void) awakeFromNib\
    \ {\n    NSString *sourceImagePath =\n        [[NSBundle mainBundle] pathForResource:@\"\
    bi\" ofType:@\"jpg\"];\n\n    NSURL *sourceImageURL =\n        [NSURL fileURLWithPath:\
    \ sourceImagePath];\n    sourceImage =\n        [[NSImage alloc] initWithContentsOfURL:\
    \ sourceImageURL]\n            retain];\n}\n```\n```"
  merge: -1
