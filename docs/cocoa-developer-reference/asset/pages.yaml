- pgno: 259
  md: "To search for files with specific extensions, load `filterTypes` with an array\
    \ containing the extensions before running the search:\n\n```\n```objc\nNSArray\
    \ *filterTypes =\n[NSArray arrayWithObjects: @\"jpg\", @\"tiff\", nil];\n```\n\
    ```\n\nTypically you use `testPath` to display a list of possible matches, and\
    \ then allow the user to select one or more.\n\n# Using paths\n\nOnce you have\
    \ a path string, Cocoa’s data objects can load data from the file it points to\
    \ with standard `objectWithContentsOfFile:` and `initWithContentsOfFile:` methods.\n\
    \nFor example, to load a string from a text file at aPath use:\n\n```\n```objc\n\
    NSString *textInTheFile =\n[NSString stringWithContentsOfFile: aPath\nencoding:\
    \ anEncoding error: &error];\n```\n```\n\nThe encoding parameter defines the string\
    \ encoding, the mapping between characters and byte values. `NSUTF8StringEncoding`\
    \ and `NSASCIIStringEncoding` are two standard values. For more information, see\
    \ Chapter 15. `&error` is a standard system error handler and is introduced in\
    \ Chapter 9.\n\n`NSArray`, `NSDictionary`, `NSSet`, `NSData`, and `NSImage` have\
    \ equivalent methods.\n\nThe corresponding write operation is\n\n```\n```objc\n\
    [aString writeToFile: aPath\n              encoding: anEncoding\n            \
    \ atomically: YES];\n```\n```\n\nAgain, Cocoa’s other data objects have corresponding\
    \ methods.\n\nThe atomically parameter is a BOOL. When it is YES, the file is\
    \ written in two stages to guarantee that it is closed and readable. When it is\
    \ NO, failed file writes can leave uncompleted file fragments on disk; there isn’t\
    \ any good reason to specify NO.\n\n# Using file handles\n\nCocoa’s object-oriented\
    \ file system simplifies object-oriented reads and writes, but complicates byte-level\
    \ file access. To read and write binary files with pointer control, use `NSFileHandle`.\
    \ For example:\n\n```\n```objc\nNSFileHandle *aReadHandle =\n[NSFileHandle fileHandleForReadingAtPath:\
    \ aPath];\nNSData *someData =\n[aReadHandle readDataOfLength: anInteger];\n//Read\
    \ more data or change the seek pointer here, as needed\n[aReadHandle closeFile];\n\
    ```\n```"
