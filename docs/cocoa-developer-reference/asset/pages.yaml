    to user actions. Scrolling to the top of NSWindow''s class reference reveals the
    Inherits from... list. This tells you that NSWindow is a subclass of NSObject,
    and also of NSResponder. It also means that NSWindow includes all the properties
    and methods of NSObject and NSResponder "for free."


    Every class that handles user messages in Cocoa is a subclass of NSResponder.
    So you can use its features to make NSWindow respond to mouse clicks. Figure 6.18
    shows the mouse event methods listed in the NSResponder class reference.


    Figure 6.18


    By subclassing NSResponder — where it''s not subclassed already — you can handle
