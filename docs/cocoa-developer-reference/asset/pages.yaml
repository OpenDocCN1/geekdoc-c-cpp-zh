- pgno: 486
  md: '# # 18 Debugging, Optimizing, and Managing Code


    Xcode includes a powerful suite of tools for profiling, testing, and debugging
    code. You can test your application in three ways:


    +   - Logging messages to the console.

    +   - Setting breakpoints, single-stepping through code and checking property
    values in a debugging window.

    +   - Using *instruments* — a collection of test tools that can report on memory
    use, thread states, application performance, object allocations, and memory leaks.


    By default, Xcode supports two different build configuration options for both
    OS X and iPhone OS projects: Release and Debug. You can select these using the
    build drop-down menu at the top left of the Xcode window, as shown in Figure 18.1.


    The Debug option creates a supporting symbol table. The Release build doesn''t
    create this table, producing a much smaller binary.


    On OS X, you can use the Release build as a final distribution version. On the
    iPhone, the default Release settings don''t create a build for the App Store;
    they simply remove the symbol table. For information about creating a valid App
    Store release build, see Chapter 19.


    # ### 18 In This Chapter


    +   - Using the console and `NSLog`

    +   - Debugging with breakpoints and the Debugger window

    +   - Using *instruments*

    +   - Managing code with Snapshots and Source Control'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# Figure 18.1


    Selecting Debug and Release builds in Xcode. You can use the default Debug build
    settings for basic debugging. For more advanced techniques, you may need to modify
    the Debug configuration by hand.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_487_0.png)


    # Using the Console and NSLog


    You’ll learn about debugging using the counter application from Chapter 8: it’s
    easy to modify but complex enough to introduce the theory and practice of profiling
    and debugging. Reload the application into Xcode, and click CounterAppDelegate.m.
    You’ll use this code as a testbed for the debugging and performance reporting
    tools built into Xcode.


    # Getting started with NSLog


    You’ve already worked with NSLog, but in this chapter you’ll use it in a structured
    way as a debugging aid. NSLog writes strings to the application’s console. The
    console is hidden in most Cocoa applications, but you can display it in Xcode
    while testing an application, and you can generate NSLog strings in the code to
    report variable values and application events.'
  merge: -1
  img_proc: true
- pgno: 488
  md: "The console is a terminal attached to `stdout`, and you can also write to it\
    \ using the many variants of `printf` and their associated formatting options.\
    \ `NSLog` is optimized to support Cocoa objects. `printf` is better suited for\
    \ logging C-language strings and values. You can use either or both in an application.\n\
    \nTo display the Console window, choose Run ➤ Console in Xcode. The window includes\
    \ a subset of Xcode’s standard toolbar and a Clear Log button that deletes the\
    \ current log. Click the Build and Run button to build and run an application\
    \ in the usual way, and click the Restart button to restart an application after\
    \ a crash. You can also click the Pause button to pause the application temporarily.\
    \ This displays a command line prompt, which you can use for command line control\
    \ of debugging and logging.\n\nThe Console window and the Debugger window, which\
    \ are described later in the chapter, are both wrappers for the underlying `gdb`\
    \ (GNU Project Debugger) debugging environment. If you’re a `gdb` expert, you\
    \ can use `gdb`’s command line options in the Console window to access `gdb`’s\
    \ advanced features.\n\n`gdb` is a complex and powerful tool with some very sophisticated\
    \ features. Xcode’s debugging features barely scratch the surface of what it can\
    \ do. But it’s a command-line oriented environment and isn’t very friendly or\
    \ accessible. You can successfully debug most applications without accessing it\
    \ directly.\n\nA full discussion of `gdb`’s features is outside the scope of this\
    \ book. Apple’s `gdb` manual is available at http://developer.apple.com/mac/library/documentation/DeveloperTools/gdb/gdb/gdb_toc.html.\n\
    \n# ## Using NSLog to report events\n\nEvent logging is the simplest of all possible\
    \ debugging options, but it can be powerful and useful, even in complex applications.\
    \ `NSLog` is simple and easy to work with. With a few edits you can automatically\
    \ generate a list of application events and create a record of the methods that\
    \ are being triggered. Use this to test that methods are being triggered when\
    \ they should be. For example, you can check that the correct method is being\
    \ triggered by a user action. Typically, the log message is added to the top of\
    \ the method, but it can also be embedded in conditional code for more selective\
    \ reporting.\n\nTo demonstrate the first option, edit the `applicationDidFinishLaunching:`\
    \ method in the App Delegate to include an `NSLog` statement:\n\n```\n```\n- (void)applicationDidFinishLaunching:\n\
    \    (NSNotification *)aNotification {\n    NSLog(@\"Application launched\");\n\
    \    TimerCount = 0;\n}\n```\n```\n\nBuild and Run the application. Figure 18.2\
    \ shows the result. The code logs a message when `applicationDidFinishLaunching:`\
    \ is triggered. In the sample application for this chapter, logging is added for\
    \ all methods so that you can monitor when they’re triggered. The date/time string\
    \ and the hex addresses are generated automatically."
  merge: -1
  img_proc: true
- pgno: 489
  md: '# Figure 18.2


    Using NSLog to report application events. Add an NSLog statement to the beginning
    of every method that you want to monitor. You can use the same technique with
    conditionals and switch statements to monitor program flow.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_489_0.png)


    # Using NSLog to report values


    You can add a format string to NSLog to report values. The format string options
    are C-standard. The format string must be "objectified" with a prefixed @ to prevent
    crashes. Table 18.1 shows a selection of useful format options.


    # Table 18.1 Useful NSLog Format Options


    | Option | Used for |

    | --- | --- |

    | %i or %d | signed int |

    | %u | unsigned int |

    | %f | float/double |

    | %x or %X | int as hexadecimal |'
  merge: -1
  img_proc: true
- pgno: 490
  md: '| Option | Used for |

    |---|---|

    | %p | memory address (similar to %x, with a standard 0x prefix) |

    | %zu | size_t |

    | %@ | object |

    | \n | new line |


    For example, to log the value of an `int` called `anInt` use:


    ```

    ```

    NSLog(@"Int value is: %i", anInt);

    ```

    ```


    When the format string doesn''t match the item to be logged, `NSLog` produces
    garbage. Technically, it attempts to read sequential memory locations and assemble
    them into a string, but the results are useless, unpredictable, or crash-prone,
    depending on the context.


    Objects are treated in a special way. The standard idiom for logging any object
    is


    ```

    ```

    NSLog(@"%@", anObject);

    ```

    ```


    Because there''s no standard format description for an object or its contents,
    different objects respond to logging requests in different ways. The default output
    is the class name and the object''s memory address:


    ```

    ```

    <ClassName: 0x123456>

    ```

    ```


    It''s sometimes useful to log addresses while debugging. If you need to check
    a selection of different object addresses and their properties, it''s easier to
    do it with Xcode''s debugging tool, which includes powerful features for viewing
    objects and their values.


    If a class implements a method called `description`, this method is triggered
    by logging, and it returns a description string. For `NSString`, this generates
    the string value. For `NSArray`, `NSDictionary`, and `NSSet`, the method attempts
    to dump the contents of the collection into a readable string. Certain image-handling
    objects also support this feature. The results may be useful or completely unhelpful,
    depending on the application.


    As a shortcut, it''s possible to pass string objects to `NSLog` directly — no
    format string is needed. This idiom generates a compiler warning but usually works
    correctly:


    ```

    ```

    NSString *aString = @"Some characters";

    NSLog(aString);

    ```

    ```


    This is only true for `NSString` objects. Other objects will cause a crash.'
  merge: -1
  img_proc: true
- pgno: 491
  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_491_0.png)


    # CAUTION


    It''s possible — rarely — to crash NSLog with strings that contain escape characters,
    especially those used for URL and network objects. You can sometimes fix this
    problem by prefixing the string with the @"%@" format specifier.


    # Using NSLog to report line numbers and function names


    Xcode defines a number of build and debug variables. You can reference them to
    report debugging information. For example,


    ```

    NSLog(@"%s %d %s", __FILE__, __LINE__, __PRETTY_FUNCTION__);

    ```


    logs the filepath of the source file, the line number in the file, and the function
    name, which is a combination of an object name and the method within the object.
    PRETTY_FUNCTION is used to improve the formatting of this feature. The sample
    code for this chapter includes an example with added newline characters to split
    the result across multiple lines. Sample output is shown in Figure 18.3.


    # Figure 18.3


    Logging, line, file, and function information. The information is listed above
    the Application launched string. In this example, extra newline characters — visible
    in the code window — have been added to improve the formatting.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_491_1.png)'
  merge: -1
