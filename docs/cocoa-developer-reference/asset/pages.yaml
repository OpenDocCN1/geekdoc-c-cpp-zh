- pgno: 274
  md: "string can be stored in a separate string constant. To combine part strings\
    \ into a complete string, you can use the `[NSString stringWithFormat:]` method\
    \ to concatenate a series of input strings. The exact code appears later in the\
    \ complete code listing.\n\nThe long URL is more of a challenge. Looking at the\
    \ format, you can see that it uses *escaped characters*. A space is converted\
    \ into %20, a colon into %3A, and so on. This is a standard requirement for many\
    \ APIs, because it eliminates ambiguity and guarantees that the server can read\
    \ the URL correctly.\n\nCocoa — or rather, Core Foundation — includes a function\
    \ that converts that string into its escaped equivalent. The function is slightly\
    \ tricky to set up, but the following code works as a boilerplate method that\
    \ you can drop into any code to convert a string into an escaped string:\n\n```\n\
    ```\n- (NSString *)urlEncodeValue:(NSString *)str\n{\n    NSString *escapedURL\
    \ = (NSString *)\n    CFURLCreateStringByAddingPercentEscapes (kCFAllocatorDefault,\n\
    \    (CFStringRef)str, NULL, CFSTR(\"~:/?#[]@!$&'()*+,;=\\\\\\\"\"\"),\n    kCFStringEncodingUTF8);\n\
    \    return escapedURL;\n}\n```\n```\n\nThe characters after `CFSTR` are automatically\
    \ replaced with their escaped equivalents in the return string. You can add more\
    \ characters to this list if you need to, but this standard selection handles\
    \ most requirements.\n\nFinally, after the string processing, you need to convert\
    \ the finished long URL string into a URL object. This is easy: you can use the\
    \ `[NSURL URLWithString:]` method to return the equivalent URL object.\n\n# ##\
    \ Sending the URL request and processing the return\n\nThere are various ways\
    \ to send a URL request. At this point, Apple’s NSURL documentation can be more\
    \ confusing than helpful. It suggests using various auxiliary URL connection and\
    \ response objects.\n\nIn fact, there’s a single line solution. For a simple Web\
    \ transaction, the easiest option is to use the `stringWithContentsOfURL:` method\
    \ built into NSString. It returns a string object:\n\n```\n```\ntheReturnString\
    \ = [NSString stringWithContentsOfURL: aURL\n           encoding: NSUTF8StringEncoding\
    \ error: nil];\n```\n```\n\nThis single line of code is extremely powerful. It\
    \ sends the URL request to a remote server, waits for a response, and downloads\
    \ the return data into a waiting string object. If the request fails, the return\
    \ string is `nil`. But if you set up your URL request correctly, this line of\
    \ code is all you need to retrieve a shortened URL. The finished code shown here\
    \ copies the return to the return field in the view — and you’re done.\n\n```\n\
    ```\n@synthesize window, sourceURL, bitlyURL;\nNSURL *thisURL;\n```\n```"
