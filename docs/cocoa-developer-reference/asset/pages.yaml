- pgno: 335
  md: 'Bindings are typically used in two ways:


    +   - **In a simple application, they can take the place of outlets.** UI objects
    can be automatically connected to code objects without declaring any `IBOutlet`s
    or linking them in IB. The binding links the two objects with optional added intelligence.
    For example, a text field can display a number value automatically, without explicit
    conversion.

    +   - **In a more complex application, bindings are used as data pipes that synchronize
    blocks of data.** Bindings can synchronize arrays, dictionaries, and other complex
    data types; for example, a drop-down list can be populated automatically by binding
    it to a data source. For even more usefully, they can synchronize the *editing*
    of data, making it possible to add, update, and remove data with a simplified
    UI and minimal supporting code.


    Confusion arises because the Apple documentation implies that bindings require
    controller objects, specifically `NSObjectController`, `NSArrayController`, `NSDictionaryController`,
    `NSTreeController`, and `NSUserDefaultsController`.


    *You can use bindings without these objects.* You can bind any object to any other
    as long as they both support KVC and KVO. For simple applications, adding a controller
    adds an unnecessary layer of confusion and complication. Table 13.1 summarizes
    other common misunderstandings about bindings.


    **Table 13.1 Facts and Fiction about Bindings**


    | Fiction | Fact |

    |---|---|

    | Bindings require a controller object. | You can use bindings without a controller.
    |

    | Bindings “just work.” | Bindings work as long as you always access values through
    accessor methods and bind compatible objects to each other. Simple assignments
    don’t trigger the KVO mechanism. |

    | Bindings are always two-way. | Some bindings are read-only. Displayed values
    may not be editable. |

    | Bindings are designed to work with Interface Builder. | You can create bindings
    programmatically without using IB. |

    | Bindings eliminate unnecessary code. | Bindings can eliminate pages of code
    in larger projects. For smaller projects where bindings are used in an outlet-like
    way, the benefits may be less obvious. |


    # Getting started with bindings


    To use bindings successfully, keep these requirements in mind:


    +   - **Bindings work with object properties.** You can’t bind to a private variable.

    +   - **Bindings rely on KVO.** All properties and assignments must be KVO-compliant.'
