    TheView is a subclass of NSView and includes the code shown below. When the user
    clicks the mouse, the mouseDown: handler reads the position and moves the button
    to the click position. Without an animator, the position of the button changes
    instantly. With an animator, the button glides between the old and new positions.


    The code is straightforward. As in the previous example, an offset term corrects
    for the lower-left frame origin of the button; otherwise, the code reads the window
    coordinates of the mouse click, corrects for the offset, and sets the button’s
    position with the animator.


    ```

