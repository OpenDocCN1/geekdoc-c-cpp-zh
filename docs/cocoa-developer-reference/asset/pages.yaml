- pgno: 508
  md: 'Xcode supports two source control features. *Snapshots* provide a simple and
    quick way to save and restore project states. *Source Control* provides a much
    more sophisticated toolset for managing projects, collaborating on projects with
    other developers, logging changes, comparing files, and so on. You can also copy
    project folders manually by using Finder.


    # ## Copying projects and creating snapshot versions manually


    As explained in Chapter 4, it''s not always possible to copy or move a default
    project without breaking it. Figure 18.19 illustrates why. Right-click any group
    in the Groups & Files pane and select Get Info and the General tab. You''ll see
    the dialog in Figure 18.19.


    **Figure 18.19**

    Selecting group path types. To create a portable project, every element in the
    project must have a path type relative to the project or to the enclosing group.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_508_0.png)'
  merge: -1
  img_proc: true
- pgno: 509
  md: 'Xcode’s symbolic links are defined relative to a path anchor. The path type
    defines the path anchor, which is one of the following:


    +   - The enclosing group

    +   - The project folder

    +   - An absolute filepath

    +   - The build product path

    +   - The Xcode folder

    +   - The current SDK folder


    Some options are relative, while others are absolute. If you copy or move a project
    with absolute paths, the symbolic links will point to items that are no longer
    available.


    Conversely, when you set up project path types correctly, you can


    +   - Make the project available for download on a Web site.

    +   - Use Finder to make snapshot copies of each version as the project evolves,
    while keeping old versions as a backup by duplicating the project folder and giving
    it a new name.

    +   - Make backup copies to a different disk or different Mac. You can also build
    them in place, if you need to.


    The safest option is to define every path relative to the project folder or to
    an enclosing group. There is no easy way to do this globally in Xcode. The most
    efficient solution is to select every item in a group and use the dialog in Figure
    18.19 to change the path type. Repeat this for every group. The group “folders”
    have an equivalent path specification, so you must set their path types, too.


    When you create a new item or add an existing project, remember to set the path
    specification in the drop-down menu in the equivalent dialog, shown in Figure
    18.20. You must do this because, by default, Xcode makes all paths relative to
    the Xcode folder—which is wrong.


    Forgetting to change this setting can literally have disastrous consequences if
    you copy or move a project folder. Xcode allows you to edit the file in an old
    project while ignoring the new copy. This can trash an old project as you make
    no progress on a new one.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_509_0.png)


    # CAUTION


    Xcode sometimes gets its links confused, creating a perplexing bug. Edits to a
    modified file appear to be ignored, while the symbolic links appear to be correct.
    Typically the compiler can’t find new object and method definitions, even when
    they’re in the code. When this happens, check that the links aren’t broken and
    that Xcode isn’t editing a file in a different folder or project.'
  merge: -1
  img_proc: true
- pgno: 510
  md: '**Figure 18.20**


    Don''t forget to select the group path types when creating or adding files. The
    default anchors items to a fixed path, which is not a helpful feature.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_510_0.png)


    # ## Using Snapshots


    Xcode includes an automated Snapshots tool for simple version management. The
    tool is simple but effective, and it is very easy to use. To experiment with it,
    create a new blank project in Xcode. Give it any name. Choose File▸Make Snapshot
    to save the initial state of the project.


    In the code editor, add one or more lines of new code; for example, a new NSLog
    message. Make another snapshot to save the new state of the project. Choose File▸Snapshots
    to open the Snapshots window, shown in Figure 18.21.'
  merge: -1
  img_proc: true
