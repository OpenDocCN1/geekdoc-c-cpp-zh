    # Setting Classes and Subclasses


    Now that we’ve had a tour of Interface Builder, we can return to the problem at
    the end of the previous chapter where we successfully subclassed NSWindow, but
    discovered it wasn’t responding to messages.


    Under the menu tree is an object called Window (First). Window (First) is an instance
    of NSWindow — this is why the subclass of NSWindow we created in the previous
    chapter does nothing. The nib file is still loading an instance of NSWindow, and
    our new subclass is being ignored.


    Interface Builder includes an option for changing the class of an object. Click
    on it in the Doc Window to highlight it, and click the right-most tab in the Inspector
    window — it shows the letter “i” inside a circle. The top-most pane is called
    the Class Identity pane. It includes a drop-down menu with a list of all the classes
    used in the project. Click on the drop-down menu to see a list of compatible classes,
    and select FirstNewWindow, as shown in Figure 7.18. This releases the window as
    an instance of our new subclass, adding the newly defined features to the object.'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'When you create a subclass in code, you **must** subclass the corresponding
    object in any nib file that references it. If you don’t, the application loads
    the original unmodified class, and your code is ignored. I illustrated this feature
    early on because it can be one of the more puzzling and confusing features of
    Cocoa application design.


