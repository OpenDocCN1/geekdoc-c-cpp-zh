- pgno: 221
  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_221_0.png)


    # TIP


    The easiest way to find worked solutions for difficult or inconsistent objects
    is to look for them online. Developer discussions often mention these gotchas.
    Finding a worked solution can save you hours of frustration.


    With more advanced techniques, you can use UI objects in more flexible and elegant
    ways, creating simple and powerful interfaces with minimal code.


    # Using loose typing and (id) sender


    Objective-C supports an open, generic placeholder pointer type named `id`. Use
    `id` in parameter lists and method returns when the type isn’t defined until runtime
    or when the same method must handle different object types. For example:


    ```

    ```objc

    - (AClass *) thisMethodDoesSomething: (id) aParameter;

    ```

    ```


    aParameter can be of any data type. `id` is a catch-all pointer type, and it tells
    the compiler that the pointer points to . . . something. This is often used in
    UI event handlers.


    ```

    ```objc

    - (void) handleAnEvent: (id) sender;

    ```

    ```


    `sender` is the object that triggered the event. It can be any type of object:
    a button, switch, slider, and so on. Many Cocoa objects are designed with `id`
    in their signature because it would be unwieldy to create different subclasses
    and methods for every possible supported object in the signature.


    `id` is typically used in four ways:


    +   - **Case 1:** As a placeholder pointer when the type doesn’t matter; for example,
    when a method saves a pointer to an object but doesn’t need to access its features.

    +   - **Case 2:** Where a Cocoa object uses `id` in a parameter or return field,
    but the application is deliberately limited to ensure that only certain types
    are used.

    +   - **Case 3:** When the type must be discovered explicitly at runtime.

    +   - **Case 4:** For direct object identification.


    # Using id with data collections


    In Case 1, Cocoa’s data collection objects — `NSArray`, `NSSet`, `NSDictionary`
    — implicitly save pointers of the `id` type. You can load any slot in a data collection
    with any kind of object, mixing them as needed. This makes collections very flexible
    and powerful. The same array can store numbers, strings, standard Cocoa objects,
    and custom objects, and move them between entries as needed without restriction.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_221_1.png)


    # NOTE


    You can use the `id` data type in your own methods. It’s a generic data type.
    Although it’s often used with a sender parameter, it has other possible applications.'
  merge: -1
  img_proc: true
- pgno: 222
  md: "# Using (id) sender with casts\n\nIn Case 2, objects must be “re-typed” with\
    \ a cast before their properties can be accessed. For example:\n\n```\n- (void)\
    \ anActionMethod: (id) sender {\n    aButton = (NSButton *) sender; //Assume sender\
    \ is an NSButton\n    something = aButton.aProperty; //Access a property\n   \
    \ ...\n}\n```\n\nThis is a standard idiom in event handler methods. Use it when\
    \ you are sure that, for example, aParameter is an NSButton. You can guarantee\
    \ this by linking the interface in IB so that only NSButton objects trigger a\
    \ Method:. Do not use it when sender’s type is not fixed.\n\nThis idiom is necessary\
    \ because the id type doesn’t support property accessors. The following isn’t\
    \ valid because the compiler doesn’t know which properties are valid for an id\
    \ type:\n\n```\n    something = sender.aProperty;\n```\n\nThe cast gives the compiler\
    \ this information.\n\n# Using (id) sender with class checking\n\nIn Case 3, Objective-C\
    \ supports a Class data type for classes, and you can use it to read a class name\
    \ at runtime. Classes are managed with a predefined Class type. You can discover\
    \ a class with\n\n```\n    Class thisIsAClass = [sender class];\n```\n\nYou can\
    \ also convert the class name to a string for listing or testing with\n\n```\n\
    \    NSString *aString = NSStringFromClass([sender class]);\n```\n\nThis is sometimes\
    \ useful for debugging. But you don’t need to check class names as strings because\
    \ you can compare them directly. To run code according to the class of an object,\
    \ use the following:\n\n```\n//Check for an exact match\nif ([anObject isMemberOfClass:\
    \ [className class]])\n    {doSomething...\n//Check for a match while also checking\
    \ inheritance\nif ([anObject isKindOfClass: [className class]])\n    {doSomethingElse...\n\
    ```\n\nThe first conditional returns TRUE if and only if anObject is an instance\
    \ of className. The match must be exact. The second returns TRUE if anObject is\
    \ a subclass of className. For example, all Cocoa objects are subclasses of NSObject,\
    \ so setting className to NSObject always returns TRUE.\n\nYou can use these conditionals\
    \ to select code according to an object’s class at runtime. This is a more complex\
    \ solution than Case 2, shown previously, but it can support a much wider range\
    \ of objects."
  merge: -1
  img_proc: true
- pgno: 223
  md: "Potentially, you can create a single method to handle every possible event\
    \ from an interface. This solution won't be simple or elegant, but it is possible\
    \ to do this. More typically, you can use class checking in a switch to select\
    \ handler code for a small number of different sender types.\n\n# ### Using (id)\
    \ sender to identify objects\n\nIn Case 4, you can use the value of sender directly,\
    \ in a direct comparison to identify the object that triggered an event. For example,\
    \ your application might have three objects in its UI:\n\n```\n```objc\n@property\
    \ (assign) IBOutlet NSButtonCell *firstButton;\n@property (assign) IBOutlet NSButtonCell\
    \ *secondButton;\n@property (assign) IBOutlet NSTextField *firstTextField;\n```\n\
    ```\n\nYou can link all of these objects to a single handler method, and use a\
    \ pointer comparison to discover which object triggered the event.\n\n```\n```objc\n\
    -(void) eventHandler: (id) sender {\n    if (sender == firstButton) {\n      \
    \  //First button was clicked\n    }\n    if (sender == secondButton) {\n    \
    \    //Second button was clicked\n    }\n\n    if (sender == firstTextField) {\n\
    \        //The text field did something\n    }\n\n    //Etc...\n}\n```\n```\n\n\
    This code is inherently loosely typed, and it is valid for all objects. It's particularly\
    \ useful for UIs with multiple text fields.\n\n# ### Placing outlets and actions\n\
    \nA standard problem in UI design is deciding which object to link to. The simple\
    \ example in this chapter is built around a single subclassed object — the app\
    \ delegate. This minimal design is perfect for applications with a single view.\
    \ You can implement menu and other event handlers in the delegate without creating\
    \ further objects. This is somewhat nonstandard, but it's a simple solution and\
    \ works.\n\nIn a more complex application, there may be many nib files, each with\
    \ many objects. When designing multi-view UIs, you must do the following:\n\n\
    +   1. Define how objects send messages to each other.\n+   2. Create links for\
    \ those messages."
  merge: -1
  img_proc: true
- pgno: 224
  md: 'A key limitation of the nib editing system is that you cannot drag links between
    nib files. IB’s interface doesn’t support this. But the First Responder object
    is designed to offer a workaround for action linking.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_224_0.png)


    # NOTE


    There’s no way to link outlets across multiple nib files because the requirement
    doesn’t make sense. Outlets are associated with a single object, which is in turn
    associated with a single nib file. Typically, all outlets in a nib are linked
    to File’s Owner or, occasionally, to a delegate object.


    When you create an action method in any object in the application, it’s added
    to the responder chain. When you click First Responder, you’ll see a list of receive
    action methods. This list includes all the action methods in the application,
    collected from every object. You can link to these actions in the usual way—and
    this solves the cross-linking problem.


    Figure 8.21 illustrates this with an example from an iPhone application. The `showZetta`
    and `showInfo:` methods are in different objects, but both appear as linking destinations
    inside First Responder. When an application has multiple nibs, the same list of
    First Responder methods appears in all of them.


    # Figure 8.21


    Using First Responder to view all of the action methods in an application. You
    can use this feature to send messages to objects that aren’t in the current nib.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_224_1.png)'
  merge: -1
  img_proc: true
- pgno: 225
  md: '**CAUTION**

    First Responder doesn''t indicate if a method is already linked directly as a
    selector. You can easily create multiple links to the same methods. This may not
    be a problem in your application, but it can be useful to double-check whether
    or not a method is already linked within an object before trying to link it again
    in First Responder.


    # Placing NSResponder events in OS X


    First Responder also supports a very long list of standard methods that can be
    used in every application and which are supported by many objects. These are defined
    in the documentation for NSResponder, which was introduced in Chapter 6.


    To implement these methods, follow this two-step process:


    +   1. Link a suitable object to them, so that they''re triggered by a user action.
    The menu items in the default menu are prelinked to some of the methods for convenience.

    +   2. Implement a handler method in a suitable object in the application. For
    example, to implement undo events, create a method called undo:. You can place
    the method in any object that is a subclass of NSResponder.


    # Using standard event messages on the iPhone


    The iPhone supports a simplified version of NSResponder, with a smaller selection
    of standard messages. It also supports a modified selector system, which generates
    yet another list of messages. Instead of a single blank selector slot triggered
    by a click, iPhone objects respond to different user actions with different event
    messages. Figure 8.22 shows the standard event list. This list is available for
    most objects, but is implemented differently in different objects. For example,
    a button doesn''t send the Value Changed message, but a slider does; a text field
    doesn''t send Touch Down, but it does send Editing Did Begin; and so on.


    This is a refinement of the selector system; you can define different handlers
    for different event types and for objects within them, but in practice it works
    in a similar way. Link each event to the method in your code that it handles.
    To ignore an event type, leave it unlinked.'
  merge: -1
  img_proc: true
