    # ## Developing for fun


    Not everyone develops professionally, and Cocoa is a rewarding environment for
    creative media projects. Its features include powerful support for graphics, video,
    and sound. Adventurous developers who are familiar with accessible Web-centric
    languages such as Flash and JavaScript are finding Cocoa and Objective-C a natural
    next step.


    Cocoa applications can only run on a Mac. There is no Web-based version of Cocoa,
    so you can’t use Cocoa to create Web graphics. But you can use it to create custom
    plug-ins for professional media applications; to process graphic, video, and sound
    files in imaginative ways; and to produce printable ultrahigh-resolution graphics
    that would be difficult to create in other environments.


    Cocoa isn’t as accessible as Flash, Java, or a simplified “toy” language like
    Processing. It’s also not as easy to master as a media construction kit such as
    Cycling 74’s Max/MSP/Jitter product or the Pure Data open-source equivalent, shown
    in Figure 1.8. If you need a simple and clean but limited environment, Cocoa may
    not be ideal for you.


    Cocoa and Objective-C come into their own when you reach the limits of these environments
    and begin to explore more complex possibilities. Objective-C is ideal for structured
    programming of all kinds, including media applications, and the distance between
    coding in ActionScript and coding in Objective-C and Cocoa is much smaller than
    the distance between writing code and not coding at all.


    While Objective-C is still seen by some as “real” programming, and Flash, PHP,
    JavaScript, and Perl are considered simpler and less demanding, the distinction
    is superficial and misleading. As Apple begins to move beyond the desktop/laptop
    model into new kinds of computing, these technologies will start to collide in
    interesting and creative ways. Developers who are familiar with all of these environments
    will have a creative and perhaps professional advantage over those who are less
    adventurous.'
