    The single form example saves and loads a record in this one form. You can easily
    extend the code to support multiple forms.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_327_0.png)


    Because `NSCoder` works recursively, it’s almost trivial to extend this example
    to support multiple forms. Add another data class that uses an array or dictionary
    to hold multiple records, and then implement custom `NSCoder` methods to support
    archiving for the class. Run the archiving methods on your new composite class
    to save all records into a single file. With some additions to the UI, you can
    build a useful card index application with very little effort, adding optional
    search and listing features using the enumeration, sorting, and search features
    built into `NSArray` and `NSDictionary`.


    **TIP**

    For an alternative card index application, see Chapter 14.'
