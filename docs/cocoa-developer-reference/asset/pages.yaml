- pgno: 356
  md: "**Figure 13.18**  \nBinding to the Controller Content property of the controller,\
    \ so that it uses the `runningApps` array as a data source\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_356_0.png)\n\
    \n# Reading data from the controller into a view\n\nReading translated data from\
    \ the controller is more difficult. Instead of following through with the Controller\
    \ Content metaphor, this side of the process uses different properties. Effectively,\
    \ you’re going to look inside the Controller Content object and pull out various\
    \ slices through the data.\n\nThe first — critical — point is that it’s only possible\
    \ to pull data out of the array if its objects support key-value property access.\
    \ Figure 13.19 shows a log of the contents of the `runningApps` array. Usually,\
    \ this array is a collection of dictionary objects, one for each running app.\
    \ It’s easy to pick out the relevant keys from the log; for example, `NSApplicationName`\
    \ is the application name. However, not all objects support this kind of access.\
    \ If they don’t, you can’t use bindings to display their data."
