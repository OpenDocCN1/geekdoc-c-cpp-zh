  md: "```\n```objc\n*outError = [NSError errorWithDomain:NSOSStatusErrorDomain\n\
    \    code:unimpErr userInfo:NULL];\n}\nreturn YES; // Or NO if there was a problem\n\
    }\n@end\n```\n```\n\nWhen an application uses the document-based template, the\
    \ Open Recent feature is implemented automatically. When you choose **File > Open\
    \ Recent**, the application calls the same open code defined previously.\n\n#\
    \ Printing documents\n\nThe easy way to print a document is to design your document\
    \ with a container view, and then override the `printDocument:` method in `NSDocument`\
    \ with a custom call to `print:`.\n\n```\n```objc\n- (void) printDocument: (id)\
    \ sender {\n    [theContentView print: nil];\n}\n```\n```\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_414_0.png)\n\
    \n**NOTE**  \n`print:` takes a nominal `(id) sender` parameter but ignores it.\n\
    \nThis launches the default print dialog, manages automatic pagination and margins,\
    \ and runs the print job for you with very little code. You can also render a\
    \ document to a single off-screen view and run `print:` on the view. The default\
    \ printer is the standard OS X printer, and it implements a print-to-PDF feature.\n\
    \nOccasionally you may need to print a document the hard way. Customized printing\
    \ gives you control over pagination, margins, and page scaling, and supports very\
    \ long documents with unlimited pages.\n\nA complete customized printing solution\
    \ can be moderately complex. The core print operation code looks like this:\n\n\
    ```\n```objc\nNSPrintInfo *printInfo;\nNSPrintOperation *printOp;\nprintOp = [NSPrintOperation\
    \ printOperationWithView: viewToPrint\n                                      printInfo:\
    \ [self printInfo]];\n[printOp setShowPanels: NO]; // Optional\n[printOp runOperation];\n\
    ```\n```\n\nThe `printInfo` object stores information about margins, paper size,\
    \ orientation, and pagination. For example, you can set the pagination to clip,\
    \ scale/fit in either dimension, or automatically create a column of pages."
  merge: -1
  img_proc: true
- pgno: 415
  md: "Selecting `[self printInfo]` displays a panel that enables the user to define\
    \ the print options. You can disable this feature by setting `showPanels` to NO.\n\
    \nTo create manual pagination, implement two methods in your printable view:\n\
    \n```\n− (BOOL) knowsPageRange : (NSRange *) theRange {\n    theRange -> location\
    \ = 1;\n    theRange -> length = <estimate number of pages here>\n    return YES;\n\
    }\n\n− (NSRect) rectForPage : (int) page {\n    return <page rect calculated for\
    \ a given page number>\n}\n```\n\ntheRange is a pointer to a range struct, which\
    \ is passed when the method is called and contains returned values when the method\
    \ completes.\n\nCalculating the rect to return may require information about the\
    \ paper size, required margins, scaling and optional borders, crop marks, page\
    \ numbers, header and footer strings, and so on. There is no general solution;\
    \ each application has different requirements. For very long documents, you can\
    \ use a single rect as a buffer, and render the content for each page with `drawRect:`.\n\
    \n# Using NSUndoManager\n\nThe text view in the MultiDocument project implements\
    \ undo automatically. This is a feature of the text view, and not the document.\
    \ To implement a full undo solution, you need to add extra code to every editing\
    \ operation.\n\n`NSDocument` supports an `NSUndoManager` class that can maintain\
    \ a separate undo/redo stack for each document. If you initialize the undo manager\
    \ correctly before each edit, this stack is managed automatically for multiple\
    \ levels of undo and redo.\n\nTo get a pointer to a document’s undo manager, use\n\
    \n```\nNSUndoManager *theManager = [self undoManager];\n```\n\nThere are two ways\
    \ to implement undo. For simple operations, you can set the target/action that\
    \ the undo will perform, and the object that the undo will perform it on.\n\n\
    ```\n[undoManager\n    registerUndoWithTarget: targetObject\n                \
    \       selector: @selector(methodToImplementTheUndo:)\n                     \
    \  object: objectThatWillBeRestored];\n```"
  merge: -1
  img_proc: true
- pgno: 416
  md: "targetObject is usually self. When the user selects Undo, the result is\n\n\
    ```\n```text\n[targetObject methodToImplementUndo: objectThatWillBeRestored];\n\
    ```\n```\n\nYour code must implement the method and manage the object in a way\
    \ that creates the undo. It's possible, with some effort, to create edit methods\
    \ that embed this code and store the old pre-edit value in the object. This is\
    \ a good solution for simple objects, but it can become unwieldy for complex multiple\
    \ edits.\n\nIf object is a complex composite object such as a video sequence,\
    \ it’s impractical to save a backup copy of the complete object for each undo\
    \ step. An alternative undo technique uses a class called NSInvocation, which\
    \ stores a complete message including the target object, the message sent, and\
    \ all parameters.\n\n```\n```text\n[[undoManager prepareWithInvocationTarget:\
    \ targetObject]\n                         aMethod: undoParameters];\n```\n```\n\
    \nAgain, targetObject is usually self. When the user selects Undo, the result\
    \ is\n\n```\n```text\n[targetObject aMethod: undoParameters];\n```\n```\n\nTypically\
    \ before each edit, you create an invocation that restores the pre-edit values\
    \ of the parameter or property that is about to be changed. Alternatively, you\
    \ can create an invocation that does the opposite of some edits; for example,\
    \ decreasing a value that has just been increased.\n\nFor a complex edit, the\
    \ undo parameters are likely to include arrays and dictionaries of previous values.\
    \ Implementing a complete undo solution for every possible edit in an application\
    \ requires significant extra code.\n\n# Localizing Applications\n\nFor commercial\
    \ projects, you can improve sales by adding multi-language support. Supporting\
    \ multiple languages is known as localization and is implemented in two complementary\
    \ ways: localized nib files and localized strings.\n\n# Creating a localized nib\
    \ file\n\nRight-click a nib file and select Get Info. Select the General tab if\
    \ it isn’t already selected. Select Add Localization at the bottom left of the\
    \ window, and pick a language from the drop-down list in the sheet that appears\
    \ at the top of the window, as shown in Figure 15.11."
