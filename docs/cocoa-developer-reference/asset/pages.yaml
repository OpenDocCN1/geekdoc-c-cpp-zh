- pgno: 128
  md: "**Figure 5.6**\n\nA close-up of the `NSButton` class reference showing subclassing\
    \ and inheritance information\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_128_0.png)\n\
    \n# ### Subclasses, superclasses, and the root class\n\n`NSObject` is Cocoa’s\
    \ root class. When you create a subclass, the original class is known as the *superclass*.\
    \ You can send messages from any object to its superclass using the `super` variable.\
    \ `super` isn’t a separate object. It’s used to “unoverride” method names, accessing\
    \ the unmodified and unextended originals. For example, if your subclass `NSView`\
    \ and call `[super drawRect:...]` your code runs the original unmodified `drawRect:`\
    \ method. This is more of an illustrative example than a useful one, but the same\
    \ technique can be used to run unmodified methods in objects that have useful\
    \ features. `super` is often used in `init` methods, described in Chapter 7.\n\
    \n# # Creating classes\n\nClass definitions are split across two files — a header\
    \ file with a `.h` extension and a code file with a `.m` extension. The header\
    \ is called the *interface*. It declares the methods and properties that are visible\
    \ to other objects. The code file holds the *implementation* — the code that runs\
    \ when each method is triggered. The implementation can also contain private variables\
    \ and methods that are invisible to other objects. A feature is only public if\
    \ it appears in both files.\n\n> **TIP**\n> \n> As you’ll see in Chapter 6, Xcode\
    \ makes it easy to create new classes with a selection of default templates. You\
    \ don’t have to type in the contents of the interface and implementation files\
    \ from scratch — you can start with a template file and modify it.\n\n# ## Defining\
    \ a class interface\n\nThe contents of an interface file are organized like this:\n\
    \n```\n```objective-c\n#import <any required headers>\n@interface MyNewClass :\
    \ NSObject <protocols>{\n(a list of instance variables)\n```\n```"
  merge: -1
  img_proc: true
- pgno: 129
  md: "```\n}\n(a list of public properties prefixed with @property\n    declarations)\n\
    (a list of public methods that can be accessed by other objects...)\n(a list of\
    \ public setter and getter methods, if used)\n@end\n```\n\nThe @interface directive\
    \ tells Objective-C that the following lines define the class interface. The rest\
    \ of the line includes the name for the class, which can be any unique string\
    \ followed by the name of the superclass from which it inherits features.\n\n\
    In words, this line tells Objective-C to create a new class called *MyNewClass*,\
    \ copying methods and properties from NSObject. To subclass a different class,\
    \ replace NSObject. For example, the following substitutes NSView:\n\n```\n@interface\
    \ MyNewViewClass : NSView <protocols>{...\n```\n\n> **NOTE**\n> \n> The protocols\
    \ field includes one or more named bundles of optional methods that can be used\
    \ in the class. A protocol is a simple complex form of import/include. Protocols\
    \ are used as a quick way to import groups of related methods to a class. They’re\
    \ optional, but many Cocoa objects use them. For some examples, see Chapter 6.\n\
    \nInstance variables, also known as *ivars*, can be objects with pointers or standard\
    \ C data types. For example:\n\n```\n{\n    NSView *aView;       //This is a pointer\
    \ to a view\n    int numberOfGiraffes; //This is a standard C int\n}\n```\n\n\
    The list of properties between the curly brackets defines private internal variables.\
    \ To expose them to other objects, the property names must be prefixed with a\
    \ @property directive.\n\n```\n@property (nonatomic, retain) NSView *aView; //aView\
    \ can be\n    public\n```\n\n> **NOTE**\n> \n> `(nonatomic, retain)` defines the\
    \ memory management options for properties that are objects. C data types don’t\
    \ require this extra information. For more information, see Chapter 12.\n\nThe\
    \ methods list defines every public method that can be triggered by other objects.\
    \ For example:\n\n```\n- (void) thisISAMethod;\n//This is a method with no return\
    \ value and no parameters\n- (NSValue *) thisIsAnotherMethod: (int) aNumber;\n\
    //This is a method that returns an instance of NSValue and takes\n    an int as\
    \ a parameter\n```"
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Methods are listed as signatures — one-line summaries that list the type, output
    type, name, and parameters used in the method. Signatures end with a semicolon.
    They do not include implementation code.


    In both the interface and implementation files, Objective-C uses the – character
    as a prefix for instance method definitions and + as a prefix for class method
    definitions.


    ```

    ```

    - (void) thisIsAnInstanceMethod;

    + (void) thisIsAClassMethod;

    ```

    ```


    # ## Defining accessors: setters and getters


    In Objective-C, properties are private and invisible unless setter and getter
    methods are defined for them. Setters write values; getters read them. Properties
    can allow either or both modes of access. You can define setters and getters explicitly
    with code, or implicitly using the @synthesize directive.


    Use @synthesize to generate the setters and getters required for simple read and
    write operations. The directive works rather like a macro, and it creates setter
    and getter code automatically. It also implements dot-format property access.


    ```

    ```

    anInt = anObject.numberOfElephants;

    anObject.numberOfWheels = 5;

    ```

    ```


    This syntax is common in other languages. In Objective-C, it is only valid if
    the properties are synthesized.


    Use explicit setter and getter code when reading or writing a property triggers
    a more complex outcome, such as a change in the state of an object or an operation
    that accesses other properties and features. For example, a setter can automatically
    redraw visible graphics when a window''s size is changed, or a getter can count
    the number of times a property has been accessed and write the count to another
    property.


    By convention, getter method names are identical to the name of the property they
    access, while setters prefix the name with set. Define setters and getters in
    the interface as follows:


    ```

    ```

    - (int) numberOfElephants; //A getter for the numberOfElephants property

    - (void) setNumberOfWheels: (int) aNumber; //A setter for the numberOfWheels property

    ```

    ```


    To use them, the syntax is


    ```

    ```

    anInt = [anObject numberOfElephants];

    [anObject setNumberOfWheels: 5];

    ```

    ```


    The compiler doesn''t enforce this naming convention, but it''s used in Cocoa
    and it helps make the code easy to read. There are no restrictions on the complexity
    of setter and getter code. If necessary, a single setter method can dramatically
    change the state of the entire application.'
