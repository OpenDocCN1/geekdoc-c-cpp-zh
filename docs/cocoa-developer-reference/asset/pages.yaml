- pgno: 132
  md: "This runs the `@synthesize` feature on the four listed properties and generates\
    \ setter and getter code for them. You can then use dot syntax or conventional\
    \ method code to access these properties from the other objects.\n\n```\naValue\
    \ = [thisObject aProperty];  //Using a synthesized getter\naValue = thisObject.aProperty;\
    \ //Identical code using dot syntax\n\n[thisObject aProperty: 5]; //Using a synthesized\
    \ setter\nthisObject.aProperty = 5; //Identical code using dot syntax\n```\n\n\
    # Defining public properties\n\nTo summarize, you must do three things to create\
    \ a property that can be accessed by other objects:\n\n+   1. **Include it in\
    \ the list of ivars in the interface.**\n+   2. **Declare it again as a `@property`\
    \ in the interface.**\n+   3. **Add an explicit setter/getter method or `@synthesize`\
    \ the property in the implementation.**\n\nAll three steps are obligatory. If\
    \ you skip one, the build will fail or the application may crash. If you change\
    \ a property name, you must change it in all three places.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_132_0.png)\n\
    \n**TIP**\n\nIt can be difficult to keep these three steps in mind when concentrating\
    \ on the rest of the code, so it’s helpful to use this summary as a checklist.\
    \ The three steps eventually begin to become automatic, but forgetting a step\
    \ remains a popular and common error.\n\n# Defining public methods\n\nTo define\
    \ a public method, follow these four steps:\n\n+   1. **Declare the signature\
    \ in the interface.** The signature includes the class/instance type, return type,\
    \ name, and parameter list. End with a semicolon.\n+   2. **Copy the signature\
    \ to the implementation file.**\n+   3. **Replace the semicolon with an opening\
    \ curly bracket.**\n+   4. **Add implementation code and close the curly bracket.**\n\
    \nFor example, the following code completely defines a method called `thisMethodDoesNothing`:\n\
    \n```\n- (void) thisMethodDoesNothing; //Add this line to the method\n    list\
    \ in the interface\n```"
