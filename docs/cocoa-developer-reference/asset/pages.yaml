- pgno: 55
  md: '# Question-response messaging and delegation


    You don’t need to remember the preceding list. The simplest way to understand
    messaging is as a question-response dialogue. OS X uses the question-response
    design pattern, shown in Figure 2.6, to implement application features. When OS
    X sends a message to your application, it’s asking a question. Your application
    can choose to ignore the question or it can respond with a behavior, with data,
    or both. Questions are answered by including handler methods for possible messages.
    Messages without an associated handler method are ignored.


    # Figure 2.6


    Question-response messaging. This slightly fanciful view of messaging is a useful
    and accessible mental model of the relationship between an application and its
    OS X environment.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_55_0.png)


    OS X sees every application as a list of disconnected message handlers. It doesn’t
    begin at the beginning of an application and execute the handlers in order. Instead
    it calls each handler when it needs to. The order in which the handlers appear
    in your code doesn’t matter. It’s important that a handler exists, and it’s useful
    to keep related handlers close together for clarity and to make the code easier
    to maintain. But if you put all of an application’s handler methods in a single
    long file in a random order, the application would still work.


    If you have experience with Flash or JavaScript, you’ll understand how `onLoad`
    and `onClick` messages are sent and processed asynchronously. OS X takes the same
    principle much further by keeping track of a list of the objects used in an application
    and sending messages accordingly. This can generate a truly vast number of possible
    messages for hundreds or thousands of possible events and circumstances.


    Some messages can be ignored, while others are obligatory. If you don’t include
    methods that respond to these messages, certain objects won’t work correctly;
    some of their features will be disabled: they’ll appear on the screen and do nothing
    or may not appear at all.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Implicit question-response and delegation


    Question-response can be *explicit* or *implicit*. Explicit messaging makes the
    connection between messages and responses obvious in code. For example, the link
    between a button and its handler method is usually explicit. Many features in
    Cocoa make implicit assumptions about when messages are triggered. The context
    in which OS X is asking for a response may not be visible.


    For example, table objects often use implicit question-response to set the appearance
    of table items and to request data for each element. In a more traditional OS,
    you might create your own looping code to iterate through a list of cells, and
    use a function call to set their properties. In Cocoa, the looping is *implied*
    — it’s an internal OS X process you have no control over, managed by implicit
    code that you can’t see or modify.


    If you use a table view, your application is expected to implement a method that
    supplies data for each cell. No obvious code triggers the method, but you can
    see that it runs — for reasons that seem mysterious until you understand how this
    feature works. Figure 2.7 illustrates this process graphically.


    # Figure 2.7


    Implicit question-response hides the source of the question within the internal
    workings of OS X. This is easy to understand for one-off application events, but
    more of a challenge to follow when the object relationships are more complex or
    use implied iteration.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_56_0.png)


    Implicit questions are often implemented with *delegate methods* — optional helper
    methods that aren’t always listed in the main class reference for an object. If
    an object isn’t doing what you expect, it’s likely that you haven’t implemented
    all of its required delegate methods. Delegation is explained in more detail in
    Chapter 5, with further examples throughout this book.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_56_1.png)


    # CAUTION


    When you design your own objects, you can use the same design question-answer
    pattern to define how they respond to each other. Custom objects aren’t allowed
    to ignore messages. If you send an unrecognized message to an object, your application
    crashes. Internally, OS X solves this problem for Cocoa object by cheating — every
    possible message includes a stub do-nothing handler method. When you write your
    own handler for a Cocoa object method, your code overrides the stub.'
  merge: -1
  img_proc: true
- pgno: 57
  md: "# Cocoa messaging and notifications\n\nCocoa includes a separate messaging\
    \ system with more sophisticated features. *Notifications* are like an internal\
    \ e-mail or chat service. You can use them to pass information between applications\
    \ or between objects within an application. Objects can sign up to receive notifications\
    \ and can post them through a notification center. Notifications can include complex\
    \ data. They’re a system-level feature, while Objective-C messaging is a language-level\
    \ feature. The two messaging systems are unrelated and are used in different ways.\n\
    \n# Objective-C syntax\n\nNow that you’ve seen some of the ways in which messaging\
    \ is used in Cocoa, you may be curious about messaging code. Objective-C uses\
    \ square brackets to indicate messages. For example:\n\n```\n```objective-c\n\
    [anObject doSomething];\n```\n```\n\ntriggers the `doSomething` method in anObject.\n\
    \nThe messaging syntax can pass parameters.\n\n```\n```objective-c\n[anObject\
    \ doSomethingWith: anInt];\n```\n```\n\ntriggers `doSomethingWith:` and passes\
    \ it an int. Parameter fields can have descriptive name strings. For example,\
    \ in\n\n```\n```objective-c\n[anObject doSomethingWith: anInt andABoolToo: YES];\n\
    ```\n```\n\n`doSomethingWith:` and `andABoolToo:` are part of the message syntax.\
    \ They’re effectively code-based tooltips, included for clarity and legibility,\
    \ and they don’t affect execution.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_57_0.png)\n\
    \n> **CAUTION**\n> \n> Objective-C treats `aMethod` and `aMethod:` `thatTakesAParameter`\
    \ as completely different entities. It’s good practice in your own code to keep\
    \ method names as distinct as possible. Some Cocoa method names don’t do this;\
    \ you’ll occasionally see an identical method name followed by a number of different\
    \ parameter groupings. Objective-C understands the difference, but you may find\
    \ it harder to remember.\n\nThis idiom is often used in Cocoa classes to include\
    \ hints about the purpose of each field. For example\n\n```\n```objective-c\n\
    [aWindow setHasShadow: YES];\n```\n```\n\nenables a drop shadow effect for aWindow.\
    \ Replacing YES with NO turns off the drop shadow. This feature helps make Cocoa\
    \ code easy to read. But sometimes it gets out of hand. Objective-C is chatty\
    \ rather than terse, and some Cocoa methods have very long names. The full syntax\
