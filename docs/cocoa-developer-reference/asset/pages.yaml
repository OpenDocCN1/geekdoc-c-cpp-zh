- pgno: 320
  md: "# ### Performance considerations\n\nFast enumeration is fast. It runs slightly\
    \ faster than a for-next loop or an enumerator object. Cocoa's core is optimized\
    \ for object processing, so data collection enumeration can be as fast as C array\
    \ indexing. Generally, you can use fast enumeration without performance worries.\n\
    \n# ### Enumerating mutable collections\n\nDon't enumerate a mutable collection\
    \ while it's being modified. If the data in the collection changes, the enumerator\
    \ raises an exception.\n\nThe safe way to enumerate mutable objects is to copy\
    \ them to a temporary read-only object, and then run the enumeration on the read-only\
    \ data. Enumerators aren't suitable for conditional editing.\n\n```\n```\n//Don't\
    \ do this!\nfor (id anItem in mutableCollection) {\n    if ([anItem isEqual: aTestItem])\
    \ {\n        //code to replace anItem or delete it from the collection\n    }\n\
    }\n```\n```\n\n# ### Counting items\n\nAll the data collection objects implement\
    \ the count method, which returns an integer with the number of items; for example:\n\
    \n```\n```\nint items = [aDictionary count];\n```\n```\n\n# ## Archiving and de-archiving\
    \ collection objects\n\nAll the collection objects implement direct disk access.\
    \ You can save and load data directly to and from disk with an arbitrary filename\
    \ by calling a disk access method on a collection object. For example, to save\
    \ data from an array, use\n\n```\n```\n[anArray writeToFile: aFilePath atomically:\
    \ YES];\n```\n```\n\nYou can reload the data with\n\n```\n```\nanArray = [NSArray\
    \ arrayWithContentsOfFile: aFilePath];\n```\n```\n\nYou don't need to create a\
    \ file manager object. These methods handle low-level disk access for you.\n\n\
    # **CROSS-REF**\n\nFor information about creating and using file paths and URLs,\
    \ see Chapter 10."
