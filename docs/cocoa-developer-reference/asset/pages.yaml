  img_proc: true
- pgno: 299
  md: 'To define a return value, use


    ```

    aBlock = ^(int n) {return n*20};

    NSLog(@"%i", aBlock(3)); //Logs 60

    ```


    The full block declaration includes the return type, the name, and the parameter
    list, followed by a copy of the parameter list, followed by the code.


    ```

    int (^aBlock) (int) = ^(int n) {return n+1};

    ```


    If the return type is missing, the compiler *assumes it from the code*—which is
    why the previous two lines of code were valid.


    # Fixing variables and values


    If a block references a variable or value when it’s created, the value is frozen
    into the code. Parameters are referenced in the usual way, but if you don’t define
    a variable as a parameter, the block makes a copy of its current state when it’s
    created and doesn’t allow it to be changed. For example:


    ```

    int b;

    b=2;

    aBlock = ^(int a) {return a*b};

    NSLog(@"%i", aBlock(3)); //Logs 6

    b=3;

    NSLog(@"%i", aBlock(3)); //Still logs 6

    ```


    To convert b into a block variable, add a block underscore prefix to the original
    definition:


    ```

    __block int b=3;

    NSLog(@"%i", aBlock(3)); //Logs 9

    ```


    Technically, this replaces the constant value of b frozen into the code with a
    reference. The reference points to a location in block memory, which is a separate
    memory area that persists as long as at least one block is active. In simple terms,
    b can now be accessed as a variable.


    Blocks are objects, and they can be copied, stored in arrays and dictionaries,
    and archived. They can also be triggered remotely like methods, using dot syntax.
    Internally you can run a block with


    ```

    self.aBlock();

    ```


    You can also declare blocks as properties so that other objects can run them.
    To make them accessible, declare a typedef, which is similar to a standard C typedef
    and can be used like a class name.


    ```

    typedef int (^MyBlockType) (int);

    MyBlockType aBlock = ^(int aNum) {

    return aNum*42;

    };

    ```


    Add the following to the header file:


    ```

    @property (readwrite, copy) MyBlockType aBlock;

    ```'
  merge: -1
  img_proc: true
