- pgno: 93
  md: '# Working with source code


    Source code can be at least as useful as reference documentation. Sometimes you
    can solve a problem or implement a feature by copying code, even if you don’t
    fully understand how it works. This is an unapologetic cheat, and you should aim
    to understand the code you use. But even when you don’t, it’s an approach you
    can use to gain experience. Figure 3.13 shows my suggested strategy.


    Apple’s code samples are often quite dense. It’s unlikely you’ll be able to use
    them directly, but stripping out code that you don’t need can be a good way to
    learn about application design. Don’t forget that at least some of the application’s
    architecture is defined by its nib files, so you’ll need to explore those too.


    # Summary


    This chapter introduced you to the developer documentation. It explained the differences
    between the various documentation resources and included practical hints for finding
    the most useful content. It also included some suggestions for working with the
    documentation as a whole and for making the best use of other online resources
    and of source code created by Apple and by other developers.'
