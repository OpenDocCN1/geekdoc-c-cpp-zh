- pgno: 384
  md: 'The design is rough around the edges, but it supports the following features:


    +   - **Input checking.**

    +   - **Editing.** You can change any entry.

    +   - **Sorting.** Click the column headers.

    +   - **Searching.** Type into the search bar.

    +   - **Save and reload.** Choose File ▷ Save to save the data. Data is reloaded
    automatically.

    +   - **OS X standard undo.**


    This is impressive without code; but it does have some limitations:


    +   - **The date field** shows the day, date, and time, when it should only show
    the year.

