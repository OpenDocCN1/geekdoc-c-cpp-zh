    # Understanding resource types


    The rest of the documentation is divided into broad resource types. Although you’ll
    spend most of your time looking at the framework reference pages, it’s worth taking
    a few moments to explore the other resources so you can begin to familiarize yourself
    with the useful resources, while also noting the less useful ones.


    # Articles


    Articles hold a grab bag of miscellaneous essays and features, such as the Binding
    Your Preferences in Cocoa introduction shown in Figure 3.4. Many articles are
    highly specialized and of little practical interest unless you’re looking for
    information about a very tightly focused topic; in short, you can ignore them.
    For newcomers to Cocoa, the most useful articles are as follows:


    +   - Binding Your Preferences in Cocoa

    +   - Getting Control with Subversion and Xcode

    +   - Installing your Application on Mac OS X: Guidelines for Developers

    +   - Maximizing Mac OS X Application Performance

