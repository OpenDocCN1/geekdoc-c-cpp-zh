    # Joining the Mac Developer and iPhone Developer programs


    Signing up as a free developer gives you entry-level access to the Developer Program.
    A further level is available to developers willing to pay an annual fee. In 2010
    Apple revamped its Mac Developer Program, reducing the fee to $99/year from $499
    but eliminating a number of benefits. In the older program, developers were given
    a discount on Mac hardware and could also send applications to Apple’s Compatibility
    Testing labs for hardware testing. More expensive tiers offered “free” tickets
    to the Apple Developer Convention and further discounts.


    In the new program, the chief benefits are a free copy of the current version
    of OS X and access to advanced beta — “seed” — versions that can be downloaded
    in the months before the official public launch of an update. Developers can request
    two technical support incidents per year, where they discuss development problems
    with an Apple engineer who reviews their code and offers troubleshooting advice
    or a workaround. Access to the Apple Developer Forums and to a selection of instructional
    videos is also included.'
