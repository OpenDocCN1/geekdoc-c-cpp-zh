    \ should use these features.\n+   - **Windows are designed with standard elements.**\
    \ These elements include a data source at the left, a toolbar at the top, scroll\
    \ bars at the right, further options at the bottom, and so on. Applications should\
    \ follow the same outline design.\n\n> **NOTE**\n> \n> If you’re new to Cocoa,\
    \ coming from a different development environment, review the design guidelines\
    \ for Aqua windows. Elements such as Bottom Bars may be unfamiliar. Not all applications\
    \ use all elements, but you should be aware of the different options."
