- pgno: 43
  md: 'Aqua is an ideal choice for mainstream productivity and lifestyle applications,
    but creative and media applications sometimes take a more individual approach
    to interface design and feature access. Although parts of Cocoa are closely tied
    to Aqua, it’s possible to use Cocoa to create a completely individual look and
    feel. Aqua is a set of guidelines, but Cocoa only enforces them to the extent
    that it includes a library of standard objects that can be included in an interface.
    You can customize the appearance of most of these objects if you choose to, and
    still use Cocoa to define how they respond to user actions.


    # Creating Cocoa Applications


    Cocoa is one library among many others in OS X and isn’t a synonym for the OS
    as a whole. Technically, Cocoa is a layer in OS X — a group of libraries that
    can be used to implement related features. Some care is needed when discussing
    layers because Apple’s documentation describes layers in different ways. For example,
    in parts of the documentation, Cocoa is described as an element of the Application
    Framework layer — a set of four libraries that can be used to build applications.
    Elsewhere Cocoa is described as a complete layer in itself. Elsewhere again it’s
    described as a group of separate frameworks — code libraries.


    # Understanding layers and frameworks


    You’ll find it helpful to understand that some parts of the documentation sketch
    a functional outline of OS X, while others refer to groups of actual code libraries.
    Confusingly, the functional outline is only loosely related to the structure of
    the code. The functional view is best used as an OS X orientation summary and
    jargon buster, not as a development aid.


    Table 2.1 illustrates a functional summary of the layers in OS X. It’s an extended
    version of Apple’s own overview, with added comments.


    **Table 2.1 Functional OS X Layers — An Outline View**


    | Layer | Elements | Comments |

    |---|---|---|

    | User Experience | Aqua<br>Spotlight<br>Accessibility | These elements implement
    or define the most visible parts of OS X in a high-level way. They are either
    APIs (Spotlight, Accessibility) or concepts and guidelines (Aqua). Simpler applications
    can ignore the APIs. More advanced applications can use them to add certain standard
    Mac features. |

    | Application Frameworks | Cocoa<br>Carbon<br>Dashboard & WebKit<br>POSIX and
    X11 | These code libraries are used to create application skeletons. They include
    window management features, data handling, application setup and teardown, interface
    creation, and so on. For more details, see Table 2.2. |'
  merge: -1
  img_proc: true
- pgno: 44
  md: '| Layer | Elements | Components |

    |---|---|---|

    | Graphics and Media | Core Animation<br>Core Image<br>Core Video<br>QuickTime<br>OpenGL<br>Quartz<br>Core
    Audio | These elements include still image, animation, and video and audio support.
    This list is a shortened summary, and the names listed here don’t map exactly
    to the names of the frameworks that implement these features. But these names
    are often used as generic descriptions for groups of related libraries. |

    | Data and Data Management | Core Data<br>Address Book<br>Calendar | Use these
    elements to manage data within an application and to exchange data with Apple’s
    own built-in applications. The Apple frameworks have their own separate internal
    data management features. Many applications use both kinds of data management.
    |

    | Darwin, Kernel and Driver | UNIX system calls<br>Driver libraries | OS X is
    built on the BSD (Berkeley Software Distribution) variant of UNIX and includes
    all the usual low-level UNIX system calls. This level handles direct — high risk
    — access to hardware features, such as disk hardware or the temperature sensor.
    It also handles calls to the underlying Darwin version of the UNIX OS. |


    Figure 2.2 shows how these elements are related to each other graphically. The
    most sophisticated and abstract layers are at the top of the diagram. As you travel
    away from the User Experience layer, you move into the internals of OS X, eventually
    reaching the underlying UNIX code.


    **Figure 2.2**


    This simplified functional view is useful to orient you, but a code-level view
    of frameworks and layers is more relevant in practice.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_44_0.png)


    # Cocoa, Aqua, and the user experience


    Aqua is a key part of the user experience. While Cocoa is a code library, Aqua
    is a look and feel, defined in part by the glass-like interface graphics pioneered
    by Apple. As a developer, you don’t program an Aqua layer, and there is no Aqua
    framework. Instead, the visible parts of Aqua are implemented for you automatically.
    Whenever you add a standard button graphic to your'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'application, it appears as an Aqua button. In theory, Apple could replace Aqua
    with a different look in a future version of OS X without breaking any existing
    Cocoa code.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_45_0.png)


    # CAUTION


    You can replace the default Aqua graphics features with custom graphics if you
    choose to. But Aqua is popular with users, and if you''re planning to customize
    the look of an app with your own graphics, you may find it difficult to create
    a look with equal user appeal.


    Aqua is much more than a set of glossy graphics. As a layer, Aqua also defines
    a set of explicit design guidelines, and an Aqua-compliant application must meet
    these guidelines. This is covered in more detail later in this chapter.


    The other parts of the user experience layer are built into OS X. Spotlight implements
    speedy searches. Dashboard displays mini-applications called widgets, and is described
    in Appendix A. Accessibility is used to create accessible applications for partially-able
    users. Support for Spotlight and Accessibility is recommended but not obligatory.
    Depending on their functions and user interface, applications can sometimes leave
    out Spotlight features without disappointing or frustrating users.


    # Cocoa and the application frameworks


    As Table 2.2 shows, Cocoa is not the only application framework included in OS
    X. Developers can also use low-level POSIX calls and X11 window management to
    create Unix-compatible applications; a famed Carbon could create and manage OS
    X windows and interface features through C function calls; and Java and JavaScript
    to create Web-based or Web-like applications.


    | Framework | Interface | Application Type |

    |---|---|---|

    | Cocoa | Objective-C objects and methods | Mac-style windowed desktop applications
    and command line applications that use Cocoa data types. |

    | Carbon | C functions and data structures | Mac-style windowed desktop applications
    using C language data types, structs, and functions. This layer includes a number
    of special libraries, for example, speech synthesis and speech recognition. |

    | POSIX and X11 | C functions and data structures | UNIX-style applications with
    X11 windowing and low-level command line input. Use this framework to create cross-platform
    UNIX applications that can run on a Mac and on a different UNIX platform with
    minimal changes. |

    | Dashboard and WebKit | Java and JavaScript functions and data types | Web-based
    applications, including WebKit apps for the iPhone, and Dashboard widgets for
    the Mac desktop. For details and examples, see Appendix A. |'
  merge: -1
  img_proc: true
