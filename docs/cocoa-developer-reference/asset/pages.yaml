- pgno: 496
  md: '# ### Setting and using breakpoints


    To set a breakpoint, select a line of code in Xcode''s code editor and then choose
    Run ➤ Manage Breakpoints ➤ Add Breakpoint at Current Line. An arrow icon appears
    in the margin to the left of the line. Figure 18.7 shows the result of adding
    a breakpoint at the start of the `startCount:` and `stopCount:` methods.


    # ### Figure 18.7


    Adding breakpoints: the code window displays a blue arrow icon in the margin next
    to each breakpoint. Here breakpoints have been added at two NSLog calls, but you
    can add a breakpoint on any line.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_496_0.png)


    Click Build and Debug, and the application builds and runs with added breakpoint
    information. When the code reaches a breakpoint, it pauses and the arrow icon
    displays a smaller extra brown arrow. The line with the breakpoint is highlighted,
    as shown in Figure 18.8.


    You can do three things at a breakpoint:


    +   - Review variables and properties

    +   - Single-step through a method

    +   - Continue execution'
