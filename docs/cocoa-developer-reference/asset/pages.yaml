- pgno: 187
  md: 'The Size tab, shown in Figure 7.13, defines object size and alignment. It not
    only sets the object dimensions, it also defines how the object is anchored to
    the window around it, and it includes alignment and placement buttons that can
    center an object horizontally or vertically or align it with other elements.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_187_0.png)


    # TIP


    You can select multiple objects in either the Editor or the Doc window, and use
    the placement buttons to align and center them as a group. For an example of working
    with the Inspector, see the next chapter.


    # Figure 7.13


    Use the Size tab to set the size, position, and alignment of objects with fine
    numerical control. The Placement and Alignment buttons auto-align and auto-center
    selected items.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_187_1.png)


    The Bindings tab, shown in Figure 7.14, links a selection of object properties
    to various data processing features in the application. Bindings are an advanced
    Cocoa feature that simplifies data management. For example, you can use bindings
    to manage application preferences without having to create outlets and actions
    for every possible preference. For more information, see Chapter 13.'
