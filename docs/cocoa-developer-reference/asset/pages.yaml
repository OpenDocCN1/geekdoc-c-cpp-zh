- pgno: 233
  md: "# Figure 9.4\n\nUsing MVC in a browser. Browser applications support MVC almost\
    \ automatically. It would be very inefficient to download the entire contents\
    \ of a Web server to display a single page. Instead, the MVC pattern makes it\
    \ possible to interact with each page one at a time. The controller translates\
    \ the HTML and other scripts on each page into a visible view, and it manages\
    \ user action with the data model.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_233_0.png)\n\
    \n> **CAUTION**\n> \n> Model-View-Controller isn’t related to modal views. In\
    \ Cocoa and Cocoa Touch, a modal view takes control of the interface and locks\
    \ out other interaction. For example, when a save/open sheet appears, the user\
    \ can only select a file or click the Cancel button. The rest of the interface\
    \ stops responding until the sheet is dismissed.\n\n# Using MVC with Cocoa controller\
    \ objects\n\nSome of Cocoa’s classes, such as NSTableView, require explicit translation\
    \ code in a controller. For example, to display a table of values from a data\
    \ source array in a table view, implement two delegate methods:\n\n```\n− (int)\
    \ numberOfRowsInTableView: (NSTableView *) tableView {\n    return [dataSourceArray\
    \ count];\n}\n− (id)tableView: (NSTableView *)tableView\n          objectValueForTableColumn:\
    \ (NSTableColumn *) tableColumn\n          row: (int) row\n{\n    return [dataSourceArray\
    \ objectAtIndex:row];\n}\n```\n\nThese two methods perform the auto-enumeration\
    \ introduced in Chapter 2. Cocoa uses them to ask your application for a count\
    \ of items to display in the table column, and then to ask for an object to display\
    \ in each row."
