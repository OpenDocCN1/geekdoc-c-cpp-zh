- pgno: 503
  md: '**Figure 18.14**


    The instruments available to iPhone OS developers. Both platforms support Leaks,
    Object Allocations, the CPU Sampler, and the Activity Monitor. Both also support
    Shark, which is an independent performance profiler.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_503_0.png)


    The generic Instruments tool runs as an event and value recorder. The top lane,
    or lanes, display a time trace of the metrics that are being monitored. Figure
    18.15 shows a run of the Activity Monitor instrument, which tracks the performance
    and resource requirements of every process on a Mac.


    All instruments use the same principle: the traces at the top of the window are
    graphed as the application runs. At the same time, the area under the trace lists
    numerical estimates of each feature.


    You can save each run by choosing File > Save. You can''t replay a timeline, but
    you can drag the cursor along it manually to review metric values at specific
    times. This is only occasionally useful. Typically, you look at metrics in real
    time and watch how they develop as you interact with the application.'
  merge: -1
  img_proc: true
