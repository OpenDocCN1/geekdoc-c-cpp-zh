    # Finding filter keys


    Each filter has a different set of keys listed in the Core Image Filter Reference
    Guide. In the Twirl Filter project, the keys are hardwired into the code and are
    controlled from another view. You can also read the keys for any filter in the
    code with the `inputKeys` method. It generates an array of key names as strings:


    ```

    NSArray *keyNames = [thisFilter inputKeys];

    ```


    This list isn’t enough to create a useful UI, because it doesn’t tell you the
    maximum or minimum range of each value. To retrieve that information, use the
    `attributes` method to return a dictionary:


    ```

    NSDictionary *filterAttributes = [thisFilter attributes];

    ```'
