- pgno: 492
  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_492_0.png)\n\n# NOTE\n\nThe prefixes\
    \ and suffixes for these special features are double underscores, created by typing\
    \ an underscore character twice.\n\n# Selectively enabling NSLog\n\nNSLog is slow\
    \ and expensive, and it can destroy the performance of applications, especially\
    \ if it appears in a critical loop. This is particularly obvious on the iPhone.\
    \ If the loop is driven by a timer — for example, a screen refresh loop — you\
    \ can sometimes simplify debugging by temporarily dropping the timer, giving NSLog\
    \ time to work.\n\nMore typically you’ll want to generate NSLog messages while\
    \ debugging but remove them from release code. It’s possible to do this manually,\
    \ creating a special release build with selected code disabled or removed. In\
    \ a typical application, you’ll add NSLog events to multiple methods in multiple\
    \ objects. Commenting them out by hand is a time-consuming and error-prone solution.\n\
    \nIntuitively, you might expect that it would be possible to solve the problem\
    \ with a conditional definition:\n\n```\n```objc\n#ifdef DEBUG\n    NSLog(@\"\
    A message\");\n#endif\n```\n```\n\nThis is inefficient — adding extra conditional\
    \ code for every log statement is wasted extra effort — and it doesn’t work. Although\
    \ there are separate debug and release methods, by default Xcode doesn’t implement\
    \ a DEBUG flag. You can define one of your own, but a quicker and simpler solution\
    \ is to redefine NSLog as a blank value in the application’s _Prefix.pch file:\n\
    \n```\n```objc\n#define NSLog\n```\n```\n\nThis simple one-line directive, shown\
    \ in Figure 18.4, defines NSLog as a blank function and eliminates all NSLog output.\
    \ You can either comment out this line while debugging or add it before a release\
    \ build.\n\nMore complex solutions are possible. Entire alternative logging classes\
    \ and frameworks are available online. A popular solution uses macros to create\
    \ a lightweight customizable replacement. Again, the code is added to the application’s\
    \ _Prefix.pch file:\n\n```\n```objc\n#define MY_DEBUG_MODE\n#ifdef MY_DEBUG_MODE\n\
    \    #define MYLog( s, ... ) NSLog ( @\"%@ %@:%d) %s\", self,\n        [[NSString\
    \ stringWithUTF8String:__FILE__] lastPathComponent],\n        __LINE__, [[NSString\
    \ stringWithFormat:(s), ##__VA_ARGS__] )\n#else\n    #define MyLog( s, ... )\n\
    #endif\n```\n```"
  merge: -1
  img_proc: true
- pgno: 493
  md: '# Figure 18.4


    The easy way to disable output from NSLog. This is a quick hack and it isn’t guaranteed,
    but it’s very convenient and it usually does the job.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_493_0.png)


    Instead of NSLog, call MyLog. This sample code logs the address, filename, and
    line number of each statement as a prefix to the standard NSLog output. You can
    customize this feature as needed, adding or removing logging features. You can
    also define multiple log types and modes so that debugging logs are stripped in
    release code, but occasional critical log events can be retained. Comment out
    MY_DEBUG_MODE for a release build.


    # TIP


    It’s good practice to give the custom debug option a unique or even a personalized
    name. Don’t call it DEBUG or DEBUG_MODE. If you import a framework or library
    created by another developer, these definitions may already exist.'
