  md: '+   - The archiver is prepared by creating an instance of `NSMutableData` and
    passing it to `NSKeyedArchiver` as an initialization parameter. This sets up an
    empty buffer for the archiver.

    +   - The key in the `encodeObject:` method is arbitrary. It doesn’t matter what
    it is, but it must match the key in the `decodeObjectForKey:` method in the load
    code.

    +   - The `finishEncoding:` method implements the archiving process. You must
    place this method after `encodeObject:`.

    +   - The unarchiving code is a mirror image of the archiver, but it uses `NSKeyedUnarchiver`,
    which runs the `decode:` method for each property in the file.


    Figure 12.6 shows the application running. Clicking Save Record saves the data
    in the UI. Clicking Load Record restores saved data from a file.


