  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_306_0.png)\n\n# # Managing Data and\n\
    # Memory in Cocoa\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_306_1.png)\n\nCocoa\
    \ includes unique data collection objects, which are used almost as regularly\
    \ as floats, ints, and character strings are in C and Java. You can use these\
    \ objects as custom object stores, but you’ll also spend time packing data into\
    \ a collection and passing it to a Cocoa class, and unpacking data from a collection\
    \ returned by a Cocoa class.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_306_2.png)\n\
    \n# ## CAUTION\n\nCocoa doesn’t always use data collections efficiently. Certain\
    \ classes force you to pack data into an array or dictionary when you want to\
    \ pass a single string or a number. This adds overhead and complicates the code,\
    \ but it is sometimes obligatory.\n\nBasic data collection skills include:\n\n\
    +   - Understanding the difference between mutable and standard classes.\n+  \
    \ - Understanding the difference between arrays, sets, dictionaries, and byte\
    \ data.\n+   - Finding objects by index, key, or other search options.\n+   -\
    \ Enumerating objects and processing them.\n+   - Creating single-object collections.\n\
    +   - Counting, listing, sorting, and summarizing the contents of a collection.\n\
    +   - Using key-value coding to initialize and read the settings and parameters\
    \ used in some of Cocoa’s frameworks; for example, some of the medical classes\
    \ require and return key-value dictionaries.\n+   - Saving and loading objects\
    \ to and from disk.\n\n+   ## In This Chapter\n+   \n+   - Introducing data collection\
    \ objects\n+   - Using NSCoder and NSData\n+   - Archiving and de-archiving object\
    \ properties\n+   - Managing memory\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_306_3.png)\n\
    \n# ## TIP\n\nData collection objects have very little in common with their simpler\
    \ C-language counterparts. A C array is a very simple data type, with limited\
    \ features. NSArray shares the same indexed access model, but it supports powerful\
    \ features such as counting, searching, and enumeration."
