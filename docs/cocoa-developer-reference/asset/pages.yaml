    \nIn Objective-C, you must convert literal strings into objects wherever they\
    \ appear. This is true whether they’re text strings, file and path elements, or\
    \ used for some other purpose. If you leave out the @ character — which you often\
    \ do, until you get used to typing it — the compiler won’t always report an error.\
    \ In some circumstances, forgetting the @ can cause a crash.\n\n# ## Managing\
    \ data in Cocoa and Objective-C\n\nObjective-C supports all the standard C data\
