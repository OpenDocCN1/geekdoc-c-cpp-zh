- pgno: 194
  md: '# Building an Application with Interface Builder


    Now that you have had an introduction to Interface Builder (IB), you are ready
    to use it to build a simple application. This application will use a simple UI
    created in IB that links nib objects with code. It runs a simple timer, controlled
    by two buttons. The button text changes according to the application state, and
    the count appears in a large font.


    # ## Designing a Project in Interface Builder


    First, in Xcode, choose File ▸ New Project, click the Application item under the
    Mac OS X section, select the Cocoa Application template, and click the Choose
    button. Save the project as Counter. Open the Resources group, and double-click
    MainMenu.xib to launch IB and load the nib file for editing. After IB loads, choose
    Window ▸ Bring All To Front.


    If the Library window isn''t visible, choose Tools ▸ Library. If the Edit window
    isn''t visible, double-click Window (Counter) in the Doc window. You should see
    a collection of windows similar to the one shown in Figure 8.1.


    The position, size, and layout of the windows aren''t standardized in IB, so the
    layout you see may vary. You''ll be working with the Doc, Inspector, Edit, and
    Library windows. You can ignore the menu. If you have a larger monitor, you should
    be able to view all of these windows simultaneously. On a smaller display, you
    may need to minimize certain windows to allow space for the others.


    +   **8 In This Chapter**

    +   - Designing a project in Interface Builder

    +   - Understanding links, outlets, and actions

    +   - Using advanced UI techniques


    > **TIP**

    > The sample project in this chapter uses the objects in the standard IB library.
    You can extend the library with third-party objects. For example, the BWToolkit
    at http://brandonwalkin.com/bwtoolkit/ is a useful free collection of IB objects.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '**Figure 8.1**


    Creating a working layout ready for editing. On a dual monitor system, you can
    keep the code visible in one window and IB’s windows visible in another. A single
    monitor system is less convenient.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_195_0.png)


    # Introducing the Interface Builder workflow


    As outlined in the previous chapter, Interface Builder and Xcode do not create
    automatic links between objects in a nib file and objects in code. You must add
    links manually, and until you do, the nib objects and the code remain disconnected.
    If you load a nib without creating links, it appears in memory, but your code
    can’t access its features. When the user interacts with it, it doesn’t send messages
    to your application.


    Linking is a complex multistage process. It’s error prone, and many basic build
    errors are created by missing links and other nib-related problems. These errors
    are usually trivial and easy to repair, but the most efficient way to avoid them
    is by following an explicit workflow, shown in Figure 8.2. The items in bold are
    critical steps. You must work through these steps for every object in the nib
    that is accessed from your code.'
  merge: -1
