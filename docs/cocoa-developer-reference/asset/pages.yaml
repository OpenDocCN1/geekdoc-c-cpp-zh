- pgno: 255
  md: "```\n```\n}\n@finally {\n    //Clean up, if necessary\n}\n```\n```\n\nThe @try\
    \ block contains code that may create an error, and the @catch block handles the\
    \ error if it occurs. The @finally block runs regardless.\n\nYou can add multiple\
    \ conditionals in the @catch section to deal with multiple exceptions by name.\
    \ You can also subclass NSErrorException to create custom exception objects, with\
    \ optional extra features. Replace NSErrorException with the name of your subclass\
    \ in the @catch handler.\n\nOptionally, you can add a @catch section to catch\
    \ system-generated exception events. This is a plausible but potentially risky\
    \ way to create a crash-free application. Even if an application is fatally wounded\
    \ by an exception, it may still be possible to give the user a chance to save\
    \ his or her data before quitting.\n\n# Summary\n\nIn this chapter, you learned\
    \ more about various Cocoa messaging features and design patterns. You were introduced\
    \ to a detailed explanation of Model-View-Controller (MVC), with information about\
    \ how it’s implemented in various controller objects in Cocoa.\n\nNext you learned\
    \ about the target-action design pattern, and you investigated a simple application\
    \ that used target-action to swap the methods triggered by a button click. You\
    \ also learned about selectors, and you discovered how to use selectors to trigger\
    \ a message after a delay.\n\nIn the next section, you explored key-value coding,\
    \ learning about its strengths and some of its limitations. You were introduced\
    \ to practical key-value observing, and you discovered how to use it effectively.\n\
    \nYou learned about notifications, discovering how to post and observe them, and\
    \ you also learned how to implement notification-based delegate methods without\
    \ a formal protocol.\n\nFinally, you explored Cocoa’s error-handling features,\
    \ and you discovered how to create error alert panels and how to split your application\
    \ into sections that can trap and manage exceptions without crashes."
