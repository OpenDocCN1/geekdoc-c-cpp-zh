    # TIP


    aParameter is used as a private variable within the method. Name conflicts are
    common, so it can be useful to prefix parameters with an underscore to ensure
    that local parameter names don’t conflict with global properties.


    ```

    ```objc

    - (AClass *) thisMethodDoesSomething:

    (UsingAnotherClass *) _aParameter;

    ```

    ```


    Xcode assumes that if your code references a method, it exists. If the compiler
    can’t find the method at compile time, it logs a warning but allows the build
    to complete. The compiler generates the same warning if you use a method before
    you define its implementation.


    Method names are only loosely linked to objects, and the Objective-C run time
    looks up method names dynamically. For example, as long as aMethod is available
    in both classes, this is valid code even if both implementations of aMethod are
    different:


    ```

    ```objc

    aPointer = anInstanceOfAClass;

    [aPointer aMethod];

    aPointer = anInstanceOfASubclassOfAClass;

    [aPointer aMethod];

