    # # Using Bindings with Controllers


    Controller objects — NSObjectController, NSArrayController, NSDictionaryController,
    NSTreeController, and NSUserDefaultsController — add an extra level of sophistication
    to bindings, and four or five extra layers of complexity. Controllers become useful
    when bindings are used as data pipes. In the same way that simple bindings can
    connect different properties without formatting or conversion code, controllers
    can connect complex objects and translate data between them.'
  merge: -1
  img_proc: true
- pgno: 352
  md: "You can use controllers to produce complex applications with very little code.\
    \ For example, NSTableView is the standard Cocoa object used to display and manage\
    \ tables. It's a complex class with many features and delegate methods. To implement\
    \ a TableView without bindings, you must write glue code — code that connects\
    \ two objects or features together and translates data between them. For example,\
    \ an array can be translated into a list of values. The code is embedded in delegate\
    \ methods that are called when the table needs to display, refresh, or modify\
    \ data. It can easily become very complex.\n\nController objects can minimize\
    \ the glue code. In some applications, they can eliminate it completely. To demonstrate,\
    \ the example below demonstrates how you can create an application that displays\
    \ a list of running processes in OS X — with exactly one line of active code.\n\
    \nThe App Delegate header file looks like this:\n\n```\n    #import <Cocoa/Cocoa.h>\n\
    \    @interface TableBindingAppDelegate : NSObject\n        <NSApplicationDelegate>\
    \ {\n        NSArray *runningApps;\n        NSWindow *window;\n    }\n    @property\
    \ (assign) IBOutlet NSWindow *window;\n    @property (nonatomic, retain) NSArray\
    \ *runningApps;\n    @end\n```\n\nIt’s a copy of the standard template, with an\
    \ added NSArray property called runningApps.\n\nThe App Delegate implementation\
    \ looks like this:\n\n```\n    #import \"TableBindingAppDelegate.h\"\n    @implementation\
    \ TableBindingAppDelegate\n    @synthesize window, runningApps;\n    - (void)applicationDidFinishLaunching:\n\
    \        (NSNotification *)aNotification\n    {\n        self.runningApps =\n\
    \            [[NSWorkspace sharedWorkspace] launchedApplications];\n\n       \
    \ NSLog(@\"%@\", runningApps);\n    }\n    @end\n```\n\nThis code doesn’t do much.\
    \ It calls the NSWorkspace object and asks for a list of running applications,\
    \ which is copied to the array. An NSLog call lists the running apps to the console.\
    \ The logging is optional, but it’s very useful, as you’ll see next."
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Figure 13.15 shows the finished application. It has the following features:


    +   - There are three independent columns of data showing values from the `running-apps`
    array.

    +   - The table dividers can be moved.

    +   - Rows can be selected by clicking on them, and there is an optional selection
    index used to return information about the number of the current selection.

    +   - Columns can be sorted by clicking on each column header to select ascending
    or descending sorting.


    The application has some limitations. It doesn’t auto-refresh the table; the array
    is loaded once at launch, and isn’t updated. In its basic state, it’s a display-only
    app. There are no features for starting and stopping apps, saving the list to
    a file, maintaining a log file, and so on.


    But it’s doing a lot with very little code. And most of the intelligence is built
    into a controller object, coupled to the array and the table view via bindings.


