- pgno: 481
  md: "If the timer ticks more than 25 times a second, the scene animation appears\
    \ smooth. In this example, you use the timer to update a variable that defines\
    \ the rotation of the scene.\n\nAn OpenGL scene is defined by a long list of functions.\
    \ Typically the code does the following:\n\n+   1. Initializes lights and materials\n\
    +   2. Defines the viewport and camera position\n+   3. Places objects in the\
    \ scene\n+   4. Calls `glFinish()` to render the scene\n\nThe `glFinish()` function\
    \ compiles the scene code and runs it, creating the finished view. Sample code\
    \ for the teapot example is as follows. The code uses the OpenGL and GLUT libraries,\
