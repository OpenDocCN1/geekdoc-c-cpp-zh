    **TIP**


    Lower down the list, you’ll see keys like `canInsert`. You can use these to enable
    and disable editing features. Creating an editable table is more of a challenge,
    and some extra code is needed. Typically you’ll subclass the data source array,
    the controller, or both to implement full editing.'
