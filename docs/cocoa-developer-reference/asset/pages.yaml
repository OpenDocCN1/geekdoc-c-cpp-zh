- pgno: 261
  md: '# Creating and Using URLs


    Although URLs are partly interchangeable with string paths, they are more complex.
    They also support additional features. Some objects, such as the NSOpenPanel and
    NSSavePanel objects used to present the user with a file selector, return URL
    paths automatically. More typically you create a file access URL from a string
    path; for example:


    ```

    NSURL *thisURL = [NSURL fileURLWithPath: aPath];

    ```


    You can also extract the path string from a URL:


    ```

    NSString *thePath = [thisURL path];

    ```


    ![](img/2b293e29fc15b0797f113b85dd429b6e_261_0.png)


    # CAUTION


    NSURL’s string method returns a string in a URL-specific format. This is neither
    a valid file path nor a valid Web URL. If you log it, you’ll see that it looks
    nothing like a path. Also, it’s best not to use the URLWithString: and initWithString:
    methods for file paths—they may not parse a path string correctly.


    # Understanding paths and references


    NSURL supports two kinds of path objects: a file path and a file reference. When
    you create a file URL you don’t need to specify the type, because the file system
    checks the type at runtime and parses the URL data accordingly. But it’s useful
    to be aware of the distinction. You can convert a reference into a path by running
    filePathURL: on it. Use fileReferenceURL: to convert a path into a reference.
    isFileReferenceURL and isFileURL are BOOL methods that return the type.


    # Using URLs to read and write data


    Most objects offer methods that correspond to those used for file path reads and
    writes. For example, to load a string, use


    ```

    NSString *textInTheFile =

    [NSString stringWithContentsOfURL: aURL

    encoding: anEncoding: error: &error];

    ```


    But unlike a file path, the URL can be remote:


    ```

    NSURL *aURL =

    [NSURL URLWithString: @"http://www.asite.com/file.txt"];

    ```


    If you know the address of a file on a remote server, you can use this feature
    to download it, as discussed later in this chapter in the section on Web APIs.'
