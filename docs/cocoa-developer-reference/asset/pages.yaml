  md: '**Table 13.2  Some common Controller Keys**


    | Name | Description |

    |---|---|

    | `arrangedObjects` | An array holding a sorted copy of the source data. When
    the user changes the sort options in the table view, this array is re-sorted and
    updated automatically. |

    | `selection` | A copy of the current selected object, updated when the user selects
    an object. (Use keypaths to extract values from it.) |

    | `selectionIndexes` | An `NSIndexSet` of currently selected objects, if there
    are multiple selections. |

    | `selectionIndex` | An `NSUInteger` index of the currently selected object. (Invalid
    for multiple selections.) |

    | `selectedObjects` | An array of the objects that are currently selected. |


