- pgno: 568
  md: "![](img/2b293e29fc15b0797f113b85dd429b6e_568_0.png)\n\n# # Building Dashboard\
    \ Widgets\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_568_1.png)\n\nWidgets were\
    \ introduced in 2005 in OS X 10.4 Tiger. Like iPhone apps, widgets offer users\
    \ a simple, accessible benefit in a stylish wrapper. Some widgets provide unit\
    \ or currency conversions or utilities such as clocks, calculators, and countdown\
    \ timers. Others package entertainment — cartoons are a popular choice — or Web\
    \ information, such as traffic reports or weather. And widget games are always\
    \ popular.\n\nUsers continue to find widgets fascinating because they make it\
    \ easy to customize a Mac with a unique collection of attractively packaged micro-applications.\n\
    \nThe look and feel of widgets is based very loosely on Yahoo!'s Konfabulator\
    \ project, which was formerly sold as a separate OS X application. Internally,\
    \ widgets use JavaScript, HTML, and CSS, but include links to elements of Cocoa,\
    \ and can be extended with plug-ins written in Objective-C.\n\n# ## Introducing\
    \ Dashboard\n\nWidgets load and run automatically within Dashboard — the widget\
    \ manager application. Dashboard, shown in Figure A.1, runs permanently as an\
    \ OS X background task. It remains hidden until the user activates it by typing\
    \ a function key or moving the mouse cursor to one of Exposé’s hot corners.\n\n\
    To the user, Dashboard is somewhat like an alternative desktop. A selection of\
    \ widgets appears in the Dashboard area, where they can be repositioned by clicking\
    \ and dragging.\n\nClicking the Open (+) button at the bottom left of the Dashboard\
    \ area displays a dock-like menu that lists all installed widgets. Choosing a\
    \ widget in the dock copies it to the Dashboard “desktop” and installs it with\
    \ an attractive ripple-like animation, illustrated in Figure A.2.\n\n+   **In\
    \ This Appendix**\n+   \n+   - Introducing Dashboard\n+   - Profiting from widgets\n\
    +   - Understanding widget technology\n+   - Introducing Dashcode\n+   - Building\
    \ a widget in Dashcode"
  merge: -1
  img_proc: true
- pgno: 569
  md: '# Figure A.1


    Introducing Dashboard, with a selection of Apple standard, downloaded, and homebrewed
    widgets. All widgets can potentially pull data from the Web and display it inside
    a custom frame.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_569_0.png)


    Dashboard is used modally — it dims the background when it appears, and widgets
    zoom in from the top of the screen. Background applications remain running, but
    widgets are the focus as long as the Dashboard is visible. To dismiss Dashboard,
    a user can type a preset function key, trigger an Active Screen Corner action,
    set up the Exposé and Spaces System Preferences panel, or click anywhere on Dashboard''s
    background.


    # TIP


    Widgets can continue running as background processes when Dashboard is hidden,
    but they should only use processor cycles when they need to. It''s good practice
    to include code that halts or pauses a widget when Dashboard isn''t visible. The
    ideal widget pauses when Dashboard is dismissed and quickly updates itself when
    Dashboard appears. Apple''s widget templates include code for handling the various
    possible Dashboard states.'
  merge: -1
  img_proc: true
- pgno: 570
  md: 'Figure A.2


    Installing a new widget creates a ripple animation. The cross icons are added
    automatically in edit mode. Clicking these icons closes the widgets, removing
    them from the main Dashboard view, but not uninstalling them permanently.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_570_0.png)


    # Profiting from Widgets


    Although iPhone apps and widgets use different technologies, they offer similar
    user benefits. When widgets first appeared, they created a new market for developers
    and sparked a small gold rush. Widgets are simpler and easier to build than iPhone
    apps, and they can be sold directly from a Web site without Apple approval. Optionally,
    they can also be submitted for an official listing in Apple''s widget "store"
    at www.apple.com/downloads/dashboard.'
  merge: -1
  img_proc: true
- pgno: 571
  md: "However, when the iPhone’s App Store was founded, it immediately eclipsed the\
    \ widget market. Currently, most widgets are listed as freeware, and opportunities\
    \ for direct widget sales are very small. Although only a small number continue\
    \ to sell well, widget development still has commercial potential, and custom\
    \ widget creation remains a small but potentially lucrative market for designers\
    \ and consultants. Some of the advantages to widgets are as follows:\n\n+   -\
    \ **Although widgets can appear toy-like and simple, they can be powerful.** For\
    \ example, they can process and summarize Web and server data, create secure in-house\
    \ communications tools, or provide continuous news and information updates. Widgets\
    \ can use polling or push technology to display information as it changes.\n+\
    \   - **Widgets can support ad sales and donation boxes.** Adding an ad banner\
    \ space to a widget and linking it to an ad server is relatively easy. Adding\
    \ a donation box to the widget itself or to a download page is even simpler. A\
    \ widget can display a new ad every time Dashboard is loaded or on a regular timed\
    \ update cycle. Unlike ads on Web pages, widget content can’t be blocked with\
    \ an ad filter.\n+   - **Widgets can support mobile apps and provide a front end\
    \ to a commercial Web service.** For example, widgets for Twitter and Facebook\
    \ remain very popular. Even though stand-alone applications may have more features,\
    \ widgets offer instant-on convenience.\n\n> **TIP**\n> \n> Users are often unenthusiastic\
    \ about ad-based products. If a widget is too gaudy or intrusive, users will uninstall\
    \ it. But if the widget’s features are interesting enough, and ads are carefully\
    \ targeted or made simple and unobtrusive—for example, as short understated text\
    \ messages, rather than as garish animated banners — widgets can be an effective\
    \ marketing medium for services, content, news, apps, and other products.\n\n\
    +   - **Widgets are popular and accessible.** They may appear in the future on\
    \ platforms such as the iPad, or even the iPhone, and if a version of Dashboard\
    \ appears on a mobile platform, developers can expect another gold rush.\n\n#\
    \ Understanding Widget Technology\n\nInternally, a widget is a scripted Web page\
    \ in a custom wrapper. The wrapper provides a graphical frame and includes parts\
    \ — placeholder objects that contain text, images, animations, video files, and\
    \ other information. The widget’s code reads or generates content and writes it\
    \ to the placeholders. It is possible to build very simple widgets with plain\
    \ HTML and no scripted features, but code is usually added to create a richer\
    \ and more interactive user experience.\n\nAlthough widgets can have any dimensions,\
    \ 640 × 480 is a realistic maximum size. Widgets should be simple and should be\
    \ able to share the Dashboard “desktop” with other widgets. Do not design them\
    \ as complex independent applications with an extended feature set. Widgets should\
    \ do one or two things elegantly in a small screen area."
  merge: -1
  img_proc: true
