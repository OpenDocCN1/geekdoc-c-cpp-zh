- pgno: 580
  md: "# Figure A.10\n\nUnfortunately there’s no template for displaying or updating\
    \ an image from a Web source. Adobe Flash elements are not supported at all.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_580_0.png)\n\n**TIP**  \nYou can use\
    \ the graphics editor as a convenient tool for creating glass-effect graphics\
    \ for other projects. When you save a widget project, image files are included\
    \ in the project folder. You can read these files with any image editor. This\
    \ is a convenient and fast way to create custom glassy buttons for any iPhone\
    \ or OS X project.\n\n# Using JavaScript in widgets\n\nJavaScript is a complex\
    \ object-oriented language with many features, but you can create working widgets\
    \ without becoming a JavaScript expert. A full description of JavaScript is outside\
    \ the scope of this book, but you can use the hints in this section to get started\
    \ with widget programming.\n\n# Understanding DOM object access\n\nJavaScript\
    \ uses the Document Object Model (DOM) to manage object access. Every part in\
    \ a widget has its own distinct ID, and you can access the object’s properties\
    \ by referencing the ID. For example, to access the front view of a widget use\n\
    \n```\nvar front = document.getElementById(\"front\");\n```"
