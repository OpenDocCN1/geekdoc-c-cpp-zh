- pgno: 302
  md: 'The NSOperationQueue is managed as before. addOperation: is used to queue each
    block operation as it’s created.


    The block syntax itself is nested. You can’t pass parameters to the block defined
    by the blockOperationWithBlock:, but you can treat that block as a dummy wrapper
    and call your active block inside it. This solves the problem — with the caveat
    that a block uses a parameter reference rather than a parameter value, taking
    the current value of limitInt.


    If some other process changes limitInt before a block is dispatched, it will take
    the runtime value, which may not be the value you set here. For reliable code,
    it’s best to pass parameters as literals, or to make a local copy of a value that
    can be passed to the block. Both options guarantee that the value won’t change
    while the code runs.


    # Introducing Grand Central Dispatch


    NSOperation is a wrapper around a lower-level technology called Grand Central
    Dispatch (GCD). In most applications, you can do everything you need with NSOperationQueue.
    GCD offers improved low-level thread management that gives you more control over
    how threads are grouped and run. It implements a separate collection of queues
    that runs independently of the main queue, and also gives finer control over priority.


    GCD understands blocks; for example, to start a thread with GCD use:


    ```

    dispatch_async(queue, ^{ block code});

    ```


    For more details about GCD, see the Grand Central Dispatch Reference in the Documentation.


    # Using NSTask


    Cocoa includes another class that supports threading and remote execution. NSTask
    is a wrapper for system-level Unix calls. You can use NSTask to invoke the shell
    to execute simple commands such as ls, or to run utilities such as traceroute
    or ping.


    By default, NSTask pipes return data back to stdio — the system input/output stream
    — which is connected to the console. You can run an NSTask and monitor the results
    in the console window. To capture the output in your own application, create an
    instance of NSPipe; connect it to the task; create an instance of NSFileHandle;
    implement an observer method that captures data as it arrives; and pass it back
    to your application.


    There are few applications where this is necessary or useful. A simple example
    that calls the say speech synthesizer utility from a text view appears below.
    Figure 11.3 shows the finished application.'
