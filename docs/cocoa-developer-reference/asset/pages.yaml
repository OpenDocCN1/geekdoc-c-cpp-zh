    # Summary


    This chapter has covered a lot of ground. You may need to work through it a couple
    of times to take it all in, but it’s worth the time because it explains some of
    Cocoa’s key practical concepts.


    At the start of the chapter, you were introduced to a typical Interface Builder
    workflow. Next, you found out how to add objects to a nib, how to center and align
    them, and how to modify their default properties.


    In the next section, you were introduced to outlets and actions, and how to define
    them in code. You also learned about the Interface Builder linking process and
    how to link objects in code to objects in a nib file. You then explored a simple
    application that used selectors to swap handler methods dynamically, creating
    a UI that reconfigured itself.


    Finally, you were introduced to some more advanced techniques used in event handlers,
    including `id` sender idioms and First Responder events.'
