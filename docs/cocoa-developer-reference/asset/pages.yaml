- pgno: 498
  md: '# Controlling breakpoint execution


    The icons above the code editing window in Xcode control execution after a breakpoint
    and provide quick links to the Console and the Debugger window. The toolbar is
    shown in Figure 18.9. From left to right you can:


    +   - Toggle breakpoints

    +   - Continue execution to the next breakpoint, if there is one

    +   - Step over a method or function

    +   - Step into a method or function

    +   - Step out of the current method or function

    +   - Open the Debugger window

    +   - Open the Console window


    The step-over and step-into options single-step through code. Stepping out of
    a method or function “disappears” the execution marker when execution continues
    within OS X. (Unsurprisingly, you’re not allowed to view the OS X source code.)
    In your own code, execution may continue in another object.


    **Figure 18.9**

    The debugging toolbar.

    The execution icons are only active while single-stepping after a breakpoint.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_498_0.png)


    # Setting conditional breakpoints


    There are two sets of conditional breakpoints. The first is to define them in
    the Breakpoints window, shown in Figure 18.10. There is no menu option for this
    window in Xcode. It can only be opened by pressing ⌘+Alt+B on the keyboard.


    If you’re familiar with gdb-compatible conditions, you can double-click under
    the Condition tab to enter them next to a selected breakpoint. In practice, this
    approach may be too clumsy to be useful. gdb’s conditional parser is limited,
    and conditional statements that test properties can become very complex. It’s
    often easier to use an alternative approach: add the conditional tests as temporary
    test code and bury a conventional static breakpoint inside them.'
  merge: -1
  img_proc: true
- pgno: 499
  md: '**Figure 18.10**

    The Breakpoints window. You can selectively enable and disable breakpoints without
    removing them by clicking the check boxes in the second column.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_499_0.png)


    # ### Deleting breakpoints


    To remove a single breakpoint, click on its line in Xcode and choose Run ▸ Manage
    Breakpoints ▸ Remove Breakpoint at Current Line. You can also press ⌘+\ as a keyboard
    shortcut.


    Breakpoints tend to spread, so it can be useful to delete them all in a single
    operation. The simplest way to remove all breakpoints is to pause the application
    in the Console window and type delete breakpoints at the (gdb) prompt. Counterintuitively,
    this *does not delete* the breakpoints; it deactivates them. The effect is similar
    — they no longer do anything — but the breakpoints are still visible in the code.


    To delete all breakpoints, open the Breakpoints window and press ⌘+A to select
    all of them. Press the Delete key to delete them. There is no menu option for
    this feature.


    # ### Using the Debugger window


    Often, you can debug directly in the code editor pane. The floating overlays and
    execution options give you enough information to find and fix simple problems.
    The Debugger window, shown again in Figure 18.11, is useful for more advanced
    problems, such as tracking crashes and monitoring object properties.'
  merge: -1
  img_proc: true
- pgno: 500
  md: 'You can open the Debugger window three ways. The slow way is to choose Run
    > Debugger from the main Xcode menu. A faster way is to use the Shift+⌘+Y keyboard
    shortcut. The fastest and simplest way is to click the Debugger window icon in
    the Edit window toolbar, shown previously in Figure 18.9.


    # Figure 18.11


    The Debugger window. The pane at the top left lists the execution stack. The pane
    at the top right lists every variable and data structure in the current object,
    and it can also list global values and the contents of the processor’s registers.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_500_0.png)


    # Using the stack trace


    The execution stack appears in a pane at the top left. The stack lists the order
    in which methods and functions are called. After a crash, the item at the top
    of the stack caused the crash. This may be — and often is — an internal Cocoa
    object or function.


    This pane doesn’t distinguish between Cocoa internals and your code. Typically
    most of the items in this list are internals. But you can look down the list to
    find the object, method, or function in your code that is likely to have caused
    a crash by feeding Cocoa invalid values.'
