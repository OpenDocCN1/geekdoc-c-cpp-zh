- pgno: 116
  md: '# # Introducing Classes and

    # Objects in Objective-C


    ![](img/2b293e29fc15b0797f113b85dd429b6e_116_0.png)


    Objective-C is object-oriented. Code is assembled from objects defined by class
    templates; instances are created and released dynamically and controlled by messages.
    Cocoa is a mix of object-oriented features and conventional C, blended with practical
    tools and techniques for creating and managing objects.


    This chapter is a first look at the theory of object-oriented development in Objective-C
    and introduces class definitions, messaging, and constructors. The chapters that
    follow illustrate the practice and explain how to create links between Objective-C
    code and the contents of a nib file.


    # ## Understanding Objects


    Objects can represent concrete data or abstract processes and relationships. Some
    of the advantages of an object-oriented approach include:


    +   - **Abstraction.** Objects make application design simpler by hiding low-level
    complexity. You can concentrate on creating clean relationships between the elements
    in your application.

    +   - **Encapsulation.** Objects can contain other objects, linked and grouped
    in various ways. Grouped objects can be treated as a single object with a simplified
    interface, or their elements can be accessed individually.

    +   - **Simplified flow control and looping.** Objects can be counted, enumerated,
    looped, collected, and processed as if they were simple data types. Some of Cocoa’s
    data types include looping and enumeration features. You can use these features
    to process a collection of objects with a single line of code.

    +   - **Intuitive event management.** Objective-C is explicitly event driven,
    and the event management features are flexible and powerful.

    +   - **Intuitive but formal data dependency management.** An object can respond
    to a message by accessing its own data or by interrogating other objects. Data
    dependency can be managed automatically.


    | In This Chapter |

    |---|

    | Understanding objects |

    | Designing objects |

