    # Creating relationships


    A relationship is a link between one entity and another. Relationships are used
    to pull data out of associated entities. They define properties indirectly.


    In this example, Albums are created by Artists, so there needs to be a relationship
    between the Album and Artist entities. There should also be a relationship in
    the other direction, because Artists can record more than one Album.'
