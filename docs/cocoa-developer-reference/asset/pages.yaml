- pgno: 121
  md: "# ## Creating implicit and explicit instances\n\nIt’s critically important\
    \ to understand that an application can create object instances *explicitly* with\
    \ Objective-C code or *implicitly* by loading them from a nib file at run time.\n\
    \nThis can seem mysterious, because not all objects have supporting code. For\
    \ example, the blank template application introduced in the previous chapter includes\
    \ a working menu. The code in the template doesn’t create or display the menu,\
    \ or handle standard events such as Quit. Instead, the menu is defined in the\
    \ application nib file and is loaded when the application launches. The nib also\
    \ includes initialization settings for the menu that bind items to standard events.\n\
    \nWhen you run the application, the menu objects are created automatically and\
    \ some of the menu options are set up to respond when you select them. In this\
    \ example, this happens without supporting code. You can choose to add code to\
    \ access objects loaded from a nib. If you don’t, the objects are still loaded\
    \ and created in memory, but you can’t directly access their properties or methods.\n\
    \nLoading objects from a nib is an example of *dynamic loading* in Objective-C.\
    \ Objects can be loaded and released at run time, and it’s possible to reconfigure\
    \ the architecture of an application as it runs. Typically, Interface Builder\
    \ manages part of this process, and the rest is implemented with code.\n\n# ##\
    \ Designing objects\n\nProperties can be traditional C data types, custom or predefined\
    \ structs, or objects. There’s no limit on the number of properties in a class,\
    \ but objects with hundreds of properties are unwieldy and may need to be redesigned.\n\
    \nThere is also no restriction on the complexity of a method. A method interface\
    \ can hide deep complexity, and method code can access the properties and methods\
    \ of other objects. Good method design hides complexity by creating interfaces\
    \ and results that are easy to understand, and which encapsulate a useful return\
    \ in a simple way.\n\nIt’s good practice to define class, property, and method\
    \ names that are explicitly descriptive and easy to understand, even when this\
    \ means extra typing. This improves code clarity and can help simplify object\
    \ design. For example, extended variations of sumOfxyz might return the result\
    \ as a string:\n\n```\n    sumOfxyzAsBinaryString\n    sumOfxyzAsHexString\n \
    \   sumOfxyzAsDecimalString\n```\n\nCocoa often uses descriptive names for its\
    \ objects and methods. It’s bad practice to create ambiguous or imprecise names:\n\
    \n```\n    sum // Sum of what?\n    Total\n    sumAsString //What kind of string?\n\
    \    returnValue\n```"
  merge: -1
  img_proc: true
- pgno: 122
  md: "# Naming conventions\n\nBy convention, class and function names use UpperCamelCase\
    \ while instance, method, property, and general data-type names use lowerCamelCase.\
    \ Spaces are not allowed, but underscores are. It’s useful to explicitly include\
    \ the type of class of an object or data structure in its name.\n\n> **NOTE**\n\
    > \n> *Supposedly CamelCase gets its name from the double hump of the two capitals.\
    \ It has a more formal name — medial capitals — but this lacks alliteration, has\
    \ twice as many syllables, and doesn’t mention an animal, making it harder to\
    \ remember. CamelCase isn’t enforced by the compiler, but it is a standard naming\
    \ convention.*\n\nCocoa classes and features are named using UpperCamelCase with\
    \ an optional additional framework prefix. For example, the Cocoa/NeXTStep classes\
    \ are prefixed with NS, an abbreviation for NeXTStep:\n\n```\nNSWindow\nNSViewController\n\
    NSBrowserDelegate\n```\n\nOther OS X libraries have their own prefixes. Because\
    \ of overlaps, the naming scheme is slightly random. For example, CoreAudio items\
    \ begin with Audio and not CA, which is used by the Core Animation library.\n\n\
    > **CAUTION**\n> \n> *Not every Cocoa feature prefixed with NS is an object. Most\
    \ are, but there are common exceptions. For example, NSInteger is a wrapper for\
    \ a standard int. For details of the exceptions, see the Foundation Framework\
    \ Reference in the developer documentation. The Other References group lists the\
    \ C functions, C data types, and constants that are used in Cocoa but aren’t defined\
    \ as objects.*\n\nBecause names are descriptive, they can be long. For example:\n\
    \n```\nCFAbsoluteTimeGetDifferenceAsGregorianUnits\n```\n\nis a function in the\
    \ Core Foundation Time Utilities library. Constants in Cocoa are prefixed with\
    \ a k followed by a library prefix, followed by a long name, for example:\n\n\
    ```\nkCFAbsoluteTimeIntervalSince1970\n```\n\nIt’s helpful to follow the conventions\
    \ in your own class definitions. If you create your own custom frameworks, it’s\
    \ essential to add a unique abbreviation prefix.\n\nThere’s no formal designation\
    \ for developer-created objects. Many developers use a, my, and this as prefixes\
    \ to indicate instances created in their code.\n\n```\naWindow\nmyView\nthisDictionary\n\
    ```\n\nThis is informal, but works well for simple projects."
  merge: -1
  img_proc: true
- pgno: 123
  md: "Alternatively, developers can use their initials or a unique two-character\
    \ or three-character acronym to identify their classes. This is helpful when working\
    \ on collaborative projects because names such as aWindow may already be in use.\
    \ For example:\n\n```\nRWWindow\nCDRObject\nCDRView\n```\n\n# Object constructors\
    \ and pointers\n\nObjective-C uses C’s asterisk pointer convention, as illustrated\
    \ in Figure 5.3. A pointer name can be any string that is unique within its scope,\
    \ but it’s useful to include the class name as a suffix. For example, a pointer\
    \ to an instance of class Foo is declared like this:\n\n```\nFoo *aPointerToFoo\
    \ = ...//This is traditional\n```\n\n**Figure 5.3**\n\naPointerToFoo is a variable\
    \ that holds a memory address. The exact data type depends on whether the application\
    \ uses a 32-bit or 64-bit memory model. It’s legal, and occasionally useful, to\
    \ compare or manipulate pointer addresses directly.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_123_0.png)\n\
    \nA unique pointer is generated whenever a new instance of a class is created.\
    \ Objective-C doesn’t support formal constructors. Instead objects are created\
    \ using a standard code idiom that runs two methods called alloc and init to return\
    \ a pointer to an instance of a class. alloc creates an instance of an object,\
    \ and init initializes it. The methods are always nested, as shown here:\n\n```\n\
    Foo *aPointerToFoo = [[Foo alloc] init]; //Do this\n\nFoo *aPointerToFoo = [Foo\
    \ alloc];\n    aPointerToFoo = [aPointerToFoo init]; //Don't do this\n```\n\n\
    The first version appears throughout Cocoa code. With occasional exceptions, described\
    \ next, you can use this code as-is to create Cocoa objects."
  merge: -1
  img_proc: true
- pgno: 124
  md: "```\n```objective-c\n//Create a new instance of NSView\nNSView *aView = [[NSView\
    \ alloc] init];\n```\n```\n\n# Understanding alloc, init, and nesting\n\nFigure\
    \ 5.4 illustrates how alloc and init work together. [class alloc] returns a pointer\
    \ to an instance of Class. But because the code is nested—the return from [aClass\
    \ alloc] is passed directly to init—this pointer doesn’t need an explicit name.\n\
    \n> **CAUTION**\n> \n> `init` here means initialization method. Some `init` methods\
    \ take parameters. This doesn’t alter the idiom; as long as the `alloc` and `init`\
    \ methods are nested, the code is correct.\n\n# Figure 5.4\n\nThe `alloc` message\
    \ runs on the Foo class and returns an instance. The `init` method runs on the\
    \ instance and returns a pointer to an initialized instance, which may—sometimes—be\
    \ different than the pointer returned by `alloc`. Nesting `alloc` and `init` guarantees\
    \ that the final pointer is usable.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_124_0.png)\n\
    \nGenerally, you can use nesting to avoid creating temporary pointers. It’s good\
    \ practice to include one or two levels of nesting. It’s bad practice to nest\
    \ more than three levels because the code becomes difficult to follow. Unfortunately,\
    \ because of Cocoa’s syntax, deeper nesting is sometimes unavoidable.\n\nSample\
    \ code that uses the new instance might look like this:\n\n```\n```objective-c\n\
    [aPointerToFoo setx: 1];\n[aPointerToFoo sety: 2];\n[aPointerToFoo setz: 3];\n\
    int aTotal = [aPointerToFoo sumOfxyz];\n```\n```"
  merge: -1
  img_proc: true
- pgno: 125
  md: "You might create another instance with\n\n```\nFoo *aDifferentPointerToFoo\
    \ = [[Foo alloc] init];\n```\n\nfollowed by similar code using the aDifferentPointer\
    \ instance:\n\n```\n[aDifferentPointerToFoo setx: 15];\n//Etc...\n```\n\nIt’s\
    \ critically important to understand that pointer variables aren’t identical to\
    \ instances. A pointer is a size_t integer that points to the memory used by an\
    \ object instance and is used as a reference to it. Misunderstanding this can\
    \ result in code that leaks memory or crashes. If a pointer is overwritten before\
    \ an object is released from memory, the object’s memory is lost. This becomes\
    \ very important on the iPhone where memory is managed manually. But overwriting\
    \ a pointer can create a memory leak in a Mac application, even with garbage collection.\n\
    \n# Class and instance methods\n\nA class template is equivalent to a type definition.\
    \ In the same way that two named ints are different entities, the two instances\
    \ of Foo are completely distinct and independent. They use the same template,\
    \ but there is no other connection between them.\n\nMost objects are designed\
    \ to be used as instances, and the class itself is a template with no active features.\
    \ But some Cocoa objects include class methods that are run on the class and not\
    \ on an instance. Certain class methods return an object without using a alloc,\
    \ for example:\n\n```\nNSDate *now = [NSDate date];\n```\n\nThis reads the date\
    \ and time from the system date object, writes it to an instance of NSDate, and\
    \ returns a pointer to it. It would be more consistent if the code looked like\
    \ this:\n\n```\nNSDate *now = [[NSDate alloc] init];\n```\n\nIn fact, this is\
    \ also valid. NSDate’s init method automatically returns the current date and\
    \ time. But the first version is used more widely, apparently for historical reasons.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_125_0.png)\n\n> **NOTE**\n> \n> Class\
    \ methods are often thread safe. Instance methods may not be thread safe. The\
    \ documentation doesn’t always detail the differences, so if your code supports\
    \ multi-threading, you may need to experiment to discover which option runs reliably.\
    \ For information about creating and managing threads, see Chapter 11.\n\nClass\
    \ methods are typically used to create objects — alloc is a class method — or\
    \ to return a pointer to a system object, such as the shared application manager\
    \ NSApplication. For example, running the sharedApplication class method on NSApplication\
    \ returns a pointer to the current application:\n\n```\n//Get a pointer to the\
    \ current application\n//and send it a terminate message to quit\n[[NSApplication\
    \ sharedApplication] terminate: nil];\n```"
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Subclassing and inheritance


    Cocoa is a library of prewritten classes that you can drop into your code. When
    you subclass an existing class, you create a new version of the class and use
    it as a starting point for your own additions. You can then add new features of
    your own, or override — write code that re-implements — some or all of its existing
    features.


    When you create a subclass, it inherits all the features of its parent. Before
    you begin to modify it, the subclass is a direct copy of the existing parent template,
    with all its properties and methods. It has a new name, but is functionally identical
    to its parent class.


    Inheritance and subclassing save you time. You don’t need to reinvent the wheel,
    or the window — you can reuse an existing class, extending it or modifying it
    as needed. Cocoa is designed to encourage this kind of customization. You can
    subclass almost any class, and some Cocoa classes are deliberately minimal with
    bare outlines of features, rather like a car chassis without a body, wheels, or
    seating.


    For example, the NSView class — UIView on the iPhone — includes a drawRect: method
    that can fill the view with graphics. By default, drawRect: is empty and does
    nothing. If you don’t add code to it, it continues to do nothing when the application
    runs. When you want to draw custom graphics in a window, you subclass NSView and
    fill out drawRect: with custom code. The new drawRect: overrides the old empty
    version.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_126_0.png)


    **TIP**


    Sometimes it’s easier to modify an existing class without creating a subclass.
    Objective-C includes a category feature that makes this possible. The name is
    misleading — no categories are categorized. Instead, an existing class is extended
    with new properties and methods. Unlike a subclass, the name doesn’t change, and
    the new features are added “in-place.” For a practical example, see Chapter 8.


    When you create a subclass, it becomes a new class in its own right. You can subclass
    it again, and then subclass the subclass indefinitely, without restrictions. You
    can also create multiple subclasses with different features from the same source
    class.


    Cocoa uses this feature to organize classes into a hierarchy or tree. At the root
    is the minimal object template class called NSObject. As illustrated in Figure
    5.5, classes spread out from NSObject in various branches. Each branch implements
    different but related features such as window and UI management, networking, data
    management, and so on. The further away from NSObject a class gets, the more specialized
    it is.


    The complete NSObject hierarchy includes more than 100 objects. The developer
    documentation includes information about each class’s place in the hierarchy and
    the classes it inherits its features from. You don’t need to memorize the class
    relationships, but you do need to be aware of them, and an outline understanding
    of the class hierarchy is useful.'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# ### Figure 5.5


    A very small part of the NSObject subclass hierarchy. For a complete view, see
    http://developer.apple.com/mac/library/documentation/Cocoa/Reference/Foundation/ObjC_classic/Intro/IntroFoundation.html.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_127_0.png)


    Figure 5.6 uses NSButton as an example. Under the reference title you can see
    an *Inheritance* field with a list of classes. This list tells you that NSButton
    includes all the properties and methods listed in its own class reference, and
    that it also implements all the properties and methods built into NSControl, NSView,
    NSResponder, and NSObject.


    These extra methods and properties aren''t listed on the NSButton page — to find
    them, you have to read the reference pages for the other classes. It''s good practice
    to do this, especially when you''re new to Cocoa programming, because it helps
    to fix an outline of the hierarchy in your memory. It also expands your ideas
    about what''s possible. For example, you can use NSView methods to animate instances
    of NSButton, changing their size to make them pulse, or changing their position
    to make them jiggle in an iPhone-like way. Working through the subclassing hierarchy
    isn''t only a technical process, it can also be a creative way to discover new
    possibilities for your application.


    > > **NOTE**

    > >

    > > The *Conforms to* field lists a separate set of optional methods that can
    be used in subclass code.'
  merge: -1
