  md: '# Using the bit.ly API


    Before you can use the bit.ly API, you need to find some documentation for it.
    You can find details of most public APIs with a Google search. You can find the
    bit.ly API documentation at `http://code.google.com/p/bitly-api/wiki/ApiDocumentation`,
    as shown in Figure 10.9.


    # Figure 10.9


    Finding the bit.ly API reference documentation. Some APIs are public and open
    source, so the documentation isn’t necessarily available on the main Web site.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_272_0.png)


    The documentation suggests that there are a number of API features: you can shorten
    a URL, you can find out how many times it has been clicked, you can expand a short
    URL into a long URL, and so on.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_272_1.png)


    # TIP


    Documentation quality is very variable. Some APIs have very clear documentation
    with examples; others are opaque. Examples are usually helpful; if you can’t find
    them in the documentation, try searching for them elsewhere online.'
