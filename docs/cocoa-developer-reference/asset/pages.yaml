  md: '# Everything You Need to Craft

    Killer Code for Apple Applications


    Whether you are a seasoned developer or just getting into the Apple platform,
    Wiley’s Developer Reference series is perfect for you. Focusing on topics that
    Apple developers love best, these well-designed books guide you through the most
    advanced and very latest Apple tools, technologies, and programming techniques.
    With in-depth coverage and expert guidance from skilled authors who are proven
    authorities in their fields, the Developer Reference series will quickly become
    your indispensable Apple development resource.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_625_0.png)


    The Developer Reference series is available wherever books are sold.'
