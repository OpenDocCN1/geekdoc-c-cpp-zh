- pgno: 48
  md: "# Developing features across layers\n\nDivisions between layers aren’t clean\
    \ or simple — there’s no discrete “graphics framework” or “animation framework.”\
    \ Instead, animation features are spread across the Cocoa layer, the Media Layer,\
    \ and Core Graphics. Similarly, you might expect Core Graphics to be in the Media\
    \ Layer, but for historical reasons it’s included in the Application Services\
    \ framework in the Core Services Layer.\n\nSo adding a feature to an application\
    \ usually means mixing code and features from different frameworks. It’s not unusual\
    \ to use Cocoa to create a user interface, Core Graphics to draw dynamic elements\
    \ in the interface, and Core Animation to animate the graphics.\n\nThere is also\
    \ some duplication between layers; for example, you can play sound using the Core\
    \ Audio or AudioToolbox layers. This may seem redundant, but these layers offer\
    \ different features. Audio Toolbox implements simple file player objects with\
    \ limited features, while Core Audio includes more complex objects that are more\
    \ difficult to work with, but can be used for more challenging applications such\
    \ as real-time sound synthesis.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_48_0.png)\n\
    \n> **TIP**\n> \n> The organization of the frameworks would be very confusing\
    \ if you had to use all of them all the time. In fact you only need to master\
    \ a handful of frameworks. Once you know how to create and control a window, add\
    \ controls, manage mouse clicks and keyboard events, and draw graphics and perhaps\
    \ add sound, you’ve covered the basics — and they’re not difficult. The rest is\
    \ useful and interesting, but optional.\n\n# “Toll-free bridged” layers\n\nSome\
    \ of the objects offer more fundamental duplication. For example, NSString in\
    \ Cocoa is closely related to CFString in the Core Foundation framework. Some\
    \ objects are explicitly described as toll-free bridged — Apple’s way of indicating\
    \ that objects and their interfaces are largely interchangeable, even though they\
    \ exist in different layers.\n\nIn fact, many Cocoa objects are simply wrappers\
    \ for lower-level functions that are listed in other frameworks. You can ignore\
    \ this if you develop exclusively in Cocoa, and you can also ignore the lower-level\
    \ functions unless you need to work with them. But it’s useful to be aware of\
    \ the relationship because even when class features are duplicated, they’re rarely\
    \ duplicated exactly. Related frameworks always offer a different balance of features\
    \ and accessibility, and it’s sometimes possible to use a lower-level framework\
    \ to solve a problem that can’t easily be solved in Cocoa.\n\n# Using frameworks\
    \ and layers successfully\n\nIf you’re new to Cocoa development, you’ll have realized\
    \ now that the layer model is only a very rough guide to OS X. In practice, you’ll\
    \ often find yourself digging through the framework reference documentation to\
    \ combine features in different layers. But with the overwhelming number of objects\
    \ and libraries in OS X and the slightly chaotic organization, it can be difficult\
    \ to get a feel for how to approach problems when starting out with Cocoa."
  merge: -1
  img_proc: true
- pgno: 49
  md: '![](img/2b293e29fc15b0797f113b85dd429b6e_49_0.png)


    # TIP


    It’s easy for new developers to feel overwhelmed by the number of frameworks and
    objects. No one with a normal human IQ can remember the entire OS X documentation
    set. A more practical learning strategy is to master an outline of the relationships
    between the most useful frameworks in OS X, and then find the rest of their details
    in the documentation when necessary. You don’t need to remember *everything* —
    but it’s helpful to remember where to look when you need to find something.


    Table 2.4 shows a simplified view of the OS X layers that strips them down to
    essentials. This model doesn’t match Apple’s own classification scheme, but it
    does match how you’re likely to work with layers in practice. In a typical application
    you’ll use the Cocoa Layer to build an application skeleton and to manage key
    application events and data, and you’ll use the Services Layer to manage media
    and data. Many applications ignore the OS Layer completely, or they hardly ever
    access it. You’ll need to work with it if you create or manage drivers or access
    the Mac’s hardware features. Otherwise, you can ignore most of its features.


    | Framework | Interface | Applications and Elements |

    |---|---|---|

    | “Cocoa Layer” | Objective-C objects and methods | Window, interface, and application
    management; high-level media features; packaged animation effects; object-oriented
    data; high-level Web and network access; high-level timer and thread control.
    |

    | “Services Layer” | C functions and data structures | Low-level media features,
    including basic graphic primitives and customized animations; C-type data structures;
    low-level Web and network access. This layer duplicates some of Cocoa’s features
    with an alternative C function interface. |

    | “OS Layer” | C functions and data structures | Useful functions that aren’t
    included in the other layers, such as random number generation. Socket-level Web
    and network access; system and hardware access; low-level process and thread control.
    |


    Switching between layers as you work is standard practice. You can simplify development
    by understanding that most Mac applications are a mix of Objective-C objects and
    standard C function calls, that there’s some feature duplication across the layers,
    and that the further you get from the user, the more you’ll be using OS X’s C
    libraries rather than Cocoa. Figure 2.4 shows a common workflow.'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# Figure 2.4


    There’s no single standardized way to create an OS X application, but this outline
    workflow format is widely used. In practice, most projects iterate around at least
    some of the steps.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_50_0.png)


    # Cocoa and the Framework Story


    If the organization of the frameworks seems less than streamlined, that’s because
    it is. The OS X frameworks are a combination of new development and ancient history.
    In the same way that Carbon was included to simplify backward compatibility, other
    frameworks were added at various stages in the NextStep/OS X development story
    for reasons that were relevant at the time but may be less pressing now.


    Like most operating systems, OS X is an example of computing archaeology. Not
    only are the legacy layers less complex and less abstracted than Cocoa, but they’re
    also older. If you’re finding it hard to understand which frameworks are essential
    and which are optional, you’ll find this information in the rest of this book,
    which highlights the key elements of Cocoa and OS X.


    Occasionally you may use a specialized framework to add a very specialized feature
    such as speech synthesis to your application. Generally, you can ignore the more
    specialized frameworks. You can also ignore many of the older frameworks because
    their features have been duplicated and simplified in Cocoa.


    In outline, you’ll use the Cocoa layer constantly, the Services layer regularly
    — some elements are essential, while others are barely used — and the OS layer
    only occasionally. As you gain more experience, you’ll find the older layers become
    simpler to understand and easier to work with.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Cocoa on the iPhone and iPad


    The iPhone and iPad use Cocoa Touch, which is a development and reinvention of
    Cocoa. Compared to OS X, iPhone OS offers a drastically simplified collection
    of frameworks. Cocoa Touch is less complex than Cocoa, with a smaller library
    of objects, simpler windowing, and fewer data objects, as shown in Figure 2.5.


    However, both platforms make similar assumptions about application design and
    use the same concepts and design ideals. Cocoa Touch applications are less complex
    and more limited than Mac applications, but they''re not fundamentally different.
    If you''re familiar with one environment, you can move easily to the other. Instead
    of learning a new language, you can make the change by extending or modifying
    your vocabulary.


    Figure 2.5


    iPhone apps are simpler than OS X apps, and may not need to use the C-function
    layers. This Zettaboom app is built entirely from Cocoa Touch components.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: "# Moving to Cocoa and Objective-C from Other Platforms\n\nThe Web has created\
    \ an explosion of interest in software development. There are many scripted and\
    \ programmed environments to choose from, but historically, most are object-oriented.\
    \ Developers are finding that competing platforms use related coding principles\
    \ and that existing skills are transferable. If you have experience with another\
    \ object-oriented language, you should find Objective-C rewarding and relatively\
    \ straightforward.\n\nBut Cocoa’s libraries are the result of some unusual ideas\
    \ about OS design. Cocoa code is easy to follow, but the ideas that inspired the\
    \ syntax are unique, with no equivalents in other environments. To use Cocoa effectively,\
    \ you must understand them. Objective-C also has unique features that aren’t available\
    \ in other languages.\n\nApple’s developer documentation lists a number of a formal\
    \ design patterns — relationships between events, responses, code, and data —\
    \ that have influenced the development of Cocoa and OS X. Apple’s list is partly\
    \ historical and academic, and unfortunately it doesn’t fully explain some of\
    \ the patterns, data structures, and principles that are used in Cocoa and OS\
    \ X. Experienced developers may be able to pick them up by reading between the\
    \ lines, but newcomers can benefit from a more detailed introduction.\n\nObjective-C’s\
    \ language features are described more formally in Chapter 5, and Cocoa’s elements\
    \ are explored in the rest of this book. This chapter includes an overview of\
    \ Cocoa and Objective-C for users of other languages. Use it as a cheat sheet\
    \ that lists essential features that you must learn and be familiar with. Once\
    \ you’ve read this section, you’ll find it easier to get started with the official\
    \ documentation. All the features introduced here are discussed in later chapters\
    \ with practical examples, so consider this section a first look. More detailed\
    \ hands-on explanations follow.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_52_0.png)\n\
    \n> **TIP**\n> \n> Don’t skip this section! You’ll find this summary invaluable\
    \ because it tells you key details that you need to know. The developer documentation\
    \ is less focused and includes unnecessary detail that will distract you when\
    \ you’re starting out. Although this section is a first-look summary, there’s\
    \ a lot to take in. Feel free to return to it as you work through the examples\
    \ later in this book.\n\n# Working with Objective-C objects and messages\n\nObjective-C\
    \ is object-oriented like Java, C#, and C++. Objects include both methods and\
    \ properties, and they are split into class abstractions and specific instances.\
    \ Inheritance and subclassing are supported and encouraged. The syntax and file\
    \ structure used to define objects is slightly different from that used in other\
    \ languages, but the concepts remain familiar and recognizable. If you have experience\
    \ with object-oriented programming in other languages, you already understand\
    \ enough about the fundamentals of Objective-C to be off to a successful start."
  merge: -1
  img_proc: true
- pgno: 53
  md: "Cocoa applications rely heavily on subclassing. In Objective-C, subclassing\
    \ is a synonym for customization. When you subclass an object, you re-implement\
    \ — override — some of its existing features and add new features of your own.\
    \ Some Cocoa objects are explicitly designed for subclassing and include method\
    \ stubs that you must flesh out with your own code.\n\nOne unusual feature of\
    \ Objective-C classes is class messaging. In other languages, you create instances\
    \ of class objects and send messages to the instances. In Objective-C, classes\
    \ exist as meta-objects in their own right. They can include class methods that\
    \ are run on the class itself. This feature is often used when creating objects:\
    \ you send a creation request to the class in a message, and the class creates\
    \ an instance of an object and returns a pointer.\n\n# ## Objective-C messaging\n\
    \nIn Objective-C, messaging is a fundamental feature. Instead of running a method\
    \ on an object, you send it a message that triggers the method. Messages are events,\
    \ not function calls. They are asynchronous; that is, messages can happen at any\
    \ time and aren't tied to a sequential program flow.\n\n> **NOTE**\n> \n> It’s\
    \ a useful simplification to pretend that messages are sent and processed instantly.\
    \ Of course, real code takes time to run. But to a first approximation, Objective-C\
    \ tries to hide this from you. To a more advanced and accurate approximation,\
    \ Cocoa code can run in separate threads, and Cocoa includes thread-management\
    \ features that can control the timing of events and messages. But until you begin\
    \ working with threads, processes, timers, and performance profiling, it’s useful\
    \ to ignore the time-dependent elements of Cocoa code and assume that events are\
    \ processed instantaneously.\n\nThe following is a list of the most common ways\
    \ in which messaging is used in Objective-C. Some will be familiar from other\
    \ languages. Others are less traditional.\n\n+   - **Getting an object property.**\
    \ The only way to read an object property is by sending it a message and asking\
    \ for a return. There is no direct-read feature in Objective-C, because objects\
    \ are opaque — their internal workings aren't visible to other objects. If you\
    \ want to make a property visible in your own objects, you must add code to make\
    \ it so.\n+   - **Setting an object property.** In the same way that you must\
    \ add code to read a value, you must also add code to set it. Typically, setting\
    \ a property doesn't just save it to memory, it also triggers a behavior, which\
    \ may ripple through related objects. For example, setting an object's position\
    \ moves it on the screen automatically. In a less straightforward example, setting\
    \ a single object's position can automatically change the positions of other objects\
    \ associated with it so that they move as a group. Cocoa handles many of these\
    \ interactions automatically. As long as you initialize and arrange your objects\
    \ correctly, you can use Cocoa to simplify and automate some of their responses.\n\
    \n> **TIP**\n> \n> Creating setter and getter code — as it's known — can be a\
    \ repetitive chore. Objective-C includes a `@synthesize` directive that makes\
    \ boilerplate setter and getter code unnecessary. `@synthesize` works like a macro.\
    \ It takes a list of properties and automatically creates setter and getter code\
    \ for them. The code doesn't appear in your source file, but it does appear in\
    \ the application and is visible while debugging. When an object is synthesized,\
    \ it appears to have simple readable properties, but in fact these properties\
    \ are still accessed through getter code."
  merge: -1
  img_proc: true
