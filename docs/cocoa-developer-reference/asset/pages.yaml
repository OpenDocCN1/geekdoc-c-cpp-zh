- pgno: 237
  md: "SEL is the associated data type. You can define a SEL variable and use it in\
    \ place of a literal selector.\n\n```\nSEL theSelector;\nif (aCondition)\n   \
    \ theSelector = @selector(methodOne:);\nelse\n    theSelector = @selector(methodTwo:);\n\
    anObject.action = theSelector;\n```\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_237_0.png)\n\
    \n# CAUTION\n\n**SEL doesn’t define a pointer. Don’t put an asterisk in front\
    \ of a SEL variable.**\n\n# Using selectors in code\n\nTarget-action is often,\
    \ but not exclusively, used with subclasses of NSControl. This includes most UI\
    \ objects such as buttons, menus, and sliders. This code is valid for all of its\
    \ subclasses:\n\n```\n[aControl setTarget: anObject];\n[aControl setAction: @selector(aMethod:)];\n\
    ```\n\nWhere aControl is @synthesized, dot syntax is also valid.\n\n```\naControl.target\
    \ = anObject;\naControl.action = @selector(aMethod:);\n```\n\nYou can read an\
    \ action and compare it with a selector directly with ==:\n\n```\nif (aControl.action\
    \ == @selector(aMethod:)) {...}\n```\n\nYou can use this to test whether you need\
    \ to modify the selector or to process an event according to the current selector\
    \ state.\n\nA property called continuous is an optional feature implemented in\
    \ NSControl. When continuous is TRUE, a control fires its selector while the user\
    \ holds the mouse down. Otherwise, it generates one single message for each click.\
    \ Use this feature to implement auto-increment and auto-decrement.\n\n# Understanding\
    \ the limitations of selectors\n\nThe action system has an obvious limitation:\
    \ you can’t use it to pass parameters to the target method. Some variants of target-action\
    \ support an extended syntax with an extra parameter that can pass an object to\
    \ the selector:\n\n```\n[anObject setAction:\n@selector withObject: anObjectUsedAsAParameter];\n\
    ```"
  merge: -1
