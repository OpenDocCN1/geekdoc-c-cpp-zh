- pgno: 424
  md: '# # 16 Managing Views and Creating 2D Graphics


    Cocoa and Cocoa Touch have impressive graphics capabilities, but from a developer''s
    point of view, the graphics frameworks are a maze of semicompatible technologies
    with inconsistent interfaces. The designers of each framework have reinvented
    fundamental concepts, such as size, position, and orientation, and packed them
    into incompatible data structures.


    One of the most frustrating challenges in graphics programming is the almost constant
    need to move data between objects and data structures that should be "toll-free
    bridged," but aren''t.


    For example, Cocoa''s NSRect and Core Graphics''s CGRect structures define a rectangle
    with identical components: an origin, a width, and a height. In spite of the similarities,
    you can only move data between them by calling a pair of conversion functions:
    NSRectToCGRect and NSRectFromCGRect.


    Similarly, NSPoint and CGPoint — two data structures that define an x, y coordinate
    — are incompatible, even though the only difference between them is their name.


    The function that packs two floats into a CGPoint is called CGPointMake. The equivalent
    function that creates an NSPoint is called NSMakePoint.


    Image support is also inconsistent. Cocoa defines an NSImage type for handling
    image data. The Core Graphics framework uses a different CGImage type. Core Image
    filters use yet another CIImage type. Functionally, these data types are used
    in equivalent ways. You can load them with data from a file or other data source
    and draw the data into a view, but their contents aren''t compatible or interchangeable.


    One final source of confusion is that Cocoa''s graphics system combines data structures
    and objects. NSRect is a data structure. NSBezierPath, used to define paths and
    shapes, is an object. You don''t need to alloc/init an NSRect, but you do need
    to allocate and initialize an instance of NSBezierPath. Inevitably, this creates
    confusion.


    # ### 16 In This Chapter


    +   - Understanding the view hierarchy

    +   - Handling mouse events

    +   - Understanding geometry in Cocoa graphics

    +   - Creating and drawing paths

    +   - Using CoreImage filters'
  merge: -1
  img_proc: true
- pgno: 425
  md: 'Unfortunately these inconsistencies are unavoidable and there is no way to
    work around them. The graphics frameworks do not support low-level access to useful
    values; for example, there is no equivalent of a point, line, or rectangle plot
    with literal float or int values. To use the frameworks, you must pack values
    into data structures and objects, and then pass the packed data to a function
    or method.


    While it’s possible — barely — to solve many problems exclusively with Cocoa’s
    own graphics features, more typically you’ll use a combination of frameworks.
    To do this successfully, you must understand the different data structures and
    objects that are used, and you must be familiar with the many data packing, conversion,
    and translation helper functions that are available. You must also understand
    how the frameworks use the basic graphics canvas: the view object.


    # Understanding Windows and Views


    The typical structure of a Cocoa UI is shown in Figure 16.1. The window is the
    master container. It handles window-specific messages, such as window drag events
    and minimize, open, and close operations.


    You can design an application by adding visible objects to a window. More typically,
    you use a content or container view, and place the objects inside the container.
    This is optional for very simple applications with a single window and a very
    minimal feature set. In more complex applications, it simplifies event handling
    and makes it possible to fill the view with custom graphics and animation effects,
    drawn with methods and functions that aren’t supported in NSWindow.


    # Figure 16.1


    A typical UI structure, with a content view inside a window. This structure is
    created automatically when you create a new project from the blank template.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_425_0.png)'
  merge: -1
  img_proc: true
- pgno: 426
  md: 'The container view is usually subclassed so that you can add code to it to
    handle mouse and other events. Optionally, you can also create custom graphics
    and animation effects. Sometimes it’s useful to subclass the main window object
    as well, but this is done less frequently.


    The container view holds a tree structure of subviews, as shown in Figure 16.2.
    It may also include other custom graphics. Subviews typically manage the UI and
    allow user interaction. Custom graphics can include image files loaded from disk
    or from the Internet and dynamically generated shapes with colors, textures, and
    gradients.


    # Figure 16.2


    An example of the view structure from a real application: the TwinFilter project
    described later in this chapter. The main view has been subclassed and it contains
    a selection of interface objects that create a UI. It also contains another subclassed
    view that generates custom graphics: a filter effect applied to an image.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_426_0.png)


    Table 16.1 summarizes the different objects associated with views.


    | Object | Application |

    |---|---|

    | `NSWindow` | Sets the application title, handles open/close/minimize/maximize
    events. Can handle mouse events, but usually doesn’t, except in very simple applications.
    |

    | `NSPanel` | A special simplified floating auxiliary window for application panes
    and panels. Can be used for pop-up alerts. |

    | `NSView` | The main view object. Usually subclassed. Handles mouse events and
    other UI events. Includes a `drawRect:` method that can draw custom graphics.
    Can include other view objects to create a view hierarchy that can be modified
    dynamically. |'
  merge: -1
  img_proc: true
- pgno: 427
  md: '**Table 16.1 Continued**


    | Object | Application |

    |---|---|

    | `NSControl` | A superclass of objects that create user controls, including buttons,
    sliders, and other UI objects. Controls are placed “inside” the view hierarchy.
    They generate user events that are handled by the view. |

    | `NSViewController` | An optional invisible container object for views. Used
    to switch views, often by loading them from a nib on demand. Setting a controller’s
    view property makes a view visible. Also used to implement advanced page and printfacts
    in document-based applications. |

    | `NSResponder` | An abstract class that defines the messages and events that
    any view can handle. Implements message handling by adding `NSResponder` method
    signatures to a view and filling them out with custom code. |


    # Understanding the view hierarchy


    The nib structure illustrates how the view hierarchy is assembled. When you place
    an object “inside” a view, it’s added to a tree structure. The main view object
    is the root of the tree. Other objects, called subviews, are placed lower down
    the tree.


    When you load a nib, you load this structure and it appears in the application’s
    window. But it can be modified dynamically to add and remove objects. Views can
    also be repositioned and resized dynamically. To add code that can implement these
    features, you must subclass the root view.


    # Subclassing the root view


    To subclass the root view, begin by creating a new project. Save it as **EmptyView**.
    By default, it has the nib structure shown in Figure 16.1. Ignore the MainMenu
    item — in this chapter you’ll concentrate on the contents of the window.


    To subclass it, right-click the Classes group and choose Add ▷ New File. Select
    the Mac OS X Cocoa Class option, and then select NSView in the pop-up menu in
    the middle of the window, as shown in Figure 16.3. Save it as **NewView**.


    Figure 16.4 shows the result. The NSView template includes a couple of extra methods
    that aren’t included in the file when you subclass NSObject. The `initWithFrame:`
    method is called when a new instance of the view is allocated.'
