    ![](img/2b293e29fc15b0797f113b85dd429b6e_181_0.png)


    > **CAUTION**

    > Interface Builder displays independent nib elements in separate preview windows,
    so an application''s menu always appears separately. It''s considered an independent
    feature that isn''t associated with a window, and it has a special preview window
    that enables you to test the menu design dynamically. However the preview doesn''t
    support editing — you can only add, remove, and rearrange menu items in the Doc
    window.


    It''s important to understand that only some of the items in the Doc window can
    be edited in an Edit window. For example, if you double-click the `NSApplication`
    object in the Doc window, nothing happens. It only exists in code, and code is
    edited in Xcode, not in IB. Typically only menus, windows, and preference panes
    can be edited visually.


    # Introducing the Library window


    The Library window is a list of resources that can be included in a nib file.
    It has three tabs: *Objects*, *Classes*, and *Media*. When you design a nib file,
    you''ll use the Objects tab regularly and the Classes and Media tabs much less
    often.


    The Objects tab, shown in Figure 7.8, displays a scrollable list of objects that
    you can add to a window to create a Cocoa interface. To add an object to a nib,
    drag it from this window to the Doc window and release it. The Doc window automatically
    enforces valid object trees. You can drop any object at the root level of a nib
    file, but only selected objects can be dropped inside other objects. For example,
    you can''t drop an instance of `NSApplication` inside a window, because — not
    surprisingly — windows can''t contain applications.'
