- pgno: 387
  md: '# ## Understanding Core Data’s objects and programming model


    Core Data uses three objects to define its working environment, which are listed
    in Table 14.1. If you use the Core Data template and Xcode editor for your project,
    the persistent store coordinator and the managed object model “just work.” You
    do, however, need to access the managed object context to read and write data.


    **Table 14.1 Core Data Environment Objects**


    | Object | Application |

    |---|---|

    | `NSPersistentStoreCoordinator` | Archives and unarchives data, and keeps saved
    and live data synchronized. You can ignore this object in the Core Data template.
    The boilerplate code initializes it for you and it works automatically. |

    | `NSManagedObjectModel` | The collection of entities, properties, relationships,
    and other features used in the data model. The managed object model defines how
    the data is organized, but doesn''t store the data — it''s a template for the
    model. Don''t change the model dynamically. It''s best to leave model management
    to the model editor in Xcode. |

    | `NSManagedObjectContext` | The complete database, with data. The template creates
    a context automatically. An application can use more than one context — but usually
    one is enough. |


    The Core Data classes used to read and write data are shown in Table 14.2.


    **Table 14.2 Core Data Objects used for Editing and Searching**


    | Object | Application |

    |---|---|

    | `NSManagedObject` | A wrapper for entity objects that plugs them into the archiving
    and editing features built into Core Data. Sometimes you need to access a managed
    object directly. At other times you access its associated entity description object.
    Supports Key-Value Coding (KVC). |

    | `NSEntityDescription` | Defines the name, property list, and relationships of
    a named entity. A managed object holds data, its entity description describes
    how it''s organized. |

    | `NSFetchRequest` | A wrapper for a search. The search request is sent to a context,
    which returns an array of objects that match the search criteria. |

    | `NSPredicate` | A predicate object that defines the details of a search request.
    It holds the low-level details of search strings or patterns, matching criteria,
    case sensitivity, and so on. |

    | `NSSortDescriptor` | An object that specifies how search results should be sorted.
    Optionally, it can be passed to a predicate object before a search request. |'
  merge: -1
  img_proc: true
- pgno: 388
  md: "# Creating fetch requests\n\nTo read data, create a fetch request and pass\
    \ it to the managed context. Fetch requests can be complex, and the code interface\
    \ isn’t intuitive, but in outline, there isn’t any more to searching than creating\
    \ a request, setting its parameters, passing it to the context, and reading the\
    \ results.\n\nSample code is shown below:\n\n```\nNSEntityDescription *albumEntity\n\
    = [NSEntityDescription entityForName:@\"Album\"\ninManagedObjectContext:managedObjectContext];\n\
    NSFetchRequest *theRequest = [[NSFetchRequest alloc] init];\n[theRequest setEntity:albumEntity];\n\
    returnArray = [managedObjectContext\n    executeFetchRequest:theRequest error:&error];\n\
    ```\n\nIn the context of your model, this code runs the simplest possible search.\
    \ returnArray returns a list of all Album entities in the context; that is, a\
    \ list of all albums. You can then process the array to further extract values\
    \ from it.\n\n# Using predicates\n\nTo narrow the search, you can add a predicate\
    \ to the search request:\n\n```\nNSPredicate *thePredicate =\n[NSPredicate predicateWithFormat:@\"\
    Name == 'An Album Name'\"];\n\n[theRequest setPredicate:thePredicate];\n//Run\
    \ the search...\n```\n\nThe predicate syntax is complex, but recognizably similar\
    \ to regex matching, which it’s based on. predicateWithFormat: allows substitutions\
    \ with the usual withFormat: options. Use this to search strings and other values\
    \ dynamically.\n\n```\nNSPredicate *thePredicate =\n[NSPredicate predicateWithFormat:@\"\
    Name == %@\", aString];\n```\n\nTable 14.3 shows some other examples. For more\
    \ information about predicate programming, see the Predicates Programming Guide\
    \ in the Cocoa documentation."
  merge: -1
  img_proc: true
- pgno: 389
  md: "**Table 14.3  Sample Predicate Search Strings**\n\n| Object | Application |\n\
    |---|---|\n| `like 'string'` | Searches for similar strings. A literal string\
    \ must include single quotation marks. |\n| `contains[c] 'ey'` | Finds all records\
    \ with \"ey\", ignoring case and diacritical characters; that is, non-English\
    \ characters with accent marks. |\n| `beginsWith 'A'` | Finds all records starting\
    \ with \"A.\" |\n| `ANY salary < 20000` | Returns the first found salary < 20,000.\
    \ No quotation marks are needed for numbers. |\n| `ALL salary > 1000000` | Returns\
    \ all salaries over a million currency units. (The units depend on the data and\
    \ the context.) |\n\n# Using sort descriptors\n\nSort descriptors can sort the\
    \ results into ascending or descending order with respect to named key. Descriptors\
    \ are passed in an array, so it’s possible — but not always useful — to specify\
    \ multiple descriptors.\n\n```\nNSSortDescriptor *sortDescriptor = [[NSSortDescriptor\
    \ alloc]\n    initWithKey:@\"Artist\" ascending:YES];\n[theRequest setSortDescriptors:\n\
    \    [NSArray arrayWithObject: sortDescriptor]];\n```\n\nA fetch request must\
    \ name an entity, and it may specify a predicate and a sort descriptor.\n\n> **TIP**\n\
    > \n> One of the biggest challenges for newcomers is the absence of a simple query\
    \ mechanism. There are no simple “Find me an object with the following properties”\
    \ methods. Instead, queries are handled with query objects, which have to be assembled\
    \ and packed for each query. You can make Core Data easier to work with by writing\
    \ query wrappers to simplify the code interface.\n\n# Creating to-many fetch requests\n\
    \nOften, you can use a simple predicate search to return an array of results.\
    \ No more code is needed.\n\nUnfortunately, Core Data doesn’t support searches\
    \ where the target is a to-many relationship — that is, where one item can be\
    \ linked to many others.\n\nFor example, if you want to filter albums by artist,\
    \ it would be natural to assume that you can do something like:"
  merge: -1
