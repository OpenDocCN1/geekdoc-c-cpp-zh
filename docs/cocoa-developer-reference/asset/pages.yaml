- pgno: 235
  md: '# ## Defining the data model


    Cocoa’s data collection objects — NSArray, NSDictionary, NSSet, and others — are
    designed to simplify data management. Key-Value Coding (KVC), described in detail
    later in this chapter, is one of the fundamental data access patterns. You must
    understand KVC to use Cocoa effectively, because it’s used by a significant selection
    of Cocoa objects. Custom data models often use KVC by default. Other design patterns
    are possible, but KVC is built into Cocoa and is a natural fit for data management.


    The data model should also support archiving — file save and load. Data archiving
    features are built into Cocoa objects, and it’s possible to save and load an instance
    of most classes, with their current property values. Some classes require extra
    code to implement this; others work as is. For more information, see Chapter 10.


    Cocoa also includes a more complex technology, called Core Data, that makes it
    possible to build a model that defines entities — object-like data containers
    with properties — and relationships that link entities to each other. Core Data
    is optional, but it offers the benefit of a persistent managed store of entities
    that can be saved and reloaded as a single combined object.


    Taken together, a good Cocoa data model should be the following:


    +   - **Archivable.** This is true by default for most objects.

    +   - **KVC compliant.** This gives Cocoa the best possible flexibility for data
    access.

    +   - **Built from standard data collection objects such as** `NSArray`. This
    simplifies archiving and also supports KVC compliance.


    While you can build a data model from standard C data types, it’s unlikely to
    meet these requirements. The code interface may be simpler, but it won’t support
    the features that Cocoa needs to access it efficiently. Without those features,
    MVC becomes difficult to implement.


    # ## Understanding Target-Action


    Now that you’ve looked at some outline notes about MVC, it’s time to take a closer
    look at some related design patterns. MVC is a top-level design pattern that sketches
    the features of the application as a whole. Target-action is a lower-level pattern
    that defines how objects message each other. You were introduced to some examples
    of target-action in the previous chapter. Now, you’ll look at it more closely.


    Target-action is uncomplicated. A typical objective-C message looks like this:


    ```

    ```

    {anObject aMessage};

    ```

    ```


    When objects support target-action, the object and the message are stored as properties,
    and an external event triggers the message, as shown in Figure 9.5. The trigger
    event is often a user action, but in some applications it can be a timer event
    or a generic event scheduled by an object.'
