  md: "**Figure 8.16**\n\nAfter linking all three outlets, you should see this when\
    \ you select the Counter App Delegate object. All three outlets have been connected\
    \ to their counterpart objects in the nib.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_212_0.png)\n\
    \n> **TIP**\n> \n> You can drag links to a Doc window or to an Edit window. Dragging\
    \ a link to an Edit window links an outlet to valid objects automatically. If\
    \ you hold the mouse without releasing it when the blue rectangle flashes, the\
    \ Edit window highlights the current target object for you.\n\n# Creating a direct\
