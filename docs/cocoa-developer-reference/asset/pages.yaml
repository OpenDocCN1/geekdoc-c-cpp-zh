- pgno: 443
  md: "Figure 16.10\nReplacing stroke with fill fills the rectangle with a solid color.\n\
    \n![](img/2b293e29fc15b0797f113b85dd429b6e_443_0.png)\n\n# ### Using calibrated\
    \ colors\n\nColor is an unexpectedly complex topic. Cocoa color is designed to\
    \ support calibration — a mapping process that eliminates imperfections in color\
    \ hardware. Monitors and printers often have poor calibration, so there is no\
    \ guarantee that a given shade of blue or red will appear the same on two different\
    \ devices.\n\nA full discussion of calibration is outside the scope of this book,\
    \ but you can use the colorWithCalibratedHue: and colorWithCalibratedRed:green:blue:alpha:\
    \ methods to create calibrated color objects. These methods use the calibration\
    \ features built into OS X to create colors that take into account existing calibration\
    \ maps.\n\n# ### Creating and drawing gradients\n\nGradients are not defined and\
    \ used in the same way as color objects. An NSGradient object takes two or more\
    \ colors and defines a smooth blend between them, as shown in Figure 16.11.\n\n\
    ```\n```objective-c\nNSGradient *thisGradient = [[NSGradient alloc]\n    initWithStartingColor:\
    \ aColor\n    endingColor: anotherColor];\n```\n```"
  merge: -1
