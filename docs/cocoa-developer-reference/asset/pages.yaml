- pgno: 16
  md: '# # Preface


    When I started developing for the iPhone after a fifteen-year break from software,
    my first thought was: *What is going on here?* I''d written machine code for Macs
    and had some experience with earlier versions of Mac OS. It soon became obvious
    that Cocoa Touch was doing clever things behind the scenes, and that my apps were
    supposed to be exchanging information with those clever things.


    Unfortunately, neither the official documentation nor unofficial sources of help
    were making it clear what those things were.


    With enough persistence, it''s possible for almost any developer to reverse-engineer
    the docu-mentation and answer the "What is going on here?" question for himself
    or herself. But it''s more productive to have that information before starting
    out. So my first goal for this book is to equip you, as a developer, with the
    key concepts you need to build Cocoa projects efficiently and productively.


    Understanding Cocoa means more than being able to name-check concepts like delegation
    and Model-View-Controller; it means learning how Cocoa applies these concepts,
    how they influence the design of Cocoa''s classes, and how your code can leverage
    the features built into Cocoa to simplify projects and minimize development time.
    In short, it means discovering how to *think* Cocoa. New features will begin to
    feel intuitive once you understand the reasoning behind them.


    My second goal for the book is to give readers the skills they need to answer
    Cocoa questions for themselves, without handholding. OS X is vast and complex,
    and a full printed guide of every feature would have to be delivered on a truck.
    Books always sell better when readers can pick them up and take them home without
    stalling traffic, so this book doesn''t try to detail every Cocoa feature. It
    also doesn''t try to build complex sample projects that are unlikely to match
    your specific needs. Instead, it gives you the skills you need to find answers
    to questions for yourself, using the official documentation and other sources
    of insight.


    One feature you won''t find in this book is cheerleading. Like any other development
    environ-ment, Cocoa is a mix of excellence and unpredictability. Cocoa''s best
    features are almost super-naturally productive and take you where you want to
    go with almost no code at all. Other elements offer a more scenic journey through
    less intuitive class relationships. Instead of a sales pitch, this book gives
    you a guided tour of the highlights but also warns you about some of the more
    dangerous parts of town.


    Finally, software is as much an art as a science. Art is about creating captivating,
    enjoyable, and colorful experiences for an audience. In common with the Apple
    ethic, this book is deliberately less formal and more creative than a pure software
    reference. You''ll find the rules here. And sometimes you''ll also find suggestions
    for breaking the rules.


    Every author tries to make his or her books as helpful as possible. Comments and
    feedback are welcome at cocoadr@zettaboom.com.'
  merge: -1
  img_proc: true
