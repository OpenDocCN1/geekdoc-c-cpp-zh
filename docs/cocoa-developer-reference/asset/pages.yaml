- pgno: 279
  md: "A simple text parser is listed below. It takes the same return string as an\
    \ input and extracts data from two fields: `status_txt` and `url`.\n\n```\n```objc\n\
    if (returnURLString != nil) {\n    returnXML.stringValue = returnURLString;\n\
    \    statusRange = [returnURLString rangeOfString: @\"<status_txt>\"];\n    thisRange.location\
    \ = statusRange.location+12;\n    thisRange.length = 2;\n    thisString = [returnURLString\
    \ substringWithRange:thisRange];\n    if ([thisString isEqualToString: @\"OK\"\
    ]) {\n        NSLog(@\"Status OK\");\n        urlStartRange = [returnURLString\
    \ rangeOfString: @\"<url>\"];\n        urlEndRange = [returnURLString rangeOfString:\
    \ @\"</url>\"];\n        thisRange.location = urlStartRange.location+5;\n    \
    \    thisRange.length = urlEndRange.location -\n        urlStartRange.location\
    \ - 5;\n        bitlyURL.stringValue = [returnURLString\n        substringWithRange:thisRange];\n\
    \    }\n    else\n        bitlyURL.stringValue = @\"Error\";\n}\n```\n```\n\n\
    This code uses the `rangeOfString:` method to find the range — index and length\
    \ — of a target string. First, the code looks for `<status_txt>` to find the starting\
    \ index of the status string. It copies exactly two characters from that index\
    \ into a new string using the `substringWithRange:` method and checks whether\
    \ this short new string is equal to OK.\n\nIf it is, it repeats the same sequence\
    \ looking for the substring between the `<url>` and `</url>` tags. This code can\
    \ extract strings of any length between any two tags. In this example, the length\
    \ of the shortened URL string is fixed, so the code could be simplified slightly.\
    \ But in this form, it’s a more general solution for extracting the contents of\
    \ any tag from any XML return.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_279_0.png)\n\
    \n# NOTE\n\nThe complete project is available on the Web site (www.wiley.com/go/cocoadevref),\
    \ as is the more complex project discussed next.\n\n# Creating asynchronous Web\
    \ requests\n\nThe previous example used the same `stringWithContentsOfURL:` method\
    \ to send an API request and read its return. The code is simple, but it stalls\
    \ your application while it waits for the return to complete, or fail. This is\
    \ called a *synchronous request*.\n\nThe more sophisticated alternative is called\
    \ an *asynchronous request*. An asynchronous request creates a request object,\
    \ with associated delegate methods. It then triggers the object to begin the request."
  merge: -1
  img_proc: true
- pgno: 280
  md: "Instead of waiting for the request to complete, the application can continue\
    \ to run. As data is returned from the server, it’s collected by the delegate\
    \ methods and appended to an instance of NSData. When the request completes, it\
    \ calls a method called `connectionDidFinishLoading:`, which can then process\
    \ the return.\n\nAsynchronous methods can seem complex, but they can be implemented\
    \ with standard boilerplate code. One possible example follows:\n\n```\n```objective-c\n\
    - (void) toBitly: (id) sender {\n    escapedURLString = [sender encodeValue: sourceURLStringValue];\n\
    \    thisURL = [NSURL URLWithString: [NSString\n        stringWithFormat:@\"%@%@%@%@%@%@\"\
    ,\n        escapedURLString, bitlyPreambleString,\n        escapedURLString, bitlyPostambleString]];\n\
    \    //Create the request object\n    NSURLRequest *theRequest = [NSURLRequest\
    \ requestWithURL: thisURL\n        cachePolicy: NSURLRequestReloadIgnoringLocalCacheData\n\
    \        timeoutInterval: 30];\n    //Start the connection\n    [theSpinner startAnimation:self];\n\
    \    NSURLConnection *theConnection = [[NSURLConnection alloc]\n        initWithRequest:\
    \ theRequest delegate:self];\n    if(theConnection) {\n        //Connection initialized\
    \ correctly\n        theData = [[NSMutableData data] retain];\n    }\n    else\
    \ {\n        NSLog(@\"Connection didn't initialize\");\n        return;\n    }\n\
    }\n\n- (void) connection: (NSURLConnection *)connection\n    didReceiveResponse:\
    \ (NSURLResponse *)response {\n    //Reset the data after a response - use in\
    \ case of redirects\n    [theData setLength: 0];\n}\n\n- (void) connection: (NSURLConnection\
    \ *)connection\n    didReceiveData: (NSData *)data {\n    //Some data arrived\
    \ - append it\n    [theData appendData:data];\n}\n\n- (void) connection: (NSURLConnection\
    \ *)connection\n    didFailWithError: (NSError *)error {\n    [theSpinner stopAnimation:self];\n\
    \    NSLog(@\"Connection failed\");\n    [theData release];\n    return;\n}\n\
    ```\n```"
