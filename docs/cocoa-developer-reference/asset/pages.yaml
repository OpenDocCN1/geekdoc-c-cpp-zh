  md: 'ideas and idioms. On OS X, Java’s SWT (Standard Widget Toolkit) includes links
    to some of Cocoa’s features and can be used as a transitional learning aid.


    Java is inherently cross-platform, and OS X includes Java as an application framework,
    so developers can create Mac applications, such as the jEdit code editor shown
    in Figure 2.14, without using Objective-C or Cocoa. But Objective-C code is much
    faster and more efficient, and the Cocoa and OS X layers implement a much wider
    selection of features. Java remains a good choice for simple applications, but
    more complex projects need the full performance of Objective-C and Cocoa.


    # Figure 2.14


    jEdit illustrates the flexibility and limitations of Java on OS X. It implements
    a very usable text and code editor, but lacks the deep links with UNIX and OS
    X that are built into Xcode.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_75_0.png)


    # Moving from C or Assembler


    If you’re used to traditional procedural programming, you’ll find Cocoa more challenging.
    You’ll feel at home with the frameworks in OS X with a conventional C interface.
    But Cocoa and Objective-C may be more difficult to understand because they make
    different assumptions about how to approach problems and build solutions.'
