    # Using the File Manager


    You can use a File Manager object to copy, move, and delete files and to list
    directory contents. Most applications don’t need to implement a File Manager.
    Users can use Finder to work with individual files, so these features are only
    useful in applications that batch file operations, such as a backup/restore application,
    or when an application needs to delete temporary files while closing. File open/save
    operations can be performed with standard file access panes, and directory lists
    are only useful when creating a customized equivalent — or when performing batch
    operations that scan the directory structure.


    However, you can use a File Manager to compare two files or to change the application’s
    current directory.


    The File Manager class is easy to work with. To create a File Manager object,
    use


    ```

    NSFileManager *thisManager = [NSFileManager defaultManager];

    ```


    This returns the default system file manager, which is the only manager your application
    should use.


    To compare two files, use


    ```

    [thisManager contentsEqualAtPath: aPath andPath: anotherPath];

    ```


    This returns a BOOL you can test for equality. Copy/Move operations are similarly
    straightforward


    ```

    [thisManager copyItemAtPath: aPath

    toPath: anotherPath error:&error];

    ```


    To change the current application directory, use


    ```

    [thisManager changeCurrentDirectoryPath: aNewPath];

    ```'
