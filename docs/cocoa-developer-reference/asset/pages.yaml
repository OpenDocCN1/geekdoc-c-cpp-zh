- pgno: 92
  md: "# # Using the Documentation\n\nWhen you're starting out, the documentation\
    \ has a poor signal-to-noise ratio and may try to distract you with irrelevant\
    \ content. This becomes less of a problem as you gain experience, because you'll\
    \ assimilate the information in the Getting Started guides or find equivalent\
    \ help elsewhere. You'll also start to remember the frameworks and objects that\
    \ are used regularly and to memorize some of their features. You can improve your\
    \ productivity by using the documentation methodically. Random browsing isn't\
    \ recommended. A more focused approach will help you find useful details more\
    \ reliably.\n\n# ## Sorting the documentation\n\nSorting is a key skill when using\
    \ the documentation. The listing window has five headings: Title, Resource Type,\
    \ Topic, Framework, and Date. Clicking each heading sorts the contents of the\
    \ window alphabetically, except for the Date heading, which sorts chronologically.\n\
    \n> **TIP**\n> \n> The framework heading doesn't appear when you're viewing the\
    \ framework reference documentation because it's redundant.\n\nClicking Title\
    \ is likely to display a jumble of unrelated features. For a more useful summary,\
    \ try clicking Topic, Resource Type, or Framework. When viewing the grab-bag sections\
    \ — Technical Notes, Technical Q&As, Release Notes, and Articles — it can also\
    \ be useful to sort by Date, to eliminate irrelevant older content.\n\n> **TIP**\n\
    > \n> It's a good idea to check the date of any resource before using it, because\
    \ some of the documentation is simply out-dated and wrong. There's no formal sell-by\
    \ date, but as a rule of thumb, any item that's more than five years old may not\
    \ be accurate.\n\nWhen clicking Topic to sort contents, the headings include extra\
    \ subgroups that aren't visible in the main Topic listing. For example the catch-all\
    \ General topic includes a Memory Management subsection. You can use this feature\
    \ to find items that you might otherwise miss.\n\nThe sorting algorithm groups\
    \ items by subsource — topic or resource type — and then sorts them alphabetically\
    \ within each group. The list of titles can appear chaotic, but in fact it's organized\
    \ so that related items are shown next to each other. One confusing quirk is that\
    \ in a Topic sort, General items appear at the top of the list. The remaining\
    \ items are sorted alphabetically in the usual way. A useful search sequence for\
    \ finding the classes in a framework is\n\n```\nFrameworks List ⇨ <named framework>\
    \ ⇨ Resource Type ⇨\n           Reference\n```"
  merge: -1
