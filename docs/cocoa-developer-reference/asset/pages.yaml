- pgno: 312
  md: "+   - Geometrical rectangle (NSRect)\n+   - Geometrical rectangle size (NSSize)\n\
    +   - Two-valued range (NSRange)\n\nThe syntax for these standard types is similar\
    \ to that used by NSNumber:\n\n```\nNSValue *aValue = [NSValue valueWithType:<type>\
    \ rawValue];\n<a type> rawValue = [aValue <type>Value];\n```\n\nNSValue also supports\
    \ arbitrary custom C typedefs, with a conversion feature.\n\n```\ntypedef struct\
    \ {\n    //Assorted data types\n} StructName;\nStructName letsMakeOne;\n//Code\
    \ to set struct values\nNSValue *aStructWrapper = [NSValue value: &letsMakeOne\n\
    \                                  withObjCType: @encode(StructName)];\n```\n\n\
    This creates an object called aStructWrapper, which contains the values in letsMakeOne,\
    \ which is an instance of StructName. Once aStructWrapper is initialized, you\
    \ can insert it into a data collection object.\n\nThe withObjCType: parameter\
    \ tells NSValue how to organize the interval values. The value parameter tells\
    \ NSValue what the values are.\n\nTo extract the values, use\n\n```\n[letsMakeOne\
    \ getValue: &aStructWrapper];\n```\n\nThis unwraps the contents of aStructWrapper\
    \ and copies them into a variable with a matching typedef.\n\n# Using NSArray\n\
    \nNSArray’s init methods can create an array from a variety of data sources, including\
    \ the following:\n\n+   - Another array\n+   - A file\n+   - A data source accessed\
    \ via a URL, which can be a local file or an online data source (see Chapter 10\
    \ for details).\n+   - A single object\n+   - A list of objects\n+   - A C array\
    \ of objects"
