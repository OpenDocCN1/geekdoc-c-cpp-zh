- pgno: 398
  md: "**Figure 15.1**\nExtracting a substring from the characters in `aString` to\
    \ a new `bString` with `NSMakeRange( );`\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_398_0.png)\n\
    \n> > **CAUTION**\n> >\n> > A range is really just a pair of integers. It's a\
    \ structure, not an object. It doesn't need a pointer, isn't associated with any\
    \ one string, and isn't part of a string's properties.\n\n# ## Working with encodings\n\
    \nNSString supports a range of *encodings*, which make it possible to work with\
    \ languages that do not use Latin characters. The preferred encoding is UTF-8\
    \ (Unicode Transformation Format-8), which is a byte-packed implementation of\
    \ Unicode. Single-byte characters are backward-compatible with ASCII. Multi-byte\
    \ characters define the rest of the world's written languages. In theory, characters\
    \ may use up to 6 bytes, but in practice, no language uses more than 4 bytes per\
    \ character.\n\n# ### Selecting a default encoding\n\nIt would be helpful if you\
    \ could assume UTF-8 is the default encoding. Typically, your application should\
    \ save text using the NSUTF8StringEncoding constant.\n\n```\n    [aString writeToFile:\
    \ aPath\n        encoding: NSUTF8StringEncoding error: &error];\n```\n\nBut some\
    \ Web sources, such as RSS (Really Simple Syndication) feeds, use other encodings\
    \ such as NSISOLatin1StringEncoding. Cocoa's UTF-8 decoder is designed to be pedantic\
    \ rather than robust, and returns a null string if there is any ambiguity about\
    \ the encoding, making it incompatible with RSS feeds and other Web sources, including\
    \ those that generate plain ASCII."
  merge: -1
  img_proc: true
- pgno: 399
  md: "Various solutions are possible. You can write code that cycles through a list\
    \ of possible encodings, trying each in turn until it returns a possible match.\
    \ A trickier solution is to download the Web information into NSXMLDocument, and\
    \ ask it to report the encoding with the character Encoding method.\n\nWhichever\
    \ solution you choose, be aware that creating robust support for the encodings\
    \ used in Web text may not be a trivial problem, even without multi-language support.\n\
    \n# Creating buffers for UTF-8 text\n\nEach character in a UTF-8 string can have\
    \ a variable length. If you need to convert a string into a byte representation,\
    \ don't use the length property to set the buffer length because it assumes all\
    \ characters are a single byte.\n\nThe lengthOfBytesUsingEncoding: method returns\
    \ the byte count needed for a given string.\n\nThe maximumLengthOfBytesUsingEncoding:\
    \ method returns the maximum possible byte count, assuming every character uses\
    \ the maximum number of bytes. This is rarely useful.\n\nIf you need an estimate\
    \ for a string with a given length, irrespective of content, multiply length by\
    \ four and add 1 for the NULL terminator character.\n\n# Using NSAttributedString\n\
    \nBy default, strings contain plain text with no styling or layout information.\
    \ You can use NSAttributedString to manage styled text. This class includes a\
    \ standard NSString object but adds a list of attribute records. Each record holds\
    \ an NSRange and the attribute data for that range, which can include the font,\
    \ text size, justification, and so on.\n\nNSMutableAttributedString supports attribute\
    \ editing. For example, to change the font style and size of the first three characters\
    \ of a string, use\n\n```\n```objc\nNSMutableAttributedString *theString =\n \
    \   [[NSMutableAttributedString alloc] initWithString: @\"The\nString\"];\n[theString\
    \ addAttribute: NSFontAttributeName\nvalue: [NSFont fontWithName: @\"Myriad Pro\"\
    \ size: 40.]\nrange: NSMakeRange (0, 3)];\n```\n```\n\nRepeat with other attributes\
    \ and values to style the string. To remove attributes, use\n\n```\n```objc\n\
    [theString removeAttribute: NSAttributeName>\nrange: NSMakeRange (location, length)];\n\
    ```\n```\n\nThere's no direct way to remove all attributes in a range, but you\
    \ can use setAttributes: with an empty dictionary to delete all existing attributes."
