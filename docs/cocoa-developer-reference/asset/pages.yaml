  md: '# Figure 7.14


    The Bindings tab links items to data structures in the application, bypassing
    standard accessors and allowing for automated refreshes and updates. Bindings
    are not available on the iPhone.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_188_0.png)


    The *Connections* tab, shown in Figure 7.15, is used to link an object to outlets
    and actions defined in code. When you select the tab, the Inspector window displays
    a list of available outlets and actions. The linking process is detailed in the
