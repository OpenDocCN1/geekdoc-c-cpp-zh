    # Using bindings to manage interactivity


    You can use a combination of bindings and KVO to create semi-automated interfaces.
    Sometimes UI properties depend on each other. For example, selecting one UI feature
    can disable or enable others, or modifying a value can update its dependent values.


    With care it’s possible to create UIs with mutual dependence; the user can change
    any element, and all related elements update themselves automatically. Figure
    13.10 shows a very simple example: a two-way temperature converter micro-application.
    Typing a number into either text field and pressing Return generates an updated
    value in the other.'
