- pgno: 552
  md: 'Handling events with the Responder Chain is a tricky linking technique — linking
    to First Responder bypasses AViewController and sends Touch Down events directly
    to showB View: in the root controller. You can use this trick to handle almost
    any event type in any context, but it is not MVC-approved and you should save
    it for view swap events handled by a root controller. If you extend AViewController
    with more features — buttons, sliders, and so on — add the code to handle them
    to the AViewController.m file in the usual way.


    You can now edit the B view nib to show a large label and another round rect button,
    as shown in Figure 19.28. Leave the button unlinked for now.


    # Figure 19.28


    Designing the B view, which is very similar to the A view, with minor labeling
    changes


    ![](img/2b293e29fc15b0797f113b85dd429b6e_552_0.png)


    Save the edited nib, and build and run the application. Tap the button in the
    A view, and the B view appears, as illustrated in Figure 19.29.'
