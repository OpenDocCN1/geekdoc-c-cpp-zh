- pgno: 96
  md: '# # 4 Getting Started with Xcode


    In theory, Objective-C is as platform-independent as C++, Java, Ruby, and Python.
    In practice, it isn’t. Most developers write code that combines the features of
    Objective-C and Cocoa, using them as an informal blended language that runs almost
    exclusively on Apple hardware. Only one toolkit supports this approach — Apple’s
    Xcode SDK (software development kit).


    Xcode includes dedicated class and object management features that aren’t available
    in other environments. Developers rely on these features to add new classes to
    their applications and to define the list of objects that’s loaded when an application
    runs. While it’s possible to create working Objective-C code with a text editor
    and a command-line compiler, this isn’t an efficient way to work. It doesn’t take
    advantage of the helper features in Xcode, which make it easier to work with Cocoa
    objects.


    The next few chapters introduce Cocoa object creation and class management in
    a theoretical way using working example code created in Xcode and Interface Builder.
    They also outline some typical design processes and illustrate how to add specific
    features to an application, translating details in the developer documentation
    into working code.


    # ## Getting Ready for Xcode


    Until the announcement of iPhone OS 4 in April 2010, Apple offered two versions
    of Xcode. Mac developers could use the OS X-only version of Xcode, while iPhone
    developers were supplied with a combined version with templates and documentation
    for both OS X and iPhone OS projects.


    Apple no longer supports the OS X-only version, and all developers must use the
    combined SDK. This encourages developers to explore both platforms, but the combined
    SDK is a much larger download — up to 5GB versus 800MB of the OS X-only SDK. After
    the download completes, it can take three hours to install the combined SDK on
    the oldest and slowest Intel Macs. An hour is more typical on recent hardware.


