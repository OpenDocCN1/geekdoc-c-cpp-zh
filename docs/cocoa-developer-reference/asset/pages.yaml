  md: 'Figure 10.12


    Adding an extra text field to the project, so that you can view the raw XML return


    ![](img/2b293e29fc15b0797f113b85dd429b6e_277_0.png)


    # Selecting the XML format


    The only other required change is modifying the `&format=txt` defined in the postamble
    string to `&format=xml`. This tells the bit.ly server that your application wants
    a packet of XML data instead of a simple text string. The XML will need to be
    processed to extract the shortened link from it. But you can copy the return string
    to `returnXML.stringvalue` to see the raw XML returned from the server. Building
    and running the project should produce the result shown in Figure 10.13.


    Why go to the trouble of downloading this extra data? As mentioned earlier, many
    APIs don’t support text returns, so you’re often forced to use XML. But as you
    can see from the return, it includes extra data that isn’t provided by the simple
    text API. For example, the `new_hash` field tells you whether you’ve shortened
    this URL before. You can also read a separate status code and status text to tell
    you more about error conditions if the return fails.'
