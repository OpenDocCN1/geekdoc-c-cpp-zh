- pgno: 626
  md: '# Learn Cocoa — for fun and

    for business


    Cocoa is the programming environment for Apple development, and this information-packed
    developer’s guide is your key to the Cocoa libraries and the Apple developer tools.
    Written for developers by an experienced Mac expert and iPhone developer, this
    book shows you how to learn and use Xcode and Objective-C, design user interfaces,
    optimize your code, manage data, create animations and special effects, and package
    apps for the App Store.


    +   - Master and understand the Xcode® SDK, Objective-C®, and the Cocoa API

    +   - Create, use, profile, and debug custom objects and subclasses

    +   - Design user interfaces with Interface Builder

    +   - Streamline your code with design patterns such as Model-View-Controller
    (MVC)

    +   - Work with text, PDFs, Web data, and Apple’s Core Data API

    +   - Create simple and advanced animation effects with Core Animation and Core
    Image

    +   - Learn to develop apps for Mac OS® X and Apple devices


    # Access the latest information on Apple development


    Visit www.wileydevreference.com for the latest on tools and techniques for Apple
    development, and download source code for the projects in this book.


    Richard Wentk is a developer with more than fifteen years of experience in publishing,
    and is one of the UK’s most reliable technology writers. He covers Apple products
    and developments for MacWorld and MacFormat magazines, and also writes about technology
    and business strategy for publications such as Computer Arts and BBC Focus.'
  merge: -1
  img_proc: true
