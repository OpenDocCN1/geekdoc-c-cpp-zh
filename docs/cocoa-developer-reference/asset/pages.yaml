- pgno: 522
  md: '# Making money from iPad development


    The iPhone and iPad share a similar programming model, but they have a very different
    business model. The iPad market is smaller — total sales are expected to be around
    6 million by the end of 2010, rising to 10 to 12 million by the end of 2011 —
    and the user profile is different, split between the traditional younger iPhone
    demographic and the older less-experienced computer users who are looking for
    a simplified experience of e-mail, the Web, games, and other entertainment computing.


    Because the iPad uses a faster processor and bigger screen, it can be tempting
    to keep adding features to apps, extending the development cycle. But the app
    market is still relatively small, and extra sophistication may not mean more user
    interest. Niche apps with complex specialized features are likely to have a tiny
    potential audience with even tinier sales. Longer development times can justify
    higher app prices, but total sales are likely to remain smaller. Figure 19.6 shows
    a binary clock application that uses the iPad''s larger screen to create a simple
    app that can be left running permanently, converting the iPad into a domestic
    accessory.


    # Figure 19.6


    This minimalist binary time display app relies on the large physical size of the
    iPad. It is designed to run when the iPad is in a cradle or stand, creating an
    unusual desk clock.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_522_0.png)'
  merge: -1
  img_proc: true
- pgno: 523
  md: "One way to avoid niche limits is by developing games; the iPad has obvious\
    \ appeal as a hand-held gaming platform. It can also be inspiring to think of\
    \ the iPad more as a content reader and a player for entertainment and education.\
    \ Content container apps can be developed quickly, easily, and cheaply. The iPad\
    \ is ideally suited for displaying Web content, Web apps, and subscription services.\
    \ For a content delivery app, you can use Web technologies — you may not need\
    \ to use Xcode at all.\n\nA subscription or content purchase scheme can create\
    \ regular income in ways that apps cannot, and simple Web apps with compelling\
    \ regular updates are likely to be at least as successful as traditional iPhone-style\
    \ apps. Traditional apps can still sell well, but for the moment the iPad is a\
    \ riskier commercial prospect for solo developers than the iPhone, although success\
    \ can be more rewarding.\n\n> **TIP**\n> \n> You can use the Top Charts feature\
    \ in the App Store to find the most popular and successful apps. Checking the\
    \ charts regularly and testing the top free and paid-for apps can give you useful\
    \ insights into the design and features of best-selling apps.\n\n# ## Moving to\
    \ iOS from OS X\n\niOS is recognizably similar to OS X. Many of the design patterns\
    \ are identical. iPhone apps use Model-View-Controller, target/action, key value\
    \ coding and observing, blocks and threads, the responder chain, and notifications\
    \ in an identical way. The nib system is also similar, with some simplifications\
    \ and omissions.\n\nBut iPhone apps and Mac applications have different design\
    \ goals and run on different hardware. Because of the hardware differences and\
    \ the pared-down classes in iOS, the development environment is less complex.\n\
    \n# ### Getting started with the iPhone SDK\n\nThe iPhone has its own developer\
    \ center and associated developer program, shown in Figure 19.7. From Q1 2010,\
    \ iOS and OS X developers use the same SDK, which supports both platforms. Both\
    \ programs are accessed through separate pages on Apple’s site, and both offer\
    \ free and paid-for access with enhanced support and other features.\n\n> **CROSS-REF**\n\
    > \n> For more information about signing up to the iPhone Developer Program and\
    \ downloading and installing the Xcode SDK, see Chapter 4."
  merge: -1
  img_proc: true
- pgno: 524
  md: '**Figure 19.7**


    As with the Mac Developer Program, signing up for paid access to the iPhone Developer
    Program allows developers to download beta seed versions of forthcoming OS updates.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_524_0.png)


    # Understanding iOS app design goals


    Similarly, the user experience is also streamlined and simplified. Key design
    goals include:


    +   - **Instant on, instant off.** iOS apps should load and quit as quickly as
    possible. Long load times are strongly discouraged. Long shut-down times are not
    allowed at all. Apps that take more than a couple of seconds to save and quit
    may be terminated by the operating system.

    +   - **Full-screen operation.** Apps do not share the screen with other apps
    and do not support floating windows. This restriction is rigid on the iPhone but
    has been relaxed slightly on the iPad, which allows modal and partial views that
    can be made to pop up or appear attached to other views.

    +   - **Loss of focus without notice.** On the iPhone, incoming calls force an
    app into the background and bring the built-in Phone application to the foreground.
    Apps may be paused in the middle of an operation without notice or may be terminated,
    such as when an SMS message arrives with a Web link and the user taps it to view
    it with the Safari browser.'
  merge: -1
  img_proc: true
- pgno: 525
  md: '+   - **Restricted battery life.** Battery life is extremely limited on the
    iPhone, slightly less limited on the iPod touch, and reasonably long-lasting on
    the iPad. iPhone applications must do everything possible to conserve power, dynamically
    disabling hardware when it is not needed or powering it up and powering it down
    again on a regular polled cycle.

    +   - **No explicit data save and restore.** Apps should always save and reload
    their states automatically. Apple’s design guidelines suggest that file operations
    should be invisible where possible. File save and load features should only be
    visible to users when there is no other way to manage application data.

    +   - **Constrained data sharing.** Apps have access to their own file area, but
    they cannot easily share files with other apps or with a desktop computer. This
    restriction is relaxed slightly in iOS 3.2, but the file system can be challenging
    to work with.


    # ## Games and OpenGL on iOS


    iOS mobile devices are an ideal platform for handheld gaming. The touch screen
    and tilt sensing can create a very tactile and immersive experience; for example,
    a driving game or space shoot ’em up can link tilt motions to steering and navigation.
    Complexity is not essential. Simple, easy-to-play games can be as popular and
    profitable as complex, animated, shared-world adventures.


    Apps can use three different technologies for games. Simple puzzle games can use
    UIKit to handle view management, interfaces to the tilt and orientation features,
    touch screen support, and simple animation effects. UIKit is ideal for puzzle
    and grid games with simple animations, and it runs fast enough to make surprisingly
    complex effects possible.


    For more open-ended graphics, the Quartz Core framework, which is a simplified
    version of the equivalent framework in OS X, is a good choice. The essential drawing
    and animation features and concepts are similar, but filters are not supported.
    3D and 2D affine transforms, layered graphics, and keyframed animations are all
    available.


    The most sophisticated effects are possible with OpenGL ES graphics acceleration,
    which is ideal for games with animated 3D environments, characters, and objects.
    2D graphics are also possible, but OpenGL ES can be a challenging environment
    for newcomers, and the simpler frameworks are a better solution for apps with
    simpler requirements. Adventurous developers can use OpenGL to bypass UIKit and
    create completely customized animated interfaces.


    OpenGL code is not identical to OpenGL ES code. OS X games that use OpenGL cannot
    run on iOS without changes. The iPhone’s graphic acceleration hardware has limited
    texture memory, and apps also have strictly limited memory, so complex textures
    and models may need to be simplified. The advantage of OpenGL ES is cross-platform
    support. Other mobile platforms also use OpenGL ES, and an iPhone game can often
    be ported to a different platform relatively simply.


    Two versions of OpenGL ES are used on iOS devices. The iPhone 3G and 3G S iPod
    touch support OpenGL ES 1.1. The iPhone 3GS, 16/32GB iPod touch, and the iPad
    support the newer and more sophisticated OpenGL ES 2.0 specification, but can
    also run apps that use the older technology. The 2.0 specification includes support
    for software shaders — customized dynamic texture and animation code — but is
    recognizably similar otherwise.


    Games can use the GameKit framework, which implements Bluetooth discovery and
    data sharing across two or more devices. GameKit can be extremely rewarding: apps
    can share data and game events with relatively little programming effort. GameKit
    features can also drive sales in the App Store, because users are more likely
    to encourage friends and family to buy apps so they can play together; this is
    most likely for games that include live sharing but also include a solo mode so
    that combined play is not essential. Live voice chat is also supported.'
  merge: -1
  img_proc: true
