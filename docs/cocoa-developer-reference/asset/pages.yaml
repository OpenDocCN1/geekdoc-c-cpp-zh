  md: 'Figure 6.4


    Clicking the reveal triangle next to the Tasks header displays a list of solution-based
    summaries for each class. Use the task list as a quick overview of the class’s
    features.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_145_0.png)


    **TIP**


