    # Creating XML requests


    Most Web APIs return data in one of two industry-standard formats: JSON (JavaScript
    Object Notation) and XML. Both formats are text-based (at least, at present) but
    include special formatting that defines fields and subfields.


    JSON is a more recent and more robust format than XML. XML can suffer from white
    space issues, and parsers may not extract data from an XML formatted string correctly
    if there are minor errors.


    Unfortunately, Cocoa doesn''t include native support for JSON. It does include
    native support for XML, with a selection of XML management classes. But native
    support isn''t always necessary. It''s possible to extract data from both JSON
    and XML API returns with simple string processing. The process isn''t elegant,
    but it is a lightweight way to extract data from one or two specific fields when
    the surrounding tags are known.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_276_1.png)


    **TIP**


    Developing a full JSON parser is a major project — and it''s already been done.
    You can add JSON support to Cocoa by adding a third-party JSON framework. One
    of the most popular is json-framework, which is hosted at http://code.google.com/p/json-framework.


    Figure 10.12 shows an extended version of the simple bit.ly project. Added elements
    include a single extra text field, an associated text field outlet called `returnXML`
    in the app delegate header file, and a link between the two.'
