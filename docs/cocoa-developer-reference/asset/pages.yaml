- pgno: 473
  md: "The path can be made as simple or as complex as it needs to be by adding more\
    \ path segments. It can also be made noncontiguous for special effects. For a\
    \ full list of CGPath functions, see the CGPath Reference in the Documentation.\n\
    \n# Creating Animations with CALayer\n\nYou now have most of the tools you need\
    \ to create completely customized animations without using the animator system.\
    \ An animator is a convenient way to encapsulate an animation object. You can\
    \ run arbitrary animations by replacing the animator with a more flexible animation\
    \ component called a layer.\n\nInternally, Core Animation creates a hierarchy\
    \ of animation object components that is similar to the view hierarchy. Instead\
    \ of views, each item in the hierarchy is a layer, an instance of the CALayer\
    \ class.\n\nA layer is like a view, but it has more properties and is optimized\
    \ for animation. Technically, it’s also a wrapper for the contents of the view.\
    \ Layers are more flexible than views, and you can use them to create impressive\
    \ static effects and animations.\n\nA view with a layer is said to be *layer-backed*.\
    \ By default, views don’t have layers. You can add a layer in two ways. In code,\
    \ use\n\n```\nCALayer *theLayer = [theView makeBackingLayer];\n```\n\nThis creates\
    \ a layer and returns a pointer to it. You can also create layers in Interface\
    \ Builder. In the Wants Core Animation Layer pane in the Effects tab, select the\
    \ check box next to the top view, as shown in Figure 17.5. If the view is a container\
    \ view with multiple objects, you don’t need to select every box; it’s enough\
    \ to select the top one. Layers for subviews are created automatically.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_473_0.png)\n\
    \n> **CAUTION**\n> \n> If you try to apply animations to a view that isn’t layer-backed,\
    \ your application may sometimes crash. Officially, you must create a layer. Officially,\
    \ simple animator animations seem to work without one. But it’s not a good idea\
    \ to rely on this, so remember to create a layer whenever you use animations.\n\
    \n# Using layers for animation\n\nThere’s surprisingly little difference between\
    \ the code used to create an animator and the code used to create and run a layer-backed\
    \ animation. The main differences are as follows:\n\n+   - You must use the `layer`\
    \ method to return a view’s layer object.\n+   - You must use the `addAnimation:`\
    \ method to run an animation on a layer.\n+   - You can give the animation object\
    \ a name and use the name as a key string.\n+   - Instead of running the animation\
    \ on a property, you can specify a keypath for the property when you create the\
    \ animation."
  merge: -1
  img_proc: true
- pgno: 474
  md: '**Figure 17.5**


    Making a view layer-backed to enable animation and other layer features


    ![](img/2b293e29fc15b0797f113b85dd429b6e_474_0.png)


    In outline, the differences can be summarized with one word — keypath. With layer
    animation, the keypaths are explicit.


    As an example, you’ll use a modified version of the Twirl Filter project from
    the previous chapter, replacing the twirl filter with a torus lens distortion
    filter and animating the filter so that the distortion appears to spread out from
    a mouse click.


    # Creating an animatable filter


    In the last chapter, you looked at the Core Image filters that can be applied
    to the background or the contents of any view or that can be used to composite
    — blend — two views together. In this section, you’ll create a different implementation
    and make it animatable.


    You can apply static filters to a view in Interface Builder by adding them in
    the Effects tab, or you can implement them with customized drawing code that initializes
    and runs a filter directly. A third option is to create and initialize a filter
    and add it to the backgroundFilters or contentFilters properties of a view. As
    you’d expect, this is the code equivalent of adding the filter in Interface Builder.'
  merge: -1
