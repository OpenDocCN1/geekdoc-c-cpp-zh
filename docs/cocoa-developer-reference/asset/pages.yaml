- pgno: 307
  md: 'Data collection objects can be grouped and nested. It’s not unusual to fill
    an array with dictionaries, and key-value paths can become complex. It can be
    very useful to sketch class graphs that illustrate how objects are linked and
    how they interpret key-value combinations.


    # Introducing Data Collection Objects


    Cocoa’s data collection objects have a number of unusual features:


    +   - **They implement their own disk access methods.** You can save and load
    the contents of any data object to disk. You can also load data from a URL into
    the object.

    +   - **By default, data is defined at initialization and is read-only.** If you
    need to change the contents of a collection, use a *mutable* subclass.

    +   - **Data collections store objects.** Simple C types must be “objectified.”
    Typically this means converting ints, floats, and other types into an instance
    of `NSNumber`, or using `NSValue` as a wrapper for other data types. Strings must
    be an instance of `NSString`.

    +   - **Data collections support implicit enumeration methods.** You can run a
    method on every object in the collection with a single line of code.

    +   - **Modifying a mutable data collection doesn’t trigger a Key-Value Observing
    (KVO) message or modify the value of an object in a collection.** If you want
    a collection that triggers KVO responses, you’ll need to add some work-around
    code.


    Table 12.1 introduces the key features of each object.


    **Table 12.1  Cocoa Data Objects**


    | Data objects | Description |

    |---|---|

    | `NSArray` | Stores objects in an indexed list. Supports enumeration, predicate
    searching, and sorting. |

    | `NSMutableArray` | Supports insertion and removal of objects. Inserting an object
    automatically increases the indexes of the objects after it. |

    | `NSDictionary` | Stores objects as key-value pairs. Supports key and value listing,
    key enumeration, object enumeration, and predicate searching. |

    | `NSMutableDictionary` | Allows insertion and deletion of key-value pairs, and
    allows modification of the value of object linked to a key. |

    | `NSSet` | Stores an unordered collection of objects without indexes. `NSSet`
    is faster than `NSArray` when you need to test whether an object is in a collection.
    |

    | `NSMutableSet` | Supports insertion and deletion of objects, and supports union,
    intersection, and difference operations between sets. |'
  merge: -1
  img_proc: true
- pgno: 308
  md: '| Data objects | Description |

    |---|---|

    | NSValue | Typically used as the data element in collections. Works as a wrapper
    for conventional C or other Objective-C data types. Objectifies them and provides
    a standard interface for accessing, copying, and comparing them. Also supports
    pointers, NSRange, and the NSPoint, NSRect, and NSSize types used in graphics.
    |

    | NSNumber | NSNumber is a subclass of NSValue and works with numerical values.
    |

    | NSIndexSet | A set of array indexes. Used for multiple array operations. NSMutableIndexSet
    can be modified dynamically. |


    # ## Using objects, keys, and values


    Key-value pairings are a fundamental feature of the data collection objects. But
    it’s easy to misunderstand how keys, objects, and values are related.


    # ### Understanding objects and values


    You might expect values to access the contents of an object. As Figure 12.1 shows,
    they don’t.


    The code creates a mutable dictionary, and adds various objects and values to
    it. The console output shows that the `valueForKey:` and `objectForKey:` methods
    return the same object.


    When you’re working with string keys, the two methods are synonymous. The critical
    difference between objects and values is more subtle and is not intuitively obvious.


    +   - When you use `valueForKey:`, the key must be an `NSString`.

    +   - When you use `objectForKey:`, the key can be any object in any class.


    `objectForKey:` is immensely flexible and powerful. You can search, enumerate,
    and organize objects using any data type or class as a key. You can use this feature
    to search and organize collections of any object — pointers, graphical data, game
    tokens, and so on — and to pair objects in useful ways.


    `valueForKey:` is a poor relation. It forces you to pair an object with a string.
    Some Cocoa frameworks use `valueForKey:` exclusively in their class definitions,
    so you’re often compelled to use it.


    # ### Using `setValue:forKey`


    `NSArray` and `NSSet` implement the `setValue:forKey:` method. This enumerates
    the items in the array or set and runs `setValue:forKey:` on each in turn.


    Although these classes are nominally read-only, you can use this method to modify
    the values inside mutable collections stored inside a non-mutable object.'
