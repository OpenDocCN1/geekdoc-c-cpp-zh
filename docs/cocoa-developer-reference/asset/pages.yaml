    # ## Summary


    This chapter has covered a lot of ground. Don’t try to assimilate it all at once.
    It introduced information explored in more detail in later chapters, with added
    practical examples. The chapter began with a first look at the Aqua design guidelines
    and then explored the relationship between Cocoa and the rest of OS X, looking
    in detail at the OS X frameworks and layers.


    Next, it looked at some of the fundamental features of Objective-C and the standard
    data types and design idioms used throughout Cocoa and OS X. Finally, it examined
    some of the similarities and differences between OS X and Cocoa and other popular
    development platforms.'
