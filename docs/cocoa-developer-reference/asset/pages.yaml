  md: 'Figure 13.5 shows the result. The slider moves from side to side, in an automated
    way.


    Open the console window, and move the slider with the mouse. You’ll see that the
    value of `sliderCount` automatically updates itself when you release the mouse.


    The binding is bidirectional. When the code sets `sliderCount`, the slider follows
    it. When the user moves the slider, `sliderCount` is updated with the new slider
    value.


    In a typical application, `sliderCount` — or some other property — wouldn’t be
    set by a timer. Bindings are valuable because the `timerMethod` could be replaced
    by a more robust tracking method, a disk monitor method reporting free space,
    or a value pushed from the Internet. As long as there’s an accessor assignment,
    a binding can display it.


