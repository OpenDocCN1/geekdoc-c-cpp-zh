- pgno: 158
  md: 'Many Cocoa objects have associated delegate protocols. You can also define
    custom protocols for your own objects. NSApplicationDelegate is a standard Cocoa
    protocol, so you can find a list of definitions of its optional methods in the
    developer documentation. Protocol Reference pages are similar to Class Reference
    pages, and you can search them in the same way — by copying and pasting search
    words into the documentation search field or by using the Find Text in Documentation
    menu option. Figure 6.14 shows the NSApplicationDelegate protocol reference page.


    **Figure 6.14**


    Like a class reference, a protocol reference displays methods grouped into tasks.
    There''s also a conventional alphabetical list of the methods in the protocol.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_158_0.png)


    # ### Reading a Protocol Reference


    A Protocol Reference page is like a Class Reference page, and it is organized
    in a similar way. Protocols aren''t objects, so they don''t have properties, but
    they do include a list of methods grouped by tasks. You can use the Table of Contents
    at the top left of the page to review the tasks, and you can also access an alphabetical
    list lower down on the page.


    The messages shown in this reference are generated automatically by OS X at various
    points in an application''s lifecycle. We''ve already used the applicationDidFinishLaunching:
    method, which is triggered after the application loads. This stub is included
    in the template as a convenience because this method is used in so many applications.
    If you don''t need to use this'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'feature, you can delete the stub. You can also add further delegate methods,
    as shown below. An object can adopt an unlimited number of protocols, although
    in practice if an object is adopting more than three protocols the application''s
    design may need to be simplified. To adopt multiple protocols, separate them with
    commas:


    ```

    @interface AnObject: NSObject <AnImaginaryProtocol,

    ACompletelyDifferentProtocol, YetAnotherProtocol>

    ```


    If an object adopts multiple Cocoa protocols, it will receive all the corresponding
    messages sent by OS X. You can also define your own protocols and send messages
    from them to other cus-tom objects in your application.


    # ### Understanding delegation in Cocoa


    Delegates and protocols are completely general and not limited to high-level application
    man-agement. In theory, a delegate object can do anything a normal object can
    do, and there are no restrictions on protocol methods.


    In practice, most Cocoa objects use delegation in a selective way. These options
    were listed in Chapter 2, but they''re important enough to repeat here.


    Delegate messages are sent:


    +   - When an event is about to happen

    +   - When an event has happened

    +   - To ask if an event or response should happen

    +   - To request data from another object


    If you review the list of methods defined in the NSApplicationDelegate protocol
    refer-ence, you''ll see they fit into one of these groups:


    +   - `applicationDidFinishLaunching`: is received by the application delegate
    when the application has finished loading.

    +   - `applicationDidChangeScreenParameters`: is received when the screen res-olution
    changes.

    +   - `applicationShouldTerminate`: is received when OS X wants to know if an
    application should quit. The application delegate controls the response by returning
    YES or NO. You can use this feature to keep an application running while it saves
    its state before quitting.

    +   - `applicationWillUnhide`: is received when the application is unhidden.


    This event-based model describes how delegates are often used in Cocoa. You won''t
    find it explained in the documentation, but it''s much easier to understand delegates
    and protocols if you appreciate these design goals.'
  merge: -1
