  md: "# Working with protocols\n\nLooking again at the code for the interface, you\
    \ can see the NSApplicationDelegate protocol.\n\n```\n#import <Cocoa/Cocoa.h>\n\
    @interface FirstAppDelegate : NSObject <NSApplicationDelegate> {\n    NSWindow\
    \ *window;\n}\n@property (assign) IBOutlet NSWindow *window;\n@end\n```\n\nThe\
    \ <NSApplicationDelegate> statement in the second line tells the compiler that\
    \ the FirstAppDelegate class can use methods bundled inside the NSApplicationDelegate\
    \ protocol.\n\nYou can think of a protocol declaration as a terse but powerful\
    \ #include statement. Using an imaginary protocol called AnImaginaryProtocol\n\
    \n```\n@interface AnObject: NSObject <AnImaginaryProtocol>\n```\n\nis almost equivalent\
    \ to:\n\n```\n#import <Cocoa/Cocoa.h>\n@interface AnObject : NSObject {\n}\n//List\
    \ of <AnImaginaryProtocol> delegate methods starts here\n- (void) anOptionalMethod;\n\
    - (void) anotherOptionalMethod;\n- (AClass *) anOptionalMethodThatReturnsAValue;\n\
    + (void) andSoOn...;\n//List of <AnImaginaryProtocol> delegate methods ends here\n\
    @end\n```\n\nIn a sense, a protocol is a convenient way to skip unnecessary copying\
    \ and pasting in a class interface. When you adopt <AnImaginaryProtocol>, the\
    \ methods between the comments are pasted into the interface automatically. You\
    \ can then add implementation code for them in the class implementation.\n\nBut\
    \ protocol methods get a special, useful dispensation from the compiler. Unlike\
    \ conventional methods, they don’t have to be matched by a corresponding implementation.\
    \ Instead you can *pick and choose* which protocol methods to implement. It’s\
    \ equally valid to add implementation code for all, some, or none of the methods\
    \ adopted from a protocol. The compiler flags a warning if some of the methods\
    \ aren’t implemented, but you can build a project without implementing any of\
    \ them.\n\nThis makes protocols immensely responsive. Without delegation or protocols,\
    \ an object must be packed with empty method stubs for every possible message\
    \ it can receive. With delegation, code is only required for methods that are\
    \ actually implemented. Figures 6.12 and 6.13 illustrate how this works."
  merge: -1
