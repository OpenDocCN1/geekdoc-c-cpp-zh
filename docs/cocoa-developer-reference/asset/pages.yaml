- pgno: 363
  md: "Including this code defines the names and keys used in the preferences data.\
    \ You can read and write the keys elsewhere in your application.\n\nBecause preferences\
    \ are objects, you must “objectify” them. Numbers must be packed into\n\n```\n\
    ```\n[NSNumber numberWith<Type>: value];\n```\n```\n\nGeneric objects must be\
    \ archived into an NSData object. For example, to include a color use\n\n```\n\
    ```\nNSData *thisColor =\n    [NSArchiver archivedDataWithRootObject: [NSColor\
    \ whiteColor]];\n[prefsDictionary setObject: thisColor forKey: <a key>];\n```\n\
    ```\n\n# ### Setting preference keys\n\nIt can be useful to define global, application-wide,\
    \ preference key constants. Literal strings won’t trigger a compiler error if\
    \ you type them incorrectly. Explicitly defined constants will. This is an optional\
    \ extra feature, but it can help make an application more robust.\n\n```\n```\n\
    extern NSString * const AKey = @\"A key name\";\n```\n```\n\nto define the key\
    \ constant.\n\nYou can then use AKey as a substitute for @\"A key name\" throughout\
    \ your application.\n\n# ### Reading preferences values\n\nTo read a preferences\
    \ value in your application, access the preferences dictionary with a standard\
    \ valueForKey: method. It’s useful to initialize a pointer to the preferences\
    \ dictionary once at the start of the application and then refer to it thereafter.\n\
    \n```\n```\nNSUserDefaults *prefs;\n...\nprefs = [NSUserDefaults standardUserDefaults];\n\
    <type> aPref = [prefs valueForKey: <a key>];\n```\n```\n\nWhen you read an archived\
    \ or “objectified” key to check its value in your application, you must reverse\
    \ the archiving or objectification process.\n\n```\n```\nfloat aFloat =\n    [[prefs\
    \ valueForKey: <a key which is a float>] floatValue];\nNSColor *thePrefColor =\
    \ [NSUnarchiver unarchiveObjectWithData:\n    [prefs valueForKey: <a key>]];\n\
    ```\n```"
