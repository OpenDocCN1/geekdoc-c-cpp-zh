- pgno: 182
  md: '# Figure 7.8


    The Objects tab of the Library shows visible objects — Cocoa elements that can
    be used to build an interface. Not all Cocoa objects are visible.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_182_0.png)


    You can also add objects with a visual element by dragging and dropping them onto
    an open Edit window. This immediately adds the object to the nib design so you
    can see it and work with its location and size. It also places it into a valid
    position in the graph.


    # TIP


    You can create a very simple Hello World application by dragging a Label object
    — an instance of `NSTextField` — from the Library onto an empty window, double-clicking
    it to enable editing, and changing the text to “Hello, World.” If you save the
    nib file and then build and run the application, the window appears showing the
    text. After an empty window, this is the simplest of all possible Cocoa applications.


    The Classes tab, shown in Figure 7.9, displays an alphabetical list of Cocoa classes.
    Selecting an object reveals information about it in four subtabs:


    +   - **Inheritance** displays the object’s superclasses.

    +   - **Definitions** displays the framework that defines the object. Some objects
    are defined in *plug-ins*. Ignore the plug-in feature for now; it’s not used in
    basic nib design.

    +   - **Outlets** displays object properties that have been prelisted in IB as
    a convenience. You can create your own custom outlets for any objects, but a handful
    of objects feature predefined outlets. For example, `NSDrawer` includes outlets
    to a parent window, a content view, and a delegate.

    +   - Similarly, **Actions** displays a list of predefined actions. For example,
    `NSDocument` includes links to predefined print, save, save as, and other methods.'
