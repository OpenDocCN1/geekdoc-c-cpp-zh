    \ of the block\n    [block1 setCompletionBlock:^{\n        NSLog(@\"Finished\"\
    );\n    }];\n    [theQueue addOperation:block1];\n    return;\n}\n- (BOOL) isPrime:\
    \ (int) testNumber {\n    if (testNumber < 1) return NO;\n    if ((testNumber\
