- pgno: 466
  md: "```\n~~~objective-c\n- (void) mouseDown: (NSEvent *)theEvent {\n    NSPoint\
    \ mousePosition = [theEvent locationInWindow];\n    bOffX = NSMidX(theButton.bounds);\n\
    \    bOffY = NSMidY(theButton.bounds);\n    mousePosition.x = mousePosition.x-bOffX;\n\
    \    mousePosition.y = mousePosition.y-bOffY;\n    [[theButton animator] setFrameOrigin:\
    \ mousePosition];\n}\n~~~\n```\n\n> > **CAUTION**\n> >\n> > Animation effects\
    \ require the QuartzCore framework. To add this framework to your project, right-click\
    \ the Frameworks folder, choose Add > Existing Frameworks, scroll down the list\
    \ to find the QuartzCore.framework item, select it, and click the Add button.\n\
    \nThe animation time is fixed, so the button velocity depends on the distance\
    \ it has to cover. Figure 17.3 gives a hint of the result.\n\n**Figure 17.3**\
    \  \nClick the mouse anywhere, and the button follows eventually.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_466_0.png)\n\
    \nNote that you don’t use `animator` as a class or an object. It’s a wrapper for\
    \ a more complex animation object, and you can’t access that object’s properties\
    \ directly. It’s best to think of `animator` as a unique modifier. There’s nothing\
    \ quite like it anywhere else in Cocoa. Functionally, it means you can create\
    \ animations without object creation and setup code. You have the option to bypass\
    \ `animator` and add that code when you need it, but for many effects `animator`\
    \ is simpler and can be almost as flexible."
