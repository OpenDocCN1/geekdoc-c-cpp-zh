  md: "# Figure 9.5\n\nUsing target-action when the target and the action are specified\
    \ as properties.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_236_0.png)\n\nSome\
    \ methods also support target-action, specifically timer methods and a method\
    \ called `performSelector:`. The target and the action are defined in the method\
    \ body.\n\n```\n```objective-c\n[anObject doSomethingThatSupportsTargetAction\n\
    \ target: anObject action: @selector(aMethod)…]\n```\n```\n\nBoth variations create\
    \ the same result: aMethod is triggered in anObject.\n\n![](img/2b293e29fc15b0797f113b85dd429b6e_236_1.png)\n\
    \n# CAUTION\n\nIf aMethod isn't found in anObject, an error is generated and the\
    \ application may crash.\n\nThe key benefit of target-action is that both the\
    \ target and the action can be changed under program control. You can dynamically\
    \ reconfigure your application to redirect messages from one object and method\
    \ to another, as needed.\n\nIn practice, this happens less frequently than it\
    \ could. Typically, a target-action is defined at launch, and it isn’t modified\
    \ again. But sometimes it’s useful to modify targets and actions dynamically.\
    \ Target-action makes it possible to do that.\n\n# Defining selectors\n\nTo define\
    \ an action method, you must wrap it in a selector — an “objectified” method.\
    \ You can use selectors as objects, copying them, archiving them, comparing them,\
    \ and performing other tricks. More typically, you use the selector syntax as\
    \ a bit of boilerplate syntax that wraps a method so that it can be plugged into\
    \ target-action code.\n\nThe syntax is slightly unusual and can be difficult to\
    \ remember. It looks like this:\n\n```\n```objective-c\n@selector(aMethod:)\n\
    ```\n```\n\nKey points to remember:\n\n+   - There are no quotation marks anywhere\
    \ in the statement.\n+   - The brackets are round.\n+   - If the method takes\
    \ a parameter, a colon is included. Parameters aren’t listed."
