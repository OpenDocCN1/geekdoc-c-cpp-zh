- pgno: 513
  md: 'Source control is a complex topic with many variations and advanced requirements.
    The details are beyond the scope of this book. It’s also not essential for solo
    development; Snapshots and manual copying are enough to manage most solo projects.
    SVN source control becomes obligatory on collaborative projects where source code
    is hosted and shared on a remote server. For an introduction, see Apple’s documentation
    at http://developer.apple.com/mac/articles/server/subversionwithxcode3.html.


    # Summary


    In this chapter, you were introduced to Xcode’s debugging, profiling, and code
    management features. You learned how to use NSLog to report method triggers and
    property values and how to remove NSLog calls from release code to maintain its
    performance.


    Next, you explored Xcode’s breakpoint features, and you discovered how to use
    them in the code editor window and how to explore further features in a separate
    Debugger window.


    Instruments were introduced in the next section, and you learned how to run code
    with instruments, and which instruments were most useful for OS X and iPhone development.


    Finally, you explored the Snapshots and manual code backups, and you were introduced
    briefly to Subversion, a formal online source control tool supported in Xcode.'
