- pgno: 541
  md: 'The Split View-based template shown in Figure 19.18 is only available on the
    iPad. It creates a split view display with a table view at the left and a blank
    view at the right. A split view controller manages both views. The table view
    is allocated and initialized dynamically and is not loaded from a nib file. You
    can customize this template to load a view of your choice — with a custom nib
    — by replacing the table view creation code with code to load and display a custom
    view controller class.


    # Figure 19.18


    The table view that appears at the left of the Split-view template is not included
    in the project nib files; it is added dynamically in the code when the app runs.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_541_0.png)


    # CAUTION


    When you create a new view controller class for the iPad with a nib, the nib is
    a standard size and covers the full screen. You cannot edit this size in Interface
    Builder, but you can resize a view dynamically in code after it loads. For a split
    view, the size is irrelevant; the rightmost detail view covers it automatically,
    leaving a visible 320 pixel width at the left.'
  merge: -1
  img_proc: true
- pgno: 542
  md: 'The Tab Bar Application template illustrated in Figure 19.19 creates an app
    with two tab bar items that switch between two views. To add more views, or to
    change the type of view selected by the tabs, open the MainWindow.xib file in
    Interface Builder, select the Tab Bar Controller, and edit the list of the View
    Controllers visible in the Attributes pane to add or remove controllers or change
    their type. Add a new view controller class — customized, as needed — for each
    new list entry. Add a Tab Bar Item subview to each controller. When you arrange
    the hierarchy like this, the main Tab Bar Controller automatically switches views
    when each tab bar item is tapped.


    # ### Figure 19.19


    The two views in the Tab Bar Application template are switched automatically by
    the Tab Bar Controller. No code is needed.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_542_0.png)


    The Utility Application template shown in Figure 19.20 creates a two-view application.
    The first view is empty with a single information button at the lower right. Tapping
    the button spins the view to reveal a modal flipside view, with a Navigation bar
    that shows a title and includes a Done button. Tapping the Done button spins the
    view again to reveal the original.'
  merge: -1
  img_proc: true
- pgno: 543
  md: 'The template is designed for a very simple two-view app. Apps rarely are this
    simple, and it is more useful as an example of two techniques: switching views
    with the `presentModalViewController:` method and using protocol/delegate communication
    between views. The flipside view includes a delegate property, used as a link
    to the main view controller. When the user requests a return, the flipside view
    triggers a custom `flipsideViewControllerDidFinish:` method in the delegate. In
    the delegate—which is the main controller—this method calls the `dismissModalViewControllerAnimated:`
    method, and the modal view disappears and is replaced by the main view. You can
    populate both views with further features as needed.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_543_0.png)


    # TIP


    The Done button and the Navigation bar on the flipside view are large and distractingly
    visible. A more typical app might implement the Done feature with a button, a
    segmented switch, or one of the touch methods. To simplify the flipside view,
    open its nib file, delete the Navigation bar, and replace it with an alternative
    return method.


    # Figure 19.20


    The main view in the Utility Application template uses a light info button graphic
    to swap views. The flipside view includes a less subtle navigation bar and Done
    button.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_543_1.png)'
  merge: -1
  img_proc: true
- pgno: 544
  md: 'The *View-based Application* template shown in Figure 19.21 is minimal but
    versatile. It includes a window that loads a separate view controller with an
    associated nib that displays an empty gray view. The view is blank, but the controller
    code includes a minimal list of useful methods that have been commented out, including
    `viewDidLoad`.


    To create a more complex app, assemble an interface from subviews in the nib file
    in the usual way and link them to new custom methods in the view controller. To
    create an app with more views, add one or more new controller classes to the project
    and include view switching code in each. You can also use this template to create
    apps with navigation controller or tab bar switching. Add these items to the main
    window nib, not the view controller nib. You can then use them to load further
    view controllers, as needed.


    # Figure 19.21


    The View-based Application template is the classic app configuration, with a subclass
    of `UIViewController` loading its view from the associated nib.


