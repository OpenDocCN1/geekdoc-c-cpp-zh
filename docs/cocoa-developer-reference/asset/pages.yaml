    \nThe result is shown in Figure 13.8. The slider continues to move, and the text\
    \ field displays its value.\n\nThis looks like a trivial change, but a lot is\
    \ happening behind the scenes. The string in the text field is displaying an `int`\
    \ value without code. *Bindings don't just link two properties; they can also\
    \ translate values between different data types.*\n\nTypically, converting an\
    \ `int` to a string requires extra formatting code:\n\n```\n```objc\nNSString\
    \ *sliderString =\n    [NSString stringWithFormat: @\"%i\", sliderCount];\n```\n\
    ```\n\nBindings perform a selection of the most useful translations automatically.\
    \ There's no need for extra code or explicit format specifications. Figure 13.9\
    \ illustrates this graphically."
