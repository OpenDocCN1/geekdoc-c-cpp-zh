- pgno: 329
  md: "**CAUTION**  \n*You must enable garbage collection before you add code to a\
    \ new project. If you don't, the compiler assumes that you're adding manual memory\
    \ management features to your code.*\n\n**CAUTION**  \n*If those features are\
    \ missing, your code will crash.*\n\n# # Implementing manual memory management\n\
    \nYou can choose to manage memory manually. This is usually a bad choice — except\
    \ on the iPhone, where you're not given a choice at all. Manual memory management\
    \ is notoriously difficult. The theory is simple, but the practice is unlikely\
    \ to work as you expect, for reasons that can be caused by obvious mistakes or\
    \ by subtle issues built into Cocoa classes.\n\nThe key feature of manual memory\
    \ management is the *retain count*. Every object counts the number of times a\
    \ retain method is called on it. Using *retain* or referencing the object increments\
    \ the counter. Using *release* decrements the counter. When the counter is zero,\
    \ the object is released from memory. Trying to access it again creates a crash.\
    \ The essential memory management methods are shown in Table 12.4.\n\n**Table\
    \ 12.4 essential Memory Management Methods**\n\n| *Method* | *Description* |\n\
    | --- | --- |\n| `[object assign];` | Duplicates a pointer, but doesn't change\
    \ the retain count. |\n| `[object retain];` | Increments the retain count. |\n\
    | `[object release];` | Decrements the retain count. |\n| `[object autorelease];`\
    \ | Hands the object over to an autorelease pool. This is risky — you never know\
    \ when autoreleased items will disappear. |\n| `object2 = [object copy];` | Calls\
    \ the object's copy method. The results depend on the object's implementation\
    \ of copy. |\n\n**CAUTION**  \n*The autorelease feature looks like a simple fix\
    \ for memory management issues — but it isn't, because it autoreleases objects\
    \ on its own schedule, which may not match yours. To guarantee that an object\
    \ is available when you need it, you must take part-ownership of it and retain\
    \ it.*"
  merge: -1
  img_proc: true
- pgno: 330
  md: "Manual memory management code typically follows this cycle:\n\n+   1. alloc/init\
    \ an object.\n+   2. Use the object.\n+   3. release the object.\n\nThe golden\
    \ rule for memory management is that every reference is balanced by a release.\
    \ For example, on the iPhone you create, display, and release an alert with the\
    \ following:\n\n```\n```objc\n*UIAlert *myAlert = [UIAlert initWith<list of properties>];\n\
    [myAlert show];\n[myAlert release];\n```\n```\n\nThis seems simple, but it's important\
    \ to understand that release doesn't immediately free the object. Instead, it\
    \ tells the memory manager that your code is no longer referencing the object.\
    \ In this example, iOS retains the alert until the user finishes with it — then\
    \ it releases it. The final release happens out of sight, within the OS. Your\
    \ release statement gives the OS permission to release the object. It doesn't\
    \ necessarily trigger a release event.\n\nTo manage memory correctly, all objects\
    \ must implement the following features:\n\n+   * An init method that returns\
    \ nil if not enough memory exists to create an object.\n+   * Memory-aware setters.\n\
    +   * A dealloc method that is called in every object just before it's released,\
    \ giving it a chance to release the objects it references.\n\nCocoa objects should\
    \ implement these methods correctly internally. But because Cocoa objects are\
    \ opaque, it's not possible to see what's happening inside them. Some classes\
    \ hold onto objects when you're not expecting them to. In the worst case, it's\
    \ possible to create a retain cycle where objects reference each other.\n\n# ###\
    \ Creating a standard init method\n\nThe suggested boilerplate code for an init\
    \ method is as follows:\n\n```\n```objc\n- (init) {\n    if (self = [super init])\
    \ {\n        //Set up instance variables, if needed\n    }\n    return self;\n\
    }\n```\n```\n\nAdd this to every custom class, and use it. Some classes use [super\
    \ init] to release the original object created by alloc and replace it with a\
    \ new one. This code allows for that possibility, which happens rarely, though\
    \ not rarely enough to ignore."
  merge: -1
  img_proc: true
- pgno: 331
  md: "# ### Creating a standard setter method\n\nThe suggested boilerplate for a\
    \ memory-aware setter method for a property called `item` is:\n\n```\n```objc\n\
    - (void) setItem: (id) newItem {\n    if (newItem != item) {\n        [item release];\n\
    \        item = [newItem retain];\n    }\n}\n```\n```\n\n`@synthesize` implements\
    \ this for you, but you should use this code in any custom setters you write.\
    \ It looks like a complex solution to a simple problem, but it's the only way\
    \ to guarantee that values are released correctly when they're updated.\n\nA simpler\
    \ setter is guaranteed to leak memory.\n\n```\n```objc\n- (void) setItem: (id)\
    \ item {\n    //Don't do this\n    item = newItem;\n}\n```\n```\n\nThe original\
    \ memory referenced by `item` is now lost. No pointer holds a reference to it,\
    \ and it can never be released.\n\n> > **CAUTION**\n> >\n> > The `!=` conditional\
    \ is pseudocode. In practice, you'll need to implement it with some variant of\
    \ the standard `isEqual:` method.\n\n# ### Using dealloc\n\nAdd a dealloc method\
    \ to every custom class you create.\n\n```\n```objc\n- (void) dealloc {\n    [super\
    \ dealloc];\n    [propertyOne release];\n    ...\n    [lastProperty release];\n\
    }\n```\n```\n\nThis method defines what happens when your object is released.\
    \ `[super dealloc]` allows a superclass to run `dealloc` recursively if it needs\
    \ to. The individual release methods free the memory used by your class properties.\
    \ If you don't implement `dealloc`, your custom class is unlikely to release memory\
    \ correctly."
  merge: -1
  img_proc: true
- pgno: 332
  md: '# Using memory management heuristics


    Finally, there are some heuristic rules that can help with memory management.
    These are unofficial and not a substitute for formally analyzing the structure
    of your code. But they can help solve a temporary memory problem while you get
    other parts of your code working. These are quick-fix, non-final suggestions and
    shouldn’t be used in production code.


    +   - Random crashes tell you that objects aren’t being retained correctly.

    +   - References don’t persist across methods. If you create an object inside
    a method, you should retain it if you want it to be available in another method.

    +   - Set pointers to `nil` after releasing them. Releasing a `nil` pointer doesn’t
    cause a crash.

    +   - Beware of delegate objects. Setting a delegate object can do unhelpful things
    to the retain count of some of its properties.

    +   - Beware of Core Animation, which may not manage memory as you’d expect it
    to.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_332_0.png)


    # TIP


    The Object Allocations instrument built into Xcode is invaluable for tracking
    memory errors. A robust application doesn’t crash because of missing objects,
    and it doesn’t leak memory because object references are being overwritten. See
    Chapter 18 for more on this instrument and other diagnostic tips.


    # Summary


    In this chapter, you learned about data collection objects, memory management,
    and archiving methods. You explored the key features of `NSArray`, `NSDictionary`,
    and `NSSet`, and you discovered how to enumerate the items in a collection object,
    how to search items, and how to process each item with custom code.


    Next, you discovered `NSCoder` and investigated how it worked with `NSKeyedArchiver`
    and `NSKeyedUnarchiver` to create composite object collections that could be saved
    to a binary file and reloaded and unpacked to restore original object properties.


    Finally, you were introduced to practical garbage collection and to some of the
    less obvious challenges and possible solutions required to work with manual memory
    management.'
