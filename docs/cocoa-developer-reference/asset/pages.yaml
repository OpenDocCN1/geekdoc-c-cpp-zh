- pgno: 30
  md: '# # Profiting from Cocoa


    Developers can learn Cocoa for both fun and profit. The Mac application market
    is very much smaller than the Windows market, but is also much less saturated,
    making it potentially easier to reach. Mac market share typically oscillates between
    3 and 7 percent of total desktop and laptop sales, and is currently on an upswing
    because of the influence of the iPhone. Web statistics suggest that around 5 percent
    of pages are served to users of Safari or the Mac version of Firefox.


    Sales of Windows PCs are partly determined by bulk corporate purchases, and this
    can distort user statistics. In reality, Macs continue to be a disproportionally
    popular choice for domestic and small business buyers. Even so, the market is
    limited and prospects for volume sales of niche applications are not good.


    The Mac is also a relatively poor choice for games development. Macs are more
    expensive than performance PCs and more difficult to customize, so high-profile
    game developers have concentrated on the PC market, but there are exceptions outside
    of the prestigious high-performance games market. Simple Flash games are popular
    on the Web, and some developers have done well from straight PC and Mac ports,
    using Web gaming to market the stand-alone versions. These games have a much smaller
    development cost than full-scale theatrical 3D gaming experiences, but can be
    unexpectedly profitable.


    In the creative application market, Apple''s own music, video, and photographic
    products dominate audio and video, supported by a number of other established
    software products. Elsewhere Adobe''s Creative Suite series has become an industry
    standard for graphic design, photography, and animation. These markets are now
    mature, leaving little room for competing new products. Occasionally a new product
    can carve a niche for itself if its features are unusual and appealing enough.
    For example, Ableton''s Live audio sequencer, shown in Figure 1.4, is a popular
    seller with both Mac and PC users. When it arrived it offered new performance
    features that weren''t available in existing products.


    Competing head-on with existing creative products is a poor strategy unless you
    have a truly market-changing idea. Competing on price is unlikely to be any more
    profitable. Various budget clones and reinterpretations of Adobe Photoshop have
    been released on the Mac, but none have successfully taken market share from the
    original, even when priced much more cheaply. Solo developers should keep in mind
    that even when products are useful and well crafted, marketing costs can be much
    higher than development costs.


    But head-on competition isn''t the only option. There is a thriving market for
    plug-ins and accessory applications that support the market leaders. For example,
    software music synthesizer and audio processing plug-ins are steady sellers, and
    the plug-in and accessory market for video and graphic design applications is
    similarly robust. Plug-ins and helper applications are smaller and simpler than
    full applications, and can be developed much more quickly — and profitably.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Figure 1.4


    Ableton’s Live is one of the few media applications to successfully invent a new
