- pgno: 469
  md: "```\n```objective-c\nmoveAnimation.timingFunction = [CAMediaTimingFunction\n\
    functionWithName: kCAMediaTimingFunctionEaseInEaseOut];\n//Extreme custom timing\
    \ function - pauses before moving\n//moveAnimation.timingFunction = [CAMediaTimingFunction\n\
    functionWithControlPoints:0.99 -1.0 : 0.01 : 5.0];\ntheButton.animations = [NSDictionary\
    \ dictionaryWithObject:\nmoveAnimation forKey:@\"frameOrigin\"];\n\n- (void) mouseDown:\
    \ (NSEvent *)theEvent {\n    NSPoint mousePosition = [theEvent locationInWindow];\n\
    \    bOffX = NSMidX(theButton.bounds);\n    bOffY = NSMidY(theButton.bounds);\n\
    \    mousePosition.x = mousePosition.x-bOffX;\n    mousePosition.y = mousePosition.y-bOffY;\n\
    \    [(theButton animator) setFrameOrigin: mousePosition];\n}\n```\n```\n\nThis\
    \ code creates the custom animation object in awakeFromNib: and plugs it into\
    \ the animations property after wrapping it inside a dictionary. The dictionary\
    \ makes it possible to set different animation objects for different properties.\n\
    \nIn this context, the animation key name must match the animated property. If\
    \ animator can't find a matching animation key, it falls back to its default animation\
    \ object. You can, of course, fill the dictionary with the same animation object\
    \ assigned to different keys.\n\n# Using timing functions\n\nTiming functions\
    \ are objects created by the CAMediaTimingFunction function to return an instance\
    \ of a timing function object. Table 17.3 lists the preset timing functions, with\
    \ some possible applications.\n\n| Class | Description |\n|---|---|\n| `kCAMediaTimingFunctionLinear`\
    \ | The default value—a linear animation at a constant speed. Can seem unpolished\
    \ when animating movement, but is ideal for colors and other non-moving properties.\
    \ |\n| `kCAMediaTimingFunctionEaseIn` | The animation starts slowly and slows\
    \ to a stop when it completes. Urgent and frantic. |\n| `kCAMediaTimingFunctionEaseOut`\
    \ | The animation starts suddenly and slows down as it completes. Relaxed and\
    \ uninhibited. |\n| `kCAMediaTimingFunctionEaseInEaseOut` | The animation starts\
    \ slowly, accelerates, and slows again before stopping. This is a sophisticated\
    \ and natural-looking animation that suggests a physical object moving with inertia.\
    \ |"
