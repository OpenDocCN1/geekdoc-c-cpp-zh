  md: 'To finish subclassing a view, open Interface Builder (IB), select the view
    object, select the Identity tab in the Inspector window, and choose your new class
    name from the pop-up menu, as shown in Figure 16.5. This tells the application
    to run the code in the new files. Your new view can now respond to events, and
    you can also add code that manages the view hierarchy or generates custom graphics.


    **Figure 16.5**


    Assigning the subclass in IB. This step was introduced in Chapter 7, but it''s
    worth repeating it here; it''s easy to forget, but your subclass won''t work without
    it.


    ![](img/2b293e29fc15b0797f113b85dd429b6e_430_0.png)


    # ## Adding and removing views from the view hierarchy


    The view hierarchy is immensely powerful. Figure 16.6 shows an alternative view
    of one possible view hierarchy, illustrating the tree structure. You can load
    a nib and leave the hierarchy unchanged. But you can also redefine the hierarchy
    at runtime, creating completely dynamic context-dependent interfaces.'
