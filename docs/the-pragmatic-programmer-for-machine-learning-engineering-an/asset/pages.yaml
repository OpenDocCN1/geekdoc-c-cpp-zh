    # 5.2.4 At the Code Level


    As code debt, we should avoid mixing different versions of interpreters, programming
    languages and frameworks in the same machine learning pipeline. Unfortunately,
    this is a common issue for two reasons. Firstly, machine learning experts and
    data scientists often work in isolation, without a shared development environment.
    Secondly, microservices and similar architectures favour the use of multiple programming
    languages inside the same application in what they call polyglot programming.
    While it is often the case that different programming languages are better suited
    to different parts of a pipeline (Section 6.1), having too much variety can lead
    to organisational anti-patterns like an unbalanced distribution of skills and
    skill levels (say, there is only one developer with expertise in a key framework)
    and inadequate knowledge transfer (because there are too many technologies to
    keep track of). From a practical standpoint, a good compromise is to build any
    new machine learning pipeline from a small, up-to-date set of technologies and
    to involve all developers when incorporating new ones. The latter should be done
    sparingly: resume-driven development rarely ends.


