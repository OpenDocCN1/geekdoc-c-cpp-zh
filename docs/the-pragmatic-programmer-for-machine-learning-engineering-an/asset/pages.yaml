    # 3 Variable Types and Data Structures


    sequentially in a single block of memory, so vectors can be accessed with a single
    memory access using a pointer to their first element. (A pointer is itself a variable
    that contains a memory address.) Reading the variables stored in a vector is trivial
    because all elements occupy the same number of bytes in memory: the /th element
    is located at a memory address that is that of the first element i times the variable
    size. Copying the whole vector is also trivial, since it is stored as a single
    block of memory. The same is true for subsets of variables that are adjacent to
    each other within a vector.


    Lists, on the other hand, are heterogeneous data structures that can contain different
    kinds of elements. They essentially act as vectors of pointers to arbitrary data
    structures or variable types. Therefore, each element in a list can be anything:
    a single variable of some type, a vector of any length, a second list, matrix,
    etc. However, this means accessing the elements of a list is less trivial since
    we need to locate each element and access it separately. However, copying the
    list and subsetting it can be easy: if we do not need to modify the contents of
    its elements, we can just copy (all or a subset of) the pointers to the elements
    to create a new list. This is called a shallow copy, and can significantly reduce
    memory use. However, we must duplicate the elements as well if we need to modify
    them later in the new list in order to avoid altering the original list they are
    attached to. Copying both the list and its elements is called a deep copy. In
    contrast, subsetting vectors requires a deep copy in the general case. Shallow
    copies are only possible when copying a whole vector or when subsetting a slice
    of adjacent elements.


    Storing variables into vectors makes vectorised computations possible: a function
    can be applied independently to each element of the vector, potentially leveraging
    hardware’s SIMD and FMA instructions to achieve instruction and data level parallelism
    as we discussed in Section 2.2.'
