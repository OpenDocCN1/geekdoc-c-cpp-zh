    $f(N) \geqslant c_1g(N)$ with $c_1 > 0$. It represents a lower bound in complexity.

    - We describe the average case using big-Θ notation: $f(N) = \Theta(g(N)), c_2g(N)
    \leqslant f(N) \leqslant c_3g(N)$ with $c_2, c_3 > 0$. It represents the average
    complexity.


