  md: '# # Hardware Architectures


    Building a compute system to run machine learning software requires careful planning.
    How well it perform depends on choosing the right hardware; a set of machine learning
    algorithms that can attack efficiently and effectively the task we want to perform;
    and how to represent the data we will use, the models and their outputs. For the
    purpose of this book, we define a “compute system” as a computer system, not necessarily
    server-class, that will perform one or more of the tasks required to learn or
    use machine learning models. We will often call it a “machine learning system”
    as well to highlight its purpose. Other types of systems, such as those focusing
    on storage (database servers, data lakes, object storage) or delivery (human-readable
    dashboards, computer-readable API endpoints) will be mentioned in passing.


    In this chapter we focus on the hardware, moving to the data in Chapter 3 and
    to the algorithms in Chapter 4. After covering the key aspects of a compute system
    (Section 2.1), we discuss how to use it to the best of its potential (Section
    2.2), the trade-offs involved in integrating remote systems (Section 2.3) and
    how to design it based on our requirements (Section 2.4). Modern machine learning
    libraries try to make these decisions for us, but they have limits that become
    apparent in many real-world applications: in such cases, being able to reason
    about the hardware is an invaluable skill.'
