    is to support MLOps by providing four key features:


    +   - a project packaging format built on Conda [16] and Docker [82] which guarantees
    reproducibility and which makes projects easy to share;


    +   - an experiment tracking API to log parameters, code and results together
    with an interactive interface to compare models and data across experiments;


    +   - a model packaging format and a set of APIs for deploying models to target
    platforms such as Docker, Apache Spark and AWS SageMaker;;


    +   - a model registry with a graphical interface and a set of APIs to work collaboratively
    on models.


