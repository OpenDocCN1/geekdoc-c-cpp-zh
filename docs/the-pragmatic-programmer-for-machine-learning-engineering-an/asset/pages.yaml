    # 4.5-3 Uniform Simulations of Directed Acyclic Graphs


    Many probabilistic models can be represented graphically as directed acyclic graphs
    (DAGs), in which each node is associated with a random variable and arcs represent
    dependence relationships between those variables: notable examples are Bayesian
    networks [314], neural networks [122], Bayesian hierarchical models [109] and
    vector auto-regressive (VAR) time series [375]. The DAGs make it possible to divide
    and conquer large multivariate distributions into smaller ones in which each variable
    only depends on its parents.'
