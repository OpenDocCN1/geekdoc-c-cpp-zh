    +   The blue-green deployment pattern [153] assumes that we are using a router
    (typically a load balancer) to spread requests over a pool of instances that serve
    the version A of a machine learning model (Figure 7.3, left). When we deploy a
    new version B of the model, we create a second pool of instances that serves and
    send a subset of the new incoming requests to this pool. If no issues arise, the
    router will then gradually send more and more requests to the pool that serves
    model B instead of serving model A. Existing requests processed by model A are
    allowed to avoid disruptions. The pool serving model A will eventually not be
    assigned any more requests and may be decommissioned. If any issues arise, rollback
    is simple: we can send all requests to the pool serving model A again. Keeping
    the two pools in separate environments or even separate machine learning systems
    will further reduce deployment risk.


    +   We already mentioned the canary deployment pattern [153] in Section 5.3.4:
    the main difference with the blue-green pattern is that we deploy instances with
    model B in the same pool that is already serving model A (Figure 7.3, top right).
    The router will redirect a small number of requests to the instances with model
