  md: '218


    9 Troubleshooting and Testing Pipelines


    # 9.1.3 Dynamic Data


    The data, the models, the code and the architecture can be all sources of technical
    debt in a machine learning pipeline (Section 5.2). The data sources we use to
    feed our machine learning models, in particular, are often outside of our control.
    Hence data dependencies are more costly than code dependencies [313]: it takes
    more effort to troubleshoot their behaviour and to quantify and mitigate their
    potential impact on the performance of our pipeline.


    Data may change slowly over time, either following a medium– long-term trend or
    in periodic patterns. (The former is known as data drift, and the latter is called
    seasonality in statistics.) Both can be encoded in machine learning models at
    the cost of increasing model complexity. However, models take time to adapt to
    change: if change is sudden or drastic enough predictions will be miscalibrated.
    Using dynamic thresholds that are updated regularly and frequently allows models
    to adjust change, but there may be a noticeable lag. Setting such thresholds,
    however, will require additional, dedicated models thus introducing additional
    complexity. Any fixed threshold, whether implicit or explicit, will require domain
    experts to constantly monitor (Section 5.3.6) the inputs and outputs of data ingestion
    and preparation modules (Section 5.3.3) to keep it up to date, possibly introducing
    an even longer lag. (This is an instance of the human–in–the–loop approach we
    recommended in different places in Chapter 5).


    A type of change that is particularly difficult to identify is when a feature
    we are using in our models stops correlating with a causal feature. If we include
    the former instead of the latter by mistake (Section 9.1.1), we suddenly lose
    access to the information that the causal feature was indirectly providing to
    the models. Recovering that information may require re-evaluating our data sources
    and an extensive re-engineering of our'
  merge: -1
  pgno: 234
- img_proc: true
  md: '# 9.2 Models Are the Problem


    data ingestion and preparation modules. And it may be difficult to understand
    what happened: if two features showed a significant degree of association at the
    time the models were trained, but gradually drifted apart over time, the (non-causal)
    feature we included may suddenly become irrelevant for no apparent reason.


    # 9.2 Models Are the Problem


    Machine learning models tend to be complex beasts: this is especially the case
    for deep neural networks but holds for many Bayesian hierarchical models as well.
    Our ability to troubleshoot models with a large number of parameters estimated
    from data (and with hyperparameters as well, usually) is severely limited by the
    sheer number of moving parts we need to track.


    # 9.2.1 Large Models


    Firstly, it is difficult to map the effect of any change in the model behaviour
    or in the data to individual parameters because parameters interact with each
    other. In order to capture complex patterns of behaviour from the data, machine
    learning models mix the information present in individual input variables in many
    (linear and non-linear) ways that are encoded in different parameters. As a result,
    any change in even a single variable will affect multiple parameters at the same
    time in ways that may be difficult to understand. Changing the values of some
    parameters in a way that locally improves some part of a model may have a knock-off
    effect on the parameters in other parts of the same model. Both these effects
    compound across the models in a pipeline as we discussed in Sections 5.2.2 and
    9.1.2.'
  merge: -1
  pgno: 235
- img_proc: true
  md: '# 9 Troubleshooting and Testing Pipelines


    Secondly, dealing with a large number of parameters makes it impractical to investigate
    them individually. Each parameter may have little or no real-world meaning by
    itself. As we just discussed, its behaviour will be intertwined with that of other
    parameters: they should be grouped and each group investigated as a single, meaningful
    entity. Hence we have to resort to an auxiliary model that investigates the parameters
    for us: it may be something simple like a diagnostic plot based on summary statistics,
    or something more complex like a second, independent machine learning model. However,
    summary statistics by their nature lose information, making bugs easily undetected,
    and adding a second machine learning model may not be worth the additional complexity
    of ensuring that model is also working properly. It is troubleshooting all the
    way down!


    # 9.2.2 Black-Box Models


    Thirdly, most large machine learning models are effectively black boxes. Individual
    parameters are mathematical constructs that often have no real-world meaning,
    even when considered in groups. An entire research field, focusing on explainability
    and interpretability, has sprung up in an effort to relate changes in the model
    inputs to changes in the model outputs. Ideally, we want to do that in a way that
    can make these relationships meaningful to a domain expert: for instance, visualising
    word relevance in NLP [191] and pixel relevance in computer vision [325] or splitting
    images into layers with semantic meaning [296]. Observing the behaviour of a model
    around input values with local approaches like LIME [296] and SHAP [201] can provide
    insights: both approaches work by perturbing the inputs and checking whether the
    outputs are stable, and mapping any instabilities to specific subsets of parameters.'
  merge: -1
  pgno: 236
