    8 Documenting Pipelines


    # 8.1 Comments


    There is no consensus among software engineers about the need to include comments
    in the code, nor about their frequency and contents. Some argue that “comments
    are, at best, a necessary evil [...] to compensate for our failure to express
    ourselves in code” [205]; some that “too many comments are as bad as few, and
    you can achieve a middle ground economically” [206]; and others that “good code
    has lots of comments [...] keep the low-level knowledge in the code, where it
    belongs, and reserve the comments for other, high-level explanations” [369]. The
    only things that everybody agrees on are that comments can easily become out-of-date
    as the code refer to changes over time, and that comments that do not provide
    any additional information over the code itself are redundant.


    Machine learning pipelines can be reasoned about three different perspectives
    (Section 5.3.1): the domain they operate in, such as the business operation or
    the academic field that generates the data it will process; the software architecture,
    that is, the engineering effort of organising the software in separate modules
    that can be worked on efficiently and that have a well-defined purpose; and the
    models that power them with their probabilistic properties. The interplay between
    perspectives determines both low-level and high-level design decisions in ways
    that are extremely difficult to represent in the code. We choose machine learning
    models considering the characteristics of the data they will process; performance
    optimisations (Sections 2.2 and 2.4) may (or may not) be worthy depending on the
    combination of models and compute systems; and our efforts to structure the software
    into modules (Section 5.3) and data structures (Sections 3.3 and 3.4).'
