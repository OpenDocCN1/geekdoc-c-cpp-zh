    # 3.4 Choosing the Right Data Structures for the Job


    The choice of data structures can have an even larger impact than that of variable
    types because it determines memory access patterns. Operational intensity depends
    crucially on efficient memory use and access, as we argued in Sections 2.1.2 and
    2.2.


    Lists can be more memory efficient than vectors if we need to repeatedly subset
    them, for example, because we need to work on combinations or permutations of
    their values. If shallow copies are acceptable, lists are faster to duplicate
    as well because we do not have to allocate memory for and copy their elements.
    If shallow copies are not acceptable, vectors are faster to copy because all their
    elements are stored as a single block of memory and can be copied with a single
    operation. And they are not less memory efficient, since their size is determined
    by their length. In fact, lists use more memory than vectors because they contain
    pointers to each element in addition to the elements themselves: the difference
    can be significant if the elements are small overall. These considerations are
    important for optimising performance given memory latency discussed in Sections
    2.1.2 and 2.2.'
