    NLP techniques including those described in Section 3.1.3. We are a static data
    set that is used for training (Section 5.3.4).


    +   2 The domain knowledge is distilled from the documents into word embeddings
    using word2vec [299] and the list of key terms with the associated weights provided
    by the domain experts. The embeddings represent Lipizzi et al. [196] call the
    “room” and are the core of our machine'
