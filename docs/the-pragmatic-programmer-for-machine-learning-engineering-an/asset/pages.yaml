    # 4.3 Big-O Notation and Benchmarking


    Producing empirical performance curves for all relevant dimensions of computational
    complexity differs from other forms of benchmarking in a few ways. If we know
    the theoretical class of complexity an algorithm belongs to, a simple linear model
    will suffice for estimating the coefficients of the term in its big-O notation:
    we will show some examples in Section 4.5. However, should take care in how performance
    is measured and in how we interpret the empirical curves.


    Firstly, we should plan the collection of the performance measurements following
    the best practices in the design of physical [225] and computer simulation [308]
    experiments. If we are measuring complexity along a single dimension, we should
    collect multiple performance measurements for each input size. The average performance
    at each input size will provide a more stable estimate than a single measurement,
    and we can use the distribution of the performance measurements to establish confidence
    bands around the average. Bands based on empirical quantiles (say, the interval
    between the [5%, 95%] quantiles) are often preferable to bands based on the quantiles
    of the normal distribution (say, average performance ± the standard deviation
    times the 95% quantile of the standard normal) because the latter is symmetric
    around the average and fails to account for the fact that performance is skewed.
    Performance is naturally bounded below by zero (instant execution!) and the average
    performance may be close'
