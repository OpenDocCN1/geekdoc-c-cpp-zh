    Ideally, we should choose which data structures to use in our code taking into
    account what data structures are used in the libraries and in the other software
    that are part of the machine learning pipeline. If different parts of the pipeline
    encode data and models in different ways, we will be forced to convert between
    them, which is inefficient and increases memory use. For instance, R typically
    imports data as data frames. However, the underlying BLAS and LAPACK code that
    powers models (all linear regressions among them) requires data to be stored as
    dense matrices in column-major format. Converting a data frame into a matrix requires
    copying all the data into a single memory block, column by column, which doubles
    memory use and wastes processor time.


    We should also choose data structures based on how the algorithms use them their
    contents. Data that are processed together should be stored together to allow
    algorithms to perform as few separate memory accesses as possible. For instance,
    if we mostly process whole columns in tabular data, then a data frame is ideal
    because efficiently read from memory as a single memory block. However, a data
    frame makes memory access very inefficient if we need to process individual rows
    in various combinations because each variable in a row is stored in a separate
    memory block and because we need to access all variables to read each row. If
    the data are homogeneous, storing them in a dense matrix with cells stored in
    row-major order is a better choice.'
