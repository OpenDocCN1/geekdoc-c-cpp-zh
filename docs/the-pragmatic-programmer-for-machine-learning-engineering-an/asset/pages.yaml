    A deployment strategy or deployment pattern is a technique to replace or upgrade
    an artefact or a service in a production environment while minimising downtime
    and impact on users. Here we will focus on how we can deploy machine learning
    models (Section 5.3.5) without impacting their consumers, that is, the final users
    and the modules in the pipeline that depend on the models'' outputs. Clearly,
    there are similarities to how traditional software is deployed: we want automated
    and reproducible releases via CI/CD, in most cases using containers as artefacts
    (Section 7.1.4). Furthermore, parts of a machine learning pipeline are in fact
    traditional software and are deployed such.


    Model deployment can take advantage of modern software deployment strategies from
    progressive delivery. A pipeline will usually contain multiple instances of each
    model (say, version A) to be able to process multiple inference requests and data
    preparation queues in parallel. Therefore, we can initially replace a small subset
    of these instances with a new model (say, version B). If no issues emerge, we
