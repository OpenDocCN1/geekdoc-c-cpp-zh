  md: '# 6.1 Choosing Languages and Libraries


    The choice of what programming languages to use to write machine learning software
    is mainly determined by their performance, their observability, the availability
    of libraries whose functionality we can use and ease of programming.


    The performance of a programming language depends mainly on whether it is compiled
    (like C, C++ and Rust) or interpreted (like R and Python). Compilation takes a
    program and generates machine instructions that are stored in binary executable
    files or libraries, which can then be run repeatedly. Compiled code is generally
    high-performance because it does not require further processing when run: all
    the work of finding the most efficient sequence of machine instructions is done
    ahead of runtime. This includes deciding what instructions are appropriate for
    taking advantage of the CPUs, GPUs and TPUs on the system will run on. In contrast,
    interpreted languages execute a program by translating code into machine instruction
    during runtime. Interpreted code, therefore, does not necessarily exhibit high
    performance but is typically higher level (in the sense that it is more abstracted
    from hardware specifications, such as managing memory) and is easier to program
    because we can work with it interactively in REPLs In practice, programming languages
    used for machine learning exist on a spectrum between these two extremes. Both
    R and Python, despite being interpreted languages, have packages that are just
    thin wrappers around


    > REPL ("Read-Eval-Print Loop") is an interactive programming environment where
    the user can write code statements that are instantly evaluated and whose outputs
    are returned to the user. They are invaluable to run software piecewise and understand
    the behaviour of its components.'
  merge: -1
