  md: '# 152 6 Writing Machine Learning Code


    pipeline, so mastering the refactoring approaches from Fowler [105] is still valuable
    to address the code smells we discussed in Section 6.3. Refactoring approaches
    that are specific to machine learning code, on the other hand, keep in check the
    various types of technical debt we covered in Section 5.2.4. Tang et al. [339]
    point out that in particular: using inheritance to reduce duplicate configuration
    and model code; changing variable types and data structures to allow for performance
    optimisations (Sections 3.3 and 3.4); and hiding the raw model parameters and
    exposing custom types that have a domain meaning to achieve better separation
    between training and inference on one side and general metaheuristics and domain
    rules on the other.


    There is, however, an additional point that makes the code implementing machine
    models inherently different from other code as far as refactoring is concerned:
    we cannot slice and dice it in the process of refactoring it as easily as we would
    other code. Some models perform a single task (say, smoothing or prediction) and
    compose well with other code, but others are black-boxes that integrate multiple
    tasks (say, feature extraction and prediction) in ways that make it impossible
    to split them. Deep neural networks are a prime example of this. And even if we
    can refactor a model and the associated code into well-separated submodels, it
    is not given that we can change them as we would like. The probabilistic properties
    of each sub-model are inherited from the model we started from; we should make
    sure that the probabilistic properties of any new sub-model we introduce are compatible
    with those of others. Failing to do so will produce outputs that are biased in
    ways that are difficult to diagnose and impossible to correct because they lack
    the mathematical properties we usually take for granted. (The same is true for
    swapping whole models in an existing pipeline.) A possibly obvious example: we
    should match a model'
