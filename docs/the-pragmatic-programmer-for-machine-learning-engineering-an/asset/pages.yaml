    DVC (Data Version Control) [158] is an open-source tool that applies GitOps principles
    to data.¹ DVC manages data and machine learning models through metadata stored
    in text files, and it uses Git [360] to version them and to track their provenance.
    DVC is both a command-line tool and a library, and is language- and framework-agnostic.


