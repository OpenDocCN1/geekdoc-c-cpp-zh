    } \\notin A_{n-1}$, check whether the graph is still acyclic after adding $\\\
    {v_i \\to v_j\\}$.\n      i. If the graph is still acyclic, $A_n \\leftarrow A_{n-1}\
    \ \\cup \\{v_i \\to v_j\\}$.\n      ii. If the graph is no longer acyclic, nothing\
    \ is done."
