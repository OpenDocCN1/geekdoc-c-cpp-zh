    most functionality out of the box on a single programming language. For instance,
    PyCharm [166] offers features such as code inspection, code completion, syntax
    highlighting, version control, debugging, refactoring, test execution and container
    integration like other major IDEs, but also supports the Python REPL and provides
    introspection into the objects created by scientific computing libraries such
    as NumPy and Pandas. The reference IDE for the R language is RStudio [301], which
    integrates a console, and direct code execution, tools for plotting and inspecting
    R objects as well as history, debugging and workspace management.


    On the other hand, code editors are more limited out of the box, but they can
    reach feature parity with IDEs by installing and configuring third-party extensions.
