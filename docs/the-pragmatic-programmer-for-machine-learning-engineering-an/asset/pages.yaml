    # 7.1.3 Virtual Machines


    All modern CPUs (Section 2.1.1) implement instruction sets to support hardware
    virtualisation: for instance, Intel CPUs have Virtualisation Technology (VT-x)
    and AMD CPUs have AMD-V. This has made virtual machines (VMs, also known as “guest
    operating systems”) a convenient choice on local hardware and resulted in the
    wide availability of cloud instances. VMs run on top of a hypervisor, a specialised
    software allowing multiple guest systems to share a single compute system (the
    host hardware). A VM is like a normal compute system: the main difference is that
    its CPU, memory, storage and network interfaces are shared with the underlying
    hardware through the hypervisor which allocates them to the guests as needed.
    vSphere [389], KVM [249] and HyperV [219] are some examples of type-1 hypervisors
    (Figure 7.1, left panel): they run directly'
