    # 9.4.1 What Do We Want to Achieve?


    Following [424], we can summarise our goals as:


    +   - Model correctness: if input data follow the distribution we expect them
    to, outputs should be correct and predictions should be accurate with high probability.

    - Empirical correctness: outputs should be correct and predictions accurate for
    new data points, that is, the empirical performance of the models should be reliably
    above the threshold we set for our metrics (Section 5.3.1).

    - Model relevance: models should be able to represent the distribution of the
    data and to fit them without overfitting.

    - Robustness: models should handle invalid or extreme inputs gracefully.

    - Adversarial robustness: models should also handle malicious inputs that are
    crafted to be hard to detect and to produce specific outputs.

    - Efficiency: model training and inference should use the least possible amount
    of compute and memory that produces the desired level of predictive accuracy.

    - Interpretability, fairness and privacy: as discussed in Section 5.3.1.


    Tests should strive to ensure that these goals are met by investigating a variety
    of valid and invalid inputs and outputs for both individual models and the machine
    learning pipeline as a whole. They should give confidence in the ability of the
    pipeline to perform its assigned task well for common inputs and to degrade gracefully
    otherwise.'
