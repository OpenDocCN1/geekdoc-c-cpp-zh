  md: '# 60 Variable Types and Data Structures


    +   1. We compute the average of each vector, which we store in two accumulator
    variables.


    +   2. We compute the variance of each vector by summing up the squared differences
    from its average, which we store in two more accumulator variables.


    +   3. We do the same with the cross-product of the differences to compute the
    covariance, which is an additional accumulator variable.


    +   4. We divide the covariance by the square root of the product of the variances.


    Each of these steps can potentially build up an error large enough to produce
    a correlation coefficient that is either greater than 1 or less than -1. Floating
    point errors compound and propagate from the means to the variances and the covariances,
    affecting the final division through the accumulator variables that store them.
    In such a situation, we should store accumulator variables with higher precision
    than the variables they are accumulating to limit the magnitude of the errors
    of the individual operations: for instance, we should store the average of numbers
    stored in single precision as a double precision variable. Using FMA instructions
    may also help because, as we noted in Section 2.1.1, they operate at higher precision
    and only round their final result. Choosing the scale of the numbers accumulated
    may also help by keeping all variables in a range that is not prone to overflow
    or underflow. Keeping all variables on the same scale prevents catastrophic loss
    of precision, particularly in multiplications and divisions. This is the reason
    why so much numeric software works with quantities on log-scales: large numbers
    are reduced in magnitude and do not overflow or lose precision easily, and small
    numbers become large negative numbers instead of underflowing or losing precision.'
