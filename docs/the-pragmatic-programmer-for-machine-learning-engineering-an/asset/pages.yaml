    # 3.5.4 Model Training, Evaluation and Validation


    After ingestion and preparation, a machine learning pipeline passes the data either
    to model training modules or to inference modules (which we will discuss in Section
    5.3.5). The trained models are then evaluated (on their statistical performance)
    and validated (in domain terms) using software tests and human expert judgement
    to ensure they are efficient, reproducible and scalable. Only models that perform
    sufficiently well in both statistical and domain terms will be considered suitable
    for deployment and serving.


    Training a machine learning model consists in identifying an optimal instance
    in some model class (neural networks, random forests, etc.) by iteratively applying
    a combination of feature engineering, hyperparameter tuning and parameter optimisation.
    This is what the “learning” in “machine learning” refers to: a computer system
    is trained to learn a working model of some piece of the real world from the information
    contained in the data. The probabilistic techniques used for this purpose are
    specific to each model class and are beyond the scope of this book: see Kuhn and
    Johnson [188] for an approachable treatment of this topic. Training is a computationally
