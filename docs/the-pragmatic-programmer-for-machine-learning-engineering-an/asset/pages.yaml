    # 10.2.3 Accessing Data and Documentation


    Quickly accessing documentation during development is invaluable when working
    on complex code bases. We can use offline documentation browsers such as Velocity
    [323] or Dash, or the open-source Zeal [356]. All three can automatically download
    the docsets (HTML documentation archives for offline usage) for major programming
    languages and machine learning frameworks, and also integrate with the leading
    IDEs and code editors. Overall, they are interchangeable in terms of features.


    As for accessing data, object storage like AWS Amazon S3 is becoming the de facto
    standard for data interchange in data science and machine learning. Therefore,
    it is very useful to integrate code editors and IDEs with libraries capable of
    abstracting the listing, downloading and uploading of data into object storage
    buckets across multiple cloud vendors. A popular example is MinIO [223], which
    is fully compatible with the S3 APIs and provides an open-source SDK for multiple
    languages.


