    \ also be considered $O(1)$, since we choose two nodes regardless of $|V|$ or\
    \ $|A_n|$.\n\n+   - Depth-first and breadth-first search have time complexity\
    \ $O(|V|^2)$ since we have to scan the whole adjacency matrix to look for each\
    \ node's children. We only perform such search if we sample a candidate arc that\
    \ is not already present, because in order to include an arc $v_i \to v_j$ we\
    \ must make sure that there is no path from $v_j$ to $v_i$ in order to keep the\
    \ DAG acyclic. In turn happens with probability $O(|A_n|/|V|^2)$.\n\nThe overall\
    \ time complexity of Algorithm 1 for $N$ MCMC iterations is:\n\n> $O\\left(N\\\
