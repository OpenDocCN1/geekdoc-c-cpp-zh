    # 4.2 Computational Complexity and Big-O Notation


    Computational complexity is a branch of computer science that focuses on classifying
    computational problems according to their inherent difficulty across three different
    dimensions:


    +   - as a function of input size (say, the sample size or the number of variables);

    - as how much resources will be used, in particular time (say, CPU time spent)
    and space (memory or storage use);

    - on average (how long it will typically take), in the best case or in the worst
    case (how long it can possibly take).


    In other words, we would like to infer how much resources an algorithm will use
    from its specification: this is called algorithm analysis. Typically, the specification
    takes the form of pseudocode. As for resources, we must first choose our unit
    of measurement. In the case of space complexity, the choice is usually obvious:
    either an absolute memory unit (such as MB, GB) or a relative one (such as the
    number of double-precision floating point values) for various types of memory
    (RAM, GPU memory, storage). In the case of time complexity, we must choose a set
    of fundamental operations that'
