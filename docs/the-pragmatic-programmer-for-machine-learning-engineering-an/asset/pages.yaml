  md: '# 3 Variable Types and Data Structures


    # 3.1 Variable Types


    Machine learning software primarily deals with numbers that are the mathematical
    representation of the data we are modelling. Images can be represented using the
    values of the colour channels of each of their pixels; text can be encoded into
    strings, which are then converted to frequencies for particular words; sensor
    data are recorded as a time series. We can store each of them with different types
    of variables, each with pros and cons that we will discuss in Section 3.3.


    # 3.1.1 Integers


    Integer variables can be used to represent natural (N) or integer numbers (Z).
    They are often used to represent Boolean variables as *indicators* (also known
    as dummy variables*) as follows.


    | | |

    |---|---|

    | TRUE | 1 |

    | FALSE | 0 |

    | TRUE | 1 |

    | : | : |

    | : | : |

    | FALSE | 0 |

    | FALSE | 0 |


    More generally, they can be used to give a numeric representation to finite sets
    by mapping each element to a different integer number.'
