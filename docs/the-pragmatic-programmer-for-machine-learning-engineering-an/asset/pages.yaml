  md: '# 5

    Designing and Structuring Pipelines


    When we start writing a new piece of software, one of our first challenges is
    to identify its logical components and how they interact with each other. We can
    then structure our software into a series of modules, be they classes, libraries
    or completely separate programs, that implement those logical components in such
    a way as to make reasoning about the software as easy as possible. In other words,
    design software to divide and conquer complexity so that we only need to face
    a small fraction of it at any given time [252]. Failure to do so quickly leads
    to software that is impossible to understand and work on (Chapter 6), which in
    turn makes it difficult to deploy (Chapter 7), document (Chapter 8), test or troubleshoot
    (Chapter 9), and in general to keep running.


    In this chapter we discuss the unique challenges that define machine learning
    software design: the role of data (Section 5.1), the nature of technical debt
    (Section 5.2) and the anatomy of a machine learning pipeline (Section 5.3).


