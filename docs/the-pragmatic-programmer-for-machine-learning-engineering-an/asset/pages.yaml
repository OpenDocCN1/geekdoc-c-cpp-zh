    # 3.1.2 Floating Point


    Floating point variables are used to represent real (R) and complex numbers (C),
    the former with a single variable and the latter with two (one for the real part,
    one for the imaginary part). Each variable is composed of four parts: the sign
    S, the bias or offset O, an exponent E and a mantissa M. The floating point representation
    of a real number x is then


    ```

    x = (-1)^S * (1 + M)2^{E+O}.

    ```


    The overall size of the variable in bits is typically one of 16, 32, and 64 bits,
    often called half-precision, single-precision, double-precision. The number of
    bits assigned to each of the exponent (after adding the offset) and the mantissa
    depends on what encoding is used; the sign is always stored in a single bit. The
    variables defined in the IEEE 754 standard [253] reserve:


    | precision | exponent | mantissa |

    | half (16 bit) | 5 bits | 10 bits |

    | single (32 bit) | 8 bits | 23 bits |

    | double (64 bit) | 11 bits | 52 bits |'
