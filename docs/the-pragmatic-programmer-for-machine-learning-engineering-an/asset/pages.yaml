  md: "# 4-5 Some Examples of Algorithm Analysis\n\nWhen evaluating various aspects\
    \ of these models, it may be useful to be able to generate random DAGs to use\
    \ in simulation studies. In particular, we may want to generate DAGs with uniform\
    \ probability since since this is considered a non-informative prior distribution\
    \ on the space of the possible model structures. A simple MCMC algorithm to do\
    \ this is illustrated in [209]. We wrote it down as pseudocode in Algorithm 1.\
    \ For simplicity, we omit both burn-in (dropping the DAGs generated in the initial\
    \ iterations to give time to the algorithm to converge to the uniform distributions\
    \ over DAGs) and thinning (returning only one DAG every several generated DAGs\
    \ to return a set of DAGs that are more nearly independent even though both are\
    \ standard practice in the literature.\n\n# Algorithm 1 Random DAG Generation\n\
    \n**Input:** a set of nodes V (possibly with associated labels), the number N\
    \ of graphs to generate.\n**Output:** a set G of N directed acyclic graphs.\n\n\
    +   1. Initialise an empty graph with nodes V and $A_0 = {\\varnothing}$.\n2.\
    \ Initialise an empty set of graphs **G**.\n3. For a large number of iterations\
    \ $n = 1, \\dots, N$:\n   (a) Sample two random nodes $v_i$ and $v_j \\in V$ with\
    \ $v_i \\neq v_j$.\n   (b) If $\\{v_i \\to v_j\\} \\in A_{n-1}$, then $A_n \\\
