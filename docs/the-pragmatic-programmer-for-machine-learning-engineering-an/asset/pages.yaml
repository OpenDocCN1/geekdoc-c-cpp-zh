  md: '# #7 Packaging and Deploying Pipelines


    Packaging machine learning models into artefacts is an important step in making
    pipelines reproducible. It also makes models easier to deploy, that is, to bring
    them into production (or another target) systems and to put them to use. Choosing
    the right combination of packaging formats and deployment strategies ensures that
    we can build on CI/CD [86] to do that efficiently and effectively. Our ultimate
    goal is to ship a pipeline with confidence because we have designed (Chapter 5),
    implemented (Chapter 6), documented (Chapter 8) and tested it well (Chapter 9).


    Models are part of a machine learning pipeline as much as code is, and are packaged
    (Section 7.1) and deployed (Sections 7.2 and 7.3) in similar ways to traditional
    software. However, their behaviour is less predictable (Sections 5.2 and 9.2):
    we should monitor them when they are deployed and when they are running in production
    (Section 7.4). We should also have contingency plans for when they fail (Section
    7.5) so that we can restore the pipeline to a functional state (Section 7.6).


    # ##7.1 Model Packaging


    Models can be stored into different types of artefacts, as we briefly discussed
    in Section 5.3.4. There are several'
