    learning model. The key terms are the vocabulary we pass to word2vec.


    +   Inference (Section 5.3.5) involves users submitting new documents which are
    then prepared in the same way as those in the training set. The relevance of each
    document is measured as the degree of similarity with the “room” by pooling cosine
    distance and scaling it by the document’s length. Therefore, the machine learning
    model outputs a scalar number between 0 and 1 which is then used to rank the model.


    +   At the same time, the model parses each document sequentially identifies sequences
    of words with high relevance and highlights them. Therefore, each inference request
    also returns a modified version of the document that was submitted by the user.


    Training and inference are both computationally efficient. The complexity (Chapter
    4) of training varies between $O(N\log(V))$ and $O(NV)$, where $N$ is the number
    of documents and $V$ is the number of words in the vocabulary, depending on the
    implementation of word2vec. Inference is $O(N)$ for estimating relevance and for
    highlighting relevant portions of text, it can be implemented as a single pass
    over each document. In addition, word embeddings can be updated when new documents
    are available [172]: there is no need to relearn them from scratch when the embeddings
    become stale.


    In practice, Lipizzi et al. [195] limit V by asking the domain experts to provide
    a list of a few hundred key terms: manually assembling such a list is feasible
    because we are targeting a single type of goods or services as discussed in Section
    12.1. The sample size requirements of word2vec are dramatically reduced for the
    same reason [85], so both $N$ and $V$ are limited for'
