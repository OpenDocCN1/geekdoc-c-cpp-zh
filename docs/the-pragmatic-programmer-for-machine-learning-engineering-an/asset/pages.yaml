  md: '# Preface


    Pitching new ideas by prefacing them with quotes like “Data scientist: the sexiest
    job of the 21st century” [142] or “Data is the new oil” [357] has become such
    a cliché that any audience (in business and academia alike) will roll their eyes
    in exasperation. And for good reason. Likewise, we do not believe radiologists
    or lorry drivers will be replaced by artificial intelligence and out of a job
    for the foreseeable future, and we are not alone in realising the limits of machine
    learning [358].


    Even so, it is difficult to understand the impact that machine learning is having
    on many aspects of our lives. It has taken the pre-existing trends of using data
    and analytics (under the banner of “data mining”, “big data” and similar buzzwords)
    to inform business decisions and drive scientific discovery, and made them ubiquitous.
    Machine learning has combined the mathematical rigour of information theory and
    statistics, the computational aspects of computer science and the goal-driven
    flexibility of optimisation theory, redefining how we work with data.


    The flip side of trying to distill parts of so many disciplines has been the clash
    between their respective cultures, which has been well summarised by Leo Breiman
    in “Statistical Modeling: The Two Cultures” [54]. On top of that, there is a tension
    between machine learning practice in the industry and academia: the latter strongly
    values producing novel models and theoretical results, while the former is driven
    by the need to produce practical results that have business value. With


    xiii'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# xiv Preface


    so many different perspectives, it is a wonder that a rough consensus on what
    machine learning has actually evolved! (Personally, our red line is conflating
    deep learning with machine learning. There is life beyond deep neural networks!)


    In this melting pot of ideas, we feel that software engineering has played a remarkably
    small role compared to other disciplines. Machine learning, after all, is “a technique
    that allows computer systems to improve with experience and data” [122]. Therefore,
    there is a presumption that one will interact with a computer system, which in
    turn happens by engineering a piece of software what it is supposed to do. The
    quality of this engineering is crucial in both academia and industry. In academia,
    software quality issues are one of the underlying causes of the “reproducibility
    crisis” [234, 340]. In industry, poor engineering leads to lower practical and
    computational performance [177], to a quick accumulation of technical debt [313]
    and sometimes to catastrophic failures with costs in the millions [317, 319, 368,
    394]. There is, of course, a sizable amount of accumulated wisdom on how to architect
    and write software like The Pragmatic Programmer [369] and A Philosophy of Software
    Design [252]. However, these books are written with business software in mind,
    and we find that they do not capture or touch only tangentially on key practices
    that go a long way towards successfully implementing and deploying machine learning
    models. Analysis of algorithms; matching data and algorithms with appropriate
    hardware; embracing data as part of the software; testing and documenting algorithms
    and their implementations; modularising and building pipelines; and, last not
    least, naming variables. From our experience in academia and in the industry,
    engineering software and teaching software engineering to students and new staff
    alike, these topics are not given'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Preface


    the importance they deserve. We hope to convince the readers of this book that
    the viability of any software that analyses data, whether you call it machine
    learning, data science or business analytics, depends crucially on putting careful
    thought into these engineering practices. We do not aim to be prescriptive: the
    individual practices that we discuss be more or less relevant in different settings,
    and can be implemented with a variety of software tools. On the contrary, we want
    our readers to think about what we wrote in the context of their own experience
    and to figure out which parts apply and which do not!


    The book starts with a brief introduction to machine learning and software engineering,
    to set out how we view them and how we think that they should interact in practical
    applications. The remainder is structured in four parts, from foundational to
    practical:


    +   1. **Foundations of Scientific Computing**: covering key topics that are foundational
    for the *planning, analysis and design of machine learning software, such as:
    the trade-offs* of using different hardware configurations; and of suitable data
    structures; and the analysis of algorithms to determine their computational complexity.


    +   2. **Best Practices for Machine Learning and Data Science**: revisiting best
    practices in software engineering from the point of view of a machine learning
    engineer, from writing, *troubleshooting and deploying code* to production (that
    is, serving models) to writing technical documentation.


    +   3. **Tools and Technologies**: discussing broad classes of tools that shape
    how we think about what is feasible to do with machine learning pipelines, with
    examples from the state of the art and the trade-offs they make.'
