    experts identify the key terms in the domain and give them weights to encode their
    relative importance. New documents will be compared to this knowledge base, as
    distilled by a machine learning model: the more similar they are to those in the
    knowledge base, the more they are considered relevant. Clearly, this approach
    does not work if we train on models on a general-purpose data set like the Wikipedia
    corpus: as we argued in Section 5.3.1, identifying what data we need to collect
