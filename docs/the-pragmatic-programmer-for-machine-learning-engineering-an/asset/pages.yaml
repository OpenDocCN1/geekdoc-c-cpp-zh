    +   - Look up what are the first and last values in x for the column j by reading
    the jth element of p.

    - Position ourselves on the row number for that first value in i, and read every
    successive number until we find the row number j or we reach the end of the column.

    - Read the value of the cell from x, which has the same position in i; or return
    zero if we reach the end of the column.


    These three steps have an overall time complexity of O(1) + O(z/n) + O(1) = O(2
    + z/n) assuming z/n non-zero elements per column on average. Hence reading a cell
    from a sparse matrix appears to be more expensive than reading the same cell from
    a dense matrix.


    Assigning a non-zero value to a cell in a sparse matrix is more expensive as well.
    For each of i and x we need to:


    +   - allocate a new array of length z + 1;

    - copy the z values from the old array;

    - add the values corresponding to the new cell;

    - replace the old array with the new one.


    Therefore, time and space complexity are both O(z). Handling p is also O(z), and
    it is more complex since we will need to recompute half of the values on average.


