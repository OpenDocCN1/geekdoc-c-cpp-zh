  md: '10.2 Code Development


    # 10.2 Code Development


    Modern software development is a collaborative effort based on knowledge sharing,
    constant iteration and continuous feedback. Distributed version control systems
    and Git [360] in particular make all this possible by setting the standard for
    code versioning and collaborative development and by powering popular platforms
    such as GitHub and GitLab. Our ability to deliver and deploy software using DevOps
    relies heavily on Git together with semantic versioning [271] and commit tags.
    Therefore, Git is a tool that every software engineer should be familiar with.
    Machine learning and data science professionals should be familiar with it as
    well because it is used in and influences the design of software like DVC is used
    to work with pipelines.


    Choosing the right set of tools for writing code is a matter of prior experience
    with specific tools and personal taste. It may be a decision made either by individual
    developers or at the level of the team, research group or company the developers
    in order to standardise on a predetermined set of software. In either case, to
    work efficiently on a machine learning pipeline we will need for:


    +   - the programming languages that we will use (Section 6.3);

    - enforcing coding standards (Section 6.3);

    - automated refactoring (Section 6.7);

    - integrations with source code versioning (Section 6.5);

    - running software tests and summarising their results (Section 9.4);

    - interactive debugging (Section 9.4);

    - managing the containers (Section 7.1.4) that encapsulate the developing environment,
    and the ability to remotely work within them.'
