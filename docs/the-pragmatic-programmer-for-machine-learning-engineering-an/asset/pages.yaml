    VMs offer three main advantages:


    +   - They are flexible to operate: we can run multiple instances of different
    operating systems and of different software stacks on the same host, consolidating
    their configurations using pre-baked images and managing them centrally as individual
    entities.

    - They can also be scaled to deal with peak loads, both by starting new ones (horizontal
    scalability) or by increasing the hardware resources they have access to (vertical
    scalability, Section 2.4).

    - They can be moved to another host (portability) and are easy to snapshot, facilitating
    disaster recovery in the case of hardware failure.


    However, VMs have one important disadvantage: they contain an entire operating
    system and therefore require large amounts of hot storage. As a result, the deployment
    time of a VM can range from tens of seconds (in the best case) to minutes (in
    the average case) [139], depending on the cloud provider or on the on-premises
    hypervisor configuration.


