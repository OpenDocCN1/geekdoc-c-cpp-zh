    Algorithm analysis presents some additional complications in the context of machine
    learning software.


    The first set of complications is related to defining the size of the input. Machine
    learning algorithms typically have a large number of different inputs, and the
    size of each input has several dimensions (such as the sample size and the number
    of variables). Hence algorithms will belong to different classes of complexity
    for different dimensions, and it will be unlikely that any will dominate the others
    in all dimensions. Sometimes we can reduce the number of dimensions by considering'
