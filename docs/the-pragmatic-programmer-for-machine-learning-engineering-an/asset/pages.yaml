  md: '# 2.2 Making Hardware Live Up to Expectations


    All hardware types have powerful capabilities, each in their own way, but in order
    to use them effectively we need either compilers that can leverage them (if we
    compile software from source) or libraries that have been built to do so (if we
    cannot). This means using compilers that understand the memory layout of the system
    and what specialised hardware instructions are available, or software built on
    optimised libraries like CUDA [244] (for NVidia GPUs) or Intel''s Math Kernel
    Library (MKL) [156] (for CPUs). Some popular machine learning frameworks and libraries
    such as PyTorch [259] go even further and abstract all hardware-specific optimisations
    away, adapting automatically to the characteristics of the hardware they run on.


    The key to getting the best possible performance out of modern computer systems
    is to recognise that they have many processors (specialised or otherwise) and
    that we want to keep all those processors busy as much as possible. In other words,
    we need parallelism:


    +   - At the instruction level, we want software to use hardware instructions
    that can be executed simultaneously.


    +   - At the data level, we want tasks with modular inputs and outputs so that
    we can operate on each of their elements independently, without having to wait
    for other operations to complete.


    +   - At the thread level, we want different parts of our machine learning software
    to depend on each other''s outputs as little as possible so that we can run them
    in separate threads or processes across different cores, processors or even systems.


    To what extent thread-level parallelism is possible depends on what algorithms
    we are using and how they are implemented (see Section 4.6). The same is'
