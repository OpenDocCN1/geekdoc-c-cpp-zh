    can also be linked to and supplement architecture documentation, which describes
    the pipeline using the more accessible ubiquitous language (Section 8.3). Environment
    variables should be used to store runtime configurations as log-levels (Section
    5.3.6), feature flags (Section 6.5) and the labels of target testing or production
    environments. Environment variables are also commonly used for secrets management,
    that is, to store credentials, certificates and other sensitive information. All
