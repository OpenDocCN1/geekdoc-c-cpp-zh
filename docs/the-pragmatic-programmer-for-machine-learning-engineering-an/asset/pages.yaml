    # 3.2 Data Structures


    Data structures are particular ways of organising variables of one or more types
    for effective and efficient processing. Different data structures will be most
    effective for different operations or different algorithms. We will discuss both
    aspects further in Section 3.4 and later in Chapter 4, characterising memory and
    computational efficiency in terms of space and time complexity. Here we will only
    cover those data structures that are foundational for machine learning software,
    referring the reader to other excellent resources [50, 68] for a broader coverage
    of the topic.


    Why use data structures? Firstly, they make code more compact by allowing us to
    abstract away basic variable manipulations that would otherwise be repeatedly
    implemented in different places. Our code will be clearer and most likely have
    fewer bugs as a result. Secondly,'
