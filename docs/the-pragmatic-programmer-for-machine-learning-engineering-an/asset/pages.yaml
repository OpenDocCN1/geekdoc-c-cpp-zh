    et al. [195] base the pipeline design on the room framework developed in their
    previous work [196]. The key idea behind this framework is that we need to make
    machine learning models aware of the context they operate in to achieve a semantic
    understanding of the documents they analyze. The same word may have different
    meanings in domains: disambiguating them and their relevance is essential to move
    from natural language processing (NLP) to natural language understanding (NLU).
