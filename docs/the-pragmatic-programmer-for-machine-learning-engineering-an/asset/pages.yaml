  md: '# 256 10 Tools for Developing Pipelines


    RMarkdown and Julia notebooks are fully reproducible because they execute all
    the code in the notebook from the top in a clean environment by default, so there
    is no state inconsistency after we change the code in a cell and re-run it. Furthermore,
    both are easier to version and to diff Jupyter notebooks because they store text,
    outputs and figures in a separate Markdown, PDF or HTML file when compiled. RMarkdown
    notebooks are well supported by RStudio, which provides code auto-complete, linting
    and suggestions, but they can be edited with any text editor and compiled through
    the command line as well. We can also enhance them with the workflow R R package
    [44], which combines literate programming (with knitr [414]) and version control
    (with git2r [405]) to generate shareable HTML pages containing time—stamped, versioned
    code blocks and outputs. For reproducibility, each analysis is run in a new S
    session.


    Given how Jupyter notebooks are geared towards prototyping, we suggest that they
    should be integrated in a modern development workflow as follows:


    +   1. Experiment and build a prototype of the code using notebooks.

    2. When the prototype is complete, move the code to a new Git repository and start
    refactoring it using an IDE or a code editor to make it modular and scalable.
    At the same time, add software tests.

    3. Add docstrings [124] to the code using the text in Jupyter Markdown as a base.

    4. Package your artefact using pip [280] and setuptool [278] (Section 7.1.2) for
    later use as a module within the machine learning pipeline that will be imported
    by other Jupyter notebooks.'
