  md: '# 2.3 Local and Remote Hardware


    perform better while reducing costs. We can think of them as remote storage and
    remote compute, as they are labelled in Figure 2.1, connected by either a local
    or a geographical network.


    Remote systems that are in the same local network typically connected by a high-speed
    Ethernet connection. 50Gb Ethernet is good enough at the scale of Facebook operations
    [148], so throughput is not a limiting factor for smaller machine learning systems.
    Latencies are more of a problem: the networking equipment that routes the traffic
    in the network is likely to introduce several microseconds of delay in establishing
    a new connection.


    For remote systems that are in a different geographical location, both latency
    and bandwidth are limiting factors. A prime example is cloud instances, virtual
    servers that we can quickly create (“provision”) or destroy (“decommission”) and
    run on hardware that we own (a private cloud) or that we rent from a public provider
    such as Amazon Web Services (AWS), Microsoft Azure or Google Cloud Computing Services
    (GCP). Latency arises from the physical time it takes for signals to go through
    several layers of networking equipment to reach a system that is possibly in a
    different country. For instance, if we are located on the west coast of the United
    States the latency of a connection to the east coast is 40ms, to the United Kingdom
    is 81ms, and to Australia is 183ms [135]. If the remote system is activated on
    demand, we must also wait for it to boot before we can start processing any data:
    this can be between 15 and 4os depending on the type of virtualisation underlying
    the instances (Sections 7.1.3 and 7.1.4). Compared to the latencies in Figure
    2.2, accessing data on a remote system is therefore 3–6 orders of magnitude slower
    than the storage of a local system. This is the case, for instance, for AWS spot
    instances: while they are cheaper to run, they must be booted every time they
    are used and they may be shut down without warning.'
