    Training can take quite different forms depending on the nature of the data (Section
    9.4.3). In static learning, the model is trained from scratch on cold (offline)
    data selected to be representative of the data currently observed in production.
    Its statistical performance is then evaluated against either a separate set of
    cold data or a small stream of production data. In either case, the data should
