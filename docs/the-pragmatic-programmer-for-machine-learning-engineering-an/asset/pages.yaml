    \ 0 & 0 \\end{pmatrix}$\n```\n\nWe can store an adjacency matrix in a dense or\
    \ sparse matrix of size $|V|$: depending on how many arcs we expect to see in\
    \ the DAG, the trade-off between space and time complexity may be acceptable as\
    \ discussed in Section 4.5.2. The adjacency list of a graph is a set containing\
