  md: '# The Pragmatic Programmer for Machine Learning


    Machine learning has redefined the way we work with data and is increasingly becoming
    an indispensable part of everyday life. This book discusses how modern software
    engineering practices are part of this revolution both conceptually and in practical
    applications.


    Comprising a broad overview of how to design machine learning pipelines as well
    as the state-of-the-art software tools we use to make them, this book provides
    a multi-disciplinary view of how traditional software engineering can be adapted
    to and integrated with the workflows of domain experts and probabilistic models.


    From choosing the right hardware to designing effective pipeline architectures
    and adopting software development best practices, this guide will will appeal
    to machine learning and data science specialists, whilst also laying out key high-level
    principles in a way that is approachable for students of computer science and
    aspiring programmers.'
