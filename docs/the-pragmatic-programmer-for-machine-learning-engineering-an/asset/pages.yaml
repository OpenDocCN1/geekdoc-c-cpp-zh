    # 5.3.6 Monitoring, Logging and Reporting


    Monitoring modules collect the metrics identified in the scoping phase (Section
    5.3.1) to track at all times whether the pipeline achieves the required statistical
    and domain performance levels. The metrics should describe both the pipeline as
    a whole and individual modules to allow us to pinpoint the source of any issue
    we may have to troubleshoot. In particular:


    +   · Data ingestion and preparation modules (Section 5.3.3): we should monitor
    the same data metrics we check with property-based software tests to guard against
    data drift and data degradation.


    +   · Training modules (Section 5.3.4): we should monitor the same metrics we
    use for model validation and evaluation consistently across all models in the
    pipeline to separate issues with individual models from issues arising from the
    data. Especially when using online data.


    +   · Serving and inference modules (Section 5.3.5): we should monitor the same
    metrics we monitor during training to ensure that performance has not degraded
    over time (the so-called “training-serving skew”). And we should do that for all
    inference requests (possibly in small batches) so that we can guarantee that outputs
    are always in line with our targets. This is crucial to enable human-in-the-loop
    validation by domain experts for black-box models whose failure modes are mostly
    unknown and difficult to test.


    The coverage of monitoring facilities is important for the same reason why test
    coverage is important: both are tasked to identify a broad range of issues with
    the data (Section 9.1), with the models (Section 9.2) and with the pipeline (Section
    9.2.4) with enough precision to allow for root-cause analyses. Software tests
    perform this function at development and deployment time; monitoring does it at
    runtime.'
