    # 5 Designing and Structuring Pipelines


    In practice, we can implement monitoring with a client-server software such as
    Prometheus [275]. Each module in the pipeline produces all relevant metrics internally,
    tags them track provenance (which module, and which instance of the module if
    we have multiple copies running in parallel) and makes them available in a structured
    format through the client interface. Monitoring modules then provide the corresponding
    server that pulls the metrics from all clients and saves them into an event store
    database. They will also filter the metrics, sanitise them, and run frequent checks
    for anomalies. If any is found, the monitoring modules can trigger alerts and
    send failure reports to the appropriate people using, for instance, Alertmanager
    (which is part of Prometheus) or PagerDuty [255]. If our pipeline is sufficiently
    automated, we may also trigger retraining automatically at the same time. This
    is the only way to address anomalies in a timely manner and provide guarantees
    on the quality of the outputs of the pipeline. Cross-referencing the information
    in the event store to that in our configuration management system is invaluable
    in comparing the performance of our current production environment against that
    of past (now unavailable) environments. The same metrics may also be useful for
    troubleshooting infrastructure issues, like excessive consumption of computing
    resources, memory and I/O, as well service issues that impact downstream services
    and models, like readiness (whether a specific API is ready to accept requests)
    and excessive inference latency (how long it takes for the API to respond).


