    # 3.1.3 Strings


    Strings are sequences of characters encoded in binary form and stored into variables.
    Their binary format varies, but it is typically UTF-8 on Linux and MacOS X and
    UTF-16 on Windows. Both are Unicode standards [378] that use between 1 and 4 bytes
    to encode each character and support many alphabets, mathematical symbols and
    pictograms such as emoji.


    In the context of machine learning software, character strings are typically only
    encountered as input data in natural language processing (NLP) applications. In
    other settings, they are used as human-readable labels for the items in a set
    and can be represented as integers as we saw in Section 3.1.1. In fact, they are
    eventually given a numerical representation even in NLP in order to feed to algorithms
    such as wordvec [299], GLOVE [260] and BERT [78]. In NLP, strings are also preprocessed
    taking into account their meaning and their grammatical and syntactical properties
    to facilitate later analyses. For instance:


    +   - Common words do not adding to a sentence, often called stopwords, are removed
    to reduce the dimensionality of the data.

    - Words may be stemmed, that is, different words may be reduced to their common
    stem after removing suffixes and prefixes to identify which are in fact the same
    word.

    - Words may be tagged with their syntactic role.'
