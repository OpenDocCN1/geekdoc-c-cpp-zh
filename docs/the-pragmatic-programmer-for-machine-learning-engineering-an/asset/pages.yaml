  md: '# 9.2 Models Are the Problem


    # 9.2.3 Costly Models


    Fourthly, training large machine learning models is expensive and time-consuming.
    This makes for slow iterations and may very well make troubleshooting impractical.
    Among recent deep neural network architectures for NLP, Google''s XLNet [418]
    costs estimated $61,440 to train, taking 2 ½ days to 512 TPU v3 chips (Google''s
    proprietary AI coprocessors); University of Washington''s Grover-Mega [421] takes
    two weeks and $25,000; Google''s BERT [78] costs between $500 and $6,912 and takes
    4 days to 2 weeks to train. It is currently unknown how much OpenAI''s GPT-2 [285]
    originally cost to train, but the open-source OpenGPT-2 [66] took $50,000. And
    this only covers training: hyper-parameter tuning can easily train 10-100 models
    before finding a well-performing one. A recent study from the American Medical
    Association has found that simply reproducing one of these models using publicly
    available resources can cost between $1 million to $3.2 million [34].


    The numbers above represent a worst-case scenario. Deep neural networks for applications
    other than NLP are typically much smaller and much cheaper and quicker to train.
    For instance, the ResNet-50 architecture for computer vision tasks can be trained
    in minutes for a few dollars [338] because it only 25 million parameters (Grover-Mega
    and GPT-2 have 1.5 billion, XLNet has 340 million). And we rarely have to retrain
    models from scratch: it is common to use the current model as a pre-trained starting
    point or to buy a pretrainedtrained model from a commercial vendor. However, this
    practice may produce technical debt at the model level as discussed in Section
    5.2.2.) We can also trade training speed for cost and vice versa: slower solutions
    are cheaper, and their prices have been steadily falling in recent years. We may
    also be tempted to reduce the'
  merge: -1
  pgno: 237
- img_proc: true
  md: '# 222 9 Troubleshooting and Testing Pipelines


    overall computing costs with lazy code execution that may introduce non-deterministic
    behaviour and make troubleshooting even harder. Using cloud resources as massive
    parallel compute facilities to divide-and-conquer training may complicate things
    rather than make them easier because remote debugging in the cloud comes with
    its own set of problems (Section 2.3).


    Finally, let''s not forget that there are machine learning models other than deep
    neural networks: random forests and gradient-boosted trees [233] are much faster
    and cheaper to train and quite often achieve competitive performance, especially
    on tabular data.


    # 9.2.4 Many Models


    As mentioned in Section 9.1.2, dealing with complex data may require a complex
    machine learning pipeline involving several models linked by an orchestrator and
    to some extent by glue code. On the one hand, such code may be helpful in isolating
    the peculiarities of the different models and of that are used to implement them.
    On the other hand, glue code may introduce bugs in how models interact. These
    bugs are not easily detected without extensive integration tests, and are common
    in the “pipeline jungles” we discussed in Section 5.2.3. Unit tests would cover
    the correctness of individual models, but not the correctness of how they were
    wired together. The more models we include in our pipeline, the more difficult
    it is to troubleshoot their interactions because the number of possible pipeline
    configurations explodes combinatorially as the number of models increases. This
    may be compounded by the presence of dead and experimental code paths that are
    not essential to the functioning of the machine learning models (Section 5.2.4).


    Another issue, which we covered in Section 5.2.2, is that the more models we have
