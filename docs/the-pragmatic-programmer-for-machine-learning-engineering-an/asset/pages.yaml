- img_proc: true
  md: '# 264 11 Tools to Manage Pipelines in Production


    part of it in the cloud and the Kubernetes cluster that manages the resources
    of our local systems are all systems. Considering the prominent hardware plays
    in a machine learning application (Chapter 2), we find this definition unhelpful
    because it is too abstract about the architecture and the performance of the application
    (Chapter 5). The same goes for the even-more-abstracted view that “everything
    is just an API”.


    Managing the compute systems and the software in a real-world pipeline either
    manually or with a few simple scripts (which would qualify as glue code, Section
    5.2.3) is often burdensome: there are too many of them, follow different conventions
    that they are produced by different vendors), are not backward compatible and
    their configuration files use different languages and formats. Configuration management
    is the only possible approach to keep this complexity under control and to ensure
    that the pipeline is reproducible and auditable.


    One of the most widely-used tools for this task is Terraform [144], which defines
    itself as a tool to achieve “infrastructure as code”. Terraform is essentially
    an abstraction layer for a wide range of services [145] and platforms including
    Amazon AWS, Microsoft Azure, GitHub, GitLab and Airflow. Each platform is exposed
    as a service “provider” that communicates through APIs that we control, effectively
    decoupling our infrastructure from the APIs of the original service. Terraform
    takes care ofising resources in the original service and of configuring them.
    For instance, we can use it to create remote resources such as an EC2 instance
    on Amazon AWS, an object storage on Azure or a VM on a local vSphere [389]. However,
    it does not handle the installation or the configuration of operating systems
    and software packages.


    Cloud instances, VMs and development machines based on Vagrant [146] and Packer
    [143] can be installed and'
