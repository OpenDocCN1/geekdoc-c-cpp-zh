    matching the new document to the closest “room”. The latter task can reuse the
    inference module that computes document similarity, so it has linear time complexity
    and should not noticeably impact the time complexity of the pipeline.


    The inputs and outputs of each data ingestion, model training and inference have
    well-defined characteristics that make it easy to construct a suite of software
    tests on property-based testing (Section 9.4) and to monitor their behaviour in
    production (Section 5.3.6). The models and the algorithms involved are easy to
    replace with new ones that have better performance in model evaluation and validation
    (Section 5.3.4) because we can demonstrate them to be functionally equivalent
    to those we are currently using. In particular:


