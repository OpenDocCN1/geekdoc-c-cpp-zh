    on the host hardware, either as standalone pieces of software or integrated in
    the host operating system. Type-2 hypervisors (Figure 7.1, right panel) like Virtual
    box [251] and VMware Workstation [390], on the other hand, run on top of the host
    operating system. Both types are limited to executing applications compiled for
    the same type of CPU they are running on.


    Thanks to hardware virtualisation, VMs can run on the host CPU and access the
    host’s hardware resources with limited overhead via PCIe pass-through (GPUs are
    a typical example, see Section 2.1.1). Overhead can be further reduced by moving
    from (complete) virtualisation to paravirtualisation, which trades off isolation
    of the guests for better throughput and latency. The guest operating system is
    now aware of running in a virtualised environment, and it can use a special set
    of calls (hypercalls) and I/O drivers (especially for storage and networking)
    to communicate directly with the hypervisor.


    VMs are the second type of artefact mentioned in Section 5.3.4. We can either
