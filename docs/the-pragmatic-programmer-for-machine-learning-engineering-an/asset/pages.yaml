  md: '# 8.4 Documenting Algorithms and Business Cases


    # 8.4 Documenting Algorithms and Business Cases


    The documentation of individual modules and of how they work together in the machine
    learning pipeline should be supplemented by two other documents:


    +   - a technical report detailing the relevant probabilistic and statistical
    properties of the machine learning models; and

    - a mission statement describing, at a high level, what is the goal of the machine
    learning pipeline from a domain or business perspective.


    There are several reasons for preparing a technical report covering the relevant
    facts about the algorithms and the models. Firstly, we can establish a coherent
    mathematical notation that agrees with the ubiquitous language (Section 8.1) and
    with the variable naming scheme used by our modules (Section 6.2), and can be
    related to that of any external libraries we may be using. Different parts of
    the scientific literature have have different notation practices: the same concepts
    may be expressed with different notation or have different definitions, or the
    same notation may have different meanings. This is likely to cause some confusion
    because of the variety of approaches involved in a real-world machine learning
    pipeline. Secondly, a technical report will reduce the need to access the academic
    literature, which can become difficult over time because journal papers, conference
    proceedings and their supplementary materials can be locked behind paywalls or
    simply vanish from the Internet when their authors change employers. Thirdly,
    we can limit ourselves to the properties of the models and of the algorithms that
    are relevant to us, and we can concentrate on documenting those properties well
    and in an approachable way. (It is not common'
  merge: -1
  pgno: 221
- img_proc: true
  md: 'for the canonical reference for a model to be its clearest illustration, especially
    in machine learning where 8–page conference papers represent a fair share of the
    literature! In particular, we can focus on the pros and cons of any models and
    algorithms we evaluate for use in the pipeline with respect to the specific domain
    that is relevant to us. This will be more informative than most benchmarking efforts
    based on reference data sets from the literature. Finally, we can easily cross-reference
    the technical report with both module interface (Section 8.2) and design documentation
    (Section 8.3).


    A mission statement, which [64] calls a “domain vision statement”, is a brief
    document of 1–2 pages identifying the core domain of the machine learning pipeline
    and its aims as established during project scoping (Section 5.3.1). It serves
    two purposes: evaluating whether the pipeline is fit for its intended purpose
    and guiding its evolution at a strategic level. By stating its purpose, the mission
    statement tells us what outcome we should judge. In turn, this allows us to define
    a scale of measurement ranging from “bad performance” to “good performance” according
    to how effectively and efficiently the pipeline fulfils its purpose. At the same
    time, it can serve as a high-level guideline for evolving it. The compute systems,
    the machine learning models and the domain concepts the pipeline is built upon
    inevitably change over time. With each change, we can plan at the tactical level
    how to evolve it by pinpointing which components we should update and how. However,
    all these local changes should be consistent with a long–term strategy that ensures
    the pipeline evolves coherently as a whole over time as its intended purpose changes.
    In other words, the mission statement is the “aspirational” counterpart of the
    technical design documentation (Section 8.3) and of the more practical use cases
    (Section 8.5).'
