  md: '# 9.1 Data Are the Problem


    # 9.1.2 Heterogeneous Data


    Furthermore, we must consider that data may be heterogeneous, comprising variables
    encoded with different data types and complex data structures. Data ingestion
    and preparation (Section 5.3.3) then require several algorithms and auxiliary
    models to filter out poor-quality data points, impute missing data and extract
    relevant features. Additional models may also be required to process the outputs
    of the core machine learning models. If one input variable changes, it is bound
    to affect one or more models in what we called a correction cascade [312] in Section
    5.2.1. In a sense, we can see it as a form of entanglement that spans multiple
    models (Section 9.1.1); or as a form of coupling between models that are (some-undeclared)
    consumers of each other’ outputs, effectively making them work as a single large
    model (Section 9.2.1).


    Heterogeneous data points are difficult to subsample at random is unlikely to
    yield a subset that is representative of the overall data set. Observations belonging
    to less-frequent classes in imbalanced data are unlikely to appear in a random
    subsample in sufficient numbers or at all: our estimates of predictive accuracy
    for the machine learning models can remain high even if they are consistently
    misrepresented. Subsets are also likely to have a different distribution (as captured
    by summary statistics) compared to the overall data, which may trigger calibration
    issues. Outliers that may be causing trouble in the original data are likely to
    be dropped, making it difficult to replicate the issues we are troubleshooting
    (reliably or at all). All these problems become more and more pronounced as the
    difference in size between the original data and the subsamples grows.'
  merge: -1
  pgno: 233
