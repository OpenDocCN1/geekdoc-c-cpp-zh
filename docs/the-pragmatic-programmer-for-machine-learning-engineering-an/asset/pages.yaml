  md: '# 11

    Tools to Manage Pipelines in Production


    The production environments of machine learning pipe-lines often have more moving
    parts than those of traditional software, and the MLOps software to manage them
    is a broad and fast-moving field with many platforms, projects and tools. The
    underlying infrastructure may be more complex (Section 11.1), and the combination
    of data, code and models that makes up the pipeline is certainly more heterogenous
    (Section 11.2). In addition to the tools and technologies we need to manage them,
    we also discuss those that we may use to complement pipelines with the dashboards
    and reporting capabilities that are common in data science (Section 11.3).


    # 11.1 Infrastructure Management


    Successfully running a machine learning application in production goes beyond
    just implementing a pipeline: it involves managing different local and remote
    compute systems and integrating different pieces of software that communicate
    with each other through various APIs. Confusingly enough, the literature refers
    to both as “systems”, meaning anything that requires configuration, takes some
    inputs and produces some outputs in response. With such an abstract definition,
    compute systems, the GitHub organisation that hosts our code, the Amazon AWS EC2
    instances that run'
  merge: -1
