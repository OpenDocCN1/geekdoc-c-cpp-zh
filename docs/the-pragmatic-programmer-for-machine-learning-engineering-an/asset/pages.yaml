    # 5.2.3 At the Architecture (Design) Level


    The architecture of a machine learning pipeline directs how data and models interact
    to achieve its goals: it is implemented as an orchestration system that schedules
    and coordinates various tasks such as data ingestion, data validation, feature
    engineering, model training and validation, model deployment on production systems,
    and serving. We will discuss them in detail in Section 5.3.


    Machine learning pipelines are inherently complex systems with many moving parts,
    and they can easily hide architecture (design) debt. The key to keeping this type
    of technical debt in check is to give visibility into all aspects of their configuration
    as code using files in a human-readable data serialisation language like XML,
    YAML or JSON. These files should be under version control in a configuration management
    solution along the data (Section 5.1) and the models (Section 5.2.2), and for
    similar reasons. Each change in design can then be expressed in those configuration
    files or using environment variables. Configuration files should be used for parameters,
    options and settings for which we need complete versioning across iterations,
