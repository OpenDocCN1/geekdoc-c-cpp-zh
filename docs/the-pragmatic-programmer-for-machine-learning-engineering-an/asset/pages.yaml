    an average similarity measure is calculated that presents the level of similarity
    of the entire document with respect to the entire benchmarks. [...] A document
    with a higher measure is more relevant or like the benchmarks.",


    and the relevance of individual passages, which is defined as follows:


    "To determine the relevant parts of each recommendation, the document was looked
    at in segments of words. [...] It was found that with a window of 20 words from
    the similarity matrix, the actual document (which includes the raw text) would
    have a'
