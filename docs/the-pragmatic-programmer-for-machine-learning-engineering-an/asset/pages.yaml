  md: '# # What Is This Book About?


    The modern practice of data analysis is shaped by the convergence of many disciplines,
    each with its own history: information theory, computer science, optimisation,
    probability and statistics among them. Machine learning and data science can be
    considered their latest incarnations, inheriting the mantle of what used to be
    called “data analytics”. Software engineering should be considered as crucial
    addition to this list. Why do we need it to implement modern data analysis efficiently
    and effectively?


    # ## 1.1 Machine Learning


    There are many definitions of machine learning. Broadly speaking, it is a discipline
    that aims to create computer systems and algorithms that can learn a structured
    representation of reality without (or less) human supervision in order to interact
    with it [305]. At one end of the spectrum, we can take this to be a narrow version
    of artificial general intelligence in which we want our computer systems to learn
    intellectual tasks independently and to generalise them to new problems, much
    like a human being would. At the other end, we view machine learning as the ability
    to learn probabilistic models that provide a simplified representation of a specific
    phenomenon to perform a specific task [110] such as predicting an outcome of interest
    (supervised learning)'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# 2


    # 1 What Is This Book?


    or finding meaningful patterns in the data (unsupervised learning). Somewhere
    in between these two extremes lie expert systems [60], which “capture the ability
    to think and reason about as an expert would in a particular domain” and can provide
    “a meaningful answer to a less than fully specified question.”

    Broadly speaking, in order to do this:


    +   1. We need a working model of the world that describes the task and its context
    in a way that a computer can understand.

    2. We need a goal: how do we measure the performance of the model? Because that
    is what we optimise for! Usually, it is the ability to predict new events.

    3. We encode our knowledge of the world, drawing information from training data,
    experts or both.

    4. The computer system uses the model as a proxy of reality, as new inputs come
    in, to perform inference and decide if and how to perform the assigned task.


    The exact form these elements take will depend on the domain we are trying to
    represent and on the model we will use to represent it. Machine learning is, at
    its core, a collection of models and algorithms from optimisation, statistics,
    probability and information theory that deal with abstract problems: from simple
    linear regression models [398], to Bayesian networks [314], to more complex models
    such as deep neural networks [122] and Gaussian processes [288]. These algorithms
    can be applied to a variety of domains from healthcare [381] to natural language
    processing [2] and computer vision [393], with some combinations of algorithms
    and domains working out better than others.


    In classical statistics (Figure 1.1, bottom right), analysing data required the
    modeller to specify the probabilistic'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# 1.1 Machine Learning


    | Information from the data | | |

