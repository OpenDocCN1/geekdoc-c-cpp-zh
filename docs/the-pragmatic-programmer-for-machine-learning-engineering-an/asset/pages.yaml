    # 11.2 Machine Learning Software Management


    Machine learning applications can be designed, tested, maintained and delivered
    in production using integrated MLOps platforms that blend tooling and practices
    from DevOps (Section 5.3) with data processing (Section 5.3.3), model training
    and serving (Sections 5.3.4, 5.3-5 and 7.2). This is a very recent trend at the
    time of writing, so the label “MLOps platform” (or “Machine Learning Platform”)
    has been attached to a variety of tools. At one end of the spectrum, we have online
    platforms like AWS Sagemaker [111], Vertex AI [130], Tensorflow Extended [347],
    Databricks [76] and Neptune [238]. At the other, we have more lightweight solutions
    like Airflow, MLflow and DVC that are built on top of a collection of smaller
    open-source tools that are not specific to machine learning applications. On top
    of that, we have established CI/CD platforms such as GitLab that are working on
    MLOps features [117] which overlap with those of the platforms above. We expect
    it will take a few years before MLOps platforms consolidate into a small number
    of clear categories. In the meantime, we are choosing between tools that are not
    mature and have different, unclear trade-offs; there certainly no one-size-fits-all
    solution at the moment! However, we can safely mention one trade-off: integrated
    platforms are limiting because they are often opinionated (they make it difficult
    to support configurations and others'
