    Ideally, the code we write should be self-explanatory: everyone should be able
    to understand how it works and why it was implemented the way it was just by reading
    it. In practice, this aspiration is impossible to achieve for real-world codebases
    of any significant size even if we put effort into making code as clear as possible
    (Chapter 6). Hence we need documentation: a living, natural-language explanation
    of the machine learning systems and of the pipeline that evolves along with them.
    Documentation is not a single entity, but rather a collection of information with
    different scopes, levels of detail, technical levels and audiences: comments explaining
    the “whats” and especially the “whys” of different chunks of code (Section 8.1);
    documents describing the public interface of each module and how to use it (Section
    8.2); a holistic description of how the pipeline is structured and how its parts
    fit together (Section 8.3); white papers detailing what machine learning models
    have been implemented and why, and what business or academic needs they address
    (Section 8.4). To complement these pieces of information, we should showcase how
    we envisage the machine learning pipeline will be used in practical day-to-day
