    to troubleshoot. We can also deploy multiple models at the same time to compare
    their performance in terms of accuracy, throughput and latency. As a result, progressive
    delivery speeds up model deployment (by reducing the amount of pre-deployment
    testing), decreases deployment risk (because most consumers will not be impacted
    by any issues that may emerge'
