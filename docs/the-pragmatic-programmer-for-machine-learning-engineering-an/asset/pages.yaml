  md: '# 260 10 Tools for Developing Pipelines


    Pylint [197] is the reference static code analyser and linter for Python: it is
    based on PEP–8 (Python Enhancement Proposal 8), the official document that contains
    the guidelines and best practices on how to write Python code. An alternative
    is Flake8 [331], which builds on other tools such as pyestyle (a style guide checker),
    pyflakes (a source files checker for errors) and mccabe (a tool to check the complexity
    of the code). A comprehensive linting step for Python code should apply a sequence
    of tools such as:


    +   1. isort [72] to sort imports alphabetically and separate into sections by
    type;

    2. black [190] to format the code;

    3. flake8 to check the code style;

    4. pylint as the final step to run static code analysis.


    The styler package [228], which enforces compliance with the tidyverse style guide
    [400], and the lintr package [150], performs static code analysis and which identifies
    syntax errors and potential semantic issues, fills the roles of the Python packages
    above for R code. Both lintr (using vignette("continuous-integration")) and stylist
    support CI/CD integration [229], accept user-provided code style policies and
    integrate with RStudio.


    Writing documentation and keeping it up-to-date is also key to maintaining machine
    learning pipelines over time. Documentation should be versioned like code and
    kept as close as possible to the code it refers to. Documentation on module, function
    and class interfaces or method definitions can be placed in both Python [124]
    and Julia [185] code using structured comments in the docstring or Sphinx format;
