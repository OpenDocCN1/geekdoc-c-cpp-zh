    # 6.5 Effective Versioning


    Storing code in a version control system (“versioning” for short) has become a
    standard practice in software engineering [86, 105], and it benefits machine learning
    pipelines as much as traditional software. We can track the evolution of code
    over time, navigating its history and reverting it back a functioning state if
    it breaks. We can also track the data, the models and the pipeline configurations
    together with the code as discussed in Section 5.2.3. Multiple developers can
    work on the code at the same time, merge their changes, resolve any conflicts
    that may arise with the help of dedicated tools and produce releases tagged with
    a semantic versioning scheme [271]. Versioning also ensures that all changes to
    the code are tracked (for code integrity and developer accountability) and applied
    by appending them to a read-only ledger of commits (to obtain immutable releases
    and snapshots). Therefore, versioning provides the “single source of truth” of
    our code that enables the automated workflows of MLOps (Section 5.3), continuous
    deployment (Chapter 7), software testing (Section 9.4) and refactoring (Section
    6.7).


