    # 7.5 What Can Possibly Go Wrong?


    Many kinds of issues can arise when we deploy a new model, for different reasons:
    lack of control or observability for either the deployment process or its targets
    (Section 2.4); manually executing pre- or post-deployment operations (Section
    5.2.3); or a critical defect in a model or a module slipping through our software
    test suite (Section 9.4). We can minimise deployment risk by taking advantage
    of CI/CD (Chapter 5) and following modern development practices (Chapter 6), but
    some problems cannot be fully resolved or ever detected automatically.


    Hardware resources may be unavailable. The environment we are deploying may be
    running on machine learning systems that have inadequate resources (say, not enough
    storage space or memory), hardware faults or network connectivity issues (say,
    the systems themselves are unreachable, or they cannot access remote third-party
    resources needed by the model). These problems can occur both in local (on-premises)
    and remote (cloud) environments; in the latter, scheduling a new deployment will
    typically solve them since the underlying hardware will change (Section 2.3).


    Hardware resources may not be accessible. The machine learning systems may be
    fine, but there are access restrictions in place that prevent us from using them.
    Firewalls may be preventing us from connecting to them across networks; file permissions
    may be preventing us from reading data and configurations from their storage.
    This is a common issue with cloud instances and managed


    > Connectivity issues between compute systems, clusters or data centers due to
    the failure of network devices or network connections are also called “network
    splits” or “network partitioning” [5].'
