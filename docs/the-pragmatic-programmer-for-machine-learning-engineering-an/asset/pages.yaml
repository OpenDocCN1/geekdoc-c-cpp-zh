    # 4.5.2 Sparse Matrices Representation


    Matrices in which most cells are zero are called sparse matrices, as opposed to
    dense matrices in which most or all elements are non-zero. In the case of dense
    $(m \times n)$ matrices, we need to store in the memory values of all the cells,
    which means that their complexity is $O(mn)$. However, in the case of sparse matrices,
    we can just store the non-zero values and their coordinates, with the understanding
    that all other cells are equal to zero.


    R provides several representations in the Matrix package [30], and Python does
    the same in scipy [388]: the default is the column-oriented, compressed format
    described in Section 3.2.3. Consider the matrix originally shown in Figure 3.4,
    in which 9 cells out of 15 are zeros.


    ```

    library(Matrix)

    m = Matrix(c(0, 0, 2:0), 3, 5)

    m

    ## 3 x 5 sparse Matrix of class "dgCMMatrix"

    ##

    ## [1,] . 1 . 2

    ## [2,] . 2 . 1

    ## [3,] 2 .1 .

    ```


