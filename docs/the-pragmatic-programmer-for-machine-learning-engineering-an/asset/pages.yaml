    # 4.6 Big-O Notation and Real-World Performance


    Big-O notation is a useful measure to assess scalability, and it can often be
    related to the practical performance of real machine learning software. However,
    this becomes increasingly difficult as such software becomes more complex, for
    several reasons. For instance:


    +   - Software in a machine learning pipeline is heterogeneous parts are typically
    written in different programming languages and are built on different libraries.
    Each part may be faster or slower than another because of, even when they belong
    to the same class of complexity. More on that in Section 6.1. Software upgrades
    may also change the relative speeds of different parts of the pipeline and introduce
    new bottlenecks.'
  merge: -1
