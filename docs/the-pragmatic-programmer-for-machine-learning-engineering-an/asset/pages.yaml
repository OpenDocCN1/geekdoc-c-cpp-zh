    # 2 Hardware Architectures


    On the one hand, we want to preserve locality as much as possible: colocating
    the data and all the compute systems will work on it to avoid large, repeated
    data transfers across different locations. Designing the topology of the local
    network connecting different systems can minimise the impact of data transfers
    within the network and make it feasible to spread the load of training complex
    models across different systems [148]. This approach is known as distributed or
    federated learning [192]: as example, the research done at DeepMind for distributed
    deep reinforcement learning [94] and Google’s systems architecture for federated
    learning for mobile devices [47]. The latter is an instance of edge computing
    [181], which addresses data privacy, security, and latency constraints by pushing
    data processing to low—power devices closer to where the data originates Section
    5.3.1).


    On the other hand, it is desirable to keep geographical spread for the purpose
    of disaster recovery. Keeping multiple copies of the data and of the models in
    different locations makes it unlikely that a hardware failure will result in the
    loss of crucial resources: a time-honoured strategy to achieve that is the “3-2-1
    backup rule” (3 copies of your data, your production data and 2 backup copies,
    on 2 different types of storage with 1 copy off). It also helps with locality,
    but requires some care in synchronising the data and the models at different locations
    to ensure that the correct version is used everywhere.


