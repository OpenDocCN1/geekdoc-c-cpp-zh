    # 5.2 Technical Debt


    Treating data as code means we should consider data as a potential source of technical
    debt. Models can also be sources of technical debt because of their dependence
    on data and in their own right. In practice, the data and the models are dependencies
    of our machine learning code: like all dependencies, they are a potential liability
    and should be handled as such.


    The term “technical debt” has commonly had a negative connotation since it was
    first introduced [73, 74]: it highlights how hasty design choices can lead to
    unexpected costs, not only in purely economic terms, but by introducing latent
    complexity that makes the software more difficult to evolve over time. Technical
    debt allows us to produce results faster by trading quality for speed but, as
    with borrowed money, we must eventually pay it off with (compound) interest. It
    is unavoidable when tight deadlines reduce the time spent'
