    In academia, we cannot make any change to a pipeline halfway through a set of
    experiments without potentially introducing confounding in the results. In business,
    we may have service-level agreements with our customers that make it risky to
    deploy new models without a compelling reason to do so. Artefacts may also be
    found to be unsuitable for deployment for security reasons: for instance, we may
    find out that a container contains vulnerable dependencies or is misconfigured
    (Section 7.1.4).


    Model deployment is not implemented as a module: rather, it is the part of the
    orchestration that enables models to be deployed to a target environment. Models
    deployed in production will be served so that users, applications or other models
    can access their inference capabilities. Models deployed to test environments
    will be evaluated by software tests and expert judgement, and those deployed to
    development environments can be used for troubleshooting bugs or further investigation
    of the data.


    How a machine learning model is deployed depends on how it has been packaged into
    an artefact and how it will be used. File artefacts can be either embedded in
    a software library that exposes inference methods locally or served “as-a-service”
    from a model registry using suitable remote APIs and protocols as RESTful or,
    when we need low latency, gRPC [108]. Container artefacts can be deployed by all
    orchestration platforms in common use, which provide built-in monitoring and logging
    of hardware and software metrics (load, memory and I/O use) as well as troubleshooting
    facilities. Despite being intrinsically more complex, container artefacts are
    easier to deploy because they are ephemeral and highly portable, and because we
    can manage as both their runtime dependencies and configuration. We will develop
    this topic in detail in Sections 7.1.4 and 7.2 using Dockerfiles as a reference.'
