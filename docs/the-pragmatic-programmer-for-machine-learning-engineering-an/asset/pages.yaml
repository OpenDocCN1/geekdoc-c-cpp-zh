    of any hardware or software issues affecting the other modules in the pipeline.
    We should also set them up (or the MLOps platform, if we are using one in their
    place) in a clustered configuration to avoid single points of failure and strive
    for maximum scalability and reliability. They will be required to restore the
    pipeline to a functional state, for instance, by rolling back malfunctioning machine
    learning models. Keeping the model registry in the cloud makes replicating it
    in different geographical regions easier, increasing its availability and reliability
    in adverse scenarios.


    How can we design a backup and disaster recovery strategy? That depends on how
    we manage our infrastructure is local, remote or a mix of both. If we can rely
    on configuration management and we have our infrastructure completely described
    as-code, it may be preferable to re-create from scratch and re-run the CI/CD pipeline.
    Just re-running the CI/CD pipeline may be enough to fix minor issues such as a
    botched module deployment. For instance, Kubernetes can back up the state of any
    cluster it manages and restore from a single component to the complete cluster
    in case of disaster. If our infrastructure is not stored as-code, which may be
    the case for legacy environments, we can only rely on taking regular snapshots
    of all systems and restoring them as needed.


    If part of our infrastructure is remote, we should keep in mind cloud providers
    and third-party services can fail and have downtimes of a day or two. Therefore,
    it is safer to have a set of geographically-distributed systems with a mix of
    cloud and local deployments. In the case of inference modules, we can thus ensure
    that the users or the services that consume the inference outputs can fall back
    to a functioning system in case of failures (hopefully handling retries and fallbacks
    transparently).'
