  md: '# 12.1 The Domain Problem


    The first step in creating a machine learning pipeline is to define its scope,
    starting with the problem it will try to solve (Section 5.3.1). Lipizzi et al.
    [195] frame it as follows:


    a system to determine what are the most relevant recommendations that stakeholders
    are providing to the Defense Acquisition community [...] extracting user-specific
    relevance from text and recommending a document or part of it."


    In other words, we envisage that users will submit one or more documents and that
    the machine learning pipeline will rank them in terms of overall relevance, highlighting
    the most relevant passages in each document at the time. This would be an ideal
    opening in the mission statement document (Section 8.4).


    The domain metrics that Lipizzi et al. [195] focus on are relevance of each document,
    which is defined as:


    By counting the number of words with a similarity more than a threshold (such
