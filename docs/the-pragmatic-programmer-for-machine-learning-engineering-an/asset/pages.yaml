    organizes experiments within Git projects using commits, branches and tags. It
    automatically tracks data dependencies, machine learning code, parameters and
    model artifacts we can compare different experiments using either its command
    line or its web interface. MLflow instead provides a tracking server and client
    libraries that can be integrated into Python, R and Java code as discussed in
    [Section 5.3.6](). The tracking server stores the metadata, parameters, metrics
    and tags collected by the clients for each experiment run into a file or a database.
    Larger outputs like data files, images and model artifacts are saved separately,
    for instance, in an object storage.


