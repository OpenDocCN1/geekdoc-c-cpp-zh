    # 11.3 Dashboards, Visualisation and Reporting


    Data visualisation is an essential part of data science and machine learning:
    it helps explain complex data and makes them understandable by users and domain
    experts, allowing them to participate in the design and maintenance of the pipeline
    [Chapter 5]. As in Section 11.2, we can choose to implement it with a spectrum
    of solutions, from low-level libraries for data exploration to more comprehensive
    visualisation platforms that create interactive dashboards and data reports.


