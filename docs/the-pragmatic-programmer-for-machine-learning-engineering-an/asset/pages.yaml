  md: '# 3 Variable Types and Data Structures


    In exploring the components that machine learning systems are built on, we stressed
    that different types of hardware are optimised to work with data and models stored
    in specific formats. Both are complex entities comprising a variety of elements
    that are organised into data structures such as data frames (representing tabular
    data) or standardised model formats like ONNX [247]. The individual elements inside
    these data structures are variables of specific types such as integer numbers,
    floating point numbers and strings.


    In this chapter we revisit the variable types we mentioned in Chapter 2, as well
    as string representations, and we discuss possible reasons to choose one over
    another for different classes of data (Section 3.1). We then give some notable
    examples of how variables are organised in data structures such as vectors and
    lists (Section 3.2.1), data frames (Section 3.2.2) and matrices (Section 3.2.3).
    Different choices of variable types (Section 3.3) and data structures (Section
    3.4) represent different trade-offs both in terms of hardware support, as we saw
    in Chapter 2, and in terms of the computational complexity of the machine learning
    algorithms that will operate on them, as we will discuss in Chapter 4.'
