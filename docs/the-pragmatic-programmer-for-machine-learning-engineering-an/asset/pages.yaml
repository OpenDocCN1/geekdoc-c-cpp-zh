    model generating them in order to draw inferences from a limited number of data
    points. Such models would necessarily have a simple structure for two reasons:
    because the modeller had to manually interpret their properties and their output,
    and because of the lack of any substantial computing power to estimate their parameters.
    This approach would put all the burden on the modeller: most of the utility that
    could come from the ability of the modeller to distil whatever he was modelling
    into simple mathematics and to incorporate any available prior information into
    the model structure. The result is the emphasis on closed-form results, low-order
    approximations and asymptotics that characterizes the earlier part of modern statistics.


    There are, however, many phenomena that cannot be feasibly studied in this fashion.
    Firstly, there are limits to a human modeller’s ability to encode complex behaviour
    when manually structuring models. These'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# 4


    # 1 What Is This Book?


    limits can easily be exceeded by phenomena involving large numbers of variables
    or by non-linear patterns of interactions between variables that are not very
    regular or known in advance. Secondly, there may not be enough information available
    to even attempt to structure a probabilistic model. Thirdly, limiting our choice
    of models to those that fit be written in closed form to allow the modeller to
    fit, interpret and use them manually, without a significant use of computing power,
    does not necessarily ensure that those models are easy to interpret. For instance,
    there are many documented pitfalls in interpreting logistic regression [226, 287],
    which is arguably the simplest way to implement classification.


    Classical applications of Bayesian statistics (Figure 1.1, top right) address
    some of these limitations. The modeller still has to structure a model covering
    both the data and any prior beliefs on their behaviour, but the posterior may
    be estimated algorithmically using Markov Chain Monte Carlo (MCMC).


    In contrast [54], algorithmic approaches shift the burden from the modeller to
    data collection and computer software (Figure 1.1, top left). The modeller’s role
    in constructing the probabilistic model is limited, and is largely replaced by
    a computer system sifting through large amounts of data: hence the name “machine
    learning”. The structure of the model is learned from the data, with few limitations
    in what it may look like. Neural networks and Gaussian processes are universal
    approximators, for instance. Almost all the information comes from the data, instead
    of being prior information that is mediated by the modeller, which is why machine
    learning approaches are data-hungry.


    # 1.2 Data Science


    Data science is similarly data-driven (Figure 1.1, top left), but focuses on extracting
    insights from raw data'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# 1.2 Data Science


    and presenting them graphically to support principled decision making. Kenett
    and Redman [179] describe it as follows: “the real work of data scientists involves
    helping people make better decisions on the important issues in the near term”.
    It requires strong involvement from the data scientist in all areas of business,
    shifting the focus from computer systems to people. Nevertheless, data scientists
    use statistical and machine learning models as the means to obtain these insights.


    Compared to classical statistics, when data are abundant (Big Data! [178]) we
    do not really need to construct their generating process from prior knowledge.
