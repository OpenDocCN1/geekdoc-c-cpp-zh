    # 7.6 Rolling Back


    When a model is deployed in production fails to meet the required performance
    and quality standards (Section 8.3), we have two choices: either we replace it
    with a previous model that is still fit for use (rolling back) or with a new model
    that we train specifically to address the reason why the current model is failing
    (rolling forward). In the following, we will focus on rollbacks, but our discussion
    will be relevant for rolling a model forward.


    Model rollbacks are only possible if the model APIs are backward compatible between
    releases. Then every version of our model can be restored to any previous version
    at any given moment in time without disrupting the rest of the pipeline because
    we can guarantee that the model delivers the same functionality, with the same
    protocol specifications and the same signature. Achieving'
