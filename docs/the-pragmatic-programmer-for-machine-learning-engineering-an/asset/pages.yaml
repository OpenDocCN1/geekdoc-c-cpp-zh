    Packer [143] or Vagrant [146], which can install the operating system, and configuration
    management software like Ansible [18], which can install the models as well as
    the software stack they depend on. As for the latter, a vast selection of pre-baked
    images is available from cloud providers: an example is the catalogue of Machine
    Images (AMIs) [13]. VM configurations and images are typically stored in a standardised
    open format such as the Open Virtualisation Format (OVF) [81]. Finally, VMs can
    be managed automatically by the orchestrator of the machine learning pipeline
