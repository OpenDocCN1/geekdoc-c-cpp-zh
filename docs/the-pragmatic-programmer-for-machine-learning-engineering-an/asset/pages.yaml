  md: '# 9.1 Data Are the Problem


    Machine learning models effectively compile data into code and dictate to a large
    extent the behaviour of the software they are embedded in (Section 5.1). Hence
    it is only logical that issues in the data will impact the software by affecting
    model training and predictions. Before we do anything else, we should make sure
    that the data are correctly recorded, properly labelled and without duplicates:
    only 3% of data are acceptable in this respect with pretty loose quality standards
    [179] and technical debt arising from data is a common issue (Section 5.2.1).


    The shape of the data and how the data are collected can result in very different
    types of issues. For the former, we may have tall data (large sample size, few
    variables), wide data (small sample size, many variables); also known as “small
    n, large p” and big data (large sample size, many variables, changing over time
    and possibly unstructured [178]). For the latter, we should distinguish between
    experimental and observational data. Experimental data are collected following
    some experimental design [225] that involves identifying a limited set of variables
    of interest from available knowledge (domain experts, the literature, small-scale
    preliminary experiments, etc.) and a small number of variables we wish to intervene
    on (like giving targeted discounts and recommendations or administering specific
    medical treatments). Eligible data points are chosen based on their characteristics
    to ensure the conclusions we draw from models apply to the population of interest,
    and are randomly assigned different interventions. Randomisation ensures that
    all types of individuals are observed with different interventions and prevents
    confounding to some extent. (More on this later.) In contrast, observational data
    are'
  merge: -1
  pgno: 230
- img_proc: true
  md: '# 9.1 Data Are the Problem


    collected as they arise. Often individuals are added to the data as their information
    is recorded, without taking their characteristics into account. This, along with
    the fact that we are not performing any randomised intervention, can bias the
    models we learn from observational data: either we do not observe data points
    with certain characteristics (enough of them, or at all) or we do not observe
    them in a wide-enough range of situations to model their behaviour. This issue
    is called sampling bias (Section 5.3.1) and affects many applications of machine
    learning. For instance, 96% of participants in genome-wide studies were of European
    descent in 2009; while new studies performed on Asian populations have reduced
    that figure to around 80% by 2016, other ethnicities remain chronically underrepresented
    [266]. The practical consequence of this disparity is that personalised medicine
    treatments currently under development will not benefit individuals from those
    backgrounds.


    # 9.1.1 Large Data


    Consider the three possible dimensions of data mentioned above: the sample size,
    the number of variables and the number of time points. The larger the data are
    in at least one of these dimensions, the more difficult it is to troubleshoot
    the models we learn from.


    If the data are wide, changes in one variable may induce changes in the contributions
    of other variables to the model: this phenomenon is called entanglement [312,
    313]. As the number of variables grows (“why not add one more input?”), it becomes
    increasingly likely that multiple variables will express the same information
    in different ways. The parameters that encode information in the model will be
    jointly determined by those variables. If the distribution of one such variable
    changes, making it a legacy feature that is no longer significant in the'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# 216 9 Troubleshooting and Testing Pipelines


    model, the effects of the other variables will increase to compensate. And even
    if it still retains some degree of statistical significance, it may become an
    epsilon feature that contributes so little to the model that it is not worth the
    effort of including it in the first place. (Both legacy and epsilon features should
    in principle be dropped from models, but they are often not when they are included
    as a bundle with features that are actually useful.) In other words, “changing
    anything changes everything”, as we discussed in Section 5.2.2 with respect to
    technical debt. This is all more true for time series data, in addition to different
    variables being entangled with each other, each variable is entangled with itself
    at previous time points (Section 9.1.3).


    As a side effect, entanglement makes it difficult to identify causal features
    within a set of correlated features. This is problematic because it prevents us
    from keeping models simple and small without a significant amount of feature engineering.


    The other problem in troubleshooting large data is latency: accessing the data
    takes time and computational resources, which in turn slows down our iteration
    speed. This is particularly true for models like deep neural networks that require
    GPUs and TPUs, which have limited bandwidth and memory (Section 2.2). One possible
    solution is to choose a good-quality, representative subset of the data and work
    with that (more in Section 9.1.2), keeping in mind that (repeated) subsampling
    also has a cost. Another is taking the last known-good snapshot of the model and
    working on it with a subset of recent data as if we were doing online training.


    > That is, a feature that is built on a variable with a (direct) causal effect
    on the target variable of interest.'
