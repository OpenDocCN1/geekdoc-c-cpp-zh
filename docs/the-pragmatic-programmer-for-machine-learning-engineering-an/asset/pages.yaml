    # 3.2.3 Dense and Sparse Matrices


    A matrix is a homogeneous two-dimensional data structure holding a grid of variables
    of the same type arranged into rows and columns. It is the programming construct
    that represents the mathematical objects of the same name studied in linear algebra.
    Matrices can be dense or sparse. Most of the elements of dense matrices are informative
    (that is, non-zero cells) and therefore must be stored in the data structure.
    On the other hand, most of the elements of sparse matrices are equal to zero so
    we can save considerable amounts of memory by storing only the locations and the
    values of the few non-zero elements. We will cover the trade-off between speed
    and memory use for these two types of matrices in Section 4.5.2 while discussing
    computational complexity.


    In Python, dense matrices are implemented in NumPy as a special case of multidimensional
    arrays along vectors [141]. The same is true in R. In both cases, the data structure
    encoding the first element of the array; the variable type of the elements; and
    the dimensions of the array, which determines its shape Figure 3.3. The dimensions
    and the variable type of the elements determine the strides: the number of bytes
    skipped in memory to proceed to the next element along a given dimension. They
    are pre-calculated and stored in NumPy but not in R.'
