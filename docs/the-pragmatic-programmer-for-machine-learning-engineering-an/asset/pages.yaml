  md: '# 4.6 Big-O Notation and Real-World Performance


    +   - Both these things being equal, the same algorithm may be faster or slower
    depending on the data structures used to store its inputs and outputs. We saw
    that to be the case in Section 4.5.2, and we touched on this point in Section
    3.4 as well. The same is true for variable types, as discussed in Section 3.3.
    High-level languages abstract these details to a large extent, which may lead
    to surprises when benchmarking software.


    +   - Differences in hardware can be impactful enough to completely hide differences
    in the class of complexity of different algorithms for practical ranges of input
    sizes. Conversely, they can also introduce discrepancies in performance. This
    can realistically happen when the input sizes are small enough to make adjacent
    classes of complexity comparable: an O(N²) algorithm on a CPU core will be slower
    than an O(N³) algorithm on a GPU with a hundred of free units for N ≤ 100. Fixed
    costs that are ignored when deriving computational complexity may also be relevant
    due to different types of memory (Section 2.1.2).


    +   - If we use any remote systems (Section 2.3), the hardware we are running
    a machine learning pipeline on may vary without our knowledge, either in its configuration
    or in its overall load. Furthermore, benchmarking remote systems accurately is
    inherently more difficult, as is troubleshooting them.


    +   - The performance of some parts of the pipeline may be artificially limited
    by that of the external systems that provide the inputs to the machine learning
    models or that consume their outputs. Individual parts of the same system may
    also slow down each other as they consume each other''s outputs.


    To summarise, we may be able to map computational complexity to real-world performance
    for the individual components of a machine learning pipeline running on simple
    hardware configurations. It is unlikely that we'
