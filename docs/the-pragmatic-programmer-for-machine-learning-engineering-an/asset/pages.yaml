  md: '# 6.7 Refactoring


    Formally, *refactoring* is the process of changing a piece of code that does not
    alter its external behaviour yet improves its internal structure and clarifies
    its intent and assumptions [105]. Following Section 6.5, we do that with a sequence
    of small incremental changes which are individually validated by running our suite
    of tests (Chapter 9.4) with continuous integration tools. At the end of the process,
    we squash all the commits together and submit them for review (Chapter 6.6) as
    we do for other code changes. We refactor when adding a new feature, to alter
    the design of the existing code and accommodate it. We refactor when attacking
    bugs, to fix them and to accommodate the tests that exercise them (and ensure
    that they stay fixed). We refactor to improve compliance with naming conventions
    (Section 6.3). Refactoring can make us confident that we start each commit from
    correct code, making it easy to track any bugs we introduce, and that the code
    does not spend much time (if at all) in a broken state.


    Fowler [105] provides an extensive catalogue of refactoring approaches. Depending
    on the programming language, some can be automated: for example, both PyCharm
    [166] and Visual Studio Code [220] have a “refactor” button for Python code. This
    is another factor we may want to consider when choosing a programming language
    in addition to those discussed in Section 6.1.. Only a few of them are commonly
    used for machine learning code, and there are refactoring approaches that are
    specific to it: Tang et al. [339] constructed a taxonomy of both from a large
    survey of machine learning software. Machine learning code is only a small part
    of a typical'
