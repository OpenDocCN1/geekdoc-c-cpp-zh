    The pipeline described in Lipizzi et al. [195] is not particularly demanding in
    terms of computing power. The narrow focus of the “room” on a single type of goods
    or services means we can keep our training set small and limit our storage needs
    as well. We do not have stringent memory requirements either: the word embeddings
    are limited in size by the limited number of key terms in the vocabulary. Furthermore,
    we do not need to load the complete training set into memory to learn them: we
    can use the documents in smaller batches and learn the embeddings incrementally
    [172].


