    # 8.5 Illustrating Practical Use Cases


    But not not least, topical examples showcasing the machine learning pipeline in
    action can be very valuable. Pipelines are built to address some need like automating
    and speeding up analyses or improving products: the best way to motivate their
    development, use and maintenance is to show that they can address that need effectively
    and efficiently in the context of the domain or of the business line of the prospective
    users. Users will then be able to relate to the problems the machine learning
    pipeline is tackling and they will be in a position to appreciate the advantages
    of using it. The types of documentation presented in the previous sections are
    either too technical, too abstract or too focused on the inner workings of the
    pipeline for this purpose.


