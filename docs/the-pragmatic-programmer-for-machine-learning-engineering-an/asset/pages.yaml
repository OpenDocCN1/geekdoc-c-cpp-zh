    potentially different types. Its primary task is storing tabular data and the
    associated metadata, such as column- and row-names. The implementations in Julia
    (DataFrame.jl) and Python (Pandas and Scikit-Learn [311]) have been heavily inspired
    by R data frames: they only have minor differences in their semantics. The most
    notable is that operations on two data frames will match cells by position in
    R and Julia (regardless of row- and column-names) and by row- and column-names
    in Python (regardless of the cell positions).


