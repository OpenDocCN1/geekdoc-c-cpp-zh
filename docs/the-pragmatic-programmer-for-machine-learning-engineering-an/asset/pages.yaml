  md: '# 10.2 Code Development 255


    +   It is challenging to version a notebook correctly because stochastic outputs
    change every time it runs.


    +   Representing code in “cells” that can be executed in any order is at odds
    with the imperative nature of the programming languages used in machine learning
    software.


    +   Dividing code into cells to interleave their outputs and the surrounding text
    impacts code modularity and code reuse reduces our ability to produce good abstractions.
    We can accept some level of coupling between cells (because they run code in a
    shared, hidden global environment) and add glue code to make things work, but
    that leads to an increase in technical debt (Sections 5.2.3 and 5.2.4).


    +   Notebooks do not have any built-in support for automated testing (Section
    9.4) or deployment (Chapter 7). While this can be acceptable for exploring data
    and prototyping models (Section 5.3.2), it makes them unsuitable for developing
    production–level software.


    In particular, executing cells in a non-linear order can lead to inconsistent
    results because cells affect each other’s environment, effectively creating a
    “hidden state” that is very difficult to track. The only way to achieve reproducibility
    is to always execute all the code in the notebook from the top in a clean environment.
    For these reasons, we cannot use notebooks to directly serve machine learning
    models in a production environment. However, this may change in the future: there
    are ongoing efforts to develop tools for diffing and merging (nbtime [4] and nbstripout
    [289]), automatic testing (testbook [242] and nbval [69]), automation (Papermill
    [241]) and quality assurance (nbQA [235]).'
  merge: -1
  pgno: 271
