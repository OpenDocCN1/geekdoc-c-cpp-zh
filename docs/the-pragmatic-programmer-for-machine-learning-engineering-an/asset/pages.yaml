    # Tools for Developing Pipelines


    In Part II we discussed how we may adapt software engineering practices to the
    development of machine learning pipelines. Practices are predicated on the tools
    we adopt to implement them, which will be the focus of Part III.


    In this chapter, we present an up-to-date selection of tools for data exploration,
    experiment tracking (Section 10.1), for developing code (Section 10.2) and for
    building, testing and documenting it (Section 10.3). Together, these tools provide
    a development environment suitable for creating machine learning pipelines. We
    will then move to those used to manage pipelines in production and maintain them
    (Chapter 11). We fully expect that the tools available at the time of this writing
    will consolidate over time, as has happened to other types of productivity tools
    in software engineering and systems administration.


