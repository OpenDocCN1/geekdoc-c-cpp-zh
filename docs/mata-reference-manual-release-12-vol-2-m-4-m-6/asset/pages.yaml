    > Leopold Kronecker (1821–1891) was born in Liegnitz, Prussia (now Legnica, Poland),
    to a well-off family. He attended the universities of Berlin, Bonn, and Breslau
    before completing a doctorate on the complex roots of unity. For several years,
    Kronecker devoted himself to business interests while working on mathematics in
    his space time, publishing particularly in number theory, elliptic functions,
    and the theory of equations. He later gave lectures at the university in Berlin,
    as was his right as a member of the Academy of Science. In 1883, he was appointed
    as the chair. Kronecker came to believe that mathematical arguments should involve
    only finite numbers and a finite number of operations, which led to increasing
    mathematical and personal disagreements with those who worked on irrational numbers
    or nonconstructive existence proofs.'
