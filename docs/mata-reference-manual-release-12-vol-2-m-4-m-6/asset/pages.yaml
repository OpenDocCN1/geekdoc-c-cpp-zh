  md: "# [M-2] class - Object-oriented programming (classes)\n\nmember, member variable,\
    \ member function, method\n\nA variable or function declared within a class is\
    \ said to be a member variable, or member function, of the class. Member functions\
    \ are also known as methods. In what follows, let ex1 be an instance of S, and\
    \ assume S contains function f() and member variable v.\n\nWhen member variables\
    \ and functions are used inside member functions, they can simply be referred\
    \ to by their names, v and f(). Thus, if we were writing the code for S::g(),\
    \ we could code\n\n```\nreal scalar S::g()\n{\n    return(f()*v)\n}\n```\n\nWhen\
    \ member variables and functions are used outside of member functions, which is\
    \ to say, are used in regular functions, the references must be prefixed with\
    \ a class instance and a period. Thus one codes\n\n```\nreal scalar myg(class\
    \ S scalar ex1)\n{\n    return(ex1.f()*ex1)\n}\n```\n\n# variable and method overriding\n\
    \nGenerically, a second variable or function overrides a first variable or function\
    \ when they share the same name and the second causes the first to be hidden,\
    \ which causes the second variable to be accessed or the second function to be\
    \ executed in preference to the first. This arises in two ways in Mata's implementation\
    \ of classes.\n\nIn the first way, a variable or function in a parent class is\
    \ said to be overridden if a child defines a variable or function of the same\
    \ name. For instance, let U extend T S, and assume S::f() and T::f() are defined.\
    \ By the rules of inheritance, instances of U and T that will call f() will call\
    \ T::f() to execute. Here S::f() is said to be overridden by T::f(). Because T::f()\
