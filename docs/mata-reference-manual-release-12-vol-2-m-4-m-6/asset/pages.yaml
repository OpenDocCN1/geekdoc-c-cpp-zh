  md: '[M-1] — Using Mata with ado-files 17


    cross() makes calculations of the form


    ```

    X''X

    X''Z

    X''diag(w)X

    X''diag(w)Z

    ```


    crossdev() makes calculations of the form


    ```

    (X:-x)''(X:-x)

    (X:-x)''(Z:-z)

    (X:-x)''diag(w)(X:-x)

    (X:-x)''diag(w)(Z:-z)

    ```


    Both these functions could escape your attention because the matrix expressions
    themselves are so easily written in Mata. The functions, however, are quicker,
    use less memory, and sometimes are more accurate. Also, quad-precision versions
    of the functions exist; [M-5] quadcross().


