  md: '# Pointer Ivals


    In addition to the standard lvals


    ```

    A = (1, 2 \ 3, 4)

    A[1..] = (7, 8)

    A[.,2] = (9 \ 10)

    A[1,2] = 7

    ```


    pointer lvals are allowed. For instance,


    ```

    *p = 3

    ```


    stores 3 in the address pointed to by pointer scalar p.


    ```

    (*q) [1,2] = 4

    ```


    stores 4 in the (1,2) element of the address pointed to by pointer scalar q, whereas


    ```

    *Q[1,2] = 4

    ```


    stores 4 in the address pointed to by the (1,2) element of pointer matrix Q.


    ```

    *Q[2,1] [1,3] = 5

    ```


    is equivalent to


    ```

    (*Q[2,1])[1,3] = 5

    ```


    and 5 in the (1,3) element of the address pointed to by the (2,1) element of pointer
    matrix Q.


    Pointers to pointers, pointers to pointers to pointers, etc., are also allowed.
    For instance,


    ```

    **r = 3

    ```


    stores 3 in the address pointed to by the address pointed to by pointer scalar
    r,


    ```

    *(*((Q[1,2])) [2,1]) [3,4] = 7

    ```


    stores 7 in the (3,4) address pointed to by the (2,1) address pointed to by the
    (1,2) address of pointer matrix Q.


    # Conformability


    ```

    a = b:

    input:

    b:   r × c

    output:

    a:   r × c

    ```


    # Diagnostics


    a = b aborts with error if there is insufficient memory to store a copy of b in
    a.'
