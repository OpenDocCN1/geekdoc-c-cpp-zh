  md: '# String literals


    String literals are enclosed in double quotes or in compound double quotes:


    ```

    "the answer is"

    "a string"

    ""also a string"

    ""the "factor" of a matrix""

    """

    """

    ```


    Strings in Mata contain between 0 and 2,147,483,647 characters. "" or """ is how
    one writes the 0-length string.


    Any ASCII character may appear in the string literal, but no provision is provided
    for typing the unprintable ASCII characters into the string. Instead, you use
    the char() function; see [M-5] ascii(). For instance, char(13) is carriage return,
    so the expression


    ```

    "my string"

    ```


    produces "my string" followed by a carriage return.


    No character is given a special interpretation. In particular, backslash (\) is
    given special meaning by Mata. The string literal "my string\n" is just that:
    the characters "my string" followed by a backslash followed by an "\n". Some functions,
    such as printf() (see [M-5] printf()), give a special meaning to the two-character
    sequence \n, but that special interpretation is a property of the function, not
    Mata, and is noted in the function''s documentation.


    Strings are not zero (null) terminated in Mata. Mata knows that the string "hello"
    is of length 5, but it does not achieve knowledge by padding a binary 0 as the
    string''s fifth character. Thus strings may be used to hold binary information.


    Although Mata gives no special interpretation to binary 0, some Mata functions
    do. For instance, strcmp(s, pattern) returns 1 if s matches pattern and 0 otherwise;
    see [M-5] strcmp(). For this function, both strings are considered equal at the
    point they contain a binary 0, if they contain a binary 0. Most strings do not,
    and then the function returns the entire string. In any case, if there is special
    treatment of binary 0, that is on a function-by-function basis, and a note of
    that is made in the function''s documentation.


    # Variable names


    Variable names are just that. Names are case sensitive and no abbreviations are
    allowed:


    ```

    X

    x

    MyVar

    VeryLongVariableNameForInMata

    MyVariable

    ```


    The maximum length of a variable name is 32 characters.'
