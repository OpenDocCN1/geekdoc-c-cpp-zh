  md: "# [M-2] pointers — Pointers\n\nIt was not necessary to unload info[] into the\
    \ individual scalars. The lines using the passed values could just as well have\
    \ read\n\n```\n(*info[2])(..\n(*info[1])...\n(*info[3])\n```\n\n# Efficiency\n\
    \nWhen calling subroutines, it is better to pass the evaluation of pointer scalar\
    \ arguments rather than the pointer scalar itself, because then the subroutine\
    \ can run a little faster. Say that p points to a real matrix. It is better to\
    \ code\n\n```\nmysub(*p)\n```\n\nrather than\n\n```\nmysub(p)\n```\n\nand then\
    \ to write mysub() as\n\n```\nfunction mysub(real matrix X)\n{\n  X...\n}\n```\n\
    \nrather than\n\n```\nfunction mysub(pointer(real matrix) scalar p)\n{\n  (*p)...\n\
    }\n```\n\nDereferencing a pointer (obtaining *p from p) does not take long, but\
    \ it does take time. *p rather than p can be important if mysub() loops and performs\
    \ the evaluation of *p hundreds of thousands or millions of times.\n\n# Diagnostics\n\
    \nThe prefix operator * (called the dereferencing operator) aborts with error\
    \ if it is applied to a nonpointer object.\n\nArithmetic may not be performed\
    \ on dereferenced pointers. Arithmetic operators abort with error.\nThe prefix\
    \ operator & aborts with error if it is applied to a built-in function.\n\n# Reference\n\
    \nSøvring, H. 2007. A generic function evaluator implemented in Mata. Siata Journal\
    \ 7: 542–555."
