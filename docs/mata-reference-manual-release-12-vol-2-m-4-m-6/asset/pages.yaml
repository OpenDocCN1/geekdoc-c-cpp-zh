  md: "# Organizational types\n\nThere are five orgtypes, or organizational types:\n\
    \n+   - matrix, which means $r \times c$, $r \\ge 0$ and $c \\ge 0$.\n\n+   -\
    \ vector, which means $1 \times n$ or $n \times 1$, $n \\ge 0$.\n\n+   - rowvector,\
    \ which means $1 \times n$, $n \\ge 0$.\n\n+   - colvector, which means $n \t\
    imes 1$, $n \\ge 0$.\n\n+   - scalar, which means $1 \times 1$.\n\nSharp-eyed\
    \ readers will note that vectors and matrices can have zero rows or columns! See\
    \ [M-2] void for more information.\n\n# Function declarations\n\nFunction declarations\
    \ are the declarations that appear in front of the function name, such as\n\n\
    ```\nreal matrix swaprows(...)\n{\n  ...\n}\n```\n\nThe syntax for what may appear\
    \ there is\n\n```\nfunction\ntype [function]\nvoid [function]\n```\n\nSomething\
    \ must appear in front of the name, and if you do not want to declare the type\
    \ (which makes the type transmorph matrix), you just put the word function:\n\n\
    ```\nfunction swaprows(...)\n{\n  ...\n}\n```\n\nYou may also declare the type\
    \ and include the word function if you wish,\n\n```\nreal matrix function swaprows(...)\n\
    {\n}\n```\n\nbut most programmers omit the word function; it makes no difference.\n\
    \nIn addition to all the usual types, void is a type allowed only with functions—it\
    \ states that the function returns nothing:"
