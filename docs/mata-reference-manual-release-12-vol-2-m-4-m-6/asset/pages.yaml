    # Do not use #delim;


    What follows is to do with Stata''s #delim; mode. If you do not know what it is
    or if you never use it, you can skip what follows.


    Stata has an optional ability to allow its lines to continue up to semicolons.
    In Stata, you code


    ```

    #delim ;

    ```


    and the delimiter is changed to semicolon until your do-file or ado-file ends,
    or until you code


    ```

    #delim cr

    ```


    We recommend that you do not use Mata when Stata is in #delim; mode. Mata will
    not mind, but you will confuse yourself.


    When Mata gets control, by #delim ; is on. Mata turns it off temporarily, and
    then Mata applies its own rules, which we have summarized above.


