  md: '# Title


    ```

    [M-2] goto — goto label

    ```


    # Syntax


    label:

    ...

    goto label

    where label: may occur before or after the goto.


    # Description


    goto label causes control to pass to the statement following label:. label may
    be any name up to eight characters long.


    # Remarks


    These days, good style is to avoid using goto.

    goto is useful when translating a FORTRAN program, such as


    ```

    A = 4.0e0/3.0e0

    10 B = A - 1.0e0

    C = B + B + B

    EPS = DABS(C - 1.0e0)

    if (EPS.EQ(0.0e0) GOTO 10

    ```


    The Mata translation is


    ```

    a = 4/3

    s10: b = a - 1

    c = b + b + b

    eps = abs(c-1)

    if (eps==0) goto s10

    ```


    although


    ```

    a = 4/3

    do {

    b = a - 1

    c = b + b + b

    eps = abs(c - 1)

    } while (eps==0)

    ```


    is more readable.'
  merge: -1
  pgno: 139
