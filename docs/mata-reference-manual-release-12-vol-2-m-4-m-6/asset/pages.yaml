  md: "# Pointers to expressions\n\nYou can code\n\n```\np = &(2+3)\n```\n\nthe result\
    \ will be to create *p containing 5. Mata creates a temporary variable to contain\
    \ the evaluation of the expression and set p to the address of the temporary variable.\
    \ That temporary variable will be freed when p is freed or, before that, when\
    \ the value of p is changed, just as tmp was freed in the example in the previous\
    \ section.\n\nWhen you code\n\n```\np = &X[2,3]\n```\n\nthe result is same. The\
    \ expression is evaluated and the result of the expression stored in a temporary\
    \ variable. That is why subsequently coding *p=2 does not change X[2,3]. All *p=2\
    \ does is change the value of the temporary variable.\n\nSetting pointers equal\
    \ to the value of expressions can be useful. In the following code fragment, create\
