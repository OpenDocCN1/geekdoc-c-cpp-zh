  md: "# # Title\n\n[M-1] ado — Using Mata with ado-files\n\n# # Description\n\nThis\
    \ section provides advice to ado-file programmers on how to use Mata effectively\
    \ and efficiently.\n\n# # Remarks\n\nFor those interested in extending Stata by\
    \ adding new commands, Mata is not a replacement for ado-files. Rather, the appropriate\
    \ way to use Mata is to create subroutines used by your ado-files. Below we discuss\
    \ how to do that under the following headings:\n\n+   - First example\n- Where\
    \ to store the Mata functions\n- Passing arguments to Mata functions\n- Returning\
    \ results to ado-code\n- Advice: Use of mostuseful\n- Advice: Some useful functions\n\
    \n# # A first example\n\nWe will pretend that Stata cannot produce sums and that\
    \ we want to write a new command for Stata that will report the sum of one variable.\
    \ Here is our first take on how we might this:\n\n```\nprogram varsum\n  version\
    \ 12\n  syntax varname [if] [in]\n  marksample touse\n  mata: calcsum(\"varlist\"\
    , \"touse\")\n  display as txt \" sum = \" as res r(sum)\nend\nversion 12\nmata:\n\
    \  void calcsum(string scalar varname, string scalar touse)\n  {\n    real colvector\
    \ x\n    st_view(x, ., varname, touse)\n    st_numscalar(\"r(sum)\", colsum(x))\n\
    \  }\n```\n\nRunning this program from Stata results in the following output:\n\
    \n+   - varsum mpg\n- sum = 1576\n\nNote the following:\n\n+   - The ado-file\
    \ has both ado-code and Mata code in it."
  merge: -1
  pgno: 26
- img_proc: true
  md: '2. The ado-code handled all issues of parsing and identifying the subsample
    of the data to be used.


    3. The ado-code called a Mata function to perform the calculation.


    4. The Mata function received as arguments the names of two variables in Stata
    dataset: the variable on which the calculation was to be made and the variable
    that identified the subsample of the data to be used.


    5. The Mata function returned the result in r(), from where the ado-code could
    access it.


    The outline that we showed above is a good one, although we will show you alternatives
    that, for some problems, are better.


    # ## Where to store the Mata functions


    Our ado-file included a Mata function. You have three choices of where to put
    the Mata function:


    +   1. You can put the code for the Mata function in the ado-file, as we did.
    To work, your, .ado file must be placed where Stata can find it.


    +   2. You can omit code for the Mata function from the ado-file, compile the
    Mata function separately, and store the compiled code (the object code) in a separate
    file called a .mo file. You place both .ado and .mo files where Stata can find
    them.


    +   3. You can omit the code for the Mata function from the ado-file, compile
    the Mata function separately, and store the compiled code in a .mlib library.
    Here both your .ado file and .mlib library will need to be placed where Stata
    can find them.


    We will show you how to do each of these alternatives, but before we, let''s consider
    the advantages and disadvantages of each:


    +   Putting your Mata source code in .mo files is easiest and it is convenient.
    The disadvantage is that Mata must compile the source code into object code, and
    that will slow execution. The cost is small because it occurs frequently; Mata
    compiles the code when the ado-file is loaded, and as long as the ado-file is
    not dropped from memory. Stata and Mata will use the same compiled code over and
    over again.


    +   Saving your code as .mo files saves Mata from having to compile them at all.
    The source code is compiled only once—at the time you create the .mo file—and
    thereafter, it is the already-compiled copy that Stata and Mata will use.


    There is a second advantage: rather than the Mata functions (calcsum() here) being
    private to the ado-file, you will be able to use calcsum() in your other ado-files.
    calcsum() will become a utility always available to you. Perhaps calcsum() is
    not deserving of this honor.


    +   Saving your Mata code in a .mlib library has the same advantages and disadvantages
    as in (2): the only difference is that we save the precompiled code in a different
    way. The .mo/.mlib choice is of more concern to those who intend to distribute
    their ado-file to others. .mlib libraries allow you to place many Mata functions
    (subroutines for your ado-files) into one file, and so it is easier to distribute.'
