  md: "# [M-1] ado — Using Mata with ado-files\n\n```\nprogram varsum\nversion 12\n\
    syntax varname [if] [in]\nmarksample touse\nmata: calscum(\"varlist\", \"touse\"\
    )\ndisplay as txt \" sum = \" as r(sum)\nend\n```\n\nbegin varsum.ado\n\n```\n\
    version 12\nmata:\nvoid set matastrict on\nmata: calscum(string varname, string\
    \ scalar touse)\n{\n    real collector x\n    st_view(x, , varname, touse)\n \
    \   st_numscalar(\"sum\", colsum(x))\n}\nend\n```\n\nend varsum.ado\n\nand not\
    \ only will it work, but running varsum will not change the user's matastrict\
    \ setting.\n\nThis preserving and restoring of matastrict is something that is\
    \ done only for ado-files when they are loaded.\n\n# Advice: Some useful Meta\
    \ functions\n\nIn the calscum() subroutine, we used the colscum() function—see\
    \ [M-5] sum()—to obtain the sum:\n\n```\nvoid calscum(string varname, string scalar\
    \ touse)\n{\n    real collector x\n    st_view(x, , varname, touse)\n    st_numscalar(\"\
    sum\", colsum(x))\n}\n```\n\nWe could instead coded calscum(string varname, string\
    \ scalar touse\n\n```\n{\n    real collector x\n    real scalar i, sum\n    st_view(x,\
    \ , varname, touse)\n    sum = 0\n    for (i=1; i<=rows(x); i++) sum = sum + x[i]\n\
    \    st_numscalar(\"sum\", sum)\n}\n```\n\nThe first way is preferred. Rather\
    \ than construct explicit loops, it is better to call functions that calculate\
    \ the desired result. Unlike ado-like functions, however, when functions do not\
    \ exist, you can use explicit loops and still obtain good code.\n\nAnother set\
    \ of functions we recommend are documented in [M-5] cross(), [M-5] crossdev(),\
    \ and [M-5] quadcross()."
