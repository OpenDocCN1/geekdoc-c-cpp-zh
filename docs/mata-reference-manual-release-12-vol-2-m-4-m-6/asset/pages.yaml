    # 6. Put variables on roughly the same numeric scale


    This step is optimal, but we recommend it. You are about to use formulas that
    have been derived by people who assumed the usual rules of arithmetic hold, such
    as $(a+b)-c = a+(b-c)$. Many of the standard rules, such as the one shown, are
    violated when arithmetic is performed in finite precision, and this leads to rounding
    error in the final, calculated results.


    You obtain a lot of protection by making sure that your variables are roughly
    on the same scale, by which we mean their means and standard deviations are all
    roughly equal. By roughly equal, we mean each up by a factor of 1,000 or 0. So
    let''s look at our data:


    | Variable | Obs | Mean | Std.Dev. | Min | Max |

    |---|---|---|---|---||}{

    | mpg | 74 | 21.9973 | 5.785603 | 12 | 41 |

    | weight | 74 | 3019.459 | 777.1936 | 1760 | 4840 |

    | foreign | 74 | .2972973 | .4601885 | 0 | 1 |

    | cons | 74 | .2972973 | 0 | 1 |


    Nothing we here bothers us much. Variable weight is the largest, with a mean and
    standard deviation that is 1000 times larger than those of the smallest variable,
    foreign. We would feel comfortable, but only barely, ignoring scale differences.
    We grew our concern would grow as we grew.


    The easiest way to address our concern is to divide weight so that rather than
    measuring weight in pounds, it measures weight in thousands of pounds:


    ```

    replace weight = weight/1000

    ```


    summarize


    | Variable | Obs | Mean | Std.Dev. | Min | Max |

    |---|---|---|---|---||}{

    | mpg | 74 | 21.9973 | 5.785603 | 12 | 41 |

    | weight | 74 | 3.019459 | .7771936 | 1.76 | 4.84 |

    | foreign | 74 | .2972973 | .4601885 | 0 | 1 |

    | cons | 74 | .2972973 | 0 | 1 | 1 |'
