  md: "# Title\n\n```\n[M-2] struct — Structures\n```\n\n# Syntax\n\n```\nstruct structname\
    \ {\n    declaration(s)\n}\n```\n\nsuch as\n\n```\nstruct mystruct {\n    real\
    \ scalar    n1, n2\n    real matrix     X\n}\n```\n\n# Description\n\nA structure\
    \ contains a set of variables tied together under one name.\nStructures may not\
    \ be used interactively. They are used in programming.\n\n# Remarks\n\nRemarks\
    \ are presented under the following headings:\n\n+   Introduction\nStructures\
    \ and functions must have different names\nStructure variables must be explicitly\
    \ declared\nDeclare structure variables to be scalars whenever possible\n\nVectors\
    \ and matrices of structures\nStructures of structures\nPointers to structures\n\
    \nOperators and functions for use with structure members\nOperators and functions\
    \ for use with entire structures\n\nListing structures\n\nUse of transmorphics\
    \ as passthru\nSaving compiled structure definitions\nSaving structure variables"
  merge: -1
  pgno: 198
- img_proc: true
  md: "# Introduction\n\nHere is an overview of the use of structures:\n\n```\nstruct\
    \ mystruct {\n    real scalar n1, n2\n    real matrix X\n}\n\nfunction myfunc()\n\
    {\n    struct mystruct scalar e\n    ...\n    e.n1 = ...\n    e.n2 = ...\n   \
    \ e.X = ...\n    mysubroutine(e, ...)\n}\n\nfunction mysubroutine(struct mystruct\
    \ scalar x, ...)\n{\n    struct mystruct scalar y\n    ...x.n1 ... x.n2 ... x.X...\n\
    \    y = mysubfn(x)\n    ...y.n1 ... y.n2 ... y.X...\n    ...x.n1 ... x.n2 ...\
    \ x.X...\n}\n\nstruct mystruct scalar mysubfunc(struct mystruct scalar x)\n{\n\
    \    struct mystruct scalar result\n    result = x\n    ...result.n1 ... result.n2\
    \ ... result.X...\n    return(result)\n}\n```\n\nNote the following:\n\n+   1.\
    \ We first defined the structure. Definition does not create variables; definition\
    \ defines what we mean when we refer to a struct mystruct in the future. This\
    \ definition is done outside and separately from the definition of the functions\
    \ that will use it. The structure is defined before the functions.\n2. In myfunc(),\
    \ we declared variable e is a struct mystruct scalar. We then used variables e.n1,\
    \ e.n2, and e.X just as we would use any variable. In the call to mysubroutine(),\
    \ however, we passed the entire structure."
  merge: -1
  pgno: 199
- img_proc: true
  md: "3. In mysubroutine(), we declared that the first argument received is a struct\
    \ scalar. We chose to call it x rather than e to emphasize that names are not\
    \ important, y is also a struct scalar.\n\n4. mysubcfn() only accepts a struct\
    \ myst as an argument but also returns a struct myst. One of the best uses of\
    \ structures is as a way to return multiple, related values.\n\nThe line result=x\
    \ copied all the values in the structure; we did not need to code result.n1=x.n1,\
    \ result.n2=x.n2, and result.X=X.\n\n# Structures and functions must have different\
    \ names\n\nYou define structures as much as you define functions, at the colon\
    \ prompt, with the definition enclosed in braces:\n\n```\n: struct twopart {\n\
    \  > real scalar n1, n2\n  }\n: function sethistory()\n  {\n  >\n  }\n```\n\n\
    Structures and functions may not have the same names. If you can call a structure\
    \ twopart, then you cannot have a function named twopart(), and vice versa.\n\n\
    # Structure variables must be explicitly declared\n\nDeclarations are usually\
    \ optional in Mata. You can code\n\n```\nreal matrix swaprows(real matrix A, real\
    \ scalar i1, real scalar i2)\n{\n  real matrix B\n  real rowvector v\n  B = A\n\
    \  v = B[i1, .]\n  B[i1, .] = B[i2, .]\n  B[i2, .] = v\n  return(B)\n```\n\nor\
    \ you can code\n\n```\nfunction swaprows(A, i1, i2)\n{\n  B = A\n  v = B[i1, .]\n\
    \  B[i1, .] = B[i2, .]\n  B[i2, .] = v\n  return(B)\n```"
  merge: -1
  pgno: 200
- img_proc: true
  md: "# [M-2] struct — Structures\n\nWhen a variable, argument, or returned value\
    \ is a structure, however, you must explicitly declare it:\n\n```\nfunction makecalc()\
    \ {\n    struct twopart scalar t\n    t.n1 = t.n2 = 0\n...\n}\nfunction clear_twopart(struct\
    \ twopart scalar t) {\n    t.n1 = t.n2 = 0\n}\nstruct twopart scalar new_twopart()\
    \ {\n    struct twopart scalar t\n    t.n1 = t.n2 = 0\n    return(t)\n}\n```\n\
    \nIn the functions above, we refer to variables t.n1 and t.n2. The Mata compiler\
    \ cannot interpret those names unless it knows the definition of the structure.\n\
    \nAside: all structure references are resolved at compile time, not runtime. That\
    \ is, terms like t.n1 are not stored in the compiled code and resolved during\
    \ execution. Instead, the Mata compiler accesses the structure definition when\
    \ it compiles code. The compiler knows that t.n1 refers to the first element of\
    \ the structure and generates efficient code to access it.\n\n# Declare structure\
    \ variables to be scalars whenever possible\n\nIn our declarations, we code things\
    \ like\n\n```\nstruct twopart t\n```\n\nand do not simplify code\n\n```\nstruct\
    \ twopart t\n```\n\nalthough the simpler statement would be valid.\n\nStructure\
    \ variables can be scalars, vectors, or matrices; when you do not say which, matrix\
    \ is assumed.\n\nMost of us are as scalars, and the compiler will generate more\
    \ efficient code if you tell it that the structures are scalars. Also, when you\
    \ use structure vectors or matrices, there is an extra step to fill it in, as\
    \ described in the next section.\n\n# Vectors and matrices of structures\n\nJust\
    \ as you can have real scalars, vectors, or matrices, you can have structure scalars,\
    \ vectors, or matrices. The following are all valid:"
  merge: -1
  pgno: 201
