- img_proc: true
  md: '# Assignment suppresses display


    When you interactively enter an expression or code an expression in a program
    without the equal-assignment operator, the result of the expression is displayed
    at the terminal:


    ```

    : 2 + 3

    5

    ```


    When you assign the expression to a variable, the result is not displayed:


    ```

    : x = 2 + 3

    ```


    # The equal-assignment operator


    Equals is an operator, so in addition to coding


    ```

    a = 2 + 3

    ```


    you can code


    ```

    a = b = 2 + 3

    ```


    or


    ```

    y = x / (denominator = sqrt(a+b))

    ```


    or even


    ```

    y1 = y2 = x / (denominator = sqrt(sum=a+b))

    ```


    This last is equivalent to


    ```

    sum = a + b

    denominator = sqrt(sum)

    y2 = x / denominator

    y1 = y2

    ```


    Equals binds weakly, so


    ```

    a = b = 2 + 3

    ```


    is interpreted as


    ```

    a = b = (2 + 3)

    ```


    and not


    ```

    a = (b=2) + 3

    ```


    # Ivals, what appears on the left-hand side


    What appears to the left of the equals is called an , short for left-hand-side
    value. It would make

    no sense, for instance, to code


    ```

    sqrt(4) = 3

    ```'
  merge: -1
