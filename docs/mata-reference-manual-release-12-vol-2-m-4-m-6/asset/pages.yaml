  md: '# Working with matrix and scalar functions


    Some functions are matrix functions: they require a matrix and return a matrix.
    Mata''s invsym(X) is an example of such a function. It returns the matrix that
    is the inverse of symmetric, real matrix X:


    ```

    : X = (76, 53, 48 \ 53, 88, 48 \ 46, 48, 63)

    : Xi = invsym(X)

    : Xi

    [symmetric]

    ```


    | 1 | 2 | 3 |

    |---|---|---||

    | .0298458083 | | |

    | -.0098470272 | .0212688926 | |

    | -.0155497706 | -.002885675 | .0337724301 |


    ```

    : Xi * X

    ```


    | 1 | 2 | 3 |

    |---|---|---||

    | -8.67362e-17 | -8.50015e-17 |

    | -1.387738e-16 | 1 | -1.02349e-16 |

    | | 1.11022e-16 |


    The last matrix, Xi * X, differs a little from the identity matrix because of
    unavoidable computational roundoff error.


    Other functions, mathematically speaking, scalar functions. sqrt() is an example
    in that it makes no sense to speak of sqrt(X). (That is, it makes no sense to
    speak of sqrt(X) unless we were speaking of the Cholesky square-root decomposition.
    Mata has such a matrix function; see [M-5] **cholesky**).


    When a function is, mathematically speaking, a scalar function, the corresponding
    Mata function will usually allow vector and matrix arguments and, then, the Mata
    function makes the calculation on each element individually:


    ```

    : M = (1, 2 3, 4 \ 5, 6)

    : M

    ```


    | 1 | 2 |

    |---|---|

    | | |

    | 3 | 4 |

    | 5 | 6 |


    ```

    : S = sqrt(M)

    : S

    ```


    | 1 | 2 | 1.414213562 |

    |---|---|---|

    | | 1.732050808 | 2 | |

    | | 2.236067977 | 2.449489743 |


    ```

    : S[1,2]*S[1,2]

    2

    : S[2,1]*S[2,1]

    3

    ```'
