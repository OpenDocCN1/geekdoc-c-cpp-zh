  md: '# [M-1] tolerance — Use and specification of tolerances 63


    # The problem


    In many formulas, zero is a special number in that; when the number arises, sometimes
    the result cannot be calculated or, other times, something special needs to be
    done.


    The problem is that zero—0.00000000000—seldom arises in numerical calculation.
    Because of roundoff error, what would be zero the calculation performed in infinite
    precision in fact is 1.03948e-15, or -4.4376e-16, etc.


    If one behaves as these small numbers are exactly what they seem to be (1.03948e-15
    is taken to mean 1.03948e-15 and not zero), some formulas produce wildly inaccurate
    results; see [M-5] isulove(() for an example.


    Thus routines use tolerances—preset numbers—to determine when a number is small
    enough to be considered to be zero.


    The problem with tolerances is determining what they ought to be.


    # Absolute relative tolerances


    Tolerances come in two varieties: absolute fixed number that is used to make direct
    comparisons. If the tolerance for a particular routine is 1e-14, 8.99e-15 in some
    calculation would be considered to be close to zero as if it were, in fact, zero,
    and 1.00001e-14 would be considered a valid, nonzero number.


    But is 1e-14 small? The number may look small to you, but whether 1e-14 is small
    depends on what is being measured and the units in which it measured. If all the
    numbers in a certain problem are around 1e-12, you might suspect that 1e-14 is
    a reasonable number.


    That leads to relative measures of tolerance. Rather than treating, say, a predetermined
    quantity being so small as to be zero, one specifies a value (for example, 1e-14)
    multiplied by something and uses that for the definition of small.


    Consider the following matrix:


    ```

    5.5e-15  1.2e-16

    1.3e-16  6.4e-15

    ```


    What is the rank of the matrix? One way to answer that question would be to take
    the LU decomposition of the matrix and then count the number of diagonal elements
    of U that are greater than zero. Here, we will just look at the matrix.


    The absolutist views that the matrix is full of roundoff error and that the matrix
    is really indistinguishable from the matrix


    ```

    0 0

    0 0

    ```


    The matrix has rank 0. The Relativist view is that the matrix has rank 2 because
    other than a factor of 1e-16, the matrix is indistinguishable from'
