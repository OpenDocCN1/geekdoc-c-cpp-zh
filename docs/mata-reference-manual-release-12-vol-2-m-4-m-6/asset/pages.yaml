  md: "# [M-1] — Introduction and first session 29\n\nReturning to the function tanh(),\n\
    \n```\nnumeric matrix tanh(numeric matrix u)\n{\n    numeric matrix eu, emu\n\
    \    eu = exp(u)\n    emu = exp(-u)\n    return ((eu-emu)/(eu+emu))\n}\n```\n\n\
    this is the first time we have seen the word: it means real or complex. Built-in\
    \ (previously written) function exp() works like sqrt() in that it allows a real\
    \ or complex argument and correspondingly returns a real or complex result. Said\
    \ in Mata jargon: exp() allows a numeric argument and returns a numeric result.\
    \ tanh() will also work like sqrt() and exp().\n\nAnother characteristic tanh()\
    \ shares with sqrt() and exp() is element-by-element operation. tanh() is element-by-element\
    \ exp() is element-by-element and we were careful to use the : / (element-by-element)\
    \ divide operator.\n\nIn any case, there is no need to type the above functions\
    \ because they are already part of Mata. You could learn more about them by seeing\
    \ their manual entry, [M-5] sin().\n\nAt the other extreme. Mata functions can\
    \ become long. Here is Mata's function to solve AX = B for X when A is lower triangular,\
    \ placing the result X back into A:\n\n```\nreal scalar _solver(numeric matrix\
    \ A, numeric matrix b,\nreal scalar usertol, numeric scalar user)\n{\n    real\
    \ scalar             tol, rank, a_t, b_t, d_t\n    real scalar             n,\
    \ m, i1, complex_case\n    numeric rowvector      sum\n    numeric scalar    \
    \      zero, d\n\n    d = ((n=rows(A))=cols(A)) _error(3205)\n    if (n != rows(b))\
    \       _error(3200)\n    if (isview(b))          _error(3104)\n    m = cols(b)\n\
    \    rank = n\n\n    a_t = iscomplex(A)\n    b_t = iscomplex(b)\n    d_t = d.<\
    \ ? iscomplex(d) : 0\n\ncomplex_case = a_t | b_t | d_t\n```"
