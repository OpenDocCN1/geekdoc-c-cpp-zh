    meta

    :

    mata (type end to exit)

    ```


    Meta uses a colon prompt, whereas Stata uses a period.


    # 8. Use Meta''s st_view() function to access your data


    Our matrix formulas are


    ```

    b = (X''X)⁻¹X''y

    v = s²(X''X)⁻¹

    ```


    where


    ```

    s² = e''e/(n-k)

    e = y - Xb

    n = rows(X)

    k = cols(X)

    ```


    so we are going to need y and X. y is an n × k column vector of dependent-variable
    values, and X is an n × k matrix of the independent variables, including the constant.
    Rows are observations, columns are variables.


    We make the vector and matrix as follows:


    ```

    : st_view(y=., "mpg")

    : st_view(X=., ("weight", "foreign", "cons")

    ```


    Let us explain. Why we could type this


    ```

    : y = st_view(., "mpg")

    : X = st_view(., ("weight", "foreign", "cons")

    ```


    because that is what the functions are really doing. We cannot use st_view() unlike
    all other Meta functions, returns a special kind of matrix called a view. A view
    looks like a regular matrix in nearly every respect, but views do not consume
    nearly as much memory, because they are in fact views onto the underlying dataset.


    We could create y and X with Meta''s st_data() function (see [M5] st_data()),
    and then we could type the creation of y and X the natural way.


    ```

    : y = st_data(., "mpg")

    : X = st_data(., ("weight", "foreign", "cons")

    ```'
