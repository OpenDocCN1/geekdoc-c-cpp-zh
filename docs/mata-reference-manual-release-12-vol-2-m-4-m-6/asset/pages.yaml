  md: "# Title\n\n```\n[M-3] mata which — Identify function\n```\n\n# Syntax\n\n```\n\
    : mata which fcnname()\n```\n\nThis command is for use in Mata mode following\
    \ Mata's colon prompt. To use this command from Stata's dot prompt, type\n\n```\n\
    . mata: mata which ...\n```\n\n# Description\n\nmata which fcnname looks for fcnname()\
    \ and reports whether it is built in, stored in a .mlib library, or stored in\
    \ a .mo file.\n\n# Remarks\n\nmata which fcnname() looks for fcnname() and reports\
    \ where it is found:\n\n+   * mata which I()\n  I(): built-in\n* mata which assert()\n\
