  md: "# [M-2] declarations — Declarations and types\n\nIf eltype is not specified,\
    \ transmorphic is assumed. If orgtype is not specified, matrix is assumed.\n\n\
    # Description\n\nTypes and the use of declarations is explained. Also discussed\
    \ the calling convention (functions are called by address, not by value, and may\
    \ change the caller's arguments), and the use of external globals.\n\nMata also\
    \ has structures—the eltype is struct name—but these are not discussed here. For\
    \ a discussion of structures, see [M-2] struct.\n\nMata also has classes—the eltype\
    \ is class name—but these are not discussed here. For a discussion of classes,\
    \ see [M-2] class.\n\nDeclarations are optional but, for careful work, their use\
    \ is recommended.\n\n# Remarks\n\nRemarks are presented under the following headings:\n\
    \n+   * The purpose of declarations\n* Types, element types, and organizational\
    \ types\n* Implicit declarations\n* Element types\n* Organizational types\n* Function\
    \ declarations\n* Argument declarations\n* The by-address calling convention\n\
    * Variable declarations\n* Linking to external globals\n\n# The purpose of declarations\n\
    \nDeclarations occur in three places: in front of function definitions, inside\
    \ the parentheses defining the function's arguments, and at the top of the function,\
    \ defining private variables the function will use. For instance, consider the\
    \ function\n\n```\nreal matrix swaprows(real matrix A, real scalar i1, real scalar\
    \ i2)\n{\n    real matrix B\n    real rowvector v\n    B = A\n    v = B[i1, .]\n\
    \    B[i1, .] = B[i2, .]\n    B[i2, .] = v\n    return(B)\n}\n```\n\nThis function\
    \ returns a copy of matrix A with rows i1 and i2 swapped."
  merge: -1
  pgno: 114
- img_proc: true
  md: "# [M-2] declarations — Declarations and types\n\nThere are three sets of declarations\
    \ in the above function. First, there is a declaration in front of the function\
    \ name:\n\n```\nreal matrix swaprows(...)\n{\n  ...\n}\n```\n\nThat declaration\
    \ states that this function will return a real matrix.\n\nThe second set of declarations\
    \ occur inside the parentheses:\n\n```\n...\nswaprows(real matrix A, real scalar\
    \ i1, real scalar i2)\n{\n  }\n```\n\nThose declarations state that this function\
    \ expects to receive three arguments, which we chose to call A, i1, and i2, and\
    \ we expect to be a real matrix, a real scalar, and a real scalar, respectively.\n\
    \nThe third set of declarations occur at the top of the body of the function:\n\
    \n```\n...\nswaprows(...)\n{\n  real matrix B\n  real vector v\n  ...\n}\n```\n\
    \nThose declarations state that we will use variables B and v inside our function\
    \ and that, as a matter of fact, B will be a real matrix and a v row vector.\n\
    \nWe could have omitted all those declarations. Our function could have read\n\
    \n```\nfunction swaprows(A, i1, i2)\n{\n  B = A\n  v = B[i1, .]\n  B[i1, .] =\
    \ B[i2, .]\n  B[i2, .] = v\n  return(B)\n}\n```\n\nand it would have worked fine.\
    \ So why we announced the declarations?\n\n+   1. By including the outside declaration,\
    \ we announced to other programs what to expect. They can depend on swaprows()\
    \ returning a real matrix because, when swaprows() is done, Mata will verify that\
    \ the function really is returning a real matrix and, if it is not, abort execution.\n\
    \nWithout the outside declaration, anything goes. Our function could return a\
    \ real scalar in one case, a complex row vector in another, and nothing at all\
    \ in yet another case.\n\nIncluding the outside declaration makes debugging easier."
  merge: -1
  pgno: 115
- img_proc: true
  md: '2. By including the argument declaration, we announced to other programmers
    what they are expected to pass to our function. We have made it easier to understand
    our function.


    We have also told Mata what to expect, and if some other program attempts to use
    our function incorrectly, Mata will stop execution.


    Just as in (1), we have made debugging easier.


    3. By including the inside declaration, we have told Mata what variables we will
    need and how we will be using. Mata can do two things with that information: first,
    it can make sure that we are using the variables correctly (making debugging easier
    again), and second, Mata can produce more efficient code (making our function
    faster).


    Interactively, we admit that we sometimes define functions without declarations.
    For more careful work, we include them.


    # Types, element types, and organizational types


    When you use Mata interactively, you just wildly-nilly create new variables:


    +   - n = 2

    - A = (1,2 \ 3,4)

    - z = (sqrt(-4+0i), sqrt(4))


    When you create a variable, you may not think about the type, but Mata does. n
    above is, Mata, a real scalar. A is a real matrix, z is a complex row vector.


    Mata thinks of the type of a variable as having two parts:


    +   - the type of the elements variable contains (such as real or complex)

    - how those elements are organized (such as a row vector or a matrix).


    We call those two types the eltype—element type—and orgtype—organizational type.
    The eltypes and orgtypes are


    | eltype | orgtype |

    | --- | --- |

    | transmorphic | matrix |

    | numeric | vector |

    | real | rowvector |

    | complex | colvector |

    | string | scalar |

    | pointer |


    You may choose one of each and describe all the types Mata understands.


    # Implicit declarations


    When do not declare an object, Mata behaves as if you declared it to be transmorphic
    matrix:


    +   - 1. transmorphic means that the matrix can be real, complex, string, or pointer.

    - 2. matrix means that the organization is to be $r \times c$, $r \geq 0$ and
    $c \geq 0$.'
