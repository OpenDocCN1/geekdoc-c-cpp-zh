  md: "# [M-2] class — Object-oriented programming (classes) 75\n\nThis is an example\
    \ of inheritance. class rotated_coord is an extension of class coord.\nIn object-oriented\
    \ programming, we would say this as \"class rotated_coord inherits\nfrom class\"\
    . A class that inherits from another class is known as a \"subclass\".\n\n+  \
    \ 4. Next we defined our replacement and new functions. The definitions are\n\n\
    ```\nreal scalar rotated_coord::angle()\n{\n    return(super.angle()) - theta;\n\
    }\nvoid rotated_coord::new()\n{\n    theta = 0;\n}\n```\n\nConcerning angle(),\
    \ we stated that it is calculated by taking the result of super.angle()\nand subtracting\
    \ theta from it. super.angle() is how one refers to the parent's definition of\n\
    a function. If you are unfamiliar with object-oriented programming, parent may\
    \ seem like an\nodd word in this context. We are inheriting concepts from coord\
    \ to define rotated_coord,\nin in that sense, coord is the parent concept. Anyway,\
    \ the new definition of an angle is\nthe old, minus theta, the angle of rotation.\n\
    \nnew() is a special function and is a special name in the sense that the name\
    \ new() is\nreserved. The new() function, if it exists, is a function that is\
    \ called whenever\na new instance of the class is created. Our new() function\
    \ says that when a new instance\nof rotated_coord is created, initialize the instance's\
    \ theta to 0.\n\nWell, it seems like a good idea. But we do not have a new() function\
    \ when we defined\nour previous class, coord. Did we forget something? Maybe.\
    \ When you do not specify a\nnew() function—how variables are to be initialized—they\
    \ are\ninما in the usual Way: missing values. x and y will be initialized to contain\n\
    missing. Given our new() function for rotated_coord, however, theta will be initialized\n\
    to 0.\n\nnew() is called \"constructor\", because it is used to construct, or\
    \ initialize, the class when\na instance of the class is created.\n\nAnd completes\
    \ the definition of our two, related classes.\n\nThere are two ways to create\
    \ instances of coord or a rotated_coord. One is mostly for interactive\nuse and\
    \ the other for programming.\nIf you interactively type=coord() (the parentheses),\
    \ you will create a coord and store it in\nb. If you interactively type b=rotated_coord(),\
    \ you will create a rotated_coord and store it in\nb. In the first example, typing\
    \ b=rotated_coord() is exactly what we chose to do:\n\n```\n: b = rotated_coord()\n\
    ```\n\nRecall that a rotated_coord contains an x, y, and theta. At this stage,\
    \ x and y equal missing,\ntheta is 0. In the example, we set b's x and y values\
    \ to 1, and then asked for the resulting\nangle():\n\n```\n: b.x = b.y = 1\n:\
    \ b.angle()\n```\n\n45"
