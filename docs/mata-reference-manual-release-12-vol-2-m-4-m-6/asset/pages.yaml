  md: '# Title


    [M-3] mata mosave — Save function''s compiled code in object file


    # Syntax


    ```

    : mata mosave fname() [ , dir(path) complete replace

    ```


    This command is for use in Mata mode following Mata''s colon prompt. To use this
    command from Stata''s dot prompt, type


    ```

    mata: mata mosave ...

    ```


    # Description


    mata mosave saves the object code for the specified function in the file fname.mo.


    # Options


    dir(path) specifies the directory (folder) into which the file should be written.
    dir(.) is the default, meaning if dir() is not specified, the file is written
    into the current (working) directory. path may be a directory, or OLDPLACE; see
    [p] sysdir shorthand STATA. UPDATES. BASE. SITE. PLUS. PERSONAL, or (PERSONAL)
    is recommended.


    complete is for use when saving class definitions. It specifies that the definition
    be saved only if it is complete; otherwise, an error message is to be issued.
    See [M-2] class.


    replace specifies that the file may be replaced if it already exists.


    # Remarks


    See [M-1] how for an explanation of object code.


    Remarks are presented under the following headings:


    Example of use


    Where to store .mo files


    Use of .mo files versus .mlib files


    # Example of use


    .mo files contain the object code for one function. If you store a function''s
    object code in a .mo-file, then in future sessions, you can use the function without
    recompiling the source. The function will appear to be a part of Mata just as
    all the other functions documented in this manual are. The function can be used
    because the object code will be automatically found and loaded when needed.


    For example,


    ```

    : function add(a,b) return(a+b)

    ```


    ```

    : add(1,2)

    ```'
  merge: -1
  pgno: 255
- img_proc: true
  md: '# [M-3] mata mosave -- Save function''s compiled code in object file 241


    : mata mosave add()

    (file add.mo created)

    : mata clear

    : +add(1,2)

    3


    In the example above, function add() was saved in file add.mo stored in the current
    directory. Clearing Mata, we could still use the function because Mata found the
    object code.


    # Where to store .mo files


    Mata could find add() because add.mo was in the current directory, and our-ado-path
    included :


    +   * adopath

    [1] (UPDATES) "C:\Program Files\Stata12\adoupdates"

    [2] (BASE) "C:\Program Files\Stata12\base\"

    [3] (SITE) "C:\Program Files\Stata12\site\"

    [4] "

    [5] (PERSONAL) "C:\ado\personal\"

    [6] (PLUS) "C:\ado\plus\"

    [7] (OLDPLACE) "C:\ado\"


    If we were to change our current directory


    . cd ..\etherdir


    Mata would no longer be able to find the file add.mo. The best place to store
    your .mo files is in your PERSONAL directory. Thus rather than typing


    : mata mosave example()


    we would have been better off typing


    : mata mosave example(), dir(PERSONAL)


    # Use of .mo files versus .mlib files


    Use of .mo files is heartily recommended. The alternative for saving compiled
    object code are .mlib libraries; see [M-3] mata mlib and [M-1] ado.


    Libraries are useful when you have many functions and want to tie them together
    into one file, especially if you want to share functions with others, because
    then you have only one file to distribute. The disadvantage of libraries is that
    you rebuild them whenever you wish to remove or change the code of one. If you
    have only a few object objects, or if you have many but sharing is not an issue,
    .mo libraries are easier to manage.


    # Also see


    [M-3] mata mlib — Create function library


    [M-3] intro — Commands for controlling Mata'
  merge: -1
