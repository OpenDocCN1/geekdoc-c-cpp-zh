  md: '# Which elements of x contain 0?


    : x:=0


    | | | |

    |---|---|---|n| 1 | 0 | 1 |

    | 2 | 1 | 0 |

    | 3 | 0 | 0 |


    How many zeros are there in x?


    : sum(x==0)


