    - Use of pointers to collect objects

    - Efficiency


    # What is a pointer?


    A pointer is the address of a variable or a function. Say that the address contains
    a matrix Another variable p might contain 132,799,016, and it 132,799,016 were
    the address at which X were stored, then p would be said to point to X. Addresses
    are written in base 10, so rather than saying p contains 132,799,016, we would
    be more likely to say that p contains 0x83ea568, which is the way we write numbers
    in hex. Regardless of how we write addresses, however, p contains a number and
    that number corresponds to the address of another variable.


    In our program, if we refer to p, we are referring to p contents, the number 0x83ea568.
    The monadic operator * is defined as "refer to the contents of the address" or
    "dereference": *p means X. We could code Y = *p or Y = X, and either way, we would
    obtain the same result. In our program, we could refer to X[i,j] or (*p)[i,j],
    and either way, we would obtain the i, j element of X.


    The monadic operator & is how we put addresses into p. To load p with the address
    of X, we code p = &X.


    The special address 0 (zero, written in hexadecimal) also known as 0X, is how
    we record that a pointer variable points to nothing. A pointer variable contains
    NULL or it contains the address of another variable.


    Or it contains the address of a function. Say that p contains 0x83ea568 and that
    0x83ea568, rather than being the address of matrix X, is the function of f().
    To get the address of f() into p, just as we coded p = &X previously, we code
    p = &f(0). The () at the end tells us that we want the address of a function.
    We code () on the end regardless of the number of arguments f() requires because
    we are not executing f(), we are just obtaining its address.


    To execute the function at 0x83ea568 now we will assume that f() takes two arguments
    and call them i and j-we (*p)(i,j) just as we coded (*p)[i,j] when p contained
    the address of matrix X.'
