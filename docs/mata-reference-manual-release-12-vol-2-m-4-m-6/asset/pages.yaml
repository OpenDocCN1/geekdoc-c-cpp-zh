  md: "# [M-2] declarations — Declarations and types\n\n```\nvoid _swaps(real matrix\
    \ A, real scalar i1, real scalar i2)\n{\n    real rowvector v\n    v = A[i1, .]\n\
    \    A[i1, .] = A[i2, .]\n    A[i2, .] = v\n}\n```\n\nThe function above returns\
    \ nothing; instead it modifies the matrix it is passed. That might be useful to\
    \ save memory, especially if every use of the original _swaps() was going to be\n\
    A = _swaps(A, i1, i12)\n\nIn any case, this new function _swaps() (note the underscore),\
    \ to flag the user that is odd and deceiving caution concerning the use of this\
    \ function.\n\nvoid, that is to say, returning nothing, is also considered a special\
    \ case of a transmorph matrix because Mata secretly returns a 0×0 real matrix,\
    \ which the caller discards.\n\n# Argument declarations\n\nArgument declarations\
    \ are the declarations that appear inside the parentheses, such as\n\n```\n_swaps(real\
    \ matrix A, real scalar i1, real scalar i2)\n{\n    ...\n...}\n```\n\nThe syntax\
    \ for what may appear there is\n\n```\n[type] argname [, [type] argname [, , ]\n\
    ```\n\nThe names are required—they specify how we will refer to the argument—and\
    \ the types are optional. Omit the type and transmorph matrix is assumed. Specify\
    \ the type, and it will be checked when your function is called. If the caller\
    \ attempts to use your function incorrectly, Mata will stop the execution and\
    \ complain.\n\n# The by-address calling convention\n\nArguments are passed to\
    \ functions by address, not by value. If you change the value of an argument made\
    \ _swaps() (above) work, the caller will change the caller's argument. Passed\
    \ us A and we changed it. And that is why in the original version of _swaps(),\
    \ the first line read\n\n```\nB = A\n```\n\nwe did work on B, and returned B.\
    \ We did not want to modify the caller's original matrix.\n\nYou do not intend\
    \ to make copies of the caller's arguments, but you do have to be careful if you\
    \ do not want to change the caller's argument. That is why in all the official\
    \ functions (with the exception of st_view()—[M-5_view()), if a function changes\
    \ the caller's argument, the function's name starts with an underscore. The reverse\
    \ logic does not hold: some functions start with an underscore and do not change\
    \ the caller's argument. The underscore signifies caution, and you need to read\
    \ the function's documentation to find out what it you need to be cautious about."
