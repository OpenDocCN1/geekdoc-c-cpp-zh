  md: "# Structures of structures\n\nStructures may contain other structures:\n\n\
    ```\nstruct twopart {\n  real scalar n1, n2\n}\nstruct pair_of_twoparts {\n  struct\
    \ twopart scalar t1, t2\n}\n```\n\nIf t were a struct pair_of_twoparts scalar,\
    \ then the members of t would be\n\n```\nt.t1        a struct twopart scalar\n\
    t.t2        a struct twopart scalar\nt.t1.n1     a real scalar\nt.t1.n2     a\
    \ real scalar\nt.t2.n1     a real scalar\nt.t2.n2     a real scalar\n```\n\nYou\
    \ may also create structures of structures of structures, structures of structures\
    \ of structures of structures, and so on. You may not, however, include a structure\
    \ in itself:\n\n```\nstruct recursive {\n  struct recursive scalar r\n  ...\n\
    }\n```\n\nDo you see how, even in the scalar case, struct recursive would require\
    \ an infinite amount of memory to store?\n\n# Pointers to structures\n\nWhat you\
    \ can do is this:\n\n```\nstruct recursive {\n  pointer(struct recursive scalar)\
    \ scalar r\n  ...\n}\n```\n\nThus, if r were a struct recursive scalar, then *r.r\
    \ would be the next structure, or r.r would be NULL if there were no structure.\
    \ Immediately after allocation, r.r would equal NULL.\n\nIn this way, you may\
    \ create linked lists.\n\nMata provides operator -> for accessing members of pointers\
    \ to structures, and assume that struct recursive also had member real scalar\
    \ n, so that rec.n would be rec's n value. The value of the next structure's n\
    \ would be rec.r->n (assuming rec.r!=NULL)."
