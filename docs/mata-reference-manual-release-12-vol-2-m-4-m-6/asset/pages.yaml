  md: '# Title


    [M-2] errors — Error codes


    # Description


    When an error occurs, Mata presents a number as well as text describing the problem.
    The codes are presented below.


    Also the error codes can be used as an argument with _error(), see [M-5] error().


    Mata''s error codes are a special case of Stata''s return codes. In particular,
    they are the return codes in the range 3000–3999. In addition to the 3000-level
    codes, it is possible for Mata functions to generate any Stata error message and
    return code.


    # Remarks


    Error messages in Mata break into two classes: errors that occur when the function
    is compiled (code 3000) and errors that occur when the function is executed (code
    3001–3999).


    Compile-time error messages look like this:


    ```

    :2,,3

    invalid expression

    r(3000);

    : "this" + "that

    mismatched quotes

    r(3000);

    ```


    The text of the message varies according to the error made, but the error code
    is always 3000.


    Run-time errors look like this:


    ```

    :function(2,3)

    solve(): 3200 conformability error

    mysub(): - function returned error

    function(): - function returned error

    <istmt>: - function returned error

    r(3200);

    ```


    The output is called a traceback log. From bottom to top, it says that you typed
    the (<istmt>) called myfunction(), which called mysub(), which called solve()
    and at that point, things went wrong. The error is possibly in solve(), but because
    solve() is a library function, it is more likely that the error is in mysub()
    called solve() called solve(). Moreover, the error is seldom in the program listed
    at the top of the traceback log because the log identifies the identity of the
    program that detected the error. Say solve() did an error. Then the traceback
    log would probably have something like


    ```

    * 3200 conformability error

    solve(): - function returned error

    mysub(): - function returned error

    function(): - function returned error

    <istmt>: - function returned error

    ```


    108'
  merge: -1
  pgno: 123
- img_proc: true
  md: '# [M-2] errors — Error codes 109


    The above log says the problem was detected by * (the multiplication operator),
    solve() would be suspect, because one must ask, why did solve() use the multiplication
    operator incorrectly?


    In any case, let''s assume that the problem is not with solve(). Then you would
    guess the problem lies with mysub(). If you have used mysub() in many previous
    programs without problems, however, you might now shift your suspicion to myfunction().
    If myfunction() is always trustworthy, you should not have typed myfunction(2,3).
    That is, perhaps you are using myfunction() incorrectly.


    # The error codes


    +   3000. (message varies)

    There is an error in what you have typed. Mata cannot interpret what you mean.


    +   3001. incorrect number of arguments

    The function expected, say three arguments and received two, or five. The function
    allows between three and five arguments, but you supplied too many or too few.
    Fix the calling program.


    +   3002. identical arguments not allowed

    You have called a function here, the same variable more than once. Usually this
    would not be a problem, here, it is, usually because the supplied arguments are
    matrices that the function wishes to overwrite with different results. For instance,
    say function f(A, B, C) examines matrix A and returns a calculation based on A
    in B and C. The function might complain that you specified the same matrix for
    B and C.


    +   3010. attempt to dereference NULL pointer

    The program made reference to *s and s contains NULL; [M-2] pointers.


    +   3011. invalid lval

    In an assignment, what appears on the left-hand side of the equals is not something
    to a value can be assigned; [M-2] op_assignment.


    +   3012. undefined operation on a pointer

    You have, for instance, attempted to add two pointers; [M-2] pointers.


    +   3020. class/parent compiled at different times

    One class is being used to extend another class, and the parent has been updated
    since the class was compiled.


    +   3021. class compiled at different times

    A function using a predefined class has not been recompiled since the class has
    last been changed.


    +   3101. matrix found where function required

    A particular argument to a function is required to be a function, and a matrix
    was found instead.


    +   3102. function found where matrix required

    A particular argument to a function is required to be a matrix, vector, or scalar,
    and a function was found instead.'
  merge: -1
