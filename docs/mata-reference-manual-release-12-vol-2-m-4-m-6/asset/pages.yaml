  md: "# 56 [M1] permutation — An aside on matrices and vectors\n\nIn Mata, we would\
    \ actually write the above as A[(2\\32)],], and Mata would understand that we\
    \ want the matrix made up of rows 2, 3, and 2 of A, all columns. Similarly, we\
    \ can request all rows, columns 2, 3, and 2:\n\n```\nA[.,(2,3,2)] = \\begin{bmatrix}\
    \ 2 & 3 & 2 \\ 5 & 6 & 5 \\ 8 & 9 & 8 \\end{bmatrix}\n```\n\nIn the above, we\
    \ wrote (2,3,2) as a row vector because it seems more logical that way, but we\
    \ could just as well have written A[.,(2\\322)]. In subscribing, Mata does not\
    \ care whether the vectors are rows or columns\n\nIn any case, we can use a vector\
    \ of indices Mata's subscripts to select rows and columns of a matrix, and that\
    \ means we can permute them. All that is required that the vector we specify contain\
    \ a permutation of the integers 1 through n because, otherwise, we would repeat\
    \ some rows or columns and omit others.\n\nA permutation vector is an n $\times$\
    \ 1 or 1 $\times$ n vector containing a permutation of the integers 1 through\
    \ n. For example, the permutation vector equivalent to the permutation matrix\n\
    \n```\nP = \\begin{bmatrix} 0 & 1 \\ 0 & 1 \\ 1 & 0 \\end{bmatrix}\n```\n\nis\n\
    \n```\np = \\begin{bmatrix} 2 \\ 3 \\ 1 \\end{bmatrix}\n```\n\np can be used with\
