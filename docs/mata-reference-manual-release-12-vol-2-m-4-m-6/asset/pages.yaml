  md: '# Listing pointers


    You may list pointers:


    ```

    : y = 2

    : x = ky

    : x

    0x8359e80

    ```


    What is, 0x8359e80, is the memory address of y during your Stata session. If you
    typed the above lines, the address you would see differ, but that does not matter.


    Listing the value of pointers often helps in debugging because, by comparing addresses,
    you can determine where pointers are pointing and some are pointing to the same
    thing.


    In listings, NULL is presented as 0x0.


    # Declaration of pointers


    Declaration of pointers, as with all declarations (see [M-2] declarations) is
    optional. That basic syntax is


    ```

    pointer(type) orgytype [function]...

    ```


    For instance,


    ```

    pointer(real matrix) scalar pl

    ```


    declares that pl is a pointer scalar and that it points to a real matrix, and


    ```

    pointer(complex colvector) rowvector p2

    ```


    declares that p2 is a rowvector of pointers and that each pointer points to a
    complex colvector, and


    ```

    pointer(real scalar function) scalar p4

    ```


    declares that p3 is a pointer scalar, and that it points to a function that returns
    a real scalar, and


    ```

    pointer(real matrix function) rowvector) colvector p4

    ```


    declares that p4 is a column vector of pointers to pointers, the pointers to which
    each element are rowvectors, and each of these elements points to a function returning
    a real matrix.


    You can omit the pieces you wish.


    ```

    pointer() scalar p5

    ```


    declares that p5 is a pointer scalar—to what being uncertain.


    ```

    pointer scalar p5

    ```


    means the same thing.


    ```

    pointer p6

    ```


    declares that p6 is a pointer, but whether it is a matrix, vector, or scalar,
    is unsaid.'
