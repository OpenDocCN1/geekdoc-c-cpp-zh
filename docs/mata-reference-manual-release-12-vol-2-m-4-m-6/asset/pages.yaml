  md: "# M- class — Object-oriented programming (classes)\n\nb-dot-x is how one refers\
    \ to b's value of x. One can use b.x (and b.y) just as one would use any real\
    \ scalar variable in Mata.\n\nIf we reset b's theta to be 30 degrees, b's angle\
    \ ought to change to being 15 degrees. That is exactly what happens:\n\n```\n\
    : b.theta = 30\n: b.angle()\n  15\n```\n\nb-dot-angle() is how one specifies that\
    \ member function angle() is to run on instance b. Now you know an instance of\
    \ a class and so have access to all the values of member variables of class. We\
    \ repeat, however, that a member function could take additional arguments. We\
    \ coded\n\n```\nreal scalar rotated_coord::real scalar base)\n{\n  return(super.angle()\
    \ - theta - base)\n}\n```\n\nthen angle() would have taken an argument and the\
    \ result measured from base.\n\nThe difference between using rotated_coord interactively\
    \ and using it inside a Mata program is that if we declare a variable (say, b)\
    \ to be a class rotated_coord scalar, with the emphasis on scalar, then we do\
    \ not need to bother brotated_coord() to fill b initially. Coding class rotated_coord\
    \ b needs to be initialized before it is a scalar, and so that happens automatically.\
    \ It would not hurt if we also coded brotated_coord(), but it would be a waste\
    \ of our time and the computer's it to go around executing our program.\n\nLet's\
    \ you something we did not show in the first example. Remember when we defined\
    \ length() for a coord? Remember how we did not define length() for a rotated_coord?\
    \ Even so, length() is a concept of rotated_coord, because of the definition of\
    \ rotated_coord was inherited from coord, and that happened because when we declared\
    \ rotated_coord, we said\n\n```\nclass rotated_coord extends coord\n```\n\nThe\
    \ inheritance happened because we said extends. Let's test that length() works\
    \ with our rotated_coord class instance, b:\n\n```\n: b.length()\n  1.414213562\n\
    ```\n\nIn the above, we is saved from having to write additional, repeated code.\n\
    \nLet's review. First, we defined a coord. From that, we defined a rotated_coord.\
    \ You might now define translated_and_rotated_coord using rotated_coord as a starting\
    \ point. It would not be difficult.\n\nClasses have lots of properties, features,\
    \ and details, but it is the property of inheritance that is at the heart of object-oriented\
    \ programming."
