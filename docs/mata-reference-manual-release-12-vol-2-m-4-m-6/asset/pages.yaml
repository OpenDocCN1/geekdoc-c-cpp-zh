  md: '# [M-1] interactive — Using Mata interactively


    st_data() returns a real matrix, which is a copy of the data Stata has stored
    in memory.


    We could use st_data() and be done with the problem. For our automobile-data example,
    that would be a fine solution. But were the automobile data larger, you might
    run short of memory, and views can save lots of memory. You can create views willynilly—lots
    and lots of them—and never consume much memory! Views are wonderfully convenient
    and it is worth mastering the little bit of syntax to use them.


    st_view() requires three arguments: the name of the matrix to be created, the
    observations (rows) the matrix is to contain, and the variables (columns). If
    we wanted to create a view matrix Z containing all the observations and all the
    variables, we could type


    ```

    : st_view(Z, . )

    ```


    st_view() understands missing value in the second and third positions to mean
    all the observations and all the variables. Let''s try it:


    ```

    : st_view(Z, ., .)

    err:<istm>: 3499 Z not found

    ```


    (3499)


    That did not work because Mata requires Z to be predefined. The reasons are technical,
    but it should not surprise you that function arguments need to be defined before
    a function can be used. Mata just not understand that st_view() really does not
    need Z defined. The way around Mata''s confusion is to define Z and then let st_view()
    redefine it:


    ```

    : Z = =

    : st_view(Z, ., .)

    ```


    You, if you wish, combine all that into one statement


    ```

    : st_view(Z=., ., .)

    ```


    and that is what we defined y and X:


    ```

    : st_view(y=., ., "mpg")

    : st_view(X=., ("weight", "foreign", "cons")

    ```


    The second argument specified that we wanted all the observations, and the third
    argument specified the variables we wanted. Be careful not to omit the "extra"
    parentheses when typing the variables. We were to type


    ```

    : st_view(X=., "weight", "foreign", "cons")

    ```


    you would be told you typed an invalid expression. st_view() expects three arguments,
    and the third argument is a row vector specifying the variables to be select:
    ("weight", "foreign", "cons")


    At this point, we suggest you type


    ```

    : y

    (output omitted)

    : X

    (output omitted)

    ```


    to see that y and X really do contain our data. In case you have lost track of
    what we have typed, here is our complete session so far:'
