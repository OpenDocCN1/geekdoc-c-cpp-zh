    Given a matrix with such large elements, one is tempted to change one''s view
    as to what is small. Calculate the rank of the following matrix:


    | 5.5e+14 1.2e+12 1.5e-04 |

    | 1.3e+13 2.4e+13 2.8e-05 |

    | 1.3e-04 2.4e-05 8.7e-05 |


    This time, we do the problem correctly: we will take the LU decomposition and
    count the number of nonzero entries along the diagonal of U. For the above matrix,
    the diagonal of U turns out to be (5.5e+14, 2.4e+13, 0.000087).


    An absolutist would tell you that the matrix is of full rank; the smallest number
    along the diagonal of U is 0.000087 (8.7e-5), and that is still a respectable
    number, at when compared with computer precision, being 2.22e-16 ([M-5] epsilon)).


    Most Mata routines would tell you that the matrix has rank 2. Numbers such as
    0.000087 may seem respectable when compared with machine precision, but 0.000087,
    relatively speaking, a very small number, being about 4.6e-19 relative to the
    average value of the diagonal elements.


    # Specifying tolerances


    Most Mata routines use relative tolerances, but there is no rule. You must read
    the documentation for the function you are using.


    When the tolerance entry for a function directs you, [M-1] tolerance, then the
    tolerance works as summarized under Syntax above. Specify a positive number, and
    that number multiplies the default: specify a negative number, and the corresponding
    positive number is used in place of the default.


    # Also see


    +   - [M-5] epsilon() — Unit rounding error (machine precision)

    - [M-5] solve_tol() — Tolerance used by solvers and inverters

    - [M-1] intro — Introduction and advice'
