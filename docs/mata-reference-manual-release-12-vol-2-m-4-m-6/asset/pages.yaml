    result: 1 x 1|


    |!a:

    a: r x c

    result: r x c|


    |a&b, a|b:

    a: 1 X 1

    b: 1 X 1

    result: 1 X 1|


    # Diagnostics


    a==b and a!=b cannot fail.


    a>b, a>=b, a<b, a<=b abort with error if a and b are not p-conformable, if a and
    b are not of the same general type (numeric and numeric or string), or if a or
    b are pointers.'
