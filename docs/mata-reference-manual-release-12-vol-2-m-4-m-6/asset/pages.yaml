  md: '# Title


    [[M-2] void — Void matrices


    # Syntax


    ```

    J(0, 0, .)   0 × 0 real matrix

    J(r, 0, .)   r × 0 real matrix

    J(0, c, .)   0 × c real matrix


    J(0, 0, 11)   0 × 0 complex matrix

    J(r, 0, 11)  r × 0 complex matrix

    J(0, c, 11)   0 × c complex matrix


    J(0, 0, "")   0 × 0 string matrix

    J(r, 0, "")  r × 0 string matrix

    J(0, c, "")  0 × c string matrix


    J(0, 0, NULL) 0 × 0 pointer matrix

    J(r, 0, NULL) r × 0 pointer matrix

    J(0, c, NULL) 0 × c pointer matrix

    ```


    # Description


    Mata allows 0 × 0, r × 0, and 0 × c matrices. These matrices are called void matrices.


    # Remarks


    Remarks are presented under the following headings:

    Void matrices, vectors, row vectors, and column vectors

    How to read conformability charts


    # Void matrices, vectors, row vectors, and column vectors


    Void matrices contain nothing, but they have dimension information (they are 0
    × 0, r × 0, or 0 × c) and have an eltype (which is real, complex, string, or pointer):


    +   1. A matrix is said to be void if it is 0 × 0, r × 0, or 0 × c.

    2. A vector is said to be void if it is 0 × 1 or 1 × 0.

    3. A column vector is said to be void if it is 0 × 1.

    4. A row vector is said to be void if it is 1 × 0.

    5. A scalar cannot be void because it is, by definition, 1 × 1.


    The function J(r, c, val) creates r × c matrices containing val; see [M-5]. J()
    can be used to manufacture void matrices by specifying r and/or c as 0. The value
    of the third argument does not matter, but its eltype does:'
  merge: -1
  pgno: 227
- img_proc: true
  md: "1. J(0,0,.) creates a real 0×0 matrix, as will J(0,0,1) and as J() with any\
    \ real third argument.\n\n2. J(0,0,ii) creates 0×0 complex matrix, as will J()\
    \ with any complex third argument.\n\n3. J(0,0,'') creates 0× string matrix, as\
    \ will J() with any string third argument.\n\n4. J(0,0,NULL) creates 0×0 pointer\
    \ matrices, as will J() with any pointer third argument.\n\nIn fact, one rarely\
    \ manufactures such matrices because they arise naturally in extreme cases. Similarly,\
    \ one rarely needs to include special code to handle void matrices because such\
    \ matrices handle themselves. Loops vanish when the number of rows or columns\
    \ are zero.\n\n# How to read conformability charts\n\nIn general, not only is\
    \ emphasis placed on functions and operators with void matrices, no mention is\
    \ ever made of the fact. Instead, the information is buried in the Conformability\
    \ section located near the end of the function's or operator's manual.\n\nFor\
    \ instance, the conformability chart for some function might read\n\n```\nsomefunction(A,\
    \ B, v):\n A:   r × c\n B:   c × k\n v:   1 × k or k × 1\n result: r × k\n```\n\
    \nAmong other things, the chart above is stating how somefunction() handles void\
    \ matrices. A must be r × c. That chart does not say\n\n```\nA:   r × c, r > 0,\
    \ c > 0\n```\n\nand that is what it would have if somefunction() did not allow\
    \ A to be void. Hence, A may be 0×0, 0×c, or r×0.\n\nSimilarly, B may be as long\
    \ as rows(B)==cols(A), v may be void if cols(B)==0. The returned result would\
    \ be void if rows(A)==0 or cols(B)==0.\n\nInterestingly, somefunction() can produce\
    \ a void result from void input. For instance, if A were 5×0 and B were 0×3, a\
    \ 5×3 result would be produced. It is interesting to specify what would be in\
    \ 5×3 result. Probably, if we know what somefunction() did, it would be obvious\
    \ to us, but if it were not, the following sequence: Diagnostics(), would state\
    \ what the surprising result would be.\n\nAs a real example, see {M-5]trace().\
    \ trace() will take the trace of a 0×0 matrix. The result is 0. See multiplication\
    \ (*) in [M-2]op_arith.. One can multiply a k×0 matrix by a k×m matrix to produce\
    \ a k×m result. The matrix will contain zeros.\n\n# Also see\n\n[M-2] intro —\
    \ Language definition"
  merge: -1
