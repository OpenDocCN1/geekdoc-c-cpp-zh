  md: '# Title


    [M-1] interactive — Using Mata interactively


    # Description


    With Mata, you simply type matrix formulas to obtain the desired results. Below
    we provide guidelines when doing this with statistical formulas.


    # Remarks


    You have data and statistical formulas that you wish to calculate, such as $b
    = (X''X)^{-1}X''y$. Perform the following steps:


    +   Start in Stata. Load the data.


    +   If you are doing time-series analysis, generate new variables containing any
    `op.varname` variables you need, such as 1.gnp or d.r.


    +   Create a constant variable (`gen cons = 1`). In most statistical formulas,
    you will find it useful.


    +   Drop variables that you will not need. This saves memory and makes some things
    easier because you can just refer to all the variables.


    +   Drop observations with missing values. Mata understands missing values, but
    Mata is a matrix language, not a statistical system, so Mata does not always ignore
    observations with missing values.


    +   Put variables on roughly the same numeric scale. This is optional, but we
    recommend it. We explain what we mean and how to do this below.


    +   Enter Mata. Do that by typing mata at the Stata command prompt. Do not type
    a colon after the mata. This way, when you make a mistake, you will stay in Mata.


    +   Use Mata''s `st_view()` function (see [M-5] `st_view()`) to create matrices
    based on your Stata dataset. Create all the matrices you want or find convenient.
    The matrices created by `st_view()` are in fact views onto one copy of data.


    +   Perform your matrix calculations.


    If you are reading the entries in the order suggested in [M-0] intro, see [M-1]
    how next.


    # Start in Stata; load the auto dataset


    We will use the auto dataset and fit it the regression


    ```

    mpg_j = b_0 + b_1weight_j + b_2foreign_j + e_j

    ```'
