  md: '# Title


    [M-2] exp — Expressions


    # Syntax


    exp


    # Description


    exp is used in syntax diagrams to mean "any valid expression may appear here".
    Expressions range from being simple constants


    +   2

    "this"

    3+2i


    to being names of variables


    +   A

    beta

    varwithverylongname


    to being a full-fledged scalar, string, or matrix expression:


    ```

    sqrt(2)/2

    substr(userid, 15, strlen(otherstr))

    conj(X)*Y

    ```


    # Remarks


    Remarks are presented under the following headings:


    +   What''s an expression

    Assignment displays display, as does (void)

    The pieces of an expression

    Numeric Literals

    String literals

    Variable names

    Operators

    Functions


    # What''s an expression


    Everybody knows what an expression is: expressions are things like 2+3 and invsym(X''*X)*Y''.
    Simpler things are also expressions, such as numeric constants


    +   2

    is an expression


    and string literals


    +   "hi there"

    is an expression'
