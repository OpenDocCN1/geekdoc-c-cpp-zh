  md: '# Title


    [M-3] mata set — Set and display Mata system parameters


    # Syntax


    : mata query


    : mata set matacache [# [, permanently]

    : mata set matalum {off | on}

    : mata set mataoptimize {on | off}

    : mata set matafavor {space | speed} [, permanently]

    : mata set matastric {off | on} [, permanently]

    : mata set matalibs "libname;libname;..."

    : mata set mataoffirst {off | on} [, permanently]


    These commands are for use in Mata mode following Mata''s colon prompt. To use
    these commands from Stata''s dot prompt, type

    - mata: mata query

    - mata: mata set ...


    # Description


    mata query sets the values of Mata''s system parameters.

    mata set sets the value of the system parameters:


    mata set matacache specifies the maximum amount of memory, in kilobytes, that
    may be consumed before Mata starts looking to drop autoloaded functions that are
    not currently used. The default value is 400, meaning 400 kilobytes. This parameter
    affects the efficiency with which Stata runs. Larger values cannot hurt, but once
    matacache is large enough, larger values will not improve performance.


    mata set matalum program line-number tracing on or off. The default setting is
    off. This setting modifies how programs are compiled. Programs compiled when matalum
    is turned on include code so that, if an error occurs during execution of the
    program, the line number is also reported. Turning matalum prevents Mata from
    being able to optimize programs, so they will run more slowly. Except when debugging,
    the recommended setting for this is off.


    mata set mataoptimize turns compile-time code optimization on or off. The default
    setting is on. Programs compiled when mataoptimize is switched off will run more
    slowly and, sometimes, much more slowly. The only reason to set mataoptimize off
    is if a bug in the optimizer is suspected.'
  merge: -1
  pgno: 258
- img_proc: true
  md: 'mata metafavor specifies whether when executing code, Mata should favor conserving
    memory (space) or running quickly (speed). The default setting is space. Switching
    to speed will make Mata, in a few instances, run a quicker code but consume more
    memory. Also see [M-5] favored().


    mata metastastrict sets declarations whether can be omitted inside the body of
    a program. The default is off. If metastastrict is switched on, compiling programs
    that omit the declarations will result in a compile-time error, see [M-2] declarations.
    metastastrict acts unexpectedly when set/reset inside ado-files; see [M-1] ado.


    mata metolibs sets the names and order of the .mlib libraries to be searched;
    see [M-1] how. matlab usually is set to "matabase;lmataado". However it is set,
    it is probably correct, because Mata automatically searches for libraries the
    first time it is invoked in a Stata session. During a session, you erase or copy
    new libraries along the ado-path, the best way to reset matolibs is with the mata
    mlib index command; see [M-3] mata mlib. The only reason to set matolib by hand
    is to modify the order in which libraries are searched.


    mata metamofirst states whether no files or .mlib libraries are searched first.
    The default is off, meaning libraries are searched.


    # Option


    permanently specifies that, in addition to making the change right now, the setting
    will be remembered and become the default setting when you invoke Stata the future.


    # Remarks


    Remarks are presented under the following headings:


    +   Relationship between Mata''s meta set and Stata''s commands

    (c) values


    # Relationship between Mata''s meta set and Stata''s set commands


    The command


    ```

    : mata set ...

    ```


    issued from Mata''s colon prompt and the command


    ```

    set ...

    ```


    issued from Stata''s dot prompt are the same command, so you may set Mata''s (or
    even Stata''s) system parameters either way.


    The command


    ```

    : mata query

    ```


    issued from Mata''s colon prompt and the command


    ```

    . query mata

    ```


    issued from Stata''s dot prompt are also the same command.'
  merge: -1
