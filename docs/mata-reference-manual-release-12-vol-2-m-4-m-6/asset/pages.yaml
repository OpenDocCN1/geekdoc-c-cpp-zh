  md: '# [M-2] struct — Structures


    5. You may use subscribing to access and copy structure members:


    ```

    ex1 = E[1,2]

    E[1,2] = ex1

    F = E[2..]

    E[2..] = F

    G = E[1,1\2,2]

    E[1,1\2,2] = G

    ```


    6. You may use the rows() and cols() functions to obtain the number of rows and
    columns of a matrix structures.


    7. You may use eltype() and orgtype() with structures. eltype() returns struct,

    orgtype() returns the usual results.


    8. You may use most functions that start with the letters is, as in isreal(),
    iscomplex(),

    istring(), etc. These functions return 1 if true and 0 if false and with structures,
    usually

    return 0.


    9. You may use swap() with structures.


    # Listing structures


    To list the contents of a structure variable, as for debugging purposes, use function
    liststruct();

    [M-5] liststruct().


    Using the default, unassigned-expression method to list structures is not recommended,
    because all

    that is shown is a pointer value instead of the structure itself.


    # Use of transmorph as passthrough


    A transmorph matrix can theoretically hold anything, so when we told you that
    structures had

    to be explicitly declared, that was not exactly right. Say that function twopart()
    returns a struct

    twopart scalar. You could code


    ```

    x = twopart()

    ```


    without declaring x (or declaring it x), and would not be an error. What you would

    not be to refer to x.n1 or x.n2, the compiler would not know that x contains

    a struct twopart and would have no way of interpreting the variable references.


    This property can be good to use in implementing handles and passthrough.


    Say that you are implementing a complicated system. Just to fix ideas, we''ll
    pretend that the system

    inds the maximum of user-specified functions and that the system has many bells
    and whistles. To

    track a given problem, let''s assume that your system needs many variables. One
    variable records

    the method to be used. Another records whether numerical derivatives are be used.
    Another records

    the current gradient vector. Another records the iteration count, and so on. There
    might be hundreds

    of these variables.'
