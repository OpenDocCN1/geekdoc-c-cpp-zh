  md: '# Title


    ```

    [M-2] op_conditional — Conditional operator

    ```


    # Syntax


    a ? b : c


    where a must evaluate to a real scalar, and b and c may be of any type whatsoever.


    # Description


    The conditional operator returns b if a is true (a is not equal to 0) and c otherwise.


    # Remarks


    Conditional operators


    dof = (k==0 ? n-1 : n-k)


    are more compact than the if-else alternative


    if (k==0) do = n-1

    else do = n-k


    and they can be used as parts of expressions:


    se = ess/(k==0 ? n-1 : n-k)


    # Conformability


    ```

    a ? b : c

    a: 1 × 1

    b: r1 × c1

    c: r2 × c2

    result: r1 × c1 or r2 × c2

    ```


    # Diagnostics


    In a ? b : c, only the necessary parts are evaluated: a and b if a is true, or
    a and c if a is false. However, the ++ and -- operators are always evaluated:


    (k==0 ? i++ : j++)


    increments both i and j, regardless of the value of k.'
