  md: "# [M-2] declarations — Declarations and types\n\nAt one point in your function,\
    \ a transomorphic matrix might be a real scalar (real being a special case of\
    \ transomorphic and scalar being a special case of a matrix when r = c = 1), and\
    \ at another point, it might be a string collector (string being a special case\
    \ of transomorphic. and colvector be a special case of a matrix when c = 1).\n\
    \nConsider our swaps() function without declarations:\n\n```\nfunction swapsrows(A,\
    \ i1, i2)\n{\n  B = A\n  v = B[i1, .]\n  B[i1, .] = B[i2, .]\n  B[i2, .] = v\n\
    \  return(B)\n}\n```\n\nThe result of compiling function is just as if the function\
    \ return\n\n```\ntransomorphic matrix swapsrows(transomorphic matrix A,\n  transomorphic\
    \ matrix i1,\n  transomorphic matrix i2)\n{\n  transomorphic matrix B\n  transomorphic\
    \ matrix v\n  B = A\n  v = B[i1, .]\n  B[i1, .] = B[i2, .]\n  B[i2, .] = v\n \
    \ return(B)\n}\n```\n\nWhen we declare a variable, we put restrictions on it.\n\
    \n# Element types\n\nThere are six elypes, which means real, complex, string,\
    \ or pointer.\n\n+   1. transomorphic, which means real, complex, or pointer.\n\
    \n+   2. numeric, which means real or complex.\n\n+   3. real, which means that\
    \ the elements are real numbers, such as 1. 3. -50 and 3.14159.\n\n+   4. complex,\
    \ which means that each element is a pair of numbers, which are given the interpretation\
    \ a + bi. complex is a storage type: the number stored in a complex might be real,\
    \ such as 2 + 0i.\n\n+   5. string, which means the elements are strings of text.\
    \ Each element may contain up to 2,147,483,647 characters and strings may (need\
    \ not) contain binary 0; that, strings may be binary strings or text strings\n\
    \n+   6. pointer means the elements are pointers to (addresses of) other Mata\
    \ matrices, scalars, or even functions; see [M-2] pointers."
