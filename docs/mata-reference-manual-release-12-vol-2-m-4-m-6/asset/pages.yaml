  md: "# Title\n\n[M-2] version — Version control\n\n# Syntax\n\nSyntax 1\n\n```\n\
    . version #[.#]\n. mata:\n  : function name(...)\n  {\n    ...\n  }\n  :...\n\
    \  : end\n```\n\nSyntax 2\n\n```\n: function name(...)\n  {\n    version #[.#]\n\
    \    ...\n  }:\n```\n\n# Description\n\nIn syntax 1, Stata's version command (see\
    \ [P] version) sets the version before entering Mata. This specifies both the\
    \ compiler and library versions to be used. Syntax 1 is recommended.\n\nIn syntax\
    \ 2, Mata's version command sets the version of the library functions that are\
    \ to be used. Syntax 2 is rarely used.\n\n# Remarks\n\nRemarks are presented under\
    \ the following headings:\n\n+   - Purpose of version control\n- Recommendations\
    \ for do-files\n- Recommendations for ado-files\n- Compile-time and run-time versioning\n\
    \n# Purpose of version control\n\nMata is under continual development, which means\
    \ not only that new features are being added but also old features sometimes change\
    \ how they work. Old changing how they work is supposedly an improvement—it generally\
    \ is—but that also means old programs might stop working or, worse, work differently."
