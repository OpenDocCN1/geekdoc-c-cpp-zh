  md: '# What’s new


    This section is intended for previous Stata users. If you are new to Stata, you
    may as well skip it.


    +   New Stata commands getmata and putmata make it easy to transfer your data
    into Mata, manipulate them, and then transfer back to Stata. getmata and putmata
    are especially designed for interactive use. See [D] putmata.


    +   New functions imported from Stata,


    +   Tukey’s Standardized range, cumulative and inverse, tukeyprob() and invtukeyprob().


    +   Dunnet’s multiple range, cumulative and inverse, dunnettprob() and invdunnettprob().


    +   New date conversion functions dobf() and bofdf() convert between business
    dates and standard calendar dates. See [D] datetime business calendars.


    See [D] functions, [M-5] normal(), and [M-5] date().


    +   Support for hidden and historical saved results. Existing Mata functions st_global(),
    st_numscalar(), and st_matrix() now allow an optional third argument specifying
    the hidden or historical status. These new functions—st_global_hcat(), st_numscalar_hcat(),
    st_matrix_hcat()—allow you to determine the saved hidden or historical status.
    See [M-5] st_global(), [M-5] st_numscalar(), and [M-5] st_matrix().


    +   Support for new ml features. Stata’s ml now distinguishes the Hessian matrix
    produced by technique(nr) from the other techniques that compute a substitute
    for the Hessian matrix. This means that ml will compute the real Hessian matrix
    of second derivatives to determine convergence when all other convergence tolerances
    are satisfied and technique(bfgs), technique(bhhh), or technique(dfp) in effect.


    Mata’s commands optimize() and optimize() have been similarly changed. See [M-5]
    optimize() and [M-5] optimize().


    # Also seen


    +   [M-1] first — Introduction to first session


    +   [M-6] Glossary


