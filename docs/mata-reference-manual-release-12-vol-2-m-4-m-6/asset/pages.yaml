  md: "# Technical note\n\nThe above story is not exactly true because, as told, variable\
    \ x would be local to function <iostream> so, when <iostream>() concluded execution,\
    \ variable x would be discarded. To prevent that from happening, Mata makes all\
    \ variables defined by <iostream> global. Thus you can type\n\n```\nx = 3\n```\n\
    \nfollowed by\n\n```\ny = x + 2\n```\n\nand all works out just as you expect:\
    \ y is set to 5.\n\n# What happens when you type a mata environment command\n\n\
    When you are at a colon prompt and type something that begins with the word mata,\
    \ such as\n\n```\nmata describe\n```\n\nor\n\n```\nmata clear\n```\n\nsomething\
    \ completely different happens: Mata freezes itself and temporarily transfers\
    \ control to a command interpreter like Stata's. The command interpreter accesses\
    \ Mata's environment and reports on it or changes it. Once done, the interpreter\
    \ returns to Mata, which comes back to life, and issues a new colon prompt:\n\n\
    :\n\nOnce something is typed at the prompt, Mata will examine to determine if\
    \ it begins with the word mata (in which the interpretive process repeats), or\
    \ if it is the beginning of a function definition (in which the program will be\
    \ compiled but not executed), or anything else in which case Mata will try to\
    \ compile and execute it as <iostream>.\n\n# Working with object code I: .mo files\n\
    \nEverything hinges on the object code that Mata produces, and, if wish, you can\
    \ save the object code on disk. The advantage of doing this is that at some future\
    \ date, your program can be executed without compilation, which saves time. If\
    \ you send the object code to others, they can use your program without ever seeing\
    \ the source code behind it.\n\nAfter you type, say:\n\n```\n: function try()\n\
    {\n  real scalar i\n  for (i=1; i<=10; i++)\n}\n```\n\nMata has created the object\
    \ code and discarded the source. If you now type\n\n```\n: mata mosave try()\n\
    ```\n\nthe Mata interpreter will create try.mo in the current directory; if [Mata]\
    \ mata mosave. The new file will contain the object code."
