  md: "# [M] class — Object-oriented programming (classes)\n\nNote that bigsystem::new()\
    \ must deal with two initializations, first and subsequent. The first time it\
    \ is called, counter is . and new() must set counter to be 1. After that, new()\
    \ will increment counter.\n\nIf this system needs to obtain a resource, such as\
    \ access to a radio telescope, on first initialization and release it on last\
    \ destruction, and be ready to repeat the process, the code could read\n\n```\n\
    void bigsystem::new() {\n    if (counter==) {\n        get_resource()\n      \
    \  counter = 1\n    } else {\n        ++counter\n    }\n}\nvoid bigsystem::destroy()\
    \ {\n    if (--counter == 0) {\n        release_resource()\n    }\n}\n```\n\n\
    Note that destroy()s are run whenever an instance is destroyed, even if that destruction\
    \ is due to abort-error in the user's program or even in the member functions.\
    \ The radio telescope will be released when the last instance of bigsystem is\
    \ destroyed. in one case. The exception is when there is an error in destroy()\
    \ or any of the subtroutines destroy() calls.\n\nFor inheritance, child destroy()s\
    \ are run before parent destroy().s.\n\n# Setting member variable and member function\
    \ exposure\n\nExposure specifies who may access the member variables and member\
    \ functions of your class. There are three levels of exposure: from least restrictive\
    \ to most restrictive, public, protected, and private.\n\n+   - Public variables\
    \ and functions may be accessed by anyone, including callers from outside a class.\n\
    - Protected variables and functions may be accessed only by member functions of\
    \ a class and its children.\n- Private variables and functions may be accessed\
    \ only by member functions of a class (excluding children).\n\nWhen you do not\
    \ specify otherwise, variables and functions are public. For code readability,\
    \ you may declare member variables and functions to be with public, but this is\
    \ not necessary.\n\nIn programming large systems, it is usually considered good\
    \ style to make member variables private and provide public functions to set and\
    \ access any variables that users might need. This way, the internal design of\
    \ the class can be subsequently modified and other classes that inherit from the\
    \ class will not need to be modified, they will need to be recompiled."
