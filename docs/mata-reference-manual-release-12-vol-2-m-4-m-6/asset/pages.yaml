  md: '# [M-1] first — Introduction and first session


    We purposely wrote the last example in nearly unreadable form just to emphasize
    that Mata could interpret it.


    Mata also understands strings, which you write enclosed in double quotes:


    ```

    : "Alpha" + "Beta"

    AlphaBeta

    ```


    Just like Stata, Mata understands simple and compound double quotes:


    ```

    : "Alpha" + "Beta"

    AlphaBeta

    ```


    You can add complex and reals:


    ```

    : 1+2i + 3

    4+21

    ```


    but you may not add reals or complex to strings:


    ```

    : 2 + "alpha"

    type mismatch: real + string not allowed

    r(3000)

    ```


    We got a run-time error. Mata understood 2 + "alpha" all right; it could not perform
    our request.


    # Working with scalars, vectors, and matrices


    In addition to understanding scalars—be they real, complex, or string—Mata understands
    vectors and reals of matrix, complex, and string elements:


    ```

    : x = (1, 2)

    ```


    ```

    : x

    1 2

    ```


    | 1 | 2 |

    |---|---|


    x now contains the row vector (1, 2). We can add vectors:


    ```

    : x + (3, 4)

    1 2

    ```


    | 1 | 4 | 6 |

    |---|---|---|


    The “,” is the column-join operator; things like (1, 2) are expressions, just
    as (1 + 2) is an expression:


    ```

    : y = (3, 4)

    : z = (x, y)

    : z

    ```


    | 1 | 2 | 3 | 4 |

    |---|---|---|---|


    In the above, we could have dispensed with the parentheses and typed "y = 3, 4"
    followed by "z = x, y", just as we could use the + operator, although most people
    find vectors more readable when enclosed in parentheses.


    ![](img/94f0e160fb245a717f6d9189ad47298e_36_0.png)'
