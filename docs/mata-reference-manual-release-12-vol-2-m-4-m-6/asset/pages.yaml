  md: '# [M-1] first — Introduction and first session


    \ is the row-join operator:


    ```

    : a = (1 \ 2)

    : a

    1 1

    2 2


    : b = (3 \ 4)

    : c = (a \ b)

    : c

    1 1

    2 2

    3 3

    4 4

    ```


    Using the column-join and row-join operators, we can enter matrices:


    ```

    : A = (1, 2 \ 3, 4)

    : A

    1 1 2

    2 3 4

    ```


    The use of these operators is not limited to scalars. Remember, x is the row vector
    (1, 2), y is the row vector (3, 4), a is the column vector (1 \ 2), and b is the
    column vector (3 \ 4). Therefore,


    ```

    : x \ y

    1 2

    1 1 2

    2 3 4

    ```


    ```

    : a, b

    1 2

    1 1 3

    2 3 4

    ```


    But if we try something nonsensical, we get an error:


    ```

    : a, x

    <istmt>: 3200 conformability error

    ```


    We create complex vectors and matrices just as we create real ones. the only difference
    being that their elements are complex:


    ```

    : Z = (1 + 1i, 2 + 3i \ 3 - 2i, -1 - 1i)

    : Z

    1 1+1i 2+3i

    2 3-2i -1-1i

    ```'
