  md: "# Pointers to variables\n\nTo create a pointer $p$ to a variable, you code\n\
    \n```\np = &varname\n```\n\nFor instance, $X$ is a matrix,\n\n```\np = &X\n```\n\
    \nstores in $p$ the address of $X$. Subsequently, referring to $*p$ and referring\
    \ to $X$ amount to the same thing. That, if $X$ contained a $3 \times 3$ identity\
    \ matrix and you coded\n\n```\n*p = Hilbert(4)\n```\n\nthen after you would find\
    \ that $X$ contained the $4 \times 4$ Hilbert matrix. $X$ and $*p$ are the same\
    \ matrix.\n\nIf $X$ contained $3 \times 3$ identity matrix and you coded\n\n```\n\
    (*p) [2,3] = 4\n```\n\nyou would then find $X[2,3]$ equal to 4.\n\nYou cannot,\
    \ however, point to the interior of objects. That is, you cannot code\n\n```\n\
    p = &X[2,3]\n```\n\nand get a pointer that is equivalent to $X[2,3]$ in the sense\
    \ that you later coded $*p=2$. you would see the change reflected in $X[2,3]$.\
    \ The statement $p = \\&X[2,3]$ is valid, but what it does, we will explain in\
    \ Pointers to expressions below.\n\nBy the way, variables can be sustained by\
    \ being pointed to. Consider the program\n\n```\npointer(real matrix) scalar example(real\
    \ scalar n)\n{\n    real matrix tmp\n    tmp = I(3)\n    return(&tmp)\n}\n```\n\
    \nOrdinarily, variable tmp would be destroyed when example() concluded execution.\
    \ Here, however, tmp's existence will be sustained by the pointer to it. We might\
    \ code\n\n```\np = example(3)\n```\n\nand the result will be create $*p$ containing\
    \ the $3 \times 3$ identity matrix. The memory consumed by that matrix will be\
    \ freed when it is no longer pointed to, which will occur when $p$ itself is freed,\
    \ or, before that, when the value of $p$ is changed, perhaps by\n\n```\np = NULL\n\
    ```\n\nFor a discussion of pointers to structures, [M-2] struct. For a discussion\
