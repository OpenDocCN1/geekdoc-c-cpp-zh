  md: '# [M-2] class — Object-oriented programming (classes) 91


    # Using the super modifier to access the parent''s concept


    The super modifier is a way of dealing with variables and functions that have
    been overriden in subclasses, or said, it is a way of accessing the parent''s
    concept of a variable or function.


    Let T extend and let t be an instance of T. Then t.f() refers to T::f() if the
    function exists, and otherwise to S::f(). t.super.f() always refers to S::f().


    More generally, in a series of inheritance, z.super.f() refers to the parent''s
    concept of f()—the f() the parent would call if super were specified—z.super.f()
    refers to the grandparent''s concept of f(), and so on. For example, let W extend
    V U extend T S.


    ```

    S::f() exists

    T::f() does not exist

    U::f() exists

    V::f() does not exist

    W::f() does not exist

    ```


    Finally, let s be an instance of S, t be an instance of T, and so on. Then calls
    of the form w.f(), w.super.f()..., w.super.super.super.f(), v.f(), v.super.f(),
    and so on, result in execution of


    | | Number of supers specified | 1 2 3 4 |

    |---|---|---|---|---||

    | s. | S::f() | | | |

    | t. | S::f() | | | |

    | u. | U::f() | S::f() | S::f() | | |

    | v. | U::f() | U::f() | S::f() | S::f() | |

    | w. | U::f() | U::f() | U::f() | S::f() | S::f() |


    # Casting back to a parent


    A class instance may be treated as a class instance of a parent by casting. Assume
    U extends S, and let u be an instance of U. Then


    ```

    (class T) u

    ```


    is treated as an instance of T, and


    ```

    (class S) u

    ```


    is treated as an instance of S. ((class T) u) could be used anywhere an instance
    of T is required and ((class S) u) could be used anywhere an instance of S is
    required.


    For instance, assume S::f() is overridden by T::f(). If an instance of U found
    it necessary to call S::f(), one way it could do that would be u.super.super.f().
    Another would be


    ```

    (class S) u.f()

    ```'
