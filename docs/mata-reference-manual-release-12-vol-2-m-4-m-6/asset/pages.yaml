  md: "That is, you may omit or include semicolons at the end of statements. It makes\
    \ no difference. You\neven mix the two styles:\n\n```\nreal scalar foo(real matrix\
    \ A)\n{\n    real scalar i, sum;\n\n    sum = 0;\n    for (i=1; i<=rows(A); i++)\
    \ {\n        sum = sum + A[1,i]\n    }\n    return(sum)\n}\n```\n\n# You cannot\
    \ break a statement anywhere even if you use semicolons\n\nMost languages that\
    \ use semicolons follow the rule that a statement continues up to the semicolon.\n\
    \nMata follows a different rule: a statement continues across lines until it looks\
    \ to be complete, and\nsicolons force the end of statements.\n\nFor instance,\
    \ consider the statement x=b-c appearing in some program. In the code, might appear\n\
    \n```\nx = b -\nc\n```\n\nor\n\n```\nx = b -\nc ;\n```\n\nand, either way, Mata\
    \ will understand the statement to be x=b-c, because the statement could\npossibly\
    \ end at the minus: x=b- makes no sense.\n\nOn the other hand,\n\n```\nx = b\n\
    - c\n```\n\nwould be interpreted by Mata as two statements: x=b and -c x = b looks\
    \ like a completed\nstatement to Mata. The first statement will assign b to x,\
    \ and the second statement will display the\nnegative value of c.\n\nAdding a\
    \ semicolon will not help:\n\n```\nx = b\n- c;\n```\n\nx = b is still, by itself,\
    \ a complete statement. All that has changed is that the second statement ends\n\
    in a semicolon, and that does not matter."
