- img_proc: true
  md: '# [M-2] — Version control


    version provides the solution.


    If you are working interactively, nothing said here matters.


    If you use Mata in do-files or ado-files, we recommend that you set version before
    entering Mata.


    # Recommendations for do-files


    The recommendation for do-files that use Mata is the same as for do-files that
    do not use Mata: specify the version number of the Stata you are using on the
    top line:


    ```

    begin myfile.do

    ...

    version 12

    ...

    end myfile.do

    ```


    To determine the number that should appear after version, type about at the Stata
    prompt:


    ```

    about Stata/SE 12.0

    (output omitted)

    ```


    We are using Stata 12.0.


    Coding version 12 will not benefit us today but, in the future, we will be able
    to rerun our do-file and obtain the same results.


    By the way, a do-file is any file that you intend to execute using: Stata''s do
    or run commands (see [R] do), regardless of the file suffix. Many users (us included)
    save Mata source code in .mata files and type do myfile.mata to compile. .mata
    files are do-files; we include the version line:


    ```

    begin myfile.mata

    version 12

    mata:

    ...

    end myfile.mata

    ```


    # Recommendations for ado-files


    Mata functions may be included in ado-files; see [M 1] ado. In such files, set
    version before entering Mata along with, as usual, setting the version at the
    top of your program:


    ```

    begin myfile.ado

    program myfile

    version 12 \<- as usual

    end

    version 12 \<- new

    mata:

    end end myfile.ado

    ```'
  merge: -1
