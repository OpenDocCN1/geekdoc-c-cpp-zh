  md: "# [M-2] class — Object-oriented programming (classes)\n\n```\nreal matrix V::inverse(...)\n\
    {\n...\n}\nreal scalar V::type(...)\n{\n...\n}\nclass coord scalar V::c(...)\n\
    {\n...\n}\n```\n\nWhen you define member functions, they must be of the same type\
    \ as they were previously declared to be, you may omit exposure (as well as static,\
    \ final, and virtual).\n\n# Default exposure in declarations\n\nVariables and\
    \ functions are public unless explicitly declared otherwise. (They are also not\
    \ static, not final, and not virtual, but that is not part of exposure and has\
    \ nothing to do with this subsection.)\n\nYou may use any of the exposure modifiers\
    \ public, protected, and private, followed by a colon: to create blocks with a\
    \ different default:\n\n```\nclass V {\npublic:\n    real matrix         M\n \
    \   static real scalar  count\n    class coord scalar  c\n    real matrix    \
    \     inverse()\n    class coord scalar  c()\n\nprivate:\n    real scalar    \
    \     type\nprotected:\n    real scalar         type()\n}\n```\n\n# Description\n\
    \nclass provides object-oriented programming, also known as class programming,\
    \ to Mata.\n\nA class is a set of variables or related functions (methods) (or\
    \ both) tied together under one name. Classes may be derived from other classes\
    \ according to inheritance.\n\nLet's look at the details of the example from the\
    \ first page of this entry (under the heading Example):\n\n+   1. First, we created\
    \ a class called coord. When we coded\n    class coord {\n        real scalar\
    \         x, y\n        real scalar         length(), angle()\n}"
