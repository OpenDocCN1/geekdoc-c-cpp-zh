  md: '# [M-1] — How Mata works 37


    At some future date, were you to type

    tryit()


    without first defined the program, Mata would look along the ado-path (see [P]
    sysdir and [U] 17.5 **Where does Stata look for ado-files?** for a file named
    tryit.mo. Finding the file, Mata loads it (so Mata now has the object code and
    executes it in the usual way).


    # Working with object code II:.mlib libraries


    Object code can be saved in .mlib libraries (files) instead of .mo files. .mo
    files contain the object code for one program. .mlib files contain the object
    code for a group of files.


    The first step is to choose a name (we will choose lylib—library names are required
    to start with the lowercase *l*) and create an empty library of that name:


    ```

    : mlib create lylib

    ```


    Once created, new functions can be added to the library:


    ```

    : mlib add lylib tryit()

    ```


    New functions can be added at any time, either immediately after creation or later—even
    much later; see [M-3] **mata mlib.**


    We mentioned when Mata needs to execute a function that it does not find in memory,
    Mata looks for a .mo file of the same name. Before Mata does that, however, Mata
    thumbs through its libraries to see if it can find the function there.


    # The Mata environment


    Certain settings of Mata affect how it behaves. You can see these settings by
    typing mata query at the prompt:


    ```

    : mata query

    ```


    | set matastract | off |

    | set matatum | off |

    | set mataoptimize | on |

    | set favor | space may be space or speed |

    | set matacache | 400 kilobytes |

    | set matolib | lmatabase;lmataopt;lmataado |

    | set matamomfirst | off |


    You can change these settings using mata set; see [M-3] **mata set**. We recommend
    the settings, except when we admit to being partial to mata set matastract on.


    # Reference


    Gould, W. W. 2006. Mata Matters: Precision. Stata Journal 6: 550–560.'
