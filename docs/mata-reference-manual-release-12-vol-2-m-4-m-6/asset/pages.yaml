  md: "# [M-2] class — Object-oriented programming (classes)\n\nFor example.\n\n```\n\
    class S {\n    real matrix             M\n    private real scalar    type\n  \
    \  static real scalar      count\n    class coord scalar      c\n}\n```\n\n# Declaration\
    \ and definition of methods (member functions)\n\nDeclarations are of the\n\n\
    ```\n[exposure] [static] [final] [virtual]\nmatatype name() [ , name() [...]\n\
    ```\n\nFor example.\n\n```\nclass T {\n    real matrix             inverse()\n\
    \    protected real scalar  type()\n    class coord scalar      c\n}\n```\n\n\
    Note that function arguments, even if allowed, are not declared.\n\nMember functions\
    \ (methods) and member variables may share the same names and special meaning\
    \ is attached to the fact. type and c below are variables, and type() and c()\
    \ are functions:\n\n```\nclass U {\n    real matrix             M\n    private\
    \ real scalar    type\n    static real scalar      count\n    class coord scalar\
    \      c\n    real matrix             inverse()\n    protected real scalar  type()\n\
    \    class coord scalar      c\n}\n```\n\nMember functions are defined separately,\
    \ after the class is defined. For example.\n\n```\nclass V {\n    real matrix\
    \             M\n    private real scalar    type\n    static real scalar     \
    \ count\n    class coord scalar      c\n    real matrix             inverse()\n\
    \    protected real scalar  type()\n    class coord scalar      c\n}\n```"
