  md: '# Title


    [M-1] first — Introduction and first session


    # Description


    Mata is a component of Stata. It is a matrix programming language that can be
    used interactively or as an extension for do-files and ado-files. Thus


    +   1. Mata can be used by users who know in matrix terms and perform (not necessarily
    simple) matrix calculations interactively, and

    2. Mata can be used by advanced Stata programmers who want to add features to
    Stata.

    Mata has something for everybody.


    Primary features of Mata are that it is fast and fast that it is C-like.


    # Remarks


    This introduction is presented under the following headings:


    +   Invoking Mata

    Using Mata

    Making mistakes: Interpreting error messages

    Working with real numbers, complex numbers, and strings

    Working with scalars, vectors, and matrices

    Working with functions

    Distinguishing real and complex values

    Working with matrix and scalar functions

    Performing element-by-element calculations: Colon operators

    Writing programs

    More functions

    Mata environment commands

    Exiting Mata


    If you are reading the entries in the order suggested in [M-0] intro, see [M-1]
    interactive next.


    # Invoking Mata


    To enter Mata, type mata at Stata’s dot prompt and press enter: to exit Mata,
    type end at Mata’s colon prompt:


    ```

    mata (type end to exit) — ← type mata to enter Mata

    : 2 + 2 ← type Mata statements at the colon prompt

    4

    : end ← type end to return to Stata

    - ← you are back to Stata

    ```'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# [M-1] first — Introduction and first session 19


    # Using Mata


    When you type a statement into Mata, Mata compiles what you typed and, if it compiled

    error, executes it:


    ```

    : 2 + 2

    4

    -

    ```


    When you typed 2 + 2, a particular example from the general class of expressions.
    Mata responded with 4,

    the evaluation of the expression.


    Often when you type are expressions, although you will probably choose more complicated
    examples.

    When an expression is not assigned to a variable, the result of the expression
    is displayed. Assignment

    is performed by the : operator:


    ```

    : x = 2 + 2

    : x

    4


    ```


    When "x = 2 + 2", the expression is evaluated and stored in the variable we just
    named x.

    The result is not displayed. We can look at the contents of x, however, by simply
    typing "x". FromnMata''s perspective, x is not only a variable but also a simpler
    one. Just as

    2 + 2 says to load 2, load another 2, and add them, the expression x says to load
    x and stop there.


    As an aside, Mata distinguishes uppercase and lowercase. X is not the same as
    x:


    ```

    : X = 2 + 3

    : x

    4

    : X

    5

    -

    ```


    # Making mistakes: Interpreting error messages


    If you make a mistake, Mata complains, and then you continue on your way. For
    instance,


    ```

    : 2,,3

    invalid expression

    r(3000);

    -

    ```


    2,,3 makes no sense to Mata, so Mata complained. This is an example of what is
    called a compile-time

    error; Mata could not make sense out of what you typed.


    The other kind of error is a run-time error. For example, we have no variable
    y. Let us

    ast Mata to show us the contents of y:


    ```

    : y

    <istmtt>: 3499 y not found

    -

    ```'
  merge: -1
