  md: '# Diagnostics


    All operators return missing when arguments are missing.


    a*b with a: $k \times 0$ and $b: 0 \times m$ returns missing $a \times m$ matrix
    of zeros.


    a/b returns missing when $b==0$ or when $a/b$ would result in overflow.


    $a^b$ returns a real when both $a$ and $b$ are real; thus, $(-4)^.5$ evaluates
    to missing, whereas $(-4+0i)^.5$ evaluates to 21.


    $a^b$ returns missing on overflow.


