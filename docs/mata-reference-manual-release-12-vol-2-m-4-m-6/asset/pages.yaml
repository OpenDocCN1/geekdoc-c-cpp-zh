  md: '# [M-2] pragma — Suppressing warning messages


    In the above, function st_view() (see [M-5] st_view()) defines V, but the compiler
    does not know that.


    The warning message causes no problem, but if you wish to suppress it, change
    the code to


    ```

    : function unotproblem(real matrix a, real scalar j)

    > {

    >   real matrix V

    >   pragma unset V

    >   st_view(V, ...)

    >   ...\n> }

    ```


    pragma unset V states that you know V is unset and that, for warning messages,
    the compiler should act as if V were set at this point in your code.


    # pragma unused


    The pragma


    ```

    pragma unused X

    ```


    suppresses the warning messages


    ```

    note: argument X unused

    note: variable X unused

    note: variable X set but not used

    ```


    The pragma has no effect on the resulting compiled code.

    entionally unused variables most often arise with respect to function arguments.
    You code


    ```

    : function resolve(A, B, C)

    > {

    >   ...

    >   pragma unused C

    >   ...

    > }

    ```


    note: argument C unused


    and you know well that you are not using C. You include the unnecessary argument
    because you are attempting to fit into a standard or you know that, later, you
    may wish to change the function to include C. To suppress the warning message,
    change the code to read


    ```

    : function resolve(A, B, C)

    > {

    >   ...

    >   pragma unused C

    >   ...

    > }

    ```


    The pragma states that you know C is unused and, for the purposes of warning messages,
    the compiler should act as if C were used at this point in your code.'
