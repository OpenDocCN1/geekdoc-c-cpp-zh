  md: "# [M-1] first — Introduction and first session 23\n\nSimilarly, we can create\
    \ string vectors and matrices, which are vectors and matrices with string elements:\n\
    \n: S = (\"1st element\", \"2nd element\" \\\"another row\", \"last element\"\
    )\n\n| | |\n|---|---|\n| 1 | ist element 2nd element |\n| 2 | another row last\
    \ element |\n\nFor strings, the individual elements can be up to 2,147,483,647\
    \ characters.\n\n# Working with functions\n\nMata expressions also include functions:\n\
    \n```\n: sqrt(4)\n  2\n: sqrt(-4)\n```\n\nWhen we ask for the square root of -4,\
    \ Mata replies \".\" Further, . can be stored just like any other number:\n\n\
    ```\n: findout = sqrt(-4)\n: findout\n```\n\n> \" means missing, there is no answer\
    \ to our calculation. Taking the square root of a negative number is not an error,\
    \ it merely produces missing. To Mata, missing is a number like any other number,\
    \ and the rules for all the operators have been generalized to understand missing.\
    \ For instance, the addition rule is generalized such that missing plus anything\
    \ is missing:\n\n```\n: 2 +\n```\n\nStill, it should surprise you that Mata produced\
    \ missing for the sqrt(-4). We said that Mata understands complex numbers, so\
    \ should not the answer be 2i? If you are working on the complex plane, but otherwise,\
    \ missing is probably a better answer. Mata attempts to intuit the kind of answer\
    \ you want by context, and in particular, uses inheritance rules. If you ask for\
    \ the square root of a real number, you get a real number back. If you ask for\
    \ the square root of a complex number, you get a complex number back:\n\n```\n\
    : sqrt(-4 + 0i)\n  21\n```\n\nHere complex means multipart: -4 + 0i is a complex\
    \ number, it merely happens to have 0 imaginary part. Thus:\n\n```\n: areal =\
    \ -4\n: acomplex = -4 + 0i\n: sqrt(areal)\n\n: sqrt(acomplex)\n  21\n```"
