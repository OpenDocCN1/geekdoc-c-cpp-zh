  md: '# Passing arguments to Mata functions


    In designing a subroutine, you have two paramount interests: how you get data
    into your subroutine

    how you get results back. You get data in the values you pass as the arguments.
    For calcsum().

    we called the subroutine by coding


    ```

    mata: calcsum("varlist", "touse")

    ```


    After macro expansion, that line turned into something like


    ```

    mata: calcsum("mpg", "__0001dc")

    ```


    The __0001dc variable is a temporary created by the marksample command earlier
    in our

    -file. mpg was the variable used by the user. After expansion, the arguments were
    nothing

    more strings, and those strings were passed to calcsum().


    Macro substitution is the most common way values are passed to Mata subroutines.
    If we had a Mata

    function add(a, b), which could add numbers, we might code in our ado-file


    ```

    mata: add(''x'', ''y'')

    ```


    and, if macro ''x'' contained 2 and macro ''y'' contained 3, Mata would see


    ```

    mata: add(2, 3)

    ```


    and values 2 and 3 would be passed to the subroutine.


    When you are writing your Mata subroutine, the arguments your ado-file will find
    convenient

    to pass and Mata will make convenient to use


    +   1. numbers, which Mata calls real scalars, such as 2 and 3 (''x'' and ''y''),
    and

    2. names of variables, macros, scalars, matrices, etc., which Mata calls string
    scalars, such as

    "mpg" and "__0001dc" "varlist" and "touse".


    To receive arguments of type (1), you code real scalar as the type of the argument
    in the function

    declaration and then use the real variable scalar in your Mata code.


    To receive arguments of type (2), you code string scalar as the type of the argument
    in the function

    declaration, and then use one of the State interface functions ([M-4] stata) to
    go

    to the name to the contents. If you receive a variable name, you will especially
    want to read about

    st_data() and st_view() ([M-5] st_view()), although there are

    many other utilities for dealing with variable names. If you are dealing with
    local or global macros,

    scalar, or matrices, you will want to see [M-5] st_local(), [M-5] st_global(),
    [M-5] st_numscalar(),

    and [M-5] st_matrix().


    # Returning results to ado-code


    You have many more choices on how to return results from your Mata function to
    the calling ado-file.


    +   1. You can return results in r()—as we did in our example—or in e() or in
    s().

    2. You can return results in macros, scalars, matrices, etc., whose names are
    passed to your

    Mata subroutine as arguments.

    3. You can handlehandedly reach back into the calling ado-file and return results
    in macros,

    scalar, matrices, etc., whose names are your devising.'
