  md: "# [M-1] ado — Using Mata with ado-files\n\nLet's restructure our ado-file to\
    \ save calcsum() in a .mo file. First, we simply remove calcsum()\nfrom our ado-file,\
    \ so it now reads\n\n```\nprogram varsum\n  version 12\nsyntax varname [if] [in]\n\
    marksample touse\nmata: calcsum(\"varlist\", \"touse\")\ndisplay as txt sum =\
    \ \" as res r(sum)\nend\n```\n\nNext, we enter Mata, enter our calcsum() program,\
    \ and save the object code:\n\n```\n: void calcsum(string scalar varname, string\
    \ scalar touse)\n{\n  real collector x\n  st_view(x, .. varname, touse)\n  st_numcascal(\"\
    r(sum)\", colsum(x))\n}\nmata: mosave calcsum(), dir(PERSONAL)\n```\n\nThis step\
    \ do we only once. The mata mosave command created file calcsum.mo stored in our\n\
    PERSONAL sysdir: see [M-3] mata mosave and [P] sysdir for more details. We put\
    \ the\ncalcsum.mo file in our PERSONAL directory so that Data and Mata would be\
    \ able to find it, just as\nyou probably did with the was.ado-file.\n\nTyping\
    \ in the calcsum() program interactively is too prone to error, so instead what\
    \ we can do\nare a do-file to perform the step and then run the do-file:\n\n```\n\
    version 12\nmata:\nvoid calcsum(string scalar varname, string scalar touse)\n\
    {\n  real collector x\n  st_view(x, .. varname, touse)\n  st_numcascal(\"r(sum)\"\
    , colsum(x))\n}\nmata mosave calcsum(), dir(PERSONAL) replace\nend\n```\n\nWe\
    \ save the do-file someplace in case we need to modify our code later, either\
    \ to fix\nbugs or to add features. For the same reason, we added a replace option\
    \ on the command that\\creates .mo file, so we can run the do-file over again.\n\
    \nTo the third organization—putting our calcsum() subroutine in a library—is just\
    \ a matter\nofodifying varsum.do to do mata mlib add rather than mata mosave.\
    \ See [M-3] mata mlib:\nthere are important details having to do with how you\
    \ will manage all the different functions you\nput in the library, but that has\
    \ nothing to do with our problem here.\n\nWhere and how you store your Mata subroutines\
    \ has nothing to do with what Mata subroutines\ndo or how you use them."
