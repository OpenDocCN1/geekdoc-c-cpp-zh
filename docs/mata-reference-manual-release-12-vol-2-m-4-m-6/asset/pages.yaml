    # A fine distinction


    There is a fine distinction between x[i, j] and x[[i, j]]. In x[i, j], there are
    two arguments: i and j. The comma separates the arguments. In x[[i, j]], there
    is one argument: i, j. The comma is the column-join operator.


    In Mata, comma means mostly the column-join operator:


    ```

    newvec = oldvec, addedvalues

    qsum = (x,1)''(x,1)

    ```


    There are, in fact only two exceptions. When you type the arguments for a function,
    the comma separates one argument from the next:


    ```

    result = f(a,b,c)

    ```


    In the example above, f() receives three arguments: a, b, and c. If we wanted
    f() to receive one argument, (a,b,c), we would have to enclose the calculation
    in parentheses:


    ```

    result = f((a,b,c))

    ```'
