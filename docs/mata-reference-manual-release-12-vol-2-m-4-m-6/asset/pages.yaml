  md: '# [M-2] subscripts — Use of subscripts 199


    That is the first exception. When you type the arguments inside a function, comma
    argument separation. You get back to the usual meaning of comma—the column-join
    operator—by opening another set of parentheses.


    The second exception is in list subscripting:


    ```

    x[i,j]

    ```


    Inside the list-subscript brackets, comma means argument separation. That is why
    you have seen us type vectors inside parentheses:


    ```

    x[(1\2\3), (1,2,3)]

    ```


    These are the two exceptions. Range subscripting is not an exception. Thus in


    ```

    x[i, j]

    ```


    there is one argument, i, j, k. With range subscripts, you may program constructs
    such as


    ```

    IJ = (i,j)

    RANGE = (1,2 \ 4,4)

    x[[IJ]] ... x[[|RANGE|]]

    ```


    You may not do this in way with list subscripts. In particular, x[[IJ]] would
    be interpreted as a request to extract elements i and j from vector x. x[[RANGE]]
    would always be an error.


    We said that list subscripts x[i,j] are a little faster than range subscripts
    x[[i,j]]. That is true, but if IJ=(i,j) already, x[[IJ]] is faster than x[i,j].
    You would, however, to execute millions of references to x[[IJ]] before you could
    measure the difference.


    # Conformability


    ```

    x[i, j]

    ```


    ```

    x: r c

    i: m x or 1 x m (does not matter which)

    j: 1 n or n 1 (does not matter which)

    result: m n

