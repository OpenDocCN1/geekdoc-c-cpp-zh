  md: "# [M-2] exp — Expressions 115\n\nand function calls:\n\n```\nsqrt(2) is an\
    \ expression\n```\n\nEven when functions do not return anything (the function\
    \ is void), the code that causes the function to run is an expression. For instance,\
    \ the function swap() (see [M-5] swap()) interchanges the values of its arguments\
    \ and returns nothing. Even so,\n\n```\nswap(A, B) is an expression\n```\n\n#\
    \ Assignment suppresses display, as does does (void)\n\nThe equal sign assigns\
    \ the result of an expression to a variable. For instance,\n\n```\na = 2 + 3\n\
    ```\n\nassigns 5 to a. When the result of an expression is not assigned to a variable,\
    \ the result is displayed at the terminal. This is true of expressions entered\
    \ interactively and of expressions coded in programs. For instance, given the\
    \ program\n\n```\nfunction example(a, b)\n{\n  \"the answer is\"\na+b\n}\n```\n\
    \nexecuting example() produces\n\n```\n: example(2, 3)\nthe answer is\n5\n```\n\
    \nThe fact that 5 appeared is easy enough to understand; we coded the expression\
    \ a+b without assigning it to another variable. The fact that \"the answer is\"\
    \ also appeared may surprise you. Nevertheless, we coded \"the answer is\" in\
    \ our program, and that is an example of an expression, and because we did not\
    \ assign it to a variable, it was displayed.\n\nIn programming situations, there\
    \ will be times when you want to execute a function—call it setup()—but do not\
    \ care what the function returns, even though the function is not void (that is,\
    \ it returns something). If you code\n\n```\nfunction example(...)\n{\n  setup(...)\n\
    \  ...\n}\n```\n\nthe result will be to display what setup() returns. You have\
    \ two alternatives. You could assign the result of setup to a variable even though\
    \ you would subsequently not use the variable\n\n```\nfunction example(...)\n\
    {\n  result = setup(...)\n  ...\n}\n```"
