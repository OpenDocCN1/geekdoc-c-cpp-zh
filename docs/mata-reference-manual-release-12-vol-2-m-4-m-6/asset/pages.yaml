- img_proc: true
  md: '# Future developments


    Many of the words above are reserved for the future implementation of new features.
    For instance, the words aggregate, array, boolean, byte, etc., currently play
    no role in Mata, but they are reserved.


    You cannot infer much short-run development plans from the presence or absence
    of a word from a list. The list was constructed by including words that would
    be needed to add certain features, but we have erred on the side of reserving
    too many words because it is better to give back a word to take it away later.
    Taking away a word can cause previously written code to break.


    Also, features can be added without reserving words if the word will be used only
    within a specific context. Our original list was much longer, but then we struck
    from it such context-specific words.


    # Version control


    Even if we should need to reserve new words in the future, you can ensure that
    you need not modify your programs by engaging in version control; see [M-2] version.


    # Also see


    +   * [M-1] naming — Advice on naming functions and variables


    +   * [M-2] version — Version control


    +   * [M-2] intro — Language definition'
