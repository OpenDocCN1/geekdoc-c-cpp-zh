  md: '# Title


    # [M-2] pragma — Suppressing warning messages


    # Syntax


    pragma unset varname

    pragma unused varname


    # Description


    pragma informs the compiler of your intentions so that the compiler can avoid
    presenting misleading warning messages and so that the compiler can better optimize
    the code.


    # Remarks


    Remarks are presented under the following headings:

    pragma unset

    pragma unused


    # pragma unset


    The pragma

    pragma unset X

    suppresses the warning message

    note: variable X may be used before code.


    The pragma has no effect on the resulting compiled code.

    In general, the warning message flags logical errors in your program, such as


    ```

    : function problem(real matrix a, real scalar j)

    > {\n> real scalar i

    >

    > j = i

    >

    > ...

    > }

    note: variable i may be used before set

    ```


    Sometimes, however, the message is misleading.


    ```

    : function notproblem(real matrix a, real scalar j)

    > {

    > real matrix V

    >

    > st_view(V, ...)

    >

    > ...

    > }

    note: variable V may be used before set

    ```'
