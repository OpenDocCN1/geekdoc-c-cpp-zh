  md: "# Remarks\n\nRemarks are presented under the following headings:\n\n+   - Notation\
    \ and jargon\n- Declaring and defining a class\n- Saving classes in files\n- Workflow\
    \ recommendation\n- When you need to reconcile\n- Obtaining instances of a class\n\
    - Constructors and destructors\n- Setting member variable and member function\
    \ exposure\n- Making a member final\n- Making a member static\n- Virtual functions\n\
    - Referring to the current class using this\n- Using super to access the parent's\
    \ concept\n- Casting to a parent\n- Accessing external functions from member functions\n\
    - Pointer to classes\n\n# Notation and jargon\n\n:: (double colon):\n\nThe double-colon\
    \ notation is used as a shorthand in documentation to indicate that a variable\
    \ or function is a member of a class and, in two cases, the double-colon notation\
    \ is also syntax that is understood by Mata.\n\nS:: indicates that the variable\
    \ s is a member of class S. S:: is documentation shorthand.\n\nS::f() indicates\
    \ that function f() is a member of class S. S::f() is documentation shorthand.\n\
    S::f() is something Mata itself understands in two cases:\n\n+   1. Notation S::f()\
    \ is used when defining member functions.\n2. Notation S::f() can be used as a\
    \ way of calling static member functions.\n\nan instance of\n\nWhen we write \"\
    let s be an instance of S\" we are saying that s is an instance of class S, or\
    \ equivalently, in some Mata code, s is declared as a class S scalar.\n\nclass\
    \ definition, class declaration\n\nA class definition or declaration is the definition\
    \ of the class, such as the following:\n\n```\nclass S {\n    private real scalar\
    \    a, b\n    real scalar          f(), g()\n}\n```\n\nNote well that the declaration\
    \ of a Mata variable to be of type class S, such as the line S scalar in\n\n```\n\
    void myfunction() {\n{\n    class S scalar  s\n    ...\n}}\n```\n\nis not a class\
    \ definition. It::s is a declaration of an instance of a class."
