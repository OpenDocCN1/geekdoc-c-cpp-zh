  md: '# Mata command


    The Mata command invokes Mata. An istmt is something Mata understands; istmt stands
    for interactive statement of Mata.


    # Remarks


    Remarks are presented under the following headings:


    +   - Introduction

    nThe fine distinction between syntaxes 3 and 4

    The fine distinction between syntaxes 1 and 2


    # Introduction


    For interactive use, use syntax 1. Type mata (no colon), press Enter, and then
    use Mata freely. Type end to return to Stata. (When you exit Mata back into Stata,
    Mata does not clear itself; so if you later type mata-followed-by-enter again,
    you will be right back where you were.)


    For programming use, use syntax 2 or syntax 4. Inside a program or an ado-file,
    you can just call a Mata function


    ```

    program myprog


    mata: utility(''varlist'')


    end

    ```


    and you can even include that Mata function in your ado-file


    ```

    program myprog


    mata: utility(''varlist'')


    end

    mata:

    function utility(string scalar varlist)

    {

    }


    end myprog.ado

    ```


    or you could separately compile utility() and put it in a .mo file or in a Mata
    library.


    # The fine distinction between syntaxes 3 and 4


    Syntaxes 3 and 4 are both single-line syntaxes. You type mata, perhaps a colon:
    and follow with that the Mata istmt.


    The differences between the two syntaxes is whether they allow continuation lines.
    With a colon, no continuation line is allowed. Without a colon, you may have continuation
    lines.


    For instance, let''s consider'
