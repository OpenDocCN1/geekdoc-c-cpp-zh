  md: "# Title\n\n[M-2] — Passing functions to functions\n\n# Syntax\n\nexample(...),\
    \ &somefunction(), ...\n\nwhere example() is coded\n\n```\nfunction example(...,\
    \ f, ...)\n{\n    (*f)(...)\n}\n```\n\n# Description\n\nFunctions can receive\
    \ other functions as arguments.\nBelow is described (1) how to call a function\
    \ that receives a function as an argument and (2) how to write a function that\
    \ receives a function as an argument.\n\n# Remarks\n\nRemarks are presented under\
    \ the following headings:\nPassing functions to functions\nWriting functions that\
    \ receive functions, the simplified'convention\nPassing built-in functions\n\n\
    # Passing functions to functions\n\nSomeone has written a program that receives\
    \ a function as an argument. We will imagine that function is\n\n```\nreal scalar\
    \ fderiv(function(), x)\n```\n\nand that fderiv() numerically evaluates the derivative\
    \ of function() at x. The documentation for fderiv() tells you to write a function\
    \ that takes one argument and returns the evaluation of the function at that argument,\
    \ such as\n\n```\nreal scalar expratio(real scalar x)\n{\n    return(exp(x)/exp(-x))\n\
    }\n```\n\nTo call fderiv() and have it evaluate the derivative of expratio() at\
    \ 3, you code\n\n```\nfderiv(&expratio(), 3)\n```\n\nTo pass a function to a function,\
    \ you code & in front of the function's name and () after. Coding &expratio()\
    \ passes the address of the function expratio() to fderiv()."
