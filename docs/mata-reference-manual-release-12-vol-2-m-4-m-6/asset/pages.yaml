  md: "somefunction(...) returns a 2 × 3 struct twopart. You code\n\n```\nt = somefunction(...)\n\
    ```\n\nand now t contains the 2 × 3 result.\n\nMata function J(r, c, v) returns\
    \ an r × c matrix, every element of which is set to v. So pretend variable tpc\
    \ contains a struct twopart scalar. You code\n\n```\nt = J(2, 3, tpc)\n```\n\n\
    and now t is 2 × 3, every element of which is a copy of tpc. Here is how you might\
    \ do that:\n\n```\nfunction (...) {\n  struct twopart scalar tpc\n  struct twopart\
    \ matrix t\n  ...\n  t = J(2, 3, tpc)\n}\n```\n\nFinally, there is a fourth way\
    \ to create structure vectors and matrices. When you defined\n\n```\nstruct twopart\
    \ {\n  real scalar n1, n2\n}\n```\n\nMata not only recorded the structure definition\
    \ but also created a function named twopart() that returns a struct twopart. thus,\
    \ rather than enduring the rigmarole of creating a matrix from a preallocated\
    \ scalar, you could simply code\n\n```\nt = J(2, 3, twopart())\n```\n\nIn fact,\
    \ the function twopart() that Mata creates for you allows 0, 1, or 2 arguments:\n\
    \n```\ntwopart() returns a 1 × 1 struct\ntwopart(r) returns an r × 1 struct\n\
    twopart(r, c) returns an r × c struct\n```\n\nso you could code\n\n```\nt = twopart(2,\
    \ 3)\n```\n\nor you could code\n\n```\nt = J(2, 3, twopart())\n```\n\nand whichever\
    \ you code makes no difference.\n\nEither way, what is in t? Each element contains\
    \ a separate struct twopart. In each struct twopart, the scalars have been set\
    \ to missing (., \"\", or NULL, as appropriate), the vectors and row vectors have\
    \ been made 1 × 0, the column vectors 0 × 1, and the matrices 0 × 0."
