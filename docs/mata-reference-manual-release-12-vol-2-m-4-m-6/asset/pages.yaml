  md: '# [M-1] first — Introduction and first session


    Here we typed made perfect sense—show y—but y has never been defined. This ugly
    message is called a run-time error message—see [M-2] errors for a complete description—but
    all that''s important to understand the difference between


    ```

    invalid expression

    ```


    and


    ```

    <iostream>: 3499 y not found

    ```


    The run-time message is prefixed by an identity (<iostream> here) and a number
    (3499). Mata is telling us, "I was executing your istream [that''s everything
    you type is called] and I got error 3499, the details of which I was unable to
    find."


    The compile-time error message is of a simpler form: invalid expression. When
    you get such unprefixed error messages, that means Mata could not understand what
    you typed. When you get the more complicated error message, which means Mata understood
    what you typed, but there was a problem performing your request.


    Another way to tell the difference between compile-time errors and run-time errors
    is to look at the return code. Compile-time errors have a return code of 3000:


    ```

    : 2,3

    invalid expression

    r(3000)

    ```


    Run-time errors have a return code that might be in the 3000s, but is never 3000
    exactly:


    ```

    : y

    <iostream>: 3499 y not found

    r(3499)

    ```


    Whether the error is compile-time or run-time, once the error message is issued,
    Mata is ready to continue just as if the error never happened.


    # Working with real numbers, complex numbers, and strings


    As we have, Mata works with real numbers:


    ```

    : 2 + 3

    5

    ```


    Mata also understands complex numbers, you write the imaginary part by suffixing
    a lowercase i:


    ```

    : 1+2i + 4-11i

    5 -9i

    ```


    For imaginary numbers, you can omit the real part:


    ```

    : 1+2i - 2i

    1

    ```


    Whether a number is real or complex, you can use the same computer notation for
    the imaginary part as you would for the real part:


    ```

    : 2.5e+3i

    2500i

    : 1.25e+2+2.5e+3i

    125 + 2500i    /* i.e., 1.25e+02 + 2.5e+031 */

    ```'
