  md: "# Title\n\n [M-0] intro — Introduction to the Mata manual \n\n# Contents\n\n\
    | Section | Description |\n| [M-1] | Introduction and advice |\n| [M-2] | Language\
    \ definition |\n| [M-3] | Commands for controlling Mata |\n| [M-4] | Index and\
    \ guide to functions |\n| [M-5] | Functions |\n| [M-6] | Mata glossary of common\
    \ terms |\n\n# Description\n\nMata is a matrix programming language that can be\
    \ used by those who want to perform matrix calculations interactively and by those\
    \ who want to add new features to Stata.\n\nThis entry describes this manual and\
    \ what has changed since Stata 11.\n\n# Remarks\n\nThis manual is divided into\
    \ six sections. Each section is organized alphabetically, but there is an introduction\
    \ in front of that will help you get around.\n\nIf you are new to Mata, here is\
    \ a helpful reading list. Start by reading\n\n| [M-1] first | Introduction and\
    \ first session |\n| [M-1] interactive | Using Mata interactively |\n| [M-1] how\
    \ | How Mata works |\n\nYou may find other things in section [M-1] that interest\
    \ you. For a table of contents, see\n\n| [M-1] intro | Introduction and advice\
    \ |\n\nWhenever you see a term that you are unfamiliar with, see\n\n| [M-6] Glossary\
    \ | Mata glossary of common terms |"
  merge: -1
  pgno: 18
- img_proc: true
  md: '# [M-0] intro — Introduction to the Mata manual


    Now that you know the basics, if you are interested, you can look deeper into
    Mata’s programming features:


    [M-2] syntax Mata language grammar and syntax


    [M-2] syntax is pretty dense reading, but it summarizes nearly everything. The
    other entries in [M-2] repeat what is said there but with more explanation; see


    [M-2] intro Language definition


    because other entries in [M-2] will interest you. If you are interested in object-oriented
    programming, be sure to use [M-2] class.


    Along the way, you will eventually be guided to sections [M-4] and [M-5]. documents
    Mata’s functions: the alphabetical order makes it easy to find a function if you
    know its name but makes learning what functions are hopeless. That is the purpose
    of [M-4]—to present the functions in logical order. See


