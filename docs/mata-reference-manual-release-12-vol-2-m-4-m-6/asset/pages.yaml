  md: '# Saving structure variables


    Variables containing structures may be saved on disk just as you would save any
    other variable. No special action is required. See [M-3] mata matsave and see
    the function fputmatrix() in [M-5] fopen(). matamatsave and fputmatrix() both
    work with structure variables, although their entries do not mention them.


    # Reference


    Gould, W. W. 2007. Mata Matters: Structures. Stata Journal 7: 556–570.


