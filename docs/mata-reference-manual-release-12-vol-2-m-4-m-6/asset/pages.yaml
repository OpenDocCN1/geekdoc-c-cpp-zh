    This error message should not occur; please notify StataCorp if it does.


    3997. unimplemented opcode


    This error message should not occur; please notify StataCorp if it does.


    3998. stack overflow


    Your program nested too deeply. For instance, imagine calculating the factorial
    of n by recursively calling yourself and then requesting the factorial of 1e+100.
    Functions that call themselves in an infinite loop inevitably cause this error.


    3999. system assertion false


