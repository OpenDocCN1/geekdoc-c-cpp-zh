    \ wherever a matrix is required, but there are a few exceptions, both in low-level\
    \ routines and in routines that wish to write results back to the argument. Here\
    \ a view is not acceptable. If V is the view variable, simply code X = V and pass\
    \ X in the stead. See [M-5] sl_view().\n\n3104. array found where view required\n\
