  md: "# 84 [M-2] class — Object-oriented programming (classes)\n\nIn practice, one\
    \ seldom needs class vectors or matrices. A more typical program would be\n\n\
    ```\nvoid myFunction() {\n    real scalar i\n    class coord scalar v\n    ...\n\
    \    v.x = v.y = 1\n    ...\n}\n```\n\nNote particularly the line class coord\
    \ v. The most common error programmers make is to omit the scalar from the declaration.\
    \ If you do that, then matrix is assumed, and then, rather than v being 1 x 1,\
    \ it will be 0 x 0. If you do omit the scalar, you have two alternatives. Either\
    \ go back and put the word back in, or add the line v = coord() before initializing\
    \ v.x and v.y. It does not matter which one you do. In fact, when you specify\
    \ scalar, the compiler merely inserts the line v = coord() for you.\n\n# Constructors\
    \ and destructors\n\nYou can specify how variables are initialized, and more,\
    \ each time a new instance of a class is created, but before we get to that, let's\
    \ understand the default initialization. In\n\n```\nclass coord {\n    real scalar\
    \ x, y\n    real scalar length(), angle()\n}\n```\n\nthere are two ways. When\
    \ an instance of a class is created, say, because x and y are scalars, b.x and\
    \ b.y will be filled in the usual way. Here, because they are missing. Had they\
    \ been vectors, row vectors, column vectors, or matrices, they would have been\
    \ dimensioned 1 x 0 (vectors and row vectors), 0 x 1 (column vectors), and 0 x\
    \ 0 (matrices).\n\nIf you want to control initialization, you may declare a constructor\
    \ function named new() in your class:\n\n```\nclass coord {\n    real scalar x,\
    \ y\n    real scalar length(), angle()\n    void new()\n}\n```\n\nFunction new()\
    \ must be declared to be void and must take no arguments. You never bother to\
    \ call new()—in fact, you are not allowed to do that. Instead, function new()\
    \ is called automatically each time a new instance of the class is created.\n\n\
    If you wanted every instance of a coord to begin life with x and y equal to 0,\
    \ you could code like\n\n```\nvoid coord::new() {\n    x = y = 0\n}\n```"
