  md: "# [M-2] pragma — Suppressing warning messages\n\nUnused variables can also\
    \ arise, and in general, they should simply be removed,\n\n```\nfunction resin(X,\
    \ Y)\n{\n    real scalar i\n    ...\n    code in which i never appears\n}\n\n\n\
    note: variable i unused\n```\n\nRather than using the pragma to suppress the message,\
    \ you should remove the line real scalar i.\n\nWarnings are also given for variables\
    \ that are set and not used:\n\n```\nfunction thwart(X, Y)\n{\n    real scalar\
    \ i\n    ...\n    i = 1\n    ...\n    code in which i never appears\n}\n\nnnote:\
    \ variable i set but unused\n```\n\nHere you should remove both the real scalar\
    \ i and i = 1 lines.\n\nIt is possible, however, that the set-but-unused variable\
    \ was intentional:\n\n```\nfunction thwart(X, Y)\n{\n    real scalar i\n    ...\n\
    \    i = somefunction(...)\n    ...\n    code in which i never appears\n}\n\n\
    note: variable i set but not used\n```\n\nYou assigned the value of somefunction()\
    \ to i to prevent the result from being displayed. Here you could use pragma unused\
    \ i to suppress the warning message, but a better alternative would be\n\n```\n\
    function thwart(X, Y)\n{\n    (void) somefunction(...)\n    ...\n}\n```\n\nSee\
