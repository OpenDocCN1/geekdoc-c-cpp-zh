  md: '# [M-2] op_logical — Logical operators 149


    The remaining comparison operators >, >=, and <= work differently from == and
    != that they require a and b be p-conformable, if they are not, they abort with
    error. They return true if the corresponding elements have the stated relationship,
    and return false otherwise. If a or b is complex, the comparison is made in terms
    of the length of the complex vector; a>b is equivalent to abs(a)>abs(b), and so
    -3>2+0i is true.


    !a, when a is a scalar, evaluates to 0 if a is not equal to zero and 1 otherwise.
    Applied to a vector or matrix, the same operation is carried out, by element:
    !(-1,0,1,2,..) evaluates to (0,1,0,0,0).


    & and && (and or) may be used with scalars only. Because so many people are familiar
    with programming in the C language, Meta provides && as a synonym for & and ||
    as a synonym for |.


    # Use of logical operators with pointers


    In a pointer expression, NULL is treated as false and all other pointer values
    (address values) are treated as true. Thus the following code is equivalent


    ```

    pointer x               pointer x

    if (x) {                if (x!=NULL) {

    }                                 }

    ```


    The logical operators a==b, a!=b, a&b, and a|b may be used with pointers.


