  md: '```

    struct twopart scalar t

    struct twopart vector t

    struct twopart rowvector t

    struct twopart colvector t

    struct twopart matrix t

    ```


    In a struct twopart matrix, every element of the matrix is a separate structure.
    Say that the matrix were 2 x 3. Then you could refer to any of the following variables:


    ```

    t[1,1].n1

    t[1,2].n1

    t[1,3].n1

    t[2,1].n1

    t[2,2].n1

    t[2,3].n1

    ```


    and similarly for t[i, j].n2.


    If struct twopart also contained a matrix X, then


    ```

    t[i,j].X

    ```


    would refer to the (i,j)th matrix.


    ```

    t[i,j].X[k,l]

    ```


    would refer to the (k, l)th element of the (i,j)th matrix.


    If t is to be a 2 x 3 matrix, you must arrange to make it 2 x 3. After the declaration


    ```

    struct twopart matrix t

    ```


    t is 0 x 0. This result is no different from the situation where t is a real matrix
    and after declaration, t is 0 x 0.


    Whether t is a real matrix or a struct twopart matrix, you allocate t by assignment.
    Let''s pretend that t is a real matrix. There are three solutions to the allocation
    problem:


    +   (1) t = x

    (2) t = somefunction(...)

    (3) t = J(r, c, v)


    All three are so natural that you do not even think of them as allocation; you
    think of them as definition.


    The situation with structures is the same.


    Let''s take each in turn.


    +   1. x contains a 2 x 3 struct twopart. You code


    ```

    t = x

    ```


    and now t contains a copy of x. t is 2 x 3.'
