    # Obtaining instances of a class\n\nDeclaring a class, such as\n\n```\nclass coord\
    \ {\n    real scalar x, y\n    real scalar length(), angle();\n}\n```\n\nin fact\
    \ creates function, coord(). Function coord() will create and return instances\
    \ of the class:\n\n+   - coord()—coord() without arguments—returns a scalar instance\
    \ of the class.\n- coord(3)—coord() with one argument, here 3—returns a 1×3 vector,\
    \ each element of which a separate instance of the class.\n- coord(2,3)—coord()\
    \ with two arguments, here 2—returns a 2×3 matrix, each element of which a separate\
    \ instance of the class.\n\nFunction coord() is useful when using Mata interactively.\
    \ It is the only way to create instances of a class interactively.\n\nIn functions,\
    \ you can create scalar instances by coding class scalar name, but in all cases,\
    \ you will also need to use function coord(). In the following example, the programmer\
    \ wants a vector of coords:\n\n```\nvoid myFunction() {\n    real scalar i\n \
    \   class coord vector v\n    ...\n    v = coord(3)\n    for (i=1; i<=3; i++)\
    \ v[i].x = v[i].y = 1\n}\n```\n\nThis program would have generated a compile-time\
    \ error the programmer omitted the line class coord v. Variable declarations are\
    \ usually optional in Mata, but variable declarations of type class are not optional.\n\
    \nThis program would have generated a run-time error had the programmer omitted\
    \ the line v = coord(3). Because v was declared to be vector, v began as 1×0.\
    \ The first thing the programmer needed to do was to expand v to be 1×3."
