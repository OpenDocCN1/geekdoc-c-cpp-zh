  md: '# Title


    [M-2] subscripts — Use of subscripts


    # Syntax


    ```

    x[real vector r, real vector c]

    x[|real matrix sub|]

    ```


    Subscripts may be used on the left or right of the equal-assignment operator.


    # Description


    Subscripts come in two styles.

    In [subscript] syntax—called list subscripts—an element or a matrix is specified:


    ```

    x[1,2] the 1,2 element of x; a scalar

    x[(1\3\2), (4,5)] the 3×2 matrix composed of rows 1, 3, and 2 and columns 4 and
    5 of x:

    ```


    | $x_{14}$ | $x_{15}$ |

    | $x_{34}$ | $x_{35}$ |

    | $x_{24}$ | $x_{25}$ |


    In [|list|] syntax—called range subscripts—an element or a contiguous submatrix
    is specified:


    ```

    x[[1,2]] the same as x[[1,2]; a scalar

    x[[2,3 \ 4,7]] 3×4 submatrix of x:

    ```


    | $x_{23}$ | $x_{24}$ | $x_{25}$ | $x_{26}$ | $x_{27}$ |

    | $x_{33}$ | $x_{34}$ | $x_{35}$ | $x_{36}$ | $x_{37}$ |

