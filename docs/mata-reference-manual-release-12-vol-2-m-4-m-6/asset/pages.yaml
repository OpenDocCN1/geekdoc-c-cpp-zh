  md: "# Title\n\n```\n[M-2] continue — Continue with next iteration of for, while,\
    \ or do loop\n```\n\n# Syntax\n\n```\nfor, while, or do {\n  ...\n  if (...) {\n\
    \    ...\n    continue\n    ...\n  }\n  ...\n}\n```\n\n# Description\n\ncontinue\
    \ restarts the innermost for. while, or do loop. Execution continues just as if\
    \ the loop had reached its logical end.\ncontinue nearly always occurs following\
    \ an if.\n\n# Remarks\n\nThe following two code fragments are equivalent:\n\n\
    ```\nfor (i=1; i<=rows(A); i++) {\n  for (j=1; j<=cols(A); j++) {\n    if (i==j)\
    \ continue\n    action to be performed on A[i,j]...\n  }\n}\n```\n\nand\n\n```\n\
    for (i=1; i<=rows(A); i++) {\n  for (j=1; j<=cols(A); j++) {\n    if (i!=j) {\n\
    \      action to be performed on A[i,j]...\n    }\n  }\n}\n```\n\ncontinue operates\
    \ on the innermost for or while loop, and even when the continue action is taken,\
    \ standard end-of-loop processing takes place (which is j++ here)."
