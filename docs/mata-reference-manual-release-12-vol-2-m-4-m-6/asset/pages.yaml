    example:


    +   [U] 26 Overview of Stata estimation commands

    [R] regress

    [D] reshape


    The first example is a reference to chapter 26, the second is a reference to the
    regress entry in the Base Reference Manual, and the third is a reference to the
    reshape entry in the Data-Management Reference Manual.


