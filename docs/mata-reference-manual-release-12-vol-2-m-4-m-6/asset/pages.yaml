  md: "# [M-2] class — Object-oriented programming (classes)\n\nspecified that each\
    \ element of a coord stores two real values, which we called x and y. coord also\
    \ contains two functions, which we called length() and angle(). length() and angle()\
    \ are functions of the open and close parentheses at the end of the names, and\
    \ x and y are variables by the absence of parentheses. In the jargon, x and y\
    \ are called member variables, and length() and angle() are called member functions.\n\
    \nThe above, called class's definition, defines a blueprint for the type coord.\n\
    \nA variable that of type coord is called an instance of a coord. Variables b\
    \ and c are instances of coord, although we have not yet explained how you might\
    \ arrange that. Then b.x and b.y would be b's values of x and y, and c.x and c.y\
    \ would be c's values. We could run the functions on the values in b by coding\
    \ b.length() and b.angle(), or on the values in c by coding c.length() and c.angle().\n\
    \n+   2 Next we defined coord's length and angle() functions. The definitions\
    \ are\n\n```\nreal scalar coord:length() {\n    return(sqrt(x^2 + y*2))\n}\n```\n\
    \n```\nreal scalar coord::angle() {\n    return(atan2(y, x)*360/(2*pi()))\n}\n\
    ```\n\nThese functions are similar to regular functions. These functions do not\
    \ happen to take any arguments, but that is not a requirement. It often happens\
    \ that member functions do not require arguments because the functions are defined\
    \ in terms of the class and its concepts. That is exactly what is occurring here.\
    \ The first function says that when someone has an instance of a coord and they\
    \ ask for its length, the square root of the sum of the x and y values, squared.\
    \ The second function says that when someone asks for the angle, the arctangent\
    \ of y and x, multiplied by 360/(2*pi()) to convert the radians to degrees.\n\n\
    +   3 Next we defined another new concept, a rotated_coord, by extending (inheriting\
    \ from) class coord:\n\n```\nclass rotated_coord extends coord {\n    real scalar\
    \ theta\n    real scalar angle()\n    void new()\n}\n```\n\nSo think of a coord\
    \ and read the above as the additions. In addition to x and y of a regular coord,\
    \ a rotated_coord has new variable theta. We also declared that we were adding\
    \ two functions, angle() and new(). But wait, angle() already existed! What we\
    \ are actually saying by explicitly mentioning angle() is that we are going to\
    \ change the definition of angle(). Function new() is indeed new.\n\nNotice that\
    \ we did not previously mention existing function length. Our silence indicates\
    \ that the concept of length remains unchanged.\n\nSo what is rotated_coord? It\
    \ is a coord with the addition of theta, a redefinition of how angle() is calculated,\
    \ and the addition of a function called new()."
