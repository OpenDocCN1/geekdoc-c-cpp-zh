    # Use parentheses


    Because of their relaxed conformability requirements, colon operators are not
    associative even when the underlying operator is. For instance, you expect (a:+b)
    == a+(b:c), at least ignoring numerical rounding error. Nevertheless, (a:+b):c
    == a:(b:+c) does not necessarily hold. Consider what happens


    ```

    a: 1 × 4

    bb: 5 × 1

    c: 5 × 4

    ```


    Then (a:+b):c is an error because a:+b is not c-conformable.


    Nevertheless, a:(b:+c) is not an error and in fact produces a 5 × 4 matrix b:+c
    is 5 × 4, which is c-conformable with a.


    # Conformability


    ```

    a : r1 × c1

    b: r2 × c2, a and b c-conformable

    result: max(r1,r2) × max(c1,c2)

    ```


    # Diagnostics


    The colon operators return missing and abort with error under the same conditions
    that the underlying operator returns missing and abort with error.


