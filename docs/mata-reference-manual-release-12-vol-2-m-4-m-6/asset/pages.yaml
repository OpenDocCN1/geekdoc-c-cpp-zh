  md: '# Title


    [M-3] mata memory — Report on Mata''s memory usage


    # Syntax


    : mata memory


    This command is for use in Mata mode following Mata''s colon prompt. To use this
    command from Stata''s dot prompt, type


    +   - mata: mata memory


    # Description


    mata memory provides a summary of Mata''s current memory utilization.


    # Remarks


    | | # | bytes |

    | autloaded functions | 15 | 5,514 |

    | adof functions | 0 | 0 |

    | defined functions | 0 | 0 |

    | matrices & scalars | 14 | 8,256 |

    | overhead | | 1,972 |

    | total | 29 | 15,742 |


    Functions are divided into three types:


    +   1. Autoloaded functions, which refer to library functions currently loaded
    (and which will be automatically unloaded) from .mlib library files and .mo object
    files.

    2. Ado-functions, which refer to functions whose source appears in ado-files themselves.
    These functions will be cleared when the ado-file is automatically cleared.

    3. Defined functions, which refer to functions that have been either interactively
    or from do-files and will be cleared only when a mata clear, Mata drop, Stata
    clear, or Stata clear all command is executed; see [M-3] mata clear. [M-3] mata
    drop, [D] clear.


    # Also see


    +   - [M-3] limits — Limits and memory utilization

