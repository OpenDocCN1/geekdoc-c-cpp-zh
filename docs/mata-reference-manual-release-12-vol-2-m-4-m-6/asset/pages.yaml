  md: "# 192 [M-2] struct — Structures\n\nYou bind all these variables together in\
    \ one structure:\n\n```\nstruct variables {\n    real scalar method\n    real\
    \ scalar use_numeric_d\n    real vector gradient\n    real scalar iteration\n\
    }\n```\n\nYou design a system with many functions, and some functions calls others,\
    \ but because all the status variables are bound together in one structure, it\
    \ is easy to pass the values from one function to another.\n\nYou also design\
    \ a system that is easy to use. It starts by the user “opening” a problem.\n\n\
    ```\nhandle = maximize_open()\n```\n\nand from that point the user passes the\
    \ handle to the other maximize routines:\n\n```\nmaximize_set_use_numeric_d(handle,\
    \ 1)\nmaximize_set_function_to_max(handle, &myfunc())\nmaximize_maximize_my_function(handle)\n\
    ```\n\n```\nhandle = maximize_open()\n```\n\nand then to pass the handle to the\
    \ other maximize-*() routines. If the user feels that he must explicitly declare\
    \ the handle, you tell him to declare it:\n\n```\ntransmorphic scalar handle\n\
    ```\n\nWhat is the advantage of this secrecy? You can be certain that the user\
    \ never changes any of the values in your struct maxvariables because the compiler\
    \ does not even know what they are.\n\nThus you have made your system more robust\
    \ to user errors.\n\n# Saving compiled structure definitions\n\nYou save compiled\
    \ structure definitions just as you save compiled function definitions; see [M-3]\
    \ mata mosave and [M-3] mata mlib.\n\nWhen you define a structure, such as twoport:\n\
    \n```\nstruct twoport {\n    real scalar n1, n2\n}\n```\n\nthat also creates a\
    \ function, twoport(), that creates instances of the structure.\n\nSaving twoport()\
    \ in a .mo file or in a .mlib library, saves the compiled definition as well.\
    \ Once twoport() has been saved, you may write future programs without bothering\
    \ to define twoport. The definition will be automatically found."
  merge: -1
