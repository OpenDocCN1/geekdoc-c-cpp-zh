    \ forget to enter and exit Mata: \n\nbegin ado-file\n\n```\nprogram mycommand\n\
    ...\ndo-file appears here\n...\nend\nmata:\n  _sololver() code appears here\n\
    end\n```\n\nend ado-file\n\nSharp-eyed readers will notice that we put a colon\
    \ on the end of the Mata command. That's a detail, and why we said it is explained\
    \ in [M-3] mata.\n\nIn addition to loading functions by putting their code in\
