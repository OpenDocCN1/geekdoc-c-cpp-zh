    | | | |

    | 1 | -6.587886358 | |

    | 2 | -1.650029004 | |

    | 3 | 41.67970227 | |


    and let''s form the residuals. define n and k, and obtain s^2,


    ```

    : e = y - Xb

    : n = rows(X)

    : k = cols(X)

    : s2 = (e''e)/(n-k)

    ```


    so we are able to calculate the variance matrix:


    ```

    : V = s2*invsym(X''X)

    : V

    : [symmetric]

