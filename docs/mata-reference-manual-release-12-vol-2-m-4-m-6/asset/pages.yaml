  md: '# Mixed pointer arrays


    You may create mixed pointer arrays, such as


    ```

    R = (&X

    ```


    Here *R[2] is equivalent to f().


    You may not, create arrays of pointers mixed with real, complex, or string elements.
    Mata will abort with a type-mismatch error.


    # Definition of NULL


    NULL is the special pointer value that means "points to nothing" or undefined.
    NULL is like 0 in many ways—for instance, coding if (X) is equivalent to coding
    if (X!=NULL), but NULL is distinct from zero in other ways. O is a numeric value;
    NULL is a pointer value.


    # Use of parentheses


    Use parentheses to make your meaning clear.


    In the table below, we assume


    ```

    p = &X

    P = (&X11

    ```


    where X, X11, X12, X21 are matrices and f(), f11(), f12(), f21(), and f22() are
    functions.


    | Expression | Meaning |

    |---|--- |

    | *p | X |

    | *p[1,1] | X |

    | (*p) | X[1,1] |

    | *P | X12 |

    | (*P[1,2]) [3,4] | X12[3,4] |

    | *q(a,b) | execute function q() of a, b; dereference that |

    | (*q) (a,b) | f(a,b) |

    | (*q[1,1]) (a,b) | f(a,b) |

    | *Q[1,2] (a,b) | nonsense |

    | (*Q[1,2]) (a,b) | f12(a,b) |'
