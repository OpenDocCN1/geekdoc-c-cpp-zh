    ```

    [M-2] if — if (exp) ... else ...

    ```


    # Syntax


    ```

    if (exp) stmt1


    if (exp) stmt1

    else stmt2


    if (exp) {

    stmt1

    }

    else {

    stmt2

    }

    if (exp1) ...

    else if (exp2) ...

    else if (exp3) ...

    ...

    else...

    ```


    where exp, exp1, exp2, exp3, ... must evaluate to real scalars.


    # Description


    if evaluates the expression, and if it is true evaluates to a nonzero number,
    if it executes the statement or statement block that immediately follows it; otherwise,
    it skips the statement or block.


    if ... else evaluates the expression, and if it is true (evaluates to a nonzero
    number), if it executes the statement or statement block that immediately follows
    it and skips the statement or statement block following the else; otherwise, it
    skips the statement or statement block immediately following it and executes the
    statement or statement block following the else.'
