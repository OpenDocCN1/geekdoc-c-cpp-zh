  md: "# [M-2] class — Object-oriented programming (classes)\n\nWe similarly use files\
    \ for creating libraries, such as begin cr_lourlib.do\n\n```\nversion 12\nclear\
    \ mata\ndo coord.mata\ndo anotherfile.mata\ndo yetanotherfile.mata\n/* etc. */\n\
    nmata:\nmata mlib create lourlib, replace\nmata mlib add *()\nend\n```\n\nWith\
    \ the above, it is easy to rebuild libraries after updating code.\n\n# When you\
    \ need to recompile\n\nIf you change a class declaration, you need to recompile\
    \ all programs that use the class. That includes other class declarations that\
    \ need to inherit from the class. For instance, in the opening example. if you\
    \ change anything in the class declaration,\n\n```\nclass coord {\n    real scalar\n\
    \    real scalar length(), angle())\n}\n```\n\neven if the change is so minor\
    \ as to reverse the order of x and y, or to add a new variable or function, you\
    \ must not only recompile all of coord's member functions, you must also recompile\
    \ all functions that use coord, and you must recompile rotated_coord as well,\
    \ because rotated_coord inherited from coord.\n\nYou must do this because Mata\
    \ seriously compiles your code. The Mata compiler reconstructs all of classes\
    \ and uses low-level, execution-time constructs that address the address of every\
    \ member variable and member function. The advantage is that you do not have to\
    \ sacrifice run-time efficiency to have more readable and easily maintainable\
    \ code. The disadvantage is that you must recompile when you make changes in the\
    \ definition.\n\nYou do not need to recompile outside functions that use a class\
    \ if you only change the code of member functions. You do not need to recompile\
    \ if you add or remove member variables or functions.\n\nTo minimize the need\
    \ for recompiling, especially if you are distributing your code to others physically\
    \ from you, you may want to adopt the pass-through approach.\n\nAssume you have\
    \ written line, wonderful functions in Mata that all hinge on object-oriented-programming.\
    \ One class inherits from one and that from another, the one class you need to\
    \ tell your users is class wonderful. Rather than doing that, merely tell your\
    \ users that they should declare a morphic named wonderfulhandle and then just\
    \ have pass wonderfulhandle using your system by making an initialization call:\n\
    \n```\nwonderfulhandle = wonderful_init()\n```"
