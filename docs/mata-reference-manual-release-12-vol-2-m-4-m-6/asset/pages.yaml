  md: '# Title


    [M-1] limits — Limits and memory utilization


    # Summary


    Limits:


    | | Minimum | Maximum |

    | --- | --- | --- |

    | Scalars, vectors, matrices | | |

    | rows | 0 | 2,147,483,647 |

    | columns | 0 | 2,147,483,647 |

    | String elements, length | 0 | 2,147,483,647 |

    | Stata''s matsize plays no role in these limits. | | |


    Size approximations:


    | Memory requirements |

    | real matrices | oh + r*c*8 |

    | complex matrices | oh + r*c*16 |

    | pointer matrices | oh + r*c*8 |

    | string matrices | oh + r*c*8 + total_length_of_strings |


    where r and c represent the number of rows and columns and

    where oh is overhead and approximately 64 bytes


    # Description


    Mata imposes limits, but those limits are of little importance compared with the
    memory requirements

    Mata stores matrices in memory and requests the memory for them from the operating
    system.


    # Remarks


    Mata requests (and returns) memory from the operating system as it needs it, and
    if the operating

    system cannot provide it, Mata issues the following error:


    ```

    : x = foo(A, B)

    foo(): 3900 unable to allocate ..

    <listmt>: — function returned error

    r(3900);

    ```


    Stata''s matsize (see [R] matsize) and Stata''s set min_memory and set max_memory
    values (see

    [D] memory) play no role in Mata or, at least, they play no direct role.


    # Also see


    +   [M-3] mata memory — Report on Mata''s memory usage

    [M-5] minddouble() — Minimum and maximum nonmissing value

    [M-1] intro — Introduction and advice'
