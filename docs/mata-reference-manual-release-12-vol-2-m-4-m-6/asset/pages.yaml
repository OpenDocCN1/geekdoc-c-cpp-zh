  md: '# [M-1] permutation — An aside on permutation matrices and 53


    Permutation vectors also reorder the rows or columns of another matrix, but they
    do it via subscribing. This alternative method of achieving the same end is, computerwise,
    more efficient, in that it uses less memory and less computer time.


    The relationship between the two is shown below.


    # Remarks


    Remarks are presented under the following headings:


    +   - Permutation matrices

    - How permutation matrices arise

    - Permutation vectors


    # Permutation matrices


    A permutation matrix is a square matrix whose rows are a permutation of the identity
    matrix. The following are the full set of all $2 \times 2$ permutation matrices:


    ```

    $$\begin{bmatrix} 1 & 0 \ 0 & 1 \end{bmatrix}$ (1)

    ```


    ```

    $$\begin{bmatrix} 0 & 1 \ 1 & 0 \end{bmatrix}$ (2)

    ```


    Let $P$ be an $n \times n$ permutation matrix. If $n \times m$ matrix $A$ is premultiplied
    by $P$, the result is to reorder its rows. For example,


    ```

    $P * A = PA\n$\begin{bmatrix} 0 & 1 & 0 \ 0 & 0 & 1 \ 1 & 0 & 0 \end{bmatrix}
    * \begin{bmatrix} 1 & 2 & 3 \ 4 & 5 & 6 \ 7 & 8 & 9 \end{bmatrix} = \begin{bmatrix}
    4 & 5 & 6 \ 7 & 8 & 9 \ 1 & 2 & 3 \end{bmatrix}$ (3)

    ```


    Above, we illustrated the reordering using square matrix $A$, but $A$ did not
    have to be square.


    If $m / n$ matrix $B$ is postmultiplied by $P$, the result is to reorder its columns.
    We illustrate with square matrix $A$ again:


    ```

    $A * P = AP\n$\begin{bmatrix} 1 & 2 & 3 \ 4 & 5 & 6 \ 7 & 8 & 9 \end{bmatrix}
    * \begin{bmatrix} 0 & 1 & 0 \ 0 & 0 & 1 \ 1 & 0 & 0 \end{bmatrix} = \begin{bmatrix}
    3 & 1 & 2 \ 6 & 4 & 5 \ 9 & 7 & 8 \end{bmatrix}$ (4)

    ```


    Say that we reorder the rows of $A$ by forming $PA$. Obviously, we can unorder
    the rows by forming $P^{-1}PA$. Because permutation matrices are orthogonal, their
    inverses are equal to their transpose. Thus the inverse of the permutation matrix
    $(0,1,0\0,0,1\1,0,0)$ we have been using $(0,0,1\1,0,0\0,1,0)$. For instance,
    taking our results from (3)'
