  md: '# Arguments argument-passing convention


    Arguments are passed to functions by address, also known as by name or reference.
    They are not passed by value. When you code


    ```

    f(A)

    ```


    it is the address of A that is passed to f(), not a copy of the values in A. f()
    can modify A.

    Most functions do not modify their arguments, but some do. ludA(A, L, U, p), for
    instance, calculates the LU decomposition of A. The function replaces the contents
    of L, U, and p with matrices such that L[p,:]=A.


    Oldtimers will have heard of the FORTRAN program which called a subroutine and
    passed it a second argument. Unbeknown to it, the subroutine changed its argument,
    with the result that the constant changed throughout the rest of his code. That
    cannot happen in Mata. When an expression is passed as an argument (and constants
    are expressions), a temporary variable containing the evaluation is passed to
    the function. Modifications to the temporary variable are irrelevant because the
    temporary variable is discarded once the function returns. If f() modifies its
    argument and you call it by f(A,2), because 2 is copied to a temporary variable,
    the value of the literal 2 will remain unchanged on the next call.


    If you call a function with an expression that includes the assignment operator,
    it is the left-hand side of the expression that is passed. That is, coding


    ```

    f(a, b=c)

    ```


    has the result as coding


    ```

    b = c

    f(a, b)

    ```


    If f() changes its second argument, it will be b and not c that is modified.


    Also, Mata attempts to create unnecessary copies of matrices. For instance, consider


    ```

    function changarg(x) x[1,1] = 1

    ```


    changarg(mymat) changes the 1,1 element of myat to 1. Now let us define


    ```

    function cp(x) return(x)

    ```


    Coding changarg(mymat) would still change myat because cp() returned x itself.
    On the other hand, if we defined cp() as


    ```

    function cp(x)

