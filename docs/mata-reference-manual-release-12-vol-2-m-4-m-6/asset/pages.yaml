- img_proc: true
  md: "# Compile-time and run-time versioning\n\nWhat follows is detail. We recommend\
    \ always following the recommendations above.\n\nThere are actually two version\
    \ numbers that matter—the version number set at the time of compilation, which\
    \ affects how the source code is interpreted, and the version of the libraries\
    \ used to supply subroutines at the time of execution.\n\nThe version command\
    \ that we used in the previous sections is in fact Stata's version command [see\
    \ [P] version], and it sets both versions:\n\n```\nversion 12\nmata:\n  function\
    \ example()\n  {\n    \n  end\n```\n\nIn the above, we compile example() using\
    \ the version 12 syntax of the Mata language, and any functions example() calls\
    \ will be the version 12 of those functions. Setting version 12 before entering\
    \ Mata ensured all of that.\n\nIn the following example, we compile using version\
    \ 12 syntax and use version 12.2 functions:\n\n```\nversion 12\nmata:\n  function\
    \ example()\n  {\n    version 12.2\n    ...\n  end\n```\n\nIn the following example,\
    \ we compile using version 12.2 syntax and use version 12 functions:\n\n```\n\
    version 12.2\nmata:\n  function example()\n  {\n    version 12\n    ...\n  end\n\
    ```\n\nIt is, however, very rare that you will want to compile and execute at\
    \ different version levels.\n\n# Also see\n\n+   - [M-5] callersversion() — Obtain\
    \ version number of caller\n- [M-2] intro — Language definition"
  merge: -1
