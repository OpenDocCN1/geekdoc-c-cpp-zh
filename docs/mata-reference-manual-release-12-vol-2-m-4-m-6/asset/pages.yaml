    \ i++) pvec[i] = &(J(5, 5, .))\n```\n\n# Pointers to functions\n\nWhen you code\n\
    \n```\np = &functionname\n```\n\nthe address of the function is stored in p. You\
    \ can later execute the function by coding\n\n> ... (*p)(..)\n\nDistinguish carefully\
    \ between\n\n```\np = &functionname\n```\n\nand\n\n```\np = &(functionname())\n\
