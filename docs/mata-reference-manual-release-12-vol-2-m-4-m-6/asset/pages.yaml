    \    }\n    printf(\"done\\n\")\n}\n```\n\nand run example(3), example(2), example(1),\
    \ example(0), and example(-1).\n\nOne common use of while is to loop until convergence:\n\
    \n```\nwhile (reldif(a, lasta)>1e-10) {\n    lasta = a\n    a = ...\n}\n```"
