  md: '# [M-3] mata mlib — Create function library 235


    mata mlib create creates a new, empty library.


    mata mlib add new members to a library.


    mata mlib index causes Mata to build a new list of libraries to be searched.

    mata mlib query lists the libraries to be searched.

    A may contain up to 1,024 functions by default.


    # Options


    dir(path) specifies the directory (folder) into which the file should be written.
    dir(.) is the default, meaning that if dir() is not specified, the file is written
    in the current (working) directory. path may be a directory name or be the sysdir
    shorthand STATA, UPDATES, BASE, SITE, PLUS, PERSONAL, or OLDPLACE; see [P] sysdir,
    dir(PERSONAL) is recommended.

    complete is for use when saving classes. It specifies that the definition be saved
    only if it is complete; otherwise, an error message will be issued. See [M-2]
    class.

    replace specifies that the file may be replaced if it already exists.


    size(#). With mlib create, specifies the maximum number of members of the newly
    created library will be able to contain, 2 ≤ # ≤ 2048. The default is size(1024).


    # Remarks


    +   Remarks are presented under the following headings:


    Background

    Outline of the procedure for dealing with libraries

    Creating a mlib library

    Adding members to a .mlib library

    Listing the contents of a library

    Making it so Mata knows to search your libraries

    Advice on organizing your source code


    Also see [M-1] how for an explanation of object code.


    # Background


    .mlib files contain the object code for one or more functions. Functions which
    happen to be stored in libraries are called library functions, and Mata''s library
    functions are also stored in .mlib libraries. You can create your own libraries,
    too.


    Mata provides two ways to store object code:


    +   1. In a .mo file, which contains the code for one function

    2. In a .mlib library file, which may contain the code for up to 500 functions


    .mlib files are easier to use and just as well as .mlib libraries; see [M-3] mata
    save, .mlib libraries, however, are easier to distribute to others when you have
    many functions, because they are combined into one file.'
  merge: -1
  pgno: 250
- img_proc: true
  md: '# Outline of the procedure for dealing with libraries


    Working with libraries is easy:


    +   - First, choose a name for your library. We will choose the name l1personal.

    - Next, create an empty library by using the mata mlib create command.

    - After that, you can add new members to the library at any time, using mata mlib
    add.


    .mlib libraries contain object code, not the original source code, so you need
    to keep track of the source code yourself. Also, if you want to update the object
    code in a function there you must recreate the entire library; there is no way
    to replace or delete a member once it is added.


    We begin by showing the mechanical steps, and then we will tell you how we manage
    libraries and source code.


    # Creating a .mlib library


    If you have not read [M-3] mata mosave, please do so.


    To create a new, empty library named l1personal.mlib in the current directory,
    type


    ```

    mata mlib create l1personal

    file l1personal.mlib created

    ```


    If l1personal.mlib already exists and you want to replace it, either erase the
    existing file first or type


    ```

    mata mlib create l1personal, replace

    file l1personal.mlib created

    ```


    To create a new, empty library named l1personal.mlib in your PERSONAL (see [l|1]
    sysdir) directory,


    ```

    mata mlib create l1personal, dir(PERSONAL)

    file c:\ado\personal\l1personal.mlib created

    ```


    or


    ```

    mata mlib create l1personal, dir(PERSONAL) replace

    file c:\ado\personal\l1personal.mlib created

    ```


    # Adding members to a .mlib library


    Once a library exists, whether you have just created it and it is empty, or it
    already exists and contains some functions, you can add new functions to it by
    typing


    ```

    mata mlib add libnameM()

    ```


    So, if we wanted to add function example() to library l1personal.mlib, we would
    type


    ```

    mata mlib add l1personal example()

    (1 function added)

    ```'
  merge: -1
  pgno: 251
- img_proc: true
  md: "In doing this, we do not have to say where lpersonal.mlib is stored; Mata searches\
    \ for it along\nthe ado-path.\n\nBefore you can add example() to the library,\
    \ however, you must compile it:\n\n```\n: function example(...)\n{\n  ...\n}\n\
    \n: mata mlib add lpersonal example()\n(1 function added)\n```\n\nYou can add\
    \ many functions to a library in one command:\n\n```\n: mata mlib add lpersonal\
    \ example2() example3()\n(2 functions added)\n```\n\nYou can add all the functions\
    \ currently in memory by typing\n\n```\n: mata mlib add another *()\n(3 functions\
    \ added)\n```\n\nIn the above example, we added to another.mlib because we had\
    \ already added example(),\nexample2(), and example3() to lpersonal.mlib and trying\
    \ to add them again would result in\nan error. (Before adding *), we could verify\
    \ that we are adding what we want to add by typing\nmata describe *); see [M-3]\
    \ mata describe.)\n\n# Listing the contents of a library\n\nOnce a library exists,\
    \ you can list its contents (the names of the functions it contains) by typing\n\
    \n```\n: mata describe using libname\n```\n\nHere we would type\n\n```\n: mata\
    \ describe using lpersonal\n(library contains 3 members)\n```\n\n| bytes | type\
    \ | name and extent |\n|--- |--- |--- |\n| 32 | auto transmorphic matrix | example()\
    \ |\n| 32 | auto transmorphic matrix | example2() |\n| 32 | auto transmorphic\
    \ matrix | example3() |\n\nmata describe lists the contents of memory, but mata\
    \ describe using lists the\nof a library.\n\n# Making it so Mata knows to search\
    \ your libraries\n\nMata automatically finds .mlib libraries on your computer.\
    \ It does this when Mata is invoked\nfor the first time during a session. Everything\
    \ is automatic except that Mata will know knowing\nabout any new libraries created\
    \ during the Stata session, so after creating a new library, you must\ntell Mata\
    \ about it. You do this by asking Mata to rebuild its library index:\n\n```\n\
