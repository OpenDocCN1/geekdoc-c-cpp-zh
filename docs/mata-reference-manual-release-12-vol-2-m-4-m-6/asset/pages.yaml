  md: "# [M-2] class — Object-oriented programming (classes) 85\n\nLet's assume we\
    \ do that and we inherit from coord when creating the new class rotated_coord,\
    \ just as shown in the first example.\n\n```\nclass rotated_coord extends coord\
    \ {\n    real scalar theta\n    real scalar angle()\n    void new()\n}\nvoid rotated_coord::new()\
    \ {\n    theta = 0\n}\n```\n\nWhen we create an instance of rotated_coord, all\
    \ the variables were initialized to 0. That is, function rotated_coord() will\
    \ know to call both coord::new() and rotated_coord::new(), and it will call them\
    \ in that order.\n\nIn your new function, you are not limited to initializing\
    \ values. new() is a function and you can code whatever you want, so if you want\
    \ to set up a link to a radio telescope and check for any incoming messages, you\
    \ can do that. Closer to home, if you were implementing a file system, you might\
    \ use a static variable to count the number of open files. (We will explain static\
    \ member variables later).\n\nOn the other side of instance creation—instance\
    \ destruction—you can declare and create void destroy(), which also takes no arguments,\
    \ to be called each time an instance is destroyed. destroy() is known as a destructor.\
    \ destroy() works like new() in the sense that you are not allowed to call the\
    \ function directly. Mata calls destroy() for whenever Mata is releasing the memory\
    \ associated with an instance. destroy() does not serve much in Mata, in Mata,\
    \ memory management is automatic and the freeing of memory is not your responsibility.\
    \ In some other object-oriented programming languages, such as C++, you are responsible\
    \ for memory management, and the destructor is where you free the memory associated\
    \ with the instance.\n\nStill, there is an occasional use for destroy() in Mata.\
    \ Let's consider a system that needs to count the number of instances of itself\
    \ that exists, perhaps so it can release a resource when the instance count goes\
    \ to 0. Such a system might, in part, read\n\n```\nclass bigsystem {\n    static\
    \ real scalar counter\n    void new(), destroy()\n}\nvoid bigsystem::new() {\n\
    \    counter = (counter== ? 1 : counter+1)\n}\nvoid bigsystem::destroy() {\n \
    \   counter--\n}\n```"
