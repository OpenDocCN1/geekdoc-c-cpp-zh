  md: "[M-2] ftof — Passing functions to functions 123\n\n# Writing to functions,\
    \ the simplified convention\n\nTo receive a function, you include a variable among\
    \ the program arguments to receive the function—we will use f and then you code\
    \ (*f) (...) to call the passed function. The code for fderiv() might read\n\n\
    ```\nfunction fderiv(f, x)\n{\n  return ((*f)(x+1e-6) - (*f)(x)) / 1e-6\n}\n```\n\
    \nor, if you prefer to be explicit about your declarations,\n\n```\nreal scalar\
    \ fderiv(pointer scalar f, real scalar x)\n{\n  return ((*f)(x+1e-6) - (*f)(x))\
    \ / 1e-6\n}\n```\n\nor, if you prefer to be even more explicit:\n\n```\nreal scalar\
    \ fderiv(pointer(real scalar function) scalar f\n{\n  return ((*f)(x+1e-6) - (*f)(x))\
    \ / 1e-6\n}\n```\n\nIn any case, using pointers, you type (*f)... to execute the\
    \ function passed. See [M-2] pointers for more information.\n\nAside: the function\
    \ fderiv() would work but, because of the formula it uses, would return very inaccurate\
    \ results.\n\n# Passing built-in functions\n\nYou cannot pass built-in functions\
    \ to other functions. For instance, [M-5] exp() is built in, which is revealed\
    \ by [M-3] mata which:\n\n```\n: mata which exp()\nexp(): built-in\n```\n\nNot\
    \ all official functions are built in. Many are implemented in Mata as library\
    \ functions, but exp() is built in and coding &exp() will result in an error.\
    \ If you wanted to pass exp() to a function, create your own version of it\n\n\
    ```\n: function myexp(x) return(exp(x))\n```\n\nand then pass &myexp().\n\n# Also\
    \ see\n\n[M-2] intro — Language definition"
