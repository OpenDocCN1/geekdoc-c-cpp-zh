  md: "or you could cast the result of the function to be void:\n\n```\nfunction example(...)\n\
    {\n    (void) setup(...)\n    ...\nn\n```\n\nPlacing (void) in front of an expression\
    \ prevents the result from being displayed.\n\n# The pieces of an expression\n\
    \nExpressions comprise\n\n+   - numeric literals\n- string literals\n- variable\
    \ names\n- operators\n- functions\n\n# Numeric literals\n\nNumeric literals are\
    \ just numbers\n\n+   - 2\n- 3.14159\n- -7.2\n- 5i\n- 1.213e+32\n- 1.213E+32\n\
    - 1.921fb54442d18X+001\n- 1.921fb54442d18X+001\n- .a\n- .b\n\nbut you can suffix\
    \ an i to the end to mean imaginary, such as 5i above. To create complex numbers,\
    \ you combine real and imaginary numbers using the + operator, as in 2+5i. In\
    \ any case, you can put the i on the end of any literal, such as 1.213e+32 is\
    \ valid, or as 1.921fb54442d18X+001i.\n\n1.921fb54442d18X+001 is a formidable-looking\
    \ beast, with or without the i.\n1.921fb54442d18X+001 is a way of writing floating-point\
    \ numbers in binary; it is described in [U] **12.5 Formats: Controlling how data\
    \ are displayed.** Most people never use it.\n\nAlso, numeric literals include\
    \ Stata's missing values, .a, .b, ..., .z.\n\nComplex variables may contain missing\
    \ just as real variables, but they may get only one: .a.bi is not allowed. A complex\
    \ variable contains a valid complex value, or if it contains .a, .b, ..., .z."
