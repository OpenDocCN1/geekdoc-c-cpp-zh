  md: "# [M-2] class — Object-oriented programming (classes)\n\nclass instance, instance,\
    \ class A instance\n\nA class instance is a variable defined according to a class\
    \ definition. In the code\n\n```\nvoid myfunction()\n    class S Scalar s\n  \
    \  real scalar b\n    ...\n```\n\ns is a class instance, or more formally, an\
    \ instance of class S. The term \"instance\" can be used with all element types,\
    \ not just with classes. Thus b is an instance of a real. The term \"instance\"\
    \ is more often used with classes and structures, however, because one needs to\
    \ distinguish definitions of variables containing classes or structures from the\
    \ definitions of the classes and structures themselves.\n\ninheritance, extends,\
    \ subclass, parent, child\nInheritance is the property of one class definition\
    \ using the variables and functions of another just as if they were their own.\
    \ When a class does, it is said to extend the other class. T extending means as\
    \ T inheriting from S. T is also said to be a subclass of S.\n\nConsider the following\
    \ definitions:\n\n```\nclass S {\n    real scalar a, b\n    real scalar f()\n\
    }\nclass T extends S {\n    real scalar c\n    real scalar\n}\n```\n\nLet s be\
    \ an instance of S and t an instance of T. It is hardly surprising that s.a, s.b,\
    \ s.f(), t.c., and t.g() exist, because each is explicitly declared. It is because\
    \ of inheritance that t.a., t.b., and t.f() also exist, and yet with no additional\
    \ code being written.\n\nIf U extends S, then U is said to be a child of T and\
    \ be a child of S, although formally U is the grandchild of S. Similarly, both\
    \ S and T are said to be parents of U; although it is sufficient to link the relationship\
    \ parent/child without going into details.\n\n# external functions\n\nAn external\
    \ function is a regular function, such as sqrt(), sin(), and myfunc(), defined\
    \ outside of the class, and out of all classes. The function could be a function\
    \ provided by Mata (such as sqrt() or sin()) or it could be a function you have\
    \ written, such as myfunc().\n\nAn issue arises when calling external functions\
    \ from the inside of a member function. When coding a member function, references\
    \ as sqrt(), sin(), and myfunc() are assumed to be references to the class's member\
    \ functions if a member function of the name exists. If one wants to ensure that\
    \ the external-function interpretation is made, one codes ::sqrt(), ::sin(), and\
    \ ::myfunc(). Accessing external functions from member functions below.\n\n![](img/94f0e160fb245a717f6d9189ad47298e_93_0.png)"
