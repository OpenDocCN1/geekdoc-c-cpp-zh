    \ a class instance. For instance, equivalent to coding ex1.f(3) or ex2.f(3) is\
    \ S::f(3).\n\n# Virtual functions\n\nWhen a function is declared to be virtual,\
    \ the rules of inheritance act as though when one class inherits from another,\
    \ the child class does not define a function, then it inherits the parent's function.\
    \ For virtual functions, however, the parent has access to the child's definition\
    \ of the function, which is why we say that it, in some sense, reverse inheritance.\n\
    \nThe canonical motivational example of this deals with animals. Without loss\
    \ of generality, we will use barely animals to illustrate. A class, animal, is\
    \ defined. Classes cow and sheep are defined that extend (inherit from) animal.\
    \ One of the functions defined in animals need to make the sound of the specific\
    \ animal, and it calls virtual sound() to do that. At the animal level, function\
    \ animal::sound() is defined to display \"Squeak!\" Because function sound() is\
    \ virtual, however, each of the specific-animal classes is supposed to define\
    \ their own sound. Class cow::sound() that displays \"Moo!\" and sheep defines\
    \ sheep::sound() that displays \"Baa!\" The result is that when an animal calls\
    \ sound(), it behaves as if the inheritance is reversed, the appropriate sound()\
    \ routine is called, and the user sees \"Moo\" or \"Baa!\" If a new species is\
    \ added, and if the programmer forgets to define sound(), then animal::sound()\
    \ will run. and the user sees \"Squeak!\" In this case, that supposed to be the\
    \ sound of the system in trouble, it is really just the default action.\n\nLet's\
    \ code this example. First, we will code the usual case:\n\n```\nclass animal\
    \ {\n\n    void sound()\n    void poke()\n\n}\nvoid animal::sound() { \"Squeak!\"\
    \ }\nvoid animal::poke() {\n\n    sound()\n\n}\nclass cow extends animal {\n\n\
    }\nclass sheep extends animal {\n\n}\n\n```\n\nIn the above example, when an animal,\
    \ cow, or sheep is poked, other things, it emits a sound. Poking is defined at\
    \ the animal level because poking is mostly generic across animals, except for"
