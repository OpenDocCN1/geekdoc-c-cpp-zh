  md: '# [M-1] first — Introduction and first session


    If you ever have a real scalar, vector, or matrix, and want to make it complex,
    use the C() function. which means "convert to complex":


    ```

    sqrt(C(areal))

    21

    ```


    C() is documented in [M-5] C() allows one or two arguments. With one argument,
    it casts to complex two arguments, it makes a complex out of the two real arguments.
    Thus you type


    ```

    sqrt(-4 + 2i)

    .48568272 + 2.05817103i

    ```


    or you could type


    ```

    sqrt(-4, 2))

    .48568272 + 2.05817103i

    ```


    By the way, used with one argument, C() also allows complex, and then it does
    nothing:


    ```

    sqrt(C(complex))

    21

    ```


    # Distinguishing real and complex values


    It is virtually impossible to tell the difference between a real value and a complex
    value with zero imaginary part:


    +   - areal = -4

    - acomplex = -4 + 0i

    - areal

    -4

    - acomplex

    -4


    As you have seen, the difference is important: sqrt(areal) is missing. sqrt(complex)
    is 2i. One solution is the eltype() function:


    +   - eltype(areal)

    real

    - eltype(complex)

    complex


    eltype() can also be used with strings,


    +   - astring = "hello"

    - eltype(astring)

    string


    but this is useful mostly in programming contexts.'
