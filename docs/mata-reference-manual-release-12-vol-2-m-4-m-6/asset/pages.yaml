  md: "# [M-2] struct — Structures\n\nThe syntax of -> is\n\n```\nexp1 -> exp2\n```\n\
    \nwhere exp1 evaluates to a structure pointer and exp2 indexes the structure.\n\
    \n# Operators and functions for use with structure members\n\nAll operators, all\
    \ functions, and all features of Mata work with members of structures. That is,\
    \ given\n\n```\nstruct example {\n    real scalar n\n    real matrix X\n}\nfunction\
    \ ...(...) {\n    real scalar rs\n    real matrix rm\n    struct example ex\n\
    \    ...\n}\n```\n\nthen ex.n and ex.X may be used anywhere rs and rm would be\
    \ valid.\n\n# Operators and functions for use with entire structures\n\nSome operators\
    \ and functions can be used with entire structures, not just the structure's elements.\n\
    Given\n\n```\nstruct mystruct scalar    ex1, ex2, ex3, ex4\nstruct mystruct matrix\
    \    E, F, G\n```\n\n+   1. You may use == and != to test for equality:\n\n```\n\
    if (ex1==ex2) ...nif (ex1!=ex2) ...\n```\n\nTwo structures are equal if their\
    \ members are equal.\nIn the example, struct mystruct itself contains no substructures.\
    \ If it did, the definition of equality would involve checking the equality of\
    \ substructures, sub-substructures, etc.\n\nIn the example, ex1 and ex2 are scalars.\
    \ If they were matrices, each element would be compared, and the matrices would\
    \ be equal if the corresponding elements were equal.\n\n+   2. You may use ==\
    \ and : != to form matrices of equality and inequality.\n\n+   3. You may use\
    \ the comma and backslash operators to form vectors and matrices of structures:\n\
    \n```\nex = ex1, ex2 \\ ex3, ex4\n```\n\n+   4. You may use & to to obtain pointers\
    \ to structures:\n\n```\nptr_to_ex1 = &ex1\n```"
  merge: -1
  pgno: 205
