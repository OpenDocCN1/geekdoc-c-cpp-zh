  md: '# [M-2] op_join — Row- and column-join operators 145


    Picking up where we left off. Mata must allocate a matrix or vector containing
    rows(a)+rows(b) rows(c) rows, then it must copy (a \ b) into the new matrix or
    vector, then it must copy c. Something inefficient just happened: a was copied
    twice!


    Coding


    ```

    res = (a \ b) \ c

    ```


    is convenient, but execution would be quicker if we coded


    ```

    res = J(rows(a)+rows(b)+rows(c), cols(a), .)

    res[1.,] = a

    res[2.,] = b

    res[3.,] = c

    ```


    We do not want to cause concern where none is due. In general, you would not be
    able to measure the difference between the more efficient code and coding res
    = (a \ b) c. But as the number of row or column operators stack up, the combined
    result becomes more and more inefficient. Even that is not much of a concern.
    if the inefficient construction itself is buried in a loop, however, and that
    loop is executed thousands of times, the inefficiency can become important.


    With a little thought, you can always substitute predeclaration using J() (see
    [M-5] J()) and assignment via subscribing.


