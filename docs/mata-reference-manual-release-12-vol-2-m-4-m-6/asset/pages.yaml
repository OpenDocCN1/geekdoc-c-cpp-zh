  md: "# [M-2] semicolons — Use of semicolons\n\nThus remember always to break multiline\
    \ statements at places where the statement could not possibly be interpreted as\
    \ being complete, such as\n\n```\nx = b -\nc + (d\n  + e)\nmyfunction(A,\n   \
    \   B, C,\n)\n```\n\nDo this whether or not you use semicolons.\n\n# Use of semicolons\
    \ to create multistatement lines\n\nSemicolons allow you to put more than one\
    \ statement on a line. Rather than coding\n\n```\na = 2\nb = 3\n```\n\nyou can\
    \ code\n\n```\na = 2 ; b = 3;\n```\n\nand you can even omit the trailing semicolon:\n\
    \n```\na = 2 ; b = 3\n```\n\nWhether you code separate statements on separate\
    \ lines or the same line is just a matter of style; it does not change the meaning.\
    \ Coding\n\n```\nfor (i=1; i<n; i++) a[i] = -a[i]; sum = sum + a[i];\n```\n\n\
    still means\n\n```\nfor (i=1; i<n; i++) a[i] = -a[i]\nsum = sum + a[i];\n```\n\
    \nand, without doubt, the programmer intended to code\n\n```\nfor (i=1; i<n; i++)\
    \ {\n  a[i] = -a[i]\n  sum = sum + a[i]\n}\n```\n\nwhich has a different meaning.\n\
    \n# Significant semicolons\n\nSemicolons are not all style. The syntax for the\
    \ for statement is (see [M-2] for\n\n```\nfor (exp1; exp2; exp3) stmt\n```\n\n\
    Say that the complete for loop that we want to code is\n\n```\nfor (x=init();\
    \ !converged(x); iterate(x))\n```"
