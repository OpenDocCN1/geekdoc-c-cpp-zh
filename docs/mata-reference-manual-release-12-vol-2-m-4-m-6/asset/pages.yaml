  md: "# Accessing external functions from member functions\n\nIn the opening example,\
    \ class coord contained a member function length(). Had we not coding a regular\
    \ (nonclass) function, we could not have created that function with the name length().\
    \ The name length() is reserved by Mata for its own function that returns the\
    \ length (number of elements) of a vector; see [M-5 rows]. We are allowed to create\
    \ a function name length() inside functions. Outside of member functions, c.length()\
    \ is an unambiguous reference to c's definition of length(), and length() by itself\
    \ is an unambiguous reference to length()'s usual definition.\n\nThere is, however,\
    \ possible confusion when coding member functions. Let's add another member function\
    \ to coord: ortho(), for which this code reads\n\n```\nclass coord scalar coord::ortho()\
    \ {\n    class coord scalar      newcoord\n    real scalar             r, t\n\
    \    r = length()\n    t = angle()\n    newcoord.x = r*cos(t)\n    newcoord.y\
    \ = r*sin(t)\n    return(newcoord)\n}\n```\n\nNote that in the above code, we\
    \ call length(). Because we are writing a member function, and the class defines\
    \ a member function of that name, length() is interpreted as being a call to coord's\
    \ definition of length(). If coord did not define such a member function, then\
    \ length() would have been interpreted as a call to Mata's length().\n\nSo what\
    \ do we do if the class provides a function, externally there is a function of\
    \ the same name, and we want to prefix the function name with double colons. If\
    \ we wanted length() to be interpreted as Mata's function and not the class's,\
    \ we would have coded\n\n```\nr = ::length()\n```\n\nThere is nothing special\
    \ about the name length() here. If the class provided member function myfcn(),\
    \ and there was an external definition as well, and we wanted the externally function,\
    \ we would code ::myfcn(). In fact, it is not even necessary that the class provide\
    \ a definition. We cannot remember whether class coord includes myfcn(), but we\
    \ want the external myfcn() no matter what, we code ::myfcn().\n\nPlacing double-colons\
    \ in front of external function names used inside the definitions of member functions\
    \ is considered good style. This way, if you go back and add another member function\
    \ to the class, you do not have to worry that some already written member function\
    \ is assuming that the name goes straight through to an externally defined function.\n\
    \n# Pointers to classes\n\nJust as you can obtain a pointer to any other Mata\
