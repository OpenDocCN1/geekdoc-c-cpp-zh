- img_proc: true
  md: 'You do not specify the name of your new library. That name does not matter
    because Mata rebuilds its entire library index.


    You can issue the mata mlib create command right after creating the new library


    +   - mata mlib create lpersonal, dir(PERSONAL)

    - mata mlib index


    or after you have created and added to the library:


    +   - mata mlib create lpersonal, dir(PERSONAL)

    - mata mlib add lpersonal *

    - mata mlib index


    It does not matter. Mata does not need to rebuild its index after a known library
    is updated. Mata needs to be told to rebuild only when a new library is added
    during the session.


    # Advice on organizing your source code


    Say you wish to create and maintain lpersonal.mlib. Our preferred way is to use
    a do-file:


    ```

    mata:

    mata clear

    function definitions appear here

    mata mlib create lpersonal, dir(PERSONAL) replace

    mata mlib add lpersonal *

    mata mlib index

    end

    ```


    This way, all we have to do to create or recreate the library is enter Stata.
    change to the directory containing your source code, and type


    +   - do lpersonal


    For large libraries, we like to put the source code for different parts in different
    files:


    ```

    mata:

    mata clear

    do function1.mata

    do function2.mata

    ...

    m:

    mata mlib create lpersonal, dir(PERSONAL) replace

    mata mlib add lpersonal *

    mata mlib index

    end

    ```


    The function files contain the source code, which might include one function,
    or it might include more than one function if the primary function had subroutines:'
