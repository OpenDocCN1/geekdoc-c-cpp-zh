- img_proc: true
  md: '# [M-3] mata set — Set and display Mata system parameters 245


    # c values


    The following concerns Stata more than Mata.

    St''s c-class, c(), contains the values of system parameters and settings along
    with certain other constants. c() values may be referred to in Stata, either via
    macro substitution `c(current_date)'', for example or in expressions (in which
    case the macro quoting characters may be omitted). Stata''s c() is also available
    in Mata via Mata''s c() function; see [M-3] c().


    Most everything bet by set is available via c(), including Mata''s set parameters:


    +   - c(matacache) returns a numeric scalar to the cache size.

    - c(matanum) returns a string equal to "on" or "off".

    - c(mataoptimize) returns a string equal to "on" or "off".

    - c(matafavor) returns a string equal to "space" or "speed".

    - c(matastrict) returns a string equal to "on" or "off".

    - c(matalibs) returns a string of library names separated by semicolons.

    - c(matamofirst) returns a string equal to "on" or "off".


    The above is in Stataspeak. Rather than referring to c(matacache), we would refer
    to c("matacache") if we were using Mata''s function. The real use of values, however,
    is in Stata.


    # Also see


    +   [R] query — Display system parameters

    [R] set — Overview of system parameters

    [P] creturn — Return c-class values

    [M-3] intro — Commands for controlling Mata'
  merge: -1
