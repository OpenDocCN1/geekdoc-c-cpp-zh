  md: '# [M-2] syntax — Mata language grammar syntax


    The operators, & \ are the row-join and column-join operators. (1,2,3) constructs
    the row vector (1\2\3'') constructs the column vector (1,2,3''). (1,2,3,4) constructs
    the matrix with first row (1,2) and second row (3,4), a\b joins scalars, vectors,
    or matrices rowwise. a\b joins two scalars, vectors, or matrices colwise. See
    [M-2] op_join.


    : and : refer to the row-to and column-to-column operators. 1..5 is (1,2,3,4,5).
    1::5 is (1\2\3\4\5). 5..1 is (5\4\3\2\1). See [M-2] op_range.


    For |, ==, <=, <, =, +, -, *, /, and there is @ at precedence just below op. Operators
    perform the elementwise operation. For instance, A*B refers to matrix multiplication.
    A:B refers to elementwise multiplication. Moreover, elementwise is generalized
    to cases where A and B do not have the same number of rows and the same number
    of columns. For instance, if A is a 1 x c row vector and B is r x c matrix, then
    [[Cij]] = ||Aj|| * ||Bij|| is returned. See [M-2] op_colon.


    # Subscripts


    A[i, j] returns the i,j element of A.


    A[k] returns A[1,k] if A is 1 x c and A[k,1] if A is r x1. That is, in addition
    to declared vectors, 1 x c matrix or r x1 matrix may be subscribed by one index.
    Similarly, any vector can be subscribed by two indices.


    i, j, and k may be well as scalars. For instance, A[(3\4\5)] returns a 3 x 1 column
    vector containing 3 rows of the 5th column.


    i, j, and k may be missing value. A[., 4] returns a column vector of the 4th column
    of A.


    The above subscripts are called list-style subscripts. Mata provides a second
    format range-style subscripts that is especially useful for selecting submatrices.
    A[1,3\5,5] returns the 3 x 3 submatrix of A starting at A[3,3].


    See [M-2] subscripts.


    # Implied input tokens


    Here interpreting and compiling a line, Mata makes the following substitutions
    to what it sees:


    | Input sequence | Interpretation |

    |---|---|

    | ''name | *name |

    | [, | [,

    | ] | ,.] |


    Hence, coding X''Z is equivalent to coding X''*Z, and coding x = z[1,] is equivalent
    to coding x = z[1,].'
