  md: "# Title\n\n[M-2] break — Break out of for, or do loop\n\n# Syntax\n\n```\n\
    for, while, or do {\n    ...\n    if (...) {\n        ...\n        break\n   \
    \ }\n    stmt\t\\leftarrow break jumps here\n    ...\n```\n\n# Description\n\n\
    break exits the innermost for, while, or do loop. Execution continues with the\
    \ statement immediately following the close of the loop, just as if the loop had\
    \ terminated normally.\nbreak nearly always occurs following an if.\n\n# Remarks\n\
    \nIn the following code,\n\n```\nfor (i=1; i<=rows(A); i++) {\n    for (j=1; j<=cols(A);\
    \ j++) {\n        ...\n        if (A[i,j]==0) break\n    }\n    printf(\"%xg\\\
    n\", j)\n}\n```\n\nthe break statement will be executed if any element of A[i,j]\
    \ is zero. Assume that the statement is executed for i=2 and j=3. Execution will\
    \ continue with the printf() statement, which is to say the j loop will be canceled\
    \ and the i loop will continue. The value of j upon exiting the loop will be 3;\
    \ when you break out of the loop, the j++ is not executed.\n\n# Also see\n\n+\
    \   [M-2] do — do ...while (exp)\n[M-2] for — for (exp1; exp2; exp3) stmt\n[M-2]\
    \ while — while (exp) stmt\n[M-2] continue — Continue with next iteration of for,\
    \ while, or do loop\n[M-2] intro — Language definition"
