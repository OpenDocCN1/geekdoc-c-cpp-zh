  md: '# Title


    ```

    [M-3] mata clear — Clear Mata''s memory

    ```


    # Syntax


    : mata clear


    This command is for use in Mata mode following Mata''s colon prompt. To use this
    command from Stata''s dot prompt, type


    . mata: mata clear


    # Description


    mata clear clears Mata''s memory, in effect resetting Mata. All functions, matrices,
    etc., are freed.


    # Remarks


    Stata can call call Mata which can call Stata, which can call Mata, etc. In such
    cases, mata clear releases only resources that are not in use by prior invocations
    of Mata.


    Stata''s clear all command (see [D] clear) performs a mata clear, among other
    things.


    See [M-3] mata drop for clearing individual matrices or functions.


    # Also see


    +   - [M-3] mata drop — Drop matrix or function


    +   - [M-3] intro — Commands for controlling Mata'
