  md: "# Pointer arithmetic\n\nArithmetic with pointers (which is to say, with addresses)\
    \ is not allowed:\n\n```\n: y = 2\n: x = &y\n: x+2\n\n<stmt>: 3205 undefined operation\
    \ on pointer\n```\n\nDo not confuse the expression x+2 with the expression *x+2,\
    \ which is allowed and in fact evaluates to 4.\n\nYou may use the equality and\
    \ inequality operators == and != with pairs of pointer values:\n\n```\nif (p1\
    \ == p2) {\n  ...\n}\nif (p1 != p2) {\n  ...\n}\n```\n\nAlso pointer values may\
    \ be assigned and compared with the value NULL, which is much like, but still\
    \ different from, zero: NULL is a 1 × 1 scalar containing an address value of\
    \ 0. An unassigned pointer has the value NULL, and you may assign the value NULL\
    \ to pointers:\n\n```\np = NULL\n```\n\nPointer values may be compared with NULL,\n\
    \n```\nif (p1 == NULL) {\n  }\nif (p1 != NULL) {\n  ...\n}\n```\n\nbut if you\
    \ attempt to dereference a NULL pointer, you will get an error:\n\n```\n: x =\
    \ NULL\n: *x + 2\n\n<stmt>: 3120 attempt to dereference NULL pointer\n```\n\n\
    Concerning logical expressions, you may directly examine pointer values:\n\n```\n\
    if (p1) {\n  ...\n}\n```\n\nThe above is interpreted as as if (p1!=NULL) were\
    \ coded."
