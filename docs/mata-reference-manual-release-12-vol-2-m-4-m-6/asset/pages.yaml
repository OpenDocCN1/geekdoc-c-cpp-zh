  md: "# [M-2] class — Object-oriented programming (classes)\n\nYou make member variables\
    \ and functions protected or private by preceding their declaration with protected\
    \ or private:\n\n```\nclass myclass {\n    private real matrix X\n    private\
    \ real vector y\n    void setup()\n    real matrix invert()\n    protected real\
    \ matrix invert_subroutine()\n}\n```\n\nAlternatively, you can create blocks with\
    \ different defaults:\n\n```\nclass myclass {\n    public:\n        void setup()\n\
    \        real matrix invert()\n    protected:\n        real matrix invert_subroutine()\n\
    \    private:\n        real matrix X\n        real vector y\n}\n```\n\nYou may\
    \ combine public, private, and protected, with or without colons, freely.\n\n\
    # Making a member final\n\nA member variable or function is said to be final if\
    \ no children define a variable or function of the same name. Ensuring that a\
    \ definition is the final definition can be enforced by including final in the\
    \ declaration of the member, as as\n\n```\nclass myclass {\n    public:\n    \
    \    void setup()\n        real matrix invert()\n    protected:\n        final\
    \ real matrix invert_subroutine()\n    private:\n        real matrix X\n     \
    \   real vector y\n}\n```\n\nIn the above, no that inherits from myclass can redefine\
    \ invert_subroutine.\n\n# Making a member static\n\nBeing static is an optional\
    \ property of a class member variable function. In what follows, let ex1 and ex2\
    \ both be instances of S, assume c is a static variable of the class, and assume\
    \ f() is a static function of the class.\n\nA static variable is a variable whose\
    \ value is shared across all instances of the class. Thus, ex1.c and ex2.c will\
    \ always be equal. If ex1.c is changed, say, by ex1.c=5, then ex2.c will also\
    \ be 5."
