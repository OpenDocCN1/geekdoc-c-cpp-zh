    \ & 6 \\ 7 & 8 & 9 \\ 1 & 2 & 3 \\end{bmatrix}\n```\n\nand similarly, A[.,p] would\
    \ permute the columns.\n\nAlso subscribing can be used on the left-hand side of\
    \ the equal-sign assignment operator. So far, we have assumed that the subscripts\
