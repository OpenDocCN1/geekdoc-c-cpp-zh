  md: "# The fine distinction between syntaxes 1 and 2\n\nNothing said above about\
    \ continuation lines applies to syntaxes 1 and 2. The multiline mata, or without\
    \ colon, always allows continuation lines because where the Mata session ends\
    \ is clear enough:\n\nThe difference between the two multiline syntaxes is whether\
