  md: "# [M-1] first — Introduction and first session\n\nWhen a function returns a\
    \ result calculated in this way, it is said to return an element-by-element result.\n\
    \n# Performing element-by-element calculations: Colon operators\n\nMata's operators,\
    \ such as + (addition) and * (multiplication), work as you would expect. In particular.\n\
    * performs matrix multiplication:\n\n```\n: A = (1, 2 \\ 3, 4)\n: B = (5, 6 \\\
    \ 7, 8)\n: A*B\n```\n\n| 1 | 19 | 22 |\n| 2 | 43 | 50 |\n\nThe first element of\
    \ the result was calculated as 1 * 5 + 2 * 7 = 19.\n\nSometimes, you really want\
    \ the element-by-element result. When you do, place a colon in front of the operator:\
    \ :* performs element-by-element multiplication:\n\n```\n: A:*B\n```\n\n| 1 |\
    \ 5 | 12 |\n| 2 | 21 | 32 |\n\nSee [M-2] op_colon for more information.\n\n# Writing\
    \ programs\n\nMata is a complete programming language: it will allow you to create\
    \ your own functions:\n\n```\n: function add(a,b) return(a+b)\n```\n\nThat single\
    \ statement creates a new function, although perhaps you would prefer if we typed\
    \ it as:\n\n```\n: function add(a,b)\n{\n    return(a+b)\n}\n```\n\nbecause that\
    \ makes it obvious that a program can contain many lines. In either case, once\
    \ defined, you can use the function:\n\n```\n: add(1,2)\n3\n: add(1+21,4-11)\n\
    5 + 11\n: add((1,2), (3,4) )\n2\n```\n\n| 1 | 4 | 6 |"
