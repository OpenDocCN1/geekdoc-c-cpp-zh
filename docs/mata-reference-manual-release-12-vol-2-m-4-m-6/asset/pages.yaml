  md: "# # Title\n\n# ## [M-2] class — Object-oriented programming (classes)\n\n#\
    \ # Syntax\n\n```\n```nclass classname [extends classname] {\n  declaration(s)\n\
    }\n```\n```\n\nSyntax is presented under the following headings:\nIntroduction\n\
    Example\nDeclaration of member variables\nDeclaration and definition of methods\
    \ (member functions)\nDefault exposure in declarations\n\nDescription and Remarks\
    \ follow that.\n\n# # Introduction\n\nStata's two programming languages, ado and\
    \ Mata, each support object-oriented programming. This manual entry explains object-oriented\
    \ programming in Mata. Most users interested in object-oriented programming will\
    \ wish to program in Mata. See [p] class to learn about object-oriented programming\
    \ in ado.\n\n# # Example\n\nThe following example is explained in detail in *Description*.\n\
    \n```\n```class coord {\n  real scalar x, y\n  real scalar length(), angle()\n\
    }\nreal scalar coord::length()\n{\n  return(sqrt(x^2 + y^2))\n}\nreal scalar coord::angle()\n\
    {\n  return(atan2(y, x)*360/(2*pi))\n}\nclass rotated_coord extends coord {\n\
    \  real scalar theta\n  real scalar angle()\n  void new()\n}\n```\n```"
