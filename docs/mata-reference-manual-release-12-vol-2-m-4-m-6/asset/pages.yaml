    |1 | 3 |

    |2 | 4 |


    one is tempted to think "Ah, comma and backslash are how you separate elements
    when you enter

    matrix." If you think like that, you will not appreciate the power of , and \


    , and \ are operators in the same way that * and + operators.


    , is the operator that takes $r \times c_1$ matrix and $r \times c_2$ matrix,
    and returns $r \times (c_1 + c_2) \times c$ matrix.


    \ is the operator that takes $r_1 \times c$ matrix and $r_2 \times c$ matrix,
    and returns a $(r_1 + r_2) \times c$ matrix.


    , and may be used with scalars, vectors, or matrices:


