  md: '3900. out of memory


    Mata is out of memory; the operating system refused to supply Mata requested.
    There is no Mata or Stata setting that affects this, and nothing in Mata or Stata
    to reset in order to get more memory. You must take the problem with your operating
    system.


    3901. macro memory in use


    This error message should not occur; please notify StataCorp if it does.


    3930. error in LAPACK routine


    The linear-algebra LAPACK routines—see [M-1] LAPACK—generated an error that Mata
    did not expect. Please notify StataCorp if you should receive this error.


    3995. unallocated function


