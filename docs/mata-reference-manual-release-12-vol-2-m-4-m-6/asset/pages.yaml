  md: "# Variable declarations\n\nThe variable declarations are the declarations that\
    \ appear at the top of the body of a function:\n\n```\n... swaprows(...)\n{\n\
    \  real matrix B\n  realvector v\n  ...\n}\n```\n\nThese declarations are optional.\
    \ If you omit them, Mata will observe that you are using B and v in your code,\
    \ Mata will compile your code just as if you had declared the variables to be\
    \ transomorphic, meaning the resulting compiled code might be a little less efficient\
    \ than it could, but that is all.\n\nThe variable declarations are optional as\
    \ long as you have not mata set metastatric on; see [M-3] mata set. Some programmers\
    \ believe so strongly that variables really ought to be declared that Mata provides\
    \ a provision to issue an error when they forget.\n\nIn any case, these declarations—explicit\
    \ or implicit—define the variables we will use. The variables we use in our function\
    \ are—it does not matter if there are other variables B and v floating somewhere.\
    \ Private variables are created when a function is invoked and destroyed when\
    \ the function ends. The variables are private but, as explained above, if we\
    \ pass our variables to another function, that may change their values. Most functions\
    \ do not.\n\nThe syntax for declaring variables is\n\n```\ntype varname [, varname\
    \ [, ...]]\nexternal [type] varname [, varname [, ...]]\n```\n\nreal matrix B\
    \ and real rowvector match the first syntax.\n\n# Linking to external globals\n\
    \nThe second syntax has to do with linking to global variables. When you use Mata\
    \ interactively and type\n\n```\n: n = 2\n```\n\nyou create a variable named n.\
    \ That variable is global. When you code inside a function\n\n```\nmyfunction(...)\n\
    {\n  external n\n  }\n```\n\nThe n variable your function will use is the global\
    \ variable n. If your function were to examine the value of n right now, it would\
    \ discover that it contained 2.\n\nIf the variable does not already exist, the\
    \ statement external n will create it. Pretend that we had not previously defined\
    \ n. if myfunction() were to examine the contents of n, it would discover that\
    \ n is a 0 × 0 matrix. That is because we coded\n\n```\nexternal n\n```"
