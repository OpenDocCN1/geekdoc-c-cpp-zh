  md: "# [M-2] class - Object-oriented programming (classes)\n\n```\nreal scalar rotated_coord::angle()\n\
    {\n  return(super.angle() - theta)\n}\nvoid rotated_coord::new()\n{\n  theta =\
    \ 0\n}\n```\n\nOne could use the class interactively:\n\n```\n: b = rotated_coord()\n\
    : b.x = b.y = 1\n: b.angle() // displayed will be 45\n: b.theta = 30\n: b.angle()\
    \ // displayed will be 15\n```\n\nNote that using the class as if it were a function\
    \ creates an instance of the class. When using the class inside other functions,\
    \ it is not necessary to create the instance explicitly as long as you declare\
    \ the member instance to be a scalar:\n\n```\nvoid myFunc()\n  class rotated_coord\
    \ scalar b\n  b.x = b.y = 1\n  b.angle() // displayed will be 45\n  b.theta =\
    \ 30\n  b.angle() // displayed will be 15\n```\n\n# Declaration of member variables\n\
    \nDeclarations are of the form\n\n```\n[exposure] [static] [final] matype name\
    \ [name, ...]\n```\n\nwhere\n\n```\nexposure := public|protected|private\nmatype\
    \ := eltype|orgtype|eltype|orgtype\neltype := transymorphic orgtype := matrix\n\
    numeric vector\nreal rowvector\ncomplex colvector\nstring scalar\npointer\nclass\
    \ class\nstruct structname\n```"
