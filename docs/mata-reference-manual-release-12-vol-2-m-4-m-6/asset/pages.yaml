  md: '# Title


    [M-2] op_increment — Increment and decrement operators


    # Syntax


    ++i increment before

    --i decrement before


    i++ increment after

    i-- decrement after


    where i must be a real scalar.


    # Description


    ++i and i++ increment i; they perform the operation i=i+1. ++i performs the operation
    before the evaluation of the expression in which it appears, whereas i++ performs
    the operation afterward.

    --i and i-- decrement i; they perform the operation i=i-1. --i performs the operation
    before the evaluation of the expression in which it appears, whereas i-- performs
    the operation afterward.


    # Remarks


    These operators are used in code, such as


    ```

    x[i++] = 2

    x[--i] = 3

    ...

    for (i=0; i<100; i++) {

    ...

    if (++n > 10) {

    ...

    }\}

    ```


    Where these expressions appear, results are as if the current value of i were
    substituted, and in addition, i is incremented, either before or after the expression
    is evaluated. For instance,


    x[i++] = 2


    is equivalent to


    x[i] = 2 ; i = i + 1


    and


    x[++i] = 3


    is equivalent to


    i = i + 1 ; x[i] = 3'
