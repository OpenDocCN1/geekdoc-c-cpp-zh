  md: '# Diagnostics


    ++ and -- allowed with real scalars. That is, ++i or i++ is valid, assuming i
    is a real scalar, and x[i,j]++ is not valid.


    ++ and abort with error applied to a variable that is not a real scalar.


    ++i, i++, --i, and i-- should be the only reference to i in the expression. Do
    not code, for instance,


    ```

    x[i++] = y[i]

    x[++i] = y[i]

    x[i] = y[i++]

    x[i] = y[++i]

    ```


    The value of i in the above expressions is formally undefined; whatever is its
    value, you cannot depend on that value being obtained by earlier or later versions
    of the compiler. Instead code


    ```

    ++i; x[i] = y[i]

    ```


    or code


    ```

    x[i] = y[i] ; i++

    ```


    according to the desired outcome.


    It is, however, perfectly reasonable to code


    ```

    x[++i] = y[j++]

    ```


    That is, multiple ++ and -- operators may occur in the same expression; it is
    multiple references to the target of the ++ and -- that must be avoided.


    # Also see


    +   - [M-2] exp — Expressions

    - [M-2] intro — Language definition'
  merge: -1
