  md: "# [M-1] permutation — An aside on permutation matrices and vectors\n\n```\n\
    $$\\begin{array}{ccccc} P' & * & PA = A \\ \\begin{array} 0 & 0 & 1 \\end{array}\
    \ & & \begin{array} 4 & 5 & 6 \\end{array} & \begin{array} 1 & 2 & 3 \\end{array}\
    \ \\ \\begin{array} 1 & 0 & 0 \\end{array} & * & \begin{array} 7 & 8 & 9 \\end{array}\
    \ & \begin{array} 4 & 5 & 6 \\end{array} \\ \\begin{array} 0 & 1 & 0 \\end{array}\
    \ & & \begin{array} 1 & 2 & 3 \\end{array} & \begin{array} 7 & 8 & 9 \\end{array}\
    \ \\end{array} $$ (3')$\n```\n\nAllow us to summarize:\n\n+   1. A permutation\
    \ matrix $P$ is a square matrix whose rows are a permutation of the identity matrix.\n\
    2. $PA = a$ row permutation of $A$.\n3. $AP = a$ column permutation of $A$.\n\
    4. The inverse permutation is given by $P'$.\n5. $P'PA = A$.\n6. $APP' = A$.\n\
    \n# How permutation matrices arise\n\nSome of Mata's matrix functions implicitly\
    \ permit the rows (or columns) of a matrix. For instance, the LU decomposition\
    \ of matrix $A$ is defined as\n\n$A = LU$\n\nwhere $L$ is lower triangular and\
    \ $U$ is upper triangular. For any matrix $A$, one can solve for $L$ and $U$,\
    \ and Mata has a function that will do that ([M-5] `lud`). However, Mata's function\
    \ does not solve the problem as stated. It solves\n\n$P'A = LU$\n\nwhere $P'$\
    \ is a permutation matrix that Mata makes up! Just to be clear: Mata's solves\
    \ for $L$ and $U$, but for a row permutation of $A$, not itself, although the\
    \ function does tell you what permutation it chose (the function returns $L, U$,\
    \ and $P'$). The function permits the rows because that, it can produce a more\
    \ accurate answer.\n\nYou will sometimes read that a function engages in pivoting.\
    \ What this means is, rather than solving the problem for the matrix as given,\
    \ it solves the problem for a permutation of the original matrix, and the function\
    \ chooses the permutation in a way to minimize minimal roundoff error along with\
    \ the other results, because you are going to need it.\n\nFor instance, one of\
    \ LU decomposition is to calculate inverses. If $A = LU$ then $A^{-1} = U^{-1}L^{-1}$.\
    \ Calculating the inverses of triangular matrices is an easy problem, so one recipe\
    \ for calculating\n\ninverses is\n\n+   1. decompose $A$ into $L$ and $U$,\n2.\
    \ calculate $U^{-1}$,\n3. calculate $L^{-1}$, and\n4. multiply the results together."
