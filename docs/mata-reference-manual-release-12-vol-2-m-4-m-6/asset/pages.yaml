  md: "# [M-1] first — Introduction and first session\n\nThe J() in the program line\
    \ res = J(n, n, 0) is a Mata built-in function that returns an n x matrix containing\
    \ Os (J(r, c, val) returns an r x c matrix, the elements of which are all equal\
    \ to val); [M-5] J.\n\nfor (i=1; i<n; i++) that starting with i=1 and so long\
    \ as i<=n do what is inside the braces (set res[i,1] equal to i) and then we are\
    \ back to the for part again, increment i.\n\nThe final line—return(res)—says\
    \ to return the matrix we have just created.\n\nActually, just as with add(),\
    \ we do not need id() because Mata has a built-in function I(n) that makes identities\
    \ matrices, but it is interesting to see how the problem can be programmed.\n\n\
    # More functions\n\nMata has functions already ready and of this manual concerning\
    \ what those functions do; see [M-1] intro. But right now, what is important is\
    \ that many of the functions: are themselves written in Mata!\n\nOne of those\
    \ functions is pi(); it takes no arguments and returns the value of pi. The code\
    \ for it reads\n\n```\nreal scalar pi() return(3.141592653589793238462643)\n```\n\
    \nThere is no reason to type the above function because it is already included\
    \ as part of Mata:\n\n+   : pi()\n: 3.141592654\n\nWhen Mata lists a result, it\
    \ does not show as many digits, but we could ask to see more:\n\n+   : printf(\"\
    %7.0g\", pi())\n: 3.14159265358979\n\nOther functions include the hyperbolic function\
    \ tanh(u). The code for tanh(u) is\n\n```\nnumeric matrix tanh(numeric matrix\
    \ u)\n{\n  numeric matrix eu, emu\n  eu = exp(u)\n  emu = exp(-u)\n  return((eu-emu)/(eu+emu))\n\
    }\n```\n\nSee for yourself: at the Stata do prompt (not the Mata colon prompt),\
    \ type\n\n+   : viewsource tanh.mata\n\nWhen the code for a function was written\
    \ in Mata (as opposed to having written in C), viewsource can show you the code;\
    \ see [M-1] source."
