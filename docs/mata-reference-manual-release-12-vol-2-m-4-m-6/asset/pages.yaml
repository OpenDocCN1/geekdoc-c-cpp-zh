    # # Syntax


    y = f(x, ...)    (function returns result the usual way)

    g(x, ..., y    (function returns result in argument y)


    # # Description


    Most Mata functions leave their arguments unchanged and return a result:

    : y = f(x, ...)


    Some Mata functions, however, return nothing and instead return results in one
    or more arguments:

    : g(x, ..., y)


    If you use such functions interactively and the arguments that to receive results
    are not already defined (y in the above example), you will get a variable-not-found
    error. The solution is to define the arguments to contain something—anything—before
    calling the function:

    : y = =

    : g(x, ..., y)


    You can combine this into one statement:

    : g(x, ..., y=.)


    # # Remarks


    sqrt(a)—see [M-5] sqrt(x)—calculates the (element-by-element) square root of a
    and returns the result:

    : x = 4

    : y = sqrt(x)    // y now contains 2

    2

    : x = 4

    // x is unchanged


    Most functions work like sqrt(), although many take more than one argument.


    On the other hand, polydiv(ca, cb, cg, cr)—see [M-5] polyeval(x,)—takes the polynomial
    stored in ca and the polynomial stored in cb and divides them. It returns the
    quotient in the third argument (cg) and the remainder in the fourth (cr), ca and
    cr are left unchanged. The function itself returns nothing:

    : A = (1,2,3)

    : B = (0,1)

    : polydiv(A, B, Q, R)'
