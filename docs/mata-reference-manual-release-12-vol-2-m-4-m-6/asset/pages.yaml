  md: "# Use of pointers to collect objects\n\nAssume that you wish to write a function\
    \ in two parts: result_setup() and repeated_result().\nin the first part, result_setup(),\
    \ you will be passed a matrix and a function by the user, and you will make a\
    \ private calculation that you will use later, each time repeated_result() is\
    \ called. When repeated_result() is called, you will need to know the matrix,\
    \ the function, and the value of the private calculation you previously made.\n\
    \nOne solution is to adopt the following design. You request the user code\n\n\
    ```\nresultinfo = result_setup(setup args...)\n```\n\non the first call, and value\
    \ = repeated_result(resultinfo, other args...)\n\non subsequent calls, the design\
    \ is that you will pass the information between the two functions in resultinfo.\
    \ Here resultinfo will need to contain three things: the original matrix, the\
    \ original function, and the private result you calculated. The user, however,\
    \ never need know the details, and you will simply request that the user declare\
    \ resultinfo as a pointer vector.\n\nFilling in the details, you code\n\n```\n\
    pointer vector result_setup(real matrix X, pointer(function) f)\n{\n    real matrix\
    \ privmat\n    pointer vector info\n    ...\n    privmat = =\n    ...\n    info\
    \ = (&X, f, &privmat)\n    return(info)\n}\nnreal matrix repeated_result(pointer\
    \ vector info, ...)\n{\n    pointer(function) scalar f\n    pointer(matrix) scalar\
    \ X\n    pointer(matrix) scalar privmat\n    f = info[2]\n    X = info[1]\n  \
    \  privmat = info[3]\n    ...\n    (*f)(..\n    (*X)...\n    (*privmat)...\n}\n\
    ```"
