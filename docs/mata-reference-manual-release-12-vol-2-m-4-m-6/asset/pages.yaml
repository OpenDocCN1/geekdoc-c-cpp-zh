  md: '# Naming variables


    Mostly, you can name variables however you please. Variables are local to the
    program in which they appear, so one function can have a variable or argument
    named x and another function can have a variable or of the same name, and there
    is no confusion


    If you are writing a large system of programs that has global variables, on the
    other hand, we recommend that you give the global variables long names, preferably
    with a common prefix identifying your system. For instance,


    ```

    multeq_no_of_equations

    multeq_eq

    multeq_inuse

    ```


    This way, your variables will not become confused with variables from other systems.


    # Naming functions


    Our first recommendation is that, for the most part, you give functions all-lowercase
    names: foo() rather than Foo() or FOO(). If you have a function with one or more
    capital letters in the name, and if you want to share the function''s object code,
    you must do so in .mlib libraries; .mo files are not sufficient. .mo files require
    that the filename be the same as the function name, which means Foo.mo. Not all
    operating systems respect case in filenames. If your operating system does respect
    case, you will not be able to share your .mo files with others whose operating
    systems do not.


    We have no strong recommendation against mixed case; we remind you to use .mlib
    files if you use


    Of greater importance is the name you choose. Mata provides many functions and
    will be added over time. You will find it more convenient if you choose names
    that StataCorp and other users do not choose.


    That means to avoid words that appear in the English-language dictionary and to
    avoid short names, those four characters or fewer. You might have guessed svd()
    would be taken, but who would have guessed qrd() or or().


    Your best defense against official functions, and other user-written functions,
    is to choose long function names.


    # What happens when functions have the same names


    There are two kinds of official functions: built-in functions and library functions.
    User-written functions are invariably functions (here we draw no distinction between
    functions supplied in .mo files and those supplied in .mlib messages)


    Mata will issue an error if you attempt to define a function with the same name
    as a built-in function.


    Mata will let you define a new function with the same name as a library function
    if the library function is not currently in memory. If you store your function
    in a .mo file or a .mlib file, however, in the future the official Mata library
    function will take precedence over your function; your function will never be
    loaded. This feature works nicely for interactive users, but for long-term programming,
    you will want to avoid naming your functions after Mata functions.


    ![](img/94f0e160fb245a717f6d9189ad47298e_65_0.png)'
