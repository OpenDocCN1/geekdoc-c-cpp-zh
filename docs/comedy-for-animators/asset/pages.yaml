    # THE ODD COUPLE


    One comedy that is basic to both live action and animated comedy is the odd couple.
    The term comes from the title of a Neil Simon play in which two men are forced
    by circumstances to share an apartment in New York City. It is a personnick, obsessively
    clean-body, the other is a cigar smoker. The name suggests they have a domestic
    relationship as well, so they share a home. I will apply the term to any pair
    of characters who are significantly different from each other, but have a relationship
    that transcends their differences. This is to separate them pure antagonists.
    One of the original odd couples was Mutt & Jeff. They were comic characters who
    had very different bodies. One was tall and the other was short. Short physical
    differences are good, and it is much more important to make them think and behave
    very differently. It could be a smart character matched with a dimwit, like Pinky
    and the Brain, or bold paired with timid, like Futurama''s Zapp Brannigan and
    his lieutenant Kroker.


    Ren & Stimpy (Nickodeon, John Kricfus) is an example of an odd couple pushed to
    extremes. They have similarities to Laurel and Hardy. Ren is ambitious and wants
    to be successful. He takes himself very seriously, and pretends to know more than
    he does. Stimpy is dull-witted, positive, and caring. His desires are much simpler;
    a litter box and making Ren happy. What makes Ren & Stimpy so different from other
    cartoons is how emotional they are. Ren''s anger is second to none, and they can
