  md: '# INTRODUCTION 3


    Vudevilians worked extremely hard to please the audience. They had a daily, interactive
    relationship with each other. Every on stage reached out to get as much attention
    as he or could. When Charlie Chaplin left the stage to work in films, he brought
    that with him. In his second appearance on film, he debuted the tramp character
    that would make him famous. The movie, directed by Henry Lehman, was called Kid
    Auto Races at Venice; Keystone Film Company, 1914), and the camera is set up documentary
    style, filming the crowd watching the soap box races. The oddly dressed Chaplin
    repeatedly steps into the frame, stares into the camera and tries to get our attention.
    He was saying "Look at me." His inent to the camera captured the attention of
    the public. Only a comedian dares to look into the camera, and then only the star.


    Figure 1.2 Charlie Chaplin, Kid Auto Races at Venice, 1914


    ![](img/deb498c4939dd89f4d36bf884d96d667_15_0.png)


    The comedian is aware of the audience. He, or she, is playing to the tribe. This
    is a very important concept in this book. Modern theater can be divided into two
    general forms, representational and presentational. The primary way to distinguish
    them is by how they relate to the audience. Representational theater creates an
    imaginary fourth wall that the audience can look through and see a representation
    of a story. Presentational theater removes that wall, and allows the performers
    to be conscious of the audience watching them. They are presenting a story. The
    caveman is playing to the tribe, trying to make them laugh.


    In representational theater, the story is essentially carved in stone. It is the
    creation of a writer who has sealed the diorama for all to enjoy. The actors can
    bring different forms of energy to the part, but they are still restricted by
    the text. Great stories can live for hundreds of years, and be performed by many,
    different casts. The actors can come and go, but the story lives on. There are,
    of, comic versions of representational stories. One example would be the well
    made play. The subjects of these plays are the upper class, where one character
    tries to initiate a scheme, or keep a secret. Problems arise, and as the play
    progresses, the intertwining intrigues create what appears to be'
