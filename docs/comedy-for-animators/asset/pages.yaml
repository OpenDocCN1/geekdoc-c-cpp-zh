    Satire will also begin with familiar material, though usually not a specific work.
    What really separates satire from parody is its purpose. Satire uses humor to
    deliver a social, political or moral message. The satirist must have a point or
    she is trying to make about established institutions and behavior. The message
    can be delivered by a gentle ribbing or a scathing attack. All depends on how
    strong the satirist wants to make his point. Ridicule, exaggeration, metaphor,
    and analogy are all useful tools in satire. What matters is the potential to make
    an audience laugh and think.


    Over many seasons *The Simpsons* has satirized American life with an entire ecosystem
