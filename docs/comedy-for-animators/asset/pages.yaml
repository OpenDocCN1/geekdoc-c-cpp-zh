    # Parody and Satire


    One of the easiest routes to creating comedy is by making of the audience already
    knows. YouTube is filled with spoofs of Star Wars (Lucasfilm), pop songs, and
    television commercials. Once the audience has recognized the characters and situations
    as something they know, you can immediately get to the business of putting a new
    spin on the subject.


    But not all mockery is the. Primarily, it comes down to the difference between
    parody and satire.


    Parody often involves making fun of a particular work, say a specific TV show
    or a book. Alternatively, it can take an entire genre. Parody is mostly concerned
    with the superficial style of the original, rather than the content. It is crucial
    that the material takes itself seriously to begin with. For What''s Opera Doc?
    (Warner Brothers, 1947), Chuck Jones took the most basic parts of Elmer Fudd/Bug
    Bunny chase story, but dressed it up in the trappings of an opera. He took the
    musical style, the historical costumes, the dramatic stage sets, graphic effects,
    and even the "tragic" ending. Each of those elements were further exaggerated
    and stylized, and the result is one of the most acclaimed Looney Tunes ever.'
