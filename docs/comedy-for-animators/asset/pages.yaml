  md: '# CHAPTER 11


    # Comic Acting


    There has been no new comedy talent, to speak of, developed in the past few years,
    because the young actor and actress look with disdain upon comedy acting. They
    all want to emote and become Clark Gables and Betty Davises.


    > Hal Roach¹


    There is a lot of great advice available about acting in animation, but not so
    much dedicated to making people laugh. It is the same with most acting instruction
    in general. In the preface to his book Why is That Funny?, John Wright has this
    to say:


    In most of our drama schools far more attention is paid to making students cry
    than ever paid to making them laugh. This is partly due to the legacy of Stanislavski,
    and the majority of our acting teachers base their approach on some aspect of
    their technique.


    Constantin Stanislavski is responsible for the widespread use of the method. Where
    comic actors work through their personal style, dramatic actors are regularly
    called on to be completely different characters. Method acting allows dramatic
    actors to quickly immerse themselves into their individual characters, and create
    more natural interpretations of their behavior. It was a great advantage for dramatic
    actors because it was a powerful resource to the long standing use of figurative
    acting. In figurative acting, actors memorize and reuse poses and gestures that
    have been established for them, and audiences can recognize it. It is an old-fashioned
    way of acting, and has been considered cliché.


    However, actors still rely on a fair amount of figurative acting, because it has
    the advantage of clarity. Figurative acting is what we learn when Preston Blair''s
    book Learn How to Draw Cartoons. The whole idea of strong poses is intended to
    avoid ambiguity in the performance. Character model sheets often include illustrations
    of typical poses. In addition to giving a character weight and energy that is
    appropriate for their body type, actors are expected to express recognizable emotions.
    So how we escape figurative acting and avoid ambiguity in performance? I will
