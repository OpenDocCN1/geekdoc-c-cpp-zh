  md: '# THE IMPOSSIBLE 195


    screenwriting class, I learned that you can get a character into trouble through
    bad luck, but you can''t get him out of it with good luck.


    However, comedy often breaks the rules. Consider Captain Jack Sparrow. I remember
    when I was working on the first Pirates of the Caribbean film and I saw the footage
    of Jack standing atop the mast of a ship as it pulls into it. The camera pulls
    back to reveal it is just a little boat that is beginning to sink. At what seems
    like the last possible moment, he steps from the mast to the dock, as though it
    were a completely normal way to return. He had no lack of confidence. That is
    exactly the sort of ridiculous law Buster Keaton would have had. Lucky people
    are beloved by the gods, and by audiences as well. The luck cannot be small. It
    must be astonishing.


    In cartoons, the director is god. In Barber-Costum Bunny (Warner Brothers, 1956),
    directed by Chuck Jones, Bugs Bunny gets revenge on a bandit who stole his gold
    by gambling with him. Bugs places the wager on a number, and the bandit spins
    the roulette wheel. No matter what the bandit does to fix the game, the little
    ball will always land on the number Bugs he has picked. His luck is absolutely
    magical. Tex Avery took full advantage of his position as director and god. And
    he had kinds of strange powers. In Bad Luck Blackie (MGM, 1949), a black cat was
    truly bad luck. By intentionally crossing someoney''s path, he could create any
    manner of catastrophe in the clear blue sky.


    ![](img/deb498c4939dd89f4d36bf884d96d667_207_0.png)


    Figure 12.7 Tex Avery cartoon,

    Bad Luck Blackie, 1949


    Courtesy Everett Collection.


    Scott Curtis writes:


    Some have argued that there are no consistent laws of physics for an Avery cartoon,
    nothing defining the difference between real and unreal; the laws to be different
    for hunter and hunted, rascal and victim. But that is precisely the point: the
    laws are different for each character. What we might call good luck'
