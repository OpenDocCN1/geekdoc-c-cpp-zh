  md: '# 196 THE IMPOSSIBLE


    or good karma or good timing in the real world is codified in comedy according
    to character. Buster Keaton gags, for example, often revolve around Keaton''s
    uncanny ability to escape harm: recall the famous Steamboat Bill, Jr. (1928) gag
    in which a falling facade of a house appears to crush him; only the spot where
    an open window allows him to stand unscratched. Nature works differently for some.
    The same principle applies in animation, that there are two distinct laws of physics
    at play and some characters have access to both.


    So you have it. Some characters can manipulate reality, some not. The director
    chooses the luck, bestows it upon anyone he wants to have it, and withholds it
    from others. The universe is completely against while E. Coyote. Luck is on his
    side momentarily, so that he can get himself up in the air, or moving at high
    speed, then abandons him at the worst moment. For him, there will be a huge rock
    exactly the wrong place. Something will break, flip, or collapse, at exactly the
    wrong time. Luck, good and bad, makes a character attribute


    Once you understand the foundation of comedy that actors have delivered successfully
    for millennia, you can more effectively move into the impossible world of cartoons.
    Everything ends, and with character. Magical effects on their own meaning in animation.
    They must exist only to amplify the energy of the characters. Also, they must
    be intrinsic to the universe presented. The players must accept it as part of
    their world. If characters have the ability to do extraordinary things, or survive
    terrible events, they should make use of it with a certain amount of regularity.
    Those powers must be considered in the equation at all times, and balanced out
    with maintaining the integrity of the characters. They must still express themselves
    through their behavior. If they are funny characters at heart, properly used effects
    will serve to make them larger than life, and audiences will love them even more
    because of that.


