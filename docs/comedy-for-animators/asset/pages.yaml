  md: '# 194 THE IMPOSSIBLE


    The **marvelous** is the term used by the surrealists to distinguish their art
    from which is considered fantasy. Knopf also writes:


    > The fantastic is the product of pure fantasy, and escapism, while the marvelous
    is based in part on everyday reality.


    So that the distinction between fantasy and reality. Fantasies are consciously
    alternate worlds and are completely imaginary. People will use the word surreal
    to describe events they actually experienced but were very strange. Creating surreal
    art should try to emulate that sort of experience.


    Sometimes, simply starting in a “normal” world, moving into a strange one can
    constitute surrealism. One of the most surrealist cartoons is *Porky in Wackyland*
    (Warner Brothers, 1938), directed by Bob Clampmett. In that film, Porky is hunting
    a rare Do-Do for a huge reward. He flies his plane to darkest Africa, and lands
    in Wackyland. The landscape and creatures are clearly inspired by the surrealist
    Salvador Dali.


    A good example of surrealism in modern mainstream animation is Animation’s *Cloudy
    With a Chance of Meatballs*. The story begins on the Island of Swallow Falls.
    At that point, the context is essentially a real place. It is a cartoon, sure,
    but there is nothing remarkable about the island. Flint Lockwood unlocks a machine
    that produces food. Through an unlikely accident, the machine is launched into
    the sky, where it causes meals of epic proportions to rain down the island. Through
    these events, the island has stepped over from being realistic, to being surreal.


    **Figure 12.6** Cloudy with a Chance of Meatballs, 2009


    © Sony Pictures. Courtesy Everett Collection.


    ![](img/deb498c4939dd89f4d36bf884d96d667_206_0.png)


    # Luck


    In the early days of theater, there was something called deus ex machina, which
    translates into “God from the machine.” The original Latin term referred to the
    use of machinery, such as a crane, that could fly an actor playing god onto the
    stage to resolve a problem. In the ancient times, gods were considered to be in
    control of everything anyway, so it was acceptable them. In modern usage, it refers
    to a plot device where a character gets into significant trouble, but is saved
    by a previously unmentioned fact or character. It is an easy way out for the writer,
    and is generally considered bad writing. Now, we like to see people solve their
    own problems. In my college'
