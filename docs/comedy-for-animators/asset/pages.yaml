    # The Rule of Three


    A sequence of gags can take advantage of something known as **the rule of three**.
    Human beings are naturally interested in finding patterns. Three is the smallest
    number needed to confirm a pattern, and comedians routinely take advantage of
    this. The viewer sees something happen twice, he assumes it will happen the same
    way the third time. This is a form of running gag. However, instead of doing it
    every time, the gag is played the same way the first two times. The audience will
    notice the repetition, and begin to see a pattern. Because they are waiting, you
