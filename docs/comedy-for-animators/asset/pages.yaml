  md: 'Ancient Greek history is not the first place one would think to look for comedy,
    but that is where Western theater began. In fact, it was the merry-makers who
    came first. Centuries before Aeschylus, "The father of tragedy," began writing
    his plays, traveling troupes of minstrels, jugglers, acrobats, and mimes were
    putting on shows. The Greeks held celebrations for Dionysus, the god of winemaking,
    and of ritual madness and ecstasy. The festivals, called Dionysia, began in the
    rural areas and in the months around the winter solstice. It was certainly a time
    for drinking and the performances historically lustful, with earthy characters
    cartoonishly large phalli, as well as hugely padded buttocks and bellies. Distorting
    the human image for humorous effect has origins pre-dating comic strips and print
    media.


    They began the tradition of using character types for creating comedy. Types are
    sometimes called stock characters, and they provided a common foundation for the
    actor to build on. Stock characters also allow the audience to quickly recognize
    and understand them. These ancient comedies had three basic types; the eiron,
    the alazon, and come. the bomolochus. These three archetypes are the foundation
    of many characters to come. The connection between the eiron and alazon is one
    of the most fundamental comic relationships there is.


    Figure 2.2 Statue of Greek eiron


    Photo by Marie-Lan Nguyen.


    ![](img/deb498c4939dd89f4d36bf884d96d667_20_0.png)'
  merge: -1
  pgno: 20
- img_proc: true
  md: 'The eiron was a clever character who pretended to be less intelligent than
    he. It was trickery. These characters were of low status, commonly slaves. It
    was unthinkable for a slave to be smarter than his master, and so he could behave
    that way. Because the slave acts dumb, the master never suspects he is hatching
    a cunning plan. Eiron, is the root of the word irony. It is ironic that the slave
    knows more than the master. Don''t let the role of slave mislead you. The eiron
    is any character who appears to be weak, vulnerable, or stupid. For example, Avery''s
    Droopy is a very small dog with tired eyes. He walks with stiff feet and steps
    in a slow draw. That is merely a façade to set up his opponent to be surprised
    by Droopy''s astonishing abilities. The eiron played his game against the alazon.


    The alazon was any character who had a high opinion of, or pretended to be more
    than he was. Clearly, he is the opposite of the eiron. Classically, the alazon
    was the master of the slave, or he always believed himself to be correct. That
    overconfidence was undoing. It is up to the eiron to fool the alazon. The alazon
    usually came in two: the controlling figure (senex iratus) and the bragg soldier
    (miles glorious). These two characters will be discussed in Chapter 5. For our
    purposes we can apply the title to any overconfident. In animation this might
    be the villain. It is someone who is physically powerful, or simply in a bad mood.
    Droopy Dog was pitted against the larger wolf. Based on his visual appearance
    and energy levels, the wolf has a huge advantage, but never won his way. Bugs
    Bunny runinely to defend himself against the perpetually and heavily armed Yosemite
    Sam. Tweed Bird was as vulnerable a character as you could find, and was punished
    by his natural enemy, Cal Sylvester.


    The third common character, the bomolocus, was the buff. This character is vulgar
