  md: '# INTRODUCTION


    That could have been the beginning of the long history of physical comedy. Physical
    comedy is a distinct art form, different from verbal and written comedy. I wrote
    this book because I am fascinated by anyone who can make me laugh without words.
    For 25 years I have studied the art and history of visual comedy. The animated
    cartoon is one of the whole tree of physical comedy. When studying any art form,
    it is always important to know what has been done before. If you want to make
    funny cartoons, you can learn from the successes and failures of the past. All
    cultures, Eastern and Western, throughout time, have had their comic characters.
    In their wonderful book Funny for Words, Frank Thomas and Ollie Johnston had this
    to say:


    Our ancient history is filled with accents of the magical spell woven by storytellers
    and troubadours, but laughter was found more in the artistry of various types
    of clowns and, particularly, mimes.¹


    Today, when we hear the word mime, we think of a silent actor in white faceing
    walking into the wind. At its root, the word simply means to imitate, just as
    the previously mentioned caveman imitated his fortunate primate. The words mime
    and pantomime have various uses throughout the centuries. In instance, an ancient
    Greek pantomimist acted out the parts in a play by himself, accompanied by a chorus
    and music. In England, during the eighteenth century, a popular form of musical
    comedy was eventually called pantomime. We will look at the history of the pantomime
    in a later chapter.


    What Thomas and Johnston were emphasizing the physicality of the performers. Animators
    are in the business of making characters so that the audience can understand what
    they are thinking or feeling, even if they are not talking. In large theaters
    have always had to act "bit" to reach the furthest roots. We can also call this
    pantomime, regardless of whether the character speaks or not. To create this sort
    of highly physical performance, beginning animators must learn the principles
    of animation. By learning how to stage an actor, or exaggerate small movements,
    communicate to the viewer. There are many great books and resources that teach
    these principles, and that''s what animators must begin. This book is intended
    as a sort of "next step" in the process. Once someone understands the basics of
    physical act, or animation, the challenge remains what to do with them. Animation
    is capable of delivering any sort of story, but it found its greatest success
    with characters who could make people laugh. Just as silent film comedians are
    still admired for their movies, some of animation''s greatest success came in
    the early years. How did the golden age of animation happen?


    The pioneers of animation didn''t have instruction books, schools or online classes.
    They were figuring it out as they went. When looking for ways to entertain people
    with funny stories, they took their inspiration from what they saw on vaudeville
    stages and in silent film comedies. Those were popular entertainments of the day,
    and to be successful, you gave people more of what worked. Frank Thomas and Ollie
    Johnston, in their book Too For Words!, wrote Walt Disney:


    Whenever a vaudeville act would come to town, Walt wanted tickets for his top
    men to be sure that they would see these fine performers, and remember them.²'
