  md: '# CHAPTER 6


    # Comedy Teams


    ![](img/deb498c4939dd89f4d36bf884d96d667_93_0.png)


    **Figure 6.1** Madagascar, 2008

    © Paramount. Courtesy Everett Collection.


    There are some physical comedians who can perform solo. I discuss them in Chapter
    10 on props. Otherwise, nearly all comedians work in some sort of group. It could
    be just two people, or a large ensemble cast. In live action, it takes time and
    no small amount of luck to assemble two or more actors who click with each other.
    Once they have established a comfort level that allows them to do their best work
    they will often return to working with the same people over and over. Some of
    the most successful comedy teams, the Marx brothers and the Three Stooges were
    made up of family members. Their relationships developed naturally. For animated
    film makers it is crucial to understand the dynamics behind successful comedy
    teams.


    The commedia dell''arte was always an ensemble performance. **No single actor
    could claim to be the lead.** Like any good improvisation, it thrived on the actors''
    familiarity with each other to know what was needed at any moment in the play.
    Television sitcoms rely on having characters that sustain stories over multiple
    seasons, and casting actors that have chemistry between them. At the conceptual
    level, the first question to be answered is: Why is this group together? Live
    situation comedies occasionally have where the cast seems to be just friends,
    but usually there is some other factor that brings them together. Very often they
    are either family or they work in the same place.'
