  md: '# 112 STRUCTURE, STYLE, AND THEME


    This is a useful formula that can be applied to comedy. It is actually the type
    of formula that Harold Lloyd might have used in creating his feature films. Of
    the great silent film stars, Harold Lloyd''s“glasses character” was the most like
    a typical scenario by Elmer Fudd.


    But consider a Bugs Bunny cartoon, such as a hunting scenario. You would basically
    have to turn that formula inside out to dissect it. Fudd is the one with the goal,
    to kill a rabbit. He is the one with the flaw of being de-witted. Bugs succeeds,
    and he never learns his lesson. Bugs seems to have no serious goals, except maybe
    to go on vacation. He has no significant flaws. Bugs only acts when provoked and
    he never has to learn a lesson. Bugs leaves the story exactly as he started. But
    during those minutes, the audience laughs. It is time spent well. When the audiences
    laugh, they never stop to analyze why.


    Many people believe you can''t teach comedy. Many comedians don''t want to dissect.
    My approach is to describe the ways people have done it in order to share the
    valuable lessons I have found. All comedians learn from other comedians. If you
    watch a cartoon or movie, and really understand what is happening, it will make
    it easier to use these methods in your work. I will introduce you to stories for
    personal comedy through the topics of style, and theme.


    There are many different styles of comedy, and considerable overlap between them.
    I have already outlined some styles of comedy. Comedia dell''arte and English
    pantomime are two of these examples. In a later chapter I will discuss surrealism,
    which is different from anything else. Let''s start with a look at comedy as farce.
    Here is a useful quote from Chuck Jones:


    > Comedy is unusual people in real situations. Farce is real people in unusual
    situations.


    chuckjones.com


    A real situation is, for example, a hunter hunting rabbits. It is a completely
    normal event. But if the hunter is a bit odd, and the rabbit is exceptionally
    clever, it can become comedy. Bugs Bunny is an unusual personality. What most
    of this story is about, unusual characters. For this chapter let''s get away from
    characters a little bit and discuss story.


    Farce is any story where the writer creates circumstances that cause misunderstanding
    and confusion among the people who were just going about their business. Coincidence
    can multiply beyond what would be accepted in a normal story. Farce includes physical
    comedy, which fits in with the direction of this story. Farce depends on wildly
    improbable situations and characters that react strongly to them. The characters
    are self-centered and are trying to achieve some sort of goal. But things go wrong,
    and their choices only seem to make things worse.


    There is farce in animated films, to be sure. One of the easiest ways to create
    disorder is by the use of identical twins and mistaken identities. The twins are
    always the ones, and they get put up against a straight man. The straight man
    in the story doesn''t realize there are two of them, as both are never in the
    room at the same time. Their entrances and exits are choreographed so only the
    audience sees what is going on.'
