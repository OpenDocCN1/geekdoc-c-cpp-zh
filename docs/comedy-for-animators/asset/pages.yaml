  md: '# Comic Events


    People love funny gags. In many, many films, it is the gags audience remembers.
    But it is important for me to explain the difference between a plain gag and a
    comic event. The term comic event is used by Steve Neale and Frank Krutnik to
    distinguish humor that grows from the story, more than the characters.\* Where
    gags are dropped anywhere by a skilled performer, comic events are the responsibility
    of the writers and storypeople.


    Feature films tend to be representational stories that aspire to create a world
    that feels real. If a performer steps out of the story to do something for a laugh,
    it disrupts the narrative flow. While they may enjoy the humor, the audience will
    lose confidence when the character is really engaged in what is going on. It breaks
    the illusion. Comic events, on the other hand, grow naturally out of the story.


    I will give an example from the Aardman film Wallace and Gromit: The Curse of
    the Were-Rabbit (2005). Wallace and Gromit have a huge vacuum to humanely suck
    all the rabbits out of Lady Totington''s yard. Victor Quermaine, the antagonist,
    is as well, and he wants to shoot the rabbits. When Wallace turns on the vacuum,
    Quermaine takes aim at a bunny. The rabbit gets sucked into a hole just as the
    goes off. The rabbit finds itself flying through the tunnel toward the light as
    if


    Figure 9.1 Wallace and Gromit:

    The Curse of the Were-Rabbit,

    Lord Victor Quermaine,

    Wallace, Lady Totington,

    @DreamWorks. Courtesy

    Everett Collection.


    ![](img/deb498c4939dd89f4d36bf884d96d667_142_0.png)'
