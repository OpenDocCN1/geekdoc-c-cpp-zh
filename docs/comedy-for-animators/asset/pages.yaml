  md: '# CHAPTER 5


    # # Essential Characters


    This chapter describes a selection of characters who have appeared over and again
    since the beginning of theater. By no means is this an exhaustive list of all
    known funny guys, but it is a good foundation to build on. Some of them are simple,
    and some complex. Some are realistic, and others are not. All of them should be
    familiar in some way. Often it is because they represent some simple truth that
    we recognize. There are some basic human behaviors that will never change. We
    are all born foolish and spend our lives desperately not to look like it. We see
    foolishness in others, and love to make it fun of. Foolness may come in the form
    of the seven deadly sins of greed, lust, sloth, wrath, envy, pride and gluttony.
    These weaknesses are easily exaggerated for laughs. Other characters seem to be
    free of any human need, and are able to thumb their nose at society. We love them
    for succeeding at what we wish could do. Some make fools of themselves, some make
    fools of others.


    # The Commedia Dell''Arte Characters


    ![](img/deb498c4939dd89f4d36bf884d96d667_69_0.png)


    Figure 5.1 Two characters from commedia dell''arte'
