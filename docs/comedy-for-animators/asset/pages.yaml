    Film historian Tom Gunning wrote about what he called the cinema of attractions.
    It describes the ability of motion pictures to show interesting things. These
    are things that can entertain, or even aston audiences, but have nothing to do
    with story. Movies can bring the flow of the narrative to display moments of wonder,
    virtuosity, and of spectacle. Dance numbers, for example, do nothing to advance
    a story, yet many people enjoy them. A lightsaber battle can be entertaining regardless
    of what''s going before and after. Hardly goes to a martial arts movie to appreciate
    the plot. They go to watch sequences of extraordinary action, stunts, and sometimes
    comedy.


    It has been suggested that the slapstick comedy evolved into the action movie
    story. While some martial arts movies are serious and dramatic, a large number
    of them arehearted and charmed. If one performer were to be the true hero to the
    crown of slapstick, it would be Jackie Chan.


    Chan was born on April 7, 1954. He failed his first year in school, and was later
    sent to be trained at the China Drama Academy. That was where he learned martial
    arts and acrobatics. He began at age five with small parts. At eight he made his
    first appearance in Big and Little Tin Bar (Great Win Film Co.), directed by Lung
    To. Eventually he joined other students as part of The Seven Fortunes, a troupe
    that performed in the Peking Opera. It is easy for westerners to hear the opera,
    and confuse it with the tragic stories and barrelledled Buster Keaton we are familiar
    with. But Peking Opera is not that at all. In The Theater and Cinema of Buster
    Keaton Robert Knopf writes:


    Vaudeville and the Peking opera share a surprising number of aesthetic elements.
    Both developed out of the fusion of other forms, blending comedy, acrobatics,
    singing, and music. Like Vaudeville, Peking opera follows a variety format, using
    a skeletal script based excerpts from longer plays and operas, interspersed with
    comic and acrobatic interlude.¹²


    The martial arts used in the Peking Opera, and movies, are much theatrical than
    actual martial arts. They are not designed for practical combat, but for style
    and choreography. At 17, Chan acted as a stuntman in the Bruce Lee Fist of Fury
    (Golden Harvest, 1972), directed by Lo Wei, and the Dragon (Warner Brothers, 1973),
    directed by Robert Clause. In 1978, director Yuan Woo-Ping gave Chan the freedom
    to create his own stunts, and the resulting film, Snake in the Eagle''s Shadow
    (Seasonal Film Corporation), became the comedic Kung fu style. That was followed
    by Drunken Master (Seasonal Film Corporation, 1978), Chan''s breakthrough through.


    Chan has acknowledged Buster Keaton as one of his influences. The method of creating
    action films is nearly identical to the used by the great silent film comedians.
    He works from a basic plot, improvising a substantial portion of the movie based
    on the locations and situations his character finds himself. In each setting,
    he spends time searching for props and potential stunts. This is followed by trial
    and error, discarding any ideas that don''t prove effective. The best ones get
    developed and after considerable rehearsal, they will start shooting. They will
    do as many takes as they need to get the shot right. This is not to suggest they
    have unlimited time. They are working on tight budgets and through the process
    as quickly as they can. It is a physically exhausting operation. The ultimate
    goal is to make appear that this all happened spontaneously.'
