  md: '# CHAPTER 4


    # Shadow and Light


    In the beginning, there was the prank.


    When motion pictures first appeared, movie cameras were used simply to record
    normal events. They showed things such as workers leaving a factory, or a train
    entering a station. It wasn''t long before simple stories were created for film.
    Since reels of film were extremely short, the story also had to be very short.
    So, in 1895, Louis Lumière staged a simple prank. His film, originally titled
    *Le Jardiniere*, is now commonly referred to as *L''Arrose Arros*, or in English,
    *The Sprinkler Sprinkled*. It shows a man using a hose to water a garden. A boy
    enters the frame and steps on the hose, stopping the water flow. When the gardener
    releases the nozzle, the boy gets a face full of water. The boy laughs, but is
    immediately caught and spanked.


    This created the first film comedy genre. Prank films became the way to get laughs
    from an audience during the earliest days of cinema. It is an extremely simple
    but inflexible method of creating a moment of tension and release. The audience
    gets to be "in on the joke" watching the situation being set up. The trap is sprung,
    forming the climax of the event. Usually, the prankster is caught and punished,
    giving closure to the narrative.


    Similar stories involved people simply misbehaving and getting their comeuppance.
    Mr. Flip (The Essanay Film Manufacturing Company, 1909), directed by Gilbert M.
    Anderson, featured Ben Turpin as an inflatable figure. He goes to various shops
    and offices, trying to ca the cheeks of female workers. In each of the events,
    he gets rebuffed and punished. The seamstress presses him in the butt with switches,
    the customers in the bar spray selter in his face, and the switchboard operator
    can send electric shocks to the telephone he is using. He is established as a
    character that deserves his treatment.


    A comic strip called *Foxy Grandpa* by Carl E. Schultze featured an old man with
    a pair of rascally grandkids. They would try to play tricks on him but he would
    always turn the tables on his wits. The strip was developed into a vaudeville
    character played by Joseph Hart, who went on to play the same part in silent films.'
