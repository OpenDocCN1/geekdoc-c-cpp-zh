  md: '# CHAPTER 7


    # Context


    Chaplin has his comedy "locations" down fine. It''s easy to be funny in a billiard
    room, or a bakery, he says; a bathroom is inherently humorous; one chuckles even
    at the thought of a taxidermist''s shop; a taxicab, facetiously nicknamed "the
    robber''s delight," is potentially funny, but a ballroom and a horse and buggy
    are synonymous for sighs.


    > Grace Kingsley


    At the beginning of any movie or performance, the first question in the viewer''s
    mind is "Where am I?"When the curtain rises, the audience will immediately evaluate
    the scene before the actors can speak their lines. Movies almost always begin
    with an establishing shot, so the audience can orient itself. Just as people go
    to watch characters that are larger than life, they enjoy stories that happen
    in interesting places.


    Physical comedy is driven primarily by character, and less so by plot. Since the
    plot is important, the context becomes more important, since it provides the elements
    to work with. These elements can range from simple prose to a complex social situation.
    From mundane suburban streets to bizarre surreal worlds, animated characters enjoy
    the widest variety of settings found on film. But at the start of any project,
    it is a blank, and that can be daunting. Charlie Chaplin would have started with
    a place where he could find funny things to do. He would build a set, fill it
    with actors, and begin searching for inspiration with what he found. Chaplin already
    had his character established. He just needed a fresh context to work in. Assuming
    you are starting with a character, you will want to give him a world that would
    work for his style of comedy.


