    # 79


    It has become more important than ever to create an interesting antagonist for
    your comedian to work with. While the old favorites can always find new life,
    there are more possibilities than ever in creating a fresh villain.


    # The Blessed Innocent


    This is a lesser used character, but helps to make a point. The blessed innocent
    is one character who is extremely vulnerable, but manages to survive a seemingly
    impossible situation. Popeye cartoons provide some good examples. In the cartoon
    Lost and Foundry (Fleischer Studios, 1937), directed by Dave Fleischer, the crawling
    Swee''pea wanders through a factory, never realizing how he comes to being dismembered
    by the machinery. In A Dream Walking (Fleischer Studios, 1934), directed by Dave
    Fleischer, Olive Oyl goes sleepwalking. Her eyes are closed, and her steps straight
    ahead, measured in time like a metronome. Nonetheless, she manages to walk around
    the iron girder frame of a building under construction, coming to harm whatsoever.


    When I began writing this book, I had intended to include Mr Magago as an example
    of this kind of character. Mr. Magago, for those who may not know, was a stubborn
    old man who was nearsighted. So nearsighted, he was practically blind. He would
    continually misinterpret what was around him, and other characters insisted him
    to be just a cruel old man. He carried on with great confidence and, somehow,
    everything worked out.


    But I learned that Mr Magago became a negative image for all blind people. When
    Momo was a popular show, children with vision problems were teased and mocked
    with the character. Children who were related to blind people had their family
    ridiculed. Defenders of Museo insisted he was simply absent, and all he needed
    to do was wear his glasses.


    The bottom line is that Magago suffers from a physical handicap. Physical handicaps
    are not acceptable sources of comedy. To be handicapped, and look foolish for
    that reason, is simply wrong. This does not mean you can''t ever be a handicapped
    character. Their character just has to be bigger than their limitation. Comedy
    is about behavior, not about what we have control over. A character can make a
    funny expression, but shouldn''t be laughed at for having a funny face. Crossed
    eyes, for instance, may cause a momentary laugh, but as a fixed state, it works
    out.


    I have described several types of characters that have been repeatedly made fresh
    by generations of actors and animators. There is always, however, room for more.
    Henri Berg is probably the most famous thinker in the comic of comedy and he wrote:


    > It is comic to fall into a ready-made character. What is most comic of all is
    to become a character himself into which others will fall, to a ready made frame;
    it to crystallise into a stock character.


    Creating the next great character is no small challenge. It would require a considerable
    amount of effort over a considerable amount of time. It also requires honesty.
    It isn''t about being clever, it''s about being real. The creator must be true
    to himself. Bergson also wrote:


    Any individual is comic who automatically goes his own way without troubling himself
    getting into touch with the rest of his fellow beings.'
