    reviews all projects in development and production. The great directors at Warner
    Brothers were a band of rivals who had individual styles, learned from each other
    as they went along. Each of them had his favorite writers, story men and animators.
    The silent film shows had teams of gag all throwing ideas. In television comedy,
    scripts aren''t written alone at home. The staff goes to the office, gathers in
    a conference room and works on it together. The "director" is rarely the sole
    creator of the work. If you want to create funny animation, try these suggestions
    for getting help.


    +   - Find co-creators who share your vision, and who you are comfortable with.
    This doesn''t mean you always agree. Far from it, The comfort level will make
    it possible to accept rejection and suggestions more easily. Professionals have
    to take rejection and criticism constantly. Ultimately the question is, can you
    make each other?

    - Find advisors and mentors. These are people who may be able to give insights
    into the process. Find consultants for specialty areas, like editing, dialog or
    cameras and ask for comments on what they know the best.

    - Show the work in progress to average people, especially those in your target
    audience. If you are making it for children, show it to kids. If you want to make
    college students laugh, show it to college students who are not studying film
