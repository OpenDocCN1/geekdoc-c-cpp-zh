    Or, they spend their characters searching for the right one. Once they have the
    character, they let the character create the story. The actor and the character
    become fused. He, or she, cannot be replaced by an imitation. The Marx Brothers
    only play themselves. Ace Ventura. Character driven comedy is a different art
    than the plot driven of representational theater.


    In the golden age of cartoons, writers only helped the basic outline of the story,
    and perhaps wrote dialogue. Artists worked together to develop characters who
    could create a whole story on the thinnest of plot ideas. Some studios, such as
