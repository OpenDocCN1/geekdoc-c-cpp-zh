  md: 'In Chapter 2, I introduced the classic Greek comedy, with its three basic character
    types, the eiron, the alazon, and the bomoloch. A thousand years later, the Italian
    commedia dell''arte built on this principle cast, and expanded their numbers with
    variations on the themes. These were the first archetypes of comedy. Archetypes,
    in this case, are characters who represent a common human behavior. They have
    each simple desires. They want to eat and make love. They desire money. They want
    to impress other people. They don''t want to be a victim. How they handle these
    needs is where the character comes in. Many of them are pretenders. One pretends
    to be educated, but knows nothing of value. One is not as reliable as he aims
    to across. Typically, animators are taught to make characters exactly what they
    are, but humans often try to cover up those things. Comedy actors, by overcompensating
    in the opposite direction, can actually highlight the shortcomings even more.


    These characters live in a typical social structure of class and family. The situations
    are rather simple. Young men and women want to marry, and the elders interfere.
    The characters confuse the situation, either through deception, or by mistakes.
    While their actions can be complex, the audience would have no problem recognizing
    what is driving them. Some of them speak to the audience, and others only relate
    to them on stage. There are four basic classes of characters in the comedy: the
    innamati, the vecchi, the zanni, and a fourth class of solo characters.


    The innamati are the lovers'' class. These are the romantic leads, the young men
    and women who are in love. A full comedy play would use four in two possible pairs.
    Their problems are mostly caused by their parents. While they are generally of
    high status, they have little power to solve their own problems. Unlike the innamati
    did not wear masks. They could be ridiculous for their vanity and obsessive love.
    The comic characters swirl around them trying to interfere with their romance,
    or bring them together.


    The vecchi are the masters and the parents of the innamati. They have power. Figures
    of authority are traditionally types of comedy. Since most people don''t have
    authority, they tend to resist the ones who do, especially when they behave foolishly
    themselves. Like many in power, they are out of touch with what is happening around
    them. They rely on others and can be manipulated by their servants.


    First among the vecchi is Pantalone. He is an old man who is rich and the father
    is to least one of the innamati. He is interested in a young woman for him, or
    disproves of the man interested marrying his daughter. The other characters don''t
    want to make him angry, so they must deceive him. He may be tricked by having
    affairs of his own. He can afford servants, but foolishly trusts him. He is usually
    an old man with long legs. His mask has a hooked nose and bushy eyebrows. He also
    had a pointed beard. His steps are short and he can go only at one speed.


    In Matt Groening''s Simpsons (200th Century Fox) Mr. Burns is the wealthy miser,
    with a long pointed nose like the Pantalone mask. In Despicable Me 2 (Universal),
    directed by Pierre Coffin and Chris Renaud, Felonius Gru is not only a self-described
    villain, but is also the overprotective father trying to keep a boy away from
    his daughter. Gru also has the very same name. It may seem superficial, but it
    is a characteristic that often appears.'
