  md: '# Blows


    Slapstick is all about blows. Blows can be intentional, as in a Punch and Judy
    puppet show, or accidental, such as when a character steps on a rake only to have
    the handle smack in the nose. Much of what was said about falls applies to blows.
    The humor is not in simply having the blow be struck. The art is in what happens
    before and after the blow. It is the set-up, choreography, style, and timing that
    can make people laugh.


    The reaction to the blow is very important. One character might stagger around
    in a silly manner before falling into the mud. Another might howl and rub the
    affected area. Another might freeze and cross his eyes while a six-inch bump grows
    on his head. Charlie Chaplin knocked a brutish fellow in the head with a policeman’s
    stick, and the man stood angrily back at him. The follow up to the blow must be
    at least as interesting as the set up.


