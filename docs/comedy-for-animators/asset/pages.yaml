  md: 'has been killed and is going to heaven. It ends up in the big glass container,
    floating on air, with clouds in the background, further giving the impression
    of having arrived in the afterlife. If you were to view the rabbit alone, it would
    not be funny. It is only in the context of the story that the humor is found.
    Following up on this, Quartermaine''s hairpiece has been sucked into the vacuum
    as well. When Wallace goes to retrieve it for him, he mistakenly pulls out a black
    rabbit, and plops it onto Quartermaine''s head. While pulling a rabbit on a man''s
    head is a gag that would be funny on its, it is also a comic event that works
    perfectly well with the story.


    For animated shorts such as Tunes or the Pink Panther, the audience simply expects
    the character to do all sorts of funny things. They just want to be entertained,
    so there is much more room to create any gag with their style. I want to emphasize
    that neither of them is better than the other. Some people dismiss gags as being
    inferior to comic events. Each have their time and place, and it''s important
    to know the difference. Since the concepts that follow are applicable to both
    gags and comic events, I will use the word gag as a shorthand for both forms.


    # A Statement on Violence


    As much of slapstick comedy involves deceptions of characters doing things that
    would injure or kill a real person, I am compelled to make a statement on violence
    in injury.


    In all physical comedy there is an implied promise that nobody receives physical
    injury. That way, the audience is free to laugh without guilt. This does not mean
    that the characters do not feel pain, Pain can be funny when the actor plays for
    laughs. Acting out pain realistically never happens in slapstick comedy. Cartoon
    characters, of course, are impervious to permanent damage. They can suffer the
    most outrageous disfigurement and return to normal by the next scene. Nearly understands
    that Comic comedy is a parody of violence. It is not supposed to look real.


    As characters can feel pain, they can also be injured for comic purposes. Characters,
    both good and bad, live and animated, find themselves in the hospital, bound up
    in bandages, in plaster casts and sporting black eyes. This often leads to further
    comedy. In the Laurel and Hardy short film County (Hal Roach, 1932), directed
    by James Parrot, the story begins with Ollie in the hospital. He has broken his
    leg and it is elevated and bound up in a cast. Stan goes to visit it, and through
    the rest of the film making things worse for Ollie.


    Like any other, slapstick comedy requires certain skills to work. If it is well
    done, most people find it funny. Some do not, and never will it. Times and tastes
    change. There are lines that should not be crossed, the lines can also move in
    either direction. You absolutely need to know your intended audience. Not all
    cartoons or slapstick comedies are children. With all popular art, it is good
    to get feedback and opinions on your specific work before releasing it.


    My simple philosophy on this is that cartoon characters are acting out human resilience
    using exaggerated action. It is less about physical injury, and more about the
    strength of the spirit to keep moving despite the problems.'
