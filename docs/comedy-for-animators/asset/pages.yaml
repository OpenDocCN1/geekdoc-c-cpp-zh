  md: '# Prediction


    Prediction is a form of mentalism, where the magician can predict some secret
    piece of information provided by an audience member. For action comedy, a character
    can seem to be one step ahead of his opponent. One simply knows what another will
    do. One is the fool, the other is the trickster who is ready to lay the trap.
    Droopy Dog can predict exactly where the Wolf is headed, and get there before
    him. Many says the prankster has foreknowledge of what the victim will do, and
    prepares for it. doesn''t need a logical reason for the trickster to be able to
    do that.


    Characters can be inexplicably endowed with very specific skills, to drive a story.
    In Carat Rabbit (Warner Brothers, 1952), directed by Freleng Bugs Bunny is caught
    up in the American gold rush. All he has to do is walk around the hills and if
    he passes over buried gold his body starts to shake and dance. This talent attracts
    the attention of Yosemite Sam, who wants to profit from it. So lets Sam take advantage
    of him''s greed and impatience, however, are his undoing. Each time he digs for
    gold, something unexpected happens and it is always bad for.


    # Surrealism


    The links between comedy and dreams are very specific, in the mechanism of free
    association, by which the dreamer and the comic hero jump from point to point
    by intuitive leaps and without any necessary logical connection.


    > Maurice Harvey


    Of all the art movements in history, the one animators should know is surrealism.
    Surrealism was founded in the 1920s. Encompassing visual art, writing, music,
    and film, it was influenced by Sigmund Freud''s study of the subconscious, using
    free association and dream analysis. I define surreal art as the juxtaposition
    of unexpected elements, resulting in a dreamlike image. Surrealists felt that
    art could be free of aesthetic and moral preceptions. In others around it, it
    doesn''t have to "meaning". Unlike unfocused, it can just play. Literary examples
    of this predate the surrealist movement, for instance Edward Lear''s Book of Nonsense,
    and Lewis Carroll''s Alice''s Adventures in Wonderland Children love the strange
    characters and bizarre events that Alice experiences, because they were created
    to be fun and exciting. Prior to Lewis Carroll, most children''s literature consisted
    of stories intended to teach moral lessons. It was serious, dreary stuff.


    Wikipedia says about this surrealism:


    Surrealism as a visual movement had found a method: to expose psychological truth
    by stripping ordinary objects of their normal significance, in order to create
    a compelling image that was beyond ordinary formal organization, in order to evoke
    empathy from the viewer.


    Surrealism can be a challenging art form. Many people want art that is just plain
    beautiful, or at least "sense.\ None of this means that surrealism is random or'
