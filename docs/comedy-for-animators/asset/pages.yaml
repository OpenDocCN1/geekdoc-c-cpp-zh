    Beginning in the 1880s, theater manager understood that large portions of the
    public were avoiding the negative environment at the shows. That meant business
    not courting through the doors. He decided to clean up his acts. His we began
    courting with the middle class, people who had money to spend. The we went "dry"
    removing the alcohol. He forbade certain words to be spoken in stage, and women
    had to wear silk tights instead of showing bare skin. Profits soared, more they
    followed suit, and the vaudeville era began. I am describing this history of the
