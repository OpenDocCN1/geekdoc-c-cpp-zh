    Vaudeville was the great expression of American multiculturalism and the birth
    of entertainment as an industry. Beginning in New York City, vaudeville brought
    together the influence of English music hall, circus, minstrel shows, dime museums,
    Yiddish theater, and burlesque. Burlesque was a series of sketches, intermingled
    with chorus girls and strippers. It took place in drinking establishments and
    was obviously aimed at a working-class male audience. The crowd was dense and
    the women were not ladies. Working in the theater, of any kind, had long considered
    a lowly profession. Actors were always on the fringes of society. Their traveling
    means made them perpetual strangers to those. They swept in and tried to get money
    for pretending to be someone else. They laughed, drank, and had no commitments.
    How could they be trusted? The vaudeville historian Trav S.D. points out:


    In the 1940 Disney film Pinocchio the character lighted on the way to show by
