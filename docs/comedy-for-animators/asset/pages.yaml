    # Inventions


    The wacky inventor has been one of the most reliable sources of comedy props since
    the introduction of film. Inventors are useful characters because they, like artists,
    must have creative imaginations. If you can think of some funny use of technology,
    it can be real enough to create laughs. It can be anything from the dawn of the
    industrial age, to the latest genetic engineering.


    To be comic, inventors need at least one or two. First, a ridiculous or trivial
    goal. The application of great thought and works towards some small thing seems
    inherently foolish. Willy Wonka wants to create chocolate and candy. It is a trivial
    thing, but people can relate to it. If the goal is not trivial but potentially
    valuable, then they definitely need an unusual method of achieving the goal. It’s
    great if they have both the ridiculous goal and the unusual method.'
