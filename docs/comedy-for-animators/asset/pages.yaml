    # Rowan Atkinson


    ![](img/deb498c4939dd89f4d36bf884d96d667_62_0.png)


    Rowan Atkinson was studying electrical engineering at The Queen''s College, Oxford,
    when he decided to try out acting. He and fellow student Richard Curtis created
    skits for theater revues. At one point he challenged himself to create a silent
    act. He stood in front of a mirror and began working out how this character would
    move. Originally, he called that character,"the wiggly man." In searching for
    a better name, Atkinson and Curtis considered the names of birds, and vegetables.
    They settled on Mr. Bean.'
