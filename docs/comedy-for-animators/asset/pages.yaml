  md: '# INTRODUCTION 5


    Verbal comedy tends to age, so a book of jokes from 1916 would probably be completely
    unfunny today. Physical comedians work the realm of the human body, essentially
    unchanged for thousands of years. This is why audiences didn''t need to understand
    the to enjoy Chaplin, and is why he was the first superstar. The stories were
    little man vs. big world, and everybody could relate to it. Cartoon characters
    who can communicate without words have also been widely accepted and beloved.


    The rewards of success are gratifying. Making an audience laugh is a validation
    that only a comedian can experience. There is another potential benefit too: money.
    The history of comedy is not just the history of art, it is very much the history
    of a business. A musician can enjoy playing his instrument, a painter can decorate
    her own walls, a dancer can simply peel in the forest, and nobody is to see him,
    it is not funny. In studying the comedians of the past, I routinely learned about
    their financial successes and failures. Comedy is easily judged by the reaction
    you give. It requires finding and holding an audience. Hundreds of years ago,
    if you were putting on a show in the street, and you didn''t make people laugh,
    you would go hungry night. Make them laugh, and have more the next day, and you
    can feed your family.


    So where does one learn the principles of successful comedy? Historically, in
    the world of live theater, you were taught one on one. Children were born into
    theatrical families and were immersed in the life. Others joined the show and
    worked all the behind the scenes jobs, practicing on their own time and hoping
    for a chance. To work in vaudeville, you watched the acts and try to develop something,
    but better. Some will say that you can''t teach comedy you either have it or you
    don''t. I do not agree, and neither did silent film Harold Lloyd. He built his
    fame with simple hard work. He said:


    > Look, all the comedians of my day had to study. You studied comedy, it just
    didn''t happen, believe me.


    Actors are still studying it. Today, around the world, there are small programs
    that teach physical comedy. Students begin with the same basic exercises; taking
    age-old challenges and stepping up to see what they can do with them. Students
    will devise new characters and each will have a fresh way of dealing with a situation.
    History will show that, in physical comedy, the concepts are regularly reviewed,
    and renewed, by generations of comedians. Rowan Atkinson, the actor responsible
    for Mr. Bean, has this to say:


    In visual comedy we see the same ideas up and again. The wit of the comedian often
    lies in creating new variations of old ideas. He can do this because the success
    of any comic idea depends not on the skill with which it is executed, but more
    on the attitude with which it is performed. New attitude—new joke.


    Yes, old ideas get repeated and again. Do not feel free to create something that
    is absolutely original. Many artists have painted bowls of fruit, but each is
    different. In slapstick, it''s all been done before. Many'
