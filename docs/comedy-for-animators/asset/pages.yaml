  md: '# 82 COMEDY TEAMS


    They could also be in the military, or they could regularly visit the same place.
    They may just live near each other. They could be roommates, neighbors, or simply
    live in a very small town where everybody knows everybody anyway.


    Ensembles in animation also need a reason to be together. The world of The Simpsons
    includes multiple arrangements of characters. The Simpsons are of a family, by
    Homer has separate time with his associates, and he has buddies at Moe''s Tavern.
    The kids have their fellow students and the staff at school. Since animation does
    so well with non-human contexts, there are broader possibilities. The idea of
    neighbors can include animals confined to a zoo enclosure, as in the film Madagascar
    (DreamWorks, 2005) directed by Eric Darwin and Tom McGrath. The group can be a
    superhero team, like Powerpuff Girls or Teenage Mutant Turtles.


    Another way to create an ensemble story is have a bunch of unrelated people brought
    together by a significant event. Prime example of a significant event is found
    in the opening of the film It''s a Mad, Mad, Mad World (Casey Productions, 1963),
    directed by Stanley Kramer. On a winding mountain road, a speeding driver passes
    several blowing his horn. He is driving very dangerously and ultimately runs off
    the road and crashes down a hill. The drivers in all other cars stop, and their
    passengers all get out to investigate. Now, a group of people with nothing in
    common are brought together. When the driver dies, they have a clue to a buried
    treasure. Within minutes, they are all racing to the first to find the treasure,
    and hilarity ensues. The entire film is one long chase.


    In ensemble stories, the situation becomes very important as it keeps a general
    direction to the stories. In sort of comedy, there is not just one story, but
    multiple points of view that explore it. This allows for somewhat complex storylines.
    The Simpsons, for instance, has at least two storylines on each episode. Scooby-Doo
    (Hannah-Barbera Productions), Scooby and Shaggy often split up from the others
    and have their own experiences of the mystery. These plots need to be carefully
    joined to maintain suspense, cutting away to leave the audience hanging on the
    outcome. Occasionally the story lines cross, but they must all be tied up in the
    end.


    Sometimes the ensembles become so successful that they become a true team. What
    defines a comedy team? Basically, it''s just a name that people recognize. They
    are still an ensemble. Once the name of a group becomes fixed, like Laurel and
    Hardy, or the Three Stooges, it becomes a valuable brand. Audiences will return
    to see their work because they are confident it will be like what they enjoyed.


