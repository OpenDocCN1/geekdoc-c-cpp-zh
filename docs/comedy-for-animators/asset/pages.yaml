  md: '# SHADOW AND LIGHT


    Mr. Bean was developed through hundreds of shows before being brought to television.
    Working with collaborators, the character continued to grow as each season progressed.
    He would choose a situation for Bean to find himself in, then suggest at least
    five different things that might happen. Like most physical comedians of the work
    is a combination of meticulous planning and on set improvisation.


    In Mr. Bean, Atkinson drew upon his appreciation for French comedian Jacques Tati.
    Tati worked through his character Mr. Holut, an eccentric fellow who found friendship
    with children and dogs, who had flirted with pretty girls. But she was out of
    sync with the fast-paced world of adults. He describes Tati’s work as “The comedy
    of not much happening” The style is slapstick or acrobatic, but is still highly
    visual. His daily activities are unexpected in ways. Everyone around him pursuing
    their normal lives, while Holut shows up, everyone goes away. He unintentionally
    sows confusion and dismay. Where others get frustrated with the situation, Holut
    finds the comedy. If he realizes he has done something wrong, he is masterful,
    and inspired Sylvain Chomet to create his animated film The *Illusionist* (Pathé,
    2010), which was based on an unproduced Tati screenplay.


