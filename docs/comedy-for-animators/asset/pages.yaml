    The zanni were the lower class characters, the servants. Zanni is the root for
    the English word zany. They were expected to be the funniest of the cast. Originally,
    Zanni was the name of one servant, but eventually it was subdivided into a handful
    of named characters with different traits. Later comedy plays would always have
    at least two of them, the first and second zanni. The first zanni was mischievous.
    He was also the intermediary with the other characters in the story. The second
    zanni was clumsy, stupid and silly. He was the assistant to the first, and being
    stupid all have ample room to screw things up. The zanni can speak directly to
    the audience, who tend to like them. The hierarchy of the zanni can be linked
    to the hierarchy of Looney Tunes characters. Bugs Bunny is always the first zanni,
    Daffy is always the first, and Porky is second. Bugs in a short is a short with
    Daffy Duck and Porky Pig.


    The role of the zanni is mostly found today in what you called the sidekick. The
    zanni of the comedy were always servants to someone more powerful. Sidekicks are
    friends, helpers, secondary characters who are connected to one of the main characters.
    pets, sometimes messengers, and always comic. It is not uncommon for them to be
    silent, as Flit the hummingbird, and Meeko the raccoon from Pocahontas (Disney,
    1995), directed by Eric Goldberg and Mike Gabriel, Abu the monkey from Aladdin
    (Disney, 1992), directed by Ron Clements and John Musher, the pascal chameleon
    and Maximus the horse for Tangled (Disney, 2010), directed by Nathan Greno and
    Howard Bacon.


    Having a sidekick raises the status of the main character. It means he is or she
    is not, they have an ally. They also have to talk to them, which allows for some
    exposition of what the character is thinking. But because the sidekick is so often
    mute, they have limited influence in the story.


    Villains need to have sidekicks that can talk. The evil Jafar from Aladdin has
    his talking parrot, Iago. Villains often share their evil plans with someone,
    yet When the sidekick does something foolish, they will try to explain themselves,
    which leads to being berated by the boss. One way to display whether a character
    is good or bad, is by how they treat the fool. Villains are mean to them.'
