    # Creating Constraints


    Animation has the capacity to do absolutely an artist can imagine. If you have
    the tools and team to do whatever you can think of, it is easy to get carried
    away. It can be a problem, because comedy thrives on simplicity. In creating your
    stories, you should set some boundaries. Define the world and what the characters
    are allowed to do, and what they are not allowed to do. This is particularly important
    if you are creating a series. A reliable and familiar world will help the audience
    relax and enjoy the events. It will also help you to focus on specific directions.


    When Chuck Jones created his Coyote and Road runners, he set what called disciplines.
    These disciplines were important in maintaining a consistent style of comedy.
    Here are his ten disciplines.


    +   - The Road Runner cannot harm the Coyote except by "beep beep" to scare or
    surprise him off a cliff. No outside force can harm the Coyote—only his ineptitude
    or failure of Acme products. Trains and trucks were the exception from time to
    time.

    - The Coyote could stop anytime—if he were not frantic. (Repeat: "A frantic is
    one who redouilles his effort when he has forgotten his aim"—George Santana.)

    - Dialogue is strictly forbidden, "beep beep," and yowling in plain.

    - The Road Runner must stay on the road—for no other reason than that he''s a
    roadrunner.

    - All action must be confined to the natural environment of the two characters—the
    southwestern desert.

    - All (or at least almost all) tools, weapons, or mechanical conveniences must
    be obtained from the Acme Corporation.

    - Whenever possible, make gravity the Coyote''s greatest enemy (e.g., falling
    off a cliff).

    - The Coyote is always more humiliated than harmed by his failures.

    - The audience''s sympathy must remain with the Coyote.

    - The Coyote is not allowed to catch or eat the Road Runner, unless he escapes
    with the grasp.

    - You don''t want them to be gods. It is interesting to see them deal with challenges
    with only the tools they are given.'
