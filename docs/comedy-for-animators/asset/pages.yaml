    hat, flexible cane and the little mustache he preferred. As Chaplin tells:


    I had no idea of the character. But the moment I dressed, the clothes and the
    makeup made me feel the person he was. I began to know him, and by the time I
    walked onto the stage he was fully born.³


    Audiences responded instantly. A few years later Chaplin was an international
    sensation, and he achieved it with all words.


    No-stand comic has ever achieved such fame. The stand-up comic tells jokes, with
    minimal effort, and talks in one language. Jokes often depend on shared understanding
