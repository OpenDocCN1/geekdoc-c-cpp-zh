    # Levitation


    On stage levitation tricks are often done on "hypnotized" subjects, and rely on
    hidden supports. Animators can suspend the loft of gravity anytime they like,
    so levitation by itself doesn''t mean very much. First, when a character is momentarily
    hovering, he or she can have extra time for expression. A frightened character
    can spin his feet so the audience can appreciate his terrified expression before
    he falls. When off the cliff, he is given a beat or two to look plaintly at the
    camera. It''s a simple way to help the audience experience the moment, and anticipate
    what''s about to happen.


    Sometimes a trickster character is falling, he has the ability to stop in mid-air.
    This happened in A Star is Bored, when Bugs Bunny is on shooting a movie. He is
    flying a jet fighter directly towards the ground. Just as he is about to be hit,
    the director yells "cut!" The plane stops inches of crashing and just hangs. Bugs
    gets out of the plane so his stunt double, Daffy Duck, can step in and take over
    the crash.


    We can include various unorthodox methods of flight under the heading of levitation.
    The Coyote concocted numerous ways to take to the air. In story development, you
    can assemble some ridiculous pieces of equipment that could conceivably lift or
    power someone through the air. Figuring out can go wrong is probably not that
    difficult.


