  md: '# Comedy for Animators


    While comedy writers are responsible for creating clever scripts, comedic animators
    have a much more complicated problem to solve: What makes a physical character
    funny?** Comedy for Animators breaks down the answer by exploring the techniques
    of those who used their bodies to make others laugh. Drawing from traditions such
    as commedia dell''arte, pantomime, vaudeville, the silent and modern film, animators
    will learn not only to create funny characters, but also how to execute gags,
    create a comic, and use environment as a character. Whether you''re creating a
    comic villain or a bumbling sidekick, this is the one and only guide you need
    to get your audience laughing!


    +   - Explanation of comedic archetypes and devices will inspire and inform your
    creative choices.


    +   - Exploration of various modes of storytelling allows to give you the right
    context for your story and characters.


    +   - Tips for creating worlds, scenarios, and casts for your characters to flourish.


    +   - Companion website includes example videos and further resources to expand
    your skillset—check it out at www.comedyforanimators.com!


    Jonathan Livers delivers simple, fun, illustrated lessons that teach readers to
    apply the principles of history''s greatest physical comedians to their animated
    characters. This isn''t stand-up comedy—it''s the falling down and jumping around
    sort!


    **Jonathan Lyons earned his BFA and created an award winning student film at New
    York University, where he studied noted animation and author John Canemaker. After
    moving to California he earned living in traditional animation, before transitioning
    to computer graphics and animation supervisor for a dozen Pillsbury Dough commercials.
    While working at Industrial Light & Magic he earned two Clio Awards for commercials
    and went on to work on the first Pirates of the Caribbean films. From the workshop
    for Pee-Pee-Playhouse to teaching animation at the university level to animation
    on Seth MacFarlane''s feature film Ted, Jonathan has been employed in animation
    for over 25 years. During those years he studied the work of great physical comedians
    simply for the love of the art. He applied the principles to Floyd the Android
    character in two short films that have been screened in 50 film festivals around
    the world, and won a handful of awards. He is happy to share with you what he
    has learned from watching the classic comedians, and reading about the thousand
    year history of character comedy.'
