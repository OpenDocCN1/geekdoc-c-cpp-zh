    In short, representational theater is controlled by writers, while presentational
    theater is created by performers. You could read the script of a dramatic play,
    and enjoy the story. But reading a Laurel and Hardy script would be a waste of
    time. In vaeville, each act was responsible for its own portion of the program.
    Nobody told them that they do. They were their own writers and directors. Part
