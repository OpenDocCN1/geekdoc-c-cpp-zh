  md: '# CHAPTER 8


    # # Structure, Style, and Theme


    This chapter is about creating stories for funny cartoons. One of my big reasons
    for wanting to write this book is to present a counterpoint to conventional film
    storytelling. In animation, there is an emphasis on "story" that has led to adopting
    standard narrative formulas that don''t take advantage of what animation can do.


    Hollywood is filled with thousands of aspiring screenwriters. They spend money
    to buy books and take classes that will help them learn the craft of writing the
    salable film screenplay. Those are the sorts of books that feature film screenwriters
    should read. The small number of writers employed to work on feature animated
    films are well versed in mythic archetypes, three act structure, character arcs,
    backstories and script formatting. These elements can be included in long animation,
    but for short form cartoons, there usually isn''t enough time. In music hall and
    vaudeville entertainment, performer-based comedy is more concerned with the connection
    between comedian and audience than it is with completing a checklist of story
    points. Some of the things in this chapter will apply to long form storytelling,
    but my intent is to provide an alternate approach to the rules laid out for Hollywood
    screenwritenrs.


    I should illustrate what I am saying about the difference between conventional
    film narrative and performer-based comedy. As an example of what conventional
    film narrative is like, below I paraphrase the sort of thing I have read in many
    books and articles on screenwriting:


    Stories should have a protagonist with a goal, who also has at least one flaw.
    Then you need an adversary, or a problem, that seems insurmountable to the protagonist.
    Ultimately, the protagonist overcomes his flaw, and succeeds despite the difficulties.
    In the process, he learns a lesson about himself and changes for having the experience.'
