    The arrival of motion pictures started a series of challenges for vaudevillians
    and in general. Many believed that cinema was a short-lived fad, and chose to
    ignore it. Those who only had a specialty act had enough material for one film,
    and it was over. A few, however, transitioned to movies and became more successful
