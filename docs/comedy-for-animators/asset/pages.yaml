    # Buster Keaton


    For me, it Buster Keaton who triggered my lifelong love of slapstick comedy. A
    screening of Seven Chances (MGM, 1925) in my high school auditorium left a huge
    impression on me. I can still remember laughing at that movie. I laughed so hard
    my cheeks cramped up, and I could have fallen out of my seat.

    uster Keaton was often referred to as the great stone face, because he showed
    almost no emotion. Images of him smiling were extremely rare. While he did show
    very, subtle expression in his eyes and brows, he was an actor almost completely
    of the body.\ Joseph Frank Keaton was born to his mother Myra and father Joe Keaton
    on October 4, 1895. They were vaudeville performers who happened to be in Piqua,
    Kansas when Myra went into labor. He went into lab. Buster joined the family on
    stage, and they later nicknamed “Buster” which is vaudeville slang for a hard
    fall. At three years old, Buster was busy himself with some activity, and little
    Buster became The Three Keat. In the act, his father would fuss him with some
    activity, and little Buster would mishave and harass his father. Joe would get
    angry and toss the boy around the stage and into the orchestra. Myra would play
    the saxophone, which probably accentuated the action by timing with it. It was
    a shockingly rough and tumble act, and it was where Buster learned to fall without
    being hurt. His father ever sewn a suitcase into his jacket to help with the throwing.
    Sometimes Buster would laugh during the action, and they found the audience respond
    well as he kept a straight face. That led to his always having the deadpan expression
    that would become his trademark. It was a marked contrast to the common acting
    found in Sennett films, that included much facial touching as humanly possible.'
