    # Props


    I know a man who claims that all inanimate objects are perverse. He says that
    things deliberately hide from him. I believe this this man has discovered an important
    new law.


    Mack Sennett¹


    Prop is shorthand for property, which is any movable object in the scene. The
    term is often used specifically to describe something handled by an actor, which
    is how I am using it here. Props are anything the actor or interacts with. It
    can be as small as a needle or as large as a steamship. It can be a single item
    or a preposterously complex machine. Props are hugely important in physical comedy,
    and this chapter will look at some of the common ways they can be used.


    There are some comedics who specialize in working with props. Classically, they
    are called eccrics. The eccentric clown is a topic I could have placed in the
    chapter on characters, or in my discussion of gags and comic events, or even as
    a comedic structure. The comedic use of props is a prop large enough to warrant
    its own chapter. Here is the definition of an eccentric from John Towers:


    A solo clown whose comic effects are derived from his fascination and frustration
    with objects, rather than out of any conflict with his fellow clowns.


    Eccentric comedy may actually be the one people can relate to. The best comedy
    is found in normal life, and we recognize the little struggles; fixing a leaky
    pipe, moving furniture, assembling a tent. We understand how things can go. Eccentric
    comedic explores ways of dealing with the world. This is one of the fundamental
    skills a physical comedian learns in training. They are a common item, and tasked
    with finding funny things to do with. It is a useful way to practice improvisation.
    It requires imagination and a lot of trial and error to work out what will make
    people laugh. Different characters will have different attitudes when dealing
    with things. One character might have an emotional reaction, like Donald Duck
    when he gets frustrated and angry. Another character might be embarrassed by his
    failure. Another might accept the momentary setback and try again. What really
    matters is having a distinctive style.'
