    # The Anatomy of Mirth


    For an overview of gags, I am using the anatomy of mirth defined by M. Wilson
    Disher in 1925. This is an enjoyable description of essential physical comedy.
    As physical comedy is less influenced by time and style, it is still very relevant.
    Disher describes this way:


    If the anatomy of mirth is vissected without reference to psychology, the primary
    jokes appear to be divisible into six kinds. To give each a name require some
    philological ingenuity. They can be indicated, however, by these terms: Falls.
    Blows. Surprise. Knavery. Mimicry. Stupidity.^3


    I love the formal language to denote silliness. Each of these is a category of
    gags, and characters will specialize in certain characters, and may give some
    together. No single character uses all of them, as some are given to fools and
    others to tricksters. A pair of antagonists might make them all work in a single
    act, but it is advisable to build the comedy around a chosen style. Audiences
    like to feel consistency in characters.


    # Falls


    The proverbial banana peel reminds us we are subject to gravity; gags are the
    most basic way for a character to lose their dignity. The more pompous the character,
    the funnier it is when or she falls. The characters mostly bring it upon themselves
    in a seemingly magical act of instant karma. Good guys can fall, but it''s funnier
    when it is someone dislikeable.'
