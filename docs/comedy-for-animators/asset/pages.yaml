    145


    **Played Straight**: This is the basic trope that almost everyone recognize.


    Popeye is losing a fight, eats his spinach, gets super strong and wins.


    **Justified**: The trope has a reason In-Universe to be present.


    Popeye signs an endorsement deal with a spinach producer, and must eat the spinach
    to get his paycheck.


    **Inverted**: The trope (or its elements) are reversed. Some tropes have more
    than one possible inversion.


    The inversion of the Popeye spinach gag is to have Bluto eat the spinach. This
    happened in *Hospitality* (1937). The goal of the fight is to choose who goes
    into the hospital to be nursed by Olive. Popeye feeds Pluto, and Bluto beats Popeye,
    putting him into the hospital.


    **Subverted**: A trope is set up to occur, but then the writer pulls a fast one
    on the audience and the trope does not occur after all.


    In *Never Sock Baby* (1939), Popeye and Swee''Pea are hanging over a waterfall.
    Popeye pulls out his can of spinach, the triumphant start, but the can is empty!
    Popeye and Swee''Pea plummet over the falls. Popeye wakes up at home, having dreamed
    the entire thing.


    **Double Subverted**: The trope is Subverted, and then Subverted again so that
    it occurs after all.


    In *A Date to Skate* (1937), Popeye has no spinach, so it appears the gag won''t
    happen. But he asks the audience for help, and a silhouette of an audience member
    tosses into the scene. Trope completed.


    **Parodied**: The form of the trope is twisted and in a silly way, specifically
    for comic effect.


    During an episode of *The Simpsons*, Homer drinks a can of beer, and he has the
    same reaction Popeye does with spinach.


    **Deconstructed**: The intentional use and exploration of the trope, played straighter
    than usual in order to show the trope poorly thought out, impractical or unrealistic.
    The deconstruction is usually much less than the source trope, although not always.


    What if Popeye was about to eat the spinach, Bluto took out his own can of spinach,
    and threatened to him. That could lead to a discussion of spinach eating as a
    sort of arms race, with nothing but destruction ahead. At this point they shake
    hands and call it a draw.


    **Reconstructed**: A reconstruction resembles the Deconstruction into something
    that resembles the original trope, but would still work in reality. In other words,
    this is the inversion of a Deconstruction.


    Following the deconstruction above, Popeye calls Bluto''s bluff. Popeye and both
    eat the spinach. But Pluto can''t stand the taste and spits it out. Popeye wins.


    **Zig-Zagged**: None of the above, or more than one of the above; covers miscellaneous
    variations. Examples include a trope that gets triple subverted, inverted and
    played straight at the same time, or well, just done confusingly.'
