  md: '# Theme


    A great many comedies have been built around two things: a character and a theme.
    Theme is not very different from context, but is more about actions than about
    place. Themes are activities that are commonly known to the audience, or at least
    understood. The idea is for the comedian to explore the topic through his own
    unique point of view, and find fresh ideas that nobody has done before.


    The process is simple. Choose a theme, and make a list of things such as what
    props are found, common character types associated with it, what the environment
    is like, and what typically happens. Then explore the possibilities of doing things
    in unusual ways, and exaggerate the known characters.


    Many Goofy cartoons were created this way. Goofy is an all-purpose slapstick comedian,
    and was sufficient to be the third banana between Mickey and Donald. On his own,
    he is not the strongest character, so Disney put him into shorts with themes with
    no real stories at all. With Goofy trying gymnastics, hockey, baseball, football,
    tennis, swimming, and basketball. Over time he became a generic suburban father
    character, engaged in normal activities like catching a common cold, owning a
    dog, and taking vacations. Interestingly, he had films about dealing with bad
    habits as smoking, gambling, overeating, and aggressive driving. Mickey Mouse,
    on the other hand, would never have shown in those activities as the corporate
    image, he had to maintain certain certainties. The public has been known to complain
