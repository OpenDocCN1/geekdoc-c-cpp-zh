    In presentational theater that we can find the most energetic characters to study.
    Both forms of storytelling are enabled in animation. The work of the animator
    is different in each. In representational work, the animator must follow the text
    and play his or her part in the story. In presentational work, the animator makes
    the decisions about what the characters do, and is far more responsible for their
