  md: '# CHAPTER 1


    # Introduction


    Figure 1.1 Children begin to laugh before they can speak

    Courtesy Everett Collection.


    ![](img/deb498c4939dd89f4d36bf884d96d667_13_0.png)


    Laughter is fundamental to human existence. Babies begin to laugh before they
    can talk, so it''s safe to assume humans would make each other laugh before we
    had formal language as well. I imagine that back in prehistoric times, a caveman
    dropped a rock on his foot and hopped around in pain, and another caveman laughed
    at him. Later in the evening, gathered around the fire, the caveman who re-enacted
    the scene for the others who weren''t there, and people laughed with him. Each
    time it re-enacted it probably got amplified, with ever more funny faces and ridiculous
    howling. Every night the others would urge him to do rock-dropping-on-the-foot
    business again. With a little improvement each time, he could probably get several
    shows of it before people had seen it enough. Then, he had to find someone new
    to make fun of, or make something up.'
