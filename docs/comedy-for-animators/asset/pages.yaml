  md: '# Foreword


    Dying is easy. Comedy is hard.”The actor who adlibbed that aphorism on his deathbed
    (it is attributed to two Edmunds of different eras: Kean and Gwenn), spoke the
    truth. However, Jonathan Lyons’ entertaining analysis of cinematic laugh-makers,
    both live-action and animation, is easy and informative.


    A professional animator experienced in both hand-drawn and CG animation, and a
    longtime and student of physical comedy and comedians, Lyons knows well whereof
    he speaks. His book offers a cogent and knowledgeable guide to book “presentational”
    comedians and animators who create characters who make with the funny.


    A succinct history of the origins of comedy opens the discussion, including analysis
    of ancient Greek satyr plays, medieval morality plays, commedia dell''arte, vaudeville,
    and on the silent movies of Chaplin, Lloyd, Keaton, Laurel and Hardy, et al.


    The book explores human behaviors and empathy, awareness of playing and to an
    audience, as exemplified by Atkinson, Cleese, Seinfeld, Tati, Chan, the Three
    Stooges, among others, as well as their animated counterparts, e.g., the Simpsons,
    Bugs Bunny, Wile E. Coyote, and the wide world of tough-makers.


    “All the comedians of my day,” Harold Lloyd once said, “had to be students of
    comedy. You studied it didn''t happen, believe me.” Lyon’s informative, articulate
    book offers a solid grounding in comedy foundations and principles that once understood
    would undoubtedly inspire a new generation of animators.


    John Canemaker


    Oscar-winning animation director, author of 12 books on animation history, professor/head
    of the animation program at NYU Tisch School of the Arts.


    27 March 2013'
