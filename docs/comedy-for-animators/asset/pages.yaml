  md: '# CHAPTER 9


    # Gags and Comic Events


    What, all this junk, the yak-yak-yak? It''ve broke my heart! Dialogue gags are
    a dime a dozen, but a good sight gag is hard to come by.


    Tex Avery¹


    To get laughs with animation you have two choices. Gags and jokes. A gag is intended
    to create laughter with visual humor. A joke uses words for the same purpose.
    Tex was right, gags are hard to come by, requiring considerable time to develop
    and integrate into the action in a natural way. American television has relied
    on verbal jokes because they are far more efficient in terms of production. A
    group of writers can sit around a room and pitch storylines, then fill in some
    jokes, and before you know it the script is ready and there is only limited expectation
    on the artists to make it good. Visual gag requires much more time to invent,
    develop, and work into the action. Jokes don''t really affect the storyline, whereas
    visual stunts will physically change the situation for the characters. Gags need
    careful timing and acting, which require more time than lip-syncing words.


    One aspect of visual comedy does it make easier. A joke once is used up, whereas
    a good sight gag can be successfully reused. That is why comedic actors will reach
    back into their memory for gags to reuse. Previously rejected might fall into
    place later. The comedy dell''arte actors had their lazzi (comic routines) ready
    at all times. Bugs Bunny used his trick of dressing up as a female, and nobody
    complained that he''d done already. That was part of his lazzi, each time a little
    different. Reused material must feel like spontaneous events, not pulled from
    a catalog and dropped in to fill the. If you can identify the root idea of a gag,
    it can be modified to suit a new situation or a different character. By reading
    this chapter and watching as much physical comedy as you can, you will have a
    foundation of ideas to get started.'
