    Music hall was lively entertainment for the working man. As the cities grew in
    the industrial age, the people needed places to have fun. It was very much the
    same in the United States, with the the worlds of circus and vaudeville.


    # Circus


    There is no performer with more freedom than the clown. Anything goes, as long
    as it makes people laugh. When a clown creates his act he has no limitations.
    The world is as open to him as it is for animator sitting down to draw a storyboard.
    A great many have indicated cartoons as being one of their inspirations. According
    to Earl Shipley, a clown with the Ringling Brothers, Barnum and Bailey circus
    during the 1920s:


    > The work is like cartooning, with the exception that the artist in the circus
    is his own picture.


    Originally the circus was a show of horses running in a ring with riders performing
    stunts. A clown would pose like a drunken audience member and demand to ride one
    of the horses. The "dunk" would not manage to stay on the horse, but those "accidentally"
    perform amazing stunts. This is again an example of a character who are being
    inept, yet has surprising abilities. Stunts on horseback are dangerous and that
    engages the audience even more. He must be able to be a convincing actor, when
    playing the drunk, and a skilled acrobat.


    In the days of the ring circus, clowns could easily verbal humor, sometimes being
    more than stand-up comics. But as competition increased, a second ring was added,
    and then a third, as promoters learned audiences gravitated to the more spectacular
    show. As the circus grew, clowns became relatively smaller. To be visible to the
    huge audiences, they had to act in a broader manner, with subtlety of character.
    They also had to move fast to maintain the energy of the show. At their low point,
    they were sometimes reduced to running and doing some quick pratfalls to fill
    time while the equipment was being changed.


    Clowns had undergone a renaissance along the circus. It began when the Ringling
    Brothers, Barnum and Bailey (RBBB) circus realized they needed to start new things.
    RBBB ran a Clown College from 1966 to 1996 and trained over 1400 clowns. It was
    intended to develop talent to work in the style of the RBBB shows. But it also
    gave a few people a strong foundation in the art of physical comedy, and they
    were able to spread out to other performing arts. Well-known graduates of the
    Clown College include Steven Banks, animation writer for Sponge SquarePants, and
    Steve O, of the MTV show Jacks. Irwin graduated in 1974, and was not to be only
    a successful clown, but an winning actor of stage and screen. His stage work had
    earned him fellowships from The MacArthur Foundation, The Guggenheim Foundation,
    and The National Endowment for the Arts. And to top it all, he was Mr. Noodle
    on Sesame Street. Irwin expressed the drive to get out in front of an audience:


    Most of us wanted to be performers for the most noble—and ignoble—reasons. Rather
    waiting for a part in a play, we created our own stuff. It was a way of getting
    out of the straitjackets of the times.'
