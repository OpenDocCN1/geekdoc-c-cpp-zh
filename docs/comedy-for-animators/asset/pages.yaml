    Surrealism isn’t necessarily bizarre. It can definitely be funny. The original
    surrealists were fans of silent comedy, particularly Buster Keaton. While Keaton
    avoided impossible gags, he often worked to achieve things that were highly improbable.
    Keaton devised an imaginative comedy that found ways to make crazy things happen,
    but that still feel just inside the realm of possibility. For example, during
    the cyclone sequence of *Steamboat Bill Jr.* (1928), Keaton is in a bed inside
    a hospital. The cyclone lifts the walls and roof off the building, leaving Keaton
    in bed, but outside. He jumps out of the bed, things get worse around him, so
    he jumps back into the bed and pulls the covers over his head. The wind causes
    the bed, which is on wheels, to roll down the street and into a stable filled
    with horses. When Keaton pulls the covers off, he is in a completely different
    place. Keaton’s mild responses to these incredible events suggest that he is trying
    to figure out happened. The audience, in turn, follows his lead and understands
    his confusion. It is easy to see this as some dream he is experiencing. Robert
    Knopf emphasizes Keaton’s use of classical composition in his shots when describing
    Keaton’s moments:


    As Keaton places impossible gags as these in and more realistic environments,
    he produces moments that straddle the line between dream and reality, the line
    that surrealists call the marvelous.⁶'
