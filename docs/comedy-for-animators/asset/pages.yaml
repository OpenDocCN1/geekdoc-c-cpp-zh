    # Mimicry


    Mimicry is any form of pretending to be someone, something, else. There is an
    entire category of stand-up comedy built around doing impressions of famous people.
    Occasionally Bugs Bunny would pretend to be a well-known person, such as in Buccaneer
    Bunny (Warner Brothers, 1947), directed byriz Freeleng, when he presents himself
    to be Captain Bligh, as played by the actor Charles Laughton. But that is only
    a small portion of the ways a comedian can use mimicry.


    Mimicry is a playful kind of comedy, but challenging. The greater the skill of
    the actor, the greater the comedy. It requires an ability to see and repeat the
    many small things that someone else would. If it is done well, the audience immediately
    understands what is going on. The work of mimicry would fall primarily to the
    animator, rather than the story person.


    Probably the easiest form of mimicry is to intentionally mock someone who is in
    the same scene. Simply following and exaggerating what the other person does can
    be quite entertaining. Usually it is a way to show disrespect towards the other.
    The sheer rudeness is what makes people laugh.


    Another form of mimicry could be blending in. Charlie Chaplin''s Tram would pretend
    to be almost any person he needed to, such as a person, a policeman, or a parent.
    Audiences admired Chaplin''s skill, and Tram''s fearlessness. In the movie Rango
    (Paramount, 2011), directed by Gore Verinski, the titular chameleon used mimicry
    when entering the town of Dirt. He didn''t want to stand out and attract attention,
    so his first concern was to blend in. Then he adopted a cowboy stance and imitated
    their walk. When confronted with belligerent locals, he took the persona of a
    skilled gunsfighter, changing his voice, language, and action. After all, he was
    an aspiring actor. The talent helped him live to another day.


