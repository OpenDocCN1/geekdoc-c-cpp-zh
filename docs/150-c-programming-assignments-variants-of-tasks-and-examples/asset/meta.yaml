- - '##'
  - 7. 字段 `first` – 正实数，商品单价；字段 `second` – 正整数，商品数量。实现方法 `cost(ob)` – 计算单种商品的价格，`costTwo(ob1,ob2)`
    – 计算两个对象的总价格。
- - '##'
  - 8. 字段 `first` – 正整数，每100 克的热量；字段 `second` – 正分数，以克（kg）为单位的质量。实现方法计算单个产品的总热量，以及
    `compareTwo(ob1,ob2)` – 比较两个产品的热量。
- - '##'
  - 9. 字段 `first` – 分数（分子、母），范围的左边界；字段 `second` – 分数（分子、母），范围的右边界，实现方法 `rangeCheck()`
    检查指定分数是否在 `[first, second]` 之间。
- - '##'
  - 10. 字段 `first` – 整数，范围的左边界；字段 `second` – 整数，范围的右边界。实现方法 `rangeCheck()` 检查数字是否在范围内，`rangeUnion(ob1,ob2)`
    – 输出范围后的整数。
- - '##'
  - 11. 时间间隔字段：`first` – 正整数，小时；字段 `second` – 正整数，分钟。实现方法 `minutes()` 将时间转换为分钟，`shiftForward()`
    和 `shiftBack()` 增加/减少。
- - '##'
  - 12. 字段 `first` – 实数；字段 `second` – 整数，指数。实现方法 `power()` 将第一个数升到 `second` 次。不要使用
    math 库。
- - '##'
  - 13. 线性方程 `Ax+B=0`。字段 `first` – 分数（分子、母），系数 `A`；字段 `second` – 分数（分子、母），系数 `B`。实现方法
    `root()` 计算线性方程的根。检查系数 `A` 是否为零。
- - '##'
  - 14. 字段 `first` – 实数，平面上的 x 坐标；字段 `second` – 实数，平面上的 y 坐标。实现方法 `distance()` 计算到原点的距离，`distanceTwo(ob1,ob2)`
    计算两点之间的距离。
- - '##'
  - 15. 字段 `first` – 正实数，直角三角形的直角边；字段 `second` – 正实数，落在直角三角形上的高 `h`。实现方法 `hypotenuse(ob1)`
    计算斜边长度，`compare(ob1,ob2)` 比较两个对象的面积。
- - '##'
  - 16. 字段 `first` – 正分数；字段 `second` – 正整数，该月工作天数。实现方法 `sum()` 根据月份内指定的天数计算得金额。
- - '##'
  - 17. 字段 `first` – 正数，通话时长（分钟）；字段 `second` – 正分数，每分钟的价格（UAH/格）。实现方法 `cost()` 计算通话总费用，`compare(ob1,ob2)`
    比较两次通话的费用。
- - '##'
  - 18. 字段 `first` – 小整数部分；字段 `second` – 正整数，小数部分。实现方法 `multiply()` 将带有两位小数的实数相乘。乘法结果为自定义结构变量。应对任何有效的
    `first` 和 `second` 值都能正常工作。
- - '##'
  - 19. 字段 `first` – 正整数，光标水平坐标；字段 `second` – 正整数，光标垂直坐标。实现方法 `changex()` 改变水平坐标，`changey()`
    改变垂直坐标，`changexy()` 同时改变坐标。方法检查是否超出屏幕。
- - '##'
  - 20. 字段 `first` – 正整数，整数部分；字段 `second` – 正整数，小数部分。实现方法 `multiply()` 与 `int` 类型的随机整数相乘。乘法结果为结构类型。应对所有有效的
    `first` 和 `second` 值都能正常工作。
- - '##'
  - 21. 一对不同的正数。实现方法 `gcd(ob)` 第两个个数的最大约数，`lcm(ob)` 第两个个数的最小公倍数，`compareTwo(ob1,ob2)`
    比较两个对象最大约数是否相等。
- - '##'
  - 22. 项 `aj` 递减等比数列通过公式计算：
- - '##'
  - 23. 字段 `first` – 正整数，年份；字段 `second` – 1 到 12 之间的整数，月份。实现方法 `daysCount(ob)` 计算指定月份的天数（考虑到可能是闰年）。
- - '##'
  - 24. 字段 `first` 和 `second` – 实数，坐标系中的点坐标。实现方法 `getX()` 和 `getY()` 计算直角坐标系中的坐标，`distanceTwo(ob1,ob2)`
    计算点与点的距离。
- - '##'
  - 25. 由 `first` 和 `second` 确定的极坐标中的点。实现方法 `range(ob1,ob2)` 检查其中一个数字是否靠近边界。
