    \ 类中，结构体 `TLink` 在私有部分声明。它保存了对象指针（变量 `data`）和指向下一个元素的指针（变量 `next`）；指示 `TLink`\
    \ 的指针 `head`；构造函数 `TStack()` 和析构函数 `~TStack()`。\n\n成员类 `TStack` 的函数是可用的：\n\n*\
    \ `push`：用于向栈添加对象；\n* `peek`：用于返回对象；\n* `pop`：用于从栈中输出对象。\n\n![](img/00003.jpeg)\
    \ 继承示例\n\n作为基类实现 `TArray` 类 —— 动态数组，元素索引的变化范围限制为 0 到 `size-1`。派生类 – `TRangeArray`，元素索引的变化范围限制为\
    \ `low` 到 `high-1`。在两个类中都重载了索引运算符。\n\n```cpp\n#include <string.h>\n#include <conio.h>\n\
    #include <iostream.h>\n\n// 带有类型的自定义命名空间\n// TArray, TName, TNameArray\nnamespace\
    \ My\n{\n// 基类 – 动态向量\n// (索引从 0 到 size-1)\n    class TArray {\n        int* v;\n\
    \        int size;\n\n    protected:\n        // 派生类的访问函数\n        int getSize(){return\
    \ size;}\n        int& getV(int i)const { return v[i]; }\n\n    public:\n    \
    \    TArray(int);             // 构造函数\n        TArray(const TArray&);    // 拷贝构造函数\n\
    \        ~TArray() {delete[] v;};   // 析构函数\n        TArray operator+(const TArray&)\
    \ ;\n        TArray& operator=(const TArray&);\n        int& operator[](int);\n\
    \    };\n\nTArray::TArray(int n)\n{\n    if (n<=0)\n    {\n        cerr<<\"\\\
    nWrong’s size\";\n        return;\n    }\n    size=n;\n    v=new int[n];\n}\n\n\
    TArray::TArray(const TArray& a)\n{\n    v=new int[size=a.size];\n    for(int i=0;i<size++)\n\
    \        v[i]=a[i];\n}\n\nint& TArray::operator[](int i)\n{\n    if(i<0 || size<=i)\n\
    \    {\n        cerr<<\"index outside the limits\";\n        return v[0];\n  \
    \  }\n    return v[i];\n}\n\nTArray TArray::operator+(const TArray& two)\n{\n\
    \    TArray sum=*this;\n    if (size != two.size)\n        cerr<<\"\\nSizes’t\
    \ coincide\";\n    else for(int i=0;i<size++)\n        sum[i]+=two.getV(i);\n\
    \    return sum;\n}\n\nTArray& TArray::operator=(const TArray& a)\n{\n    if(&a\
    \ == this)return *this;\n    delete[] v;\n    v=new int[size=a.size];\n    for(int\
    \ i=0;i<size++)\n        v[i]=a[i];\n    return *this;\n}\n\n// 带有索引限制的继承类\n//\
    \ 修改 low .. high-1\nclass TRangeArray : public TArray\n{\n    int low, high;\n\
    \npublic:\n    TRangeArray (int,int);\n// 两个拷贝构造函数\n    TRangeArray(const TRangeArray\
    \ &);\n    TRangeArray(const TArray& a):TArray(a)\n    {\n        low=0;\n   \
    \     high=getSize();\n    }\n```\n"
