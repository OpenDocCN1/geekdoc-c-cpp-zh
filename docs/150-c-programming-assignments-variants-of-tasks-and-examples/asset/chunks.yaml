    *   shift() – parabola shift for one unit up;


    *   odd() – even function  definition;


    *   roots() – finding the real roots of the equation ax2+bx+c=0;


    *   print of the parabola coordinates top y=ax2+bx+c;


    *   finding the number of points, crossed with the axis ОХ.


    2.  To define the type: rhombus, assigned by the length of the side and the sharp
    angle. To define the functions:


    *   compare() – the operation of comparing two objects by the radius of inscribed
    circles;


    *   finding rhombus diagonals;


    *   finding the area.


    3.  To define the type: lineal function with the coefficients b, c (y=bx+c). To
    define the functions:


    *   shiftRight() – shift of the straight line for one unit to the right;


    *   shiftUp() –shift of the straight line for one unit up;


    *   defining of the angle straight line incline to the abscissas axis;


    *   defining the point of two straight lines crossing.


    4.  To define the type: TCircle – the circle on the area. The circle is defined
    by the center and a radius. To define the functions:


    *   compare() – comparison  and coincidence of the circles by the transfer;


    *   isIn() – finding, whether one circle covers  the other one;


    *   finding the length of the arc for the assigned central angle;


    *   calculation of the segment area for the assigned central angle.


    5. The complex number is assigned by the pair of real numbers (a, b), where a
    - real part, b - the imaginary part. Realize type TComplex to work with complex
    numbers. Mandatory availability features:


    *   addition add(), (a, b) + (c, d);


    *   subtracting sub(),(a, b) – (c, d);


    *   multiplication mul(),(a, b) * (c, d);


    *   division div(), (a, b) / (c, d);


    *   compare equ(), (a, b) = (c, d);


    *   complex conjugate conj(a, b).


    6. To define the type TVector3D,  assigned by three coordinates. Addition and
    subtraction of vectors, the  scalar’s multiplication of vectors,  multiplication
    by scalar,  comparison of vectors,  calculation of vector’s length, comparison
    of the length of vectors must be by all means realized.


    7. To define the type TModelWindow for the work with the screen windows models.
    The window headline, the coordinates of the left upper angle, the size along the
    horizontal, window color, the state “visible/non-visible”, the state "with/without
    the frame" are assigned as fields. The coordinates and sizes, indicated as the
    integers.  To realize the operations: window transformation along the horizontal,
    along the vertical; the height change and/or window width,  the change of color;
    the state change, the state questioning. The operations of transformation and
    the size change must implement the check of the screen frames crossing. The function
    of output on the screen must demonstrate the state of the object fields.


    8\. To define the type TMoney to work with the sums of money. The number must
    be submitted in two fields: type long for UAH and type unsigned char - for pennies.
    Fractional part (pennies) by the output must be separated from the integer with
    the comma. Realize addition,  subtraction,  division the amounts,  division the
    amounts by the fraction,  multiplying the amount by the fraction and comparison
    operations.


    9. To define the type TTriangle for the introduction of the triangle. The data
    fields must include angles and sides. It is necessary to realize the operations:
    obtaining and changes of the data fields,  calculation of area, calculation of
    perimeter, calculation of heights, and also defining the type (equilateral, isosceles
    or right-angled triangle).


    10. To define the type TAngle for the work with the angles on the plane, assigned
    by the size in grades and minutes. One must realize by all means: transfer into
    the radians, adduction to the range 0-360, increase and decrease of the angle
    for the angle assigned size, obtaining the sine, comparison of the angles.


    11. To define the type TPoint for the points on the plane. The coordinates of
    the point - Cartesian. Moving the point on the axis X, moving along the axis Y,
    defining the distance to the beginning of the coordinates, the  distance between
    two points,  converting to polar coordinates,  comparing coincidence of two points
    and the other way round, must necessarily be realized.'
