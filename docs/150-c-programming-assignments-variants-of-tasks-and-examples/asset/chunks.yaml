    accrued sum for the given number of days for the assigned number of the days in
    a month


    salary / number days in month × worked days.


    17.  The field first - a positive number,  the duration of a call in minutes;
    field second - positive fractional number, the price of one minute in UAH. To
    realize the methods cost() - calculate the total price of the conversation, compare(ob1,ob2)
    - compare the cost of two conversations.


    18.  The field first - integer part of the decimal number; field second – the
    positive integer,  fractional part of decimal number. To realize the method multiply()
    - multiply it by random real number with two digits after the decimal point. The
    result of the multiplication – variable of own structure type. The method should
    work correctly for any valid values first and  second.


    19.  The field first - the positive integer,  coordinates of the cursor horizontally;
    Field second - the positive integer,  coordinates of the cursor vertically. To
    realize the methods: changex() - change of horizontal coordinates of the cursor;
    realize method changey() - change  vertical  coordinates of the cursor, changexy()
    - change both cursor coordinates. Methods should check the exit outside the screen.


    20.  The field first - a positive integer,  integer part of the number; Field
    second - a positive integer,  fractional part of number. To realize the method
    multiply() – multiplication on random integer with type int. The result of multiplication
    – the variable of the structural type. The method should work right for all valid
    values first and second.


    21.  A pair of distinct positive numbers.  To realize the method gcd(ob) – the
    greatest common divisor of first and second, lcm(ob) - the [least common multiple](http://en.bab.la/dictionary/english-russian/least-common-multiple)  of
    first and second, compareTwo(ob1,ob2)- compare the coincidence of the greatest
    common divisors of two objects.


    22.  Item  aj  decreasing  geometric progression is calculated by formula


                                aj =  a0rj, j = 0, 1, 2,...


    Field first - positive real number, the first element of progression a0; field
    second - real number r between 0 and 1\. To realize the method element () - calculate
    j element  of progression, sum() –for the calculation of the total of the first
    j progression elements, sumAll()- for calculating the total of progression elements.


    23.  The field first -a positive integer, year; Field second - a positive integer
    from 1 to 12 - month number. To realize the methods daysCount(ob) – calculate
    the number of days of the assigned month (consider  that the year can be leap),
    monthsCount(ob1,ob2) – calculate the number of months between two dates.


    24.  Fields first and second – real numbers, which  determining the coordinates
    of a polar coordinate system. To realize the methods getX() and getY() – calculating
    the coordinates in a rectangular coordinate system by the relevant axes, distanceTwo(ob1,ob2)
    – calculate distance between two points.


    25.  The number with the neighborhood is assigned by the fields first and second,
    which  determine the coordinates of the point in polar coordinates. To realize
    the methods isRange(ob1, ob2) –checking, if  one number from neighborhood gets
    into the neighborhood of the other number with the neighborhood, distanceTwo(ob1,ob2)-
    calculate minimal distance between two objects (their boundaries).


    ### Examples of the code


    ![](images/00003.jpeg)     Example structure with member-data and outer functions
    (C code)


    // C Code


    // structure TDate with member-data


    //d-day, m-month, y-year


    struct TDate


            {


            int d,m,y;


            };


    //function of initialization of variable date with the


    //values d,m,y


    void init (struct TDate* date, int d, int m, int y)


    {


                   date->d =d;


                   date->m =(m % 12)>0 ? m % 12 : 12;


                   date->y =2000+y;


    }


    void addYear(struct TDate* date, int n)


    {  //addition n years to the field in the structure date


                   date->y +=n;


    }


    void addMonth(struct TDate* date, int n)


    { //add n months to the field m in the structure  date


                   date->m +=n;


    }


    void addDay(struct TDate* date, int n)


    { // add n days to the field d of the structure date


                   date->d +=n;


    }


    #include <stdio.h>


    int main()


    {


      // creation of the instances(objects)


      //of the structure TDate


      struct TDate today, birthday,tomorrow;


      init(&today,5,9,13);


      //initialization of variable birthday


      //with the values d,m,y+2000


      init(&birthday,30,13,-8);


       //tomorrow,assignmened with the data of variable today


       tomorrow=today;


      //addition one day to tomorrow


      addDay(&tomorrow,1);


      //print of the day of variable tomorrow


      printf("%d\n", tomorrow.d);


      //print of variable birthday


    printf("%d %d %d ", birthday.y, birthday.m, birthday.d);


    getch();


    return 0;


