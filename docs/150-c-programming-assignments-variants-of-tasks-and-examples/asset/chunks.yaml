    \n# 9. 字段 `first` – 分数（分子、分母），范围的左边界；字段 `second` – 分数（分子、分母），范围的右边界，以实现方法 `rangeCheck()`\
    \ – 检查指定的分数是否在范围 `[first, second]` 之间。\n\n# 10. 字段 `first` – 整数，范围的左边界，属于范围内；字段\
    \ `second` – 整数，范围的右边界，不属于范围内。这对数字分配了一个半开区间 `[first, second)`。实现方法 `rangeCheck()`\
    \ – 检查指定的数字是否在范围内，`rangePrintUnion(ob1,ob2)` – 输出两个范围组合后的所有整数。\n\n# 11. 时间间隔通过字段指定：`first`\
    \ - 正整数，小时；字段 `second` - 正整数，分钟。实现方法：`minutes()` – 将时间转换为分钟，`shiftForward()` 和\
