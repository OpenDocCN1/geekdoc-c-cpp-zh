    \ classes\n    - Variants of the tasks\n    - Examples of the code\n- LIST OF\
    \ LITERATURE\n\n## FOREWORD\n\nObject-oriented programming is based on the concept\
    \ that a program can be created as a collection of objects working together. This\
    \ methodology focuses on the connections between objects rather than the details\
    \ of their realization. All the OOP languages are based on three main ideas: encapsulation,\
    \ polymorphism and inheritance [13, 18, 19, 22-30].\n\nIn `C++` encapsulation\
    \ is realized with the help of classes. Access to the code and data within the\
    \ capsule is controlled by an interface which is given to the user.\n\nThe purpose\
    \ of polymorphism, according to OOP, is the usage of one name for the task of\
    \ the actions, general for the class. The exertion of every concrete action will\
    \ be defined by the type of the data. In more general sense the concept of polymorphism\
    \ means that it is possible to create general interface for the groups, common\
    \ by the content and not by the realization of actions.\n\nThe main thing in polymorphism\
    \ is the fact that it allows to manipulate with the objects of different complexity\
    \ by means of creating for them general standard interface for the realization\
    \ of identical actions.\n\nThe inheritance is a process with the help of which\
    \ one object acquires the peculiarities of the other one. To be more exact, the\
    \ object can inherit the peculiarities of the other object and add to them features,\
    \ characteristic only for its own.\n\nThe collection of tasks is an appendix to\
    \ the teaching guidance [22] ([http://amzn.com/B00NZ6M7L6](http://amzn.com/B00NZ6M7L6))\
    \ “Object-oriented programming in `C++`”. It contains problems and samples of\
    \ their solutions using `C++ programming language`.\n\nThe textbook consists of\
    \ 6 parts. Every part contains variants of assignments, referring to the particular\
    \ theme, and the examples of the code, meant to assist the student while writing\
    \ the program. Codes contain the commentaries and the results of the work.\n\n\
    Themes, considered in the given collection, include overloading of functions and\
    \ operators, template functions, work with the structural types, creation of classes\
    \ (data-member, functions-member, constructions, destructor and itc.). We also\
    \ suggest creating classes (aggregation and inheritance) for the extending possibilities\
    \ of existing classes and the notion of the base and derivative classes, multiple\
    \ inheritance, building of the hierarchy of classes, usage of virtual functions,\
    \ abstract classes, polymorphic functions, virtual inheritance.\n\nIn the textbook\
    \ we have introduced the assignments for the course OOP in `C++`. Some assignments\
    \ (№ 2, № 3 and № 6) are based on the ideas from [11, 27]. Other assignments belong\
    \ to the author [22, 23].\n\n# Assignment №1. Overloading of operations and functions.\
    \ Functions templates\n\n### Task\n\nOverloading of the functions for the different\
    \ types of input data or create functions templates, or overload the operations\
    \ for the types, marked by the user (new types to assign in the way of structures)\
    \ [23].\n\n### Variants of the tasks\n\n1. To create the function, receiving the\
    \ text (type `char*`) at the output and transforming it by creating: rejects the\
    \ repeated spaces. The function must return the number of rejected white spaces.\
    \ To convey the text into the function. To overload the operation `<<` the output\
    \ of the changed string.\n\n2. To create the structure, defining the triangle\
    \ on the surface. To overload the operations:\n   - `++` – shift of the triangle\
    \ by 10 pixels to the right;\n   - `--` – shift of the triangle by 10 pixels to\
    \ the left;\n   - `<`– comparison of two triangles.\n\n3. To create the structure,\
    \ defining the vector on the plane. To overload the operations:\n   - `!` – calculation\
    \ of the vector, received from the assigned by the turn to 90 degrees counter\
    \ clockwise;\n   - `-`– calculation of the vector, contrary to the assigned and\
    \ having the same length with it;\n   - `++`– normalization of vector.\n\n4. To\
    \ create the functions, inverting the arrays, consisting of the elements of the\
    \ type `int`, `double`, and as well – the function, inverting the words in the\
    \ sentence in reversed order. To use the overloading of functions and create the\
    \ template.\n\n5. To create the functions, comparing integers, strings of symbols,\
    \ vectors norms and return:\n   - `0`, if the data is equal;\n   - `1`, if the\
    \ first is more/longer, than the second;\n   - `-1`, if the first is less/shorter,\
    \ than the second. \n   To use the overloading of functions.\n\n6. To create the\
    \ functions, printing the square roots from the real and complex number, the norm\
    \ of the vector. To use functions overriding.\n\n7. To create the functions, finding\
    \ the maximal array element, consisting of the elements of the type `int`, `double`,\
    \ and as well – the function, finding the maximal word length in the string (type\
    \ `char*`). To use functions overloading and create the function template.\n\n\
    8. To define the operations `++`, calculating the determinant of the matrix by\
    \ Gauss method and vector norm.\n\n9. Overloading the operations `<<`, `>>` for\
    \ the matrixes input and the output of the matrixes, transposed to them. Matrixes,\
    \ rectangular in size `n×m` with the integer and real elements. To use the templates.\n\
    \n10. To define the operation of the logical subtraction of two lines of symbols\
    \ `S3=S1-S2`. Line `S3` consists of the symbols, belonging to string `S1` and\
    \ not belonging to `S2`. To take into account the number of identical symbols\
    \ in both strings. To use the operators overloading.\n\n11. To define operations\
    \ `+`, `-`, `*`, `/` for a complex number. Test each operation separately. Calculate\
    \ the expression `z=(x+y)/(x-y)+xy/(x+y)`. To use the operators overloading.\n"
