  trans: "\n\n请注意，在函数初始化时，年份是相对于 2000 年的，月份范围在 1 到 12 之间。在函数初始化或求和函数中，未预见其他数据纠正检查。上述示例的类似物可在文献\
    \ [19, 28] 中找到。\n\n数据类型与函数之间没有明显的联系。但可以通过将函数定义为结构体的成员来建立这种联系：\n\n![](img/00003.jpeg)带有成员数据和成员函数的结构体示例（C++\
    \ 代码）\n\n```cpp\n// C++ Code\n\n// 带有成员数据的结构体 TDate\n\n//d-天, m-月, y-年\n\nstruct\
    \ TDate\n{\n    int d,m,y;\n    void init(int dd,int mm, int yy);\n    void addYear(int\
    \ n);\n    void addMonth(int n);\n    void addDay(int n);\n};\n\nvoid TDate::init(int\
    \ dd,int mm, int yy)\n{\n    d=dd;\n    m =(mm % 12)>0 ? mm % 12 : 12;\n    y\
    \ =2000+y;\n}\n\nvoid TDate::addYear(int n)\n{\n    y +=n;\n}\n\nvoid TDate::addMonth(int\
    \ n)\n{\n    m +=n;\n}\n\nvoid TDate::addDay(int n)\n{\n    d +=n;\n}\n\n#include\
    \ <iostream.h>\n\nint main()\n{\n    // 创建结构体 TDate 的实例（对象）\n    TDate today,\
    \ birthday;\n    today.init(5,9,12);\n    // 初始化变量 birthday\n    birthday.init(30,12,-8);\n\
    \    // 创建结构体 TDate 的实例\n    // 使用变量 today 的数据初始化名为 tomorrow\n    TDate tomorrow=today;\n\
    \    // 给 tomorrow 加一天\n    tomorrow.addDay(1);\n    // 打印变量 tomorrow 的天\n   \
    \ cout << tomorrow.d << endl;\n    // 打印变量 tomorrow\n    cout << tomorrow.y <<\"\
    \ \" << tomorrow.m <<\" \"<< tomorrow.d;\n    // 打印变量 birthday\n    cout << birthday.y\
    \ <<\" \" << birthday.m <<\" \"<< birthday.d;\n    cin.get();\n    return 0;\n\
    }\n```\n\n在这里，结构体类型的所有变量将包含字段 `d`、`m`、`y` 以及函数 `init()`、`addYear()`、`addMonth()`、`addDay()`。\n\
    \n由于不同的结构体可能具有相同名的函数成员，因此在定义函数成员时，必须连同作用域解析运算符 `::` 一起指出结构体的名称。在函数成员结构体或类内部，可以使用同类的成员名称，而无需任何对象指针。`TDate`\
    \ 结构体的描述提供了处理日期的函数选择，但请注意，它们不仅仅可以访问类 `TDate`。可以使用 `class` 关键字代替 `struct` 来限制访问权限。\n\
    \n# 第 3 题。结构体与类\n\n## 任务\n\n在所有任务中编写类类型（首先是结构体，然后是实现该结构体的类）。除了任务中指定的函数外，分配的类类型对象还必须实现以下功能函数\
    \ [11]：\n\n* 对象初始化 `init()`\n* 从键盘输入 `input()`\n* 输出到屏幕 `output()`\n* 将对象转换为字符串\
    \ `toPChar()`。\n\n所有任务必须以两种方式实现：\n\n* 数据类型通过带有必要字段的结构体分配，操作实现为外部非成员函数，这些函数接收给定类型的对象作为参数；\n\
    * 数据类型通过类分配。类数据成员是第 1 节描述的结构体类型的私有变量，类的成员函数是开放的非成员函数 `init()`、`input()`、`output()`、`toPChar()`\
    \ 以及访问函数 `setStruct()`、`getStruct()` 或 `setVar()`、`getVar()`。\n\n### 任务变体\n\n\
    1. 定义类型：系数为 `a`、`b`、`c` 的二次函数（`y=ax2+bx+c`）。定义函数：\n* `shift()` – 抛物线向上移动一个；\n\
    * `odd()` – 偶函数定义；\n* `roots()` – 寻找方程 `ax2+bx+c=0` 的实根；\n* 打印抛物线顶点 `y=ax2+bx+c`\
    \ 的坐标；\n* 寻找与 OX 轴相交点的个数。\n\n2. 定义类型：由边长和锐角定义的菱形。定义函数：\n* `compare()` – 通过内切圆半径比较两个对象的操作；\n\
    * 寻找菱形的对角线；\n* 计算面积。\n\n3. 定义类型：系数为 `b`、`c` 的线性函数（`y=bx+c`）。定义函数：\n* `shiftRight()`\
    \ – 直线向右移动一个单位；\n* `shiftUp()` – 直线向上移动一个单位；\n* 定义直线相对于横轴的倾斜角；\n* 定义两条直线的交点。\n\
    \n4. 定义类型：`TCircle` – 面积上的圆。圆由圆心和半径定义。定义函数：\n* `compare()` – 圆的比较；\n* `isIn()`\
    \ – 寻找一个圆是否覆盖另一个圆；\n* 计算弧的长度；\n* 计算圆心角。\n\n5. 定义类型：由实数对 (`a`, `b`) 定义复数，其中 `a`\
    \ 为实部，`b` 为虚部。实现 `TComplex` 类型处理复数。必须具备的功能：\n* `add()`，`(a, b)` + `(c, d)`；\n\
    * `sub()`，`(a, b)` - `(c, d)`；\n* `mul()`，`(a, b)` * `(c, d)`；\n* `div()`，`(a,\
    \ b)` / `(c, d)`；\n* `equ()`，`(a, b)` = `(c, d)`；\n* `conj(a, b)`。\n\n6. 定义类型\
    \ `T3D`，由三个坐标定义。向量的加法和减法、标量乘法、向量比较、向量长度计算必须实现。\n\n7. 定义类型 `TModelWindow` 处理屏幕窗口。窗口标题、左上角坐标、水平尺寸、窗口颜色、“可见/不可见”状态、“有框/无框”状态分配为字段。坐标和尺寸以整数表示。实现操作：窗口水平方向和垂直方向变换；高度/或宽度变化；颜色改变；状态改变。变换和尺寸操作必须实现屏幕交叉检查。屏幕输出函数必须演示对象字段的状态。\n\
    \n8. 定义类型 `TMoney` 处理金额。数字必须由两个字段提交：用于 UAH 的 `long` 类型和用于分数的 `unsigned char` 类型。输出时分数部分必须与整数隔开。实现金额的加法、减法、除以分数、金额乘以分数以及比较操作。\n\
    \n9. 定义类型 `TTriangle` 引入三角形。数据字段必须包含角和边。必须实现操作：数据字段的获取和修改、面积计算、周长计算、高计算，以及定义三角形类型（等边、等腰或直角三角形）。\n\
    \n10. 定义类型 `TAngle` 处理平面角度，以分和定义大小。必须实现：转换为弧度、调整到 0-360 度范围、指定大小角度的增加和减少。\n\n"
- fmt: "\n## 12. Rational (irreducible) fractions\nRational fractions are assigned\
    \ by the pair of integers `(a, b)`, where `a` - numerator, `b` - denominator.\
    \ Realize type `TRational` to work with rational fractions. Such operations must\
    \ be realized:\n\n- addition: `add()`, `(a, b) + (c, d)`\n- subtracting: `sub()`,\
    \ `(a, b) – (c, d)`\n- multiplication: `mul()`, `(a, b) * (c, d)`\n- division:\
    \ `div()`, `(a, b) / (c, d)`\n- Compare: `equ()`, `bigger()`, `smaller()`\n\n\
    The private function `reduce()` which is necessarily called when performing arithmetic\
    \ operations must be realized.\n\n## 13. TDate\nTo create the type `TDate` for\
    \ the work with dates in the format `\"year.month.day\"`. The date is assigned\
    \ by the structure with three fields of the type `unsigned int`: for the year,\
    \ month, and day. The type must include not less than three initialization functions:\
    \ by numbers, string, in the way of `\"year.month.day\"` (for example, `\"2015.08.28\"\
    ``) and the date. The obligatory operations are:\n\n- calculation of the date\
    \ by means of the assigned number of days\n- subtraction of the assigned number\
    \ of days from the date\n- defining the leap year\n- assignment and obtaining\
    \ of separate parts (year, month, day)\n- comparison of the dates (equal, to,\
    \ past)\n- calculation of the number of days between the dates\n\n## 14. TTime\n\
    To define the type `TTime` for the work with the time in the format of `\"hour:minute:second\"\
    `. The type must include not less than four initialization functions: by the numbers,\
    \ string (for example, `\"23:59:59\"`), seconds and time. The obligatory operations\
    \ are:\n\n- calculation of the difference between two moments of the time in the\
    \ seconds\n- addition of the time and the assigned number of the seconds\n- subtraction\
    \ from the time the assigned number of seconds\n- comparison of the moments of\
    \ the time\n- transfer into the seconds\n- transfer into the minutes (with the\
    \ rounding to the integer minute)\n\n## 15. TFazzyNumber\nTo realize type `TFazzyNumber`\
    \ to work with fuzzy numbers which are represented by three numbers `(x – e1,\
    \ x, x + e2)`. For the numbers `Ob1 = (A – al, A, A + ar)` and `Ob2 = (B – bl,\
    \ B, B + br)` arithmetic operations are performed, using the following formulas:\n\
    \n- `Ob1 + Ob2 = (A + B – al – bl, A + B, A + B + ar + br)`\n- `Ob1 - Ob2 = (A\
    \ – B – al – bl, A – B, A – B + ar + br)`\n- `Ob1 * Ob2 = (A * B – B * al – A\
    \ * bl + al * bl, A * B, A * B + B * ar + A * br + ar * br)`\n- `1/Ob1 = (1/(A\
    \ + ar), 1/A, 1/(A – al))`, `A > 0`\n- `Ob1/Ob2 = ((A – al)/( B + br), A/B,(A\
    \ + ar)/( B – bl))`, `B > 0`\n\n## 16. TAccount\nTo realize type `TAccount`, which\
    \ is a bank account. The type must have four fields: the name of the owner, the\
    \ account number, interest charges and the amount in UAH. While opening a new\
    \ account, the initialization operation is performed. You must do the following:\n\
    \n- change the owner of the account\n- withdraw some money from the account\n\
    - deposit the money into the account\n- change interest transfer amount into dollars\n\
    - transfer the amount in euros\n- obtain the amount in words\n\n## 17. TMoney\n\
    The ratings of UAH may acquire the values 1, 2, 5, 10, 20, 50, 100, 200, 500.\
    \ Penny set as `0.01` (1 penny), `0.02` (2 pennies), `0.05` (5 cents), `0.1` (10\
    \ cents), `0.25` (25 cents), `0.5` (50 cents). Create the type `TMoney` to work\
    \ with the units of money. The amount should be represented by fields-ratings,\
    \ the values of which should be the number of notes ratings. Implement:\n\n- addition\
    \ of the amounts\n- subtraction of sums\n- division of two amounts\n- division\
    \ the sum by the integer\n- multiplication by the integer\n- comparison operations\n\
    \nThe fractional part (pennies), while outputting on the screen, should be separated\
    \ from the integer with the comma.\n\n## 18. TBankomat\nTo realize type `TBankomat`,\
    \ which simulates the operation of the ATM. In type should contain fields for\
    \ storing identification number of the ATM, information about the current amount\
    \ of money remaining in the ATM, minimum and maximum amounts that you can remove\
    \ the client in one day. The amount of money fed fields denominations 1-500. Implement:\n\
    \n- `init` method\n- `download` method notes in ATMs\n- method of removing certain\
    \ amounts of money\n\nThe method of withdrawal should be done to check the correctness\
    \ of the amount removed, it should not be less than the minimum value and greater\
    \ than the maximum. Method `toString()`.\n\n## 19. TFraction\nTo realize type\
    \ `TFraction` to work with fractional numbers. The number should be represented\
    \ by two fields: integer part and fractional part. Implement addition, subtraction,\
    \ multiplication, and comparison.\n\n## 20. Goods\nTo create type `Goods`. The\
    \ type must contain fields: the name of the product, the date, the price, the\
    \ number of items.\n\n## 21. TBitString\nTo define the type `TBitString` to work\
    \ with 64-bit strings. Implement `shiftLeft()` and `shiftRight()` methods.\n\n\
    ## 22. TLong\nTo realize the type `TLong` to work with integers. The number should\
    \ be represented by two fields: integer part and fractional part.\n\n## 23. Polygon\n\
    To define the type `Polygon` on the plane. The polygon is defined by the number\
    \ of sides, the center and radius. Implement:\n\n- perimeter calculation\n- area\
    \ calculation\n- intersection of polygons\n\n## 24. Segment\nTo define the type\
    \ `Segment` on the plane. Implement:\n\n- length calculation\n- intersection check\n\
    \n## 25. TCursor\nTo define the type `TCursor`. The fields are the coordinates\
    \ of the cursor horizontally and vertically.\n\n```cpp\n#include <stdio.h>\n#include\
    \ <iostream.h>\n\n// structure TDate with member-data\nstruct TDate {\n    int\
    \ d, m, y;\n};\n\n// function of initialization of date with d,m,y\nvoid init(TDate&\
    \ date, int d, int m, int y) {\n    date.d = d;\n    date.m = (m % 12) > 0 ? m\
    \ % 12 : 12;\n    date.y = 2000 + y;\n}\n\nvoid addYear(TDate& date, int n) {\
    \ // addition n years to the field in the structure date\n    date.y += n;\n}\n\
    \nvoid addMonth(TDate& date, int n) { // add n months to the field m in the structure\
    \ date\n    date.m += n;\n}\n\nvoid addDay(TDate& date, int n) { // add n days\
    \ to the field d of the structure date\n    date.d += n;\n}\n\nint main() {\n\
    \    // creation of the instances(objects) of the structure TDate\n    TDate today,\
    \ birthday;\n    init(today, 5, 9, 13);\n    // initialization of variable birthday\
    \ with the values d,m,y+2000\n    init(birthday, 30, 13, -8);\n    return 0;\n\
    }\n```\n"
