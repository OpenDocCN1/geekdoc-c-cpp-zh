  trans: "\n\n## 12. 有理数（不可约分数）\n有理数由整数对 `(a, b)` 分配，其中 `a` 是分子，`b` 是分母。实现类型 `TRational`\
    \ 以处理有理数。必须实现以下操作：\n\n- 加法：`add()`，`(a, b) + (c, d)`\n- 减法：`sub()`，`(a, b) – (c,\
    \ d)`\n- 乘法：`mul()`，`(a, b) * (c, d)`\n- 除法：`div()`，`(a, b) / (c, d)`\n- 比较：`equ()`（等于）、`bigger()`（大于）、`smaller()`（小于）\n\
    \n必须实现执行算术运算时调用的私有函数 `reduce()`。\n\n## 13. TDate\n创建类型 `TDate` 用于处理格式为 `\"year.month.day\"\
    ` 的日期。日期由具有三个 `unsigned int` 类型字段的结构体分配：年、月、日。该类型必须包含至少三个初始化函数：通过数字、字符串、以 `\"\
    year.month.day\"` 方式（例如 `\"2015.08.28\"`）以及日期初始化。强制性操作包括：\n\n- 通过指定的天数计算日期\n-\
    \ 从日期中减去指定的天数\n- 定义闰年\n- 分并获取单独的部分（年、月、日）\n- 比较日期（相等、大于、过去）\n- 计算两个日期之间的天数\n\n\
    ## 14. TTime\n定义类型 `TTime` 用于处理格式为 `\"hour:minute:second\"` 的时间。该类型必须包含至少四个初始化函数：通过数字、字符串（例如\
    \ `\"23:59:59\"`）、秒和时间初始化。强制性操作包括：\n\n- 计算两个时间点之间的差值（秒）\n- 将时间加上指定的秒数\n- 从时间中减去指定的秒数\n\
    - 比较时间点\n- 转换为秒\n- 转换为分钟（四舍五入到整数分钟）\n\n## 15. TFazzyNumber\n实现类型 `TFazzyNumber`\
    \ 用于处理由三个数字 `(x – e1, x, x + e2)` 表示的模糊数。对于数字 `Ob1 = (A – al, A, A + ar)` 和 `Ob2\
    \ = (B – bl, B, B + br)`，使用以下公式进行算术运算：\n\n- `Ob1 + Ob2 = (A + B – al – bl, A +\
    \ B, A + B + ar + br)`\n- `Ob1 - Ob2 = (A – B – al – bl, A – B, A – B + ar + br)`\n\
    - `Ob1 * Ob2 = (A * B – B * al – A * bl + al * bl, A * B, A * B + B * ar + A *\
    \ br + ar * br)`\n- `1/Ob1 = (1/(A + ar), 1/A, 1/(A – al))`，`A > 0`\n- `Ob1/Ob2\
    \ = ((A – al)/( B + br), A/B,(A + ar)/( B – bl))`，`B > 0`\n\n## 16. TAccount\n\
    实现类型 `TAccount`，即银行账户。该类型必须有四个字段：所有者姓名、账号、利息费用和以 UAH（格里夫纳）计算的金额。开设新账户时执行初始化操作。你必须完成以下操作：\n\
    \n- 更改账户所有者\n- 从账户取款\n- 向账户存款\n- 将利息转账金额改为美元\n- 转账欧元金额\n- 获取单词形式的金额\n\n## 17.\
    \ TMoney\n实现 `TMoney` 类型以处理 UAH（格里夫纳）单位。该类型应包含 1、5、10、20、50、100、200、500 等字段。应包含至少五个初始化函数。实现：\n\
    \n- 加法\n- 减法\n- 乘法\n- 除法\n- 比较\n- 转换为字符串\n- 转换为整数（分分单位）\n- 比较\n- 在屏幕上输出\n\n##\
    \ 18. TBankomat\n实现类型 `TBankomat`，模拟自动取款机。类型应包含有关 ATM 的信息。\n\n## 19. TFazzyNumber\n\
    实现类型 `TFazzyNumber` 用于处理模糊数。该数由整数部分和分数部分表示。\n\n## 20. Goods\n创建类型 `Goods`。该类型包含字段：商品名称、日期、价格、数量。\n\
    \n## 21. TBitString\n定义类型 `TBitString` 用于 64 位字符串。实现 `shiftLeft()` 和 `shiftRight()`\
    \ 方法。\n\n## 22. TLong\n实现类型 `TLong` 用于处理整数。该数由整数部分和分数部分表示。\n\n## 23. Polygon\n\
    在平面上定义 `Polygon` 类型。多边形由边数、中心和半径定义。实现：\n\n- 周长计算\n- 面积计算\n- 多边形交叉\n\n## 24. Segment\n\
    在平面上定义 `Segment` 类型。实现：\n\n- 长度计算\n- 检查\n\n## 25. TCursor\n定义类型 `TCursor`。字段为光标的水平和垂直坐标。\n\
    \n```cpp\n#include <stdio.h>\n#include <iostream.h>\n\n// 带有成员数据的结构体日期\nstruct\
