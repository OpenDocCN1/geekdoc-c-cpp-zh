    ### Examples of the code


    ![](images/00003.jpeg)      Example creating the abstract base class with two
    derivative real classes


     Condition of the task: To create the abstract base classTNumber(the number, written
    in the string of symbols) with the pure virtual arithmetic operation "+=" and
    the functionsum.


    To create the derivative classesTIntNumberandTCharNumberwith  the own realizations
    of virtual operations and functions. In the classTIntNumberoperation "+=" finds
    the arithmetic sum of two numbers, and the functionsum– the sum of digits of one
    number.


    In the classTCharNumberthe operation "+=" finds the concatenation of two number-strings,
    and the functionsum– the quantity of digits of one number string.


    #include <vcl.h>


    #pragma hdrstop


    #include <string.h>


    #include <stdio.h>


    #include <conio.h>


    #include <iostream.h>


      class TNumber {


        protected :


          char* a;


      public:


          TNumber(char* A){a=strdup(A);}


          virtual TNumber& operator+=(TNumber&)=0 ;


          virtual void print()=0;


          virtual int sum()=0;


          virtual ~TNumber(){delete[] a;}


      };


      class TIntNumber :public TNumber


      {


          public:


          TIntNumber(char* A):TNumber(A) {}


          TIntNumber(TNumber& ob):TNumber(ob){};


          TNumber&  operator+=(TNumber&) ;


          virtual void print();


          virtual int sum();


          ~TIntNumber(){}


      };


    int TIntNumber::sum()


    {


    int i=0,s=0;


    while(i<strlen(a))s+=a[i++]-''0'';


    return s;


    }


      TNumber& TIntNumber::operator+=(TNumber& ob)


    {


      TIntNumber* p=(TIntNumber*)&ob;


    int s=atoi(a)+atoi(p->a); // atoi(ob.a)- doesn’t work


    itoa(s,a,10);


    return *this;


      }


      void TIntNumber::print()


    {cout<<"\nTIntNumber:"<<a;}


      class TCharNumber: public TNumber


      {


          public:


          TCharNumber (char* A):(A) {}


          virtual TNumber& operator+=(TNumber&) ;


          virtual void print();


          int sum(){return strlen(a);}


          ~TCharNumber(){}


      };


    TNumber& TCharNumber::operator+=(TNumber& ob)


    { TCharNumber* p=(TCharNumber*)&ob;


      strcat(a,p->a);


      return *this;


      }


    void TCharNumber::print()


    {cout<<"\nTCharNumber:"<<a;}


    void printAll( TNumber* mas[],int size)


    {


      for(int i=0;i<size;i++)


      {


            mas[i]->print();


            cout<<"  sum="<<mas[i]->sum();


      }


    }


    int main()


    {


      TIntNumber a("12"),b("345"),c("35");


      TCharNumber A("12"),B("345"),C("35");


      TNumber* mas[10]={&a,&b,&c,&A,&B,&C};


    b+=a;


    b.print();


    C+=A;


    C.print();


    B+=a;


    B.print();


    (a+=A).print();


    mas[6]=new TIntNumber("1333");


    mas[7]=new TCharNumber("1555");


    printAll(mas,8);


    delete mas[6];


    delete mas[7];


    getch();


    return 0;


    } 


