    Remark, that the latter example illustrated the realization of 4 operators with
    the same nameoperator* which the compiler distinguishes by the input parameters.


    ![](images/00003.jpeg)      Example of overloading functions and usage of function
    templates


    The task: create the functions sorting the dynamic arrays, made up of the elements
    of the typesint,  floator  char*.


    The length of the arrays is to be given at input.


    Use the overloading of functions and the templates.


    The algorithm for the input of dynamic array of variable length lines may be illustrated
    by the diagram, given below.


    ![](images/00004.jpeg)


    #include <stdio.h>


    #include <string.h>


    #include <iostream.h>


    typedef char* str;


    // template for the input of dynamic number arrays


    // without denoting the type the “reference” won’t work


    template <class T>int input(T*& a)


    {


       cout<<"\nInput the array size ";


       int n;


       cin>>n;


       a=new T[n];


       cout<<"\nInput the array elements "<<endl;


       for(int i=0;i<n;i++)


                                cin>>a[i];


       return n;


    }


    //template for the output of


    // dynamic number and line arrays


    template <class T>  void output(T* a, int n)


    {


                  for(int i=0;i<n;i++)


                                cout<<a[i]<<" ";


                  cout<<endl;


    }


    //template for the exchange of the values of two


    // variables template


    template <class T> void  swap (T & a, T & b)


    {


                  T c=b;


                  b=a;


                  a=c;


    }


    //template for the sorting of two number arrays


    template <class T> void sort(T* a, int n)


    {


       int check;


                  do


                  {


                     check=0;


                     for(int i=0;i<n-1;i++)


                     if(a[i+1]<a[i])


                                              {


                                              swap(a[i+1],a[i]);


                                              check=1;


                                              }


                  n--;


                  }while(check);


    }


    //function for the input of dynamic array of lines


    // of variable length


    int input(str*& a)  //without referring it won’t work


       {


    cout<<"\n Input the number and maximum length of the lines ";


                  int n,m;


                  cin>>n>>m;


                  a=new str[n];


                  str buffer=new char[m+1];


                  cout<<"\nInput lines "<<endl;\


                  for(int i=0;i<n;i++)


                  {


                  cin>>buffer;


                  a[i]=new char[strlen(buffer)+1];


                  strcpy(a[i],buffer);


                  }


                  delete[] buffer;


                  return n;


       }


    //function for sorting of dynamic array of lines of //variable length


    void sort(str* a,int n)


    {


       int check;


                  do


                     {check=0;


                     for(int i=0;i<n-1;i++)


                                   if(strcmp(a[i+1],a[i])<0)


                                   {


                                   swap(a[i+1],a[i]);


                                   check=1;


                                   }


                     n--;


                  }while(check);


    }


    // template for the input, sorting and output of dynamic array numbers or the
    lines of variable length


    template <class T> void InputSortOutput()


    {


    T mas;


    int size=input(mas);


    sort (mas,size);


    output(mas,size);


    }


    int main(void)


    {


    // specification of templates         t


    InputSortOutput<str*>();


    InputSortOutput<int*>();


    InputSortOutput<float*>();


    cin.get();


    return 0;


    }


    In the latter program for the work with the arrays of integer and real numbers
    the templates have been created. Since dynamic array of lines of variable length
    is inputted and sorted not in the same way as number arrays, then for their input
    and sorting, the functions have been written in the way when  the names of these
    functions coincide with the names of the corresponding templates for number arrays.
    But the output of all three types of arrays can be realized in the same way, therefore
    only one template has been created.


    At last the templateInputSortOutput has been created. It is thrice concretized
    for the work with all the necessary types of dynamic arrays.


    #   Assignment №2. Structures. Outer functions and member-functions of the structure


    Task


    It is accepted to call the structure, consisting of two fields with the names
    first and second, as  couple-structure.


    It is necessary to realize the own data-type by means of this structure [11].


    To create some objects (ob, ob1, ob2, …) of such a structural type.


    To realize in all the tasks:


    *   the input of structural variable (function input());


    *   the function check(), insuring checking the  values, input by the function 
    input() as correct;


    *   output on the screen the input information and the result of the work (function
    output()).


    While inputting parameters error values one should output the corresponding announcement
    and again suggest inputting the necessary values.


    To realize the program in two variants


    *   to describe by means of the language C all the necessary functions as ordinary
    outer functions;


    *   to describe the functions, operating by one  object, as member-functions of
    the structure (language С++); for the input/output of the information, implementing
    the projects cin, cout.


    Remark: for the realization of some own structural types there may arise the necessity
    in creating one more additional structural type, by means of which the fields
    first and second will be defined.


    ### Variants of tasks


    1.  Square function y=-x2+Ax+B. Field first – real number,  coefficient A; field
    second – real number, coefficient  B. To realize the methods argument(ob) – calculation
    for the assigned  in the corresponding values x, isCrossing(ob) – definition,
    or the parabola is  crossed with the axis OX, sim(ob) – transformation of the
    parabola into the parabola, symmetric to it, relating to the axis OY.


    2.  Linear function y=Ax+B. Field first – real number coefficient A; field second
    – real number,  coefficient B. To realize the methods function() – calculation
    for the assigned x value of the function y, isCrossing (ob1,ob2) – definition,
    if two direct lines are crossed.


    3.  Complex number.  Field first – real number of the complex number,  field second
    – imagery part. To realize the methods of finding the root of n power from the
    complex number, finding the argument of the complex number compare(ob1,ob2) –
    comparing  two objects by the module.


    4.  Field first - fraction (numerator, denominator); field second –integer - the
    degree. To realize the method power() - raise the number in the first field to
    the power in the second field. The method should work right for all valid values
    first and second. Do not use function pow() from the library math.


    5.  Field first – positive integer, numerator; field second – positive integer,
    denominator. To realize the method ipart() – indicating the integer part of the
    fraction first/second and  method add() – finding the fraction, when, by its addition, 
    the integer, nearest to the values first/second is received. Function check()
    must check the equality of the denominator to the zero.


    6.  Field first – positive integer,  banknote  rating; the rating can acquire
    the values 1, 2, 5,  10,  20,  50,  100\. Field second – positive integer, the
    quantity of the banknotes of this rating. To realize the methods sum(ob) – calculation
    of the money sum of one object summation(ob1,ob2) – calculation of the   total
    money sum of two objects.'
