    \n![](images/00001.jpeg)\n\n# TABLE OF CONTENTS\n\n- FOREWORD\n- Assignment №1.\
    \ Overloading of operations and functions. Functions templates\n    - Variants\
    \ of the tasks\n    - Examples of the code\n- Assignment №2. Structures. Outer\
    \ functions and member-functions of the structure\n    - Variants of tasks\n \
    \   - Examples of the code\n- Assignment №3. Structures and classes\n    - Variants\
