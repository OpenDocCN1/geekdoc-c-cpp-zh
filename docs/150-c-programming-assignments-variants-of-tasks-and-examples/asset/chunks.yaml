  trans: "\n\n```cpp\ncin>>v[i];\nfor(i=0;i<5;i++)\n    cout<<v[i]*i;\ncin.get();\n\
    return 0;\n```\n\n从示例可以看出，由于编写了重载的流向量输入和输出操作，处理向量（vectors）的工作比处理字符串（lines）更加方便。\n\
    \n为了能够使用运算符重载，有必要将数组和字符串放入结构体中。\n\n注意，后一个示例演示了 4 个同名为 `operator*` 的实现，编译器通过输入参数来区分它们。\n\
    \n![](img/00003.jpeg) 函数重载示例和函数模板的使用\n\n### 任务\n创建用于由 `int`、`float`、`char*` 类型元素组成的动态数组的排序函数。\n\
    \n数组的长度将在输入时给出。\n\n使用函数重载和模板。\n\n变长字符串动态数组的输入算法可以用下面的框所示。\n\n![](img/00004.jpeg)\n\
    \n```cpp\n#include <stdio.h>\n#include <string.h>\n#include <iostream.h>\n\ntypedef\
    \ char* str;\n\n// 用于输入动态数字数组的模板\n// 不指定类型时，“引用”将不起作用\ntemplate <class T>int input(T*&\
    \ a)\n{\n  cout<<\"\\nInput the array size \";\n  int n;\n  cin>>n;\n  a=new T[n];\n\
    \  cout<<\"\\nInput the array elements \"<<endl;\n  for(int i=0;i<n;i++)\n   \
    \ cin>>a[i];\n  return n;\n}\n\n// 用于输出\n// 动态数字和字符串数组的模板\ntemplate <class T>\
    \ void output(T* a, int n)\n{\n    for(int i=0;i<n;i++)\n        cout<<a[i]<<\"\
    \ \";\n    cout<<endl;\n}\n\n// 用于交换两个变量值的模板\ntemplate <class T> void swap (T\
    \ & a, T & b)\n{\n    T c=b;\n    b=a;\n    a=c;\n}\n\n// 用于两个数字数组排序的模板\ntemplate\
    \ <class T> void sort(T* a, int n)\n{\n  int check;\n  do\n  {\n    check=0;\n\
    \    for(int i=0;i<n-1;i++)\n    if(a[i+1]<a[i])\n    {\n        swap(a[i+1],a[i]);\n\
    \        check=1;\n    }\n    n--;\n  }while(check);\n}\n\n// 用于输入变长字符串数组的函数\n\
    int input(str*& a) // 不使用引用将不起作用\n{\ncout<<\"\\n Input the number and maximum\
    \ length of the lines \";\n  int n,m;\n  cin>>n>>m;\n  a=new str[n];\n  str buffer=new\
    \ char[m+1];\n  cout<<\"\\nInput \"<<endl;\n  for(int i=0;i<n;i++)\n  {\n    cin>>buffer;\n\
    \    a[i]=new char[strlen(buffer)+1];\n    strcpy(a[i],buffer);\n  }\n  delete[]\
    \ buffer;\n  return n;\n}\n\n// 用于变长字符串数组排序的函数\nvoid sort(str* a,int n)\n{\n \
    \ int check;\n  do\n  {\n    check=0;\n    for(int i=0;i<n-1;i++)\n    if(strcmp(a[i+1],a[i])<0)\n\
    \    {\n        swap(a[i+1],a[i]);\n        check=1;\n    }\n    n--;\n  }while(check);\n\
    }\n\n// 用于动态数字或变长字符串数组的输入、排序和输出的模板\ntemplate <class T> void InputSortOutput()\n\
    {\nT mas;\nint size=input(mas);\nsort (mas);\n}\n\nint main(void)\n{\n// ... 根据原文继续继续逻辑\n\
    return 0;\n}\n```\n\n从示例可以看出，由于编写了重载的流向量输入和输出操作，处理向量（vectors）的工作比处理字符串（lines）更加方便。\n\
    \n为了能够使用运算符重载，有必要将数组和字符串放入结构体中。\n\n注意，后一个示例演示了 4 个同名为 `operator*` 的实现，编译器通过输入参数来区分它们。\n\
    \n### 任务\n创建用于由 `int`、`float`、`char*` 类型元素组成的动态数组的排序函数。\n\n数组的长度将在输入时给出。\n\n使用函数重载和模板。\n\
    \n变长字符串动态数组的输入算法可以用下面的框所示。\n\n（注：提供的剩余文本包含重复且碎片化的技术描述，已整合到上面的代码块结构中。）\n\n"
