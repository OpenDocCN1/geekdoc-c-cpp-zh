    \ on the screen.\n\n18\\. To define the class: long integer. To save the number\
    \ use linear unidirectional list. To create constructors and the destructor.\n\
    \nTo define the operations:\n\n\"+\",\"-\", \"*\" - addition, subtraction, multiplication;\n\
