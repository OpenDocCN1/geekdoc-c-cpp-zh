    - 对于给定的 `b` 计算多项式 `P(x+b)`、`(x - b)P(x)`、`P''(x)`；

    - 函数 `y = P(x)` 的图形图像。


    ### 10. 定义具有有理系数的多项式类 `P(x)=a0 +a1 x+a2 x2+…+ an-1 xn-1`，`x∈Q`，`ak =uk/vk`，`ukZ`，`vk∈N`。使用一维数组或二维一维数组来存储所使用的系数。创建构造函数和析构函数。


    **定义操作：**

    - `"+"` - 两个多项式的相加；

    - `"-"` – 两个多项式的相减；

    - `"*"` – 两个多项式的相乘；

    - `<<"` - 多项式打印；

    - `"=="` - 两个多项式的比较。


    **定义函数：**

    - 创建多项式的拷贝；

    - 有理数约分；

    - 求解多项式在某点的值；

    - 求解 `P ''(x)`，`P(x + b)`（`b` 为给定数字）。


    ### 11. 定义类：复数。创建构造函数和析构函数。


    **定义操作：**

    - `"+"`，`"-"`，``"*`，``"/"` – 算术运算；

    - `=` – 赋值；

    - `"!"` - 获取共轭数。


    **创建函数：**

    - 打印复数；

    - 拷贝创建；

    - 求解复数的 n 次根；

    - 求解 `|z|`、`Arg z`、`za`（`a` 为实数）；

    - 使用行计算指定精度的 `![](img/00006.jpeg)`。


    ### 12. 创建维度为 `n×n` 的实数系数矩阵类。创建构造函数和析构函数。


    **定义操作：**

    - `"+"`，`"-"`，``"*"` – 矩阵运算；

    - `<<"` - 打印矩阵；

    - `">>"` – 输入矩阵；

    - `"=="` – 矩阵的比较。


    **定义函数：**

    -  Find 矩阵的行列式；

    - 求解矩阵的逆；

    - 求解矩阵的迹；

    - 定义矩阵是否对称的函数。


    ### 13. 定义维度为 `n` 的向量类。创建构造函数和析构函数。


    **定义操作：**

    - `"+"`，`"-"` - 向量的相加和相减；

    - `"*"` - 向量的点积；

    - `">>"` - 输入向量；

    - `''^''` - 向量乘以一个数字。


    **定义函数：**

    - 打印向量；

    - 求解向量的长度；

    - 创建向量拷贝；

    - 向量元素排序；

    - 向量归一化。


    ### 14. 创建类：Pascal 中的字符字符串存储为字符字符串。为了存储它，使用字符数组。在零元素元素处存储当前字符串的长度。创建构造函数和析构函数。


    **定义操作：**

    - `"+"`- 两个字符串的拼接；

    - `"%"` - 逻辑加（仅添加第二个字符串中第一个字符串中不存在的字符）；

    - `"=="``，`"! ="```"<"`,``">"`,``"<="`,``">="` - 比较两个字符串的操作。


    **定义函数：**

    - 打印字符串；

    - 字符串拷贝；

    - 从位置 `Pos` 开始删除 N 个字符的字符串；

    - 从位置 `Pos` 开始将字符串 `st1` 插入字符串 `st2` 中；

    - 求解字符串长度；

    - 定义子字符串 `st2` 在字符串 `st1` 中首次出现的位置。结果为 位置数。


    ### 15. 定义类：字符字符串。为了维护字符串，使用带有最终符号 `\0` 的符号数组。创建构造函数和析构函数。


    **定义操作：**

    - `"*"`- 两个字符串的逻辑相乘（返回仅包含公共符号的字符串）；

    - `"+"` – 两个字符串的拼接，

    - `"=="``，`"! ="```"<"`,``"<="``，``">="` - 比较两个字符串的操作。


    **定义函数：**

    - 打印字符串；

    - 字符串拷贝；

    - 从位置 `Pos` 开始删除 N 个字符的字符串；

    - 从位置 `Pos` 开始将字符串 `st1` 插入字符串 `st2` 中；

    - 确定字符串长度；

    - 从位置 `Pos` 开始从字符串中提取长度为 N 个字符的子字符串；

    - 显示字符串行的第一个条目（结果为编号）；

    - 验证记录行是否为正数；

    - 将字符字符串转换为整数记录。


    ### 16. 定义类：平面上的圆。圆由三个数字（`x`, `y`, `r`）定义。创建构造函数和析构函数。


    **定义操作：**

    - `“+”`– 两个圆并集的面积；

    - `"–"` – 两个圆差的面积；

    - `"*"` – 两个圆交集的面积。


    **定义函数：**

    - 打印关于圆的信息；

    - 面积的比较；

    - 求解圆面积；

    - 以度为单位的圆弧长；

    - 屏幕上显示圆的图形表示。


    ### 17. 定义类：平面上的矩形。它由点 `A(x1,y1)` – 第一个左上点的坐标定义，以及 `B(x2,y2)` – 右下点坐标。创建构造函数和析构函数。


    **定义操作：**

    - `"+"` – 两个圆并集的面积；

    - `"–"` – 两个圆差的面积；

    - `"*"` – 两个圆交集的面积。


    **定义函数：**

    - 打印关于圆的信息；

    - 面积的比较；

    - 求解面积；

    - 求解周长；

    - 屏幕上显示图形表示。


    ### 18. 定义类：长整数。使用链表存储数字。创建构造函数和析构函数。


    **定义操作：**

    - `"+"``，`"-"`，``"*"` - 相加、相减、相乘；

    - `"/"` – 除法；

    - `"%"` - 取余数。


    **定义函数：**

    - 打印数字；

    - 求解位数；

    - 数字归一化（删除零）；

    - 确定数字是否等于零；

    - 定义是否为质数。


    ### 19. 创建类：正边形。该对象由 `X1,Y1`, `R`, `N` 定义。这里 `O(X1,Y1)` – 外接圆中心，`R` - 外接圆半径，`N`
    – 顶点数。创建构造函数和析构函数。


    **定义操作：**

    - `"=="``，`"! =" - 比较对象；

    - `<<" - 打印对象信息。


    **定义函数：**

    - 求解面积和周长；

    - 求解内切圆半径；

    - 求解顶角；

    - 在屏幕上绘制对象；

    - 向左移动像素。


    ### 20. 定义类：空间中的平面。平面由一般方程 `A`, `B`, `C`, `D` 系数定义。创建构造函数和析构函数、拷贝生成器。


    **定义操作：**

    - `"^"` – 平面间的角；

    - `"||"` – 平面间的距离；

    - `"=="``，`"!="` – 平面的比较。


    **定义函数：**

    - 打印平面信息；

    - 检查点是否在平面上；

    - 定义法平面系数；

    - 检查平面是否与坐标平面平行；

    - 检查两个平面是否平行或垂直；

    - 求解点到平面的距离。


    ### 21. 定义类：平面上的折线。它由点坐标定义，存储在二维或一维数组中。创建构造函数和析构函数。


    **定义操作：**

    - `"+"` – 两个折线的拼接；

    - `<<"`,``>>"` – 折线的输出和输入（顶点数量及其坐标）。


    **定义函数：**

    - 确定折线是否闭合；

    - 确定折线是否存在自交；

    - 确定折线是否为凸；

    - 求解由凸折线限制的图形面积；

    - 绘制折线。


    为了使算法更容易，可以认为所有顶点都是不同的，此外可能第一个和最后一个也是不同的。


