    \ the concatenation of two number-strings, and the function `sum` – the quantity\
    \ of digits of one number string.\n\n```cpp\n#include <vcl.h>\n\n#pragma hdrstop\n\
    \n#include <string.h>\n#include <stdio.h>\n#include <conio.h>\n#include <iostream.h>\n\
    \nclass TNumber {\n  protected :\n      char* a;\n  public:\n      TNumber(char*\
    \ A){a=strdup(A);}\n      virtual TNumber& operator+=(TNumber&)=0 ;\n      virtual\
    \ void print()=0;\n      virtual int sum()=0;\n      virtual ~TNumber(){delete[]\
    \ a;}\n};\n\nclass TIntNumber :public TNumber\n{\n      public:\n      TIntNumber(char*\
    \ A):TNumber(A) {}\n      TIntNumber(TNumber& ob):TNumber(ob){};\n      TNumber&\
    \  operator+=(TNumber&) ;\n      virtual void print();\n      virtual int sum();\n\
    \      ~TIntNumber(){}\n};\n\nint TIntNumber::sum()\n{\nint i=0,s=0;\nwhile(i<strlen(a))s+=a[i++]-'0';\n\
    return s;\n}\n\nTNumber& TIntNumber::operator+=(TNumber& ob)\n{\n  TIntNumber*\
    \ p=(TIntNumber*)&ob;\nint s=atoi(a)+atoi(p->a); // atoi(ob.a)- doesn’t work\n\
    itoa(s,a,10);\nreturn *this;\n}\n\nvoid TIntNumber::print()\n{cout<<\"\\nTIntNumber:\"\
    <<a;}\n\nclass TCharNumber: public TNumber\n{\n      public:\n      TCharNumber(char*\
    \ A):(A) {}\n      virtual TNumber& operator+=(TNumber&) ;\n      virtual void\
    \ print();\n      int sum(){return strlen(a);}\n      ~TCharNumber(){}\n};\n\n\
    TNumber& TCharNumber::operator+=(TNumber& ob)\n{\n  TCharNumber* p=(TCharNumber*)&ob;\n\
    \  strcat(a,p->a);\n  return *this;\n}\n\nvoid TCharNumber::print()\n{cout<<\"\
    \\nTCharNumber:\"<<a;}\n\nvoid printAll(TNumber* mas[],int size)\n{\n  for(int\
    \ i=0;i<size;i++)\n  {\n    mas[i]->print();\n    cout<<\" sum=\"<<mas[i]->sum();\n\
    \  }\n}\n\nint main()\n{\n  TIntNumber a(\"12\"),b(\"345\"),c(\"35\");\n  TCharNumber\
