    \  << \" \"\n<< birthday.m << \" \"\n<< birthday.d <<endl;\n\ncin.get();\n\nreturn\
    \ 0;\n\n}\n```\n\n![](img/00003.jpeg)具有结构类型私有变量（数据成员）和访问函数的示例类\n\n```cpp\n#include\
    \ <iostream.h>\n\n// 带有数据成员 d-日，m-月，y-年的类\n\nclass TDate\n{\n    int d,m,y;\n\
    public:\n// 访问变量 m-月的函数\n    void setM(int m){this->m =(m % 12)>0 ? m % 12 : 12;}\n\
    \    int  getM(){return m;}\n    char* getM(int);\n};\n\nchar* TDate::getM(int)\n\
    {\nchar* season=new char[7];\nswitch(m)\n{\ncase 12:; case 1:;  case  2: strcpy(season,\"\
    winter\");      break;\ncase  3:; case 4:;  case  5: strcpy(season,\"spring\"\
    ); break;\ncase  6:; case 7::  case  8: strcpy(season,\"summer\"); break;\ncase\
    \  9:; case 10:; case 11: strcpy(season,\"autumn\"); break;\n}\nreturn season;\n\
    }\n\nint main()\n{\nTDate day;\nday.setM(12);\ncout<<day.getM()<<endl;\ncout<<day.getM(1)<<endl;\n\
    day.setM(55);\ncout<<day.getM()<<endl;\ncout<<day.getM(1)<<endl;\ncin.get();\n\
    return 0;\n}\n```\n\n在后一个示例中，有两个名为 `getM()` 的函数。它们通过输入参数进行区分，并根据参数返回月份数字或季节。`accesssetM()`\
    \ 函数引入了正确的月份数字。\n\n# 作业 №4. 类的创建\n\n### 任务\n\n在每个变体中创建指定的类 [17] 并进行测试，同时注意在主部分创建必要数量的对象。在使用这些对象时，演示所有实现的运算符和函数。将部分运算符和函数设计为友好的形式，另一部分作为类成员。使用类的静态成员。\n\
    \n### 任务变体\n\n1. 在平面上定义类：`triangle`。它由三个顶点 `A(X1,Y1)`、`B(X2,Y2)`、`C(X3,Y3)` 定义。创建构造函数和析构函数。\n\
    \n定义运算符：\n`\"<<` – 输出对象信息；\n`\"==\"`, `\"!` – 比较两个对象。\n\n定义函数：\n- 求三角形面积和周长；\n\
    - 寻找内切圆和外接圆的半径；\n- 求顶点角；\n- 寻找顶点和中线；\n- 定义三角形类型（直角三角形、锐角三角形、有钝角、等腰三角形、不等边三角形）；\n\
    - 在屏幕上绘制对象的图形；\n- 寻找外接圆和内切圆的圆心；\n- 返回外接圆心周围指定的角；\n- 对象向右、向左移动。\n\n2. 定义实数系数的 `n`\
    \ 次多项式类 `P(x)=a0 +a1 x +a2 x2+…+ an-1 xn-1`，`x\\inR`。为了保存多项式系数，使用数组实现。\n\n创建构造函数和析构函数。\n\
    \n定义运算符：\n`\"+\"`, `\"-\"`, `\"*\"` – 多项式的加法、减法和乘法。\n\n定义函数：\n- 多项式打印；\n- 创建多项式的拷贝；\n\
    - 求多项式在点的值；\n- 求多项式除以多项式的商和余数；\n- 计算多项式 `P’(x)`、`P(Q(x))`、`(x-b)P(x)`、`P(x+b)`\
    \ (`b` 为赋值值)。\n\n3. 定义类：`long integer`（长整数）。使用数组保存数字（数组的一个元素为一个数字）。创建构造函数和析构函数。\n\
    \n定义运算符：\n`\"+\"`, `\"-\"`, `\"*\"` – 数字的加、减、乘；\n`\"/\"` – 整数除法；\n`\"%\"` – 取余数；\n\
    `\"==\"`, `\"!=\"`, `\">\"`, `\"<\"`, `<=`, `>=` – 比较。\n\n定义函数：\n- 数字打印；\n- 判断数字是否为零的逻辑函数。\n\
    \n定义数字 `250+1` 是否为质数。打印数字 `210`、`2100`、`100!`。\n\n4. 创建类：使用链表保存符号字符串。创建构造函数和析构函数。\n\
    \n定义运算符：\n`\"+\"` – 两个字符串的拼接；\n`\"==\"`, `\"!=\"`, `\">\"`, `<=` – 比较。\n`\"<<\"\
    `, `>>` – 输入和输出操作。\n\n定义函数：\n- 创建拷贝；\n- 求字符串长度；\n- 将 `st1` 插入 `st2`；\n- 计算字符串；\n\
    - 获取字符串的第一个项；\n- 字符串的结果。\n\n5. 定义类：平面上的点集。`(X,Y)`，`X\\inZ`, `Y\\inZ`。使用链表实现。创建构造函数和析构函数。\n\
    \n定义运算符：\n`*`, `\"+\"`, `\"-\"` – 交集、并集、差集；\n`\"==\"`, `\"!=\"`, `<=` – 比较。\n\
    `\"<<\"` – 输出集合。\n\n定义函数：\n- 创建拷贝；\n- 定义数量；\n- 定义数字是否属于集合；\n- 与空集比较；\n- 寻找集合的最小元素；\n\
    - 坐标。\n\n6. 定义类：平面上的四边形。`(X1, Y1), X2, Y2, X3, Y3`，其中 `Xi\\inN`, `Yi\\inN`。创建构造函数和析构函数。\n\
    \n![](img/00005.jpeg) \n\n定义运算符：\n`\"+\"`, `\"-\"`, `\"*\"` – 四边形的交、差；\n`\"==\"\
    ` – 重合。\n\n定义函数：\n- 打印四边形信息；\n- 求面积和周长；\n- 绘制图形；\n- 求顶角；\n- 对象向右移动 10 像素。\n\n\
    7. 创建类：使用二位向量表示整数集。创建构造函数和析构函数。\n\n定义运算符：\n`*`, `\"+\"`, `\"-\"` – 集合的交、并集、差集；\n\
    `\"~\"` – 补集；\n`\"%\"` – 对称差集；\n`\"==\"`, `\"!=\"`, `>`, `<=` – 比较运算符；\n`\"<<\"\
    `, `>>` – 输入和输出。\n\n定义函数：\n- 定义数量；\n- 定义数字是否属于集合；\n- 与空集比较；\n- 寻找集合的最小元素。\n\n\
    8. 定义复系数多项式类 `P(x)=a0 +a1 x+a2 x2+…+ an-1xn-1`，`ak =u+iv`，`u\\inZ`, `v\\inZ`。使用单向链表在内存中保存系数。创建构造函数和析构函数。\n\
    \n定义运算符：\n`\"+\"`, `\"-\"`, `\"*\"` – 多项式的加法、减法、乘法；\n`\"==\"` – 比较操作。\n\n定义函数：\n\
    - 多项式打印；\n- 创建多项式拷贝；\n- 计算多项式在点 `b` 的值。\n\n9. 定义任意次数整数系数多项式类 `P(x)=a0 +a1 x+a2\
    \ x2+…+ an-1xn-1`。使用单向链表在线性内存中保存系数。创建构造函数和析构函数。\n\n定义运算符：\n`\"+\"`, `\"-\"`, `\"\
    *\"` – 多项式的加法、减法、乘法；\n`\"<<\"`, `>>` – 多项式的输入和输出操作。\n\n定义函数：\n- 检查两个多项式的相等性；\n\
    - 创建多项式拷贝；\n- 求多项式在点的值。\n\n"
