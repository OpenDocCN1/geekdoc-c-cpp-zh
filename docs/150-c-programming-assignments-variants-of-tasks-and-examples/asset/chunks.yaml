    ## 22. 定义类：平面上的直线。通过一般方程及系数 `A`、`B`、`C`赋值。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"^"` – 直线之间的角；

    - `"||"` – 直线之间的距离；


    定义函数：

    - 输出直线的信息；

    - 寻找两条直线的交点；

    - 检查点是否在直线上；

    - 定义法线直线方程的系数；

    - 检查直线是否平行于坐标轴；

    - 检查两条直线是否平行或垂直；

    - 寻找点到直线的距离。


    ## 23. 定义类：平面上的点。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"++"`, `"-"` - 点向右/左移动 10 像素；

    - `"||"` - 两点之间的距离；

    - `"<<"`, `">"` - 输出和输入点；

    - `" == "`, `"! ="` - 比较两个点。


    定义函数：

    - 寻找点的极坐标；

    - 在坐标平面上绘制点；

    - 定义点在坐标平面上的象限位置；

    - 定义 4 个指定点是否形成一个圆；

    - 定义 3 个指定点是否在同一条直线上。


    ## 24. 定义类：空间中的折线。折线通过点坐标赋值，存储在 `3×n` 的数组中。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"+"` - 合并两条折线；

    - `"=" - 赋值。


    定义函数：

    - 输出折线的信息（顶点数量及其坐标）；

    - 定义折线是否为闭合；

    - 定义其是否属于同一个平面；

    - 寻找折线在坐标平面上的投影；

    - 在 XOY 平面上绘制折线的投影图。


    ## 25. 定义类：空间中的点。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"=="`, `"! ="` – 比较点；

    - `"||"` - 两点之间的距离；

    - `"=" – 赋值；

    - `"+"`, `"-"` - 点的加法和减法。


    定义函数：

    - 输出点的信息；

    - 寻找球面坐标；

    - 定义点是否属于某个坐标面；

    - 定义通过两个指定点的直线方程；

    - 定义通过三个指定点的平面方程。


    ## 26. 定义类：整数。创建构造函数和析构函数。


    定义运算符：

    - `"++"` - 数字的位数；

    - `"-"` - 如果末位数字为零，则删除末位数字；

    - `"!"` – 数字翻转（数字倒序排列）；

    - `"&"` - 数字除法（结果为实数）。


    定义函数：

    - 检查该数字是否为质数；

    - 寻找数字的质因数；

    - 将数字分解为质因数；

    - 两个数的最小公倍数；

    - 在不同的进制中打印数字（从二进制到十）。


    ## 27. 定义类：有理数 `x = p /q`，其中 `p` 为整数，`q` 为正整数。创建构造函数和析构函数。


    定义运算符：

    - `"+"`, `"-"`, `"*"`, `"/"` - 分数的加、减、乘、除；

    - `"=="`, `"! ="`, `">"`, `"<"`, `"<="`, `">"` - 比较；

    - `"<<"` - 输出和 `">"` - 输入。


    定义函数：

    - 幂运算：`xa`, a – 整数；

    - 有理数数的约分；

    - 对象拷贝。


    ## 28. 创建类：空间中的球体。球由中心坐标和半径设置。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"=="` - 比较半径；

    - `"<<"` - 输出球的信息；

    - `"<="` - 判断一个球是否属于另一个球；

    - `">="` - 判断一个球是否包含在另一个球内；

    - `"*"` - 寻找交球的体积。


    定义函数：

    - 沿指定的向量移动球体；

    - 按指定的倍数压缩球体；

    - 输出与另一个球相交的信息（一个点及其坐标，或多个交点）。


    ## 29. 创建类：平面上的向量。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"+"` - 向量和；

    - `"-"` - 向量差；

    - `"*"` – 数量积；

    - `"=" – 赋值；

    - `"<"` - 向量之间的角。


    定义函数：

    - 定义向量是否共线或正交；

    - 向量输出；

    - 绘制向量图像；

    - 定义向量的长度。


    ## 30. 创建类：空间中的向量。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `"&"` - 向量之间的角；

    - `"&&"` - 叉积；

    - `"*"` - 数量积；

    - `=` - 赋值；

    - `"<<"` - 输出向量。


    定义函数：

    - 定义两个向量是否共线；

    - 定义三个向量是否共面；

    - 混合积；

    - 在坐标平面上的投影；

    - 定义向量的长度。


    ## 31. 创建类：椭圆。椭圆通过标准方程系数 `a`, `b` 赋值。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `=` - 赋值；

    - `"=="` – 比较；

    - `"<<"` - 输出椭圆信息；

    - `"<="`, `">="` – 一个椭圆包含另一个椭圆。


    定义函数：

    - 定义焦点；

    - 定义离心率；

    - 焦半径；

    - 定义直接线方程；

    - 绘制椭圆。


    ## 32. 创建类：圆柱，底平行于 XOY 平面。圆柱通过底心坐标、半径和高度赋值。创建构造函数、析构函数和拷贝构造函数。


    定义运算符：

    - `=` – 赋值；

    - `"=="` - 比较体积；

    - `"<<"` – 输出圆柱信息；

    - `"<="` - 判断一个圆柱是否属于另一个；

    - `">="` - 判断一个圆柱是否包含另一个。


    定义函数：

    - 沿指定的向量移动圆柱；

    - 按指定的倍数压缩尺寸；

    - 输出与另一个圆柱相交的信息（是/否）。


