    \ int d, int m, int y) {\n    date.d = d;\n    date.m = (m % 12) > 0 ? m % 12\
    \ : 12;\n    date.y = 2000 + y;\n}\n\nvoid addYear(TDate& date, int n) { // 向结构体中的字段增加年份\n\
    \    date.y += n;\n}\n\nvoid addMonth(TDate& date, int n) { // 向结构体 m 字段增加月份\n\
