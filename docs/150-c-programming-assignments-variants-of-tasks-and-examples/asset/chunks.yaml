  trans: "\n\n![](img/cover.jpeg)\n\n# 150 道 C++ 程序作业：任务变体与代码示例\n\n**TATYANA SOPRONYUK**\n\
    \n最初出版于乌克兰，切尔诺夫，2014\n由 Nonna Shulga 翻译\n\nCopyright © 2015 Tatyana Sopronyuk\n\
    所有权利保留。\nISBN-13: 978-1515254065\nISBN-10: 1515254062\n\n本作业集是教学指南《C++ 面向对象编程》（[`amzn.com/B00NZ6M7L6`](http://amzn.com/B00NZ6M7L6)）的附录。它包含了使用\
    \ `C++ 编程语言`解决的问题及其解决方案示例。\n\n本教材旨在用于“C++ 面向对象编程”计算机科学课程。书中给出的任务涵盖了面向对象编程的基本概念：对象、类和继承。\n\
    \n本集的目的是教授学生如何从类实例化对象，以及如何继承新类。它引入了构造函数、公共和私有方法、抽象类、基类和派生类、类层次、方法重载。\n\n为了帮助学生，教材演示了所有类型作业的相似程序代码。\n\
    \n本教材仅供教育目的。\n\n© Sopronyuk T. N., 2015\n\n150 `C++ 程序作业。任务变体与代码示例：教材 / Tatyana\
    \ Sopronyuk 著，Nonna Shulga 译：CreateSpace, 2015.` – 73 页。\nISBN-13: 978-1515254065\
    \ (CreateSpace-分配) \nISBN-10: 1515254062\n\n![](img/00001.jpeg)\n\n# 目录\n\n- 前言\n\
    - 作业 №1. 运算符与函数的重载。函数模板\n    - 任务变体\n    - 代码示例\n- 作业 №2. 结构体。外部函数与结构成员函数\n  \
    \  - 任务变体\n    - 代码示例\n- 作业 №3. 结构体与类\n    - 任务变体\n    - 代码示例\n- 作业 №4.类的创建\n\
    \    - 任务变体\n    - 代码示例\n- 作业 №5.类的创建，实现现有类。继承。聚合\n    - 任务变体\n    - 代码示例\n- 作业\
    \ №6. 抽象类\n    - 任务变体\n    - 代码示例\n- 参考文献\n\n## 前言\n\n面向对象编程基于一种概念：程序可以被创建为一组共同工作的对象集合。这种方法关注于对象之间的连接，而不是它们的实现细节。所有的\
    \ OOP（面向对象）语言都基于三个核心思想：封装、多态和继承 [13, 18, 19, 22-30]。\n\n在 `C++` 中，封装通过类来实现。对封装器内部代码和数据的访问由提供给用户的接口控制。\n\
    \n根据 OOP 的定义，多态的目的是对动作任务使用同一个名称，该名称对类来说是通用的。每个具体动作的执行将由数据类型定义。从更广泛的意义上说，多态的概念意味着为内容相同（而非实现方式相同）的组创建通用接口。\n\
    \n多态的核心在于，它允许通过为不同复杂度的对象创建实现相同动作的通用标准接口来操作这些对象。\n\n继承是一个过程，通过它一个对象获得另一个对象的特性。更准确地说，对象可以继承另一个对象的特性，并在此基础上添加仅属于自身的特征。\n\
    \n本作业集是教学指南 [22] ([`amzn.com/B00NZ6M7L6`](http://amzn.com/B00NZ6M7L6))“`C++ 面向对象编程”的附录。它包含了使用\
    \ `C++ 编程语言`解决的问题及其解决方案示例。\n\n教材由 6 部分组成。每部分包含针对特定主题的作业变体以及旨在辅助学生编写程序的代码示例。代码包含了注释和运行结果。\n\
    \n本集考虑的主题包括函数和运算符的重载、模板函数、结构类型操作、类的创建（数据成员、成员函数、构造、析构函数等）。我们还建议为了扩展现有类的功能创建类（聚合和继承），以及基类和派生类的概念、多重继承、类层次的构建、虚函数的使用、抽象类、多态函数、虚继承。\n\
    \n在教材中，我们介绍了 `C++` 面向对象编程课程的作业。某些作业（№ 2, № 3 和 № 6）基于 [11, 27] 中的思想。其他作业属于作者 [22,\
    \ 23]。\n\n# 作业 №1. 运算符与函数的重载。函数模板\n\n### 任务\n\n针对不同类型的输入数据重载函数，或创建函数模板，或者为用户标记的类型（以结构体方式定义的新类型）重载运算符\
    \ [23]。\n\n### 任务变体\n\n1. 创建一个函数，在输出接收文本（类型 `char*`）并通过删除空格来对其转换。函数必须返回删除空格的数量。将文本传递给函数。重载\
    \ `<<` 输出后的字符串。\n\n2. 创建一个结构体，在表面上定义三角形。重载运算符：\n   - `++` 向右移动 10 像素；\n   - `--`\
    \ 向左移动 10 像素；\n   - `<` 比较两个三角形。\n\n3. 创建一个结构体，在平面上定义向量。重载运算符：\n   - `!` 根据给定值按逆时针旋转\
    \ 90 度计算向量；\n   - `-` 计算与给定值方向相反且长度相同的向量；\n   - `++` 向量归一化。\n\n4. 创建函数反转包含 `int`\
    \ 和 `double` 类型元素的数组，以及反转句子中单词顺序的函数。使用函数重载并创建模板。\n\n5. 创建函数比较整数、符号字符串、向量模，并返回：\n\
    \   - `0` 如果数据相等；\n   - `1` 如果第一个比第二个大或更长；\n   - `-1` 如果第一个比第二个小或更短。\n   使用函数重载。\n\
    \n6. 创建函数打印实数和复数的平方根、向量的模。使用函数覆盖。\n\n7. 创建函数查找包含 `int` 和 `double` 类型元素的数组中的最大值，以及查找字符串（类型\
    \ `char*`）中最大单词长度的函数。使用函数重载并创建函数模板。\n\n8. 定义运算符 `++`，使用高斯法计算矩阵行列式和向量模。\n\n9. 重载运算符\
    \ `<<` 和 `>>` 用于矩阵的输入和转置后矩阵的输出。矩阵为 `n×m` 矩形，包含整数和实数元素。使用模板。\n\n10. 定义两个符号行的逻辑减法运算\
    \ `S3=S1-S2`。行 `S3` 由属于字符串 `S1` 但不属于字符串 `S2` 的符号组成。考虑两个字符串中相同符号的数量。使用运算符重载。\n\n\
    11. 为复数定义运算符 `+`、`-`、`*`、`/`。分别测试每个运算。计算表达式 `z=(x+y)/(x-y)+xy/(x+y)`。使用运算符重载。\n\
    \n"
- fmt: "\n# Operator Overloading Tasks\n\n## 12. To define operations `+`, `-`, `*`\
    \ for the matrixes (`nxn`).\nTest each operation separately, compared with the\
    \ results, obtained in the environment `MathCad`. Calculate the expression `D=A*B+C*A-A*C`.\
    \ To use the operators overloading.\n\n## 13. To define operations `+`, `-`, `*`\
    \ for the vectors of dimension `n`. Test each operation separately. Calculate\
    \ the expression `d=(a+b)(a-b)`. To use the operators overloading.\n\n## 14. To\
    \ define the logical addition operation of two character strings `S3=S1+S2`. Line\
    \ `S3` consists of characters, which belong to at least one line `S1` or `S2\\\
    `. Take into account the number of the same characters in both lines. To use the\
    \ operators overloading.\n\n## 15. To define the logical operation of multiplication\
    \ of two character strings `S3=S1*S2`. Line `S3` consists of characters belonging\
    \ lines `S1` and `S2` simultaneously. Take into account the number of the same\
    \ characters in both lines. To use the operators overloading.\n\n## 16. Three\
    \ numbers `(x, y, r)` define a circle on the plane. To define operations `+`,\
    \ `-`, `*` for two circles:\n* `+` - the area of association;\n* `*` - cross-sectional\
