    functions.


    13. To create the abstract base class `TInteger` (the integer, represented by
    the array of its numbers) with the virtual arithmetic operations `+=`, `-=`, `*=
    ` and the function of the output on the screen. To create the derivative classes
    `THeximal` (the integer number in the hexadecimal form), `TBinary` (the integer
    number in the octal form) and to override for them the above-mentioned functions.


    14. To create the abstract class `TLine` (line segment). On the base of the class
    `TLine` to create the class `TColoredLine`, the classes `TPolyLine` and `TColoredPolyLine`
