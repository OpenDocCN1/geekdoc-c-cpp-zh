    To define the functions:

    - check, if he number is prime;

    - finding the prime divisors of the number;

    - expansion of the number into its prime factors,

    - the least common multiple of two numbers;

    - printing numbers in different number systems (from binary to decimal).


    ## 27. To define the class: the rational number `x = p /q`, where `p` - integer,
    `q` - a positive integer number. To create constructors and the destructor.


    To define the operations:

    - `"+"`, `"-"`, `"*"`, `"/"` - addition, subtraction, multiplication, division
    of fractions;

    - `"=="`, `"! ="`, `">"`, `"<"`, `"<="`, `">"` - comparison;

    - `"<<"` - output and `">"` - input.


    To define the functions:

    - exponentiation: `xa`, a – integer;

    - reduction of rational fraction;

    - the object copying.


    ## 28. To create the class: sphere in space. The sphere is set by the coordinates
    of the center and radius. To create constructors and the destructor, the copy
    generator.


    To define the operations:

    - `"=="` - comparing radii;

    - `"<<"` - print information about the sphere;

    - `"<="` - determining, if one sphere belongs to the other;

    - `">="` - defining, if one sphere is included into the other;

    - `"*"` - finding the volume of the intersecting spheres.


    To define the functions:

    - the shift of spheres on the assigned vector;

    - compression of spheres into the assigned number of times;

    - the print information about the intersection with the other sphere (one point
    and its coordinates, many points of intersection).


    ## 29. To create the class: the vector on the plane. To create constructors and
    the destructor, the copy generator.


    To define the operations:

    - `"+"` - the sum of vectors;

    - `"-"` - the difference of vectors;

    - `"*"` – scalar product;

    - `"="` – assignment;

    - `"<"` - the angle between the vectors.


    To define the functions:

    - defining whether the vectors are collinear or orthogonal vectors;

    - vector printing;

    - graphic vector image;

    - defining the length of the vector.


    ## 30. To create the class: vector in space. To create constructors and the destructor,
    the copy generator.


    To define the operations:

    - `"&"` - the angle between the vectors;

    - `"&&"` - vector product;

    - `"*"` - scalar product;

    - `"="` - assignment;

    - `"<<"` - printing vector.


    To define the functions:

    - defining if two vectors are collinear;

    - defining, if three vectors are coplanar;

    - the mixed product of vectors;

    - graphic image of projections on each coordinate plane;

    - defining the length of the vector.


    ## 31. To create the class: ellipse. Ellipse is assigned by the coefficients `a`,
    `b` of the canonical equation. To create constructors and the destructor, the
    copy generator.


    To define the operations:

    - `"="` - assignment;

    - `"=="` – comparison;

    - `"<<"` - print information about the ellipse;

    - `"<="`, `">="` – inclusion of one ellipse into the other.


    To define the functions:

    - defining coordinate focuses;

    - defining eccentricity;

    - focal parameter;

    - defining the equations of directrixes;

    - graphic ellipse.


    ## 32. To create the class: cylinder, the lower base of which is parallel to the
    coordinate plane XOY. The cylinder is assigned by the coordinates of the lower
    base center, the base radius and height. To create constructors and the destructor,
    the copy generator.


    To define the operations:

    - `"="` – assignment;

    - `"=="` - comparison of volumes;

    - `"<<"` – print information about the cylinder;

    - `"<="` – determining, whether one cylinder belongs to the other;

    - `">="` – defining the inclusion of one cylinder into the other.


    To define the functions:

    - cylinder shift for an assigned vector;

    - compression cylinder size in the assigned number of times;

    - printing information about crossing with the other cylinder (yes, no).


    ## 33. To create the class: the car. The car is assigned by the following data:
    `number`, `make`, `price`, `color`, `name` and surname of the owner, `year` of
    production, the note of the customs control. To create constructors and the destructor.


    To define the operations:

    - `"="` assignment;

    - `"<"`, `">"` - comparing the price of cars;

    - `"<="`, `">="` - comparing cars by the year of production;

    - `"<<"` - print information about the car;

    - `"+"` - the total price of the cars.


    To define the functions:

    - customs regulations, depending on the production year;

    - the change of color and the owner;

    - defining, whether the car had passed the customs control;

    - defining, whether the car number is lucky (symmetrical);

    - defining the age of the car.


    ## 34. To create the class: the timer. The timer is assigned by the period of
    the time, through which the function will be called, and the beginning and the
    end of work. To create constructors and the destructor.


    To define the operations:

    - `"="` assignment;

    - `"=="` - comparing two timers;

    - `"<="`, `">="` - comparing two timers periods of time;

    - `"<"`, `">"` - comparing two timers beginning of work;

    - `"<<"` - prints information about the timer;

    - `"-"` - defining the time difference between timers.

