  trans: '

    构建类层次级结构 [11]。层次结构的根——程序中指示的带有虚函数的抽象类。创建派生的真实类，在其中重写所有纯前驱类函数。编写输入/输出函数。自行定义哪些数据成员是必要的，哪些必须定义在基类中，哪些定义在派生类中。自行定义任何多态函数，以便对所创建层次结构中不同类型的对象进行操作。


    ### 任务变体


    1. 创建抽象基类 `TPair`，它具有虚算术运算 `+=`、`-=`、`*=`。创建派生类 `TComplex`（复数）和 `TRational`（有理数），它们具有算术运算的自己的实现。


    2. 创建基类——几何图形，具有给定的基底（圆半径 `r`）和高度 `h`，以及计算图形面积和表面积的垂直函数成员。创建派生类——`TCylinder`（圆柱）、`TCone`（圆锥）、`TTruncatedCone`（圆台），它们具有虚函数的自己的实现。


    3. 创建基类 `TFigure`，它具有计算形状面积和轮廓长度的虚函数成员。创建派生类：`TRectangle`（矩形）、`TCircle`（圆）、`TTrapezium`（梯形），它们具有计算形状面积和轮廓长度的函数。


    4. 创建基类——员工，具有给定的费率和工资函数。创建派生类——国家固定费率的时薪制员工，以及利率制员工，通过输入 8 小时工作天数来实现自实现的工资函数。


    5. 创建基类 `TBody`，它具有计算表面积和体积的虚函数。创建派生类 `TParalelepiped`（长方体）和 `TPyramid`（正 n 角锥，具有其用于计算表面积和体积的函数）。


    6. 创建基类 `TCurrent` 以处理货币金额。定义虚函数以传输 `UAH` 单位的金额并输出到屏幕。创建派生类 `TDollar`（美元）和 `TEuro`（欧元），它们具有在
    `UAH` 中传输和打印的函数。


    7. 创建基类 `TTTriangle` 来描述三角形，具有计算面积和周长的虚函数。使用三角形的两边和它们之间的角作为类的参数。创建派生类——直角三角形、等腰三角形和等边三角形，它们具有计算面积和周长的函数。


    8. 创建抽象基类 `TRoot`，它具有根的虚计算函数并打印结果的结果。定义派生类 `TLinear`（线性方程）和 `TSquare`（二次方程），它们具有根的计算函数和打印方程的自己的实现。


    9. 创建抽象基类 `TFunction`，它具有在指定点 `x` 处计算函数值的虚函数成员以及在屏幕上的结果输出。定义派生类 `TEllipse`（椭圆）和
    `THyperbola`（双曲线），它们具有自己的计算函数和曲线方程的打印函数。


    10. 创建抽象基类 `TTriad`，它具有对三个数据成员中每个点进行增加的虚函数和值打印。创建派生类 `TTime`（当前时间）和 `TDate`（当前日期），它们具有上述函数的自己的实现。


    11. 创建抽象基类 `TSorting`，具有 `ID` 序列、虚成员函数、排序、获取元素数量及其在屏幕上的输出。创建派生类 `TChoice`（选择方法）和
    `TQuick`（快速排序）。


    12. 创建抽象基类 `TList`——列表，具有向列表添加元素 `push()` 和从列表中删除元素 `pop()` 的虚函数。在列表的基础上实现 `stack`。


    13. 创建抽象基类 `TInteger`（整数数组），具有虚的算术运算 `+=`、`-=`、`*=`。创建派生类 `THeximal`（十六进制）、`TBinary`（二进制）、`TOctal`（八进制），实现上述函数。


    14. 创建抽象基类 `TLine`（线段）。在 `TLine` 类的基础上创建 `TColoredLine`（彩色线）、`TPolyLine`（多边形）和
    `TPolyLine`（彩色多边形），它们具有提取顶点的虚函数以及颜色改变。


    15. 创建抽象基类 `TSeries`（数列），具有计算数列的虚函数和数量。定义派生类 `TLinear`（等差数列）和 `TExponential`（等比数列），具有它们的自己的实现。


    16. 创建抽象基类 `TNorm`，具有归一化和计算向量长度的虚函数。定义派生类 `TVector2D`（平面向量）和 `TVector3D`（空间向量），具有上述函数的自己的实现。对于
    `TVector2D` 计算和的平方根，对于 `TVector3D` 计算分量的最大值。


    17. 创建抽象基类 `TContainer`，具有虚成员函数 `sort()` 和 `norm()`。创建派生类 `TBubble`（泡排序）和 `TChoice`。`TBubble`
    的 `sort()` 方法必须实现泡排序，`norm()` 计算元素之和的平方根。`TChoice` 的 `sort()` 方法必须通过最大元素进行排序，`norm()`
    计算所有元素的算术平均值。


    18. 创建抽象基类 `TArray`，具有处理数组元素的虚成员函数 `foreach()`。创建派生类 `TUnionArray` 和 `XorArray`。`TUnionArray`
    元素的求和实现为按位或，`foreach()` 执行反转数组元素（将每个元素的符号变为相反）。`XorArray` 元素的求和实现为按位异或数组元素，`foreach()`
    执行数组的比例分配。


    19. 创建抽象基类 `TArray`（不同数字数组），具有虚成员函数、元素求和以及元素处理 `foreach()`。创建派生类 `TAndArray` 和
    `TOrArray`。`TAndArray` 的数字求和实现为集合交集，`foreach()` 使用泡排序方法。`TOrArray` 的数字求和实现为集合并集，`foreach()`
    执行快速排序。


    20. 创建抽象类 `TFunction`（由系数 `a`, `b`, `c` 定义的曲线），具有在点 `x=x0` 处计算函数 `y(x)`、检查指定点
    `(x0, y0)` 是否属于曲线以及绘制曲线的虚函数成员。创建派生类 `TSquareFunction`（函数 `y = ax2+ bx +c`）和 `TLinearFunction`（方程
    `ax + by + c =0`），具有虚函数的自己的实现。

