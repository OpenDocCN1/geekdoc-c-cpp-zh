    \ square matrix) with virtual elements – sorting functions `sort()` rows column\
    \ matrix and `norm()` – finding matrix norm. To create derived classes `TRowMatrix`\
    \ (sorting function `sort()` should be realized with the growth of the minimal\
    \ row element, the function `norm()` – using the matrix norm, defined by the square\
    \ root of the sum of the squares of its elements) and `TColumnMatrix` (column\
    \ sorting function `sort()` to realize with the growth of the maximal column element,\
    \ the function `norm()` – using the matrix norm, defined by the maximal module\
    \ of its elements).\n\n22. To create the abstract class `TShape` with the data-members\
    \ real number `r` and the array of the points. To create the derivative classes\
    \ `TCircle` (with the functions, defining the number of the array points `count()`,\
    \ which belong to the circle of radius `r` and the center at the coordinates beginning\
    \ and `sort()` sorting array by the distance to the coordinates beginning) and\
    \ `TSquare` (with the functions `count()`, defining the number of the array points,\
    \ belonging to the square with the side `r` with the center at the beginning and\
    \ the sides, parallel to the axis coordinates and `sort()` – sorting the array\
    \ points by the turn angle, relating to the added direction of the abscissa axis)\
    \ with their own realization of virtual functions.\n\n23. To create the abstract\
    \ class `TMatrix` (fifth the other square matrix) with virtual members-functions\
    \ `count()` - calculating the number of rows/columns of the matrix and `remake()`\
    \ - the transformation matrix. To create derived classes `TRowMatrix` (function\
    \ `count()` returns the number of rows, containing the increasing sequence of\
    \ elements, the function `remake()` assigns zero to all the negative elements\
    \ of the matrix) and `TColumnMatrix` (function `count()` returns the number of\
    \ columns, containing only even elements, the function `remake()` changes the\
    \ signs of matrix elements to the contrary) with their own realizations of virtual\
    \ functions.\n\n24. To create the abstract base class `Row` (character string)\
    \ with virtual arithmetic operation `+=` and function `change()`. To create derived\
    \ classes `TNameRow` and `TColorRow` with their own implementations of virtual\
    \ operations and functions. In the class `TNameRow` add the data-member, which\
    \ is the name of the row (operation `+=` creates the string concatenation with\
    \ the name of the first line, and the function `change()` changes the name, given\
    \ to the line). In the class `TColorRow` add the data-member of the color line\
    \ (operation `+=` finds the concatenation of inverted lines with the color of\
    \ the first line, and the function `change()` - changes the color of the line).\n\
