    \ – 计算点到原点的距离，`distanceTwo(ob1,ob2)` – 计算两点之间的距离。\n\n# 15. 字段 `first` - 正实数，直角三角形的直角边；字段\
    \ `second` – 正实数，落在直角三角形斜边上的高 `h`。实现方法 `hypotenuse(ob1)` – 计算斜边长度，`compare(ob1,ob2)`\
    \ – 比较两个对象的面积。\n\n# 16. 字段 `first` - 正分数，工资；字段 `second` – 正整数，该月工作天数。实现方法 `sum()`\
    \ – 根据月份内指定的天数计算应得金额。\n\n`工资 / 每月天数 × 工作天数.`\n\n# 17. 字段 `first` - 正数，通话时长（分钟）；字段\
    \ `second` – 正分数，每分钟 UAH（格里夫）的价格。实现方法 `cost()` – 计算通话总费用，`compare(ob1,ob2)` –\
    \ 比较两次通话的费用。\n\n# 18. 字段 `first` - 小数的整数部分；字段 `second` – 正整数，小数的小数部分。实现方法 `multiply()`\
    \ – 将与一个带有两位小数的随机实数相乘。乘法结果为自定义结构类型变量。该方法应对任何有效的 `first` 和 `second` 值都能正常工作。\n\n\
    # 19. 字段 `first` - 正整数，光标水平坐标；字段 `second` - 正整数，光标垂直坐标。实现方法：`changex()` - 改变光标水平坐标；实现方法\
    \ `changey()` - 改变光标垂直坐标，`changexy()` - 同时改变光标坐标。方法应检查是否超出屏幕。\n\n# 20. 字段 `first`\
    \ - 正整数，数的整数部分；字段 `second` - 正整数，数的小数部分。实现方法 `multiply()` – 与 `int` 类型的随机整数相乘。乘法结果为结构类型变量。该方法应对所有有效的\
    \ `first` 和 `second` 值都能正常工作。\n\n# 21. 一对不同的正数。实现方法 `gcd(ob)` – 第一和第二个数的最大公约数，`lcm(ob)`\
    \ – 第一和第二个数的最小公倍数，`compareTwo(ob1,ob2)`- 比较两个对象最大公约数是否相等。\n\n# 22. 项 `aj` 递减等比数列通过公式计算：\n\
    \n```\naj = a0rj, j = 0, 1, 2,...\n```\n字段 `first` - 正实数，数列的第一项 `a0`；字段 `second`\
    \ – 在 0 到 1 之间的实数 `r`。实现方法 `element()` – 计算数列的第 `j` 个项，`sum()`\n\n# 23. 字段 `first`\
    \ - 正整数，年份；字段 `second` - 1 到 12 之间的整数，月份。实现方法 `daysCount(ob)` – 计算指定月份的天数（考虑到年份可能是闰年）。\n\
    \n# 24. 字段 `first` 和 `second` – 实数，确定坐标系中的点坐标。实现方法 `getX()` 和 `getY()` – 计算直角坐标系中的坐标，`distanceTwo(ob1,ob2)`\
    \ – 计算点与点的距离。\n\n# 25. 由 `first` 和 `second` 确定的极坐标中的点。实现方法 `range(ob1,ob2)` –\
    \ 检查其中一个数字是否靠近边界。\n\n### 代码示例\n\n```c\n// 体 TDate\n// 成员数据\n//d-日, m-月, y-年\n\
    struct TDate {\n    int d, m, y;\n};\n\n// 使用值 d,m,y+2000 初始化变量日期函数\nvoid init\
    \ (struct TDate* date, int d, int m, int y) {\n    date->d = d;\n    date->m =\
    \ (m % 12) > 0 ? m % 12 : 12;\n    date->y = 2000 + y;\n}\n\n// 为结构体中的字段增加年份\n\
    void addYear(struct TDate* date, int n) {\n    date->y += n;\n}\n\n// 为结构体 date\
    \ 中的字段增加月份\nvoid addMonth(struct TDate* date, int n) {\n    date->m += n;\n}\n\
    \n// 为结构体中的字段增加天数\nvoid addDay(struct TDate* date, int n) {\n    date->d += n;\n\
    }\n\n#include <stdio.h>\n\nint main() {\n    // 创建结构体 TDate 的实例（对象）\n    struct\
    \ TDate today, birthday, tomorrow;\n\n    // 初始化变量 birthday\n    // 使用 d,m,y+2000\n\
    \    init(&birthday, 30, 13, -8);\n\n    // tomorrow 赋值变量 today 的数据\n    tomorrow\
