  \n5. 创建基类 `TBody`，它具有计算表面积和体积的虚函数。创建派生类 `TParalelepiped`（长方体）和 `TPyramid`（正 n 角锥，具有其用于计算表面积和体积的函数）。\n\
  \n6. 创建基类 `TCurrent` 以处理货币金额。定义虚函数以传输 `UAH` 单位的金额并输出到屏幕。创建派生类 `TDollar`（美元）和 `TEuro`（欧元），它们具有在\
  \ `UAH` 中传输和打印的函数。\n\n7. 创建基类 `TTTriangle` 来描述三角形，具有计算面积和周长的虚函数。使用三角形的两边和它们之间的角作为类的参数。创建派生类——直角三角形、等腰三角形和等边三角形，它们具有计算面积和周长的函数。\n\
  \n8. 创建抽象基类 `TRoot`，它具有根的虚计算函数并打印结果的结果。定义派生类 `TLinear`（线性方程）和 `TSquare`（二次方程），它们具有根的计算函数和打印方程的自己的实现。\n\
  \n9. 创建抽象基类 `TFunction`，它具有在指定点 `x` 处计算函数值的虚函数成员以及在屏幕上的结果输出。定义派生类 `TEllipse`（椭圆）和\
  \ `THyperbola`（双曲线），它们具有自己的计算函数和曲线方程的打印函数。\n\n10. 创建抽象基类 `TTriad`，它具有对三个数据成员中每个点进行增加的虚函数和值打印。创建派生类\
  \ `TTime`（当前时间）和 `TDate`（当前日期），它们具有上述函数的自己的实现。\n\n11. 创建抽象基类 `TSorting`，具有 `ID`\
  \ 序列、虚成员函数、排序、获取元素数量及其在屏幕上的输出。创建派生类 `TChoice`（选择方法）和 `TQuick`（快速排序）。\n\n12. 创建抽象基类\
  \ `TList`——列表，具有向列表添加元素 `push()` 和从列表中删除元素 `pop()` 的虚函数。在列表的基础上实现 `stack`。\n\n13.\
  \ 创建抽象基类 `TInteger`（整数数组），具有虚的算术运算 `+=`、`-=`、`*=`。创建派生类 `THeximal`（十六进制）、`TBinary`（二进制）、`TOctal`（八进制），实现上述函数。\n\
  \n14. 创建抽象基类 `TLine`（线段）。在 `TLine` 类的基础上创建 `TColoredLine`（彩色线）、`TPolyLine`（多边形）和\
  \ `TPolyLine`（彩色多边形），它们具有提取顶点的虚函数以及颜色改变。\n\n15. 创建抽象基类 `TSeries`（数列），具有计算数列的虚函数和数量。定义派生类\
  \ `TLinear`（等差数列）和 `TExponential`（等比数列），具有它们的自己的实现。\n\n16. 创建抽象基类 `TNorm`，具有归一化和计算向量长度的虚函数。定义派生类\
  \ `TVector2D`（平面向量）和 `TVector3D`（空间向量），具有上述函数的自己的实现。对于 `TVector2D` 计算和的平方根，对于 `TVector3D`\
  \ 计算分量的最大值。\n\n17. 创建抽象基类 `TContainer`，具有虚成员函数 `sort()` 和 `norm()`。创建派生类 `TBubble`（泡排序）和\
  \ `TChoice`。`TBubble` 的 `sort()` 方法必须实现泡排序，`norm()` 计算元素之和的平方根。`TChoice` 的 `sort()`\
  \ 方法必须通过最大元素进行排序，`norm()` 计算所有元素的算术平均值。\n\n18. 创建抽象基类 `TArray`，具有处理数组元素的虚成员函数 `foreach()`。创建派生类\
  \ `TUnionArray` 和 `XorArray`。`TUnionArray` 元素的求和实现为按位或，`foreach()` 执行反转数组元素（将每个元素的符号变为相反）。`XorArray`\
  \ 元素的求和实现为按位异或数组元素，`foreach()` 执行数组的比例分配。\n\n19. 创建抽象基类 `TArray`（不同数字数组），具有虚成员函数、元素求和以及元素处理\
  \ `foreach()`。创建派生类 `TAndArray` 和 `TOrArray`。`TAndArray` 的数字求和实现为集合交集，`foreach()`\
  \ 使用泡排序方法。`TOrArray` 的数字求和实现为集合并集，`foreach()` 执行快速排序。\n\n20. 创建抽象类 `TFunction`（由系数\
  \ `a`, `b`, `c` 定义的曲线），具有在点 `x=x0` 处计算函数 `y(x)`、检查指定点 `(x0, y0)` 是否属于曲线以及绘制曲线的虚函数成员。创建派生类\
  \ `TSquareFunction`（函数 `y = ax2+ bx +c`）和 `TLinearFunction`（方程 `ax + by + c =0`），具有虚函数的自己的实现。\n\
  \n\n\n\n## 编程任务\n\n21. 创建抽象类 `TMatrix`（四阶方阵），其具有虚成员函数——排序函数 `sort()`（按行/列排序矩阵）和\
  \ `norm()`（求矩阵范数）。创建派生类 `TRowMatrix`（函数 `sort()` 应按行内最小元素递增的顺序实现，函数 `norm()` 使用矩阵范数，定义为矩阵所有元素平方和的平方根）和\
  \ `TColumnMatrix`（列排序函数 `sort()` 按列内最大元素递增的顺序实现，函数 `norm()` 使用矩阵范数，定义为矩阵各元素绝对值的最大值）。\n\
  \n22. 创建抽象类 `TShape`，其包含数据成员为实数 `r` 和一个点集数组。创建派生类 `TCircle`（带有函数 `count()`，定义属于半径为\
  \ `r` 且中心在坐标原点的圆内的点数量；以及 `sort()`，按到坐标原点的距离对数组排序）和 `TSquare`（带有函数 `count()`，定义属于边长为\
  \ `r`、中心在原点且边与坐标轴平行的正方形内的点数量；以及 `sort()`，按相对于横轴方向的旋转角对数组点排序），由它们各自实现虚函数。\n\n23.\
  \ 创建抽象类 `TMatrix`（五阶或其他方阵），其具有虚成员函数 `count()`（计算矩阵的行/列数）和 `remake()`（矩阵变换）。创建派生类\
  \ `TRowMatrix`（函数 `count()` 返回包含元素递增序列的行数，函数 `remake()` 将矩阵中所有负元素赋值为零）和 `TColumnMatrix`（函数\
  \ `count()` 返回仅包含偶数的列数，函数 `remake()` 将矩阵元素的符号取反），由它们各自实现虚函数。\n\n24. 创建抽象基类 `Row`（字符字符串），其具有虚算术运算符\
  \ `+=` 和函数 `change()` 函数。创建派生类 `TNameRow` 和 `TColorRow`，由它们各自对虚操作和函数进行实现。在 `TNameRow`\
  \ 类中添加数据成员表示行的名称（运算符 `+=` 创建与第一行名称的字符串拼接，函数 `change()` 修改赋予该行的名称）。在 `TColorRow`\
  \ 类中添加行颜色数据成员（运算符 `+=` 找到反转行与第一行颜色的拼接，函数 `change()` 修改行的颜色）。\n\n25. 创建抽象基类 `TFunction`，具有虚函数\
  \ `equation()` 和 `draw()`；子类 `TPolinom`（系数分配在数组中的 `n` 次多项式）及其派生类 `TDerivative` 和\
  \ `TAntiderivative`（导数和反积分），由它们各自实现虚函数。在 `TFunction`、`TDerivative` 和 `TAntiderivative`\
  \ 类中，`equation()` 函数分别在指定的均匀网格上列出多项式、其导数反积分。每个类的 `draw()` 函数在该网格上绘制对应对象的图形。\n\n\
  ### 代码示例\n\n![](img/00003.jpeg) 创建两个派生实类的抽象基类示例\n\n任务要求：创建抽象基类 `TNumber`（符号字符串形式的数字），具有纯虚算术运算符\
  \ `+=` 和函数 `sum`。\n\n创建派生类 `TIntNumber` 和 `TCharNumber`，由它们各自实现虚操作和函数。在 `TIntNumber`\
  \ 类中，运算符 `+=` 计算两个数字的算术和，函数 `sum` 计算一个数字的各位之和。\n\n在 `TCharNumber` 类中，运算符 `+=` 计算两个数字字符串的拼接，函数\
  \ `sum` 计算一个数字字符串的长度。\n\n```cpp\n#include <vcl.h>\n\n#pragma hdrstop\n\n#include\
  \ <string.h>\n#include <stdio.h>\n#include <conio.h>\n#include <iostream.h>\n\n\
  class TNumber {\n  protected :\n      char* a;\n  public:\n      TNumber(char* A){a=strdup(A);}\n\
  \      virtual TNumber& operator+=(TNumber&)=0 ;\n      virtual void print()=0;\n\
  \      virtual int sum()=0;\n      virtual ~TNumber(){delete[] a;}\n};\n\nclass\
  \ TIntNumber :public TNumber\n{\n      public:\n      TIntNumber(char* A):TNumber(A)\
  \ {}\n      TIntNumber(TNumber& ob):TNumber(ob){};\n      TNumber&  operator+=(TNumber&)\
  \ ;\n      virtual void print();\n      virtual int sum();\n      ~TIntNumber(){}\n\
  };\n\nint TIntNumber::sum()\n{\nint i=0,s=0;\nwhile(i<strlen(a))s+=a[i++]-'0';\n\
  return s;\n}\n\nTNumber& TIntNumber::operator+=(TNumber& ob)\n{\n  TIntNumber* p=(TIntNumber*)&ob;\n\
  int s=atoi(a)+atoi(p->a); // atoi(ob.a)- doesn’t work\nitoa(s,a,10);\nreturn *this;\n\
  }\n\nvoid TIntNumber::print()\n{cout<<\"\\nTIntNumber:\"<<a;}\n\nclass TCharNumber:\
  \ public TNumber\n{\n      public:\n      TCharNumber(char* A):(A) {}\n      virtual\
  \ TNumber& operator+=(TNumber&) ;\n      virtual void print();\n      int sum(){return\
  \ strlen(a);}\n      ~TCharNumber(){}\n};\n\nTNumber& TCharNumber::operator+=(TNumber&\
  \ ob)\n{\n  TCharNumber* p=(TCharNumber*)&ob;\n  strcat(a,p->a);\n  return *this;\n\
  }\n\nvoid TCharNumber::print()\n{cout<<\"\\nTCharNumber:\"<<a;}\n\nvoid printAll(TNumber*\
  \ mas[],int size)\n{\n  for(int i=0;i<size;i++)\n  {\n    mas[i]->print();\n   \
  \ cout<<\" sum=\"<<mas[i]->sum();\n  }\n}\n\nint main()\n{\n  TIntNumber a(\"12\"\
  ),b(\"345\"),c(\"35\");\n  TCharNumber A(\"12\"),B(\"345\"),C(\"35\");\n  TNumber*\
  \ mas[10]={&a,&b,&c,&A,&C};\n  b+=a;\n  b.print();\n  C+=A;\n  C.print();\n  B+=a;\n\
  \  B.print();\n  (a+=A).print();\n  mas[6]=new TIntNumber(\"33\");\n  mas[7]=new\
  \ TCharNumber(\"55\");\n  printAll(mas,8);\n  delete mas[6];\n  delete mas[7];\n\
  \  getch();\n  return 0;\n}\n\n运行结果：\nTIntNumber:457\nTIntNumber:497 sum=12\nTIntNumber:35\
  \ sum=8\nTCharNumber:12345\nTCharNumber:12345 sum=5\nTCharNumber:12345\nTCharNumber:12345\
