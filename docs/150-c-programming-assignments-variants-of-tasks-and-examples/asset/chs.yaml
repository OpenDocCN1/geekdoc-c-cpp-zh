  \ `d`、`m`、`y` 以及函数 `init()`、`addYear()`、`addMonth()`、`addDay()`。\n\n由于不同的结构体可能具有相同名的函数成员，因此在定义函数成员时，必须连同作用域解析运算符\
  \ `::` 一起指出结构体的名称。在函数成员结构体或类内部，可以使用同类的成员名称，而无需任何对象指针。`TDate` 结构体的描述提供了处理日期的函数选择，但请注意，它们不仅仅可以访问类\
  \ `TDate`。可以使用 `class` 关键字代替 `struct` 来限制访问权限。\n\n# 第 3 题。结构体与类\n\n### 任务\n\n在所有任务中编写类类型（首先是结构体，然后是实现该结构体的类）。除了任务中指定的函数外，分配的类类型对象还必须实现以下功能函数\
