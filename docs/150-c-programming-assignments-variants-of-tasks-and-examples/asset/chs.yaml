  \ `toPChar()`。\n\n所有任务必须以两种方式实现：\n\n* 数据类型通过带有必要字段的结构体分配，操作实现为外部非成员函数，这些函数接收给定类型的对象作为参数；\n\
  * 数据类型通过类分配。类数据成员是第 1 节描述的结构体类型的私有变量，类的成员函数是开放的非成员函数 `init()`、`input()`、`output()`、`toPChar()`\
