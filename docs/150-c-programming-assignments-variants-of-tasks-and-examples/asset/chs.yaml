  \ composition），也可以通过指针表示。\n\n考虑实现栈 [17] 的聚合示例，它可以保存任何类型的数据。\n\n```cpp\n// 文件 Stack.h，包含类\
  \ Stack 类的接口部分\n\n#ifndef STACKH // 如果没有定义 STACKH 指令\n\n#define STACKH //定义它\n\n\
  // TStack 类的声明\n\nclass TStack\n\n{\nstruct TLink\n{ // 在类中定义的结构体\n    void* data;\n\
  \    TLink* next;\n    TLink(void* dat, TLink* nxt);\n    ~TTLink();\n    }\n;*\
  \ head;// 聚合，使用指针\n\npublic:\n    TStack();\n    ~TStack();\n    void push(void*\
  \ dat);\n    void* peek();\n    void* pop();\n};\n\n#endif // 定义 STACKH 指令的结束\n\
  ```\n\n```cpp\n// 文件 Stack.cpp 的实现\n\n#include \"Stack.h\"\n#include <iostream.h>\n\
  \nTStack::TLink::TLink(void* d, TLink* n)\n{\n    data = d;\n    next = n;\n}\n\n\
  TStack::TLink::~TLink() { }\nTStack::TStack() { head = NULL; }\nvoid TStack::push(void*\
  \ d)\n{\n    head = new TLink(d,head);\n}\n\nvoid* TStack::peek()\n{\n    return\
  \ head->data;\n}\n\nvoid* TStack::pop()\n{\n    if(head == NULL) return NULL;\n\
  \    void* rez = head->data;\n    TLink* oldHead = head;\n    head = head->next;\n\
  \    delete oldHead;\n    return rez;\n}\n\nTStack::~TStack()\n{\n    while(head)pop();\n\
  \    cout<<\"\\nTStack empty\";\n}\n```\n\n```cpp\n// 文件：Main.cpp\n\n#include <iostream.h>\n\
  #include \"Stack.h\"\nint main(int argc, char* argv[])\n{\n{\n    TStack my;\n \
  \   int el1,el2,el3;\n    cout<<\"Input elements\\n\";\n    cin>>el1>>el2>>el3;\n\
  \    my.push(&el1);\n    my.push(&el2);\n    my.push(&el3);\n    // delete el3\n\
  \    my.pop();\n    // 输出 el2（类型转换和\n    // 指针位置）\n    cout<<*(int*)my.peek();\n\
