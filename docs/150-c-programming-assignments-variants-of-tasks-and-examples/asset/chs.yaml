- "# 150 道 C++ 编程作业：任务变体与代码示例\n\n\n\n![](img/cover.jpeg)\n\n\n\n最初出版于乌克兰，切尔诺夫，2014\n\
  由 Nonna Shulga 翻译\n\n\n本作业集是教学指南《C++ 面向对象编程》（[`amzn.com/B00NZ6M7L6`](http://amzn.com/B00NZ6M7L6)）的附录。它包含了使用\
  \ `C++ 编程语言`解决的问题及其解决方案示例。\n\n本教材旨在用于“C++ 面向对象编程”计算机科学课程。书中给出的任务涵盖了面向对象编程的基本概念：对象、类和继承。\n\
  \n本集的目的是教授学生如何从类实例化对象，以及如何继承新类。它引入了构造函数、公共和私有方法、抽象类、基类和派生类、类层次、方法重载。\n\n为了帮助学生，教材演示了所有类型作业的相似程序代码。\n\
  \n本教材仅供教育目的。\n\n\n\n![](img/00001.jpeg)\n\n\n## 前言\n\n面向对象编程基于一种概念：程序可以被创建为一组共同工作的对象集合。这种方法关注于对象之间的连接，而不是它们的实现细节。所有的\
  \ OOP（面向对象）语言都基于三个核心思想：封装、多态和继承 [13, 18, 19, 22-30]。\n\n在 `C++` 中，封装通过类来实现。对封装器内部代码和数据的访问由提供给用户的接口控制。\n\
  \n根据 OOP 的定义，多态的目的是对动作任务使用同一个名称，该名称对类来说是通用的。每个具体动作的执行将由数据类型定义。从更广泛的意义上说，多态的概念意味着为内容相同（而非实现方式相同）的组创建通用接口。\n\
  \n多态的核心在于，它允许通过为不同复杂度的对象创建实现相同动作的通用标准接口来操作这些对象。\n\n继承是一个过程，通过它一个对象获得另一个对象的特性。更准确地说，对象可以继承另一个对象的特性，并在此基础上添加仅属于自身的特征。\n\
  \n本作业集是教学指南 [22] ([`amzn.com/B00NZ6M7L6`](http://amzn.com/B00NZ6M7L6))“`C++ 面向对象编程”的附录。它包含了使用\
  \ `C++ 编程语言`解决的问题及其解决方案示例。\n\n教材由 6 部分组成。每部分包含针对特定主题的作业变体以及旨在辅助学生编写程序的代码示例。代码包含了注释和运行结果。\n\
  \n本集考虑的主题包括函数和运算符的重载、模板函数、结构类型操作、类的创建（数据成员、成员函数、构造、析构函数等）。我们还建议为了扩展现有类的功能创建类（聚合和继承），以及基类和派生类的概念、多重继承、类层次的构建、虚函数的使用、抽象类、多态函数、虚继承。\n\
  \n在教材中，我们介绍了 `C++` 面向对象编程课程的作业。某些作业（№ 2, № 3 和 № 6）基于 [11, 27] 中的思想。其他作业属于作者 [22,\
  \ 23]。\n\n# 作业 №1. 运算符与函数的重载。函数模板\n\n### 任务\n\n针对不同类型的输入数据重载函数，或创建函数模板，或者为用户标记的类型（以结构体方式定义的新类型）重载运算符\
  \ [23]。\n\n### 任务变体\n\n1. 创建一个函数，在输出接收文本（类型 `char*`）并通过删除空格来对其转换。函数必须返回删除空格的数量。将文本传递给函数。重载\
  \ `<<` 输出后的字符串。\n\n2. 创建一个结构体，在表面上定义三角形。重载运算符：\n   - `++` 向右移动 10 像素；\n   - `--`\
  \ 向左移动 10 像素；\n   - `<` 比较两个三角形。\n\n3. 创建一个结构体，在平面上定义向量。重载运算符：\n   - `!` 根据给定值按逆时针旋转\
  \ 90 度计算向量；\n   - `-` 计算与给定值方向相反且长度相同的向量；\n   - `++` 向量归一化。\n\n4. 创建函数反转包含 `int`\
  \ 和 `double` 类型元素的数组，以及反转句子中单词顺序的函数。使用函数重载并创建模板。\n\n5. 创建函数比较整数、符号字符串、向量模，并返回：\n\
  \   - `0` 如果数据相等；\n   - `1` 如果第一个比第二个大或更长；\n   - `-1` 如果第一个比第二个小或更短。\n   使用函数重载。\n\
  \n6. 创建函数打印实数和复数的平方根、向量的模。使用函数覆盖。\n\n7. 创建函数查找包含 `int` 和 `double` 类型元素的数组中的最大值，以及查找字符串（类型\
  \ `char*`）中最大单词长度的函数。使用函数重载并创建函数模板。\n\n8. 定义运算符 `++`，使用高斯法计算矩阵行列式和向量模。\n\n9. 重载运算符\
  \ `<<` 和 `>>` 用于矩阵的输入和转置后矩阵的输出。矩阵为 `n×m` 矩形，包含整数和实数元素。使用模板。\n\n10. 定义两个符号行的逻辑减法运算\
  \ `S3=S1-S2`。行 `S3` 由属于字符串 `S1` 但不属于字符串 `S2` 的符号组成。考虑两个字符串中相同符号的数量。使用运算符重载。\n\n\
  11. 为复数定义运算符 `+`、`-`、`*`、`/`。分别测试每个运算。计算表达式 `z=(x+y)/(x-y)+xy/(x+y)`。使用运算符重载。\n\n\
  \n\n\n\n## 运算符重载任务\n\n## 12. 为矩阵 (`nxn`) 定义操作 `+`、`-`、`*`。分别测试每种操作，并与 `MathCad`\
  \ 环境中获得的结果进行比较。计算表达式 `D=A*B+C*A-A*C`。使用运算符重载。\n\n## 13. 为维度为 `n` 的向量定义操作 `+`、`-`、`*`。分别测试每种操作。计算表达式\
  \ `d=(a+b)(a-b)`。使用运算符重载。\n\n## 14. 定义两个字符字符串的逻辑加法操作 `S3=S1+S2`。行 `S3` 由字符组成，这些字符至少属于行\
  \ `S1` 或 `S2`。考虑两行中相同字符的数量。使用运算符重载。\n\n## 15. 定义两个字符字符串的逻辑乘法操作 `S3=S1*S2`。行 `S3`\
  \ 由同时属于行 `S1` 和 `S2` 的字符组成。考虑两行中相同字符的数量。使用运算符重载。\n\n## 16. 三个数字 `(x, y, r)` 定义平面上的一个圆。为两个圆定义操作\
  \ `+`、`-`、`*`：\n* `+` - 交集面积；\n* `*` - 截面积；\n* `-` - 差集面积。\n使用运算符重载。\n\n## 17. 四个数字\
  \ `(x1,y1,x2,y2)` 定义平面上的一个矩形。\n`(x1,y1)`\n![](img/00002.jpeg) `(x2,y2)`\n为两个矩形定义操作\
  \ `+`、`-`、`*`：\n* `+` - 并集面积；\n* `*` - 截面积；\n* `-` - 差面积。\n使用运算符重载。\n\n## 18. 数字数组\
  \ `A(n)` 包含多项式系数 `a0 + a1 x + A2 x2 + ... + an-1 xn-1`。定义多项式的操作 `+`、`-`、`*`。使用运算符重载。\n\
  \n## 19. 数字数组 `A(n)` 定义多项式 `a0 + a1 x + a2 x2 + ... an-1 xn-1`。定义操作 `++` - 计算多项式的值。系数以列表形式存储在内存中。使用运算符重载。\n\
  \n## 20. 为复数的输入输出重载操作 `<<` 和 `>>`，以及比较两个复数模的操作 `==`。\n\n## 21. 为结构的输入输出重载操作 `<<`\
  \ 和 `>>`。结构中存储了计算机课上每周每天配对数量的数据。\n\n## 22. 为两个复数的乘法、实数与复数的乘法重载操作 `*`，并计算两个向量的标量积。\n\
  \n## 23. 对于字符串符号，重载操作：\n* `-` – 一元负号（原地反转字符串），\n* `*` – 整数 `k` 与行 `s` 的乘法。\n如果 `k>0`，则得到字符串\
  \ `s` 重复 `k` 次。如果 `k<0`，则得到反转后的字符串 `s` 重复 `k` 次。\n\n## 24. 定义函数：\n* `a & b` – 向量间的乘法；\n\
  * `! a` – 向量归一化。\n计算表达式 `a & a`、`a & b`、`! a`。\n\n## 25. 为实系数 `n` 次多项式的输入输出重载操作\
  \ `<<` 和 `>>`。\n\n## 26. 为分数 `P /Q` 定义操作 `+`、`-`、`*`、`/`，其中 `P` 为整数，`Q` 为自然数。分别测试所有操作。计算表达式\
  \ `a/d-(a+b)/(cd)`，分数 `a, b, c, d`。\n\n## 27. 定义表示平面上矩形的结构。为矩形定义操作 `<<`、`>>`：\n\
  * `>>` - 输入矩形的坐标信息和名称；\n* `<<` - 显示矩形（名称、坐标、面积）。\n\n## 28. 数字数组 `A(n)` 定义一个整数系数的多项式\
  \ `a0+ a1x + a2 x2 + ... an-1 xn-1`。定义运算符 `!` - 计算多项式的导数，`&` - 寻找原多项式。\n\n## 29.\
  \ 为存储在内存中维度为 `n` 的二进制向量的集合重载操作：\n* `+` – 集的并集；\n* `*` – 集的交集；\n* `>>` – 输入集合。\n\
  二进制向量的单个位表示对应索引在复数集合中的存在，零或一表示不存在。\n\n## 30. 为存储在内存中维度为 `n` 的二进制向量的集合重载操作（见变体 29），重载操作：\n\
  * `-` - 集的差集；\n* `!` - 集的补集；\n* `<<` - 集的输出。\n\n## 31. 创建函数，找到平面上向量的长度，字符串的长度。\n\
  \n## 32. 创建函数，找到四边形的长度，平行四边形的长度，以及三角形的长度。\n\n## 33. 为维度为 `n` 的矩阵与维度为 `n` 的向量定义乘法\
  \ `*`。\n\n## 34. 数字数组定义整数系数的多项式 `a0+ a1x + a2 x2 + ... an-1 xn-1`。定义多项式的除法操作 `/`。结果\
  \ `P(r)*Q(l)`。\n\n## 35. 为多边形（n – 顶点数，a – 边长）重载操作：\n* `++` - 定义外接圆的半径；\n* `--` -\
  \ 定义内切圆的半径；\n* `<` - 两个面积的比较。\n\n```cpp\n// 注意：提供的源代码代码块在最后部分是不完整的，\n// 但结构遵循了所要求的格式规则。\n\
  ```\n\n\n\n\n\n```cpp\ncin>>v[i];\nfor(i=0;i<5;i++)\n    cout<<v[i]*i;\ncin.get();\n\
  return 0;\n```\n\n从示例可以看出，由于编写了重载的流向量输入和输出操作，处理向量（vectors）的工作比处理字符串（lines）更加方便。\n\
  \n为了能够使用运算符重载，有必要将数组和字符串放入结构体中。\n\n注意，后一个示例演示了 4 个同名为 `operator*` 的实现，编译器通过输入参数来区分它们。\n\
  \n![](img/00003.jpeg) 函数重载示例和函数模板的使用\n\n### 任务\n创建用于由 `int`、`float`、`char*` 类型元素组成的动态数组的排序函数。\n\
  \n数组的长度将在输入时给出。\n\n使用函数重载和模板。\n\n变长字符串动态数组的输入算法可以用下面的框所示。\n\n![](img/00004.jpeg)\n\
  \n```cpp\n#include <stdio.h>\n#include <string.h>\n#include <iostream.h>\n\ntypedef\
  \ char* str;\n\n// 用于输入动态数字数组的模板\n// 不指定类型时，“引用”将不起作用\ntemplate <class T>int input(T*&\
  \ a)\n{\n  cout<<\"\\nInput the array size \";\n  int n;\n  cin>>n;\n  a=new T[n];\n\
  \  cout<<\"\\nInput the array elements \"<<endl;\n  for(int i=0;i<n;i++)\n    cin>>a[i];\n\
  \  return n;\n}\n\n// 用于输出\n// 动态数字和字符串数组的模板\ntemplate <class T> void output(T*\
  \ a, int n)\n{\n    for(int i=0;i<n;i++)\n        cout<<a[i]<<\" \";\n    cout<<endl;\n\
  }\n\n// 用于交换两个变量值的模板\ntemplate <class T> void swap (T & a, T & b)\n{\n    T c=b;\n\
  \    b=a;\n    a=c;\n}\n\n// 用于两个数字数组排序的模板\ntemplate <class T> void sort(T* a, int\
  \ n)\n{\n  int check;\n  do\n  {\n    check=0;\n    for(int i=0;i<n-1;i++)\n   \
  \ if(a[i+1]<a[i])\n    {\n        swap(a[i+1],a[i]);\n        check=1;\n    }\n\
  \    n--;\n  }while(check);\n}\n\n// 用于输入变长字符串数组的函数\nint input(str*& a) // 不使用引用将不起作用\n\
  {\ncout<<\"\\n Input the number and maximum length of the lines \";\n  int n,m;\n\
  \  cin>>n>>m;\n  a=new str[n];\n  str buffer=new char[m+1];\n  cout<<\"\\nInput\
  \ \"<<endl;\n  for(int i=0;i<n;i++)\n  {\n    cin>>buffer;\n    a[i]=new char[strlen(buffer)+1];\n\
  \    strcpy(a[i],buffer);\n  }\n  delete[] buffer;\n  return n;\n}\n\n// 用于变长字符串数组排序的函数\n\
  void sort(str* a,int n)\n{\n  int check;\n  do\n  {\n    check=0;\n    for(int i=0;i<n-1;i++)\n\
  \    if(strcmp(a[i+1],a[i])<0)\n    {\n        swap(a[i+1],a[i]);\n        check=1;\n\
  \    }\n    n--;\n  }while(check);\n}\n\n// 用于动态数字或变长字符串数组的输入、排序和输出的模板\ntemplate\
  \ <class T> void InputSortOutput()\n{\nT mas;\nint size=input(mas);\nsort (mas);\n\
  }\n\nint main(void)\n{\n// ... 根据原文继续继续逻辑\nreturn 0;\n}\n```\n\n从示例可以看出，由于编写了重载的流向量输入和输出操作，处理向量（vectors）的工作比处理字符串（lines）更加方便。\n\
  \n为了能够使用运算符重载，有必要将数组和字符串放入结构体中。\n\n注意，后一个示例演示了 4 个同名为 `operator*` 的实现，编译器通过输入参数来区分它们。\n\
  \n### 任务\n创建用于由 `int`、`float`、`char*` 类型元素组成的动态数组的排序函数。\n\n数组的长度将在输入时给出。\n\n使用函数重载和模板。\n\
  \n变长字符串动态数组的输入算法可以用下面的框所示。\n\n（注：提供的剩余文本包含重复且碎片化的技术描述，已整合到上面的代码块结构中。）\n\n\n\n\n\n\
  ## 7. 字段 `first` – 正实数，商品单价；字段 `second` – 正整数，商品数量。实现方法 `cost(ob)` – 计算单种商品的价格，`costTwo(ob1,ob2)`\
  \ – 计算两个对象的总价格。\n\n# 8. 字段 `first` – 正整数，每 100 克产品的热量含量；字段 `second` – 正分数，产物以千克（kg）为单位的质量。实现计算单个产品总热量的方法，以及\
  \ `compareTwo(ob1,ob2)` – 比较两个产品的总热量。\n\n# 9. 字段 `first` – 分数（分子、分母），范围的左边界；字段 `second`\
  \ – 分数（分子、分母），范围的右边界，以实现方法 `rangeCheck()` – 检查指定的分数是否在范围 `[first, second]` 之间。\n\
  \n# 10. 字段 `first` – 整数，范围的左边界，属于范围内；字段 `second` – 整数，范围的右边界，不属于范围内。这对数字分配了一个半开区间\
  \ `[first, second)`。实现方法 `rangeCheck()` – 检查指定的数字是否在范围内，`rangePrintUnion(ob1,ob2)`\
  \ – 输出两个范围组合后的所有整数。\n\n# 11. 时间间隔通过字段指定：`first` - 正整数，小时；字段 `second` - 正整数，分钟。实现方法：`minutes()`\
  \ – 将时间转换为分钟，`shiftForward()` 和 `shiftBack()` – 增加/减少 20 分钟的时间段。\n\n# 12. 字段 `first`\
  \ - 实数；字段 `second` – 整数，指数。实现方法 `power()` – 将第一个数升到 `second` 次幂。该方法应对对所有有效的 `first`\
  \ 和 `second` 值都能正常工作。不要使用 math 库中的 `pow()` 函数。\n\n# 13. 线性方程 `Ax+B=0`。字段 `first`\
  \ – 分数（分子、分母），系数 `A`；字段 `second` – 分数，系数 `B`（分子、分母）。实现方法 `root()` – 计算线性方程的根。该方法必须检查系数\
  \ `A` 是否为零。\n\n# 14. 字段 `first` - 实数，平面上点的 `x` 坐标；字段 `second` – 实数，平面上点的 `y` 坐标。实现方法\
  \ `distance()` – 计算点到原点的距离，`distanceTwo(ob1,ob2)` – 计算两点之间的距离。\n\n# 15. 字段 `first`\
  \ - 正实数，直角三角形的直角边；字段 `second` – 正实数，落在直角三角形斜边上的高 `h`。实现方法 `hypotenuse(ob1)` – 计算斜边长度，`compare(ob1,ob2)`\
  \ – 比较两个对象的面积。\n\n# 16. 字段 `first` - 正分数，工资；字段 `second` – 正整数，该月工作天数。实现方法 `sum()`\
  \ – 根据月份内指定的天数计算应得金额。\n\n`工资 / 每月天数 × 工作天数.`\n\n# 17. 字段 `first` - 正数，通话时长（分钟）；字段\
  \ `second` – 正分数，每分钟 UAH（格里夫）的价格。实现方法 `cost()` – 计算通话总费用，`compare(ob1,ob2)` – 比较两次通话的费用。\n\
  \n# 18. 字段 `first` - 小数的整数部分；字段 `second` – 正整数，小数的小数部分。实现方法 `multiply()` – 将与一个带有两位小数的随机实数相乘。乘法结果为自定义结构类型变量。该方法应对任何有效的\
  \ `first` 和 `second` 值都能正常工作。\n\n# 19. 字段 `first` - 正整数，光标水平坐标；字段 `second` - 正整数，光标垂直坐标。实现方法：`changex()`\
  \ - 改变光标水平坐标；实现方法 `changey()` - 改变光标垂直坐标，`changexy()` - 同时改变光标坐标。方法应检查是否超出屏幕。\n\n\
