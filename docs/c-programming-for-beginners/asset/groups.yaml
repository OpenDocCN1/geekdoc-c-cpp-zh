    You may use loops in coding when you need to repeat a large number of commands.


    After performing an action, such as retrieving and modifying data, a state is
    reviewed, such as if a counter has met a predetermined value (i.e., the loop ended
    when the user enters a certain value).


    If the counter does not exceed the target value, the next statement in the program
    loops back to the first statement of the program and repeats it.


    If the criterion is met, the next statement then "falls through" to the next consecutive
    statement or splits well beyond the loop.


    Loops may be divided into two categories:


    Entry Regulated Loops: The test state is checked prior to entering the loop code.
    Entry loops, such as For Loop and While Loop, are entry-regulated loops.


    Exit Regulated Loops: The test state is checked or validated at the end of the
    loop body. As a result, regardless of whether the test state is valid or incorrect,
    the loop program can run at least once. The exit-regulated loop is known as the
    do-while loop.'
