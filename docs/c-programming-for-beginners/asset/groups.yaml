    ## Arithmetic Operators


    Operators are the building blocks of every programming language


    As a result, even without the usage of operators, the compatibility of the C++
    programming language can be described as identifiers that allow us to conduct
    particular mathematical or logical calculations on operands. To put it another
    way, an operator controls the operands.


    There are two kinds of arithmetic operators:


    - Unary operators: These are the operators that function by the use of one operand.
    (i.e., --, ++).

    - Binary operators: These are the operators which function on 2 operands. (i.e.,
    *, +, /, *)


    ```cpp

