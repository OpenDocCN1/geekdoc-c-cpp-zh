    # ## 1.1: Introduction to Programming


    Before we can learn code, we must first comprehend what a computer is. A machine
    is either a computing system that performs data underneath the supervision of
    a computer program or a system that can take human command, interpret it, and
    react to it. A program is a gathering of commands and records.


    A computer''s essential components are:


    +   - Input device

    - Central Processing Unit (CPU)

    - Unit of output


    The Processor is further broken down into three sections:


    +   - Memory device

    - Unit of control

    - Device on Arithmetic Logic


    A majority of people have learned that the CPU is the computer''s brain. It absorbs
    data, stores it in transient memory before it is saved on the hard disc, conducts
    logical operations on it, and thereby transforms (also known as converts) data
    into facts. A machine, as we all know, is made up of software and hardware. Software
    is a collection of programs that work together to complete various tasks. An operating
    system (O.S.) is a system that allows people to communicate with computers.


    Software is a series of directions for a machine to follow for it to execute a
    particular task. A disc, also known as a machine,'
  - '[PAGE 127]


    is a computing system that processes data under a computer program''s supervision.
    Fresh data is translated into output values layout when the software is running.
    Such high-level programming (HLL) languages are used to create these computer
    programs. High-level languages (HLL) are almost human-like languages but are more
    complicated than machine-understandable languages, also known as low-level languages
    (LLL).


    Now that we''ve covered the fundamentals, we''re able to develop a simplistic
    curriculum. We have various languages to interact with one another, and we have
    multiple languages to interact with machines, such as C, C++, C#, Java, Python,
    etc. The robot may only comprehend binary language (the dialect of os and 1s),
    also known as computer language or low-level language (LLL). However, the programs
    you write are written in a high-level language (HLL) that''s more human-like.


    Assembly language, exists among high-level and software languages. Assembly languages
    are specially tailored to complex computer architecture. Assembly code is converted
    into executable computer code using a utility tool called Assembler. High-level
    programming languages are portable, but they must be interpreted or compiled into
    a machine language that computers may understand.


    # Programming Language Characteristics –


