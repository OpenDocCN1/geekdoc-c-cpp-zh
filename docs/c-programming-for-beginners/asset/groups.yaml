    # Logical Operators


    Logical Operators are used to merge two or more circumstances or to supplement
    the analysis of the initial state. The product of a logical operator action is
    a Boolean value that is either true or false. For instance, the logical AND operator
    (defined as ''&&'') returns true when all of the requirements under evaluation
    are fulfilled. If not, it returns false. As a result, a && returns true if both
    A and B are true (i.e., high).


