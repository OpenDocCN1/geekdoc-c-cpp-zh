    \n# 目录\n\n- 引言\n- 第一章：什么是 C++\n- 1.1：编程简介\n- 1.2：为什么要编程\n- 1.3：C++ 简介\n- 1.4：为什么选择\
    \ C++\n- 第二章：C++ 是如何运行的\n- 2.1：入门\n- 2.2：你的第一个程序\n- 2.3：输入与输出\n- 2.4：修饰符与数据类型\n\
    - 2.5：变量\n- 2.6：常量\n- 第三章：基本规则与应用\n- 3.1：算术与逻辑运算\n- 3.2：决策语句\n- 3.3：循环\n- 3.4：数组\n\
    - 3.5：函数\n- 3.6：结构与枚举\n- 第四章：编写你自己的 C++ 程序\n- 第五章：C++ 中应避免的错误\n\n## 5.1：常见错误\n\
    \n# 结论\n\n## 2.2：你的第一个程序\n\nC++ 包含了具有多种处理输入输出方法的库。在 C++ 中，输入和输出被描述为一系列字节，通常被称为流，或者更广泛被接受的基于流的处理。Cin\
    \ 和 Cout 在命令行和面向对象的应用程序通信中非常常见，因为从命令行接收信息和向命令行输出数据是非常普遍的操作。\n\n程序：\n\n```cpp\n\
    //A Simple Program\n#include <iostream> //头文件\nusing namespace std;\n\nint main(){\n\
    \    cout << \"This is my first C++ Program!\";\n    //displays \"This is my first\
    \ C++ program!\"\n    return 0;\n}\n```\n\n输出：\n\n![](img/8c6160092cce13ec6d42e1c774234053_9_0.png)\n\
    \n每一行以 '#' 开头的行被称为指令；预处理器处理这些指令以供编译器调用。\n它是一个头文件，'iostream' 指输入输出流，用于输入和输出函数。\n\
    \n**using namespace std;**\n\n此语句在每次输入和输出之前将 std 命名空间导入程序中，因此为了方便起见，它是首选的。\n\n\
    **int main(){...}**\n\n这一行声明了一个名为 \"main\" 的函数，返回整数类型的结果。函数是一组旨在执行赋值的语句。传统模型是任何以此关键特征开头的\
    \ C++ 程序，即使它并不在开头。如果没有 main() 特性，大括号 ' }' 表示 main 函数的开始和结束。\n\n```cpp\ncout <<\
    \ \"...\"\n```\n\n此语句将引号之间的任何内容显示在屏幕上，供用户查看。\n\n# 缩进\n\n如你所见，cout 和 return 语句被缩进或向右页面移动。这提高了代码的可读性。在类类软件中这可能看起来并不相关，但当应用程序变得复杂时，它允许代码更易于理解且更不容易出错。因此，必须使用缩进和注释来使代码更易于理解。\n\
    \n## 2.3：输入与输出\n\nC++ 拥有包含多种执行输入输出方法的库。在 C++ 中，输入和输出被描述为一系列字节，通常被称为流。\n\n输入流是一种名为\
    \ input 的方法，如果字节流是从计算机（例如键盘）到主内存的。\n\n输出流机制命名为 output，如果字节流方向相反，即：从主内存到显示器（显示屏幕）。\n\
    \n在 C++ 中进行输入输出操作需要以下头文件：\n\n- **iostream**: iostream 是普通输入输出流的缩写。此头文件包含了 cin、cout、cerr\
    \ 等属性的规范。\n- **fstream**: 此头文件详细定义了文件流。此头文件管理从文件名解释为输入的数据或作为输出插入到文件的数据。\n- **iomanip**:\
    \ iomanip 是输入输出操纵符的缩写。使用这些文件中声明的方法对流进行操作。此文件包含了 setprecision、setw 以及其他术语的含义。\n\
    \nC++ 关键字 cout 和 cin 经常用于打印输出和获取输入。在 C++ 中，这些可能是接受输入和显示数据最基本的方式。要使用 cout 和 cin，需要包含头文件\
    \ 'iostream'。\n\n使用 cout 和 cin：\n//输入输出\n\n```cpp\n#include <iostream>\nusing\
    \ namespace std;\n\nint main(){\n    cout << \"This is my first C++ Program!\"\
    ;\n    //displays \"This is my first C++ program!\"\n    return 0;\n}\n```\n\n\
    输出：\n\n![](img/8c6160092cce13ec6d42e1c774234053_9_0.png)\n\n## 2.4：修饰符与数据类型\n\n\
    后续页面中的信息被广泛认为是事实的真实、准确描述，因此，读者对相关信息的任何疏忽、使用或误用将导致任何产生的后果由其自行承担。在任何情况下，本书的出版者或原作者均对在采取本文此处描述的信息后可能发生的任何困难或损害不承担责任。\n\
    \n此外，后续页面中的信息仅供参考，因此应被认为是通用的。根据其性质，其呈现不保证其长期有效性或中间质量。文中提到的商标是在未获得书面许可的情况下使用的，不能以任何方式视为商标持有者的背书。\n\
    \n### 原始数据类型\n\n这些数据类型是预定义的，用户可以使用。以下是 C++ 中的类型：\n\n- 整数\n- void\n- 宽字符\n- 字符\n\
    - 布尔\n- 双精度浮点\n- 宽字符\n\n# 派生类型\n\n这些是从内置数据类型派生的类型，例如 int\n\n- 函数\n- 指针\n- 引用\n\
    - 数组\n\n# 用户定义数据\n\n用户选择的数据类型。在 C++ 中，你可以定义一个类或结构。\n\n- 枚举\n- 类\n- 联合体\n- 结构\n\
    - 类型定义\n\n# 原始数据类型\n\n**整数 (int)**: 'int' 用于整数数据类。整数通常占用 4 字节空间，范围从 -2147483648\
    \ 到 2147483647。\n\n**字符 (char)**: 字符数据形式用于存储字符。数据类型形式由 'char' 表示。字符通常占用一个字节的空间，从\
    \ -128 到 127 或到 255。\n\n**布尔 (bool)**: 布尔数据形式用于存储真或假值。布尔数据的布尔变量为 'bool'。\n\n**浮点\
    \ (float)**: 浮点存储形式存储小数的浮点值。浮点数据的单词是 'float'。浮点变量通常占用 4 字节内存。\n\n**双精度浮点 (double)**:\
    \ 双精度浮点数据形式用于存储双精度小数的浮点值。使用 'double' 来描述数据类型。双精度变量通常占用 8 字节存储。\n\n**空 (void)**:\
    \ 'void' 指没有意义的东西。数据类型表示无意义的对象。Void 数据形式用于不返回任何结果或值的函数。\n\n**宽字符 (wchar_t)**:\
    \ 这种数据形式比标准的 8 位数据类型更大的字符类型。'wchar_t' 表示宽字符，长度为 2 或 4 字节。\n\n"
