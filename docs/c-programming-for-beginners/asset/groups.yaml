    \ OF CONTENTS\n\n- Introduction\n- Chapter 1: What is C++\n- 1.1: Introduction\
    \ to Programming\n- 1.2: Why Program\n- 1.3: Introduction to C++\n- 1.4: Why C++\n\
    - Chapter 2: How C++ Works\n- 2.1: Getting Started\n- 2.2: Your First Program\n\
    - 2.3: Input and Output\n- 2.4: Modifiers and Data Types\n- 2.5: Variables\n-\
    \ 2.6: Constants\n- Chapter 3: Basic Rules and Application\n- 3.1: Arithmetic\
    \ and Logical Operations\n- 3.2: Decision Statements\n- 3.3: Loops\n- 3.4: Arrays\n\
    - 3.5: Functions\n- 3.6: Structures and Enumerations\n- Chapter 4: Make your own\
    \ C++ Program\n- Chapter 5: Mistakes to Avoid Within C++\n\n## 5.1: Common Errors\n\
    \n# Conclusion\n\n## 2.2: Your First Program\n\nC++ includes libraries that have\
    \ several methods for handling input and output. There are more generally accepted\
    \ ways of expressing a computation in C++ as a series of bytes or as more widely\
    \ regarded as stream-based processing. Cin and Cout are common between command\
    \ lines and communication in one-oriented applications since it is quite common\
    \ to receive information and output data from the command line.\n\nProgram:\n\n\
    ```cpp\n//A Simple Program\n#include <iostream> //header file\nusing namespace\
    \ std;\n\nint main(){\n    cout << \"This is my first C++ Program!\";\n    //displays\
    \ \"This is my first C++ program!\"\n    return 0;\n}\n```\n\nOutput:\n\n![](img/8c6160092cce13ec6d42e1c774234053_9_0.png)\n\
    \nEvery line that begins with '#' is referred to as a directive; the preprocessor\
    \ processes these to be invoked by a compiler.\nIt is a header file, 'iostream'\
    \ refers to input-output stream, and it is used for input and output functions.\n\
    \n**Using namespace std;**\n\nThis statement imports the std namespace into the\
    \ program, before each input and output, so it is preferred for convenience.\n\
    \n**int main(){...}**\n\nThis line declares a function called \"main\" that returns\
    \ integer-type results. Functions are sets of statements that are conceived to\
    \ assignment. The traditional model is any C++ program that starts with this key\
    \ feature, even though it is not near the start. Without a main() feature, the\
    \ braces ' }' denote the beginning and end of the main function.\n\n```cpp\ncout\
    \ << \"...\"\n```\n\nThis statement displays anything between the quotations onto\
    \ the screen for the user to see.\n\n# Indentations\n\nIf you see, the cout and\
    \ return statements are being indented or shifted to the right page. It improves\
    \ the readability of the code. It may not seem relevant in software like this,\
    \ but it allows the code to be more understandable and less error-prone when applications\
    \ get more sophisticated. As a result, indentations and annotations must still\
    \ be used to render the code more understandable.\n\n## 2.3: Input and Output\n\
    \nC++ has libraries that include several methods for executing input and output.\
    \ In C++, input and output are described as a series of bytes, often known as\
    \ streams.\n\nInput Stream is a method named input if the stream of bytes is from\
    \ the computer (for example, a keyboard) to main memory.\n\nOutput Stream mechanism\
    \ is named output if the stream of bytes is in the opposite direction, i.e., from\
    \ main memory to monitor (display screen).\n\nThe following header files are required\
    \ in C++ for Input and output operations:\n\n- **iostream**: iostream is an abbreviation\
    \ for a normal input-output stream. This header file includes specifications for\
    \ properties such as cin, cout, cerr, etc.\n- **fstream**: This header file defines\
    \ the file stream in detail. This header file manages data that is interpreted\
    \ from a filename as input or inserted into a file as output.\n- **iomanip**:\
    \ iomanip is an abbreviation for input-output manipulators. Flows are manipulated\
    \ using the methods declared in these files. This file includes meanings for setprecision,\
    \ setw, and other terms.\n\nThe C++ keyword cout and cin are frequently used to\
    \ print outputs and take inputs. In C++, these are perhaps the most fundamental\
    \ ways for accepting input and displaying data. To use cout and cin, the header\
    \ file, 'iostream,' must be included in the package.\n\nTry this code yourself:\n\
    //Input Output Program\n\n```cpp\n#include <iostream>\nusing namespace std;\n\
    int main(){\n    int age;//this is a variable declaration of type integer.\n \
    \   cout<<\"How old are you?\";\n    cin>>age;//this lets the user enter data.\n\
    \    cout<<\"You are \" << age;\n    return 0;\n}\n```\n\nOutput:\n\n![](img/8c6160092cce13ec6d42e1c774234053_14_0.png)\n\
    \n## 2.4: Modifiers and Data Types\n\nA Datatype is used for all variables throughout\
    \ the declaration to limit the type of data that may be processed. As a result,\
    \ we may assume that data types are used to notify variables about the kind of\
    \ data they can hold. When you create a variable in C++, the compiler assigns\
    \ memory for it depending on the data type for which it is declared. Each data\
    \ form necessitates a specific size of memory.\n\n### Types of Primitive Data\n\
    \nThese data types are predefined so that the user may use them to declare variables\
    \ directly. For instance, int, float, bool, char, and so on. The following primitive\
    \ data forms are accessible in C++:\n\n- integer\n- void\n- wide character\n-\
    \ Character\n- Boolean\n- double Floating Points\n- floating point\n- wide character\n\
    \n# Derived datatype\n\nThese are data types that are derived from built-in datatypes\
    \ (i.e., int, char)\n\n- Function\n- Pointer\n- Reference\n- Array\n\n# The abstract\
    \ or User-Identified Data\n\nData types that the user chooses. As an example,\
    \ in C++, you may define a class or a structure.\n\n- Enumeration\n- Class\n-\
    \ Union\n- Structure\n- Typedef\n\n# Primitive Datatypes\n\n**Integer (int)**:\
    \ The term 'int' is used for integer data classes. Integers normally take up 4\
    \ bytes of storage space and have values ranging between -2147483648 to 2147483647.\n\
    \n**Character (char)**: The data form character is used to store characters. The\
    \ data type form is denoted by the term 'char.' Characters normally take up one\
    \ byte of storage space and vary from -128 to 127 or to 255.\n\n**Boolean (bool)**:\
    \ The Boolean data form is used to store rational or false values. A Boolean variable\
    \ for Boolean data is 'bool.'\n\n**Floating point (float)**: The Floating-Point\
    \ storage form stores floating-point values of decimal figures. The word for floating-point\
    \ data is 'float.' Float variables normally take up to 4 bytes of memory space.\n\
    \n**Double Floating Point (double)**: The double-floating point data form is used\
    \ to store floating-point values of double decimal points. The term 'double' is\
    \ used to describe the data type. Double variables normally take up 8 bytes of\
    \ storage.\n\n**Void (void)**: The term 'void' refers to something that has no\
    \ meaning. The datatype denotes a meaningless object. The Void data form is used\
    \ for functions that do not return any result or value.\n\n**Wide character (wchar_t)**:\
    \ This data form is a character datatype that is larger than the standard 8-bit\
    \ data type. 'wchar_t' represents a wide character can be 2 or 4 bytes in length.\n"
