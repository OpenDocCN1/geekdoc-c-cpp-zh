  md: '# Comments


    A good programming standard holds that a well-formatted program is crucial. Expansion
    on a piece of code can help software be more comprehensible, and error fixing
    becomes much simpler. Adding a comment to the code is a vital aspect of proper
    documentation. A comment is a text used in the source code that can be interpreted
    by programmers, as opposed to text that can be understood only by users or outsiders.
    Some phrases are not compiled or interpreted by the compiler or the interpreter.


    You add a comment like so:


    ```

    //This is a comment that will not affect the overall code. Use\//double slashes
    to add only one sentence worth of text.

    /* But if you wish to add a paragraph, add a backslash/'',\and then asterisk ''*''
    on either side of your piece of text. */

    ```


    We use these comments throughout the book to explain pieces of code.'
