    # Characters


    The characters people use to communicate aren''t naturally understood by digital
    systems, which operate on bits. To process characters, digital systems use character
    encodings that assign unique integer values, referred to as code points, to designate
    specific characters. As you''ll see, there are multiple ways to encode the same
    notion character in your program. Common standards used by C implementations include
    Unicode, ASCII, Extended ASCII, ISO 8859-1 (Latin-1), Shift-JIS, and EBCDIC.


    The C Standard explicitly references Unicode and ASCII.


    # ASCII


    The 7-bit Standard Code for Information Interchange, better known as 7-bit ASCII,
    specifies a set of 128 characters and their coded representation (ANSI X3.4-1986).
    Characters from 0x00 to 0x1f and character 0x7f are control characters, such as
    null, space, horizontal tab, and DEL. Characters from 0x20 through 0x7e are all
    printable characters such as letters, digits, and symbols.


    We refer to this standard with the updated name US-ASCII to clarify that this
    system was developed in the United States and focuses on the typographical encoding
    schemes used in this country. Most modern character encoding schemes are based
    on US-ASCII, although they support many additional characters.


    Characters in the 0x80 to 0xFF range are not defined by US-ASCII but are part
    of the 8-bit character encoding known as Extended ASCII. Numerous encodings for
    these ranges exist, and the actual mapping depends on the code page. A code page
    is a character encoding that maps a set of printable characters and control characters
    to unique numbers.


    # Unicode


    Unicode has become the universal character encoding standard for representing
    text in computer processing. It supports a much wider range of characters than
    ASCII; the current Unicode Standard (2023) encodes characters in the range U+0000
    to U+FFFF, which amounts to a 21-bit space. An Unicode value is expressed as U+
    followed by four hexadecimal digits in printed text. The Unicode characters U+0000
    to U+0FFF are identical to those in US-ASCII, and the range U+0000 to U+0FF is
    identical to ISO 8859-1, consisting of characters from the Latin script used throughout
    the Americas, Western Europe, Oceania, and much of Africa.


