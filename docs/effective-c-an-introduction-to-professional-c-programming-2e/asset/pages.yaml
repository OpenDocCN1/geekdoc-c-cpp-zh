  md: 'This copy calls malloc to allocate 16 bytes of memory and then uses strncpy
    to copy the first 15 bytes of a string into the allocated memory. The programmer
    attempts to create a null-terminated string by copying one byte fewer than the
    size of the allocated memory. In doing so, the programmer assumes that the allocated
    storage already contains a zero value to serve as the null byte. However, the
    storage could easily contain nonzero values, in which case the string would not
    properly null-terminated, and the call to printf() would result in undefined behavior.


    A common solution is to write a null character into the last byte of the string,
    as follows:


    ```

    strncpy(str, "123456789abcdef", 15);

    str[15] = ''\0'';

    ```


    If the source string (the string "123456789abcdef" in this example) has fewer
    than 15 bytes, the null termination character will be copied, and the assignment
    is unnecessary. If the source string has 15 bytes or longer, adding this assignment
    ensures that the string is properly null terminated.


    # aligned_alloc


    The aligned_alloc function is similar to the malloc function, except that it requires
    to provide an alignment as well as a size for the allocated object. The function
    has the following signature, where size specifies the object''s size and alignment
    specifies its alignment:


    ```

    void *aligned_alloc(size_t alignment, size_t size)

    ```


    Although C requires the dynamically allocated memory from malloc to be sufficiently
    aligned for all standard types, including arrays and structures, you might occasionally
    need to override the compiler''s default choices. You can use the aligned_alloc
    function to request stricter alignment than the default. If the value of alignment
    is not a valid alignment supported by the implementation, the function fails by
    returning a null pointer. See Chapter 2 for more information on alignment.


    # calloc


    The calloc function allocates storage for an array of nmemb objects, of whose
    size is size bytes. Here is the following signature:


    ```

    void *calloc(size_t nmemb, size_t size)

    ```


    This function initializes the storage to all zero-valued bytes. These zero values
    might not be the same one used to represent floating-point zero or null-pointer
    constants. You can also use the calloc function to allocate storage for a single
    object, which can be thought of as an array of one element.'
