    # Source and Execution Character Sets


    No universally accepted character encoding existed when C was originally standardized,
    so it was designed to work with a wide variety of character representations. Instead
    of specifying a character encoding like Java, C implementation defines both a
    *source character set* in which source files are written and an *execution character
    set* used for character and string literals at compile time.


    Both the source and execution character sets must contain encodings for the uppercase
    and lowercase letters of the Latin alphabet; the 10 digits; 29 graphic characters;
    and the space, horizontal vertical, tab, form, and newline characters. The execution
    character set also includes alert, backspace, carriage return, and null characters.


    Character conversion and classification functions (such as isdigit) are evaluated
    at runtime, based on the locale-determined encoding in effect at the time of the
    call. A program’s *locale* defines code sets, date and time formatting conventions,
    monetary conventions, decimal formatting conventions, and sort order.


