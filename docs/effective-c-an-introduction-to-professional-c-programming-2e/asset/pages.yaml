  md: '# Storage Duration


    Objects occupy storage, which might be read-write memory, read-only memory, or
    central processing unit (CPU) registers. Storage of allocated duration has significantly
    different properties from storage of either automatic or static storage duration.
    First, we''ll review automatic and static storage duration.


    Objects of automatic storage duration are declared within a block or as a function
    parameter. The lifetime of these objects begins execution and ends when execution
    of the block ends. If the block is entered recursively, a new object is created
    each time, with its own storage.


    Objects declared at file scope have static storage duration. The lifetime of these
    objects is the entire execution of the program, and their stored value is initialized
    prior to program startup. You can also declare a variable within a block to have
    static storage duration by using the static-class classifier.


    # The Heap and Memory Managers


    Dynamically allocated memory has allocated storage duration. The lifetime of an
    allocated object extends from the allocation until the deallocation. Dynamically
    allocated memory is allocated from the heap, which is simply one or more large,
    subdividable blocks of memory managed by the memory manager.


    Memory managers are libraries that manage the heap by providing implementations
    of the standard memory management functions described in this chapter. A memory
    manager runs as part of the client process. The memory manager requests one or
    more blocks of memory from the operating system (OS) and then allocates this to
    the client process when it invokes a memory allocation function. Allocation requests
    do not go directly to the OS because it''s slower and works only in big chunks
    of memory, whereas allocators split up big chunks into little chunks and are faster.


    Memory managers manage unallocated and deallocated memory. Once memory has been
    allocated, the caller manages the memory until it''s returned. It''s the caller''s
    responsibility to ensure that the memory is deallocated, although most implementations
    will reclaim dynamically allocated memory when the program terminates.


    # MEMORY MANAGER IMPLEMENTATIONS


    Memory managers frequently implement a variant of a dynamic storage algorithm
    described by Donald Knuth (1997). This algorithm uses boundary tags, which are
    size fields that appear before and after the block of memory'
