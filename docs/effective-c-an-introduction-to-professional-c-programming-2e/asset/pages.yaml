    # Variably Modified Types


    Variably modified types (VMTs) define a base type and an extent (number of elements),
    which is determined at runtime. VMTs are a mandatory feature of C23.


    VMTs can be used as function parameters. Remember from earlier in this chapter,
    when used in an expression, an array is converted to a pointer to the first element
    of the array. This means we must add an explicit parameter to specify the size
    of the array—for example, the n parameter in the signature for memset:


    ```

    void memset(void *s, int c, size_t n);

    ```


    When you call such a function, n should accurately represent the size of the array
    referenced by s. Undefined behavior results if s is larger than the array.


    When declaring a function to take an array as an argument you must declare the
    size of the array before referencing it in the array declaration. We could, for
    example, modify the signature for the memset function as follows to take the number
    of elements n and an array of at least n elements:


    ```

    void memset_vmt(size_t n, char s[n], int c);

    ```


    For arrays of character type, the number of elements is equal to the size. In
    this signature, s[n] is a variably modified type because s[n] depends on the runtime
    value of n.


