    program, or with other programs.


    Understanding how to decompose a program typically requires experience. Many of
    the decisions programmers are driven by performance. For example, you may need
    to minimize communication over a high-latency interface. Bad hardware can only
    go so far; you need bad software to screw up performance.


    Performance is only one software quality attribute (ISO/IEC 25000:2014) and must
    be balanced with maintainability, code readability, understand, safety, and security.
    For example, you may design a client application to handle input field validation
    from the user to avoid a round trip to the server. This helps performance but
    can hurt security if inputs to the server are not validated. A simple solution
    is to validate inputs in both locations.


    Developers do strange things for illusory gains. The strongest of these is invoking
    the undefined behavior of signed integer overflow to performance. Frequently,
    these local optimizations have no impact on overall system performance and are
    considered premature optimizations. Donald Knuth, The Art of Computer Programming
    (Addison-Wesley, 1997), described premature optimization as “the root of all.”


    In this section, we’ll cover some principles of component-based software engineering.


    # Coupling and Cohesion


    In addition to performance, the aim of a well-structured program is to achieve
    desirable properties like low coupling and high cohesion. Cohesion is a measure
    of the commonality between elements of a programming interface. Assume, for example,
    that a header exposes functions for calculating the length of a string, calculating
    the tangent of a given input value, and creating a thread. This header has low
    cohesion because the exposed functions are unrelated to each other. Conversely,
    a header that exposes functions to calculate the length of a string, concatenate
    two strings, and search for a substring within a string has high cohesion because
    all the functionality is related. This way, if you need to work with strings,
    you need only to include the string here. Similarly, related functions and type
    definitions that form a public interface should be exposed by the same header
    to provide a highly cohesive interface of limited functionality. We’ll discuss
    public interfaces further in “Data Abstractions” on page 215.


    Coupling is a measure of the interdependency of programming interfaces. For example,
    a tightly coupled header can’t be included in a program by itself; instead, it
    must be included with other headers in a specific order. You may couple interfaces
    for a variety of reasons, such as a mutual relation on data structures, interdependence
    between functions, or the use of'
