    \ Floating-Point Support\n\nC23 updates IEEE floating-point support by integrating\
    \ TS 18661-1, 2, and 3 (ISO/IEC TS 18661-1 2014, ISO/IEC TS 18661-2 2015, ISO/IEC\
    \ 18661-3 2015). Annex F now has parity with the IEEE standard for floating-point\
    \ arithmetic (IEEE 754-2019). Annex F also applies to decimal floats: `Decimal32`,\
    \ `Decimal64`, and `Decimal128`. You cannot mix decimal operations with binary,\
    \ complex, or imaginary floats. Annex H (previously the language-independent arithmetic\
    \ annex) supports interchange, extended floating types, and nonarithmetic interchange\
    \ formats. It allows for binary64 graphics processing unit (GPU) data, binary,\
    \ or decimal representations.\n\nMath library supports `<math.h>` operations on\
    \ `DecimalN`, `FloatN`, and `_FloatN` types. Special variants of exponents, logarithms,\
    \ and π-based trig functions; improved functions for min/max, total ordering,\
    \ and testing for numerical properties; and functions allowing fine-grained control\
    \ of conversions between floating-point values and integers or strings have been\
    \ added.\n\nThe `memset_explicit` function has been added for when you need to\
    \ clear memory. It is the same as `memset`, except the optimizer cannot remove\
    \ a call to it. The `strdup` and `strndup` functions have been adopted from POSIX."
