    # Endian


    Object types other than character types can include padding as well as value representation
    bits. Different target platforms can pack bytes into multiple-byte words in different
    languages, called endianness.


    > The endianness is drawn from Jonathan Swift''s 1726 satire, Gulliver''s Travels,
    in which a civil war erupted whether the big end or the little end of a boiled
    egg was proper to crack.


    A big-endian ordering places the most significant byte first and the least significant
    byte last, while little-endian ordering does the opposite. For example, consider
    the unsigned hexadecimal number 0x1234, which requires at least two bytes to represent.
    In a big-endian ordering, these bytes are 0x34, 0x12. Intel and AMD processors
    use the little-endian format, while the ARM and POWER processors can switch between
    the little-endian and big-endian formats. However, big-endian is the dominant
    ordering in network protocols such as Internet Protocol (IP), Transmission Control
    Protocol (TCP), and User Datagram Protocol (UDP). Endianness can cause problems
    when a binary file is created on one computer and is read on another computer
    with different endianness.


    C23 has a mechanism to determine your implementation''s byte order at runtime
    using three macros that expand to integer expressions. The __STDC_ENDIAN_LITTLE__
    macro represents a byte order'
