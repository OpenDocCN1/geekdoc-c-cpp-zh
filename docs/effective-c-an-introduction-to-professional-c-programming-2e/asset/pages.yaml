    # Dealing with Dangling Pointers


    If you call one of the free functions on the same pointer more than once,

    unefined behavior occurs. These defects can result in a security flaw

    known as a double-free vulnerability. One consequence is that they might be

    exploited to execute arbitrary code with the permissions of the vulner-

    able process. The full effects of double-free vulnerabilities are beyond the

    scope of this book, but I discuss them in detail Secure Coding in C and C++

    (Seacord 2013). Double-free vulnerabilities are especially common in error-

    handling code, as programmers attempt to free allocated resources.


    Another common error is to access memory that has already been

    freed. This type of error frequently goes undetected because the code

