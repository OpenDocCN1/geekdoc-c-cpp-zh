    # Attributes


    Starting with C23, you can use attributes to associate additional information
    with a declaration, statement, or type. This information can be used by the implementation
    to improve diagnostics, improve performance, or modify the behavior of the program
    in other ways. A comma-delimited list of zero or more attributes are specified
    within a pair of double brackets, for example: [[foo]] or [[foo, bar]].


    Declarations are specified in two ways. If the attribute specifier is the first
    of a declaration, the attributes are applied to all declarations in the declaration
    group. Otherwise, the attributes are applied to the declaration to the immediate
    left of the attribute specifier. For example, in the following declaration group,
    the foo attribute is applied to x, y, and z:


    ```

    [[foo]] int x, y, z;

    ```


    While in the second declaration group, the foo and bar attributes are applied
    only to:


    ```

    int a, b [[foo, bar]], *c;

    ```


    C23 defines several attributes that apply to declarations, such as nodiscard and
    deprecated. The nodiscard attribute is used to denote that the value returned
    by the function is expected to be used within an expression or initializer. The
    deprecated attribute is used with the declaration of a function or a type to denote
    that the function or type should be diagnosed as discouraged.


    In addition to standard attributes, the implementation may provide nonportable
    attributes. Such attributes are also specified within double square brackets,
    but they include a vendor prefix to distinguish attributes from different vendors.
    For example, the [[clang::overable]] attribute is used on a function declaration
    to specify that it use C++ style function overloading in C, and the [[gnu::packed]]
    attribute is used on a structure declaration to specify that the member declarations
    of the structure should avoid padding between member declarations whenever possible
