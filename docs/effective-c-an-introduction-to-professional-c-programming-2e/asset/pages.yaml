    # Microsoft


    Visual C++ provides all the string-handling functions defined by the C standard
    library up to C99 but does not implement the full POSIX specification. However,
    sometimes the Microsoft implementation of these APIs differs from the requirements
    of a given standard or has a function name that conflicts with another standard.
    In these circumstances, Microsoft will prefix the function name with an underscore.
    For instance, the POSIX function strdup is not available on Windows, but the function
    _strdup is available and behaves the same way.


    For information on Microsoft''s POSIX support, see https://docs.microsoft.com/en-us/cpp/c-runtime-library/compatibility.


    Visual C++ also supports many of the safe string-handling functions from Annex
    K and will diagnose the use of an unsafe variant unless you define `CRT_SECURE_NO_WARNINGS`
    prior to including the header file that declares them. Unfortunately, Visual C++
    does not conform to Annex K of the C standard, because Microsoft chose not to
    update its implementation based on changes to the APIs that occurred during the
    standardization process. For example, Visual C++ does not provide the set_constraint_handler_s
    but instead retains an older function with similar behavior but an incompatible
    signature:


    ```

    invalid_parameter_handler

    set_invalid_parameter_handler(invalid_parameter_handler)

    ```


    Microsoft does not define the abort_handler_s and ignore_handler_s, memset_s function
    (which is not defined by ISO/IEC TR 24731-1), or the RSIZE max macro. Visual C++
    does not treat overlapping source and destination sequences as runtime-constraint
    violations and instead has undefined behavior in such cases. “Bounds-Checking
    Interfaces: Field Experience and Future Directions” provides additional information
    on all aspects of the bounds-checked interfaces, including Microsoft’s implementation.


