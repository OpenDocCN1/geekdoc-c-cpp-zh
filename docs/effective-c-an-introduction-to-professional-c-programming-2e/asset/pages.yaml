  md: "Pointer arithmetic is automatically scaled to the size of the array element,\
    \ rather than individual bytes. C allows a pointer to be formed to each element\
    \ of an array, including one past the last element of the array object (also referred\
    \ to as the too-far pointer). While this might seem unusual or unnecessary, early\
    \ C programs incremented a pointer until was equal to the too-far pointer, and\
    \ the C standards committee didn't want to break all this code, which is also\
    \ idiomatic in C++ iterators. Figure 4-3 illustrates forming the too-far pointer.\n\
    \n![](img/39793bf6853a55aa3fd3b097e1ea631a_124_0.png)\n\nFigure 4-3: One the last\
    \ element of an array object\n\nIf both the pointer operand and the result point\
    \ to elements of the same array object or the too-far pointer did not overflow;\
    \ otherwise, the behavior is undefined. To satisfy the too-far requirement, an\
    \ implementation need only one extra byte (which can overlap another object in\
    \ the program) just after the end of the object.\n\nC also allows objects to be\
    \ treated as an array containing only a single element, allowing you to obtain\
    \ a too-far pointer from a scalar.\n\nThe too-far special case allows us to advance\
    \ a pointer until it is the too-far pointer, as in the following function:\n\n\
    ```\nint m[2] = {1, 2};\n\nint sum_m_elems(void) {\n    int *pi; int j = 0;\n\
    \    for (pi = &m[0]; pi < &m[2]; ++pi) j += *pi;\n    return j;\n}\n```\n\nHere,\
    \ for the statement (explained in detail in the next chapter) in the sum_m_elems\
    \ function loops while pi is less than the address of the too-far pointer for\
    \ the array m. The pointer pi is incremented at the end of each iteration of loop\
    \ until the too-far pointer is formed, causing the loop condition to evaluate\
    \ to 0 when.\n\nWhen we subtract one pointer from another, both must point to\
    \ elements of the same array object or the too-far element. This operation returns\
    \ the difference of the subscripts of the two elements. The type of the result\
    \ is ptrdiff_t (a signed integer type). You should take care when subtracting\
    \ pointers, because the range of ptrdiff_t may not be sufficient to represent\
    \ the difference of pointers to elements of very large character arrays."
