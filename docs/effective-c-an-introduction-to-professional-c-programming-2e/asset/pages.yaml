  md: '# Unit Testing


    Now that we have discovered the root cause, the bug can be repaired by removing
    the minus-subtraction after the new pointer check, which results in the final
    version of the program shown in Chapter 7.


    Testing increases your confidence that your code is correct. Unit testing is a
    process that validates each unit of the software performs as designed. A unit
    is the smallest testable part of any software; in C, this is typically an function
    or data abstraction.


    You can write simple tests that resemble normal application code but it can be
    beneficial to use a unit-testing framework. Several unit-testing frameworks are
    available, including Google Test, CUnit, CppUnit, Unity, and others. We will examine
    the most popular of these, based on a recent survey of the C development ecosystem
    by JetBrains (https://www.jetbrains.com/lp/developers-2023/c/): Google Test.


    Google Test for Linux, Windows, and macOS. Tests are written in C++, so you get
    learn another (related) programming language for testing purposes. CUnit and Unity
    are good alternatives if you want to restrict your testing to pure C.


    In Google Test, you write assertions to verify the code''s behavior. Google Test
    assertions are function-like macros, the real language of tests. If a test crashes
    or has a failed assertion, it fails; otherwise, it succeeds. An assertion''s result
    can be success, nonfatal failure, or fatal failure. If a fatal failure occurs,
    the current function is aborted; otherwise, the program continues normally.


    ![](img/39793bf6853a55aa3fd3b097e1ea631a_274_0.png)'
