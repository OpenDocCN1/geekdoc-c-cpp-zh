  md: '# INTRODUCTION


    C was developed as a system programming language in the 1970s, and even after
    all this time, it remains incredibly popular.

    System languages are designed for performance and ease of access to the underlying
    hardware while providing high-level programming features.

    While other languages may offer newer language features, their compilers and libraries
    are typically written in C.


    > Carl Sagan once said, "If you wish to make an apple pie from scratch, you must
    first invent the universe." The inventors of C did not invent the universe; they
    designed C to work with a variety of computing hardware and architectures that,
    in turn, were constrained by physics and mathematics. C is layered directly on
    top of computing hardware, making it more sensitive to evolving hardware features,
    such as vectorized instructions, than higher-level languages typically rely on
    C for their efficiency.


    ![](img/39793bf6853a55aa3fd3b097e1ea631a_24_0.png)'
