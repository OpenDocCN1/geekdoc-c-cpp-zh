  md: '# FOREWORD TO THE FIRST EDITION


    The first time I came across Robert Seacord''s name was in 2008. Robert was already
    well known in the C programming galaxy for his work on The CERT® C Coding Standard
    and Annex K of the C standard. But in 2008, it had been only a few years since—young
    and foolish—I had embarked on the Frama-C project point to guarantee the absence
    of undefined behavior in C programs. At some point, a CERT Vulnerability Note
    about C compilers (and GCC in particular) removed certain pointer-arithmetic overflow
    checks which piqued my interest. The compilers had reason to eliminate the checks;
    naively written, they invoked undefined behavior when the overflow was present.


    The compilers were also allowed to tell the programmer nothing what they did wrong,
    even at the maximum warning level. Undefined behavior in C can be harsh. I had
    set out to solve this exact problem. Robert was one of the authors of that note.


    Effective C will teach you C programming for the modern era. It will help you
    establish good habits to keep you from using undefined behavior, whether voluntarily
    or through negligence. Let the reader be warned: in large C programs, avoiding
    ordinary programming errors alone may not suffice for dodging undefined behavior
    caused by arbitrary inputs!'
