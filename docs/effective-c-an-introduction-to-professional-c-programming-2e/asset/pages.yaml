  md: '# Portability


    Every C compiler implementation is a little different. Compilers continually evolve—so,
    for example, a compiler like GCC might provide full support for C17 but be working
    toward support for C23, in which case it might have some C23 features but not
    others. Consequently, compilers support a full spectrum of C standard versions
    (including in-between versions). The overall evolution of C implementations is
    slow, with many compilers lagging behind the C standard.


    Programs written for C can be considered strictly conforming if they use only
    those features of the language and library specified in the standard. These programs
    are intended to be maximally portable. However, because of the range of implementation
    behaviors, real-world C program is strictly conforming, nor will it ever (and
    probably not). The C standard allows you to write conforming programs that may
    depend on nonportable language and library features.


    It''s common practice to write code for a single reference implementation, or
    sometimes several implementations, depending on the platforms to which you plan
    to deploy your code. The C standard ensures that these implementations do not
    differ too much, and it allows you to target several at without having to learn
    a new language each time.


    Five kinds of portability issues are enumerated in Annex J of the C standard:


    +   - Implementation-defined behavior


    +   - Unspecified behavior


    +   - Undefined behavior


    +   - Locale-specific behavior


    +   - Common extensions


    As you learn about the C language, you''ll encounter examples of all five kinds
    of behaviors, so it''s important to understand precisely what these are.


    # Implementation-Defined Behavior


    Implementation-defined behavior is program behavior that is not specified by the
    C standard and may produce different results between implementations but has consistent,
    documented behavior within an implementation. An example of implementation-defined
    behavior is the number of bits in a byte.


    Implementation-defined behaviors are mostly harmless but can cause defects when
    porting to different implementations. Whenever possible, avoiding code that depends
    on implementation-defined behaviors that vary among the C implementations you
    plan to compile your code with. A complete list of implementation-defined behaviors
    is enumerated in Annex J.3. You can document your dependencies on these implementation-defined
    behaviors by using a static_assert declaration, as discussed in Chapter 11.'
  merge: -1
