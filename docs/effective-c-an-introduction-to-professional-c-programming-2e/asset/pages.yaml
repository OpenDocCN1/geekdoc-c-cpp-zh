  md: '# File Inclusion


    A powerful feature of the preprocessor is the ability to insert the contents of
    one source file into the contents of another source file by using the #include
    preprocessing directive. The included files are called headers to年纪 them from
    other source files. Headers typically contain declarations for use by other programs.
    This is the most common way to share declarations of functions, objects, and data
    types with other parts of the program.

    You''ve seen many examples of including the headers for C standard libraries in
    the examples of this book. For instance, the program in Table 9-2 is separated
    into a header named bar.h and a source file foo.c. The source file foo.c does
    not directly contain a declaration of func, yet the function is referenced by
    name within main. During preprocessing, the #include directive inserts the contents
    of bar.h into foo.c


    Table 9-2: Header Inclusion


    | Original sources | Resulting translation unit |

    |---|---|

    | bar.h <br>int func(void); | int func(void); |

    | foo.c <br>#include "bar.h" | int main(void) {br>return func(); } |

    | int main(void) {br>return func(); } | |


    The preprocessor executes #include directives as it encounters them. Therefore,
    if a source file includes a header that also includes another header, the preprocessed
    output will contain the contents of both headers. For example, the baz.h and bar.h
    headers and the foo.c source file, the output after running the bazpreprocessor
    is shown in Table 9-3.


    Table 9-3: Transitive Header Inclusion


    | Original sources | Resulting translation unit |

