  md: '# Integer


    Signed integer types can be used to represent negative numbers, positive numbers,
    and zero. The standard signed integer types include signed char, short int, int,
    long int, and long int.


    For each integer type, there is a corresponding unsigned integer type that uses
    the same amount of storage: unsigned char, unsigned short, unsigned int, unsigned
    long int, and unsigned long int. The unsigned integer types can represent positive
    numbers along with bool make the standard unsigned integer types.


    Except for itself, the keyword int may be omitted in the declarations for these
    types, so you might, for example, declare a type by using long instead of long
    int.


    The signed and unsigned integer types are used to represent integers of various
    widths. Each platform determines the width for each of these types, given some
    constraints. Each type has a minimum representable range. The types are ordered
    by width, guaranteeing that wider types are at least large as narrower types.
    This means that an object of type long long int can represent, an object of type
    int can represent all values of an object of type int, and so forth. The implementation-defined
    minimum and maximum values for integer types are specified in the <limits.h> header
    file.


    Extended integer types may be provided in addition to the standard integer types.
    They are implementation-defined, meaning that their width, precision, and behavior
    are up to the compiler. Extended integer types are typically larger than the standard
    integer types (for example, __int128). _BitInt(32) is an unsigned 32-bit integer,
    and an unsigned _BitInt(32) integer. Bit-precise integer types do not require
    their width to be a power of two; the maximum width supported is specified by
    BITINT_MAXWIDTH (which must be at least as the width of unsigned long long).


    In addition to the standard and extended integer types, C23 adds bitprecise integer
    types. These types accept an operand specifying the width of the integer, so a
    _BitInt(32) is a signed 32-bit integer, and an unsigned _BitInt(32) is an unsigned
    32-bit integer. Bit-precise integer types do not require their width to be a power
    of two; the maximum width supported is specified by BITINT_MAXWIDTH (which must
    be at least as the width of unsigned long long).


    The int type is typically suggested by the architecture of the execution environment
    (for example, 16 bits on a 16-bit architecture and 32 bits on a 32-bit or 64-bit
    architecture). You can specify actual-width integers using type definitions from
    the <stdint.h> or <inttypes.h> header, like uint32_t. These headers provide type
    definitions for the greatest-width integer types: uintmax_t and intmax_t. The
    intmax_t type, for example, can represent any value of any signed integer with
    the possible exceptions of signed bit-precise integer types and signed extended
    integer types.


    Chapter 3 covers integer types in excruciating detail.'
