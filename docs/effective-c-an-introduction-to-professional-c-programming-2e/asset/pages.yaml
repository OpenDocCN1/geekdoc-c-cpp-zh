  md: '# About the Author


    Robert C. Seacard (rc@robertseacard.com) is the standardization lead at W by Toyota,
    where he works on the software craft. Robert was previously a technical director
    at NCC Group, the manager of the Secure Coding Initiative at Carnegie Mellon University''s
    Software Engineering Institute, and an adjunct professor in the School of Computer
    Science and the Information Networking Institute at Carnegie Mellon. Robert is
    the convener of ISO/IEC/JTC1/SC22/WG14, the international standardization working
    group for the C programming language. He is the author of other books, including
    The CERT® Coding Standard, 2nd edition (Addison-Wesley, 2014); Secure Coding in
    C and C++, 2nd edition (Addison-Wesley, 2013); and Java Coding Guidelines: 75
    Recommendations for Reliable and Secure Programs (Addison-Wesley, 2014). He has
    also published more than 50 papers on software security, component-based software
    engineering, web-based system design, legacy-system modernization, component repositories
    and search engines, and user interface design and development.


    # About the Contributor


    Aaron Ballman (aaron@ballman.com) is the lead maintainer for Clang, a popular
    open source compiler for C, C++, and other languages. Aaron is an expert for the
    JTC1/SC22/WG14 programming language and JTC1/SC22/WG21 C++ programming language
    standards committees. His primary focus has been in helping programmers recognize
    mistakes in their code through better language design, diagnostics, and tooling.
    When not thinking about programming, he enjoys quiet moments in the woods of rural
    Maine with his family.


    # About the Technical Reviewer to the First Edition


    Martin Sebor is a principal software engineer with the GNU Toolchain Team at Red
    Hat. His focus is the GCC compiler and the areas of detecting, diagnosing, and
    preventing security-related issues in C and C++ programs, as well as implementing
    optimizations of string-based algorithms. Prior to joining Red Hat in 2015, he
    worked as a compiler toolchain engineer at Cisco. Martin has been a member of
    the C++ standardization committee since 1999 and a member of the C language committee
    since 2010. He lives with his wife near the small town of Lyons, Colorado.'
  merge: -1
