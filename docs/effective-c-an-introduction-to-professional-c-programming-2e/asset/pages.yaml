    \ must be integers, and the usual arithmetic conversions are performed on both.\n\
    \n# Logical Operators\n\nThe logical AND (&&) and OR (||) operators are used primarily\
    \ for logically joining two or more expressions of scalar type. They're commonly\
    \ used in condition tests to combine multiple comparisons, such as in the first\
    \ operand of the conditional operator, the controlling expression of an if statement,\
    \ or the controlling expression of a for loop. You shouldn't use logical operators\
    \ with bitmap operands, as they are intended for Boolean logic.\n\nThe && operator\
    \ returns 1 if neither of its operands is equal to 0 and returns 0 otherwise.\
    \ Logically, this means that a &&& b is true only if a is true and b is true.\n\
    \nThe || operator returns 1 if either of its operands is not equal to 0 and returns\
    \ 0 otherwise. Logically, this means that a || b is true if a is true, or both\
    \ a and b are true.\n\nThe C standard defines both operations in terms of \"not\
    \ equal to zero\" because the operands can have values other than 0 and 1. Both\
    \ operators accept scalar type (integers, floats, and pointers), and the result\
    \ of the operation has type int.\n\nUnlike the binary operators, the logical AND\
    \ and OR operator guarantee left-to-right evaluation. The operands perform short-circuit:\
    \ The second operand is not evaluated if the result can be deduced solely by evaluating\
    \ the first operand. If the second operand is evaluated, there is a sequence point\
    \ between the evaluations of the first and second operands. For example, the expression\
    \ 0 && unevaluated returns regardless of the value of unevaluated because there\
    \ is no possible value for unevaluated that produces a different result. Because\
    \ of this, unevaluated is not evaluated to determine its value. The same is true\
    \ for 1 || unevaluated because this expression always returns 1.\n\nShort-circuiting\
    \ is commonly used in operations with pointers:\n\n```\nbool isn(int* ptr, int\
    \ n) {\n    return ptr && *ptr == n; // avoid a null pointer dereference\n}\n\
    ```"
