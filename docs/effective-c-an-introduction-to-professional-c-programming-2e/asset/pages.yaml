    # Floating-Point Arithmetic


    Floating-point arithmetic is similar to, and used to, the arithmetic of real numbers.
    However, there are differences to consider. Unlike in real number arithmetic,
    floating-point numbers are bounded in magnitude and have finite precision. Addition
    and multiplication operations are not associative; the distributive property doesn''t
    hold, nor do many other properties of real numbers.


    Floating types represent real numbers exactly, even when they can be represented
    in a small number of decimal digits. For example, common decimal constants as
    0.1 can''t be represented exactly as binary floating-point numbers. Floating types
    may lack the necessary precision for various applications such as loop counters
    or performing financial calculations. CERT C rule FLP30-C (do not use floating-point
    variables as loop counters) for more information.


    # Floating-Point Values


    A floating-point representation whose significand is 0 (all $f_i=0$) represents
    a floating-point zero. Zeros are signed according to the sign ($\sigma$), and
    there are two floating-point zero values: +0 and -0. They are equal but behave
    differently in few operations. An example is 1/0.0 yields positive infinity and
    1/(-0.0) yields negative infinity.


    There are no leading zeros in the significand of a normalized floating-point number
    ($f_i=1$); leading zeros are removed by adjusting the exponent. Therefore float
    has 24 bits of precision, double has 53 bits of precision, and long has 113 bits
    of precision (assuming the IEC 60559 binary-128 format).


    Subnormal numbers are positive and negative numbers of very small magnitude whose
    normalized representation would result in an exponent that is less than the smallest
    exponent for the type. Their representations have exponent $e=e_{min}$ and leading
    bit $f_i=0$. Figure 3-3 is a number line showing the range of subnormal values
    0. The precision of subnormal numbers is less than of normalized numbers.'
