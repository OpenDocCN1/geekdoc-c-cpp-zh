    the code. Always try to understand the reason for the warning and rewrite the
    code to eliminate the error, rather than simply quieting warnings by adding type
    casts or arbitrary changes until the warning goes away. See the CERT rule MSC00-C,"Compile
    cleanly at high warning levels," for more information on this topic.


    Once you''ve added compilers in your code, you can use a static analyzer to diagnose
    more complex defects by evaluating the expressions in your program, performing
    in-depth control and data flow analysis, and reasoning about the possible ranges
    of values and control flow paths.


    Having a tool to identify specific errors in your program is much, much easier
    than hours of testing and debugging, and it''s much less costly than deploying
    defective code. A wide variety of free and commercial static analysis tools are
    available. For example, C++ has incorporated a static analyzer that you can invoke
    with the /analyze flag. C++ allows you to specify which ruleset (such as recommended,
    security, or internationalization) you would like to run or whether to run them
    all. For more information on C++''s static analysis, see Microsoft''s website
    at https://learn.microsoft.com/en-us/visualstudio/code-quality. Similarly, Clang
    has incorporated a static analyzer that can be run as a stand-alone tool or within
    Xcode (https://clang-analyzer.llvm.org). With version 10, GCC has introduced static
    analysis enabled through the -fanalyzer option. Commercial tools also exist, such
    as CodeQL from GitHub, TrustInfo Analyzer, SonarQube from SonSource, Coverity
    from Synopsis, LDRA Testbed, Helix QAC from Perforce, and others.


    Many static analysis tools have non-overlapping capabilities, so it may sense
    to use more than one.


    # Dynamic Analysis


    Dynamic analysis is the process of evaluating a system or component during execution.
    It is also referred to as runtime analysis, among other similar names.

    A common approach to dynamic analysis is to instrument the code—for example, by
    enabling compile-time flags that inject instrumentation into the executable—and
    then run the instrumented executable. The debug allocation library dmalloc described
    in Chapter 6 takes a similar approach. The dmalloc library provides replacement
    memory management routines with configurable debugging facilities. You can control
    the behavior of these routines by using a command line utility (also called dmalloc)
    to detect memory leaks and discover report defects by writing outside the bounds
    of an object and using a pointer after its freed.


    The advantage of dynamic analysis is that it has a low false-positive rate, so
    one of these tools flags a problem, fix it!


