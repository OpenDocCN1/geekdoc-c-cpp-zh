  md: '# Text and Binary Streams


    The standard supports both text streams and binary streams. A text stream is an
    ordered sequence of characters composed into lines, each of which consists of
    zero or more characters plus a terminating character sequence. You can denote
    a line break on a Unix-like system by using a line feed (\n). Most Windows programs
    use a carriage return (\r) followed by a line feed (\n).


    The different newline conventions can cause text files that have been transferred
    between systems with different conventions to display or parse incorrectly, though
    this is increasingly uncommon on recent systems that now understand foreign newline
    conventions.


    A binary stream is an ordered sequence of arbitrary binary data. Data read in
    a binary stream will be the same as data written earlier to that same stream,
    under the same implementation. On non-POSIX systems, streams may have an implementation-defined
    number of null bytes appended to the end of the stream.


    Binary streams are always more capable and more predictable than text streams.
    However, the easiest to read or write an ordinary text file is work with other
    text-oriented programs through a text stream.


    # Opening and Creating Files


    When you open or create a file, it''s associated with a stream. The open and the
    POSIX functions open or create a file.


    # fopen


    The fopen function opens the file name given as a string and pointed to by filename
    and then associates a stream with it:


    ```

    FILE *fopen(

    const char * restrict filename,

    const char * restrict mode

    );

    ```


    The mode argument points to one of the strings shown in Table 8-1 to determine
    how to open the file.


    | Mode string | Description |

    |---|-|

    | r | Open existing text file for reading |

    | w | Truncate to zero length or create text file for writing |

    | a | Append, open, or create text file for writing at end-of-file |

    | rb | Open existing binary file for reading |

    | wb | Truncate to zero length or create binary file for writing |'
