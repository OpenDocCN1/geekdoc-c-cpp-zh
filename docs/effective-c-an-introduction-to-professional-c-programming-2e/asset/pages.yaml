    it does not require all implementations to use the same representation schemes
    or formats, and it allows implementations to provide values that are not in the
    C model. To keep things simple, we''ll assume conformance to Annex F includes
    the most common floating-point formats specified in IEC 60559. You can test the
    value of _STDC_IEC_60559_macro, or of the _STDC_IEC_60559_BFP macro in never compilers,
    to determine whether the implementation conforms to Annex F.


    This section explains floating types, arithmetic, values, and constants, so you
    will know how and when to use them to emulate math on real numbers and to avoid
    them.


    # Floating Types and Encodings


    C has three standard floating types: float, double, and long double.


    The float type can be used for floating-point data and results that can be adequately
    represented with the precision and exponent range of the type. Using float arithmetic
    to compute float results from float data is particularly vulnerable to roundoff
    error. The common IEC 60559 float type encodes values using 1 sign bit, 8 exponent
    bits, and 23 significant bits. The value has a 24-bit significand, which is encoded
    in 23 bits (with help from the exponent field to determine the implicit leading
    bit).


    The double type provides greater precision and exponent range and requires additional
    storage. Arithmetic with the double type greatly increases the reliability of
    computation of float results from float data. The IEC 60559 double type encodes
    values using 1 sign bit, 11 exponent bits, and 52 significant bits. The value
    has a 53-bit significand, which is encoded in 52 bits (with help from the exponent
    field to determine the implicit leading bit).


