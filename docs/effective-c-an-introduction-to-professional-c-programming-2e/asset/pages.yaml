    # Formatted Output


    The puts function is a simple way to write a string to stdout, but to print arguments
    other than strings, you need the printf. The printf function takes a format string
    that defines how the output is formatted, by a variable number of arguments that
    are the actual values you want to print. For example, if you want to use the printf
    function to print Hello, world!, you could write like this:


    ```

    printf("%s\n", "Hello, world!");

    ```


    The first argument is the format string "%s\n". The %s is a conversion specification
    that instructs the printf function to read the second argument (a string literal)
    and print it to stdout. The \n is an alphabetic escape sequence used to represent
    nongraphic characters and tells the function to include a new line after the string.
    Without the newline sequence, the next characters (likely the command prompt)
    would appear on the same line. This function calls the following:


    Hello, world!


