  md: '# typeof Operators


    C23 adds support for typeof and typeof_unqual operators. These are like decltype
    in C++ and are used to specify a type based on another type or the type of an
    expression. The typeof operator retains qualifiers, while the typeof_unqual strips
    qualifiers, including _Atomic.


    # K&R C Functions


    K&R C allowed functions to be declared without prototypes:


    ```

    int f();

    int f(a, b) int a, b; { return 0; }

    ```


    K&R functions were deprecated 35 years ago and are finally being removed from
    the standard. An empty parameter list used to mean "takes any number of arguments"
    and now "takes zero arguments," the same as C++. It is possible to emulate "accepts
    zero or more args" a variadic function signature: f(...); which is not possible
    because va_start no longer requires the parameter to the ... to the call.


    # Preprocessor


    New features have been added to C23 to improve preprocessing. #elifdef direct
    directives #ifdef and also has an #endif form. The #warning direct directives
    #error but does not halt translation. The _has_include operator tests for the
    existence of a header file, and the _has_c_attribute operator tests for the existence
    of a standard or vendor attribute.

    The _embedded embeds data directly into the source code via the preprocessor:


    ```

    unsigned char buffer[] = {

    #embed "/dev/urandom" limit(32) // embeds 32 chars from /dev/urandom

    };

    struct FileObject {

    unsigned int MagicNumber;

    unsigned _BitInt(8) RGBA[4];

    struct Point {

    unsigned int x, y;

    } UpperLeft, LowerRight;

    } Obj = {

    #if _has_embed(SomeFile.bin) == __STDC_EMBED_FOUND__

    n embeds embeds contents of file as struct

    // initialization elements

    #embed "SomeFile.bin"

    #endif

    };

    ```'
