    # Integers


    As mentioned in Chapter 2, each integer type represents a finite range of integers.
    Signed integer types represent values that can be negative, zero, or positive;
    unsigned integers represent values that can be only zero or positive. The range
    of values that each integer type can represent depends on your implementation.


    The value of an integer object is the ordinary mathematical value stored in the
    object. The representation of a value for an integer object is the particular
    encoding of the value in the bits of the object''s allocated storage. We look
    at the representation in more detail later.


    # Padding, Width, and Precision


    All integer types except char, signed char, and unsigned char may contain unused
    bits, called padding, that allow implementations to accommodate hardware quirks
    (as skipping over a sign bit in the middle of a multiple-word representation)
    or to optimally align with a target architecture. The number of bits used to represent
    a value of a given type, excluding padding but including the sign, is called the
    width and often denoted by N. The precision is the number of bits used to represent
    values, excluding sign and padding bits.


    # Integer Ranges


    A representable value is a value that can be represented in the number of bits
    available to an object of a particular type. Values that cannot be represented
    will be diagnosed by the compiler or converted to a representable but different
    (incorrect) value. The <limits.h> header defines object-like macros that expand
    various limits and parameters of the integer types. To write portable code, you
    should use these macros rather than integer literals such as +2147483647 (the
    maximum value representable as a 32-bit integer) that represent a specific limit
    and may change when porting to a different implementation.


    The C standard imposes only three constraints on integer sizes: storage for every
    data type occupies an integral number of adjacent char objects (which may include
    padding). Second, each integer type must support a minimum range of values, allowing
    you to depend on a portable range of values across any implementation. Third,
    smaller types cannot be wider than larger types. So, for example, short cannot
    be wider than int, but both types may have the same width.'
