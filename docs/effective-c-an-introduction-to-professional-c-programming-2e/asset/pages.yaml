    and wcrtomb (wide-character restartable to multibyte) functions convert one code
    unit at a time, writing the result to an output object or buffer. The mbstcs (multibyte
    to wide-character string), wcsbs (wide-character string to multibyte string),
    mbrstcs (multibyte restartable to multibyte string), and wccsrt (wide-character
    restartable to wide-character string) functions convert a sequence of code units,
    writing the result to an output buffer.


    Conversion functions need to store data to properly process a sequence of conversions
    between function calls. The nonstandard forms store the state internally and are
    consequently unsuitable for multithreaded process. The restartable versions have
    an additional parameter that''s a pointer to an object of type state_t that describes
    the current conversion state of the associated multibyte character sequence. This
    holds the state that makes it possible to restart the conversion where it left
