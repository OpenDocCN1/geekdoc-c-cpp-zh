    # Compound Statements


    A compound statement, or block, is a list of zero or more statements, surrounded
    by braces. The statements in the block may be any kind of statement described
    throughout this chapter. Some of these statements may be declarations. (In early
    versions of C, declarations within the block had to precede any undeclaration,
    but that restriction no longer applies.) Each statement in the block is executed
    in sequence unless modified by a control statement. After the final statement
    has been evaluated, execution proceeds to after the closing brace:


    ```

    static int count = 0;

    c +=;

    ++count;

    ```


    This example declares a static variable of type called count. The second line
    increases a variable c declared in an outer scope by the value stored in a. Finally,
    count is incremented to track how many times this block has been executed.'
