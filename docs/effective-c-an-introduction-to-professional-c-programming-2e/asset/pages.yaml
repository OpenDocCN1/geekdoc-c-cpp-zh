    Listing 5-9: Filling a character array by using a for loop


    The for loop is popular among C programmers because it provides a convenient location
    for declaring and/or initializing the loop counter, specifying the controlling
    expression for the loop, and incrementing the loop counter, all on the line. The
    *(ptr + i) value expression could be written equivalently using the index operator
    as ptr[i].


    The for loop can also be somewhat misleading. Let''s take the example of a singly
    linked list in C that declares a node structure consisting of a data node and
    a pointer to the next node in the list. We also define a pointer p to the next
    node structure:


    ```

    struct node {

    int data;

    struct node *next;

    };

    struct node *p;

    ```


    Using the definition of p, the following example (used to deallocate the storage
    for a linked list) erroneously reads the value p after it has been freed:


    ```

    for (p = head; p != nullptr; p = p->next) {

    free(p);

    }

    ```


    Reading p after it has been freed is undefined behavior. If this loop were rewritten
    as a while loop, it would become apparent that the code reads p after it was freed:


    ```

    p = head;

    while (p != nullptr) {

    free(p);

    p = p->next;

    }

    ```


    The for loop can be confusing because it evaluates expression3 after the main
    body of the loop, even though lexically it appears before the loop''s body. The
    correct way to perform this operation is to save the required pointer before freeing
    it, like this:


    ```

    for (p = head; p != nullptr; p = q) {

    q = p->next;

    free(p);

    }

    ```


    You can read more about dynamic memory management in Chapter 6.'
