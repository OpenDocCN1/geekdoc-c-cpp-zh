    \ = 1.2;\nint sum = (int)x + 1; // explicit conversion from double to int\n```\n\
    \nUnless the type name specifies a void type, the type name must be a qualified\
    \ or unqualified scale type. The operand must also be scalar type; a pointer type\
    \ cannot be converted to any floating-point type, and vice versa. Casts are extremely\
    \ powerful and must be used carefully. For one thing, casts may reinterpret the\
    \ existing bits as a value of the specified type without changing the bits:\n\n\
    ```\nintptr_t i = (intptr_t)a_pointer; // reinterpret bits as an integer\n```"
