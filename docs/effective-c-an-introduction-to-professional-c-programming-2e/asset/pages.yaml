    | --- | --- |

    | ab | Append, open, or create binary file for writing at end-of-file |

    | r+ | Open existing text file for reading and writing |

    | w+ | Truncate to zero length or create text file for reading and writing |

    | a+ | Append, open, or create text file for update, at current end-of-file |

    | r+b or rb+ | Open existing binary file for reading and writing |

    | wb or wb+ | Truncate to zero length or create binary file for reading and writing
    |

    | a+b or ab+ | Append, open, or create binary file for update, at current end-of-file
    |


    Opening a file with read mode (by passing r as the first character in the mode
    argument) fails if the file does not exist or cannot be read.

    Opening a file with append mode (by passing a as the first character in the mode
    argument) causes all subsequent writes to the file to occur at the current-end-file
    at the point of buffer flush or actual, regardless of intervening calls to fseek,
    fetpos, or rewind functions. Incrementing the current-end-file by the amount of
    data written is atomic with respect to other threads writing to the same file
    provided the file was also opened in append mode. If the implementation is incapable
    of incrementing the current-end-file atomically, it will fail instead of performing
    nonatomic. In some implementations, opening a binary file with append mode (by
    passing b as the second or third character in the mode argument) may initially
    set the file position indicator for the stream beyond the last data written because
    of null character padding.

    You can open a file in update mode + as the second or third character in the mode
    argument, allowing both read and write operations to be performed on the associated
    stream. Opening (or creating) a text file with update mode may instead open (or
    create) a binary stream in some implementations. On POSIX systems, text and binary
    streams have the exact same behavior.

    The11 standard added the exclusive mode for reading and writing binary and text
    files, as shown in Table 8-2.


    # Table 8-2: Valid Mode Strings Added by C11


    | --- | --- |

    | wx | Create exclusive text file for writing |

    | wbx | Create exclusive binary file for writing |

    | w+x | Create exclusive text file for reading and writing |

    | w+bx or wb+x | Create exclusive binary file for reading and writing |


    Opening a file with exclusive mode (by passing x as the last character in the
    mode argument) fails if the file already exists or cannot be created.'
