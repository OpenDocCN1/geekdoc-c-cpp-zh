  md: "# Bitwise Exclusive OR\n\nThe bitwise exclusive OR operator^) returns the bitwise\
    \ exclusive OR of the operands of integer type. The operands must be integers,\
    \ and the usual arithmetic conversions are performed on both. Each bit in the\
    \ result is set if and only if one of the corresponding bits in the converted\
    \ operands is set, as shown in Table 4-4. You can also think of this operation\
    \ as “one or the other, not both.”\n\n| x | y | x ^ y |\n|---|---|---|n| 0 | 0\
    \ | 0 |\n| 0 | 1 | 1 |\n| 1 | 0 | 0 |\n| 1 | 1 | 0 |\n\nTable 4-4: Bitwise Exclusive\
    \ OR Truth Table\n\nExclusive OR is equivalent to the addition operation on the\
    \ integers modulo 2—that, because of wraparound 1+1 mod 2=0 (Lewin 2012).\nBeginners\
    \ commonly mistake the exclusive OR operator for exponent operator, erroneously\
    \ believing that the expression 2 ^ 7 will compute 2 raised to the power of 7.\
    \ The correct way to raise a number to a certain power in C is to use the pow\
    \ functions defined in <math.h>, as shown in Listing 4-6. The pow functions operate\
    \ on floating-point numbers, so be aware that these functions might fail to produce\
    \ the expected results because of truncation or other errors.\n\n```\n#include\
    \ <math.h>\n#include <stdio.h>\n\nint main(void) {\n  int i = 128;\n  if (i ==\
    \ pow(2, 7)) {\n    puts(\"equal\");\n  }\n}\n```\n\nListing 4-6: Using the pow\
    \ functions\n\nThis code calls the pow function to compute 2 raised to the power\
    \ of 7. Because 2^7 equals 128, this program will print equal.\n\n# Bitwise Inclusive\
    \ OR\n\nThe bitwise inclusive OR (|) operator returns the bitwise inclusive OR\
    \ of two operands. Each bit in the result is set if and only if at least one of\
    \ the corresponding bits in the converted operands is set, as shown in Table 4-5."
