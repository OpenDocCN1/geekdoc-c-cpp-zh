    # # PREPROCESSOR

    with Aaron Ballman


    ![](img/39793bf6853a55aa3fd3b097e1ea631a_224_0.png)


    The preprocessor is the part of the C compiler that runs at an early phase of
    compilation and transforms the source code before it''s translated, such as inserting
    code from one file (typically a header) into another (typically a file). The preprocessor
    also allows you to specify that an identifier should be automatically substituted
    by a source code segment during macro expansion. In this chapter, you''ll learn
    how to use the preprocessor to include files, define object- and function-like
    macros, conditionally include code based on implementation-specific features,
    and embed binary resources into your program.'
