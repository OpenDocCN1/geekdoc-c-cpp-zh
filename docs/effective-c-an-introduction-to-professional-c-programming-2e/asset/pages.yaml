  md: '# FOREWORD TO THE SECOND EDITION


    When I started in cybersecurity over 27 years ago, I learned my trade primarily
    by finding and exploiting unsafe memory handling in C programs—a class of vulnerability
    that, even at the time, was over 20 years old. In my career at BlackBerry, I waded
    through torrents of code review, I saw firsthand how dangerous C could be to the
    improperly initiated. Now, as a chief technology officer for the UK''s National
    Cyber Security Centre, I see the consequences of poorly written C code on our
    connected society every day at a national level.


    Today we still face numerous challenges in writing secure and professional C.
    The many innovations in compiler- and operating system-level mitigations can be
