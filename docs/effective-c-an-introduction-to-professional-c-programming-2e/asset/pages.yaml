    # Standard I/O Streams


    C provides streams to communicate with files stored on supported, structured storage
    devices and terminals. A stream is a uniform abstraction for communicating with
    files and devices that consume or produce sequential data such as sockets, keyboards,
    Universal Serial Bus (USB) ports, and printers.


    C uses the opaque FILE data type to represent streams. A FILE holds the internal
    state information for the connection to the file, including the file position
    indicator, buffering, an error indicator, and an end-of-file indicator. You should
    never allocate a FILE yourself. C standard library functions operate on types
    of FILE * (which is a pointer to the FILE type). As result, streams are referred
    to as file pointers.


    C provides an extensive programming interface (API) in <stdio.h>, for operating
    on streams; we will explore this API later in this chapter. However, because these
    I/O functions need to work with a wide variety of devices and filesystems across
    many platforms, they are highly abstracted, which makes them unsuitable for anything
    beyond the simplest applications.


    For example, the C standard has no concept of directories; it must be able to
    work with nonhierarchical filesystems. The C standard makes many references to
    filesystem-specific details, like file permissions or locking. However, function
    specifications frequently state that certain behaviors happen "to the extent that
    the underlying system supports it," meaning that they will occur only if they''re
    supported by your implementation.


    As a result, you will generally need to use the portable APIs provided for POSIX,
    Windows, and other platforms to perform I/O in real-world applications. Frequently,
    applications will define their own APIs that, in turn, rely on platform-specific
    APIs to provide safe, secure, and portable I/O operations.


    # Error and End-of-File Indicators


    As mentioned, a FILE object holds the state indicator for the connection to the
    associated file, including an error indicator that records whether a read/write
    error has occurred and an end-of-file indicator that records whether the end of
    the file has been reached. When opened, the error and end-of-file indicators for
    the stream are cleared. The following C standard library functions set the error
    indicator for the stream when an error occurs: the byte input functions (get,
    fgetc, and fgetc), byte output functions (putc, fputc, and putchar), fflush, fseek,
    and fsetpos. Input'
