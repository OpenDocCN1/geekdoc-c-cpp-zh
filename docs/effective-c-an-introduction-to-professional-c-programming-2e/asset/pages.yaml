  md: '# GNU Compiler Collection


    The GNU Compiler Collection (GCC) includes frontends for C, C++, and Objective-C,
    as well as other languages (https://gcc.gnu.org). GCC follows a well-defined development
    plan under the guidance of the GCC steering committee.


    GCC has been adopted as the standard compiler for Linux systems, although versions
    are also available for Microsoft Windows, macOS, and other platforms. Installing
    GCC on Linux is easy. The following command, for example, should install GCC on
    Ubuntu:


    ```

    $ sudo apt-get install gcc

    ```


    You can test the version of GCC you''re using with the following command:


    ```

    $ gcc --version

    ```


    The output will display the version and copyright information for the installed
    GCC version.


    # Clang


    Another popular compiler is Clang (https://clang.llvm.org). Installing Clang on
    Linux is also easy. You can use the following command to install Clang on Ubuntu:


    ```

    $ sudo apt-get install clang

    ```


    You can test the version of Clang you''re using with the following command:


    ```

    $ clang --version

    ```


    This displays the installed Clang version.


    # Microsoft Visual Studio


    As previously mentioned, the most popular development environment for Windows
    is Microsoft Visual Studio, which includes the IDE and the compiler. Visual Studio
    (https://visualstudio.microsoft.com/downloads/) is-bundled with C++ 2022, which
    includes both the C and C++ compilers.


    You can set options for Visual Studio on the Project Properties page. On the Advanced
    tab C/C++, make sure you compile C code by using the Compile as C Code (/TC) option
    and not the Compile as C Code (/TP) option. By default, when you name a file with
    a .c extension, it''s compiled with /TC. If the file is named with .cpp, .cxx,
    or a few other extensions, it''s compiled with /TP.'
