    # extern


    The extern specifier specifies static storage duration and external linkage. It
    can be used with function and object declarations in both file and block scope
    (but not function parameter lists). If extern is specified for the redeclaration
    of an identifier that has already been declared with internal linkage, the linkage
    remains internal. Otherwise (if the prior declaration was external, no linkage,
    or is not in scope), the linkage is external.


    # thread_local


    An object whose identifier is declared with the thread_local storage-class specifier
    has thread storage duration. Its initializer is evaluated before program execution,
    its lifetime is the entire execution of the thread for which it is created, and
    its stored value is initialized with the previously determined value when the
    thread is started. There is a distinct object per thread, and use of the declared
    name in an expression refers to the object associated with the thread evaluating
    the expression. (The topic of threading is beyond the scope of this book.)


    # constexpr


    A scalar declared with the constexpr is a constant and its value permanently fixed
    at translation time. The constexpr storage-class specifier may appear with auto,
    register, or static. If not already present, a const qualification is implicitly
    added to the object''s type. The resulting object cannot be modified at runtime
    in any way. The compiler can use this value in any other constant expression.


    Additionally, the constant expression used for the initializer of such a constant
    is checked at compile time. Before the introduction of C23, a large object constant
    might be declared as follows:


    ```

    static size_t BFO = 0x1000000000;

    ```


    The initializer or may not fit into size_t; a diagnostic is not required. In C23,
    this same object can be declared using constexpr as follows:


    ```

    constexpr size_t BFO = 0x1000000000;

    ```'
