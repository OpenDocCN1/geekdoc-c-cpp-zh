    for each language—C has been either the most popular programming language or second
    most popular since 2001. The popularity of the C programming language can most
    likely be attributed to several tenets of the language referred to as the *spirit
    of C*


    +   - Trust the programmer. The C language assumes you know what you''re doing
    and lets. This isn''t always a good thing (for example, if you don''t know what
    you''re doing).

    - Don''t prevent the programmer from doing what needs to be done. Because C is
    a system programming language, it needs to handle a variety of low-level tasks.

    - Keep the language small and simple. The language is designed to be close to
    the hardware and to have a small footprint.

    - Provide only one way to do an operation. Also as conservation of mechanism,
    the C language tries to limit the introduction of duplicate mechanisms.

    - Make it fast, even if it isn''t guaranteed to be portable. Allowing you to write
    optimally efficient code is the top priority. The responsibility of ensuring that
    code is portable, safe, and secure is delegated to you, the programmer.


    C is used as a target language for compilers to build operating systems, to teach
    fundamentals of computing, and for embedded and general-purpose programming.

    There is a large amount of legacy code written in C. The C standards committee
    is extremely careful not to break existing code, providing a smooth path for modernizing
    this code to take advantage of modern language.

    C is often used in embedded systems because it is a small and efficient language.
    Embedded systems are small computers that are embedded in other devices, such
    as cars, appliances, and medical devices.

    Your favorite programming language and library are written in C (or were at one
    time). There are many libraries available for C. This makes it easy to find libraries
    that can be used to perform common tasks.

    Overall, C is a powerful and versatile language that is still widely used today.
    It is a good choice for programmers who need a fast, efficient, and portable language.


    # A Brief History of C


    The C programming language was developed in the early 1970s at Bell Labs as a
    system implementation language for the nascent Unix operating system and remains
    incredibly popular today (Ritchie 1993). System languages are designed for performance
    and ease of access to the underlying hardware while providing high-level programming
    features. While other languages'
