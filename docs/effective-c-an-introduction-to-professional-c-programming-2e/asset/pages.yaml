    #  Compiler Settings and Flags


    Compilers typically dont enable optimization or security hardening by default.
    Instead, you can enable optimization, error detection, and security hardening
    using build flags (Weimer 2018). I recommend specific flags for GCC, Clang, and
    Visual C++ in the next section, after first describing how and why you might want
    to use them.


    Select your build flags based on what you''re trying to accomplish. Distinct phases
    of software development call for different compiler and linker configurations.
    Some flags, such as the warnings, will be common to all phases. Other flags, such
    as the debug or the optimization level, are specific to each phase.


    The goal of the build phase is to take full advantage of compiler analysis to
    eliminate defects before debugging. Dealing with numerous diagnostics at this
    stage can be bothersome but is better than finding these problems through debugging
    and testing, or not finding them until after the code has shipped. During the
    build phase, you should use compiler options that maximize diagnostics to help
    you eliminate as many defects as possible.


    **Debug** During debugging, you''re typically trying to determine why your code
    isn''t working. To accomplish this, use a set of compiler flags that includes
    debug information, allows assertions to be useful, and enables a quick turnaround
    for the inevitable edit-compile-debug cycle.


    **Test** You may want to retain debug information and leave assertions enabled
    during testing to identify the root cause of any problems that are discovered.
    Runtime instrumentation can be injected to help detect errors.


    **Profile-Guided Optimization** This configuration defines compiler and linker
    flags that control how the compiler adds runtime instrumentation to the code it
    normally generates. One purpose of instrumentation is to collect profiling statistics,
    which can be used to find program hotspots for profile-guided optimizations.


    **Release** The final phase is to build the code for deployment to its operational
    environment. Before deploying the system, make sure you thoroughly test your release
    configuration, because using a different set'
