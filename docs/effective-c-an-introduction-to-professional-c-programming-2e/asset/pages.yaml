    # Setting the Pointer to Null


    To limit the opportunity for defects involving dangling pointers, set the pointer
    to nullptr after completing a call to free:


    ```

    char *ptr = malloc(16);

    // --snip--

    free(ptr);

    ptr = nullptr;

    ```


    Any further attempt to dereference the pointer will usually result in a crash,
    increasing the likelihood that the error is detected during implementation and
    testing. If the pointer is set to nullptr, the memory can be freed multiple times
    without consequence. Unfortunately, the free function cannot set the pointer to
    nullptr itself because it''s passed a copy of the pointer and not the actual pointer.


