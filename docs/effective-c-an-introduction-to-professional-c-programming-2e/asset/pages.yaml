    \ {\n  // --snip--\n}\n```\n\nThis code may be correct, but it's likely a programmer\
    \ error.\n\n# Cast Operators\n\nCasts (also known as type casts) explicitly convert\
    \ a value of one type to another type. To perform a cast, we precede an expression\
    \ with a parenthesized type name, which converts the value of the expression to\
    \ the unqualified version of the named type. The following code illustrates an\
