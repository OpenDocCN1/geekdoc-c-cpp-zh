  md: '# Operator Precedence and Associativity


    In mathematics and computer programming, the order of operations (operator precedence)
    is a collection of rules that dictates the order in which operations are performed
    during the evaluation of an expression. For example, multiplication is granted
    a higher precedence than addition. Therefore, the expression 2 + 3 * 4 is interpreted
    as the value 2 + (3 × 4) = 14, not (2 + 3) * 4 = 20.


    Associativity determines how operators of the same precedence are grouped when
    no parentheses are present. C associativity differs from mathematics associativity.
    For example, while floating-point addition and multiplication are commutative
    (a + b = b + a and a × b = b × a), they are not necessarily associative. If adjacent
    operators have equal precedence, the choice of which operator to apply first is
    determined by the associativity. Left-associative operators cause the operations
    to be grouped from the left, while right-associative operators cause the operations
    to be grouped from the right. For example, the addition (+) operator has left
    associativity, and the assignment operator (=) is right-associative, so the assignment
    as a = b = c is interpreted as a = (b = c).


    | Precedence | Operator | Description | Associativity |

    |---|---|---|---|n| 0 | (..) | Forced grouping | Left |

    | 1 | ++ | Postfix increment and decrement | Left |

    | () | Function call | |

