  md: '# APPENDIX


    # THE FIFTH EDITION OF

    THE C STANDARD (C23)

    with Aaron Ballman


    ![](img/39793bf6853a55aa3fd3b097e1ea631a_288_0.png)


    The latest (fifth) edition of the C standard

    (ISO/IEC 9899:2024) is nicknamed C23.

    C23 maintains the spirit of C, adding

    new features and functions to improve the

    safety, security, and capabilities of the language.


    # Attributes


    The [[attributes]] syntax was added to C23 to specify additional information for
    various source constructs such as types, objects, identifiers, or

    blocks (Ballman 2019). Prior to C23, similar features were provided in an

    implementation-defined (nonportable) manner:


    ```

    declspec(deprecated)

    __attribute__((warn_unused_result))

    int func(const char *str)__attribute__((nonnull(1)));

    ```'
