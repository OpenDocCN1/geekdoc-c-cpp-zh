    # Static Analysis


    Static analysis includes any process for assessing code without executing it (ISO/IEC
    TS 17961:2013) to provide information about possible software defects.


    Static analysis has practical limitations, as the correctness of software is computationally
    undecidable. For example, the halting theorem of computer science states that
    there are programs whose exact control flow cannot be determined statically. As
    a result, any property dependent on control flow—such as halting—may not be decidable
    for some programs. Consequently, static analysis may fail to report flaws or may
    report flows that don''t exist.


    A failure to report a real flaw is known as a false negative. False negatives
    are serious analysis errors, as they may leave you with a false sense of security.
    Most tools err on the side of caution and, as a result, generate false positives.
    A false positive is a test that incorrectly indicates that a flaw is present.
    Tools might report high-risk flaws and many others as an unintended consequence
    of trying not to overwhelm the code with user policies. False positives can also
    occur when the code is too complex to completely analyze. The use of function
    pointers and libraries can make false positives more likely.


    Ideally, tools are complete and sound in their analysis. An analyzer is considered
    sound if it cannot give a false-negative result. An analyzer is considered complete
    if it cannot issue false positives. The possibilities for a given rule are outlined
    in Figure 11-3.


    | False Positive | |

    |---|---|---|

    | False Negative Yes | Incomplete and unsound | Complete and unsound |

    | | No | Incomplete and sound | Complete and sound |


    Figure 11-3: Completeness and soundness


    Compilers perform limited analysis, providing diagnostics about highly localized
    issues in code that don''t require much reasoning. For example, when comparing
    a signed value to an unsigned value, the compiler may issue a diagnostic about
    a type mismatch because it doesn''t require additional information to identify
    the error. As mentioned earlier in this chapter, there are numerous compiler flags,
    such as /Wa for Visual C++ and -Wall for GCC and Clang, that control compiler
    diagnostics.'
