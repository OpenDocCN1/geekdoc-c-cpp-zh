  md: "Starting with C23, attributes can be specified as follows:\n\n```\n[[deprecated]]\n\
    int func(\n  const char *str[[gnu::nonnull]]\n);\n```\n\nLike C++, syntactic location\
    \ determines apportionment. Attributes include deprecated, fallthrough, maybe_unused,\
    \ nodiscard, unsequenced, and reproducible. The attribute syntax supports both\
    \ standard attributes and vendor-specific attributes. The __has_c_attribute conditional\
    \ inclusion operator can be used for feature testing.\n\n# Keywords\n\nThe C language\
    \ is often ridicules for having ugly keywords. C typically defines new keywords\
    \ using reserved identifiers that begin with an under-score character (_) followed\
    \ by a capital letter.\n\nC23 introduced more natural spellings for these keywords\
    \ (Gustedd 2022). In Table A-1, C11 keywords with this convention are shown on\
    \ the left, and the more natural spellings introduced in C23 are on the right.\n\
    \n# Table A-1: Keyword Spellings\n\n| Value | Type |\n|---|---|\n| Bool | bool\
    \ |\n| _Static_assert | static_assert |\n| Thread_local | thread_local |\n| Alignof\
    \ | alignof |\n| Aligns | alignas |\n\nAnother update is the introduction of the\
    \ nullptr constant. The wellworn NULL has a pointer type or may be an integer\
    \ type. It will implicitly convert to any scalar type, so it's not particularly\
    \ type safe. The nullptr constant has nullptr_t and will implicitly convert only\
    \ to a pointer type, void, or bool.\n\n# Integer Constant Expressions\n\nInteger\
    \ constant expressions are not a portable construct; vendors can extend them.\
    \ For example, the array in func may or may not be a variable-length array (VLA):\n\
    \n```\nvoid func() {\n  static const int size = 12;\n  int array[size]; // might\
    \ be a VLA\n}\n```"
