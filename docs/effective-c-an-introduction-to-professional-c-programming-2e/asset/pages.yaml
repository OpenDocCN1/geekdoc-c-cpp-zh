    #  Dynamically Allocated Storage


    C has language and library features that support dynamically allocated storage.
    This storage is typically allocated in the stack frame of the caller (the C standard
    does not define a stack, but by a common implementation feature). A stack is a
    last-in-first-out (LIFO) data structure that supports nested invocations of functions
    at runtime. Each function invocation creates a stack frame in which local variables
    (of automatic storage duration) and other data specific to that invocation of
    the function can be stored.


    # alloca


    For performance reasons, alloca (a nonstandard function supported by some implementations)
    allows dynamic allocation at runtime from the stack rather than the heap. This
    memory is automatically released when the function that called returns. The alloca
    function is an intrinsic (or built-in) function, which is specially handled by
    the compiler. This allows the compiler to substitute a sequence of automatically
    generated instructions for the original function. For example, on the x86 architecture,
    the compiler substitutes a call to alloca with a single instruction to adjust
    the stack pointer to point to the additional storage.


    The alloca function originated in an early version of the Unix system from Bell
    Laboratories but is not defined by the C standard library or POSIX. Listing 6-6
    shows an example function printer that uses the alloca function to allocate storage
    for an error string before printing it out to stderr.'
