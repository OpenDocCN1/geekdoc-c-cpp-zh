    | -Werror | Turn warnings into errors |

    | -std=c23 | Specify the language standard |

    | -pedantic | Issue warnings demanded by strict conformance to the standard |

    | -Wconversion | Warn for implicit conversions that may alter a value |

    | -Wl, -z,noexecstack | Mark the stack segments as nonexecutable |

    | -fstack-protector-all | Add stack protection to functions |


