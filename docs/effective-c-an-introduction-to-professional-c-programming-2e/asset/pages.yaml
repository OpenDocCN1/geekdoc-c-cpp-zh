    # PROGRAM STRUCTURE

    with Aaron Ballman


    ![](img/39793bf6853a55aa3fd3b097e1ea631a_242_0.png)


    Any real-world system is made up of multiple components, such as source files,
    headers, and libraries. Many contain resources including images, sounds, and configuration
    files. Composing a program from smaller logical components is good software engineering
    practice, because these components are easier to manage than a single file.


    In this chapter, you''ll learn how to structure your program into multiple units
    consisting of both source and include files. You''ll also learn how to link multiple
    object files together to create libraries and executable files.


    # Principles of Componentization


    Nothing prevents you from writing your entire program within the main function
    of a single source file. However, as the function grows, that'
