  md: '# Summary


    In this chapter, you learned about static and runtime assertions and were introduced
    to some of the more important and recommended compiler flags for GCC, Clang, and
    Visual C++. You also learned how to debug, test, and analyze your code using both
    static and dynamic analysis.


    These are the important lessons in this book, because you''ll spend a considerable
    amount of time as a C programmer debugging and analyzing your code. I posted the
    following on social media a while back, and it summarizes my (and other C programmers)
    relationship with the C programming language:


    +   - Language I dislike: C

    - Language I begrudgingly respect: C

    - Language I think is overrated: C

    - Language I think is underrated: C

    - Language I like: C


    # Future Directions


    With C23 complete, the committee can turn its attention to the next revision of
    the C programming language. C2Y. This will likely be published in 2029. While
    that may seem like a long time, it''s roughly half the time previous C standard
    editions required.


    The C committee has already approved a new chapter to document our principles
    (Seacord et. 2024). While the committee is dedicated to maintaining the traditional
    spirit of C, there will be a renewed focus on security and safety. For C2Y, we''ll
    likely improve automatic type inference, expand constexpr, and adopt lambdas and
    other features from C++. We''re also working on a novel defer feature for error
    handling and resource management. The C floating-point group will continue its
    work to update to IEEE 754:2019. A technical specification for a provenance-aware
    memory object model for C (ISO/IEC CD TS 6010:2024) should be published soon and
    hopefully incorporated into C2Y.'
