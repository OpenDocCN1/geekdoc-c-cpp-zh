    # Safety-Critical Systems


    Systems with high safety requirements frequently ban the use of dynamic memory
    managers because memory can have unpredictable behavior that significantly impacts
    performance. Forcing all applications to live within a fixed, preallocated area
    of memory can eliminate these problems and make it easier to verify memory use.
    In the absence of recursion, alloca, and VLAs (also prohibited in safety-critical
    systems), an upper bound on the use of stack memory can be derived statically,
    making it possible to prove that sufficient storage exists to execute the functionality
    of the application for all inputs.


    Both GCC and Clang have a -Wla flag that warns if a VLA is used. GCC also has
    a -Wla-larger-than-byte-size flag that warns for declarations of VLAs whose size
    is unbounded or bounded by an argument that allows the array size to exceed byte-size
    bytes.


    134 Chapter 6'
