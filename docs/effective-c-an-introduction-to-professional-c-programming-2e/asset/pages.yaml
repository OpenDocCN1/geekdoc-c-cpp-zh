  md: "# Iteration Statements\n\nIteration statements cause substatement (or compound\
    \ statements) to be executed zero or more times, subject to termination criteria.\
    \ The English word iteration means \"the repetition of a process.\" Iteration\
    \ statements are more informally and commonly referred to as loops. A loop is\
    \ \"a process, the end of which is connected to the beginning\"\n\n# while\n\n\
    The while statement causes the loop body to execute repeatedly until the controlling\
    \ expression is equal to 0. The evaluation of the controlling expression occurs\
    \ before each execution of the loop body. Consider the following example:\n\n\
    ```\nvoid f(unsigned int x) {\nwhile (x > 0) {\n  printf(\"%d\\n\", x);\n  --x;\n\
    }\nreturn;\n}\n```\n\nIf x is not initially greater than 0, the while loop exits\
    \ without executing the loop body. If x is greater than 0, its value is output\
    \ and then decremented. Once the end of the loop is reached, the controlling expression\
    \ is tested again. This pattern repeats until the expression evaluates to 0. Overall,\
    \ this loop will count down from x to 1.\n\nA loop is an entry-controlled loop\
    \ that executes until its controlling expression evaluates to 0. Listing 5-7 shows\
    \ an implementation of the C standard library function memset. This function copies\
    \ the value of val (converted to an unsigned char) into each of the n characters\
    \ of the object pointed to.\n\n```\nvoid *memset(void *dest, int val, size_t n)\
    \ {\nunsigned char *ptr = (unsigned char*)dest;\nwhile (n-- > 0) {\n  ptr++ =\
    \ (unsigned char)val;\n}\nreturn dest;\n}\n```\n\nListing 5-7: The C standard\
    \ library memset dest to a pointer\n\nThe first line of the memset function converts\
    \ a pointer to an unsigned char and assigns the resulting value to the unsigned\
    \ char ptr. This lets us preserve the value of dest to return on the last line\
    \ of the function. The remaining two lines of function form a loop that copies\
    \ the value of val (converted to an unsigned char) into each of the first"
