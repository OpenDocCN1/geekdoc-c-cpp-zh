    As we have seen in previous chapters, both signed integer overflow and unsigned
    integer wraparound are serious problems that can result in buffer overflows and
    other security vulnerabilities. In the code snippet, for example, the expression
    num * size might wrap before being passed as the argument in the call to realloc:


    ```

    if ((new = realloc(p, num * size)) == nullptr) {

    // --snip--

    ```


    The OpenBSD reallocarray function can allocate storage for an array, but like
    calloc, it checks for wraparound during array size calculations, which saves you
    from having to perform these checks. The reallocarray function has the following
    signature:


    ```

    void *reallocarray(void *ptr, size_t nmemb, size_t size);

    ```


    The reallocarray function allocates storage for nmemb members of size and checks
    for wraparound in the nmemb * size calculation. Other platforms, including the
    GNU C library (libc), have adopted this function, and it has been proposed for
    inclusion in the next revision of the POSIX standard. The reallocarray function
    does not zero out the allocated storage.


    The reallocarray function is useful when two values are multiplied to the size:


    ```

    if ((new = reallocarray(p, num, size)) == nullptr) {

    // --snip--

    ```


    This call to the reallocarray function will fail and return a null pointer if
    num * size would wrap around.


    # free


    When it''s no longer needed, memory can be deallocated using the free function.
    Deallocating memory allows that memory to be reused, reducing the chances you''ll
    exhaust the available memory and often providing more efficient use of the heap.


    We can deallocate memory by passing a pointer to that memory to the free function,
    which has the following signature:


    ```

    void free(void *ptr);

    ```


    The ptr value must have been returned by a previous call to malloc, aligned_alloc,
    calloc, or realloc. CERT C rule MEM34-C,"Only free memory allocated dynamically,”
    discusses what happens when the value is not returned. Memory is a limited resource
    and must be reclaimed.'
