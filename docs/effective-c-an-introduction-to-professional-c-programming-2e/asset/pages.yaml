  md: 'The value of a pointer to a FILE object is indeterminate after the associated
    file is closed. Whether a file of zero length (in which an output stream hasn''t
    written any data) exists is implementation defined.


    You can reopen a closed file in the same program or another one, and its contents
    can be reclaimed or modified. If the initial call to the main function returns
    or if the exit function is called, all files close (and all output streams are
    flushed) before program termination.


    Other paths to program termination, such as calling the abort function, may not
    close all files properly, which means that buffered data not yet written to a
    disk might be lost.


    # close


    On POSIX systems, you can use the close function to deallocate the file descriptor
    specified by fd:


    ```

    int close(int fd);

    ```


    If an I/O error occurred while reading from or writing to the filesystem during
    close, it may return -1 with errno set to the cause of failure. If an error is
    returned, the state of fd is unspecified, meaning you can no longer read or write
    to the descriptor or attempt to close it again—effectively leaking the descriptor.
    The Posix issue 8 to address this problem.


    Once a file is successfully closed, the file descriptor no longer exists, because
    the integer corresponding to it no longer refers to a file. Files are also closed
    when the process owning that file descriptor terminates.


    Except in rare circumstances, an application that uses open to open a file will
    use close to close it; an application that uses open to open a file will use close
    to close it (unless it passed the descriptor to fdopen, in which case it must
    close by calling fclose).


