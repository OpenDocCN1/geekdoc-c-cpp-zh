  md: '# Unspecified Behavior


    Unspecified behavior is program behavior for which the standard provides two or
    more options but doesn''t mandate which option is chosen in any instance. Each
    execution of a given expression may yield different results or produce a different
    value than a previous execution of the same expression. An example of unspecified
    behavior is function parameter storage layout, which can vary among function invocations
    within the same program. Unspecified behaviors are enumerated in Annex J.1 of
    the C standard.


    # Undefined Behavior


    Undefined behavior is behavior that isn''t defined by the C standard or less circularly,
    "behavior, upon use of a nonportable or erroneous program construct or of erroneous
    data, for which the standard imposes no requirements" (ISO/IEC 9899:2024). Examples
    of undefined behavior include signed integer overflow and dereferencing an invalid
    pointer value. Code that has undefined behavior is often incorrect, but not always.
    Undefined behaviors are identified in the following standards:


    +   - When "shall" or "shall not" requirement is violated and appears outside
    a constraint, behavior is undefined.

    - When behavior is explicitly specified by the words "undefined behavior.\n- By
    the omission of any explicit definition of behavior.


    The first two kinds of undefined behavior are frequently referred to as implicit
    undefined behaviors, while the third kind is referred to as undefined behavior.
    There is no difference in emphasis among these three; they all describe behavior
    that is undefined. The C standard Annex J.2, "Undefined behavior," lists the undefined
    behaviors in C.


    Developers often misconstr undefined behaviors as errors or omissions in the C
    standard, but the decision to classify a behavior as undefined is intentional
    and considered. Behaviors are classified as undefined by the C standard committee
    for one of the following reasons:


    +   - Given the implementer license not to catch program errors that are difficult
    to diagnose

    - Avoid defining obscure corner cases that would favor one implementation strategy
    over another

    - Identify areas of possible conforming language extension in which the implementer
    may augment the language by providing a definition of the officially undefined
    behavior


    These three reasons are quite different but are all considered portability issues.
    We''ll examine examples of all three as they come over the course of this book.
    Upon encountering undefined behavior, compilers have the latitude to do the following:'
  merge: -1
  pgno: 39
- img_proc: true
  md: '+   - Ignore undefined behavior completely, giving unpredictable results

    - Behave in a documented manner characteristic of the environment (with or without
    issuing a diagnostic)

    - Terminate a translation or execution (and issue a diagnostic)


    None of these options are great (particularly the first), so it''s best to avoid
    undefined behaviors except when the compiler specifies that these behaviors are
    defined to allow you to invoke a language augmentation. Compilers sometimes have
    a pedantic mode that can help notify the programmer of these portability issues.


    # Locale-Specific Behavior and Common Extensions


    Locale-specific behavior depends on local conventions of nationality, culture,
    and language that each implementation documents. Common extensions are widely
    used in many systems but are not portable to all implementations.


    # Summary


    In this chapter, you learned how to write a simple C language program, compile
    it, and run it. We looked at several editors and integrated development environments
    as well as a few compilers that you can use to develop C programs on Windows,
    Linux, and macOS systems. You should use newer versions of the compilers and other
    tools, as they tend to support newer features of the C programming language and
    provide better diagnostics and optimizations. However, you may not want to use
    newer versions of compilers if they break your existing code or if you''re getting
    ready to deploy your code to avoid introducing unnecessary changes into your already
    tested application. We concluded this chapter with a discussion of the portability
    of C language programs.


    Subsequent chapters will examine specific features of the C language and library,
    starting with objects, functions, and types in the next chapter.'
