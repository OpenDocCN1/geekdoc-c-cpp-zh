  md: '# Opaque Types


    Data abstractions are most effective when used with opaque data types that hide
    information. In C, opaque (private) data types are those expressed using an incomplete
    type, such as a forward-declared structure type. An incomplete type is a type
    that describes an identifier but lacks information needed to determine the size
    of objects of that type or their layout. Hiding internal-only data structures
    discourages programmers who use the data abstraction from writing code that depends
    on implementation details, which may change. The incomplete type is exposed to
    users of the data abstraction, while the fully defined type is accessible only
    to the implementation.


