    # Floating-Point Representation


    Floating-point representation is the most common digital representation of real
    numbers. Floating-point representation is a technique that uses scientific notation
    to represent numbers with a mantissa and an exponent for a given base. For example,
    the decimal number 123.456 × 10², while the binary number 0b101100.11 can be represented
    as 1.010011 × 2⁷.


