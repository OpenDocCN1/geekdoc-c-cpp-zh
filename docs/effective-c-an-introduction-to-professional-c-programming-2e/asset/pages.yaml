  md: "A compound assignment of the form E1 op = E2 is equivalent to the simple assignment\
    \ expression E1 = E1 op (E2), except that E1 is evaluated only once. Compound\
    \ assignments are primarily used as shorthand notation. There are no compound\
    \ assignment operators for logical operators.\n\n# Comma Operator\n\nIn C, we\
    \ use commas in two distinct ways: as operators and to separate items in a list\
    \ (such as arguments to functions or lists of declarations). The comma (,) operator\
    \ is a way to evaluate one expression before another. First, the left operand\
    \ of a comma operator is evaluated as a void expression. There is a sequence point\
    \ between the evaluation of the left operand and the evaluation of the right operand.\
    \ Then, the right operand is evaluated after the left. The comma operator has\
    \ the type and value of the right operand—mostly because it is the last expression.\n\
    \nYou can't use the comma operator in contexts where a comma might separate items\
    \ in a list. Instead, you would include a comma within a parenthesized expression\
    \ or within the second expression of a conditional operator. For example, assume\
    \ that a, t, and c each type int in the following:\n\n```\nf(a, (t=3, t+=2), c);\n\
    ```\n\nThe first comma separates the first and second arguments to the function.\
    \ The second comma is a comma operator. The assignment is evaluated first, followed\
    \ by the addition. Because of the sequence point, the assignment is guaranteed\
    \ to complete before the addition takes place. The result of the comma operation\
    \ has the type int and value 5. The third comma separates the second and third\
    \ arguments to the function.\n\n# Pointer Arithmetic\n\nEarlier in this chapter,\
    \ we mentioned that the additive operators (addition and subtraction) can be used\
    \ with either arithmetic operands or object pointers. In this section, we discuss\
    \ adding a pointer and an integer, subtracting two pointers, and subtracting an\
    \ integer from a pointer.\n\nAdding or subtracting an expression that has an integer\
    \ type or from a pointer returns a value with the type of the pointer operand.\
    \ If the pointer operand points to an element of an array, then the result points\
    \ to an element offset from the original element. If the resulting pointer goes\
    \ beyond the bounds of the array, undefined behavior occurs. The difference of\
    \ the array subscripts of the resulting and original array elements equals the\
    \ integer:\n\n```\nint arr[100];\n *arrp1 = arr[84];\n *arrp2 = arrp1 + 20; //\
    \ arrp2 points to arr[60]\nprintf(\"%d\\n\", arrp2 - arrp1); // prints 20\n```"
