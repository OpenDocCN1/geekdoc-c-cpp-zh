  md: "# Unreachable Function-Like Macro\n\nThe unreachable function-like macro is\
    \ provided in <stddef.h>. It expands to a void expression; reaching the expression\
    \ during execution is undefined behavior. This allows you to give hints to the\
    \ optimizer about flow control that is impossible to reach (Gusedt 2021).\n\n\
    As with you tell the optimizer to assume, use with caution, because the optimizer\
    \ will believe you if you're wrong. The following is a typical example of how\
    \ unreachable might be used in practice:\n\n```\n#include <stdlib.h>\nenum Color\
    \ { Red, Green, Blue };\nint func(enum Color C) {\n    switch (C) {\n    case\
    \ Red: return do_red();\n    case Green: return do_green();\n    case Blue: return\
    \ do_blue();\n    }\n    unreachable(); // unhandled value\n}\n```\n\n# Bit and\
    \ Byte Utilities\n\nC23 introduces a collection of bit and byte utilities in the\
    \ <stdbit.h> header (Mene2 2023). These include functions to:\n\n+   * Count the\
    \ number of 1s or 0s in a bit pattern\n* Count the number of leading or trailing\
    \ 1s or 0s\n* Find the first leading or trailing 1 or 0\n* Test whether a single\
    \ bit is set\n* Determine the smallest number of bits required to represent a\
    \ value\n* Determine the next smallest or largest power of two based on a value\n\
    \nFor example, the following code can be used to count the number of consecutive\
    \ 0 bits in a value, starting from the most significant bit:\n\n```\n#include\
    \ <stdbit.h>\nvoid func(uint32_t V) {\n    int N = stdc_leading_zeros(V);\n  \
    \  // use the zero count N\n}\n```\n\nDivision is not supported, and it only works\
    \ with integer types other than char, bool, or-precise integers. Type1, Type2,\
    \ and Type3 can be different types. These functions return false if the mathematical\
    \ result of the operation can be represented by Type1; otherwise, they return\
    \ true. These functions make it easier to comply with the C Coding Standard and\
    \ MISRA C guidelines, but it is still awkward to compose operations."
