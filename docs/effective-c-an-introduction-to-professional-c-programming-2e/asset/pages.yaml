  md: "C23 adds constexpr variables (which imply the const qualifier) when you really\
    \ want something to be a constant (Gilding and Gustedt 2022a):\n\n```\nvoid func()\
    \ {\n    static constexpr int Size = 12;\n    int Array[Size]; // never a VLA\n\
    }\n```\n\nC23 doesn't support constexpr functions yet, only objects. Structure\
    \ members cannot be constexpr.\n\n# Enumeration Types\n\nC enumeration types seem\
    \ normal through C17 but have some strange behaviors. For example, the underlying\
    \ integer type is implementation defined and could be either a signed or unsigned\
    \ integer type. C23 now allows the programmer to specify the underlying type for\
    \ enumerations (Meneide and Pyott 2022)\n\n```\nenum E : unsigned short {\nValid\
    \ = 0, // has type unsigned short\nNotValid = 0xFFFFFF // error, too big\n};\n\
    ```\n\n```\n// forward declare with fixed type\nenum F : int;\n```\n\nYou can\
    \ also declare enumeration constants larger than int:\n\n```\n// has underlying\
    \ type unsigned long\nenum G {\nBiggerThanInt = 0xFFFFFF'FFFF'0000L,\n};\n```\n\
    \n# Type Inference\n\nC23 enhanced the auto specifier for single object definitions\
    \ using type inference (Gilding and Gustedt 2022b). It's basically the same idea\
    \ as in C++, but auto cannot appear in function signatures:\n\n```\nconst auto\
    \ l = 0; // l is const long\nauto huh = \"test\"; // huh is char *, not char[5]\
    \ or char *\nvoid func();\nauto f = func; // f is void (*)\nauto x = (struct S){\
    \ // x is struct S\n1, 2, 3.0\n#define swap(a, b) \\\ndo { auto t = (a); (a) =\
    \ (b); (b) = t; } \\\nwhile (0);\n```"
