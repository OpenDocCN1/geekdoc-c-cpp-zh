  md: 'From the Variables pane in the debugger, we can see that the part we are adding
    looks correct:


    ```

    part: 0xffffffffffcd6 "Seacord"

    ```


    The ret alias to the start of ret also has an expected value:


    ```

    ret: 0xffffffffffcdcd "Robert C. "

    ```


    The value stored in buff, however, seems odd, as it has the same value as an EOF
    (-1):


    ```

    buff: 0xffffffffffffff<error: Cannot access memory at address 0xffffffffffffff>

    ```


    The buff parameter is a character pointer that is assigned the return value from
    memcpy. Once again, let''s check the standard to see what this function returns:


    The memcpy function returns a pointer to the character after c in s1, or a null
    pointer if e was not found in the first n characters of s2.


    According to the C standard, this function can return only a null pointer or a
    pointer to a character in s1 (in this program). storage for buff begins at 0xffffffffffcdde
    and extends for only 10 bytes, neither of these explain the 0xffffffffffffff value,
    so the mystery deepens.


    It''s time to examine the behavior of the vstrcat function more closely. We''ll
    set a breakpoint on line 12 near the beginning of the function and start debugging.
    The buttons on the left of the title bar allow you to continue, step over, step
    into, step out, restart, and stop debugging. Starting from line 12, we single-step
    through the program, so you''ll have to step through a few iterations of the loop,
    watching the values in the VARIABLES pane. If you do this carefully, you''ll eventually
    see that buff is set to 0xffffffffffffff on line 18 triggering the call to the
    memcpy function, as shown in Figure-12. This isn''t detected by the null pointer
    test, and the segmentation fault occurs on the next iteration.


    It was here that I had a eureka moment. The memcpy function returns a null pointer
    to indicate that ''\0'' was not found in the first buff_length offset characters
    of part. However, subtracting one from the value returned by memcpy so that buff
    points to the first occurrence of ''\0'' rather than after it. This works when
    the character is found, but when it isn''t found, subtracting 1 from a null pointer
    is technically undefined behavior in C. On this implementation, the null pointer
    is represented by a 0 value. Subtracting 1 from 0 wraps around and produces the
    0xffffffffffffff value for buff before we can test it. Consequently, the error
    condition is not detected, and the subsequent call to memcpy results in the segmentation
    fault.


    Chapter 11


    *'
