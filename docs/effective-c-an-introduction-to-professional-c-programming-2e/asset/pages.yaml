    # Character


    The C language defines the following character types: char, signed char, and unsigned
    char. Each compiler implementation defines char to have the same alignment, size,
    representation, and behavior as either signed or unsigned char. Regardless of
    the choice made, char is a separate type from the other two and is incompatible
    with both.


    The char type is commonly used to represent data in C language programs. Objects
    of type char can represent the basic execution set—the minimum of characters required
    in the environment—including upper- and lowercase letters, the 10 digits, space
    character, punctuation, and control characters. The char type is inappropriate
    for integer data; use signed char to represent small, signed integer values and
    unsigned char to represent small, unsigned integer values.


    The size of objects type char is always 1 byte, and its width is CHAR_BIT bits.
    The CHAR_BIT macro from <limits.h defines the number of bits in a byte. The value
    of CHAR_BIT macro cannot be less than 8, and on most modern platforms, it is 8.


    The basic execution character set suits the needs of many conventional data processing
    applications, but its lack of English letters is an obstacle to international
    users. To address this need, the C standards specified a new wide type to allow
    large characters by using the wchar_t type which generally takes more space than
    a basic character. Typically, implementations choose 16 or 32 bytes to represent
    a wide character. The C standard library provides functions that support both
    narrow and wide character types. The wchar_t type was not designed to support
    Unicode and has consequently fallen out of favor for most implementations with
    the notable exception of Microsoft Visual Studio.


