    Before looking at the arguments, let''s review the description of the memcpy function
    from the C23 standard:


    ```

    #include <string.h>


    void memcpy(void *restrict s1, const void *restrict s2, int c,

    size_t n);

    ```


    The memcpy function copies characters from the object pointed to by s2 into the
    object pointed to by s1, stopping after the first occurrence of character c (converted
    to an unsigned char) is copied or after n characters are copied, whichever comes
    first. If copying takes place over objects that overlap, the behavior is undefined.


