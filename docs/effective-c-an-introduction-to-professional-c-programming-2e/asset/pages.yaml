  md: '# About the Technical Reviewer to the Second Edition


    Vincent Mailhol is a senior product security engineer at Woven by Toyota, where
    he architects and develops C software for the trusted execution environment of
    automotive electronic control units. He is a member of the company’s cryptographic
    board and, together with Robert, established the company’s security and safety
    coding guidelines. Prior to joining Woven in 2020, he was the lead of the pentesting
    team at ESCRYPT Japan, a subsidiary of the Bosch Group, specializing in automotive
    security. In his free time, Vincent is an active contributor and maintainer of
    the Linux kernel’s CAN subsystem, also known as SocketCAN.'
