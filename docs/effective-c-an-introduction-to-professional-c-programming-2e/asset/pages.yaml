    # Closing Files


    Opening a file allocates resources. If you continuously open files without them,
    you''ll eventually run out of file descriptors or handles for your process, and
    attempting to open more files will fail. Consequently, it''s important to close
    files after you''ve finished using them.


    # fclose


    The C standard library fclose function closes the file:


    ```

    int fclose(FILE *stream);

    ```


    Unwritten buffered data for the stream is delivered to the environment to be written
    to the file. Any unread buffered data is discarded.

    It''s possible for the fclose function to fail. When fclose writes the remaining
    buffered output, for example, it might return an error because the disk is full.
    Even if you know the buffer is empty, errors can still occur when closing a file
    if you are using the Network File System (NFS) protocol. Despite the possibility
    of failure, recovery is often impossible, so programmers commonly ignore errors
    returned by fclose. When closing the file fails, a common practice is to truncate
    the file so its contents are meaningful when next read.

    To ensure your code is robust, make sure you check for errors. File I/O can fail
    for any number of reasons. The fclose function returns EOF if any errors detected:


    ```

    if (fclose(fp) == EOF) {

    err(EXIT_FAILURE, "Failed to close file\n");\}

    ```


    You need to explicitly call flush or fclose on any buffered stream program has
    written to, instead of letting exit (or a return from main) flush, to perform
    the error checking.'
