  md: "# Prior to C23, this operation is considerably more involved:\n\n```\nvoid\
    \ func(uint32_t V) {\nint N = 32;\nunsigned R;\nR = V >> 16;\nif (R != 0) { N\
    \ -= 16; V = R; }\nR = V >> 8;\nif (R != 0) { N -= 8; V = R; }\nR = V >> 4;\n\
    if (R != 0) { N -= 4; V = R; }\nR = V >> 2;\nif (R != 0) { N -= 2; V = R; }\n\
