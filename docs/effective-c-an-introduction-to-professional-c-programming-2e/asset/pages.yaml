    # Linkage


    Linkage is a process that controls whether an interface is public or private and
    determines whether any two identifiers refer to the same entity. Ignoring macros
    and macro parameters that are replaced early in the translation phases, an identifier
    can denote a standard attribute, an attribute prefix, or an attribute name; an
    object; a tag or a member of a structure, union, or enumeration; a typedef name
    or a label name.


    C provides three kinds of linkage: external, internal, or none. Each declaration
    of an identifier with external linkage refers to the same function or object everywhere
    in the program. Identifiers referring to declarations with internal linkage refer
    to the same entity only within the translation unit containing the declaration.
    If two translation units both refer to the same name refer different instances
    of the entity. If a declaration has no linkage, it''s a unique entity in each
    translation unit.


