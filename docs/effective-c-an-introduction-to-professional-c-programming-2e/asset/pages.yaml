  md: '# Integer Types and Representations


    Starting C23, two''s complement is the only allowed integer representation (Bastien
    and Gusted 2019). Signed integer overflow remains undefined behavior. The int8_t,
    int16_t, int32_t, and int64_t types are now predictably available everywhere.
    The [intmax_t types are no longer maximal and are only required to represent long
    values, not extended or bit-precise values.


    C23 also introduces bit-precise integer types (Blower 2020). These are signed
    and unsigned types that allow you to specify the bit-width. These integers do
    not undergo integer promotions, so they remain the size you requested. Bit-width
    includes the sign, so _BitInt(2) is the smallest signed bit-precise integer. BITINT_MAXWIDTH
    specifies the maximum width of a bit-precise integer. It must be at least ULONG_WIDTH
    but can be much larger (Clang supports > 2 bits).


    In C17, adding two nobles required some bit fiddling:


    ```

    unsigned int add(unsigned int L, unsigned int R)

    {

    unsigned int LC = L & 0xF;

    unsigned int RC = R & 0xF;

    unsigned int Res = LC + RC;

    return Res & 0xF;

    }

    ```


    This is much simpler with _BitInt:


    ```

    unsigned _BitInt(4) add(unsigned _BitInt(4) L, unsigned _BitInt(4) R)

    {

    return L + R;

    }

    ```


    C23 also added binary literals. The integer literals 0b0010101011, 0x155, 341,
    and 0525 all express the same value. You can also now use digit separators for
    improved readability, for example: 0b0000''1111''0000, 0xF''0C, 3''852, and 07''414.


    C23 finally has checked integer operations that will detect overflow and wraparound
    in addition, subtraction, and multiplication (Svoboda 2021).


    ```

    #include <stdint.h> // new header

    bool ckd_add(Type1 *Result, Type2 L, Type3 R);

    bool ckd_sub(Type1 *Result, Type2 L, Type3 R);

    bool ckd_mul(Type1 *Result, Type2 L, Type3 R);

    ```'
