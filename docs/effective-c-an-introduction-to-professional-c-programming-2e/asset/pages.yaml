    # -Wconversion


    Data type conversions can alter data values in unexpected ways. Memory safety
    violations may result from adding or subtracting these values from a pointer.
    The -conversion compiler option warns about:


    +   - Implicit conversions that may alter a value, including conversions between
    floating-point and integer values

    - Conversions between signed and unsigned integers, for example:


    ```

    unsigned ui = -1;

    ```


    +   - Conversions to smaller types

    - Warnings about conversions between signed and unsigned integers can be disabled
    by using -Wsign-conversion, but they''re often useful in finding classes of defects
