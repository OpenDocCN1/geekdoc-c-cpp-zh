    To mitigate these risks, C++ defines its own casts, which are less powerful.


    # Conditional Operator


    The conditional operator (? : ) is the only C operator that takes three operands.
    It returns a result based on the condition. You can use the conditional operator
    like this:


    ```

    result = condition ? valueReturnedIfTrue : valueReturnedIfFalse;

    ```


    The conditional operator evaluates the first operand, the condition (valueReturnedIfTrue)
    is evaluated if the condition is true, or the third operand (valueReturnedIfFalse)
    is evaluated if the condition is false. The result is the value of the second
    or third operand (depending on which operand was evaluated).


    This result is converted to a common type based on the second and third operands.
    There is a sequence point between the evaluation of the first operand and the
    evaluation of the second or third operand (whichever is evaluated) so that the
    compiler will ensure that all side effects resulting from evaluating the condition
    have completed before the second or third operand is evaluated.'
