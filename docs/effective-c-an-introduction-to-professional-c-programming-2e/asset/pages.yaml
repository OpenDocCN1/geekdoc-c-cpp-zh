    # do...while


    do...while statement is similar to the while statement, except that the evaluation
    of the controlling expression occurs after each execution of the loop body rather
    than before. As a result, the loop body is guaranteed to execute once before the
    condition is tested. The do...while statement has the following syntax:


    ```

    do

    statement

    while ( expression );

    ```


    In a do...while iteration, statement is unconditionally executed once, after which
    expression is evaluated. If expression is not equal to 0, control returns to the
    top of the loop and statement is executed again. Otherwise, execution passes to
    the statement following the loop.


    The do...while iteration is commonly used in input/output (I/O), where it makes
    sense to read from a stream before testing the state of the stream,


    ```

