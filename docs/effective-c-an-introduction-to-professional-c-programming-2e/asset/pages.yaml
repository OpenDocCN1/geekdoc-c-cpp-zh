  md: '# Relational Operators


    The relational operators include equal to (=), not equal to (!), less than (<),
    greater than (>), less than or equal to (<=), and greater than equal to (>=).
    Each returns 1 if the specified relationship is true and 0 if it is false. The
    result has type int, again, for historical reasons.


    Note that C does not interpret the expression a < b to mean that b is greater
    than a but less than c, as mathematics dictates. Instead, the expression is interpreted
    to mean (a < b) < c. In English, if a is less than b, the compiler should compare
    1 to c; otherwise, it compares 0 to c. If this is your intent, include the parentheses
    to make clear to any potential code reviewer. Some compilers like GCC and Clang
    provide -parentheses flag to diagnose these problems. To determine whether b is
    greater than a but less than c, you can write this: (a < b) && (b < c).


    The equality and inequality operators have lower precedence than relational—assuming
    otherwise is a common mistake. This means that the expression a == b < d is evaluated
    as (a == b) == (c < d). In both cases, the comparisons a < b and c < d are evaluated,
    and the resulting values (either 0 or 1) are compared for equality.


    We can use these operators to compare types or pointers. When we compare two pointers,
    the result depends on the literal locations in the address of the objects pointed
    to. If both pointers point to the same object, they are equal.


    Equality and inequality operators differ from the other relational operators.
    For example, you cannot use the relational operators on two pointers to unrelated
    objects, because doing so makes no sense and is unexpectedly undefined:


    ```

    int i, j;

    bool b1 = &i < &j; // undefined behavior

    bool b2 = &i == &j; // OK, but tautologically false

    ```


    You might compare pointers, for example, to determine whether you have reached
    the too-far element of an array.


    # Compound Assignment Operators


    Compound assignment operators, shown in Table 4-6, modify the current value of
    an object by performing an operation on it.


    | Table 4-6: Compound Assignment Operators |

    | Operator | Assignment by |

    | --- | --- |

    | += | Sum and difference |

    | *= /= %= | Product, quotient, and remainder |

    | <= >> | Bitwise left shift and right shift |

    | &= ^= |= | Bitwise AND, XOR, and OR |


    Expressions and Operators 93'
