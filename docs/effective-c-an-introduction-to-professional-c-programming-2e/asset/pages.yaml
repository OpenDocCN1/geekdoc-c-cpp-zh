  md: 'An enumeration, enum, allows you to define a type that assigns names (enumerators)
    to integer values in cases with an enumerable set of constant values. The following
    are examples of enumerations:


    ```

    enum day { sun, mon, tue, wed, thu, fri, sat };

    enum cardinal_points { north = 0, east = 90, south = 180, west = 270 };

    enum months { jan = 1, feb, mar, apr, may, jun, jul, aug, sep, nov, dec };

    ```


    If you do not specify a value to the first enumerator with the = operator, the
    value of its enumeration constant is 0, and each subsequent enumerator without
