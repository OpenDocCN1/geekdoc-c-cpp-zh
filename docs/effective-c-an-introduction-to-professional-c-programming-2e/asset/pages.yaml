    C was first described in 1978 by Kernighan and Ritchie in the book C Programming
    Language (Kernighan and Ritchie 1988). It is now defined by revisions of the ISO/IEC
    9899 standard (ISO/IEC 2024) and other technical specifications. The C standards
    committee is the steward of the C language, working with the broader community
    to evolve the C language. In 1983, the American National Standards Institute (ANSI)
    formed the X31 committee to establish a C specification, and in 1989, the C standard
    was ratified as ANSI X3.159-1989, "Programming Language C." This version of the
    language is referred to as ANSI C or C89.


    In 1990, the ANSI C standard was adopted (unchanged) by a technical committee
    of the International Organization for Standardization (ISO) and the International
    Electrotechnical Commission (IEC) and published the first edition of the standard,
    C90 (ISO/IEC 9899:1990). The second edition of the standard, C99, was published
    in 1999 (ISO/IEC 9899:1999), and a third edition, C11, in 2011 (ISO/IEC 9899:2011).
    The fourth version, published in 2018 as C17 (ISO/IEC 9899:2018), repairs defects
    in C11. The latest version of the standard (as of this writing) is the fifth version,
    published in 2023 as C23 (ISO/IEC 9899:2024). I am the convener of ISO/IEC JTC1/SC22/WG14,
    the international standardization working group for the programming language C.


    In the years the TIOBE Programming Index has tracked programming language popularity,
    C has remained in first or second place (TIOBE Index 2022).


    # The C Standard


    The C standard (ISO/IEC 9899:2024) defines the language and is the final authority
    on language behavior. While the standard can be obscure to impenetrable, you need
    to understand it if you intend to write code that is portable, safe, and secure.
    The C standard provides a substantial degree of latitude to implementations to
    allow them to be optimally efficient on various hardware platforms. Implementations
    is the C standard uses to refer to compilers and is defined as follows:


    A particular set of software, running in a particular translation environment
    under particular control options, performs translation of programs for, and supports
    execution of functions in, a particular execution environment.


    This definition indicates that each compiler with a particular set of command
    line flags, along with the C standard library, is considered a separate implementation,
    and different implementations can have significantly different implementation-defined
    behavior. This is noticeable in GNU Compiler Collection (GCC), which uses the
    -std flag to determine the language'
