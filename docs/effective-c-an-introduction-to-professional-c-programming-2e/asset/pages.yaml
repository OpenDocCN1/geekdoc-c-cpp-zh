  md: '# Jump Statements


    A jump statement unconditionally transfers control to another section of the same
    function when encountered. These are the lowest-level control flow statements
    and generally correspond closely to the underlying assembly language code.


    # goto


    Any statement may be preceded by a label, which is an identifier followed by a
    colon. C23 also allows you to place labels in front of declarations and at the
    end of a compound statement, which was not allowed in previous versions of C.
    A goto statement jumps you to the statement prefixed by the named label in the
    enclosing function. The jump is unconditional, meaning it happens every time the
    goto statement is executed. Here''s an example of a goto statement:


    ```

    * executed statements */

    goto location;

    /* skipped statements */

    location:

    /* executed statements */

    ```


    Execution continues until the goto statement is reached, at which point control
    jumps to the statement following the location label, where execution continues.
    Statements between the goto statement and the label are passed over.


    The goto statement has a bad reputation since Edsger Dijkstra wrote a paper titled
    "Go To Statement Considered Harmful" (1968). His criticism was that goto statements
    can result in spaghetti code (with a complex and tangled control structure, resulting
    in a program flow that''s conceptually twisted and tangled like a bowl of spaghetti)
    haphazardly. However, goto statements can also make easier to read and use in
    a clear, concise manner.


    One helpful way to use goto statements is to chain them to release release resources
    (such as dynamic memory or an open file) when an error occurs and you must leave
    a function. This scenario happens when a program allocates multiple resources;
    each allocation can fail, and resources must be released to prevent leaking. If
    the first resource allocation fails, no cleanup is needed, because no resources
    have been allocated. However, if the second resource cannot be allocated, the
    first resource needs to be released. Similarly, if the third resource cannot be
    allocated, the second and first resources need to be released, and so forth. This
    pattern results in duplicated cleanup code, and it can be error-prone because
    of the duplication and additional complexity.'
