  md: "A good use of static assertions is to document all your assumptions concerning\
    \ implementation-defined behavior. This will prevent the code from compiling when\
    \ porting to another implementation where those assumptions are invalid.\n\nBecause\
    \ a static assertion is a declaration, it can appear at file scope, immediately\
    \ following the definition of the struct it asserts.\n\nFor the second example,\
    \ the clear_std function, shown in Listing 11-2, calls the getchar function to\
    \ read characters from stdin until the end of the file is reached.\n\n```\n#include\
    \ <stdio.h>\n#include <limits.h>\n\nvoid clear_stdin() {\nint c;\n\ndo {\n  c\
    \ = getchar();\n  static_assert(sizeof(unsigned char) < sizeof(int),\n    \"F1034-C\
    \ violation\");\n} while (c != EOF);\n}\n```\n\nListing 11-2: Using static_assert\
    \ to verify integer sizes\n\nEach character is an unsigned char converted to an\
    \ int. It's common practice to compare the character returned by the getchar function\
    \ with EOF, often in a do...while loop, to determine when all the available characters\
    \ have been read. For the terminating condition must be able to differentiate\
    \ between a character and EOF. The C standard allows unsigned char and int to\
    \ have the same range, meaning that on some implementations, this for EOF could\
    \ return false positives, in which case the do...while loop may terminate early.\
    \ Because this is an unusual condition, use static_assert to validate the do...while\
    \ loop can properly distinguish valid characters and EOF.\n\nIn this example,\
    \ the static assertion verifies that sizeof(unsigned char) < sizeof(int). The\
    \ static assertion is placed near the code that depends on this assumption true\
    \ so that you can easily locate the code that needs to be repaired if the assumption\
    \ is violated. Because static assertions are evaluated at compile time, including\
    \ them before executing code has no impact on the runtime efficiency of the program.\
    \ The CERT C rule FIO34-C, \"Distinguishing between characters from a file and\
    \ EOF and EOF,\\\" for more information on this topic.\"\n\nFinally, in Listing\
    \ 11-3, we use static_assert to perform compile-time bounds checking."
