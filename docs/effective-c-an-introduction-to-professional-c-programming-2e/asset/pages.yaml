  md: '# The Compilation Process


    Conceptually, the compilation process consists of a pipeline of eight phases,
    as shown in Figure 9-1. We call these *translation phases* because each phase
    translates the code for processing by the next phase.


    | Character mapping | Line splicing | Tokenization | Preprocessing | Character-set
    mapping | String concatenation | Translation | Linkage |


    Figure 9-1: Translation phases


    The preprocessor runs before the translator source the source code into object
    code, which allows the preprocessor to modify the source code the user wrote *before*
    the translator operates on. Consequently, the preprocessor has a limited amount
    of semantic information about the program being compiled. It doesn''t understand
    functions, variables, or types. Only basic elements, such as header names, identifiers,
    literals, and punctuation characters like +, and ! are meaningful to the preprocessor.
    These basic elements, called *tokens*, are the smallest elements of a computer
    program that have meaning to a compiler.


    The preprocessor operates on *preprocessing directives* that you include in the
    source code to program the behavior of the preprocessor. You spell preprocessing
    directives with a leading # #include, #define, #embed, or #if. Each preprocessing
    directive is terminated by a newline character. You can indent directives by including
    whitespace between the beginning of the line and the #


    ```

    #define THIS_IS_FINE 1

    ```


    or between the # and the directive:


    ```

    # define SO_IS_THIS 1

    ```


    Preprocessing directives instruct the preprocessor to alter the resulting translation
    unit. If your program contains preprocessing directives, the code translator consumes
    not the same code you write. Compilers usually provide a way to view the preprocessor
    output, called *translation unit*, passed to the translator. Viewing the preprocessor
    output is unnecessary, but you may find it informative to see the actual code
    given to the translator. Table 9-1 lists flags that many compilers use to output
    a translation unit.


    Table 9-1: Outputting a Translation Unit


    | | Example command line |

    | Clang | clang other-options -E -o tu.i.c |

    | GCC | gcc other-options -E -o tu.i.c |

    | Visual C++ | cl other-options /P /Fitu.i.c |


    Preprocessed output files are commonly given a .i file extension.'
  merge: -1
  pgno: 225
