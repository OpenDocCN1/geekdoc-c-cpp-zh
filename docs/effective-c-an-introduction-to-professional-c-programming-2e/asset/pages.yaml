  md: '# Assertions


    An assertion is a function with a Boolean value, known as a predicate, which expresses
    a logical proposition about a program. You use an assertion to verify that a specific
    assumption you made during the implementation of your program remains valid. C
    supports static assertions that can be checked at compile time using static_assert
    and runtime assertions that are checked during program execution using assert.
    The assert macro is defined in the <assert.h> header. In C23, static_assert is
    a keyword. In C11, static_assert was provided as a macro in <assert.h>. Prior
    to that, C did not have static assertions.


    # Static Assertions


    Static assertions can be expressed using the static_assert(integer-constant-expression,
    string-literal);


    ```

    static_assert(integer-constant-expression, string-literal);

    ```


    Since C23, static_assert also accepts a single-argument form:


    ```

    static_assert(integer-constant-expression);

    ```


    If the value of the constant expression is not equal to 0, the static_assert declaration
    has no effect. If equal to 0, the compiler will produce a diagnostic message with
    the text of the string literal, if present.


    You can use static assertions to validate assumptions at compile time, such as
    specific implementation-defined behaviors. Any change in implementation-defined
    behavior will then be diagnosed at compilation.


    Let''s look at three examples of using static assertions. First, in Listing 11-1,
    we use static_assert to verify that struct packed has no padding bytes.


    ```

    struct packed {

    int i;

    char *p;

    };

    static_assert(sizeof(struct packed) == sizeof(int) + sizeof(char *), "struct packed
    must not have any padding");

    ```


    Listing 11-1: Asserting the absence of padding bytes


    The predicate for the static assertion in this example is the same as the combined
    size of its int and char members. For example, on x86-32, both int and char *
    are 4 bytes, and the structure is not padded, but on x86-64, int is 4 bytes, char
    * is 8 bytes, and the compiler adds 4 padding bytes between the two fields.'
