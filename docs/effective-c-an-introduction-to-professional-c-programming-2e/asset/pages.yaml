    | Flag | Purpose |

    | --- | --- |

    | -DFORTIFY_SOURCE=2 | Detect buffer overflows |

    | -fpie -W1,-pie | Required for address space layout randomization |

    | -fpic-shared | Disable text abundant relocations for shared libraries |

    | -g3 | Generate abundant debugging information |

    | -O2 | Optimize your code for speed/space efficiency |

    | -Wall | Turn on recommended compiler warnings |

