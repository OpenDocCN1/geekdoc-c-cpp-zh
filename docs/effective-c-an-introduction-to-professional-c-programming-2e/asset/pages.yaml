    # Using Temporary Files


    We frequently use temporary files as an interprocess communication mechanism or
    for temporarily storing information out to disk to free up random-access memory
    (RAM). For example, one process might write to a temporary file that another process
    reads from normally created in a temporary directory by functions such as the
    C standard library''s tmpfile and tmpnam or POSIX''s mktemp.


    Temporary directories can be either global or user specific. In Unix and Linux,
    the TMPDIR environment variable is used to specify the global temporary directories,
    which are typically /tmp and /var/tmp. Systems running Wayland or the X11 window
    system use specific temporary directories defined by the $XDG_RUNTIME_DIR variable,
    which is typically set to /run/$user/. In Windows, you can find user-specific
    temporary directories in the AppData section of the User Profile, C:\Users\UserName\AppData\Local\Temp
    (%APPDATA%Temp). On Windows, the global temporary directory is specified by the
    TMP or TEMP environment variable. The C:\Windows\Temp directory is a system folder
    owned by Windows to store temporary files.


    For security reasons, it''s best for each user to have their own temporary directory,
    because the use of global temporary directories frequently results in security
    vulnerabilities. The most secure function for creating files is the POSIX mktemp
    function. However, because accessing files in shared directories may be difficult
    or impossible to implement securely, we recommend that you not use any of the
    available functions and instead perform the interprocess communication by using
    sockets, shared memory, or other mechanisms designed for this purpose.


