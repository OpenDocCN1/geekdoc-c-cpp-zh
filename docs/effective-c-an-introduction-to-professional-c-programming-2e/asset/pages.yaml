  md: 'returned to the programmer. This size information allows all memory blocks
    to be traversed from any known block in either direction so that the memory manager
    can coalesce bordering unused blocks into a larger block to minimize fragmentation.


    When a program starts, the free memory areas are long and contiguous. During the
    program''s lifetime, memory is allocated and deallocated. Eventually, the contiguous
    regions fragment into smaller and smaller contiguous areas. As a result, larger
    allocations can fail even though the total amount of free memory is sufficient
    for the allocation. Memory allocated for the client process and memory allocated
    for internal use within the memory manager are all within the addressable memory
    space of the client process.


    # When to Use Dynamically Allocated Memory


    As previously mentioned, dynamically allocated memory is used when the exact storage
    requirements for a program are unknown before runtime. Dynamically allocated memory
    is less efficient than statically sized memory because the memory manager needs
    to find appropriately sized blocks of memory in the runtime heap, and the caller
    must explicitly free those blocks when no longer needed, all of which require
    additional processing. Dynamically allocated memory also requires additional processing
    for housekeeping operations such as defragmentation (the consolidation of adjacent
    blocks), and the memory manager often uses extra for control structures to facilitate
    these processes.


    Memory leaks occur when dynamically allocated memory that is no longer needed
    is not returned to the memory manager. If these memory leaks are severe, the memory
    manager eventually won''t be able to satisfy new requests for storage.


    By default, you should declare objects with either automatic or static storage
    duration for objects whose sizes are known at compilation time. Dynamically allocate
    memory when the size of the size or the number of objects is unknown before runtime.
    For example, you might use dynamically allocated memory to read a table at runtime,
    especially if you do not know the number of rows in the table at compile time.
    Similarly, you might use dynamically allocated memory to create linked lists,
    tables, binary trees, or other data structures for which the number of data elements
    in each container is unknown at compile time.


