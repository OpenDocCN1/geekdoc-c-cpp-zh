  md: "One solution is to use nested if statements, which can also become difficult\
    \ to read if nested deeply. Instead, we can use goto chain as shown in Listing\
    \ 5-10 to release resources.\n\n```\nint something(void) {\n FILE *file1, *file2;\n\
    \ object_t *obj;\n int ret_val = 0; // initially assume a successful return value\n\
    \n file1 = fopen(\"a_file\", \"w\");\n if (file1 == nullptr) {\n  return -1;\n\
    \ }\n\n file2 = fopen(\"another_file\", \"w\");\n if (file2 == nullptr) {\n  ret_val\
    \ = -1;\n  goto FAIL_FILE2;\n }\n\n obj = malloc(sizeof(*obj));\n if (obj == nullptr)\
    \ {\n  ret_val = -1;\n  goto FAIL_OBJ;\n }\n\n // operate on allocated resources\n\
    \n // clean up everything\n free(obj);\n FAIL_OBJ: // otherwise, close only the\
    \ resources we needed\n fclose(file2);\n FAIL_FILE2:\n fclose(file1);\n return\
    \ ret_val;\n }\n```\n\nListing 5-10: Using a goto chain to release resources\n\
    \nThe code follows a simple pattern: resources are allocated in a certain order,\
    \ operated upon, and then released in reverse (last, in, first) order. If an error\
    \ occurs when allocating a resource, the code uses goto to jump to the appropriate\
    \ location in cleanup code and releases only those that have been allocated.\n\
    \nUsed like this, goto statements can make code easier to read. A real-world example\
    \ is the copy_process function from kernel/fork.c from v6.7 of the Linux kernel\
    \ (https://elixir.bootlin.com/linux/v6.7/source/kernel/fork.c#L2245), which uses\
    \ 20 goto labels to perform cleanup code when an internal function fails."
