    # Code Reuse


    Code reuse is the practice of implementing functionality once and then reusing
    it in various parts of the program without duplicating the code. Code duplication
    can lead to slightly unexpected behavior, oversized and bloated executables, and
    increased maintenance costs. And anyway, why write the code more than once?


    Functions are the lowest-level reusable units of functionality. Any logic that
    you repeat more than once is a candidate for encapsulating in a function. If the
    functionality has minor differences, you might be able to create a parameterized
    function that serves multiple purposes. Each function should work that is not
    duplicated by any other function. You can then compose individual functions to
    solve increasingly sophisticated problems.


    Packaging reusable logic into functions can improve maintainability and eliminate
    defects. For example, though you could determine the length of a null-terminated
    string by using a simple for loop, it''s more maintainable to use the strlen function
    from the C library. Because programmers are already familiar with the strlen function,
    they''ll have an easier time understanding what that function is doing than what
    the loop is doing. Furthermore, if you reuse functionality, you''re less likely
    to introduce behavioral differences in hoc implementations, and you make it easier
    to globally replace the functionality with a better-performing algorithm or more
    secure implementation, for example.


    When designing functional interfaces, a balance must be struck between generality
    and specificity. An interface that''s specific to the current requirement may
    be lean and effective but hard to modify when requirements change. A general interface
    might allow for future requirements to be cumbersome for foreseeable needs.


