    Finally in this section lets have a look at the JOIN command. This command is
    used to combine rows from two or more tables based on a related column between
    them. We have already used them in previous examples but let us look at the most
    common different types of joins available.


    ![](img/9ad62c521b3df94dc74d517230e21e72_330_0.png)


    (INNER) JOIN: This mothed will return records that have matching values in both
    of the related tables.


    ![](img/9ad62c521b3df94dc74d517230e21e72_330_1.png)


    LEFT (OUTER) JOIN: This method returns all records from the left table, and only
    the matched records from the right table.


    ![](img/9ad62c521b3df94dc74d517230e21e72_330_2.png)


    RIGHT (OUTER) JOIN: Returns all records from the right table, and only the matched
    records from the left table.


    ![](img/9ad62c521b3df94dc74d517230e21e72_330_3.png)


    FULL (OUTER) JOIN: Returns all records when there is a match in either the left
    or right table.

