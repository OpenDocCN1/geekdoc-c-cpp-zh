    # So, what have we got?


    **Label:** In the section you will be able to see the recorded http request, during
    test run or after test.


    **Samples:** Samples to the number of http request ran for given thread, or the
    average time to receive the web pages. For example we have one http request and
    we run it with 5 users, than the number of samples is 5x1=5. If the same sample
    run two times for the single user, then the number of samples for 5 users will
    be 5x2=10.


    **Average:** Average is the response time for particular http request. This time
    is in millisecond. This Arithmetic mean for all responses (sum of time / count)


    **Min:** Min denotes to the minimum response time taken by the http request.


    **Max:** Max denotes to the maximum response time taken by the http request.


    **Std.Deviation:** This shows how many exceptional cases were found which deviating
    from the average value of receiving the time. The lesser this value more consistent
    the pattern is assumed.


    **Error %:** This denotes the error percentage in samples during run. This error
    can be of 404(file not found) or may be exception or any kind of error during
    test run will be shown in Error %. In the image the error % is zero, because all
    the requests ran successfully.


    **Throughput:** Throughput is the number of requests per unit of time (seconds,
    minutes, hours) that are sent to your server during the test. Larger is better.


    **KB/Sec:** The throughput measured in Kilobytes per second


