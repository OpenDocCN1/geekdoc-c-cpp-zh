    When testing API''s there are some risks to be considered which will need to become
    of your test strategy. The first risk is if tests fail to fail an API change.
    Hopefully, you will be informed of any changes to in-house APIs and there will
    be able to update your tests accordingly. The problems can arise with third party
    API''s and should your tests begin to fail then this is the first place to look.
    Check the online documentation for the API, is there a new release?


    The next risk is availability. If the API you are testing against is a test version
    of the APIs and there may times the Test API is not available, this will need
    to be factored into any testing you have planned. You will also need to ensure
    that access to the internet is always available when testing.


    Other considerations, especially with test systems, is performance and timeouts.
    These are factors that need to be considered when testing APIs.


    So let us look further a GET requests, these are the most common type of API tests
    you will see. You might think that these are remarkably simple, you send a request
    to a server, and you get a response, that all done. Not quite, there is more to
    it than that. The first question is how do you know that what has been returned
    correct?


    Well the first thing to check is the returned data match what should have been
    returned according to the API documentation. Is there returned data in the correct
    format? Are all expected fields returned with data? Next repeat the'
