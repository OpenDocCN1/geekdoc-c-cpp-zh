- img_proc: true
  md: '# # Stored Procedures


    Stored Procedures enables the placing of database-intensive operations into stored
    procedures. This is a powerful tool which lets you define an API for your database
    application. You can then reuse this API across multiple applications and multiple
    programming languages whenever it is required. This ability also avoids duplicating
    database code and using SQL within your code saving time and effort when you make
    updates due to future schema changes.


    Now let look at one of our SQL statements from the previous chapter and then create
    a Stored Procedure for it.


    ```

    SELECT bs.saleDate, bs.saleValue, mb.reg, cs.fullname, cs.email, cs.mobile

    FROM spicetworld.bikes bs

    INNER JOIN spicetworld.motorbikes mb ON mb.id = bs.bikelid

    INNER JOIN spicetworld.customers cs ON cs.id = bs.customerIdd

    ```


    Remember it, now let us create a stored procedure for this SQL


    ```

    DELIMITER //

    CREATE PROCEDURE SelectAllBikeSales

    BEGIN

    SELECT bs.saleDate, bs.saleValue, mb.reg, cs.fullname, cs.email

    FROM spicetworld.bikes bs

    INNER JOIN spicetworld.motorbikes mb ON mb.id = bs.bikelid

    INNER JOIN spicetworld.customers cs ON cs.id = bs.customerId

    END //

    DELIMITER ;

    ```


    When this SQL is executed then the stored procedure will be created. So, to run
    the new procedure simply call it thus:


    A nice and easy example, what if we just want to return bike sales history of
    one customer, easy to do with a stored procedure.


    ```

    CREATE PROCEDURE SelectAllBikeSalesForCustomer

    (IN email CHAR(75))

    BEGIN

    SELECT bs.saleDate, bs.saleValue, mb.reg, cs.fullname, cs.email, cs.mobile

    FROM spicetworld.bikes bs

    INNER JOIN spicetworld.motorbikes mb ON mb.id = bs.bikelid

    INNER JOIN spicetworld.customers cs ON cs.id = bs.customerId

    WHERE cs.email = email

    ```'
  merge: -1
  pgno: 331
- img_proc: true
  md: '```

    END //

    DELIMITER ;

    ```


    When this SQL is executed then the stored procedure will be created. So, to run
    the new procedure simply call it thus:

    CALL SelectAllBikeSalesForCustomer(''kev@kevsbox.com'');

    Once again, a nice easy example. Let us do one more, in this example, we want
    all sales for the given vehicle registration.


    ```

    DELIMITER //

    CREATE PROCEDURE SelectAllBikeSalesForReg

    (in reg CHAR(20))

    BEGIN

    SELECT bs.saleDate, bs.saleValue, mb.reg, cs.fullname, cs.email

    FROM spicetworld.bikeikes bs

    INNER JOIN spicetworld.motorbikes mb ON mb.id = bs.bikeld

    INNER JOIN spicetworld.customers cs ON cs.id = bs.customerid

    WHERE mb.reg = reg

    END //

    DELIMITER ;

    ```


    So, there you go, a nice easy introduction into stored procedures. These are very
    simple examples and that is beyond the scope of this book but there are plenty
    of very good publications for MySql and Microsoft SQL out there for further reading.'
