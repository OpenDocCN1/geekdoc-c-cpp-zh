    # ## Therac-25 (1985-1987)


    The Therac-25 was a machine for administering radiation therapy, generally for
    treating cancer patients. It had two modes of operation. The first consisted of
    an electron beam targeted directly at the patient in small doses for a short amount
    of time. The second aimed the electron beam at high energy levels at a metal ‘target’
    first, which would essentially convert the beam into X-rays that were then passed
    into the patient.


    In previous models of the Therac machine, for this second mode of operation, there
    were physical fail-safes to ensure that the target was in place as without it,
    extremely high energy beams could be mistakenly fired directly into the patient.
    In the new model, these physical fail-safes were replaced by software ones.


    Unfortunately, there was a bug in the software: an ‘arithmetic overflow’ sometimes
    occurred during automatic safety checks. This means that the system was using
    a number inside its internal calculations that were too big for it to handle.
    If at this precise moment, the operator was configuring the machine, the safety
    checks would fail, and the metal target would not be moved into place. The result
    was that beams 100 times higher than the intended dose would be fired into patient,
    giving them radiation poisoning. This happened on 6 known occasions, causing the
    later death of 4 unfortunate patients.


    # ## Knight Capital Group''s trading violations (2012)


    In August 2012 Knight Capital Group Inc., which is one of America’s largest trading
    firms, mistakenly sent out more than four million stock orders in less'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'than one hour. These orders should have been spread out over days—and reversing
    the trades cost almost half a billion dollars. Knight Capital would have been
    sent into bankruptcy it had not for a group of investors who saved the day and
    came up with $400 million. The problem was that when a code change was released
    it was not deployed to all the servers, one server was missed, and this caused
    the server to use old code to create millions of orders. As a result of this error,
    the firm''s shares lost 75% in just two days after the faulty software flooded
    the market with unintended trades, sending dozens of stocks in spasms. The software
    bug caused over $440 million in losses, which is almost four times what the company
    had made in 2011.


    # The Cold War Missile Crisis (September 26, 1983) -


    Stanislav Petrov was the duty officer of a secret bunker near Moscow responsible
    for monitoring the Soviet early warning satellite system. Just after midnight,
    they received an alert that the US had launched five Minuteman intercontinental
    ballistic missiles. As part of the mutually assured destruction doctrine that
    came into prevalence during the Cold War, the response to an attack by one power
    would be a revenge attack by the other. This meant that if the attack was genuine,
    they needed to respond quickly. However, it seemed strange that the US would attack
    with a handful of warheads: although they would cause massive damage and loss
    of life, it would not be even enough to wipe out the Soviet opposition. Also,
    the radar stations on the ground were not picking up any contacts, although these
    couldn''t detect beyond the horizon because of the curvature of Earth, which could
    have explained the delay.


    Another consideration was the early warning system itself, which was known to
    have flaws and had been rushed into service in the first place. Petrov weighed
    all these factors and decided to rule the alert as a false alarm.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Although Petrov did not have his finger on the nuke button as such, had he
    passed on a recommendation to his superiors that they take the attack as real,
    it could have led to all-out nuclear war. Whether based on experience, intuition,
    or just luck, Petrov''s decision was the right one.

    It was later determined that the early detection software had picked up the sun''s
    reflection from the top of clouds and misinterpreted it as missile launches.


    # Famous Encryption Bugs


    To fix a warning issued by Valgrind, a developer of Debian patched up OpenSSL
    and, in the process, broke the random number generator. This patch was uploaded
    in September 2006 and made its way into the official release. However it was not
    reported until April 2008. Every key generated with the broken version is compromised
    (you see the "random") numbers were easily predictable, as is all data encrypted
    with it. This threatened many applications that rely on encryption such as SIME,
    Tor, SSL or TLS protected connections and SSH.


    Heartbleed, an OpenSSL vulnerability was introduced in 2012 and eventually disclosed
    in April 2014, removed confidentiality from affected services, causing among things
    the shutdown of the Canada Revenue Agency''s public access to the online filing
    portion of its website following the theft of social insurance numbers.


    The Apple Computer "goto fail" bug was simply a duplicated line of code which
    caused a public key certificate check to pass a test incorrectly.


    So, while most software bugs are annoying and short-lived others can have very
    large and serious repercussions on human life. Not only have software bugs caused
    death and severe injury in the most extreme cases they have also allowed security
    breaches to bank systems and government systems. No one knows how much money has
    been stolen by exploiting these glitches, but the total probably runs into trillions.


    Therefore, software testing is very important; in fact, it is very, very important.
    As a result, good, good, motivated and highly trained software QA''s are also
    a very important part of the software development team. In many'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'software developments companies, the QA used to be someone from the administration
    or the post room who was not very busy that week, thankfully most of the software
    companies who used this strategy have either gone out of business or have changed
    their methods. In these more advanced and enlightened times, QA’s are usually
    held in more esteem.


    So, what is a bug? It is a defect, in code, software or documentation that can
    cause the same artefact to perform its required function. When executed such a
    defect could cause the software to fail with unexpected and potentially dangerous
    results. Also, of course, these defects can nearly always be traced back to human
    error.


    This could be an error in design or code or testing or even in hardware specification,
    for example, if the server does not have enough resources to handle the work put
    through it then is unspecified, a human error. No matter what the root cause was
    and what type of human error caused it the outcome will always be called computer
    error by the press and the company who released the software.


    So, what is the role of testing in software development, maintenance and operations?
    The role of the QA is to improve the quality of the software under test by finding
    defects and logic issues that can be corrected. These corrections are then tested
    to confirm the risk of operational problems has been reduced and the quality of
    the software has therefore increased. The location and correction of bugs will
    increase confidence in the software and helps the software company meet contractual,
    legal requirements and any industry-specific standards.


    Testing is part of quality assurance; it can help measure the quality of the software
    and determine if it is fit for purpose. Metrics are available for reporting if
    all bugs are recorded by their type, severity and priority. These metrics can
    help identify useful trends and highlight any potential weak points within the
    team. The life cycle of each bug is also captured from creation to resolution,
    this builds confidence in the process and lessons learnt can help improve the
    quality of the processes used in design, development and testing.


    The quality of testing is also important, a common mistake is to assume that'
  merge: -1
  pgno: 18
- img_proc: true
  md: "if no bugs are found then no bugs exist within the software under test. It\
    \ is also very possible that the bugs exist, and they have simply not been found\
    \ yet because the scope of testing is too narrow and not all available logic paths\
    \ have been checked.\n\nOne thing is certain, though; if you do not find them\
    \ during testing the endusers or customers will find them when they are using\
    \ the system on live data and the implications can be very serious indeed. Therefore,\
    \ experienced and competent QA’s are a vital part of the team.\n\nThey know what\
    \ questions to ask, where to look, what boundaries to probe and how to test. Because\
    \ of their knowledge, they are also able to teach the less experienced and new\
    \ QA’s and they should always be present at important development meetings. Development\
    \ meetings are a vital part of the development lifecycle. All interested parties\
    \ should be present including the complete development team, which includes all\
    \ the QA’s.\n\nAn important topic during these meetings is how much testing is\
    \ required to mark the product as done, for purpose and safe. There is no simple\
    \ answer to this question, but a vital consideration is what risks are involved.\
    \ As already seen some systems have risks involving human life, others have financial\
    \ and security risks, others have much lower risks, however, a risk is a risk\
    \ and they should always be considered.\nSo, how much testing should be considered\
    \ enough?\n\n+   * It depends on the risks that have been identified for the system\n\
    \  * This includes technical and business risks\n  * Human and other animal health\
    \ risks\n  * Financial risks\n  * Customer confidence risks.\n\n+   * It also\
    \ depends on project constraints\n  * Time\n  * Budget"
