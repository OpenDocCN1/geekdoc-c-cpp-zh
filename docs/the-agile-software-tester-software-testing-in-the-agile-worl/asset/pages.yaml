    # Decision Table Testing methods are a very effective way to capture system requirements
    that contain logical conditions (e.g., True or False), and to document internal
    system design. They can also be used to record complex business rules that a system
    has to implement. When creating decision table rules, the specification is analysed,
    and conditions and actions that the system must meet are identified. The input
    conditions and actions are most often stated in such a way that they be true or
    false. The decision table contains the triggering conditions, often combinations
    of true and false for all input conditions, and the resulting actions for each
    combination of conditions. Each column of the table corresponds to a business
    rule that defines a unique combination of conditions and which result in the execution
    of the actions associated with that rule. The coverage standard commonly used
    in decision table testing is to have at least one test per column in the table,
    which typically involves covering all combinations of triggering conditions.


    ![](img/9ad62c521b3df94dc74d517230e21e72_34_1.png)


