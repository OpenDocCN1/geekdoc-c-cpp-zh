- img_proc: true
  md: '+   * Manpower


    Therefore, testing is necessary because the software under development is likely
    to have defects during the early stages of the development cycle. Testing the
    software not only helps locate these bugs but it also helps build a good level
    of confidence in the reliability of the system. Reducing the number of bugs also
    reduces the risk and helps to avoid the development company from facing litigation,
    monetary loss and ultimately going out of business.


    However, resources are always finite, and time is always at a premium, therefore
    risk must be identified and prioritised as early as possible. The only way to
    do this is through teamwork, regular meetings and feedback from all parties including
    the stakeholders. These meetings are discussed in more detail later in the book.
    This enables the team to determine what to test first what to test most thoroughly
    to each item i.e. where to place emphasis and what not to test (this time).


    # Eight important principles of software testing to be considered


    +   * Software testing will show the presence of defects.


    +   * Exhaustive testing is impossible, there is not enough time left in the universe.


    +   * Testing reduces the probability of undiscovered defects remaining in the
    software but finding defects is not proof of overall correctness


    +   * Testing everything (all combinations of inputs and preconditions and all
    logic paths) is simply not feasible. Instead, risk analysis and priorities should
    be used to focus testing efforts in specific areas


    +   * To find defects early, testing activities should be started as early as
    possible in the software or system development life cycle and should be focused
    on defined objectives.


    +   * If the same tests are repeated, they will no longer find any new defects.
    To overcome this, the existing test cases will need to be reviewed and revised,
    to exercise various parts of the software.


    +   * Testing effort should be focused proportionally to the expected and later
    observed'
