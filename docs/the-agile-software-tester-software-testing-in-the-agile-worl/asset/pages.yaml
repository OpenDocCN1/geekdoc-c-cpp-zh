    1990: Rapid Application Development (RAD) is documented by James Martin.


    1995: Ken Schwab and Jeff Sutherland present a paper on Scrum at the OOPSLA (Object-Oriented
    Programming Systems, Languages and Applications conference).


    1999: Kent Beck publishes Extreme Programming (XP) Explained, a very good book
    that everyone should read.


    2001: The Agile Manifesto is created, read on for more information.


    February of 2001 is now a pivotal date in the history of agile. On this date,
    a group of highly ambitious and talented developers who shared a joint interest
    in advancing lightweight development methodologies got together to discuss their
    views and try to forge some common ground.


    From this get together the concept of agile was born. The developers who created
    agile all understood the importance of creating a software development model in
    which each iteration in the development cycle would learn from the previous iteration.
    The result was a methodology that was more flexible, efficient, and team-oriented
    than any of the previous models.


