  md: '# # Planning Poker


    ![](img/9ad62c521b3df94dc74d517230e21e72_91_0.png)


    As you refine your requirements, you will also need to refine your estimates also.
    Planning Poker is a technique to determine user story size and build consensus
    with the development team members. Planning poker is a very popular and straightforward
    approach to estimating story size.


    To play playing poker you need a deck of cards with point values on them. There
    are plenty of poker tools and mobile apps that are free to use, or you can do
    it yourself with index cards. The numbers on the cards are usually from the Fibonacci
    sequence.


    Only the development team plays estimation poker. The team leader and product
    owner do not get a deck and do not provide estimates. However, the team leader
    can act as a facilitator and the product owner usually reads the user stories
    as well as providing detailed information on the stories.


    In practice, one team’s three-point size estimate for a work item may correlate
    to another team''s two-point estimate for an identical work item. Teams need only
    agree on what size and complexity correspond to what point count and remain internally
    consistent in their use. These points are used to help estimate the team’s velocity
    or work output.'
