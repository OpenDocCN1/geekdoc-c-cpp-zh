  md: '# Acceptance testing (also known as User Acceptance


    Testing - UAT is a formal type of software testing that is performed by the end-user
    when the features have been delivered by developers, it is usually the last formal
    test level in a release cycle. This type of testing aims to evaluate the system''s
    compliance with the business requirements and access whether it is acceptable
    for delivery. Finding defects is not the focus of acceptance testing. In some
    organisations, this is also known as Beta Testing. Acceptance tests are normally
    documented at the beginning of the sprint (in agile) and are a means for business
    QA and developers to work towards a common understanding and shared business domain
    knowledge.


    Acceptance testing may occur at various times in the lifecycle, for example:


    +   * A COTS (Commercial off the shelf) software product may be acceptance tested
    when it is installed or integrated.

    * Acceptance testing of the usability of a component may be done during component
    testing.

    * Acceptance testing of a new functional enhancement may come before system testing.


    Accessibility Testing is designed to ensure the contents of the website can be
    easily accessed by disabled people. Accessibility testing is very similar to usability
    testing, in that it is about making sure that the website or application under
    test is easy for its intended audience to use. That audience includes users who
    access the service via a range of assistive'
