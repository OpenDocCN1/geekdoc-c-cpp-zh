  md: '# Condition Coverage Testing is a testing technique used during unit testing,
    where a developer tests for all the condition statements like if, if-else, case
    etc, in the code being unit tested.


    # Decision Coverage Testing is a testing technique that is used in Unit testing.
    The objective of decision coverage testing is to expertise and validate each decision
    made in the code e.g. if, if-else, case statements. The decision testing technique
    derives test cases to execute specific decision outcomes. Branches originate from
    decision points in the code and show the transfer of control to different locations
    in the code. Decision testing is a form of control flow testing as it follows
    a specific flow of control through the decision points. Decision coverage is stronger
    than statement coverage; 100% decision coverage guarantees 100% statement coverage,
    but not vice versa.


    # Structural Testing is the testing of the structure of the system or component.
    In structural testing, the QA''s are required to know the internal implementations
    of the code. Here the QA''s require knowledge of how the software is implemented,
    how it works. During structural testing, the tester is concentrating on how the
    software does it. For example, a structural technique wants to know how loops
    in the software are working. Different test cases may be derived to exercise the
    loop once, twice, and many times. This may be done regardless of the functionality
    of the software.


    Structural testing can be used at all levels of testing. Programmers use'
  merge: -1
